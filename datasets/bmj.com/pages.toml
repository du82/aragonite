title = "Uncertainty of risk estimates from clinical prediction models: rationale, challenges, and approaches | The BMJ"
description = """
Clinical prediction models estimate an individual’s risk (probability) of a health related outcome to help guide patient counselling and clinical decision making. Most models provide a single point estimate of risk but without the associated uncertainty. Riley and colleagues argue that this needs to change, as understanding uncertainty of risk estimates helps to inform critical evaluation of a model and may impact shared decision making. Examples are provided to illustrate uncertainty in risk estimates, and key methods to quantify and present uncertainty are discussed.

Each year, thousands of clinical prediction models are published in the medical literature aiming to inform diagnosis or prognosis in a particular target population.1 They are used to estimate an individual’s risk (probability) of having (diagnosis) or developing (prognosis) a health related outcome conditional on their values of multiple predictors, to help guide patient counselling and clinical decision making. Examples include QRISK3,2 which is widely used in the UK during primary care consultations to estimate a person’s 10 year cardiovascular disease risk, to inform lifestyle changes or statin prescribing in people deemed to be at high risk; and the IMPACT and CRASH tools that estimate a patient’s risk of mortality and other adverse outcomes following hospital admission for a traumatic brain injury.34 For example, figure 1 shows an application of the CRASH tool to a hypothetical 54-year-old. Based on the individual’s particular characteristics (predictor values), the model’s point estimate (best guess) of their risk of an unfavourable outcome by six months is 0.59. This value is presented as 59% because some researchers convert risks (probabilities) on the 0 to 1 scale to percentages on the 0 to 100 scale for dissemination purposes; in this article, we prefer to use the 0 to 1 scale. We also use the terms risk and probability …"""
full_description = "Research Methods & Reporting Uncertainty of risk estimates from clinical prediction models: rationale, challenges, and approaches BMJ 2025; 388 doi: https://doi.org/10.1136/bmj-2024-080749 (Published 13 February 2025) Cite this as: BMJ 2025;388:e080749 Article Related content Metrics Responses Peer review Richard D Riley, professor1 2, Gary S Collins, professor3, Laura Kirton, senior biostatistician4, Kym IE Snell, associate professor1 2, Joie Ensor, associate professor1 2, Rebecca Whittle, research fellow1 2, Paula Dhiman, senior researcher,3, Maarten van Smeden, associate professor5, Xiaoxuan Liu, associate professor2, Joseph Alderman, clinical research fellow2 6, Krishnarajah Nirantharakumar, professor1 2, Jay Manson-Whitton, undergraduate student7, Andrew J Westwood, head of finance and resources8, Jean-Baptiste Cazier, professor9, Karel G M Moons, professor5, Glen P Martin, senior lecturer10, Matthew Sperrin, senior lecturer10, Alastair K Denniston, professor2, Frank E Harrell Jr, professor11, Lucinda Archer, assistant professor1 21Department of Applied Health Sciences, School of Health Sciences, College of Medicine and Health, University of Birmingham, Birmingham, UK2National Institute for Health and Care Research (NIHR), Birmingham Biomedical Research Centre, Birmingham, UK3Centre for Statistics in Medicine, Nuffield Department of Orthopaedics, Rheumatology and Musculoskeletal Sciences, University of Oxford, Oxford, UK4Cancer Research UK Clinical Trials Unit, School of Medical Sciences, College of Medicine and Health, University of Birmingham, Birmingham, UK5Julius Center for Health Sciences and Primary Care, University Medical Centre Utrecht, Utrecht University, Utrecht, Netherlands6Department of Inflammation and Ageing, School of Infection, Inflammation and Immunology, College of Medicine and Health, University of Birmingham, Birmingham, UK7Peterhouse, Trumpington Street, University of Cambridge, Cambridge, UK8Bone Cancer Research Trust, Leeds, UK9Francis Crick Institute, London, UK10Division of Informatics, Imaging and Data Science, Faculty of Biology, Medicine and Health, University of Manchester, Manchester Academic Health Science Centre, Manchester, UK11Department of Biostatistics, Vanderbilt University School of Medicine, Nashville, TN, USACorrespondence to: R D Riley r.d.riley{at}bham.ac.uk (@Richard_D_Riley on X)Accepted 28 November 2024Clinical prediction models estimate an individual’s risk (probability) of a health related outcome to help guide patient counselling and clinical decision making. Most models provide a single point estimate of risk but without the associated uncertainty. Riley and colleagues argue that this needs to change, as understanding uncertainty of risk estimates helps to inform critical evaluation of a model and may impact shared decision making. Examples are provided to illustrate uncertainty in risk estimates, and key methods to quantify and present uncertainty are discussed.IntroductionEach year, thousands of clinical prediction models are published in the medical literature aiming to inform diagnosis or prognosis in a particular target population.1 They are used to estimate an individual’s risk (probability) of having (diagnosis) or developing (prognosis) a health related outcome conditional on their values of multiple predictors, to help guide patient counselling and clinical decision making. Examples include QRISK3,2 which is widely used in the UK during primary care consultations to estimate a person’s 10 year cardiovascular disease risk, to inform lifestyle changes or statin prescribing in people deemed to be at high risk; and the IMPACT and CRASH tools that estimate a patient’s risk of mortality and other adverse outcomes following hospital admission for a traumatic brain injury.34 For example, figure 1 shows an application of the CRASH tool to a hypothetical 54-year-old. Based on the individual’s particular characteristics (predictor values), the model’s point estimate (best guess) of their risk of an unfavourable outcome by six months is 0.59. This value is presented as 59% because some researchers convert risks (probabilities) on the 0 to 1 scale to percentages on the 0 to 100 scale for dissemination purposes; in this article, we prefer to use the 0 to 1 scale. We also use the terms risk and probability interchangeably.Fig 1 A screenshot of the output from the webtool of the CRASH prediction model when applied to a hypothetical individual. The CRASH models are logistic regression models that estimate the risks of 14 day mortality and six month unfavourable outcome (death or severe disability) in patients with traumatic brain injury. The output includes a point estimate of risk (expressed as a %) and the corresponding 95% uncertainty interval (labelled as confidence interval (CI)) (see www.crash.lshtm.ac.uk/Risk%20calculator/index.html)Download figure Open in new tab Download powerpoint Clinical prediction models are developed using regression approaches (eg, logistic regression) or methods attributed to artificial intelligence (AI) and machine learning (eg, tree-based methods and deep learning), all of which map predictor values to clinical outcomes at the individual level. A model should be critically appraised and rigorously evaluated before being considered appropriate for use in clinical practice.567 Unfortunately, the vast majority of published models are not suitable for clinical use due to poor methodological standards such as small sample sizes,89 inappropriate model development techniques, and little (external) evaluation in new data.10 For example, a review of 606 Covid-19 prognostic models identified that 545 were at high risk of bias,11 such that their reported predictive accuracy is likely optimistic, and estimated outcome risks poorly calibrated with observed outcome risks.A key aspect of reliability is model stability12: if a different sample of the same size was used from the same overarching population, how different would the developed model and its predictions be? This issue motivates our article, and is sometimes referred to as epistemic (reducible) uncertainty and is caused by sampling variability during model development.13 To expose any instability, an indication of the uncertainty of model predictions is helpful; for example, by presenting an individual’s point estimate of risk alongside a 95% uncertainty interval (eg, corresponding to a confidence interval, following a frequentist analysis; or a credible interval or highest posterior density interval, following a Bayesian analysis) or an uncertainty distribution (eg, derived using bootstrapping in a frequentist analysis12; or the posterior distribution from a Bayesian analysis). For example, based on the CRASH model application in figure 1, a 95% uncertainty interval for this individual’s risk of an unfavourable six month outcome is 0.477 to 0.693 (presented as 47.7% to 69.3%). The range of values in the interval are all consistent with the individual having a high risk of an unfavourable outcome by six months. However, if the interval covers a wide range of risks (eg, 0.081 to 0.891), whether the model provides sufficiently precise information to inform clinical decisions for that individual might be in doubt.Much inconsistency and debate surround whether uncertainty in risk estimates should be presented and how this can be done in practice.14 Some people argue in favour of presenting uncertainty,1516 others argue against,1718 but generally, uncertainty around risk estimates is ignored. For example, IMPACT is another prognostic model in traumatic brain injury but, unlike the CRASH tool, it does not output uncertainty intervals alongside point estimates of risk (www.tbi-impact.org/?p=impact/calc).In this article, we recommend that clinical prediction models should indicate the uncertainty of their predictions, even when single point estimates are intended to guide clinical decision making. Our focus is on models that estimate risks for individuals. We discuss reasons why quantifying and presenting uncertainty of risk estimates helps to better inform those critically appraising a model and those potentially using it, including doctors and patients. Furthermore, we show that accounting for uncertainty might even change an individual’s point estimate of risk itself. We draw on conversations from patient and public involvement and engagement (PPIE) groups, and emphasise the potential challenges of communicating and interpreting uncertainty of risk. To help researchers who are developing and evaluating prediction models, we conclude by outlining some key methods to quantify uncertainty of predictions using model development and evaluation datasets.Reasons why presenting uncertainty of risk estimates is importantWe outline five key reasons why presenting the uncertainty of risk (probability) estimates can be beneficial. The reasons are interrelated but mentioned separately to help reinforce the argument.Firstly, and fundamentally, expressing uncertainty of an individual’s outcome risk provides a more complete picture than just a point estimate, as the sampling variability (or stability1213) of a model’s prediction is shown. A point estimate of an individual’s risk is a single value (best guess); for example, an individual’s point estimate might be calculated as the average value of the model’s uncertainty distribution for their risk. However, providing the entire uncertainty distribution shows other plausible values, potentially indicating a wide range of possible risks for an individual. Sampling variability and model instability generally increase with smaller model development sample sizes (lower numbers of participants and outcome events), larger numbers of candidate predictors for inclusion in the model, and low signal to noise situations (ie, smaller R2).1219 Variability is hidden when only a point estimate of risk is reported. Figure 2 illustrates this variability for models based on simulated data,12 with the uncertainty of individual risk often spanning the entire range of 0 to 1 in smaller sample sizes. Therefore, quantifying uncertainty in model predictions provides a useful model performance metric to be presented alongside other aspects, including whether risk estimates are well calibrated in the overall population and key subgroups.20 Expressing uncertainty is consistent with other areas of medical research, for example, in randomised trials, where uncertainty of estimates are expected to be presented (eg, 95% confidence intervals around treatment effect estimates).Fig 2 1000 risk estimates (“predictions”, y axis) sampled from the uncertainty distribution for nine individuals (with true risks (P), x axis, between 0.1 and 0.9), across six different models developed in sample sizes (nD) of 50, 100, 385, 500, 1000, and 5000 participants. Each model was produced by fitting a lasso logistic regression to a different random sample of individuals simulated from the same population with a true overall risk of 0.5, considering one genuine predictor (X∼N(0,4)) and 10 noise variables (Z1,…, Z10∼N(0,1)). Figure adapted from Riley and Collins with permission.12 The smaller the sample size, the wider the uncertainty distribution, even spanning the entire range of 0 to 1 in small samples.Download figure Open in new tab Download powerpoint Secondly, understanding uncertainty of a model’s predictions may help health professionals, organisations, and policy makers to decide whether to use or endorse that model, and identify when further information or research is needed.21 That is, although a model’s point estimate of risk provides the model’s best guess to inform individual level decisions (eg, within a decision analysis framework, see supplementary material S1), the corresponding uncertainty gives insight about the strength of evidence behind the model informing that decision. Vickers and colleagues support this argument,22 noting that “decision analysis tells us which decision to make for now, but we may also want to know how much confidence we should have in that decision. If we are insufficiently confident that we are right, further research is warranted.” For example, if risk thresholds are used to guide a particular clinical action (eg, initiate treatment if an individual’s point risk estimate is ≥0.05), the proportion of an individual’s uncertainty distribution that falls on either side of the risk threshold could be calculated. If this is deemed inconclusive in the clinical context at hand (eg, the percentage below (above) is 60% (40%)), this might motivate obtaining further information to better inform the clinical action.23Thirdly, expressing the uncertainty of risk estimates from a model will inform those performing critical appraisal and quality assessment of the model. For example, peer reviewers, journal editors, systematic reviewers, regulators, and those working for bodies such as the National Institute for Health and Care Excellence (NICE) or the World Health Organization (WHO) often review the evidence about a model’s performance to judge whether they should be recommending it for publication or endorse it in clinical guidelines. If it were known that a model gives estimated probabilities with large uncertainty (eg, due to a small sample size at model development19), this model should be flagged as high risk of bias, especially if no high quality external validation studies are available. Thereby, expression of uncertainty informs completion of the Prediction model Risk Of Bias Assessment Tool (PROBAST) and helps apply the Grading of Recommendations Assessment, Development, and Evaluation (GRADE) system to prediction models.2425Fourthly, understanding uncertainty of a model’s predictions helps contribute towards assessments of whether the model may be unfair or inequitable in some subgroups.26 This assessment is important as part of a model’s fairness checks27 to assess whether the reliability (accuracy) of predictions is acceptable for all patient groups, including minoritised and underserved groups, not just in the population as a whole.28 If a model has large uncertainty of risk estimates for a particular group, then the data might not useful for that group. This issue is hidden if only point estimates of risk are provided and may lead to very uncertain (potentially misleading) risk estimates being used in some individuals. Net harm might be possible if, for example, individuals are not flagged for appropriate treatment or monitoring. Risk estimates from a model will be more uncertain for individuals who were inadequately represented in the development dataset,29 specifically individuals with less common combinations of predictor values (ie, rare characteristics).Lastly, within shared decision making, patients may ask health professionals how sure they are about the evidence (including risk estimates) being used to inform decisions. In such situations, information about unc"
