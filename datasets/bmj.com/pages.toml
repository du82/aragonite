["https://bmj.com/content/384/bmj-2023-075847"]
title = "Effect of exercise for depression: systematic review and network meta-analysis of randomised controlled trials | The BMJ"
description = """
Objective To identify the optimal dose and modality of exercise for treating major depressive disorder, compared with psychotherapy, antidepressants, and control conditions.

Design Systematic review and network meta-analysis.

Methods Screening, data extraction, coding, and risk of bias assessment were performed independently and in duplicate. Bayesian arm based, multilevel network meta-analyses were performed for the primary analyses. Quality of the evidence for each arm was graded using the confidence in network meta-analysis (CINeMA) online tool.

Data sources Cochrane Library, Medline, Embase, SPORTDiscus, and PsycINFO databases.

Eligibility criteria for selecting studies Any randomised trial with exercise arms for participants meeting clinical cut-offs for major depression.

Results 218 unique studies with a total of 495 arms and 14 170 participants were included. Compared with active controls (eg, usual care, placebo tablet), moderate reductions in depression were found for walking or jogging (n=1210, κ=51, Hedges’ g −0.62, 95% credible interval −0.80 to −0.45), yoga (n=1047, κ=33, g −0.55, −0.73 to −0.36), strength training (n=643, κ=22, g −0.49, −0.69 to −0.29), mixed aerobic exercises (n=1286, κ=51, g −0.43, −0.61 to −0.24), and tai chi or qigong (n=343, κ=12, g −0.42, −0.65 to −0.21). The effects of exercise were proportional to the intensity prescribed. Strength training and yoga appeared to be the most acceptable modalities. Results appeared robust to publication bias, but only one study met the Cochrane criteria for low risk of bias. As a result, confidence in accordance with CINeMA was low for walking or jogging and very low for other treatments.

Conclusions Exercise is an effective treatment for depression, with walking or jogging, yoga, and strength training more effective than other exercises, particularly when intense. Yoga and strength training were well tolerated compared with other treatments. Exercise appeared equally effective for people with and without comorbidities and with different baseline levels of depression. To mitigate expectancy effects, future studies could aim to blind participants and staff. These forms of exercise could be considered alongside psychotherapy and antidepressants as core treatments for depression.

Systematic review registration PROSPERO CRD42018118040."""
full_description = "Research Effect of exercise for depression: systematic review and network meta-analysis of randomised controlled trials BMJ 2024; 384 doi: https://doi.org/10.1136/bmj-2023-075847 (Published 14 February 2024) Cite this as: BMJ 2024;384:e075847 Linked Editorial Exercise for the treatment of depression Article Related content Metrics Responses Peer review This article has a correction. Please see:Effect of exercise for depression: systematic review and network meta-analysis of randomised controlled trials - May 28, 2024 Michael Noetel, senior lecturer1, Taren Sanders, senior research fellow2, Daniel Gallardo-Gómez, doctoral student3, Paul Taylor, deputy head of school4, Borja del Pozo Cruz, associate professor56, Daniel van den Hoek, senior lecturer7, Jordan J Smith, senior lecturer8, John Mahoney, senior lecturer9, Jemima Spathis, senior lecturer9, Mark Moresi, lecturer4, Rebecca Pagano, senior lecturer10, Lisa Pagano, postdoctoral fellow11, Roberta Vasconcellos, doctoral student2, Hugh Arnott, masters student2, Benjamin Varley, doctoral student12, Philip Parker, pro vice chancellor research13, Stuart Biddle, professor1415, Chris Lonsdale, deputy provost131School of Psychology, University of Queensland, St Lucia, QLD 4072, Australia2Institute for Positive Psychology and Education, Australian Catholic University, North Sydney, NSW, Australia3Department of Physical Education and Sport, University of Seville, Seville, Spain4School of Health and Behavioural Sciences, Australian Catholic University, Strathfield, NSW, Australia5Department of Clinical Biomechanics and Sports Science, University of Southern Denmark, Odense, Denmark6Biomedical Research and Innovation Institute of Cádiz (INiBICA) Research Unit, University of Cádiz, Spain7School of Health and Behavioural Sciences, University of the Sunshine Coast, Petrie, QLD, Australia8School of Education, University of Newcastle, Callaghan, NSW, Australia9School of Health and Behavioural Sciences, Australian Catholic University, Banyo, QLD, Australia10School of Education, Australian Catholic University, Strathfield, NSW, Australia11Australian Institute of Health Innovation, Macquarie University, Macquarie Park, NSW, Australia12Children’s Hospital Westmead Clinical School, University of Sydney, Westmead, NSW, Australia13Australian Catholic University, North Sydney, NSW, Australia14Centre for Health Research, University of Southern Queensland, Springfield, QLD, Australia15Faculty of Sport and Health Science, University of Jyvaskyla, Jyvaskyla, FinlandCorrespondence to: M Noetel m.noetel{at}uq.edu.au (or @mnoetel on Twitter)Accepted 15 January 2024AbstractObjective To identify the optimal dose and modality of exercise for treating major depressive disorder, compared with psychotherapy, antidepressants, and control conditions.Design Systematic review and network meta-analysis.Methods Screening, data extraction, coding, and risk of bias assessment were performed independently and in duplicate. Bayesian arm based, multilevel network meta-analyses were performed for the primary analyses. Quality of the evidence for each arm was graded using the confidence in network meta-analysis (CINeMA) online tool.Data sources Cochrane Library, Medline, Embase, SPORTDiscus, and PsycINFO databases.Eligibility criteria for selecting studies Any randomised trial with exercise arms for participants meeting clinical cut-offs for major depression.Results 218 unique studies with a total of 495 arms and 14 170 participants were included. Compared with active controls (eg, usual care, placebo tablet), moderate reductions in depression were found for walking or jogging (n=1210, κ=51, Hedges’ g −0.62, 95% credible interval −0.80 to −0.45), yoga (n=1047, κ=33, g −0.55, −0.73 to −0.36), strength training (n=643, κ=22, g −0.49, −0.69 to −0.29), mixed aerobic exercises (n=1286, κ=51, g −0.43, −0.61 to −0.24), and tai chi or qigong (n=343, κ=12, g −0.42, −0.65 to −0.21). The effects of exercise were proportional to the intensity prescribed. Strength training and yoga appeared to be the most acceptable modalities. Results appeared robust to publication bias, but only one study met the Cochrane criteria for low risk of bias. As a result, confidence in accordance with CINeMA was low for walking or jogging and very low for other treatments.Conclusions Exercise is an effective treatment for depression, with walking or jogging, yoga, and strength training more effective than other exercises, particularly when intense. Yoga and strength training were well tolerated compared with other treatments. Exercise appeared equally effective for people with and without comorbidities and with different baseline levels of depression. To mitigate expectancy effects, future studies could aim to blind participants and staff. These forms of exercise could be considered alongside psychotherapy and antidepressants as core treatments for depression.Systematic review registration PROSPERO CRD42018118040.Download figure Open in new tab Download powerpoint IntroductionMajor depressive disorder is a leading cause of disability worldwide1 and has been found to lower life satisfaction more than debt, divorce, and diabetes2 and to exacerbate comorbidities, including heart disease,3 anxiety,4 and cancer.5 Although people with major depressive disorder often respond well to drug treatments and psychotherapy,67 many are resistant to treatment.8 In addition, access to treatment for many people with depression is limited, with only 51% treatment coverage for high income countries and 20% for low and lower-middle income countries.9 More evidence based treatments are therefore needed.Exercise may be an effective complement or alternative to drugs and psychotherapy.1011121314 In addition to mental health benefits, exercise also improves a range of physical and cognitive outcomes.151617 Clinical practice guidelines in the US, UK, and Australia recommend physical activity as part of treatment for depression.18192021 But these guidelines do not provide clear, consistent recommendations about dose or exercise modality. British guidelines recommend group exercise programmes2021 and offer general recommendations to increase any form of physical activity,21 the American Psychiatric Association recommends any dose of aerobic exercise or resistance training,20 and Australian and New Zealand guidelines suggest a combination of strength and vigorous aerobic exercises, with at least two or three bouts weekly.19Authors of guidelines may find it hard to provide consistent recommendations on the basis of existing mainly pairwise meta-analyses—that is, assessing a specific modality versus a specific comparator in a distinct group of participants.121322 These meta-analyses have come under scrutiny for pooling heterogeneous treatments and heterogenous comparisons leading to ambiguous effect estimates.23 Reviews also face the opposite problem, excluding exercise treatments such as yoga, tai chi, and qigong because grouping them with strength training might be inappropriate.23 Overviews of reviews have tried to deal with this problem by combining pairwise meta-analyses on individual treatments. A recent such overview found no differences between exercise modalities.13 Comparing effect sizes between different pairwise meta-analyses can also lead to confusion because of differences in analytical methods used between meta-analysis, such as choice of a control to use as the referent. Network meta-analyses are a better way to precisely quantify differences between interventions as they simultaneously model the direct and indirect comparisons between interventions.24Network meta-analyses have been used to compare different types of psychotherapy and pharmacotherapy for depression.62526 For exercise, they have shown that dose and modality influence outcomes for cognition,16 back pain,15 and blood pressure.17 Two network meta-analyses explored the effects of exercise on depression: one among older adults27 and the other for mental health conditions.28 Because of the inclusion criteria and search strategies used, these reviews might have been under-powered to explore moderators such as dose and modality (κ=15 and κ=71, respectively). To resolve conflicting findings in existing reviews, we comprehensively searched randomised trials on exercise for depression to ensure our review was adequately powered to identify the optimal dose and modality of exercise. For example, a large overview of reviews found effects on depression to be proportional to intensity, with vigorous exercise appearing to be better,13 but a later meta-analysis found no such effects.22 We explored whether recommendations differ based on participants’ sex, age, and baseline level of depression.Given the challenges presented by behaviour change in people with depression,29 we also identified autonomy support or behaviour change techniques that might improve the effects of intervention.30 Behaviour change techniques such as self-monitoring and action planning have been shown to influence the effects of physical activity interventions in adults (>18 years)31 and older adults (>60 years)32 with differing effectiveness of techniques in different populations. We therefore tested whether any intervention components from the behaviour change technique taxonomy were associated with higher or lower intervention effects.30 Other meta-analyses found that physical activity interventions work better when they provide people with autonomy (eg, choices, invitational language).33 Autonomy is not well captured in the taxonomy for behaviour change technique. We therefore tested whether effects were stronger in studies that provided more autonomy support to patients. Finally, to understand the mechanism of intervention effects, such as self-confidence, affect, and physical fitness, we collated all studies that conducted formal mediation analyses.MethodsOur findings are presented according to the Preferred Reporting Items for Systematic Reviews and Meta-Analyses-Network Meta-analyses (PRISMA-NMA) guidelines (see supplementary file, section S0; all supplementary files, data, and code are also available at https://osf.io/nzw6u/).34 We amended our analysis strategy after registering our review; these changes were to better align with new norms established by the Cochrane Comparing Multiple Interventions Methods Group.35 These norms were introduced between the publication of our protocol and the preparation of this manuscript. The largest change was using the confidence in network meta-analysis (CINeMA)35 online tool instead of the Grading of Recommendations, Assessment, Development and Evaluation (GRADE) guidelines and adopting methods to facilitate assessments—for example, instead of using an omnibus test for all treatments, we assessed publication bias for each treatment compared with active controls. We also modelled acceptability (through dropout rate), which was not predefined but was adopted in response to a reviewer’s comment.Eligibility criteriaTo be eligible for inclusion, studies had to be randomised controlled trials that included exercise as a treatment for depression and included participants who met the criteria for major depressive disorder, either clinician diagnosed or identified through participant self-report as exceeding established clinical thresholds (eg, scored >13 on the Beck depression inventory-II).36 Studies could meet these criteria when all the participants had depression or when the study reported depression outcomes for a subgroup of participants with depression at the start of the study.We defined exercise as “planned, structured and repetitive bodily movement done to improve or maintain one or more components of physical fitness.”37 Unlike recent reviews,1222 we included studies with more than one exercise arm and multifaceted interventions (eg, health and exercise counselling) as long as they contained a substantial exercise component. These trials could be included because network meta-analysis methods allows for the grouping of those interventions into homogenous nodes. Unlike the most recent Cochrane review,12 we also included participants with physical comorbidities such as arthritis and participants with postpartum depression because the Diagnostic Statistical Manual of Mental Health Disorders, fifth edition, removed the postpartum onset specifier after that analysis was completed.23 Studies were excluded if interventions were shorter than one week, depression was not reported as an outcome, and data were insufficient to calculate an effect size for each arm. Any comparison condition was included, allowing us to quantify the effects against established treatments (eg, selective serotonin reuptake inhibitors (SSRIs), cognitive behavioural therapy), active control conditions (usual care, placebo tablet, stretching, educational control, and social support), or waitlist control conditions. Published and unpublished studies were included, with no restrictions on language applied.Information sourcesWe adapted the search strategy from the most recent Cochrane review,12 adding keywords for yoga, tai chi, and qigong, as they met our definition for exercise. We conducted database searches, without filters or date limits, in The Cochrane Library via CENTRAL, SPORTDiscus via Embase, and Medline, Embase, and PsycINFO via Ovid. Searches of the databases were conducted on 17 December 2018 and 7 August 2020 and last updated on 3 June 2023 (see supplementary file section S1 for full search strategies). We assessed full texts of all included studies from two systematic reviews of exercise for depression.1222Study selection and data collectionTo select studies, we removed duplicate records in Covidence38 and then screened each title and abstract independently and in duplicate. Conflicts were resolved through discussion or consultation with a third reviewer. The same methods were used for full text screening.We used the Extraction 1.0 randomised controlled trial data extraction forms in Covidence.38 Data were extracted independently and in duplicate, with conflicts resolved through discussion with a third reviewer.Data itemsFor each study, we extracted a description of the interventions, including frequency, intensity, and type and time of each exercise intervention. Using the Compendium of Physical Activities,39 we calculated the energy expenditure dose of exercise for each arm as metabolic equivalents of task (METs) min/week. Two authors evaluated each exercise intervention using the Behaviour Change Taxonomy version 130 for behaviour change techniques explicitly described in each exercise arm. They also rated the level of autonomy offered to participants, on a scale from 1 (no choice) to 10 (full autonomy). We also extracted descriptions of the other arms within the randomised trials, including other treatment or control conditions; participants’ age, sex, comorbidities, and baseline severity of depressive sympto"
