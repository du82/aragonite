["https://bmj.com/content/388/bmj-2024-079970/rr-4"]
title = "It is time for a paradigm shift for the way we analyse services for chronic pain. | The BMJ"
full_description = "Article Related content Article metrics Rapid responses Response Rapid Response: It is time for a paradigm shift for the way we analyse services for chronic pain. Dear Editor, It was with great interest that we read the recent review of spinal interventions published in the BMJ [1]. This made wide ranging recommendations against the usage of such techniques. Moderate or severely disabling chronic pain is thought to affect 14% of UK adults [2]. As pain clinicians we hear detailed accounts in every clinic of the debilitating effects that chronic pain has on patients and their families. Many of us will experience this condition personally. Our understanding of chronic pain has evolved with the biopsychosocial model to reflect its complexity and is it widely acknowledged as sometimes exceedingly difficult to treat. The effects of interventional treatments, similar to other methodologies of pain treatment, are often better characterised as ‘responders’ and ‘non-responders’ compared to a mean change in pain score. Perhaps a more constructive way of looking at these treatments might be engage our efforts in trying to better identify which patient groups are most likely to benefit. Pain management services combine different approaches with psychology, physiotherapy input, medication optimisation, education and interventional treatments. Most of these approaches are not life changing for most of our patients, however the strength of such services is through being able to combine these treatments. In other settings such as critical care or enhanced recovery programs after surgery, interventions are combined together as care bundles which allows the combination of techniques to produce clinically relevant benefits. Removing individual parts of such combinations that might not stand up to scrutiny in isolation undermines the underlying principle. The comparison in the review article to sham procedures is misleading, as the placebo response is well recognised across medicine, and remains important. A better comparator to the effects of the input of pain management services might be a primary care appointment where it is explained to the patient that nothing can be done for them. None of the study authors are from the UK and although the study is published in the British Medical Journal, it is difficult to see how the way that interventions are used in the UK system has been considered. The motivations of pain physicians are also questioned. The comment that clinicians are likely to be influenced by the tariff paid for procedures does demonstrate a lack of applicability of the recommendations to the UK healthcare system, as NHS physicians are unlikely to be influenced by such factors. Persistent pain is a challenging and complex problem which causes significant suffering and will impact most of us personally, as well as our patients. Its treatment is an under resourced area. We should consider very carefully how to use the few treatments we have available as the implications of recommendations will be widely and deeply felt. Further work is recommended to identify how to use these treatments better. 1. Busse J W, Genevay S, Agarwal A, Standaert C J, Carneiro K, Friedrich J et al. Commonly used interventional procedures for non-cancer chronic spine pain: a clinical practice guideline BMJ 2025; 388 :e079970 doi:10.1136/bmj-2024-079970 2. Fayaz A, Croft P, Langford RM, et al Prevalence of chronic pain in the UK: a systematic review and meta-analysis of population studies BMJ Open 2016;6:e010364. doi: 10.1136/bmjopen-2015-010364 Competing interests: No competing interests 04 March 2025 David P Radley Consultant Anaesthetist Dr Charlotte Small (Consultant Anaesthetist, Department of Anaesthesia, Hereford County Hospital), Mary Yoxall (Specialist Physiotherapist, Pain Management Service, Hereford County Hospital) Wye Valley NHS Trust Department of Anaesthesia, Hereford County Hospital googletag.cmd.push(function() { googletag.