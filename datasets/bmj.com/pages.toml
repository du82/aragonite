ates of malnutrition (such as in humanitarian emergencies).24 In most countries, including the UK, measles is a notifiable disease.EpidemiologyMeasles vaccination is estimated to have prevented 57 million deaths worldwide between 2000 and 2020, but missed measles vaccinations and decreased surveillance during the covid-19 pandemic led to an 18% increase in measles cases and a 43% rise in measles related deaths globally in 2022 compared with 2021.5 Approximately 1.2 million children in Europe missed their measles vaccine during the pandemic, which, combined with the end of covid-19 public health measures, led to a 30-fold rise in measles cases in … View Full Text Log in Log in using your username and password BMA Member Log In If you have a subscription to The BMJ, log in: Username * Password * Forgot your log in details? Need to activate Log in via institution Log in via OpenAthens Log in through your institution Subscribe from £184 * Subscribe and get access to all BMJ articles, and much more. Subscribe* For online subscription Access this article for 1 day for:£50 / $60/ €56 (excludes VAT) You can download a PDF version for your personal record. Buy this article"
