title = "Discrepancies in neglected tropical diseases burden estimates in China: comparative study of real-world data and Global Burden of Disease 2021 data (2004-2020) | The BMJ"
description = """
Objectives To assess the discrepancies between real-world data and the Global Burden of Disease (GBD) 2021 estimates for six neglected tropical diseases in China. Additionally, to evaluate the applicability of the GBD model within the Chinese context and to assess the effectiveness of China's historical prevention and control policies for neglected tropical diseases.

Design Comparative study of real-world data and GBD 2021 (2004-2020).

Main outcome measures Disability adjusted life years (DALYs).

Methods DALYs based on reported data for leprosy, echinococcosis, schistosomiasis, visceral leishmaniasis, dengue, and rabies from 2004 to 2020 were compared with the estimated DALYs from the GBD 2021 database. Additionally, we combined and analysed China's historical policies on prevention and control of neglected tropical diseases with real-world DALYs.

Data sources Reported data were sourced from the Chinese Center for Disease Control and Prevention’s China Public Health Science data centre and related reports. Data for GBD 2021 and GBD 2019 were obtained from GBD databases. These data included all of China’s 31 provinces (including autonomous regions and municipalities) and the Xinjiang Production and Construction Corps.

Results The total real-world DALYs based on reported data of six neglected tropical diseases decreased from 260 000 person years in 2004 to 19 000 person years in 2020, with a 93% (241 000/260 000 person years) reduction. The 17 year average real-world DALYs from 2004 to 2020 versus the GBD 2021 estimates for the same period were 42 v 500 for leprosy, 960 v 11 000 for echinococcosis, 64 000 v 98 000 for schistosomiasis, 56 v 16 000 for visceral leishmaniasis, 190 v 780 for dengue, and 47 000 v 67 000 for rabies. The ratios of the GBD estimates to the real-world DALYs for the six neglected tropical diseases were 17 for leprosy, 11 for echinococcosis, 1.5 for schistosomiasis, 280 for visceral leishmaniasis, 4.2 for dengue, and 1.4 for rabies.

Conclusions The findings indicate that reliance solely on global estimates, such as those of the GBD, may not sufficiently capture the dynamics of neglected tropical diseases in China. Integrating local epidemiological data into global health assessments is crucial to develop accurate and effective public health policies. This study highlights the importance of continuously updating and improving data collection and surveillance methods to adapt public health strategies to evolving disease patterns.

Data analysed were based on published data. All the original data for the six diseases in this study has been made available at <https://github.com/Leewudi/China-CDC-raw-data>. The code for data visualisation of this study is available from the corresponding author on reasonable request."""
full_description = "Research Discrepancies in neglected tropical diseases burden estimates in China: comparative study of real-world data and Global Burden of Disease 2021 data (2004-2020) BMJ 2025; 388 doi: https://doi.org/10.1136/bmj-2024-080969 (Published 18 February 2025) Cite this as: BMJ 2025;388:e080969 Linked Editorial Neglected tropical diseases in China Article Related content Metrics Responses Peer review Guo-Jing Yang, professor1, Han-Qi Ouyang, master student1, Zi-Yu Zhao, master student1, Wei-Hao Li, master student1, Ibrahima Socé Fall, epidemiologist2, Amadou Garba Djirmay, epidemiologist2, Xiao-Nong Zhou, professor3 41NHC Key Laboratory of Tropical Disease Control, School of Tropical Medicine, Hainan Medical University, Haikou, Hainan, China2Global NTD programme, WHO, Geneva, Switzerland3National Institute of Parasitic Diseases at Chinese Center for Disease Control and Prevention, Chinese Center for Tropical Research, NHC Key Laboratory on Parasite and Vector Biology, Shanghai, China4One Health Center, Shanghai Jiao Tong University- University of Edinburgh/School of Global Health, Chinese Center for Tropical Research, Shanghai Jiao Tong University School of Medicine, Shanghai, ChinaCorrespondence to: G-J Yang guojingyang{at}hotmail.comAccepted 11 January 2025AbstractObjectives To assess the discrepancies between real-world data and the Global Burden of Disease (GBD) 2021 estimates for six neglected tropical diseases in China. Additionally, to evaluate the applicability of the GBD model within the Chinese context and to assess the effectiveness of China's historical prevention and control policies for neglected tropical diseases.Design Comparative study of real-world data and GBD 2021 (2004-2020).Main outcome measures Disability adjusted life years (DALYs).Methods DALYs based on reported data for leprosy, echinococcosis, schistosomiasis, visceral leishmaniasis, dengue, and rabies from 2004 to 2020 were compared with the estimated DALYs from the GBD 2021 database. Additionally, we combined and analysed China's historical policies on prevention and control of neglected tropical diseases with real-world DALYs.Data sources Reported data were sourced from the Chinese Center for Disease Control and Prevention’s China Public Health Science data centre and related reports. Data for GBD 2021 and GBD 2019 were obtained from GBD databases. These data included all of China’s 31 provinces (including autonomous regions and municipalities) and the Xinjiang Production and Construction Corps.Results The total real-world DALYs based on reported data of six neglected tropical diseases decreased from 260 000 person years in 2004 to 19 000 person years in 2020, with a 93% (241 000/260 000 person years) reduction. The 17 year average real-world DALYs from 2004 to 2020 versus the GBD 2021 estimates for the same period were 42 v 500 for leprosy, 960 v 11 000 for echinococcosis, 64 000 v 98 000 for schistosomiasis, 56 v 16 000 for visceral leishmaniasis, 190 v 780 for dengue, and 47 000 v 67 000 for rabies. The ratios of the GBD estimates to the real-world DALYs for the six neglected tropical diseases were 17 for leprosy, 11 for echinococcosis, 1.5 for schistosomiasis, 280 for visceral leishmaniasis, 4.2 for dengue, and 1.4 for rabies.Conclusions The findings indicate that reliance solely on global estimates, such as those of the GBD, may not sufficiently capture the dynamics of neglected tropical diseases in China. Integrating local epidemiological data into global health assessments is crucial to develop accurate and effective public health policies. This study highlights the importance of continuously updating and improving data collection and surveillance methods to adapt public health strategies to evolving disease patterns.IntroductionAs global attention towards neglected tropical diseases (NTDs) intensifies, the spectrum of diseases in this classification has expanded from 17 in 2010 to 21 in 2023.1 In 2020, the World Health Organization (WHO) unveiled its most recent NTDs roadmap, articulating clear targets for the control, elimination, or eradication of selected diseases by 2030.2 Tracking progress towards the targets requires a quantitative basis, and disability adjusted life years (DALYs) is a key metric for understanding and evaluating the overall disease burden of NTDs.3 Unlike incidence, prevalence, or mortality, which each focus on specific aspects of a disease's impact, DALYs combine both years of life lost due to premature mortality and years lived with disability. This dual approach allows for a holistic comparison,4 and a more nuanced assessment of the total disease burden, which is particularly valuable for informing public health priorities and resource allocation.5 Since 1990, the Global Burden of Diseases (GBD) study has been assessing the burden of diseases globally, regionally, and nationally, with periodic updates to its data and estimation methods.6 These data are widely used by countries to develop public health policies, allocate resources, and devise disease prevention strategies.7 The release of GBD 2021 features updated data based on the latest scientific evidence and methods.8 However, studies using the GBD 2019 database have identified certain limitations.9 For instance, GBD estimates for dengue cases greatly surpass the reported cases, with the discrepancies being most pronounced in China, where the estimates are approximately 570 times higher.10 Furthermore, the consistency between the estimates of DALY in the GBD study and the calculated values based on reported cases is unclear.In the early stages of our research into disease burden in China, we conducted searches on the China National Knowledge Infrastructure (https://www.cnki.net/) using the related keywords of “DALY,” “disease burden,” and “China” from 1 January 2019 to 20 August 2024. Among the 317 studies archived, 90% (n=284) of studies used the GBD database for their research,1112131415 and 8% (n=24) used other indicators to assess disease burden, such as incidence, prevalence, or mortality rates.161718 This research highlights that when in disease burden studies, a prevailing tendency is to rely almost exclusively on GBD data. Thus, this study intends to use China as a reference case to explore the differences in the measurement of disease burden of NTDs calculated by reported data and the GBD model. Among the 21 NTDs, leprosy, echinococcosis, schistosomiasis, visceral leishmaniasis, dengue, and rabies were designated as notifiable diseases in China, with comprehensive reporting data available from the China Public Health Science Data Centre.19 In addition, a thorough review of the six NTDs in different versions of the International Classification of Diseases (ICD)-coding system found that the classification of these six diseases were consistent in ICD-10 and ICD-11 from 2004 to 2020. The six diseases are categorised and listed alphabetically based on their infecting pathogen type as follows: bacteria (leprosy), helminths (echinococcosis and schistosomiasis), protozoa (visceral leishmaniasis), and viruses (dengue and rabies).20 Furthermore, several Chinese authors contributing to this study have devoted decades to the researches on NTDs in China, providing substantial expertise in data interpretation and quality control.2122 Consequently, these six NTDs were selected as the focus of this research.Our primary aim of this study was to evaluate the concordance between real-world DALYs estimates for six selected NTDs derived from China's reported data and those provided by the GBD model. Through this comparison, we sought to identify potential discrepancies between the two datasets, underscoring the importance of appropriately using and respecting local data rather than defaulting to the use of GBD estimates without critical consideration. By understanding these differences, we aim to evaluate the applicability of the GBD model within the context of China and assess the effectiveness of China's historical NTD prevention and control policies. We hoped that these insights would help to refine future strategies for understanding disease burden, improving evidence based decision making, and enhance the control and elimination of NTDs in China.MethodsDataFrom 1 January 2004 to 31 December 2020, data for incident cases and deaths disaggregated by age and region for leprosy, echinococcosis, visceral leishmaniasis, dengue, and rabies were retrieved from the Chinese Center for Disease Control and Prevention (CDC)’s China Public Health Science data centre.23 Prevalence data for schistosomiasis in China were obtained from the National Schistosomiasis Reports.24 Additionally, life expectancy data for China from 2004 to 2020 were sourced from the China Statistical Yearbook,25 with relevant literature referenced to determine the duration of each disease.262728 The disability weights for each disease were based on related literature and data provided by the Global Health Data Exchange.29 Estimated DALYs for these six diseases in China from 2004 to 2020 were extracted from the GBD 2019 and GBD 2021 databases and compared with the DALYs calculated via real-world data.30To identify relevant prevention and control policies, guidelines, and phased achievements for the six NTDs in China, we searched in Chinese using keywords such as “neglected tropical diseases,” “immunization,” “diagnostic criteria,” “surveillance,” “expert consensus,” “elimination,” “leprosy,” “echinococcosis,” “schistosomiasis,” “visceral leishmaniasis,” “dengue,” “rabies,” and the local phrases, dialects, and various alternative names of the six NTDs. Data were obtained from searches on the official websites of various Chinese government departments, including the China CDC, the National Health Commission of the People's Republic of China,31 the National Development and Reform Commission,32 and the State Council Policy Document Library.33 These sources provided officially published policies, guidelines, and other documents related to NTDs (in Chinese). We sourced information about milestone achievements in NTD control in China from the China National Knowledge Infrastructure database and WHO certified reports.Statistical analysesThis study uses a simplified DALY formula provided by WHO to estimate disease burden, in alignment with the formulas of the GBD study.3435 The reported cases or deaths for each disease were used to calculate years of life lost and years lived with disability, which were then summed to obtain the DALY measure. Three equations were used:(1) years of life lost=N×L;(2) years lived with disability=I×d×DW, or years lived with disability=P×DW;(3) DALYs=years of life lost+years lived with disability.Where N represents the number of deaths; L is life expectancy lost due to death; I is the number of incident cases; d is the average duration of disease; DW is the disability weight; and P is the number of prevalent cases. Leprosy, echinococcosis, visceral leishmaniasis, dengue, and rabies were calculated by I×d×DW, and schistosomiasis was calculated by P×DW. A detailed comparison was conducted between the DALYs for six NTDs calculated from real-world data and the estimates provided by GBD 2021. Additionally, DALYs estimated by GBD 2019 were compared with those from GBD 2021 to observe differences resulting from model adjustments.Data were prepared using Microsoft Excel 2021 and visualised using R 4.4.0 software.Patient involvementThis study did not include direct patient and public involvement because the data used were sourced entirely from publicly available databases and reports, with no direct interaction with individuals or patient groups. However, before the submission of the manuscript, we engaged several members of the public to review it, ensuring its clarity and relevance for a wider audience.ResultsTemporal changes in six NTDsFigure 1 illustrates the progress in controlling six NTDs in China from 2004 to 2020. The total DALYs of six NTDs decreased from 260 000 person years in 2004 to 19 000 person years in 2020, with a 93% reduction.Fig 1 Temporal changes of six neglected tropical diseases in China from 2004 to 2020, complete with related national policies, guidelines, and milestone accomplishments. Disability adjusted life years (DALYs) are shown by line chartsDownload figure Open in new tab Download powerpoint The disease burden of leprosy varied in the early years but stabilised at a low level in later years, declining from 47 person years in 2004 to 8 person years in 2020. The burden of echinococcosis fluctuated upward, increasing from 180 person years in 2004 to 1000 person years in 2020. The burden of schistosomiasis decreased substantially, from 170 000 person years in 2004 to 13 000 person years in 2020, a reduction of approximately 92% (157 000/170 000 person years). The burden of visceral leishmaniasis remained under 300 person years throughout the period. The disease burden of dengue remained at a relatively low level, with peaks observed in 2014 and 2019, reaching 1500 person years and 750 person years, respectively. The DALYs related to rabies decreased significantly, from 88 000 person years in 2004 to 4800 person years in 2020, a reduction of 83 200 person years (fig 1).Comparison of real-world data with GBD 2021 estimatesFigure 2 depicts a comparison of the real-world DALYs with the estimates from GBD 2021 for six NTDs in China, spanning from 2004 to 2020. For leprosy and echinococcosis, the real-world DALYs differ substantially from the GBD 2021 estimates, with none of the calculated values falling within the GBD 2021 uncertainty intervals throughout the study period. Regarding schistosomiasis, despite the initial alignment between the two approaches before 2013, the discrepancy between the real-world DALYs and the GBD estimates progressively widened after 2013. For visceral leishmaniasis, the GBD 2021 estimates are much higher than the real-world DALYs, and although some years fall within the GBD 2021 uncertainty intervals, the intervals are notably wide. For dengue, the two approaches differ markedly; notably, the GBD 2021 data did not capture the epidemic peaks observed in 2014 and 2019, which were evident in the real-world burden. In the case of rabies, despite the similarity in transmission patterns between the real-world DALYs and the GBD 2021 estimates, only the years 2004, 2006, and 2007 fall within the GBD 2021 uncertainty intervals. Detailed outcomes can be found in supplementary table S1.Fig 2 Comparison of real-world disability adjusted life years (DALYs) with Global Burden of Disease (GBD) 2021 estimates for six neglected tropical diseases in China from 2004 to 2020. Error bars indicate the 95% uncertainty intervals of the GBD 2021 estimates of the neglected tropical diseasesDownload figure Open in new tab Download powerpoint Figure 3 presents the ratios of the GBD 2021 estimates to real-world data for six NTDs in China from 2004 to 2020. The rea"
