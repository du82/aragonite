["https://bmj.com/content/388/bmj-2024-080881"]
title = "Plain versus drug balloon and stenting in severe ischaemia of the leg (BASIL-3): open label, three arm, randomised, multicentre, phase 3 trial | The BMJ"
description = """
Objective To determine which primary endovascular revascularisation strategy represents the most clinically effective treatment for patients with chronic limb threatening ischaemia who require endovascular femoro-popliteal, with or without infra-popliteal, revascularisation.

Design Three arm, open label, pragmatic, multicentre, randomised, phase 3 superiority trial (BASIL-3).

Setting 35 UK NHS vascular units.

Participants Patients with chronic limb threatening ischaemia who required endovascular femoro-popliteal, with or without infra-popliteal, revascularisation.

Interventions Participants were randomly assigned (1:1:1) to femoro-popliteal plain balloon angioplasty with or without bare metal stenting (PBA±BMS), drug coated balloon angioplasty with or without bare metal stenting (DCBA±BMS), or drug eluting stenting (DES) as their first revascularisation strategy.

Main outcome measures The primary outcome was amputation free survival defined as time to first major amputation or death from any cause. Secondary outcomes included the composite components of the primary outcome, major adverse limb events, major adverse cardiac events, and other prespecified clinical and patient reported outcome measures. Serious adverse events were collected up to 30 days after the first revascularisation procedure.

Results Between 29 January 2016 and 31 August 2021, 481 participants were randomised (167 (35%) women, mean age 71.8 years (standard deviation 10.8)). Major amputation or death occurred in 106 of 160 (66%) participants in the PBA±BMS group, 97 of 161 (60%) in the DCBA±BMS group, and 93 of 159 (58%) in the DES group (adjusted hazard ratios: PBA±BMS v DCBA±BMS: 0.84, 97.5% confidence interval 0.61 to 1.16, P=0.22; PBA±BMS v DES: 0.83, 0.60 to 1.15, P=0.20). No differences in serious adverse events were reported between the groups.

Conclusions Neither DCBA±BMS nor DES conferred significant clinical benefit over PBA±BMS in the femoro-popliteal segment in patients with chronic limb threatening ischaemia undergoing endovascular femoro-popliteal, with or without infra-popliteal, revascularisation.

Trial registration ISRCTN registry ISRCTN14469736

Requests for data should be directed to the corresponding author. Participant level data will be made available within six months of publication. Requests will be assessed for scientific rigour before being granted. Data will be anonymised and securely transferred. A data sharing agreement might be required."""
full_description = "Research Plain versus drug balloon and stenting in severe ischaemia of the leg (BASIL-3): open label, three arm, randomised, multicentre, phase 3 trial BMJ 2025; 388 doi: https://doi.org/10.1136/bmj-2024-080881 (Published 24 February 2025) Cite this as: BMJ 2025;388:e080881 Article Related content Metrics Responses Peer review Andrew W Bradbury, Sampson Gamgee professor(emeritus) of vascular surgery1, Jack A Hall, statistician2, Matthew A Popplewell, consultant vascular surgeon and assistant professor of vascular surgery34, Lewis Meecham, consultant vascular surgeon5, Gareth R Bate, senior research nurse6, Lisa Kelly, senior research nurse6, Jon J Deeks, professor of biostatistics247, Catherine A Moakes, senior statistician2 on behalf of the BASIL-3 Investigators1University of Birmingham, Birmingham, UK2Birmingham Clinical Trials Unit, School of Health Sciences, University of Birmingham, Birmingham, UK3Black Country Vascular Network, Dudley, UK4Department of Applied Health Sciences, University of Birmingham, Birmingham, UK5University Hospital of Wales, Cardiff, UK6University Hospitals Birmingham NHS Foundation Trust, Birmingham, UK7NIHR Birmingham Biomedical Research Centre, Birmingham, UKCorrespondence to: M A Popplewell m.a.popplewell{at}bham.ac.uk (@MAPopplewell on X)Accepted 23 January 2025AbstractObjective To determine which primary endovascular revascularisation strategy represents the most clinically effective treatment for patients with chronic limb threatening ischaemia who require endovascular femoro-popliteal, with or without infra-popliteal, revascularisation.Design Three arm, open label, pragmatic, multicentre, randomised, phase 3 superiority trial (BASIL-3).Setting 35 UK NHS vascular units.Participants Patients with chronic limb threatening ischaemia who required endovascular femoro-popliteal, with or without infra-popliteal, revascularisation.Interventions Participants were randomly assigned (1:1:1) to femoro-popliteal plain balloon angioplasty with or without bare metal stenting (PBA±BMS), drug coated balloon angioplasty with or without bare metal stenting (DCBA±BMS), or drug eluting stenting (DES) as their first revascularisation strategy.Main outcome measures The primary outcome was amputation free survival defined as time to first major amputation or death from any cause. Secondary outcomes included the composite components of the primary outcome, major adverse limb events, major adverse cardiac events, and other prespecified clinical and patient reported outcome measures. Serious adverse events were collected up to 30 days after the first revascularisation procedure.Results Between 29 January 2016 and 31 August 2021, 481 participants were randomised (167 (35%) women, mean age 71.8 years (standard deviation 10.8)). Major amputation or death occurred in 106 of 160 (66%) participants in the PBA±BMS group, 97 of 161 (60%) in the DCBA±BMS group, and 93 of 159 (58%) in the DES group (adjusted hazard ratios: PBA±BMS v DCBA±BMS: 0.84, 97.5% confidence interval 0.61 to 1.16, P=0.22; PBA±BMS v DES: 0.83, 0.60 to 1.15, P=0.20). No differences in serious adverse events were reported between the groups.Conclusions Neither DCBA±BMS nor DES conferred significant clinical benefit over PBA±BMS in the femoro-popliteal segment in patients with chronic limb threatening ischaemia undergoing endovascular femoro-popliteal, with or without infra-popliteal, revascularisation.Trial registration ISRCTN registry ISRCTN14469736IntroductionChronic limb threatening ischaemia is the severest form of atherosclerotic peripheral arterial disease and presents with ischaemic pain with or without tissue loss. This disease represents a growing global healthcare burden, mainly owing to tobacco smoking, diabetes mellitus, and ageing populations.1 Unless perfusion is restored, patients are at high risk of major amputation and death, and so virtually all patients should be considered for revascularisation.To date, three published, publicly funded randomised controlled trials have compared the clinical and cost effectiveness of different revascularisation strategies in chronic limb threatening ischaemia. The UK bypass versus angioplasty in severe ischaemia of the leg (BASIL) trial suggested that patients with mostly femoropopliteal disease and a life expectancy greater than two years should be offered surgical bypass in preference to plain balloon angioplasty (PBA).2 The United States best endovascular versus best surgical therapy in patients with chronic limb threatening ischaemia (BEST-CLI) trial reported that in patients with an optimal vein for vein bypass (cohort one), major adverse limb events or death were lower in the vein bypass group than in those receiving endovascular treatment for similar disease. In a second cohort of patients without an optimal vein, outcomes were similar.3 The UK BASIL-2 trial reported that, in patients requiring an infra-popliteal, with or without a femoro-popliteal, revascularisation, a best endovascular treatment strategy resulted in better amputation free survival than vein bypass, mainly because of more deaths throughout follow-up after vein bypass.4However, in patients with chronic limb threatening ischaemia selected for endovascular revascularisation in preference to surgical revascularisation, considerable uncertainty exists about the relative effectiveness of different procedures, and in particular, the role of PBA with or without bare metal stenting (BMS), drug coated balloon angioplasty (DCBA) with or without BMS, and drug eluting stenting (DES). This lack of evidence is reflected in systematic reviews, meta-analyses, and published guidelines.15 In 2012, the UK National Institute for Health and Care Excellence (NICE) recommended a randomised controlled trial to compare the clinical and cost effectiveness of PBA, BMS, DCBA, and DES in patients with chronic limb threatening ischaemia.6 This led the UK National Institute for Health and Care Research, Health Technology Assessment (NIHR HTA) programme to fund the balloon versus stenting in severe ischaemia of the leg—3 (BASIL-3) randomised controlled trial reported here. The aim of this trial was to determine which procedure resulted in better amputation free survival in patients with chronic limb threatening ischaemia who required endovascular femoro-popliteal, with or without infra-popliteal, revascularisation. Three strategies were compared: femoro-popliteal PBA±BMS, DCBA±BMS, or primary DES as the first revascularisation strategy. The BASIL-3 health economic analysis will be reported separately.Materials and methodsStudy design and participantsBASIL-3 was an open label, pragmatic, three arm, multicentre, superiority, phase 3, randomised controlled trial conducted at most (35) of the major UK NHS vascular units.7 Eligible participants were those who presented with chronic limb threatening ischaemia caused by atherosclerotic peripheral arterial disease and who, after a process of shared decision making, were offered and consented to a femoro-popliteal, with or without an infra-popliteal, endovascular revascularisation in preference to surgical revascularisation. As is standard UK practice, chronic limb threatening ischaemia was diagnosed on the basis of history and clinical examination, supported by selective use of haemodynamic testing and arterial imaging (one or more of duplex ultrasound, computed tomography angiography, magnetic resonance angiography, and digital subtraction angiography). To be randomised, a patient had to be assessed by a multidisciplinary team (including at least two vascular surgery or interventional radiology consultants), and deemed suitable for all three endovascular strategies. None of the patients randomised had undergone previous major (above the ankle) amputation of the trial leg. Patients presenting with intermittent claudication were not eligible for enrolment. None of the participants had a planned major (above ankle) amputation of the trial leg at the point of randomisation. Patients were excluded if they were expected to live for less than six months (pragmatic decision by randomising team) or had undergone an intervention to the target femoro-popliteal vessel within the past 12 months. Participants had to be able and willing to complete the health related quality of life and health economic questionnaires. Additionally, they needed to speak sufficient English (where translation facilities were insufficient) and to have capacity to provide written informed consent. The National Research Ethics Committee, North of Scotland, provided ethical approval on 26 August 2015 (15/NS/0070). Declaration of Helsinki and Good Clinical Practice guidelines were followed.Randomisation and maskingParticipants were randomly assigned (1:1:1) using a secure online system to femoro-popliteal PBA±BMS, DCBA±BMS, or DES as their first revascularisation procedure. Minimisation was used to balance assignments according to age (≤60 years, 61-70 years, 71-80 years, >80 years), sex (male, female), diabetes mellitus (yes, no), chronic kidney disease (yes, no), severity of clinical disease (ischaemic rest or night pain only, tissue loss only, both), previous (permissible) intervention to the trial leg (yes, no), target artery (superficial femoral artery only, popliteal artery only, both), intention for a hybrid (endovascular with additional surgical) procedure (yes, no), and recruiting centre. Randomisation was provided centrally by the Birmingham Clinical Trials Unit, University of Birmingham, UK. Participants, study staff, and investigators were not masked to treatment allocation.ProceduresVascular surgeons and interventional radiologists were encouraged to perform the allocated endovascular procedures using their preferred techniques and devices. Any UK licensed PBA, DCBA, BMS, or DES was permitted. The allocated intervention was to be performed within two weeks of randomisation where possible and clinically appropriate. All additional management strategies and procedures, including wound care and medical therapy, were at the discretion of the responsible clinicians and in the best interests of the patient. Participants were followed locally one month after the initial revascularisation; six, 12, and 24 months after randomisation; and then annually until the last participant had been followed for 24 months. Clinical (haemodynamic, medical treatments, clinical status) and health related quality of life data were collected during these visits. When face-to-face visits were not possible (particularly during covid-19), as much data as possible were obtained by telephone. In England and Wales, death and major amputation data were obtained until the end of follow-up from NHS Digital (the statutory custodian for health and social care data for England and Wales).OutcomesThe primary outcome was amputation free survival, defined as the time to major (above ankle) amputation of the trial leg or death from any cause (whichever occurred first, time-to-event analysis). Clinical secondary outcomes included time to death from any cause (overall survival); time to major amputation of the trial leg; further major revascularisation of the trial leg; major adverse limb events (defined as major amputation of the trial leg or additional major revascularisation of the trial leg); major adverse cardiovascular events (defined as a new chronic limb threatening ischaemia affecting the non-trial leg, major amputation of the non-trial leg, myocardial infarction, stroke, or transient ischaemic attack); 30 day (after first intervention) mortality and morbidity; relief of ischaemic pain (assessed using the visual analogue scale, the Vascular Quality of Life Questionnaire tool and opiate usage); healing of tissue loss (assessed using the perfusion, extent, depth, infection, and sensation (PEDIS), and wound, ischaemic, and foot infection (WIFi) scoring systems); and changes in ankle brachial pressure index and/or toe brachial pressure index. Health related quality of life was assessed using generic (Euroqol 5D 5L, Short Form-12, ICEpop capability measure for older people, and Hospital Anxiety and Depression Scale) and disease specific (Vascular Quality of Life Questionnaire) tools. Serious adverse events were recorded up to 30 days after the first post-randomisation revascularisation. Participants were defined as adherent to the allocated trial procedure if the first revascularisation after randomisation was endovascular, the randomised class of device was used, and the randomised device was used in the superficial femoral artery, in the popliteal artery, or in both.Statistical analysisThe original sample size was based on a time-to-event analysis making two key comparisons: PBA±BMS v DES, and PBA±BMS v DCBA±BMS. Recruitment was to take place over three years (20% year 1, 40% in years 2 and 3) with a minimum follow-up of two years in all participants. Based on the BASIL-1 trial, amputation free survival rates were assumed to be 0.70 in year 1, 0.64 in year 2, 0.52 in year 3, 0.46 in year 4, and 0.36 in year 5.8 Allowing for 5% attrition and the BASIL-1 survival estimates, 861 participants (having 342 primary outcome events) would provide 90% power to detect a reduction in amputation free survival of 40% (hazard ratio 0.60, equivalent to an absolute difference in amputation free survival of 13% at year 2, corresponding to one out of seven participants needing to benefit from DES or DCBA over PBA (number needed to treat) at the 2.5% significance level (to account for increased type I error risk associated with making two key comparisons) using the artsurv (version 1.0.7) programme in Stata (version 17.0). However, an error was identified in the implementation of the macro used to compute the original sample size, whereby a smaller effect size (than the targeted 40% relative reduction) had been applied for one of the two comparisons. This resulted in an overestimation of the sample size and number of primary outcome events needed. Using the same parameters as in the original calculation (listed above), the corrected sample size was 749 and the number of primary outcome events required was 291.Because the anticipated recruitment rates were not achieved, recruitment continued beyond year 3, and the median follow-up was longer than planned. Therefore, the number of randomised patients required to observe the target number of 291 events for 90% power was reduced. With support of the funder and independent oversight from the data monitoring committee, recruitment rates, length of follow-up, and pooled event rates over time were modelled to predict the number of participants needed to reach 291 events, with a minimum follow-up of two years. Modelling was updated approximately every six months based on emerging data. BASIL-3 closed to recruitment on 31 August 2021, with 481 participants randomised and 296 primary outcomes observed.A statistical analysis plan was specified before "
