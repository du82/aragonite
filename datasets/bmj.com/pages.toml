thetic, steroids, or their combination; joint-targeted injection of local anaesthetic, steroids, or their combination; and intramuscular injection of local anaesthetic with or without steroids. For people living with chronic radicular spine pain (≥3 months), the guideline panel issued strong recommendations against: dorsal root ganglion radiofrequency with or without epidural injection of local anaesthetic or local anaesthetic plus steroids; and epidural injection of local anaesthetic, steroids, or their combination.How this guideline was created An international guideline development panel including four people living with chronic spine pain, 10 clinicians with experience managing chronic spine pain, and eight methodologists, produced these recommendations in adherence with standards for trustworthy guidelines using the GRADE approach. The MAGIC Evidence Ecosystem Foundation provided methodological support. The guideline panel applied an individual patient perspective when formulating recommendations.The evidence These recommendations are informed by a linked systematic review and network meta-analysis of randomised trials and a systematic review of observational studies, summarising the current body of evidence for benefits and harms of common interventional procedures for axial and radicular, chronic, non-cancer spine pain. Specifically, injection of local anaesthetic, steroids, or their combination into the cervical or lumbar facet joint or sacroiliac joint; epidural injections of local anaesthetic, steroids, or their combination; radiofrequency of dorsal root ganglion; radiofrequency denervation of cervical or lumbar facet joints or the sacroiliac joint; and paravertebral intramuscular injections of local anaesthetic, steroids, or their combination.Understanding the recommendations These recommendations apply to people living with chronic spine pain (≥3 months duration) that is not associated with cancer or inflammatory arthropathy and do not apply to the management of acute spine pain. Further research is warranted and may alter recommendations in the future: in particular, whether there are differences in treatment effects based on subtypes of chronic spine pain, establishing the effectiveness of interventional procedures currently supported by low or very low certainty evidence, and effects on poorly reported patient-important outcomes (such as opioid use, return to work, and sleep quality).IntroductionSpine pain is defined as chronic when it persists for three months or longer and has resulted in pain on at least half of the days in the past six months.1 Pain may be localised to the midline (axial) or referred distally (radicular) typically because of nerve root irritation (such as sciatica). Advanced imaging is often acquired for chronic spine pain, but incidental findings are common234 and there is low correlation between pathology and symptoms.5 Most chronic spine pain cannot be attributed to a specific cause, and approximately 85% of patients present with non-specific pain.6789The global prevalence of chronic low back pain has been estimated at 4% among adults aged 24-39 years and 20% among adults aged 20-59.10 The prevalence among older adults is likely higher,11 and chronic low back pain is the leading cause of disability worldwide.12 Neck pain is another common type of chronic spinal pain, estimated as the third leading cause of years lived with disability.13 In 2016, low back and neck pain accounted for the highest healthcare spending in the US at $134.5 billion, of which 9.2% was patients’ out-of-pocket expenses.14Current practiceInterventional procedures—including paravertebral intramuscular injections, epidural injections, nerve blocks, and nerve ablation procedures—are increasingly used to manage chronic spine pain, particularly in North America. These procedures are hypothesised to attenuate chronic pain by interrupting pain related nerve signals through reducing local inflammation (epidural steroids), numbing nerves (nerve blocks), or targeted destruction of nerves responsible for transmitting pain (radiofrequency ablation).Between 1994 and 2001 in the US, there was a 271% increase in lumbar epidural steroid injections (from 553 to 2055 per 100 000 patients) and a 231% increase in facet injections (from 80to 264 per 100 000 patients) for low back pain.15 Facet joint or sacroiliac joint interventions in US Medicare recipients increased from approximately 425 000 in 2000 to 2.2 million interventions in 2013.16 From 2007 to 2016, data from a national US insurer showed a 131% increase in the use of lumbar radiofrequency procedures (from 49 to 113 per 100 000 patients).17 The number of US Medicare providers administering steroid injections along the spine increased 13% from 2012 to 2016.18Despite rapid growth in use of interventional procedures for chronic spine pain, the supporting evidence is uncertain. An analysis of 17 review articles on epidural steroid injections for spine pain found inconsistent conclusi'''
