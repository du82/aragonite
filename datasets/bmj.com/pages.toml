["http://www.bmj.com/about-bmj/editorial-staff/bmj-south-asia"]
title = "BMJ in South Asia | The BMJ"
description = "Kamran Abbasi, Executive Editor, The BMJ, talks about how there have been improvements in South Asia’s health scenario."
full_description = "Kamran Abbasi, Executive Editor, The BMJ, talks about how there have been improvements in South Asia’s health scenario. In 2004 we published a special theme issue of The BMJ on South Asia. Since then BMJ (the publishing group) has retained and expanded its interest in the region, and since 2013, The BMJ's website has offered a dedicated homepage for readers in South Asia, where all content relevant to the region is currently freely available. Since then more than 40 000 users have been visiting thebmj.com from India, Pakistan, Bangladesh, Nepal, Sri Lanka, Bhutan, Myanmar, Afghanistan, and Maldives every month, and we have been publishing more articles aimed at South Asian readers. One, by David Berger, described his experience at a rural hospital in India and led to a high profile campaign by The BMJ to tackle corruption in healthcare. The issue received widespread media coverage which led to substantial pressure on the government to commit to change. In a first, the then health minister of India acknowledged rampant corruption in medical regulatory bodies and vowed to take steps to improve transparency and bring to book doctors engaging in corrupt practices. Our news editor, Zosia Kmietowicz has been commissioning news. Our deputy magazine editor, Richard Hurley, has taken on the additional role of South Asian features and comment editor and will be commissioning comment articles that prioritise healthcare issues in the region. Our India based clinical editor, Anita Jain, is commissioning education content relevant to practice in the region. Anita is based in Mumbai and has been guiding the development of our editorial output for readers in South Asia since the early days. BMJ has had staff based in India since 2008. Prashant Mishra is the managing director of the India hub and has worked for BMJ India since then. The local team in India has expanded over the years and now includes sales and marketing as well as editorial colleagues. Most of these staff members work from one of two offices—one in Noida and the other in Mumbai. BMJ also has an editorial advisory board in South Asia."
