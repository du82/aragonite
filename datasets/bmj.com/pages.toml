["https://bmj.com/content/385/bmj-2023-078476"]
title = "Association of ultra-processed food consumption with all cause and cause specific mortality: population based cohort study | The BMJ"
description = """
Objective To examine the association of ultra-processed food consumption with all cause mortality and cause specific mortality.

Design Population based cohort study.

Setting Female registered nurses from 11 US states in the Nurses’ Health Study (1984-2018) and male health professionals from all 50 US states in the Health Professionals Follow-up Study (1986-2018).

Participants 74 563 women and 39 501 men with no history of cancer, cardiovascular diseases, or diabetes at baseline.

Main outcome measures Multivariable Cox proportional hazard models were used to estimate hazard ratios and 95% confidence intervals for the association of ultra-processed food intake measured by semiquantitative food frequency questionnaire every four years with all cause mortality and cause specific mortality due to cancer, cardiovascular, and other causes (including respiratory and neurodegenerative causes).

Results 30 188 deaths of women and 18 005 deaths of men were documented during a median of 34 and 31 years of follow-up, respectively. Compared with those in the lowest quarter of ultra-processed food consumption, participants in the highest quarter had a 4% higher all cause mortality (hazard ratio 1.04, 95% confidence interval 1.01 to 1.07) and 9% higher mortality from causes other than cancer or cardiovascular diseases (1.09, 1.05 to 1.13). The all cause mortality rate among participants in the lowest and highest quarter was 1472 and 1536 per 100 000 person years, respectively. No associations were found for cancer or cardiovascular mortality. Meat/poultry/seafood based ready-to-eat products (for example, processed meat) consistently showed strong associations with mortality outcomes (hazard ratios ranged from 1.06 to 1.43). Sugar sweetened and artificially sweetened beverages (1.09, 1.07 to 1.12), dairy based desserts (1.07, 1.04 to 1.10), and ultra-processed breakfast food (1.04, 1.02 to 1.07) were also associated with higher all cause mortality. No consistent associations between ultra-processed foods and mortality were observed within each quarter of dietary quality assessed by the Alternative Healthy Eating Index-2010 score, whereas better dietary quality showed an inverse association with mortality within each quarter of ultra-processed foods.

Conclusions This study found that a higher intake of ultra-processed foods was associated with slightly higher all cause mortality, driven by causes other than cancer and cardiovascular diseases. The associations varied across subgroups of ultra-processed foods, with meat/poultry/seafood based ready-to-eat products showing particularly strong associations with mortality.

Data can be shared through mechanisms detailed at <https://www.nurseshealthstudy.org> and <https://www.hsph.harvard.edu/hpfs/>."""
full_description = "Research Association of ultra-processed food consumption with all cause and cause specific mortality: population based cohort study BMJ 2024; 385 doi: https://doi.org/10.1136/bmj-2023-078476 (Published 08 May 2024) Cite this as: BMJ 2024;385:e078476 Linked Editorial Ultra-processed foods linked to higher mortality Article Related content Metrics Responses Peer review Zhe Fang, doctoral student1, Sinara Laurini Rossato, adjunct professor2 3, Dong Hang, associate professor3 4, Neha Khandpur, assistant professor3 5 6, Kai Wang, research associate1, Chun-Han Lo, resident physician7, Walter C Willett, professor1 3 8, Edward L Giovannucci, professor1 3, Mingyang Song, associate professor1 3 91Department of Epidemiology, Harvard T.H. Chan School of Public Health, Boston, MA, USA2Laboratory of Research and Extension in Epidemiology (Lapex-Epi), Institute of Geography, Universidade Federal de Uberlândia, Uberlândia, MG, Brazil3Department of Nutrition, Harvard T.H. Chan School of Public Health, Boston, MA, USA4Department of Epidemiology, Jiangsu Key Lab of Cancer Biomarkers, Prevention and Treatment, Collaborative Innovation Center for Cancer Personalized Medicine, School of Public Health, Gusu School, Nanjing Medical University, Nanjing, China5Division of Human Nutrition and Health, Wageningen University, Wageningen, Netherlands6Department of Nutrition, School of Public Health, University of São Paulo, São Paulo, Brazil7Department of Internal Medicine, Kirk Kerkorian School of Medicine, University of Nevada, Las Vegas, NV, USA8Channing Division of Network Medicine, Department of Medicine, Brigham and Women’s Hospital and Harvard Medical School, Boston, MA, USA9Clinical and Translational Epidemiology Unit and Division of Gastroenterology, Massachusetts General Hospital and Harvard Medical School, Boston, MA, USACorrespondence to: M Song msong{at}hsph.harvard.edu (or @MingyangSong3 on X/Twitter)Accepted 13 March 2024AbstractObjective To examine the association of ultra-processed food consumption with all cause mortality and cause specific mortality.Design Population based cohort study.Setting Female registered nurses from 11 US states in the Nurses’ Health Study (1984-2018) and male health professionals from all 50 US states in the Health Professionals Follow-up Study (1986-2018).Participants 74 563 women and 39 501 men with no history of cancer, cardiovascular diseases, or diabetes at baseline.Main outcome measures Multivariable Cox proportional hazard models were used to estimate hazard ratios and 95% confidence intervals for the association of ultra-processed food intake measured by semiquantitative food frequency questionnaire every four years with all cause mortality and cause specific mortality due to cancer, cardiovascular, and other causes (including respiratory and neurodegenerative causes).Results 30 188 deaths of women and 18 005 deaths of men were documented during a median of 34 and 31 years of follow-up, respectively. Compared with those in the lowest quarter of ultra-processed food consumption, participants in the highest quarter had a 4% higher all cause mortality (hazard ratio 1.04, 95% confidence interval 1.01 to 1.07) and 9% higher mortality from causes other than cancer or cardiovascular diseases (1.09, 1.05 to 1.13). The all cause mortality rate among participants in the lowest and highest quarter was 1472 and 1536 per 100 000 person years, respectively. No associations were found for cancer or cardiovascular mortality. Meat/poultry/seafood based ready-to-eat products (for example, processed meat) consistently showed strong associations with mortality outcomes (hazard ratios ranged from 1.06 to 1.43). Sugar sweetened and artificially sweetened beverages (1.09, 1.07 to 1.12), dairy based desserts (1.07, 1.04 to 1.10), and ultra-processed breakfast food (1.04, 1.02 to 1.07) were also associated with higher all cause mortality. No consistent associations between ultra-processed foods and mortality were observed within each quarter of dietary quality assessed by the Alternative Healthy Eating Index-2010 score, whereas better dietary quality showed an inverse association with mortality within each quarter of ultra-processed foods.Conclusions This study found that a higher intake of ultra-processed foods was associated with slightly higher all cause mortality, driven by causes other than cancer and cardiovascular diseases. The associations varied across subgroups of ultra-processed foods, with meat/poultry/seafood based ready-to-eat products showing particularly strong associations with mortality.IntroductionUltra-processed foods are ready-to-eat/heat industrial formulations made mostly or entirely from substances derived from foods, including flavors, colors, texturizers, and other additives, with little if any intact whole food.1 Ultra-processed foods, which are typically of low nutritional quality and high energy density, have been dominating the food supply of high income countries, and their consumption is markedly increasing in middle income countries.2 Ultra-processed food consumption accounts for 57% of daily energy intake among adults and 67% among youths in the US according to the National Health and Nutrition Examination Survey (NHANES).34Ultra-processed foods usually disproportionately contribute added sugars, sodium, saturated fats and trans fats, and refined carbohydrates to the diet together with low fiber.56 As well as having low nutritional quality, ultra-processed foods may contain harmful substances, such as additives and contaminants formed during the processing.78910 Growing evidence from large prospective cohorts show that ultra-processed food is associated with adverse health outcomes, such as overweight/obesity, cardiovascular diseases, type 2 diabetes, and colorectal cancer.11121314 A systematic review showed that high ultra-processed food consumption was associated with increased risk of all cause mortality, cardiovascular diseases, metabolic syndrome, depression, and postmenopausal breast cancer.15 However, few prospective cohort studies with a follow-up longer than 20 years have examined the association for all cause mortality or cause specific mortality, especially mortality due to cancer. High quality evidence from cohorts with a long follow-up is critical to inform dietary recommendations and food policies.Leveraging the rich data obtained through repeated assessments for more than 30 years in two large US prospective cohorts, we examined the associations of total ultra-processed food and subgroups of ultra-processed food with mortality from all causes and major individual causes.MethodsStudy populationWe used data from two large prospective cohorts in the US: the Nurses’ Health Study (NHS) began in 1976 and included 121 700 female registered nurses aged 30-55 years from 11 states; the Health Professionals Follow-up Study (HPFS) began in 1986 and enrolled 51 529 male health professionals aged 40-75 years from all 50 states. Every two years participants completed a mailed questionnaire enquiring about medical and lifestyle information. The baseline of this study was set to 1984 for the NHS and 1986 for the HPFS when the ultra-processed food data were first available. We excluded participants at baseline if they had reported a history of cancer, cardiovascular diseases, or diabetes; left more than 70 food items blank in the food frequency questionnaire or had implausible caloric intakes (<800 or >4200 kcal/d for men; <600 or >3500 kcal/d for women); or had missing data on ultra-processed food intakes. After exclusions, we included 74 563 women from the NHS and 39 501 men from the HPFS (supplementary figure A).Assessment of ultra-processed food intakeDiet was assessed using a validated semiquantitative food frequency questionnaire administered every four years.16 We grouped all foods into four categories of the Nova classification: unprocessed or minimally processed foods, processed culinary ingredients, processed foods, and ultra-processed foods, which has been described in detail elsewhere.17 we further categorized ultra-processed foods into nine mutually exclusive subgroups (supplementary table B; supplementary figure B): ultra-processed breads and breakfast foods; fats, condiments, and sauces; packaged sweet snacks and desserts; sugar sweetened and artificially sweetened beverages; ready-to-eat/heat mixed dishes; meat/poultry/seafood based ready-to-eat products (for example, processed meat); packaged savory snacks; dairy based desserts; and other. Because alcohol is a well studied risk factor for premature death and a distinct factor in diet, we did not consider alcohol in ultra-processed foods in the primary analysis. Moreover, as wholegrain foods have established benefit for lowering all cause mortality,18 we removed whole grains from ultra-processed foods in the primary analysis. We measured ultra-processed food intake as servings per day and adjusted it for total energy intake by using the residual method.19Ascertainment of outcomesDeath of a cohort member was notified by the next of kin via the post office when questionnaires or newsletters were returned or was identified through searches of the vital records of states and of the National Death Index. Study investigators blinded to the exposure status reviewed death certificates and extracted information from medical records to confirm the cause of death according to ICD-8 (international classification of diseases, 8th revision). The primary outcome of this study was all cause mortality. The secondary outcomes included deaths from cancer (ICD-8 codes 140-207), cardiovascular diseases (ICD-8 codes 390-459), and other causes (including respiratory diseases (ICD-8 codes 460-519) and neurodegenerative diseases (ICD-8 codes 290, 332, 340, 342, and 348)).Assessment of covariatesBiennial follow-up questionnaires were used to collect self-reported information on body weight, marital status, smoking status and pack years, physical activity, family history of cancer/cardiovascular diseases/diabetes, and physical examination for screening purposes, as well as menopausal status and postmenopausal hormone use for women. We calculated body mass index as weight in kilograms divided by height squared in meters. Physical activity was assessed with a validated questionnaire and converted into metabolic equivalent task hours.20 Alcohol drinking was measured by food frequency questionnaires as the number of drinks per week (considering one drink as one glass, bottle, or can of beer; one 4 ounce glass of wine; or one shot of liquor) and then converted into grams per day. We assessed overall dietary quality by using the Alternative Healthy Eating Index-2010 (AHEI) score.21Statistical analysisFollow-up time accrued from the date of return of the baseline questionnaire to the date of death or the end of follow-up (30 June 2018 for NHS; 31 January 2018 for HPFS), whichever came first. To better represent long term dietary habits and to minimize within person variation, we calculated cumulative averages of ultra-processed food consumption as the primary exposure. We did primary analyses in pooled cohorts and a secondary analysis in each cohort separately. We used time varying Cox proportional hazards models stratified by age (months), questionnaire cycle (two year interval), and cohort (in pooled analyses) with the counting process data structure to estimate the hazard ratios and 95% confidence intervals according to quarters of ultra-processed food consumption. We calculated P for trend on the basis of the Wald test by assigning the median intake to each quarter and modeling it as a continuous variable. In the multivariable model, we adjusted for race/ethnicity, marital status, physical activity, body mass index, smoking status and pack years, alcohol consumption, physical examination performed for screening purposes, family history of diabetes mellitus, myocardial infarction, or cancer, and menopausal status and hormone use (women only). We carried forward non-missing values from the previous survey cycle to replace missing data. If the value remained missing, we created missing indicators. The percentage of missing data is shown in supplementary table A. We also tested for the dose-response relation by using the restricted cubic spline regression.22In secondary analyses, we further categorized ultra-processed foods into mutually exclusive subgroups (supplementary tables B and C) to investigate whether the associations were driven by specific food groups.13 Furthermore, to assess the independent and combined association of ultra-processed food consumption and overall dietary quality with mortality, we categorized individuals jointly according to quarters of AHEI score and quarters of ultra-processed food intake and estimated the hazard ratios by using participants with the highest quarter of AHEI score and lowest quarter of ultra-processed food intake as the reference.We did several sensitivity analyses to test the robustness of the results. Firstly, given that people are likely to change their dietary habits after the diagnosis of certain chronic diseases, we stopped updating ultra-processed food consumption after the diagnosis of cardiovascular diseases, cancer, or diabetes during follow-up. Secondly, because of the uncertainty of the etiological time window, we introduced an eight to 12 year lag period between assessment of ultra-processed food intake and each follow-up period (for example, we used ultra-processed food intake from the 1986 questionnaire to assess the mortality risk in the period of 1994 to 1998). Thirdly, we added back to total ultra-processed food whole grains and distilled alcohol individually and in combination (that is, using the standard Nova definition) and repeated the analysis. Finally, we removed from the multivariable model pack years of smoking, which was not adjusted for in most previous studies, and further adjusted for AHEI score, to assess the confounding by smoking and dietary quality, respectively. We also removed from the multivariable model body mass index, which might be a mediator. Furthermore, we did the stratified analysis by major risk factors and repeated the primary analysis with ultra-processed food intake measured by percentage of energy.We used SAS statistical package (version 9.4) for all the statistical analyses. We considered a P value <0.05 (two sided) to be statistically significant unless otherwise specified.Patient and public involvementThe public was concerned about the health effects of ultra-processed foods, and their concerns informed our research question. Although participants were not involved in the study design, they played a central role in the conduct of the study by completing the biennial questionnaires in our cohorts, and we appreciate their contributions. We could not directly involve members of the public in this study, as no funding was available or set aside for patient a"
