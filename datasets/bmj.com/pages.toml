title = "Effect of high flow nasal cannula oxygenation on incidence of hypoxia during sedated gastrointestinal endoscopy in patients with obesity: multicentre randomised controlled trial | The BMJ"
description = """
Objective To determine whether high flow nasal cannula (HFNC) oxygenation can reduce the incidence of hypoxia during sedated gastrointestinal endoscopy in patients with obesity.

Design Multicentre, randomised, parallel group trial.

Setting Three tertiary hospitals in Shanghai, China.

Participants 1000 adult patients with obesity (body mass index ≥28) who were scheduled for gastrointestinal endoscopy.

Interventions Participants were randomly allocated to receive regular nasal cannula oxygenation or HFNC oxygenation during a sedated procedure with propofol and low dose sufentanil.

Main outcome measures The primary outcome was the incidence of hypoxia (75%≤SpO2<90% for <60 s) during the procedure. Secondary outcomes included the incidences of subclinical respiratory depression (90%≤SpO2<95% for any duration) and severe hypoxia (SpO2<75% for any duration or 75%≤SPO2<90% for >60 s) during the procedure.

Results From 6 May 2021 to 26 May 2023, 984 patients (mean age 49.2 years; 36.9% (n=363) female) completed the study and were analysed. Compared with regular nasal cannula oxygenation, HFNC oxygenation reduced the incidence of hypoxia from 21.2% (103/487) to 2.0% (10/497) (difference −19.14, 95% confidence interval −23.09 to −15.36; P<0.001), subclinical respiratory depression from 36.3% (177/487) to 5.6% (28/497) (difference −30.71, −35.40 to −25.92; P<0.001), and severe hypoxia from 4.1% (20/487) to 0% (0/497) (difference −4.11%, −6.26 to −2.48; P<0.001). Other sedation related adverse events did not differ between the two groups.

Conclusions In patients with obesity, oxygenation via HFNC during sedated gastrointestinal endoscopy significantly reduced the incidences of hypoxia, subclinical respiratory depression, and severe hypoxia without increasing other adverse events.

Trial registration ClinicalTrials.gov [NCT04500392][1].

The data will be available to other researchers on request, with information shared after approval by the corresponding author (D-SS).

 [1]: /lookup/external-ref?link_type=CLINTRIALGOV&access_num=NCT04500392&atom=%2Fbmj%2F388%2Fbmj-2024-080795.atom"""
full_description = "Research Effect of high flow nasal cannula oxygenation on incidence of hypoxia during sedated gastrointestinal endoscopy in patients with obesity: multicentre randomised controlled trial BMJ 2025; 388 doi: https://doi.org/10.1136/bmj-2024-080795 (Published 11 February 2025) Cite this as: BMJ 2025;388:e080795 Linked Editorial High flow nasal oxygenation in sedated gastrointestinal endoscopy for patients with obesity Article Related content Metrics Responses Peer review Leilei Wang, resident physician1, Yuanyuan Zhang, resident physician1, Dan Han, attending physician2, Mengyun Wei, attending physician3, Jie Zhang, attending physician1, Xiangyang Cheng, resident physician1, Yizhe Zhang, doctoral candidate1, Muyan Shi, resident physician1, Zijian Song, resident physician1, Xiangrui Wang, professor and chief physician2, Xiaoqing Zhang, professor and chief physician3, Diansan Su, professor and chief physician1 41Department of Anesthesiology, Renji Hospital, Shanghai Jiaotong University School of Medicine, Shanghai, China2Department of Anesthesiology, East Hospital, Tongji University School of Medicine, Shanghai, China,3Department of Anesthesiology, Shanghai Tongji Hospital, Tongji University, Shanghai, China4Department of Anesthesiology, The First Affiliated Hospital, Zhejiang University School of Medicine, Hangzhou, ChinaCorrespondence to: D Su diansansu{at}yahoo.comAccepted 21 January 2025AbstractObjective To determine whether high flow nasal cannula (HFNC) oxygenation can reduce the incidence of hypoxia during sedated gastrointestinal endoscopy in patients with obesity.Design Multicentre, randomised, parallel group trial.Setting Three tertiary hospitals in Shanghai, China.Participants 1000 adult patients with obesity (body mass index ≥28) who were scheduled for gastrointestinal endoscopy.Interventions Participants were randomly allocated to receive regular nasal cannula oxygenation or HFNC oxygenation during a sedated procedure with propofol and low dose sufentanil.Main outcome measures The primary outcome was the incidence of hypoxia (75%≤SpO2<90% for <60 s) during the procedure. Secondary outcomes included the incidences of subclinical respiratory depression (90%≤SpO2<95% for any duration) and severe hypoxia (SpO2<75% for any duration or 75%≤SPO2<90% for >60 s) during the procedure.Results From 6 May 2021 to 26 May 2023, 984 patients (mean age 49.2 years; 36.9% (n=363) female) completed the study and were analysed. Compared with regular nasal cannula oxygenation, HFNC oxygenation reduced the incidence of hypoxia from 21.2% (103/487) to 2.0% (10/497) (difference −19.14, 95% confidence interval −23.09 to −15.36; P<0.001), subclinical respiratory depression from 36.3% (177/487) to 5.6% (28/497) (difference −30.71, −35.40 to −25.92; P<0.001), and severe hypoxia from 4.1% (20/487) to 0% (0/497) (difference −4.11%, −6.26 to −2.48; P<0.001). Other sedation related adverse events did not differ between the two groups.Conclusions In patients with obesity, oxygenation via HFNC during sedated gastrointestinal endoscopy significantly reduced the incidences of hypoxia, subclinical respiratory depression, and severe hypoxia without increasing other adverse events.Trial registration ClinicalTrials.gov NCT04500392.IntroductionGastrointestinal cancers are increasing globally, with three quarters of cases occurring in developing countries, and deaths from these cancers are also high.12 According to the data of the International Agency for Research on Cancer in 2020, China as the largest developing country in the world ranks fourth and third worldwide in terms of the incidences of gastric and oesophageal cancers, respectively.12 The incidence of colorectal cancer is also increasing along with the increasing prevalence of obesity.345 With the advances in technology and operational skills, gastrointestinal endoscopic procedures have become the gold standard for diagnostic and therapeutic purposes in patients with various gastrointestinal diseases.6 Sedated gastrointestinal endoscopy increases patients’ comfort, reduces stress response, and eases the operation. Consequently, it has become the preferred treatment method for most patients. In China, the overall number of gastrointestinal endoscopies is high and is expected to increase in the future. Furthermore, the sedation rate is about 50%, which is much lower than in other countries, and varies by region and hospital.7Hypoxia is the most common adverse event during sedated gastrointestinal endoscopy, with reported incidences from 1.8% to 69%.8910 It is mainly caused by factors including respiratory depression, airway obstruction, and decreased chest wall compliance.11 Prolonged and severe hypoxia can lead to myocardial hypoxia, arrhythmia, permanent neurological damage, and even death.1213 Patients with obesity have poor lung and chest wall compliance, low lung capacity and functional residual capacity, and imbalanced ventilation-to-perfusion ratio. Thus, patients with obesity are at a high risk of hypoxaemia and prone to hypoxaemia induced complications.14 The incidence of hypoxia during sedated gastrointestinal endoscopy is higher in patients with obesity than in those with normal weight and increases with increasing body mass index.15 Furthermore, mask ventilation is challenging and hypoxaemia is difficult to correct in patients with obesity.16 With the increasing number of patients with obesity, the proportion of this patient group undergoing sedated gastrointestinal endoscopy has also increased. Reducing the incidence of hypoxaemia in these patients during sedated gastrointestinal endoscopy is a challenging task.According to our previous study,17 use of HFNC oxygenation significantly reduced the incidences of hypoxia and severe hypoxia during sedated gastroscopy in patients with American Society of Anesthesiologists (ASA) class I-II. However, patients enrolled in that trial had an average body mass index of approximately 22; only 6% had a body mass index ≥28. This small percentage was insufficient to show the effects of HFNC on the incidence of hypoxia in patients with obesity. Evidence on the effects of HFNC in patients with obesity is conflicting and weak. In a randomised trial of 379 patients at high risk (29.3% had body mass index ≥30), Nay and colleagues reported that use of HFNC significantly reduced the incidence of hypoxia during gastrointestinal endoscopy under sedation.14 However, the results came from a post hoc subgroup analysis. In a small sample size trial with 59 morbidly obese patients, HFNC oxygenation did not effectively reduce the incidence of hypoxia during colonoscopy under propofol sedation.18 Owing to the limited evidence, no recommendations were made in the American Society for Gastrointestinal Endoscopy and ASA guidelines about the use of HFNC for patients with obesity undergoing gastrointestinal endoscopy.619 Therefore, a large sample size trial is warranted to validate the effects of HFNC during sedated gastrointestinal endoscopy in patients with obesity.MethodsStudy designThis multicentre, randomised, parallel group trial with superiority design was conducted in three tertiary university hospitals in Shanghai, China: Renji Hospital (affiliated with Shanghai Jiao Tong University School of Medicine), Tongji Hospital (affiliated with Shanghai Tongji University School of Medicine), and East Hospital (affiliated with Shanghai Tongji University School of Medicine).ParticipantsWe enrolled patients aged 18-70 years who had obesity (body mass index ≥28) and ASA class ≤II and were scheduled for sedated gastrointestinal endoscopy (including sedated gastroscopy, sedated colonoscopy, and sedated gastroenteroscopy). We excluded patients who met any of the following criteria: history of coagulation disorders or a tendency of nose bleeding; diagnosed heart disease including heart failure, angina, myocardial infarction, or arrhythmia; diagnosed respiratory diseases including asthma, bronchitis, chronic obstructive pulmonary diseases, pulmonary bullae, pulmonary embolism, pulmonary oedema, lung cancer, or upper respiratory tract infection; pregnancy; current liver disease; current kidney disease; increased intracranial pressure; multiple trauma; emergent procedure or surgery; history of mental disorders; allergy to drugs used during the procedure; or unwillingness to participate in the study. Each participant provided written informed consent.Randomisation and maskingA biostatistician who was not involved in data management and statistical analyses generated the random sequence by using the PROC PLAN programme in SAS (version 9.0). Randomisation was generated in a one-to-one allocation ratio with a block length of six and stratified by the participating centres. Randomisation results were sealed in sequentially numbered opaque envelopes which were opened immediately before sedation was started. In this way, the consecutively recruited patients were randomly assigned to the regular nasal cannula group or the HFNC group.After peripheral intravenous access was established, each patient was given a regular nasal cannula covered with an HFNC (Airvo 2, Fisher, and Paykel, Panmure, New Zealand) to blind patients to the group assignment. The patients all had the procedure in the same room in each centre, and the HFNC oxygenation device was always at their bedside.Trial procedureIn the gastroenteroscopy room, an anaesthesiologist who had been trained in the use of a regular nasal cannula and HFNC was designated for sedation during the procedure. Pre-oxygenation was provided for one minute before sedation started. Patients in both groups received oxygen inhalation through the regular nasal cannula at a rate of 3 L/min before being sedated with 0.5 mg/kg propofol. Subsequently, the oxygen flow rate was increased to 6 L/min in the control group; the HFNC was connected to the already set machine (oxygen flow rate 60 L/min; humidity 37°C; oxygen concentration 100%) in the HFNC group. The sufentanil dosage was predetermined on the basis of the routine practices of the three centres: 5 µg for patients undergoing gastroscopy or colonoscopy and 7.5 µg for those undergoing gastroenteroscopy. Subsequently, the anaesthesiologist intravenously administered 1-2 mg/kg propofol according to the recommendations of the Expert Consensus on Sedation/Anaesthesia in Chinese Digestive Endoscopy from the Chinese Society of Anesthesiology.The anaesthesiologist closely observed the patients once the sedation started and continually evaluated the depth of sedation by using the Ramsay Sedation Scale. Once the Ramsay sedation score was ≥5, the endoscopist inserted the endoscope and started the procedure. To maintain intraoperative sedation (Ramsay sedation score ≥5), propofol was also intermittently administered at a dose of 0.2-0.5 mg/kg until the examination was completed.Data collection and outcome measuresWe recorded the patients’ basic information, including name, sex, age, ASA classification, height, weight and body mass index, airway examination (Mallampati classification, snoring mentioned by family, and polysomnography diagnosis of sleep apnoea syndrome), STOP-Bang questionnaire form, and perioperative adverse events. Total dose of propofol was also documented.Patients’ heart rate, blood pressure, and arterial oxygen saturation (SpO2) were measured and recorded by the standard anaesthesia multiparameter monitors. During the research period, SpO2 at each centre was consistently monitored using the same monitor, which were different in the three centres (Philips IntelliVue MP40, Royal Dutch Philips Electronics, in Renji Hospital; Philips G40E, Royal Dutch Philips Electronics, in East Hospital; and Mindray ePM10, Mindray Medical International, China, in Tongji Hospital). An independent recorder manually recorded the data on a paper case report form. The recorder continuously monitored the SpO2 values and activated a stopwatch to record the duration of hypoxia when SpO2 dropped below 90%. When hypoxia occurred, the patient’s airway was opened using the jaw thrust manoeuvre. Mask ventilation and tracheal intubation were performed if severe hypoxia could not be corrected with airway opening.The primary study endpoint was the incidence of hypoxia (75%≤SpO2<90% for <60 s). The secondary study endpoints included the incidences of subclinical respiratory depression (90%≤SpO2<95% for any duration), severe hypoxia (SpO2<75% for any duration or 75%≤SpO2<90% for >60 s), and other adverse events.All the sedation related adverse events during the procedure were recorded using the reporting tool proposed by the World Society of Intravenous Anaesthesia International Sedation Task Force,20 which involved the following steps. Step 1: determine whether an adverse event occurred. Step 2: describe the adverse events, including respiratory and sedation related adverse events. Step 3: record the interventions used to correct the adverse events. Step 4: record the patient’s outcome.HFNC oxygenation related adverse events, including xeromycteria, rhinalgia, pharyngalgia, headache, and barotrauma (for example, pneumothorax and subcutaneous emphysema) were recorded after recovery from anaesthesia. The patients were observed for at least one hour in the recovery area following the procedure. During this time, their oxygen saturation, presence of respiratory distress, chest pain, and crepitant rales were checked. If these symptoms were noted, barotrauma was suspected and advanced examinations, such as computed tomography of the chest, were ordered, if necessary.Sample size estimationAccording to relevant literature searches2122 and preliminary experimental results, the incidence of hypoxia during regular nasal cannula oxygenation in patients with obesity was approximately 20%. HFNC reduced the incidence of hypoxia from 8.4% to 0% in ASA class I-II patients having elective gastroscopy under propofol sedation.17 We anticipated that HFNC could also reduce the incidence of hypoxia by 8% in patients with obesity. Therefore, assuming that HFNC oxygenation can reduce the incidence of hypoxia to 12%, we set total class I error to α=0.05, the test efficacy power to 0.90, and the dropout rate to 10%. In the bilateral test, the patients were randomly allocated to groups in a one-to-one ratio, and the three components were calculated using the PASS software. Therefore, we estimated the sample size to be 972. Overall, we enrolled 1000 patients, 500 in the HFNC group and 500 in the control group, considering that the situation may vary.Statistical analysisAll tests were two sided, and we considered a P value <0.05 to indicate statistical significance, unless otherwise stated. We used SAS software version 9.4 for all statistical analyses.We did all analyses according to the intention-to-treat principle. We analysed patients who were randomised and received the study treatment as the full analysis set. The per protocol set, a subset of the "
