title = "Medical education in Gaza must be protected | The BMJ"
description = """
Over one year on from Israel's continued siege on Gaza, Duha Shellah examines the impact on Gaza’s medical students, and the implications that this has for the destruction of healthcare infrastructure

Before the ceasefire announcement on 19 January, more than a year of violence has taken its toll on the people of Gaza. At the time of writing there have been over 45 000 deaths, 70% of these being women and children.1 The relentless bombardment has brought destruction to all aspects of life in Gaza. This has left many young people facing uncertainty about their future. The destruction of education and healthcare infrastructure will inevitably lead to profound consequences on the provision of medical education and the future of healthcare for years. The international medical community must acknowledge the harm caused by this and take action to support the rebuilding of this essential infrastructure by offering vital aid and resources.

One academic year has already been lost. Two medical schools located in the Gaza Strip—Islamic University of Gaza and Al-Azhar University—have been destroyed by …"""
full_description = "Opinion BMJ Student Opinion Medical education in Gaza must be protected BMJ 2025; 388 doi: https://doi.org/10.1136/bmj.r219 (Published 06 February 2025) Cite this as: BMJ 2025;388:r219 Article Related content Metrics Responses Peer review Duha Shellah, doctor11Juzoor for Health and Social Development, Al Bireh, PalestineOver one year on from Israel's continued siege on Gaza, Duha Shellah examines the impact on Gaza’s medical students, and the implications that this has for the destruction of healthcare infrastructureBefore the ceasefire announcement on 19 January, more than a year of violence has taken its toll on the people of Gaza. At the time of writing there have been over 45 000 deaths, 70% of these being women and children.1 The relentless bombardment has brought destruction to all aspects of life in Gaza. This has left many young people facing uncertainty about their future. The destruction of education and healthcare infrastructure will inevitably lead to profound consequences on the provision of medical education and the future of healthcare for years. The international medical community must acknowledge the harm caused by this and take action to support the rebuilding of this essential infrastructure by offering vital aid and resources.One academic year has already been lost. Two medical schools located in the Gaza Strip—Islamic University of Gaza and Al-Azhar University—have been destroyed by Israeli attacks.23 The destruction of these institutions, along with the unrelenting targeting of Gaza’s hospitals, has had disastrous results on medical students' education. An estimated 40 medical students have been killed and 60 have been detained, while hundreds more have been displaced.4 They live in unsafe and often precarious conditions under the threat of violence. The destruction of healthcare in the Gaza Strip has also forced hundreds of medical students to end their clinical rotations early. This disruption to their studies has contributed to a shortage of healthcare workers, causing substantial limitations to the healthcare system's capacity to respond effectively to the medical and humanitarian crisis. This shortage will be increasingly apparent after the ceasefire announcement and during the recovery and rebuilding phase.Despite these challenges, efforts are under way to support medical education in Gaza through international collaborations and local and national initiatives. Some of these have been educational initiatives from Palestinian universities in the West Bank, where Gazan students are able to continue their education online, although this has relied on their access to the internet, which is often disrupted because of the destruction of infrastructure. In the earlier stages of the conflict, before the border with Egypt was closed completely, some students were able to leave to take up places at medical schools in Norway, Pakistan, and South Africa.Gaza has been under siege with an almost comprehensive blockade in place since 2007. The restrictions on travel, academic exchange, as well as the arduous process for permit applications have hindered medical education by preventing educators, expertise, and opportunity from reaching Gaza. Residency programmes in the Gaza Strip are limited in terms of placements, specialties, educational resources, and equipment, which affects longer term opportunities for medical students. Military escalations in Gaza since 2008 have targeted physicians, researchers, and academics, with numerous hospitals and clinics being destroyed.5 This has had disastrous consequences for the provision of both medical care and medical education. Beyond their education, military occupation is harmful to the quality of life of Palestinian medical students, who undertake their studies in an atmosphere of continual violence, compounded by the psychological distress of ongoing displacement. These conditions have been worsened by the conflict, resulting in a situation in which medical students and junior physicians are having their training systematically inhibited.The international medical community has a duty to act against the disruption this has caused to healthcare and educational institutions by joining to sustain the ongoing ceasefire and the application of and adherence to international law. The medical community plays a vital role in raising awareness, applying diplomatic pressure, and lobbying for the protection of medical facilities and the necessary delivery of humanitarian aid. The World Health Assembly, international conferences, and symposiums should be communicating the need to support research into the long term health effects of conflict, including effects of ongoing trauma, infectious disease, and disrupted healthcare services. In addition, the international medical community should support the development of plans to reconstruct the healthcare system by working collaboratively with Palestinian healthcare professionals.Medical practitioners, academics, and organisations alike, have a moral and ethical duty to raise awareness of the situation for Gazan medical students and take a stand against further destruction of medical education. It is crucial that future research and advocacy work focuses on the far reaching consequences that repeated military escalations in Gaza have had by damaging the healthcare and medical education systems over decades. The international medical community, including medical schools, must recognise the role they can play in supporting Gazan medical students. This should entail offering virtual learning, resources, and educational opportunities.Medical students within conflict areas, where healthcare and education are defined by political, economic, and cultural determinants, are a potential force for improving global healthcare. Realising this potential requires the collective, transnational mobilisation of resources, health education, research collaboration, funding, and health diplomacy, directing it towards supporting a generation of future medical educators and practitioners in Gaza and beyond. It is vital to recognise medical students as an essential part of the future of rebuilding Gaza’s healthcare system.FootnotesCompeting interests: None declared.AI statement: None.Provenance: commissioned, not externally peer reviewed.References↵OCHA. Humanitarian Situation Update #251 Gaza Strip. 31 December 2024. https://www.ochaopt.org/content/humanitarian-situation-update-251-gaza-strip↵Fayoumi S. Every university in Gaza has been destroyed. So have these students’ dreams. Nation2024;26. https://www.thenation.com/article/world/gaza-students-future/.↵Al Jazeera. How Israel has destroyed Gaza’s schools and universities. Al Jazeera. 24 January 2024 https://www.aljazeera.com/news/2024/1/24/how-israel-has-destroyed-gazas-schools-and-universities↵Khoury E, Ali-Fehmi R, Imad M, et al. To rebuild Gaza’s healthcare system, medical students from Gaza need support. Mondoweiss. 15 April 2024 https://mondoweiss.net/2024/04/to-rebuild-gazas-healthcare-system-medical-students-from-gaza-need-support/↵United Nations. Hostilities in Gaza and Israel—OCHA situation report. 4 August 2014. https://www.un.org/unispal/document/auto-insert-196312/"
