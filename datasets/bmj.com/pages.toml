title = "Glucagon-like peptide-1 receptor agonists and risk of suicidality among patients with type 2 diabetes: active comparator, new user cohort study | The BMJ"
description = """
Objective To determine whether the use of glucagon-like peptide-1 (GLP-1) receptor agonists is associated with an increased risk of suicidal ideation, self-harm, and suicide among patients with type 2 diabetes compared with the use of dipeptidyl peptidase-4 (DPP-4) inhibitors or sodium-glucose cotransporter-2 (SGLT-2) inhibitors.

Design Active comparator, new user cohort study.

Setting Primary care practices contributing data to the UK Clinical Practice Research Datalink linked to the Hospital Episodes Statistics Admitted Patient Care and Office for National Statistics Death Registration databases.

Participants Patients with type 2 diabetes.

Exposures Two cohorts were assembled, with the first composed of patients who started and continued on GLP-1 receptor agonists or DPP-4 inhibitors between 1 January 2007 and 31 December 2020 and the second composed of patients who started and continued on GLP-1 receptor agonists or SGLT-2 inhibitors between 1 January 1 2013 and 31 December 2020. Both cohorts were followed until 29 March 2021.

Main outcome measures The primary outcome was suicidality, defined as a composite of suicidal ideation, self-harm, and suicide. Secondary outcomes were each of these events considered separately. Propensity score fine stratification weighted Cox proportional hazards models were fitted to estimate hazard ratios and 95% confidence intervals (CIs) to estimate the average treatment effect among the treated patients.

Results The first cohort included 36 082 GLP-1 receptor agonist users (median follow-up 1.3 years) and 234 028 DPP-4 inhibitor users (median follow-up 1.7 years). In crude analyses, GLP-1 receptor agonist use was associated with an increased incidence of suicidality compared with DPP-4 inhibitors (crude incidence rates 3.9 v 1.8 per 1000 person years, respectively; hazard ratio 2.08, 95% CI 1.83 to 2.36). This estimate decreased to a null value after confounding factors were accounted for (hazard ratio 1.02, 95% CI 0.85 to 1.23). The second cohort included 32 336 GLP-1 receptor agonist users (median follow-up 1.2 years) and 96 212 SGLT-2 inhibitor users (median follow-up 1.2 years). Similarly, GLP-1 receptor agonist use was associated with an increased risk of suicidality compared with SGLT-2 inhibitors in crude analyses (crude incidence rates 4.3 v 2.7 per 1000 person years; hazard ratio 1.60, 95% CI 1.37 to 1.87) but not after confounding factors were accounted for (0.91, 0.73 to 1.12). Similar findings were observed when suicidal ideation, self-harm, and suicide were analysed separately in both cohorts.

Conclusions In this large cohort study, the use of GLP-1 receptor agonists was not associated with an increased risk of suicidality compared with the use of DPP-4 inhibitors or SGLT-2 inhibitors in patients with type 2 diabetes.

ICD-10 codes to identify the outcome are included in supplementary table S1. Example code lists used to identify covariates are included in supplementary table S2. Codes used to used to identify antidiabetic drugs, suicidal ideation, and self-harm in the CPRD, as well as reproducible codes for cohort construction, propensity score generation, propensity score fine stratification weighting, and primary analyses are available on Open Science Framework and are linked in the supplementary methods. No other data are available. This study is based on data from the CPRD obtained under licence from the UK Medicines and Healthcare products Regulatory Agency. The data are provided by patients and collected by the UK National Health Service as part of their care and support. The interpretation and conclusions contained in this study are those of the author/s alone. Because electronic health records are classified as “sensitive data” by the UK Data Protection Act, information governance restrictions (to protect patient confidentiality) prevent data sharing via public deposition. Data are available with approval through the individual constituent entities controlling access to the data. Specifically, the primary care data can be requested via application to the CPRD (<https://www.cprd.com>)."""
full_description = "Research Glucagon-like peptide-1 receptor agonists and risk of suicidality among patients with type 2 diabetes: active comparator, new user cohort study BMJ 2025; 388 doi: https://doi.org/10.1136/bmj-2024-080679 (Published 26 February 2025) Cite this as: BMJ 2025;388:e080679 Linked Editorial GLP-1 receptor agonists and suicidality Article Related content Metrics Responses Peer review Samantha B Shapiro, doctoral student1 2, Hui Yin, statistician1, Oriana Hoi Yun Yu, endocrinologist and associate professor2 3 4, Soham Rej, psychiatrist and associate professor5 6, Samy Suissa, professor1 2 7, Laurent Azoulay, professor1 2 81Centre for Clinical Epidemiology, Lady Davis Institute, Jewish General Hospital, Montreal, QC, Canada2Department of Epidemiology, Biostatistics, and Occupational Health, McGill University, Montreal, QC, Canada3Division of Endocrinology, Jewish General Hospital, Montreal, QC, Canada4Division of Endocrinology & Metabolism, McGill University, Montreal, QC, Canada5Department of Psychiatry, Jewish General Hospital, Montreal, QC, Canada6Department of Psychiatry, McGill University, Montreal, QC, Canada7Department of Medicine, McGill University, Montreal, QC, Canada8Gerald Bronfman Department of Oncology, McGill University, Montreal, QC, CanadaCorrespondence: L Azoulay laurent.azoulay{at}mcgill.ca (or @profLAzoulay on X)Accepted 24 January 2025AbstractObjective To determine whether the use of glucagon-like peptide-1 (GLP-1) receptor agonists is associated with an increased risk of suicidal ideation, self-harm, and suicide among patients with type 2 diabetes compared with the use of dipeptidyl peptidase-4 (DPP-4) inhibitors or sodium-glucose cotransporter-2 (SGLT-2) inhibitors.Design Active comparator, new user cohort study.Setting Primary care practices contributing data to the UK Clinical Practice Research Datalink linked to the Hospital Episodes Statistics Admitted Patient Care and Office for National Statistics Death Registration databases.Participants Patients with type 2 diabetes.Exposures Two cohorts were assembled, with the first composed of patients who started and continued on GLP-1 receptor agonists or DPP-4 inhibitors between 1 January 2007 and 31 December 2020 and the second composed of patients who started and continued on GLP-1 receptor agonists or SGLT-2 inhibitors between 1 January 1 2013 and 31 December 2020. Both cohorts were followed until 29 March 2021.Main outcome measures The primary outcome was suicidality, defined as a composite of suicidal ideation, self-harm, and suicide. Secondary outcomes were each of these events considered separately. Propensity score fine stratification weighted Cox proportional hazards models were fitted to estimate hazard ratios and 95% confidence intervals (CIs) to estimate the average treatment effect among the treated patients.Results The first cohort included 36 082 GLP-1 receptor agonist users (median follow-up 1.3 years) and 234 028 DPP-4 inhibitor users (median follow-up 1.7 years). In crude analyses, GLP-1 receptor agonist use was associated with an increased incidence of suicidality compared with DPP-4 inhibitors (crude incidence rates 3.9 v 1.8 per 1000 person years, respectively; hazard ratio 2.08, 95% CI 1.83 to 2.36). This estimate decreased to a null value after confounding factors were accounted for (hazard ratio 1.02, 95% CI 0.85 to 1.23). The second cohort included 32 336 GLP-1 receptor agonist users (median follow-up 1.2 years) and 96 212 SGLT-2 inhibitor users (median follow-up 1.2 years). Similarly, GLP-1 receptor agonist use was associated with an increased risk of suicidality compared with SGLT-2 inhibitors in crude analyses (crude incidence rates 4.3 v 2.7 per 1000 person years; hazard ratio 1.60, 95% CI 1.37 to 1.87) but not after confounding factors were accounted for (0.91, 0.73 to 1.12). Similar findings were observed when suicidal ideation, self-harm, and suicide were analysed separately in both cohorts.Conclusions In this large cohort study, the use of GLP-1 receptor agonists was not associated with an increased risk of suicidality compared with the use of DPP-4 inhibitors or SGLT-2 inhibitors in patients with type 2 diabetes.IntroductionThe glucagon-like peptide-1 (GLP-1) receptor agonist drug class is widely prescribed to manage type 2 diabetes.1 In large trials of cardiovascular outcomes, GLP-1 receptor agonists were highly effective in achieving glycaemic control, showing beneficial cardiorenal effects and reducing all cause mortality.2 Despite these benefits, recent reports linking GLP-1 receptor agonists to suicidal ideation and self-harm have raised significant concerns.3The initial signal regarding this possible safety problem emerged from the Icelandic Medicines Agency in July 2023, prompting regulatory bodies worldwide, including the European Medicines Agency and the US Food and Drug Administration, to launch independent investigations into the potential risk of suicidality among GLP-1 receptor agonist users.3 Despite these efforts, regulatory agencies have yet to reach definitive conclusions owing to limitations in the available evidence.45 Clinical trials of GLP-1 receptor agonists have not reported any imbalances in suicidal ideation or self-harm,67 whereas several observational studies have generated varied findings on of the effect of GLP-1 receptor agonists on the risk of suicidal ideation, self-harm, and suicide, which may be a result of methodological limitations in these studies.8910111213 From a biological standpoint, GLP-1 receptor agonists may lead to suicidality through different mechanisms, including hyperactivity of the hypothalamic-pituitary-adrenal axis,14 sudden weight loss leading to elevated suicide risk,1516 and under-expression of brain derived neurotrophic factor linking low body weight and increased anxiety, potentially contributing to higher suicidality.1718 However, the exact manner in which GLP-1 receptor agonists could increase the risk of suicidal ideation and self-harm remains unclear.Owing to the increasing popularity of GLP-1 receptor agonists and the inconsistency of observational studies on this potential association, we did a large, observational study to estimate the average treatment effect of continuous GLP-1 receptor agonist use compared with continuous dipeptidyl peptidase-4 (DPP-4) inhibitor or sodium-glucose cotransporter-2 (SGLT-2) inhibitor use on suicidal ideation, self-harm, and suicide among patients with type 2 diabetes.MethodsData sourcesWe used data from the UK Clinical Practice Research Datalink (CPRD) GOLD and Aurum, which was linked to the Hospital Episode Statistics Admitted Patient Care (HES APC) and Office for National Statistics (ONS) Death Registration databases. The CPRD is a large primary care database encompassing 60 million patients from more than 2000 general practices, which accurately reflects the demographics of the UK population in terms of age, sex, and ethnicity.1920 Diagnoses in the CPRD are recorded using the Read and SNOMED-CT classifications. The CPRD contains data on prescriptions written by general practitioners.21 The HES APC database archives hospital admission records of patients treated within English National Health Service hospitals.2223 The ONS Death Registration database is a vital statistics database used as the gold standard to identify patients who died from suicide and other causes during follow-up.222425 Diagnoses in the HES APC and ONS are recorded using the ICD-10 (international classification of diseases, 10th revision) classification.Study populationWe implemented two active comparator, new user cohorts.26 The first cohort was composed of patients who started and continued on either a GLP-1 receptor agonist (dulaglutide, exenatide, liraglutide (except the 3 mg/0.5 mL formulation indicated for weight loss), lixisenatide, semaglutide) or a DPP-4 inhibitor (alogliptin, linagliptin, saxagliptin, sitagliptin, vildagliptin) for the first time between 1 January 2007 (the year these medications entered the UK market) and 31 December 2020. We selected DPP-4 inhibitors as the comparator because they are not associated with the outcome and are used at a similar disease stage to GLP-1 receptor agonists16827; furthermore, DPP-4 inhibitors and GLP-1 receptor agonists entered the UK market in the same year. As both the GLP-1 receptor agonist and DPP-4 inhibitor drug classes exert their effects through the incretin system,28 we selected SGLT-2 inhibitors as a secondary comparator drug. This cohort was composed of patients who started and continued on either a GLP-1 receptor agonist or an SGLT-2 inhibitor (canagliflozin, dapagliflozin, empagliflozin, ertugliflozin) for the first time between 1 January 2013 (the year that SGLT-2 inhibitors entered the UK market) and 31 December 2020. We chose SGLT-2 inhibitors as the secondary comparator because they are also used at a disease stage similar to GLP-1 receptor agonists and have not been associated with the outcome.16For both cohorts, we defined cohort entry as the date of the first prescription for either a GLP-1 receptor agonist or the comparator drug during the study period. At cohort entry, we excluded patients who were less than 18 years of age, had less than one year of medical history in the database, had no diagnosis of type 2 diabetes, had contraindications such as end stage renal disease or multiple endocrine neoplasia, or had concurrent prescriptions for both a GLP-1 receptor agonist and the comparator drug.Follow-upFor both cohorts, we followed patients by using an on-treatment exposure definition, whereby we considered patients to be continuously exposed to the study drugs if consecutive prescriptions overlapped. We applied a 90 day grace period to bridge consecutive prescriptions that did not overlap. Thus, we followed patients from cohort entry until the outcome (detailed below), switching or discontinuation of study drug (defined as the lack of a prescription by the end of the 90 day grace period), death from any cause other than suicide, end of registration with the CPRD, or end of the study period (29 March 2021), whichever occurred first. Patients who switched from a GLP-1 receptor agonist to the comparator drug, or vice versa, did not re-enter the cohort after switching.Study outcomesOur primary outcome was suicidality, which we defined as a composite of suicidal ideation (identified in the CPRD), hospital admission for self-harm (identified in HES APC), or completed suicide (identified in ONS). We identified self-harm and completed suicide on the basis of ICD-10 codes X60-84 and Y87.0 (a complete description of codes can be found in supplementary table S1). Our secondary outcomes were suicidal ideation, hospital admission for self-harm, and suicide, each considered separately. Thus, for a given secondary outcome, patients were not censored if they had another event that was part of the composite outcome (other than suicide).Potential confoundersWe considered a comprehensive list of potential confounders measured at or before cohort entry, which we chose on the basis of expert and a priori knowledge. They included age (modelled as a cubic spline with five interior knots), sex, socioeconomic status (based on the Index of Multiple Deprivation), body mass index (<30, 30-34.9, 35-39.9, and ≥40), proxies for severity diabetes (haemoglobin A1c, duration of diabetes, microvascular and macrovascular complications, previous use of antihyperglycaemic drugs), mental health disorders (depression, anxiety, bipolar disorder, psychosis, schizophrenia, obsessive-compulsive disorder, attention deficit/hyperactivity disorder, borderline personality disorder, eating disorder, post-traumatic stress disorder, history of self-harm, history of suicidal ideation), and other variables previously associated with suicidality (insomnia, epilepsy, dementia, chronic pain, history of cancer, substance use).29303132 Additionally, we considered drugs prescribed for common comorbidities, indicators of health seeking behaviour, and the calendar year of cohort entry. Variables with missing information (body mass index, smoking, haemoglobin A1c, Index of Multiple Deprivation) were modelled with an unknown category. A description of the confounders and their measurement periods can be found in supplementary table S2. Supplementary figure 1 illustrates the relations between the exposure, outcome, and covariates through a directed acyclic diagram.Statistical analysisWithin each cohort, we used propensity score fine stratification weighting to account for confounding.33 We achieved this by using multivariable logistic regression to predict the probability of receiving a GLP-1 receptor agonist versus the comparator drug (a DPP-4 inhibitor or SGLT-2 inhibitor) conditional on the previously listed covariates. We trimmed patients in non-overlapping regions of the propensity score distributions and generated 50 strata based on the propensity score distribution of the GLP-1 receptor agonist users. GLP-1 receptor agonist users were assigned a weight of one, and users of the comparator drug class were reweighted to be proportional to the number of GLP-1 receptor agonist users in each stratum.3334 Further details on propensity score fine stratification weighting are available in the supplementary methods. The estimand was the average treatment effect among the treated patients, representing the effect of the GLP-1 receptor agonists when exposed patients used a GLP-1 receptor agonist versus a comparator drug.33 We used descriptive statistics to assess the balance between the exposure groups by using absolute standardised mean differences, with differences of less than 0.10 being considered acceptable.We calculated crude and weighted incidence rates for the primary and secondary outcomes with 95% confidence intervals based on the Poisson distribution. We used weighted Kaplan-Meier curves to show the cumulative incidence of the outcome for each exposure group over the follow-up period. Finally, we fitted weighted Cox proportional hazards models to estimate hazard ratios of the outcomes and 95% confidence intervals by using robust variance estimators to compare the use of GLP-1 receptor agonists with the use of the comparator drug class. We visually examined Schoenfeld residuals and included an interaction term with the natural logarithm of time to ensure no violation of the proportional hazards assumption.35We did several secondary analyses based on the primary outcome for both cohorts. Firstly, we assessed whether the relation between GLP-1 receptor agonist use and suicidality differed between the individual drugs in the class by doing separate analyses for each GLP-1 receptor agonist (exenatide, liraglutide, lixisenatide, dulaglutide, and semaglutide). Secondly, we determined whether the association between GLP-1 receptor agonist use and the risk of suicidality is modified by age at cohort entry (18-30, 31-50, 51-70, and >70"
