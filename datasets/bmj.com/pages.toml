title = "Forms, policies, and ethics | The BMJ"
description = "Transparency policyThe mission of The BMJ is to lead the debate on health and to engage, inform, and stimulate all doctors and health care researchers in ways that enable them to make better decisions and improve outcomes for patients."
full_description = "The mission of The BMJ is to lead the debate on health and to engage, inform, and stimulate all doctors and health care researchers in ways that enable them to make better decisions and improve outcomes for patients. Underpinning these aims, The BMJ has a set of ethical editorial principles, an ethics advisory committee, and a commitment to transparency. We try to ensure that readers, authors, and editors know as much about the background to each other’s work as possible. We do this through policies such as open peer review, declaring competing interests, and explaining the role of the bodies that fund research. There are many other policies and principles that help The BMJ to be an ethical publisher, and we have brought all of them together in this single transparency policy. You can reach the policies listed below simply by clicking on the links. We will add to The BMJ’s transparency policy as often as we need to. Please contact us if you feel there is anything missing. Competing interests Ethics approval of research The BMJ's ethics committee Open access Copyright and permission to reuse Trial registration and data sharing Authorship and contributorship Patient confidentiality Publishing images of patients Our peer review process Previous peer review reports Peer reviewing research done by BMJ editors Evidence based publishing at The BMJ Editorial research at The BMJ Occupational workforce research Previous publication Duplicate publication and plagiarism Corrections and retractions Scientific misconduct Article provenance Role of professional medical writers Reporting industry-sponsored trials Competing interests of The BMJ's editorial staff Competing interests of The BMJ's editorial advisory board BMJ (publishing group) advertising and sponsorship policy Articles criticising doctors and others The BMJ aims to ensure that all articles published in The BMJ report on work that is morally acceptable, and expects authors to follow the World Medical Association's Declaration of Helsinki."
