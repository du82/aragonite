title = "Continuing Cancer inequalities – Enough of evidence and time for action | The BMJ"
full_description = "Article Related content Article metrics Rapid responses Response Rapid Response: Continuing Cancer inequalities – Enough of evidence and time for action Dear Editor UK cancer death rates are 60% higher in the most deprived areas compared to the wealthiest, resulting in an extra 28,400 deaths annually. Despite decades of research and policy outlining these stark inequalities, little progress has been achieved. The evidence is overwhelming, yet the gap between the richest and poorest communities in terms of early diagnosis, access to treatment, and cancer survival remains stubbornly wide. It is time to ask: Why are we still talking about the problem, when it is long past time for action? For too long, we have relied on reports, analysis, and statistics that only confirm what we already know. Socioeconomic deprivation is deeply embedded in the cancer pathway, from higher exposure to cancer risk factors like smoking, poor diet, and lack of physical activity, to delayed diagnosis and treatment in poorer communities (1 - 3). Research has repeatedly shown that individuals living in deprived areas experience longer waits for cancer care, often resulting in poorer survival outcomes (4). This is close to our hearts as Stoke-on-Trent where the authors work has significant deprivation (5). The gap is not just in health outcomes but also in access—poorer patients often do not have the same opportunities for early diagnosis or life-saving treatments as those from more affluent backgrounds (6). These inequalities are not new; The time for studies is over. We know what needs to be done, so why aren’t we doing it? Previous initiatives, such as the NHS Cancer Plan 2000 (7) and the Cancer Reform Strategy 2007 (8), have made strides in improving cancer care and reducing waiting times. However, socioeconomic disparities in cancer outcomes continue to persists. Targeted screening programmes, like those for breast, cervical, and bowel cancers, have helped increase early detection rates, but they have failed to reach the most deprived groups in significant numbers. The result? Lives continue to be lost unnecessarily, and survival rates remain unacceptably lower for those in the poorest communities. It is now time for action, not just more evidence. The UK government must implement policies that focus on practical interventions in the most affected communities. Cancer services need to be restructured to ensure that people in deprived areas receive timely referrals, diagnostic tests, and effective treatments. This will require investment in primary care, public health, and health outreach to improve public awareness and early cancer detection. The reduction of diagnostic delays and the removal of systemic barriers to care are essential to narrowing this survival gap (9). The NHS Cancer Programme’s recent initiatives, such as Targeted Lung Health Checks and the expansion of cutting-edge treatments like CAR-T cell therapy, are positive steps (10). However, they cannot be effective if access to these services is inequitable. Ensuring that all populations, regardless of socioeconomic background, have access to these services is essential. Furthermore, cancer prevention must be central to the UK’s strategy, focusing on initiatives to reduce smoking, improve nutrition, and address the wider determinants of health that contribute to cancer incidence. The evidence is there, the gaps are well-documented, and yet the progress has been too slow. Thousands of lives could be saved each year if we acted with urgency and precision. The UK government and the NHS must now shift from talking about the problem to acting decisively to eliminate these inequalities. This cannot be left to chance—it is a moral imperative that we act and act now. As a society, we must move forward with a national strategy that ensures equal access to early diagnosis, cutting-edge treatment, and prevention programmes for everyone, no matter where they live or how much they earn. Hawra Abuali, Foundation Year 2 trainee, Stephen Gunther, Director of Public Health, Protection & Wellbeing, Padmanabhan Badrinath, Interim consultant in Public Health Medicine & Head of Health and Public Protection Division. Directorate of Public Health, Protection and Wellbeing, Stoke-on-Trent City Council, Civic, Centre, Glebe Street, Stoke-on-Trent, ST4 1HH Disclaimer: The views expressed here are the professional views of the authors and in no way represent the views of Stoke-on-Trent City council References 1. Joyce K, Zermanos T, Badrinath P, Factors associated with variation in emergency diagnoses of cancer at general practice level in England, Journal of Public Health, Volume 43, Issue 4, December 2021, Pages e593–e600, https://doi.org/10.1093/pubmed/fdaa142Cancer 2. Ingleby FC, Woods LM, Atherton IM, Baker M, Elliss-Brookes L, Belot A. An investigation of cancer survival inequalities associated with individual-level socio-economic status, area-level deprivation, and contextual effects, in a cancer patient cohort in England and Wales. BMC Public Health. 2022 Jan 13;22(1):90. doi: 10.1186/s12889-022-12525-1. PMID: 35027042; PMCID: PMC8759193. 3. Research UK. Cancer in the UK 2025: Socioeconomic Deprivation. 2025. Available from: https://www.cancerresearchuk.org/sites/default/files/cancer_in_the_uk_20... 4. Department of Health & Social Care. Fingertips |Public Health Profiles. Local Authority Health Profile. Stoke-on-Trent. Available from https://fingertips.phe.org.uk/profile/health- profiles/data#page/1/gid/1938133217/pat/6/par/E12000005/ati/302/are/E06000021/yrr/1/cid/4/tbm/1 5. Marmot M, Allen J, Boyce T, et al. Health Equity in England: The Marmot Review 10 Years On. The Health Foundation; 2020. Available from: https://www.health.org.uk/publications/reports/the-marmot-review-10-year... 6. Public Health England. The impact of deprivation on cancer survival rates in England. 2023. Available from: https://www.gov.uk/government/publications/cancer-survival-in-england-na... 7. NHS England. The NHS Cancer Plan: A plan for investment, a plan for reform. 2000. Available from: https://www.nhs.uk/NHSEngland/NSF/Documents/Cancer%20Plan.pdf 8. Department of Health. Cancer Reform Strategy. 2007. Available from: htps://webarchive.nationalarchives.gov.uk/ukgwa/+/http:/www.dh.gov.uk/en/Publicationsandstatistics/Publications/PublicationsPoli... 9. NHS England. NHS England Cancer Programme Progress Update – Spring 2024. 2024. Available from: https://www.england.nhs.uk/long-read/nhs-england-cancer-programme-progre... 10. World Health Organization. Cancer prevention and control: WHO global strategy. 2024. Available from: https://www.who.int/health-topics/cancer#tab=tab_1 Competing interests: Stoke-on-Trent where the authors work has a higher level of deprivation compared to England and differences in cancer outcome between deprived and affluent areas is the corner stone of our BMJ rapid response. 04 March 2025 Padmanabhan Badrinath Interim Consultant in Public Health Medicine & Head of Health and Public Protection Division Hawra Abuali, Stephen Gunther. Stoke-on-Trent City Council Directorate of Public Health, Protection & Wellbeing, Stoke-on-Trent City Council, Civic Centre, Glebe Street, Stoke-on-Trent, ST4 1HH @ukbadri googletag.cmd.push(function() { googletag.display('div-gpt-ad-7326006-2'); }); googletag.cmd.push(function() { googletag.display('div-gpt-ad-7326006-3'); });"
