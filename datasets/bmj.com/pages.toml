["https://bmj.com/content/388/bmj.r129"]
title = "Ask an expert: HIV in primary care | The BMJ"
description = """
### What you need to know

### BMJ Learning

To obtain accredited continuous professional development points, subscribers to BMJ Learning can complete the full module at https://new-learning.bmj.com/course/30000120. The module contains seven additional questions submitted by users of BMJ Learning, related to general considerations in primary care, addressing common concerns, pre- and post-exposure prophylaxis, and considerations for HIV in pregnancy, healthcare workers, and the ageing population.

General practitioners with a special interest in HIV Surinder Singh, Daniel Ivens, and Sophie Mylan provide expert answers to questions from general practitioners related to identifying, testing, and caring for patients with suspected or confirmed HIV infection, identifying seroconversion illness and patients who present late in their disease course, and the principles of antiretroviral therapy. 

You see a new patient, a 31 year old woman, who tells you she was diagnosed with HIV infection two years ago. She has been seeing a specialist and is receiving antiretroviral therapy.

1.  Recommend she has a cervical smear test every two years

2.  Recommend vaccination for hepatitis B, irrespective of her hepatitis B status

3.  Recommend she receives seasonal influenza vaccine and pneumococcal conjugated vaccine

4.  Find out her CD4 count, and if it is less than 200 cells×103/L recommend she receives the measles, mumps, rubella (MMR) vaccine.

In England, an estimated 4700 people are undiagnosed with HIV.1 Offer testing wherever an opportunity arises. In our experience, multiple steps can be taken in primary care services to become more “HIV friendly.” …"""
full_description = "Practice Practice Pointer Ask an expert: HIV in primary care BMJ 2025; 388 doi: https://doi.org/10.1136/bmj.r129 (Published 03 February 2025) Cite this as: BMJ 2025;388:r129 Article Related content Metrics Responses Peer review Surinder Singh, senior academic general practitioner (retired)1, Daniel Ivens, general practitioner (former consultant in genito-urinary medicine)2, Sophie Mylan, general practitioner31Research Dept of Primary Care and Population Health, University College London, UK2Hampstead Group Practice, London3City & Hackney Integrated Primary Care CIC, LondonCorrespondence to S Singh s.singh2{at}ucl.ac.ukWhat you need to knowApproach HIV as you would any other long term condition. People living with HIV appreciate empathy, access to a named doctor, continuity, and good communication with specialistsKnowing the prevalence of HIV in your area of practice will help determine your policy on testingFor those with a negative HIV test result and a high risk exposure, consider repeating the test 45 days after the exposureBMJ LearningTo obtain accredited continuous professional development points, subscribers to BMJ Learning can complete the full module at https://new-learning.bmj.com/course/30000120. The module contains seven additional questions submitted by users of BMJ Learning, related to general considerations in primary care, addressing common concerns, pre- and post-exposure prophylaxis, and considerations for HIV in pregnancy, healthcare workers, and the ageing population.General practitioners with a special interest in HIV Surinder Singh, Daniel Ivens, and Sophie Mylan provide expert answers to questions from general practitioners related to identifying, testing, and caring for patients with suspected or confirmed HIV infection, identifying seroconversion illness and patients who present late in their disease course, and the principles of antiretroviral therapy.Test yourselfYou see a new patient, a 31 year old woman, who tells you she was diagnosed with HIV infection two years ago. She has been seeing a specialist and is receiving antiretroviral therapy.What do you need to consider?Recommend she has a cervical smear test every two yearsRecommend vaccination for hepatitis B, irrespective of her hepatitis B statusRecommend she receives seasonal influenza vaccine and pneumococcal conjugated vaccineFind out her CD4 count, and if it is less than 200 cells×103/L recommend she receives the measles, mumps, rubella (MMR) vaccine.What are the implications for primary care when you become aware of a patient being HIV positive?In England, an estimated 4700 people are undiagnosed with HIV.1 Offer testing wherever an opportunity arises. In our experience, multiple steps can be taken in primary care services to become more “HIV friendly.” … View Full Text Log in Log in using your username and password BMA Member Log In If you have a subscription to The BMJ, log in: Username * Password * Forgot your log in details? Need to activate Log in via institution Log in via OpenAthens Log in through your institution Subscribe from £184 * Subscribe and get access to all BMJ articles, and much more. Subscribe* For online subscription Access this article for 1 day for:£50 / $60/ €56 (excludes VAT) You can download a PDF version for your personal record. Buy this article"
