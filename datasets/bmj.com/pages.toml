["https://bmj.com/content/388/bmj.r39"]
title = "Children are bearing the brunt of violence in Gaza | The BMJ"
description = """
Children are facing the consequences of the conflict in Gaza. Ulrike Julia Wendt explains the IRC’s role in supporting children and families, and delivering life saving aid and essential services

The conflict in Gaza has been more than a geopolitical and humanitarian crisis—it is a profoundly human tragedy with severe consequences for an entire generation of Palestinian children and young people. Over a year of Israeli airstrikes, bombing, and ground level violence have killed more than 45 000 Palestinians and destroyed infrastructure and essential services. In the leadup to the recent ceasefire deal, which is in place at the time of writing, there had been no safe place left in Gaza. Families are struggling to meet their basic needs. Continuous attacks have obstructed humanitarian efforts, further limiting the delivery of crucial aid. The ceasefire is a critical moment to protect civilians, secure the release of hostages, and scale up humanitarian aid—a glimmer of hope to restore some sense of normalcy for families who have struggled to survive over the past fifteen months and to pave the way for lasting peace.

Today, almost all the 2.2 million people …"""
full_description = "Opinion Children are bearing the brunt of violence in Gaza BMJ 2025; 388 doi: https://doi.org/10.1136/bmj.r39 (Published 20 January 2025) Cite this as: BMJ 2025;388:r39 Donate now to The BMJ x IRC appeal 2024-25 Article Related content Metrics Responses Peer review Ulrike Julia Wendt, child protection coordinator, emergency response teamInternational Rescue Committee Children are facing the consequences of the conflict in Gaza. Ulrike Julia Wendt explains the IRC’s role in supporting children and families, and delivering life saving aid and essential servicesThe conflict in Gaza has been more than a geopolitical and humanitarian crisis—it is a profoundly human tragedy with severe consequences for an entire generation of Palestinian children and young people. Over a year of Israeli airstrikes, bombing, and ground level violence have killed more than 45 000 Palestinians and destroyed infrastructure and essential services. In the leadup to the recent ceasefire deal, which is in place at the time of writing, there had been no safe place left in Gaza. Families are struggling to meet their basic needs. Continuous attacks have obstructed humanitarian efforts, further limiting the delivery of crucial aid. The ceasefire is a critical moment to protect civilians, secure the release of hostages, and scale up humanitarian aid—a glimmer of hope to restore some sense of normalcy for families who have struggled to survive over the past fifteen months and to pave the way for lasting peace.Today, almost all the 2.2 million people in Gaza are in acute humanitarian need. Half of this population are children and young people who are bearing the brunt of these catastrophic conditions.12 As winter takes hold, children face additional risks from exposure, with cold temperatures exacerbating the poor living conditions in overcrowded and unsafe shelters.Through my work as emergency child protection coordinator in Gaza, I have seen children robbed of their childhoods amid the devastation.34 Beyond the death toll and the life changing injuries, the developmental harms caused by interrupted education, compromised nutrition, and severe psychological trauma threaten the future of this vulnerable population. Parents have told me that their children cannot stop crying and struggle to sleep because of continuous nightmares.The conflict has pushed the entire population of Gaza into severe food insecurity, with malnutrition and starvation disproportionately affecting children.5 The north of Gaza has been under constant siege by the Israeli military since October 2024 and the Integrated Food Security Phase Classification had warned that famine was imminent in some areas. Before the latest escalation of the conflict, an average of 500 trucks entered Gaza every day with humanitarian aid.6 Even this was insufficient to meet the needs of the population who have been subjected to extreme restrictions on the movement of goods and services. But in late 2024 the number of trucks entering Gaza each day had fallen to just 69. Children have been facing immediate hunger and irreversible developmental consequences. These include compromised cognitive and physical development that could jeopardise their long term health and ability to recover from this crisis.There are also an unprecedented number of unaccompanied and separated children. Over 17 000 children are estimated to be without their parents, although this figure is likely an undercount given ongoing chaos and displacements.78 Many children have been arriving at hospitals—injured, alone, and with no surviving family—prompting medical professionals to coin the term “WCNSF” (wounded child, no surviving family). These children, some of whom are now living in overwhelmed medical facilities, face heightened risks of neglect, child labour, sexual exploitation, and severe trauma as existing support systems collapse under the weight of demand. Each passing day exacerbates these risks further.Education, a cornerstone of childhood development, has been obliterated in Gaza. Schools, long targeted by violence, no longer serve as sanctuaries of learning or safety. This educational hiatus represents a profound developmental setback, with expert assessments suggesting that the cumulative impact of war and sustained trauma could delay children’s educational progression by up to five years.9 This systemic breakdown undermines their ability to envision—let alone achieve—a hopeful future.The International Rescue Committee welcomes the ceasefire in Gaza after almost five hundred days of conflict. The scars of this war will be long lasting, but a surge of aid is desperately needed to provide immediate relief to civilians. What is urgently needed now is for aid workers to have unhindered access to those in need to deliver food, medicine, and essential supplies, and begin supporting recovery efforts. Separated children must be reconnected with surviving relatives or placed in protective care. Rebuilding efforts should prioritise healthcare facilities, housing, and schools to create safe spaces for children to learn, heal, and socialise. The ceasefire terms will facilitate the return of a large, displaced population—around 1.9 million Palestinians—to their homes. It is essential to prioritise the clearance of explosive remnants in these areas. Efforts must also include raising awareness about precautions to take and ways to mitigate the risks posed by unexploded ordnance. Children are especially vulnerable, as they may not recognise explosive remnants or know how to respond if they encounter such objects.We have been working to support children and families in Gaza, delivering life saving aid and essential services. But the scale of this crisis demands collective action and generous financial contributions from individuals and institutions.Without action, the lasting impact of this humanitarian crisis threatens the future of children in Gaza and the trajectory of their families, communities, and society. The international community has a moral obligation to act decisively and compassionately to prevent a generational catastrophe.This is not simply a call to avert disaster but an urgent plea to preserve the right of every child in Gaza to live, grow, and thrive.International Rescue Committee and BMJ are partnering to raise funds for this crucial work. Please consider visiting rescue.org/BMJ to make a donation.FootnotesCompeting interests: Nothing to declareProvenance: commissioned, not externally peer reviewed References↵International Rescue Committee. Unaccompanied and separated children in Gaza. June 2024. www.rescue.org/report/unaccompanied-and-separated-children-gaza-executive-summary↵International Rescue Committee. Forgotten generation: after one year of conflict, the IRC warns of the life-long impacts for Gaza’s children. 9 October 2024. www.rescue.org/uk/press-release/forgotten-generation-after-one-year-conflict-irc-warns-life-long-impacts-gazas↵OCHA. Reported impact snapshot, Gaza Strip. 17 December 2024. www.ochaopt.org/content/reported-impact-snapshot-gaza-strip-17-december-2024↵UNICEF. State of Palestine humanitarian situation report no. 33, 30 November 2024. www.unicef.org/documents/state-palestine-humanitarian-situation-report-no33-30-november-2024↵Sah S, Dawas K. Israel is using starvation as a weapon of war in Gaza. BMJ2024;385:q1018. doi:10.1136/bmj.q1018 pmid:38719494OpenUrlFREE Full Text↵UNRWA. Situation report #152 on the humanitarian crisis in the Gaza Strip and the West Bank, including East Jerusalem. www.unrwa.org/resources/reports/unrwa-situation-report-152-situation-gaza-strip-and-west-bank-including-east-jerusalem↵UNICEF. Stories of loss and grief: At least 17 000 children are estimated to be unaccompanied or separated from their parents in the Gaza Strip. 2 February 2024. www.unicef.org/press-releases/stories-loss-and-grief-least-17000-children-are-estimated-be-unaccompanied-or↵International Rescue Committee. Gaza: the IRC warns of alarming gap in care for unaccompanied and separated children in Gaza. www.rescue.org/press-release/gaza-irc-warns-alarming-gap-care-unaccompanied-and-separated-children-gaza↵UNRWA. Ongoing war in Gaza will set children and young people’s education back by up to five years, report suggests. 25 September 2024. www.unrwa.org/newsroom/notes/ongoing-war-gaza-will-set-children-and-young-people%E2%80%99s-education-back-five-years"
