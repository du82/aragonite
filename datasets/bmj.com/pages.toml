full_description = "When publishing personal information about identifiable living patients, we require a signed copy of our patient consent permission form. This form is available as a pdf and in multiple languages. Authors should seek the patient's consent to publication before submitting any article. Please save and print the form, then show the patient the version of the article that you are submitting and, if they give permission for publication, please ask them (or, as appropriate, their next of kin - in which case please explain this on the form) to sign the form. Then send the completed form to us. You can do this in either one of two ways: • Scan the signed and completed form into your computer and then email it to us as an attachment; • Scan the signed and completed form into your computer and then upload it to our online editorial office as a 'Supplementary file for Editors only' when submitting. Patient consent form (English)Patient consent form (Arabic)Patient consent form (Bengali)Patient consent form (Chinese Simplified) Patient consent form (Chinese Traditional) Patient consent form (Dutch) Patient consent form (French) Patient consent form (German) Patient consent form (Hebrew) Patient consent form (Greek) Patient consent form (Hindi) Patient consent form (Italian) Patient consent form (Japanese) Patient consent form (Khmer) Patient consent form (Korean) Patient consent form (Nepali) Patient consent form (Polish) Patient consent form (Portuguese) Patient consent form (Romanian) Patient consent form (Russian) Patient consent form (Spanish) Patient consent form (Thai) Patient consent form (Turkish) Our policy is based on the UK's data protection law and the English common law of confidentiality. UK authors should be aware that the General Medical Council has extensive guidance on patient consent and confidentiality and that our policy is in line with GMC advice. • Any article that contains personal medical information about an identifiable living individual requires the patient's explicit consent before we can publish it. We will need the patient to sign our consent form, which requires the patient to have read the article. If the patient has not seen a final version of the manuscript to be submitted to BMJ, the form must be amended to make clear what the patient has seen and that they have agreed to publication without having seen the final version of the manuscript. The consent form is available in multiple languages and the author must ensure that the form is in a language that the patient understands."
