["https://bmj.com/content/388/bmj.r226/rr-0"]
title = "Racialised health inequalities in maternity care | The BMJ"
full_description = "Article Related content Article metrics Rapid responses Response Rapid Response: Racialised health inequalities in maternity care Dear Editor Whilst the inequalities in outcomes for pregnant women and babies from black and Asian backgrounds have been improving, these inequalities still persist and are present in Scotland. [1] In Scotland, a short-life working group on Racialised Health Inequalities in Maternity Care was established in January 2023. It took a co-production approach, underpinned by data and evidence, and identified three key deliverables: [2] • Deliverable 1: Action Plan; • Deliverable 2: Best Practice Toolkit for Working with Interpreters in Maternity and Neonatal Services; • Deliverable 3: Scoping of Data and Evidence. Across Scotland, we are fortunate to have organisations, such as Amma Birth Companions (a Glasgow charity that supports women and birthing people from migrant backgrounds) [3] and KWISA, Women of African Descent in Scotland (an African women-led organisation based in Edinburgh), [4] advocating for and amplifying the voices of women and families from racialised and marginalised communities. We must continue to listen carefully to those with living expertise and create and maintain the conditions for meaningful feedback and participation. The title of the recent report by KWISA – ‘Nothing About Us Without Us’ – is a powerful reminder of this. [5] NHS Board Delivery Plan Guidance 2025/26 from the Scottish Government highlights tackling racialised health inequalities in maternity care as a specific planning priority. NHS Boards will therefore be expected to report to the Scottish Government on progress towards both developing and delivering actions in maternity services within their anti-racism plans. [6] Disparities in outcomes and experiences for women and babies from minority ethnic communities are unacceptable. It is incumbent on us to understand those disparities and identify meaningful action to address them. Maternity services meet women and families at a unique window in their lives and have the opportunity to provide women and their babies with the best possible start in life. [2] References [1] Linton S. Why are black women still more likely to die in childbirth? BMJ 2025;388:r226. doi: 10.1136/bmj.r226 pmid: 39978819 [2] Scottish Government. Maternity Services Policy: Racialised Health Inequalities Action Plan, Interpretation Toolkit and Evidence and Data Resource (Annex A – C); Pathway of Maternity Care clinical guidance and schedule and information leaflet on Birthplace Decisions (Annex D – E); and Miscarriage Framework and Progesterone Pathway (Annex F – G). 6 February 2025. www.publications.scot.nhs.uk/files/dl-2025-02.pdf [3] Amma Birth Companions. https://ammabirthcompanions.org [4] KWISA. https://kwisa.org.uk [5] KWISA. Nothing About Us Without Us. Women of African and Caribbean Heritage Community Voices Report. November 2024. https://kwisa.org.uk/nauwu-maternity [6] Scottish Government. NHS Board Delivery Plan Guidance 2025/26. 28 November 2024. www.nhsaaa.net/wp-content/uploads/2025-02-03-BM-P13-Delivery-Plan-2025-2... Competing interests: No competing interests 04 March 2025 C Albert Yeung Consultant in Dental Public Health Karen Conduit-Turner, Public Health Registrar ST4, Directorate of Public Health, NHS Tayside, King's Cross, Dundee, DD3 8EA, UK NHS Lanarkshire Kirklands, Fallside Road, Bothwell G71 8BB, UK googletag.cmd.push(function() { googletag.display('div-gpt-ad-7326006-2'); }); googletag.cmd.push(function() { googletag.display('div-gpt-ad-7326006-3'); });"
