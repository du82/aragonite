title = "FUTURE-AI: international consensus guideline for trustworthy and deployable artificial intelligence in healthcare | The BMJ"
description = """
Despite major advances in artificial intelligence (AI) research for healthcare, the deployment and adoption of AI technologies remain limited in clinical practice. This paper describes the FUTURE-AI framework, which provides guidance for the development and deployment of trustworthy AI tools in healthcare. The FUTURE-AI Consortium was founded in 2021 and comprises 117 interdisciplinary experts from 50 countries representing all continents, including AI scientists, clinical researchers, biomedical ethicists, and social scientists. Over a two year period, the FUTURE-AI guideline was established through consensus based on six guiding principles—fairness, universality, traceability, usability, robustness, and explainability. To operationalise trustworthy AI in healthcare, a set of 30 best practices were defined, addressing technical, clinical, socioethical, and legal dimensions. The recommendations cover the entire lifecycle of healthcare AI, from design, development, and validation to regulation, deployment, and monitoring.

In the field of healthcare, artificial intelligence (AI)—that is, algorithms with the ability to self-learn logic—and data interactions have been increasingly used to develop computer aided models, for example, disease diagnosis, prognosis, prediction of therapy response or survival, and patient stratification.1 Despite major advances, the deployment and adoption of AI technologies remain limited in real world clinical practice. In recent years, concerns have been raised about the technical, clinical, ethical, and societal risks associated with healthcare AI.23 In particular, existing research has shown that AI tools in healthcare can be prone to errors and patient harm, biases and increased health inequalities, lack of transparency and accountability, as well as data privacy and security breaches.45678

To increase adoption in the real world, it is essential that AI tools are trusted and accepted by patients, clinicians, health organisations, and authorities. However, there is an absence of clear, widely accepted guidelines on how healthcare AI tools should be designed, developed, evaluated, and …"""
full_description = "Research Methods & Reporting FUTURE-AI: international consensus guideline for trustworthy and deployable artificial intelligence in healthcare BMJ 2025; 388 doi: https://doi.org/10.1136/bmj-2024-081554 (Published 05 February 2025) Cite this as: BMJ 2025;388:e081554 Article Related content Metrics Responses Peer review This article has a correction. Please see:FUTURE-AI: international consensus guideline for trustworthy and deployable artificial intelligence in healthcare - February 17, 2025 Karim Lekadir, professor12, Alejandro F Frangi, professor34, Antonio R Porras, assistant professor5, Ben Glocker, professor6, Celia Cintas, research scientist7, Curtis P Langlotz, professor8, Eva Weicken, chief medical officer9, Folkert W Asselbergs, professor1011, Fred Prior, professor12, Gary S Collins, professor13, Georgios Kaissis, senior lecturer14, Gianna Tsakou, senior project manager15, Irène Buvat, director of research16, Jayashree Kalpathy-Cramer, professor17, John Mongan, professor18, Julia A Schnabel, professor19, Kaisar Kushibar, assistant professor1, Katrine Riklund, professor20, Kostas Marias, professor21, Lameck M Amugongo, postdoctoral researcher22, Lauren A Fromont, program officer23, Lena Maier-Hein, professor24, Leonor Cerdá-Alberich, associate professor25, Luis Martí-Bonmatí, professor26, M Jorge Cardoso, reader professor27, Maciej Bobowicz, assistant professor28, Mahsa Shabani, assistant professor29, Manolis Tsiknakis, professor21, Maria A Zuluaga, senior lecturer30, Marie-Christine Fritzsche, research fellow31, Marina Camacho, researcher1, Marius George Linguraru, professor32, Markus Wenzel, senior scientist9, Marleen De Bruijne, professor33, Martin G Tolsgaard, professor34, Melanie Goisauf, senior scientist35, Mónica Cano Abadía, senior scientist35, Nikolaos Papanikolaou, research group leader36, Noussair Lazrak, postdoctoral researcher1, Oriol Pujol, professor1, Richard Osuala, doctoral student1, Sandy Napel, professor37, Sara Colantonio, senior researcher38, Smriti Joshi, doctoral student1, Stefan Klein, associate professor33, Susanna Aussó, AI programme coordinator39, Wendy A Rogers, professor40, Zohaib Salahuddin, postdoctoral researcher41, Martijn P A Starmans, assistant professor33 on behalf of the FUTURE-AI Consortium1Artificial Intelligence in Medicine Lab (BCN-AIM), Departament de Matemàtiques i Informàtica, Universitat de Barcelona, Barcelona, Spain2Institució Catalana de Recerca i Estudis Avançats (ICREA), Barcelona, Spain3Center for Computational Imaging & Simulation Technologies in Biomedicine, Schools of Computing and Medicine, University of Leeds, Leeds, UK4Medical Imaging Research Centre (MIRC), Cardiovascular Science and Electronic Engineering Departments, KU Leuven, Leuven, Belgium5Department of Biostatistics and Informatics, Colorado School of Public Health, University of Colorado Anschutz Medical Campus, Aurora, CO, USA6Department of Computing, Imperial College London, London, UK7IBM Research Africa, Nairobi, Kenya8Departments of Radiology, Medicine, and Biomedical Data Science, Stanford University School of Medicine, Stanford, CA, USA9Fraunhofer Heinrich Hertz Institute, Berlin, Germany10Amsterdam University Medical Centers, Department of Cardiology, University of Amsterdam, Amsterdam, Netherlands11Health Data Research UK and Institute of Health Informatics, University College London, London, UK12Department of Biomedical Informatics, University of Arkansas for Medical Sciences, Little Rock, AR, USA13Centre for Statistics in Medicine, University of Oxford, Oxford, UK14Institute for AI and Informatics in Medicine, Klinikum rechts der Isar, Technical University Munich, Munich, Germany15Gruppo Maggioli, Research and Development Lab, Athens, Greece16Institut Curie, Inserm, Orsay, France17Massachusetts General Hospital, Harvard Medical School, Boston, MA, USA18Department of Radiology and Biomedical Imaging, University of California San Francisco, San Francisco, CA, USA19Institute of Machine Learning in Biomedical Imaging, Helmholtz Center Munich, Munich, Germany20Department of Radiation Sciences, Diagnostic Radiology, Umeå University, Umeå, Sweden21Foundation for Research and Technology—Hellas (FORTH), Crete, Greece22Department of Software Engineering, Namibia University of Science & Technology, Windhoek, Namibia23Centre for Genomic Regulation, Barcelona Institute of Science and Technology, Barcelona, Spain24Division of Intelligent Medical Systems, German Cancer Research Centre, Heidelberg, Germany25Biomedical Imaging Research Group, La Fe Health Research Institute, Valencia, Spain26Medical Imaging Department, Hospital Universitario y Politécnico La Fe, Valencia, Spain27School of Biomedical Engineering & Imaging Sciences, King's College London, London, UK282nd Division of Radiology, Medical University of Gdansk, Gdansk, Poland29Faculty of Law and Criminology, Ghent University, Ghent, Belgium30Data Science Department, EURECOM, Sophia Antipolis, France31Institute of History and Ethics in Medicine, Technical University of Munich, Munich, Germany32Sheikh Zayed Institute for Pediatric Surgical Innovation, Children’s National Hospital, Washington DC, USA33Department of Radiology & Nuclear Medicine, Erasmus MC University Medical Centre, Rotterdam, Netherlands34Copenhagen Academy for Medical Education and Simulation Rigshospitalet, University of Copenhagen, Copenhagen, Denmark35BBMRI-ERIC, ELSI Services & Research, Graz, Austria36Computational Clinical Imaging Group, Champalimaud Foundation, Lisbon, Portugal37Integrative Biomedical Imaging Informatics at Stanford (IBIIS), Department of Radiology, Stanford University, Stanford, CA, USA38Institute of Information Science and Technologies of the National Research Council of Italy, Pisa, Italy39Artificial Intelligence in Healthcare Program, TIC Salut Social Foundation, Barcelona, Spain40Department of Philosophy, and School of Medicine, Macquarie University, Sydney, Australia41The D-lab, Department of Precision Medicine, GROW—School for Oncology and Reproduction, Maastricht University, Maastricht, NetherlandsCorrespondence to: K Lekadir karim.lekadir{at}ub.eduAccepted 10 January 2025Despite major advances in artificial intelligence (AI) research for healthcare, the deployment and adoption of AI technologies remain limited in clinical practice. This paper describes the FUTURE-AI framework, which provides guidance for the development and deployment of trustworthy AI tools in healthcare. The FUTURE-AI Consortium was founded in 2021 and comprises 117 interdisciplinary experts from 50 countries representing all continents, including AI scientists, clinical researchers, biomedical ethicists, and social scientists. Over a two year period, the FUTURE-AI guideline was established through consensus based on six guiding principles—fairness, universality, traceability, usability, robustness, and explainability. To operationalise trustworthy AI in healthcare, a set of 30 best practices were defined, addressing technical, clinical, socioethical, and legal dimensions. The recommendations cover the entire lifecycle of healthcare AI, from design, development, and validation to regulation, deployment, and monitoring.IntroductionIn the field of healthcare, artificial intelligence (AI)—that is, algorithms with the ability to self-learn logic—and data interactions have been increasingly used to develop computer aided models, for example, disease diagnosis, prognosis, prediction of therapy response or survival, and patient stratification.1 Despite major advances, the deployment and adoption of AI technologies remain limited in real world clinical practice. In recent years, concerns have been raised about the technical, clinical, ethical, and societal risks associated with healthcare AI.23 In particular, existing research has shown that AI tools in healthcare can be prone to errors and patient harm, biases and increased health inequalities, lack of transparency and accountability, as well as data privacy and security breaches.45678To increase adoption in the real world, it is essential that AI tools are trusted and accepted by patients, clinicians, health organisations, and authorities. However, there is an absence of clear, widely accepted guidelines on how healthcare AI tools should be designed, developed, evaluated, and deployed to be trustworthy—that is, technically robust, clinically safe, ethically sound, and legally compliant (see glossary in appendix table 1).9 To have a real impact at scale, such guidelines for responsible and trustworthy AI must be obtained through wide consensus involving international and interdisciplinary experts.In other domains, international consensus guidelines have made lasting impacts. For example, the FAIR guideline10 for data management has been widely adopted by researchers, organisations, and authorities, as the principles provide a structured framework for standardising and enhancing the tasks of data collection, curation, organisation, and storage. Although it can be argued that the FAIR principles do not cover every aspect of data management because they focus more on findability, accessibility, interoperability, and reusability of the data, and less on privacy and security, they delivered a code of practice that is now widely accepted and applied.AI in healthcare has unique properties compared with other domains, such as the special trust relation between doctors and patients, because patients themselves generally do not have the opportunity to objectively assess the diagnosis and treatment decisions of doctors. This dynamic underscores the need for AI systems to be not only technically robust and clinically safe, but also ethically sound and transparent, ensuring that they complement the trust patients place in their healthcare providers. However, compared with non-AI tools, the highly complicated underlying data processing frequently comes with a lack of transparency into the exact working mechanisms. Unlike medical equipment, AI currently lacks universally accepted measures for quality assurance. Compared with chat assistants and synthetic image generators that receive increased public interaction, healthcare is a more sensitive domain where errors can have major consequences. Addressing these specific gaps for the healthcare domain is therefore crucial for trustworthy AI.Initial efforts have focused on providing recommendations for the reporting of AI studies for different medical domains or clinical tasks (eg, TRIPOD+AI,11 CLAIM,12 CONSORT-AI,13 DECIDE-AI,14 PROBAST-AI,15 CLEAR16). These guidelines do not provide best practices for the actual development and deployment of the AI tools, but promote standardised and complete reporting of their development and evaluation. Recently, several researchers have published promising ideas on possible best practices for healthcare AI.1718192021222324 However, these proposals have not been established through wide international consensus and do not cover the whole lifecycle of healthcare AI (ie, from design, development, and validation to deployment, usage, and monitoring).In other initiatives, the World Health Organization published a report focused on key ethical and legal challenges and considerations. Because it was intended for health ministries and governmental agencies, it did not explore the technical and clinical aspects of trustworthy AI.25 Likewise, Europe’s High-Level Expert Group on Artificial Intelligence established a comprehensive self-assessment checklist for AI developers. However, it covered AI in general and did not address the unique risks and challenges of AI in medicine and healthcare.26This paper addresses an important gap in the field of healthcare AI by delivering the first structured and holistic guideline for trustworthy and ethical AI in healthcare, established through wide international consensus and covering the entire lifecycle of AI. The FUTURE-AI Consortium was started in 2021 and currently comprises 117 international and interdisciplinary experts from 50 countries (fig 1), representing all continents (Europe, North America, South America, Asia, Africa, and Oceania). Additionally, the members represent a variety of disciplines (eg, data science, medical research, clinical medicine, computer engineering, medical ethics, social sciences) and data domains (eg, radiology, genomics, mobile health, electronic health records, surgery, pathology). To develop the FUTURE-AI framework, we drew inspiration from the FAIR principles for data management, and defined concise recommendations organised according to six guiding principles—fairness, universality, traceability, usability, robustness, and explainability (fig 2).Fig 1 Geographical distribution of the multidisciplinary expertsDownload figure Open in new tab Download powerpoint Fig 2 Organisation of the FUTURE-AI framework for trustworthy artificial intelligence (AI) according to six guiding principles—fairness, universality, traceability, usability, robustness, and explainabilityDownload figure Open in new tab Download powerpoint Summary pointsDespite major advances in medical artificial intelligence (AI) research, clinical adoption of emerging AI solutions remains challenging owing to limited trust and ethical concernsThe FUTURE-AI Consortium unites 117 experts from 50 countries to define international guidelines for trustworthy healthcare AIThe FUTURE-AI framework is structured around six guiding principles: fairness, universality, traceability, usability, robustness, and explainabilityThe guideline addresses the entire AI lifecycle, from design and development to validation and deployment, ensuring alignment with real world needs and ethical requirementsThe framework includes 30 detailed recommendations for building trustworthy and deployable AI systems, emphasising multistakeholder collaborationContinuous risk assessment and mitigation are fundamental, addressing biases, data variations, and evolving challenges during the AI lifecycleFUTURE-AI is designed as a dynamic framework, which will evolve with technological advancements and stakeholder feedbackMethodsFUTURE-AI is a structured framework that provides guiding principles and step-by-step recommendations for operationalising trustworthy and ethical AI in healthcare. This guideline was established through international consensus over a 24 month period using a modified Delphi approach.2728 The process began with the definition of the six core guiding principles, followed by an initial set of recommendations, which were then subjected to eight rounds of extensive feedback and iterative discussions aimed at reaching consensus. We used two complementary methods to aggregate the results: a quantitative approach, which involved analysing the voting patterns of the experts to identify areas of consensus and disagreement; and a qualitative approach, focusing on the synthesis of feedback and discussions based on recurring themes or new insights raised by several"
