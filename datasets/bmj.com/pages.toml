full_description = "The BMJ is defined by its mission: to work towards a healthier world for all. We share that global endeavour with millions of readers working in clinical practice, research, education, government, and with patients and the public too. This mission defines us, far more than the format of our content. After nearly 180 years, our print edition still thrives, and has been joined by podcast, video, tweet, app, website and live events. But, as each of these formats gains ground or declines in importance, the things The BMJ cares about will endure: • Improving the creation and dissemination of research evidence • Improving clinical education and practice • Advocating for universal, equitable, high quality healthcare • Championing the health and wellbeing of doctors • Improving the social and environmental determinants of health While pursuing these goals, we commit to partnering with patients and the public to ensure their best interests are served; and to being as transparent and accountable as possible in everything we do. The BMJ can be many things to its diverse audiences: an international research journal, a member magazine, a think tank, an investigative campaigner, an educational resource, even a trusted and inspiring friend. Whatever The BMJ means to you, we invite you to share our mission and join us in working towards a healthier world for all. Detailed information about The BMJ's publishing model and editorial processes, including peer review, acceptance rate, revenue, and open access policies. At The BMJ, we offer authors the opportunity to submit a range of article types. Detailed author instructions and resources to help you find an article style that suits your work. Find out more about The BMJ's complaints procedure, and how to get in touch with us to raise any issues. BMJ Company, publisher of The BMJ The International Committee of Medical Journal EditorsWorld Association of Medical EditorsCommittee on Publication EthicsEQUATOR NetworkC