title = "Health in South Asia | The BMJ"
full_description = '''The BMJ's collection on "Health in South Asia" brings together leading health experts from across the region to discuss health priorities and advance the health agenda for the future. South Asia represents a vibrant, dynamic, and fast growing region of the world and is home to nearly a quarter of the world's population. The collection tracks progress on the core health issues of maternal and child health, infectious diseases, and access to health. The region has witnessed rapid urbanisation with a concurrent rise in non-communicable diseases, smoking, mental illnesses, and injuries. Conflicts, natural disasters, and infectious disease outbreaks periodically stall progress on health indicators, leaving the populations in this region vulnerable to their impact. The private health sector has grown rapidly while public health services remain too fragmented, under-financed, and over-burdened to meet the needs of the majority. In this collection, authors from India, Pakistan, Nepal, Bangladesh, Sri Lanka, and Afghanistan collaborate to identify evidence based solutions to shape health policy and interventions, and drive innovations and research in the region. This collection renews our commitment to engage with the people of South Asia, the healthcare community, and governments, and provides a platform to discuss and debate solutions and work together to advance health, peace, and development in the region. A long term strategy is vital to build on the impact of community health workers in achieving universal health coverage, say Zulfiqar Bhutta and colleagues Alayne Adams and colleagues propose a framework that emphasises actions on urban health governance and the social determinants of health to achieve universal health coverage in South Asian cities Increased public financing for primary care and medical education as well as regulation of private services are vital to tackle the primary care crisis in South Asia, argue Amit Sengupta and colleagues Paediatricians and public health experts describe the three main forms of undernutrition and provide a clinical update on the epidemiology, diagnosis, and management of these conditions.'''
