["https://bobmalone.com"]
title = "Bob Malone – Keyboard Wizard"
full_description = '''"Bob Malone doesn't just accompany himself on piano. He supports his singing with pulsating, roaring keyboard work that grabs you and shakes you until you cry for mercy." — KEYBOARD MAGAZINE “I first heard him at a WWOZ piano night years ago; his combination of piano skills, witty original songs and lunatic stage energy was totally winning." — OFFBEAT MAGAZINE "Keyboardist Bob Malone may have been the best musician on the stage outside of Mr. Fogerty himself. " — PITTSBURGH POST-GAZETTE "Wondering why nobody writes songs like your old favorites — (the songs) that fueled the soundtrack of your youth? Bob Malone is the kind of guy that could make you weep." — THE PALM BEACH POST Called a “keyboard wizard” by The New Yorker, singer-songwriter-keyboardist-composer BOB MALONE has amassed a loyal international fan-base through twenty-five years of relentless touring and nine critically acclaimed album releases. He played keyboards with John Fogerty for 13 years, has been a session player for Ringo Starr and Avril Lavigne and his duo shows with fellow keyboard wiz and multiple BMA award winner Deanna Bogart are legendary. His recording of “You’re A Mean One, Mr. Grinch” was the theme in the 2018 Illumination/Universal movie trailers for The Grinch. Bob combines unforgettable songwriting, refreshing reinterpretations of classic tunes, and a one-of-a-kind hybrid of rock, melodic pop, blues, and New Orleans R&B, delivered with high-energy piano virtuosity and a voice all his own. His last four albums, including the latest – Good People – have been in the top-10 Roots Music Report radio rock and blues charts, #1 on the IBBA UK blues chart, and his piano-driven take on Fleetwood Mac’s “Oh Well” spent two years on the SiriusXM Bluesville Top-50 Most Heard chart.'''
