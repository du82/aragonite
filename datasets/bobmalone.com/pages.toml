["https://bobmalone.com/about"]
title = "About – Bob Malone"
full_description = "Called “a keyboard wizard” by The New Yorker, Bob Malone has amassed a loyal international fan-base through nearly 30 years of touring and nine critically acclaimed album releases. He played keyboards with John Fogerty for 12 years, and has been a session player for Ringo Starr and Avril Lavigne. His recording of “You’re A Mean One, Mr. Grinch” was the theme in the Illumination/ Universal movie trailers for “The Grinch,” heard by millions. Bob combines unforgettable songwriting with an eclectic hybrid of high-energy rock, uptown blues, melodic piano pop, New Orleans R&B, jazz chops and a voice all his own. His latest album is “Good People.” Bob’s four touring bands are made up of all-star players from around the globe and include A-list session players in Los Angeles, New York, New Orleans, and Rome. Artists his bands have toured and recorded with include The Neville Brothers, Journey, Tom Petty, Bruce Springsteen, Joe Cocker, Jerry Douglas, Gino Vannelli, Joe Sample, and Claudio Baglioni. Add to this the gospel-powered Malonettes background singers and it adds up to a high energy, eclectic hybrid of rock, blues, melodic piano pop, and New Orleans R&B, with a light dusting of jazz chops all around. The Bob Malone Band plays worldwide, including sets at Umbria Jazz Festival (Italy), HB Town Music Festival (China) Glastonbury Music Festival (UK), The Great British Rhythm & Blues Festival (UK), Long Beach Bayou Fest (US), Falcon Ridge Folk Fest (US), Beersel Blues Rock Festival (Belgium), Blue Mountains Music Fest (AU), and venues like Iridium (NYC), House Of Blues (New Orleans, Chicago), Wilshire-Ebell Theatre (Los Angeles), The 100 Club (London), Sellersville Theatre (PA), Biscuits & Blues (San Francisco), Crested Butte Center For The Arts (CO), and The Basement (Sydney). The magic and energy of Bob’s band shows are captured in full on his Mojo Live album and DVD, captured live at the Grand Annex Theatre in Los Angeles. When not touring with his band or with John Fogerty, Bob Malone brings his solo show to acoustic listening rooms, small theaters and house concerts around the world. Just Bob, a piano, a microphone and a stompbox, the show has the high energy impact of a full band performance combined with storytelling and pin-drop ballad singing in the best of the troubadour tradition."
year_published = 2025
