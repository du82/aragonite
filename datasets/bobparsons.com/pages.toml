["http://bobparsons.com/fire-in-the-hole"]
title = "Fire In The Hole! - Bob Parsons"
description = "Fire In The Hole! The untold story of my traumatic life and explosive success. A new book by Bob Parsons. Available for pre-order now!"
full_description = '''Fire In The Hole! A New Book From Bob Parsons The untold story of my traumatic life and explosive success. Order Now Fire In The Hole! A New Book From Bob Parsons The untold story of my traumatic life and explosive success. Order Now Notable Reviews As the title of this book, Fire in the Hole!, suggests, Bob has dodged a lot of grenades in life, but it was more than luck that led him to where he is today. Bob’s story touched me personally, and I enthusiastically recommend this book to others to gain insight on their own personal journey to reaching success in life." CARLTON W. KENT 16th Sergeant Major of the Marine Corps As you probably know, Bob Parsons and I are both PASSIONATE about golf. What you may not know is that the life Bob has lived is EXTREME. His memoir, Fire in the Hole!, reveals all the outrageous ups and downs, the close calls he’s had, and the far-out ideas he’s made insanely profitable. I can’t sing the praises of this book enough. You’ll see the man behind the extraordinary success and the heart inside that man—basically, everything in the front nine that set him up for this double eagle." NICK JONAS award-winning actor, singer, and songwriter One of my favorite parts about my friendship with Bob is that we both argue that the other is the reason for our success. This is insight into Bob’s remarkable character. He is one of the most interesting, bold, honest, and kind human beings I have ever met! We made so many memories with racing and GoDaddy, and I am proud to be even a single chapter of his fascinating life. I have learned so many life and business lessons from Bob, and I am sure you will too!" DANICA PATRICK former professional IndyCar and NASCAR driver, first woman to win an IndyCar Series race You’ve got to love Bob Parsons. Not only did he conquer a challenging childhood, but he also fearlessly dove into the chaos of war, taking hits along the way like a true action movie hero. And let’s not forget how he shook up the business world, leaving his mark on society and giving us all a lesson in innovation. Oh, and those Super Bowl ads? Talk about turning the advertising world upside down! Fire in the Hole! is not your typical memoir. It’s hilariously funny, heartwarming, inspiring, and authentically Bob throughout. So what are you waiting for? Get ready to laugh, cry, and be amazed by the incredible journey of Bob Parsons!" JADA PINKETT SMITH talk show host and actress Bob Parsons is an American original. He is a visionary and inspiration and has the stories to prove it. Fire in the Hole! is as interesting and outrageous as the man himself." ROB LOWE actor, producer, author // init reviews swiper const reviews_swiper = new Swiper('.reviews-swiper', { slidesPerView: 1, spaceBetween: 300, direction: 'horizontal', loop: true, // Navigation arrows navigation: { nextEl: '.swiper-button-next', prevEl: '.swiper-button-prev', }, }); IN BOB’S OWN WORDS About The Book In Fire in the Hole!, Bob Parsons, founder of GoDaddy, shares his story of extraordinary success as a self-made serial entrepreneur. Born in the tough town of East Baltimore to parents who were inveterate gamblers, billionaire philanthropist Bob Parsons’ early years were marked by hardship and financial struggle. While he vowed his family (if he ever had one) would never lack for anything, he never imagined the wealth he would earn as the founder of Parsons Technology, GoDaddy, PXG Golf, and YAM Worldwide. In his literary debut, Fire in the Hole!, Bob recounts the exploits of his youth, his hellish and hilarious days at the mercy of Catholic school nuns, his harrowing tour of combat duty in Vietnam as a US Marine, his pioneering contributions to the software and internet industries, and his latest ventures in powersports, golf, real estate, and marketing. Along the way, Bob copes with his mother’s mental illness and his father’s struggles, battles PTSD resulting from both his childhood and war traumas, and mounts a quest to find new and effective treatments for himself and others who suffer from this affliction. He strongly supports veterans organizations and awarded grants to more than ninety-six charities and organizations worldwide through The Bob & Renee Parsons Foundation. Perhaps the only thing that has come easy to Parsons is his gift for storytelling. His reflections are at turns heartbreaking, heartwarming, hilarious, and inspiring. If ever there was a story about a self-made man whose wealth can be measured more by the contents of his heart than by the contents of his bank account, this is it. More than anything, Fire in the Hole! is a “can’t put down,” damn good read! Order Now'''
