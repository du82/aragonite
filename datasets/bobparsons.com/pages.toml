["https://bobparsons.com/giving"]
title = "Giving - Bob Parsons"
full_description = "The Bob & Renee ParsonsFoundation The Bob & Renee ParsonsFoundation The Bob & Renee Parsons Foundation was formed in 2012 to reach low-income and underserved populations, marginalized communities and causes often overlooked or underfunded by mainstream philanthropy. Dealing in the areas of homelessness, medical care, at-risk youth, education and the needs of wounded veterans and military families, The Foundation provides transformational gifts to nonprofit organizations that are successfully addressing these issues and can demonstrate and measure the impact of their work. WE DEAL IN HOPE. To date, The Foundation has awarded over $296 million to more than 160 partner organizations, helping thousands of people improve their quality of life and receive the support they so greatly deserve. Believing that their work in philanthropy makes the greatest impact, Bob and Renee signed the Giving Pledge in 2013, making a public declaration to give away at least half their net worth. 4 Areas Of Giving 4 4 167 Partners 566 Grants"
