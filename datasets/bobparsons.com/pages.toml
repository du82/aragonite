title = "Home - Bob Parsons"
full_description = "Fire In The Hole! A New Book From Bob Parsons The untold story of my traumatic life and explosive success. Order Now Learn More American Business Guy Failed the 5th Grade U.S. Marine Corps Vietnam Combat Vet Motorcycle rider & Golf Nut who’s all about enjoying the ride Bio Social American Business Guy Failed the 5th Grade U.S. Marine Corps Vietnam Combat Vet Motorcycle rider & Golf Nut who’s all about enjoying the ride Bio Social Bio: The quick version Grew up poor as a church mouse. Failed the 5th grade. Barely passed High School. Fought in the Vietnam War as a U.S. Marine Corps 0311. Graduated University of Baltimore Magna Cum Laude. CPA. Runs 14 businesses that do ok. More Follow Me Social At Work Bob’s business interests run the gamut – from golf clubs and motorcycle dealerships to real estate lending, custom furniture, advertising and video production. The Bob & Renee Parsons Foundation The Bob & Renee Parsons Foundation inspires hope by providing critical funding at critical times to organizations striving to make a difference. While we are primarily focused on needs in the Greater Phoenix area, we are also committed to funding nonprofits that benefit military veterans and first responders. Visit The Bob & Renee Parsons FoundationPXG (Parsons Xtreme Golf) PXG golf clubs are engineered with no cost or time constraints for golfers who demand the very best. We care about only one thing: performance. Our patented technologies deliver game-changing distance, forgiveness, accuracy, and feel. All PXG clubs are made to exacting standards and help golfers of all skill levels enjoy the game more. Visit PXGHarleyDavidson of Scottsdale, AZ Harley-Davidson of Scottsdale is the largest Harley dealership in North America. The 150,000 square-foot facility was designed to be a true entertainment space and includes a tattoo and piercing parlor, wedding chapel and movie theater. Harley-Davidson of Scottsdale is a Top 50 Dealership as awarded by Powersports Business and Top 100 Dealer as awarded by Dealernews Magazine. Visit Harley-Davidson of Scottsdale, AZScottsdale National Golf Club Scottsdale National Golf Club is an exclusive, members-only golf club located in the McDowell Mountain Range and surrounded by thousands of acres of pristine wilderness. Our championship 18-hole Mine Shaft Course is classically designed, offering a unique and tranquil setting with picturesque views in every direction. Combined with the unforgettable 18-hole experience, The Other Course, and the dramatic Par 3 course, The Bad Little Nine, we now offer you 45 holes of unique and exhilarating golf. Visit SNGCGo AZ Motorcycles GO AZ Motorcycles, with locations in Scottsdale and Peoria, is one of the premier dealers of BMW, Ducati, Triumph, Honda, Kawasaki, KTM, Ural, Vespa and Aprilia in Scottsdale, Phoenix, Mesa and the surrounding areas. VIsit GO AZYam Properties YAM Properties owns and operates commercial real estate in the Greater Phoenix area. With office space and retail locations in Tempe, Scottsdale, Mesa and Glendale, properties range from movie theatres to restaurants to banking and more. Visit Yam PropertiesSpooky Fast Spooky Fast is a custom fabrication and finishing company. Though the 40,000-square-foot studio specializes in motorcycles, the company designs and finishes everything from musical instruments to skateboards to firearms. Visit Spooky FastYamwood Foundry The YAMWOOD Foundry creates outstanding and timeless custom furniture. Using innovative fabrication methods and working primarily in wood and metal, YAMWOOD designs and builds residential and commercial furniture to create beautiful, durable pieces that bring the client’s vision to life. Visit Yamwood Foundry WE DEAL IN HOPE. The Bob & Renee Parsons Foundation was formed in 2012 to reach low-income and underserved populations, marginalized communities and causes often overlooked or underfunded by mainstream philanthropy. Dealing in the areas of homelessness, medical care, at-risk youth, education and the needs of wounded veterans and military families, The Foundation provides transformational gifts to nonprofit organizations that are successfully addressing these issues and can demonstrate and measure the impact of their work. 4 Areas of Giving 566 Grants 167 Partners Visit Website In the News Riggle's Picks: GoDaddy & PXG Golf founder Bob Parsons Former Marine, Entrepreneur (GoDaddy/PXG golf) and Philanthropist Bob Parsons joins us to talk about his new memoir, Veterans' PTSD, his use of Psychedelics to treat his own PTSD, the beginnings of GoDaddy and his charitable foundation. Read More Bob Parsons - A Legacy of Service - U.S. Veterans Magazine Have you ever followed a successful person for years, hoping to 'pick their brain' and soak up their wisdom? Read More Read More News about Bob Parsons READ ALL OF MY 16 RULES FOR SUCCESS When You’re ready to quit, you’re closer than you think. There’s an old Chinese saying that I just love, and I believe it is so true. It goes like this: “The tempation to quit will be greatest just before you are about to succeed.” 16"
