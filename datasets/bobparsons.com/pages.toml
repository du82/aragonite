full_description = "Bob ParsonsIn the News. Bob ParsonsIn the News. The Masters “Champions” dinner is served! Scottie Sheiffler is hosting his first champions dinner and as you can expect this year its wild! Watch Now The Playbook with David Meltzer I sat down Bob Parsons, CEO and Founder of PXG and the founder of GoDaddy during this past Super Bowl weekend. We talked about a variety of topics, including his experiences with the Marines, learning from failure, the healing effects of psychedelics, and how he manages to stay on top of all his business ventures. Listen Now Fits With The Founder The P in PXG is in this house this week! Bob Parsons joins Nick and Cassie to talk about chasing rabbits, building better clubs, tattoos, and MORE. Listen Now Here’s Every Painstaking Step That Goes Into Making PXG Designs’ Custom Golf Wedge Custom clubs just might take you to the next level. They’ll cut down on excuses, anyway. Read More What you need to know: PXG 0211 XCOR2 irons PXG releases all-new affordable irons, the 0211 XCOR2. Read More New PXG Battle Ready putters PXG has added three new models to its Battle Ready line of putters: a mallet (Raptor); mid-mallet (Hercules) and a center-shafted blade (Dagger+). Read More Entrepreneur & Philanthropist Bob Parsons’ New Mission Bob Parsons often sounds more like a pro wrestler cutting a good promo than a billionaire entrepreneur, but there’s enthusiasm and honesty in every word. From his recovery from combat post-traumatic stress disorder to his love for golf, the former Marine is accustomed to taking charge of the conversation. Read More Everything You Need to Know About Golf Gambling There are two things you need to know about PXG founder and CEO Bob Parsons: he’s golf-obsessed and loves gambling. So naturally, Parsons is keen to put some cash on his regular matches. Read More It’s been 50 years since the War, and with the help of PTSD therapy I’m finally home Bob Parsons is best known for founding GoDaddy and changing the golf industry, but in his heart, he is most proud of being a U.S. Marine. Read More Bob Parsons Believes Psychedelics Can Heal Trauma—And He’s Putting His Money (And Brain) On The Line` The Marine infantryman still suffers from PTSD from his tour in Vietnam but credits LSD and MDMA with helping him “come home.” Now he’s on a mission to help other veterans. Read More Posts pagination Previous 1 2 3 4 5 … 17 Next"
