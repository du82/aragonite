im from hitting the links with his grandfather. And now, he is getting the VIP treatment thanks to Make-A-Wish and Parsons Xtreme Golf (PXG). Read More GLSEN receives $1.5 million grant from The Bob & Renee Parsons Foundation to support LGBTQ inclusivity “Many LGBTQ youth face cruel, often unbearable levels of bullying and discrimination. GLSEN is working to help all K-12 students feel safe at school and accepted for who they are,” said PXG founder and CEO Bob Parsons. Read More Bob Parsons opens PXG at The Shops at Norterra PXG continues to forge ahead with its commitment to brick-and-mortar retail, opening its eighth U.S. location. The latest, a 4,000+-square-foot facility at The Shops at Norterra in the company’s home state of Arizona, marks the third PXG store to open in the past 12 months. Read More Posts pagination Previous 1 … 3 4 5 6 7 … 17 Next"
