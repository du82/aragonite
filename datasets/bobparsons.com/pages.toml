title = "Privacy Policy - Bob Parsons"
description = "Who we are Bobparsons.com respects the privacy of your information and is committed to protecting it through compliance with our Bobparsons.me Privacy Policy (this “Policy”). This Policy explains our privacy and information gathering practices, such as the types of information we collect, why we collect it and under what circumstances that information is shared. Please… Continue reading →"
full_description = "Privacy Policy Who we are Bobparsons.com respects the privacy of your information and is committed to protecting it through compliance with our Bobparsons.me Privacy Policy (this “Policy”). This Policy explains our privacy and information gathering practices, such as the types of information we collect, why we collect it and under what circumstances that information is shared. Please take the time to review the terms of this Policy. By using this Site, you agree to accept the terms provided. Other than as described in this Policy, we will not give any information about you to others without your express permission. INFORMATION COLLECTION AND USE Although this Site is primarily for informational purposes, we may ask you to provide us with your name, email address or other information that could be used to identify you personally. For example, we may collect this information in the event that you register as a member of this Site, post a comment, sign-up to receive email communications, or submit demographic information as part of a survey. If you choose to purchase merchandise from this Site, we will ask for you to provide more detailed contact information about yourself, such as your name, shipping/billing address, telephone number, email address, credit card information and other information. We may maintain a record of your product purchases. Whether or not to provide information about yourself is completely your own choice. But if you choose not to provide the information we request, you may be unable to purchase merchandise from this Site or access certain content on our Site. We receive and store any information you enter on our Site or give us in any other way, including through email, telephone or other communications. If you contact us for support, we will keep an internal record of our communication with you. We may use your information to contact you regarding the information and services available on our Site, functionality changes to our Site, and special offers we think you’ll find valuable. If you would rather not receive this information, please see the “Updating Your Information” section below on how to change your preferences. We use information gathered about you from our Site statistics (for example, your IP address) to help diagnose problems with our server, and to administer our Site. We also gather broad demographic information from this data to help us improve our Site and make your browsing and purchasing experience more enjoyable. This is not linked to any personally identifiable information, except as necessary to prevent fraud or abuse on our system. Our Site uses cookies to enhance your experience with our Site. Cookies are data files that are placed in your browser to keep track of your personal preferences and to facilitate easy navigation through our Site. We use cookies to identify you so you don’t need to log in each time you visit our Site. You may opt-out of the use of cookies by altering settings on your browser. Please note, however, that some areas of the Site will be easier to navigate with the use of cookies. This Site also contains links to other websites. We are not responsible for the privacy practices or the content of such sites. SECURITY This Site has security measures in place to protect against the loss, misuse or alteration of the information under our control. We follow generally accepted standards to protect the personal information submitted to us, both during transmission and once we receive it. Unfortunately, no method of transmission over the Internet, or method of electronic storage, is 100% secure, so we cannot guarantee its absolute security. UPDATING YOUR INFORMATION You may alter your account information or opt out of receiving communications from us and our partners at any time. You can review and change your personal information by logging into the Site and visiting your account profile page. In addition, you may change or modify your personal information by any of the following methods. 1. You may send an email to support@bobparsons.com. 2. You may send mail to Bobparsons.me at the following postal address: 15750 N Northsight Blvd Scottsdale, AZ 85260 3. You may call us at: (480) 410-6000 SENDING EMAILS We use emails to communicate with you and to send information that you have requested. We also provide email links to allow you to contact us directly. We strive to promptly reply to your messages. The information you send to us may be stored and used to improve this Site and our products, or it may be reviewed and discarded. COMPLIANCE WITH LAWS AND LAW ENFORCEMENT We cooperate with government and law enforcement officials as well as private parties to enforce and comply with the law. We will disclose any information about you to government or law enforcement officials or private parties as we, in our sole discretion, believe necessary or appropriate to respond to claims and legal process, including without limitation subpoenas, to protect our property and rights or the property and rights of a third party, to protect the safety of the public or any person, or to prevent or stop activity we consider to be illegal or unethical. We will also share your information to the extent necessary to comply with ICANN’s rules, regulations and policies. THIRD PARTY SERVICE PROVIDERS We may at times provide information about you to third parties to provide various services on our behalf, such as serving advertisements, performing analyses of our user demographics, shipping of goods or services and user relationship management. We will only share information about you that is necessary for the third party to provide the requested service. These companies are prohibited from retaining, sharing, storing or using your personally identifiable information for any secondary purposes. If we use third party advertising companies to serve ads on our behalf, these companies may employ cookies and action tags (also known as single pixel GIF or web beacons) to measure advertising effectiveness. Any information that these third parties collect via cookies and action tags is completely anonymous. SUPPLEMENTATION OF INFORMATION In order to provide certain services to you, we may on occasion supplement the personal information you submit to us with information from third party sources (e.g., information from our strategic partners, service providers, or the United States Postal Service). We do this to enhance our ability to serve you, to tailor our products and services to you, and to offer you opportunities to purchase products or services that we believe may be of interest to you. CHILDREN UNDER THE AGE OF 13 Our Site is not intended for children under 13 years of age. No one under age 13 may provide any personal information to or on the Site. We do not knowingly collect personal information from children under 13. If you are under 13, do not use or provide any information on this Site or on or through any of its features/register on the Site, make any purchases through the Site, use any of the interactive or public comment features of this Site or provide any information about yourself to us, including your name, address, telephone number, e-mail address or any screen name or user name you may use. If we learn we have collected or received personal information from a child under 13 without verification of parental consent, we will delete that information. If you believe we might have any information from or about a child under 13, please contact us at support@bobparsons.com immediately. WHAT HAPPENS TO MY PERSONAL INFORMATION IF I OPT OUT? If you advise us that you wish to opt out of receiving further communications from us, we will place your personally identifiable information in “deactivated” status on our relevant databases. However, you should know that placement of your information in “deactivated” status does not mean your personally identifiable information has been deleted from our database entirely. We will retain and use your personally identifiable information as necessary in order to comply with our legal obligations, resolve disputes or enforce our agreements, as necessary. TRANSFER OF DATA ABROAD If you are visiting this Site from a country other than the country in which our servers are located, your communications with us may result in the transfer of information across international boundaries. By visiting this Site and communicating electronically with us, you consent to such transfers. CHANGES IN OUR PRACTICES We reserve the right to modify this Policy at any time. If we decide to change our Policy, we will post those changes to this Policy and any other places we deem appropriate, so that you are aware of what information we collect, how we use it and under what circumstances, if any, we disclose it. If we make material changes to this Policy, we will notify you here, by email, or by means of a notice on our home page, at least thirty (30) days prior to the implementation of the changes. CONTACTING OUR SITE If you have any questions about our Privacy Policy, the practices of this Site, or your dealings with this Site, please contact us at support@bobparsons.com."
