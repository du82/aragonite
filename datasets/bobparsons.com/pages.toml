full_description = "Bob ParsonsIn the News. Bob ParsonsIn the News. Celebrity Fight Night Tribute To Muhammad Ali At this year’s Celebrity Fight Night I had the honor of paying tribute to my good friend, Muhammad Ali. The Champ was, and always will be, the greatest of all times. Read More Celebrity Fight Night Gets Huge Boost from Parsons to Help those with Parkinson’s Entrepreneur and philanthropist Bob Parsons, longtime friend and supporter of Celebrity Fight Night, stunned the packed ballroom when he announced he is establishing the Lonnie Ali Legacy Care Program to help those diagnosed with Parkinson’s disease receive counsel and treatment in their homes. Read More PXG Signs PGA Tour Champion Pat Perez Perez is the fifth player this season alone to be added to PXG’s roster of champions, joining LPGA world number one Lydia Ko, reigning U.S. Women’s Open champion Brittany Lang, Christina Kim and Ryan O’Toole. Read More Take Two – Arizona Film Office Gets Another Chance Launched by the Arizona Commerce Authority, with support from Bob Parsons’ YAM Worldwide, the Arizona Office of Film and Media will work to showcase the state as a premium destination for entertainment industry productions. Read More Bob Parsons’ Double Down For Vets Reaches $20 Million Goal Through a $10 million matching campaign with Semper Fi Fund, more than $20 million was raised for wounded and critically ill veterans and their families. Read More Why America’s Veterans Make the Best Entrepreneurs Fortune Magazine breaks down why we need more Veteran owned businesses and how companies like GoDaddy and FedEx benefit from the guidance of a veteran founder. Read More Commemorating Veterans Day It was an honor to speak at Scottsdale’s Veterans Day commemoration event. As a Marine myself, I consider it a privilege to share my own experiences and to honor those who have served and who currently serve our great country. Read More Happy Anniversary, Mother Green November 10, 2016 is the 241st Birthday of the United States Marine Corps. Join me as I honor my fellow Marines, past and present, with this 2016 annual birthday tribute video. If you’re serving in the Marines, Army, Navy, Air Force or Coast Guard, I want to personally wish you a Happy Veterans Day. Thank… Continue reading → Read More Semper Fi Fund And The Bob & Renee Parsons Foundation Announce Fifth Annual Matching Challenge Through December 31, 2016, The Bob & Renee Parsons Foundation will match all donations, up to $10 million, as part of the Double Down for Veterans campaign. Read More The Bob & Renee Parsons Foundation issues emergency grant to Hope for Haiti in wake of Hurricane Matthew “Years ago we pledged our support to the wonderful people of Haiti, and they need that support now more than ever,” said American entrepreneur and philanthropist, Bob Parsons. “Hope for Haiti is on the frontlines helping those hit hardest by this unthinkable disaster and we will continue to uphold our commitment to their efforts.” Read More Posts pagination Previous 1 … 11 12 13 14 15 … 17 Next"
