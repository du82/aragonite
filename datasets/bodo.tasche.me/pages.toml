full_description = "SignDict.org is one of the leading dictionaries for the German Sign language. 95,000 unique users per month use the site to learn this wonderful language. I build this site as part of the first batch of the Prototype Fund and continue to maintain it. The code can be found on GitHub. Shortly before our kid was born we had the problem that lots of people asked us what we could need as baby shower presents. We tried to organize it using email and an Excel sheet and quickly realized that this didn't scale. After looking into tons of websites that offer a gift registry, I realized none had what I wanted or looked really dated. Together with my wife I build a page that was perfect for us. Wishlephant.com currently has around 20,000 unique visitors a month. With Hier Baut Berlin I was part of the 9th round of the Prototype fund. My goal was to create a tool to inform citizens of Berlin about changes in their neighborhood. For example, street construction, new bike paths, information about ways to participate in key decisions in the neighborhood. This information was available, but scattered on 20-30 pages. With the help of this project you now finally see all important information on one map. It is also be possible to subscribe to changes via email. Never miss an important update anymore. I also maintain a couple of smaller open-source libraries and tools. Check out my GitHub profile for a complete list. In over 20 years of working in the tech industry, I participated in numerous projects. Here is a small list of things I am proud of. From 2018 till 2021 I was freelancing for Airy as part of their React.JS frontend team. Airy is an open-source conversational platform to power conversations with an open source Website Live Chat, Messengers like Facebook Messenger, WhatsApp and more. An emoji? Yes! Did you know that you can write a proposal for Emojis? I got lucky and my proposal for the sloth emoji was accepted and now the sloth can be found on every phone and laptop 🎉. I hopefully made the world a better place with adding the 🦥 emoji. Also want to create an emoji? Join the emojination slack, and they will help you make it happen."
