title = "Volunteer - Boilermaker Road Race"
full_description = '''VOLUNTEER The Heart of The Boilermaker VOLUNTEER The Heart of The Boilermaker Get in the action! The Boilermaker is one of the largest community-based events in Central New York. Established in 1978 as a way to give back to the community by our founding corporate partners, Utica Boilers (ECR International) & F.X. Matt Brewing Company, what started as a small road race has blossomed into “Boilermaker Weekend” replete with a two-day Health & Wellness Expo, a Kids Run, a 5K run, 15K Wheelchair Race, 15K run, and the iconic, Saranac Post-Race Party. Boilermaker Weekend is volunteerism personified as our organization could not pull it all off without the assistance of thousands of volunteers and the support of the Fountainhead Group. Registration to volunteer for the 2025 Boilermaker is now open. Please review the options below. .gallery-carousel-shortcode.gallery-carousel-shortcode-id-5de22aa28371ec0feaec57dad43c5274.owl-carousel .owl-nav div { width: 36px; height: 36px; border-radius: 500px; } .dt-arrow-border-on.gallery-carousel-shortcode.gallery-carousel-shortcode-id-5de22aa28371ec0feaec57dad43c5274.owl-carousel .owl-nav div:not(:hover):before { border-width: 0px; } .dt-arrow-hover-border-on.gallery-carousel-shortcode.gallery-carousel-shortcode-id-5de22aa28371ec0feaec57dad43c5274.owl-carousel .owl-nav div:hover:after { border-width: 0px; } .gallery-carousel-shortcode.gallery-carousel-shortcode-id-5de22aa28371ec0feaec57dad43c5274.owl-carousel .owl-nav div.owl-prev { top: 50%; transform: translateY(calc(-50% + 0px)); left: -43px; } @media all and (-ms-high-contrast: none) { .gallery-carousel-shortcode.gallery-carousel-shortcode-id-5de22aa28371ec0feaec57dad43c5274.owl-carousel .owl-nav div.owl-prev { transform: translateY(-50%); margin-top: 0px; } } .gallery-carousel-shortcode.gallery-carousel-shortcode-id-5de22aa28371ec0feaec57dad43c5274.owl-carousel .owl-nav div.owl-prev i { padding: 0px 0px 0px 0px; } .gallery-carousel-shortcode.gallery-carousel