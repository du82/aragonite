["http://www.boilermaker.com/walk"]
title = "Boilermaker Walk - Boilermaker Road Race"
description = """
Is the Boilermaker Walk a timed race?
\t

\t
\t
No. The Boilermaker Walk is a community event. It is NOT timed and therefore, should NOT be considered a competitive endeavor."""
full_description = "Is the Boilermaker Walk a timed race? No. The Boilermaker Walk is a community event. It is NOT timed and therefore, should NOT be considered a competitive endeavor. What happens if the weather is bad the day of my event? Boilermaker events are all held rain or shine. In the event of severe weather that impacts runner safety, communication will be sent via email used during registration and posted on Facebook and Instagram. Where and when is the Boilermaker Walk? The Boilermaker Walk will start promptly at 11am on Saturday, July 12, 2024, just beyond the MVCC track near the corner of Sherman Drive and the Memorial Parkway. To ensure your safety and the safety of all participants at street crossings and throughout the courses, we cannot accommodate anyone who shows up late. If you arrive after 11:05am, you will not be permitted to start the Walk. Where can I pick up my Boilermaker Walk bib and pin? You can pick up your commemorative Walk Bib on Friday, July 11, 2025 from noon to 7 p.m. or on Saturday, July 12th, 2025 from 8 a.m. to 10:45 a.m., in the Performance Gym on the MVCC campus. You will receive your Finisher’s Pin as you cross the Finish Line. What do I receive with my registration for the Boilermaker Walk? With your registration, you’ll receive a commemorative bib, exclusive collectible Walk pin, and water stops and educational guides along the course. I still have questions, what do I do? Please contact us and select the topic that most closely fits your question."
year_published = 2025
year_updated = 2024
clearnet = "http://www.boilermaker.com/walk"
