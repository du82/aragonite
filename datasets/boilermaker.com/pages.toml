title = "Boilermaker 15K - Boilermaker Road Race"
description = """
When is the Boilermaker?
\t

\t
\t
The Boilermaker is always run on the second Sunday of July. The date for the 2025 Boilermaker Road Race is Sunday, July 13, 2025. 



The 5K Race starts at 7:15 AM, the Wheelchair Race starts at 7:45 AM, and the 15K Race starts at 8 AM."""
full_description = "When is the Boilermaker? The Boilermaker is always run on the second Sunday of July. The date for the 2025 Boilermaker Road Race is Sunday, July 13, 2025. The 5K Race starts at 7:15 AM, the Wheelchair Race starts at 7:45 AM, and the 15K Race starts at 8 AM. Can someone else pick up my Boilermaker bib number? Yes. Someone else may pick up your bib number, but they must present a note from you authorizing them to do so, a copy of your confirmation email, or a copy of your government-issued photo ID (license, passport, etc.). How & where do I pick up my Boilermaker 15K race packet (bib) and race incentives? Packet pick-up will be held on Friday, July 11th from Noon until 7:00 pm and Saturday, July 12th from 8:00 am until 4:30 pm at the MVHS Health & Wellness Expo on the MVCC Utica Campus located at 1101 Sherman Drive, Utica, NY 13501.In order to pick up your race packet and incentives, you must show photo ID or your confirmation email. There is limited race day packet pick-up available for the 15K presented by Excellus BlueCross BlueShield. Race-day packet pick-up will open at 6 AM and will have a hard close at 7:45 AM in order to ensure a proper start to the race. It will take place on the east side of Human Technologies near the start line. Where can I park for the Boilermaker 15K Race? There is some street parking near the start line in the area surrounding ECR International and near the finish line at the FX Matt Brewing Company. Space is limited to public streets. There is no special reserved parking, so check your options early. Will there be a bag check available? Yes, for the 15K only. A bag check truck will be located along Dwyer Avenue adjacent to the 15K Start line. Participants wishing to use this benefit should bring their own clear plastic bag as we are not able to provide them. Can I walk the Boilermaker 15K, 5K, or Erie Canal events? No, walkers are not allowed! All Boilermaker races, including the 15K presented by Excellus BlueCross BlueShield, 5K presented by Utica National, or Erie Canal Races presented by Wolfspeed are timed events with strict cut-off times: 15K: 2 hours 30 minutes 5K: 45 minutes Erie Canal 10-Miler: 2 hours 30 minutes Anyone interested in walking can register for the Boilermaker Walk that takes place at Mohawk Valley Community College the Saturday before the Boilermaker."
