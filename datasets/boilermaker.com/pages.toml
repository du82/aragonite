 0px; } .dt-icon-bg-on.gallery-carousel-shortcode.gallery-carousel-shortcode-id-d45823609e32fa2d607eefbef6946639.gallery-shortcode .gallery-zoom-ico { background: rgba(255,255,255,0.3); box-shadow: none; } .gallery-carousel-shortcode.gallery-carousel-shortcode-id-d45823609e32fa2d607eefbef6946639.gallery-shortcode .gallery-zoom-ico:before, .gallery-carousel-shortcode.gallery-carousel-shortcode-id-d45823609e32fa2d607eefbef6946639.gallery-shortcode .gallery-zoom-ico span { font-size: 32px; line-height: 44px; color: #ffffff; background: none; } We offer many programs designed to assist our local community throughout the year: Charity Bib Program The Charity Bib program provides a limited number of bibs for the Boilermaker 5K & 15K, at no cost, to several selected nonprofit organizations. Each organization is then able to find participants who each commit to raising a minimum of $500 in order to receive one of their allotted bibs. Access Program Designed with the Utica community in mind, the Access Program provides a pathway to participate in Boilermaker events for those with financial limitations. The program provides a select number of free entries and assistance with footwear to the underprivileged, underserved, and immigrant/refugee communities in Oneida County. Community Garden The Community Garden is a Boilermaker staff and local community-supported garden located on Sunset Ave. in Utica. The yield of the Garden is shared with Mother Marianne’s West Side Kitchen, providing fresh produce for the community they serve. Youth Fitness Programs The Boilermaker organizes various Kids Runs throughout the year and provides support services at youth fitness events put on by other local organizations with the goal of cultivating a love of movement in the next generation. Help us continue our mission to share the magic of road racing Volunteer for a Boilermaker Event 15K Race 5K Race Wheelchair Race Virtual Race .vc_custom_1666282336740{margin-top: 50px !important;}.vc_custom_