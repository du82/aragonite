["http://www.boilermaker.com/5k"]
title = "Boilermaker 5K - Boilermaker Road Race"
description = """
When is the Boilermaker?
\t

\t
\t
The Boilermaker is always run on the second Sunday of July. The date for the 2025 Boilermaker Road Race is Sunday, July 13, 2025. 



The 5K Race starts at 7:15 AM, the Wheelchair Race starts at 7:45 AM, and the 15K Race starts at 8 AM."""
full_description = "When is the Boilermaker? The Boilermaker is always run on the second Sunday of July. The date for the 2025 Boilermaker Road Race is Sunday, July 13, 2025. The 5K Race starts at 7:15 AM, the Wheelchair Race starts at 7:45 AM, and the 15K Race starts at 8 AM. How & where do I pick up my Boilermaker 5K race packet (bib) and race incentives? Packet pick-up will be held on Friday, July 11th from Noon until 7:00 pm and Saturday, July 12th from 8:00 am until 4:30 pm at the MVHS Health & Wellness Expo on the MVCC Utica Campus located at 1101 Sherman Drive, Utica, NY 13501.In order to pick up your race packet and incentives, you must show photo ID or your confirmation email. There is limited race day packet pick-up available for the Utica National 5K. Race-day packet pick-up will be open at 6 AM and will have a hard close at 7 AM in order to ensure a proper start to the race. It will take place next to the 5K start line. Can I walk the Boilermaker 15K, 5K, or Erie Canal events? No, walkers are not allowed! All Boilermaker races, including the 15K presented by Excellus BlueCross BlueShield, 5K presented by Utica National, or Erie Canal Races presented by Wolfspeed are timed events with strict cut-off times: 15K: 2 hours 30 minutes 5K: 45 minutes Erie Canal 10-Miler: 2 hours 30 minutes Anyone interested in walking can register for the Boilermaker Walk that takes place at Mohawk Valley Community College the Saturday before the Boilermaker. Can I run with my pet or use a stroller in the race? No strollers or pets are allowed in any Boilermaker event. What happens if the weather is bad the day of my event? Boilermaker events are all held rain or shine. In the event of severe weather that impacts runner safety, communication will be sent via email used during registration and posted on Facebook and Instagram. Can I transfer my Boilermaker bib (registration) to another runner? Yes. The Transfer Process will open at noon on Thursday, May 1st, 2025. To complete a transfer via your RunSignUp account: Go to runsignup.com, click on “Sign In,” and enter your email and password to sign in. Click on “Profile” from the drop-down menu in the upper right-hand corner. Find the event you wish to transfer and select “Manage Registration.” Select “Transfer to Another Runner” (located either at the top of the page or in the menu). Confirm the event information and input the recipient’s full name and email address. Select the Transfer Type: “Registration Gift” (no refund given to the original registrant and recipient will not need to pay) or “Registration Transfer” (refund given to the original registrant upon confirmed payment from the new recipient). For more information, click here. Online transfers must be started by Wednesday, July 2, 2025 and any in-progress transfers must be completed by Friday, July 4, 2025. Limited transfers may be available onsite at the Health & Wellness Expo on July 11 and 12. There are no race-day transfers."
year_published = 2025
year_updated = 2025
