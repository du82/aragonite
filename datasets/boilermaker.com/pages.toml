title = "Boilermaker FAQs - Boilermaker Road Race"
full_description = '''FAQ Boilermaker FAQs FAQ Boilermaker FAQs The 2025 Boilermaker will commemorate its 48th running with runners from near and far participating both in-person and virtually. Our FAQs contain answers to our most frequently asked questions. Please take a minute to review it all and we look forward to hosting you in Utica, NY on Sunday, July 13th, 2025! Search our FAQ When is the Boilermaker?The Boilermaker is always run on the second Sunday of July. The date for the 2025 Boilermaker Road Race is Sunday, July 13, 2025. The 5K Race starts at 7:15…How many water stations, aid stations, and bathrooms are on the course?There are 18 water stations, one electrolyte (Sqwincher) station, 34 aid (medical) stations, and over 40 porta-johns over the 9.3-mile course. Water Station Locations: Nimey’s New Generation Cars (Start Line),…How do I submit my Virtual 15K or 5K time?When to Run Your Virtual Race You have from Saturday, July 5, 2025 until Sunday, July 13, 2025 at 11:59 AM (noon EST) to complete your race AND submit your result. Submitting…Can someone else pick up my Boilermaker bib number?Yes. Someone else may pick up your bib number, but they must present a note from you authorizing them to do so, a copy of your confirmation email, or a copy…Can I change my Boilermaker registration from 15K to 5K?Yes, however, due to the 5K cap, ONLY the first 500 requests to drop from 15K to 5K will be accepted. Once the change is made, it is final. Runners will not…How & where do I pick up my Boilermaker 5K race packet (bib) and race incentives?Packet pick-up will be held on Friday, July 11th from Noon until 7:00 pm and Saturday, July 12th from 8:00 am until 4:30 pm at the MVHS Health & Wellness…How & where do I pick up my Boilermaker 15K race packet (bib) and race incentives?Packet pick-up will be held on Friday, July 11th from Noon until 7:00 pm and Saturday, July 12th from 8:00 am until 4:30 pm at the MVHS Health & Wellness…Where can I park for the Boilermaker 15K Race?There is some street parking near the start line in the area surrounding ECR International and near the finish line at the FX Matt Brewing Company. Space is limited to…Where can I park for the Boilermaker 5K Race?Runners can use the west parking lot at ConMed on Chenango Road in Utica and then ride the shuttle to the 5K start or park at/around Murnane Field and walk…Will there be a bag check available?Yes, for the 15K only. A bag check truck will be located along Dwyer Avenue adjacent to the 15K Start line. Participants wishing to use this benefit should bring their…Who can use Boilermaker shuttles?The Birnie Bus shuttles are for registered Boilermaker runners only. Spectators and volunteers cannot use shuttles.Can I walk the Boilermaker 15K, 5K, or Erie Canal events?No, walkers are not allowed! All Boilermaker races, including the 15K presented by Excellus BlueCross BlueShield, 5K presented by Utica National, or Erie Canal Races presented by Wolfspeed are timed…Can I run with my pet or use a stroller in the race?No strollers or pets are allowed in any Boilermaker event.Can I bring my pet to the MVHS Health and Wellness Expo?No! It is an indoor expo and pets are not allowed in the buildings. Please leave them home where they are safe and cool. .fwpl-layout, .fwpl-row { display: grid; } .fwpl-layout.el-hkhimk { grid-template-columns: repeat(2, 1fr); grid-gap: 30px; } .fwpl-layout.el-hkhimk .fwpl-result { padding: 0px 0px px 0px; font-weight: bold; font-size: 15px; } .fwpl-row.el-8cjrpw { grid-template-columns: 1fr; } If you have any other questions, please click here to email the Boilermaker team directly. 15K Race 5K Race Wheelchair Race Virtual Race .vc_custom_1666282336740{margin-top: 50px !important;}.vc_custom_1666282356680{margin-right: 10px !important;margin-left: 10px !important;}.vc_custom_1666282366105{margin-right: 10px !important;margin-left: 10px !important;} FOUNDING PARTNERS GOLD & PRESENTING PARTNERS View all Sponsors .vc_custom_1670863232544{pad