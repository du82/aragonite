title = "About - Boilermaker Road Race"
full_description = '''ABOUT About the Boilermaker The Boilermaker Road Race is dedicated to leading the healthy lifestyle movement through exercise and fun. The organization is most known for its namesake Boilermaker 15K and 5K races, but also puts on other running and fitness events, community programming, and more. About the Boilermaker 15K Race In 1978, the Boilermaker began as a 15K road race with 876 runners, created to celebrate founding sponsor Utica Boiler’s 50th anniversary. Today, it is a week long extravaganza drawing over 20,000 runners, spectators, and volunteers. Held in Utica, New York, the gateway to the Adirondacks, Boilermaker Week includes a host of activities for runners, the community, sponsors and volunteers. The Boilermaker Week events include: The MVHS Health and Wellness Expo The Boilermaker 3- and 4-Mile Walk The Utica National Kids’ Run The 5K Race presented by Utica National The 15K Race presented by Excellus BlueCross BlueShield Saranac Post-Race Party This wide variety of events allows the community to show visitors from all over the world the best of what the area has to offer. The Boilermaker 15K Race is a bucket-list event. Whether you’re an avid runner or simply looking for a top-notch race experience, our challenging, spectator-lined course (and the best Post-Race Party in history) is waiting for you! Community Impact As an organization, the Boilermaker Road Race has grown to be much More Than a Race over the last 48 years. The organization strives to assist in improving the physical and emotional well-being of the community through various community programs, such as the Access Program, the Charity Bib Program, the Community Garden, the Boolermaker Kids Run and more. In addition to the Boilermaker Weekend races, the organization also puts on the Erie Canal Races each year. If you are interested in getting involved with our community outreach efforts, please visit our volunteer page. 15K Race 5K Race Wheelchair Race Virtual Race .v