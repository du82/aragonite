title = "Corporate Partnership - Boilermaker Road Race"
full_description = '''COMMUNITY Corporate Partnership Get in the action! World-renowned and locally adored, the Boilermaker is often referred to as the Country’s best 15K race. In addition to the community’s incredible support, our corporate partners make the Boilermaker a truly unique and special event. A local event with international appeal, the Boilermaker Road Race blends incredible community spirit with wide-reaching star power. Our mission is to promote health and wellness with an element of fun throughout the local community and the U.S. using running and walking as a catalyst. As a corporate partner, you have a unique opportunity to support the Boilermaker mission while reaching a captive and supportive audience with your brand and your products. We create personal relationships and customized activations for each of our partners. To discuss opportunities, email marketing@boilermaker.com. Partnership Advantages Reinforce your brand image with the loyal local and national running community Increase awareness and visibility for your products/services throughout the year, not just race weekend! Generate goodwill Benefit from product testing at Boilermaker events via experiential marketing, product sampling, and data capture Contribute to the economic longevity of the Mohawk Valley and Oneida County Create customer consideration and drive sales Be a part of this truly special community-wide event Current Partners GoldSilverBronzeAssociateSupportingMediaGold Silver Bronze Associate Supporting Media 15K Race 5K Race Wheelchair Race Virtual Race .vc_custom_1666282336740{margin-top: 50px !important;}.vc_custom_1666282356680{margin-right: 10px !important;margin-left: 10px !important;}.vc_custom_1666282366105{margin-right: 10px !important;margin-left: 10px !important;} FOUNDING PARTNERS GOLD & PRESENTING PARTNERS View all Sponsors .vc_custom_1670863232544{padding-top: 32px !important;} Boilermaker Road Race PO Box 512, Utica, NY 13503 315.797.5838 Home Sponsorship Pr