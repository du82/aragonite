["https://www.boilermaker.com/about/hotels-travel-parking"]
title = "Hotels, Travel & Parking - Boilermaker Road Race"
description = """
Where can I park for the Boilermaker 15K Race?
\t

\t
\t
There is some street parking near the start line in the area surrounding ECR International and near the finish line at the FX Matt Brewing Company. Space is limited to public streets. There is no special reserved parking, so check your options early."""
full_description = "Where can I park for the Boilermaker 15K Race? There is some street parking near the start line in the area surrounding ECR International and near the finish line at the FX Matt Brewing Company. Space is limited to public streets. There is no special reserved parking, so check your options early. Where can I park for the Boilermaker 5K Race? Runners can use the west parking lot at ConMed on Chenango Road in Utica and then ride the shuttle to the 5K start or park at/around Murnane Field and walk to the start. Roads start closing at 5 a.m., so please plan accordingly, use parking spots., and avoid parking in no-parking zones. Who can use Boilermaker shuttles? The Birnie Bus shuttles are for registered Boilermaker runners only. Spectators and volunteers cannot use shuttles. What hotels are available? We recommend our official Boilermaker race hotel, the DoubleTree by Hilton Hotel Utica at 102 Lafayette Street in Utica, New York. Call (315) 724-7829 for reservation information. All nearby hotels are at least three miles from the Boilermaker start line. Both the DoubleTree by Hilton Hotel Utica and the Delta Hotels by Marriott Utica are approximately 0.3 miles from the Boilermaker finish and easily walkable. Shuttles are available to take runners from the finish area to the start. Are there shuttles between the 5K and 15K Race starts? No! If you have someone running the 5K race you must drop them off. The 5K Birnie Bus shuttle stop at ConMed is a great spot to drop the 5K runners and head to where you are going to park for the 15K race. Can I take a shuttle to the start of the Boilermaker 15K? Yes! Birnie Buses will transport runners from the finish area to the 15K Race start line from 6:00 AM to 7:00 AM. Arrive early for the shuttles. Don’t plan on taking the last shuttle to the start. Pick-up locations are: Near the Finish Line at the corner of Court Street and State Street Near the rear of the Post Race Party area on Whitesboro Street"
