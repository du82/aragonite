full_description = "When is the Boilermaker? The Boilermaker is always run on the second Sunday of July. The date for the 2025 Boilermaker Road Race is Sunday, July 13, 2025. The 5K Race starts at 7:15 AM, the Wheelchair Race starts at 7:45 AM, and the 15K Race starts at 8 AM. Can I change my Boilermaker registration from 15K to 5K? Yes, however, due to the 5K cap, ONLY the first 500 requests to drop from 15K to 5K will be accepted. Once the change is made, it is final. Runners will not be able to change back to the 15K and will not be refunded the difference in the cost of registrations. To drop your 15K entry to the 5K, please contact us and select “Registration Change.” Can I transfer my Boilermaker bib (registration) to another runner? Yes. The Transfer Process will open at noon on Thursday, May 1st, 2025. To complete a transfer via your RunSignUp account: Go to runsignup.com, click on “Sign In,” and enter your email and password to sign in. Click on “Profile” from the drop-down menu in the upper right-hand corner. Find the event you wish to transfer and select “Manage Registration.” Select “Transfer to Another Runner” (located either at the top of the page or in the menu). Confirm the event information and input the recipient’s full name and email address. Select the Transfer Type: “Registration Gift” (no refund given to the original registrant and recipient will not need to pay) or “Registration Transfer” (refund given to the original registrant upon confirmed payment from the new recipient). For more information, click here. Online transfers must be started by Wednesday, July 2, 2025 and any in-progress transfers must be completed by Friday, July 4, 2025. Limited transfers may be available onsite at the Health & Wellness Expo on July 11 and 12. There are no race-day transfers. When can I register? Priority Registration for the 2025 Boilermaker Road Race will open on August 19, 2024! This period is exclusive to anyone who registered for the 2024 Boilermaker Road Race, regardless of whether you participated in the race. Priority Registration features our Tier 1 pricing, the lowest price available for the event. Fun fact: this low opening cost has been the same for 10 years! This period will run from August 19 through September 2 at 11:59pm. REGISTER HERE Future registration periods will be announced on our website, social media, and via email. To join our mailing list, click here."
