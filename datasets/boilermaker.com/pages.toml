["https://www.boilermaker.com/buy-a-brick"]
title = "Buy A Brick - Boilermaker Road Race"
full_description = '''SHOP BUY A BRICK Leave your legacy in Boilermaker Square Commemorate your Boilermaker experience with a personalized brick in the walkway of Boilermaker Square at Butler Park. About Boilermaker Square at Butler Park Located across from the F.X. Matt Brewery and the Saranac Post Race Party, you can find a miniature replica of the “Best 15K in the USA”, constructed with inscribed brick pavers. Also included are 21 Utica landmarks located along the race course. Be a Permanent Part of the Boilermaker Join the Boilermaker Family by placing your personalized brick alongside the thousand-plus supporters who have become an everlasting piece of Boilermaker history. Your Commemorative Brick Become a permanent part of Boilermaker Square. For just $30, you can have a personalized brick as a lasting token of your support. Bricks can be personalized with standard graphics OR your brick can be customized with special graphics at no additional cost. View available special graphics and select yours today. Who Should Buy a Brick? Anyone who wants to remember a runner, volunteer, spectator, loved one, or special occasion. How to Purchase You can visit our online store to purchase a brick. After your purchase, please download the appropriate form below and fill out the top and middle portions (skip the payment information section). Email your completed form and any questions to bricks@boilermaker.com. Click here to download the fillable PDF with Standard Graphics (Example below) Click here to download the fillable PDF with Special Graphics (Example below) View available graphics Choose Your Brick Location You may select your location for your brick in one of the 12 available landmarks located along the race course. Click here to download the Landmark Map. List your location choice on the Brick Order Form. Brick Installation Ceremony If you would like to install your own brick; please indicate Yes or No on the Brick Order Form. The ceremony is held on a week night in June, a few weeks before the Boilermaker. Other Purchase Options If you would prefer to pay by check, please complete the fillable PDF including payment (check, payable to Boilermaker Road Race), and mail to: Boilermaker Road Race – Bricks PO Box 512 Utica NY, 13503 For questions or more information please call (315) 731-3706 or email bricks@boilermaker.com. Bricks purchased by April 15th are installed prior to the race in July. 15K Race 5K Race Wheelchair Race Virtual Race .vc_custom_1666282336740{margin-top: 50px !important;}.vc_custom_1666282356680{margin-right: 10px !important;margin-left: 10px !important;}.vc_custom_1666282366105{margin-right: 10px !important;margin-left: 10px !important;} FOUNDING PARTNERS GOLD & PRESENTING PARTNERS View all Sponsors .vc_custom_1670863232544{padding-top: 32px !important;} Boilermaker Road Race PO Box 512, Utica, NY 13503 315.797.5838 Home Sponsorship Press Contact Us Privacy Policy Terms & Conditions Sitemap Search Search: Notice: JavaScript is required for this content. /* FORM STYLES */ #nf-form-6-cont { display:block; float:left; } #nf-form-6-cont .nf-row { float:right } #nf-form-6-cont .nf-row:nth-child(odd) { float:right } /* FIELDS STYLES */ .nf-form-content .nf-field-container #nf-field-32-wrap { display:inline; } .nf-form-content .nf-field-container #nf-field-32-wrap .nf-field-element .ninja-forms-field { border-width:1ps; border-style:solid; border-color:#b72831; width:200px; } .nf-form-content .nf-field-container #nf-field-33-wrap .nf-field-element .ninja-forms-field { background-color:#b72831; border-width:1px; border-style:solid; border-color:#b72831; color:#ffffff; border-radius: 10px; } .nf-form-content .nf-field-container #nf-field-33-wrap .nf-field-element .ninja-forms-field:hover { } var formDisplay=1;var nfForms=nfForms||[];var form=[];form.id='6';form.settings={"objectType":"Form Setting","editActive":true,"title":"Email Sign Up","show_title":1,"allow_public_link":0,"embed_form":"","clear_complete":1,"hid