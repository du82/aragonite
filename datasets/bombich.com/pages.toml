["https://bombich.com/press"]
title = "Press Release - Bombich Software"
full_description = '''CCC 7 and CCC Mobile Backup are here! Backing up your digital life just got easier. FOR RELEASE MAY 9, 2024 (ANY TIME) Longmeadow, MA - May 9, 2024 - Bombich Software has released our latest version of Carbon Copy Cloner, CCC 7. In addition, we are excited to announce our brand new CCC Mobile Backup app, available in the iOS App store, for iOS Photos and Files. Expanding its focus beyond files on your Mac, CCC 7 can temporarily download cloud-only files sequestered in iCloud, Dropbox, Google Drive and other cloud-syncing solutions to make a local backup of that content. Further, adding iOS files and photos to your local CCC backup is made simple with CCC Mobile Backup. Additional new CCC 7 features include a streamlined process for setting up and encrypting a backup volume, more control over backup version retention, more control over when backups run, and new functionality to search for files across backup snapshots. With CCC Mobile Backup, you can back up files and media from your iOS devices to your Mac. Make lightning-fast backups to CCC’s Diplomat service, bringing your Photos and Files into your CCC backup ecosystem. You can also back up to network-attached storage or local storage attached to your phone. Transfer 100 files free, $2.99 in-app fee per destination type for unlimited backups. Carbon Copy Cloner 7 requires macOS 13 Ventura or later. A full-featured thirty day trial version is available at https://bombich.com/download. CCC Mobile Backup requires iOS 17 or later. Download from the App Store at https://apps.apple.com/us/app/ccc-mobile-backup/id6471621409. What's New in Carbon Copy Cloner 7 Backup Volume Setup Assistant - With just a couple clicks, you can get your new backup disk reformatted using the best filesystem for backups, enable snapshot support, and even enable encryption. Snapshot Searching - Search for files across multiple snapshots in CCC's Snapshot Browser. Select snapshots, enter a search term in the sidebar to find specific files in any of the snapshots, then see how the file differs in each snapshot. More ways to manage your snapshots - Tag snapshots as "permanent" so they won't be removed by CCC's thinning and pruning, and at the same time you can add a note to the snapshot to add some context (e.g. "Created prior to upgrading to Sonoma"). You can also specify a max age for snapshots, and limit snapshot retention based on total snapshot disk usage. Folders get renamed, not recopied = more speed - In the past, when a folder was renamed on the source, the folder would be removed from the destination and recopied. Now CCC's file copier can smartly detect renamed folders and simply rename those folders on the destination. Easily encrypt your backups - You no longer need to leave CCC and figure out how to encrypt your backup volume, it’s all handled seamlessly by CCC with a single toggle. Want to disable encryption? Also one click! Task Notes - Have a lot of tasks and sometimes wish you could figure out why you created them? Now you can add a description or contextual information to each task. Vacation Snapshots - If snapshot support is enabled on your source volume, CCC will now create a snapshot on the source at the scheduled run time even if the destination is absent. CCC gives you complete control over these "local backups" – you can determine if snapshots should be kept on the source, and you can fine tune exactly how long they're kept and how much space they're allowed to consume. New backup rules based on network conditions - Now you can limit tasks to run only when ethernet is available, only when the Mac is on a specific Wi-Fi network, or only when a specific location is set. Other new features and improvements - Product tours, granular control over Notifications, support for creating, deleting, listing and mounting snapshots in the CCC command-line utility, added a simulator for the Snapshot Retention Policy thinning settings. Detailed CCC 7 release notes are available at: https://support.bombich.com/hc/en-us/articles/20686469389719-CCC-7-Release-Notes Blog post detailing our new CCC 7 features: https://bombich.com/blog/2024/05/07/building-better-backups-ccc-7 More information about CCC Mobile Backup: https://bombich.com/ccc-mobile Carbon Copy Cloner 7 Pricing: Personal & Household License (non-commercial home use, all computers in household included): $49.99 USD Corporate & Institutional License (commercial use, per computer): $49.99 USD, volume discounts available Pro License (commercial use, per technician): $125, volume discounts available Personal & Household License upgrade from Carbon Copy Cloner 6: 50% discount off current price, $25.00 USD Personal & Household License upgrade from Carbon Copy Cloner 6: 25% discount off current price, $37.50 USD Corporate & Institutional and Pro License upgrade from Carbon Copy Cloner 6: 25% discount off current price (Free upgrade for purchases made on or after January 1, 2024) A demo of Carbon Copy Cloner 7 for macOS is available for free download at https://bombich.com. Carbon Copy Cloner features: Creating Mac backups since 2002 Schedule backups to occur automatically Back up to local volumes or network volumes Back up external volumes to other external volumes or network volumes Restore older versions of your files and files that were deleted Non-proprietary backups for simple access to backup data Smarter updates for faster backups - update only the files that have been added or modified since the last backup Proactive setup assistance to get backups configured for success Uniquely extensive error handling offering recognition of dozens of error patterns with useful advice for dealing with each problem to ensure the integrity of data Heads-up display of when backup tasks have run and how they’re doing. If any tasks have errors, CCC offers advice to help fix any problems Backup notification through macOS Notification Center and via email Available in English, French, German, Italian, Japanese, Dutch and Spanish CONTACT: Sarah Bombich Co-owner and COO, Bombich Software E-mail: sarah@bombich.com http://bombich.com ©2024 Bombich Software, Inc. All rights reserved. Bombich Software and Carbon Copy Cloner are trademarks of Bombich Software, Inc. in the United States and other jurisdictions. Other names used herein may be trademarks of their respective owners.'''
