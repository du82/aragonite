full_description = "Bombich Software Privacy Policy This Privacy Policy sets out how we, Bombich Software, Inc., collect, store and use information about you when you use or interact with our website, bombich.com (our website) and where we otherwise obtain or collect information about you. This Privacy Policy is effective from July 24, 2024. Summary This section summarizes how we obtain, store and use information about you. It is intended to provide a very general overview only. It is not complete in and of itself and it must be read in conjunction with the corresponding full sections of this Privacy Policy. Data controller: Bombich Software, Inc. How we collect or obtain information about you: when you provide it to us (e.g. by contacting us, by signing up to our email newsletter, and by putting in a support request), from your use of our website or email newsletter, using cookies and similar technologies, and from third parties when you purchase our software. How we use your information: for administrative and business purposes (particularly to contact you and process orders you place on our reseller partner’s website), to improve our business and website, to fulfill our contractual obligations, to analyze use of our website, and in connection with our legal rights and obligations. Disclosure of your information to third parties: only to the extent necessary to run our business, to our service providers, to fulfill any contracts we enter into with you, and where required by law or to enforce our legal rights. Do we sell your information to third parties (other than in the course of a business sale or purchase or similar event): No How long we retain your information: for no longer than necessary, taking into account any legal obligations we have (e.g. to maintain records for tax purposes), any other legal basis we have for using your information (e.g. your consent, performance of a contract with you or our legitimate interests as a business) and certain additional factors described in the main section below entitled How long we retain your information. For specific retention periods in relation to certain information we collect from you, please see the main section below entitled How long we retain your information. How we secure your information: using appropriate technical and organizational measures such as storing your information on secure servers, encrypting transfers of data to or from our servers using Secure Sockets Layer (SSL) technology, only granting access to your information where necessary, storing personal data in encrypted databases, and by using pseudonymization to mask personal information when possible. Use of cookies and similar technologies: we use only essential cookies on our website; we do not use analytical or advertising cookies. We use web beacons in our email newsletter. For more information, please visit our Cookies Policy. Transfers of your information outside the European Economic Area: we transfer your information outside of the European Economic Area, including to the following countries: United States of America. Where we do so, we will ensure appropriate safeguards are in place, including the third parties we use who transfer your information outside the European Economic Area have certified to the U.S. Department of Commerce that they adhere to the EU-U.S. Data Privacy Framework Principles (EU-U.S. DPF Principles) and from the United Kingdom (and Gibraltar) under the UK Extension to the EU-U.S. DPF, or that they have alternate data transfer certifications and policies in place Use of automated decision making and profiling: we do not use automated decision making nor profiling for our email newsletter on our website. Rights of residents of the European Economic Area in relation to their information to access your information and to receive information about its use to have your information corrected and/or completed to have your information deleted to restrict the use of your information to receive your information in a portable format to object to the use of your information to withdraw your consent to the use of your information to complain to a supervisory authority please note that these rights do not apply unless you are a resident of the European Economic Area Sensitive personal information: we do not knowingly or intentionally collect what is commonly referred to as ‘sensitive personal information’. Please do not submit sensitive personal information about you to us. For more information, please see the main section below entitled Sensitive Personal Information. Our details The data controller in respect of our website is Bombich Software, Inc. You can contact the data controller by writing to 785 Williams St #132, Longmeadow MA 01106 USA, or sending an email to privacy@bombich.com. If you have any questions about this Privacy Policy, please contact the data controller. Information we collect when you visit our website We collect and use information from website visitors in accordance with this section and the section entitled Disclosure and additional uses of your information. Web server log information We use a third-party server to host our website called Knownhost, LLC, the privacy policy of which is available here: Knownhost Privacy Policy. Our website server automatically logs the IP address you use to access our website as well as other information about your visit such as the pages accessed, information requested, the date and time of the request, the source of your access to our website (e.g. the website or URL (link) which referred you to our website), and your browser version and operating system. Our server is located in the United States and, accordingly, your information is transferred outside the European Economic Area (EEA). For further information and information on the safeguards used, please see the section of this privacy policy entitled Transfers of your information outside the European Economic Area. Use of website server log information for IT security purposes We and our third-party hosting provider collect and store server logs to ensure network and IT security and so that the server and website remain uncompromised. This includes analyzing log files to help identify and prevent unauthorized access to our network, the distribution of malicious code, denial of services attacks and other cyber-attacks, by detecting unusual or suspicious activity. Unless we are investigating suspicious or potential criminal activity, we do not make, nor do we allow our hosting provider to make, any attempt to identify you from the information collected via server logs. Legal basis for processing: compliance with a legal obligation to which we are subject (Article 6(1)(c) of the General Data Protection Regulation). Legal obligation: we have a legal obligation to implement appropriate technical and organizational measures to ensure a level of security appropriate to the risk of our processing of information about individuals. Recording access to our website using server log files is such a measure. Legal basis for processing: our and Knownhost’s legitimate interests (Article 6(1)(f) of the General Data Protection Regulation). Legitimate interests: we and Knownhost have a legitimate interest in using your information for the purposes of ensuring network and information security. Use of website server log information to analyze website use and improve our website We use the information collected by our website server logs to analyze how our website users interact with our website and its features. For example, we analyze the number of visits and unique visitors we receive, the time and date of the visit, the location of the visit and the operating system and browser used. We use the information gathered from the analysis of this information to improve our website. For example, we use the information gathered to change the information, content and structure of our website and individual pages based according to what users are engaging most with and the duration of time spent on particular pages on our website. Legal basis for processing: our legitimate interests (Article 6(1)(f) of the General Data Protection Regulation). Legitimate interest: improving our website for our website users and getting to know our website users’ preferences so our website can better meet their needs and desires. Cookies Cookies are data files which are sent from a website to a browser to record information about users for various purposes. We use essential cookies on our website, but do not use analytical or advertising cookies. For further information on how we use cookies, please see our Cookies Policy. You can reject some or all of the cookies we use on or via our website by changing your browser settings but doing so can impair your ability to use our website or some or all of its features. For further information about cookies, including how to change your browser settings, please visit www.allaboutcookies.org or see our Cookies Policy. Information we collect when you contact us We collect and use information from individuals who contact us in accordance with this section and the section entitled Disclosure and additional uses of your information. Email When you send an email to email addresses displayed on our website we collect your email address and any other information you provide in that email (such as your name, telephone number and the information contained in any signature block in your email). Legal basis for processing: our legitimate interests (Article 6(1)(f) of the General Data Protection Regulation). Legitimate interest(s): responding to inquiries and messages we receive and keeping records of correspondence. Legal basis for processing: necessary to perform a contract or to take steps at your request to enter into a contract (Article 6(1)(b) of the General Data Protection Regulation). Reason why necessary to perform a contract: where your message relates to us providing you with goods or services or taking steps at your request prior to providing you with our goods and services (for example, providing you with information about such goods and services), we will process your information in order to do so. Transfer and storage of your information We use a third-party email provider to store emails you send us. Our third-party email provider is Lux Scientiae, Inc. located in the United States. Their privacy policy is available here: Lux Scientiae Privacy Policy. Some emails you send us are transferred to our help desk software, hosted by our third-party help desk provider, Zendesk, LLC. For further information please see the section of this privacy policy entitled Website help desk support request form. Emails you send us will be stored outside the European Economic Area on Lux Scientiae’s and/or Zendesk’s servers in the United States. For further information please see the section of this privacy policy entitled Transfers of your information outside the European Economic Area. Website help desk support request form When you contact us using our website’s help desk support request form, we collect your email address. We also collect any other information you provide to us when you complete the contact form including a description of your support request. If you do not provide the mandatory information required by our contact form, you will not be able to submit the contact form and we will not receive your inquiry. Legal basis for processing: our legitimate interests (Article 6(1)(f) of the General Data Protection Regulation). Legitimate interest(s): responding to inquiries and messages we receive and keeping records of correspondence. Legal basis for processing: necessary to perform a contract or to take steps at your request to enter into a contract (Article 6(1)(b) of the General Data Protection Regulation). Reason why necessary to perform a contract: where your message relates to us providing you with goods or services or taking steps at your request prior to providing you with our goods and services (for example, providing you with information about such goods and services), we will process your information in order to do so). Transfer and storage of your information We use a third-party help desk provider to store messages you send us. Our help desk provider is Zendesk, LLC located in the United States of America. Their privacy policy is available here: Zendesk Privacy Policy. Messages you send to us via our help desk support form may be stored outside the European Economic Area on our help desk provider’s servers in the United States. For further information about the safeguards used when your information is transferred outside the European Economic Area, see the section of this privacy policy below entitled Transfers of your information outside the European Economic Area. In-App help desk support request form When you contact us from within one of our desktop software applications by using the Help menu item and support form, we collect your name and email address. We also collect any other information you provide to us when you complete the contact form including a description of your support request and/or your application logs. If you do not provide the mandatory information required by our contact form, you will not be able to submit the contact form and we will not receive your inquiry. Legal basis for processing: our legitimate interests (Article 6(1)(f) of the General Data Protection Regulation). Legitimate interest(s): responding to inquiries and messages we receive and keeping records of correspondence. Legal basis for processing: necessary to perform a contract or to take steps at your request to enter into a contract (Article 6(1)(b) of the General Data Protection Regulation). Reason why necessary to perform a contract: where your message relates to us providing you with goods or services or taking steps at your request prior to providing you with our goods and services (