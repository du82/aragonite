["https://bombich.com/kb/ccc6/whats-new-in-ccc"]
title = "What's new in CCC 6? - Bombich Software"
full_description = '''CCC 6 offers unprecedented accountability for your backup tasks, plus a brand new file copier that's faster, smarter, and designed to adapt to Apple's fast pace of OS and filesystem innovation. Combined with a sleeker, modern interface, we think you're going to love this new version of CCC. Faster backups with our next-generation file copier We've completely rebuilt our file copier to take advantage of the performance characteristics of modern storage. Built on a multi-threaded design, our new file copier provides a foundation for many of the new features noted below, and paves the way for many new features in the future. CCC Dashboard: The new menubar application CCC's menubar application has gotten a complete makeover. The new "Dashboard" offers one-click access to starting, stopping and monitoring your CCC tasks, plus details about recent task activity. The Dashboard also gives you a heads up to snapshot disk usage on the startup disk. Have you ever deleted files from the startup disk, emptied the Trash, then wondered why the space wasn't freed? Many people have been blindsided by the creation of snapshots on the startup disk – by CCC, Time Machine, and even macOS. CCC's Dashboard tracks the disk usage consumed by snapshots. If a sudden change occurs, or if disk usage is exceeding expectations, CCC raises the change to your attention so you can address the root of the matter. Related Documentation Monitoring backup tasks with the CCC Dashboard Snapshot Navigator: Easy way to explore older versions of files Looking to restore a specific version of a file? CCC's Snapshot Navigator allows you to step through older versions of your backups and get a preview of your files as they were at specific points in time. Related Documentation Restoring older versions of files using CCC's Snapshot Navigator Redesigned Interface with Dark Mode CCC v6 includes a new, cleaner user interface. We reorganized the main window to make it smaller while making many of the controls and font sizes larger. We completely redesigned every window in CCC; revisited every button, every icon, and every color decision to offer a high quality Dark Mode experience. CCC now offers more detailed progress indication while a task is running, including a time remaining estimate. File processing and transfer rates are now charted live during backup tasks. Hover your mouse over the chart to view the current write rate (white) and files evaluated per second (green). Quick Update: Leveraging FSEvents for super quick updates to the destination Did you know that macOS keeps track of changes to folders? CCC 6's Quick Update taps into this service (called "FSEvents") and the result is lightning quick updates to your backups - no exhaustive scanning for changes required. When Quick Update is enabled for a task, CCC will ask the FSEvents service for a list of folders modified on the source since the last backup rather than scanning every folder for changes. The performance benefit of this feature are remarkable, we've seen up to 20X improvement to backup time, especially for tasks involving a destination network volume. Related Documentation Use Quick Update when it's possible to collect a list of modified folders from macOS Compare: Visual comparison of the source and destination You've finished your backup but the source and the destination aren't exactly the same size; did CCC miss something? Probably not – the disk usage of your source and destination are usually different, but what are the specific differences? CCC's Compare feature offers a visual comparison of your task's source and destination, and provides details if the differences are the result of a task filter. Use this feature to quickly determine if something is missing from the backup, or if folder size differences are simply the result of files sitting in the Trash. Related Documentation Comparing the source and destination Task Preview: See what changes CCC is going to make before actually making them If you've ever been nervous about what changes CCC may make on a destination volume, you can use the new Preview feature in CCC 6 to see what's going to happen before making the changes. This "Dry Run" is available via the Preview button in CCC's toolbar, and any time you save a task for which the SafetyNet feature has been disabled. Related Documentation Preview: See what changes CCC will make to the destination Backup Audit: Task History events include a list of transactions What was copied, and why? You asked for this, and we're delivering it with style in CCC 6. When your tasks run, CCC will record detailed information about the transactions that occurred during the task, e.g. files copied, files updated, folders created or updated, files deleted or archived. You can view these backup audits in CCC's Task History window, and never again wonder why CCC copied a particular file. Related Documentation Transactions: Viewing details about the modifications made by the backup task New scheduling option: Run a backup task "When files are modified on the source" Using the same underlying technology that’s used by the "Quick Update" feature, CCC 6 offers a new automation option that allows you to have a task run when a threshold of data changes have occurred at the source. So rather than hourly or daily, etc., the task will run after 5GB’s worth of data has changed (for example). You can throttle that with a time limit as well, e.g. don’t run the task more than once every 5 minutes. Related Documentation Scheduling Option: When files are modified Advanced File verification Previous versions of CCC have included the exhaustive "Find and replace corrupted files" option, but that option has a couple shortcomings that we wanted to resolve. CCC 6 can verify files at the end of the backup task, and also offers the opportunity to verify files on the source and destination, independently, against a hash that was recorded when the file was last copied. Verifying the integrity of the source or destination CCC 6 stores the modification date, size, and checksum of every file that was copied by a particular task. On demand, you can ask CCC to evaluate files on either the source or destination (independently of the other volume) against historical checksums. This gives you the opportunity to not only verify the integrity of the backup, but also to verify the integrity of the source. Verification of files that were copied by the current task event If you've ever migrated data to a new disk, you've probably wondered, "How do I know that all of the data was actually copied?" You may also not have realized that media sector failure is most often discovered on read, not on write, which means that data corruption that occurs on the new disk isn't usually discovered until some time in the future when you try to re-read the files. This new Advanced Setting offers a new postflight task option to verify files that were written to the destination. Related Documentation How to verify a backup Re-verify the files that were copied Other new features and improvements Our to do list never ends, and we're constantly receiving great feedback from users on how we can improve CCC. Here are just a handful of simple improvements that we're excited to introduce in CCC v6: Per-task control over the file copier's CPU usage. You can temporarily pause a backup task. More information about your source and destination right at your fingertips – click on the source or destination selector to see extensive information about the selected volume. Refined Simple Mode – quitting and reopening CCC to switch modes is no longer necessary. Items that cause task errors can be excluded directly from the Task History Errors table. CCC's Task Filter now offers support for respecting macOS "backupd" exclusions (i.e. exclusions defined for Time Machine). Upgrading from CCC 5 The upgrade path from CCC 5 to CCC 6 couldn't be simpler. Simply open CCC 6, and it will automatically update your CCC v5 tasks. If you kick the tires for 30 days and decide to stick with CCC 5, simply re-open CCC 5 and choose the option to downgrade. CCC 5 will then reload your original CCC v5 tasks and everything will be as it was prior to your trial of CCC v6. Notable interface changes going from CCC v5 to v6 We use application usage metrics (see CCC's Settings > Updates for details) to determine which features of CCC get used most frequently, and which options perhaps no longer deserve the valuable real estate they've enjoyed in the past. Based on those data and user feedback, we make adjustments to the CCC user interface to make it easier to use and more approachable to new users. In CCC v6, we made the following notable adjustments: File menu: We renamed the File menu to "Task". We know this is a pretty radical idea for a macOS application, but "File" just isn't the right word. CCC is task-oriented, so we broke the mould and renamed this menu to Task. SafetyNet: The SafetyNet setting is now accessed via the Destination selector. Click on the Destination selector (i.e. the icon of your selected destination volume or folder) to access the SafetyNet options. Also note that a badge is applied to your destination icon to indicate the current SafetyNet behavior applied to that destination. When you hover your mouse over the badges a tooltip will provide a description. "Copy all files"/"Copy some files" popup menu: This popup menu is now obsolete. Click the Task Filter button at the bottom of the window to reveal your task's filter settings. If you want to retain a filter but not apply it to your task (comparable to the previous "Copy everything" setting), click the "Disable Task Filter" button in the toolbar of the Task Filter window. Send Email: Click the Advanced Settings button, then click on the Postflight tab to find this setting. Legacy bootable backups: On macOS Big Sur (and later), CCC creates Standard Backups by default, it no longer attempts to back up Apple's proprietary System volume. You can still configure CCC to establish a bootable copy of the system, however we do not recommend making bootable copies of the system as part of a backup strategy. After selecting a source and destination, click on the Destination selector and choose Legacy Bootable Copy Assistant to configure CCC to create a bootable copy of macOS. Related Resources Download CCC 6 Download CCC 5'''
