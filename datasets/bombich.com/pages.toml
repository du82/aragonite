["https://bombich.com"]
title = "Carbon Copy Cloner: macOS Backup Software - Bombich Software"
full_description = '''"One size fits all" is not a custom fit. CCC backups are tailor-made. Restore a single file, copy one folder to another, recover your whole Mac, or migrate data to a new Mac. Need to migrate your external Photos disk to something bigger? CCC will do it faster and more reliably than the Finder. Schedule your backups hourly, daily, weekly, monthly, or when changes are detected. Restrict backups to running based on the day of week, hour of the day and you can even pause a backup and restart at a more convenient time. Precisely define what should and should not be backed up. You can visualize the effects of custom filter rules, and CCC will show how much data is going to be backed up. Automatically mount and unmount your backup disk at the beginning and end of backups. Run shell scripts before/after your backups. Chain tasks together for a highly-customized workflow. CCC is smart enough to know that you only want to copy files that have been added or modified — no matter what backup option you choose, it never copies files unnecessarily. Built with RI (Real Intelligence) to support APFS filesystem features and harness the power of modern solid state storage. Pause a backup at any time and resume it when you're ready. And even if the backup is interrupted unexpectedly, CCC will pick up where it left off the next time the task runs. Beast mode for blazing-fast copies is the default, but you can dial it back if you want backups to chill while you're working. CCC can create snapshots on your backup to capture the state of every file at that exact moment. Later, you can go back in time to recover files you accidentally deleted, or to restore a previous version of a file or folder. Can't remember where that deleted file was kept? Search by file name across all of the snapshots on your CCC backup. Worried about losing files that were offloaded to a cloud service to “free up some space"? CCC can temporarily download cloud-only files from cloud-syncing services to make a local backup.'''
