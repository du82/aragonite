["https://bombich.com/kb/ccc6/release-notes"]
title = "CCC 6 Release Notes - Bombich Software"
full_description = '''CCC 6.1.11 April 4, 2024 A reminder dialog to run an "On reconnect" backup task is now removed more reliably when the backup volume is attached. Normally when a destination NAS volume drops offline in the middle of a backup task, CCC will attempt to remount the NAS volume, and if successful, will resume copying files. If a request to update the content of a specific folder happened to be in progress while the NAS volume dropped offline, that folder should be re-processed. We addressed a timing issue that was failing to reprocess folders like this specifically when they had not yet completed enumeration on the destination. Fixed a timing issue that was causing CCC to not add a login item for the CCC Dashboard despite that setting being enabled in CCC Settings > Dashboard. Unhiding the Library folder on the destination is now handled more reliably for "Cloud Storage" backup tasks. When using an ExFAT-formatted source, we now catch extended-attribute-only changes more reliably (e.g. changing Finder tags) when updating the backup. CCC 6.1.10 February 22, 2024 Made an adjustment to the "Restore" button constraints in the Snapshots table to improve its appearance in some non-English locales. Separately, fixed an issue where this button would errantly appear on non-selected row views when scrolling. Fixed a layout issue in the "Grant Full Disk Access to CCC" window that was causing the French description to get cut off. Fixed an issue that was causing the volumes listed in the View menu to be disabled. Adjusted the logic for suspending deletions when a directory enumeration error is encountered during source discovery. We no longer suspend deletions when the error is specific to a DataVault (i.e. an Apple-proprietary and Apple-apps-only container). Fixed a condition that could lead to a "When files are modified on the source" task to repeat itself (too frequently) in cases where the task was failing in the source/destination readiness phase. Fixed an issue that could occasionally lead to unresponsiveness of the "Cancel" button that is presented when a CCC software update fails (e.g. because internet connectivity dropped). Fixed an issue where tasks that back up to or from a Remote Macintosh could go into a repeat run cycle if the remote Mac was reachable but not responsive. This appears to be restricted to cases where the remote Mac was behind a router that was responsive, but dropping traffic to the remote Mac. The Compare button is disabled/enabled more consistently when the source or destination is unmounted/mounted. CCC 6.1.9 January 30, 2024 Addressed a scenario where CCC's appearance (i.e. Light Mode vs. Dark Mode) would not track the system setting when configured to do so. Addressed two conditions that could lead to delays when opening CCC or connecting to its helper tool. Made an adjustment to how folder enumeration is approached on rotational destination volumes. This should result in fewer subtask hang events when enumerating high-file-count folders on these devices. Fixed an errant trial expiration issue that eventually affects Pro License users that are using a license sidecar file. Increased the timeout when creating or removing snapshots to accommodate slower backup devices. Worked around an esoteric FAT32 filesystem bug that was resulting in a file at the root level that could not be deleted. Implemented a more effective solution for retrieving folder lists for cloud-synced folders that were added via the web or via another Mac. Fixed a couple minor Voiceover issues relating to the volume attribute buttons that appear when a volume is selected in CCC's sidebar. These buttons reveal a popover, but Voiceover was failing to consistently read the content of those popovers. We also added a transparent dismissal button to that popover to make it more easily-dismissible via the Voiceover Control+Option+Space keystroke. CCC 6.1.8 October 23, 2023 Added a new "Cloud Storage" option to the Source selector that automates most of the steps involved in setting up a task to make a dedicated, local backup of cloud-only content. Fixed an issue in which CCC was failing to delete items that were locked on the destination. Addressed a performance issue in a preflight task that was leading to some errant reports that a subtask had timed out. Added longer timeouts when downloading really large cloud-only files. Fixed some minor cosmetic clipping issue (e.g. the weekday buttons in the Weekly box of the scheduler popover, the Start button in Simple Mode, and title of a volume presented in the Source/Destination contextual menus) The Trial window is no longer errantly presented in cases where a Pro License registration is applied via a sidecar file. The Quick Update Task Inactivity override threshold is now 28 days for NAS destinations (still 14 days for all other destinations). CCC 6.1.7 September 5, 2023 This version of CCC adds official support for macOS 14 Sonoma. This update includes changes that affect all supported macOS versions, however, so we recommend this update for all CCC v6 users. Added support for temporarily downloading cloud-only files from services like Dropbox, OneDrive and GoogleDrive (any cloud-backed service that uses Apple's FileProvider interface). This includes support for downloading cloud-only content from iCloud as well, with some minor caveats due to Apple's use of a proprietary, non-FileProvider cloud-syncing service (oh, the irony!). Click "Advanced Settings" at the bottom of the CCC window and select the "File Copying Settings" tab to find the new setting. Note that this setting is disabled by default and limited to Macs running macOS 12.5 or later. If you want CCC to temporarily download your cloud-only files to make a local backup, be sure to enable the new setting in Advanced Settings > File Copying Settings. In 6.1.6 we added a new setting to "Use the  menu dialog for task restart/shutdown requests" (available in the CCC Dashboard application). We enabled that setting by default, figuring it gives people a more graceful opportunity to cancel shutdown if they're in the middle of something, and no harm done if the user isn't at the system (the system performs the request after a 60-second countdown). But, apparently macOS doesn't present that dialog if the screen is locked, and doesn't perform the power management request either. The setting is still available, but now it will be disabled by default to restore the pre-6.1.6 behavior. Addressed an error that could occur when copying sparse files that have a negative physical file size (which is corruption of the file's filesystem entry on the source). Addressed a small issue affecting Quick Update tasks where some folders would errantly appear as "modified" in the Task Audit despite that they were not actually modified. Fixed a logic issue that was preventing the "Manage snapshots on 'Macintosh HD'" option from being presented for the startup disk (i.e. because the System volume is typically not mounted). Fixed an issue in which CCC would repeatedly (and unnecessarily) prompt for NAS credentials in cases where the username or host name contained a space character. The dynamic performance chart is now stopped when a task is paused, and resumed when the task is resumed. Fixed a false-positive stall report that can occur at the end of a task that is recording millions of transactions. CCC 6.1.6 May 23, 2023 Now that Ventura adoption rate among CCC users is >60%, we changed all "Preferences" references to "Settings". Addressed a crasher that only occurs on older Macs that are running Monterey or Ventura via the "Open Core Legacy Patcher". Fixed a logic issue that might cause CCC to ask for NAS volume credentials when it already has them. Improved the experience when using the snapshot navigator with a folder selected. Previously the scroll view was scrolling back to the top, now the folder will remain selected, and the view will be scrolled to reveal as much of the folder's content as possible. Addressed a collection of spurious errors that would occur when restoring to the startup disk. Also resolved an issue in which iCloud might require you to log in again after restoring to the current startup disk. Added an option to the CCC Dashboard to use the Apple menu shutdown/restart dialog when a task makes a postflight restart/shutdown request. This gives a heads up to the action and an opportunity to cancel it. This is enabled by default and configurable in the Task tab settings. Fixed the color of task event status icons in the Task History window when using Dark Mode. Addressed a condition where CCC was throwing in the towel a bit early when the destination was running low on free space. Added a new "Descend into bundles" attribute for custom filter rules. CCC 6.1.5 March 14, 2023 When applicable, more context is presented now in cases where a task fails due to a stall at the source or destination (e.g. what specific file or folder is involved in the stall). At the end of a task event, CCC now sets the destination root modification date to "now", rather than preserving the source root folder modification date. The modification date of the destination root folder has more value as an indication of when CCC last made changes to the destination vs. when the user last made changes to that root folder on the source (which is typically long ago). This should offer an easy indication to the end user of "When was the last CCC backup made to this volume?". Errors that occur due to a disagreement between the source and (typically NAS) destination filesystems on how composed characters should be stored are now presented with more specific advice and a link to a new Kbase article. Network change events are now listed in the Activity tab of the CCC Dashboard application if any CCC tasks require network resources. Made some adjustments to the pruning of CCC's Task History database so it consumes less space. Fixed the behavior of the Task Filter window when working with a Remote Macintosh source. CCC will now run the postflight shell script (if specified on a task) in cases where the source or destination dropped offline, thus causing the task to abort. Previously we were avoiding running the script in this case (despite running that script in other error conditions), but we've since decided that there isn't any good reason for not running it. Made a small logic adjustment for tasks configured to run "When the source or destination is remounted" to avoid running when a staged System update is mounted (i.e. when the startup disk is the source). Adjusted the sidebar width when exiting full screen mode. Fixed a layout issue in the task plan when hiding and then revealing the sidebar (specific to Ventura). When a task fails because the source or destination is missing, and the user has enabled the "Don't send error notifications" (when the source or destination is missing) setting, the error will now be presented with the "cancelled by the user" icon in the Task History window, rather than an error icon. Fixed an issue in which a "Backup Health Check" would errantly (but harmlessly) recopy a certain class of files that did not need to be recopied. CCC 6.1.4 November 29, 2022 CCC will now preserve the space savings of pure "cloned" files (duplicated via the clonefile() function, e.g. duplicated in the Finder) when copying from an APFS volume to another APFS volume. CCC will now preserve the "Date Added" attribute on files and folders on filesystems that support that attribute. CCC will no longer raise concerns about dropped cloud-only placeholder files. With a minor adjustment and some additional testing of several scenarios, we have determined that there is no longer a restore concern related to dropping these placeholder files. If you previously excluded the CloudStorage folder from your backup, you may remove that exclusion. You're also welcome to leave the exclusion in place. In our tests, the cloud service providers populated the absent content just fine. Errors related to minor filesystem corruption in /Users/username/Library/Biome on macOS Ventura are now suppressed. Improved the handling of errors when free space is depleted on the destination volume. The "Only on the next run" and "Once a quarter" options are no longer hidden in the frequency popup menu adjacent to the "Find and replace corrupted files" setting. Same deal for the "Archives that are older than" option in the SafetyNet pruning limit popup menu in Advanced Settings > Preflight. The "Command+R" keyboard shortcut for starting a task now also works for starting a task group. Fixed an issue in which the throttling mechanism applied to "When the source or destination is reconnected" tasks was not getting applied consistently. Fixed an edge case in Ventura where the "Legacy Bootable Copy" method would fail with a "destination is full" error in cases where the destination was a disk image and the source was a clean install of macOS Ventura. Added a Ventura download link to the macOSInstaller Media Assistant. Added a global exclusion for a "@Recently-snapshot" folder that appears on some NAS devices. Copying each snapshot within this folder will typically overrun the capacity of the destination. Fixed preflight mounting and ownership enabling on Remote Mac destination volumes on Ventura+ Macs. When CCC is configured to copy files from a volume that lacks support for file ownership (e.g. a NAS volume, or any volume with ownership disabled), ownership of files copied to the destination (when applicable) is set to the user account that configured the CCC task. This update fixes an issue in which numeric user account IDs larger than 32768 were getting improperly applied. This is not a common scenario; typically user account IDs start from 501, but in some corporate environments they can be much larger. CCC 6.1.3 September 19, 2022 This version of CCC adds official support for macOS 13 Ventura. This update includes changes that affect all supported macOS versions, however, so we recommend this update for all CCC v6 users. The "System exclusion" is no longer applied in cases where the destination is a subfolder on the startup disk. Fixed an issue in which "on reconnect" tasks were not correctly getting throttled according to the task configuration if the task was also configured to prompt the user to proceed when the missing volume was reconnected. The Compare window now shows files discovered on the source and destination separately. Especially for really slow destinations like NAS volumes, this will give a clearer indication of ongoing progress. The clonefile replacement procedure will no longer be used if snapshots are disabled on the destination. The primary purpose of using that procedure is to use storage more efficiently so that we can retain more snapshots, and that's moot if we're not retaining snapshots. When you auto-fill a password in CCC's Email Settings (i.e. from the system's "Passwords..." m'''
year_published = 2025
clearnet = "https://bombich.com/kb/ccc6/release-notes"
