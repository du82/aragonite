full_description = "Cookies Policy This Cookies Policy sets out the basis on which we, Bombich Software, Inc., use cookies and similar technologies on or in relation to our website, https://bombich.com (our website). This Cookies Policy is effective from July 30, 2024. ‘Essential’ cookies are automatically placed on your computer or device when you access our website or take certain actions on our website. We do not place ‘non-essential’ cookies or other similar technologies on your computer or device, thus there is not an option to consent or withdraw consent. For information on the difference between essential and non-essential cookies, see the section below entitled About cookies. For information on how you consent and how you can withdraw your consent to us placing non-essential cookies and other technologies on your computer or device, see the section below entitled How to accept or reject cookies. Contents About cookies List of cookies used Essential cookies Non-essential cookies Web beacons How to accept or reject cookies Copyright, credit and logo About cookies What are cookies? Cookies are small data files sent by a website’s server to a web browser, processor memory or hard drive and stored there. They can be used for a range of different purposes, such as customizing a website for a particular user, helping a user navigate a website, improving that user’s website experience, and storing that user’s preferences and login information. Essential and non-essential cookies Cookies can be classified as either ‘essential’ or ‘non-essential’. Essential cookies: these are cookies that are either: used solely to carry out or facilitate the transmission of communications over a network; or strictly necessary to provide an online service (e.g. our website or a service on our website) which you have requested. Non-essential cookies: these are any cookies that do not fall within the definition of essential cookies, such as cookies used to analyze your behaviour on a website (‘analytical’ cookies) or cookies used to display advertisements to you (‘advertising’ cookies). Session and persistent cookies Cookies can be classified as either ‘session’ or ‘persistent’, depending on how long they last after they are placed on your browser. Session cookies: session cookies last for as long as you keep your browser open. They expire when you close your browser. Persistent cookies: persistent cookies expire at a fixed point in time or if you manually delete them from your browser, whichever occurs first. First and third party cookies Cookies can be classified as ‘first party’ or ‘third party’. First party cookies: these are cookies placed on your device by our website domain. Third party cookies: these are cookies placed on your device by third party website domains. If you require further information about cookies in general, please visit www.allaboutcookies.org List of cookies used We use the following cookies on or in relation to our website: Name of Cookie Essential or Non-essential? Type of cookie First or Third party? Session or Persistent? Expiry Time Purpose XRSF-TOKEN Essential Functional First Party Session When browser is closed Contains a unique, random value that is generated by our server and stored on your computer to aid in prevention of cross-site request forgery attacks. bombich_software_session Essential Functional First Party Session When browser is closed Temporarily stores information related to your current visit to our site. All of this data is deleted when your web browser is closed. _help_center_session Essential Functional First Party Session When browser is closed Zendesk cookie. Preserves users states across page requests. _zendesk_session Essential Functional Third Party Session When browser is closed Zendesk cookie. Preserves users states across page requests. _zendesk_shared_session Essential Functional Third and First Party Session When browser is closed Zendesk cookie. Preserves users states across page requests. _zendesk_thirdparty_test Essential Functional Third Party Session When browser is closed Zendesk cookie. Checks if third party cookies are enabled in your web browser. Essential cookies These are cookies which are strictly necessary for our website to be able to operate or to provide you with a service on our website which you have requested. We use the following essential cookies on our website: first party session cookie to store information related to your current visit to our site. This cookie is bombich_software_session. This cookie expires when your browser is closed. It stores your language preference, keeps track of the previous page visited, saves messaging banner information, records form values that were entered, and performs other related website delivery tasks. first party session cookie to prevent cross-site request forgery attacks. This cookie is XRSF-TOKEN. This cookie expires when your browser is closed. It stores a unique, random value that is generated by our server. first party and third party session cookies to determine if third party cookies are enabled and then establish a help desk connection and preserve your login status across pages. These cookies are _help_center_session, _zendesk_session, _zendesk_shared_session, and _zendesk_thirdparty_test. Legal basis for processing: we process information about you contained in or obtained from essential cookies in our legitimate interests (Article 6(1)(f) of the General Data Protection Regulation). Legitimate interests: ensuring our site functions properly and providing you with online services you have requested. How to opt out of essential cookies Most browsers allow you to block all cookies, including essential cookies. Please note, however, that if you block all cookies, parts of our website and its functionality may not work or display properly. You can delete existing cookies from your browser by clearing your browsing data and ensuring that the option to delete cookies is selected. For more detailed information on how to accept and reject cookies, including guidance for specific browsers, please see the section below entitled How to accept or reject cookies. Non-essential cookies We do not use non-essential cookies on our website. Other technologies Web beacons We embed web beacons in our marketing emails. Web beacons are small GIF image files which enable us to track your receipt of our marketing emails, your location, IP address, date and time associated with each open and click for a campaign. Web beacons are activated whenever you open a marketing email that contains a web beacon. Web beacons transmit data when you view them but are not capable of accessing any other information on your computer. Web beacons are not stored on your hard drive unless you download a GIF image containing them. Some email clients enable you to restrict the use of web beacons by either preventing them from sending information back to their source or by not accessing the images containing them (for example, if you select a ‘do not display images’ setting on your email server). How to opt in or out See the section below entitled How to accept or reject cookies Legal basis for processing: we process the information we gather from the use of web beacons in our legitimate interests (Article 6(1)(f) of the General Data Protection Regulation). Legitimate interest: analyzing the effectiveness of our email marketing campaigns to help us improve our business. How to accept or reject cookies Since we do not use non-essential cookies on our website, we do not provide a way to consent to them, deny consent to them, or delete them. You are welcome to block the use of some or all of the essential cookies we use on our website. However, please be aware that doing so may impair our website and its functionality or may even render some or all of it unusable. There are a number of different ways in which you can accept or reject some or all cookies and similar technologies. Some of the main methods of doing so are described below. You should also be aware that clearing all cookies from your browser will also delete any cookies that are storing your preferences, for example, whether you have accepted cookies on a website or any cookies that are blocking other cookies. You can find more detailed information about cookies and adjusting your browser settings by visiting www.allaboutcookies.org. Browser settings You can accept or reject some or all cookies (for example, blocking all third-party cookies) by adjusting your browser settings. If you do not know how to do this, the links below set out information about how to change your browser settings for some of the most commonly used web browsers: Google Chrome Mozilla Firefox Microsoft Internet Explorer Apple Safari Some browsers, such as Chrome and Firefox, allow you to change your settings to browse in ‘incognito’ mode, limiting the amount of data placed on your machine and automatically deleting any persistent cookies placed on your device when you finish your browsing session. There are also many third party applications which you can add to your browser to block or manage cookies. Clearing existing cookies To clear cookies that have previously been placed on your browser, you should select the option to clear your browsing history and ensure that the option to delete or clear cookies is included when you do so. Web beacons You can opt in to our use of web beacons in our marketing emails by subscribing to the html version of our emails. You can opt out of our use of web beacons in our marketing emails by subscribing to the plain text version of our emails. Copyright, credit and logo This Cookies Policy is based on a template provided by GDPR Privacy Policy. For further information, please visit https://gdprprivacypolicy.org. The copyright in this Cookies Policy is either owned by, or licensed to, us and is protected by copyright laws around the world and copyright protection software. All intellectual property rights in this document are reserved. Where we display the GDPR Privacy Policy logo on our website, this is used to indicate that we have adopted a privacy policy template provided by GDPR Privacy Policy as the basis for this Privacy Policy."
