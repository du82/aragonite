title = "作为研究历史的独立学者，我想写出一本有人看的书（康熙的红票）书评"
description = "2024年，《康熙的红票》正式出版，揭开了一段中国与西洋深度接触的往事，并对正史..."
full_description = '作为研究历史的独立学者，我想写出一本有人看的书 商务印书馆 评论 康熙的红票 5 2025-02-14 14:22:33 已编辑 北京 { "@context": "http://schema.org/", "@type": "Review", "datePublished": "2025-02-14T14:22:33", "reviewBody": "2024年，《康熙的红票》正式出版，揭开了一段中国与西洋深度接触的往事，并对正史未记载的“红票之谜”交出了一份精彩答卷。扎实的史料、流畅的文笔、极具原创性的观点，让本书出版后即在读者中引发强烈反响，上...", "description": "{ review.abstract(200) }", "itemReviewed": { "@type": "Book", "name": "康熙的红票", "url": "/subject/36794613/", "sameAs": "https://book.douban.com/subject/36794613/", "image": "https://img1.doubanio.com/view/subject/l/public/s34821689.jpg" }, "publisher": { "@type": "Organization", "name": "豆瓣(Douban)" }, "author": { "@type": "Person", "url": "https://www.douban.com/people/1790516/", "name": "商务印书馆", "sameAs": "https://www.douban.com/people/1790516/" }, "reviewRating": { "@type": "Rating", "ratingValue": "5" } } 2024年，《康熙的红票》正式出版，揭开了一段中国与西洋深度接触的往事，并对正史未记载的“红票之谜”交出了一份精彩答卷。扎实的史料、流畅的文笔、极具原创性的观点，让本书出版后即在读者中引发强烈反响，上榜豆瓣2024年度读书榜单“年度图书”与“年度历史·文化”。1月14日，豆瓣读书联合商务印书馆，邀请本书作者孙立天和《澎湃新闻·上海书评》执行主编、著名书评人郑诗亮，一起聊一聊历史写作。这本书脱胎于作者孙立天的博士论文和英文专著，为了使扎实的学术专著变得 “易读”和“好看”，孙立天结合了美国学术资源与中国传统考证方法，受西方汉学家史景迁、黄仁宇启发将历史叙事具体化，并借鉴通俗文学技巧，增强故事吸引力。直播中孙立天还讨论了历史客观性与主观性的问题，鼓励历史写作者用好现有的材料，勇于表达个人观点。以下为此次对谈的文字回顾，完整直播回放可在豆瓣读书视频号观看。独立学者的身份胡晓凯：《康熙的红票》这本书自2024年4月份上市以来，就受到了来自读者和媒体的持续关注，豆瓣评分一直没有下过9.4分，年底它登上了十几个媒体的年度榜单。在这些榜单当中，我们非常看重的一个就是豆瓣年度榜单，起初我们预估它应该能够入“历史·文化类”，但是结果很让人惊喜，它不仅摘得了历史·文化类第一名的桂冠，而且还登上了年度图书榜单，今天借这次直播，也感谢广大豆友对这本书的厚爱。本场活动的主题是“学术与通俗的平衡：历史写作的探讨”，这本书出版之后，很多读者反馈说，这是他们第一本从头到尾读完的历史书，其他书可能读一两章就会放下，但这本书是一读就停不下来，一两天就能轻松读完。面向大众的历史写作是近些年一个很热的话题，下面也很期待二位老师就这个话题做一个深入的探讨。作者: 孙立天 出版社: 商务印书馆 副标题: 全球化中的清朝 出版年: 2024-3郑诗亮：今天第一个话题想从我最关心的一个问题开始聊起，也就是不少朋友未必知道的孙老师“独立学者”的身份。作为一名独立学者，孙老师写作这本书有什么样的感受？ 孙立天：独立学者在中国的情况我不是太清楚。在美国的话，做独立学者的基本条件是有的，应该说自古就有，马克思也可以算是独立学者。后来像物理、化学这些学科，做研究需要借助很多设备，必须依靠一个机构，普通人没办法独立研究。现在有一些学科，至少在美国是有独立学者的，比如我们传统的文史哲，还有就是诗歌。就我所知，当今最有名的独立学者是一个俄罗斯的数学家，他叫佩雷尔曼，是学界内外公认的数学领域最厉害的人物。像我在美国做历史领域的独立学者，各地的图书馆会有很多支持，比如纽约市图书馆，它有个项目，我去注册以后就可以用哥伦比亚大学的图书，所以从资料使用方面，我跟哥大的老师条件基本上是一样的。此外，不管你是否在大学，面对的学术标准是一样的。从我自己的亲身经历，不管是找出版社出书，还是发表学术文章，从审稿和整个出版流程来看，是没有什么区别的。这也是让我觉得独立学者可以继续做下去的一个原因。我的个人情况比较特殊，我读博士中间断了很多年，读完年纪也比较大了，家庭等各方面因素让我难以找到一个合适的学校，这也是我做独立学者的一个原因。我想对年轻的朋友说，独立学者不是特别值得推崇的研究学术的路径。能够找到一个大学，在里面安安静静地做研究，这个挺好的。独立学者只是我个人找到的一条还能继续做下去的路，但我自己也不是很推荐，这条路也不好走。我想写出一本有人看的书郑诗亮：责编老师告诉我说，孙老师为了今天这个活动，准备了一个25分钟的自述，对他整个写作历程和思路有一个深入的梳理。接下来，我把时间交给孙老师。孙立天：好，我就编辑给我安排的一个题目，说说我是怎么想到写这本书的，还有我的求学经历对写书有哪些影响。我回溯得久一点，从大学说起。我是在复旦大学读的历史系，2000年初的时候，历史算是冷门专业。我高中时也没想过要学历史，后来高考成绩不好，是被调剂到历史系的。进了学校，听了很多老师的课，读了一些书以后，才渐渐开始对历史感兴趣。最早我喜欢读传记，有一本书印象深刻，叫《陈寅恪的最后20年》，看完那本书以后，我顺着里面的线索看了很多传记，包括胡适的、萧公权的，还有钱穆的《八十忆双亲··师友杂忆》，现在我都还记得很清楚，读完这些书，我对民国的知识圈很感兴趣，觉得这大概是一条可以走的路，走起来也挺有意思。我想既然要做历史，就要写出一本有人看的书才行。后来我在写书的时候，最关注的一个点就是：要有人看。我其实一直是把书当成一个商品在思考，很关注写出来大家能不能读得下去。在国外的读书经历对我写作的影响有两个方面。一个是汉学家的作品。西方学者写作比较注重叙事性和可读性，这与美国的学术评价系统有关。你从讲师升到副教授，评审的时候比较注重学术性。你发的期刊论文如何？同行是不是认可？升到教授，就拿到了tenure（终身教职），有了这个，这些老师就没有压力了，他们就会比较注重书的市场影响力，这个也是我的观察。比如我们都知道名气很大的研究中国历史的“汉学三杰”，孔飞力、魏斐德和史景迁，为什么他们能称为三杰呢？因为他们三个都写出了可读性比较强的，对历史读者有很大影响的著作。美国整个的评价系统比较倾向于这个方面，也就是，书作为一个产品或者商品对一般读者的影响，而不仅限于得到同行的认可。“汉学三杰”代表作：孔飞力《叫魂》，史景迁《王氏之死》，魏斐德《中华帝国的衰落》我们如果再仔细分析，你会发现“汉学三杰”中对整个历史圈都有影响的是史景迁，很大的原因是，他的书能够触及各个领域的读者。我曾经看到国内的一些评价，认为史景迁的学术水平不行。史景迁是写康熙的，我也写康熙，我能看到他是在有意隐藏他的考证，写出来让你觉得好像很简单，特别是他写的康熙皇帝的自传《康熙：重构一位中国皇帝的内心世界》，他是读了无数多的奏章奏折，模仿康熙的语气写出来的。在历史写作上，这种写法是很难的，完全是一种原创。所以这部著作的目标读者并不局限于中国历史，各个历史门类的读者都在读他的书。我写完博士论文以后，就去买了一本书，叫《从博士论文到书》，这本书主要的一个观点就是，你必须考虑读者，不能用博士论文这个模式，陷在议论框架中出不来。我总的意思是，美国历史学术界有这个传统，我也被这个传统影响到了。还有一个，在国外读书对我影响比较大的是理论方面的。我不知道现在国内历史理论引进的情况，只能谈20年前我刚到美国的感受，那个理论上的冲击是比较大的。当时国内讲西方理论都是黑格尔、年鉴学派这些。但我一到美国选课，不管是历史、人类学、还是比较文学，全都是反对这些理论的，其实从二战之前他们就开始反对这些理论了。简单说就是两条：一条是你不能把历史的发展看成线性的，它不是科技。社会有些东西是在退步，这个是对我冲击很大的一个后现代理论。我书中提到的“偶然性”，其实也是西方后现代理论的其中一个观点。第二个就是逻辑性，以前我们觉得历史就是一环扣一环，很有逻辑，我们写出来也是很有逻辑的。但这可能是出于需要刻意为之的。这个观点其实在柯文的《历史三调》里提到过，这本书在国内也很有名气。其实有没有逻辑，是跟线性的历史紧密相关的。我自己学科学史，库恩的科学史也是这个意思，说我们的科技进步是跳跃式的，不是从逻辑到达的。在美国学到的理论对我冲击比较大的还有一点，就是历史客观性的问题，这也是近100年美国历史学界一个最主要的话题。从1930年代开始，他们就将德国历史学者提出的对历史客观性的追逐称为一个“梦想”。他们认为，你可以对历史的客观性心向往之，但你要明白那是无法达到的，所以不要有这个执念。对于历史写作者，这其实是一个思想上的解放。你们在我的书里面会发现，我做了一些心理分析、一些推测。其实我知道这种分析或者推测是我主观的判断，会有人不同意，但是不同意就不同意吧。我只是说出我自己的观点。今天大家可能有这个感觉，历史好像不怎么讲故事了，都在讲大理论。其实原因就在于，你如果执着于追求历史的客观性，就不敢立足人物去讲故事，不敢去写细节，因为你一立足人物、讲细节，那个主观性自然就出来了。只有你把这个客观性的问题想明白了，才能回到人物本身。其实从我们中国自己的历史传统上来说，一直都是注重人物和细节的。司马迁第一篇写得比较详细的就是《项羽本纪》，它详细到什么程度呢？项羽最后死之前，他怎么处理虞姬的，他们怎么说话的，最后他怎样依依不舍地把自己的战马交出去，这些他全部都写出来。司马迁说，为什么我能写这么详细，因为项羽生活的时代，他称为“近古”，指离他自己的时代不远，所以他能写这么详细。再老的叫“远古”。其实注重细节和人物的写作一直是我们中国历史书写的传统，包括我们看民国的学者，比如清史的奠基人或者叫祖师爷，孟森，他的研究在今天看来是很八卦的。他研究顺治皇帝和董鄂妃的关系，对于董鄂妃是不是董小宛，他很细致地做出考证。他还考证“太后下嫁”，孝庄太后是不是嫁给了多尔衮。你看民国学者也都是很具体的，他们其实还是在很具体地在研究个人。最后再回到独立学者的问题，我这个独立学者能不能做下去，一个很重要的因素就是有没有人看我的书。这本书有很多朋友看了，商务印书馆也告诉我卖得很好，我很高兴，但其实在刚开始写作的时候，一直到出版之前，我们也不确定这本书会不会有人看。只是说，我自己有这个压力，如果书卖得好，我这个独立学者还可以继续做下去。如果卖不好，我大概也做不成了。有了这个压力，自然就会多花一些力气在写作上面，要把它设计得成熟一些。这就是我对整个写作过程的一个简单回顾。郑诗亮：非常感谢孙老师。通过他刚刚对自己学术和写作生涯的回顾，大家应该对孙老师的写作风格，或者说对他的风格产生影响的作品有了一个初步认识。下面，我想跟大家分享一下我读孙老师这本书的感受。我的感受非常简单，就一句话，“我等待多年的那本书，终于到来了”。这话是什么意思呢？孙老师刚刚介绍的时候提到很多书，那些也都是我喜欢的。而我个人印象很深的，是中学时代读到的两本书，当时有一种石破天惊的感觉：原来历史书还可以这样写。第一本是大家熟悉的，如今已成经典的黄仁宇的《万历十五年》。还有一本，就是孙老师刚刚提到的史景迁的《王氏之死》。我在想，为什么历史上一个平平无奇的年份，1587年，也就是万历十五年，黄仁宇可以通过它把明代历史写得那么精彩，那么引人入胜？妇人王氏只是一个普普通通的小人物，并不是我们历史上所熟悉的帝王将相——那些所谓能够改变历史走势的大人物，为什么通过妇人王氏，我们反而可以看到一些历史的深层次的东西？这种写法真的是非常迷人。但遗憾的是，后来我在中文的出版界和写作圈里面，很少能遇见在学术和通俗之间平衡得很好的书。不管是当年走红的《明朝那些事儿》，还是现在流行的各种各样的通俗讲史，我都读了不少。这些书好看当然是好看的，也造出了不少梗，但很多时候难免为了追求面向大众的普及性，牺牲掉很多本应保有的学术性或严肃性。这是一方面。另一方面，我觉得很多原本可以很好看的书不免过于学术。最近见到学者张治先生，他是研究钱锺书的专家，他出了一本新书，叫《文思珠玉：〈钱锺书的手稿集〉丛札》，讨论了一个很有意思的话题，就是钱锺书这位博览中西典籍的大学问家是怎样读书的。但是这本书写得极为学术，对非专业读者而言，门槛可能有点太高了。他告诉我，他之后还会再出一本书，叫《钱锺书的阅读世界》，责编特意提醒他一定要写得通俗一点，如果书写得太学术，只是面向学者，注释套注释，概念叠概念，普通读者是读不懂的。那么，我想讲的一点是：你要坚持学术性，很多时候就要牺牲掉可读性，你要坚持通俗性，很多时候就会牺牲掉严肃性——一直以来，这都是困扰写作者和研究者的一个大问题。国内有没有能将两方面平衡得好的作者呢？当然也是有的，但是读到孙立天老师这本书，就像我前面说的，中学时代读到史景迁、黄仁宇的感觉又出现了。为什么这样说？我觉得孙老师前面非常深入，也非常诚恳的自述，已经把答案揭晓了。第一点，孙老师对西方理论很熟悉，他受过严格的国外学院训练，摆脱掉了过去较为陈旧的历史理论框架的束缚，接触到了各种现代史学理论的熏陶和训练，这个非常重要，恐怕并不是国内每一个历史写作者具备的。当然，现在条件好了，越来越多年轻学者出国留学，但是和孙老师处在同一个年龄阶段的历史写作者中，像他这样在国外接受过这么严格的学院训练的，那是不多的。第二点，我觉得可能更加重要，就是孙老师他很早就摆脱了这种学院式的、面向学术圈写作的思路。他刚刚提到一个词，我不知道各位注意到没有，叫产品。换而言之，孙老师很早就意识到，我写出书来是要让读者喜欢读的，是要让读者接受的，所以我的书是一个产品，要根据市场需求来打磨。事实上，孙老师在之前接受采访的时候说过，他这部书也遭到过几次拒稿，但是比较有意思的是，在这个过程当中，拒稿编辑跟他有过比较深入的沟通，指出他的书稿存在哪些问题。包括这次在商务印书馆出版，责编老师也跟他在如何面向大众写作方面有深入的沟通和交流。我相信，不管是孙老师本身所秉持的产品思维而非学者本位的思维，还是不断跟编辑的交流，都帮助他在这本书的写作中，很好地平衡了学术性和通俗性。最后一点，也是我待会儿想跟孙老师沟通和交流的，就是这本书的选题角度，我觉得太棒了。说实话，我在读孙老师这本书之前，完全不知道“康熙的红票”的存在。他在写作的时候，会拿康熙的红票为线索串起清代的内务府，进而串起大众读者喜闻乐见的清代宫廷政治，最后把康熙和雍正两代皇帝做比较，去考察中西文化交流这样一个大的主题，读来非常过瘾。所以我想说，就像我们今天这个活动主题所揭示的那样，孙老师这本书在学术性和可读性的平衡上做到了一个堪称教科书级别的呈现。我相信，以后出版的历史领域的书籍，都会把这本书作为一个标杆，或者说作为一种写作和出版的标准。我还想再谈一点，前面孙老师提到他非常喜欢读民国学者的研究。我记得温功义先生写过一本书叫《三案始末》，写得很精彩。温先生跟我一样是媒体人——当然，过去习惯叫报人。他写明代三案只用了十万字左右，篇幅很短，一本小册子就把明代的宫廷政治史讲得非常清楚，而且丝丝入扣，很有可读性。我相信孙老师在阅读这些民国学者的著作当中，也获益良多，不管是选题上还是写作上，他都能够很好地继承前辈的独到之处。“红票”这个角度是如何找到的郑诗亮：我接下来还是把时间交还给孙老师，您可以谈谈选题思路怎么得来的吗？您怎么想到从康熙的红票来切入对清代史和全球史的写作，可以跟读者分享一下吗？孙立天：好的，在回答问题之前，我先补充一点。刚才我说了很多国外对我的影响，其实国内历史对我影响也很大，比如中国的考证传统。你刚才说到钱锺书，我读大学的时候，中文系的傅杰老师就很推崇《管锥编》，我看了之后，很羡慕他能贯通中西进行考证。我刚到美国的时候，还专门找钱锺书的英文文章来看。他的英文也写得很好，考证的是十七和十八世纪英语文献里的中国。中国学者有这个传统，不管事情有多小，或者说有多八卦，他们都能考证，考证得还很细。还有一本书，陈寅恪的《柳如是别传》，今天的读者看起来可能费力，因为我们的知识储备少了，民国时期的读者看可能比较容易。书里面的内容充分体现了中国的考证传统。我读世界各国历史，没有哪个国家能比得上我们这一点。回到刚才郑老师的问题，这本书的选题角度是怎样来的？其实是这样，现在书卖好了，读者多了，大家觉得这个选题好像很厉害，但其实它不是一蹴而就的，我并不是开始就一切尽在掌握。还是涉及那个问题，学术与通俗的平衡，为什么这样说呢？在我看来，如果学术和通俗是两端的话，就有两种走法，一种是从通俗往学术走，包括影视剧和纪录片也可以算这种，你要保证产出内容的严肃性，需要多查学术记录，多查史料，保证我说的事情是真实的，或者说是有其他学者研究过的，不要毫无根据地乱写。另一种走法就是从学术往通俗走。美国的学者都是这样走的，他们学术上最核心的原创观点，新理论也好，新论证也好，先是通过论文来呈现。后面就要把论文扩展成一本书，也就是要把文章变成一个产品。在这个过程中，我既要保持住原创的观点，同时又要更多的人能够看得懂。我以前说过一点，有些学术本身离大众的关注点很远，其实是很难强求达到通俗的。比如字词的考证，考证古代人是怎么读音的，这种学术也很有意义，但它很难变成一本大众能够看的书，而当你跟大众的关注点比较接近的情况下，它是有可能变成通俗读物的。我这本书现在有人看，就是因为康熙和雍正都是大家耳熟能详的人物。一个朋友跟我说，你这本书有先天优势，一说到清代皇帝，大部分人都知道康熙雍正，但是说到明朝皇帝，除了朱元璋，后面能说上来的就很少了。所以，正是有了这个铺垫，我们才有可能把学术的东西写成一个通俗的作品。我最近看到一本书，讲《红楼梦》里的法律、社会和女性，也是这样，大家都读过红楼梦，有这个共同的背景知识，我再以《红楼梦》为背景来解释清代的这些法律，才能够把它写成一个通俗的作品。具体到我这本书，我在学术上的核心观点，通过博士论文，再到英文书，已经形成了。下面到中文书，我就只考虑一点，怎么把故事理顺。有些作者很厉害，他能一步到位。我其实分了几个步骤才完成的。我在豆瓣看到读者提到一个问题，说这本书为什么不用脚注，要用尾注？其实这个小细节也是我们希望这本书能够面向大众的一个考量，希望大家不要被注释干扰，能够把这个故事一口气读完。如果你看完这本书，觉得需要翻一下注释，就在书后翻一下。我也想顺便提一点，这本书附送了两枚书签，其实是给大家准备好的，一张给你用来放正文，一张用来放注释，如果你有兴趣的话，你就这样放。其实美国现在的学术书也有这个趋势，我看到可能有70%到80%也都是采取尾注的形式。下面谈谈我怎么找到红票这个角度。可能红票对大众来说比较新鲜，但其实做中西交流的中外研究者，他们都知道红票。我在这本书要完稿的时候，面临一个很重要的问题，就是怎么取书名，我就想到了红票，它在我书稿的中间部分出现，我就把它拿了出来。这里还有一个小插曲。当时为了达到好看，我还专门去看了看金庸小说的写法，我注意到一点，他小说的书名都是很具体的，比如说《倚天屠龙记》，就是屠龙刀和倚天剑，《神雕侠侣》这个名字也很具体。我整个写作过程中想强调的也是尽量具体写，不要讲理论。我在取名字的时候也想到，要抓出一个很小的东西，让人感觉这本书很具体。我最原始的想法，这个书大家看了之后喜不喜欢无所谓，但起码“康熙的红票”这个名字是不会忘记的。我在看金庸的小说时，也注意观察他是怎么把一段一段情节连接起来，吸引你往下看的。其实电视剧用的策略也类似。我们传统的章回小说有一句话叫：欲知后事如何，请听下回分解。其实就是这个策略。刚才郑老师提到《万历十五年》，我也专门去翻过，看它是怎么连贯起来的。我的一个印象是，它确实每一章里面是没有小标题的，它是自然地通过文字进行连接，这个也是我学习的一个方面。所以，我把“康熙的红票”拎出来作为一个引子，它就像一个问题或者谜底，吸引读者往下看，有破解谜案的感觉。我总体要表达的是，这本书我不是一蹴而就，而是走一步看一步，从我的学术论文，然后到英文书，再到中文书，最后变成现在的样貌。康熙和雍正两代皇帝的不同郑诗亮：非常感谢孙老师，对自己的写作技巧做了一个毫无保留的大揭秘。我觉得孙老师谈得特别实在，归结起来，就是写作要善于分段落，善于留扣子，善于借鉴大众市场上特别受读者欢迎的畅销书写作技巧，为我所用，讲得非常诚恳和接地气。我想接下来交流一个您书里我特别感兴趣的话题。您在书里面重点谈到了康熙和雍正两代皇帝。这两代皇帝怎样在细节上体现出他们性格和从政风格的不同？孙立天：说到这两个皇帝，我觉得首先要有一个思想上的解放，就是说，我们要敢于代入自己的主观感觉，去谈论这些皇帝的个人想法，比如说我读到康熙批的奏折，看到雍正给他的奴才写的话，通过他们不同的语言风格，对他们会有一个印象。这是人之常情，你和人交流，谁比较文静，谁比较外向，通过很简短的对话你是能感觉出来的，对不对？我们把皇帝作为历史对象的时候，以前因为有追求历史客观性的束缚，大家不大敢聊，觉得没有证据不好讲话，对不对？我的看法是，我们在写作的时候，本着我自己的观察，本着传统上说史学家的良心，本着我觉得对的写，错了其实也无所谓。在这个前提下，我们就可以比较康熙和雍正，他们的个性有很大区别。整体来说，就是康熙他在各方面都是有底气的，他的底气来源于什么呢？他大概15岁才开始学中文，如果大家去看他的奏折，虽然他的毛笔字我觉得写得很好，但还是经常有错字，也不大通顺，可以看出中文是他的第二语言，有点像我们学英文的感觉。另外一点，康熙的骑射是很厉害的，他是满族人，文武兼备，带皇子们出去，经常是儿子都累了，他还不累。他三次亲征噶尔丹，远征大漠，经历这些事情，他的格局当然不一样。反观雍正，他上台以后，北京他都不敢随便出，当然不可能像康熙一样北征南巡。你把这些事情放到一起的话，就能明显感觉到两个人的不同。就像有两个人出现在你面前，一个是周游世界的，一个是长期不动的，跟你聊天，你大概也能感觉出他们的不同。然后你说对历史走向的影响，我个人对这个“走向说”是比较拒绝的。历史遇到了雍正，后来又遇到了乾隆，而他们又正好遇到了17和18世纪科技迅速发展的世界。但科技并不是一直这样在发展的。以前大家崇尚希腊罗马，从科技发展方面说，这是有问题的。从希腊罗马开始，有一千多年的时间，西方科技一直停滞不前。要等文艺复兴以后，渐渐科技发展才开始。我书里面写到一点，我认为现代科技最重要的基石，在于代数和方程，以及这之上发展出的微积分，包括现在电脑编程用到的语言，其实都是从代数思维发展出来的。但是代数不是欧洲自己发明出来的，是阿拉伯传过去的，他们只是踩上这个点上发展了起来。西方在飞速发展的时候，正好被康熙、雍正、乾隆遇到了。其实正常来看，他们三个皇帝都算好皇帝，都很勤政。但他们正好遇到了外面的世界翻天覆地，那怎么办呢？我写这个书，不是想说中国没有跟西方接上轨是雍正的错。我想说的是，雍正当时做出那个决定，是因为他自己是佛教徒。还有一点，雍正的汉语水平是大大好于康熙的，毛笔字不见得比康熙写得好，但是他的汉语水平是远超康熙的。你们看书里那张红票，最早内容是满文的，康熙的奴才把它翻译成了中文，翻译得很差，康熙改了一下，还是不很通顺，你们仔细读，这个红票是没有经过内阁修改，直接发出去的，措辞很口语化。你们可以比较一下，书的附录中雍正写给年羹尧的信，那个有点像佛教公案里面的语言，既不是这样又不是那样，水准是很高的。雍正禁教其实在我看来也是一个很正常的事情，站在他的角度，西方那个时候也并不很发达，他也不知道后来科学要大发展，这个是没有办法预测的。就像今天，说到AI能发展成什么样，我们也不知道，以后应该会很有用，但到底多有用谁知道呢。20多年前，我上大学时还在手写信，投到邮筒里面，那也不是很遥远的事情，那时候觉得电脑有用，但也没想到短短20年，会发展到今天这个地步。所以说你站在雍正的角度想，他也不知道后面西方会大发展。所以我写的时候，并不是想说这是雍正的错，只是我们要理解他为什么这样做。我想说的是，康熙容纳传教士有他容纳的道理，雍正禁教也有他禁的道理，很难说谁对谁错，这就是我对他们两个人的一个对比。康熙和传教士的主奴关系郑诗亮：我还想问一个问题，您在这本书一开头就谈到，我们过去一直觉得康熙跟传教士之间有着良好关系，是因为康熙本人对西方文化特别感兴趣。我记得中学时读过一篇蛮有意思的杂文，王小波写的，叫《皇帝做习题》，他在文中说，你看，连康熙这样的古代皇帝都那么热心于科学，愿意学微积分，我们今天的人是不是更加应该爱科学？但是读罢您的书，我才发现，其实这个因果逻辑上是反过来的，不是因为康熙热爱西方文化才去接触传教士的，而是他从小就对身边的传教士很熟悉，然后才会对传教士所代表的西方文化感兴趣。更进一步就是，您在书里探讨了很多传教士深度介入清代宫廷政治的话题，这个我们之前关注得不多，可不可以请您展开谈谈？孙立天：我最早是在大学本科阶段接触这个课题，当时觉得康熙对西学感兴趣这个说法有问题。我看到康熙他学的那些数学知识其实并不简单，我理解起来都很费力。比如关于怎么测定太阳的影子，那是需要几何知识，要系统学习的。那个要理解的话，我想最低也要小学四年级水平吧。也就是说，你要先学四年才能看得懂，这是我最早的一个想法。我在高中学数学时，确实也感受到数学论证里面这种美感。后来我在国外见到很多做纯数学研究的学者，他们真的很像古代人，对生活没有任何追求，一门心思钻学问，比如解出庞加莱猜想的佩雷尔曼，他自己连工作都没有，靠母亲的退休金生活，后来很多世界知名大学要聘他，他也不去，他就愿意一个人做研究。像这样的例子还有一个，我们华人里面数学做得最好的一位叫张益堂，他2013年的时候证明了孪生素数猜想的一个弱化形式。这个是希腊罗马时期就有的问题。这些数学家追求的都是很纯粹的学术层面的乐趣。你跟普通人讲这个数学中的乐趣，他们能理解吗？能够有兴趣的，必须是学进去了，学会了才会有乐趣。有了这个初始点，我后来又看到一些奏折，就确定了一点，康熙他的数学水平不是一般的好，他已经学到当时比较前沿的问题了。大家如果对康熙的数学水平有兴趣的话，可以看一本书，就是康熙和他的皇三子参与编定的《数理精蕴》。这本书里面没有讲理论，而是一道道题目。你们可以去看一看里面的题，会不会做？反正有些我是不会做的。《御制数理精蕴》一般称《数理精蕴》，是一部介绍包括西方数学知识在内的数学百科全书。现藏于故宫博物院。我来做一个比较，说明兴趣和兴趣之间的区别。比如有些皇帝好色，这个不需要多高的门槛；喜欢饮酒，也不需要门槛。但喜欢数学，喜欢天文观测，这个门槛是很高的。这就是我一个原始的想法，这个想法指引我，去探究这些传教士最早是怎么进入皇宫的？按照我的逻辑，康熙是经过了传教士的教导，然后才喜欢上西学的，那么就是传教士进宫在前，他喜欢在后，这个也是指引我研究的一个思路。我这本书从学术上说，在清史领域提出了一个全新的观点，即传教士是以奴才身份在清宫里面行走。当然，这个观点还有待更多学者来验证。我当时发现一点，传教士经常能够进出皇宫，照理说皇宫你不能说随便就进去，你需要一个身份，就像今天我们要进很多大学，你需要有校友、学生、老师的身份。这就提出一个问题：这些传教士是什么身份呢？显然只有少量传教士在朝廷里面有官职，就是钦天监，大部分包括比较有名的都没有官职。当然这些我在书里面写得很详细了。我看到豆瓣上有读者说，我写得有点啰嗦重复，一个原因就是为了证明这些传教士是康熙的奴才，或者说康熙把他们当成奴才在对待。我其实是从学术角度前前后后在论证这个问题。因为包衣奴才是清史里面一个核心问题，清代政治有别于明代的就是八旗制度，八旗制度维系的就是主奴关系，所以让学术圈接受这个观点是不容易的。举个例子，管理包衣奴才的是内务府，以前写内务府专著的学者从来没有写过传教士，如果我这个观点成立，以后他们的书是不是要改一改，把传教士加进去？所以，正因为这是一个学术界不容易接受的观点，我才会反复讲。我最近看到一个观点说，康熙只是自己在学西学，没有推广。我不知道这个观点是从哪来的，至少我在国外没有听过。其实当时的西学，无论是康熙，还是下面的士人，都有在学，在《四库全书》里面就有很多汉人接受了传教士的数学思想写的东西。最起码，康熙没有禁止汉人学习西学，尽管他也没有推广西学，比如把它作为科举考试的科目。当时数学也好，西学也好，传统文人只要有兴趣，是有学习渠道的。现在提到比较多的一个人叫梅文鼎，他是江南的一个数学家，和传教士有过切磋，后来还游历到北京。清代朝廷还把梅文鼎召到北京去修明史的算学部分。问答环节郑诗亮：孙老师已经谈了很多，接下来我们跟线上提问的读者朋友做一个交流。前面孙老师谈到每章最后会有一个小结，像扣子一样把读者留住，读者说他很喜欢。请问您是怎么想到去设置这个小结的？这当中有什么巧思和构想？孙立天：其实这个小结的设置，正体现了我对自己的写作没有信心，我怕我写完了以后大家没看明白，所以我再说一遍。其实我一度还想过要把小结拿掉，没想到还有读者觉得好，这也是一个巧合。这个小结最早是我写博士论文时导师要求的，他说你写完一章再总结一下，要让评审老师完全看得懂，因为你博士答辩的老师不一定都是做中国史的，有些是做阿拉伯史、法国史的，可能完全不接触中国史，所以必须写个小结，把写完的东西重新归纳一下。现在有读者说喜欢，可能也是这个原因，读者的历史背景知识不一样，这个小结给他们提供了便利。郑诗亮：下一个读者提的问题，他说包衣奴才是不是可以单纯地理解为是清朝的统治阶层为了平衡权力关系、监管社会而设置的一种职业，这是一个比较具体的清史方面的问题。孙立天：说到包衣奴才，就涉及清朝和明朝的区别。满人和蒙古人原本就是半游牧民族，奴才是他们社会系统的一部分。到了清朝立国，站在管理者的角度，他要用人，必须要用他信任的人，对不对？信任的人有几种：一个就是血缘关系，一个是通过联姻，第三类人就是家里的奴才。你想一想，我要传密信到某个地方去，让谁去传？很可能就是找我亲近的奴才，满人王公贵族家里的用人系统，就延续下来了。汉人通过科举制度选拔人才，皇帝御批钦点，意思是皇帝对你有知遇之恩，这个信任关系就建立起来了。满人是没有科举制度的。满人的奴才是他们原来的社会生活中就有的，他们入驻北京后，八旗制度延续下来。清史里面关于奴才的书很多，我只讲一点皮毛，大家有兴趣可以沿着这个方向看一看，这其实也是区别清朝和明朝的一个重要线索。郑诗亮：读者问，您的英文版专著是什么结构，是怎么讨论问题的？您前面也谈到这个中文书是从您英文版的原著改写过来的。这个问题说实话我也很感兴趣，可不可以请孙老师分享一下？孙立天：英文版和中文版最大的不同在于它是一本学术书，最主要的目的是展现我的学术观点。从学术的角度，我的书提出了两个比较重要的观点，这是我的原创。一个是怎么理解康熙与传教士的关系，我认为他们是主奴关系，这对于中西交流史是一个新论点。既然是新论点，我第一个目的就是把它证明给学者看。我考虑的是论证，我的英文书名叫Jesuit Mission and Submission《耶稣会传教士的使命与服从》，这个submission（服从）在基督教历史里面有特别的含义，传教也是对上帝的一种submission。《圣经》里面也有传教士，他们自称是上帝的奴仆。上帝的奴仆变成了皇帝的奴才，这是我英文书的一个主要观点。英文版书封 出版：BRILL对于清史来说，我英文书里也提出一个比较重要的观点，就是清朝的统治者有意识地绕开了朝廷制度。从明代传下来内廷外朝的制度，在清史中的记录很全。但是康熙私下绕开朝廷制度办事，清史就没有记录。我们通过传教士的记录把他绕开朝廷办的事情还原出来。这其中值得注意的一点是，清代皇帝办的不是秘密的事情，像我书里写到他接待教皇使团，这个使团从广东一路到北京，是众人皆知的，也就是说，他会绕开朝廷公开办一些事情。我要表达的观点就是，在清代皇帝的权力结构中，有以前学者没有关注到的朝廷以外的部分。我英文书的副标题有一个词“Qing rulership”（清朝统治），意思就是清朝统治有它自身的特点。简单来说，我写英文书，就是为了论证我的观点，相当于学术论文的一个加长版本。那时候没有考虑过架构要怎么吸引人，这个跟中文书是完全不一样的。郑诗亮：今天我们的读者真的赚到了，每一个提问孙老师都答得这么详细。下一个问题可能有点批评性的意思，读者说这本书的副标题“全球化中的清朝”有点大了，书中没有太体现出来。请孙老师回应一下好不好？孙立天：如果读者觉得这个题目大了，我完全能理解，当时确定副标题的时候，编辑也跟我说过，但我很坚持。有些书的书名是要和内容完全对应，但有些就是传达一种感觉，我常用“恋爱中的女人”来打比方，我们要体现一个恋爱中的女人，不见得要把它一点点写出来，你可以通过一些故事，让人感觉到这个女人在恋爱之中。我的目的就是通过书里的故事，让大家感觉到，清代初年是处在全球化大潮之中，并没有与世界隔绝开来。如果读者只是想看全球化的内容，可能找不到想找的东西。从这个角度，我承认副书名有点文不对题。其实起这个题目的时候，我还考虑到一点，就是它要传达一个新知。人们普遍对清初的印象是什么，我想到明末清初的传统观点”闭关锁国“，我想传达的就是，中国没有闭关锁国，或者再进一步说，清朝和外面的世界是紧密相连的。就是基于这个思路，取了这个名字，这算是我的一个解释吧。郑诗亮：下一位读者他关注的是您具体的写法，说书里面有些表述是有点前后重复的，甚至感觉有点啰嗦。然后他提到您是不是受到国外写作习惯影响。这牵涉到文风的问题，也请孙老师回应一下。孙立天：是，我承认有些地方有些重复和啰嗦。我来解释下为什么会这样。最初我们没想到会有这么多的读者，我们设想的目标读者是大学里的研究生群体，老师会把这本书作为推荐书目，比如指定他们读这本书的某一章。我们原来学习就是这样，老师不会要求你把整本书全部读下来，那样一学期只能接触到少量的书籍，也学不到多少东西。当时我就想，有些内容不再重复说一遍，读者只读一章是看不明白的。后来我看到很多读者留言，说他一天就读完了。当然这对我也是一个褒奖。我想说的是，写作时之所以有重复，是因为没想到大家读得这么快，预想大家是今天读一章，过三天再读，这个时候有些重复我觉得是必要的。就像美国的电视剧，它一个星期或一个月才更新一集，每次更新前面都要有回放。如果以后有机会出第二版，文字上我们会做一些简化，有些重复的地方我会给它改掉。很多读者是把它当成小说看，这样确实我也承认里面有很多重复。郑诗亮：这个问题牵涉到前面孙老师提过的后现代主义理论，这位读者说，感觉相比于关注规律和走向的宏大叙事，大家现在对历史上小人物的命运这种微观视角更感兴趣。孙老师怎么看这种转向？孙立天：这个在我看来，是因为今天读者的知识储备远远超过从前。五十年、一百年前，知识分子写书，会讲很多道理，有点像传教士传教。但是现在的社会，受过大学教育的比例大大提高，读者什么都懂，不需要听你讲大道理。所以，这个写作视角的改变也跟读者的文化背景有关。我们学欧洲历史的时候，说印刷术15世纪中叶开始在欧洲普及。更早的时候欧洲人家里只有一本《圣经》，女性连《圣经》都不能读，要读的话必须要有男性陪伴，《圣经》也要听神父给你解释。印刷术发明后，人们的知识水平渐渐提高，就出现了新教，说我们不需要听神父讲，我们自己读《圣经》就可以。所以，新教也是科技带来的一个巨大转变。现在已经是互联网时代，马上是AI时代了，没有人听你讲大道理了，你也不需要讲大道理，该懂的东西大家都懂，你写出来大家看就好了。我最近刚学到一个词，说90后、'
