能手也要淹死在里面。 沙威两个臂肘撑着桥栏杆，双手托住下颏儿，指甲机械地抠进浓密的颊髯里，一副沉思的样子。 一个新情况，一场革命，一场灾难，刚刚在他内心里发生，这就有必要反省一下。 沙威痛苦万分。 几个小时以来，沙威不再那么单纯了，他心慌意乱；这颗头脑在盲目中十分清澈，现在却浑浊了；这块水晶里生了云雾。沙威的良心感到，他的职责一分为二，也不能向自己掩饰这一点了。他在塞纳河滩十分意外地碰到冉阿让，当时的心情既像狼抓到了猎物，又像狗找到了主人。 他面前有两条路，都同样笔直，然而，两条路他全看到了，就不免惊慌失措；他平生只认得一条直路，而现在令他万分苦恼的是，这两条路完全相反，相互排斥，究竟哪一条是正路呢？ 他的处境难以描摹。 一个坏人成了救命恩人，欠了这笔债要偿还，这就是违心地同一名惯犯平起平坐，还要还这个人情。听对方说一声：“走吧”，然后自己再还一句：“你自由了”；为了个人动机而牺牲职... (查看原文) 小灰烬 4 回复 45赞 2012-11-21 04:18:15 —— 引自第1002页 他开始审问自己。 他承认自己不是一个无罪的人，受的处分也没有过分。他承认自己犯了一种应受指摘的鲁莽的行为；假使当初他肯向人乞讨那块面包，人家也许不会不给；无论给与不给，他总应当从别人的哀怜或自己的工作中去等待那块面包；有些人说肚子饿了也能等待么？这并不是一种无可非难的理由；真正饿死的事根本就很少见到；并且无论是幸或不幸，人类生来在肉体上和精神上总是能长期受苦、多方受苦而不至于送命的；所以应当忍耐；即使是为那些可怜的孩子们着想，那样做也比较妥当些；像他那样一个不幸的贱人也敢挺身和整个社会搏斗，还自以为依靠偷窃，就可以解除困难，那完全是一种疯狂举动；无论怎样，如果你通过一道门能脱离穷困，但同时又落人不名誉的境地，那样的门总还是扇坏门；总之，他错了。 随后他又问自己： 在他这次走上绝路的过程中，他是否是惟一有过失的人？愿意工作，但缺少工作，愿意劳动，而又缺少面包，首先这能不能不算是件严重的事呢？后来，犯了过失，并且招认了，处罚又是否苛刻过分了呢？法律在处罚方面所犯的错误，是否比犯人在犯罪方面所犯的错误更严重呢？天平的两端，在处罚那端的砝码是否太重了一些呢？加重处罚绝不能消除过失；加重处罚的结果并不能扭转情势，并不能以惩罚者的过失代替犯罪者的过失，也并不能使犯罪的人转为受损害的人，使债务人转为债权人，使侵犯人权的人受到人权的保障，这种看法是否正确呢？企图越狱一次，便加重处罚一次，这种做法的结果，是否构成强者对弱者的谋害，是否构成社会侵犯个人的罪行，并使这种罪行日日都在重犯，一直延续到十九年之久呢？ 他再问自己：人类社会是否有权使它的成员在某种情况下接受它那种无理的不关心态度，而在另一种情况下又同样接受它那种无情的不放心态度，并使一个穷苦的人永远陷入一种不是缺乏（工作的缺乏）就是过量（刑罚的过量）的苦海中呢？贫富的形成往往由于机会，在社会的成员中，分得... (查看原文) 海狸好牙 5 回复 23赞 2020-08-02 11:50:33 —— 引自章节：七 失望的内容 > 全部原文摘录 丛书信息 · · · · · · 外国古典文学名著选粹(共32册)， 这套丛书还有 《一生 漂亮朋友》《傲慢与偏见》《简.爱》《简·爱》《战争与和平（全四册）》 等 。 $(function(){$(".knnlike a").click(function(){return moreurl(this,{'from':'knnlike'})})}) 喜欢读"悲惨世界（上中下）"的人也喜欢的电子书 · · · · · · 支持 Web、iPhone、iPad、Android 阅读器 水浒传（套装全2册） 31.00元 红楼梦（套装全2册） 22.99元 少年PI的奇幻漂流（插图珍藏版） 25.99元 论文艺女青年如何培养女王气场 1.99元 夏日便当·修订版 1.99元 喜欢读"悲惨世界（上中下）"的人也喜欢 · · · · · · 巴黎圣母院 8.4 老人与海 8.5 项链 8.5 呼啸山庄 8.4 哈姆莱特 8.7 罗生门 8.7 欧也妮·葛朗台 7.8 羊脂球 8.3 双城记 8.4 雾都孤儿 8.2 我来说两句 短评 · · · · · · ( 全部 7570 条 ) 热门 52 有用 花事了 2016-10-05 23:41:22 那么，《这个杀手不太冷》里的杀手里昂和小女孩玛蒂达，他们的原型是《悲惨世界》里的冉阿让和珂赛特吗？ 23 有用 老探戈 2007-03-11 17:28:26 个人认为，第一部最好~ 41 有用 陈粒 2012-08-08 14:34:51 得把小时候浪费过的时间和书都争取回来。 42 有用 阿不壳 2007-12-28 09:2