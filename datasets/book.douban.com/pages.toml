full_description = '豆瓣直播文字回顾丨赵松X黄雪媛X程卫平：爱，是爱人之间的一个停留 小阅读Random 评论 诗歌的坏时代 5 2025-02-27 14:47:17 已编辑 上海 { "@context": "http://schema.org/", "@type": "Review", "datePublished": "2025-02-27T14:47:17", "reviewBody": "2月14日，豆瓣读书与广西师范大学出版社·文学纪念碑联合举办了一场文学直播，以“爱，是爱人之间的一个停留”为主题，深入探讨德国诗人布莱希特的诗歌世界。作为2024豆瓣读书“年度榜单系列对谈”的压轴活动，这...", "description": "{ review.abstract(200) }", "itemReviewed": { "@type": "Book", "name": "诗歌的坏时代", "url": "/subject/36607105/", "sameAs": "https://book.douban.com/subject/36607105/", "image": "https://img9.doubanio.com/view/subject/l/public/s34760215.jpg" }, "publisher": { "@type": "Organization", "name": "豆瓣(Douban)" }, "author": { "@type": "Person", "url": "https://www.douban.com/people/shbbt/", "name": "小阅读Random", "sameAs": "https://www.douban.com/people/shbbt/" }, "reviewRating": { "@type": "Rating", "ratingValue": "5" } } 2月14日，豆瓣读书与广西师范大学出版社·文学纪念碑联合举办了一场文学直播，以“爱，是爱人之间的一个停留”为主题，深入探讨德国诗人布莱希特的诗歌世界。作为2024豆瓣读书“年度榜单系列对谈”的压轴活动，这场对谈不仅聚焦布莱希特的情诗创作，还延伸至他的戏剧、流亡生涯及其与中国文化的深厚渊源。作家赵松与译者黄雪媛作为对谈嘉宾，从布莱希特的生平到其诗歌的多层次性，从情诗的细腻表达到抗争精神的深刻体现，带领观众走进这位20世纪文学巨匠的丰富世界。在这个特别的日子里，借着布莱希特《诗歌的坏时代》，共度文学的好时光。以下为完整文字记录。爱，是爱人之间的一个停留程卫平：各位豆友们，大家晚上好，欢迎大家来到我们的文学直播之夜。我是广西师范大学出版社“文学纪念碑”的编辑程卫平。这场活动是由豆瓣读书联合广西师范大学出版社共同举办的，也是2024豆瓣读书“年度榜单系列对谈”的最后一场活动。在2月14日情人节这么一个特别的日子里，我们来聊一位诗人，他就是贝托尔特·布莱希特。今天两位对谈嘉宾，一位是赵松老师，是作家，也是诗人，他还是文学评论家。他对布莱希特非常熟悉。另一位是华东师范大学德语系的副教授，黄雪媛老师，她是德语文学的学者、译者。她已经给“文学纪念碑”翻译了两本书。一本是《卡夫卡传：关键岁月》，另外一本就是今天对谈围绕的这本书——《诗歌的坏时代：布莱希特诗选》。一本很漂亮的小红书。这本书很荣幸在2024年获得了豆瓣年度诗歌图书NO.1。这次的主题，“爱，是爱人之间的停留：布莱希特的日常诗和抒情诗”，是由黄雪媛老师定的，首先我想问黄老师为什么会选择这个主题？黄雪媛：这个题目其实来自布莱希特中早期一首非常有名的诗歌，叫作《爱的三行诗》。这首诗最后一句就是：所谓爱，就是爱人之间的一个停留。我先给大家读一下：《爱的三行诗》看，群鹤在空中画出巨大的弧线！陪伴的云朵在鹤起飞时便与它们同从一个生命进入另一个生命。以同等的高度和同等的速度像一对天生的伴侣。云与鹤就这样分享着美丽天空短暂的飞翔谁也不比谁逗留更长除了彼此在风中摇曳的身姿眼中再没有别的身影此刻相依相偎，双飞双行。即使风把它们引至虚无；只要不失散，继续作伴没有什么能打扰此刻但也可能在任何地方被迫离散在大雨袭来或枪声响起的地方。在太阳和月亮不同的圆盘下它们飞啊飞，全然沉迷于对方。你们飞去哪里？ ——无问目的。你们从谁那里来？ ——来自所有人。你们问，它俩在一起有多久了？并没多久。 什么时候会分开？ 很快。所谓爱，就是爱人之间的一个停留。（1928/1929）这首诗我翻译时也挺喜欢，但是当时的喜欢还没有到后来一些年轻读者反馈的那般强烈。他们有的看到这一句以后被强烈击中，有的甚至是掉眼泪了。我想不管是正在恋爱中的年轻人，还是经历过爱的年轻人，读这首诗的最后一句，可能会有击中心绪的时刻。在上学期的文学通识课上，有一个中文专业的学生，在课结束后，给我写了一封信，但是没有留下名字。这封信我读了以后，其实也掉眼泪的。信一开始就说，“亲爱的黄老师您好，‘所谓爱，就是爱人之间的一个停留’，这句话对我的震动远比其他很多动人的诗句都要大。之前我很长一段时间觉得，爱到最后，所有的爱都好像只是那个样子，也正是因为这么觉得，对爱的开始或者持续感到了一种无意义。”信里说，通过布莱希特看到了诗歌的多样性，并愿意走进诗歌。后面一句让我很触动：我现在看到了读诗的可能性，也让我看到了自己的可能性。不仅是这位学生，还有好几位年轻人都被这首诗所打动，所以我就想将它作为我们今天对谈的标题。一是适合今天的特别氛围，另外布莱希特的情诗和以往的情诗很不一样，它让人打破了对爱情的幻想，同时仍然有一种信念，并且能够更加坦然，或者说释然。程卫平：我从这位同学的信里也能感受到布莱希特最后一句“所谓爱，是爱人之间的一个停留”，不仅仅是狭义上的“爱”或“爱情”，而是一个很广义的人与人之间感知到的那份爱。黄雪媛：停留这个词，德语是“Halt”。“Halt”这个词既有停留，又表示一种支撑。所以在彼此度过的那段时间里，虽然是短暂的，但是回头看，也是一种心理上的支撑。最自如的诗人程卫平：今天是情人节，空气中可能弥漫着玫瑰花的味道。我们选择这个日子和主题，当然一部分也是对今天这个日子的呼应。接下来我们会谈一谈布莱希特的情诗写作，因为我们对这部分诗歌写作，相较于我们熟悉的布莱希特的政治诗、社会诗，乃至他晚期的作品，会相对陌生一些。但在聊之前我想还是稍微介绍一下布莱希特。布莱希特，是大家非常熟悉的一位德国诗人，1898年出生在德国一个小城叫奥格斯堡，位于巴伐利亚。父亲是很富有的商人，他小时候接受了非常好的中产教育，包括音乐、文学等。1917年他去了慕尼黑读大学，学的是医学，但是布莱希特也跟鲁迅一样，最终“弃医从文”。他唯一的医学实践经历，是临近第一次世界大战结束在柏林一个野战医院做过短期的医护兵，从那之后，他就没有再做过医生这个职业。对他职业影响非常大的，是他在柏林那段经历，也就是1924年到1933年之间，他相当于是进入了柏林的文艺圈，准确说是柏林的戏剧圈。在那里他一方面结识了很多志同道合的文人、艺术家，另外一方面他建立了自己的事业，他的第二部戏剧《夜半鼓声》在柏林上演，一下子崭露头角。差不多1926年慢慢转向马克思主义，1933年希特勒上台，他的剧就直接被禁了，他也因为信仰被迫离开柏林，开始漫长的流亡生涯。一开始主要在北欧，后面辗转去了美国，战争结束最终又回到欧洲。他在一首诗里也写过“流亡了十五年”，1948年，他选择落脚民主德国（东德）度过他的晚年。在柏林他创建了“柏林剧团”（柏林剧团去年在国内上演的《布莱希特的鬼魂》非常受欢迎），布莱希特1956年在柏林去世。这是他并不算长的一生，只活了58岁。但特别突出的一点，就是在短短的一生中写了2300多首诗，从他15岁写第一首诗，到56年写的最后一首诗，可以算出来，平均差不多4到5天就写出一首诗。所以斯坦纳说，诗歌是他的“日常巡察和呼吸”，这个说法非常贴切地形容了诗歌对于布莱希特的地位。谈到布莱希特的诗，大家都很熟悉《这一年》《致后代》以及《诗歌的坏时代》等反纳粹，反法西斯的那些诗，但在这些政治诗之外，布莱希特的诗是丰富和多层次的。去年在上海思南之家我们一起谈过布莱希特，经过一年，赵老师对布莱希特有没有什么新的体悟以及您怎么看布莱希特的情诗？情诗对他是一个比较重要的主题吗，他情诗的艺术特色有哪些？赵松：上次参加布莱希特的活动其实对我也是一个触动，就是重新去阅读布莱希特。他的作品这些年翻译过来也有一部分了，戏剧、小说、诗，还有一些文论，尤其“文学纪念碑”出版的这本诗选，让我们可以从不同方面深入了解布莱希特的文学世界。我最近读了美国的菲利普·格兰写的《贝托尔特·布莱希特》，是本评传，对希莱希特一生的创作把握得比较精准。在我看来，布莱希特是20世纪世界文学领域的孤峰，一个绝无仅有的人物，很难归类。我们看20世纪世界文学史，可以找出各种现代主义流派和很多大师，但是像布莱希特这样的，就很难找到另一个与之相似或相近的。他是个非常罕见的文学全才。他的创作不仅涉及了大部分文学体裁，还跨界到了电影领域。他的戏剧影响力之大超乎想象，而他在戏剧对影像元素的大胆使用，对空间的重新理解和认识，对观众和演员关系的重新设定，都极大地启发了后来很多实验型的戏剧，甚至影响了很多当代艺术家的思维和创作方式。其实，布莱希特去世以后，在后世评价中，更倾向于认为他的文学创作中成就更伟大的，其实是诗歌。这不仅仅是因为他写了2000多首诗，更主要的还是因为诗歌在他整个创作生涯中所取得的成就是最高的。非常有意思的是，布莱希特生前并不太愿意去发表和出版自己的诗歌。他没有把它们当作一个需要不断去传播的文学样态，而是把它当成很私人的写作方式。他用诗歌去书写的，是他整个生命不断流逝过程中的经历、体验和认识。他之所以写这么多诗，就是因为他的诗总是在关注人与世界的关系。黄老师刚读的那首《爱情三行诗》，也很能说明问题，布莱希特写关于爱情的诗，也不是传统抒情诗的写法，不是去歌颂爱情的热情、美好或者痛苦……去写这些情感情绪层面的东西，而是更多去写人的认知层面的东西。他以诗赋予了“爱情”更深刻的认知，大家以为爱情就是永恒，是全部，是弥漫的，是可以让一切停滞的，但在布莱希特看来，爱情可能跟创作是一样的，写完一部作品就过去了，有的只是你跟它的短暂相遇，不管多么强烈的体验，它是有限的。正是因为它强烈，所以有限，就像中国话说“飘风不终朝，骤雨不终日”，强烈的东西不能持久。我们看布莱希特写爱情诗，跟他写其他类型的诗一样，他总是能够改变诗的样态。阅读大量现代主义的诗歌后，会有一种印象：这些作品在走向晦涩，在追求更内化的表达，更多地在探究意象关系，似乎更倾向于远离普通读者。现代主义诗歌的幽深、隐晦、复杂，让人有种传统诗歌形式，比如抒情诗、十四行诗已经过时的感觉。事实上，像布莱希特这样的诗人，有一种强大的能量——他能让所有你认为过时的诗歌形式焕发新生。他能够赋予这些传统形式以当代特质，从而让你意识到，从来没有一种形式是老旧的，陈腐的只是我们的理解方式、思维方式和想象方式。只要能够赋予强大的生命能量，提供新的认知角度和深度，任何一种所谓旧的东西都能变成新的东西。这是布莱希特的诗歌写作给我们的一个强烈启示，所以他在处理那些跟个人情感相关的诗歌时，他总能找到一个独特的角度，让我们去思考问题，而不是体验某种情绪或情感。比如他写过一首《弱点》，只有三行的诗，写情感：“你没有弱点/我曾有过一个：/我爱过。”爱过的人才知道，在爱中的人会更容易露出弱点——因为爱得越强烈，理性就会越少，人会变得更感性、情绪化。当布莱希特把这种洞察融入这三行诗里，它就产生了一种强大的质地和能量，让你意识到，原来“爱过”和“弱点”放在一起竟可以有如此深刻的效果。在这里，“弱点”变得耐人寻味，同时也让“爱过”变得特别。他没有说尽一切，却让过来人感同身受，他用几个字就把这个感觉传达出来，这就很厉害。黄老师选了300多首，差不多涵盖了从少年时代一直到晚期的作品。（通过这些诗）我们能看到为什么布莱希特会被后世认为是一个伟大的诗人，甚至可以跟奥登这样的诗人相提并论。有些人还会把他与哈代相比——哈代以小说见长，但后期转向诗歌创作后，成为伟大的诗人。布莱希特让我们看到一位伟大诗人的丰富度，就像一位内力深厚的武功高手，他信手拈来，什么都可以作为武器。他可以写日常，也可以写事件；他能写观念很清晰的政治诗，也能写非常个人化的诗，在形式的把控上非常自如。他的好朋友本雅明说得很准确，布莱希特可能是二十世纪最“自如”的诗人。这两个字的分量极重，因为我们知道，很多好的诗人会找到一种（适合自己的）方式，但要说能在各种方式里运用自如，像布莱希特这样的诗人是少有的。最近一年，我重新阅读了他的戏剧、小说以及一些文论，愈发感受到布莱希特是一个很当代的作家、诗人。他的很多观念放到今天仍富启发性和活力。他本就是一个穿越各个文学领域的人，而且穿越并非出于好奇或追求新形式的变化，而是源于他对世界的理解和认知。他理解世界的复杂性和变化中的细微性以及矛盾性，在面对巨变时，人可以被扭曲，被淹没，被改变……所有这些，成为他写作戏剧、小说诗歌时连绵不绝的能量源头。布莱希特在诗歌领域之所以能够留下这么丰富的遗产，很重要一点就是他对于生活，对于世界的认知过程是持续的，直到他生命终了才结束。写诗不过是他认知过程中的一个工具，甚至是他更方便使用的一个，以他的才华和能力，诗歌创作可以抬笔就写，所以他会留下那么多闪光的诗篇，让我们看到他在不同时间段上对世界的回应。所以，我更愿意把布莱希特当成一个当代诗人和作家，他的作品活在今天，而不是留在文学史里。同时，我认为20世纪在综合方面能跟他比肩的作家屈指可数。然而，他曲折的人生经历——从早年的发展，到中期的流亡，最后回到东德——使他陷入了一种尴尬的状态。这种选择导致他无法获得欧美主流文学界的认同，这是价值观和意识形态立场的问题。同时，他独特的个性、开放的文学观、敏锐的洞察力，以及对文学与人性关系的深刻理解，又使他在东德也无法获得真正的认同。他的晚年状态可以用鲁迅的诗来形容“两间余一卒，荷戟独彷徨”。他后期写的诗都很孤独，甚至隐含着对自我选择的怀疑。他最终选择的归宿，似乎跟自己开了一个玩笑。我在春节期间读了他的戏剧《伽利略传》，很有意思，更像是他在写自己在时代里的处境，跟伽利略非常相似。伽利略当年因为支持哥白尼的日心说，教会命令他闭嘴，迫使他宣布放弃这种科学理念，最后（伽利略）沉默了很多年。布莱希特到东德后，我相信他最后也是日趋于沉默的。黄雪媛：在东德时期，布莱希特的诗越写越短。当然一方面是“欲语还休”，另外一方面有些话不适合说。另外，后期他受道家思想的影响是蛮深的。赵松：他回去（东德）以后，一开始他挺有想法，想做很多事，他很快就发现，他这种人并不是人家需要的。说白了，他只是一个点缀。黄雪媛：所以他有一首（《恰如鱼咬钩时收线的灵巧》），把自己的身体当作一条船。他坐在自己身体的这条船上，倚在时间的船舷，好像是要慢慢飘远了，流露出难描述的孤独心境。当然，他也有一些平和的时刻，有日常小小的享受时刻。他在那种特殊的环境中，要寻找一种平衡。布莱希特情诗的演变程卫平：赵老师提到了《伽利略传》，这是布莱希特最主要的一个创作面向。稍后我们会讨论他的戏剧创作和诗歌创作之间的关系，尽管今天的主要议题是布莱希特作为诗人的一面。赵老师前面讲到布莱希特的很多特点，一个丰富，一个是自如。正如赵老师所言，一个伟大的诗人，不仅仅是对语言的一种扩展，他为我们提供了一种全新的思考、认知乃至感受世界的方式。接下来我想请教黄老师接着情诗的话题去聊。因为情诗对诗人来说确实是一个非常重要的写作领域。黄老师在这本书的前面写了12000字的长篇导读，读者的反馈非常好，它梳理了布莱希特从写作第一首诗《燃烧的树》到1956年他去世那一年之间的诗歌风格、题材变化以及他的人生经历。其中，关于情诗，黄老师提到布莱希特（往往）是情爱关系的主导者和操纵者，并且着重分析了两首最著名情诗：一首是《回忆玛丽·安》，另一首是黄老师开头朗读的《爱的三行诗》，也指出，布莱希特在这些诗里表达了对爱情本质的描述。黄老师您对布莱希特的情诗，尤其是他早期情诗的理解如何，他的爱情观又是如何在这些诗歌中体现出来的？黄雪媛：其实，（关于）布莱希特的情诗，我想说的不仅仅他的早期作品。布莱希特在每个阶段都写了不少情诗，虽说318首诗当中，重点可能是政治诗、现实题材诗或偶发诗，但仔细阅读会发现其中有几十首情诗，而且风格都非常不一样。这也呼应了赵松老师说的，布莱希特在形式上非常自如。他的情诗有十四行诗，也有像童谣、民歌一样简单明快的作品，也有一些采用了意大利诗歌的形式，比如每节三行的结构。再来，情诗的内容也非常不一样。有描绘小儿女之间恩恩爱爱，比如这首《当你使我快乐》。这里，布莱斯特肯定是模仿了一个恋爱中女孩的口吻。当你使我快乐有时我会想：我愿意此刻就死这样就能高高兴兴结束这一生。以后，当你老了回忆起我我还是今天的模样你的小恋人啊依然青春年少。（1950）热恋中的人恨不得此刻就是永恒，但又担心容颜衰老以后会不会也意味着爱的消失。这种心情我想很多人都能理解。还有一首是《朝夕阅读》：我爱的人对我说他需要我。于是我处处当心留神脚下的道路害怕一滴雨就能把我砸死。（1937）这首诗我也在课堂上给我的学生读过，有的同学解释得非常棒。他们说，当一个人被爱人需要时，就生出了很大的自我尊重的心，这样才不能够辜负爱人的托付。这种爱的郑重感，在这首小诗当中体现出来。有时候，布莱希特是写跟爱人长久分离之后的心情。当读到对方的来信，他们已经分开很久，彼此之间已经有一种陌生感。所以，他要在字里行间寻找曾经熟悉的“他”，但又非常害怕，怕一些陌生的字眼提示着爱的变质。读到这里，你会悬着一颗心，以为两个人之间出现了分歧，要分道扬镳了。但诗的结尾，来了一个峰回路转，他说“当我们相见，只需一眼 便立刻看清彼此巨大的困境。”我们知道，布莱斯特在流亡途中跟女友分开，音信常常渺茫，不知道对方生活的怎么样。所以，在信件中，有依恋与矛盾，怕失去同时又有一种信心——再见面时，彼此能够一刹那理解对方的处境，这是艰难时代的爱情。我认为，他早期的诗歌是荷尔蒙乱飞的，生机勃勃，野性勃发。他把大自然当作是爱欲与情欲的宣教场所，肆无忌惮地表达，有一种爱情的虚无主义，以及及时行乐的态度。早期（作品）多是令人血脉喷张的情诗，被汉娜·阿伦特认为是诗人天才的爆发期。我们知道，爱是一个人创造力的最原始的内驱力。到了晚期，他写的情诗就完全不一样了，非常平和，充满着信任感。每个学期我都会给学生提到这首诗，4句话：最亲爱的递给我一根树枝枝上留着黄叶这一年，就要结束了爱，才刚刚开始。这是50多岁成熟的爱，充满信任。哪怕冬天来临，自然变得枯寂，但是知道新的开始在等待着爱，也会迎来新的局面。还有他设想自己死亡以后，他的爱人来看他：将来，当我躺在墓园里最亲爱的人带给我一把泥土说：这里安息着一双脚，曾向我走来这里安息着一双手臂，常将我拥抱。（1944）这首诗让我们感道温暖和笃定，就算一个人去世，他仍然会被记得。这跟布莱希特早期的虚无主义态度，或者把爱情当做消费品的观念完全不同。这正是布莱希特（笔下）爱的魅力。在中期，他既要跟自己斗争，又要与纳粹斗争，还要跟颠沛流离的流亡和艰苦的生存环境斗争，他的爱同样也是挣扎的。我想读一首《我们之间从未停止谈话》，跟前面的情诗面貌完全不一样。我们之间从未停止谈话，就像两株白杨的絮语。多年的谈话如今已喑哑。我再也听不见你的言语，你也同样听不见我的话。我曾拥你入怀，为你梳理头发我曾教你战争的艺术教你如何与男人相处如何读书，如何阅人如何战斗，如何休息但现在我发现我还有许多话没有对你说夜里我常常起身，那些无用的建议卡住了我的喉咙。（1937）这是与爱人分隔两地，不知道对方的生活状态，自己也觉得帮不上忙，而感到的一种巨大隔阂。这一时期的爱情诗耐人寻味，（主要是）布莱希特在艰难处境对自己所爱之人的牵挂。他有一位朋友因为苏联的肃反运动入狱，布莱希特多次托人营救，但始终没有成功。有一首诗《问题》反映了他的心情——无助、无力、无奈。诗里有好多问题：你穿得暖和吗？床铺软吗？你还像以前那么勇敢吗？但是他又说“如果你累了，我不能为你扛起什么。如果你在挨饿，我没有食物给你充饥。”这样一首中期的情诗，我们可以看到生存的复杂性，爱变得艰难曲折。他也写过一首《坏时代的情歌》。一对情人同床共枕，彼此比月亮还陌生，但为了生存不得不在同一屋檐下相处，第二天可能为了几条鱼又扭打起来，就是坏时代的爱情。所以，梳理布莱希特的情诗，我们可以看到爱情的方方面面，有优雅明亮的，也有非常冷酷，相互利用的，也有挣扎的、内疚的、无助的。与普通人对话程卫平：这些评价正好对应了前面赵老师的评价——布莱希特诗歌的丰富性。T·S·艾略特在评论丁尼生时曾说一个伟大的诗人有一个很重要的标志，就是丰富性。黄老师的发言让我想起一个观点：布莱希特在情诗里不仅仅表达某种爱情观，更重要的是记录了那个年代特有的爱情——漂泊的，动态的。正如今天的主题“爱，是爱人之间的一个停留”。这个“停留”在德语中同时也有“短暂支撑”的含义。在动荡不安的年代，也就是布莱希特说的“昏暗的时代“”黑暗的时代”，爱情也确实充满了不安稳感。从这个意义上看，他的情诗与他的政治诗、社会诗一样，是对时代的一种记录。黄老师也提到他的早期诗歌。据我所知，汉娜·阿伦特、本雅明和奥登是对布莱希特评价较高的三个名人，尤其是汉娜·阿伦特。她最喜欢莱希布莱希特早期的诗集《家庭祈祷书》。我们这本《诗歌的坏时代》中的318首诗是按照时间的顺序编排，涵盖了布莱希特早期、中期和晚期几乎所有诗集中的部分作品，其中，《家庭祈祷书》收录有十几首，涵盖了不同的主题，包括爬树，在湖里游泳这些亲近自然、享受纯粹生活之乐的诗。也有《回忆玛丽·安》这样的情诗，因此在这里我也想请两位老师聊一聊，布莱希特早期诗歌（1933年之前）与他后期我们非常熟悉的政治诗，包含社会关怀和批判的诗歌之间的联系与区别。先请赵老师谈谈作为一个诗人，在成为我们熟悉的成熟创作者之前，布莱希特的这段早期经历为他后期的创作奠定了怎样的基石？赵松：也不能说是一个基石，因为布莱希特的创作是一个不断的变化和演变的过程。他是一位很明确要为普通人写作的作家和诗人，没有那种精英意识——试图制造一个无法企及的高度或难以探测的深度来完成创作。从很早开始，他就很明确要与普通人对话，他的所有写作，无论戏剧、诗歌还是小说，都是面向普通人的。当然，“普通人”其实是一个模糊的概念，但他不想制造一种阅读的障碍——过于追求复杂或形式的创新，而导致阅读的困难。你看他早期的诗歌，尤其与情感有关的诗，会发现他经常有很多疑问。他经常会在人们习以为常的场景中用疑问打开思考的门径。这一点很有意思，我们很多时候对情感世界和日常关系因为习惯而变得习以为常，变得不够敏感了，不能有所发现。但布莱希特就能在这些场景中发现生命的短暂和脆弱，以及情感关系的偶发性和易逝性。他总是在探究这些问题。他晚期的情诗中有更多的沉默，换句话说，随着阅历和人生的体验的积累，他更倾向于用更少的语言去呈现一种平静，而不是描述或表达。到了晚期，他的表达愿望被呈现某种情境的愿望所取代，因此他的诗越写越短，且越来越耐人寻味。但有一点他始终保持着，那就是语言的平实和朴素。无论是他早期还是晚期的诗，很少出现让你很费解的句子，都很易读、易懂。当然要真正理解可能要反复的想一想，但阅读起来几乎没有障碍，有时候读起来几乎感觉像在说话。在他的漫长的50多年里，他的诗歌、戏剧、小说，都像是在说话——不是表白，不是倾诉，他就是在用最平和的语气说话。即使涉及很深刻的情感体验，他也用很平实的话语说出来，后劲是慢慢出来的，而不是一下子就让人感动。他总是把自己对现象、关系和人类处境的深刻认知加入到创作中，他不是一个倾诉情绪倾诉情感的诗人，而是以一种理性的方式追溯体验的强度，同时产生了许多疑问。他有很多问号，这些问号可能没有答案，却能让我们意识到体验的独特性是情感关系中最重要的环节。我们必须承认，尽管作家或诗人的个人经历丰富度或坎坷程度并不一定会（直接）推动创作成果，但布莱希特所经历的时代（确实对他的创作产生了深远影响）。从1898年出生到1956年去世，他经历了20世纪前半段——人类历史上最血腥，最黑暗，最混乱的时期之一。程卫平：经历了五种不同的社会体制，这个也是一个纪录。赵松：是的，包括两次世界大战、纳粹上台、大萧条，还有1953年被苏军镇压的柏林起义。布莱希特所经历这些大事件，还有他长达十几年的流亡生涯——从北欧到美国。我们可以想象，一个人在这样的过程中，看到了很多他在意的人的殒落，像本雅明在西班牙边境自杀，他爱过的人死在苏联，还有许多人失联或消失了。我们今天去谈论那个时代，其实很难有身临其境的感觉，但那就是一个剧烈裂变的时代，很多东西在消失、在瓦解。所以，当布莱希特谈论情感时，他更关注的是情感本身的强度和独特性，以及体验的独特性，而不是在强调一种习以为常的情感关系。这跟他在流变的生活体验中形成的认知有很大关系。在社会稳定的时候，爱情很容易转化为一种体制化的关系，比如家庭，会变成一种习惯。但在布莱希特所经历的剧动时代，人们对情感关系的认知会发生很大变化。我们如何把一个人、一段情感留在记忆中，只有在这样的一个大背景下才更容易被发现和察觉。无论是他早期的抒情诗，还是后期与情感、爱情相关的诗篇，尽管布莱希特在变——他的认知方式、写作方式都在变化——但有一个核心始终未变：他对于人与世界关系中的不确定性、偶发性始终保持敏锐。这是最难的。事实上，我们回顾20世纪的文学，尤其是诗歌，会发现很多曾经风行或被重视的作品慢慢被遗忘，而像布莱希特这样，能够通过动荡时代抵达不同时代读者内心深处的诗人，其实是少数。如果我们抛开后来的学术性的研究和评论，一个好的诗人何以流传到今天？他一定拥有理论所无法解析的东西——就是与他自身的生命力密切相关的东西。在我们短暂的人生中，最可贵的是谁有更独特的视角，更独特的体验方式和对世界的回应方式。因为很多时候，我们期待文学能够打破日常的惯性思维和感受，让我们重新回到感知与领悟的原点，去感知和认识人的情感关系。作为有情感的动物，在这个世界上有限的生存中，什么才是最重要的？既然一切都会消失，情感的经历为什么会变得如此的无可替代？这些东西在我们阅读布莱希特早期和后期情诗的过程中，总会有一些特殊的启发和感受。这非常值得重视。布莱希特在他一生的写作中，不管用什么样的方式表达，总是耐人寻味。他的话语看似简单，但需要琢磨，过一段时间才能更明白，而不是马上就能（完全）理解。程卫平：赵老师用了一个很有意思的词——“后劲”。布莱希特的诗确实像在与普通人对话。他的早期作品，包括在《家庭祈祷书》以及诗集里最早收录的1913年至1924年的创作，已经体现出赵老师讲的特点：用平和的语气与普通人对话。比如说他写得那些关于普通人的诗，像《妓女伊芙琳·罗的传说》《关于杀婴犯玛丽·法拉尔》《汉娜·卡什之歌》以及后来的《大胆妈妈之歌》等。这几首都是他在早期创作的，甚至在他明确成为一个马克思主义者之前，就已经展现出非常明确的社会关切意识。除了我们前面提到的那些青春荷尔蒙飙飞、亲近自然的情诗之外，他早期就已经开始转向——或者说同时进行——对社会问题的关切。黄老师，您怎么看他早期到后期整个诗歌的变化？或者说，他的主题和它的风格的脉络是怎么样的？黄雪媛：赵老师已经讲得非常多，也非常好。他首先讲到了“跟普通人说话”，或者说让底层人被听见，被看见。布莱希特出生在一个物质优裕的家庭，他自己也在一首诗里写：我是一个有钱人家的儿子。他爸爸是一家造纸厂的总经理，住在厂区里，负责监管整个工厂。因此，布莱斯特从小就能接触到工人阶级。他在物质丰富的环境中成长，又跟工人们打成一片。他非常愿意跟小伙伴们走街串巷，弹着吉他唱歌，也喜欢去市集观察工人、农民、手工业者的生活状态，耳濡目染他们的语言和姿态。布莱希特其实很讨厌自己的阶层。早在我刚才说的那首诗里，他还说：父母从小给我戴上装饰衣领，教我怎么样发号施令，让我习惯被人伺候的生活。但他说，他既不喜欢命令人，也不喜欢被人伺候。因此，成年后他说他做了父母的叛徒，叛变家庭，加入到了卑微者的队伍。年轻时，他充满了的虚无主义，这是时代赋予他们这一代年轻人（的特征）。经历一战后，很多年轻人的信仰都幻灭了。他们看到同伴的肉体消灭，曾经的好友、同学突然战死在战壕里。肉体在幻灭，精神在幻灭，价值观在崩塌，你怎么能让18岁的布莱希特仍然去秉持着资产阶级的道德秩序？他完全抛弃了这些，甚至跟宗教作对。语言上也在背叛，他早期的诗歌中有一些很粗野的用语，故意使用糟糕、粗俗的词。这是青年时期的一种反叛姿态，有时甚至是为了反叛而反叛。然而，当他后来跟工人阶级打成一片，尤其是在柏林和慕尼黑，看到了形形色色底层人民挣扎的生活后，我觉得他醒悟了，抛弃了早期的纵欲和虚无，成为一个真正的马克思主义者。大约在25、26岁时，他开始接触马克思主义著作，并疯狂地爱上了它。他曾形容自己“八只脚都陷在马克思主义的著作里”，甚至去看《资本论》，而不仅仅是依赖二手资料。这成为他个人精神状态的一个分水岭。从此之后，他致力于为普通人发声。赵松老师提到布莱希特的诗像说话一样很好懂。相比之下，策兰的诗很多人反映看不懂，尽管它很美、很神秘。策兰也跟自己的读者说：没有办法，你就去一遍一遍的读，意义自然会呈现。但是布莱希特的诗不需要反复的读，一下就清楚了。正如赵老师说的，后劲足，能够让人回味，一种辣的、甘的、苦的……很多种味道奇妙地融合在一起。这体现了一个伟大诗人的生命力、体验力和认知力。他在一首诗他写道：感觉是最后一口气了，但你还可以用最后一口呼吸，重新开始。他的诗歌常常有一个转变，在你绝望中给予希望，在梦境中突然把你敲醒。辩证法的智慧一直闪现在布莱希特中期和后期的诗歌中，这也因为他受老子、马克思主义甚至是毛泽东的《矛盾论》的影响。他认为毛泽东和老子是中国最伟大的哲学家和思想家。到了后期，布莱希特越说越少。他不再像早期那样写很长的诗。但我们去看后期的《布科哀歌》和一些零散的诗，字短情长，而这个情又不是一般意义上的情，在沉默中有诗意在诞生，在空白处有很多耐人寻味的东西。《布科哀歌》里头有一首诗《换轮胎》，很好地体现了他在东德时期的心态。他看着司机换轮胎，自己坐在山坡上等待，尽管是个短暂的过程，他却很不耐烦。他问自己：为什么不耐烦呢？这么短的时间，你完全可以耐心等待。但也是说：我不知道我要去哪里。在这种迷茫的情况下，他整个人烦躁不安。他谈到了一种不安和烦躁的情绪，一种既不知道来路也不知道去向的迷茫状态。这种状态可以称之为一种“悬停期”，但我不认为他在东德的最后几年一直处于不开心的状态。相反，我觉得他的接纳性非常好，能够自洽并接纳现实，同时始终不忘记质疑。在他的诗歌里，赵老师也谈到他不停提问。例如，在《一个工人在阅读时的疑问》里，他写道：一个普通工人要学习、要上进、要自我发展，他去读了很多的史书，却发现史书里只记载大人物。巴比伦好几次被毁又重建，到底是谁建的？只提到了国王、凯撒、秦始皇，长城建造完那些泥瓦工去了哪里？这位普通工人的疑问代表着布莱希特的困惑。他后期有一首诗叫《怀疑者》，还有一首《赞美怀疑》。他说：赞美怀疑，但不要赞美绝望。他批评了两类人，一类是从不怀疑、不爱思考、不爱质疑的人；第二种批评的是那些永远在怀疑，左右摇摆，但从不行动的人。读到这里让我想起卡夫卡，卡夫卡就是左右摇摆、害怕做决定的人。如果把布莱希特跟卡夫卡比较，我肯定毫不犹豫地说布莱希特的生命力更旺盛。这不仅体现在他巨量的作品上——他的诗歌超过2000首，戏剧作品更是浩瀚——还体现在他的决断力、质疑能力以及在艰难时期存活的能力上。在这方面，他比本雅明强得多。本雅明性格中充满了犹豫，他总觉得自己被倒霉鬼缠上，是逃不脱的。而莱希特就坚信不能够绝望，在动荡的艰难时代，他始终务实、灵活，不会带着很多行李。他甚至可以把书都丢掉。布莱希特超级爱读书，从古罗马、古希腊到中国典籍，再到马克思、卢克莱修，但在艰难时期，他可以把这些书全扔掉，就带一个小烟斗、一条皮带和一本墨子的译本。他保留最少的东西存活下来，这是一个人的生命力的体现，适应能力非常强。我觉得布莱希特是我生活的导师，给了我非常大的力量，在各种境遇下，我随便打开某一页都能够得到启示。比如“配得感”，他写过《关于金钱鼓舞人心的作用之歌》，肯定了金钱的振奋力量；他也写过《我的富裕时光》，他靠一部戏挣的钱买下了一座大洋房，他觉得自己配得上这些。七周以后他被驱逐出境，离开时并没有恋恋不舍。他说：我已经享受过深深占有的快乐，他不想通过撒谎去维持这座房产。他有很深的配得感，同时能够割舍，这是一种富足的心态。从创造力到运气，布莱希特都是上帝的宠儿。尽管他生命不长，但生命的密度很高。程卫平：相比卡夫卡或是雪莱、拜伦，布莱希特的寿命已经算长了很多。黄老师把我们从布莱希特的诗歌创作和风格特点，转向了他为人的这一面。在今天这样一个充满焦虑的消费时代，我们能在诗里面汲取怎样的能量，黄老师很好地说明了这一点。我觉得还有一点，诗歌的创作不是他的一个主业。黄雪媛：戏剧创作才是布莱希特真正的主业，但布莱希特最该流芳百世的恰恰是他的诗歌。他经常是拿个小纸片就开始写，万物都可成诗。诗歌的成就非常的杰出，一点都不亚于他的戏剧的成就。当然中国的读者可能对他作为戏剧家的一面更为了解，但经过黄灿然先生的《致后代》的英译本，再加上我这本德语直译本，布莱希特作为伟大诗人的一面已经在中文世界里确立起来。程卫平：布莱希特从没有放弃希望，也从未停止质疑。他在诗里多次提到怀疑，质疑的对象往往是那些装睡的人，那些明明刀已经架在脖子上还在笑的人。在《芬兰的风景》里，他说：“逃亡者坐在赤杨树下，重拾一门困难手艺，希望术”，还有一首诗里那句：“反抗，也不放弃任何微小的快乐”。我们能够感受得到布莱希特在黑暗时代里，依然能够自得其乐的生活态度。正是赵松老师所说，这种自如可能不仅仅是在诗歌创作中，也是他的人生心态。黄雪媛：在艰难时期，尤其需要这样的生存策略。赵松：或者说是一种生存的智慧。我们知道，当外部环境变得很糟糕时，是我们个人无法掌控的。我们能改变的就是自己的认知方式。当痛苦，死亡，困境不断向我们覆盖过来时，我们能做的是改变认知方式以及换个角度去思考问题，去理解事物的存在，而不是陷入一种应激反应。对布莱希特来讲，无论写诗还是会创作戏剧，他始终强调去面对现实的所有问题和变化，并保持内心的平衡。他也知道，在一个巨变的时代里，能够成为幸存者，需要有一点运气和智慧。他很幸运地活在东德，它不会去枪毙任何一个作家或者艺术家，顶多就是不给他们工作。视觉化的诗意：布莱希特的诗歌与戏剧程卫平：赵老师前面提到了《伽利略传》，也反复提及布莱希特的戏剧，因为戏剧是他的主业，是他的谋生之道。布莱希特创立的叙事剧很有名，而他的诗歌与戏剧之间存在着交叉影响。他的叙事剧（或称“史诗剧”）有一个鲜明的特点，就是“间离效果”或“陌生化效果”。他很多诗歌其实来自他的戏剧的，比如《大胆妈妈之歌》；《三毛钱歌剧》里面有很多角色诗。接下来，我们探讨一下布莱希特的诗歌里有没有“间离效果”，或者说他的诗歌有没有受到他戏剧的影响？赵松：布莱希特之所以涉猎小说、戏剧、诗歌等多种文学形式进行创作，显然意味着这些不同的题材各有特点，且彼此之间无法完全替代。比如，诗歌和小说都是纯文字的表达，即使通过朗诵呈现，它们依然是建立在文本的范畴里。文字是一个间接的工具，无法像电影、戏剧、绘画那样直观地呈现视觉内容，文字需要读者去想象和感知一些东西。布莱希特的戏剧之所以影响这么大，是因为他对舞台空间的理解，对影像视觉在舞台里呈现和介入，以及演员、观众与空间的关系的全新思考。他不是一个单纯在传统戏剧范畴里思考的戏剧人，也做过一些电影方面的实验和尝试，并很早就把这些电影手段使用到戏剧中去。从诗歌的角度来讲，他后期会喜欢借用类视觉手法去呈现诗歌的意境，没有任何表达，就只是用简练、明白的文字去呈现一个场景，通过一种很微妙的节奏变化，这些场景在读者的脑海里迅速生成，形成一种类似长镜头的画面，甚至是寂静的，但这里面有非常微妙的诗意，慢慢的涌现。戏剧是有视听的艺术，而“看”是第一'
