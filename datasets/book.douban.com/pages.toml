full_description = '''序 安提戈涅 评论 黄色墙纸 5 2025-02-20 13:17:16 已编辑 云南 { "@context": "http://schema.org/", "@type": "Review", "datePublished": "2025-02-20T13:17:16", "reviewBody": "夏洛特·珀金斯·吉尔曼让人想到一个容器，里面的水受到激情的高温的熬煮，源源不断地涌出来，小小的瓶身根本盛不下，于是，水满溢而出，汩汩地奔流，淌满了大地的表面，浸透了深层的土壤。水，就是她那具有辐射...", "description": "{ review.abstract(200) }", "itemReviewed": { "@type": "Book", "name": "黄色墙纸", "url": "/subject/37138375/", "sameAs": "https://book.douban.com/subject/37138375/", "image": "https://img9.doubanio.com/view/subject/l/public/s35049514.jpg" }, "publisher": { "@type": "Organization", "name": "豆瓣(Douban)" }, "author": { "@type": "Person", "url": "https://www.douban.com/people/47929578/", "name": "安提戈涅", "sameAs": "https://www.douban.com/people/47929578/" }, "reviewRating": { "@type": "Rating", "ratingValue": "5" } } 夏洛特·珀金斯·吉尔曼让人想到一个容器，里面的水受到激情的高温的熬煮，源源不断地涌出来，小小的瓶身根本盛不下，于是，水满溢而出，汩汩地奔流，淌满了大地的表面，浸透了深层的土壤。水，就是她那具有辐射力量般的自我。在夏洛特的小说、日记、诗歌以及政论文章中，激情的自我都留下了深深的痕迹。她手稿中那些纤细平静的字体常常像突然充血的动脉血管，在自我创造的渴望中彼此加速、追逐乃至膨胀。我们会看到，在一首诗中，她直言不讳地把这种情感称之为“狂野的骚动”。当然，文字中混沌勃发的力量，还是来自于日常生活的投射，她的激情使她不能过一种按部就班、井井有条的平静日子，只能大胆地用炸药炸开生活的金矿，而她的天赋又足以使她捕捉到以气态形式飘荡在金矿上空那些关于痛苦与幸福的奥秘。所以，让我们先从她的生平讲起，看看生活的强度是如何渗入了她的书写力度之中。夏洛特曾经为自己写过一副“自画像”：“亲爱的读者，你认识我吗？货真价实，我就在这里。18岁。身高 5 英尺 6 英寸半，体重 120 磅。”这段自画像来自于夏洛特1879 年 1 月的日记，这是她的第一本日记。和很多人一样，她在写日记时愿意想象一个读者或者对话者：她渴望读者，渴望被听到，也许还自命自己是一位向大众言说的作家，她描述自己长得“还不错”，甚至可以说“挺健美的”，她谈到自己的健康非常好，正在培养自我控制能力，此外，“并不多愁善感，更多的是冷峻和抑郁”。在这段18岁的自我审视中，夏洛特日后的诸多特质已经固定了下来，比如对服饰与健身的热衷，对进入公共领域的渴望，对成为作家的期待、以及伴随终身的忧郁气质。人之为人的神秘正在这里，一个人二十多岁时精神状态基本规定了他中年以后的精神状态。这位少女成长于一个并不幸福的家庭，经济困难，父亲很早就抛弃了她和母亲。为钱发愁、靠人接济的生活几乎是她前半生的主调。阅读与幻想帮助了她。阅读并非来自于正规教育，实际上，在童年多次更换住址的过程中，她上过七所学校，断断续续总共只上了四年。14 岁时，她得以进入一所不错的私立学校学习了大约一年，但中学教育在她 15 岁时就结束了。所以，她的阅读更像是一种在天命与兴趣引领下的探索，从狄更斯到司各特，从叙事诗到小说再到杂志，她像杂食性动物一样贪婪地阅读。幻想，则在阅读的基础上进一步地带领她超越了贫瘠乏味的现实生活，她每每喜欢在入睡前幻想。也许，正是因为这些来自童年的滋养，我们才得以在夏洛特的《黄色墙纸》中看到如此之多的丰富元素：既有幽怨徘徊的鬼影、又有男女性别颠倒的滑稽戏，既有被囚禁的疯女人的悲鸣、又有讽刺效果拉满的家庭剧。她像她阅读并且热爱的那些伟大作家一样，从普通女性的胸膛中取出被蔑视的情感的齿轮，将它们上油、调适、重新以文字的形式组装，最后奏出一首首或凄怨、或哀婉或骄傲的曲调。与上一代女性最大的不同在于，夏洛特是一个对于“健身”有着执念的女性。也许是因为她厌透了同时代男性作家在小说中刻画的孱弱女性形象——动不动就脸色苍白、绞着手指、动不动就晕厥或者歇斯底里——所以，她把划船、散步与长跑列为了自己的健身首选。当然，更主要的原因是她从少女时代起就热衷于研究身体机能的新科学，也就是当时所谓的“改革生理学”（reform physiology），她听从当时流行的建议：多呼吸新鲜空气、多做运动、多吃有益的食物。我们会看到，对健身的关注贯穿了夏洛特的前半生，她习惯性地去体育馆里做运动，也异常关注自己的身体（尤其是脑部）健康。有一次，在某个女子健身馆开业的时候，夏洛特自告奋勇地前去健身与当众展示，她自豪地在日记里写道：“我掌握了主动权。”对身体的自主掌控，是自我意识建构的第一步。自然，强健的体魄最终要服务于坚强的意志与精神。与夏洛特的体魄同时增长的，是她那罕见的强大的意志。她很早的时候就已经意识到，保持单身、保持非婚姻状态，可以“扩大一个人的个人力量，发展个人的人格力量，把自己当作一个自我。”在这位年轻女性看来，意志坚强的女性在生活中不能有求爱的男人，因为他们会把她变成自己的附属品，并且要求她充满母性，承担母职，这些东西在夏洛特看来都是可怕的。这是否能够解释，在本书《摇椅上的女孩》这篇小说中，一个神秘如幽灵般的女孩在两位绅士之间躲闪游移，弄得他们神魂颠倒自己却拂袖而去？这篇小说也许在本质上展现出夏洛特对于男性追求的恐惧与回避。这篇小说也展现出夏洛特很多其他作品相似的气质：神秘、幽微甚至古怪，奇怪的是，灵魂最柔弱古怪的振动却往往能辐射出最持久的波长。对自我的强调与对男性及婚姻生活的回避，把她引向了世俗与写作的两个互相呼应的层面：她爱上了一个叫做玛莎·路德的女性，虽然她似乎一直在自我说服：这不是男女之间的那种爱欲，可是，我们还是看到了她如热恋中的人那样不断与玛莎写信倾诉衷肠、表白内心，哪怕在玛莎委婉地拒绝乃至要与别人结婚时，夏洛特仍然一方面掩饰着心碎，一方面说出了这样的话：“但无论你的家多么迷人，我都会有一把夜用钥匙，我将在你和你的家中享受我自己所没有的一切。”在十九世纪，女性之间的爱欲关系并不罕见，很多父母甚至会默许女儿与其他女孩之间的浪漫关系，因为相比与男孩发展一段关系，女性之间的爱欲更“安全”，至少不会闹出婚前怀孕之类的丑闻。伍尔夫在《达洛维夫人》中也曾写过类似的情节，达洛维夫人与少女时期的同性好友萨利形同恋人，出双入对。但是，夏洛特显然要得更多，也失望得更厉害。无论如何，她把少女时期这段感情珍藏心底，转向了更为贪婪的阅读，锻炼自己的精神意志。1881年之后，她大量阅读了《大众科学月刊》（Popular Science Monthly）。当另一位美国作家麦尔维尔在《白鲸》里宣称“捕鲸船就是我的哈佛大学！捕鲸船就是我的耶鲁大学！”时，或许可以说《大众科学月刊》之类的杂志成为了夏洛特的大学。没有受过正规教育的她正是从这个杂志上第一次接触到了科学进步和新发明、新社会科学产品、哲学问题——当然，还有女性问题。然而，她对那些男性学者描述的女性处境与历史并不满意，她意识到他们的描述与她的经验是相冲突的，随着她对身体与精神的双重磨炼越加成熟，她就越发感到成为一个独立的女性所遭遇的社会压力之大。也是在1881年，也就是20岁时，她写下了诗歌处女作《职责所系》（In Duty Bound），其中有这么几句：预先强加的义务，不求回报；然而，它却具有自然法则的约束力。对立思想的压力内心痛苦，每小时都有一种力量消逝之感。20岁时留下的这首诗作，几乎概括了夏洛特后期创作中的所有主题：一个女人成为自己与成为他人妻子或者母亲之间的矛盾。而矛盾，正是一个作家得以沉思与创作的核心灵感。巴尔扎克的矛盾，是纷繁复杂的金钱世界与野心家的欲望之间的矛盾，福楼拜的矛盾，是资产阶级寒伧的生活方式与更高级的生活奢望之间的矛盾，托尔斯泰的矛盾，是一个人肉身之欲与灵魂超越之间的矛盾……没有矛盾，作家便不存在，写作也是乏味的。与这些作家相比，夏洛特一以贯之的矛盾看起来没那么宏大，它藏在一个女性小小的身躯里，但也许更为有韧性和决绝。在《黄色墙纸》中，我们看不到剧院、教堂、交易所、酒馆等繁华空间，也没有艺术家、诗人、交际花与银行家出没。夏洛特几乎只写“家”，或者“家”的延伸——荒僻的老宅、古老的租宅、幽静的画室、狭小的闺房……可是，在“家”的小小巢穴里，却在上演着一出出由核心矛盾推动的巨大革命，可以说，这些夏洛特创作于30岁时的小说，反复追问的仍然是她在20岁时提出的问题：如何对抗那些对于女性“预先强加的义务”？如何解除其“自然法则的约束力”？托尔斯泰曾经说过一句意味深长的话：“只有在我周围的一切人和一切事物跟我一致的时候，我才是自由的，然而到了那个时候，我已经不存在了，因为我们只有在冲突与矛盾中才能感觉到我们自己”。在托翁笔下，自由更像是一种在众人淹没自我、丧失自我的消极状态，所以，只能用充满痛苦的矛盾来取代无忧无虑的自由，这甚至不是一种文学选择，而是一种生活宿命：这样的作家只能过一种充满矛盾的生活。可以想见，背负着如此沉重的矛盾的夏洛特的婚姻生活必然是痛苦的，人们甚至会奇怪她为什么会选择婚姻。她就像水银一般，把全部的意志力用于自我捍卫与保全，人们永远无法把水银和水混为一潭，而她似乎也拒绝和任何与自己不同的元素的结合。她的第一场婚姻有一个令人愉快的开始。1882 年 1 月 12 日，夏洛特遇到了查尔斯·沃尔特·斯泰森（Charles Walter Stetson），一位 23 岁的资深艺术家。然而，愉快的开端并不能保障结局的美妙，直到此时，夏洛特依然坚定地认为“我的生活是私人愿望和发展的生活，是公共服务的生活，而公共服务只等着被要求”，但她发现了自己身体里的另一种东西：性欲。在十九世纪，这个词不会说得这么直接，夏洛特把它描述成是一种让自己“屈服”的力量。为了解决这个问题又不违背自己的本心，她提出了一个在当时颇为骇人听闻的解决办法：不结婚，但是可以在有生理需求时找到对方。沃尔特是一个纯正的十九世纪的人，他遵守着一切那个时代关于男人应该如何、女人应该如何、婚姻又应该如何的法则。所以，他当然不会接受这个“荒谬”的提法。经历了磕磕绊绊、若即若离的几年磨合，两个人终于成婚了。婚姻给沃尔特带来了什么呢？起码最开始是幸福，他觉得，夏洛特像一个女人应该做的那样，“她对我的依赖就像孩子对父亲的依赖一样”。反过来问，婚姻给夏洛特带来了什么呢？痛苦、抑郁、生育孩子的辛劳。他看不到她，看不到她的挣扎与焦虑。有一件事值得一提，在婚后数不清的争吵中，夏洛特表达了对家务尤其是洗碗的厌烦（这一点非常像小说《老有所思》中的埃尔德太太），她对沃尔特提出，洗碗可以，但是要支付她报酬，自然被沃尔特拒绝了。这件事之所以重要，是因为一个女性在当时罕见地主动赋予自己的劳作以价值，换句话说，她并不认为家务是女性天经地义的“分内事”，它与一个男人在外打拼时付出的劳动应该有类似的价值回报。这场不合适的婚姻让一个人学会了勉强，另一个人学会了强求。如果说痛苦、抑郁、辛劳是创作灵感的代价，那么，夏洛特也确实从这段痛苦关系中收获颇丰：从两人谈恋爱的时候开始，沃尔特就喜欢时不时地引用《圣经》中的段落，充满了教导的口吻，这个习惯是否成为小说《所罗门如是说》的灵感？小说中的丈夫动不动就用《圣经》中的话教导妻子，要守规矩、要做一个贤内助，最后却被妻子狠狠地戏弄了；沃尔特是一位郁郁不得志的画家，他到处找买主和赞助人，却每每落空，他甚至期待把夏洛特当成他的缪斯，占有她，塑造她，这种动机是否又成为《世事无常》中的灵感来源，小说中的主角同样是一位画家，他狂热地爱上了一个女人并娶之为妻，却发现妻子似乎另有所爱；通过沃尔特的日记，我们发现他是一位极为保守的男性，他经常对夏洛特说的那些言论——“你脑子里一定有什么病态的东西”、“我相信妇女有最大的自由，但这种自由是虚假的，它会使她们反抗爱情和家庭的纽带”、“希望你能感觉到自己的渺小”——都全被夏洛特毫不留情地投射到了《黄色墙纸》中，那些感叹世风日下、姑娘变坏了的绅士们身上了。当然，还有同名小说《黄色墙纸》。这也许是这场婚姻最痛苦的一个孩子。生下了女儿凯瑟琳之后，夏洛特患上了产后抑郁症，一向重视健康的她甚至觉得自己脑部出了问题，而沃尔特则坚信“我毫不怀疑，整个问题都是子宫受刺激引起的”。值得注意的是，当时并没有“产后抑郁”这个名词，医生只是诊断她患有“剧烈的歇斯底里症状”。歇斯底里（Hysteria）一词源正是于希腊语中的子宫一词hystera，被认为是一种好发于女性的精神疾病，多少带一些歧视色彩，如今已经被焦虑、抑郁等详细的诊断所取代。19世纪治疗歇斯底里的方法是当时一位叫做米切尔的医生提出的“静息疗法”，为了让女人们远离疯狂、“履行她们的职责”，米切尔认为病人应该“回到婴儿时期”，包括极度休息、完全的隔离、两小时进餐一次，还有将鱼肝油灌入直肠、完全禁止写作动笔、尽量与孩子待在一起……显然，这套疗法借鉴了一些欧洲早期对待精神病的做法，它让人想到如果《简爱》中那个阁楼上的疯女人伯莎跑出来，也会遭遇同样的对待，也会让人想到伍尔夫收到的医嘱：同样的休息与禁止动笔。很难说夏洛特通过这段治疗有没有获得真正的康复，因为她从米切尔的疗养院回家与沃尔特生活在一起后，感到沃尔特彻底变成了一个“噩梦般的丈夫”，而她再度崩溃了。所以，在《黄色墙纸》中，那个叫做约翰的丈夫可能是沃尔特和米切尔医生的混合体。他们打着“为她好”的名义，最终却只是为了把她变成一个他们认为符合社会要求、女性职责的“正常人”。 悖谬的是，“正常”往往是一种最为隐秘和暴虐的手段，它总是悄无声息地绞杀和封禁了一切与主流、大众、公意不相符的边缘存在。在《黄色墙纸》中，叙事者敏感又绝望地发现了这种暴力，它被隐喻为墙纸上那些古怪、邪恶又令人恶心的花纹：上面的图案又乱又夸张，简直是在强奸艺术！我沿着图案衍生的脉络移动我的目光，却看得眼花缭乱。真够傻的！如果说墙意味着这个时代无法推到、颠扑不破的男权主流法则，那么，上面那些花纹则以为围绕这些法则所衍生而出的种种规训与束缚的手段。对于小说中的叙事者来说，对于作者夏洛特来说，唯一的选择都是“冲决”，一百多年后，加拿大的女作家爱丽·丝门罗通过频繁地书写“逃离”，与夏洛特隔着时光的甬道，投去了彼此信任与鼓励的一瞥。此外，这个故事的新颖之处还在于叙述者的声音一开始就带有明显的无能为力的疑虑和不确定性。这是极为纯正的文学法，它让女性“冲决”的动作不至于变成确定的革命口号，而是始终徘徊于犹豫与可疑的精神危机之中，也为叙事者的情感涂抹上了神秘的气息，就此而言，夏洛特非常接近于亨利·詹姆斯或者爱伦·坡，他们都以“不可靠的叙事”而闻名。《黄色墙纸》的引起了出版界的重视，虽然在此之前，夏洛特已经写了一些小说与戏剧作品，本书收录的《巨藤屋》是她的处女作，甚至成为了一些杂志的定期撰稿人，但她长期以来还是处于经济窘迫的境地，更多的收入来自于她开设的私人艺术教学班以及卡片装饰画。私人生活的痛苦促使她写出了《黄色墙纸》，她也越来越受到公众的关注，这正是她18岁那年自画像里的愿望，她找到了的真正的“亲爱的读者”。从这时起，夏洛特的创作更加多元，她不仅写小说，还写下了长篇的论著《妇女与经济学》，在这部书中，她认为以食换性是婚姻的核心，也是女性从属于男性以的原因，这个论断很难不让人联想到几十年后的女性主义领袖波伏娃在《第二性》中的观念。除了书斋里的著书立说，夏洛特还积极地走上街头、为妇女的权益、性知识的教育等问题奔走呼号。一个名副其实的公共知识分子诞生了。1892年，顶着为人嘲笑的风险，她终于与沃尔特离婚了，此时，她的收入与名气、抱负的实现都构成了她的底气，就像小说《遗孀的面纱》中，那个在丈夫死后决绝地摆脱子女、为自己而活的母亲一样，我们几乎能想象离开沃尔特的夏洛蒂是同样“强健有力”、“祥和坚定”的。也许，人们会为她第二段婚姻关系的缔结感到奇怪，因为她曾在第一段婚姻中如此痛苦、摆脱得又如此艰难，但是，通过创作走入公共领域的夏洛特，已经不再是那个困在黄色墙纸后面痛苦压抑的女性了，1897年时的她已经可以独当一面：她会到西部和南部演讲与出席活动、以作家身份旅居于不同的团体之中，虽然少年时就发作至今的抑郁症还是会不时袭来，但把目光投向远处、投向高出、投向公共领域拯救了她，也让她以足够完整、自洽的灵魂悦纳了第二段与表弟的婚姻。想来，幸福的婚姻从来不是两个人是否彼此“合适”，而是两个人是否足够“自足与完整”——哪怕在单身状态下，个体的自足与完整都能引人走向幸福。用了整整一生的时间，夏洛特完成了一件小小壮举：创造自己、发展自己、捍卫自己，这不是独属于女人的志业，也不单单属于男人，它是人类的本职，《黄色壁纸》则以异常动人的笔触，记录这场壮举中那些幽微的瞬间与动人的细节。 © 本文版权归作者 安提戈涅 所有，任何形式转载请联系作者。 有用 60 没用 0 有关键情节透露 .footer-sharing { text-align: right; } Do(function() { loader.batch([ 'https://img1.doubanio.com/f/sns/78cb123c9c3ae64290d14653f37f1e63968e1f2b/js/sns/doulist/doulist_dialog.js' ]).done(function() { $(document).delegate('.lnk-doulist-add', 'click', function(e) { e.preventDefault(); if(window._USER_ABNORMAL) { show_abnormal && show_abnormal() return } var self = $(this); var param = $.extend({'url':''}, $(this).data(), {link: this.href}); // 兼容jquery 1.8.x var newParam = {}; for (var key in param) { if (typeof param[key] === 'number') { param[key] = self.attr('data-'+key); } if (param.hasOwnProperty(key)) { newParam[$.camelCase(key)] = param[key]; } } sel