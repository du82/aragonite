ompem https://github.com/rfunix/Pompem is another tool to search for exploits MSF-Search bash msf> search platform:windows port:135 target:XP type:exploit PacketStorm If nothing is found, try to search the used technology inside https://packetstormsecurity.com/ Vulners You can also search in vulners database: https://vulners.com/ Sploitus This searches for exploits in other databases: https://sploitus.com/ Sploitify GTFOBins-like curated list of exploits with filters by vulnerability type (Local Privilege Escalation, Remote Code execution, etc), service type (Web, SMB, SSH, RDP, etc), OS and practice labs (links to machines where you can play with sploits): https://sploitify.haxx.it search_vulns search_vulns enables you to search for known vulnerabilities and exploits as well: https://search-vulns.com/. It utilizes various data sources like the NVD, the Exploit-DB, PoC-in-GitHub, the GitHub Security Advisory database and endoflife.date. tip Learn & practice AWS Hacking:HackTricks Training AWS Red Team Expert (ARTE) Learn & practice GCP Hacking: HackTricks Training GCP Red Team Expert (GRTE) Support HackTricks Check the subscription plans! Join the 💬 Discord group or the telegram group or follow us on Twitter 🐦 @hacktricks_live. Share hacking tricks by submitting PRs to the HackTricks and HackTricks Cloud github repos.'''
