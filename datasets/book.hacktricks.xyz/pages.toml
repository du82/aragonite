nd data and generate a valid signature for the previous data + appended data. How? Basically the vulnerable algorithms generate the hashes by firstly hashing a block of data, and then, from the previously created hash (state), they add the next block of data and hash it. Then, imagine that the secret is "secret" and the data is "data", the MD5 of "secretdata" is 6036708eba0d11f6ef52ad44e8b74d5b. If an attacker wants to append the string "append" he can: Generate a MD5 of 64 "A"s Change the state of the previously initialized hash to 6036708eba0d11f6ef52ad44e8b74d5b Append the string "append" Finish the hash and the resulting hash will be a valid one for "secret" + "data" + "padding" + "append" Tool GitHub - iagox86/hash_extender References You can find this attack good explained in https://blog.skullsecurity.org/2012/everything-you-need-to-know-about-hash-length-extension-attacks tip Learn & practice AWS Hacking:HackTricks Training AWS Red Team Expert (ARTE) Learn & practice GCP Hacking: HackTricks Training GCP Red Team Expert (GRTE) Support HackTricks Check the subscription plans! Join the 💬 Discord group or the telegram group or follow us on Twitter 🐦 @hacktricks_live. Share hacking tricks by submitting PRs to the HackTricks and HackTricks Cloud github repos.'''
