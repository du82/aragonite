HackTricks a summary of the important parts of the technique and will encourage the lector to visit the original post for more details. ORGANIZE all the hacking techniques in the book so it's MORE ACCESSIBLE The HackTricks team has dedicated thousands of hours for free only to organize the content so people can learn faster HackTricks faq tip Thank you so much for these resources, how can I thank you? You can publicly thanks HackTricks teams for putting together all these resources publicly in a tweet mentioning @hacktricks_live. If you are specially grateful you can also sponsor the project here. And don't forget to give a star in the Github projects! (Find the links below). tip How can I contribute to the project? You can share new tips and tricks with the community or fix bugs you find in the books sending a Pull Request to the respective Github pages: https://github.com/carlospolop/hacktricks https://github.com/carlospolop/hacktricks-cloud Don't forget to give a star in the Github projects! tip Can I copy some content from HackTricks and put it in my blog? Yes, you can, but don't forget to mention the specific link(s) where the content was taken from. tip How can I cite a page of HackTricks? As long as the link of the page(s) were you took the information from appears it's enough. If you need a bibtex you can use something like: latex @misc{hacktricks-bibtexing, author = {"HackTricks Team" or the Authors name of the specific page/trick}, title = {Title of the Specific Page}, year = {Year of Last Update (check it at the end of the page)}, url = {\url{https://book.hacktricks.wiki/specific-page}}, } warning Can I copy all HackTricks in my blog? I would rather not. Thats not going to benefit anyone as all the content is already publicly available in the official HackTricks books for free. If you fear that it will disappear, just fork it in Github or download it, as I said it's already free. warning Why do you have sponsors? Are HackTricks books for commercial purposes? The first HackTricks value is to offer FREE hacking educational resources to ALL the world. The HackTricks team has dedicated thousands of hours to offer this content, again, for FREE. If you think HackTricks books are made for commercial purposes you are COMPLETELY WRONG. We have sponsors because, even if all the content is FREE, we want to offer the community the possibility of appreciating our work if they want to. Therefore, we offer people the option to donate to HackTricks via Github sponsors, and relevant cybersecurity companies to sponsor HackTricks and to have some ads in the book being the ads always placed in places where make them visible but doesn't disturb the learning process if someone focus in the content. You won't find HackTricks filled with annoying ads like other blogs with much less content than HackTricks, because HackTricks is not made for commercial purposes. caution What should I do if some HackTricks page is based on my blog post but it isn't referenced? We are very sorry. This shouldn't have happened. Please, let us know via Github issues, Twitter, Discord... the link of the HackTricks page with the content and the link of your blog and we will check it and add it ASAP. caution What should I do if there is content from my blog in HackTricks and I don't want it there? Note that having links to your page in HackTricks: Improve your SEO The content gets translated to more than 15 languages making possible for more people to access this content HackTricks encourages people to check your page (several people has mentioned us that since some page of them is in HackTricks they receive more visits) However, If you still want the content of your blog to be removed from HackTricks just let us know and we will definitely remove every link to your blog, and any content based on it. caution What should I do if I find copy-pasted content in HackTricks? We always give the original authors all the credits. If you find a page with copy-pasted content without original source referenced, let us know and we will either remove it, add the link before the text, or rewrite it adding the link. LICENSE Copyright © All rights reserved unless otherwise specified. License Summary: Attribution: You are free to: Share — copy and redistribute the material in any medium or format. Adapt — remix, transform, and build upon the material. Additional Terms: Third-Party Content: Some parts of this blog/book may include content from other sources, such as excerpts from other blogs or publications. The use of such content is done under the principles of fair use or with explicit permission from the respective copyright holders. Please refer to the original sources for specific licensing information regarding third-party content. Authorship: The original content authored by HackTricks is subject to the terms of this license. You are encouraged to attribute this work to the author when sharing or adapting it. Exemptions: Commercial Use: For inquiries regarding commercial use of this content, please contact me. This license does not grant any trademark or branding rights in relation to the content. All trademarks and branding featured in this blog/book are the property of their respective owners. By accessing or using HackTricks, you agree to abide by the terms of this license. If you do not agree with these terms, please, do not access this website. Disclaimer caution This book, 'HackTricks,' is intended for educational and informational purposes only. The content within this book is provided on an 'as is' basis, and the authors and publishers make no representations or warranties of any kind, express or implied, about the completeness, accuracy, reliability, suitability, or availability of the information, products, services, or related graphics contained within this book. Any reliance you place on such information is therefore strictly at your own risk. The authors and publishers shall in no event be liable for any loss or damage, inc