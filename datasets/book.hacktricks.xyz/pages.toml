subdomain or IP with undetermined web server inside the scope. Start by identifying the technologies used by the web server. Look for tricks to keep in mind during the rest of the test if you can successfully identify the tech. Any known vulnerability of the version of the technology? Using any well known tech? Any useful trick to extract more information? Any specialised scanner to run (like wpscan)? Launch general purposes scanners. You never know if they are going to find something or if the are going to find some interesting information. Start with the initial checks: robots, sitemap, 404 error and SSL/TLS scan (if HTTPS). Start spidering the web page: It's time to find all the possible files, folders and parameters being used. Also, check for special findings. Note that anytime a new directory is discovered during brute-forcing or spidering, it should be spidered. Directory Brute-Forcing: Try to brute force all the discovered folders searching for new files and directories. Note that anytime a new directory is discovered during brute-forcing or spidering, it should be Brute-Forced. Backups checking: Test if you can find backups of discovered files appending common backup extensions. Brute-Force parameters: Try to find hidden parameters. Once you have identified all the possible endpoints accepting user input, check for all kind of vulnerabilities related to it. Follow this checklist Server Version (Vulnerable?) Identify Check if there are known vulnerabilities for the server version that is running. The HTTP headers and cookies of the response could be very useful to identify the technologies and/or version being used. Nmap scan can identify the server version, but it could also be useful the tools whatweb, webtech or https://builtwith.com/: bash whatweb -a 1 <URL> #Stealthy whatweb -a 3 <URL> #Aggresive webtech -u <URL> webanalyze -host https://google.com -crawl 2 Search for vulnerabilities of the web application version Check if any WAF https://github.com/EnableSecurity/wafw00f https://github.com/Ekultek/WhatWaf.git https://nmap.org/nsedoc/scripts/http-waf-detect.html Web tech tricks Some tricks for finding vulnerabilities in different well known technologies being used: AEM - Adobe Experience Cloud Apache Artifactory Buckets CGI Drupal Flask Git Golang GraphQL H2 - Java SQL database IIS tricks JBOSS Jenkins Jira Joomla JSP Laravel Moodle Nginx PHP (php has a lot of interesting tricks that could be exploited) Python Spring Actuators Symphony Tomcat VMWare Web API Pentesting WebDav Werkzeug Wordpress Electron Desktop (XSS to RCE) Take into account that the same domain can be using different technologies in different ports, folders and subdomains. If the web application is using any well known tech/platform listed before or any other, don't forget to search on the Internet new tricks (and let me know!). Source Code Review If the source code of the application is available in github, apart of performing by your own a White box test of the application there is some information that could be useful for the current Black-Box testing: Is there a Change-log or Readme or Version file or anything with version info accessible via web? How and where are saved the credentials? Is there any (accessible?) file with credentials (usernames or passwords)? Are passwords in plain text, encrypted or which hashing algorithm is used? Is it using any master key for encrypting something? Which algorithm is used? Can you access any of these files exploiting some vulnerability? Is there any interesting information in the github (solved and not solved) issues? Or in commit history (maybe some password introduced inside an old commit)? Source code Review / SAST Tools Automatic scanners General purpose automatic scanners bash nikto -h <URL> whatweb -a 4 <URL> wapiti -u <URL> W3af zaproxy #You can use an API nuclei -ut && nuclei -target <URL> # https://github.com/ignis-sec/puff (client side vulns fuzzer) node puff.js -w ./wordlist-examples/xss.txt -u "http://www.xssgame.com/f/m4KKGHi2rVUN/?query=FUZZ" CMS scanners If a CMS is used don't forget to run a scanner, maybe something juicy is found: Clusterd: JBoss, ColdFusion, WebLogic, Tomcat, Railo, Axis2, Glassfish CMSScan: WordPress, Drupal, Joomla, vBulletin websites for Security issues. (GUI) VulnX: Joomla, Wordpress, Drupal, PrestaShop, Opencart CMSMap: (W)ordpress, (J)oomla, (D)rupal or (M)oodle droopscan: Drupal, Joomla, Moodle, Silverstripe, Wordpress bash cmsmap [-f W] -F -d <URL> wpscan --force update -e --url <URL> joomscan --ec -u <URL> joomlavs.rb #https://github.com/rastating/joomlavs At this point you should already have some information of the web server being used by the client (if any data is given) and some tricks to keep in mind during the test. If you are lucky you have even found a CMS and run some scanner. Step-by-step Web Application Discovery From this point we are going to start interacting with the web application. Initial checks Default pages with interesting info: /robots.txt /sitemap.xml /crossdomain.xml /clientaccesspolicy.xml /.well-known/ Check also comments in the main and secondary pages. Forcing errors Web servers may behave unexpectedly when weird data is sent to them. This may open vulnerabilities or disclosure sensitive information. Access fake pages like /whatever_fake.php (.aspx,.html,.etc) Add "[]", "]]", and "[[" in cookie values and parameter values to create errors Generate error by giving input as /~randomthing/%s at the end of URL Try different HTTP Verbs like PATCH, DEBUG or wrong like FAKE Check if you can upload files (PUT verb, WebDav) If you find that WebDav is enabled but you don't have enough permissions for uploading files in the root folder try to: Brute Force credentials Upload files via WebDav to the rest of found folders inside the web page. You may have permissions to upload files in other folders. SSL/TLS vulnerabilites If the application isn't forcing the user of HTTPS in any part, then it's vulnerable to MitM If the application is sending sensitive data (passwords) using HTTP. Then it's a high vulnerability. Use testssl.sh to checks for vulnerabilities (In Bug Bounty programs probably these kind of vulnerabilities won't be accepted) and use a2sv to recheck the vulnerabilities: bash ./testssl.sh [--htmlfile] 10.10.10.10:443 #Use the --htmlfile to save the output inside an htmlfile also # You can also use other tools, by testssl.sh at this momment is the best one (I think) sslscan <host:port> sslyze --regular <ip:port> Information about SSL/TLS vulnerabilities: https://www.gracefulsecurity.com/tls-ssl-vulnerabilities/ https://www.acunetix.com/blog/articles/tls-vulnerabilities-attacks-final-part/ Spidering Launch some kind of spider inside the web. The goal of the spider is to find as much paths as possible from the tested application. Therefore, web crawling and external sources should be used to find as much valid paths as possible. gospider (go): HTML spider, LinkFinder in JS files and external sources (Archive.org, CommonCrawl.org, VirusTotal.com, AlienVault.com). hakrawler (go): HML spider, with LinkFider for JS files and Archive.org as external source. dirhunt (python): HTML spider, also indicates "juicy files". evine (go): Interactive CLI HTML spider. It also searches in Archive.org meg (go): This tool isn't a spider but it can be useful. You can just indicate a file with hosts and a file with paths and meg will fetch each path on each host and save the response. urlgrab (go): HTML spider with JS rendering capabilities. However, it looks like it's unmaintained, the precompiled version is old and the current code doesn't compile gau (go): HTML spider that uses external providers (wayback, otx, commoncrawl) ParamSpider: This script will find URLs with parameter and will list them. galer (go): HTML spider with JS rendering capabilities. LinkFinder (python): HTML spider, with JS beautify capabilities capable of search new paths in JS files. It could be worth it also take a look to JSScanner, which is a wrapper of LinkFinder. goLinkFinder (go): To extract endpoints in both HTML source and embedded javascript files. Useful for bug hunters, red teamers, infosec ninjas. JSParser (python2.7): A python 2.7 script using Tornado and JSBeautifier to parse relative URLs from JavaScript files. Useful for easily discovering AJAX requests. Looks like unmaintained. relative-url-extractor (ruby): Given a file (HTML) it will extract URLs from it using nifty regular expression to find and extract the relative URLs from ugly (minify) files. JSFScan (bash, several tools): Gather interesting information from JS files using several tools. subjs (go): Find JS files. page-fetch (go): Load a page in a headless browser and print out all the urls loaded to load the page. Feroxbuster (rust): Content discovery tool mixing several options of the previous tools Javascript Parsing: A Burp extension to find path and params in JS files. Sourcemapper: A tool that given the .js.map URL will get you t'''
