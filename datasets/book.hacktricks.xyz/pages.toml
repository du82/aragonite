d app installers. It is common for organizations to block cmd.exe and PowerShell.exe and write access to certain directories, but this can all be bypassed. Check Check which files/extensions are blacklisted/whitelisted: powershell Get-ApplockerPolicy -Effective -xml Get-AppLockerPolicy -Effective | select -ExpandProperty RuleCollections $a = Get-ApplockerPolicy -effective $a.rulecollections This registry path contains the configurations and policies applied by AppLocker, providing a way to review the current set of rules enforced on the system: HKLM\Software\Policies\Microsoft\Windows\SrpV2 Bypass Useful Writable folders to bypass AppLocker Policy: If AppLocker is allowing to execute anything inside C:\Windows\System32 or C:\Windows there are writable folders you can use to bypass this. C:\Windows\System32\Microsoft\Crypto\RSA\MachineKeys C:\Windows\System32\spool\drivers\color C:\Windows\Tasks C:\windows\tracing Commonly trusted "LOLBAS's" binaries can be also useful to bypass AppLocker. Poorly written rules could also be bypassed For example, <FilePathCondition Path="%OSDRIVE%*\allowed*"/>, you can create a folder called allowed anywhere and it will be allowed. Organizations also often focus on blocking the %System32%\WindowsPowerShell\v1.0\powershell.exe executable, but forget about the other PowerShell executable locations such as %SystemRoot%\SysWOW64\WindowsPowerShell\v1.0\powershell.exe or PowerShell_ISE.exe. DLL enforcement very rarely enabled due to the additional load it can put on a system, and the amount of testing required to ensure nothing will break. So using DLLs as backdoors will help bypassing AppLocker. You can use ReflectivePick or SharpPick to execute Powershell code in any process and bypass AppLocker. For more info check: https://hunter2.gitbook.io/darthsidious/defense-evasion/bypassing-applocker-and-powershell-contstrained-language-mode. Credentials Storage Security Accounts Manager (SAM) Local credentials are present in this file, the passwords are hashed. Local Security Authority (LSA) - LSASS The credentials (hashed) are saved in the memory of this subsystem for Single Sign-On reasons. LSA administrates the local security policy (password policy, users permissions...), authentication, access tokens... LSA will be the one that will check for provided credentials inside the SAM file (for a local login) and talk with the domain controller to authenticate a domain user. The credentials are saved inside the process LSASS: Kerberos tickets, hashes NT and LM, easily decrypted passwords. LSA secrets LSA could save in disk some credentials: Password of the computer account of the Active Directory (unreachable domain controller). Passwords of the accounts of Windows services Passwords for scheduled tasks More (password of IIS applications...) NTDS.dit It is the database of the Active Directory. It is only present in Domain Controllers. Defender Microsoft Defender is an Antivirus that is available in Windows 10 and Windows 11, and in versions of Windows Server. It blocks common pentesting tools such as WinPEAS. However, there are ways to bypass these protections. Check To check the status of Defender you can execute the PS cmdlet Get-MpComputerStatus (check the value of RealTimeProtectionEnabled to know if it's active): PS C:\> Get-MpComputerStatus [...] AntispywareEnabled : True AntispywareSignatureAge : 1 AntispywareSignatureLastUpdated : 12/6/2021 10:14:23 AM AntispywareSignatureVersion : 1.323.392.0 AntivirusEnabled : True [...] NISEnabled : False NISEngineVersion : 0.0.0.0 [...] RealTimeProtectionEnabled : True RealTimeScanDirection : 0 PSComputerName : To enumerate it you could also run: bash WMIC /Node:localhost /Namespace:\\root\SecurityCenter2 Path AntiVirusProduct Get displayName /Format:List wmic /namespace:\\root\securitycenter2 path antivirusproduct sc query windefend #Delete all rules of Defender (useful for machines without internet access) "C:\Program Files\Windows Defender\MpCmdRun.exe" -RemoveDefinitions -All Encrypted File System (EFS) EFS secures files through encryption, utilizing a symmetric key known as the File Encryption Key (FEK). This key is encrypted with the user's public key and stored within the encrypted file's $EFS alternative data stream. When decryption is needed, the corresponding private key of the user's digital certificate is used to decrypt the FEK from the $EFS stream. More details can be found here. Decryption scenarios without user initiation include: When files or folders are moved to a non-EFS file system, like FAT32, they are automatically decrypted. Encrypted files sent over the network via SMB/CIFS protocol are decrypted prior to transmission. This encryption method allows transparent access to encrypted files for the owner. However, simply changing the owner's password and logging in will not permit decryption. Key Takeaways: EFS uses a symmetric FEK, encrypted with the user's public key. Decryption employs the user's private key to access the FEK. Automatic decryption occurs under specific conditions, like copying to FAT32 or network transmission. Encrypted files are accessible to the owner without additional steps. Check EFS info Check if a user has used this service checking if this path exists:C:\users\<username>\appdata\roaming\Microsoft\Protect Check who has access to the file using cipher /c <file> You can also use cipher /e and cipher /d inside a folder to encrypt and decrypt all the files Decrypting EFS files Being Authority System This way requires the victim user to be running a process inside the host. If that is the case, using a meterpreter sessions you can impersonate the token of the process of the user (impersonate_token from incognito). Or you could just migrate to process of the user. Knowing the users password howto ~ decrypt EFS files \xc2\xb7 gentilkiwi/mimikatz Wiki \xc2\xb7 GitHub Group Managed Service Accounts (gMSA) Microsoft developed Group Managed Service Accounts (gMSA) to simplify the management of service accounts in IT infrastructures. Unlike traditional service accounts that often have the "Password never expire" setting enabled, gMSAs offer a more secure and manageable solution: Automatic Password Management: gMSAs use a complex, 240-character password that automatically changes according to domain or computer policy. This process is handled by Microsoft's Key Distribution Service (KDC), eliminating the need for manual password updates. Enhanced Security: These accounts are immune to lockouts and cannot be used for interactive logins, enhancing their security. Multiple Host Support: gMSAs can be shared across multiple hosts, making them ideal for services running on multiple servers. Scheduled Task Capability: Unlike managed service accounts, gMSAs support running scheduled tasks. Simplified SPN Management: The system automatically updates the Service Principal Name (SPN) when there are changes to the computer's sAMaccount details or DNS name, simplifying SPN management. The passwords for gMSAs are stored in the LDAP property msDS-ManagedPassword and are automatically reset every 30 days by Domain Controllers (DCs). This password, an encrypted data blob known as MSDS-MANAGEDPASSWORD_BLOB, can only be retrieved by authorized administrators and the servers on which the gMSAs are installed, ensuring a secure environment. To access this information, a secured connection such as LDAPS is required, or the connection must be authenticated with 'Sealing & Secure'. You can read this password with GMSAPasswordReader: /GMSAPasswordReader --AccountName jkohler Find more info in this post Also, check this web page about how to perform a NTLM relay attack to read the password of gMSA. LAPS The Local Administrator Password Solution (LAPS), available for download from Microsoft, enables the management of local Administrator passwords. These passwords, which are randomized, unique, and regularly changed, are stored centrally in Active Directory. Access to these passwords is restricted through ACLs to authorized users. With sufficient permissions granted, the ability to read local admin passwords is provided. LAPS PS Constrained Language Mode PowerShell Constrained Language Mode locks down many of the features needed to use PowerShell effectively, such as blocking COM objects, only allowing approved .NET types, XAML-based workflows, PowerShell classes, and more. Check powershell $ExecutionContext.SessionState.LanguageMode #Values could be: FullLanguage or ConstrainedLanguage Bypass powershell #Easy bypass Powershell -version 2 In current Windows that Bypass won't work but you can use PSByPassCLM. To compile it you may need to Add a Reference -> Browse ->Browse -> add C:\Windows\Microsoft.NET\assembly\GAC_MSIL\System.Management.Automation\v4.0_3.0.0.0\31bf3856ad364e35\System.Management.Automation.dll and change the project to .Net4.5. Direct bypass: bash C:\Windows\Microsoft.NET\Framework64\v4.0.30319\InstallUtil.exe /logfile= /LogToConsole=true /U c:\temp\psby.exe Revers'''
