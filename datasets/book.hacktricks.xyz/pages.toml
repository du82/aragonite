ve (if not, you could lose a lot of time, but this option also produces false negatives saying that they are not active), it prevents the discovery phase. -sn : No port scan. After completing the reconnaissance phase, it does not scan ports. It is relatively stealthy, and allows a small network scan. With privileges it sends an ACK (-PA) to 80, a SYN(-PS) to 443 and an echo request and a Timestamp request, without privileges it always completes connections. If the target is the network, it only uses ARP(-PR). If used with another option, only the packets of the other option are dropped. -PR: Ping ARP. It is used by default when analyzing computers in our network, it is faster than using pings. If you do not want to use ARP packets use --send-ip. -PS <ports>: It sends SYN packets to which if it answers SYN/ACK it is open (to which it answers with RST so as not to end the connection), if it answers RST it is closed and if it does not answer it is unreachable. In case of not having privileges, a total connection is automatically used. If no ports are given, it throws it to 80. -PA <ports>: Like the previous one but with ACK, combining both of them gives better results. -PU <ports>: The objective is the opposite, they are sent to ports that are expected to be closed. Some firewalls only check TCP connections. If it is closed it is answered with port unreachable, if it is answered with another icmp or not answered it is left as destination unreachable. -PE, -PP, -PM : ICMP PINGS: echo replay, timestamp and addresmask. They are launched to find out if the target is active. -PY<ports>: Sends SCTP INIT probes to 80 by default, INIT-ACK(open) or ABORT(closed) or nothing or ICMP unreachable(inactive) can be replied. -PO <protocols>: A protocol is indicated in the headers, by default 1(ICMP), 2(IGMP) and 4(Encap IP). For ICMP, IGMP, TCP (6) and UDP (17) protocols the protocol headers are sent, for the rest only the IP header is sent. The purpose of this is that due to the malformation of the headers, Protocol unreachable or responses of the same protocol are answered to know if it is up. -n: No DNS -R: DNS always Port scanning techniques -sS: Does not complete the connection so it leaves no trace, very good if it can be used.(privileges) It is the one used by default. -sT: Completes the connection, so it does leave a trace, but it can be used for sure. By default without privileges. -sU: Slower, for UDP. Mostly: DNS(53), SNMP(161,162), DHCP(67 and 68), (-sU53,161,162,67,68): open(reply), closed(port unreachable), filtered (another ICMP), open/filtered (nothing). In case of open/filtered, -sV sends numerous requests to detect any of the versions that nmap supports and can detect the true state. It increases a lot the time. -sY: SCTP protocol fails to establish the connection, so there are no logs, works like -PY -sN,-sX,-sF: Null, Fin, Xmas, they can penetrate some firewalls and extract information. They are based on the fact that standard compliant machines should respond with RST all requests that do not have SYN, RST or ACK lags raised: open/filtered(nothing), closed(RST), filtered (ICMP unreachable). Unreliable on WIndows, CIsco, BSDI and OS/400. On unix yes. -sM: Maimon scan: Sends FIN and ACK flags, used for BSD, currently will return all as closed. -sA, sW: ACK and Window, is used to detect firewalls, to know if the ports are filtered or not. The -sW does distinguish between open/closed since the open ones respond with a different window value: open (RST with window other than 0), closed (RST window = 0), filtered (ICMP unreachable or nothing). Not all computers work this way, so if it is all closed, it is not working, if it is a few open, it is working fine, and if it is many open and few closed, it is working the other way around. -sI: Idle scan. For the cases in which there is an active firewall but we know that it does not filter to a certain Ip (or when we simply want anonymity) we can use the zombie scanner (it works for all the ports), to look for possible zombies we can use the scrpit ipidseq or the exploit auxiliary/scanner/ip/ipidseq. This scanner is based on the IPID number of the IP packets. --badsum: It sends the sum wrong, the computers would discard the packets, but the firewalls could answer something, it is used to detect firewalls. -sZ: "Weird" SCTP scanner, when sending probes with cookie echo fragments they should be dropped if open or responded with ABORT if closed. It can pass through firewalls that init does not pass through, the bad thing is that it does not distinguish between filtered and open. -sO: Protocol Ip scan. Sends bad and empty headers in which sometimes not even the protocol can be distinguished. If ICMP unreachable protocol arrives it is closed, if unreachable port arrives it is open, if another error arrives, filtered, if nothing arrives, open|filtered. -b <server>: FTPhost--> It is used to scan a host from another one, this is done by connecting the ftp of another machine and asking it to send files to the ports that you want to scan from another machine, according to the answers we will know if they are open or not. [<user>:<password>@]<server>[:<port>] Almost all ftps servers no longer let you do this and therefore it is of little practical use. Focus Analysis -p: Used to specify ports to scan. To select all 65,335 ports: -p- or -p all. Nmap has an internal classification based on popularity. By default, it uses the top 1000 ports. With -F (fast scan) it analyzes the top 100. With --top-ports it analyzes that number of top ports (from 1 to 65,335). It checks ports in random order; to prevent this, use -r. We can also select specific ports: 20-30,80,443,1024- (the latter means to look from 1024 onwards). We can also group ports by protocols: U:53,T:21-25,80,139,S:9. We can also choose a range within Nmap's popular ports: -p [-1024] analyzes up to port 1024 from those included in nmap-services. --port-ratio Analyzes the most common ports within a ratio between 0 and 1 -sV Version scanning, intensity can be regulated from 0 to 9, default is 7. --version-intensity We regulate the intensity, so that the lower it is, it will only launch the most probable probes, but not all. With this, we can considerably shorten UDP scanning time -O OS detection --osscan-limit For proper host scanning, at least one open port and one closed port are needed. If this condition isn't met and we've set this, it won't attempt OS prediction (saves time) --osscan-guess When OS detection isn't perfect, this makes it try harder Scripts --script |||[,...] To use default scripts, use -sC or --script=default Available types are: auth, broadcast, default, discovery, dos, exploit, external, fuzzer, intrusive, malware, safe, version, and vuln Auth: executes all available authentication scripts Default: executes basic default tool scripts Discovery: retrieves information from the target or victim External: script for using external resources Intrusive: uses scripts considered intrusive to the victim or target Malware: checks for connections opened by malicious code or backdoors Safe: executes non-intrusive scripts Vuln: discovers the most known vulnerabilities All: executes absolutely all available NSE extension scripts To search for scripts: nmap --script-help="http-*" -> Those starting with http- nmap --script-help="not intrusive" -> All except those nmap --script-help="default or safe" -> Those in either or both nmap --script-help="default and safe" --> Those in both nmap --script-help="(default or safe or intrusive) and not http-*" --script-args =,={=},={,} --script-args-file --script-help ||||all[,...] --script-trace ---> Provides info on how the script is progressing --script-updatedb To use a script, just type: nmap --script Script_Name target --> When using the script, both the script and scanner will execute, so scanner options can also be added. We can add "safe=1" to execute only safe ones. Time Control Nmap can modify time in seconds, minutes, ms: --host-timeout arguments 900000ms, 900, 900s, and 15m all do the same thing. Nmap divides the total number of hosts to scan into groups and analyzes these groups in blocks, so it doesn't move to the next block until all have been analyzed (and the user doesn't receive any updates until the block has been analyzed). This way, it's more optimal for Nmap to use large groups. By default in class C, it uses 256. This can be changed with --min-hostgroup ; --max-hostgroup (Adjust parallel scan group sizes) You can control the number of parallel scanners but it's better not to (Nmap already incorporates automatic control based on network status): --min-parallelism ; --max-parallelism We can modify the RTT timeout, but it's usually not necessary: --min-rtt-timeout , --max-rtt-timeout , --initial-rtt-timeout We can modify the number of attempts: --max-retries We can modify the scanning time of a host: --host-timeout We can modify the time between each test to slow it down: --scan-delay ; --max-scan-delay We '''
