0 24 24"%3E%3Cpath fill="currentColor" d="M12 17q.425 0 .713-.288T13 16q0-.425-.288-.712T12 15q-.425 0-.712.288T11 16q0 .425.288.713T12 17m0-4q.425 0 .713-.288T13 12V8q0-.425-.288-.712T12 7q-.425 0-.712.288T11 8v4q0 .425.288.713T12 13m-3.35 7H6q-.825 0-1.412-.587T4 18v-2.65L2.075 13.4q-.275-.3-.425-.662T1.5 12q0-.375.15-.737t.425-.663L4 8.65V6q0-.825.588-1.412T6 4h2.65l1.95-1.925q.3-.275.663-.425T12 1.5q.375 0 .738.15t.662.425L15.35 4H18q.825 0 1.413.588T20 6v2.65l1.925 1.95q.275.3.425.663t.15.737q0 .375-.15.738t-.425.662L20 15.35V18q0 .825-.587 1.413T18 20h-2.65l-1.95 1.925q-.3.275-.662.425T12 22.5q-.375 0-.737-.15t-.663-.425zm.85-2l2.5 2.5l2.5-2.5H18v-3.5l2.5-2.5L18 9.5V6h-3.5L12 3.5L9.5 6H6v3.5L3.5 12L6 14.5V18zm2.5-6"%2F%3E%3C%2Fsvg%3E'); } div.codeblock_filename_container + pre { margin-top: 0; } span.codeblock_filename_inner { border-radius: 0.4rem 0.4rem 0 0; padding: 0.6rem 1rem 0.6rem 1rem; font-family: var(--mono-font) !important; font-size: var(--code-font-size); } ELF Basic Information Reading time: 14 minutes tip Learn & practice AWS Hacking:HackTricks Training AWS Red Team Expert (ARTE) Learn & practice GCP Hacking: HackTricks Training GCP Red Team Expert (GRTE) Support HackTricks Check the subscription plans! Join the 💬 Discord group or the telegram group or follow us on Twitter 🐦 @hacktricks_live. Share hacking tricks by submitting PRs to the HackTricks and HackTricks Cloud github repos. Program Headers The describe to the loader how to load the ELF into memory: bash readelf -lW lnstat Elf file type is DYN (Position-Independent Executable file) Entry point 0x1c00 There are 9 program headers, starting at offset 64 Program Headers: Type Offset VirtAddr PhysAddr FileSiz MemSiz Flg Align PHDR 0x000040 0x0000000000000040 0x0000000000000040 0x0001f8 0x0001f8 R 0x8 INTERP 0x000238 0x0000000000000238 0x0000000000000238 0x00001b 0x00001b R 0x1 [Requesting program interpreter: /lib/ld-linux-aarch64.so.1] LOAD 0x000000 0x0000000000000000 0x0000000000000000 0x003f7c 0x003f7c R E 0x10000 LOAD 0x00fc48 0x000000000001fc48 0x000000000001fc48 0x000528 0x001190 RW 0x10000 DYNAMIC 0x00fc58 0x000000000001fc58 0x000000000001fc58 0x000200 0x000200 RW 0x8 NOTE 0x000254 0x0000000000000254 0x0000000000000254 0x0000e0 0x0000e0 R 0x4 GNU_EH_FRAME 0x003610 0x0000000000003610 0x0000000000003610 0x0001b4 0x0001b4 R 0x4 GNU_STACK 0x000000 0x0000000000000000 0x0000000000000000 0x000000 0x000000 RW 0x10 GNU_RELRO 0x00fc48 0x000000000001fc48 0x000000000001fc48 0x0003b8 0x0003b8 R 0x1 Section to Segment mapping: Segment Sections... 00 01 .interp 02 .interp .note.gnu.build-id .note.ABI-tag .note.package .gnu.hash .dynsym .dynstr .gnu.version .gnu.version_r .rela.dyn .rela.plt .init .plt .text .fini .rodata .eh_frame_hdr .eh_frame 03 .init_array .fini_array .dynamic .got .data .bss 04 .dynamic 05 .note.gnu.build-id .note.ABI-tag .note.package 06 .eh_frame_hdr 07 08 .init_array .fini_array .dynamic .got The previous program has 9 program headers, then, the segment mapping indicates in which program header (from 00 to 08) each section is located. PHDR - Program HeaDeR Contains the program header tables and metadata itself. INTERP Indicates the path of the loader to use to load the binary into memory. LOAD These headers are used to indicate how to load a binary into memory. Each LOAD header indicates a region of memory (size, permissions and alignment) and indicates the bytes of the ELF binary to copy in there. For example, the second one has a size of 0x1190, should be located at 0x1fc48 with permissions read and write and will be filled with 0x528 from the offset 0xfc48 (it doesn't fill all the reserved space). This memory will contain the sections .init_array .fini_array .dynamic .got .data .bss. DYNAMIC This header helps to link programs to their library dependencies and apply relocations. Check the .dynamic section. NOTE This stores vendor metadata information about the binary. GNU_EH_FRAME Defines the location of the stack unwind tables, used by debuggers and C++ exception handling-runtime functions. GNU_STACK Contains the configuration of the stack execution prevention defense. If enabled, the binary won't be able to execute code from the stack. GNU_RELRO Indicates the RELRO (Relocation Read-Only) configuration of the binary. This protection will mark as read-only certain sections of the memory (like the GOT or the init and fini tables) after the program has loaded and before it begins running. In the previous example it's copying 0x3b8 bytes to 0x1fc48 as read-only affecting the sections .init_array .fini_array .dynamic .got .data .bss. Note that RELRO can be partial or full, the partial version do not protect the section .plt.got, which is used for lazy binding and needs this memory space to have write permissions to write the address of the libraries the first time their location is searched. TLS Defines a table of TLS entries, which stores info about thread-local variables. Section Headers Section headers gives a more detailed view of the ELF binary objdump lnstat -h lnstat: file format elf64-littleaarch64 Sections: Idx Name Size VMA LMA File off Algn 0 .interp 0000001b 0000000000000238 0000000000000238 00000238 2**0 CONTENTS, ALLOC, LOAD, READONLY, DATA 1 .note.gnu.build-id 00000024 0000000000000254 0000000000000254 00000254 2**2 CONTENTS, ALLOC, LOAD, READONLY, DATA 2 .note.ABI-tag 00000020 0000000000000278 0000000000000278 00000278 2**2 CONTENTS, ALLOC, LOAD, READONLY, DATA 3 .note.package 0000009c 0000000000000298 0000000000000298 00000298 2**2 CONTENTS, ALLOC, LOAD, READONLY, DATA 4 .gnu.hash 0000001c 0000000000000338 0000000000000338 00000338 2**3 CONTENTS, ALLOC, LOAD, READONLY, DATA 5 .dynsym 00000498 0000000000000358 0000000000000358 00000358 2**3 CONTENTS, ALLOC, LOAD, READONLY, DATA 6 .dynstr 000001fe 00000000000007f0 00000000000007f0 000007f0 2**0 CONTENTS, ALLOC, LOAD, READONLY, DATA 7 .gnu.version 00000062 00000000000009ee 00000000000009ee 000009ee 2**1 CONTENTS, ALLOC, LOAD, READONLY, DATA 8 .gnu.version_r 00000050 0000000000000a50 0000000000000a50 00000a50 2**3 CONTENTS, ALLOC, LOAD, READONLY, DATA 9 .rela.dyn 00000228 0000000000000aa0 0000000000000aa0 00000aa0 2**3 CONTENTS, ALLOC, LOAD, READONLY, DATA 10 .rela.plt 000003c0 0000000000000cc8 0000000000000cc8 00000cc8 2**3 CONTENTS, ALLOC, LOAD, READONLY, DATA 11 .init 00000018 0000000000001088 0000000000001088 00001088 2**2 CONTENTS, ALLOC, LOAD, READONLY, CODE 12 .plt 000002a0 00000000000010a0 00000000000010a0 000010a0 2**4 CONTENTS, ALLOC, LOAD, READONLY, CODE 13 .text 00001c34 0000000000001340 0000000000001340 00001340 2**6 CONTENTS, ALLOC, LOAD, READONLY, CODE 14 .fini 00000014 0000000000002f74 0000000000002f74 00002f74 2**2 CONTENTS, ALLOC, LOAD, READONLY, CODE 15 .rodata 00000686 0000000000002f88 0000000000002f88 00002f88 2**3 CONTENTS, ALLOC, LOAD, READONLY, DATA 16 .eh_frame_hdr 000001b4 0000000000003610 0000000000003610 00003610 2**2 CONTENTS, ALLOC, LOAD, READONLY, DATA 17 .eh_frame 000007b4 00000000000037c8 00000000000037c8 000037c8 2**3 CONTENTS, ALLOC, LOAD, READONLY, DATA 18 .init_array 00000008 000000000001fc48 000000000001fc48 0000fc48 2**3 CONTENTS, ALLOC, LOAD, DATA 19 .fini_array 00000008 000000000001fc50 000000000001fc50 0000fc50 2**3 CONTENTS, ALLOC, LOAD, DATA 20 .dynamic 00000200 000000000001fc58 000000000001fc58 0000fc58 2**3 CONTENTS, ALLOC, LOAD, DATA 21 .got 000001a8 000000000001fe58 000000000001fe58 0000fe58 2**3 CONTENTS, ALLOC, LOAD, DATA 22 .data 00000170 0000000000020000 0000000000020000 00010000 2**3 CONTENTS, ALLOC, LOAD, DATA 23 .bss 00000c68 0000000000020170 0000000000020170 00010170 2**3 ALLOC 24 .gnu_debugaltlink 00000049 0000000000000000 0000000000000000 00010170 2**0 CONTENTS, READONLY 25 .gnu_debuglink 00000034 0000000000000000 0000000000000000 000101bc 2**2 CONTENTS, READONLY It also indicates the location, offset, permissions but also the type of data it section has. Meta Sections String table: It contains all the strings needed by the ELF file (but not the ones actually used by the program). For example it contains sections names like .text or .data. And if .text is at offset 45 in the strings table it will use the number 45 in the name field. In order to find where the string table is, the ELF contains a pointer to the string table. Symbol table: It contains info about the symbols like the name (offset in the strings table), address, size and more metadata about the symbol. Main Sections .text: The instruction of the program to run. .data: Global variables with a defined value in the program. .bss: Global variables left uninitialized (or init to zero). Variables here are automatically intialized to zero therefore preventing useless zeroes to being added to the binary. .rodata: Constant global variables (read-only section). .tdata and .tbss: Like the .data and .bss when thread-local variables are used (__thread_local in C++ or __thread in C). .dynamic: See below. Symbols Symbols is a named location in the program which could be a function, a global data object, thread-local variables... readelf -s lnstat Symbol table '.dynsym' contains 49 entries: Num: Value Size Type Bind Vis Ndx Name 0: 0000000000000000 0 NOTYPE LOCAL DEFAULT UND 1: 0000000000001088 0 SECTION LOCAL DEFAULT 12 .init 2: 0000000000020000 0 SECTION LOCAL DEFAULT 23 .data 3: 0000000000000000 0 FUNC GLOBAL DEFAULT UND strtok@GLIBC_2.17 (2) 4: 0000000000000000 0 FUNC GLOBAL DEFAULT UND s[...]@GLIBC_2.17 (2) 5: 0000000000000000 0 FUNC GLOBAL DEFAULT UND strlen@GLIBC_2.17 (2) 6: 0000000000000000 0 FUNC GLOBAL DEFAULT UND fputs@GLIBC_2.17 (2) 7: 0000000000000000 0 FUNC GLOBAL DEFAULT UND exit@GLIBC_2.17 (2) 8: 0000000000000000 0 FUNC GLOBAL DEFAULT UND _[...]@GLIBC_2.34 (3) 9: 0000000000000000 0 FUNC GLOBAL DEFAULT UND perror@GLIBC_2.17 (2) 10: 0000000000000000 0 NOTYPE WEAK DEFAULT UND _ITM_deregisterT[...] 11: 0000000000000000 0 FUNC WEAK DEFAULT UND _[...]@GLIBC_2.17 (2) 12: 0000000000000000 0 FUNC GLOBAL DEFAULT UND putc@GLIBC_2.17 (2) [...] Each symbol entry contains: Name Binding attributes (weak, local or global): A local symbol can only be accessed by the program itself while the global symbol are shared outside the program. A weak object is for example a function that can be overridden by a different one. Type: NOTYPE (no type specified), OBJECT (global data var), FUNC (function), SECTION (section), FILE (source-code file for debuggers), TLS (thread-local variable), GNU_IFUNC (indirect function for relocation) Section index where it's located Value (address sin memory) Size Dynamic Section readelf -d lnstat Dynamic section at offset 0xfc58 contains 28 entries: Tag Type Name/Value 0x0000000000000001 (NEEDED) Shared library: [libc.so.6] 0x0000000000000001 (NEEDED) Shared library: [ld-linux-aarch64.so.1] 0x000000000000000c (INIT) 0x1088 0x000000000000000d (FINI) 0x2f74 0x0000000000000019 (INIT_ARRAY) 0x1fc48 0x000000000000001b (INIT_ARRAYSZ) 8 (bytes) 0x000000000000001a (FINI_ARRAY) 0x1fc50 0x000000000000001c (FINI_ARRAYSZ) 8 (bytes) 0x000000006ffffe'''
