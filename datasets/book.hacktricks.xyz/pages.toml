e groups of these domains linked by a shared structure, and a forest represents the collection of multiple trees, interconnected through trust relationships, forming the uppermost layer of the organizational structure. Specific access and communication rights can be designated at each of these levels. Key concepts within Active Directory include: Directory – Houses all information pertaining to Active Directory objects. Object – Denotes entities within the directory, including users, groups, or shared folders. Domain – Serves as a container for directory objects, with the capability for multiple domains to coexist within a forest, each maintaining its own object collection. Tree – A grouping of domains that share a common root domain. Forest – The pinnacle of organizational structure in Active Directory, composed of several trees with trust relationships among them. Active Directory Domain Services (AD DS) encompasses a range of services critical for the centralized management and communication within a network. These services comprise: Domain Services – Centralizes data storage and manages interactions between users and domains, including authentication and search functionalities. Certificate Services – Oversees the creation, distribution, and management of secure digital certificates. Lightweight Directory Services – Supports directory-enabled applications through the LDAP protocol. Directory Federation Services – Provides single-sign-on capabilities to authenticate users across multiple web applications in a single session. Rights Management – Assists in safeguarding copyright material by regulating its unauthorized distribution and use. DNS Service – Crucial for the resolution of domain names. For a more detailed explanation check: TechTerms - Active Directory Definition Kerberos Authentication To learn how to attack an AD you need to understand really good the Kerberos authentication process. Read this page if you still don't know how it works. Cheat Sheet You can take a lot to https://wadcoms.github.io/ to have a quick view of which commands you can run to enumerate/exploit an AD. Recon Active Directory (No creds/sessions) If you just have access to an AD environment but you don't have any credentials/sessions you could: Pentest the network: Scan the network, find machines and open ports and try to exploit vulnerabilities or extract credentials from them (for example, printers could be very interesting targets. Enumerating DNS could give information about key servers in the domain as web, printers, shares, vpn, media, etc. gobuster dns -d domain.local -t 25 -w /opt/Seclist/Discovery/DNS/subdomain-top2000.txt Take a look to the General Pentesting Methodology to find more information about how to do this. Check for null and Guest access on smb services (this won't work on modern Windows versions): enum4linux -a -u "" -p "" <DC IP> && enum4linux -a -u "guest" -p "" <DC IP> smbmap -u "" -p "" -P 445 -H <DC IP> && smbmap -u "guest" -p "" -P 445 -H <DC IP> smbclient -U '%' -L //<DC IP> && smbclient -U 'guest%' -L // A more detailed guide on how to enumerate a SMB server can be found here: 139,445 - Pentesting SMB Enumerate Ldap nmap -n -sV --script "ldap* and not brute" -p 389 <DC IP> A more detailed guide on how to enumerate LDAP can be found here (pay special attention to the anonymous access): 389, 636, 3268, 3269 - Pentesting LDAP Poison the network Gather credentials impersonating services with Responder Access host by abusing the relay attack Gather credentials exposing fake UPnP services with evil-SSDP OSINT: Extract usernames/names from internal documents, social media, services (mainly web) inside the domain environments and also from the publicly available. If you find the complete names of company workers, you could try different AD username conventions (read this). The most common conventions are: NameSurname, Name.Surname, NamSur (3letters of each), Nam.Sur, NSurname, N.Surname, SurnameName, Surname.Name, SurnameN, Surname.N, 3 random letters and 3 random numbers (abc123). Tools: w0Tx/generate-ad-username urbanadventurer/username-anarchy User enumeration Anonymous SMB/LDAP enum: Check the pentesting SMB and pentesting LDAP pages. Kerbrute enum: When an invalid username is requested the server will respond using the Kerberos error code KRB5KDC_ERR_C_PRINCIPAL_UNKNOWN, allowing us to determine that the username was invalid. Valid usernames will illicit either the TGT in a AS-REP response or the error KRB5KDC_ERR_PREAUTH_REQUIRED, indicating that the user is required to perform pre-authentication. No Authentication against MS-NRPC: Using auth-level = 1 (No authentication) against the MS-NRPC (Netlogon) interface on domain controllers. The method calls the DsrGetDcNameEx2 function after binding MS-NRPC interface to check if the user or computer exists without any credentials. The NauthNRPC tool implements this type of enumeration. The research can be found here bash ./kerbrute_linux_amd64 userenum -d lab.ropnop.com --dc 10.10.10.10 usernames.txt #From https://github.com/ropnop/kerbrute/releases nmap -p 88 --script=krb5-enum-users --script-args="krb5-enum-users.realm='DOMAIN'" <IP> Nmap -p 88 --script=krb5-enum-users --script-args krb5-enum-users.realm='<domain>',userdb=/root/Desktop/usernames.txt <IP> msf> use auxiliary/gather/kerberos_enumusers crackmapexec smb dominio.es -u '' -p '' --users | awk '{print $4}' | uniq python3 nauth.py -t target -u users_file.txt #From https://github.com/sud0Ru/NauthNRPC OWA (Outlook Web Access) Server If you found one of these servers in the network you can also perform user enumeration against it. For example, you could use the tool MailSniper: bash ipmo C:\Tools\MailSniper\MailSniper.ps1 # Get info about the domain Invoke-DomainHarvestOWA -ExchHostname [ip] # Enumerate valid users from a list of potential usernames Invoke-UsernameHarvestOWA -ExchHostname [ip] -Domain [domain] -UserList .\possible-usernames.txt -OutFile valid.txt # Password spraying Invoke-PasswordSprayOWA -ExchHostname [ip] -UserList .\valid.txt -Password Summer2021 # Get addresses list from the compromised mail Get-GlobalAddressList -ExchHostname [ip] -UserName [domain]\[username] -Password Summer2021 -OutFile gal.txt warning You can find lists of usernames in this github repo **** and this one (statistically-likely-usernames). However, you should have the name of the people working on the company from the recon step you should have performed before this. With the name and surname you could used the script namemash.py to generate potential valid usernames. Knowing one or several usernames Ok, so you know you have already a valid username but no passwords... Then try: ASREPRoast: If a user doesn't have the attribute DONT_REQ_PREAUTH you can request a AS_REP message for that user that will contain some data encrypted by a derivation of the password of the user. Password Spraying: Let's try the most common passwords with each of the discovered users, maybe some user is using a bad password (keep in mind the password policy!). Note that you can also spray OWA servers to try to get access to the users mail servers. Password Spraying / Brute Force LLMNR/NBT-NS Poisoning You might be able to obtain some challenge hashes to crack poisoning some protocols of the network: Spoofing LLMNR, NBT-NS, mDNS/DNS and WPAD and Relay Attacks NTML Relay If you have managed to enumerate the active directory you will have more emails and a better understanding of the network. You might be able to to force NTML relay attacks **** to get access to the AD env. Steal NTLM Creds If you can access other PCs or shares with the null or guest user you could place files (like a SCF file) that if somehow accessed will trigger an NTML authentication against you so you can steal the NTLM challenge to crack it: Places to steal NTLM creds Enumerating Active Directory WITH credentials/session For this phase you need to have compromised the credentials or a session of a valid domain account. If you have some valid credentials or a shell as a domain user, you should remember that the options given before are still options to compromise other users. Before start the authenticated enumeration you should know what is the Kerberos double hop problem. Kerberos Double Hop Problem Enumeration Having compromised an account is a big step to start compromising the whole domain, because you are going to be able to start the Active Directory Enumeration: Regarding ASREPRoast you can now find every possible vulnerable user, and regarding Password Spraying you can get a list of all the usernames and try the password of the compromised account, empty passwords and new promising passwords. You could use the CMD to perform a basic recon You can also use powershell for recon which will be stealthier You ca also use powerview to extract more detailed information Another amazing tool for recon in an active directory is BloodHound. It is not very stealthy (depending on the collection methods you use)'''
