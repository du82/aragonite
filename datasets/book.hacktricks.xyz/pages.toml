Maybe it's also useful to check also Github Code Search. Gitlab Advanced Search: Search across Gitlab projects. Support regexes. SearchCode: Search code in millions of projects. warning When you look for leaks in a repo and run something like git log -p don't forget there might be other branches with other commits containing secrets! tip Learn & practice AWS Hacking:HackTricks Training AWS Red Team Expert (ARTE) Learn & practice GCP Hacking: HackTricks Training GCP Red Team Expert (GRTE) Support HackTricks Check the subscription plans! Join the 💬 Discord group or the telegram group or follow us on Twitter 🐦 @hacktricks_live. Share hacking tricks by submitting PRs to the HackTricks and HackTricks Cloud github repos.'''
