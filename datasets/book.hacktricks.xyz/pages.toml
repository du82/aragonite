stmcyber.com STM Cyber also support cybersecurity open source projects like HackTricks :) RootedCON RootedCON is the most relevant cybersecurity event in Spain and one of the most important in Europe. With the mission of promoting technical knowledge, this congress is a boiling meeting point for technology and cybersecurity professionals in every discipline. RootedCON Intigriti Intigriti is the Europe's #1 ethical hacking and bug bounty platform. Bug bounty tip: sign up for Intigriti, a premium bug bounty platform created by hackers, for hackers! Join us at https://go.intigriti.com/hacktricks today, and start earning bounties up to $100,000! Register - Intigriti Trickest Use Trickest to easily build and automate workflows powered by the world's most advanced community tools. Get Access Today: https://trickest.com/?utm_campaign=hacktrics&utm_medium=banner&utm_source=hacktricks HACKENPROOF Join HackenProof Discord server to communicate with experienced hackers and bug bounty hunters! Hacking Insights: Engage with content that delves into the thrill and challenges of hacking Real-Time Hack News: Keep up-to-date with fast-paced hacking world through real-time news and insights Latest Announcements: Stay informed with the newest bug bounties launching and crucial platform updates Join us on Discord and start collaborating with top hackers today! Pentest-Tools.com - The essential penetration testing toolkit Get a hacker's perspective on your web apps, network, and cloud Find and report critical, exploitable vulnerabilities with real business impact. Use our 20+ custom tools to map the attack surface, find security issues that let you escalate privileges, and use automated exploits to collect essential evidence, turning your hard work into persuasive reports. Penetration testing toolkit, ready to use - Pentest-Tools.com SerpApi SerpApi offers fast and easy real-time APIs to access search engine results. They scrape search engines, handle proxies, solve captchas, and parse all rich structured data for you. A subscription to one of SerpApi’s plans includes access to over 50 different APIs for scraping different search engines, including Google, Bing, Baidu, Yahoo, Yandex, and more. Unlike other providers, SerpApi doesn’t just scrape organic results. SerpApi responses consistently include all ads, inline images and videos, knowledge graphs, and other elements and features present in the search results. Current SerpApi customers include Apple, Shopify, and GrubHub. For more information check out their blog, or try an example in their playground. You can create a free account here. 8kSec Academy – In-Depth Mobile Security Courses Learn the technologies and skills required to perform vulnerability research, penetration testing, and reverse engineering to protect mobile applications and devices. Master iOS and Android security through our on-demand courses and get certified: On-demand Mobile Security Training | 8kSec Academy WebSec WebSec is a professional cybersecurity company based in Amsterdam which helps protecting businesses all over the world against the latest cybersecurity threats by providing offensive-security services with a modern approach. WebSec is an intenational security company with offices in Amsterdam and Wyoming. They offer all-in-one security services which means they do it all; Pentesting, Security Audits, Awareness Trainings, Phishing Campagnes, Code Review, Exploit Development, Security Experts Outsourcing and much more. Another cool thing about WebSec is that unlike the industry average WebSec is very confident in their skills, to such an extent that they guarantee the best quality results, it states on their website "If we can't hack it, You don't pay it!". For more info take a look at their website and blog! In addition to the above WebSec is also a committed supporter of HackTricks. - YouTube License & Disclaimer Check them in: HackTricks Values & FAQ Github Stats tip Learn & practice AWS Hacking:HackTricks Train