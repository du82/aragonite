0 24 24"%3E%3Cpath fill="currentColor" d="M12 17q.425 0 .713-.288T13 16q0-.425-.288-.712T12 15q-.425 0-.712.288T11 16q0 .425.288.713T12 17m0-4q.425 0 .713-.288T13 12V8q0-.425-.288-.712T12 7q-.425 0-.712.288T11 8v4q0 .425.288.713T12 13m-3.35 7H6q-.825 0-1.412-.587T4 18v-2.65L2.075 13.4q-.275-.3-.425-.662T1.5 12q0-.375.15-.737t.425-.663L4 8.65V6q0-.825.588-1.412T6 4h2.65l1.95-1.925q.3-.275.663-.425T12 1.5q.375 0 .738.15t.662.425L15.35 4H18q.825 0 1.413.588T20 6v2.65l1.925 1.95q.275.3.425.663t.15.737q0 .375-.15.738t-.425.662L20 15.35V18q0 .825-.587 1.413T18 20h-2.65l-1.95 1.925q-.3.275-.662.425T12 22.5q-.375 0-.737-.15t-.663-.425zm.85-2l2.5 2.5l2.5-2.5H18v-3.5l2.5-2.5L18 9.5V6h-3.5L12 3.5L9.5 6H6v3.5L3.5 12L6 14.5V18zm2.5-6"%2F%3E%3C%2Fsvg%3E'); } div.codeblock_filename_container + pre { margin-top: 0; } span.codeblock_filename_inner { border-radius: 0.4rem 0.4rem 0 0; padding: 0.6rem 1rem 0.6rem 1rem; font-family: var(--mono-font) !important; font-size: var(--code-font-size); } Phishing Methodology Reading time: 16 minutes tip Learn & practice AWS Hacking:HackTricks Training AWS Red Team Expert (ARTE) Learn & practice GCP Hacking: HackTricks Training GCP Red Team Expert (GRTE) Support HackTricks Check the subscription plans! Join the 💬 Discord group or the telegram group or follow us on Twitter 🐦 @hacktricks_live. Share hacking tricks by submitting PRs to the HackTricks and HackTricks Cloud github repos. Methodology Recon the victim Select the victim domain. Perform some basic web enumeration searching for login portals used by the victim and decide which one you will impersonate. Use some OSINT to find emails. Prepare the environment Buy the domain you are going to use for the phishing assessment Configure the email service related records (SPF, DMARC, DKIM, rDNS) Configure the VPS with gophish Prepare the campaign Prepare the email template Prepare the web page to steal the credentials Launch the campaign! Generate similar domain names or buy a trusted domain Domain Name Variation Techniques Keyword: The domain name contains an important keyword of the original domain (e.g., zelster.com-management.com). hypened subdomain: Change the dot for a hyphen of a subdomain (e.g., www-zelster.com). New TLD: Same domain using a new TLD (e.g., zelster.org) Homoglyph: It replaces a letter in the domain name with letters that look similar (e.g., zelfser.com). Transposition: It swaps two letters within the domain name (e.g., zelsetr.com). Singularization/Pluralization: Adds or removes “s” at the end of the domain name (e.g., zeltsers.com). Omission: It removes one of the letters from the domain name (e.g., zelser.com). Repetition: It repeats one of the letters in the domain name (e.g., zeltsser.com). Replacement: Like homoglyph but less stealthy. It replaces one of the letters in the domain name, perhaps with a letter in proximity of the original letter on the keyboard (e.g, zektser.com). Subdomained: Introduce a dot inside the domain name (e.g., ze.lster.com). Insertion: It inserts a letter into the domain name (e.g., zerltser.com). Missing dot: Append the TLD to the domain name. (e.g., zelstercom.com) Automatic Tools dnstwist urlcrazy Websites https://dnstwist.it/ https://dnstwister.report/ https://www.internetmarketingninjas.com/tools/free-tools/domain-typo-generator/ Bitflipping There is a possibility that one of some bits stored or in communication might get automatically flipped due to various factors like solar flares, cosmic rays, or hardware errors. When this concept is applied to DNS requests, it is possible that the domain received by the DNS server is not the same as the domain initially requested. For example, a single bit modification in the domain "windows.com" can change it to "windnws.com." Attackers may take advantage of this by registering multiple bit-flipping domains that are similar to the victim's domain. Their intention is to redirect legitimate users to their own infrastructure. For more information read https://www.bleepingcomputer.com/news/security/hijacking-traffic-to-microsoft-s-windowscom-with-bitflipping/ Buy a trusted domain You can search in https://www.expireddomains.net/ for a expired domain that you could use. In order to make sure that the expired domain that you are going to buy has already a good SEO you could search how is it categorized in: http://www.fortiguard.com/webfilter https://urlfiltering.paloaltonetworks.com/query/ Discovering Emails https://github.com/laramies/theHarvester (100% free) https://phonebook.cz/ (100% free) https://maildb.io/ https://hunter.io/ https://anymailfinder.com/ In order to discover more valid email addresses or verify the ones you have already discovered you can check if you can brute-force them smtp servers of the victim. Learn how to verify/discover email address here. Moreover, don't forget that if the users use any web portal to access their mails, you can check if it's vulnerable to username brute force, and exploit the vulnerability if possible. Configuring GoPhish Installation You can download it from https://github.com/gophish/gophish/releases/tag/v0.11.0 Download and decompress it inside /opt/gophish and execute /opt/gophish/gophish You will be given a password for the admin user in port 3333 in the output. Therefore, access that port and use those credentials to change the admin password. You may need to tunnel that port to local: bash ssh -L 3333:127.0.0.1:3333 <user>@<ip> Configuration TLS certificate configuration Before this step you should have already bought the domain you are going to use and it must be pointing to the IP of the VPS where you are configuring gophish. bash DOMAIN="<domain>" wget https://dl.eff.org/certbot-auto chmod +x certbot-auto sudo apt install snapd sudo snap install core sudo snap refresh core sudo apt-get remove certbot sudo snap install --classic certbot sudo ln -s /snap/bin/certbot /usr/bin/certbot certbot certonly --standalone -d "$DOMAIN" mkdir /opt/gophish/ssl_keys cp "/etc/letsencrypt/live/$DOMAIN/privkey.pem" /opt/gophish/ssl_keys/key.pem cp "/etc/letsencrypt/live/$DOMAIN/fullchain.pem" /opt/gophish/ssl_keys/key.crt​ Mail configuration Start installing: apt-get install postfix Then add the domain to the following files: /etc/postfix/virtual_domains /etc/postfix/transport /etc/postfix/virtual_regexp Change also the values of the following variables inside /etc/postfix/main.cf myhostname = <domain> mydestination = $myhostname, <domain>, localhost.com, localhost Finally modify the files /etc/hostname and /etc/mailname to your domain name and restart your VPS. Now, create a DNS A record of mail.<domain> pointing to the ip address of the VPS and a DNS MX record pointing to mail.<domain> Now lets test to send an email: bash apt install mailutils echo "This is the body of the email" | mail -s "This is the subject line" test@email.com Gophish configuration Stop the execution of gophish and lets configure it. Modify /opt/gophish/config.json to the following (note the use of https): bash { "admin_server": { "listen_url": "127.0.0.1:3333", "use_tls": true, "cert_path": "gophish_admin.crt", "key_path": "gophish_admin.key" }, "phish_server": { "listen_url": "0.0.0.0:443", "use_tls": true, "cert_path": "/opt/gophish/ssl_keys/key.crt", "key_path": "/opt/gophish/ssl_keys/key.pem" }, "db_name": "sqlite3", "db_path": "gophish.db", "migrations_prefix": "db/db_", "contact_address": "", "logging": { "filename": "", "level": "" } } Configure gophish service In order to create the gophish service so it can be started automatically and managed a service you can create the file /etc/init.d/gophish with the following content: bash #!/bin/bash # /etc/init.d/gophish # initialization file for stop/start of gophish application server # # chkconfig: - 64 36 # description: stops/starts gophish application server # processname:gophish # config:/opt/gophish/config.json # From https://github.com/gophish/gophish/issues/586 # define script variables processName=Gophish process=gophish appDirectory=/opt/gophish logfile=/var/log/gophish/gophish.log errfile=/var/log/gophish/gophish.error start() { echo 'Starting '${processName}'...' cd ${appDirectory} nohup ./$process >>$logfile 2>>$errfile & sleep 1 } stop() { echo 'Stopping '${processName}'...' pid=$(/bin/pidof ${process}) kill ${pid} sleep 1 } status() { pid=$(/bin/pidof ${process}) if [["$pid" != ""| "$pid" != "" ]]; then echo ${processName}' is running...' else echo ${processName}' is not running...' fi } case $1 in start|stop|status) "$1" ;; esac Finish configuring the service and checking it doing: bash mkdir /var/log/gophish chmod +x /etc/init.d/gophish update-rc.d gophish defaults #Check the service service gophish start service gophish status ss -l | grep "3333\|443" service gophish stop Configuring mail server and domain Wait & be legit The older a domain is the less probable it's going to be caught as spam. Then you should wait as much time as possible (at least 1week) before the phishing assessment. moreover, if you put a page about a reputational sector the reputation obtained will be better. Note that even if you have to wait a week you can finish configuring everything now. Configure Reverse DNS (rDNS) record Set a rDNS (PTR) record that resolves the IP address of the VPS to the domain name. Sender Policy Framework (SPF) Record You must configure a SPF record for the new domain. If you don't know what is a SPF record read this page. You can use https://www.spfwizard.net/ to generate your SPF policy (use the IP of the VPS machine) This is the content that must be set inside a TXT record inside the domain: bash v=spf1 mx a ip4:ip.ip.ip.ip ?all Domain-based Message Authentication, Reporting & Conformance (DMARC) Record You must configure a DMARC record for the new domain. If you don't know what is a DMARC record read this page. You have to create a new DNS TXT record pointing the hostname _dmarc.<domain> with the following content: bash v=DMARC1; p=none DomainKeys Identified Mail (DKIM) You must configure a DKIM for the new domain. If you don't know what is a DMARC record read this page. This tutorial is based on: https://www.digitalocean.com/community/tutorials/how-to-install-and-configure-dkim-with-postfix-on-debian-wheezy note You need to concatenate both B64 values that the DKIM key generates: v=DKIM1; h=sha256; k=rsa; p=MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA0wPibdqPtzYk81njjQCrChIcHzxOp8a1wjbsoNtka2X9QXCZs+iXkvw++QsWDtdYu3q0Ofnr0Yd/TmG/Y2bBGoEgeE+YTUG2aEgw8Xx42NLJq2D1pB2lRQPW4IxefROnXu5HfKSm7dyzML1gZ1U0pR5X4IZCH0wOPhIq326QjxJZm79E1nTh3xj" "Y9N/Dt3+fVnIbMupzXE216TdFuifKM6Tl6O/axNsbswMS1TH812euno8xRpsdXJzFlB9q3VbMkVWig4P538mHolGzudEBg563vv66U8D7uuzGYxYT4WS8NVm3QBMg0QKPWZaKp+bADLkOSB9J2nUpk4Aj9KB5swIDAQAB Test your email configuration score You can do that using https://www.mail-tester.com/ Just access the page and send an email to the address they give you: bash echo "This is the body of the email" | mail -s "This is the subject line" test-iimosa79z@srv1.mail-tester.com You ca'''
