full_description = "At the aparthotel, the units are fitted with air conditioning, a seating area, a flat-screen TV with streaming services, a kitchen, a dining area, a safety deposit box and a private bathroom with a walk-in shower, a hair dryer and free toiletries. A dishwasher, an oven and microwave are also featured, as well as a coffee machine and a kettle. At the aparthotel, each unit is equipped with bed linen and towels. Boasting air-conditioned accommodation with a rooftop pool, ONE More Sandy Day - 2BR 2BA Beach Condo, Sleeps 6 is situated in Myrtle Beach. This beachfront property offers access to tennis at the tennis court, free private parking and free WiFi. The aparthotel has a hot tub, sun terrace and picnic area, and guests can grab a bite to eat in the restaurant. 4.1 km from Carolina Opry Theater in Myrtle Beach, 2BR/2BA Condo at Arcadian Dunes Building 10-238 provides accommodation with access to a hot tub, hammam and steam room. Complimentary WiFi is featured throughout the property and private parking is available on site. The aparthotel features an outdoor swimming pool with a fence, as well as a sauna and an ATM. The spacious aparthotel comes with 1 bedroom, 2 bathrooms, bed linen, towels, a flat-screen TV with cable channels, a dining area, a fully equipped kitchen, and a terrace with river views. Guests can take in the ambience of the surroundings from an outdoor dining area. The aparthotel features 2 bedrooms, 1 bathroom, bed linen, towels, a flat-screen TV, a fully equipped kitchen, and a balcony with sea views. The property offers pool views.The Market Common is 15 km from the aparthotel, while Myrtle Beach Boardwalk is 18 km from the property. Myrtle Beach International Airport is 14 km away. Set in Eilat, oR-Ya Suite offers a balcony with sea and pool views, as well as a year-round outdoor pool, public bath and open-air bath. Situated on the beachfront, this property features a garden. Offering free WiFi throughout the property, the non-smoking aparthotel has a fitness room."
