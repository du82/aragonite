title = ""
description = "The only way to leave a review is to first make a booking. That's how we know our reviews come from real guests who have stayed at the property."
full_description = "There’s nothing quite like visiting a new city at Christmastime – from bustling shopping centres to feasts of regional cuisine. Cities across Asia celebrate with their own unique blend of Christmas tradition and local flavour to create magical experiences for all. Whether you’re looking for a winter wonderland or a warm-weather escape, you’ll find plenty of reasons to be merry with a Christmas trip to Asia. With a mild winter and buzzy atmosphere, Hong Kong is a perfect place to spend the festive season. The city’s WinterFest celebration lights up the harbour with dazzling choreographed light displays. If you want to get out of the city, then make some lasting memories with a visit to Hong Kong Disneyland. There’s plenty to explore for adults and kids alike, including the opening of World of Frozen, the park’s newest land which brings hit films to life in a Nordic-inspired winter wonderland. Fans of Frozen will love meeting Queen Anna and Elsa, exploring Arendelle and three new attractions. Stay in the middle of the magic at Disney's Hollywood Hotel. While Tokyo is known for its neon lights year-round, the Japanese capital takes on an especially magical glow around Christmastime. Catch ‘Illuminations’ – a collection of light displays that feature music and moving elements – all around town from November to late January. A typical Japanese Christmas includes a meal of KFC fried chicken and strawberry sponge cake. Or for a taste of a European-style Christmas, be sure to check out one of Tokyo’s festive markets. The German-themed market in Meiji-jingu is an idyllic stop for mulled wine and handmade ornaments. For stunning city views and a central location, stay at THE BLOSSOM HIBIYA. Festive activities, world-class Christmas shopping and some of the most delicious food in the world can all be found in Singapore. Don’t miss the Christmas Wonderland at Gardens by the Bay, a fairytale-esque annual event with carnival games, themed rides and a market for gifts."
