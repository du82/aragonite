title = "Google"
full_description = 'The Google Terms of Services located at http://www.google.com/accounts/TOS apply to Google Books. For digital content you purchase through the Google Books service (the “Service”), you agree to be bound by the Google Terms of Services as well as these additional terms. The Google Terms of Services and these additional terms shall be the “Terms of Service.” Google may change the Terms of Service from time to time and post any modified terms at http://www.google.com/googlebooks/tos.html. You understand and agree that if you use the Service after the date on which these terms have changed, Google will treat your use as acceptance of the updated terms. The Google Books Digital Content Store. The Google Books Digital Content store and our distribution partners enable you, subject to the restrictions set forth herein, to view, download, display and use on your devices, including but not limited to mobile devices, e-readers, and personal computers (each a “Device”) a variety of digitized electronic content, such as books, journals and other periodicals, and other digital content, as determined by Google ("Digital Content"). Google may change the entities from which you download Digital Content and through which your Google Books Digital Content transactions will be processed from time to time without notice. Use of Digital Content. Following payment of the applicable fees for an item of Digital Content, for as long as Google and the applicable copyright holder have rights to provide you that Digital Content, Google gives you the non-exclusive right to download, subject to the restrictions set forth herein, copies of the applicable Digital Content to your Devices, and to view, use, and display such Digital Content an unlimited number of times on your Devices or as otherwise authorized by Google as part of the Service for your personal, non-commercial use. If Google or the applicable copyright holder loses the rights to provide you any Digital Content, Google will cease serving such Digital Content to you and you may lose the ability to use such Digital Content. For certain Digital Content, Google may be acting as an agent of the copyright holder (and its agents) in providing such Digital Content to you under the Terms of Service. You acknowledge that such copyright holder (and its agents) shall be the seller(s) of such Digital Content to you under the Terms of Service. Select, copy and paste functions may be available for some Digital Content, and you must use these features within the prescribed limits and only for personal non-commercial purposes.'
