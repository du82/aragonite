title = "Google"
full_description = 'Thanks for using the Google eBooks Digital Content store (the “Service”), which allows you to view, download, display and use a variety of digitised electronic content, such as books, journals and other periodicals, and other digital content ("Google Digital Content"). You can buy Google Digital Content from a website owned or operated by Google. When you buy Google Digital Content this way, you will either buy Google Digital Content: You can also buy Google Digital Content from one of our third party retailer partners (a “Third Party Seller”). When you buy Google Digital Content in this way, you will either buy Google Digital Content: Each time that you purchase Google Digital Content, you enter into a contract based on these Terms of Service with: Google in relation to the use of the Service and (in the case of a Direct Sale) the purchase of that Google Digital Content; and also (in the case of Agency Sales and Sub-Agency Sales) with the Publisher of the Google Digital Content you have purchased.'
