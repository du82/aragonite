["https://books.google.co.uk/intl/en/googlebooks/about.html"]
title = "About Google Books – Google Books"
full_description = '''Book Search works just like web search. Try a search on Google Books or on Google.com. When we find a book with content that contains a match for your search terms, we'll link to it in your search results. If the book is out of copyright, or the publisher has given us permission, you'll be able to see a preview of the book, and in some cases the entire text. If it's in the public domain, you're free to download a PDF copy. If you find a book you like, click on the "Buy this book" and "Borrow this book" links to see where you can buy or borrow the print book. You can now also buy the ebook from the Google Play Store. We've created reference pages for every book so you can quickly find all kinds of relevant information: book reviews, web references, maps and more. Currently, we are connecting readers with books in two ways: the Partner Program and the Library Project.'''
