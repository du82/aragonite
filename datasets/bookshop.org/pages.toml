full_description = '''The instant #1 New York Times, Wall Street Journal, and USA Today bestseller, now available in paperback with bonus content! "I was just enraptured by the lineage and the story of this modern African-American family. I've never read anything quite like it." — Oprah Winfrey From Jesmyn Ward—the two-time National Book Award winner,—comes a haunting masterpiece, sure to be an instant classic, about an enslaved girl in the years before the Civil War. The award-winning author of Magical Negro traces the difficulty and beauty of existing as a Black woman through American history, from the foundational trauma of the slave trade all the way up to Serena Williams and the aftermath of Hurricane Katrina. During Black History Month and always, we encourage you to visit a Black-owned bookstore in person. Black-owned bookstores are essential community hubs that foster culture, preserve history, and nourish a love of reading. If you can’t visit a store in person, use our store map below to support a Black-owned bookstore on Bookshop.org.” AboutSupport / HelpBecome an AffiliateGift CardsBookshop For AuthorsBookshop For BookstoresIndiebound Link Changeover FAQContactReturns and Refund Policy'''
