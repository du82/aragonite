["https://bookshop.org/info/privacy-notice"]
title = "Privacy Notice"
description = "Bookshop.org Privacy Policy Notice"
full_description = "Last Updated: 1/28/25Bookshop.org, including all of its features and content and related or commonly-owned or controlled websites(“Website”), is a service made available by Bookshop, Inc. (“Bookshop.org”), a Virginia benefit corporation that provides independently owned booksellers, industry partners, and conscious consumers with a direct-to-consumer e-commerce solution competitive to that of major retailers. Quick Guide to Contents1. How This Privacy Policy Applies2. What Information Bookshop.org Collects and Receives3. How Bookshop.org Uses the Information It Collects4. How Bookshop.org Shares the Information It Collects5. Tracking and Other Technologies6. Your Rights7. Links to Other Websites and Services8. Data Retention9. Cross-Border Data Transfers10. Children’s Privacy11. Security12. Updates to this Privacy Policy13. Contact Us1. How This Privacy Policy AppliesBy using the Website and any SMS Service you opt into to receive messages via text (“SMS Service”), you are accepting the practices described in this Privacy Policy (including new versions of this Privacy Policy when and as they go into effect) and Bookshop.org’s Terms of Use (“Terms of Use”), which governs this Privacy Policy applies to those persons or entities who (i) purchase products on the Website or the Bookshop.org ebook apps, (ii) receive communications fromBookshop.org, (iii) sell products on the Website through Bookshop.org’s Platform Seller Program(each, a “Platform Seller”), and (vi) participate in Bookshop.org’s Affiliate Program (each, an “Affiliate”)(collectively, “Users,” and each, a “User”, “you” or “your”). Capitalized words not defined in this Privacy Policy are defined in the Terms of Use. In the event of a conflict between this Privacy Policy and the terms and conditions applicable to the Platform Seller Program and the Affiliate Program, respectively, such terms and conditions applicable to the Platform Seller Program and the Affiliate Program shall apply respectively. This Privacy Policy describes the information Bookshop.org collects from you through the Website and SMS Service, how Bookshop.org uses that information, and its legal basis for doing so. It also covers whether and how that information may be shared and your rights and choices regarding such information. For residents of the European Economic Area, Bookshop.org is the data controller responsible for your information. 2. What Information Bookshop.org Collects and ReceivesIn order for you to use the Website or the SMS Service, Bookshop.org needs to collect and process certain information, which depending on how you use the Website, may include the following. A. Information You Provide(i) Bookshop.org collects information you provide by using the Website, such as when:• Platform Sellers post Content (as such terms are defined in the Terms of Use). • Users complete forms on or through the Website or subscribe to our newsletters or emails. The information you provide may include your name, email address, mailing address, or telephone number. • Users make a request or transaction through the Website. Bookshop.org and Platform Sellers offer products for sale through the Website, and Bookshop.org and its payment processor will need to collect and use information such as your name, mailing address, billing address, email address, telephone number, and payment card information to process these requests and transactions. • Users communicate with Bookshop.org, such as when you request support, submit comments or questions, or report a problem to Bookshop.org. (ii) Through the use of the SMS Service, Bookshop.org will receive the following personal information:• Your mobile phone number when you send a text message to us.• Any user or screen name you select in connection with the SMS Service.• The text of messages that you send to other users of the SMS Service.• Any comments or feedback regarding the SMS Service or other personal information you send to Bookshop.org.B. Information Automatically CollectedBookshop.org also automatically or passively collects information that relates to your usage of the Website or that is necessary for the proper functioning or improvement of the Website, including:• Times and dates and the extent of your usage of the Website.• Time zone, language, screen resolution, and other usage preferences you select when using the Website.• Device keyboard settings.• Usage history such as areas and pages within the Website that you access or use and/or which buttons on the Website you click on. • The search terms you entered into a search engine that may have led you to the Website.• The Internet service provider (ISP) or mobile platform you use.• Other device and Website access information such as your browser type, operating system, Internet Protocol (IP) address, referring/exit pages, and other unique device identifiers. Bookshop.org also collects and maintain aggregated, anonymized, or pseudonymized information to protect the safety and security of the Website, improve the Website, or comply with its legal obligations. You may decline to provide Bookshop.org with some or all of your information. However, doing so will limit your ability to use the Website. 3. How Bookshop.org Uses the Information It Collects(i) Bookshop.org uses the information it collects from and about you for the following purposes:• To enable Bookshop.org to provide you and other Users with the Website, and to improve, protect, and promote the Website and services; • To address inquiries and respond to customer service requests, questions, and comments;• To contact you with newsletters, offers, promotions, and other product specials or to customize your experience on the Website; • To track and analyze use of the Website and Bookshop.org’s services, such as to identify trends, conduct data analysis, and determine the effectiveness of marketing and promotion efforts, and other service offerings, so that Bookshop.org can improve its performance and provide Users with the best experience possible; • To maintain security and to enforce the Terms of Use and comply with applicable law; and • For other purposes that Bookshop.org believes are necessary to protect its rights and the rights of others, or as otherwise described to you at the time of collection. (ii) With respect to the SMS Service, Bookshop.org uses personal information to(a) provide you with the SMS Service, (b) process and respond to inquiries, (c)improve the SMS Service, (d) if necessary, contact you with important announcements, or messages, (e) conduct research, and (f) provide anonymous reporting for internal and external clients and partners. Each message that you send through the SMS Service is stored on our servers. We retain these messages on our servers. Bookshop.org utilizes servers owned by third parties.4. How Bookshop.org Shares the Information It CollectsBookshop.org may share the information it collects from and about you in the following ways:• Service Providers: Bookshop.org may share your information with certain service providers to help provide, improve, promote, or protect the Website, process payments, or manage ads on other websites. Bookshop.org requires those service providers use your information only for the purposes Bookshop.org has authorized and protect your personal information at least to the same standards as Bookshop.org does. • Affiliates and Platform Sellers: Bookshop.org may share your contact information with an Affiliate if you visited Bookshop.org’s website via that Affiliate’s referral link, or you shopped from the Affiliate’s book lists or a Platform Seller’s page on our Website. We will only share your information withPlatform Seller from whom you purchase. • Legal Matters; Safety: Bookshop.org reserves the right to disclose information Bookshop.org collects from or about you when doing so is reasonably necessary to comply with the law or law enforcement, to prevent fraud or abuse, or to protect the legal rights, property, or the safety of Bookshop.org, Users, or others. • Sale or Transfer of Assets: In the event that Bookshop.org is acquired by or merged with a third-party entity, or sells all or substantially all of its assets, Bookshop.org reserves the right, in any of these circumstances, to transfer or assign the information it has collected from and about Users aspart of such merger, acquisition, sale, or other change of control. In the unlikely event of bankruptcy, insolvency, reorganization, receivership, or assignment for the benefit of creditors, or the application of laws or equitable principles affecting creditors’ rights generally, Bookshop.org may not be able to control how your personal information is treated, transferred, or used. • Aggregate or Anonymous Information: Bookshop.org may also share information that is aggregated or anonymized in a way that it does not directly identify you. • Publicly Available Information: When Platform Sellers post Content, all Users will be able to view such Content. Platform Sellers should not post any information, including personal information, that they do not want to be publicly accessible. The above excludes the sharing of any personal information collected by the SMS Service, which shall not be shared with any third parties.5. Tracking and Other TechnologiesA. Types of Cookies Bookshop.org UtilizesBookshop.org uses the following types of cookies and other technologies:• User Information: Bookshop.org will store a logged-in User’s information to remember the customer information you gave us so that you do not have to re-enter it when making additional purchases. • Shopping Cart Contents: Bookshop.org also uses cookies to keep track of items you put into your shopping cart including when you have abandoned your cart and this information is used to determine when to send cart reminder messages via the SMS Service• Security: Bookshop.org secures the Website with cookies that facilitate security features and allow Bookshop.org to detect activity that might violate the Terms of Use, such as unauthorized access or activity. • Localization: Some cookies help Bookshop.org provide localized experiences, such as displaying the Website in the local language. • Site Features and Services: Certain cookies provide greater functionality to the Website and help Bookshop.org deliver our products and services. • Performance: Bookshop.org uses performance cookies to help route traffic between servers and understand how the Website is performing so Bookshop.org can provide Users with the best experience possible. • Analytics and Research: Cookies and other technologies also help Bookshop.org to understand, improve, and research features and content on the Website. These types of cookies include Google Analytics, which you can opt out of at https://tools.google.com/dlpage/gaoptout. B. Limiting or Blocking Cookies and Our Do Not Track PolicyYour browser may give you the ability to control cookies, which may depend on the type of cookie, and browsers can be set to reject browser cookies. However, blocking or deleting cookies may prevent you from using most of the Website. Some browsers have “do not track” features that allow you to tell a website not to track you. These features are not all uniform. If you block cookies, certain features on the Website may not work. If you block or reject cookies, not all of the tracking described in this Privacy Policy will necessarily stop. Note that certain options you select are specific to certain browsers and devices. Our system may not recognize Do Not Track requests or headers from some or all browsers. C. Web BeaconsThe Website may contain electronic images known as web beacons (sometimes called single-pixel gifs) and are used along with cookies to compile aggregated statistics to analyze how the Website is used. Bookshop.org uses third parties to gather information about how you and others use the Website. For example, Bookshop.org will know how many Users access a specific page and what Website Content they clicked on. Bookshop.org uses this aggregated information to understand and optimize how the Website is used. D. Social Media Plug-InsBookshop.org may use certain social media plug-ins (e.g., Facebook, X, Instagram, Threads, etc.) to allow you to communicate with such services and interact (e.g., “like” or “comment”) with various Website content. The social media plug-in will enable a direct communication between your end user device and the servers of the applicable social media provider, allowing the applicable social media provider to communicate with you and collect information about you browsing the Website. If you decide to use a social media plug-in, Bookshop.org may transfer your information to the social media provider, whether or not you have a registered user account with the applicable social media provider. Bookshop.org is not responsible for the content and the data collection on respective third-party websites or apps and that Bookshop.org neither controls the extent of personally information collected by the respective plug-in provider nor knows the processing’s purpose or the period your personally information will be retained. For further information as to how and for what purpose certain social network providers process your data, please see the relevant privacy policies of the applicable social media provider. 6. Your RightsA. Information for California ResidentsCalifornia residents may also take advantage of the following rights under the California Consumer Privacy Act (CCPA) as amended by the California Privacy Rights Act (CPRA). Subject to certain limitations, the CCPA and CPRA provide you with the following rights: The Right to Know. You may request that we disclose to you the categories of personal information we have collected, used, disclosed, or “sold” within the meaning of the CCPA, including: ‍· Specific pieces of information that we have collected about you· Categories of personal information we have collected about you· Categories of sources from which the personal information is collected· Categories of personal information about you that We have sold, shared, or disclosed for a business purpose· Categories of third parties to whom the personal information was sold, shared or disclosed for a business purpose· The business or commercial purpose for collecting, selling, or sharing personal information (collectively, the “Right to Know”)The Right to Delete. You have the right to request that we delete personal information about you that we have collected from you (the “Right to Delete”). The Right to Correct. You have the right to request that we correct any incorrect personal information that we collect or retain about you, subject to certain exceptions. Exercising Your Rights. To exercise your Right to Know, Right to Delete, or Right to Correct contact us at [email protected] (800) 484-6309Right to Opt Out. You have the right to direct us to not sell or share your p"
