["https://bookshop.org/p/books/black-in-blues-imani-perry/20908196"]
title = "Black in Blues a book by Imani Perry - Bookshop.org US"
description = "How a Color Tells the Story of My People"
full_description = '''{"@context":"https://schema.org","@type":["Product","Book"],"sku":"9780062977397","isbn":"9780062977397","gtin14":"09780062977397","image":["https://images-us.bookshop.org/ingram/9780062977397.jpg?v=enc-v1"],"name":"Black in Blues","description":"<p><strong>NAMED A MOST ANTICIPATED BOOK BY: <em>Time</em>, <em>USA Today</em>, <em>People</em>, <em>AARP, Harper's Bazaar</em>, Today.com, BookRiot, Bustle, LitHub, BookPage, The Millions, <em>Ms., </em>Our Culture, Electric Literature, <em>W, </em>and <em>Vulture</em></strong></p><p><strong>A surprising and beautiful meditation on the color blue&#8212;and its fascinating role in Black history and culture&#8212;from National Book Award winner Imani Perry</strong></p><p>Throughout history, the concept of Blackness has been remarkably intertwined with another color: blue. In daily life, it is evoked in countless ways. Blue skies and blue water offer hope for that which lies beyond the current conditions. But blue is also the color of deep melancholy and heartache, echoing Louis Armstrong&#8217;s question, &#8220;What did I do to be so Black and blue?&#8221; In this book, celebrated author Imani Perry uses the world&#8217;s favorite color as a springboard for a riveting emotional, cultural, and spiritual journey&#8212;an examination of race and Blackness that transcends politics or ideology.</p><p>Perry traces both blue and Blackness from their earliest roots to their many embodiments of contemporary culture, drawing deeply from her own life as well as art and history: The dyed indigo cloths of West Africa that were traded for human life in the 16<sup>th </sup>century. The mixture of awe and aversion in the old-fashioned characterization of dark-skinned people as &#8220;Blue Black.&#8221; The fundamentally American art form of blues music, sitting at the crossroads of pain and pleasure. The blue flowers Perry plants to honor a loved one gone too soon.</p><p>Poignant, spellbinding, and utterly original, <em>Black in Blues </em>is a brilliant new work that could only have come from the mind of one of our greatest writers and thinkers. Attuned to the harrowing and the sublime aspects of the human experience, it is every bit as vivid, rich, and striking as blue itself.</p>","brand":{"@type":"Brand","name":"Ecco"},"publisher":{"@type":"Thing","name":"Ecco"},"author":[{"@type":"Person","name":"Imani Perry"}],"bookFormat":"Hardback","datePublished":"2025-01-28","numberOfPages":256,"size":"8.3 X 5.5 X 0.8 inches | 11.8 pounds","offers":{"@type":"Offer","url":"https://bookshop.org/p/books/black-in-blues-imani-perry/20908196?ean=9780062977397&next=t","itemCondition":"https://schema.org/NewCondition","availability":"https://schema.org/InStock","price":26.96,"priceCurrency":"usd","shippingDetails":{"@type":"OfferShippingDetails","shippingRate":{"@type":"MonetaryAmount","value":3.99,"currency":"USD"},"shippingDestination":{"@type":"DefinedRegion","addressCountry":"US"},"deliveryTime":{"@type":"ShippingDeliveryTime","handlingTime":{"@type":"QuantitativeValue","minValue":0,"maxValue":1,"unitCode":"DAY"},"transitTime":{"@type":"QuantitativeValue","minValue":3,"maxValue":5,"unitCode":"DAY"}}},"hasMerchantReturnPolicy":{"@type":"MerchantReturnPolicy","applicableCountry":"US","returnPolicyCategory":"https://schema.org/MerchantReturnFiniteReturnWindow","merchantReturnDays":30,"returnMethod":"https://schema.org/ReturnByMail","returnShippingFeesAmount":{"@type":"MonetaryAmount","value":3.99,"currency":"USD"}}}}Black in BluesHow a Color Tells the Story of My PeopleImani Perry (Author)Hardback $28.99$26.96AvailablePaperback Large Print$33.99$31.61AvailableCD-Audio $45.99$42.77BackorderHardback $28.99$26.96AvailableAdd to WishlistShop Other Formats4.9/5.021,000+ ReviewsBookshop.org has the highest-rated customer service of any bookstore in the worldDescriptionNAMED A MOST ANTICIPATED BOOK BY: Time, USA Today, People, AARP, Harper's Bazaar, Today.com, BookRiot, Bustle, LitHub, BookPage, The Millions, Ms., Our Culture, Electric Literature, W, and VultureA surprising and beautiful meditation on the color blue—and its fascinating role in Black history and culture—from National Book Award winner Imani PerryThroughout history, the concept of Blackness has been remarkably intertwined with another color: blue. In daily life, it is evoked in countless ways. Blue skies and blue water offer hope for that which lies beyond the current conditions. But blue is also the color of deep melancholy and heartache, echoing Louis Armstrong’s question, “What did I do to be so Black and blue?” In this book, celebrated author Imani Perry uses the world’s favorite color as a springboard for a riveting emotional, cultural, and spiritual journey—an examination of race and Blackness that transcends politics or ideology.Perry traces both blue and Blackness from their earliest roots to their many embodiments of contemporary culture, drawing deeply from her own life as well as art and history: The dyed indigo cloths of West Africa that were traded for human life in the 16th century. The mixture of awe and aversion in the old-fashioned characterization of dark-skinned people as “Blue Black.” The fundamentally American art form of blues music, sitting at the crossroads of pain and pleasure. The blue flowers Perry plants to honor a loved one gone too soon.Poignant, spellbinding, and utterly original, Black in Blues is a brilliant new work that could only have come from the mind of one of our greatest writers and thinkers. Attuned to the harrowing and the sublime aspects of the human experience, it is every bit as vivid, rich, and striking as blue itself.Product DetailsPublisherEccoPublish DateJanuary 28, 2025Pages256LanguageEnglishTypeHardbackEAN/UPC9780062977397Dimensions8.3 X 5.5 X 0.8 inches | 11.8 poundsBISAC Categories: History, Politics, Society & Current Affairs, Arts & HobbiesProduct DetailsPublisherEccoPublish DateJanuary 28, 2025Pages256LanguageEnglishTypeHardbackEAN/UPC9780062977397Dimensions8.3 X 5.5 X 0.8 inches | 11.8 poundsBISAC Categories: History, Politics, Society & Current Affairs, Arts & HobbiesAbout the AuthorImani Perry is the National Book Award–winning author of South to America, as well as seven other books of nonfiction. She is the Henry A. Morss Jr. and Elisabeth W. Morss Professor of Studies of Women, Gender, and Sexuality and of African and African American Studies at Harvard University, and is a 2023 MacArthur Fellow. Perry lives between Philadelphia and Cambridge with her two sons.Reviews“This prismatic volume finds the National Book Award-winning Princeton professor meditating on skin color and the indigo trade, Louis Armstrong’s music and Toni Morrison’s writing, in short, lyrical chapters.” — New York Times“An affective investigation into the many roles of blueness in Black life. . . it is full of archival gems – but it is also a lyrical [work]. . . . What unites its disparate contents is a mood, which is just as valuable as an argument. It is a contrapuntal document, musical and moving, and no less rich for its tumbling abundance.” — Washington Post “As Imani Perry illuminates in a new book that swirls and flicks like an actual marble, [blue is] inextricable from the Black race. . . . Reading Black in Blues is like putting on a pair of those special Kodak 3-D viewfinders that make objects and issues leap suddenly into focus. . . . Its chapters are tide pools: quite short, but deep and teeming. . . . It will have you looking afresh even at your corner mailbox.” — New York Times Book Review“One of those books that slips the boundaries . . . . ‘Ask the right questions,’ [Perry] insists, ‘and you’ll move toward virtue and truth.’ Words to live by, especially in a nation where a large swatch of the population seems intent on disavowing the better angels of our nature.” — Los Angeles Times“Touching on a range of historical, artistic, musical, and literary references—from the color’s significance in Yoruba cosmology to the blue candles used in hoodoo rituals to the ‘tremor’ of the “blue note’—Perry illuminates how the color has been variously associated with mourning, spiritual strength, and forces of freedom and oppression.” — New Yorker, "Briefly Noted"“Revelatory. . . .[Black in Blues] is attuned to the high, the low, and the blue notes that compose Blackness—and we would all do well to listen.” — Omari Weekes, Atlantic“It is clear from reading Imani Perry’s Black in Blues: How a Color Tells the Story of My People why she is adept at chronicling the history of the Black diaspora: She weaves stories like a village griot or a grandparent sitting on the porch recalling the past. . . . From Africans dressed in blue as if it were ceremonial garb to a tiny house in Alabama and a cloth of remembrance for a loved one, black and blue are brilliant and so is Black in Blues.” — Christian Science Monitor“Vast, multifaceted and enchanting. . . . Black in Blues also gave me a renewed sense of direction, a clarity of purpose. Here it is: Hold fast to beauty. It has everything you need. It has everything we need.” — Minnesota Star Tribune“A meditative and healing introspection on Black history presented through a fresh and innovative lens. . . . Innovative, melancholic, and expansive, Black in Blues achieves its goal to bring Black history to life.” — Atlanta Journal Constitution “Scholar Imani Perry is a brilliant storyteller and cultural critic. 'Black in Blues' offers a historical analysis of Black identity through the lens of color. She examines how the color blue beautifully reflects the Black lived experience in America.” — Glory Edim, TODAY.com“In [Perry's] writing, the familiar transforms into the unfamiliar, or the supposedly quotidian gains new depth, and because she commits to the reshaping of the familiar, her work insists upon you, the reader, joining in on that commitment. This strength is at its height in Black in Blues, an exploration not necessarily of the color blue itself, but the color blue as it appears in concert and contrast with black (black people, black history, the color black). . . . Black in Blues . . . is the best Perry has ever been, for me, on a sentence level.” — Hanif Abdurraqib, 4Columns“Each impressionistic chapter carries us into a distinctive, colorful world, and together, the sections weave a cultural richness that no traditional history could achieve. While Perry is a renowned Harvard academic who grounds her explorations in scholarship, here, she feels more like our private guide for a vast cultural voyage, her voice beautifully echoing those of her muses Toni Morrison and Zora Neale Hurston. By composing a story that unifies many generations of Black history and is experienced through a single color, Perry herself becomes a master blues artist.” — Oprah Daily“Perry asks us to see Black people’s relationship to the color blue in its spiritual and material specialness, and though blue carries immense tragedy inside of it, neither black nor blue is wholly defined by the cruelty that links them. Like a blues song, the beauty is found when you tune into its complex frequencies on the backbeat.” — New Republic“Perry writes to harness a complex story of shifting blues, offering us an open-ended gift.” — Chloe Bass, Hyperallergic“[Perry] exemplifies the best of interdisciplinary analysis and storytelling, weaving together the threads of history and culture to point out common threads and trends that people may never have noticed otherwise. As a historian, she writes in a conversational tone about the atrocities that are often left out of high school textbooks. As a cultural critic, she’s insightful and artfully intentional about the details she draws readers to.” — The Advocate“Suggestion is the modus operandi of this brilliant book. The alternative – conclusions that operate as a kind of curfew on ideas – feels immeasurably worse. That’s not the case here: the blue notes and bones sing on even after closing the book.” — Frieze“National Book Award winner Perry offers surprising revelations about the connection between the color blue and Black identity as she explores myth and literature, art and music, folklore and film. . . . An innovative cultural history.” — Kirkus Reviews (starred review)“An impressionistic cultural history of the African diaspora through its connections to the color blue, from the Congo to Haiti, Jamaica, and the American South, in music, dance, folklore, art, and literature. . . . Packed with cultural references to Nina Simone, Zora Neale Hurston, Miles Davis, and Picasso’s African-inspired Blue Period, this is a fascinating and creative work of popular anthropology . . . Original and affecting.” — Booklist (starred review)“A lyrical meditation on ‘the mystery of blue and its alchemy in the lives of Black folk.’ . . . In direct and intimate prose, Perry synthesizes an impressive range of research into a sinewy, pulsing narrative that positions the past as an active, living force in the present. Readers will be swept up." — Publishers Weekly (starred review)“Imani Perry's work is brilliant and lyrical as ever! How clearly she assesses the history of Black and Blue, knitting them together with language both precise and haunting. This book is a great gift, in that it allowed me to see the world anew with Perry's clear-eyed insight. How Perry allows me to understand my Blue better, too!” — Jesmyn Ward, author of Let Us Descend and Sing, Unburied, Sing“Black in Blues is a stunningly original journey in search of the historical origins of the very soul of African American life and culture. Along the way, Perry shows, with telling detail and in engaging prose, how ‘The Blues’ became Black, and how Black people became ‘Blues People.’” — Henry Louis Gates, Jr.“With Black in Blues, Imani Perry establishes herself as the most important interpreter of Black life in our time. With intellectual skill, an artist’s eye, and the beauty of her pen, she powerfully tells the story of our people through the color blue. This is an extraordinary book.” — Eddie S. Glaude, Jr., author of Begin Again and We Are the Leaders“Imani Perry's Black in Blues is a masterful convergence of literature, history, and culture—where color itself becomes the field for reflection and revelation. The sheer span of Perry’s thinking, like the sweep of a great sky, stirs the most breathtaking of elusive emotions: awe.” — Evan Osnos, author of Wildland and Age of AmbitionEarn by promoting booksEarn money by sharing your favorite books through our Affiliate program.Become an affiliateBookshop.org Best Sellers of the WeekBookshop.org View All (25)'''
