description = "Check out The ABCs of Black History - <b>In this <i>New York Times </i>Bestseller, B is for Beautiful, Brave, and Bright! And for a Book that takes a Bold journey through the alphabet of Black history and culture. &#8203;</b> <p/> Letter by letter, <i><b>The ABCs of Black History </b></i>celebrates a story that spans continents and centuries, triumph and heartbreak, creativity and joy. <p/> It's a story of big ideas--P is for Power, S is for Science and Soul. Of significant moments--G is for Great Migration. Of iconic figures--H is for Zora Neale Hurston, X is for Malcom X. It's an ABC book like no other, and a story of hope and love. <p/> In addition to rhyming text, the book includes back matter with information on the events, places, and people mentioned in the poem, from Mae Jemison to W. E. B. Du Bois, Fannie Lou Hamer to Sam Cooke, and the Little Rock Nine to DJ Kool Herc. <p/> by Rio Cortez and Lauren Semmer on Bookshop.org US!"
