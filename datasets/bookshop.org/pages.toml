["https://bookshop.org/info/about-us"]
title = "About"
full_description = '''Bookshop.org works to connect readers with independent booksellers all over the world. ‍We believe local bookstores are essential community hubs that foster culture, curiosity, and a love of reading, and we're committed to helping them thrive. Every purchase on the site financially supports independent bookstores. Our platform gives independent bookstores tools to compete online and financial support to help them maintain their presence in local communities. Visit our find a local bookstore page and select the bookstore you'd like to support. If you don't choose a store, you'll contribute to our profit sharing pool that helps all our stores. Your order will be filled directly by our distributor, and the full profit from your purchase will be sent to bookstore you selected. You'll receive a confirmation and tracking number when your order is placed, and our in-house customer service team will be standing by if you have issues or returns. We donate profits directly to bookstores—both the funds from direct purchases and our profit pool that's split between our 2,000+ stores. “This funding came at the most perfect time when I prayed I would have rent for next month and payroll and purchases. Your team will never, ever, know how much booksellers like me appreciate your business.” “These funds mean more than money. It means community to me. And for that, I will be forever grateful.” “Bookshop has absolutely transformed our business, and I am just so continually grateful for your service and, ultimately, support. Thank you so much for your vision and your commitment to us indies.” Our mission is simple: To help local, independent bookstores thrive in the age of ecommerce.Certified as a B Corp, Bookshop.org puts this mission and the public good above financial interests, giving over 80% of our profit margin to independent bookstores. In 2022, B-Labs announced we were "best for the world": in the top 5% of all B-Corps. It is written in our governance documents that we will never sell the company to Amazon or any major U.S. retailer.As a Climate Neutral company, we are committed to operating sustainably.'''
year_published = 2025
