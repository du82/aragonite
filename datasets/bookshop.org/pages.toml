full_description = 'Bookshop.org puts this mission and the public good above financial interests, giving over 80% of our profit margin to independent bookstores. In total, we support over 1900+ stores. Journey from 1960s Vienna to Berkeley in the early aughts through captivating romance and literary fiction. Explore marriage in moving short stories from the author of Romantic Comedy and a revelatory novel about desire. Plus, learn more about the most important relationship of all, the one between prehistoric plants and life on Earth, of course! Editor’s Pick: The author of American War Omar El Akkad delivers a compelling nonfiction debut. Part memoir and part political critique, One Day examines the contradictions of his adopted homeland through a personal lens. This powerful, introspective work exposes the gap between Western ideals and the lived experiences of marginalized communities. With clarity and nuance, El Akkad captures our fractured moment, challenging readers to confront uncomfortable truths. —Amanda “Back After This is a sweetheart of a novel—fun and warm, full of Linda Holmes’s signature charm. You’ll sink into this story and never want it to end. The dialogue is sweet and snappy, and the characters so real you could touch them. There’s so much to love in this book: dreamy men who do backflips, found family, the perfect revenge, and an adorable dog. What more could a reader want?” —Elissa Sussman, author of Funny You Should Ask "Robert Seethaler has always created the epic from the ordinary...In The Café with No Name, he makes poetry out of the broken lives of the lost and disregarded who inhabit the margins of the great city and shows us how gold can be found in dust." —Anuradha Roy, author of All the Lives We Never Lived “[Sittenfeld’s] perfectly contained stories are a joy for their realistically and mundanely fractured characters, moral ambiguities, movingly related moments, and the message that even the smallest tale offers lessons to uncover.” —Booklist, starred review'
