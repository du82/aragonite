full_description = '''Bookshop.org puts this mission and the public good above financial interests, giving over 80% of our profit margin to independent bookstores. In total, we support over 1900+ stores. On this page you’ll find every (well, almost every*) discount code currently featured on Bookshop.org! Apply them in the checkout and give yourself a pat on the back for saving a little cash while being an awesome book lover. 10% off with GUTREACTION: Critically acclaimed, bestselling author and Newbery Honor-winner, Kirby Larson, and her daughter, debut author, Quinn Wyatt, pen this gorgeously moving and often funny story that explores what living with a chronic illness is like. Inspired by Quinn's own personal journey, Gut Reaction is full of heart and humor and highlights the importance of asking for help when it comes to mental and physical health alike. 15% off with LOVEBOOKSELLERS: A laugh-out-loud picture book with a feel-good message from bestselling comics creator Kate Beaton about a half-human-half-shark bent on revenge after a greedy fishing captain messes with her waters – perfect for fans of We Don’t Eat Our Classmates and The Legend of Rock Paper Scissors. 20% off with MICHELLEBANG20: A charming, life-changing guide to living a longer, happier, healthier life, rooted in Korean self-care. From the country, South Korea, that scientists predict will top longevity charts by the year 2030. 15% off with LOVEBOOKSELLERS: Perfect for ages 8-12, Max Bretzfeld is back in Berlin where his most dangerous mission is about to begin! The thrilling conclusion to the World War II spy duology that began with Max in the House of Spies. 10% off with FLEW: "At times harrowing, at times heartbreaking, and compelling throughout, it captures a moment in time and one young man's dangerous but unforgettable adventure." -- Trudy Ring, The Advocate 15% off with LOVEBOOKSELLERS: Step back in time with this swingin' new thriller that follows the lives of the women behind the men in an American crime family. This romantic period piece will have you falling in love with the characters, even as you witness their darker moments.'''
