description = "A Life Reclaimed"
full_description = '''{"@context":"https://schema.org","@type":["Product","Book"],"sku":"9781639735679","isbn":"9781639735679","gtin14":"09781639735679","image":["https://images-us.bookshop.org/ingram/9781639735679.jpg?v=df740b5c60efc1f2957db1eba564d94d"],"name":"American Mother","description":"<p><b>AN IMMEDIATE INTERNATIONAL BESTSELLER * </b><b>Featured on MSNBC's Morning Joe</b><br><b><br>With National Book Award–winning author Colum McCann, Diane Foley courageously returns to the story of her son, American journalist James Foley, who went abroad and never came home.</b><br><br>In late 2021, Diane Foley sat at a table across from Alexanda Kotey, a member of the ISIS group known as “the Beatles,” who pled guilty to the kidnapping, torture, and murder of her son James Foley seven years before. She asked the legendary writer Colum McCann to be there.<br><br><b>“One of the best books I've read in many, many years, if not my life.” -Anderson Cooper</b><br><br><b>“A work of great faith and redemption. Here is a woman making the whole world accessible to us all.” -Jamie Lee Curtis</b><br><br><b>“A spectacular tale of violence and forgiveness.” -Salman Rushdie</b><br><br><b>“Foley's urge to understand the psychology of one of her son's captors made her a perfect match for McCann.” -<i>The New York Times</i></b><br><br><b>“A book that will shake your soul out.” -Sting</b><br><br><b>“A call to decency in a war-torn world.” -Deborah Jackson Taffa</b></p>","brand":{"@type":"Brand","name":"Bloomsbury Publishing"},"publisher":{"@type":"Thing","name":"Bloomsbury Publishing"},"author":[{"@type":"Person","name":"Colum McCann"},{"@type":"Person","name":"Diane Foley"}],"bookFormat":"Paperback / softback","datePublished":"2025-02-11","numberOfPages":240,"size":"207.0 X 5.5 X 16.5 mm | 0.6 pounds","offers":{"@type":"Offer","url":"https://bookshop.org/p/books/american-mother-a-life-reclaimed-colum-mccann/21518123?ean=9781639735679&next=t","itemCondition":"https://schema.org/NewCondition","availability":"https://schema.org/InStock","price":16.73,"priceCurrency":"usd","shippingDetails":{"@type":"OfferShippingDetails","shippingRate":{"@type":"MonetaryAmount","value":3.99,"currency":"USD"},"shippingDestination":{"@type":"DefinedRegion","addressCountry":"US"},"deliveryTime":{"@type":"ShippingDeliveryTime","handlingTime":{"@type":"QuantitativeValue","minValue":0,"maxValue":1,"unitCode":"DAY"},"transitTime":{"@type":"QuantitativeValue","minValue":3,"maxValue":5,"unitCode":"DAY"}}},"hasMerchantReturnPolicy":{"@type":"MerchantReturnPolicy","applicableCountry":"US","returnPolicyCategory":"https://schema.org/MerchantReturnFiniteReturnWindow","merchantReturnDays":30,"returnMethod":"https://schema.org/ReturnByMail","returnShippingFeesAmount":{"@type":"MonetaryAmount","value":3.99,"currency":"USD"}}}}American MotherA Life ReclaimedColum McCann (Author), Diane Foley (Author)Paperback $17.99$16.73AvailablePaperback $17.99$16.73AvailableAdd to Wishlist4.9/5.021,000+ ReviewsBookshop.org has the highest-rated customer service of any bookstore in the worldDescriptionAN IMMEDIATE INTERNATIONAL BESTSELLER * Featured on MSNBC's Morning JoeWith National Book Award–winning author Colum McCann, Diane Foley courageously returns to the story of her son, American journalist James Foley, who went abroad and never came home.In late 2021, Diane Foley sat at a table across from Alexanda Kotey, a member of the ISIS group known as “the Beatles,” who pled guilty to the kidnapping, torture, and murder of her son James Foley seven years before. She asked the legendary writer Colum McCann to be there.“One of the best books I've read in many, many years, if not my life.” -Anderson Cooper“A work of great faith and redemption. Here is a woman making the whole world accessible to us all.” -Jamie Lee Curtis“A spectacular tale of violence and forgiveness.” -Salman Rushdie“Foley's urge to understand the psychology of one of her son's captors made her a perfect match for McCann.” -The New York Times“A book that will shake your soul out.” -Sting“A call to decency in a war-torn world.” -Deborah Jackson TaffaProduct DetailsPublisherBloomsbury PublishingPublish DateFebruary 11, 2025Pages240LanguageEnglishTypePaperback / softbackEAN/UPC9781639735679Dimensions207.0 X 5.5 X 16.5 mm | 0.6 poundsBISAC Categories: Biography & Memoir, Mystery, Thrillers & Crime, Politics, Society & Current Affairs, Mystery, Thrillers & CrimeProduct DetailsPublisherBloomsbury PublishingPublish DateFebruary 11, 2025Pages240LanguageEnglishTypePaperback / softbackEAN/UPC9781639735679Dimensions207.0 X 5.5 X 16.5 mm | 0.6 poundsBISAC Categories: Biography & Memoir, Mystery, Thrillers & Crime, Politics, Society & Current Affairs, Mystery, Thrillers & CrimeAbout the AuthorColum McCann is the author of seven novels, three collections of stories and two works of non-fiction. Born and raised in Dublin, Ireland, he has been the recipient of many international honours, including the U.S National Book Award, the International Dublin Literary Prize, a Chevalier des Arts et Lettres from the French government, election to the Irish arts academy, several European awards, the 2010 Best Foreign Novel Award in China, and an Oscar nomination. In 2017 he was elected to the American Academy of Arts. His work has been published in over 40 languages. He is the President and co-founder of the non-profit global story exchange organisation, Narrative 4. He is the Thomas Hunter Writer in Residence in Hunter College, in New York, where he lives with his wife Allison and their family. American Mother, his most recent book written with Diane Foley, was shortlisted for Biography of the Year by the An Post Irish Book Awards. His forhtcoming novel Twist will be published in March 2025. www.colummccann.comDiane M. Foley co-founded the James W. Foley Legacy Foundation in the weeks after her son, a journalist, was beheaded by members of ISIS in the Syrian Desert in 2014. Inspired by the life, work, and moral courage of her son, Diane has worked with Congress and every presidential administration since, catalyzing action, research, and policy to win freedom for all US Nationals wrongfully detained or held hostage abroad.Reviews“One of the best books I've read in many, many years, if not in my life.” —Anderson Cooper“American Mother is a book that will shake your soul out. A thriller, a memoir, a mystery, a portrait of forgiveness, and a literary song of grace, Colum McCann and Diane Foley have filled the empty chair for us all. One of the most extraordinarily well-braided stories that I have read in years.” —Sting“A spectacular tale of violence and forgiveness” —Salman Rushdie“This is a work of great faith and redemption. And here is a woman making the whole world accessible to us all.” —Jamie Lee Curtis“A courageous reflection on forgiveness, and the value of moral courage, told through the lens of a grieving mother. This book is a call to decency in a war-torn world.” —Deborah Jackson Taffa, author of the National Book Award Finalist WHISKY TENDER“Diane Foley's voice, as captured by Colum McCann, is one of the most compelling in recent literary memory. An honest, searing, heartbreaking book.” —Patrick Radden Keefe“The courage and generosity of spirit of Diane Foley in sharing her story about the loss of her beloved son, Jim, is a very special gift. Diane's unyielding faith in the goodness of others and her commitment to changing the status quo give us all hope.” —Speaker Nancy Pelosi“In this book, [Diane Foley] . . . invit[es] us to walk with her through some of the hardest moments of her life, courageously facing the unthinkable, sharing a candor that takes your breath away, and a deep hope that generations to come will never have to face what she did.” —Judy Woodruff“Foley's urge to understand the psychology of one of her son's captors made her a perfect match for McCann, who has described the value of 'radical empathy' to his moral compass.” —New York Times“It's kind of unique in my experience. . . . It's a novelist writing about an actual event with a depth and thoroughness that you never get from the news.” —Michael Cunningham via New York Times“An innovative, unsettling and utterly compelling narrative.” —Washington Post“Reading American Mother is nothing but humbling: that we should all be so decent and so wise, so generous of heart.”” —The Guardian“Diane Foley's faith and empathy . . . is nothing short of miraculous. And when, finally, Kotey shakes her hand, something an Isis man would never usually do, he seems to be quite as in awe of her courage as any reader will be” —Sunday Times“Powerful and devastating . . . reading this book is to be side by side with Diane” —Daily Mail“As an explanation of grief American Mother is elegant . . . What marks it out is how Diane Foley became an unlikely political activist . . . Graceful and compassionate” —Irish Independent“This is a book of agony, where the greatest of all may be Diane Foley's ignorance of what really happened to her son . . . Remarkable, stirring” —Irish Times“American Mother hits bookshelves at a time when understanding the experience of those held captive is a matter not only of empathy but also of public policy” —Christian Science Monitor“Artfully structured and delivered with propulsive intensity and heart, American Mother takes us deep into what must be every parent's nightmare.” —Pico Iyer, Air Mail“It is hard to call such a tragic story a thing of beauty, and yet that is what McCann has created here. Unforgettable.” —Booklist, starred review“A harrowing memoir of grief and love.” —Kirkus Reviews, starred review“Readers will be moved by this bracing chronicle of Foley's commitment to honoring her son's legacy.” —Publishers Weekly“A collaboration of the Irish novelist Colum McCann and Diane Foley, mother of James, American Mother is an extraordinary story of loss, faith, and grace.” —California Review of Books“American Mother . . . will hold a very special appeal for readers with an interest in stories of politically motivated murder, its aftermath and impact on others-especially family members of the victims . . . sensitive, insightful, emotionally compelling, and memorable.” —Midwest Book Review“National Book Award winner Colum McCann lends his considerable skill to Diane Foley's story in American Mother, a memoir of her experience as the mother of Jim Foley, a journalist held hostage for years before being brutally executed in 2014 by ISIS fighters. The book introduces Foley's distinctive voice, unassuming but insistent, as she reckons with the darkness brought on by hate and evil-and returns again and again to grace and mercy.” —Shelf Awareness for ReadersEarn by promoting booksEarn money by sharing your favorite books through our Affiliate program.Become an affiliateBookshop.org Best Sellers of the WeekBookshop.org View All (25)'''
