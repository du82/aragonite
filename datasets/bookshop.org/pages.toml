mportant it is to be part of a community of people who protect each other. Backmatter includes a note from the author about his experience growing up as a Black boy in the Twin Cities, information about the Minneapolis Uprising, and practical ways kids can get involved in activism.Product DetailsPublisherBeaming BooksPublish DateMay 24, 2022Pages40LanguageEnglishTypeHardbackEAN/UPC9781506478357Dimensions10.3 X 8.8 X 0.4 inches | 1.0 poundsBISAC Categories: , Kids, Kids, Kids, Kids, Product DetailsPublisherBeaming BooksPublish DateMay 24, 2022Pages40LanguageEnglishTypeHardbackEAN/UPC9781506478357Dimensions10.3 X 8.8 X 0.4 inches | 1.0 poundsBISAC Categories: , Kids, Kids, Kids, Kids, About the AuthorTy Chapman is the author of Sarah Rising (Beaming 2022); Looking for Happy (Beaming 2023); A Door Made for Me, written with Tyler Merritt (WorthyKids 2022); Tartarus (Button Poetry 2024); and multiple forthcoming children's books through various publishers. Chapman was a finalist for Tin House's 2022 Fall Residency, Button Poetry's 2022 Chapbook Contest, and Frontier Magazine's New Voices contest. Chapman's accomplishments also include being named a Loft Literary Center Mirrors and Windows fellow and a Mentor Series fellow, and attending Vermont College of Fine Arts in pursuit of his master's degree in creative writing for children and young adults.DeAnn Wiley is a Detroit-based artist who has been painting traditionally for over five years. She recently broke into the digital art world and shares her artwork with a large online audience. She is an advocate for social justice and is dedicated to making art that is authentic and intentional in empowering Black, queer, fat, and disabled people.Reviews"An important story about racial injustice." --Kirkus ReviewsEarn by promoting booksEarn money by sharing your favorite books through our Affiliate program.Become an affiliateBookshop.org Best Sellers of the WeekBookshop.org View All (25)'''
