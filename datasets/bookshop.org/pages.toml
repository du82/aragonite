full_description = '''{"@context":"https://schema.org","@type":["Product","Book"],"sku":"9798888902516","isbn":"9798888902516","gtin14":"09798888902516","image":["https://images-us.bookshop.org/ingram/9798888902516.jpg?v=enc-v1"],"name":"Teach Truth","description":"<p><strong>In the face of relentless attacks on antiracist education, a much-needed reckoning with the roots of this latest wave of censorship and an urgent call to action to defend education.<br /> <br /> </strong>In just the last few years, scores of states have introduced or passed legislation that would require teachers to lie to students about structural racism and other forms of oppression. Books have been cut from curricula and pulled from school library shelves. Teachers have been fired and threatened with discipline.<br /> <br /> As long-time organizer, writer, and high school teacher Jesse Hagopian argues in <em>Teach Truth</em>, at stake is our democracy, not to mention the annihilation of entire systems of knowledge that challenge the status quo. As Hagopian shows by exploring the origins, philosophy, and manifestations of these attacks, the Right's effort to regulate knowledge is an attempt to maintain its power over the American capitalist system, now and into the future.<br /> <br /> Yet the struggle for a liberatory education has a long history in the United States, from the days when it was illegal for Black people to be literate, to the Civil Rights and Black Power movements, to Black Lives Matter at School today. Teachers, students, and their allies are already building a movement - in the classroom, on campus, and in the streets - to defend antiracist education.</p>","brand":{"@type":"Brand","name":"Haymarket Books"},"publisher":{"@type":"Thing","name":"Haymarket Books"},"author":[{"@type":"Person","name":"Jesse Hagopian"}],"bookFormat":"Paperback / softback","datePublished":"2025-01-14","numberOfPages":320,"size":"8.8 X 5.9 X 0.9 inches | 1.1 pounds","offers":{"@type":"Offer","url":"https://bookshop.org/p/books/teach-truth-the-struggle-for-antiracist-education/21062496?ean=9798888902516&next=t","itemCondition":"https://schema.org/NewCondition","availability":"https://schema.org/InStock","price":23.2,"priceCurrency":"usd","shippingDetails":{"@type":"OfferShippingDetails","shippingRate":{"@type":"MonetaryAmount","value":3.99,"currency":"USD"},"shippingDestination":{"@type":"DefinedRegion","addressCountry":"US"},"deliveryTime":{"@type":"ShippingDeliveryTime","handlingTime":{"@type":"QuantitativeValue","minValue":0,"maxValue":1,"unitCode":"DAY"},"transitTime":{"@type":"QuantitativeValue","minValue":3,"maxValue":5,"unitCode":"DAY"}}},"hasMerchantReturnPolicy":{"@type":"MerchantReturnPolicy","applicableCountry":"US","returnPolicyCategory":"https://schema.org/MerchantReturnFiniteReturnWindow","merchantReturnDays":30,"returnMethod":"https://schema.org/ReturnByMail","returnShippingFeesAmount":{"@type":"MonetaryAmount","value":3.99,"currency":"USD"}}}}Teach TruthThe Struggle for Antiracist EducationJesse Hagopian (Author)Paperback $24.95$23.20AvailableHardback $57.50AvailablePaperback $24.95$23.20AvailableAdd to Wishlist4.9/5.021,000+ ReviewsBookshop.org has the highest-rated customer service of any bookstore in the worldDescriptionIn the face of relentless attacks on antiracist education, a much-needed reckoning with the roots of this latest wave of censorship and an urgent call to action to defend education. In just the last few years, scores of states have introduced or passed legislation that would require teachers to lie to students about structural racism and other forms of oppression. Books have been cut from curricula and pulled from school library shelves. Teachers have been fired and threatened with discipline. As long-time organizer, writer, and high school teacher Jesse Hagopian argues in Teach Truth, at stake is our democracy, not to mention the annihilation of entire systems of knowledge that challenge the status quo. As Hagopian shows by exploring the origins, philosophy, and manifestations of these attacks, the Right's effort to regulate knowledge is an attempt to maintain its power over the American capitalist system, now and into the future. Yet the struggle for a liberatory education has a long history in the United States, from the days when it was illegal for Black people to be literate, to the Civil Rights and Black Power movements, to Black Lives Matter at School today. Teachers, students, and their allies are already building a movement - in the classroom, on campus, and in the streets - to defend antiracist education.Product DetailsPublisherHaymarket BooksPublish DateJanuary 14, 2025Pages320LanguageEnglishTypePaperback / softbackEAN/UPC9798888902516Dimensions8.8 X 5.9 X 0.9 inches | 1.1 poundsBISAC Categories: Politics, Society & Current Affairs, Politics, Society & Current Affairs, , Education, Education, Product DetailsPublisherHaymarket BooksPublish DateJanuary 14, 2025Pages320LanguageEnglishTypePaperback / softbackEAN/UPC9798888902516Dimensions8.8 X 5.9 X 0.9 inches | 1.1 poundsBISAC Categories: Politics, Society & Current Affairs, Politics, Society & Current Affairs, , Education, Education, About the AuthorJesse Hagopian is a member of the Black Lives Matter at School steering committee and teaches Ethnic Studies at Seattle's Garfield High School. Jesse is an editor for Rethinking Schools magazine, the co-editor of the book Teaching for Black Lives, and the editor of the book More Than a Score: The New Uprising Against High Stakes Testing. Jesse is a recipient of the 2013 "Secondary School Teacher of the Year" award and the Special Achievement "Courageous Leadership" award from the Academy of Education Arts and Sciences. In 2015, Jesse received the Seattle/King County NAACP Service Award. Jesse serves as the Director of the Black Education Matters Student Activist Award.Reviews"The attack on antiracist education is at our front door, and there's no clearer or more determined voice in this struggle than Jesse Hagopian's. Jesse is insightful, compassionate, and committed to building a better world. Each page in Teach Truth offers sharp and timely analysis that captures the urgency of our current moment, while also grounding us in the history that brought us here. This is a book that propels us forward." -Bettina L. Love, author of Punished for Dreaming: How School Reform Harms Black Children "Writing from the trenches, Jesse Hagopian has given us a brilliant, incisive account of how we arrived here and a fearless field guide for how we fight back and reclaim education, truth, and democracy. They will ban this book; we must resist. There is more at stake than curriculum. We have a world to win." -Robin D. G. Kelley, author of Freedom Dreams: The Black Radical Imagination "Jesse Hagopian's Teach Truth is the book we need right now. It's the book we have always needed. It should not be controversial to tell teachers and legislators to teach truth. Yet in many states it is not only controversial; it is illegal. Hagopian clears away the cobweb of lies that have obscured our national history for generations of students." -Diane Ravitch, author of Slaying Goliath "Teach Truth is a powerful call to action by an amazing teacher, historian, organizer, and movement intellectual. In it Jesse Hagopian exposes the dangers of the current racist movement to silence and distort our collective history, labeling it 'uncritical race theory.' He insists we cannot only complain and protest, but we must create, build, and change ourselves as we strive to change the world and seed a better future. A must read for anyone concerned with education, justice, and our shared future. -Barbara Ransby, historian, professor, activist, and author of Ella Baker and the Black Freedom Movement: A Radical Democratic Vision "A powerful and courageous call to action... audacious and essential. Ultimately, Teach Truth is more than just a book; it is a manifesto for those who dare to envision a just society. In a time when the integrity of our educational system is under siege, Teach Truth stands as an inspiring testament to the necessity of teaching and learning with honesty and courage." -Jonathan Kozol, author of Savage Inequalities "Teach Truth is a mighty stream flowing against the tide of a world fractured by falsehoods. It's a call to prioritize humanity, to embrace radical honesty, and to forge pathways toward a democratic future. This work channels the voices of those on the front lines of education, amplifying the shared humanity at the heart of learning. In a world where truth is often broken, this book invites us to reimagine the educational landscape as a space for healing, transformation, and the pursuit of justice." -Michael Bennett, Super Bowl winner and author of Things That Make White People Uncomfortable "Teach Truth is an essential text and critical contribution to understanding the historical context that undergirds an anti-truth sociopolitical climate. The book is intellectually sharp, story-rich, and carefully researched. Hagopian gives us language to describe the pushback to antiracist education and what it means to be a truth teacher during difficult times." -Cierra Kaler-Jones, Executive Director, Rethinking SchoolsEarn by promoting booksEarn money by sharing your favorite books through our Affiliate program.Become an affiliateBookshop.org Best Sellers of the WeekBookshop.org View All (25)'''
