t who has received fellowships from Poet's House, Cave Canem, and CantoMundo foundations. Her work has appeared or is forthcoming in the Los Angeles Review of Books, The Miami Rail, and Mother Magazine, among others. Born and raised in Salt Lake City, Rio writes and lives in Harlem, USA. Lauren Semmer is an artist, children's book illustrator, and designer. She studied drawing at St. Paul College of Visual Arts and art history at New York University. Lauren's bright and charming work is featured on everything from kid's wall art to children's apparel. She lives in Manhattan with her family.Reviews"In rhyming couplets, Cortez leads readers on a journey through Black life that acknowledges pain and struggle while building confidence with examples of triumph. It's a tricky maneuver when writing for children, but Cortez pulls it off." - The New York Times "A uniquely crafted ABC book that portrays some of the most important events in Black History with a vibrancy and joy that young children will absolutely love." - Parade "...The layers of history are plentiful and complex....A useful mentor text for writing projects, a springboard for research, and an essential addition to classroom libraries." - Booklist "An impressive array of names, events, and concepts from Black history are introduced in this alphabet book for early-elementary readers... The rhyming verses are light on the tongue, making the reading smooth and soothing. The brightly colored, folk art-style illustrations offer vibrant scenes of historical and contemporary Black life..." - Kirkus Starred Review "Poet Cortez pens an informative ode to Black history in her children's book debut--for each letter of this abecedarian, she offers lightly alliterative, rhyming text that illuminates historically significant concepts and figures...A particularly resonant spread shows a crowd holding signs that reflect both historical and current events, including "We March with Selma" and "We Can't Breathe," demonstrating to young readers how past occurrences affect the present... A richly accessible resource for anyone seeking to celebrate Black visionaries." - Publishers Weekly Earn by promoting booksEarn money by sharing your favorite books through our Affiliate program.Become an affiliateBookshop.org Best Sellers of the WeekBookshop.org View All (25)'''
