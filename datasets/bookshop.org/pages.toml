description = "How Imagining the Future Shapes the Present"
full_description = '''{"@context":"https://schema.org","@type":["Product","Book"],"sku":"9781639730230","isbn":"9781639730230","gtin14":"09781639730230","image":["https://images-us.bookshop.org/ingram/9781639730230.jpg?v=enc-v1"],"name":"A Century of Tomorrows","description":"<p><b>An acclaimed cultural historian takes readers on an intellectual thrill ride through the kaleidoscopic story of futurology, a surprisingly powerful force in the modern world.</b><br><br>For millennia, predicting the future was the province of priests and prophets, the realm of astrologers and seers. Then, in the twentieth century, futurologists emerged, claiming that data and design could make planning into a rational certainty. Over time, many of these technologists and trend forecasters amassed power as public intellectuals, even as their predictions proved less than reliable. Now, amid political and ecological crises of our own making, we drown in a cacophony of potential futures-including, possibly, no future at all.<br><br> <i>A Century of Tomorrows</i> offers an illuminating account of how the world was transformed by the science (or is it?) of futurecasting. Beneath the chaos of competing tomorrows, Adamson reveals a hidden order: <i>six key themes</i> that have structured visions of what's next. Helping him to tell this story are remarkable characters, including self-proclaimed futurologists such as Buckminster Fuller and Stewart Brand, as well as an eclectic array of other visionaries who have influenced our thinking about the world ahead: Octavia Butler and Ursula LeGuin, Shulamith Firestone and Sun Ra, Marcus Garvey and Timothy Leary, and more.<br><br> Arriving at a moment of collective anxiety and fragile hope, Adamson's extraordinary book shows how our projections for the future are, always and ultimately, debates about the present. For tomorrow is contained within the only thing we can ever truly know: today.</p>","brand":{"@type":"Brand","name":"Bloomsbury Publishing"},"publisher":{"@type":"Thing","name":"Bloomsbury Publishing"},"author":[{"@type":"Person","name":"Glenn Adamson"}],"bookFormat":"Hardback","datePublished":"2024-12-03","numberOfPages":352,"size":"247.7 X 6.5 X 29.2 mm | 1.4 pounds","offers":{"@type":"Offer","url":"https://bookshop.org/p/books/a-century-of-tomorrows-how-imagining-the-future-shapes-the-present-glenn-adamson/20864128?ean=9781639730230&next=t","itemCondition":"https://schema.org/NewCondition","availability":"https://schema.org/InStock","price":30.68,"priceCurrency":"usd","shippingDetails":{"@type":"OfferShippingDetails","shippingRate":{"@type":"MonetaryAmount","value":3.99,"currency":"USD"},"shippingDestination":{"@type":"DefinedRegion","addressCountry":"US"},"deliveryTime":{"@type":"ShippingDeliveryTime","handlingTime":{"@type":"QuantitativeValue","minValue":0,"maxValue":1,"unitCode":"DAY"},"transitTime":{"@type":"QuantitativeValue","minValue":3,"maxValue":5,"unitCode":"DAY"}}},"hasMerchantReturnPolicy":{"@type":"MerchantReturnPolicy","applicableCountry":"US","returnPolicyCategory":"https://schema.org/MerchantReturnFiniteReturnWindow","merchantReturnDays":30,"returnMethod":"https://schema.org/ReturnByMail","returnShippingFeesAmount":{"@type":"MonetaryAmount","value":3.99,"currency":"USD"}}}}A Century of TomorrowsHow Imagining the Future Shapes the PresentGlenn Adamson (Author)Hardback $32.99$30.68AvailableHardback $32.99$30.68AvailableAdd to Wishlist4.9/5.021,000+ ReviewsBookshop.org has the highest-rated customer service of any bookstore in the worldDescriptionAn acclaimed cultural historian takes readers on an intellectual thrill ride through the kaleidoscopic story of futurology, a surprisingly powerful force in the modern world.For millennia, predicting the future was the province of priests and prophets, the realm of astrologers and seers. Then, in the twentieth century, futurologists emerged, claiming that data and design could make planning into a rational certainty. Over time, many of these technologists and trend forecasters amassed power as public intellectuals, even as their predictions proved less than reliable. Now, amid political and ecological crises of our own making, we drown in a cacophony of potential futures-including, possibly, no future at all. A Century of Tomorrows offers an illuminating account of how the world was transformed by the science (or is it?) of futurecasting. Beneath the chaos of competing tomorrows, Adamson reveals a hidden order: six key themes that have structured visions of what's next. Helping him to tell this story are remarkable characters, including self-proclaimed futurologists such as Buckminster Fuller and Stewart Brand, as well as an eclectic array of other visionaries who have influenced our thinking about the world ahead: Octavia Butler and Ursula LeGuin, Shulamith Firestone and Sun Ra, Marcus Garvey and Timothy Leary, and more. Arriving at a moment of collective anxiety and fragile hope, Adamson's extraordinary book shows how our projections for the future are, always and ultimately, debates about the present. For tomorrow is contained within the only thing we can ever truly know: today.Product DetailsPublisherBloomsbury PublishingPublish DateDecember 03, 2024Pages352LanguageEnglishTypeHardbackEAN/UPC9781639730230Dimensions247.7 X 6.5 X 29.2 mm | 1.4 poundsBISAC Categories: Politics, Society & Current Affairs, HistoryProduct DetailsPublisherBloomsbury PublishingPublish DateDecember 03, 2024Pages352LanguageEnglishTypeHardbackEAN/UPC9781639730230Dimensions247.7 X 6.5 X 29.2 mm | 1.4 poundsBISAC Categories: Politics, Society & Current Affairs, HistoryAbout the Author Glenn Adamson's books include Fewer, Better Things, The Invention of Craft, and The Craft Reader. His writings have also been published in museum catalogues and in Art in America, Antiques, frieze, and other periodicals. He was previously director of the Museum of Arts and Design, New York, and has held appointments as Senior Scholar at the Yale Center for British Art, and as Head of Research at the Victoria and Albert Museum, London. He lives in the Hudson Valley, New York. Reviews“Insightful…. A Century of Tomorrows is not an examination of The Future; it is an examination of examinations of the future. Adamson tells a story about a special class of storytellers, the future-telling people.… Adamson, having exposed various strains of failed futurology, suggests nonetheless that we will and should continue to make our best guesses, competing with one another, always remembering that every prediction is a statement about the present.” —James Gleick, New York Review of Books“A sweeping survey of future predictions, from 19th-century science fiction to Grace Jones at Studio 54.” —Wall Street Journal“Adamson accords [these visionaries] a place in his book because they expanded America's sense of the possible . . . The conclusion that [he] draws from his illuminating forays into cultural history is that any claim to be able to control the future is an illusion; the more scientific it sounds, the more dangerous it can be.” —The Atlantic“A hurtling history of the art, science and big business of looking ahead.” —New York Times Book Review, Editors' Choice“A Century of Tomorrows cannot clarify the future, but it provides a confident, learned guide to the present.” —Apollo“An illuminating look at past and present efforts to gaze into the crystal ball.” —Kirkus Reviews“Adamson builds his history like a patchwork quilt, sourcing examples from different intellectual and political traditions (including some from Europe) to create a breathtaking assemblage that showcases how today's ideas about the future, be they hopeful or fatalistic, have precedent in the themes, visions, and feelings that inspired those of the past.” —Booklist“Glenn Adamson has collected a jewel box of thoughtful stories about the past's possible futures; reading about the varied thinkers and doers in this wise narrative is a revelation.” —Julia Cooke, author of COME FLY THE WORLD“Adamson's ingenious study show us how much the ways we think about the future can tell us about who we are, what our desires and preconceptions are, and what we value or overlook. This book has made me see today's cultural and political forecasters in a whole new light.” —William Egginton, author of THE RIGOR OF ANGELS“A Century of Tomorrows will shift how you understand yourself and your own future. A brilliant and absorbing book.” —Katherine Turk, author of THE WOMEN OF NOW“A masterful cultural history, revealing how imagining the future has long been a way of remaking the present, not only for religious prophets, scientific thinkers, and science fiction writers, but in struggles for Native American sovereignty, civil rights, women's rights, environmental justice, and more. In a moment when the future can seem too dark to contemplate, A Century of Tomorrows advances the liberatory possibilities of thinking about the days to come. It's been forever since tomorrow held such appeal.” —Louis S. Warren, Bancroft Prize winning author of GOD'S RED SON“Brimming with astonishing insights and lyrical prose, A Century of Tomorrows is addressed to dreamers, but it is the rare book that belongs on everyone's bookshelf.” —Alex Zamalin, author of COUNTERCULTUREEarn by promoting booksEarn money by sharing your favorite books through our Affiliate program.Become an affiliateBookshop.org Best Sellers of the WeekBookshop.org View All (25)'''
