["https://bookshop.org/info/bramble-vday"]
title = "Bramble"
full_description = "Bramble is an imprint of Tor Publishing Group dedicated to a wide array of romantic stories for the modern reader. From science fiction and fantasy to contemporary and family saga, romance belongs in every genre and every genre belongs in Bramble. With spice levels to suit all readers, with familiar tropes and uncharted territory, Bramble books will explore a love that's tangled up, covered in thorns, and oh so sweet. The Hunger Games meets vampires in this heart-wrenching, epic fantasy romance of dark magic, and bloodthirsty intrigue. Bridget Jones’s Diary meets Survival of the Thickest in this a smoking-hot, hilarious romance novel about the perils of online dating. A lush cottagecore tale full of stolen spellbooks, unexpected friendships, sweet jams, and even sweeter love featuring lavender sprayed edges! A high-octane, tautly written dark romance with an unforgettable twist featuring stenciled edges with script design and a brand new bonus chapter. Kevin Kwan meets Crashing Landing on You in this delightfully funny romance about family, class, and love. In the tradition of Legends & Lattes, comes a cozy fantasy steeped in sapphic romance about one of the Queen’s private guards and a powerful mage who want to open a bookshop and live happily ever after. The eternal romance of Beauty and the Beast meets the gothic suspense of Dracula in this erotic dark academia story of epic love. Fall in love this Valentine’s Day with a Bramble romance! Dive into our vast collection of stories, where every reader finds their perfect match. Whether you're in the mood for a gentle simmer or a blazing inferno, Bramble has something for every reader. Come join us in celebrating the season of love with some of our new and upcoming releases! A Court of Thorns and Roses meets Dante’s Inferno in an epic fantasy romance of love and treachery between mortals and gods. The eternal romance of Beauty and the Beast meets the gothic suspense of Dracula in this erotic dark academia story of epic love now in paperback!"
