title = "Bookshop.org: Become an affiliate. Sell books online. Support local bookstores."
full_description = "Become an Affiliate Become an affiliate and earn an industry-leading 10% whenever someone buys a book you share. Please note that your account will need to go through a brief verification process in order for us to onboard your store. We will email you throughout this process to let you know the status of your page. Join the Affiliate Program Authors Promote your book via Bookshop.org to support your writing career and independent bookstores at the same time. Influencers Earn when promoting books you love Magazines, Publishers, and Web Publications Earn more on book sales from us than the competition How It Works: 1 Sign up for an account 2 Share links to books you love 3 Earn 10% on each sale you create Want to learn more? Check our FAQ Why Become an Affiliate Bookshop.org is all about giving back to everyone who supports book culture. Authors can double their royalties by selling their books through Bookshop.org, while supporting local bookstores at the same time! Publications that review books can earn much-needed financial support. Book clubs can earn sustaining funds on each pick, organizations can fundraise, and Instagram influencers can curate their favorite books on their own profile page and earn revenue. All while supporting the entire ecosystem around books! It’s a win-win-win! Questions? Email [email protected] to hear more. Have Your Own Hassle-Free Storefront Become An Affiliate"
