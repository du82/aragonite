title = "The Davenports a book by Krystal Marquis - Bookshop.org US"
description = "Check out The Davenports - <p><b><i>The Davenports</i> delivers a totally escapist, swoon-worthy romance while offering a glimpse into a period of African American history often overlooked.</b></p> <p/><p>The Davenports are one of the few Black families of immense wealth and status in a changing United States, their fortune made through the entrepreneurship of William Davenport, a formerly enslaved man who founded the Davenport Carriage Company years ago. Now it's 1910, and the Davenports live surrounded by servants, crystal chandeliers, and endless parties, finding their way and finding love--even where they're not supposed to.</p> <p/><p>There is <b>Olivia</b>, the beautiful elder Davenport daughter, ready to do her duty by getting married ... until she meets the charismatic civil rights leader Washington DeWight and sparks fly. The younger daughter, <b>Helen</b>, is more interested in fixing cars than falling in love--unless it's with her sister's suitor. <b>Amy-Rose</b>, the childhood friend turned maid to the Davenport sisters, dreams of opening her own business--and marrying the one man she could never be with, Olivia and Helen's brother, John. But Olivia's best friend, <b>Ruby</b>, also has her sights set on John Davenport, though she can't seem to keep his interest ... until family pressure has her scheming to win his heart, just as someone <i>else</i> wins hers.</p> <p/><p>Inspired by the real-life story of the Patterson family, <i>The Davenports</i> is the tale of four determined and passionate young Black women discovering the courage to steer their own path in life--and love.</p> by Krystal Marquis on Bookshop.org US!"
