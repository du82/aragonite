title = "(S)Kin a book by Ibi Zoboi - Bookshop.org US"
description = "Check out (S)Kin - <p><strong>SIX STARRED REVIEWS!</strong></p><p><strong>A Junior Library Guild Gold Standard Selection!</strong></p><p><strong>From award-winning,&#160;<em>New York Times</em>&#160;bestselling author Ibi Zoboi comes her groundbreaking contemporary fantasy debut&#8212;a novel in verse based on Caribbean folklore&#8212;about the power of inherited magic and the price we must pay to live the life we yearn for.</strong></p><p>&#8220;Our new home with its</p><p>thick walls and locked doors</p><p>wants me to stay trapped in my skin&#8212;</p><p>but I am fury and flame.&#8221;</p><p><strong>Fifteen-year-old Marisol</strong>&#160;is the daughter of a soucouyant. Every new moon, she sheds her skin like the many women before her, shifting into a fireball witch who must fly into the night and slowly sip from the lives of others to sustain her own. But Brooklyn is no place for fireball witches with all its bright lights, shut windows, and bolt-locked doors.&#8230; While Marisol hoped they would leave their old traditions behind when they emigrated from the islands, she knows this will never happen while she remains ensnared by the one person who keeps her chained to her magical past&#8212;her mother.</p><p><strong>Seventeen-year-old Genevieve</strong>&#160;is the daughter of a college professor and a newly minted older half sister of twins. Her worsening skin condition and the babies&#8217; constant wailing keep her up at night, when she stares at the dark sky with a deep longing to inhale it all. She hopes to quench the hunger that gnaws at her, one that seems to reach for some memory of her estranged mother. When a new nanny arrives to help with the twins, a family secret connecting her to Marisol is revealed, and Gen begins to find answers to questions she hasn&#8217;t even thought to ask.</p><p>But the girls soon discover that the very skin keeping their flames locked beneath the surface may be more explosive to the relationships around them than any ancient magic.</p> by Ibi Zoboi on Bookshop.org US!"
