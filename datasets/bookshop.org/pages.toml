["https://bookshop.org/info/for-authors"]
title = "For Authors"
full_description = '''When you use Bookshop.org to promote your books, you'll earn more money AND support independent bookstores at the same time! Most authors earn about 10% royalties from book sales. Books sold by authors on Bookshop.org earn twice as much money, while supporting independent bookstores at the same time! You can drive traffic to your page by sharing the right links in the right places. Here are six effective ways: By using your links on social media, your personal website, in newsletters and publications, you can earn a 10% commission on sales made, with a matching 10% supporting indie bookstores. If you are with a publisher, ask that they get their books carried by Ingram, the largest book wholesaler in the US - if Ingram has it, we'll list it on our site! If you're self published, either set up your book with Ingram Spark, or enable "Expanded Distribution" in your Amazon KDP account and it will appear on Bookshop.org within a couple of weeks. Authors do not have to handle inventory, fulfillment, shipping, or customer service. All book sales are fulfilled by Ingram, whose extensive inventory and regional warehouse system ensure that books can reach customers in as soon as 2-3 days. All customer service is handled by our dedicated team at Bookshop.org, with a 4.9 out of 5 star rating on Trustpilot, the highest customer service rating of any online bookstore! You can withdraw your earnings whenever you like via Stripe using an easy web interface, provided you have a balance of $20 or more. Bookshop.org pays our booksellers 30% of the cover price of all books sold through them. That means that we lose money on any book with less than a 30% wholesale discount. If your discount is under 20%, we will increase the sale price of the book to make up for this loss. If you do not want your book's price increased, please offer a wholesale discount greater than 20%.If you are an IngramSpark author, you must offer a 40% wholesale discount; Ingram's 20% distribution fee is non-negotiable, so to give Bookshop.org a 20% wholesale discount, you need a 40% discount overall. You can read about how to set wholesale discounts here.If you are a KDP author, if you select Expanded Distribution your wholesale discount is automatically 40%, which will allow it to be sold at list price on Bookshop.org.'''
