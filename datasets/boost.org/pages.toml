full_description = 'Development Boost sources are on GitHub. Boost developers constitute a wide array of people throughout much of the world. Over the years much work has gone into the quantity and quality of the C++ libraries and tools that make up Boost. There are many ways to become part of the Boost developer community, all starting with getting involved in the development discussion. But if you are looking for an "easy" place to get your feet wet is to volunteer testing resources. The wonderful people at Black Duck Open Hub provide a peek into what goes into Boost: Release Schedule Below is a community maintained calendar of Boost related events. The release managers try to keep the release related portion of the calendar up to date.'
