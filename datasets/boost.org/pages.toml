["https://boost.org/community/exception_safety.html"]
title = "Exception-Safety in Generic Components"
full_description = '''Exception-Safety in Generic Components Lessons Learned from Specifying Exception-Safety for the C++ Standard Library David Abrahams dave@boostpro.com Abstract. This paper represents the knowledge accumulated in response to a real-world need: that the C++ Standard Template Library exhibit useful and well-defined interactions with exceptions, the error-handling mechanism built-in to the core C++ language. It explores the meaning of exception-safety, reveals surprising myths about exceptions and genericity describes valuable tools for reasoning about program correctness, and outlines an automated testing procedure for verifying exception-safety. Keywords: exception-safety, exceptions, STL, C++ 1 What is exception-safety? Informally, exception-safety in a component means that it exhibits reasonable behavior when an exception is thrown during its execution. For most people, the term “reasonable” includes all the usual expectations for error-handling: that resources should not be leaked, and that the program should remain in a well-defined state so that execution can continue. For most components, it also includes the expectation that when an error is encountered, it is reported to the caller. More formally, we can describe a component as minimally exception-safe if, when exceptions are thrown from within that component, its invariants are intact. Later on, we'll see that at least three different levels of exception-safety can be usefully distinguished. These distinctions can help us to describe and reason about the behavior of large systems. In a generic component, we usually have an additional expectation of exception-neutrality, which means that exceptions thrown by a component's type parameters should be propagated, unchanged, to the component's caller. 2 Myths and Superstitions Exception-safety seems straightforward so far: it doesn't constitute anything more than we'd expect from code using more traditional error-handling techniques. It might be worthwhile, however, to examine the term from a psychological viewpoint. Nobody ever spoke of “error-safety” before C++ had exceptions. It's almost as though exceptions are viewed as a mysterious attack on otherwise correct code, from which we must protect ourselves. Needless to say, this doesn't lead to a healthy relationship with error handling! During standardization, a democratic process that requires broad support for changes, I encountered many widely-held superstitions. To even begin the discussion of exception-safety in generic components, it may be worthwhile confronting a few of them. “Interactions between templates and exceptions are not well-understood.” This myth, often heard from those who consider these both new language features, is easily disposed of: there simply are no interactions. A template, once instantiated, works in all respects like an ordinary class or function. A simple way to reason about the behavior of a template with exceptions is to think of how a specific instantiation of that template works. Finally, the genericity of templates should not cause special concern. Although the component's client supplies part of the operation (which may, unless otherwise specified, throw arbitrary exceptions), the same is true of operations using familiar virtual functions or simple function pointers. “ It is well known to be impossible to write an exception-safe generic container.” This claim is often heard concerning an article by Tom Cargill [4] in which he explores the problem of exception-safety for a generic stack template. In his article, Cargill raises many useful questions, but unfortunately fails to present a solution to his problem.1 He concludes by suggesting that a solution may not be possible. Unfortunately, his article was read by many as “proof” of that speculation. Since it was published there have been many examples of exception-safe generic components, among them the C++ standard library containers. “Dealing with exceptions will slow code down, and templates are used specifically to get the best possible performance.” A good implementation of C++ will not devote a single instruction cycle to dealing with exceptions until one is thrown, and then it can be handled at a speed comparable with that of calling a function [7]. That alone gives programs using exceptions performance equivalent to that of a program which ignores the possibility of errors. Using exceptions can result in faster programs than “traditional” error handling methods for other reasons. First, a catch block indicates to the compiler which code is devoted to error-handling; it can then be separated from the usual execution path, improving locality of reference. Second, code using “traditional” error handling must typically test a return value for errors after every single function call; using exceptions completely eliminates that overhead. “Exceptions make it more difficult to reason about a program's behavior.” Usually cited in support of this myth is the way “hidden” execution paths are followed during stack-unwinding. Hidden execution paths are nothing new to any C++ programmer who expects local variables to be destroyed upon returning from a function: ErrorCode f( int& result ) // 1 { // 2 X x; // 3 ErrorCode err = x.g( result ); // 4 if ( err != kNoError ) // 5 return err; // 6 // ...More code here... return kNoError; // 7 } In the example above, there is a “hidden” call to X::~X() in lines 6 and 7. Granted, using exceptions, there is no code devoted to error handling visible: int f() // 1 { // 2 X x; // 3 int result = x.g(); // 4 // ...More code here... return result; // 5 } For many programmers more familiar with exceptions, the second example is actually more readable and understandable than the first. The “hidden” code paths include the same calls to destructors of local variables. Also, they follow a simple pattern which acts exactly as though there was a potential return statement after each function call in case of an exception. Readability is enhanced because the normal path of execution is unobscured by error-handling, and return values are freed up to be used naturally. There is an even more important way in which exceptions can enhance correctness: by allowing simple class invariants. In the first example, if x's constructor should need to allocate resources, it has no way to report a failure: in C++, constructors have no return values. The usual result when exceptions are avoided is that classes requiring resources must include a separate initializer function which finishes the job of construction. The programmer can therefore never be sure, when an object of class X is used, whether he is handling a full-fledged X or some abortive attempt to construct one (or worse: someone simply forgot to call the initializer!) 3 A contractual basis for exception-safety A non-generic component can be described as exception-safe in isolation, but because of its configurability by client code, exception-safety in a generic component usually depends on a contract between the component and its clients. For example, the designer of a generic component might require that an operation that is used in the component's destructor not throw any exceptions.2 The generic component might, in return, provide one of the following guarantees: The basic guarantee: that the invariants of the component are preserved, and no resources are leaked. The strong guarantee: that the operation has either completed successfully or thrown an exception, leaving the program state exactly as it was before the operation started. The no-throw guarantee: that the operation will not throw an exception. The basic guarantee is a simple minimum standard for exception-safety to which we can hold all components. It says simply that after an exception, the component can still be used as before. Importantly, the preservation of invariants allows the component to be destroyed, potentially as part of stack-unwinding. This guarantee is actually less useful than it might at first appear. If a component has many valid states, after an exception we have no idea what state the component is in; only that the state is valid. The options for recovery, in this case, are limited: either destruction or resetting the component to some known state before further use. Consider the following example: template <class X> void print_random_sequence() { std::vector<X> v(10); // A vector of 10 items try { // Provides only the basic guarantee v.insert( v.begin(), X() ); } catch(...) {} // ignore any exceptions above // print the vector's contents std::cout "(" << v.size() << ") "; std::copy( v.begin(), v.end(), std::ostream_iterator<X>( std::cout, " " ) ); } Since all we know about v after an exception is that it is valid, the function is allowed to print any random sequence of Xs.3 It is “safe” in the sense that it is not allowed to crash, but its output may be unpredictable. The strong guarantee provides full “commit-or-rollback” semantics. In the case of C++ standard containers, this means, for example, that if an exception is thrown all iterators remain valid. We also know that the container has the same elements as before the exception was thrown. A transaction that has no effects if it fails has obvious benefits: the program state is simple and predictable in case of an exception. In the C++ standard library, nearly all of the operations on the node-based containers list, set, multiset, map, and multimap provide the strong guarantee.4). The no-throw guarantee is the strongest of all, and it says that an operation is guaranteed not to throw an exception: it always completes successfully. This guarantee is necessary for most destructors, and indeed the destructors of C++ standard library components are all guaranteed not to throw exceptions. The no-throw guarantee turns out to be important for other reasons, as we shall see.5 4 Legal Wrangling Inevitably, the contract can get more complicated: a quid pro quo arrangement is possible. Some components in the C++ Standard Library give one guarantee for arbitrary type parameters, but give a stronger guarantee in exchange for additional promises from the client type that no exceptions will be thrown. For example, the standard container operation vector<T>::erase gives the basic guarantee for any T, but for types whose copy constructor and copy assignment operator does not throw, it gives the no-throw guarantee.6 5 What level of exception-safety should a component specify? From a client's point-of-view, the strongest possible level of safety would be ideal. Of course, the no-throw guarantee is simply impossible for many operations, but what about the strong guarantee? For example, suppose we wanted atomic behavior for vector<T>::insert. Insertion into the middle of a vector requires copying elements after the insertion point into later positions, to make room for the new element. If copying an element can fail, rolling back the operation would require “undoing” the previous copies...which depends on copying again. If copying back should fail (as it likely would), we have failed to meet our guarantee. One possible alternative would be to redefine insert to build the new array contents in a fresh piece of memory each time, and only destroy the old contents when that has succeeded. Unfortunately, there is a non-trivial cost if this approach is followed: insertions near the end of a vector which might have previously caused only a few copies would now cause every element to be copied. The basic guarantee is a “natural” level of safety for this operation, which it can provide without violating its performance guarantees. In fact all of the operations in the library appears to have such a “natural” level of safety. Because performance requirements were already a well-established part of the draft standard and because performance is a primary goal of the STL, there was no attempt to specify more safety than could be provided within those requirements. Although not all of the library gives the strong guarantee, almost any operation on a standard container which gives the basic guarantee can be made strong using the “make a new copy” strategy described above: template <class Container, class BasicOp> void MakeOperationStrong( Container& c, const BasicOp& op ) { Container tmp(c); // Copy c op(tmp); // Work on the copy c.swap(tmp); // Cannot fail7 } This technique can be folded into a wrapper class to make a similar container which provides stronger guarantees (and different performance characteristics).8 6 Should we take everything we can get? By considering a particular implementation, we can hope to discern a natural level of safety. The danger in using this to establish requirements for a component is that the implementation might be restricted. If someone should come up with a more-efficient implementation which we'd like to use, we may find that it's incompatible with our exception-safety requirements. One might expect this to be of no concern in the well-explored domains of data structures and algorithms covered by the STL, but even there, advances are being made. A good example is the recent introsort algorithm [6], which represents a substantial improvement in worst-case complexity over the well-established quicksort. To determine exactly how much to demand of the standard components, I looked at a typical real-world scenario. The chosen test case was a “ composite container.” Such a container, built of two or more standard container components, is not only commonly needed, but serves as a simple representative case for maintaining invariants in larger systems: // SearchableStack - A stack which can be efficiently searched // for any value. template <class T> class SearchableStack { public: void push(const T& t); // O(log n) void pop(); // O(log n) bool contains(const T& t) const; // O(log n) const T& top() const; // O(1) private: std::set<T> set_impl; std::list<std::set<T>::iterator> list_impl; }; The idea is that the list acts as a stack of set iterators: every element goes into the set first, and the resulting position is pushed onto the list. The invariant is straightforward: the set and the list should always have the same number of elements, and every element of the set should be referenced by an element of the list. The following implementation of the push function is designed to give the strong guarantee within the natural levels of safety provided by set and list: template <class T> // 1 void SearchableStack<T>::push(const T& t) // 2 { // 3 set<T>::iterator i = set_impl.insert(t); // 4 try // 5 { // 6 list_impl.push_back(i); // 7 } // 8 catch(...) // 9 { // 10 set_impl.erase(i); // 11 throw; // 12 } // 13 } // 14 What does our code require of the library? We need to examine the lines where non-const operations occur: Line 4: if the insertion fails but set_impl is modified in the process, our invariant is violated. We need to be able to rely on the strong guarantee from set<T>::inse'''
