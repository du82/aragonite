full_description = "Boost Formal Review Schedule Reviews are scheduled when the review wizards approve a review manager and agree with the manager and author on dates. See Formal Review Process for more information. In addition to upcoming reviews, the schedule includes recent reviews already completed; that helps track review manager assignments and libraries reviewed but not yet posted on the website. There is often a lag between acceptance and site posting as authors address issues raised in the formal review. Schedule Submission Submitter Link Review Manager Review Dates MQTT Ivica Siladic Github Documentation Klemens Morgenstern October 16, 2024 - October 25, 2024 SQLite Klemens Morgenstern Github Documentation Richard Hodges November 13, 2024 - November 22, 2024 Hash2 Peter Dimov and Christian Mazakas Github Documentation Matt Borland December 7, 2024 - December 15, 2024 Decimal Matt Borland and Chris Kormanyos Github Documentation John Maddock January 13, 2025 - January 22, 2025 Past Review Results and Milestones Submission Submitter Review Manager Review Dates Result Boost Fiscal Sponsorship Vinnie Falco Glen Fernandes September 3, 2024 - September 22, 2024 Pending Accepted Parser Zach Laine Marshall Clow February 19, 2024 - February 28, 2024 Pending Conditionally Accepted CharConv Matt Borland Christopher Kormanyos January 15, 2024 - January 25, 2024 Pending Accepted -- Added in 1.85 Cobalt (fka Async) Klemens Morgenstern Niall Douglas September 22, 2023 - October 2, 2023 (repeated due lack of reviews) Pending Conditionally Accepted -- Added in 1.84 Scope Andrey Semashev Dmitry Arkhipov November 26, 2023 - December 5, 2023 Pending Conditionally Accepted -- Added in 1.85 Mustache Peter Dimov Klemens Morgenstern February 5, 2023 - February 14, 2023 Pending Rejected Redis (fka Aedis) Marcelo Zimbres Silva Klemens Morgenstern January 15, 2023 - January 24, 2023 Pending Conditionally Accepted -- Added in 1.84 URL Vinnie Falco, Alan de Freitas Klemens Morgenstern