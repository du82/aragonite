description = "A core part of being a traveler is being adaptable, flexible, and open-minded. When you go abroad, you can hardly expect everything—from the culture to the customs—to be the same."
full_description = '''x Facebook shareFacebook Pinterest sharePinterest Twitter shareTwitter TravelMar 02, 2025 44 American Norms That Baffle The Rest Of The World, As Shared In This Thread Jonas Grinevičius and Mindaugas Balčiauskas Open list comments 13 Vote arrow up Vote arrow down 23 Open list comments 13 Checkmark Link copied! Share icon Share Checkmark Link copied! Share icon Share Publish Not your original work? Add source ADVERTISEMENT if (!BoredPanda.Config.isPWA()) { freestar.config.enabled_slots.push({ placementName: "boredpandacom_singlepost_top", slotId: "boredpandacom_singlepost_top" }); } if (BoredPanda.Config.isPWA()) { document.querySelector("#boredpandacom_PWA_singlepost_top").parentElement.querySelector("div[data-pwa-ad='0'").remove(); freestar.config.enabled_slots.push({ placementName: "boredpandacom_PWA_singlepost_top", slotId: "boredpandacom_PWA_singlepost_top" }); } A core part of being a traveler is being adaptable, flexible, and open-minded. When you go abroad, you can hardly expect everything—from the culture to the people—to be the same. Otherwise, what’s the point of ever leaving your hometown? You have to embrace the adventure! That being said, some customs are so peculiar that your initial reaction might be utter confusion, even if you later end up getting used to them. Some internet users recently took to a thread on AskReddit to share what, in their opinion, are some widely accepted norms in the United States that baffle the rest of the world. Scroll down to see how a slice of the world sees American cultural quirks, including the positives and negatives. This post may include affiliate links. #1 Heath insurance. It’s weird that it’s tied to employment and it’s even weirder that you still have to pay out of pocket for things even when the insurance itself is super expensive. sunbearimon , lifestock / freepik Report Vote arrow up Vote arrow down 20points Add photo comments POST Petra Peitsch Petra Peitsch Community Member • points posts comments upvotes FollowUnfollow 4 hours ago DotsCreated by potrace 1.15, written by Peter Selinger 2001-2017 Round attention Svg Vector Icons : http://www.onlinewebfonts.com/icon Report It's called, you-are-nothing-just-if-you-make-money. And despite of it, you are still nothing. Vote comment up 4 4points Vote comment down reply View more commentsArrow down menu let primisDesktopId = 116845; if (!BoredPanda.Config.isTabletWidth) { if (BoredPanda.Config.isPetWellnessCategory) { primisDesktopId = BoredPanda.Config.experimentVariation < 2 ? 117477 : 117433; } else if (BoredPanda.Config.isNewsCategory) { primisDesktopId = BoredPanda.Config.experimentVariation < 2 ? 117965 : 117967; } else if (BoredPanda.Config.isFunnyCategory) { primisDesktopId = BoredPanda.Config.experimentVariation < 2 ? 118361 : 118363; } else if (BoredPanda.Config.isGamesPage) { primisDesktopId = BoredPanda.Config.experimentVariation < 2 ? 118022 : 118025; } } else if (BoredPanda.Config.isTabletWidth) { if (BoredPanda.Config.isPetWellnessCategory) { primisDesktopId = 118536; } else if (BoredPanda.Config.isNewsCategory) { primisDesktopId = BoredPanda.Config.experimentVariation < 2 ? 118537 : 118538; } else if (BoredPanda.Config.isFunnyCategory) { primisDesktopId = BoredPanda.Config.experimentVariation < 2 ? 118540 : 118541; } else if (BoredPanda.Config.isGamesPage) { primisDesktopId = 118539; } else { primisDesktopId = 118535; } } if (BoredPanda.Config.isPWA()) { primisDesktopId = 119089; } const trafficData = BoredPanda.TrafficSources.getData(); const subIdParts = [ BoredPanda.Config.postId, BoredPanda.Config.pos.join('_'), trafficData.source.replace(',', ''), trafficData.medium.replace(',', ''), trafficData.campaign.replace(',', ''), ]; subId = subIdParts.join(','); if (!BoredPanda.Config.isMobileWidth) { (function (d, s, b) { var mElmt, primisElmt = d.createElement('script'); primisElmt.setAttribute('type', 'text/javascript'); primisElmt.setAttribute('async', 'async'); primisElmt.setAttribute('s