full_description = "Home People Open Positions Employee Log in Candidate Log in to Connect Homepage boredpanda.com Let’s Fight Boredom Together! Connect Job openings .custom-section--id-35278001 .panda-main-text { font-size: 38px; text-align: center; line-height: 53px; font-weight: 300; max-width: 800px; margin: 0 auto; color: #4E4E4E; } .custom-section--id-35278001 .panda-main-text b { font-weight: 700; color: #222; } .custom-section--id-35278001 .panda-main-text-wrapper { width: 100%; } @media screen and (max-width: 480px) { .custom-section--id-35278001 .panda-main-text { font-size: 28px; line-height: 42px; } } We’re on a mission to fight the world’s boredom with uplifting content and entertain billions of people around the world. Are you in? What Pandas Do At Bored Panda, we believe there's a better way to spend time on the internet. In 2009, we took a leap into the digital world and published our first article from a university’s dorm. Today, we’re one of the leading online publishers globally, entertaining people of all ages with positive videos and news. We’re a bunch of creators and analysts, fighting the world’s boredom with 62B views per year. Bored Panda in Numbers Pandas Offices Countries Subscribers Video views per year Monthly website pageviews How Pandas Work Bored Panda is the place where creativity meets analytics. Where we entrust our ideas to research and A to Z tests to guarantee viral success. Entertaining people on social media inspires our high-quality content and the never-ending search for ways to bring joy online. We are digital innovators, and believe it or not, we love what we do about as much as we love bamboo! We are currently looking for Virtual Assistant - Remote Multi-Language · Multiple locations · Fully Remote Junior Meme Curator Audience Development & Distribution · Multiple locations · Fully Remote Videographer Bored Panda Studios · Lithuania Videographer Lithuania 1st Assistant Director Lithuania Video Editor Freelancer (Animation) Multiple locations Operations Manager Lithuania SEO Content Writer Editorial · Lithuania · Fully Remote Head of Business Unit (Facebook Video) Lithuania All jobs How Pandas Live Loads of Pandastic Perks We’ll cover your health Got sick? Don't worry. Private health and accident insurances are at your service. We'll support your balance Choose freely when to work from the office and when to stay at home. We'll foster your growth Have an extra skill, talent or passion? Let's train it and help you apply it at work! We'll celebrate your success Bonuses for weddings, childbirths, referred friends... You name it. We'll love your pet No dog or cat deserves to stay home alone. Bring yours to work! We'll give you memories Immerse yourself in themed parties, team buildings and other events. Meet the Hiring Team Karolina Satkevic Senior Talent Acquisition Partner Urtė Simonaitytė Talent Acquisition Partner Agnė Kuodė Head of People Lithuania Albania Andorra Angola Argentina Armenia Azerbaijan Bangladesh Bolivia Bosnia and Herzegovina Brazil Bulgaria Chile China Croatia Cuba Czech Republic Denmark Ecuador Egypt Estonia Finland Gauteng Georgia Germany Greece Hong Kong Hungary Iceland Ireland Kenya Kosovo Latvia Macedonia Malta Mauritius Moldova Montenegro Mozambique Netherlands Nigeria Norway Pakistan Paraguay Portugal Romania Serbia Slovakia Slovenia South Africa South Korea Sweden Taiwan Ukraine Uruguay About Bored Panda We are one of the leading digital media and entertainment companies globally, producing positive, engaging and original content in 17 languages for people of all ages. Known for award-winning art and pop culture magazine Bored Panda and TOP DIY channels like Crafty Panda, we fight the world's boredom at an unprecedented speed: 160 million page views per month and 62 billion video views per year. Home People Open Positions Data & privacy Manage cookies boredpanda.com Employee login Candidate Connect login Already working at Bored Panda? Let’s recruit together and find your next colleague. @boredpanda.com"
