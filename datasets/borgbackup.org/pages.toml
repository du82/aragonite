full_description = "Demo Install Fund Support Services Docs external link Community external link Contribute external link BorgBackup – Deduplicating archiver with compression and authenticated encryption Deduplicating archiver with compression and encryption BorgBackup (short: Borg) gives you: Space efficient storage of backups. Secure, authenticated encryption. Compression: lz4, zstd, zlib, lzma or none. Mountable backups with FUSE. Easy installation on multiple platforms: Linux, macOS, BSD, ... Free software (BSD license). Backed by a large and active open source community. ... and always check your backups! BorgBackup – Deduplicating archiver with compression and authenticated encryption Deduplicating archiver with compression and encryption BorgBackup (short: Borg) gives you: Space efficient storage of backups. Secure, authenticated encryption. Compression: lz4, zstd, zlib, lzma or none. Mountable backups with FUSE. Easy installation on multiple platforms: Linux, macOS, BSD, ... Free software (BSD license). Backed by a large and active open source community. ... and always check your backups!"
