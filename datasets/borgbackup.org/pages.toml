full_description = "Demo Install Fund Support Services Docs external link Community external link Contribute external link Borg release series Borg Future You can learn more about borg future plans there: Milestones Projects Documentation Installation Borg 2.0 Borg 2.0 is currently in testing - do not use it for production. borg 2.0 news overview (preliminary) Documentation Downloads Borg 1.4 Borg 1.4 is the current stable series of Borg. The current release is 1.4.0, released on 2024-07-03. 1.4.0 release announcement Documentation Installation Downloads Borg 1.2 Borg 1.2 is the current oldstable series of Borg. The current release is 1.2.8, released on 2024-03-29. 1.2.0 release announcement Documentation Installation Downloads Borg 1.1 Borg 1.1 is not supported any more, please use Borg 1.4.x or 1.2.x. The current release is 1.1.18, released on 2022-06-05. 1.1.0 release announcement Documentation Installation Downloads Borg 1.0 Borg 1.0 is not supported any more, please use Borg 1.4.x or 1.2.x. The last release in this series was 1.0.13, released on 2019-02-15. Documentation Installation Downloads Borg 0.xx Borg 0.xx was the development series leading up to the Borg 1.0 release and is not supported any more. It was active from early 2015 to early 2016 including releases from 0.23.0 to 0.30.1. Atom feed for releases https://github.com/borgbackup/borg/releases.atom Borg release series Borg Future You can learn more about borg future plans there: Milestones Projects Documentation Installation Borg 2.0 Borg 2.0 is currently in testing - do not use it for production. borg 2.0 news overview (preliminary) Documentation Downloads Borg 1.4 Borg 1.4 is the current stable series of Borg. The current release is 1.4.0, released on 2024-07-03. 1.4.0 release announcement Documentation Installation Downloads Borg 1.2 Borg 1.2 is the current oldstable series of Borg. The current release is 1.2.8, released on 2024-03-29. 1.2.0 release announcement Documentation Installation Download