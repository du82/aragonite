["https://borretti.me/article/how-capabilities-work-austral"]
title = "How Capabilities Work in Austral"
description = "A walkthrough of Austral's capability-based security features."
full_description = '''Code is permissionless by default. Rather, all code within the same address space runs with uniform permissions, despite different modules having different degrees of trustworthiness. If you download a left-pad library, it might implement leftpad, but it might contain malware that hoovers up your home directory and sends it to a server somewhere. This is called a supply chain attack. And there is nothing in the semantics of most programming languages that lets you prevent this. Anything can access the foreign function interface (FFI), the filesystem, the network, etc. Even clock access is dangerous, since timing information is useful in carrying out timing attacks. The transitive closure of dependencies in modern applications is huge. The node_modules directory on a humble React app I have on my laptop is 460 MiB, and that’s just React and ProseMirror. Most applications are a thin layer of business logic sitting atop a huge pile of library code, out of sight and out of mind. Nobody can audit all of it (though LLMs might make a dent here), and malware can be hidden in very subtle edge cases of the semantics of a language. What’s the solution? The graybeard will blame the programmer, say we need fewer dependencies and that any competent dev can re-write Figma in vanilla.js over a weekend. The HN commenter will blame the programmer for failing to audit the quarter-million lines of code in their dependencies. But we shouldn’t want to give up dependencies. Leveraging dependencies increases economic productivity, reinventing the wheel (unless you have a good reason) decreases it. Modern programming is O-ring, not Cobb-Douglas. And as I wrote in the Austral intro post, blaming the programmer will change nothing: If planes were flown like we write code, we’d have daily crashes, of course, but beyond that, the response to every plane crash would be: “only a bad pilot blames their plane! If they’d read subparagraph 71 of section 7.1.5.5 of the C++, er, 737 spec, they’d know that at 13:51 PM on the vernal equinox the wings fall off the plane.” This doesn’t happen in aviation, because in aviation we have decided, correctly, that human error is an intrinsic and inseparable part of human activity. And so we have built concentric layers of mechanical checks and balances around pilots, to take on part of the load of flying. Because humans are tired, they are burned out, they have limited focus, limited working memory, they are traumatized by writing executable YAML, etc. Discipline doesn’t fix type errors: type systems do. Discipline doesn’t fix memory leaks and buffer overflows: ownership types do. Similarly, security vulnerabilities will not be fixed by demanding superhuman discipline but by building languages with safer semantics. Contents The Solution Capabilities in Austral Example Capabilities vs. Values The Capability Hierarchy The Root Capability Limitations Irrevocability Global Uniqueness Unsafe FFI Summary Future Work Auditing A Stricter Model The Solution The solution is capability-based security. A capability is an unforgeable token that grants access to some permissioned resource, like the filesystem or the network or an accurate clock. Anything that should be locked down should require a capability to access. And, ideally, capabilities should be arbitrarily granular: requiring a capability to access the filesystem as a whole, read and write, removes a good chunk of security vulnerabilities. But we can go further: we can constraint access to a directory and its contents, or to a specific file, or to a specific file in read-only mode, and so on. Capabilities at the process and operating system level are widely implemented: Capscisum, Fuchsia, pledge, seccomp. These are typically more coarse-grained than what you can do with language-level support, but they’re easier to implement, because you can implement capability security around a completely untrusted, unaudited codebase, written in any language, runtime, or era. Language-level capabilities are harder. The language’s semantics have to be designed with capabilities in mind, trying to slap capability-security on a language after the fact is like trying to slap a type system on a dynamically-typed language. It might work, but you will have soundness issues, and you will cope and say it “doesn’t matter in practice”. The reason it’s hard is, you’d typically represent capabilities as types, and most programming languages don’t give hard guarantees about the provenance of types. In C and C++ you can in principle cast anything into anything. In Python or Common Lisp or other dynamic languages, you can dynamically search for a class by name and instantiate it anywhere. Unsafe operations—precisely what capability-based security is meant to constrain—let you get around that very security. The E programming language has capability security built in, but you don’t hear much about it. Capabilities in Austral Austral “supports” capability-based security. Supports in quotes because it is not a first-class feature: capability security is simply a consequence of linear types (except for the RootCapability—more on this later). Which makes me proud of the language design, since it’s a good sign when useful things naturally fall out of a design by logical necessity. Capabilities are represented as linear types. For an introduction to linear types in Austral, see the introduction to Austral post, or the post where I explain how the linear type checker works. Because capabilities are linear, they are not copyable. A piece of code in possession of a capability can destroy it, or give it to someone else, but not send a copy to someone else and keep theirs. And because there is no global mutable state, capabilities cannot surreptitiously be stored in a global variable for another piece of code to acquire them. Because of Austral’s strict module system and encapsulation, capabilities cannot be created ex nihilo. To create a capability, you must prove that you have access to a higher, more powerful capability. This satisfies all the security properties we want. And now if a leftpad dependency wants to read your data and send it to a server, it needs a filesystem capability and a network capability. It should be an obvious red flag if a string-manipulation library were to ask for those dependencies. And this makes it hard to hide malware. Example The following is a sketch of an API for a capability-secure network socket library: module Network is type NetworkCapability: Linear; generic [R: Region] function acquire(root: &![RootCapability, R]): NetworkCapability; function surrender(netcap: NetworkCapability): Unit; type Socket: Linear; generic [R: Region] function open( netcap: &![NetworkCapability, R], host: String, port: Nat16 ): Socket; function close(socket: Socket): Unit); -- ... the rest of the socket API ... end module. The Network module exports a NetworkCapability type, and two lifecycle functions: acquire and surrender. The acquire function takes a reference to the RootCapability, which is the equivalent of global God-mode permissions, and returns a NetworkCapability. The NetworkCapability type is opaque: it is declared, but not defined, in the module API file. Which means it can be imported and mentioned by other modules, but it cannot be constructed by code outside the Network module. Austral is absolutely strict about this. The only way to create a NetworkCapability instance outside this module is via the acquire function. Similarly, Socket is a linear value that wraps some internal, unsafe socket handle. Since Socket is a linear type, you can also think of it as a capability: having a value of type Socket gives you the capability to read or write from that socket or close it. Analogously, Socket has two lifecycle functions: open takes a reference to the network capability, a host and a port and returns a Socket (error handling is elided for clarity), and close takes a Socket, closes it, and consumes it. The way you’d use this is: -- Assuming we have a variable `root` holding the RootCapability. let netcap: NetworkCapability := acquire(&!root); let socket: Socket := open(&!netcap, "example.com", 80); -- We can surrender the capability immediately after opening the socket, since -- we don't need it for anything else. surrender(netcap); -- Do something with the socket. close(socket); Capabilities vs. Values There isn’t a sharp distinction between capabilities and linear types. Capabilities can be empty records, holding no values. In that case they are pure type-level permission slips. Typically such capabilities are “broad”: a network capability, or a filesystem capability likely wouldn’t have a pointer to anything. But linear types that have values—like a linear File type that wraps an unsafe file handle, or a network socket, or a database handle, etc.—can also be thought of as capabilities, especially if the API is designed such that those types can only be constructed by proving you have a capability to use that API. The Capability Hierarchy Capabilities form a hierarchy. Again, this hierarchy isn’t an inheritance hierarchy, and it’s not built into the language. It’s a hierarchy that is implicit in the functions that let you create a capability from another, more powerful capability. For example, in the above code example, the hierarchy looks like this: Analogously, a capability-security filesystem API with granular permissions might look like this: With each capability type providing functions to constraint it further, until we get to the leaf nodes like FileAttrsRead (e.g. read a file’s modification time). The Root Capability The root capability is the only part of Austral’s capability-security model that is built into the language. As mentioned above, capabilities cannot be created out of thin air, you have to pass a proof (a reference) that you own a broader, more powerful capability. The root capability is the base case of the recursion: it represents the highest level of permissions. Values of type RootCapability cannot be created in userspace. The root capability is only available as the first argument of the entrypoint function. Where in C an entrypoint might look like this: int main(int argc, char** argv) { printf("Hello, world!\n"); return 0; } In Austral the entrypoint function looks like this: function main(root: RootCapability): ExitCode is -- Some code here. surrenderRoot(root); return ExitSuccess(); end; The entrypoint is all-powerful. The design pattern here is that the entrypoint should acquire the capabilities that it needs (e.g. filesystem access, network access), then surrender the root, and call some other function with those capabilities: function main(root: RootCapability): ExitCode is -- Acquire some capabilities. let netcap: NetworkCapability := acquireNetwork(&!root); let fscap: FileSystemCapability := acquireFileSystem(&!root); let termcap: TerminalCapability := acquireTerminal(&!root); -- Surrender the root. surrenderRoot(root); -- Pass our capabilities to some other function. mainInner(netcap, fscap, termcap); -- Finally, exit. return ExitSuccess(); end; But also, a program can immediately surrender the root and acquire no capabilities. With such an entrypoint, you are guaranteed that the program is useless: that it does nothing but warm the CPU and exit. Limitations This section describes the limitations in Austral’s current capability security model. Irrevocability Capabilites are, by default, irrevocable. Code that owns a capability can surrender it (by consuming the linear value), but there’s no built-in mechanism for the owner of a higher-level capability to revoke it. This can be implemented, however, using pointers and access control lists. E.g. a File capability might hold an internal, opaque ID and a reference to the FileSystem capability that created it. Then all operations that use File follow that reference and check the File ID against an access control table in the FileSystem capability. This can be implemented and would work, but it has to be implemented explicitly, every time you want to do this, for each capability type. There is no “automatic revoke”. It also has the drawback that, by holding a reference, the File type is now tied to the lifetime of the FileSystem capability. This may, or may not, be a feature. Global Uniqueness In the above example, you can do this: function main(root: RootCapability): ExitCode is -- Acquire the network capability twice. let netcap1: NetworkCapability := acquireNetwork(&!root); let netcap2: NetworkCapability := acquireNetwork(&!root); -- ... And this is fine: different subsystems might each require a separate network capability, e.g. an HTTP server and a database client. But what about the terminal? Terminal access should probably be globally unique: otherwise, you could hand a terminal capability to two separate threads, each of which logs its work to the terminal, and the output will appear interleaved in a non-deterministic way. Once you acquire a terminal capability, you shouldn’t be able to do so again until the original capability has been surrendered. In the current model, the only way to implement the global uniqueness of capabilities something like this: module Unique is type UniqueCapability: Linear; function acquire(root: RootCapability): UniqueCapability; function surrender(cap: UniqueCapability): RootCapability; end module. That is: the UniqueCapability contains the RootCapability, and returns it to the client at the end of its existence. And this is inconvenient, because we can only have one globally unique resource live at any one time. So this is an area where, at present, the only solution is programmer discipline: the programmer should be informed that some capabilities should only be acquired once for the duration of the program, and they take the responsibility when they fail to do this. Unsafe FFI Every programming language needs a escape hatch. When interacting with the outside world, you have to do unsafe things. The question is: can you draw a boundary around unsafe code, so that it is clearly visible and demarcated and splash damage is minimized, and can you help programmers identify and audit the unsafe parts of their code? Austral’s FFI is unsafe. The only limit to using the FFI, calling foreign functions, and doing unsafe pointer arithmetic is that any module that does this must be marked unsafe. The idea is that we can then separate safe and unsafe modules and thus reduce the auditing burden on end-users. Summary The model is good—but not good enough. You can still have supply-chain attacks in Austral, the only thing that is reduced is the scope of auditing: rather than having to audit every line of code, you only have to audit unsafe modules, and verify that 1) they don’t do anything nasty and 2) they wrap their unsafe internals in a safe, capability-secure API. So the improvement in safety is only partial. Future Work This section describes different ways in which A'''
