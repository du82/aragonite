["https://borretti.me/article/astronomical-calculations-for-hard-sf-common-lisp"]
title = "Astronomical Calculations for Hard SF in Common Lisp"
description = "Hard SF worldbuilding with the HYG database, Dijkstra's algorithm, and Lisp."
full_description = '''In The Epiphany of Gliese 581, a group of explorers search the mortal remains of a dead superintelligence. The expedition begins in Beta Pictoris—today an unremarkable blue star; in the story, a posthuman Dyson swarm civilization of quadrillions—then passes through Gliese 581, and ends where it started. I wanted to build a timeline of the story, and, because this is hard science fiction, this means doing real math on real astronomical data. I ended up writing a small framework for doing astronomical calculations. In Common Lisp, for old time’s sake. The code is in this repo. The rest of this post is a walkthrough of the astronomy framework, followed by the story-specific code. The Problem Building a timeline requires knowing travel times, which requires knowing the distances between the stars. Which requires knowing the positions of the stars1. So I had to download the HYG database, which has all the information I need. But. The characters don’t travel in a straight-line ballistic trajectory. They’re digital people, so they can travel at the speed of light by sending their mental states over an interstellar communications network. And, because lasers decohere with distance, each “jump” is limited to a relatively short distance. So the fastest route from A to B is not a straight line on a rocket, but a zig-zagging trajectory on an optical link. To find the fastest network route I wrote an implementation of Dijkstra’s algorithm and ran it over a graph of stars, the edges linking all stars whose distance is less than the laser cutoff distance. An added constraint: Gliese 581 is not on the network, because it was inhabited by a taciturn superintelligence. So I had to write even more code to find the star closest to Gliese 581, from which the characters complete the last leg of the journey on a fusion rocket. Distances The most widely used unit of length in astronomy is the parsec, some weird trigonometry thing about parallax. It’s just as geocentric as lightyears but harder to intuit. We will want to convert to light years to present the results. We could just use floats, but I have a peculiar malady where I enjoy writing CLOS class definitions too much. Also, if I don’t have distinct types for the two units, I will confuse them and ruin all subsequent calculations. (defclass light-years () ((value :reader value :initarg :value :type real :documentation "The underlying value.")) (:documentation "Represents distance in light years.")) (defclass parsecs () ((value :reader value :initarg :value :type real :documentation "The underlying value.")) (:documentation "Represents distance in parsecs.")) (defun make-parsecs (value) "Create an instance of PARSECS from a numeric value." (make-instance 'parsecs :value value)) We can easily convert between the two units by multiplying by a constant: \[\begin{align*} pc &= ly \times 0.306601 \\ ly &= pc \times 3.26156 \end{align*}\] In Common Lisp these can be implemented as: (defun light-years-to-parsecs (ly) "Convert the given distance in light years to parsecs." (make-parsecs (* (value ly) 0.306601))) (defun parsecs-to-light-years (pc) "Convert the given distance in parsecs to light years." (make-instance 'light-years :value (* (value pc) 3.26156))) For example: CL-USER> (make-parsecs 5.0) #<PARSECS 5.0pc> CL-USER> (parsecs-to-light-years *) #<LIGHT-YEARS 16.3ly> CL-USER> (light-years-to-parsecs *) #<PARSECS 5.0pc> Star Positions Star positions are typically given in equatorial coordinates, a spherical coordinate system where positions in space are represented by two angles (called right ascension (RA) and declination (DEC)), and a radius (the star’s distance from the Sun). For historical reasons, right ascension is reported in hours-minutes-seconds format, and declination is reported in degrees-minutes-seconds. Luckily, the HYG database contains the Cartesian (X, Y, Z) coordinates2 as well. This makes it much easier to calculate distances and, later, to make star maps (see the appendix for dealing with equatorial coordinates). The cartesian-position class represents a Cartesian triple: (defclass cartesian-position () ((x :reader x :initarg :x :type parsecs :documentation "The X coordinate in parsecs.") (y :reader y :initarg :y :type parsecs :documentation "The Y coordinate in parsecs.") (z :reader z :initarg :z :type parsecs :documentation "The Z coordinate in parsecs.")) (:documentation "A position in Cartesian (X, Y, Z) coordinates.")) And the euclidean-distance function calculates the distance between two points: (defun euclidean-distance (p1 p2) "Calculate the Euclidean distance between two Cartesian coordinates. Returns a value in parsecs." (with-slots ((x1 x) (y1 y) (z1 z)) p1 (with-slots ((x2 x) (y2 y) (z2 z)) p2 (let ((x1 (value x1)) (y1 (value y1)) (z1 (value z1)) (x2 (value x2)) (y2 (value y2)) (z2 (value z2))) (make-parsecs (sqrt (+ (expt (- x1 x2) 2) (expt (- y1 y2) 2) (expt (- z1 z2) 2)))))))) We can use this like this: CL-USER> (defparameter a (make-instance 'cartesian-position :x (make-parsecs 3.4) :y (make-parsecs -6.7) :z (make-parsecs -1.2))) #<CARTESIAN-POSITION X=3.4pc Y=-6.7pc Z=-1.2pc> CL-USER> (defparameter b (make-instance 'cartesian-position :x (make-parsecs 9.1) :y (make-parsecs 4.3) :z (make-parsecs -7.2))) #<CARTESIAN-POSITION X=9.1pc Y=4.3pc Z=-7.2pc> CL-USER> (euclidean-distance a b) #<PARSECS 13.8pc> Parsing the HYG Database The HYG database is a straightforward CSV, so we can parse it easily. We use the parse-number library to parse floats (the alternative is read-from-string, which is heavy and insecure). First, a class to store the database: (defclass hyg-database () ((stars :reader database-stars :initarg :stars :type (vector star) :documentation "The star vector.")) (:documentation "The in-memory HYG database.")) (defun star-count (db) (length (database-stars db))) And another to represent the star data we care about: (defclass star () ((id :reader star-id :initarg :id :type integer :documentation "The star's ID in the HYG database.") (proper :reader star-proper :initarg :proper :type (or null string) :documentation "The star's proper name, if known.") (hip :reader star-hip :initarg :hip :type (or null string) :documentation "The star's name in the Hipparcos catalog, if known.") (hd :reader star-hd :initarg :hd :type (or null string) :documentation "The star's name in the Henry Draper catalog, if known.") (gliese :reader star-gliese :initarg :gliese :type (or null string) :documentation "The star's name in the the third edition of the Gliese Catalog of Nearby Stars, if known.") (bayer :reader star-bayer :initarg :bayer :type (or null string) :documentation "The star's Bayer-Flamsteed designation, if known.") (distance :reader star-distance :initarg :distance :type parsecs :documentation "The star's distance from the Sun in parsecs.") (cartesian-position :reader star-cartesian-position :initarg :cartesian-position :documentation "The star's Cartesian (X, Y, Z) position.")) (:documentation "Represents a star from the HYG database.")) (defun star-name (star) "A star's name. The following are tried in order: proper name, Bayer designation, Gliese name, HIP name, HD name. If the star doesn't have any names, returns '?'." (with-slots (proper bayer gliese hip) star (or proper bayer gliese (if hip (concatenate 'string "HIP " hip) "?")))) And the parsing code is very straightforward: (defun load-hyg-database (pathname) "Load the HYG database from a CSV file." (with-open-file (stream pathname :direction :input) ;; Discard the header. (read-line stream nil) (let ((stars (make-array 0 :adjustable t :element-type 'star :fill-pointer 0))) (loop for line = (read-line stream nil) while line do (let ((columns (uiop:split-string line :separator ","))) (let ((star (parse-star columns))) (vector-push-extend star stars)))) (make-instance 'hyg-database :stars stars)))) (defun parse-star (cells) "Parse a star from a row (a list of CSV cells)." (destructuring-bind (id hip hd hr gliese bayer proper ra dec dist prma prdec rv mag absmag spect ci x y z &rest etc) cells (declare (ignore hr ra dec prma prdec rv mag absmag spect ci etc)) (make-instance 'star :id (parse-integer id) :proper (string-or-nil proper) :hip (string-or-nil hip) :hd (string-or-nil hd) :gliese (string-or-nil gliese) :bayer (string-or-nil bayer) :distance (make-parsecs (parse-number:parse-real-number dist)) :cartesian-position (make-instance 'cartesian-position :x (parse-parsecs x) :y (parse-parsecs y) :z (parse-parsecs z))))) (defun string-or-nil (str) (if (string= str "") nil str)) (defun parse-parsecs (str) (make-parsecs (parse-number:parse-real-number str))) And, finally, some code to find stars by name: (defun find-star-by-name (db name) (loop for star across (database-stars db) do (when (string= name (star-name star)) (return-from find-star-by-name star))) nil) Now we can query the database: CL-USER> (defparameter db (load-hyg-database #p"hygdata_v3.csv")) DB CL-USER> (defparameter star (find-star-by-name db "Gl 581")) #<STAR Gl 581> CL-USER> (star-name star) "Gl 581" CL-USER> (star-distance star) #<PARSECS 6.2pc> CL-USER> (star-cartesian-position star) #<CARTESIAN-POSITION X=-4.0pc Y=-4.7pc Z=-.8pc> Nearest Stars Since Gliese 581 is not on the network, we need to find the star closest to it. First, this function returns all stars within a given radius of a position: (defun find-stars-within-radius (db pos radius) "Given an HYG database, a position in Cartesian coordinates, and a radius in parsecs, return a vector of all the stars that are within the radius from that position." (let ((stars (make-array 0 :adjustable t :element-type 'star :fill-pointer 0))) (loop for star across (database-stars db) do (let ((star-pos (star-cartesian-position star))) (when (< (value (euclidean-distance pos star-pos)) (value radius)) (vector-push-extend star stars)))) stars)) Now, the driver code. First, we load the database: (defparameter +db+ (load-hyg-database #p"hygdata_v3.csv")) (assert (= (star-count +db+) 119614)) Then we find all the stars within 3 parsecs of Gliese 581, sort them, and print them out: (defparameter +g581+ (find-star-by-name +db+ "Gl 581")) (let ((stars (find-stars-within-radius +db+ (star-cartesian-position +g581+) (make-parsecs 3.0)))) ;; Sort stars by distance. (flet ((dist (star) ;; Distance to Gliese 581. (star-euclidean-distance +g581+ star))) (let ((sorted (sort stars #'(lambda (star-a star-b) (< (value (dist star-a)) (value (dist star-b))))))) ;; Print the list of stars. (format t "Ten stars closest to Gliese 581:~%~%") (format t "~8@A ~12@A~%" "Dist" "Star") (format t "---------------------~%") ; subseq because the first star is Gl581 itself, and because we only want the top 10 (loop for star across (subseq sorted 1 11) do (format t "~6,2fly ~12@A~%" (value (parsecs-to-light-years (dist star))) (star-name star))) (let ((star (elt sorted 1))) (format t "~%The star closest to Gliese 581 is ~A at ~0,2fly" (star-name star) (value (parsecs-to-light-years (dist star)))))))) (defun star-euclidean-distance (a b) "The Euclidean distance between two stars in parsecs." (euclidean-distance (star-cartesian-position a) (star-cartesian-position b))) The output here is: Ten stars closest to Gliese 581: Dist Star --------------------- 4.25ly Gl 555 5.15ly Gl 570B 5.17ly Gl 570A 7.43ly NN 3877 7.87ly Gl 563.2A 8.17ly Gl 644B 8.18ly Gl 644C 8.21ly Gl 628 8.34ly Gl 644A 8.83ly Gl 643 The star closest to Gliese 581 is Gl 555 at 4.25ly Now we have to find a route from Beta Pictoris to Gliese 555. The Network Route The shortest path between two points is the Euclidean distance. But rockets are slow, and light is fast. And the characters, being uploads, have the option of travelling by simply sending copies of their mind over a communications network. Optical transceivers have a limited range, but even then, an indirect, zig-zagging trajectory at the speed of light is faster than a straight-line trajectory on a spacecraft moving at maybe 10% of the speed of light. So: what’s the shortest path between two stars, when each hop is limited by technology and economics to some constant distance? To find the answer, I just implemented Dijkstra’s algorithm and ran it over the graph of stars and network connections. The edge and graph classes represent a graph where edges have a cost: (defclass edge () ((start :reader edge-start :initarg :start :type integer :documentation "The ID of the start node.") (end :reader edge-end :initarg :end :type integer :documentation "The ID of the end node.") (cost :reader edge-cost :initarg :cost :type number :documentation "The cost of traversing this edge.")) (:documentation "Represents an edge in a graph.")) (defmethod initialize-instance :after ((edge edge) &key) (with-slots (start end cost) edge ;; Check edges are not degenerate. (when (= start end) (error "Degenerate edge: start and end IDs are the same: ~A" start)) ;; Check cost is non-negative. (when (< cost 0.0) (error "Edge cost is negative: ~A" cost)))) (defclass graph () ((vertices :accessor graph-vertices :initarg :vertices :type (vector integer) :documentation "A vector of vertex IDs.") (edges :accessor graph-edges :initarg :edges :type (vector edge) :documentation "A vector of edge objects.")) (:documentation "Represents a graph.")) This convenience function builds a graph object from the vector of edges: (defun make-graph-from-edges (edges) "Construct a graph from a vector of edges." (let ((vertex-table (make-hash-table :test 'equal)) ; table of seen IDs (vertices (make-array 0 :adjustable t ; vertex accumulator :element-type 'integer :fill-pointer 0))) (loop for edge across edges do (with-slots (start end) edge (unless (gethash start vertex-table) (vector-push-extend start vertices) (setf (gethash start vertex-table) t)) (unless (gethash end vertex-table) (vector-push-extend end vertices) (setf (gethash end vertex-table) t)))) (make-instance 'graph :vertices vertices :edges edges))) Given a graph whose edges have a cost, Dijkstra’s algorithm finds the cheapest path between given start and end nodes. When cost represents distance, this is the shortest path. At the highest level: Dijkstra is breadth-first beam search on a tree rooted at the start vertex. More detailed: Dijkstra begin with the start vertex, and performs breadth-first search by building up a tree through the neighbouring nodes. Each leaf node knows its cost, that is, the sum of the edge costs in the path from the root to the leaf. In normal breadth-first search, the search order is just the iteration order of the node’s children. Dijkstra picks the next node that minimizes cost. That’s the beam part of beam search. Even more detailed, here’s the full pseudocode: Dijkstra’s Algorithm Inputs: $G : \text{Graph}$ $V_i: \text{Vertex}$: the start vertex. $V_f: \text{Vertex}$: the end vertex. Let: $D: \text{Map}[\text{Vertex}, \mathbb{R}]$ is the table of distances from $V_i$ to every other vertex. Initially, we set $D[V_i] := 0$ and $D[v] := +\infty, \foral'''
