full_description = "About Me I’m a software engineer. In my free time I write code, a blog, fiction, and build a programming language. I have too many interests to list exhaustively, but this is a representative sample of how I spend my time: Software engineering, theory and practice. Compilers, programming languages, type systems, parsers; not abstractly but with the goal of improving engineering practices. Data modeling, ontologies, logic, information management: choosing the right formalisms to model the world. Self-improvement: autodidactism, lifting, productivity, time-tracking. The future: what does life look like after biology, and what does the universe look like after intelligence? If this is interesting to you, send me an email. Contact Email: fernando@borretti.me Twitter: @zetalyrae Bluesky: @eudoxia.bsky.social GitHub: eudoxia0 LinkedIn: fborretti Hacker News: submissions, comments. About This Site This is a repository for my projects, blog, and fiction. Best Posts Effective Spaced Repetition Unbundling Tools for Thought Introducing Austral: A Systems Language with Linear Types and Capabilities Language Pragmatics Engineering Lessons from Writing a Compiler Signed Integers are Asymmetrical Blogroll My RSS feeds: feedlist.opml. Colophon This website is built with Emacs, Jekyll, and Sass. Hosting is provided by GitHub Pages. Icon Sources About: Pandora by John William Waterhouse. Portfolio: An Iron Forge by Joseph Wright of Derby. Articles: Jason and Medea by John William Waterhouse. Fiction: The Mermaid by John William Waterhouse."
