["https://borretti.me/article/language-tooling-antipatterns"]
title = "Language Tooling Antipatterns"
description = "We will build a tower of Webpack wrappers to reach heaven."
full_description = "Earlier today I tried to write a small project starter template for OCaml, since tooling is the weakest link to getting started with that language. After a thousand little sources of friction I was defeated, so I decided to write this post instead. Contents Not Being Like Cargo Environment Variables Shell Dotfiles Explicit Environments Using a DSL Local Vendoring Shotgun Tooling No Pinning Not Being Like Cargo cargo is the gold standard of language tooling. I don’t ask for much. I don’t need a language server or a time-traveling debugger. All I need is a build system and a package manager and a project skeleton generator, ideally rolled up into one. I want the cargo workflow: $ foo new hello $ cd hello $ foo build $ foo run ./Hello, world! $ foo test 19/19 tests passed. That’s all I want. Because I want to use the language. If I have to learn how the tooling works, the DX is automatically bad, because we know how tooling should work. It should work like cargo. Sometimes, it may be permissible to deviate from the cargo workflow, e.g. if your language is very alien and merits a different workflow. Environment Variables If your build system requires a LANGUAGEPATH environment variable it’s already over. Just take a sledgehammer to the whole stack and start over. Environment variables are the worst of global mutable state with the worst of stringly-typed systems. Language tooling should be as stateless as possible. It should store whatever global data it needs in user-local XDG directories. It should refer only to its XDG data and to the contents of the current directory.1 Cargo doesn’t need me to manage environment variables. Why do you? Using a DSL “Build files are programs written in TwingoScript, you see—” Nope. Not learning another language. 99% of the time, I want build descriptions to be declarative, static data, and not programs. For the 1% of cases, accidentally Turing complete JSON is still better than having a full-blown language all of the time. This also applies, but less so, to using some other fanciful configuration language. I can’t even spell Dhall most of the time. I’d rather write dumb JSON. Shell Dotfiles Stop asking me to put things in my .bashrc. It is not for you. There is never any sound engineering reason for this. See the above point: tooling should be as stateless as possible. Cargo doesn’t require me to modify my shell config. Why do you? Explicit Environments Like virtualenv and its offspring. Explicit as in: the user has to create a named environment (usually specifying a compiler version), and manually enter it. This is never really necessary, from an engineering perspective. The fact that in many languages, you cannot have multiple versions of the same library installed at once does not mean you need explicitly managed environments: the build system can simply decide which one to link to at build time. “Environments”, if they must exist, should be implicit, managed by the build system, and unseen by the user. Local Vendoring This hardly needs mentioning but having a node_modules directory in every project is a mistake. Dependencies should be downloaded once to a global cache in the appropriate XDG directory. This is to save bandwidth and storage. Nobody really disputes this so I won’t argue it. Shotgun Tooling Shotgun as in shotgun parsers. “How do I build foolang projects?” “Easy, just sudo apt-get install bar which is the build system.” “Ok great. I can get hello world going. How do I add a dependency?” “Ah, you need baz to manage dependencies.” “Ok, does baz.json create bar.sexp or the other way around?” “Well, nobody uses them directly. You need derp as a swiss army knife.” “Alright.” “And flurpy to manage derp environments.” “I think I am a fictional character in a Socratic dialogue about OCaml build tooling.” “You first use sdkman to install yog-sothoth, who is the key and the gate, with knowledge of forbidden and abhorrent lore you mkvirtualenv a named environment and update your .zshrc, then you eval $(rlyeh env) and dagon install requirements.docx --with-backdoors to get your dependencies. We deploy on ZIRP.js, a cloudless codeless deployment startup that will take down the world economy when it folds six weeks from now. No you cannot test anything locally.” “I wish I was using Haskell.” No Pinning When I run the build command, the build system should: Resolve dependencies into a consistent set of assignments. Pin the exact version of all dependencies in a lockfile so the build is reproducible. Download any dependencies not present in the machine. Build all the dependencies, if needed. Build my code. Most modern package managers have figured this out so it’s astounding this has to be said. As far as I can tell opam doesn’t have lockfiles. It also doesn’t install dependencies automatically. So your build might fail tomorrow because the package manager is resolving a different transitive dependency. The usual advice is to “just use Nix”, which I think is code for “go fuck yourself”.2 Footnotes You think you can wrap it up, hide them behind more layers of tooling, but there is nothing build on environment variables that is not a leaky abstraction. Some day your users will have to read the manual (or worse, the source code) to find they had to set the SNOBOLPATH environment variable or something. ↩ I know this is offered as actionable advice, and I know Nix is great, I think this is attacking the problem at the wrong level of abstraction. Nix is very coarse-grained: you can’t, for example, pin specific versions of packages, you can only pin a specific revision of the Nix packages store. Language-level package managers are not duplicating Nix’s functionality, they’re providing a smaller and more specialized subset. ↩"
author = "Fernando Borretti"
year_published = 2023
clearnet = "https://borretti.me/article/language-tooling-antipatterns"
