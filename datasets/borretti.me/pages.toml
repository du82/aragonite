title = "Lessons from Writing a Compiler"
description = "Collected tips from building the Austral compiler."
full_description = "The prototypical compilers textbook is: 600 pages on parsing theory. Three pages of type-checking a first-order type system like C. Zero pages on storing and checking the correctness of declarations (the “symbol table”). Zero pages on the compilation model, and efficiently implementing separate compilation. 450 pages on optimization and code generation. The standard academic literature is most useful for the extreme frontend (parsing) and the extreme backend (SSA, instruction selection and code generation), but the middle-end is ignored. This is fine if you want to learn how to build, e.g., the next LLVM: a fat backend with a very thin frontend. But what if you’re building a compiler on top of LLVM, such that it’s all frontend and middle-end? Semantic analysis, type checking, and checking the rules of declarations are the most important parts of modern compilers because this is where all the important diagnostics (other than syntax errors) are made. This article contains some of the lessons I learned writing the compiler for Austral, a new systems programming language with linear types that I’ve been working on for a while. The first few sections are high-level, the rest most specific to using OCaml to write a compiler. Contents Implementation Strategies Just Use OCaml Just Use Menhir What Tests are Useful Compilation Model Code Organization Bootstrapping Issues The Environment Identifying Declarations Errors Remarks Implementation Strategies Imagine a compiler as a 2D grid. The rows are the stages of compilation: from parsing, through the middleend, to the backend. The columns are the different facets of the programming language being implemented. For a smaller language like C, the different facets are: global variable declarations, enum declarations, type declarations, function declarations, and nothing else. More featureful languages add extra facets: interface and class definitions in C++, trait and impl definition in Rust, etc. There are, broadly, two ways to implement a compiler. In the waterfall strategy, each stage is implemented one after the other: the complete parser, then the complete semantic analysis pass, then the complete type checking pass, and on to the backend stages. Tests can be be written after each stage is finished, and this might help catch bugs, since a shallower pipeline means fewer places to look for the source of the bug. It is difficult to identify where bugs happen in a compiler with many tens of intermediate representations, when you only have end-to-end tests. The downside is getting to “Hello, world!” takes a very long time. When writing a compiler for an existing language, this matters less. But when building a new language, you want something you can play with at an early stage, so you can find what sticks out in the language design, what needs polishing, and what the language pragmatics are. However, the reality of development pressures and expedience means the end result looks more like: With error diagnostics and semantic analysis checks being what is typically left out. The alternative is the verticals strategy, where, at the beginning of development, you implement all stages of compilation, but they do nothing. The parser parses empty files, the ASTs types are empty or have only perfunctory placeholder cases, the backend emits nothing. And then you implement each language facet, one at a time. The advantage of this is that from the start you have a compiler you can invoke and test. Having end-to-end tests from the start is a huge boon both in terms of ensuring the compiler implements the language definition and identifying regressions. While in the waterfall strategy you can focus on ensuring each stage of compilation is correct, with the verticals strategy you can focus on ensuring each facet of the language being implemented is correct. The problem is you’re not implementing the language, but rather a succession of concentric subsets of the language, until you get to feature-completeness. Austral’s compiler was written with a very unprincipled, waterfall-ish strategy: I went stage by stage, but omitting some harder-to-implement features, diagnostics, and checks, and then went back and filled those in. I have a sense that the strategy of proceeding by verticals is better, but I can’t endorse either strategy because I haven’t compared them. Just Use OCaml I’ve a whole graveyard of half-finished compiler projects and toy interpreters in my drive, in everything from C, C++, Common Lisp, Standard ML, Java, Haskell and OCaml. OCaml sits at a comfortable point in language space for building compilers. It has enough tutorials and practical documentation to be productive. It has all the functional programming features you want: algebraic data types and pattern matching with exhaustiveness checking. But it’s not too strict, and you write imperative code if you want. And OCaml is not terribly big-brained, so you don’t have to be put off. You can ignore much of the language and write spartan, workmanlike OCaml that solves the problem and doesn’t leave potential contributors scratching their head. Compilers are unusual in that they rarely require large ecosystems, unlike most modern applications. A good parser generator is all you need, so using more obscure languages like OCaml does not involve paying as much of a cost, as, say, writing a web app in Haskell vs. Python. You won’t find yourself having to reinvent the entire ecosystem from scratch because few dependencies you need don’t exist. Just Use Menhir You need a parser. This is the most mind-numbing part of the compiler. Writing a parser by hand is tricky and not worth the alleged performance increases1. Parsing performance likely won’t be the bottleneck. Parser combinators are very popular. It’s cute that you can parameterize grammars by making them into functions. But the problem with parser combinators is they implement parsing expression grammars. PEGs are popular too, but they’re too rigid. In a PEG, the disjunction or choice operator (typically denoted by the pipe character |) is ordered choice. If you have a context-free grammar like foo := a | b | c, you can expect the parser generator to be smart about which case to take given input. In PEGs – and, therefore, in parser combinators – choices are tried in the order in which they are listed. This leads to huge headaches. Things like left recursion lead to difficult to debug infinite loops, you will have to contort your grammar to fit the rules of PEG. The end result does not look like the cute parser combinator one-liners that draw everyone in. Good old fashioned parser generators like Menhir or ANTLR don’t have this problem. Choice is unordered, like in the EBNF notation you find in language specifications. Left recursion is implemented “intelligently”, usually without requiring you to transform your grammar. Menhir is a mature parser generator. It is integrated into OCaml’s build system: dune. The documentation is alright, but there’s enough practical tutorials to get you started. What Tests are Useful There’s, roughly, two kinds of tests: Unit tests are written in the same language the compiler is written in. In my case, OCaml. End-to-end tests. Here you have a test runner that treats the compiler as a black box: a binary file that is invoked with command line arguments. Tests can either check that compilation fails and produces an expected set of error messages, or that compilation succeeds and the generated program, when executed, produces expected output. You should write end-to-end tests first. Yes, they are coarse-grained, and they may not help you figure out exactly where in the compiler a bug resides. But the benefit is that they treat the compiler as a black box, which lets you iterate the compiler’s internals without causing tests to break. You can change the AST structure, intermediate representation, passes, environment representation, backend, everything, as long as the CLI interface remains the same. This is useful for early-stage development where things are changing rapidly. Investing time in writing a good end-to-end test runner was a huge boon for the development of the Austral compiler. I wish I had done it earlier. Having lots of very specific unit tests for every aspect of a pass is useful mainly when the compiler has reached a stage of maturity where its internals are fixed. If you are still iterating on the internals, those tests are a liability: they will fail to compile (due to the changes you made to the compiler’s code) more often than they will catch bugs. Caveat: Languages differ by how convenient they make writing tests, and what is convenient is what gets written. I find myself writing a lot more tests in Python, for example, than in OCaml. Partly because Python makes fewer guarantees at compile time, and partly because Python’s dynamism makes things like test autodiscovery easier. Compilation Model The simplest compiler is a whole-program compiler: it processes an ordered set of files, one after the other, and spits out generated code for the whole thing. The module dependency DAG can be topologically sorted to a linear order. For an MVP language, this is fine, because very little code is written in the language. The problem is scalability: whole-program compilation for large codebases is intrinsically slow. Being able to typecheck, compile, and run code at a high frequency makes development less frustrating. Having to wait ten seconds to build hundreds of thousands of lines of code, ab initio, for every change that you make is frustrating. Performance requires separate compilation. Separate compilation requires careful thinking. It can’t be an afterthought of language design: you have to design the language’s module system and compilation model with separate compilation in mind. Having this figured out and sketched out from the start is a good idea. Code Organization It’s generally good to separate intermediate representations from passes. The former are types, the latter are a set of functions. This helps keep modules short and to the point. Besides, there’s not always a one-to-one mapping from IRs to passes, you will be running multiple different analysis passes on the same representation. The exception to this is where it would break encapsulation. Sometimes you want types to be opaque, so that the module that defines them can enforce invariants about their contents. Bootstrapping Issues (This section only applies to new programming languages and not e.g. Fortran) Compilers are often written in the language they compile. This shows the language is mature enough to handle the non-trivial task of building a compiler, and it also makes contributions easier, because contributors only need to know one language, rather than both the host and implementation languages. So, you’ve decided to build a new programming language, but you can’t write the compiler in a non-existent language. The basic idea here is: Write the bootstrapping compiler, in a language like OCaml. Write the self-hosting compiler, in your new language, and use the bootstrapping compiler to build it. When do you move on from 1 to 2? Writing the simplest, dumbest possible MVP compiler is a good idea: it lets you iterate with the language early and see what makes sense and what doesn’t. Immediately jumping off to build a production compiler at this stage is a bad idea: building a compiler is hard, and if your only tool is a rickety MVP compiler held together by spit and bailing wire, writing the self-hosting compiler will take longer and be more frustrating than it should be. The bootstrapping compiler doesn’t have a set expiration date. You can iteratively improve it until there’s enough interest in, and users of, the language to justify the time investment in writing a second, production-quality compiler. If iterative improvement is too slow, you can take the Fred Brooks route: throw the first one away. Build a brain-dead simple bootstrapping compiler in OCaml, then rewrite it from scratch into a production-quality compiler—but still in OCaml. And then only migrate to the self-hosted compiler when the language is mature enough that this is worth doing. The Environment The environment (also called the symbol table, especially in compilers for C-like languages) is where user declarations, like type definitions and function definitions, are stored. This is the central data structure in a compiler. Type checking, which is easily the largest part of modern language compilers, requires pervasive access to the environment. For example, to typecheck a function call, you need the function’s signature, which comes from the environment. Constructor calls require the definition of the type being constructed, which comes from the environment. The environment is also the natural place to store extra information that is not strictly needed for compilation but lets you provide richer diagnostics, such as the cross-reference graph. An API documentation generator can draw essentially all the information it needs from the environment. Despite the centrality of the environment, compiler literature typically glosses over it, for two reasons: First, most textbook compilers are for relatively simple, C-like languages. Since C has no explicit modules and a global namespace, and only four kinds of declarations (global variables, enums, types, and functions), the environment can be very simple: it’s literally just a hash table from declaration names to definitions. Compiler textbooks typically focus on the executable part of source text: the bodies of functions. This is where most optimizations, control flow analysis, SSA, code generation etc. happen. The language determines how sophisticated the environment has to be. C and C++ can have relatively simple environments. Ada, which has a more complicated module system, requires a correspondingly more complicated environment. So some of this advice is not portable across languages, and an environment data structure that works for one may be lacking for another. Austral is a relatively simple language. Code is organized in modules, which have names, and are non-hierarchical2. Modules contain declarations, of which there are six kinds: constants, records, unions, functions, type classes, and type class instances. All declarations except type class instances can be identified by a name. In the Austral compiler, the environment is an opaque type that’s only accessible through an API. Internally, it is a set of tables, where each table stores a different kind of language object. There’s a table of modules, whose rows looks like this: type mod_rec = ModRec of { id: mod_id; name: module_name; interface_file: file_id option; interface_docstring: docstring; body_file: file_id; body_docstring: docstring; kind: module_kind; (** Whether or not the module is unsafe. *) imported_instances: DeclIdSet.t; (** The set of imported typeclass instances. *) imports_from: Mo"
