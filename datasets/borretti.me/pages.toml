title = "My Experience with Bupropion"
description = "Autism, antipsychotics, and the striatum."
full_description = "This post is about how I realized I have ADHD, what my symptoms were, and how I managed it with Bupropion. Let me prefix this by saying that none of this is medical advice: I’m just an autistic software engineer with a lot of free time. If you have mental health problems, for the love of God just talk to a psychiatrist. I promise it’s not bad. Psychiatry is good, antidepressants aren’t happy pills that zombify you, and the pharmaceutical industry has saved countless lives. That aside, let’s begin. An Epiphany I have a funny story of how I realized I have ADHD. In late 2017 I started taking fluvoxamine for anxiety. It helped, but partially, so the psychiatrist added aripiprazole, an atypical antipsychotic sometimes used as an adjuvant to SSRIs. I had to quit after a week because of Parkinsonian tremors (it turns out that fluvoxamine inhibits the cytochrome that metabolizes aripiprazole, so I was effectively getting a higher dose). But that was the most productive week I’d had in ages. After years of burnout, I had the mental energy and motivation to do things. I resumed work on my personal projects. I stopped procrastinating. I was studying things that interest me. I felt like the person I am. I told this to three psychiatrists but none of them seemed to think it was meaningful. One of them offered to restart me on aripiprazole, but I didn’t want to risk tardive dyskinesia. So I went back to being a lazy bum. Years later, while going down an autistic special interest rabbithole, I got interested in pharmacology. I bought a copy of Molecular Neuropharmacology. And I didn’t read it (because I didn’t have the executive function) but I did leaf through it. And in the first chapter I read about how partial agonists work. Briefly: low dopamine activity makes you ADHD, high dopamine activity makes you schizophrenic. That’s why stimulants (which increase dopamine) can cause psychosis. A partial agonist of dopamine acts as an agonist (dopamine ↑) when dopamine is low, but acts as an antagonist (dopamine ↓) when dopamine is high. In short: partial agonists are stabilizers. Aripiprazole is a partial agonist of dopamine. And I had an epiphany. And I looked it up: can Aripiprazole be used to treat ADHD? I found a case report report of a woman with ADHD who was treated with aripiprazole, she reported exactly what I experienced, down to the daytime sleepiness. I found a clinical trial where aripiprazole was successfully used for ADHD. This was 2022. It took me four years to figure it out (it turns out it’s hard to solve problems when you keep getting distracted from them), but who can say they’ve diagnosed themselves from first principles after an unusual reaction to a drug? And I talked about it with friends who have ADHD, and things began falling into place. Symptoms For someone who has 500 tabs of PubMed open at all times it’s embarrassing how long it took me to put things together. I think, partly, it’s because life-long pathologies are hard to notice: we know mental states by mutual contrast, if you’ve never been very focused or effective you might not think of yourself as a particularly unfocused or unproductive person. Partly, also, because everything in the DSM overlaps: someone who is anhedonic and has low executive function could be ADHD, or they could also be chronically depressed, or even schizophrenic1. Chronic decision paralysis is an aspect of ADHD, but also of anxiety. And so on. Partly because whenever I’d try to tell a psychiatrist about my horrible problems with finishing projects they’d redirect to some other topic they felt was more important. And partly it’s because we make physical and mental deficiencies into moral ones. I’ve spent vastly more time castigating myself for being undisciplined, lazy, etc. than I’ve spent rationally and systematically trying to solve my problems. But everyone who has undergone successful psychiatric treatment understands: we are automata, like the gears of Babbage; we travel in fixed orbits, as predictable as the orbits of the planets, and the movements of objects in space. So a lot of these things only became visible as symptoms of ADHD after the fact, after discussing it with friends who have ADHD and with my psychiatrist: Autism: obviously I have ASD (I told the psychiatrist who diagnosed me it would be more surprising if I didn’t) and ADHD co-occurs “in 30–80% of individuals with ASD”. Focus: I never felt like I was particularly distractible or unfocused, mostly because I’ve unwittingly structured me life around not having to focus, using various coping skills, mostly centered around text. I’ve always struggled with paying attention during meetings, but I just thought that’s because the meetings were pointless. I was very surprised when, after initiating Bupropion, I suddenly realized during a work meeting that I’d been paying attention for multiple minutes on end without having to remember to take notes. I’ve tried meditation time and time again but I felt unable to make progress with it, because I’d lose focus within seconds. When I looked for advice on how to overcome this, people online would say: “just observe your thoughts”. But the whole problem is that the thoughts surface on their own, and carry me away before I can notice them, and it’s frustrating to resume meditating when you realize you’ve spent the past five minutes writing code in your head. Physical Restlessness: my default mode of thinking is to pace the room endlessly, which I’d chalked up to autistic stimming2. When seated I’ll drum my feet, if my legs are crossed I’ll often shake the foot that’s off the ground. Low Self-Control: for years on end, every day I’d tell myself, “today we’re going to sleep at a reasonable hour”. The alarm would go off, and I’d find some excuse—I have to finish this Wikipedia rabbithole, or finish this video, or read one more paper—to stay up, and go to sleep somewhere between 1 and 5 am. This was a big problem. Unfortunately the Bupropion doesn’t exactly help here because the twice-daily dosing schedule gives me a bit of insomnia. Wikipedia in particular is like a time machine. I go to the front page, intending to look something up, click on the featured article—and come to forty five minutes later with twenty open tabs, somehow having gone from “Enceladus” to “List of Allied bombings raids on Wilhelmshaven in World War II”. My life is like Memento: I wake up with no recollection of who I am but instead of tattoos I have all these PDFs I’ll never read. Productivity: Austral took years to finish. Years. So much so that at a certain point I became embarrassed to bring it up, because I knew that when I did, people thought, “oh, yeah, that’s Fernando’s idée fixe that he keeps saying he’ll finish”. It took so long because I’d start working on it, and run out of steam, and leave it untouched for months and months on end. The commit log reflects this: tall, narrow peaks of hyperfocus separated by long stretches of inactivity. The Epiphany of Gliese 581 is barely a novella at 26k words. It took me a year to finish. I worked on it by accumulating fragments that came to me spontaneously, then growing text around them like geological strata, until the fragments began to touch in time. And it shows, in the structure: the frequent <hr> breaks are simply where I joined too fragments without connecting tissue. The idea of sitting down and writing it down, linearly, chapter by chapter and paragraph by paragraph was beyond ridiculous. I could hardly sit down to get three paragraphs out of my head at a time. Sometimes I’d get a burst of executive function, and I’d be able to work on a project consistently for a weekend or even a week or two. And I’d rack my brain to figure out: what did I do differently, and how do I extend this? Is it my diet? Have I accidentally fixed some persistent nutritional deficiency? Is it my caffeine dosing schedule? Should I do 150mg of caffeine in the morning and a cup of tea in the afternoon? What’s the clearance rate of sugar-free Monster? Maybe I can supplement L-tyrosine since it’s a dopamine precursor. I’d try to twist every knob: caffeine intake, sun exposure, cardio, lifting, micronutrients, etc. And nothing worked consistently. It made it extremely difficult to plan for the future, because I had no idea when or how long I could work on something. Chronic Underachievement: I start an ambitious project, and it withers away. I dropped out of college. I start reading a book, put it away and forget it. The years pass, the projects remain unfinished. What I have achieved was achieved by white knuckling through it, at the cost of persistent burnout. This is a great source of pain, because I’m a creative person, and it hurts if I can’t create. Engineering Methodology: I suppose this is somewhat self-serving, but the north star of all of my engineering work is complexity. I always insist on simplifying, keeping moving parts to a minimum, ensuring the whole system is small enough that it fits in my head so I can reason about it. I designed Austral to be a programming language that I would enjoy using. Now I realize that the entire language is designed as an assistive technology for a programmer with ADHD. The core language principle is simplicity. Everything is as explicit as possible, and implicit behaviour (like type conversions and exception propagation) are thrown out: this helps because everything you need to reason about the code is right there on the page. It places minimal demands on working memory. Writing code is, effectively, about serializing your working memory, and reading code is about restoring that serialization. If I get distracted, it doesn’t matter, because I can just read the code again to restore context. There is a whole list of anti-features, things I threw away explicitly to reduce cognitive overhead. The linear type system is designed to be based on a small core set of simple rules that fit on a page. The module system, with the separation of module interfaces and bodies, is designed to minimize how much I have to read and hold in working memory in order to work. The language’s features are designed to be overwhelmingly orthogonal. I threw out async because async + linear types is hard to reason about. I threw out exceptions because exceptions are hard to reason about. What Didn’t Work I resent when people say to stop taking pills because the solution to [insert mental health] problem is exercise. First, because I can outlift everyone who tells me that, and secondly because I feel that it confuses cause and effect. If someone has crippling depression, and they start a rigorous exercise routine, that might just mean they’ve spontaneously entered remission. So if your anxiety or whatever can be handled by exercise and drinking a mango smoothie: good for you. Please don’t tell me about it. Here’s the things that didn’t help with my ADHD: todo lists, the X effect, Vipassana meditation, lifting, cardio, methylated vitamin B12, vitamin D, magnesium, zinc, keto, carnivore, vegetarian, generic talk therapy. More generally: pharmacology is the only thing that’s even changed anything for me, and the “classical” or non-pharmacological approaches only become useful with pharmacological assistance. It was only after I started taking Bupropion that I was able to use a todo list consistently, that I was able to make spaced repetition into a daily habit, that I was able to build up productive habits and practices. My mental model of this is: when your reward function is just $f(x) = 0$, putting effort on a productive task gives you as much reward as putting no effort at all, or procrastinating on some instant-gratification Skinner box. Habit formation becomes impossible. You might manage to use a todo list consistently for a week, or two weeks, but eventually something happens that breaks that streak, and you find that despite repeated effort, you have not formed a habit. The associations in your brain simply are not there. Bupropion Bupropion, also known as Wellbutrin, is an antidepressant. And an aid in quitting smoking. And a treatment for ADHD. Chemically, it’s a substituted amphetamine; in terms of its activity on receptors it’s an NDRI, a norepinephrine-dopamine reuptake inhibitor. It binds to NET and DAT, effectively increasing the activity of norepinephine and dopamine. And for this reason, it has a stimulant effect. The reason it’s classed as an antidepressant rather than a stimulant is the stimulant effect is very mild (which is why actual stimulants are the first choice in ADHD treatment) and it’s not a euphoriant. People rarely try to abuse it, with horrible results, but it’s more likely to kill you than get you high. There are three formulations: Immediate release (IR) Sustained release (SR) Extended release (XR or XL) SR is typically two 150mg pills taken eight hours apart, XL is usually one 300mg pill taken once daily. SR is safer than IR and XL is safer than SR, because the more extended the release, the lower the peak concentration, and the effects of Bupropion are proportional to its plasma concentration. I suppose most doctors would prescribe the XL by default for this reason. In Australia, however, SR is the only version available3, so I had to take 300mg twice daily. This isn’t great more sleep (more on this later) but 300mg is more effective than 150mg. Effects Since starting Bupropion I’ve observed the following positive changes: Anxiety: it didn’t eliminate anxiety, but it did reduce it by about 20%. This is surprising, since for some people Bupropion has the opposite effect and makes them more anxious. Intrusive Thoughts: these were vastly reduced, along with negative self-talk. Low Mood: before starting Bupropion, I occasionally had days where I was in a very low mood. Since starting Bupropion, I’ve not had what I would call a bad day, where I feel terrible and just want to stay in bed. This is distinct from anxiety, which I still struggle with despite the Bupropion: I still have moments of blindingly acute anxiety, but not low mood or depression. Overall most of the time I feel optimistic. Productivity: Bupropion increased my productivity by about 10%-30%. The effect is fairly muted: I don’t feel more energetic, but empirically I can look at my output and see that it has increased. Occasionally, I am able to dedicate an entire day to hyperfocusing on a problem, most of the time, the benefit is I can simply start something and do a few hours of work. Bupropion gave me enough executive function to overcome the worst of ADHD and to allow me to “bootstrap” productivity. Since starting Bupropion, I: Started using a todo list daily and effectively. Became able to consciously form good habits, including doing spaced repetition daily. Became much better at keeping on top of chores, including keeping the apartment clean. So it’s not superhuman productivity, but I can make progress on projects and stay on top of chores. Doing creative wo"
author = "Fernando Borretti"
