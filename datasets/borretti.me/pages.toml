title = "Design of the Austral Compiler"
description = "A high-level walkthrough of the Austral bootstrapping compiler."
full_description = '''Austral is a new systems programming language. It features linear types for safe, compile-time memory and resource management; capability-based security to prevent supply chain attacks; and strong modularity. It is designed with fits-in-head simplicity as the goal. A while back I wrote a post on the lessons I learnt writing the Austral compiler. This post is a more detailed walkthrough of the bootstrapping compiler for Austral. Contents Why OCaml? Requirements Limitations High-Level View Frontend The Concrete Syntax Tree Lexing Parsing Combining Pass Core Errors The Environment Import Resolution The Abstract Syntax Tree Abstraction Pass Extraction Pass Linked Representation Typing Pass Linearity Checking Monomorphization Backend C Representation Code Generation C Rendering Testing Future Work Why OCaml? OCaml is a great language for writing compilers. Like Haskell and other languages in the ML family, its support for sum types and pattern matching makes it very easy to write tree transformations, which is what most of a compiler is. Like Haskell, you can write functional code; unlike Haskell, you can mutate and perform side effects pervasively. And OCaml has Menhir, a really outstanding parser generator on par with Java’s ANTLR. Requirements Short Time to MVP: it’s a bootstrapping compiler, not a production compiler, so the goal is to be able to get to “Hello, world!” as early as possible. Consequently the implementation should be as simple and quick to implement as possible. As a result the compiler is just 12,000 lines of straightforward grugbrained OCaml. Readable: the compiler is written in the least fanciful style of OCaml imaginable. There’s no transdimensional optical profunctors or whatever Haskellers are up to. Hackable: languages evolve most in their early stages. Writing a highly-optimized production compiler would be premature if you end up having to throw out most of it because you changed your mind about some central language feature. So the compiler is designed to be hackable and gradually evolvable, at the expense of semantics-specific optimizations and thus performance. Correctness: the compiler is a reference implementation, so correctness matters above most other things. Limitations The above requirements, which prioritize certain dimensions over others, have some consequences: No Separate Compilation: for simplicity, the compiler is a whole-program compiler. It compiles all source files, in order, from the first one to the last one. Separate compilation is not supported. Batch Compilation: also for simplicity, the compiler is a batch compiler, so there’s no incremental compilation or external symbol database. Everything happens in one long pipeline. Performance: much of the compiler is written in an easily-testable functional style, potentially at the expense of performance. Backend: the backend is just C, which is in turn compiled by a C compiler (though it would not be too much work to “upgrade” this to compile to LLVM IR). High-Level View The following diagram shows the flow of data in the compiler. Blue nodes are source representations, green nodes are compiler passes: Frontend The frontend is the parser, which takes source code and turns it into the earliest tree representation: the concrete syntax tree. After that there’s the combining pass, where the separate module interface and module body are combined into a single object. The parser is written in Menhir, a powerful parser generator for OCaml, and the lexer is writting in ocamllex. The Concrete Syntax Tree The concrete syntax tree is the first tree representation in the compiler, and the one closest to the original source code. It’s defined in the Cst module and it’s just a set of types. The main four types represent: Module interface declarations. Module body declarations. Statements. Expressions. And there’s other auxiliary types. As an example, the sum type that represents expressions looks like this: and cexpr = | CNilConstant of span | CBoolConstant of span * bool | CIntConstant of span * string | CFloatConstant of span * string | CStringConstant of span * string | CVariable of span * identifier | CArith of span * arithmetic_operator * cexpr * cexpr | CFuncall of span * identifier * concrete_arglist | CComparison of span * comparison_operator * cexpr * cexpr | CConjunction of span * cexpr * cexpr | CDisjunction of span * cexpr * cexpr | CNegation of span * cexpr | CIfExpression of span * cexpr * cexpr * cexpr | CPath of span * cexpr * concrete_path_elem list | CEmbed of span * typespec * string * cexpr list | CDeref of span * cexpr | CTypecast of span * cexpr * typespec | CSizeOf of span * typespec | CBorrowExpr of span * borrowing_mode * identifier Every case has a span, which carries source position information, and optionally other data. For example, an arithmetic expression a+b is represented by an instance of CArith, which has four values: the source span, the arithmetic operator +, and the expressions a and b. Analogously, cstmt is the type of concrete statements: and cstmt = | CSkip of span | CLet of span * identifier * typespec * cexpr | CDestructure of span * concrete_binding list * cexpr | CAssign of span * concrete_lvalue * cexpr | CIf of span * cexpr * cstmt * cstmt | CCase of span * cexpr * concrete_when list | CWhile of span * cexpr * cstmt | CFor of span * identifier * cexpr * cexpr * cstmt | CBorrow of { span: span; original: identifier; rename: identifier; region: identifier; body: cstmt; mode: borrowing_mode } | CBlock of span * cstmt list | CDiscarding of span * cexpr | CReturn of span * cexpr Lexing Lexing turns a string into a stream of tokens. For example, a code fragment like if x > 0 gets turned into the token stream IF, IDENTIFIER "x", GREATER_THAN, DEC_CONSTANT "0". Tokens are defined, strangely, in the parser. Tokens that carry no information (like symbols and language keywords) are defined like this: /* Brackets */ %token LPAREN %token RPAREN %token LBRACKET %token RBRACKET %token LCURLY %token RCURLY Tokens that carry a value (like integer literals or identifiers) are defined like this: /* Strings and docstrings */ %token <string> STRING_CONSTANT %token <string> TRIPLE_STRING_CONSTANT /* Identifiers and constants */ ... %token <string> DEC_CONSTANT %token <string> HEX_CONSTANT %token <string> BIN_CONSTANT %token <string> OCT_CONSTANT %token <string> CHAR_CONSTANT %token <string> FLOAT_CONSTANT %token <string> IDENTIFIER Every %token declaration essentially corresponds to the constructors of a token sum type (which you don’t define, but the parser defines it internally): type token = | LPAREN | RPAREN ... | IDENTIFIER of string | STRING_CONSTANT of string The main part of the lexer is the token rule, which associates regular expressions with code that evaluates to a token: rule token = parse (* Comments *) | comment { advance_line lexbuf; token lexbuf } (* Brackets *) | "(" { LPAREN } | ")" { RPAREN } | "[" { LBRACKET } | "]" { RBRACKET } | "{" { LCURLY } | "}" { RCURLY } (* Arithmetic operators *) | "+" { PLUS } | "-" { MINUS } | "*" { MUL } | "/" { DIV } (* ... *) | identifier { IDENTIFIER (Lexing.lexeme lexbuf) } (* etc. *) | whitespace { token lexbuf } | newline { advance_line lexbuf; token lexbuf } | eof { EOF } | _ {err ("Character not allowed in source text: '" ^ Lexing.lexeme lexbuf ^ "'") } Parsing Parsing turns a sequence of tokens into a tree, specifically into the concrete syntax tree. The parser is written in Menhir, which is simple to use although the documentation is lacking: you just write a BNF grammar, and tell it how the right-hand side of each production rule should map to a CST instance. For example: in the cexpr type (the CST type for Austral expressions), the constructor for function calls looks like this: type cexpr = (* ... *) | CFuncall of span * identifier * concrete_arglist That is, it has a code span, the function name, and the argument list, which in turn is defined: type concrete_arglist = | ConcretePositionalArgs of cexpr list | ConcreteNamedArgs of (identifier * cexpr) list With one case for positional argument lists like (x,y,z) and another for named argument lists like (foo => a, bar => b). The parser rule for function calls is: funcall: | identifier argument_list { CFuncall (from_loc $loc, $1, $2) } ; There are two parts to this: the (E)BNF part and and the OCaml code in curly braces. The BNF says the funcall non-terminal is an identifier followed by an argument_list. When this is encountered, this parser will execute the code in the curly braces. This creates a cexpr value through the CFuncall constructor. $loc is a special variable that has the parser’s current location in the input stream, from_loc turns this value into a span. $1 and $2 refer respectively to identifier and argument list (it’s also possible to name them, when that increases clarity). The rules for argument lists work the same way: argument_list: | LPAREN positional_arglist RPAREN { ConcretePositionalArgs $2 } | LPAREN named_arglist RPAREN { ConcreteNamedArgs $2 } | LPAREN RPAREN { ConcretePositionalArgs [] } ; positional_arglist: | separated_list(COMMA, expression) { $1 } ; named_arglist: | separated_list(COMMA, named_arg) { $1 } ; The last two show a useful feature of Menhir: parameterized rules. In this case the pattern of rules for parsing comma-separated lists has been abstracted away and we can just use separated_list(COMMA, <rule>). Combining Pass In the combining pass, the separate CST representations for the module interface and module body are combined into one object, that has one collection of declarations, augmented with visibility information. For example, given the following interface: module Foo is constant Pi: Float32; record Pair: Free is x: Int32; y: Int32; end; type Quux: Free; function zero(): Nat64; end module. And the following body: module body Foo is constant Pi: Float32 := 3.14; union Quux: Free is case Up; case Down; end; function zero(): Nat64 is return 0; end; function infinite(): Unit is return infinite(); end; end module body. The combined representation, if rendered as code, might look something like this: combined module Foo is public constant Pi: Float32 := 3.14; public record Pair: Free is x: Int32; y: Int32; end; opaque union Quux: Free is case Up; case Down; end; public function zero(): Nat64 is return 0; end; private function infinite(): Unit is return infinite(); end; end combined module. Core The core is the largest part of the compiler. It contains the environment, where declarations are stored, and the type checking, linearity checking, and monomorphization passes. Errors Compiler errors are represented as structured values, that contain information about where the error occurred as well as the error message: (** An Austral compiler error. The module name, span, and source context rarely have to be passed in explicitly: they are added where the error is throw in the context of {!adorn_error_with_span}. *) type austral_error = AustralError of { module_name: module_name option; (** The name of the module where the error occurred, if available. *) kind: error_kind; (** The error kind. *) text: err_text; (** The error text. *) span: span option; (** The source span where the error happened, if available. *) source_ctx: source_ctx option; (** The source code where the error happened, if available. *) } The error_kind is something like a “typed title”: (** Represents a category of errors. *) type error_kind = | GenericError (** A generic error. This should be gradually phased out. *) | ParseError (** A parse error. *) | CliError (** An error with the user's command line arguments. *) | TypeError (** A type error. *) | LinearityError (** Signalled when code breaks the linearity rules. *) | DeclarationError (** An error in the structure of a declaration. *) | EntrypointError (** An error with the definition of the program entrypoint. *) | InternalError (** An internal error in the compiler. *) The error message, too, is structured. This is both to reduce the amount of string-fiddling done at error-reporting time, but also to allow me to add HTML error reporting in the future: (** The contents of an error message. *) type err_text = text_elem list (** An individual error text element. *) and text_elem = | Text of string (** Human-readable prose. *) | Code of string (** Austral text, like the name of an identifier or a type. *) | Break (** A paragraph break. *) While the errors are structured values, OCaml doesn’t have monadic error handling, so errors are simply carried by exceptions: (** The exception that carries Austral errors. *) exception Austral_error of austral_error Thrown by the austral_raise function, which takes the error kind and the error text and raises an exception: let austral_raise (kind: error_kind) (text: err_text): 'a = let error: austral_error = AustralError { module_name = None; kind = kind; text = text; span = None; source_ctx = None; } in raise (Austral_error error) Why is the metadata empty? Because it’s added up the call stack. If we had to pass source position/module information everywhere an error is reported, the code would become incredibly noisy. So instead we have the adorn_* functions: (** Run the callback, and if it throws an error that doesn't have a module name, put the given module name in the error and rethrow it. *) val adorn_error_with_module_name : module_name -> (unit -> 'a) -> 'a (** Run the callback, and if it throws an error that doesn't have a span, put the given span in the error and rethrow it. *) val adorn_error_with_span : span -> (unit -> 'a) -> 'a These take some metadata and run a callback, and catch any Austral_error exceptions that are raised. If the error doesn’t have a span or a module name, it gets added and the exception is re-raised. Code should use adorn_error_with_span whenever it has source position information, and in that way, error messages will have the most specific source position possible (from declaration-level to statement-level to expression-level). Graphically: The nodes at the top are call stack frames. The black arrows are function calls, the red arrows represent errors going up (left in the diagram) as the call stack is unwound. The Environment The environment is the center of the compiler’s universe: it’s the database that stores all information about user-written code. Externally, the Env module exports an env type and some functions. The environment has a simple CRUD API, and environment updates are functional: inserting or modifying a record returns a new value of type env. Internally, the environment is a collection of tables, with rows pointing at other rows in the same or other tables, kind of like a manual implementation of an SQL database. And like a typical SQL database, every object has a unique numeric ID that is automatically generated on insertion. The tables are: The file table. The module table. The declaration table. The method table. The monomorph table. The file table '''
