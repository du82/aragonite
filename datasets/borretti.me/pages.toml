title = "Effective Spaced Repetition"
description = "“To flash conviction on the mind.”"
full_description = 'You won’t get smarter by drilling IQ tests or playing the violin. Dual n-back probably won’t improve your working memory. But you can remember anything you choose to with spaced repetition. Spaced repetition is, by far, the most effective cognitive hack I’ve used. It used to be that I’d read a book and afterwards remember almost nothing. Sometimes I’d take Kindle highlights, or notes, but never review them. And I hoped that though I could not necessarily name what I recalled (because whose memory has an index?) that somehow the important information was woven into my knowledge, tacitly. This is mostly a cope. I love learning, and spaced repetition has helped me become extremely good at it. But it took a long time to become effective at it. There’s a lot of advice on the Internet on how to do it effectively, most of which is phrased in terms of very general principles, but very few concrete examples. But what people struggle with is: how do I turn this specific, concrete piece of information into a set of flashcards? This post describes the rules I use to write effective flashcards, with as many examples as I could reasonably find. \[\def\set#1{\{#1\}}\] Contents Overview of Spaced Repetition Limiting Factors Habit Formation Card-Writing Skills Words of Encouragement Rules Rule: Understand First Rule: Be Honest Rule: Keep It Fun Rule: Repeat Yourself Rule: Organize by Source Rule: Write Atomic Flashcards Rule: Write Two-Way Questions Rule: Ask Questions in Multiple Ways Rule: Concept Graphs Rule: Cache Your Insights Rule: Learning Hierarchies Rule: Learning Sequences Examples Example: Magma Formation Example: Plate Tectonics Example: Neural Cells Example: Neuron Types Example: Vector Spaces Example: Parity Group Example: Logical Consequence Example: Periodization Example: Rational Numbers Example: Regular Expressions Example: Voltage Example: Isomers Example: Months of the Year Example: Powers of Two Example: Rilke Example: Pharmacology Example: Misc. Examples Scripts Sequence Script Poetry Script Software Prior Art Conclusion Overview of Spaced Repetition The idea is mechanically very simple: as you learn things, you write flashcards, which are question/answer pairs. Then you review them: you look at the question, recall the answer, and turn the card over to see the answer. Then you grade yourself: did you recall correctly or incorrectly? If you keep recalling correctly, the review interval grows longer; if you get it wrong, the interval gets shorter. Some people use paper cards, most people use software such as Anki, because the algorithm schedules reviews efficiently, so you don’t over-review material. Unless you have a paper fetish, just use software. Limiting Factors If you’re so smart, why aren’t you rich? Or: if spaced repetition is so effective, why doesn’t everyone do it? Why isn’t it as common as drinking coffee? There are two main limiting factors to effective spaced repetition. Habit Formation For spaced repetition to be useful, it has to be a habit. I drill flashcards every day as part of my morning routine. But habit formation is difficult, doubly so for people who have ADHD or are low in conscientiousness. The reason you have to do it every day is that the spaced repetition algorithm schedules the reviews for you, freeing you from having to do that manually. But you don’t know what cards are due in a given day until you open the app. And if you skip a day, those cards pile up and are due the next day. A common failure mode (and I did this more than once, before I got the hang of it) is to use Anki for two weeks, then drop it, and pick it back up six months later only to find you have 600 cards due for review. This is not encouraging, and it defeats the point of spaced repetition, which is to review the cards on the intervals the algorithm chooses. I don’t have much advice in this area, except that if you have persistent problems with conscientiousness, untreated ADHD etc. you should address that first. Card-Writing Skills Writing effective flashcards is a skill that took me a while to acquire. Many of the cards I wrote in the first four or six months of using spaced repetition consistently turned out pretty much useless, and this can be frustrating. The main reason to write this post was to communicate the lessons I learnt so you can jump in to using spaced repetition effectively from the start. One reason this can be frustrating is you’ll often remember a flashcard for the first few weeks of it (when you’re seeing it with high frequency), but after a couple of months, you start failing it. It didn’t take root in your long term memory, because it was poorly written in some way. And this long feedback cycle means it takes time to acquire these skills through trial and error. Words of Encouragement Learning is an automatic, instinctual process. It’s a fundamental feature of intelligence. It’s a testament to how bad schooling is that people think they have to have a special kind of brain to learn effectively, and that the idea of learning triggers aversion in people. Remember the words of Feynman: “what one fool can do, another can”. Rules Here are my rules for effective spaced repetition. The rules are sorted by applicability (but not necessarily importance), with the more general ones first, and most specific ones last. Because many of the examples involve multiple rules at the same time, I decided to list the examples separately from the list of rules. Rule: Understand First Don’t try to memorize what you don’t understand. The concepts should be clear in your head before you try to commit them to memory. “Clear” can be a fuzzy thing. What I tend to do is: dig, expand, and clarify the text until I’m comfortable I have a good grasp of this region of the concept graph, and then write the flashcards. Often, when reading a book, you can’t write the flashcards exactly as you read the text, because further information can clarify or tie together important concepts. It can be useful to keep a scratchpad where you write tentative flashcard text as you read a chapter, and at the end you organize and re-organize your scratchpad until you can commit it to flashcards. Rule: Be Honest The software doesn’t know whether you recalled something correctly or not. You are only accountable to yourself. If you recalled something wrong, or not quite right, err on the side of caution and mark it forgotten. Rule: Keep It Fun This is crucial to maintaining the habit. If reviewing flashcards feels like a chore, you will become averse to doing it. I used to frequently have this problem. I solved it in a few ways: Having a diverse knowledge base you’re drilling helps, so you are not bored by going through the same topic for a long time. Typically, spaced repetition software will shuffle the cards, so that if you’re drilling all the cards across all decks, you will be surprised often. A common source of frustration is cards that are too long to recall quickly, and thus feel like a chore. Break big cards down into smaller cards. It feels good to be able to fly through the cards quickly. Cards that are difficult to recall are very frustrating. I solved this by applying the rules described in this post. Rule: Repeat Yourself Memory is frequency times volume. Individual cards should be extremely brief, but your deck as a whole can be as repetitive as you want. Rule: Organize by Source Organize content by source, not topic. The reason is you’ll often bring in information from multiple sources: multiple textbooks, plus Wikipedia, plus lecture notes, etc. Each one of these sources likely has a different way of organizing knowledge. Don’t waste time trying to find the perfect ontology. Make a deck for each source. In the case of textbooks, make a sub-deck for each chapter. In the case of math textbooks, possibly make a sub-sub-deck in each chapter to put theorem cards. This also makes it easier to keep track of how far along you got into a text. Rule: Write Atomic Flashcards Cards should be short. They should refer to as little information as possible. They should be like chemical bonds, linking individual atoms of knowledge. This is the most important thing. By far the worst failure mode is to put too much in a flashcard. There’s two reasons for this rule: Larger cards are harder to remember. It’s harder to objectively grade yourself: when you reveal the answer, you might have got some things right and some things wrong. If you click forget, you will be over-reviewing the parts you already know. If you click remembered, you will under-review the parts you forgot. There is one exception to this: you can have big cards if you also have smaller cards that add up to the same information. You can think of the larger card as testing that you can collate the information from the smaller cards. Rule: Write Two-Way Questions When possible, ask questions in two directions. Whenever you have a term with a definition, the obvious thing to do is to ask for the definition from the term, e.g.: Q: What is the order of a group? A: The cardinality of its underlying set. But you can also ask for the term from the definition, e.g.: Q: What is the term for the cardinality of a group? A: The group’s order. When you have some notation, like $\mathbb{R}$ for the real numbers, or $\dim V$ for the dimension of a vector space, the natural thing to ask is what the notation means. Q: What does $\mathbb{R}$ stand for? A: The set of real numbers. You can also ask the question backwards: Q: What is the notation for the set of real numbers? A: $\mathbb{R}$ Rule: Ask Questions in Multiple Ways Ask questions in multiple ways. Ask for formal and informal definitions of terms. Ask for the formal and informal statements of a theorem. Ask questions forwards and backwards. Add contextual questions: “what is the intutition for [concept]?”. Add questions that link different concepts across your knowledge graph. The more interlinked your knowledge graph is, the better. Rule: Concept Graphs It can help to visualize the concepts you’re acquiring as being like a graph, where each node represents a discrete concept having certain properties, and the edges in the graphs are questions which get you from one concept to another. Rule: Cache Your Insights When studying, you will often infer new knowledge that is not explicitly written down in the text by thinking about what you’ve just read. After verifying that your inference is actually true, it can be helpful to “cache your insight”—to make a flashcard for that new discovered piece of knowledge. Rule: Learning Hierarchies A lot of knowledge is hierarchical, of the form “Foo can be either A, B, or C”, or, dually, “A is a kind of Foo”. By analogy to OOP: these concepts are joined by superclass and subclass relations. The idea is to ask questons in the top down direction (“What are the subclasses of Foo?”) and the bottom-up direction (“What is Bar a subclass of?”). This ties into keeping flashcards atomic. Even when some information is not hierarchical, intrinsically, breaking down large flashcards into smaller flashcards is fundamentally building a hierarchy of flashcards. Rule: Learning Sequences In general, to learn a sequence $(A_1, \dots, A_n)$, you want to generate the following flashcards for each $i \in [1,n]$: Question Answer What is the $i$-th element? $A_i$ What is the position of $A_i$? $i$ What element comes after $A_i$? $A_{i+1}$ What element comes before $A_i$? $A_{i-1}$ You might also want: A test card: a flashcard asking you to recite the sequence from beginning to end. A cloze sequence: flashcard with a cloze deletion for each element in the sequence, to fill in the blank given the context. The sequence script can generate these for you. How thorough you want to be depends on the nature of the information. Most of the time I use a cloze card and a test card. Another type of card you might use (I use this to memorize poems) is a card that gives you some context (the previous one or two items in the sequence) and asks you to fill in the blank. For example, if you wanted to learn the sequence (A, B, C, D), you might have these flashcards: Question Answer Beginning, … A Beginning, A, … B A, B, … C B, C, … D The poetry script can generate these for you. Examples Many of these examples are overkill: we collect a lot more flashcards than the subject deserves. But this is to illustrate the general rules. With experience, you can learn how many questions a particular topic requires, and different volumes of your knowledge graph will be more or less interlinked. Example: Magma Formation From my geology notes: Magma is liquid rock under the Earth’s surface. The three magma-forming processes are: Increasing Temperature: increasing temperature can melt rock. Decreasing Pressure: when the pressure drops, atoms are more free to move, and rock becomes liquid. Addition of Water: water lowers the melting point of rock, because the water molecules disrupt the crystal bonds. Magma forms in three places: Hot spots: as hot rock rises, pressure decreases and it becomes magma. Rift zones: as tectonic plates are pulled apart, hot rock rises (because it is less dense) to plug the gap and melts due to decreasing pressure. Subduction zones: water-rich ocean lithosphere sinks into the mantle. The water heats up and rises, adding water to the overlying rock, which the melts. Let’s break this down hierarchically. We want to memorize three things: What magma is. How it forms. Where it forms. First, the definition: Question Answer What is magma? Liquid rock under the Earth’s surface. What is the term for liquid rock under surface of the Earth? Magma. Second, we want to know how magma forms. A common mistake here would be to put the magma-forming processes and their explanations in the same flashcard. Rather, to keep each card as small as possible, we want to separate the list of processes from their definitions. So we first as for a list of mechanisms: Question Answer What are the magma-forming processes? Increasing temperature, decreasing pressure, addition of water. And then we ask for an explanation of each. We don’t really need to ask why adding temperature melts rock: Question Answer Why does decreasing pressure melt rock? Because the atoms are more free to move. Why does adding water lower the melting point of rock? Because water molecules disrupt the bonds in the rock minerals. Third: where magma is found. Again, we separate the list from the details: Question Answer Where does magma form? Over hot spots, in rift zones, and in subduction zones. Then we ask for details. For each place where magma forms, we ask both which processes are involved, and what the full causal explanation is. We also ask the question backward: which places involve a given process. Question Answer What magma-forming process happens over a hot spot? Pressure-release melting. What magma-forming process happens in a rift zone? Pressure-release melting. What magma-forming '
