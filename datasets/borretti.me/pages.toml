["https://borretti.me/article/inheritance-disjunctions"]
title = "Inheritance and Disjunctions"
description = "A case study in porting a compiler."
full_description = '''I recently began porting a compiler from Common Lisp to Standard ML. This was the class hierarchy representing types in the original compiler: (defclass base-type () () (:documentation "Base class of types.")) (defclass scalar (base-type) () (:documentation "Base class of scalar types.")) (defclass unit (scalar) () (:documentation "The unit type.")) (defclass boolean-type (scalar) () (:documentation "Boolean type.")) (defclass integer-type (scalar) ((signed :reader integer-signed-p :initarg :signedness :type boolean :documentation "Whether the integer is signed or not.") (width :reader integer-width :initarg :width :type (integer 8 64) :documentation "The integer bit width.")) (:documentation "Integer types.")) (defclass floating-point-type (scalar) () (:documentation "The base class of IEEE 754 floating-point types.")) (defclass float-32 (floating-point-type) () (:documentation "32-bit wide binary floating point type.")) (defclass float-64 (floating-point-type) () (:documentation "64-bit wide binary floating point type.")) (defclass pointer (scalar) ((base :reader pointer-base :initarg :base :type base-type :documentation "The pointed-to type.") (region :reader pointer-region :initarg :region :type region :documentation "The pointer's region.")) (:documentation "A pointer.")) (defclass region () ((name :reader region-name :initarg :name :type string :documentation "The lexical name of the region.")) (:documentation "The base class of regions.")) (defclass region-parameter (region) () (:documentation "A region parameter appearing in a generic type specifier.")) (defclass lexical-region (region) ((id :reader region-id :initarg :id :type integer :documentation "The unique ID of the region.")) (:documentation "A region created with the letregion construct.")) (defclass composite (base-type) () (:documentation "Base class of composite types.")) (defclass fixed-array (composite) ((type :reader array-type :initarg :type :type base-type :documentation "The type of the array elements.") (length :reader array-length :initarg :length :type (integer 0) :documentation "The length of the array.")) (:documentation "Fixed-size arrays types.")) (defclass tuple (composite) ((types :reader tuple-types :initarg :types :type (vector base-type) :documentation "The types of the tuple's elements.")) (:documentation "Tuple types.")) This was my initial translation to Standard ML: datatype ty = Unit | Boolean | Integer of signedness * bit_width | Float of float_size | Pointer of ty * string | FixedArray of ty * int | Tuple of ty list and signedness = Unsigned | Signed and bit_width = Bit8 | Bit16 | Bit32 | Bit64 and float_size = F32 | F64 From ninety lines of code to a seven line-long sum type, and some auxiliary definitions. This is a marked improvement, although much of it is attributable to my obsessively filling the :documentation options in both slot and class definitions. A number of things other than size have improved: the use of a Boolean in the definition of the integer-type class was replaced with the signedness datatype (see Boolean blindness for a justification), and the integer bit-width is now restricted to four symbolic choices, as opposed to the coarser type (integer 8 64). The use of more domain-specific types obviates the need for documentation: there is no need to write a docstring saying the bit-width of an integer is a power of two between eight and sixty-four if the types don’t allow anything else. Languages in the ML family make it so easy to define types that they encourage you to do so, whereas object-oriented languages encourage1, due to the syntactic cost of class definition, a one-size-fits-all approach to data representation. The problem with this is the resulting class hierarchy begins to accumulate extraneous subclasses which are only useful in very particular contexts, but must be handled universally. By way of example in the same problem domain: consider a compiler for some hypothetical language with higher-order types, and a function monomorphize, best explained with a (pseudocode) type signature: monomorphize :: (t: PolymorphicType, r: Map<String, MonomorphicType>) -> Option<MonomorphicType> In others: it takes a polymorphic type expression (one containing type parameters), a map of type parameter names to their corresponding arguments, and returns a fresh monomorphic type expression where all type parameters have been replaced with their arguments. If a type parameter is not mentioned in the map, it fails by returning the empty case of the Option type. In a Common Lisp implementation of this compiler, there would be no question of writing a completely new class hierarchy of types for each individual purpose, because the definitions would’ve dwarfed the rest of the code.2 The monomorphize function would have taken an instance of a subclass of base-type and a hash table as arguments, and returned another instance of a subclass of base-type. This lack of specificity leaves the code open to errors: there is no way to statically guarantee that the resulting type doesn’t have left-over, unexpanded type parameters, for example. Another unfavourable effect of using a single class hierarchy throughout different transformations is that subsets of the hierarchy’s subclasses often have an implicit lifetime throughout the data’s lifetime. Using many different fine-grained datatypes, it becomes evident when in the compiler’s chain of passes a particular case (subclass) of the data ceases to be. In an object-oriented program, this information is usually implicit, or at best documented in comments or docstrings. Whereas in languages of the ML family, where type definitions are cheap, it’s feasible to have different datatypes for slightly different purposes. In a Standard ML version of this compiler, there could be a type_spec datatype to represent type specifiers (expressions that denote types), a poly_type datatype to represent types with type parameters, a mono_type datatype to represent monomorphic types, and yet another exp_type datatype to represent the immediate type of expressions.3 These types would have essentially the same cases except for very small deltas (e.g., a case for type parameters in poly_type but not in mono_type), but it’s in those deltas where type safety lies. For example, in a Standard ML implementation of this compiler, the monomorphize function would look like this: fun monomorphize (t: poly_type, r: replacements): mono_type result There is no possibility, for instance, of forgetting to recur in the subterms of some case of poly_type and ending up with a result that contains unexpanded type parameters, because the result is an instance of mono_type, which contains no case for a type parameters. In a Common Lisp implementation of this compiler, with a sole omnipresent class hierarchy of types, such a defect would have to be explicitly tested for. These benefits stem from the ease with which sum types can be defined. And when type definition is expensive, you see what litters so many object-oriented codebases: raise Error("Impossible"), whenever a method is called with an instance of a subclass which should have disappeared many passes ago. With static types, and with cheap types, whole categories of errors are erased by making huge volumes of the state space unrepresentable. Another example, again from my compiler port: in the Common Lisp compiler I had a function to parse a type specifier in the form of an S-expression into an instance of base-type. The parser function took both an S-expression and an instance of the type environment (the map of type names to their definitions) as parameters, and looked like this: ;; Notes: the type `node` is `(or list identifier integer float)` (declaim (ftype (function (node environment) base-type) parse-type-specifier)) (defun parse-type-specifier (form environment) (if (atom form) ;; We're dealing with a named type, which is either built in, or defined ;; in the environment (parse-named-type form environment) ;; Type constructor. Since we have no higher-order types, this must be ;; built-in. (parse-type-constructor form environment))) (declaim (ftype (function (node environment) base-type) parse-named-type)) (defun parse-named-type (form environment) (unless (identifier-p form) (error "This form is not a valid type specifier.")) (let ((name (identifier-name form))) (values ; Avoids a 'type assertion too complex to check' warning (switch (name :test #'string=) ("unit" (make-instance 'unit)) ("boolean" (make-instance 'boolean-type)) ("u8" (make-instance 'integer-type :signedness nil :width 8)) ("i8" (make-instance 'integer-type :signedness t :width 8)) ("u16" (make-instance 'integer-type :signedness nil :width 16)) ("i16" (make-instance 'integer-type :signedness t :width 16)) ("u32" (make-instance 'integer-type :signedness nil :width 32)) ("i32" (make-instance 'integer-type :signedness t :width 32)) ("u64" (make-instance 'integer-type :signedness nil :width 64)) ("i64" (make-instance 'integer-type :signedness t :width 64)) ("f32" (make-instance 'float-32)) ("f64" (make-instance 'float-64)) (t ;; Not a built in type, so look it up (or (get-type name environment) (error "No type with name ~A is defined." name))))))) (declaim (ftype (function (node environment) base-type) parse-type-constructor)) (defun parse-type-constructor (form environment) (let ((fn (first form))) ;; We know it's non-empty since (atom nil) => t (unless (identifier-p fn) (error "The first element of a type constructor must be an identifier.")) (let ((name (identifier-name fn)) (args (rest form))) (switch (name :test #'string=) ("pointer" (destructuring-bind (base-type region) args (values (make-instance 'pointer :base (parse-type-specifier base-type environment) :region (parse-region region))))) ("tuple" (values (make-instance 'tuple :tupes (mapcar #'(lambda (form) (parse-type-constructor form environment)) args)))) (t (error "No type constructor with this name ~A." name)))))) (declaim (ftype (function (node) region) parse-region)) (defun parse-region (form) (if (identifier-p form) (values (make-instance 'region-parameter :name (identifier-name form))) (error "Invalid region name."))) Note: The vain attempts at adding type safety through the use of declaim. SBCL has a very good type inference engine, especially when aided by type declarations, but even moderately complex code results in warnings that a type assertion is “too complex to check”. The liberal use of values in the code is a folk remedy for suppressing the warnings.4 The “notes to self” along the lines of “we know this expression must be true because an earlier test, etc.” These are attempts to convince oneself of the code’s soundness without mechanical aid. The use of exceptions, and this is key: in languages of the ML family, it’s nothing at all to define a new datatype specifically to represent the output of a function doing tricky input validation.5 It would be a sum type along the lines of: datatype type_result = Success of ty | NoSuchNamedType of string | InvalidForm of sexp In object-oriented code, however, defining a class hierarchy with a base class, a subclass whose sole purpose is to contain another object, and a slew of subclasses carrying error information is never idiomatic. Instead, the idiomatic approach is to define a class hierarchy of exceptions, raise them as needed, and catch them when appropriate. But exceptions escape the type system6, so to know which volumes of the code are exception-free, and what kind of exceptions you might encounter at any point, you have to rely on your own memory, or an IDE that’s deeply integrated with the implementation. Here’s roughly the same code in the Standard ML port of the compiler: fun parseTypeSpecifier (Identifier name) = SOME SNamedType s | parseTypeSpecifier (SList (tycon::args)) = parseTypeConstructor (func, args) | parseTypeSpecifier _ = NONE and parseTypeConstructor (Identifier "pointer", base::(StringLiteral s)::nil) = (case (parseTypeSpecifier base) of SOME typespec => SOME (SPointer (typespec, s)) | _ => NONE) | parseTypeConstructor (Identifier "tuple", args) = let val parsed = map parseTypeSpecifier args in if (List.all Option.isSome parsed) then SOME (Tuple List.mapPartial (fn x => x) parsed) else NONE end end | parseTypeConstructor _ = NONE For completeness, the definitions of the types involved: datatype cst = Identifier of string | IntegerLiteral of string | FloatLiteral of string | StringLiteral of string | SList of cst list datatype type_specifier = SNamedType of name | SPointer of type_specifier * string | SNamedType of name The code is far more compact. The parsing function no longer references an environment because it no longer needs to: rather than parse an expression to a type directly, the function parses an expression to a datatype representing a type specifier, not a type.7 Named types are not searched in the environment and are simply turned into SNamedType instances. Another function, further down the line, takes the tree representing the type specifier and the environment and turns it into a proper type expression, in turn checking whether named types actually exist.8 Concluding Remarks The conjunction of unceremonious type definition, sum types with exhaustiveness checking, and monadic error handling is a tremendously powerful multiplier of programmer ability. Taken together, they make it straightforward to write total functions which statically erase large classes of errors. Exhaustiveness checking is often presented as a benefit of pattern matching but has more to do with the nature of sum types. In a language like Common Lisp, which solves the expression problem by completely separating classes and methods, either can be defined at any time and independently of each other. But when extending some software object by defining new classes, the programmer has to know ahead of time which methods they have to implement for it, which ones have sensible defaults for either any value or the superclass they’re inheriting from, etc. Languages where methods are bound to classes are strictly less powerful, but the statically-typed variety warn the programmer when a subclass hasn’t defined a necessary method. A limitation of sum types is that, unlike classes, new cases cannot be defined after the initial definition. This induces different design decisions, but is not a showstopper: if need be, dictionary passing and generic types provide for data extensibility.9 A follow-up post will expand on the idea of using precise sum types to make illegal states unrepresentable. Acknowledgements Tim Herd helpfully proofread this post. Footnotes Scala is somewhat exempted from this criticism. ↩ As a digression, I think most “OOP vs. FP” debates are Bible salespeople talking past each other, but there is an argument from Paul Graham which is underdiscussed and fits this case study perfectly: Object-oriented programming generates a lot of what looks like work. Ba'''
author = "Fernando Borretti"
year_published = 2017
year_updated = 2025
