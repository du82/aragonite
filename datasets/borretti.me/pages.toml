["https://borretti.me/article/how-australs-linear-type-checker-works"]
title = "How Austral’s Linear Type Checker Works"
description = "A walkthrough of Austral's linearity checker algorithm."
full_description = 'What I cannot create, I do not understand. — Richard Feynman Austral is a new programming language featuring linear types and capability-based security. Linear types give you compile-time memory and resource safety, capability-based security allows you to constrain the kind of side effects a program can do. In my last post, I introduced the language and went over what linear types are, how they work, and the rules that characterize them. In this post, I’ll explain linear types from another perspective: the compiler’s point of view. That is, how does the Austral compiler actually enforce the linearity rules? This article is a walkthrough of the Austral compiler’s linearity checker; the compiler pass that enforces the linear type rules. Contents The Goal What Linear Types Are Use-Once Rules Variable Discarding Expression Discarding If Statements Case Statements Loops A Brief Comment on Loops Paths Returning Borrowing: Overview Reference Types Borrowing: The Shorthand Syntax Borrowing: The General Syntax The Algorithm, In Prose The Algorithm, In Code Entrypoint The State Table Statement Checking Expression Checking Counting Appearances Conclusion The Goal We want one language feature that gives us: No memory or resource leaks. Memory safety without runtime checks or garbage collection. Resource safety: file handles, sockets, database handles etc. are guaranteed to be closed properly and there are no use-after-free errors, without runtime checks. Safe concurrency. Capability-based security. The ability to enforce high-level protocols in APIs, e.g. that certain operations can’t be performed multiple times, or must be performed in a particular order. And all this should be done at compile time, with no runtime cost, and it should be as fast as C, and the rules should be simple enough they fit in a page of text. And the implementation should be simple enough for anyone to understand. Linear types are this feature. The rules fit in a page. The implementation of Austral’s linearity checking algorithm is 600 lines of OCaml, much of which is error reporting, comments, and utility functions. What Linear Types Are I don’t want to endlessly repeat introductory information, because that leads to fragmentation (i.e. which of these ten articles should I read?), so for an overview of linear types, check Introducing Austral. Use-Once Rules A linear type is a type whose values must be used once. Not zero times or multiple times: once and exactly once. How do we enforce this at compile time? We can understand this on a case-by-case basis, in order to gradually build up a general set of rules. For the remainder of this section, let: Lin be some linear type. make() be a function that takes no arguments and returns an instance of Lin. consume() be a function that takes an instance of Lin, consumes it, and returns nothing. In Austral syntax: type Lin: Linear; function make(): Lin; function consume(x: Lin): Unit; Variable Discarding The simplest case is something like this: let x: Lin := make(); Here, we’re declaring a variable x of type Lin, and its initial value is the result of evaluating make(), which is a value of type Lin. So from the type checker’s perspective this checks out: the type on the left is the same as the type on the right. But the linearity checker will reject this code because the variable x is used zero times. And that gives us our first rule. Rule 1: Variables of a linear type cannot appear zero times in the scope in which they are defined. To make the compiler happy, we should rewrite the above to this: let x: Lin := make(); consume(x); Then x is used once and the rules are respected. Expression Discarding A kind of corollary to the above is we can’t do this either: make(); Here, we’re calling make() and discarding its result. Obviously this is not allowed, because while the value is not bound to any variable, it is still a value of a linear type and it’s still being discarded. So we get another rule: Rule 2: values of a linear type cannot be silently discarded. If Statements “Used once” does not mean “appears once”. Consider this: let x: Lin := make(); if foo then consume(x); else -- Do nothing. skip; end if; The compiler will reject this. Here, x appears once in its scope, but it is not used once: it’s used once if foo is true and zero times otherwise. To make this code pass, we have to write: let x: Lin := make(); if foo then consume(x); else consume(x); end if; Which leads us to another rule: Rule 3: linear variables (i.e.: variables of a linear type) defined outside an if statement must be used consistently in all branches: they must either be consumed in every branch or appear zero times in every branch. Note that this is perfectly fine: if foo then let x: Lin := make(); consume(x); else -- Do nothing. skip; end if; Because the variable exists only in one branch of the if statement, it is created there and consumed there, once and exactly once. The key distinction here is whether the variable was defined outside the statement. Case Statements case statements are just if statements but for taking apart sum types. So if we had: let x: Lin := make(); case binary of when One do consume(x); when Zero do -- Nothing. skip; end case; Again the compiler will reject this, for the obvious reason: like the branches in an if statement, the cases of a case statement are all disjoint, and therefore linear variables defined outside the statement must be used consistently inside of it. Which leads to a rule analogous to the previous one. Rule 4: linear variables defined outside a case statement must be used consistently in all when clauses, that is, they must either be consumed in every clause or appear zero times in every clause. Loops Consider: while true do consume(x); end while; The problem here is that x is being consumed an infinite number of times, which is obviously contrary to the rules. Then: Rule 5: linear variables defined outside a loop cannot be consumed inside the loop. Note that this is also fine: while true do let x: Lin := make(); consume(x); end while; Because x is being created inside the loop, and definitely consumed once. Each iteration of the loop has a new and distinct value of x. A Brief Comment on Loops What about this? let x: Lin := make(); let cond: Bool := true; while cond do cond := false; consume(x); end while; Here, it is obvious that the loop executes only once, and therefore the compiler could prove that x is consumed exactly once. The compiler will still reject this. Why? Because there is an infinite number of cases like this, where the code lies just outside the rules, where a compiler could be expected to apply “common sense” and be more lenient. Each of these special cases requires a new heuristic be added to the compiler, heuristics which must be maintained over time and which can interact with each other in unpredictable ways. This is not just a problem for compiler engineers, it’s a problem for anyone learning or using the language, because there is an ocean of difference between a small set of simple rules vs. an ever-growing pile of heuristics. The former you can understand, the other you can only get used to. Paths This rule is a concession to usability. Consider a Linear record with Free contents: record Position: Linear is x: Int32; y: Int32; end; Then, if we have a variable pos: Position, we can do something like this: print("x = "); printLn(pos.x); print("y = "); printLn(pos.y); And this doesn’t count as consuming the value, because we’re only accessing the Free components. Rule 6: a record access expression that starts with a linear variable doesn’t count as consuming the variable if it ends in a Free value. Returning The next rule is simple. We can’t do this: let x: Lin := make(); return foo; Because we would be discarding x. Then: Rule 7: every linear variable in scope must have been consumed when execution reaches a return statement. Borrowing: Overview The linearity rules are very onerous. For example, imagine a generic List type: type List[T: Type]: Linear; If we wanted to write a function to get the length of a list, we couldn’t write: generic [T: Type] function length(list: List[T]): Index; This function would have to consume and deallocate the list just to return its length1. And if the list has linear contents, it wouldn’t know how to consume them. We would have to do this: generic [T: Type] function length(list: List[T]): Pair[Index, List[T]]; Where the return type contains the length and the original list again. This isn’t ideal. Borrowing allows us to suspend linearity in a safe way. We can take free (copyable) references to linear types, pass them around, store them in data structures, access (free) data through them. Mutable references can even edit the contents of linear values. And references are limited in such a way that they cannot escape the lifetime of a linear value: the compiler ensures that by the time a linear value is consumed, every reference is no longer available. Reference Types There are two reference types: immutable references and mutable references. Both reference types have two generic type parameters: the type of the thing they point to, and the region the reference is in. A region is like a type tag that is used by the compiler to ensure references do not outlive the thing they point to. The syntax is: &[T, R] is an immutable reference to a type T in the region R, and &![T, R] is the mutable reference analogue. Borrowing: The Shorthand Syntax There are two ways to do borrowing: a shorthand form that works for most cases, and a more general but more verbose form. Suppose we have a function foo that takes an immutable reference to a Lin value and returns nothing: generic [R: Region] function foo(ref: &[Lin, R]): Unit; Then we can write something like this: let x: Lin := make(); -- Create foo(&x); -- Borrow consume(x); -- Consume The shorthand syntax is &x for taking an immutable reference, and &! for a mutable reference. Naturally we can’t do this: let x: Lin := make(); consume(x); foo(&x); Because x is being borrowed after being consumed. Thus: Rule 8: borrowing cannot happen after consumption There is another restriction, but this one doesn’t require an explicit rule, it’s just something that won’t typecheck in the first place. We can’t do this: let x: Lin := make(); let ref: &[Lin, R] := foo(&x); consume(x); -- Do something with `ref`, after the thing it points to -- has been consumed. bad(ref); This won’t even reach the type checker: the compiler will complain it doesn’t know what R is, since it has never been defined. When borrowing using the shorthand syntax, the region the reference belongs to is a region without a name, that can’t be referred to. The function foo is generic over the region, so it doesn’t need to know the region name to accept the reference. Inside foo you can do almost anything with the reference: pass it around, transform it, store it in data structure (as long as that data structure’s lifetime does not exceed the execution of foo) and extract it. But the reference cannot escape its call site, because it’s type cannot be written, and therefore it can’t be stored in some variable or data structure that survives the call to foo. And the way Austral ensures that references do not outlive the thing they reference is very simple. There’s no need to do sophisticated control flow analysis. There’s no way to write the type of a reference outside the scope where that reference is defined, therefore, you can’t define a variable that can hold a reference past its scope, you can’t design a data structure that can capture a reference and hide it internally. There is one more restriction, and this is to ensure we can’t have multiple mutable references live at once (this will be important for multithreading). The restriction is we can’t write something like: doSomething(&!x, &!x) Rule 9: the same variable cannot be borrowed mutably multiple times in the same expression. Borrowing: The General Syntax The shorthand syntax covers 95% of the cases of borrowing. But sometimes it’s convenient to be able to write the type of the reference, if we’re doing complex control flow or data flow. This is where the borrow statement comes in: let x: Lin := make(); borrow x as ref in R do -- Here, we can refer to the region by -- its name, `R`. let ref2: &[T, R] := transform(ref); end; consume(x); In the shorthand syntax, regions have no name. In the borrow statement, regions are given a name, which exists within the body of the region. Again, references cannot escape the borrow statement, because the following: let escape: &[T, R] := ...; borrow x as ref in R escape := ref; end; The compiler won’t even get to the borrow statement, it will stop at let and complain that R is not defined. And, analogously, we can’t do this: borrow x as ref in R -- ... end; let bar: &[T, R] := ...; Because R is not defined outside the borrow statement. And, again, we can’t borrow after consumption: let x: Lin := make(); consume(x); borrow x as ... Because Rule 8 applies to the general syntax, too. There are two more restrictions that have to be enforced explicitly. The first one is obvious: let x: Lin := make(); borrow x as ref in R do consume(x); end; Rule 10: a linear variable cannot be consumed in a borrow statement that borrows it. The second restriction is analogous to Rule 9. We can’t do this: let x: Lin := make(); -- `borrow!` is the mutable version of `borrow` borrow! x as ref1 in R do borrow! x as ref1 in R do consume(x); end; end; Rule 11: you can’t mutably borrow a variable that is already mutably borrowed. The Algorithm, In Prose Putting all the previous rules together, we can now describe the linearity checking algorithm. For simplicity, I’ll describe the narrow case, where we consider one variable at a time. Given: x: a variable of some linear type. b: the block of code where the variable is defined, i.e., its scope. Let: s: the variable’s consumption state, which is one of Unconsumed, BorrowedRead, BorrowedWrite, or Consumed. Initially this is Unconsumed. d: the current loop depth, a natural number. Initially this is zero. Start: traverse b in execution order, that is, depth first, and at each statement: Go through each expression e that appears in the statement in evaluation order, and count the number of times x appears in e. There are four ways x can appear in an expression: being consumed, being borrowed mutably, being borrowed immutably, or appearing at the head of a path. If x does not appear in e, continue. If x is consumed in e, set s := Consumed as long as the following are true, and otherwise signal an error: x only appears once in e (can’t consume multiple times). s = Unconsumed (can’t consume if it’s borrowed, or already consumed). d = 0 (we’re not consuming the variable inside a loop). If x is borrowed mutably, check that the following are true, or signal an error: s = Unconsumed (can’t borrow if it’s consumed or already borrowed) x is only '
