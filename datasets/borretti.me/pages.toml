title = "Introducing Austral: A Systems Language with Linear Types and Capabilities"
description = "Introducing a new programming language."
full_description = 'Austral is a new systems programming language. You can think of it as Rust: The Good Parts or a modernized, stripped-down Ada. It features a strong static type system, linear types, capability-based security, and strong modularity. This article is an introduction to the language. The first few sections are high-level: they are about the design and the mindset of the language. The next two sections, about linear types and capability-based security, are much more detailed and technical: they are meant to prove to the reader that the claims being made about security and correctness are true. Contents Design Goals Anti-Features Features Language Overview Linear Types Motivation What Linear Types Are Universes The Use-Once Rule Linear Types and Safety A Safe Database API Borrowing Capability-Based Security Linear Capabilities A Capability-Secure Filesystem API The Root Capability Status and Future Work Getting Involved Conclusion Design Goals There is a section in the rationale that explains the design goals for Austral, but it boils down to two things: Simplicity Strictness Simplicity means different things to different people. Some use it to mean familiarity, or ease of use, or even terseness. Simplicity here has a straightforward definition: it is the amount of information it takes to describe a system. Complex systems, with lots of moving parts that impinge on one another, cannot be described briefly. Rube Goldberg machines, biology, and C++ are complex systems. Python is a complex system, despite being “easy” to use1. Simple systems have short descriptions. Simplicity is an overriding goal because programming languages are not tools. A programming language is the toolbox, plus the building material, plus the laws of physics of the universe where the product is being built. You can, sometimes, in rare situations, hide a complex system under a simple interface. But not programming languages, because complex programming languages are like a universe where the gravitational constant changes daily. There’s this famous quiz of the C language, where you have all these strange-looking programs and have to decide what they output. And people who have been working with the language for years struggle to answer correctly because the questions refer to subtle and obscure features of the C specification. If you think figuring out what the program does is a fun puzzle, Austral is not for you. Language lawyering is a design flaw: if two people can look at the same basic program and disagree about its behaviour, that’s a problem. Austral is simple. Short spec, thin runtime, small compiler. To give a concrete example: the linear type system was designed with brutal simplicity in mind. Consequently, Austral’s equivalent of a borrow checker is less than 600 lines of code, including the implementation of borrowing and other ergonomic features. The goal here is that the entire programming language should fit in your head, that you should be able to read the specification from beginning to end and know all there is to know about the language. Strictness is half language features, and half a change in mindset. If planes were flown like we write code, we’d have daily crashes, of course, but beyond that, the response to every plane crash would be: “only a bad pilot blames their plane! If they’d read subparagraph 71 of section 7.1.5.5 of the C++, er, 737 spec, they’d know that at 13:51 PM on the vernal equinox the wings fall off the plane.” This doesn’t happen in aviation, because in aviation we have decided, correctly, that human error is an intrinsic and inseparable part of human activity. And so we have built concentric layers of mechanical checks and balances around pilots, to take on part of the load of flying. Because humans are tired, they are burned out, they have limited focus, limited working memory, they are traumatized by writing executable YAML, etc. Mechanical processes—such as type systems, type checking, formal verification, design by contract, static assertion checking, dynamic assertion checking—are independent of the skill of the programmer. Mechanical processes scale, unlike berating people to simply write fewer bugs. Strictness is rarely one big language feature, rather, it’s about learning from the design flaws in other languages, the “death by a thousand cuts”2, and preventing the causes of each of them. This can be hard because programmers get very attached to the flaws. An example: there is a feature of C syntax where, for terseness, you can write if statements without braces. This introduces a syntactic ambiguity: it’s called the “dangling else” problem. The fact that there’s a Wikipedia article about it should suggest that this is bad. This isn’t some abstract academic concern: it has caused real-world security vulnerabilities. Now, if you suggest that this is a flaw, some programmers will invoke the old thought-terminating cliche: “only a bad craftsman blames his tools!”. But the tradeoff here is obvious: you save a few bytes and a few milliseconds of typing, but you roll the dice and possibly introduce a CVE that causes billions of dollars of harm. It’s self-evidently a design flaw, but if you suggest to programmers that they should add the braces, they will kick and scream as if you’re taking away some fundamental freedom. Austral’s syntax was designed with language security principles in mind: it is context-free, it can be parsed from a grammar, there’s no “lexer hack”, there are no strange, ad-hoc ambiguity-resolution mechanisms. The pragmatics of the syntax are designed to minimize confusion and ambiguity. For another example, consider the problem of operator precedence: anyone can remember PEMDAS, but programming languages have many categories of binary operators—arithmetic, comparison, bitwise, Boolean—and mixing them together creates room for error (what does x ^ y && z / w evaluate to?). So in Austral there is simply no operator precedence: any binary expression deeper than one level is fully parenthesized. You have to type more, but we are not typists, we are programmers, and our task is to communicate to others what we want computers to do. When in doubt: simplify by paring down the language. This isn’t for everyone. But it is for me, because after ten years in the industry, the last thing I want from a programming language is “power”. What I want are fewer nightmares. The “liberties” that programming languages provide feel like expressive power until your codebase becomes a mental health superfund site. Anti-Features Before going over the language features, I’d like to list the anti-features. Here are the things Austral proudly doesn’t have: There are no pervasive NULLs, and therefore no null pointer dereference errors. You have to use an explicit Option type. There is no garbage collection, so the runtime can be thin and performance is predictable. There are no exceptions and no stack unwinding and no destructors. There is no surprise control flow: you have conditionals, loops, and function calls. And nothing else. There are no implicit type conversions anywhere. More generally: there are no implicit function calls. If it’s not in the source code, it’s not happening, and you’re not paying the cost of it. There is no global state. There is no runtime reflection. There are no macros. There are no Java or Python-style @Annotations. There is no type inference: type information flows in only one direction, and function parameters, local variables, etc. have to have their types annotated. There is no first-class async3. Function overloading is very restricted through typeclasses (think C++ concepts). And the basic arithmetic operators cannot be overloaded4. There is no syntactic ambiguity: no dangling else (and, therefore, no gotofail), no arithmetic precedence, no syntactic precedence rules of any kind. There is no syntactic extension: you can’t, for example, introduce new infix operators. Features What Austral does have: A strong, static type system that’s not too big-brained. A type system which allows resources to be handled correctly and safely without runtime overhead. “Resource” here means memory and anything that has an explicit lifecycle of create-use-destroy: file handles, sockets, database handles. Capability-based security, which prevents supply chain attacks. Your left-pad dependency can’t be compromised to upload the contents of your disk to a remote server. This is because code that performs network access has to be explicitly given a network capability, code that performs filesystem access needs a filesystem capability, etc. A string-padding function that claims to need network access instantly stands out. Capabilities are unforgeable, secure authorization tokens for code. A strong, Ada-inspired module system which is not tied to filesystem structure and which separates module interfaces from implementations. Sum types with pattern matching and exhaustiveness checking. Type classes, as in Haskell, for restricted function overloading. As in Haskell, type parameters can be constrained to only accept types that implement a given typeclass. A strict, context-free, unambiguous syntax, informed by langsec ideas. Language Overview The largest unit of code organization is the module. Modules have explicit names and are decoupled from the filesystem, like Haskell and unlike Python. Modules are divided into an interface and an implementation, like Ada or OCaml. This is not, as in C or C++, a hack to enable separate compilation. It’s about readability and separation of concerns. The interface file contains declarations that are public, but no code. The implementation file contains the implementations of what is in the interface file, as well as private declarations. There are five kinds of declaration: Constants. Types. Functions. Typeclasses. Typeclass instances. Each of these can either be public (by appearing in the interface file) or private, which determines whether they are importable by other modules. Types have an additional visibility state: opaque, which means they can be imported by other modules, but they cannot be constructed or their contents accessed outside the module, except through the module’s public API. Opaque types are the obvious choice for data structures whose internals are hidden. Functions work like you expect: they take values and return them. Instead of void there is a Unit type with a constant called nil. Typeclasses define an interface that types can conform to, and instances define how a particular type implements a particular typeclass. Types and functions can be generic. The way generics work is slightly different than in most languages, due to the linearity system. Linear Types It is difficult to advertise a language as being “simple” and then start talking about “linear types” and “type universes”, but it is only the words that are new. The concepts are simple. Austral’s entire linear type system fits in a page. So, this isn’t some abstract ivory tower feature that you need a PhD in category theory to understand. Linear types let us have manual memory management, without runtime overhead, and without security vulnerabilities: they prevent memory leaks, use-after-free, and double-free errors. This extends beyond memory to anything that has a lifecycle, where we have to create it, use it, and destroy it in a certain order. File handles, network sockets, database handles, locks and mutexes: the correct usage of these objects can be enforced at compile time. First, I’ll explain the motivation: why do we need linear types? Then I’ll explain what they are, and how they provide safety. Motivation Consider a file handling API: type File File openFile(String path) File writeString(File file, String content) void closeFile(File file) An experienced programmer understands the implicit lifecycle of the File object: We create a File handle by calling openFile. We write to the handle zero or more times. We close the file handle by calling closeFile. We can depict this graphically like this: But, crucially: this lifecycle is not enforced by the compiler. There are a number of erroneous transitions that we don’t consider, but which are technically possible: These fall into two categories: Leaks: we can forget to call closeFile, e.g.: let file = openFile("hello.txt"); writeString(file, "Hello, world!"); // Forgot to close Use-After-Close: and we can call writeString on a File object that has already been closed: closeFile(file); writeString(file, "Goodbye, world!"); And we can close the file handle after it has been closed: closeFile(file); closeFile(file); In a short linear program like this, we aren’t likely to make these mistakes. But when handles are stored in data structures and shuffled around, and the lifecycle calls are separated across time and space, these errors become more common. And they don’t just apply to files. Consider a database access API: type Db Db connect(String host) Rows query(Db db, String query) void close(Db db) Again: after calling close we can still call query and close. And we can also forget to call close at all. And — crucially — consider this memory management API: type Pointer<T> Pointer<T> allocate(T value) T load(Pointer<T> ptr) void store(Pointer<T> ptr, T value) void free(Pointer<T> ptr) Here, again, we can forget to call free after allocating a pointer, we can call free twice on the same pointer, and, more disastrously, we can call load and store on a pointer that has been freed. Everywhere we have resources — types with an associated lifecycle, where they must be created, used, and destroyed, in that order — we have the same kind of errors: forgetting to destroy a value, or using a value after it has been destroyed. In the context of memory management, pointer lifecycle errors are so disastrous they have their own names: Double free errors. Use-after-free errors. Naturally, computer scientists have attempted to attack these problems. The traditional approach is called static analysis: a group of PhD’s will write a program that goes through the source code and performs various checks and finds places where these errors may occur. Reams and reams of papers, conference proceedings, university slides, etc. have been written on the use of static analysis to catch these errors. But the problem with static analysis is threefold: It is a moving target. While type systems are relatively fixed — i.e., the type checking rules are the same across language versions — static analyzers tend to change with each version, so that in each newer version of the software you get more and more sophisticated heuristics. Like unit tests, it can usually show the presence of bugs, but not their absence. There may be false positives — code that is perfectly fine but that the static analyzer flags as incorrect — but more dangerous is the false negative, where the static analyzer returns an all clear on code that has a vulnerability. Static analysis is an opaque pile '
author = "Fernando Borretti"
year_published = 2022
clearnet = "https://borretti.me/article/introducing-austral"
