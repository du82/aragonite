title = "What is a 'Boston marriage'?"
description = "You might assume it’s the name for a wedding in the city of Boston. In fact, it's an important facet of queer history."
full_description = '''googletag.cmd.push(function() { googletag.display('presentedby'); }); Wickedpedia What is a ‘Boston marriage’? An important facet of queer history in the U.S. partly originated in Boston. Left: Portrait of The Rt. Hon. Lady Eleanor Butler and Miss Sarah Ponsonby 'The Ladies of Llangollen’; Center: Carrie Chapman Catt and Mary Garrett Hay were photographed casting their first votes in November 1918; Right: Portrait of the Ladies of Llangollen, Sarah Ponsonby and Lady Eleanor Butler, 1819. Public Domain(left); Library of Congress (center); Public Domain (right) By Madeline Bilis February 12, 2025 3 minutes to read FacebookTwitterEmailEmail26 If you’ve ever heard the term “Boston marriage,” you might assume it’s the name for a wedding that took place in the city of Boston. In fact, it doesn’t refer to nuptials at all. This historical term, which originated in the later part of the 19th century, refers to a once-common living arrangement for women of that era.What is a “Boston marriage”?A Boston marriage refers to a long-term relationship between two women who lived together. In the late 1800s and early 1900s, it was acceptable for an educated, independent woman who chose not to marry a man to spend her life with another woman. (Though plenty of Boston marriages occurred before and after more traditional heterosexual marriages.) Some of these relationships were romantic — and sometimes sexual — in nature, while others were purely platonic. Love Letters: State of the Union(s) While researching for her book, Public Faces, Secret Lives: A Queer History of the Women’s Suffrage Movement, Wendy Rouse, a professor of history at San José State University, discovered that many suffragists were in Boston marriages because of their shared addresses. “I relied in part on census records to determine living arrangements but more broadly on their letters, diaries, poems, legal, probate, and death records to understand the nature of and the significance of these relationships in their lives,” she explains.Advertisement:googletag.cmd.push(function() { googletag.display("ad_inarticle1") })Why didn’t Boston marriages among suffragists raise eyebrows at the time? They were more or less socially tolerated because Victorian beliefs insisted women lacked sexual desire and passion.“Because discussions about homosexuality were not widespread and there was no concept of a lesbian identity yet (that would emerge in the early 20th century) most folks probably looked at these as just odd women, or spinsters, rather than recognizing them as lesbians like we would today,” Rouse says. At the time, women were “encouraged to kiss, hold hands, share beds, and be openly affectionate, as it was considered good training for marriage,” according to John D’Emilio and Estelle B. Freedman, who wrote Intimate Matters: A History of Sexuality in America.Where did the term “Boston marriage” come from?What do Boston marriages have to do with Boston? The term is thought to have originated from the 1885 Henry James novel The Bostonians, which features two forward-thinking women in a committed, cohabitating relationship living in Boston. In the end, one of the women decides to marry a man, even though she knows she’s forfeiting her happiness. Advertisement:googletag.cmd.push(function() { googletag.display("ad_inarticle_video1") })Some say the characters were inspired by James’ sister, Alice James, and her longtime partner Katherine Loring. Still, readers would have no reason to think this arrangement was abnormal, because same-sex relationships between women were not yet frowned upon.The name also ties into geography: The majority of Boston marriages were formed between college-educated women from New England, who were often financially independent or had their own careers. “It’s important to note, though, that nearly all the known couples in Boston marriages were white, middle- and upper-class,” explained historian Susan Freeman on the podcast Queer America. “So as you explore the meanings of their lives and their loves, the social and economic status they held is really important to address.”In the years after the release of The Bostonians, “Boston marriage” lived on as a label for these arrangements. They became prevalent among suffragists, as well as among the feminist-leaning women who championed social work and the establishment of settlement houses. Plenty of women who resented the dominance of men over women took up charitable causes; they turned to reform movements and in turn, developed meaningful relationships with each other. Despite their labeling as odd, or even spinsters, women in Boston marriages played an important role in queer history in the United States. Advertisement:googletag.cmd.push(function() { googletag.display("ad_inarticle2") })“In many, many cases they were every bit as passionate, loving, and committed as our modern notions lead us to assume a heterosexual marriage would be,” write D’Emilio and Freedman. Wickedpedia What's your question?(Required)Name Your name may be published.Neighborhood/Town Your neighborhood/town may be published.What are your preferred pronouns? He/Him She/Her They/Them Other Please select your preferred pronoun so we may correctly refer to your response in an article.Email or phone Please enter an email address and/or phone number that we can easily contact you with. We may reach out for more information. It will NOT be published.EmailThis field is for validation purposes and should be left unchanged. Sign up for the Today newsletter Get everything you need to know to start your day, delivered right to your inbox every morning. Submit your email Enter your email address Sign up ConversationThis discussion has ended. Please join elsewhere on Boston.com'''
