["https://www.boston.com/culture/streaming/2025/02/28/best-movies-on-netflix-right-now-march-2025"]
title = "The best movies on Netflix right now (March 2025)"
description = '''The best movies on Netflix right now (March 2025): Streaming thrillers like Gene Hackman's "Runaway Jury," comedies like "Barbie," and more.'''
full_description = '''googletag.cmd.push(function() { googletag.display('presentedby'); }); Streaming The best movies on Netflix right now (March 2025) From new Netflix originals to classic films from decades past, we've got the best movies on Netflix for every taste. Best movies on Netflix: HARRISON FORD as Deckard in Warner Bros. Pictures’ “Blade Runner: The Final Cut.” Warner Bros. Pictures By Kevin Slane February 28, 2025 18 minutes to read FacebookTwitterEmailEmail... With a library of more than 3,500 films and a labyrinth of oddly specific categories and recommendations, finding the best movies on Netflix can be a chore.To help you with your streaming decisions, we’ve compiled a list of some of the best movies on Netflix right now, ranging from new Netflix originals to classic films from decades past.To further assist your nightly watching decisions, we’ve sorted our best-of list into genres, so you can immediately navigate to the best horror movies on Netflix or the best comedies on Netflix using the links below. We’ll also be adding movies that are new on Netflix to the top of the article each month.Advertisement:googletag.cmd.push(function() { googletag.display("ad_inarticle1") })Think our list is missing something? Email [email protected] with suggestions, whether it’s about ways to make this list more user-friendly or your personal favorite best movies on Netflix that we overlooked.New on NetflixDrama Comedy Horror Action Documentary For KidsBest new movies on Netflix (March 2025)“Runaway Jury” (2003) Though this 2003 film was the last of John Grisham’s legal thrillers to be adapted for the big screen, it was by no means the least. Starring John Cusack as an unsuspecting juror, “Runaway Jury” marked the penultimate big-screen performance from Gene Hackman, who was tragically found dead this week at the age of 95. Hackman’s jury consultant Rankin Fitch is an avatar of pure greed and malevolence, as he works every angle to stack the jury box and ensure a clean verdict for his mega-corporation employer.Advertisement:googletag.cmd.push(function() { googletag.display("ad_inarticle_video1") })Watch “Runaway Jury” on Netflix“Blade Runner” (1982) Like fellow ‘80s filmmakers George Lucas and Steven Spielberg, director Ridley Scott has tinkered with his landmark sci-fi film so many times that “Versions of Blade Runner” is its own Wikipedia page. Based on the Philip K. Dick novel “Do Androids Dream of Electric Sheep?,” “Blade Runner” follows L.A. cop Rick Deckard (Harrison Ford), whose job entails hunting “replicants” (bioengineered humanoids who are frequently indistinguishable from actual humans) in a dystopian 2019 Los Angeles. The version arriving on Netflix this weekend is Scott’s 25th anniversary “final cut,” which marked the end of Scott’s re-editing fervor. Watch “Blade Runner: The Final Cut” streaming on NetflixBest movies on Netflix: Drama“Aftersun” (2022)Frankie Corio, left, and Paul Mescal in “Aftersun.” (A24) – A24Runtime: 101 min.Starring: Paul Mescal, Frankie Corio, Celia Rowlson-HallFirst-time director Charlotte Wells’ semi-autobiographical tale follows Sophie (Frankie Corio), a pre-teen Scottish girl on vacation with her 31-year-old dad, Calum (Paul Mescal, “Normal People”), in Turkey. Wells layers on the melancholy as Sophie’s recognition of her father’s worries and struggles drives a wedge between them, one which neither can fully articulate or acknowledge. The film’s finale packs an emotional wallop, one that still stings nearly two years after its initial release.Advertisement:googletag.cmd.push(function() { googletag.display("ad_inarticle2") })Watch “Aftersun” on Netflix“His Three Daughters” (2024)Natasha Lyonne, Elizabeth Olsen and Carrie Coon in “His Three Daughters.” (Netflix)Runtime: 101 min.Starring: Natasha Lyonne, Elizabeth Olsen, Carrie Coon“His Three Daughters” is a movie that will likely hit close to home for many of a certain age. Natasha Lyonne (“Poker Face”), Elizabeth Olsen (“WandaVision”), and Carrie Coon (“The Leftovers”) play three sisters whose lives followed different paths but are now forced to make nice in a cramped Manhattan apartment while caring for their ailing father. Lyonne (the stoned slacker), Coon (the uptight, judgmental mom), and Olsen (the conflict-averse yogi) speak to each other in a way that is both strangely stilted but also rooted in elemental truth about familial bonds. Watching them spar is heartbreaking, and watching them bond is hugely affirming.Watch “His Three Daughters on Netflix.“The Irishman” (2019)Robert De Niro, Al Pacino, and Ray Romano in “The Irishman.” (Netflix)Runtime: 210 min.Starring: Robert De Niro, Al Pacino, Joe Pesci, Harvey KeitelMartin Scorsese’s 210-minute crime saga follows the life of Frank Sheeran (Robert De Niro), who goes from driving trucks to leading a union, all while “painting houses” (killing people) for the likes of mobster Russell Bufalino (Joe Pesci) and protecting the interests of infamous union boss Jimmy Hoffa (Al Pacino). Instead of simply rehashing “Goodfellas,” Martin Scorsese goes deeper and darker, examining the life of a gangster who lived the life and is contemplating what it was all for.Advertisement:googletag.cmd.push(function() { googletag.display("ad_inarticle3") })Watch “The Irishman” on Netflix“The Lost Daughter” (2021)Olivia Colman in “The Lost Daughter.” (Netflix)Runtime: 121 min.Starring: Olivia Colman, Dakota Johnson, Jessie Buckley, Paul MescalBased on the Elena Ferrante novel of the same name, “The Lost Daughter” is yet another masterful performance from Olivia Colman, who won a Best Actress Oscar in 2019 for “The Favourite” and could have easily won a Supporting Actress award 2020’s “The Father.” In this psychological drama from actress Maggie Gyllenhaal, Colman plays a prickly college professor on vacation in Greece who inserts herself in the lives of a young mother (Dakota Johnson) and her 3-year-old daughter. “The Lost Daughter” may have missed out on a Best Picture nomination, but it’s certainly among 2021’s best.Watch “The Lost Daughter” on Netflix“Maestro” (2023)Bradley Cooper as Leonard Bernstein in “Maestro.” (Netflix)Runtime: 129 min.Cast: Carey Mulligan, Bradley CooperFrom the moment he first steps on screen in “Maestro,” Bradley Cooper is utterly magnetic as composer Leonard Bernstein. The life of the party wherever he goes, “Lenny” quickly begins a courtship with Felicia Montealegre (Carey Mulligan), each glance and one-liner delivered like he’s starring in his own sitcom. Even after decades of marriage, Bernstein still feels like he’s putting on a performance at all times, a function of both his gargantuan ego and the massive pressure of hiding his relationships with other men. As Montealegre, Mulligan sublimely captures a woman who willingly discards her own needs to support a generational talent. When Bernstein takes the stage to conduct Gustav Mahler’s “Resurrection Symphony,” with Montealegre watching in the wings, we understand why.Advertisement:googletag.cmd.push(function() { googletag.display("ad_inarticle4") })Watch “Maestro” on Netflix“May December” (2023)Natalie Portman as Elizabeth Berry and Julianne Moore as Gracie Atherton-Yoo in “May December.” (Netflix)Runtime: 117 min.Cast: Natalie Portman, Julianne Moore, Charles MeltonDirector Todd Haynes walks an incredible tightrope act with “May December,” mixing dark comedy, melodrama, and psychological thrills to (unofficially) tell the lurid, ripped-from-the-headlines story of Mary Kay Letourneau. Actress Elizabeth Barry (Natalie Portman) shows up at the home of long-married couple Gracie (Julianne Moore) and Joe (Charles Melton, “Riverdale”) in order to shadow Gracie for a movie based on the couple’s tabloid-worthy romance. Moore and Portman have rarely been better, and Melton is a revelation — his child-like nature both amusing and heartbreaking. Not only does Haynes plumb the fragile psyche of the couple, but he also uses Portman’s Elizabeth to show how callous the Hollywood moviemaking factory can be in the pursuit of creating entertainment out of someone’s lived experiences. Portman, as it turns out, is better at playing a self-absorbed, talentless actress than most actors are at playing “real” people.Watch “May December” on Netflix“The Power of the Dog” (2021)Benedict Cumberbatch in “The Power of the Dog.” (Netflix)Runtime: 126 min.Starring: Benedict Cumberbatch, Kirsten Dunst, Jesse Plemons, Kodi Smit-McPheeJane Campion’s Oscar-winning Western drama centers around two ranch-owning brothers, Phil (Benedict Cumberbatch, “Dr. Strange”) and George (Jesse Plemons, “The Irishman”). When George marries innkeeper Rose (Kirsten Dunst, “Bring It On”), Phil makes life difficult for her and her son, Peter (Kodi Smit-McPhee, “The Road”). Smit-McPhee is a revelation in the role, and Campion’s film is dark, foreboding, depressing, and utterly unmissable.Advertisement:googletag.cmd.push(function() { googletag.display("ad_inarticle5") })Watch “The Power of the Dog” on Netflix“Whiplash” (2014)Miles Teller and J.K. Simmons in “Whiplash.” (Sony Pictures Classics)Runtime: 106 min.Starring: Miles Teller, J.K. Simmons“Whiplash” tells the story of a toxic teacher-pupil relationship between Andrew (Miles Teller), a young jazz drummer enrolled at an elite Manhattan music school, and Professor Fletcher (J.K. Simmons), a tyrant who verbally (and sometimes physically) punishes students who don’t meet his standards or match his tempo. Director Damien Chazelle moves his camera to the rhythm of the music, exploring why Andrew remains committed to such an egomaniacal monster, and how their relationship evolves as the closer he gets to a climactic performance.Watch “Whiplash” on NetflixBest movies on Netflix: Comedy“Barbie” (2023)Margot Robbie in “Barbie.” – Warner Bros. PicturesGreta Gerwig’s pink-drenched comedy was a cultural force in the summer of 2023, taking its famous toy (Margot Robbie) on an odyssey of self-discovery from the confines of Barbieland to the harsh reality of 1980s Los Angeles. Both Barbie and Ken (a fantastically twitchy Ryan Gosling) learn much during their brief foray into the real world, though with drastically different results. Much like its main character, Gerwig’s “Barbie” refuses to be confined and defined. It’s a Mattel brand extension and an anti-capitalist screed. It’s an uplifting comedy and a sobering meditation on the agony of existence. More than anything, “Barbie” is one of the most subversive, unexpected summer blockbusters in recent memory.Watch “Barbie” on Netflix“Glass Onion: A Knives Out Mystery”Edward Norton, Madelyn Cline and Daniel Craig in “Glass Onion: A Knives Out Mystery.” (Netflix)Runtime: 139 min.Starring: Daniel Craig, Edward Norton, Janelle Monáe, Kathryn HahnMore madcap and funny than the 2019 original, the characters and locale of “Glass Onion: A Knives Out Mystery” shift from an old-money New England mansion to a new-money vacation compound, with Detective Benoit Blanc (Daniel Craig of James Bond fame) as the only holdover. This mystery concerns Elon Musk-esque tech billionaire Miles Bron (Edward Norton, “Fight Club”), who invites a group of his longtime friends to his private Greek island in the midst of the pandemic. As fashion entrepreneur Birdie Jay, Kate Hudson gets the most consistent laughs throughout the film, from insisting that everyone at her raucous 200-person apartment party is “in her pod” to her pathological desire to post career-ending tweets. Norton is a winner as well, playing the kind of billionaire who cultivates a worldly image that could nevertheless be deflated by a particularly clever child, a la “The Emperor’s New Clothes.”Advertisement:googletag.cmd.push(function() { googletag.display("ad_inarticle6") })Watch “Glass Onion: A Knives Out Mystery” on Netflix“Hit Man” (2024)Adria Arjona and Glen Powell in “Hit Man.” (Netflix)Runtime: 115 min.Starring: Glen Powell, Adria ArjonaStarring the breakout actor from Richard Linklater’s 2016 film “Everybody Wants Some!!,” “Hit Man” is loosely based on a true story about a nebbish college professor named Gary (Glen Powell) who moonlights as a faux hit man for the New Orleans Police Department. Gary, so afraid of breaking his low-stakes routine, takes the undercover duties as a chance to be someone else. When he meets an alluring woman (Adria Arjona, “Andor”) while in his hit man persona (this time a tough guy named Rod), the id and the superego (also the names of Gary’s cats) collide. Powell, who co-wrote the screenplay with Linklater, carefully modulates his performance as the line between Gary and Rod blurs — though not necessarily in a bad way. “Hit Man” is sexy, thought-provoking, and funny. And for a film about a fake hit man in over his head, it’s surprisingly grounded in reality when it comes to contemplating the nature of love, hate, and self.Watch “Hit Man” on Netflix“Magic Mike XXL” (2015)Stephen Boss, Matt Bomer, Kevin Nash, Joe Manganiello, Channing Tatum, and Adam Rodriguez in “Magic Mike XXL.” (Warner Bros. Pictures)Runtime: 115 min.Cast: Channing Tatum, Matt Bomer, Joe Manganiello, Amber Heard, Donald Glover, Gabriel Iglesias, Andie MacDowell, Elizabeth BanksFor “Magic Mike XXL,” the juiced-up second entry in the male stripper — or, as one character repeatedly says, “male entertainer” — franchise, director Steven Soderbergh (“Traffic,” “Ocean’s 11”) handed the reins over to longtime collaborator Gregory Jacobs. The result is a film that is light on plot and heavy on stripper setpieces — which to be clear, is not a bad thing. Choreographer Alison Faulk ups the ante throughout the film as Magic Mike (Channing Tatum) and company workshop their show-stopping routines in the hopes of landing a lucrative, life-changing payday at a nationwide stripping convention. Every single person on screen appears to be having a blast, and if you give in to the fantasy world “XXL” creates, so will you.Advertisement:googletag.cmd.push(function() { googletag.display("ad_inarticle7") })Watch “Magic Mike XXL” on Netflix“Notting Hill” (1999)Runtime: 124 min.Starring: Julia Roberts, Hugh Grant, Hugh BonnevilleIf you were writing, directing, or performing in a romantic comedy in the ’90s, your guiding light was Julia Roberts. In Roger Michell’s “Notting Hill,” she gets a chance to play wish fulfillment for audiences, playing an A-List actress who is secretly down-to-earth and falls for a bookshop owner (Hugh Grant). The pair’s chemistry and comedic timing is sublime, selling the fairy tale story so well that you’ll be a believer when the credits roll. Watch “Notting Hill” on NetflixBest movies on Netflix: Horror“A Quiet Place Part II”L-r, Regan (Millicent Simmonds), Marcus (Noah Jupe) and Evelyn (Emily Blunt) brave the unknown in “A Quiet Place Part II.” – Jonny CournoyerRuntime: 97 min.Cast: Emily Blunt, Millicent Simmonds, Noah Jupe, Djimon HounsouFollowing the events of the 2018 film “A Quiet Place,” the Abbott family (Emily Blunt, Millicent Simmonds, and Noah '''
