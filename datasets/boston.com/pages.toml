["https://www.boston.com/community/boston-marathon/2025/02/28/stephanie-silva-haymakers-for-hope-boston-marathon"]
title = "Why I'm Running: 'I am running for myself, for those still fighting'"
description = "Stephanie Silva is running the Boston Marathon to raise funds for Haymakers for Hope, which hosts charity boxing and running events to fight cancer."
full_description = '''googletag.cmd.push(function() { googletag.display('presentedby'); }); Boston Marathon ‘I am running for myself, for those still fighting, and for those we have lost along the way’ Stephanie Silva is running Boston to raise funds for Haymakers for Hope, which hosts charity boxing and running events to fight cancer. By Kelly Chan February 28, 2025 1 minute to read FacebookTwitterEmailEmail... In our “Why I’m Running” series, Boston Marathon runners share what’s inspiring them to make the 26.2-mile trek from Hopkinton to Boston.Name: Stephanie SilvaAge: 37From: PeabodyI am beyond excited to have been selected as a member of the Haymakers for Hope Running Team (Haymakers Harriers) where each contribution made will support cancer research, care, awareness, and survivorship. Haymakers for Hope is a 501(c)3 charitable organization that hosts amateur charity boxing and running events in an effort to KO cancer.This organization began with six amateur boxing events in five major cities, and has expanded to pounding pavement at road races across the globe. Together, these initiatives have resulted in more than $25 million in funds (and counting) raised to end this terrible disease. Advertisement:googletag.cmd.push(function() { googletag.display("ad_inarticle1") })I have been blessed to be involved in this organization since 2017. As a survivor, I am running for myself, for those still fighting, and for those we have lost along the way … because the fight against cancer still does not have a finish line. Editor’s note: This entry may have been lightly edited for clarity or grammar. Are you running the 2025 Boston Marathon? Share your story with us. Kelly ChanContent Producer Kelly Chan is a content producer at Boston.com. She designs multimedia content on-site and across social media platforms, and experiments with new ways to engage readers. Sign up for the latest Boston Marathon updates 👟 Everything you need to know about Marathon Monday, delivered to yo