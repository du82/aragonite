description = "Streaming right now: What to watch and the best of what's new on Netflix, Hulu, HBO Max, Disney+, Apple TV+, Peacock, and Paramount+."
full_description = '''googletag.cmd.push(function() { googletag.display('presentedby'); }); Streaming 5 must-watch movies & TV shows streaming right now The best of what's new streaming on Netflix, Hulu, HBO Max, Disney Plus, and more. Kate Hudson as Isla Gordon in "Running Point." Katrina Marcinowski/Netflix By Kevin Slane February 28, 2025 3 minutes to read FacebookTwitterEmailEmail5 Welcome to Boston.com’s weekly streaming guide. Each week, we recommend five must-watch movies and TV shows available on streaming platforms like Netflix, Hulu, Amazon Prime, Disney+, HBO Max, Peacock, Paramount+, and more.Want more streaming goodness? Sign up for The Queue, our streaming newsletter featuring the latest industry news, movie and TV recommendations, and more in your inbox every week.For even more great streaming options, check out previous editions of our must-watch list here. WHAT TO WATCH THIS WEEKEND 2025 Oscars: How to watch or stream all of the movies nominated The best movies on Netflix right now (March 2025) New Movies Streaming“Nickel Boys” Watching “Nickel Boys” is like learning a new film language. The story of two young men at an abusive 1950s reform school in the Jim Crow South is shot entirely from their point of view. We see only what they see, and as a result, feel what they feel. And it’s hard not to feel deeply for the plight of both Curtis (Ethan Herisse), a promising student on his way to college who ends up at Nickel Academy through random (read: racist) chance, and Turner (Brandon Wilson), who has been at Nickel Academy long enough to have all the optimism beaten out of him.Advertisement:googletag.cmd.push(function() { googletag.display("ad_inarticle1") })While it did earn two Oscar nominations (Best Picture, Adapted Screenplay), RaMell Ross’s film also deserved nominations for Editing, Cinematography, and Best Director, at a minimum.How to watch: “Nickel Boys” is streaming on MGM+.“Runaway Jury” Though this 2003 film was the last of John Grisham’s legal thrillers to be adapted for the big screen, it was by no means the least. Starring John Cusack as an unsuspecting juror, “Runaway Jury” marked the penultimate big-screen performance from Gene Hackman, who was tragically found dead this week at the age of 95. Hackman’s jury consultant Rankin Fitch is an avatar of pure greed and malevolence, as he works every angle to stack the jury box and ensure a clean verdict for his mega-corporation employer.Advertisement:googletag.cmd.push(function() { googletag.display("ad_inarticle_video1") })How to watch: “Runaway Jury” is streaming on Paramount+ and begins streaming on Netflix March 1.“September 5” Ahead of Sunday’s telecast of the 2025 Oscars, you can watch one of the final nominees to arrive on a streaming service, Tim Fehlbaum’s historical drama “September 5.”I’m a sucker for journalism movies, and “September 5” is no exception. What begins as a team of sportscasters at ABC covering the 1972 Munich Olympics quickly turns into a taut thriller as the crew pivots to on-the-ground reporting about the burgeoning hostage crisis. John Magaro (“Past Lives”) is spectacular as the head of the channel’s Munich control room, forced to make decisions about how to frame the threat — toeing the line between sensationalism and compelling TV — as lives hang in the balance.How to watch: “September 5” is streaming on Paramount+.New TV Shows Streaming“A Thousand Blows” If you’re a fan of “Peaky Blinders,” creator Steven Knight is back with another rough-around-the-edges historical drama set in Britain. “A Thousand Days” is set in Victorian-era London, but the East End drama is anything but posh. Two best friends (Malachi Kirby, Francis Lovehall) have come to London from Jamaica seeking a better life. Arriving with nothing, they find their paths crossing with two criminal enterprises: An underground boxing ring and an all-women gang of thieves known as the Forty Elephants. It’s both bloody and — to borrow a Briticism — bloody interesting.Advertisement:googletag.cmd.push(function() { googletag.display("ad_inarticle2") })How to watch: “A Thousand Blows” is streaming on Hulu.“Running Point” Cambridge native Mindy Kaling has assembled a powerful cast for her new basketball comedy, which bears more than a passing resemblance to the life story of Los Angeles Lakers owner Jeanie Buss (who is an executive producer).When her older brother (Justin Theroux) is forced to step down as president of the fictional Los Angeles Waves, Isla Gordon (Kate Hudson) is next in line, despite her own salacious past and her lack of knowing how to run a professional sports team. Unlike HBO’s now-canceled “Winning Time,” “Running Point” has the freedom to pick and choose elements of the Buss dynasty that make compelling television, while ignoring subjects they’d prefer not to touch. (There’s no Magic Johnson analogue, for one.) With a deep roster of funny folks including Max Greenfield (“The New Girl”), Drew Tarver (“The Other Two”), and a surprisingly adept Chet Hanks as the team’s star player, “Running Point” has an opportunity to shoot for two — or maybe even three — seasons.How to watch: “Running Point” is streaming on Netflix. Kevin SlaneStaff Writer Kevin Slane is a staff writer for Boston.com covering entertainment and culture. His work focuses on movie reviews, streaming guides, celebrities, and things to do in Boston. Sign up for the Today newsletter Get everything you need to know to start your day, delivered right to your inbox every morning. Submit your email Enter your email address Sign up Be civil. Be kind. Read our full community guidelines. if ( ( onetrustStorageConsent !== null ) && (onetrustStorageConsent.C0004 !== true ) ) { let comments_disabled_box = document.getElementById( 'comment-community-guidelines' ); let p = document.createElement( 'p' ); p.setAttribute( 'class', 'comment-community-guidelines__comments_disabled' ); p.append( 'Comments are currently disabled due to your Privacy Settings. You may enable them by agreeing to our targeting cookies.' ); comments_disabled_box.append( p ); }'''
