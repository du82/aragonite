full_description = '''Wickedpedia Your unserious questions, seriously answered. Have a question about Greater Boston or New England you’ve always wondered about but never thought to ask? Boston.com’s Wickedpedia series aims to track down the answers to these long-burning (often random) reader questions — the more obscure the better. Submit your question below or email it to [email protected], and if it’s selected, we’ll put a reporter on the case. Featured: Wickedpedia Where does the Boston accent come from? Wickedpedia Could you ever actually 'pahk yah cah in Hahvahd Yahd'? Wickedpedia Where does Greater Boston end? Latest Wickedpedia news: That gift card you've been carrying around will expire. Here's when and how. Wickedpedia What is a ‘Boston marriage’? Wickedpedia How many House of Pizzas are in Massachusetts? WICKEDPEDIA How did Christmas Tree Shops get its iconic thatched roof and windmill? MBTA-related questions: Wickedpedia How did the T lines get their colors? 🚃🚃🚃 Why doesn't the Green Line have an 'A' branch? Wickedpedia Where do old MBTA trains go to die? Wickedpedia Who thought Green Line trolleys driving in traffic was a good idea? Wickedpedia 'But ‘Wonderland’ itself, well what was that?' Wickedpedia What are the ‘hanging poles’ in the Kendall MBTA station? Food-related questions: Wickedpedia Why do some New Englanders call sprinkles ‘jimmies’? Wickedpedia 'If they know what a spuckie is, if they’re from Boston, they’re really tickled that we have that on the menu' Wickedpedia 'A frappe is a frappe. A milkshake is not a frappe.' WICKEDPEDIA What exactly is coffee milk? Wickedpedia 'It’s never been a pie, never will be a pie. It’s always a cake.' Wickedpedia What is apizza? And how is it different from regular pizza? Topic: Wickedpedia What's the shortest distance between two Dunkin's in Mass.? Topic: Wickedpedia Why don't we pronounce the Celtics with a hard 'C'? Watch on Boston Globe Today: .powa-shot-title{display:none;} Wickedpedia What's your question?(Required)Name Your name may be published.Neighborhood/Town Your neighborhood/town may be published.What are your preferred pronouns? He/Him She/Her They/Them Other Please select your preferred pronoun so we may correctly refer to your response in an article.Email or phone Please enter an email address and/or phone number that we can easily contact you with. We may reach out for more information. It will NOT be published.PhoneThis field is for validation purposes and should be left unchanged. TikTok explainers @bostondotcom Is this cake? 🍰 Actually, yes. The Boston Cream Pie has a layered history, and tracing its local origins isn’t easy as pie — or rather, cake. Read more about the complicated origins of Boston’s iconic dessert, in the latest Wickedpedia installment at the link in our bio. #BostonDotCom #NewEngland #Massachusetts #BostonCreamPie ♬ Applesauce – Mark Fabian & Alexander Smith & George King & RK Masters @bostondotcom There’s Fenway on the Green Line, located in the Fenway neighborhood and near Fenway Park. Harvard on the Red Line stops at the university. The list goes on. But Wonderland, the stop at the end of the Blue Line, defies the norm. It takes riders to Revere and drops them off between North Shore Road and Ocean Avenue. The area surrounding the stop used to be “a land full of wonders,” says Stephen Wilk, the author of “Lost Wonderland,” which details the history of the short-lived amusement park that was next to the station’s current location. Its name: Wonderland Amusement Park. Read more about how the Wonderland T stop got its name in the latest #Wickedpedia installment at the link in our bio. #BostonDotCom #Wonderland #Revere #NewEngland #MBTA ♬ original sound – Boston.com @bostondotcom This week’s edition of Wickedpedia features a famous 🦗 that’s been involved in a fire and a heist! But why exactly is there a grasshopper atop Faneuil Hall? Hop on over to our link in bio to read the full story. #Boston #Bostonma #Massachusetts #faneuilhall #downtownboston ♬ Beat Automotivo Tan Tan Tan Viral – WZ Beat More Wickedpedia: Wickedpedia When was the last white Christmas in Boston? December 17, 2024 | 5:00 am 🐄🐄🐄 Wickedpedia: Were Boston streets really designed by cows? December 10, 2024 | 5:00 am Wickedpedia How many steps are there at Porter Square Station? December 3, 2024 | 5:00 am Wickedpedia ‘Coolidge Has Raccoon; Probably Won’t Eat It’ — Boston Herald November 26, 2024 | 5:00 am Advertisement googletag.cmd.push(function() { googletag.display("ad_stream1") }) Wickedpedia Where did John F. Kennedy live in Boston? November 20, 2024 | 5:00 am Wickedpedia Why doesn't Market Basket have self-checkout? October 30, 2024 | 5:00 am WICKEDPEDIA What's the most haunted place in Salem? October 22, 2024 | 5:00 am Wickedpedia Why doesn't Boston have a WNBA team? October 8, 2024 | 1:04 pm Advertisement googletag.cmd.push(function() { googletag.display("ad_stream2") }) Wickedpedia How did Packard's Corner get its name? October 1, 2024 | 5:00 am Wickedpedia 'I think it’s a game that people are playing. They want to be mysterious.' September 17, 2024 | 5:00 am Older entries Load More googletag.cmd.push(function() { googletag.display("ad_sectionfront1") }) Most Popular The best movies on Netflix right now (March 2025) Economic blackout: Will a 24-hour boycott make a difference? Border czar doubles down on promise to crack down on Boston Local democrats detail party’s plan to halt Trump’s actions Will Campbell addresses draft concerns; which position Patriots view him as googletag.cmd.push(function() { googletag.display("ad_sectionfront2") })'''
