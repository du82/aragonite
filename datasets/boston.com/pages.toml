title = "Runner overcomes heart attack to race Boston 10 years later"
description = "In our “Why I'm Running” series, Boston Marathon runners share what's inspiring them to make the 26.2-mile trek from Hopkinton to Boston."
full_description = '''googletag.cmd.push(function() { googletag.display('presentedby'); }); Boston Marathon She had a heart attack during her first Boston Marathon. She’s running again 10 years later. "I was having an amazing race when things went terribly wrong on/near Heartbreak Hill." Nancy Richards is running the 2025 Boston Marathon. (Photo courtesy of Nancy Richards) By Annie Jonas March 1, 2025 | 5:00 AM 1 minute to read FacebookTwitterEmailEmail... In our “Why I’m Running” series, Boston Marathon athletes share what’s inspiring them to make the 26.2-mile trek from Hopkinton to Boston.Name: Nancy RichardsAge: 66From: Madras, OregonI qualified for and ran Boston in 2015. I was having an amazing race when things went terribly wrong on/near Heartbreak Hill. I struggled to the finish but have very little memory of the last three miles or the hours after the race. Are you running the 2025 Boston Marathon? Share your story with us. I suffered an acute STEMI (heart attack) during the race. Thanks to some very attentive and well-trained volunteers at the finish line and in the medical tent along with excellent care at MGH, I survived with minimal heart damage. I woke on Tuesday morning to find Dr. Aaron Baggish at my bedside. He communicated that running had probably saved my life and encouraged me to return to running as I recovered.Advertisement:googletag.cmd.push(function() { googletag.display("ad_inarticle1") })I did return to running, determined to return to Boston someday. That day has come. I’ve been accepted as a member of the 2025 Mass General Marathon Team. Emergency care/response, cardiac health, and running as part of a healthy lifestyle are my passions. MGH was a very important part of my Boston experience in 2015. I’ll be running Boston and fundraising to show my appreciation for the lifesaving care I received in the emergency room and the Cardiology/Heart Center. I can’t think of a better time to return to Boston than in 2025 on the 10th anniversary of my cardiac event. Making the trip to Boston as a member of the 2025 Mass General Marathon Team will be an opportunity to fulfill my goal to finish Boston feeling well and I’ll be able to share my story, promote running as part of a healthy lifestyle, encourage others, and show my appreciation for the lifesaving care I received. I’m excited and honored to RUN4MGH as I celebrate the 10th anniversary of my cardiac event!Advertisement:googletag.cmd.push(function() { googletag.display("ad_inarticle_video1") })Editor’s note: This entry may have been lightly edited for clarity or grammar. Annie Jonas Annie Jonas is a Community writer at Boston.com. She was previously a local editor at Patch and a freelancer at the Financial Times. Sign up for the latest Boston Marathon updates 👟 Everything you need to know about Marathon Monday, delivered to your inbox. Submit your email Enter your email address Sign up Be civil. Be kind. Read our full community guidelines. if ( ( onetrustStorageConsent !== null ) && (onetrustStorageConsent.C0004 !== true ) ) { let comments_disabled_box = document.getElementById( 'comment-community-guidelines' ); let p = document.createElement( 'p' ); p.setAttribute( 'class', 'comment-community-guidelines__comments_disabled' ); p.append( 'Comments are currently disabled due to your Privacy Settings. You may enable them by agreeing to our targeting cookies.' ); comments_disabled_box.append( p ); }'''
