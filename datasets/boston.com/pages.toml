title = "Sullivan's Castle Island wins James Beard Classics award"
description = "Sullivan's Castle Island, which plans to reopen for its 74th season on March 1, is the recipient of a James Beard Classics award."
full_description = '''googletag.cmd.push(function() { googletag.display('presentedby'); }); Food News Sullivan’s Castle Island wins James Beard Classics award Boston's favorite concession shack received the award news before its anticipated reopening for the season. Sullivan's Castle Island is now a James Beard award-winning restaurant. The concession shack in South Boston plans to reopen March 1. John Tlumacki/Globe Staff By Katelyn Umholtz February 26, 2025 2 minutes to read FacebookTwitterEmailEmail2 Sullivan’s Castle Island is reopening its doors for its 74th season on Saturday, this year as a James Beard-winning restaurant. Boston’s beloved concession stand, affectionately known as Sully’s, was awarded the James Beard America’s Classics Award for the Northeast region, according to a press release Wednesday. Given out since 1998, the award is meant to recognize local dining establishments that have been in business for at least 10 years and are institutions within their communities. Sully’s has fed New England families hot dogs and lobster rolls — and some pesky seagulls a few stolen fries — since 1951, and its seasonal reopening has become Greater Boston’s signal of spring.Advertisement:googletag.cmd.push(function() { googletag.display("ad_inarticle1") })“This award is not only a recognition of our commitment to serving outstanding food but also a celebration of the traditions that have defined Sullivan’s for generations,” said Brendan Sullivan, owner of Sullivan’s Castle Island, in a press release. “This is not just an award for us; this is an award for all of New England.”The news of Sully’s James Beard award comes several days after the concession shack announced it would reopen its famous Castle Island location for the season March 1. The restaurant typically closes for winter around late November or early December each year, and starts up its fryer soon after February Vacation week. Advertisement:googletag.cmd.push(function() { googletag.display("ad_inarticle_video1") })For its first week open in 2025, Sully’s will offer guests half-priced hot dogs, according to Instagram. View this post on Instagram A post shared by Sullivans Castle Island (@sullivanscastleisland)Good news for its many fans: Despite 74 years in business, Sullivan said guests can expect the concession shack to stick to its roots and keep “the spirit of old Boston alive.”“Everyone has a Sullivan’s story,” Sullivan said in a press release. “It’s not just a meal. It’s an experience, an institution. This recognition reinforces our commitment to not only honor our past but also to embrace the future.”Sully’s was one of six restaurants awarded a James Beard Classics. Six of 12 regions are awarded each year, meaning that the Northeast region is recognized every other year. This year’s recipients included Lem’s Bar-B-Q in Chicago, The Pioneer Saloon in Idaho, Lucky Wishbone in Alaska, Dooky Chase in New Orleans, and Gaido’s in Texas. Katelyn UmholtzFood and Restaurant Reporter Katelyn Umholtz covers food and restaurants for Boston.com. Katelyn is also the author of The Dish, a weekly food newsletter. Sign up for The Dish Stay up to date on the latest food and drink news from Boston.com. Submit your email Enter your email address Sign up ConversationThis discussion has ended. Please join elsewhere on Boston.com'''
