["https://www.boston.com/food/food-news/2025/02/24/jp-licks-debuts-new-flavor-world-figure-skating-championships"]
title = "J.P. Licks debuts new ice cream flavor with local skating club"
description = 'Ahead of the ISU World Figure Skating Championships at TD Garden, the iconic Mass. ice cream chain will serve up “The World’s Swirl."'
full_description = '''googletag.cmd.push(function() { googletag.display('presentedby'); }); Food News J.P. Licks unveils new ice cream flavor in collaboration with The Skating Club of Boston “The World’s Swirl” will be offered through March 30. Skaters enjoying The World's Swirl ISU World Figure Skating Championships 2025 By Maya Shavit February 24, 2025 1 minute to read FacebookTwitterEmailEmail1 J.P. Licks is gearing up for a global figure-skating championship with a new flavor to celebrate the world’s most talented skaters competing in Boston this spring. Watch: USA and Canada to meet on the ice in Boston Ready for the ultimate ice cream road trip? Use this map for 100+ Mass. shops. Ahead of the ISU World Figure Skating Championships 2025, the iconic Massachusetts ice cream chain will serve up “The World’s Swirl,” a blue cake batter ice cream with marshmallow swirl. The flavor is an exclusive collaboration with The Skating Club of Boston, the local organizing committee for the championships. “We are thrilled to work with an iconic local company like J.P. Licks on this perfect skating treat. We have no doubt that skating fans from around the world will delight in one of Boston’s finest offerings,” said Doug Zeghibe, CEO and executive director of The Skating Club of Boston.Advertisement:googletag.cmd.push(function() { googletag.display("ad_inarticle1") })The ice cream flavor will be offered through the last day of the competition on March 30.“J.P. Licks is excited to partner with the 2025 ISU World Figure Skating Championships on this exclusive flavor. It’s an amazing experience to be part of an event that brings so many athletes from around the world to Boston,” said Vincent Petryk, owner and founder of J.P. Licks.J.P. Licks was founded in 1981 by Petryk, and currently operates with 17 Mass. locations. All ice cream is made in the Jamaica Plain headquarters and ships out across the United States.The Skating Club of Boston is a nonprofit and founding member of U.S. Figure Skating with the mission of advancing skating. The club manages skating training programs and produces competitions that bring people together to enjoy the sport.Advertisement:googletag.cmd.push(function() { googletag.display("ad_inarticle_video1") })The ISU World Figure Skating Championships 2025 is the latest figure-skating event to take place at TD Garden. Previously, the venue also hosted the 2014 U.S. Figure Skating Championships and the ISU World Figure Skating Championships 2016.The ISU World Figure Skating Championships will take place March 25-30 at TD Garden. Tickets are available to purchase. Sign up for The Dish Stay up to date on the latest food and drink news from Boston.com. Submit your email Enter your email address Sign up ConversationThis discussion has ended. Please join elsewhere on Boston.com'''
