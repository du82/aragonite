title = "This oncology nurse is running Boston to honor her patient"
description = "Stay up to date with everything Boston. Receive the latest news and breaking updates, straight from our newsroom to your inbox."
full_description = '''googletag.cmd.push(function() { googletag.display('presentedby'); }); Boston Marathon This oncology nurse is running Boston to honor her patient "She reminded me why I became a nurse in the first place." Anna Leedham is running the 2025 Boston Marathon. (Photo courtesy of Anna Leedham) By Annie Jonas March 1, 2025 | 12:00 PM 1 minute to read FacebookTwitterEmailEmail... In our “Why I’m Running” series, Boston Marathon athletes share what’s inspiring them to make the 26.2-mile trek from Hopkinton to Boston.Name: Anna LeedhamAge: 26From: LowellI’m running for patients, for families, for research, for a cure, for Andrea. I’m running for Caring for a Cure, a charity that was started with the overall goal to support and uplift the spirits of our patients and their families as they navigate their cancer diagnosis. As an oncology nurse, I’ve witnessed firsthand the profound impacts organization has on those I’ve cared for. Are you running the 2025 Boston Marathon? Share your story with us. I am dedicating 26.2 miles to honor Andrea, a patient I took care of this past year when she was admitted to the hospital for a stem cell transplant. Advertisement:googletag.cmd.push(function() { googletag.display("ad_inarticle1") })Andrea and I were able to bond over the love for a good drink, traveling, and sharing the same sense of humor. There aren’t enough words to truly capture who Andrea is; she is kind, humorous, and most of all resilient. Her transplant was difficult, to say the least, as she spent several weeks in the hospital due to many complications. Somehow every shift spent together we managed to laugh and give each other a healthy amount of sass. There was never a dull moment together. To care for someone at their most vulnerable and yet be able to witness such strength is an honor, it’s what I love about my job. Advertisement:googletag.cmd.push(function() { googletag.display("ad_inarticle_video1") })Andrea is thrilled to be over 100 days out since her bone marrow transplant, she’s back in her home and feeling better day by day. Each shift on an oncology floor holds the potential for sadness and joy; but every day caring for Andrea I was able to focus on who she was as a person, not a patient. She reminded me why I became a nurse in the first place. There’s nothing more fitting than running 26.2 to honor a woman whose personality is truly larger than life itself.Editor’s note: This entry may have been lightly edited for clarity or grammar. Annie Jonas Annie Jonas is a Community writer at Boston.com. She was previously a local editor at Patch and a freelancer at the Financial Times. Sign up for the latest Boston Marathon updates 👟 Everything you need to know about Marathon Monday, delivered to your inbox. Submit your email Enter your email address Sign up Be civil. Be kind. Read our full community guidelines. if ( ( onetrustStorageConsent !== null ) && (onetrustStorageConsent.C0004 !== true ) ) { let comments_disabled_box = document.getElementById( 'comment-community-guidelines' ); let p = document.createElement( 'p' ); p.setAttribute( 'class', 'comment-community-guidelines__comments_disabled' ); p.append( 'Comments are currently disabled due to your Privacy Settings. You may enable them by agreeing to our targeting cookies.' ); comments_disabled_box.append( p ); }'''
