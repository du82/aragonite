title = "Fresh Start initiative: Submit your appeal | Boston.com"
description = "Following the nationwide reckoning on racial justice, the Globe, BostonGlobe.com, and Boston.com are looking inward at our own practices that have disproportionately affected communities of color. As we update how we cover the news, we are also working to better understand how some stories can have a lasting negative impact on someone’s ability to move […]"
full_description = 'Fresh Start initiative: Submit your appeal Following the nationwide reckoning on racial justice, the Globe, BostonGlobe.com, and Boston.com are looking inward at our own practices that have disproportionately affected communities of color. As we update how we cover the news, we are also working to better understand how some stories can have a lasting negative impact on someone’s ability to move forward with their lives. Going forward, the Globe, BostonGlobe.com, and Boston.com will allow people to appeal their presence in older stories published on our websites. We’ll consider each case individually and, if warranted, take steps to update the story and protect the privacy of the individual. These steps may include republishing the story with new information or removing the story from Google searches. We are not in the business of rewriting the past, but we don’t want to stand in the way of a regular person’s ability to craft their future. If you’re looking for a Fresh Start, please fill out the form below. We’ll be in touch. Read some frequently asked questions about the Fresh Start initiative. This is a new initiative for us and we expect it to evolve with regular assessments and tweaks along the way. We welcome public comments and concerns at [email protected]. Cognito.load("forms", { id: "1" });'
year_published = 2025
