["https://www.bostonreview.net/articles/the-boomerang-comes-back"]
title = "The Boomerang Comes Back - Boston Review"
description = "How the U.S.-backed war on Palestine is expanding authoritarianism at home—from Project Esther to violence at the border."
full_description = "Democracy depends on the free exchange of ideas. Help sustain it with a tax-deductible donation today. How the U.S.-backed war on Palestine is expanding authoritarianism at home—from Project Esther to violence at the border. This essay is part of an Election Chronicle series in our Winter 2025 issue, Trump’s Return. Subscribe to get a copy. In the fallout of the election, a stream of social media content—some from passionate Harris supporters, some from lesser-evil Democratic voters, and some, presumably, from people simply lashing out, horrified and distraught at Trump’s win—took to blaming Palestinians for the outcome. My initial fury at these statements eventually gave way to analysis. How could so many people be so callous and so wrong? The tendency to scapegoat in moments of crisis, along with pervasive anti-Palestinian racism, are surely factors, but there are larger forces at work as well. Many had seen Palestinians protesting the Democratic Party, but thanks to widespread censorship and media bias, most of them also almost certainly had not seen the stream of atrocities in Gaza that had been taking place for over a year: five-year-old Hind Rajab begging for someone to save her; the body of Sidra Hassouna split in two and hanging on a beam of a destroyed building; Sha’ban al-Dalou burned to death while attached to an IV drip in a hospital; a civilian crew in Gaza tearing through heavy stones with their bare hands to reach a young girl, wearing white tennis shoes and a green sweatsuit that her parents must have been proud to dress her in, trapped under the rubble of a bombed-out building for fifteen hours, only for her to die before they reach her. But beyond a lack of awareness of the vast devastation, many Americans also haven’t heard what it has to do with the United States, and with the Democratic Party in particular: the fact that, in the year following October 7, the Biden administration sent nearly $23 billion to Israel with no red lines; that it vetoed four UN Security Council resolutions demanding a ceasefire; that Secretary of State Antony Blinken ignored the U.S. government’s own determination that Israel was blocking humanitarian aid to Gaza when he delivered a statement under oath to Congress last May; that the United States has violated its own laws—including the Arms Export Control Act, Section 620i of the Foreign Assistance Act, and National Security Memorandum-20—conditioning U.S. military aid to state belligerents on their compliance with U.S. and international laws of war; that the United States has undermined the authority of both the International Court of Justice (ICJ) and the International Criminal Court (ICC); and that 107 members of Congress sent a letter to the United Nations two weeks before the election threatening to withdraw U.S. funding and support for the organization if it allowed its members to unseat Israel, as the General Assembly had done with the South African apartheid regime in 1974."
