["https://www.bostonreview.net/articles/letter-to-the-israeli-left"]
title = "Letter to the Israeli Left - Boston Review"
description = "The costs of abandoning politics for interpersonal peace-building."
full_description = "Democracy depends on the free exchange of ideas. Help sustain it with a tax-deductible donation today. Aerial view over Rafah, Gaza, following the ceasefire agreement between Hamas and Israel. Image: Ashraf Amra/Anadolu via Getty Images When Hamas-led gunmen massacred nearly 1,200 people on October 7, several fundamental conceptions, together with the Gaza fence, collapsed. Among them were the reliability of Israel’s highly regarded intelligence force, Hamas’s alleged pragmatism since it rose to power, and the deeply entrenched assumption, held by parts of the Israeli left, that resolving the Palestinian-Israeli conflict rests on the ability to build bridges between people. The phrase itself has a notable legacy. At the signing ceremony of a peace treaty with Jordan in 1994, Israel’s prime minister, Yitzhak Rabin, declared, “Peace between nations is peace between people.” The following year, after signing the second of the Oslo Accords in Taba, Egypt, Rabin was assassinated by a right-wing extremist; since then, the Israeli right has tried to convince the public that a political agreement with Palestinians is unsustainable. Initially the left continued to pay lip service to the idea of peace through political settlement, but the political clout to promote this solution had already disappeared by the early 2000s, and the left retreated to a strategy of interpersonal reconciliation—to a focus, that is, on achieving “peace between people.” The following decades saw a boom in “people-to-people” activities: shared encounters between Israelis and Palestinians, international conferences, joint summer camps, and philanthropic activities. We believed that nurturing personal bonds—in controlled settings—would plant the seeds for future peace. We shifted to a therapeutic paradigm, according to which resolution stems from creating neutral spaces to heal emotional divides and form friendships. Out of necessity and false hope, we brushed aside the structural and institutional aspects of a properly political approach to collective conflict resolution."
