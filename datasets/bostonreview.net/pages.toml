["https://www.bostonreview.net/articles/how-to-buy-an-election"]
title = "How to Buy an Election - Boston Review"
description = "The problem is no longer “money in politics.” It’s just money."
full_description = "Democracy depends on the free exchange of ideas. Help sustain it with a tax-deductible donation today. Miriam Adelson, Elon Musk, Timothy Dunn, and Elizabeth Uihlein. Image: Getty Images/Wikimedia Commons This essay is part of an Election Chronicle series in our Winter 2025 issue, Trump’s Return. Subscribe to get a copy. The sheer scale of money in politics is now hard to imagine. Over the last fifteen years, it has transformed dramatically—not just in amount, but in form, as a tiny number of wealthy individuals dominate the market for power. The thesis that the United States had become an oligarchy was mildly controversial when Martin Gilens and Benjamin Page argued it in 2014, but it is now indisputable. According to political scientist Adam Bonica, the top 400 donors to Republican campaigns and super PACs in the 2024 election accounted for more than 60 percent of all funds spent on behalf of Republican candidates—nearly double the share from four years earlier. Meanwhile, the top 400 Democratic spenders accounted for just over a fifth of Democratic spending—much lower than the Republican share, and in line with recent historic norms, but still a staggering level of power for a very few. All told, during the election, some $3.4 billion was spent on the two major-party candidates through reported channels. Donald Trump’s spending came mostly through “outside” groups, such as super PACs that make independent expenditures, while the majority of Kamala Harris’s campaign spending moved through her campaign. After Elon Musk, head of the newly created Department of Government Efficiency, whose reportable political spending totaled nearly $280 million, the top spenders overall were Miriam Adelson, widow of casino owner Sheldon Adelson, and Timothy Mellon, grandson of banker Andrew Mellon, a sort of Musk avant la lettre who controlled both a massive fortune and a large swath of government as Treasury Secretary through all of the Republican administrations of the 1920s and into the Depression. Mellon was followed by Richard and Elizabeth Uihlein, owners of a packaging company and major funders of groups involved in 2020 election denial. The top seven spenders all supported Republicans exclusively, and six put in nine-figure sums. It’s notable that, with the partial exception of Musk, none are executives of publicly traded or public-facing corporations, suggesting a shift in power within contemporary capitalism."
