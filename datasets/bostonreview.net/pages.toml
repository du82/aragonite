["https://www.bostonreview.net/articles/from-the-editors-trumps-return"]
title = "From the Editors: Trump’s Return - Boston Review"
description = "Introducing our Winter 2025 issue."
full_description = "Democracy depends on the free exchange of ideas. Help sustain it with a tax-deductible donation today. Donald Trump is back in the White House. His campaign claims—immigrants are stealing, murdering, and collecting public benefits; the United States is a hapless victim of other countries’ treachery—are not true. But they are powerful. This issue demystifies them and imagines a path forward. David Austin Walsh examines Trump’s coalition of America First nationalists and Silicon Valley billionaires. These diverse interests have thus far successfully united around opposition to “wokeness,” much as the specter of communism bound the old “fusionism” of social and economic conservatives. Whether these fractious alliances will hold remains to be seen. Jeanne Morefield takes a longer view. What explains the appeal of Trump’s immigrant “invasion” story, now codified by executive order? She blames an exceptionalism decades in the making, embraced by “every mainstream narrative about American politics—Democratic and Republican, liberal and reactionary.” Focusing on the border obscures the role of Big Pharma in creating our fentanyl crisis. And it erases the principal cause of American pain: our particular brand of racial capitalism that makes life in the United States fundamentally different from life in every other wealthy nation in the world. Our Election Chronicles further illuminate the consequences of this exceptionalism: the staggering scale of money in politics, and the difficulty of reducing it through any flavor of campaign finance reform; organized labor’s disconnect from the lives of so many working people; the link between U.S.-backed violence in Gaza and political repression at home; and the Democrats’ momentous failure to rein in inequality. Confronting these obstacles, Robin D. G. Kelley argues, requires a movement with the power “to dispel ruling-class lies about how our economy and society actually work.” What does that look like? In his review of Adam Kirsch’s On Settler Colonialism, Samuel Hayim Brody identifies the sleight of hand that characterizes so much of our public discourse. Rather than engaging an idea, Kirsch tries to make it disappear. We must instead take movements for justice seriously."
