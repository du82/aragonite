full_description = "Democracy depends on the free exchange of ideas. Help sustain it with a tax-deductible donation today. Boston Review hosts both virtual and in-person events with leading scholars, writers, and activists. Recent speakers have included Samuel Moyn, Becca Rothfeld, Jefferson Cowie, Martha Nussbaum, Noam Chomsky, Robin D. G. Kelley, Keeanga-Yamahtta Taylor, and Senator Ed Markey. All virtual events are recorded and uploaded to our YouTube account here. Links to previous events can also be found below. Democracy in African American Political Thought Melvin Rogers in conversation with Neil Roberts Series: Philosophy Today October 17, 2023 | Recording The Political Theory of Algorithms Josh Simons in conversation with Lily Hu Series: Philosophy Today March 28, 2023 | Recording Justice for Animals: Martha Nussbaum with Jeremy Bendik-Keymer Series: Philosophy Today December 12, 2022 | Recording Future-Proof Science: Peter Vickers with Jana Bacevic Series: Philosophy Today November 21, 2022 | Recording Black Existential Freedom: Nathalie Etoke with Lewis Gordon Series: Philosophy Today November 14, 2022 | Recording Why Does the State Care About Your Gender?: Paisley Currah with Robin Dembroff Series: Philosophy Today October 10, 2022 | Recording How Philosophy Helps Us Find Our Way: Kieran Setiya with Anil Gomes Series: Philosophy Today October 3, 2022 | Recording The Politics of Pleasure: Kate Soper with Lynne Segal Series: Philosophy Today September 20, 2022 | Recording The Racial Capitalism of Care: A Conversation on Inequities in Medicine and Child Welfare Ruha Benjamin with Dorothy Robert and Drs. Michelle Morse and Bram Wispelwey April 27, 2022 | Recording Prospects for Peace and Justice in Israel and Palestine Sally Abed, Noam Chomsky, Alon-lee Green, Congressman Jim McGovern, and Dr. James Zogby Co-hosted with Standing Together December 9, 2021 | Recording Race & Justice: The Philosophy of Charles W. Mills A roundtable with Joshua Cohen, Derrick Darby, Robert Gooding-Williams, Desmond Jagmohan, Falguni Sheth, and Tommie Shelby November 11, 2021 | Recording"
