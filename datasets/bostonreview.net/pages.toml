["https://www.bostonreview.net/articles/g-m-tamas-post-fascism"]
title = "On Post-Fascism - Boston Review"
description = "Its central characteristic is hostility to universal citizenship."
full_description = "Democracy depends on the free exchange of ideas. Help sustain it with a tax-deductible donation today. I have an interest to declare. The government of my country, Hungary, is—along with the Bavarian provincial government (provincial in more senses than one)—the strongest foreign supporter of Jörg Haider’s Austria. The right-wing cabinet in Budapest, besides other misdeeds, is attempting to suppress parliamentary governance, penalizing local authorities of a different political hue than itself, and busily creating and imposing a novel state ideology, with the help of a number of lumpen intellectuals of the extreme right, including some overt neo-Nazis. It is in cahoots with an openly and viciously anti-Semitic fascistic party that is, alas, represented in parliament. People working for the prime minister’s office are engaging in more or less cautious Holocaust revisionism. The government-controlled state television gives vent to raw anti-Gypsy racism. The fans of the most popular soccer club in the country, whose chairman is a cabinet minister and a party leader, are chanting in unison about the train that is bound to leave any moment for Auschwitz. On the ground floor of the Central European University in Budapest you can visit an exhibition concerning the years of turmoil a decade or so ago. There you can watch a video recorded illegally in 1988, and you can see the current Hungarian prime minister defending and protecting me with his own body from the truncheons of communist riot police. Ten years later, this same person appointed a communist police general as his home secretary, the second or third most important person in the cabinet. Political conflicts between former friends and allies are usually acrimonious. This is no exception. I am an active participant in an incipient anti-fascist movement in Hungary, a speaker at rallies and demonstrations. Our opponents—in personal terms—are too close for comfort. Thus, I cannot consider myself a neutral observer."
