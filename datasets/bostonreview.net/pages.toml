["https://www.bostonreview.net/articles/more-than-genocide"]
title = "More than Genocide - Boston Review"
description = "The law occludes the abhorrent violence routinely perpetrated by states in the name of self-defense."
full_description = "Democracy depends on the free exchange of ideas. Help sustain it with a tax-deductible donation today. A protest in Barcelona on November 11, where people carried a list of names of those killed by Israeli airstrikes. Image: Paco Freire / SOPA Images/Sipa USA via AP Images In the wake of Hamas’s October 7 attack in Israel, an international genocide debate has been unleashed. Some in the field of genocide studies, including Israeli historian Raz Segal and British sociologist Martin Shaw, have argued that Israel’s retaliatory assault on Gaza constitutes genocide. Palestinian and international legal academics, and increasing numbers of commentators (including Jewish voices), also claim that genocide is imminent or already underway, and the Center for Constitutional Rights is suing the U.S. government for failing to prevent genocide in Gaza. Before and after them, other international legal experts issued a statement condemning Hamas’s massacre of 1,200 Israelis as itself genocidal, and a group of scholars of the Holocaust wrote that the acts brought to mind “the pogroms that paved the way to the Final Solution.” The point of genocide claims is not only legal and strategic but—as with the Russian invasion of Ukraine and the Chinese treatment of Uyghur citizens—urgent and moral, concerned both with saving lives or stemming humanitarian disaster. As I write, Gaza is being destroyed by Israeli bombs and missiles, Palestinian civilian casualties are mounting by the hour—over 11,000, more than two-thirds women and children—hospitals have been targeted, and humanitarian workers and journalists are being killed. Over a million Palestinians have been displaced, and Israeli armed forces are invading. Meanwhile Israeli settlers and authorities have unleashed a wave of terror on West Bank Palestinians. “The day of revenge is coming,” declare masked men as they murder and expel Palestinians from their villages. In addition to debates among legal experts, a global protest movement—the largest since the Second Gulf War—has emerged, decrying Israel’s actions as genocidal and demanding a ceasefire. This genocide claim expresses outrage and grief about the destruction of bare, less “grievable” life, seeks to generate political pressure to rein in Israeli ambitions, and hopes eventually to generate international legal accountability. It also seeks to incriminate Israeli military violence by placing it in the same frame as the Holocaust, the paradigm case of genocide. For that reason, a Palestinian academic in Gaza, Haidar Eid, wrote on October 10 that the conflict is “our Warsaw Uprising moment.” In response, Israeli commentators reversed the equation by comparing their country’s bombing of Gaza to the British destruction of Dresden during World War II. For them, Palestinians, not Israelis, are the Nazis in this fatal drama."
