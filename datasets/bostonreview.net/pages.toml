title = "About - Boston Review"
description = "Animated by hope and committed to equality, we believe in the power of collective reasoning and imagination to create a more just world."
full_description = "Democracy depends on the free exchange of ideas. Help sustain it with a tax-deductible donation today. Boston Review is a political and literary forum—a public space for discussion of ideas, politics, and culture. Independent and nonprofit, animated by hope and committed to equality, we believe in the power of collective reasoning and imagination to create a more just world. To that end, we publish a diverse range of voices and views—on the web (always for free), in print (four times a year), and at public events (not just in Boston). By fostering the open and engaged exchange of ideas essential to a flourishing democracy, we aim to create a more egalitarian public sphere. Our signature feature is the Forum, which subjects arguments to constructive scrutiny and debate. Since democracy depends on engaged discussion, we are committed to keeping our website free and open to everyone, regardless of ability to pay. And since it compromises the integrity of public deliberation, we no longer host any advertising. But we can’t forgo the revenue from ads and paywalls without the financial support of our readers. To help sustain a public space for rigorous argument, constructive debate, and vibrant imagination on behalf of a more just world, please become a member or make a tax-deductible donation. Boston Review began in 1975 as New Boston Review, a quarterly devoted to literature and the arts. Its first editors were Juan Alonso, Jeffrey C. Hart, and Margaret Hill Carter, and the founding staff included Anita Silvey and Jerrold Hickey. In 1977, Gail Pool joined Alonso as co-editor, along with Lorna Condon the following year. Nicholas Bromell became editor in 1980, with publishing support from Arthur J. Rosenthal, and in 1982 the magazine was renamed Boston Review. Subsequent editors were Gail Caldwell, Mark Silk, and Margaret Ann Roth. An editorial board—including Anthony Appiah, Joshua Cohen, Duncan Kennedy, Kris Rondeau, and Charles Sabel—replaced Roth in 1991. Cohen took over as editor-in-chief in 1993 and developed the magazine’s current focus and mission while maintaining a strong profile in fiction and poetry. Deborah Chasman joined Cohen as co-editor in 2002."
