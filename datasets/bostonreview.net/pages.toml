["https://www.bostonreview.net/articles/a-real-post-neoliberal-agenda"]
title = "A Real Post-Neoliberal Agenda - Boston Review"
description = "Bidenomics foundered on ten years of Democratic reluctance to declare war on inequality."
full_description = "Democracy depends on the free exchange of ideas. Help sustain it with a tax-deductible donation today. This essay is part of an Election Chronicle series in our Winter 2025 issue, Trump’s Return. Subscribe to get a copy. The year 2014 was a heady moment in the economic policy world. That spring, French economist Thomas Piketty’s Capital in the Twenty-First Century was published in English to astounding commercial and intellectual success. The book painted a devastating picture of the post–Cold War economic order, uniting groundbreaking empirical evidence with a comprehensive theory explaining the vast accumulation of wealth and power at the top of the global economic pyramid. And it appeared at a moment when the apparatus of the Democratic Party needed just such a shock. Recovery from the 2008 financial crisis, itself a consequence of Clinton-era financial deregulation, had been too long and too weak in the making; inequality ratcheted ever upward and jobs continued disappearing overseas. These trends signaled that the policies, rhetoric, and personnel of the Obama administration simply weren’t up to the task. Piketty’s reception, though not without pushback, helped cement consensus that something had to be done, kicking off a spirited effort within the progressive policy world to reform the Democrats’ approach to the economy. Now that Trump has dealt a decisive deathblow to the post-Obama political system, it’s worth taking stock of where that moment went. Postmortems on Bidenomics have tended to focus on climate provisions, rising protectionism in trade, and the macroeconomics of stimulus and inflation. The limits of the administration’s “industrial policy,” touted as marking a “post-neoliberal” paradigm shift, have been extensively documented; it was always a national security program first—an ill-conceived reaction to fears of a rising China—and a pro-worker agenda second, if at all. The bigger, less talked-about picture is the long arc of ten years of failure to confront inequality after the Piketty moment in 2014. Across four key policy areas—taxation, labor standards, the welfare state, and antitrust—Democrats could have pursued a comprehensive program for combating plutocracy and empowering workers. But the opportunity was frittered away through a relentless focus on playing by the old rules of policy debate and routing reform through the usual elite channels, insulated from—and often outright hostile to—the voices and views of on-the-ground constituencies. All that came at the cost of forging a durable political coalition."
