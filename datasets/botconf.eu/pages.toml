full_description = "Botconf Author Listing Go back to A-Z list Kelsey Merriman Last known affiliation: Proofpoint Botconf 2023 Date: 2023-04-13Royal Threat Actor:Fake Ransomware Extortion Kelsey Merriman 🗣 p:after { content: none !important; display: none !important; } Botconf 2024 TLP:AMBER Date: 2024-04-26Pikabot’s Sophisticated Evasion: We Catch Em All Kelsey Merriman 🗣 | Pim Trouerbach 🗣 Abstract (click to view) The proliferation of sophisticated malware has posed exceptional challenges to the cybersecurity landscape with Pikabot emerging as a notable and evasive malware. We endeavor to provide a comprehensive and consumable analysis of the Pikabot malware. Utilizing a combination of threat intelligence, behavioral analysis, reverse engineering, botmulation, this research aims to provide actionable insights for cybersecurity analysts, enabling defenders to understand the capabilities, harden defenses, devise countermeasures, and contribute to the community’s efforts to mitigate the evolving threat of Pikabot. p:after { content: none !important; display: none !important; }"
