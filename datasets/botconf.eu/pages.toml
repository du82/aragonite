title = "Botconf Author Listing – Botconf 2025"
description = "The technical storage or access is strictly necessary for the legitimate purpose of enabling the use of a specific service explicitly requested by the subscriber or user, or for the sole purpose of carrying out the transmission of a communication over an electronic communications network."
full_description = "Botconf Author Listing Go back to A-Z list Olivier Bilodeau Last known affiliation: GoSecure Inc. Bio: Olivier Bilodeau, a principal researcher at Flare, brings 12+ years of cutting-edge infosec expertise in honeypot operations, binary reverse-engineering, and RDP interception. Passionate communicator, Olivier spoke at conferences like BlackHat, DEFCON, Botconf, Derbycon, and more. Invested in his community, he co-organizes MontréHack, is NorthSec’s President, and runs its Hacker Jeopardy. Botconf 2017 Date: 2017-12-05Botnet Tracking and Data Analysis Using Open-Source Tools Olivier Bilodeau 🗣 | Masarah Paquet-Clouston 🗣 Abstract (click to view) Fully understanding a botnet often requires a researcher to go beyond standard reverse-engineering practice and explore the malware’s network traffic. The latter can provide meaningful information on the evolution of a malware’s activity. However, it is often disregarded in malware research due to time constraints and publication pressures.The workshop is about overcoming such constraints by providing a powerful workflow to conduct quick analysis of malicious traffic. The data science approach presented capitalizes on open-source tools (Wireshark/Tshark, Bash with GNU parallel) and valuable python libraries (ipython, mitmproxy, pandas, matplotlib). During the workshop, participants will do practical technical labs with datasets from our recent botnet investigation. They will learn how to quickly find patterns, plot graphs and interpret data in a meaningful way. Although the exercises will focus on botnet’s data, the tools and skills learned will be useful to all sorts of context. Moreover, to ensure that participants take the most out of the workshop, it will be built in a way to allow them to easily replicate the data-analysis environment at home and reproduce similar analysis with their own traffic data.Workshop Outline Introduction to the workshop Overview of the Linux/Moose botnet The datasets available: Pcaps and mitmproxy logs Overview of the tools we will use Network traffic and C&C protocol analysis Lab 1: Find the potential victims that have been targeted by the botnet’s scanner Lab 2: Find and extract the C&C traffic in the Pcaps Lab 3: Find the list of proxy clients IPs and evaluate if the list changes through time Decrypted HTTPS traffic data analysis Lab 4: Find the list of websites targeted by the botnet and graph them based on the proxy client IP Lab 5: Graph the total number of requests made per proxy client through time Lab 6: Find whether proxy clients are re-using their fake social media accounts p:after { content: none !important; display: none !important; } Botconf 2017 Date: 2017-12-07Sysmon Sigs for Linux Honeypots Olivier Bilodeau 🗣 p:after { content: none !important; display: none !important; } Botconf 2016 Date: 2016-12-01Attacking Linux/Moose 2.0 Unraveled an EGO MARKET Masarah Paquet-Clouston 🗣 | Olivier Bilodeau 🗣 Abstract (click to view) Want to give your blog a push or your “gun show” more views? Then why not buy 50,000 fake followers for $1,000! Click farms from down South or botnets such as Game over Zeus will be more than happy to supply them for you. For this talk, a criminologist and a security researcher teamed up to hunt a large-scale botnet familiar to Botconf 2015’s attendees: Linux/Moose. The hunt was fastidious since Linux/Moose 2.0 has stealth features and runs only on embedded systems such as consumer routers or Internet of Things (IoT) devices. Using honeypots set up across the world, we managed to get virtual routers infected to learn how this botnet spreads and is operated. To do so, we performed a large-scale HTTPS man-in-the-middle attack on several honeypots over the course of several months decrypting the bot’s proxy traffic. This gave us an impressive amount of information on the botnet’s activities: the name of the fake accounts it uses, its modus operandi to create fake follows and the identification of its consumers, companies and individuals. External link: Blog post p:after { content: none !important; display: none !important; } VideoBotconf 2016 Date: 2016-12-01Malboxes Olivier Bilodeau 🗣 External links: Online presentation | Blog post p:after { content: none !important; display: none !important; } Botconf 2015 Date: 2015-12-04A moose once bit my honeypot – A story of an embedded Linux botnet Olivier Bilodeau 🗣 Abstract (click to view) Embedded Linux platforms, labeled “Internet of Things” devices these days, have been increasingly targeted by malware authors in the last few years, with most infections resulting in the compromised system taking part in a botnet. While many of these botnets have been used to perform distributed denial of service (DDoS) or DNS hijacking attacks, we took the opportunity to thoroughly investigate a slightly different take on the Embedded Linux Botnet landscape. Targeting Linux-based consumer routers, Linux/Moose is used by its operators to perform fraud on social networking sites like Facebook, Instagram, Twitter and YouTube. With this intent, it is built with SOCKS and HTTP proxying capabilities and a generic packet sniffer and exfiltration mechanism. To increase the size of its botnet, Linux/Moose uses several scanner threads that find and infect hosts, with the assistance of a C&C server to provide a binary specific to the victim’s architecture. Additionally, the malware has code to enable it to spread past firewalls and performs NAT traversal to allow the operator inside firewalled networks. External link: Online presentation p:after { content: none !important; display: none !important; } PDFBotconf 2025 TLP:CLEAR Date: 2025-05-21Behind Enemy Lines: the Modern Infostealer Ecosystem from Victims to Operators Olivier Bilodeau 🗣 | Estelle Ruellan 🗣 Abstract (click to view) Modern information stealers have evolved far beyond simple credential harvesters into sophisticated tools that capture complete digital profiles of their victims. Our deep-dive dissects the anatomy of stealer malware, exploring infection methods, attack chains, and the vast criminal ecosystems enabling their proliferation. Through analysis of real-world compromises, including timestamped desktop screenshots at infection, we demonstrate how threat actors exploit compromised ad networks and trojanized software for mass deployment. We present case studies of campaigns targeting unauthorized distributions of Microsoft Office and MidJourney, revealing how attackers manipulate trust and human behavior. We examine the Operation Magnus takedown, a collaborative effort with ESET and law enforcement, which exposed the sophisticated infrastructure of modern criminal enterprises. Drawing from extensive stealer log analysis, we demonstrate how these threats bypass multi-factor authentication, compromise password managers, and extract cryptocurrency wallets. Additionally, we analyze Chrome’s application-bound encryption and explain why its circumvention paradoxically creates new detection opportunities. Our investigation uncovers unique stealer logs from C2 operators who inadvertently infected themselves, providing unprecedented insight into the backstage operations of cybercrime ecosystems. We profile the “Malware Maestro,” an advanced threat actor orchestrating multiple malware families—Private Loader, Mystic, Asuka, and Raccoon Stealer—to build a resilient criminal infrastructure. To empower security practitioners, we’re releasing two community resources: a curated dataset of stealer logs for research and a PowerShell framework for automated credential testing against Entra ID. This comprehensive analysis and toolset equip defenders with practical insights to detect, defend against, and disrupt one of today’s most consequential yet underexamined threats. p:after { content: none !important; display: none !important; }"
