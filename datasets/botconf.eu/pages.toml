full_description = "Botconf Author Listing Go back to A-Z list Suweera De Souza Last known affiliation: CrowdStrike Bio: Suweera has over a decade of experience in reversing malware and botnet analysis. She previously presented at BotConf, NorthSec, Fal.Con, and OBTS and previously volunteered giving a BlackHoodie workshop at REcon and NorthSec and workshops for CyberAegis, a local community in Montreal. Currently Suweera is employed as a Senior Security Researcher at CrowdStrike where she focuses on e-crime botnets and macOS malware. Botconf 2023 Date: 2023-04-13Tracking Bumblebee’s Development Suweera De Souza 🗣 Abstract (click to view) In March 2022, a new buzz called Bumblebee appeared in the eCrime scene. This loader is built to execute tasks from its command-and-control (C2), and deliver payloads such as CobaltStrike. But its development doesn’t stop there. In the span of less than a year, Bumblebee has been through several incremental updates, to such an extent, that this malware may be one of the most actively maintained malware families out there. This presentation aims to get a sense of the operator’s development process behind Bumbleebee – how it changes and adapts in response to current endpoint defense efforts– and how its techniques compare to other botnet families. p:after { content: none !important; display: none !important; } PDF VideoBotconf 2025 TLP:AMBER Date: 2025-05-22Unpacking WIZARD SPIDER’s Crypters: Attribution Challenges in a Tangled Web of Adversaries Bea Venzon 🗣 | Suweera De Souza 🗣 Abstract (click to view) In the era of law enforcement crackdowns, cybercriminals continue to find ways to adapt, persist and confuse. This is the case with WIZARD SPIDER—a Russian-based cybercrime group known for operating TrickBot and Conti—whose former members likely continue to run a private crypting service that has been in operation since before the Conti leaks in 2022. These crypters are critical tools that enable threat actors to obfuscate malware and evade detection. This talk unravels the crypters’ role within WIZARD SPIDER’s infrastructure revealing hidden webs connecting seemingly disparate cybercrime groups—including existing adversaries such as LUNAR SPIDER and WANDERING SPIDER, and relatively newer adversaries such as VICE SPIDER. Through case studies and technical breakdowns, we will highlight how tracking crypters offer a new lens for identifying and mapping cybercriminal activity, especially in an era where shared infrastructure and tooling blur the lines between threat actors. p:after { content: none !important; display: none !important; }"
