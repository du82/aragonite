title = "Botconf 2025 – Botconf 2025"
description = "The technical storage or access is strictly necessary for the legitimate purpose of enabling the use of a specific service explicitly requested by the subscriber or user, or for the sole purpose of carrying out the transmission of a communication over an electronic communications network."
full_description = "Botconf 2025 20th - 23rd May 2025, Angers Last year: 450 participants from 30 countries all over the world 28 presentations and 3 workshops 4 days of exchanges, discussions and making new friends ! Botconf 2024 Botconf 2024 RegistrationScheduleSponsors Registration RegistrationScheduleSponsors Main conference takes place from 21st to 23rd of May 2025 Workshops are on 20th May - You will need to purchase additional tickets (to be made available as soon as we confirm the speakers) Early bird tickets are in limited capacity and are offered on a first come first serve basis [SOLD OUT] If you want to invite a guest at the Gala reception on Thursday 22nd, please purchase an optional Gala ticket Vente de billets en ligne Schedule RegistrationScheduleSponsors Tuesday 20th May 2025 - Workshops 12:00 – 13:30 Badge distribution for Workshop attendees & Lunch 🗣 p:after { content: none !important; display: none !important; } 13:00 – 18:00 TLP:GREENWS1 – Defeating Malware Evasion: Techniques and Countermeasures Kyle Cucci 🗣 | Randy Pargman 🗣 Abstract (click to view) Ready to dive into the world of malware evasion techniques? This hands-on workshop will give students the tools and skills to spot and defeat evasion tricks used by malicious code. Split into three “modules,” the workshop will take you through a journey of analyzing malware with free, open-source tools. You’ll tackle evasion techniques head-on, learning how to see through the malware’s tricks and gain a deeper understanding of its behavior. Expect a mix of instructor-created malware (with code to analyze alongside the samples) and real-world malware found in the wild. By the end, you’ll walk away with a collection of malware samples, pages of code, and the expertise to continue your analysis at home. Plus, you’ll have the know-how to bypass common anti-analysis and evasion methods that malware uses to sneak past sandboxes and endpoint defenses. Are you ready to level up your malware analysis skills? Let’s dive in! p:after { content: none !important; display: none !important; } 13:00 – 18:00 TLP:CLEARWS2 – Android Malware Exposed: Dissecting Modern Mobile Threats Federico Valentini 🗣 | Alessandro Strino 🗣 | Michele Roviello 🗣 Abstract (click to view) Understanding Android malware can initially feel daunting and disorienting, but with a solid foundation of knowledge and a touch of automation, the process becomes much easier. This workshop teaches participants the essential concepts required to analyze Android malware effectively. The knowledge gained here can be applied to other security domains, such as malware detection, classification, and automation. By attending, participants will develop technical expertise and gain a deeper understanding of the techniques and methodologies commonly used in malware analysis. Another key goal of this workshop is to delve into the analyst’s mindset, helping attendees adopt the critical thinking and problem-solving approach required for reverse engineering tasks. Designed for both aspiring analysts and those with intermediate experience, this workshop emphasizes the development of critical thinking and systematic problem-solving approaches essential for effective reverse engineering. Participants will analyze prominent malware families, including Toxic Panda, DroidBot, Bingomod, etc.. through a combination of static and dynamic analysis techniques enhanced by practical Python scripting and Frida instrumentation. The workshop will have a final challenge (a hands-on exercise) featuring a custom malware sample designed specifically for attendees. This final challenge allows participants to apply all the techniques demonstrated during the training session. The analysis is guided by a series of questions, encouraging deeper exploration and problem-solving as participants progress. In classic challenge fashion, the ultimate goal is to uncover a hidden flag. With its blend of practical exercises, technical insights, and real-world applications, this workshop offers a comprehensive and engaging introduction to Android malware analysis. It empowers participants to tackle similar challenges confidently in their cybersecurity journey. p:after { content: none !important; display: none !important; } 13:00 – 18:00 TLP:CLEARWS3 – Using Suricata to Track Malware Érlc Leblond 🗣 | Peter Manev 🗣 Abstract (click to view) The objective of this workshop is to demonstrate how Suricata can be used to leverage network information when tracking malware. With the logging of protocols transactions (NSM), Suricata provides an exhaustive view of network activity that can be used when the intrusion detection part of Suricata has failed detecting the malware. But did it really failed ? In a lot of cases, generic signatures are highlighting the activity of malware but they need to be look at and understood to be able to detect the malicious activity. On top of that, some other techniques such as learning dataset can also be used to detect malware activity. Once the network characteristics of the malware have been established, it is then time to determine which IOCs can be used and/or write signatures to have a detection dedicated to this malware. p:after { content: none !important; display: none !important; } 13:30 – 17:30 TLP:CLEARWS4 – Ghidra Analysis & Automation Max ‘Libra’ Kersten 🗣 Abstract (click to view) Reverse engineering is done for a variety of reasons, most commonly to analyze malware, when searching for (and when looking to understand) vulnerabilities, or simply because of one’s curiosity. The NSA understood this early on and developed a framework to aid them in their reversing endeavors, which they open-sourced in early 2019: Ghidra. Since then, Ghidra has been one of the industry standard tools to analyze files, mainly due to its active development, as well as due to its accessible and versatile nature. This four-hour workshop primarily focuses on the analyst mindset and fundamental knowledge with regards to reverse engineering, including but not limited to understanding Ghidra’s core capabilities such as the disassembly and decompiler views, creating and retyping data structures, writing scripts to extend and automate tasks, and the creation and use of function recognition databases for FunctionID and BSim. The concepts behind the capabilities of Ghidra are the focus of the theory and during the hands-on exercises, allowing one to transfer the gained knowledge to another tool if so desired. As such, this class is perfect for aspiring and beginning analysts, while also providing background information and additional techniques for intermediate analysts. The workshop’s materials will partially consist of multiple malware samples, the precautions for which will be explained in-detail during the workshop, ensuring the safety and integrity of the systems of the attendees. A laptop with a preinstalled Intel based 64-bit Ubuntu 22.04 VM, along with Ghidra, Eclipse, and OpenJDK 21 is required. Additionally, knowing how to read C/C++ is required when dealing with decompiled code. Being able to read and write Java is required for the automation scripting, even though Python 2 can be used as well. If you cannot write Java and would still like to participate, you are welcome, but do note that this will impede some parts of the workshop’s exercises. Questions about the workshop can be asked via my open Twitter DMs: @Libranalysis (https://twitter.com/Libranalysis) p:after { content: none !important; display: none !important; } 15:30 – 16:00 Coffee break 🗣 p:after { content: none !important; display: none !important; } Wednesday 21st May 2025 - Main conference 10:00 – 11:00 Badge distribution & Welcome coffee 🗣 p:after { content: none !important; display: none !important; } 11:00 – 11:10 Opening speech Éric Freyssinet 🗣 p:after { content: none !important; display: none !important; } 11:10 – 11:40 TLP:CLEARExecuting RATs in a Long-Term Observable Customized Online Sandbox Shohei Hiruta 🗣 | Yuki Umemura | Masaki Kubo | Nobuyuki Kanaya | Takahiro Kasama Abstract (click to view) Malware sandboxes are essential tools for malware analysis, allowing researchers to execute malware in controlled environments to reveal its behavior, communication destinations, and configuration settings. Due to their convenience, a wide variety of both free and commercial sandboxes are available. However, existing sandboxes face three major challenges: limited execution time for malware, inflexible execution environments, and restricted logging capabilities. To address these limitations, we developed a highly functional sandbox that eliminates execution time restrictions, allows for flexible configuration of execution environments, and provides real-time comprehensive logging. This sandbox is currently in operation at over 50 Japanese companies. We have been operating this sandbox with improvements, and now we need to evaluate whether these functions are effective. Therefore, we evaluated our sandbox from two perspectives: Can we observe the activity of the attacker behind malware? Is the observed activity unobservable by existing sandboxes? A remote access trojan (RAT), which can control an attacker-infected machine, was appropriate for this evaluation. We conducted an analysis using RATs collected over a six-month period in our sandbox. As a result, we were able to observe four types of attacker activity through the RATs. We also found that these activities occurred more than an hour after the RAT had connected to the command and control (C2) server. These activities are impossible to observe with existing sandboxes. Finally, we discussed how to improve and operate our sandbox based on these results in the future. p:after { content: none !important; display: none !important; } 11:40 – 12:10 TLP:CLEARVenomLNK’s Triple Threat: The Backdoor Saga Muhammed Irfan V A 🗣 | Avinash Kumar 🗣 | Nirmal Singh Abstract (click to view) The escalation of cyber threats in recent years has introduced malware with advanced capabilities. Among these, backdoor malware has evolved significantly and new families of backdoor malware have surfaced, showcasing capabilities that threaten organizations worldwide. This research paper provides an in-depth analysis of three campaigns delivering backdoor malware families using VenomLNK, a Malware-as-a-Service (MaaS) tool. Our research delves deeply into the analysis of two newly discovered backdoor malware, providing a comprehensive look at the attack chains they utilize and the ways in which they are delivered. We also investigate motives and the threat group behind these malicious campaigns. To conduct this analysis, we collected a vast array of samples from these campaigns. By examining these samples and campaigns, we uncovered information regarding motive and victimology. This research also covers the core features of these backdoor malware, focusing on how they communicate over networks along with the commands they support. These commands include executing shell commands, Proxying traffic and many other intriguing commands. We also provide a detailed explanation of how each command works and its specific role within the malware. p:after { content: none !important; display: none !important; } 12:10 – 12:45 TLP:AMBERRussian Full Spectrum Warfare – DDOSIA Infrastructure Overview & last TTPs Julien Dugay 🗣 | Félix Guyard 🗣 Abstract (click to view) In this presentation we will cover how we could retrieve latest C2s published by the admins of DDOSIA project as soon as a C2 is taken down. We will touch on the implemented custom docker-based sandbox for real-time target collection of DDOSIA’s victims thanks to a collaboration with a fellow at the ForensicXlab, which we will compare to other methodologies from the literature. p:after { content: none !important; display: none !important; } 12:45 – 14:00 Lunch 🗣 p:after { content: none !important; display: none !important; } 14:00 – 14:30 TLP:GREENUnmasking Styx Stealer: How a Hacker’s Slip led to an Intelligence Treasure Trove Alexey Bukhteyev 🗣 Abstract (click to view) Careful monitoring of malicious campaigns can sometimes uncover surprising discoveries. Our latest research revealed that even skilled cybercriminals, despite their meticulous efforts to stay in the shadows, can commit critical security blunders. This presentation unveils the discovery and analysis of Styx Stealer, a new malware variant derived from the infamous Phemedrone Stealer. Our investigation not only dissects the technical capabilities of Styx Stealer but also exposes significant missteps by its developer, leading to the unmasking of associated cybercriminals and their operations. Styx Stealer emerged in early 2024 as a powerful malicious tool capable of exfiltrating sensitive information, including saved browser credentials, data from browser extensions, cryptocurrency wallet data, and sessions from messaging platforms like Telegram and Discord. Technically, Styx Stealer retains the core functions of its predecessor while incorporating new features such as a clipboard monitor, crypto-clipper, advanced sandbox evasion, and anti-analysis techniques. Despite its relatively recent appearance, we observed its deployment in spam campaigns targeting various sectors throughout 2024. This investigation helps us better understand the inner workings of cybercriminal operations, both from the perspective of malware developers and distributors. It also serves as a warning to cybercriminals: they can never be certain where and what traces they leave behind, what mistakes they make, and that even over time, their actions and identities can be uncovered. p:after { content: none !important; display: none !important; } 14:30 – 15:10 TLP:CLEARVietnamese Hacking Group : A Rising of Information Stealing Campaigns Going Global Chetan Raghuprasad 🗣 Abstract (click to view) In recent years, Vietnamese cybercrime groups have significantly advanced their capabilities, acquiring sophisticated tools and tactics that have enhanced their operational success. The pandemic era marked a turning point, as these groups expanded their credential theft operations to a global scale, discovering innovative methods to breach corporate firewalls worldwide, thereby facilitating further criminal activities such as ransomware and information-stealing attacks. Since the close of 2023, our research has unveiled at least three hacking groups, originating from Vietnam, that are targeting a majority of Asian countries and select European nations. Driven by financial motivations, these groups are primarily focused on stealing credentials, financial data, and social media accounts, including those related to business and advertising. This presentation will expose the vast criminal enterprise these groups have constructed, detailing their comprehensive software stacks, networks, and their sophisticated techniques, tactics, and procedures (TTP). Through multiple case studies, we will illustrate the"
