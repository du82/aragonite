full_description = "Botconf 2025 - 12th Edition Angers, France, 20th (Workshops) 21st-23rd (Main confererence) May 2025 The Botnet & Malware Ecosystems Fighting Conference Registration We welcome you in Angers in ... Day Hour Minute Second “A cat is more intelligent than people believe, and can be taught any crime...” – Mark Twain Recent editions Botconf 2023 Strasbourg, 11th to 14th April 2023 Learn More Botconf 2024 Nice, 23rd to 26th April 2024 Learn More Become a sponsor Botconf is not possible without the help of our sponsors. Their main interests are to support the community, recruit new talents and simply to take part in this one of a kind conference. Learn More 2024's sponsors What you can expect during Botconf Botconf typically gathers 400 people from all around the world and various backgrounds. They all share the same goal of fighting malware, but with complimentary approaches: law enforcement, academia, CSIRT, threat analysis teams, antivirus developers, etc. The first day is dedicated to smaller workshops and the main conference takes place the following three days, with plenty of opportunities to exchange and also share some good food. Learn More"
