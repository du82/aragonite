description = "The technical storage or access is strictly necessary for the legitimate purpose of enabling the use of a specific service explicitly requested by the subscriber or user, or for the sole purpose of carrying out the transmission of a communication over an electronic communications network."
full_description = "Botconf Author Listing Go back to A-Z list Félix Guyard Botconf 2023 Date: 2023-04-13VISION-ProcMon: Visualization tool dedicated to malware analysts Félix Guyard 🗣 Abstract (click to view) Félix won the Botconf 2023 Lightning talk prize for the quality of his demonstration p:after { content: none !important; display: none !important; } PDF VideoBotconf 2024 Date: 2024-04-26Streamlining Memory Forensics with VolWeb 🗣 | Félix Guyard Abstract (click to view) While open-source memory forensics tools have become more prevalent in recent years, there are still a lot of challenges associated with its use. Current opensource memory forensics tools lack of consistency in terms of automation, user interface, data visualization and collaboration. As criminals and hacker methods become ever more sophisticated, memory forensics has emerged as a crucial method for identifying cyber threats and analyzing malware. However, traditional opensource memory analysis tools used alone can be time-consuming, and difficult to use for one who seek to investigate and collaborate on a memory image. The increasing complexity of attacks means that investigators need to centralize and process more data than ever before, making it even harder to keep up. The need to automate and make memory forensics more human friendly is crucial and should not be a luxury. VolWeb is an open-source digital memory forensic web platform. The goal of this tool is to improve the efficiency of memory forensics by providing a centralized, collaborative, visual and enhanced platform dedicated to investigators. It gives the opportunity to work together on cases, use visualization tools to quickly identify anomalies, tag interesting elements, dump processes and files to later perform malware analysis, generate technical reports and more. The core memory analysis engine is based on the volatility3 framework which is still under active development to replace the previous stable version of volatility written in python2 (deprecated). Using the Django framework in combination with this engine, this interconnection allows for the creation of user-friendly interfaces, making the tool more accessible even to those who may not have extensive knowledge of the command-line interfaces. This can save time and effort on the part of the forensic investigator by automating the entire data extraction process of a memory image and presenting the data in a standardized way. The tool initial configuration, deployment and update in a digital investigation lab is made easier with the use of docker. In this proposal, we will explore the development and implementation of VolWeb, highlight its benefits for investigators in the digital forensics’ community. p:after { content: none !important; display: none !important; } Botconf 2025 TLP:AMBER Date: 2025-05-21Russian Full Spectrum Warfare – DDOSIA Infrastructure Overview & last TTPs Julien Dugay 🗣 | Félix Guyard 🗣 Abstract (click to view) In this presentation we will cover how we could retrieve latest C2s published by the admins of DDOSIA project as soon as a C2 is taken down. We will touch on the implemented custom docker-based sandbox for real-time target collection of DDOSIA’s victims thanks to a collaboration with a fellow at the ForensicXlab, which we will compare to other methodologies from the literature. p:after { content: none !important; display: none !important; }"
