description = "Association loi 1901, RNA W442011513, préfecture de Nantes (Loire-Atlantique, France)Adresse: 3 rue des Rochers, F-44400 REZÉSIRET: 789 576 014 00029Email: contact@botconf.eu"
full_description = "Who we are A team of friends In 2012, a bunch of friends discussed online (on IRC!) the crazy idea that there was a place for a conference aimed specifically at understanding malware ecosystems and botnets from all angles: from the malware to the people behind and ways to protect from them. The team is composed of women and men whose daily lives are dedicated to protecting their organisations, understanding cyberthreats and training others. Legal notice Alliance internationale de lutte contre les botnetsAssociation loi 1901, RNA W442011513, préfecture de Nantes (Loire-Atlantique, France)Adresse: 3 rue des Rochers, F-44400 REZÉSIRET: 789 576 014 00029Email: contact@botconf.eu Editor in chiefÉric Freyssinet, chairman of AILB. Hosting providerGANDI SAS, 63-65 boulevard Massena à Paris (75013) France. Image copyrightsThe images on this website may be free of rights or sometimes made available freely through the following providers: rawpixel.com, icons by Andrean Prabowo Personal data processing Processing of personal data on this website are made in accordance with the General data protection regulation and French regulations. Any concerns may be addressed to privacy@botconf.org. Cookies and other tracing elements are only inserted when necessary to facilitate your visit on the website. Videos stored remotely are only opened by an active action of the reader."
