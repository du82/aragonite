ization via Learning Correlated Latent Space. Seunghun Lee, Jaewon Chu, Sihyeon Kim, Juyeon Ko, Hyunwoo J. Kim. NeurIPS 2023. Unexpected Improvements to Expected Improvement for Bayesian Optimization. Sebastian Ament, Samuel Daulton, David Eriksson, Maximilian Balandat, Eytan Bakshy. NeurIPS 2023. Self-Correcting Bayesian Optimization through Bayesian Active Learning. Carl Hvarfner, Erik Orm Hellsten, Frank Hutter, Luigi Nardi. NeurIPS 2023. Hypervolume Knowledge Gradient: A Lookahead Approach for Multi-Objective Bayesian Optimization with Partial Information. Sam Daulton, Max Balandat, Eytan Bakshy. ICML 2023. Global Optimization with Parametric Function Approximation. Chong Liu, Yu-Xiang Wang. ICML 2023. Sparse Bayesian Optimization. Sulin Liu, Qing Feng, David Eriksson, Ben Letham, Eytan Bakshy. AISTATS 2023. Bayesian Optimization over High-Dimensional Combinatorial Spaces via Dictionary-based Embeddings. Aryan Deshwal, Sebastian Ament, Maximilian Balandat, Eytan Bakshy, Janardhan Rao Doppa, David Eriksson. AISTATS 2023. qEUBO: A Decision-Theoretic Acquisition Function for Preferential Bayesian Optimization. Raul Astudillo, Zhiyuan Jerry Lin, Eytan Bakshy, Peter I. Frazier. AISTATS 2023. Discovering Many Diverse Solutions with Bayesian Optimization. Natalie Maus, Kaiwen Wu, David Eriksson, Jacob Gardner. AISTATS 2023. Multi-Fidelity Bayesian Optimization with Unreliable Information Sources. Petrus Mikkola, Julien Martinelli, Louis Filstroff, Samuel Kaski. AISTATS 2023. Bayesian Optimization with Conformal Coverage Guarantees. Samuel Stanton, Wesley Maddox, Andrew Gordon Wilson. AISTATS 2023. Inducing Point Allocation for Sparse Gaussian Processes in High-Throughput Bayesian Optimisation. Henry B. Moss, Sebastian W. Ober, Victor Picheny. AISTATS 2023. Scalable Bayesian Optimization Using Vecchia Approximations of Gaussian Processes. Felix Jimenez, Matthias Katzfuss. AISTATS 2023. Active Bayesian Causal Inference. Christian Toth, Lars Lorch, Christian Knoll, Andrea