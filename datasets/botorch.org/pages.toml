full_description = '''Using BoTorch with AxWriting a custom acquisition functionVersion: v0.13.0On this pageWriting a custom acquisition functionOpen in GitHubRun in Google Colab Upper Confidence Bound (UCB)​ The Upper Confidence Bound (UCB) acquisition function balances exploration and exploitation by assigning a score of μ+β⋅σ\mu + \sqrt{\beta} \cdot \sigmaμ+β​⋅σ if the posterior distribution is normal with mean μ\muμ and variance σ2\sigma^2σ2. This "analytic" version is implemented in the UpperConfidenceBound class. The Monte Carlo version of UCB is implemented in the qUpperConfidenceBound class, which also allows for q-batches of size greater than one. (The derivation of q-UCB is given in Appendix A of Wilson et. al., 2017). A scalarized version of q-UCB​ Suppose now that we are in a multi-output setting, where, e.g., we model the effects of a design on multiple metrics. We first show a simple extension of the q-UCB acquisition function that accepts a multi-output model and performs q-UCB on a scalarized version of the multiple outputs, achieved via a vector of weights. Implementing a new acquisition function in botorch is easy; one simply needs to implement the constructor and a forward method. # Install dependencies if we are running in colabimport sysimport plotly.io as pioif 'google.colab' in sys.modules: pio.renderers.default = "colab" %pip install botorch axelse: # Ax uses Plotly to produce interactive plots. These are great for viewing and analysis, # though they also lead to large file sizes, which is not ideal for files living in GH. # Changing the default to `png` strips the interactive components to get around this. pio.renderers.default = "png" import mathfrom typing import Optionalfrom botorch.acquisition.monte_carlo import MCAcquisitionFunctionfrom botorch.models.model import Modelfrom botorch.sampling.base import MCSamplerfrom botorch.sampling.normal import SobolQMCNormalSamplerfrom botorch.utils import t_batch_mode_transformfrom torch import Tensorclass qScalarizedUpperConfidenceBound(MCAcquisitionFunction): def __init__( self, model: Model, beta: Tensor, weights: Tensor, sampler: Optional[MCSampler] = None, ) -> None: # we use the AcquisitionFunction constructor, since that of # MCAcquisitionFunction performs some validity checks that we don't want here super(MCAcquisitionFunction, self).__init__(model=model) if sampler is None: sampler = SobolQMCNormalSampler(sample_shape=torch.Size([512])) self.sampler = sampler self.register_buffer("beta", torch.as_tensor(beta)) self.register_buffer("weights", torch.as_tensor(weights)) @t_batch_mode_transform() def forward(self, X: Tensor) -> Tensor: """Evaluate scalarized qUCB on the candidate set `X`. Args: X: A `(b) x q x d`-dim Tensor of `(b)` t-batches with `q` `d`-dim design points each. Returns: Tensor: A `(b)`-dim Tensor of Upper Confidence Bound values at the given design points `X`. """ posterior = self.model.posterior(X) samples = self.get_posterior_samples(posterior) # n x b x q x o scalarized_samples = samples.matmul(self.weights) # n x b x q mean = posterior.mean # b x q x o scalarized_mean = mean.matmul(self.weights) # b x q ucb_samples = ( scalarized_mean + math.sqrt(self.beta * math.pi / 2) * (scalarized_samples - scalarized_mean).abs() ) return ucb_samples.max(dim=-1)[0].mean(dim=0) Out: I1116 181426.999 _utils_internal.py:179] NCCL_DEBUG env var is set to None Out: I1116 181427.000 _utils_internal.py:188] NCCL_DEBUG is INFO from /etc/nccl.conf Out: /data/sandcastle/boxes/fbsource/buck-out/v2/gen/fbcode/f3b9a99e517e0a13/bento/kernels/__bento_kernel_axoptics__/bento_kernel_axoptics#link-tree/mpmath/ctx_mp_python.py:892: SyntaxWarning:"is" with a literal. Did you mean "=="?/data/sandcastle/boxes/fbsource/buck-out/v2/gen/fbcode/f3b9a99e517e0a13/bento/kernels/__bento_kernel_axoptics__/bento_kernel_axoptics#link-tree/mpmath/ctx_mp_python.py:986: SyntaxWarning:"is" with a literal. Did you mean "=="? Out: /data/sandcastle/boxes/fbsource/buck-out/v2/gen/fbcode/f3b9a99e517e0a13/bento/kernels/__bento_kernel_axoptics__/bento_kernel_axoptics#link-tree/sympy/solvers/diophantine.py:3188: SyntaxWarning:"is" with a literal. Did you mean "=="? Out: /data/sandcastle/boxes/fbsource/buck-out/v2/gen/fbcode/f3b9a99e517e0a13/bento/kernels/__bento_kernel_axoptics__/bento_kernel_axoptics#link-tree/sympy/plotting/plot.py:520: SyntaxWarning:"is" with a literal. Did you mean "=="?/data/sandcastle/boxes/fbsource/buck-out/v2/gen/fbcode/f3b9a99e517e0a13/bento/kernels/__bento_kernel_axoptics__/bento_kernel_axoptics#link-tree/sympy/plotting/plot.py:540: SyntaxWarning:"is" with a literal. Did you mean "=="?/data/sandcastle/boxes/fbsource/buck-out/v2/gen/fbcode/f3b9a99e517e0a13/bento/kernels/__bento_kernel_axoptics__/bento_kernel_axoptics#link-tree/sympy/plotting/plot.py:553: SyntaxWarning:"is" with a literal. Did you mean "=="?/data/sandcastle/boxes/fbsource/buck-out/v2/gen/fbcode/f3b9a99e517e0a13/bento/kernels/__bento_kernel_axoptics__/bento_kernel_axoptics#link-tree/sympy/plotting/plot.py:560: SyntaxWarning:"is" with a literal. Did you mean "=="? Note that qScalarizedUpperConfidenceBound is very similar to qUpperConfidenceBound and only requires a few lines of new code to accomodate scalarization of multiple outputs. The @t_batch_mode_transform decorator ensures that the input X has an explicit t-batch dimension (code comments are added with shapes for clarity). See the end of this tutorial for a quick and easy way of achieving the same scalarization effect using ScalarizedPosteriorTransform. Ad-hoc testing q-Scalarized-UCB​ Before hooking the newly defined acquisition function into a Bayesian Optimization loop, we should test it. For this we'll just make sure that it properly evaluates on a compatible multi-output model. Here we just define a basic multi-output SingleTaskGP model trained on synthetic data. import torchfrom botorch.fit import fit_gpytorch_mllfrom botorch.models import SingleTaskGPfrom botorch.utils import standardizefrom gpytorch.mlls import ExactMarginalLogLikelihood# generate synthetic dataX = torch.rand(20, 2)Y = torch.stack([torch.sin(X[:, 0]), torch.cos(X[:, 1])], -1)Y = standardize(Y) # standardize to zero mean unit variance# construct and fit the multi-output modelgp = SingleTaskGP(X, Y)mll = ExactMarginalLogLikelihood(gp.likelihood, gp)fit_gpytorch_mll(mll)# construct the acquisition functionqSUCB = qScalarizedUpperConfidenceBound(gp, beta=0.1, weights=torch.tensor([0.1, 0.5])) # evaluate on single q-batch with q=3qSUCB(torch.rand(3, 2)) Out: tensor([0.4412], grad_fn=<MeanBackward1>) # batch-evaluate on two q-batches with q=3qSUCB(torch.rand(2, 3, 2)) Out: tensor([0.5129, 0.5216], grad_fn=<MeanBackward1>) A scalarized version of analytic UCB (q=1 only)​ We can also write an analytic version of UCB for a multi-output model, assuming a multivariate normal posterior and q=1. The new class ScalarizedUpperConfidenceBound subclasses AnalyticAcquisitionFunction instead of MCAcquisitionFunction. In contrast to the MC version, instead of using the weights on the MC samples, we directly scalarize the mean vector μ\muμ and covariance matrix Σ\SigmaΣ and apply standard UCB on the univariate normal distribution, which has mean wTμw^T \muwTμ and variance wTΣww^T \Sigma wwTΣw. In addition to the @t_batch_transform decorator, here we are also using expected_q=1 to ensure the input X has a q=1. Note: BoTorch also provides a ScalarizedPosteriorTransform abstraction that can be used with any existing analytic acqusition functions and automatically performs the scalarization we implement manually below. See the end of this tutorial for a usage example. from botorch.acquisition import AnalyticAcquisitionFunctionclass ScalarizedUpperConfidenceBound(AnalyticAcquisitionFunction): def __init__( self, model: Model, beta: Tensor, weights: Tensor, maximize: bool = True, ) -> None: # we use the AcquisitionFunction constructor, since that of # AnalyticAcquisitionFunction performs some validity checks that we don't want here super(AnalyticAcquisitionFunction, self).__init__(model) self.maximize = maximize self.register_buffer("beta", torch.as_tensor(beta)) self.register_buffer("weights", torch.as_tensor(weights)) @t_batch_mode_transform(expected_q=1) def forward(self, X: Tensor) -> Tensor: """Evaluate the Upper Confidence Bound on the candidate set X using scalarization Args: X: A `(b) x d`-dim Tensor of `(b)` t-batches of `d`-dim design points each. Returns: A `(b)`-dim Tensor of Upper Confidence Bound values at the given design points `X`. """ self.beta = self.beta.to(X) batch_shape = X.shape[:-2] posterior = self.model.posterior(X) means = posterior.mean.squeeze(dim=-2) # b x o scalarized_mean = means.matmul(self.weights) # b covs = posterior.mvn.covariance_matrix # b x o x o weights = self.weights.view( 1, -1, 1 ) # 1 x o x 1 (assume single batch dimension) weights = weights.expand(batch_shape + weights.shape[1:]) # b x o x 1 weights_transpose = weights.permute(0, 2, 1) # b x 1 x o scalarized_variance = torch.bmm( weights_transpose, torch.bmm(covs, weights) ).view( batch_shape ) # b delta = (self.beta.expand_as(scalarized_mean) * scalarized_variance).sqrt() if self.maximize: return scalarized_mean + delta else: return scalarized_mean - delta Ad-hoc testing Scalarized-UCB​ Notice that we pass in an explicit q-batch dimension for consistency, even though q=1. # construct the acquisition functionSUCB = ScalarizedUpperConfidenceBound(gp, beta=0.1, weights=torch.tensor([0.1, 0.5])) # evaluate on single pointSUCB(torch.rand(1, 2)) Out: tensor([0.5031], grad_fn=<AddBackward0>) # batch-evaluate on 3 pointsSUCB(torch.rand(3, 1, 2)) Out: tensor([-0.6162, -0.8318, -0.1927], grad_fn=<AddBackward0>) Using the custom acquisition function with Ax's Service API​ Registering the new acquisition function​ In order to use an acquisition function, Ax needs to know how to generate inputs to construct the acquisition function. from typing import Listfrom typing import Any, Dictfrom botorch.acquisition.input_constructors import acqf_input_constructor@acqf_input_constructor(ScalarizedUpperConfidenceBound)def construct_inputs_scalarized_ucb( model: Model, beta: float, weights: List[float], posterior_transform: None,) -> Dict[str, Any]: return { "model": model, "beta": torch.as_tensor(beta, dtype=torch.double), "weights": torch.as_tensor(weights, dtype=torch.double), } Setting up a GenerationStrategy using BOTORCH_MODULAR with our custom acquistion function.​ BOTORCH_MODULAR is a convenient wrapper implemented in Ax that facilitates the use of custom BoTorch models and acquisition functions in Ax experiments. In order to customize the way the candidates are generated, we need to construct a new GenerationStrategy and pass it into the AxClient. from ax.modelbridge.generation_strategy import GenerationStep, GenerationStrategyfrom ax.modelbridge.registry import Modelsgs = GenerationStrategy( steps=[ # Quasi-random initialization step GenerationStep( model=Models.SOBOL, num_trials=5, # How many trials should be produced from this generation step model_kwargs={"seed": 999}, # Any kwargs you want passed into the model ), # Bayesian optimization step using the custom acquisition function GenerationStep( model=Models.BOTORCH_MODULAR, num_trials=-1, # No limitation on how many trials should be produced from this step # For `BOTORCH_MODULAR`, we pass in kwargs to specify what surrogate or acquisition function to use. # `acquisition_options` specifies the set of additional arguments to pass into the input constructor. model_kwargs={ "botorch_acqf_class": ScalarizedUpperConfidenceBound, "acquisition_options": {"beta": 0.1, "weights": [1.0, 1.0]}, }, ), ]) Setting up the experiment​ We will set up a simple experiment to optimize a simple scalarization of the BraninCurrin function (per the weights above). A detailed tutorial on Service API can be found here. In order to use the GenerationStrategy we just created, we will pass it into the AxClient. from ax.service.ax_client import AxClientfrom ax.service.utils.instantiation import ObjectivePropertiesfrom botorch.test_functions import BraninCurrin# Initialize the client - AxClient offers a convenient API to control the experimentax_client = AxClient(generation_strategy=gs)# Setup the experimentax_client.create_experiment( name="branincurrin_test_experiment", parameters=[ { "name": f"x{i+1}", "type": "range", # It is crucial to use floats for the bounds, i.e., 0.0 rather than 0. # Otherwise, the parameter would "bounds": [0.0, 1.0], } for i in range(2) ], objectives={ "branin": ObjectiveProperties(minimize=True), "currin": ObjectiveProperties(minimize=True), },)# Setup a function to evaluate the trialsbranincurrin = BraninCurrin()def evaluate(parameters): x = torch.tensor([[parameters.get(f"x{i+1}") for i in range(2)]]) bc_eval = branincurrin(x).squeeze().tolist() # In our case, standard error is 0, since we are computing a synthetic function. return {"branin": (bc_eval[0], 0.0), "currin": (bc_eval[1], 0.0)} Out: [INFO 11-16 18:14:43] ax.service.ax_client: Starting optimization with verbose logging. To disable logging, set the verbose_logging argument to False. Note that float values in the logs are rounded to 6 decimal points. Out: [INFO 11-16 18:14:43] ax.service.utils.instantiation: Due to non-specification, we will use the heuristic for selecting objective thresholds. Out: [INFO 11-16 18:14:43] ax.service.utils.instantiation: Inferred value type of ParameterType.FLOAT for parameter x1. If that is not the expected value type, you can explicity specify 'value_type' ('int', 'float', 'bool' or 'str') in parameter dict. Out: [INFO 11-16 18:14:43] ax.service.utils.instantiation: Inferred value type of ParameterType.FLOAT for parameter x2. If that is not the expected value type, you can explicity specify 'value_type' ('int', 'float', 'bool' or 'str') in parameter dict. Out: [INFO 11-16 18:14:43] ax.service.utils.instantiation: Created search space: SearchSpace(parameters=[RangeParameter(name='x1', parameter_type=FLOAT, range=[0.0, 1.0]), RangeParameter(name='x2', parameter_type=FLOAT, range=[0.0, 1.0])], parameter_constraints=[]). Running the BO loop​ Ax makes this part super simple! for i in range(10): parameters, trial_index = ax_client.get_next_trial() # Local evaluation here can be replaced with deployment to external system. ax_client.complete_trial(trial_index=trial_index, raw_data=evaluate(parameters)) Out: [INFO 11-16 18:14:43] ax.service.ax_client: Generated new trial 0 with parameters {'x1': 0.62873, 'x2': 0.51481}. Out: [INFO 11-16 18:14:43] ax.service.ax_client: Completed trial 0 with data: {'branin': (46.244598, 0.0), 'currin': (6.842319, 0.0)}. Out: [INFO 11-16 18:14:43] ax.service.ax_client: Generated new trial 1 with parameters {'x1': 0.434883, 'x2': 0.396266}. Out: [INFO 11-16 18:14:43] ax.service.ax_client: Completed trial 1 with data: {'branin': (14.735401, 0.0), 'currin': (8.740173, 0.0)}. Out: [INFO 11-16 18:14:43] ax.service.ax_client: Generated new trial 2 with pa'''
