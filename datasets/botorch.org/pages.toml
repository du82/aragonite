nal Bayesian Optimization via Nested Riemannian Manifolds. Noémie Jaquier, Leonel Rozo. NeurIPS 2020. High-Dimensional Contextual Policy Search with Unknown Context Rewards using Bayesian Optimization. Qing Feng, Benjamin Letham, Hongzi Mao, Eytan Bakshy. NeurIPS 2020. Re-Examining Linear Embeddings for High-Dimensional Bayesian Optimization. Ben Letham, Roberto Calandra, Akshara Rai, Eytan Bakshy. NeurIPS 2020. PareCO: Pareto-aware Channel Optimization for Slimmable Neural Networks . Ting-Wu Chin, Ari S. Morcos, Diana Marculescu. ICML 2020 Workshop on Real World Experiment Design and Active Learning. Please feel free to add any other peer reviewed works that build off of botorch via a PR!Edit this pageLast updated on Feb 3, 2025 by github-actions[bot]"
