["https://botorch.org/docs/next/optimization"]
title = "Optimization | BoTorch"
description = "Model Fitting"
full_description = '''Basic ConceptsOptimizationVersion: NextOn this pageOptimizationModel Fitting​ BoTorch provides the convenience method fit_gpytorch_mll() for fitting GPyTorch models (optimizing model hyperparameters) using L-BFGS-B via scipy.optimize.minimize(). We recommend using this method for exact GPs, but other optimizers may be necessary for models with thousands of parameters or observations. Optimizing Acquisition Functions​ Using scipy Optimizers on Tensors​ The default method used by BoTorch to optimize acquisition functions is gen_candidates_scipy(). Given a set of starting points (for multiple restarts) and an acquisition function, this optimizer makes use of scipy.optimize.minimize() for optimization, via either the L-BFGS-B or SLSQP routines. gen_candidates_scipy() automatically handles conversion between torch and numpy types, and utilizes PyTorch's autograd capabilities to compute the gradient of the acquisition function. Using torch Optimizers​ A torch optimizer such as torch.optim.Adam or torch.optim.SGD can also be used directly, without the need to perform numpy conversion. These first-order gradient-based optimizers are particularly useful for the case when the acquisition function is stochastic, where algorithms like L-BFGS or SLSQP that are designed for deterministic functions should not be applied. The function gen_candidates_torch() provides an interface for torch optimizers and handles bounding. See the example notebooks here and here for tutorials on how to use different optimizers. Multiple Random Restarts​ Acquisition functions are often difficult to optimize as they are generally non-convex and can exhibit numerically vanishing gradients, a problem that is particularly prominent in naive formulations of Expected Improvement (EI). LogEI and its siblings (qLogNEI and qLogNEHVI, ...) ameliorate the flatness issue and generally lead to signficiantly higher optimization performance 1. Since convexity cannot be guaranteed in general, BoTorch makes use of multiple random restarts to improve optimization quality. Each restart gives rise to a separate optimization within a particular local region; thus, the best result over many restarts can provide an approximation to the global optimization objective. The function gen_batch_initial_conditions(), which is used by default, implements heuristics for choosing a set of initial restart locations (candidates). Rather than optimize sequentially from each initial restart candidate, gen_candidates_scipy() takes advantage of batch mode evaluation (t-batches) of the acquisition function to solve a single b×q×db \times q \times db×q×d-dimensional optimization problem, where the objective is defined as the sum of the bbb individual q-batch acquisition values. The wrapper function optimize_acqf() uses get_best_candidates() to process the output of gen_candidates_scipy() and return the best point found over the random restarts. For reasonable values of bbb and qqq, jointly optimizing over random restarts can significantly reduce wall time by exploiting parallelism, while maintaining high quality solutions. Joint vs. Sequential Candidate Generation for Batch Acquisition Functions​ In batch Bayesian Optimization qqq design points are selected for parallel experimentation. The parallel (qEI, qNEI, qUCB, qPI) variants of acquisition functions call for joint optimization over the qqq design points (i.e., solve an optimization problem with a q×dq \times dq×d-dimensional decision), but when qqq is large, one might also consider sequentially selecting the qqq points using successive conditioning on so-called "fantasies", and solving qqq optimization problems, each with a ddd-dimensional decision. The functions optimize_acqf() by default performs joint optimization; when specifying sequential=True it will perform sequential optimization. Our empirical observations of the closed-loop Bayesian Optimization performance for q=5q = 5q=5 show that joint optimization and sequential optimization have similar optimization performance on some standard benchmarks, but sequential optimization comes at a steep cost in wall time (2-6x in our tests). Therefore, for moderately sized qqq, a reasonable default option is to use joint optimization. However, it is important to note that as qqq increases, the performance of joint optimization can be hindered by the harder q×dq \times dq×d-dimensional problem, and sequential optimization might be preferred. See 2 for further discussion on how sequential greedy maximization is an effective strategy for common classes of acquisition functions, and 1 for joint-vs-sequential optimization ablations using the LogEI family of acquisition functions. Footnotes​ S. Ament, S. Daulton, D. Eriksson, M. Balandat, E. Bakshy. Unexpected Improvements to Expected Improvement for Bayesian Optimization. NeurIPS, 2023. ↩ ↩2 J. Wilson, F. Hutter, M. Deisenroth. Maximizing Acquisition Functions for Bayesian Optimization. NeurIPS, 2018. ↩ Edit this pageLast updated on Feb 3, 2025 by Cristian Lara'''
