["https://botorch.org/docs/acquisition"]
title = "Acquisition Functions | BoTorch"
description = "Acquisition functions are heuristics employed to evaluate the usefulness of one"
full_description = '''Basic ConceptsAcquisition FunctionsVersion: v0.13.0On this pageAcquisition FunctionsAcquisition functions are heuristics employed to evaluate the usefulness of one of more design points for achieving the objective of maximizing the underlying black box function. BoTorch supports both analytic as well as (quasi-) Monte-Carlo based acquisition functions. It provides a generic AcquisitionFunction API that abstracts away from the particular type, so that optimization can be performed on the same objects. Monte Carlo Acquisition Functions​ Many common acquisition functions can be expressed as the expectation of some real-valued function of the model output(s) at the design point(s): α(X)=E[a(ξ)∣ξ∼P(f(X)∣D)]\alpha(X) = \mathbb{E}\bigl[ a(\xi) \mid \xi \sim \mathbb{P}(f(X) \mid \mathcal{D}) \bigr]α(X)=E[a(ξ)∣ξ∼P(f(X)∣D)] where X=(x1,…,xq)X = (x_1, \dotsc, x_q)X=(x1​,…,xq​), and P(f(X)∣D)\mathbb{P}(f(X) \mid \mathcal{D})P(f(X)∣D) is the posterior distribution of the function fff at XXX given the data D\mathcal{D}D observed so far. Evaluating the acquisition function thus requires evaluating an integral over the posterior distribution. In most cases, this is analytically intractable. In particular, analytic expressions generally do not exist for batch acquisition functions that consider multiple design points jointly (i.e. q>1q > 1q>1). An alternative is to use Monte-Carlo (MC) sampling to approximate the integrals. An MC approximation of α\alphaα at XXX using NNN MC samples is α(X)≈1N∑i=1Na(ξi)\alpha(X) \approx \frac{1}{N} \sum_{i=1}^N a(\xi_{i})α(X)≈N1​i=1∑N​a(ξi​) where ξi∼P(f(X)∣D)\xi_i \sim \mathbb{P}(f(X) \mid \mathcal{D})ξi​∼P(f(X)∣D). For instance, for q-Expected Improvement (qEI), we have: qEI(X)≈1N∑i=1Nmax⁡j=1,...,q{max⁡(ξij−f∗,0)},ξi∼P(f(X)∣D)\text{qEI}(X) \approx \frac{1}{N} \sum_{i=1}^N \max_{j=1,..., q} \bigl\{ \max(\xi_{ij} - f^*, 0) \bigr\}, \qquad \xi_{i} \sim \mathbb{P}(f(X) \mid \mathcal{D})qEI(X)≈N1​i=1∑N​j=1,...,qmax​{max(ξij​−f∗,0)},ξi​∼P(f(X)∣D) where f∗f^*f∗ is the best function value observed so far (assuming noiseless observations). Using the reparameterization trick (1, 2), qEI(X)≈1N∑i=1Nmax⁡j=1,...,q{max⁡(μ(X)_j+(L(X)ϵi)_j−f∗,0)},ϵi∼N(0,I)\text{qEI}(X) \approx \frac{1}{N} \sum_{i=1}^N \max_{j=1,..., q} \bigl\{ \max\bigl( \mu(X)\_j + (L(X) \epsilon_i)\_j - f^*, 0 \bigr) \bigr\}, \qquad \epsilon_{i} \sim \mathcal{N}(0, I)qEI(X)≈N1​i=1∑N​j=1,...,qmax​{max(μ(X)_j+(L(X)ϵi​)_j−f∗,0)},ϵi​∼N(0,I) where μ(X)\mu(X)μ(X) is the posterior mean of fff at XXX, and L(X)L(X)T=Σ(X)L(X)L(X)^T = \Sigma(X)L(X)L(X)T=Σ(X) is a root decomposition of the posterior covariance matrix. All MC-based acquisition functions in BoTorch are derived from MCAcquisitionFunction. Acquisition functions expect input tensors XXX of shape batch_shape×q×d\textit{batch\_shape} \times q \times dbatch_shape×q×d, where ddd is the dimension of the feature space, qqq is the number of points considered jointly, and batch_shape\textit{batch\_shape}batch_shape is the batch-shape of the input tensor. The output α(X)\alpha(X)α(X) will have shape batch_shape\textit{batch\_shape}batch_shape, with each element corresponding to the respective q×dq \times dq×d batch tensor in the input XXX. Note that for analytic acquisition functions, it must be that q=1q=1q=1. MC, q-MC, and Fixed Base Samples​ BoTorch relies on the re-parameterization trick and (quasi)-Monte-Carlo sampling for optimization and estimation of the batch acquisition functions 3. The results below show the reduced variance when estimating an expected improvement (EI) acquisition function using base samples obtained via quasi-MC sampling versus standard MC sampling. In the plots above, the base samples used to estimate each point are resampled. As discussed in the Overview, a single set of base samples can be used for optimization when the re-parameterization trick is employed. What are the trade-offs between using a fixed set of base samples versus re-sampling on every MC evaluation of the acquisition function? Below, we show that fixing base samples produces functions that are potentially much easier to optimize, without resorting to stochastic optimization methods. If the base samples are fixed, the problem of optimizing the acquisition function is deterministic, allowing for conventional quasi-second order methods such as L-BFGS or sequential least-squares programming (SLSQP) to be used. These have faster convergence rates than first-order methods and can speed up acquisition function optimization significantly. One concern is that the approximated acquisition function is biased for any fixed set of base samples, which may adversely affect the solution. However, we find that in practice, both the optimal value and the optimal solution of these biased problems for standard acquisition functions converge quite rapidly to their true counterparts as more samples are used. Note that for evaluation of the acquisition function we integrate over a qoqoqo-dimensional space (where qqq is the number of points in the q-batch and ooo is the number of outputs included in the objective). Therefore, the MC integration problem can be quite low-dimensional even for models on high-dimensional feature spaces (large ddd). Because using additional samples is relatively cheap computationally, we default to 500 base samples in the MC acquisition functions. On the other hand, when re-sampling is used in conjunction with a stochastic optimization algorithm, the kind of bias noted above is no longer a concern. The trade-off here is that the optimization may be less effective, as discussed above. Analytic Acquisition Functions​ BoTorch also provides implementations of analytic acquisition functions that do not depend on MC sampling. These acquisition functions are subclasses of AnalyticAcquisitionFunction and only exist for the case of a single candidate point (q=1q = 1q=1). These include classical acquisition functions such as Expected Improvement (EI), Upper Confidence Bound (UCB), and Probability of Improvement (PI). An example comparing ExpectedImprovement, the analytic version of EI, to it's MC counterpart qExpectedImprovement can be found in this tutorial. Analytic acquisition functions allow for an explicit expression in terms of the summary statistics of the posterior distribution at the evaluated point(s). A popular acquisition function is Expected Improvement of a single point for a Gaussian posterior, given by EI(x)=E[max⁡(y−f∗,0)∣y∼N(μ(x),σ2(x))]\text{EI}(x) = \mathbb{E}\bigl[ \max(y - f^*, 0) \mid y\sim \mathcal{N}(\mu(x), \sigma^2(x)) \bigr]EI(x)=E[max(y−f∗,0)∣y∼N(μ(x),σ2(x))] where μ(x)\mu(x)μ(x) and σ(x)\sigma(x)σ(x) are the posterior mean and variance of fff at the point xxx, and f∗f^*f∗ is again the best function value observed so far (assuming noiseless observations). It can be shown that EI(x)=σ(x)(zΦ(z)+φ(z))\text{EI}(x) = \sigma(x) \bigl( z \Phi(z) + \varphi(z) \bigr)EI(x)=σ(x)(zΦ(z)+φ(z)) where z=μ(x)−fmax⁡σ(x)z = \frac{\mu(x) - f_{\max}}{\sigma(x)}z=σ(x)μ(x)−fmax​​ and Φ\PhiΦ and φ\varphiφ are the cdf and pdf of the standard normal distribution, respectively. With some additional work, it is also possible to express the gradient of the Expected Improvement with respect to the design xxx. Classic Bayesian Optimization software will implement this gradient function explicitly, so that it can be used for numerically optimizing the acquisition function. BoTorch, in contrast, harnesses PyTorch's automatic differentiation feature ("autograd") in order to obtain gradients of acquisition functions. This makes implementing new acquisition functions much less cumbersome, as it does not require to analytically derive gradients. All that is required is that the operations performed in the acquisition function computation allow for the back-propagation of gradient information through the posterior and the model. Footnotes​ D. P. Kingma, M. Welling. Auto-Encoding Variational Bayes. ICLR, 2013. ↩ D. J. Rezende, S. Mohamed, D. Wierstra. Stochastic Backpropagation and Approximate Inference in Deep Generative Models. ICML, 2014. ↩ J. T. Wilson, R. Moriconi, F. Hutter, M. P. Deisenroth. The Reparameterization Trick for Acquisition Functions. NeurIPS Workshop on Bayesian Optimization, 2017. ↩ Edit this pageLast updated on Feb 3, 2025 by github-actions[bot]'''
