title = "Using a custom BoTorch model | BoTorch"
description = "<LinkButtons"
full_description = '''Using BoTorch with AxUsing a custom BoTorch modelVersion: NextOn this pageUsing a custom BoTorch modelOpen in GitHubRun in Google Colab Using a custom BoTorch model with Ax​ In this tutorial, we illustrate how to use a custom BoTorch model within Ax's botorch_modular API. This allows us to harness the convenience of Ax for running Bayesian Optimization loops while maintaining full flexibility in modeling. Acquisition functions and their optimizers can be swapped out in much the same fashion. See for example the tutorial for Implementing a custom acquisition function. If you want to do something non-standard, or would like to have full insight into every aspect of the implementation, please see this tutorial for how to write your own full optimization loop in BoTorch. # Install dependencies if we are running in colabimport sysimport plotly.io as pioif 'google.colab' in sys.modules: pio.renderers.default = "colab" %pip install botorch axelse: # Ax uses Plotly to produce interactive plots. These are great for viewing and analysis, # though they also lead to large file sizes, which is not ideal for files living in GH. # Changing the default to `png` strips the interactive components to get around this. pio.renderers.default = "png" import osfrom contextlib import contextmanager, nullcontextfrom ax.utils.testing.mock import mock_botorch_optimize_context_managerSMOKE_TEST = os.environ.get("SMOKE_TEST")NUM_EVALS = 10 if SMOKE_TEST else 30 Implementing the custom model​ For this tutorial, we implement a very simple GPyTorch ExactGP model that uses an RBF kernel (with ARD) and infers a homoskedastic noise level. Model definition is straightforward. Here we implement a GPyTorch ExactGP that inherits from GPyTorchModel; together these two superclasses add all the API calls that BoTorch expects in its various modules. Note: BoTorch allows implementing any custom model that follows the Model API. For more information, please see the Model Documentation. from typing import Optionalfrom botorch.models.gpytorch import GPyTorchModelfrom gpytorch.distributions import MultivariateNormalfrom gpytorch.kernels import RBFKernel, ScaleKernelfrom gpytorch.likelihoods import GaussianLikelihoodfrom gpytorch.means import ConstantMeanfrom gpytorch.models import ExactGPfrom torch import Tensorclass SimpleCustomGP(ExactGP, GPyTorchModel): _num_outputs = 1 # to inform GPyTorchModel API def __init__(self, train_X, train_Y, train_Yvar: Optional[Tensor] = None): # NOTE: This ignores train_Yvar and uses inferred noise instead. # squeeze output dim before passing train_Y to ExactGP super().__init__(train_X, train_Y.squeeze(-1), GaussianLikelihood()) self.mean_module = ConstantMean() self.covar_module = ScaleKernel( base_kernel=RBFKernel(ard_num_dims=train_X.shape[-1]), ) self.to(train_X) # make sure we're on the right device/dtype def forward(self, x): mean_x = self.mean_module(x) covar_x = self.covar_module(x) return MultivariateNormal(mean_x, covar_x) Instantiate a BoTorchGenerator in Ax​ A BoTorchGenerator in Ax encapsulates both the surrogate -- which Ax calls a Surrogate and BoTorch calls a Model -- and an acquisition function. Here, we will only specify the custom surrogate and let Ax choose the default acquisition function. Note that the Model (e.g., the SimpleCustomGP) must implement construct_inputs, as this is used to construct the inputs required for instantiating a Model instance from the experiment data. from ax.models.torch.botorch_modular.model import BoTorchGeneratorfrom ax.models.torch.botorch_modular.surrogate import Surrogate, SurrogateSpecfrom ax.models.torch.botorch_modular.utils import ModelConfigax_model = BoTorchGenerator( surrogate=Surrogate( surrogate_spec=SurrogateSpec( model_configs=[ ModelConfig( # The model class to use botorch_model_class=SimpleCustomGP, # Optional, MLL class with which to optimize model parameters # mll_class=ExactMarginalLogLikelihood, # Optional, dictionary of keyword arguments to model constructor # model_options={} # Passing in `None` to disable the default set of input transforms # constructed in Ax, since the model doesn't support transforms. input_transform_classes=None, ) ] ) ), # Optional, acquisition function class to use - see custom acquisition tutorial # botorch_acqf_class=qExpectedImprovement,) Combine with a ModelBridge​ Models in Ax require a ModelBridge to interface with Experiments. A ModelBridge takes the inputs supplied by the Experiment and converts them to the inputs expected by the Model. For a BoTorchGenerator, we use TorchModelBridge. The Modular BoTorch interface creates the BoTorchGenerator and the TorchModelBridge in a single step, as follows: from ax.modelbridge.registry import Generatorsmodel_bridge = Generators.BOTORCH_MODULAR( experiment=experiment, data=data, surrogate=Surrogate(SimpleCustomGP), # Optional, will use default if unspecified # botorch_acqf_class=qLogNoisyExpectedImprovement, )# To generate a trialtrial = model_bridge.gen(1) Using the custom model in Ax to optimize the Branin function We will demonstrate this with both the Service API (simpler, easier to use) and the Developer API (advanced, more customizable). Optimization with Ax's Service API​ A detailed tutorial on the Service API can be found here. In order to customize the way the candidates are created in the Service API, we need to construct a new GenerationStrategy and pass it into AxClient. from ax.modelbridge.generation_strategy import GenerationStep, GenerationStrategyfrom ax.modelbridge.registry import Generatorsgs = GenerationStrategy( steps=[ # Quasi-random initialization step GenerationStep( model=Generators.SOBOL, num_trials=5, # How many trials should be produced from this generation step ), # Bayesian optimization step using the custom acquisition function GenerationStep( model=Generators.BOTORCH_MODULAR, num_trials=-1, # No limitation on how many trials should be produced from this step # For `BOTORCH_MODULAR`, we pass in kwargs to specify what surrogate or acquisition function to use. model_kwargs={ "surrogate_spec": SurrogateSpec( model_configs=[ModelConfig(botorch_model_class=SimpleCustomGP, input_transform_classes=None)] ), }, ), ]) Setting up the experiment​ In order to use the GenerationStrategy we just created, we will pass it into the AxClient. import torchfrom ax.service.ax_client import AxClientfrom ax.service.utils.instantiation import ObjectivePropertiesfrom botorch.test_functions import Branin# Initialize the client - AxClient offers a convenient API to control the experimentax_client = AxClient(generation_strategy=gs)# Setup the experimentax_client.create_experiment( name="branin_test_experiment", parameters=[ { "name": "x1", "type": "range", # It is crucial to use floats for the bounds, i.e., 0.0 rather than 0. # Otherwise, the parameter would be inferred as an integer range. "bounds": [-5.0, 10.0], }, { "name": "x2", "type": "range", "bounds": [0.0, 15.0], }, ], objectives={ "branin": ObjectiveProperties(minimize=True), },)# Setup a function to evaluate the trialsbranin = Branin()def evaluate(parameters): x = torch.tensor([[parameters.get(f"x{i+1}") for i in range(2)]]) # The GaussianLikelihood used by our model infers an observation noise level, # so we pass an sem value of NaN to indicate that observation noise is unknown return {"branin": (branin(x).item(), float("nan"))} Out: [INFO 12-02 15:16:19] ax.service.ax_client: Starting optimization with verbose logging. To disable logging, set the verbose_logging argument to False. Note that float values in the logs are rounded to 6 decimal points.[INFO 12-02 15:16:19] ax.service.utils.instantiation: Inferred value type of ParameterType.FLOAT for parameter x1. If that is not the expected value type, you can explicitly specify 'value_type' ('int', 'float', 'bool' or 'str') in parameter dict.[INFO 12-02 15:16:19] ax.service.utils.instantiation: Inferred value type of ParameterType.FLOAT for parameter x2. If that is not the expected value type, you can explicitly specify 'value_type' ('int', 'float', 'bool' or 'str') in parameter dict.[INFO 12-02 15:16:19] ax.service.utils.instantiation: Created search space: SearchSpace(parameters=[RangeParameter(name='x1', parameter_type=FLOAT, range=[-5.0, 10.0]), RangeParameter(name='x2', parameter_type=FLOAT, range=[0.0, 15.0])], parameter_constraints=[]). Running the BO loop​ The next cell sets up a decorator solely to speed up the testing of the notebook in SMOKE_TEST mode. You can safely ignore this cell and the use of the decorator throughout the tutorial. if SMOKE_TEST: fast_smoke_test = mock_botorch_optimize_context_managerelse: fast_smoke_test = nullcontext# Set a seed for reproducible tutorial outputtorch.manual_seed(0) Out: <torch._C.Generator at 0x12db71a50> with fast_smoke_test(): for i in range(NUM_EVALS): parameters, trial_index = ax_client.get_next_trial() # Local evaluation here can be replaced with deployment to external system. ax_client.complete_trial(trial_index=trial_index, raw_data=evaluate(parameters)) Out: /opt/anaconda3/envs/botorch/lib/python3.10/site-packages/ax/modelbridge/cross_validation.py:439: UserWarning:Encountered exception in computing model fit quality: RandomModelBridge does not support prediction.[INFO 12-02 15:16:19] ax.service.ax_client: Generated new trial 0 with parameters {'x1': 0.62583, 'x2': 14.359564} using model Sobol.[INFO 12-02 15:16:19] ax.service.ax_client: Completed trial 0 with data: {'branin': (104.365417, nan)}./opt/anaconda3/envs/botorch/lib/python3.10/site-packages/ax/modelbridge/cross_validation.py:439: UserWarning:Encountered exception in computing model fit quality: RandomModelBridge does not support prediction.[INFO 12-02 15:16:19] ax.service.ax_client: Generated new trial 1 with parameters {'x1': 3.166217, 'x2': 3.867106} using model Sobol.[INFO 12-02 15:16:19] ax.service.ax_client: Completed trial 1 with data: {'branin': (2.996862, nan)}./opt/anaconda3/envs/botorch/lib/python3.10/site-packages/ax/model