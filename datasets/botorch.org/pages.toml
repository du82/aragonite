full_description = '''Multi-Objective Bayesian OptimizationMulti-objective optimization with qEHVI, qNEHVI, and qNParEGOVersion: v0.13.0On this pageMulti-objective optimization with qEHVI, qNEHVI, and qNParEGOOpen in GitHubRun in Google Colab Noisy, Parallel, Multi-Objective BO in BoTorch with qEHVI, qNEHVI, and qNParEGO​ In this tutorial, we illustrate how to implement a simple multi-objective (MO) Bayesian Optimization (BO) closed loop in BoTorch. In general, we recommend using Ax for a simple BO setup like this one, since this will simplify your setup (including the amount of code you need to write) considerably. See here for an Ax tutorial on MOBO. If desired, you can use a custom BoTorch model in Ax, following the Using BoTorch with Ax tutorial. Given a MultiObjective, Ax will default to the qqqNEHVI acquisiton function. If desired, this can also be customized by adding "botorch_acqf_class": <desired_botorch_acquisition_function_class>, to the model_kwargs. We use the parallel ParEGO (qqqParEGO) [1], parallel Expected Hypervolume Improvement (qqqEHVI) [1], and parallel Noisy Expected Hypervolume Improvement (qqqNEHVI) [2] acquisition functions to optimize a synthetic BraninCurrin problem test function with additive Gaussian observation noise over a 2-parameter search space [0,1]^2. See botorch/test_functions/multi_objective.py for details on BraninCurrin. The noise standard deviations are 15.19 and 0.63 for each objective, respectively. Since botorch assumes a maximization of all objectives, we seek to find the Pareto frontier, the set of optimal trade-offs where improving one metric means deteriorating another. [1] S. Daulton, M. Balandat, and E. Bakshy. Differentiable Expected Hypervolume Improvement for Parallel Multi-Objective Bayesian Optimization. Advances in Neural Information Processing Systems 33, 2020. [2] S. Daulton, M. Balandat, and E. Bakshy. Parallel Bayesian Optimization of Multiple Noisy Objectives with Expected Hypervolume Improvement. Advances in Neural Information Processing Systems 34, 2021. For batch optimization (or in noisy settings), we strongly recommend using qqqNEHVI rather than qqqEHVI because it is far more efficient than qqqEHVI and mathematically equivalent in the noiseless setting. Set dtype and device​ Note: qqqEHVI and qqqNEHVI aggressively exploit parallel hardware and are both much faster when run on a GPU. See [1, 2] for details. # Install dependencies if we are running in colabimport sysif 'google.colab' in sys.modules: %pip install botorch import osimport torchtkwargs = { "dtype": torch.double, "device": torch.device("cuda" if torch.cuda.is_available() else "cpu"),}SMOKE_TEST = os.environ.get("SMOKE_TEST") Problem setup​ from botorch.test_functions.multi_objective import BraninCurrinproblem = BraninCurrin(negate=True).to(**tkwargs) Model initialization​ We use a list of SingleTaskGPs to model the two objectives with known noise variances. If no noise variances were provided, SingleTaskGP would infer (homoskedastic) noise levels instead. The models are initialized with 2(d+1)=62(d+1)=62(d+1)=6 points drawn randomly from [0,1]2[0,1]^2[0,1]2. from botorch.models.gp_regression import SingleTaskGPfrom botorch.models.model_list_gp_regression import ModelListGPfrom botorch.models.transforms.outcome import Standardizefrom gpytorch.mlls.sum_marginal_log_likelihood import SumMarginalLogLikelihoodfrom botorch.utils.transforms import unnormalize, normalizefrom botorch.utils.sampling import draw_sobol_samplesNOISE_SE = torch.tensor([15.19, 0.63], **tkwargs)def generate_initial_data(n=6): # generate training data train_x = draw_sobol_samples(bounds=problem.bounds, n=n, q=1).squeeze(1) train_obj_true = problem(train_x) train_obj = train_obj_true + torch.randn_like(train_obj_true) * NOISE_SE return train_x, train_obj, train_obj_truedef initialize_model(train_x, train_obj): # define models for objective and constraint train_x = normalize(train_x, problem.bounds) models = [] for i in range(train_obj.shape[-1]): train_y = train_obj[..., i : i + 1] train_yvar = torch.full_like(train_y, NOISE_SE[i] ** 2) models.append( SingleTaskGP( train_x, train_y, train_yvar, outcome_transform=Standardize(m=1) ) ) model = ModelListGP(*models) mll = SumMarginalLogLikelihood(model.likelihood, model) return mll, model Define a helper functions that performs the essential BO step for qqqEHVI and qqqNEHVI​ The helper function below initializes the qqqEHVI acquisition function, optimizes it, and returns the batch x1,x2,…xq{x_1, x_2, \ldots x_q}x1​,x2​,…xq​ along with the observed function values. For this example, we'll use a relatively small batch of optimization (q=4q=4q=4). For batch optimization (q>1q>1q>1), passing the keyword argument sequential=True to the function optimize_acqfspecifies that candidates should be optimized in a sequential greedy fashion (see [1] for details why this is important). A simple initialization heuristic is used to select the 10 restart initial locations from a set of 512 random points. Multi-start optimization of the acquisition function is performed using LBFGS-B with exact gradients computed via auto-differentiation. Reference Point qqqEHVI requires specifying a reference point, which is the lower bound on the objectives used for computing hypervolume. In this tutorial, we assume the reference point is known. In practice the reference point can be set 1) using domain knowledge to be slightly worse than the lower bound of objective values, where the lower bound is the minimum acceptable value of interest for each objective, or 2) using a dynamic reference point selection strategy. Partitioning the Non-dominated Space into disjoint rectangles qqqEHVI requires partitioning the non-dominated space into disjoint rectangles (see [1] for details). Note: FastNondominatedPartitioning will be very slow when 1) there are a lot of points on the pareto frontier and 2) there are >5 objectives. from botorch.optim.optimize import optimize_acqf, optimize_acqf_listfrom botorch.acquisition.objective import GenericMCObjectivefrom botorch.utils.multi_objective.scalarization import get_chebyshev_scalarizationfrom botorch.utils.multi_objective.box_decompositions.non_dominated import ( FastNondominatedPartitioning,)from botorch.acquisition.multi_objective.monte_carlo import ( qExpectedHypervolumeImprovement, qNoisyExpectedHypervolumeImprovement,)from botorch.utils.sampling import sample_simplexBATCH_SIZE = 4NUM_RESTARTS = 10 if not SMOKE_TEST else 2RAW_SAMPLES = 512 if not SMOKE_TEST else 4standard_bounds = torch.zeros(2, problem.dim, **tkwargs)standard_bounds[1] = 1def optimize_qehvi_and_get_observation(model, train_x, train_obj, sampler): """Optimizes the qEHVI acquisition function, and returns a new candidate and observation.""" # partition non-dominated space into disjoint rectangles with torch.no_grad(): pred = model.posterior(normalize(train_x, problem.bounds)).mean partitioning = FastNondominatedPartitioning( ref_point=problem.ref_point, Y=pred, ) acq_func = qExpectedHypervolumeImprovement( model=model, ref_point=problem.ref_point, partitioning=partitioning, sampler=sampler, ) # optimize candidates, _ = optimize_acqf( acq_function=acq_func, bounds=standard_bounds, q=BATCH_SIZE, num_restarts=NUM_RESTARTS, raw_samples=RAW_SAMPLES, # used for intialization heuristic options={"batch_limit": 5, "maxiter": 200}, sequential=True, ) # observe new values new_x = unnormalize(candidates.detach(), bounds=problem.bounds) new_obj_true = problem(new_x) new_obj = new_obj_true + torch.randn_like(new_obj_true) * NOISE_SE return new_x, new_obj, new_obj_true Integrating over function values at in-sample designs qqqNEHVI integrates over the unknown function values at the previously evaluated designs (see [2] for details). Therefore, we need to provide the previously evaluated designs (train_x, normalized to be within [0,1]d[0,1]^d[0,1]d) to the acquisition function. Efficient batch generation with Cached Box Decomposition (CBD) qqqNEHVI leveraged CBD to efficiently generate large batches of candidates. CBD scales polynomially with respect to the batch size where as the inclusion-exclusion principle used by qEHVI scales exponentially with the batch size. Pruning baseline designs To speed up integration over the function values at the previously evaluated designs, we prune the set of previously evaluated designs (by setting prune_baseline=True) to only include those which have positive probability of being on the current in-sample Pareto frontier. def optimize_qnehvi_and_get_observation(model, train_x, train_obj, sampler): """Optimizes the qEHVI acquisition function, and returns a new candidate and observation.""" # partition non-dominated space into disjoint rectangles acq_func = qNoisyExpectedHypervolumeImprovement( model=model, ref_point=problem.ref_point.tolist(), # use known reference point X_baseline=normalize(train_x, problem.bounds), prune_baseline=True, # prune baseline points that have estimated zero probability of being Pareto optimal sampler=sampler, ) # optimize candidates, _ = optimize_acqf( acq_function=acq_func, bounds=standard_bounds, q=BATCH_SIZE, num_restarts=NUM_RESTARTS, raw_samples=RAW_SAMPLES, # used for intialization heuristic options={"batch_limit": 5, "maxiter": 200}, sequential=True, ) # observe new values new_x = unnormalize(candidates.detach(), bounds=problem.bounds) new_obj_true = problem(new_x) new_obj = new_obj_true + torch.randn_like(new_obj_true) * NOISE_SE return new_x, new_obj, new_obj_true Define a helper function that performs the essential BO step for qqqNParEGO​ The helper function below similarly initializes qqqNParEGO, optimizes it, and returns the batch x1,x2,…xq{x_1, x_2, \ldots x_q}x1​,x2​,…xq​ along with the observed function values. qqqNParEGO uses random augmented chebyshev scalarization with the qNoisyExpectedImprovement acquisition function. In the parallel setting (q>1q>1q>1), each candidate is optimized in sequential greedy fashion using a different random scalarization (see [1] for details). To do this, we create a list of qNoisyExpectedImprovement acquisition functions, each with different random scalarization weights. The optimize_acqf_list method sequentially generates one candidate per acquisition function and conditions the next candidate (and acquisition function) on the previously selected pending candidates. from botorch.acquisition.monte_carlo import qNoisyExpectedImprovementdef optimize_qnparego_and_get_observation(model, train_x, train_obj, sampler): """Samples a set of random weights for each candidate in the batch, performs sequential greedy optimization of the qNParEGO acquisition function, and returns a new candidate and observation.""" train_x = normalize(train_x, problem.bounds) with torch.no_grad(): pred = model.posterior(train_x).mean acq_func_list = [] for _ in range(BATCH_SIZE): weights = sample_simplex(problem.num_objectives, **tkwargs).squeeze() objective = GenericMCObjective( get_chebyshev_scalarization(weights=weights, Y=pred) ) acq_func = qNoisyExpectedImprovement( # pyre-ignore: [28] model=model, objective=objective, X_baseline=train_x, sampler=sampler, prune_baseline=True, ) acq_func_list.append(acq_func) # optimize candidates, _ = optimize_acqf_list( acq_function_list=acq_func_list, bounds=standard_bounds, num_restarts=NUM_RESTARTS, raw_samples=RAW_SAMPLES, # used for intialization heuristic options={"batch_limit": 5, "maxiter": 200}, ) # observe new values new_x = unnormalize(candidates.detach(), bounds=problem.bounds) new_obj_true = problem(new_x) new_obj = new_obj_true + torch.randn_like(new_obj_true) * NOISE_SE return new_x, new_obj, new_obj_true Perform Bayesian Optimization loop with qqqNEHVI, qqqEHVI, and qqqNParEGO​ The Bayesian optimization "loop" for a batch size of qqq simply iterates the following steps: given a surrogate model, choose a batch of points x1,x2,…xq{x_1, x_2, \ldots x_q}x1​,x2​,…xq​ observe f(x)f(x)f(x) for each xxx in the batch update the surrogate model. Just for illustration purposes, we run one trial with N_BATCH=20 rounds of optimization. The acquisition function is approximated using MC_SAMPLES=128 samples. Note: Running this may take a little while. import timeimport warningsfrom botorch import fit_gpytorch_mllfrom botorch.exceptions import BadInitialCandidatesWarningfrom botorch.sampling.normal import SobolQMCNormalSamplerfrom botorch.utils.multi_objective.box_decompositions.dominated import ( DominatedPartitioning,)from botorch.utils.multi_objective.pareto import is_non_dominatedwarnings.filterwarnings("ignore", category=BadInitialCandidatesWarning)warnings.filterwarnings("ignore", category=RuntimeWarning)N_BATCH = 20 if not SMOKE_TEST else 5MC_SAMPLES = 128 if not SMOKE_TEST else 16verbose = Truehvs_qparego, hvs_qehvi, hvs_qnehvi, hvs_random = [], [], [], []# call helper functions to generate initial training data and initialize modeltrain_x_qparego, train_obj_qparego, train_obj_true_qparego = generate_initial_data( n=2 * (problem.dim + 1))mll_qparego, model_qparego = initialize_model(train_x_qparego, train_obj_qparego)train_x_qehvi, train_obj_qehvi, train_obj_true_qehvi = ( train_x_qparego, train_obj_qparego, train_obj_true_qparego,)train_x_qnehvi, train_obj_qnehvi, train_obj_true_qnehvi = ( train_x_qparego, train_obj_qparego, train_obj_true_qparego,)train_x_random, train_obj_random, train_obj_true_random = ( train_x_qparego, train_obj_qparego, train_obj_true_qparego,)mll_qehvi, model_qehvi = initialize_model(train_x_qehvi, train_obj_qehvi)mll_qnehvi, model_qnehvi = initialize_model(train_x_qnehvi, train_obj_qnehvi)# compute hypervolumebd = DominatedPartitioning(ref_point=problem.ref_point, Y=train_obj_true_qparego)volume = bd.compute_hypervolume().item()hvs_qparego.append(volume)hvs_qehvi.append(volume)hvs_qnehvi.append(volume)hvs_random.append(volume)# run N_BATCH rounds of BayesOpt after the initial random batchfor iteration in range(1, N_BATCH + 1): t0 = time.monotonic() # fit the models fit_gpytorch_mll(mll_qparego) fit_gpytorch_mll(mll_qehvi) fit_gpytorch_mll(mll_qnehvi) # define the qEI and qNEI acquisition modules using a QMC sampler qparego_sampler = SobolQMCNormalSampler(sample_shape=torch.Size([MC_SAMPLES])) qehvi_sampler = SobolQMCNormalSampler(sample_shape=torch.Size([MC_SAMPLES])) qnehvi_sampler = SobolQMCNormalSampler(sample_shape=torch.Size([MC_SAMPLES])) # optimize acquisition functions and get new observations ( new_x_qparego, new_obj_qparego, new_obj_true_qparego, ) = optimize_qnparego_and_get_observation( model_qparego, train_x_qparego, train_obj_qparego, qparego_sampler ) new_x_qehvi, new_obj_qehvi, new_obj_true_qehvi = optimize_qehvi_and_get_observation( model_qehvi, train_x_qehvi, train_obj_qehvi, qehvi_sampler ) ( new_x_qnehvi, new_obj_qnehvi, new_obj_true_qnehvi, ) = optimize_qnehvi_and_get_observation( model_qnehvi, train_x_qnehvi, train_obj_qnehvi, qnehvi_sampler ) new_x_random, new_obj_random, new_obj_true_random = generate_initial_data( n=BATCH_SIZE ) # update training points train_x_qpa'''
