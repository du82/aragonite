full_description = 'Okhsv and OkhslTwo new color spaces for color picking This post has an accompanying interactive comparison of color pickers.I would recommend checking out the interactive demo first, then return if you are interested in the background and technical details.Picking colors is a common operation in many applications and over the years color pickers have become fairly standardized. Ubiquitous today are color pickers based on HSL and HSV. They are simple transformations of RGB values to alternative coordinates chosen to better correlate with perceptual qualities.Here are two common variants of color pickers built on HSL and HSV:A HSV color picker.A HSL color picker.Despite color picking playing a big role in a lot of applications, the design of color pickers isn’t a particularly well researched topic. While some variation exist in the widgets themselves, the choice of HSL or HSV is mostly taken for granted, with only a few exceptions.Is their dominance well deserved or would it be possible to create better alternatives? I at least think that this question deserves to be explored and that color picker design should be an active research topic. With this post I hope to contribute to the exploration of what a better color picker could and should be, and hopefully inspire others to do the same!The main focus here will be on the choice of color space, rather than the design of the UI widget used for navigating the color space.This rest of this post is organized as follow:A brief history of color pickingWhat are meaningful properties of color spaces for color picking?What options exist already and how do they perform?Introducing two new color spaces: Okhsl and OkhsvIdeas for future workColor picking before computers Munsell Color System. Photo by Hannes Grobe, license CC BY-SA 4.0Example of NCS color picker. Screenshot from NCS Navigator in the Colourpin app.Categorizing, describing and picking colors is an old problem and predates computers by many centuries. Over the years countless artists and scientists have worked to understand how humans perceive colors and used that knowledge to try and create practical systems for describing colors. Many different color ordering systems have been created over the years based on mixing properties of paints, light or on perceptual qualities.During the 20th century two important color systems emerged. The Munsell Color System and the Natural Color System (NCS). Both of them are based on human perception and were derived using experiments, but with different approaches. The two systems are used in many practical applications today still.In the Munsell color system, colors are described with three parameters, designed to match the perceived appearance of colors: Hue, Chroma and Value. The parameters are designed to be independent and each have a uniform scale. This results in a color solid with an irregular shape. Modern color spaces and models, such as CIELAB, Cam16 and my own Oklab, are very similar in their construction.The Natural Color System takes a different approach, and is designed to make it easy to describe colors, rather than to match perceptual qualities. It does this by describing colors by their similarity to six primary colors: white, black, yellow, red, green and blue. The yellow, red, green and blue colors are used to determine the hue. The final color is described by a color triangle with the corners white, black and the most saturated color of the given hue. A position in the triangle is described with the parameters whiteness, blackness, chromaticness. Any two of those parameters are sufficient, since they sum to one.For more information about historical color systems, this is a great resource: colorsystem.com.What makes a good color picker? Before diving into how color pickers have evolved in the digital era, let’s look a bit further at what considerations can be relevant when designing a color space for color picking. This part assumes familiarity with color appearance concepts such as lightness, chroma, saturation and hue.In this post the focus will be on what is today the most common case, picking colors in the sRGB gamut. Wide gamut and HDR displays are becoming more common and will be increasingly important, so wide gamut and HDR color picking is definitely a topic for further research and development, but it will not be considered here.Here’s an attempt at capturing useful properties for color spaces designed for picking colors:Orthogonal Lightness - Hue/Chroma/Saturation can be altered, while keeping perceived Lightness constantOrthogonal Chroma - Lightness/Hue can be altered, while keeping perceived Chroma constantOrthogonal Saturation - Lightness/Hue can be altered, while keeping perceived Saturation constantOrthogonal Hue - Lightness/Chroma/Saturation can be altered, while keeping perceived Hue constantSimple Geometrical Shape - Fit the target gamut into a cylinder or other simple shape, so that parameters can be altered independently without resulting in colors outside the target gamut. Could also be a swept triangle like NCS, since it is simple to map back and forth to a cylinder.Max Chroma at edge - Make it easy to find the strongest color of a given hue, by placing the strongest color on edge of the color volume.Varies Smoothly - Vary smoothly with each parameter. No discontinuous or abrupt changes.Varies Evenly - The perceived magnitude of the change in color caused by changing a parameter should be uniform for all values of the parameter.Note: These properties are in conflict, so designing a color space for color picking is a about finding which tradeoffs to make. In particular, independent control of hue, lightness and chroma can not be achieved in a color space that also maps sRGB to a simple geometrical shape.Color spaces for color picking By far the most used color spaces today for color picking are HSL and HSV, two representations introduced in the classic 1978 paper “Color Spaces for Computer Graphics”. HSL and HSV designed to roughly correlate with perceptual color properties while being very simple and cheap to compute.Worth noting is that HSL and HSV are not quite color spaces on their own, they are transformations from a source RGB color space. For each set of RGB primaries and transfer functions, the transformation to HSL and HSV produces unique color spaces. Today HSL and HSV are most commonly used together with the sRGB color space, so that is what we will look at here and we will here use HSL and HSV to refer to HSL and HSV for the sRGB color space.Also useful to note is that HSL and HSV are not continuously differentiable, so that limits their use with numerical optimization and machine learning.HSV HSV describes colors with three parameters:"Hue" - Roughly corresponds to perceived hue, but it has quite severe distortions."Saturation" - Roughly corresponds to saturation relative to maximum possible saturation in sRGB of the same hue."Value" - A bit hard to define. Can be seen as how much to mix the color with black, with 100% being no black and 0% completely black. “Value” is sometimes also referred to as Brightness.HSV is quite similar to the Natural Color System in its structure and it’s possible to transform it to have parameters more similar to NCS, then referred to as hue, whiteness and blackness (HWB). After that transformation the largest difference compared with NCS are:NCS is derived based on research into the appearance of colors and does a good job at matching human perceptionHWB/HSV has a simple construction, not taking research into color appearance into account and is not matching perception closely. Hue is the most problematic.NCS has a gamut designed to contain pigments realizable in paint/printHWB/HSV has a gamut based on the RGB color space it is constructed from (most commonly sRGB)Example of hue distortion for deep blue colors. Notice the purple shift as saturation decreases.HSL HSV describes colors with three parameters:"Hue" - Identical to “hue” in HSV, with the same issues."Saturation" - Roughly the chroma of the color relative to the most colorful color with the same “lightness” and “hue”. Confusingly referred to as saturation, which it is not comparable to. In the original paper it was referred to as “relative chroma”, which is more accurate. Not the same as “saturation” in HSV."Lightness" - Some correlation with the perception of lightness, with 0% corresponding to black and 100% to white. Does not match the perception of lightness well at all for saturated colors. Referred to as “Intensity” in the original paper.Example of hue distortion for deep blue colors.Example of colors HSL considers to have the same lightness.HSLuv HSLuv is a recent development to tackle some of the shortcomings of HSL. It is based on CIELChuv, a cylindrical form of 1976 CIE color space CIELUV. CIELChuv is constructed so that for a given hue, all colors of that hue can be constructed by additive blending of white and a saturated color of that hue (and in general, additive blending of light forms straight lines in CIELuv).HSLuv describes colors with three parameters:"Hue" - Same as hue in CIELChuv. Does not match the perception of hue fully due to the Abney effect: the perception of hue does not correspond to additive blending."Saturation" - Based on chroma as defined in CIELChuv, but rescaled to be relative to the most saturated sRGB color of the same “lightness” and “hue”."Lightness" - Same as lightness in CIELChuv. Does a good job at matching perceived lightness.Two drawback with HSLuv are:Does not match perception of hue. This is particularly obvious for deep blue and purple colors.The way “Saturation” is defined, it does not vary smoothly due to the uneven shape of the sRGB gamut. E.g. by keeping “Saturation” constant and changing hue, the perceived chroma can change drastically and abruptly.Example of hue distortion for blue colors. The distortion in HSLuv is different from that in sRGB and is caused by the Abney effect.Example of constant lightness in HSLuv, with low “saturation” close to the center of the circle and maximum “saturation” at the edge. Notice how the blue and red hues are much more saturated than surrounding colors.Slice of colors with constant “saturation” in HSLuv. The scaling to match the uneven shape of the sRGB gamut makes the perceived chroma vary unevenly.Color spaces modelling color appearance While there is a limited amount of research done regarding color picking, a lot of work has been done to create color models that are able to predict color appearance. These continue in the tradition of the Munsell color model discussed above, but use more modern color science and mathematical models to better model the appearance of color. One of the most famous of these is CIELab, but there are today several new models that perform better.Comparing all the color models is beyond the scope of this post, the important conclusion here is that these models can model the perception of Lightness, Hue and Chroma much better than all the previously discussed options. For a brief overview of some of the more recent models, see my previous post “A perceptual color space for image processing”. Since then another color model has also appeared: ZCAM. For a much deeper overview of modern color science and different attempts at modeling color appearance, I recommend the book “Color Appearance Models” by Mark D. Fairchild.The main drawback of using these models directly for color picking is that the sRGB gamut has a quite irregular shape in these color spaces. As a result, changing one parameter, such as hue, can easily create a color outside the target gamut, making them quite tedious to use. Several color pickers have been made using either CIELab or more modern lab-like color spaces. From what I can tell they have only seen limited use compared with the more common HSV and HSL color pickers however.I would think that the reason that they haven’t caught on is that their drawbacks outweigh their benefits: using a space with parameters that don’t match the our perception of hue, lightness and chroma is easier than using one with an irregular shape. That is certainly my personal experience.For the more advanced models an additional complication is that they have several parameters meant to be adjusted based on the viewing conditions. When used for color picking they seem to mostly be set to match some kind of average viewing conditions though.Here are a couple of examples of the irregular shape of the sRGB gamut in a perceptual color space:A slice of the gamut with a constant blue hue.A slice of the gamut with a constant yellow hue.It is unfortunately also common to see CIELab based color pickers showing colors outside the target gamut and often they are mapped back by simply clamping individual RGB components. This creates severe distortions in hue, lightness and chroma, in would would otherwise be a fairly uniform color space.Summary These are the color spaces I am aware of that are relevant, but please reach out if you are aware of any more color spaces useful for color picking.To summarize, here is a table of the different color spaces discussed and how they match the different desirable properties. This is definitely a bit subjective, but will hopefully give a decent overview.HSVHSLHSLuvLab-like*NCSOrthogonal LightnessnonoyesyesnoOrthogonal ChromanononoyespartialOrthogonal Saturationpartialnonono**noOrthogonal HuepartialpartialpartialyesyesSimple Geometrical Shapeyesyesyesnono***Max Chroma at EdgeyesnonoyesnoVaries SmoothlyyesyesnoyesyesVaries Evenlynononoyespartial*) This of course depends on which Lab-like color space. This is the best possible an appearance modelling color space could achieve.**) If desirable, saturation can be used instead of Chroma, and then this would be a yes and “Orthogonal Chroma” a no.***) NCS has a simple geometrical shape, but it does not match the sRGB gamut.Finding a better tradeoff One of the main advantages of HSL and HSV over the different Lab color spaces is that they map the sRGB gamut to a cylinder. This makes them easy to use since all parameters can be changed independently, without the risk of creating colors outside of the target gamut.The main drawback on the other hand is that their properties don’t match human perception particularly well. Reconciling these conflicting goals perfectly isn’t possible, but given that HSV and HSL don’t use anything derived from experiments relating to human perception, creating something that makes a better tradeoff does not seem unreasonable.We will attempt to do just that by creating new color spaces similar to HSL and HSV but that better match perception. This will be done by leveraging the Oklab color space. Using Oklab here over more advanced models such as CAM16 is useful because working out the math becomes a lot simpler. It also means that it won’t be a full color model able to adapt to different viewing conditions, but that is probably also de'
