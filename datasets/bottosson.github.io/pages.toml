full_description = '''sRGB gamut clipping When doing image processing, rendering or converting between RGB color spaces, it is easy to end up with RGB values outside of the 0.0 to 1.0 range (or 0 to 255 for 8-bit colors). This normally means that it isn’t possible to encode the color and it needs to be adjusted somehow before being displayed or encoded (scRGB is an example of an exception, and has a different range). The range of supported colors in a color spaces is referred to as a its gamut.Many of the colors outside the gamut are still valid colors, they just can’t be encoded in the given color space. The colors that can’t be encoded can be categorized as follows (for RGB color spaces without imaginary primaries):One or more RGB values are larger than one, but none are negativeThese colors are too bright for the color space, but could be encoded at a lower luminance.One or more negative valuesThese color are more colorful than the color space is able to encode. Some of these can be real colors, but they can also be colors more colorful than physically possible. This is a consequence of linear encoding of colors, which is able to encode colors that can’t exist in real life.The simplest technique for dealing with colors outside the valid range is to simply clamp RRR, GGG and BBB individually. The simplicity of this makes the technique widespread, but unfortunately it has significant drawbacks and can lead to unpleasant color distortions.Here is an example of taking a photo and increasing its exposure and colorfulness significantly, with results displayed as sRGB. Colorfulness has been increased by scaling Oklab chroma. RGB values here are simply clamped to the 0.0 to 1.0 range.UnprocessedProcessed with out of range values clampedThis is of course problematic. Hues are heavily distorted and all the details in the flowers are gone. Better methods are needed. Thankfully, this problem isn’t new and has been researched a lot over the years.Two main research topics exist:Tone mapping, which is concerned with mapping high dynamic range images to a lower dynamic range. This typically involves altering both colors inside and outside the gamut and sometimes involves different kinds of spatial filtering to keep details while reducing overall dynamic range.Gamut mapping, which is concerned with mapping colors from one color space to another and dealing with the mismatch in what colors can be encoded. This can either be done using gamut compression or gamut expansion, which adjusts all colors of an image, or using gamut clipping, which leaves colors that exist in both color spaces intact, while mapping colors outside the gamut back in range. For an overview see the paper “The Fundamentals of Gamut Mapping: A Survey”.Tone mapping, gamut expansion and gamut compression are all useful techniques, but will not be the focus of this article. Instead we will limit the scope to creating a practical alternative to clipping sRGB values, by looking at gamut clipping in the sRGB color space and on relatively simple, robust and portable algorithms. The source code for the operations shown is also available, at the end of the article.The techniques investigated are also, with some additional work, applicable to other color spaces, and some of the building blocks can be for other things, such as gamut compression. Combining gamut clipping with tone mapping can also be useful since some tone mapping techniques may still produce colors outside the target gamut.Gamut Clipping The goal of gamut clipping is to take colors that are outside the target gamut, and map them back to valid colors in a way that avoids perceived distortion and artifacts. In this article we also want to do this in a way that is reasonably efficient and simple to implement. Many techniques require complex iterative algorithms per pixel (or storing the results in 3D lookup tables) – those will not be considered here, but can be useful for many applications.Instead we will take this commonly used approach:Work in a perceptual color space.Keep hue constant, only change lightness and chroma.Only project color along straight lines in the perceptual color space.For an overview of different approaches, see the paper The Fundamentals of Gamut Mapping: A Survey.As a color space, we will use the Oklab perceptual color space, since it models hue, chroma and lightness well while being easy to work with mathematically. In particular, with Oklab, the shape of the gamut of an RGB color space is described by cubic polynomials, which are quite practical to work with compared to the equations you get with other spaces.Since we have decided to keep hue constant, it is now possible to plot the problem in two dimensions, using lightness, LLL, and chroma, CCC. To better understand the shape of the sRGB gamut, let’s look at of slices of constant hue. These are sampled every 30 degrees:Our goal is to find a way to map colors outside the gamut, shown in grey in the graphs, back into the gamut using straight lines. This problem can be split into two parts:Deciding along which line to project the color onto the gamutFinding the intersection between the line and the gamutLets start by tackling part 2.Intersecting lines with the gamut The math here is quite involved, so this sections just contains an overview of the approach. If that is still too much math, skip to the next section. For more details, see the source code.Expressed mathematically, the problem we want to solve is: Given a color expressed as (L1,C1)(L_1, C_1)(L​1​​,C​1​​) and h∘h^{\circ}h​∘​​, and a point (L0,C0)(L_0, C_0)(L​0​​,C​0​​) that is known to be inside the gamut, we want to find a value ttt so that (Lt,Ct)=t(L1,C1)+(1−t)(L0,C0)(L_t, C_t) = t (L_1, C_1) + (1-t) (L_0, C_0)(L​t​​,C​t​​)=t(L​1​​,C​1​​)+(1−t)(L​0​​,C​0​​) is a point on the gamut surface. We will also set C0=0C_0=0C​0​​=0 since the projections we want to make later always pass through the LLL axis.Using the definition of Oklab here, we get this conversion from LCh∘LCh^{\circ}LCh​∘​​ to linear sRGBsRGBsRGB:(l′m′s′)=M2−1×(LCcos(h∘)Csin(h∘)),(lms)=((l′)3(m′)3(s′)3),(rgb)=MXYZ_to_sRGBM1−1×(lms)\begin{pmatrix} l' \\ m' \\ s' \end{pmatrix} = \mathbf{M_2}^{-1} \times \begin{pmatrix} L \\ C\cos(h^{\circ}) \\ C\sin(h^{\circ}) \end{pmatrix},\qquad \begin{pmatrix} l \\ m \\ s \end{pmatrix} = \begin{pmatrix} {(l')}^{3} \\ {(m')}^{3} \\ {(s')}^{3} \end{pmatrix},\qquad \begin{pmatrix} r \\ g \\ b \end{pmatrix} = \mathbf{M}_{XYZ\_to\_sRGB} \mathbf{M_1}^{-1} \times \begin{pmatrix} l \\ m \\ s \end{pmatrix}​⎝​⎛​​​l​′​​​m​′​​​s​′​​​​​⎠​⎞​​=M​2​​​−1​​×​⎝​⎛​​​L​Ccos(h​∘​​)​Csin(h​∘​​)​​​⎠​⎞​​,​⎝​⎛​​​l​m​s​​​⎠​⎞​​=​⎝​⎛​​​(l​′​​)​3​​​(m​′​​)​3​​​(s​′​​)​3​​​​​⎠​⎞​​,​⎝​⎛​​​r​g​b​​​⎠​⎞​​=M​XYZ_to_sRGB​​M​1​​​−1​​×​⎝​⎛​​​l​m​s​​​⎠​⎞​​The gamut is then defined by the following inequalities:0<r<1,0<g<1,0<b<10 < r < 1,\qquad 0 < g < 1,\qquad 0 < b < 10<r<1,0<g<1,0<b<1This is enough information to solve the problem numerically, but involves solving six cubic polynomials. We are after a faster solution that uses more knowledge about the problem.By studying the gamut graphs and the equations, we can draw a few conclusions:For a given hue, the lower limit is always a straight line passing through (0,0)(0,0)(0,0)The gamut shape is always close to a triangle, with two of its corners in (1,0)(1,0)(1,0) and (0,0)(0,0)(0,0)If we can find the third point, we know exactly the lower limit and we have good first approximation of the upper limitThe location of the third point, (Lcusp(L_{cusp}(L​cusp​​, Ccusp)C_{cusp})C​cusp​​), only depends on h∘h^{\circ}h​∘​​. To find it we use a fitted numerical approximation followed by a single step of Halley’s method, this gives an error less than 10e610e610e6 (except for one point where the derivative ∂Ccusp/∂h∘\partial C_{cusp}/\partial h^{\circ}∂C​cusp​​/∂h​∘​​ is close to infinite). Since this only depends on h∘h^{\circ}h​∘​​ it is also possible to use a 1D lookup table for it.With the location for the cusp, it is now possible to find the intersection with the triangle. If the intersection is with the lower edge, this is everything we need to do. If the intersection is with the upper half, the triangle is only an approximation and we need to refine the solution. Again, one step of Halley’s method is enough to do this with high accuracy.Altogether, this is everything needed to find the intersection between a line and the sRGB gamut. To derive the numerical approximation of the location of the cusp, this Google Colab Notebook was used. With same method is should be possible derive approximations for other RGB color spaces. The complete source code is available at the end of this article.Choosing which line to project along Starting with a point (L1,C1)(L_1, C_1)(L​1​​,C​1​​), we want to decide a point (L0,C0)(L_0, C_0)(L​0​​,C​0​​) within the gamut to project towards. The choice is a matter of preference and can depend on context.Let’s start by testing a few simple existing methods and see what the projections look like for different hue slices and when applied the test image from the beginning.Keep lightness constant, only compress chroma Lightness is kept constant if it is between zero and one, otherwise it is clamped. This is done by projecting towards (L0,C0)=(clamp(L1,0,1),0)(L_0, C_0) = (clamp(L_1, 0, 1), 0)(L​0​​,C​0​​)=(clamp(L​1​​,0,1),0) h∘=30∘h^{\circ}=30^{\circ}h​∘​​=30​∘​​ h∘=120∘h^{\circ}=120^{\circ}h​∘​​=120​∘​​Gamut clipping testProjection towards a single point, hue independent Colors are projected towards the middle of the valid greyscale colors: (L0,C0)=(0.5,0)(L_0, C_0) = (0.5, 0)(L​0​​,C​0​​)=(0.5,0) h∘=30∘h^{\circ}=30^{\circ}h​∘​​=30​∘​​ h∘=120∘h^{\circ}=120^{\circ}h​∘​​=120​∘​​Gamut clipping testProjection towards a single point, hue dependent Colors are projected towards the lightness of the cusp of the gamut for the current hue: (L0,C0)=(Lcusp,0)(L_0, C_0) = (L_{cusp}, 0)(L​0​​,C​0​​)=(L​cusp​​,0) h∘=30∘h^{\circ}=30^{\circ}h​∘​​=30​∘​​ h∘=120∘h^{\circ}=120^{\circ}h​∘​​=120​∘​​Gamut clipping testCan we do better? The choice of projection will always be a matter of preference. Overall I think preserving lightness does the best overall of the above methods (and others agree, it is a commonly used technique). One challenge with preserving lightness though is that all colors with L>1L>1L>1 or L<0L<0L<0 get projected to a single point, and that highly saturated colors can become almost completely desaturated if light or dark enough, even though sacrificing just a small amount of lightness would have resulted in a much closer match.For this reason I’ve looked into creating new methods that mostly preserve lightness, but behaves closer to the single point projection methods for high and low lightness colors. The result is two new methods. They are novel as far as I am aware, but there are a lot of gamut mapping papers I haven’t read.The first method is based on projection towards L=0.5,C=0L=0.5, C=0L=0.5,C=0 and the second based on L=Lcusp,C=0L=L_{cusp}, C=0L=L​cusp​​,C=0. Both have a parameter α\alphaα to control to what extent lightness is preserved. α\alphaα is a real number larger than 0, where values close to zero will behave as pure chroma compression, and larger values will behave closer to the single point projection methods. Here is an overview of the two methods:Adaptive L0L_0L​0​​, hue independent This method blends between pure chroma compression and projection towards a single point, L0=0.5,C0=0L_0=0.5, C_0=0L​0​​=0.5,C​0​​=0.L0L_0L​0​​ is computed with the following equations:Ld=L1−0.5L_d = L_1-0.5L​d​​=L​1​​−0.5e1=1/2+∣Ld∣+αC1e_1 = 1/2 + |L_d| + \alpha C_1e​1​​=1/2+∣L​d​​∣+αC​1​​L0=1+sgn(Ld)(e1−e12−2∣Ld∣)2,C0=0L_0 = \frac{1 + sgn(L_d)(e_1 - \sqrt{e_1^2 - 2 |L_d|})} 2 ,\qquad C_0 = 0L​0​​=​2​​1+sgn(L​d​​)(e​1​​−√​e​1​2​​−2∣L​d​​∣​​​)​​,C​0​​=0Here are some results with different values for α\alphaα:α=0.05\large \alpha = 0.05α=0.05 h∘=30∘h^{\circ}=30^{\circ}h​∘​​=30​∘​​ h∘=120∘h^{\circ}=120^{\circ}h​∘​​=120​∘​​Gamut clipping testα=0.5\large \alpha = 0.5α=0.5 h∘=30∘h^{\circ}=30^{\circ}h​∘​​=30​∘​​ h∘=120∘h^{\circ}=120^{\circ}h​∘​​=120​∘​​Gamut clipping testα=5\large \alpha = 5α=5 h∘=30∘h^{\circ}=30^{\circ}h​∘​​=30​∘​​ h∘=120∘h^{\circ}=120^{\circ}h​∘​​=120​∘​​Gamut clipping testAdaptive L0L_0L​0​​, hue dependent This method blends between pure chroma compression and projection towards a single point, L0=Lcusp,C0=0L_0=L_{cusp}, C_0=0L​0​​=L​cusp​​,C​0​​=0L0L_0L​0​​ is computed with the following equations:Ld=L1−LcuspL_d = L_1-L_{cusp}L​d​​=L​1​​−L​cusp​​k=2{(1−Lcusp)if Ld>=0Lcuspif Ld<0k = 2 \begin{cases} (1-L_{cusp}) &\text{if } L_d >= 0 \\ L_{cusp} &\text{if } L_d < 0 \end{cases}k=2{​(1−L​cusp​​)​L​cusp​​​​​if L​d​​>=0​if L​d​​<0​​e1=k2+∣Ld∣+αC1ke_1 = \frac k 2 + |L_d| + \frac {\alpha C_1} ke​1​​=​2​​k​​+∣L​d​​∣+​k​​αC​1​​​​L0=Lcusp+sgn(Ld)(e1−e12−2k∣Ld∣)2,C0=0L_0 = L_{cusp} + \frac {sgn(L_d)(e_1 - \sqrt{e_1^2 - 2 k |L_d|})} 2 ,\qquad C_0 = 0L​0​​=L​cusp​​+​2​​sgn(L​d​​)(e​1​​−√​e​1​2​​−2k∣L​d​​∣​​​)​​,C​0​​=0Here are some results with different values for α\alphaα:α=0.05\large \alpha = 0.05α=0.05 h∘=30∘h^{\circ}=30^{\circ}h​∘​​=30​∘​​ h∘=120∘h^{\circ}=120^{\circ}h​∘​​=120​∘​​Gamut clipping testα=0.5\large \alpha = 0.5α=0.5 h∘=30∘h^{\circ}=30^{\circ}h​∘​​=30​∘​​ h∘=120∘h^{\circ}=120^{\circ}h​∘​​=120​∘​​Gamut clipping testα=5\large \alpha = 5α=5 h∘=30∘h^{\circ}=30^{\circ}h​∘​​=30​∘​​ h∘=120∘h^{\circ}=120^{\circ}h​∘​​=120​∘​​Gamut clipping testResults The following images compare RGB clipping with the five different gamut clipping methods above and a few choices of α\alphaα, across different images. All images have had their colorfulness increased by scaling Oklab chroma and their exposure increased slightly.The processing done here is for testing purposes only. I would not recommend doing image processing that creates this many invalid colors and solving it by gamut clipping. For example, in cases like this, some kind of gamut compressions would probably be a better choice.All the original photos are by me and both original images and the results are licensed under CC BY-SA.Flowers UnprocessedColors in gamutRGB clippedChroma clippedL0=0.5\small L_0 = 0.5L​0​​=0.5 projectionL0=Lcusp\small L_0 = L_{cusp}L​0​​=L​cusp​​ projectionAdaptive L0=0.5\small L_0 = 0.5L​0​​=0.5, α=0.05\small \alpha=0.05α=0.05Adaptive L0=0.5\small L_0 = 0.5L​0​​=0.5, α=0.50\small \alpha=0.50α=0.50Adaptive L0=0.5\small L_0 = 0.5L​0​​=0.5, α=5.00\small \alpha=5.00α=5.00Adaptive L0=Lcusp\small L_0 = L_{cusp}L​0​​=L​cusp​​, α=0.05\small \alpha=0.05α=0.05Adaptive L0=Lcusp\small L_0 = L_{cusp}L​0​​=L​cusp​​, α=0.50\small \alpha=0.50α=0.50Adaptive L0=Lcusp\small L_0 = L_{cusp}L​0​​=L​cusp​​, α=5.00\small \alpha=5.00α=5.00Lamp UnprocessedColors in gamutRGB clippedChroma clippedL0=0.5\small L_0 = 0.5L​0​​=0.5 projectionL0=Lcusp\small L_0 = L_{cusp}L​0​​=L​cusp​​ projectionAdaptive L0=0.5\small L_0 = 0.5L​0​​=0.5, α=0.05\small \alpha=0.05α=0.05Adaptive L0=0.5\small L_0 = 0.5L​0​​=0.5, α=0.50\small '''
