full_description = "Home / Download / Download Bouncy Castle C# .NET FIPS / Bouncy Castle C# .NET FIPS Roadmap Roadmap for Bouncy Castle C# .NET FIPS Here you can find details about our current plans and versions in progress for the FIPS-certified editions of Bouncy Castle C# .NET. Current Overview The BC FIPS C# .NET User Guide contains details about the API and use of the BC FIPS C# .NET module. The API is different from the regular C# API as it makes use of generics and needs to meet the FIPS boundary requirements. This has lead to an API that is similar in feel to the FIPS Java low-level API, but somewhat smaller as the use of C# generics has reduced the code size. Planned releases To learn more about the scheduled additions for Bouncy Castle C# .NET FIPS, click the version number(s) below. 2.0.0 Name: bc-fips-2.0.0.dll Scheduled Additions for BC FIPS C# .NET 2.0.0 Approved Mode Algorithms: Additional KAS modes for ephemeral keys. ML-KEM ML-DSA SLH-DSA Non-approved Mode Algorithms: NewHope (Update) Edwards Curves: X448, X25519 ChaCha20 Poly1305 GOST R 34.11-2012 Other: BC-FNA 2.0.0 will be done under FIPS 140-3 and using .NET Core rather than .NET Framework. For previous releases, see the Bouncy Castle C# .NET FIPS release notes."
