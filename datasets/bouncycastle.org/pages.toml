full_description = "Home / Download / Download Bouncy Castle C# .NET Download Bouncy Castle for C# .NET Welcome to the download page for Bouncy Castle C# .NET. In addition to the available access options, including through NuGet and direct download, you will find searchable release notes and links to API and other documentation. NuGet Archive The Bouncy Castle C# .NET latest release and older releases are available from the NuGet Archive Download from NuGet Download from bouncycastle.org We facilitate effortless downloads through bouncycastle.org, simplifying the process for our users. Take me to the Download section GitHub Access the Bouncy Castle APIs C# .NET package on GitHub, where you can also report issues, join discussions, and contribute to the software. Download from GitHub Documentation Explore the Bouncy Castle for C# .NET and C# .NET FIPS documentation online for concise guidance and examples. View the Documentation Join the discussion You can ask questions and learn from specialists in the Bouncy Castle C# .NET forum on GitHub Discussions. We highly appreciate and value your input. Go to GitHub Discussions Report an issue If you encounter any issues that require attention, feel free to report them in our GitHub repository. Report an issue Release notes Find out detailed information about the latest release and search in older release notes. Go to Release notes Beta releases The current working betas, when available, for the next release C# .NET can be found here. If you need a beta to be made available please ask by emailing feedback-crypto@bouncycastle.org. Beta releases Donate to support the Bouncy Castle APIs Supporting Bouncy Castle is now a substantial effort, the Java API is now over 300,000 lines, the C# one well past 140,000. Donate Bouncy Castle C# .NET Downloads Except where otherwise stated, this software is distributed under the regular Bouncy Castle license. For full details of other licenses involved, see Third party licenses. Distribution