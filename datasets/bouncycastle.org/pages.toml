full_description = '''Home / Engage Engage with the Bouncy Castle Community Connect with other users on our Java and C# forums or social media and spread the word to grow the community. Help us improve by contributing new features or documentation improvements or reporting issues or vulnerabilities. Join the Discussion - Java Report an Issue - Java Contribute Join the Discussion - C# Report an Issue - C# Report vulnerability If you discover a security issue, please report it by sending an email to the address below. We can provide a PGP key if required. feedback-crypto@bouncycastle.org Wiki on GitHub Please check out our Wiki page for answers to both common and uncommon questions related to our APIs. Go to our Wiki on GitHub YouTube Check out our tutorial videos on YouTube. Bouncy Castle videos are published together with EJBCA and SignServer videos on the Keyfactor Community channel. Take me to Bouncy Castle on YouTube Follow us on Social Media Stay up-to-date with the latest news and engage with us by following our social media accounts! Follow us on X Documentation Looking for the Bouncy Castle documentation? Documentation <img width="381" height="381" src="https://www.bouncycastle.org/wp-content/uploads/2023/12/quote-pattern.svg" class="image image-4064 size-large alignnone" alt="quote-pattern" decoding="async" /> <img src="https://www.bouncycastle.org/wp-content/uploads/2024/02/david-hook-transp.png" class="image image-4528 size-large alignnone gt-inside-picture" alt="David Hook" decoding="async" width="911" height="911" /> That Bouncy Castle is Open Source isn't just important to us, it's important to our user community. Transparency is everything and Open Source takes the "me" out of "trust me". That really matters. David Hook Co-founder and developer of Bouncy Castle See all contributors'''
