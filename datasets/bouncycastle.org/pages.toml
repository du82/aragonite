title = "Privacy and cookie policy - Bouncycastle"
full_description = '''Details of Cookies that may be used Adjusting Cookie Settings You can adjust your cookie settings by clicking on the button: CookieSettings Home / Privacy and cookie policy Privacy and Cookie Policy Legion of the Bouncy Castle Inc Privacy Statement Information Collected Legion of the Bouncy Castle Inc. is required to collect sufficient information to assist with effective fundraising to support further development of the Bouncy Castle APIs. The information collected may include: an optional contact email address, for single use. Internet users may also request information about Legion of the Bouncy Castle Inc. in this case we require: a contact email address a contact name Our web server also collects the following information about people visiting our web site: the server address the top level domain name (for example .com, .gov, .au, .uk etc) the pages you accessed and documents downloaded the referrer URL that brought you to the location on our web site the type of browser being used. Cookie Statement function OptanonWrapper() { } <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-KJTS5J6" height="0" width="0" style="display:none;visibility:hidden"></iframe> Details of Cookies that may be used Adjusting Cookie Settings You can adjust your cookie settings by clicking on the button: CookieSettings Access to information collected Except as otherwise described below, Legion of the Bouncy Castle Inc. will not directly pass any of the information collected onto third parties, other than general non-user identifying statistical information collected from the web servers, except as required by a government agency exercising its legal authority. As detailed above, third party cookies can be used by third parties to acquire information directly. All information directly collected is accessible to active members of the Legion who are engaged in assisting with fundraising, development of the APIs, and communicating with users. Email addresses supplied to the support inquiry form that appears on the download pages will be passed onto the organization Legion of the Bouncy Castle Inc. is currently partnered with to provide support for Bouncy Castle users. The organization currently filling the role of support provider is Keyfactor. Use of information collected Business partner information collected will be used solely for settling payment, requesting service, and engaging in commerce. In the case of Internet users requesting further information, your details will be used solely for the purpose you have given them to us. Web log information will be used for gathering statistical information about Legion of the Bouncy Castle Inc.'s web site. No attempts will be made to identify individual users from the web logs by Legion of the Bouncy Castle Inc.. This site does not provide facilities for the secure transmission of information across the Internet. Users should be aware that there are inherent risks transmitting information across the Internet. Contact Us If you have further questions about information we gather please email us at privacy@bouncycastle.org Details about Legion of the Bouncy Castle Inc. as well as links to the appropriate Government Authorities can be found on our about page.'''
