df BC FIPS in 100 examples Download: bc-fips-100-java.tar.gz or bc-fips-100-java.zip Default DRBG provider built on FIPS module (src + sample jar) Download: bcdefdrbg-fips-1.0.1.zip Bouncy Castle Java LTS Documentation Here you can find Bouncy Castle Java LTS-specific documentation. If you can't find what you're looking for, please see the general Bouncy Castle Java documentation above. Furthermore, the LTS project extends its support beyond Java, offering acceleration for Intel and ARM architectures where the underlying operating system allows for it. Bouncy Castle Java LTS Javadoc Package View online Download Provider bcprov-lts8on-2.73.5-javadoc bcprov-lts8on-2.73.5-javadoc.jar Utility Classes bcutil-lts8on-2.73.5-javadoc bcutil-lts8on-2.73.5-javadoc.jar CMS/EAC/OCSP/PKIX/PKCS/TSP bcpkix-lts8on-2.73.5-javadoc bcpkix-lts8on-2.73.5-javadoc.jar S/MIME bcmail-lts8on-2.73.5-javadoc bcmail-lts8on-2.73.5-javadoc.jar S/MIME (Jakarta) bcjmail-lts8on-2.73.5-javadoc bcjmail-lts8on-2.73.5-javadoc.jar OpenPGP/BCPG bcpg-lts8on-2.73.5-javadoc bcpg-lts8on-2.73.5-javadoc.jar TLS bctls-lts8on-2.73.5-javadoc bctls-lts8on-2.73.5-javadoc.jar Core (lcrypto) bccore-lts8on-2.73.5-javadoc bccore-lts8on-2.73.5-javadoc.jar Related Resources Tutorials Training: PKI at the edge with Bouncy Castle Learn how to use Bouncy Castle for generating certificates and certification requests, including for EJBCA. To make these tasks easier for system administrators, we will also look at Kotlin DSL as a scripting language. Watch the training: Training - PKI at the Edge with Bouncy Castle and EJBCA See the documentation: How-to guides and exercises - PKI at the Edge Tutorials and Workshops on Youtube Go to the playlist: Bouncy Castle Tutorials and Workshops Complimentary Packages EJBCA EJBCA is a fully functional Certificate Authority using J2EE technology. EJBCA builds on the J2EE platform to create a robust, high performance, platform independent, flexible, and component based CA to be used standalone or integrated in any J2EE app. Novosec Extensions Novosec Extensions provides the following pure Java extensions to the Bouncy Castle framework and has been made freely available by www.novosec.com: OCSP (RFC 2560) server and client CMP (RFC 2510, RFC 2511) generator and parser. JCE taglib JCE taglib is a JSP tag library with cryptographic funtions and X.509 certificate generation based on BouncyCastle JCE. There is also a refactoring of JCE taglib CryptoLib on the main JCE taglib project page. CryptoLib can also be used with non-JSP projects. LightCrypto LightCrypto is a library of cryptographic functions based on the lightweight API, including some functions for use with HSQLDB embeddable database. Portecle Portecle is a user-friendly GUI application for creating, managing, and examining key stores, keys, certificates, certificate requests, certificate revocation lists, and more. Jasypt Jasypt - Java Simplified Encryption is a java library that allows the developer to add basic encryption capabilities to his/her projects with minimum effort. It offers transparent integration with Hibernate, an open API for use with any JCE provider, and is suitable for integration into Spring-based applications and ACEGI. Instructions on using it with Bouncy Castle can be found at: http://www.jasypt.org/bouncy-castle.html. KeyTool IUI KeyTool IUI is a free user friendly GUI application for creating, managing keys and keystores as an alternative to the JDK's KeyTool command. Articles Français Cryptographie avec Bouncy CastleNyal Ce tutoriel constitue une première approche pour l'utilisation de la bibliothèque Bouncy Castle. Utiliser PGP avec Java et Bouncy CastleGraham Jenkins (Traduction française par Simon Depiets, relecture de la traduction française par Joëlle Cornavin). Books English Java Cryptography: Tools and TechniquesDavid Hook, Jon Eaves - Leanpub Finished in 2022 and written by two founders of the Bouncy Castle project, as a successor to "Beginning Cryptography with Java", the book covers the recent features introduced in the JCA/JCE as well the latest changes to the BC APIs and the BCFIPS Java module including the recent introduction of Post-Quantum algorithms to the BC APIs. Coverage of certificate generation, CMS, S/MIME, OpenPGP, and the TLS APIs is also included. Also available as a Paperback Edition and a Kindle Tablet Edition A copy of the source code for the examples in the book can be downloaded here: java-crypto-tools-src.zip. Beginning Cryptography with Java David Hook - Wrox Written by a Bouncy Castle APIs committer, the book covers recent features introduced in the JCA/JCE cryptography APIs in JDK 1.5 and is up to date with the cryptography APIs in J2SE 5.0, including Elliptic Curve cryptography, as well as dealing with earlier versions of the JCE/JCA in earlier JDKs. The book also deals with provider installation, X.509 certificate generation, CRL generation, and the creation and processing of PKCS #10 certification requests using the JCA and the Bouncy Cast'''
