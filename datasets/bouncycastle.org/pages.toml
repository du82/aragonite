description = "The release of Bouncy Castle 1.80 Java introduces several important updates f..."
full_description = "Home / Resources / NIST PQC Support and more – Bouncy Castle C# .NET 2.5.0 NIST PQC Support and more – Bouncy Castle C# .NET 2.5.0 2024-12-04 New release: Bouncy Castle C# .NET 2.5.0 With Bouncy Castle C# .NET 2.5.0, developers gain access to the latest cryptographic tools, enabling them to address emerging security challenges, future-proof their systems, and cater to specialized use cases in light-weight cryptography for IoT, post-quantum security, and password management. This release continues our commitment to innovation, empowering developers to build secure, scalable, and standards-compliant applications. Highlights Support for NIST Post-Quantum Cryptography (PQC) Standards This release introduces support for the newly standardized NIST PQC algorithms, including: ML-KEM (Key Encapsulation Mechanism) ML-DSA and SLH-DSA (Digital Signature Algorithms) It also supports signature context strings, enabling expanded applications for secure encryption and authentication. These advancements empower developers to begin migrating from classical algorithms to quantum-resistant alternatives, ensuring long-term security for encryption and digital signatures. Updated Support for Ascon Algorithms In alignment with the draft NIST SP 800-232 standard for Lightweight Cryptography, the Ascon family of algorithms in Bouncy Castle C# .NET has been updated. Ascon provides primitives for encryption, authentication, and integrity, optimized for use in IoT and embedded systems. This update is essential for developers and engineers working with constrained devices, where lightweight cryptography is necessary. Argon2 PBE Algorithm Support The release now includes the Argon2 Password-Based Encryption (PBE) algorithm, the winner of the Password Hashing Competition. Argon2 is a memory-hard algorithm designed to protect against modern attacks on older PBE mechanisms, ensuring stronger security for password-based encryption. For developers needing secure password-based key generation for applications, Argon2 PBE provides a superior security alternative to traditional PBE mechanisms, safeguarding sensitive data from advanced threats. Download BC C# .NET Read the Release Notes Related resources Implementing Cryptography Java Post-Quantum Cryptography Release 24 January, 2025 PQC and Lightweight Cryptography Updates – Bouncy Castle 1.80 JavaThe release of Bouncy Castle 1.80 Java introduces several important updates f... Read more Implementing Cryptography Post-Quantum Cryptography Release Ejbca Signserver 31 October, 2024 Latest NIST PQC Standards and more – Bouncy Castle Java 1.79New release: Bouncy Castle Java 1.79 Read more"
