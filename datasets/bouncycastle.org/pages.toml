["https://www.bouncycastle.org/about/bouncy-castle-fips-faq"]
title = "FIPS FAQ - Bouncycastle"
description = "This FAQ to address specific queries related to the FIPS versions of the Bouncy Castle Cryptographic APIs."
full_description = '''Home / About / FIPS FAQ FIPS FAQ We have put together this FAQ to address specific queries related to the FIPS versions of the Bouncy Castle Cryptographic APIs. Find your answers The FAQ covers general FIPS inquiries, as well as those specifically concerning the Java FIPS version and the C# .NET version. Moreover, if you are considering certification and require assistance, we offer a list of individuals and organizations we have collaborated with, including FIPS consultants and FIPS-accredited labs. General Questions Java FIPS Questions C# .NET FIPS Questions FIPS Consultants and accredited Labs General Questions What is a FIPS certified Cryptographic API like Bouncy Castle and when do I need it? A FIPS (Federal Information Processing Standards) certified Cryptographic API, such as the one provided by Bouncy Castle, refers to a cryptographic library that has been validated against the standards set forth by the National Institute of Standards and Technology (NIST) in the United States. These standards ensure that cryptographic algorithms and modules meet specific security requirements, making them suitable for use in government and sensitive commercial applications. Bouncy Castle's FIPS-certified Cryptographic API offers a high level of assurance regarding the security and reliability of cryptographic operations. Previously certified to FIPS 140-2, the Bouncy Castle APIs now adhere to the stringent guidelines outlined in the FIPS 140-3 standard which is recognized internationally for its rigorous testing and validation procedures. You may need to use Bouncy Castle FIPS certified Cryptographic APIs in scenarios where regulatory compliance or security mandates dictate the use of validated cryptographic modules. For instance, if you’re developing software for government agencies, financial institutions, or healthcare organizations that are subject to regulatory frameworks. Additionally, industries with stringent security needs, such as defense, aerospace, and critical infrastructure, often require the use of FIPS-validated cryptographic modules. How to do I join the early access program? The best way to join the program is by getting a support contract. What extras do I get with the early access program? Apart from access to the latest source of the FIPS API as it evolves and the right to use it, you also get access to the full source for both the CAVP and operations test harnesses, the original documentation, and some various other tools we have found useful. We want to do a private validation of some, or all, of the APIs, what do we do? You will need a support contract and pay the required NIST and lab fees. This will give you an authority letter for NIST granting permission to do the rebrand, access to consulting time for any issues you might have, as well as all the features of the early access program. Speak to your lab, if you don't have a lab already, or are unsure what to do next, read on. Please check out our blog post on Private Label Validations. When we told our developers about our plans to do a certification, they disappeared into the server room and didn't come out! We think they're hiding under the floor, is there anyone who can help? Yes, see our list of FIPS consultants. After you have selected one, the news you are getting some help, plus the smell of freshly brewed coffee is normally enough to get people back into the light. Our developers are already experienced but we do not have an existing relationship with a testing lab, are there any you have worked with? Yes, see our list of FIPS-accredited testing labs. So you really are funding this effort with a mixture of support contracts, donations, and sponsorships? Yep. We're a legion and diversity is strength! That said, since the acquisition of Crypto Workshop, Keyfactor has become our primary sponsor, and as part of this agreement are now responsible for managing Bouncy Castle support contracts. This has also allowed us to expand the team and work towards providing a better “Bouncy Castle” experience for our support contract holders. Are there any other compelling reasons for getting a support contract? As it happens there are. We have found two things that distinguish our support contract holders from our regular user base. Developers with access to a support contract are more likely to raise an issue with us early rather than try and muddle through, and developers with access to a support contract also take a more active interest in the beta releases, both FIPS and non-FIPS. The second one is useful as it means any issues or shortfalls in the beta are able to be fixed while the updates are still in beta. The first one is a real cost saver as it does not lead to us receiving emails starting with "Our development team has spent (some number of) weeks trying to work out..." It is much cheaper to have a support contract! I am still not quite there with the support contract, can I still report an issue? Sure. Please report standard issues for Java at https://github.com/bcgit/bc-java/issues and for C# .NET at https://github.com/bcgit/bc-csharp. If it is a security concern, we kindly ask you to send an email to feedback-crypto@bouncycastle.org. We can provide a PGP key if required. Java FIPS Questions What are the current release details for the Bouncy Castle FIPS certified APIs for Java? The most recent release for the Bouncy Castle FIPS module for Java is 2.0.0 and labeled BC-FJA 2.0.0. BC-FJA 2.0.0 has been issued NIST certificate #4743. Where can I find the Bouncy Castle FIPS certified APIs for Java? The current and previous Java FIPS releases are at: Download Bouncy Castle for Java FIPS. What JVMs are the APIs currently certified for? The BC-FJA 1.0.2.4 APIs are certified for Java 1.7, Java 1.8, Java 11, and Java 17. The BC-FJA 2.0.0 APIs are certified up for Java 1.8, Java 11, Java 17, and Java 21. Are there any versions for Android? FIPS on Android is a little complex - the FIPS module needs to be installed on the device in order for all the start up tests to be run correctly. Based on the widely respected "org.spongycastle" trick, we have actual FIPS modules in the package "org.stripycastle" for Lollipop, Marshmallow, Nougat, and Oreo. We also have an "org.spongycastle" packaging with some start up tests disabled that can used in an application. Note: this last one is FIPS derived not FIPS compliant. The Android releases are currently only available under the early access program by arrangement. Is there a roadmap for future Java FIPS releases? Yes, you can find some more details on our Java FIPS roadmap page. C# .NET FIPS Questions What are the current release details for the Bouncy Castle FIPS certified APIs for C# .NET? The most recent release for the Bouncy Castle FIPS module for C# .NET is 1.0.2 and labeled BC-FNA 1.0.2. BC-FNA 1.0.2 has been issued NIST certificate #4416. Where can I find the Bouncy Castle FIPS certified APIs for C# .NET? The current and previous C# .NET FIPS releases are at: Download Bouncy Castle for C# .NET FIPS What Common Language Runtime (CLR) are APIs for C# .NET targeted at? The base CLR for the C# .NET FIPS is CLR 4. Is there a roadmap for future C# .NET releases? Yes, you can find some more details on our C# .NET FIPS roadmap page. FIPS CONSULTANTS AND ACCREDITED LABS This is the current list of people/organisations we've worked with at some level. The main thing they have in common is they've shown the sensibility (and even humor) required to work with an Open Source effort like Bouncy Castle and regimes like that of FIPS 140-2, FIPS 140-3 and Common Criteria. If you are trying to work out the ordering, the list is alphabetical. If you would like to be on the list and you are not, contact us at office@bouncycastle.org. Putting the list together proved trickier than we thought, we apologize in advance if we've left someone off who should be on it. FIPS Consultants Corsec Security, Inc. Contact:Jake Nelsonjnelson@corsec.com Corsec Security, Inc.13921 Park Center Rd #460,Herndon, VA 20171United States of America KeyPair Consulting Contact:Mark Minnochmark@keypair.us KeyPair Consulting987 Osos StreetSan Luis Obispo, CA 93401United States of America Symbiotic Systems Research Contact:Randall Steckrsteck@symsysresearch.com Symbiotic Systems Research5618 Bloomfield Drive, Suite #1Alexandria, VA 22312United States of America FIPS Accredited Labs Acumen Security Contact:Josh Kolstadjoshua.kolstad@intertek.com Laboratory Manager,Acumen Security18504 Office Park DrMontgomery Village, MD 20886United States of America ADVANCED DATA SECURITY Contact:Eugene Polulyakhep@adseclab.com Laboratory DirectorADVANCED DATA SECURITY1933 O'Toole WaySan Jose, CA 95131United States of America ÆGISOLVE, INC. Contact:Travis Spanntspann@aegisolve.com Laboratory DirectorÆGISOLVE, INC.415 Fairchild Dr.Mountain View, CA. 94043United States of America Lightship Security, Inc. Contact:Jason Lawlorjason.lawlor@lightshipsec.com Lightship Security302 - 135 Rideau Street,Ottawa, ON K1N 5X4Canada Teron Labs Contact:Juan Gonzalezjuan@teronlabs.com Laboratory DirectorTeron LabsUnit 3, 10 Geils CourtDeakin, ACT 2600Australia UL Contact:Gerrit KruitboschGerrit.Kruitbosch@ul.com UL - InfoGard Laboratories709 Fiero Lane, Suite 25San Luis Obispo, CA 93401United States of America'''
