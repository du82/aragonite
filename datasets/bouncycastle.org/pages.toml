LTS releases. Releases Latest release Release 2.73.7 Release 2.73.6 Release 2.73.5 Release 2.73.4 Release 2.73.3 Release 2.73.2 Release 2.73.1 Release 2.73.0 Search Release 2.73.7 8 November, 2024 This release is based on BC 1.79 and contains new features and bug fixes found in that release. In addition, the PQC algorithms ML-KEM, ML-DSA, and SLH-DSA h... This release is based on BC 1.79 and contains new features and bug fixes found in that release. In addition, the PQC algorithms ML-KEM, ML-DSA, and SLH-DSA have been added and hardware acceleration has been included for SLH-DSA using SHA-256."
