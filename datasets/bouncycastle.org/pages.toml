full_description = "Home / Download / Download Bouncy Castle Java LTS Download Bouncy Castle for Java LTS Welcome to the download page for Bouncy Castle Java LTS. In addition to the available access options, including Maven Central, direct download, and GitHub, you will find searchable release notes and links to API and other documentation. Use the Java long-term support (LTS) version of the Bouncy Castle APIs when long-term stability is crucial for your application, providing a reliable and secure foundation over an extended period. Maven The Bouncy Castle Java LTS jars are mirrored on the Maven central repository. Download from Maven Download from bouncycastle.org We facilitate effortless downloads through bouncycastle.org, simplifying the process for our users. Take me to the Download section GitHub Access Bouncy Castle APIs Java LTS package on GitHub, where you can also report issues, join discussions, and contribute to the software. Download from GitHub Documentation Check out the Bouncy Castle for Java documentation, including the LTS documentation for clear guidance and examples. View the Documentation Join the discussion You can ask questions and learn from specialists in the Bouncy Castle Java forum on GitHub Discussions. We highly appreciate and value your input. Go to GitHub Discussions Report an issue If you encounter any issues that require attention, feel free to report them in our GitHub repository. Report an Issue Release notes Find out detailed information about the latest release and search in older release notes. Go to Release notes Beta testing The current working betas, when available, for the next release for JDK 1.8 and later can be found here. If you need a beta to be made available for another version of Java please ask by emailing feedback-crypto@bouncycastle.org. Download the latest Beta release Donate to support the Bouncy Castle APIs Supporting Bouncy Castle is now a substantial effort, the Java API is now over 300,000 lines, the C# one 