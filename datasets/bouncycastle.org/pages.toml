["https://www.bouncycastle.org/download/bouncy-castle-java-fips/roadmap"]
title = "Bouncy Castle Java FIPS Roadmap - Bouncycastle"
description = "Find all details about our current plans and versions in progress on the Bouncy Castle Java FIPS Roadmap."
full_description = "Home / Download / Download Bouncy Castle Java FIPS / Bouncy Castle Java FIPS Roadmap Roadmap for Bouncy Castle Java FIPS Here you can find details about our current plans and versions in progress for the FIPS-certified editions of Bouncy Castle Java. Current Overview The BC FIPS Java Description document contains a broad overview of the motivations and design of the BC FIPS Java module. As of BC Java 1.54 from a JCA/JCE point of view the module is largely a drop in replacement and can be used with the other BC APIs for certificate generation, CMS, TSP, S/MIME, OpenPGP and other protocols. Owing to the requirements of FIPS, particularly in respect to boundary issues the lightweight API is quite different, however the ASN.1 packages and the EC math package are the same. Planned releases To learn more about the scheduled additions for Bouncy Castle Java FIPS, click the version number(s) below. 2.1.0 Stream Name: bc-fips-2.1.0.jar Adds EdDSA (FIPS 186-5) support to approved mode. Adds support for Intel AES-NI, SHA-256, and native RNG/DRBG where the operational environment otherwise supports it. Includes multi-release support suitable for OSGI. Supports Java 8 and later. Now in early access release. Submitted December, 2023. 2.2.0 Stream Name: bc-fips-2.2.0.jar Based on BC-FJA 2.0.0. Adds ML-KEM, ML-DSA, and SLH-DSA. Includes multi-release support suitable for OSGI. Supports Java 8 and later. Now in early access release. Currently under test. For previous releases, see the Bouncy Castle Java FIPS release notes."
