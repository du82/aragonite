full_description = 'Home / Download Download Bouncy Castle APIs The Bouncy Castle cryptographic APIs are available for Java, C#, and in Kotlin. In addition, we have special FIPS-certified, as well as long-term support (LTS) releases. Download your version of Bouncy Castle and try it today! Bouncy Castle for Java Java Use our Java version of Bouncy Castle APIs when you require a comprehensive and flexible set of cryptographic functions in your Java-based application. Download Bouncy Castle Java Java FIPS Opt for the FIPS-certified Java version of Bouncy Castle APIs to ensure compliance with FIPS for cryptographic modules, providing a heightened level of security assurance in regulated environments. Download Bouncy Castle Java FIPS Java LTS Use the Java Long-Term Stable version of Bouncy Castle APIs when stability and long-term support are crucial for your application, providing a reliable and secure foundation over an extended period. Download Bouncy Castle Java LTS Bouncy Castle for C# C# C# .NET Use the C# .NET version of Bouncy Castle cryptographic APIs when developing .NET applications and requiring a versatile and robust set of cryptographic functions. Download Bouncy Castle C# .NET C# C# .NET FIPS Use the C# .NET FIPS version of Bouncy Castle APIs when your .NET application needs to adhere to FIPS for cryptographic modules, ensuring a higher level of security compliance in regulated environments. Download Bouncy Castle C# .NET FIPS Bouncy Castle for Kotlin <img width="500" height="500" src="https://www.bouncycastle.org/wp-content/uploads/2024/02/kotlin-full-color-logo-mark-rgb.svg" class="image image-4959 size-small alignnone" alt="Bouncy Castle with Kotlin" decoding="async" /> Kotlin Use the Kotlin interface to Bouncy Castle APIs when developing Android or Kotlin-based applications, leveraging the comprehensive cryptographic functionalities offered by Bouncy Castle in a Kotlin-friendly manner. Go to Bouncy Castle Kotlin on GitHub'
