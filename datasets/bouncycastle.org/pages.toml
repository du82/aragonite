["https://www.bouncycastle.org/engage/contributors"]
title = "How you can contribute to Bouncy Castle"
description = "We welcome all contributions. Thanks to our contributors who spent valuable time in producing code, reporting bugs, suggesting features, etc."
full_description = "Home / Engage / Contributors Bouncy Castle Contributors At Bouncy Castle, we deeply appreciate and welcome contributions. Bouncy Castle thrives on the collaborative spirit of the community, and we're excited to see how your contributions will continue to shape and elevate our project. Seeing the diverse and talented contributors join forces with Bouncy Castle is heartening and reflects the open-source spirit we envisioned. Every contributor brings a unique touch to our cryptographic journey, making it an incredibly rewarding collaboration for us all. Megan Woods Senior Software Engineer, Legion of the Bouncy Castle How to contribute to Bouncy Castle If you want to contribute to the project, we welcome you to our GitHub projects where you can take part in discussions, submit an issue, or create a pull request, on the basis that any code included may be distributed under the Bouncy Castle License. For more information, see our Contributing Guidelines: Bouncy Castle Java Contributing Guidelines on GitHub. Bouncy Castle C# Contributing Guidelines on GitHub. View the contributors to Java and C# Bouncy Castle Java contributors & donors Bouncy Castle C# contributors & donors Bouncy Castle Java contributors We value all contributions to our product. Thank you for your dedication to our success! Check out the list of our Bouncy Castle Java project contributors who have helped shape the APIs: Bouncy Castle Java donors The following people and organizations donated financially to help with the release of Bouncy Castle: Holders of Crypto Workshop Support Contracts. Without the consulting time left over from support contracts being contributed back to working on the Bouncy Castle APIs, progress would be impossible! You know who you are. AXL Software, Larry West (California), A-Sher (1.77). EduFer (1.72). Miguel, Rodolfo Hansen, and iterate GmbH (1.69). Encryptomatic.com (1.67). Denis Beurive, Ravi_02, and Manuel Corona (1.66). Christian Kahlo, Alexi Livshitz, and Denis Beurive (1.65). Joshua Hight (1.63). Bihari Babu (1.61). Jens Neuhalfen and perillamint (1.60). Brian Reid (1.59). Joop Kaashoek and Pexus LLC (1.57). DidiSoft, Cotiviti, Atanas Krachev, Encryptomatic LLC, LogicalAnswersIncSupporter (1.56). Digistamp, RAM NAG (1.55). Lobster GmbH (1.54). Sheba, Ishmal Bartley, and Li-Chang Johnny Lo (1.53). lecker@buetterchen.de, Charles Proxy, Gunny Mills, Morgan Le Douget, Ben Whitaker, and Emilio Navarrete Lineros (1.52). Gup & Boz @ Alki Seattle, Bytemine Gmbh, Ted Pennings, Atanas Krachev, PrimeKey Solutions AB, Martin Paljak, CorseraFri19980116, CPU Terminator, Lindsay Bradford, kares, Philius, and Aaron Anderson (1.51). We also wish to acknowledge financial and collaborative support from CISCO and additional financial support from PrimeKey, now a part of Keyfactor, towards developing the EST API for RFC 7030 support. Bouncy Castle Java code contributors organizations The following organizations have contributed to the Bouncy Castle Cryptography Package. Thanks, may your castles never deflate! University of Adelaide, Dr. Yuval Yarom and Deepak Bhargavan Pillai, and University of Melbourne, Dr. Chitchanok Chuengsatiansup, technical review and analysis of the Java PQC implementations and advice on remediations to address possible security issues found. Monash University, Cyber Security Lab, under the supervision of A. Prof. Ron Steinfeld, Dr. Amin Sakzad, and Dr. Raymond K. Zhao for contributions to the NIST post-quantum algorithm set. Initial NTRU implementation: Akbar Fadiansyah. Initial Falcon implementation: Zi Li Tan. Initial CRYSTALS-Kyber implementation: Salang Kang. Initial NTRU Prime implementation: Sai Agraharam (saicharan.agraharam@gmail.com). Initial CRYSTALS-Dilithium implementation: Salang Kang. University of Wollongong, Institute of Cybersecurity and Cryptology, under the supervision of Dr Dung Duong <hduong@uow.edu.au> for contributions to the NIST post-quantum algorithm set. Initial BIKE implementation: Tuong Ngoc Nguyen <tuong.nguyenng@gmail.com>, Xuan Thanh Khuc <khucxuanthanh@gmail.com>, and Khanh Nguyen <tungkhanhmta@gmail.com>. Initial HQC implementation: Tuong Ngoc Nguyen <tuong.nguyenng@gmail.com>, Xuan Thanh Khuc <khucxuanthanh@gmail.com>, and Khanh Nguyen <tungkhanhmta@gmail.com>. Grier Forensics, for collaborating in the development of the S/MIME Toolkit and DANE SMIMEA functionality. TU-Darmstadt, Computer Science Department, RBG, for the initial lightweight client side TLS implementation, which is based on MicroTLS and for help with qTESLA implementation. MicroTLS was developed by Erik Tews under the supervision of Dipl.-Ing. Henning Baer and Prof. Max Muehlhaeuser. qTESLA assistance was provided by Nina Bindel and Yinhua Xu. TU-Darmstadt, Computer Science Department, RBG, for the initial Post Quantum provider, which was based on the FlexiProvider. The FlexiProvider was developed by the Theoretical Computer Science Research Group at TU-Darmstadt, Computer Science Department, RBG under the supervision of Prof. Dr. Johannes Buchmann. More information on the history of FlexiProvider can be found at: https://www.flexiprovider.de/ Voxeo Labs - sponsorship of the initial development of APIs for DTLS 1.0 (RFC 4347), DTLS-SRTP key negotiation (RFC 5764), and server side TLS 1.1 (RFC 4346) and tested WebRTC compatibility. More information on Voxeo Labs can be found at https://voxeolabs.com Core Infrastructure Initiative - financial support towards developing the TLS API and JSSE provider that appeared in 1.56. Additional CertPath testing and validation data from the CertPath testing tool developed by cryptosource GmbH and media Transfer AG both located in Darmstadt, Germany. Micro Focus - additional support towards further developing the TLS/DTLS API and the BCJSSE provider. Atlassian Software Systems donation of Confluence and JIRA licences. Bouncy Castle Java code contributors people The following people have contributed to the Bouncy Castle Cryptography Package. Thanks, may your castles never deflate! Tito Pena <Fortunato.Pena@AdNovum.CH> - initial RC5 (32 and 64) implementation. Michael Lee <yfl@mira.net> - initial RC6 implementation, MD2 implementation Nuno Santos <nsantos@student.dei.uc.pt> - finding toString bug in certificate object. Brett Sealey <bretts@mortbay.com> - fixing the missing return problem in JDKKeyFactory (affected SSLeay private keys). Victor A. Salaman <salaman@teknos.com> - fixing the bug in Cipher.java which caused it to ignore specified providers, fixing the bug in RSAKeyGenerator which caused keys to be occasionally produced 1 bit too small. Eran Librach <eranl@valicert.com> - spotting and fixing the classLoader bug that occurs if javax.crypto and the provider aren't sharing the same classpath (occurs in JDK 1.3 and greater). Jonathan Knudsen <jonathan@LearningPatterns.com> - porting information and restrictions when using the lightweight library with the MIDP environment. Markus Niedermann <markus.niedermann@softwired-inc.com> - porting information and restrictions when using the lightweight library with the MIDP environment. Mike Benham <moxie@thoughtcrime.org> - detection and fixing of an incorrect weak key in the DES key generation support classes. Suggestions for simplifying DESedeParameter objects. Optimisations for the Blowfish engine and BufferedBlockCipher class. Soren Hilmer <hilmer@mail.tele.dk> - initial implementation of netscape certificate request classes. Uwe Guenther <uwe@cscc.de> - detection and fixing of 3 incorrect semi-weak keys in the DES key generation support classes. Markus Bradtke <mab@informatik.uni-kiel.de> - fixing of a logic error in the JDKKeyStore class. Waclaw Sierek <waclaw.sierek@tpg.pl> - fix to setOddParity in the DESParameter class. Assistance with adding ordering to X509 names for certificate generation, proper processing of byte strings in the ASN1 package, further simplifications and additional classes to improve pkcs7 support, bug fixes in CertPath API. Ly-Na Phu <lyna.phu@init-consulting.de> - assistance in the addition of ISO 9796-1 padding. Stefan Köpsell <sk13@mail.inf.tu-dresden.de> - making the jdk 1.1 version of the collections API available. For further details see https://sourceforge.net/projects/jcf/ Carmen Bastiaans <cbastiaa@microbits.com.au> - fixing the improper null pointer problem in the setting of certificates in the PKCS12 key store. Tomas Gustavsson <tomasg@primekey.se> - initial implementation of the AuthorityInformationAccess, SubjectKeyIdentifier, AuthorityKeyIdentifier, CRLNumber, CRLReason, CertificatePolicies, V2TBSCertListGenerator, and X509V2CRLGenerator classes in the ASN.1 library. Additions to GeneralName class, other bug fixes in the X.509 package. Initial implementation of the CertificationRequest classes. getRevocationReason() patch for OCSP. Patch to SemanticsInformation to prevent ClassCastException. Eugen Kuleshov <euxx@hotmail.com> - optimisations for Blowfish, assistance with PKCS12/keytool interoperability. Megan Woods <meganwoods@sekurafile.com> - initial implementation of ECIES. Christian Geuer-Pollmann <geuerp@apache.org> - adding IV's to the AESWrap implementations. Initial implementation of DESedeWrap. Michael Mühle <michael@mouling.de> - contributing the initial CertPath implementation and compatibility classes, fixing provider bug in JDK 1.1 java.security.cert.CertificateFactory compatibilty class. Michael Mansell <me@michaelmansell.com> - fixing the parsing of the empty DER set in the ASN.1 library. Eike Recker <eike.recker@gmx.de> - fixing misspelling of provider reference for RSA/1 and RSA/2. Chris Southern <CSouthern@baltimore.com> - fixing misuse of specified provider in the PKCS10 certification request class. Sidney Markowitz <sidney@sidney.com> - fixing null pointed exception on unknown OID in X509Name class, initial implementation of the three AES engines. Chris Kerr <ckerr@filonet.ca> - initial implementation of the cms, asn1.cms, and the mail/smime packages, assistance in simplifying the ASN.1 package, miscellaneous other optimisations, NIST CertPath certification test, PKIXPolicyNode class, CertPath subtree validation and policy tree construction. We also wish to acknowledge the generosity of Filonet Corporation for allowing Chris to make the initial cms and mail/smime packages available to us. Mike Bean <mbean@lucentradius.com> - fixing the fall through bug in the IV algorithm parameters class. Martin Petraschek <e9526225@student.tuwien.ac.at> - fixing ASN1 tagging so tag values up to 30 are now supported. Jess Garms <jgarms@yahoo.com> - fixing 112/168 key size bug for DESede key generation. Mike Bremford <mike@big.faceless.org> - contributing the inital PKCS7 implementation. Shankar Srinivasan <ssr002@yahoo.com> - S/Mime interoperability testing and debugging. Stef Hoeben <ilsestef@skynet.be> - adding Montgomery multiplication to the BigInteger class. Klaudiusz Ciosk <kciosk@max.com.pl> - improving the compatibility of the SMIME package with the Sun JCE. Thomas Houtekier <Thomas.Houtekier@tectrade.net> - S/Mime testing and debugging. Interoperability with Biztalk. Don Hillsberry <hillsber@dialcorp.com> - S/Mime testing and debugging. Kazuo Furuya <kfuruya@infoteria.co.jp> - fixing root certificate chaining bug in PKCS12 key store. Jason Novotny <jdnovotny@lbl.gov> - initial work on the openSSL PEM processing. Joel Hockey <joel.hockey@qsipayments.com> - initial work on the openSSL PEM processing. John Steenbruggen <JohnS@geotrust.com> - fixing CertificationRequestInfo to handle cert request info objects without attribute blocks. Justin Chapweske <justin@chapweske.com> - ordering patch for Tiger message digest. John Serock <jserock@hotmail.com> - fixing null pointer exception in constructor for ExtendedKeyUsage. Fixing of base OID bug in KeyPurposeId. Compliance of KeyUsage extension return value with security API. Sascha Weinreuter <Sascha.Weinreuter@cit.de> - fixed SMIME saveChanges() bug. Andre Wehnert <aw5@mail.inf.tu-dresden.de> - fixing key schedule problem in RC5-64, fixing buffer cleaning issue in buffered block cipher. Luigi Lo Iacono <lo_iacono@nue.et-inf.uni-siegen.de> - adding SIC mode to the blockciphers in the provider. Tim Sakach <tsakach@certivo.net> - SMIME v2 compatibility patches. Marcus Povey <mpovey@brookes.ac.uk> - adding the PGP mode to the lightweight API and the provider. Sebastian Clauß <sc2@inf.tu-dresden.de> - adding randomness setting to the certificate and CRL generators. Nicolas Bielza <nicolas.bielza@alligacom.com> - isolating the tagging bug in the ASN.1 library that was misrepresenting some ASN.1 constructed data types. Contributions to the streaming S/MIME classes. Casey Marshall <rsdio@metastatic.org> - fixing the clone problem with Macs in the clean room JCE. Rick Zeldes <rick.zeldes@eds.com> - initial code for CMS/SMIME CompressedData. Jarek Gawor <gawor@mcs.anl.gov> - fixing ASN.1 sequence unpacking in BasicConstraints constructor. Brett Neumeier <random@rnd.cx> - patch to OriginatorIdentifierOrKey object, improvements to encoders package, introduction of UrlBase64. Graham Coles <graham.coles@retail-logic.com> - patch to isParityAdjusted in DESKeySpec. Jörn von Kattchée <J.Kattchee@seeburger.de> - patch to SMIMEGenerator for preventing class cast exceptions with BodyParts containing Multipart objects. Matteo Artuso <matartuso@libero.it> - picking up the possible overead in ASN1InputStream. Julian Morrison <julian@extropy.demon.co.uk> - spotting the slow down in Diffie-Hellman key generation. Elmar Sonnenschein <eso@esomail.de> - fix to long conversion in clean room SecureRandom. Jörn Schwarze <JSchwarze@ulc.de> - Locale fix for the clean room JCE. Bryan Lovquist <bkl@cps.com.au> - Other provider compatibility fixes for CMS signing. Artem Portnoy <Artem_Portnoy@ibi.com> - generalisations for CMSProcessableBodyPart in S/MIME. Header fix for mime messages. Michael Häusler <haeusler@ponton-consulting.de> - missing OID update for SHA1 with RSA Signature. Johan Seland <johans@netfonds.no> - general toString for BigInteger class. Johannes Nicolai <johannes.nicolai@novosec.com> - further enhancements to OCSP response generation, fix to CertificateID issuer. Marc Doberva <marc.doberva@ilex-si.com> - help in isolating the JSSE/BC RSA key issue. Jan Dvorak <jan.dvorak@mathan.cz> - initial implementation of the light weight Null block cipher. Joe Cohen <jcohen@forumsys.com> - converting the ArrayOutOfBoundsException in DERInputStream into what it should have been. Chris Long<aclong@ece.cmu.edu> - adding public key decoding to PEMReader. Hes Siemelink<hes@izecom.com> - findIssuer fix for CertPathBuilder, toMimeMessage converter for Mail API, getSize() fix for zero length messages in SMIMEMessage. Stefan Puiu<stefanpuiuro@yahoo.com> - initial implementation V3 policy mapping, policy qualifier objects in ASN.1 X.509 package. Kaiser Yang <kaiseryang@yahoo.com> - Finding BigInteger loop problem in prime generation. Jiri Urbanec <jiri.urbanec@logicacmg.com>"
