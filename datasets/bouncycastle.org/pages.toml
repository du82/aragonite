full_description = '''Bouncy Castle – Open-source cryptographic APIs Welcome to the home of the Legion of the Bouncy Castle and its FIPS-certified open-source cryptographic APIs for Java and C#. About Bouncy Castle <img src="https://www.bouncycastle.org/wp-content/uploads/2025/01/event-tile-kftd-1-720x476.jpg" class="image image-6640 size-medium alignnone gt-inside-picture" alt="Event-tile-KFTD-1" decoding="async" width="720" height="476" /> Featured Keyfactor Tech Days Accelerate Digital Trust Join us for 2+ days of inspiring keynotes, engaging sessions and workshops, and non-stop networking opportunities. March 4-5, 2025 Fontainebleau Miami Beach, Miami, Florida Read more and Register Download Bouncy Castle Download the Bouncy Castle APIs for Java, Java FIPS, Java LTS, C# .NET, C# .NET FIPS or the Kotlin version. Download Bouncy Castle Read the Documentation Access necessary resources for your project here: installation instructions, configuration guides, test examples, and much more. Bouncy Castle Documentation Join the Discussion You can ask your questions and learn from specialists in the Bouncy Castle forum on GitHub Discussions. Go to GitHub Java Discussions Go to GitHub C# .NET Discussions Here at the Legion of the Bouncy Castle, we believe in cryptography We have been providing cryptography solutions for over 20 years, offering FIPS certifications, LTS releases, and quantum-ready support to meet everyone's needs. 24 Years of history 8 Years FIPS certified 6.2M Downloads per month Java Download C# .NET Download Get inspired Stay up-to-date on the latest Bouncy Castle news and updates through our news feed. From product releases to the newest tutorial videos, guides, and events, our feed provides the latest information on all things related to Bouncy Castle. <img src="https://www.bouncycastle.org/wp-content/uploads/2024/01/keyfactor-release-720x390-1.png" class="image image-5956 size-medium alignnone gt-inside-picture" alt="Keyfactor Release" decoding="async" width="720" height="390" /> Implementing Cryptography Java Post-Quantum Cryptography Release 24 January, 2025 PQC and Lightweight Cryptography Updates – Bouncy Castle 1.80 JavaThe release of Bouncy Castle 1.80 Java introduces several important updates f... Read more <img src="https://www.bouncycastle.org/wp-content/uploads/2025/01/td-event2-100-720x406-1.jpg" class="image image-6649 size-medium alignnone gt-inside-picture" alt="TD event2-100" decoding="async" width="720" height="406" /> DevOps Industrial Cybersecurity & IoT Installation & Deployment Post-Quantum Cryptography Signing Event Ejbca 20 January, 2025 Join Tech Days in Miami 2025March 4-5, 2025 Fontainebleau Miami Beach, Miami, Florida Read more <img src="https://www.bouncycastle.org/wp-content/uploads/2024/01/keyfactor-release-720x390-1.png" class="image image-5956 size-medium alignnone gt-inside-picture" alt="Keyfactor Release" decoding="async" width="720" height="390" /> Implementing Cryptography Post-Quantum Cryptography Release Ejbca Signserver 4 December, 2024 NIST PQC Support and more – Bouncy Castle C# .NET 2.5.0New release: Bouncy Castle C# .NET 2.5.0 Read more More inspiration and news Related open-source projects <img src="https://www.bouncycastle.org/wp-content/uploads/2024/01/community-ejbca.png" class="image image-4259 size-small alignnone gt-inside-picture" alt="community-ejbca" decoding="async" width="355" height="136" /> Open-source PKI Software EJBCA is a robust, reliable open-source Certificate Authority software that can be tailored to meet your PKI requirements. Whether you're managing an internal PKI or setting up a PKI for your business application or product, EJBCA has the flexibility and scalability to support your needs. EJBCA.org <img src="https://www.bouncycastle.org/wp-content/uploads/2024/01/community-signserver.png" class="image image-4262 size-small alignnone gt-inside-picture" alt="community-signserver" decoding="async" width="512" height="136" /> Open-source signing software Try SignServer for digital signing for code, documents, timestamps, and more. SignServer is a digital signing engine, making it easy for teams to automate signing workflows and support all of their signing formats and use cases. SignServer.org <img src="https://www.bouncycastle.org/wp-content/uploads/2024/03/keyfactor-pqc-ad.png" class="image image-5776 size-full alignnone gt-inside-picture" alt="Keyfactor PQC ad" decoding="async" width="1200" height="201" /> Register now Join Keyfactor Tech Days in Miami for 2+ days of inspiring keynotes, sessions, workshops, and networking.'''
