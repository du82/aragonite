full_description = "Home / Download / Download Bouncy Castle Java LTS Download Bouncy Castle for Java LTS Welcome to the download page for Bouncy Castle Java LTS. In addition to the available access options, including Maven Central, direct download, and GitHub, you will find searchable release notes and links to API and other documentation. Use the Java long-term support (LTS) version of the Bouncy Castle APIs when long-term stability is crucial for your application, providing a reliable and secure foundation over an extended period. Maven The Bouncy Castle Java LTS jars are mirrored on the Maven central repository. Download from Maven Download from bouncycastle.org We facilitate effortless downloads through bouncycastle.org, simplifying the process for our users. Take me to the Download section GitHub Access Bouncy Castle APIs Java LTS package on GitHub, where you can also report issues, join discussions, and contribute to the software. Download from GitHub Documentation Check out the Bouncy Castle for Java documentation, including the LTS documentation for clear guidance and examples. View the Documentation Join the discussion You can ask questions and learn from specialists in the Bouncy Castle Java forum on GitHub Discussions. We highly appreciate and value your input. Go to GitHub Discussions Report an issue If you encounter any issues that require attention, feel free to report them in our GitHub repository. Report an Issue Release notes Find out detailed information about the latest release and search in older release notes. Go to Release notes Beta testing The current working betas, when available, for the next release for JDK 1.8 and later can be found here. If you need a beta to be made available for another version of Java please ask by emailing feedback-crypto@bouncycastle.org. Download the latest Beta release Donate to support the Bouncy Castle APIs Supporting Bouncy Castle is now a substantial effort, the Java API is now over 300,000 lines, the C# one well past 140,000. Bouncy Castle Java LTS Downloads The LTS release is based off BC 1.73. Where possible it has been updated from the regular BC Java release, but avoiding changes which might break existing API. For this reason the LTS release does not currently include the PQC algorithms, although we expect to add them once they stabilize. The 2.73.X Java LTS release will be updated in general until the end of 2027, with security only patches till the end of 2028. The next LTS cycle will begin in 2027. Users looking to extend the 2.73.X Java LTS release beyond 2028 can do so via our support program. Except where otherwise stated, this software is distributed under the regular Bouncy Castle license. For full details of other licenses involved, see Third party licenses. Distribution Files (JAR format) The current release is BC-LJA 2.73.7. JDK 1.8 and later Compiled classes, sources and JavaDoc for Java 1.8 and later. Provider bcprov-lts8on-2.73.7.jar bcprov-lts8on-2.73.7-sources.jar bcprov-lts8on-2.73.7-javadoc.jar ASN.1 Utility Classes bcutil-lts8on-2.73.7.jar bcutil-lts8on-2.73.7-sources.jar bcutil-lts8on-2.73.7-javadoc.jar PKIX/CMS/EAC/PKCS/OCSP/TSP/OPENSSL bcpkix-lts8on-2.73.7.jar bcpkix-lts8on-2.73.7-sources.jar bcpkix-lts8on-2.73.7-javadoc.jar SMIME bcmail-lts8on-2.73.7.jar bcmail-lts8on-2.73.7-sources.jar bcmail-lts8on-2.73.7-javadoc.jar Jakarta SMIME bcjmail-jdk18on-2.73.7.jar bcjmail-jdk18on-2.73.7-sources.jar bcjmail-jdk18on-2.73.7-javadoc.jar OpenPGP/BCPG bcpg-lts8on-2.73.7.jar bcpg-lts8on-2.73.7-sources.jar bcpg-lts8on-2.73.7-javadoc.jar DTLS/TLS API/JSSE Provider bctls-lts8on-2.73.7.jar bctls-lts8on-2.73.7-sources.jar bctls-lts8on-2.73.7-javadoc.jar Note: the compiled jar files in this distribution are all multi-release. Maven Central Signing Key If you are trying to confirm the signatures for artifacts from Maven Central, you can use the public key linked below. Download bc_maven_public_key.asc Release notes Find out detailed information about the Java LTS releases. Releases Latest release Release 2.73.7 Release 2.73.6 Release 2.73.5 Release 2.73.4 Release 2.73.3 Release 2.73.2 Release 2.73.1 Release 2.73.0 Search Release 2.73.7 8 November, 2024 This release is based on BC 1.79 and contains new features and bug fixes found in that release. In addition, the PQC algorithms ML-KEM, ML-DSA, and SLH-DSA h... This release is based on BC 1.79 and contains new features and bug fixes found in that release. In addition, the PQC algorithms ML-KEM, ML-DSA, and SLH-DSA have been added and hardware acceleration has been included for SLH-DSA using SHA-256."
