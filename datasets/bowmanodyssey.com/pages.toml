full_description = "Zach Bowman June 22, 2022 Goddamn California Zach Bowman June 22, 2022 It’s the little things, at first. How, when it came time to buy the fluid for the transfer case, Grainger politely said the brand I preferred couldn’t be shipped to California. Or, once I’d found a substitute, drained all the old blood into a bucket, then carefully poured it back into the empty containers, the local parts store told me they couldn’t take all the fluid for recycling at once. I’d have to come back tomorrow with the rest, and oh, we can’t accept the empty containers, either. Zach Bowman June 22, 2022 The Only Rule Zach Bowman June 22, 2022 We left the coast two weeks ago and pointed ourselves inland, towards Ashland, Oregon. I spent a late summer night there once, years ago. Stopped in at the end of a blissful day of riding. The best day, maybe, chasing two good friends through the tangle of the Klamath National Forest, our flawed but brilliant motorcycles humming their way up that ancient river valley, chasing the green and dashing water north, ever north. Zach Bowman June 22, 2022 Nine Months Zach Bowman June 22, 2022 We’re into our ninth month. Two hundred and forty long days of wandering. Thirty-five states and some 22,000 miles. Everything shows the sign of it. It’s more than the tower of digits on the odometer, more than the hour on my watch. It’s leaking power steering lines and flagging air conditioning. It’s new rust, dents, and scrapes. Scratches, chips in our windshield. It’s our clothing, faded or failing at the abuse of a truncated rotation and the harshness of laundromat machines. It's the fatigue of so many fitful nights. Zach Bowman June 22, 2022 Glacier Zach Bowman June 22, 2022 We missed the tourist season but we went anyhow, despite the graying skies and the low sun. Despite the fallen leaves and cold nights. We pointed ourselves north and gunned straight for the Canadian border, toward Glacier National Park. Everyone who’s been uses the same sparkling vocabulary: Gorgeous. Beautiful. Stunning. It’s the kind of consensus that leaves me wary, and when we roll through the gates, I half expect to find Glacier's thin thread of natural wonder buried under a blanket of humanity. Some version of the Great Smoky Mountains, or another Acadia."
