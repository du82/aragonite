title = "Who we are — Bowman Odyssey"
full_description = '''About Who we are The Truck Partners Contact All photography provided by Runaway Alice Photography.Two parents, one toddler, and a truck. Hi there.We're Zach and Beth. In 2016, we sold everything we owned, turned our abused 2003 Dodge Ram 2500 into a camper, and took to the road with our one-year-old daughter, Lucy June. Why? Because we worked hard. And because that work kept us from each other. This year was a rare chance for us, a slender slice of our lives that we took for ourselves while we could. We're glad you're here. Zach, Beth, and Lucy June. <img src="https://images.squarespace-cdn.com/content/v1/58277c0b197aea524aa7419d/1486759114439-KETY2I69WCSFK0TZ5DLX/image-asset.jpeg" alt="I filled my arms with the last of my daughter&amp;rsquo;s stuffed animals and began walking towards our new home. Somewhere in the field behind me, a coyote called out, yipping at the darkness, barking her hello. All about settling down. About what this" /> <img src="https://images.squarespace-cdn.com/content/v1/58277c0b197aea524aa7419d/1485543498836-TU7A6X6LGWMIIGAAJ24Z/image-asset.jpeg" alt="In still others, what we started when we left our life behind back in November will never end. We will never be the people we were. God, are we fortunate for it. Latest post is up! Link in bio. #bowmanodyssey #fourwheelcamper #dodge #florida #knoxv" /> <img src="https://images.squarespace-cdn.com/content/v1/58277c0b197aea524aa7419d/1485122228857-WDDFNDCN0G2AB6APQBM5/image-asset.jpeg" alt="Thanks, Atlanta." /> <img src="https://images.squarespace-cdn.com/content/v1/58277c0b197aea524aa7419d/1484426456180-JBSAG0J0THYM6MIG99EP/image-asset.jpeg" alt="Beautiful morning exploring in sunny #florida . #bowmanodyssey #fourwheelcamper #dodge" /> <img src="https://images.squarespace-cdn.com/content/v1/58277c0b197aea524aa7419d/1484103426561-UX3I4IHGZZNQPBOB1NNB/image-asset.jpeg" alt="A huge thanks to @therealhooniverse for making our day and our year with this award. Head over to their site for the full article." /> <img src="https://images.squarespace-cdn.com/content/v1/58277c0b197aea524aa7419d/1484072968493-GK1Q0F8NZY00MQER82DJ/image-asset.jpeg" alt="We&amp;rsquo;re into the gray embers of our year. The last flickers of our wandering. Mostly, it means retracing our steps, sticking close to the Gulf and the fair weather it offers. Revisiting the places we saw in our earliest days on the road. There&amp;rs" /> <img src="https://images.squarespace-cdn.com/content/v1/58277c0b197aea524aa7419d/1483756929509-8J4AV59KNKYQX6B74Y0L/image-asset.jpeg" alt="I live, I die, I live again. The Mule's back from surgery, complete with a new fuse box. Here's to the next 320,000 miles. #bowmanodyssey #cummins #ramtrucks #fourwheelcampers" /> <img src="https://images.squarespace-cdn.com/content/v1/58277c0b197aea524aa7419d/1483305447548-Z4198V12XRT54OJ9TCOS/image-asset.jpeg" alt="Voting is officially open! Our rig is up for Hooniverse Car of the Year. We're flattered to be nominated. Link in bio. @therealhooniverse" /> <img src="https://images.squarespace-cdn.com/content/v1/58277c0b197aea524aa7419d/1483219080661-RZYX3NV8S4Q5JRT57DTM/image-asset.jpeg" alt="Thank you to everyone who opened their homes and their hearts to us this year. Thank you for following along on this crazy adventure and supporting us each step of the way. Here's to a new year. Cheers!" /> <img src="https://images.squarespace-cdn.com/content/v1/58277c0b197aea524aa7419d/1483069633591-O8ILEALR7JNY5NEG3DMU/image-asset.jpeg" alt="We spent our gray December days wandering the twisted rows, daydreaming about what we&amp;rsquo;d bring back from the dead and how we&amp;rsquo;d do it, our eyes wandering over the rusting Chargers and Mustangs, Lincolns and Cadillacs. It&amp;rsquo;s where I lea" /> <img src="https://images.squarespace-cdn.com/content/v1/58277c0b197aea524aa7419d/1482856160187-9M36Q6II5BCSL8M9SHO2/image-asset.jpeg" alt="Austin." /> <img src="https://images.squarespace-cdn.com/content/v1/58277c0b197aea524aa7419d/1482422921057-IQP6TPABAUA0FBORAK99/image-asset.jpeg" alt="The place is different now. It&amp;rsquo;s almost cold. The sky&amp;rsquo;s overcast, and the low clouds push across the horizon on a sharp wind. We&amp;rsquo;re different, too. Latest post is up. Check it out and share if you dig it. Link in bio. #bowmanodysse" /> <img src="https://images.squarespace-cdn.com/content/v1/58277c0b197aea524aa7419d/1481751452224-6LEE7GBWPW0YYTKRFV9L/image-asset.jpeg" alt="It&amp;rsquo;s strange how the pieces of your life fit together. Strange how they run wide and far to bring you where you&amp;rsquo;re going, an infinite number of maybes and misses that could only have gone the way they went. This week's article is up and " /> <img src="https://images.squarespace-cdn.com/content/v1/58277c0b197aea524aa7419d/1481744223349-STG410BJZY1ESJRGIF2R/image-asset.jpeg" alt="Our rig has been nominated for the 2016 Hooniverse Car of the Year. This mule has allowed us to do so much and go so many amazing places this year. We are grateful for it and for the kind words from everyone over at @therealhooniverse Check out the a" /> <img src="https://images.squarespace-cdn.com/content/v1/58277c0b197aea524aa7419d/1481726218664-EJLJ0CZXTKX26MIMBLK5/image-asset.jpeg" alt="Reminiscing about snow and birch trees near the North Rim of the #grandcanyon this morning. #bowmanodyssey #fourwheelcamper #dodge" /> <img src="https://images.squarespace-cdn.com/content/v1/58277c0b197aea524aa7419d/1481065096940-SRYGJJ6ZAO6WNJ3R3O5B/image-asset.jpeg" alt="It&amp;rsquo;s blinded me to the wonder of where we&amp;rsquo;ve been, what we&amp;rsquo;ve seen and when we&amp;rsquo;ve done it. Now, when the three of us are young and alive, before the press of years makes something as foolish as this an impossibility. I hate my" /> <img src="https://images.squarespace-cdn.com/content/v1/58277c0b197aea524aa7419d/1480889623834-A24GJ9IFDJH4J5DW5NTG/image-asset.jpeg" alt="Here comes the storm. #bowmanodyssey #cummins #fourwheelcampers #bigbendnationalpark #texas" /> <img src="https://images.squarespace-cdn.com/content/v1/58277c0b197aea524aa7419d/1480719104553-A3M8Z2EYZDVQ39LQE1K5/image-asset.jpeg" alt="Spent the morning walking through old stone foundations, looking at the glass and tin left behind from more than 100 years ago. This afternoon, headed up through Ernst Tinaja. Pure wild. #bigbendnationalpark #hike #nps #bowmanodyssey" /> <img src="https://images.squarespace-cdn.com/content/v1/58277c0b197aea524aa7419d/1480702259802-W73REL35B4G9AL63P4MA/image-asset.jpeg" alt="Cloudy desert days." /> <img src="https://images.squarespace-cdn.com/content/v1/58277c0b197aea524aa7419d/1480639251998-SX2HMT1TPFV0SF9N1WZ5/image-asset.jpeg" alt="We have been all over this wonderful, strange, brilliant, idiot country. Hear my meaning when I tell you there is nowhere as special as Big Bend." /> #block-yui_3_17_2_13_1478982669457_17018 .sqs-gallery-block-grid .sqs-gallery-design-grid { margin-right: -20px; } #block-yui_3_17_2_13_1478982669457_17018 .sqs-gallery-block-grid .sqs-gallery-design-grid-slide .margin-wrapper { margin-right: 20px; margin-bottom: 20px; }'''
