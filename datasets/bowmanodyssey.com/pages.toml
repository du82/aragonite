title = "Travel — Stories — Bowman Odyssey"
full_description = "Zach Bowman January 27, 2017 Travel One Short Road Zach Bowman January 27, 2017 Travel In still others, what we started when we left our life behind back in November will never end. We will never be the people we were.God, are we fortunate for it. Zach Bowman January 10, 2017 Travel Out of Austin Zach Bowman January 10, 2017 Travel We’re into the gray embers of our year. The last flickers of our wandering. Mostly, it means retracing our steps, sticking close to the Gulf and the fair weather it offers. Revisiting the places we saw in our earliest days on the road. There’s a bitter strangeness to it. A perfect symmetry I could not have planned. Tagged: Travel, Bowman Odyssey, Dodge, Four Wheel Camper"
