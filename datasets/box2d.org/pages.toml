["https://box2d.org/documentation"]
title = "Box2D: Overview"
full_description = "Box2D is a 2D rigid body simulation library for games. Programmers can use it in their games to make objects move in realistic ways and make the game world more interactive. From the game engine's point of view, a physics engine is just a system for procedural animation. Box2D is written in portable C11. Most of the types defined in the engine begin with the b2 prefix. Hopefully this is sufficient to avoid name clashing with your application. In this manual I'll assume you are familiar with basic physics concepts, such as mass, force, torque, and impulses. If not, please first consult Google search and Wikipedia. Box2D was created as part of a physics tutorial at the Game Developer Conference. You can get these tutorials from the publications section of box2d.org. Since Box2D is written in C, you are expected to be experienced in C programming. Box2D should not be your first C programming project! You should be comfortable with compiling, linking, and debugging. ‍Caution: Box2D should not be your first C project. Please learn C programming, compiling, linking, and debugging before working with Box2D. There are many resources for this online. This manual covers the majority of the Box2D API. However, not every aspect is covered. Please look at the Reference section and samples application included with Box2D to learn more. This manual is only updated with new releases. The latest version of Box2D may be out of sync with this manual. You can help to ensure your issue gets fixed if you provide sufficient detail. A testbed example that reproduces the problem is ideal. You can read about the testbed later in this document. Box2D works with several fundamental concepts and objects. I briefly define these objects here and more details are given later in this document. A chunk of matter that is so strong that the distance between any two bits of matter on the chunk is constant. They are hard like a diamond. In the following discussion I use body interchangeably with rigid body."
year_published = 2025
clearnet = "https://box2d.org/documentation"
category = "SitesList"
