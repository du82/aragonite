full_description = "References Over the years I’ve learned a thing or two… maybe three. Here is some reference material for your use and abuse. Cybersecurity Links I Recommend It is easy to get overwhelmed by all the cybersecurity references, blogs, podcasts, and training resources out there. This is my shortlist of resources I read, use, and recommend. Read more… Data vs. Information A gazillion years ago, I had a disagreement with a student in one of my classes about data vs. information. The student insisted that they were one and the same, and I insisted they were different. To help find a better description of how and why they are not the same, I mentioned my dilemma to a friend. His response remains one of the best discussions about data, information, data management, and database design that I have ever read. Read more… Pentest Report Writing Tips Some while ago I realized that, while there are lots of books and references about how to do pentesting, there don’t seem to be any about reporting what you find. This series of articles is my attempt to fill that void. Read more… SEO Basics Search Engine Optimization (SEO) is one of the “holy grails” of web design. It is also one of the least understood aspects of eCommerce. To help turn the tide of ignorance I wrote a series of articles to walk you through various aspects of search engine optimization from beginning to end. Read more…"
