description = "Hello, and welcome to my website/blog. In case we haven’t met yet, my name is Bronwen Aker, I have been an Internet professional since before it was cool, and I…"
full_description = "About Hello, and welcome to my website/blog. In case we haven’t met yet, my name is Bronwen Aker, I have been an Internet professional since before it was cool, and I work in cybersecurity. Before I became a cyber sleuth, however, I worked in web design and development, technical training, and public speaking. My career in cybersecurity began in 2017 when I returned to college full-time to pursue a degree in cybersecurity. Since then, I have achieved a bachelor of science and a master of science, both in cybersecurity. I am also an alum of the 2nd ever SANS CyberTalent Immersion Academy for Women. Courtesy of that program, I possess three GIAC certifications related to different aspects of cybersecurity. While I was in school, I worked as a contractor for a variety of cybersecurity companies, including the SANS Institute and Black Hills Information Security, where I now work full time editing pentest and vulnerability assessment reports and helping with other projects. Other minutiae includes the following: I’m a geek, and have been since long before it was cool. I’m a well-trained human, equally fond of dogs, cats, birds, reptiles, and other critters of various shapes and sizes. I like Star Wars and Star Trek. Of course Han shot first. The Answer is 42. Beer is proof God loves us and wants us to be happy. Scientific method can be applied to anything. There is no such thing as too many books. You can find out more about me by viewing my LinkedIn profile. To contact me, you can send me a note via the Contact page on this website. Cheers! B Updated: 4 July 2024"
year_published = 2025
year_updated = 2024
