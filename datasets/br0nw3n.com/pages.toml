title = "Sanitize Before You Share - Br0nw3n's World"
description = "I hate it when people share links that have tons of tracking codes attached. It's especially annoying when the people doing it work in cybersecurity like I do."
full_description = "CyberSecurity Sanitize Before You Share 15 May 2024 Bronwen I have a peeve. I’ve posted about it before, but people keep doing the same silly things, irritating that nerve, so I’m posting about it again. It’s about how they share links. People almost never clean off the marketing tags, which results in having long, ugly links that include tracking information about the marketing campaign, source, and so on. If you want to see what I’m talking about, you can read my post about how to sanitize URLs, or you can watch the video below of the presentation I gave in 2019 discussing why this is an issue and how to correct for it. Tags: cybersecurity, infosec, Presentation, URL, WWHF Post navigation Why Developers Hate CybersecurityLLMs and Prompt Engineering"
