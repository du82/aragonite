full_description = "Category: MusingsThoughts, musings, opinions, observations, commentary. This is where I fly my politically-incorrect flag. Musings Happy 2025? Pundits love to make New Year predictions. Here are a few of my thoughts, predictions, and reminiscences for 2025. AI Musings Why I Am and Am Not Afraid of AI Generative AI systems like ChatGPT, DALL-E, and Midjourney are good mashing-up what they’ve been fed, but ultimately, they are just tools. Musings Blessed Are the Worker Bees I was recently told that when I referred to some of my coworkers as “worker bees,” they felt it was offensive. Given how our society undervalues ordinary people, I can see how that might be that case for some. Not for me. Musings Memorial Day Musings I am lucky. No one in my immediate family died in military service to our country. Other families are not so lucky. Musings Learn One. Do One. Teach One. Building your skill set can seem overwhelming, but if you can break things down into smaller pieces that you share with others, over time you can not only learn a lot of cool stuff, but also help others along the way. Musings In Memoriam – 9/11 For every generation there is an event so powerful that everyone remembers where they were when it happened. For my generation, it was 9/11. College Stuff Musings About the First Amendment… Perhaps the most often quoted, and most poorly understood, Amendment to the U.S. Constitution is the First Amendment. But what does it really do for us, and why? Musings Let’s Talk About Superpowers… I believe that every person has certain things at which they excel, and I want you to start thinking about and talking about your “superpowers.“ Posts pagination 1 2 … 4 Next"
