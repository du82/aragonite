["https://br0nw3n.com/2018/10/making-a-giac-exam-index"]
title = "Making A GIAC Exam Index - Br0nw3n's World"
description = "Having a good index is critical to getting a decent GIAC exam score. Here are a few thoughts on making yours better."
full_description = "Corey says: 25 March 2024 at 5:05 pm Thanks so much for your great advice here. I still have some questions for you if you don’t mind. 1) You say you have your indices “categorized to three levels”; can you explain what you mean by that? 2) Also, unlike Lesley Carhart, you seem to be saying that you type out a definition of each term and then put them alphabetically in your book. (Let me know if I have that wrong). Boy, it would be nice to see an example. 🙂 3) I assume you make one index for each whole course/exam, rather than an index for each book. (I guess that sounds obvious as I write that out)"
