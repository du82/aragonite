full_description = "AI CyberSecurity LLMs and Prompt Engineering 12 June 2024 Bronwen Last month, over Memorial Day weekend, I attended the LayerOne security conference in Pasadena, California. As in years past, the conference was small, but attended by makers, breakers, and lifelong learners who share a keen interest in hacking and in making the world a safer place. It was a very good time! When the CFP for this year’s con went out, I decided to throw my hat in the ring to give a talk about LLMs and how to craft effective prompts. I have been experimenting with generative AIs ever since I started toying with Midjourney, initially to make featured images for my blog posts here. These days, I still have fun making pretty pictures with Midjourney, but I spend a lot more time with ChatGPT, Copilot, and Claude. Here is the recording of that talk for you to enjoy! And if you want a copy of the slide deck, click here. Tags: AI, ChatGPT, Copilot, LayerOne, LLM, Presentation, Prompt Engineering Post navigation Sanitize Before You ShareChatting Up ChatGPT"
