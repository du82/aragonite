description = "One of the joys of continuing my education is having… err… getting to write a mini-article once a week for my fellow students and instructors. I’ve decided to share some of the better ones here."
full_description = "Category: College StuffOne of the joys of continuing my education is having… err… getting to write a mini-article once a week for my fellow students and instructors. I’ve decided to share some of the better ones here. College Stuff CyberSecurity Phishing Awareness Metrics Phishing simulations are cheap and effective training tools, and the metrics they provide over time can provide clear insights into security awareness throughout an organization. College Stuff CyberSecurity OWASP & The Top 10 The OWASP Top 10 details critical risks associated with web application security and is the defacto standard for web app security. College Stuff CyberSecurity The Dark Side of Cookies Browser cookies are files stored on your computer with information to be used by your web browsers. They aren’t evil on their own, but they can be used for evil. College Stuff Musings About the First Amendment… Perhaps the most often quoted, and most poorly understood, Amendment to the U.S. Constitution is the First Amendment. But what does it really do for us, and why? College Stuff CyberSecurity Good & Bad Aspects of the Internet The Internet is a tool that has dramatically altered how we interact with each other, and not all those changes are for the better. College Stuff Why Does So Much Tech Suck? It isn’t your imagination that your apps and gadgets seem half-baked. They are, and there is a reason why. College Stuff CyberSecurity Manual vs. Automated Tools for Digital Forensic Analysis Highly automated GUI-interface tools are only as good as the programmers who wrote them. Additionally, they can actually prevent users from accessing certain things. College Stuff CyberSecurity System Hardening 101 “Hardening” is a term used by IT professionals to describe various processes used to make computer systems more secure against different kinds of attacks. Posts pagination 1 2 Next"
