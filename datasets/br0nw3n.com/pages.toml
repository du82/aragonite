description = "Rants, raves, ramblings, and reckless randomness…"
full_description = "CyberSecurity References Tips, Tricks, and Traps When Prepping for a GIAC Certification Exam As a SANS Subject Matter Expert, I often get asked for tips on how to pass GIAC certification exams. Here are some tips and tricks I have learned. Musings Happy 2025? Pundits love to make New Year predictions. Here are a few of my thoughts, predictions, and reminiscences for 2025. AI CyberSecurity Chatting Up ChatGPT Check out my webcast all about using ChatGPT and other large language models (LLMs). I cover basics about popular LLMs, tips for using them safely, and how to make prompts to get the best results. AI CyberSecurity LLMs and Prompt Engineering I spoke at this year’s LayerOne conference about how to craft good prompts when working with LLMs like ChatGPT, Copilot, Claude, and Ollama. CyberSecurity Sanitize Before You Share I hate it when people share links that have tons of tracking codes attached. It’s especially annoying when the people doing it work in cybersecurity like I do. CyberSecurity Report Writing Tips Why Developers Hate Cybersecurity Before I switched career paths to work in cybersecurity, I worked primarily as a web developer, but I have also worked on desktop and mobile app projects. Because of this, I have a keen sensitivity for how people on the receiving end of a penetration test report will view the findings. AI Musings Why I Am and Am Not Afraid of AI Generative AI systems like ChatGPT, DALL-E, and Midjourney are good mashing-up what they’ve been fed, but ultimately, they are just tools. Musings Blessed Are the Worker Bees I was recently told that when I referred to some of my coworkers as “worker bees,” they felt it was offensive. Given how our society undervalues ordinary people, I can see how that might be that case for some. Not for me. Musings Memorial Day Musings I am lucky. No one in my immediate family died in military service to our country. Other families are not so lucky. Posts pagination 1 2 … 10 Next"
