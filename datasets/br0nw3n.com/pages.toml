full_description = "Tag: AI WSC Workshop – AI & Machine Learning Women’s Society of Cyberjutsu (WSC) Workshop We’re still working out details, but what we know so far is that it will be a 3-hour workshop introducing attendees to the fundamentals… BSides San Diego – Keeping Things Local – Making Your Own Private LLM Want a private, secure AI assistant without relying on OpenAI, Microsoft, or Anthropic? This hands-on workshop teaches you how to set up, customize, and optimize a local LLM using open-source tools. Step-by-step demos will guide you through installation, fine-tuning, and best practices for efficiency and privacy. Take control of your AI – your data, your rules. 🚀 SCaLE – Keeping Things Local – Making Your Own Private LLM Build your own private ChatGPT. Learn to set up, customize, and optimize a local LLM for secure, efficient, and private use. AI CyberSecurity Chatting Up ChatGPT Check out my webcast all about using ChatGPT and other large language models (LLMs). I cover basics about popular LLMs, tips for using them safely, and how to make prompts to get the best results. AI CyberSecurity LLMs and Prompt Engineering I spoke at this year’s LayerOne conference about how to craft good prompts when working with LLMs like ChatGPT, Copilot, Claude, and Ollama. AI Musings Why I Am and Am Not Afraid of AI Generative AI systems like ChatGPT, DALL-E, and Midjourney are good mashing-up what they’ve been fed, but ultimately, they are just tools."
