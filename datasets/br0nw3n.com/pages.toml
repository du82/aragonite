title = "Privacy Policy - Br0nw3n's World"
description = "Since privacy is (or at least should be) on everyone’s mind, I have finally added an official privacy policy for my website. Given my druthers, I don’t want to keep…"
full_description = "Privacy Policy Since privacy is (or at least should be) on everyone’s mind, I have finally added an official privacy policy for my website. Given my druthers, I don’t want to keep any information about you. Sadly, Google, Gravatar, and other services I use in the care and feeding of this site have other ideas. Who I Am This website is the sole property of Bronwen Aker (me). It exists because I like having a place to post, publish, and otherwise cast out into the Universe my thoughts, scribbles, and random observations. All content posted here was written or created by me unless stated otherwise. The website address is: https://br0nw3n.com. Comments When visitors leave comments on the site we collect the data shown in the comments form, and also the visitor’s IP address and browser user agent string to help spam detection. An anonymized string created from your email address (also called a hash) may be provided to the Gravatar service to see if you are using it. The Gravatar service privacy policy is available here: https://automattic.com/privacy/. After approval of your comment, your profile picture is visible to the public in the context of your comment. If you have other questions or comments you with to share with me, use the contact form. Cookies If you leave a comment on our site you may opt-in to saving your name, email address and website in cookies. These are for your convenience so that you do not have to fill in your details again when you leave another comment. These cookies will last for one year. FWIW, the cookies are created automatically by the system. I do nothing to harvest, read, or analyze the cookies set by the site or by any third-party services implemented therein. Said third-party services will do what they will. I’m not on their privacy committees, so I have no idea what their respective policies or practices may be. Data Retention If you leave a comment, the comment and its metadata are retained indefinitely. This is so we can recognize and approve any follow-up comments automatically instead of holding them in a moderation queue. It also allows me to block spammers and scammers to reduce their impact on my website and its traffic. Where Your Data Is Sent Visitor comments are checked by Akismet, an automated spam detection service. Site traffic analytics are provided by Google. Other features and plugins will have their own respective privacy policies. Like I said above, I don’t want to harvest, scrape, track, or otherwise collect any data about you that might allow me to find you in a crowded room. I use Google Analytics to help me see which posts are more popular and to optimize my site for better performance."
year_published = 2025
year_updated = 2022
