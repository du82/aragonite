description = "Search Engine Optimization (SEO) is one of the “holy grails” of web design. It is also one of the least understood aspects of eCommerce. Because most business people don’t understand…"
full_description = 'SEO Basics Search Engine Optimization (SEO) is one of the “holy grails” of web design. It is also one of the least understood aspects of eCommerce. Because most business people don’t understand the realities of search engine optimization, they often fall prey to scams, charlatans, and flat-out rip-offs. And I’m not just talking about small to medium sized businesses. Bad SEO investments happen at the corporate level all the time, and because corporations have larger budgets they are a more appealing target for tricksters selling snake-oil. To help turn the tide of ignorance I am writing a series of articles to walk you through various aspects of search engine optimization from beginning to end. I recommend you go through these articles in order, starting with basic concepts and gradually working your way up to practical code solutions. New articles are posted Monday morning each week, or as soon thereafter as time allows. And if there are specific questions you want me to address in this series, let me know! Enjoy! ~B~ Content is King for Search Engine Optimization Finding Your Keywords and Phrases Making Web Analytics Work For You Why Text Triumphs in Search Engine Optimization Weaving Your Keywords Into Your Website Use Your HEAD (Tags, that is…) Part I – The TITLE Use Your HEAD, Part II: Meta Tags and Metadata Use Your HEAD, Part III: Meta Tags and HTTP Use Your HEAD, Part IV: Meta Keywords Use Your HEAD, Part V: Meta Description Love Your Body Leave a Reply Cancel replyYour email address will not be published. Required fields are marked *Comment * Name * Email * Website Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() );'
