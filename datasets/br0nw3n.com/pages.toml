full_description = "AI CyberSecurity Chatting Up ChatGPT 18 July 2024 Bronwen I am a staunch devotee of the Feynman Technique when it comes to learning new concepts or skills, so as I have been learning about generative AI (GenAI), it only makes sense that I would want to share what I know with others. Fortunately, Black Hills Information Security (BHIS) makes it easy for me and others who work there to do so! Check out the webcast I gave today all about using ChatGPT and other large language models (LLMs). In it, I cover basic characteristics of some of the most popular LLMs, tips for using them safely and responsibly, and how to make killer prompts to get the best results. Share and Enjoy! 😉 Note: The video above should start at the beginning of the webcast proper. If you want to see the pre-show banter, you will need to rewind a bit. References and Resources LLM Chatbots: ChatGPT: https://chatgpt.com Copilot: https://copilot.microsoft.com/ Claude: https://www.anthropic.com/claude, https://claude.ai/ Getting started with LLM prompt engineering https://learn.microsoft.com/en-us/shows/generative-ai-for-beginners/understanding-prompt-engineering-fundamentals-generative-ai-for-beginners OpenAI Documentation https://platform.openai.com/docs/guides/prompt-engineering/prompt-engineering https://platform.openai.com/docs/examples Network Chuck https://www.youtube.com/@NetworkChuck Tools to Run LLMs Locally Ollama: https://github.com/ollama LM Studio: https://lmstudio.ai Other Fun Toys! Fabric: https://github.com/danielmiessler/fabric Sudowrite: https://www.sudowrite.com/ Lore Machine: https://www.loremachine.world CVE Summary Generator: https://chatgpt.com/g/g-onTQ6sF4i-cve-summary-generator Tags: AI, ChatGPT, Generative AI, LLM, Prompt Engineering, Webcast Post navigation LLMs and Prompt EngineeringHappy 2025?"
