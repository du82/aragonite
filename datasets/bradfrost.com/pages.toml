full_description = "Why, hello there. Why, hello there! Thanks for getting in touch. I’m a design system consultant and help organizations design at scale, establish and evolve design system architecture & process, adopt new technologies, and improve collaboration. If you are interested in working together, shoot me an email at brad@bradfrost.com. If you’d like me to speak at your conference, do a design systems training workshop at your company, have questions regarding your Atomic Design book order, or have industry questions you’d like answered, feel free to email me at brad@bradfrost.com. You can also read my frequently asked questions page first to see if I’ve already answered the question. And if you want to find me elsewhere on the web, here’s where I hang out: Bluesky RIP Twitter! I jumped over here to continue sharing knowledge, connecting, and making stupid jokes. LinkedIn My go-to professional network for getting spammed by recruiters. Mastodon Where I share thoughts about web development and other stuff. Threads Yet-another social network, but skews on the side of funny stuff. I'm here for it! YouTube Where I post videos of me drumming, playing music, sharing thoughts, and life. Spotify What I'm currently listening to. Github Where I share open source code with everybody. Codepen Where I share code ideas, sketches, and patterns. Instagram Sharing family life, French bulldogs, music, and adventures. Last.fm My old friend that faithfully captures my music-listening habits."
