title = "Workshops | Brad Frost"
description = "I cover all that goes into creating successful design systems, from high-level strategy all the way down to the nitty gritty design and development details. I tackle thorny areas like buy-in, architecture, documentation, team structure, workflow, governance, and a whole lot more."
full_description = "Design System Workshops & Training I offer full-day and multi-day workshops about anything and everything that goes into creating successful design systems. I collaborate with my clients to learn what specific challenges they're facing and design custom workshop agendas to help the team succeed. The topics I cover help teams make great Web experiences and set organizations up for long-term success. Here are some of the areas where I can help: Design Systems I cover all that goes into creating successful design systems, from high-level strategy all the way down to the nitty gritty design and development details. I tackle thorny areas like buy-in, architecture, documentation, team structure, workflow, governance, and a whole lot more. Atomic Design Atomic design is a methodology for creating robust design systems that power real product experiences. I introduce the methodology and show how to practically implement atomic design to both create realistic systems and increase design system adoption in product experiences. Design tokens Design tokens are a critical ingredient of a design system ecosystem and unlocks themeable design systems that can power a multi-product, multi-brand, multi-platform, multi-generation, multi-All-The-Things organization. Design System Adoption Design systems must be used by products In order for them to be successful. I help clients increase design system adoption by helping them define their design system ecosystem, helping plan and work through pilot projects, and describing the end-to-end experience of getting design systems to power real product experiences. Designer/Developer Collaboration Cross-disciplinary collaboration is critical to product success, and unfortunately that collaboration can be evasive. I help organizations establish pragmatic, actionable strategies and workflows to get designers and developers collaborating a lot more closely. Front-of-the-front-end Development I work with teams to level up their front-end skills. I work with teams on topics like Web Components, accessibility, CSS architecture, component architecture, API design, change management, and more. Who I've Worked With From Fortune 500 companies to scrappy startups, I've had the pleasure of conducting workshops with some fantastic companies across a variety of industries. Here's just some of the companies I've worked with: Caterpillar Netflix Cigna Walmart Prudential J.Crew Etsy Capital One MailChimp About.com HP Warby Parker United Airlines Marriott Groupon Fidelity Santander Bank ING AOL Time Inc. Abercrombie & Fitch Condé Nast A+E Arthrex Desigual And More! Brad ran a fantastic two-day workshop with our team and struck the perfect balance between design and engineering. His thoughtful and pragmatic approach really resonated with us. Chris Saint-Amant, Manager, UI Engineering at Netflix Brad's workshops and presentations kick started several initiatives that we will be working on in the coming months. Brad is an excellent communicator of both the strategic benefits of atomic design and the practical implementation of it. I would definitely recommend any business looking to take their web experiences to the next level, to have a chat with Brad. Aleksander Hakestad, Sales Director B2C at Santander Consumer Bank Brad’s design system workshop helped inform, inspire, and enabled us to create working, tangible deliverables with next steps for our highly cross-functional organization. We were impressed by Brad’s focus on people, culture, and process that he brought to the sessions. The tools are very important, but we often jump straight to them. Immediately after the workshop, our designers and developers were truly collaborating—proactively carving out time to work together on something they were passionate about, that also benefits our business. Ben Ramsey, Experience Design Manager at Abercrombie & Fitch Our organization is very siloed and there is not a lot of collaboration between design and engineering. I felt having Brad speak to our group gave us a common vocabulary as well as give us some motivation and direction. It was definitely worth the investment, and Brad really went above and beyond what we expected from him. Mike Aparicio, User Interface Engineer at Groupon If you're into design systems, I can't recommend enough Brad Frost's workshop. It was a game changer for us as an organisation and a privilege for me as a professional Marc-André Boivin, UX/UI at Vanderlande Sound good? Let's talk. Interested in having me in for a workshop at your organization or conference? Email me at brad@bradfrost.com and let's chat! Get in touch"
