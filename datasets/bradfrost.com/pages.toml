was just released with support for Web Components! React 19 adds full support for custom elements and passes all tests on Custom Elements Everywhere. In past versions, using Custom Elements in React has been difficult because React treated […] 05 Dec, 2024 My Sketch – OpenProcessing Beautiful. 01 Dec, 2024 Come to Pittsburgh Plays The Cure! FRIENDS! FAMILY! COUNTRYMEN! On Saturday, December 14th I’ll be performing as part of Pittsburgh Plays The Cure at the beautiful Roxian Theatre. Several super groups comprised of Pittsburgh-based musicians will be playing a whole night of music by The Cure. […] 30 Nov, 2024 kirby vs. this blog post kirby vs. this blog post is an incredible piece of web design. Well done. 27 Nov, 2024 Ella’s First Website ULTRA PROUD DAD MOMENT: Ella made her first website! Melissa and I woke up on Saturday morning to our goofy 6-year-old daughter entering our bedroom making this obnoxious sound. It was impressively annoying, especially considering she hasn’t seen Dumb and […] 26 Nov, 2024 My ADHD diagnosis process I recently shared that I was diagnosed with ADHD. I write these words 12 days into medication and holy shit I feel totally transformed. The stuck, scrambly feelings and frustration have nearly evaporated. I am firing on all cylinders, which […] Older posts Newer posts Search the blog"
