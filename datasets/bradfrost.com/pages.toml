full_description = "About Brad Frost Brad Frost is a design system consultant, web designer & developer, speaker, writer, teacher, musician, and artist located in beautiful Pittsburgh, PA. He helps people establish & evolve design systems, establish more collaborative workflows, and design & build software together. He is the author of the book Atomic Design, which introduces a methodology to create and maintain effective design systems. He co-hosted the Style Guides Podcast and has helped create several tools and resources for web designers, including Pattern Lab, Styleguides.io, This Is Responsive, Death to Bullshit, and more. Here’s Brad’s official photo: Bluesky RIP Twitter! I jumped over here to continue sharing knowledge, connecting, and making stupid jokes. LinkedIn My go-to professional network for getting spammed by recruiters. Mastodon Where I share thoughts about web development and other stuff. Threads Yet-another social network, but skews on the side of funny stuff. I'm here for it! YouTube Where I post videos of me drumming, playing music, sharing thoughts, and life. Spotify What I'm currently listening to. Github Where I share open source code with everybody. Codepen Where I share code ideas, sketches, and patterns. Instagram Sharing family life, French bulldogs, music, and adventures. Last.fm My old friend that faithfully captures my music-listening habits."
