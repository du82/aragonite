full_description = "Every month, I spend hundreds of hours and thousands of dollars keeping The Marginalian going. For nearly two decades, it has remained free and ad-free and alive thanks to patronage from readers. I have no staff, no interns, not even an assistant — a thoroughly one-woman labor of love that is also my life and my livelihood. If this labor makes your own life more livable in any way, please consider aiding its sustenance with a one-time or loyal donation. Your support makes all the difference. MONTHLY DONATION ♥ $3 / month ♥ $5 / month ♥ $7 / month ♥ $10 / month ♥ $25 / month START NOW ONE-TIME DONATION You can also become a spontaneous supporter with a one-time donation in any amount: GIVE NOW BITCOIN DONATION Partial to Bitcoin? You can beam some bit-love my way: 197usDS6AsL9wDKxtGM6xaWjmR5ejgqem7 Need to cancel a recurring donation? Go here. Archives browse by subjectculturebooksartpsychologyphilosophysciencehistorydesignillustrationchildren's booksall subjects surprise me books etc.An Almanac of Birds: Divinations for Uncertain DaysThe Universe in Verse BookFiguringThe Snail with the Right Heart: A True StoryA Velocity of Being Sunday newsletter If you yearn for depth and delight without the distraction of a social media feed, try the Marginalian Sunday newsletter, free and ad-free since 2006 — the week’s most inspiring and nourishing reads, in a single undistracted place. (Here is an example.) midweek newsletter Also: Because The Marginalian is well into its second decade and because I write primarily about ideas of timeless nourishment, each Wednesday I dive into the archive and resurface from among the thousands of essays one worth resavoring. Subscribe to this free midweek oasis of sanity and sustenance below — it is separate from the standard Sunday digest of new essays: ABOUT CONTACT SUPPORT SUBSCRIBE Newsletter RSS CONNECT Facebook Twitter Instagram Tumblr Favorite Reads18 Life-Learnings from 18 Years of The MarginalianLove AnywayThe Dictionary of Obscure Sorrows: Uncommonly Lovely Invented Words for What We Feel but Cannot NameHannah Arendt on Love and How to Live with the Fundamental Fear of LossHow Kepler Invented Science Fiction and Defended His Mother in a Witchcraft Trial While Revolutionizing Our Understanding of the UniverseThe Writing of “Silent Spring”: Rachel Carson and the Culture-Shifting Courage to Speak Inconvenient Truth to PowerEmily Dickinson’s Electric Love Letters to Susan GilbertTrial, Triumph, and the Art of the Possible: The Remarkable Story Behind Beethoven’s “Ode to Joy”Resolutions for a Life Worth Living: Attainable Aspirations Inspired by Great Humans of the PastThe Courage to Be Yourself: E.E. Cummings on Art, Life, and Being Unafraid to FeelSingularity: Marie Howe’s Ode to Stephen Hawking, Our Cosmic Belonging, and the Meaning of Home, in a Stunning Animated Short FilmFixed vs. Growth: The Two Basic Mindsets That Shape Our LivesA Stoic’s Key to Peace of Mind: Seneca on the Antidote to AnxietyA Rap on Race: Margaret Mead and James Baldwin’s Rare Conversation on Forgiveness and the Difference Between Guilt and ResponsibilityThe Science of Stress and How Our Emotions Affect Our Susceptibility to Burnout and DiseaseMary Oliver on What Attention Really Means and Her Moving Elegy for Her Soul Matesee more we are alive The Souls of Animals By Maria Popova “They do not sweat and whine about their condition,” Walt Whitman wrote of the other animals, “they do not lie awake in the dark and weep for their sins, they do not make me sick discussing their duty to God, not one is dissatisfied, not one is demented with the mania of owning things.” Here was “the poet of the body and the poet of the soul” holding up a mirror to us creatures inhabiting an animal body complicated by a soul — that organ of want and worry which we ourselves invented to explain why we make art, why we fall in love, why we yearn to converse with reality in prayers and postulates. It is daring enough to ask what a soul actually is. Carl Jung knew that it defies the substance we are made of: “The soul is partly in eternity and partly in time.” Virginia Woolf knew that it defies our best technology of thought: “One can’t write directly about the soul. Looked at, it vanishes.” It is doubly daring to question the age-old dogma that the soul is the province of the human animal alone. Even as we have incrementally and reluctantly admitted other creatures into the temple of consciousness, we have denied them souls — denied them, because our tools of communication and computation have failed to probe it, an inner life capable of imagination and play, of love and grief, of dreams and wonder. And yet our very language defies our denial: the word animal comes from the Latin for soul. Art by Jackie Morris from The Lost Words by Robert Macfarlane In 1991, long before we came to consider the soul of an octopus, long before fMRI and EEG studies revealed not only that birds dream but what they dream about, Gary Kowalski took up this daring question in The Souls of Animals (public library) — an inquiry into the “spiritual lives” (and into what that means) of whooping cranes, elephants, jackdaws, gorillas, songbirds, horses, dogs, and cats. At its center is the idea that spirituality — which he defines as “the development of a moral sense, the appreciation of beauty, the capacity for creativity, and the awareness of one’s self within a larger universe as well as a sense of mystery and wonder about it all” — is a natural byproduct of “the biological order and in the ecology shared by all life.” (There are in this view echoes of Kepler, who believed that the Earth itself is an ensouled body, and of myriad native cosmogonies that regard other animals as sources of more-than-human wisdom and emissaries of the numinous.) Kowalski — a parish minister by vocation, who spends his days praying with the dying, blessing bonds of love, and helping people navigate moral quandaries — celebrates the soul as “the magic of life,” as that which “gives life its sublimity and grandeur,” and reflects: For ancient peoples, the soul was located in the breath or the blood. For me, soul resides at the point where our lives intersect with the timeless, in our love of goodness, our passion for beauty, our quest for meaning and truth. In asking whether animals have souls, we are inquiring whether they share in the qualities that make life more than a mere struggle for survival, endowing existence with dignity and élan. […] Many people think of soul as the element of personality that survives bodily death, but for me it refers to something much more down-to-earth. Soul is the marrow of our existence as sentient, sensitive beings. It’s soul that’s revealed in great works of art, and soul that’s lifted up in awe when we stand in silence under a night sky burning with billions of stars. When we speak of a soulful piece of music, we mean one that comes out of infinite depths of feeling. When we speak of the soul of a nation, we mean its capacity for valor and visionary change… Soul is present wherever our lives intersect the dimension of the holy: in moments of intimacy, in flights of fancy, and in rituals that hallow the evanescent events of our lives with enduring significance. Soul is what makes each of our lives a microcosm — not merely a meaningless fragment of the universe, but at some level a reflection of the whole. Half a century after Henry Beston insisted that “we need another and a wiser and perhaps a more mystical concept of animals,” for they are “gifted with extensions of the senses we have lost or never attained, living by voices we shall never hear,” Kowalski writes: Without anthropomorphizing our nonhuman relations we can acknowledge that animals share many human characteristics. They have individual likes and dislikes, moods and mannerisms, and possess their own integrity, which suffers when not respected. They play and are curious about their world. They develop friendships and sometimes risk their own lives to help others. They have “animal faith,” a spontaneity and directness that can be most refreshing… all the traits indicative of soul. For soul is not something we can see or measure. We can observe only its outward manifestations: in tears and laughter, in courage and heroism, in generosity and forgiveness. Soul is what’s behind-the-scenes in the tough and tender moments when we are most intensely and grippingly alive. By investigating the inner lives of other creatures, Kowalski argues, we are invariably deepening our own: As [modern] shamans, we are allowed to examine enigmas like “What makes us human?” and “What makes life sacred?” We can ask not only about the mating behavior and survival strategies of other animals but whether they have souls and spirits like our own. The danger here is that we are often in over our heads. But at least we are swimming in deep water and out of the shallows. In searching for answers to such queries, I have found, we not only enrich our understanding of other creatures, we also gain insight into ourselves. […] There is an inwardness in other living beings that awakens what is innermost in ourselves. I have often marveled, for instance, watching a flock of shore birds. On an invisible cue, they simultaneously rise off the beach and into the air, then turn and bank seawards in tight formation. They are so finely coordinated and attuned in their aeronautics it is as though they share a common thought, or even a group mind, guiding their ascent. At such moments, I feel there are depths of “inner space” in nature that can never be sounded. And it is out of those same depths, in me, that awe arises as I contemplate the synchronicity of their flight. To contain such depths is to participate in the realm of spirit. We have invented no greater expression of our inwardness than music — the language of the soul, with its eternal translation between mathematics and mystery. We know that other animals partake of that language — each spring birds sing the world back to life, each summer cicadas serenade the sun with their living mandolin, and when we set out to tell the cosmos who we are, a whale song joined Bulgarian folk music and Bach on The Golden Record. Art by Sophie Blackall from If You Come to Earth Birds, Kowalski observes, sing for reasons beyond the pragmatic — their song is “far from a mechanical performance” and “much more complex than a simple cry of self-assertion.” It is music, which is distinguished from noise by an organizing principle of creative intent, and creativity may be the purest evidence of soul. Kowalski writes: Surprisingly, many birds are relatively insensitive to pitch. But the best singers employ all the elements of tone, interval, rhythm, theme, and variation in complex and highly pleasing combinations. And what is music if not the deliberate arrangement of sound in aesthetic patterns? Greatly influenced by philosopher Martin Buber’s I-Thou model of relating, Kowalski admonishes against relying on our own frames of reference in assaying what other creatures are expressing and how it is being expressed: The tempo of life is faster-paced for birds than for people. This is one of the reasons the individual notes in bird song are so short, sometimes distinguishable only with a spectrograph, and why the compositions of birds last a few seconds at most, compared to an hour or more for a human symphony. It is also why birds sing in the upper registers (just as the pitch on a phonograph record rises when played at high speed). To the birds, with a metabolism continually in allegro, human beings must appear to be lazy and dim-brained creatures indeed. Just as our music reflects the rhythm and intensity of our inner life, the music of birds expresses the flash and flutter of their nervous and high-strung existence. Examining another subset of the creative impulse — visual art — Kowalski cites Desmond Morris’s famous 1950s studies, which found that non-human primates given pens and paints not only became adept at using them with “a distinct feel for symmetry and balance,” but developed individual styles of drawing. He considers what that indicates: Art arises from a spiritual longing that all people share: to make our mark on the world and to spend our life energy in a work that rises above the mundane, adding grace to existence. We respond to the light of the world around us by giving expression to our own inner light, and when the two are on the same wavelength, the world seems more brilliant and finely focused. Insisting that such spiritual longings do not belong to human beings alone, he cites an astonishing case study: In 1982 Jerome Witkin, a professor of art at Syracuse University and a respected authority on abstract expressionism, was invited to view a collection of drawings by a “mystery artist.” The professor was busy at the time, preparing for a traveling exhibition. Nevertheless, he was sufficiently intrigued to accept the invitation. “These drawings are very lyrical, very, very beautiful,” the professor said when he saw the portfolio. “They are so positive and affirmative and tense, the energy is so compact and controlled, it’s just incredible.” “This piece is so graceful, so delicate,” he said of one drawing. “I can’t get most of my students to fill a page like this.” Only after he had finished his professional evaluation did Witkin learn the identity of the artist: a fourteen-year-old, 8,400-pound Asian elephant named Siri who lived in Syracuse’s Burnet Park Zoo. Siri’s keeper, David Gucwa, had seen her tracing lines with sticks and stones in the dust of her cage. Against the wishes of the zoo’s superintendent, who scoffed at the notion of an artistic elephant, Gucwa had given her pads of paper and charcoal, permitting her to express herself more freely. When Witkin showed Siri’s drawings to a colleague without context — an expert on children’s drawings charing the university’s art education department — she firmly concluded that they were not done by a child. Witkin himself readily likened them to the work of Willem de Kooning, wishing the painter himself could see Siri’s art. It was this report of Siri that inspired May Sarton — one of my favorite poets and favorite thinkers — to reimagine these reckonings in a poem. (The footnote of credit in Sarton’s collection is how I discovered Kowalski’s book.) THE ARTIST by May Sarton The drawings were abstract, Delicate, Like Japanese calligraphy. When the painter de Kooning Was shown them, he said, “Interesting. Not done by a child, I think, Or if so, an extraordinary child.” “The artist is an elephant, Sir, Named Siri.” It had once come about That the keeper noticed Her sensitive trunk Drawing designs in the dust. After an argument With the head of the zoo Who laughed at him, The keeper himself Brought large sheets of paper And boxes of charcoal And laid them at Siri’s feet. For an hour at a time In happy concentration The elephant creat"
