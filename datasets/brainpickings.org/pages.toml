full_description = "Every month, I spend hundreds of hours and thousands of dollars keeping The Marginalian going. For nearly two decades, it has remained free and ad-free and alive thanks to patronage from readers. I have no staff, no interns, not even an assistant — a thoroughly one-woman labor of love that is also my life and my livelihood. If this labor makes your own life more livable in any way, please consider aiding its sustenance with a one-time or loyal donation. Your support makes all the difference. MONTHLY DONATION ♥ $3 / month ♥ $5 / month ♥ $7 / month ♥ $10 / month ♥ $25 / month START NOW ONE-TIME DONATION You can also become a spontaneous supporter with a one-time donation in any amount: GIVE NOW BITCOIN DONATION Partial to Bitcoin? You can beam some bit-love my way: 197usDS6AsL9wDKxtGM6xaWjmR5ejgqem7 Need to cancel a recurring donation? Go here. Archives browse by subjectculturebooksartpsychologyphilosophysciencehistorydesignillustrationchildren's booksall subjects surprise me books etc.An Almanac of Birds: Divinations for Uncertain DaysThe Universe in Verse BookFiguringThe Snail with the Right Heart: A True StoryA Velocity of Being Sunday newsletter If you yearn for depth and delight without the distraction of a social media feed, try the Marginalian Sunday newsletter, free and ad-free since 2006 — the week’s most inspiring and nourishing reads, in a single undistracted place. (Here is an example.) midweek newsletter Also: Because The Marginalian is well into its second decade and because I write primarily about ideas of timeless nourishment, each Wednesday I dive into the archive and resurface from among the thousands of essays one worth resavoring. Subscribe to this free midweek oasis of sanity and sustenance below — it is separate from the standard Sunday digest of new essays: ABOUT CONTACT SUPPORT SUBSCRIBE Newsletter RSS CONNECT Facebook Twitter Instagram Tumblr Favorite Reads18 Life-Learnings from 18 Years of The MarginalianLove AnywayThe Dictionary of Obscure Sorrows: Uncommonly Lovely Invented Words for What We Feel but Cannot NameHannah Arendt on Love and How to Live with the Fundamental Fear of LossHow Kepler Invented Science Fiction and Defended His Mother in a Witchcraft Trial While Revolutionizing Our Understanding of the UniverseThe Writing of “Silent Spring”: Rachel Carson and the Culture-Shifting Courage to Speak Inconvenient Truth to PowerEmily Dickinson’s Electric Love Letters to Susan GilbertTrial, Triumph, and the Art of the Possible: The Remarkable Story Behind Beethoven’s “Ode to Joy”Resolutions for a Life Worth Living: Attainable Aspirations Inspired by Great Humans of the PastThe Courage to Be Yourself: E.E. Cummings on Art, Life, and Being Unafraid to FeelSingularity: Marie Howe’s Ode to Stephen Hawking, Our Cosmic Belonging, and the Meaning of Home, in a Stunning Animated Short FilmFixed vs. Growth: The Two Basic Mindsets That Shape Our LivesA Stoic’s Key to Peace of Mind: Seneca on the Antidote to AnxietyA Rap on Race: Margaret Mead and James Baldwin’s Rare Conversation on Forgiveness and the Difference Between Guilt and ResponsibilityThe Science of Stress and How Our Emotions Affect Our Susceptibility to Burnout and DiseaseMary Oliver on What Attention Really Means and Her Moving Elegy for Her Soul Matesee more we are alive about Photograph by Allan Amato. Hello. My name is Maria Popova and The Marginalian is a record of my reading and reckoning with our search for meaning: sometimes through science and philosophy, sometimes through poetry and children’s books, always through the lens of wonder. Founded in 2006 as an email to seven friends under the outgrown name Brain Pickings and since included in the Library of Congress permanent web archive of culturally valuable materials, it remains a one-woman labor of love animated by the ultimate question that binds us all: What is all this? I am also the creator of The Universe in Verse, the author of a very long, very yellow book titled Figuring and a very slender, very colorful book titled The Snail with the Right Heart, the editor of an eight-year labor titled A Velocity of Being: Letters to a Young Reader, and a past-life contributor to The New York Times, Wired, The Atlantic, and other editorial exoplanets. For more about the ethos and the human behind this labor of love, here are some reflections on my most important life-learnings from the first seventeen years of this experiment in living, some answers to The New York Times’ “By the Book” questionnaire, and an On Being conversation with the wonderful and generous Krista Tippett: The Marginalian has remained free and ad-free and alive thanks to patronage from readers. I have no staff, no interns, no assistant — a thoroughly solitary labor of love that is also my life and my livelihood. If you are new here, welcome. Here are some of my favorite pieces from the years, to give you a sense of scope and sensibility: Hannah Arendt on Love and How to Live with the Fundamental Fear of Loss The Writing of “Silent Spring”: Rachel Carson and the Culture-Shifting Courage to Speak Inconvenient Truth to Power Kinship: Ursula K. Le Guin’s Love Poem to Trees, the Interleaving of Life and Death, and the Eternal Flame of Being Kahlil Gibran on Silence, Solitude, and the Courage to Know Yourself James Baldwin on Love, the Illusion of Choice, and the Paradox of Freedom Yes to Life, in Spite of Everything: Viktor Frankl’s Lost Lectures on Moving Beyond Optimism and Pessimism to Find the Deepest Source of Meaning Big Wolf & Little Wolf: A Tender Tale of Loneliness, Belonging, and How Friendship Transforms Us A Stoic’s Key to Peace of Mind: Seneca on the Antidote to Anxiety Zadie Smith on Optimism and Despair How Kepler Invented Science Fiction and Defended His Mother in a Witchcraft Trial While Revolutionizing Our Understanding of the Universe The Blue Hour: A Stunning Illustrated Celebration of Nature’s Rarest Color The Healing Power of Gardens: Oliver Sacks on the Psychological and Physiological Consolations of Nature Toni Morrison on the Body as an Instrument of Joy, Sanity, and Self-Love Telling Is Listening: Ursula K. Le Guin on the Magic of Real Human Conversation The Truelove: Poet and Philosopher David Whyte on Reaching Beyond Our Limiting Beliefs About What We Deserve Susan Sontag on Storytelling, What It Means to Be a Moral Human Being, and Her Advice to Writers Of Trees, Tenderness, and the Moon: Hasui Kawase’s Stunning Japanese Woodblock Prints from the 1920s-1950s How (Not) to Love: Breaking Our Patterns to Unbreak Our Hearts, or, Chekhov’s Insight into the Most Disquieting and Liberating Truth about Love Patti Smith on Time, Transformation, and How the Radiance of Love Redeems the Rupture of Loss The Good Luck of Your Bad Luck: Marcus Aurelius on the Stoic Strategy for Weathering Life’s Waves and Turning Suffering into Strength Einstein’s Dreams: Physicist Alan Lightman’s Poetic Exploration of Time and the Antidote to the Anxiety of Aliveness The Pattern Inside the Pattern: Fractals, the Hidden Order Beneath Chaos, and the Story of the Refugee Who Revolutionized the Mathematics of Reality Emily Dickinson’s Electric Love Letters to Susan Gilbert PRINT ARTICLE EMAIL ARTICLE donating = loving Every month, I spend hundreds of hours and thousands of dollars keeping The Marginalian going. For nearly two decades, it has remained free and ad-free and alive thanks to patronage from readers. I have no staff, no interns, not even an assistant — a thoroughly one-woman labor of love that is also my life and my livelihood. If this labor makes your own life more livable in any way, please consider aiding its sustenance with a one-time or loyal donation. Your support makes all the difference. Monthly donation ♥ $3 / month ♥ $5 / month ♥ $7 / month ♥ $10 / month ♥ $25 / month START NOW One-time donation You can also become a spontaneous supporter with a one-time donation in any amount: GIVE NOW BITCOIN DONATION Partial to Bitcoin? You can beam some bit-love my way: 197usDS6AsL9wDKxtGM6xaWjmR5ejgqem7 CANCEL MONTHLY SUPPORT Need to cancel an existing donation? (It's okay — life changes course. I treasure your kindness and appreciate your support for as long as it lasted.) You can do so on this page. sunday newsletter If you yearn for depth and delight without the distraction of a social media feed, try the Marginalian Sunday newsletter, free and ad-free since 2006 — the week’s most inspiring and nourishing reads, in a single undistracted place. (Here is an example.) midweek newsletter Also: Because The Marginalian is well into its second decade and because I write primarily about ideas of timeless nourishment, each Wednesday I dive into the archive and resurface from among the thousands of essays one worth resavoring. Subscribe to this free midweek oasis of sanity and sustenance below — it is separate from the standard Sunday digest of new essays: View Full Site"
