full_description = '''If your habits don't line up with your dream, then you need to either change your habits or change your dream ― John C. MaxwellLike college students amid their first bad hangover, we swear we’ll never, ever wait to cram at the last moment again. It's the perennial complaint of students everywhere: “...if only I’d started studying sooner, then I wouldn’t be in this mess!”Well, I have good news for you. Studying effectively doesn't have to be hard! The secret is building strong study habits.Habits are grooves carved into your brain’s neural network that eventually become hard-wired, like tracks for a train to run on. Once studying becomes a habit, instead of your brain trudging along muddy hillocky paths, pushing aside thorny bushes, and stepping in cowpats, you glide along smooth rails, getting your study done easily so you can go out and play.Studies have shown that once an action becomes habitual it takes far less effort for your brain to accomplish it. (Which would FINALLY help you keep your New Year's resolutions!)Sounds great, right? Well, it is great. Once you’ve made studying daily a rock-solid habit, you’ll reap the rewards. Daily practice plays to your memory’s strengths, so you’ll be able to get knowledge solidly into your brain with less effort.However, there are a series of enemies blocking your path: (1) social expectations, aka FOMO; (2) the desire to save brainpower; (3) procrastination; and (4) instant gratification.If you want to become a study master and cruise smoothly through each study session, you will need to disarm these enemies and use their weapons against them. We've given you 11 tips on how to do that:Anchor new habits to old onesStart one micro-habit at a timeKeep the chain goingBribe yourself to studyDiscover your best time to studyUse peer pressure to study betterCombat the forces of FOMOBe unapologetic about studyingGive yourself consequencesSort out your study environmentThe hidden benefits of daily study habitsAre you ready to enter the dojo and build strong daily study habits? Then welcome, young padawan. It’s time to learn the ways of the study master.Psst. Improve your mental and physical well-being with these small life-changing habits that take ZERO time! Also, did you know you can use the Brainscape app to achieve your personal growth goals—like improving your health, wealth, mindset, emotional intelligence, etc.? 1. The enemies of good study habitsThe secret to improving study motivation and building good study habits is to realize it’s a game of two halves—you must play both offense and defense. This means you need to both defend against distractions and set your mind to do the work. Think of your brain as a sort of council. There is more than one politician in Congress, and not all of them have your long-term interests at heart. Sometimes the long-term planner (the frontal cortex) wins the vote, and you go and do things that are hard but will give you rewards later. Many other times, however, the more ancient, less evolved parts of your brain win the day. This is when the lizard brain or limbic system takes over. These areas respond well to crises—but when there’s no emergency, they seek pleasure. This is the part that’s in control when, instead of studying, you do whatever is easy and rewards you straight away. Think watching Netflix, playing beer pong, napping, surfing the net, shopping, or eating ice cream. The issue is that for most people, their frontal cortex has a minority government; It doesn’t have all that much pull. And both inside and outside the brain, the forces arrayed against it are multitudinous.So now, you’re about to learn which obstacles are in the way of building your study habits and how to defeat them. Let’s get started ...1.1. Social expectations, aka FOMOThis one is huge, especially if you’re engaged in campus life. The pull to skip studying and do fun things with your friends can be really strong. Continually resisting temptation puts a heavy load on your willpower. Many of the best-laid study plans are derailed by some random invitation that spirals into a whole day of distraction. Socializing is important. But there’s a way to prioritize your study so it gets done, and you can still have guilt-free outings with your friends.1.2. The desire to save brainpowerThe brain is an energy-hungry organ. It’s only 2% of your body weight, but even when you’re resting, it demands 20% of your energy. Thinking, studying, learning—all of these take up brain space. Normally, we prefer to conserve this energy, so it’s a natural thing for us to avoid tasks that are going to exhaust us mentally. This is why you need systems to get you through the hardest part: actually sitting down to study. Because this avoidance of spending brain energy leads to procrastination!1.3. ProcrastinationA test that’s weeks or months away doesn’t feel urgent. As the test looms closer, however, it’s amazing how many people end up with spotlessly clean kitchens, perfectly ordered sock drawers, and crisply cut lawns. This is a wonderful tactic to feel productive even when you have far more important things to do. What’s at work here is a phenomenon called delay discounting. Researchers have found that humans prefer a small reward delivered in the near future over a larger reward they have to wait for. It’s a variation on avoiding delayed gratification. The ancient parts of your brain HATE spending valuable brain energy on things that are not either a clear and present danger or a pleasurable escape. Back in the days when we were part of the food chain, humans needed their brains to stay focused on urgent problems, like staying alive. Precious brain juice wasn’t spent on contemplating why apples fell off trees or other non-urgent problems. This urge to prioritize only urgent tasks is still very much alive in us all. Our brains are very skilled at bringing up seemingly urgent tasks to do instead of hard mental work. Hence the emergence of the spotless fridge and ironed boxer shorts during study week.1.4. Instant gratificationAs mentioned before the ancient, emotion-driven limbic system in our brains craves instant rewards. In the 1960s, a Stanford professor named Walter Mischel conducted a series of experiments designed to test four-year-old children to their furthest limits.Mischel put a marshmallow on a table in front of a kid and said they could eat the marshmallow now. Or they could eat two marshmallows if they didn’t eat the marshmallow while he left the room. Mischel then left the room, leaving a marshmallow sitting in front of a deeply conflicted four-year-old.This now-famous test became known as the Marshmallow Experiment. While tormenting children for science was entertaining (some children had to scoot their chairs over to the corner, face the wall, and sit on their hands to avoid eating the marshmallow) what was most interesting was the aftermath. For the next forty years, Mischel followed his participants’ lives. He and other researchers found that the kids who passed the Marshmallow Experiment and could delay gratification had higher SAT scores, better health, and happier relationships. It turns out that the ability to delay gratification is a key part of living a good life. Those who will do something hard to experience rewards not now, but in the future, succeed in their endeavors. The issue here is that you’re not a four-year-old child who has to wait five minutes for two marshmallows. (Although to be fair, when you’re four years old, five minutes is a lifetime.)Navigating life when you’re a student or working means constant pressure from conflicting obligations. You’ll have to make myriad decisions throughout each day. You’ll be resisting temptations, juggling priorities, and managing your energy. Each time you put off something easy to do something hard, you’re using your willpower. It turns out that willpower is a limited resource and gets exhausted the more you use it.That’s why if you try to study daily on an ad hoc basis, it’s much more likely to not get done. Then you end up like everyone else: only studying when a test is looming closer, under the tyranny of an impending deadline. Cramming is an ineffective way to study, which is why (as you’ll find out soon) distraction is an enemy you will need to vanquish to build strong study habits.2. Strong study habit tips to defeat your enemiesAs you may have figured out by now, the phrase "strong study habits" is synonymous with "developing the willpower to do a little bit of work every day because the alternative – cramming – is less effective and even more time-consuming in the long run."The importance of this realization cannot be underestimated. You can even think of habit formation in terms of this popular mathematical equation: In other words, doing just a little bit of extra effort every day (no exceptions!) for an entire year will exponentially increase your performance, while slacking off every day will erode your performance or knowledge toward nearly zero, such that you have to start again from scratch (e.g. "cramming") at the last minute.The good news is that you can fundamentally hack your brain to develop these consistent daily study habits to the point that they become almost effortless. Below is our list of various forms of mental jiu-jitsu that can help you turn study foes’ weapons against them.[Try this hack: 'How the benefits of cold showers can change your life']Tip 1. Anchor new habits to old onesAs we mentioned above, our brains don’t like to expend lots of energy on hard mental work. But when something becomes a habit, it doesn’t take energy or willpower; you do the thing on autopilot.The easiest way to make a new habit is to tie it into an existing habit that is already established (otherwise known as an anchor habit.) For example, if you study better in the morning, then bring out your notes and do your study session while you have your first coffee of the day. The first coffee is your anchor habit, and study is the new habit you’re attaching to it. Quite quickly, you’ll see that studying also becomes automatic. If evenings are your chosen study time, then build your habit on something you do every evening. For example, you could spend an hour studying every night after dinner, or you could work through your notes before you go to bed each night. Or you could use the Feynman Technique while you’re out walking, exercising, or commuting. When you tie your new habit with an existing habit, you’re taking advantage of neural pathways that have been already laid down. With consistent practice, your new study habit should start to feel effortless in a couple of weeks.Tip 2. Start one micro-habit at a timeOne of the best ways to guarantee that your new habit won't stick is to take on too big of a challenge at once. So let's nip that one in the bud before we continue.If your goal is to study every day instead of waiting until the last minute, don't start by promising yourself that you'll study for two hours a day or re-read 5 textbook chapters at a time. That can feel so daunting that you'll end up quitting the first time a major wave of inertia hits you.Instead, maybe just commit to studying one 10-flashcard round in Brainscape every day, or to making digital flashcards for just one small textbook lesson every day. As long as you have broken up your studying into bite-sized milestones, it will be much easier to develop these habits and stay motivated to study.Admittedly, tiny daily study sessions might not initially be enough to prevent your need to cram more at the last minute. But at least you're establishing real habits, and you can always add to your goals once your small starter goals have begun to stick.Tip 3. Keep the chain goingAnother hack for building strong study habits comes from comedian Jerry Seinfeld. For years, Seinfeld would write a joke every day, no matter what was going on in his life. After many days, this chain of daily practice became its own incentive.The threat of breaking the chain contributed to his motivation: Seinfeld didn’t want to break the chain, so he continued writing a joke every day. The habit stuck. You can use apps like Don’t Break the Chain or Done to create a chain for your daily study habit OR you can very simply set study reminders in Brainscape! Go into the menu in the mobile app, select 'Notifications', and then toggle on 'Streak Reminders'. Those will show up as push notifications on your phone’s home screen, reminding you to stop what you’re doing and put in a quick study round with Brainscape. You can also customize the time of day you’d prefer to receive your reminders!Additionally, Brainscape's new study metrics page will help you visualize your progress toward your goals, which can serve as a huge motivation. Tip 4. Bribe yourself to studyYou now know there are deep and powerful parts of your brain that crave instant gratification. They are not moved by distant lofty goals. They want something yummy now. So, use this to your advantage. The idea is to train your brain like it’s one of Pavlov’s dogs. In his foundational experiment, Pavlov was able to connect two stimuli in a dog’s brain: the ringing of a bell, and a bowl of delicious dog food. By the end of Pavlov’s experiment, the connection between the sound of the bell and a meal was so strong, that his dogs would start to salivate when they heard the bell.You need to make a connection between sitting down to study, and something your brain likes.It’s time to train your brain with gratification. Every time you sit down to study, give yourself a treat. Whatever floats your particular boat: whether it’s chocolate, gummy bears, or your favorite TV show. Naked and Afraid anyone? Once you've studied at least 10-15 minutes (of Brainscape flashcards :), give yourself the treat.Pretty soon, your brain will start to look forward to your study sessions, because you’ll have connected the positive experience (the treat) with studying.Congratulations! You have created a neural connection in your brain to tie studying together with gummy bears. Science has been achieved.Tip 5. Discover your best time to studyTo build strong habits, it’s very important to study at the same time each day whenever possible. We’re cyclical creatures, and keeping your study schedule regular will cement the habit much more strongly than shifting it around each day.So when should you study? Are you a morning lark or a night owl?Do you feel sharp at 11 am or 7 pm? Do you fade after lunch? Perk up after dinner? Maybe you’re one of those rare birds who wake up at 6 am bright-eyed, bushy-tailed, ready to go...Everyone has a circadian cycle of sleep and wakefulness. Paying attention to this cycle means you can go to study at times when your energy is optimal. To discover your cycle, spend a week observing yourself (or read this article). Look for the times of day or night when you are at your best and able to tackle difficult mental tasks. Take not'''
