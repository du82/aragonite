full_description = '''Of all the possible subjects you could study, the field of medicine involves the most "memorization" by far. Succeeding in medical or nursing school, and passing your certification exams, requires you to mentally internalize thousands of difficult concepts into your long-term memory. You can't afford to waste time by using purely static, long-form study guides, videos, and reading materials that will simply go in one ear and out the other. You deserve a web and mobile app that breaks down all your medical questions and answers in a way that doubles your learning speed and the duration of your memory retention. For more advice to help you study medicine, check out our in-depth guides for nursing school and beyond! Brainscape proudly offers you the world's largest repository of high-quality med school flash cards (or "note cards" if you prefer that term :). These study materials are created by top students and professors from Harvard Medical School, MIT, and several other top universities, as well as by prominent publishers in several cases such as MCAT flashcards and USMLE flashcards. But these are not your grandfather's flashcards. When you study in Brainscape's web or mobile app, our system asks you to rate your confidence on a scale of 1-5, in the same way you might manually classify paper index cards into "piles" depending on how hard they are. Brainscape then uses your self-rated confidence score to determine exactly when to show that flashcard again. This spaced repetition algorithm guarantees that you will learn faster and remember for longer. The flashcards you'll find in this marketplace have been created using a variety of formats. The most common types of cards are for medical vocabulary. Not only are there great vocab cards within the various subjects in the list above, but we even have several well-curated sets consisting purely of Medical Terminology practice, neatly divided into chunkable sub-decks. In addition, for a lot of the subjects in this marketplace, you'll even find thousands of medical images that supplement the material in the cards themselves. Whether they are diagrams of important biological systems, or actual x-ray or MRI scans from real patients, you will find a treasure trove of useful imagery that will help all that new knowledge stick.'''
