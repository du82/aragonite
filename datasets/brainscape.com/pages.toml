["https://brainscape.com/academy/brain-health-studying"]
title = "Optimize your brain health for effective studying | Brainscape Academy"
description = "Diet, sleep, hydration, exercise, and stress are fundamental to brain health. Here's your guide to optimize brain health for effective, focused studying."
full_description = '''Have you seen the movie Limitless?Played by actor Bradley Cooper, Eddie Morra is a total loser of a writer who is barely keeping his life together. Then, around the same time that his girlfriend gives him the boot for being so terminally tragic, an old friend slips him a pill he claims will change everything. The pill purportedly enhances brain health and mental focus, though it is yet to be tested.Dubious but with nothing to lose, Eddie takes the pill.Minutes later, a rush of acute mental clarity slams into him like a 1,000-foot tsunami. Everything Eddie had ever seen, heard, read, and experienced is within arm’s reach, available to be plucked out of his brain and applied to any situation. His writer’s block magically lifts, and he finishes his book, which is utterly sensational.Suddenly, Eddie finds himself winning at life, getting heaps of sex, and making money hand over fist.There’s more to the movie, of course, but the point is: wouldn’t it be AMAZING if you could pop a pill and, just like that, unleash the full potential of your brainpower? That sure would come in handy during your exams!Unfortunately, such a pill doesn’t exist. But there are ways you can unlock greater clarity, focus, memory, and concentration, which are indispensable tools for studying. Having built the world's best flashcards app, Brainscape has done a lot of research into how humans learn best. As you may have seen, we've already given libraries’ worth of advice on how to study effectively (see our complete guide of must-read study hacks).What we have found and what countless peer-reviewed studies irrefutably show is that the very best way to optimize the effectiveness of your studying is to optimize your brain health. And since your brain is a flesh-and-blood organ, it needs what the rest of your body needs to be healthy.If you’re hungry, tired, dehydrated, and stressed out, all of those hours of hard studying won’t translate into the grades you deserve. With your future at stake, ain’t nobody got time for 'dat.So, let’s cast aside the bad study habits of old and get yourself into optimized shape for exams by promoting your brain health in these five ways:Feed your brain: The best foods to eat for optimal brain healthWater your brain: The role of hydration in good brain healthRecharge your brain: The importance of sleep when studying for examsInvigorate your brain: Getting exercise during exam timeRelax your brain: Eliminate stress during exam prep5 Ways to promote brain health during exam timeYour brain is a complex organ that is capable of incredible things but it requires a bit of tender lovin’ care. In the following five tips for promoting brain health during exams (or any academically demanding period), we’ll explain the best formula for this TLC. So, while most of your peers emerge from their exams looking as traumatized as a gym sock in a frat house, you’ll feel fresh, energized, and totally ready for what’s next.Let’s get started!Psst. Improve your mental and physical well-being with these small life-changing habits that take ZERO time! Also, check out 'How the benefits of cold showers can change your life' by reinforcing your willpower.1. Feed your brain: The best foods to eat for optimal brain healthYou look like a smart person. How can I see that? I can’t. But I’m saying it anyway because you’re reading this so you obviously care about doing well academically. And, I’ll let you in on a secret: only smart people care about doing well academically.So, back to what I was saying…You look like a smart person so you probably know what a healthy, balanced diet looks like. But if you’re struggling to get your eating habits aligned with doctors’ recommendations, consider the following:The right mix of healthy foods can (1) improve energy, (2) sharpen focus, (3) optimize brain health, and (4) generally lift your mood and wellbeing.Now, who doesn’t want a ticket to that show? I know I do: front row seats, please!With food playing such a crucial role in physical and mental wellbeing, eating the right foods can really place you at a distinct advantage, particularly during exam time. A healthy diet can literally make you smarter and sharper.What does this diet look like?1.1. The right study diet for optimal brain healthDoctors, medical institutes, and Oprah Winfrey have been telling us for years: the best diet for promoting brain (and whole-body) health is one that is balanced and features plenty of the following:Lean proteins like white fish, plain Greek yogurt, beans, peas, lentils, skinned poultry, and eggs.Healthy fats (those omega 3 fatty acids) from avocados, fatty fish like salmon, nuts (particularly walnuts), seeds, and extra-virgin olive oil.Dark, leafy vegetables like broccoli, spinach, Swiss chard, and kale, which contain vitamins K, B6, and B12 for improved alertness and memory.Complex carbohydrates like whole-grain bread, brown rice, rolled oats, quinoa, barley, corn, vegetables, and fruits, etc.Together, these foods contain a potent blend of vitamins, fiber, protein, and healthy fats that are scientifically proven to improve wellness, but particularly brain health. This is exactly the kind of advantage that can take you from a B to an A, and even add a pretty + sign to that A.(Side note: curious about the difference between left brain and right brain dominance? Check out the linked article!)1.2. Foods and habits to avoid to protect brain healthThe college diet is notorious for its appalling paucity of literally anything green. Students tend to rely on a fixed diet of instant ramen noodles to power their bodies through consecutive late-night study sessions (and you wonder why you haven’t pooped since last Tuesday).The problem is, the wrong foods can make you feel sluggish, fatigued, and forgetful. A diet consistently lacking in the right nutrients for good brain health can compromise your ability to focus and retain information. Here are five habits to avoid, especially during exam time.‌1.3. The lazy student dietRamen is easy, sure. That supersized Big Mac meal is convenient (and freakin’ delicious). And who doesn’t love a snack of potato chips? But this bad food is not helping you perform better. In fact, it’s doing the opposite.These foods are hurting your body and your brain health:Sugar-packed treats: candy, chocolate, donuts, sodas, energy drinks, and fruit juices.Refined carbohydrates: white bread, chips, fries, and pasta.Greasy, fried foods: fried chicken, hamburgers, pizza, fries, and other deep-fried, greasy, salty, calorie-dense fast foods.1.4. Deep-fried comfort foodsSure, every now and then, raging through an entire bucket of fried chicken on your own is an emotional necessity. But if you’ve got a huge exam the next morning, steeping your brain in saturated fat and all the refined carbohydrates, salt, and calories they tend to come hand-in-hand is only going to achieve one thing: food coma.In a study titled Dietary Pattern, Inflammation and Cognitive Decline, researchers from the National Centre for Biotechnology Information discovered an alarming correlation between diets high in fried foods and a decline in learning ability and memory, as well as an increase in inflammation. You're a serious learner. You don't need that.1.5. Crash dietingThe last thing you should be at any time during your exams is hungry. Eat healthily, yes. But eat enough and make sure you are getting a good balance of protein, carbohydrates, unsaturated fats, and nutrients.Avoid fad diets that are unsustainable and leave you feeling fatigued.1.6. Being gastronomically adventurousDo you know what you DEFINITELY don’t need during exam time, or worse, during an actual exam? A bout of food poisoning.Play it safe with the foods you eat and avoid having to sit out your exam because you’re stricken with a case of Montezuma’s Revenge.1.7. Boozin’Alcohol impairs concentration, memory, and good judgment, which explains why you wound up streaking naked across the quad that one time.Seriously, though. It’s exam time. You need your brain health to be in tip-top condition. You need it to perform like the rent is a month overdue. Imbibing alcohol while studying, or the night before an exam, is about as smart as strapping a boulder to your back and jumping off a cliff.In addition to compromising brain health, alcohol also has a nasty habit of preventing your body from falling into a deep, restorative sleep, which is when your brain does its important housekeeping work.For more information on the best study diet for great brain health, see Brainscape’s article: the best brain foods to eat before an exam. We’ve even included a sample grocery list to make things easy for you.2. Water your brain: The role of hydration in good brain healthDid you know that the brain is 73% water? It follows logically that brain health is significantly impacted by hydration—so much so, that if you’re not getting enough water in your body during exam time, it can actually affect your attention span, memory functions, and ability to concentrate. Being dehydrated can also leave your body feeling stressed, restless, unwell, fatigued, and overheated.In a thesis published by the University of Lethbridge in Canada, it was found that adequate and regular water had a positive effect on students' well-being and mood:“Several [students] reported feeling more alert and more focused, less tired and less stressed—more ready and able to learn.”Clearly water is crucial to body and brain health:Water accelerates the chemical reactions in our bodies.Water facilitates the smooth transmission of messaging within the brain and between the brain and the body.Water helps to deliver nutrients to our brains to keep it well fed.Water helps to flush toxins out of the brain and the body.Water helps regulate body temperature.This not only makes us feel better but helps us perform better, both physically and mentally.Pro Tip: Avoid drinking water 90 minutes before going into an exam or bedtime, so you can use the bathroom right before and not worry about bladder distractions.‌2.1. Recommendations for staying hydrated during studyingThe question you may be asking is how much water should you be drinking every day? This is a bit of a tricky question to answer because it depends very much on your lifestyle, environment, and your body’s unique requirements.According to the National Academies of Sciences, Engineering, and Medicine, however, adequate daily fluid intake is:About 15.5 cups (130 ounces) of fluids a day for men.About 11.5 cups (95 ounces) of fluids a day for women.These recommendations cover fluids from water, other beverages, and food. About 20 percent of your daily fluid intake usually comes from food and the rest from what you drink.So those guidelines we’ve all heard of to drink 8 glasses of water a day are pretty much on point.2.2. “Ugh, I really don’t like the taste of water.”Rather than downing the equivalent in sugar-packed soft drinks, fruit juices, and energy drinks (which will only melt your teeth and land you on My 600-lb Life), dress up your water!Add a few slices of orange, lemon, strawberries, cucumber, or some other pleasant-tasting fruit or vegetable to a jug of water. Try herbs like mint, basil, or rosemary, which will flavor your water without you having to add any sugar. Drinking your water ice-cold also helps it go down easier.If you find that the tap water in your area tastes too strongly of chemicals, it may be worth investing in a water filtration system. You can always reimburse yourself for it one day when you’ve landed an awesome job, thanks to your exceptional grades.‌3. Recharge your brain: The importance of sleep when studying for examsBack in the Precambrian Era, when I was in high school, I followed in the footsteps of hundreds of thousands of history students before me: I left my exam preparation to the last minute (well, to the last three days to be fair). No problem, I thought. I’ll just sacrifice sleep.And so I did, getting a paltry three hours of sleep before my final exam. Not smart.Was I tired? Heck, yes. I looked like Steve Buscemi on a bad day. The worst part of it though was that morning, on the way to my exam, I realized in pure horror that I could scarcely recall a single narrative of the essays I had attempted to memorize the evening before.Less than 12 hours after cramming all that study material into my brain, it had vaporized into thin air, leaving behind nothing but the faintest traces of Tsarist regime, Bolshevism, and oompah music. Certainly not enough to ace a history exam.This is one of the most important reasons why sleep is essential for brain health and for preparing for exams. A tired brain forgets.Read: 'Is waking up early bullsh*t?'3.1. The importance of sleep for good brain healthIf you’re not convinced by my anecdote, listen to what the science has to say: In an article by Johns Hopkins Medicine, a leader in medical education, research and clinical care, sleep expert and neurologist Mark Wu explains that sleep significantly impacts brain function.“First, a healthy amount of sleep is vital for “brain plasticity,” or the brain’s ability to adapt to input. If we sleep too little, we become unable to process what we’ve learned during the day and we have more trouble remembering it in the future. Researchers also believe that sleep may promote the removal of waste products from brain cells—something that seems to occur less efficiently when the brain is awake.”This information would have been very useful in guiding me to plan better for my history exam. But because I foolishly left studying to the last second, I sacrificed precious sleep and barely remembered anything I had studied."Sleep is also vital for the rest of the body," says Dr. Wu, which we can all relate to. Just think about how you feel after a long-haul flight or a night of bad life choices at your favorite pub! Tired, washed out, maybe a little headachey, nauseous even.But beyond mere fatigue, headaches, and a predisposition to taking your spouse’s head off for minor infractions, chronic sleep deprivation can be linked with depression, high blood pressure, a compromised immune system, and even seizures.Remember that the next time you plan on pulling an all-nighter study session. Actually, on this subject, Brainscape’s engaging study app is an excellent aid that helps you prepare for exams in good time, saving you from even needing to go down this route in the first place.Even the most knowledge-intensive subjects—like the bar exam and medical exams—can be prepared for with our adaptive flashcard learning platform. This comes down to the app’s intelligent design and algorithm, which is based on decades of cognitive science research. Brainscape works with your brain to help you master the material, manage your time effectively, and retain the information in half the time it would otherwise take you.3.2. When studying gets in the way of quality sleepThe science is clear on the importa'''
