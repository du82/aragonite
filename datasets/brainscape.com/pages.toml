full_description = '''We all wish we could just push "the easy button" and pour foreign language concepts directly into our brains. But the fact is, if you want to learn a language faster than just the natural way someone might "pick it up", then it is going to take some hard work. Brainscape's adaptive web and mobile flashcards platform provide the perfect complement to the above language learning strategies. Our marketplace contains study materials for dozens of languages, created by top students and professors around the world and, in a few cases, by expert publishers working directly with Brainscape. Brainscape's foreign language flashcards are neatly divided into Subjects and Decks that correspond to the ways that a learner might need to study them. Our adaptive learning engine makes it easy to review your vocab, verbs, phrases, and grammar in exactly the pattern your brain needs, for maximum memory retention. And most of the flashcards have audio accompaniments as well! You may particularly want to check out our premium subjects to help you learn Spanish or learn French since they make special use of our Sentence Builder methodology. Brainscape helps you practice languages more efficiently than other apps, by using our unique Confidence-Based Repetition (CBR) technology. This combines three key mental activities into one optimized stream of learning. First, Brainscape asks you to think of each word, sentence, or concept in your head and then manually reveal it. This process of Active Recall is significantly more effective than simply recognizing the correct answer from among a series of multiple choices, as it forces your brain to truly work to retrieve it -- just like you would in the real world. Second, Brainscape asks you to rate your confidence in how well you knew each answer, on a scale of 1-5. This act of self-reflection -- or Metacognition -- deepens the memory trace by forming neuron connections in a different part of your brain. Finally, Brainscape uses each flashcard's confidence rating to determine precisely how often to repeat it. This customized version of Spaced Repetition ensures that you are reviewing each flashcard within the best interval of time for your brain's maximum memory absorption.'''
