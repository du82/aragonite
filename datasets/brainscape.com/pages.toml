["https://brainscape.com/spaced-repetition"]
title = "Why spaced repetition works so effectively | Brainscape"
description = "Retrieval practice, combined with spaced repetition, is the most effective   and scientifically proven way to learn and retain knowledge. Learn more here."
full_description = "Spaced repetition is the process by which new or difficult concepts are studied more frequently than easier known concepts —thereby perpetually challenging you on your weakest areas of knowledge. Cognitive science shows that spacing repetitions within the optimal time intervals has actually been shown to be the most important factor in your ability to retain knowledge. It is literally how our brains are wired to encode memories. It has historically been inconvenient to study in frequent, bite-sized sessions: Physical books are tough to transport; while most flashcard apps are either 'vocab-only', limited in their analytics, difficult to use, unrefined in their repetition algorithms, or inflexible in their content creation & study features. Our web & mobile app finally makes spaced repetition more accessible, by respecting or leveraging other key pillars of cognitive science such as motivation, hyperbolic discounting, active recall, self-assessment, motivation & metacognition. Brainscape's spaced repetition algorithm places you into a virtuous cycle that builds upon your knowledge. Research has shown that Brainscape's spaced repetition algorithm improves both knowledge retention and test scores when compared to other study methods, like books and traditional flashcards. Brainscape is a web and mobile study application designed to improve the retention of declarative knowledge. It complements the well-known benefits of spaced repetition with additional features that improve learner motivation, reduce the burden of planning study sessions, and deepen the level of cognitive processing involved in each exposure. This paper assesses Brainscape's application of the latest research into education and cognitive science. We conclude that using Brainscape is among the world's most scientifically valid ways to enhance both learning speed and retention for any subject matter that can be studied via text, imagery, and/or sound. Keywords: spaced repetition, expanding effect, metacognition, proximal learning, judgment of learning, confidence-based repetition, scaffolding, feedback, motivation, Bloom's 2 Sigma Problem, active recall, retrieval practice, social learning"
