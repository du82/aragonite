["https://brainscape.com/academy/employee-development-elearning"]
title = "What's missing in your company's eLearning strategy for employee development? | Brainscape Academy"
description = "Is your company wasting time and money on employee training and development? Here’s what’s missing in your approach (and how Brainscape can fix it)!"
full_description = '''In 2015, employee development was a $107 billion industry, according to a Global Industry Analysis. That’s around the same amount of money rock band Mötley Crüe spent on Jack Daniels in the 80s: a staggering amount if you knew just how drunk they were all the time.By 2025, however, investments in employee development are projected to triple to $325 billion. With such mind-boggling investments of money going into employee development, you’d think that the format of delivery would have been perfected to a fine art by now. But it hasn’t been.Far from it. Too many employee development programs plod along the same paths cut by the brick-and-mortar institutions that have come before them. The only thing that seems to change is the content of the education itself and perhaps the addition of some pretty bells and whistles to the software.“If it ain’t broke, don’t fix it,” they say.Well, it is “broke” and we’re going to fix it, right now. Because if happier employees, better sales, stronger brand credibility is important to your company, effective employee development should be at the top of the list of your priorities. Not to mention all the money you can save by avoiding overly expensive eLearning softwareWhat we'll cover in this article ...The problem with today’s eLearning strategiesThe broken delivery of employee development instructionWhat’s missing from your company’s L&D strategy?How Brainscape overcomes these eLearning shortfallsCase study: Using Brainscape as a powerful employee development eLearning strategyEffective and inexpensive employee development with BrainscapeThe problem with today’s eLearning strategiesThe biggest and most pervasive problem with so many companies’ online employee development programs is how they are delivered.What’s the biggest mantra high school teachers and college professors ram down students’ throats? Don’t stick gum under the table?No! It’s that cramming for exams doesn’t work. Picking up your books three days before your exam and spending full days saturating your brain with information is a terribly ineffective way to study. You’re lucky if you pass. You certainly won’t perform well against the hundreds if not thousands of other students across the country sitting down to exactly the same exam. And do you really want to compete with them when it comes to interviewing for the same job?No, cramming doesn’t work. While your brain is an incredibly complex tool and can learn to do just about anything, from juggling oranges to piloting spacecraft, it has finite memory resources, particularly short-term memory resources. With repetition and re-exposure to the same information, your brain will eventually remember it without help, but three solid days of study isn’t going to achieve that.This is why the best way to approach learning something—whether it’s the names and faces of your client’s executive team or the specs of the latest product launch at work—is to: Take your time, andRe-expose yourself to the information at spaced intervals so that you’re not simply forgetting what you learn an hour, a day, or a week later.This latter point is referred to as “spaced repetition”, and it’s a pivotal cognitive science concept that almost every employee development program wholly neglects to leverage in the delivery of their content.This brings us full circle to the problem underscoring most eLearning platforms: the method of delivery is exactly the same as those soul-destroying seminars or online courses employees are periodically forced to attend.You know the ones: You sit-down, are force-fed content (a training video, a presentation, a booklet, etc.), and half-heartedly complete whatever assignment you’re given. Then you skedaddle home or sign out of the program, relieved that it’s over with.In one ear and out the other. Now, onto more important matters: “Mmmm ... jelly donuts.”It’s a broken system.The broken delivery of employee development instructionAll-too-often, companies sign their employees up for one-day, three-day, or one-week workshops or seminars in an effort to get the training “over with” so that everyone can move on, magically more awesome than they were before.Don’t get me wrong: the purpose behind these programs can be critical for advancing workers’ capabilities, skills, and knowledge. From onboarding, company policies, and product knowledge to sales techniques, customer relations, and compliance, there is so much that good employees need to know these days.But it’s little use investing money in this education if employees don’t remember what they learn.How can they, when an entire book’s worth of information is presented in such a short amount of time? How are these mere mortals supposed to remember everything, just based on a glorified set of PPTs and an expensive trainer who recycled his dad jokes for the 67th time this year?Unless you have an eidetic memory and are able to recall, word-for-word, Dostoevsky’s Crime and Punishment, which you read thirteen years ago, you’re pretty much screwed.Also, let’s not forget that, in most cases, employees just want to get the training over with. They have other things to worry about.Once again, considering the enormous amounts of money companies spend on employee development, we should be making darn sure these programs actually work. And yet, they don’t. Or, to be more generous: they don’t work nearly as well as they should.What about bite-sized, micro-learning?While the shift to online education in professional working environments has made employee development more convenient, the format of delivery is still pretty much the same as before.This is even true for so-called "micro-learning" activities, where the content is delivered in bite-sized videos, tutorials, and modules rather than in one lumped load.While the more atomic format is certainly more convenient to navigate for your specific purposes, most of the exercises are still single-exposure and linear in nature. Employees still read through the material or watch the videos all at once so that they can “check the box”, call it "done", and continue daydreaming about donuts, that hot guy/girl in Finance, and holidaying in the Bahamas (with that hot guy/girl in Finance).Within a week, your team has likely forgotten most of the information, and within months, as much as 90% of it. Thousands of dollars of training down the drain. Ultimately, the goal of employee education is to equip your staff with an elegant working knowledge of your company, its brand messaging, vision, policies, products, and services. This empowers them to be as productive as possible and to represent your company well when dealing with customers.Employers think: "I want all my staff to be totally up to date with where our company is heading"Employees think: "I’m too busy for this. I just want to get it over with and put it behind me."We’ve spent ample time admonishing the wrong way to go about doing this. Now we’re going to talk about the right way. We’re finally going to answer the question ...What’s missing from your company’s L&D strategy?1. Employees don’t remember what they learnThe traditional delivery of content encourages employees to cram information over a single presentation or workshop. So while they might walk away having learned something, they tend to rapidly forget the new information in the ensuing days and weeks. This may not matter quite so much if the employee is Sally from Accounting and the information pertains to customer relations, since Sally doesn’t deal very much with customers. However, if the employee is Roger from Sales, and he doesn’t know the company’s best practices for managing disgruntled customers, he runs the risk of forever losing that customer. Sucks for Roger and sucks for the company’s revenue.This is a trifling example of how the drop-off of memory over time might shortchange a company and its employees. On issues of compliance, legal, and safety policies, mistakes can become expensive (with a side order of litigation).[See also: Does your eLearning use good cognitive science?]2. Information can’t be referenced once the training is doneOnce the presentation is over or the workshop is drawn to a close, that’s it. All that remains are a few empty coffee cups, some feverishly scribbled notes, and a lingering fart that Dave from I.T. dropped around the 45-minute mark.And even if employees have been sent home with a booklet for reference’s sake, who on God’s green Earth would want to read through that again?Unless a company threatens to test its employees on the course material after they’ve been trained, any reference materials are very likely going to end up in recycling or on the bottom of someone’s parrot cage.3. Courses and eLearning software are expensiveThe issue that sucks the most for companies is not only that traditional employee development programs are ineffective but that they are expensive.Being creatives, instructional designers are happy to blow a million dollars on crafting the sexiest eLearning platforms they can envision complete with dozens of advanced (read: expensive) features.This is wonderful, sure. But such advanced tools are, in many cases, superfluous; especially when all a company needs is for its employees to “memorize” a bunch of product specs, safety protocols, or menu items, etc. You may not be getting the best ROI from your eLearning investments.4. The software itself is frustrating to useAll-too-often, training managers simply retrofit their old eLearning models into smaller screens in a bid to “keep up with technology” when, in fact, all they’re really accomplishing is creating an illusion of progress. The content and format are the same. The only thing that’s different is the fact that employees are accessing the material on their mobile device, rather than that relic of a TV the company keeps in the basement, along with Dave and his flatulence.As a consequence of this laziness / lack of investment / and/or bid to serve the needs of executives rather than the employees who will be using the training tools, teams frequently end up with cumbersome eLearning software that nobody likes, uses, or benefits from.5. No metrics for gauging employee educationMany employee development programs and apps don’t provide companies with a measurable gauge on how well employees are learning or mastering the material.Traditionally, the only way you know an employee has learned anything is when you see that knowledge in action. Since most companies don’t have the time to test employees before they sit down to do their jobs, there is a lot of faith involved. I’m not encouraging formal assessment–I wouldn’t want to invoke the wrath of employees everywhere who thought they’d left the stress of exams behind them in high school and college.Rather, I’m noting the lack of insight these eLearning platforms provide to the companies that purchase them. How do you know if your investment is paying off? You don’t. You just have to hope your employees are taking time out of their busy days to complete some requirements (with value that isn’t always apparent to them).Sounds positively inspiring, doesn’t it?6. Employees don’t benefit equallyThe last point I want to make is the following: not everybody is academically inclined. Not everybody is good at memorizing information and not everybody emerged from school or college with the best learning methodology for remembering pages and pages of information.In the context of the kind of employee development programs and apps we have been discussing, these employees would find themselves at a considerable disadvantage. And all because they aren’t as studious or have the same Grand Canyon-sized attention span as Sally in Accounting. How Brainscape overcomes these eLearning shortfalls Brainscape's flashcards use confidence-based repetition so you learn as efficiently as possible. We’ve taken a rather depressing whirlwind tour through all the possible facets that could be missing from your company’s eLearning strategy.Now, it’s time for the good news. What is the key to effective employee development? The answer is cognitive science and understanding how it can be leveraged to help your employees master essential information quickly, efficiently, and permanently. Then, they can get back to being productive (or rather more productive than before).No need to hire a cognitive scientist to assist. Brainscape’s customizable employee training app provides the answer by achieving the following seemingly complex, cognitive concepts:Engaging active recallFostering metacognitionImplementing spaced repetitionAs you’ll come to see, these concepts are actually pretty straightforward. In fact, you’ve probably been doing them your whole life without even realizing it. Let’s take a closer look at these top cognitive science-based L&D recommendations and how Brainscape leverages them for successful employee development.1. Engaging active recall“Active recall” is your ability to remember things from scratch. When asked an exam question or faced with a tricky work situation, you actively dig into your memory bank and retrieve the information you need (as opposed to just "recognizing" it on a slide or a list of multiple choices).This is the best way to learn new information because it means that once it is learned, you can pluck it from your cognitive coffers and offer it up in an exam or apply it to a real-world situation.If this sounds fairly complex, don’t fret. You actively recall information all the time: the route home from work, your spouse’s birthday (hopefully), important phone numbers, your address, and how to do your job, etc. There was once a time you had to learn all of these things. Now, they are so entrenched in your brain that you can actively recall them without Google having to come to your rescue.Traditionally, however, people study passively by reading through notes and textbooks, and by watching videos and presentations. And while you may feel that you’re familiar with the material (upon the second or third review), that sense of familiarity is merely recognition and not recall.There’s an important difference between recognition and recall. The one is a passing feeling of knowing the information (“passing” being the operative word there) and the other is a permanent internalization of the information, which can be used or recalled at a later date.How can companies encourage employees to learn via active recall?Companies should consider training delivery that frequently asks employees to repeat or recall concepts from scratch shortly after they are learned. The goal of this is to solidify each memory trace.Whether this is achieved through periodic short-answer questions, essays, verbal evaluations, or self-assessment flashcards, eLearning investments that use active recall are more likely to promote deeper learning than those that rely on passive techniques.Brainscape’s adaptive microlearning platform really pivots on encour'''
