["https://brainscape.com/academy/spaced-repetition-learn-language-brain-science"]
title = "How brain science can help you learn a language faster | Brainscape Academy"
description = "Discover how Brainscape helps you learn a language as effectively and efficiently as possible using spaced repetition and adaptive flashcards."
full_description = '''Imagine yourself in Beijing, conversing easily with your business partners in Mandarin. Or at a vineyard in France, where the owner is describing the complex flavors of a deep Bordeaux. Or at a packed bar in Grenada, ordering tapas and sangria for your friends. Languages open doors to a ton of unique and wonderful authentic cultural experiences. There’s just one problem: they’re difficult to learn. We know that better than anyone. Brainscape was born out of the struggle to learn a language: our CEO Andrew Cohen developed an early version of Brainscape to help him learn Spanish. We know that there’s no easy way to learn a language.But we also know that some methods are more effective than others. Spaced repetition language learning is one of them.Brainscape was developed to make learning a language as effective and efficient as possible. While creating our popular adaptive flashcard platform, we’ve been obsessed with understanding and applying principles of cognitive science to optimize learning. That obsession stretched to language learning. What's the result? A system that teaches languages as fast as possible using cognitive science.We've developed innovative Learn French, Learn Spanish, and Learn Chinese (Mandarin) programs using this system (with other languages coming soon). We are confident that these are now the most advanced and effective systems for learning those respective languages on the internet, combining a series of groundbreaking, proven atomic exercises that have never before been fused into a web and mobile language-learning tool.To date, over 1 million independent language learners have used Brainscape's Intelligent Cumulative Exposure (ICE) system for Spanish and French and have had extremely positive things to say. But besides such amazing feedback, how can we be so certain that we’re offering the best way to learn a language? Because we’ve worked together with language scientists and teachers to design them carefully to be consistent with the best research on how we acquire language.This article explains how we’ve created a revolutionary system for language learning based on cutting edge research and carefully crafted systems combining spaced repetition, a complete language curriculum, intelligent cumulative exposure, and adaptability. We’re going to cover the aspects of Brainscape that make it the best language learning tool out there:Spaced repetition for language learning—the right wayWhat's missing in spaced repetition for foreign language acquisition?A carefully designed “Intelligent Cumulative Exposure” curriculumYour fastest path to foreign language fluencySo if you want to learn more about how Brainscape uses brain science to help you learn a language faster, let’s dive in. 1. Using spaced repetition for language learning—the right wayThe core of the Brainscape learning system is our flexible spaced repetition algorithm. It’s our “secret sauce”. Spaced repetition is the technique by which new or difficult concepts are studied more frequently than easier known concepts, then repeated in increasingly longer intervals the better you know them. It is the most important breakthrough in the science of learning the past century.Adequately spacing repetition has been shown to be tremendously more effective than any other "memorization" gimmick like mnemonics, stories, emotions, or associations. Indeed, when combined with the user's own self-assessment and applied to a massive body of knowledge like law, medicine, or a foreign language, spaced repetition can literally help people learn many times faster and retain the information for exponentially longer. Spaced repetition helps defeat forgetting. The intuitive effectiveness of this technique has accordingly led software developers to create hundreds of spaced repetition language learning flashcard apps over the years, in which you can easily make your own flashcards, import your own lists, or find flashcards created by others.And it is only natural that foreign languages have become among the most common applications of these spaced repetition apps, typically for vocabulary memorization.2. What's missing in spaced repetition for foreign language acquisition?The problem is that most foreign language educators and learners have historically thought of spaced repetition as simply a "feature". What they overlook is that spaced repetition is not some silver bullet that you can just strap onto a game or a giant list of vocab flashcards and hope to magically reach the promised land of fluency. Spaced repetition is only effective when combined appropriately with the actual curriculum in which the knowledge is initially presented.By far, the most important component of a spaced repetition language-learning journey is the order of initial exposure of bite-sized learning concepts—the careful, incremental introduction of individual words and grammatical constructs in just the optimal pace for your current level, while systematically repeating previously learned concepts with just the right level of frequency and mental engagement so that you're constantly building and not forgetting the knowledge.Brainscape has addressed precisely this void. We have developed a foreign language acquisition curriculum that has been built specifically for spaced repetition.With Brainscape's adaptive flashcards, spaced repetition is not a "feature". It is the product itself, and the curriculum is baked into that product, with the flexibility for the learner to add their own acquired concepts to that curriculum on the fly.3. Introducing "Intelligent Cumulative Exposure"We call this intimate combination of an obsessively incremental curriculum with an obsessively optimized spaced repetition algorithm: "Intelligent Cumulative Exposure" (ICE).What is it about the Brainscape ICE language curriculum that makes it such a popular spaced repetition foundation for any independent foreign language learner? As mentioned earlier, there are four major advantages (all of which make use of our sophisticated spaced repetition algorithm):A practical progression of conceptsA relentless focus on productionMultiple modes of incremental exposureAdaptability to your own experiencesLet's dive into each ICE advantage in some detail, with an eye to the cognitive science benefits provided by Brainscape's unique combination of curriculum and spaced repetition.3.1. A practical progression of conceptsFirst and foremost, concepts in Brainscape's ICE-based language curriculum are painstakingly ordered from "most practical" (most likely to be needed in basic conversation) to "most specific", throughout the entire program. We developed this flashcards progression based on deep analysis of language corpora and a survey of our own language learners who rated the "usefulness" of thousands of thousands of keywords and grammatical concepts. This is in stark contrast to how most textbooks, courses, or language apps teach concepts, which tend to be purely by "topic".For example, a beginner lesson in a typical language app might be for a topic like "Family Words". In that same lesson, you might be learning common words like "mother", "sister", and "child" but also other less common words like "grandmother", "niece", and "uncle", which are significantly less likely to be needed so early in your language-learning journey.This grouping by topic area may sound logical, but it is a huge waste of your precious time early in the learning process! If those less useful "secondary family words" like "grandmother", "niece", and "uncle" were words # 53-55 that you had learned in German, wouldn't those early slots have been better spent learning more immediately useful words like "money", "bathroom", or "boyfriend"?The fact is, grouping grammar by many sub-optimal topics is ultimately an inferior rate of learning than if you were to be learning the language "on the streets", on a need-only basis.Brainscape's ICE foreign language curriculum tries its best to mimic the natural need-based progression of exposure by obsessively organizing concepts from the most fundamental to the most esoteric, but still with some chunking (such as "basic family words") within a typical level grouping. As research shows, the more practical the concepts learned, the more likely the learner will maintain their language-learning motivation.[Want more than flashcards? Check out our complete language-learning toolkit]3.2. A relentless focus on productionThe typical foreign language textbook or app begins a lesson by first showing the user the language concept, i.e. by providing "input." You may have seen exercises like these at the beginning of a language lesson:Beginning a lesson with such activities may seem to make sense. First you "teach" a concept. Then you ensure that the learner can "recognize" the concept. Only then could you start doing exercises to "practice" the concept. Right?WRONG! In the real world, you are most likely to remember a concept when you first need to say it (aka "production"), you try to say it (or remember it using active recall, you fail to say it, and only then you are corrected with the proper words and pronunciation (and potentially a grammatical explanation).Brainscape ICE curriculum mimics this real-world experience by asking you to actively recall the phrase based on nothing but a native language prompt (e.g. "hamburger") and then—once you are ready to reveal it—showing you both the correct spelling and the correct audio playback with an authentic native speaker at a naturally spoken speed.The “production-first” method: Attempting to think of the correct word or phrase in the target language, from scratch, via a digital flashcard, even before having been “taught” that phrase through traditional exposure. The user will likely fail, but upon correction, her error will then be more salient in her mind than a static linear exposure would have been, and will thus be more likely to be remembered.Research suggests that the act of attempting to produce phrases in the target language is most effective in helping second language learners to "recognize consciously some of their linguistic problems.” Other researchers have further confirmed that learners are naturally more likely to perform subconscious metalinguistic analysis of the grammatical rules behind a sentence when the learner herself is the one actively producing that sentence. Still others have concluded that as the learner utters and analyzes her own words, she refines her understanding of their structure, especially when corrective feedback is given.Brainscape's progression of production, correction, and explanation is thus a scientifically optimal flow and is similar to how an actual conversation with a native speaker would be if that native speaker could give constant feedback on a sentence-by-sentence basis. Studying with Brainscape's ICE curriculum is like having a tutor with you at all times.3.3. Multiple modes of incremental exposureLearning a new language is about so much more than "memorizing words." But someone forgot to tell that to most of the fun language-learning games, apps, and free flashcard decks out there. The majority of language apps are almost entirely vocab focused, with only incidental grammar learning, since their interfaces are set up for trying to assess you with cute scores and leaderboards.In contrast, Brainscape's open flashcard canvas—where you simply think of the answer in your head before revealing it (and rating your confidence) rather than choosing from among multiple choices—provides us the flexibility to provide new types of vocabulary and sentence-building exercises that would be simply incompatible with other interfaces.In each type of Brainscape ICE exercise, the flashcards are designed to be perfectly incremental, so that there is only one new learning objective per flashcard. Although concepts are repeated in their own specified intervals after their first exposure, new concepts are always displayed in the Brainscape-defined order. No supporting word or concept may be casually used in a sentence unless it has been previously explained, and no new concepts are introduced until the user’s confidence in previously taught concepts has reached a sufficient level.This piecemeal progression conforms to Krashen's famous admonition that an incremental approach is the most effective way to maximize mental processing of new language concepts while minimizing cognitive load. According to Krashen's Input Hypothesis, each chunk of input should be presented at a level of difficulty equal to i + 1, that is, just a bit beyond the learner’s current ability (i), but not so difficult as to seriously impair comprehension nor so easy that no new language challenges are encountered.Let's take a deeper look at the three unique, alternating flashcard deck types that comprise Brainscape's ICE foreign language curriculum: Sentence Builder, Vocab Enrichment, and Listening Practice decks.3.3.1. Lesson (aka "Sentence Builder") decksTypically, when we hear a new sentence in a foreign language we are trying to learn, there are a number of words or concepts with which we are unfamiliar. While this may be a "natural" means of exposure, it is a vastly sub-optimal progression. A sentence with 5 new words or grammatical constructs could be so far out of our zone of proximal development (i + 5 in Krashen-speak) that it simply goes over our head, with very little that actually "sticks".Brainscape's Lesson decks were laboriously developed to address exactly this inefficiency so that even new complete sentences never introduce more than one previously unseen learning objective at a time. It's always just i +1.See the example below. The only new concept in the sentence is the conjugated verb "[he] is buying" (achète), which is underlined. All of the other concepts in the sentence (i.e. the possessive "my", the noun "uncle", the noun "boat", and the demonstrative pronoun "this") have presumably already been introduced in earlier cards, and have already been naturally repeating as Brainscape's spaced repetition system has progressed through the curriculum up to this point. The introduction of new concepts could hardly be more incremental than this!A typical Sentence Builder card in Brainscape's French curriculumThe second noteworthy component of Brainscape's Sentence Builder decks is that the "answer" side of each flashcard adds a supplementary explanation of the new underlined concept, explaining any grammatical nuances or variants that the user should be aware of. (And any such variants are themselves still individually re-introduced in future cards.)This is the opposite order of how grammatical concepts are taught in textbooks, which usually teach a lesson first and then give examples afterward. By introducing each concept through a spoken sentence and then providing the explanation, Brainscape again mimics the process of having a human tutor with you, who correct'''
