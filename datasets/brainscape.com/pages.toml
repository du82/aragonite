["https://brainscape.com/academy/best-way-to-learn-a-language"]
title = "The best way to learn a language⁠ online—your complete toolkit | Brainscape Academy"
description = "Your list of all the resources you need to learn a foreign language FAST and never forget it. This is the best way to learn a language online."
full_description = '''Based on decades of research, the best way to learn a language is by using the language—reading, listening, and speaking. This is great news for independent and self-motivated learners like you, as it is easier than ever to find online resources to help you take control of your language learning.But whether you're using Brainscape's language flashcards or not, we still want to make sure you have a comprehensive set of resources to really build your language-learning journey according to the way you learn. So, in this guide, we cover 10 tools you need to learn a language online.Ready? Let’s dive in! 1. Real-world motivationMotivation is essential when learing a language online because it is a long and hard journey. It can take years to become fluent. No language-learning effort will ever “stick” unless you're deeply motivated.How do you find this motivation? You MUST have a real-life goal that is important enough to you to keep you motivated:Understanding your Colombian husband's family.Traveling or moving to a foreign country. Attending an international conference (or work). Wanting to smash out an "A" in French class.Whatever it is, remember that your motivation will have to sustain you through those periods when you'd rather relax on the couch than practice verb conjugations. You’ve gotta want it. Otherwise, maybe you shouldn't learn a language after all (and that's okay).Techniques to cultivate motivationDevelop a clear vision and goals. Part of staying motivated is to clearly see what you’re working towards. Without a clear vision for where you’re going, it’ll be hard to stay motivated to get there. As a first step, pick a goal.Make language study a daily habit. Develop the habit of studying every day or attaching your studying to another activity that you do regularly, such as making dinner or going for a run, so that it doesn't feel like "work".Study a little at a time. A flashcard app like Brainscape makes this easy by allowing you to study in short rounds of 10 cards each, which are easy to squeeze into short breaks in your day. Also, its engineered to help you learn the way your brain was built to learn so you'll find yourself absorbing (and remembering) vocabulary so much quicker.Keep track of your progress. One of the best ways to stay motivated to learn a language is to see how far you’ve come. Take tests regularly or, better yet, practice with a foreign-language partner to feel your proficiency improve.[Check out our complete guide on finding study motivation.]At the end of the day, regular work over a long period must be done. There are no shortcuts!2. Vocabulary and grammar appsLanguages are ENORMOUS bodies of information to learn. To break down all this content, we strongly recommend an adaptive flashcard app for vocab and grammar practice.Flashcards facilitate the important mental activities of active recall and spaced repetition to improve your learning speed, and they can be a convenient tool for when you have just a few minutes to knock out some practice on your smartphone.Why Brainscape is the best flashcard app for foreign languagesBrainscape is a flexible, adaptive flashcards app that helps you learn vocab and grammar twice as quickly as you would doing traditional exercises. You also remember the content more deeply and for a longer time.Not only does Brainscape offer convenient online and mobile flashcard-creation tools (with audio) and an online library of user-generated flashcards for every language on the planet, but we have spent years building our own "certified" curricula—starting with French and Spanish—using a groundbreaking strategy that uses brain science to help you learn a language online faster.Each flashcard in Brainscape's certified curricula only conveys one new word or grammatical concept, in order to facilitate incremental learning. The flashcards are fully customizable and force you to use active recall.Our language teaching experts have analyzed languages to determine the most common expressions you need first, building up to more complex words as you progress. If (heaven forbid) you quit at any time, you'll know that you've at least learned the most useful concepts.Brainscape's flashcard study system uses the most advanced spaced repetition system (SRS) that repeats each flashcard at the best possible time. You'll see information just before you forget it, maximizing its memory imprint. The brain naturally forgets information over time. But by repeating your exposure to that information at precisely-timed intervals, you can defeat the "forgetting curve" and retain knowledge far more efficiently than cramming. You can learn anywhere, at any time. In line for coffee? Waiting for a colleague? Microwaving your lunch? You can smash out vocabulary flashcards on Brainscape wherever you are, on a phone or a computer. No matter what device you're studying on, all your progress is kept in sync in the cloud, so you can always pick up where you left off.[Check out Brainscape's Language-Learning Flashcards]3. Digital dictionariesAs you engage in conversation and watch media in your new foreign language, you’ll naturally run into words and phrases that you don’t recognize. You'll need the right dictionary where you can find any form of a word and not just the root or infinitive form.Digital dictionary toolsLinguee. Linguee is both a dictionary and a phrase translator tool. It lets you see tons of examples of each phrase being used in context, helping you to internalize the true versatility of the language. Google Translate. Google translate is one of the biggest translators on the net and benefits from thousands of people contributing to verify translations. Word Reference. Word Reference combines a dictionary tool with online forums and a verb conjugator tool. Context Reverso. Context Reverso uses a repository of texts paired with their translations to identify translations organically in real-life texts with context-rich examples.4. Apps for recording (and practicing) new words and phrasesNow that you’ve looked up your new word, you need a way to record it. Smart language learners are diligent about keeping a notebook or note-taking app on them at all times and are constantly logging their newly acquired phrases so that they can review them again later.With Brainscape, you can easily whip out your phone and make a new flashcard for any new phrase you encounter, and that flashcard will show up in your ongoing adaptive studies using Brainscape's spaced repetition system. Simple and effective.5. Conversation partnerThe best way to learn a language is to use it. That means you should be speaking the foreign language the whole time you are learning—even if (especially if) you struggle. A conversation partner is critical to maintaining that mental progress checkpoint and correcting you on your phonetics. Plus, it increases your motivation to study!People accomplish more when they feel like they’re working in a team. You’re accountable for trying, you feel supported, and you get instantaneous feedback. If you can't find a native speaker, even just another fellow language learner could be useful to practice with. You simply need an excuse to actually speak the language.Language partner optionsLanguage exchange sites. There are now a ton of language exchange websites and they're some of the best ways to learn a language online. Some options include My Language Exchange, Tandem, Conversation Exchange, Speaky, HiNative, and Polyglot Club. You can also find people on Craigslist and Reddit.Find a tutor. If you’re interested in getting a proper tutor, there are tons of online options for that as well such as Verbling, Superprof, Cambly, Italki, and Preply.Conversation clubs. You can also find meet-ups and conversation clubs in your area through websites like Meetup or by searching for language cafes. You’ll be surprised how many other people are as motivated as you to master new languages.Don't be afraid to make mistakes! Conversation is about trying things out.6. Ear-eye training activitiesAnother essential tool for learning a language are the activities that train your ears and eyes to sync up. We need to be able to understand how a word sounds while it is still foreign to us. This is incredibly effective for learning a language.Listening and reading your target language at the same time will improve your capability to do listening activities and reading activities by themselves. Yet this can’t just be any type of listening or viewing activity. It has to be appropriate for your skill level and interests. Watching a complicated movie as a beginner would otherwise just result in a string of gibberish flowing in one ear and out the other. (This is why you’ll never learn a language from TV).These activities are particularly helpful when it is a movie or book that you already know well so that you can figure out certain phrases’ meanings by their familiar context. At first, it doesn't even matter if you know what these words mean. You can’t fully learn to comprehend a stream of conversation if you haven’t yet been trained to hear when one word ends and the next begins.Here are some options for doing that:Brainscape flashcards. Our French and Spanish curricula pair an audio file with text, allowing you to read a sentence and hear it pronounced at the same time. This is especially useful for beginners. Read with a native person. If you have access to a native person, this is our favorite. For example, if your partner is Chilean, try reading a book together in Spanish. You can follow along with the words while they pronounce them. Audiobooks. If you don't have a friend or family member that can read along with you, the next best option is to read a physical book copy along with the audiobook version.Watch films with subtitles. For example, watch a documentary in French about a familiar topic and make sure that the closed-captioning turned on (also in French). Sometimes subtitles don’t match films exactly, but we find that documentaries tend to have text that matches the audio very closely. Listen to songs with their lyrics. Lyrics Playground is a great place to find international song lyrics. Podcasts. Some podcasts come with transcripts, especially those that are aimed at teaching people foreign languages. For example, both the Inner French podcast and the Leonardo English podcast have transcripts that you can follow along with. Look for others in your target language.7. Reading activitiesAside from conversation with native speakers, reading is the best way to expose yourself to the large stream of words that are required to truly internalize your fluency—especially if you remember to look up all the new unfamiliar phrases in your dictionary app, and then make flashcards for those phrases in Brainscape.Once you’ve learned some basic vocabulary and grammar rules, you’ll be ready to start incorporating real-world reading activities into your learning rotation.Reading activity optionsChange your phone’s language. You can change the language of your phone to be in another language. Or, change the interface language of just one social media app for starters.News. The news is a great way to get exposed to a new language while staying up-to-date on current events. Check out MIT library’s repository of non-English language newspapers. Articles. There are a ton of places to find great articles online. One of our favorites is Medium. Just search for non-English terms like “Ciencias” for science articles in Spanish. Books and magazines. Get ebooks in your target language easily at the Kobo store or Amazon. Other sources include Project Gutenberg, eBooks, iTunes, Google Play or even your local library. Or perhaps you subscribe to a local version of your favorite popular magazine, like Men's Health en Español.8. Listening activitiesPure listening is more difficult than ear-eye training since we are now talking about listening without necessarily having the printed text to follow along with.Some people confuse listening with hearing. While passively hearing is great for exposure, your listening exercises should encourage you to get actively involved. This means staying alert to new words and phrases, deciphering sounds and pronunciations, and actively checking your understanding.Listening activity optionsPodcasts and Radio. You can listen anywhere, and, if it’s too difficult, you can always slow down the audio so it’s easier to understand. Find podcasts and radio shows from all over the world in a variety of languages on TuneIn. Documentaries. These tend to be spoken more slowly and clearly, without much slang. Many documentaries may even have closed captioning that is an exact verbatim match to the words being spoken aloud. You can find these on YouTube. For example, try the “Documentaire en Français” channel if you’re learning French. News. Listening to the news in other languages is another great option for clear, slow language. And it’ll keep you up-to-date with current affairs. For lower levels, try the following: Decipher Chinese (Chinese), News in Levels (English), 20 Minutes (French), Nachrichtenleicht (German), News in Slow Italian (Italian), NHK News Web Easy (Japanese),VOA Korea (Korean),News in Slow Russian (Russian), or Hola qué pasa (Spanish). For more advanced levels, check out videos from news sites on YouTube. Here’s some of the best ones: CCTV (Chinese),BBC News (English),France Info (French),DW Deutsch (German), Euronews (Italian), FNN (Japanese), TV Chosun (Korean), RT News (Russian),BBC Mundo (Spanish). Google News also lets you connect with news in a number of languages.Animated movies (e.g. Disney/Pixar). These are dubbed for children in multiple dialects and therefore tend to be standard and easy to understand (though not as easy as documentaries. Dubbed popular movies or shows. As with animated films, these dubbings are typically recorded by professional voice actors whose clarity transcends dialects and is spoken into a nice clear studio mic, rather than a lapel mic while they're in action. I'll never forget my evening watching L'Arme Fatale (Lethal Weapon) from my hotel room in Martinique and laughing at the disconnect between Mel Gibson's lips and the French words I heard. But it was great fun practice! Here’s how to change your language on Netflix to get your favorite shows dubbed in your target language. Songs. Songs can be one of the best ways to train your ears in a foreign language because they are fun, repetitive, and can easily be looked up online to sing along to the lyrics. An extra bonus is that they can become a great topic of conversation with your new native-speaking friends. They'll be so impressed when you can sing along!How can you find new music in a new language? Start finding what’s popular in other countries using the charts on any music streaming app. Then find a couple of artists you like and search for similar artists.Just remember to make the most of the song'''
