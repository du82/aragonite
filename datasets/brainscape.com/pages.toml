["https://brainscape.com/academy/how-study-with-online-flashcards"]
title = "The complete guide to making & studying flashcards online | Brainscape Academy"
description = "Discover how to make online flashcards, learn twice as fast, and share flashcards with other students."
full_description = '''There are few feelings more overwhelming than studying for a huge exam. In front of you sits an entire semester’s worth of information, equations, and facts—a vast lake of knowledge—which you need to consolidate in your brain in a matter of days (hopefully weeks, but let’s be real).Someone may as well have handed you a kettle and said: “There, now boil the water in that lake!” You sit and stare at the stack of books and notes, almost dizzy with the sense of futility. How can you, one person with one kettle, boil all that water? I’ll tell you how: one kettle at a time.Like many things in life, studying a massive topic is best done when you can break it into multiple smaller steps. And flashcards are one of the most effective tools for helping you do exactly that. A well-organized set of flashcards will not only help you learn faster (as proven by cognitive science research) but it can also help you retain the information for longer. Moreover, using flashcards as a study method is much more convenient, making it so ridiculously easy for you to fall into study sessions, you’ll find yourself learning everywhere you go: at home, on the bus, in the bath, between lessons, or even on the can.Brainscape has been researching the best ways to study with flashcards for over a decade. We've reviewed the academic literature in-depth, spoken with thousands of our own power users, and conducted countless focus groups to produce this complete guide to when and how to use flashcards to study any topic.In this article we’ll cover how to study with flashcards. You'll master the best flashcard practices that the world's top students implement to perform better with the least amount of required study time:Should I use flashcards for my subject?Brainscape: flashcards reimagined and superchargedHow to find premade cardsHow to create great flashcardsHow to study with flashcardsBecoming a flashcard master1. Should I use flashcards for my subject?As the creators of the world's most effective flashcard app, it's of course tempting for us Brainscapers to promote flashcards as the solution to every learning problem. But before we dig into our full guide on how to use flashcards, the most important thing is to humbly recognize when is the best time to use them. 1.1. Which subjects are best for flashcards?The first thing for us to note is that flashcards are NOT just some trivial learning technique reserved for kids or young students. While many of us may associate flashcards with multiplication practice or learning to tell time, the benefits of flashcards actually tend to be strongest for high-stakes subjects and more mature learners.In other words, flashcards tend to work best for knowledge-intensive subjects that require a lot of factual memorization over a long period of time. For example:HistoryScienceNursingLawMedicineGeographyLiteratureProfessional certificationsProduct & sales trainingEach of these topics contain a multitude of individual facts, relationships, processes, names, diagrams, maps, characters, and/or terms that need to be individually internalized in order to achieve a meaningful level of mastery of the overall subject matter.Almost any of those individual concepts can be broken down into a binary Question / Answer flashcard format that makes it super-convenient to review later, using active recall, spaced repetition, and interleaving practice. These are cognitive strategies that make learning super efficient and Brainscape leverages them all in our adaptive flashcard learning platform.Active recall is the ability to remember a concept from scratch without assistance or prompting. We do this by showing students flashcards with only the question on them. They are then compelled to remember the answer without any hints or multiple-choice questions guiding them towards an answer. This deepens the cognitive pathways to that information.Spaced repetition is showing a student the same information at just the right time intervals to help them remember it. If they don’t know the information at all, the flashcard will be repeated every three to four cards. If they know it well, it will be repeated far less frequently. This repeated exposure at just the right frequency is proven to help students retain information far more effectively.Interleaving practice is a learning strategy that involves intentionally interweaving concepts across a subject or several subjects, rather than focusing on one specific task, concept, or subject at a time. This forces your brain to re-contextualize every concept it comes across, which builds much stronger connections to that information, deepening comprehension and memory. Read: 'Interleaving practice makes perfect: "mix it up" to learn faster'Flashcards can also be a great supplementary learning aid for foreign languages. There are numerous ways that vocabulary, common phrases, grammatical concepts, verb conjugations, and even audio pronunciations can be transformed into digital flashcards that can be incorporated into any overall language-learning curriculum.[See our complete toolkit to learn any language more effectively] Brainscape helps you learn more efficiently by harnessing FOUR powerful learning tactics: active recall, metacognition, spaced repetition, and interleaving practice. 1.2. Which subjects are not so great for flashcards?Because flashcards assist with the learning of knowledge, they are not typically suited for more skill-intensive subjects, like:Advanced mathWritingPhilosophyBusinessProgrammingThese topics are probably better suited for more constructivist learning activities like writing, debating, and problem-solving practice.Sure, you can make flashcards for some of the concepts in these subjects. For example: memorizing a trigonometry formulas, or the names and dogmas of the philosophers in a particular era. But at the end of the day, you really need to engage in debates, write papers, and practice complex problems in order to ace these subjects.1.3. In which part of a lesson should flashcards be introduced?If you want to use flashcards for your subject, when should you bust them out? Right away? Or when you're cramming the night before the test?Most educators would argue that flashcards are typically not the best place to introduce a new topic for the first time—unless the flashcards were created using a very specific hybrid of instruction + review, such as in Brainscape's unique spaced repetition app for foreign language learning.Rather, most standard flashcards are better-suited for review, and that review should ideally be started immediately after the initial exposure.For example, let’s say you just read a textbook chapter (using our spaced repetition app for foreign language learning-know textbook-reading technique), and/or you just finished your class lecture (while following our guide to taking great class notes). The best time to make or start studying the flashcards for that topic is within 24 hours after said instruction to help consolidate your knowledge.Hardly any students do this, of course. They instead wait until a few days before the exam to cram. But if you begin your deliberate practice immediately after the initial instruction, you will end up saving A LOT of time having to re-learn those topics again later, and you will have a massive advantage over most other students.[See also: How to study effectively with LESS total effort]Regardless of how you use flashcards, just make sure you aren't over-relying on them or studying them in too much of a vacuum. Remember that flashcards are almost always better as a complement to a larger suite of study tactics and that for understanding larger complex sets of relationships, you may still be better served by concept maps or other similar activities.2. Brainscape: flashcards reimagined and superchargedFlashcards have a long history, dating back to at least 1805, when the Quakers used them to teach English writing. Ever since then, they’ve grown in popularity because they’re such an effective way to absorb knowledge.Many people still make flashcards the exact same way as those early Quakers—by manually writing out questions and answers on dozens of paper cards, shuffling them as needed, and continually reviewing the deck until boredom or a vague sense of accomplishment sets in. This is still an effective way to learn, but can be vastly improved upon.This is precisely what Brainscape has done with our adaptive web & mobile study platform. We have reimagined and supercharged the concept of flashcards. Brainscape flashcards are designed for serious learners: people who have high ambitions of smashing their exams, mastering foreign languages, and/or heading into their careers armed with the best possible education. Brainscape's flashcards use confidence-based repetition so you learn as efficiently as possible. Our users are obsessed with optimizing their learning and making each minute of study count. They don’t have time for games, gimmicks, cartoons, or badges. People use Brainscape because they want to apply cognitive neuroscience concepts to learning faster and more efficiently; because they want the best way to use flashcards.With Brainscape's online flashcards platform, you get (i) better content, (ii) better flashcard creation tools, and (iii) a more efficient study experience that improves your test scores, language fluency, and/or professional development.Brainscape's unique spaced repetition algorithm, combined with active recall and metacognition (assessing your own correctness) has been proven by decades of cognitive science research to help you learn faster and remember longer. These principles simply hadn't been made commercially accessible until now. Every time you answer a question on a Brainscape’s flashcard, you are required to rate your confidence in your answer on a scale of 1 to 5, with 1 being “I didn’t know this at all” and 5 being “I knew the answer 100%.” Depending on your rating, that card will be repeated again at optimal intervals to help you improve your confidence in the answer and permanently onboard the information. 3. How to find premade flashcardsEven without Brainscape, there are many places you can find flashcards online for a particular subject or exam. For example, if you like the idea of paper flashcards, Amazon sells tons of them for just about any exam or foreign language you can think of, made by a variety of reputable publishers.Similarly, if you are looking for digital flashcards, you can probably just google "[subject] flashcards online" and find several online study platforms that offer user-generated flashcards as one of their features.While these user-generated flashcards might have some accuracy issues, and while the flashcard study experience might not be as slick as a flashcard-focused platform like Brainscape, they are at least a good starting point.But if you are looking for a great study experience combined with content that is more likely to be trustworthy, you'll probably want to search directly in Brainscape. And why not? You’re already here!3.1. Searching for flashcards in BrainscapeIn the Brainscape website or mobile app, simply click or tap the Search icon, and type in any subject you're looking for, for example French, biology, the bar exam, etc. And you don’t need an account to search the public Brainscape knowledge genome. If there are any Brainscape-certified flashcards for the subject you searched for, they'll show up at the top of your results page. All the rest of the flashcards are created by other students and educators from around the world and sorted by how popular they are.The best part is that not only can you study these flashcards, but you can also make copies of those decks, paste them into your own class, and repurpose the content from there. This way, you can compile your own unique class of flashcard decks that cover all the material in your specific curriculum.4. How to create great flashcardsIf you're making your own flashcards—either for yourself or for your peers or students—it is important to consider all the factors that make flashcard-based information so salient and memorable to the brain. Let's look at what goes into making the perfect flashcards for studying . . . .4.1. Organizing your flashcardsThe best way to guarantee that you'll never actually use your flashcards is to create a skyscraper stack of two billion of them. That would take you right back to that overwhelming “boil an entire lake of water” fear that tends to paralyze all of us when faced with an enormous challenge.Instead, start off by dividing your flashcards somehow. If you're using paper flashcards, this could be in the form of small stacks (wrapped by a rubber band) and "meta-stacks" that are divided into groups. Your initial groupings could be by textbook chapter or topic, for example, and then you could slowly start changing your organization system to include sub-divisions like "I know these already" and "I need to keep working on this pile."Of course, at some point, trying to keep so many paper flashcards organized (and in multiple ways) can end up getting pretty cumbersome, and that's why digital flashcards can be so convenient in helping you stay coordinated.Brainscape, for example, allows you to organize your flashcards into subjects, classes, and decks. Organize your flashcards into subjects, classes, and decks. A subject is a broad category like "science" that represents a tag by which other users can search for it on the Brainscape marketplace (unless it is private).A class typically conforms to either an exam (e.g. Series 63, WSET-2, etc.), a foreign language (e.g. Korean), or a subject at school (e.g. Anatomy 101). And in each class resides your decks of flashcards. The process of organizing your topic into decks and cards is a key step in planning what you want to study. It may even be helpful to create and name all your decks before even adding any flashcards to any of them! This serves as a sort of outline that provides mental order so that you can more confidently fill in the gaps later with the actual cards.As you break down your topic into its constituent atoms of knowledge suitable for a single flashcard, you’re clarifying what’s important, and how the information bytes are connected to each other.Finally, when it comes to ordering your cards within a deck, most users find it helpful to start with easier (or more foundational) concepts and progress toward more complex concepts. This theory of scaffolding is well supported by the learning sciences research on how to best build knowledge from the ground up.4.2. Determining what is flashcard-worthyWhen preparing for a test, it can feel tempting to make flashcards for every little fact and shred of information so that you don't miss it on the exam. But this is just impractical, particularly for knowledge-intensive subjects. You’ll end up with decks of thousands of cards!Read through the information from b'''
