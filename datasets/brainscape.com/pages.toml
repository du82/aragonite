full_description = "Whether it’s biology, chemistry, botany, or any field in science, reviewing for a science class always requires memorization of terms, theories, scientists’ names, and so on. It also requires a lot of scientific knowledge and some great study habits. While it may look overwhelming at first, doing these simple steps on studying for a science test will help you ace your tests consistently. First, you have to pay attention to what your teacher assigned in your science textbook or module. If he said review chapters 1-3, you have to review all these chapters thoroughly. Second, review your class notes. Not everything that will appear in the test is found in your textbook. Sometimes, teachers get questions from the examples or further explanations they say that are not found in the book. So always use your class notes in conjunction with your science textbook. Third, use flashcards effectively. For faster learning and memorization, flashcards are a big help, especially if used properly. However, do not stick with the manual preparation of paper cards. It will eat a lot of your time writing questions/answers, sorting which should be repeated more often, and keeping them organized for your next use. There are free web and mobile flashcard apps such as Brainscape that will sort and organize for you. You have to type the questions and answers. You may also find flashcards that are already done by your classmates, and you may ask them to share them with you. This saves you more time. Brainscape's huge universe of science flashcards is the most effective way to study for several reasons. First, they are created by other top users and teachers. The flashcards result from a collaboration among experts, publishers, teachers, tutors, and students from top universities such as Stanford and Princeton. Second, as previously mentioned, it saves you time and effort. The time you should be spending on writing and organizing flashcards may now be focused on learning and reviewing information."
