["https://brandur.org/kinesis-by-example"]
title = "Kinesis Shard Splitting & Merging by Example — brandur.org"
description = "Splitting and merging in action."
full_description = "The Kinesis developer guide covers shard splitting and merging from a high-level, but I find that it’s occasionally helpful to help solidify these types of advanced topics with examples. Here we’ll walk through what the most basic splitting and merging operations look like on a Kinesis stream to get a better feel for the concepts. First of all, I start out with a stream called split-merge-test that has a single shard. It’s come online and is in an ACTIVE state: Note above that the shard has a HashKeyRange assigned to it that starts at zero and ends at 340282366920938463463374607431768211455. When a record is sent into a Kinesis stream, a basic hash function is applied to its partition key. The result of this function maps the record to one of the stream’s shards based on the hash key range that each shard handles. A stream’s total capacity is increased by subdividing the hash key range on an existing shard so that it maps to more shards than it did before. Splitting a shard is a manual process in that an operator must decide how to divide up its total hash space between the new shards that will be created. I’ve decided to split mine evenly between two new shards, so I perform some basic arithmetic on my EndingHashKey to find the halfway point between it and zero: The stream goes into UPDATING status. The shards look as they did before because the work to change their topology is still in-progress: A few seconds later, we can see the results of our changes. There are a few key things to note below: It may also be worth pointing out that although shardId-000000000000 is considered to be CLOSED now, as the last records that it contains leave Kinesis’ retention window it will transition from CLOSED to EXPIRED. When it does, no further records can ever be retrieved from the shard. Now let’s see what happens when we merge the two shards back together. A merge operation takes two shards as parameters: (1) the main shard to merge, and (2) the adjacent shard that will be mixed into it. Note that the use of the word “adjacent” here is not an accident; because of the way that Kinesis shards handle hash key ranges, only two shards that handle ranges that are contiguous can be merged back together."
year_published = 2025
