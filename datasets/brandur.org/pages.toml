["https://brandur.org/minimal-analytics"]
title = "Minimally Invasive (and More Accurate) Analytics: GoAccess and Athena/SQL — brandur.org"
description = "A privacy and GDPR-friendly approach to producing basic and complex site analytics, and one which is more accurate in an age when adblockers reign supreme."
full_description = "For years, like most of the rest of the internet, I’ve been using Google Analytics to measure traffic to this site without thinking about it too much. To me, it’s never been anything more than a glorified hit counter, and as the product’s become more complex over the years, I’m regularly confused by its expanding interface. More recently, concerned with Google’s seemingly insatiable appetite to track us to every corner of the internet, I started looking into more privacy-friendly alternatives. I landed on Goatcounter, which purposely does not set cookies and makes no attempt to track users, and is GDPR-compliant without a notice. It’s also got a great, simple interface that’s a masterwork of UI design compared to Google’s crowded panels. Everything in one place, pretty graphs, and only the information I care about. But I soon noticed after installing it that although Goatcounter is an independent analytics product with good intentions (to track as little as possible), that doesn’t keep it safe from being included in uBlock Origin’s block list. Indeed, my own adblocker was blocking analytics for my website: This got me thinking: this site is mostly technical material, and technical people tend to use adblockers. If a big segment of my readership are using adblockers, are my analytics even accurate? If not, how far are they off? After some investigation, the answer: they are absolutely not accurate, and off by a lot. It turns out that if there’s any demographic of person who has an adblocker installed – it’s you, dear reader. I had a post from this site briefly spike to #1 on Hacker News last week, and looked at the difference between the traffic my analytics were showing, and the traffic I was actually receiving. My estimate is that I got ~2.5x more unique, non-robot visitors than reported by analytics (~38k versus ~13k), meaning that roughly 60% of users are using an adblocker. Read to the end to see how I got these numbers. If analytics products are being blocked at that level, there’s a strong argument that it’s not worth using them at all – you’re really only getting a sample of traffic rather than an even semi-complete view. So what do you do instead? Well, how about analytic’ing like its 1999 by reading log files. This is easier than it sounds because believe it or not, there’s some amazing tooling to support it."
year_published = 2025
