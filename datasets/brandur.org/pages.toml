["https://brandur.org/accessible-apis"]
title = "Developer Accessible APIs — brandur.org"
description = "A set of patterns to make APIs more accessible to developers; lowering the barrier of entry for new users, and easing the maintenance of consuming applications."
full_description = "Many providers get users started off on their API by pointing them to an extensive set of documents, designed to help build a conceptual model for those users to leverage later when they start to build something with it. Because asking users to consume significant documentation upfront is a lot to ask these days, a common pattern is to include a set of examples and tutorials to help get users up and running as quickly possible. These are effective and time-proven techniques, but there’s still room for improvement. Consider these problems: It’s possible to solve some of these problems by ensuring that APIs are developer accessible, meaning that rather than only optimizing for the case of those applications that will be consuming them over the long run, they also cater to those developers that are learning the API in order to build new products with it. Developers using the API this way will be coming in and making manual one-off calls with their tools of choice, before transcribing those calls to the more permanent medium of whatever applications they build. This kind of accessibility isn’t just good for jumpstarting new developers either. As the existing API economy becomes ever more prominent, we have to consider that over a long enough period of time, changes in either clients or the APIs themselves will inexorably lead to breakages. In such situations, we should aim to make it as easy as possible for a developer to jump in with their toolkit and quickly figure out what’s going on so that the problem can be remedied. Developer accessibility is more of an idea than any particular method, and as such there’s no definite way of implementing it, but a number of patterns that we see in the wild can help to illustrate the concept. Much of the added complexity around OAuth 1 stems from the extra layer of security that was built on top of it. OAuth 2 simply relies on HTTPS to take care of this, and the result is a much more usable protocol. While OAuth 1 APIs often need to be called through specialized consumer libraries, calls to OAuth 2 APIs can generally be made with any generic client, including plain old Curl, which significantly lowers the barrier of entry to an API."
year_published = 2025
clearnet = "https://brandur.org/accessible-apis"
