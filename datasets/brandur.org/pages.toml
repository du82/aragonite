title = "Lamenting the Death of the Page — brandur.org"
description = "How the page almost transitioned successfully to the digital world, but is in decline in new media. The lessons that we can learn from this age-old design element, and why we should hope for its re-emergence."
full_description = "Against all odds, a very useful usability pattern emerged from the constraints of the physical world around the time when written language was just taking shape: the page. Its size and form have changed throughout history to arrive at common formats that that we’d recognize today: US Letter measuring 8.5” x 11”, or the 4.25” x 6.75” size typically used for mass market paperbacks. It’s survived all the way to the present day in our printed mediums as an easily portable unit of text, but it provides major usability benefits as well. The edges of a page provide convenient points of reference for readers to track their position within a larger document, and often the width of pages are optimized to fit a highly readable 50 to 60 characters per line (although too wide for modern uses, even the 8.5” x 11” US Letter was well-suited in this respect back in the day of the typewriter). The page is also quite beautiful. Print designers have been assembling stunning products for decades that demonstrate eminently fluid layouts and a creative use of space that has yet to be matched in digital design (that’s my opinion of course). For example, here’s are a few pages from the recent redesign of Transworld Surf and the Italian magazine IL: With the rise of the computer, pages were adopted into the digital world, even if in a slightly altered format. The page construct is of course present in applications like Word and PostScript to build products that will end up on physical paper, but the page also provided a convenient metaphor for the amount of content that could be displayed on a monitor at any given time. Page up and down keys appeared to allow users to jump up and down by an entire screen of content. To this day, paging remains the standard navigational paradigm in programs like Vim to allow users efficient access to view and edit their data. If you’re not familiar with navigating content by page, try pressing your Space bar as soon as you’ve finished reading what’s on your screen. Notice how the content you see gets refreshed with no overlap and no repetition."
year_published = 2025
clearnet = "https://brandur.org/page"
