["https://brandur.org/nanoglyphs/040-rails-world"]
title = "Rails World, 7.1, Amsterdam — brandur.org"
full_description = "Last week I traveled to Amsterdam for the first ever Rails World. It was a great event – well-organized, great location, and interesting, passionate people in every direction. In 2023, you’d be forgiven for assuming that the world’s moved on from Rails, but the framework’s done an admirable job of keeping itself current, despite the quantum leaps happening in JavaScript and the browser. Tickets were gone in 45 minutes the hour they went on sale. I tried to buy one the first minute they went on sale to get early bird pricing, but all the early bird tickets were already spoken for. I was twenty seconds late. DHH’s keynote opened the conference, and was bursting at the seams with food for thought and novel ideas, reminding me of the old world circa Rails 3 where it felt like the whole web was a new frontier that was being discovered. Here’s a video. A few highlights: Some shots were jokingly taken at AirBnB and Twitter’s propensity for extreme microservice-ification, which DHH (in jest) explained as a ZIRP 1 phenomenon. Luxury pontification that’s affordable only when companies are awash in cheap money. With belts tightening, we’ll be transitioning away from extreme developer specialization to one of the renaissance developer, one who ships features across every layer of the stack (frontend, backend, infrastructure, etc.). We used to just call this a full stack developer, but I’m okay with some occasional rebranding for dramatic effect. He was quite excited for Bun, a new JavaScript runtime (yes, the JS world is reinventing itself again) and one-stop toolchain for bundling, testing, and dependency management. It’s faster than what’s out there right now, and far better integrated. But although faster builds are better than slow builds, they’re not as good as no build, and DHH talked a lot about building apps like Hey that don’t bundle their JavaScript or ship source maps, preferring to leave it in the same JS files it’s developed in. Propshaft is an ultra-minimal bundler that sets up a load path and provides digest stamping for caching and cache expiration."
year_published = 2025
