["https://brandur.org/articles"]
title = "Articles — brandur.org"
full_description = "Longer form articles that aim to explore topics in more depth, but which are published less frequently. Also available as an Atom feed. Using a two-phase data load and render pattern to prevent N+1 queries in a generalized way. Especially useful in Go, but applicable in any language. Maximizing Postgres connection economy by using a single connection per program to receive and distribute all listen/notify notifications. Using Go’s DisallowUnknownFields option to improve an API’s integration experience by making paramter naming mistakes faster to resolve. Introducing River, a Postgres-based job queue designed for resilience and correctness through strong transactional guarantees. How and why we started annotating all our Go tests with t.Parallel(), and why you might want to consider doing so too. The traditional soft deletion pattern using deleted_at columns leaks into code, curbs the usefulness of foreign keys, and makes data removal difficult. Luckily, there’s an alternative. The text type in Postgres, why it’s awesome, and why you might want to use varchar anyway. Also, a story about trying to get string parameters bounded at Stripe. A privacy and GDPR-friendly approach to producing basic and complex site analytics, and one which is more accurate in an age when adblockers reign supreme. Databases shed important RDMS features as they get big. Examining why this tends to be the case, and some ideas for preventing it. Making the sorting speed of network types in Postgres twice as fast by designing SortSupport abbreviated keys compatible with their existing sort semantics. In the spirit of the continued production of independent content, I’m running a two-week photography and writing project in Berlin called Sequences. A walkthrough of the design of a live reload feature for the static site generator that builds this site, touching on fsnotify, WebSockets, and the curious case of file 4913. How Postgres makes sorting really fast by comparing small, memory-friendly abbreviated keys as proxies for arbitrarily large values on the heap."
