["https://brandur.org/oauth-scope"]
title = "Scoping and OAuth 2 — brandur.org"
description = "Designing scope for Heroku OAuth, and a brief tour of other implementations on the web."
full_description = "Yesterday marked the beta release of OAuth for the Heroku Platform API, which we hope will empower users to develop apps against the API by providing a simple and powerful authentication framework that’s consistent with other providers across the web. One interesting discussion that developed while we were building this out was around OAuth scoping, the mechanism that allows OAuth clients to tell an authorization server what permissions they’ll need on resources they’re accessing. I thought this might be a good opportunity to talk a little about OAuth scoping, what the spec has to say about it, how it’s implemented elsewhere on the web, and our own design considerations. RFC 6749 describes how scope should be implemented according to the proposed OAuth 2 standard. I’ve tried to summarize the main points presented in the document: The spec describes the format that a scope should have and how the server should handle it, but is open-ended in respect to what strings in a scope should actually look like. This decision allows providers to define their own strings, and gives them enough flexibility to ensure that OAuth 2 scoping is a good fit for accessing a wide variety of different resources. The open-ended spec has resulted in all kinds of creative implementations across the web, with no two being exactly alike. I’ve compiled a few examples to demonstrate the range of ideas out there. App.net allows developers to define a basic set of scopes in snake_case. This pretty standard scoping implementation is simple and effective. Facebook deviates from spec a bit by suggesting that scope strings be comma-delimited. The two other interesting characteristics of Facebook scopes are that more specific strings are namespaced under their broader category (e.g. user_actions.video), and that some strings are dynamic (e.g. APP_NAMESPACE scopes to a particular app in user_actions:APP_NAMESPACE). Facebook also offers a very extensive variety of available scopes so that apps can be very precise about what powers they’ll require."
year_published = 2025
