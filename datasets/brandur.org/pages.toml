["https://brandur.org/live-reload"]
title = "Building a Robust Live Reloader with WebSockets and Go — brandur.org"
description = "A walkthrough of the design of a live reload feature for the static site generator that builds this site, touching on fsnotify, WebSockets, and the curious case of file 4913."
full_description = "For the last couple weeks I’ve been making a few upgrades to the backend that generates this site (previously), with an aim on rebuilding it to be faster, more stable, and more efficient. The source is custom, and it’d accumulated enough cruft over the years through a hundred incremental augmentations to justify a little love. I recently used Hugo for a few projects, another static site generate well-known for being one of the first written in Go, and fell in love with one of its features: live reloading. As a file changes in the generator’s development mode and a build is triggered, live reloading signals any web browsers open to the site to reload their content. Here’s a video of it in action: It’s hard to be convinced just reading about it – it doesn’t seem like a big deal to just ⌘-Tab over to the browser and ⌘-R for a refresh – but the first time you try it, it’s hard not to get addicted. Although only a tiny quality of life improvement, it’s one that makes the writing experience much more fluid. And where it’s good for writing, it’s wonderful for design, where it’s common to make minor tweaks to CSS properties one at a time by the hundreds to get everything looking exactly right. I decided to write my own live reloading implementation and was pleasantly surprised by how easy it turned out to be. The libraries available for Go to use as primitives were robust, and nicely encapsulated complicated concerns into simple APIs. Browser-level technologies like WebSockets are now reliable and ubiquitous enough to lend themselves to an easy client-side implementation with minimal fuss – just a few lines of basic JavaScript. No transpiling, no polyfills, no heavy build pipeline, no mess. The first piece of the puzzle is knowing when source files change so that we can signal a reload. Luckily Go has a great library for this in fsnotify, which hooks into operating system monitoring primitives and notifies a program over a channel when a change is detected. Basic usage is as simple as adding directories to a watcher and listening on a channel:"
