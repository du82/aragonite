["https://brandur.org/nanoglyphs/039-trails"]
title = "Trails, Charleston, `t.Parallel()` — brandur.org"
full_description = "I’ll give you my usual spiel after a long absence. This is Nanoglyph, a semi-delinquent newsletter about software whose original premise was to be weekly, but which in reality is more like a quarterly affair. If you don’t remember signing up for this, you probably did, but it was a long time ago. If you want to nope right the eff out, do me a favor by using this one-click unsubscribe instead of smashing that “mark as spam” button. I want to keep this one short because I have more to write about later this week, so without further ado. I spent the last month and a half in and out of the Sierra Nevada on the John Muir Trail, which runs 350 km (although we didn’t go that far) from Yosemite Valley south to Mount Whitney. The sights were spectacular. Pristine wilerness, alpine lakes, towering walls of endless granite, and waterfalls in every direction. California’s been in and out of drought conditions for a decade now, but this year was one of outsized precipitation, and when you’re up in the mountains, you can see the difference with your own eyes. Lakes that in other years would look a little melancholy, overflowed. Entire creeks that don’t normally exist sprung into being. Everything was green and lush. It’s been a long time since I went backpacking last, so my weeks leading up to the trip were focused inordinately on gear and logistics. What’s the latest on gas stoves and water filters? How does one go about cramming a week’s worth of dehydrated food into a bear can? 1 What’s the maximum weight I can carry for weeks at a time before my knees buckle? I was impressed by the advances in outdoor gear since I handled it last. The broad strokes are the same, but with everything a little lighter, a little easier to use, a little more water resistant, and a little better at what it did. I had a tent that weighed two pounds and with a little practice, which I could assemble in two minutes flat (the Nemo Osmo 2P). The length of the John Muir Trail is shared by the much longer Pacific Crest Trail (PCT) that runs along the western spine of the US from Canada to Mexico, so at any point if you ever make the mistake of thinking that the backpacking trip you’re on is hardcore, you’re being reminded constantly that there are people 10x more hardcore as PCT hikers zip by and up from behind. I couldn’t help but be amused by them because despite being 100s of disparate people with no relation to one another, they all look the same. They’re all wearing shorts when it’s clearly long pants weather, all have the same brand of funny half-calf sock that I don’t really know how to describe, often with gaiters, and carry packs about half the size of other backpackers. It’s not clear how they have enough gear on them to last a night, let alone weeks, and those few we stopped to ask about it also had trouble explaining it. Wiry, muscular, and with a look in their eyes that was half focused, indomitable determination, and half let-it-all-go madness."
year_published = 2025
clearnet = "https://brandur.org/nanoglyphs/039-trails"
