["https://brandur.org/mediator"]
title = "The Mediator Pattern — brandur.org"
description = "Interactors by a different name."
full_description = "Grouper published a post last week about how they use interactors in their Rails app to help keep their ActiveRecord models as lean as possible. Somewhat amusingly, while doing a major refactor of the Heroku API, we’d independently arrived at a nearly identical pattern after learning the hard way that callbacks and large models are the inviting pool whose frothy water conceals treacherous rocks. The main difference was in appellation: we called the resulting PORO’s “mediators”, a design pattern that defines how a set of objects interact. I’m not one to quarrel over naming, but I’ll use the term “mediator” throughout this article because that’s how I’m used to thinking about this pattern. The intent of this article is to build on what Grouper wrote by talking about some other nice patterns that we’ve built around the use of mediators/interactors. One goal of our usage of mediators is to consolidate all the business logic that might otherwise have to reside in a combination of an API endpoint’s body and methods on models. Ideally what remains in the endpoint should be a set of request checks like authentication, ACL, and parameters; a single call down to a mediator; and response logic like serialization and status. Here’s a small (and slightly beautified) excerpt from the API endpoint for creating an SSL Endpoint: This pattern produces a convention that helps keep important logic out of endpoints and in the more readily accessible mediator classes. It also keeps unit tests for the endpoints focused on what those endpoints are responsible for: authentication, parameter and permission checks, serialization, and the like. For success cases, we can mock out the mediator’s call and response and focus on doing more comprehensive tests on the business logic in the mediator’s own unit tests. The entire stack still gets exercised at the integration test level, but we don’t have to get into the same level of exhaustive testing there. A mocked endpoint unit test might look like the following (note that the specs are using the rr mocking syntax):"
year_published = 2025
