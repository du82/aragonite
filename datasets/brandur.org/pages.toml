full_description = "Books I've read. This is not Uber — three stars is normal. Consider four stars very good, and five stars exceptionally so. 1-2 paragraph reviews. Charming. This third book in the series leans a little too heavily on deus ex machina and previous book callbacks, but it’s succinct, and Le Guin’s writing is downright poetic. Charming. This third book in the series leans a little too heavily on deus ex machina and previous book callbacks, but it’s succinct, and Le Guin’s writing is downright poetic. A moderately useful book with an incredibly inspired title. Four thousand weeks is the number of weeks in a human lifetime assuming that a person lives until 80, and stopping to reflect on that for a moment may be as affecting to your life as the rest of the contents of the book. That said, it is a nice compendium of exercises, philosophy, and other material relevant to its core theme of mortality. I’m giving it a relatively low rating because I found it grating that despite writing about the subject of the finitude of life, the author somehow manages to veer off subject to talk about Donald Trump multiple times, naturally not wasting an opportunity to spit on him and the 50% of Americans who vote for him. Burkeman’s an Englishman who lives in England, but like any dutiful media-deranged coastal illiberal, more interested in American politics than his own. A moderately useful book with an incredibly inspired title. Four thousand weeks is the number of weeks in a human lifetime assuming that a person lives until 80, and stopping to reflect on that for a moment may be as affecting to your life as the rest of the contents of the book. That said, it is a nice compendium of exercises, philosophy, and other material relevant to its core theme of mortality. I’m giving it a relatively low rating because I found it grating that despite writing about the subject of the finitude of life, the author somehow manages to veer off subject to talk about Donald Trump multip