["https://brandur.org/fragments/invalid-byte-sequence"]
title = "ERROR: invalid byte sequence for encoding UTF8: 0x00 (and what to do about it) — brandur.org"
description = "Handling a common programming language/database asymmetry around tolerance of zero bytes."
full_description = 'Through my time at Heroku it was like a distant friend. Not one that you’d see every day, but one who’d appear to be surprise you a few dozen times a year. Since it didn’t seem to be causing any major fallout and I never heard a user complain about it, I’m somewhat embarrassed to say that in four years neither myself nor anyone else ever bothered to look into it. These days, on a Go stack and with much better control and insight into any changes we make, we’re pretty aggressive about trying to prune Sentry errors down to zero. Over a few months I’d see the 0x00 error come and go, and finally decided to look into it. The problem comes from Postgres raising an error when a caller tries to insert a text/varchar value containing a value of 0x00, or zero byte. The same value that’s used to terminate a string in plain old C. Postgres explicitly disallows it: The tricky part is that although Postgres won’t take a zero byte, almost every programming language ever created will, thereby creating a natural asymmetry between database and language stack. As far as I know, there aren’t any legitimate uses for sending a zero byte to an API or web app. Looking back through our logs, the main places I’ve seen it are from bots out on the internet, presumably using common attack patterns to probe for weaknesses, or from pentest teams that we paid to do the same. We’re using the validate framework for Go to check that API inputs are sound, like that they’re present, below a max length, or within bounds. In a language known for its verbosity, validate annotations are succinct and quick to write. The custom validations apistring200, apistrong2000, apistring20000, etc. are assigned to API string parameters in order of magnitude tiers. Their implementation denies \x00s that come in with request payloads: Notably, it also denies invalid UTF-8 byte sequences (\x00 is not desirable, but it is valid UTF-8), another common malformed input that internet bots like to send, and which will cause its own Postgres error.'
year_published = 2025
clearnet = "https://brandur.org/fragments/invalid-byte-sequence"
