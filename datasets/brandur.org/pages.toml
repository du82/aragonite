["https://brandur.org/api-upgrades"]
title = "Why Doesn't Stripe Automatically Upgrade API Versions? — brandur.org"
description = "Given a wide API surface area are small changes, most API upgrades are safe for most users. Could we upgrade their fixed API version automatically?"
full_description = "I got an interesting question while talking to a friend last night about API versioning, “Why doesn’t Stripe automatically do API upgrades for its users?” The idea is interesting enough that it’s worth digging into a little more. Some readers may be aware already that at Stripe we take a somewhat unconventional “safety first” approach to API versioning. A new version is introduced every time a backwards incompatible change is made, and there’s enough of them that they’re named after dates like 2017-02-14. There tends to be on the order of 10s of new versions in a year. The first time a user account makes a request to the API, their account is automatically locked to the current version of the API. They can override it by passing a Stripe-Version header, but any requests without will implicitly be assigned the version fixed to their account. A backwards incompatible change is one that could potentially break an existing integration. For example, removing a field from a response, or changing its JSON type. Most day-to-day changes like adding a new API endpoint or a new field to an existing response are considered forwards compatible, and a version isn’t cut for them. You can see by perusing the API changelog that most changes are fairly minor. Upgrades can be painful and time consuming for users, so we try our hardest to get the design of the API right the first time. In cases that we don’t, the changes that are made are relatively minor. For example: The Stripe API has a lot of surface area with dozens of resources and ~130 endpoints. Most people are using only a small subset of that, and any given change isn’t likely to affect them. Even if they are using an affected endpoint, it’s possible, and even likely, that they’re not using any of the fields that changed. If most upgrades are safe for most users, then it stands to reason that we could potentially upgrade people automatically so that they wouldn’t have to do it themselves. It would also make retiring older API versions possible, which is desirable, but not currently done 1."
year_published = 2025
clearnet = "https://brandur.org/api-upgrades"
