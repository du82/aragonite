["https://brandur.org/logfmt"]
title = "logfmt — brandur.org"
description = "A logging format used inside companies such as Heroku and Stripe which is optimal for easy development, consistency, and good legibility for humans and computers."
full_description = "If you’ve ever run an app on Heroku, you may have come across log messages produced by the Heroku router and wondered about their unusual formatting. Each line consists of a single level of key/value pairs which are densely packed together compared to other well-known structured formats like JSON. For example: Internally we’ve taken to calling this style of structured logging “logfmt”, and adopted it as a standard for log emission across internal components. I’ve never been able to find any good posts providing any context or background for logfmt, so I’ve written this one. Especially with a bit of practice (and ideally, colorized output), it’s pretty easy for a human being to read logfmt – an important property for any good logging format. Building a machine parser for the format is also pretty approachable. Logfmt therefore achieves pretty good readability for both human and computer, even while not being optimal for either. Splunk also recommends the same format under their best practices so we can be sure that it can be used to search and analyze all our logs in the long term. A major advantage provided by logfmt is that it helps to eliminate any guesswork that a developer would have to make while deciding what to log. Consider this log line in a more traditional format: While writing this code, a developer would’ve had to decide how to format the log line like placing the manager’s identifier in square brackets at the beginning, the module name in parenthesis at the end, with some general information in the middle. Convention can help a lot here, but it’s still a series of micro-decisions that have to be made for every log line. Furthermore, what if they want to add another piece of data like number of open fetchers? Does that belong on a new line, or in another set of brackets somewhere? Readability isn’t compromised too much, and all the developer has to do is dump any information that they think is important. Adding more data is trivial – just append num_open_fetchers=3 to the end. The developer also knows that if for any reason they need to generate a statistic on-the-fly, like the average number of fetchers still open, they’ll easily be able to do that with a simple Splunk (or equivalent) query:"
year_published = 2025
clearnet = "https://brandur.org/logfmt"
