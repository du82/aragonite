["https://brandur.org/fragments/go-max-time-duration"]
title = "Go's maximum time.Duration — brandur.org"
description = "Avoiding overflows with Go&rsquo;s <code>time.Duration</code> in the presence of exponential algorithms."
full_description = "While working on a River bug related to retry policy, I came across a case where it was actually plausible to overflow Go’s built-in time.Duration and wrap back around to negative number. A duration has a much simpler representation than a timestamp. It’s an int64 counted in nanoseconds: As the comment states, the maximum duration is about 290 years. More precisely, 292 (non-leap) years, 171 days, and 23 hours: 292 years is a long time, and it’s not likely most programs will need more than that, but our retry algorithm is exponential, and crosses that threshold after 310 retries. I fixed River’s back offs at large attempt counts by using Go 1.21’s min function combined with the maximum known number of seconds that’ll fit in a time.Duration: After hitting retry attempt 310, the algorithm backs off 292 years at a time. This behavior will never be of any real use to anybody, but I changed it to be well defined behavior of no real use to anybody, with no risk of odd bugs that might otherwise result from an overflow."
year_published = 2025
