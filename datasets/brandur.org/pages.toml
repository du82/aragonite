["https://brandur.org/go-worker-pool"]
title = "The Case For A Go Worker Pool — brandur.org"
description = "Error handling and fragility; or why a worker pool belongs in Go&rsquo;s standard library."
full_description = "When it comes to the question of what the right constructs for concurrency that a language should expose to developers, I’m a true believer that Go’s channels and goroutines are as good as it gets. They strike a nice balance between power and flexibility, while simultaneously avoiding the propensity for deadlocks that you’d see in a pthread model, the maintenance hell introduced by callbacks, or the incredible conceptual overhead of promises. However, there’s one blind spot in Go’s concurrency APIs that I find myself implementing in new Go programs time and time again: the worker pool (or otherwise known as a thread pool). Worker pools are a model in which a fixed number of m workers (implemented in Go with goroutines) work their way through n tasks in a work queue (implemented in Go with a channel). Work stays in a queue until a worker finishes up its current task and pulls a new one off. Traditionally, thread pools have been useful to amortizing the costs of spinning up new threads. Goroutines are lightweight enough that that’s not a problem in Go, but a worker pool can still be useful in controlling the number of concurrently running tasks, especially when those tasks are accessing resources that can easily be saturated like I/O or remote APIs. Implementing a worker pool in Go is by no means a tremendously difficult feat. In fact, Go By Example describes one implementation that’s only a few dozen lines of code: In this example, 3 workers are started and 9 work items are in put onto a job channel. Workers have a work loop with a time.Sleep so that each ends up working 3 jobs. close is used on the channel after all the work’s been put onto it, which signals to all 3 workers that they can exit their work loop by dropping them out of their loop on range. This implementation is meant to show the classical reason that a worker pool doesn’t need to be in Go’s standard library: the language’s concurrency primitives are already so powerful that implementing one is trivial to the point where it doesn’t even need to put into a common utility package."
year_published = 2025
