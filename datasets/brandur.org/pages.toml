["https://brandur.org/api-paradigms"]
title = "Is GraphQL the Next Frontier for Web APIs? — brandur.org"
description = "Musings on the next API technology, and whether REST-ish JSON over HTTP is just &ldquo;good enough&rdquo; to never be displaced in a significant way."
full_description = "For a long time the API community spent a lot of effort evangelizing hypermedia, which promised to make web APIs more discoverable through clients that could follow links like a human, and more future proof by re-using existing hypertext and HTTP semantics like <a> links and 301 redirects. But hypermedia had a very hard time building any kind of traction. At least some of the trouble was technical, but its biggest problem wasn’t that it wasn’t useful, but that it wasn’t useful enough. It may have had some nominal advantages over the REST-ish JSON APIs that are seen most often today, but they weren’t valuable enough to justify the extra overhead. After five years of strong evangelism at every API conference in the world and very little actual adoption, it’s a pretty safe bet that hypermedia isn’t going to be the next big thing. But that leads us to the question of what will be? Does the world even need a new API paradigm? REST-ish JSON over HTTP has proven itself to be quite practical and resilient to obsolescence; it might just be “good enough” to reign supreme for a long time to come. As a service provider, it might be tempting to think that your choice of backend technology is going to make a big difference to your users, but isn’t necessarily true. As long as you meet a minimum bar of non-offensiveness, this is almost never the case (SOAP and OAuth 1 being two examples of technologies that don’t). If there are reasonable tools available to keep the developer experience (DX) in integrating pretty good, users tend to be flexible. Avoid anything that’s too heavy, exotic, or obnoxious, and you’ll find that your users will care about the quality of your documentation far more than they do about the technology you use. Roy Fielding’s original ideas around REST are elegant and now quite widespread, but it’s worth considering that the paradigm’s actual advantages in APIs for developers are fairly unremarkable. Practically speaking, REST’s strongest points are its widespread interoperability (every language has an HTTP client) and its conventions 1. URLs are usually resources. Resources often have standard CRUD operations that are mapped to HTTP verbs like PATCH and DELETE. Status codes usually convey information. Commonly needed API mechanics like authentication and encoding are sometimes integrated into standard HTTP headers like Authorization and Content-Encoding. This is all very good; convention allows a developer to learn something once and then re-use that information to figure out how other things will probably work."
year_published = 2025
