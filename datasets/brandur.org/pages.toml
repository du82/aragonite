["https://brandur.org/kinesis-order"]
title = "Guaranteeing Order with Kinesis Bulk Puts — brandur.org"
description = "On guaranteeing order with the bulk put API of an event stream."
full_description = "Playing with Kinesis recently, we came across a problem of how to guarantee order when posting a set of records to its bulk API. This article summarizes it and talks about how although we never directly solved the problem that we thought we had, we were able to use a slightly altered approach to have the system meet some of the characteristics that we wanted to see. The basic primitive to send a record into the Kinesis API is PutRecord which allows a producer to put a single record into the stream. The API has an optional request parameter called SequenceNumberForOrdering that allows a consumer to pass in a previously-generated sequence number to guarantee that no matter what sequence number is generated for the record, it will be larger than the one you had before. You can get a better feel for this idea with this sample dialog between a record producer and the Kinesis API: Kinesis also provides a bulk API that allows many records to be injected into the stream at once called PutRecords. The bulk API has a nice characteristic in that it allows up to 1000 records, or 1 MB, per second to be written. If one of your goals is great throughput, the economy of scale that you get by wrapping all your requests up into a single HTTP envelope and sending them all through at once is considerable. Use of the bulk API introduces a problem though in that guaranteeing order becomes more difficult. Kinesis will try to order new records according to how they came in with your payload, but any given record in that request can fail, and the semantics around failures dictate that the even if a failure does occur, every non-failed record in the batch will succeed normally. Responsibility falls to the producer to detect such failures and retry them on a subsequent requests. Here we try to post three records in order (record1, record2, record3), but they will end up out-of-order in the stream due to a failure (record1 and record3 staying ordered, but the failed record2 being injected into the stream only on a retry)."
year_published = 2025
