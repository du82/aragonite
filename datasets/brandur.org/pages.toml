["https://brandur.org/uses"]
title = "Stuff I Use — brandur.org"
full_description = 'This is a "uses" page, which lists my favorite gear and software. Check out uses.tech to see the surprising number of other people who also publish one. Macbook Pro 14” M4: It’s disturbing how much time I spend on this thing. Not only all day at work, but it’s where the lion’s share of my hobbies and entertainment comes from too. I’ve lived through many of the most important personal computing advances in history, and Apple’s move to ARM chips yielded the most important. So much power that a desktop PC isn’t necessary, and so energy efficient that battery is never a problem. The MacBook Pro M4 base chip (non-Pro, non-Max) yields 24 hours of battery life. Incredible. I like to carry a tiny 20W USB-C charging brick when going to work during the day. Takes ~no space and is enough to keep the computer charged. Canon R6: Most photos on this site are shot with a Canon R6, which I’ve been shooting with for ~4 years. It’s full-frame (a must) and uses Canon’s RF lenses, which are admired industrywide. As good as smartphone cameras have gotten, I still lug this thing around because the detail and crispness of a full frame attached to real glass is that much better. Despite that, I wouldn’t give Canon more than a weak recommendation. Their software is awful, they make consumer-hostile decisions like that cameras won’t charge over USB-C while they’re turned on so that Canon can sell you a proprietary power delivery kit extra, and their claim of weather sealing on premium products like their USM lenses is extremely dubious (as I found out the hard way recently). I expect to transition off Canon eventually, possibly by surrending and embracing the supremacy of our smartphone overlords, which seems inevitable given the rate of change over the last ten years. Kindle: After about a decade, I started using a Kindle again. In the intervening years, smartphones have gotten bigger while the Kindle stayed the same. An iPhone Pro Max is the same size as a Kindle, and much heavier. Unlike iPad, I can throw a Kindle into any pocket for trips without thinking about the size/weight tradeoff). Modern models are USB-C and backlit.'
year_published = 2025
