["https://brandur.org/go-lambda"]
title = "Speed and Stability: Why Go is a Great Fit for Lambda — brandur.org"
description = "Why Go&rsquo;s stability and simple deployments is a good fit for a serverless environment."
full_description = "A few days ago in a move foreshadowed by a hint at Amazons’ re:Invent conference late last year, AWS released support for Go on its Lambda platform. Go users can now build programs with typed structs representing Lambda event sources and common responses in the aws-lambda-go SDK. These can then be compiled, bundled up into a “Lambda deployment package” (as simple as a ZIP file with a binary in it), and added to a new Lambda function by selecting “Go 1.x” as a runtime. Go fans around the world are undoubtedly celebrating the addition, but Gopher or not, this is a big step forward for everyone. Go may have its share of problems, but it has a few properties that make it an absolutely ideal fit for a serverless environment like Lambda. Lambda’s exact implementation details have always been a little mysterious, but we know a few things about them. User processes are started in sandboxed containers, and containers that have finished their execution may be kept around to service a future invocation of the same Lambda function (but might not be). Between function invocations containers are frozen, and no user code is allowed to execute. Containers also flavored with one of the preconfigured runtimes allowed by Amazon (this list is current as of January 16th): That’s a pretty good variety of languages, but more interesting is what’s missing from the list. While .NET Core and Python are relatively up-to-date, Java 9 is absent, along with any recent major version of Node (7.x, 8.x, or 9.x). Notably, major features like async/await (which landed in Node ~7.6) are still not available on the Lambda platform even a year after release. These holes tell us something else about Lambda: new runtimes are non-trivial to create, run, and/or maintain, so updated versions often lag far behind their public availability. Given that Lambda will be four years old this year, it doesn’t seem likely that Amazon will be able to to address this deficiency anytime soon. That brings us back to Go. Lambda’s Go runtime specifies version “1.x”. At first glance that might not look all that different from other languages on the list, but there’s a considerable difference: Go 1 was first released almost six years ago in March 2012!"
year_published = 2025
clearnet = "https://brandur.org/go-lambda"
