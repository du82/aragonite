["https://brandur.org/elegant-apis"]
title = "Elegant APIs with JSON Schema — brandur.org"
description = "A quick tour through some of the fundamentals of JSON Schema and Hyper-schema, and how they can be applied to building APIs."
full_description = 'We’ve recently gone on record indicating our commitment to using JSON Schema as the format for describing our API’s, then even further by releasing a set of tools to improve the process of building and working with schema-based HTTP API’s. With the recent rise of great API description formats over the last few years like Swagger, Blueprint, and RAML (among others), I wanted to write a few words on what JSON Schema is, why it’s a neat technology, and how it can be applied specifically to building great APIs. At any time, you can jump into more documentation over at jsonschema.org, which includes detailed draft specifications for both JSON Schema and JSON Hyper-schema. At its essence, JSON Schema is simply a declarative language for validating the format and structure of a JSON object. It allows you to specify a number of special primitives to describe exactly what a valid JSON object will look like, and provides a powerful nesting concept that allows you to extend these primitives to a document of any complexity. This idea hails back to the days of XML, when it was common to see XML documents linking to the XSD’s (XML Schema Definition) that should be used to validate them. Let’s start with one of the most basic schemas possible. The following describes a single value inside a JSON object: More complex rules can be mixed into the object as well. This will validate that the string matches a particular regex pattern: While the above lets us validate a single value, it’s more interesting to validate a complex JSON object. We can build on the above by nesting our single value validation into another schema using the properties keyword, which describes the keys that a JSON object might have, and the schema that validates their values: The required keyword indicates that the property name is expected, so while the object {"name":"foo"} is valid, {} is not. Note how the type keyword is present in both of the objects in our schema above. This is where the elegance of JSON Schema starts to emerge: both objects are JSON Schemas that are defined to precisely the same specification. We could give the name object its own definitions, but that would be non-sensical because it’s defined as a string rather than an object.'
year_published = 2025
