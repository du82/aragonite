["https://brandur.org/fragments/bytes-buffer-vs-strings-builder"]
title = "Go's bytes.Buffer vs. strings.Builder — brandur.org"
description = "Taking five minutes to write a benchmark so I know which of these I should be reaching for first."
full_description = "I was writing some Go code today that generated other Go code. Writing it line by line, mostly in a loop, but with pre- and post-matter. My usual go to for this type of thing is bytes.Buffer, but after I’d finished the implementation, given that I was working entirely with strings, I started to wonder if I should’ve used strings.Builder instead. I realized that I had no idea whether one was faster than the other, so I wrote a quick benchmark to check: So there you have it. At least when it comes to concatenating only strings at relatively modest sizes, strings.Builder is about 33% faster, and 80% faster than 1 than concatenating strings. Given that the DX is identical between the two, I’ll make it my new default go to. 1 Put otherwise, bytes.Buffer is 50% slower than strings.Builder and concatenating strings is 500% slower."
year_published = 2025
