["https://brandur.org/now"]
title = "Now — brandur.org"
full_description = "A now page is an occasionally updated summary of what I'm working on and what I'm thinking about based on the original concept from Derek Sivers. See atoms for a more frequently changing stream. Upgraded my M2 MacBook Air to the new M4 MacBook Pro with nanotexture. These computers don’t get major changes very often, so right after release is a good time to buy. I got the non-Pro non-Max chip variant because it has the best battery life, advertised at 24 hours, which is crazy. Revamped our ACL layer to put in support for a flexible way to organize access to a team’s resources by its members called an access group. We’re still finishing up the frontend work on this project, but the API’s finished. Using S3’s event streaming and inventory APIs, built a way to bill for S3 usage in a shared bucket for Crunchy’s new warehouse product. This is more complicated than it sounds because S3 objects aren’t just billed by size, but rather size over time. The billable unit is a GiB/mo rather than GiB. Next up will be to improve the versability of our saved queries product by adding UI configurable input parameters to queries. I’m in San Francisco, having recently returned from Rails World in Toronto, which was a lot of fun. Beyond that: I finished a massive access control refactor that builds out a more flexible RBAC (role-based access control) system for Bridge. It doesn’t sound much, but the roots of ACL run deep, and it ended up touching every important file in project, in the end taking me multiple months to fully complete. Next up is a billing system for metered storage use. Harder than it sounds on the face because you’re not just tracking storage, but storage over time. If someone stores 10 TB for most of the month but deletes every last byte before invoicing day, they should still be charged for about 10 TB. If someone spikes up to 10 TB for only a single day before deleting it all, they should be charged far less. Rather than charging per GB, you’re really charging per GB-hour."
year_published = 2025
