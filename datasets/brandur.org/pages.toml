["https://brandur.org/disallow-unknown-fields"]
title = "Web APIs: Enriched DX By Disallowing Unknown Fields — brandur.org"
description = "Using Go&rsquo;s <code>DisallowUnknownFields</code> option to improve an API&rsquo;s integration experience by making paramter naming mistakes faster to resolve."
full_description = "Go’s JSON library provides the decoder option DisallowUnknownFields which even if not intuitively obvious, is a handy option fo adding a layer of improved DX to web APIs. As the name would suggest, it causes a decoder to error when encountering a property in a JSON object being decoded that’s not present in the struct being decoded to. When a user is integrating a web API, especially in the beginning, it’s common for the initial prototype to be written by a human, and humans are prone to making mistakes. Say you’re trying to programmatically procure an access token against POST /access-tokens. The endpoint takes an optional parameter called expires_in which is a number of seconds after which the new access token will expire automatically. By virtue of reading the documentation slightly wrong, you’re accidentally sending expires: 3600 instead of expires_in: 3600. The result is that your requested expiry time is silently ignored, not only producing the wrong result, but possibly even a security leak as your account accidentally amasses access tokens that never expire. DisallowUnknownFields widely fixes this class of mistake for all an API’s users. Some code extracted from our API: It’s a feature that’s not needed every day, but it’s easy to implement, and the day it is, it’ll save hours worth of time and frustration. There are a few sharp edges to be aware of. They’re easy to avoid once you know about them, but aren’t totally apparent for those integrating the pattern for the first time. If you have an existing API with existing users, DisallowUnknownFields isn’t universally safe to turn on because there may be integrations out there that have been sending invalid JSON fields for years, but which was never a problem before. Those previously happy users become unhappy when disallowing unknown fields suddenly breaks all their requests. Start by organizing the API by pre and post DisallowUnknownFields. New API endpoints get the check automatically while existing ones default to it off."
year_published = 2025
