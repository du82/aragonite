["https://brandur.org/heroku-values"]
title = "My Heroku Values — brandur.org"
description = "Some of my favorite practices and ideas from almost four years at Heroku."
full_description = "In the spirit of Adam Wiggins’ inspiring list of Heroku values which was published when he left the company that he co-founded, I wanted to publish a list of my own now that I’ve transitioned away. My time at Heroku was easily the most valuable learning experience of my life, and I’ll always remember my time there very fondly. I remember upon first joining just how disfunctional and inefficient that it made the jobs that I’d held previously seem in contrast, and I’m hoping that by putting some of these concepts down on paper I’ll be able to reference and re-use them in my future work. I suspect that at least some of these ideas might be interesting to even those with no relation to the company. Heroku was a place founded and formed by people who came from outside the traditional corporate structure, and what resulted was a mostly divergent branch of structure compared to mostly anywhere else. Even the bad ideas should be novel enough to be intriguing in a mild way (not to suggest that there any here of course!). I should add the caveat that this is a compendium of values from the entire duration of my stay at the company; not all had been established when I got there, and not all were still in place when I left. One of the greatest pleasures during work at Heroku was the Heroku product itself. Apps could be created and deployed in seconds, which encouraged innovation by making prototyping easy, and allowed incredibly fast iteration on production products. Every company should have a Heroku-like interface for their developers to use. I wouldn’t go so far to say that companies should definitively use Heroku, but it is a good way to have one without a major investment in infrastructure. As a company scales, it might be worth putting a self-hosted one in place like Remind has done with Empire or Soundcloud has done with Bazooka (PDF warning). GitHub’s model of deploying experiments and small apps to Heroku and eventually promoting them to more dedicated infrastructure (if necessary) is also worthy of note as a pretty nice compromise between development agility and performance."
year_published = 2025
