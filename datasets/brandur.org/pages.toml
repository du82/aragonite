["https://brandur.org/canonical-log-lines"]
title = "Using Canonical Log Lines for Online Visibility — brandur.org"
description = "A lightweight and technology agnostic operational technique for easy and near realtime visibility and live querying into production systems."
full_description = "Over the next few weeks I want to post a few articles about some of my favorite operational tricks that I’ve seen while working at Stripe. The first, and easily my favorite, is the canonical log line. It’s a lightweight pattern for improved visibility into services and acts as a middle ground between other types of analytics in that it’s a good trade-off between ease of access and flexibility. We could say that many production systems (following standard industry practices) emit “tiers” of operation information: While metrics provide fast feedback on specific and commonly-used system measurements, they’re not well suited for allowing information to be queried arbitrarily and ad-hoc. They’re perfect for answering a question that’s known ahead of time like “how many requests per second is my stack doing?”, but less useful for questions that are thought up on the spot like “how many requests per second is userXYZ making to my stack via TLS 1.0?” Log traces can answer the latter question, but often make such analysis difficult because they tend to have poor signal-to-noise ratio when looking for specific information. They can be difficult to navigate even with sophisticated logging systems like Splunk. The concept is simple: a canonical line is a big log line (probably in logfmt) that gets emitted at the end of a request 1. It’s filled with fields for all of that request’s key information. After emitting canonical lines, the next step is to put them somewhere useful. At Stripe we use a two prong approach combining Splunk and Redshift. Splunk is a powerful shorter-term store that’s great for getting fast insight into online systems. It’s great for: These traits make Splunk ideal for operational work where we might be in the midst of an incident and need information immediately. The downside of Splunk is that it’s expensive to license and run, and your retention is generally limited by your total capacity being eaten up by the reams of raw information being pushed into the system. It’s not an unusual sight to see our operations teams at Stripe trying to prune the traces of our highest traffic systems to keep Splunk running under quota 2."
year_published = 2025
clearnet = "https://brandur.org/canonical-log-lines"
