["https://brandur.org/antipatterns"]
title = "Healthy Anti-patterns — brandur.org"
description = "When the use of an anti-pattern is considered beneficial."
full_description = "In Tracing Request IDs, I briefly talked about the possibility of making a request ID easily available from anywhere in an app through a pattern called the request store. It’s a simple construct that stores data into Ruby’s thread-local context: Middleware is then used in an app which makes sure that all context that was added to the store is cleared between requests: I usually take it a bit further in a larger application, where it’s been my habit to extend the original pattern so that we inventory exactly what it’s supposed to contain, making it more difficult to accidentally create opaque dependencies by mixing data in randomly: Much like the infamous singleton pattern, the request store introduces global state into its application, which in turn makes it more difficult to reason about the dependencies of any given piece of code. Global state can have other side effects too, like making testing more difficult; globals that initialize themselves implicitly can be hard to set without a great stubbing framework, and will keep their value across multiple test cases, which is surprising behavior for anyone not expecting it. This sort of technique is slightly less controversial in the world of dynamic languages (where you often have something like a GIL to save you from race conditions across threads) , but I think it’s safe to say that my highly pattern-oriented colleagues back in the enterprise world would have chastised me for considering the use of global state of any kind. Instead, they’d strongly prefer the use of a dependency injection framework to make certain information accessible from anywhere in an app. Despite all this, from an engineering perspective the side effects of using the request store over time have been minimal. By staying vigilant in making sure that it doesn’t creep beyond its originally intended use, the request store becomes a very convenient way to store a few pieces of global state that would otherwise be very awkward to access. We keep its use in check by coming to consensus on what can get added to it through discussion in pull requests."
year_published = 2025
clearnet = "https://brandur.org/antipatterns"
