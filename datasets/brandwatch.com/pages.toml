remove('focused'); }, false); } } const toggleInputs = function(parentElem, disabled) { let inputs = parentElem.querySelectorAll('input, select, textarea, button'); for (let i = 0; i < inputs.length; i++) { inputs[i].disabled = disabled; } } const disableSquishedFieldsetInputs = () => { let elements = form.querySelectorAll('.c-form-set[data-step]'); elements.forEach(element => { let observer = new MutationObserver(function(mutations) { mutations.forEach(function(mutation) { if (mutation.attributeName === "class") { if (element.classList.contains('c-form-set--squished')) { toggleInputs(element, true); } else { toggleInputs(element, false); } } }); }); let config = { attributes: true }; observer.observe(element, config); }); } const multiForm = document.querySelector('form.c-form-multistep'); if (multiForm) { disableSquishedFieldsetInputs(); showFormStep(currentFormStep); setFirstLastNameWidths(); updateProgressBars(); initToggleMenu(); addInputFocusClass(); let fieldsets = form.querySelectorAll('fieldset[data-step]'); fieldsets.forEach(fieldset => { let index = fieldset.dataset.step; let stepInputs = fieldset.querySelectorAll('input'); const nextButton = createNextButton(fieldset); const validationElement = createValidationElement(); if (!nextButton) { return; } if (index == 1) { let nextWrapper = document.createElement('div'); nextWrapper.classList.add('c-input-button-wrap', 'flex-row-lg', 'flex-column'); let lastInput = stepInputs[stepInputs.length - 1]; lastInput.insertAdjacentElement("afterend", nextWrapper); nextWrapper.appendChild(lastInput); nextWrapper.appendChild(validationElement); nextWrapper.appendChild(nextButton); } else { const nextButtonWrapper = document.createElement('div'); nextButtonWrapper.classList.add('c-form-set', 'c-form-set--action'); nextButtonWrapper.appendChild(nextButton); fieldset.appendChild(validationElement); fieldset.appendChild(nextButtonWrapper); } nextButton.addEventListener('click', nextFormStep); }); // Add event listeners form.addEventListener('keydown', handleFormEnterPress); // Show first step const firstStep = document.querySelector('fieldset[data-step="1"]'); if (firstStep) { firstStep.classList.remove('c-form-set--squished'); } }'''
