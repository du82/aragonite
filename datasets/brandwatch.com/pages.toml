["https://www.brandwatch.com/legal/author-privacy-policy"]
title = "Online author privacy statement |  Brandwatch"
description = "Existing customer?Log in to access your existing Falcon products and data via the login menu on the top right of the page.New customer?You'll find the former Falcon products under 'Social Media Management' if you go to 'Our Suite' in the navigation."
full_description = "If you publish information on publicly available websites or social media platforms (e.g. Twitter, Instagram, Facebook, etc.), Brandwatch may have collected Personal Data about you. This is because Brandwatch operates a service that collects publicly available information from the Internet, analyzes it, puts it in a database, and offers access to its database, along with analytics, to companies who want to understand how consumers react to their brand and campaigns online. All the information we collect is already publicly available. The information is also information that you chose to publish online – we just collect it, index it, and put it all in the same place. This makes the data easier to search for what people are talking about online, and what they think of certain brands. We know how valuable your privacy is to you. You can trust us to handle it carefully. We work to keep your Personal Data secure, and we place restrictions on our customers’ use of the data they access through us. Also remember: you are in control of your data. First, you have choices about what you post online, the platforms you use, and the privacy settings that apply to your posts. Second, you have legal rights depending on where you live and on our legal obligations. For example, you can ask us to show you what data we have about you, make us correct that data if it is inaccurate, and even ask us to delete or stop using the data. This privacy statement addresses how we handle the personally identifiable information (“Personal Data”) that Brandwatch collects and processes about individual authors of online content (“Author”, “you” or “your”) through the Services that we offer to our customers. This privacy statement applies to you if you publish information on publicly available websites (Twitter, Instagram, Facebook, Reddit etc.) that we collect data from. We refer to you as a “content author”. For reference, we are Runtime Collective Limited, and we trade as Brandwatch (“we”, “us” or “Brandwatch”). Our registered office address is at 5 Churchill Pl, London E14 5HU, United Kingdom. Our company number is 03898053 and our VAT number is 754 7507 10. Our subsidiaries, such as Crimson Hexagon, Inc. and Paladin Software, LLC, and our affiliates such as Falcon.io ApS and Falcon.io US Inc may also act as a data controller from time to time. We act as the data controller of the Personal Data that we process about you."
year_published = 2025
