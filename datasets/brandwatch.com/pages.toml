 Finance inquiries Support - Consumer Intelligence (Brandwatch Consumer Research and Add-ons) Support - Social Media Management (formerly the Falcon Product Suite) Other Please press submit and you will be redirected to the support form for more details What solution are you interested in? * Social Media Management Social Listening & Consumer Insights Influencer Marketing Not Sure You can choose more than one. Sign up to get new insights, research tips, event invites, & product news. You can unsubscribe at any time * Select... Yes No Annual Revenue: Company Size: Job Title: bwurl: GCLID: utm_campaign: utm_content: utm_medium: utm_source: utm_term: bw_site_geo_ip: Optimizely Visitor ID: ZoomInfo Company Size: hp_street: cq_req_id: cq_tag_hash: * Indicates a required field Submit By submitting this form you agree to Brandwatch’s user privacy statement. (function() { var forms = document.querySelectorAll("[data-form-instance-uid=\"form1\"]"); if (forms.length !== 1) { return; } forms[0].onsubmit = function(ev) { ev.preventDefault(); ev.stopPropagation(); alert("An error on this page stopped this form submitting.\n\nWe're really sorry about this, please try again, or get in touch and we’ll help you out."); }; })(); const form = document.querySelector('.js-form-outer'); let formEnclosed = document.querySelector('.c-form-enclosed'); const progressBarWrappers = document.querySelectorAll('.c-form-progress-bar-wrapper'); const formSubmit = document.querySelector('.c-form-set.c-form-set--action'); const formSteps = document.querySelectorAll('fieldset.c-form-set'); const lastStep = formSteps.length; let currentFormStep = 1; const showFormStep = step => { Array.from(formSteps).forEach((stepElem, index) => { stepElem.classList.toggle('c-form-set--squished', parseInt(stepElem.dataset.step, 10) !== step); formSubmit.classList.toggle('c-form-set--squished', currentFormStep !== lastStep); }); }; // Set width of first and last name fields to half of the form const setFirstLastNameWidths = () => { Array.from(formSteps).forEach((stepElem, index) => { const firstName = stepElem.querySelector('input[name="FirstName"]'); const lastName = stepElem.querySelector('input[name="LastName"]'); if (firstName && lastName) { const flexWrapper = document.createElement('div'); flexWrapper.classList.add('df', 'flex-justify-between', 'flex-row-lg', 'flex-column', 'mb3'); flexWrapper.style.gap = '0.7rem'; firstName.closest('.c-form-set').style.marginBottom = '0'; lastName.closest('.c-form-set').style.marginBottom = '0'; firstName.closest('.c-form-set').classList.add('flex-grow-1'); lastName.closest('.c-form-set').classList.add('flex-grow-1'); firstName.closest('.c-form-set').parentNode.insertBefore(flexWrapper, firstName.closest('.c-form-set')); flexWrapper.appendChild(firstName.closest('.c-form-set')); flexWrapper.appendChild(lastName.closest('.c-form-set')); } }); }; const nextFormStep = () => { let currentFieldset = document.querySelector('fieldset:not(.c-form-set--squished)'); let nextButton = getCurrentNextButton(); // Send nextstep event to form, so that it can validate the current step const event = new CustomEvent('nextstep', { detail: { next_button: nextButton, callback_fail: () => {}, callback_success: () => { currentFormStep++; if (nextButton && currentFormStep <= lastStep) { nextButton.classList.add('c-form-set--squished'); } showFormStep(currentFormStep); } } }); multiForm.dispatchEvent(event); updateProgressBars(); }; const disableNextButton = () => { nextButton.removeEventListener('click', nextFormStep); }; // Function to create the validation element const createValidationElement = () => { const validationMsg = document.createElement('div'); validationMsg.classList.add('c-validation-msg'); const spanElement = document.createElement('span'); spanElement.classList.add('c-validation-msg__text'); validationMsg.appendChild(spanElement); return validationMsg; }; const getCurrentNextButton = () => { let nextButton = null; let fieldsetIndex = parseInt(currentFormStep, 10); if (fieldsetIndex == 1) { nextButton = document.querySelector('.multistep-cta-button'); } else { nextButton = document.querySelector('.multistep-next-button'); } return nextButton; }; const getStepButton = (fieldsetIndex) => { let stepButton = null; if (fieldsetIndex == 1) { stepButton = document.querySelector('.multistep-cta-button'); } else { stepButton = document.querySelector('.multistep-next-button'); } return stepButton; }; const createNextButton = (fieldset) => { let fieldsetsCount = form.querySelectorAll('fieldset').length; let fieldsetIndex = parseInt(fieldset.dataset.step, 10); if (fieldsetIndex === fieldsetsCount) { return; } let stepButton = getStepButton(fieldsetIndex); // Clone the Button const nextButton = stepButton.cloneNode(true); // Remove the "dn" class nextButton.classList.remove('dn'); return nextButton; }; function handleFormEnterPress(event) { if (event.key === 'Enter') { event.preventDefault(); let focusedElement = document.activeElement; // Check if the focused element is a checkbox if (focusedElement.type === 'checkbox') { focusedElement.checked = !focusedElement.checked; // Toggle the checkbox return; } let nextButton = getCurrentNextButton(); nextFormStep(); } } function handleFormSubmit(event) { event.preventDefault(); } function updateProgressBars() { if (!formEnclosed) { return; } let formSpacing = parseInt(window.getComputedStyle(formEnclosed).getPropertyValue('padding-left')); let progressBarOffset = formSpacing + 2; // there is 2px space between the form and the progress bar that needs to be accounted for progressBarWrappers.forEach((progressBarWrapper) => { progressBarWrapper.style.left = `-${progressBarOffset}px`; progressBarWrapper.style.right = `-${progressBarOffset}px`; }); } function initToggleMenu() { if (!document.querySelector('.c-toggle')) { return; } var toggles = document.querySelectorAll('.c-toggle'); toggles.forEach(function(toggle) { var checkbox = toggle.querySelector('.c-toggle__native'); checkbox.addEventListener('change', function() { if (this.checked) { toggle.classList.add('c-toggle--checked'); } else { toggle.classList.remove('c-toggle--checked'); } }); }); } const addInputFocusClass = () => { let inputs = form.querySelectorAll('input'); for (let i = 0; i < inputs.length; i++) { inputs[i].addEventListener('focus', function() { this.parentNode.parentNode.classList.add('focused'); }, false); inputs[i].addEventListener('blur', function() { this.parentNode.parentNode.classList.remove('focused'); }, false); } } const toggleInputs = function(parentElem, disabled) { let inputs = parentElem.querySelectorAll('input, select, textarea, button'); for (let i = 0; i < inputs.length; i++) { inputs[i].disabled = disabled; } } const disableSquishedFieldsetInputs = () => { let elements = form.querySelectorAll('.c-form-set[data-step]'); elements.forEach(element => { let observer = new MutationObserver(function(mutations) { mutations.forEach(function(mutation) { if (mutation.attributeName === "class") { if (element.classList.contains('c-form-set--squished')) { toggleInputs(element, true); } else { toggleInputs(element, false); } } }); }); let config = { attributes: true }; observer.observe(element, config); }); } const multiForm = document.querySelector('form.c-form-multistep'); if (multiForm) { disableSquishedFieldsetInputs(); showFormStep(currentFormStep); setFirstLastNameWidths(); updateProgressBars(); initToggleMenu(); addInputFocusClass(); let fieldsets = form.querySelectorAll('fieldset[data-step]'); fieldsets.forEach(fieldset => { let index = fieldset.dataset.step; let stepInputs = fieldset.querySelectorAll('input'); const nextButton = createNextButton(fieldset); const validationElement = createValidationElement(); if (!nextButton) { return; } if (index == 1) { let nextWrapper = document.createElement('div'); nextWrapper.classList.add('c-input-button-wrap', 'flex-row-lg', 'flex-column'); let lastInput = stepInputs[stepInputs.length - 1]; lastInput.insertAdjacentElement("afterend", nextWrapper); nextWrapper.appendChild(lastInput); nextWrapper.appendChild(validationElement); nextWrapper.appendChild(nextButton); } else { const nextButtonWrapper = document.createElement('div'); nextButtonWrapper.classList.add('c-form-set', 'c-form-set--action'); nextButtonWrapper.appendChild(nextButton); fieldset.appendChild(validationElement); fieldset.appendChild(nextButtonWrapper); } nextButton.addEventListener('click', nextFormStep); }); // Add event listeners form.addEventListener('keydown', handleFormEnterPress); // Show first step const firstStep = document.querySelector('fieldset[data-step="1"]'); if (firstStep) { firstStep.classList.remove('c-form-set--squished'); } }'''
