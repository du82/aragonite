["https://www.brandwatch.com/products/iris-ai"]
title = "Brandwatch Iris AI - Streamline your research and social media management"
description = "Existing customer?Log in to access your existing Falcon products and data via the login menu on the top right of the page.New customer?You'll find the former Falcon products under 'Social Media Management' if you go to 'Our Suite' in the navigation."
full_description = "Iris is your AI companion, using a unique combination of proprietary AI and integrations with large language models to help you unlock the true power of generative AI. From research to content creation, Iris is here to help. Discover and analyze a vast number of online conversations quickly.Iris search lets you choose any brand, product, or topic and instantly returns relevant conversations – without the need to write boolean queries from scratch.Iris peak detection deep dives into a large set of online conversations to pinpoint and explain spikes in overall volumes or categories, helping you surface trends faster. Deep dive into a large amount of online data to explain topics and audiences that are driving online conversations.Iris unlocks the full power of large language models by combining them intelligently with proprietary AI and instantly summarizing insights behind every trend, spike or anomaly in your data.Iris topic analysis turns keyword clouds into automatically curated analysis of the key entities and themes in your data. Powered by OpenAI, Iris writing assistant is here to help you with everything related to creating text: from social posts and ads, to replies to customers’ messages. Iris can make your drafts better by improving text and it can also create social posts from scratch based on your brand's personality.Iris can automatically create replies for your customers’ inquiries based on a conversation’s context. Powered by OpenAI, Iris content insights analyzes your social media posts as well as those of your competitors to inform your social media decision-making.Iris summarizes your competitors’ latest posts on social to identify their social media strategies; themes, topics, hashtags of their posts.Iris compares your posts and its comments by users to help identify your best performing posts. We are constantly exploring new ways to turn the latest developments into trustworthy, scalable and efficient solutions. We combine human curation with proprietary and generative AI to unlock reliable insights for strategic decision making."
year_published = 2025
