title = "5 Social Media News Stories You Need to Read This Week | Brandwatch"
description = "Existing customer?Log in to access your existing Falcon products and data via the login menu on the top right of the page.New customer?You'll find the former Falcon products under 'Social Media Management' if you go to 'Our Suite' in the navigation."
full_description = "Meta is expanding its video arsenal with Edits, a new short-form video creation app designed for more dynamic and collaborative storytelling. Confirmed by Instagram chief Adam Mosseri, Edits will feature a dedicated inspiration tab, an upgraded camera for higher-quality content, and a unique draft-sharing function that lets users collaborate before hitting publish. The app is available for pre-order in App Store, with a launch expected on March 13. With Edits, users can record up to 10 minutes of footage, fine-tune clips with a playback timeline, explore trending sounds, and access video analytics. But the standout features are its collaboration tools, allowing multiple users to edit a project together, and AI-powered effects, including the ability to animate still images. Instagram is shaking up profile layouts by replacing classic square thumbnails with vertical ones. According to Adam Mosseri, the change reflects how most users now engage with the platform. While the update disrupts carefully curated grid aesthetics, Mosseri assures users that enhanced thumbnail customization options are on the way. BuzzFeed is exploring the launch of its own social media platform, aiming to create a more positive and engaging digital space. CEO Jonah Peretti has hinted at a platform designed to foster creativity and community, steering away from the algorithm-driven negativity seen on mainstream social networks. While details are still incoming, BuzzFeed is inviting early users to sign up for access, signaling an experimental approach that will evolve based on feedback. The app has been tentatively named Island (because of its website URL). In their manifesto, Jonah states: “We know we are swimming against the tide, the platforms don't care or understand content, and they have all surrendered to a depressing form of AI-powered recommendation that gives SNARF a structural advantage. But I know we can still have success, and look forward to counter-programming with our human creativity fighting against the machine. The tide is starting to shift and we will benefit from the growing dissatisfaction with the big platforms.”"
