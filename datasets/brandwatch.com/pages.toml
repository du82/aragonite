["https://www.brandwatch.com/company/about"]
title = "Brandwatch | About Us"
description = "Existing customer?Log in to access your existing Falcon products and data via the login menu on the top right of the page.New customer?You'll find the former Falcon products under 'Social Media Management' if you go to 'Our Suite' in the navigation."
full_description = "With Brandwatch, brands and agencies can adapt and thrive in today's fast moving digital world by making smarter decisions and executing data-driven social strategies at every customer touchpoint. I am an accomplished leader and board director with experience spanning multiple industries including technology, financial services, and consulting. Most recently I served as CEO of HireRight, where I led its IPO in 2021 and its take-private transaction in 2024. Prior to HireRight, I held senior roles at organizations such as Experian, Tallan, Ingram Micro, KPMG Consulting, and Exxon/Mobil, consistently delivering transformative growth, innovative solutions, and operational excellence. I hold a Bachelor’s degree in Chemical Engineering from New Jersey Institute of Technology (NJIT) and an MBA from Georgetown University. I’m known for my collaborative leadership style and commitment to empowering teams to succeed. With more than 15 years of accounting and finance experience working in consulting and corporate, I oversee Cision's finance and accounting functions as Chief Financial Officer. Prior to Cision I was Senior Vice President of Portfolio Operations at Platinum Equity. I was also Senior Vice President Transformation at Key Energy Services, and Vice President, Corporate Controller/Treasurer/Business Transformation at BlueLine Rental. Before moving to corporate, I worked in Alvarez & Marsal’s restructuring practice. I’m a CPA and received my Bachelor of Business Administration from Emory University. I reside in Chicago with my wife and children. I’m Channing Ferrer and I’m the President of Brandwatch. Over the course of my career, I’ve had the privilege of being a revenue leader, advisor, and early-stage investor to numerous global technology companies in various phases of growth, and have enjoyed building revenue teams and improving processes across many of the companies I’ve worked with. Prior to joining Brandwatch, I held roles as Chief Sales Officer for Semrush, and Chief Revenue Officer for Built In. I also led the growth of HubSpot from $200m to $1.5b in revenue over a 6-year period, building the GTM operating system, KPIs, processes, and tools they continue to leverage today."
