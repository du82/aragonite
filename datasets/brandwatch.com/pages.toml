["https://www.brandwatch.com/legal/information-security"]
title = "The Brandwatch Security Programme |  Brandwatch"
description = "Existing customer?Log in to access your existing Falcon products and data via the login menu on the top right of the page.New customer?You'll find the former Falcon products under 'Social Media Management' if you go to 'Our Suite' in the navigation."
full_description = "Brandwatch maintains a comprehensive security programme to support regulatory compliance, preserve customer trust, and safeguard the security, privacy, confidentiality, integrity, and availability of systems processing confidential information. All Brandwatch products are ISO 27001:2022 certified. For our customers, this means that the products you use are safely operating under the requirements of ISO 27001 and that all data is processed accordingly. We engage a third party to audit our adherence to these standards at least annually. Our current ISO 27001 certificate is available upon request. The Brandwatch security team is staffed by dedicated professionals reporting directly to executive management and our board of directors. Brandwatch provides a suite of products and services under two solution groups, on one hand Consumer Intelligence, that includes our flagship product Consumer Research, Vizia and Brandwatch Reviews, and on the other hand Social Media Management which is comprised of Publish, Listen, Audience, Engage, Measure, Advertise, Benchmark and Influence. All Brandwatch employees receive information about our policies and procedures as they relate to security and data privacy. Brandwatch employees must review and sign an Acceptable Use Policy and undergo security and data privacy training upon hire and at least annually thereafter. Brandwatch performs Reference and/or Background checks for all new hires according to local laws; Brandwatch Human Resource Policy and regulations as a condition of hire. The different components of the Brandwatch product suite are hosted across a variety of services in order to take advantage of the benefits of different classes of infrastructure and ensure continuous, uninterrupted availability of the platform. Each of these service providers are held to the same standards we hold ourselves, and we assess their security practices annually. We make extensive use of Amazon Web Services (AWS). For BCR, raw data ingestion, indexing, analysis, and storage takes place in AWS in the US. AWS is certified to a wide range of compliance and security standards, available for review here."
year_published = 2025
clearnet = "https://www.brandwatch.com/legal/information-security"
