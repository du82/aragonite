rstName.closest('.c-form-set')); flexWrapper.appendChild(lastName.closest('.c-form-set')); } }); }; const nextFormStep = () => { let currentFieldset = document.querySelector('fieldset:not(.c-form-set--squished)'); let nextButton = getCurrentNextButton(); // Send nextstep event to form, so that it can validate the current step const event = new CustomEvent('nextstep', { detail: { next_button: nextButton, callback_fail: () => {}, callback_success: () => { currentFormStep++; if (nextButton && currentFormStep <= lastStep) { nextButton.classList.add('c-form-set--squished'); } showFormStep(currentFormStep); } } }); multiForm.dispatchEvent(event); updateProgressBars(); }; const disableNextButton = () => { nextButton.removeEventListener('click', nextFormStep); }; // Function to create the validation element const createValidationElement = () => { const validationMsg = document.createElement('div'); validationMsg.classList.add('c-validation-msg'); const spanElement = document.createElement('span'); spanElement.classList.add('c-validation-msg__text'); validationMsg.appendChild(spanElement); return validationMsg; }; const getCurrentNextButton = () => { let nextButton = null; let fieldsetIndex = parseInt(currentFormStep, 10); if (fieldsetIndex == 1) { nextButton = document.querySelector('.multistep-cta-button'); } else { nextButton = document.querySelector('.multistep-next-button'); } return nextButton; }; const getStepButton = (fieldsetIndex) => { let stepButton = null; if (fieldsetIndex == 1) { stepButton = document.querySelector('.multistep-cta-button'); } else { stepButton = document.querySelector('.multistep-next-button'); } return stepButton; }; const createNextButton = (fieldset) => { let fieldsetsCount = form.querySelectorAll('fieldset').length; let fieldsetIndex = parseInt(fieldset.dataset.step, 10); if (fieldsetIndex === fieldsetsCount) { return; } let stepButton = getStepButton(fieldsetIndex); // Clone the Button const nextButton = stepButton.cloneNode(true); // Remove the "dn" class nextButton.classList.remove('dn'); return nextButton; }; function handleFormEnterPress(event) { if (event.key === 'Enter') { event.preventDefault(); let focusedElement = document.activeElement; // Check if the focused element is a checkbox if (focusedElement.type === 'checkbox') { focusedElement.checked = !focusedElement.checked; // Toggle the checkbox return; } let nextButton = getCurrentNextButton(); nextFormStep(); } } function handleFormSubmit(event) { event.preventDefault(); } function updateProgressBars() { if (!formEnclosed) { return; } let formSpacing = parseInt(window.getComputedStyle(formEnclosed).getPropertyValue('padding-left')); let progressBarOffset = formSpacing + 2; // there is 2px space between the form and the progress bar that needs to be accounted for progressBarWrappers.forEach((progressBarWrapper) => { progressBarWrapper.style.left = `-${progressBarOffset}px`; progressBarWrapper.style.right = `-${progressBarOffset}px`; }); } function initToggleMenu() { if (!document.querySelector('.c-toggle')) { return; } var toggles = document.querySelectorAll('.c-toggle'); toggles.forEach(function(toggle) { var checkbox = toggle.querySelector('.c-toggle__native'); checkbox.addEventListener('change', function() { if (this.checked) { toggle.classList.add('c-toggle--checked'); } else { toggle.classList.remove('c-toggle--checked'); } }); }); } const addInputFocusClass = () => { let inputs = form.querySelectorAll('input'); for (let i = 0; i < inputs.length; i++) { inputs[i].addEventListener('focus', function() { this.parentNode.parentNode.classList.add('focused'); }, false); inputs[i].addEventListener('blur', function() { this.parentNode.parentNode.classList.remove('focused'); }, false); } } const toggleInputs = function(parentElem, disabled) { let inputs = parentElem.querySelectorAll('input, select, textarea, button'); for (let i = 0; i < inputs.length; i++) { inputs[i].disabled = disabled; } } const disableSquishedFieldsetInputs = () => { let elements = form.querySelectorAll('.c-form-set[data-step]'); elements.forEach(element => { let observer = new MutationObserver(function(mutations) { mutations.forEach(function(mutation) { if (mutation.attributeName === "class") { if (element.classList.contains('c-form-set--squished')) { toggleInputs(element, true); } else { toggleInputs(element, false); } } }); }); let config = { attributes: true }; observer.observe(element, config); }); } const multiForm = document.querySelector('form.c-form-multistep'); if (multiForm) { disableSquishedFieldsetInputs(); showFormStep(currentFormStep); setFirstLastNameWidths(); updateProgressBars(); initToggleMenu(); addInputFocusClass(); let fieldsets = form.querySelectorAll('fieldset[data-step]'); fieldsets.forEach(fieldset => { let index = fieldset.dataset.step; let stepInputs = fieldset.querySelectorAll('input'); const nextButton = createNextButton(fieldset); const validationElement = createValidationElement(); if (!nextButton) { return; } if (index == 1) { let nextWrapper = document.createElement('div'); nextWrapper.classList.add('c-input-button-wrap', 'flex-row-lg', 'flex-column'); let lastInput = stepInputs[stepInputs.length - 1]; lastInput.insertAdjacentElement("afterend", nextWrapper); nextWrapper.appendChild(lastInput); nextWrapper.appendChild(validationElement); nextWrapper.appendChild(nextButton); } else { const nextButtonWrapper = document.createElement('div'); nextButtonWrapper.classList.add('c-form-set', 'c-form-set--action'); nextButtonWrapper.appendChild(nextButton); fieldset.appendChild(validationElement); fieldset.appendChild(nextButtonWrapper); } nextButton.addEventListener('click', nextFormStep); }); // Add event listeners form.addEventListener('keydown', handleFormEnterPress); // Show first step const firstStep = document.querySelector('fieldset[data-step="1"]'); if (firstStep) { firstStep.classList.remove('c-form-set--squished'); } } Request your Brandwatch demo Curious about how Brandwatch can help you better un