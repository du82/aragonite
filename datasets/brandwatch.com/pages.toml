description = "Existing customer?Log in to access your existing Falcon products and data via the login menu on the top right of the page.New customer?You'll find the former Falcon products under 'Social Media Management' if you go to 'Our Suite' in the navigation."
full_description = "LinkedIn stands as the unparalleled professional network globally, boasting a vast community of over 500 million members spanning across 200 countries and territories. This influential platform serves as the top choice for numerous brands seeking employee recruitment and engaging in effective business-to-business marketing strategies. With its expansive reach and professional focus, LinkedIn offers exceptional opportunities for networking and growing professional connections. Within Consumer Research, you can track and authenticate your own LinkedIn pages, which provides 100% coverage of up to 200 posts within the last year. Track images, videos, captions, likes, and impressions to be able to view how your brand is being mentioned by professionals. With Publish it is easy to manage your LinkedIn activity alongside your other social media channels. Easily draft, schedule and publish content on your LinkedIn company page or personal profiles using Brandwatch’s collaboration workflows, the unified calendar and shared library. Easily create engaging content in multiple formats, including Document posts, and save valuable time with Publish. Connect with your LinkedIn audience using Engage. Reply to Pages messages, comments and even mentions of your brand on posts. Set up feeds and messaging automations to make sure no interaction with your page goes unanswered. Use Engage’s collaboration workflows; labels, notes, and assignments to engage faster and save precious time using Brandwatch. Our comprehensive Social Media Management tool enables you to unlock a complete 12-months (or 200 posts – whichever is less) of historical LinkedIn data from your owned pages. Track comments on your owned posts to view how your brand is being mentioned by business professionals. Create LinkedIn campaigns, campaign groups and ads directly from Advertise – alongside the rest of your social media ads. Draw conclusions and understand which channels are more effective to your marketing strategy. Also, you can turn organic LinkedIn posts into ads with one click."
