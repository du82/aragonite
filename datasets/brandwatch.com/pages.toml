form-set').style.marginBottom = '0'; firstName.closest('.c-form-set').classList.add('flex-grow-1'); lastName.closest('.c-form-set').classList.add('flex-grow-1'); firstName.closest('.c-form-set').parentNode.insertBefore(flexWrapper, firstName.closest('.c-form-set')); flexWrapper.appendChild(firstName.closest('.c-form-set')); flexWrapper.appendChild(lastName.closest('.c-form-set')); } }); }; const nextFormStep = () => { let currentFieldset = document.querySelector('fieldset:not(.c-form-set--squished)'); let nextButton = getCurrentNextButton(); // Send nextstep event to form, so that it can validate the current step const event = new CustomEvent('nextstep', { detail: { next_button: nextButton, callback_fail: () => {}, callback_success: () => { currentFormStep++; if (nextButton && currentFormStep <= lastStep) { nextButton.classList.add('c-form-set--squished'); } showFormStep(currentFormStep); } } }); multiForm.dispatchEvent(event); updateProgressBars(); }; const disableNextButton = () => { nextButton.removeEventListener('click', nextFormStep); }; // Function to create the validation element const createValidationElement = () => { const validationMsg = document.createElement('div'); validationMsg.classList.add('c-validation-msg'); const spanElement = document.createElement('span'); spanElement.classList.add('c-validation-msg__text'); validationMsg.appendChild(spanElement); return validationMsg; }; const getCurrentNextButton = () => { let nextButton = null; let fieldsetIndex = parseInt(currentFormStep, 10); if (fieldsetIndex == 1) { nextButton = document.querySelector('.multistep-cta-button'); } else { nextButton = document.querySelector('.multistep-next-button'); } return nextButton; }; const getStepButton = (fieldsetIndex) => { let stepButton = null; if (fieldsetIndex == 1) { stepButton = document.querySelector('.multistep-cta-button'); } else { stepButton = document.querySelector('.multistep-next-button'); } return stepButton; }; const createNextButton = (fieldset) => 