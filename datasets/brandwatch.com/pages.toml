ormSteps).forEach((stepElem, index) => { stepElem.classList.toggle('c-form-set--squished', parseInt(stepElem.dataset.step, 10) !== step); formSubmit.classList.toggle('c-form-set--squished', currentFormStep !== lastStep); }); }; // Set width of first and last name fields to half of the form const setFirstLastNameWidths = () => { Array.from(formSteps).forEach((stepElem, index) => { const firstName = stepElem.querySelector('input[name="FirstName"]'); const lastName = stepElem.querySelector('input[name="LastName"]'); if (firstName && lastName) { const flexWrapper = document.createElement('div'); flexWrapper.classList.add('df', 'flex-justify-between', 'flex-row-lg', 'flex-column', 'mb3'); flexWrapper.style.gap = '0.7rem'; firstName.closest('.c-form-set').style.marginBottom = '0'; lastName.closest('.c-form-set').style.marginBottom = '0'; firstName.closest('.c-form-set').classList.add('flex-grow-1'); lastName.closest('.c-form-set').classList.add('flex-grow-1'); firstName.closest('.c-form-set').parentNode.insertBefore(flexWrapper, firstName.closest('.c-form-set')); flexWrapper.appendChild(firstName.closest('.c-form-set')); flexWrapper.appendChild(lastName.closest('.c-form-set')); } }); }; const nextFormStep = () => { let currentFieldset = document.querySelector('fieldset:not(.c-form-set--squished)'); let nextButton = getCurrentNextButton(); // Send nextstep event to form, so that it can validate the current step const event = new CustomEvent('nextstep', { detail: { next_button: nextButton, callback_fail: () => {}, callback_success: () => { currentFormStep++; if (nextButton && currentFormStep <= lastStep) { nextButton.classList.add('c-form-set--squished'); } showFormStep(currentFormStep); } } }); multiForm.dispatchEvent(event); updateProgressBars(); }; const disableNextButton = () => { nextButton.removeEventListener('click', nextFormStep); }; // Function to create the validation element const createValidationElement = () => { const validationMsg = document.createElement('div