full_description = 'Engage: Embed sustainability as a company value through staff community engagement.Support: Help colleagues to be greener individuals at home and in the workplace.Act: Take company action against climate change through tracking carbon emissions and having a strategy for reduction in 2023. At Brandwatch, we are committed to reducing our carbon emissions. We have a strategy in place to ensure we continually measure our impact on the environment, and reduce our carbon footprint. To help embed sustainability throughout our processes, planet-minded colleagues in our various offices have come together to form a green committee. The committee supports Brandwatch’s leadership and staff to integrate environmental sustainability into every aspect of our work and the decisions we make every day. The committee supports Brandwatch’s leadership and staff to integrate environmental sustainability into every aspect of our work and the decisions we make every day. CSM Erika Klotz said: “We chose our route by following the "PAX EAST" event (board/video/card game enthusiasts + cosplay) crowds from the train station to the convention center and picked up the litter they were tossing along their way.” Office Manager Mel Schwartz said: “It was a windy one, but the sun shone for us in the end. Must admit we had never seen the beach so clean but I’d like to think we helped keep it that way!” Strategy & Insights Manager Holly Doran said: “We were taught how to repair the most common effects of wear and tear on clothes. I left the workshop feeling the buzz of a new purchase without any of the guilt. Win win!" Magdalena Nilsson wowed us with her contribution to help with biodiversity - a newly created wildlife pond for insects and frogs! Digital Marketing Manager Elanor Parker said: "It was really relaxing to focus on a creative activity, which is not something I usually make enough time for myself. My lemon plant is now enjoying its new home." Copyright © 2025 Brandwatch.