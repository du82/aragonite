full_description = "Brandwatch is only as good as its people. For them to be at their best, they need a positive and supportive work environment. Working at Brandwatch means flexible working, personal development, and a strong community-focused culture, whether you’re remote or in the office. Who is a better judge of what working at Brandwatch is like than Brandwatchers themselves? Here’s what some of them think about life at Brandwatch in their own words. Brandwatch has never boxed anyone into a particular role or department, and has always been quick to spot potential in people. I’m proud Brandwatch champions individuality and has helped develop the careers of so many individuals of the years. This, combined with the attitude Brandwatch has to challenge and change the status quo in the Engineering industry, is inspiring. Our committees, groups, and channels are the make-up of Brandwatch’s culture. They keep our people connected, and help to set out Brandwatch’s future. Dedicated to discussing issues around diversity and inclusion, and what initiatives are needed to improve this at Brandwatch. Focuses on issues affecting our LGBTQ+ employees, along with organizing internal events and ensuring Brandwatch is a safe space for all. Aiming to make Brandwatch as green as possible, this group discusses environmental issues related to Brandwatch, and organises events like beach cleans. A channel for employees to discuss parenting issues and concerns, and to ensure Brandwatch offers the support they need. A channel for Brandwatchers to discuss the issues women working in technology face, and how best the company can tackle them. Many Brandwatchers spend their free time creating–whether writing, painting, or crafting–and this is where they can show off their work. It’s dogs all the way down. From employee-owned canines to internet famous hounds, it’s the home for dog fans at Brandwatch. Baking is a skill to be celebrated, so any Brandwatchers who want to show off their latest loaves, pastries, and cakes can head here."
