full_description = '''At Brandwatch we’re always listening. Get in touch using the form. Simply enter your details into the form and select the Brandwatch solution that you would like support with from the “How can we help you?” drop-down menu. You will usually receive a reply within 4–24 hours. More useful links About Us With Brandwatch, brands and agencies can adapt and thrive in today's fast moving digital world by making smarter, data-driven decisions. Get to know us Customer Support Our helpful, knowledgeable, and friendly customer support team is on hand to offer help from Monday to Friday. Contact Support Careers Working at Brandwatch means flexible working, personal development, and a strong community-focused culture, whether you're remote or in the office. See Open Roles Demo Request Want to see how Brandwatch can help you better understand and engage with your consumers? Our team of experts is ready to show you. Book a meeting Send us a message /* Hide the asterisk on email in the first step */ fieldset[data-step="1"] [data-type="email"] .color-text-ui-error { display: none; } fieldset[data-step="1"] .c-required-note { display: none; } First Name * Last Name * Email Address * Company * Country: * Select Country... United States United Kingdom Australia Belgium Canada Denmark Germany Netherlands Sweden Switzerland India Singapore South Africa Italy Spain Brazil France Mexico Nigeria Czechia Indonesia United Arab Emirates Poland Ireland Afghanistan Aland Islands Albania Algeria Andorra Angola Anguilla Antarctica Antigua and Barbuda Argentina Armenia Aruba Austria Azerbaijan Bahamas Bahrain Bangladesh Barbados Belarus Belize Benin Bermuda Bhutan Bolivia Bonaire Bosnia and Herzegovina Botswana Bouvet Island British Indian Ocean Territory Brunei Bulgaria Burkina Faso Burundi Cambodia Cameroon Cape Verde Cayman Islands Central African Republic Chad Chile China Christmas Island Cocos (Keeling) Islands Colombia Comoros Congo Congo, the Democratic Republic of the C