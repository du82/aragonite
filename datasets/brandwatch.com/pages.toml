["https://brandwatch.com/datanetworks/facebook"]
title = "Facebook |  Brandwatch"
description = "Existing customer?Log in to access your existing Falcon products and data via the login menu on the top right of the page.New customer?You'll find the former Falcon products under 'Social Media Management' if you go to 'Our Suite' in the navigation."
full_description = "As one of the largest social networks in the world, Facebook is a critical marketing channel and source of global consumer opinion. With this partnership, you have the ability to to track conversations, post directly to your Facebook Business Profiles and even benchmark yourself against your competitors. With a whole host of conversations happening on Facebook, you can use Consumer Research to track up to 400 days of historical data for owned, non-owned Facebook pages. Track the likes, comments, shares to view how your audience is talking about your brand. Monitor all of the Facebook dark posts published on your pages too so you can see how successful your advertisements are! Develop your personalized Facebook influencer Customer Relationship Management (CRM) system, enabling you to efficiently handle influencer connections, track progress, and streamline communication. You can also discover influencers across Instagram, TikTok, and YouTube, and check if they also have a presence on Facebook, using Influence. Through Campaigns, you can gather comprehensive metrics that furnish you with valuable insights such as audience per post, engagement rate, impressions, reach, and much more! This empowers you with real-time campaign reporting, delivering verified statistics for accurate analysis. With Publish it is easy to manage your Facebook activity alongside your other social media channels. Easily draft, schedule and publish content on Facebook using Brandwatch’s collaboration workflows, the unified calendar and shared library – or track which organic posts perform well and turn them into ads in just one click. Create engaging content faster and save precious time using Publish. Connect with your Facebook audience using Engage. Reply with a text or reactions to a Facebook DM, reviews, comments on your own posts or page mentions and more. Set up feeds and messaging automations to make sure no mention or comment- no matter how big or small – goes unanswered. Use Engage’s collaboration workflows; labels, notes, and assignments to engage faster and save precious time using Brandwatch."
