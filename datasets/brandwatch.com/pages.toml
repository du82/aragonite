["https://www.brandwatch.com/legal/cookie-policy"]
title = "Cookie policy |  Brandwatch"
description = "Existing customer?Log in to access your existing Falcon products and data via the login menu on the top right of the page.New customer?You'll find the former Falcon products under 'Social Media Management' if you go to 'Our Suite' in the navigation."
full_description = "By using our website, applications, mobile app, or any other services we offer through the website or email (“Services”), you consent to the use of cookies in accordance with this “Cookies Policy”. This Cookies Policy sets out how we, and third parties we authorize, use cookies when you interact with our Services. This Cookies Policy is part of our User Privacy Statement. Please read them together. Cookies are unique identifiers, usually made up of small bits of text or code. Cookies are usually stored on your device or in your web browser. Cookies send certain information back to the party who served the cookie. When we say cookies we are actually referring to a broader range of technologies than just cookies, including web beacons, clear gifs, pixels and other similar technologies. When we say first-party cookies we mean cookies that are served by Brandwatch. When we say third party cookies we mean cookies that are served by non-Brandwatch parties. Cookies are used in order to better understand how applications and websites work and to optimize online and mobile experiences. Cookies do this by allowing the party serving the cookie to analyse a website’s or mobile app’s performance, to identify certain users and remember their preferences, to better understand whether a computer or device (and probably its user) has visited a website previously and to serve customised advertisements. You may be able to avoid certain cookies by configuring your browser settings or opting-out directly with the party that operates and controls the cookie. Please check your browser settings for more information. In addition, you can opt-out of third-party personalised advertising cookies (but please note you will still be served online advertisements). To learn more or to opt-out of the use of such third-party personalised advertising cookies in the EU, please visit youronlinechoices.eu. If you are based in the United States, please visit aboutads.info/choices. Our emails contain cookies that track whether you open our emails and whether you click any links within them. The cookies used in our emails to monitor these behaviours are unique to each email. They are not stored on your computer or mobile device."
