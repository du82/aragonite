["https://brave.com/leo"]
title = "Brave Leo AI | Brave"
description = "The smart AI assistant built right into your browser. Ask questions, summarize pages, create new content, and more. Privately."
full_description = '''Brave Leo AI The smart AI assistant built right into your browser. Ask questions, summarize pages, create new content, and more. Privately. Make every page interactive Chat with Leo about any topic. Ask Leo to summarize webpages, generate content, translate, analyze text, and more. Without leaving the page. Private, anonymous, and secure Leo’s Brave-hosted models don’t retain or share chats, or use them for additional model training. No account or login is required. Just open and chat. Privately. <div class="absolute left-0 top-0 h-full w-full flex justify-center items-center"> <p class="text-xl">This is a Vimeo video. You'll need JavaScript enabled to view this.</p> </div> Get insights from docs Leo can even analyze PDFs, Google Docs & Google Sheets, and more, getting you the info you need. Faster. Ready to try Leo? Get BraveJust start typing in the Brave address bar on your computer and choose Ask Leo from the suggestions. Or access from Brave sidebar: on desktop, open the sidebar and click ; on mobile, tap “⋮” (Android) or “…” (iOS) and choose Leo to get started. Go Premium Brave Leo is free for all users. Want access to more models and even faster responses? Upgrade to Leo Premium FAQ What can Brave Leo do? Ask Leo to summarize a webpage, doc, or PDF. Or ask almost any question in general, and get answers, summaries, clarifications, related information, and other viewpoints. Brave Leo can also create content like articles, essays, and emails. It can translate between different languages, and even offer coding help by offering suggested and sample code for software applications and database queries. On iOS, you can also ask Leo questions without typing on your phone via voice-to-text. What platforms is Leo available on? Can I try Leo on mobile? Brave Leo is currently available in the Brave browser for desktop (macOS, Windows, and Linux) and mobile (Android and iOS). What LLMs does Leo have access to? Both the free and Premium versions of Brave Leo offer access to the latest models from Mixtral, Anthropic’s Claude, and Meta’s Llama. Open Brave Leo to see exactly which model versions are available today. Can I use my own models in Leo? Yes, you can use your own models in Brave Leo, with a feature called Bring Your Own Model (BYOM). Check out our BYOM help center guide to learn more about using local or remote models, or even connecting to third-party APIs. What data does the Brave browser send to the servers that power Leo? With respect to the servers that power Brave Leo, your browser will share your latest prompt, the context of your current conversation, and—when the use case requires it—the necessary context from the page you’re viewing. We do not collect identifiers that can be linked to you (such as IP Address), and no personal data is retained by Brave-hosted AI models. Note that Brave Leo offers several models to choose from. If you select a model from Anthropic and submit Leo queries, that data will be processed by Anthropic for a period of 30 days, then deleted. Does Brave Leo have a daily limit on the number of prompts I can send? Brave Leo may be more or less accessible depending on traffic levels and usage. You can subscribe to Brave Leo Premium to get higher usage limits. Do I need to sign up for a Brave account to use Brave Leo? No account or signup is required to access the free Brave Leo experience. Leo Premium subscribers will have to create a Premium account, but this is only to verify premium access. There is no Leo account per se, and the premium experience remains private. Your premium account is completely unlinkable to any usage of Leo itself. Will you use my conversations for model training? No. Your conversations are not persisted for model training. What are Brave-hosted models? Brave-hosted models refer to Large Language Models (LLMs) hosted exclusively on Brave’s servers. Leo also offers users the ability to choose other, non-Brave hosted models, including ones from Anthropic. Note that Leo defaults to a Brave-hosted model, and that any history of a chat with a Brave-hosted model is only stored locally on your device. However, if you choose an Anthropic model, Anthropic will retain these conversations for a period of 30 days. Learn more about the models available in Brave Leo. Can I access a history of my chats with Leo? Yes, regardless of which models you choose chat history can be stored locally on your device, and referred back to later. You can review past conversations through the Leo full-page view, or through the browser sidebar. To access chat history via full-page view, navigate to brave://leo-ai, browse through your chat history in the left column, then select any conversation to view it or to continue it. To access chat history via the browser sidebar, click the Leo icon in the sidebar, select the “…” menu, choose Conversation history, then select any conversation to view it or to continue it. Learn more about accessing, deleting, or disabling chat history. Can I trust Leo’s replies? As with any AI, Leo’s responses may contain misleading information and/or factual inaccuracies. Additionally, bias and/or harmful content present in the data during training may on some occasions be reflected in the model’s outputs. We recommend double-checking any Leo responses for accuracy. Please also provide feedback to us if you see anything concerning. To do so, click the menu next to Leo’s response and select the best option. Does Leo hallucinate? Yes, it does. Hallucinations are an intrinsic challenge in how LLMs work. Sometimes regenerating the answer may help. Always double-check Leo’s responses (for example, try the same query on Brave Search) before quoting them.'''
year_published = 2025
