["https://brave.com/talk"]
title = "Brave Talk | Brave"
description = "Brave Talk brings unlimited, private video calls, right to your browser. No extra apps. No tracking. Just free connections, powered by Brave."
full_description = '''Brave Talk Unlimited, private video calls, right in your browser. No extra apps. No tracking. Just free connections, powered by Brave. Start call Video calling, with Brave privacy at its core No tracking. No data collection. Nothing linking you (or anyone else) to a call. Period. With Brave Talk, your conversations stay private to you. <div class="absolute left-0 top-0 h-full w-full flex justify-center items-center"> <p class="text-xl">This is a Vimeo video. You'll need JavaScript enabled to view this.</p> </div> No extra app required Start calls, livestream to YouTube, or group watch a stream. Create breakout rooms, or conduct polls. All right from the Brave browser. No login. No app to download. Free calls, no limits Make as many free calls as you want, for as long as you want. With Brave Talk, there’s no limit on the number or length of free calls. Go Premium With Brave Talk, calls are free and private for up to 4 people. Want to create calls for large groups? Brave Talk Premium offers call recordings, hosting tools like participant muting and entry passcodes, and more for calls with hundreds of people. Start free trial Schedule ahead! Try Brave Talk now Get the Brave Talk extension for Google Calendar. Install now How does Brave Talk stack up? Built-in features Brave Zoom Unlinkability (nothing linking you to a call) Browser-based (no login or download required) No limit on number of free calls No limit on length of free calls Open source FAQs about Brave Talk How do I start a free call, or join a call someone else started? To start a free call on desktop, open a new tab in the Brave Browser, and then click (Talk icon) at the bottom right. To start a free call on mobile, tap the “…” (menu bar) and then tap Talk. Alternatively, you can open Brave on mobile or desktop and visit talk.brave.com. To join a call, ask for the unique call URL from the call creator, and paste it into the address bar of any browser (desktop or mobile, even if it’s not Brave). How do I invite people to a call? How many people can I invite? To invite people, follow the steps above to start a call. Then click the people icon in the Talk screen toolbar, and click Invite someone. You can either copy the meeting link, or share it directly via email. Brave Talk is free for video calls up to 4 people. If you’d like to invite more people, consider upgrading to Brave Premium, which can support calls for hundreds of people. Is Brave Talk free? Yes, Brave Talk is free for video calls up to 4 people. If you’d like to invite more people, or use Brave Talk’s advanced features, consider upgrading to Brave Premium. With Brave Talk Premium, you get secure call recordings, YouTube groupwatch and group streaming, hosting tools like participant muting and entry passcodes, and more for calls with hundreds of people. Is Brave Talk available on all versions of the Brave browser? Is it available on mobile? Brave Talk is available on the most up-to-date version of the Brave Browser, on desktop and mobile. Do I need the Brave browser to use Brave Talk? No, you do not need the Brave browser to use Brave Talk. To start a Talk call from Brave or any other browser you can simply visit talk.brave.com. The people you invite can join from any browser as well (they just need the call link). To start a call from the Brave browser, you can also click the Talk card on the Brave new tab page. Can I add Brave Talk links to Google Calendar or other calendar invites? Yes! Brave Talk is available as an extension in the Chrome web store. To add a Talk link directly to a Google Calendar meeting invite, simply install the extension in the Brave Browser. Then log in to Google Calendar and click Create. You’ll see Add a Brave Talk meeting as a video calling option, just like Zoom or Google Meet. Note that the Brave Browser is built on the open-source Chromium web core. This means that extensions in the Chrome web store will also work in Brave, and can be downloaded in the same way. For now, the extension is only available on Google Calendar. But we hope to add support for other calendar formats in the future. How are my calls with Brave Talk encrypted? To start, all video and audio data transferred through Brave Talk is encrypted via transport layer encryption. This is similar to how many websites use HTTPS to ensure your traffic can’t be captured on public networks (e.g. coffee shop WiFi). The video and audio from your call are transmitted to other participants with the help of a Video Bridge server that’s run by Brave’s partner, 8x8. When you enable Video Bridge Encryption in Security Options, your browser exchanges keys with other call participants, and these keys are used to encrypt the video and audio streams. Only people with keys can see your calls. Assuming honest but curious behavior, neither Brave nor its partner, 8x8, have this key by default. However, there are some important limits to Video Bridge Encryption. If you want to include a phone participant in your call, have more than 20 participants, or want to include users with incompatible browsers (Safari, most iOS browsers, and browsers based on Chromium version 83 or below), this encryption setting will not work. If you record a call, 8x8’s servers will receive a set of keys to decrypt the video/audio stream in order to process and store that recording. Brave will continue to improve Brave Talk’s encryption properties and work to remove some of these limitations. Read a more detailed description of Jitsi encryption (the open source basis for Brave Talk). What features are included with Brave Talk free and Brave Talk Premium? Anyone can start or join a free Brave Talk call, no subscription required. Free calls include… Host calls for up to 4 people No limit on the number or length of calls Available on desktop & mobile Access to the Brave Talk calendar extension Virtual backgrounds (standard or custom) Moderator controls (muting, passcodes, and livestreams) Chat and screensharing Compatible with most built-in or external microphones or cameras Brave Talk Premium calls require a subscription, and include all the features of free calls plus… Host calls with more than 4 participants Host can record calls How do I cancel a Brave Talk Premium subscription? You can cancel a Brave Talk Premium subscription at any time. If you do cancel, you’ll have access to Brave Talk Premium features for the duration of the subscription period. After this period, you’ll still have access to Brave Talk for unlimited, free calls for up to 4 people. To cancel a Brave Talk Premium subscription, log in to your Brave Premium account, locate the card for Brave Talk, and click Cancel plan. Who provides the Brave Talk service? The Brave Talk service is provided in partnership with 8x8. And the service is built on the open-source Jitsi platform. What does Brave Talk with Leo do? Brave Talk can already provide call transcripts to moderators of Premium calls. With Leo integrated into Brave Talk, those transcripts suddenly become dynamic. Leo can take Brave Talk call transcripts and summarize into useful meeting notes, highlight key topics, decisions, and action items, or find quotes and consider follow-up questions. Is Brave Talk with Leo only available to Premium subscribers? Yes. You can visit account.brave.com to get a premium subscription. Once a Premium call is started, the meeting creator (who has the Premium subscription) can visit Settings and turn on Record transcription. (A red icon will appear at the top of the screen for all participants, indicating the call is being recorded.) The call moderator will have access to the audio or video recording, or the transcription, for 24 hours after the call ends. The moderator can share the transcription with the meeting attendees. Those attending a Premium call in the Brave browser can ask Leo to summarize key meeting points both during the meeting and/or after.'''
year_published = 2025
