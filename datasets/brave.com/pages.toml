description = "The Brave browser is a fast, private and secure web browser for PC, Mac and mobile. Download now to enjoy a faster ad-free browsing experience that saves data and battery life by blocking tracking software."
full_description = 'Installing Brave on Linux Install with one command curl -fsS https://dl.brave.com/install.sh | shView source Verify signature curl -fsSLO "https://dl.brave.com/install.sh{,.asc}" && gpg --keyserver hkps://keys.openpgp.org --recv-keys BF62821AFB16036A4ACABCCC87E072BD82960F4D && gpg --verify install.sh.asc Release Channel Beta Channel Nightly Channel Brave is supported on 64-bit AMD/Intel (amd64 / x86_64) and ARM (arm64 / aarch64) architectures. See our full system requirements for minimum OS versions. The current signing keys are also available from https://brave.com/signing-keys/. Release Channel Installation Debian, Ubuntu, Mint sudo apt install curl sudo curl -fsSLo /usr/share/keyrings/brave-browser-archive-keyring.gpg https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg echo "deb [signed-by=/usr/share/keyrings/brave-browser-archive-keyring.gpg] https://brave-browser-apt-release.s3.brave.com/ stable main"|sudo tee /etc/apt/sources.list.d/brave-browser-release.list sudo apt update sudo apt install brave-browser Fedora 41+ (dnf5) sudo dnf install dnf-plugins-core sudo dnf config-manager addrepo --from-repofile=https://brave-browser-rpm-release.s3.brave.com/brave-browser.repo sudo dnf install brave-browser Fedora <41, Rocky/RHEL sudo dnf install dnf-plugins-core sudo dnf config-manager --add-repo https://brave-browser-rpm-release.s3.brave.com/brave-browser.repo sudo dnf install brave-browser Fedora Silverblue/Kinoite/Sway Atomic/Budgie Atomic run0 curl -fsSLo /etc/yum.repos.d/brave-browser.repo https://brave-browser-rpm-release.s3.brave.com/brave-browser.repo run0 rpm-ostree install brave-browser OpenSUSE sudo zypper addrepo https://brave-browser-rpm-release.s3.brave.com/brave-browser.repo sudo zypper install brave-browser Arch Requires an AUR helper, such as paru/pikaur/yay. yay -Sy brave-bin Flatpak Brave is available as a Flatpak package from Flathub. While it is maintained by Brave Software, it is not yet working as well as our native packages. We currently recommend that users who are able to use our official package repositories do so instead of using the Flatpak. Snap You can find Brave in the Snapcraft Store, but while it is maintained by Brave Software, it is not yet working as well as our native packages. We currently recommend that users who are able to use our official package repositories do so instead of using the Snap. Beta Channel Installation Debian, Ubuntu, Mint sudo apt install curl sudo curl -fsSLo /usr/share/keyrings/brave-browser-beta-archive-keyring.gpg https://brave-browser-apt-beta.s3.brave.com/brave-browser-beta-archive-keyring.gpg echo "deb [signed-by=/usr/share/keyrings/brave-browser-beta-archive-keyring.gpg] https://brave-browser-apt-beta.s3.brave.com/ stable main"|sudo tee /etc/apt/sources.list.d/brave-browser-beta.list sudo apt update sudo apt install brave-browser-beta Fedora 41+ (dnf5) sudo dnf install dnf-plugins-core sudo dnf config-manager addrepo --from-repofile=https://brave-browser-rpm-beta.s3.brave.com/brave-browser-beta.repo sudo dnf install brave-browser-beta Fedora <41, Rocky/RHEL sudo dnf install dnf-plugins-core sudo dnf config-manager --add-repo https://brave-browser-rpm-beta.s3.brave.com/brave-browser-beta.repo sudo dnf install brave-browser-beta Fedora Silverblue/Kinoite/Sway Atomic/Budgie Atomic run0 curl -fsSLo /etc/yum.repos.d/brave-browser-beta.repo https://brave-browser-rpm-beta.s3.brave.com/brave-browser-beta.repo run0 rpm-ostree install brave-browser-beta OpenSUSE sudo zypper addrepo https://brave-browser-rpm-beta.s3.brave.com/brave-browser-beta.repo sudo zypper install brave-browser-beta Arch Requires an AUR helper, such as paru/pikaur/yay. yay -Sy brave-beta-bin Nightly Channel Installation Debian, Ubuntu, Mint sudo apt install curl sudo curl -fsSLo /usr/share/keyrings/brave-browser-nightly-archive-keyring.gpg https://brave-browser-apt-nightly.s3.brave.com/brave-browser-nightly-archive-keyring.gpg echo "deb [signed-by=/usr/share/keyrings/brave-browser-nightly-archive-keyring.gpg] https://brave-browser-apt-nightly.s3.brave.com/ stable main"|sudo tee /etc/apt/sources.list.d/brave-browser-nightly.list sudo apt update sudo apt install brave-browser-nightly Fedora 41+ (dnf5) sudo dnf install dnf-plugins-core sudo dnf config-manager addrepo --from-repofile=https://brave-browser-rpm-nightly.s3.brave.com/brave-browser-nightly.repo sudo dnf install brave-browser-nightly Fedora <41, Rocky/RHEL sudo dnf install dnf-plugins-core sudo dnf config-manager --add-repo https://brave-browser-rpm-nightly.s3.brave.com/brave-browser-nightly.repo sudo dnf install brave-browser-nightly Fedora Silverblue/Kinoite/Sway Atomic/Budgie Atomic run0 curl -fsSLo /etc/yum.repos.d/brave-browser-nightly.repo https://brave-browser-rpm-nightly.s3.brave.com/brave-browser-nightly.repo run0 rpm-ostree install brave-browser-nightly OpenSUSE sudo zypper addrepo https://brave-browser-rpm-nightly.s3.brave.com/brave-browser-nightly.repo sudo zypper install brave-browser-nightly Arch Requires an AUR helper, such as paru/pikaur/yay. yay -Sy brave-nightly-bin GitHub (Pre-)releases for all channels are also available on GitHub in DEB/RPM/ZIP formats (changelog). Unofficial packages These packages are community maintained, and therefore we take no responsibility for them. Manjaro sudo pacman -Sy brave-browsersudo pacman -Sy brave-browser-beta Solus sudo eopkg update-repo sudo eopkg install braveThe Solus package is a repackaging of the .deb file in to the Solus software format (.eopkg). It is currently maintained by Jacalz.'
