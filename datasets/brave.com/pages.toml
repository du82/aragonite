["https://brave.com/web-standards-at-brave"]
title = "WebStandards@Brave | Brave"
description = "Technical insights and analysis from Brave’s privacy and security team on Web standards, laws, and harmful new proposals from Big Tech. Check out Brave's work to continue advocating for user privacy and an open Web."
full_description = '''Post #9 | Aug 1, 2023 "Web Environment Integrity": Locking Down the Web Brave strongly opposes Google's "Web Environment Integrity" proposal, the latest in Google's efforts to prevent users from being in control of how they use the Web. Post #8 | May 19, 2022 First-Party Sets: Tearing Down Privacy Defenses Just as They're Being Built Google is proposing a feature called "First-Party Sets," which would have browsers reduce privacy barriers between sites. This is both alarming and harmful. Post #7 | Jan 26, 2022 Privacy And Competition Concerns with Google’s Privacy Sandbox The UK CMA (along with other regulators and web activists) are largely evaluating Google’s Privacy Sandbox as an isolated, independent set of features. Evaluations that fail to consider how Privacy Sandbox will interact with other upcoming Google proposals will miss how radical and harmful Privacy Sandbox will be to the Web in practice. This piece presents how Privacy Sandbox, when considered with other upcoming Chrome features, will harm user choice, privacy, and competition on the Web. Post #6 | Jan 25, 2022 Google's Topics API: Rebranding FLoC Without Addressing Key Privacy Issues The Topics API does not address the core harmfulness of FLoC: that it’s arrogant and dangerous for Google to be the arbiter of what users consider “sensitive” data. Post #5 | Sep 14, 2021 Encrypting DNS Zone Transfers Brave, along with a team of DNS experts from the industry and open source communities, recently helped publish an IETF standard (RFC 9103) to fix a long-standing privacy and security hole in the DNS. Post #4 | Oct 7, 2020 Global Privacy Control, a new Privacy Standard Proposal As part of our privacy-in-Web-Standards work, we’re proud to have been involved in the design for the Global Privacy Control proposal. GPC allows Web users to signal that they do not want to be tracked online, and where relevant, assert legal privacy rights, as described in legislation like the EU’s GDPR and California’s CCPA.'''
year_published = 2025
