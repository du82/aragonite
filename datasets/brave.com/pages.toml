ess? We process the minimum information necessary to provide the Brave Talk service. This includes: Your IP address and the URL of the meeting that will be processed only to enable calls; they are not retained after a call ends. If you use the chat function, chats will be temporarily cached for the duration of the meeting. If you record a meeting that you host, the recording will be temporarily stored on the server for 24 hours to allow you to download it. Your name and email address that you choose to display will be processed and available during the meeting. While communications are encrypted between the Brave browser and Brave Talk servers via transport layer encryption, they are not encrypted on the server during a call, unless you enable Video Bridge Encryption (VBE). Additional security options are available to you in the settings menu once you initiate a call. These include: Enable Lobby: This lets you protect your meeting by only allowing people to enter after being approved by a moderator. Add a"
