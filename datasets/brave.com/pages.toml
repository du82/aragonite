["https://brave.com/brave-rewards"]
title = "What is Brave Rewards? | Brave"
description = "Support content creators and earn tokens for ads you see in Brave. Use your tokens to buy gift cards, exchange for other currencies, and more."
full_description = '''Brave Rewards Support content creators and earn tokens for ads you see in Brave. Use your tokens to buy gift cards, exchange for other currencies, and more. Get Brave After onboarding, click in the address bar of the Brave Browser to get started. Click in the address bar of the Brave Browser to get started. After onboarding, tap in the address bar of the Brave Browser to get started. Tap in the address bar of the Brave Browser to get started. Brave Rewards is limited on iOS devices (learn why). To get started on desktop or Android, click or tap in the address bar of the Brave Browser. How does it work? With Brave Rewards, you can earn tokens (called Basic Attention Tokens or “BAT” for short) for ads you see in Brave. You can choose which kinds of Brave Ads you see and earn from, such as images on the new tab page, push notifications, and more. Brave Rewards also lets you support content creators by letting you send on-demand BAT contributions to your favorite sites and creators, or by having Brave do it automatically for you. Default privacy. Extra rewards. By default, the Brave Browser blocks ads & trackers on the webpages you visit. But if you choose to see Brave Ads, you can earn. Unlike ads from Big Tech companies, Brave Ads are private and never profile you. Your browsing data never leaves your device. With Brave Ads, you’re always in full control. What do Brave Ads look like? You can choose which ones you’d like to see: images on the new tab page, cards in your Brave News feed, push notifications, and others. See the list of ad formats in Brave. No ads in webpages. No pre-roll or mid-roll video ads. What can you do with BAT? Almost anything! BAT can be exchanged for many different currencies (both fiat and crypto), or used to purchase gift cards. You can use BAT to contribute to websites & content creators you love. You can transfer it to your Web3 wallet and store and swap BAT like any other crypto asset in your crypto wallet. You can even buy NFTs and make in-app purchases in Web3 DApps with BAT. How do I contribute to websites & creators? Brave puts your privacy over Big Tech’s profit, blocking the ads that would otherwise collect and leak your data. But what about websites & content creators? Aren’t ads how they make money? With Brave Rewards, you can directly support websites & creators with on-demand BAT contributions, or let Brave do it automatically for you. If you’re a website owner or creator, you can sign up as a Brave Creator now. Get started with Brave Rewards Get Brave After onboarding, click in the address bar of the Brave Browser to get started. Click in the address bar of the Brave Browser to get started. After onboarding, tap in the address bar of the Brave Browser to get started. Tap in the address bar of the Brave Browser to get started. Brave Rewards is limited on iOS devices (learn why). To get started on desktop or Android, click or tap in the address bar of the Brave Browser. FAQs Do Brave Ads replace ads on websites? What do Brave Ads look like? No, Brave Ads do not replace the ads that the Brave Browser blocks on web pages (like banner ads). You can find a list of Brave’s ad formats here. Is Brave Rewards available on all platforms? What are the system requirements? Brave Rewards is available on all desktop devices (Linux, macOS, and Windows), and on Android mobile devices. On iOS, Brave Rewards can only be used to support creators. Learn why. How do I turn on Brave Rewards? To enable Brave Rewards on desktop or mobile, click or tap the (BAT icon) in the address bar of the Brave Browser. How do I earn Brave Rewards? To begin earning BAT for seeing Brave Ads, connect a payout account to your Brave Rewards profile. Connecting a payout account gives us a place to send you your BAT earnings. What can I do with BAT? You can buy gift cards through TAP Network, one of our partners. Specific details can be found on the Brave / TAP Network marketplace page. BAT can be used for in-app purchases in a variety of Web3 applications (DApps). BAT can be used to contribute to the websites & creators you love. With Brave Rewards, you can make on-demand contributions or let Brave support creators automatically for you. BAT can be exchanged for wide range of different currencies, both fiat and crypto. How do I withdraw my BAT Rewards earnings? You’ll receive a BAT rewards deposit each month to your connected payout account. Can I control the frequency of Brave Ads? You can always disable specific Brave Ads formats. For push notification ads, you can even control the maximum number you see per hour in Brave Rewards settings. What's a content creator? Is that like a publisher? A content creator is someone who creates their own content on other platforms, in some cases for subscribers but in others for a totally public audience. By “platforms” we mean sites like YouTube, Twitch, X (formerly Twitter), Reddit, and more. A publisher is generally a company or organization publishing their own content on their own websites. Publishers are often news outlets like the New York Times or TechCrunch, but not always. Website owners and creators can sign up to receive contributions from Brave Rewards users by going to https://creators.brave.com. What does it mean to support creators? How do I contribute to creators? When you enable Brave Rewards for the first time, you’ll be indirectly supporting Brave Creators whenever you see Brave Ads. You won’t be able to direct your support to any specific creator, but we’ll earmark a portion of the ad revenue you help generate by viewing Brave Ads and distribute it to Brave Creators. Once you connect a payout account to your Brave Rewards profile, you’ll unlock the on-demand contributions feature and the Auto-Contribute feature. On-demand contributions let you send a specific amount of BAT to a creator of your choice. They’re like tips. Auto-Contribute automatically distributes BAT to the creators you visit throughout the month, depending on how much time you spend on their content. You can also deposit BAT that you’ve purchased elsewhere into the account you have connected to your Brave Rewards profile, and then use that BAT to contribute to registered websites & content creators! Are Brave Ads "personalized?" Do they collect data about me? Brave Ads do not collect information about you. While Big Tech advertising relies on companies collecting information about you and transferring that data to their servers, with Brave Ads, everything happens directly on your device. Your browsing activity never leaves your device. Brave uses an anonymous and privacy-preserving protocol to confirm ad event activity, keep personal details private, and ensure people earn rewards for their attention. This means that while some Brave Ads formats are shown based on your browsing activity, this matching is hidden to Brave: it only happens on your device, and no personal data reaches Brave’s servers. Neither Brave nor advertisers know who you are or what you’re viewing online. What % of ad revenue does Brave share with users? Brave puts users first, and that means sharing any ad revenue we generate directly with users. 70% of the revenue Brave earns through these unobtrusive, privacy-preserving ads is shared directly back with users as Brave Rewards. Brave encourages users to share some of their earnings with website publishers and content creators, but there’s no requirement to do so. I'm not based in the US. What countries are Brave Ads available in? Brave Ads are running in many countries, and we are constantly working to add more regions. In order to earn BAT from Brave Ads, you need to connect a payout account to your Brave Rewards profile. You can connect an account from one of our custodial account provider partners, or connect your own crypto account. Payout account support varies by region. How is Brave Wallet different from Brave Rewards? Brave Rewards is a feature in Brave that lets you earn BAT for seeing Brave Ads, and lets you support and contribute to websites and content creators. Your BAT earnings are deposited into the payout account you connect to your Brave Rewards profile. Brave Wallet is a Web3 wallet that allows you to buy, send, manage, and swap almost any crypto asset or NFT, connect other wallets and Web3 DApps, and generally manage your whole crypto portfolio. You can withdraw the BAT you earn from Brave Rewards to a Web3 address you own, such as an address you manage with Brave Wallet. From there, you can use your BAT with Brave Wallet. I've heard people mention "Brave crypto." Is that the same thing as BAT? If someone mentions “Brave crypto”, they’re likely referring to the Basic Attention Token (BAT) and / or Brave Rewards. BAT is an ERC20 token on the Ethereum blockchain. Where can I find the terms of service for Brave Rewards? You can find the terms of service for Brave Rewards here.'''
year_published = 2025
clearnet = "https://brave.com/brave-rewards"
