full_description = '''Anthropic Cookbook The Anthropic Cookbook provides code and guides designed to help developers build with Claude. Go to docs Flowise Flowise is a low-code LLM app-building application that makes it easy to integrate and build with third-party tools like Brave Search API. Go to docs MindMac MindMac is an AI chat-app designed for macOS that allows users to access various AI models for productivity. Go to docs Brave Search API Power your search and AI apps with the fastest growing independent search engine since Bing. Access an index of billions of pages with a single call. Get 2,000 free queries View the docs Plans Get started for FREE for 1 query/second, 2,000 queries/month. Or check out the plan options below. Select to view a plan: Data for AIData for SearchData w/ storage rightsAutosuggest & Spellcheck Data for AI Feed results to AI models for inference Pro $9 CPM50 queries/secondNo monthly limitRights to use data for AI inferenceExtra alternate snippets for AIWeb searchImagesVideosNewsGogglesSchema enriched web resultsDiscussionsInfoboxFAQLocationsSummarizer Base $5 CPM20 queries/secondUp to 20M queries/monthRights to use data for AI inferenceExtra alternate snippets for AIWeb searchImagesVideosNewsGogglesSchema enriched web resultsDiscussionsInfoboxFAQLocationsSummarizer Free Free1 query/secondUp to 2,000 queries/monthRights to use data for AI inferenceExtra alternate snippets for AIWeb searchImagesVideosNewsGogglesSchema enriched web resultsDiscussionsInfoboxFAQLocationsSummarizer Data for Search Deliver search results Pro $5 CPM50 queries/secondNo monthly limitWeb searchImagesVideosNewsGogglesSchema enriched web resultsDiscussionsInfoboxFAQLocations Base $3 CPM20 queries/secondUp to 20M queries/monthWeb searchImagesVideosNewsGogglesSchema enriched web resultsDiscussionsInfoboxFAQLocations Free Free1 query/secondUp to 2,000 queries/monthWeb searchImagesVideosNewsGogglesSchema enriched web resultsDiscussionsInfoboxFAQLocations Data w/ storage rights Cache/store data to train AI models Pro $45 CPM50 queries/secondNo monthly limitRights to store dataRights to use data for AI inferenceExtra alternate snippets for AIWeb searchImagesVideosNewsGogglesSchema enriched web resultsDiscussionsInfoboxFAQLocations Base $26 CPM20 queries/secondUp to 20M queries/monthRights to store dataRights to use data for AI inferenceExtra alternate snippets for AIWeb searchImagesVideosNewsGogglesSchema enriched web resultsDiscussionsInfoboxFAQLocations Autosuggest & Spellcheck Deliver real-time search suggestions or automated spelling corrections Pro $0.50 CPM100 queries/secondNo monthly limitAutosuggest or SpellcheckEnriched autosuggest Free Free5 queries/secondUp to 5,000 queries/monthAutosuggest or SpellcheckEnriched autosuggest Truly independentBrave is one of only a few global, independent search providers, and it’s the fastest growing search engine since Bing. Data that’s usefulGet access to high-quality data that’s actually usable. Build everything from search engines to AI apps. As the default engine in the Brave browser, Brave Search is consistently refreshed with new data via its Web Discovery Project contribution framework. Easy, intuitive data structuringThe Brave Search API brings an easy, consistent data structure, and full access to the entire index. Affordable, transparent pricingBrave Search API access is far cheaper than the Bing API. It’s free for up to 2,000 monthly calls, and offers multiple, affordable subscription tiers. See how the Brave Search API can help your business Some of the best search and AI apps are being powered by the fastest growing independent search engine since Bing. <div class="absolute left-0 top-0 h-full w-full flex justify-center items-center"> <p class="text-xl">This is a Vimeo video. You'll need JavaScript enabled to view this.</p> </div> Used by some of the biggest names in tech, including these great companies Get started for free with the Brave Search API Get 2,000 free queries Or contact the Brave BizDev team if your company needs a bespoke, large-data solution: searchapi-support@brave.com The Brave Search API provides accurate search results for our academic citation services. It delivers high-quality data at a reasonable price, and with intuitive data structuring. Its speed and precision have been crucial. —Ben Tucker, SVP of Engineering, FAQ What powers the Brave Search API? The Brave Search API is powered by Brave Search, a fully independent search engine serving tens of millions of queries per day. Try Brave Search at search.brave.com. Does the Brave Search API surface recent events? Yes. Brave Search fetches tens of millions of webpages every day, offering extensive coverage of recent events around the world. Does the Brave Search API follow security and privacy best practices? Yes. For more info, please check out our help page about API privacy and security. Which API plan is right for me? Whatever your needs, the Brave Search API offers plans to meet them. You can sign up for free and try the API, then choose the right plan once you assess the API’s capabilities. If your company needs a bespoke, large-data solution, contact <searchapi-support@brave.com.>. What about copyright? The Brave Search API offers a ranked list of webpages that are publicly available; this list also includes information to support why the webpage is relevant to the query (for instance via query-dependent snippets based on the content of the webpage). The Brave Search API does not grant any rights to third-party content such as webpages. Customers who access URLs displayed in the Brave Search API must ensure their access to those webpages complies with the copyright terms of the page publishers. Does Brave Search have its own Web crawler? Yes, every search engine that has its own index necessarily has its own Web crawler. The Brave Search crawler does not advertise a differentiated user-agent because we must avoid discrimination from websites that allow only Google to crawl them. However, if a domain or page is not crawlable by any search engine (it has a noindex tag), or if it is not crawlable by googlebot, then Brave Search’s bot will not crawl it either. Brave Search’s crawler is partially powered by information provided by users enrolled in the Web Discovery Project (WDP) option in Brave browser’s search settings, which is an off-by-default (aka opt-in), privacy-preserving system. WDP has multiple mechanisms to prevent Brave from knowing who is contributing what (WDP is also open-source for auditing and inspection by anyone). What are Schema enriched Web results, Discussions, and Goggles? Schema enriched Web results The enriched set of structured data about a webpage that better represents and describes the page. For example, a standard (non-enriched) search result for a Rotten Tomatoes movie review page might contain basic info like URL, title, and synopsis. By contrast, Brave’s schema-enriched result for the same movie page might include this basic info plus a thumbnail image; attributes like release date, director, actors, and rating; and even show review scores. Beyond movies, Brave Search can enrich search results with many types of data, on many kinds of pages, including for videos, articles, products, recipes, software, books, contact information, and more. Discussions Discussions is a feature in Brave that is designed to easily serve discussion-based results around searches where there are heavy SEO results. The Brave Search ranking algorithm detects cases where discussion forums would provide an alternative or complementary viewpoint to the organic search results. This is done by computing a “discussion_worthiness” score, which is based on a variety of signals. Learn more. Goggles Goggles enable any individual—or community of people—to alter the ranking of Brave Search by using a set of instructions (rules and filters). Anyone can create, apply, or extend a Goggle. Essentially Goggles act as a custom re-ranking on top of the Brave search index. Learn more. Resources to get started Anthropic Cookbook The Anthropic Cookbook provides code and guides designed to help developers build with Claude. Go to docs LangChain LangChain gives developers a framework to construct LLM‑powered apps easily. Go to docs Flowise Flowise is a low-code LLM app-building application that makes it easy to integrate and build with third-party tools like Brave Search API. Go to docs LlamaIndex LlamaIndex is a leading data framework for building LLM applications. Go to docs Dify Dify is an open-source LLM app development platform. Go to docs MindMac MindMac is an AI chat-app designed for macOS that allows users to access various AI models for productivity. Go to docs Quivr Quivr is an open source RAG framework to deploy and use AI assistants. Go to docs'''
