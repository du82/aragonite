full_description = '''Vulnerability DiscoveryReverse EngineeringModern Vulnerability Research Techniques on Embedded SystemsThis guide takes a look at vetting an embedded system (An ASUS RT-AC51U) using AFL, angr, a cross compiler, and some binary instrumentation without access to the physical device. We'll go from static firmware to thousands of executions per second of fuzzing on emulated code. (Sorry no 0days in this post)Asus is kind enough to provide the firmware for their devices online. Their firmware is generally a root file system packed into a single file using squashfs. As shown below, binwalk can run through this file system and identify the filesystem for us.Copy$ binwalk RT-AC51U_3.0.0.4_380_8457-g43a391a.trx DECIMAL HEXADECIMAL DESCRIPTION -------------------------------------------------------------------------------- 64 0x40 LZMA compressed data, properties: 0x6E, dictionary size: 8388608 bytes, uncompressed size: 3551984 bytes 1174784 0x11ED00 Squashfs filesystem, little endian, version 4.0, compression:xz, size: 13158586 bytes, 1492 inodes, blocksize: 131072 bytes, created: 2019-01-09 11:06:39 Binwalk supports carving the filesystem out of the firmware image through the -Mre flags and will put the resulting root file system into a folder titled squash-fsCopy$ ls 40 _40.extracted squashfs-root $ ls squashfs-root/ asus_jffs cifs2 etc_ro lib opt rom sys usr bin dev home mmc proc root sysroot var cifs1 etc jffs mnt ra_SKU sbin tmp www MotivationThe LD_PRELOAD trick is a method of hooking symbols in a given binary to call your symbol, which the loader and placed before the reference to the original symbol. This can be used to hook function, like malloc and free in the case of libraries like libdheap, to call your own code and perform logging or other intrumentation based analysis. The general format requires compiling a small stub of c code and then running your binary like this:CopyLD_PRELOAD=/Path/To/My/Library.so ./Run_Binary_As_NormalI wanted to try a trick I saw online to create a fast and effective fuzzer for network protocol fuzzing. This github gist shows a PoC of creating an LD_PRELOAD'd library that intercepts libc's call to main and replaces it with our own.Copy#define _GNU_SOURCE #include <stdio.h> #include <dlfcn.h> /* Trampoline for the real main() */ static int (*main_orig)(int, char **, char **); /* Our fake main() that gets called by __libc_start_main() */ int main_hook(int argc, char **argv, char **envp) { // Do my stuff } /* * Wrapper for __libc_start_main() that replaces the real main * function with our hooked version. */ int __libc_start_main(int (*main)(int, char **, char **), int argc, char **argv, int (*init)(int, char **, char **), void (*fini)(void), void (*rtld_fini)(void), void *stack_end) { /* Save the real main function address */ main_orig = main; /* Find the real __libc_start_main()... */ typeof(&__libc_start_main) orig = dlsym(RTLD_NEXT, "__libc_start_main"); /* ... and call it with our custom main function */ return orig(main_hook, argc, argv, init, fini, rtld_fini, stack_end); }My thought was to then call a function inside of the now loaded binary starting from main. Any following calls or symbol look ups from the directly called function should resolve correctly because the main binary is loaded into memory!Defining a function prototype and then calling a function seemed to work. I can pull a function address out of a binary and jump to it with arbitrary arguments and the compiler abi will place to arguments into the runtime correctly to call the function. :Copy/* Our fake main() that gets called by __libc_start_main() */ int main_hook(int argc, char **argv, char **envp) { char user_buf[512] = {"\x00"}; read(0, user_buf, 512); int (*do_thing_ptr)() = 0x401f30; int ret_val = (*do_thing_ptr)(user_buf, 0, 0); printf("Ret val %d\n",ret_val); return 0; } This process is very manual and slow... Let's speed it up!Setting upThe extracted firmware executables are all mips little endian based and are interpreted through uClibc.Copy$ file bin/busybox bin/busybox: ELF 32-bit LSB executable, MIPS, MIPS32 version 1 (SYSV), dynamically linked, interpreter /lib/ld-, stripped $ ls lib/ ld-uClibc.so.0 libdl.so.0 libnsl.so.0 libws.so libcrypt.so.0 libgcc_s.so.1 libpthread.so.0 modules libc.so.0 libiw.so.29 librt.so.0 libdisk.so libm.so.0 libstdc++.so.6DockCross does not support uClibc cross compiling yet so I needed to build my own cross compilers. Using buildroot I created a uClibc cross compiler for my Ubuntu 18.04 machine. To save time in the future I've posted this toolchain and a couple others online here. This toolchain enables quick cross compiling of our LD_PRELOADed libraries.The target is the asusdiscovery service. There has already been a CVE for it and it proves to be hard to fuzz manually. The discovery service periodically sends packets out across the network, scanning for other ASUS routers. When another ASUS router sees this discover packet, it responds with it's information and the discovery service parses it. These response-based network services can be hard to fuzz through traditional network fuzzing tools like BooFuzz. So we're going to find where it parses the response and fuzz that logic directly with our new-found LD_PRELOAD tricks.Pulling symbol information from this binary yields a quick tell to which function does the parsing ParseASUSDiscoveryPackage:Copy$ readelf -s usr/sbin/asusdiscovery Symbol table '.dynsym' contains 85 entries: Num: Value Size Type Bind Vis Ndx Name 0: 00000000 0 NOTYPE LOCAL DEFAULT UND 1: 0040128c 236 FUNC GLOBAL DEFAULT 10 safe_fread 2: 00414020 0 NOTYPE GLOBAL DEFAULT 18 _fdata 3: 00000001 0 SECTION GLOBAL DEFAULT ABS _DYNAMIC_LINKING 4: 0041c050 0 NOTYPE GLOBAL DEFAULT ABS _gp ..............SNIP.................... 33: 004141b0 4 OBJECT GLOBAL DEFAULT 22 a_bEndApp 34: 00402cec 328 FUNC GLOBAL DEFAULT 10 ParseASUSDiscoveryPackage 35: 00403860 0 FUNC GLOBAL DEFAULT UND sprintf ...............SNIP..................... With this symbol in mind we can open the binary up in Ghidra and have the decompiler give us a rough idea of how it's working:Copyundefined4 ParseASUSDiscoveryPackage(int iParm1) { ssize_t sVar1; socklen_t local_228; undefined4 local_224; undefined4 local_220; undefined4 local_21c; undefined4 local_218; undefined auStack532 [516]; myAsusDiscoveryDebugPrint("----------ParseASUSDiscoveryPackage Start----------"); if (a_bEndApp != 0) { myAsusDiscoveryDebugPrint("a_bEndApp = true"); return 0; } local_228 = 0x10; memset(auStack532,0,0x200); sVar1 = recvfrom(iParm1,auStack532,0x200,0,(sockaddr *)&local_224,&local_228); if (0 < sVar1) { PROCESS_UNPACK_GET_INFO(auStack532,local_224,local_220,local_21c,local_218); return 1; } myAsusDiscoveryDebugPrint("recvfrom function failed"); return 0; }The function appears to be instantiating a 512 byte buffer and reading from a given network file descriptor through the recvfrom function. A quick visit to recvfrom's manpage reveals that the second argument going into recvfrom will contain the network input, the input we can control.CopyRECV(2) Linux Programmer's Manual RECV(2) NAME recv, recvfrom, recvmsg - receive a message from a socket SYNOPSIS #include <sys/types.h> #include <sys/socket.h> ssize_t recv(int sockfd, void *buf, size_t len, int flags); ssize_t recvfrom(int sockfd, void *buf, size_t len, int flags, struct sockaddr *src_addr, socklen_t *addrlen);This user input is immediately passed to the PROCESS_UNPACK_GET_INFO function. This function in responsible for parsing the user input and relaying that information to the router. Opening the function in ghidra reveals a large parsing function. This looks perfect for fuzzing!aaThe next step is interacting with the function and providing input into that first argument. The first step towards running this as an independent function is recovering the function prototype. Ghidra shows the defined function prototype as below.Copyvoid PROCESS_UNPACK_GET_INFO(char *pcParm1,undefined4 uParm2,in_addr iParm3)Using stub-builder you can take this information Instrumenting asusdiscoverSimilarly to the PoC of the LD_PRELOAD main hook shown above, I needed to hook the main function. For uClibc that function is __uClibc_main. Using the same trick as above, we'll define a function prototype for the function we want to call, then hook uClibc's main function and then jump directly to the function we want to call with our arguments.To make this process easier, I created a tool to identify function prototypes and slot them into templated c code. The current iteration of stub-builder will accept a file and a given function to instrument. The tool is imperfect and will use radare2 to identify (often wrongly) function prototypes and place them into the c stub.Copy$ stub_builder -h usage: stub_builder [-h] --File FILE {hardcode,recover} ... positional arguments: {hardcode,recover} Hardcode or automatically use prototypes and addresses hardcode Use absolute offsets and prototypes recover Use radare2 to recover function address and prototype optional arguments: -h, --help show this help message and exit --File FILE, -F FILE ELF executable to create stub from An example for the command can be seen below. The stub builder uses radare2 for it's function recovery and fails to identify the first argument as a char* so we need to fixup the main_hook.c.Copy$ stub_builder -F usr/sbin/asusdiscovery recover name PROCESS_UNPACK_GET_INFO [+] Modify main_hook.c to call instrumented function [+] Compile with "gcc main_hook.c -o main_hook.so -fPIC -shared -ldl" [+] Hook with: LD_PRELOAD=./main_hook.so ./usr/sbin/asusdiscovery [+] Created main_hook.c Hardcoded values can be inserted instead. The below command supplies the address, argument prototype and the expected return type:Copy$ stub_builder -F usr/sbin/asusdiscovery hardcode 0x00401f30 "(char *, int, int)" "int"Copy#define _GNU_SOURCE #include <stdio.h> #include <dlfcn.h> //gcc main_hook.c -o main_hook.so -fPIC -shared -ldl /* Trampoline for the real main() */ static int (*main_orig)(int, char **, char **); /* Our fake main() that gets called by __libc_start_main() */ int main_hook(int argc, char **argv, char **envp) { //<arg declarations here> char user_buf[512] = {"\x00"}; //scanf("%512s", user_buf); read(0, user_buf, 512); int (*do_thing_ptr)(char *, int, int) = 0x401f30; int ret_val = (*do_thing_ptr)(user_buf, 0, 0); printf("Ret val %d\n",ret_val); return 0; } //uClibc_main /* * Wrapper for __libc_start_main() that replaces the real main * function with our hooked version. */ int __uClibc_main( int (*main)(int, char **, char **), int argc, char **argv, int (*init)(int, char **, char **), void (*fini)(void), void (*rtld_fini)(void), void *stack_end) { /* Save the real main function address */ main_orig = main; /* Find the real __libc_start_main()... */ typeof(&__uClibc_main) orig = dlsym(RTLD_NEXT, "__uClibc_main"); /* ... and call it with our custom main function */ return orig(main_hook, argc, argv, init, fini, rtld_fini, stack_end); } The code above will accept input from STDIN and pass it into the parsing function directly. This enable us to test and get return values of the functions without any networking compoonents required.Running the codeCross compiling the shared object using the provided cross compilers is shown below. The resulting file will be named main_hook.soCopyt$ /opt/cross-compile/mipsel-linux-uclibc/bin/mipsel-buildroot-linux-uclibc-gcc main_hook.c -o main_hook.so -fPIC -shared -ldlUsing this library is shown below and with my toolchain it doesn't link the libdl library and will result in the error below:Copy$ qemu-mipsel -L /home/caffix/firmware/asus/RT-AC51U/ext_fw/squashfs-root -E LD_PRELOAD=/main_hook.so ./usr/sbin/asusdiscovery ./usr/sbin/asusdiscovery: can't resolve symbol 'dlsym'Adding the libdl library to the LD_PRELOAD fixes this problem and resolves the dlsym function.Copy$ qemu-mipsel -L /home/caffix/firmware/asus/RT-AC51U/ext_fw/squashfs-root -E LD_PRELOAD=/lib/libdl.so.0:/main_hook.so ./usr/sbin/asusdiscovery abcd Ret val 4We now have the binary running and it's accepting our input and passing it directly to the function. The next stage is generating a set of valid input data to seed our fuzzer with.Generating valid input for a test corpusSending in random strings of "A"s will not yield new discovered paths through the parsing function. Looking at the function decompilation we can see there is a quick check performed in a funciton titled UnpackGetInfo_NEW . This is the first function we need to look at, to determine if there are any early exits from initial parses.Copy memset(&local_320,0,0xf8); memset(&uStack1000,0,200); iVar28 = UnpackGetInfo_NEW(pcParm1,&local_320,&uStack1000); iVar39 = a_GetRouterCount;This function first checks for a set of magic bytes before continueing. It's looking for "\x0c\x16\x00\x1f" to be the first bytes in network input. Without these magic bytes it will exit early and indicate through it's return code to discard the input.Copyint UnpackGetInfo_NEW(char *user_input,undefined4 *param_2,undefined4 *param_3) { undefined4 uVar1; undefined4 uVar2; undefined4 uVar3; undefined4 *puVar4; undefined4 *puVar5; undefined4 *puVar6; if (((*user_input != '\f') || (user_input[1] != 0x16)) || (*(short *)(user_input + 2) != 0x1f)) { return 1; }Supplying this magic value immediatly returns a different result when running the binary:Copy$ python2 -c 'print "\x0c\x16\x1f\x00" + "A"*100' | qemu-mipsel -L . -E LD_PRELOAD=/lib/libdl.so.0:/main_hook.so ./usr/sbin/asusdiscovery Ret val 1The function returns more than just a single return value based on the parse or unpack. There appears to be checks on lines 12, 15, 32, 33 and returns a result based on the input on line 50.Copy int UnpackGetInfo_NEW(char *user_input,undefined4 *param_2,undefined4 *param_3) { undefined4 uVar1; undefined4 uVar2; undefined4 uVar3; undefined4 *puVar4; undefined4 *puVar5; undefined4 *puVar6; if (((*user_input != '\f') || (user_input[1] != 0x16)) || (*(short *)(user_input + 2) != 0x1f)) { return 1; } puVar6 = (undefined4 *)(user_input + 8); do { puVar5 = puVar6; puVar4 = param_2; uVar1 = puVar5[1]; uVar2 = puVar5[2]; uVar3 = puVar5[3]; *puVar4 = *puVar5; puVar4[1] = uVar1; puVar4[2] = uVar2; puVar6 = puVar5 + 4; puVar4[3] = uVar3; param_2 = puVar4 + 4; } while (puVar6 != (undefined4 *)(user_input + 0xf8)); uVar1 = puVar5[5]; puVar4[4] = *puVar6; puVar4[5] = uVar1; if ((*(short *)(user_input + 0x110) == -0x7f7e) && (puVar6 = (undefined4 *)(user_input + 0x110), (user_input[0x112] & 1U) != 0)) { do { puVar5 = puVar6; puVar4 = param_3; uVar1 = puVar5[1]; uVar2 = puVar5[2]; uVar3 = puVar5[3]; *puVar4 = *puVar5; puVar4[1] = uVar1; puVar4[2] = uVar2; puVar6 = puVar5 + 4; puVar4[3] = uVar3; param_3 = puVar4 + 4; } while (puVar6 != (undefined4 *)(user_input + 0x1d0)); uVar1 = puVar5[5]; puVar4[4] = *puVar6; puVar4[5] = uVar1; return (uint)((user_input[0x112] & 0x10U) != 0) + 5; } return 0; } This is a perfect time to breakout ang'''
