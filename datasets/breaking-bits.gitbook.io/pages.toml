["https://breaking-bits.gitbook.io/breaking-bits/exploit-development/linux-kernel-exploit-development/stack-cookies"]
title = "Kernel stack cookies | Breaking Bits"
full_description = "Exploit DevelopmentLinux kernel exploit developmentKernel stack cookiesPreviousInteracting with Kernel ModulesNextKernel Address Space Layout Randomization (KALSR)Last updated 3 years agoWas this helpful? We are using resources from here The kernel module we are exploiting is here The final exploit is here Stack cookies exist in the kernel stack just like standard userspace programs. When attempting to clobber the stack through a stack overflow, the kernel will panic and report something similar to the image below: The method of exploitation is very similar from userspace to kernel space and we will be using the same ideas behind leaking a stack cookie and then replacing it on the stack We are going to be building a ret2usr exploit using the kernel-overflow kernel module. This exploit will require disabling a couple mitigations: smep smap kpti and kaslr . The launch_stack_cookie.sh included with these challenges will launch the kernel without these mitigations. The plan of attack here is as follows: * Leak the stack cookie * Get key kernel addresses * Save some user-mode registers * Build some shellcode * Overwrite the program counter to our shellcode Our stack has a variable tmp on it that should be 32*sizeof(int) (128) bytes large. The next value on the stack will be our stack cookie, and then some caller saved registers as shown below: The check on line 9 is insufficient to prevent and overread and consequently passing in a length greater than 128 bytes will leak stack data. We can trigger this leak by opening the character device and reading in more than 128 bytes. The code below will read in 256 bytes and print each as 8 byte reads. The next step is to get a couple key addresses for our kernel exploit. When we can control execution of the kernel we are interested in calling commit_creds(prepare_kernel_cred(NULL)); which will create a new credential struct with root credentials and then assign our process that new set of credentials! The classic process of doing this is by reading /proc/kallsyms . We can open and read this file looking for entries for both those addresses and add them into our exploit. The code below will read kallsyms looking for commit_creds and prepare_kernel_cred and then store the values found into two global variables."
