["https://breaking-bits.gitbook.io/breaking-bits/spaceheroes-ctf-2023/everything-is-wrong"]
title = "Everything-is-wrong | Breaking Bits"
description = "Writing a debugger to side-channel out comparisons with RAX values"
full_description = '''Spaceheroes CTF 2023Everything-is-wrongWriting a debugger to side-channel out comparisons with RAX valuesPreviousSpaceheroes CTF 2023NextUS CyberGames RE-Cruise 4Last updated 1 year agoWas this helpful? When running the problem, we're presented with a map of the world and an input prompt. The binary takes our input and checks it, and then prints out that we entered the incorrect flag. I opened the binary in Binary Ninja and saw a function called Main_validateFlag_info that looked like the below image, which immediately made me want to see if I could side-channel an answer instead of trying to reverse Haskell. My normal side-channel tools utilize qemu usermode emulation, but I noticed that the number of instructions executed for the same input varied. Below I'm sending in just the letter "A" and seeing a different number of instructions executed every time. This told me that I might be able to use an instruction counting side-channel but it might be unstable. I wanted to know the flag length, and can usually just add "A"'s to start getting more instructions, but again I wasn't seeing constant (only variable) instruction increases. Knowing how unstable instruction counting was looking I wanted to find an alternate side-channel that would give me a clearer picture of how many successful instructions or calls were executed. RAX is the return or result register for amd64. Most return status codes use 0 to indicate that they were successful. The thinking here is that if we count the number of times RAX is equal to 0, we can access a side-channel indicting general program success without worrying about instructions or threads/timers messing up our side-channel! I started writing a tracing utility a little while to hook up to another process use PTRACE and hunt for call instructions and dump arguments. I decided to add a little bit more to this tracer and added register comparisons. The premise of the utility is two fold: You can access the call tracer here: https://github.com/ChrisTheCoolHut/call_trace and after compiling should be able to run it with:'''
