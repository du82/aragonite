["https://breaking-bits.gitbook.io/breaking-bits/battelle-shmoocon-2024/time-jump-planner"]
title = "Time Jump Planner | Breaking Bits"
description = "No ROP, no SROP, full RELRO, ASLR, DEP, no execve pwn inside of QEMU"
full_description = '''Battelle Shmoocon 2024Time Jump PlannerNo ROP, no SROP, full RELRO, ASLR, DEP, no execve pwn inside of QEMUPreviousBattelle Shmoocon 2024NextSpaceheros CTF 2022Last updated 1 year agoWas this helpful? Time Jump Planner was a pwn problem hosted by Battelle written by playoff-rondo. This challenge is a pwn problem hosted within a docker container and running through qemu-x86_64 usermode emulation. It is also running a "libjail.so" plugin within qemu to further restrict exploitation options. We're provided libc, ld-linux , and the binary, so this is our first clue that we'll likely need to leak library addresses when working through this problem. To solve this problem I approached it as an arbitrary write/arbitrary read vulnerability with a modern GLIBC. qemu_plugin_register_vcpu_tb_trans_cb will register a call back for every translated basic block executed by QEMU. and qemu_plugin_register_vcpu_syscall_cb will register a callback for every single syscall run by the usermode program. The qemu_plugin_register_vcpu_tb_trans_cb will check every "call" and "ret" instruction, matching each call's return address with the corresponding "ret" instruction. If the values do not line up, a message "NO ROPPING!" is printed and the program exits. Additionally within the syscall callback we see even more restrictions. "execve" is blocked, which stops one_gadget,system("/bin/sh"), and popen from working for exploitation. However within this function it is also revealed that there is a backdoor syscall that will print the flag. When called with syscall(0x5add011,"please_give_me_flag",0x6942069420) the flag will be opened and written to STDOUT. When run, the program is designed to print a menu and offer a number of choices for "time traveling". A current year is specified, and a number of options for "quick jumping" are provided, kind of like speed dialing for old phones. The "add" and "remove" functions both allow you to add and remove arbitrary numbers from this variable. They will index into the "year_list" variable and take an arbitrary 64bit unsigned integer and set it. This looks like a good setup for arbitrary write!'''
