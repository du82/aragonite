["https://breakingpoint.ro/en"]
title = "Homepage - BreakingPoint"
description = "Homepage - BreakingPoint. Hai sa discutam despre proiectele tale si despre idei noi de afaceri! Te asteptam pe site cu mai multe informatii."
full_description = "Devine foarte importantă informația corectă, izolarea celor care propagă fake news apocaliptice și o bună și sănătoasă doză de umor. Protejați-vă, evitați contactul direct! Evitați zonele aglomerate unde sunteți expuși la contact direct și/sau interacțiune cu un număr mare de persoane, de tipul adunărilor publice, cozi, zone de trafic intens, zone de recreere. Feriți copiii de acele locuri de joacă care presupun atingerea unor suprafețe/obiecte comune de către un număr mare de copii. Limitați la maximum orice contact direct cu alte persoane, în afara celor care fac parte din familia restrânsă, prin gesturi cum ar fi: strângerea mâinilor, îmbrățișările, sărutul obrajilor sau al mâinilor, atingerea fețelor cu mâinile. Se recomandă, inclusiv în privința persoanelor împreună cu care locuiți, să NU intrați în contact direct decât după igienizarea mainilor atunci când reveniți la domiciliu. Evitați atingerea suprafețelor care sunt atinse în mod frecvent și de alte persoane, precum: balustrade, clanțe, mânere, butoane de lift sau de acces. În cazul în care sunteți totuși nevoiți să atingeți aceste suprafețe, protejați-vă folosind șervețele de unică folosință. Păstrați o distanță semnificativă, de 1,5 metri, față de celelalte persoane pe care le întâlniți. În cazul în care vă aflați în transportul în comun încercați să NU stați față în față cu alte persoane. Asigurați-vă, după folosirea transportului în comun, că v-ați igienizat mâinile înainte de a vă atinge fața, nasul sau gura. Folosiți, pe cât posibil, rute sau modalități alternative de transport pentru a evita zonele aglomerate de trafic de persoane. În cazul în care programul vă permite, folosiți intervalele orare cu nivel scăzut de trafic de persoane. În zonele urbane, pentru distanțe mici, se recomandă folosirea modalităților alternative de deplasare, fie cu bicicleta/trotineta electrică, fie mersul pe jos. Evitați deplasările în țările care se confruntă cu număr mare de cazuri de infectări cu noul coronavirus (COVID-19) și descurajați întoarcerea în țară a persoanelor din zonele de risc, respectiv din țările cu număr mare de cazuri cu noul coronavirus. Date actualizate în timp real despre țările vizate pot fi obținute accesând link-ul http://www.cnscbt.ro/, respectiv „Lista regiunilor și localităților din zona roșie și zona galbenă cu transmitere a COVID-19”."
