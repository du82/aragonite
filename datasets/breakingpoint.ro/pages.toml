full_description = "Wir und unsere Partner verwenden möglicherweise verschiedene Technologien, um Informationen zu sammeln und zu speichern, wenn Sie unsere Dienste nutzen. Dies kann auch die Verwendung von Cookies und ähnlichen Tracking-Technologien wie Pixel und Web Beacons umfassen. Zum Beispiel verwenden wir Web Beacons in den E-Mails, die wir in Ihrem Namen senden. Diese Web Beacons verfolgen ein bestimmtes Verhalten, z. B. ob die über die Dienste gesendete E-Mail zugestellt und geöffnet wurde und ob auf Links in der E-Mail geklickt wurde. Sie ermöglichen es uns auch, Informationen wie die IP-Adresse des Empfängers, den Browser, den E-Mail-Client-Typ und andere ähnliche Details zu erfassen. Wir verwenden diese Informationen, um die Leistung Ihrer E-Mail-Kampagnen zu messen, Analyseinformationen bereitzustellen und die Effektivität unserer Services zu verbessern. Berichte stehen uns auch zur Verfügung, wenn wir Ihnen eine E-Mail senden, damit wir diese Informationen sammeln und überprüfen können."
