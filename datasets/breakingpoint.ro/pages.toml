["https://breakingpoint.ro/politica-cookie"]
title = "Politica Cookie - BreakingPoint"
description = "Politica Cookie - BreakingPoint. Un Cookie este un fisier de mici dimensiuni care va fi stocat pe device-ul tau. Te asteptam pentru detalii."
full_description = "Informatiile prezentate in continuare au scopul de a informa utilizatorul despre plasarea, utilizarea si administrarea “cookie”-urilor utilizate de site-ul https://breakingpoint.ro Acest website foloseste cookie-uri proprii cat si cookie-uri adaugate de terti, pentru a furniza vizitatorilor o experienta mult mai buna de navigare si servicii adaptate nevoilor si interesului fiecaruia. In ceea ce numim “web modern” sau “web 2.0”, cookie-urile joaca un rol important in facilitarea accesului si livrarii multiplelor servicii de care utilizatorul se bucura pe Internet, cum ar fi: Personalizarea anumitor setari precum: limba in care este vizualizat site-ul, data si ora, pastrarea optiunilor/setarilor (inclusiv memorarea acestora) si pastrarea preferintelor mai vechi prin accesarea diferitelor butoane/functii. Cookie-urile ofera detinatorilor de site-uri un feedback valoros asupra modului cum sunt utilizate site-urile lor de catre utilizatori, astfel incat sa le poata face si mai eficiente ori mai accesibile pentru utilizatori. Permit aplicatiilor multimedia sau de alt tip de pe alte site-uri sa fie incluse (inserate/embed) in anumite pagini pentru a crea o experienta de navigare mai valoroasa, mai utila si mai placuta. Un “Internet Cookie” (termen cunoscut si ca “browser cookie” sau “HTTP cookie” ori pur si simplu “cookie”) este un fisier de mici dimensiuni, format din litere si numere, care va fi stocat pe computerul, terminalul mobil sau alte echipamente ale unui utilizator de pe care se acceseaza Internetul. Cookie-ul este trimis printr-o solicitare emisa de catre web-server pe care este gazduit site-ul, catre browser-ul utilizatorului (Ex: Firefox, Internet Explorer, Chrome etc.) si este complet “pasiv”, in sensul ca nu contine programe software, virusi sau spyware si nici nu poate accesa informatiile de pe hard driveul utilizatorului. Un cookie este format din 2 parti: numele si continutul sau valoarea cookie-ului ce este asociat in mod unic cu domeniul pe care este gazduit site-ul care l-a trimis catre browserul utilizatorului (ex: https://breakingpoint.ro/). Mai mult, durata de existenta a unui cookie este determinata si doar webserver-ul care a trimis cookie-ul il poate accesa din nou, si numai in momentul in care utilizatorul se intoarce pe site-ul asociat webserver-ului respectiv."
