["https://breakingpoint.ro/de/datenschutz-bestimmungen"]
title = "Datenschutz-Bestimmungen - BreakingPoint"
description = "Datenschutz-Bestimmungen - BreakingPoint. Acest website foloseste cookie-uri pentru a furniza vizitatorilor o experienta buna de navigare."
full_description = "Wenn Besucher Kommentare auf der Website hinterlassen, erfassen wir die im Kommentarformular angezeigten Daten sowie die IP-Adresse und die Zeichenfolge des Browser-Benutzeragenten des Besuchers, um die Spam-Erkennung zu unterstützen. Eine anonymisierte Zeichenfolge, die aus Ihrer E-Mail-Adresse erstellt wurde (auch Hash genannt), kann dem Gravatar-Dienst zur Verfügung gestellt werden, um zu sehen, ob Sie diese verwenden. Die Datenschutzrichtlinie des Gravatar-Dienstes finden Sie hier: https://automattic.com/privacy/. Nach der Bestätigung Ihres Kommentars ist Ihr Profilbild im Kontext Ihres Kommentars für die Öffentlichkeit sichtbar. Wenn Sie Bilder auf die Website hochladen, sollten Sie das Hochladen von Bildern mit eingebetteten Positionsdaten (EXIF GPS) vermeiden. Besucher der Website können Standortdaten von Bildern auf der Website herunterladen und extrahieren. Wenn Sie einen Kommentar auf unserer Website hinterlassen, können Sie Ihren Namen, Ihre E-Mail-Adresse und Ihre Website in Cookies speichern. Dies dient Ihrer Bequemlichkeit, damit Sie Ihre Angaben nicht erneut eingeben müssen, wenn Sie einen weiteren Kommentar hinterlassen. Diese Cookies sind ein Jahr gültig. Wenn Sie über ein Konto verfügen und sich auf dieser Website anmelden, setzen wir ein temporäres Cookie, um festzustellen, ob Ihr Browser Cookies akzeptiert. Dieses Cookie enthält keine persönlichen Daten und wird beim Schließen Ihres Browsers gelöscht. Wenn Sie sich anmelden, werden wir auch mehrere Cookies einrichten, um Ihre Anmeldeinformationen und die Bildschirmanzeige zu speichern. Login-Cookies sind zwei Tage gültig, und Cookies für Bildschirmoptionen dauern ein Jahr. Wenn Sie „Remember Me“ wählen, bleibt Ihr Login für zwei Wochen bestehen. Wenn Sie sich von Ihrem Konto abmelden, werden die Anmeldecookies entfernt. Wenn Sie einen Artikel bearbeiten oder veröffentlichen, wird ein zusätzlicher Cookie in Ihrem Browser gespeichert. Dieses Cookie enthält keine persönlichen Daten und gibt lediglich die Beitrags-ID des Artikels an, den Sie gerade bearbeitet haben. Es läuft nach einem Tag ab."
