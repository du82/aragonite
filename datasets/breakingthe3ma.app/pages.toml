title = "Three Lessons from Threema: Analysis of a Secure Messenger"
description = """
Attack 1 (Network Attacker)            Ephemeral Key Compromise Impersonation                        Ephemeral keys are used by the Threema clients and server to create fresh keys for usage in Threema's bespoke client-to-server (C2S) protocol. In theory, this should make different sessions independent from each other (i.e. compromising one session should not influence the security of past or future sessions).            In contrast, we show that compromising a single client ephemeral key allows an attacker to impersonate that client to the server forever. Furthermore, we uncover improper reuse of ephemeral keys in the C2S protocol both on the client and on the server, with significant security impacts."""
full_description = "Threema is a Swiss encrypted messaging application. It has more than 10 million users and more than 7000 on-premise customers. Prominent users of Threema include the Swiss Government and the Swiss Army, as well as the current Chancellor of Germany, Olaf Scholz. Threema has been widely advertised as a secure alternative to other messengers. In our work, we present seven attacks against the cryptographic protocols used by Threema, in three distinct threat models. All the attacks are accompanied by proof-of-concept implementations that demonstrate their feasibility in practice. Secure messaging applications have the basic goal of allowing pairs and groups of users to communicate securely. Desirable properties include confidentiality, integrity, origin authentication, and prevention of message reordering, replay, insertion and deletion attacks. State-of-the-art applications should also offer forward security and post-compromise security. Roughly speaking, forward security means that data exchanged prior to a compromise remains secure, while post-compromise security means that security can be recovered after an attack has taken place (provided the adversary does not always remain active in the communication exchanges). All of this should be done in an end-to-end (E2E) secure manner, meaning that only the intended recipients should be able to read and send messages. Achieving E2E security minimises the trust required in the server that is typically used by such applications to store and forward messages. Even prior to our work, it was known that Threema features neither forward security nor post-compromise security. We show that several of the other desirable security properties also fail to hold. Our work highlights some of the difficulties faced by developers in creating secure messaging systems. In addition, we draw lessons for developers of secure protocols more generally. Ephemeral keys are used by the Threema clients and server to create fresh keys for usage in Threema's bespoke client-to-server (C2S) protocol. In theory, this should make different sessions independent from each other (i.e. compromising one session should not influence the security of past or future sessions). In contrast, we show that compromising a single client ephemeral key allows an attacker to impersonate that client to the server forever. Furthermore, we uncover improper reuse of ephemeral keys in the C2S protocol both on the client and on the server, with significant security impacts."
