["https://brendaneich.com/2006/02/python-and-javascript"]
title = "Python and JavaScript – Brendan Eich"
full_description = "Posted on February 19, 2006 by Brendan EichPython and JavaScript Mark Hammond’s work to support Python in XUL is nearly done. The DOM_AGNOSTIC2_BRANCH should land in the next few weeks. Already I see many on the PyXPCOM list testing Mark’s fine work, chomping at the bit to use Python in XULRunner. This brings to mind a hot topic in my recent hacking: infusing JS with Pythonic generators and iterators, including array comprehensions. Brief taste: js> function count(n) { for (var i = 0; i < n; i++) yield i; } js> g = count(10) [object Generator] js> g.next() 0js> g.next() 1 js> two_to_nine = [i for i in g] 2,3,4,5,6,7,8,9 js> squares_to_20 = [i * i for i in count(20)] 0,1,4,9,16,25,36,49,64,81,100,121,144,169,196,225,256,289,324,361 Why borrow from Python for iteration, generators, and comprehensions? I typed this into a wiki recently: Given the years of development in Python and similarities to ECMAScript in application domains and programmer communities, we would rather follow than lead. By standing on Python CategoriesMozilla, Uncategorized Sho says: February 19, 2006 at 11:45 pm You should consider working with KDE, too (who originally developed KJS, notably). kevin says: February 20, 2006 at 4:42 am Brendan, excellent stuff. There is a definite need for a general purpose scripting language which is both easy for novices to pick up and good for powerusers. This scripting language should be for use on the client (browser,desktop,applications) and the server (web, db). JS2/ECMAScript 4 could definitely fill this need. As you rightly noted JS seems to have some wind in its sails with ActionScript, MAC OS X Dashboard widgets, KDE 4 and QT 4.1 and of course firefox. It seems like scripting languages are converging on fundamental semantics with a pragmatic mix of imperative, OO, functional paradigms and support for data typing, xml/sql data handling and programming in the large (packages/modules). Borrowing the core good ideas from python, perl, ruby, scheme is great. It stuck me when reading the ECMA spec pseudocode that an alternative english like syntax for ECMAScript – but with exactly the same semantics – would be useful. Especially for new users. Both syntaxes could compile down to exactly the same ast tree and convert from one to the other without any loss. For example: // C curly braces syntax var x as int = 10; var y as int = 11; if (x==10 && y==11) { doSomething(x); } // English like syntax – quite like Lua var x as int = 10 var y as int = 11 if x eq 10 and y eq 11 then doSomething(x) end if // or even pythonesque indentation if x = 10: doSomething(x) The past 10 years has shown the importance of getting the simple basics correct – which gives a foundation for developers to build rich solutions. MS are trying to do this with the total retooling of their languages and frameworks in vista. ie dotnet clr + xml. The non MS area needs to a have a coherent technology stack. I dont think Java has much of a role to play. Rather: C -> C++ (or D) -> JS2 + XML/JSON."
