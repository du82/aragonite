title = "June 2004 – Brendan Eich"
full_description = "Posted on June 14, 2004Mozilla 2.0 virtual machine goals Multiple languages supported, including JS, Java, and Python. Good cross-language integration: inheritance, type matching, etc. Cross-language debugging, ideally including C++. One GC to rule them all, preferably one shared GC, not a super-GC ruling a zoo of heterogenous GCs and reference-counting subsystems. Decent JITed performance, because performance matters when you can least afford to rewrite in C++. Sandboxed execution security model, type safety, defense in depth. Part of a larger open source platform . . . . . . that has momentum and excited developers hacking on it. A sufficiently open specification process for standardizing and evolving that platform. New XML language implementations easy to write, plug in, and demand-load (if we had this today, we would use it for non-web standards such as XForms). The last item means some number of frozen APIs into the content code, e.g. XTF. SVG and existing XUL and HTML widgets may provide a rich enough rendering vocabulary. If we can mix them well using XBL, then we may not need to expose frozen APIs into layout, gfx, etc. The goal should be minimal, supportable, and composable high-level APIs, where possible. XBL and XTF point the way. Back to the more programming-language-specific points above: comments welcome on realistic candidates. Obvious and controversial possibilities include Mono, Java (if open source), and Parrot (last I looked, *way* too Perl6-focused, not very mature, not looking likely to mature quickly). /be Posted on June 11, 2004Mozilla 2.0 platform must-haves libxul.so/libxul.dll, a versioned shared library with minimal, frozen, documented API exports, and fast intra-library calling convention code (so small footprint compared to today’s “GRE” or “XRE”). xulrunner/xulrunner.exe, so you can write ‘#! /usr/bin/xulrunner’ at the top of a .xul file and get busy. XUL 2 and XBL 2 — standardized specifications, greater binding language power, more scripting languages, iTunes-like widgets, and working remote XUL/XBL. SVG support to a useful level, not necessarily the whole 1.1 spec. Web Forms 2.0. XForms Basic (or ultra-Basic, details TBD — the heavyweight item is Schema-based validation) support as an optional, downloadable extension. JavaScript 2.0 support, including ECMAScript for XML support. Python support, perhaps via Mono (if so, along with other programming languages). That’s a good start. Comments? /be"
