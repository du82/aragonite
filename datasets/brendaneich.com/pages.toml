["https://brendaneich.com/2004/11/openlaszlo-and-eclipse"]
title = "OpenLaszlo and Eclipse – Brendan Eich"
full_description = "Posted on November 19, 2004 by Brendan EichOpenLaszlo and Eclipse Back in my February 2004 Developer Day slides, I promoted the idea of using Eclipse to create a XUL application builder, with direct-manipulation graphical layout construction and editing, project management wizards, etc. Although a few people expressed interest and even did some hacking (the MozCreator project being the most conspicuous example, although not Eclipse-based), no one actually created an Eclipse project and built on its Graphical Editor Framework to realize a XUL app-builder. The good news this week is Open Laszlo and IBM releasing the Eclipse IDE for Laszlo. LZX is cool, and similar in spirit, and in many ways in flesh, to XUL. So the thought occurs: why not patch the Eclipse IDE for Laszlo to support XUL as an alternative target language, and Firefox (or any new-style XUL app, soon enough unified via XULRunner) as the target runtime? Any takers? /be CategoriesMozilla, Uncategorized TagsEclipse, languages, XUL Stephen Duncan Jr says: November 20, 2004 at 6:56 am That would be great (unfortunately, way beyond my level; I’m hoping that having XUL support in Eclipse would be enough for me to get started using XUL for real…) While I think this needs to be done, and hope some smart person out there does it, what I really would like to see is work on getting the two languages (Laszlo and XUL) merged and standardized (as I wrote about just yesterday. Then each could target their own runtime (Flash or XULRunner/Firefox/etc.) Brendan Eich says: November 21, 2004 at 2:31 pm Stephen: we are already talking to Laszlo folks, and we’ll see what can be done quickly. It may not pay to converge and standardize, instead of harmonize. Laszlo would love to target native support in Firefox, of course, but that’s another Gecko extension to be written. If LZX evolves to use CSS and the full DOM and ECMA-262 Edition 3, then it’s a better match to a future Gecko (+ extension) target. Will: CPL. /be Stephen Duncan Jr says: November 21, 2004 at 9:16 pm Hey, I’m not experienced in this realm, nor smart enough to evaluate the differences between the languages. All I know is, as a developer I’m more likely to use an XML UI language for a rich client if there’s a single language with good support. I’m glad to hear discussions are going on, and I’m sure you guys will figure out the best path."
