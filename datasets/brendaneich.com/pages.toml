title = "A Minute With – Brendan Eich"
full_description = 'Posted on September 13, 2010 by Brendan EichA Minute With A Minute With Brendan is going great. I wanted to post a quick link to it for those of you who may have missed it. Good use of HTML5 <audio> too. Thanks to @Voodootikigod for producing it. The latest episode is about ES5 strict mode, stressing the importance of verifying that "use strict"; does what you intend. Strict mode implementation in Firefox is tracked here; it’s getting close to done. Word from a Microsoft representative at Velocity is that “if Firefox supports strict mode, IE9 will too.” Here’s hoping! If not, start writing letters or something ;-). /be CategoriesMozilla, Uncategorized Lex says: September 16, 2010 at 4:32 pm Hi, The rss feed for “a minute with” is broken. e.g. the mp3 link https://www.aminutewithbrendan.com/aminutewithbrendan/20100913/amwb-undefined.mp3 for the first in the feed just shows an error page. Reply'
