["https://brendaneich.com/2010/10"]
title = "October 2010 – Brendan Eich"
full_description = "Posted on October 16, 2010Should JS have bignums? jwz finally learns some JS and picks at an old scab that had almost healed. I reply in various comments. I include some little-known, kind-of-funny (not always ha-ha funny) history along the way to set several records straight. The issue before us now is whether to add value types to JS, perhaps by extending proxies, so you can implement non-reference-semantics objects with operators (because without operators, what’s the point?); or just add bignums; or do nothing. Comments welcome (to keep up with Akismet-gaming spammers — anyone have a better WP plugin to stop comment spam?). /be"
