["https://brendaneich.com/2010/10/should-js-have-bignums"]
title = "Should JS have bignums? – Brendan Eich"
full_description = "Posted on October 16, 2010 by Brendan EichShould JS have bignums? jwz finally learns some JS and picks at an old scab that had almost healed. I reply in various comments. I include some little-known, kind-of-funny (not always ha-ha funny) history along the way to set several records straight. The issue before us now is whether to add value types to JS, perhaps by extending proxies, so you can implement non-reference-semantics objects with operators (because without operators, what’s the point?); or just add bignums; or do nothing. Comments welcome (to keep up with Akismet-gaming spammers — anyone have a better WP plugin to stop comment spam?). /be CategoriesMozilla, Uncategorized Brett says: October 16, 2010 at 11:30 am To improve comments (and spam): https://wordpress.org/extend/plugins/disqus-comment-system/ Reply John Drinkwater says: October 16, 2010 at 12:11 pm Huh, to improve Brendan’s comments he should rely on a third party’s centralised system for storing them? Impressive thinking. Yes to value types, yes to removing what people see as bugs in the implementation. Reply Doug Holton says: October 16, 2010 at 12:30 pm If javascript gained an optional static type system like proposed for javascript 2 over 10 years ago, I wonder if that would let us fix the problem ourselves – such as the jsdocs / closure compiler one: https://docs.google.com/document/edit?id=1L6g92j9Z-w3uvDP0H-0whb2fOcwnjiXRY8pbG9LkOvQ&hl=en# Reply Brendan Eich says: October 16, 2010 at 1:25 pm Doug: we tried for years, in two sustained efforts, to get JS2 through the committee, and really, to get it completed so it was self-consistent and usable. We (Waldemar Horwat, the Macromedia guys, some top Opera language guys, and very smart Mozillans I dragged along) failed. There were many reasons why we failed, but politics was not really the main one in my opinion. If we get optional *non-static* types, I’ll be surprised. Static on the web? No way — when do you run the type-checker? How do you interface untyped and typed code efficiently? These are hard “gradual typing” problems in the research world. Anyway, purely dynamic value types with operators are relatively easy to do (double-dispatch, some rules for hashing and identity), so this is the likeliest outcome for an extensible system. But bignums could be hardcoded even more quickly. /be Reply"
year_published = 2010
