["https://brendaneich.com/2006/05/javascript-2-ecmascript-edition-4"]
title = "JavaScript 2 / ECMAScript Edition 4 – Brendan Eich"
full_description = "Posted on May 22, 2006 by Brendan EichJavaScript 2 / ECMAScript Edition 4 The talk I gave last Friday at XTech 2006 in Amsterdam, a revised and extended version of the talk I gave at the Ajax Experience the previous week in San Francisco, is here. CategoriesMozilla, Uncategorized Tagsconferences, presentations tag says: May 29, 2006 at 12:54 pm Brendan, I am looking forward to the introduction of let blocks, they make up for the simple scoping semantics of the original javascript in a non-intrusive way. I think they were a sound decision. One thing I am still hoping will be rethought is the package mechanism that the ECMA TG1 is proposing. A “first class” package mechanism isn’t really appropriate for javascript in my opinion. And it seems to me that the package mechanism being proposed is simply a hot copy of Java’s. I work with Java on a daily basis, and we have weekly technology discussions at my company where the broken semantics of Java’s package mechanism and package access restrictions have been a frequent topic of conversation. They very frequently make a mess of things, in fact. When I mentioned in my previous writings that I thought javascript was in need of a better package and extension mechanism, I was honestly hoping for a bit more creativity than borrowing the broken ones from Java. Let’s consider for a moment the fact that JavaScript is a particularly web driven language. How about using fully qualified uniform resource locators for package name spaces? This could very easily double as a mechanism for inclusion during runtime compilation, and inheritly introduces hierarchial name spaces. I have some ideas as to how to work this out, I will attempt to work out the kinks them and write about them soon. tag says: May 29, 2006 at 4:04 pm Regarding an extension mechanism for JavaScript, here is what I would like to see. I sincerely the ECMA TG1 considers something along these lines. https://www.blisted.org/wiki/papers/opinions/JavaScriptPackages"
