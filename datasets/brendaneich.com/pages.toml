["https://brendaneich.com/2012/02/mobile-web-api-evolution"]
title = "Mobile Web API Evolution – Brendan Eich"
full_description = "Posted on February 22, 2012 by Brendan EichMobile Web API Evolution Ragavan Srinivasan’s post about the forthcoming Mozilla Marketplace for Open Web Apps inspired me to write about Mozilla’s surging Web and Device API standards work. A bit of background. Mozilla has always contributed to web standards, going back to the start of the project. We co-founded the WHAT-WG to kick off HTML5. As readers of this blog know, we are a leader in JS standardization. We have some of the top CSS and layout experts in the world. In the last eight months, our efforts to extend the web standards to include new APIs needed to build compelling apps and OS components on mobile devices have really caught fire. B2G and Open Web Apps are the fuel for this fire. So I thought I would compile a list of emerging APIs to which we’ve contributed. In citing Mozillans I do not mean to minimize the efforts of standardization colleagues at Google, Microsoft, Nokia, Opera, the W3C and elsewhere. Standards are a multi-vendor effort (although excluding WebGL [see UPDATE below] one shiny name is conspicuously absent from this list). The Mozilla contributions are worth noting both to acknowledge the individuals involved, and to highlight how Mozilla is championing device APIs for the web without having a native application stack blessed with such APIs on offer. We see the Web as quickly evolving to match native stacks. We have no other agenda than improving the Web to improve its users’ lives, including Web developers’ lives — especially mobile users and developers. As always, standards in progress are subject to change, yet require prototype implementation and user-testing. Mozilla remains committed to playing fairly by not forging de-facto standards out of prototypes, rather proposing before disposing and in the end tracking whatever is standardized. Here is the list, starting with some 2011-era work: Geolocation, with Google contributing the editor and Firefox (thanks to Jay Sullivan leading the charge) implementing early. WebGL (UPDATE: Chris Marrin of Apple edited) and typed arrays. Gamepad API. Co-editor: Ted Mielczarek. Mozillans are also contributing to Pointer Lock. Screen Orientation. Editor: Mounir Lamouri. navigator.getUserMedia. Co-editor: Anant Narayanan Battery Status (in Last Call). From the Acknowledgements: Big thanks to the Mozilla WebAPI team for their invaluable feedback based on prototype implementations. Media Capture. Fabrice Desré prototype-implemented in Gecko. Network API. Editor: Mounir Lamouri. Web Telephony. Ben Turner, Jonas Sicking, Philipp von Weitershausen. Web SMS. Mounir Lamouri, Jonas Sicking. Vibration. From the Acknowledgements: The group is deeply indebted to Mounir Lamouri, Jonas Sicking, and the Mozilla WebAPI team in general for providing the WebVibrator prototype as an initial input. File API. Editors: Arun Ranganathan, Jonas Sicking. IndexedDB. Editors includes Jonas Sicking. I did not list most of the HTML5 and Web API work aimed at Desktop Firefox, to focus on the new mobile-oriented additions. There’s more to say, including about bundled-permission follies and how to weave permission-granting (with memorization) into interactions, but not here. One last note. The CSS vendor prefix brouhaha had, among many salutary effects, the benefit of shining light on an important requirement of competitive mobile web development: CSS style properties such as -webkit-animation-*, however you spell them, must have fast and beautiful implementations across devices for developers to find them usable: 60Hz, artifact-free rendering under touch control. This requires such work as off-main-thread compositing and GL layers. This is a high technical bar, but we are in the process of meeting it in the latest Firefox for Android and B2G builds, thanks to hard work from many people, especially Patrick Walton, Robert O’Callahan, Chris Jones, and Andreas Gal. Onward! /be CategoriesMozilla, Uncategorized"
