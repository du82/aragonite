["https://brendaneich.com/2010/07/a-brief-history-of-javascript"]
title = "A Brief History of JavaScript – Brendan Eich"
full_description = "Posted on July 21, 2010 by Brendan EichA Brief History of JavaScript It’s good to be back. I let the old blog field lie fallow in order to focus on work in Ecma TC39 (JS standards), Firefox 3.5, 3.6 and 4; and recently on a new project that I’ll blog about soon. In the mean time [UPDATE and in case the embedded video fails], here’s the video link from my JSConf 2010 surprise keynote in April. Highlights include: What would happen in a battle between Chuck Norris and Bruce Campbell Clips from Netsca^H^H^H^H^H^HEvil Dead 2 and Army of Darkness Discussion of where JS has been and what lies in its immediate future True facts: I did meet John McCarthy of LISP fame in 1977 My haircut was influenced by Morrissey’s (hey, it was the late ’80s) JS’s function keyword did come from AWK /be CategoriesMozilla, Uncategorized Tagshistory, humor, JavaScript, presentations Sveinung says: July 21, 2010 at 5:32 pm Great talk, hope to see you at jsconf.eu as well 🙂 *hint hint* Reply James Abley says: July 22, 2010 at 5:04 am Atom 0.3 feed? You might want to update your WordPress install! Reply orlando says: July 22, 2010 at 9:47 am Thanks for the video, Brendan. Would you please post the slides? i would appreciate it, thank you very much. Reply brendan says: July 22, 2010 at 12:07 pm James: wp update coming today thanks to @oremj. Orlando: will do, check under Presentations in a bit. Thanks, /be Reply Prestaul says: July 22, 2010 at 4:06 pm It’s good to have you back! This is a great talk. The JS world needs more than one voice that can speak with the same authority as Crockford. I don’t dislike Crockford, but we have suffered because he has been allowed to keep a monopoly on opinions about the language. Keep posting and stay vocal! Reply jc says: July 23, 2010 at 7:53 am If parts of harmony are rolled out piecemeal how will the versioning be handled? Also you mentioned types re Actionscript. Given the per function compilation strategies would type annotations – purely on function parameters – be useful: function add(a Number, b Number) { … } Surely the compiler could use the extra info – parameter ‘a’ is a Number and it’s not a string. Dev’s would find it useful – it’s additional documentation. The ability to type annotate for ‘pure’ math functions would be useful for math heavy WebGL code. How about a syntax for pure-ish math functions: function add(a Number, b Number) = a + b; // similar to the proposed: function add(a,b) (a + b) // but looks more math-y. Reply"
