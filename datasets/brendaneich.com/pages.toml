["https://brendaneich.com/2004/09/firefox-news-in-brief"]
title = "Firefox news in brief – Brendan Eich"
full_description = "Posted on September 9, 2004 by Brendan EichFirefox news in brief For the impending PR1 candidate builds (tomorrow’s, we hope): Alternate Style Sheet switcher makes a come-back thanks to Fantasai, with Ben reviewing and Asa approving. The statusbar icon won’t show up unless the page has alternate sheets, which is an improvement. There’s a View menu item to disables all author-level style sheets. Work Offline is back in File, and we may fix a few of its bugs for 1.0 if we can get help from Darin. Back to Mozilla roadmap topics in my next update, some time soon-ish. /be CategoriesMozilla, Uncategorized Tagsbuild, Firefox Joey says: September 9, 2004 at 7:02 pm yay 🙂 what about the site update notification… is there a way to get it as an extention… like just take the code and make it an extention… please… i know its buggy but I want it! /rant Brendan Eich says: September 9, 2004 at 7:21 pm Joey: sorry, what site update notification? Give me a link or a bug number. /be Jeff Walden says: September 9, 2004 at 8:29 pm I think he means the tab in the bookmarks properties for notifying when the bookmark site changed. I don’t know a bug number for it either, and a CVS log for the file showed no obvious bug numbers for the removal (or perhaps I just missed how the removals actually occurred). It was removed because notifications and scheduling were broken somehow. Devon says: September 9, 2004 at 9:06 pm So, that sounds like one has no way of turning off the style for a page, if there’s not at least one alternate stylesheet. Which’ll suck IMHO, since most sites I NEED to use the style switcher for, don’t have alternate stylesheets. anon says: September 9, 2004 at 9:15 pm There’s a View menu item to disables all author-level style sheets. The menu item will always be there. The status bar icon will only be there when alt style sheets are present. Phil Ringnalda says: September 9, 2004 at 9:31 pm Bookmark notification removal was bug #253478 (and doesn’t look like a simple little extension will bring it back)."
