["https://brendaneich.com/2004/07/whatwg-and-rss"]
title = "WHATWG and RSS – Brendan Eich"
full_description = "Posted on July 12, 2004 by Brendan EichWHATWG and RSS Dave Winer seems to have misheard my exchange with the Gillmor Gang about RSS and HTML: I was asked, at around 36 minutes into the show (not 20 minutes), whether the Web Hypertext Application Technology Working Group considered RSS to be “completely orthogonal” to HTML, and I said (paraphrasing slightly) “RSS is not on the WHATWG’s radar, we are extending HTML to better support web apps”. Steve Gillmor then went on to aver that RSS and HTML were orthogonal, and asked about browser built-in HTML editing support for bloggers. Based on this brief exchange, Dave blogged: “I agree with everything Brendan says up to the point where he says RSS and HTML are orthogonal. Take another look, RSS wraps chunks of HTML with useful metadata.” Now, wrapping chunks of HTML in RSS sounds like a proof of orthogonality to me, especially if the HTML can be wrapped and unwrapped freely. But maybe I’m using too mathematical a definition of “orthogonal.” WHATWG may yet be interested in RSS for HTML metadata, but no one involved has brought RSS up in connection with web apps. Dave, if you care to make a proposal, here’s the list info. /be CategoriesMozilla, Uncategorized Tagspress, RSS Dave Winer says: July 13, 2004 at 9:51 am I don’t have a proposal to make, and I don’t think whether or not it’s orthogonal is a big deal. 99 percent of what I said was in total agreement with you, and praising what you’re doing. Peace. Brendan Eich says: July 13, 2004 at 6:23 pm Hi Dave, thanks for clarifying. Another thing you said rang true, though: HTML stagnation drove innovation on “the web” into other, similar media types, mainly RSS. That does suggest that WHATWG should look at RSS and see what could be built upon, or used as-is, for better web apps. Still, WHATWG has no RSS experts involved that I know of (someone correct me if I’m wrong). /be Dave Winer says: July 14, 2004 at 6:49 am Glad to clear that up. If you want to hear some more, I did an audio blog post about this yesterday morning. https://cyber.law.harvard.edu/blogs/gems/crimson1/coffeeNotesJuly13.mp3 And I do have an idea for you re RSS, but it’s hard to communicate in writing. And for right now, stay on the course you’re on, it’s the right one."
