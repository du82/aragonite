title = "September 2010 – Brendan Eich"
full_description = 'Posted on September 13, 2010A Minute With A Minute With Brendan is going great. I wanted to post a quick link to it for those of you who may have missed it. Good use of HTML5 <audio> too. Thanks to @Voodootikigod for producing it. The latest episode is about ES5 strict mode, stressing the importance of verifying that "use strict"; does what you intend. Strict mode implementation in Firefox is tracked here; it’s getting close to done. Word from a Microsoft representative at Velocity is that “if Firefox supports strict mode, IE9 will too.” Here’s hoping! If not, start writing letters or something ;-). /be'
