title = "Fresh XPCOM Thinking Update – Brendan Eich"
full_description = "Posted on April 27, 2006 by Brendan EichFresh XPCOM Thinking Update Graydon has been busy. The XPCOM garbage cycle collector lives. Huzzah! One (half-way) down, two to go…. /be CategoriesMozilla, Uncategorized marek says: May 29, 2006 at 6:46 am hello, i am from austria, so my english is not the best. my question : how work this tool? can you give me a link to see more? Brendan Eich says: July 14, 2006 at 5:54 pm marek: see https://bugzilla.mozilla.org/show_bug.cgi?id=333078, especially https://bugzilla.mozilla.org/show_bug.cgi?id=333078#c45, which links to a nice graph showing cycles that the collector finds. The cycle collector is not an offline tool, it’s a garbage collector built into Gecko. So you’ll have to study the code, or try the patch and turn on the graph visualizer as graydon describes in the bug. /be"
