full_description = "Posted on September 9, 2004Firefox news in brief For the impending PR1 candidate builds (tomorrow’s, we hope): Alternate Style Sheet switcher makes a come-back thanks to Fantasai, with Ben reviewing and Asa approving. The statusbar icon won’t show up unless the page has alternate sheets, which is an improvement. There’s a View menu item to disables all author-level style sheets. Work Offline is back in File, and we may fix a few of its bugs for 1.0 if we can get help from Darin. Back to Mozilla roadmap topics in my next update, some time soon-ish. /be"
