["https://bresink.com/osx/SystemLoad-de.html"]
title = "SystemLoad: Beschreibung"
description = "Produktbeschreibung für SystemLoad"
full_description = "SystemLoad SystemLoad ist ein Diagnoseprogramm, das Ihnen dabei hilft, Probleme mit der Kühlung oder Netzteilen von Apple Macintosh-Computern zu erkennen. Das Tool setzt einen oder mehrere Prozessoren einer vom Benutzer definierbaren Last aus. Dies kann dabei helfen, die folgenden Situationen zu diagnostizieren: Probleme mit dem Kühlungssystem oder Temperatursensoren, Probleme mit Zwitschergeräuschen durch schwingende Bauteile in der Spannungsversorgung, die bei bestimmten Computermodellen auftreten können, Probleme mit Akkus von tragbaren Computern. Wenn es gewünscht wird, setzt das Programm den oder die Prozessoren der maximal möglichen Last aus, was die höchstmöglichen Temperaturwerte und größtmögliche Belastung des Netzteils erzeugt. Sie können somit überprüfen, ob alle Komponenten (CPUs, Sensoren, Kühlungssystem, Stromversorgungseinheit, Akku-Einheit) korrekt arbeiten, wenn sie an ihre Konstruktionslimits gebracht werden. Es ist weder eine Installation, noch spezielle Verwaltungsberechtigung erforderlich. Nichts am Betriebssystem wird verändert. Sie können SystemLoad kostenlos herunterladen."
