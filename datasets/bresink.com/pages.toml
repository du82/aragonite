full_description = "Sync Checker: Buying licenses Try before Buy You can download the application Sync Checker free of charge. This allows you to evaluate the software to see if it suits your needs. If you like the software and want to keep it, you will have to place an order for the number of usage licenses you require. You will receive the requested number of registrations from the software reseller. Each registration allows you to unlock the software to fully utilize it. Standard registrations for single licenses are per computer, while personal use on an additional second computer is tolerated. IMPORTANT NOTE: Versions of Mac OS X or OS X prior to macOS 10.12 can no longer support the current safety standards for Internet communication. Apple does not provide the necessary security certificates and TLS versions. For this reason, these historic OS versions cannot contact our license servers any longer. New licenses will only work with macOS 10.12 or higher with Sync Checker 3.71 or higher. Prices and Placing Orders Prices and Placing Orders Registrations can be ordered via our global distribution partner. Please see the notes below. Type of license Suggested retail price Get definite price info Single license, 1 unit $ 14.90 / € 14.00 Order page Price indications are manufacturer's suggested retail prices excluding taxes. Delivery is free. For a binding offer in your national currency and including taxes, open the order page of the software retailer. Product activation via Internet is required. In high-security environments, offline activation without Internet may be allowed under certain circumstances. Your order is processed using secure, SSL-encrypted communication. If you like to get more details about the purchase process, delivery, pricing and your rights before placing an order, please see our detailed information page. Immediate Delivery. Simple Unlocking. As soon as the merchant PayPro Global has confirmed your payment, you will receive your registration data for unlocking the application in plain text on the web page. Additionally, you will receive a copy of the data via email for permanent archiving. More Information… Payment Options The payment options depend on the country you are in and the type of device you are using to place the order. The software reseller PayPro Global may accept up to 60 different types of payments, including all major credit cards and PayPal®. Payment options that require manual processing (like Bank Transfer) may be subject to an additional service fee."
