["https://bresink.com/osx/SystemLoad.html"]
title = "SystemLoad: Description"
description = "Product description for SystemLoad"
full_description = "SystemLoad SystemLoad is a diagnostic application assisting you in the detection of cooling or power supply problems with Apple Macintosh computers. The tool can put a user-definable load onto one or more processors. This can help in diagnosing the following issues: problems with the cooling system or temperature sensors, problems with chirping noise caused by oscillating parts in the voltage supply circuitry of specific computer models, problems with battery units of portable computers. When desired, the tool can put the processor(s) under the maximum load possible, generating the highest possible temperatures and highest load on the power supply. This way you can verify if all components (CPUs, sensors, cooling subsystem, power supply unit, battery unit) are working correctly when they are being pushed to their design limits. No installation is required, no administrator permissions are needed, nothing is changed in the operating system. SystemLoad is electronically distributed software. You can download the product free of charge."
