["https://bresink.com/osx/301031383-2/history.html"]
title = "TinkerTool System 9: What's new?"
description = """
Product history for TinkerTool  System 9"""
full_description = "What's new? TinkerTool System 9 Version History Release 9.4 (Build 250203) Adds new pane to control the automatic power-on feature of portable Macs with Apple Silicon. Autostart by opening the lid or connecting power can be prevented (macOS 15.3 or higher required). The layout of panes that don’t have submenus has been modified slightly. Release 9.3 (Build 250121) The list of Macintosh model series shown when downloading components to create macOS installation media has been updated. The interface of the control pane to protect user data against iCloud access has been slightly redesigned. This should prevent users from mistakenly locking iCloud features in the active (“on”) state. This versions adds a workaround for an issue in some versions of macOS where flash storage and SSD health supervision mistakenly monitor the magnetic disk parts of Fusion Drives. Some technical details have been updated in the reference manuals. Release 9.2 (Build 241119) Added new feature to show the current operational status and version of the XProtect antivirus software which is part of macOS. (The functions are located on the pane Maintenance.) Added new feature to retrieve the status info of the latest version of XProtect currently offered by Apple. Added new feature to update XProtect immediately. Added new feature to retrieve the activity log of XProtect. The feature to check whether an installed application has been published via the App Store (which had to be removed in July 2024) was completely rewritten using different technology, so it could be reinstated. The feature to retrieve the activity log of Time Machine backup sessions (which had to be removed for macOS Sequoia) was completely rewritten using different technology, so it could be reinstated. This feature is available for APFS backup media only. The feature to download IPSW files for macOS installation media now shows updated info for Macs with M4 processors released in November 2024. Added new user interface for simplified license registration and activation features which will become available in the near future. Release 9.1 (Build 241014) As Apple has now released the official manuals and support documentation for macOS Sequoia, all links in the quick-help feature could be updated and adjusted accordingly. The Uninstallation Assistant now also deletes the user’s corresponding list of recent documents when removing an application. Added a workaround for an internal issue of macOS Sequoia which could prevent the Logs feature from opening archived copies of the macOS log database. The feature to modify the user’s POSIX permission filter is now supported again when the application detects an operating system version which is capable of providing this feature reliably. The term “Apple Account” has been updated in the reference manuals. Fixed a problem where the feature to delete a selected Time Machine snapshot from APFS media confirmed a successful removal when actually no operation was performed. Release 9.0 (Build 240916) Added full support for macOS 15 Sequoia. More than 1,000 internal changes to optimize for macOS 15. The timing behavior when accessing values from the Open Directory database has been changed. The ensures better performance and avoids possible deadlocks with slow database connections. Fixed a problem where some state designations for certain configuration settings could be shown in English instead of the language selected by the user. Fixed a problem where changing the default user name for network logins did not work as expected. The features to modify the permissions filter for new file system objects and to rebuild the Launch Services database have been made invisible at the moment, because the first versions of macOS Sequoia don’t run stable enough to support this. These items can hopefully re-appear at a later time. The features to compute change statistics, local file deletion and log retrieval for old Time Machine backups created on HFS+ volumes have been removed, because they are no longer supported by macOS 15. The diagnostic feature to test for specific defects of copy operations via the macOS Finder have been removed because new defects can have an impact on old ones, making the results less meaningful. Apple did not fix these issues in the last 14 years. The feature to reset a hanging macOS software update request had to be removed because it was blocked by Apple. The following features have been removed because they no longer make sense with macOS 15, or the necessary system components are no longer present in Sequoia: Removing invalid keychain entries created by Xcode Repairing the color tags feature for objects on network file servers Firmware integrity checks for EFI and for Broadcom Ethernet chips Unlocking outdated AFP authentication methods for old AppleShare servers Catalina security guidelines for execution of Remote Apple Events Resetting or repairing the startup language setting Showing computer-related info on the login screen Enforcing rerun of the macOS Setup Assistant via TinkerTool System for Recovery Mode. Release 8.95 (Build 240731) Added support for alternative preview versions of upcoming operating systems. Added new feature to add color tags to file system objects stored on network servers (see Issues > Tags). This can be used as workaround for defective versions of the macOS Finder which can no longer do this. When showing undocumented Spotlight attributes for files, TinkerTool System will now handle cases where Spotlight has intentionally stored invalid date and time values more transparently. Release 8.94 (Build 240712) Added new feature to disable the indicators for caps lock and dictation next to the text caret (see System Miscellaneous settings, macOS Sonoma and later only) Added new feature to disable the Emoji suggestion assistant next to the text caret (macOS Sonoma and later only) Added new features to describe more undocumented Spotlight attributes when analyzing the contents of files. More than 20 attributes have been added (see File Contents pane). Added new features to describe more Sandbox exceptions when analyzing the security of applications. More than 80 entitlement entries have been added (see Applications Security Check). Added the detection of new types of temporary files when checking and cleaning preference settings (User pane). This also affects TinkerTool System for Recovery Mode. The entry to assess whether an application was licensed via the App Store was removed from the Applications Security Check pane. Due to changes in the App Store, a reliable analysis is no longer possible. The policy not to allow the removal of Apps purchased from the App Store via the Uninstallation Assistant is no longer in effect. Release 8.93 (Build 240612) This release adds preliminary support for future versions of macOS. Release 8.92 (Build 240515) Added new feature to reset the macOS time synchronization service (on the pane Issues). This can repair the operating system in cases where it continuously sets wrong time and date. The filtering options when retrieving log entries from the macOS log database now permit to use identifiers and names containing spaces. The general icons indicating successful or failing operations have been modernized throughout the application. They will now better match the design of up-to-date macOS versions. Internal modifications and updates necessary to adapt to changes in recent versions of macOS. Fixes a problem where it was possible to leave the pane for Power Schedule settings without saving changes. Fixes a problem especially with slow computers where retrieving entries from the macOS log database could sometimes fail with an error message indicating a possible syntax error. Release 8.91 (Build 240417) Added new feature to separate or extract logs for specific process instances after a query has been made in the macOS log database. The user interface to work with the macOS database has been slightly redesigned. Fixed a problem where the options to retrieve source program and “signpost” information from the macOS log database did not work as expected. Changed error handling for cases where Apple blocks maintenance access to the macOS Software Update Service in operating systems published after March 2024. Several changes in the internal application architecture. Release 8.9 (Build 240214) The feature to work with Spotlight was completely rewritten to supported the latest operating system versions. The corresponding user interface was redesigned. Added new detail panel when reviewing the Spotlight index of a volume. Added progress display when discarding or restoring unprotected user caches. Added new diagnostic features to determine whether and why macOS is slow when processing inactive user caches. All tables where bullets are used to indicate yes/no status information now use larger bullet characters for better readability. Release 8.89 (Build 240111) Added new features for authorization of privileged operations. The application will now allow authentication of administrative users in additional special cases previously not permitted: authorization within a running login session of a non-administrator authorization by administrators with empty passwords in operating system versions that don’t block this generally authorization in cases where multiple users are logged in, but the affected user is not on the frontmost console session Administrators can return to the previous stricter authorization policies if needed. Added features on the Power Schedule pane that allow the definition of repeating events with more complex configurations. It is now possible to define arbitrary combinations of weekdays to trigger power events. Added a refresh button on the pane to remove slow-motion screen savers (macOS Sonoma only). Updated list of system services that perform automatic cleanup of storage space. Small changes in data presentation on the pane for RAM size evaluation. Fixed a problem where the layout of integrated TinkerTool panes was not as intended with specific operating system versions and languages. Release 8.88 (Build 231116) Added new feature to remove the large files of optional Apple slow-motion screen savers immediately if necessary (macOS 14 or later only). Added support for new Background Item technology in upcoming versions of macOS. Added support for testing fans on Macs with M3 processors. All features that search or modify files selected by the user have been revised to avoid conflicts with iCloud or cloud solutions of other vendors. Opening affected folders will no longer trigger automatic synchronization downloads executed by macOS. Updated support for cleaning kernel core dump files. Release 8.87 (Build 231024) Added new feature to remove history entries from the user’s “Go to folder” panel of the Finder. The feature to reset home folder permissions for a user account was rewritten completely: The accuracy when recreating the recommended permission settings of a fresh macOS user account has become even higher. The folder modification dates will now only be changed if necessary. Files owned by the operating system will now be included in the reset procedure. A new reminder dialog makes the user aware that cloud synchronization should be avoided while the reset operation is running. Added support for new authentication situations available in macOS Sonoma. The quick help feature was updated to consider Apple’s latest additions to macOS reference manuals. Many small changes and optimizations in the user interface. Fixed a problem where TinkerTool System for Recovery Mode (ttsfrm) could show a misleading error message on Macs with Apple Silicon. Note: Users who like to integrate TinkerTool into TinkerTool System need to update TinkerTool to version 9.6 or later for technical reasons. Release 8.86 (Build 230925) Added full support for macOS 14 Sonoma. Added new options to reset the privacy settings for Location Services, Motion & Fitness (macOS 14 or later only), and Passkeys Access for Web Browsers. Added new features for software developers when performing a security check on a single application that is not planned to be distributed through the App Store: It can be validated whether an application is ready either to be submitted to Apple’s notary service, or to be executed on customer computers. This feature is only available for macOS 14 or later. Users can now also go back to the overview menu of a pane with subitems by clicking onto the pane in the sidebar. Due to architectural changes in recent Macintosh models and macOS versions, the feature to disable System Integrity Protection by mouse click via the emergency utility (ttsfrm) had to be removed. Fixed a problem where the current status of System Integrity Protection may not have been shown correctly on Macs with Apple Silicon. Release 8.85 (Build 230816) Added new feature to the monitor test. It is now possible to add a moving black raster overlay with a grid size of 1 or 2 physical pixels to the color screens. This can make it even easier to detect hanging or dead pixels on high resolution displays. Added a workaround for a design flaw in macOS Ventura which could prevent the creation of install media for older versions of OS X and macOS. Added further support for future versions of macOS. Some workflows on the Install Media pane have been modified to work more efficiently. The instructions on the Emergency Tool pane for working with TinkerTool System on macOS Recovery systems now use special markers to identify spaces in the necessary Terminal command more clearly. Release 8.8 (Build 230712) Added new feature to change the time specifications for file system objects. This includes, if available, time of last modification, last access, last backup, and the creation time. The time of last status change is shown additionally. Added new feature to support the revised beta test procedures of macOS. On the Info pane, the indicator Release Status on the Operation Environment page was replaced by a System Update Source field. Added new field for idle latency in the results of the macOS network responsiveness test. Added further support for future operating systems. Many small changes in the user interface reflecting new developments in macOS. Fixed a problem where the Finder copy operation checks could not be run, because macOS prevented it. Release 8.7 (Build 230614) Added new feature to detect and clear orphaned Access Control List permissions from a local volume. Orphaned ACLs refer to accounts no longer present on the system. Added new feature to indicate the true type of file system objects presented by the Finder as alias. Added new feature to transfer orphaned files which no longer have a known owner to other user accounts. This is an alternative option for the feature known for years to automatically remove such files. Added new feature to repair the operating system in cases where macOS does not allo"
