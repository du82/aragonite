["https://bresink.com/Blog/2018/blog-2018-09.html"]
title = "Blog - Archived Entries - September 2018"
description = "Blog Marcel Bresink Software-Systeme - Archived Entries - September 2018"
full_description = "Blog - Archived Entries - September 2018 The latest news are listed first. — See more latest news from the current blog. September 28, 2018: Apple releases new software via macOS Software Update: macOS High Sierra 10.13.6, re-released version (Update Product ID: 091-94330) macOS High Sierra 10.13.6 Supplemental Update 2 for MacBook Pro 2018 (Update Product ID: 091-97109) macOS High Sierra 10.3.6, version for App Store mini installers, re-released version (Update Product ID: 091-94329) XProtect version 2100 (Update Product ID: 091-79548) XProtect is part of the built-in antivirus software of macOS. September 27, 2018: Apple releases new software via macOS Software Update: Compatibility List for the Mojave installer (Update Product ID: 041-02517) This silent update provides the latest list of software products known to be incompatible with macOS 10.14 Mojave. The Mojave installer uses this information to clean the operating system from problematic components. September 26, 2018: Apple releases new software via macOS Software Update: Safari Technology Preview version 66 (Update Product ID: 041-08725 / 041-08189) Safari Technology Preview allows users to get a sneak peek at upcoming web technologies in macOS and experiment with these technologies in websites and extensions. September 26, 2018: We are releasing a slightly modified build (180926) of TinkerTool System 6.0. The modified version is necessary for beta testers who are using early preview versions of macOS 10.14.1. TinkerTool System 6 is the latest version of the TinkerTool System product series, designed exclusively for macOS 10.14 Mojave and later. September 25, 2018: Apple releases new software via macOS Software Update: Whitelist for Macintosh firmware security checks (“EFICheck AllowList”), version 30 (Update Product ID: 091-94053) VoiceOver for iPod (Update Product ID: zzzz091-96431) The VoiceOver Kit enables compatible iPods to announce the names of playlists, songs, and artists, as well as battery status and other messages, in multiple languages. Support for iTunes 12.6.1 was added. September 25, 2018: We are releasing System Monitor version 2.5 through the Mac App Store. The new version adds full support for macOS 10.14 Mojave. Legacy technology has been removed. The minimum required OS version is now 10.10. System Monitor is an application for the menu bar of macOS, designed to inform you unobtrusively about the activity of your computer. September 24, 2018: Apple releases new software via macOS Software Update: macOS 10.14 High Sierra, version for App Store mini installers (Update Product ID: 041-08708) Gatekeeper version 155 (Update Product ID: 041-05490) BridgeOS for systems with macOS 10.14 and T2 processor (Update Product ID: 041-08711) Gatekeeper updates malware definitions for all Macintosh operating systems as of OS X 10.8 Mountain Lion and higher. It is part of the built-in antivirus software of macOS. September 24, 2018: We are releasing the new application TinkerTool System 6. The application is a collection of system utility features helping you in performing advanced administration tasks on Apple Macintosh computers. The latest generation is designed exclusively for macOS 10.14 Mojave and later. Users who purchased a license for TinkerTool System 4 or 5 between May 17, 2018 and September 24, 2018 will receive a free upgrade. The upgrade licenses will be delivered by email beginning on September 25, 8:00 a.m. World Time (UTC). September 24, 2018: We are releasing TinkerTool version 7.0. The new version adds full support for macOS 10.14 Mojave. TinkerTool is an application that gives you access to additional preference settings Apple has built into macOS. This allows to activate hidden features in the operating system and in some of the applications delivered with the system. September 24, 2018: We are releasing TinkerTool System 5 version 5.96. This version integrates into all TinkerTool System generations. It adds a new feature to the tts standalone program to indicate whether the operating system is an official release or a beta version. TinkerTool System 5 is a collection of system utility features for the operating systems macOS 10.12 Sierra and macOS 10.13 High Sierra. September 24, 2018: We are releasing Battery Monitor version 2.8 through the Mac App Store. The new version adds full support for macOS 10.14 Mojave. Legacy technology has been removed. The minimum required OS version is now 10.10. Battery Monitor is a powerful App to display the charge state of portable Macs in the Dock, to display internal battery information, to capture charge and discharge curves, to keep logs of the aging process of the battery, and to add notifications via Notification Center or speech output. September 24, 2018: We are releasing NFS Manager version 4.6. The new version adds full support for macOS 10.14 Mojave. It also fixes a problem with the English user interface where a duplicate “to” was displayed in dialogs that ask for privileged operations. NFS Manager is an application to control the NFS features built into macOS via a comfortable graphical user interface. September 24, 2018: We are releasing PrefEdit version 4.0. The new version adds full support for macOS 10.14 Mojave. Legacy technology has been removed. The minimum required OS version is now 10.10. All features related to preference manifest files have been removed. Apple has lost interest in this technology and is no longer actively supporting it. PrefEdit is an application to manage nearly all aspects of the macOS preference system. September 24, 2018: We are releasing Sync Checker version 2.7. The new version adds full support for macOS 10.14 Mojave. It also adds a new feature to remove outdated versions of the security component from computers where previous generations of Sync Checker have been in use. Sync Checker is a diagnostic application which can check if two folders or disks are perfectly synchronized. September 24, 2018: We are releasing Backup Server Control version 1.4. The new version adds full support for macOS 10.14 Mojave. It also fixes a problem with the English user interface where a duplicate “to” was displayed in dialogs that ask for privileged operations. Backup Server Control provides a graphical user interface to setup and administer a server for network-based Time Machine® backups. September 24, 2018: We are releasing SystemLoad version 3.1. The new version adds full support for macOS 10.14 Mojave. SystemLoad is a diagnostic application assisting you in the detection of cooling or power supply problems with Apple Macintosh computers. The tool can put a user-definable load onto one or more processors. September 24, 2018: Apple releases the operating system macOS 10.14 Mojave. The new features include Dark Mode, Desktop Stacks, a modified workflow for screenshots, and a redesigned Mac App Store. New Apps for Apple HomeKit control, stocks and voice memos have been added. All our software products will be re-released today to fully support Apple's latest operating system. (The release date of Apps from the Mac App Store will depend on Apple.) September 17, 2018: Apple releases new software via macOS Software Update: Safari 12 for macOS High Sierra (Update Product ID: 091-77636) Safari 12 for macOS Sierra (Update Product ID: 091-79545) Command Line Tools for macOS High Sierra (Update Product ID: 091-63661) Boot Camp ESD Update (Update Product ID: 041-04418) Boot Camp ESD is an Electronic Software Distribution package that provides drivers for running Microsoft Windows on Macintosh computers. September 12, 2018: Apple releases new software via macOS Software Update: Mobile Device Support on Demand (Update Product ID: 041-02511) This software package adds support software and icons for Apples new Watch and iPhone model series. It is compatible with OS X 10.11 and later. September 10, 2018: Apple releases new software via macOS Software Update: Safari Technology Preview version 65 (Update Product ID: 041-04651) Safari Technology Preview allows users to get a sneak peek at upcoming web technologies in macOS and experiment with these technologies in websites and extensions. September 4, 2018: Apple releases new software via macOS Software Update: Gatekeeper version 154 (Update Product ID: 041-03312) macOS High Sierra 10.13.6 Supplemental Update 2 for MacBook Pro (2018), revised version (Update Product ID: 091-97109) Gatekeeper updates malware definitions for all Macintosh operating systems as of OS X 10.8 Mountain Lion and higher. It is part of the built-in antivirus software of macOS. Older entries…"
