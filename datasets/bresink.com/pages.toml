["https://bresink.com/osx/PropEdit-de.html"]
title = "PropEdit: Beschreibung"
description = "Produktbeschreibung für PropEdit"
full_description = "PropEdit PropEdit ist ein Betrachter und Editor für Apples Eigenschaftslistendateien (Property Lists, „plist“) und JSON-Dateien (JavaScript Object Notation). Es richtet sich sowohl an Software-Entwickler als auch an Endbenutzer, die einfachen Zugriff auf plist- und JSON-Dateien haben möchten. Sie können jeden Wert in den Dateien ändern. Eigenschaftsnamen, Eintragstypen und Werte können uneingeschränkt bearbeitet werden. Einträge lassen sich entfernen, hinzufügen oder umsortieren. Das Programm behandelt verschachtelte Einträge beliebiger Tiefe korrekt. Die Sortierreihenfolge von Einträgen in den Dateien kann beibehalten werden. Das Programm hat volle Undo/Redo-Unterstützung (Rückgängigmachen von Aktionen) mit einer unbegrenzten Anzahl von Schritten. PropEdit bietet volle Unterstützung für die Funktion „Versions“ des Betriebssystems. Falls Sie Dateien mit PropEdit ändern, können Sie später wieder auf frühere Versionsstände zurückgehen. Es ist möglich, nach jedem Eintrag in einer Eigenschaftslistendatei zu suchen, entweder über den Wert oder den Eigenschaftsschlüssel eines Eintrags. PropEdit kann XML-basierte und binäre Eigenschaftslistendateien öffnen und speichern. Benutzer können frei zwischen den verschiedenen Varianten konvertieren. Zusätzlich ist es möglich, Eigenschaftslistendateien im OpenStep-Format zu öffnen, das im macOS-Vorgängersystem NeXT OPENSTEP for Mach zum Einsatz gekommen ist. PropEdit kann Listen im JSON-Format öffnen und speichern. Beim Schreiben können wahlweise gut lesbare oder besonders kompakte Dateien erstellt werden. Falls technisch machbar, können plist- und JSON-Dateien in beide Richtungen konvertiert werden. PropEdit entstand als vereinfachte Fassung unserer Programme PrefEdit und PrefEdit App, die zu den ältesten Anwendungen für die Arbeit mit Eigenschaftslisten auf der macOS-Plattform (früher: Mac OS X und OS X) gehören. PropEdit ist für die Einschränkungen des App Store optimiert worden. Anders als PrefEdit unterstützt PropEdit nicht das direkte Arbeiten mit dem Einstellungssystem von macOS („Preferences“), da Apple dies im App Store seit Juni 2012 nicht mehr erlaubt. Dafür unterstützt PropEdit zusätzlich das JSON-Format. Die Software wird elektronisch über Apples Mac App Store vertrieben."
author = "Marcel Bresink"
year_published = 2025
clearnet = "https://bresink.com/osx/PropEdit-de.html"
