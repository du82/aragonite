full_description = "Mac Power Monitor Mac Power Monitor ist eine grafische, einfach zu bedienende Oberfläche für die Energie- und Leistungsmessfunktionen von macOS. Eine Vielzahl statistischer Auswertungen kann abgerufen werden, wie Leistungsübersicht, Prozessstatistiken, Datenübertragungsbandbreiten von Hardware-Komponenten, Interrupt-Quellen, Interrupt-Verteilung, Daten der Prozessorkerne und vieles mehr. Die Daten können entweder live mit einer Rate von 1 Messung pro Sekunde, oder als Einzelmessung mit einer beliebigen einstellbaren Messdauer ab 1 Millisekunde erfasst werden. Auf einem Mac mit Apple-Chips ist das Überblicksfenster so gestaltet, dass es in etwa der gewohnten Anzeige des bekannten Befehlszeilenprogramms asitop von Timothy Liu entspricht. Die Software wird elektronisch vertrieben. Sie können das Produkt herunterladen und testen, bevor Sie sich zum Erwerb einer uneingeschränkten Nutzungserlaubnis entscheiden."
