["https://bresink.com/osx/orderfaq-de.html"]
title = "Bestellung und Lieferung von Registrierungen"
description = """
Oft gestellte Fragen: Bestellen  und Erhalten von Software-Registrierungen"""
full_description = 'Bestellung und Lieferung von Registrierungsschlüsseln: Oft gestellte Fragen Um zur Produktseite zurückzukehren, verwenden Sie bitte die "Zurück"-Schaltfläche Ihres Browsers. Wie kann ich bestellen? Der Bestellvorgang ist sehr einfach. Die meisten Bestellungen für macOS-Produkte werden von unserem Geschäftspartner PayPro Global bearbeitet. Um den Bestellvorgang zu beginnen, klicken Sie auf das Wort Bestellseite neben dem Produkt, das Sie ordern möchten. Sie werden auf die Bestellseite von PayPro Global geleitet. Stellen Sie die Sprach- und Währungsauswahl nach Ihren Wünschen ein. Der Preis kann in Euro, US-Dollar oder in mehr als 130 anderen internationalen Währungen angezeigt werden. Preisangaben in Fremdwährungen basieren auf dem Dollar- oder Euro-Preis, je nach Ihrem Land und Ihrer Auswahl. Der Endpreis mit Steuern kann nur berechnet werden, nachdem Sie das Lieferland angegeben haben. Passen Sie die Anzahl der zu bestellenden Produkte an, falls erforderlich. Geben Sie Ihre persönlichen Daten ein. Wählen Sie eine Zahlungsweise. Folgen Sie den Anweisungen, die gegeben werden. Sobald Ihre Zahlung bestätigt wurde, erhalten Sie sofort Ihren Registrierungscode. Eine gültige Rechnung kann ausgedruckt werden. Zusätzlich werden Sie eine Kopie von Registrierung und Rechnung per E-Mail erhalten. Wie sieht eine Bestellung aus? Das folgende Bild zeigt ein Beispiel: Dies ist das Produkt, das Sie bestellen. Die Stückzahl lässt sich ändern. Wählen Sie Ihre Sprache mit diesem Menü aus. Die Währung wird hier eingestellt. Bei einer Bestellung für ein Unternehmen sollten Sie diesen Punkt einschalten. Sie können Ihre Ust-Id-Nr angeben und sind eventuell steuerbefreit. Geben Sie hier Ihre persönlichen Daten an. Dies ist die Adresse für die Rechnung. Aktivieren Sie diesen Schalter, falls Sie die Registrierung im Auftrag für eine andere Person bestellen. Wählen Sie hier die Zahlungsmethode. Wie wird das Produkt ausgeliefert? Registrierungen für unsere macOS-Produkte werden grundsätzlich elektronisch ausgeliefert. Sie werden Ihnen per Web-Seite und E-Mail von PayPro Global zusammen mit einer Rechnung zugesandt, sofort nachdem Ihre Zahlung bestätigt wurde. Jede Registrierung wird Ihnen als Schlüsselcode übermittelt, eine Abfolge von Buchstaben und Ziffern, die in das Programm eingetippt oder kopiert werden können, für das Sie die Registrierung bestellt haben. Der Schlüsselcode wird dann per Internet geprüft und schaltet alle Funktionen des Programms zur unbeschränkten Nutzung frei. Falls Sie mehrere Registrierungen bestellt haben, erhalten Sie mehrere Schlüsselcodes. Jedes Exemplar des Programms führt automatisch nach, welchen Schlüssel aus welcher Bestellung Sie verwendet haben, um es freizuschalten. Das Kapitel Registrierung und Freischalten des Programms im Referenzhandbuch des Programms enthält sehr detaillierte Hinweise zur Arbeit mit Registrierungsschlüsseln. Kann ich Ihre Software ohne Internet-Verbindung freischalten? Falls Sie in einer Umgebung sind, in der Internet nicht verfügbar oder nicht erlaubt ist, ist es eventuell trotzdem noch möglich, eine individuelle Lösung zu finden, aber dies ist eine Ausnahme. Dieses Kulanzangebot erfordert Zugriff auf ein anderes Macintosh-System mit Internet-Verbindung, auf dem macOS 10.12 oder höher läuft. Kontaktieren Sie uns mit Ihrer postalischen Anschrift für weitere Informationen. Kann ich unterschiedliche Adressen für Rechnung und Lieferung angeben? Ja, das ist problemlos möglich. Das Bestellformular von PayPro Global sieht diesen Fall vor. Sie können eine Bestellung im Auftrag einer anderen Person übermitteln, die den Registrierungsschlüssel per E-Mail erhalten wird. Klicken Sie auf der Bestellseite auf den Schalter An eine andere Person lizensieren, um diese Funktion zu aktivieren. Kann ich eine gelieferte Registrierungsdatei zurückgeben oder meinen Kauf widerrufen? Sie können die Software, also das eigentliche Produkt, vor Ihrer Bestellung intensiv testen. Wir müssen daher davon ausgehen, dass Ihre Bestellung wirklich verbindlich ist, wenn Sie sich zum Kauf einer permanenten Nutzungserlaubnis und der zugehörigen Registrierung entschlossen haben. Im allgemeinen ist ein Widerruf des Kaufvertrags nach Lieferung deshalb nicht möglich. In einigen Ländern gibt es jedoch ein gesetzlich garantiertes Widerrufsrecht für einen bestimmten Zeitraum. Bitte prüfen Sie die Rückgabebestimmungen von PayPro Global für genauere Informationen. Ihr Recht auf Wandlung bei Produktmängeln ist selbstverständlich nicht betroffen und bleibt immer unberührt. Wie kann ich zahlen? Verfügbare Zahlungsoptionen können vom Land, der ausgewählten Währung und dem Gerät abhängen, mit dem Sie die Bestellung aufgeben. Die meisten Kreditkarten und PayPal werden weltweit akzeptiert. Mehr als 70 Zahlungsmethoden können zur Verfügung stehen. Einige Methoden, wie Überweisung oder Bestellung auf Rechnung können zusätzliche Bearbeitungsgebühren verursachen. Die Bestellseite zeigt diese Details abhängig von der jeweiligen Situation an. Welche Währungen kann ich verwenden? PayPro Global akzeptiert Euro und US-Dollar als Hauptwährungen. Mehr als 130 zusätzliche Währungen sind ebenso verfügbar. Verwenden Sie das Aufklappmenü in der oberen rechten Ecke der Bestellseite, um die vollständige Liste zu erhalten. Werde ich eine gültige Rechnung erhalten? Ja. Eine rechtsgültige Rechnung wird als Webseite oder PDF-Dokument erzeugt, direkt nachdem Ihr Bestellvorgang abgeschlossen wurde. Sie können das Dokument herunterladen. Wie steht es mit der Mehrwertsteuer und anderen Verkaufssteuern? Nachdem Sie Ihre persönlichen Daten in das Bestellformular eingegeben haben, wird automatisch der richtige Steuersatz für Sie gemäß lokaler und internationaler Steuergesetzgebung berechnet. Privatkunden in Deutschland bezahlen 19 % Mehrwertsteuer. Kunden in andere Ländern bezahlen zusätzliche Steuern gemäß der jeweiligen nationalen Gesetze für den Verkauf digitaler Software-Lizenzen. Die Höhe ist in jedem Land unterschiedlich. Geschäftskunden in der Europäischen Union, die Ihre Umsatzsteueridentifikationsnummer angeben, brauchen keine zusätzlichen Steuern zu bezahlen. Klicken Sie den Schalter Geschäftskauf auf der Bestellseite, um diese Funktion zu aktivieren. Kann ich Lizenzen in allen Ländern kaufen? Leider nein. Aufgrund von Exportbeschränkungen ist die Belieferung in den folgenden Ländern, bzw. Regionen im Moment nicht möglich: Afghanistan Belarus Irak Iran Jemen Krim Kuba Myanmar Nordkorea Russland Somalia Sudan Südsudan Syrien Venezuela Diese Liste kann sich jederzeit ändern, abhängig von geltenden Exportbeschränkungen. Meine Online-Bestellung wurde unterbrochen, so dass ich deren aktuellen Status nicht kenne. Können Sie meine Bestellung nachverfolgen oder abbrechen? Wir bearbeiten Ihre Bestellung nicht, so dass wir Ihnen leider nicht weiterhelfen können. Falls Sie Ihre Daten einsehen oder den aktuellen Status einer Bestellung abrufen möchten, verwenden Sie bitte die Seite Bestellsuche von PayPro Global. Wer ist für die Verarbeitung der Bestellung und der Bezahlung verantwortlich? Die kanadische Firma PayPro Global ist der autorisierte E-Commerce-Händler für die Software-Lizenzen: PayPro Global Inc. 225 The East Mall, Suite 1117 Toronto, ON, M9B 0A9 CANADA'
