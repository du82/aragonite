ol System 9 (Global license for TinkerTool System 6 or 7 required) $ 329.00 / € 313.00 Order page Price indications are manufacturer's suggested retail prices excluding taxes. Delivery is free. For a binding offer in your national currency and including taxes, open the order page of the software retailer. Product activation via Internet is required. In high-security environments, offline activation without Internet may be allowed under certain circumstances. Your order is processed using secure, SSL-encrypted communication. If you like to get more details about the purchase process, delivery, pricing and your rights before placing an order, please see our detailed information page. Immediate Delivery. Simple Unlocking. As soon as the merchant PayPro Global has confirmed your payment, you will receive your registration data for unlocking the application in plain text on the web page. Additionally, you will receive a copy of the data via email for permanent archiving. More Information… Payment Options The payment options depend on the country you are in and the type of device you are using to place the order. The software reseller PayPro Global may accept up to 60 different types of payments, including all major credit cards and PayPal®. Payment options that require manual processing (like Bank Transfer) may be subject to an additional service fee."
