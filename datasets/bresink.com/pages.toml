fore data will be sent and a ticket will be requested. Demo Mode Without a valid registration (and after the free evaluation period has ended), the application will operate in demo mode only. A window with the note Running in Demo Mode appears each time the application is started. The window Running in Demo Mode also appears whenever you attempt to use a feature which is not included in the list at the right. This feature will be blocked, so it cannot be used. Unrestricted Usage If you like to use the software permanently, you'll have to place an order for the required number of usage licenses. For each license you will receive a so-called registration file containing a registration code which will allow you to switch the application from demo mode to normal operation. Distributing or leasing the application or its license to third parties is prohibited without prior written permission. In particular, you have no permission to transfer the registration to somebody else. The exact contractual obligations for licensing the software are shown and can be printed after you have opened the downloaded software package. Security Information To verify that the download package is authentic and has not been altered by a third party, you can verify its SHA-256 checksum. The SHA-256 checksum for the current version of the download file is 7376cecac60636b24d039cb335db6bb540927d033aa2bd8222bf3afdea3ba556."
