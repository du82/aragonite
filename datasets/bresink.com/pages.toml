["https://bresink.com/osx/PrefEdit.html"]
title = "PrefEdit: Description"
description = "Product description for PrefEdit"
full_description = "PrefEdit PrefEdit is an application to manage nearly all aspects of the preference system contained in every macOS installation. The program consists of two components which are tightly integrated with each other: - An entry point to the preferences database of macOS, with access to all settings which are effective for your user account, - a browser and editor for macOS property list files (plists). Property list files are the technical means used by macOS to store user preference settings in the background. This file type is also utilized by macOS for many other purposes, not only for building the preference database. You can use PrefEdit to display and edit all files compliant with Apple's plist standard. PrefEdit is directed both to software developers and to end users who like to have full access to each and every aspect of preference settings for the system and applications. The program is capable of visualizing the complete search path and priority of user default settings, exactly imitating the view each macOS application has on the preferences database. PrefEdit was the first preference editor ever published for Mac OS X. With its long experience and maturity, it has become one of the most advanced preference management applications for macOS available today. The software is distributed electronically. You can download the product and test it before you decide to purchase a license for unrestricted usage."
