full_description = "Backup Server Control Backup Server Control stellt eine grafische Oberfläche dazu bereit, einen Server zur netzbasierten Time Machine®-Datensicherung mit wenigen Mausklicks auf einem Macintosh® einzurichten und zu verwalten. Andere Macs, die macOS Sierra oder höher verwenden, können Datensicherungen auf dem Time Machine-Server durchführen. Der aktuelle Zustand der Netzwerk-Sicherungen kann jederzeit eingesehen werden. Ein Time Machine-Server auf einem Mac kann sehr leistungsfähig sein. Er ist einfach zu handhaben und bietet eine gute Skalierung. Durch Hinzufügen weiterer Festplatten kann der Dienst jederzeit weiter ausgebaut und an aktuelle Erfordernisse angepasst werden falls nötig, wenn mehr Daten oder mehr zu sichernde Computer hinzukommen. Hinweis: Backup Server Control konfiguriert einen Mac als Time Machine-Ziel. Es ist nicht dafür gedacht, andere Typen von Time Machine-Servern zu verwalten, wie z.B. File-Server von Drittanbietern, NAS-Geräte oder die Apple Time Capsule. Die Software wird elektronisch vertrieben. Sie können das Produkt herunterladen und testen, bevor Sie sich zum Erwerb einer uneingeschränkten Nutzungserlaubnis entscheiden."
