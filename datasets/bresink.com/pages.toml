["https://bresink.com/osx/SyncChecker.html"]
title = "Sync Checker: Description"
description = """
Product description for Sync  Checker"""
full_description = "Sync Checker Sync Checker is a diagnostic application which can check if two folders or disk volumes are perfectly synchronized, i.e. if they have exactly the same contents. When creating backup copies of valuable files, or when making sure that two computers or mobile devices work on the same set of data, the status of being “in perfect sync” can be very important. In order to be safe and to prevent loss of data, you can let Sync Checker verify whether a pair of file collections is matching exactly or not. In other situations, it might be interesting to find differences between file sets. For example, you might like to know which files have changed on your computer, comparing a Time Machine backup of last Friday with one of last Tuesday. After performing a sync check, Sync Checker will either confirm that all files are identical, or it will present all detected mismatches. You can browse through the differing items, analyzing exactly where a mismatch occurred, and if the differences are critical or negligible. It is also possible to create a textual report of the results which can be printed or exported. Advanced users can create ignore lists to exclude specific files from a sync check, or use archived file scans to perform offline checks. The software is distributed electronically. You can download the product and test it before you decide to purchase a license for unrestricted usage."
author = "Marcel Bresink"
year_published = 2025
clearnet = "https://bresink.com/osx/SyncChecker.html"
