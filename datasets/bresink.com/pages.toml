title = "Blog - Archived Entries - July 2018"
description = "Blog Marcel Bresink Software-Systeme - Archived Entries - July 2018"
full_description = "Blog - Archived Entries - July 2018 The latest entries are listed first. — See more latest news from the current blog. July 30, 2018: Apple releases new software via macOS Software Update: macOS High Sierra 10.3.6 (Consolidated full version for mini installers) (Update Product ID: 091-95774) Gatekeeper version 149 (Update Product ID: 091-96428) Gatekeeper updates malware definitions for all Macintosh operating systems as of OS X 10.8 Mountain Lion and higher. It is part of the built-in antivirus software of macOS. July 27, 2018: Apple has silently replaced the following update package via macOS Software Update by a modified version: macOS High Sierra 10.13.6 Supplemental Update for MacBook Pro (2018) (Update Product ID: 091-97101) The update fixes technical issues with the power control for processors used in the latest MacBook Pro models, especially for systems with Intel Core i9 CPUs. July 24, 2018: Apple releases new software via macOS Software Update: macOS High Sierra 10.13.6 Supplemental Update for MacBook Pro (2018) (Update Product ID: 091-97101) BridgeOS for systems with macOS 10.13.6 and T2 processor (Update Product ID: 091-97100) The update fixes technical issues with the power control for processors used in the latest MacBook Pro models. Updating the operating system of the Apple T2 management processor is additionally necessary to grant these computers permission to install the modified macOS version. July 24, 2018: Apple releases new software via macOS Software Update: macOS High Sierra 10.13.6 Supplemental Update for MacBook Pro (2018) (Update Product ID: 091-97101) BridgeOS for systems with macOS 10.13.6 and T2 processor (Update Product ID: 091-97100) The update fixes technical issues with the power control for processors used in the latest MacBook Pro models. Updating the operating system of the Apple T2 management processor is additionally necessary to grant these computers permission to install the modified macOS version. July 18, 2018: Apple releases new software via macOS Software Update: Safari Technology Preview version 61 (Update Product ID: 091-95262) iMac Pro Update for Boot Camp (Update Product ID: 091-85610) Safari Technology Preview allows users to get a sneak peek at upcoming web technologies in macOS and experiment with these technologies in websites and extensions. July 18, 2018: We are releasing System Monitor 2.4 through the Mac App Store. The following items have been updated: Added privacy information. This update fixes a rare issue which could occur in advanced network configurations: When an offline monitored secondary network interface was put back online, its statistics values may not always have been automatically re-added to the network menu, depending on how fast the operating system rebuilt the network connection. July 17, 2018: Apple releases new software via macOS Software Update: Mobile Device on Demand, version 1.0 (Update Product ID: 091-95662) This package contains the up-to-date set of icons, as well as communication drivers for the latest iPhone, iPad, iPod and Apple Watch models. It will silently be installed if necessary in OS X 10.11 and later versions of macOS. July 16, 2018: Apple releases new software via macOS Software Update: Gatekeeper version 148 (Update Product ID: 091-95159) This version updates malware definitions for all Macintosh operating systems as of OS X 10.8 Mountain Lion and higher. Gatekeeper is part of the built-in antivirus software of macOS. July 16, 2018: Apple has silently replaced the following update packages via macOS Software Update by modified versions: macOS High Sierra 10.13.6 (Update Product IDs: 091-94329, 091-94330) Security Update 2018-004 for OS X El Capitan (Update Product ID: 091-63422) Security Update 2018-004 for macOS Sierra (Update Product ID: 091-65273) BridgeOS for systems with macOS 10.13.6 and Touch Bar processor (Update Product ID: 091-94323) July 12, 2018: Apple has silently replaced the following update package via macOS Software Update: BootCamp ESD Update (Update Product ID: 091-16471) BootCamp ESD is an Electronic Software Distribution package that provides drivers for running Microsoft Windows on Macintosh computers. July 11, 2018: Apple releases new software via macOS Software Update: macOS High Sierra 10.3.6, full version for mini installers (Update Product ID: 091-94326) The full version provides all install packages that are needed by customers who received a mini installer App in the Mac App Store. July 10, 2018: Apple releases new software via macOS Software Update: iTunes version 12.8 (Update Product ID: zzzz091-95478) iTunes now supports AirPlay 2 multi-room audio and HomePod stereo pairs. Use the AirPlay menu to easily group HomePod, Apple TV, and other AirPlay 2-enabled speakers and control what plays next. July 9, 2018: Apple releases new software via macOS Software Update: macOS High Sierra 10.13.6 (Update Product IDs: 091-94329, 091-94330) BootCamp ESD Update (Update Product ID: 091-16471) Safari 11.1.2 for macOS Sierra (Update Product ID: 091-83945) Safari 11.1.2 for OS X El Capitan (Update Product ID: 091-84014) Security Update 2018-004 for OS X El Capitan (Update Product ID: 091-63422) Security Update 2018-004 for macOS Sierra (Update Product ID: 091-65273) Gatekeeper version 147 (Update Product ID: 091-94269) BridgeOS for systems with macOS 10.13.6 and Touch Bar processor (Update Product ID: 091-94323) July 5, 2018: Apple releases new software via macOS Software Update: Apple SafeView Version 6.7.1 (Update Product ID: 091-87528) SafeView is an internal utility that macOS customers can use to share their screens via Internet with service representatives from Apple or AppleCare. It allows remote access for support purposes. This software is not available to the general public. July 3, 2018: Apple releases new software via macOS Software Update: Safari Technology Preview version 60 (Update Product ID: 091-93968) Whitelist for Macintosh firmware security checks (“EFICheck AllowList”), version 28 (Update Product ID: 091-88836) Gatekeeper version 146 (Update Product ID: 091-94218) These updates include malware definitions for all Macintosh operating systems as of OS X 10.8 Mountain Lion and higher. Gatekeeper is part of the built-in antivirus software of macOS. Safari Technology Preview allows users to get a sneak peek at upcoming web technologies in macOS and experiment with these technologies in websites and extensions. July 2, 2018: We are releasing NFS Manager version 4.5. The following items have been updated: Added preliminary support for future versions of macOS. Support for OS X El Capitan has been removed. The buffer size and read-ahead parameters for NFS client communication now offer larger sizes, reflecting operating system development in the last years. Several images have been added to the documentation. Fixed a problem where the application always indicated an operating system issue after all NFS share entries have been removed. Because Apple does not fix several critical defects and design flaws in the macOS user interface for the authorization of privileged operations, NFS Manager switches to a redesigned security architecture. Older entries…"
