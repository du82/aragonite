["https://bresink.com/osx/NFSManager-de.html"]
title = "NFS Manager: Beschreibung"
description = """
Produktbeschreibung für NFS  Manager"""
full_description = "NFS Manager NFS Manager ist ein Programm, um die NFS-Funktionen, die in macOS eingebaut sind, über eine komfortable grafische Oberfläche zu steuern. Das Programm verwendet dabei Apples Technologien wie Bonjour oder Open Directory, um das Management so einfach und bequem wie möglich zu machen. Bei Verwendung von Verzeichnisdiensten kann NFS Manager nicht nur einen einzelnen Computer, sondern ein ganzes Netzwerk mit tausenden von Macintosh-Systemen mit wenigen Mausklicks zur Verwendung von NFS konfigurieren. NFS ist der in Unix-Systemen übliche Industriestandard, um Dateien im Netzwerk zur gemeinsamen Nutzung freizugeben („Sharing“). NFS bedeutet Network File System und wurde von der Firma SUN Microsystems (heute: ORACLE) entwickelt. Jedes macOS-System kann entweder als NFS-Server konfiguriert werden, um Daten im Netz anzubieten, oder als NFS-Klient arbeiten, um auf freigegebene Daten anderer Computer zuzugreifen. Selbstverständlich können auch beide Funktionen gleichzeitig auf einem Mac genutzt werden. Die Software wird elektronisch vertrieben. Sie können das Produkt herunterladen und testen, bevor Sie sich zum Erwerb einer uneingeschränkten Nutzungserlaubnis entscheiden."
