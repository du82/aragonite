["https://bresink.com/osx/300268194/details.html"]
title = "PrefEdit: Details"
description = "Product details for PrefEdit"
full_description = "PrefEdit Features Browse through the complete list of macOS preference domains, including the preference settings of programs protected by an application sandbox. You can search for any setting in the database, either by value or by internal name of the preference. PrefEdit can automatically determine the correct preference domain name for a given application. Targeted access to private preference suites, such as Powerbox settings or shared application group preferences is also possible. You can change any entry in the preferences database or in a property list file. Property names, entry types and values can be edited freely. Entries can be removed or added. The program handles nested entries of any depth correctly. Entries can be moved or copied within the same or different files, using copy/paste or drag-and-drop. The application has full undo and redo capabilities with an unlimited number of steps. The “Versions” feature of macOS can be used to restore old versions of a file you have edited with PrefEdit. It is shown if certain settings are controlled by the client management (MCX) system of macOS which is used via directory services or Apple Profile Manager in professional networks. Preference domain inspectors allow to view the exact relationship between entries in the live preferences database and their counterparts in the persistent preference files. The preference search path used by each compliant macOS application can be visualized, showing the effects of overriding settings and reflecting the view on the settings as each application sees them. You can copy an effective setting in the preference search path to a different scope, allowing to easily override a default value at a later search position. PrefEdit detects automatically when applications change preference values at the same time the user is editing settings via PrefEdit. Applications can be launched via PrefEdit, so the effects of changing a user default setting can be verified immediately. It is possible to search for any entry in a property list file, either by value or property key of the entry. PrefEdit can open and write XML-based, as well as binary property list files. Users can freely convert data between the two formats. It is additionally possible to read property list files in OpenStep format, used in macOS's predecessor NeXT OPENSTEP for Mach. When using XML-based files, PrefEdit keeps track of the physical order of entries, differentiating between the shown and actual order. Entries can be sorted after both aspects."
author = "Marcel Bresink"
year_published = 2025
