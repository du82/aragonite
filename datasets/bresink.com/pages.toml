cation package has been updated to meet the latest software design guidelines. Support for Mac OS X Jaguar (10.2) has been removed. The reference manual has been redesigned. Release 1.2 (Build 060628) By user request, the application now remembers the last load value and the number of processors to load the next time it is started. Release 1.1 (Build 060223) The application is released as a Universal Binary. The reference manual has been revised. Release 1.0 (Build 041024) First official version of SystemLoad."
