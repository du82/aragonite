description = """
Bresink-Software Web-Site:  Datenschutzerklärung"""
full_description = 'Datenschutzerklärung Wie wir Ihre Privatsphäre respektieren und schützen Der Schutz Ihrer personenbezogenen Daten ist uns ein wichtiges Anliegen. Wir behandeln Ihre personenbezogenen Daten vertraulich und entsprechend der gesetzlichen Vorschriften sowie dieser Datenschutzerklärung. Der folgende Text beschreibt in leicht verständlicher Weise, was bei einzelnen Geschäftsvorgängen und beim Nutzen dieses Internet-Auftritts mit Ihren Daten passiert und warum wir die Daten erheben. Wir informieren Sie außerdem über Ihre Rechte nach geltendem Datenschutzrecht. Wer sind wir? Verantwortlich für die Verarbeitung der Daten ist: Dr. Marcel Bresink Software-Systeme Ringstr. 21 56630 Kretz GERMANY E-Mail: osxinfo@bresink.com Bei welchen Vorgängen verarbeiten wir Ihre Daten? Besuch dieses Internet-Auftritts Senden von Daten über ein Formular dieses Internet-Auftritts Kauf einer Software-Lizenz über den Händler PayPro Global Kauf einer Software-Lizenz über Apples App Store Kauf von Ware oder Dienstleistungen bei uns Freischaltung einer Software-Lizenz, die bei PayPro Global erworben wurde Freischaltung einer Software zum Testbetrieb Durch Anklicken der obigen Punkte können Sie sofort zu dem Vorgang springen, für den Sie sich interessieren. Wer bekommt die Daten? Wir geben Ihre personenbezogenen Daten niemals an Dritte weiter, außer in den folgenden Fällen: Es besteht eine gesetzliche Verpflichtung, Ihre personenbezogenen Daten weiterzuleiten, beispielsweise wenn uns eine Strafverfolgungs- oder Rechtsprechungsbehörde wie Gerichte, Staatsanwaltschaften oder Polizei dazu zwingt. Ein technischer Dienstleister, der ausdrücklich in unserem Auftrag handelt, unterstützt uns bei der Verarbeitung der Daten, beispielsweise wenn wir Daten auf einem Web-Server eines externen Anbieters speichern, um einen zuverlässigen, weltweit gut erreichbaren Internet-Auftritt möglich zu machen. Hierbei verwenden wir nur solche Dienstleister, die vertraglich verpflichtet sind, den Schutz Ihrer Daten nach den Vorgaben dieser Erklärung sicherzustellen. Werden personenbezogene Daten bei einer solchen Weitergabe über das Internet übertragen, so werden diese verschlüsselt, so dass Unbefugte keinen direkten Zugriff auf die Daten erlangen können. Welche Rechte haben Sie bezüglich der Verarbeitung dieser Daten? Sie können von uns Auskunft darüber verlangen, welche personenbezogenen Daten wir über Sie verarbeiten. Sie haben das Recht, diese Daten in einem gängigen Computerformat zu erhalten. Sollten die Daten nicht (mehr) zutreffend oder nicht vollständig sein, können Sie verlangen, dass die Daten berichtigt oder ergänzt werden. Wenn die Daten für die oben genannten Zwecke nicht mehr benötigt werden oder wenn Sie der Verarbeitung widersprechen und es keine schutzwürdigen Gründe für die Verarbeitung mehr gibt, können Sie die unverzügliche Löschung Ihrer personenbezogenen Daten verlangen. Dies gilt auch, wenn sich herausstellt, dass die Daten unrechtmäßig verarbeitet wurden oder wegen anderer gesetzlicher Anforderungen nicht mehr verarbeitet werden dürfen. Bei Auskünften, Anfragen oder Widersprüchen wenden Sie sich an den anfangs genannten Ansprechpartner. Darüber hinaus haben Sie das Recht, sich bei einer zuständigen Aufsichtsbehörde der Europäischen Union (in Deutschland beispielsweise beim Landesdatenschutzbeauftragten Ihres Bundeslands) über die Verarbeitung Ihrer Daten zu beschweren. Federführende Aufsichtsbehörde für unseren Standort ist: Der Landesbeauftragte für den Datenschutz und die Informationsfreiheit Rheinland-Pfalz Hintere Bleiche 34 55116 Mainz GERMANY Telefon: +49 (0) 6131 208-2449 Telefax: +49 (0) 6131 208-2497 E-Mail: poststelle@datenschutz.rlp.de Schutz von Kindern Die nachfolgend aufgeführten Vorgänge und Dienste richten sich nicht direkt an Kinder. Werden diese Dienste dennoch von Kindern genutzt, gehen wir davon aus, dass eine Zustimmung der Erziehungsberechtigten vorliegt, bzw. dass das Kind das im jeweiligen Land gültige Mindestalter für das Abschließen rechtlich bindender Verträge bezüglich des jeweiligen Dienstes bereits erreicht hat. Wenn Sie vermuten, dass wir Daten über eine Person erhalten haben, die unter Kinderschutzgesetze fällt, benachrichtigen Sie uns bitte unverzüglich, so dass wir angemessene Schritte einleiten können, diese Daten sicher zu löschen. Besuch dieses Internet-Auftritts Welche Daten werden verarbeitet? Die Nutzung unserer Webseiten ist in der Regel ohne Angabe personenbezogener Daten möglich. Soweit auf unseren Seiten personenbezogene Daten (beispielsweise Ihr Name) erhoben werden, erfolgt dies, soweit möglich, stets auf freiwilliger Basis. Wir vermeiden die Verwendung von Cookies. Cookies sind kleine Textdateien, die auf Ihrem Rechner abgelegt werden und die Ihr Web-Browser speichert. Nur in Einzelfällen verwenden wir Cookies aus technischen Gründen, wenn es wichtig ist, zu erkennen, dass Sie mehrere unserer Webseiten in einem gemeinsamen Zusammenhang nutzen, beispielsweise wenn Sie ein Produkt auf Webseite A und ein Produkt auf Webseite B in einem einzelnen Auftrag bestellen möchten. Diese Cookies werden nicht dazu verwendet, Sie als Person zu identifizieren oder Ihre Nutzung unseres Internet-Auftritts längerfristig nachzuverfolgen. Wenn Sie eine Seite unseres Internet-Auftritts abrufen, können folgende Daten erfasst werden: Typ und Version Ihres Web-Browsers Typ und Version Ihres Betriebssystems die Internet-Adresse der abgerufenen Seite die Internet-Adresse der Seite, die auf die abgerufene Webseite verwiesen hat Datum und Uhrzeit des Seitenabrufs technische Informationen, ob das Abrufen der Seite störungsfrei war Zur Präsentation einer Webseite können manchmal folgende Daten Ihres Web-Browsers abgefragt werden: die von Ihnen bevorzugte Sprache das von Ihnen genutzte Wiedergabemedium, z.B. ein Computerbildschirm einer bestimmten Größe Die vorgenannten beim Seitenabruf erfassten Daten sind nicht personenbezogen. Der Internet-Auftritt kann aus Gründen der Sicherheit und zum Schutz der Übertragung vertraulicher Inhalte, wie zum Beispiel der Anfragen, die Sie an uns senden, auf Wunsch eine SSL-Verschlüsselung nutzen. Eine verschlüsselte Verbindung erkennen Sie an einem Schlosssymbol in der Adresszeile des Web-Browsers. Wenn die SSL Verschlüsselung aktiviert ist, können die Daten, die Sie an uns übermitteln, nicht von Dritten mitgelesen werden. Warum verarbeiten wir diese Daten und aufgrund welcher Gesetze? Wie lange bleiben die Daten gespeichert? Cookies werden in Einzelfällen dazu verwendet, zu erkennen, dass Abrufe unterschiedlicher Webseiten unseres Internet-Auftritts zusammengehören. In diesen Fällen weisen wir Ihren Web-Browser an, die Cookies nach spätestens 24 Stunden zu löschen. Protokolle über das Abrufen von Seiten werden dazu benötigt, um den technisch einwandfreien Betrieb des Internet-Auftritts sicherzustellen. Diese Daten werden nach spätestens 178 Tagen gelöscht. Daten zur Präsentation von Webseiten werden nur für das Ausliefern der jeweiligen Seite verarbeitet, aber nicht weiter gespeichert. Da die Daten nur verarbeitet werden, wenn dies aus technischen Gründen notwendig ist, und wir Sie über die Verwendung dieser Daten informieren, ist die Verarbeitung gemäß Datenschutz-Grundverordnung der Europäischen Union rechtmäßig. Senden von Daten über ein Formular dieses Internet-Auftritts Welche Daten werden verarbeitet? Wenn Sie uns Daten über ein Formular dieses Internet-Auftritts zusenden, werden alle Daten, die Sie in das Formular eingegeben haben, von uns verarbeitet. Sie können ein Formular daran erkennen, dass es Eingabefelder hat und sich ein Knopf „Absenden“ unterhalb der Eingabefelder befindet. In der Regel ist die Angabe aller Daten freiwillig. Nur wenn der Sinn eines Formulars darin besteht, eine Anforderung an uns zu senden, für deren Bearbeitung bestimmte Datenfelder notwendig sind, ist das Ausfüllen dieser Felder zwingend erforderlich. Wenn Sie uns beispielsweise eine Frage zusenden, benötigen wir eine Adresse, um Ihnen einen Antwort zurücksenden zu können. Die als notwendig betrachteten Felder sind entsprechend gekennzeichnet. Wir weisen darauf hin, dass wir Daten von Kindern nur in dem Fall verarbeiten, wenn uns über ein Formular Daten über ein Kind zugesandt werden. Bei der Übertragung über das Internet werden die von Ihnen abgesendeten Daten grundsätzlich verschlüsselt, so dass diese nicht von Dritten mitgelesen werden können. Warum verarbeiten wir diese Daten und aufgrund welcher Gesetze? Wie lange bleiben die Daten gespeichert? Das Absenden von Daten über ein Formular an uns geschieht nur auf Ihre eigene Veranlassung in Ihrem eigenen Interesse hin und ist üblicherweise mit einer Anforderung oder Frage an uns verknüpft. Wenn Sie aufgefordert werden, Ihren Namen anzugeben, wird der Name dazu genutzt, Ihnen höflich zu antworten und zu prüfen, ob sich Ihre Anforderung auf einen bestehenden Vertrag mit Ihnen bezieht. Wenn Sie aufgefordert werden, Ihre postalische Anschrift oder Ihre E-Mail-Adresse anzugeben, werden diese Daten dazu genutzt, auf Ihre Anforderung zu antworten. Weitere personenbezogene Daten werden nur verarbeitet, wenn dies zur Erfüllung der von Ihnen abgesendeten Anforderung im Sinne des Formulars erforderlich ist. Da die Daten nur verarbeitet werden, wenn Sie diese selbst an uns liefern, wenn dies nötig ist, wir Sie über die Verwendung dieser Daten informieren und Sie dieser Verwendung vorher zustimmen müssen, ist die Verarbeitung gemäß Datenschutz-Grundverordnung der Europäischen Union rechtmäßig. Die Daten werden für unbestimmte Zeit gespeichert. Kauf einer Software-Lizenz über den Händler PayPro Global Welche Daten werden verarbeitet? Wenn Sie eine Lizenz zur Nutzung eines unserer Software-Produkte beim Händler PayPro Global erwerben, werden alle Daten, die Sie dem Händler bei dieser Bestellung zur Verfügung stellen, an uns weitergeleitet und von uns verarbeitet. Dies kann Basisinformationen über Ihre Zahlung enthalten, z.B. welchen Typ von Kreditkarte Sie gewählt haben und welches Risiko mit dieser Zahlung verbunden ist. Dies enthält jedoch keine sicherheitskritischen Daten über Ihre Zahlung, wie zum Beispiel vollständige Kreditkarten- oder Kontonummern. Welche Daten der Händler erfasst und wie er diese verarbeitet, liegt im Ermessen des Händlers und wird durch dessen eigene Datenschutzerklärung geregelt. Dies gilt auch für die Verwendung von Cookies. Unser Internet-Auftritt und der Internet-Auftritt des Händlers werden durch optische Maßnahmen und ausdrückliche Hinweise voneinander getrennt, so dass Sie den Bereich der Gültigkeit der jeweiligen Datenschutzmaßnahmen erkennen können. Warum verarbeiten wir diese Daten und aufgrund welcher Gesetze? Wie lange bleiben die Daten gespeichert? Ihr Name und Daten über die von Ihnen gekauften Produkte werden erfasst, um eine personalisierte Lizenz („Registrierung“) ausstellen und einen gültigen Nutzungsvertrag abschließen zu können. Der Name wird außerdem verwendet, um Sie als Kunde zu identifizieren, zum Beispiel wenn eine verlorengegangene Registrierung wiederbeschafft werden soll. Dies geschieht in Ihrem Interesse. Die Auftragsnummer von PayPro Global wird erfasst, um Ihre Bestellung bei späterem Klärungsbedarf eindeutig zuordnen zu können. Dies ist unter anderem aus Gründen der ordnungsgemäßen Buchführung erforderlich. Ihre Anschrift, insbesondere das Land des Verwendungsorts, wird erfasst, weil dies aus gesetzlichen Gründen erforderlich ist, zur Kontrolle der korrekten Berechnung von Mehrwertsteuern, Verkaufssteuern oder ähnlicher Steuern, zur Überprüfung der Einhaltung von Bestimmungen zur Ausfuhr von Hochtechnologie. Bei Geschäftskunden aus der Europäischen Union wird darüberhinaus die Europäische Umsatzsteueridentifikationsnummer erfasst, um die Rechtmäßigkeit einer umsatzsteuerfreien Belieferung (Steuerschuldnerschaft des Leistungsempfängers) prüfen zu können. Ihre E-Mail-Adresse wird erfasst, um Ihnen eine zusätzliche Sicherheitskopie der Lizenzdaten zuschicken zu können. Dies geschieht in Ihrem Interesse, falls das Herunterladen der Lizenzdaten aus technischen Gründen fehlschlägt. Weitere Kontaktdaten, wie Telefon- oder Faxnummern, können freiwillig von Ihnen angegeben werden, um Ihnen die Lizenzdaten zustellen zu können, auch wenn Sie durch eigene Fehler eine ungültige E-Mail-Adresse zur Lieferung angegeben haben. Dies geschieht in Ihrem Interesse. Für andere Zwecke werden wir die Telekommunikationsdaten nicht verwenden. Die von Ihnen bevorzugte Spracheinstellung wird verarbeitet, um Ihnen die Daten in einer für Sie verständlichen Sprache übermitteln zu können. Der von Ihnen gewählte Typ des Zahlungsmittels wird erfasst, um beurteilen zu können, ob wir PayPro Global von unserer Seite aus zu einer eventuellen Rückerstattung des Kaufpreises veranlassen können, beispielsweise aus Kulanz bei einer irrtümlichen Bestellung. Wir weisen darauf hin, dass wir Daten von Kindern nur in dem Fall verarbeiten, wenn eine Software-Lizenz von oder für ein Kind gekauft wird. Ohne Angabe des gewünschten Namens für den Lizenzinhaber und das Land des Verwendungsortes kann kein Nutzungsvertrag abgeschlossen werden und wir können keine Registrierung zur Freischaltung der Software ausliefern. Diese Daten sind zur Erfüllung des Kaufvertrags erforderlich. Bezüglich der weiteren in diesem Abschnitt genannten, nicht freiwillig erhobenen Daten sind wir gemäß Abgabenordnung, Handelsgesetzbuch, Umsatzsteuergesetz, und den „Grundsätzen zur ordnungsmäßigen Führung und Aufbewahrung von Büchern, Aufzeichnungen und Unterlagen in elektronischer Form sowie Datenzugriff“, in bestimmten Fällen auch gemäß Außenwirtschaftsverordnung zur Verarbeitung gesetzlich verpflichtet. Die Speicherung erfolgt so lange, wie der Nutzungsvertrag läuft. Aus gesetzlichen Gründen müssen die Daten der Abrechnung für mindestens 10 Jahre, andere Daten über den Geschäftsvorfall mindestens 6 Jahre gespeichert bleiben. Kauf einer Software-Lizenz über Apples App Store Wenn Sie eine Lizenz zur Nutzung eines unserer Software-Produkte beim Händler Apple Inc., bzw. eines seiner Tochterunternehmen mithilfe des Internet-Auftritts „App Store" erwerben, wird hierbei von uns nur die Tatsache verarbeitet, dass das jeweilige Software-Produkt in ein bestimmtes Land geliefert worden ist. Weitere Daten werden von uns nicht verarbeitet. Kauf von Ware oder Dienstleistungen bei uns Welche Daten werden verarbeitet? Wenn Sie eine Ware oder Dienstleistung direkt bei uns kaufen, werden Daten hierbei nur erfasst, sofern dies zur Erfüllung des Kaufvertrags oder zum Ausstellen einer gültigen Rechnung nötig ist. Ist es notwendig, die Ware per Versand auszuliefern oder eine Dienstleistung an Ihrem Ort zu erbringen, wird Ihr Name und Ihre Anschrift verarbeitet. Ist es notwendig, mit Ihnen Kontakt aufzunehmen, können weitere Kontaktdaten, wie beispielsweise Telefonnummer und E-Mail-Adresse verarbeitet werden. Wird es notwendig, Ihnen eine Zahlung zurückzuerstatten, werden wir die hierfür notwendigen Zahlungsdaten,'
