full_description = "Software for Vintage and Obsolete Computers If you are using an old operating system or computer which is no longer supported by Apple, you might still find software products for your Mac here. In some cases, we even develop new or updated software products targeted to old systems. Please use the following, alphabetically sorted list of applications to find the software product you may be looking for. Note that these applications must not be used on up-to-date versions of macOS. Those operating systems were unknown at the time the software was developed, so technical conflicts could arise that might result in data loss. Most programs have an internal safety feature which prevents you from using them with incompatible operating systems. Operating systems prior to macOS 10.12 can no longer support the current safety standards for Internet communication. Apple does not provide the necessary security certificates and TLS versions, so these historic OS versions cannot contact our license servers any longer. This means, applications which require Internet-based activation are no longer supported by Mac OS X or OS X and it would not make sense to still offer them here. Application Version Release Date For the Operating Systems Download Backup Server Control 2.54 November 27, 2024 macOS 10.13 macOS 10.14 macOS 10.15 7.7 MB Bresink Software Updater 1.3 November 12, 2020 macOS 10.12 macOS 10.13 3.5 MB Bresink Software Updater 1.71 February 21, 2023 macOS 10.14 macOS 10.15 2.4 MB Hardware Monitor (Community Edition) 5.6 July 19, 2021 OS X 10.10 OS X 10.11 macOS 10.12, only on supported Macs 7.4 MB Hardware Monitor Remote (Community Edition) 5.6 July 19, 2021 OS X 10.10 OS X 10.11 macOS 10.12, only on supported Macs 2.1 MB Mac Power Monitor 1.11 January 6, 2025 macOS 11 macOS 12 6.3 MB NFS Manager 4.92 November 27, 2024 macOS 10.12 macOS 10.13 macOS 10.14 macOS 10.15 10.5 MB PrefEdit 1.2 February 27, 2006 Mac OS X 10.2 Mac OS X 10.3 Mac OS X 10.4 296 KB Pref