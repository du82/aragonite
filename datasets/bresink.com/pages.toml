["https://bresink.com/osx/NFSManager.html"]
title = "NFS Manager: Description"
description = """
Product description for NFS  Manager"""
full_description = "NFS Manager NFS Manager is an application to control the NFS features built into macOS via a comfortable graphical user interface. The application uses Apple’s technologies like Bonjour or Open Directory to make management as easy as possible. When using directory services, NFS Manager can configure NFS features not only for a single computer but for a whole network of thousands of Macintosh systems, with a few mouse clicks only. NFS is an industry standard typically used on Unix systems designed to share files in a network for common usage. NFS means Network File System and was developed by SUN Microsystems (today: ORACLE). Every macOS system can either be configured as an NFS server to offer files to the network, or as an NFS client to access shared files offered by other computers. Of course you can use both functions simultaneously on a single Mac. The software is distributed electronically. You can download the product and test it before you decide to purchase a license for unrestricted usage."
