["https://bresink.com/Blog/2018/blog-2018-06.html"]
title = "Blog - Archived Entries - June 2018"
description = "Blog Marcel Bresink Software-Systeme - Archived Entries - June 2018"
full_description = "Blog - Archived Entries - June 2018 The latest entries are listed first. — See more latest news from the current blog. June 27, 2018: Apple releases new software via macOS Software Update: Gatekeeper version 144 (Update Product ID: 091-92948) This version updates malware definitions for all Macintosh operating systems as of OS X 10.8 Mountain Lion and higher. Gatekeeper is part of the built-in antivirus software of macOS. June 26, 2018: We are releasing TinkerTool System Release 2 version 3.7 as final release of the sofware. After exactly nine years, development was discontinued and new licenses will no longer be available. The software has been superseded by the successor products TinkerTool System 4 (for OS X) and TinkerTool System 5 (for macOS): Sales information within version 3.7 has been modified accordingly. Version 3.7 can be used on Macintosh systems with 64-bit processors running Mac OS X Snow Leopard, Mac OS X Lion, OS X Mountain Lion, and OS X Mavericks. Version 3.32 for 32-bit processors and version 2.7 for Mac OS X Leopard are also still available for download. June 22, 2018: We are releasing Backup Server Control version 1.3. The following items have been updated: Added preliminary support for future versions of macOS. This release enhances compatibility with specific operating system versions that may have problems to automatically find the network destination if the share name for Time Machine contains spaces. Backup Server Control provides a graphical user interface to setup and administer a Macintosh® server for network-based Time Machine® backups. June 21, 2018: We are releasing TinkerTool version 6.4. The following items have been updated: The option to suppress the Time Machine dialog when attaching empty disks has been reinstated. It had been previously removed for OS X Mavericks due to changes in the operating system. The option to add spacers between Dock tiles is now supporting the entire Dock, not only the applications section. Added preliminary support for future versions of macOS. June 20, 2018: Apple releases new software via macOS Software Update: Safari Technology Preview version 59 for macOS High Sierra (Update Product ID: 091-91595) Safari Technology Preview allows users to get a sneak peek at upcoming web technologies in macOS and experiment with these technologies in websites and extensions. June 19, 2018: Apple releases new software via macOS Software Update: Gatekeeper version 142 (Update Product ID: 091-87358) Apple Malware Removal Tool version 1.35 (Update Product ID: 091-89184) Gatekeeper and MRT are parts of the built-in antivirus software of macOS. June 18, 2018: We are releasing TinkerTool System 5 version 5.94. The following items have been updated: Added new feature to perform security checks on all executable bundles, not only on applications and software disk images. Added new security analysis indicator that confirms whether executable software has a trusted code signature, in addition to the existing indicator confirming that an application was not modified after the last time it was sealed. The updated security analysis also corrects possible misunderstandings of check results that arise from the handling of ad-hoc signatures and contradicting signatures within executable files containing code for multiple CPU architectures. (macOS third-party code signing vulnerability caused by poor Apple documentation, found by Josh Pitts, Okta, Inc.) The startup job database was updated for inconsistencies introduced by macOS 10.13.4 and later. The application was unlocked to launch compatible panes on beta versions of future operating systems. June 14, 2018: Apple releases new software via macOS Software Update: Whitelist for Macintosh firmware security checks (“EFICheck AllowList”), version 25 (Update Product ID: 091-84146) AppleConnect (for Macintosh), version 2.9.9.7 (Update Product ID: 091-86167) AppleConnect is a single-sign-on software that allows Apple employees to authenticate with Apple's internal directory service, unlocking access to the Apple network and diagnostic software. June 13, 2018: Apple releases a security update for the Command Line Tools, also correcting errors caused by previously feeding the official macOS Software Update channel with beta software: Command Line Tools for Xcode on macOS 10.13 (Update Product ID: 091-87532) Xcode version 9.4.1 may be required to trigger this update. June 8, 2018: We have updated the connection between our web site and the software license shop of MyCommerce Digital River. With their new Responsive Storefront technology, the new order pages offer better design for mobile devices, providing full shopping cart features for new and returning customers. The updated store will give you a fast, easy and safe purchase experience. June 6, 2018: Apple releases new software via macOS Software Update: Safari Technology Preview version 58 for macOS High Sierra (Update Product ID: 091-87398) Safari Technology Preview allows users to get a sneak peek at upcoming web technologies in macOS and experiment with these technologies in websites and extensions. June 4, 2018: Apple announces the name of the future operating system version 10.14 to be macOS Mojave. The upcoming system is expected to be released in fall 2018. Apple mistakenly released beta software via the standard macOS Software Update feed: Command Line Tools ”Beta 1” for Xcode on macOS 10.13 (Update Product ID: 091-65367) This error was corrected within 24 hours by delisting this update package. June 1, 2018: Apple releases new software via macOS Software Update: Security Update 2018-003 for OS X 10.11.6 (Update Product ID: 091-86642) Security Update 2018-003 for macOS 10.12.6 (Update Product ID: 091-58221) Safari 11.1.1 for OS X 10.11.6 (Update Product ID: 091-77731) Safari 11.1.1 for macOS 10.12.6 (Update Product ID: 091-75784) BridgeOS for systems with macOS 10.13.5 and Touch Bar processor (Update Product ID: 091-86776) macOS High Sierra Installer 10.13.5 for El Capitan and Sierra (Update Product ID: 091-86775) macOS High Sierra 10.13.5 Update (Update Product IDs: 091-86781 / 091-86782) Gatekeeper Configuration Version 140 (Update Product ID: 091-86646) June 1, 2018: We did not approve the new Data Protection statement (”Data Policy“) of FaceBook, because we considered several of its terms unlawful under European and German jurisdictions. For this reason, FaceBook deleted our fan page on June 1, 2018. The blog you are reading now will serve as replacement in the future. So, welcome to our new blog! Keep a bookmark for this page to receive up-to-date information about the latest developments from us and news about the macOS platform."
