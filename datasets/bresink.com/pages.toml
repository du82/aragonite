["https://bresink.com/osx/0BatteryMonitor/history.html"]
title = "Battery Monitor: What's new?"
description = """
Product history for Battery  Monitor"""
full_description = "What's new? Battery Monitor Version History Release 5.3 (Build 241202) The window for monitoring batteries of connected Bluetooth devices now shows a USB indicator when an Apple input device is disconnected from Bluetooth but charged via USB on the same computer. The notification feature to show a warning when an AC adaptor is connected for a long time has been removed. With new systems that support optimized charging, enforced PowerNap, and third-party applications with a smart “charge inhibit” feature, it can no longer be estimated reliably whether prolonged charging in an operating computer would actually harm the battery, so the warning no longer makes sense. Added new feature to avoid a technical defect of specific versions of macOS where a monitored battery of a connected Bluetooth device from Apple can be shown with changing representations for the device’s serial number, sometimes being replaced by a Bluetooth address. Battery Monitor will try to show the correct data as soon as it could learn the relationship between address and number for the affected device. Fixed a problem where adding or removing specific Apple Bluetooth input devices could not be tracked live. A restart of the app may have been needed to update the Bluetooth window for the affected devices. Release 5.2 (Build 240709) This version suppresses unnecessary checks performed by the App Store that could occur when starting the App, including the associated windows and possible delays. This could have affected users who restart their login sessions unusually often or switch between multiple operating systems on a single computer. Release 5.1 (Build 240702) The main overview window of the application can now be resized. Added necessary changes to ensure that the App remains compatible with future versions of the Mac App Store. Legacy code has been removed. The minimum operating system version is now macOS 13. Release 5.0 (Build 230626) Added new feature to show the connection type of attached AC adapters. This is supported on operating system versions and Macintosh models that are capable of reading out the technical specifications of the power supply. Added new option to show values in the Dock tile in enlarged fashion. The layout of history windows has been optimized. When resizing a window, the labels for the y-axis keep their widths which leaves more space for the graphs. Users who enabled history windows in standard mode and enforced the use of tabs for document windows in macOS could create compatibility issues with specific features. To avoid this, Battery Monitor now automatically opts out of using tabs. Fixed a problem where the voltage of an attached AC adapter could not be shown in some versions of macOS. Legacy code has been removed. The minimum operating system version is now macOS 11. Release 4.9 (Build 230227) Application and reference manual have been updated to correctly differentiate between System Settings of macOS Ventura and System Preferences in older versions of macOS. Fixed a problem where opening System Settings via the context menu of the menu-bar icon did not work as expected in macOS Ventura. A cryptographic security feature was removed to ensure the App can still be imported to France. Release 4.8 (Build 220905) In addition to the Touch Bar controls, the battery capacity log can now also opened directly in graph mode via the main menu, context menu, or via keyboard shortcuts. The wording of the “last full charge cycle” indicator in the long-term overview window was modified to avoid misunderstandings. The code base was modernized to prepare for future operating system versions. Release 4.7 (Build 220706) Added new feature to visualize the differences between state of charge percentage of the battery cells and battery percentage shown by the operating system. This feature is available on operating systems and Macintosh models that make this distinction. Added new information sheet to explain possible differences between maximum capacity shown by Battery Monitor and battery status shown by System Preferences. This feature is available on operating systems and Macintosh models that make this distinction. Added new information sheet showing long-term statistics collected by the battery unit, e.g. maximum and minimum voltages, currents, temperatures or operating hours. This feature is available on Macintosh systems with battery units that perform this type of data recording. Auxiliary windows and information sheets can now also be opened directly via main menu or Dock menu. The new version tries to avoid flicker of some text output elements when the overview window is already open while the application is still starting up. Release 4.6 (Build 220325) Added new feature to optionally show the estimated remaining time in the Dock tile of the App. Depending on current charging or discharging process, the value corresponds to the time it takes for the battery to become full or empty. Support for VoiceOver was enhanced in some parts of the App. The App is now more robust in cases where a monitored Bluetooth device sends invalid battery readings. Release 4.5 (Build 220202) This is a maintenance update which fixes minor issues: In specific cases, the labels for the y axes in history graphs could be rounded in confusing or misleading fashion, depending on the accuracy of the corresponding battery sensors. The number of digits and the rounding method are now optimized to avoid such issues. For specific operating system versions, the feature to open the Energy Saver preference pane via the menu icon may have failed. Release 4.4 (Build 220131) This is a maintenance update which fixes minor issues: In specific cases, the labels for the y axes in history graphs could be rounded in confusing or misleading fashion, depending on the accuracy of the corresponding battery sensors. The number of digits and the rounding method are now optimized to avoid such issues. For specific operating system versions, the feature to open the Energy Saver preference pane via the menu icon may have failed. Release 4.3 (Build 220106) Added new feature to show a history graph for battery temperature. The layout of the main overview window was optimized. This avoids clipped data fields in some language versions. Virtual battery units, used by some desktop computers with Apple Silicon, are no longer shown as an actual battery. Release 4.2 (Build 211116) Added new feature to show the accessible battery levels of all battery-powered Bluetooth devices currently connected to your Mac (no longer restricted to selected Human Interfaces devices). Added full support for macOS 12. Removed legacy support for macOS 10.12 and 10.13. Updated the handling of manufacturing dates for Apple devices released after August 2021. Release 4.1 (Build 210803) Added new feature to dismiss the notification panel for the “long charge” warning by simply plugging the power cord. Added new setting to increase the upper possible limit for the “nagging low power notification” feature from 20% to 66% if the user likes to do so. This can be helpful for old Macs with defective batteries. Added new feature to show possible deviations between the true health value for maximum battery capacity and fake values sometimes shown by macOS for specific Macintosh models. The activity profile of the App was optimized to avoid that the App Nap feature of macOS causes readings or other status information to be shown with a noticeable delay. Release 4.0 (Build 210412) In cases where the combination of Macintosh model and operating system no longer permit that Apps can access battery manufacturer and manufacturing date reliably, the application will now show the battery lot codes and version numbers instead. The display of the battery serial number has been simplified. Fixes a problem where the computer model was not shown as descriptive text for a few of the latest Macintosh series. Release 3.9 (Build 201126) Added support for the new battery management of the 10th generation MacBook Air and the 17th generation MacBook Pro. Capacity values and battery unit serial numbers will now be shown correctly for these models. Added a workaround for situations where the operating system provides contradicting battery health information. Fixed a problem for Macs with Apple Silicon where the system installation date may have been shown instead of the manufacturing week. Release 3.8 (Build 201109) Added official support for macOS 11 Big Sur. Legacy technology has been removed from the App. The minimum required OS version is now macOS 10.12. The conditions for merging two long-term battery capacity logs have been relaxed. This makes it easier to resolve an unintentional split of the database after using beta operating system versions. Release 3.7 (Build 200922) Added new feature to merge the capacity logs of two batteries if their time intervals are compatible. The width of the menu-bar display was further optimized for some versions of macOS. The battery capacity log has been made more robust against system or window server crashes. Added preparations for future operating system upgrades. Fixed a problem where the German translation was incomplete for error messages of the feature to split capacity logs. Release 3.6 (Build 200626) Added new option to suppress the battery icon in the menu bar if both the menu-bar item and its percentage display feature are active. This allows you to place Apple’s battery icon and Battery Monitor’s percentage value next to each other in the menu bar, combining the best of both worlds. The app now accepts that its icon can be replaced by the Finder. This will no longer raise a security warning. Release 3.5 (Build 200120) Added new feature to display the device type of the AC adapter in its details information window. This feature is not available for all combinations of operating systems and model series. Added new feature to display possible error status information for the AC adapter in the details information window. This feature is not available for all combinations of operating systems and model series. If the status item in the menu-bar is enabled, an additional warning marker will now be shown in the attached menu when battery servicing is required. This version adds a workaround for an ambiguity that could cause an incorrect display of production dates for Macintosh model series that have up-to-date operating system support for more than 10 years. Added a workaround for a missing battery health assessment field in operating systems that don’t differentiate correctly between health and error information. Release 3.4 (Build 191216) This version adds more explicit error messages for cases where communication with the AC power adapter fails due to support issues between operating system and specific hardware models. Release 3.3 (Build 191016) This version adds full support for macOS 10.15 Catalina. Legacy technology has been removed from the App. The minimum required OS version is now 10.11. Added new option to activate nagging, repeating reminder warnings when the charge level drops below a specified value. The threshold can be set between 5% and 20%. The preferences tab to define notifications employs improved user guidance. Release 3.2 (Build 190410) Added support for additional types of Bluetooth Human Interface Devices that will appear in the respective battery overview. Added new feature to automatically repair the long-time battery capacity log in cases where data corruption is detected. Release 3.1 (Build 190311) The legend of history windows now suppresses the labels for curves which are not in use for the current battery configuration. The Touch Bar buttons to open the total voltage history and the cell voltage history can now be differentiated correctly. Fixed an issue where the window of the battery capacity log may not have been updated immediately when switching between table mode and graph mode. Release 3.0 (Build 190220) Added new feature to get a simple overview of external batteries in selected Bluetooth Human Interface Devices. The current capacities and warning states can be listed in a window and will also appear in the menu of the menu-bar icon where available. The history windows for total battery voltage and individual cell voltages are now separate. This makes sure the measured quantities are shown with optimal scales. Release 2.9 (Build 190128) This version will change the way macOS activates windows if the App is operated without a Dock icon. The new policy makes sure windows and notification panels are always moved to the front when they are opened, so even if the App is visible in the menu bar only, you can no longer overlook windows that macOS would put behind the currently active application by default. Release 2.8 (Build 180912) This version adds full support for macOS 10.14 Mojave. Legacy technology has been removed from the App. The minimum required OS version is now 10.10. Release 2.7 (Build 180507) Added new option to show a numerical percentage value for the charge level in the Dock tile. Resolved a problem where the main window did not remember its last position for users who have the Resume feature of the operating system disabled. Release 2.6 (Build 171025) Added new menu items to open the most important windows of the App via the context menu of the Dock. By request of many users, the Dock tile of Battery Monitor can now be removed after the menu-bar icon has been enabled (macOS Sierra or later only). The menu items of the App will then move into the menu of the status icon, making it possible to control the program from there. Release 2.5 (Build 170809) By user request, an optional menu-bar icon has been added for macOS Sierra. It can be used to indicate remaining runtime in the menu, or to get quick access to specific features. Release 2.4 (Build 170510) Added a new feature to display the estimated error of the battery’s capacity value. Added a new feature to show an optional warning when the estimated error of the capacity value becomes too large and the battery needs to be re-calibrated. Added a new subsection in the reference manual to document the meaning of the battery defect list. By request, the user interface to control charge level display mode has been redesigned. Numerical readings in the main window are now presented more consistently with the user’s current locale settings. Release 2.3 (Build 161214) Added support for computers with Touch Bar. Added new feature to suppress recording of capacity log data when the computer clock has lost its correct date setting. Added new feature to indicate the current charge state and the estimated remaining time in the context menu of the Dock tile. Release 2.2 (Build 160920) Optimized for macOS Sierra. Release 2.1 (Build 160223) Added new feature to display technical details about the AC adapter. Added new feature to display defects of the battery unit. Added new status line to show the syst"
