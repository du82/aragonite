title = "NFS Manager: Download"
description = "Download page for NFS Manager"
full_description = "Download NFS Manager You can download the application NFS Manager at no charge. This allows you to evaluate the software to see if it suits your needs. During the test phase, only the following restrictions apply: A demo mode panel will appear each time you launch the application. A demo mode panel will appear each time you save changes in the NFS configuration. There are no other functional restrictions. If you like to use the software permanently, you'll have to place an order for the required number of usage licenses. For each license you will receive a so-called registration file containing a registration code which will allow you to switch the application from demo mode to normal operation. Distributing or leasing the application or its license to third parties is prohibited without prior written permission. In particular, you have no permission to transfer the registration to somebody else. The exact contractual obligations for licensing the software are shown and can be printed after you have opened the downloaded software package. Security Information To verify that the download package is authentic and has not been altered by a third party, you can verify its SHA-256 checksum. The SHA-256 checksum for the current version of the download file is e524067b4e34f121e28d08e2b3fb4f4ce90593c64fa6132cd2ae210505fd8082."
