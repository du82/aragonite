["https://bresink.com/Blog/2018/blog-2018-08.html"]
title = "Blog - Archived Entries - August 2018"
description = "Blog Marcel Bresink Software-Systeme - Archived Entries - August 2018"
full_description = "Blog - Archived Entries - August 2018 The latest entries are listed first. — See more latest news from the current blog. August 29, 2018: Apple releases new software via macOS Software Update: Safari Technology Preview version 64 (Update Product ID: 041-03053) Safari Technology Preview allows users to get a sneak peek at upcoming web technologies in macOS and experiment with these technologies in websites and extensions. August 28, 2018: Apple releases new software via macOS Software Update: macOS High Sierra 10.13.6 Supplemental Update 2 for MacBook Pro (2018) (Update Product ID: 091-97109) BridgeOS for systems with macOS 10.13.6 and T2 processor (Update Product ID: 091-97108) The update fixes technical issues with the Apple T2 management processor in the latest MacBook Pro models. August 27, 2018: Apple releases new software via macOS Software Update: Gatekeeper version 153 (Update Product ID: 041-01604) Gatekeeper updates malware definitions for all Macintosh operating systems as of OS X 10.8 Mountain Lion and higher. It is part of the built-in antivirus software of macOS. August 22, 2018: Apple releases new software via macOS Software Update: Boot Camp ESD Update (Update Product ID: 041-00624) Boot Camp ESD is an Electronic Software Distribution package that provides drivers for running Microsoft Windows on Macintosh computers. August 21, 2018: Apple releases new software via macOS Software Update: Boot Camp Update for iMac Pro (Update Product ID: 091-97136) The update improves compatibility with Apple mice, keyboards, and trackpads when installing Windows 10 on the iMac Pro. August 20, 2018: Apple releases new software via macOS Software Update: Gatekeeper version 152 (Update Product ID: 041-01253) Gatekeeper updates malware definitions for all Macintosh operating systems as of OS X 10.8 Mountain Lion and higher. It is part of the built-in antivirus software of macOS. August 15, 2018: Apple releases new software via macOS Software Update: Safari Technology Preview version 63 (Update Product ID: 091-99997) Safari Technology Preview allows users to get a sneak peek at upcoming web technologies in macOS and experiment with these technologies in websites and extensions. August 13, 2018: Apple releases new software via macOS Software Update: Gatekeeper version 151 (Update Product ID: 091-99603) Gatekeeper updates malware definitions for all Macintosh operating systems as of OS X 10.8 Mountain Lion and higher. It is part of the built-in antivirus software of macOS. August 9, 2018: Apple releases new software via macOS Software Update: Apple SafeView Version 7.0 (Update Product ID: 091-95228) SafeView is an internal utility that macOS customers can use to share their screens via Internet with service representatives from Apple or AppleCare. It allows remote access for support purposes. This software is not available to the general public. August 8, 2018: Apple releases new software via macOS Software Update: Parts of the speech output library (voice data and configuration info packages) have been updated to version 1.3.4. Voice Aaron – English – US (Update Product ID: 091-26660) Voice Aaron – English – US (Update Product ID: 091-26735) Voice Aidan – English – Ireland (Update Product ID: 091-89167) Voice Aidan – English – Ireland (Update Product ID: 091-89172) Voice Aleksei – Russian – Russia (Update Product ID: 091-26590) Voice Aleksei – Russian – Russia (Update Product ID: 091-26785) Voice Angel – Spanish – Mexico (Update Product ID: 091-26578) Voice Angel – Spanish – Mexico (Update Product ID: 091-26609) Voice Arthur – English – Great Britain (Update Product ID: 091-26696) Voice Arthur – English – Great Britain (Update Product ID: 091-26739) Voice Axel – Swedish – Sweden (Update Product ID: 091-26715) Voice Axel – Swedish – Sweden (Update Product ID: 091-26764) Voice Beatriz – Spanish – Mexico (Update Product ID: 091-26637) Voice Beatriz – Spanish – Mexico (Update Product ID: 091-26712) Voice Carmen – Spani