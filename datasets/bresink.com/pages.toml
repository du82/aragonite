["https://bresink.com/osx/0TinkerTool/history.html"]
title = "TinkerTool: What's new?"
description = "TinkerTool version history"
full_description = "What's new? TinkerTool Version History Release 10.2 (Build 250211) The setting to highlight the Dock selection under the cursor in grid display mode for Stacks (originally introduced for Mac OS X 10.5) was reactivated for macOS 15 Sequoia. Release 10.1 (Build 250127) Added new setting to change the spacing between Status Items in the menu bar (icons indicating state information at the top right-hand side). The setting is shown on the Desktop pane. Release 10.0 (Build 240910) Added full support for macOS 15 Sequoia. Added new Finder setting to let the widths of columns in column display mode automatically adapt to the listed file names. Release 9.8 (Build 240731) Added support for alternative preview versions of upcoming operating systems. Users of Intel-based Macs or users who don’t test beta operating systems won’t need this specific build. Release 9.8 (Build 240612) Added preliminary support for future versions of macOS. Added explanation message and documentation why some versions of macOS may show a misleading media access privacy warning regarding TinkerTool under specific circumstances. Fixes a layout issue on the Desktop pane. Fixes a problem where the feature to add custom sounds for new messages in Mail was not always handling Apple's default sound correctly. Release 9.7 (Build 240403) This is a maintenance update which fixes a minor problem where not all variants of date and time formats could be selected under all circumstances when customizing individual templates. The Formats pane now uses a different example date and time in order to make all variants visible and accessible. Release 9.66 (Build 240208) This build adds minor updates to the Brazilian Portuguese user interface. Release 9.66 (Build 240111) Several minor optimizations in the layout of the preferences panes for specific operating system versions and languages. Fixes a problem where panes could unexpectedly be scrolled in horizontal direction in situations when a vertical scrollbar was shown simultaneously. Release 9.65 (Build 231120) The option to control the delay time for showing help tags (“tooltips”) was reinstated for macOS 13 and macOS 14. This version fixes a problem where the visual instructions to enable Full Disk Access for activating Safari options were shown with an invalid layout. Release 9.6 (Build 231024) For users working with an always visible scroll-bar, the new version adds a completely revised resize architecture for the different panes. This results in a more expected behavior of the scroll-bar indicators. Users who like to control TinkerTool within a TinkerTool System window need to update to TinkerTool System 8 version 8.87 or later for technical reasons. Release 9.5 (Build 230920) Added full support for macOS 14 Sonoma. Added new setting to show the Problem Reporter as application in the Dock when applications crash. The setting not to prefer iCloud when applications save documents has been removed because it is no longer respected by the latest versions of macOS. Fixed a problem where an outdated designation was shown for the System Settings application depending on the user's preferred language. Release 9.4 (Build 230606) Added preliminary support for future versions of macOS. The sidebar is now respecting the user's size preferences and updates dynamically. The document icons have been updated and their storage size has been optimized. Fixes a problem where the list of sound effects for the “New Mail“ notification was shown in English instead of the user's preferred language. Release 9.3 (Build 230418) Due to new limitations in macOS developer tools, the internal architecture of the application has changed. Users who like to use TinkerTool from within TinkerTool System 8.5 or later have to update to TinkerTool 9.3 or later for technical reasons. Due to a defect in macOS 13, Apple's user preference to disable the animation for opening windows can have unexpected side effects when trying to rename documents via the title bars of windows. For this reason, TinkerTool will now only support re-enabling the animation, but no longer switching it off. Release 9.2 (Build 230404) This is a maintenance update which fixes a possible issue with the layout of the Dock pane if a user has Dock tiles with very long labels. Release 9.12 (Build 230105) Fixes a minor issue where commas could not always be entered into the date and time format fields. Fixes a minor issue where literal characters at the end of date and time formats were not always shown in the user interface. Release 9.11 (Build 221222) Some users have been confused that TinkerTool optimized the menu of currency symbols on the Formats pane by chosing a random example currency as representative for each symbol. This behavior has changed. The pop-up button now shows the unabridged list of currencies supported by the running version of macOS, even if multiple currencies use the identical symbol. The functionality remains the same. Release 9.1 (Build 221219) Added new pane for changing number, currency, date, and time formats. This pane can act as a substitute for the missing user interface in Apple's System Settings which is no longer providing this feature for macOS Ventura. Due to technical limitations of macOS, the new pane is only visible if the primary language of your user account is set to one of the supported languages of TinkerTool. The following settings are available: Thousands grouping separator for numbers Decimal separator for numbers Preferred currency symbol Thousands grouping separator for currency values Decimal separator for currency values Short, medium, long and complete formats for date specifications Short, medium, long and complete formats for time specifications Preferred AM/PM indicators Release 9.0 (Build 221019) Added full support for macOS 13 Ventura. TinkerTool 9 can only be used with macOS 13 or later. The application uses a completely new user interface, based on the style specifications for the program “System Settings”. Release 8.6 (Build 221019) This version recommends an upgrade to TinkerTool 9 when running on macOS 13 Ventura. Fixes a problem with the latest versions of macOS, where incorrect icons could be shown for user guidance if TinkerTool had no privacy permission to access Safari settings. Release 8.5 (Build 220614) Added preliminary support for future versions of macOS. Added new option to enable the dialog for fast application switching on all displays, not only on the Dock screen. Release 8.4 (Build 211222) Added new option to active direct mouse control without any influence on speed or acceleration. The setting to disable the feature to keep help windows always in the foreground could be re-enabled for macOS 12.1. The setting to disable font smoothing could be re-enabled for macOS 12.1. For specific combinations of appearance settings for Dark Mode, reduced transparency, and Dark Mode limitation to menu bar and Dock, TinkerTool will now automatically optimize the appearance settings for overlaid “on-screen display” indicators of macOS. Fixed a translation issue, where the option to enable slow motion for window minimization was shown in English instead of the preferred language. Release 8.3 (Build 211020) Added full support for macOS 12 Monterey. Changed behavior when the application detects that third-party applications have modified the setting to change the animation for automatically hiding the Dock. Release 8.2 (Build 210618) Added preliminary support for future versions of macOS. Added new option to enable slow-motion of Dock minimization when shift key is hold. Fixed an issue where no graphic overlay was shown on the Safari pane in specific versions of macOS if the user has not acknowledged the privacy settings for Full Disk Access yet. Release 8.1 (Build 201118) Added support for future operating system versions. The list of sound effects for the Mail application is now shown in the user's preferred language. The design of the help window was updated. Fixed a problem where the Apps pane was mistakenly accepted for integration by TinkerTool System 6. Release 8.0 (Build 201110) Added full support for macOS 11.0 Big Sur. Release 7.6 (Build 200908) Added new option to disable animation when scrolling between document pages. The option to block the feature for burning optical media with the Finder was reinstated for macOS Catalina. Release 7.5 (Build 200630) Added preliminary support for future operating systems. Added new option to disable the temporary preview to edit screenshots. Release 7.42 (Build 191016) The documentation could be updated for macOS 10.15 Catalina because its news embargo is no longer active. The Portuguese user interface has been reviewed for terminology changes in macOS 10.15. Release 7.41 (Build 190805) Added support for recent changes in beta versions of macOS. Users with officially published versions of macOS Mojave don't need this update. Release 7.4 (Build 190625) Added support for future versions of macOS. If you operate TinkerTool as integrated part of TinkerTool System, it will be necessary to update TinkerTool System as well (version 6.51 or later). Release 7.3 (Build 190604) Added preliminary support for future versions of macOS. The settings of the Finder to disable access to preferences and to prevent emptying the Trash could be circumvented easily and are no longer supported officially by Apple. For these reasons, these settings can only be deactivated, but no longer re-activated by TinkerTool. Release 7.2 (Build 190404) Added full support for macOS 10.14.4 and Safari 12.1. Added new feature to let the application copy itself to the system Applications folder if desired when the program is launched from the virtual distribution disk. Release 7.1 (Build 181022) Added new option to force the Finder to collect all data from a network folder before displaying its contents. Added new option to let Mail use your own AIFF sound file to indicate a new message. Added new option to prevent macOS from suggesting iCloud (if available) when saving documents. Added new option to restrict dark mode to menu bar and Dock, keeping applications light. Added new option to keep Finder light even if dark mode is enabled. Added new option to keep Mail light even if dark mode is enabled. Added new option to keep System Preferences light even if dark mode is enabled. Added new option to keep Terminal light even if dark mode is enabled. Added new option to keep iTunes light even if dark mode is enabled. Added new option to keep Safari light even if dark mode is enabled. The settings to control style and degree of font smoothing (from OS X 10.8 and earlier) have been reinstated for macOS Mojave. The Italian translation has been removed. Release 7.0 (Build 180829) Added full support for macOS 10.14 Mojave. Release 6.4 (Build 180620) The option to suppress the Time Machine dialog when attaching empty disks has been reinstated. It had been previously removed for OS X Mavericks due to changes in the operating system. The option to add spacers between Dock tiles is now supporting the entire Dock, not only the applications section. Added preliminary support for future versions of macOS. Release 6.3 (Build 180417) Added new option to add half-size spacers to the Dock. On some computers, the display quality of the icon of the Reset pane has been improved. Release 6.21 (Build 170919) Added full support for macOS 10.13 High Sierra. Release 6.2 (Build 170628) Fixed a problem where TinkerTool would not start with certain pre-release versions of macOS High Sierra, if it was stored on a case-sensitive file system on a computer with Touch Bar. This update is not relevant for users that don't have this specific configuration. Release 6.2 (Build 170612) Added preliminary support for future versions of macOS. Release 6.1 (Build 170601) The application was re-released, fixing a possible compatibility problem when being used with outdated releases of macOS prior to version 10.12.1 Build 16B2659. Release 6.1 (Build 170221) The application was re-released with an additional Italian language support package. Release 6.1 (Build 170210) The preference settings for Dock and Launchpad have been separated and are now presented on two different panes. Added support for Macintosh computers with Touch Bar. Added stepless control for the initial page zoom setting of Safari. Added feature to add spacer elements to the Dock. Added feature to change the layout arrangement of Launchpad. Several language translations had to be removed for organizational reasons. This may be temporary. Release 6.0 (Build 160919) This version supports macOS 10.12 Sierra. Release 5.7 (Build 160912) The application is aware of macOS 10.12 Sierra, and the documentation has been updated accordingly. Revised Finnish user interface. Revised Portuguese user interface. Release 5.61 (Build 160823) This update ensures full compatibility with TinkerTool System 4.8. Release 5.6 (Build 160707) Added preference setting to enable automatic notification for software updates of the application. Links to external information sources in the user interface are now using encrypted HTTPS communication. Integrated changes of intermediate build versions, fixing problems with support for Quick Look and Mission Control settings in different releases of OS X El Capitan. Changed distribution packaging to support future security enhancements of the operating system. Release 5.51 (Build 150917) Added official support for OS X 10.11 El Capitan. Release 5.5 (Build 150819) Added new setting to block access to the Preferences window of the Finder. Added new setting to block access to the Empty Trash function of the Finder. Added new setting to disable the delay for showing the Dock when the Dock is set to hide automatically. Added new setting to control the blink rate of the text insertion marker. Added new setting to enable a key combination that toggles the setting for dark menu and Dock (OS X Yosemite or later only). Many small changes in the user interface. Switching to Portuguese is now sufficient to enable language support for Brasilian Portuguese. Korean language support had to be removed. Release 5.4 (Build 150618) This version adds preliminary support for future operating systems. Release 5.32 (Build 150518) Added Korean language support. Reinstated the setting to deactivate Dashboard for OS X Yosemite. Although this option has been superseded by Mission Control settings, Apple keeps it active. Users who blocked Dashboard in Mavericks and updated to Yosemite can now reactivate Dashboard if required. Reinstated the setting to prevent applications from quitting automatically for the official versions of OS X Yosemite. Release 5.31 (Build 141014) The documentation was updated for OS X 10.10 Yosemite. The application now detects iTunes 12. Corrected a problem where the General pane showed no or an incorrect icon with specific versions of OS X Yosemite. Release 5.3 (Build 140725) Added a more"
