full_description = "Blog The latest news are listed first. February 26, 2025: Apple releases new software via macOS Software Update: Apple XProtect Configuration Data version 5288 for OS X 10.11 to macOS 10.14 (Update Product ID: 072-89845) Apple XProtect Configuration Data version 5288 for macOS Catalina (Update Product ID: 072-89844) XProtect is part of the built-in antivirus software of macOS. The package does not appear in the Software Update section of System Preferences (or App Store in older versions of the operating system). macOS is updating the software automatically in the background if you have granted the system permission to download system data files and security-related files. February 20, 2025: Apple releases new software via macOS Software Update: Apple Mobile Device Update (Update Product ID: 072-88135) The update provides new icons and system resources for new Apple hardware released in February 2025. February 20, 2025: We are releasing Autostarter version 2.0 through the Mac App Store: Added new context menu in the table of autostart items to reveal applications in the Finder. Added new feature to detect situations where data has been migrated to a new Mac. It is now possible to take over autostart items from a previous computer without having to export and import entries manually. Small internal optimizations. Autostarter is a small app that makes it possible to launch applications automatically during login without letting the applications show windows, even with macOS Ventura or later. February 13, 2025: Apple releases new software via macOS Software Update: Apple SafeView version 10.4 (Update Product ID: 072-14191) This version returns the ability to use SafeView along with Microsoft Teams. Native Bridge non-notification workflows have updated instructions. SafeView is an internal utility that macOS customers can use to share their screens via Internet with service representatives from Apple or AppleCare. It allows remote access for support purposes. This software is not available to the general public. February 11, 2025: We are re-releasing TinkerTool version 10.2: The setting to highlight the Dock selection under the cursor in grid display mode for Stacks (originally introduced for Mac OS X 10.5) was reactivated for macOS 15 Sequoia. TinkerTool is an application that gives you access to additional preference settings Apple has built into macOS. This allows to activate hidden features in the operating system and in some of the applications delivered with the system. February 10, 2025: Apple releases new software via macOS Software Update: macOS 15.3.1 Sequoia macOS 15.3.1 Sequoia Update for macOS 10.12 and later (Update Product ID: 072-70706) macOS 14.7.4 Sonoma (Update Product ID: 072-84039) macOS 13.7.4 Ventura (Update Product ID: 072-83845) BridgeOS Customer Update 15.3.1 (Update Product ID: 072-70666) The updates address critical security issues in the operating systems. February 7, 2025: Apple has successfully fixed the issues with the Mac App Store. All features have become available again for users of OS X 10.8 to macOS 10.14. Apps can also be launched and re-downloaded again. Apple hat die Problem mit dem Mac App Store erfolgreich behoben. Alle Funktionen sind für Nutzer von OS X 10.8 bis macOS 10.14 wieder verfügbar. Apps können auch wieder gestartet und erneut heruntergeladen werden. February 6, 2025: Our quality assurance tests indicate that important services of the Mac App Store are currently inaccessible for users still running one of the following operating systems: OS X 10.8 Mountain Lion OS X 10.9 Mavericks OS X 10.10 Yosemite OS X 10.11 El Capitan macOS 10.12 Sierra macOS 10.13 High Sierra macOS 10.14 Mojave This can have one or all of the following consequences: You cannot sign in to the App Store. You can no longer download apps you have purchased in the past. Specific interactions with the App Store result in error messages similar to “plist could not be parsed” or “server response: 500”. The App Store may indicate that paid apps are allegedly “damaged” and need to be downloaded again. At the moment, it is unclear whether this is a temporary failure or a planned shutdown. Apple had discontinued support of the App Store for Mac OS X 10.6 Snow Leopard and Mac OS X 10.7 Lion in February 2023 already. Please note that we are technically unable to help you if your old macOS installation refuses to launch App Store apps from us or other vendors. You need to contact Apple for further support. 6. Februar 2025: Unsere Tests zur Qualitätssicherung deuten darauf hin, dass wichtige Dienste des Mac App Store im Moment für Nutzer unerreichbar sind, die noch immer eines der folgenden Betriebssysteme verwenden: OS X 10.8 Mountain Lion OS X 10.9 Mavericks OS X 10.10 Yosemite OS X 10.11 El Capitan macOS 10.12 Sierra macOS 10.13 High Sierra macOS 10.14 Mojave Dies kann eine oder alle der folgenden Wirkungen haben: Sie können sich nicht im App Store anmelden. Sie können keine Apps mehr herunterladen, die Sie in der Vergangenheit gekauft haben. Bestimmte Aktionen im App Store führen zu Fehlermeldungen ähnlich wie „plist could not be parsed“ oder „server response: 500“. Der App Store gibt manchmal an, dass bezahlte Apps angeblich „beschädigt“ sind und erneut heruntergeladen werden müssen. Im Moment ist es unklar, ob es sich um einen vorübergehenden Ausfall oder eine geplante Abschaltung handelt. Apple hatte bereits die Unterstützung des App Store für Mac OS X 10.6 Snow Leopard und Mac OS X 10.7 Lion im Februar 2023 eingestellt. Bitte beachten Sie, dass wir technisch nicht in der Lage sind, Ihnen weiterzuhelfen, falls Ihre alte macOS-Installation sich weigert, unsere Apps oder die anderer Anbieter aus dem App Store zu starten. Sie müssen sich für weitere Unterstützung an Apple wenden. February 5, 2025: Apple releases new software via macOS Software Update: Apple XProtect Configuration Data version 5287 for OS X 10.11 to macOS 10.14 (Update Product ID: 072-80189) Apple XProtect Configuration Data version 5287 for macOS Catalina (Update Product ID: 072-80190) XProtect is part of the built-in antivirus software of macOS. The package does not appear in the Software Update section of System Preferences (or App Store in older versions of the operating system). macOS is updating the software automatically in the background if you have granted the system permission to download system data files and security-related files. February 3, 2025: Apple releases new software via macOS Software Update: macOS Installer Notification 2.0 (Update Product ID: 072-56999) Installer Notification forces older macOS systems to automatically download installers for the latest compatible versions of macOS if this is permitted by the user. The package does not appear in the Software Update section of System Preferences (or App Store in older versions of the operating system). macOS is updating the software automatically in the background if you have granted the system permission to download system data files and security-related files. February 3, 2025: We are releasing TinkerTool System 9 version 9.4: Adds new pane to control the automatic power-on feature of portable Macs with Apple Silicon. Autostart by opening the lid or connecting power can be prevented (macOS 15.3 or higher required). The layout of panes that don’t have submenus has been modified slightly. TinkerTool System 9 is a collection of system utility features helping you in performing advanced administration tasks on Apple Macintosh computers. Older entries…"
