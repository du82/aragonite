["https://bresink.com/osx/BatteryMonitor-de.html"]
title = "Battery Monitor: Beschreibung"
description = """
Produktbeschreibung Battery  Monitor"""
full_description = "Battery Monitor Immer mehr Computer werden heute als mobile Geräte eingesetzt. Wichtigste Voraussetzung für einen tragbaren Computer ist ein Akku, eine aufladbare Batterie, die das Gerät mit Strom versorgt. Akkus sind nicht gerade billige Verschleißteile, deren Lebensdauer durch sorgsame Behandlung optimiert werden sollte. Battery Monitor ist ein kleines Hilfsprogramm, das in diesem Zusammenhang nützlich ist. Es bietet folgende Funktionen: Anzeige des Ladezustands im Dock: Dies ist nützlich, falls Sie nicht die Anzeige von macOS in der Menüleiste verwenden möchten oder können, z.B. bei Einsatz eines nicht sehr breiten Bildschirms. Battery Monitor kann auch die geschätzte Restlaufzeit im Dock-Menü anzeigen, selbst wenn Sie ein Betriebssystem verwenden, das diesen Wert in der Menüleiste unterdrückt. Anzeige der internen Akkudaten: Neben dem Ladezustand können Sie viele weitere technische Daten, z.B. Temperatur, Entladestrom, Anzahl der Ladezyklen, erwartete Restlebensdauer und Kapazität abrufen. Auch der Zustand der einzelnen Akkuzellen und der Hersteller der Zellen lässt sich bestimmen. Erfassen der Lade- und Entladekurven: Sie können den Verlauf der Messwerte, die vom Akku erfasst werden, grafisch darstellen. So lässt sich z.B. die Lade- und Entladekurve, ein wichtiges Merkmal für den Zustand des Akkus, darstellen. Auch die Leistungsabgabe während des Betriebs Ihres Computers lässt sich erfassen und somit „stromfressende Programme“ ermitteln. Buchführung über die Alterung des Akkus: Battery Monitor führt vollautomatisch Buch über die Ladekapazität des Akkus, die bei Gebrauch immer mehr abnimmt. Damit haben Sie eine genaue Kontrolle über den Alterungsvorgang des Akkus. Sie können einschätzen, ob sich Ihr Akku normal verhält oder eventuell defekt ist. Sie können besser einschätzen, wann es sich lohnt, einen neuen Akku anzuschaffen. Bei Computern mit wechselbaren Akkus kann Battery Monitor selbstverständlich auch mehrere Akkus, die im Einsatz sind, überwachen. Benachrichtigungen beim Laden und Entladen: Neben der Anzeige des Ladezustands kann Sie Battery Monitor auf Wunsch noch auf andere Weise über das Fortschreiten des Lade- oder Entladevorgangs informieren. Unaufdringliche Benachrichtigungen per Sprachausgabe oder über die Mitteilungszentrale von macOS können eingerichtet werden. Zusätzlicher Überblick über verbundene Bluetooth-Batterien: Falls unterstützte batteriebetriebene Bluetooth-Geräte mit Ihrem Mac verbunden sind, kann das Anzeigen von deren Batterieständen auch in Battery Monitor eingebunden werden. Die Software wird elektronisch über Apples Mac App Store vertrieben."
