title = "TinkerTool System 6: Description"
description = """
Product description for TinkerTool  System 6"""
full_description = 'TinkerTool System 6 TinkerTool System 6 is a collection of system utility features helping you in performing advanced administration tasks on Apple Macintosh computers. The application makes use of a self-adapting user interface which automatically adjusts to the computer model and to the version of macOS you are running. All options available in the current situation are accessible via “panes”, very similar to the techniques you already know from the System Preferences application. The features are controlled via a single window which allows you to use the application as a general toolbox and First Aid assistant. This includes: built-in maintenance features of macOS, usually not visible on the graphical user interface, extended file operations, not available in the macOS Finder, the possibility to access advanced system settings which are not visible in System Preferences, genuine and unique features of TinkerTool System, designed to resolve typical real-world problems of administrators and to fix the effects of certain defects ("bugs") in the operating system, an emergency tool to troubleshoot and repair macOS in cases where the graphical user interface is no longer starting correctly or the user account of the system administrator has been damaged, functions to collect advanced information about the hardware, operating system, and applications. TinkerTool System 6 with TinkerTool integrated Together with its sister program TinkerTool which is available at no charge, TinkerTool System is a perfect substitute for the following types of system utilities: Finder enhancers, Cache and font cache cleaners, Scripts to create bootable system installer and recovery disks, Tools to access hidden preference settings, Applications to make objects invisible in the Finder, Log file browsers, Application uninstallers, Spell-checker dictionary editors, and many others. TinkerTool System 6 contains all these functions, and much more, but at a reasonable price, and with proven quality. Click on the items in the menu above to learn more about the program and its features. TinkerTool System 6 is electronically distributed software. You can download the product and fully test it for a limited time before you decide to purchase an unrestricted usage license. Which generation of TinkerTool or TinkerTool System and which license for TinkerTool System do I need for my operating system?'
