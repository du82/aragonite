title = "Sync Checker: Download"
description = "Download page for Sync Checker"
full_description = "Download Sync Checker You can download the application Sync Checker at no charge. This allows you to evaluate the software to see if it suits your needs. During the test phase, only the following restrictions apply: A window with the note Running in Demo Mode appears each time the application is started. When you use Sync Checker to compare the contents of two folders, the compare operation will automatically stop after more than 200 differences have been detected. It won't be possible to display synchronization check results with more than 200 deviating objects. During normal, unlocked operation, Sync Checker can analyze any number of differences between two folders, only limited by the computer's memory. There are no other limitations regarding the functionality of the software. If you like to use the software permanently, you'll have to place an order for the required number of usage licenses. For each license you will receive a so-called registration file containing a registration code which will allow you to switch the application from demo mode to normal operation. Distributing or leasing the application or its license to third parties is prohibited without prior written permission. In particular, you have no permission to transfer the registration to somebody else. The exact contractual obligations for licensing the software are shown and can be printed after you have opened the downloaded software package. Security Information To verify that the download package is authentic and has not been altered by a third party, you can verify its SHA-256 checksum. The SHA-256 checksum for the current version of the download file is 60b177bec36158e5fe2dea4cf40b2806ee4e577a71d0e5d3755d28a3cde33f99."
