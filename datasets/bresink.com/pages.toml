description = """
Product description page for Mac  Power Monitor"""
full_description = "Mac Power Monitor Mac Power Monitor is a graphical, easy-to-use interface for the energy and power measuring features of macOS. A large number of statistical evaluations can be retrieved, such as a power overview, process statistics, data transfer bandwidths of hardware components, interrupt sources, interrupt distribution, processor core data, and much more. The data can either be recorded live at a rate of 1 measurement per second, or as a one-shot operation with any adjustable duration of 1 millisecond or higher. On Macs with Apple Silicon, the summary window is designed to resemble the display of Timothy Liu’s asitop command-line utility. The software is distributed electronically. You can download the product and test it before you decide to purchase a license for unrestricted usage."
