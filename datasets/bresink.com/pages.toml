cation behavior after performing the steps outlined above: [*] …but actually the following is happening: [*] I found the following workaround: I already tried the following to search for the cause of the problem: [*] entering data is required for fields with this marker. Privacy: I agree By checking the field “I agree”, you confirm that you have read, understood, and accepted the following privacy notice: All data you entered into this form will be processed to handle your request and for further inquiries. The data will be stored until further notice unless different statutory retention periods apply. You can always request access to and rectification or erasure of your data free of charge. In addition, you have the right to lodge a complaint with an affected supervisory authority of the European Union (in Germany, for example, the State Data Protection Commissioner of your state) about the processing of your data. The responsible contact person and the complete data protection policy can be found on a separate web page.'''
