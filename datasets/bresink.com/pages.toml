 (Update Product ID: 091-26738) Voice Luisa – Spanish – Spain (Update Product ID: 091-26748) Voice Luisa – Spanish – Spain (Update Product ID: 091-26756) Voice Maeve – English – Ireland (Update Product ID: 091-89166) Voice Maeve – English – Ireland (Update Product ID: 091-89182) Voice Marie – French – France (Update Product ID: 091-26755) Voice Marie – French – France (Update Product ID: 091-26791) Voice Marius – Norwegian – Norway (Update Product ID: 091-94054) Voice Marius – Norwegian – Norway (Update Product ID: 091-94055) Voice Martha – English – Great Britain (Update Product ID: 091-26575) Voice Martha – English – Great Britain (Update Product ID: 091-26697) Voice Martin – German – Germany (Update Product ID: 091-26597) Voice Martin – German – Germany (Update Product ID: 091-26795) Voice Nando – Portuguese – Brazil (Update Product ID: 091-26585) Voice Nando – Portuguese – Brazil (Update Product ID: 091-26753) Voice Nicky – English – US (Update Product ID: 091-26747) Voice Nicky – English – US (Update Product ID: 091-26776) Voice Nora – English – US (Update Product ID: 091-39343) Voice Nora – English – US (Update Product ID: 091-39346) Voice O-Ren – Japanese – Japan (Update Product ID: 091-26572) Voice O-Ren – Japanese – Japan (Update Product ID: 091-26711) Voice Paolo – Italian – Italy (Update Product ID: 091-26623) Voice Paolo – Italian – Italy (Update Product ID: 091-26623) Voice Pierre – French – Canada (Update Product ID: 091-26581) Voice Pierre – French – Canada (Update Product ID: 091-26786) Voice Pieter – Dutch – Netherlands (Update Product ID: 091-26630) Voice Pieter – Dutch – Netherlands (Update Product ID: 091-26703) Voice Sandra – Portuguese – Brazil (Update Product ID: 091-26573) Voice Sandra – Portuguese – Brazil (Update Product ID: 091-26763) Voice Shufen – Chinese – Taiwan (Update Product ID: 091-89165) Voice Shufen – Chinese – Taiwan (Update Product ID: 091-89177) Voice Sophie – France – Canada (Update Product ID: 091-26634) Voice Sophie – French – Canada (Update Product ID: 091-26675) Voice Tilde – Swedish – Sweden (Update Product ID: 091-26589) Voice Tilde – Swedish – Sweden (Update Product ID: 091-26673) Voice Vincent – Spanish – Spain (Update Product ID: 091-26752) Voice Vincent – Spanish – Spain (Update Product ID: 091-26762) Voice Xander – English – South Africa (Update Product ID: 091-89173) Voice Xander – English – South Africa (Update Product ID: 091-89173) Voice Yelena – Russian – Russia (Update Product ID: 091-26624) Voice Yelena – Russian – Russia (Update Product ID: 091-26662) Voice Yu-Shu – Chinese – China (Update Product ID: 091-26765) Voice Yu-Shu – Chinese – China (Update Product ID: 091-26772) August 8, 2018: We are releasing TinkerTool System 5 version 5.95. The following items have been updated: Added new feature to recreate the shared users folder if that system folder has been deleted inadvertently. This feature is also available for unregistered users. Added new feature to perform a bulk integrity check on applications in a folder or on an entire volume (macOS 10.13 or later only). Added new feature to present the different definitions of free storage space used by macOS per volume (macOS 10.13 or later only). This feature is also available for unregistered users. Added new feature to check the integrity of the EFI firmware immediately (macOS 10.13 or later only; only on Macintosh models where this is supported by Apple). Added new feature to check the integrity of the firmware of Broadcom® Ethernet devices (macOS 10.13 or later only). The feature to delete the partition table on disks is now also available for macOS 10.13 or later again. The feature to test fans is now also available on Macintosh models protected by an Apple T2 processor. The feature to create install media now recognizes incomplete installer apps and warns about possible issues in advance. The Info pane now also shows the SMC version on Macintosh models where the SMC chip has been superseded by Apple’s BridgeOS. Added new internal diagnostics to create technical reports in cases where the launch of TinkerTool System is too slow or incomplete due to operating system issues. Fixed an issue where an erroneous warning about an unexpected change of the fstab file could be shown under specific circumstances when multiple administrators used TinkerTool System on one computer. August 7, 2018: Apple releases new software via macOS Software Update: Apple Directory 5.4.1 (Update Product ID: 091-87414) Apple Directory is an internal application that provides groupware functions to Apple employees. It is integrated into the single sign-on network architecture at Apple. Although the application is updated as part of macOS, it is not available to the general public. August 6, 2018: Apple releases new software via macOS Software Update: Gatekeeper version 150 (Update Product ID: 091-98055) Gatekeeper updates malware definitions for all Macintosh operating systems as of OS X 10.8 Mountain Lion and higher. It is part of the built-in antivirus software of macOS. August 1, 2018: Apple releases new software via macOS Software Update: Safari Technology Preview version 62 (Update Product ID: 091-95879) AppleConnect (for Macintosh), version 2.9.9.8 (Update Product ID: 091-93892) Safari Technology Preview allows users to get a sneak peek at upcoming web technologies in macOS and experiment with these technologies in websites and extensions. AppleConnect is a single-sign-on software that allows Apple employees to authenticate with Apple's internal directory service, unlocking access to the Apple network and diagnostic software. August 1, 2018: We are releasing NFS Manager version 4.51. The following items have been updated: Added further preliminary support for future versions of macOS. Users of macOS Sierra or macOS High Sierra don’t need this update. NFS Manager is an application to control the NFS features built into macOS via a comfortable graphical user interface. The application uses Apple’s technologies like Bonjour or Open Directory to make management as easy as possible. Older entries…"
