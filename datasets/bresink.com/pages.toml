["https://bresink.com/products-de.html"]
title = "Marcel Bresink Software-Systeme: Produkte"
description = """
Produktangebot Marcel Bresink  Software-Systeme"""
full_description = 'Software für macOS Möchten Sie prüfen, ob Sie die neuesten Versionen unserer Anwendungen nutzen? Verwenden Sie einfach den Menüpunkt Nach Aktualisierungen suchen in jedem Programm oder schalten Sie dessen automatischen Update-Check ein. Oder noch besser, verwenden Sie Bresink-Software-Updater, um unsere Software-Produkte automatisch überprüfen, herunterladen und aktualisieren zu lassen. Für eine manuelle Prüfung können Sie auch die Versionsübersicht nutzen. TinkerTool System 9 TinkerTool System 9 ist eine Sammlung von Systemwerkzeugen, die Ihnen dabei hilft, fortgeschrittene Verwaltungsaufgaben auf Macintosh-Computern zu erledigen. Das Programm macht von einer selbstanpassenden Bedieneroberfläche Gebrauch, die sich automatisch auf das Computermodell und die Version von macOS, die Sie verwenden, einstellt. Alle verfügbaren Auswahlmöglichkeiten sind über „Einstellungskarten“ verfügbar, ganz ähnlich wie beim Programm Systemeinstellungen. Alle Funktionen werden von einem einzelnen Fenster aus gesteuert, das es Ihnen erlaubt, das Programm als allgemeinen Werkzeugkasten und Erste-Hilfe-Assistenten zu verwenden. Mehr Informationen … TinkerTool System 8 TinkerTool System 8 ist eine alternative Version von TinkerTool System, entwickelt für die Betriebssysteme macOS 13 Ventura und macOS 14 Sonoma, wobei deren jeweiliger Funktionsumfang berücksichtigt wird. Mehr Informationen … Außerdem weiterhin verfügbar für Betriebssysteme, die von Apple nicht mehr unterstützt werden: TinkerTool System 7 (für macOS 11 Big Sur und macOS 12 Monterey) TinkerTool System 6 (für macOS 10.14 Mojave und macOS 10.15 Catalina) TinkerTool TinkerTool ist ein Anwenderprogramm, das Ihnen den Zugriff auf zusätzliche Einstellungswerte ermöglicht, die Apple in macOS eingebaut hat. Dies erlaubt es, versteckte Funktionsmerkmale des Betriebssystems und einiger mitgelieferter Programme zu nutzen. Das Tool stellt jeweils sicher, dass sich die Änderung von Einstellungswerten nur auf den aktuellen Benutzer auswirkt. Das Programm ändert niemals Komponenten des Betriebssystems, so dass Ihr Computer keinem Risiko ausgesetzt ist und sich bei System-Updates keinerlei Einschränkungen ergeben. Mehr Informationen … Backup Server Control Backup Server Control stellt eine grafische Oberfläche dazu bereit, einen Server zur netzbasierten Time Machine®-Datensicherung mit wenigen Mausklicks auf einem Macintosh® einzurichten und zu verwalten. Andere Macs, die macOS Sierra oder höher verwenden, können Datensicherungen auf dem Time Machine-Server durchführen. Der aktuelle Zustand der Netzwerk-Sicherungen kann jederzeit eingesehen werden. Ein Time Machine-Server auf einem Mac kann sehr leistungsfähig sein. Er ist einfach zu handhaben und bietet eine gute Skalierung. Durch Hinzufügen weiterer Festplatten kann der Dienst jederzeit weiter ausgebaut und an aktuelle Erfordernisse angepasst werden falls nötig, wenn mehr Daten oder mehr zu sichernde Computer hinzukommen. Mehr Informationen … Autostarter Autostarter ist eine kleine App, mit der es möglich ist, auch in macOS Ventura oder höher Programme automatisch nach dem Anmelden zu starten, ohne dass diese Programme Fenster einblenden. Damit kann diese sehr beliebte Funktion auch weiterhin benutzt werden, auch wenn diese mit der Einführung von macOS 13 weggefallen ist. Dabei erreicht Autostarter die hohe Zuverlässigkeit, wie sie früher aus Mac OS X 10.2 Jaguar bis Mac OS X 10.6.8 Snow Leopard bekannt war. Die App kann die Funktion „Anmeldeobjekte“ für den Start von Programmen vollständig ersetzen. Mehr Informationen … Systemmonitor Möchten Sie wissen, welche Teile Ihres Computers gerade beschäftigt sind? Möchten Sie die aktuelle Leistung Ihrer Festplatte und Netzwerkanschlüsse überwachen? Möchten Sie die Anzahl der Schreibzugriffe auf Ihre wertvolle SSD im Auge behalten? Möchten Sie sehen, welche Platten gerade im Ruhezustand sind? Sind Sie ein PC-Switcher, aber Sie vermissen die flackernden Aktivitätslämpchen für Platten und Schnittstellen an Ihrem Mac? Aber Sie möchten all das unaufdringlich erreichen, im typischen Mac-Design, ohne Bildschirmplatz zu verschwenden? Dann dürfte Systemmonitor eine sehr interessante App für Sie sein. Mehr Informationen … Battery Monitor Immer mehr Computer werden heute als mobile Geräte eingesetzt. Wichtigste Voraussetzung für einen tragbaren Computer ist ein Akku, eine aufladbare Batterie, die das Gerät mit Strom versorgt. Akkus sind nicht gerade billige Verschleißteile, deren Lebensdauer durch sorgsame Behandlung optimiert werden sollte. Battery Monitor ist ein kleines Hilfsprogramm, das in diesem Zusammenhang nützlich ist. Es bietet folgende Funktionen: Anzeige des Ladezustands im Dock, Anzeige der internen Akkudaten, Erfassen der Lade- und Entladekurven, Buchführung über die Alterung des Akkus. Mehr Informationen … Mac Power Monitor Mac Power Monitor ist eine grafische, einfach zu bedienende Oberfläche für die Energie- und Leistungsmessfunktionen von macOS. Eine Vielzahl statistischer Auswertungen kann abgerufen werden, wie Leistungsübersicht, Prozessstatistiken, Interrupt-Verteilung, Daten der Prozessorkerne und vieles mehr. Die Daten können entweder live mit einer Rate von 1 Messung pro Sekunde, oder als Einzelmessung mit einer beliebigen einstellbaren Messdauer ab 1 Millisekunde erfasst werden. Mehr Informationen … JPEG Photo File Date Haben Sie in der Vergangenheit schon einmal die Zeitangaben für Erstellung oder Änderung von JPEG-Fotodateien verloren? So dass Sie nicht mehr den Finder als simples Werkzeug verwenden können, um Fotos nach Datum zu sortieren, oder schnell abzuschätzen, wann ein Foto aufgenommen wurde? Dies ist ein gängiges Problem, das oft durch Fehler in Vorschauprogrammen oder bei der Cloud-Synchronisation verursacht wird. Die kleine App JPEG Photo File Date kann in diesem Fall zu Hilfe kommen: Sie kann die Metadaten einer JPEG-Fotodatei auslesen, wann das Bild aufgenommen wurde, und die Dateieinstellungen für "erstellt" und "geändert" entsprechend reparieren. Auch große Mengen von Bildern, wie Ordnerhierarchien mit mehreren Zehntausend Fotos, lassen sich schnell ohne Probleme verarbeiten. Mehr Informationen … Sync Checker Sync Checker ist dazu gedacht, zu überprüfen, ob zwei Ordner oder Volumes perfekt synchronisiert sind, d.h. ob sie genau den gleichen Inhalt tragen. Testen Sie, ob Ihre Datensicherungs- und Synchronisierungsprogramme richtig arbeiten, finden Sie heraus, an welcher Stelle zwei macOS-Installationen sich unterscheiden, prüfen Sie, ob Ihr Web-Server die letzten Aktualisierungen Ihrer Web-Seiten erhalten hat: Es gibt viele Situationen, in denen Sync Checker wirklich hilfreich ist. Falls Dateibestände nicht synchron sind, hilft Ihnen Sync Checker dabei, durch die sich unterscheidenden Punkte zu blättern und analysiert exakt, wo eine Abweichung aufgetreten ist, bzw. ob die Unterschiede kritisch oder vernachlässigbar sind. Ebenso können Sie zusätzlich einen Bericht über das Ergebnis in Textform erstellen, der gedruckt oder exportiert werden kann. Mehr Informationen … NFS Manager NFS Manager ist eine grafische Benutzerschnittstelle zur Steuerung aller in macOS eingebauten NFS-Funktionen. Das Programm kann ein verteiltes NFS-Dateisystem auf einem ganzen Netzwerk von macOS-Computern mit wenigen Mausklicks einrichten. NFS (Network File System) ist der Industriestandard zur gemeinsamen Nutzung (Sharing) von Dateien in UNIX-Systemen wie macOS. Jedes macOS-System kann als NFS-Server eingerichtet werden, um im Netz Dateien anzubieten, oder als NFS-Klient auf Dateien zugreifen, die von anderen Computern freigegeben wurden. Im Unterschied zu anderen Dateiserver-Protokollen, die in macOS eingebaut sind, hat NFS keine Beschränkungen in der Anzahl der Benutzer oder Verbindungen, die gleichzeitig aktiv sein dürfen. Zusätzlich kann NFS eingerichtet werden, Verbindungen zu Servern vollautomatisch herzustellen („Autoaktivierung“), ohne dass Kennworteingaben nötig sind. Mehr Informationen … PrefEdit PrefEdit ist ein Programm, das fast alle Aspekte des Einstellungssystems (Systemeinstellungen, „Präferenzen“) verwalten kann, das in jeder macOS-Installation vorhanden ist. Das Programm besteht aus drei Komponenten, die eng miteinander verflochten sind: Einem Betrachter und Editor für die macOS-Einstellungsdatenbank, einem Betrachter und Editor für macOS-Eigenschaftslistendateien (Property Lists, „plists“) und einem Betrachter für Einstellungsmanifestdateien. PrefEdit war der erste Einstellungseditor, der für Mac OS X veröffentlicht wurde. Mit seiner langen Erfahrung und Marktreife gehört er heute zu den am weitesten fortgeschrittenen Managementprogrammen für macOS-Einstellungen. Mehr Informationen … PropEdit PropEdit ist ein Betrachter und Editor für Apples Eigenschaftslistendateien (Property Lists, „plist“) und strikte JSON-Dateien (JavaScript Object Notation). Es richtet sich sowohl an Software-Entwickler als auch an Endbenutzer, die einfachen Zugriff auf plist- und JSON-Dateien haben möchten. XML-basierte und binäre plist-Dateien werden unterstützt. Beim Schreiben von JSON-Dateien können Sie zwischen einfach lesbaren oder sehr kompakten Dateien wählen. Falls technisch machbar, können beide Dateitypen in beide Richtungen hin- und hergewandelt werden. PropEdit kann als vereinfachte Version von PrefEdit angesehen werden, optimiert für die technischen Beschränkungen des Mac App Store. Mehr Informationen … Bresink-Software-Updater Wenn Sie viele unserer Software-Produkte auf Ihrem Mac einsetzen, kann es mühsam sein, sie immer auf dem neuesten Stand zu halten. Bresink-Software-Updater erleichtert die Pflege unserer Programme erheblich. Auf einen Blick können Sie sehen, ob alle Programme auf dem aktuellen Stand sind. Alle notwendigen Schritte, wie das Herunterladen, die Sicherheitsüberprüfung und das Kopieren an die gewohnte Stelle auf Ihrem Computer können in kürzester Zeit durchgeführt werden. Mehr Informationen … SystemLoad SystemLoad ist ein Diagnoseprogramm, das Ihnen dabei hilft, Probleme mit der Kühlung oder Netzteilen von Apple Macintosh-Computern zu erkennen. Das Tool setzt einen oder mehrere Prozessoren einer vom Benutzer definierbaren Last aus. Dies kann dabei helfen, die folgenden Situationen zu diagnostizieren: Probleme mit dem Kühlungssystem oder Temperatursensoren, Probleme mit Zwitschergeräuschen durch schwingende Bauteile in der Spannungsversorgung, die bei bestimmten Computermodellen auftreten können, Probleme mit Akkus von tragbaren Computern. Mehr Informationen …'
author = "Marcel Bresink"
