["https://bresink.com/osx/300863620/history.html"]
title = "TinkerTool System 6: What's new?"
description = "Product history for TinkerTool System 6"
full_description = "What's new? TinkerTool System 6 Version History Version 6.995 (Build 220607) Added new feature to resolve a known issue with the software update feature of macOS. It is now possible to reset Apple’s software updater in cases where the user interface of System Preferences shows an endless wait status when the user tries to search for the latest security updates. Version 6.99 (Build 220511) The user interface for registration was revised. The application can now offer automatic re-registration after it has been migrated to a new computer. Fixed a problem where exporting the list of orphaned files may not have worked as expected. Minor modernizations and adjustments. Version 6.99 (Build 211227) This version fixes a problem where the startup job overview might not have reflected the true status of system launch agents under all conditions. Minor modernizations and price adjustment. Version 6.99 (Build 210721) This versions fixes a problem where the stop button may not have worked when trying to cancel a privileged operation that had already been running for a considerable time. Version 6.98 (Build 210427) Added support for Security Update 2021–003 for macOS Mojave and Security Update 2021–002 for macOS Catalina. Added new feature for users of upgrade licenses: An administrator who activated the application via a upgrade registration file can now create a “single-step ticket” that combines the information about the upgrade license and the license for a prerequisite product into one file. This file can be used to re-register the application in a single step without having to prove upgrade eligibility again, e.g. when migrating to a new computer. The application uses more detailed error messages if removing a bad startup job fails for some reason. Fixed a problem where candidates of software components pre-selected for deletion by the Uninstallation Assistant have been shown with type information in the wrong language. User guidance for evaluation mode uses better wording in the English user interface. Version 6.97 (Build 210209) Added new internal feature to allow normal users to check, remove and re-apply Access Control Lists for file system objects they own. This makes it possible that non-administrative users regain permission to deactivate, reactivate, or delete their personal caches if the cache folders use Apple’s recommended default permission settings. Version 6.96 (Build 210115) Communication with slow components of macOS in the background could sometimes be misinterpreted as alleged “hang” of the application. To avoid this, many user interface elements to control features of Time Machine, Spotlight, and CUPS have been changed over to asynchronous behavior. TinkerTool System will no longer wait for immediate response of macOS, but temporarily disable the affected controls until the corresponding operations have completed. This version fixes a problem with the creation of install media where installer apps of macOS 11 could be shown as invalid after such an app had been launched and quit in the same user login session. Version 6.95 (Build 201214) Added support for the 4th generation of the System Management Controller used in the latest Mac models. The quick help feature was revised completely with updated links to new web pages of Apple that contain additional information on certain support and maintenance topics. Communication with external programs was optimized, especially regarding possible error situations, which could otherwise result in memory leaks, file handle exhaustion, or unexpected program termination. Version 6.94 (Build 201111) This version is aware of TinkerTool System 7 and the release of macOS 11.0 Big Sur. Version 6.93 (Build 201007) The security feature that protects critical files has been modernized to respect recent changes in macOS. Added a new workaround and documentation for macOS defects that can cause Time Machine maintenance features to fail if the backup is network-based. Added a feature to detect broken versions of the installer application of macOS Sierra which are not capable of creating installation media. Apple has officially withdrawn any assertions that the Sierra 10.12.6 installation app is capable of performing this operation and TinkerTool System has been updated accordingly. Fixes a problem where the APFS pane is not shown or not updated correctly when attaching a disk containing a volume with future APFS features that is considered invalid by the running operating system. Fixes a problem where items in the table of privacy settings for applications may not have been translated to the user’s preferred language if running macOS Mojave. Version 6.92 (Build 200910) Added SIP-protected startup option to control how a non-maskable interrupt (NMI) can be triggered. The settings and their description regarding start of the macOS remote kernel debugger have been clarified. The startup option to control how kernel panic messages should be shown was removed, because the underlying feature is no longer implemented in modern versions of macOS. Fixes a problem where network-based backups of Time Machine could not be selected for re-association with a volume if macOS Catalina was used. Fixes a packaging issue which could cause the quick help page for the ACL ID-Finder feature not to be shown. Includes the “build 200813 hotfix” which corrected minor issues with the user interface of version 6.91 for product activation. This affects remembering the position of the registration window, double-clicking a registration file, and the processing of manually entered prerequisite data for upgrade licenses. Version 6.91 (Build 200804) Added preliminary support for creating installation media for and with macOS 11. Added support for detecting features of future APFS implementations. In specific situations, communication with Time Machine now runs in the background, so the user interface is more responsive even when using slow Time Machine devices. The accessibility has been further optimized by more than 800 changes in the user interface, especially for users of VoiceOver. The instructions for the emergency tool have been revised, taking into account the latest versions of the macOS Recovery operating system. Parts of the user interface for product activation and registration management have been redesigned. Version 6.9 (Build 200702) This version adds preliminary support for future operating systems. Version 6.89 (Build 200527) This version adds support for macOS 10.14.6 Build 18G5033 (Security Update 2020–003): Because Apple intentionally sabotaged the operating system feature to ignore the macOS Catalina update in macOS Mojave, the corresponding settings have been removed. Added notification to suggest removal of the system setting to ignore the macOS Catalina update after an upgrade to macOS Catalina has been performed. Added a workaround for layout issues in some status displays for physical hard disks when working with specific third-party drives that provide excessively long serial numbers with more than 80 digits. Added a workaround for an issue with the authentication user interface of macOS where the system only showed an undocumented “ACMContextVerifyPolicyEx” error message. Version 6.88 (Build 200427) This version resolves a compatibility issue between the startup setting “Use special OS for next start: Recovery system” and specific firmware or Recovery OS versions: On some systems, the one-time setting remained permanently effective until clearing the parameter RAM. If you don’t use this option of the startup setting, you won’t need this update. Version 6.87 (Build 200422) Added new feature to clear the staging area macOS uses to collect kernel extensions that wait for approval or denial by the user. This function is available at the tab item to clear the kernel extension cache. Added new feature to control the protected kernel option which disables processor-assisted support for Virtual Machines. This can help to avoid crashes of macOS Catalina when copying large amounts of data. The launch limit for unrestricted product evaluation without license has been increased by one, because macOS may relaunch the application to update its privacy settings. Six (6) launches per computer are permitted now. The application now accepts that the user provides a custom icon. Log files for kernel panics are now shown in a more readable fashion if macOS has stored them with embedded reports in JSON formats. Fixed a problem where Time Machine storage statistics reports could be shown with swapped lines and without a summary. Fixed a problem where the storage gain summary could sometimes show wrong numbers after Time Machine snapshots have been deleted. Fixed a problem where the display of the system’s stored setting for handling trim commands on third-party AHCI SSDs could be wrong with some OS versions while the live policies for each affected drive were shown correctly. Version 6.86 (Build 200323) Added support for macOS Catalina 10.15.4 and later. Note that previous versions of TinkerTool System are not compatible with this operating system version. Added a separate, fully resizable APFS overview window. This is helpful when performing complex APFS operations affecting multiple partitions or disks. Added percentage values to the Storage Space overview feature. Added new workarounds for continuing defects in macOS that can cause the system to lose preference and Resume settings when the user logs out too fast. The dialogs that indicate that the user must be logged out to continue a pending maintenance operation have been redesigned. Version 6.85 (Build 200218) Added new feature to enable the classic startup chime on selected Macintosh model series released after summer 2016. Added new startup option to select special maintenance systems for the next restart. The Recovery OS, Internet Recovery, Apple Diagnostics, and Apple Diagnostics via Internet are available. Added new option to add available “signpost” information for software developers when retrieving log data from the operating system. The Startup pane was redesigned to consume less space on small screens. The Info pane was redesigned to consume less space on small screens. Internal diagnostic features have been optimized. Communication with the privileged component supports new features to ensure that data is processed in the correct order even under critical situations with high system load or strongly parallelized operations. Corrected a problem where some lines of log reports could be partially damaged or would appear in the wrong order. Version 6.84 (Build 200117) The user interface to present the hierarchy of APFS objects was enhanced. The privacy protection warning that is shown when the user has not yet given consent for Full Disk Access by the application is now highlighted more prominently. Error messages and error handling have been optimized to better differentiate between the reasons of access failures caused by System Integrity Protection, privacy approval, user permissions, or other issues. This version adds a workaround for an ambiguity that could cause an incorrect display of production dates for Macintosh model series that have up-to-date operating system support for more than 10 years. This version fixes a problem where macOS may have refused to clone an APFS volume group if it was part of a container with multiple volume groups. Corrected a problem where resetting privacy settings did not work for all categories when using specific versions of macOS Catalina. The application now adds specific user guidance when resetting a privacy category that has influence onto the application itself. Version 6.83 (Build 191211) Added new feature to get an overview on all details about the current APFS configuration, presenting the relationships between containers, physical disks, volume groups, and volumes. Added new feature to show the complete list of APFS snapshots on a volume. Added new feature to remove some or all APFS snapshots from a volume. Added new feature to copy APFS containers, volume groups, volumes, or snapshots by fast replication. (Only available for macOS 10.15 Catalina or later.) Added new feature to safely delete Time Machine snapshots from an active backup. Added new features to safely delete Time Machine snapshots, backup sets, or all Time Machine data from local disk drives. Added new user interface to show outstanding privacy approvals. If necessary, a missing approval will now be directly visible in the toolbar of the control window. This avoids that the application has to attempt a possibly failing operation before it can indicate a policy conflict to the user. Added new feature to create an optional text report when finding orphaned objects on a volume. The features to prevent volumes from automatic mounting or program execution will now additionally support invisible but mounted data volumes of non-running Catalina installations. This is helpful for users that have multiple copies of macOS Catalina installed. (Only necessary for macOS 10.15 or later.) The Info pane now supports retrieval of details about the Apple T2 processor in addition to the original iBridge system. The user interface has been modified accordingly. Printing the instructions for launching the emergency tool in recovery mode will now automatically resize the output to the printer’s paper size to make sure the instructions are fully readable and not clipped. User guidance for changing file permission settings has been redesigned for cases where the operating system cannot fully support permissions. The application now adds warnings about possible APFS bugs affecting the handling of automatic ACL permission inheritance. Version 6.82 (Build 191114) The check for slow system startup due to cleared NVRAM settings was modified in order not to cause false alarms on specific Mac Pro models. The check for correct communication with the security component was modified in order not to cause false alarms when the application was launched under extreme overload conditions. Added a fix for an issue with macOS 10.15.1 that could cause the warning for a missing user-based approval for full disk access not to be shown under specific conditions. Added a fix for an issue that could cause volumes with HFS+ format not to be offered for specific features of the System pane. Clarified the meaning of the “dark wake” startup option in the user interface and in the reference manual. Version 6.81 (Build 191030) Added support for macOS 10.15.1. Added new feature to save the report on startup jobs into an RTF text file. Added new feature to download selected macOS installer apps provided by Apple without using the App Store (macOS Catalina only). Added new feature to suppress update notifications regarding macOS Catalina and the associated Dock reminder marker (macOS Mojave only). Added new feature to change the user account security policy for Remote Apple Events "
