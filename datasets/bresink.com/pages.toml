["https://bresink.com/osx/300423785/issues.html"]
title = "Sync Checker: Notes"
description = "Technical notes for Sync Checker"
full_description = "Sync Checker Known Issues The are currently no known problems that require additional documentation. Release Notes Apple’s approval feature for integrating security components is very immature: With macOS 13 Ventura, Apple introduced a new procedure that requires administrators to use System Settings to control whether to allow an application to install login items on the system or to let a program launch a privilege separation utility at the same time when the main application starts. These functions are immature and are affected by numerous technical defects. This can have influence on Sync Checker, since for security reasons, it always uses the most modern form of privilege separation that a macOS version dictates. Among other things, there are the following issues: (A) Apple incorrectly suggests that Sync Checker would add an always-running background service: In the System Settings application, Apple states that Login Item permissions are required for background items that apps add “to perform tasks when the application isn’t open.” This description is incorrect or incomplete. Permission is also required for programs like Sync Checker that increase security through privilege separation by running a helper program only when the main program is open. Workaround: We have notified Apple of this bug and hope it will be fixed in future versions of macOS. (B) Network administrators cannot grant the necessary permission at the start of the program, but only via System Settings: When starting Sync Checker for the first time, macOS shows a notification that allows administrators to permit Sync Checker to run a privilege separation utility. This must be confirmed with an administrator’s password. However, password entry only works for locally set up administrator accounts, not for network administrator accounts. Workaround: We have notified Apple of this bug and hope it will be fixed in future versions of macOS. As a workaround, grant permission via System Settings > Login Items > Allow in the Background and not via the notification. (C) If you store multiple copies of Sync Checker on your computer in an unusual way, macOS service management may be overwhelmed: Current versions of macOS are not designed to handle situations where multiple copies of Sync Checker can be found on your computer. (Copies in Time Machine backups do not count.) Workaround: Only store one copy of Sync Checker on your computer. (D) Handling of Background Items does not work in macOS 13.1: If you are using macOS 13.1, many features of the user interface to approve Background Items just don’t work at all. Workaround: Apple has confirmed this to be a known defect of macOS 13.1. We recommend to use at least macOS 13.3.1 or later."
author = "Marcel Bresink"
year_published = 2025
