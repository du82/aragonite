["https://bresink.com/Blog/2025/blog-2025-01.html"]
title = "Blog - Archived Entries - January 2025"
description = """
Blog Marcel Bresink  Software-Systeme - Archived Entries - January 2025"""
full_description = 'Blog - Archived Entries - January 2025 The latest news are listed first. See more latest news from the current blog. January 31, 2025: We are releasing System Monitor version 6.2 through the Mac App Store: Integrity and license checks have been modernized to remain compatible with the latest versions of macOS. For this reason, support for macOS 11 and 12 had to be removed. The minimum required operating system version is now 13.5. Modernized organization of language support files. The reference manual adds information about temperature sensor selection on Macs with M4 processors. (For installations together with System Monitor Plus.) System Monitor is an application for the menu bar of macOS, designed to inform you unobtrusively about the activity of your computer. A Trial Version is available as free download. January 29, 2025: Apple releases new software via macOS Software Update: Apple XProtect Configuration Data version 5286 for OS X 10.11 to macOS 10.14 (Update Product ID: 072-70369) Apple XProtect Configuration Data version 5286 for macOS Catalina (Update Product ID: 072-70368) XProtect is part of the built-in antivirus software of macOS. The package does not appear in the Software Update section of System Preferences (or App Store in older versions of the operating system). macOS is updating the software automatically in the background if you have granted the system permission to download system data files and security-related files. January 27, 2025: Apple releases new software via macOS Software Update: macOS 15.3 Sequoia macOS 15.3 Sequoia Update for macOS 10.12 and later (Update Product ID: 072-08251) macOS 14.7.3 Sonoma (Update Product ID: 072-61299) macOS 13.7.3 Ventura (Update Product ID: 072-61270) Safari 18.3 for macOS Sonoma (Update Product ID: 072-37131) Safari 18.3 for macOS Ventura (Update Product ID: 072-37121) BridgeOS Customer Update 15.3 (Update Product ID: 072-08253) The updates address critical security issues in the operating systems and web browsers. January 27, 2025: We are re-releasing TinkerTool version 10.1: Added new setting to change the spacing between Status Items in the menu bar (icons indicating state information at the top right-hand side). The setting is shown on the Desktop pane. TinkerTool is an application that gives you access to additional preference settings Apple has built into macOS. This allows to activate hidden features in the operating system and in some of the applications delivered with the system. January 22, 2025: We are releasing TinkerTool System 9 version 9.3: The list of Macintosh model series shown when downloading components to create macOS installation media has been updated. The interface of the control pane to protect user data against iCloud access has been slightly redesigned. This should prevent users from mistakenly locking iCloud features in the active (“on”) state. This versions adds a workaround for an issue in some versions of macOS where flash storage and SSD health supervision mistakenly monitor the magnetic disk parts of Fusion Drives. Some technical details have been updated in the reference manuals. TinkerTool System 9 is a collection of system utility features helping you in performing advanced administration tasks on Apple Macintosh computers. January 22, 2025: We are releasing TinkerTool System 8 version 8.98: The list of Macintosh model series shown when downloading components to create macOS installation media has been updated. The interface of the control pane to protect user data against iCloud access has been slightly redesigned. This should prevent users from mistakenly locking iCloud features in the active (“on”) state. This versions adds a workaround for an issue in some versions of macOS where flash storage and SSD health supervision mistakenly monitor the magnetic disk parts of Fusion Drives. Some technical details have been updated in the reference manuals. TinkerTool System 8 is a collection of system utility features helping you in performing advanced administration tasks on Apple Macintosh computers. January 21, 2025: We are releasing PropEdit version 1.1: This version is capable of preserving the sort order of keys in JSON objects (dictionaries). When trying to open invalid JSON files, the first detected syntax error will now be shown in detail. The strict limitation not to support “JSON fragments” (files that have a scalar value, not embedded in an array or dictionary at the top) has been lifted. The application can now open JSON5 files that use the “\x” escape notation to specify Latin characters via two hexadecimal digits. The application can now open JSON5 files where specific notations for floating point numbers use more leading zeros than necessary. Fixes a problem where specific warning dialogs may have been suppressed when opening invalid files. This version adds an optimization to detect whether started edit operations actually change a property list value or not. This detection can avoid that macOS triggers aggressive autosave operations when users perform a non-modifying edit operation, just as copying a value to the pasteboard, for example. PropEdit is a viewer and editor for Apple property list files (“plist”) and JSON files (JavaScript Object Notation). It is aimed to both software developers and end-users who want easy access to these standard file types. January 14, 2025: Apple releases new software via macOS Software Update: Apple XProtect Configuration Data version 5285 for OS X 10.11 to macOS 10.14 (Update Product ID: 072-60141) Apple XProtect Configuration Data version 5285 for macOS Catalina (Update Product ID: 072-60142) XProtect is part of the built-in antivirus software of macOS. The package does not appear in the Software Update section of System Preferences (or App Store in older versions of the operating system). macOS is updating the software automatically in the background if you have granted the system permission to download system data files and security-related files. January 6, 2025: We are releasing Mac Power Monitor version 2.81: This version has been made more robust against issues with specific versions of macOS, where the power metric features of the operating system could return strange error messages although the measurement worked correctly. The likelihood for such problems was particularly high when collecting one-shot measurements on Intel-based Macs with only the power overview selected. Small corrections for the German user interface. Internal diagnostics have been optimized. Mac Power Monitor is a graphical, easy-to-use interface for the energy and power measuring features of macOS. Older entries…'
