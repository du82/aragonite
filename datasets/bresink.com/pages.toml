["https://bresink.com/privacy.html"]
title = "Data Protection Notice"
description = """
Bresink Software Web Site: Data  Protection Notice"""
full_description = '''Data Protection Notice How we respect and protect your privacy The protection of your personal data is very important to us. We treat your personal data confidentially and in accordance with the law and this privacy policy. The following text describes in an easy-to-understand way what happens with your data during individual business transactions and when using this website and why we collect the data. We also inform you about your rights under applicable data protection law. Who are we? Responsible for processing the data is: Dr. Marcel Bresink Software-Systeme Ringstr. 21 56630 Kretz GERMANY E-Mail: osxinfo@bresink.com During which operations do we process your data? Visiting this website Sending data to this website using a form Purchasing a software license through PayPro Global Purchasing a software license through Apple's App Store Purchasing goods or services from us Unlocking a software license purchased from PayPro Global Activating evaluation mode for testing a software product By clicking onto one of the above items you can jump immediately to the operation that is of interest for you. Who gets the data? We never share your personal information with third parties except in the following cases: There is a legal obligation to share your personal information, such as when law enforcement or judicial authorities such as courts, prosecutors or police force us to do so. A technical service provider who acts explicitly on our behalf helps us to process the data, for example when using an external provider's web server to provide a reliable, globally accessible Internet presence. In doing so, we only use those service providers who are contractually obliged to ensure the protection of your data in accordance with the provisions of this data protection statement. If personal data has to be transferred over the Internet, the data will be encrypted during transmission to ensure that unauthorized persons cannot gain direct access to the data. What rights do you have regarding the processing of this data? You can ask us for information about which personal data we process about you. You have the right to receive this data in a common computer format. If the data is not (or no longer) accurate or incomplete, you may request that the data be corrected or supplemented. If the data is no longer needed for the above purposes or if you object to processing and there are no longer reasons for processing, you may request the immediate deletion of your personal information. This also applies if it turns out that the data was processed unlawfully or may no longer be processed because of other legal requirements. For inquiries or objections, please use the contact information specified at the beginning. In addition, you have the right to lodge a complaint with an affected supervisory authority of the European Union (in Germany, for example, the State Data Protection Commissioner of your state) about the processing of your data. The overall supervisory authority in charge for our location is: The State Commissioner for Data Protection and Freedom of Information Rhineland-Palatinate Hintere Bleiche 34 55116 Mainz GERMANY Phone: +49 (0) 6131 208-2449 Fax: +49 (0) 6131 208-2497 Email: poststelle@datenschutz.rlp.de Protection of Children The operations and services listed below are not directly targeted to children. If these services are used by children nevertheless, we assume that the consent of a parent or guardian has been obtained, or that the child has already reached the minimum age in the respective country to enter legally binding agreements regarding the respective service. If you believe that we have received data about a person protected under child protection laws where necessary parental consent was not obtained, please notify us immediately, and we will take reasonable steps to securely erase that data. Visiting this website What data is processed? Use of our website is usually possible without providing personal information. As far as personal data (for example your name) is collected, this always takes place on a voluntary basis as far as possible. We avoid the use of cookies. Cookies are small text files that are stored on your computer and are managed by your web browser. Only in few, isolated cases, we use cookies for technical reasons when it is important to recognize that you are using some of our web pages in the same context, for example, when you like to place an order for a product on web page A and another product on web page B together in a single request. These cookies are not used to identify you as a person or to track your use of our website on the long term. When you access a page of our website, the following data may be collected: Type and version of your web browser Type and version of your operating system the Internet address of the accessed page the Internet address of the page that referred to the accessed page date and time of page retrieval technical information as to whether the retrieval of the page was trouble-free In some cases, the following data of your web browser can be requested when presenting a web page: the language you prefer the playback media you are using, e.g. a computer screen of a certain size All aforementioned items collected during page request are not personal. For reasons of security and to protect the transmission of confidential content, such as requests you send to us, the website may, if desired, use SSL encryption. An encrypted connection can be recognized by a lock symbol in the address bar of the web browser. If SSL encryption is enabled, the data you submit to us can not be read by third parties. Why do we process this data and based on which laws? How long will the data be stored? In individual cases, cookies are used to recognize that views of different pages on our website belong together. In these cases, we tell your web browser to delete the cookies after 24 hours at the latest. Logs for the retrieval of pages are required to ensure flawless technical operation of the web site. This data will be deleted after 178 days at the latest. Data for the presentation of web pages are processed only for the delivery of the respective page, but not stored any further. Since the data are only processed if necessary for technical reasons, and we inform you about the use of this data, the processing is legal under the General Data Protection Regulation of the European Union. Sending data to this website using a form What data is processed? If you send us data via a form on this website, we will process all data entered in the form. You can recognize a form by having input fields and a ”Submit“ button below the input fields. As general rule, the specification of all data is voluntary. Only if the natural purpose of a form is to send us a request for which certain data fields are necessary, it will be required to complete these fields. For example, if you send us a question, we will need an address to send you an answer. Required fields are marked accordingly. We point out that we process data of children only in the case when data about a child are sent to us via a form. When transmitting over the Internet, the data sent by you are always encrypted, so that they can not be read by third parties. Why do we process this data and based on which laws? How long will the data be stored? Submitting data via a form to us is only at your own initiative and in your own interest, usually linked to a request or question. If you are asked to provide your name, the name will be used to politely respond to you and to check if your request relates to an existing contract with you. If you are asked to provide your postal address or e-mail address, this information will be used to respond to your request. Further personal data will only be processed if this is necessary to fulfill the request sent by you in the sense of the form. Since the data will only be processed if you provide them yourself and this is necessary, since we inform you about the use of this data, and you must agree beforehand with their use, the processing is legal under the General Data Protection Regulation of the European Union. The data is stored for an indefinite time. Purchasing a software license through PayPro Global What data is processed? If you purchase a license for one of our software products from the reseller PayPro Global, any data you provide to the merchant with this order will be forwarded to us and processed by us. This can include base information about your payment, e.g. what type of credit card you have chosen and what type of risk is associated with that payment. However, this does not include security-critical data about your payment, such as full credit card or bank account numbers, for example. What exact data is acquired and how this data is processed is at the discretion of the merchant and governed by their own privacy policy. This also applies to the use of cookies. Our Internet presence and the Internet presence of the retailer are separated by optical means and explicit notes, so that you can recognize the scope of the respective data protection measures. Why do we process this data and based on which laws? How long will the data be stored? Your name and information about the products you have purchased will be collected in order to issue a personalized license (“Registration”) and to enter a valid license agreement. The name is also used to identify you as a customer, for example, when a lost registration is to be recovered. This is done in your interest. The order number of PayPro Global is recorded in order to be able to clearly assign your order in case of later clarification. Among other reasons, this is necessary for proper accounting. Your address, in particular the country of delivery is recorded because it is required by law, to control the correct calculation of VAT, sales taxes or similar taxes, to verify compliance with export regulations for high technology products. In the case of business customers from the European Union, the European VAT registration number is also recorded in order to check the legality of a VAT-free delivery (VAT Reverse Charge). Your e-mail address will be recorded in order to send you an additional backup copy of the license data. This will be in your interest if the download of the registration file fails for technical reasons. Other contact details, such as telephone or fax numbers, can be voluntarily provided by you in order to be able to provide you with the license data, even if you have provided an invalid e-mail address for delivery due to your own errors. This is done in your interest. We won't use this telecommunication data for any other purposes. Your preferred language setting will be processed to provide you with the data in a language you understand. The type of payment you choose will be used to assess whether or not we can arrange for PayPro Global to refund the purchase price, for example, in the case of an erroneous order. We point out that we process data of children only in the case when a software license is bought by or for a child. Without specifying the desired name for the license holder and the country of delivery, no license agreement can be concluded and we can not deliver a registration for activation of the software. These data are required to fulfill the purchase contract. With regard to the other non-voluntarily collected data referred to in this section, we are governed by German tax laws, the Commercial Code, European laws for Value-Added Tax, and the "Principles for the proper management and safekeeping of books, records and documents in electronic form and data access". In specific cases, the Foreign Trade and Payments Regulation applies additionally. For legal reasons, billing data must be kept for at least 10 years, other data about the transaction at least 6 years. Purchasing a software license through Apple's App Store If you acquire a license to use one of our software products from the retailer Apple Inc., or any of its affiliates using their "App Store" Internet service, we only process the fact that the particular software product has been delivered to a certain country. We don't process any further data. Purchasing goods or services from us What data is processed? If you buy a product or service directly from us, data will only be collected if this is necessary to fulfill the purchase contract or to issue a valid invoice. If it is necessary to deliver the goods by shipping or to provide a service at your place, your name and address will be processed. If it is necessary to contact you, further contact details such as telephone number and e-mail address can be processed. If it becomes necessary to refund you a payment, we will process the necessary payment data, for example a bank account. We point out that we process data of children only in the case when a product or service is sold by us to a child. Why do we process this data and based on which laws? How long will the data be stored? The data collected is required to fulfill the purchase contract. Processing data about this business incident is also required by law to comply with the Tax Code, the Commercial Code, the Value-Added Tax Law, and the "Principles for the proper management and safekeeping of books, records and records in electronic form, and data access". For legal reasons, billing data must be kept for at least 10 years, other data about the transaction at least 6 years. Unlocking a software license purchased from PayPro Global If you have purchased a digital software license (“Registration”) for one of our programs from PayPro Global, it will be necessary to enable this registration on your computer to allow the program to be fully unlocked, so that all its features become accessible. During this procedure, it is necessary that data from your computer is transmitted to us via Internet. What data is processed? Upon product activation, you will receive official confirmation that your purchased registration allows you to use this application on this computer. To do this, a short description of registration, program and computer has to be transferred to us. If you have complied with the terms of the signed license agreement, the application will receive a response that unlocks it. The following personal data will be sent to us: Your purchased registration: it contains the name of the future user whose name you have specified to become the license holder during purchase, as well as a sequence of letters and numbers that identifies the registration as being genuine. a unique identifier of your computer: this identifier is computed based on individual features of your computer, for example its serial number or address numbers of its network interfaces. The original numbers are made unrecognizable. The identifier can only be used to recognize a particular computer. However, it is not possible to retrieve the original numbers from the identifi'''
