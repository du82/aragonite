full_description = "What's new? Bresink Software Updater Version History Release 1.8 (Build 240208) This is a routine update that makes internal modernizations to the application: Support for macOS 10.14 Mojave and macOS 10.15 Catalina has been removed. Added new features for authorization of privileged operations. The application will now allow authentication of administrative users in additional special cases previously not permitted: authorization within a running login session of a non-administrator authorization by administrators with empty passwords in operating system versions that don’t block this generally authorization in cases where multiple users are logged in, but the affected user is not on the frontmost console session Administrators can return to the previous stricter authorization policies if needed. Modernized organization of language support files. Release 1.71 (Build 230221) Added new workarounds for the continuing quality problems of macOS 13. Release 1.7 (Build 221220) Added changes necessary for full compatibility with macOS 13.1 Ventura. Added more protection against operating system defects. The application also provides additional user guidance for these cases. Added protection against situations where the application is operated with a network firewall that doesn’t allow the necessary Internet connections. In specific cases, this could result in unexpected program termination instead of an error message. Release 1.6 (Build 221021) Added full support for macOS 13 Ventura. Release 1.5 (Build 220720) Code modernization and small changes in the user interface. Adds a workaround for a layout issue with some versions of macOS where table columns could sometimes be clipped. Release 1.4 (Build 211020) Added full support for macOS 12 Monterey. Support for macOS 10.12 Sierra and macOS 10.13 High Sierra has been removed. This version fixes a problem where the software updater could show partially incorrect instructions when it detected that third-party applications tried to damage the installation of the privileged helper utility. Release 1.3 (Build 201021) Added full support for macOS 11 Big Sur. Added feature to normalize the ownership of an updated application under specific circumstances. Added internal policy never to consider applications on file servers or inactive Time Machine volumes for automatic update. The application now accepts that the user provides a custom icon. Release 1.2 (Build 191118) Added new feature to automatically transfer macOS tags and Spotlight comments for each updating application from the old to the new version. Added new feature to show the file system paths of application copies as help tags in the table of found software products. Release 1.1 (Build 190816) Added support for future versions of macOS. Added support for self-updates of the updater. Enhanced display of release information if a newly available package is only a build update, not a version update. Fixed an issue where the Finder did not show the application name in expected spelling style, depending on the user’s language settings. Release 1.0 (Build 181214) First official version of Bresink Software Updater."
