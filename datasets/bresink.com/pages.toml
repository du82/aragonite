full_description = "Autostarter Autostarter is a small app that makes it possible to launch applications automatically during login without letting the applications show windows, even with macOS Ventura or later. This feature, which Mac users loved, can now still be used, although it had been dropped with the introduction of macOS 13. Here, Autostarter achieves the same high level of reliability that had been known from Mac OS X 10.2 Jaguar to Mac OS X 10.6.8 Snow Leopard. Autostarter can fully supersede the function “Login Items” for the launch of applications. The automatic start of other objects, for example server connections, can still remain in System Settings. In addition, Autostarter offers you the possibility to save the list of automatically starting applications into a file. This way a complete set of predefined settings can be transferred quickly to a different user or onto another Mac. The software is distributed electronically through Apple's Mac App Store."
