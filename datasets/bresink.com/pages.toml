["https://bresink.com/osx/PrefEdit-de.html"]
title = "PrefEdit: Beschreibung"
description = "Produktbeschreibung für PrefEdit"
full_description = "PrefEdit PrefEdit ist ein Programm, das fast alle Aspekte des Einstellungssystems (Systemeinstellungen, „Präferenzen“) verwalten kann, das in jeder macOS -Installation vorhanden ist. Das Programm besteht aus zwei Komponenten, die eng miteinander verflochten sind: - Ein Zugang zur Einstellungsdatenbank von macOS, mit Zugriff auf alle Einstellungen, die für Ihren Benutzer-Account wirksam werden, - ein Betrachter und Editor für macOS-Eigenschaftslistendateien (Property Lists, „plist“). Eigenschaftslistendateien sind das technische Hilfsmittel, mit denen macOS Benutzereinstellungen im Hintergrund speichert. Dieser Dateityp wird in macOS aber noch für viele weitere Zwecke eingesetzt, nicht nur zum Aufbau der Einstellungsdatenbank. Sie können alle Dateien, die Apples plist-Standard entsprechen, mit PrefEdit anzeigen und bearbeiten. PrefEdit richtet sich sowohl an Software-Entwickler als auch an Endbenutzer, die vollen Zugriff auf alle Eigenschaften der System- und Programmeinstellungen haben möchten. Das Programm ist in der Lage, den vollständigen Suchpfad und die damit zusammenhängenden Prioritäten von Einstellungen grafisch darzustellen. PrefEdit war der erste Einstellungseditor, der für Mac OS X veröffentlicht wurde. Mit seiner langen Erfahrung und Marktreife gehört er heute zu den am weitesten fortgeschrittenen Managementprogrammen für macOS-Einstellungen. Die Software wird elektronisch vertrieben. Sie können das Produkt herunterladen und testen, bevor Sie sich zum Erwerb einer uneingeschränkten Nutzungserlaubnis entscheiden."
