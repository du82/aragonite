["https://bresink.com/osx/143439/details.html"]
title = "NFS Manager: Details"
description = "Product details for NFS Manager"
full_description = "NFS Manager Features NFS Manager provides a clearly laid out graphical user interface to almost all built-in NFS features of macOS. Using NFS with macOS becomes very easy. Share disk volumes and folders via NFS. You can limit access to an IPv4 subnet or to a list of client computers. There is no limit in the number of users or simultaneous connections. A distributed file system can easily be setup using fully automatic connections to one or more NFS servers (automounting). You can configure extended communication parameters like NFS versions, transport protocols, file locking features, performance tuning, etc. Scan unknown NFS servers to see what NFS features they provide. You can establish static, manual NFS mounts by a few mouse clicks if necessary. Different from the NFS features visible in the Finder, you can specify non-standard connection options, so it is no longer a problem to access third-party Unix servers. List the shares (NFS exports) of remote NFS servers. If a Kerberos realm has been setup in your network and a Key Distribution Center is available, you can setup secure NFS, with the options to verify the identity of computers and users, to check the integrity of NFS links, and to encrypt NFS data transfers. Configure the network automounter of macOS. Display active NFS mounts, or create Desktop icons as automount triggers. Automount entries can be stored on all active Open Directory servers currently configured for your system. You only need the necessary write permission. When sharing automount entries with the whole network, NFS clients can be configured from a single central macOS system, no matter if you have 5, 500 or 5,000 computers in your network. Remote configuration of automount entries is possible via the Open Directory proxy feature of macOS. Monitor client statistics, for example the number of NFS function calls since start of the operating system. Monitor server statistics, for example which users are currently accessing which NFS shares on the server, and how many bytes they have transferred. Save the whole NFS configuration of an macOS system to a file, either in binary or in XML format. The file can be used as an archived backup or as a template for other systems. Import saved NFS configurations or migrate NFS configuration records of previous versions of NFS Manager. Export NFS configurations as CSV files to create documentation with third-party text-processing, spreadsheet, or database applications. NFS Manager can coexist with other management applications, like Directory Utility. macOS technologies like Bonjour or Open Directory are fully supported."
