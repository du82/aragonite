["https://bresink.com/products.html"]
title = "Marcel Bresink Software-Systeme: Products"
description = "Product Page"
full_description = 'Software for macOS Do you like to verify whether you are using the latest versions of our applications? Just use the Check for Updates menu item in each program or enable its automatic check feature. Or better, use Bresink Software Updater to check, download, and update our software products automatically. For manual verification, you can also use the version overview. TinkerTool System 9 TinkerTool System 9 is a collection of system utility features helping you in performing advanced administration tasks on Apple Macintosh computers. The application makes use of a self-adapting user interface which automatically adjusts to the computer model and to the version of macOS you are running. All options available in the current situation are accessible via “panes”, very similar to the System Settings application. The features are controlled via a single window which allows you to use the application as a general toolbox and First Aid assistant. Learn more… TinkerTool System 8 TinkerTool System 8 is an alternative version of TinkerTool System, designed for the operating systems macOS 13 Ventura and macOS 14 Sonoma, supporting their different feature sets. Learn more… Also still available for operating systems no longer supported by Apple: TinkerTool System 7 (for macOS 11 Big Sur and macOS 12 Monterey) TinkerTool System 6 (for macOS 10.14 Mojave and macOS 10.15 Catalina) TinkerTool TinkerTool is an application that gives you access to additional user settings Apple has built into macOS. This allows to activate hidden features in the operating system and in some of the applications delivered with the system. The tool makes sure that preference changes can only affect the current user. It will never change any component of the operating system, so the integrity of your system is not put at risk, and there will be no negative effect on system updates. Learn more… Backup Server Control Backup Server Control provides a graphical user interface to setup and administer a server for network-based Time Machine® backups with a few mouse clicks on a Macintosh®. Other Macs running macOS Sierra or later can perform backups on the Time Machine server. The current status of network backups can be reviewed any time. A Time Machine server running on a Mac can be very powerful. It is easy to handle and offers good scaling. By adding new disk drives, the service can be extended any time when needed, matching new requirements for increasing storage sizes or when new computers arrive. Learn more… Autostarter Autostarter is a small app that makes it possible to launch applications automatically during login without letting the applications show windows, even with macOS Ventura or later. This feature, which Mac users loved, can now still be used, although it had been dropped with the introduction of macOS 13. Autostarter achieves the same high level of reliability that had been known from Mac OS X 10.2 Jaguar to Mac OS X 10.6.8 Snow Leopard. The app can fully supersede the function “Login Items” for the launch of applications. Learn more… System Monitor Do you like to know which parts of your computer are currently busy? Do you like to monitor the current performance of hard drives and network interfaces? Do you like to keep an eye on the number of write accesses to your precious SSD? Do you like to see which disks are currently in sleep mode? Are you a PC switcher, but you miss the flickering activity lights of disks and interfaces on your Mac? But you like to do all this unobtrusively, with typical Mac design, wasting no screen real estate? Then, System Monitor will be a very interesting app for you. Learn more… Battery Monitor More and more computers are mobile devices nowadays. The most important prerequisite for a portable computer is a chargeable battery which keeps the device powered. Batteries are not really cheap replacement parts and they are subject to wear and tear. Their lifetimes should be optimized, handling them with the necessary care. Battery Monitor is a small auxiliary application useful in this regard. It offers the following features: Display of the charge state in the Dock, display of internal battery information, capturing charge and discharge curves, bookkeeping of the aging process of the battery. Learn more… Mac Power Monitor Mac Power Monitor is a graphical, easy-to-use interface for the energy and power measuring features of macOS. A large number of statistical evaluations can be retrieved, such as a power overview, process statistics, interrupt distribution, processor core data, and much more. The data can either be recorded live at a rate of 1 measurement per second, or as a one-shot operation with any adjustable duration of 1 millisecond or higher. Learn more… JPEG Photo File Date Did you lose the file creation or modification times of JPEG photo files in the past? So you can no longer use the macOS Finder as a simple tool to sort photos by date, or to quickly estimate when a photo was taken? This is a common problem, often caused by errors in preview applications or cloud synchronization. The small app JPEG Photo File Date can come to help here: It can read the metadata of a JPEG photo file when the picture was taken and fix the file settings for "date created" or "date last modified" accordingly. Even large amounts of pictures, such as a folder hierarchy with several tens of thousands of photos, can be processed quickly without any problems. Learn more… Sync Checker Sync Checker is designed to check if two folders or volumes are perfectly synchronized, i.e. if they have exactly the same contents. Verify if your backup and sync programs work correctly, find out where two macOS installations differ, test if your web server has received the latest updates of your web pages: There are many situations where Sync Checker can be really helpful. If file collections are not in sync, Sync Checker will help you to browse through the deviating items, analyzing exactly where a mismatch occurred, and if the differences are critical or negligible. It is also possible to create a textual report of the results which can be printed or exported. Learn more… NFS Manager NFS Manager is a graphical user interface to control all built-in NFS features of macOS. It can manage a whole network of macOS computers to setup a distributed NFS file system via a few simple mouse clicks. NFS (Network File System) is the industry standard for file sharing on UNIX systems like macOS. Each macOS system can be setup as an NFS server to offer files to the network, or as an NFS client to access files shared by other computers. Different from other file sharing protocols built into macOS, NFS has no limitations in the number of users or connections concurrently active. In addition, NFS can be setup to connect to servers fully automatically (“automounting”) without any password entries being necessary. Learn more… PrefEdit PrefEdit is an application to manage nearly all aspects of the preference system contained in every macOS installation. The program consists of three components which are tightly integrated with each other: A browser and editor for the macOS preferences database, a browser and editor for macOS property list files (plists), and a browser for preference manifest files. PrefEdit was the first preferences editor ever published for Mac OS X. With its long experience and maturity, it has become one of the most advanced preference management applications for macOS available today. Learn more.. PropEdit PropEdit is is a viewer and editor for Apple property list files (“plist”) and strict JSON files (JavaScript Object Notation). It is aimed to both software developers and end-users who want easy access to these standard file types. XML-based and binary plist files are supported. When writing JSON files, you can choose to either create easily readable, or very compact files. If technically possible, both file types can be converted back and forth in both directions. PropEdit can be considered a simplified version of PrefEdit, optimized for the technical limitations of the Mac App Store. Learn more.. Bresink Software Updater If you use many of our software products on your Mac, it can become tedious to keep all of them up-to-date. Bresink Software Updater facilitates the maintenance of our applications considerably. At a glance you can see if all programs are at their latest versions. All necessary steps, such as the download, the security check, and copying the programs to their usual places on your computer can be performed automatically in no time. Learn more… SystemLoad SystemLoad is a diagnostic application assisting you in the detection of cooling or power supply problems with Apple Macintosh computers. The tool can put a user-definable load onto one or more processors. This can help in diagnosing the following issues: problems with the cooling system or temperature sensors, problems with chirping noise caused by oscillating parts in the voltage supply circuitry of specific computer models, problems with battery units of portable computers. Learn more…'
