["https://bresink.com/osx/300423785/details.html"]
title = "Sync Checker: Details"
description = "Product details for Sync Checker"
full_description = "Sync Checker Some screenshots can give you a first impression how to work with the program. Features Check if two sets of files are “in sync”, containing the same objects and having the same attributes. Compare any two file sets which can be accessed by macOS via two folders. When providing the password of a system administrator, the check can also include entire system disks with files of other users. There is no limit in the number of files which can be checked, or the number of deviations that are detected. The only practical limitation is the memory size of your computer. You can choose a specific “degree of match” from six predefined stages that have proven to be useful in practice. For example, you may only like to perform a quick check, just testing whether files are missing in a backup copy. Scans of folder hierarchies can be archived to perform offline checks. Such a Sync Checker Snapshot can be taken as virtual data source for comparisons. This powerful method can be used to compare file sets at different points in time, or to compare files with data from another Mac without requiring a direct connection. Sync Checker is capable of scanning just the system part of an operating system volume, so you can archive comparison snapshots of macOS releases to find differences in updated versions. File system objects can be excluded from a sync check by the use of ignore lists. Ignore lists can be freely customized, blocking objects by name or by relative folder paths. Review the file system objects which are not matching, using a powerful object browser. Inspect detected differences in all file attributes, Unix flags, permission settings and Extended Attributes. Create a text report of the mismatch analysis which can be printed or exported as RTF text processing file. Let the application compute statistics from snapshots and mismatch reports. Save the results to file and evalute them offline at a later time, even on a different computer. Sync Checker is extremely fast, utilizing all processor cores of your Mac. The performance is mainly limited by the storage media holding the files to compare."
