["https://bresink.com/osx/SystemMonitor-de.html"]
title = "Systemmonitor: Beschreibung"
description = """
Produktbeschreibung für  Systemmonitor"""
full_description = "Systemmonitor Systemmonitor ist ein Programm für die Menüleiste von macOS, das Sie unaufdringlich über die Aktivität Ihres Computers informiert. Sie können jederzeit die aktuellen technischen Daten wie Prozesslast, Hauptspeicherverbrauch, Plattenspeicherbelegung, Plattenaktivität, Kommunikation auf Netzwerkanschlüssen, usw. abrufen. Durch die Positionierung in der Menüleiste wird so wenig Bildschirmplatz wie möglich verbraucht. Das Programm überwacht das System kontinuierlich und ist sofort verfügbar, wenn Sie es brauchen. Auf Wunsch kann Systemmonitor auch die flackernden Anzeigelämpchen von Festplatten und Netzwerkanschlüssen in der Menüleiste simulieren. Dies geschieht entweder in Farbe oder wahlweise — perfekt an die Oberfläche von macOS angepasst — in unauffälligem Schwarzweiß. PC-Umsteiger, die dieses Merkmal bei Macintosh-Computern vermissen, können diese Funktion mit Systemmonitor problemlos nachrüsten. Funktionsumfang Mithilfe von Systemmonitor können Sie die folgenden Messgrößen Ihres Computers überwachen: Auslastung des Gesamtsystems, aufgeteilt in Last für das Betriebssystem, Benutzerprogramme und Prozesse mit reduzierter Priorität Auslastung der einzelnen Prozessorkerne Auslastung der Grafikprozessoren (für unterstützte GPUs) Anzahl der gerade im System befindlichen Prozesse Betriebszeit seit dem letzten Start des Systems Allgemeiner Temperaturstatus der Computer-Hardware Hauptspeicherverbrauch des Betriebssystems und aller laufenden Programme Speicherverwendung der Grafikprozessoren (für unterstützte GPUs) Anzahl der Einlagerungsvorgänge von Plattenspeicher zu Hauptspeicher Anzahl der Auslagerungsvorgänge von Hauptspeicher zum Auslagerungsbereich („Swap“) Größe des momentan verwendeten Auslagerungsbereichs Belegter Speicher auf Platten-Volumes, die gerade mit dem System verbunden sind. Die Menge der zu überwachenden Volumes kann beliebig eingestellt werden. Momentaner Durchsatz und Übertragungsbandbreite für angeschlossene Festplatten. Die Menge der zu überwachenden Platten kann beliebig eingestellt werden. In der Statistik werden die Menge gelesener und geschriebener Daten, die Anzahl Lese- und Schreibvorgänge, der Spitzendurchsatz bei der Übertragung von und zur Platte, sowie alle kumulierten Daten seit dem letzten Systemstart festgehalten. Anzeige der Netzwerkanschlüsse, die im Moment aktiv sind, und mit TCP/IP betrieben werden Anzeige der öffentlichen Internet-Adresse, auch wenn Ihr Computer über einen Router mit dem Internet verbunden ist Automatische Nachverfolgung, welcher Netzwerkanschluss im Moment mit dem Internet verbunden ist Momentaner Durchsatz und Übertragungsbandbreite für aktive Netzwerkanschlüsse. Die Menge der zu überwachenden Anschlüsse kann beliebig eingestellt werden. In der Statistik werden die Menge gesendeter und empfangener Daten, die Anzahl Pakete, der Spitzendurchsatz bei der Datenübertragung, sowie alle kumulierten Daten seit dem letzten Systemstart festgehalten. Status des Neural Engine-Prozessors für Macs mit Apple-Chips Lese- und Schreibaktivität von Festplatten, sowie Ruhezustand von Festplatten Sende- und Empfangsaktivität von Netzwerkanschlüssen Für bestimmte Größen kann auch der Verlauf innerhalb der letzten 30 Sekunden über live aktualisierte Grafiken angezeigt werden. Systemmonitor versucht, so wenig wie möglich selbst in die Aktivität des Computers einzugreifen und berücksichtigt auch den Ruhezustand Ihrer Festplatten. Zusätzliche Funktionen, die nach Hinzufügen von Systemmonitor Plus bereitstehen Apple erlaubt es nicht mehr, dass die unten aufgelisteten Features Teil von Apps sein dürfen, die im Mac App Store vertrieben werden. Sie können jedoch diese Funktionen wieder nachrüsten, indem Sie unser Programm Systemmonitor Plus herunterladen und auf Ihren Computer kopieren. Systemmonitor Plus ist kostenlos erhältlich. Anzeige der 5 Prozesse, die das System im Moment am meisten belasten Charakteristische Prozessortemperatur, die möglichst nahe am ersten Prozessor des Computers gemessen wird Drehzahlwerte aller Kühlventilatoren, die vom Computer geregelt werden Weitere Sensormesswerte aus Intel® Power Gadget, falls auf Ihrem System installiert (nur für Intel-basierte Macs) Ausgewählte Temperaturmesswerte für Macs mit Apple-Chips Auf bestimmten Macs mit Apple-Chips der Messwert für die interne elektrische Gesamtleistungsaufnahme Anzeige der 5 Prozesse, die im Moment am meisten Hauptspeicher belegen Nachdem Sie Systemmonitor Plus auf Ihrem Computer kopiert haben, brauchen Sie nur in den Einstellungen von Systemmonitor zu bestätigen, dass das Zusatzprogramm genutzt werden soll."
