["https://bresink.com/osx/301025408/issues.html"]
title = "Mac Power Monitor: Notes"
description = """
Technical notes for Mac Power  Monitor"""
full_description = "Mac Power Monitor Known Issues There are currently no known problems that require additional documentation. Release Notes When removing a single outdated security component, the status of other outdated components may temporarily be unknown: If you are using the feature Commands > Clean outdated security components and more than one outdated component is shown, but you are only deleting one of them, the status of the other ones will be shown as “unknown”. Workaround: This is a known technical limitation. It is recommended to simply select all outdated components simultaneously, deleting them in one single step. If you don’t remove all of them, restart the computer to get valid status information about outdated components again. Apple’s approval feature for integrating security components is very immature: With macOS 13 Ventura, Apple introduced a new procedure that requires administrators to use System Settings to control whether to allow an application to install login items on the system or to let a program launch a privilege separation utility at the same time when the main application starts. These functions are immature and are affected by numerous technical defects. This can have influence on Mac Power Monitor, since for security reasons, it always uses the most modern form of privilege separation that a macOS version dictates. Among other things, there are the following issues: (A) Apple incorrectly suggests that Mac Power Monitor would add an always-running background service: In the System Settings application, Apple states that Login Item permissions are required for background items that apps add “to perform tasks when the application isn’t open.” This description is incorrect or incomplete. Permission is also required for programs like Mac Power Monitor that increase security through privilege separation by running a helper program only when the main program is open . Workaround: We have notified Apple of this bug and hope it will be fixed in future versions of macOS. (B) Network administrators cannot grant the necessary permission at the start of the program, but only via System Settings: When starting Mac Power Monitor for the first time, macOS shows a notification that allows administrators to permit Mac Power Monitor to run a privilege separation utility. This must be confirmed with an administrator’s password. However, password entry only works for locally set up administrator accounts, not for network administrator accounts. Workaround: We have notified Apple of this bug and hope it will be fixed in future versions of macOS. As a workaround, grant permission via System Settings > Login Items > Allow in the Background and not via the notification. (C) If you store multiple copies of Mac Power Monitor on your computer in an unusual way, macOS 13 service management may be overwhelmed: Current versions of macOS 13 are not designed to handle situations where multiple copies of Mac Power Monitor can be found on your computer. (Copies in Time Machine backups do not count.) Workaround: Only store one copy of Mac Power Monitor on your computer."
author = "Marcel Bresink"
year_published = 2025
clearnet = "https://bresink.com/osx/301025408/issues.html"
