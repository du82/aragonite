full_description = "Service Wie können wir Ihnen behilflich sein? Falls Sie mehr über die Bedienung eines unserer macOS-Softwareprodukte oder damit zusammenhängende Probleme erfahren möchten, gehen Sie bitte zur Seite Produkte und wählen dort das jeweilige Programm aus. Sie erhalten dort ausführliche technische Informationen. Bitte wählen Sie ansonsten einen der folgenden Punkte aus: Rückmeldungen und Anfragen Falls Sie eine Anfrage zu macOS oder einem macOS-Softwareprodukt haben und uns keine einfache E-Mail-Nachricht senden möchten, können Sie unser Kontaktformular verwenden. Bitte überprüfen Sie auch, ob Ihre Frage nicht bereits auf den folgenden Informationsseiten beantwortet wird: Oft gestellte Fragen zu Bestellungen, die von PayPro Global bearbeitet werden Oft gestellte Fragen zum Mac App Store Beachten Sie, dass jedes unserer kostenpflichtigen Programme auch den Menüpunkt Hilfe > Autor kontaktieren enthält. Fehlerbericht Sie möchten einen technischen Fehler („Bug Report“) in einem macOS-Softwareprodukt melden. Verlorene Registrierungen wiederbeschaffen Sie hatten eine Lizenz für eines unserer Software-Produkte für macOS erworben, aber Sie haben die zugehörigen Registrierungsdaten verloren. In diesem Fall können Sie Antrag bei uns stellen, die verlorenen Daten wiederzubeschaffen, die zur Freischaltung des Programms benötigt werden. Individualsoftware Sie verwenden ein im Auftrag erstelltes Software-Produkt (Individualsoftware) und benötigen technische Hilfe. Anderes Trifft keiner der Punkte für Sie zu, nehmen Sie bitte direkt Kontakt mit uns auf."
