full_description = "System Monitor Known Issues There are currently no known issues for this product. Release Notes Statistics for outgoing network data traffic may not work for specific combinations of macOS version and Ethernet chips: The “write” activity indicator, as well as the “outgoing packages” statistics value for certain Ethernet ports used in specific Macintosh models may not work with all versions of macOS. In such a case, System Monitor shows no write activity or zero packages for the affected network interface, respectively. For example, the “Aquantia Aqtion 113” driver of macOS 13 is affected by this problem. It is used by the 10 GBit/s port of the Apple Studio. Workaround: This is a known defect of specific Apple network interface drivers. There is no workaround as waiting for a correctly working version of macOS. You should send a bug report to Apple that the network interface statistics are failing for your Macintosh model and your version of macOS."
