["https://bresink.com/osx/143439/history.html"]
title = "NFS Manager: What's new?"
description = "Product history for NFS Manager"
full_description = "What's new? NFS Manager Version History Release 5.96 (Build 241126) Added support for new macOS 15 options to control the minimum and maximum attribute cache times for the root folders of NFS mounts separately from the attribute caching behavior for other folders. Added new statistics section to monitor the response and error codes received by the NFS client. This feature is available in macOS 15 or later only. Added new statistics section to monitor the response and error codes sent by the NFS server (macOS 15 or later only). Added full support for the new client statistics counter for the Network Lock Manager (macOS 15 or later only). Added new user interface for simplified license registration and activation features which will become available in the near future. Fixed a race condition which could sometimes cause the listed entries for automounts to be incomplete for directory service nodes in some operating system versions. Release 5.95 (Build 240910) Added full support for macOS 15 Sequoia. The timing behavior when accessing values from the Open Directory database has been changed. The ensures better performance and avoids possible deadlocks with slow database connections. Release 5.9 (Build 240731) Added support for alternative preview versions of upcoming operating systems. Users of Intel-based Macs or users who don’t test beta operating systems won’t need this specific build. Release 5.9 (Build 240614) Added preliminary support for future versions of macOS. Added more user guidance when attempting to use specific mount points for the macOS automounter which could be inaccessible due to System Integrity Protection. When using up-to-date versions of macOS, all statistics features of the NFS server will become visible again. Apple has fixed a defect in System Integrity Protection which mistakenly blocked access to the data in specific operating system releases. Fixes a possible issue where a race condition could cause the feature to remove outdated versions of the privileged helper program to fail. Release 5.8 (Build 240116) Added new features for authorization of privileged operations. The application will now allow authentication of administrative users in additional special cases previously not permitted: authorization within a running login session of a non-administrator authorization by administrators with empty passwords in operating system versions that don’t block this generally authorization in cases where multiple users are logged in, but the affected user is not on the frontmost console session Administrators can return to the previous stricter authorization policies if needed. Added new feature to detect volumes with file systems which are not supported by Apple’s NFS server as early as possible (only on macOS 13 and later). Code to support early beta versions of macOS 14 Sonoma has been removed. In particular, the changed data protection policy for the macOS automounter has been updated. Modernized organization of language support files. Release 5.71 (Build 230814) This version adds updated information about a defect in Apple’s NFS server (FB9102622) which could prevent sharing of subfolders on secondary volumes in specific versions of macOS. Updated support for future versions of macOS. Release 5.7 (Build 230619) Added support for new NFS client option in macOS 13 and later: when reading files in memory-mapped mode, the client can generally consider such an access uninterruptible, regardless of mount options trying to override this. Added preliminary support for future versions of macOS. Release 5.63 (Build 230522) This is a routine update, reflecting minor changes in the latest versions of macOS 13 Ventura. Release 5.62 (Build 230221) Added new workarounds for the continuing quality problems of macOS 13. Release 5.61 (Build 221220) Added new release notes regarding known defects of the NFS server of macOS Ventura. Added protection against operating system defects of macOS 13.1. The application also provides additional user guidance for situations where such defects cause issues. Added protection against cases where the application is configured for automatic software update checks, but is operated with a network firewall that doesn’t allow the necessary Internet connections. In specific cases, this could result in intermittent program termination instead of an error message. Release 5.6 (Build 221021) Added full support for macOS 13 Ventura. This version shows better responsiveness in situations when the application had contact with an NFS server which was subsequently shut down. Fixes a compatibility issue with recent versions of macOS. The feature to remove old versions of the privileged auxiliary tool will now show the correct status information instead of “unknown” on the affected systems. Release 5.5 (Build 220609) Added preliminary support for future versions of macOS. Added support for the general mount option not to follow symbolic links at an NFS mount point. Added new button in the overview of active NFS connections to show selected mount points in the Finder. The user interface for licensing and product activation was slightly revised. Release 5.4 (Build 211019) This version adds full support for macOS 12 Monterey. All statistics features for client and server have been completely rewritten, because Apple has removed all related application program interfaces (APIs) from macOS. Added new client settings specific to macOS 12, specifying a timeout for initial mount requests and and a timeout for quick-mount requests initiated by autofs where the maximum number of retry attempts is zero. Added new server setting specific to macOS 12, controlling whether the NFS server should support data-less objects in APFS file systems. This version fixes a problem where NFS Manager could show partially incorrect instructions when it detects that third-party applications try to damage the installation of the privileged helper utility. Release 5.3 (Build 210621) Added preliminary support for future versions of macOS. Added support for general mount option to always update file access times even if this is causing bad performance. Fixed a problem where an incorrect file name suffix could be used when saving configurations in XML format. Release 5.2 (Build 210510) Added support for macOS 11.3. Uses clearer wording to describe demonstration mode. The application has been made more robust against bugs in other third-party applications that misidentify the security component of NFS Manager as possible adware. Release 5.1 (Build 201118) Added support for future versions of macOS. Added new user guidance for cases where a remote NFS server check cannot run successfully because the client Mac prefers IPv6 instead of IPv4 to contact the server. The user guidance for cases where Apple’s NFS server rejects a share for privacy reasons has been redesigned. Release 5.0 (Build 201021) Added full support for macOS 11.0 Big Sur. Release 4.92 (Build 200827) Because Apple appears to have given up the development of macOS 10.15, all workarounds for issues with its NFS features have been finalized in NFS Manager. macOS Catalina is now considered fully supported by NFS Manager, although the use of this OS version is not recommended. The graphical interface of NFS Manager and its reference manual make users aware of possible defects in the operating system. Added further support for future operating system versions. Added tip in the reference manual about recommended NFS options when connecting to typical Linux servers or NAS devices. Fixed a problem where an incorrect nfsd security policy warning could be shown for macOS Catalina when the table of exports was already open while the application was started. Release 4.91 (Build 200820) Preliminary support for future operating system was modified to react on forthcoming changes. Parts of the user interface for product activation and registration management have been redesigned. Release 4.9 (Build 200701) Added preliminary support for future operating systems. The application now accepts that its icon can be replaced by the Finder. This will no longer raise a security warning. Release 4.8 (Build 191112) This is a maintenance update which fixes a problem on computers with a specific upgrade history where the privacy settings may not have been shown correctly, because macOS did not grant the application permission to determine the true privacy configuration. Only specific systems running macOS Catalina had been affected. Release 4.76 (Build 191108) This version adds support for unexpected changes in macOS 10.15.1 Catalina. The warnings about critical issues with macOS Catalina have been tightened. The privacy warnings when sharing external disks with macOS Catalina now automatically disappear after the related approvals have been established. The application now suggests a possible workaround for the current limitations of the Catalina kernel when trying to share multiple folders per volume. This versions fixes a problem where volumes in HFS+ format could not be selected when defining NFS shares via volume UUIDs instead of Unix paths. Release 4.75 (Build 191004) This version adds support for expected changes in future versions of macOS. Release 4.74 (Build 190806) This is a maintenance release which only affects users of macOS Sierra and users testing beta releases of future operating system versions. Added a workaround for a defect of macOS Sierra which could cause the application to quit while integrating the privileged component. Added several temporary changes for future versions of macOS. Release 4.73 (Build 190626) Added preliminary support for future versions of macOS. Release 4.72 (Build 190218) This is a maintenance update which adds a workaround for a defect in macOS Mojave which can hang the operating system for 7 minutes if an application asks the operating system for the complete list of group accounts in a configuration with a network directory service. All user and group panels show only cached accounts now. The complete list of accounts can be retrieved on demand by clicking an extra button in the panels. Release 4.71 (Build 190124) This is a maintenance update which fixes an issue with specific combinations of operating system versions and server configurations where a modification of NFS share settings might not have taken effect until the next restart of the computer. Release 4.7 (Build 181107) Added new feature to display the internal status and the complete set of options effective for an active NFS mount. Added small modifications to user guidance necessary for full compatibility with macOS 10.14.1 and later. The distribution package supports new security features of macOS Gatekeeper. Enhanced reliability when retrieving the set of share definitions from a remote NFS server in IPv4/IPv6 dual stack networks. This version tries to avoid hangs during application startup in cases where the local DNS server returns outdated information about the set of addresses used by the local computer. Release 4.6 (Build 180912) This version adds full support for macOS 10.14 Mojave. Fixes a problem with the English user interface where a duplicate “to” was displayed in dialogs that ask for privileged operations. Release 4.51 (Build 180731) Added further preliminary support for future versions of macOS. Users of macOS Sierra or macOS High Sierra don’t need this update. Release 4.5 (Build 180702) Added preliminary support for future versions of macOS. Support for OS X El Capitan has been removed. The buffer size and read-ahead parameters for NFS client communication now offer larger sizes, reflecting operating system development in the last years. Several images have been added to the documentation. Fixed a problem where the application always indicated an operating system issue after all NFS share entries have been removed. Because Apple does not fix several critical defects and design flaws in the macOS user interface for the authorization of privileged operations, NFS Manager switches to a redesigned security architecture. As in classic versions of Mac OS X, it is now necessary to launch the application in the login session of an administrative user account (which is the default setup for Macs) if privileged operations should be used. Fast User Switching can be used to operate the application while using other user accounts. Added new feature to allow administrative users to authorize privileged operations via Touch ID. Added new feature to remove outdated versions of security components of previous generations of NFS Manager. Added new technology to avoid a defect of macOS where the application lost keyboard focus when a password needed to be entered for a privileged operation if multi-tier privilege separation was in use. Added new technology to avoid a defect of macOS where the user interface is no longer localized correctly when a password needs to be entered for a privileged operation if multi-tier privilege separation is used. Added new technology to avoid a design flaw of macOS where no appropriate application icon can be shown when a password needs to be entered for a privileged operation if multi-tier privilege separation is used. Added new technology to avoid a defect of macOS where the layout of authentication panels was incorrect, leading to clipped messages in user dialogs to authorize privileged operations. Added new technology to avoid a defect of macOS where the operating system asks for permission to add a helper application when it actually removes a helper application. Features to customize the authorization policy for privileged operations via the security database of the operating system had to be removed. Release 4.41 (Build 180412) Added new user interface to the product activation feature in order to be compliant with the General Data Protection Regulation of the European Union (EU Regulation 2016/679). Release 4.4 (Build 170918) Adds full support for macOS 10.13 High Sierra. Adds a new mount setting enforcing the use of Extended Attributes and named forks over NFSv4 which is necessary due to a change in the default policy of macOS 10.13. (Available for High Sierra only.) Adds a new client setting to override the default domain name when mapping account identities from an NFSv4 server. (Available for High Sierra only.) Added an assistance mode for product registration. Many small changes in the user interface. Release 4.31 (Build 170609) NFS Manager has been unlocked to allow beta-testing with pre-release versions of macOS 10.13 High Sierra. Release 4.3 (Build 170412) Added support for Macintosh computers with Touch Bar. Added new option to prefer the numeric display of client addresses for NFS server user statistics. Added new option to prefer the numeric display of user IDs for NFS server user statistics. Added new controls for NFSv4 mount options to define the permitted encryption types for Kerberos sessions. (Only available with macOS Sierra.)"
