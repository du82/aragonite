["https://brew.sh/2024/05/14/homebrew-4.3.0"]
title = "4.3.0 — Homebrew"
description = "Today, I’d like to announce Homebrew 4.3.0. The most significant changes since 4.2.0 are SBOM support, initial bottle attestation verification, new command analytics and uninstall autoremove by default."
full_description = "Today, I’d like to announce Homebrew 4.3.0. The most significant changes since 4.2.0 are SBOM support, initial bottle attestation verification, new command analytics and uninstall autoremove by default. brew bottle will include a basic SPDX file inside the bottle and a more comprehensive one after installation. This is to provide support for the widely used SBOM format from Homebrew. If HOMEBREW_VERIFY_ATTESTATIONS is set, brew install will verify the bottle artifact’s attestation when pouring bottles using GitHub’s gh CLI. This functionality is still in beta. We expect to remove the need for the gh tool and improve performance before we make this the default behaviour. This behaviour demonstrates Homebrew’s ongoing commitment to improving our security posture. Read more in the tracking issue or in the GitHub artifact attestation announcement HOMEBREW_AUTOREMOVE is the default behaviour meaning that brew cleanup and brew uninstall automatically run brew autoremove. Disable this by setting HOMEBREW_NO_AUTOREMOVE. This is to improve the default behaviour of brew uninstall given brew autoremove is sufficiently reliable. Homebrew has two new types of analytics: “Brew Command Run” events and brew test-bot analytics. The latter are not working or published yet but will be soon. These are to help us improve the documentation and prioritisation of issues in Homebrew. Homebrew/homebrew-cask requires code signing of all casks. Expect removal of casks that are not code signed from Homebrew/homebrew-cask in future. This is because code signing is required on Apple Silicon which is used by a growing majority of all Homebrew users. Homebrew/homebrew-autoupdate is no longer an official tap and has moved back to DomT4/homebrew-autoupdate. Homebrew/homebrew-cask-versions migrated to Homebrew/homebrew-cask and is archived, following Homebrew/homebrew-cask-drivers. Migration for Homebrew/homebrew-cask-fonts will happen soon. This will make it easier to have a more consistent installation, discovery and maintenance experience for all official casks."
