full_description = "ENO (Original Motion Picture Soundtrack) Available on vinyl, CD and on all streaming platforms. Out April 19th 2024 (North America & Mexico CD/ LP - June 7th) Listen Now Brian Eno is the subject of a new career spanning documentary that is uniquely generative: a film that’s different every time it’s screened. Compiled from hundreds of hours of video footage, music and interviews, the film explores Eno’s music, art and ideas, giving the viewer personal insights into his creative processes. Accompanying this groundbreaking new film is a soundtrack that serves as a companion audio journey touching on Eno’s output throughout his rich career. The 17 tracks included on the album feature work from early solo outings such as 1974’s ‘Taking Tiger Mountain’ and 75’s ‘Another Green World’, acclaimed collaborations with the likes of David Byrne, John Cale, Cluster and more recently, Fred again… all the way through to music from his latest album, ‘FOREVERANDEVERNOMORE’, and his 2021 appearance at the Acropolis in Athens with brother, Roger. Release date: April 19th 2024 (North America & Mexico CD/ LP – June 7th) Eno Watch Now Who Are We Watch Now Store FOREVERANDEVERNOMORE: CD FOREVERANDEVERNOMORE: VINYL LP + PRINT FOREVERANDEVERNOMORE: EXCLUSIVE CLEAR VINYL LP + BLACK VINYL LP + CD FOREVERANDEVERNOMORE: EXCLUSIVE CLEAR VINYL LP + PRINT Shop All"
