["https://www.brian-eno.net/about"]
title = "About – Brian Eno"
full_description = "About Brian Eno – musician, producer, visual artist and activist first came to international prominence in the early seventies as a founding member of British band, Roxy Music, followed by a series of solo albums and collaborations. His work as producer includes albums with Talking Heads, Devo, U2, Laurie Anderson, James, Jane Siberry and Coldplay, while his long list of collaborations include recordings with David Bowie, Jon Hassell, Harold Budd, John Cale, David Byrne, Grace Jones, Karl Hyde, James Blake and most recently with his brother, Roger, on the album, Mixing Colours. In August 2021, they performed together for the very first time, and to a rapturous audience at the Acropolis in Athens. Brian Eno’s visual experiments with light and video continue to parallel his musical career, with exhibitions and installations all over the globe. To date he has released over forty albums of his own music and exhibited extensively, as far afield as the Venice Biennale, St. Petersburg’s Marble Palace, Ritan Park in Beijing, Arcos de Lapa in Rio de Janeiro and the sails of the Sydney Opera House. He is a founding member of the Long Now Foundation, a trustee of Client Earth and patron of Videre est Credere. In April 2021, he launched EarthPercent, which raises money from the music industry for some of the most impactful environmental charities working on the climate emergency. About Brian Eno – musician, producer, visual artist and activist first came to international prominence in the early seventies as a founding member of British band, Roxy Music, followed by a series of solo albums and collaborations. His work as producer includes albums with Talking Heads, Devo, U2, Laurie Anderson, James, Jane Siberry and Coldplay, while his long list of collaborations include recordings with David Bowie, Jon Hassell, Harold Budd, John Cale, David Byrne, Grace Jones, Karl Hyde, James Blake and most recently with his brother, Roger, on the album, Mixing Colours. In A