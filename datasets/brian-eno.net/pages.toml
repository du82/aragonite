["https://www.brian-eno.net/releases"]
title = "Releases – Brian Eno"
full_description = "Releases 2024 ENO Official Soundtrack to the 2024 Gary Hustwit Documentary ‘Eno’ – The definitive documentary about visionary musician and artist Brian Eno, and a ground-breaking generative film that’s different every time it’s shown. The official soundtrack features 17 tracks from throughout Eno’s prolific recording career including 3 previously unreleased recordings. Brian Eno – All I Remember *Previously Unreleased* Brian Eno with Daniel Lanois and Roger Eno – The Secret Place Brian Eno & Fred Again – Cmon Brian Eno & Cluster – Ho Renomo Brian Eno – Sky Saw Brian Eno & John Cale – Spinning Away Brian Eno & Tom Rogerson – Motion In Field Brian Eno – There Were Bells Brian Eno – Third Uncle Brian Eno & David Byrne – Everything That Happens Brian Eno – Stiff Brian Eno with Leo Abrahams and Jon Hopkins – Emerald & Lime Brian Eno – Hardly Me Brian Eno & David Byrne – Regiment Brian Eno – Fractal Zoom Brian Eno – Lighthouse #429 *Previously Unreleased* Brian Eno & Roger Eno – By This River ‘Live At The Acropolis’ *Previously Unreleased. Pre Order 2023 FOREVER VOICELESS Brian Eno released his latest studio album FOREVERANDEVERNOMORE in October 2022. It quickly garnered praise from critics and was a distinct departure from recent Eno albums, featuring his vocals as primary focus across an entire album for the first time since 2005’s ‘Another Day On Earth’. A Thought And Let It In Who Are We Crystal Light Inclusion Bells Above Chéri Hardly Me Small Noise Silence OUT NOW 2022 Foreverandevernomore FOREVERANDEVERNOMORE is the 22nd solo studio album from Brian Eno and the first since January 2017’s Reflection. The 10-track album was recorded and produced by him at his studio in West London and sees Eno singing on the majority of tracks. It’s a sonically beguiling, ultimately optimistic exploration of the narrowing, precarious future of humanity and our planet. As Eno himself concludes, “Briefly, we need to fall in love again, but this time with Nature, with Civilisation and with our hopes for the future.” Making Gardens Out of Silence in an Uncanny Valley’ was originally included in an audio installation which is Brian Eno’s contribution to the London Serpentine’s long-term, interdisciplinary programme addressing the ongoing climate emergency, Back To Earth. This full-length version of the track is exclusive to the CD format of FOREVERANDEVERNOMORE. Who Gives a Thought We Let It In Icarus or Blériot Garden of Stars Inclusion There Were Bells Sherry I’m Hardly Me These Small Noises Making Gardens Out of Silence Out Now 2022 FOREVERANDEVERNOMORE – CD Who Gives a Thought We Let It In Icarus or Blériot Garden of Stars Inclusion There Were Bells Sherry I’m Hardly Me These Small Noises Making Gardens Out of Silence in the Uncanny Valley Out Now 2017 Reflection Reflection Listen 2016 The Ship The Ship Fickle Sun (i) Fickle Sun (ii) The Hour Is Thin Fickle Sun (iii) I’m Set Free Listen 2012 Lux LUX 1 LUX 2 LUX 3 LUX 4 Listen 2011 Drums Between The Bells Bless This Space Glitch Dreambirds Pour It Out Seedpods The Real The Airman Fierce Aisles of Light As If Your Eyes Were Partly Closed As If You Honed the Swirl Within Them and Offered Me the World A Title Sounds Alien Dow Multimedia Cloud 4 Silence Breath of Crows” Listen 2010 Small Craft on a Milk Sea Emerald and Lime Complex Heaven Small Craft on a Milk Sea Flint March Horse 2 Forms of Anger Bone Jump Dust Shuffle Paleosonic Slow Ice, Old Moon Lesser Heaven Calcium Needles Emerald and Stone Written, Forgotten Late Anthropocene Listen"
