full_description = "Newsletter January 27, 2025 Is AI Dethroning WordPress? Join me live with Matt Medeiros to talk about the future of WordPress in our increasingly AI world. Newsletter January 14, 2025 What is happening to WordPress and the web? Weekly news with a heavy dose of AI. Newsletter December 20, 2024 One last thing before we wrap this year It’s a double newsletter week. Normally I wouldn’t do this to you, but my holiday vacation is about to start and I wanted to get a few additional things off my chest. As I’m hurriedly writing this, my inbox has been hit with four other WordPress newsletters who thought publishing on a Friday before Christmas… Newsletter December 18, 2024 Google’s Game Plan and WordPress Fifteen Years On I’m starting to sound like a broken record here, but I’ll say it again: I’m playing with the format of my content, people! I’m asking myself questions like “what is a newsletter?” and “is it bad to use the word ‘content’?”. There’s no strategy, friends. Last week I included three dozen links at the end… Newsletter December 13, 2024 This is why we can’t have nice (self-hosted) things In case you missed it, last week I launched a podcast: Webmasters.fm. Today I’ve dropped a new interview: Jessica Lyschik, developer at Greyd and one of the driving forces behind the very popular TwentyTwentyFour default WordPress theme. This episode is audio-only, but I’ve set up a new YouTube account to mirror the feed for any… Newsletter December 4, 2024 Introducing Webmasters.fm – A New Podcast Launching a new podcast, a new website, and hopefully a new look at the open web. Newsletter November 20, 2024 Ollie and the Future of WordPress Things have felt very… interesting in WordPressland the last few months. Newsletter September 7, 2024 Etch-a-Sketching Out the Future Love him or hate him, Kevin Geary knows how to stir conversation. We’ve had a few public and private disagreements, and his fanboys often tag me as some sort of anti-Kevin Gutenberg apologist. So when Kevin revealed this image during his top secret Etch pre-sale campaign, I was not surprised by all the DMs asking… Newsletter July 24, 2024 The Gutenberg User Experience You can set your clock by it – the recurring flare-ups of Gutenberg frustrations that turn into tweets that turn into videos that turn into livestreams that turn into… what exactly? I’m not entirely sure. What are we frustrated about? Leadership. Vision. Direction. Governance. Inflation. But above all: Gutenberg. I won’t retread the arguments about… Newsletter June 3, 2024 What is “modern” WordPress development? It’s a phrase that I’ve started to use more often, to the point where it starts to lose any sense of meaning. Does it mean anything? Next Page"
