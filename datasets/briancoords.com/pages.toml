full_description = "Blog February 10, 2025 Making a Career Change This month I’m embarking on a new role: Developer Advocate, WooCommerce. Blog February 1, 2025 Getting the Block Editor Ready for AI If WordPress wants to survive, it needs to take generative AI seriously. Livestream, Video January 28, 2025 Are Matt’s AI Skills Making WordPress Developers Obsolete? In this livestream, Matt shows me his new AI developer skills and I decide if I should be worried about my career. Newsletter January 27, 2025 Is AI Dethroning WordPress? Join me live with Matt Medeiros to talk about the future of WordPress in our increasingly AI world. Tutorials January 18, 2025 Pull WordPress from Prod to Local with WP-CLI Bash Script Simple bash script for pulling your wp-content folder and database down into your local environment. Newsletter January 14, 2025 What is happening to WordPress and the web? Weekly news with a heavy dose of AI. Blog January 7, 2025 Is LLM-generated code good for open source? Thoughts on whether generative AI-based coding is really going to save open source software. Newsletter December 20, 2024 One last thing before we wrap this year It’s a double newsletter week. Normally I wouldn’t do this to you, but my holiday vacation is about to start and I wanted to get a few additional things off my chest. As I’m hurriedly writing this, my inbox has been hit with four other WordPress newsletters who thought publishing on a Friday before Christmas… Blog December 20, 2024 Another Post About What WordPress Core Should be Doing There’s been another batch of “what WordPress should do” posts this past month. They’re all great, but I think there’s something missing from the conversation. Video December 18, 2024 WP Queries in PHP and JavaScript – Building a custom Avatar block In this video, I share how I built a custom solution for displaying guest speaker images on my podcast website using WordPress. I combined plugins like Seriously Simple Podcasting and the outdated WP Term Images, then created a custom Gutenberg block to dynamically display speaker headshots. I discuss the challenges of working with the REST… 1 2 … 21 Next Page→"
