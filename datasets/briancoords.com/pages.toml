full_description = "Newsletter May 16, 2024 Gutenberg Dialogues and Monologues Tomorrow I’m going head-to-head in a friendly “page building” livestream with Bricks Builder aficionado Kevin Geary (click to get notified here). We’ll take turns building the same landing page, talking the whole time about the tools and workflows and trying to compare apples to apples (Bricks to Gutenberg) as much as possible. I’ve responded to… Newsletter May 6, 2024 Market Share and Version Control Is WordPress getting too hard? Are the masses really leaving? How big is the moat that keeps WordPress safe? The same questions year after year. (I even found a post I wrote about it for MasterWP two years ago). That’s not to say they’re unimportant questions- in fact they’re probably more important than ever. WordPress… Newsletter April 23, 2024 5 Promising PRs – a WordPress 6.6 Wishlist Work on WordPress 6.6 is underway. If I’m being completely honest with you, I would love it if WordPress 6.6 introduced zero new features. I have not been shy about my desire for a cleanup-only release cycle (this tweet about it had 31k views). A maintenance-only release is an idea that originated with the project’s… Newsletter March 4, 2024 WP Tavern and Livestreams Hey all, Just wanted to send out a quick note on a few exciting things. Catch me at the WP Tavern For the next two weeks, I’ll be contributing regularly to the WP Tavern. It’s all part of Matt Mullenweg’s devious Hunger Games to find contributors/editors for the venerable WordPress news site. Check out my… Newsletter February 16, 2024 Bricks, Blocks, and Building in Public There’s something special about WordCamps, big and small. Meeting up with WordPressers in real life is always a rewarding communal experience. So much better than Twitter. This past week at WordCamp Phoenix all the labels of competing hosting companies and competing plugins disappeared and the vibes were harmonious. As soon as I have my hands… Newsletter January 15, 2024 Page Builders and Response Videos Let’s talk WordCamp Phoenix, page builders vs Gutenberg, and secret bonus content. Newsletter December 4, 2023 Site Editing and Lengthy GitHub Issues Hello WordPress friends, These past few months I’ve been digging into Full Site Editing in WordPress. My theory is that it’s almost ready for primetime use by the developer/agency community, so I’m testing it out on some client projects. Overall I’m… mostly impressed. Don’t get me wrong- there are still a ton of rough edges,… Newsletter June 20, 2023 20 Years of WordPress As anniversaries go, I’m really not sentimental. My wife just had to remind me that we’re hitting ours this week. I’m glad WordPress is sticking around, though, and I do appreciate the schmoozy posts and all that. If I have to pick one anniversary to try to remember, it should probably be my own wedding.… Newsletter May 12, 2023 WordPress Icons and a YouTube Video What a fun week in WordPress. The twentieth anniversary of WP is kicking off with the #WP20 campaign and you can feel the community coming out of it’s winter cave and engaging with each other more. Not always in the most positive way, but overall it’s been fun to see the conversations pick up on… Newsletter April 19, 2023 Learning out Loud and WCPHX Last month was a bit of a whirlwind, culminating in a trip to Arizona for WordCamp Phoenix. I was hoping to share a few of my favorite talks, but I’ll probably wait until the edited videos are all available. Let’s just say that I learned a LOT about PHP 8, generative AI, WooCommerce, and the… Previous Page Next Page"
