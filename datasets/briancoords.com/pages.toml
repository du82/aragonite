full_description = "Blog, Tech September 27, 2024 Misconceptions About Matt, Open Source, and Contributions As we learn more about the Matt vs WP Engine fight, it’s time to clear up some major misconceptions. Blog, Tech September 23, 2024 The WCUS Closing I Wish We’d Had In case you missed it, WordCamp US 2024 ended on a very wild note, with Matt singling out WP Engine as enemy number one. Blog, Tech July 12, 2024 Will WordPress 6.6 have components? A true component-based web design system inside of WordPress would be the developers dream, but I just don’t think we’re there yet. Blog, Tech March 26, 2024 Dev Considerations for a New FSE Project This post outlines the main developer experience issues with block-based themes, with some thoughts around how I plan to solve them, including what tools I might need to leverage along the way. Blog, Tech February 20, 2024 FSE Navigation Block Woes Navigation block feedback for the FSE team Blog, Tech February 6, 2024 WordCamp Phoenix 2024 🚨 If you’re looking for my presentation from WCPHX 2023, Migrating your Workflow from ACF Flexible Content Rows to ACF Blocks, you can find that here. Custom Block Development… Using Other Blocks Learn how to build a custom block- using only other core blocks. Why? WordPress core already offers blocks for most common HTML elements-… Blog, Tech February 5, 2024 In Support of Canonical Plugins There’s a few additional features that WordPress should really offer out of the box, based on a more modern expectation of what a website could/should be. Blog, Tech January 18, 2024 Thoughts on Version Control for Block Themes How do we handle version control for ongoing development of a block-based website? Blog, Tech, Video January 10, 2024 The block editor is still not a page builder My thoughts on why the block editor is NOT a page builder. Along the way I talk about alignments, widths, semantic elements, block styles, theme, page builders, and more. Blog, Tech November 14, 2023 Custom Settings Screens in Block Themes How do you build custom settings pages for “modern” WordPress? Next Page"
