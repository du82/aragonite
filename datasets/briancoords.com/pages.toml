full_description = "Newsletter December 18, 2024 Google’s Game Plan and WordPress Fifteen Years On I’m starting to sound like a broken record here, but I’ll say it again: I’m playing with the format of my content, people! I’m asking myself questions like “what is a newsletter?” and “is it bad to use the word ‘content’?”. There’s no strategy, friends. Last week I included three dozen links at the end… Newsletter December 13, 2024 This is why we can’t have nice (self-hosted) things In case you missed it, last week I launched a podcast: Webmasters.fm. Today I’ve dropped a new interview: Jessica Lyschik, developer at Greyd and one of the driving forces behind the very popular TwentyTwentyFour default WordPress theme. This episode is audio-only, but I’ve set up a new YouTube account to mirror the feed for any… Newsletter December 4, 2024 Introducing Webmasters.fm – A New Podcast Launching a new podcast, a new website, and hopefully a new look at the open web. Podcast Appearances November 25, 2024 Is WordPress 6.7 Good? With Matt Medeiros at The WP Minute In this episode, Matt and I talk about WordPress 6.7, some of our favorite features, the 2025 block theme, and then we go on a long tangent about using AI to learn coding or to even replace developers entirely. Newsletter November 20, 2024 Ollie and the Future of WordPress Things have felt very… interesting in WordPressland the last few months. Podcast Appearances November 6, 2024 Reacting to the TechCrunch Disrupt Connie Loizos interview with Matt Mullenweg In this episode of the WP Minute, Brian and Matt Medeiros unpack the Disrupt 2024 exclusive Connie Loizos interview with Matt Mullenweg, co-founder of WordPress and CEO of Automattic. Tutorials, Video October 22, 2024 Add custom CSS and JavaScript to any WordPress block We’re adding custom CSS and JavaScript files to WordPress core blocks. Modify any block.json with simple PHP to load your own custom CSS and JavaScript. Video October 15, 2024 Local WordPress with Her