title = "One last thing before we wrap this year - Brian Coords"
description = "It’s a double newsletter week. Normally I wouldn’t do this to you, but my holiday vacation is about to start and I wanted to get a few additional things off my chest. As I’m hurriedly writing this, my inbox has been hit with four other WordPress newsletters who thought publishing on a Friday before Christmas […]"
full_description = "Newsletter December 20, 2024 One last thing before we wrap this year Subscribe It’s a double newsletter week. Normally I wouldn’t do this to you, but my holiday vacation is about to start and I wanted to get a few additional things off my chest. As I’m hurriedly writing this, my inbox has been hit with four other WordPress newsletters who thought publishing on a Friday before Christmas was a good idea. We persist. I’ll keep this one brief, but in case you have any downtime over the next two weeks: Another Post About What WordPress Core Should be Doing – In a new blog post, I build off a recent post from Joost de Valk and talk about some trends that I believe WordPress developers should be paying attention to. I end with a plea to the Gutenberg team. (Also available in audio format.) WP Queries in PHP and JavaScript – Building a custom Avatar block – In a new video, I talk about building a custom block for my podcast website based on a very old plugin. I also go through the differences between PHP and JavaScript for getting the same piece of WordPress data. Links Around the web Most articles presenting survey results are incredibly boring and long-winded. This is not that at all. Definitely check out ‘Exploring the “State of JavaScript” data’ from Josh Comeau. Exploring the “State of JavaScript” data 🔎 • Josh W. Comeau Matt Medeiros now owns MasterWP. He’s bringing it back to its roots and focusing on WordPress education. MasterWP – Professional WordPress Training for Teams Between Apple Intelligence and Mail, iOS has been a huge letdown. I already turned off the categories and AI summaries, but it’s the obnoxious icons that are really distracting and I don’t think you can get rid of them. iOS 18.2 Mail is a misfire – Six Colors That’s all folks. What are you looking forward to in 2024? I’m feeling hopeful. As The Zombies once sang, “this will be our year, took a long time to come.” Brian CoordsModern WordPress Development"
