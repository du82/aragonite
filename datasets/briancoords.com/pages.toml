description = "This was a fun one. Matt Medieros (WP Minute, Matt Report, Gravity Forms, Podcast Setup, The Honorary WP Podfather) invited me on for a ranging conversation “explaining” the WordPress project. We tackle a few big concepts like GPL and open source, then dig into all the different facets of what makes WordPress WordPress. We try […]"
full_description = "Podcast Appearances, Video 22 Major Parts of the WordPress Universe w/ Matt Medeiros Brian Coords September 5, 2024 This was a fun one. Matt Medieros (WP Minute, Matt Report, Gravity Forms, Podcast Setup, The Honorary WP Podfather) invited me on for a ranging conversation “explaining” the WordPress project. We tackle a few big concepts like GPL and open source, then dig into all the different facets of what makes WordPress WordPress. We try to hit every topic we can think of for a few minutes each, including: Core contributors WordPress.com Jetpack Matt Mullenweg Josepha Haden-Chomphosy Automattic WP Tavern Audrey Capital WordPress Foundation WordCamps Woocommerce and so much more. Some of the larger themes that emerged as we talked included the history of WordPress, the importance of open source, the ideal WordPress user, the role of DIYers versus agencies, beginner versus advanced software, Matt Mullenweg’s purview and just the crazy scope of the WordPress project. In my opinion, this one was a must-watch for anyone who’s just trying to understand the scope of the many many things we like to call WordPress. https://www.youtube.com/watch?v=ldrRHxZDW-4"
