full_description = "Podcast Appearances November 25, 2024 Is WordPress 6.7 Good? With Matt Medeiros at The WP Minute In this episode, Matt and I talk about WordPress 6.7, some of our favorite features, the 2025 block theme, and then we go on a long tangent about using AI to learn coding or to even replace developers entirely. Podcast Appearances November 6, 2024 Reacting to the TechCrunch Disrupt Connie Loizos interview with Matt Mullenweg In this episode of the WP Minute, Brian and Matt Medeiros unpack the Disrupt 2024 exclusive Connie Loizos interview with Matt Mullenweg, co-founder of WordPress and CEO of Automattic. Podcast Appearances September 28, 2024 Automattic vs WP Engine – The WP Minute What’s happening with Automattic vs WP Engine, with Matt Medeiros, Courtney Robertson, and a brief appearance by Matt Mullenweg. Podcast Appearances, Video September 5, 2024 22 Major Parts of the WordPress Universe w/ Matt Medeiros This was a fun one. Matt Medieros (WP Minute, Matt Report, Gravity Forms, Podcast Setup, The Honorary WP Podfather) invited me on for a ranging conversation “explaining” the WordPress project. We tackle a few big concepts like GPL and open source, then dig into all the different facets of what makes WordPress WordPress. We try… Podcast Appearances October 30, 2023 🔗 WPCoffeeTalk: Brian Coords A brief yet caffeinated chat with WP all-star Michelle Frechette on her podcast, WPCoffeeTalk. Podcast Appearances April 11, 2023 🔗 In the Loop: Learning Out Loud Aurooba and I talk to Cory and Phil about our podcast, viewSource— and we talk about why we started it, who it’s for, and why all of us keep putting ourselves out there, learning WordPress in public. Podcast Appearances March 20, 2023 🔗 Press the Issue: Openverse, Block Styling and WordPress 6.2 In this episode, Rob and Brian review the biggest new features of WordPress 6.2, the integration of the Openverse image library into WordPress Core, discuss whether “Full Site Editing” is really ready to move out of Beta, and whether the Openverse is proof that web privacy regulations have become a hindrance rather than a help… Podcast Appearances February 24, 2023 🔗 Torque Social Hour with Doc Pop Chatted with Doc Pop about viewSource, using GitHub Copilot, and what we think the world of AI might do to SEO and web development. Podcast Appearances November 16, 2022 🔗 In The Loop: Mastering Theme Development A fantastic conversation with Cory and Phil from In The Loop all about building custom WordPress themes in the Gutenberg era. Podcast Appearances November 11, 2022 🔗 Press the Issue: What’s Exciting about WordPress 6.1? Got to talk about all things WordPress 6.1 / Gutenberg with my good friend Teron Bullock. Next Page"
