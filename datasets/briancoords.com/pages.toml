full_description = "Livestream, Video Rebuilding my website with Ollie – LIVE Brian Coords March 13, 2024 A one hour livestream as I work through building my own personal blog (this very website) using the Ollie block theme. A one hour livestream as I work through building my own personal blog (this very website) using the Ollie block theme. A one hour livestream as I work through building my own personal blog (this very website) using the Ollie block theme. thanks for the recording. At some stage, I think about 46:00 minutes or so, you had problems too change the header as “Replace” in the sidebar would only change it for the template in the editor. It’s funny, but I stumbled over the very same problem some time ago when I tried Ollie, and ever since I have been editing the Header template part itself, delete all blocks and get the desired header by pulling in the appropriate pattern. But today I just installed 6.7 Beta 1 with TT5 and just for the heck of it selected the Header and tried to *replace* it in the sidebar. And to my surprise it was changed on *all* templates. Without notice. Without warning. Just like that. Do you have any idea when that behaviour changed in the Site Editor? What if I have a template that distinctly should have a different header? Yes I’ve seen them go back and forth on this in Gutenberg. The effects of changing these template parts are still unclear as is what the intended workflow they want us to use."
