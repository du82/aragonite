title = "Using Core Data and Sharing Context across WordPress Blocks - Brian Coords"
description = '''Extending WordPress blocks to talk to each other means using the WordPress Core Data packages, and hidden block features like "context". With tools like useSelect and useDispatch, we'll add a button to a core block that inserts new blocks into it's parent block.'''
full_description = "Tutorials, Video Using Core Data and Sharing Context across WordPress Blocks Brian Coords February 15, 2024 Extending WordPress blocks to talk to each other means using the WordPress Core Data packages, and hidden block features like “context”. With tools like useSelect and useDispatch, we’ll add a button to a core block that inserts new blocks into it’s parent block. Code: https://github.com/bacoords/wcphx-2024/tree/add-context-example Full Transcript Intro Welcome. So today we’re going to talk about data in the WordPress block editor. More like, how can I take data from one block and use it in another block or communicate across multiple blocks? And the tool that we’re going to use for this is called context. So to keep in mind, the block editor is a giant react app, which means that even though you’re doing something over here, something else is happening over there. And there’s a centralized data store. That’s kind of responsible for managing all of that data for getting content from the rest API and from your WordPress core, like your posts and your users and stuff, and showing up everywhere in the block editor, and and also handling things like the character and word count. If I update some content here, does it get updated up here? That sort of stuff. So those are the sorts of things that the block editors data storage packages are kind of always handling. And when you’re building custom block, sometimes you need to use that to trigger a change happening somewhere else. So let’s look at what the block is that we’re modifying and what we’re building with it. Our Block’s UI Needs So this past weekend, I presented a very fast tutorial on building custom blocks at WordCamp Phoenix. It should be available online at some point in time for you to see. And what we built was this kind of carousel. So you can see here, I have a little carousel block on the front end of my site. And the block is actually made out of other blocks. So the goal of this presentation was, can I make a block and just use other blocks inside of it to make it? And it was super handy. It’s actually one custom block, but inside of it is just additional media and text blocks, which sort of serve as the slides for your carousel. And so with the media and text block, you can kind of do everything where you can have some image on one side and some content on the other. And then we use our custom block to turn that into a carousel by loading additional assets. As I was building out, there were plenty of things that I wanted to do. The actual block itself that we built is pretty basic. It has some built in block supports like color and padding that you can use, and you can make it full or wide alignment, but that’s about it. But I thought it would be cool to add a button here in the toolbar of the block that’s basically add a slide. Because right now the only way to add a new slide is You can have to be down here and hit this little plus icon. And if you’re like, you know, focused anywhere else, you don’t really see it. It’s kind of a pain. So I thought it would be nice to, as part of the block toolbar, add another button that said, you know, add a slide. I also thought it would be cool if when you were in one of these media and text blocks inside, you also had an option to click that button and add a slide. And that’s where these sort of things start playing in because now what do I need to do? I need to You know, know if I’m inside of my carousel, I need to add a button. I need that button to do something somewhere else by adding a block later in the block editor, all that sort of stuff. So it’s all possible within the block editor. It’s just there’s not great examples of how you would do this sort of thing. So that’s what we’re going to do. We’re going to first add a button here and just inject a block. And then we’re going to do the extra step of adding a button to the media and text block. Only when it’s inside of our carousel, it can’t be just any media text block has to be in our carousel. And then I’m going to use that to inject a new slide and it’ll just make a little nice extra UI. So let’s dig into the code. Our block scaffold This is a custom plugin using the WordPress create block scaffold that basically built our block for us and I won’t go through how we made the inner block, but you can kind of see here that in the Block. json of our file. We didn’t really have to do too much. We just added some block supports and in the edit. js we’re using this use inner blocks, props component to basically determine like that. We’re only allowed to have media text blocks inside and we set some custom attributes and stuff. So I’m going to that, to this video I’ll just show that, you know. A block with no other blocks inside of it is a really simple block. There’s not a lot going on. These are pretty quick to spin up. I usually use like a template that just, I just kind of copy this and change what I want and change some attributes. And it’s a very fast way to get a block with other blocks inside of it. But we’re going to make it more complicated. The BlockControls Component So the first thing we need to do is we need to add block controls. Block controls are this toolbar here. So we’re going to add block controls to our block and inject a button. Let’s import block controls from the block editor. And while we’re importing, let’s also import. What would we need? We need toolbar group and toolbar buttons. So you can see co pilots kind of suggesting some stuff for us. So block controls is basically like a slot fill where anything we pass inside of it will show up. And then these are some components from the WordPress components package that are going to basically build out the UI for us. So let’s come over here. We don’t really want to break this. I love how simple this is. So we’re just going to make a little fragment and move it like that. And then we’re going to add our block controls. And so anything we put between those two tabs will basically show up on that toolbar. There’s another one you’ve probably seen called inspector controls that puts anything in the sidebar. We want ours in the toolbar. So we’re going to add a toolbar group. And let’s set that and then we’re gonna add our toolbar button. So co-pilot’s recommending some stuff for us. Let’s yeah, let’s take it, but get rid of it. I don’t want all that. Maybe, maybe we’ll just turn co-pilot off. I feel like you’re getting in the way. So we have toolbar group. We have our toolbar button and to our button. Actually, we’re not gonna self close. You we’re gonna. Just give you some text and say add slide, close you out, and we’re going to add an on click. So basically this is kind of like any other sort of button component, there we go. On click insert slide. Let’s save that. Yeah, that looks pretty good. So in our block controls, we’re adding a new group of buttons. We’re adding a single button that says. Add slide. And when you click it, it’s going to run this insert slide function. And so I’m just going to define the function so it doesn’t yell at me. But we’re not going to actually do anything. Just do that. Okay. Now the function exists. Okay. So let’s see if our button showed up. Let’s hit our Media Text carousel and there’s our button, add slide, showing up in the toolbar of our custom block. I can see there’s a little semicolon down here, which is probably something I did in the JavaScript. Let’s find out. Yep. A little semicolon left, right there after the div. All right. JSX. So much fun. Okay. InsertBlock and useDispatch So now we just need to insert the slide. This is where things get a little tricky, right? Because we need to basically, instead of something that’s inside of our block, we’re trying to make something happen outside of our block. So that’s when the core data WordPress, like data store stuff comes in handy. This is what we’re going to do. So we’re actually going to get a function called insert block. That’s going to come out of use dispatch from the core slash block editor store. So let’s break this down. Use dispatch. Is basically a way to send information to the block editors store. So you might’ve used use select in the past, and we’re going to use that a little later on. That’s where you select some information and dispatches where you send changes to information. And the way that, you know, data stores work is like, they’re kind of responsible for handling all of the intricacies and making sure your data here doesn’t break data there. Dispatch was going to handle making that change for us. So we just need to import use dispatch. And that’s going to come from the WordPress slash data package. When you have GitHub co pilot turned off, that is the one thing I do miss the autocomplete on the imports, which is like 90 percent accurate. Okay. So we’re going to import use dispatch. Sometimes you have to import like a store if you have a custom store, but when you’re using a core store like this, you can just pass that. So we’re saying, Hey, this is the store. And so inside of use dispatch, there’s a function called insert block that we get to use. Why don’t we pull up the documentation real quick to see where this comes from? This is in the WordPress developer handbook in the reference guides and the data module reference. So there is this data module. Those are all those kinds of custom data stores and different ones. There’s different ones that are available. Some have more to do with like content on your site. So like getting like, like. Things like that. This one has to do with the block editor itself, like the interface, the UI, like I want to make changes to things in the interface, not, you know, changes to the, you know, post content on my blog or something like that. So there’s all sorts of these things. There’s a bunch of selectors. We’re definitely going to use some of those in a bit. And then if you go down, there’s a bunch of these actions like insert block and that’s what we’re going to do. So we’re going to. Get this insert block function from the dispatch, and then we’re going to run it to insert a block. So this is going to happen in our insert slide. Now that we have the function available, we can run it. So if somebody clicks insert slide, we want to run insert block, and then we’re going to have to pass it a few parameters. If you go to the documentation, they will give you some parameters. I would love to see all of this turned into like a real documentation with like actual code snippets and examples and stuff, but there’s just a lot that needs to get done. Right? So these are the parameters we need to pass it. I’m just going to show you a few things. So the first thing we have to pass it is an actual block that we want to insert. And for that, we actually have to use a function called create block. And our create block is actually very similar to what’s happening in the template where, let me see, I don’t think I need this. Where I, you can sell like there’s some ways where there’s like name and act like some ways are different. Not a lot of consistency, a lot of trial and error, a lot of reading documentation and finding examples. But what we’re basically saying is create a block and. Here’s the type of block and here’s the attributes. So it’s a very similar to this template function right here. And that’s the first parameter of insert block is just passing the block. And one last thing we do have to import create block as a function. That’s going to come from WordPress slash blocks. So there’s a lot of little pieces you have to pull, like I need to get. Stuff from the block editor for my controls. I need a function from the data that I can use to dispatch changes. I need a function from the blocks package that’ll help me create a block. And then I need, you know, to pull out another function from that dispatch. So a lot of this stuff takes a lot of practice and a lot of research to kind of figure out, but once you do get it it does start to make a little bit more sense. So. Insert block, let’s get back to here. I’m going to make a new line just to make it a little easier to read, even though the prettier is going to take care of it for me. So let’s go back to insert block. So we need to know an index, the number at which the block should be inserted. I’m just going to pass zero for now. So when we push this button, it’s going to insert the block at the top. It’ll be the new first slide. And then it needs to know the root client ID. So if I don’t tell it where to insert the block, it’s actually just going to insert it, the, like into the main content, like at the top level, but if I want to insert it as a child block, then I need to pass it kind of a context. And so what I need to pass it is called the client ID. And that’s the unique ID that’s for any block that you’re in. So every block has this unique ID in the editor. It changes. It might not always be consistent, but in this context of this editor right now. I can do that. So the block that I’m in, I’m just going to pass props. I’m going to get the client ID for the block I’m in. And so what I’m saying is here’s my props. What I want to do is create a block, put it first and make its parent, the client ID of the block that I’m currently in. And then that should actually do the function of creating this block right here. So let’s test it out. See if I did it all right. There’s a lot of weird things to import and hopefully we got it. Okay. So I hit my media text carousel. You can see there’s already two slides in here and if I hit add a slide, Ooh, nice. So it adds it underneath this right here has the next, you know, piece of content in, in our editor. So that’s the kind of quick, easy adding a block inside of the block that you’re already in. Overall I would say it’s not too bad once you find the names of all of the functions. But once we figured out that we can call the insert block function, which will dispatch to the core block editor data, and we can pass it a block that we’re creating, we can say which order we want it to be in. And we can just say where in the tree we want it to show up. Pretty simple. Only a few imports that we had to do and very simple UI with a button. So that’s the first step is going to be that. But what about the next step? What if I’m in a media and text block and I want to add a button here to this other block? I can’t do that in my block here. I have to do that through filters. So let’s take a look at how that works. Filtering a Core Block’s Attributes So in order to modify the other blocks that aren’t part of this block, we’re actually going to need really some separate JavaScript, because it’s not going to be anything we do inside of this block here. So because it’s all one build process and because things kind of work together easily, what I’m going to do is I’m going to make a new file and I’m going to call it filters dot JS. I’m going to keep it in my so"
