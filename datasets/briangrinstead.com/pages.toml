full_description = "About This site is mostly about my work as a developer on Firefox and other projects. The easiest way to get in touch is to email [email protected]. Also, as bgrins on github, linkedin, matrix. Here's a blurb about me: Brian Grinstead is a senior principal engineer at Mozilla, where he works on improving the web alongside engineering teams at Mozilla and with colleagues across the industry. He joined Mozilla as an experienced web developer in 2013 to help launch Firefox DevTools, and has worked on thousands of changes to the browser since, including shipping Developer Edition and leading a major refactor of the Firefox UI. He's recently been focused on web performance: working together with all major browsers to ship the Speedometer 3 benchmark. And here are some projects from over the years: Improving Performance in Firefox and Across the Web with Speedometer 3 XBL to Web Components migration in Firefox: posts tracking the refactor on firefox-dev from 2018-2020. TinyColor: a widely used no-dependency color parsing library for JS. And the companion Spectrum Colorpicker, derivatives of which eventually shipped in devtools in Chrome, Firefox, and Safari. Various utilities: Browser-based diff tool, CSS Gradient Generator, Color scheme generator, Instant Sprite (CSS sprite generator), iOS UIColor Picker, test pages for DevTools features Various libraries: FileReader.js (for reading files in a web page), DevTools Snippets, videoconverter.js, ExpandingTextareas, nativesortable (no dependency drag/drop), bindWithDelay Plugin, jQuery UI Anglepicker, A* graph search in JavaScript, C# Multipart Form Post"
