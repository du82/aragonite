["https://brianlovin.com/app-dissection/stripe-dashboard-ios"]
title = "Stripe · App Dissection"
description = """
[Stripe](https://stripe.com) is well known for their level of interaction polish and attention to detail. It's clear to see the amount of labor and love that goes into their products; from landing pages to mobile apps, everything they release seems to ignite a collective gasp within the design community.

[Stripe Dashboard](https://stripe.com/dashboard/iphone) launched in the middle of last year with well-deserved recognition. It's a relatively simple app that can help business owners keep track of their customers and income on the go. The app doesn't offer nearly as much functionality as the web dashboard counterpart; intentionally, of course. It serves a clear purpose and executes on that purpose beautifully.

Below are some of my favorite design details from Stripe Dashboard on iOS."""
full_description = "Stripe is well known for their level of interaction polish and attention to detail. It's clear to see the amount of labor and love that goes into their products; from landing pages to mobile apps, everything they release seems to ignite a collective gasp within the design community. Stripe Dashboard launched in the middle of last year with well-deserved recognition. It's a relatively simple app that can help business owners keep track of their customers and income on the go. The app doesn't offer nearly as much functionality as the web dashboard counterpart; intentionally, of course. It serves a clear purpose and executes on that purpose beautifully. Sidebar: A few years ago I ran a small side project. Towards the end of that project I explored using Stripe as a way to accept payments online. So fortunately I have an account with a few transactions here to demonstrate the app. Stripe is one of the few companies that continues to push the use of shadows, highlights and depth in their applications. This, combined with intentional animations and clean transitions, feels a bit like the halfway point between iOS 6 and 7. Not purely-flat. Not overly-embellished. It's also worth noting that there's no registration here, or walkthroughs or superflous messaging. This app is for existing users and there's no need for Stripe to add extra complexity here by trying to onboard prospects. Microinteractions like these add value to the entire user experience. Rather than being jostled around with static view changes, Stripe helps introduce people to their dashboard with motion. Animation also buys Stripe time to load data in the background while preserving an experience that feels snappy and responsive. Stripe makes parsing graphs effortless. The information is clear and concise, conveyed with just a few elements on the screen. I love the custom loader here, complimenting the blue gradients used throughout the app. This video demonstrates navigating between the tabs within my Activity pane. We're also introduced to perhaps the most unique view hierarchy I've seen in an app like this: cards. More on this next..."
