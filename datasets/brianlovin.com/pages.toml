["https://brianlovin.com/app-dissection/paper-facebook-ios"]
title = "Paper · App Dissection"
description = """
[Paper by Facebook](https://itunes.apple.com/us/app/paper-stories-from-facebook/id794163692) has been out for a day now and the reviews are, for the most part, [quite divided](https://news.ycombinator.com/item?id=7171808). I haven’t been an avid Facebook user for some time, but the design and attention to detail on Paper is unmatched, and is worth sharing with other designers.

The [Design Details for Twitter](http://blog.brianlovin.com/hidden-twitter-interactions) post I wrote yesterday received some great feedback, so I thought I’d quickly compile some of my favorite interactions in Paper!"""
full_description = "Paper by Facebook has been out for a day now and the reviews are, for the most part, quite divided. I haven’t been an avid Facebook user for some time, but the design and attention to detail on Paper is unmatched, and is worth sharing with other designers. The Design Details for Twitter post I wrote yesterday received some great feedback, so I thought I’d quickly compile some of my favorite interactions in Paper! Notice the ‘hamburger’ menu flipping into an X, with the most subtle bouncing effect. I love the slight delay on the sliding animation as my pages and groups come into view. Just about every popup or menu in Paper can be closed by pulling up or down when there’s no more room to scroll. You can see this implemented on the publicity setting here when composing a new post. Just about every heading or title in Paper has this beautiful shine effect to it, which reminds me of iOS’s ‘Slide to Unlock’ text. Turns out that this shine doubles as a loading indicator. Watch this one a few times and pay attention to everything going on. When you pull down, the background slides down just a tad, the arrow at the top of the message bubble stretches and ‘pops’, and everything bounces lightly back into place. Amazing. I noticed that as you’re opening a card to view a webpage, Paper starts to load things in before you’ve fully expanded the card. This beautiful little bit helps keep browsing fluid and fast. Again, pay attention to the light bounces in different parts of this view as you flip a web page closed. Did you see that little sheen of light go across the top of the card as it closes? Stunning. This one was highlighted in Paper’s debut demo video, and has certainly gathered a lot of attention. I love the small scroll bar that shows your current position on the photo. Someone has already replicated this effect with HTML/CSS/JS – here’s the tutorial. No animation in Paper is jerky or unrefined. When I start to type out a search, notice the subtle fading in and out of the various elements on the page?"
