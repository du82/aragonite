["https://brianlovin.com/app-dissection/quartz-ios"]
title = "Quartz · App Dissection"
description = """
Last week [Quartz debuted a clever little app](http://qz.com/613700/its-here-quartzs-first-news-app-for-iphone/) to deliver news unlike anything I’ve used before. It’s a conversational app which creates a delightful and simplified way to stay up to date on the latest stories. I have to also assume that there’s some hidden AI here that will slowly learn my preferences and improve its recommendations over time.

On the whole I’m skeptical, yet optimistic, about conversational interfaces like this which attempt to guess and learn about my preferences. I know that it’s only a matter of time before AI gets good enough to know me as well as it should, but at the present it’s quite rudimentary.

For Quartz’s new app, the lack of choice and customization is simultaneously constraining and liberating. On the one hand, I don’t have to wade through dozens of clickbaity headlines to find content relevant to me; instead, Quartz gives me one suggestion at a time that it thinks I’ll like. On the other hand, if you see a few stories in a row that don’t quite meet your taste, it becomes incredibly easy to dismiss the app and never check back.

All told, I think many people will enjoy the spontaneity offered by the lack of choice, leaving their news delivery up to whatever AI Quartz has running on the backend."""
full_description = "Last week Quartz debuted a clever little app to deliver news unlike anything I’ve used before. It’s a conversational app which creates a delightful and simplified way to stay up to date on the latest stories. I have to also assume that there’s some hidden AI here that will slowly learn my preferences and improve its recommendations over time. On the whole I’m skeptical, yet optimistic, about conversational interfaces like this which attempt to guess and learn about my preferences. I know that it’s only a matter of time before AI gets good enough to know me as well as it should, but at the present it’s quite rudimentary. For Quartz’s new app, the lack of choice and customization is simultaneously constraining and liberating. On the one hand, I don’t have to wade through dozens of clickbaity headlines to find content relevant to me; instead, Quartz gives me one suggestion at a time that it thinks I’ll like. On the other hand, if you see a few stories in a row that don’t quite meet your taste, it becomes incredibly easy to dismiss the app and never check back. All told, I think many people will enjoy the spontaneity offered by the lack of choice, leaving their news delivery up to whatever AI Quartz has running on the backend. Let’s start: Quartz has created one of the most unique onboarding experiences I’ve ever seen. No splash screen. No signup or login flow. Instead, the app “talks” to you and guides you through a lightweight setup to turn on notifications and explains how to adjust your settings. There’s no chrome to be seen here, which at first felt foreign and out of place. It’s one of the rare times that it feels appropriate to break the HIG and truly bury settings and preferences in favor of creating a 100% immersive UI. There’s one thing that I can’t quite get comfortable with, however: the fake typing indicator, while enjoyable the first 2-3 times, is way too robotic and stale. For first-time use, it helps to set the context that this is a conversational app, but after seeing several articles it slows down the flow of information. The timing is metronomic, which doesn’t work out when the bubbles contain varying lengths of text."
