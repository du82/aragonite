title = "Hyperlapse · App Dissection"
description = """
[Hyperlapse](https://itunes.apple.com/app/id740146917) is the latest and greatest app to hit the App Store; many of you have already tried it, I’m sure. Yesterday’s [Wired](http://www.wired.com/2014/08/hyperlapse-instagrams-new-app-is-like-a-15000-video-setup-in-your-hand/) piece likens the app to a $15,000 video setup in the palm of your hands – a bold label, indeed.

In this post I will explore the wonderful level of polish and style that Instagram’s designers have poured into Hyperlapse. The app is beautifully simple – almost to the point of confusion, where one might ask themselves: “Is this it?”

Yes, this is it. And that’s the point.

Let’s dive in…"""
full_description = "Hyperlapse is the latest and greatest app to hit the App Store; many of you have already tried it, I’m sure. Yesterday’s Wired piece likens the app to a $15,000 video setup in the palm of your hands – a bold label, indeed. In this post I will explore the wonderful level of polish and style that Instagram’s designers have poured into Hyperlapse. The app is beautifully simple – almost to the point of confusion, where one might ask themselves: “Is this it?” What better way to onboard someone into a new app than to instantly share some of the beautiful creations they’ll be able to make? Hyperlapse nails this part, highlighting the function of the app in a concise and tasteful way. My only negative note here is that the dots at the bottom of the screen (which indicate your current page) are really hard to see. I can imagine some folks getting stuck here waiting for something to happen without realizing they need to swipe left. Also of note: pay attention to the rounded corners of the app, throughout. A very small and subtle touch (that admittedly looks much sharper against the bezel of the iPhone) which adds a tasteful splash of character. Blurring and springy physics (as we’ve come to expect from any Facebook-affiliated app) are a common thread that weave their way through the entirety of the Hyperlapse experience. Here, we initiate the app by giving permission to access the camera (which I’ve done prior to this recording). Note the responsiveness of the button to my touch, the way the video pauses and blurs, and of course, the way the tutorial tooltip springs into action. I hope a developer/designer at Instagram might chime in here and shed light on this particular detail: when the camera hits a certain field of view, the ring around the record button switches from black to a colorful rainbow. This change is a bit obscure; I’m not sure why the color is changing at all. I found the ambient light sensor to frequently flash this tooltip, even though I’m clearly pointing at a well-lit environment (in this case, I’m outside in the afternoon). For the sake of this post, however, I’m glad to see this error – the contextual tooltip that shows can serves as a friendly guide to help users get the most value from the app."
