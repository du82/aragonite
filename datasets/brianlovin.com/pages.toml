["https://brianlovin.com/app-dissection/pinterest-ios"]
title = "Pinterest · App Dissection"
description = """
[Pinterest](https://itunes.apple.com/us/app/pinterest/id429047995?mt=8&utm_medium=login_desktop&install_id=3bde228666804501b0b3b81bc79aa148) is an app I wish I could use more. I’ve never quite found my stride on the platform despite following several boards dedicated to design, UI and UX. Regardless of my own lack of engagement, there are millions of folks out there that use Pinterest every day to organize, plan, inspire, design, build and dream. There aren’t too many products out there that offer such a wide variety of benefits, despite offering the same feature set across the board. I love that.

Pinterest, in addition to being a wonderful utility for so many people, is shipping some of the best design in the world. They have a quiet, soft and unassuming interface across web and iOS that remains out of the way and lets people focus on their own individual needs. In this Design Details post I’ll explore a few of the wonderful interactions in Pinterest for iOS – enjoy!"""
full_description = "Pinterest is an app I wish I could use more. I’ve never quite found my stride on the platform despite following several boards dedicated to design, UI and UX. Regardless of my own lack of engagement, there are millions of folks out there that use Pinterest every day to organize, plan, inspire, design, build and dream. There aren’t too many products out there that offer such a wide variety of benefits, despite offering the same feature set across the board. I love that. Pinterest, in addition to being a wonderful utility for so many people, is shipping some of the best design in the world. They have a quiet, soft and unassuming interface across web and iOS that remains out of the way and lets people focus on their own individual needs. In this Design Details post I’ll explore a few of the wonderful interactions in Pinterest for iOS – enjoy! I’d love to start exploring more onboarding experiences for different apps. Onboarding and user activation is an incredibly nuanced and challenging problem for designers, and it’s an ever-evolving process to understand and improve the experience for people new to a product. I really appreciate what Pinterest does – both on their app and website – with their new user experience. The focus here is entirely on benefits, not features. They don’t talk about pins, sharing, social media, et cetera. No – they talk about how people are using the app to solve real challenges or problems in their lives. The panning images here, accompanied by the simple value statements, make for a compelling (and intriguing) experience. I’m biased towards apps that don’t hesitate to break away from default iOS design patterns, yet still retain usability and clarity. Here, Pinterest’s search filters add a nice touch that separates themselves from the standard iOS toggles. After exploring the app for some time, you start to notice the subtle things that make the product so enjoyable to use. Subtle transitions, entrances and the use of fading elements helps create this incredibly smooth experience for users. There’s not too many instances of sudden, static state changes that I was able to find anywhere in the app."
