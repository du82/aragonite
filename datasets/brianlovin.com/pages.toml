title = "Path · App Dissection"
description = """
[Path for iOS](https://itunes.apple.com/us/app/path/id867760913) has long been associated with beautiful design and having an obsessive attention to detail. Despite slow adoption by the general public – which actually appears to have grown in recent months – I’ve found that Path has always been an under-appreciated and overlooked product. While I can’t call myself a heavy user, I’m a huge fan of any team that puts so much passion and love into their work.

Path had a pretty big launch last week, unveiling a new standalone messaging app to accompany their flagship Path app. For me this was a clear reminder that Path deserved a spot here in the Design Details series. I hope you all enjoy these videos – give me a shout if I’ve overlooked anything!

And of course, give the designers of this beautiful app a follow: [Dustin Mierau](https://twitter.com/dmierau) and [Ed Kim](https://twitter.com/edmuki)."""
full_description = "Path for iOS has long been associated with beautiful design and having an obsessive attention to detail. Despite slow adoption by the general public – which actually appears to have grown in recent months – I’ve found that Path has always been an under-appreciated and overlooked product. While I can’t call myself a heavy user, I’m a huge fan of any team that puts so much passion and love into their work. Path had a pretty big launch last week, unveiling a new standalone messaging app to accompany their flagship Path app. For me this was a clear reminder that Path deserved a spot here in the Design Details series. I hope you all enjoy these videos – give me a shout if I’ve overlooked anything! Path wastes no time delighting new users with their popup design language. The light bouncing in and fading out makes these modals feel so alive. Just wonderful – we’ll see a few more instances of this style being used in all parts of the app. +1 for consistency! This onboarding flow is so slick! No extra fuss or unneeded messaging – just a few simple steps to get started, the modal fades away, then users are greeted with this simple interface and tooltip on the main share button. You can tell how much time the designers put into the small details here – especially the language on the tooltip. Create a moment – this introduces new users to this process of sharing moments, not fluff. This isn’t where you share your latest score on Candy Crush, no – it’s a place to share moments with your friends. I like that. I remember when Path first came out – this popout sharing button captivated users and designers alike. I remember staring at the screen just asking how on Earth did they do this!? Path’s most recent update brings some minor changes to this design detail, but the feel remains very much the same. Tapping the ‘+’ button opens a flyout menu of all the various types of content you can share on Path. The icons playfully bounce outwards, spinning simultaneously. Sure, it might take a bit longer to cycle through the animations here, but the added delight it provides new users is invaluable."
