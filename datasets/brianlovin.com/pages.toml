["https://brianlovin.com/app-dissection/flickr-ios"]
title = "Flickr · App Dissection"
description = "[Flickr for iOS](https://itunes.apple.com/us/app/flickr/id328407587?ls=1&mt=8) dropped a major update late last week. It’s an impressive redesign worthy of attention from photographers and designers alike. I’m excited about Yahoo’s renewed energy in the mobile space, and judging by the work that went into this update, it’s clear that their designers aren’t cutting any corners."
full_description = "Flickr for iOS dropped a major update late last week. It’s an impressive redesign worthy of attention from photographers and designers alike. I’m excited about Yahoo’s renewed energy in the mobile space, and judging by the work that went into this update, it’s clear that their designers aren’t cutting any corners. I’ll kick things off with a small detail: the pull to search interaction. It’s really, really smooth on the app and I’m not sure the gif captures this very well. I love the subtle fade in, almost like it’s gently popping to the surface of the screen. Some Flickr designer out there came up with this genius pull to refresh animation, and I can’t get enough of it. It breaks the mold from every other iOS app, and plays so nicely with Flickr’s logo. We’ll see more of this in later views. If you thought iOS7 took the frosted glass look to the limit, just wait until you get your hands on Flickr. They really hit you hard with the gentle blurs, glass effects and context-aware coloring. This style is tastefully done, and seems to work so well for a photography app. My animation capture doesn’t quite do the app justice in this case – I recommend grabbing the app to see this interaction really come to life. Flickr has built a really consistent animation for opening secondary views – it’s a nice blur/pop effect that (while admittedly glitchy at times) feels quite nice. I think they’ll smooth this out in future versions, but even now it’s a very snappy, responsive interaction. The animation for favoriting/unfavoriting a picture is a nice touch that adds so much to the entire polish of the app. Very nicely done. The follow button interaction here feels so great. It’s a wonderful animation that’s playful, but doesn’t feel like it’s wasting your time. I actually said “whoa” out loud the first time I came across this detail. I’m in love with this animation – it’s more complicated than a pull-to-refresh ever needed to be, but this delightful experience adds so much to the entire app. Bravo, Flickr."
