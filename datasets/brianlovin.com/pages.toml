["https://brianlovin.com/app-dissection/skype-ios"]
title = "Skype · App Dissection"
description = "[Skype for iOS](https://itunes.apple.com/us/app/skype-for-iphone/id304878510?mt=8) released their 5.0 update for iOS last week. As a heavy Google+ Hangouts/Facetime user, Skype has been outside of my product radar for quite some time. Despite my lack of familiarity, Skype’s update shows an incredible amount of polish and attention to detail that designers out there will enjoy!"
full_description = "Skype for iOS released their 5.0 update for iOS last week. As a heavy Google+ Hangouts/Facetime user, Skype has been outside of my product radar for quite some time. Despite my lack of familiarity, Skype’s update shows an incredible amount of polish and attention to detail that designers out there will enjoy! Skype has adopted this really slick new design pattern for navigations and menus. This video captures the moment when you go to upload a new profile photo – notice the bounce and stretched corners of the menu as it pops into view. You might need to watch this one a few times to catch everything going on during the login flow. Starting with a really slick loading indicator, Skype has built a really solid feel to their “first view” flow. Once you hit the dashboard of the app, several elements bubble in – the navigation slides in from the right and the clouds pop up in the background while your profile picture bounces into view. It’s a lot of simultaneous movement, but it gives a very satisfying feel to the app. This video is just another crisp example of Skype’s menu-display design pattern. To be honest, I’m a bit torn on this one – I love the playfulness of the animation, however after moving around the app for a while it makes certain interactions feel quite sluggish. It’s a tough tradeoff here to get the interaction elements + navigation speed just right; I’m excited to see what Skype’s design team will iterate upon here :) Here’s another really slick design pattern that Skype has put into place across the app. When you switch views, the new one bounces into place – if you look really closely, you can actually see the new view overextend to the left before settling back in within the screen boundaries! This will be easier to notice on your phone, with the screen’s bezel providing contrast against all the white on the screen. One other thing to notice is the way the old view fades away into the background, almost falling away behind the new view. It’s such a fast and subtle detail, but adds up to create the overall experience for users."
year_published = 2025
