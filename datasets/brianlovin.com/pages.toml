["https://brianlovin.com/app-dissection/soundcloud-ios"]
title = "SoundCloud · App Dissection"
description = """
I use SoundCloud…a lot. As in, all the time, every day. I’ve been using it to [curate](http://www.mvsic.co/) new music for a few years now, and it’s been so fun to watch the platform evolve with each passing week. I admire SoundCloud’s ability to ship new features and improvements so often, striving to make the site faster and easier to use for everyone.

The SoundCloud team recently redesigned their iOS app – a surprising refresh of their mobile offering with a slick new listening interface and a beautiful new way of interacting with your music.

So far the reviews of the app have been overwhelmingly negative. The app currently sits at a 2.5 star rating on the App Store, and [some folks](http://blog.soundcloud.com/2014/06/26/the-new-soundcloud-iphone-app/) are diving [pretty deep](https://medium.com/@padschneider/the-new-soundcloud-app-sucks-bcbd77f0e8fd) into why the new app is a flop. The further I dig, the more it’s clear that this redesign was [intended for listeners](http://hypebot.com/hypebot/2014/06/soundcloud-throws-out-baby-with-bathwater-nice-app-design-but-musicians-feel-screwed.html), not for the musicians who represent the backbone of the service.

For the sake of this post, I’m going to focus purely on the new interactions and design elements – not on the relative merits of the feature offering (or lack thereof) in the new app. I hope this works for everyone out there!"""
full_description = "I use SoundCloud…a lot. As in, all the time, every day. I’ve been using it to curate new music for a few years now, and it’s been so fun to watch the platform evolve with each passing week. I admire SoundCloud’s ability to ship new features and improvements so often, striving to make the site faster and easier to use for everyone. The SoundCloud team recently redesigned their iOS app – a surprising refresh of their mobile offering with a slick new listening interface and a beautiful new way of interacting with your music. So far the reviews of the app have been overwhelmingly negative. The app currently sits at a 2.5 star rating on the App Store, and some folks are diving pretty deep into why the new app is a flop. The further I dig, the more it’s clear that this redesign was intended for listeners, not for the musicians who represent the backbone of the service. For the sake of this post, I’m going to focus purely on the new interactions and design elements – not on the relative merits of the feature offering (or lack thereof) in the new app. I hope this works for everyone out there! Okay so this interaction is a bit jerky, with a strange black flash. I believe that’s being caused my recording software, so I won’t hold it against SoundCloud. If there’s anything I think we can take away from SoundCloud’s redesigned iOS app is the total, focused and uninterrupted prominence of listening to music. Notice that when I start playing a song, the album art fills my screen and SoundCloud’s signature waveform bubbles into view. It’s insanely minimalistic and clean, which, depending on how you use SoundCloud, is either a major win or an abysmal let-down (i.e. no more commenting). The last I heard, the SoundCloud team has intentionally stripped away features from the app and will revisit them in time. How about this: no more fumbling for the play/pause button while you’re driving down the road. No more tapping aimlessly on the bottom of your phone to try and navigate through your music."
