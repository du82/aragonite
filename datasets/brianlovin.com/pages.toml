["https://brianlovin.com/app-dissection/foursquare-ios"]
title = "Foursquare · App Dissection"
description = """
[Foursquare](https://foursquare.com/download) is entering a new era. The long-time check-in service has undergone a radical redesign and reposition with its 8.0 release for iOS. No longer is Foursquare an app to check in at your favorite places and keep tabs on your friends – no, it’s now attempting to become the de facto recommendation engine for food and entertainment. The Verge has [explained this repositioning](http://www.theverge.com/2014/8/6/5973627/foursquare-8-review-the-ultimate-food-finder) quite clearly: The new app cuts through Foursquare’s massive corpus of data to answer one question: what if your food-finding app knew your favorite restaurants, but also your favorite foods?

Regardless of where you turn to find the best restaurants in your area, it’s no question that Foursquare is making a bold move into the arena dominated by the massively-popular Yelp. The 8.0 version of their iOS app takes this bold move quite seriously, bringing in a wonderfully simple and clear redesign."""
full_description = "Foursquare is entering a new era. The long-time check-in service has undergone a radical redesign and reposition with its 8.0 release for iOS. No longer is Foursquare an app to check in at your favorite places and keep tabs on your friends – no, it’s now attempting to become the de facto recommendation engine for food and entertainment. The Verge has explained this repositioning quite clearly: The new app cuts through Foursquare’s massive corpus of data to answer one question: what if your food-finding app knew your favorite restaurants, but also your favorite foods? Regardless of where you turn to find the best restaurants in your area, it’s no question that Foursquare is making a bold move into the arena dominated by the massively-popular Yelp. The 8.0 version of their iOS app takes this bold move quite seriously, bringing in a wonderfully simple and clear redesign. The pull-to-refresh interaction has become a universally-known gesture for smartphone users. Being so universal provides a hidden challenge for app designers: how do we stand out? Foursquare has embodied a clear simplicity in this detail – a pulsating ring, honing in on your location. I love how smooth this detail is – the way the ring fills and expands as you pull down, springing to life once released. In previous versions of Foursquare, users needed to request permission to follow someone else. The nature of checking in and broadcasting your location necessitated a higher level of privacy for its users. With Foursquare’s latest shift, the emphasis is no longer on check-ins, but on recommendations. For this reason, following someone else no longer requires permission and is a low-barrier action that Foursquare hopes people will find useful. This detail is small, but worth noting: when following someone (or…something perhaps), the transition of the checkmark element is quite slick. It’s certainly not a deal breaker, but I wish that there was an equal level of polish whenever I stopped following someone, rather than having such an instant, static state change."
