["https://brianlovin.com/app-dissection/instagram-ios"]
title = "Instagram · App Dissection"
description = """
Ah, Instagram. I’ll venture a guess that 99% of folks reading this have used Instagram at some point in their lives. It’s the app that changed the way we share photos with friends and followers and in a few short years has become a key tool in the app-arsenal of more than 300,000,000 people.

Instagram is one of the most beautifully designed apps in the world. That’s my opinion, of course, although it would be quite the challenge to argue against the product’s unrelenting focus on keeping it simple. Other apps in the photos space emphasize features and technology while Instagram just gets out of the way and lets you enjoy great pictures.

I had never really considered Instagram for a Design Details post for this exact reason: most of it is just obvious. Of course, obvious design is the hardest design, so that’s not a knock against the talented team working on Instagram (promise!). Instead, I mean that this feels like an app whose clarity and focus needs no further explanation.

Nonetheless, I decided to investigate. Buried among Instagram’s streams of beautiful photos I’ve scoured up a solid handful of wonderful details that add a next-level layer of polish to the entire product. Enjoy!"""
full_description = "Ah, Instagram. I’ll venture a guess that 99% of folks reading this have used Instagram at some point in their lives. It’s the app that changed the way we share photos with friends and followers and in a few short years has become a key tool in the app-arsenal of more than 300,000,000 people. Instagram is one of the most beautifully designed apps in the world. That’s my opinion, of course, although it would be quite the challenge to argue against the product’s unrelenting focus on keeping it simple. Other apps in the photos space emphasize features and technology while Instagram just gets out of the way and lets you enjoy great pictures. I had never really considered Instagram for a Design Details post for this exact reason: most of it is just obvious. Of course, obvious design is the hardest design, so that’s not a knock against the talented team working on Instagram (promise!). Instead, I mean that this feels like an app whose clarity and focus needs no further explanation. Nonetheless, I decided to investigate. Buried among Instagram’s streams of beautiful photos I’ve scoured up a solid handful of wonderful details that add a next-level layer of polish to the entire product. Enjoy! Let’s start nice and simple – this is probably one of my favorite pieces of the Instagram app. When you scroll the top menu bar gets out of the way, scaling nicely back into the distance. I could see an argument both ways for adding the same treatment to the bottom tab bar, but I suppose a focus on UX might mean keeping the bar perma-present. If you press + hold the search icon in the bottom toolbar it will spring you straight to the search input. It’s a nice way to save users an extra tap, but more importantly it means people don’t have to readjust their hands in order to tap the search bar. It’s the small things, everyone. Don’t underestimate how far subtle touch responses can go to make a UI feel great. In this case the follow buttons bounce and scale ever so slightly on-press which gives users a nice tactile response and feeling of depth."
