title = "Inbox · App Dissection"
description = """
It’s always big news when the Google machine unveils a new product. This week that something new is called [Inbox](http://www.google.com/inbox/), and it’s a slick rethinking of how we interact with and handle an ever-increasing volume of email.

[Google’s Design Team](https://twitter.com/googledesign) has put in hard work these past months. Crafting the Material design language and rolling out interface updates across a suite of apps and operating systems is no small feat. Inbox embraces Material Design wholly, resulting in a beautiful, cohesive application for iOS, Android and web (Chrome only, for now).

This Design Details will explore some of the beautiful interactions in Inbox, as well as investigate a couple UX quirks that leave me wanting to learn more."""
full_description = "It’s always big news when the Google machine unveils a new product. This week that something new is called Inbox, and it’s a slick rethinking of how we interact with and handle an ever-increasing volume of email. Google’s Design Team has put in hard work these past months. Crafting the Material design language and rolling out interface updates across a suite of apps and operating systems is no small feat. Inbox embraces Material Design wholly, resulting in a beautiful, cohesive application for iOS, Android and web (Chrome only, for now). This Design Details will explore some of the beautiful interactions in Inbox, as well as investigate a couple UX quirks that leave me wanting to learn more. Material Design is a visual language for interacting with digital interfaces. What we find in Inbox is a whole-hearted adoption of subtle motion and gestures to guide users through flows and views. This splash page sets the tone perfectly for what users can expect in terms of interactivity, playfulness and speed. Every animation here feels paced and intentional, with the right level of stickiness and pop to each movement. I had actually added two email accounts to Inbox before recording this screen, but I wanted to share the little slider here that lets users pick and choose which email accounts will be shown in Inbox. Here I only toggle one, but in reality it’s possible to pick and choose between multiple accounts. At the time of this writing, the main thing holding me back from switching to Inbox (from Mailbox) is a unified inbox. I’m managing ~6-10 email addresses at any given time, and having to toggle between them can be tedious at times. Hopefully Google can find a clever solution here – I know it’s a tough one! The red circle in the bottom right of the screen is a new persistent design element that gives you quick-access to the email composer, reminders and suggested contacts. I’m not quite sure how these suggested contacts are chosen – perhaps they’re people I email most frequently (hi mom and dad!) – this seems like an odd design choice in my opinion, as the odds of me wanting quick access to just one or two individuals is relatively low. On the odd-occasion where I do want to email these specific people though, I suppose the suggestion will be a nice shortcut."
year_published = 2025
