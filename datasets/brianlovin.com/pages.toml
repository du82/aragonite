["https://brianlovin.com/app-dissection/carousel-ios"]
title = "Carousel · App Dissection"
description = """
I spent a long time trying to think of what app to cover for the next [Design Details](https://brianlovin.com/app-dissection) post. As of this writing, I’m approaching 400 installed apps on my phone – the search is getting harder.

Carousel is one of those odd apps that slipped onto my phone when it first launched but I hadn’t returned to it for several months. Oddly enough, I had started to record a Design Details post when it first came out so I’m able to juxtapose a few design decisions that were made which have since been iterated upon and improved.

If you’re a Dropbox user, Carousel makes a lot of sense. It’s a wonderfully-focused photo storage and management app. Their iOS offering is beautifully constructed and has some wonderfully-refreshing onboarding design decisions. The Carousel web app is something you shouldn’t miss either – it’s a strong compliment to the mobile app and offers the Dropbox experience we’ve all grown to love right in the browser.

Carousel, like all other Dropbox products, is fortunate to receive the art and branding love that can only come from designers as talented as Alice Lee and Ryan Putnam. The colors, lines and emotions conveyed in Carousel are warm and inviting – a safe place for your photos.

As we navigate through some of Carousel’s design details, it’s worth noting how crucial of a role animation and illustration play in creating a truly delightful experience."""
full_description = "I spent a long time trying to think of what app to cover for the next Design Details post. As of this writing, I’m approaching 400 installed apps on my phone – the search is getting harder. Carousel is one of those odd apps that slipped onto my phone when it first launched but I hadn’t returned to it for several months. Oddly enough, I had started to record a Design Details post when it first came out so I’m able to juxtapose a few design decisions that were made which have since been iterated upon and improved. If you’re a Dropbox user, Carousel makes a lot of sense. It’s a wonderfully-focused photo storage and management app. Their iOS offering is beautifully constructed and has some wonderfully-refreshing onboarding design decisions. The Carousel web app is something you shouldn’t miss either – it’s a strong compliment to the mobile app and offers the Dropbox experience we’ve all grown to love right in the browser. Carousel, like all other Dropbox products, is fortunate to receive the art and branding love that can only come from designers as talented as Alice Lee and Ryan Putnam. The colors, lines and emotions conveyed in Carousel are warm and inviting – a safe place for your photos. As we navigate through some of Carousel’s design details, it’s worth noting how crucial of a role animation and illustration play in creating a truly delightful experience. When you boot up the app for the first time, one of the smoothest onboarding flows I’ve seen in an app kicks into gear. Smoothness and aesthetics aside, I can’t help but to bring up the fact that the video below shows the app auto-scrolling if I don’t touch the screen within a few seconds. This tells me that, for whatever reason, people weren’t interacting with the indicative scroll gesture on the splash screen, so Dropbox had to nudge people along. I’d love to know more behind that decision to auto-scroll users to the sign-in step, but for now it tells me that somewhere in the testing process the team found that people weren’t making it past the splash view."
