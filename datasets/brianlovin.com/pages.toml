["https://brianlovin.com/app-dissection/secret-ios"]
title = "Secret · App Dissection"
description = """
[Secret](https://itunes.apple.com/us/app/secret-speak-freely/id775307543?mt=8) is the latest app making waves on the web, already being coined as Silicon Valley’s [latest obsession](http://techland.time.com/2014/02/08/secret-app/).

While I don’t see myself as a user for this type of app, I thought that this would make for another excellent Design Details post. Secret does several things quite well, making sure to keep the interface and interactions super lightweight and wonderfully minimal."""
full_description = "Secret is the latest app making waves on the web, already being coined as Silicon Valley’s latest obsession. While I don’t see myself as a user for this type of app, I thought that this would make for another excellent Design Details post. Secret does several things quite well, making sure to keep the interface and interactions super lightweight and wonderfully minimal. Tapping a secret to view the comments section has a wonderful little animation – the card slides to the top of the screen, gently pushing the status bar out of sight. When viewing a secret with just a couple comments, we get a nice preview of what happens when you start to scroll. The image starts to fade, the text blurs, and the ‘rubberband’ tightens up, giving the user an almost physical resistance to the scroll. Here’s the same interaction as above, but this time we get to see the full effect. As we scroll through the comments, a tiny piece of the secret is blurred out but remains at the top of the screen – a subtle reminder of what content the user is looking at. I really like what Secret has done with the composer. The traditional approach here would have been to add toggles or dropdowns for users to select background colors or textures. Secret does away with this completely, making the background color change with a horizontal swish of the finger. Swiping up and down within the composer lets users toggle the texture for their post. Again, I love how this visual preview is so tactile, doing away with traditional sliders or toggles. I thought that this detail was quite clever, and something that could have easily been overlooked. If you upload a photo for your post’s background, sliding horizontally with your finger allows you to adjust the blur of the photo. This is a nice way to add subtle, artistic touches to your posts. Along the same lines, sliding vertically within the photo view allows you to quickly adjust the saturation of your photo. Why don’t more photo editing apps have these little details?"
