["https://brianlovin.com/app-dissection/neubible-ios"]
title = "NeuBible · App Dissection"
description = """
[NeuBible](http://www.neubible.co/) is, well, a Bible-reading app. Built by [Kory Westerhold](https://twitter.com/iamkory), [Aaron Martin](https://twitter.com/iamaaronmartin), and [Zach Whelchel](https://twitter.com/zachwhelchel), NeuBible is a masterfully-executed product overflowing with fun details.

Visually, the app is one of the cleanest, most well-composed apps I've downloaded. In terms of navigation, usability, and readability, the app invites an emotional attachment that many other products could only dream of (more on this later). By tastefully combining stock and non-stock UI elements, NeuBible has created something entirely new and interesting.

Below are some of my favorite design details in NeuBible for iOS."""
full_description = "NeuBible is, well, a Bible-reading app. Built by Kory Westerhold, Aaron Martin, and Zach Whelchel, NeuBible is a masterfully-executed product overflowing with fun details. Visually, the app is one of the cleanest, most well-composed apps I've downloaded. In terms of navigation, usability, and readability, the app invites an emotional attachment that many other products could only dream of (more on this later). By tastefully combining stock and non-stock UI elements, NeuBible has created something entirely new and interesting. There's something magic that happens when you download an app and it opens to the thing you actually care about. This happens in about 0.1% of all apps; social sign-ins, tedious walkthroughs, or long-winded intro videos have become the norm. It's a shame because it seems that most apps could very realistically offer a very complete and valuable signed-out experience for people who are curious and need more signal. I'm happy to see NeuBible just work. No fuss, no signup, no over-the-top splash view. Nope, just the content you downloaded the app for in the first place. This is one of the better reading experiences I've seen in an app. I'd argue that the left and right margins are a tad too large, but otherwise the vertical rhythm of the entire app is seamless. I love the snap-to-chapter interaction whenever you scroll past the current section; it feels great to use and has enough rubber-band tension to make it super obvious that you've transitioned to a new chapter. This is such a great example of product thinking: after you close the content view, there's never any question about where you left off. It's the digital equivalent of propping your book on a bedside table, making for an even faster navigation than bookmarking. The app doesn't let you manually highlight text to copy/paste or save to your highlights. Instead it defaults to selecting a single verse at a time. Pressing and dragging will let you select multiple verses at a time. This is a logical reason to break the default pattern of text selection on the OS: verses are the atomic unit in this context, not words."
