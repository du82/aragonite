["https://brianlovin.com/app-dissection/shorts-ios"]
title = "Shorts · App Dissection"
description = """
I came across Shorts a while back when it was featured on Product Hunt. The app isn't quite for me, but I had fun trying it out and came away impressed with some of the interactions and design choices.

In today's post I'm also going to try and give critique where I think it's due - I understand that all products are a work in progress, but sometimes an outside viewpoint can be useful!"""
full_description = '''I came across Shorts a while back when it was featured on Product Hunt. The app isn't quite for me, but I had fun trying it out and came away impressed with some of the interactions and design choices. In today's post I'm also going to try and give critique where I think it's due - I understand that all products are a work in progress, but sometimes an outside viewpoint can be useful! When you first launch Shorts, the app immediately asks for notifications permissions. I'm struggling to understand why they prompt for permission here and not much further down the funnel. It's jarring and confusing - at this point in time it's critical for an app to show what kind of value it will provide to a person, not the other way around. See, once you get past the notifications request I can finally start to parse out what this app is and what kind of value it provides. "Follow people's camera rolls" sounds interesting, if not a bit on the extreme side of messaging. How will it work? Will I be automatically sharing my camera roll if I sign up? As far as visuals go, Shorts has killed it. But that was no surprise once I realized the Highlight team is behind this product. Clean and simple with a bright and inviting color palette - nicely done. The inline validation is nice, but I think the blue bar dropping in from the top is fairly heavy-handed when paired with a lightweight cross in the field. The onboarding for shorts is interesting. Once you've entered your name and an optional profile photo you're shown a card-style UI. There's only two buttons on the screen and one of them is to teach me what's up, so I'll go down that road... In this video I'm tapping the skip and share buttons. Lightweight popups help me reverse my decision and also give me feedback about the gestures. At this point I have one big problem: I have no idea what's going to happen when I hit share. I was really hesitant to tap the share button at first...what if my photo goes public? Can anyone see this? Sharing to where?'''
