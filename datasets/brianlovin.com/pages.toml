["https://brianlovin.com/app-dissection/tumblr-ios"]
title = "Tumblr · App Dissection"
description = """
I must admit up front that I never hopped on board the Tumblr train during its meteoric rise these past few years. While I’ve taken a fair stab at setting up a few blogs, I could never quite get the app to stick with me in the same way that a personal WordPress site (or even Medium) has been able to do.

That being said, I think Tumblr is one of the coolest apps in the world right now with world-class design and an extremely polished end-product. [The Tumblr website](https://www.tumblr.com/login) is a beautiful thing in and of itself, so be sure to check that out if you’re looking for web design inspiration.

But today’s post is all about Tumblr for iOS. At first glance I didn’t think I’d be able to find enough cleverness or creative patterns to compile a full post; I’ve come away pleasantly surprised and I’m excited to share this next chapter in the Design Details series with you!"""
full_description = "I must admit up front that I never hopped on board the Tumblr train during its meteoric rise these past few years. While I’ve taken a fair stab at setting up a few blogs, I could never quite get the app to stick with me in the same way that a personal WordPress site (or even Medium) has been able to do. That being said, I think Tumblr is one of the coolest apps in the world right now with world-class design and an extremely polished end-product. The Tumblr website is a beautiful thing in and of itself, so be sure to check that out if you’re looking for web design inspiration. But today’s post is all about Tumblr for iOS. At first glance I didn’t think I’d be able to find enough cleverness or creative patterns to compile a full post; I’ve come away pleasantly surprised and I’m excited to share this next chapter in the Design Details series with you! As you’re scrolling through your feed on Tumblr, tapping the ‘Home’ icon in the tab bar will, as expected, return you to the top of the view. What Tumblr does here though, that I’ve never seen on any other app, is toggle the ‘Home’ icon with a new ‘Return to position’ icon. Tapping once more will scroll you back down to your previous place in the feed. This is amazing. I honestly wish other apps would do this already – Twitter, Facebook and Instagram all come to mind as places where I might accidentally tap to the top of the feed only to have lost my previous position. The springy animations that trigger when you tap the ‘Compose’ icon in the tab bar is great – it looks slick and provides some nice interactivity. What I thought was cool is that this view also responds to the accelerometer in the iPhone providing a subtle panning movement as you tilt the device. There’s not really much to say for this in the way of usability, but I appreciate the fact that there are people out there paying attention to these small things (even if most people might not notice). For some reason Tumblr lets you drag a blog’s profile picture around – similar to a Facebook chat head. I couldn’t quite figure out why this is supported, but hey – it’s fun, right?"
