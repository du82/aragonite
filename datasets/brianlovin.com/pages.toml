["https://brianlovin.com/app-dissection/google-search-ios"]
title = "Google Search · App Dissection"
description = """
[Google Search for iOS](https://itunes.apple.com/us/app/google-search/id284815942?mt=8) is one of those apps that doesn’t get much use on my phone, but has some really beautiful polish that designers out there will appreciate.

Google designers, like [Noah Levin](https://twitter.com/nlevin) (who has been the sole designer on Google Search for iOS during the last three years), have been a huge inspiration in my own work in recent months. At the end of the day, this app represents a wonderful level of teamwork and collaboration between Google’s designers and world-class engineers who have built a simple, powerful and delightful app for us to use."""
full_description = "Google Search for iOS is one of those apps that doesn’t get much use on my phone, but has some really beautiful polish that designers out there will appreciate. Google designers, like Noah Levin (who has been the sole designer on Google Search for iOS during the last three years), have been a huge inspiration in my own work in recent months. At the end of the day, this app represents a wonderful level of teamwork and collaboration between Google’s designers and world-class engineers who have built a simple, powerful and delightful app for us to use. Launching the Google app makes it immediately clear what level of polish and interactivity we can expect from the interface. Quick transitions, snappy – yet bouncy – animations and clear movement all add up to create a wonderful first app experience. You’ll have to pardon my recording software here for the black screen-flash. In real life, the animation when tapping into the search bar is smooth and seamless, responsive to your touch. I love how Google embraces this sense of movement to help users feel a relative place, or position, within the app. Even when canceling the search, the original app interface slides effortlessly back into view. Here’s another example of the smooth interface change when tapping on the ‘voice search’ icon. We get a nice teaser of the soon-to-be-standard Material design pattern as well with the radiating circle on button-tap. If you have a keen eye, you’ll also notice the way the search bar is lifted slightly off the background when tapped, creating a sense of depth and responsiveness. In this video, I’m signed out of the app – near the bottom we’re shown a teaser for Google Now. Tapping on the teaser brings up a beautiful splash view, guiding users to watch the introductory video. I love the way the background (colorful and playful – so Google) starts to scroll in the background, bringing life to what could easily have been a boring, lifeless view. I grabbed this video after first signing into the app – notice the delay here for the Google Now cards loading in. While I’m sure there’s quite a lot of data-fetching magic happening in the background, the staggered movement at the bottom of the screen helps to draw the users eyes and help guide them to explore the app."
