["https://brid.gy/about"]
title = "About - Bridgy"
full_description = '''Bridgy connects your web site to social media. Likes, reposts, mentions, cross-posting, and more... What is this? Bridgy adds social media reactions to posts on your web site. It can also cross-post from your site to social networks. And more! A picture is worth a thousand words, so here's Bridgy at work on my own site: Bridgy is part of the IndieWeb ecosystem. In IndieWeb terminology, Bridgy offers backfeed, POSSE, and webmention support as a service. Read on for more details, or head to the front page to sign up and get started! General How does it work? How much does it cost? What are the terms of service? What do you do with my data? How long do you store data? Who are you? Why did you make this? How long has this been around? How big is this? What's the difference between this and Bridgy Fed? What happened to Twitter? What happened to Facebook? What happened to Google+? What happened to Meetup? Why does my web site URL need to be in my social network profile? How do I add or remove a web site URL from my Bridgy profile? Bridgy stopped working for me! It looks like anyone can poll or disable my account or publish as me. Isn't that a security hole? How do I connect my Bridgy accounts on different social networks? Can users sign up for Bridgy without leaving my site or application? Why does Bridgy ask for all these permissions? Does Bridgy have an API? Does Bridgy comply with the GDPR? Does Bridgy comply with the CCPA? Does Bridgy comply with the EU's data regulations, eg the DMA and DSA? What are Bridgy's product and engineering values? I found a bug! I have a feature request! I found a security vulnerability! Brid.gy? Really? Backfeed Which things does it send, specifically? How can I get my web site to accept webmentions? Bridgy isn't seeing one of my comments or likes or reposts! Bridgy can't find my original posts! It just says No webmention targets found. Do my posts really need to link to my web site? Bridgy used to find my syndication links, but then it stopped. Why are the Bridgy comments on my site out of order? What are all these brid.gy links in the comments that Bridgy sends to my site? What's the format for Bridgy's webmention source URLs? Wait, Facebook needs a browser extension now? Where are the profile pictures for Facebook comments and likes? Why did I get multiple duplicate copies of the same response? Can I opt out? Publishing What do you mean, publishing? How does it decide which parts of my web page to include? What can I publish, exactly? Can I do this automatically, whenever I post something new on my web site? How do I automate Bridgy Publish with webmentions? How do I use Micropub? How do I reply to a post from my web site? How do I like, favorite, or repost from my web site? How do I post a picture? How do I post a video? How do I tag someone in a post? How do I @-mention someone? How do I include location in a post? How do I delete a post? How do I create a GitHub issue or comment? How do I post an emoji reaction on a GitHub issue or PR? How do I respond to a GitHub comment? How do I add a label to a GitHub issue? How do I add a tag to a Flickr photo? How do I star a GitHub repo? Can I disable the link back to my post? Can I disable the plain text whitespace and formatting? Can I publish just one part of a page? I want more control over the text that gets posted. Why is there a weird &...; in my post? What if my original post does more than one thing? Can I include a short link instead of the full link? How does Bridgy respond to webmentions? How about error responses? Why not Instagram? Webmentions for blogs What is this? What outgoing webmentions does it send from my blog? What does it do with incoming webmentions send to my blog? Why do I have to add a line of HTML to my blog? I'm on Tumblr. Why do I have to install Disqus? I'm on Medium. Why doesn't Bridgy give me incoming webmentions? I'm on Medium. Why do my webmentions look ugly and empty on their target pages? I received a webmention, but it's not showing up on my blog. All the comments for incoming webmentions come from me. That's ugly. How does it work? Bridgy periodically checks social networks for responses to your posts and links to your web site and sends them back to your site as webmentions. Bridgy also translates the responses to microformats so that your web site can fetch and parse them. Bridgy can also publish posts, comments, likes, and reposts from your web site to social networks. When you ask Bridgy to publish a post, it analyzes its microformats data and publishes it using the social network APIs. Bridgy is open source. It's written in Python and runs on Google App Engine. It uses oauth-dropins to let users connect to the silos and granary to fetch data from the silos and convert it to a standard format. How much does it cost? Nothing! Bridgy is small, so thanks to App Engine, it doesn't cost much to run. We don't need donations, promise. If you really want to contribute, file an issue or send a pull request, or donate to the IndieWeb! On our side, it costs us less than $50/month to run right now. More details in the stats. What are the terms of service? Bridgy's terms of service are very simple. You agree not to deliberately attack, breach, or otherwise harm the service. If you manage to access private data such as API tokens, you agree to report the vulnerability and not use or disclose that data. Otherwise, you may use the service for any purpose you see fit. However, we may terminate or block your access for any reason, or no reason at all. (We've never done this, and we expect we never will. Just playing it safe.) Are you an admin on a service that Bridgy interacts with? If you have any concerns, please file an issue! What do you do with my data? Nothing! Bridgy isn't a business, and never will be, so we don't have the same motivations to abuse your data that other services might. More concretely, we won't ever send you email, we store as little of your PII (personally identifiable information) as possible, and we never have access to any of your passwords. How long do you store data? We store all data permanently, but not all in Bridgy itself. Notably, we archive responses (eg other people's likes and comments on your posts) to long term storage after 1-2 years. Archived responses are still visible in BigQuery, but not inside Bridgy. Bridgy is a service, not a data storage provider. Its main job is to translate and move data between sites. It's useful to store this data for an extended period of time, so you can see what it's done recently and retry failed responses, but it's not intended to store data permanently. Garbage collecting old responses is one way to enforce and communicate that. Who are you? Why did you make this? We're Ryan Barrett, Kyle Mahan, and many other contributors. We like using our own websites and owning our data. How long has this been around? Ryan conceived of the idea behind Bridgy in early 2011, started working on it that summer, and launched the first version on Jan. 8 2012. It only supported WordPress, and wasn't very polished, so it never got much adoption. He launched the current version on Dec. 9, 2013. It's been more successful, thanks in large part to webmentions and the inspiration of the IndieWeb community. How big is this? Check out the stats! What's the difference between this and Bridgy Fed? Bridgy and Bridgy Fed are separate services. They both connect web sites and social networks and translate posts and interactions back and forth, but they each do it very differently. Bridgy - this service - connects IndieWeb web sites to existing accounts on social networks, both centralized and decentralized, and provides backfeed and POSSE (aka cross-posting) as a service. Bridgy Fed, on the other hand, bridges accounts on decentralized social networks like the fediverse, Bluesky/AT Protocol, and the IndieWeb directly across those networks. As an example, here's a visualization of how they each connect web sites to the fediverse: Bridgy cross-posts to a Mastodon account: @you@mastodon.server / 🌐 — — \ You already have a Mastodon account. You want to copy posts from your web site to Mastodon and send responses back to your site. Bridgy Fed connects directly to the fediverse: @yoursite.com \ / — 🌐 — / \ Your web site will be its own fediverse account. Its posts will show up in the fediverse automatically. People there can follow it directly. Apologies for the confusingly similar names! What happened to Twitter? Twitter is burning, a billionaire owes money, an API got lobotomized, and Bridgy's Twitter support was one of the casualties. Our access was unceremoniously suspended on April 4, 2023, along with many others. So long, and thanks for all the fish! What happened to Facebook? Facebook is now supported again, minimally, via the browser extension! Bridgy included support Facebook from the very beginning, when it launched in January 2012. After the Cambridge Analytica scandal broke, Facebook started limiting its API in a number of ways. Notably, it disabled RSVPing on April 24, 2018, posting on August 1, 2018, and reading other people's comments and likes on May 24, 2018, which killed Bridgy for Facebook entirely (see these issues) until we developed the browser extension. We tried hard to keep Facebook support alive even without the API. We first tried using email notifications for backfeed. Users forwarded emails from Facebook to Bridgy, which extracted comment text, likes, and shares, and sent webmentions as normal. This was surprisingly difficult to set up, though: many users struggled to get Facebook to actually send notification emails, even after they were turned on in settings. After that, we tried scraping m.facebook.com, like facebook-atom does. The scraping itself worked fine, but we never managed to consistently evade Facebook's bot detection. They always ended up rate limiting or blocking us, even after we started rotating IP addresses, spoofing User Agent headers, and even running some JavaScript for browser fingerprinting. They have way more resources for that arms race than we do, so we gave up on server side fetching altogether... What happened to Google+? Bridgy included support Google+ from the very beginning, when it launched in January 2012. Sadly, Google+ turned off its API in February 2019 and shut down entirely in April, at least for end users. Gory details in this issue. RIP, we'll miss you! What happened to Meetup? Bridgy Publish supported creating Meetup RSVPs from February 2020 to March 2020. This used their REST API, which they decommissioned in 2022 in favor of a new GraphQL API that sadly doesn't support creating RSVPs. Ah well! Why does my web site URL need to be in my social network profile? First, if you want to publish, Bridgy uses this link to connect your web site to your social network account. Second, if you want to get responses without linking your posts to your web site, Bridgy uses this link to fetch syndication URLs from your site so it can map back from your posts. Note that if the web site URL used in your social network profile contains a path, Bridgy will look for a rel="me" link from the root of your domain, to that path. If the link is found, Bridgy will publish posts from any path on your domain to your social network profiles. If the link isn't found, Bridgy will only publish posts from your domain that contain the original path. This is to support sites that allow multiple users per domain. How do I add or remove a web site URL from my Bridgy profile? Just add it to or remove it from your social network profile, then log into Bridgy with that social network again. Et voilà! If you want a given web site in your social profile but not in Bridgy, remove it from your social profile temporarily, log into Bridgy, then add it back afterward. It won't show up in Bridgy unless you log in again. Bridgy stopped working for me! Does your Bridgy user page have a icon on it? If so, Bridgy has lost access to your account. This can happen when you change your password, when Bridgy's access expires or is revoked, or for other reasons. To fix this, just click on the icon on your user page. It looks like anyone can poll or disable my account or publish as me. Isn't that a security hole? Looks can be deceiving. Polling is harmless - Bridgy does it automatically anyway - and when you publish a post or try to disable an account, we check that you own it first. If you publish via webmention, we require a Bridgy Publish backlink in your post. How do I connect my Bridgy accounts on different social networks? You don't! Bridgy could detect accounts that share the same web site(s), but it doesn't yet. If you think it should, feel free to suggest what it would do! Can users sign up for Bridgy without leaving my site or application? Not exactly, but you can get close. Direct your users to POST to a Bridgy registration URL of the form https://brid.gy/SITE/start (where SITE is flickr, github, mastodon, or reddit) with the parameters: feature, a comma-separated list of features, usually listen (ie backfeed), publish, or listen,publish callback, a URL pointing back to your site user_url (optional), the user's URL. Allows callers to set this value without requiring it to be present in the user's silo profile They will be ushered through the registration process and sent back to your site when it finishes. For example: POST https://brid.gy/github/start feature=listen,publish&callback=http%3A%2F%2Fexample.com%2Fbridgy-callback The callback will be passed back query parameters: result equal to success, failure, or declined user (if successful) equal to their Bridgy user page URL Why does Bridgy ask for all these permissions? Bridgy needs various permissions to access each social network accounts you connect. It prompts you when you first connect an acount, and also when you enable backfeed or publishing afterward. It asks for as little access as possible, to only public data, but still often has to ask for more access than it needs, since many social networks have overly coarse permissions. Details: Blogger doesn't have permissions at all, just full access or none. Screenshot. Flickr has read, write, and delete permissions. We ask for read for backfeed, write for publish. Screenshots: backfeed, publish. GitHub has a few different permission models. We use an OAuth app to request read/write permission to public repository data, and notifications to see new comments and reactions. The alternative would have been a GitHub app, which lets you grant read vs write permission to individual repos, but includes private repos, and doesn't include notifications. More on the tradeoff here. Screenshot. Mastodon has a number of fine grained permissions, but backfeed needs most of the read categories, and publish needs most of the write ones, so Bridgy just asks for blanket read and write permission for each. Backfeed also uses your block list to suppress responses from a'''
