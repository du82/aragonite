["https://bridgeman.co.uk/en/anniversaries-and-commemorations-of-2025/16553"]
title = "Anniversaries and commemorations of 2025 - Bridgeman Images"
description = "From the 60th anniversary of Winston Churchill's death to the 40th anniversary of Marc Chagall's death; discover these important dates in our collections."
full_description = '''From the 60th anniversary of Winston Churchill's death to the 40th anniversary of Marc Chagall's death; discover these important dates in our collections. Download the full list of anniversaries and commemorations for 2025 7 January: 10 years after the Charlie Hebdo shootings, Paris, France. Two terrorists forced their way into the offices of the satirical magazine Charlie Hebdo and open fire. Twelve people were killed and eleven injured. " Je suis Charlie ", slogan de la marche citoyenne, 11 janvier 2015 (photographie) © Patrice Cartier. Tous droits réservés 2023 / Bridgeman Images 8 January: 90th anniversary of the birth of Elvis Presley, ("The King"), American singer, guitarist and actor (died in 1977). Girls... more girls Girls! Girls! Girls! par Norman Taurog with Elvis Presley 1962 / Bridgeman Images 24 January: 60th anniversary of the death of Winston Churchill, British Prime Minister (1940-45, 1951-55). One of the greatest wartime leaders of the 20th century. Winston Churchill (1874-1965) lors de son discours du 8 mai 1945 (photo n/b) / Bridgeman Images 27 January: Holocaust: 80 years ago, the Soviet Red Army liberated the Auschwitz concentration camp in southern Poland. Auschwitz was the largest Nazi concentration camp and at least 1.1 million prisoners died there. Libération du camp de concentration d'Auschwitz en 1945 (photo n/b) © SZ Photo / Bridgeman Images 6 February: The 80th anniversary of the birth of Bob Marley, Jamaican reggae/ska/rock singer, songwriter, musician and cultural icon. Bob Marley sur scène au Roxy Los Angeles le 26 mai 1976 / Bridgeman Images 21 February: 60th anniversary of the assassination of Malcolm X, human rights activist. Malcolm X, New York, 27 juillet 1963 (photo) Underwood Archives/UIG / Bridgeman Images 28 March: The 40th anniversary of the death of Marc Chagall, the Russian-born French artist, engraver and designer. Le peintre Marc Chagall dans son appartement new-yorkais, peignant Le Martyr, 1940 (photo n/b) © LIMOT. Tous droits réservés 2023 / Bridgeman Images 2 April: 20th anniversary of the death of Pope John Paul II. Succeeded by Pope Benedict XVI on 19 April. Pape Jean-Paul II, années 1990 (photo) Farabola / Bridgeman Images 30 April: The 80th anniversary of the death of Adolf Hitler, leader of the German Nazi party, born in Austria, Chancellor of Germany (1933-45) and dictator (1934-45). (Karl Dönitz succeeds him as President of Germany). Portrait de profil d'Adolf Hitler, 1938 (photo n/b) © SZ Photo / Bridgeman Images 19 May: The 100th anniversary of the birth of Pol Pot, Cambodian communist revolutionary and brutal dictator. Leader of the Khmer Rouge. Responsible for the deaths of nearly three million people. Cambodge : Saloth Sar, plus connu sous le nom de Pol Pot, avec une délégation vietnamienne à Phnom Penh, 1975 Pictures from History / Bridgeman Images 1 July: 100th anniversary of the death of Erik Satie, French composer, pianist and writer. Erik Satie (1866-1925) Compositeur français / Bridgeman Images 20 August: The 400th anniversary of the birth of Thomas Corneille, French playwright and lexicographer. Pierre Corneille lisant le "Cid" à son frère Thomas Corneille avant de se rendre chez Anne "Ninon" de l'Enclos (ou Ninon de Lenclos ou Ninon de Lanclos, 1620-1705). Gravure du 19e siècle dans les "Confessions de Ninon de Lenclos" d'Eugène Moret. 27 August: 60th anniversary of the death of Le Corbusier, the Swiss-born French architect and town planner. L'architecte français Le Corbusier (1887-1965) ici vers 1953 / Bridgeman Images 10 October: 40th anniversary of the death of Orson Welles, American theatre, film and radio actor, director, screenwriter and producer (War of the Worlds, Citizen Kane). Orson Welles dans F for Fake, 1973 (photo du film) / PVDE / Bridgeman Images 16 December: The 250th anniversary of the birth of Jane Austen, British novelist (Sense and Sensibility, Pride and Prejudice, Mansfield Park, Emma, Northanger Abbey, Persuasion) Portrait de Jane Austen (gravure) Prismatic Pictures / Bridgeman Images Download the full list of anniversaries and commemorations for 2025 Need imagery for your creative projects? Get in touch Create an Account'''
