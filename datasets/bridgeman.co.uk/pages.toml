description = "Bridgeman Images is the leading global source of Art, Culture & historic images and videos for licensing and reproduction. Discover our archive:"
full_description = "Ralph SteadmanRalph Steadman is a prolific artist, who in his 60-year career has produced thousands of groundbreaking and influential artworks. Artist, writer, sculptor, cartoonist and designer, he has illustrated classics, such as Alice in Wonderland, Treasure Island and Animal Farm. His books include the studies of Sigmund Freud and Leonardo da Vinci, while with Hunter S. Thompson he collaborated on the birth of Gonzo journalism with his classic illustrations for Fear and Loathing in Las Vegas.See more >GEO Image CollectionDiscover our newest content partnership with GEO Image Collection. Covering the Earth’s diverse environments and cultures, the photographs in National Geographic have engaged, educated, and often astonished millions of readers for over a century.See more >The Reuters Pictures Archive Discover our latest content partnership with the Reuters Pictures Archive. This collaboration complements and enhances our existing collection, introducing an additional 1 million images that cover the most iconic moments in modern history.See more >Lucian FreudLucian Freud is considered one of the most important portraitists of the 20th century and his paintings are among the most expensive in the world. Bridgeman Images represents his copyright exclusively and worldwide. Learn more about the artist and discover Lucian Freud's artworks in the archive.See more >Read more >"
