["https://bridgeman.co.uk/en/faq"]
title = "FAQs"
description = "Everything you need to know about licensing, copyright, using images and much more"
full_description = "Have an idea? Describe it, and our AI Search will find the best matches. Try something conceptual like ‘dreamlike garden’ or an emotion-driven search like ‘happy 7 year old with a dog.’ Our AI captures context and nuance beyond traditional keywords. Find Your Perfect Match The top results are exact matches, while the rest are visually similar images curated from our archive. Some files need to have authorisation from the collection that owns them before they can be directly downloaded. An Account Manager will request permission on your behalf. They will use the project information you submitted at the time of downloading, so please make sure this is accurate. It could also be the case that the file has not yet been scanned at a high resolution. Your Account Manager has been notified that you've tried to download the image and they will have the image scanned for you. They will be in touch once it's available for download. Please also check that your account is set up to download high-resolution files. Please contact your Account Manager to review your settings or contact us. Register or log in to your Bridgeman Images account. You can then download the file in low, medium or high resolution by clicking the download button. Or you can add the image/video to a lightbox for later use. Yes. Please either contact your Bridgeman Images Account Manager or contact us with your brief. We will then provide an estimated cost for the image/video(s). when you're searching and selecting images or videos you can access your existing lightboxes or create a new one by clicking here: After you create an account, you can download your video either individually or as part of a lightbox. For more information about lightbox and download please check the Lightbox FAQs under the Navigation section of this page. If you run into any issues, need additional research assistance or need higher resolution files, please contact your Account Manager. We also have online guidance on purchasing and usage rights on this FAQs page."
