["https://bridgeman.co.uk/en/about-bridgeman-images/16365"]
title = "About Bridgeman Images"
description = "Bridgeman Images are the world's leading specialists in licensing fine art, cultural and historical media for reproduction."
full_description = '''Bridgeman Images are the world's leading specialists in licensing fine art, cultural and historical media for reproduction. With offices in London, Paris, New York, Berlin and Milan, we are one of the world’s oldest image licensing companies and have been clearing copyright and reproduction rights on behalf of artists and artists' estates since 1972. We represent thousands of images and videos suppliers, including museums, libraries, auction houses, artist estates, galleries and more. Physichromie 1977 & Transchromie mécanique aléatoire, 2018 / © Estate of Carlos Cruz-Diez. All rights reserved 2023 / Bridgeman Images Bridgeman Images has a collection of over 5,5 million works Our collection of over four-million works spans centuries, specialisms, geographies and mediums including early and modern photography, paintings, textiles, sculpture, maps, documentary footage and more.Our in-house picture researchers and copyright specialists are on hand to lend their creative and practical experience to help find the perfect image or video for any use. hbspt.forms.create({ region: "na1", portalId: "8116133", formId: "13d55c35-6669-4282-9553-00de25fc5e8c" }); Browse Our History Founded in 1972, Bridgeman Images makes the best of the world's art available for reproduction while supporting museums, artists and collections Image Licensing & Copyright Services Why is it important to obtain the proper rights clearances? Our clients value provenance and legitimacy, two pillars we pride ourselves on. Rights Managed Images We clear reproduction rights simply and quickly. We also offer free advice on how to clear an artist's copyright if additional permission is needed. Leemage Leemage: A renowned French image agency with deep historical archives Our Prices We offer a full range of solutions, including flexible pricing for projects of any size and budget. Image & Video Sourcing or Research Services Our experienced research team is on hand to help find the perfect images or videos for your brief. Need imagery for your creative projects? Get in touch Create an Account'''
