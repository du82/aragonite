title = "Analyze Live Video with Real-time Alerting | BriefCam"
description = "BriefCam provides the ability to trigger a call to action, bringing relevant events to the forefront and allowing quick review by those individuals who can provide an accurate assessment"
full_description = "With BriefCam RESPOND you can trigger real-time alerts based on complex object classification and recognition filter combinations to increase situational awareness and deliver critical, time-sensitive intelligence. RESPOND empowers you to react to events as they unfold, from proactively protecting people and property to driving better visitor or customer engagement as opportunities arise. BriefCam allows for improved responsiveness, real-time decision-making, and effective balancing of sensitivity, accuracy and efficiency with alerting rule configuration, face and license plate watchlist management, and alert notifications for messaging services and VMS alarm areas, including integration with Genetec Security Center, Milestone XProtect, Axis ACS, IndigoVision Control Center, Qognify Ocularis, Digifort Enterprise, and Verint EVMS. Trigger real-time, rule-based alerts for face recognition, line crossing, vehicles, people of interest and object count, in time sensitive situations. Respond to complex situational changes in the environment through buildable rule configurations, based on any number of search filters, including face and license plate recognition and more. Send notifications to messaging services, and VMS alarms area. Integration with Genetec Security Center, Milestone XProtect, and IndigoVision Control Center. Powerful real-time Facial Recognition capabilities provide best-in-class face matching to rapidly pinpoints people of interest using digital images extracted from the video or from external sources. Receive alerts for “in the wild” license plate recognition, identifying license plates through watchlists, existing video or data uploads. Activate alerts when objects cross a demarcation in a pre-defined direction to drive perimeter protection and directional object count. Configure count-based rules to monitor the increase or decrease of people in a pre-defined range of view or area – ideal for tracking queues and waiting areas. Alert when people are in proximity to one another for a period higher than a predefined threshold. Combine with time-based alerts to only notify when this action occurs too frequently."
