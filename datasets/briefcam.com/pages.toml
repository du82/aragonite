["https://www.briefcam.com/solutions/review-search"]
title = "Search & Review Hours of Video in Minutes | BriefCam"
description = "BriefCam’s breakthrough technology detects, tracks, extracts and recognizes people or objects from video, helping you get to what matters fast! By expediting review, one person can now do the work of ten."
full_description = "By leveraging the REVIEW capabilities, users can pinpoint objects and events of interest to advance investigations and powerfully accelerate time to target. This solution supports effective case management, so investigators can organize video assets, bookmark objects of interest, summarize case findings, and export reports, while dynamically collaborating on cases with other users. With REVIEW, operators can review hours of video in minutes and refine search results through filter tolerance as well as density, speed, direction, and sort controls. REVIEW enables cross-camera video search and filtering, based on an ever-expanding set of object classes and attributes, as well as Visual Layers, which presents activity, dwell time, common paths, and background changes as easily readable heatmaps for increased scene understanding. Lastly, the patented BriefCam VIDEO SYNOPSIS® solution, which simultaneously presents objects that have appeared at different times within the video, resulting in a dramatically shorter video segment that fully preserves the viewer’s ability to analyze the scene. Organize all video assets of an investigation in a single container, bookmark objects of interest, and summarize case findings (including all relevant exhibits) in an exportable report, while dynamically collaborating on cases with other users. Simultaneously present objects that have appeared at different times within the video. The result is a dramatically shorter video segment that fully preserves the viewer’s ability to analyze the scene, enabling the review of hours of video in minutes and sometimes seconds. Advanced multi-camera search powerfully identifies men, women, children and vehicles of interest with speed and precision, using face recognition, appearance similarity, apparel, color, size, speed, path, direction, dwell time and illumination change filters. Accurate face recognition rapidly pinpoints people of interest using digital images extracted from the video or from external sources."
