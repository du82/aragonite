["https://www.briefcam.com/resources/faqs"]
title = "FAQs BriefCam Product Frequently Asked Questions | BriefCam"
description = "BriefCam frequently asked questions"
full_description = "Yes, BriefCam can be deployed within a distributed architecture that is comprised of a local BriefCam system at each site communicating back to a centralized Hub system that aggregates the business intelligence metadata and real-time alerts from all of the sites. BriefCam is hardware vendor agnostic. Certain server vendors have BriefCam-specific part numbers, however as long as the specifications are met, the manufacturer is irrelevant. The BriefCam Processing Server requires an NVIDIA GPU to process video. The exact model and amount of GPU cards required will depend on the requirements of the resolution of video to be processed along with the number of hours of video to process per day. For a system with a large video processing requirement, multiple GPUs can be installed in each processing server, as well as the ability to utilize multiple processing servers simultaneously. Each GPU installed in the BriefCam server must be assigned to process video in a specific processing mode, either for on-demand processing (REVIEW and RESEARCH modules) or for real-time processing (RESPOND module), a single GPU cannot process video both real-time and on-demand. If you have any questions regarding specific GPU compatibility or support, please reach out to BriefCam to confirm. The recommended hardware for a specific project will depend on a few variables, the most significant variables that affect the hardware recommendation are based on the resolution of the video to process and the number of hours of video to process per day. All of the BriefCam platform services can be deployed on multiple servers simultaneously. For some of the services, you will need to use 3rd party monitoring tools to automate the automatic high availability components. When a new video processing request is submitted, the VIDEO SYNOPSIS® technology Server (VSServer) will query each individual Processing Server (PS) to determine which server has spare bandwidth to process the requested video and will automatically assign the next available PS server to process the request."
