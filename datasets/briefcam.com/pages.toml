["https://www.briefcam.com/company"]
title = "Rapid review, search and analysis of video content | BriefCam"
description = "BriefCam is the industry’s leading provider of the VIDEO SYNOPSIS® technology for rapid video review and search, real-time alerting and quantitative video insights."
full_description = "BriefCam envisions a future where video data is widely accessible, usable, and insightful for a smarter, better world. To improve everyday lives by transforming video surveillance data into valuable insights. BriefCam empowers people, companies and communities to realize the value of their video through innovative solutions, powered by advanced technologies.​ By harnessing the power of artificial intelligence and deep learning, BriefCam transforms video into valuable insights for rapid video review and search, as well as patented VIDEO SYNOPSIS® technology; real-time alerting; and quantitative video insights. BriefCam increases operational efficiency for people, companies and communities to realize the value of their video through its innovative, comprehensive video analytics platform designed for flexibility and scalability with market leading accuracy, performance and user experience. With 1 billion surveillance cameras expected to be installed by the end of 2022 (Source: Omdia) the amount of video recorded is overwhelming. There are simply not enough human eyes to review it all, and its beyond human capacity to analyze the depth and breadth of its content. Through BriefCam’s comprehensive video analytics platform, organizations can rapidly detect, track, identify, search and view thousands of objects in every scene, and understand trends gleaned from video content, totally transforming how organizations use video. As the industry’s leading provider of Video Content Analytics solutions, BriefCam enables customers to: The depth of BriefCam’s video analytics and cross functional applications maximize the ROI of video surveillance and help transform how organizations operate. “Using BriefCam has been a game changer for our city. Just last week, BriefCam helped us catch a suspected child predator by enabling us to review two hours of surveillance videos in 13 seconds…” BriefCam was founded in 2008 based on technology developed at the Hebrew University of Jerusalem by Prof. Shmuel Peleg, a renowned computer vision researcher. This proprietary technology, VIDEO SYNOPSIS®, is an award-winning innovation that summarizes hours of events into a “brief” to extract maximum value from video for safety, security and productivity."
