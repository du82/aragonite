["https://www.briefcam.com/privacy-policy"]
title = "BriefCam Privacy Policy | BriefCam"
description = "BriefCam Privacy Policy"
full_description = "Thank you for visiting our website. This privacy policy tells you how we use personal information collected at this site. Please read this privacy policy before using the site or submitting any personal information. By using the site, you are accepting the practices described in this privacy policy. You are encouraged to review the privacy policy whenever you visit the site to make sure that you understand how any personal information you provide will be used. Please note that the privacy practices set forth in this privacy policy are for this web site only. If you link to other websites, please review the privacy policies posted at those sites. We collect personally identifiable information, like names, postal addresses, email addresses, etc., when voluntarily submitted by our visitors. The information you provide is used to fulfill your requests on our website. This information is only used to fulfill your specific request, unless you give us permission to use it in another manner, for example, to add you to one of our mailing lists. The site uses cookies and tracking technology called Google Analytics. Cookies and Google Analytics tracking technology are useful for gathering information such as browser type and operating system, tracking the number of visitors to the site, and understanding how visitors use the Site. Cookies also help customize the site for visitors. Personal information cannot be collected via cookies, however, if you previously provided personally identifiable information, cookies may be tied to such information. Aggregate cookie and tracking information may be shared with Google Analytics to provide us with site management statistics. Distribution of Information We may share information with governmental agencies or other companies assisting us in fraud prevention or investigation. We may do so when: (1) permitted or required by law; or, (2) trying to protect against or prevent actual or potential fraud or unauthorized transactions; or, (3) investigating fraud which has already taken place. We will not share your data with any other company outside of these limitations."
