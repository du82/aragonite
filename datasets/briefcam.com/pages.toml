["https://www.briefcam.com/glossary"]
title = "Glossary | BriefCam"
description = "BBTOBack to original video to view the full context of the original feed where the event was captured (i.e. uncropped and at 1:1 zoom).BOMThe bill of materials used when sizing the hardware necessary for a project."
full_description = "Back to original video to view the full context of the original feed where the event was captured (i.e. uncropped and at 1:1 zoom). Patented-pending video software technology that allows users to create and train their own BriefCam subclasses on their own cameras. Use the Color Shade filter (approximate, close, or precise) to set how flexible the filter should be in terms of the shade of an item. You are setting here how far the tone of the color can be from the selected color to be considered a match. Use the Color Coverage filter (low, medium, or high) to set how much of the object needs to match the selected color in order to be considered a match and to be displayed. Semi-automatic flow for searching for an object in surrounding cameras where the camera geolocations have been defined. With Instant REVIEW enabled, cameras processed in real-time (RESPOND and Continuous RESEARCH) will have the full assets generated, including close up clips and thumbnails for each moving object, enabling a request within the REVIEW module, when investigating the same exact time range, to be immediately available. National Institute of Standards and Technology is an agency of the United States Department of Commerce whose mission is to promote American innovation and industrial competitiveness. The Linux-based Next-Gen (OX6) video processing engine for processing video in real-time (either RESPOND or Continuous RESEARCH). The Windows-based video processing engine for processing video either in real-time (either RESPOND or Continuous RESEARCH) or on-demand (REVIEW or Scheduled RESEARCH). The REVIEW module enables after-the-fact forensic investigations and deep-learning-based synopsis-based review of video that is orders of magnitude faster than standard video review, enabling precision-adjustable pin-pointing of subjects of interest using appearance similarity for people, vehicles and activity; face recognition; license plate recognition; and a broad range of people and vehicle characteristics as search criteria via highly-accurate metadata-based searching."
