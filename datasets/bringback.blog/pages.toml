title = "Bring Back Blogs! January 2023"
full_description = "Note: This page was last updated Jan 20, 2022. We received just over 700 submissions (!) and have gone through most of them. This was intended to be a small experiment and we are absolutely blown away by the enthusiasm (slash, overwhelmed!). We'll be updating with a curated list of our favorites sometime in February. Til then, please check out the directory. Hi! Ash and Ryan here. In the twilight of Twitter, we’re running an experiment. Can we all bring back blogging, together? Artists, writers, inventors, tinkerers, illustrators, designers—all makers are welcome here. For the month of January, we’ll make a pact to post a few times to get into the habit, and create a directory of all the creators who participate. Readers can then find new makers to follow before we all scatter to the winds. Win-win! We really mean newsletters, blogs, tumblrs, what-have-you—blog is shorthand for longer-form content, served via RSS. The project itself started when we were trading notes on what we’re doing in the face of Twitter imploding, which led to asking...what did we do before Twitter? We both immediately latched onto the same idyllic memory: perusing our RSS readers over morning coffee, passing the coolest links among coworkers and friends. But then we all got on Twitter. The blogosphere was once a vibrant network of deep thought and curation, and now has the vibes of an untrimmed yard. Rss is truly decentralized. This means maximum expressiveness for creative folks without a lot of the pitfalls. In short: use whatever platform is best for you. Start a tumblr! Spin up a newsletter! Make a totally bespoke blog! As long as it has an RSS feed (and almost all modern services do, automatically), you're good to go. Readers can then subscribe in aggregate to all the feeds they love best, and read the content in one place with a service like Feedly or Old Reader. And there's no need to point them to a specific RSS feed. Most of these services only need the URL of your blog or newsletter. More about RSS and RSS readers."
