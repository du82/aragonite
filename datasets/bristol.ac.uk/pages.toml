["https://bristol.ac.uk/news/2025/february-/cam-dairy-farming.html"]
title = "February : CAM in dairy farming | News and features | University of Bristol"
description = "Greater openness about complementary and alternative medicines (CAM) use has the potential to strengthen farmer-vet relationships, which may prevent potential unintended harm to animals, reduce antibiotic use and improve herd health management, new research has found. The study, led by the University of Bristol, is published today [26 February] in Frontiers in Veterinary Science."
full_description = "View all newsGreater openness about the use of complementary and alternative medicines in UK dairy farming could bring benefitsCally Lawson from PixabayPress release issued: 26 February 2025Greater openness about complementary and alternative medicines (CAM) use has the potential to strengthen farmer-vet relationships, which may prevent potential unintended harm to animals, reduce antibiotic use and improve herd health management, new research has found. The study, led by the University of Bristol, is published today [26 February] in Frontiers in Veterinary Science.CAM are used by some dairy farmers in the UK but there is limited evidence about their use and which products and practices farmers consider to be CAM. The study found that dairy farmers think of a wide range of treatments and practices as CAM and vary in how and why they use CAM. Most vets consider CAM to be counter to evidence-based practice. The Royal College of Veterinary Surgeons does not endorse CAM use where there is no scientific evidence of efficacy (RCVS, 2017) and the British Veterinary Association defines CAM as “treatments that fall outside of mainstream veterinary care” (BVA, 2018). This exploratory research aimed to step aside from the debate around CAM efficacy to understand what underpins CAM use in dairy herd health management and how that might influence antibiotic use. Twenty-four farmers were interviewed from 20 farms, 16 of which were visited to collect observational data such as photographs and fieldnotes. The participating farms represented a range of management systems (15 organic; 9 conventional) and herd sizes, and supplied milk to a range of processors under different certification standards. What farmers think of as CAM What farmers thought of as CAM varied and included a wide range of products and practices, the use of which was motivated mainly by their desire to provide care for their animals. These included herbal remedies (such as commonly used topical udder creams, including Uddermint®) homoeopathy, distant healing, environmental enrichment, observation methods, food products used for ingestion or external rubs, and shop-bought products. Not all participating farmers considered all of these products or approaches to be CAM. Some farmers used multiple approaches or products which they viewed as CAM whilst others just used Uddermint®, and did not regard this as CAM at all. Conceptualisations of CAM CAM was often seen as part of a wider ethos which encompassed a range of practices to manage animal health on dairy farms, rather than as one particular product, medicine or therapy. CAM was thought of by some as a natural and holistic system approach, with products made with natural ingredients that supported animals’ natural healing processes. It also formed part of a wider philosophy regarding holistic farming more broadly with regards to land use and avoiding overuse of antibiotics. Farmers’ main motivation for using CAM was a desire to do something to support the health of their animals when other approaches were not available or appropriate. Farming approaches associated with CAM use The use of CAM was linked to organic farming and production without antibiotics (PWAB) contracts as both restrict antibiotic use, which meant that some farmers were trying different approaches to support herd health. Farmers consulted a range of advisors and resources to guide their CAM use, including veterinary support specifically relating to CAM and antibiotic use. Dr Kayleigh Crouch, lead author who conducted the research for her PhD at the University of Bristol, said: “This is the first study to explore CAM use on dairy farms in a UK context. It is important for vets and advisors to acknowledge and discuss what herd health management approaches are used and explored by farmers. More open discussion surrounding the use of specific CAM practices and products on dairy farms would support better collaboration between dairy farmers, vets and other advisors in support of animal health. This would enable further study and work towards co-produced herd health plans that are farm specific and acknowledge farmers’ own goals and values. Further research in this area would be useful to gain a wider breadth of views and practices. “The discussion about CAM in the veterinary literature often focuses on homeopathy but this does not acknowledge the widely used products such as udder creams/oils or broader approaches such as animal observations or environmental enrichment, which some farmers consider CAM. This study suggests that it may be more helpful to refer to specific products and practices by name, rather than using the term CAM more broadly, to avoid any confusion or negative associations with the term CAM. “It is also important to acknowledge the potentially positive impacts of these products and practices, for example where they support reduced use of antibiotics. Research should be conducted into how CAM practices contribute to the One Health approach for antimicrobial resistance impact reduction and how they influence animal housing, management, and interactions to identify potential positive practices.” David Barrett, Professor of Bovine Medicine, Production and Reproduction from the Bristol Veterinary School at the University of Bristol and a European Veterinary Specialist in Bovine Health Management, added: “The veterinary profession constantly strives to optimise animal health and welfare through the application of evidence-based veterinary medicine and the pursuit of best practice. Vets have a vital role to play in safeguarding both animal and public health, and through the One Health approach have significantly reduced antibiotic use in the dairy production chain in recent years. However, it has become apparent that many dairy producers are using CAM products and practices without consultation with their vets. While some of these practices might be considered simply good animal husbandry, others are controversial to those seeking an evidence base and, because of this, are not being openly discussed. “This study does not seek to establish, or question, the efficacy of all the products and practices considered to be CAM by farmers, but to draw attention to the need for farmers, vets and others to work more closely together to ensure transparency around all the animal health related activities undertaken on a farm.” Project funding: The study received funding from A Nelson and Co Limited. The funder was not involved in the study design, collection, analysis, interpretation of data, the writing of this article, or the decision to submit it for publication. Paper What do complementary and alternative medicines mean to UK dairy farmers and how do they use them?’ by Kayleigh M. Crouch, Helen Cramer, Gwen M. Rees, Debbie Sharp, David C. Barrett and Christie Cabral in Frontiers in Veterinary ScienceFurther informationA summary of complementary and alternative approaches as defined by participating farmers, and why they are used. Complementary and alternative therapy types Farmer reported reasons for use Examples include External herbal rubs To manage bruising, abdominal discomfort post calving, mastitis, pneumonia, digestive function, worm control, back soreness. Uddermint Golden balm Comfrey Calendula Avena Masticare oil Herbal essential oils To manage metritis, calming cows in stressful surroundings, digestive function, mastitis control. Lavender oil Citronella and lavender Avena masticare oil Food products ingested To manage gut health and support digestive functioning. Kefir Apple cider vinegar Sea solids Garlic puree Garlic Products used as internal washouts To manage retained placentas, foetal membranes and endometritis. Coffee UTREsept® Apple cider vinegar Products used as external rubs To manage wounds and healing sores. Manuka honey Pine resin Coconut oil Peanut oil Products used as external wash and applied externally Used as a fly repellent, stress management, digital dermatitis, mastitis prevention, numbing sores, wound barriers, to manage bloat. Epsom salts Listerine Germolene Skinsosoft and tea ‘Stinky stuff’ (containing nigella sativa, cocos nucifera, butyrospermum, parkii butter, euphorbia cerifera cera wax) Environmental enrichment Providing occupational activities, maintaining healthy coats, improved quality of life for animals, reducing stress at handling and maintaining a well-functioning immune system. Occupational enrichment Cow brushes Positive human-animal interactions (e.g. calm talking and scratching) Observational tools Monitoring animal health and disease, monitor animal behaviour, udder health during milking and preventing mastitis. Also sometimes used to inform farmers of which CAM approaches might be most appropriate. Obsalim Technology Robotic milking statistics Constitutional element of homeopathy Proximal plant placing Ringworm. Holly bush Homeopathic products To manage a range of health conditions including: mastitis, delayed development, lethargic behaviour, animal stress, arthritis and joint pain, urogenital problems, pain, bruising, throat soreness, fear, shock, cuts and abrasions, high fever, swelling, septicaemia, necrosis, milk fever, digestive disturbances, coughing, pneumonia in calves, to maintain good health, bloat, reproduction/fertility, enteritis, ease of calving and weaning, prolonged wound bleeding, skin irritation, post caesarean section recovery, digital foot health. Constitutional element of homeopathy Premade kits Single remedies Bespoke remedies for farm/animals Bioresonance products Providing animal or herd specific products for a variety of animal health challenges e.g. ringworm, nausea/vomiting for cows in calf, stress, improving milk quality. Bioresonance (a machine used to transmit information through electromagnetic waves to provide treatments to restore cellular balance, stimulate tissue regeneration and support self-healing) services through pharmacies Distant healing To heal specific animals or herds with positive vibrations by people in locations that are viewed to be conducive for effective dowsing. Sending vibrations to heal animals using pictures/locations on maps"
