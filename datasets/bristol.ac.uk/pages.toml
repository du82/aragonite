["https://bristol.ac.uk/news"]
title = "News and features | News and features | University of Bristol"
full_description = "News and features #item748168 {display: none;} Bristol leaps to 68th place in global reputation rankings 18 February 2025 The University of Bristol has risen to 68th place in The Times Higher Education (THE) World Reputation Rankings 2025. Paramedics in GP surgeries may ease workload but not NHS costs, study finds 28 February 2025 Paramedics working in GP surgeries help reduce GP workload but do not contribute to cost savings to the NHS, according to the first major study of the clinical and cost-effectiveness of paramedic compared with GP consultations. University of Bristol partnership launches initiative to drive AI innovation 27 February 2025 TechWorks-AI, a new standalone community dedicated to advancing artificial intelligence (AI) and machine learning (ML) innovation, has been formally announced at a milestone event at the historic Bletchley Park. Greater openness about the use of complementary and alternative medicines in UK dairy farming could bring benefits 26 February 2025 Greater openness about complementary and alternative medicines (CAM) use has the potential to strengthen farmer-vet relationships, which may prevent potential unintended harm to animals, reduce antibiotic use and improve herd health management, new research has found. The study, led by the University of Bristol, is published today [26 February] in Frontiers in Veterinary Science. New research reveals one third of Scottish households have no savings 26 February 2025 New analysis has shown a third of households in Scotland (32%) report having nothing in savings. Bristol scientist wins international award for pioneering work in composite materials 24 February 2025 A University of Bristol professor has become the first non-US recipient of a prestigious American engineering accolade in recognition of his pioneering work in composite structures and his inspirational mentoring of young academics and professionals. From fixing phones in school to running a sustainable tech company 21 February 2025 A Bristol graduate who started out fixing school friends’ and teachers’ smashed screens now runs a sustainable tech company that employs 17 people. Big birds like emus are technical innovators, according to University of Bristol researchers 20 February 2025 Large birds – our closest relations to dinosaurs - are capable of technical innovation and can solve a physical task to gain access to food. Bristol scientists awarded £300k for robot dexterity research 20 February 2025 University of Bristol researchers have received £300,000 of funding to investigate ways to improve the capabilities of artificial muscles, as part of a major £1.5million project to advance robot dexterity. Bristol shows Hollywood credentials at new facility training the filmmakers of tomorrow 19 February 2025 It’s a scene you’d expect to see in Hollywood, not tucked away near Bristol Temple Meads Train Station. Within a 350 square-metre studio with towering LED screens, the filmmakers of tomorrow are being trained in how to bring physical and virtual worlds together for film and TV using the very latest technology. Dr Gaositwe Keagakwa Tibe Chiepe, 1922-2025 19 February 2025 Dr Gaositwe Keagakwa Tibe Chiepe, a notable politician and educator who was the first Motswana woman to attain a Master’s degree from the University of Bristol, has died. We offer a tribute to an outstanding diplomat and a champion of education. Search Follow the University of Bristol on Twitter Years iterator JanuaryFebruary MarchAprilMayJuneJulyAugustSeptemberOctoberNovemberDecemberJanuaryFebruary  All news"
