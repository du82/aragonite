title = "The city of Bristol | The city of Bristol | University of Bristol"
description = "Welcome to Bristol: a vibrant, friendly place to live and study."
full_description = "The city at the heart of our universityDiscover your life in BristolWith a vibrant culture, a strong sense of community and endless opportunities to try new things, Bristol is a brilliant place to live, work and study. Moving to university isn't only about finding the right course. It's about finding the right place to call home. Get to know Bristol and discover what our city can offer you.spirit and explorationBristol's cultureWe've done our best to capture Bristol's unique and vibrant atmosphere in these pages, so you can get a taste of student life in this remarkable city.Explore BristolGet to know Bristol's central neighbourhoods and see how our campus integrates with the city.Safety and inclusivityFind out about the support on offer to help you make the most of your life in Bristol. Travel and mapsWhether you're headed to a lecture or the airport, find the best ways to get across Bristol.Student videoOur students love living in Bristol, and many stay here after graduation. The city's vibrant atmosphere and spirit make Bristol a popular place to call home and pursue a career. Hear from one of our students about their life in Bristol, and what the city means to them.city stats8thlargest city in the UK Centre for Cities3rdmost cultural and creative city in the UK European Commission 20196thbest student city in the UK QS Best Student Cities 20233rdgreenest city in the UK The Guardian 2021Illustrated BristolArtwork by Olivia Brotheridge"
