["https://bristol.ac.uk/international/fees-finance/scholarships"]
title = "International scholarships | International students | University of Bristol"
description = "International students can apply for a range of funding, including Think Big scholarships."
full_description = "Scholarships for international studentsInternational students can apply for a range of funding, including Think Big scholarships. Applications for Think Big scholarships are now open!Use the application guidance to help you complete your Think Big undergraduate or postgraduate scholarship application for 2025 entry. Undergraduate applications closed on 24 February 2025.Undergraduate application form closed on 24 February 2025Postgraduate application formThink Big is the University of Bristol’s flagship scholarship scheme. You can also search for other scholarships for international students. Think Big international scholarships Our Think Big international scholarships for undergraduate and postgraduate students could help you fund your UK study at the University of Bristol. We've invested up to £6 million in Think Big scholarships to help international students come to Bristol in 2025. These scholarships are for applicants with overseas fee status who have applied for an eligible undergraduate or master's course.Scholarships available Think Big undergraduate scholarships are valued at £6,500 and £13,000 for each year of study. Think Big postgraduate scholarships are valued at £6,500, £13,000 and £26,000 for each year of study. New for 2025, postgraduate students can also apply for the Think Big Career Accelerator. This bespoke employability programme is designed to boost your confidence in finding employment or advancing your career after graduation, and comes with a £3,000 scholarship.Think Big application deadlinesThink Big undergraduate scholarships Applications closed on 24 February 2025 at 10:00am UK time. Think Big postgraduate scholarships Applications will close on 23 April 2025 at 10:00am UK time.Multiple scholarships, one application Our Think Big scheme has partnered with faculties, alumni and external partners to offer a wide range of scholarships in addition to the standard Think Big undergraduate and postgraduate awards. To make the application process easier, you only need to submit one scholarship application. With one application we consider you for every scholarship, providing that you meet the necessary eligibility requirements.All scholarships and bursaries included in the Think Big application form are: Think Big Undergraduate Awards Think Big Postgraduate Awards Think Big About Business undergraduate awards Think Big About Business postgraduate awards Think Big About Childhood Studies undergraduate scholarship Think Big About Economics undergraduate scholarship Think Big About Economics postgraduate scholarship Think Big About Education postgraduate scholarships Think Big About Global Health Policy postgraduate scholarships Think Big About Innovation postgraduate scholarships Think Big About Law and Justice postgraduate scholarship Think Big About Nutrition, Physical Activity and Public Health postgraduate scholarship Think Big About Policy Studies undergraduate scholarship Think Big About Public Policy postgraduate scholarship Think Big Hong Kong Alumni and Friends scholarship: undergraduate law Michael Wong Pakshong bursary R. Senathi Rajah Memorial Scholarship Phyllis Mary Morris bursaries GREAT Scholarship: Vietnam GREAT Scholarship: Indonesia Further details Terms and conditions Before you begin your application, download and read the full 2025 Think Big Terms & Conditions (PDF, 147kB). Application timeline Date Event 25 November 2024 Applications opened 24 February 2025 Undergraduate applications close at 10:00am UK time April 2025 We notify undergraduate scholarship applicants of outcome 23 April 2025 Postgraduate applications close at 10:00am UK time May 2025 We notify postgraduate scholarship applicants of outcome July 2025 Scholarship award letters are sent to successful applicants Frequently asked questions You may have questions about applying for Think Big, so we have put together a list of the most frequently asked questions. Undergraduate Think Big scholarships: frequently asked questions Postgraduate Think Big scholarships: frequently asked questions Think Big Development Programme‌‌If you're awarded a scholarship, you not only receive financial support, you'll gain access to the Think Big Development Programme. The programme offers guidance, support, inspiration, and a solid framework for you to unlock your potential beyond your academic studies.International scholarships community on LinkedInJoin us on LinkedIn and network with current and past scholars. Be honest, enthusiastic and passionate in your application. Talk candidly about your reasons for applying, whether it is a fascination with the city, career aspirations, or a desire to be a part of something bigger.DaryaBSc PsychologyThink Big Scholarship recipient"
year_published = 2025
