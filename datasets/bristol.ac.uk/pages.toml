title = "Campus tours | Study at Bristol | University of Bristol"
description = "Our campus tours provide an opportunity for prospective undergraduate students to learn more about the University of Bristol."
full_description = "Campus toursOur campus tours provide an opportunity for prospective undergraduate students to learn more about the University of Bristol.Book your place Join our current students for a tour around the Clifton campus. The tours will give you an overview of central University buildings and the opportunity to ask current students about their experience studying at Bristol. Book a campus tour If you have any questions about our campus tours, please email choosebristol-ug@bristol.ac.uk Essential information before you visit: Tours last for up to two hours and include some steps and hills. Accessible tours are available for visitors with restricted mobility or wheelchair users. Accessibility requirements can be provided upon booking. Most of the tour is outside so please dress for the weather and terrain. If you would like somebody to accompany you on the tour, please book a place for one guest. Our tours offer you an overview of the University campus. The tours are not subject-specific, so you won't be able to visit academic departments or meet with admissions tutors. Please note the route does not include a tour of any accommodation. Disabled accessThe University has teamed up with AccessAble to provide you with detailed information about the accessibility of our facilities.Postgraduate campus toursInterested in postgraduate study? Join current postgraduate students for a campus tour."
