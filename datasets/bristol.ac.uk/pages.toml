["https://bristol.ac.uk/news/2025/february-/techworks-ai.html"]
title = "February : Techworks-AI | News and features | University of Bristol"
description = "TechWorks-AI, a new standalone community dedicated to advancing artificial intelligence (AI) and machine learning (ML) innovation, has been formally announced at a milestone event at the historic Bletchley Park."
full_description = '''View all newsUniversity of Bristol partnership launches initiative to drive AI innovation Engineering Trustworthy AI: From Concept to Reality event at Bletchley Park Press release issued: 27 February 2025TechWorks-AI, a new standalone community dedicated to advancing artificial intelligence (AI) and machine learning (ML) innovation, has been formally announced at a milestone event at the historic Bletchley Park.As a member of industry association TechWorks, the University of Bristol joins TechWorks-AI in a shared mission to bridge the gap between academic research and real-world AI applications. This partnership will drive innovation by fostering closer collaboration between researchers, industry leaders, and policymakers, ensuring that cutting-edge AI advancements translate into practical solutions. Together, TechWorks-AI and the University are committed to strengthening the UK’s deep tech sector by accelerating knowledge exchange, addressing industry-wide challenges, and shaping the future of trustworthy and responsible AI. Through this collaboration, the community will not only advance AI technology but also reinforce the UK’s position as a global leader in AI development and governance. Bringing together a diverse membership—including academia, industry, and government—TechWorks-AI will facilitate collaboration in key AI-driven sectors, such as autonomous platforms, robotics, semiconductor design, cybersecurity, energy efficiency, and emerging computing technologies like neuromorphics. Kerstin Eder, Professor of Computer Science in Bristol's Faculty of Science and Engineering, lead of the Trustworthy Systems Laboratory, said: "The University of Bristol has decades of experience in AI research, and we recognise the importance of collaboration between academia and industry. "Being a founder member of the TechWorks-AI community helps us bring our extensive research experience to bear on real-world applications, shaping the future of AI while fostering strong and impactful partnerships that drive innovation." Gareth Richards, Network Manager at TechWorks-AI, added, "We are excited to be working closely with the University of Bristol as a founding member of TechWorks-AI. "Their expertise in AI research and commitment to advancing trustworthy AI aligns perfectly with our mission. This partnership will help bridge the gap between academia and industry, ensuring that cutting-edge AI innovations translate into real-world impact."'''
