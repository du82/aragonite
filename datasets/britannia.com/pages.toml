["https://www.britannia.com/person/jodie-kelsall"]
title = "Jodie Kelsall - Britannia"
full_description = "View our team Jodie Kelsall Chief of Staff Britannia Global Markets Jodie has been one of the longest serving employees at Britannia having joined Berkeley Futures back in 2008, which was acquired by Britannia in 2019. In 2023 Jodie became Chief Operating Officer (COO) of Britannia Global Markets and progressed into the role of Chief of Staff in 2025 to advise and support the CEO and oversee and implement organisation-wide initiatives and programs. Previously, Jodie made her way through the ranks of Berkeley Futures, starting in the role of Receptionist and Trade Support, before being quickly promoted to the position of LME Trader & Trade Desk Manager. Prior to becoming COO, Jodie was the Head of LME Trading, managing daily trading activity, whilst overseeing a team of skilled traders and analysts, ensuring optimal performance and compliance with market regulations. She then moved onto the position of Head of Business Integration, responsible for change management, streamlining processes, fostering collaboration between departments, and implementing strategic initiatives to enhance overall operational efficiency. With over sixteen years’ experience in financial services Jodie has been at the forefront of considerable change in the City of London, working her way to a senior executive position at one of the UK’s leading financial groups. +44 (0) 20 3325 4574 jkelsall@britannia.com"
