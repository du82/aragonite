full_description = "Careers Britannia Financial Group is a diverse, dynamic, and rapidly growing business Our people are our biggest asset and the key to our ongoing success. If you thrive in a forward thinking and entrepreneurial environment where your talent will be recognised and rewarded, then we would like to hear from you. To view our current vacancies please click on the Job Vacancies button below or send your CV with a covering letter to careers@britannia.com Human Resources Officer See the role Senior Treasury Analyst See the role Liquidity Manager See the role Transaction Monitoring System Implementation Specialist See the role Why Britannia? Britannia Financial Group is a global financial services company that combines local expertise with global solutions to offer its clients a full range of financial products including securities and derivatives services. History With over 150 years of banking history, Britannia has evolved through the decades by adapting itself to the new realities of the international financial environment. Build relationships We aim to build and maintain strong relationships with both clients and employees, providing space for employees to maximise their potential in a stimulating working environment. Development Britannia anticipates a period of significant growth, both in the UK and internationally, which presents the opportunity for sustained professional development and progression. We offer a leading benefits and reward program to attract and retain the most skilled and talented employees in the industry. Our commitment to equal opportunities We believe that diversity and inclusion among our colleagues is critical to our success as a global company. We welcome applications from all suitably qualified persons regardless of their race, gender, disability, religion/belief, sexual orientation, gender identity or age."
