title = "Britannia Financial Group | About us"
description = "Britannia is a leading global financial group offering custody, securities and derivatives brokerage."
full_description = "About us A leading global financial group offering custody, securities and derivatives brokerage At Britannia, we believe that the quality of our service and deep-rooted relationships with our clients make the difference to the way we operate. Britannia Financial Group is controlled by a long standing banking family with over 150 years of experience in the financial services sector. Our group has evolved through the decades by adapting itself to the new realities of the international financial environment. An international presence 150 With a team of over 150 people, the Group is headquartered in London. Jurisdictions covered 6 UK Continental Europe US Latin America Middle East Asia History & experience 150 Long standing banking family with over 150 years of experience in the financial services sector. Britannia Global Markets Britannia Global Markets is a complete multi-asset brokerage. With a presence in London for almost four decades, the firm is a member of world-renowned markets and is able to offer access to major worldwide derivative markets. Find out more Britannia Global Investments Our UK and pan-European brokerage division of Britannia Financial Group Limited, Britannia Global Investments, offers bespoke execution and custody services for worldwide physical assets, including, equities, fixed income, and REPO services. Find out more Our leadership Julio Cesar Herrera Chief Executive Officer Britannia Financial Group Mark Bruce Head of Strategy Britannia Financial Group Steve Pettitt Chief Executive Officer Britannia Global Markets Daniel Reiser Chief Executive Officer Britannia Global Investments Our history 2021 United Kingdom Britannia Financial Group acquire certain assets and related cash from Dolfin Financial Limited (UK) in Special Administration 2021 United Kingdom Britannia Global Markets become Category 2 member of the London Metal Exchange 2020 United Kingdom Britannia Financial Group moves into global headquarters in The Scalpel in London 2019 United Kingdom Britannia Global Markets (acquisition of Berkeley Futures Limited) 2018 United Kingdom Britannia Global Investments (acquisition of Destek Markets UK) 2016 United Kingdom Incorporation of Britannia Financial Group 1986 United Kingdom Incorporation of Berkeley Futures Limited Working at Britannia Britannia is proud to be an equal opportunity employer, we value the unique talents of all our people and are committed to cultivating a diversified workforce which brings with it fresh perspectives and innovative ideas, qualities at the heart of Britannia’s growth and development. Find out more Discover more about our services at Britannia Get in touch"
