full_description = "Foreign exchange Britannia offers both Give-Up and Prime of Prime services Britannia provides a streamlined, low-touch solution to institutionally cleared counterparties via PB give-up, and a full front-to-back execution service to professional clients. Britannia supports a number of interaction mediums, including multiple GUI offerings, direct API consumption and voice execution. Agency With physical servers located in LD4 and NY4 Britannia serves clients with ultra-low-latency pricing distribution. With an industry leading technology stack in Lucera, PrimeXM and Flextrade, and two Tier 1 Prime brokers, Britannia delivers bespoke liquidity to meet every aspect of your requirements across spot/forward deliverable FX and NDFs. Prime-of-Prime Leveraging off Tier 1 Banks, selected non-banks and market makers, Britannia delivers a best-in-class bespoke liquidity solution for its Prime clients aimed to fit any needs. Clients benefit from a multi-asset single API covering spot FX, precious metals & CFDs (indices, commodities and soft commodities). At a glance Industry leading technology stack Global data presence across the 2 majors data centres Bespoke liquidity solutions Multi-asset offering covering FX, NDFs, Precious metals, index & commodity CFDs and FX settlement Prime broker relationships with Standard Chartered Bank and NatWest Platforms: Lucera (LumeFX) MT4 & MT5 Flextrade PrimeXM Key contact Thomas Clark​​​​ Head of FX, London +44 (0) 20 3325 5955 tclark@britannia.com Discover more about our services at Britannia Get in touch"
