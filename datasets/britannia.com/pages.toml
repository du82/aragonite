full_description = "Britannia Global Markets Britannia Global Markets is a complete multi-asset brokerage with global coverage With a presence in London for almost four decades, our firm offers access to all major worldwide derivatives markets. Our expertise Base metals Our services include F&O execution and clearing, risk management, and tailored solutions for our global client base consisting of physical hedgers, trade houses, funds, and HNW individuals, all supported by highly experienced staff and institutional-grade infrastructure. Find out more Foreign exchange Britannia provides access to the full array of global foreign currency markets serviced on an array of online platforms best suited to the client. Our experienced trading team support our customers on minimising market impact whilst maximising the speed and efficiency of transactions. Our Forex Desk provides a full suite of services for institutional clients, including execution, clearing and custody arrangements. Find out more Financial derivatives With a highly experienced multi-asset agency execution provider for the world’s most dynamic and innovative investors, our equities business delivers outstanding customer service, technology and best execution solutions. Facilitating access to the most established and emerging markets world-wide, our team of experienced sales and trading professionals provide global coverage, offering sales and execution services tailored to the client’s requirements. Find out more Commodities Britannia holds 40 years’ experience in the commodity derivative markets, sourcing liquidity on options, futures, and off exchange listed swaps markets, executed by a dedicated team of specialists, serving an extensive client base across a multitude of exchanges and platforms. Find out more Our leadership Julio Cesar Herrera Chief Executive Officer Britannia Financial Group Mark Bruce Head of Strategy Britannia Financial Group Steve Pettitt Chief Executive Officer Britannia Global Markets Daniel Reiser Chief Executive Officer Britannia Global Investments Resources The firm covers all major exchange traded and OTC derivative contracts, with specialist desk coverage include Agricultural and Soft Commodities, Energy, Foreign Exchange and financial derivatives. Britannia Global Markets is located in the City of London, is authorised and regulated by the Financial Conduct Authority, a member of the London Stock Exchange and FIA Europe with specialist desks coverage. The firm covers all major exchange traded and OTC derivative contracts. Britannia Global Markets: Resources Britannia Global Markets: Compliance Policies and Disclosures Working at Britannia Britannia is proud to be an equal opportunity employer, we value the unique talents of all our people and are committed to cultivating a diversified workforce which brings with it fresh perspectives and innovative ideas, qualities at the heart of Britannia’s growth and development. Find out more Discover more about our services at Britannia Get in touch"
