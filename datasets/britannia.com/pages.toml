description = "We are seeking a highly organised and detail-oriented HR Officer who is passionate about delivering an exceptional people experience."
full_description = "Careers Human Resources Officer Role overview We are seeking a highly organised and detail-oriented HR Officer who is passionate about delivering an exceptional people experience. Working in a small HR team of 4 and reporting to the Head of HR, the HR officer will assist with the full employee life cycle by providing administrative and operational HR support, ensuring smooth operations and compliance within the HR department. The ideal candidate will have strong administrative, numerical and communication skills; excellent attention to detail; an in depth understanding of HR processes; and a proactive approach to maintaining employee records and supporting the HR operations. Main responsibilities Employee Queries: serve as the first point of contact for employee inquiries regarding HR policies, benefits, and processes. Employee Records Management: maintain and update employee records, ensuring accuracy and compliance with company policies and legal requirements. HR Documentation: prepare and process HR documents such as employment contracts, probation and termination letters, and all other necessary documents throughout the full employee’s life cycle, ensuring compliance with HR, company and regulatory standards. Onboarding and Offboarding: support the onboarding and offboarding process ensuring all necessary documentation is completed. Carry out new employee HR inductions. Assist with coordinating pre-employment screening, right to work checks, visa sponsorships, and maintaining records. HR Systems Management: ensure HR software and databases are up to date, assisting with data entry, reporting, and troubleshooting as necessary. Compliance and Policy Support: assist in ensuring the company policies, procedures, and benefits programs are consistently applied and adhered to. General HR Administration: support the Head of HR with general administrative tasks, including (but not limited to) scheduling meetings, preparing reports, and taking minutes of HR meetings. Payroll Support: assist with the preparation of payroll and provide cover in absence of other team members. Essential skills/experience Proven experience in HR administration/operations within a small to medium-size organisation Experience using HR software and systems Proficient in MS Excel and Word Experience in HR minute-taking and MS mail merge an advantage Excellent communication skills, both written and verbal Strong organisational skills with attention to detail Ability to maintain confidentiality and handle sensitive information Strong problem-solving and time management abilities Apply for this job"
