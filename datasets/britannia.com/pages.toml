["https://www.britannia.com/cookies"]
title = "Britannia Financial Group | Cookies"
full_description = "Cookies 1. Use of cookies Our Britannia Financial Group Limited website uses cookies to distinguish you from other users of our website. This helps us to provide you with a good experience when you browse our website and also allows us to improve our site. 2. What is a cookie? This is a small file of letters and numbers that we store on your browser or the hard drive of your computer after you agree to such use. Cookies contain information that is transferred to your computer’s hard drive. Cookies help us to know you better by providing operational data that we can use to aid your interaction with our Website and improve its navigation and usability. The information we collect indirectly from you includes, but is not limited to, your Internet protocol (“IP”) address, browser type, operating system, Internet service provider (ISP), time stamps, transactions placed, and banner ads you click. 3. Cookies in use Essential Cookies; Analytical/Performance Cookies; Functionality Cookies; and Targeting Cookies described as follows. 4. Essential cookies These are cookies that are required for the operation of our website. They include, for example, cookies that enable you to log into secure areas of our website. Without these cookies, services you’ve asked for (such as access to secure areas) can’t be provided. These cookies will not gather any information about you that could be used for marketing or remembering where you’ve been on the internet. This category cannot be disabled. 5. Analytical/performance cookies They allow us to recognise and count the number of visitors to our website and to see how visitors move around our website when they are using it. This helps us to improve the way our website works, for example, by ensuring that users are finding what they are looking for easily. These cookies are not used to target you with online advertising. Without these cookies we are unable to learn how our website is performing and make relevant improvements that could improve your browsing experience. 6. Functionality cookies These are used to recognise you when you return to our website. This enables us to personalise our content for you, greet you by name and remember your preferences (for example, your choice of language or region). These can also be used to remember log-in details, changes you’ve made to text size, font and other parts of pages that you can customise. 7. Targeting cookies These cookies record your visit to our website and browsing habits, the pages you have visited and the links you have followed. We will use this information to make our website and the advertising displayed on it more relevant to your interests. We may also share this information with selected third parties for this purpose. 8. Cookie management Please note that other third parties (including, for example, advertising networks and providers of external services like web traffic analysis services) may also use cookies over which we have no control. These cookies are likely to be analytical/performance cookies or targeting cookies. You may block cookies by activating the setting on your browser that allows you to refuse the setting of all or some cookies. However, if you use your browser settings to block all cookies (including essential cookies) you may not be able to access all or parts of our site. If you’ve disabled one or more cookie categories, we may still use information collected from existing cookies, but we’ll stop using the disabled cookies to gather any further information. You can delete existing cookies from your browser. You can manage cookies by changing the settings in the web browser on your computer or tablet."
year_published = 2025
year_updated = 2024
