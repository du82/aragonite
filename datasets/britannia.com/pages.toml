full_description = "View our team Steve Pettitt Chief Executive Officer Britannia Global Markets Steve Pettitt has over three decades of experience within the financial services industry, having enjoyed a successful career in commodities trading focusing primarily on base metals. Prior to joining Britannia Financial Group, Steve was head of Base Metals at Berkeley Futures and formerly Managing Director at Jefferies where he was responsible for staff across London, Hong Kong and New York. After joining the Group in 2019, Steve was appointed Head of Sales for Britannia Global Markets, before joining the board to become Chief Executive Officer. Steve’s early career was spent at what we now know as SocGen, having been through mergers at Credit Lyonnais, Calyon and NewEdge. 020 3950 4590 info@britannia.com"
