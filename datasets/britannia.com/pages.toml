["https://www.britannia.com/vacancies/senior-treasury-analyst"]
title = "Britannia Financial Group | Careers: Senior Treasury Analyst"
description = "We are seeking a highly skilled and experienced Senior Treasury Analyst to join our Treasury team."
full_description = "Careers Senior Treasury Analyst Role overview We are seeking a highly skilled and experienced Senior Treasury Analyst to join our Treasury team. The successful candidate will be responsible for a wide range of treasury functions, including cash management, interest management, financial analysis, and project implementation. A strong understanding of CASS regulations is essential for this role. Main responsibilities Cash Management: Control daily cash management activities, broker balances, cash forecasting, bank account management, and payment processing. Optimize cash positioning to maximize interest returns while maintaining adequate liquidity. Monitor cash movements and disbursement processes. Interest Management: Control bank/broker/client interest income including analyse and calculation to maximise interest income Monitor interest rate movements and their impact on the business. Financial Analysis: Prepare and analyse financial reports, including daily TTCA reconciliation, daily client money/TTCA analysis reporting and cash flow statements. Conduct financial modelling and forecasting to support strategic decision-making. Identify trends and opportunities for process improvement and cost reduction. Project Implementation: Lead and participate in treasury-related projects, such as system implementations, process enhancements, and regulatory compliance initiatives. Collaborate with cross-functional teams to ensure successful project delivery. CASS Compliance: Ensure adherence to CASS regulations and best practices. Maintain knowledge of CASS requirements and regulatory changes. Reporting: Develop and produce accurate and timely treasury reports for management. Provide insightful analysis and recommendations based on report findings. Essential skills/experience Minimum of 5 years of experience in treasury or financial analysis. Strong understanding of treasury principles and practices. In-depth knowledge of CASS regulations and their application to treasury operations. Advanced proficiency in financial modelling and analysis tools (e.g., Excel, financial software). Excellent analytical and problem-solving skills. Strong attention to detail and accuracy. Effective communication and interpersonal skills. Ability to work independently and as part of a team. Experience in the financial services industry. Apply for this job"
