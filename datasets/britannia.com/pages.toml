full_description = "View our team Sebastian Jones Head of Trading Britannia Global Markets Sebastian began his career as a trainee stock broker for Berkeley Futures Limited in 2001, before joining the derivatives desk as a Sales Trader two years later. In 2006 Sebastian was promoted to the position of Associate Director and in the years that followed he ran the trading and sales teams. In 2008 Macquarie Bank took a stake in Berkeley Futures and Sebastian grew the sales and trading departments to a team of 20 front office staff. Upon Britannia Financial Group’s acquisition of Berkeley Futures in 2019 it was renamed Britannia Global Markets and Sebastian was made Head of Commodities, responsible for establishing a specialsed commodities team that focuses on agriculture, energy and base metals. In 2023 he was promoted to Head of Trading to oversee all asset classes and trading desks. Sebastian is also responsible for the marketing and communications at Britannia Financial Group. Sebastian holds CISI certificates for derivatives and securities. +44 (0) 20 3325 4146 sjones@britannia.com"
