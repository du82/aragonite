title = "Britannia Financial Group | Base metals"
description = "Britannia Global Markets offers a full suite of services in the base metals space supported by highly experienced staff and institutional-grade infrastructure."
full_description = "Base metals Britannia Global Markets offers a full suite of services in the base metals space Our services include F&O execution and clearing, risk management, and tailored solutions for our global client base consisting of physical hedgers, trade houses, funds, and HNW individuals, all supported by highly experienced staff and institutional-grade infrastructure. The Metals Desk provides access to on and offscreen liquidity from strong two-way flows across our diverse client base as well as trading directly with LME members enabling us to offer our clients best execution and contracts in multiple currencies: USD, GBP, & EUR. We offer Direct Market Access (DMA) through a variety of platforms including CGQ, TT, and 3rd party front ends that connect via an API, whilst also providing a more personalised traditional brokerage approach via voice execution. Advanced execution capabilities are offered, supported by decades of trading experience and a proven ability to manage complex or large orders efficiently with a minimal market impact. Specialisation in execution and facilitation on CME / LME Copper arbitrage with margin financing and the ability to bring forward profits to present value. At a glance Access to base metals futures, options, spreads, and OTC contracts in multiple currencies. Tailored risk management tools and expert hedge analysis services. Direct Market Access and mobile trading applications like CGQ and TT. Copper arbitrage trading with margin financing, increasing internal ROI comparing to full exchange margins. Bespoke commission structures to fit our clients trading style. Real-time trade reporting and customisable client service. Key contact Neil Welsh Head of Metals Britannia Global Markets +44 (0)20 3915 4531 nwelsh@britannia.com Discover more about our services at Britannia Get in touch"
