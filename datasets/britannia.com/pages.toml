["https://www.britannia.com/privacy-policy"]
title = "Britannia Financial Group | Privacy Policy"
full_description = "Privacy Policy Britannia Financial Group Limited, together with its operating subsidiaries, Britannia Global Markets Limited and Britannia Global Investments Limited, is committed to protecting your privacy and safeguarding your personal data. This privacy policy provides a summary of how and why personal information may be collected in the course of our businesses, including via our website, email communications and digital platforms and applications, and how the personal information is used and shared. Please note the policy does not cover any external third-party websites that may be accessed through the links provided on our website. 1. Who is responsible for your personal data? This will depend on which operating entity you are dealing with. Britannia Global Markets Limited is registered as data controller with ICO no. ZA5670550. Britannia Global Investments Limited is registered as data controller with ICO no. ZA555181. 2. Collection of personal information As part of our business operations, we collect certain personal information about our clients. Any such personal information is held securely and in line with our obligations under the Data Protection Act 2018 (“DPA”), the General Data Protection Regulation (Regulation (EU) 2016/679), UK GDPR (as that term is defined in section 3(10) of the DPA, and as it forms part of the United Kingdom’s domestic law by virtue of the European Union (Withdrawal) Act 2018), and the Privacy and Electronic Communications (EC Directive) Regulations 2004 (together with any implementing laws), (together, the “Data Protection Legislation”). The personal information we may collect and process includes: Personal information you provide to us, such as your full name, email address, physical address, home and mobile phone numbers, contact details, gender, financial information (e.g. income and source of wealth), identification information (e.g. nationality, passport, National Insurance or National Identification number and driving license), date of birth, professional and employment details, trading details, know your customer information and any other personal data that you may provide when you open an account with us or we refresh our records. Personal information which we receive from third parties including, for example, business partners, analytics providers, search information providers, credit reference agencies and third-party marketing companies and through publicly available sources. Special category data (formerly sensitive personal data) which under UK GDPR is information concerning an individual’s racial or ethnic origin, political opinions, religious or philosophical beliefs, trade union membership, genetic data, biometric data, health data, sexual orientation and sex life. To the extent, any special category data is received from you, it shall be retained only to the extent strictly necessary to comply with our legal obligations. Personal information from monitoring (in accordance with applicable Data Protection Legislation) your engagements with us, such as emails, text messages, app and digital communications, telephone calls, visits to our website (through cookies and other technology), visits to our premises and/or events and through your use of our services. Personal information from publicly available sources, such as media reports, information made publicly available by a third party or posts on social media platforms. Personal information gathered for recruitments purposes. 3. Why we process your personal information We use your personal information: to perform our services on an ongoing basis in accordance with our contract with you or to take steps at your request to enter into a contract; to comply with our legal and regulatory obligations and our risk management processes, including (but not limited to) know your customer, anti-money laundering and anti-terrorist financing legislation; for our internal business processes, including (but not limited to) providing support to our employees; to improve our services, for data analytics and/or upgrading our website and/or trading platforms; to provide you with news, general information about other products and/or events, marketing or advertising (together with third parties who offer services in this regard) and measure the effectiveness of the same; to evaluate and/or execute a restructuring, reorganisation, sale or transfer of some or all of our assets, whether as a going concern or otherwise, dissolution, bankruptcy or liquidation (or any analogous procedure). 4. How we use and disclose your personal information Where it is necessary for the performance of our contract with you, or for internal business processes, we may share your personal information with: other companies within our group who provide financial and other services; service providers (including introducing brokers), professional advisers, credit, reference and technology providers and other third parties who provide us with administrative, financial, insurance, research and/or other services; courts, tribunals and regulatory authorities as authorised and/or required by law; anyone authorised by an individual, as specified by that individual or the contract; and a potential buyer, if we are sold or merged with another company. In addition, it may be necessary to disclose your personal information to third parties in order to comply with our legal obligations, to carry out investigations, to protect our (our clients’ and our employees’) rights and/or to enforce our contracts. By submitting your personal information to us, you acknowledge that such third parties may receive and process your personal information. We ask all third parties to treat your personal information securely and will take reasonable steps to ensure that their procedures comply with relevant laws. For transfers from the United Kingdom (or the European Economic Area (“EEA”)) to countries not recognised by the European Commission as providing an adequate level of data protection according to EEA standards, we have put in place measures, including the adoption of standardised and pre-approved model data protection clauses, to protect your personal information. 5. Data security and your rights We implement appropriate security controls to protect data from unauthorised or unlawful access, disclosure, alteration, or destruction. This includes measures such as encryption, access controls, firewalls, and regular security audits. Under the Data Protection Legislation, you have the right to: obtain copies of any personal information which we hold about you; inform us of any inaccuracy and request amendments and corrections so that your personal information is accurate and up to date; request that your personal information is deleted and/or require erasure of your personal information; request that your personal information is forwarded to a third party; and withdraw any consent you have provided with regards to a legal basis for our processing of your personal information. You also have the right to complain to the Information Commissioner Office about our collection and use of your personal information. If you have a request, question or complaint about your privacy and personal information and/or if you wish to exercise any of your rights, please mark correspondence “For the attention of the Data Protection Officer” and contact either Britannia Global Markets Limited or Britannia Global Investors Limited (as the case may be) by mail, in either case, to Level 29, 52 Lime Street, London EC3M 7AF, or by email to: Britannia Global markets Limited at dpo.gm@www.britannia.com, or Britannia Global Investors Limited at dpo.gi@Britannia.com."
