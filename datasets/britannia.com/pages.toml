full_description = "Britannia Global Investments Britannia Global Investments provides investment services across equity and fixed income products Our UK and pan-European brokerage division of Britannia Financial Group Limited, Britannia Global Investments, offers bespoke execution and custody services for worldwide physical assets, including, equities, fixed income, and REPO services Our expertise Securities & fixed income Our established European Securities and fixed income teams provides sales and trading capabilities for institutional investors across multiple Markets including equities, government bonds, corporate bonds, high yield debt, distressed debt and convertible bonds. Supporting platforms ensure round-the-clock access to global markets, enabling our clients to source liquidity from across the globe, efficiently and autonomously. Securities financing Our qualified clients can benefit from enhanced yields and low-cost securitised financing, facilitated by our dedicated securities financing team. Focused on providing multiple financing options to best serve our clients throughout the yield curve. REPO Britannia Global Investments facilitates efficient, reliable network access and expert execution services for global securities finance, via repo, reverse repo, stock borrow-loan and margin leverage, covering all major asset classes across equities and fixed income markets. Providing multi-currency options with flexible and competitive pricing, our dedicated REPO desk ensures the highest quality of support for our clients. Find out more Our leadership Julio Cesar Herrera Chief Executive Officer Britannia Financial Group Mark Bruce Head of Strategy Britannia Financial Group Steve Pettitt Chief Executive Officer Britannia Global Markets Daniel Reiser Chief Executive Officer Britannia Global Investments Working at Britannia Britannia is proud to be an equal opportunity employer, we value the unique talents of all our people and are committed to cultivating a div