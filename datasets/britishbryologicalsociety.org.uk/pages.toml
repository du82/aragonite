["https://www.britishbryologicalsociety.org.uk"]
title = "Home - British Bryological Society"
full_description = "If you’ve ever been fascinated by the colourful and multi-textured array of mosses on a stone wall, stony ground or woodland floor, and wondered what they all are, then this section is for you. The Learning area of the website will introduce you to bryophytes and get you started identifying some of the common species around where you live. …without even leaving the house. Many knowledgeable and experienced BBS members have contributed to the vice-county pages, describing what can be found in their local areas and giving hints and tips on places to visit. Read all about your vice-county before you head out. The Species Finder is your gateway to a wealth of information about the mosses, liverworts and hornworts to be found in the UK. Ultimately, we hope to include a page dedicated to each species, with identification tips, up-to-date distribution information, links to useful resources and an image gallery showing a range of images including habitat photos, close-ups and microscope images."
