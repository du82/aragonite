["https://www.britishbryologicalsociety.org.uk/category/bryophyte-of-the-month"]
title = "Bryophyte of the month Archives - British Bryological Society"
full_description = "Hookeria lucens One of the many fascinating things seen (and photographed) at the recent Reproductive Structures workshop at Treborth Botanic Gardens. This image shows the archegonia (female organs) of Hookeria lucens. Male organs (antheridia) were also seen, and the reproductive structures of many other species studied and recorded. Many thanks to Prof. Jeff Duckett for sharing some of his considerable knowledge of this rather under-valued and neglected aspect of bryology. View more Odontoschisma denudatum A visit was recently made to Woolmer Forest in North Hampshire v.-c.12 in an attempt to refind Protolophozia herzogiana. This was not successful, but the locality provided a rich assemblage of leafy liverworts including this Odontoschisma denudatum. This attractive species with bright gemmae on attenuated shoots is found typically on moist peaty banks but appears to be declining. The plants were growing through a mat of algal slime due to atmospheric nitrogen deposition which is a major threat to small leafy liverworts. View more Hedwigia ciliata var leucophaea This species has featured before as a Bryophyte of the Month, back in the 2000's, but there is always a place for a beautiful (and scarce) bryophyte with a story to tell! View more Plagiochila britannica The Glos local group was pleased to find this species on a recent meeting in the Forest of Dean. It can be difficult to tell from the more common P. asplenioides and P. porelloides, but its habit - growing in loose mats - and leaf shape gave this one away. On close inspection, the cells looked a little larger too, but that needed confirming under the microscope. View more Herbertus borealis One of the many beautiful liverworts seen on the recent BBS Liverwort Workshop in Kinlochewe. This lovely photo was taken by Philippa Thompson. View more Halloween Bryophyte I'm not sure what this Marchantia was looking at, surely the photographer wasn't that scary!!! View more Dumortiera hirsuta This rather rare oceanic liverwort was seen on the banks of the Claggain river during the recent Summer meeting on Islay. It is large and differs from other thallose liverworts also found in this habitat by having no air pores on its surface, and having bristly hairs along the thallus margins - so there should be no problem identifying it if you are lucky enough to see it! View more Grimmia anomala The common name for this moss is Yellow-bud Grimmia, presumably because of the yellowish clusters of gemmae on many of the shoot tips (which you might be able to make out on the left side of this cushion). This photo was taken during the Ben Lawers meeting in autumn 2023, on a loch-side boulder at Coire nan Cat - a typical habitat for this species. View more Mylia taylorii This beautiful close-up of a shoot of Mylia taylorii, taken by Wouter van Landuyt from a specimen collected on Islay, shows the recurved leaves and large cells beautifully. To say that I'm envious of the microscope Wouter used to take this photo would be an understatement! View more Moerckia flotoviana Spotted by David Long on the recent BBS summer meeting on Islay. This specimen is growing with a confusing mixture of other liverworts, including Aneura pinguis, a Riccardia and a Jungermannia (at least!). These are female plants, with young, frilly-looking perianths. View more 1 2 3 … 24 Next >"
