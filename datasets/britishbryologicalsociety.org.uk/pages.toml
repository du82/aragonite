["https://www.britishbryologicalsociety.org.uk/recording"]
title = "Recording - British Bryological Society"
full_description = "Start recording If you’re relatively new to bryology, and interested in getting more involved and contributing to our knowledge of bryophytes, there is no better way to do this than to start recording the species that you see. Find out more Vice-county explorer Use our vice-county map to start exploring your local area, or check out places to go whilst on holiday in some other area of the country. Many of the vice-county pages contain a wealth of information written by local bryologists with links to other useful websites or resources. Start exploring Recording cards Recording ‘cards’ are available in various formats as described on this page. Some are also downloadable here. Find recording resources Submitting new vice-county records Some guidelines on what to do when you find a species new to your area. Find out more Duties of regional recorders Regional Recorders are appointed by the Society to receive and validate species and site records collected in their or region by individual bryological recorders and forward them at intervals to the Recording Secretary for inclusion in the BBS database. View more information NBN Atlas Explore BBS species records on the NBN Atlas Explore species records Irish National Biodiversity Centre Explore BBS species records for Ireland on the NBDC Explore species records"
