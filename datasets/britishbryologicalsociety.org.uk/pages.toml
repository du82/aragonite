["https://www.britishbryologicalsociety.org.uk/resources/bryophyte-attributes"]
title = "Bryophyte attributes - British Bryological Society"
full_description = "Introduction Tabulated and codified attribute data for species can be very useful in ecological research. BBS members have been instrumental in creating 2 datasets of attribute data for bryophytes, one for altitude limits of each species, and the other covering native status, size, life form, life history, altitudinal and geographical range and habitat. These datasets are periodically updated and re-issued. Please send any amendments to the Recording Secretary, recording@britishbryologicalsociety.org.uk. BRYOATT – Attributes of British and Irish Mosses, Liverworts and Hornworts BRYOATT was published in 2007 by the Centre for Ecology and Hydrology (CEH) and provided for all British and Irish species a codified set of attributes for use in ecological analyses. These included information on native status, size, life form, life history, altitudinal and geographical range and habitat of 1057 British and Irish bryophyte species and a further 134 aggregates and infraspecific taxa. Much of the information was newly compiled, or generated afresh for this publication. Ellenberg values for Light, Moisture, Reaction, Nitrogen and Salt tolerance were provided for all taxa. A new classification of the life forms was proposed and applied to all taxa. Their substrates and EUNIS habitats in Britain and Ireland were also tabulated. BRYOATT was published as a printed book (Hill MO, Preston CD, Bosanquet SDS, Roy DB. 2007. BRYOATT. Attributes of British and Irish Mosses, Liverworts and Hornworts), and also made available in digital format as a spreadsheet of data and accompanying explanatory text in PDF form. The spreadsheet is updated periodically to take into account recent records and data, and the latest version is published on the Biological Records Centre (BRC) website. At the time of writing the most recent version was released in 2017 and for ease of access is provided as a download here. However, you should check the BRC website for the latest version. Hill, M.O., Preston, C.D., Bosanquet, S.D.S., Roy, D.B. 2007, updated 2017. BRYOATT – Attributes of British and Irish Mosses, Liverworts and Hornworts The latest version of the BRYOATT spreadsheet is always published on the Biological Records Centre website. Check the BRC website for the latest version of BRYOATT Hill, M.O., Preston, C.D., Bosanquet, S.D.S., Roy, D.B. 2007, updated 2017. BRYOATT – Attributes of British and Irish Mosses, Liverworts and Hornworts – spreadsheet Spreadsheet of bryophyte attribute data, updated 2017 Download the 2017 version of BRYOATT Hill, M.O., Preston, C.D., Bosanquet, S.D.S., Roy, D.B. 2007, updated 2017. BRYOATT – Attributes of British and Irish Mosses, Liverworts and Hornworts – notes Explanatory text for BRYOATT spreadsheet Download explanatory notes for BRYOATT Altitude limits for bryophytes in Britain and Ireland Lowell, J., Hill, M.O. & Bosanquet, S.D.S. 2014. Altitude limits for British and Irish Bryophytes up to 2014. Following the publication of the Atlas of British and Irish Bryophytes in 2014, John Lowell, Mark Hill and Sam Bosanquet updated the recorded altitudinal limits for British and Irish bryophytes and made them available in an Excel spreadsheet. Download altitude limits up to 2014 Lowell, J., Hill, M.O. & Bosanquet, S.D.S. 2014, revised 2016 by O. Pescott. Altitude limits for British and Irish Bryophytes up to December 2015. A separate spreadsheet incorporates changes to these limits since 2014, and was last updated in May 2016 incorporating changes up to the end of 2015. Download altitude limits up to December 2015"
