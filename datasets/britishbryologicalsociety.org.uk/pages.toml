["https://www.britishbryologicalsociety.org.uk/publications/miscellaneous-publications"]
title = "Miscellaneous publications - British Bryological Society"
full_description = "Introduction On occasion, the BBS (and the Moss Exchange Club prior to formation of the BBS) has published handbooks, special volumes, and books to mark special occasions. A list of these has been compiled by Dr Philip Stanley, and was originally published on his website www.lumiweb.com, but is now given below. This list also includes details of the London and York Catalogues published before 1896 when the Moss Exchange Club (MEC) was founded. Census Catalogues published after the MEC was founded in 1896 can be found on the Census Catalogues page. Dr Stanley has also provided scanned copies of some of the items listed, and these are available to download as PDF files. Publications London Catalogue (1877) View here The London Catalogue of British Mosses Hobkirk, C.P. and Boswell, H. (1877) Pp. 11 (no index). Compiled for the Botanical Locality Record Club [a list of recognised moss species found in Britain and Ireland]. Printer is given on p. 11 as T.P. Newman, Printer, 32 Botolph Lane, Eastcheap, London, E.C. (Stafleu & Cowan quote “Welwyn”) London Catalogue, 2nd Ed., (1881) View here The London Catalogue of British Mosses and Hepatics, 2nd Edition Lees, F.A. (Editor) (1881) Pp. 32 (incl. a 1 page index of excluded species and 3 pages of “Explanation of the Catalogue” ) Compiled for the Botanical Record Club [“Showing the comparative rarity or frequency of each species by means of a Census indication of its distribution through the eighteen Watsonian Provinces of Great Britain“], printed/published by David Bogue, 3 St. Martin’s Place, Trafalgar Square, [London] W.C. York Catalogue [1889] View here The York Catalogue of British Mosses Compiled by Wheldon, J.A. (date not printed on Catalogue but Stafleu & Cowan give date as 1889) Pp. 16 (no index), for the York and District Naturalists Society [a list of recognised moss species found in Britain and Ireland] printed by Ben Johnson & Co., 100 & 101 Micklegate, York Formation of the Moss Exchange Club in 1896 Extract from MEC Report 1897 p. 5: ‘As it has become advisable to substitute a new List for the “York Catalogue,” I took council with some of our members, and with their approval decided to adopt the new “Handbook Catalogue,” and use it for the Club, which has now been sent out to members.’ “Handbook” Catalogue of British Mosses. A numbered catalogue of the species and varieties, as given in the “Student’s Handbook of British Mosses.” By H. N. Dixon, M.A., F.L.S. Index to Genera on inside front cover + 15 pages. Eastbourne: Printed and sold by V. T. Sumfield, “Standard” Office. London: Sold also by John Wheldon & Co., 58, Great Queen Street. 1897. [Not seen] Moss Exchange Club Catalogue of British Hepaticae (1897) View here Moss Exchange Club Catalogue of British Hepaticae Compiled by Waddell, Rev. C.H. (1897) Pp. 7 (+ 1 page index to genera) [a list of recognised hepatic species found in Britain and Ireland]. published by W. Wesley & Son, 28 Essex Street, Strand, London. Printed by J. Elliott, High Street, Stroud Catalogue of British Hepatics (1904) View here Catalogue of British Hepatics Lett, H.W. (1904) Pp. 10 (+ 1 page index to genera) [a list of then recognised species of hepatics species found in Britain and Ireland numbering 262]. Published by the author. Printed by V.T. Sumfield, Station Street, Eastbourne Synopsis of the European Sphagna (1917) View Here Synopsis of the European Sphagna Wheldon, J.A., published for M.E.C., printed by W.H. Western, Darwen (1917) Pp. 42 (no index) An Illustrated Handbook of the British Sphagna(1927) View Here An Illustrated Handbook of the British Sphagna (after Warnstorf) Sherrin, W.R., (presumed to have been published by BBS) printed by Taylor and Francis, Red Lion Court, Fleet Street, London (1927) Pp.74 (incl. 2 page index to species). (Forward by H.N. Dixon). Two versions, one printed on both sides of page and the other printed on recto side only Formation of the BBS in 1923 A Short Account of the Moss Exchange Club and the British Bryological Society (1944) View Here A history of The Moss Exchange Club and British Bryological Society. Privately printed by the author, Miss Eleonora Armitage (the only lady member to join when the MEC was formed in 1896). Copies were provided via the Honorary Secretary to all new members of the Society. A Short Account of the Moss Exchange Club and the British Bryological Society (1956) View Here A history of The Moss Exchange Club and British Bryological Society. Privately printed by the author, Miss Eleonora Armitage (the only lady member to join when the MEC was formed in 1896). Copies were provided via the Honorary Secretary to all new members of the Society. This is a reprint of the 1944 publication, but the contents, whilst having exactly the same words, have been reset with different font. Bryophyte Systematics* (1979) Bryophyte Systematics Eds. Clarke, G.C.S. and Duckett, J.G. London, Academic (1979) ISBN 0-12-175050-7. Pp. 582. (Joint Symposium with Systematics Association, Bangor, 16 – 19 August 1978) Bot. J. Linn. Soc. 98* (1987) Botanical Journal of the Linnean Society, vol. 98 (1987) Pp. 183 – 275. (Joint Symposium to celebrate Bicentenary of The Linnean Society of London, May 1987: Issue entitled: Bryology: Modern Research and the Ways Forward. Eds. Newton, M.E., Wanstall, P.J. and Jury, S.L.) Bot. J. Linn. Soc. 104* (1990) Botanical Journal of the Linnean Society, vol. 104 (1990) Pp. 1 – 291.(Joint Symposium in conjunction with the British Ecological Society on Bryophyte Ecology, Edinburgh, 19 – 22 July 1988. Issue entitled: Bryophytes in terrestrial ecosystems. Eds. Jury, S.L., Lightowlers, P.J. and Longton, R.E.) Centenary Symposium* (1998) Bryology for the 21st Century (Society’s Centenary Symposium, Glasgow, 5 – 7 Aug 1996) Eds. Bates, J.W., Ashton, N.M. and Duckett, J.G., Leeds, Maney, (1998). Pp 382. ISBN 0 901286 90 7. Pp. 382 Sp. Vol. 1* (1985) View Here Special Volume 1 BBS Diamond Jubilee Symposium Eds. Longton, R.E. and Perry, A.R., published by BBS, Cardiff (1985) ISBN 0 9507639 2 6; ISSN 0268-8034. Pp.89. (Symposium held in London, 17 – 18 September 1983) Sp. Vol. 2* (1989) View Here Special Volume 2 A Practical Guide to Bryophyte Chromosomes Newton, M.E., published by BBS, Cardiff (1989) ISBN 0 9507639 3 4; ISSN 0268-8034. Pp. 19 Sp. Vol. 3* (1989) View Here Special Volume 3 A Guide to Collecting Bryophytes in the Tropics O’Shea, B.J., published by BBS, Cardiff (1989) ISBN 0 9507639 4 2; ISSN 0268-8034. Pp. 28 Sp. Vol. 4 (1992) View Here Special Volume 4 Mosses in English Literature Edwards, S.R., published by BBS, Cardiff (1992) ISBN 0 9507639 5 0; ISSN 0268-8034. Pp. 44 Sp. Vol. 5 (1997 – 2021) View the latest edition on the Bryophyte Literature page Special Volume 5 English Names for British Bryophytes Edwards, S.R., published by BBS, Cardiff 1st Edition (1997) ISBN 0 9507639 6 9; ISSN 0268-8034 Pp. 68 View Here 2nd Edition (1999) ISBN 0 9507639-8-5; ISSN 0268-8034. Pp. 80 View Here 3rd Edition (2003) ISBN 0 9507639-9-3; ISSN 0268-8034. Pp. 80 View Here 4th Edition (2012), (published by BBS, Northampton)) View Here 5th Edition (2020) ISBN 0 978-0-9561310-2-7; ISSN 0268-8034. Pp. 89 Field Guide* (2010) More details on the Field Guide page Mosses and Liverworts of Britain and Ireland, a field guide Edited by: Atherton, I., Bosanquet, S. and Lawley, M. published by BBS, (2010) ISBN 978-0-9561310-1-0 (paperback), Pp. 848. Printed by Latimer Trend & Co. Ltd, Plymouth Bryophyte Recording Handbook* (2012) View here Bryophyte Recording Handbook Edited by: Preston, C.D., Blackstock, T.H., Bosanquet, S.D.S., Godfrey, M.F., Hill, M.O., Holyoak, D.T. and Rothero, G.P., published by BBS, (2012) ISBN 978-0-9561310-3-4 (paperback), Pp. 42. Printed by Latimer Trend & Co. Ltd, Plymouth Items from the volumes marked with * are cited in the Cumulative Index to be found on the Indexes page."
