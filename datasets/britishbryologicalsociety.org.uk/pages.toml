["https://www.britishbryologicalsociety.org.uk/resources"]
title = "Resources - British Bryological Society"
full_description = "Bryophyte identification In this section you will find identification keys to groups of species, useful downloads and links to additional online resources. Browse ID resources Bryophyte attributes Tabulated and codified attribute data for species can be very useful in ecological research. 2 datasets are provided here. Download attribute data Checklists and distribution The BBS maintains a database of bryophyte records for the UK and Ireland, which is used to produce various distribution maps, checklists etc. This page pulls together all these resources and provides links to similar resources for other parts of the world. Find the latest checklists Conservation status Red lists and lists of nationally rare and scarce plants are commonly used conservation tools, used to focus conservation effort and influence policy and decision making. View more information Tropical bryophyte resources The Tropical Bryology Group was active for many years, and accumulated / compiled many useful resources for tropical regions. View more information Bryophyte literature There is a wealth of literature about bryophytes, as a search of the internet will soon show – and it’s impossible to include them all here. However, we do list some of the most popular and useful books to get you started. Some recommended books The BBS Library, Sales & Loans The BBS provides access to a range of physical resources in addition to its various publications. These are managed by the BBS Librarian, and you will find details in this section, including how to borrow or purchase items. View more information Apply for a grant The BBS awards a small number of grants each year, with the aim of promoting bryological activities at home or abroad, including field work, attending meetings and publishing the results of research. Read more and apply Course providers The BBS runs courses and workshops when a need is identified; these are available to BBS members and details will be published in Field Bryology and in the Events section of the website. However, a few organisations offer courses in Bryophyte Identification and you will find their details here. Find a course The BBS Herbarium The BBS Herbarium (BBSUK) is hosted at the National Museum of Wales in Cardiff. In this section you’ll find historical information and information about accessing BBSUK. Find out more Bryohistory What were the early bryologists like and who were the key players in the development of bryology in Britain and Ireland? Several members have researched this subject in the past, and you can read all about their findings here. Explore historical resources Useful links Here you will find links to other potentially useful websites. View more information"
