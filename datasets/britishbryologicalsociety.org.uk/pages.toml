["https://www.britishbryologicalsociety.org.uk/news"]
title = "News - British Bryological Society"
full_description = "Recently updated… This page will list recent updates to the website, to make it easier for you to keep up to date. News posts won’t be included as they automatically appear on the Home page. Similarly upcoming events are shown on the Home page and won’t be included here (unless there is an important update to a […] View more Hookeria lucens One of the many fascinating things seen (and photographed) at the recent Reproductive Structures workshop at Treborth Botanic Gardens. This image shows the archegonia (female organs) of Hookeria lucens. Male organs (antheridia) were also seen, and the reproductive structures of many other species studied and recorded. Many thanks to Prof. Jeff Duckett for sharing some of his considerable knowledge of this rather under-valued and neglected aspect of bryology. View more The story of Treborth Botanic Garden Moss Trail Read about the creation of Treborth Botanic Garden Moss trail, one of the many initiatives inspired by National Moss Day 2023. View more Odontoschisma denudatum A visit was recently made to Woolmer Forest in North Hampshire v.-c.12 in an attempt to refind Protolophozia herzogiana. This was not successful, but the locality provided a rich assemblage of leafy liverworts including this Odontoschisma denudatum. This attractive species with bright gemmae on attenuated shoots is found typically on moist peaty banks but appears to be declining. The plants were growing through a mat of algal slime due to atmospheric nitrogen deposition which is a major threat to small leafy liverworts. View more Membership Management system – update for members with expired subscriptions View more Hedwigia ciliata var leucophaea This species has featured before as a Bryophyte of the Month, back in the 2000's, but there is always a place for a beautiful (and scarce) bryophyte with a story to tell! View more Plagiochila britannica The Glos local group was pleased to find this species on a recent meeting in the Forest of Dean. It can be difficult to tell from the more common P. asplenioides and P. porelloides, but its habit - growing in loose mats - and leaf shape gave this one away. On close inspection, the cells looked a little larger too, but that needed confirming under the microscope. View more The MossWorlds Project View more Herbertus borealis One of the many beautiful liverworts seen on the recent BBS Liverwort Workshop in Kinlochewe. This lovely photo was taken by Philippa Thompson. View more Halloween Bryophyte I'm not sure what this Marchantia was looking at, surely the photographer wasn't that scary!!! View more 1 2 3 … 31 Next >"
