["https://www.britishbryologicalsociety.org.uk/publications/journal-of-bryology"]
title = "Journal of Bryology - British Bryological Society"
full_description = "Prev Next General information The Journal of Bryology is an international botanical periodical which publishes original research papers in cell biology, anatomy, development, genetics, physiology, chemistry, ecology, paleobotany, evolution, taxonomy, molecular systematics, applied biology, conservation, biomonitoring and biogeography of bryophytes, and also significant new check-lists and descriptive floras of poorly known regions and studies on the role of bryophytes in human affairs, and the lives of notable bryologists. It is published four times a year by Taylor & Francis on behalf of the BBS, and is sent free of charge to all BBS members who elect to receive a printed copy. General information about the journal can be found on the T&F website, here. Lists of all issues for both Journal of Bryology and the Transactions, giving publication dates, pagination and editors can be found below. Submitting articles All manuscripts for consideration for publication in The Journal of Bryology (except for contributions to the New National and Regional Bryophyte Records column) should be submitted through the publisher’s online portal, which can be accessed via the green button marked “Go to submission site” on the left of the “Instructions for authors” webpage: https://www.tandfonline.com/action/authorSubmission?show=instructions&journalCode=yjbr20 Contributions to the New National and Regional Bryophyte Records column should be emailed directly to the column editor, Len Ellis, at l.ellis@nhm.ac.uk Online access Taylor & Francis provide online access to the Journal, and articles are made available as soon as they are published – which is often before they are printed. BBS members who register on the BBS website will automatically be given access via the Member’s Area. Online access includes all past content of the Journal of Bryology (1972 onwards) and its precursor, the Transactions of the British Bryological Society (1947-1971). It is possible to regi