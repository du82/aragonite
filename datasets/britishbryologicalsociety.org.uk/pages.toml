["https://www.britishbryologicalsociety.org.uk/resources/bryohistory"]
title = "Bryohistory - British Bryological Society"
full_description = "A social and biographical history of British and Irish field bryologists Robert Braithwaite was a leading British bryologist in the 19th century. He wrote Sphagnaceae or Peat-mosses of Europe and North America (1880), but his lasting contribution to British bryology is his three volumes of The British Moss-flora (1887-1905), illustrated by himself. “Field-bryology, like most enterprises, began obscurely. Although more than 1,000 species of moss and liverwort are now known from Britain, herbalists of the Middle Ages knew only of ‘moss’, and referred to thalloid liverworts as ‘lichen’. Indeed, lichens themselves were classified as types of moss until Tournefort recognised them as a distinct group in 1694. Since then, fitfully but without long breaks, bryologists have continued to add species to the list of British bryophytes. So when, by whom, and in what circumstances were our other thousand-odd species of mosses and liverworts subsequently discovered? Who first found them in Britain, and who then found them new to different parts of the country? “What ambitions did bygone bryologists harbour as they set out to explore the world around them? How did their family backgrounds, upbringings, social worlds, and occupations influence what they found and failed to find? And how did popular interests and contemporary knowledge (such as knowledge or ignorance of species, of their life-cycles and variability in features, and the quality and comprehensiveness of bryofloras) influence what these bryologists saw and overlooked?” For a fascinating walk through bryological history, introducing some of the key players and their work, and discussing some of the questions posed above, read the full article by Mark Lawley. Mark Lawley's History of British Bryology Artisan Botany Many people – including BBS members Mark Lawley and Tom Blockeel (see below) – have been fascinated by the uprising of working class botanists in the late 18th and early 19th centuries, particularly in northern England. Cambridge scholar Anne Secord has studied this subject extensively, focussing on popular science – especially working class naturalists – in early 19th century Britain. In 1994 she published the acclaimed paper: ‘Science in the pub: artisan botanists in early nineteenth-century Lancashire’, in which she discussed the place of working class botanists within society and the scientific community, and the tensions between popular science and the scientific elite. This was followed in 1996 by an essay on ‘Artisan Botany’ in the following publication: ‘Artisan Botany’, in N. Jardine, J. A. Secord, and E. Spary, eds, Cultures of Natural History (Cambridge: Cambridge University Press, 1996), pp. 378–93. Other works by Anne Secord include: ‘Specimens of observation: Edward Hobson’s Musci Britannici’ in Liba Taub, Joshua Nall, and Frances Willmoth, eds. The Whipple Museum of the History of Science: objects and investigations to celebrate the 75th anniversary of R. S. Whipple’s gift to the University of Cambridge (Cambridge: Cambridge University Press, 2019), pp. 101–18. ‘Talbot’s first lens: botanical vision as an exact science’, in Chitra Ramalingam, Mirjam Brusius, and Katrina Dean, eds, William Henry Fox Talbot: Beyond Photography (New Haven: Yale University Press, series in ‘Studies in British Art’, 2013), pp. 41–66. The influence of social background on the emergence of British field-botanists in the 17th – 19th centuries: William Wilson, a case study A fresh look at the old debate ‘Nature versus Nurture’: “In trying to understand why a person becomes a naturalist, one inevitably wonders whether he or she was ‘born’ to natural history and merely applied inherited traits in order to achieve their ‘calling’, or whether alternatively (or additionally) that individual took up natural history because of ways in which their social and cultural environment influenced their personal interests and development of their personality.” In this article Mark Lawley takes a critical look at the background and upbringing of William Wilson, Britain’s leading bryologist of the mid-19th century, considering how his circumstances may have influenced the development of his character and interests. Mark Lawley's case study on William Wilson The early bryologists of South-West Yorkshire Tom Blockeel’s account of bryologists in South-West Yorkshire during the 18th and 19th centuries was published in 1981 and reveals the huge contribution of working-men botanists – often with no formal education – to British bryology. Tom Blockeel's account of bryologists in Yorkshire Bygone bryologists Mark Lawley has written a series of articles about prominent British and Irish field-bryologists of bygone days and has kindly made them available for anyone to read here. Also included below are some more recent biographies by other authors, notably Mark Hill’s account of Tony Smith written shortly after his death in 2012, and Brad Scott’s article on William Mitten. Armitage, Eleonora (1865-1961) Eleonora Armitage was a keen and accomplished field-bryologist, and the only female founding member of the Moss Exchange Club in 1896. After Augustin Ley died in 1911, Miss Armitage was indisputably the botanical matriarch of her home county of Herefordshire, and enjoyed contacts with many of the leading botanists of the day. She made numerous notable discoveries in Herefordshire, and wrote papers on the shire’s Sphagnum mosses in 1923 and liverworts in 1925. Miss Armitage became President of the British Bryological Society in 1939. Read Mark Lawley's account Bagnall, James Eustace (1830-1918) Bagnall took up the study of botany in his mid-thirties, about 1865, and in 1872 discovered Grimmia crinita new to Britain in Warwickshire. In 1874 he published an article ‘The Moss Flora of Warwickshire’ in the Journal of Botany. He joined the Botanical Locality Record Club (forerunner of the Botanical Exchange Club) in 1876. In 1886 his popular guide Handbook of Mosses appeared, followed in 1891 by Flora of Warwickshire. Bagnall was elected an honorary member of the Moss Exchange Club in 1909, and died in Birmingham on September 3rd 1918. Read Mark Lawley's account Barker, Thomas (1838-1907) Barker joined the Moss Exchange Club in 1896 and remained a member until his death. He found Grimmia arenaria in Wales in 1898, and also studied microscopic forms of freshwater algae, particularly during his visits to Scotland. Read Mark Lawley's account Bellerby, William (1852-1936) William Bellerby’s collection of mosses and his drawings are at the Natural History Museum in London. The National Museum and Gallery of Wales, Cardiff has 149 of his bryological gatherings, collected between 1904 and 1933. Bellerby also studied fungi, and was a member of the British Mycological Society. Read Mark Lawley's account Benson, Richard de Gylpyn (1856-1904) Following a suggestion by Sir William Gower, Benson took up the study of mosses (and afterwards botany in general) to occupy himself in retirement, and found many mosses (but no liverworts) new to the district around his home in mid-Shropshire. He wrote a paper entitled ‘Shropshire Mosses’ for the Journal of Botany (1893), which contains an annotated check-list of all mosses then known to occur in the county. At about the same time he compiled a two-volume List of Mosses collected in Shropshire which is now in the Shropshire Records and Research Centre at Shrewsbury (ref: 6001/6745-6). Benson joined the Moss Exchange Club before 1899, and remained a member until his death. Read Mark Lawley's account Binstead, Charles Herbert (1862-1941) Herbert Binstead joined the Moss Exchange Club at its inception in 1896, becoming President of the British Bryological Society in 1926-8. He added Cheilothela chloropus and Pseudocalliergon turgescens to the British list, discovered Eurhynchium meridionale at Wells, Somerset in 1886, Rhynchostegium rotundifolium near Wells in 1887, Bartramia stricta in Radnorshire, and wrote papers on the mosses of the English Lake District, French Riviera, and Herefordshire. Read Mark Lawley's account Boswell, Henry (1835-1897) Boswell lived most of his life in Oxford, and published papers on the mosses of Oxfordshire as well as contributing to other floras. He acted as referee of mosses for the Botanical Exchange Club. Read Mark Lawley's account Braithwaite, Robert (1824-1917) Robert Braithwaite was a leading British bryologist in the 19th century. He wrote Sphagnaceae or Peat-mosses of Europe and North America (1880), but his lasting contribution to British bryology is his three volumes of The British Moss-flora (1887-1905), illustrated by himself. Read Mark Lawley's account Brewer, Samuel (c.1669-1743/48) Brewer’s bryological reputation rests on a tour of North Wales which he made with Dillenius in the summer of 1726, and collections he made when he stayed on in Wales until the following year. He sent bryophytes he collected to Dillenius, who wrote them up for his Historia Muscorum (1741). In this way, Brewer very substantially increased contemporary knowledge of the British bryoflora. Read Mark Lawley's account Brown, Littleton (1698-1749) Nothing is known of Brown’s bryological discoveries. Not only did he live long ago, but his herbarium (if such he had) is unknown today, and he left no papers. Nor do any bryological discoveries he made adorn published literature. Rather, his eligibility for consideration as a bryologist rests on his reputation with his contemporaries. In 1725-6, William Sherard of Oxford wrote to Richard Richardson of Bierley, Bradford, Yorkshire that “Mr Brown… is the keenest botanist I have met with, and knows most of the plants in the Synopsis. Dr Dillenius has been a moss-cropping with him: he has an excellent eye.” In 1726 Brown accompanied Dillenius and Samuel Brewer on a tour of North Wales, an excursion which brought a number of bryophytes to first public notice when Dillenius’s Historia Muscorum appeared in 1741. However, Brown left his companions after they explored Cader Idris and before Dillenius and Brewer went into North Wales, and it is not clear how many of the bryophytes they found were attributable to Brown. Read Mark Lawley's account Buddle, Adam (1662-1715) Adam Buddle was one of the first Englishmen to study mosses and liverworts as bryology began to be taken seriously in England during the late 17th century… Read Mark Lawley's account Burrell, William Holmes (1865-1945) Burrell discovered Leiocolea rutheana at Flordon, Norfolk in 1909, and was instrumental in helping to distinguish Orthodontium lineare from O. gracile. He joined the Moss Exchange Club in 1907, and by 1911 was serving as Distributor of the packets. Read Mark Lawley's account Carrington, Benjamin (1827-1893) Carrington was mainly interested in liverworts, having encountered them in the Scottish hills while a student at Edinburgh. He wrote the section on cryptogams for the Flora of the West Riding of Yorkshire (with L.C. Miall) in 1862, compiled British Hepaticae (1874-5), and issued exsiccatae as Hepaticae Britannicae (1878-80). Read Mark Lawley's account Cleminshaw, Edward (1849-1922) Cleminshaw assisted the Moss Exchange Club from 1901, and remained a member until 1918. He arranged the moss collection at Birmingham University. He died in Epsom, Surrey on March 25th 1922. His plants are at Warwick Museum, with additional plants at Birmingham University. The National Museum and Gallery of Wales, Cardiff has 448 of his specimens, mainly bryophytes, dated 1889-1916. Read Mark Lawley's account Crouch, James Frederick (1809-1888) Crouch studied bryophytes, lichens and vascular plants, as well as geology. He was the first to explore and evaluate the flora of north Herefordshire, and added many species to the known bryoflora of Herefordshire, thus considerably assisting Augustin Ley, as he compiled records for his Flora of Herefordshire (1889). Read Mark Lawley's account Crundwell, Alan Cyril (1923-2000) Crundwell joined the BBS in 1945, and bryologised with Eustace Jones. During the 1950s he became friendly with Warburg, whom he met at BBS meetings. He was also friendly with the Swedish bryologist, Elsa Nyholm, and became very knowledgeable about the genus Bryum, about which he later collaborated with Whitehouse… Read Mark Lawley's account Davies, Hugh (Rev.) (1739-1821) Davies’s most important publication is Welsh Botanology (1813), the first part of which is the first detailed flora of a Welsh county (Anglesey), listing 166 mosses and 28 liverworts for Anglesey. Davies was in the bryological vanguard of contemporary botanists, and seems to have taken interest in bryophytes from about 1790 onwards. He found, for example, the moss Glyphomitrium daviesii (which is named after him) at Carreg Onnan and Llanfihangel Dinsylwi near Bwrdd Arthur in 1790 and on Snowdon a few years later. Read Mark Lawley's account Dickson, James (1738-1822) Dickson began to study mosses in 1781, and collected material during several visits to Scotland between 1785 and 1791. For example, in 1789 he botanised with his 18-year old brother-in-law Mungo Park on Ben Lawers and in the Hebrides. In 1785 he published the first of four parts of Fascicularis plantarum cryptogamicarum Britanniae (1785-1801), with 400 species described in Latin, and with illustrations in water-colour by James Sowerby. Many of the bryophytes were described as new to Britain. Dickson did not have the benefit of a Latin education, and John Ziers, a Polish apothecary in London, wrote the descriptions for the first three fascicles. Read Mark Lawley's account Dixon, Hugh Neville (1861-1944) Dixon was a leading British authority on mosses before the Second World War. His Student’s Handbook of British Mosses went through three editions between 1896 and 1924, and remained an indispensable guide for many decades after that. He was a founding member of the Moss Exchange Club in 1896, and became the British Bryological Society’s first president in 1923. Read Mark Lawley's account Don, George (1764-1814) George Don (senior) was the first botanist to extensively and repeatedly explore the Scottish Highlands. He lived in Angus for much of his life, but explored far and wide in the Caledonian hills, reaching as far north and west as Skye and Knoydart. As a youth, he discovered Seligeria donniana in Dupplin Den near Perth in the early 1780s. In 1804 he found Encalypta alpina on Ben Lawers. He seems to have collected mainly between 1780 and 1806, and in his native county of Angus he found – among others – the following liverworts: Anastrophyllum donianum, Haplomitrium hookeri, Herbertus stramineus and Targionia hypophylla, while his mosses from Angus include Amblyodon dealbatus, Amphidium lapponicum, Bartramia halleriana… Read Mark Lawley's account Doody, Samuel (1656-1706) Doody’s particular botanical interests lay in mosses, fungi, and other non-flowering plants, and he advised John Ray about them for Ray’s Historia Plant"
