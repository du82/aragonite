title = "Course providers - British Bryological Society"
full_description = "The Field Studies Council The FSC offers a range of Bryophyte Identification courses at various centres throughout the country, suitable for Beginners, Intermediate or Advanced bryologists. They also now offer some online Bryophyte courses. See their website https://www.field-studies-council.org/ for more details. Species Recovery Trust BBS member Sharon Pilkington regularly gives training courses for the Species Recovery Trust, in particular her popular Sphagnum Identification course. Find out about the currently planned courses on their website https://www.speciesrecoverytrust.org.uk/ Ptyxis Ecology Ptyxis Ecology, run by BBS member and former recorder for Northumberland v.-c. 67 John O’Reilly, offer distance learning courses. These are ideal as a follow-on for face-to-face introductory courses such as those run by the FSC. The courses involve study and fieldwork, with specimens being posted to the course tutors for checking and feedback. More information is available on their website http://www.ptyxis.com/courses.php Manchester Metropolitan University (Shrewsbury) Manchester Metropolitan University offer a part-time MSc in Biological Recording, which generally include a bryologically-related option such as ‘Identifying Bryophytes for Recording and Conservation’. Check their website https://www.mmu.ac.uk/study/postgraduate/course/msc-biological-recording/"
