["https://www.britishbryologicalsociety.org.uk/learning"]
title = "Learning - British Bryological Society"
full_description = "About bryophytes Bryophytes are a group of plants that include mosses, liverworts and hornworts. Currently there are 1098 species of bryophyte in Britain and Ireland, which represents around 58 percent of the total European flora. Conversely, our islands have less than 20 per cent of the European flowering plants. Find out more Getting started Starting out in the study of bryophytes can be a lonely business. Your friends and family may have problems understanding the attraction of these jewels of the plant kingdom. Fortunately, help is at hand from the British Bryological Society, which will welcome you as a member and support you along the way. Begin your study… Some common bryophytes Here you will find images and short descriptions of some of the most common mosses and liverworts, just to get you started. The chances are you will be able to find many of these species close to home. Use these to familiarise yourself with some of the terminology, and what to look for when trying to identify a moss or a liverwort. How many can you find? Species finder The Species Finder is your gateway to a wealth of information about the mosses, liverworts and hornworts to be found in the UK. Each species page will have identification tips, up-to-date distribution information, links to useful resources and an image gallery showing a range of images including habitat photos, close-ups and microscope images. Explore our species pages Habitats This section is work in progress, but is intended to provide overviews of different habitat types… Explore habitats Tips and techniques Read about different techniques for cutting sections, how to improve your photography and lots more. From beginner to expert, there is always something new to learn. And if you have a tip you’d like to share, let us know and we’ll add it to the page. View more information Guide to common bryophilous fungi BBS member George Greiff introduces a few of the more common bryophilous fungi Read more"
year_published = 2025
year_updated = 2021
