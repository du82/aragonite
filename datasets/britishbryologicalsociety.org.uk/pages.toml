["https://www.britishbryologicalsociety.org.uk/learning/some-common-bryophytes"]
title = "Some common bryophytes - British Bryological Society"
full_description = "Common mosses in lawns View more information Common mosses on walls View more information Common mosses on trees View more information Common liverworts on trees View more information Common woodland floor mosses View more information When you’re just starting your exploration of bryophytes, the sheer number of species can be daunting. Even the BBS Field Guide contains over 700 different species! Here you will find images and short descriptions of some of the most common mosses and liverworts, just to get you started. The chances are you will be able to find many of these species close to home. Use these to familiarise yourself with some of the terminology, and what to look for when trying to identify a moss or a liverwort. If you’d like to know more, browse our other pages in the Learning section of the website, or consider buying a copy of the BBS Field Guide which describes most of the species to be found in the British Isles, using simple terminology so that you don’t have to grapple with a completely new vocabulary! Copyright © 2021 The British Bryological Society. All rights reserved. | UK registered charity no. 228851"
