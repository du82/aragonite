["https://www.britishbryologicalsociety.org.uk/publications/atlas-of-british-and-irish-bryophytes"]
title = "Atlas of British and Irish Bryophytes - British Bryological Society"
description = "The two-volume Atlas, published in 2014, is the latest product of over 50 years recording by British and Irish bryologists, and shows the detailed distribution of 1069 species alongside a summary of their altitudinal range. The accompanying text describes their habitats, and summarises their reproductive biology as well as each species’ European and world distribution range."
full_description = "The 2014 Atlas of British and Irish Bryophytes Buy your copy of the Atlas from Nature Bureau, specialists in environmental and wildlife publishing. Buy your copy here Atlas of British and Irish Bryophytes (For details of previous Atlases, please see the Resources section below.) The 2014, two-volume Atlas, is the latest product of over 50 years recording by British and Irish bryologists, and shows the detailed distribution of 1069 species alongside a summary of their altitudinal range. The accompanying text describes their habitats, and summarises their reproductive biology and wider European and world ranges. Atlases of birds and flowering plants are produced periodically as a result of a concentrated burst of activity; this is possible as the species are easy to record and there are many recorders to do the job. For bryophytes the strategy is different, and the atlases summarise the result of long periods of continuous recording by a smaller but no less dedicated group of recorders. The 2014 Atlas builds on the earlier BBS Atlas, published in 1991–94. Planning for the current project started in 2003 and for ten years most of the Society’s field meetings were held in areas which were sparsely recorded. As Recording Secretary, Mark Hill processed some 2 million incoming records during this period, to give a database of almost 2.8 million records on which the Atlas is based. Once these were incorporated, he worked on the statistical analysis of the data. Tom Blockeel (mosses) and Sam Bosanquet (liverworts) revised the existing species texts, or wrote new ones, sometimes assisted by other bryological colleagues. At the Biological Records Centre (CEH), Chris Preston checked a series of distribution maps and developed the novel altitude diagrams in collaboration with Steph Rorke. The nature of BBS recording has changed over the decades, with records increasing in number and made with an increasing degree of precision. In the introductory chapters of the Atlas this history is outlined and the records analysed to show some striking changes in the distribution of species. Many species of bogs, heaths and marshes have declined in lowland but not upland areas. There has been a dramatic increase in many epiphytes in response to the reduction in SO2 pollution, though some species of acidic habitats which thrived in the era of ‘acid rain’ have declined. The BBS records are available on the NBN Atlas website . There is a continuing need for detailed recording to improve our knowledge of bryophyte distribution, to document the changing flora and to maintain an up-to-date database to underpin conservation assessments. Such recording is linked to the other arm of the BBS recording strategy, the documentation of species occurrence in vice-counties. You can read all about BBS recording in the Recording section of this website. The Atlas is available to purchase from Nature Bureau (see link above). Also, by kind permission of the publisher and authors, individual species distribution pages will gradually be made available in the new Species Finder pages on this website. Dynamic maps of bryophytes on the NBN Atlas Previous BBS Atlases Smith, A.J.E. (Ed). 1978. Provisional Atlas of the Bryophytes of the British Isles Published by the Biological Records Centre, Institute of Terrestrial Ecology (Natural Environment Research Council) for the BBS and Biological Records Centre, Institute of Terrestrial Ecology, Monks Wood, Huntingdon (1978). Paperback and comb-bound. [Two pages with an alphabetical list of included species and their map numbers. 105 maps presented in two sections: mosses and hepatics (incl. hornworts). No page numbers.] Download the Atlas Hill, M.O., Preston, C.D. and Smith, A.J.E. (Eds). 1991. Atlas of the Bryophytes of Britain and Ireland. Volume 1 Liverworts. Harley Books. ISBN 0 946589 29 1. Pp. 351 Download the Atlas (36MB) Hill, M.O., Preston, C.D. and Smith, A.J.E. (Eds). 1992. Atlas of the Bryophytes of Britain and Ireland. Volume 2 Mosses (except Diplolepideae). Colchester, Harley Books. ISBN 0 946589 30 5. Pp. 400 Download the Atlas (42MB) Hill, M.O., Preston, C.D. and Smith, A.J.E. (Eds). 1994. Atlas of the Bryophytes of Britain and Ireland. Volume 2 Mosses (Diplolepideae). Colchester, Harley Books. ISBN 0 946589 31 3. Pp. 419 Download the Atlas (53MB)"
