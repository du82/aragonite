title = "Gloucestershire Group: The Darens, Herefordshire - British Bryological Society"
full_description = "2 March 2025 (10:30 - 16:00) Meeting details We usually throw in an upland Welsh meeting once the weather warms up, for a bit of variety – but this year have decided to visit Herefordshire instead. We will visit The Darens, an upland area with sandstone block scree to the west of the county, in the Black Mountains. Meet at 10.30, at the car park at SO 297299, What3Words ///huts.unless.putty This is a large area but we will probably focus on Black Darren. The Borders Group held a meeting here in 2005 (20 years ago!) so it’s due another visit. Plants of note include Andreaea rothii, Anomobryum julaceum, Bryoerythrophyllum ferruginascens, Isopterygiopsis pulchella, Orthothecium intricatum, Ptychomitrium polyphyllum, Marchantia quadrata, Mesoptychia bantriensis, Orthocaulis floerkei, Barbilophozia barbata, Scapania aspera and Tritomaria quinquedentata. Stout footwear is essential, and you may find a walking pole useful. Bring warm clothing as the site is exposed so could be chilly even on a nice spring day. Download the Risk Assessment Location: Black Darren, Olchon Valley (function ($) { $(function () { var mapContainer = $('.google-map'); if (mapContainer.length < 1) { return; } mapContainer.googleMaps({ points: [{ lat: 51.963830726431, lng: -3.023467811792, marker: true }], center: { lat: 51.963830726431, lng: -3.023467811792, }, zoom: 13, 'key': GOOGLE_MAPS_API_KEY, }); }); })(jQuery); Share this page: Facebook Twitter"
