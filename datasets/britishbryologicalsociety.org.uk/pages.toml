["https://www.britishbryologicalsociety.org.uk/projects"]
title = "Projects - British Bryological Society"
full_description = "Phenology Recording If you are interested in contributing to our knowledge of bryophytes, but not keen on general recording, or perhaps only just starting in your exploration of bryophytes, then this project may be for you… View more information Bryophyte Ecology Group The BBS Bryophyte Ecology Group (or BRECOG) exists to promote study of the ecology of the mosses, liverworts and hornworts of Britain and Ireland. View more information Plantlife projects The BBS is working closely with Plantlife on 2 conservation projects involving Atlantic woodlands. Volunteers have been recruited from two areas of the country with this special habitat, (the Lake District and South West England) and are being given training and the necessary skills to record and monitor bryophytes in these woodlands. View more information Tropical Bryology Group The Tropical Bryology Group was a special interest group within the BBS, dedicated to the study and conservation of tropical bryophytes. It was formed in 1988 and was active until at least 2010. Read a summary of the group’s activities here, with links to their publications. View more information Arable Bryophytes Survey In 2002 the BBS launched a project to survey arable fields: Survey of the Bryophytes of Arable Land (SBAL). The project ran until 2005 and greatly improved our knowledge of arable bryophytes. You can read a summary of the project and its findings here. View more information Ex situ conservation at Kew From 2000 – 2006, a team at the Royal Botanic Gardens in Kew worked on a project looking at ex-situ techniques for the conservation of bryophytes. Read about the project here. View more information HLK Whitehouse stereo image photography Although not strictly a BBS project, BBS member Harold Whitehouse spent many years taking stereo images of bryophytes worldwide. Read about his work here, and download his images for personal use. Read about stereoscopic photography"
