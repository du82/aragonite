title = "About us | British Museum"
description = "Go behind the scenes of the British Museum and find about its history, architecture, research and governance. Plus, information on jobs at the British Museum, press, commercial and public enquiries."
full_description = '''About us You are here: Home About us Share the page Share on Facebook Share on X (formerly Twitter) The first national public museum of the world. The British Museum is unique in bringing together under one roof the cultures of the world, spanning continents and oceans. No other museum is responsible for collections of the same depth and breadth, beauty and significance.Its eight million objects allow us to explore the extraordinary diversity of human cultures, from small communities to vast empires, to discover the many forms and expressions human beings have given to every aspect of life, and to realise how closely they are interconnected. Staff <img loading="eager" srcset="/sites/default/files/styles/16_9_media_tiny/public/2024-11/Masterplan_aerial_view_teaser.jpg?h=d1cb525d&amp;itok=2935mSGs 400w, /sites/default/files/styles/16_9_media_small/public/2024-11/Masterplan_aerial_view_teaser.jpg?h=d1cb525d&amp;itok=SwUqrX-P 750w, /sites/default/files/styles/16_9_media_medium/public/2024-11/Masterplan_aerial_view_teaser.jpg?h=d1cb525d&amp;itok=yQd6AOBK 1000w, /sites/default/files/styles/16_9_media_large/public/2024-11/Masterplan_aerial_view_teaser.jpg?h=d1cb525d&amp;itok=IyBkjhpa 1300w, /sites/default/files/styles/16_9_media_huge/public/2024-11/Masterplan_aerial_view_teaser.jpg?h=d1cb525d&amp;itok=yGltR8va 1600w" width="750" height="422" data-src="/sites/default/files/styles/16_9_media_small/public/2024-11/Masterplan_aerial_view_teaser.jpg?h=d1cb525d&amp;itok=SwUqrX-P" data-sizes="auto" alt="Aerial view of the British Museum site at Bloomsbury, showing the main façade of the building and surrounding area." /> The Masterplan As one of the most significant cultural redevelopment projects ever, the Masterplan will transform the British Museum for the 21st century. <img loading="eager" srcset="/sites/default/files/styles/16_9_media_tiny/public/2024-03/Museum_great_court_teaser_1000x500.jpg?h=5dabf909&amp;itok=tpePxEJa 400w, /sites/default/files/styles/16_9_media_small/public/2024-03/Museum_great_court_teaser_1000x500.jpg?h=5dabf909&amp;itok=ILNcCzQV 750w, /sites/default/files/styles/16_9_media_medium/public/2024-03/Museum_great_court_teaser_1000x500.jpg?h=5dabf909&amp;itok=ymgwB7g0 1000w, /sites/default/files/styles/16_9_media_large/public/2024-03/Museum_great_court_teaser_1000x500.jpg?h=5dabf909&amp;itok=-Hyf_qKR 1300w, /sites/default/files/styles/16_9_media_huge/public/2024-03/Museum_great_court_teaser_1000x500.jpg?h=5dabf909&amp;itok=VGH8kDwL 1600w" width="750" height="422" data-src="/sites/default/files/styles/16_9_media_small/public/2024-03/Museum_great_court_teaser_1000x500.jpg?h=5dabf909&amp;itok=ILNcCzQV" data-sizes="auto" alt="Wide scale photo of the Great Court " /> Jobs We are always looking for talented people to join us. More about us information <img loading="eager" srcset="/sites/default/files/styles/16_9_media_tiny/public/2019-10/British-Museum-Front-Day.jpg?h=cf99483c&amp;itok=VTvelUtK 400w, /sites/default/files/styles/16_9_media_small/public/2019-10/British-Museum-Front-Day.jpg?h=cf99483c&amp;itok=r2oJQXDz 750w, /sites/default/files/styles/16_9_media_medium/public/2019-10/British-Museum-Front-Day.jpg?h=cf99483c&amp;itok=4wSTtVpX 1000w, /sites/default/files/styles/16_9_media_large/public/2019-10/British-Museum-Front-Day.jpg?h=cf99483c&amp;itok=DdVozQkU 1300w, /sites/default/files/styles/16_9_media_huge/public/2019-10/British-Museum-Front-Day.jpg?h=cf99483c&amp;itok=Dly6ZqDM 1600w" width="750" height="422" data-src="/sites/default/files/styles/16_9_media_small/public/2019-10/British-Museum-Front-Day.jpg?h=cf99483c&amp;itok=r2oJQXDz" data-sizes="auto" alt="Front of British Museum during the day." /> Governance Find out how the British Museum maintains and protects its worldwide collection. <img loading="eager" srcset="/sites/default/files/styles/16_9_media_tiny/public/2019-11/R95%2010_Korea%20Hotung%20ceramics.jpg?h=c9a3a702&amp;itok=UUyVUPM3 400w, /sites/default/files/styles/16_9_media_small/public/2019-11/R95%2010_Korea%20Hotung%20ceramics.jpg?h=c9a3a702&amp;itok=Tc6bT15p 750w, /sites/default/files/styles/16_9_media_medium/public/2019-11/R95%2010_Korea%20Hotung%20ceramics.jpg?h=c9a3a702&amp;itok=6t-tFIkk 1000w, /sites/default/files/styles/16_9_media_large/public/2019-11/R95%2010_Korea%20Hotung%20ceramics.jpg?h=c9a3a702&amp;itok=fl5xim1m 1300w, /sites/default/files/styles/16_9_media_huge/public/2019-11/R95%2010_Korea%20Hotung%20ceramics.jpg?h=c9a3a702&amp;itok=fkkyMsbR 1600w" width="750" height="422" data-src="/sites/default/files/styles/16_9_media_small/public/2019-11/R95%2010_Korea%20Hotung%20ceramics.jpg?h=c9a3a702&amp;itok=Tc6bT15p" data-sizes="auto" alt="Visitors in Room 95" /> Contact us Read our FAQs and if you still have a question, get in touch via our contact us form. <img loading="eager" srcset="/sites/default/files/styles/16_9_media_tiny/public/2023-12/British_Museum_Augustus_Butler_1000x500.jpg?h=5dabf909&amp;itok=4UujdsNr 400w, /sites/default/files/styles/16_9_media_small/public/2023-12/British_Museum_Augustus_Butler_1000x500.jpg?h=5dabf909&amp;itok=g44zpD1S 750w, /sites/default/files/styles/16_9_media_medium/public/2023-12/British_Museum_Augustus_Butler_1000x500.jpg?h=5dabf909&amp;itok=KYTXdbQM 1000w, /sites/default/files/styles/16_9_media_large/public/2023-12/British_Museum_Augustus_Butler_1000x500.jpg?h=5dabf909&amp;itok=MAqHhMpR 1300w, /sites/default/files/styles/16_9_media_huge/public/2023-12/British_Museum_Augustus_Butler_1000x500.jpg?h=5dabf909&amp;itok=QHV6ipOL 1600w" width="750" height="422" data-src="/sites/default/files/styles/16_9_media_small/public/2023-12/British_Museum_Augustus_Butler_1000x500.jpg?h=5dabf909&amp;itok=g44zpD1S" data-sizes="auto" alt="Softly-tinted historical print of the front elevation of the British Museum, showing the iconic neoclassical facade and exterior railing set back from a busy street filled with figures in Victorian dress - including guards, pedestrians, mounted horseriders and a horse-drawn carriage." /> The British Museum Story The British Museum is unique in bringing together under one roof the cultures of the world. You may also be interested in <img loading="eager" srcset="/sites/default/files/styles/16_9_media_tiny/public/2023-12/William_Simpson_lithograph_British_Museum_1000x500.jpg?h=5dabf909&amp;itok=QdmuP_DY 400w, /sites/default/files/styles/16_9_media_small/public/2023-12/William_Simpson_lithograph_British_Museum_1000x500.jpg?h=5dabf909&amp;itok=jYv_aCFH 750w, /sites/default/files/styles/16_9_media_medium/public/2023-12/William_Simpson_lithograph_British_Museum_1000x500.jpg?h=5dabf909&amp;itok=_1jppxPY 1000w, /sites/default/files/styles/16_9_media_large/public/2023-12/William_Simpson_lithograph_British_Museum_1000x500.jpg?h=5dabf909&amp;itok=t5d5yfi0 1300w, /sites/default/files/styles/16_9_media_huge/public/2023-12/William_Simpson_lithograph_British_Museum_1000x500.jpg?h=5dabf909&amp;itok=sbvUG9pR 1600w" width="750" height="422" data-src="/sites/default/files/styles/16_9_media_small/public/2023-12/William_Simpson_lithograph_British_Museum_1000x500.jpg?h=5dabf909&amp;itok=jYv_aCFH" data-sizes="auto" alt="Print of the Museum in 19th century with horses and carriages going past." /> Architecture The British Museum's buildings are of national importance, discover their story. <img loading="eager" srcset="/sites/default/files/styles/16_9_media_tiny/public/2020-07/Multi-Spectral-Imaging.jpg?h=d1cb525d&amp;itok=_MlgLkcy 400w, /sites/default/files/styles/16_9_media_small/public/2020-07/Multi-Spectral-Imaging.jpg?h=d1cb525d&amp;itok=mmlXh3Xb 750w, /sites/default/files/styles/16_9_media_medium/public/2020-07/Multi-Spectral-Imaging.jpg?h=d1cb525d&amp;itok=QEx5T4D8 1000w, /sites/default/files/styles/16_9_media_large/public/2020-07/Multi-Spectral-Imaging.jpg?h=d1cb525d&amp;itok=sW-8r0lp 1300w, /sites/default/files/styles/16_9_media_huge/public/2020-07/Multi-Spectral-Imaging.jpg?h=d1cb525d&amp;itok=tGPyuB7y 1600w" width="750" height="422" data-src="/sites/default/files/styles/16_9_media_small/public/2020-07/Multi-Spectral-Imaging.jpg?h=d1cb525d&amp;itok=mmlXh3Xb" data-sizes="auto" alt="On person with camera, another observing" /> Research Discover the breadth of our research, the wide range of related publications, and learn about our research studentships. <img loading="eager" srcset="/sites/default/files/styles/16_9_media_tiny/public/2023-12/British_Museum_Augustus_Butler_1000x500.jpg?h=5dabf909&amp;itok=4UujdsNr 400w, /sites/default/files/styles/16_9_media_small/public/2023-12/British_Museum_Augustus_Butler_1000x500.jpg?h=5dabf909&amp;itok=g44zpD1S 750w, /sites/default/files/styles/16_9_media_medium/public/2023-12/British_Museum_Augustus_Butler_1000x500.jpg?h=5dabf909&amp;itok=KYTXdbQM 1000w, /sites/default/files/styles/16_9_media_large/public/2023-12/British_Museum_Augustus_Butler_1000x500.jpg?h=5dabf909&amp;itok=MAqHhMpR 1300w, /sites/default/files/styles/16_9_media_huge/public/2023-12/British_Museum_Augustus_Butler_1000x500.jpg?h=5dabf909&amp;itok=QHV6ipOL 1600w" width="750" height="422" data-src="/sites/default/files/styles/16_9_media_small/public/2023-12/British_Museum_Augustus_Butler_1000x500.jpg?h=5dabf909&amp;itok=g44zpD1S" data-sizes="auto" alt="Softly-tinted historical print of the front elevation of the British Museum, showing the iconic neoclassical facade and exterior railing set back from a busy street filled with figures in Victorian dress - including guards, pedestrians, mounted horseriders and a horse-drawn carriage." /> The British Museum Story The British Museum is unique in bringing together under one roof the cultures of the world. <img loading="eager" srcset="/sites/default/files/styles/16_9_media_tiny/public/2019-10/Egyptian-sculpture-gallery-entertaining.jpg?h=1ff4b6c7&amp;itok=_h54iSDk 400w, /sites/default/files/styles/16_9_media_small/public/2019-10/Egyptian-sculpture-gallery-entertaining.jpg?h=1ff4b6c7&amp;itok=6PxIpb9E 750w, /sites/default/files/styles/16_9_media_medium/public/2019-10/Egyptian-sculpture-gallery-entertaining.jpg?h=1ff4b6c7&amp;itok=q6MrJm4y 1000w, /sites/default/files/styles/16_9_media_large/public/2019-10/Egyptian-sculpture-gallery-entertaining.jpg?h=1ff4b6c7&amp;itok=zcPpnVH_ 1300w, /sites/default/files/styles/16_9_media_huge/public/2019-10/Egyptian-sculpture-gallery-entertaining.jpg?h=1ff4b6c7&amp;itok=_zU65TsF 1600w" width="750" height="422" data-src="/sites/default/files/styles/16_9_media_small/public/2019-10/Egyptian-sculpture-gallery-entertaining.jpg?h=1ff4b6c7&amp;itok=6PxIpb9E" data-sizes="auto" alt="Tables laid out for evening entertaining in Egyptian sculpture gallery" /> Commercial Book our unique spaces, explore options for film makers and access high quality images and books.'''
