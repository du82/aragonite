full_description = '''The British Museum Welcome to the British Museum Experience cultures across the globe, from the dawn of human history to the present. Plan your visit Pause video Audio described version Show image caption Close image caption The Great Court at the British Museum. Explore the Great Court Discover two million years of human history and culture Free entry – book online Open today: 11.00–17.00 Last entry: 16.45 Exhibitions and events See all exhibitions and events Picassoprintmaker . Final weeks . Exhibition 7 November 2024 – 30 March 2025 Final weeks Hiroshigeartist of the open road . Book now . Exhibition 1 May – 7 September 2025 Book now Visit the Museum <img loading="eager" srcset="/sites/default/files/styles/16_9_media_tiny/public/2021-11/room-33-china-south-asia-visitor-1920.jpg?h=d1cb525d&amp;itok=ZedZVrPS 400w, /sites/default/files/styles/16_9_media_small/public/2021-11/room-33-china-south-asia-visitor-1920.jpg?h=d1cb525d&amp;itok=2zEmMIkr 750w, /sites/default/files/styles/16_9_media_medium/public/2021-11/room-33-china-south-asia-visitor-1920.jpg?h=d1cb525d&amp;itok=vV81sRtG 1000w, /sites/default/files/styles/16_9_media_large/public/2021-11/room-33-china-south-asia-visitor-1920.jpg?h=d1cb525d&amp;itok=jae16yj3 1300w, /sites/default/files/styles/16_9_media_huge/public/2021-11/room-33-china-south-asia-visitor-1920.jpg?h=d1cb525d&amp;itok=_LiGIgEs 1600w" width="750" height="422" data-src="/sites/default/files/styles/16_9_media_small/public/2021-11/room-33-china-south-asia-visitor-1920.jpg?h=d1cb525d&amp;itok=2zEmMIkr" data-sizes="auto" alt="Woman in gallery space looking at a statue of a figure standing on right leg, dancing. " /> Plan your visit Book tickets and plan your day including exhibitions, facilities, access, food and travel. <img loading="eager" srcset="/sites/default/files/styles/16_9_media_tiny/public/2022-08/great-court-restaurant-blog.jpg?h=99b95e68&amp;itok=03MqeoSY 400w, /sites/default/files/styles/16_9_media_small/public/2022-08/great-court-restaurant-blog.jpg?h=99b95e68&amp;itok=p-8AvfxJ 750w, /sites/default/files/styles/16_9_media_medium/public/2022-08/great-court-restaurant-blog.jpg?h=99b95e68&amp;itok=JTQfcuMd 1000w, /sites/default/files/styles/16_9_media_large/public/2022-08/great-court-restaurant-blog.jpg?h=99b95e68&amp;itok=jFicCbIr 1300w, /sites/default/files/styles/16_9_media_huge/public/2022-08/great-court-restaurant-blog.jpg?h=99b95e68&amp;itok=1IpbtIDa 1600w" width="750" height="422" data-src="/sites/default/files/styles/16_9_media_small/public/2022-08/great-court-restaurant-blog.jpg?h=99b95e68&amp;itok=p-8AvfxJ" data-sizes="auto" alt="The Great Court Restaurant." /> Museum map Navigate the Museum with ease, using our floor-by-floor plan and discover what not to miss. <img loading="eager" srcset="/sites/default/files/styles/16_9_media_tiny/public/2020-08/rosetta-stone-egyptian-sculpture-room-1920_0.jpg?h=eb9bad8a&amp;itok=oTNG_kF6 400w, /sites/default/files/styles/16_9_media_small/public/2020-08/rosetta-stone-egyptian-sculpture-room-1920_0.jpg?h=eb9bad8a&amp;itok=3b6K4axH 750w, /sites/default/files/styles/16_9_media_medium/public/2020-08/rosetta-stone-egyptian-sculpture-room-1920_0.jpg?h=eb9bad8a&amp;itok=jsZyktAO 1000w, /sites/default/files/styles/16_9_media_large/public/2020-08/rosetta-stone-egyptian-sculpture-room-1920_0.jpg?h=eb9bad8a&amp;itok=vQ0MlykK 1300w, /sites/default/files/styles/16_9_media_huge/public/2020-08/rosetta-stone-egyptian-sculpture-room-1920_0.jpg?h=eb9bad8a&amp;itok=ZpmrpPjX 1600w" width="750" height="422" data-src="/sites/default/files/styles/16_9_media_small/public/2020-08/rosetta-stone-egyptian-sculpture-room-1920_0.jpg?h=eb9bad8a&amp;itok=3b6K4axH" data-sizes="auto" alt="Visitors examining the Rosetta Stone in the Egyptian Sculpture gallery" /> Galleries Walk through two million years of history and culture across more than 50 galleries. <img loading="eager" srcset="/sites/default/files/styles/16_9_media_tiny/public/2019-11/R21%2024b%20Ancient%20Greece%20Rome%20Americas.jpg?h=f2b84de4&amp;itok=q74Td-Yp 400w, /sites/default/files/styles/16_9_media_small/public/2019-11/R21%2024b%20Ancient%20Greece%20Rome%20Americas.jpg?h=f2b84de4&amp;itok=5d7mz1bW 750w, /sites/default/files/styles/16_9_media_medium/public/2019-11/R21%2024b%20Ancient%20Greece%20Rome%20Americas.jpg?h=f2b84de4&amp;itok=Kw5vPZ-c 1000w, /sites/default/files/styles/16_9_media_large/public/2019-11/R21%2024b%20Ancient%20Greece%20Rome%20Americas.jpg?h=f2b84de4&amp;itok=1mij9Q1i 1300w, /sites/default/files/styles/16_9_media_huge/public/2019-11/R21%2024b%20Ancient%20Greece%20Rome%20Americas.jpg?h=f2b84de4&amp;itok=eb37mZ2o 1600w" width="750" height="422" data-src="/sites/default/files/styles/16_9_media_small/public/2019-11/R21%2024b%20Ancient%20Greece%20Rome%20Americas.jpg?h=f2b84de4&amp;itok=5d7mz1bW" data-sizes="auto" alt="A family looking at a sculpture in the Mausoleum of Halikarnassos" /> Family visits From family facilities to activities and events, discover how to make the most of your day at the Museum. Become a Member Enjoy exclusive events, unlimited access to exhibitions and the Members' Room, plus discounts in the Museum shops, cafés and restaurants. Find out more What's online... <img loading="eager" srcset="/sites/default/files/styles/16_9_media_tiny/public/2024-12/Whats-on-blog-hero-Hiroshige-1920x1080.jpg?h=d1cb525d&amp;itok=MsJ0lUgN 400w, /sites/default/files/styles/16_9_media_small/public/2024-12/Whats-on-blog-hero-Hiroshige-1920x1080.jpg?h=d1cb525d&amp;itok=ima7ja4O 750w, /sites/default/files/styles/16_9_media_medium/public/2024-12/Whats-on-blog-hero-Hiroshige-1920x1080.jpg?h=d1cb525d&amp;itok=acVsKku0 1000w, /sites/default/files/styles/16_9_media_large/public/2024-12/Whats-on-blog-hero-Hiroshige-1920x1080.jpg?h=d1cb525d&amp;itok=ouTDiGTj 1300w, /sites/default/files/styles/16_9_media_huge/public/2024-12/Whats-on-blog-hero-Hiroshige-1920x1080.jpg?h=d1cb525d&amp;itok=mjP9_2HY 1600w" width="750" height="422" data-src="/sites/default/files/styles/16_9_media_small/public/2024-12/Whats-on-blog-hero-Hiroshige-1920x1080.jpg?h=d1cb525d&amp;itok=ima7ja4O" data-sizes="auto" alt="A sailboat with full mast moves through the pale blue water around charcoal and teal coloured headlands" /> Introduction to Hiroshige Join the curator of our new exhibition as we explore how Hiroshige became one of Japan's most talented, prolific and popular artists. <img loading="eager" srcset="/sites/default/files/styles/16_9_media_tiny/public/2025-02/Wear-our-Pride-1920x1080.jpg?h=280f90c3&amp;itok=ehXqAuKO 400w, /sites/default/files/styles/16_9_media_small/public/2025-02/Wear-our-Pride-1920x1080.jpg?h=280f90c3&amp;itok=Jn4wM7Tn 750w, /sites/default/files/styles/16_9_media_medium/public/2025-02/Wear-our-Pride-1920x1080.jpg?h=280f90c3&amp;itok=FQSNLWRU 1000w, /sites/default/files/styles/16_9_media_large/public/2025-02/Wear-our-Pride-1920x1080.jpg?h=280f90c3&amp;itok=lqoAF-zH 1300w, /sites/default/files/styles/16_9_media_huge/public/2025-02/Wear-our-Pride-1920x1080.jpg?h=280f90c3&amp;itok=8otb16wi 1600w" width="750" height="422" data-src="/sites/default/files/styles/16_9_media_small/public/2025-02/Wear-our-Pride-1920x1080.jpg?h=280f90c3&amp;itok=Jn4wM7Tn" data-sizes="auto" alt="A black badge with Freddie Mercury in a colourful waistcoat on it and a red AIDS ribbon, next to a badge that has a large red banner with the words GAY PRIDE &#039;08. Two other badges are visible, one with red text on white background and another with red text on a yellow background." /> Wearing our Pride Once pinned to lapels and backpacks, these badges are now records of defining moments in LGBTQIA+ history. <img loading="eager" srcset="/sites/default/files/styles/16_9_media_tiny/public/2024-07/13258%20Rm%2043a%20Afghan%20war%20rugs_Web%20asset%20v02.jpg?h=a1a0bd62&amp;itok=rKEn8E8D 400w, /sites/default/files/styles/16_9_media_small/public/2024-07/13258%20Rm%2043a%20Afghan%20war%20rugs_Web%20asset%20v02.jpg?h=a1a0bd62&amp;itok=3oSqAj4E 750w, /sites/default/files/styles/16_9_media_medium/public/2024-07/13258%20Rm%2043a%20Afghan%20war%20rugs_Web%20asset%20v02.jpg?h=a1a0bd62&amp;itok=xeANDeuN 1000w, /sites/default/files/styles/16_9_media_large/public/2024-07/13258%20Rm%2043a%20Afghan%20war%20rugs_Web%20asset%20v02.jpg?h=a1a0bd62&amp;itok=BbTFSGp0 1300w, /sites/default/files/styles/16_9_media_huge/public/2024-07/13258%20Rm%2043a%20Afghan%20war%20rugs_Web%20asset%20v02.jpg?h=a1a0bd62&amp;itok=3MQiTtY- 1600w" width="750" height="422" data-src="/sites/default/files/styles/16_9_media_small/public/2024-07/13258%20Rm%2043a%20Afghan%20war%20rugs_Web%20asset%20v02.jpg?h=a1a0bd62&amp;itok=3oSqAj4E" data-sizes="auto" alt="Detail of an Afghan war rug, showing a hand grenade and part of an assault rifle on a red background." /> War rugs Discover how weavers in Afghanistan have recorded the country's turbulent history in traditional rugs in this new display. <img loading="eager" srcset="/sites/default/files/styles/16_9_media_tiny/public/2024-08/Curator%27s%20corner%20Babylonian%20map%20of%20the%20world.jpg?h=c673cd1c&amp;itok=Ey4Tnh89 400w, /sites/default/files/styles/16_9_media_small/public/2024-08/Curator%27s%20corner%20Babylonian%20map%20of%20the%20world.jpg?h=c673cd1c&amp;itok=YNgRNtr3 750w, /sites/default/files/styles/16_9_media_medium/public/2024-08/Curator%27s%20corner%20Babylonian%20map%20of%20the%20world.jpg?h=c673cd1c&amp;itok=EJ9DjClG 1000w, /sites/default/files/styles/16_9_media_large/public/2024-08/Curator%27s%20corner%20Babylonian%20map%20of%20the%20world.jpg?h=c673cd1c&amp;itok=SDD28NNz 1300w, /sites/default/files/styles/16_9_media_huge/public/2024-08/Curator%27s%20corner%20Babylonian%20map%20of%20the%20world.jpg?h=c673cd1c&amp;itok=l6qaGvd4 1600w" width="750" height="422" data-src="/sites/default/files/styles/16_9_media_small/public/2024-08/Curator%27s%20corner%20Babylonian%20map%20of%20the%20world.jpg?h=c673cd1c&amp;itok=YNgRNtr3" data-sizes="auto" alt="Irving Finkel holds his hands up as he explains the significance of the Babylonian map of the world. Next to him is an ancient clay tablet inscribed with cuneiform and a circular map" /> The oldest map of the world From the 'Bitter River' to 'Noah's' ark, curator Irving Finkel tells the astonishing story of an ancient Mesopotamian map inscribed on clay. Sign up to our newsletters Stay connected to the British Museum for the latest news, stories, exhibitions, events and visitor information. Sign up UK and the world <img loading="eager" srcset="/sites/default/files/styles/16_9_media_tiny/public/2022-02/laser-conservation-research-1000.jpg?h=5dabf909&amp;itok=OevjSYjf 400w, /sites/default/files/styles/16_9_media_small/public/2022-02/laser-conservation-research-1000.jpg?h=5dabf909&amp;itok=tG43Qyfa 750w, /sites/default/files/styles/16_9_media_medium/public/2022-02/laser-conservation-research-1000.jpg?h=5dabf909&amp;itok=o2-ZR1Qp 1000w, /sites/default/files/styles/16_9_media_large/public/2022-02/laser-conservation-research-1000.jpg?h=5dabf909&amp;itok=32wnVrtJ 1300w, /sites/default/files/styles/16_9_media_huge/public/2022-02/laser-conservation-research-1000.jpg?h=5dabf909&amp;itok=IWTga4y2 1600w" width="750" height="422" data-src="/sites/default/files/styles/16_9_media_small/public/2022-02/laser-conservation-research-1000.jpg?h=5dabf909&amp;itok=tG43Qyfa" data-sizes="auto" alt="Scientist using a laser to clean a headdress." /> Research Driving the care, display and understanding of the collection, find out about projects, studentships and publications. <img loading="eager" srcset="/sites/default/files/styles/16_9_media_tiny/public/2021-02/Lewis_Chessmen_British_Museum_2.jpg?h=5dabf909&amp;itok=_SOM4eUj 400w, /sites/default/files/styles/16_9_media_small/public/2021-02/Lewis_Chessmen_British_Museum_2.jpg?h=5dabf909&amp;itok=57qCJ_lT 750w, /sites/default/files/styles/16_9_media_medium/public/2021-02/Lewis_Chessmen_British_Museum_2.jpg?h=5dabf909&amp;itok=pTKDGNXN 1000w, /sites/default/files/styles/16_9_media_large/public/2021-02/Lewis_Chessmen_British_Museum_2.jpg?h=5dabf909&amp;itok=wHfkwmQ8 1300w, /sites/default/files/styles/16_9_media_huge/public/2021-02/Lewis_Chessmen_British_Museum_2.jpg?h=5dabf909&amp;itok=rxcl_Xlj 1600w" width="750" height="422" data-src="/sites/default/files/styles/16_9_media_small/public/2021-02/Lewis_Chessmen_British_Museum_2.jpg?h=5dabf909&amp;itok=57qCJ_lT" data-sizes="auto" alt="Four of the Lewis Chessmen on the board facing the viewer." /> Departments Learn about our research departments, outreach, training, study rooms and access to the collection. <img loading="eager" srcset="/sites/default/files/styles/16_9_media_tiny/public/2019-11/Courtly%20India%20%2847%29.JPG?h=b2774bcf&amp;itok=Gyyu5Ujj 400w, /sites/default/files/styles/16_9_media_small/public/2019-11/Courtly%20India%20%2847%29.JPG?h=b2774bcf&amp;itok=Xj2YjYHJ 750w, /sites/default/files/styles/16_9_media_medium/public/2019-11/Courtly%20India%20%2847%29.JPG?h=b2774bcf&amp;itok=KYpc3Iff 1000w, /sites/default/files/styles/16_9_media_large/public/2019-11/Courtly%20India%20%2847%29.JPG?h=b2774bcf&amp;itok=4rUjc8dA 1300w, /sites/default/files/styles/16_9_media_huge/public/2019-11/Courtly%20India%20%2847%29.JPG?h=b2774bcf&amp;itok=Zy8_QbxX 1600w" width="750" height="422" data-src="/sites/default/files/styles/16_9_media_small/public/2019-11/Courtly%20India%20%2847%29.JPG?h=b2774bcf&amp;itok=Xj2YjYHJ" data-sizes="auto" alt="A visitor examines an exhibit in Courtly India, Room 47" /> National Find out how the Museum shares expertise and the collection across more than 250 UK cultural organisations. <img loading="eager" srcset="/sites/default/files/styles/16_9_media_tiny/public/2019-10/iraq-scheme02.jpg?h=5c588ef7&amp;itok=ZU7FnGHF 400w, /sites/default/files/styles/16_9_media_small/public/2019-10/iraq-scheme02.jpg?h=5c588ef7&amp;itok=aCbStcqZ 750w, /sites/default/files/styles/16_9_media_medium/public/2019-10/iraq-scheme02.jpg?h=5c588ef7&amp;itok=TLhvv2W8 1000w, /sites/default/files/styles/16_9_media_large/public/2019-10/iraq-scheme02.jpg?h=5c588ef7&amp;itok=fpvl8S_q 1300w, /sites/default/files/styles/16_9_media_huge/public/2019-10/iraq-scheme02.jpg?h=5c588ef7&amp;itok=BebBrpSk 1600w" width="750" height="422" data-src="/sites/default/files/styles/16_9_media_small/public/2019-10/iraq-scheme02.jpg?h=5c588ef7&amp;itok=aCbStcqZ" data-sizes="auto" alt="A tour of the Museum, arranged under the Iraq Scheme" /> International Loans, research and touring exhibitions are some of the many ways we build ties internationally. See our current collaborations. Search Collection online From the Rosetta Stone to Japanese netsuke, discover a wealth of information about Museum objects in our searchable database. Start your search Explore the collection See all Egypt Read more Desire, love and identity Read the blog Animals See the collection Americas See the collection Death and memory Read more Africa See the collection Welcome to the British Museum Shop Shop now Inspired by the Museum https://www.britishmuseumshoponline.org/inspired-by/inspi'''
