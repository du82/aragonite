title = "Contact us | British Museum"
description = "The British Museum contact us page contains our FAQs, opening times, helpful visitor information and our contact form."
full_description = "Contact us Show image caption Close image caption Visitors in Room 95. Room 95 You are in the About us section Home About us Contact us Share the page Share on Facebook Share on X (formerly Twitter) Jump links Contents Phone numbers Registered addresses Take a look at our FAQs for answers to our most common queries, or get in touch using the contact form below. FAQs Is admission free? Yes, entry to the Museum to view the permanent collection is free. All visitors (except Members) are advised to book a timed slot in advance.Self-led groups of 10 or more people will need to book a group ticket. Please see the Group visits page for more details.We also have special exhibitions and events, both free and paid, which require booking in advance.In line with current government and NHS guidance, face masks are not mandatory but visitors are welcome to wear them if they wish. The Museum maintains a robust cleaning schedule and hand sanitiser stations are available across the site. For the latest updates about booking tickets and what's happening at the Museum, sign up to our newsletter. How do I book tickets? All tickets for the permanent collection can be booked online in advance. Walk-up visits are available each day for those who arrive at the Museum without advance bookings. But this does depend on capacity, as walk-up entry cannot be guaranteed. Please speak to staff on your arrival to enquire about availability. Find out more on our Visit page. You can book tickets for up to nine people.Self-led groups of 10 or more people will need to book a group ticket. Please see the Group visits page for more details.Please see our Exhibitions and events page to see what's on and to book tickets.For access assistance with your booking, please see our Accessibility page.For the latest updates about booking tickets and what's happening at the Museum, sign up to our newsletter. When is the Museum open? The Museum is open daily, 10.00–17.00 (last entry at 16.45). On Fridays the Museum is open until 20.30 (last entry at 20.15). Find out about upcoming late opening on Fridays.Please note that galleries start closing up to 10 minutes before the stated closing time. See full opening hours. Special exhibitions will be open Fridays until 20.30 (last entry at 19.30).The Museum is closed on 24, 25 and 26 December. What can I bring? All bags, rucksacks, packages and personal items may be searched before entry so we suggest allowing extra time for your visit.Wheeled cases, sports equipment and large items of luggage are not allowed on the premises. See the Visit page for a full list of restrictions. Pushchairs are welcome but will need to be kept with you for the duration of your visit.The new visitor and Member cloakroom is located near the Main entrance on Great Russell Street. See the Visit page for more information.Please don't leave your bags unattended at any point during your visit.You're welcome to bring food and drink, but we ask that you don't consume these in the galleries. Do you have maps, guides and tours? View the map to help navigate the Museum and explore incredible cultures from around the world. Discover ancient Egypt, Assyria and the Mediterranean and reconnect with objects including the Rosetta Stone, the treasures of Sutton Hoo and the Portland Vase.There are also themed object trails to follow:One hour at the Museum trailCollecting and empire trailTwelve objects to see with children trailDesire, love, identity: LGBTQ histories trailTake a self-guided tour of the Museum using our Audio app (available in five languages). Download via the App Store or Google Play Store. Please bring your headphones with you or purchase earbuds from the Guide Desk or British Museum Shop.We're currently running the following Museum-led tours:Out-of-hours: an introduction to ancient EgyptOut-of-hours: life and death in ancient EgyptOut-of-hours: an introduction to the British MuseumOut-of-hours: an introduction to ChinaOut-of-hours: an introduction to the ancient Greek worldAround the world in 70 minutesDesire, love, identity: an LGBTQ tourEye-opener toursFriday night spotlight tours What is there for families? There are a variety of free downloadable Museum explorer trails for your family to enjoy while at the Museum. Take on a Museum Mission (featured in six galleries) and challenge your family to a variety of tasks. Pose with mighty emperors in Room 70, or hunt for hieroglyphs among Egyptian sculptures.If you're visiting on a weekend head to the Families Desk and chat to one of our friendly family facilitators to make the most of your visit. Make sure to collect a backpack and Museum explorer trail.Fold-up prams and buggies can be left free of charge in the cloakroom, which is found by turning left immediately after passing through the Main entrance of the Museum.Items of large luggage (including some bags and rucksacks and all wheeled suitcases) are not permitted on-site.For more information on family facilities, please see our Family visits page. Where can I find advice for disabled visitors? For information about facilities for those with specific access requirements, please see the Accessibility at the Museum page. This includes how to book parking, reserve a wheelchair and information on access.If you need help during your visit, please speak to a uniformed member of staff.For accessible events, please check the Accessible events calendar. What food and drink is there on-site? We offer a wide range of food and drink options, including: Great Court Restaurant – advance booking recommendedCourt Cafés​​​​PizzeriaOutdoor diningMontague Café - closedCoffee Lounge - closedVisit our Food and drink page for more information. You can bring your own food and drink and can consume it in the Great Court. Families can bring packed lunches to the Ford Young Visitors Centre during weekends and school holidays. Can I book a school visit? Explore learning opportunities for a range of ages and educational needs. Plan a self-led visit to the Museum to explore the permanent collection or special exhibitions. Book onto one of our popular school sessions, where an expert facilitator will guide your students when learning about the collection. Connect your class to the British Museum for a free live interactive workshop. Explore our Home Education page, for on-site activities, events and at home resources. Access facilities on-site and learning opportunities for SEN. Search our access and SEN page, for inclusive learning opportunities.Explore our learning and activity resources on our Schools pages. Sign up to our Schools newsletter to receive regular news and updates. How do I find an object from the collection? Search Collection online to find out more about individual objects. How can I identify objects? Booking requests for the department study rooms at the British Museum main site can now be accepted. Opening hours vary.Our library and archive are open by appointment: Tuesday – Thursday, 10.00–13.00 and 14.00–16.00. How can I contact a department with a collection or research enquiry? Please see our Departments page for more information on contacting our curatorial departments. Can I use images belonging to the Museum? You can find high-resolution images for non-commercial use on Collection online. Search individual objects to see what's available. Click on the 'Use this image' link on the bottom right of the page.To request images for publication, or any commercial use, please visit www.bmimages.com or contact [email protected]. How can I work/volunteer at the Museum? The Museum doesn't accept speculative applications for jobs, work experience or internships and is unable to respond to these requests.If you're interested in applying for a position at the British Museum, please check our current vacancies and submit your application via the online recruitment system.Alternatively, check the Volunteer page for more information. Get in touch Name Your email Your email Confirm your email What is your enquiry about? - Select -TicketsLost propertyPressAccess (disability, inclusion and equity)Adult learningConference facilitiesCorporate sponsorship/partnershipsDonations and legaciesESOL (English for Speakers of Other Languages)FilmingFreedom of Information/Data Protection OfficerImage licensingArchivesRestaurants at the MuseumSchools programmeShop customer servicesWebsite supportMuseum feedbackOther Enquiry subject Your message Privacy notice We will process your personal data because we need to in order to provide you with the information you have requested from us. Your personal data will only be used by us to communicate with you about your request for information and we will only share it for the purpose set out above (for example, with the relevant Museum department involved in provision of information). We will keep your personal data just for as long as we need it to process your request and we will delete it following the completion of the response.Please see our Privacy policy for more details about how we use your personal data and about your rights or contact the Museum’s Data Protection Officer at [email protected], telephone 020 7323 8000. CAPTCHA This question is for testing whether or not you are a human visitor and to prevent automated spam submissions. Submit Leave this field blank Phone numbers Museum switchboard Phone: +44 (0)20 7323 8000 Because our phone lines can be very busy, we strongly recommend contacting us using the form above. Box office Email: [email protected] Phone: +44 (0)20 7323 8181 Opening times Monday–Friday: 10.00–16.50 Closed: weekends and bank holidays Membership Email: [email protected] Phone: +44 (0)20 7323 8195 Opening times Monday–Friday: 10.00–16.00 Closed: weekends and bank holidays Registered addresses The British Museum Company Limited A company incorporated in England and Wales (registered number 1079888) having its registered office at: The British Museum Great Russell Street London WC1B 3DG and an exempt charity (by virtue of ss 3 & 96 and Schedule 2 paragraphs (p) and (w) Charities Act 1993). VAT Registration No. GB 710 521 585 The Trustees of the British Museum are the agent of The British Museum Company Limited. The British Museum Great Court Limited A company incorporated in England and Wales (registered number 4098945) having its registered office at: The British Museum Great Russell Street London WC1B 3DG VAT Registration No. GB 710 521 585 The Trustees of the British Museum are the agent of The British Museum Great Court Limited. The British Museum Friends Limited A company incorporated in England and Wales and limited by guarantee (no. 04133346) and a registered charity in England and Wales (charity no. 1086080) having its registered office at: The British Museum Great Russell Street London WC1B 3DG VAT Registration No. GB 232 193 095 The Trustees of the British Museum are the agent of The British Museum Friends. British Museum Ventures Limited A company incorporated in England and Wales (registered number 1442912) having its registered office at: The British Museum Great Russell Street London WC1B 3DG The BMCo Pension Trustee Company Limited A company incorporated in England and Wales (registered number 04901380) having its registered office at: The British Museum Great Russell Street London WC1B 3DG"
