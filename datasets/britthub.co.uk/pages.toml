description = "Shipping policy All orders are processed within 1 to 4 business days (excluding weekends and holidays) after receiving your order confirmation email. You will receive another notification when your order has shipped.  Due to the global pandemic many shipping services are experiencing delays, your delivery may be delayed en route. This will likely increase during…"
full_description = "Home Deliveries & ReturnsShipping policyAll orders are processed within 1 to 4 business days (excluding weekends and holidays) after receiving your order confirmation email. You will receive another notification when your order has shipped. Due to the global pandemic many shipping services are experiencing delays, your delivery may be delayed en route. This will likely increase during busy times such as Christmas. Order early to guarantee receiving your order in time. Shipping within the United KingdomShipping charges for your order will be calculated and displayed at checkout. Your order will be shipped using Royal Mail. All orders are shipped 1st Class unless otherwise requested.Shipping ClassPriceLetter (for small greetings cards, stickers, A5 prints etc., up to 100g)£1.60 (+ £0.15 per additional item)Large Letter (for regular greetings cards, A4 prints, activity kits etc., up to 750g)£1.70 (+ £0.25 per additional item)Small Parcel (for large activity kits like the Tyne Bridge up to 2kg)£3.50 (+ £2.05 per additional item)Medium Parcel (for many large objects up to 20kg)£5.45 (+ £4.00 per additional item)Free shipping is available for orders over £30.Market PickupIf you live within the North East of England and can make it to one of the markets I attend then you can arrange to pickup your order in person. I can be found regularly at the Make & Mend Market in the Grainger Market, on the first Saturday of each month.International ShippingWe offer international shipping using Royal Mail and their overseas partners.Shipping charges for your order will be calculated and displayed at checkout.Your order may be subject to import duties and taxes, which are incurred once a shipment reaches your destination country. We are not responsible for these charges if they are applied and are your responsibility as the customer.Your order may by subject to delays due to COVID-19, please check the Royal Mail International Incident Bulletin page to find out more. Delivery to some areas is suspended. If you place an order and we cannot deliver, your payment will be refunded.EuropeShipping ClassPriceLetter (for small greetings cards, stickers, A5 prints etc., up to 100g)£2.50 (+ £0.50 per additional item)Large Letter (for regular greetings cards, A4 prints, activity kits etc., up to 750g)£3.00 (+ £1.00 per additional item)Small Parcel (for large activity kits like the Tyne Bridge up to 2kg)£4.10 (+ £2.10 per additional item)Medium Parcel (for many large objects up to 20kg)£6.00 (+ £4.00 per additional item)Rest of the WorldShipping ClassPriceLetter (for small greetings cards, stickers, A5 prints etc., up to 100g)£2.70 (+ £0.50 per additional item)Large Letter (for regular greetings cards, A4 prints, activity kits etc., up to 750g)£3.40 (+ £1.20 per additional item)Small Parcel (for large activity kits like the Tyne Bridge up to 2kg)£5.70 (+ £3.50 per additional item)Medium Parcel (for many large objects up to 20kg)£6.70 (+ £4.50 per additional item)Free shipping is available for international orders over £30.How do I check the status of my order?When your order has shipped, you will receive an email notification from us which will include a tracking number you can use to check its status. Please allow 48 hours for the tracking information to become available.If you haven’t received your order within 10 days of receiving your shipping confirmation email (20 days for international orders), please contact us with your name and order number, and we will look into it for you.Due to the global pandemic many shipping services are experiencing delays, your delivery may be delayed en route. This will likely increase during busy times such as Christmas. Order early to guarantee receiving your order in time.Refunds, returns, and exchangesWe accept returns up to 28 days after delivery, if the item is unused and in its original condition, we can either refund or exchange the item.In the event that your order arrives damaged in any way, please contact us as soon as possible with your order number and a photo of the item’s condition. We address these on a case-by-case basis but will try our best to work towards a satisfactory solution.If you have any further questions, please don’t hesitate to contact us.Conditions of returnBuyers are responsible for return postage costs. If the item is not returned in its original condition, the buyer is responsible for any loss in value.The following items can’t be returned or exchanged:Because of the nature of these items, unless they arrive damaged or defective, I can’t accept returns for:Custom or personalised ordersDigital downloads"
