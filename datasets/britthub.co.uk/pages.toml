title = "About - BrittHub - Britt Coxon Art and Design"
description = "I have made websites for artists, educators, and researchers. Including work for artist Eric Thompson, Applied Comics Etc. and several Newcastle University research websites. My work in graphics and illustration includes logo design for Hairy Bear Coffee.  I make comics. My work can be found in several Paper Jam Comics Collective anthologies, Asteroid Belter (the companion…"
full_description = "Home About Hi, I’m Britt Coxon (she/her or they/them).I’m an artist and designer, based in Newcastle upon Tyne, making things for web and print. I use paper, card, paint, pixels, HTML, CSS and music. I talk about and make art, papercraft, comics, websites, zines, photography, music, books, stationery, TTRPG stuff and sometimes cups of tea. You can also find me on: Mastodon Instagram SoundcloudI have made websites for artists, educators, and researchers. Including work for artist Eric Thompson, Applied Comics Etc. and several Newcastle University research websites. My work in graphics and illustration includes logo design for Hairy Bear Coffee. I make comics. My work can be found in several Paper Jam Comics Collective anthologies, Asteroid Belter (the companion comic for the British Science Festival, 2013) and in the form of mini-comics, which are a brilliant format that anyone can (and should) make.As well as drawing I have helped edit and produce comics and other artwork, preparing them for both print and web. This includes the previously mentioned Paper Jam Comics Collective anthologies and Asteroid Belter and Spineless (a comic created in partnership with the Great North Museum: Hancock), School Walking Maps for Living Streets an interactive walking map for the Late Shows and Checkies (a comic made for the Tyne & Wear Metro with artist Mike Duckett).I also make things using paper. For example, 3D mathematical shapes activity kits: cut-out shapes ready to fold and glue using the instructions. A great gift for kids and for grown-ups, I’ve discovered it’s really satisfying to create 3D shapes out of nothing but card and a bit of glue. My other papercraft works include a set of burlesque-inspired art, each based on a real performer. I’ve also made a short series of work based on Red Riding Hood, originally made for the Invisible Beasts exhibition held at Creative up North. I also make a range of paper-cut greeting cards.Want to work with me on an interesting new project? I’d love to hear from you, contact me.Latest UpdatesImperfect Affirmations27th February 2025Dyslexia Friendly Typefaces12th February 2025A Fan of Friction21st January 2025A Good 202510th January 2025"
