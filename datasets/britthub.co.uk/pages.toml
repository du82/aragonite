full_description = "Making art, comics, illustrations and papercraft. Hi, I’m Britt Coxon (she/her or they/them).I’m an artist and designer, based in Newcastle upon Tyne, making things for web and print. I use paper, card, paint, pixels, HTML, CSS and music. I talk about and make art, papercraft, comics, websites, zines, photography, music, books, stationery, TTRPG stuff and sometimes cups of tea. You can also find me on: Mastodon Instagram SoundcloudI love working both digitally and with pen and paper, the most satisfying part of my work is being able to combine my design skills in interesting ways to create something a bit unique. My inspirations are Art Nouveau, mathematical shapes, low poly 3D design, bright colour combinations and comics.Greetings cards, prints and 3D activity kits available in the shop.Featured ProjectsExhibition Set: A Hole in the SkyCheckies: The Metro ComicThe Last Straw Book CoverDarkness: A ComicUnderstanding what matters for people living with severe mental illness, a ComicWhat’s in the Shop? Platonic Solids Paper Shapes Activity Pack £8.00Add to basket Arrows Print £20.00Add to basket Moonlight Rabbit Card £4.00Add to basketEach of my card designs is drawn by hand and then scanned into the computer for cutting by a paper robot known as the Silhouette Cameo. I carefully choose the colour and texture of the card to make sure the designs stand out, sometimes I mix and match them with recycled and handmade papers for a unique finish.I carefully choose the paper for my art prints too, I prefer a heavier matte paper or one with a slightly textured finish to capture the details of my original watercolours and bring out the bright colours of my digital work. Mushroom Sticker Set £2.00Add to basket Greenery Sticker Set £2.00Add to basket Tyne Bridge Paper Activity Kit £18.50Add to basket Crystal Paper Shapes Activity Pack £8.00Add to basket Mini Beach Hut Card (decoration on back and front) £3.00Select options"
