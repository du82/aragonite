title = "Privacy Policy - BrittHub - Britt Coxon Art and Design"
description = "What we collect during your visit to britthub.co.uk When Shopping We collect information about you during the checkout process. While you visit the site, we’ll track: Products you’ve viewed: we’ll use this to show you products you’ve recently viewed Location, IP address and browser type: we’ll use this to estimating taxes and shipping We’ll also…"
full_description = "Home Privacy PolicyWhat we collect during your visit to britthub.co.ukWhen ShoppingWe collect information about you during the checkout process. While you visit the site, we’ll track:Products you’ve viewed: we’ll use this to show you products you’ve recently viewedLocation, IP address and browser type: we’ll use this to estimating taxes and shippingWe’ll also use cookies to keep track of basket contents while you’re browsing our site.When you purchase from us, we’ll ask you to provide information including your name, billing address, shipping address, email address, phone number, credit card/payment details and optional account information like username and password. We’ll use this information to:Send you information about your account and orderRespond to your requests, including refunds and complaintsProcess payments and prevent fraudSet up your account for our storeComply with any legal obligations we have, such as calculating taxesIf you create an account, we will store your name, address, email and phone number, which will be used at checkout for future orders.We will store order information for 5 years for tax and accounting purposes. This includes your name, email address and billing and shipping addresses.Comments and ReviewsWhen visitors leave comments or reviews on the site we collect the data shown in the form, and also the visitor’s IP address and browser user agent string to help spam detection. This is handled by Akismet.An anonymised string created from your email address (also called a hash) may be provided to the Gravatar service to see if you are using it. The Gravatar service Privacy Policy is available here: https://automattic.com/privacy/. After approval of your comment, your profile picture is visible to the public in the context of your comment.Contact formsWhen a visitor uses the contact form we collect the data shown in the form. This data is only used to respond to your contact or in ways specified by you in the form. The visitor’s IP address and browser user agent string are collected to help spam detection. This is handled by Akismet.MediaIf you upload images to the website, you should avoid uploading images with embedded location data (EXIF GPS) included. Visitors to the website can download and extract any location data from images on the website.CookiesIf you leave a comment on our site you may opt in to saving your name, email address and website in cookies. These are for your convenience so that you do not have to fill in your details again when you leave another comment. These cookies will last for one year.If you visit our login page, we will set a temporary cookie to determine if your browser accepts cookies. This cookie contains no personal data and is discarded when you close your browser.When you log in, we will also set up several cookies to save your login information and your screen display choices. Login cookies last for two days, and screen options cookies last for a year. If you select “Remember Me”, your login will persist for two weeks. If you log out of your account, the login cookies will be removed.If you edit or publish an article, an additional cookie will be saved in your browser. This cookie includes no personal data and simply indicates the post ID of the article you just edited. It expires after 1 day.Embedded content from other websitesArticles on this site may include embedded content (e.g. videos, images, articles, etc.). Embedded content from other websites behaves in the exact same way as if the visitor has visited the other website.These websites may collect data about you, use cookies, embed additional third-party tracking, and monitor your interaction with that embedded content, including tracking your interaction with the embedded content if you have an account and are logged in to that website.Who on our team has access to your dataBritt Coxon, of Britt Coxon Art and Design, or BrittHub (https://britthub.co.uk.) and team will have access to the information you provide. For example, both Administrators and Shop Managers can access:Order information like what was purchased, when it was purchased and where it should be sent, andCustomer information like your name, email address, and billing and shipping information.Our team members have access to this information to help fulfil orders, process refunds and support you.Who we share your data withWe share information with third parties who help us provide our orders and store services to you; for example to complete an order your address will be shared with a shipping provider such as Royal Mail.PaymentsWe accept payments through PayPal and WooCommerce Payments. When processing payments, some of your data will be passed to PayPal or WooCommerce Payments, including information required to process or support the payment, such as the purchase total and billing information. Please see the PayPal Privacy Policy for more details.How long we retain your dataIf you leave a comment, the comment and its metadata are retained indefinitely. For users that register on our website, we also store the personal information they provide in their user profile. All users can see, edit, or delete their personal information at any time (except they cannot change their username). Website administrators can also see and edit that information.What rights you have over your dataIf you have an account on this site, or have left comments, you can request to receive an exported file of the personal data we hold about you, including any data you have provided to us. You can also request that we erase any personal data we hold about you. This does not include any data we are obliged to keep for administrative, legal, or security purposes.Contact informationIf you have privacy concerns or queries please contact me."
