title = "Matter.Svg Module - Matter.js Physics Engine API Docs - matter-js 0.20.0"
description = """
Converts an SVG path into an array of vector points.                                                If the input path forms a concave shape, you must decompose the result into convex parts before use.                                                See Bodies.fromVertices which provides support for this.                                                Note that this function is not guaranteed to support complex paths (such as those with holes).                                                You must load the pathseg.js polyfill on newer browsers."""
full_description = "API Matter.Svg Methods Defined in: src/geometry/Svg.js:1 The Matter.Svg module contains methods for converting SVG images into an array of vector points. To use this module you also need the SVGPathSeg polyfill: https://github.com/progers/pathseg See the included usage examples. Methods Matter.Svg.pathToVertices(path, [sampleLength=15]) → Vector[] Converts an SVG path into an array of vector points. If the input path forms a concave shape, you must decompose the result into convex parts before use. See Bodies.fromVertices which provides support for this. Note that this function is not guaranteed to support complex paths (such as those with holes). You must load the pathseg.js polyfill on newer browsers. Parameters path SVGPathElement [sampleLength=15] Number optional Returns Vector[] points src/geometry/Svg.js:20 · Usages · Examples 0.20.0 · MIT License · Readme"
