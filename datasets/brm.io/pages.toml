full_description = "API Matter.Vector Methods Properties / Options Defined in: src/geometry/Vector.js:1 The Matter.Vector module contains methods for creating and manipulating vectors. Vectors are the basis of all the geometry related operations in the engine. A Matter.Vector object is of the form { x: 0, y: 0 }. See the included usage examples. Methods Matter.Vector.add(vectorA, vectorB, [output]) → Vector Adds the two vectors. Parameters vectorA Vector vectorB Vector [output] Vector optional Returns Vector A new vector of vectorA and vectorB added src/geometry/Vector.js:142 · Usages · Examples Matter.Vector.angle(vectorA, vectorB) → Number Returns the angle between the vector vectorB - vectorA and the x-axis in radians. Parameters vectorA Vector vectorB Vector Returns Number The angle in radians src/geometry/Vector.js:216 · Usages · Examples Matter.Vector.clone(vector) → Vector Returns a new vector with x and y copied from the given vector. Parameters vector Vector Returns Vector A new cloned vector src/geometry/Vector.js:30 · Usages · Examples Matter.Vector.create(x, y) → Vector Creates a new vector. Parameters x Number y Number Returns Vector A new vector src/geometry/Vector.js:19 · Usages · Examples Matter.Vector.cross(vectorA, vectorB) → Number Returns the cross-product of two vectors. Parameters vectorA Vector vectorB Vector Returns Number The cross product of the two vectors src/geometry/Vector.js:119 · Usages · Examples Matter.Vector.cross3(vectorA, vectorB, vectorC) → Number Returns the cross-product of three vectors. Parameters vectorA Vector vectorB Vector vectorC Vector Returns Number The cross product of the three vectors src/geometry/Vector.js:130 · Usages · Examples Matter.Vector.div(vector, scalar) → Vector Divides a vector and a scalar. Parameters vector Vector scalar Number Returns Vector A new vector divided by scalar src/geometry/Vector.js:183 · Usages · Examples Matter.Vector.dot(vectorA, vectorB) → Number Returns the dot-product of two vectors. Parameters vectorA Vector vectorB Vector Returns Number The dot product of the two vectors src/geometry/Vector.js:108 · Usages · Examples Matter.Vector.magnitude(vector) → Number Returns the magnitude (length) of a vector. Parameters vector Vector Returns Number The magnitude of the vector src/geometry/Vector.js:40 · Usages · Examples Matter.Vector.magnitudeSquared(vector) → Number Returns the magnitude (length) of a vector (therefore saving a sqrt operation). Parameters vector Vector Returns Number The squared magnitude of the vector src/geometry/Vector.js:50 · Usages · Examples Matter.Vector.mult(vector, scalar) → Vector Multiplies a vector and a scalar. Parameters vector Vector scalar Number Returns Vector A new vector multiplied by scalar src/geometry/Vector.js:172 · Usages · Examples Matter.Vector.neg(vector) → Vector Negates both components of a vector such that it points in the opposite direction. Parameters vector Vector Returns Vector The negated vector src/geometry/Vector.js:206 · Usages · Examples Matter.Vector.normalise(vector) → Vector Normalises a vector (such that its magnitude is 1). Parameters vector Vector Returns Vector A new vector normalised src/geometry/Vector.js:95 · Usages · Examples Matter.Vector.perp(vector, [negate=false]) → Vector Returns the perpendicular vector. Set negate to true for the perpendicular in the opposite direction. Parameters vector Vector [negate=false] Bool optional Returns Vector The perpendicular vector src/geometry/Vector.js:194 · Usages · Examples Matter.Vector.rotate(vector, angle, [output]) → Vector Rotates the vector about (0, 0) by specified angle. Parameters vector Vector angle Number [output] Vector optional Returns Vector The vector rotated about (0, 0) src/geometry/Vector.js:60 · Usages · Examples Matter.Vector.rotateAbout(vector, angle, point, [output]) → Vector Rotates the vector about a specified point by specified angle. Parameters vector Vector angle Number point Vector [output] Vector optional Returns Vector A new vector rotated about the point src/geometry/Vector.js:77 · Usages · Examples Matter.Vector.sub(vectorA, vectorB, [output]) → Vector Subtracts the two vectors. Parameters vectorA Vector vectorB Vector [output] Vector optional Returns Vector A new vector of vectorA and vectorB subtracted src/geometry/Vector.js:157 · Usages · Examples Properties / Options The following properties if specified below are for objects created by Matter.Vector.create and may be passed to it as options. Vector._temp Vector[] private Temporary vector pool (not thread-safe). src/geometry/Vector.js:227 · Usages · Examples 0.20.0 · MIT License · Readme"
