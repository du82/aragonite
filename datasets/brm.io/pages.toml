["https://brm.io/matter-js/docs/classes/Body.html"]
title = "Matter.Body Module - Matter.js Physics Engine API Docs - matter-js 0.20.0"
description = "Initialises body properties."
full_description = "API Matter.Body Methods Properties / Options Events Defined in: src/body/Body.js:1 The Matter.Body module contains methods for creating and manipulating rigid bodies. For creating bodies with common configurations such as rectangles, circles and other polygons see the module Matter.Bodies. See the included usage examples. Methods Matter.Body._initProperties(body, [options]) private Initialises body properties. Parameters body Body [options] Object optional src/body/Body.js:136 · Usages · Examples Matter.Body._totalProperties(body) → Object private Returns the sums of the properties of all compound parts of the parent body. Parameters body Body Returns src/body/Body.js:839 · Usages · Examples Matter.Body.applyForce(body, position, force) Applies the force to the body from the force origin position in world-space, over a single timestep, including applying any resulting angular torque. Forces are useful for effects like gravity, wind or rocket thrust, but can be difficult in practice when precise control is needed. In these cases see Body.setVelocity and Body.setPosition as an alternative. The force from this function is only applied once for the duration of a single timestep, in other words the duration depends directly on the current engine update delta and the rate of calls to this function. Therefore to account for time, you should apply the force constantly over as many engine updates as equivalent to the intended duration. If all or part of the force duration is some fraction of a timestep, first multiply the force by duration / timestep. The force origin position in world-space must also be specified. Passing body.position will result in zero angular effect as the force origin would be at the centre of mass. The body will take time to accelerate under a force, the resulting effect depends on duration of the force, the body mass and other forces on the body including friction combined. Parameters body Body position Vector The force origin in world-space. Pass body.position to avoid angular torque. force Vector src/body/Body.js:813 · Usages · Examples Matter.Body.create(options) → Body Creates a new rigid body model. The options parameter is an object that specifies any properties you wish to override the defaults. All properties have default values, and many are pre-calculated automatically based on other properties. Vertices must be specified in clockwise order. See the properties section below for detailed information on what you can pass via the options object. Parameters options Object Returns Body body src/body/Body.js:30 · Usages · Examples Matter.Body.getAngularSpeed(body) → Number Gets the current rotational speed of the body. Equivalent to the magnitude of its angular velocity. Parameters body Body Returns Number angular speed src/body/Body.js:615 · Usages · Examples Matter.Body.getAngularVelocity(body) → Number Gets the current rotational velocity of the body. Parameters body Body Returns Number angular velocity src/body/Body.js:605 · Usages · Examples Matter.Body.getSpeed(body) → Number Gets the current linear speed of the body. Equivalent to the magnitude of its velocity. Parameters body Body Returns Number speed src/body/Body.js:569 · Usages · Examples Matter.Body.getVelocity(body) → Vector Gets the current linear velocity of the body. Parameters body Body Returns Vector velocity src/body/Body.js:554 · Usages · Examples Matter.Body.nextCategory() → Number Returns the next unique category bitfield (starting after the initial default category 0x0001). There are 32 available. See body.collisionFilter for more information. Returns Number Unique category bitfield src/body/Body.js:125 · Usages · Examples Matter.Body.nextGroup([isNonColliding=false]) → Number Returns the next unique group index for which bodies will collide. If isNonColliding is true, returns the next unique group index for which bodies will not collide. See body.collisionFilter for more information. Parameters [isNonColliding=false] Bool optional Returns Number Unique group index src/body/Body.js:110 · Usages · Examples Matter.Body.rotate(body, rotation, [point], [updateVelocity=false]) Rotates a body by a given angle relative to its current angle. By default angular velocity is unchanged. If updateVelocity is true then angular velocity is inferred from the change in angle. Parameters body Body rotation Number [point] Vector optional [updateVelocity=false] Boolean optional src/body/Body.js:649 · Usages · Examples Matter.Body.scale(body, scaleX, scaleY, [point]) Scales the body, including updating physical properties (mass, area, axes, inertia), from a world-space point (default is body centre). Parameters body Body scaleX Number scaleY Number [point] Vector optional src/body/Body.js:676 · Usages · Examples Matter.Body.set(body, settings, value) Given a property and a value (or map of), sets the property(s) on the body, using the appropriate setter functions if they exist. Prefer to use the actual setter functions in performance critical situations. Parameters body Body settings Object A property name (or map of properties and values) to set on the body. value Object The value to set if settings is a single property name. src/body/Body.js:181 · Usages · Examples Matter.Body.setAngle(body, angle, [updateVelocity=false]) Sets the angle of the body. By default angular velocity is unchanged. If updateVelocity is true then angular velocity is inferred from the change in angle. Parameters body Body angle Number [updateVelocity=false] Boolean optional src/body/Body.js:507 · Usages · Examples Matter.Body.setAngularSpeed(body, speed) Sets the current rotational speed of the body. Direction is maintained. Affects body angular velocity. Parameters body Body speed Number src/body/Body.js:626 · Usages · Examples Matter.Body.setAngularVelocity(body, velocity) Sets the current rotational velocity of the body. Affects body angular speed. Parameters body Body velocity Number src/body/Body.js:591 · Usages · Examples Matter.Body.setCentre(body, centre, relative) Set the centre of mass of the body. The centre is a vector in world-space unless relative is set, in which case it is a translation. The centre of mass is the point the body rotates about and can be used to simulate non-uniform density. This is equal to moving body.position but not the body.vertices. Invalid if the centre falls outside the body's convex hull. Parameters body Body centre Vector relative Bool src/body/Body.js:451 · Usages · Examples Matter.Body.setDensity(body, density) Sets the density of the body. Mass and inertia are automatically updated to reflect the change. Parameters body Body density Number src/body/Body.js:321 · Usages · Examples Matter.Body.setInertia(body, inertia) Sets the moment of inertia of the body. This is the second moment of area in two dimensions. Inverse inertia is automatically updated to reflect the change. Mass is not changed. Parameters body Body inertia Number src/body/Body.js:332 · Usages · Examples Matter.Body.setMass(body, mass) Sets the mass of the body. Inverse mass, density and inertia are automatically updated to reflect the change. Parameters body Body mass Number src/body/Body.js:305 · Usages · Examples Matter.Body.setParts(body, parts, [autoHull=true]) Sets the parts of the body. See body.parts for details and requirements on how parts are used. See Bodies.fromVertices for a related utility. This function updates body mass, inertia and centroid based on the parts geometry. Sets each part.parent to be this body. The convex hull is computed and set on this body (unless autoHull is false). Automatically ensures that the first part in body.parts is the body. Parameters body Body parts Body[] [autoHull=true] Bool optional src/body/Body.js:381 · Usages · Examples Matter.Body.setPosition(body, position, [updateVelocity=false]) Sets the position of the body. By default velocity is unchanged. If updateVelocity is true then velocity is inferred from the change in position. Parameters body Body position Vector [updateVelocity=false] Boolean optional src/body/Body.js:476 · Usages · Examples Matter.Body.setSpeed(body, speed) Sets the current linear speed of the body. Direction is maintained. Affects body velocity. Parameters body Body speed Number src/body/Body.js:580 · Usages · Examples Matter.Body.setStatic(body, isStatic) Sets the body as static, including isStatic flag and setting mass and inertia to Infinity. Parameters body Body isStatic Bool src/body/Body.js:254 · Usages · Examples Matter.Body.setVelocity(body, velocity) Sets the current linear velocity of the body. Affects body speed. Parameters body Body velocity Vector src/body/Body.js:538 · Usages · Examples Matter.Body.setVertices(body, vertices) Sets the body's vertices and updates body properties accordingly, including inertia, area and mass (with respect to body.density). Vertices will be automatically transformed to be orientated around their centre of mass as the origin. They are then automatically translated to world space based on body.position. The vertices argument should be passed as an array of Matter.Vector points (or a Matter.Vertices array). Vertices must form a convex hull. Concave vertices must be decomposed into convex parts. Parameters body Body vertices Vector[] src/body/Body.js:344 · Usages · Examples Matter.Body.translate(body, translation, [updateVelocity=false]) Moves a body by a given vector relative to its current position. By default velocity is unchanged. If updateVelocity is true then velocity is inferred from the change in position. Parameters body Body translation Vector [updateVelocity=false] Boolean optional src/body/Body.js:637 · Usages · Examples Matter.Body.update(body, [deltaTime=16.666]) Performs an update by integrating the equations of motion on the body. This is applied every update by Matter.Engine automatically. Parameters body Body [deltaTime=16.666] Number optional src/body/Body.js:740 · Usages · Examples Matter.Body.updateVelocities(body) Updates properties body.velocity, body.speed, body.angularVelocity and body.angularSpeed which are normalised in relation to Body._baseDelta. Parameters body Body src/body/Body.js:796 · Usages · Examples Properties / Options The following properties if specified below are for objects created by Matter.Body.create and may be passed to it as options. Body.angle Number A Number specifying the angle of the body, in radians. Default: 0 src/body/Body.js:981 · Usages · Examples Body.angularSpeed Number Read only. Use Body.setAngularSpeed to set. See Body.getAngularSpeed for details. Default: 0 src/body/Body.js:1068 · Usages · Examples Body.angularVelocity Number Read only. Use Body.setAngularVelocity to set. See Body.getAngularVelocity for details. Default: 0 src/body/Body.js:1080 · Usages · Examples Body.area String Read only. Calculated automatically when vertices are set. A Number that measures the area of the body's convex hull. src/body/Body.js:1447 · Usages · Examples Body.axes Vector[] Read only. Calculated automatically when vertices are set. An array of unique axis vectors (edge normals) used for collision detection. These are automatically calculated when vertices are set. They are constantly updated by Body.update during the simulation. src/body/Body.js:1435 · Usages · Examples Body.bounds Bounds A Bounds object that defines the AABB region for the body. It is automatically calculated when vertices are set and constantly updated by Body.update during simulation. src/body/Body.js:1458 · Usages · Examples Body.chamfer Object | Null | Undefined Temporarily may hold parameters to be passed to Vertices.chamfer where supported by external functions. See Vertices.chamfer for possible parameters this object may hold. Currently only functions inside Matter.Bodies provide a utility using this property as a vertices pre-processing option. Alternatively consider using Vertices.chamfer directly on vertices before passing them to a body creation function. src/body/Body.js:1466 · Usages · Examples Body.collisionFilter Object An Object that specifies the collision filtering properties of this body. Collisions between two bodies will obey the following rules: If the two bodies have the same non-zero value of collisionFilter.group, they will always collide if the value is positive, and they will never collide if the value is negative. If the two bodies have different values of collisionFilter.group or if one (or both) of the bodies has a value of 0, then the category/mask rules apply as follows: Each body belongs to a collision category, given by collisionFilter.category. This value is used as a bit field and the category should have only one bit set, meaning that the value of this property is a power of two in the range [1, 2^31]. Thus, there are 32 different collision categories available. Each body also defines a collision bitmask, given by collisionFilter.mask which specifies the categories it collides with (the value is the bitwise AND value of all these categories). Using the category/mask rules, two bodies A and B collide if each includes the other's category in its mask, i.e. (categoryA & maskB) !== 0 and (categoryB & maskA) !== 0 are both true. src/body/Body.js:1252 · Usages · Examples Body.collisionFilter.category Object A bit field that specifies the collision category this body belongs to. The category value should have only one bit set, for example 0x0001. This means there are up to 32 unique collision categories available. See body.collisionFilter for more information. Default: 1 src/body/Body.js:1287 · Usages · Examples Body.collisionFilter.group Object An Integer Number, that specifies the collision group this body belongs to. See body.collisionFilter for more information. Default: 0 src/body/Body.js:1278 · Usages · Examples Body.collisionFilter.mask Object A bit mask that specifies the collision categories this body may collide with. See body.collisionFilter for more information. Default: -1 src/body/Body.js:1298 · Usages · Examples Body.deltaTime Number Read only. Updated during engine update. A Number that records the last delta time value used to update this body. Used to calculate speed and velocity. Default: 1000 / 60 src/body/Body.js:1327 · Usages · Examples Body.density Number Read only. Use Body.setDensity to set. A Number that defines the density of the body (mass per unit area). Mass will also be updated when set. Default: 0.001 src/body/Body.js:1143 · Usages · Examples Body.force Vector A Vector that accumulates the total force applied to the body for a single update. Force is zeroed after every Engine.update, so constant forces should be applied for every update they are needed. See also Body.applyForce. Default: { x: 0, y: 0 } src/body/Body.js:1022 · Usages · Examples Body.friction Number A Number that defines the friction of the body. The value is always positive and is in the range (0, 1). A value of 0 means that the body may slide indefinitely. A value of 1 means the body may come to a stop almost "
