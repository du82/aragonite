title = "Matter.Constraint Module - Matter.js Physics Engine API Docs - matter-js 0.20.0"
description = """
Creates a new constraint.                                                All properties have default values, and many are pre-calculated automatically based on other properties.                                                To simulate a revolute constraint (or pin joint) set length: 0 and a high stiffness value (e.g. 0.7 or above).                                                If the constraint is unstable, try lowering the stiffness value and / or increasing engine.constraintIterations.                                                For compound bodies, constraints must be applied to the parent body (not one of its parts).                                                See the properties section below for detailed information on what you can pass via the options object."""
full_description = '''API Matter.Constraint Methods Properties / Options Defined in: src/constraint/Constraint.js:1 The Matter.Constraint module contains methods for creating and manipulating constraints. Constraints are used for specifying that a fixed distance must be maintained between two bodies (or a body and a fixed world-space position). The stiffness of constraints can be modified to create springs or elastic. See the included usage examples. Methods Matter.Constraint.create(options) → Constraint Creates a new constraint. All properties have default values, and many are pre-calculated automatically based on other properties. To simulate a revolute constraint (or pin joint) set length: 0 and a high stiffness value (e.g. 0.7 or above). If the constraint is unstable, try lowering the stiffness value and / or increasing engine.constraintIterations. For compound bodies, constraints must be applied to the parent body (not one of its parts). See the properties section below for detailed information on what you can pass via the options object. Parameters options Object Returns Constraint constraint src/constraint/Constraint.js:28 · Usages · Examples Matter.Constraint.currentLength(constraint) → Number Returns the current length of the constraint. This is the distance between both of the constraint's end points. See constraint.length for the target rest length. Parameters constraint Constraint Returns Number the current length src/constraint/Constraint.js:338 · Usages · Examples Matter.Constraint.pointAWorld(constraint) → Vector Returns the world-space position of constraint.pointA, accounting for constraint.bodyA. Parameters constraint Constraint Returns Vector the world-space position src/constraint/Constraint.js:308 · Usages · Examples Matter.Constraint.pointBWorld(constraint) → Vector Returns the world-space position of constraint.pointB, accounting for constraint.bodyB. Parameters constraint Constraint Returns Vector the world-space position src/constraint/Constraint.js:323 · Usages · Examples Matter.Constraint.postSolveAll(bodies) private Performs body updates required after solving constraints. Parameters bodies Body[] src/constraint/Constraint.js:262 · Usages · Examples Matter.Constraint.preSolveAll(bodies) private Prepares for solving by constraint warming. Parameters bodies Body[] src/constraint/Constraint.js:87 · Usages · Examples Matter.Constraint.solve(constraint, timeScale) private Solves a distance constraint with Gauss-Siedel method. Parameters constraint Constraint timeScale Number src/constraint/Constraint.js:141 · Usages · Examples Matter.Constraint.solveAll(constraints, delta) private Solves all constraints in a list of collisions. Parameters constraints Constraint[] delta Number src/constraint/Constraint.js:108 · Usages · Examples Properties / Options The following properties if specified below are for objects created by Matter.Constraint.create and may be passed to it as options. Constraint.bodyA Body The first possible Body that this constraint is attached to. Default: null src/constraint/Constraint.js:446 · Usages · Examples Constraint.bodyB Body The second possible Body that this constraint is attached to. Default: null src/constraint/Constraint.js:454 · Usages · Examples Constraint.damping Number A Number that specifies the damping of the constraint, i.e. the amount of resistance applied to each body based on their velocities to limit the amount of oscillation. Damping will only be apparent when the constraint also has a very low stiffness. A value of 0.1 means the constraint will apply heavy damping, resulting in little to no oscillation. A value of 0 means the constraint will apply no damping. Default: 0 src/constraint/Constraint.js:488 · Usages · Examples Constraint.id Number An integer Number uniquely identifying number generated in Composite.create by Common.nextId. src/constraint/Constraint.js:371 · Usages · Examples Constraint.label String An arbitrary String name to help the user identify and manage bodies. Default: "Constraint" src/constraint/Constraint.js:387 · Usages · Examples Constraint.length Number A Number that specifies the target resting length of the constraint. It is calculated automatically in Constraint.create from initial positions of the constraint.bodyA and constraint.bodyB. src/constraint/Constraint.js:500 · Usages · Examples Constraint.plugin An object reserved for storing plugin-specific properties. src/constraint/Constraint.js:508 · Usages · Examples Constraint.pointA Vector A Vector that specifies the offset of the constraint from center of the constraint.bodyA if defined, otherwise a world-space position. Default: { x: 0, y: 0 } src/constraint/Constraint.js:462 · Usages · Examples Constraint.pointB Vector A Vector that specifies the offset of the constraint from center of the constraint.bodyB if defined, otherwise a world-space position. Default: { x: 0, y: 0 } src/constraint/Constraint.js:470 · Usages · Examples Constraint.render Object An Object that defines the rendering properties to be consumed by the module Matter.Render. src/constraint/Constraint.js:395 · Usages · Examples Constraint.render.anchors Boolean A Boolean that defines if the constraint's anchor points should be rendered. Default: true src/constraint/Constraint.js:438 · Usages · Examples Constraint.render.lineWidth Number A Number that defines the line width to use when rendering the constraint outline. A value of 0 means no outline will be rendered. Default: 2 src/constraint/Constraint.js:410 · Usages · Examples Constraint.render.strokeStyle String A String that defines the stroke style to use when rendering the constraint outline. It is the same as when using a canvas, so it accepts CSS style property values. Default: a random colour src/constraint/Constraint.js:419 · Usages · Examples Constraint.render.type String A String that defines the constraint rendering type. The possible values are 'line', 'pin', 'spring'. An appropriate render type will be automatically chosen unless one is given in options. Default: 'line' src/constraint/Constraint.js:428 · Usages · Examples Constraint.render.visible Boolean A flag that indicates if the constraint should be rendered. Default: true src/constraint/Constraint.js:402 · Usages · Examples Constraint.stiffness Number A Number that specifies the stiffness of the constraint, i.e. the rate at which it returns to its resting constraint.length. A value of 1 means the constraint should be very stiff. A value of 0.2 means the constraint acts like a soft spring. Default: 1 src/constraint/Constraint.js:478 · Usages · Examples Constraint.type String A String denoting the type of object. Default: "constraint" src/constraint/Constraint.js:378 · Usages · Examples 0.20.0 · MIT License · Readme'''
