title = "Matter.js Physics Engine API Docs - matter-js 0.20.0"
full_description = '''File: src/render/Render.js /** * The `Matter.Render` module is a lightweight, optional utility which provides a simple canvas based renderer for visualising instances of `Matter.Engine`. * It is intended for development and debugging purposes, but may also be suitable for simple games. * It includes a number of drawing options including wireframe, vector with support for sprites and viewports. * * @class Render */ var Render = {}; module.exports = Render; var Body = require('../body/Body'); var Common = require('../core/Common'); var Composite = require('../body/Composite'); var Bounds = require('../geometry/Bounds'); var Events = require('../core/Events'); var Vector = require('../geometry/Vector'); var Mouse = require('../core/Mouse'); (function() { var _requestAnimationFrame, _cancelAnimationFrame; if (typeof window !== 'undefined') { _requestAnimationFrame = window.requestAnimationFrame || window.webkitRequestAnimationFrame || window.mozRequestAnimationFrame || window.msRequestAnimationFrame || function(callback){ window.setTimeout(function() { callback(Common.now()); }, 1000 / 60); }; _cancelAnimationFrame = window.cancelAnimationFrame || window.mozCancelAnimationFrame || window.webkitCancelAnimationFrame || window.msCancelAnimationFrame; } Render._goodFps = 30; Render._goodDelta = 1000 / 60; /** * Creates a new renderer. The options parameter is an object that specifies any properties you wish to override the defaults. * All properties have default values, and many are pre-calculated automatically based on other properties. * See the properties section below for detailed information on what you can pass via the `options` object. * @method create * @param {object} [options] * @return {render} A new renderer */ Render.create = function(options) { var defaults = { engine: null, element: null, canvas: null, mouse: null, frameRequestId: null, timing: { historySize: 60, delta: 0, deltaHistory: [], lastTime: 0, lastTimestamp: 0, lastElapsed: 0, timestampElapsed: 0, timestampElapsedHistory: [], engineDeltaHistory: [], engineElapsedHistory: [], engineUpdatesHistory: [], elapsedHistory: [] }, options: { width: 800, height: 600, pixelRatio: 1, background: '#14151f', wireframeBackground: '#14151f', wireframeStrokeStyle: '#bbb', hasBounds: !!options.bounds, enabled: true, wireframes: true, showSleeping: true, showDebug: false, showStats: false, showPerformance: false, showBounds: false, showVelocity: false, showCollisions: false, showSeparations: false, showAxes: false, showPositions: false, showAngleIndicator: false, showIds: false, showVertexNumbers: false, showConvexHulls: false, showInternalEdges: false, showMousePosition: false } }; var render = Common.extend(defaults, options); if (render.canvas) { render.canvas.width = render.options.width || render.canvas.width; render.canvas.height = render.options.height || render.canvas.height; } render.mouse = options.mouse; render.engine = options.engine; render.canvas = render.canvas || _createCanvas(render.options.width, render.options.height); render.context = render.canvas.getContext('2d'); render.textures = {}; render.bounds = render.bounds || { min: { x: 0, y: 0 }, max: { x: render.canvas.width, y: render.canvas.height } }; // for temporary back compatibility only render.controller = Render; render.options.showBroadphase = false; if (render.options.pixelRatio !== 1) { Render.setPixelRatio(render, render.options.pixelRatio); } if (Common.isElement(render.element)) { render.element.appendChild(render.canvas); } return render; }; /** * Continuously updates the render canvas on the `requestAnimationFrame` event. * @method run * @param {render} render */ Render.run = function(render) { (function loop(time){ render.frameRequestId = _requestAnimationFrame(loop); _updateTiming(render, time); Render.world(render, time); render.context.setTransform(render.options.pixelRatio, 0, 0, render.options.pixelRatio, 0, 0); if (render.options.showStats || render.options.showDebug) { Render.stats(render, render.context, time); } if (render.options.showPerformance || render.options.showDebug) { Render.performance(render, render.context, time); } render.context.setTransform(1, 0, 0, 1, 0, 0); })(); }; /** * Ends execution of `Render.run` on the given `render`, by canceling the animation frame request event loop. * @method stop * @param {render} render */ Render.stop = function(render) { _cancelAnimationFrame(render.frameRequestId); }; /** * Sets the pixel ratio of the renderer and updates the canvas. * To automatically detect the correct ratio, pass the string `'auto'` for `pixelRatio`. * @method setPixelRatio * @param {render} render * @param {number} pixelRatio */ Render.setPixelRatio = function(render, pixelRatio) { var options = render.options, canvas = render.canvas; if (pixelRatio === 'auto') { pixelRatio = _getPixelRatio(canvas); } options.pixelRatio = pixelRatio; canvas.setAttribute('data-pixel-ratio', pixelRatio); canvas.width = options.width * pixelRatio; canvas.height = options.height * pixelRatio; canvas.style.width = options.width + 'px'; canvas.style.height = options.height + 'px'; }; /** * Sets the render `width` and `height`. * * Updates the canvas accounting for `render.options.pixelRatio`. * * Updates the bottom right render bound `render.bounds.max` relative to the provided `width` and `height`. * The top left render bound `render.bounds.min` isn't changed. * * Follow this call with `Render.lookAt` if you need to change the render bounds. * * See also `Render.setPixelRatio`. * @method setSize * @param {render} render * @param {number} width The width (in CSS pixels) * @param {number} height The height (in CSS pixels) */ Render.setSize = function(render, width, height) { render.options.width = width; render.options.height = height; render.bounds.max.x = render.bounds.min.x + width; render.bounds.max.y = render.bounds.min.y + height; if (render.options.pixelRatio !== 1) { Render.setPixelRatio(render, render.options.pixelRatio); } else { render.canvas.width = width; render.canvas.height = height; } }; /** * Positions and sizes the viewport around the given object bounds. * Objects must have at least one of the following properties: * - `object.bounds` * - `object.position` * - `object.min` and `object.max` * - `object.x` and `object.y` * @method lookAt * @param {render} render * @param {object[]} objects * @param {vector} [padding] * @param {bool} [center=true] */ Render.lookAt = function(render, objects, padding, center) { center = typeof center !== 'undefined' ? center : true; objects = Common.isArray(objects) ? objects : [objects]; padding = padding || { x: 0, y: 0 }; // find bounds of all objects var bounds = { min: { x: Infinity, y: Infinity }, max: { x: -Infinity, y: -Infinity } }; for (var i = 0; i < objects.length; i += 1) { var object = objects[i], min = object.bounds ? object.bounds.min : (object.min || object.position || object), max = object.bounds ? object.bounds.max : (object.max || object.position || object); if (min && max) { if (min.x < bounds.min.x) bounds.min.x = min.x; if (max.x > bounds.max.x) bounds.max.x = max.x; if (min.y < bounds.min.y) bounds.min.y = min.y; if (max.y > bounds.max.y) bounds.max.y = max.y; } } // find ratios var width = (bounds.max.x - bounds.min.x) + 2 * padding.x, height = (bounds.max.y - bounds.min.y) + 2 * padding.y, viewHeight = render.canvas.height, viewWidth = render.canvas.width, outerRatio = viewWidth / viewHeight, innerRatio = width / height, scaleX = 1, scaleY = 1; // find scale factor if (innerRatio > outerRatio) { scaleY = innerRatio / outerRatio; } else { scaleX = outerRatio / innerRatio; } // enable bounds render.options.hasBounds = true; // position and size render.bounds.min.x = bounds.min.x; render.bounds.max.x = bounds.min.x + width * scaleX; render.bounds.min.y = bounds.min.y; render.bounds.max.y = bounds.min.y + height * scaleY; // center if (center) { render.bounds.min.x += width * 0.5 - (width * scaleX) * 0.5; render.bounds.max.x += width * 0.5 - (width * scaleX) * 0.5; render.bounds.min.y += height * 0.5 - (height * scaleY) * 0.5; render.bounds.max.y += height * 0.5 - (height * scaleY) * 0.5; } // padding render.bounds.min.x -= padding.x; render.bounds.max.x -= padding.x; render.bounds.min.y -= padding.y; render.bounds.max.y -= padding.y; // update mouse if (render.mouse) { Mouse.setScale(render.mouse, { x: (render.bounds.max.x - render.bounds.min.x) / render.canvas.width, y: (render.bounds.max.y - render.bounds.min.y) / render.canvas.height }); Mouse.setOffset(render.mouse, render.bounds.min); } }; /** * Applies viewport transforms based on `render.bounds` to a render context. * @method startViewTransform * @param {render} render */ Render.startViewTransform = function(render) { var boundsWidth = render.bounds.max.x - render.bounds.min.x, boundsHeight = render.bounds.max.y - render.bounds.min.y, boundsScaleX = boundsWidth / render.options.width, boundsScaleY = boundsHeight / render.options.height; render.context.setTransform( render.options.pixelRatio / boundsScaleX, 0, 0, render.options.pixelRatio / boundsScaleY, 0, 0 ); render.context.translate(-render.bounds.min.x, -render.bounds.min.y); }; /** * Resets all transforms on the render context. * @method endViewTransform * @param {render} render */ Render.endViewTransform = function(render) { render.context.setTransform(render.options.pixelRatio, 0, 0, render.options.pixelRatio, 0, 0); }; /** * Renders the given `engine`'s `Matter.World` object. * This is the entry point for all rendering and should be called every time the scene changes. * @method world * @param {render} render */ Render.world = function(render, time) { var startTime = Common.now(), engine = render.engine, world = engine.world, canvas = render.canvas, context = render.context, options = render.options, timing = render.timing; var allBodies = Composite.allBodies(world), allConstraints = Composite.allConstraints(world), background = options.wireframes ? options.wireframeBackground : options.background, bodies = [], constraints = [], i; var event = { timestamp: engine.timing.timestamp }; Events.trigger(render, 'beforeRender', event); // apply background if it has changed if (render.currentBackground !== background) _applyBackground(render, background); // clear the canvas with a transparent fill, to allow the canvas background to show context.globalCompositeOperation = 'source-in'; context.fillStyle = "transparent"; context.fillRect(0, 0, canvas.width, canvas.height); context.globalCompositeOperation = 'source-over'; // handle bounds if (options.hasBounds) { // filter out bodies that are not in view for (i = 0; i < allBodies.length; i++) { var body = allBodies[i]; if (Bounds.overlaps(body.bounds, render.bounds)) bodies.push(body); } // filter out constraints that are not in view for (i = 0; i < allConstraints.length; i++) { var constraint = allConstraints[i], bodyA = constraint.bodyA, bodyB = constraint.bodyB, pointAWorld = constraint.pointA, pointBWorld = constraint.pointB; if (bodyA) pointAWorld = Vector.add(bodyA.position, constraint.pointA); if (bodyB) pointBWorld = Vector.add(bodyB.position, constraint.pointB); if (!pointAWorld || !pointBWorld) continue; if (Bounds.contains(render.bounds, pointAWorld) || Bounds.contains(render.bounds, pointBWorld)) constraints.push(constraint); } // transform the view Render.startViewTransform(render); // update mouse if (render.mouse) { Mouse.setScale(render.mouse, { x: (render.bounds.max.x - render.bounds.min.x) / render.options.width, y: (render.bounds.max.y - render.bounds.min.y) / render.options.height }); Mouse.setOffset(render.mouse, render.bounds.min); } } else { constraints = allConstraints; bodies = allBodies; if (render.options.pixelRatio !== 1) { render.context.setTransform(render.options.pixelRatio, 0, 0, render.options.pixelRatio, 0, 0); } } if (!options.wireframes || (engine.enableSleeping && options.showSleeping)) { // fully featured rendering of bodies Render.bodies(render, bodies, context); } else { if (options.showConvexHulls) Render.bodyConvexHulls(render, bodies, context); // optimised method for wireframes only Render.bodyWireframes(render, bodies, context); } if (options.showBounds) Render.bodyBounds(render, bodies, context); if (options.showAxes || options.showAngleIndicator) Render.bodyAxes(render, bodies, context); if (options.showPositions) Render.bodyPositions(render, bodies, context); if (options.showVelocity) Render.bodyVelocity(render, bodies, context); if (options.showIds) Render.bodyIds(render, bodies, context); if (options.showSeparations) Render.separations(render, engine.pairs.list, context); if (options.showCollisions) Render.collisions(render, engine.pairs.list, context); if (options.showVertexNumbers) Render.vertexNumbers(render, bodies, context); if (options.showMousePosition) Render.mousePosition(render, render.mouse, context); Render.constraints(constraints, context); if (options.hasBounds) { // revert view transforms Render.endViewTransform(render); } Events.trigger(render, 'afterRender', event); // log the time elapsed computing this update timing.lastElapsed = Common.now() - startTime; }; /** * Renders statistics about the engine and world useful for debugging. * @private * @method stats * @param {render} render * @param {RenderingContext} context * @param {Number} time */ Render.stats = function(render, context, time) { var engine = render.engine, world = engine.world, bodies = Composite.allBodies(world), parts = 0, width = 55, height = 44, x = 0, y = 0; // count parts for (var i = 0; i < bodies.length; i += 1) { parts += bodies[i].parts.length; } // sections var sections = { 'Part': parts, 'Body': bodies.length, 'Cons': Composite.allConstraints(world).length, 'Comp': Composite.allComposites(world).length, 'Pair': engine.pairs.list.length }; // background context.fillStyle = '#0e0f19'; context.fillRect(x, y, width * 5.5, height); context.font = '12px Arial'; context.textBaseline = 'top'; context.textAlign = 'right'; // sections for (var key in sections) { var section = sections[key]; // label context.fillStyle = '#aaa'; context.fillText(key, x + width, y + 8); // value context.fillStyle = '#eee'; context.fillText(section, x + width, y + 26); x += width; } }; /** * Renders engine and render performance information. * @private * @method performance * @param {render} render * @param {RenderingContext} context */ Render.performance = function(render, context) { var engine = render.engine, timing = render.timing, deltaHistory = timing.deltaHistory, elapsedHistory = timing.elapsedHistory, timestampElapsedHistory = timing.timestampElapsedHistory, engineDeltaHistory = timing.engineDeltaHistory, engineUpdatesHistory = timing.engineUpdatesHistory, engineElapsedHistory = timing.engineElapsedHistory, lastEngineUpdatesPerFrame = engine.timing.lastUpdatesPerFrame, lastEngineDelta = engine.timing.lastDelta; var deltaMean = _mean(deltaHistory), elapsedMean = _mean(elapsedHistory), engineDeltaMean = _mean(engineDeltaHistory), e'''
