title = "Matter.Collision Module - Matter.js Physics Engine API Docs - matter-js 0.20.0"
description = "Finds supporting vertices given two bodies along a given direction using hill-climbing."
full_description = "API Matter.Collision Methods Properties / Options Defined in: src/collision/Collision.js:1 The Matter.Collision module contains methods for detecting collisions between a given pair of bodies. For efficient detection between a list of bodies, see Matter.Detector and Matter.Query. See Matter.Engine for collision events. Methods Matter.Collision._findSupports(bodyA, bodyB, normal, direction) → Object private Finds supporting vertices given two bodies along a given direction using hill-climbing. Parameters bodyA Body bodyB Body normal Vector direction Number Returns [vector] src/collision/Collision.js:241 · Usages · Examples Matter.Collision._overlapAxes(result, verticesA, verticesB, axes) private Find the overlap between two sets of vertices. Parameters result Object verticesA Vertices verticesB Vertices axes Axes src/collision/Collision.js:167 · Usages · Examples Matter.Collision.collides(bodyA, bodyB, [pairs]) → Collision | Null Detect collision between two bodies. Parameters bodyA Body bodyB Body [pairs] Pairs optional Optionally reuse collision records from existing pairs. Returns Collision | Null A collision record if detected, otherwise null src/collision/Collision.js:55 · Usages · Examples Matter.Collision.create(bodyA, bodyB) → Collision Creates a new collision record. Parameters bodyA Body The first body part represented by the collision record bodyB Body The second body part represented by the collision record Returns Collision A new collision record src/collision/Collision.js:31 · Usages · Examples Properties / Options The following properties if specified below are for objects created by Matter.Collision.create and may be passed to it as options. Collision.bodyA Body The first body part represented by the collision (see also collision.parentA). src/collision/Collision.js:318 · Usages · Examples Collision.bodyB Body The second body part represented by the collision (see also collision.parentB). src/collision/Collision.js:325 · Usages · Examples Collision.collided Boolean A flag that indicates if the bodies were colliding when the collision was last updated. Default: false src/collision/Collision.js:310 · Usages · Examples Collision.depth Number A Number that represents the minimum separating distance between the bodies along the collision normal. Default: 0 src/collision/Collision.js:346 · Usages · Examples Collision.normal Vector A normalised Vector that represents the direction between the bodies that provides the minimum separating distance. Default: { x: 0, y: 0 } src/collision/Collision.js:355 · Usages · Examples Collision.pair Pair | Null A reference to the pair using this collision record, if there is one. Default: null src/collision/Collision.js:302 · Usages · Examples Collision.parentA Body The first body represented by the collision (i.e. collision.bodyA.parent). src/collision/Collision.js:332 · Usages · Examples Collision.parentB Body The second body represented by the collision (i.e. collision.bodyB.parent). src/collision/Collision.js:339 · Usages · Examples Collision.penetration Vector A Vector that represents the direction and depth of the collision. Default: { x: 0, y: 0 } src/collision/Collision.js:371 · Usages · Examples Collision.supportCount Number The number of active supports for this collision found in collision.supports. Note: Only the first collision.supportCount items of collision.supports are active. Therefore use collision.supportCount instead of collision.supports.length when iterating the active supports. Default: 0 src/collision/Collision.js:392 · Usages · Examples Collision.supports Vector[] An array of body vertices that represent the support points in the collision. Note: Only the first collision.supportCount items of collision.supports are active. Therefore use collision.supportCount instead of collision.supports.length when iterating the active supports. These are the deepest vertices (along the collision normal) of each body that are contained by the other body's vertices. Default: [] src/collision/Collision.js:379 · Usages · Examples Collision.tangent Vector A normalised Vector that is the tangent direction to the collision normal. Default: { x: 0, y: 0 } src/collision/Collision.js:363 · Usages · Examples 0.20.0 · MIT License · Readme"
