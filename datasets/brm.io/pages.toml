or in world-space unless `relative` is set, in which case it is a translation. * The centre of mass is the point the body rotates about and can be used to simulate non-uniform density. * This is equal to moving `body.position` but not the `body.vertices`. * Invalid if the `centre` falls outside the body's convex hull. * @method setCentre * @param {body} body * @param {vector} centre * @param {bool} relative */ Body.setCentre = function(body, centre, relative) { if (!relative) { body.positionPrev.x = centre.x - (body.position.x - body.positionPrev.x); body.positionPrev.y = centre.y - (body.position.y - body.positionPrev.y); body.position.x = centre.x; body.position.y = centre.y; } else { body.positionPrev.x += centre.x; body.positionPrev.y += centre.y; body.position.x += centre.x; body.position.y += centre.y; } }; /** * Sets the position of the body. By default velocity is unchanged. * If `updateVelocity` is `true` then velocity is inferred from the change in position. * @method setPosition * @param {body} body * @param {vector} position * @param {boolean} [updateVelocity=false] */ Body.setPosition = function(body, position, updateVelocity) { var delta = Vector.sub(position, body.position); if (updateVelocity) { body.positionPrev.x = body.position.x; body.positionPrev.y = body.position.y; body.velocity.x = delta.x; body.velocity.y = delta.y; body.speed = Vector.magnitude(delta); } else { body.positionPrev.x += delta.x; body.positionPrev.y += delta.y; } for (var i = 0; i < body.parts.length; i++) { var part = body.parts[i]; part.position.x += delta.x; part.position.y += delta.y; Vertices.translate(part.vertices, delta); Bounds.update(part.bounds, part.vertices, body.velocity); } }; /** * Sets the angle of the body. By default angular velocity is unchanged. * If `updateVelocity` is `true` then angular velocity is inferred from the change in angle. * @method setAngle * @param {body} body * @param {number} angle * @param {boolean} [updateVelocity=false] */ Body.setAngle 