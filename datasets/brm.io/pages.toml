dy.inverseInertia = 1 / body.inertia; body.mass = mass; body.inverseMass = 1 / body.mass; body.density = body.mass / body.area; }; /** * Sets the density of the body. Mass and inertia are automatically updated to reflect the change. * @method setDensity * @param {body} body * @param {number} density */ Body.setDensity = function(body, density) { Body.setMass(body, density * body.area); body.density = density; }; /** * Sets the moment of inertia of the body. This is the second moment of area in two dimensions. * Inverse inertia is automatically updated to reflect the change. Mass is not changed. * @method setInertia * @param {body} body * @param {number} inertia */ Body.setInertia = function(body, inertia) { body.inertia = inertia; body.inverseInertia = 1 / body.inertia; }; /** * Sets the body's vertices and updates body properties accordingly, including inertia, area and mass (with respect to `body.density`). * Vertices will be automatically transformed to be orientated around their centre of mass as the origin. * They are then automatically translated to world space based on `body.position`. * * The `vertices` argument should be passed as an array of `Matter.Vector` points (or a `Matter.Vertices` array). * Vertices must form a convex hull. Concave vertices must be decomposed into convex parts. * * @method setVertices * @param {body} body * @param {vector[]} vertices */ Body.setVertices = function(body, vertices) { // change vertices if (vertices[0].body === body) { body.vertices = vertices; } else { body.vertices = Vertices.create(vertices, body); } // update properties body.axes = Axes.fromVertices(body.vertices); body.area = Vertices.area(body.vertices); Body.setMass(body, body.density * body.area); // orient vertices around the centre of mass at origin (0, 0) var centre = Vertices.centre(body.vertices); Vertices.translate(body.vertices, centre, -1); // update inertia while vertices are at origin (0, 0) Body.setInertia(body, Body._inertiaScale * Vertices.inertia(