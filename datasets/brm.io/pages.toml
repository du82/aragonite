full_description = '''Docs Documentation Getting started Examples Tutorials Guides Changelog Readme Info Demo Plugins Gallery Code Latest Build npm package Source Code License Community Issues Contributing CodePen Glitch CodeSandbox StackOverflow Twitter Instagram Matter.js is a 2D physics engine for the web github · docs · see demos → Rigid bodies Compound bodies Composite bodies Concave and convex hulls Physical properties (mass, area, density etc.) Restitution (elastic and inelastic collisions) Collisions (broad-phase, mid-phase and narrow-phase) Stable stacking and resting Conservation of momentum Friction and resistance Events Constraints Gravity Sleeping and static bodies See all features var sourceLinkRoot = "https://github.com/liabru/matter-tools/blob/master"; MatterTools.Demo.setExample = Matter.Common.chainPathAfter(MatterTools, "Demo.setExample", function(demo, example) { var world = demo.example.instance.engine.world; var render = demo.example.instance.render; var renderOptions = render.options; var bodies = Matter.Composite.allBodies(world); for (var i = 0; i < bodies.length; i += 1) { var body = bodies[i]; if (body.isStatic && body.label === "Rectangle Body") { body.render.fillStyle = "transparent"; body.render.lineWidth = 1; body.render.strokeStyle = "#cacaca"; } } var constraints = Matter.Composite.allConstraints(world); for (var i = 0; i < constraints.length; i += 1) { var constraint = constraints[i]; constraint.render.strokeStyle = "#ccc"; } renderOptions.background = "transparent"; renderOptions.wireframes = false; renderOptions.showDebug = false; renderOptions.showBroadphase = false; renderOptions.showBounds = false; renderOptions.showVelocity = false; renderOptions.showCollisions = false; renderOptions.showAxes = false; renderOptions.showPositions = false; renderOptions.showAngleIndicator = false; renderOptions.showIds = false; renderOptions.showShadows = false; renderOptions.showVertexNumbers = false; renderOptions.showConvexHulls = false; renderOptions.showInternalEdges = false; renderOptions.showSeparations = false; }); var demo = MatterTools.Demo.create({ inline: true, preventZoom: true, resetOnOrientation: false, startExample: true, toolbar: { title: "matter-js", reset: false, source: false, inspector: false, tools: false, fullscreen: false, exampleSelect: false }, examples: [ { name: "Newton's Cradle", id: "newtonsCradle", init: Example.newtonsCradle, sourceLink: sourceLinkRoot + "/newtonsCradle.js" }, { name: "Catapult", id: "catapult", init: Example.catapult, sourceLink: sourceLinkRoot + "/catapult.js" }, { name: "Double Pendulum", id: "doublePendulum", init: Example.doublePendulum, sourceLink: sourceLinkRoot + "/doublePendulum.js" }, { name: "Constraints", id: "constraints", init: Example.constraints, sourceLink: sourceLinkRoot + "/constraints.js" }, { name: "Cloth", id: "cloth", init: Example.cloth, sourceLink: sourceLinkRoot + "/cloth.js" }, { name: "Concave", id: "concave", init: Example.concave, sourceLink: sourceLinkRoot + "/concave.js" }, { name: "Wrecking Ball", id: "wreckingBall", init: Example.wreckingBall, sourceLink: sourceLinkRoot + "/wreckingBall.js" }, { name: "Bridge", id: "bridge", init: Example.bridge, sourceLink: sourceLinkRoot + "/bridge.js" }, { name: "Chains", id: "chains", init: Example.chains, sourceLink: sourceLinkRoot + "/chains.js" }, { name: "Avalanche", id: "avalanche", init: Example.avalanche, sourceLink: sourceLinkRoot + "/avalanche.js" }, { name: "Ball Pool", id: "ballPool", init: Example.ballPool, sourceLink: sourceLinkRoot + "/ballPool.js" } ] }); var canvasContainer = document.getElementById("canvas-container"); canvasContainer.appendChild(demo.dom.root); canvasContainer.style.opacity = "1"; var exampleIndex = 0; var interval; var startInterval = function() { interval = setInterval(function() { exampleIndex = (exampleIndex + 1) % demo.examples.length; MatterTools.Demo.setExample(demo, demo.examples[exampleIndex]); }, 2000); }; var stopInterval = function() { clearInterval(interval); }; canvasContainer.addEventListener("mousedown", stopInterval); canvasContainer.addEventListener("mouseup", startInterval); canvasContainer.addEventListener("touchstart", stopInterval); canvasContainer.addEventListener("touchend", startInterval); startInterval();'''
