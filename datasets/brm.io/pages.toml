full_description = "API Matter.Detector Methods Properties / Options Defined in: src/collision/Detector.js:1 The Matter.Detector module contains methods for efficiently detecting collisions between a list of bodies using a broadphase algorithm. Methods Matter.Detector._sortCompare(bodyA, bodyB) → Number private The comparison function used in the broadphase algorithm. Returns the signed delta of the bodies bounds on the x-axis. Parameters bodyA Body bodyB Body Returns Number The signed delta used for sorting src/collision/Detector.js:162 · Usages · Examples Matter.Detector.canCollide(filterA, filterB) → Bool Returns true if both supplied collision filters will allow a collision to occur. See body.collisionFilter for more information. Parameters filterA Object filterB Object Returns Bool true if collision can occur src/collision/Detector.js:147 · Usages · Examples Matter.Detector.clear(detector) Clears the detector including its list of bodies. Parameters detector Detector src/collision/Detector.js:42 · Usages · Examples Matter.Detector.collisions(detector) → Collision[] Efficiently finds all collisions among all the bodies in detector.bodies using a broadphase algorithm. Note: The specific ordering of collisions returned is not guaranteed between releases and may change for performance reasons. If a specific ordering is required then apply a sort to the resulting array. Parameters detector Detector Returns Collision[] collisions src/collision/Detector.js:52 · Usages · Examples Matter.Detector.create(options) → Detector Creates a new collision detector. Parameters options Object Returns Detector A new collision detector src/collision/Detector.js:16 · Usages · Examples Matter.Detector.setBodies(detector, bodies) Sets the list of bodies in the detector. Parameters detector Detector bodies Body[] src/collision/Detector.js:32 · Usages · Examples Properties / Options The following properties if specified below are for objects created by Matter.Detector.create and may be passed to it as options. Detector.bodies Body[] The array of Matter.Body between which the detector finds collisions. Note: The order of bodies in this array is not fixed and will be continually managed by the detector. Default: [] src/collision/Detector.js:181 · Usages · Examples Detector.collisions Collision[] The array of Matter.Collision found in the last call to Detector.collisions on this detector. Default: [] src/collision/Detector.js:190 · Usages · Examples Detector.pairs Pairs | Null Optional. A Matter.Pairs object from which previous collision objects may be reused. Intended for internal Matter.Engine usage. Default: null src/collision/Detector.js:197 · Usages · Examples 0.20.0 · MIT License · Readme"
