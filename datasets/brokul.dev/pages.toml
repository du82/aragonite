full_description = '''Multi-tenant ASP.NET Core App - connecting to tenant databaseThis article continues our series on multitenant ASP.NET Core applications, focusing on database connection configuration in an ASP.NET 8 application. Following our previous topics on tenant resolution and authentication, we will configure an in-memory database using Entity Framework (EF) Core. The article explores the scenario when each tenant has its own database.31 October 2024 Calculating availability based on App Insights logs with Azure CLIIn this blog post, I will describe how to calculate availability (SLA) based on logs generated for existing "Web Test" in Application Insights. We will use Azure CLI to get data from a given period and Powershell to perform simple math to get the availability percentage value.12 March 2023 Detecting the default browser font size in JavaScriptFrom an accessibility point of view, it's worth considering the default font size set in the user's browser. You can easily adjust your design to this value in CSS stylesheets using relative units like rem and em. There might be a situation where you need this value from the JavaScript context. How to get it?12 February 2022 Bash script to update all NuGet and NPM packages in a solutionIt's always worth being in sync with the most recent versions of libraries that you use. Naturally, it's true as long as these do not contain malicious code. In this article, you can find a simple, ready-to-use Bash script to update all NPM and NuGet packages within your .NET Core solution. Feel free to use it in your CI/CD.01 November 2021 Authentication cookie lifetime and sliding expiration in ASP.NET CoreHow to control authentication cookie lifetime, and why is sliding expiration potentially dangerous? This article contains an overview of this topic. It also shows the way to set absolute authentication cookie lifetime in ASP.NET Core.31 October 2021 Extending parent styles in Sass to handle component statesIt's a quite frequent case that some components like input fields have many states. It may look different according to some conditions. The classic example is an incorrect value in an input field which results in a red border. How to handle this in Sass?02 October 2021'''
