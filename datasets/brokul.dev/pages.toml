["https://brokul.dev/proxy-pattern-in-c-an-easy-way-to-extend-production-code"]
title = "Proxy pattern in C# - an easy way to extend production code"
description = "Proxy pattern is a clean way to extend production code without touching it. It's worth using it if you want to follow the open-close principle."
full_description = '''Proxy pattern in C# - an easy way to extend production codeAccording to open-close principle, code should be open for extensions but closed for modifications. In other words, you should avoid modifying production code unless it's really necessary. A proxy design pattern is one of the solutions to this problem.Bartłomiej Iskrzycki01 February 2021Examining production code For demo purposes, let's say that we have a web app and one of its modules is responsible for transactions. To clarify, it doesn't really matter what the transaction is. We assume that it's a simple object with Amount property and can be processed somehow. Below you can see ASP.NET Core 6 code. 1public class Startup2{3 public void ConfigureServices(IServiceCollection services)4 {5 services.AddTransient<ITransactionProccessor, TransactionProccessor>();6 }7 8 public void Configure(IApplicationBuilder app)9 {10 app.UseMiddleware<ClientCodeMiddleware>();11 }12}13 14public class ClientCodeMiddleware15{16 public ClientCodeMiddleware(RequestDelegate next) {}17 18 public async Task InvokeAsync(HttpContext context, ITransactionProccessor proccessor)19 {20 var transactionItem = new TransactionItem { Amount = 100 };21 var message = await proccessor.ProcessAsync(transactionItem);22 await context.Response.WriteAsync(message);23 }24}25 26public interface ITransactionProccessor27{28 Task<string> ProcessAsync(TransactionItem transactionItem);29}30 31public class TransactionProccessor : ITransactionProccessor32{33 public async Task<string> ProcessAsync(TransactionItem transactionItem)34 {35 // complex code responsible for processing...36 return "Transaction item has been processed!";37 }38}39 40public class TransactionItem41{42 public decimal Amount { get; set; }43}44 45public enum AcceptanceLevel46{47 Level1, Level2, Level348}C#Copy Then we execute this code, we get successful results in the web browser. Using proxy pattern Now we want to extend this code but we should not modify TransactionProccessor. First of all, in order to achieve this let's create a proxy class. It could also be named wrapper class. 1public class UserAwareTransactionProccessor : ITransactionProccessor2{3 private readonly ITransactionProccessor _transactionProccessor;4 5 public UserAwareTransactionProccessor(ITransactionProccessor transactionProccessor)6 {7 _transactionProccessor = transactionProccessor;8 }9 10 public async Task ProcessAsync(TransactionItem transactionItem)11 {12 await _transactionProccessor.ProcessAsync(transactionItem);13 }14}C#Copy Currently, it does no more than delegate to internal ITransactionProccessor which is wrapped. But at this stage, you might have noticed that it enables us to write some extra logic. We could do it before or after the execution of the wrapped method. Let's say that only users with AcceptanceLevel set to Level2 can invoke this action. We need some kind of user provider to get this data. 1public class UserAwareTransactionProccessor : ITransactionProccessor2{3 private readonly ITransactionProccessor _transactionProccessor;4 private readonly IUserContext _userContext;5 6 public UserAwareTransactionProccessor(7 ITransactionProccessor transactionProccessor,8 IUserContext userContext)9 {10 _transactionProccessor = transactionProccessor;11 _userContext = userContext;12 }13 14 public async Task<string> ProcessAsync(TransactionItem transactionItem)15 {16 if (_userContext.CurrentUser.AcceptanceLevel < AcceptanceLevel.Level2)17 {18 return "Current user has not sufficient privileges";19 }20 21 return await _transactionProccessor.ProcessAsync(transactionItem);22 }23}24 25public interface IUserContext26{27 AppUser CurrentUser { get; }28}29 30public class UserContext : IUserContext31{32 public AppUser CurrentUser => new() { AcceptanceLevel = AcceptanceLevel.Level1 };33}C#Copy For simplicity, we hardcoded AppUser which is returned by UserContext. In the real world, that would be, for instance, a user taken from a cookie stored in a request. Then we check if AppUser has sufficient AcceptanceLevel. The last step is to register UserContext and replace implementation for ITransactionProccessor in the dependency container. Registering proxy class in dependency container In order to register proxy class for TransactionProccessor, firstly we register TransactionProccessor itself. Then we register UserAwareTransactionProccessor under ITransactionProccessor interface. In the factory method, we resolve needed services and create instances of UserAwareTransactionProccessor class. 1public void ConfigureServices(IServiceCollection services)2{3 services.AddTransient<IUserContext, UserContext>();4 services.AddTransient<TransactionProccessor>();5 services.AddTransient<ITransactionProccessor, UserAwareTransactionProccessor>(serviceProvider =>6 {7 var userContext = serviceProvider.GetRequiredService<IUserContext>();8 var transactionProccessor = serviceProvider.GetRequiredService<TransactionProccessor>();9 return new UserAwareTransactionProccessor(transactionProccessor, userContext);10 });11}C#Copy Now we can execute our code and receive the expected result. And that’s it 🎉! As you can see, we registered UserAwareTransactionProccessor by creating an instance of this class and resolving needed dependencies. In this case that was UserContext and wrapped TransactionProccessor. Depending on the container you use, proxy registration might be different. ASP.NET Core provides a simple dependency container. In comparison to third-party libraries (like Autofac or Ninject), it does not have advanced options. For instance, some libraries enable conditional injection and give us context object with more details about the current request. You can find the source code used in this post here. Conclusion The proxy pattern is quite easy to use and enables us to add some functionality to living code with respect to the open-closed principle. In case of emergency, we can always replace implementation on the container level. We revert this way all our changes. Unfortunately, the proxy pattern is not always the best option. Imagine that after some time someone adds one or more additional proxy class that wraps UserAwareTransactionProccessor. As a result, you can end up with many layers that depend on one another. Debugging such cases is usually a living nightmare. Depending on the architecture of your code, it’s worth remembering not to overuse this pattern.Tagged: Design patterns, C#, .NETCommentsAdd commentThe comments system is based on GitHub Issues API. Once you add your comment to the linked issue on my GitHub repository, it will show up below.'''
