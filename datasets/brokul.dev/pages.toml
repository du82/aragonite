["https://brokul.dev/multi-tenant-asp-net-core-app-tenant-resolution"]
title = "Multi-tenant ASP.NET Core app - tenant resolution"
description = "In this series, we'll create a multi-tenant ASP.NET Core app. This article concentrates on the tenant resolution mechanism."
full_description = '''Multi-tenant ASP.NET Core app - tenant resolutionPart 1 of 3A multitenancy is a way to handle multiple tenants on a common infrastructure. Depending on your case, tenants may share the application itself, database, or other services. In this series, we will create ASP.NET Core multi-tenant app. This article describes a tenant resolution mechanism.Parts of the seriesPart 1: Tenant resolutionPart 2: Configuring authenticationPart 3: Connecting to tenant databaseBartłomiej Iskrzycki08 February 2021Primary goals You can download the final solution from my GitHub to follow along. This solution in based on ASP.NET Core 8. Our goals: The solution should be lightweight. We don't want to interfere with the framework. On a request level, we know within which tenant it’s made. The tenant name is included in the first segment of the URL. For instance, https://myapp.local/helloworld would give helloworld as a tenant name. Everything after the first segment should lead us to the given app route. For example, https://myapp.local/helloworld/account will route us to AccountController for HelloWorld tenant. Tenants will not have separated dependency container scopes. We should be able to get tenant-specific settings. User authenticated within tenant1 should not be a valid user for tenant2 (it will be done in part 2). The shared dependency container scope may sound controversial in this case. When we inject a service registered as a singleton to tenant1, we will inject the same instance for tenant2's request. From my experience, "tenant singletons" which need to store some kind of state are not frequent. Usually, you can handle it by using internal ConcurrentDictionary with appropriate key-value pairs per tenant. Creating tenant context Firstly, let's start with creating the TenantContext class. It will be a simple object that holds the tenant's data and settings. We will also expose two separate interfaces responsible for getting and setting the current tenant. Why? Because we will only set up the tenant once during the request lifetime (using ITenantSetter). Everywhere else, we will use an interface named ITenantContext that allows getting the current tenant without the possibility to change it. 1public interface ITenantContext2{3 Tenant CurrentTenant { get; }4}5 6public interface ITenantSetter7{8 Tenant CurrentTenant { set; }9}10 11public class TenantContext : ITenantContext, ITenantSetter12{13 public Tenant CurrentTenant { get; set; }14}15 16public class Tenant(string name)17{18 public string Name { get; set; } = name;19}C#Copy Secondly, we need to register it in a dependency container. This solution uses a built-in ASP.NET Core container that is completely sufficient for this case. To use the same instance of the TenantContext object within the given request, we need to register it with scoped (request) lifetime. What is tricky here is that the same instance needs to be registered under two different interfaces: ITenantContext and ITenantSetter. 1public static class ServiceCollectionExtensions2{3 public static IServiceCollection AddMultitenancy(this IServiceCollection services)4 {5 services.AddScoped<TenantContext>();6 7 services.AddScoped<ITenantContext>(provider =>8 provider.GetRequiredService<TenantContext>());9 10 services.AddScoped<ITenantSetter>(provider =>11 provider.GetRequiredService<TenantContext>());12 13 return services;14 }15}C#Copy After that, we invoke the AddMultitenancy extension method in the Program.cs. We can also register controllers with views with MapControllerRoute (for later). The UseStaticFiles middleware is used to mitigate resolving favicon.ico as a tenant name. 1// Program.cs2 3var builder = WebApplication.CreateBuilder(args);4 5var services = builder.Services;6 7services.AddControllersWithViews();8services.AddMultitenancy();9 10var app = builder.Build();11 12app.UseDeveloperExceptionPage();13app.UseStaticFiles();14app.UseRouting();15app.MapControllerRoute(16 name: "default",17 pattern: "{controller=Home}/{action=Index}");C#Copy Implementing tenant store Subsequently, we need a tenants store. It will be a service that returns a Tenant object based on the tenant's name. We will hardcode two tenants for demo purposes. Note that the logic inside this method can be quite complex and depends on where you store your tenants' configuration. It could be a database, JSON file, or dedicated resource on a cloud. I use Azure App Configuration to store tenants’ configurations. It is also a place to add tenant-specific configuration by extending the Tenant class with additional properties. 1public interface ITenantStore2{3 Tenant GetTenant(string tenandId);4}5 6public class TenantStore : ITenantStore7{8 public Tenant GetTenant(string tenandId)9 {10 return tenandId switch11 {12 "tenant1" => new("tenant1"),13 "tenant2" => new("tenant2"),14 _ => null15 };16 }17}C#Copy Let’s register it in the dependency container within the AddMultitenancy method. 1public static class ServiceCollectionExtensions2{3 public static IServiceCollection AddMultitenancy(this IServiceCollection services)4 {5 services.AddScoped<TenantContext>();6 7 services.AddScoped<ITenantContext>(provider =>8 provider.GetRequiredService<TenantContext>());9 10 services.AddScoped<ITenantSetter>(provider =>11 provider.GetRequiredService<TenantContext>());12 13 services.AddScoped<ITenantStore, TenantStore>();14 return services;15 }16}C#Copy Resolving tenant per request We need to set the tenant in TenantContext in the HTTP pipeline. Let’s create custom middleware with tenant resolution logic. It gets the first segment of the request URL (from the Host header), invokes ITenantStore to get Tenant the object, and sets it within TenantContext using the ITenantSetter interface (it is an abstraction over TenantContext). If the tenant is not found, the app returns a 404 code. When we get the tenant object we also set PathBase and Path properties on the HttpRequest object. After that, for instance, https://myapp.local/helloworld is considered a "root path" for other routes. Note that Middlewares in ASP.NET Core are registered as singletons! Therefore ITenantSetter and ITenantStore are injected as arguments of the Invoke method, not via the constructor. 1public class TenantResolutionMiddleware(RequestDelegate next)2{3 public async Task Invoke(4 HttpContext context, ITenantSetter tenantSetter, ITenantStore tenantStore)5 {6 (string tenantName, string realPath) = GetTenantAndPathFrom(context.Request);7 8 var tenant = tenantStore.GetTenant(tenantName);9 10 if (tenant == null)11 {12 context.Response.StatusCode = 404;13 return;14 }15 16 context.Request.PathBase = $"/{tenantName}";17 context.Request.Path = realPath;18 tenantSetter.CurrentTenant = tenant;19 20 await next(context);21 }22 23 private static (string tenantName, string realPath)24 GetTenantAndPathFrom(HttpRequest httpRequest)25 {26 // example: https://localhost/tenant1 -> gives tenant127 var tenantName = new Uri(httpRequest.GetDisplayUrl())28 .Segments29 .FirstOrDefault(x => x != "/")30 ?.TrimEnd('/');31 32 if (!string.IsNullOrWhiteSpace(tenantName) &&33 httpRequest.Path.StartsWithSegments($"/{tenantName}",34 out PathString realPath))35 {36 return (tenantName, realPath);37 }38 39 return (null, null);40 }41}C#Copy The TenantResolutionMiddleware needs to be between UseRouting and UseStaticFiles in the Program.cs file. I suppose that we have no choice! 😄 1app.UseDeveloperExceptionPage();2app.UseStaticFiles();3app.UseMiddleware<TenantResolutionMiddleware>();4app.UseRouting();5 6app.MapControllerRoute(7 name: "default",8 pattern: "{controller=Home}/{action=Index}");C#Copy Let’s try our solution For demo purposes, I created a simple HomeController. The TenantContext is injected there via its constructor. Then in the Index method, we get the tenant’s name and return it as a response content. 1public class HomeController(ITenantContext tenantContext) : Controller2{3 [HttpGet]4 public ActionResult Index()5 {6 var tenantName = tenantContext.CurrentTenant.Name;7 return Content($"Tenant: '{tenantName}'");8 }9}C#Copy To invoke the Index action, we run the application and open URLs like https://localhost:5001/tenant1 or https://localhost:5001/tenant2. It routes to HomeController. Here are the results: Conclusion To sum up, in this article we created foundations of multi-tenant application with a simple tenant resolution mechanism. Tenants are resolved by the first segment of the request URL. Their "context" is available within request's lifetime. In the next part of this series, we will configure cookie-based authentication. While using this resolution strategy, you may encounter problems with static files. Consider request URL like https://localhost:5001/favicon.ico. In our solution, we added UseStaticFiles before TenantResolutionMiddleware so favicon.ico is not considered as a tenant name. In your app, you need to prepare your HTTP pipeline carefully and predict all cases like this. Go to part 2 – configuring authenticationTagged: Multitenancy, ASP.NET Core, .NETCommentsAdd commentThe comments system is based on GitHub Issues API. Once you add your comment to the linked issue on my GitHub repository, it will show up below.'''
