["https://brokul.dev/detecting-the-default-browser-font-size-in-javascript"]
title = "Detecting the default browser font size in JavaScript"
description = "This article describes how to get the default font size configured in the user browser using JavaScript."
full_description = '''Detecting the default browser font size in JavaScriptFrom an accessibility point of view, it's worth considering the default font size set in the user's browser. You can easily adjust your design to this value in CSS stylesheets using relative units like rem and em. There might be a situation where you need this value from the JavaScript context. How to get it?Bartłomiej Iskrzycki12 February 2022The idea The default font size in most web browsers equals 16px. This value is used in font-size property of the root element on every website. If you change it in the browser settings, it's changed there as well. Sorry, your browser doesn't support embedded videos. It's true as long as the default font size is bigger than the minimum font size. Note that the root element font size can't be smaller than the minimum value set in the browser settings. In the example below, we try to set the default font size to a value smaller than the minimum (14px). Below this threshold, it has no impact on the html font size. Sorry, your browser doesn't support embedded videos. That's why we cannot rely on the font-size property of the html element to detect the default browser font size. It may be affected by the user-defined minimum font size. Fortunately, the minimum font size setting only impacts the fonts. It does not have any effect on paddings, widths, or heights with relative units. Have a look at the example below. Sorry, your browser doesn't support embedded videos. The idea is to utilize the rem unit in conjunction with the width CSS property on the dynamically created hidden div element. In this case, the calculated width value will be linearly dependent on the default browser font size. The solution depends on the custom font-size property set on the html element. We will consider a few cases: Case 1 - font-size property not set on the html element Case 2 - font-size with relative value set on the html element Case 3 - font-size with absolute value set on the html element Case 1 - font size not set on the root element We assume here that the html element has no custom font-size. 1html {2 font-size: unset;3}CSSCopy In the code snippet below, we dynamically create the hidden div element with width CSS property set to 1rem. Then we grab the computed width in pixels and convert it to a number. I tend to include some additional checks, but you can adjust the code to your needs. 1const getDefaultFontSize = () => {2 const element = document.createElement('div');3 element.style.width = '1rem';4 element.style.display = 'none';5 document.body.append(element);6 7 const widthMatch = window8 .getComputedStyle(element)9 .getPropertyValue('width')10 .match(/\d+/);11 12 element.remove();13 14 if (!widthMatch || widthMatch.length < 1) {15 return null;16 }17 18 const result = Number(widthMatch[0]);19 return !isNaN(result) ? result : null;20};JavaScriptCopy Once invoked in the developer tools console on the empty browser tab, we get the expected value 🎉. Case 2 - Relative font size on the root element It's common to set the relative font-size on the html element mostly if you use relative units in CSS stylesheets. Consider the example below. 1html {2 font-size: 62.5%;3}CSSCopy It's the trick frequently used to have a good baseline when using rem unit in CSS. With solution from the "case 1" in place, if the browser font size equals 16px then the getDefaultFontSize returns 10. That's because 16px * 0.625 = 10px. After changing the default browser font size to 20px the getDefaultFontSize returns 12. What does it mean for us? The result still linearly depends on the user's settings. To "reproduce" the original browser font size, we need to divide the result by the factor that reduced it before, in this case, 0.625. The previous regex does not expect decimal values as 16px \* 0.625 = 10.625, so it needs to be fixed as well. 1const getDefaultFontSize = () => {2 const element = document.createElement('div');3 element.style.width = '1rem';4 element.style.display = 'none';5 document.body.append(element);6 7 const widthMatch = window8 .getComputedStyle(element)9 .getPropertyValue('width')10 .match(/^(\d*\.?\d*)px$/);11 12 element.remove();13 14 if (!widthMatch || widthMatch.length < 1) {15 return null;16 }17 18 const result = Number(widthMatch[1]);19 return !isNaN(result) ? result / 0.625 : null;20};JavaScriptCopy With this in place with 16px as a browser font size we get 16px from the getDefaultFontSize function ✌. Numbers are a tricky topic in Javascript when it comes to multiplying and dividing. This code works with font-size: 62.5%, but if you use a more exotic factor, Javascript numbers operations might return weird results. In this case, consider using the dedicated library for numbers like big.js. Case 3 - Absolute font size (px) on the root element You won't be able to leverage the computed style on the dynamically created div elment if you've got the absolute font size set on the root. Consider the example below. 1html {2 font-size: 10px;3}CSSCopy The computed font-size property, in this case, is fixed, and the browser settings changes won't have any impact on this. If we set the width property of the div to 1rem it will always be 10px. With getDefaultFontSize function from the "case 1" it will return 10px independently from the browser settings 😕. It would be possible to unset the font-size on the html element before getting the width of the dynamically created div element. We could set it to the initial value after that. I would highly recommend NOT going this way because it might cause layout shifts. 1// THIS SOLUTION IS NOT SUGGESTED2const getDefaultFontSize = () => {3 const html = document.querySelector('html');4 5 const initialFontSize = window6 .getComputedStyle(html)7 .getPropertyValue('font-size');8 9 html.style.fontSize = 'unset';10 11 const element = document.createElement('div');12 element.style.width = '1rem';13 element.style.display = 'none';14 document.body.append(element);15 16 const widthMatch = window17 .getComputedStyle(element)18 .getPropertyValue('width')19 .match(/\d+/);20 21 html.style.fontSize = initialFontSize;22 element.remove();23 24 if (!widthMatch || widthMatch.length < 1) {25 return null;26 }27 28 const result = Number(widthMatch[0]);29 return !isNaN(result) ? result : null;30};JavaScriptCopy Honestly, the better approach would be to not set the font-size on the root element at all 😅. Conclusion You can easily get the default browser font size from JavaScript. The presented solutions work fine with no font-size property set on the html or font-size with relative units. I would not recommend it if you overwrite the font-size property on the root element with absolute units. Do users use different default font sizes? Yes, they do, rarely, but they do! It's worth respecting their settings. Questions or problems? Write the comment below!Tagged: Front-endCommentsAdd commentThe comments system is based on GitHub Issues API. Once you add your comment to the linked issue on my GitHub repository, it will show up below.'''
