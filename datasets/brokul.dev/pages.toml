["https://brokul.dev/multi-tenant-asp-net-core-app-connecting-to-tenant-database"]
title = "Multi-tenant ASP.NET Core App - connecting to tenant database"
description = "This article focuses on configuring database connections in an ASP.NET 8 multitenant application using EF Core, exploring separate per-tenant database scenario."
full_description = '''Multi-tenant ASP.NET Core App - connecting to tenant databasePart 3 of 3This article continues our series on multitenant ASP.NET Core applications, focusing on database connection configuration in an ASP.NET 8 application. Following our previous topics on tenant resolution and authentication, we will configure an in-memory database using Entity Framework (EF) Core. The article explores the scenario when each tenant has its own database.Parts of the seriesPart 1: Tenant resolutionPart 2: Configuring authenticationPart 3: Connecting to tenant databaseBartłomiej Iskrzycki31 October 2024We are going to extend the code based on the solution from the the previous article. You can follow along by downloading the whole project from my GitHub repository. This solution in based on ASP.NET Core 8. Assumptions We will operate under the following assumptions: Entity Framework Core will be utilized to connect to an in-memory database. Each tenant will have its own isolated in-memory database instance, ensuring data segregation and independence. Preparing the first entity and database context We begin by creating an entity named AppUser. For simplicity, this entity will have only two properties: Id and Name, omitting any password or authentication-related fields. 1public class AppUser2{3 public int Id { get; init; }4 public string Name { get; init; }5}C#Copy Next, we define a TenantDbContext, which will serve as the database context for accessing the current tenant's database. This context includes a DbSet<AppUser> to manage AppUser entities within the current tenant's data scope. 1public class TenantDbContext(DbContextOptions options) : DbContext(options)2{3 public DbSet<AppUser> AppUsers { get; init; }4}C#Copy Seeding data on application startup First of all, we need the Microsoft.EntityFrameworkCore.InMemory package in our project. Let's start from installing it with this command: 1dotnet add Microsoft.EntityFrameworkCore.InMemoryCommandCopy Now, we create a DatabaseSeeder, a static class that will be invoked during the application startup to seed an in-memory database. This seeding process will be performed for both tenant1 and tenant2, with each tenant having two users. It is important to note that the DatabaseSeeder is intended solely for demonstration purposes and should not be used in a production environment! 1public static class DatabaseSeeder2{3 public static void Seed()4 {5 SeedInternal("tenant1", new List<AppUser>6 {7 new() { Name = "Mike" },8 new() { Name = "Bartek" }9 });10 11 SeedInternal("tenant2", new List<AppUser>12 {13 new() { Name = "Per" },14 new() { Name = "Thomas" }15 });16 }17 18 private static void SeedInternal(string tenantId, List<AppUser> appUsers)19 {20 var options = new DbContextOptionsBuilder().UseInMemoryDatabase(tenantId).Options;21 using var context = new TenantDbContext(options);22 context.AppUsers.AddRange(appUsers);23 context.SaveChanges();24 }25}C#Copy After this, we invoke the Seed method immediately after building the application. This action populates the in-memory database with the predefined data, which will be accessible later during the application's execution. This approach ensures that each tenant has its own set of users available from the start. 1var builder = WebApplication.CreateBuilder(args);2 3var services = builder.Services;4 5services.AddHttpContextAccessor();6services.AddControllersWithViews();7services.AddMultitenancy();8services.AddMultitenantAuthentication();9 10var app = builder.Build();11 12// Only for demo purposes!13DatabaseSeeder.Seed();14 15app.UseDeveloperExceptionPage();16app.UseStaticFiles();17app.UseMiddleware<TenantResolutionMiddleware>();18app.UseRouting();19app.UseAuthentication();20app.UseAuthorization();21 22app.MapControllerRoute(23 name: "default",24 pattern: "{controller=Home}/{action=Index}");25 26app.Run();C#Copy Registaring tenant database context Next we register a database context factory using the AddDbContextFactory method, which is responsible for creating a scoped TenantDbContext object based on the current tenant. It is crucial that the TenantDbContext is scoped to ensure that each request has its own context instance. Under the hood, the framework utilizes the DbContextFactory to instantiate the TenantDbContext based on a tenant available in the TenantContext object. While we are using an in-memory database for demonstration purposes, in a real-world application, this could be a SQL Server or other database, where you would retrieve the tenant's database connection string based on the tenant's name. 1// DbContextRegistrationExtensions.cs2 3public static class ServiceCollectionExtensions4{5 public static IServiceCollection AddTenantAwareDbContext(this IServiceCollection services)6 {7 services.AddDbContextFactory<TenantDbContext>((provider, optionsBuilder) =>8 {9 var tenantContext = provider.GetRequiredService<TenantContext>();10 var tenantName = tenantContext.CurrentTenant.Name;11 12 optionsBuilder.UseInMemoryDatabase(tenantName);13 // alternatively get tenant database connection string and invoke UseSqlServer()14 }, ServiceLifetime.Scoped);15 16 return services;17 }18}C#Copy We then invoke the AddTenantAwareDbContext method in Program.cs during the application startup. From this point forward, the tenant database context is configured, allowing us to inject it into our controllers or other services as needed. 1var builder = WebApplication.CreateBuilder(args);2 3var services = builder.Services;4 5services.AddHttpContextAccessor();6services.AddControllersWithViews();7services.AddMultitenancy();8services.AddMultitenantAuthentication();9services.AddTenantAwareDbContext();10 11// ...C#Copy Logging in as a user existing in the tenant database We will extend the existing AccountController by injecting the TenantDbContext into it. This allows us to utilize the database context within the Login method to retrieve a user based on the username provided in the login form we created in a previous article. By querying the TenantDbContext, we ensure that the login process is tenant-specific, verifying the user's existence within the current tenant's database. 1public class AccountController(2 ITenantContext tenantContext, TenantDbContext dbContext) : Controller3{4 [HttpGet]5 public ActionResult Login([FromQuery] string returnUrl)6 {7 return View(new LoginViewModel8 {9 ReturnUrl = returnUrl10 });11 }12 13 [HttpPost]14 [AutoValidateAntiforgeryToken]15 public async Task<ActionResult> Login([FromForm] LoginViewModel viewModel)16 {17 var appUser = dbContext.AppUsers18 .SingleOrDefault(x => x.Name == viewModel.UserName);19 20 if (appUser == null)21 {22 throw new UnauthorizedAccessException(23 $"User '{viewModel.UserName}' does not exist!");24 }25 26 var claims = new List<Claim>27 {28 new("UserName", appUser.Name)29 };30 31 var identity = new ClaimsIdentity(32 claims, CookieAuthenticationDefaults.AuthenticationScheme);33 34 var claimsPrincipal = new ClaimsPrincipal(identity);35 36 await HttpContext.SignInAsync(37 CookieAuthenticationDefaults.AuthenticationScheme, claimsPrincipal);38 39 return Redirect(viewModel.ReturnUrl ?? $"/{tenantContext.CurrentTenant.Name}");40 }41 42 // ...43}C#Copy Reading app users Let's also enhance the UI by displaying all users associated with the current tenant after logging in! To do this we extend the HomeController by injecting the TenantDbContext object. This allows us to retrieve all users from the current tenant's database and include them in the HomeViewModel. 1[Authorize]2public class HomeController(3 ITenantContext tenantContext,4 TenantDbContext dbContext) : Controller5{6 [HttpGet]7 public ActionResult Index()8 {9 var loggedUserName = User.Claims.Single(x => x.Type == "UserName").Value;10 var tenantName = tenantContext.CurrentTenant.Name;11 12 var appUsers = dbContext.AppUsers.ToList();13 14 return View(new HomeViewModel15 {16 Message = $"User '{loggedUserName}' is logged on tenant '{tenantName}'",17 AppUsers = appUsers18 });19 }20}21 22public class HomeViewModel23{24 public required string Message { get; init; }25 public required List<AppUser> AppUsers { get; init; }26}C#Copy We then display the list of users in a foreach loop within the view. 1@model MultitenantAspNetCoreApp.Controllers.HomeViewModel2 3<div>@Model.Message</div>4 5<div>6 All users available for this tenant:7 <ul>8 @foreach (var appUser in Model.AppUsers)9 {10 <li>@appUser.Name</li>11 }12 </ul>13</div>14 15<form asp-controller="Account" asp-action="Logout" method="get">16 <button>Logout</button>17</form>HTMLCopy Testing our solution Ok, let’s try this out! First, we try to log in to tenant1 with a non-existing user. Based on our logic in this scenario we should get an exception. When we try to log in as a user that exists in a given tenant database then everything works fine. Furthermore, now we show all other users for this tenant on a UI. Now, let's try to log in to tenant2 as an existing user. Again, all users are displayed for this tenant but this time from another database. When we go back to tenant1 in a browser tab we're still logged and different data is displayed. Conclusion In this article, we extended our multi-tenant application by implementing a mechanism to log in users based on their existence in a tenant-specific database. We achieved this by injecting the TenantDbContext into our controllers, allowing us to authenticate users and display all users associated with the current tenant. Although we utilized an in-memory database for demonstration purposes, this solution is adaptable to any database type by retrieving the appropriate tenant connection string and configuring the corresponding database connection. This approach ensures that our application remains flexible and scalable, capable of supporting various database technologies while maintaining tenant data isolation.Tagged: Multitenancy, ASP.NET Core, .NET, EF CoreCommentsAdd commentThe comments system is based on GitHub Issues API. Once you add your comment to the linked issue on my GitHub repository, it will show up below.'''
