title = "Multi-tenant ASP.NET Core app - configuring authentication"
description = "In this article, we're going to configure multitenant authentication. This is part of series about multitenant ASP.NET Core 8 application."
full_description = '''Multi-tenant ASP.NET Core app - configuring authenticationPart 2 of 3In this article, we will set up multi-tenant authentication. How is it supposed to work? When a user is logged in within tenant1 then they will not be a valid user from the tenant2 point of view. We will use cookie-based authentication for that.Parts of the seriesPart 1: Tenant resolutionPart 2: Configuring authenticationPart 3: Connecting to tenant databaseBartłomiej Iskrzycki17 February 2021We are going to extend the code based on the solution from the previous article. Obviously, you can follow along by downloading the whole project from my GitHub. This solution in based on ASP.NET Core 8. Preparing basic sign-in mechanism First of all, let’s create a very basic login form (Login.cshtml). It sends POST requests to Login action on AccountController. The view’s model is of the type LoginViewModel and contains UserName, Password, and ReturnUrl properties. 1@model MultitenantWebApp.LoginViewModel2 3<div>Please login</div>4 5<form asp-controller="Account" asp-action="Login" method="post">6 <input type="hidden" asp-for="ReturnUrl"/>7 <div>8 Login: <input type="text" asp-for="UserName"/>9 </div>10 <div>11 Password: <input type="password" asp-for="Password"/>12 </div>13 <input type="submit" value="Login"/>14</form>HTMLCopy 1public class LoginViewModel2{3 public string UserName { get; set; }4 public string Password { get; set; }5 public string ReturnUrl { get; set; }6}C#Copy Now we need to implement AccountController. It has Login action that can be invoked with GET or POST requests. GET Login returns Login view, POST Login creates ClaimsPrincipal object based on ViewModel. For simplicity, there is no user’s credentials validation mechanism. In other words, all usernames and passwords are valid (very secure 😄!). This is the place where you can add your own validation logic. After successfully signing in, the application redirects the user to the tenant base URL. Unfortunately Redirect("/") won’t cooperate with PathBase which is set in TenantResolutionMiddleware. That’s one of the drawbacks of this resolution strategy. There’s also Logout a method that deletes a user’s cookie. 1public class AccountController(ITenantContext tenantContext) : Controller2{3 [HttpGet]4 public ActionResult Login([FromQuery] string returnUrl)5 {6 return View(new LoginViewModel7 {8 ReturnUrl = returnUrl9 });10 }11 12 [HttpPost]13 [AutoValidateAntiforgeryToken]14 public async Task<ActionResult> Login([FromForm] LoginViewModel viewModel)15 {16 var claims = new List<Claim>17 {18 new("UserName", viewModel.UserName)19 };20 21 var identity = new ClaimsIdentity(22 claims, CookieAuthenticationDefaults.AuthenticationScheme);23 24 var claimsPrincipal = new ClaimsPrincipal(identity);25 26 await HttpContext.SignInAsync(27 CookieAuthenticationDefaults.AuthenticationScheme, claimsPrincipal);28 29 return Redirect(viewModel.ReturnUrl ?? $"/{tenantContext.CurrentTenant.Name}");30 }31 32 [HttpGet]33 public async Task<ActionResult> Logout()34 {35 await HttpContext.SignOutAsync();36 return RedirectToAction("Login");37 }38}C#Copy In HomeController we also need to modify Index method so it returns logged user’s information. Note that this controller is also decorated with AuthorizeAttribute. As a result, only users that have signed in are able to invoke actions here. 1[Authorize]2public class HomeController(ITenantContext tenantContext) : Controller3{4 [HttpGet]5 public ActionResult Index()6 {7 var loggedUserName = User.Claims.Single(x => x.Type == "UserName").Value;8 var tenantName = tenantContext.CurrentTenant.Name;9 10 return View(new HomeViewModel11 {12 Message = $"User '{loggedUserName}' is logged on tenant '{tenantName}'"13 });14 }15}16 17public class HomeViewModel18{19 public required string Message { get; init; }20}C#Copy Resolving cookie options In order to make it work correctly and securely, we need to resolve tenant-specific cookie options per request. In this scenario, it will be a cookie name and data protection, provider. The last one is needed to hold the user back from decrypting another tenant's cookie. Our flow works like this: Authentication handler requests CookieAuthenticationOptions object. For that purpose it uses IOptionMonitor. IOptionMonitor invokes Create method on IOptionsFactory. IOptionsFactory creates options object and after that invokes Configure method on IConfigureNamedOptions. IConfigureNamedOptions sets tenant specific options. In this solution, we are going to register our own implementation of IOptionsMonitor and IConfigureNamedOptions. Let’s start from the end – IConfigureNamedOptions. It takes IHttpContextAccessor and enigmatic Action in a constructor. This action is a delegate that will be set on the dependency container level. In Configure method, apart from validating some stuff, we just call injected Action. There is also an overload for Configure method which is required by IConfigureNamedOptions interface. Options factory won’t use it so for simplicity it just delegates to the appropriate Configure method with Options.DefaultName which is an empty string. You can see the source code of OptionsFactory here. 1public class CookieConfigureNamedOptions(2 IHttpContextAccessor httpContextAccessor,3 Action<CookieAuthenticationOptions, HttpContext> configureAction)4 : IConfigureNamedOptions<CookieAuthenticationOptions>5{6 public void Configure(string name, CookieAuthenticationOptions options)7 {8 if (!string.Equals(name,9 CookieAuthenticationDefaults.AuthenticationScheme,10 StringComparison.Ordinal))11 {12 return;13 }14 15 var httpContext = httpContextAccessor?.HttpContext;16 17 if (httpContext == null)18 {19 throw new InvalidOperationException("HttpContext is not available.");20 }21 22 configureAction(options, httpContext);23 }24 25 public void Configure(CookieAuthenticationOptions options)26 => Configure(Options.DefaultName, options);27}C#Copy Now it’s time to implement IOptionsMonitor. The only responsibility of this is to call Create method on IOptionsFactory. We are going to register it as a singleton, so you can potentially add some kind of cache here (with keys per tenant). Because options instance is lightweight, we are not going to do this here, but feel free to adjust it to your needs. The reason why we register our own implementation of IOptionsMonitor is that we need to bypass the cache provided by the default implementation (see source code). It holds CookieAuthenticationOptions under the Cookies key, so every tenant would get the same configuration. 1public class CookieOptionsMonitor(2 IOptionsFactory<CookieAuthenticationOptions> optionsFactory)3 : IOptionsMonitor<CookieAuthenticationOptions>4{5 public CookieAuthenticationOptions CurrentValue => Get(Options.DefaultName);6 7 public CookieAuthenticationOptions Get(string name)8 {9 return optionsFactory.Create(name);10 }11 12 public IDisposable OnChange(Action<CookieAuthenticationOptions, string> listener) => null;13}C#Copy Registering cookie authentication handler In ServiceCollectionExtensions we can implement AddMultitenantAuthentication method which registers cookie authentication handler. This method also invokes AddPerRequestCookieOptions that contains registration of IOptionsMonitor and IConfigureOptions. As an argument, we provide a delegate that configures tenant-specific cookie options. It sets the cookie name and data protection provider. As a result, tenant1 won’t be able to decrypt tenant2 cookie and create ClaimsPrincipal based on that. It’s also worth mentioning that purpose, which is an argument of CreateProtector, should be unique throughout your application. Note that if your app is hosted as multiple instances, it needs to synchronize encryption keys! In case you host it on Azure App Service it works out of the box. You can read more about it in these articles: Share authentication cookies among ASP.NET apps Data Protection key management and lifetime in ASP.NET Core 1public static class ServiceCollectionExtensions2{3 // ...4 5 public static IServiceCollection AddMultitenantAuthentication(this IServiceCollection services)6 {7 services.AddAuthentication(options =>8 {9 options.DefaultScheme = CookieAuthenticationDefaults.AuthenticationScheme;10 }).AddCookie();11 12 services.AddPerRequestCookieOptions((options, httpContext) =>13 {14 var tenant = httpContext15 .RequestServices.GetRequiredService<ITenantContext>()16 .CurrentTenant;17 18 options.DataProtectionProvider = httpContext19 .RequestServices.GetRequiredService<IDataProtectionProvider>()20 .CreateProtector($"App.Tenants.{tenant.Name}");21 22 options.Cookie.Name = $"{tenant.Name}-Cookie";23 });24 25 return services;26 }27 28 private static void AddPerRequestCookieOptions(29 this IServiceCollection services,30 Action<CookieAuthenticationOptions, HttpContext> configAction)31 {32 services.AddSingleton<IOptionsMonitor<CookieAuthenticationOptions>, CookieOptionsMonitor>();33 services.AddSingleton<IConfigureOptions<CookieAuthenticationOptions>>(provider =>34 {35 var httpContextAccessor = provider.GetRequiredService<IHttpContextAccessor>();36 return new CookieConfigureNamedOptions(httpContextAccessor, configAction);37 });38 }39}C#Copy Finally, to make it work we extend HTTP pipeline (in Program.cs) with authentication and authorization middlewares. It needs to be before MapControllerRoute method. 1var builder = WebApplication.CreateBuilder(args);2 3var services = builder.Services;4 5services.AddHttpContextAccessor();6services.AddControllersWithViews();7services.AddMultitenancy();8services.AddMultitenantAuthentication();9 10var app = builder.Build();11 12app.UseDeveloperExceptionPage();13app.UseStaticFiles();14app.UseMiddleware<TenantResolutionMiddleware>();15app.UseRouting();16app.UseAuthentication();17app.UseAuthorization();18 19app.MapControllerRoute(20 name: "default",21 pattern: "{controller=Home}/{action=Index}");22 23app.Run();C#Copy Time for testing Ok, let’s run the application. Open a browser and sign in to tenant1. After that, we are redirected to the home page with the appropriate message. When we switch to tenant2 we are no longer authenticated. Let’s log in as tenant2User. We’ve successfully signed in. When we switch to tenant1 we are still authenticated but as a different user. Ok, let’s try to hack it 🐱‍💻! I’ve signed out from tenant2 and switched to tenant1. In developer tools, I changed the name of identity cookie to tenant2-Cookie and path to /tenant2. Then I opened the tenant2 route and as you can see I’m not authenticated. Application is not able to decrypt this cookie and create ClaimsPrincipal due to the data protection mechanism. You can download the source code from my GitHub. Conclusion To sum up, we’ve created a mechanism that allows registering tenant-specific cookie options. Thanks to that users can use our application being signed in on different tenants. There are of course many solutions to solve this problem. The main purpose of this one is to be simple and effective. You can potentially extend it and adjust it to your needs. Go to part 3 – connecting to tenant databaseTagged: Authentication, Multitenancy, ASP.NET Core, .NETCommentsAdd commentThe comments system is based on GitHub Issues API. Once you add your comment to the linked issue on my GitHub repository, it will show up below.'''
