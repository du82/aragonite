["https://brokul.dev/fluent-builder-inheritance-how-to-make-it-work-in-c"]
title = "Fluent builder inheritance - how to make it work in C#?"
description = "A fluent builder is a well-known and willingly used design pattern. But how to use builders' inheritance in C# language?"
full_description = 'Fluent builder inheritance - how to make it work in C#?Fluent builder is a well-known design pattern that helps to build objects of a given type. It makes code more readable and maintainable thanks to method chaining. The problem occurs when you try to extend the functionality of the existing builder using inheritance.Bartłomiej Iskrzycki23 January 2021Extending existing fluent builder Below you can see a simple example of the fluent builder. Of course, in real life logic of building methods is usually far more complex than that. 1public class Tenant2{3 public string Id { get; set; }4 public Uri BaseUrl { get; set; }5 public string Secret { get; set; }6 public string QaCloudId { get; set; }7}8 9public class TenantBuilder10{11 private readonly Tenant _tenant;12 13 public TenantBuilder()14 {15 _tenant = new Tenant();16 }17 18 public TenantBuilder WithId(string id)19 {20 _tenant.Id = id;21 return this;22 }23 24 public TenantBuilder WithBaseUrl(string baseUri)25 {26 _tenant.BaseUrl = new Uri(baseUri);27 return this;28 }29 30 public Tenant Build()31 {32 return _tenant;33 }34}35 36public class Program37{38 public static void Main()39 {40 var tenant = new TenantBuilder()41 .WithId("Tenant1")42 .WithBaseUrl("https://tenant1.local")43 .Build();44 }45}C#Copy Now let’s imagine that we want to extend this builder with a method that will also fill Secret property on the Tenant object. Let’s assume that we want to do it using inheritance following the open-closed principle. First of all, we change the access modifier of tenant property on the first builder level (and fix usages). 1public class TenantBuilder2{3 protected readonly Tenant Tenant;4 ...C#Copy Then we create a new builder and derive from TenantBuilder: 1public class ConfidentialTenantBuilder : TenantBuilder2{3 public ConfidentialTenantBuilder WithSecret(string secret)4 {5 Tenant.Secret = secret;6 return this;7 }8}C#Copy Now, we can use it: 1public static void Main()2{3 var tenant = new ConfidentialTenantBuilder()4 .WithSecret("secret")5 .WithId("Test")6 .WithBaseUrl("https://tenant1.local")7 .Build();8}C#Copy And everything seems to work fine. But what if we change the order of these methods? 1public static void Main()2{3 var tenant = new ConfidentialTenantBuilder()4 .WithId("Test")5 .WithBaseUrl("https://tenant1.local")6 .WithSecret("secret")7 .Build();8}C#Copy As a result, this code will not compile. Why? The problem is that when we create ConfidentialTenantBuilder and then invoke WithId method, a builder of type TenantBuilder is returned which does not have WithSecret method. In other words, we lose fluency. Prepare fluent builder for inheritance How to prepare an existing fluent builder for an inheritance? The solution for that is named recursive generics and is based on passing the child builder type up to the parent. Then parent builder can cast this to child type. 1public class Tenant2{3 public string Id { get; set; }4 public Uri BaseUrl { get; set; }5 public string Secret { get; set; }6 public string QaCloudId { get; set; }7}8 9public class TenantBuilder<TBuilder> where TBuilder : TenantBuilder<TBuilder>10{11 protected readonly Tenant Tenant;12 13 public TenantBuilder()14 {15 Tenant = new Tenant();16 }17 18 public TBuilder WithId(string id)19 {20 Tenant.Id = id;21 return (TBuilder)this;22 }23 24 public TBuilder WithBaseUrl(string baseUri)25 {26 Tenant.BaseUrl = new Uri(baseUri);27 return (TBuilder)this;28 }29 30 public Tenant Build()31 {32 return Tenant;33 }34}35 36public class ConfidentialTenantBuilder : TenantBuilder<ConfidentialTenantBuilder>37{38 public ConfidentialTenantBuilder WithSecret(string secret)39 {40 Tenant.Secret = secret;41 return this;42 }43}44 45public class Program46{47 public static void Main()48 {49 var tenant = new ConfidentialTenantBuilder()50 .WithSecret("secret")51 .WithId("Test")52 .WithBaseUrl("https://tenant1.local")53 .Build();54 }55}C#Copy Now everything should work fine. As you can see, in each parent method we cast this to TBuilder which is a generic type of child builder. This casting is possible (and safe), because of strange-looking constraints: 1public class TenantBuilder<TBuilder> where TBuilder : TenantBuilder<TBuilder>C#Copy which is a perfectly valid one because we just expect TBuilder type to inherit from the parent builder with TBuilder as a generic type argument. Remember to adjust child builder too You might have noticed that although we enabled parent builder inheritance we cannot derive from child builder because of the same issue. To fix that we need to make child builder generic in the same way like for parent builder. 1public class ConfidentialTenantBuilder<TBuilder>2 : TenantBuilder<TBuilder> where TBuilder : ConfidentialTenantBuilder<TBuilder>3{4 public TBuilder WithSecret(string secret)5 {6 Tenant.Secret = secret;7 return (TBuilder)this;8 }9}C#Copy In the same vein, let’s derive from ConfidentialTenantBuilder: 1public class QaTenantBuilder<TBuilder>2 : ConfidentialTenantBuilder<TBuilder>3 where TBuilder : QaTenantBuilder<TBuilder>4{5 public TBuilder WithQaCloudId(string qaCloudId)6 {7 Tenant.QaCloudId = qaCloudId;8 return (TBuilder)this;9 }10}C#Copy And use it in the client code: 1public class Program2{3 public class TestTenantBuilder : QaTenantBuilder<TestTenantBuilder> {}4 5 public static void Main()6 {7 var tenant = new TestTenantBuilder()8 .WithSecret("secret")9 .WithQaCloudId("cloud01")10 .WithId("Test")11 .WithBaseUrl("https://tenant1.local")12 .Build();13 }14}C#Copy Vualá 🎉! We could also implement an implicit operator to cast your builder to target type easily: 1public class Program2{3 public class TestTenantBuilder : QaTenantBuilder<TestTenantBuilder>4 {5 public static implicit operator Tenant(TestTenantBuilder builder)6 {7 return builder.Build();8 }9 }10 11 public static void Main()12 {13 Tenant tenant = new TestTenantBuilder()14 .WithSecret("secret")15 .WithQaCloudId("cloud01")16 .WithId("Test")17 .WithBaseUrl("https://tenant1.local");18 }19}C#Copy You can find the source code of described builder here. Conclusion To sum up, fluent builder inheritance is possible but requires parent builders to be prepared for that. It has to follow the recursive generics approach to cast itself to the appropriate child builder type. It’s worth remembering, especially if you create a library that other developers will use in their projects.Tagged: Design patterns, C#, .NETCommentsAdd commentThe comments system is based on GitHub Issues API. Once you add your comment to the linked issue on my GitHub repository, it will show up below.'
