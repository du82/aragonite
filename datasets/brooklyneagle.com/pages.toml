title = "About Us - Brooklyn Eagle"
description = "About us The Brooklyn Eagle is journalism for curious, creative and constructive Brooklynites. We aim to serve all of the borough’s 2.6 million residents with news, pairing in-depth reporting on the people, powers and ideas shaping Brooklyn with an insider’s take on where to go, what to see and how to get the most from […]"
full_description = "About us The Brooklyn Eagle is journalism for curious, creative and constructive Brooklynites. We aim to serve all of the borough’s 2.6 million residents with news, pairing in-depth reporting on the people, powers and ideas shaping Brooklyn with an insider’s take on where to go, what to see and how to get the most from living in the nation’s most vibrant city. The original Brooklyn Daily Eagle was founded in 1841. Its deep historical and cultural roots provides context and texture to the day’s stories. Once edited by Walt Whitman, the original Brooklyn Eagle has four Pulitzer Prizes and remains the best archive of more than 100 years of Brooklyn history. The original Eagle ceased publication in 1955. The brand was resurrected in 1996 and merged with the Brooklyn Daily Bulletin, which began publication in 1955. Sign up for our newsletter, delivered each weekday morning with everything you need to live, work and play in Brooklyn. You can also find us on Facebook, Twitter and Instagram. Our team EDITORIAL MANAGEMENT PRINT NEWSROOM, Managing Editor Raanan Geberer [email protected] EDITORIAL TRAFFIC MANAGER Suzanne Akceylan [email protected] (718) 422-7410 BROOKLYN TODAY Newsletter Editor Scott Enman [email protected] NEWSLETTER TRAFFIC MANAGER Michaela Keil [email protected] PRINT PRODUCTION Wayne Chambers, Gary Nilson [email protected] BUSINESS MANAGEMENT Joe Messina, Sr. Director of Business Operations [email protected] David Glaski, Director of Sales & Marketing [email protected] (718) 422-7444 Gina Osnovich, Legal Notice Advertising [email protected] (718) 422-7402 Jen Hopewell, Special Projects, Digital [email protected] (718) 422-7410"
