["https://www.brooklynpaper.com/bandai-namco-flagship-store-industry-city"]
title = "Japanese entertainment giant Bandai Namco expands to U.S. with flagship Industry City store • Brooklyn Paper"
description = "Bandai Namco, the Japanese entertainment giant behind Pac-Man and Gundam, is opening its first U.S. store in Sunset Park this weekend."
full_description = '''Arts & Entertainment Japanese entertainment giant Bandai Namco expands to U.S. with flagship Industry City store Paul Frangipane & Adam Daly Posted on February 27, 2025 Bandai Namco hosted a preview of its new store in Japan Village at Industry City on Tuesday, Feb. 25, 2025. The store is the company’s first location in the United States. Photo by Paul Frangipane Sign up for our Brooklyn Paper email newsletter to get news, updates, and local insights delivered straight to your inbox! Bandai Namco, the Japanese entertainment giant behind Pac-Man and Gundam, is opening its first U.S. store in Sunset Park this weekend. The new store in Industry City offers a wide selection of merchandise, including toys, collectibles, apparel and video games from the Japanese brand’s extensive portfolio of popular franchises, such as Tekken, Dragon Ball and Tamagotchi. Close Get the Full StoryNews, events, culture and more — delivered to you. Thank you for subscribing! Email Sign Up “This is the only place in the country where you can see all Bandai Namco’s official shops in one place,” Shaunda Brooks-Green, marketing specialist for Bandai Namco, told Brooklyn Paper during a press preview of the store, which is opening to the public on Feb. 28.if (!window.AdButler){(function(){var s = document.createElement("script"); s.async = true; s.type = "text/javascript";s.src = 'https://ads.empowerlocal.co/app.js';var n = document.getElementsByTagName("script")[0]; n.parentNode.insertBefore(s, n);}());} var rnd = Math.floor(Math.random()*10e6); var divsize = document.querySelector('#emp-e12a4').parentNode.clientWidth; var AdButler = AdButler || {}; AdButler.ads = AdButler.ads || []; var abkw = window.abkw || ''; console.log("emp-e12a4-size-"+divsize); if(divsize >= 728){ var plc551933 = window.plc551933 || 0; document.write('<'+'div id="placement_551933_'+plc551933+'"></'+'div>'); AdButler.ads.push({handler: function(opt){ AdButler.register(181918, 551933, [728,90], 'placement_551933_'+opt.place, opt); }, opt: { pid: rnd, rnd: rnd ,place: plc551933++, keywords: abkw, domain: 'ads.empowerlocal.co', click:'CLICK_MACRO_PLACEHOLDER' }}); } else{ var plc551927 = window.plc551927 || 0; document.write('<'+'div id="placement_551927_'+plc551927+'"></'+'div>'); AdButler.ads.push({handler: function(opt){ AdButler.register(181918, 551927, [300,250], 'placement_551927_'+opt.place, opt); }, opt: { pid: rnd, rnd: rnd ,place: plc551927++, keywords: abkw, domain: 'ads.empowerlocal.co', click:'CLICK_MACRO_PLACEHOLDER' }}); } “This is the first one in the U.S., so we’re really excited about that. It took some site visits and trying to figure out what fits our demographic, number one, and just keeping it to its Japanese origins, so obviously having it here at Industry City and Japan Village is important to our brand,” Brooks-Green said. Climate Justice and Innovation: Dr. Stephen Hammer on The New York Climate Exchange Schneps Connects https://podcasts.schnepsmedia.com/wp-content/uploads/2025/02/Dr_Hammer.mp3 Subscribe: RSS iTunes Spotify Stitcher Amazon Google Play The new store in Japan Village features a wide array of merchandise, including toys, collectibles, apparel and video games.Photo by Paul Frangipane From Tamagotchi to Dragon Ball collectibles, the Bandai Namco store is a fan’s dream.Photo by Paul Frangipane While the company has previously sold merchandise online and through partnerships with other retailers, the Industry City location is its first standalone U.S. outpost, dubbed a department store for Bandai Namco products. The location inside Industry Cit’s Japan Village aims to provide customers with an immersive retail experience. It has dedicated areas for different franchises and interactive displays, including an arcade. Brooks-Green emphasized that the store’s primary goal is to foster a sense of community amongst New York fans. “New York is the area for culture, especially the intersection of multiple cultures. I think because of that, New York was the perfect place and, more specifically, Brooklyn. The borough has so many different culminations of cultures and flavors, especially this neighborhood in Sunset Park,” she said. “This is a safe space where people can come, shop, and just enjoy being in a space where they can be themselves.” var divsize = document.querySelector('#emp-6f074').parentNode.clientWidth; var rnd = Math.floor(Math.random()*10e6); var pid551923 = rnd; var plc551923 = window.plc551923 || 0; var abkw = window.abkw || ''; var absrc = 'https://ads.empowerlocal.co/adserve/;ID=181918;size=0x0;setID=551923;type=js;sw='+screen.width+';sh='+screen.height+';spr='+window.devicePixelRatio+';kw='+abkw+';pid='+pid551923+';place='+(plc551923++)+';rnd='+rnd+';click=CLICK_MACRO_PLACEHOLDER'; var _absrc = absrc.split("type=js"); absrc = _absrc[0] + 'type=js;referrer=' + encodeURIComponent(document.location.href) + _absrc[1]; document.write('<scr'+'ipt src="'+absrc+'" type="text/javascript"></'+'script>'); The arcade section of the store features multiple coin-operated arcade games.Photo by Paul Frangipane Bandai Namco was formed in 2005 through the merger of Bandai, known for its toys and character merchandise, and Namco, which was a prominent video game developer and arcade operator. The opening of the Brooklyn location reflects Bandai Namco’s strategy to strengthen its global presence, having previously opened its first location outside of Japan in London, England. googletag.cmd.push(function() { googletag.display('brooklynNews_content_responsive_1'); }); About the Author'''
