title = "84th Precinct: New Year’s Nightmare • Brooklyn Paper"
description = "Brooklyn Heights–DUMBO–Boerum Hill–Downtown"
full_description = '''Boerum Hill 84th Precinct: New Year’s Nightmare The 84th Precinct stationhouse in Downtown Brooklyn. Photo by Kirstyn Brendlen Sign up for our Brooklyn Paper email newsletter to get news, updates, and local insights delivered straight to your inbox! 84TH PRECINCT Brooklyn Heights–DUMBO–Boerum Hill–Downtown New Year’s Nightmare Authorities arrested a 44-year-old man on Dec. 31 in Boerum Hill after he allegedly threw a bottle in the face of a woman who asked him for directions. The 33-year-old victim said she approached a man near the intersection of Hoyt and Atlantic streets at 8:30 p.m. and asked him for directions to Times Square. Instead of replying, she said the man then threw a glass bottle at her face. Cops quickly responded to the scene and arrested the 44-year-old suspect, who is currently homeless. Bottler Close Get the Full StoryNews, events, culture and more — delivered to you. Thank you for subscribing! Email Sign Up A 50-year-old woman was hospitalized on Dec. 30 after being struck in the head with a bottle in Downtown. The victim told cops she was standing on the corner of Willoughby and Jay streets shortly after 7 a.m. when an object hit her in the back of the head. She said she turned around to see an unknown man yelling at her and the object, a plastic bottle filled with liquid, on the pavement. A passerby approached the victim and called 911 after she reported feeling dizzy. The witness told cops they saw the perp fleeing after the unprovoked incident, walking southbound on Jay St. EMS transported the woman to Brooklyn Hospital for further treatment while cops canvassed the nearby area. The investigation remains ongoing. Bench brute Cops are looking for the suspect behind a random attack on a 73-year-old man in Brooklyn Heights on Jan. 4. According to the victim, he was sitting on a bench on Court Street at around 8 p.m. when a stranger came up behind him and began striking him about the head with an unknown object. The 73-year-old suffered a severe laceration to the head and dislocated his left arm when he fell over during the attack. Police say they are reviewing nearby cameras to identify the suspect who fled eastbound on Joralemon St. E-bike swiped A food delivery worker was assaulted and robbed of his e-bike in Brooklyn Heights on Jan. 4. The 38-year-old victim told police he left his e-bike unattended while he was picking up an order from a sushi restaurant, Mikado, on Atlantic Avenue at 9:30 p.m. Upon returning he noticed a man was walking away with his bike, and when he confronted him, he was punched in the left shoulder and throat. var divsize = document.querySelector('#emp-239fc').parentNode.clientWidth; var rnd = Math.floor(Math.random()*10e6); var pid551923 = rnd; var plc551923 = window.plc551923 || 0; var abkw = window.abkw || ''; var absrc = 'https://ads.empowerlocal.co/adserve/;ID=181918;size=0x0;setID=551923;type=js;sw='+screen.width+';sh='+screen.height+';spr='+window.devicePixelRatio+';kw='+abkw+';pid='+pid551923+';place='+(plc551923++)+';rnd='+rnd+';click=CLICK_MACRO_PLACEHOLDER'; var _absrc = absrc.split("type=js"); absrc = _absrc[0] + 'type=js;referrer=' + encodeURIComponent(document.location.href) + _absrc[1]; document.write('<scr'+'ipt src="'+absrc+'" type="text/javascript"></'+'script>'); The thief was last seen riding the $1,850 e-bike northbound on Smith Street. Police hope to catch the culprit once they review Mikado’s surveillance camera footage. Lying in wait A 36-year-old woman had her brand-new computer stolen as she entered her Brooklyn Heights apartment building on Dec. 30. According to the victim, she exited an Uber outside her Cranberry Street apartment shortly after 8 p.m., carrying a newly purchased iMac desktop computer. As she approached her building, a man came up behind her, pushed her to the ground, and grabbed her $2,000 computer. The thief then jumped on the back of a moped being operated by another man and fled in an unknown direction. About the Author'''
