title = "Former auto body shop site in Borough Park to become seven-story development • Brooklyn Paper"
description = "A seven-story mixed-use building is set to replace an industrial site in Borough Park, featuring commercial units, parking, and a community facility."
full_description = '''Borough Park Former auto body shop site in Borough Park to become seven-story development By Lauren Rapp Posted on February 28, 2025 A rendering of the planned seven-story mixed-use building at 1547 60th St. in Borough Park, set to feature a multilevel community facility and a passive recreational terrace. Rendering courtesy of Beitel Group Sign up for our Brooklyn Paper email newsletter to get news, updates, and local insights delivered straight to your inbox! A seven-story mixed-use building at 1547 60th St. in Borough Park is set to break ground in March, featuring a multilevel community facility and a passive recreational terrace. The future 3,401-square-foot facility will skimp on parking, as plans include a cellar-level lot in addition to a second-floor parking facility. The ground floor will house multiple commercial units. A passive recreational terrace is set for the third floor, alongside a community facility that will span the third through sixth floors. Leases for the community facility have not yet been finalized, according to Lezer Tenenbaum, a spokesperson for Beitel Group, the real estate company behind the project. Close Get the Full StoryNews, events, culture and more — delivered to you. Thank you for subscribing! Email Sign Up if (!window.AdButler){(function(){var s = document.createElement("script"); s.async = true; s.type = "text/javascript";s.src = 'https://ads.empowerlocal.co/app.js';var n = document.getElementsByTagName("script")[0]; n.parentNode.insertBefore(s, n);}());} var rnd = Math.floor(Math.random()*10e6); var divsize = document.querySelector('#emp-20ef8').parentNode.clientWidth; var AdButler = AdButler || {}; AdButler.ads = AdButler.ads || []; var abkw = window.abkw || ''; console.log("emp-20ef8-size-"+divsize); if(divsize >= 728){ var plc551933 = window.plc551933 || 0; document.write('<'+'div id="placement_551933_'+plc551933+'"></'+'div>'); AdButler.ads.push({handler: function(opt){ AdButler.register(181918, 551933, [728,90], 'placement_551933_'+opt.place, opt); }, opt: { pid: rnd, rnd: rnd ,place: plc551933++, keywords: abkw, domain: 'ads.empowerlocal.co', click:'CLICK_MACRO_PLACEHOLDER' }}); } else{ var plc551927 = window.plc551927 || 0; document.write('<'+'div id="placement_551927_'+plc551927+'"></'+'div>'); AdButler.ads.push({handler: function(opt){ AdButler.register(181918, 551927, [300,250], 'placement_551927_'+opt.place, opt); }, opt: { pid: rnd, rnd: rnd ,place: plc551927++, keywords: abkw, domain: 'ads.empowerlocal.co', click:'CLICK_MACRO_PLACEHOLDER' }}); } The site, currently vacant, has been used for more than 100 years for factory production and auto body repair. The lot originally housed a milk production factory that operated from the 1920s to the 1950s. It was later converted into a rag-cleaning facility with gasoline tanks until 1960, then served as home to various auto repair and body shops until 2023. Due in part to the lot’s long history of industrial use, an environmental assessment revealed hazardous contaminants in the soil and groundwater. The site, which has been used for over 100 years for industrial purposes, is set to begin environmental restoration in March before construction starts.Rendering courtesy of Beitel Group A Remedial Investigation Report detected semi-volatile organic compounds (SVOCs), metals, and pesticides in soil samples. According to the Office of Environmental Remediation (OER), groundwater samples tested positive for SVOCs, several metals, and per- and polyfluoroalkyl substances (PFAS) at levels exceeding the city’s groundwater quality standards. var divsize = document.querySelector('#emp-364cf').parentNode.clientWidth; var rnd = Math.floor(Math.random()*10e6); var pid551923 = rnd; var plc551923 = window.plc551923 || 0; var abkw = window.abkw || ''; var absrc = 'https://ads.empowerlocal.co/adserve/;ID=181918;size=0x0;setID=551923;type=js;sw='+screen.width+';sh='+screen.height+';spr='+window.devicePixelRatio+';kw='+abkw+';pid='+pid551923+';place='+(plc551923++)+';rnd='+rnd+';click=CLICK_MACRO_PLACEHOLDER'; var _absrc = absrc.split("type=js"); absrc = _absrc[0] + 'type=js;referrer=' + encodeURIComponent(document.location.href) + _absrc[1]; document.write('<scr'+'ipt src="'+absrc+'" type="text/javascript"></'+'script>'); The investigation also collected soil vapor samples, which revealed moderate levels of petroleum-related and chlorinated volatile organic compounds (VOCs) exceeding the Air Guideline Values set by the New York State Department of Health. Beitel Group has submitted a remedial action work plan to begin environmental restoration in March before construction can begin. Under the oversight of the OER, community air monitoring will be conducted throughout the cleanup to protect residents from airborne contaminants, dust and odors. The seven-story mixed-use facility will replace a recently demolished one-story auto body shop. About the Author'''
