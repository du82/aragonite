["https://browserify.org/articles.html"]
title = "Browserify"
full_description = '''Introductions / Browserify basics These articles give a great introduction to using Browserify. Browserify Handbook github.com/substack/browserify-handbook This document written by @substack covers how to use browserify to build modular applications. Recommended as a starting point. Introduction to Browserify superbigtree.tumblr.com/post/54873453939/introduction-to-browserify The basics of writing modules for the browser using node.js core modules and modules from npm. Frontend Dependency Management with Browserify from Bit.ly Engineering http://word.bitly.com/post/101360133837/browserify A great introductory article from Bit.ly engineering about Browserify and how they used it on a recent project. Untangle Your JavaScript with Browserify http://lincolnloop.com/blog/untangle-your-javascript-browserify A straightforward introduction to browserify, including integration with Grunt and Gulp. How Browserify Works benclinkinbeard.com/posts/how-browserify-works/ A basic introduction to how Browserify does what it does. Browserify: Unix In The Browser thinkingonthinking.com/unix-in-the-browser Another basic introduction to Browserify and NPM. Sharing code between Node.js and the browser https://blog.codecentric.de/en/2014/02/cross-platform-javascript/ A detailed introduction to Browserify and Grunt.js and how to leverage Browserify to write code that runs on Node.js and in the browser. Using npm on the client side dontkry.com/posts/code/using-npm-on-the-client-side.html A very thorough introduction to using npm, Browserify, and Grunt.js. NPM Everywhere (Slides) NPM Everywhere Slides for introducing front-end people NPM, Browserify and their benefits. Introduction to Browserify blakeembrey.com/articles/2013/09/introduction-to-browserify/ Another great look at the basics of Browserify. Node Packaged Modules, bringing npm modules to the web maxogden.com/node-packaged-modules.html A rundown of projects that have made developing with browserify more accessible and more interesting: requirebin.netlify.app, npmsearch.com, and Browserify CDN. Browserify and the Universal Module Definition dontkry.com/posts/code/browserify-and-the-universal-module-definition.html An awesome look at the possibilities for using Browserify to bundle modules written in AMD, CommonJS/node.js, UMD, ECMAscript 6, and global modules. Standalone Browserify Builds www.forbeslindesay.co.uk/post/46324645400/standalone-browserify-builds Particularly interesting for people using Browserify as part of the development workflow on a javascript library, check out this article for learning how to generate standalone Browserify builds. Browserify v2 adds source maps thlorenz.com/blog/browserify-v2-adds-source-maps Learn about using source maps with Browserify in this article. Browserify on Small.js smalljs.org/package-managers/npm/browserify/ Yet another introductory article about Browserify. Covers basic workflow, transforms, source maps, automation, RequireBin, and how to play nice with popular frameworks. Browserify中文版使用指南 zhaoda.net/2015/10/16/browserify-guide/ Guide to the use of the Chinese version of the Browserify. Usage of browserify For examples of using browserify with various javascript libraries, check out these articles. A Year With Browserify aeflash.com/2014-03/a-year-with-browserify.html "Along the way, I've learned a lot about the whole Browserify process, some tricks, and some pitfalls." Using angular and grunt with browserify dontkry.com/posts/code/angular-browserify-grunt.html Using angular.js with browserify is suprisingly straightforward as shown in this post. Basics of making maps with leaflet.js and browserify learnjs.io/blog/2013/11/08/leaflet-basics Leaflet.js is a great mapping library, and this tutorial shows how you can use it with browserify. Backbone & jQuery meet Browserify: easy. learnjs.io/blog/2013/11/23/backbone-jquery-browserify An introduction to using backbone and jquery with browserify. grunt+browserify+npm+application=success codeofrob.com/entries/grunt+browserify+npm+application=success.html A good rundown of using Grunt.js with Browserify. gulp browserify starter faq http://viget.com/extend/gulp-browserify-starter-faq How to start an application with gulp and browserify, including a starter repo Related tools Browserify fits in well with other development tools. Check out some of the ones most commonly used with Browserify. Beefy didact.us/beefy Beefy is a great tool for running a development server that will automatically reload the browser and serve a newly generated bundle.js file each time you save a project file. grunt-browserify github.com/jmreidy/grunt-browserify A plugin for using browserify with grunt. chem github.com/superjoe30/chem Canvas-based game engine and toolchain optimized for rapid development. Chem uses browserify to compile your code. Check out some of the useful npm packages for games. Comparisons to similar tools Browserify is used primarily with npm. Both of those tools have similar counterparts like Bower and RequireJS. These articles help explain some of the differences. Journey from RequireJS to Browserify esa-matti.suuronen.org/blog/2013/03/22/journey-from-requirejs-to-browserify A thorough explanation of switching from RequireJS to Browserify. 2013: A client side package manager oddyssey calvinmetcalf.com/post/61957209713/2013-a-client-side-package-manager-oddyssey A series of posts exploring package managers for client side code. Includes npm/Browserify. My strategy for client-side package managers (choosing between npm, bower, and component) superbigtree.tumblr.com/post/58075340096/my-strategy-for-client-side-package-managers-choosing Exploring the differences between npm, bower, and component. Browserify vs. Component www.forbeslindesay.co.uk/post/44144487088/browserify-vs-component A comparison of Browserify and Component. Resources Browserify documentation/github repository github.com/browserify/browserify#browserify Read the Browserify docs! Also check out the issues. Art Of Node - How Require Works maxogden/art-of-node/#modular-development-workflow Part of a larger Node tutorial. Explains how require works and gives examples of how to develop software using Node modules. node.js modules documentation nodejs.org/docs/latest/api/modules.html#modules_modules To write modules for the browser using Browserify, you'll use the node.js module system, and it's a good idea to check out the code node.js module documentation. Packages tagged with browserify on npm npmjs.org/browse/keyword/browserify Check out the modules tagged with browserify on npm. Browserify on StackOverflow stackoverflow.com/questions/tagged/browserify Check out the questions being asked about Browserify on StackOverflow. Videos Browserify V2 and you vimeo.com/62988591 Creator of Browserify James Halliday (@substack) gives a rundown of the changes that came through in version 2 of the project. Modular JavaScript With Npm And Node Modules ericleads.com/2014/03/modular-javascript-with-npm-and-node-modules Eric Elliot recorded this screencast version of a talk he gave about using modules to write JS programs. Getting Started With Browserify youtube.com/watch?v=CTAa8IcQh1U A 10 minute screencast to quickly get you bundling with Browserify. Transform Your Bundles With Browserify youtube.com/watch?v=Uk2bgp8OLT8 A 10 minute screencast about how to use and write Browserify transforms. Testing How I Write Tests for Node and the Browser substack.net/how_I_write_tests_for_node_and_the_browser Write unit tests that work in node and the browser.'''
