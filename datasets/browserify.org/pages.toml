["https://browserify.org/index.html"]
title = "Browserify"
full_description = '''Browsers don't have the require method defined, but Node.js does. With Browserify you can write code that uses require in the same way that you would use it in Node. Here is a tutorial on how to use Browserify on the command line to bundle up a simple file called main.js along with all of its dependencies: main.js var unique = require('uniq'); var data = [1, 2, 2, 3, 4, 5, 5, 5, 6]; console.log(unique(data)); Install the uniq module with npm: npm install uniq Now recursively bundle up all the required modules starting at main.js into a single file called bundle.js with the browserify command: browserify main.js -o bundle.js Browserify parses the AST for require() calls to traverse the entire dependency graph of your project. Drop a single <script> tag into your html and you're done! <script src="bundle.js"></script> More Read the Browserify Handbook Use many of the tens of thousands of modules on NPM in the browser Use watchify, a browserify compatible caching bundler, for super-fast bundle rebuilds as you develop. Use tinyify for optimized, tree-shaked bundles in production environments. Use --debug when creating bundles to have Browserify automatically include Source Maps for easy debugging. Check out tools like Beefy or run-browser which make automating browserify development easier. process.nextTick(), __dirname, and __filename node-isms work Get browser versions of the node core libraries events, stream, path, url, assert, buffer, util, querystring, http, vm, and crypto when you require() them Community Join irc.freenode.net/#browserify for help, or tweet @browserify. Browserify is elegant and fast. It makes frontend development fun again! That's why we used it to build Yahoo's new HTML5 video player. - feross, developer on the Video team at Yahoo. At Mapbox we build our website and JavaScript API with Browserify. It makes the structure and modularity of our code rock. - tmcw, developer at Mapbox. Browserify does exactly what it says it does and it does it well. I'm glad it exists. - zpao, developer on the React team at Facebook. Browserify radically sped up builds, simplified builds and encouraged modularity. - terinjokes, developer at CloudFlare. View more at the Browserify in the wild page.'''
year_published = 2025
clearnet = "https://browserify.org/index.html"
