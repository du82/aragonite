["https://browsersync.io"]
title = "Browsersync - Time-saving synchronised browser testing"
description = "Browsersync makes your browser testing workflow faster by synchronising URLs, interactions and code changes across multiple devices. It&rsquo;s wicked-fast and totally free."
full_description = 'Your indispensable test assistant. With each web page, device and browser, testing time grows exponentially. From live reloads to URL pushing, form replication to click mirroring, Browsersync cuts out repetitive manual tasks. It’s like an extra pair of hands. Customise an array of sync settings from the UI or command line to create a personalised test environment. Need more control? Browsersync is easily integrated with your web platform, build tools, and other Node.js projects. Works stand-alone, or integrates with your current build tools Awesome Features Install and run anywhere Built on Node.JS_ENTRY to support Windows, MacOS and Linux. Setup in less than 5 minutes. Free to run and reuse Browsersync is an open source project available to use under the Apache 2.0 License. Build-tool compatible Easily integrated with task runners like Grunt and Gulp, or included in other Node projects. Network Throttle Test your website against a slower connection. Even when devices are connected to wifi. Interaction sync Your scroll, click, refresh and form actions are mirrored between browsers while you test. File sync Browsers are automatically updated as you change HTML, CSS, images and other project files. UI or CLI control Run the new browser-based UI for quick control, or stick with the original command line usage. Sync customisation Toggle individual sync settings to create your preferred test environment. URL history Records your test URLs so you can push them back out to all devices with a single click. Depended on by thousands Browsersync is an open-source project with over 2 million npm downloads a month and is a dependency of nearly a million separate projects on github. Tried and trusted. Dave Rupert Want to feel like a modern day demigod? Fire up Browsersync and control an entire device lab with your phone. Paravel and Shop Talk Show Addy Osmani It has a fantastic feature-set and at least 5 developers I’ve spoken to this week alone swear by it for their own synchronized cross-device testing. Google and addyosmani.com Get started in 5 minutes. 1. Install Node.js Browsersync is a module for Node.js, a platform for fast network applications. There are convenient installers for MacOS, Windows and Linux. 2. Install Browsersync The Node.js package manager (npm) is used to install Browsersync from a repository. Open a terminal window and run the following command: npm install -g browser-sync You’re telling the package manager to download the Browsersync files and install them globally so they’re available to all your projects. 3. Start Browsersync A basic use is to watch all CSS files in the css directory and update connected browsers if a change occurs. Navigate your terminal window to a project and run the appropriate command:Static sites If you’re only using .html files, you’ll need to use the server mode. Browsersync will start a mini-server and provide a URL to view your site. browser-sync start --server --files "css/*.css" Dynamic sites If you’re already running a local server with PHP or similar, you’ll need to use the proxy mode. Browsersync will wrap your vhost with a proxy URL to view your site. browser-sync start --proxy "myproject.dev" --files "css/*.css" User Guides Documentation Command line usage Get help on Stack Overflow Report issues on Github Integration Guides Grunt plugin Gulp integration API documentation Options documentation'
