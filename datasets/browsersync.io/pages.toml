["https://browsersync.io/docs/options"]
title = "Browsersync options"
description = "Browsersync makes your browser testing workflow faster by synchronising URLs, interactions and code changes across multiple devices. It&rsquo;s wicked-fast and totally free."
full_description = '''Browsersync options These are all the options that you can configure when using Browsersync. Create a single object and pass it as the first argument (for GulpJS and normal API usage). If you're using Grunt, you can still use all of these options, but you need to provide them as detailed in the Browsersync Grunt Documentation ui ^ TOP Type: Object port - Default: 3001 Note: requires at least version 2.0.0 Browsersync includes a user-interface that is accessed via a separate port. The UI allows to controls all devices, push sync updates and much more. // Change the default port ui: { port: 8080 } // Change the default weinre port ui: { port: 8080, weinre: { port: 9090 } } // Disable UI completely ui: false files ^ TOP Type: Array | String Default: false Browsersync can watch your files as you work. Changes you make will either be injected into the page (CSS & images) or will cause all browsers to do a full-page refresh. // single file browserSync({ files: "app/css/style.css" }); // multiple files browserSync({ files: ["app/css/style.css", "app/js/*.js"] }); // patterns + 1 with custom callback // since 2.6.0 browserSync({ files: [ "wp-content/themes/**/*.css", { match: ["wp-content/themes/**/*.php"], fn: function (event, file) { /** Custom event handler **/ } } ] }); watchEvents ^ TOP Type: Array Default: ["change"] Note: requires at least version 2.18.8 Specify which file events to respond to. Available events: add, change, unlink, addDir, unlinkDir watch ^ TOP Type: Boolean Default: false Note: requires at least version 2.23.0 Watch files automatically - this should be used as an alternative to the files option. When this option is used, some directories will be ignored automatically such as node_modules bower_components .sass-cache .vscode .git .idea var browserSync = require("browser-sync").create(); /** * This example will serve files from the './app' directory * and will automatically watch for html/css/js changes */ browserSync.init({ watch: true, server: "./app" }); ignore ^ TOP Type: Array Default: [] Note: requires at least version 2.23.0 Patterns for any watchers to ignore. Anything provided here will end up inside watchOptions.ignored single ^ TOP Type: Boolean Default: false Note: requires at least version 2.23.0 Serve an index.html file for all non-asset routes. Useful when using client-routers watchOptions ^ TOP Type: Object Default: undefined Note: requires at least version 2.6.0 File watching options that get passed along to Chokidar. Check their docs for available options const bs = require('browser-sync').create(); // Options passed to Chokidar bs.init({ watchOptions: { ignoreInitial: true, ignored: '*.txt' }, files: ['./app'] }); // options for chokidar with custom callback // since 2.6.0 bs.init({ files: [ { match: ["wp-content/themes/**/*.php"], fn: function (event, file) { /** Custom event handler **/ }, options: { ignored: '*.txt' } } ] }); // NOTE: the .watch() method will not receive // these options automatically, so you must provide // them manually in the following way bs.watch(['app/*.css'], {ignored: '*.map.css'}); server ^ TOP Type: Object | Boolean Default: false Use the built-in static server for basic HTML/JS/CSS websites. // Serve files from the app directory server: "app" // Serve files from the current directory server: true // Serve files from the app directory with directory listing server: { baseDir: "app", directory: true } // Multiple base directories server: ["app", "dist"] // Serve files from the app directory, with a specific index filename server: { baseDir: "app", index: "index.htm" } // The static file server is based on expressjs/serve-static, // so we inherit all of their options, like trying a default extension // when one isn't specified // https://github.com/expressjs/serve-static server: { baseDir: "app", serveStaticOptions: { extensions: ["html"] } } // Since version 1.2.1 // The key is the url to match // The value is which folder to serve (relative to your current working directory) server: { baseDir: "app", routes: { "/bower_components": "bower_components" } } proxy ^ TOP Type: String | Object | Boolean target - Default: undefined ws - Default: undefined middleware - Default: undefined reqHeaders - Default: undefined proxyReq - Default: undefined proxyRes - Default: undefined Proxy an EXISTING vhost. Browsersync will wrap your vhost with a proxy URL to view your site. // Using a vhost-based url proxy: "local.dev" // Using a localhost address with a port proxy: "localhost:8888" // Using localhost sub directories proxy: "localhost/site1" // When your app also uses web sockets // NOTE: requires 2.8.1 or above proxy: { target: "http://yourlocal.dev", ws: true } proxy: { target: "http://yourlocal.dev", } // Modify the server request before it hits your application // NOTE: requires v2.12.1 proxy: { target: "http://yourlocal.dev", proxyReq: [ function(proxyReq) { proxyReq.setHeader('X-Special-Proxy-Header', 'foobar'); } ] } // Modify the server response after it's returned from the proxy proxy: { target: "http://yourlocal.dev", proxyRes: [ function(proxyRes, req, res) { console.log(proxyRes.headers); } ] } port ^ TOP Type: Number Default: 3000 // Use a specific port (instead of the one auto-detected by Browsersync) port: 8080 middleware ^ TOP Type: Function | Array Default: false // Multiple Global Middlewares middleware: [ function (req, res, next) { /** First middleware handler **/ }, function (req, res, next) { /** Second middleware handler **/ } ] // Per-route middleware // NOTE: requires v2.12.1 middleware: [ { route: "/api", handle: function (req, res, next) { // handle any requests at /api } } ] // Per-route + global middleware // NOTE: requires v2.12.1 middleware: [ require("compression")(), // global { route: "/api", // per-route handle: function (req, res, next) { // handle any requests at /api } } ] serveStatic ^ TOP Type: Array Default: [] Note: requires at least version 2.8.0 Add additional directories from which static files should be served. Should only be used in proxy or snippet mode. var bs = require('browser-sync').create(); // Run in proxy mode with static files also served // from current directory + ./app/css bs.init({ proxy: "http://www.bbc.co.uk", serveStatic: ['.', './app/css'] }); // Run in proxy mode where files under /assets will be served // from a local ./tmp directory // NOTE: requires 2.17.0 bs.init({ proxy: "http://www.bbc.co.uk", serveStatic: [{ route: '/assets', dir: 'tmp' }] }); // Run in proxy mode where files under /assets + /content will be served // from a local ./tmp directory // NOTE: requires 2.17.0 bs.init({ proxy: "http://www.bbc.co.uk", serveStatic: [{ route: ['/assets', '/content'], dir: 'tmp' }] }); // Run in proxy mode where files under /assets will be served // from either the ./tmp or ./app directory // NOTE: requires 2.17.0 bs.init({ proxy: "http://www.bbc.co.uk", serveStatic: [{ route: '/assets', dir: ['./tmp', './app'] }] }); serveStaticOptions ^ TOP Type: Object Default: Note: requires at least version 2.17.0 Options that are passed to the serve-static middleware when you use the string[] syntax: eg: serveStatic: ['./app']. Please see serve-static for details var bs = require('browser-sync').create(); // Serve files from 3 directories with serve-static options bs.init({ serveStatic: ['.', './app', './temp'], serveStaticOptions: { extensions: ['html'] // pretty urls } }); https ^ TOP Type: Boolean Default: undefined Note: requires at least version 1.3.0 Enable https for localhost development. Note - this is not needed for proxy option as it will be inferred from your target url. // Enable HTTPS for static file server browserSync({ server: "./app", https: true }); // Enable HTTPS for snippet mode browserSync({ https: true }); // Enable HTTPS mode with custom certificates browserSync({ server: "./app", https: { key: "path-to-custom.key", cert: "path-to-custom.crt" } }); httpModule ^ TOP Type: string Default: undefined Note: requires at least version 2.18.0 Override http module to allow using 3rd party server modules (such as http2) Note: these modules are not included in the Browsersync package - you need to 'npm install' any that you'd like to use. // First run: npm install browser-sync http2 const bs = require('browser-sync').create(); bs.init({ server: './app', httpModule: 'http2', https: true }); cwd ^ TOP Type: String Default: Note: requires at least version 2.23.0 Current working directory callbacks ^ TOP Type: Object ready - Default: undefined Register callbacks via a regular option - this can be used to get access the Browsersync instance in situations where you cannot provide a callback via the normal API (for example, in a Gruntfile) Note: Only the ready callback is currently supported here. var browserSync = require("browser-sync").create(); browserSync.init({ watch: true, server: "./app", callbacks: { /** * This 'ready' callback can be used * to access the Browsersync instance */ ready: function(err, bs) { // example of accessing URLS console.log(bs.options.get('urls')); // example of adding a middleware at the end // of the stack after Browsersync is running bs.addMiddleware("*", function (req, res) { res.writeHead(302, { location: "404.html" }); res.end("Redirecting!"); }); } } }); ghostMode ^ TOP Type: Object clicks - Default: true scroll - Default: true location - Default: true forms - Default: true Clicks, Scrolls & Form inputs on any device will be mirrored to all others. // Here you can disable/enable each feature individually ghostMode: { clicks: true, forms: true, scroll: false } // Or switch them all off in one go ghostMode: false logLevel ^ TOP Type: String Default: info Can be either "info", "debug", "warn", or "silent" // Show me additional info about the process logLevel: "debug" // Just show basic info logLevel: "info" // output NOTHING to the commandline logLevel: "silent" logPrefix ^ TOP Type: String Default: Browsersync Note: requires at least version 1.5.1 Change the console logging prefix. Useful if you're creating your own project based on Browsersync logPrefix: "My Awesome Project" // [My Awesome Project] Local URL: http://localhost:3000 // [My Awesome Project] Watching files.... // [My Awesome Project] File changed: "index.html" logConnections ^ TOP Type: Boolean Default: false // Log connections logConnections: true // Don't log connections logConnections: false logFileChanges ^ TOP Type: Boolean Default: true // Log information about changed files logFileChanges: true // Don't log file changes logFileChanges: false logSnippet ^ TOP Type: : Boolean Default: true Note: requires at least version 1.5.2 Log the snippet to the console when you're in snippet mode (no proxy/server) // Don't ever log the snippet logSnippet: false snippet ^ TOP Type: Boolean Default: undefined You can prevent Browsersync from injecting the connection snippet by passing snippet: false. // CLI browser-sync ./app -w --no-snippet // API const bs = require('browser-sync').create(); bs.init({ watch: true, server: "./app", snippet: false }) snippetOptions ^ TOP Type: Object async - Default: undefined blacklist - Default: undefined whitelist - Default: undefined rule.match - Default: /$/ rule.fn - Default: Function Note: requires at least version 2.0.0 You can control how the snippet is injected onto each page via a custom regex + function. You can also provide patterns for certain urls that should be ignored from the snippet injection. // Customise the placement of the snippet // and ignore certain paths snippetOptions: { // Ignore all HTML files within the templates folder ignorePaths: "templates/*.html", // Provide a custom Regex for inserting the snippet. rule: { match: /<\/body>/i, fn: function (snippet, match) { return snippet + match; } } } rewriteRules ^ TOP Type: Array Default: false Note: requires at least version 2.4.0 Add additional HTML rewriting rules. // Replace every occurrence of the word Browsersync with 'kittenz' rewriteRules: [ { match: /Browsersync/g, fn: function (req, res, match) { return 'kittenz'; } } ] // Also accepts a string as a replacement rewriteRules: [ { match: /(cats|kitten[sz]) are mediocre/g, replace: "$1 are excellent" } ] tunnel ^ TOP Type: String | Boolean Default: null // Tunnel the Browsersync server through a random Public URL // -> http://randomstring23232.localtunnel.me tunnel: true // Attempt to use the URL "http://my-private-site.localtunnel.me" tunnel: "my-private-site" online ^ TOP Type: Boolean Default: undefined Some features of Browsersync (such as tunnel) require an internet connection, but if you're working offline, you can reduce start-up time by setting this option to false // Will not attempt to determine your network status, assumes you're ONLINE. online: true // Will not attempt to determine your network status, assumes you're OFFLINE online: false open ^ TOP Type: Boolean | String Default: true Decide which URL to open automatically when Browsersync starts. Defaults to "local" if none set. Can be true, local, external, ui, ui-external, tunnel or false // Stop the browser from automatically opening open: false // Open the localhost URL open: "local" // Open the external URL - must be online. open: "external" // Open the UI - since 2.0.0 open: "ui" // Open the tunnel URL - must also set the `tunnel` option open: "tunnel" browser ^ TOP Type: String | Array Default: default // Open the site in Chrome browser: "google chrome" // Open the site in Chrome & Firefox browser: ["google chrome", "firefox"] cors ^ TOP Type: boolean Default: false Note: requires at least version 2.16.0 Add HTTP access control (CORS) headers to assets served by Browsersync. reloadOnRestart ^ TOP Type: Boolean Default: false Reload each browser when Browsersync is restarted. // don't auto-reload all browsers following a Browsersync reload reloadOnRestart: false notify ^ TOP Type: Boolean Default: true The small pop-over notifications in the browser are not always needed/wanted. // Don't show any notifications in the browser. notify: false scrollProportionally ^ TOP Type: Boolean Default: true scrollProportionally: false // Sync viewports to TOP position scrollThrottle ^ TOP Type: Number Default: 0 scrollThrottle: 100 // only send scroll events every 100 milliseconds scrollRestoreTechnique ^ TOP Type: String Default: 'window.name' Decide which technique should be used to restore scroll position following a reload. Can be window.name or cookie scrollElements ^ TOP Type: Array Default: [] Note: requires at least version 2.9.0 Sync the scroll position of any element on the page. Add any amount of CSS selectors // Sync the scrollTop position of the element .scroller // in addition to the window scroll scrollElements: ['.scroller'] scrollElementMapping ^ TOP Type: Array Default: [] Note: requires at least version 2.9.0 Sync the scroll position of any element on the page - where any scrolled element will cause all others to match scroll position. This is helpful when a breakpoint alters w'''
