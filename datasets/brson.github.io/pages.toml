["https://brson.github.io/the-end-of-unsafety"]
title = "The End of Unsafety"
full_description = '''Hello and thank you for joining us for this talk. We are honored to be here in Beijing for the first time. This age began in 1972, with the C language, and with Unix, and today it encompasses all that we see. Unsafety is at the foundation of the computing world. The internet is no longer safe, and the tools of the past are no longer up to the task of securing it. My name is Brian Anderson, and this is my friend Alex Crichton, and we are both on the core team of the Rust programming language, as well as being employed to work on Rust by Mozilla Research. Alex: I've been working on Rust since 2013, where I have been responsible for large portions of the standard library and the broader library ecosystem. I'm also etc. Brian: I've been working on Rust since 2010, involved in every aspect of its development. Much of my work has been in the standard library, tooling, platform support, community building. I have a special passion for software validation and ensuring that Rust is rock solid from release to release. Here's the link to the materials for this talk. It includes the slides, speaker notes, and plenty of links. We're going to talk a lot about Rust later, but the first part of this talk is mostly about the motivation for Rust. Before we get into that though, a little bit about what Rust is. Rust is first and foremost a high-performance, memory safe, systems programming language. And when I say "high-performance", I don't just mean it's fast, I mean it's among the very fastest programming languages. Think C, C++, and Fortran. And when I say "memory safe" I mean that Rust software does not crash, at least not in the way that languages like C and C++ do, where a crash can lead to unpredictable, and - most importantly - exploitable behavior. It accomplishes this by being designed completely around safe, zero-cost abstractions. The code you write corresponds quite directly to the code the machine runs. Accordingly, Rust has no runtime, and - crucially - no garbage collector. And this makes Rust extremely portable - Rust will run on just about anything with a CPU, everything from microcontrollers to supercomputers.'''
year_published = 2009
year_updated = 2013
