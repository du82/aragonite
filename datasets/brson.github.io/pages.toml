["https://brson.github.io/2022/09/21/move-impressions"]
title = "First impressions of the Move programming language"
full_description = "First impressions of the Move programming language 2022-09-21 Move is a new smart contract language that has been gaining momentum, with a unique set of design choices. I have been wanting to learn it since being told by a mentor that it was a language that interested them. Described in the paper Resources: A Safe Language Abstraction for Money, Move was originally developed for the defunct Libra / Diem project at Facebook, and is now used by several blockchains, most prominently Aptos and Sui. With Solana recently initiating an effort to port Move to its platform, and myself having some significant familiarity with the Solana codebase, and enjoying hacking on compilers and their runtimes, now seems like a good opportunity to see if I can get into Move. What I want to do here: check out, build, and test the move compiler find the learning resources find the standard API documentation run through a tutorial I would also like to learn about how the compiler is architected, and investigate the obstacles to translating Move to LLVM, but am not going to get that far today. The first few sections here will be a summary of my thoughts about Move, based on this experience, then the remainder will be a stream-of-consciousness journal of what I did. All the links in this blog post to the Move repo will refer to commit f3cba16754a0b986c24ce06b4bf698f86ccc65b9 so that they don’t break in the future. People reading this in the future might want to navigate on their own to the equivalent files in the master branch. Table of contents Summary Learnings Questions Move documentation Building and testing the compiler Running dev_setup.sh Debugging dev_setup.sh Extending the prover timeout Running the tutorial: steps 1 and 2 Running the tutorial: steps 3 and 4 Running the tutorial: steps 5 and 5 Writing a proof! Solana speculation Summary I had a lot of fun working through the move tutorial! The tutorial did a pretty great job, for such a young project, of leading me through concepts; the per-chapter exercises great — I want to be challenged to learn things on my own, and these lead me to learn useful things. There was less hands-on hacking in the tutorial than I expected though. I submitted a pull request fixing minor problems I saw in the tutorial. Move is obviously influenced by Rust in many ways, with ownership and borrowing, but also in its tooling. Some move source from the tutorial: struct Coin<phantom CoinType> has store { value: u64 } struct Balance<phantom CoinType> has key { coin: Coin<CoinType> } public fun setup_and_mint(account: &signer, amount: u64) { BasicCoin::publish_balance<MyOddCoin>(account); BasicCoin::mint<MyOddCoin>(signer::address_of(account), amount, MyOddCoin {}); } public fun transfer(from: &signer, to: address, amount: u64) { // amount must be odd. assert!(amount % 2 == 1, ENOT_ODD); BasicCoin::transfer<MyOddCoin>(from, to, amount, MyOddCoin {}); } Move looks like a relatively small language, with a bunch of restrictions — there is no dynamic dispatch — and a carefully-considered collection of type system features — generics, linear types, capabilities — that to me looks tantalizing to play with, to see what patterns can or can’t be used with Move. For a Rust programmer, Move looks fun. I can imagine it being infurating for those not experienced with restrictive static type systems. The Move tooling is surprisingly polished for such a young language, with testing, test coverage, and a simple theorem prover built in. It even has a package manager that I did not explore. Error messages were mostly actionable. I only had one that wasn’t helpful, and it was a parser error, parsers often having difficulty suggesting useful remediations. Check out this error, which led me straight to the solution to my bug: $ move prove [INFO] preparing module 0xcafe::BasicCoin [INFO] transforming bytecode [INFO] generating verification conditions [INFO] 6 verification conditions [INFO] running solver [INFO] 0.010s build, 0.002s trafo, 0.004s gen, 0.997s verify, total 1.014s error: abort not covered by any of the `aborts_if` clauses ┌─ ./sources/BasicCoin.move:49:5 │ 34 │ borrow_global<Balance<CoinType>>(owner).coin.value │ ------------- abort happened here with execution failure · 49 │ ╭ spec transfer { 50 │ │ let from_address = signer::address_of(from); 51 │ │ let from_balance = global<Balance<CoinType>>(from_address).coin.value; 52 │ │ aborts_if from_balance < amount; 53 │ │ 54 │ │ aborts_if !exists<Balance<CoinType>>(to); 55 │ │ } │ ╰─────^ │ = at ./sources/BasicCoin.move:44: transfer = at ./sources/BasicCoin.move:50: transfer (spec) = at ./sources/BasicCoin.move:51: transfer (spec) = at ./sources/BasicCoin.move:44: transfer = from = signer{0x4823} = to = 0x18be = amount = 0 = _witness = <generic> = at ./sources/BasicCoin.move:45: transfer = at ./../../../../move-stdlib/sources/signer.move:12: address_of = s = signer{0x4823} = at ./../../../../move-stdlib/sources/signer.move:13: address_of = result = 0x4823 = at ./../../../../move-stdlib/sources/signer.move:14: address_of = at ./sources/BasicCoin.move:66: withdraw (spec) = at ./sources/BasicCoin.move:45: transfer = at ./sources/BasicCoin.move:66: withdraw (spec) = at ./sources/BasicCoin.move:57: withdraw = addr = 0x4823 = amount = 0 = at ./sources/BasicCoin.move:58: withdraw = at ./sources/BasicCoin.move:33: balance_of = owner = 0x4823 = at ./sources/BasicCoin.move:34: balance_of = ABORTED Error: exiting with verification errors I ended up collecting a bunch of useful doc links in the “Move documentation” section of this post, and am looking forward to reading them. I wanted to investigate the Move compiler architecture more, to understand problems Solana might run into translating Move to LLVM, but I ran out of time, and am punting that to the future. I did quickly read this recent blog post about differences between Solana and Move; and the Move paper, but only have the barest feel for the challenges ahead, discussed briefly at the end of this post. Learnings Some of the things I learned from this experience. Run dev_setup.sh -ypt to get all the build and test prerequisits. This installs build tools (-t), theorem provers for testing (-y), and sets up the environment in ~/.profile (-p). Then run source ~/.profile to configure the environment. dev_setup.sh stores dotnet and boogie in ~/.dotnet; z3 and cvc5 in /usr/local/bin; other tools are installed via the system package manager. Modules decide at what address they are published, unlike other smart contract languages. This address can be configured in Move.toml, but it’s not clear to me yet if reconfiguring this value is easy or ideomatic. Decompile Move bytecode with move disassemble. Move has separate namespaces for types and modules: e.g. there is a primitive signer type and a std::signer module. The final argument to assert! is an “abort code”. Zero is a valid abort code, but does not indicate success (unlike process exit codes). An aborted transaction rolls back all state changes, across program calls. This is easy to reason about. The Move equivalent of crates.io is movey.net. Move has built-in test coverage: run move test --coverage then move coverage summary, etc. Every address has a type->value map for “resource” storage. This is an intuitive dynamically-extensible data structure while still being typed. The address of the std module is 0x1. Emacs’s rust-mode can colorize a Move buffer reasonably well. Indentation doesn’t work so great. The standard library is partially written in Rust, partially Move. has foo indicates a struct has the foo ability (not “trait”). Or is it capability? I seem to have seen both words used for this purpose. acquires Balance means a function accesses the Balance type from global storage. I don’t know why this is necessary, but I like that Move externalizes sided effects. Integer overflow aborts. Move has a built-in theorem prover that allows the behavior of functions to be verified. In specs, abort_if_is_strict is the default behavior, but pragra abort_if_is_partial, allows for only partial abort conditions to be specified. Questions Some of the questions I had but didn’t answer. Modules have a hard-coded address, and they are only published at that address. Does that mean that I can’t make multiple deployments of my dapp without changing the source? Why do tests declare signer parameters while also using attributes to declare those arguments concrete values? Why not create the signer in the test? Not possible? The signature needs to be simulated by the test runner? Does Move have macros? The book says assert! is a built-in “macro-like” operation. Does Move have error handling ideoms beyond hard-abort? Why does Move require acquires Balance annotations? Where is MAX_U64 defined? It appears to be is magically imported. Why can specs write overflowing expressions that “just work”, when regular Move has trapped overflows? I imagine the prover operates on natural numbers, not machine numbers. Move documentation I want to figure out what documentation is available, then I’ll pick a tutorial to follow. Starting from within the repo I see that within the language directory, there is a documentation directory. I’ll expect this to be the most up to date Move documentation since it’s closest to the source code. What’s here? A tutorial. This looks like the place to start for new devs. A book. Built with mdbook. Published at https://move-language.github.io/move/. Confusingly there is an entirely different unofficial “Move Book” at https://move-book.com. Specs!. Right now it’s just for the Move VM. It doesn’t look super complete, but definitely a good start. Examples. The naming of the two subdirs here doesn’t give me confidence: diem-framework and experimental. I wonder how up to date these are. Also: Changes. Not under documentation but seems to be accepted “RFCs” to change the language. std. Hand-written docs for the standard library. Not clear if these are published anywhere or are up to date. Move Prover User Guide. Docs for Move’s embedded theorem prover! Other resources: Resources: A Safe Language Abstraction for Money. The Move paper. Awesome Move. Seems to be the central collection of all Move stuff at the moment. Move Book. Seemingly completely different from the official Move book, and published at https://move-book.com. Smart Contract Development - Move vs. Rust. A recent blog post. Move Patterns Programming with Objects. A Sui tutorial. Move and Smart Contract Development. A StarCoin tutorial. The journal Everything else here is just a journal of my experience. Probably not of general interest. Perhaps of interest to Move devs and people searching for problems I hit. Building and testing the compiler The Move compiler is located at https://github.com/move-language/move The first thing I want to do is learn how to build, test, and run it from source. Since this is an immature language, and one that I would like to contribute to, I expect to deal directly with the source code. So I want to learn to navigate it from the start, and not just install the binary as would an end user. Since this is a Rust project I expect to be able to test it by just running cargo test, From skimming the README I know this project uses Docker, which I prefer not to bother with, and that it has developer instructions, but I’m just going to start the way I expect to start: $ cargo build && cargo test Compiling proc-macro2 v1.0.43 Compiling unicode-ident v1.0.3 Compiling syn v1.0.99 Compiling cfg-if v1.0.0 Compiling libc v0.2.126 ... 11:13:54 [INFO] 73 verification conditions FAILURE proving 10 modules from package `` in 1.304s test prove ... FAILED failures: ---- prove stdout ---- thread 'prove' panicked at 'called `Result::unwrap()` on an `Err` value: No boogie executable set. Please set BOOGIE_EXE', language/tools/move-cli/src/base/prove.rs:132:13 note: run with `RUST_BACKTRACE=1` environment variable to display a backtrace failures: prove test result: FAILED. 0 passed; 1 failed; 0 ignored; 0 measured; 0 filtered out; finished in 1.31s error: test failed, to rerun pass '-p move-stdlib --test move_verification_test' So it builds, but doesn’t test successfully out of the box. I expected that, as from perusing the tutorial while I build, I discover there is a dev_setup.sh script. Running dev_setup.sh Note: I am going to spend the next ~1700 words debugging dev_setup.sh, but my entire problem came from not running it — as the tutorial said to — with the -ypt arguments. From reading dev_setup.sh I can see why they offer a Docker-based build solution, as this installs a bunch of dev tools I don’t really want: Boogie, z3, cvc5, and Boogie requires .NET. Boogie is a “program verifier”. I don’t know exactly what that means but it seems to verify the implementation of programming languages, and it depends on a SAT solver, either z3 or cvc5. This is all encouraging for the implementation of the language, but kinda bleh for me as someone wanting to contribute. I bite the bullet and run this dev_setup.sh script: $ bash scripts/dev_setup.sh Welcome to Move! This script will download and install the necessary dependencies needed to build and run Move. Based on your selection, these tools will be included: Build tools (since -t or no option was provided): * Rust (and the necessary components, e.g. rust-fmt, clippy) * CMake * Clang * pkg-config * libssl-dev * if linux, gcc-powerpc-linux-gnu * NodeJS / NPM If you'd prefer to install these dependencies yourself, please exit this script now with Ctrl-C. Proceed with installing necessary dependencies? (y/N) > It has the courtesy to tell me what it’s going to do and let me cancel. So it also requires NPM … and a PowerPC cross-compiler. wtf. Ok, let’s do this: <tons of spew> ... Finished installing all dependencies. You should now be able to build the project by running: cargo build Well, there was a bunch of spew. It was interesting, but not interesting enough to reproduce here. I read through it all and it all appeared to work. It says I should be able to build now, though I could already build before. Can I test now? $ cargo test ... failures: ---- prove stdout ---- thread 'prove' panicked at 'called `Result::unwrap()` on an `Err` value: No boogie executable set. Please set BOOGIE_EXE', language/tools/move-cli/src/base/prove.rs:132:13 note: run with `RUST_BACKTRACE=1` environment variable to display a backtrace ... No. No BOOGE_EXE. Fortunately I already peeked at the tutorial and know that all the env vars I need are in ~/.profile and I need to “source” it: source ~/.profile And after that I still can’t complete the tests; $BOOGIE_EXE is not set. The dev_setup.sh script didn’t modify my ~/.profile at all! Which of the required tools do I have now? dotnet boogie - nope. not in ~/.dotnet/tools z3 - nope. not in /usr/local/bin cvc5 - nope. not in /usr/local/bin I also see that the script should have installed the Solidity compiler — for some reason — and it is also not where i"
