title = "First impressions of Rust programming on Solana"
full_description = '''First impressions of Rust programming on Solana 2021-06-08 Since trying out Rust programming on several other Rust blockchains, Aimee and I have been looking forward to test-driving Solana. And with Solana hosting a hackathon during May, it was a good opportunity to give it a try. During the hackathon we attempted to create a “sync bot”, that would sync the data from our in-development web app, Treasure Tree, to the Solana blockchain. Though it has a web server and centralized storage backend, the app was developed with a simple data model that was intended to be blockchain-compatible, such that the whole thing could be implemented without a web server. Summaries This blog is long and meandering, but I’ve attempted to sum up useful observations here. In general we enjoyed the experience, and it presented relatively few frustrating obstacles to writing the code we wanted. We felt excited about the code we were writing and looked forward to writing more. Things we liked The main documentation at docs.solana.com is a good entry point for most Solana subjects, is up to date, and interesting to read. The Solana Program Library is a great resource for learning Solana programming the hard way. It contains a bunch of production Solana code, but is also presented in a way that can be used as a learning tool. Smart use of resources. The Solana toolset and custom toolchain installed easily and didn’t cause us any grief. Setting up a devnet is easy. Solana programs are called “programs”, not “smart contracts”. The Solana programming model doesn’t impose typical smart contract abstractions on the implementation; it just gives you a low-level entry point function, a buffer of data for your program to interpret, and an SDK full of tools. No DSLs here. The developer channels on the Solana Discord are active. Although at the time it felt like a lot of the questions we asked in Discord went unanswered, in retrospect, many of them did get some kind of answer. A healthy sign I think. Things we learned In general, you’ll be ripgrepping the Solana Program Library a lot to figure out how things work. For writing Rust client code, crib off of the feature_proposal client. It is relatively simple. For Rust RPC clients, of the seemingly multiple options in the solana_client crate, use RpcClient. That is the type used in the SPL. We initially tried to use ThinClient, but that doesn’t seem to be the right type to use. The solana_cli_config crate will help you read the contents of Solana’s config files. Call solana_logger::setup_with("solana=debug"); before your program starts, or set the envvar RUST_LOG=solana_client=debug. This will show the logs from your program when it errors. When your program succeeds the logs show up in the output of the solana logs command. Use try_from_slice_unchecked to deserialize from buffers that are larger than the exact size of the serialized object. try_from_slice panics when the buffer is not exactly the right size. The instruction budget is very limited — we were not able to verify a single K-256 ECDSA signature on-chain within the limit, as such: Doing your own signature verification in-program is probably not the way to use Solana. The Solana runtime can verify multiple account signatures before your program ever runs, so a Solana program seemingly needs to be designed to leverage that capability when signature verification is needed. Solana programs have a pre-allocated and bounded storage size. This means it is probably an anti-pattern to store key-value maps directly. What seems to be an intended pattern for key-value storage is to derive the keys as Solana accounts from a single base account, and store the values in those accounts. Things that annoyed us The Rust API documentation is insufficient. Solana programs have access to the standard library, but it is a not-quite compatible version of the standard library. This was the source of multiple confusions, including: HashMap seems to just fail on any operation, which manifests as a mysterious access violation. We spent hours looking for our bug when we should have just not used HashMap; and time and anyhow don’t build against Solana’s std. anyhow can be built with the std feature off, but that loses compatibility with the Error trait. At least one function, read_keypair_file, returned Box<dyn Error>, which can’t be trivially converted to anyhow::Error with the ? operator. Errors in Rust really need to be Error + Send + Sync + 'static unless there is great reason not to. 4K BPF stack frames means some crates don’t work, including ed25519-dalek. Big stack frames trigger an access violation at runtime. First time I’ve ever encountered a limit like this. cargo build-bpf behaves differently than cargo-build in several situations, including missing the -p flag, and not working with libraries containing hyphens in their name. As with previous experiences, we found the online hackathon format uninspiring, and mostly didn’t participate. It felt like many questions on Discord went unanswered. This was annoying, but also understandable, and not out of the ordinary for an open source project. Sometimes nobody steps up to help. It just happens, but is discouraging. Questions we still have How do unimplemented features of std manifest at runtime? Errors? Panics? Aborts? Is it consistent? What is ThinClient in solana_client for? We tried to use it but that seemed to be a wrong choice. What does “spinner” mean in the context of RpcClient::send_and_confirm_transaction_with_spinner? What is the best pattern for initializing a Solana program’s state? We reserved a single byte at the beginning of our account data to use as an “initialized” flag. The outcome It went pretty well! We managed to create a “sync bot” that was able to mirror the state of our centralized web app on the blockchain, and set it up on a server at treasuretree.org, running against a local devnet. We did find that some of our assumptions about the types of code we could run on-chain were wrong. In particular we: planned to verify signatures ourselves planned to store unbounded key-value maps Neither of these are easy or proper to do on Solana: signature verification just requires too many CPU cycles; and programs have fixed storage space. As it stands our Solana program does not properly verify the signatures it needs to — it just accepts its input as valid. To fix this we need to restructure our cryptographic code within the rest of our application to do more Solana-specific signing operations. This is a bit of a bummer, as we were hoping to keep the application logic blockchain-agnostic. We also didn’t explore making our in-game “treasures” work as NFTs. Just ran out of time. We plan to continue hacking on this until we get it running on the mainnet. Table of contents The first day’s plan Installing the Solana SDK Looking at the install script Running a devnet Why eBPF? The Helloworld application A look at the Rust contract Integrating Solana into our project Writing a Solana program in Rust Writing a Solana client in Rust Reproducing the Helloworld example client but in Rust Building a Solana instruction Getting beneath the instruction limit A few more obstacles Wrapping it up The first day’s plan Today is the 17th. The hackathon began on the 15th, but we’re just starting now after moving Airbnbs. Our plan today is to join the Solana hackathon Discord channels, install the Solana SDK, and run some hello world example. While we get started, we open one of the video sessions we missed, this one an intro to “the Solana programming model”. We learn that “everything is an account” storage costs rent accounts can be pre-paid for 2 years contracts don’t hold state (not sure what that means yet) at least some tokens don’t require creating new contracts program-derived accounts don’t have a knowable private key, but can still sign transactions (or something). This sounds like it solves a problem I have been having understanding how to build distributed applications, but I’ll have to investigate further. the solana-program-library is something I should get to know. Installing the Solana SDK I want to install the Solana SDK, tools, or whatever I need. I assume there’s something SDK-like I need. The hackathon docs contains some educational links, and I folow the first to the Solana docs website. The first link is “Start Building”, and that sounds good. This page says “To start developing immediately you can build, deploy, and run one of the examples.” That’s exactly what we want to do. So now we’re following the helloworld example docs. I run $ git clone https://github.com/solana-labs/example-helloworld.git And am directed to continue by following the hello-world README, so I do so. This flow is a bit confusing, as the “examples” page proceeds directly from “Helloworld”, to “Break”, which is an entirely different example. Though the instructions do say to continue to the Helloworld readme, Aimee succumbs to this confusion, and proceeds to try to follow “Break”. The correct thing to do is stop here, navigate to the Helloworld readme, and continue there. This example is so well documented that the README has a table of contents. I am encouraged by this. This example requires node > 14. Aimee immediately runs into problems on mac: she seems to have node 10, tries to upgrade with brew, but brew complains because her node and yarn are not from brew. This happens all the time with her computer — she has forgotten how she installed node last time. We discover she has nvm installed and sort things out. We’re both on node v16.1.0. We run these things: $ nvm install stable $ nvm use stable $ rustup update stable And now, “install Solana v1.6.6 or later”, the instructions for which are back on the Solana docs site. I run $ sh -c "$(curl -sSfL https://release.solana.com/v1.6.9/install)" Looking at the install script While that is running, I download and read the script, which I have gisted here. I open it and am so pleased. At the top I see: # Copyright 2016 The Rust Project Developers. See the COPYRIGHT # file at the top-level directory of this distribution and at # http://rust-lang.org/COPYRIGHT. and then # This is just a little script that can be downloaded from the internet to # install solana-install. It just does platform detection, downloads the installer # and runs it. This is a fork of rustup’s install script, which I wrote, and which, as I discovered previously, Dfinity also uses. I see a peculiar comment at the top: { # this ensures the entire script is downloaded # This isn’t in the rustup-init.sh script. I haven’t seen this technique before of just throwing a set of braces around the entire shell script, and wonder how compatible it is. Scripts downloaded from the internet and immediately piped through an interpreter need to guard against issues where the script fails to download fully and so is only partially executed. That’s what this brace is about. rustup-init.sh attempts to achieve this by essentially not executing any code until a single function call at the end of the script. And so I am slightly afronted that somebody just threw braces around the whole thing, as though saying my original work was insufficient. Alas, I can imagine a scenario where the brace-around-everything technique could catch an error that rustup-init.sh doesn`t, so this is something to consider if I ever find myself writing a shell script to be piped from the internet again; which I hope I never do. Running a devnet The install succeeds and I have the Solana tools: $ solana --version solana-cli 1.6.9 (src:9e42883d; feat:2960423209) I continue to configure the CLI per the Helloworld readme: $ solana config set --url localhost Config File: /home/brian/.config/solana/cli/config.yml RPC URL: http://localhost:8899 WebSocket URL: ws://localhost:8900/ (computed) Keypair Path: /home/brian/.config/solana/id.json Commitment: confirmed What does this tell us? We have a global config file, for me it’s in the XDG-standard ~/.config/solana directory, Solana’s default RPC port is 8899, Nodes can also communicate over WebSockets We have an account keypair set up for us, the exact purpose for which is not clear, but I assume is a dev keypair “Commitment: confirmed” — I have no idea. The next instruction is to create a keypair, but solana config says I already have a keypair. I am guessing I have previously installed the Solana SDK, and it is an old keypair. I begin to generate a new one: $ solana-keygen new Generating a new keypair For added security, enter a BIP39 passphrase NOTE! This passphrase improves security of the recovery seed phrase NOT the keypair file itself, which is stored as insecure plain text BIP39 Passphrase (empty for none): This is going to be a dev key and I don’t care about recovering it. I leave the passphrase blank and just hit “enter”. Wrote new keypair to /home/brian/.config/solana/id.json ================================================================================== pubkey: C4NEJZc432PWEDvYR6LiBWCv7wvfdJWDppLscL42R3aD ================================================================================== Save this seed phrase and your BIP39 passphrase to recover your new keypair: engage possible prison twin control language talk cactus hobby vehicle allow blush ================================================================================== Again, this is a garbage dev key. I am fine printing the seed phrase on the internet. I run a devnet node in one terminal: $ solana-test-validator Ledger location: test-ledger Log: test-ledger/validator.log Identity: GZr7zHFUxA7kjGgzUsUuRfQtNASBCGurynEg7yUDcfvP Genesis Hash: F945qQyeHDUXN58eUWuLHLogAZ7Qgkpucc7xe8LisQnR Version: 1.6.9 Shred Version: 54687 Gossip Address: 127.0.0.1:1025 TPU Address: 127.0.0.1:1027 JSON RPC URL: http://127.0.0.1:8899 ⠒ 00:00:08 | Processed Slot: 16 | Confirmed Slot: 16 | Finalized Slot: 0 | Snapshot Slot: - | Transaction And the log monitor in another: $ solana logs Streaming transaction logs. Confirmed commitment Nother further happens. Probably because there are no transactions on my devnet. That’s as far as I get for the night. I like everything I’m seeing so far: the docs have directed me well, the tooling has worked cleanly. Why eBPF? After reading about Solana’s use of BPF, I ask in their Discord a question that I have been wondering for a few weeks: Can somebody from Solana remind me why Solana uses BPF as its instruction set? I thought it was because BPF was not turing complete and programs could be verified to terminate, but I’ve recently been informed that is not the case Nobody answers, but I may have asked in the wrong channel. A ask again in #hack-blockchain-support: What advantages does solana get from targeting eBPF, vs any other instruction set, for its VM? Been trying to get an answer to this for awhile. Somebody responds by pinging “chase || solana”, and asking them to ask a Solana dev to explain, but that explanation never comes. S'''
year_published = 2021
year_updated = 2021
