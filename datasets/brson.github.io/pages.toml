title = "First impressions of Rust smart contracts with Substrate and Ink, part 3"
full_description = 'First impressions of Rust smart contracts with Substrate and Ink, part 3 2020-12-03 This is part 3 of my 3 part series on getting started with Substrate and Ink. Part 1: Wandering around the Polkadot docs Part 2: Building a blockchain with Substrate Part 3 (this part): Creating a contract with Ink and running it on the Canvas network In the previous post I built and ran my own Substrate-based blockchain, thinking that would be a necessary step toward writing a smart contract for Substrate. Now I’m going to try to actually write a Substrate contract in Ink. In this post Really, let’s write an ink contract Creating an ink project Building for wasm Interlude: What the ink macros actually emit Running a canvas dev node Running my own canvas-ui Uploading a contract to a canvas devnet Executing the contract in the canvas-ui The contract bundle Wiping the dev chain Aside: canvas-ui gets out of sync with the on-chain state (Failing to) deploy from the command line In Conclusion Really, let’s write an ink contract Ok, I’ve gotten lost in the docs and don’t actually know where to look to start writing a smart contract. I’m going to go to the Substrate Tutorial Catalog and see if there’s an ink tutorial there. There is: https://substrate.dev/substrate-contracts-workshop/ It’s got a cute crab picture on the front page. I notice that this tutorial has a different visual style than the last one, even though they are on the same site. It looks like this one was designed as a slide deck for a workshop, so it’s understably presented differently, but I am starting to get the impression that even though there’s quite a lot of Substrate/Polkadot docs, they are inconsintently integrated into a single, comprehensible, whole. On first glance, this tutorial appears to re-cover the substrate node setup we’ve already done to this point. So probably we could have just started right here, and not done the previous tutorial. (Hero Bird later tells me that this is a good place to start learning Ink). This includes similar instructions for setting up the nightly toolchain: rustup component add rust-src --toolchain nightly rustup target add wasm32-unknown-unknown --toolchain stable And I note that it does not mention the specific nightly-2020-10-05 toolchain that we found works. So probably anybody that runs this tutorial, like the last one, is going to run into mysterious build errors. I plan to attempt to follow the build commands as-written in the tutorial, then adjust them as needed to use the working toolchain. The first step in the tutorial that I haven’t already done is “Installing the Canvas Node”. I don’t know what a canvas node is, but let’s do it. The command for it is cargo install canvas-node --git https://github.com/paritytech/canvas-node.git --tag v0.1.3 --force So canvas-node is some kind of tool, written in Rust. I open the canvas-node GitHub. It is described as “Node implementation for Canvas, a Substrate chain for smart contracts.” I’ve learned something new. The earliest docs led me to believe there were no live parachains for smart contract development, then we learned about Moonbeam, and now we learn about Canvas. It seems like the previous work we did to build our own Substrate chain was not needed at all, and that for now we are going to be using Canvas. I check the latest tags for canvas-node and v0.1.3 is the latest, so the tutorial is up to date. I run the command to install canvas-node. The command fails during the build: Compiling sc-cli v0.8.0 (https://github.com/paritytech/substrate#11ace4ef) error[E0107]: wrong number of type arguments: expected 10, found 9 --> node/src/service.rs:157:14 | 157 | let aura = sc_consensus_aura::start_aura::<_, _, _, _, _, AuraPair, _, _, _>( | ^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^ expected 10 type arguments It’s a build failure. I clone canvas-node myself, check out the same version from tag v0.1.3, and build it git clone https://github.com/paritytech/canvas-node.git cd canvas-node git checkout v0.1.3 cargo build --release Surprisingly this build succeeds. I note in the output of both builds, the substrate git revision being compiled is different in the cargo install invocation than the cargo build invocation from inside the repo: $ cargo install canvas-node --git https://github.com/paritytech/canvas-node.git --tag v0.1.3 --force ... Compiling sc-offchain v2.0.0 (https://github.com/paritytech/substrate#11ace4ef) Compiling sc-informant v0.8.0 (https://github.com/paritytech/substrate#11ace4ef) ... $ cargo build --release ... Compiling sc-consensus-slots v0.8.0 (https://github.com/paritytech/substrate#cab98654) Compiling substrate-build-script-utils v2.0.0 (https://github.com/paritytech/substrate#cab98654) ... In one it cargo is using commit 11ac, the other cab9. cab9 is the correct one per the lockfile, so it seems like cargo install is ignoring the lockfile. I google for “cargo install ignores lockfile” and find a relevant issue. It’s a long thread from 2019 and I don’t read it all, but it seems like this is a bug. The thread indicates there’s a new --locked flag that should obey the lockfile. I try the original cargo install command again, but this time with --locked: $ cargo install canvas-node --git https://github.com/paritytech/canvas-node.git --tag v0.1.3 --force --locked This works. I submit a PR to fix the tutorial. The canvas-node release build takes 31 minutes. That’s pretty rough, even for a Rust project. Creating an ink project Moving on to the next step: https://substrate.dev/substrate-contracts-workshop/#/0/creating-an-ink-project I create a new contract with cargo contract $ cargo contract new flipper Created contract flipper This creates a new flipper directory containing Cargo.toml and lib.rs, so a simple Rust library. Cargo.toml: [package] name = "flipper" version = "0.1.0" authors = ["[your_name] <[your_email]>"] edition = "2018" [dependencies] ink_primitives = { version = "3.0.0-rc2", default-features = false } ink_metadata = { version = "3.0.0-rc2", default-features = false, features = ["derive"], optional = true } ink_env = { version = "3.0.0-rc2", default-features = false } ink_storage = { version = "3.0.0-rc2", default-features = false } ink_lang = { version = "3.0.0-rc2", default-features = false } scale = { package = "parity-scale-codec", version = "1.3", default-features = false, features = ["derive"] } scale-info = { version = "0.4.1", default-features = false, features = ["derive"], optional = true } [lib] name = "flipper" path = "lib.rs" crate-type = [ # Used for normal contract Wasm blobs. "cdylib", ] [features] default = ["std"] std = [ "ink_metadata/std", "ink_env/std", "ink_storage/std", "ink_primitives/std", "scale/std", "scale-info/std", ] ink-as-dependency = [] It links to a bunch of ink crates, as well as crates for something called “scale”, it also turns on a bunch of “std” features. That’s curious because it implies ink contracts will use the standard library. Since contracts don’t run in a traditional OS, I wonder if they have their own fork of std, or otherwise what this means. This tool also has put lib.rs in a nonstandard place, in the top-level directory instead of a src subdirectory. Personally, I’m ok with that, and some of my own multi-crate projects do the same to avoid a proliferation of src dirs that don’t accomplish much while also making project directory traversal more tedious. For a standard tool though I might expect this to follow the standard layout. This project is also a cdylib. That might suggest that it is using a special loading scheme, or maybe all wasm projects are output as “cdylibs”. The lib.rs file: #![cfg_attr(not(feature = "std"), no_std)] use ink_lang as ink; #[ink::contract] mod flipper { /// Defines the storage of your contract. /// Add new fields to the below struct in order /// to add new static storage fields to your contract. #[ink(storage)] pub struct Flipper { /// Stores a single `bool` value on the storage. value: bool, } impl Flipper { /// Constructor that initializes the `bool` value to the given `init_value`. #[ink(constructor)] pub fn new(init_value: bool) -> Self { Self { value: init_value } } /// Constructor that initializes the `bool` value to `false`. /// /// Constructors can delegate to other constructors. #[ink(constructor)] pub fn default() -> Self { Self::new(Default::default()) } /// A message that can be called on instantiated contracts. /// This one flips the value of the stored `bool` from `true` /// to `false` and vice versa. #[ink(message)] pub fn flip(&mut self) { self.value = !self.value; } /// Simply returns the current value of our `bool`. #[ink(message)] pub fn get(&self) -> bool { self.value } } /// Unit tests in Rust are normally defined within such a `#[cfg(test)]` /// module and test functions are marked with a `#[test]` attribute. /// The below code is technically just normal Rust code. #[cfg(test)] mod tests { /// Imports all the definitions from the outer scope so we can use them here. use super::*; /// We test if the default constructor does its job. #[test] fn default_works() { let flipper = Flipper::default(); assert_eq!(flipper.get(), false); } /// We test a simple use case of our contract. #[test] fn it_works() { let mut flipper = Flipper::new(false); assert_eq!(flipper.get(), false); flipper.flip(); assert_eq!(flipper.get(), true); } } } So the first thing this does is conditionally turn off std. Now I have an idea of why the manifest has a bunch of std features: given the presence of unit tests here, I guess that, when testing, the ink libraries are built with mock capabilities that depend on the standard library, and when not testing, they are built with capabilities derived from the substrate no-std runtime. This file has a bunch of ink attributes, which surely invoke complex code-generation macros. This is typical of Rust smart contracts, but also of embedded Rust projects generally: these types of programs have their own non-standard runtime setup that is just a bunch of boilerplate, and hiding that boilerplate beneath macros is often seen as desirable. The Rust standard library itself does a similar runtime setup routine before executing a standard main function. I would be curious to see the underlying code emitted by these macros. We see here several macros and here are my guesses as to what they do. These are just guesses! #[ink::contract] - emit whatever entry point is required by the Substrate runtime. Also establish a context for interpreting the remaining ink macros. #[ink(storage)] - emit the special serialization required by smart contract storage. #[ink(constructor)] - emit the appropriate runtime method dispatch for constructing the Flipper contract and serializing it into the blockchain. #[ink(message)] - emit the appropriate runtime method dispatch for running smart contract methods. The use of these macros is probably why ink is described as an “embedded domain specific language”. I’m curious if there are other aspects of the ink library that make it a DSL, but so far this is pretty lightweight as a DSL, just plain Rust with some runtime glue. Which is a good thing to my mind. I see that the unit tests aren’t doing any special mock setup in order to test contracts. I’m guessing that is because the std features do that themselves. This contrasts with NEAR, where mocking is set up manually in code. I don’t have enough experience yet to know which approach to prefer. The contract itself is trivial: initialize a contract that bears a boolean, optionally with a value. Call flip to change the value; call get to read the value. Testing requires nightly: $ cargo +nightly test Running target/debug/deps/flipper-4dfd5047053abd9b running 2 tests test flipper::tests::default_works ... ok test flipper::tests::it_works ... ok test result: ok. 2 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out Oh, no it doesn’t: $ cargo test Running target/debug/deps/flipper-2d62f1e2378cf363 running 2 tests test flipper::tests::default_works ... ok test flipper::tests::it_works ... ok test result: ok. 2 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out Maybe the tutorial is just priming the reader to always build with nightly, since presumably the final wasm contract requires nightly. Building for wasm Continuing at the next page of the tutorial: https://substrate.dev/substrate-contracts-workshop/#/0/building-your-contract Substrate contracts are compiled to wasm. The cargo contract tool that we installed earlier handles some of the details of choosing the wasm target. The command to compile the contract is $ cargo +nightly contract build [1/3] Building cargo project Downloaded compiler_builtins v0.1.36 Downloaded 1 crate (155.3 KB) in 0.41s Compiling compiler_builtins v0.1.36 Compiling core v0.0.0 (/home/ubuntu/.rustup/toolchains/nightly-x86_64-unknown-linux-gnu/lib/rustlib/src/rust/library/core) Compiling rustc-std-workspace-core v1.99.0 (/home/ubuntu/.rustup/toolchains/nightly-x86_64-unknown-linux-gnu/lib/rustlib/src/rust/library/rustc-std-workspace-core) Compiling alloc v0.0.0 (/tmp/cargo-xbuildIjCczX) Finished release [optimized] target(s) in 17.01s Compiling proc-macro2 v1.0.24 ... Well, this is interesting - cargo contract builds the core library itself. I wonder why. It’s a rare thing to do. Let’s look at cargo-contract. Here’s its underlying invocation of cargo, reproduced here: std::env::set_var( "RUSTFLAGS", "-C link-arg=-z -C link-arg=stack-size=65536 -C link-arg=--import-memory", ); let cargo_build = |manifest_path: &ManifestPath| { let target_dir = &crate_metadata.cargo_meta.target_directory; util::invoke_cargo( "build", &[ "--target=wasm32-unknown-unknown", "-Zbuild-std", "-Zbuild-std-features=panic_immediate_abort", "--no-default-features", "--release", &format!("--target-dir={}", target_dir.to_string_lossy()), ], manifest_path.directory(), verbosity, )?; Ok(()) };``` So ink’s build tool is customizing the build heavily, passing arguments to the wasm linker via rustc using the RUSTFLAGS environment variable, and also setting a variety of cargo flags, some unstable. Let’s look at some of them: -C link-arg=-z -C link-arg=stack-size=65536. -C link-arg= is the way to tell rustc to pass flags to the linker. From the wasm32 target spec we see that the linker for wasm is lld, the linker from the LLVM project. So if we go to the lld documentation for wasm we can probably find out what these flags do. This invocation is fascinating: the underlying arguments to lld here are -z stack-size=65536, but to tell rustc to pass these arguments, takes two invocations of -C link-args. Pretty ugly. Anyway, what seems to be happening here is that cargo contract is telling rustc to tell lld to set the size of the main stack to 64k. I don’t know where the documentation for this flag is though. A Google search suggests this may be a wasm-specific lld flag. -C link-arg=--import-memory This one should be easier to understand, as it is documented direct'
