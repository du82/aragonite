title = "Creating wasm-opt Rust bindings with cxx"
full_description = 'Creating wasm-opt Rust bindings with cxx 2022-10-26 wasm-opt is a component of the Binaryen toolkit, written in C++, that optimizes WebAssembly modules, I have recently created a wasm-opt bindings crate for Rust (with the extensive help of my partner Aimeedeer). The wasm-opt crate allows wasm-opt to be installed via cargo, and also includes an idiomatic Rust API to access wasm-opt programmatically. This was a fun bite-sized project that involved several interesting topics: Rust FFI via the cxx crate, converting C++ abstractions to Rust abstractions, designing Rust APIs, creating tests to catch upstream changes in C++ code, creating tests to verify conformance with upstream behavior, and the experience of writing and fulfilling a grant proposal, all of which I will describe herein. Thanks to Alon Zakai, David Tolnay, Marcin Górny, Michael Müller, and Robin Freyler for their contributions to and support of this work. Thanks to the Web3 Foundation for funding this project. Table of Contents Preface: Installing and using the wasm-opt crate Summary The plan: Our bin strategy The plan: Our cxx lib strategy Six layers of abstraction Building Binaryen without cmake Dividing the FFI between crates Linking to crates that contain no Rust code Creating a Rust bin with a non-Rust main function cxx and Binaryen Defining cxx bindings Our C++ shim layer Moving owned strings across the FFI with cxx A better shim pattern for non-const methods Lifetimes in cxx (Custom) exception handling with cxx Sharing C++ headers between crates with cxx_build A Rusty API Toolchain integration considerations and a Command-based API Testing for maintainability Outcome and future plans Appendix: The W3F grant experience Preface: Installing and using the wasm-opt crate If you are interested in using this tool, to install wasm-opt via cargo: cargo install wasm-opt --locked You’ll end up with a wasm-opt binary in $CARGO_HOME/bin, and it should work exactly the same as the wasm-opt you install from any other source: $ wasm-opt -Os infile.wasm -o outfile.wasm To use wasm-opt as a library, follow the API docs. Basic usage looks like use wasm_opt::OptimizationOptions; let infile = "hello_world.wasm"; let outfile = "hello_world_optimized.wasm"; OptimizationOptions::new_optimize_for_size() .run(infile, outfile)?; Summary We decided to build this after a recent experience with cargo-contract, the tool for building Ink! programs, in which we had to go “outside” the Rust ecosystem to find and install wasm-opt (downloading and extracting a tarball from GitHub, setting up PATH). A minor inconvenience, but as a Rust programmer working with a Rust toolset I want to cargo install whenever I can. Many platforms that use wasm as their VM end up creating their own tools for building and packaging their wasm programs, and many of those delegate to wasm-opt to shrink their output. So making wasm-opt available as a Rust crate seemed like an obviously useful thing to do for both cargo-contract and all Rust-based wasm-targeting tools. We proposed a W3F grant to build it, which was accepted gladly. This was a perfect subject for a grant: clear benefit, clear scope, low risk. And it worked out almost exactly as expected. We had the opportunity to use the cxx crate, which creates safe Rust bindings to C++ code, for the first time; and had to solve a bunch of minor problems including: giving the C++ API a shape suitable for binding to Rust, dealing with the differing move semantics of C++ and Rust, working around C++ const-correctness issues, exception handling between FFI layers. We needed to make one upstream Binaryen change. We were happy with the decision to use cxx. It worked as advertised: we didn’t have to think much about memory-safety across the FFI as cxx guided us to the safe solutions. The cxx docs are pretty great, with good API docs, and a book. The table showing the correspondence between C++ and Rust types is invaluable. While leveraging Binaryen’s module readers / writers and optimization passes, we ended up duplicating the application-level logic of the wasm-opt program itself in Rust, as wasm-opt is a command-line program not suitable to use as a library. This duplication necessitated writing carefully chosen tests to both help ensure that the crate’s behavior matches the CLI’s, but also that as Binaryen changes in the future we notice those changes and adapt to them. In the end we had six layers of Rust abstractions, including C++ shims for all the C++ APIs we needed, a Rust-style builder API, and a nearly-complete reimplementation of wasm-opts own CLI argument parsing on top of the builder. This feels like overkill for such a small project, but they all have a clear role in the stack, and several layers are doing simple transformations around the FFI boundary. Prior to publication of this blog post we asked David Tolnay (dtolnay), the author of cxx to review our usage of his library. He made many insightful suggestions and contributions, some of which I’ll pass on here. The next sections discuss our objectives at the outset of the project, then the bulk of this post is about our experience attempting to fulfill them. Links to wasm-opt-rs point to commit bae78101. Links to Binaryen point to commit c74d5eb6, corresponding to version 110. The plan: Our bin strategy The intent of this project was to make wasm-opt available to Rust programmers in two ways: as a command-line program via cargo install, and as a Rust library. When installing the CLI program the resulting binary must behave the same as the “native” Binaryen. The obvious way to do that is to just use cargo as a frontend to the existing Binaryen build system, building wasm-opt in the cargo build script, and installing wasm-opt during cargo install. This can’t be done quite so simply though because there are no programmable hooks into cargo install. cargo will install any Rust binaries it builds directly, but it can’t be instructed to install arbitrary additional files. So to get cargo to install wasm-opt, we would create a Rust crate called wasm-opt whose main function did nothing but call the C++ main function. There would be some minor wrinkles to this strategy, and it turns out that there is a much simpler way to use a C++ main function than calling it from Rust, but this is the easy part of the project. The plan: Our cxx lib strategy The hard part of this project would be wrapping Binaryen APIs in a Rust FFI, layering on top of that an idiomatic Rust API, capturing all the features of the underlying tool, and ensuring that they worked the same. We proposed to use the cxx crate for the FFI. Though we had never used it, and had no sense of how it worked or would work for our purpose, it is created by dtolnay, who has designed many excellent Rust libraries, so we were enthusiastic to try it. On top of the cxx API we would layer an idiomatic Rust API, though we did not know at the outside the form it would take. Both the lib and bin would live in the same wasm-opt crate, a decision with tradeoffs. Six layers of abstraction This project ended up defining six clear layers of abstraction, which strikes me as a lot, but on examination I don’t want to get rid of any of them. Some of them are imposed by the nature of FFI, and seem worth enumerating. Most of this post will be walking through the process of building these from bottom to top. The C++ shims. A tiny layer of types and methods that wrap the Binaryen types, but present an interface that is easy to call via cxx bindings. The cxx declarations. The declarations used to auto-generate safe Rust types and C++ glue. The base API. This layer does several bits of API cleanup so other modules don’t have to deal with FFI issues: encapsulates cxx::UniquePtr<SomeBinaryenType> in a Rust struct, uses Rust naming conventions instead of Binaryen’s C++ conventions, handles pinning as required by cxx, handles conversion of Path to platform-specific string types, etc. The OptimizationOptions configuration types and the run method. This is the heart of the Rust API: create OptimizationOptions and call run. The configuration types contained in OptimizationOptions closely mirror the wasm-opt command-line options. Their definitions spill across several modules but they all are reexported at the crate root. The run method duplicates the application-level logic of the wasm-opt binary in Rust. The OptimizationOptions builder methods. Overlaid onto OptimizationOptions. Most methods are obvious one-liners. The Command interpreter. This constructs OptimizationOptions by interpreting the arguments to Rust’s Command type for launching processes. It’s a bit of extravagance: it essentially duplicates wasm-opt’s own command-line parser. Originally intended to make it easier for projects that already invoke the wasm-opt process to integrate the API, It ended up being invaluable for testing: we can run all three of 1) the real wasm-opt, 2) our Rust binary wasm-opt, and 3) our library; all in the same way, ensuring they all behave the identically. Building Binaryen without cmake We gave ourselves one extra challenge: do not use any build system external to cargo. We want to impose as few requirements on wasm-opt embedders as possible, and Binaryen is a relatively simple codebase, so we decided not to use Binaryen’s build system (CMake-based) to build Binaryen. Instead we built Binaryen in a cargo build script using the cc crate. This build script lives in the wasm-opt-sys crate, *-sys crates being special cargo convention for managing access to native libraries. The cc crate compiles C and C++ source files, packages them into an archive (.a) file, and emits the correct metadata to tell cargo to include the archive in the crate’s library (.rlib) file, and subsequently in the final executable. It is widely used in the Rust ecosystem and contains a great deal of platform-specific, toolchain-specific knowledge about how to drive various parts of the C/C++ toolchain. But it is mostly intended for building small bits of code to supplement Rust crates. It is not a full build system. Writing our custom build script for Binaryen was the first step of the project. The build script ended up being more complex than I would prefer, and will present more debugging challenges when upgrading Binaryen in the future, but it was all implementable without great difficulty. The initial task was to simply discover all the .cpp files that needed to be compiled into wasm-opt — Binaryen encompasses multiple tools and not all of them require all of the source files. We did this the brute-force way: write a build script that compiled only wasm-opt.cpp, run the build until the link step, at which point the linker would emit many errors about missing symbols; grep the source for the likely source of a single symbol; add the new source, build again and repeat until there were no more linker errors. That strategy nearly worked completely, except for a few obstacles: The first was an unexpected surprise: The cc crate, generally intended for building a handful of files, not entire applications, puts all of its output object files in the same directory (cargo’s OUT_DIR for that crate), regardless of the original source structure. This bit us because Binaryen has two source files called intrinsics.cpp, causing cc to want to create two object files in the same location called intrinsics.o. We created a hacky workaround: for one of these two files we call a function, disambiguate_file, that copies a source file to a new location while giving it an unambiguous name: let file_intrinsics = disambiguate_file(&ir_dir.join("intrinsics.cpp"), "intrinsics-ir.cpp")?; Like the object files, the disambiguated source file gets put in OUT_DIR: fn disambiguate_file(input_file: &Path, new_file_name: &str) -> anyhow::Result<PathBuf> { let output_dir = std::env::var("OUT_DIR")?; let output_dir = Path::new(&output_dir); let output_file = output_dir.join(new_file_name); fs::copy(input_file, &output_file)?; Ok(output_file) } The second and third obstacle were due to preprocessing done by Binaryen’s build system. When configuring its build Binaryen creates a config.h file that contains Binaryen’s version number. This number can either come from the CMakeLists.txt configuration file, or from parsing the output of git. Since we already knew one of our prospective clients was parsing the wasm-opt version, we decided to reproduce this behavior exactly, and our build script has two functions that pull the version number from each place and put them into config.h as appropriate. Binaryen’s build configuration also hex-encodes and embeds a binary called wasm-intrinsics.wat into its source code. So we again had to reproduce that logic. Adapting our custom build process to Binaryen as it changes in the future will likely be the most difficult ongoing maintenance task on this project. We have already performed one upgrade, from version 109 to 110, and it involved resolving link errors and adding source files until everything linked again. Dividing the FFI between crates From our experience getting the wasm-opt-sys crate to build we knew that rebuilding that crate took a long time, multiple minutes on my underpowered laptop. This is because the cc crate doesn’t support any kind of incremental recompilation: any time the wasm-opt-sys crate needs to rebuild, it compiles every C++ file in the project. The lack of incremental recompilation within cc is intentional — cc is not a full build system. We could just use an external CMake, and we also considered adding a basic, if imperfect, caching layer on top of cc that would make development faster. But we still did not want to introduce an external build tool, and while creating that caching build system sounded fun, it seemed out of scope for our grant. Instead we decided to create a division of responsibilities between the crates in our project that would minimize the amount of rebuilding we needed to do during development: we put essentially no Rust code in the wasm-opt-sys crate, no Rust bindings at all. That way, once we were done figuring out how to successfully build Binaryen, we wouldn’t continually invalidate the Binaryen build while hacking on Rust code. This is not how -sys crates typically work. They usually include the lowest level of Rust bindings. But we just used wasm-opt-sys to build and link our native code. Instead we settled on this division of responsibilities between crates: wasm-opt-sys - Just build the native library. wasm-opt-cxx-sys - Create the Rust bindings to the native library via cxx. cxx emits both Rust and C++ at build time, so this crate is also performing a native build. In typical bindings this crate would be part of wasm-opt-sys. wasm-opt - The library and binary, with both a lib.rs and main.rs, calling Binaryen code via wasm-opt-cxx-sys. Editing either wasm-opt-cxx-sys or wasm-opt does not invalidate wasm-opt-sys, so during development we don’t need to sit through rep'
