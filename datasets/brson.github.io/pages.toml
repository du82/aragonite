["https://brson.github.io/2021/03/09/further-adventures-with-substrate-and-ink"]
title = "Further adventures with Substrate and Ink"
full_description = '''Further adventures with Substrate and Ink 2021-03-09 During my last series of bloggings about Substrate, I intended to explore ink!, Parity’s DSL library for writing smart contracts in Rust. Those posts though mostly ended up being about setting up the appropriate development environment, and my failures along the way. I remain though interested in learning Substrate, and in particular smart contract programming in Rust on Substrate. So in the time since that last exploration, Aimee and I have envisioned a small project to hack on that will guide us to learn more about Substrate/Ink development. This report will be about our experiences beginning to implement that project. It is broadly divided into three sections: contract implementation with Ink, client implementation with polkadot.js, and some concluding thoughts. A lot of this post is tedious details that will probably only be interesting to the product developers, but I’ve tried to summarize some of the useful bits in the “learnings and tips” section near the end, and the final section is a bit of a rant about my experience learning smart contract programming that is hopefully interesting or entertaining. This project began on January 1, 2021, and continued in small bursts through March 1, 2021. Along the way we changed the exact revisions of the software we were using several times. Some observations may be slightly out of date, and I try to note such changes in the text where I am aware of them. Our project Terminology Implementing the contract Debugging, etc. Debugging cross-contract calls Debug-printing the environment doesn’t work Wait what’s this? Some weird new issue! Errors in ink, and a CallBuilder miracle Completing the level progression logic The many-step, error-prone, build-deploy-test cycle Testing ink contracts Fixing a build failure in cargo-contract Connecting to our contract with polkadot-js Next attempt to get a simple UI working We fail to complete the prototype Learnings and tips Some thoughts First, some hopefulness Next, some venting At least I’m learning Our project Our project is a game for teaching ink smart contract programming. It runs on a substrate blockchain (canvas for now), where players submit their own contracts in order to complete individual programming challenges. These challenges are judged by running them on the blockchain, and comparing their behavior to the expected behavior, similar to a unit test. We like this project because it accomplishes multiple goals for us: It lets us learn smart contract programming It lets us write about what we learn It creates a product that others may find useful It may be worthy of a grant to continue the work Our goal for this initial sprint has been to create a prototype that demonstrates the basic functionality of submitting and running levels, and progressing through levels; both the contracts and the UI. Also to write about how we struggled and what we learned. The source for this project lives at https://github.com/brson/contract-game Terminology The start of every project is filled with an awkward period of figuring out what to call things. Here are some of the terms used in our game, and used in this blog post. Substrate terms Account ID - A substrate account. These can represent things, but for our purposes so far they represent the accounts of people and the accounts of contracts. Sometimes referred to abstractly as just “account”. Method selector - Under the hook, ink methods are called via RPC, and methods don’t really have names, but instead magic numbers. We’ll need to use these explicitly to call other contracts dynamically. Game terms Game contract - The Substrate / Ink contract that runs the game. Player account - An account within the game belonging to a single player, associated with a Substrate account and the player’s game data. Player level contract - The contract submitted by a player to complete a single level in the game. This is sometimes abbreviated as just “level contract” in context. Player level contract account ID - The Substrate account associated with a player level contract. Some of these words may be abbreviated out in context. Just re-reading this I am struck at the immediate complexity of disambiguating these concepts: “player level contract account ID”? Yeek. Maybe I’m overthinking this. Implementing the contract We use cargo contract new to create our new contract, then immediately delete most of the source contents, leaving just the contract module and its decorating ink::contract attribute: use ink_lang as ink; #[ink::contract] mod game { } Most everything we write will go inside this module. The first thing we think about when writing our contract is the state represented in the account. This state is called “storage” in substrate. Or it lives in “storage”. It lives on the blockchain. We begin by defining our storage requirements as simply a map from the substrate account IDs owned by individual players to the game-specific state for that player. We write it #[ink(storage)] pub struct Game { player_accounts: HashMap<AccountId, PlayerAccount>, } The substrate AccountId represents multiple important pieces for us: users have accounts, and contracts on the blockchains have accounts. In ink, AccountId, along with some other types, is just magically in scope, probably thanks to the #[ink:contract] macro. And that HashMap is not the standard HashMap: it is a special ink HashMap that stores items on the blockchain. It is imported like: #[cfg(not(feature = "ink-as-dependency"))] use ink_storage::collections::HashMap; We don’t yet understand what the ink-as-dependency feature means; we are just copying this attribute from examples. PlayerAccount is our own type that holds our game-specific player account state. We try to put an ink_storage::HashMap into the PlayerAccount struct, inside another ink_storage::HashMap, inside our Game storage type. Something like #[ink(storage)] pub struct Game { player_accounts: ink_storage::HashMap<AccountId, PlayerAccount>, } #[derive(Debug, Clone, scale::Encode, scale::Decode, ink_storage_derive::PackedLayout, ink_storage_derive::SpreadLayout)] pub struct PlayerAccount { level: u32, level_programs: ink_storage::HashMap<u32, AccountId>, } It doesn’t work, with a bunch of errors about traits like WrapperTypeEncode not being implemented for types like ink_storage::HashMap. We look at the ink examples and don’t see any using nested collection types in their storage types. Instead they all use a “flat” data model. I don’t really want to do that because it will be harder to maintain the invariants I want. Reading the API docs for scale::Encode we see that the standard BTreeMap type implements it, so instead of nesting ink_storage::HashMaps inside each other, we use a BTreeMap instead, like #[ink(storage)] pub struct Game { player_accounts: ink_storage::HashMap<AccountId, PlayerAccount>, } #[derive(Debug, Clone, scale::Encode, scale::Decode, ink_storage_derive::PackedLayout, ink_storage_derive::SpreadLayout)] pub struct PlayerAccount { level: u32, level_programs: BTreeMap<u32, AccountId>, } I imagine this will be inefficient, but for now we want our code to be readable, not efficient. We can easily imagine the purpose of the scale::Encode and scale::Decode derives, but don’t yet understand the PackedLayout and SpreadLayout derives. For each level of our game, our game contract needs to call a player’s “level contract”. So each of our levels defines a contract interface, and each player implements that interface in their own contract for the level. That’s what we store in the level_programs map: a mapping from a level number to the account ID of the contract, owned by the player, that implements a solution to that level. In the UI, we imagine the initial game flow will begin with tasks like connecting the wallet, checking whether the player has an account, creating player accounts, and registering level contracts. We write a few initial methods to accomplish these tasks without many problems, and test them in canvas-ui. Here’s create_player_account: #[ink(message)] pub fn create_player_account(&mut self) -> Result<PlayerAccount, Error> { let caller = self.env().caller(); if self.have_player_account(caller) { Err(Error::AccountExists) } else { self.create_player(caller) } } have_player_account and get_player_account are similarly obvious. After a bit of success, we decide that the next problem for us to solve is to call our players’ level contracts. These are contracts that conform to an interface defined by our game, but have implementations defined by our players, so we know we’re going to have to call these contracts dynamically by their interface. When we start trying to figure this out, we run into a lack of examples and documentation. Debugging, etc. While incrementally adding features, experimenting with ink APIs, and attempting to debug, we find that we don’t know how to do “println debugging”: ink defines ink_env::debug_println, but when we use it we don’t see any output anywhere. I ask in the #ink:matrix.parity.io channel where to see the output, and Alexander Theißen replies: “They are printed to the console. You need to raise the log level for runtime module in order to see them. I also recommend to silence all the block production noise: -lerror,runtime=debug” So those are presumably flags to canvas-node. Now I am running my canvas node, from source, with the command cargo run -- --dev --tmp -lerror,runtime=debug We have Alice construct our game contract, and want to test having that contract call another contract (a “level contract”). For testing purposes that level contract is the “flipper” example contract. We upload that contract and have Bob construct it. We are confused about: Are contracts identified by users’ account IDs, or do they have their own account IDs? How can we find the account ID of a contract we’ve constructed? We’re confused every step of the way. While trying to figure out Bob’s account ID we make two discoveries: 1) The subkey inspect command: ``` subkey inspect //Bob Secret Key URI `//Bob` is account: Secret seed: 0x398f0c28f98885e046333d4a41c19cee4c37368a9832c6502f6cfd182e2aef89 Public key (hex): 0x8eaf04151687736326c9fea17e25fc5287613693c912909cb226aa4794f26a48 Account ID: 0x8eaf04151687736326c9fea17e25fc5287613693c912909cb226aa4794f26a48 SS58 Address: 5FHneW46xGXgs5mUiveU4sbTyGBzmstUspZC92UhjJM694ty ``` I don't fully understand how to specify account names, but I know that `//Alice` and `//Bob` are known test accounts. This `subkey inspect` command gives the account id and secret key. The `subkey` command is part of the substrate repo and [the command for installing it is a bit awkward][subkeycommand], but easy enough to copy-paste. 2) The polkadot explorer can be configured to connect to my local devnet! This seems pretty huge. I can see account ID’s here, and hopefully even more useful info about what is going on inside my devnet. Both canvas-ui and the polkadot.js explorer cache information about code hashes (and probably other things) they’ve seen, but which don’t actually exist on the chain they are currently connected to. This is maddening every time I restart my devnet and see a bunch of hashes of old contracts that I can’t distinguish from the new contracts. I wish these apps would either verify these code hashes actually exist on chain, or at least give me a big red “reset” button to purge all this incorrect info. At some point I had canvas-ui showing me two “flipper” contracts, and I didn’t know which one was real, so I told it to “forget” both of them. Then I tried to redeploy flipper, but of course flipper was already deployed so I got an error, and now I don’t know the correct address of flipper, and can’t add it back to the UI and I’m stuck, have to shut down my devnet and restart it. I now have a habit of going through all the canvas-ui tabs and “forgetting” everything every time I restart canvas-node. At least the polkadot explorer says “not on-chain” for code hashes that don’t actually exist. After some experimenting I learn that constructing a contract creates a new account; that is, a contract is not associated with the account of the user that creates it; a contract has its own account. We execute transactions in the canvas-ui, but no events seem to register in the explorer ui. Sometimes canvas-ui doesn’t know how to interpret the results of a method call and gives no feedback. We’re going to have to add logging everywhere to have any clue what is going on. Debugging cross-contract calls We ran into our first big blocker: we can’t figure out how to call another contract via interface. The ink repo contains examples of defining traits, via #[trait_definition] and calling contracts through them, but those examples all still have direct access to the implementations of those traits. That is too limiting for our needs. By browsing the API docs we came across CallBuilder, which appears to call an arbitrary method in another contract, given that contract’s account id, a known method selector, which is a unique ID used to identify a method, and the configuration for the args, return value, gas, and other things. We tried to use this and failed. And failed. And failed. For days. We took a long break. We were discouraged, and it was hard to come back to this problem, but we can’t make any progress without solving it. So that’s today’s mission. What happens when we try to call a method via CallBuilder is that canvas-node logs (when -lruntime=debug is passed on the command line): 2021-01-14 16:34:36.014 DEBUG tokio-runtime-worker runtime:DispatchError 2021-01-14 16:34:36.014 DEBUG tokio-runtime-worker runtime:8 2021-01-14 16:34:36.014 DEBUG tokio-runtime-worker runtime:17 2021-01-14 16:34:36.014 DEBUG tokio-runtime-worker runtime:ContractTrapped 2021-01-14 16:34:36.014 DEBUG tokio-runtime-worker runtime:PostInfo: 2021-01-14 16:34:36.014 DEBUG tokio-runtime-worker runtime:actual_weight= 2021-01-14 16:34:36.014 DEBUG tokio-runtime-worker runtime:7172485790 2021-01-14 16:34:36.014 DEBUG tokio-runtime-worker runtime:pays_fee= 2021-01-14 16:34:36.014 DEBUG tokio-runtime-worker runtime:Yes As the only clue to what’s happening, it’s some pretty horrible feedback. By ripgrepping the substrate code for DispatchError we gather that “8” is a “module index”, here the contracts module, though it isn’t explicitly stated “17” is a module-specific error number, here it corresponds to ContractTrapped. This is indicated in the output, though the connection between “17” and ContractTrapped is not explicit. “actual_weight” is part of PostDispatchInfo and indicates the “actual weight consumed by a call or None which stands for the worst case static weight”. With our “actual weight” looking like a pretty large number, our best guess right now is that we just didn’t spend enough gas to make the call. For our experiment today we create a repo just for testing CallBuilder: https://github.com/Aimeedeer/g'''
