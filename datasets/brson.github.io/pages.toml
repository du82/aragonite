full_description = "Brian Anderson → a.k.a. brsonon GitHuband elsewhere. I helped make a big thing that people like and that I am proud of. My hacker stuff is on GitHub. I keep a worklog. I rarely blog, though I do like writing. Lately I travel, cook, play with synthesizers, and work occasional contracts related to the Rust programming language through my company, Common Orbit LLC. I am usually unavailable to hack on new projects, though I do maintain a resume. Currently the best way to contact me is on Telegram (MrBrianAnderson), though email (andersrb@gmail.com) also works. I won't notice GitHub pings. It can be difficult to get a response from me, mostly due to my extreme inbox anxiety. If you keep trying, I won't be offended. Bonus: I now have an Instagram account, and publish status updates to my Mastodon account (@ba@hachyderm.io). GPG key SSH key Atom feed"
