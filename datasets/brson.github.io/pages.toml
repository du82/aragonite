["https://brson.github.io/2017/07/10/how-rust-is-tested"]
title = "How Rust is tested"
full_description = '''How Rust is tested 2017-07-10 Rust is a systems programming language with massive ambitions. It is designed for creating the most reliable software, from the tiniest embedded systems to multi-million line behemoths, and its users need to have confidence that it is fit for purpose. In service of this ambition Rust has an extremely thorough testing regimen, and that is one of the things I am most proud of about Rust. Rust has a strict continuous integration system that runs a great number of tests on every pull request, basically guaranteeing that the Rust master branch always works; which is crucial because Rust releases nightly builds every night, and stable builds every six weeks. And Rust further tests every release against its entire open source library ecosystem. I’ve always admired well-tested software projects, like SQLite, and aim to place Rust among the pantheon of the best. This document then, is a catalog of all the ways we test Rust. I hope it provides insight into what it takes to deliver a production-quality programming language, a hint at the wide variety of techniques employed in software validation, and that it reinforces your confidence in Rust’s reliability. Summary (2017/07/10) All patches built in 58 configurations before landing All patches tested in 20 configurations before landing 126k tests per PR across all platforms Full release artifacts published for 48 platforms every merge Testing of all documentation Releases every six weeks 13k Rust projects regression-tested before releases 222k tests in Rust projects tested before releases Fuzz testing and formal verification Contents The promise of Rust Continuous integration Continuous releases The Rust test suite Unit tests compiletest - The Rust test suite test driver run-pass and run-fail compile-fail ui run-make codegen codegen-units pretty debuginfo incremental mir-opt rustdoc documentation linkchecker cargotest check-error-index distcheck tidy bootstrap - Build system self-check tools Other testing cargobomb and crater - Downstream testing libc compiler-builtins perf.rust-lang.org fuzzing - afl.rs and cargo-fuzz rust-icci Firefox beta testing Formal verification smoke - Cross-platform testing rustup clippy Notes and future work The promise of Rust Rust is a systems programming language with massive ambitions. It is designed for creating the most reliable software, from the tiniest embedded systems to multi-million line behemoths, and its users need to have confidence that it is fit for purpose. Today Rust runs on many platforms, and tomorrow it will run on many more. Rust will one day run on any machine with a microprocessor. And Rust moves fast, with releases every 6 weeks, and a growing ecosystem of software depending on it. Rust makes strong guarantees about compatibility and stability, what will, won’t, and might break as the platform evolves, and ensuring that we fulfill those guarantees is crucial to maintaining the trust of Rust’s users. It’s a big challenge to keep it all from falling apart. This is how we do it. We use strong continuous integration to catch many bugs before they are ever committed to the Rust repository, and continuous releases to enable more extensive testing of nightly and beta builds prior to the release every 6 weeks. During CI, all patches must pass the Rust test suite in all supported configurations before landing. Nightly and beta releases are subject to further testing using a number of techniques. Continuous integration Rust relies on continuous integration, where the code base is tested as part of the process of reviewing and merging patches. In Rust we do CI in a very particular way, and one which we are very proud of. Rust’s creator, Graydon, originally described it in a blog post, “The Not Rocket Science Rule”. The thing we do differently from most is that we run the full test suite against every patch, as if it were merged to master, before committing it into the master branch, whereas most CI setups test after committing, or if they do run tests against every PR, they do so before merging, leaving open the possibility of regressions introduced during the merge. How does this work precisely? Our integration bot, bors, maintains a queue of all pull requests that have been reviewed and approved for landing. It proceeds through this queue, one at a time: for each pull request it merges the pull request branch with the master branch, but into a temporary branch (which we call “auto”); then it runs the entire test suite on that branch, in many configurations (as of 2017/07/10 there are 59 configurations built, and 20 tested). If all tests pass in all configurations only then does that commit become the master branch. Then bors moves onto the next PR. The important things to recognize about this arrangement are: first, the head commit on Rust’s master branch is guaranteed to be fully tested at all times; but as a consequence, landing pull requests to Rust is completely serialized - only one PR can be under final testing at a time. The benefit of this arrangement is that Rust’s developers have high confidence that the master branch works correctly, always. It isn’t perfect - bugs do slip through - but it does provide significant peace of mind. There’s a big downside though in that landing patches to Rust is serialized on running the test suite on every patch, and it takes a particularly long time to Run the Rust test suite in all the configurations we care about. Today the longest-running configuration takes over 2 hours. Rust always has a queue of approved patches waiting to land, and so it can take days for even simple patches to get through the queue. This can create an interesting competitive environment where authors desire high spots in the queue and complain when the queue grows. While PR authors are waiting in bors’s queue, we also have a bot test their PR in a single configuration as a smoke test. This avoids the frustration of waiting for one’s PR to work through the queue only to be rejected by a simple mistake. We do this style of CI not only on rust-lang/rust but also on other key projects, including cargo and rustup. bors’s implementation has gone through several iterations, and today it is implemented by a script called homu, which is shared with Rust’s sister project, Servo. It has also inspired other ther integration bots used in the Rust ecosystem and beyond, including bors-ng. Test-first CI is the cornerstone of Rust stability. Today we do our CI on Travis CI for Linux and Mac OS, and AppVeyor for Windows. Notably, all of our testing hosts are running x86, and so, for the non-x86 platforms that we do test, we currently use the QEMU emulator on Linux. Many non-x86 platforms do not yet get test coverage as part of the CI process (though see the smoke project). No non-x86 platforms are automatically tested on real hardware, a major limitation of the current setup. Continuous releases Since we test so thoroughly, ideally all bugs are caught before entering the tree, but that is not the case. Once a patch enters the tree the clock is ticking until it hits the stable release. Rust publishes releases on three “channels”: nightly, beta, and stable. The nightly and beta channels provide an opportunity to catch bugs missed by the official CI before they hit a release. Rust has a 6 week beta cycle, so the minimum a patch will sit in tree before hitting a stable release is 6 weeks (if it lands on master right before the next beta), and the maximum is 12 weeks (if it lands at the beginning of a cycle). During the 6 week release cycle, regression triage meetings are held every 2 weeks to keep ahead of breakage and ensure the release stays on track. Again, the Rust release schedule is incredibly aggressive and it takes constant vigilence to maintain. To make releases as simple as possible we tie it directly to the CI system. Since we are already testing Rust in the same configurations that we ship releases for, it’s a natural extension to simply produce release artifacts while we’re testing. So we do that and publish them to their own S3 bucket. From those binaries we have a bot that periodically collects them into their final form for release and deploys them to static.rust-lang.org. So not only do we fully test every commit that lands on master, we also publish the complete release binaries at the same time. With as many release configurations as Rust has, differences between the continuous integration configuration and the release build configuration became a huge source of problems. Making testing and releasing the same thing eliminated them. The Rust test suite The Rust test suite covers rustc, std, cargo, rustdoc, and the Rust documentation, and features a number of special test harnesses to cover specific classes of bugs relevant to Rust. The tests are all ultimately run by libtest, the standard test crate, and many of them are coordinated by the compiletest tool. As of 2017/07/10 there are a little over 6k tests in the Rust test suite. This may seem surprisingly few, but keep in mind that Rust’s strong static typing prevents many errors at compile-time, so Rust projects in general are believed to require fewer test cases than projects in other languages. All features and bug fixes are accompanied by test cases. Still, test coverage is currently unknown, and assumed to be far from complete. Unit tests Standard Rust unit tests, like any Rust author would write. These are tests annotated with #[test] and run with cargo test. This is the primary method for testing the standard library, and for cargo as well. This is the most basic kind of testing in Rust, but the compiler itself is mostly tested with more specialized tools. compiletest compiletest is the main test harness of the Rust test suite, one of the oldest Rust codebases, and the oldest parallel Rust program. It implements a number of classes of test, each of which generally corresponds to a directory under src/test. Most of these tests involve driving the compiler to compile one or more source programs, then interpreting the results. Most tests are represented by a Rust source file that may have annotations in comments directing compiletest in how to run the test, as in the following run-fail test, test-panic.rs, that tells compiletest that the string “thread ‘test_foo’ panicked at” must be printed to stdout, to compile with the --test flag, and to ignore the test on emscripten. // check-stdout // error-pattern:thread 'test_foo' panicked at // compile-flags: --test // ignore-emscripten #[test] fn test_foo() { panic!() } Most of the test types in the following sections are implemented by compiletest. run-pass and run-fail Two of the oldest and simplest types of test. These test cases are Rust source code that should compile successfully. run-pass tests must run successfully; run-fail tests must run and return the Rust standard error code, 101. compile-fail compile-fail tests are some of the most common tests for testing language features. They must fail to compile, and stderr must emit errors containing specific text: fn main() { 1 = 2; //~ ERROR invalid left-hand side expression 1 += 2; //~ ERROR invalid left-hand side expression (1, 2) = (3, 4); //~ ERROR invalid left-hand side expression let (a, b) = (1, 2); (a, b) = (3, 4); //~ ERROR invalid left-hand side expression None = Some(3); //~ ERROR invalid left-hand side expression } While these are the bread and butter of rustc testing, their weakness is that they only validate some of the text output to stderr - they do not guarantee that the output actually looks good. For that reason new tests, or tests of tricky error output, are often written as ‘ui’ tests. ui UI tests are like compile-fail tests, but the output of stdout and stderr are checked fully. In these tests, instead of annotating the source with expected output, source files are accompanied by *.stdout and *.stderr templates that capture expactly what the compiler is allowed to output. So the test issue-39544.rs: enum X { Y } struct Z { x: X } fn main() { let z = Z { x: X::Y }; let _ = &mut z.x; } must have the output from issue-39544.stderr: error: cannot borrow immutable field `z.x` as mutable --> $DIR/issue-39544.rs:21:18 | 21 | let _ = &mut z.x; | ^^^ error: aborting due to previous error Because these templates are difficult to write by hand, there are scripts to help keep them updated when the output changes. run-make This is the kind of test you write when none of the other tests are sufficient. compiletest simply runs a Makefile, while setting up a bunch of environment variables that might be useful. Tests import tools.mk to get access to various helpers. These tests are usually testing the behavior of rustc, like in this test that is validating something related to target specs: -include ../tools.mk all: $(RUSTC) foo.rs --target=my-awesome-platform.json --crate-type=lib --emit=asm grep -q -v morestack < $(TMPDIR)/foo.s $(RUSTC) foo.rs --target=my-invalid-platform.json 2>&1 | grep -q "Error loading target specification" $(RUSTC) foo.rs --target=my-incomplete-platform.json 2>&1 | grep 'Field llvm-target' RUST_TARGET_PATH=. $(RUSTC) foo.rs --target=my-awesome-platform --crate-type=lib --emit=asm RUST_TARGET_PATH=. $(RUSTC) foo.rs --target=x86_64-unknown-linux-gnu --crate-type=lib --emit=asm $(RUSTC) -Z unstable-options --target=my-awesome-platform.json --print target-spec-json > $(TMPDIR)/test-platform.json && $(RUSTC) -Z unstable-options --target=$(TMPDIR)/test-platform.json --print target-spec-json | diff -q $(TMPDIR)/test-platform.json - codegen codegen tests verify that rustc produces the expected LLVM IR for a given file. It is similar to tests used by LLVM to verify its own lowering to assembly. // compile-flags: -C no-prepopulate-passes #![crate_type = "lib"] pub enum E { A, B, } // CHECK-LABEL: @exhaustive_match #[no_mangle] pub fn exhaustive_match(e: E) { // CHECK: switch, label %[[DEFAULT:[a-zA-Z0-9_]+]] // CHECK: [[DEFAULT]]: // CHECK-NEXT: unreachable match e { E::A => (), E::B => (), } } codegen-units Like codegen tests these tests are validating the internal compiler behavior, in this case testing how items in Rust source are partitioned between “codegen units” at translation time. Correctly subdividing the work of translating Rust to LLVM and then machine code is required for incremental translation. // compile-flags:-Zprint-trans-items=eager pub static FN : fn() = foo::<i32>; pub fn foo<T>() { } //~ TRANS_ITEM fn static_init::foo[0]<i32> //~ TRANS_ITEM static static_init::FN[0] fn main() { } //~ TRANS_ITEM fn static_init::main[0] //~ TRANS_ITEM drop-glue i8 pretty pretty tests are testing rustc’s “pretty printer”, the code that converts the Rust AST back to Rust syntax. Rust uses the pretty printer for displaying error messages. pretty testing is done by asking the compiler to pretty-print source code, then asking it to pretty-print that source code, and testing that it reaches a steady state, where furth'''
