title = "First impressions of NEAR smart contract development in Rust"
full_description = '''First impressions of NEAR smart contract development in Rust 2020-09-07 Rust is increasingly used as a programming language for smart contracts. Whereas the first generation blockchains used specialized VMs, newer blockchains are running general purpose VMs, especially WASM. And of course, Rust is a modern language that runs just about everywhere, and is especially good at targetting WASM. Somewhat serendipitously, this has made Rust one of the best candidate languages for writing smart contracts on the new generation of blockchains. Lately I’ve been learning more about the smart contract programming landscape, and this post is about my first dive into smart contract programming in Rust on the NEAR platform. NEAR is a sharded, proof-of-stake blockchain that runs WASM. It not only supports smart contracts written in Rust (in addition to AssemblyScript), but is also itself written in Rust. While one the most prominent Rust blockchain projects, it is perhaps not yet widely known in the broader blockchain development community. Based on my experiences here though, I’m quite enthusiastic about the NEAR developer experience, and I intend to spend more time hacking on NEAR. These are my first impressions of NEAR, as someone with moderate knowledge of blockchains, but limited previous blockchain programing experience. I have previously written similarly about my first experiences with other blockchains: Nervos, Ethereum. Starting at the start of the docs The NEAR documentation seems refreshingly thorough, if a bit confusing to navigate. There are different docs to follow depending on your role in the network, whether a validator, smart contract programmer, etc. and I find myself jumping between multiple sections, without quite understanding how the docs are organized overall, perhaps because there isn’t a single table of contents that covers the entire site. Anyway, after browsing the docs to get a general idea of their organization, I go back to the front page and I click “Basics”. This seems to be leading me down the path of being a smart contract developer, not running my own local node, not building NEAR itself. For sake of understanding, I generally want to build the entire stack I’m working on, but for now I’m going to follow the docs exactly and see where that gets me, and not build NEAR on my own. Account creation Setting up an account is done through a web interface at: https://wallet.testnet.near.org/ I create a testnet account, floopy.testnet, and a recovery phrase. The NEAR explorer page for my account is https://explorer.testnet.near.org/accounts/floopy.testnet Instead of a hash for an ID, as in most blockchains, you get an actual string name. And the system can optionally do account recovery over email or phone. While this is convenient, it seems suspiciously centralized for a public blockchain, and I wonder if it is possible to create accounts without any central authority. I imagine it is, and this website is mostly a convenience, but don’t know yet. Installation Following the docs, I install near-cli, a Node app. $ npm install -g near-cli /home/ubuntu/.nvm/versions/node/v12.16.2/bin/near -> /home/ubuntu/.nvm/versions/node/v12.16.2/lib/node_modules/near-cli/bin/near > node-hid@1.3.0 install /home/ubuntu/.nvm/versions/node/v12.16.2/lib/node_modules/near-cli/node_modules/node-hid > prebuild-install || node-gyp rebuild > usb@1.6.3 install /home/ubuntu/.nvm/versions/node/v12.16.2/lib/node_modules/near-cli/node_modules/usb > prebuild-install --verbose || node-gyp rebuild prebuild-install info begin Prebuild-install version 5.3.5 prebuild-install info looking for cached prebuild @ /home/ubuntu/.npm/_prebuilds/f5a2d7-usb-v1.6.3-node-v72-linux-x64.tar.gz prebuild-install http request GET https://github.com/tessel/node-usb/releases/download/v1.6.3/usb-v1.6.3-node-v72-linux-x64.tar.gz prebuild-install http 200 https://github.com/tessel/node-usb/releases/download/v1.6.3/usb-v1.6.3-node-v72-linux-x64.tar.gz prebuild-install info downloading to @ /home/ubuntu/.npm/_prebuilds/f5a2d7-usb-v1.6.3-node-v72-linux-x64.tar.gz.26621-920b88608b4cf.tmp prebuild-install info renaming to @ /home/ubuntu/.npm/_prebuilds/f5a2d7-usb-v1.6.3-node-v72-linux-x64.tar.gz prebuild-install info unpacking @ /home/ubuntu/.npm/_prebuilds/f5a2d7-usb-v1.6.3-node-v72-linux-x64.tar.gz prebuild-install info unpack resolved to /home/ubuntu/.nvm/versions/node/v12.16.2/lib/node_modules/near-cli/node_modules/usb/build/Release/usb_bindings.node prebuild-install info unpack required /home/ubuntu/.nvm/versions/node/v12.16.2/lib/node_modules/near-cli/node_modules/usb/build/Release/usb_bindings.node successfully prebuild-install info install Successfully installed prebuilt binary! Semes to work fine. From previous doc reading I know that running a full node typically involves running nearup. It appears though that I don’t need that now, so probably for the purposes of developing on near, near-cli will just talk to existing public nodes. At this point I seem to hit the end of the “basics” documentation flow, without really accomplishing anything, but I remember from the beginning of these docs that “choose a starter project” is step 2. I back up and choose the rust-status-message starter project. Running a contract The examples say to install near-shell, but that project has been renamed to near-cli. I see that there are already PRs submitted to fix this, but they are about a month old. There are a number of relatively old PRs in NEAR repos that haven’t been reviewed. I clone the example: $ git clone https://github.com/near-examples/rust-status-message $ cd rust-status-message And build per the instructions: $ npm run build This is an npm build that wraps a cargo build. I’m curious if there’s any JavaScript involved, but I suspect they are just using npm as the primary interface for the sake of familiarity and for consistency with the build process for AssemblyScript smart contracts. Looking at package.json it’s true that npm isn’t doing much here, but it is adding a post-build step that cargo is incapable of: "scripts": { "build": "cargo build --target wasm32-unknown-unknown --release", "postbuild": "cp target/wasm32-unknown-unknown/release/status_message.wasm ./res/" }, There is an error in the build: error[E0463]: can't find crate for `core` | = note: the `wasm32-unknown-unknown` target may not be installed error: aborting due to previous error For more information about this error, try `rustc --explain E0463`. error: could not compile `byte-tools`. warning: build failed, waiting for other jobs to finish... error: build failed npm ERR! code ELIFECYCLE npm ERR! errno 101 npm ERR! rust-status-message-builder@1.0.0 build: `cargo build --target wasm32-unknown-unknown --release` npm ERR! Exit status 101 npm ERR! npm ERR! Failed at the rust-status-message-builder@1.0.0 build script. npm ERR! This is probably not a problem with npm. There is likely additional logging output above. npm WARN Local package.json exists, but node_modules missing, did you mean to install? npm ERR! A complete log of this run can be found in: npm ERR! /home/ubuntu/.npm/_logs/2020-09-06T22_44_16_397Z-debug.log This is an easy error to understand to somebody familiar with embedded Rust development, but probably not to other newbies. The toolchain just doesn’t have the wasm32-unknown-unknown target installed. I don’t know if I missed the documentation that explained this, but the user experience here could be better. I add the wasm target: $ rustup target add wasm32-unknown-unknown info: downloading component 'rust-std' for 'wasm32-unknown-unknown' info: installing component 'rust-std' for 'wasm32-unknown-unknown' After that the build works: $ npm run build > rust-status-message-builder@1.0.0 build /home/ubuntu/near/rust-status-message > cargo build --target wasm32-unknown-unknown --release Compiling near-sdk v0.11.0 Compiling status-message v0.1.0 (/home/ubuntu/near/rust-status-message) Finished release [optimized] target(s) in 3.99s > rust-status-message-builder@1.0.0 postbuild /home/ubuntu/near/rust-status-message > cp target/wasm32-unknown-unknown/release/status_message.wasm ./res/ I try to deploy to the testnet using a temporary developer account: $ near dev-deploy --wasmFile res/status_message.wasm --helperUrl https://near-contract-helper.onrender.com We would like to collect data on near-cli usage to improve developer experience. We will never send private information. We only collect which commands are run via an anonymous identifier. Would you like to opt in (y/n)? NEAR wants me to opt in to telemetry. I’m sympathetic, but since this command presumably will have access to private keys, I’m not confident that the developers have been suitably careful about avoiding collection of private data. For now I say “n”, until I can review that code. The command continues: $ near dev-deploy --wasmFile res/status_message.wasm --helperUrl https://near-contract-helper.onrender.com We would like to collect data on near-cli usage to improve developer experience. We will never send private information. We only collect which commands are run via an anonymous identifier. Would you like to opt in (y/n)? n Starting deployment. Account id: dev-1599433413131-7008906, node: https://rpc.testnet.near.org, helper: https://near-contract-helper.onrender.com, file: res/status_message.wasm Transaction Id 6cT3Su1BTo52i1EwSgaD6Wm9mTvA8238PWQmUFYPkS11 To see the transaction in the transaction explorer, please open this url in your browser https://explorer.testnet.near.org/transactions/6cT3Su1BTo52i1EwSgaD6Wm9mTvA8238PWQmUFYPkS11 Done deploying to dev-1599433413131-7008906 near dev-deploy has apparently created a script neardev/dev-account.env that will set the CONTRACT_NAME environment variable to my temporary account id, dev-1599433413131-7008906. I call it with source neardev/dev-account.env. I call near call to set the status message in the contract: $ near call $CONTRACT_NAME set_status '{"message": "aloha!"}' --accountId $CONTRACT_NAME Scheduling a call: dev-1599433413131-7008906.set_status({"message": "aloha!"}) Receipt: GcJaodbrMSMAhXCq1qhbsgtkdBUvtPGHa5DL1if3biY5 Log [dev-1599433413131-7008906]: A Transaction Id AXsm1VkUPkEFsAHLkhtTpMLi6gmCm9Zq7Xt46N6u1V1u To see the transaction in the transaction explorer, please open this url in your browser https://explorer.testnet.near.org/transactions/AXsm1VkUPkEFsAHLkhtTpMLi6gmCm9Zq7Xt46N6u1V1u '' I browse to the provided testnet explorer address to see the transaction: https://explorer.testnet.near.org/transactions/AXsm1VkUPkEFsAHLkhtTpMLi6gmCm9Zq7Xt46N6u1V1u The transaction is already confirmed by the time I open the block explorer. That’s a nice change from Ethereum development. I wonder if the mainnet is so fast. I note that the explorer is able to show me the contract arguments, { "message": "aloha!" } which is nice. And the final step, I run near view to query the contract’s message: $ near view $CONTRACT_NAME get_status '{"account_id": "'$CONTRACT_NAME'"}' View call: dev-1599433413131-7008906.get_status({"account_id": "dev-1599433413131-7008906"}) Log [dev-1599433413131-7008906]: A 'aloha!' Seems everything worked pretty well. Honestly, this has been a pretty refreshing experience compared to Ethereum onboarding. Besides the docs being a bit out of date, everything worked, and worked quickly. Using a real account The previous deployment used a temporary dev account. Per the docs, next I should use my real account that I created earlier, floopy.testnet. I login to near cli with near login: near login Please authorize NEAR CLI on at least one of your accounts. If your browser doesn't automatically open, please visit this URL https://wallet.testnet.near.org/login/?title=NEAR+CLI&public_key=ed25519%3A8qohFi4YY3uNNbagonWgx7yiHDLod3onmN4NsMt4edXj&success_url=http%3A%2F%2F127.0.0.1%3A5000 Please authorize at least one account at the URL above. Which account did you authorize for use with NEAR CLI? Enter it here (if not redirected automatically): So I have to visit a web page to authorize near-cli to use my account, then come back here and enter the account name. I open the web page and it’s a bit confusing. It says Unknown App is requesting full access to your account. This provides access to all of your tokens. Proceed with caution! [more information] Why is it “Unknown App”? If I click “more information” then I see that the web site does know that this is for authorizing “NEAR CLI”: Warning This allows access to your entire balance. Please proceed with caution. This allows NEAR CLI to: Create new accounts Transfer tokens from your account to other accounts Deploy smart contracts Call functions on any smart contract Stake and unstake NEAR tokens Create and delete access keys The web page automatically fills in the name of the testnet account I made earlier, @floopy.testnet. I assume it is stored in a cookie. I am not asked to enter any passwords, and come to think of it, I don’t have a password or private key that I know of, just a recovery seed, so I am curious about the security model. I run into a problem: as part of the authentication flow, the testnet wallet website redirects me to a localhost HTTP address, presumably hosted by near login: http://127.0.0.1:5000/?account_id=floopy.testnet&public_key=ed25519%3A8qohFi4YY3uNNbagonWgx7yiHDLod3onmN4NsMt4edXj&all_keys=ed25519%3A7NCW4ELSHsJE1z4tfAG2d1VPGHRrNPcoLjsugkUDGUyQ I am running on an EC2 instance though, so this address is not accessible to me. I kill near login and look at its command line arguments to see if I can have it listen on a different address. $ near login --help near login logging in through NEAR protocol wallet Options: --help Show help [boolean] --version Show version number [boolean] --nodeUrl, --node_url NEAR node URL [string] [default: "https://rpc.testnet.near.org"] --networkId, --network_id NEAR network ID, allows using different keys based on network [string] [default: "default"] --helperUrl NEAR contract helper URL [string] --keyPath Path to master account key [string] --accountId, --account_id Unique identifier for the account [string] --useLedgerKey Use Ledger for signing with given HD key path [string] [default: "44'/397'/0'/0'/1'"] --walletUrl URL of wallet to use [string] --contractName Account name of contract [string] --masterAccount Master account used when creating new accounts [string] --helperAccount Expected top-level account for a network [string] --verbose, -v Prints out verbose output [boolean] [default: false] It’s not obvious. --walletUrl looks promising, though. I try it, and that is not it. --walletUrl is (obviously in hindsight) the address of wallet.testnet.near.org. I am stumped. For now I give up on seeing what’s at that localhost address, and hope I can complete authentication without it. I run near login again, go back through the website authentication flow, then finally type in floopy.testnet at the CLI prompt. near login says Logged in as [ floopy.testnet ] with '''
