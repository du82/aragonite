title = "First impressions of programming on DFINITY"
full_description = '''First impressions of programming on DFINITY 2021-01-30 Continuing our adventure exploring programmable Rust blockchains, this time Aimee and I are going to dive into DFINITY. I have been aware of Dfinity for a while, but have not looked at it closely. I know that they are building a programmable blockchain, and that they have their own smart contract programming language. These experience reports tend to be so detailed that they are mostly useful to the product developers, and not really worth reading for anybody else. For other audences, our closing thoughts may be worthwhile. What we’re going to do Starting by doing some research Installing the tools Aimee upgrades her dfx Creating my own project Running a local test node Deploying and running the contract Aimee resumes her tutorial Deploying to the live network Writing our own contract Writing a contract in Rust? Successfully completing a tutorial Closing thoughts What we’re going to do For this first look we’re going to install the tools, walk through the tutorials, and then try to implement a contract we’ve implemented before in solidity, near, and ink — the big announcement. It is a simple program that lets the caller bid to set a singleton string message. Starting by doing some research When I start a project, I usually just jump in, without informing myself of anything at all really. Aimee though likes to read, and watch, and this time we have watched an entire YouTube playlist about “building on the Internet Computer”. It’s a basic introductory series, but I did have some takeaways: mostly, that programming for Dfinity appears to look a lot like traditional programming, and not like Solidity-descendant smart contract programming. Gas was not mentioned at all, and I am curious whether that means the programmer doesn’t neeed to worry about gas, or whether they chose to gloss over that subject. They are using a custom smart contract language, Motoko. It looks like a mashup of a number of languages, with some clear Rust influence, though not one single obvious inspiration. It is modeling its contract interactions as actors, using the async/await model, which so far appears to be a good fit. The code I’ve seen in the video reads pretty easily. I read a blog post by Dfinity’s Johan Granström: A Closer Look at Software Canisters, an Evolution of Smart Contracts. Many of the capabilities described here sound similar to other smart contract platforms. A few that stand out to me though: The memory space of a wasm canister is saved and restored every execution! This should make it behave as if it were a long-running process, even though each invocation may be years apart, and on different nodes. There is apparently no explicit storage. This is cool, and I am surprised I haven’t seen this done before in the smart contract space. It implies though that memory leaks live forever, and so does memory fragmentation. Full nodes are run by data centers. This probably allows it to be fast and store a lot of data, but reduces the decentralization. This is probably the fate of all smart contract blockchains though — Ethereum is already too big for most people to run on their own. It’s not clear if full nodes need permission to join the network. Still no mention of gas. I begin to read another post by Dfinity’s Dominic Williams, Announcing the Internet Computer “Mainnet” and a 20-Year Roadmap. This is a good “vision statement” about what Dfinity is aiming for, but it’s verbose, and without technical details. Definitely worth a read for anybody interested in Dfinity. I did not finish it. Installing the tools Following the quick start docs. I’m doing local development, not connecting to any testnet. The tools are installed via ssh, which is common and I am fine with. I download the script and give it a quick review, to make sure it’s not doing anything obviously wrong. I am tickled to see this comment in the headers: # Borrowed from rustup (https://sh.rustup.rs) as I wrote most of rustup’s install script. I also know smart people have carefully improved it over time — it is a very battle-tested piece of tricky shell script. That gives me some immediate confidence in this script. There is though a lot of Dfinity-specific code here, and it is not as lovingly-maintained as rustup’s, with bizarre spacing and stripped comments (it looks like it has been machine-processed). Important functionality like architecture detection, platform-specific quirk handling, and the security-sensitive curl configuration are borrowed straight from rustup though. I don’t see anything obviously incorrect in the script, though its poor readability gives me pause — this is a script some hackers will definitely read before running, and it needs to give them confidence. I run the installation and see: $ sh -ci "$(curl -fsSL https://sdk.dfinity.org/install.sh)" Executing DFINITY SDK install script, commit: 55f1bbedee393411e1ae3a6eaeb449a6dd047c00 The DFINITY Canister SDK Copyright 2021 DFINITY Stiftung. All Rights Reserved. The DFINITY Canister SDK (the "Software") is licensed under the Alpha DFINITY Canister SDK License Agreement (the "License"). You may not use the Software except in compliance with the License. You may obtain a copy of the License at https://sdk.dfinity.org/sdk-license-agreement.txt The Software is provided to you AS IS and WITHOUT WARRANTY. Do you agree and wish to install the DFINITY Canister SDK [y/N]? Huh. They have a non-standard license. I read it. It doesn’t load as text in my browser, so it might not in others. Here’s a gist: https://gist.github.com/brson/7abc2be6f9d8e2daf488512af2a866b7 It’s not a free-software license. It is called the “Alpha DFINITY …” license, so I am assuming this is a temporary license, and it will change to a standard free license in the future. The terms in it are ominous enough that, if I weren’t here to blog about it, I would stop immediately. I scan it to determine whether there are any restrictions on what I am intending to publish in this blog, and I think the answer is “no”. There’s another issue here — the installer’s text claims “The DFINITY Canister SDK is licensed under the Alpha dfinity Canister SDK License Agreement” But also, the source for at least part of the Canister SDK lives on GitHub, and claims to be Apache-2.0 licensed. Just to make sure it is possible to opt out at this stage of the script, I hit enter, which should default to not accepting the license (that is what the “y/N” convention means — “N” is the default). It says the following and exits: Please accept the license to continue. Great. Now I run it again and enter “y”. The install script shows the following and exits: Version found: 0.6.20 Creating uninstall script in ~/.cache/dfinity uninstall path=/home/ubuntu/.cache/dfinity/uninstall.sh Checking for latest release... Will install in: /home/ubuntu/bin Installed /home/ubuntu/bin/dfx This looks pretty standard. It’s curious that it first said the version is found, then later said it was checking for the latest release. Didn’t it already do that in order to find the version? I read the uninstall script and I don’t see any obviously catastrophic bugs. It does mention a DFX_INSTALLATION_ROOT environment variable that I don’t yet know anything about. I run the uninstall script. It works, though provides no feedback. I install again. dfx is not immediatly in my PATH. The install script or the docs could do a bit better in guiding the user here. I know from experience that this first step of getting PATH set correctly is a very common blocker for newbies. Unfortunately there are no perfect technical solutions to setting up PATH across all platforms, so informing the user about it has to be part of the install experience. I am on Linux. On Aimee’s Mac though dfx is immediately on the path. This is because the installer installed directly to /usr/local/bin. This creeps me out a bit as I am accustomed to needing to sudo to write to that location. Maybe it’s common on Macs to install directly to /usr/local/bin without permission. On Linux, my dfx is in ~/bin. While experimenting with the install script I hit a particularly strange bug: When prompted to accept the license, if I hit CTRL-C to quit, I am not dropped back to my own shell; instead I am dropped into the shell the install instructions asked me to run as part of downloading and running the script. In other words, in the command $ sh -ci "$(curl -fsSL https://sdk.dfinity.org/install.sh)" That initial sh command is still running after I kill the script. This confuses me a lot for a bit. I poke at the script for a bit to see if I can fix the problem, and one way to do it is with the trap shell command: trap exit 2 Though it should probably do more cleanup than just exit. I note that rustup does not do this though, and I am not sure offhand why rustup’s handling of CTRL-C works correctly where Dfinity’s does not. The next step is to install a VSCode plugin. I don’t use VSCode, so I skip it. Aimee upgrades her dfx Aimee has previously installed dfx. Today when she ran dfx new firsttest to create a Dfinity project, she had a confusing experience. This is what she saw: $ dfx new firsttest The Dfinity Canister SDK sends anonymous usage data to Dfinity Stiftung by default. If you wish to disable this behavior, then please set the environment variable DFX_TELEMETRY_DISABLED=1. Learn more at https://sdk.dfinity.org. Fetching manifest https://sdk.dfinity.org/manifest.json ⠋ Checking for latest dfx version... You seem to be running an outdated version of dfx. You are strongly encouraged to upgrade by running 'dfx upgrade'! Version v0.6.20 installed successfully. Creating new project "firsttest"... CREATE firsttest/src/firsttest_assets/assets/sample-asset.txt (24B)... CREATE firsttest/src/firsttest/main.mo (107B)... CREATE firsttest/dfx.json (484B)... CREATE firsttest/.gitignore (165B)... ⠐ Checking for latest dfx version... CREATE firsttest/src/firsttest_assets/public/index.js (149B)... CREATE firsttest/package.json (288B)... CREATE firsttest/webpack.config.js (2.15KB)... ⠉ Checking for latest dfx version... ⠒ Checking for latest dfx version... ⠠ Installing node dependencies... ⠤ Checking for latest dfx version... ⠖ Installing node dependencies... > fsevents@1.2.13 install /Users/aimeez/github/dfinity-project/firsttest/node_modules/watchpack-chokidar2/node_modules/fsevents > node install.js ⠤ Checking for latest dfx version... ⠖ Checking for latest dfx version... ⠒ Checking for latest dfx version... ⠁ Checking for latest dfx version... npm WARN firsttest_assets@0.1.0 No repository field. npm WARN firsttest_assets@0.1.0 No license field. ⠙ Checking for latest dfx version... 13 packages are looking for funding run `npm fund` for details found 1 high severity vulnerability ⠒ Checking for latest dfx version... ⠂ Checking for latest dfx version... =============================================================================== Welcome to the internet computer developer community! You're using dfx 0.6.20 ▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄ ▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄ ▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄ ▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄ ▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄ ▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄ ▄▄▄▄▄▄▄▄▄▄▀▀▀▀▀▄▄▄▄▄▄▄▄▄▄▄▄ ▄▄▄▄▄▄▄▄▄▄▄▄▀▀▀▀▀▀▄▄▄▄▄▄▄▄▄▄ ▄▄▄▄▄▄▄▄▀ ▀▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▀ ▀▄▄▄▄▄▄▄▄▄ ▄▄▄▄▄▄▄▄▀ ▀▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▀ ▄▄▄▄▄▄▄▄ ▄▄▄▄▄▄▄▄ ▀▄▄▄▄▄▄▄▄▄▄▄▄▀ ▄▄▄▄▄▄▄ ▄▄▄▄▄▄▄▄ ▄▄▄▄▄▄▄▄▄▄▄▄ ▄▄▄▄▄▄▄ ▄▄▄▄▄▄▄▄ ▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄ ▄▄▄▄▄▄▄▄ ▄▄▄▄▄▄▄▄ ▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄ ▄▄▄▄▄▄▄▄▀ ▀▄▄▄▄▄▄▄▄▄▄ ▄▄▄▄▄▄▄▄▄▄▄▄▀ ▀▄▄▄▄▄▄▄▄▄▄▄▄ ▄▄▄▄▄▄▄▄▄▄▄ ▀▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▀ ▀▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▀ ▀▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▀ ▀▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄ ▀▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▀▀ ▀▀▄▄▄▄▄▄▄▄▄▄▄▄▄▄▀ ▀▀▀▀▀▀▀▀▀▀▀ ▀▀▀▀▀▀▀▀▀▀▀ To learn more before you start coding, see the documentation available online: - Quick Start: https://sdk.dfinity.org/docs/quickstart/quickstart-intro.html - SDK Developer Tools: https://sdk.dfinity.org/docs/developers-guide/sdk-guide.html - Motoko Language Guide: https://sdk.dfinity.org/docs/language-guide/motoko.html - Motoko Quick Reference: https://sdk.dfinity.org/docs/language-guide/language-manual.html If you want to work on programs right away, try the following commands to get started: cd firsttest dfx help dfx new --help =============================================================================== This is a mess. Several things appear to be going wrong here. The command has printed “you are strongly encouraged to upgrade by running ‘dfx upgrade’, then it goes on to just do the upgrade on its own, saying “Version v0.6.20 installed successfully”. Ever after checking for and installing a dfx upgrade, some process continues “Checking for latest dfx version”. The dfx version check is happening in parallel to the creation and build of the “firsttest” project, causing a confusing interleaving of messages. Even when not interrupted by other messages, the “Checking for latest dfx version” message, which is accompanied by a unicode spinner, and should only appear once while the spinner changes, is printed repeatedly. The “found 1 high severity vulnerability” message gives the impression that this code is not maintained. After some careful reading we think we understand everything that happened. We note that Aimee already had version dfx 0.6.20 installed, but that dfx said it updated to 0.6.20. We don’t know if anything changed about dfx or if it just got confused and reinstalled itself. We try the suggested dfx upgrade, and as we expected it does nothing. So dfx new firsttest suggested we run a command, then ran that command for us, and when we ran the suggested command, it did nothing. Now we are curious about how the output of dfx new firsttest will change if we run it again, without requiring an update, so we delete the new “firsttest” directory and try again: $ dfx new firsttest Fetching manifest https://sdk.dfinity.org/manifest.json Creating new project "firsttest"... CREATE firsttest/src/firsttest_assets/assets/sample-asset.txt (24B)... CREATE firsttest/src/firsttest/main.mo (107B)... CREATE firsttest/dfx.json (484B)... CREATE firsttest/.gitignore (165B)... CREATE firsttest/README.md (1.16KB)... CREATE firsttest/src/firsttest_assets/public/index.js (149B)... CREATE firsttest/package.json (288B)... CREATE firsttest/webpack.config.js (2.15KB)... ⠒ Installing node dependencies... ⠁ Installing node dependencies... npm WARN deprecated resolve-url@0.2.1: https://github.com/lydell/resolve-url#deprecated ⠁ Installing node dependencies... ⠋ Installing node dependencies... > fsevents@1.2.13 install /Users/aimeez/github/dfinity-project/firsttest/node_modules/watchpack-chokidar2/node_modules/fsevents > node install.js ⠒ Installing node dependencies... ⠲ Installing node dependencies... ⠉ Installing node dependencies... ⠲ Installing node dependencies... npm WARN firsttest_assets@0.1.0 No repository field. npm WARN firsttest_assets@0.1.0 No license field. ⠄ Installing node dependencies... 13 packages are looking for funding run `npm fund` for details found 1 high severity vulnerability ⠄ Installing node'''
