["https://brson.github.io/2023/03/12/move-on-llvm"]
title = "Writing an LLVM backend for the Move language in Rust"
full_description = "Writing an LLVM backend for the Move language in Rust 2023-03-12 Since December I and others have been working on a port of the Move programming language to LLVM. This work is sponsored by Solana, with the goal of running Move on Solana and its rbpf VM; though ultimately the work should be portable to other targets supported by LLVM. This work is firmly in the prototyping phase, but I’ve learned a lot and want share what I know so far about writing LLVM compiler backends. At this point we have created the scoffolding for the LLVM backend, and a test harness that compiles Move bytecode, links multiple Move modules with a “native” Move runtime, and runs them inside an rbpf VM test harness. This blog post will describe Move, and some of the features of the Move compiler that make it amenable to compiling to LLVM, what I learned about writing a simple LLVM backend, and a description of the native Move runtime. While this post is about the Move compiler specifically, it also has tidbits relevant to starting an LLVM-based compiler backend generally. Note that I am not a compiler expert. This is a learning project for me, and some of the things I have done here will turn out to be mistakes. The code for the Move LLVM backend is not ready for anybody to do anything with yet, but it lives here: https://github.com/solana-labs/move/tree/llvm-sys/language/tools/move-mv-llvm-compiler https://github.com/solana-labs/move/tree/llvm-sys/language/move-native The first link is the Move bytecode to LLVM compiler, and the second is the native runtime. Table of contents About Move Writing an LLVM backend with Rust The basics of an LLVM backend Challenges of porting Move The Move Model and Move stackless bytecode An outline of lowering Move to LLVM Isolating the unsafe LLVM C API Dealing with missing LLVM APIs A “native” Move runtime Testing and how everything works together What’s next About Move Move is a strongly-statically-typed programming language originally developed at Facebook for writing programs on the now-defunct Libra/Diem blockchain platform. Although Libra is no more, the Move language (as well as other Libra tech) is being used by several projects, most notably Aptos and Sui, both started by former Libra devs. The tech that came out of Libra is exceptional in both its design and implementation quality. In addition to Move, the Narwhal / Tusk and Bullshark consensus algorithms that derive from Libra are some of the most elegant and performant (in theory at least) in the industry. Move is written in Rust and is heavily influenced by Rust: it is based on ownership types, and is strongly focused on simplicity, correctness, and analyzability. As part of this focus, Move notably does not have dynamic dispatch. This makes Move exceptionally analyzable, but imposes extreme limitations on what can be expressed between any two programs. It likely will force developers to discover and adopt coding patterns unique to Move. An example of Move from the Move book: module 0x42::test { struct Example has copy, drop { i: u64 } use std::debug; friend 0x42::another_test; const ONE: u64 = 1; public fun print(x: u64) { let sum = x + ONE; let example = Example { i: sum }; debug::print(&sum) } } Move source is compiled to Move bytecode, which runs in the Move VM. Bytecode validation is critical to the correctness and security of interacting Move programs, though I do not yet know in detail how Move bytecode is validated. Also, move has a built-in theorem prover leveraging z3. You can write proofs inline with Move modules: public fun char(byte: u8): Char { assert!(is_valid_char(byte), EINVALID_ASCII_CHARACTER); Char { byte } } spec char { aborts_if !is_valid_char(byte) with EINVALID_ASCII_CHARACTER; } Outside of toys and test cases I have not written much Move myself. Resources about Move: The paper Resources: A Safe Language Abstraction for Money The Official Move Book The Unofficial Move Book Some useful technical blog posts about Move: Smart contract development: Move vs. Rust Securing Move My own First impressions of the Move programming language Writing an LLVM backend with Rust Depending on perspective, when you are using LLVM to emit machine code for your language you are either: writing a backend to your language’s compiler, or writing a frontend to LLVM. I tend to think of the LLVM component being the backend of the compiler, as that’s how the Rust compiler calls it, though when reading LLVM docs you might see compilers like Clang called LLVM frontends. In my experience, writing one’s first LLVM backend is daunting: LLVM is huge, with a sprawling number of instructions, and additional metadata that can be associated with those instructions; the docs are inadequate for newcomers, with especially the API documentation being stunningly difficult to navigate. The LLVM language reference is the most useful LLVM documentation. Non-C++ languages access LLVM primarily through the official LLVM-C bindings, though it is important to understand that not all features of LLVM are exposed through the C bindings, and they are basically undocumented: one will often need to read the source through to the underlying C++ APIs to figure out what the C APIs do. In my experience compilers not written in C++ that uses LLVM as a backend end up writing some C++ glue code to expose extra C APIs for their own use. In the Rust world there are a few options for interfacing to LLVM: llvm-sys - raw unsafe bindings to the LLVM C API inkwell - idiomatic Rust bindings to llvm-sys llvm-ir - another high-level Rust binding As a Rust programmer I have found the easiest way to discover and understand APIs is: read the LLVM language reference to understand what LLVM features I need search the llvm-sys API docs and source to find the LLVM-C functions I need search the inkwell API docs and source to understand how to use the LLVM-C functions Inwkwell uses the Rust type system to make explicit the ownership relationship of objects in the LLVM API. The Rust bindings to LLVM are much easier to navigate and search than the official C++ API docs. The Rust compiler itself has its own crate of LLVM bindings, and while one could use it directly, I wouldn’t recommend it, as it depends on Rust’s own LLVM fork, and is filled with Rust-specific glue code. Most projects will not need all the esoteric LLVM patches that rustc carries around. The rustc LLVM bindings though are a great reference for how to access LLVM features that are not exposed through the LLVM C APIs. The Move LLVM backend uses the llvm-sys crate to access LLVM, wrapping the unsafe calls in its own lightweight wrapper types that provide some amount of memory safety as well as higher-level semantic operations appropriate to the Move language. The basics of an LLVM backend While LLVM is intimidating in its breadth and complexity, one can get started with only a few simple principles. First, the basics: The unit of compilation in LLVM is a module. This might correspond to e.g. a C source file, or a Rust crate. Modules contain local function definitions, and declarations of functions that exist elsewhere (to be linked later). LLVM provides typical integer and float (scalar) types. LLVM provides arrays of types. LLVM has structs, anonymous or named, and for our purposes we will give them all a name within the module. Pointers are untyped (like void*): their type must be named whenever they are used. So the basic task of getting a compiler started is deciding where the module boundaries are, declaring all the local and external functions, declaring all the struct types, and then defining the functions. The LLVM model consists mainly of pointers to memory and registers. Some of those pointers are to stack variables that LLVM calls allocas. LLVM functions are composed of a list of basic blocks which contain instructions. Basic blocks are the targets of branching instructions. In reading about compilers and code generation, one will quickly come across the concept of single static assignment (SSA) form. This is a common model wherein the compiler operates on virtual registers that are assigned exactly once. Compilers love this form because it is easy to analyze. You don’t need to care about SSA, or the confusing notion of phi nodes that link registers across blocks. Instead, in defining a function your job is to declare allocas for all the local variables, then for every operation in your language: load those variables into a register, perform an operation on it, and store it back to an alloca. In a real machine this would be inefficient, loading from memory to registers and back for every operation. LLVM though has an optimization pass called mem2reg that transforms allocas into SSA registers. You will also need to terminate every block with a branch to another block or a function return. That’s enough to get started, and that’s about as much as we’ve accomplished with the Move LLVM backend. I’m sure I’ll learn about all the mistakes I’ve made as we progress further. Challenges of porting Move There is reason to be skeptical of porting Move to platforms other than the Move VM: the Move language and the Move VM are tightly integrated, and Move bytecode must be validated before running it to be correct. This suggests that any platftorm not interpreting bytecode will have some big challenges maintaining Move’s correctness guarantees. I don’t actually know what all those guarantees are, nor what validations are performed on the bytecode, but I have a vague guess of why bytecode validation is so important: Any two blockchain programs cannot trust each other with the other’s data, otherwise one program would simply steal from the other. On most blockchains there is a strong process boundary between any two programs to enforce they do not interfere directly with each other’s operation. I suspect that Move relies on its strong type system to let mutually-distrusting programs operate within the same address/data space; as long as the programs follow the ownershp-based type system, they cannot access any non-owned data; and there are rules that the bytecode must follow in order for the type system to be sound. Assuming the above is vaguely in the ballpark, I only have three ideas for how to maintain safety in a non-Move VM: Run every Move module in its own process and emit code at the boundaries that dynamically verifies certain invariants; while also marshalling arbitrary Move values, including reference types, across those boundaries. This strategy seems extremely speculative to me. If this is possible it will be only with exceptional effort. Have a trusted party compile the Move bytecode to LLVM. Just as the Move VM validates the bytecode, this trusted party does as well. This trusted party could be, e.g. the Solana validators themselves or a secondary consensus network dedicated just to generating native-compiled Move code that can be trusted. This is the most-obviously workable solution. Run the translated programs off-chain, through a zero-knowledge-proof execution environment, like RISC-0, to generate proofs of correct execution, and verify the proofs with an on-chain program. This would still require some method to guarantee that the individual RISC-0 modules a complete program is linked from correspond to particular Move bytecode; but that seems to me an eaiser problem than verifying that arbitrary machine code corresponds to Move bytecode. This is also extremely speculative, as RISC-0 is very new, and I don’t have any experience. I note that Move already includes an EVM backend that targets YUL, Solidity’s intermediate language. I have not read that code yet, but it presumably contains opinions about this problem. From my perspective, this is still a distant problem, though admittedly perhaps insurmountable. At present we are still just getting basic compiler-stuff working. Another technical challenge is that the Move VM is a stack machine, and LLVM is a register machine, so how to translate one to the other is not immediately obvious. The Move Model and Move stackless bytecode Move already has a solution for register-based backends: Move stackless bytecode. Stackless bytecode is a transformation of the Move bytecode to a register machine model. It is used by the Move theorem prover, as well as the port of Move to YUL. The Move stackless bytecode is refreshingly simple, a great foundation for doing codegen — as soon as I looked at it it was obvious how to lower it to LLVM. The bytecode itself is represented as an enum: pub enum Bytecode { Assign(AttrId, TempIndex, TempIndex, AssignKind), Call( AttrId, Vec<TempIndex>, Operation, Vec<TempIndex>, Option<AbortAction>, ), Ret(AttrId, Vec<TempIndex>), Load(AttrId, TempIndex, Constant), Branch(AttrId, Label, Label, TempIndex), Jump(AttrId, Label), Label(AttrId, Label), Abort(AttrId, TempIndex), Nop(AttrId), SaveMem(AttrId, MemoryLabel, QualifiedInstId<StructId>), SaveSpecVar(AttrId, MemoryLabel, QualifiedInstId<SpecVarId>), Prop(AttrId, PropKind, Exp), } These TempIndex types are indexes into a table of local variables, and all of the stackless bytecodes operate over them. Depending on your perspective one might think of these TempIndexes as either registers or stack slots. The Label types represent branch targets; a compiler might think of them as the start of basic blocks. That Bytecode::Call variant does most of the work, representing most Move operations as function-like calls via the Operation enum: pub enum Operation { // User function Function(ModuleId, FunId, Vec<Type>), // Markers for beginning and end of transformed // opaque function calls (the function call is replaced // by assumes/asserts/gotos, but it is necessary to // add more assumes/asserts later in the pipeline. OpaqueCallBegin(ModuleId, FunId, Vec<Type>), OpaqueCallEnd(ModuleId, FunId, Vec<Type>), // Pack/Unpack Pack(ModuleId, StructId, Vec<Type>), Unpack(ModuleId, StructId, Vec<Type>), // Resources MoveTo(ModuleId, StructId, Vec<Type>), MoveFrom(ModuleId, StructId, Vec<Type>), Exists(ModuleId, StructId, Vec<Type>), // Borrow BorrowLoc, BorrowField(ModuleId, StructId, Vec<Type>, usize), BorrowGlobal(ModuleId, StructId, Vec<Type>), // Get GetField(ModuleId, StructId, Vec<Type>, usize), GetGlobal(ModuleId, StructId, Vec<Type>), // Builtins Uninit, Destroy, ReadRef, WriteRef, FreezeRef, Havoc(HavocKind), Stop, // Memory model IsParent(BorrowNode, BorrowEdge), WriteBack(BorrowNode, BorrowEdge), UnpackRef, PackRef, UnpackRefDeep, PackRefDeep, // Unary CastU8, CastU16, CastU32, CastU64, CastU128, Not, // Binary Add, Sub, Mul, Div, Mod, BitOr, BitAnd, Xor, Shl, Shr, Lt, Gt, Le, Ge, Or, And, Eq, Neq, CastU256, // Debugging TraceLocal(TempIndex), TraceReturn(usize), TraceAbort, TraceExp(TraceKind, NodeId), TraceGlobalMem(QualifiedInstId<StructId>), // Event EmitEvent, EventStoreDiverge, } Move also provides the “Move model”, a whole-program analysis of a Move program and its dependencies that provides most or all of the me"
