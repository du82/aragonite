full_description = 'Board Game Art | Part One The War for New Eden from Titan Forge & CCP Games A selection of the illustrations I created for the Factional Development Cards included in the War for New Eden Board Game. Each illustration goes to a specific card in the game and was designed to compliment and enhance the instructions included on each card. The illustrations utilize a wide variety of techniques and each one is an original creation unique to the game. Officially Licensed Artwork ©2024 CCP hf. All rights reserved. “CCP”, the CCP Logo, “EVE”, “EVE Online”, and the EVE Online logo are trademarks or registered trademarks of CCP hf. All other trademarks and trade names are the properties of their respective owners. <div class="grid__image-wrapper"> <img src="https://cdn.myportfolio.com/b19d3f993a1f020f99e1ffdc551637b6/2244975c-0bf9-4ca2-b7ea-024df617d5da_rw_3840.jpg?h=7b9081624134ebe65be279961ea186e8" srcset="https://cdn.myportfolio.com/b19d3f993a1f020f99e1ffdc551637b6/2244975c-0bf9-4ca2-b7ea-024df617d5da_rw_600.jpg?h=0c749320aab1598a79d20ea74a73329a 600w,https://cdn.myportfolio.com/b19d3f993a1f020f99e1ffdc551637b6/2244975c-0bf9-4ca2-b7ea-024df617d5da_rw_1200.jpg?h=d8f8f29917569d80d29e2c0212377910 1200w,https://cdn.myportfolio.com/b19d3f993a1f020f99e1ffdc551637b6/2244975c-0bf9-4ca2-b7ea-024df617d5da_rw_1920.jpg?h=99912bf17638ef782b160e9a1bf20a29 1920w,https://cdn.myportfolio.com/b19d3f993a1f020f99e1ffdc551637b6/2244975c-0bf9-4ca2-b7ea-024df617d5da_rw_3840.jpg?h=7b9081624134ebe65be279961ea186e8 3840w," sizes="(max-width: 3840px) 100vw, 3840px"> <div> <div class="grid__image-wrapper"> <img src="https://cdn.myportfolio.com/b19d3f993a1f020f99e1ffdc551637b6/372f286a-8c26-4455-ac55-b1aa5683475a_rw_3840.jpg?h=9e10e3dd2051427f85881e1607d361fe" srcset="https://cdn.myportfolio.com/b19d3f993a1f020f99e1ffdc551637b6/372f286a-8c26-4455-ac55-b1aa5683475a_rw_600.jpg?h=cd7b2387847c7c084ecf8d557aec04a3 600w,https://cdn.myportfolio.com/b19d3f993a1f020f99e1ffdc551637b6/372f286a