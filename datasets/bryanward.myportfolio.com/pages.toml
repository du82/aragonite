full_description = '''About BRYAN K. WARDArt Director. Designer. Illustrator. CreativeI've been a professional creative for over 30 years. Between 2001 and 2012 I owned an innovative and ground-breaking creative advertising agency called Giant Ideas. Since then I've primarily been consulting with companies in one kind of crisis or another.Over my career I've been paid to be a comic book artist, graphic designer, creative director, video editor, drone operator, writer, lyricist, cartoonist, developer, content creator, commercial director, and most recently Chief Marketing Officer - if it is creative someone has probably paid me to do it. Now Accepting Commissions and AssignmentsBryan K. Ward • bryan@takemeforward.com My Flickr Portfolio SOME AWARDS3 International WEBBY Awards12 CTAM Mark Awards for Cable Marketing Excellence47 Telly Awards for Broadcast Excellence22 Addy Awards for Creative Excellence4 Philadelphia Art Directors Club Awards for Creative6 Pittsburgh AIR Awards for Achievement in RadioErnst & Young Entrepreneur of the YearMicrosoft "Realizing Business Potential" AwardPittsburgh Advertising Federation Hall of Achievement2007-2012 MDA National Vice PresidentDiamond Award, Region's "Best CEO" Mid-Sized CompaniesPittsburgh Business Times Fast-Tracker 2003Featured in PRINT MagazineAnd more. ↑Back to Top Powered by Bryan K. Ward'''
