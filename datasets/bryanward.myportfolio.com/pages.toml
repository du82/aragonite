full_description = 'Code Metal Branding Code Metal is an exciting start-up drawing on years of experience from leading AI labs at MIT and industry giants like Meta, Microsoft and Amazon, the Code Metal team has mastered the science of translating sophisticated research algorithms for cutting-edge platforms, from the F-35 Joint Strike Fighter to the Microsoft HoloLens.I created an exciting branding platform to help them stand out from the crowd and capture their unique new company. The OuroborusThe intentional reduction in the design, which embodies the concept of "Code," comes together to form an Ouroboros, symbolizing infinity and rebirth. In this representation, the "less than" and "greater than" symbols in coding are merged, encapsulating a complete cycle. The integration of the "eye" element breathes life into this composition, providing a metaphorical window into intelligence, akin to a soul. Code + Metal <div class="grid__image-wrapper"> <img src="https://cdn.myportfolio.com/b19d3f993a1f020f99e1ffdc551637b6/7e3e7ca8-07ab-4822-9b5c-01b4107f58f2_rw_1200.jpg?h=03b63a4697a7cf3fa24186933a85e7cc" srcset="https://cdn.myportfolio.com/b19d3f993a1f020f99e1ffdc551637b6/7e3e7ca8-07ab-4822-9b5c-01b4107f58f2_rw_600.jpg?h=354b556a80b2dd3fd80b06f417d2546b 600w,https://cdn.myportfolio.com/b19d3f993a1f020f99e1ffdc551637b6/7e3e7ca8-07ab-4822-9b5c-01b4107f58f2_rw_1200.jpg?h=03b63a4697a7cf3fa24186933a85e7cc 1200w," sizes="(max-width: 1200px) 100vw, 1200px"> <div> <div class="grid__image-wrapper"> <img src="https://cdn.myportfolio.com/b19d3f993a1f020f99e1ffdc551637b6/1d51952c-525d-4e65-856b-acfc9b73c1ba_rw_1200.jpg?h=89accb384213e52dd673a537b2c9f6e5" srcset="https://cdn.myportfolio.com/b19d3f993a1f020f99e1ffdc551637b6/1d51952c-525d-4e65-856b-acfc9b73c1ba_rw_600.jpg?h=674cf27ecf96074c41e10360a451ade3 600w,https://cdn.myportfolio.com/b19d3f993a1f020f99e1ffdc551637b6/1d51952c-525d-4e65-856b-acfc9b73c1ba_rw_1200.jpg?h=89accb384213e52dd673a537b2c9f6e5 1200w," sizes="(max-width: 1200px) 