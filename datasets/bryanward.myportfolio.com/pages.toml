full_description = 'Eve Online | Board Game The War for New Eden from Titan Forge & CCP Games I am extremely fortunate to be working with the talented team at Titan Forge, an amazing independent gaming company located in Poland, to help bring the long-running and legendary MMORPG Eve Online to life in an impressive new board game called War For New Eden. The project was created in partnership with the games creator CCP Games in Iceland. I am working as a designer and illustrator on the project creating packaging, card designs, game design, and illustration work for the entire series from concept to final production. Officially Licensed Artwork ©2024 CCP hf. All rights reserved. “CCP”, the CCP Logo, “EVE”, “EVE Online”, and the EVE Online logo are trademarks or registered trademarks of CCP hf. All other trademarks and trade names are the properties of their respective owners. <div class="grid__image-wrapper"> <img src="https://cdn.myportfolio.com/b19d3f993a1f020f99e1ffdc551637b6/a230ab63-b124-4035-8aa8-5f526f2a6d46_rw_1200.jpg?h=09f5409e48a1e28cb02f44fb3524be10" srcset="https://cdn.myportfolio.com/b19d3f993a1f020f99e1ffdc551637b6/a230ab63-b124-4035-8aa8-5f526f2a6d46_rw_600.jpg?h=3cb60206d3ae135e51c07a6240a8e26a 600w,https://cdn.myportfolio.com/b19d3f993a1f020f99e1ffdc551637b6/a230ab63-b124-4035-8aa8-5f526f2a6d46_rw_1200.jpg?h=09f5409e48a1e28cb02f44fb3524be10 780w," sizes="(max-width: 780px) 100vw, 780px"> <div> <div class="grid__image-wrapper"> <img src="https://cdn.myportfolio.com/b19d3f993a1f020f99e1ffdc551637b6/7581ec5d-59e9-429f-b470-19a2c2ccf05f_rw_1200.jpg?h=e9200f695d02194d776dec5e3f2daca2" srcset="https://cdn.myportfolio.com/b19d3f993a1f020f99e1ffdc551637b6/7581ec5d-59e9-429f-b470-19a2c2ccf05f_rw_600.jpg?h=5b09e92ea7de110395a4b280c8a3517c 600w,https://cdn.myportfolio.com/b19d3f993a1f020f99e1ffdc551637b6/7581ec5d-59e9-429f-b470-19a2c2ccf05f_rw_1200.jpg?h=e9200f695d02194d776dec5e3f2daca2 780w," sizes="(max-width: 780px) 100vw, 780px"> <div> <div class="grid__im