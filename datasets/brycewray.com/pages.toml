["https://brycewray.com/posts/2024/12/hints-new-stuff-hugo"]
title = "Hints of new stuff in Hugo | BryceWray.com"
description = "The Hugo team releases intriguing nuggets about the next full version."
full_description = '''If you typically don’t follow the social media postings from the team behind the Hugo static site generator, you might have missed yesterday’s highly interesting disclosures about the next full version of Hugo.In case you didn’t see these posts, here you go:@gohugoio@fosstodon.orgComing in next Hugo: Site wide JavaScript code splitting, build JavaScript/TypeScript/JSX/TSX in page bundles (see video), much improved source maps support, and more:.img-3bc179a5a1be1c2f851abfeabc8bffcb{aspect-ratio:1796/1478} (Your browser doesn’t support the video tag.)3:07 PM • December 7, 2024 (UTC)@gohugoio@fosstodon.orgAlso new and visible in the the video: CSS import/bundling, dataurl etc. loading of imported PNGs.4:09 PM • December 7, 2024 (UTC)As of this writing, the latest major release of Hugo is v.0.139.0 (2024-11-18). There is no fixed cadence for Hugo full releases; but, given that the Hugo team is now willing to share these intriguing nuggets about what I presume will be v.0.140.0, one could guess that we won’t have to wait long to get our digital hands on the promised goodies in this next version.Same-day update: After I announced this post on Mastodon and Bluesky, I received the following reply on the latter platform. You may find it of interest.Not that it matters. Because the Hugo team has been stuck in beta for years and refuses to follow semantic versioning, any upgrade is potentially breaking in very major ways. Most folks I know never upgrade as a result.— Chris Ferdinandi (@cferdinandi.bsky.social) 2024-12-08T16:53:56.242ZLatest commit (71737b926) for page file:2024-12-09 at 12:14:09 PM CST.Page historyvar email64Link="aHJlZj0ibWFpbHRvOmJ3QGJyeWNld3JheS5jb20=";document.write("<a "+atob(email64Link)+'?subject=“Hints of new stuff in Hugo”" class="contact-button">') Reply via email<p class="ctr legal">“Reply via email” button and its contained email link hidden in an attempt to limit spambots’ access. Please activate JavaScript to see the button.</p>View comments<p class="ctr legal">Commenting feature requires activation of JavaScript.</p>'''
