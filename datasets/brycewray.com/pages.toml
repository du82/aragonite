["https://brycewray.com/colophon"]
title = "Colophon | BryceWray.com"
description = "How I build this site."
full_description = "Inspired by “Slash Pages,” of which I first learned in Manuel “Manu” Moreale’s “Slashes” (2024-06-01), this page describes how I build this site.This site has been online since September, 2018. I build and maintain it using the Hugo static site generator. The site host is Cloudflare Pages. I do compatibility testing of the site on Chromium-based, Webkit-based, and Gecko-based browsers, testing on screen sizes for both desktop computing and mobile devices.The site’s main typography changes from time to time as the mood (or guilt over making you download web fonts) strikes me, varying between either system fonts or a self-hosted variable web font, typically either Inter or Libre Franklin. On devices with screen sizes under 1024 pixels, I show only system fonts. I do this since those devices may be more likely to experience sub-optimal connectivity and thus would benefit from not having to download web fonts.I style the site using bespoke CSS or Sass, with any further processing as needed through either PostCSS or Lightning CSS. Sass is always a tempting option because Hugo1 works so well with it and often needs no added processing, while it takes some doing to make Hugo and Lightning CSS work together for handling vanilla CSS. I occasionally futz around with Tailwind CSS, especially when a newer version arrives out with some interesting new features, but I seem inevitably to come running back to my own styling because I keep running into edge cases — yes, even on a simple site like this one — for which TWCSS just isn’t yet well-suited.I have spent many hours trying to make the site as accessible as possible, often using tools provided by WebAIM, a service provided by Utah State University’s Institute for Disability Research, Policy, and Practice. I strongly recommend other site owners refer to WebAIM and similar sites for help in this regard.Similarly, the site functions properly either with or without JavaScript’s being enabled in your browser, for those of you who prefer to browse JS-free. You’ll be able to read all the content, but certain JS-powered extra features will either be invisible or otherwise unavailable. Note that, on the search page, a browser with disabled JavaScript will still be able to search the site using DuckDuckGo rather than the site’s built-in search.Although I formerly used Fathom Analytics (and am still affiliated with it), I later decided the site’s visitor count was too small to justify the expense. However, I do miss Fathom on those extremely rare cases wherein one of my posts goes semi-viral, which I can still detect in much more limited ways via Cloudflare’s Web Analytics data — speaking of which, please also refer to my privacy policy for additional information.Please note also:For those pages displaying Git commit information, newer Git commits don’t necessarily reflect changes in previously published content. Modification dates and times use the U.S. Central time zone (CDT/CST) unless otherwise noted.Displayed content statistics (word count and reading time) can vary based on the site-generation process, and don’t include any code blocks or details elements where applicable.Note that only the extended version of Hugo has built-in Sass-compilation powers. That’s why it’s the only Hugo version I use, just in case. ↩︎Latest commit (3eb3f901c) for page file:2024-06-07 at 2:28:13 PM CDT.Page history"
