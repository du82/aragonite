["https://brycewray.com/privacy"]
title = "Privacy policy | BryceWray.com"
description = "Information regarding this site and its vendors."
full_description = "This site and its owner do NOT store your personal information in any way. It neither deposits nor reads cookies, and leaves only one small setting in local storage to retain your light-/dark-mode viewing preferences for any future visits you make to the site.1In addition, the site uses certain external services, each of which has its own privacy policies and methods of complying with applicable privacy regulations.CloudflareThis site is hosted on Cloudflare Pages and is configured to use Cloudflare’s Web Analytics tool, which Cloudflare claims doesn’t track individual users and doesn’t leave cookies.giscusThe site’s giscus commenting system, which is based on the GitHub Discussions search API, performs no tracking.MastodonThis site reproduces Mastodon toots as purely static text and downloaded images with no tracking involved. Each toot is linked to its original location on the applicable Mastodon instance.YouTubeThis site uses lite-youtube-embed to provide YouTube embeds that respect your privacy.2See also “It’s tri-state switch time.” ↩︎I based this on Sia Karamalegos’s article, “Faster YouTube embeds in Eleventy” (although my site uses Hugo). ↩︎Latest commit (34db53fa6) for page file:2024-06-02 at 1:20:04 PM CDT.Page history"
