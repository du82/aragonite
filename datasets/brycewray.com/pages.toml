["https://brycewray.com/sitemap"]
title = "Sitemap (HTML form) | BryceWray.com"
description = "Some thoughts on where things are in the world of web browsers."
full_description = "While it doesn’t do static embeds, this shortcode gives you an easy way to show content from an increasingly popular social network. If you count your JavaScript load, be aware of this recent change to the 1Password browser extension. After my code exceeds the limits of an already overly generous Free Plan, I again process all images locally. With thanks as always to other, smarter folks, I implement a mode switch that gives you yet another option. The CSS-or-Sass question about styling variables is a lot simpler to answer when you’re building your site the right way. Nearly five years after the original description of my redundancy routine, here’s how I’m doing it now. Although the fabled Year of the Linux Desktop probably will never happen, a simple (?) kernel tweak could do wonders for desktop adoption. Spare yourself the swiveling and neck-straining. There’s a much less painful way to work through the Arch installation process. Due to the ongoing FOSSverse fuss over Red Hat’s recent moves, my Linux experimentation takes a different turn. Needing a reliable way to coordinate all my browsers’ bookmarks, I trial what I learn is a venerable option. The goal was to offer a comments section without forcing a massive JavaScript load on every visitor. Mission accomplished. Here’s how. A number of things that are bouncing around these days inside my somewhat reasonable facsimile of a brain. My recommended TOTP app changes ownership under questionable circumstances — so I replace that recommendation. Not long after receiving a short-sighted shafting, my favorite JavaScript-based SSG and its creator wind up in good and friendly hands. Here’s a more hosts-friendly way to take advantage of both the built-in Hugo asset pipeline and a digital assets management host. A Cloudinary blog post makes a strong case for an image codec that deserves wider support — and soon will get it. A shell script based on my GitHub Action suddenly makes it a breeze to install both Hugo and Dart Sass."
