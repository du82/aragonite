full_description = "Verbraucherinnen und Verbraucher: Einen Vorfall bewältigen, melden, sich informieren, vorbeugen Im Bereich Digitaler Verbraucherschutz stellt das BSI ein umfangreiches Informationsportal für Bürgerinnen und Bürger zur Verfügung. Über unsere Hotline können unsere Mitarbeiterinnen und Mitarbeiter Sie zudem persönlich beraten und bei Verständnisfragen weiterhelfen. Bitte beachten Sie aber, dass wir Ihnen leider keinen unmittelbaren Support für Ihr IT-Gerät anbieten können. Alle wichtigen Schritte, die es bei einem IT-Sicherheitsvorfall zu beachten gilt, haben wir hier für Sie in aller Kürze bereitgestellt: Ich habe einen IT-Sicher­heits­vor­fall - Was soll ich tun? Mehr : Ich habe einen IT-Sicher­heits­vor­fall - Was soll ich tun? Ich möchte einen IT-Sicherheitsvorfall melden. Mehr : Ich möchte einen IT-Sicherheitsvorfall melden. CVD-Richtlinie des BSI Mehr : CVD-Richtlinie des BSI Ich suche aktuelle Informationen zu IT-Sicherheitsbedrohungen. Mehr : Ich suche aktuelle Informationen zu IT-Sicherheitsbedrohungen. Wie kann ich meine IT vor Cyber-Angriffen schützen? Mehr : Wie kann ich meine IT vor Cyber-Angriffen schützen?"
