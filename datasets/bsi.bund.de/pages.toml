["https://bsi.bund.de/DE/Service-Navi/Vergaben-an-Externe/vergaben-an-externe_node.html"]
title = "BSI  -  Vergaben an Externe"
full_description = 'Vergaben im BSI Eine Vielzahl an Beschaffungen, Entwicklungsvorhaben und Studien wird vom BSI an externe Auftragnehmer vergeben. Diese Ausschreibungen werden grundsätzlich im Deutschen Ausschreibungsblatt, ggfs. bei Erreichen des Schwellenwertes zusätzlich im Supplement der EU sowie auf unserer Internetseite veröffentlicht. Ausschreibungen des BSI im Vergabeportal des Bundes Im Rahmen der Initiative "Bund Online 2005" wurde durch das Beschaffungsamt des BMI die elektronische Vergabe-Plattform des Bundes entwickelt. Auch das BSI wird ab sofort die Veröffentlichungen zu Ausschreibungen auch auf der zentralen Internet-Plattform unter www.evergabe-online.de bekannt geben. Die e-Vergabe Auftragsvergabe per Internet – mühelos und sicher. Vorbei sind die Zeiten, in denen die Unternehmen eine Vielzahl von Amtsblättern wälzen und Papiervordrucke ausfüllen mussten, um sich an den Ausschreibungen der öffentlichen Verwaltung zu beteiligen. Über die zentrale Vergabeplattform des Bundes können Sie jetzt auch aktuelle Ausschreibungen des BSI einsehen, sich die Daten bequem herunterladen und bearbeiten. Einfach per Mausklick übermitteln Sie dann Ihr Angebot an die Vergabestelle des BSI. Dies geschieht sicher und für Dritte nicht lesbar. Auch die Angebotszuschläge und Vertragsabschlüsse können elektronisch erfolgen. Die e-Vergabe macht´s möglich: Nutzen Sie die Vorteile! Das Vergabeverfahren wird vollständig elektronisch über die e-Vergabe-Plattform abgewickelt. Für die Teilnahme benötigen Sie lediglich eine Signaturkarte und ein Kartenlesegerät. Weitere Informationen erhalten sie darüber hinaus unter: www.bescha.bund.dewww.evergabe-online.dewww.evergabe-schulung.de Die Teilnahme an der eVergabe setzt die Registrierung auf der eVergabe-Plattform voraus (siehe dazu Registrierung/Anmeldung unter www.evergabe-online.de). Bei Fragen oder Problemen steht Ihnen die Hotline im Beschaffungsamt des BMI telefonisch unter 0228 610-1234 bzw. per E-Mail unter support@bescha.bund.de zur Verfügung. Ähnliche Themen Pres­se Me­dia­thek Pu­bli­ka­tio­nen Newslet­ter und So­ci­al Me­dia Ver­an­stal­tun­gen Die E-Rech­nung im BSI Kos­ten für Leis­tun­gen des BSI Kon­takt Fra­gen & Ant­wor­ten Zurück zu Bundesamt für Sicherheit in der Informationstechnik Kurz-URL: https://www.bsi.bund.de/dok/6670746'
