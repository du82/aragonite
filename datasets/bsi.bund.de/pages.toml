["https://bsi.bund.de/DE/Service-Navi/Hinweise-Kosten/Hinweise-Kosten_node.html"]
title = "BSI  -  Kosten für Leistungen des BSI"
full_description = 'Kosten für Leistungen des BSIHinweise zur Erhebung von Kosten (Gebühren und Auslagen) durch das BSI Diese Hinweise geben einen ersten Überblick über die Kosten, die bei einer Inanspruchnahme von Leistungen des Bundesamts für Sicherheit in der Informationstechnik (BSI) anfallen. Sie schaffen Transparenz – egal, ob Sie derzeit über eine Antragstellung nachdenken, bereits ein Verfahren des BSI im Gange ist oder bereits ein Kostenbescheid des BSI vorliegt. Die folgenden Ausführungen gelten nicht für Leistungen des BSI nach dem Informationsfreiheitsgesetz (IFG) oder für durch das BSI durchgeführte Bußgeldverfahren nach dem Gesetz über Ordnungswidrigkeiten (OWiG). Gesetzliche Grundlagen Das BSI erhebt Kosten (Gebühren und Auslagen) auf Grundlage der Besonderen Gebührenverordnung des Bundesministeriums des Innern, für Bau und Heimat für individuell zurechenbare öffentliche Leistungen in dessen Zuständigkeitsbereich (BMIBGebV). Maßgeblich sind dort die Abschnitte 7 und 8 des Gebühren- und Auslagenverzeichnisses (Anlage zu § 2 Absatz 1 der BMIBGebV). Darin sind die so genannten Gebührentatbestände enthalten, die für das BSI maßgebend sind. Weitere Vorschriften im Zusammenhang mit der Kostenerhebung finden sich in der Allgemeinen Gebührenverordnung (AGebV), dem Bundesgebührengesetz (BGebG) sowie dem Verwaltungsverfahrensgesetz (VwVfG). Schuldner der Kosten Zur Zahlung verpflichtet ist immer diejenige Organisation beziehungsweise Person, der die durch das BSI erbrachte Leistung individuell zuzurechnen ist, also der sie zugutekommt. In der Regel handelt es sich hierbei um die Antragstellerin beziehungsweise den Antragsteller. Kostenschuldner kann auch eine andere Organisation beziehungsweise Person sein, soweit sie die Kosten übernommen hat. Erforderlich ist hierfür eine ausdrückliche Kostenübernahmeerklärung, die gegenüber dem BSI abzugeben oder dem BSI zu übermitteln ist. Die Mitteilung sollte so früh wie möglich – grundsätzlich mit Antragstellung –, spätestens aber bis zum Abschluss des Verfahrens erfolgen. Andernfalls kann die Übernahme der Kosten durch eine andere Organisation/Person nicht im Kostenbescheid berücksichtigt werden und dieser wird an die Antragstellerin beziehungsweise den Antragsteller gerichtet. Damit der Kostenbescheid des BSI später an der richtigen Stelle ankommt und dort zugeordnet werden kann, sollten Antragstellende im eigenen Interesse bereits im Antrag beziehungsweise der Kostenübernahmeerklärung darauf achten, die korrekte Rechnungsanschrift sowie ggf. die zugehörige Referenz/Bestellnummer anzugeben. Fälligkeit der Kosten Der Kostenbescheid – also gewissermaßen die „Rechnung“ – wird durch das BSI nach dem vollständigen Abschluss der jeweiligen Leistung beziehungsweise des jeweiligen Verfahrens (also i.d.R. nach dem abschließenden Bescheid beziehungsweise der Antragsrücknahme) erstellt und schriftlich per Post an den Kostenschuldner übermittelt. Das Gesetz sieht vor, dass die Kosten zehn Tage nach Erhalt dieses Kostenbescheids zur Zahlung fällig werden, sofern darin kein anderer Zeitpunkt genannt ist. Das BSI legt in seinen Kostenbescheiden grundsätzlich ein großzügigeres Zahlungsziel von 30 Kalendertagen (nach Erhalt des Kostenbescheids) fest. Die Kosten für die Erteilung von IT-Sicherheitskennzeichen sind abweichend davon bereits nach 14 Kalendertagen zu zahlen. Fällt das Ende der Frist auf einen Samstag, einen Sonntag oder einen gesetzlichen Feiertag, so genügt eine Zahlung am nächsten Wochentag, der kein Feiertag ist. Maßgeblich für die Rechtzeitigkeit der Zahlung ist der Eingang auf dem Konto der Bundeskasse. Höhe der Kosten im Einzelfall – Zeitgebühren und Festgebühren Die anfallenden Kosten setzen sich aus Gebühren und Auslagen zusammen: Gebühren decken die regelmäßig anfallenden Aufwände des BSI für die Erbringung der jeweiligen Leistung ab – also im Wesentlichen die Personalkosten. Hinsichtlich der konkreten Abrechnung unterscheidet das Gebühren- und Auslagenverzeichnis zwischen Festgebühren und Zeitgebühren. Festgebühren fallen – bei einem regulären Abschluss des Verfahrens (siehe zu anderen Fällen den folgenden Abschnitt) – pauschal in der im Gebühren- und Auslagenverzeichnis angegebenen Höhe an. Zeitgebühren hängen dagegen von dem konkreten Zeitaufwand ab, den die Mitarbeitenden des BSI auf das jeweilige Verfahren verwendet haben. Der Abrechnung liegen in diesem Fall feststehende Stundensätze zugrunde. Diese Stundensätze sind abhängig von der (beamtenrechtlichen) Laufbahn beziehungsweise der (tarifrechtlichen) Eingruppierung der Beschäftigten, welche die Leistung erbracht haben, und ergeben sich aus der AGebV. [1] Ist für eine Leistung eine Zeitgebühr vorgesehen, kann das zuständige Fachreferat des BSI die voraussichtlichen Zeitaufwände in vielen Fällen prognostizieren, sodass die anfallende Gebühr unverbindlich und vorläufig geschätzt werden kann. Die tatsächlich anfallenden Aufwände in dem jeweiligen Verfahren können sich jedoch aufgrund vielfältiger Faktoren anders entwickeln als erwartet. Bitte haben Sie daher Verständnis, dass die Gebührenhöhe aufgrund der bestehenden gesetzlichen Regelungen erst nach Abschluss der Leistung beziehungsweise des Verfahrens feststeht und nicht im Vorfeld der Leistungserbringung zugesagt werden kann. Ebenso wenig ist die Definition einer verbindlichen maximalen Obergrenze möglich. Für besondere Ausgaben des BSI, die nicht in jedem Verfahren anfallen, können zusätzlich zu der für die Leistung vorgesehenen Zeit- oder Festgebühr noch Auslagen anfallen, die ebenfalls mit dem Kostenbescheid erhoben werden. Das können zum einen Kosten sein, die im Zusammenhang mit Dienstreisen der Beschäftigten des BSI entstanden sind. Zum anderen können dies Kosten für Dritte wie zum Beispiel externe Stellen sein, die durch das BSI beauftragt werden mussten. Beendigung des Verfahrens durch Rücknahme oder Ablehnung des Antrags Wird das Verfahren nicht regulär (i.d.R. durch einen antragsgemäßen Bescheid des BSI), sondern auf anderem Wege (z.B. durch eine Rücknahme des Antrags durch den Antragsteller oder eine Ablehnung des Antrags durch das BSI) abgeschlossen, erhebt das BSI ebenfalls Kosten, also Gebühren und Auslagen. Diese Kosten gehen keinesfalls über die im vorherigen Abschnitt dargestellten Kosten hinaus, können aber u. U. darunterliegen: Bei Zeitgebühren ergeben sich keine Besonderheiten – hier erfolgt die Berechnung so, wie unter "Höhe der Kosten im Einzelfall – Zeitgebühren und Festgebühren" dargestellt. Bei Festgebühren wird der für das konkrete Verfahren angefallene Zeitaufwand ermittelt und mit den Stundensätzen der AGebV multipliziert (also analog zur Ermittlung einer Zeitgebühr). Liegt dieser Betrag unter der für das Verfahren vorgesehenen Festgebühr, wird die so ermittelte Gebühr erhoben. Liegt der Betrag dagegen über der Festgebühr, bleibt es bei der Abrechnung der Festgebühr. Auslagen werden wie im vorherigen Abschnitt beschrieben erhoben, soweit sie bis zum Zeitpunkt der Beendigung tatsächlich angefallen sind. Fiktive Berechnungen o.ä. sind hier ausgeschlossen. Persönliche Gebührenbefreiung Für bestimmte Gebührenschuldner (also i.d.R. Antragssteller) sieht das Gesetz eine grundsätzliche Gebührenfreiheit vor: Gebührenbefreit sind die Bundesrepublik Deutschland (insbesondere alle Behörden der unmittelbaren Bundesverwaltung) sowie die bundesunmittelbaren öffentlich-rechtlichen Körperschaften, Anstalten und Stiftungen, die auf Grund gesetzlicher Verpflichtung ganz oder teilweise aus dem Bundeshaushalt finanziert werden. Die Länder (insbesondere Behörden der unmittelbaren Landesverwaltung) und die landesunmittelbaren öffentlich-rechtlichen Körperschaften, Anstalten und Stiftungen, die auf Grund gesetzlicher Verpflichtung ganz oder teilweise aus dem Bundeshaushalt finanziert werden, sowie die Gemeinden und Gemeindeverbände sind ebenfalls gebührenbefreit. Das gilt jedoch nur, soweit die entsprechende Organisation dem Bund ebenfalls Gebührenfreiheit einräumt. Hier kommt es auf die für die jeweilige Organisation allgemein geltenden kostenrechtlichen Regelungen an (also z.B. das Kosten-/Gebührengesetz des Landes). Es genügt nicht, dass die jeweilige Organisation dem BSI individuell Kostenfreiheit gewährt, z.B. durch eine schriftliche Zusage oder Vereinbarung. Nicht befreit sind in jedem Fall wirtschaftliche Unternehmen der Länder sowie der Gemeinden und Gemeindeverbände. Eine Gebührenfreiheit ist – für alle der oben genannten Organisationen – ausgeschlossen, soweit der Gebührenschuldner berechtigt ist, die Gebühren Dritten aufzuerlegen oder auf Dritte umzulegen. Sofern eine Gebührenfreiheit für Ihre Organisation grundsätzlich in Betracht kommt, erhalten Sie vom BSI ein Formular, mit welchem die erforderlichen Angaben (siehe vorherige Absätze) erfasst werden. Dieses Formular ist binnen 14 Tagen vollständig ausgefüllt an das BSI zurück zu senden. Sie erhalten dann eine Bestätigung der Gebührenfreiheit beziehungsweise eine Ablehnung durch das BSI-Referat Z 21 (Haushalt). Die entsprechenden Angaben sind von Amts wegen zu machen, das BSI kann diese nicht von sich aus ermitteln. Auslagen für Dienstreisen oder Dritte werden auch dann erhoben, wenn Gebührenfreiheit besteht. Einschränkungen ergeben sich für den Bereich der unmittelbaren Bundesverwaltung allerdings aus dem Haushaltsrecht (§ 61 BHO sowie die hierzu ergangenen Verwaltungsvorschriften). Sachliche Gebührenfreiheit Für bestimmte einfach gelagerte Leistungen wird keine Gebühr erhoben. Das gilt insbesondere fürmündliche, einfache schriftliche oder elektronische Auskünfte,einfache Auskünfte aus Registern und Dateien,einfache elektronische Kopien,Entscheidungen im Bereich des Zuwendungsrechts (also zu Projektförderungen durch das BSI) sowieEntscheidungen über Stundung, Erlass oder Erstattung von Gebühren. Folgen einer verspäteten Zahlung Verspätete oder ausbleibende Zahlungen führen – auf Seiten des BSI genauso wie bei den Zahlungspflichtigen – immer zu Mehraufwänden. Daher sollten angefallene Kosten spätestens zu dem im Bescheid genannten Zeitpunkt gezahlt werden. Werden Kostenforderungen dagegen erst nach dem im Kostenbescheid genannten Fälligkeitszeitpunkt beglichen, fällt in der Regel ein Säumniszuschlag an. Dieser beträgt 1 Prozent des (abgerundeten) rückständigen Betrags für jeden angefangenen Monat der Säumnis. Der Säumniszuschlag wird durch das BSI in einem zusätzlichen Kostenbescheid festgesetzt und vom Zahlungspflichtigen angefordert. Muss aufgrund einer ausbleibenden Zahlung eine Mahnung versandt werden, wird darüber hinaus eine Mahngebühr von 0,5 Prozent des rückständigen Betrags fällig (jedoch mindestens 5,- € und höchstens 150,- €). Zahlungserinnerungen werden nicht unmittelbar durch das BSI, sondern durch die Bundeskasse (Dienstort Trier) erstellt und versendet. Wenden Sie sich bei Rückfragen trotzdem bitte immer an das BSI. Die Bundeskasse kann zu den Hintergründen der Forderung keine Auskunft erteilen. Alle weiteren Schreiben (Kostenbescheide, Mahnungen etc.) werden immer vom BSI selbst erstellt und versandt. Bleibt eine Zahlung auch weiterhin aus, muss das BSI seine Kostenforderung zwangsweise beitreiben lassen. Hierfür ist keine gesonderte gerichtliche Geltendmachung erforderlich – Grundlage für die Vollstreckung ist der Kostenbescheid. Vollstreckungsmaßnahmen werden grundsätzlich durch die Zollverwaltung vorgenommen. Ihre Rechte Selbstverständlich steht es Ihnen frei, die Kostenfestsetzung des BSI überprüfen zu lassen. Bei Fragen oder Unstimmigkeiten helfen die im Kostenbescheid genannten Ansprechpersonen aus dem BSI gerne weiter. Im direkten Kontakt können Missverständnisse ausgeräumt und erforderliche Korrekturen schnell und effizient vorgenommen werden. Eine formale Überprüfung und Neubescheidung können Sie über einen Widerspruch erreichen. Dieser ist beim BSI einzulegen. Weitere Details enthält die Rechtsbehelfsbelehrung am Ende des Kostenbescheids. Wichtiger Hinweis: Die vorstehenden Hinweise wurden nach bestem Wissen und Gewissen zusammengetragen. Wir bitten dennoch um Verständnis, dass das BSI für die Vollständigkeit und Richtigkeit der Angaben keine Gewähr übernehmen kann. Maßgeblich sind immer die gesetzlichen Regelungen, die der Kostenerhebung zugrunde liegen, sowie die durch das BSI erlassenen schriftlichen Kostenbescheide. Sollten Fragen offen geblieben sein, hilft das das BSI-Forderungsmanagement unter der E-Mail-Adresse forderungsmanagement-z21@bsi.bund.de weiter. Beachten Sie, dass das BSI lediglich allgemeine Auskünfte erteilen, jedoch keine Rechtsberatung im Einzelfall gewähren kann. [1] Sowohl die Höhe der Festgebühren als auch die den Zeitgebühren zugrundeliegenden Stundensätze werden regelmäßig angepasst. Tritt eine solche Anpassung während oder nach Abschluss eines laufenden Verfahrens in Kraft, bleiben für die gesamte Abrechnung jedoch die Beträge maßgebend, die zum Zeitpunkt der Antragstellung oder dem Beginn der Tätigkeit des BSI – je nachdem, welcher Zeitpunkt zuerst eingetreten ist – galten. Ähnliche Themen Pres­se Me­dia­thek Pu­bli­ka­tio­nen Newslet­ter und So­ci­al Me­dia Ver­an­stal­tun­gen Ver­ga­ben an Ex­ter­ne Die E-Rech­nung im BSI Kon­takt Fra­gen & Ant­wor­ten Zurück zu Bundesamt für Sicherheit in der Informationstechnik Kurz-URL: https://www.bsi.bund.de/dok/hinweise-kosten'
