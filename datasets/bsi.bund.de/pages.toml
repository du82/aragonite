["https://bsi.bund.de/DE/Service-Navi/Presse/Pressemitteilungen/Presse2025/250227_Drohnen_Cyberbedrohung.html"]
title = "BSI  -  Presse - Drohnen als neue Cyberbedrohung - Wie Unternehmen sich schützen können"
description = "Das BSI stellt eine wachsende Bedrohung durch den Einsatz von Drohnen fest und analysiert in einem aktuellen Arbeitspapier Bedrohungen, die von Drohnennutzlasten ausgehen können. Das Arbeitspapier soll Unternehmen und Organisationen dabei unterstützen, sich auf die neuen Sicherheitsrisiken vorzubereiten und geeignete Schutzmaßnahmen zu ergreifen."
full_description = "Drohnen als neue Cyberbedrohung - Wie Unternehmen sich schützen können Ort Bonn Datum 27.02.2025 Quelle: © Denis Rozhnovsky/ Adobe Stock Das Bundesamt für Sicherheit in der Informationstechnik (BSI) stellt eine wachsende Bedrohung durch den Einsatz von Drohnen fest. In einem aktuellen Arbeitspapier Overview of drone-based cyber threats and aspects of defence analysiert das BSI zentrale Bedrohungen, die von Drohnennutzlasten ausgehen können: Sie reichen von Spionage und Überwachung durch optische oder Wärmebildkameras bis hin zu gezielten Hackerangriffen auf Funkkommunikation (z.B. WLAN, Handy) und IT-Systeme. Drohnen können außerdem als Träger für Sprengkörper, chemische oder biologische Substanzen missbraucht werden, um Anschläge auf cyberrelevante Einrichtungen zu verüben. Diese Nutzlast könnte gegen IT-Systeme, Netzwerke, Personal und wichtige Einrichtungen wie Rechenzentren oder (Not-)Stromversorgungsanlagen eingesetzt werden. Drohnen können Zuladung direkt zu einem Zielobjekt transportieren. Dadurch verlieren herkömmliche Schutzmaßnahmen wie Zäune oder Abschirmungen zunehmend an Wirksamkeit. Das Arbeitspapier des BSI soll Unternehmen und Organisationen dabei unterstützen, sich auf die neuen Sicherheitsrisiken vorzubereiten und geeignete Schutzmaßnahmen zu ergreifen. Basierend auf den Erkenntnissen des BSI umfassen angemessene Gegenmaßnahmen ein breites Spektrum an technischen, organisatorischen und rechtlichen Komponenten. Eine wichtige vorbeugende Maßnahme ist zunächst die Sensibilisierung und Schulung aller Mitarbeitenden. Dazu gehören Informationskampagnen, interne Meldewege für Drohnensichtungen und entsprechende Verhaltensregeln. Das Vermeiden der Kennzeichnung oder Veröffentlichung schützenswerter Gebäudeteile und Installationen reduziert Spionagerisiken. Darüber hinaus lässt sich die optische Aufklärung oder das Abhören von Funkkommunikation durch den Einsatz von Jalousien oder die regelmäßige Kontrolle der Gebäudeaußenhaut und der nahen Umgebung auf eingebrachte Technik erschweren. Selbstverständlich helfen auch die bewährten Techniken der Lauschabwehr. Pressekontakt: Bundesamt für Sicherheit in der Informationstechnik Pressestelle Tel.: 0228-999582-5777 E-Mail: presse@bsi.bund.de Internet: www.bsi.bund.de BSI in Social Media Zum DokumentDownload Overview of drone-based cyber threats and aspects of defence (PDF)"
year_published = 2025
