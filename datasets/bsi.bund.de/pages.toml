full_description = "Kontakt Das Team der Personalgewinnung des BSI Quelle: Uwe Voelkner / bundesfoto Falls ihr Fragen zum Bewerbungsverfahren, zur Einstellung oder rund um das Thema Karriere haben, schaut gerne in unsere FAQs. Für weitere Informationen kontaktiert uns gerne direkt. Rückfragen zum Bewerbungsverfahren Referat Z 12 - Personalgewinnung Telefon: 0228 99 9582-6388 E-Mail: Bewerbung@bsi.bund.de Rückfragen zu Praktika, Abschlussarbeiten und dem DACS-Studiengang Referat Z 12 – Personalgewinnung E-Mail: hochschulen@bsi.bund.de Hinsichtlich der Verwendung eurer Daten beachtet bitte unsere Datenschutzerklärung. Karriere-Veranstaltungen Für den direkten Austausch könnt ihr uns auch gerne auf kommenden Karriere-Events besuchen. In unserer Terminübersicht findet ihr alle Veranstaltungen, an denen das BSI aktiv teilnimmt Social Media Folgt uns auch auf unseren Social Media Kanälen. Ähnliche Themen Wa­rum BSI? Ar­bei­ten im BSI Ein­stieg FAQ Stel­len­an­ge­bo­te Ter­mi­ne Zurück zu Bundesamt für Sicherheit in der Informationstechnik"
