["https://bsi.bund.de/DE/Service-Navi/Presse/Pressemitteilungen/Presse2025/250215_MSC_KI_Demokratie.html"]
title = "BSI  -  Presse - Münchner Sicherheitskonferenz: Was macht KI mit unserer Demokratie?"
description = "Auf der Münchner Sicherheitskonferenz diskutierte Claudia Plattner mit Technologie-Expertinnen und -Experten darüber, wie sich der zunehmende Einsatz von KI auf die demokratische Meinungsbildung auswirkt."
full_description = '''Münchner Sicherheitskonferenz: Was macht KI mit unserer Demokratie? Ort München Datum 15.02.2025 Quelle: BSI v.l.n.r.: Kent Walker (President for Global Affairs bei Google), Claudia Plattner (BSI-Präsidentin), Henna Virkunnen (EU-Vizekommissionspräsidentin für Tech Sovereignty, Security and Democracy) und Gina Neff (Executive Direktorin des Minderoo Centre for Technology and Democracy an der Universität Cambridge). Quelle: BSI Auf der Münchner Sicherheitskonferenz diskutierte Claudia Plattner mit Technologie-Expertinnen und -Experten darüber, wie sich der zunehmende Einsatz von KI auf die demokratische Meinungsbildung auswirkt. Welche Rolle spielt KI in geopolitischen Konfliktlagen? Wie können algorithmische Verzerrungen politische Diskurse und Wahlen beeinflussen und inwieweit muss KI durch Regulierung eingehegt werden? Diese und weitere Fragen besprach Claudia Plattner, Präsidentin des Bundesamtes für Sicherheit in der Informationstechnik (BSI), im Rahmen der Münchner Sicherheitskonferenz mit Henna Virkkunen, EU-Vizekommissionspräsidentin für Tech Sovereignty, Security and Democracy, Kent Walker, President Global Affairs bei Google, und Amba Kak, Co-Executive Director des AI Now Institute. Gina Neff, Executive Director des Minderoo Centre for Technology and Democracy an der Universität Cambridge, moderierte die Diskussion. BSI-Präsidentin Claudia Plattner verwies auf die Interdependenz von Technologie und politischer wie wirtschaftlicher Stärke und betonte, dass gesetzliche Regulierung von Künstlicher Intelligenz nicht den technologischen Fortschritt verlangsamen dürfe: „Wir müssen einen wirksamen regulatorischen Rahmen schaffen, der es uns ermöglicht, vom Fortschritt der KI zu profitieren. Das Erreichen dieses Gleichgewichts ist für unsere Demokratie von entscheidender Bedeutung. Wir müssen mit technologischen Innovationen Schritt halten, um wirtschaftlich erfolgreich zu sein und die Herausforderungen unserer Zeit zu meistern. Die Geschwindigkeit, mit der wir unsere digitalen Fähigkeiten weiterentwickeln, wird über unsere Zukunft entscheiden. In diesem Zusammenhang sprechen wir vom Aufkommen einer dritten Dimension, die zu den beiden traditionellen Dimensionen - Wirtschaft und Sicherheit - hinzukommt. Diese dritte Dimension ist die Technologie, und sie hat einen erheblichen Einfluss auf die beiden anderen. Sie erweitert die Schnittmenge zwischen den beiden ersten. So wird KI zur Verbesserung von Geschäftsprozessen ebenso wie bei der Entwicklung von Drohnen eingesetzt. Das zeigt die enorme Bedeutung von technologischer Expertise und Kompetenz in Verbindung mit militärischer und wirtschaftlicher Stärke. Der Weg nach vorne erfordert ein umfassendes Verständnis von Technologie und ihrer strategischen Anwendung.“ Eine Aufzeichnung der englischsprachigen Diskussion ist auf der Seite der Münchner Sicherheitskonferenz verfügbar. Die skizzierten Zusammenhänge zwischen Wirtschaft, Sicherheit und Digitalisierung erläutert Claudia Plattner zudem in einem Gastbeitrag auf LinkedIn, sowie in der Tageszeitung „Rheinische Post“. Pressekontakt: Bundesamt für Sicherheit in der Informationstechnik Pressestelle Tel.: 0228-999582-5777 E-Mail: presse@bsi.bund.de Internet: www.bsi.bund.de BSI in Social Media Externe LinksVideostream: MSC-Paneldiscussion 2025 with Claudia Plattner "AI just can't get enough: disinformation, AI and democracy"LinkedIn-Gastbeitrag von BSI-Präsidentin Claudia Plattner: Cyberaggression - Hybride Bedrohungen des 21. Jahrhunderts und wie wir uns vor ihnen schützenGastbeitrag in der "Rheinischen Post" von Claudia Plattner: "Cyberaggression – Bedrohungen des 21. Jahrhunderts" English version of this press releaseMunich Security Conference: What will AI do to our democracy?'''
year_published = 2025
