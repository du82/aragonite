["https://bsi.bund.de/DE/Service-Navi/Presse/Alle-Meldungen-News/Meldungen/MWC_2025_250225.html"]
title = "BSI  -  Presse - Das BSI auf dem Mobile World Congress 2025"
description = "Auf dem Mobile World Congress (MWC) stärkt das BSI die Zusammenarbeit mit Herstellern mobiler Endgeräte sowie internationalen Organisationen und Akteuren im Mobilfunksegment. Im Zentrum steht das deutsche IT-Sicherheitskennzeichen."
full_description = "Das BSI auf dem Mobile World Congress 2025 Datum 25.02.2025 Das Bundesamt für Sicherheit in der Informationstechnik (BSI) ist vom 3. bis 6. März 2025 auf dem Mobile World Congress (MWC) in Barcelona am Gemeinschaftsstand des Landes Nordrhein-Westfalen vertreten. Der MWC zählt zu den größten IT-Messen der Welt. Auf der Veranstaltung dreht sich alles um Themen wie IoT, Industrie 4.0, Mobilität, Cybersecurity, KI, Healthcare, Smart City oder Energie. Im Fokus der BSI-Präsenz steht die IT-Sicherheit mobiler Endgeräte und das deutsche IT-Sicherheitskennzeichen, mit dem Hersteller die Sicherheitseigenschaften am Markt besonders hervorheben können. Das BSI bietet das Kennzeichen seit 2021 an und entwickelt es ständig weiter. Zusätzlich treibt das BSI die internationale Harmonisierung mit Kennzeichnungsschemata anderer Nationen voran. In diesem Zusammenhang wurde 2022 ein gegenseitiges Anerkennungsabkommen für IoT-Geräte mit Singapur geschlossen und in 2024 um Router erweitert. Vor dem Hintergrund der im Jahr 2024 erfolgten Erweiterung des IT-Sicherheitskennzeichens auf die Produktkategorie „Mobile Endgeräte“ ist am 4. März 2025 auf dem Security Summit in der Session „Mobile Device Security“ die Unterzeichnung und Übergabe eines Letter of Intent (LoI) mit der GSM Association (GSMA) geplant. Mit dem LoI sollen die gemeinsame Zusammenarbeit gestärkt und Synergieeffekte sowie Harmonisierung von Labelling-Schemata weiter ausgebaut werden. Hersteller, die sich für Informationen zum IT-Sicherheitskennzeichen interessieren, können bereits vorab unter it-sicherheitskennzeichen@bsi.bund.de einen Termin mit dem BSI auf dem MWC vereinbaren. Weitere InformationenIT-SicherheitskennzeichenDas BSI im Ausstellerverzeichnis des MWC Kurz-URL: https://www.bsi.bund.de/dok/sik-mwc2025"
