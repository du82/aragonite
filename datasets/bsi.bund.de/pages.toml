description = "Als Cybersicherheitsbehörde des Bundes kümmern wir uns darum, dass die Menschen in Deutschland der digitalen Welt vertrauen können. Eine große Aufgabe für engagierte Fachleute, deren Herz auf der digitalen Seite schlägt."
full_description = "Karriere im BSI Als Cybersicherheitsbehörde des Bundes kümmern wir uns darum, dass die Menschen in Deutschland der digitalen Welt vertrauen können. Eine große Aufgabe für engagierte Fachleute, deren Herz auf der digitalen Seite schlägt. Herzlich willkommen! Auf unserer Karriere-Seite finden Sie alle Informationen rund um Ihren zukünftigen Job beim BSI. Ob in Form einer Ausbildung oder eines Studiums oder direkt mit Abschluss und/oder Berufserfahrung - in der Cybersicherheitsbehörde des Bundes wartet ein sicherer Job mit spannenden Tätigkeiten auf Sie. Mehr Einblicke in die Themenfelder und das Arbeitsumfeld des BSI geben Ihnen unsere Kolleginnen und Kollegen. Wir freuen uns, Ihre digitale Seite kennen zu lernen! Weitere Informationen Wa­rum BSI? Ar­bei­ten im BSI Ein­stieg FAQ Stel­len­an­ge­bo­te Ter­mi­ne Kon­takt Per­so­nal­ge­win­nung Zurück zu Bundesamt für Sicherheit in der Informationstechnik"
