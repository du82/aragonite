["https://bsi.bund.de/DE/Service-Navi/Publikationen/DVS-Bericht/dvs-bericht_node.html"]
title = "BSI  -  Digitaler Verbraucherschutz: BSI-Jahresrückblick 2023"
full_description = "Digitaler Verbraucherschutz: BSI-Jahresrückblick 2023 Der BSI-Jahresrückblick 2023 zum Digitalen Verbraucherschutz widmet sich in seinem Schwerpunktthema der Frage, wie die Widerstandsfähigkeit (Resilienz) der Verbraucherinnen und Verbraucher gegenüber Cyber-Bedrohungen und in IT-Notfällen gestärkt werden kann. Ausgangspunkt ist dabei eine sich weiter verschärfende IT-Gesamtbedrohungslage, die sich auch in den IT-Sicherheitsvorfällen und Trendthemen mit Bedrohungspotenzial im Verbrauchermarkt im Rückblick auf das Jahr 2023 widerspiegelt. Ein weiterer Inhalt ist die Darstellung der Kommunikationsarbeit im BSI-Verbraucherschutz insgesamt sowie der Aktivitäten der „Allianz für Cyber-Sicherheit“, die einen spezifischen Blick auf die Verantwortung von Herstellern und Anbietern wirft. Die vorliegende Jahrespublikation des BSI liefert analytische Informationen und thematische Aufbereitungen in einem komplexen Handlungsfeld, das von vielen Akteuren geprägt wird. Dazu gehören die Verbraucherinnen und Verbraucher selbst, die Hersteller und Anbieter, aber auch staatliche und zivilgesellschaftliche Akteure. Dieses Spektrum an Beteiligten im Digitalen Verbraucherschutz bildet die Zielgruppe der vermittelten Inhalte, um mit den skizzierten Herausforderungen und (Trend-)Themen nicht nur Orientierung zu geben, sondern auch den aktiven Austausch zur Erhöhung der Informationssicherheit im digitalen Verbrauchermarkt anzuregen. Digitaler Verbraucherschutz: BSI-Jahresrückblick 2023 Weitere Jahrespublikationen zum Digitalen Verbraucherschutz Bericht zum Digitalen Verbraucherschutz 2022 Themenschwerpunkt: Phishing Bericht zum Digitalen Verbraucherschutz 2022 Bericht zum Digitalen Verbraucherschutz 2021 Themenschwerpunkt: Digitaler Verbraucherschutz im Automobilbereich Bericht zum Digitalen Verbraucherschutz 2021 Bericht zum Digitalen Verbraucherschutz 2020 Themenschwerpunkt: Cyber-Sicherheit im Gesundheitswesen Bericht zum Digitalen Verbraucherschutz 2020 Ähnliche Themen Cy­ber-Si­cher­heits­um­fra­ge Kenn­zah­len und Sta­tis­ti­ken Zurück zu Lageberichte und Lagebilder Publikationen Suche Kurz-URL: https://www.bsi.bund.de/dok/dvs-bericht"
