["https://bsi.bund.de/DE/Karriere/Team_BSI/team_bsi_node.html"]
title = "BSI  -  Willkommen im #TeamBSI"
full_description = "Komm ins #TeamBSI Gestalte mit uns eine sichere digitale Zukunft. Zu den Stellenangeboten Achtung & Vielfalt Was das #TeamBSI auszeichnet? Die bunte Vielfalt von Persönlichkeiten und Kompetenzen. Unser gemeinsames Ziel ist es, ein respektvolles Miteinander und wertschätzendes Umfeld für alle zu gestalten. Wir sind bunt Endstation öffentlicher Dienst? Nicht bei uns! Im #TeamBSI gilt lebenslanges Lernen. Wir bieten viele Möglichkeiten für eine abwechslungsreiche Karriere und um sich persönlich sowie fachlich weiterzuentwickeln. Aufstieg und Karriere Berufsstart im Team BSI Ob direkt nach der Schule oder während des Studiums – bei uns lernst du praxisnah von Anfang an, Cybersicherheit für Deutschland und die Welt mitzugestalten. Ausbildung und Studium im BSI Willkommen im #TeamBSI! Wir sind die Cybersicherheitsbehörde des Bundes und teilen gemeinsam die Begeisterung für ein Thema: Cybersicherheit. Unser Ziel ist es, Informationssicherheit als die Grundvoraussetzung einer erfolgreichen Digitalisierung zu etablieren. Eine große und verantwortungsvolle Mission, der wir uns als #TeamBSI verschrieben haben. Denn bei uns zählt vor allem eines: Teamgeist. Im BSI arbeiten wir abteilungs- und standortübergreifend zusammen, unterstützen uns gegenseitig und lernen voneinander. Wir machen uns jeden Tag gemeinsam stark für das Thema Cybersicherheit. Mit derselben Leidenschaft leistet jede und jeder Einzelne einen Beitrag für die gute Sache: Dass die Menschen der digitalen Welt vertrauen können. Das ist es, was unsere Arbeit so besonders macht. Unsere Themen- und Aufgabengebiete wachsen mit der rasanten Entwicklung der digitalen Welt ständig weiter. Das macht unsere Arbeit abwechslungsreich, innovativ und wertvoll für unser Land und unsere Mitmenschen. Komm auch du ins #TeamBSI und gestalte mit uns die sichere Digitalisierung in Deutschland – aber auch in Europa und der Welt. Dein Einstieg ins #TeamBSI Auszubildende & StudierendeFinde deinen Platz in der digitalen Welt. Lerne im #TeamBSI praxisnah, wie du Cybersicherheit hierzulande mitgestalten kannst. BerufseinsteigendeÜbernimm eine bedeutungsvolle Aufgabe und arbeite mit uns dafür, dass die Menschen der digitalen Welt vertrauen können. Berufserfahrene & FachkräfteBring mit uns die digitale Zukunft voran und verstärke das #TeamBSI mit deiner Expertise mit Sicherheit für Sicherheit. 8 Gründe, warum du Teil des #TeamBSI werden solltest Du bist ein Teamplayer? Du bist Einsteigerin/Einsteiger, Young Professional oder Expertin/Experte im Bereich der IT-Sicherheit? Du suchst nach einem Job mit Anspruch? Dann komm ins Team BSI. Hier bieten wir dir spannende Aufgaben und ein abwechslungsreiches Arbeitsumfeld. Deine Persönlichkeit und deine Ideen sind hier willkommen. Warum BSI Für mich ist Cybersicherheit ein super wichtiges Thema, das von vielen leider noch unterschätzt wird. Im #TeamBSI arbeite ich mit Menschen zusammen, die genau das erkannt haben und sich mit mir für Cybersicherheit als Grundvoraussetzung einer erfolgreichen Digitalisierung stark machen. Jennifer Breuer, Leiterin des Referats „Cybersicherheit bei der Umsetzung des Onlinezugangsgesetzes“ Komm ins #TeamBSI Wir setzen auf Vielfalt: verschiedene Perspektiven, Charaktere und Erfahrungen, zeichnen uns als #TeamBSI aus. Aufgrund des starken Wachstums unserer Standorte in Bonn, Freital und Saarbrücken suchen wir daher immer nach neuen Talenten. Entdecke jetzt unsere aktuellen Stellenangebote. Hier geht's zu unseren Jobs #TeamStories Franz StockmannIm Team BSI begleitet Franz Behörden der Bundesverwaltung bei ihren Digitalisierungsprojekten. Simona AutolitanoJobstart mitten in der Pandemie? Simona hat es erlebt und erzählt von ihrem virtuellen Onboarding im Team BSI. Uwe JendrickeUwe gehört seit 2008 zum Team BSI und arbeitet im Bereich kritische Infrastrukturen (KRITIS). Lerne uns persönlich kennen Veranstaltungen Veranstaltungen Karrieretag Bonn BSI , Jobs, Bonn 20. März, 2025 Hannover Messe BSI , Jobs, Hannover 31. März, 2025 - 04. April, 2025 DMEA 2025 BSI , Jobs, Berlin 08. April, 2025 - 10. April, 2025 Alle Veranstaltungen Informationen Dein direkter Draht zu uns Kontakt FAQ Arbeiten im BSI Newsletter"
year_published = 2020
