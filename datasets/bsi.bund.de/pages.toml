["https://bsi.bund.de/DE/Karriere/FAQ/faq_node.html"]
title = "BSI  -  FAQ"
full_description = 'FAQ rund um das Thema Jobs im BSI Teamgeist im BSI heißt Events zu Karneval, im Sommer oder Aktivitäten wie Abteilungs- oder Referatsausflüge, Firmenlauf etc. Interne Veranstaltungen fördern den Austausch, das Netzwerken und den Teamgeist. Wie bewerbe ich mich beim BSI? Unser Bewerbungsverfahren verläuft zunächst digital. Füllen Sie einfach den bei jeder Ausschreibung verlinkten Onlinebewerbungsbogen aus und laden Sie eine PDF mit Ihren vollständigen Bewerbungsunterlagen (Motivationsschreiben, Lebenslauf, letztes Schulzeugnis, Arbeitszeugnisse, Beurteilungen, Vordiplom/Diplom bzw. Bachelor- oder Masterurkunde mit Notenübersicht, ggf. Nachweis der Schwerbehinderung) hoch - fertig. Der Bewerbungsprozess dauert so in etwa 15 Minuten. Wie verläuft ein Auswahlverfahren beim BSI? Das variiert je nach ausgeschriebener Stelle: Bei Sachbearbeiter- und Referentenpositionen werden Sie nach Sichtung der Onlinebewerbung bei entsprechender Eignung zu einem Fachgespräch eingeladen. Neben Ihren fachlichen werden dort auch Ihre sozialen Kompetenzen geprüft.Bei Führungspositionen (z.B. Referatsleiter/in) und unserem Volljuristen-Auswahlverfahren ist neben dem Fachgespräch die Teilnahme an einem Assessment-Center vorgesehen. Bei der Bewerbung auf eine Ausbildungsstelle müssen Sie zunächst ein schriftliches Auswahlverfahren durchlaufen. Wenn Sie dieses erfolgreich bestehen, werden Sie zu einem Vorstellungsgespräch eingeladen. Wie lange dauert das Auswahlverfahren insgesamt? In der Regel rechnen wir mit einer Gesamtdauer von ca. 8 bis 10 Wochen, bis wir Ihnen eine definitive Aussage zum Ausgang des Verfahrens geben können. Warum ist eine Sicherheitsüberprüfung erforderlich? Das BSI zählt zu den Sicherheitsbehörden des Bundes und arbeitet mit Dokumenten und Informationen, die der Geheimhaltung unterliegen. Für die Mitarbeiter/-innen des BSI bedeutet dies zum einen die Zahlung einer Sicherheitszulage. Zum anderen müssen sie sich vor Beginn ihrer Tätigkeit im BSI alle einer Sicherheitsüberprüfung durch das Bundesamt für Verfassungsschutz unterziehen. Was passiert bei der Sicherheitsüberprüfung? In jedem Fall wird mindestens eine einfache Sicherheitsüberprüfung (Ü1) nach dem Sicherheitsüberprüfungsgesetzt (SüG) durchgeführt. In einzelnen Referaten oder Abteilungen kann jedoch auch eine erweiterte Sicherheitsüberprüfung (Ü2) oder eine erweiterte Sicherheitsüberprüfung mit Sicherheitsermittlungen (Ü3) erforderlich sein. Dabei wird neben Ihnen auch Ihr/-e Ehegatte/-in, Lebenspartner/-in oder Lebensgefährte/-in in die Überprüfung einbezogen. Sie füllen dazu eine mehrseitige sog. "Sicherheitserklärung" aus, auf welcher Basis u.a. das Bundeszentralregister, Polizeidienststellen und Nachrichtendienste zu Ihrer Person und Ihrem/-r Partner/-in angefragt werden. Weiterhin wird Ihre Identität überprüft. Wie lange dauert eine Sicherheitsüberprüfung? Im Durchschnitt rechnen wir derzeit mit einer Dauer von 3-4 Monaten. Einzelfallbezogen kann es sowohl zu kürzeren aber auch längeren Wartezeiten kommen. Kann ich vor Abschluss der Sicherheitsüberprüfung beim BSI arbeiten? Nein, die Stellenzusage erfolgt immer vorbehaltlich des erfolgreichen Abschlusses der Sicherheitsüberprüfung. Erst nachdem ein positives Ergebnis vorliegt, wird der Arbeitsvertrag unterzeichnet bzw. die Abordnung (z.B. als Beamter/-in) zum BSI eingeleitet. Wann sollte ich mich am besten bewerben? Damit ein nahtloser Übergang zwischen bspw. Studium und Berufseinstieg möglich ist, empfehlen wir die Bewerbung mindestens ein halbes Jahr vor dem angestrebten Wechsel bzw. Abschluss. Das abgeschlossene Studium ist zwar zwingende Einstellungsvoraussetzung, zum Zeitpunkt der Bewerbung muss dieses aber noch nicht vorliegen. Die Einstellungszusage erfolgt dann vorbehaltlich des angestrebten Abschlusses. Welche sonstigen Kriterien muss ich für die Einstellung erfüllen? In vereinzelten Fachbereichen ist vorab eine Einstellungsuntersuchung bei unserem Betriebsarzt notwendig. Bewerbende, die davon betroffen sind, werden im Vorstellungsgespräch darüber informiert. Muss ich deutscher Staatsbürger sein, um beim BSI arbeiten zu dürfen? Nein, wir freuen uns über Bewerber/-innen aller Nationalitäten. Bitte beachten Sie aber, dass u.U. eine gewisse Aufenthaltsdauer in Deutschland erforderlich ist, um die Sicherheitsüberprüfung erfolgreich abzuschließen. Besteht beim BSI die Möglichkeit, Beamter zu werden? Ja, bei einer unbefristeten Einstellung besteht nach einer gewissen Zeit die Möglichkeit, einen Antrag auf Verbeamtung zu stellen. Dabei müssen jedoch gesonderte Anforderungen z.B. an die Berufserfahrung erfüllt werden. Mehr Informationen dazu gibt es hier. Wie werde ich vergütet? Die Vergütung erfolgt bei Einstellung grundsätzlich nach Stufe 1 der jeweiligen Entgeltgruppe. Die Stufe 2 wird nach einer ununterbrochenen Tätigkeit innerhalb derselben Entgeltgruppe von einem Jahr erreicht. In begründeten Ausnahmefällen (unter anderem einschlägige Berufserfahrung) ist die Vergütung bis Stufe 6 auch direkt bei Einstellung möglich. Tabelle: Tarifvertrag öffentlicher Dienst Bund (TVöD Bund) Bezügerechner des Bundes Die Einstellung soll z.B. in Entgeltgruppe E10/E11 erfolgen. Wonach richtet sich meine genaue Eingruppierung? Die Eingruppierung richtet sich immer nach den Tätigkeiten, die mit der ausgeschriebenen Stelle verbunden sind. Wenn Sie durch bspw. mehrjährige Berufserfahrung in der Lage sind, höherwertige Tätigkeiten auszuüben, ist die Eingruppierung in die jeweils höhere Entgeltgruppe (hier: E11) möglich - dies muss allerdings in jedem Einzelfall geprüft werden. Kann ich ein Feedback zu meinem Vorstellungsgespräch erhalten? Nein, aufgrund der hohen Dichte der Auswahlverfahren ist ein Feedback leider nicht möglich. Darf ich mich bei einer Absage noch auf andere Verfahren bewerben? Selbstverständlich steht Ihnen eine erneute Bewerbung beim BSI frei. Oft bedeutet eine Absage nicht, dass Sie ungeeignet für eine Tätigkeit im BSI sind, sondern dass es schlichtweg bessere Bewerber/-innen in diesem Verfahren gab. Lassen Sie sich davon nicht entmutigen, wir freuen uns auf Ihre Bewerbung! Gibt es eine Probezeit und wie lange lange dauert diese? Bei unbefristeten Einstellungen sind die ersten sechs Monate als Probezeit vorgesehen. Dies gilt auch bei befristeten Einstellungen mit sachlichem Grund – im BSI sind dies in der Regel Projektaufgaben. Bei befristeten Einstellungen ohne Sachgrund werden die ersten sechs Wochen des Beschäftigungsverhältnisses als Probezeit ausgewiesen. Wird ein Jobticket zur Verfügung gestellt? Über das BSI kann ein Jobticket bezogen werden. Dabei handelt es sich um eine vergünstigte Monatskarte für den Öffentlichen Personen-Nahverkehr, die auch in der Freizeit genutzt werden kann. Informationen zum Jobticket beim VRS Was heißt flexibles Arbeiten im BSI? 30 Tage Urlaub,24. und 31.12. arbeitsfrei,Arbeitszeitkonto mit Überstundenausgleich,mobiles Arbeiten (40/60: 2 Tage im Büro; 3 Tage im Home-Office),keine Kernarbeitszeit sondern Rahmenarbeitszeit,Teilzeit in verschiedenen Modellen Bleibt das BSI in Bonn oder ist ein Umzug nach Berlin geplant? Das BSI wird am Standort Bonn verbleiben. Ihre Frage wurde noch nicht beantwortet? Schreiben Sie uns über Bewerbung@bsi.bund.de Ähnliche Themen Wa­rum BSI? Ar­bei­ten im BSI Ein­stieg Stel­len­an­ge­bo­te Ter­mi­ne Kon­takt Per­so­nal­ge­win­nung Zurück zu Bundesamt für Sicherheit in der Informationstechnik Kurz-URL: https://www.bsi.bund.de/dok/8693960'
year_published = 2025
