["https://bsi.bund.de/DE/Service-Navi/Abonnements/RSS/rss_node.html"]
title = "BSI  -  RSS"
full_description = 'RSS-Feeds Die RSS-Feeds der Internetseite des Bundesamtes für Sicherheit in der Informationstechnik (BSI) informieren Sie schnell und komfortabel über aktuelle Pressemitteilungen, Veranstaltungen, Ausschreibungen und Stellenangebote. So erfahren Sie sofort, wenn neue Nachrichten auf der Internetseite des BSI veröffentlicht werden, und Sie bleiben immer auf dem aktuellen Stand. Folgende RSS-Feeds des BSI können Sie abonnieren: RSS-Newsfeed (Presse-, Kurzmitteilungen und Veranstaltungshinweise)RSS-Newsfeed KRITIS AktuellRSS-Newsfeed (NESAS CCS-GI)RSS-Newsfeed Kurzinformationen des CERT-Bund zu Sicherheitslücken und Schwachstellen in IT-SystemenRSS-Newsfeed "Technischer Sicherheitshinweise für Verbraucherinnen und Verbraucher"RSS-Newsfeed ProduktzertifizierungRSS-Newsfeed ACS Aktuelle InformationenRSS-Newsfeed StellenausschreibungenRSS-Newsfeed AusschreibungenRSS-Feed Podcast "Update verfügbar"RSS-Feed Cyber-Sicherheitswarnungen des CERT-Bund Was ist RSS? Die Abkürzung "RSS" steht für Really Simple Syndication und beschreibt eine Internet-basierte Technik auf XML-Basis. Diese Technik dient dazu, Webseiteninhalte schnell und unkompliziert zu übertragen. Mit RSS-Feeds können Sie Webseiten auf neue Inhalte prüfen, ohne diese selber zu besuchen. Im Gegensatz zu HTML-Seiten enthalten RSS-Dateien keine Design- und Layout-Elemente. So können RSS-Dateien plattformunabhängig gelesen und weiterverarbeitet werden. Als Nutzer liegen die Vorteile von RSS vor allem in der Zeitersparnis: So ist es möglich, Webseiten schnell und effektiv auf Änderungen und aktuelle Inhalte zu prüfen, ohne diese mitsamt Grafiken und Bannern direkt besuchen zu müssen. Gleichzeitig werden Traffic und Downloadzeiten vermieden. Die Nutzung des Dienstes erfordert außerdem – anders als ein Newsletter – keine Anmeldung mit einer E-Mail-Adresse. Zum Lesen des RSS-Feed benötigen Sie einen so genannten RSS-Reader. Der RSS-Reader liest die abonnierten Feeds und meldet Ihnen automatisch neue Einträge. Damit haben Sie Neueinstellungen in den von Ihnen gewählten Bereichen jederzeit im Blick. Wenn Sie ein neues Dokument interessiert, klicken Sie es einfach an und es wird im Browser geöffnet. Wie wird RSS abonniert? Zunächst müssen Sie einen RSS-Reader auf Ihrem Rechner installieren. Sobald Sie ein solches Leseprogramm installiert haben, können Sie die RSS-Feeds für neue Dokumente auf der Internetseite abonnieren. Jeder RSS-Feeds hat eine eigene Adresse, ähnlich der im Kopfbereich angezeigten Adresse (URL) einer Internetseite. In Ihrem RSS-Reader fügen Sie die Adresse dann an entsprechender Stelle wieder ein. Daraufhin erscheint die Nachricht des Internetauftritts des BSI in der Reader-Übersicht. Ihr Abonnement ist eingerichtet. RSS-Nachrichten können Sie auch über E-Mail-Programme empfangen. Über die RSS-Funktion informieren Sie sich bitte bei dem jeweiligen Anbieter. Ähnliche Themen Newslet­ter­ver­wal­tung CERT-Bund Mel­dun­gen So­ci­al Me­dia Ar­chiv "Si­cher­heits­hin­wei­se für Ver­brau­che­rin­nen und Ver­brau­cher" Zurück zu Newsletter und Social Media Kurz-URL: https://www.bsi.bund.de/dok/6622448'
year_published = 2025
