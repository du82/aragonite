title = "BSI  -  Umwelterklärung"
description = "Umwelterklärung nach EMAS (Eco-Management and Audit Scheme)"
full_description = "Umwelterklärung nach EMAS Bis zum Jahr 2030 soll die gesamte Bundesverwaltung klimaneutral organisiert sein. Das Bundesamt für Sicherheit in der Informationstechnik (BSI) trägt mit zahlreichen Maßnahmen dazu bei. Ein Meilenstein auf diesem Weg ist die Einführung eines Umweltmanagementsystems nach EMAS. EMAS ist die Kurzbezeichnung für das „Gemeinschaftssystem für Umweltmanagement und Umweltbetriebsprüfung“ (englisch: Eco-Management and Audit Scheme). Das System gilt als Zugpferd für eine nachhaltige Entwicklung. In acht Schritten wurde im BSI ein leistungsorientiertes Managementsystem eingeführt und umgesetzt. Es erfasst systematisch die Umweltauswirkungen der Behörde in den Kernbereichen Energie, Material, Wasser, Abfall, Flächenverbrauch und Emissionen. Mit der Einführung des Umweltmanagementsystems EMAS stellt das BSI sicher, dass alle Umweltaspekte rechtssicher und transparent berücksichtigt werden. EMAS etabliert im BSI einen Umweltschutz auf hohem Niveau und hilft, die Umweltleistung der Behörde stetig und über das gesetzlich erforderliche Maß hinaus zu verbessern. Langfristig sollen dadurch Kosten und Ressourcen eingespart und der ökologische Fußabdruck weitestgehend reduziert werden. Mit der Nutzung von EMAS leistet das BSI einen wirksamen und wichtigen Beitrag zum Umwelt- und Klimaschutz – und ebnet den Weg zur Klimaneutralität. Die Fortschritte des BSI in Sachen Umweltleistung werden jährlich extern geprüft und in einer Umwelterklärung veröffentlicht. Weitere InformationenDownload Erste Umwelterklärung 2024 (Zeitraum 2019-2022) (PDF)BSI veröffentlicht erste Umwelterklärung nach EMASKoordinierungsstelle Klimaneutrale Bundesverwaltung (KKB) Ähnliche Themen Cy­ber­na­ti­on Deutsch­land Auf­trag Or­ga­ni­sa­ti­on und Auf­bau Leit­bild Zeit­strahl BSI Stand­orte Zurück zu Bundesamt für Sicherheit in der Informationstechnik Kurz-URL: https://www.bsi.bund.de/dok/umwelt"
year_published = 2025
