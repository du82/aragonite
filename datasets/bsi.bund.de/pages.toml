["https://bsi.bund.de/DE/Karriere/Einstieg/Studium-und-Ausbildung/studium-und-ausbildung_node.html"]
title = "BSI  -  Studium und Ausbildung"
full_description = "Studium und Ausbildung im BSIVon der Schule in die Cybersicherheit oder vom Hörsaal ins BSI. Jetzt durchstarten beim BSI! Viele Wege führen in das BSI! Ihr habt bei uns die Möglichkeit, eine Ausbildung in der IT oder im Verwaltungsbereich zu absolvieren und direkt in spannende Themen einzutauchen. Durch das von uns angebotene DACS-Studium könnt ihr auch direkt bei uns studieren. Wenn ihr bereits im Studium seid, könnt ihr bei uns im Rahmen eines Praktikums oder einer Abschlussarbeit mitarbeiten. Entdeckt eure Einstiegsmöglichkeiten! Euer Einstieg ins #TeamBSI Ausbildung in der ITHier lernt ihr die Analyse, Planung und Umsetzung komplexer Hard- und Softwaresysteme kennen. Ausbildung in der VerwaltungVom Personalmanagement bis Haushaltswesen habt ihr als Verwaltungsallrounder hier alles im Griff. Alles rund ums StudiumDual, berufsbegleitend oder als Fernstudium bietet euch das BSI viele Möglichkeiten auf dem Weg zum Bachelor oder Master. PraktikaSowohl Pflicht- als auch freiwillige Praktika könnt ihr studienbegleitend bei uns im BSI absolvieren. AbschlussarbeitenDas BSI hat einige Themenvorschläge für Bachelor-, Master oder Diplomarbeiten, bei denen wir euch gerne betreuen. Die Ausbildung im BSI ist durchgehend spannend gestaltet. Dabei lernen wir durch die regelmäßige Rotation in den Referaten und Abteilungen, IT-Sicherheit in den verschiedenen Facetten zu gestalten. Jason Wirtz, Auszubildender zum Fachinformatiker im BSI Jason hat 2021 seine Ausbildung als Fachinformatiker in der Fachrichtung Systemadministration im #TeamBSI angefangen. Quelle: Bundesamt für Sicherheit in der Informationstechnik Weitere Informationen Ba­che­lor- und Mas­ter­ar­bei­ten Prak­ti­ka und Pra­xis­se­mes­ter Stu­dien­gang Di­gi­tal Ad­mi­nis­tra­ti­on and Cy­ber-Se­cu­ri­ty (DACS) Aus­bil­dung in der Ver­wal­tung Aus­bil­dung in der IT Rechts­re­fe­ren­da­ri­at Kon­takt Per­so­nal­ge­win­nung Zurück zu Einstieg"
year_published = 2025
