title = "BSI  -  Bundesamt für Sicherheit in der Informationstechnik"
description = "Das Bundesamt für Sicherheit in der Informationstechnik (BSI) ist die Cyber-Sicherheitsbehörde des Bundes und Gestalter einer sicheren Digitalisierung in Deutschland."
full_description = '''Cyberaggression abwehren In einer Welt, in der technologische Dominanz weitreichend über wirtschaftliche und politische Macht entscheidet, ist Cybersicherheit zu einem globalen Faktor geworden. Im Kontext der Münchner Sicherheitskonferenz setzt BSI-Präsidentin Claudia Plattner Impulse zu Themen wie KI-Regulierung, digitale Resilienz und wirksame Zusammenarbeit zum Schutz demokratischer Prozesse. Diskussion und Beiträge Die Lage der IT-Sicherheit in Deutschland 2024 Mit seinem Bericht zur Lage der IT-Sicherheit in Deutschland gibt das BSI jährlich einen umfassenden Überblick über die Bedrohungen im Cyberraum. 2024 kommt die Cybersicherheitsbehörde des Bundes zur Einschätzung: Die Lage der IT-Sicherheit in Deutschland war und ist besorgniserregend. Weitere Informationen Umsetzung der NIS-2-Richtlinie Die NIS-2-Richtlinie erhöht für bestimmte Unternehmen in der EU die Anforderungen an die Cybersicherheit. Trotz der noch nicht erfolgten nationalen Umsetzung möchten wir Unternehmen und Organisationen bestmöglich unterstützen und so die Umsetzung der NIS-2-Richtlinie in Deutschland so reibungslos wie möglich gestalten. Erste Informationen für voraussichtlich betroffene Unternehmen #einfachaBSIchern: IT-Sicherheit bei smarten Geräten Vom Kühlschrank bis zum Saugroboter sind immer mehr Geräte mit dem Internet verbunden. Das ist im Alltag praktisch. Unzureichend abgesicherte Geräte können jedoch Cyberkriminellen als Einfallstor dienen. Das BSI zeigt Verbraucherinnen und Verbrauchern, wie sie sich schützen können. www.einfachaBSIchern.de Die Vision: Cybernation Deutschland Die Cyberbedrohungslage ist besorgniserregend und verursacht immense Schäden. Cybersicherheit ist eine gesamtstaatliche Aufgabe, die wir alle nur gemeinsam bewältigen können. Wir brauchen die Cybernation Deutschland, die Cybersicherheit und Digitalisierung erstklassig beherrscht. Erfahren Sie mehr Cyber-Sicherheitslage nach russischem Angriff auf die Ukraine Das BSI bewertet fortwährend die Lage mit Bezug zur Informationssicherheit und ruft seine Zielgruppen dazu auf, ihre IT-Sicherheitsmaßnahmen zu überprüfen und der gegebenen Bedrohungslage anzupassen. Aktuelle Lageentwicklung, Warnungen und Maßnahmenempfehlungen Aktuelles Meldungen Veranstaltungen Meldungen Pressemitteilung:, Bonn, 27.02.2025 Drohnen als neue Cyberbedrohung - Wie Unternehmen sich schützen können Das BSI stellt eine wachsende Bedrohung durch den Einsatz von Drohnen fest und analysiert in einem aktuellen Arbeitspapier Bedrohungen, die von Drohnennutzlasten ausgehen können. Das Arbeitspapier soll Unternehmen und Organisationen dabei unterstützen, sich auf die neuen Sicherheitsrisiken vorzubereiten und geeignete Schutzmaßnahmen zu ergreifen. Meldung:, 27.02.2025 TR-03187-"Sicherheitsanforderungen an Urbane Datenplattformen" veröffentlicht Mit der Veröffentlichung der TR-03187 werden Urbane Datenplattformen im kommunalen Umfeld adressiert, um diese durch konkrete Anforderungen sicherer zu machen. Meldung:, 25.02.2025 Das BSI auf dem Mobile World Congress 2025 Auf dem Mobile World Congress (MWC) stärkt das BSI die Zusammenarbeit mit Herstellern mobiler Endgeräte sowie internationalen Organisationen und Akteuren im Mobilfunksegment. Im Zentrum steht das deutsche IT-Sicherheitskennzeichen. Alle Meldungen Veranstaltungen SoftEd Systems , Leipzig oder Online 06. März, 2025 - 07. März, 2025 Hybrid Workshop: Erstellung geeigneter Vorgabendokumente zu Data-Center-Network-Infrastructure in 5G-Mobilfunknetzen BSI, Freital 12. März, 2025 Bechtle GmbH & Co. KG IT-Systemhaus Dresden , Chemnitz oder Online 17. März, 2025 - 19. März, 2025 Alle Veranstaltungen Sicherheitshinweise Cyber-Sicherheitswarnungen CERT-Bund Meldungen Bürger-CERT Cyber-Sicherheitswarnungen Version 1.0: SonicWall SonicOS - Proof-of-Concept Exploit für Schwachstelle im SSLVPN veröffentlicht Cyber-Sicherheitswarnung, Sicherheitshinweis, 31.01.2025 Bedrohungsstufe 2 Hoch Version 1.0: SonicWall SMA 1000 Serie - Zero-Day Schwachstelle in Management Konsole geschlossen Cyber-Sicherheitswarnung, Sicherheitshinweis, 23.01.2025 Bedrohungsstufe 2 Hoch Version 1.0: Microsoft Windows - Kritische Schwachstelle in Windows OLE Cyber-Sicherheitswarnung, Sicherheitshinweis, 14.01.2025 Bedrohungsstufe 2 Hoch Alle Sicherheitsmeldungen CERT-Bund Meldungen de.materna.cms.cae.velocity.VelocityHelperImpl@693d797e:message("VeroeffentlichtAm"): 28.02.2025 [UPDATE] [mittel] Linux Kernel: Schwachstelle ermöglicht Umgehen von Sicherheitsvorkehrungen de.materna.cms.cae.velocity.VelocityHelperImpl@693d797e:message("VeroeffentlichtAm"): 28.02.2025 [NEU] [mittel] Keycloak (XStream und Infinispan): Multiple Vulnerabilities de.materna.cms.cae.velocity.VelocityHelperImpl@693d797e:message("VeroeffentlichtAm"): 28.02.2025 [UPDATE] [mittel] Linux Kernel: Schwachstelle ermöglicht Privilegieneskalation de.materna.cms.cae.velocity.VelocityHelperImpl@693d797e:message("VeroeffentlichtAm"): 28.02.2025 [UPDATE] [mittel] Linux-Kernel: Schwachstelle ermöglicht Codeausführung de.materna.cms.cae.velocity.VelocityHelperImpl@693d797e:message("VeroeffentlichtAm"): 28.02.2025 [UPDATE] [hoch] Linux Kernel: Mehrere Schwachstellen ermöglichen Denial of Service de.materna.cms.cae.velocity.VelocityHelperImpl@693d797e:message("VeroeffentlichtAm"): 28.02.2025 [UPDATE] [niedrig] Linux Kernel: Schwachstelle ermöglicht Denial of Service de.materna.cms.cae.velocity.VelocityHelperImpl@693d797e:message("VeroeffentlichtAm"): 28.02.2025 [UPDATE] [hoch] Linux Kernel: Mehrere Schwachstellen de.materna.cms.cae.velocity.VelocityHelperImpl@693d797e:message("VeroeffentlichtAm"): 28.02.2025 [UPDATE] [mittel] GStreamer: Mehrere Schwachstellen ermöglichen Denial of Service de.materna.cms.cae.velocity.VelocityHelperImpl@693d797e:message("VeroeffentlichtAm"): 28.02.2025 [NEU] [hoch] Infoblox NIOS: Mehrere Schwachstellen Alle CERT-Bund Meldungen Bürger-CERT de.materna.cms.cae.velocity.VelocityHelperImpl@693d797e:message("VeroeffentlichtAm"): 28.02.2025 DrayTek Vi