PDF, 2MB, Datei ist barrierefrei⁄barrierearm Download Alle Publikationen Fragen zu Aufgaben und Themen Was sind die Aufgaben des BSI? Der Aufgabenbereich des BSI wird durch das "Gesetz zur Stärkung der Sicherheit in der Informationstechnik des Bundes" (BSI-Gesetz) festgelegt. Ziel des BSI ist die präventive Förderung der Informations- und Cyber-Sicherheit, um den sicheren Einsatz von Informations- und Kommunikationstechnik in unserer Gesellschaft zu ermöglichen und voranzutreiben. Mit Unterstützung des BSI soll IT-Sicherheit in Verwaltung, Wirtschaft und Gesellschaft als wichtiges Thema wahrgenommen und eigenverantwortlich umgesetzt werden. So erarbeitet das BSI beispielsweise praxisorientierte Mindeststandards und zielgruppengerechte Handlungsempfehlungen zur IT- und Internet-Sicherheit, um Anwender bei der Vermeidung von Risiken zu unterstützen. Das BSI ist auch für den Schutz der IT-Systeme des Bundes verantwortlich. Hierbei geht es um die Abwehr von Viren, Trojanern und anderen technischen Bedrohungen gegen die Computer und Netze der Bundesverwaltung. Das BSI berichtet dem Innenausschuss des Deutschen Bundestages hierzu einmal jährlich. Zu den Aufgaben des BSI gehören weiterhin: Schutz der Netze des Bundes, Erkennung und Abwehr von Angriffen auf die RegierungsnetzePrüfung, Zertifizierung und Akkreditierung von IT-Produkten und -DienstleistungenWarnung vor Schadprogrammen oder Sicherheitslücken in IT-Produkten und -DienstleistungenIT-Sicherheitsberatung für die Bundesverwaltung und andere ZielgruppenInformation und Sensibilisierung der Bürger für das Thema IT- und Internet-SicherheitEntwicklung einheitlicher und verbindlicher IT-SicherheitsstandardsEntwicklung von Kryptosystemen für die IT des Bundes. Was ist eine "Warnung" des BSI? Nach § 7 des BSI-Gesetzes hat das BSI die Befugnis, Warnungen vor Sicherheitslücken in informationstechnischen Produkten und Diensten sowie vor Schadprogrammen auszusprechen. Diese Warnungen können sich an die jeweils Betroffenen richten oder aber auch öffentlich – beispielsweise über die Medien – ausgesprochen werden. Eine solche Warnung kann auch beinhalten, dass das BSI von der Nutzung bestimmter Produkte und Lösungen abrät, solange die jeweilige Sicherheitslücke nicht geschlossen ist. In jedem Falle werden die Hersteller der betroffenen Produkte oder Dienstleistungen bereits vor der Veröffentlichung der Warnung informiert. Eine öffentliche Warnung wird nur dann vorgenommen, wenn hinreichende Anhaltspunkte dafür vorliegen, dass Gefahren für die Sicherheit in der Informationstechnik von dem betroffenen Produkt ausgehen. Das BSI geht mit dieser Befugnis sehr sorgsam um, denn eine öffentliche Warnung des BSI vor einem bestimmten Produkt kann für das betroffene Unternehmen unter Umständen erhebliche wirtschaftliche Folgen haben. Wie bewerbe ich mich beim BSI? Unser Bewerbungsverfahren verläuft zunächst digital. Füllen Sie einfach den bei jeder Ausschreibung verlinkten Onlinebewerbungsbogen aus und laden Sie eine PDF mit Ihren vollständig'''
