["https://bsi.bund.de/DE/Service/Datenschutz/datenschutz_node.html"]
title = "BSI  -  Datenschutz"
description = "Für das Bundesamt für Sicherheit in der Informationstechnik (BSI) hat ein verantwortungsbewusster Umgang mit personenbezogenen Daten hohe Priorität. Das BSI möchte, dass Sie wissen, wann welche Daten erhoben und wie sie verwendet werden. Das BSI hat technische und organisatorische Maßnahmen getroffen, die sicherstellen, dass die Vorschriften über den Datenschutz beachtet werden. Im Zuge der Weiterentwicklung und Implementierung neuer Technologien können Änderungen dieser Datenschutzerklärung erforderlich werden. Daher empfiehlt das BSI Ihnen, sich diese Datenschutzerklärung ab und zu erneut auf Änderungen durchzulesen."
full_description = 'Datenschutzerklärung Für das Bundesamt für Sicherheit in der Informationstechnik (BSI) hat ein verantwortungsbewusster Umgang mit personenbezogenen Daten hohe Priorität. Das BSI möchte, dass Sie wissen, wann welche Daten erhoben und wie sie verwendet werden. Das BSI hat technische und organisatorische Maßnahmen getroffen, die sicherstellen, dass die Vorschriften über den Datenschutz beachtet werden. Im Zuge der Weiterentwicklung und Implementierung neuer Technologien können Änderungen dieser Datenschutzerklärung erforderlich werden. Daher empfiehlt das BSI Ihnen, sich diese Datenschutzerklärung ab und zu erneut auf Änderungen durchzulesen. Inhaltsverzeichnis Verantwortliche Stelle Behördlicher Datenschutzbeauftragter im BSI Allgemeine Hinweise zur Datenverarbeitung des BSI 1. Besuch der Website 2. Abwehr von Schadprogrammen und Gefahren für die Kommunikationstechnik des Bundes 3. Verarbeitung von personenbezogenen Daten im Rahmen der Kontaktaufnahme 4. Social Media Präsenzen 5. Verarbeitung von personenbezogenen Daten im Rahmen der Informationsbereitstellung 6. Videoüberwachung 7. Anmeldung von Pressevertretern 8. Kontaktdatenbanken und CRM 9. Meldeportale 10. Freiwilliges IT-Sicherheitskennzeichen 11. Zertifizierung als IT-Sicherheitsdienstleister 12. Sicherheit in der Informationstechnik bei Unternehmen im besonderen öffentlichen Interesse 13. NCCA 14. UP KRITIS 15. Personalgewinnung 16. Vertragsschlüsse mit dem BSI - Erbringung vertraglicher Leistungen Allgemeine Hinweise zu den Betroffenenrechten Minderjährigenschutz Verantwortliche Stelle Verantwortliche Stelle für die Verarbeitung der personenbezogenen Daten im Sinne der Datenschutzgrundverordnung sowie anderer datenschutzrechtlicher Bestimmungen ist das Bundesamt für Sicherheit in der Informationstechnik Godesberger Allee 87 53175 Bonn Telefon: +49 (0)228 99 9582-0 Telefax: +49 (0)228 9910 9582-0 E-Mail: bsi@bsi.bund.de www.bsi.bund.de Behördlicher Datenschutzbeauftragter im BSI Dominic Kastien Bundesamt für Sicherheit in der Informationstechnik Datenschutzbeauftragter Godesberger Allee 87 53175 Bonn Postfach 200363 53133 Bonn Telefon: +49 (0) 228 99 9582-5527 E-Mail: datenschutzbeauftragter@bsi.bund.de Allgemeine Hinweise zur Datenverarbeitung des BSI 1. Besuch der Website Das BSI betreibt unter den Domains: www.bsi.bund.dewww.allianz-fuer-cybersicherheit.dewww.cert-bund.dewww.mip2.bsi.bund.de Internetseiten, auf denen es die Öffentlichkeit über seine Tätigkeit informiert und der Öffentlichkeit Informationen rund um die Sicherheit in der Informationstechnik zur Verfügung stellt. Einen Kurzüberblick zur Verarbeitung Ihrer personenbezogenen Daten zu dem vorgenannten Zweck erhalten Sie hier: Name der VerarbeitungKategorie pb DatenBetroffeneVerarbeitungszweckSpeicherdauerProtokolldateienAllg. technische DatenWebsite-BesucherOrdnungsgemäßer Betrieb der Website, Schutz vor Angriffen30 TageCookiesKEINEWebsite-BesucherKEINE VerarbeitungJeweiliger BesuchOpenStreetMapIP-AdresseKarten-NutzerNutzung von OpenStreetMapDSE OpenStreetMap 1.1 Technische Bereitstellung der Website Bei jedem Zugriff auf das Internetangebot des BSI werden eine Reihe von allgemeinen Daten und Informationen erfasst. Diese allgemeinen Daten und Informationen werden in den Logfiles von Servern gespeichert. Es werden folgende Daten gespeichert: Datum und Uhrzeit des Abrufs (Zeitstempel)Anfragedetails und Zieladresse (Protokollversion, HTTP-Methode, Referer, UserAgent-String)Name der abgerufenen Datei und übertragene Datenmenge (angefragte URL inkl. Query-String, Größe in Byte)Meldung, ob der Abruf erfolgreich war (HTTP Status Code) Es erfolgt keine personenbezogene Auswertung oder eine Auswertung der Daten zu Marketingzwecken oder eine Profilbildung. Daneben erfolgt eine Verarbeitung Ihrer Daten nach Ziffer 2.1 und Ziffer 2.2. Zweck und Rechtsgrundlage Das BSI verarbeitet Ihre Daten zur technischen Bereitstellung der Website auf Basis von Art. 6 Abs. 1 lit. c in Verbindung mit Art. 32 Abs. 1 der Verordnung (EU) 2016/679 Datenschutz-Grundverordnung (DSGVO), Art. 6 Abs. 1 lit. e, Abs. 2, 3 DSGVO in Verbindung mit § 3a Abs. 1 in Verbindung mit § 3 Abs. 1 S. 2 Nr. 14 Gesetzes über das Bundesamt für Sicherheit in der Informationstechnik (BSIG) in Verbindung mit der Aufgabe der Öffentlichkeitsarbeit und Art. 6 Abs. 1 lit. e, Abs. 2, 3 DSGVO in Verbindung mit § 5 BSIG. Zweck ist die Sicherstellung des ordnungsgemäßen Betriebs der Website, insbesondere zur Umsetzung angemessener technisch-organisatorischer Maßnahmen und der Erfüllung rechtlichen Verpflichtung, und um eine ansprechende, technisch funktionierende, performante und benutzerfreundliche Website zur Verfügung stellen zu können und die Systemsicherheit der Website zu gewährleisten. Empfänger der personenbezogenen Daten Innerhalb der Behörde erhalten diejenigen Stellen Zugriff auf Ihre Daten, die diese zur Erfüllung der oben genannten Zwecke benötigen. Das Hosting der Website erfolgt durch einen vom BSI beauftragten Auftragnehmer (ITZBund Dienstsitz Bonn, Bernkasteler Straße 8, 53175 Bonn). Es handelt sich hierbei um einen Auftragsverarbeiter des BSI, Art. 28 Abs. 1 DSGVO. Darüber hinaus gibt das BSI Ihre Daten nur weiter, sofern es dazu gesetzlich oder durch Gerichtsentscheidung verpflichtet oder ermächtigt ist, dies beispielsweise im Falle von Angriffen auf die Internetinfrastruktur zur Rechts- oder Strafverfolgung. Eine darüberhinausgehende Weitergabe an Dritte findet nicht ohne Ihre Zustimmung statt. Übermittlung an Drittland Das BSI überträgt Ihre personenbezogenen Daten nicht in Länder außerhalb der EU bzw. des EWR oder an internationale Organisationen. Speicherdauer Die Protokolldateien werden für 30 Tage gespeichert und danach automatisch gelöscht. 1.2 Cookies Auf den Seiten des BSI werden sogenannte Cookies eingesetzt. Keine dieser Cookies beinhalten personenbezogene Daten. Cookies sind kleine Informationseinheiten, die durch das Content-Management-System (CMS) des BSI auf dem Computer oder dem mobilen Endgerät der Nutzerin oder des Nutzers gespeichert werden und beim erneuten Aufrufen der BSI Webseite wieder abgerufen werden. In dem jeweils genutzten Webbrowser können Nutzerinnen und Nutzer die Verwendung von Cookies durch eine entsprechende Einstellung einschränken oder grundsätzlich verhindern. Bereits gespeicherte Cookies können jederzeit gelöscht werden. Das BSI nutzt Cookies, um die technisch sichere und korrekte Bereitstellung von Websites zu gewährleisten. Sie sollen die Sicherheit und Funktionalität der angebotenen Web-Anwendungen erhöhen. Dies umfasst Cookies zur Lastverteilung der Server, wie den JSESSIONID-Cookie, und des Session-Managements des Anwendungsservers. Die Cookies beinhalten keine personenbezogenen Daten. Es werden keine IP-Adresse oder sonstige Informationen erfasst, die das Zurückverfolgen auf den tatsächlichen Nutzer oder der tatsächlichen Nutzerin ermöglichen. Cookie-BezeichnungErläuterungJSESSIONID/sessionid Cookie für das Session-Management des Anwendungsservers,beinhaltet keine personenbezogenen Daten,basiert insb. nicht auf der IP des Nutzers oder einer sonstigen auf den tatsächlichen Nutzer zurückverfolgbaren Informationen,Gültigkeit endet mit Ablauf der aktuellen Sitzung,Die Session-ID ist nur auf dem jeweiligen Server gültig und wird nicht über verschiedene Server-Instanzen synchronisiert AL_SESS-SCookie wird für die grundsätzliche Erfassung statistischer Zwecke (z. B. anonyme Zugriffszahlen der Webseite allgemein) eingesetzt,beinhaltet keine personenbezogenen Daten,Wert ist eine zufällige Zeichenfolge zwischen 64 und 70 Zeichen,Cookie wird zum Sitzungsende automatisch gelöscht. cookiebanner Wird beim Schließen des Cookie-Hinweises gesetzt (Klick auf "OK")Funktionen: „Open“ oder „Close“Zeigt an, dass bei Besuch der Website keine personenbezogenen Daten gespeichert werdenGültigkeit 1 Monat csrftokenCookie wird zum Schutz vor Cross-Site-Request-Forgery-Angriffen eingesetzt,beinhaltet keine personenbezogenen Daten,Wert ist eine zufällige Zeichenfolge,Gültigkeit endet mit Ablauf der aktuellen Sitzung matomoTracking Cookie zur statistischen Auswertung zur bedarfsorientierten Bereitstellung von Informationen,Cookie enthält keine personenbezogenen Daten,er erfasst zwei Bytes der IP-Adresse des aufrufenden Systems des Nutzers (Anonymisierung durch "Nullen von zwei Stellen des IP-Bereichs"),die aufgerufene Webseitedie Webseite, von der der Nutzer auf die aufgerufene Webseite gelangt ist (Referrer)die Unterseiten, die von der aufgerufenen Webseite aus aufgerufen werdendie Verweildauer auf der Webseitedie Häufigkeit des Aufrufs der WebseiteGültigkeit maximal 1 Monat Session Cookie "Warenkorb"Bei Verwendung des Warenkorb-Systems wird ein temporärer Session-Cookie verwendet,dieser regelt die Funktionalität des Bestellvorgangs,er enthält keine personenbezogenen Daten,er wird zum Sitzungsende automatisch gelöscht. 1.3 OpenStreetMap Das BSI nutzt zur Darstellung einer interaktiven Karte auf der Webseite die Dienste der OpenStreetMap Foundation, St John’s Innovation Centre, Cowley Road, Cambridge, CB4 0WS, Vereinigtes Königreich Großbritannien und Nordirland. Klicken Sie die Karte an und stimmen der Übertragung zu, wird, im Rahmen der Nutzung der interaktiven Karte, Ihre IP-Adresse an die OpenStreetMap Foundation übertragen. OpenStreetMap ist für diese Verarbeitung verantwortlich. Zweck und Rechtsgrundlage Die Weitergabe der IP-Adresse erfolgt auf Grundlage Ihrer Einwilligung nach Art. 6 Abs. 1 lit. a DSGVO, zur Nutzung der Dienste von OpenStreetMap. Eine Verarbeitung der von Ihnen übermittelten IP-Adresse ist zum Zweck der Nutzung der interaktiven Karte erforderlich. Empfänger der personenbezogenen Daten OpenStreetMap ist Empfänger der IP-Adresse, alle Informationen zum Umgang damit finden Sie hier. Übermittlung an Drittland Bei der Verwendung von OpenStreetMap findet eine Übermittlung von personenbezogenen Daten in das Vereinigte Königreich Großbritannien und Nordirland statt. Diese Übermittlung erfolgt auf Grundlage von Art. 45 Abs. 1 S. 1 DSGVO. Alle weiteren Informationen zum Umgang mit Ihren Daten finden Sie hier. Speicherdauer Das BSI hat keinen Einfluss auf die Datenverarbeitung durch OpenStreetMap. Für die Datenverarbeitung ist das BSI nicht verantwortlich. Alle Informationen zum Umgang mit Ihren Daten können Sie der Datenschutzerklärung der OpenStreetMap Foundation entnehmen. 2. Abwehr von Schadprogrammen und Gefahren für die Kommunikationstechnik des Bundes Nach § 5 und 5a BSIG ist das BSI zuständig für die Abwehr von Schadprogrammen und Gefahren für die Kommunikationstechnik des Bundes und ihrer Komponenten. Hierfür muss das Bundesamt die an den Schnittstellen der Kommunikationstechnik des Bundes anfallenden Daten auswerten und Daten, die durch den Betrieb von Kommunikationstechnik des Bundes anfallen verarbeiten, soweit dies für die Erkennung und Abwehr von Schadprogrammen erforderlich ist. Einen Kurzüberblick zur Verarbeitung Ihrer personenbezogenen Daten zu dem vorgenannten Zweck erhalten Sie hier: Name der VerarbeitungKategorie pb DatenBetroffeneVerarbeitungszweckSpeicherdauerSchadprogramm-ErkennungssystemDaten, die an den Schnittstellen der Kommunikations-technik des Bundes anfallenBeschäftige der Bundesverwaltung, E-Mail-AbsenderAbwehr von Schadprogrammen und Gefahren für die Kommunikations-technik des BundesZur AuswertungSystem zur Protokolldaten-auswertungProtokolldaten, die beim Betrieb von Kommunikations-technik des Bundes anfallenBeschäftige der Bundesverwaltung, Website-Besucher, E-Mail-AbsenderAbwehr von Schadprogrammen und Gefahren für die Kommunikations-technik des BundesZur AuswertungSystem zur Protokollierungsdaten-auswertungProtokollierungsdaten, die durch den Betrieb von Kommunikations-technik des Bundes anfallenBeschäftige der Bundesverwaltung, Webseitenbesucher, E-Mail-AbsenderAbwehr von Gefahren für die Kommunikations-technik des Bundes und ihrer KomponentenZur Auswertung2.1 Schadsoftware-Erkennungssystem Zur Erfüllung seiner gesetzlichen Aufgabe betreibt das BSI das Schadsoftware-Erkennungssystems. Das Schadsoftware-Erkennungssystem analysiert den ein- und ausgehenden Kommunikationsverkehr automatisch und leitet erkannte mögliche Angriffe zu einer Analyse weiter. Bei der Erhebung können auch personenbezogene Daten verarbeitet werden, die an den Schnittstellen der Kommunikationstechnik des Bundes anfallen, beispielsweise die IP-Adressen. Zweck und Rechtsgrundlage Das BSI ist auf Grundlage des Art. 6 Abs. 1 lit. e, Abs. 2, 3 DSGVO in Verbindung mit § 5 Abs. 1, 3 BSIG zur Speicherung der Daten zur Erkennung und zum Schutz vor Angriffen auf die Internetinfrastruktur des BSI sowie auf die gesamte Kommunikationstechnik des Bundes über den Zeitpunkt Ihres Besuches oder Kommunikationsaufnahme hinaus berechtigt. Diese Daten werden analysiert und sind zur Abwehr von Schadprogrammen, Gefahren, die von dem aufgefundenen Schadprogramm ausgehen, oder zur Erkennung und Abwehr anderer Schadprogramme erforderlich, § 5 Abs. 3 S. 2 BSIG. Empfänger der personenbezogenen Daten Personenbezogene Daten, die im Rahmen von § 5 Abs. 3 BSIG analysiert wurden, werden nur nach Maßgabe von § 5 Abs. 5, 6 BSIG an andere Behörden übermittelt. Eine Weitergabe in anderen Fällen erfolgt nicht. Eine Zusammenführung dieser Daten mit anderen Datenquellen erfolgt durch das BSI nicht. Übermittlung an Drittland Das BSI überträgt Ihre personenbezogenen Daten nicht in Länder außerhalb der EU bzw. des EWR oder an internationale Organisationen. Speicherdauer Die automatisierte Auswertung der Schnittstellendaten erfolgt unverzüglich, die Daten werden nach erfolgtem Abgleich sofort und spurenlos gelöscht, sofern keine Auswertung nach § 5 Abs. 3 BSIG erforderlich ist. Ist eine solche Auswertung erforderlich, werden die Daten gelöscht, sobald sie nicht mehr zur Aufgabenerfüllung benötigt werden. 2.2 System zur Protokolldatenauswertung Zur Erfüllung seiner gesetzlichen Aufgabe betreibt das BSI ein System zur Protokolldatenauswertung. Hierfür muss das BSI Protokolldaten, die beim Betrieb von Kommunikationstechnik des Bundes anfallen, erheben und automatisiert auswerten, soweit dies zum Erkennen, Eingrenzen oder Beseitigen von Störungen oder Fehlern bei der Kommunikationstechnik des Bundes oder von Angriffen auf die Informationstechnik des Bundes erforderlich ist. Protokolldaten im Sinne des BSIG sind Steuerdaten eines informationstechnischen Protokolls zur Datenübertragung, die unabhängig vom Inhalt eines Kommunikationsvorgangs übertragen oder auf den am Kommunikationsvorgang beteiligten Servern gespeichert werden und zur Gewährleistung der Kommunikation zwischen Empfänger und Sender notwendig sind. Protokolldaten können Verkehrsdaten gemäß § 3 Nr. 30 des Telekommunikationsgesetzes und Nutzungsdaten nach § 15 Abs. 1 des Telemediengesetzes enthalten, § 2 Abs. 8 BSIG. Gängige verarbeitete Protokolldaten sind insbesondere, Logfiles von Servern oder Firewalls, Kopfdaten von Kommunikationsprotokollen, wie z. B. IP, ICMP, TCP, UDP, DNS, HTTP'
