["https://bsi.bund.de/DE/Karriere/Warum_BSI/warum_BSI_node.html"]
title = "BSI  -  Warum BSI?"
full_description = 'Warum BSI?Werde Teil des #TeamBSI! 1. Teamgeist Bei uns im BSI zählt vor allem eins: Teamgeist – wir unterstützen uns in unserer täglichen Arbeit gegenseitig und lernen voneinander. Bei uns arbeitest du von Anfang an aktiv mit und übernimmst eigene Aufgaben mit Verantwortung. Dabei kannst du dein Wissen und deine Persönlichkeit voll einbringen und uns als Team mit deinen Ideen voranbringen. 2. Im Dienste des Gemeinwohls Wer im BSI arbeitet, kann etwas bewirken. Wir arbeiten nicht für Status- oder Umsatzziele, sondern für die Sicherheit unserer Gesellschaft. Unsere Mission: Gestaltung einer digitalen Welt, der die Menschen vertrauen können. Wir wollen mit unserem Engagement als #TeamBSI die digitale Welt verbessern und Informationssicherheit als Chance für die digitale Transformation etablieren. 3. Spannende Themen- und Aufgabenvielfalt So rasant wie sich die Digitalisierung entwickelt, wachsen auch unsere Themen- und Aufgabengebiete im #TeamBSI. Von KI, Industrie 4.0 und Krypto-Währung bis hin zu Online-Wahlen, Autonomem Fahren und Luftsicherheit – wir arbeiten an aktuellen Themen und Trends der digitalen Transformation und treiben Cybersicherheit in allen Bereichen voran. 4. Gestaltungsspielraum & BSI-Kultur Im #TeamBSI kannst du dich und deine Ideen vom ersten Tag an einbringen. Und das nicht nur bei der Gestaltung von Cybersicherheit in der digitalen Welt, sondern auch bei unserer Zusammenarbeit innerhalb des BSI. Wir bieten unseren Kolleginnen und Kollegen lebenslanges Lernen – und durch Wissenstransfer einen Blick über den Tellerrand. Wir leben eine offene und kollegiale Kultur, Vernetzung wird bei uns großgeschrieben und dient als Grundlage für ein gutes und innovatives Arbeitsumfeld. Unsere Mitarbeitenden gestalten unsere Kultur und Arbeitsweise im BSI mit und bringen Themen ein, die ihnen persönlich am Herzen liegen. 5. Persönliche & berufliche Weiterentwicklung Gekommen, um zu bleiben. Im #TeamBSI kannst du dich jederzeit weiterentwickeln und hast die Möglichkeit, eine abwechslungsreiche Karriere anzustreben. Ob Fachkarriere oder Führungsposition – für deine persönliche Weiterentwicklung bieten wir viele unterschiedliche interne und externe Fortbildungsmöglichkeiten in allen Bereichen. Mehr dazu: Aufstieg und Karriere. 6. Zusammenhalt durch Vielfalt Wir sind bunt – unser Team lebt von einer Vielfalt an unterschiedlichen Charakteren, Fähigkeiten und Expertisen. Wir sind davon überzeugt, dass ein vielfältiges Team bessere Lösungen für alle entwickelt. Deshalb fördern wir Chancengerechtigkeit und Gleichstellung kontinuierlich auf allen Ebenen. Wir wollen ein respektvolles Miteinander, Teilhabe und ein wertschätzendes Umfeld für alle bieten. Mehr dazu: Buntes BSI. 7. Flexible Arbeitsgestaltung Die Herausforderungen der Corona-Pandemie haben uns neue Chancen und Möglichkeiten in unserer Zusammenarbeit gebracht. Die positiven Erfahrungen möchten wir auch weiterhin gewinnbringend für die Arbeitsgestaltung unserer Mitarbeitenden nutzen. Durch Arbeitszeitflexibilität, Teilzeitmodelle sowie ortsunabhängigem Arbeiten ermöglichen wir unseren Kolleginnen und Kollegen eine gute Vereinbarung von Beruf- und Privatleben. Mehr dazu: FAQs. 8. Cybersicherheit schaffen und optimieren Um die Sicherheit kümmern wir uns nicht nur in der digitalen Welt. Auch wir als Arbeitgeber bieten unseren Mitarbeitenden einen Job mit viel Sicherheit: Von geregelten, aber flexiblen Arbeitszeiten, einem festen, krisensicheren Arbeitsplatz und -ort bis zur Bezahlung nach Tarifen. Zudem hast du im #TeamBSI die Möglichkeit dich, bei Erfüllung aller Kriterien, verbeamten zu lassen. Weitere Informationen zur Arbeit im BSIBuntes BSIAufstieg und Karriere Ähnliche Themen Ar­bei­ten im BSI Ein­stieg FAQ Stel­len­an­ge­bo­te Ter­mi­ne Kon­takt Per­so­nal­ge­win­nung Zurück zu Bundesamt für Sicherheit in der Informationstechnik Das BSI als Arbeitgeber Das BSI ist auch 2024 der beliebteste IT-Arbeitgeber für Absolventinnen und Absolventen im öffentlichen Dienst Das BSI ist 2024 der beliebteste IT-Arbeitgeber für Professionals im öffentlichen Dienst Das BSI als Partner von: Nationaler Pakt für Frauen in MINT-Berufen Das BSI ist ausgezeichnet als "MINT minded company 2024" Das BSI hat die Charta der Vielfalt unterschrieben Das BSI ist Mitglied bei Employers for Equality Kurz-URL: https://www.bsi.bund.de/dok/warum-bsi'
