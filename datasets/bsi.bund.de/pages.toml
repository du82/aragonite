["https://bsi.bund.de/DE/Service-Navi/Abonnements/Newsletter/Buerger-CERT-Abos/buerger-cert-abos_node.html"]
title = "BSI  -  Abos für Verbraucherinnen und Verbraucher"
full_description = 'Abos für Verbraucherinnen und Verbraucher Der Verbraucherschutz-Newsletter "Sicher • Informiert" richtet sich an alle, die über die wichtigsten Ereignisse rund um die Sicherheit Ihres Computers und im Internet auf dem Laufenden gehalten werden wollen. Der Newsletter erscheint alle vierzehn Tage. Im Falle einer besonders akuten Gefahrensituation informieren wir Sie unmittelbar mit einer Extraausgabe des Newsletters. Alle Informationen werden leicht verständlich erklärt. Der ehemalige Newsletter "Bürger-CERT-Sicherheitshinweise" wurde im September 2022 eingestellt und ist seither als RSS-Feed (Technische Sicherheitshinweise für Verbraucherinnen und Verbraucher) abrufbar. Wir informieren Sie damit anlassbezogen zu aktuellen Sicherheitslücken in gängiger Software und zu verfügbaren Updates. Sie enthalten technische Details und richten sich tendenziell an fortgeschrittene Nutzer, die sich auf einem technischen Niveau informieren wollen. Was soll ich abonnieren? Wenn Sie nicht sicher sind, welche Informationsdienste Sie abonnieren sollen, werfen Sie doch einfach einen Blick auf die bisherigen Newsletter und das Archiv mit Sicherheitshinweisen. Wenn auch Sie auf Nummer Sicher gehen wollen, abonnieren Sie unsere Dienste. Weitere Informationen Abo für Ver­brau­che­rin­nen und Ver­brau­cher be­stel­len Abo für Ver­brau­che­rin­nen und Ver­brau­cher ab­be­stel­len Ar­chiv "Si­cher­heits­hin­wei­se für Ver­brau­che­rin­nen und Ver­brau­cher" Ri­si­ko­stu­fen Newslet­ter "Si­cher in­for­miert" Fra­gen und Ant­wor­ten Öf­fent­li­che Schlüs­sel Zurück zu Newsletterverwaltung Kurz-URL: https://www.bsi.bund.de/dok/6722626'
