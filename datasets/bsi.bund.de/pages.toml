["https://bsi.bund.de/DE/Service/Barrierefreiheit/barrierefreiheit_node.html"]
title = "BSI  -  Barrierefreiheit"
description = "Barrierefreiheit des Auftritts"
full_description = "Erklärung zur Barrierefreiheit Diese Erklärung zur Barrierefreiheit gilt für die unter der www.bsi.bund.de veröffentlichten Website des Bundesamtes für Sicherheit in der Informationstechnik (BSI). Als öffentliche Stelle im Sinne der Richtlinie (EU) 2016/2102 sind wir bemüht, unsere Websites im Einklang mit den Bestimmungen des Behindertengleichstellungsgesetzes des Bundes (BGG) sowie der Barrierefreien-Informationstechnik-Verordnung (BITV 2.0) zur Umsetzung der Richtlinie (EU) 2016/2102 barrierefrei zugänglich zu machen. Stand der Vereinbarkeit mit den Anforderungen Die Anforderungen der Barrierefreiheit ergeben sich aus §§ 3 Absätze 1 bis 4 und 4 der BITV 2.0, die auf der Grundlage von § 12d BGG erlassen wurde. Die Überprüfung der Einhaltung der Anforderungen beruht auf einer am 16. Februar 2021 durchgeführten Selbstbewertung. Aufgrund der Überprüfung ist die Website mit den zuvor genannten Anforderungen wegen der folgenden Unvereinbarkeiten teilweise vereinbar. Die nachstehend aufgeführten Inhalte sind aus folgenden Gründen nicht barrierefrei: Ältere PDF-Downloads sind ggf. nicht barrierefrei. Später eingestellte PDF-Dateien werden in barrierefreier Version erstellt beziehungsweise schnellstmöglich durch eine solche ersetzt.PDF-Downloads von Dritten sind ggf. nicht barrierefrei. Externe sind dazu angehalten diese barrierefrei zur Verfügung stellen.Zum Teil Untertitel von Videos. Bei neu eingestellten Videos sind wir bemüht, Untertitel schnellstmöglich nach der Veröffentlichung nachzureichen.Zum Teil Audios und Podcasts. Bei neu eingestellten Audios und Podcasts sind wir bemüht, Text-Alternativen schnellstmöglich zur Verfügung zu stellen.Die Captcha-Abfrage ist nicht barrierefrei. Fakultativ barrierefreie Inhalte Folgende Maßnahmen zur Erreichung der Barrierefreiheit sind geplant: Wir sind bemüht, die Anzahl an barrierefreien Inhalten und die Barrierefreiheit der Website stetig weiterzuentwickeln. Eine vereinfachte Prüfung durch eine externe Stelle ist 2021 erfolgt. Weitere Überprüfungen sind für 2022, 2023 und 2024 geplant. Datum der Erstellung beziehungsweise der letzten Aktualisierung der Erklärung Diese Erklärung wurde am 16. Februar 2021 erstellt und zuletzt am 22. Februar 2024 aktualisiert. Barrieren melden: Kontakt zu den Feedback Ansprechpartnern Sie möchten uns bestehende Barrieren mitteilen oder Informationen zur Umsetzung der Barrierefreiheit erfragen? Für Ihr Feedback sowie alle weiteren Informationen sprechen Sie unsere verantwortlichen Kontaktpersonen unter Kontakt-Formular an. Weitere Informationen zur Kontaktaufnahme mit dem BSI finden Sie unter Kontakt. Sie können uns auch per Post oder telefonisch kontaktieren: Bundesamt für Sicherheit in der Informationstechnik Postfach 200363 53133 Bonn Erreichbarkeit: Montag bis Freitag von 08:00-18:00 Uhr Telefon: 0800 274 1000 (kostenlos aus dem deutschen Fest- und Mobilfunknetz) E-Mail: service-center@bsi.bund.de De-Mail: poststelle@bsi-bund.de-mail.de Schlichtungsverfahren Wenn auch nach Ihrem Feedback an den oben genannten Kontakt keine zufriedenstellende Lösung gefunden wurde, können Sie sich an die Schlichtungsstelle nach § 16 BGG wenden. Die Schlichtungsstelle BGG hat die Aufgabe, bei Konflikten zum Thema Barrierefreiheit zwischen Menschen mit Behinderungen und öffentlichen Stellen des Bundes eine außergerichtliche Streitbeilegung zu unterstützen. Das Schlichtungsverfahren ist kostenlos. Es muss kein Rechtsbeistand eingeschaltet werden. Weitere Informationen zum Schlichtungsverfahren und den Möglichkeiten der Antragstellung erhalten Sie unter: www.schlichtungsstelle-bgg.de. Direkt kontaktieren können Sie die Schlichtungsstelle BGG unter info@schlichtungsstelle-bgg.de. Ähnliche Themen Bun­des­amt für Si­cher­heit in der In­for­ma­ti­ons­tech­nik Er­wei­ter­te Su­che Im­pres­s­um Nut­zungs­be­din­gun­gen Da­ten­schutz Zurück zu Bundesamt für Sicherheit in der Informationstechnik Kurz-URL: https://www.bsi.bund.de/dok/barrierefreiheit"
