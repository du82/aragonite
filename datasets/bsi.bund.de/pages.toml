["https://bsi.bund.de/DE/Das-BSI/Organisation-und-Aufbau/organisation-und-aufbau_node.html"]
title = "BSI  -  Organisation und Aufbau"
full_description = "Organisation und Aufbau Das Bundesamt für Sicherheit in der Informationstechnik (BSI) ist die Cybersicherheitsbehörde des Bundes und Gestalter einer sicheren Digitalisierung in Deutschland. Das BSI ist im Geschäftsbereich des Bundesministeriums des Innern und für Heimat angesiedelt und hat seinen Dienstsitz in Bonn. Weitere Standorte befinden sich in Saarbrücken/Saarland und Freital/Sachsen. Derzeit beschäftigt das BSI rund 1.650 Mitarbeitende. An der Spitze des BSI steht die Leitung mit Präsidentin und Vizepräsident, die durch den Leitungsstab unterstützt werden. Die Facharbeit des BSI ist in acht Abteilungen organisiert. Jede Abteilung setzt sich aus bis zu drei Fachbereichen zusammen. Die Fachbereiche unterteilen sich wiederum in verschiedene Referate. DokumenteDownload Organisation des BSI gem. §11 Informationsfreiheitsgesetz (IFG) (PDF)Download Gesamtaktenplan des BSI gem §11 Informationsfreiheitsgesetz (IFG) (PDF) Weitere Informationen Lei­tung Ab­tei­lun­gen in­kl. Or­ga­ni­gramm Zurück zu Bundesamt für Sicherheit in der Informationstechnik"
