full_description = '''Newsletter "Einfach • Cybersicher" Aus dem Verbraucherschutz-Newsletter "Sicher • Informiert" wird "Einfach • Cybersicher". Im März 2025 erscheint erstmals "Einfach • Cybersicher", der neue Verbraucherschutz-Newsletter des BSI. Er richtet sich an alle, die über die wichtigsten Ereignisse rund um die Sicherheit ihres digitalen Alltags mit praktischem Wissen auf dem Laufenden gehalten werden wollen. Der Newsletter erscheint einmal im Monat und ist in leicht verständlicher Sprache geschrieben. Quelle: © Bundesamt für Sicherheit in der Informationstechnik Verbraucherschutz-Newsletter kostenlos abonnieren Als Ergänzung zum Newsletter, informieren wir Sie mit einer Extraausgabe im Falle besonders wichtiger Gefahrensituationen sofort (sehen Sie hierzu auch unsere Sicherheitshinweise). Sollte eine Abmeldung vom Newsletter-Abo aus technischen Gründen nicht möglich sein, wenden Sie sich bitte vertrauensvoll per E-Mail oder Telefon an unser Service-Center. Hinweis: Aktuell kommt es bei der Signatur-Option "PGP" zu einem technischen Anzeigefehler, sodass der Newsletter fehlerhaft ausgespielt wird. Wir arbeiten an der Behebung dieses Problems. Aktuelle Newsletter-Ausgaben Liste der Newsletter +Ausgabe +Datum Kurzbeschreibung Ausgabe 02/2025 30.01.2025 Desinformation und Cyberspionage im Zuge der Bundestagswahl, KI-Bündnisse und Neuheiten, Beitragsservice warnt vor Phishing & richtiger Umgang mit KI Ausgabe 01/2025 09.01.2025 IT-Sicherheit von Millionen Windows-Rechnern gefährdet, Warnung vor Malware bei Discord, Schadcode in 36 Chrome-Extensions & die Cybersicherheitslage 2025 Ausgabe: 03/2024 20.12.2024 Politische Desinformation auf X, Interpol zu grenzüberschreitender Cyberkriminalität, erbeuteten Passwörtern auf der Spur & KI-generierte Nacktfotos von Taylor Swift sorgen für Empörung Alle Newsletter Sie haben nicht die gewollte Information gefunden? Hier geht's zur Übersichtsseite der Verbrauchertipps. Ähnliche Themen Abo für Ver­brau­che­rin­nen und Ver­brau­cher be­stel­len Abo für Ver­brau­che­rin­nen und Ver­brau­cher ab­be­stel­len Ar­chiv "Si­cher­heits­hin­wei­se für Ver­brau­che­rin­nen und Ver­brau­cher" Ri­si­ko­stu­fen Fra­gen und Ant­wor­ten Öf­fent­li­che Schlüs­sel Zurück zu Abos für Verbraucherinnen und Verbraucher Kurz-URL: https://www.bsi.bund.de/dok/9262712'''
