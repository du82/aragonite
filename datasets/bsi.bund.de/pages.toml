["https://bsi.bund.de/DE/Das-BSI/Zeitstrahl/BSI-Zeitstrahl_node.html"]
title = "BSI  -  Das BSI im Zeitstrahl"
description = "Von 1991 bis 2024 – der Zeitstrahl zeigt in Meilensteinen, wie sich das BSI und der Cyberraum entwickelt haben."
full_description = 'Zeitstrahl Von 1991 bis 2024 – der Zeitstrahl zeigt in Meilensteinen, wie sich das BSI und der Cyberraum entwickelt haben. 2022 bis 2024 Bild / Video 1 von 3 2012 bis 2021 Bild / Video 2 von 3 1991 bis 2011 Bild / Video 3 von 3 Quelle: BSI 2024 Cyber Resilience Act (CRA) Im Oktober wird der Cyber Resilience Act (CRA) von der EU verabschiedet. Er legt ein Mindestmaß an Cybersicherheit für alle vernetzten Produkte auf dem EU-Markt fest. Ab Dezember 2027 müssen digitale Produkte grundlegende Cybersicherheitsanforderungen erfüllen, damit sie in der EU verkauft werden dürfen. Ein Großteil der vom CRA regulierten Produkte wird bereits jetzt regelmäßig im Privathaushalt eingesetzt.Angriff Hisbollah-Pager Im Libanon kommt es durch mit Sprengstoff präparierte Pager und Funkgeräte zu Toten und Verletzten. Beim Entschlüsseln der auslösenden Nachricht auf den Empfangsgeräten werden Explosionen ausgelöst. Die Geräte werden vorrangig von der Terrormiliz Hisbollah genutzt, zu den Opfern zählen aber auch Zivilistinnen und Zivilisten. Wie später bekannt wird, wurde diese Aktion lange im Vorfeld durch den israelischen Geheimdienst geplant und ausgeführt.Studie Startup-Szene San Francisco Bay Area Die Agentur für Innovation in der Cybersicherheit GmbH (Cyberagentur) und das BSI veröffentlichen eine Studie zur Startup-Szene in der San Francisco Bay Area. Im Rahmen eines Pilotprojekts werden die wichtigsten Entwicklungen und Technologien in der Cybersicherheitsbranche der Bay Area analysiert. Ziel der Studie war es, einen Überblick über die wichtigsten Startups, Technologien und Trends im Bereich der Cybersicherheit zu gewinnen, um daraus Technikfolgen abschätzen zu können. Sie sollen als Entscheidungsgrundlage für zukünftige Forschungsförderungen der deutschen Bundesregierung dienen.Workshop Kooperationsvereinbarungen mit den Ländern Das BSI veranstaltet unter dem Motto "Kooperation gewinnt" einen interaktiven Workshop mit den Ländern, die eine Kooperationsvereinbarung mit dem BSI abgeschlossen haben. Ziel ist es, die bisher gemachten Erfahrungen beim Abschluss von Kooperationsvereinbarungen auszutauschen und diese entsprechend weiterzuentwickeln.Whitepaper Transparenz von KI-Systemen In dem Whitepaper definiert das BSI den Begriff der Transparenz im Kontext von KI-Systemen für unterschiedliche Interessenträger. Um mit dem technischen Fortschritt schritthalten zu können, ist die vorgestellte Definition von Transparenz so technologieneutral und zukunftstauglich wie möglich gehalten. Im Whitepaper wird außerdem der Bezug zu den Transparenzanforderungen der Verordnung über Künstliche Intelligenz (kurz: KI-Verordnung) des Europäischen Parlaments und des Rates hergestellt. Abschließend werden die Chancen und Risiken transparenter KI-Systeme beleuchtet.CrowdStrike Ein fehlerhaftes Update einer Cybersicherheitslösung des Unternehmens CrowdStrike führt am 19. Juli 2024 zu Systemabstürzen bei geschätzt 8,5 Millionen Windows-Geräten weltweit. Zahlreiche Branchen sind betroffen, darunter Betreiber kritischer Infrastrukturen wie Kliniken oder Flughäfen. Im Gespräch mit den Software-Unternehmen CrowdStrike und Microsoft entwickelt das BSI erste Maßnahmen, um vergleichbare Vorfälle künftig zu vermeiden.NIS-2-Tool zur Betroffenheitsprüfung Die Betroffenheitsprüfung enthält konkrete, am Kabinettsbeschluss des NIS-2 Umsetzungs- und Cybersicherheitsstärkungsgesetz (NIS2UmsuCG) orientierte Ja/Nein-Fragen, um Unternehmen in vier Kategorien einzuordnen. Sobald das Gesetz endgültig verabschiedet wurde, wird das BSI die Prüfung aktualisieren. Dann wird es für die nach der neuen Gesetzeslage zur Registrierung verpflichteten Unternehmen möglich sein, sich beim BSI zu registrieren. Die Betroffenheitsprüfung wurde bereits über 100.000-mal abgerufen. Weitere Informationen veröffentlicht das BSI im Rahmen der Kampagne #nis2know.Zulassung indigo Mobile Apple-Geräte können unter bestimmten Vorgaben für den staatlichen Einsatz durch die Behörden des Bundes verwendet werden. Vertrauliche Inhalte bis zum Status <Nur für den Dienstgebrauch> können über die Plattform indigo (iOS Native Device In Government Operation) auf handelsüblichen iPhones und iPads gespeichert und ausgetauscht werden.eRezept in Krankenkassen-Apps Krankenkassen können Versicherten Funktionen des eRezepts in ihren Apps zur Verfügung stellen. Die Voraussetzung dafür ist ein Sicherheitsgutachten, das bestätigt, dass die in der vom BSI erstellten Prüfvorschrift festgehaltenen IT-Sicherheitsmaßnahmen eingehalten werden. Die Krankenkassen müssen dem BSI ein Sicherheitsgutachten vorlegen, das durch einen externen Prüfer erstellt wurde.CyberRisikoCheck Gemeinsam mit Partnern hat das BSI den CyberRisikoCheck entwickelt, um kleine und mittlere Unternehmen (KMU) dabei zu unterstützen, ihre Cyberresilienz zu erhöhen. Der CyberRisikoCheck ermöglicht Unternehmen eine Positionsbestimmung ihres IT-Sicherheitsniveaus und zeigt, welche konkreten Maßnahmen es umsetzen bzw. bei einem IT-Dienstleister beauftragen sollte.Taurus Bei einem Gespräch über eine Plattform für Videokonferenzen kommt es zu einem Sicherheitsvorfall, bei dem vertrauliche Informationen öffentlich werden. Inhalt des Gesprächs war eine mögliche Lieferung von Taurus-Marschflugkörpern an die Ukraine.Neues Nationales IT-Lagezentrum Seit Februar 2024 ist das neue Nationale IT-Lagezentrum des BSI in Betrieb. Die Arbeitsplätze wurden verdoppelt und die neueste Medientechnik verbaut, um im 24/7 Informationsdauerdienst die Cybersicherheitslage Deutschlands zu jeder Tages- und Nachtzeit bewerten zu können. Ein multifunktionales Raumkonzept unterstützt die Expertinnen und Experten bei den Aufgaben – vom Tagesbetrieb bis zur IT-Krise.VS-NfD Cloud Daten mit Einstufung <Verschlusssache – Nur für den Dienstgebrauch> sollen in der Public Cloud sicher verarbeitet werden. Bis Jahresende will das BSI mit Hyperscalern und nationalen Anbietern anhand ausgewählter Pilotvorhaben zeigen, dass VS-NfD-Daten sicher in Public Clouds verarbeitet werden können. Cloud-Plattformen bieten technologiebedingt wesentlich weitreichendere Detektionsmöglichkeiten für Cyberrisiken als andere Architekturen. Um die damit verbundenen Chancen adäquat zu adressieren, entwickelt das BSI Empfehlungen zur wirksamen Nutzung dieser Möglichkeiten.Gründung Digital Cluster Bonn Sechs Bundesbehörden mit Sitz in Bonn gründen das „Digital Cluster Bonn“. Mit der Initiative wollen sie ihre Zusammenarbeit zu allen Aspekten der Digitalisierung ausbauen. Ein Schwerpunkt wird der Bereich Regulierung und Aufsicht. Die Mitglieder sind: die Bundesanstalt für Finanzdienstleistungsaufsicht (BaFin), das Bundesamt für Justiz (BfJ), das BSI, der Bundesbeauftragte für den Datenschutz und die Informationsfreiheit (BfDI), das Bundeskartellamt (BKartA) und die Bundesnetzagentur (BNetzA).2023 Cybernation Deutschland Cybersicherheit ist eine gesamtstaatliche Aufgabe, die wir nur alle gemeinsam bewältigen können. Das BSI nimmt seine Verantwortung als integraler Bestandteil der Cybersicherheitsarchitektur wahr und arbeitet in offener, partnerschaftlicher Kooperation auf Augenhöhe mit allen Beteiligten am Erreichen der Ziele und der Umsetzung der dahinterliegenden Maßnahmen. Die Vision: Wir bauen gemeinsam die Cybernation Deutschland.5G/6G Security Lab Freital Mit dem Sicherheitslabor verfügt das BSI über eine für Telekommunikationsbetreiber typische Testumgebung mit mehreren Funkzellen im eigenen Campus-Netz. Das Basissystem umfasst Komponenten für ein Cloud-natives 5G-Kernnetz sowie Technik, die sowohl 5G- als auch 4G-Funktionen abdecken.Präsidentin Claudia Plattner Claudia Plattner übernimmt zum 1. Juli 2023 die Leitung des BSI. Zuvor war sie seit 2017 Chief Information Officer bei der DB Systel GmbH und seit Mitte 2021 Generaldirektorin für Informationssysteme bei der Europäischen Zentralbank (EZB) in Frankfurt. Hier war sie für die Cybersicherheit und die Steuerung aller Digitalisierungsprozesse sowie weitere wesentliche strategische Fragen verantwortlich.Chancen und Risiken von KI-Sprachmodellen Große KI-Sprachmodelle, so genannte Large Language Models (LLMs), sind in der öffentlichen Diskussion omnipräsent. Im Rahmen des 19. Deutschen IT-Sicherheitskongresses hat das BSI ein Positionspapier veröffentlicht, in dem es über Stärken, Schwächen und Risiken von KI-Sprachmodellen informiert – sowie über geeignete Vorsichtsmaßnahmen.Ransomware-Angriff auf ESXi-Server Ein weltweit breit gestreuter Ransomware-Angriff verschlüsselt laut Medienberichten tausende ESXi-Server, die u. a. zur Virtualisierung von IT-Fachverfahren genutzt werden. Der regionale Schwerpunkt der Angriffe lag dabei auf Frankreich, den USA, Deutschland und Kanada, auch weitere Länder sind betroffen.Internationaler Leitfaden zur Entwicklung sicherer KI-Systeme Die Partnerbehörden des BSI aus UK Großbritannien und den USA stellen den Leitfaden „Guidelines for Secure AI System Development“ bereit. 23 internationale Cybersicherheitsbehörden aus 18 Ländern unterstützen das Papier, an dem auch das BSI mitgewirkt hat.NIS2-Richtlinie Der Rat der Europäischen Union stimmt am 28. November 2022 dem Vorschlag der "Richtlinie über Maßnahmen für ein hohes gemeinsames Cybersicherheitsniveau in der Union" (NIS-2-Richtlinie) zu.2022 10 Jahre ACS 6.620 Teilnehmer 2022 feiert die Allianz für Cyber-Sicherheit ihr zehnjähriges Bestehen. Mit rund 6.620 Teilnehmern ist sie damit Europas größte PPP für Cybersicherheit in der Wirtschaft - und jeden Tag werden mehr Organisationen Teil des Netzwerkes. Publikation Cyber-Sicherheit Weltrauminfrastrukturen Als Cybersicherheitsbehörde des Bundes sieht sich das BSI auch für die Cybersicherheit von Satelliteninfrastrukturen in der Verantwortung. Insbesondere vor dem Hintergrund der wachsenden Abhängigkeit von Satellitendiensten. Ein erster wichtiger Schritt ist die Positionierung zum Thema Cybersicherheit von Satelliten und zugehöriger Infrastrukturen. Zur Publikation Cyber-Sicherheit für WeltrauminfrastrukturenKampagne #TeamBSI Die Mitarbeitenden des BSI teilen gemeinsam die Begeisterung für ein Thema: Cybersicherheit. Die Employer-Branding-Kampagne #TeamBSI startet, um weitere Mitarbeiterinnen und Mitarbeiter für die Gestaltung der sicheren Digitalisierung in Deutschland zu gewinnen.Hacktivismus gegen deutsche Mineralölversorger Im März 2022 erfolgt ein Cyberangriff auf einen deutschen Mineralölhändler mit russischem Mutterkonzern. Es fallen mehrere virtualisierte Serversysteme aus und es gelingt den Angreifern, tief in die Systeme des Unternehmens einzudringen und Daten in größerem Umfang von verschiedenen Speichersystemen, Mailservern und Festplattenimages auszuleiten.Digital Service Act Strengere Aufsicht über Onlineplattformen und mehr Schutz von Verbraucherinnen und Verbrauchern im Netz – das sind die Eckpunkte des Gesetzes über digitale Dienste (Digital Services Act, DSA). Der DSA regelt Pflichten für Unternehmen, die digitale Dienste in der EU anbieten. Darunter fallen zum Beispiel Internetprovider, Hosting-Anbieter, Clouddienste, soziale Netzwerke, Messenger und Onlinemarktplätze.Angriff auf Satelliteninfrastruktur Im Februar 2022 fällt aufgrund eines Cyberangriffs im europäischen Raum ein Satellitendienst aus, über welchen u. a. Prozesse zur Entstörung von Windenergieanlagen in der Strombranche mittels Satellitenkommunikationslösungen unterhalten werden. Infolge des Angriffs konnten rund 5.800 Windenergieanlagen nicht mehr mittels Fernwartung gewartet werden.Einschätzung Cyberlage zum russischen Angriffskrieg auf die Ukraine Nach dem russischen Angriff auf die Ukraine bewertet das BSI fortwährend die Lage mit Bezug zur Informationssicherheit und ruft seine Zielgruppen dazu auf, ihre IT-Sicherheitsmaßnahmen zu überprüfen und der gegebenen Bedrohungslage anzupassen.Erteilung 1. IT-SiK Im Februar 2022 werden die ersten IT-Sicherheitskennzeichen des BSI an einen E-Mail-Anbieter vergeben. Verbraucherinnen und Verbraucher können den QR-Code des Kennzeichens mit dem Smartphone scannen und erhalten Informationen zu den IT-Sicherheitseigenschaften des Produkts. Hersteller und Diensteanbieter können mit dem Kennzeichen die IT-Sicherheit ihrer Produkte am Markt hervorheben. 2021 Schwachstelle Log4shell Die kritische Schwachstelle (Log4Shell) in der weit verbreiteten Java-Bibliothek Log4j führt zu einer extrem kritischen Bedrohungslage. Das BSI erhöht die Cybersicherheitswarnung auf Warnstufe Rot. Ursächlich für diese Einschätzung ist die sehr weite Verbreitung des betroffenen Produkts und die damit verbundenen Auswirkungen auf unzählige weitere Produkte.1. Kooperationsvereinbarung BSI/Bundesland Die Kooperationsvereinbarung steht für das gemeinsame Ziel, die Cyber- und Informationssicherheit in Niedersachsen und darüber hinaus zu stärken. Es wurden mehrere Kooperationsfelder für eine Zusammenarbeit identifiziert. Neben der gegenseitigen Unterstützung bei herausgehobenen Cybersicherheitsvorfällen wurden u.a. Hospitationen zur stärkeren Vernetzung vereinbart.Nationales Koordinierungszentrum für Cybersicherheit Gemäß EU-Verordnung 2021/887 unterstützt das NKCS das Europäische Kompetenzzentrum für Cybersicherheit (ECCC) auf nationaler Ebene. Das NKCS besteht aus den vier Ministerien (BMWK, BMI, BMVg und BMBF), dem BSI als Kopfstelle sowie dem Forschungsinstitut CODE und dem DLR DLR-Projektträger. Es nimmt seine Arbeit am 10. Dezember 2021 auf. Ziel ist es, die Förderung von Cybersicherheitsforschung in Deutschland und Europa zu stärken.Eröffnung Standort Saarbrücken Die Tätigkeiten des BSI zum Thema KI werden durch den neuen BSI-Standort weiter intensiviert und um neue Aufgaben ergänzt. Neben der Ausweitung der technischen Betrachtungen zur KI-Sicherheit werden die technischen Grundlagen für den digitalen Verbraucherschutz im Bereich KI erarbeitet.IT-SiG 2.0: Neue Aufgabe DVS Das IT-Sicherheitsgesetz 2.0 (IT-SiG 2.0) tritt in Kraft. Das BSI bekommt u.a. die Aufgabe des Digitalen Verbraucherschutzes (DVS) und der Verbraucherinformation im Bereich der Sicherheit in der Informationstechnik, insbesondere durch unabhängige und neutrale Beratung sowie Warnung auf Bundesebene.Kampagne „einfachaBSIchern“ Die Kampagne #einfachaBSIchern sensibilisiert Verbraucherinnen und Verbraucher für Risiken im digitalen Alltag und zeigt Möglichkeiten auf, wie sie sich sicher im Netz bewegen können. Mit Videos und Werbemotiven macht sie die Angebote des BSI zu Themen wie Online-Shopping, Home-Office, Online-Gaming, Social Media oder Smarthome bekannter.1. digitaler Katastrophenfall in Deutschland Eine Landkreisverwaltung in Sachsen-Anhalt im 5. Juli 2021 zum Ziel eines Ransomware-Angriffs. Sämtliche IT-Systeme aller Standorte der Kreisverwaltung sind beeinträchtigt. In der Folge des Angriffs konnten keine Dienste für Bürgerinnen und Bürger erbracht werden. Am 9. Juli 2021 stellte der Landkreis den örtlichen Katastrophenfall fest.Schwachstelle Exchange Microsoft schließt mit einem Sicherheitsupdate vier kritische Sicherheitslücken im Exchange-Server, die in Kombin'
