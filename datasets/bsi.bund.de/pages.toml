["https://bsi.bund.de/DE/Das-BSI/Leitbild/leitbild_node.html"]
title = "BSI  -  Leitbild"
full_description = 'Unser LeitbildDas BSI als die Cybersicherheitsbehörde des Bundes gestaltet Informationssicherheit in der Digitalisierung durch Prävention, Detektion und Reaktion für Staat, Wirtschaft und Gesellschaft. Was wollen wir erreichen? Das BSI ist die Cybersicherheitsbehörde des Bundes und Gestalter einer sicheren Digitalisierung in Deutschland. Unser Ziel ist der sichere Einsatz von Informations- und Kommunikationstechnik in Staat, Wirtschaft und Gesellschaft. Mit unserer Unterstützung soll Informationssicherheit als Voraussetzung der Digitalisierung verstanden und eigenverantwortlich umgesetzt werden. Wir wollen bewirken, dass Sicherheitsaspekte schon bei der Entwicklung von IT-Systemen und -Anwendungen berücksichtigt werden. Denn Informationssicherheit und Digitalisierung gehören untrennbar zusammen. Was sind unsere Aufgaben? Wir setzen uns verantwortungsvoll mit allen Fragen der Informationssicherheit auseinander. Wir schützen die Bundesverwaltung vor Cyberangriffen und beobachten die aktuelle Cybersicherheitslage national und international, untersuchen und bewerten bestehende Sicherheitsrisiken und schätzen vorausschauend die Auswirkungen neuer Entwicklungen ab. Auf Grundlage dieses Wissens unterstützen wir Bürgerinnen und Bürger, Unternehmen, Behörden in Bund, Ländern und Kommunen mit Leistungen aus den Kernbereichen Information, Beratung, operativer Schutz, Entwicklung incl. Standardisierung und Zertifizierung. Zudem sind wir Aufsichtsbehörde für die Sicherheit in der Informationstechnik Kritischer Infrastrukturen und digitaler Dienste. Information: Wir informieren zu allen wichtigen Themen der Informationssicherheit.Beratung: Wir beraten in Fragen der Informationssicherheit und unterstützen unsere Zielgruppen bei der Umsetzung geeigneter Maßnahmen.Entwicklung: Wir konzipieren und entwickeln Standards, IT-Sicherheitsanwendungen und -produkte.Operativer Schutz: Wir schützen die Regierungsnetze und die Bundesverwaltung vor Cyberangriffen.Zertifizierung: Wir prüfen, bewerten und zertifizieren IT-Systeme, Dienstleistungen und Personen hinsichtlich ihrer Eigenschaften bzw. Fähigkeiten im Bereich Informationssicherheit. Die Zulassung von IT-Systemen für die Verarbeitung geheimer Informationen gehört ebenfalls zu unseren Aufgaben.Aufsicht: Wir beaufsichtigen Betreiber Kritischer Infrastrukturen und digitaler Dienste in Bezug auf ihre Informationssicherheit und sind die zentrale Meldestelle für IT-Sicherheitsvorfälle und Cyberangriffe in Deutschland. Weitere Informationen Vi­deos­pot "Di­gi­tal le­ben" FAQ Auf­ga­ben des BSI Zurück zu Bundesamt für Sicherheit in der Informationstechnik'
