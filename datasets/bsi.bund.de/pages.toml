["https://bsi.bund.de/DE/Das-BSI/BSI-Standorte/Nationales-Verbindungswesen/nationales-verbindungswesen_node.html"]
title = "BSI  -  BSI vor Ort"
full_description = "Eine Behörde mit zahlreichen AnlaufstellenBSI vor Ort – Das Verbindungswesen Mit dem Verbindungswesen verstärkt das BSI die Vernetzung auf nationaler und internationaler Ebene und die Kooperation mit Staat, Wirtschaft und Gesellschaft. In zahlreichen Regionen Deutschlands gibt es inzwischen Anlaufstellen, in denen Verbindungspersonen die zentralen Ansprechpartner für Bundesbehörden, Länder und Kommunen sowie Wirtschaftsunternehmen, ThinkTanks und gesellschaftliche Entscheidungsträger sind. Die Verbindungspersonen unterstützen ebenso internationale Organisationen mit Sitz in Deutschland, wie z.B. die Europäische Zentralbank im Rahmen des Host Nation Supports. Wir sind für Sie da Die Verbindungspersonen ermöglichen als feste Ansprechpartner in einer regionalen Verbindungsstelle eine schnelle und direkte Kontaktaufnahme mit dem BSI. Sie vertreten das BSI bei Veranstaltungen und nehmen Vortragstätigkeiten in der Region wahr. Darüber hinaus geben die Verbindungspersonen einen Überblick über die Angebote und Expertise des BSI und vermitteln bei Bedarf Beratung und Unterstützung. Die Mitarbeiterinnen und Mitarbeiter der nachfolgenden Standorte vereinbaren gerne einen Termin mit Ihnen: Maria Radestock Verbindungsperson Berlin in der Verbindungsstelle Berlin Ariane Steinke Verbindungsperson Nord in der Verbindungsstelle Hamburg Dirk Wieseler Verbindungsperson Nord in der Verbindungsstelle Hamburg Maximilian Kruck Verbindungsperson Rhein-Main in der Verbindungsstelle Wiesbaden Sarah Putscher Verbindungsperson Süd in der Verbindungsstelle Stuttgart Maximilian Marder Verbindungsperson West in der Verbindungsstelle Bonn Kontakt Sie erreichen Ihren jeweiligen Ansprechpartner über die E-Mail-Adresse: E-Mail: BSIregional@bsi.bund.de Weitere Informationen BSI-Stand­orte in Bonn Freit­al Saar­brücken Zu­sam­men­ar­beit mit Bund und Län­dern Zurück zu BSI Standorte Kurz-URL: https://www.bsi.bund.de/dok/9983880"
