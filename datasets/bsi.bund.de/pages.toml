full_description = "Kritische Infrastrukturen und weitere meldepflichtige Unternehmen: Einen Vorfall bewältigen, melden, sich informieren, vorbeugen Die folgenden Seiten geben Ihnen ein Erste-Hilfe-Paket an die Hand, um die ersten Schritte zur Bewältigung des Vorfalls angehen zu können. Daneben klären wir Sie über etwaige Meldepflichten bei einem IT-Sicherheitsvorfall auf und lotsen Sie zur passenden Meldestelle. Damit es gar nicht erst zu einem IT-Sicherheitsvorfall kommt, haben wir Ihnen hier zahlreiche Informationen zur Prävention bereitgestellt. Daneben empfehlen wir eine kostenlose Teilnahme an der Allianz für Cyber-Sicherheit und am UP KRITIS Ich habe einen Vorfall – Was soll ich tun? Mehr : Ich habe einen Vorfall – Was soll ich tun? Ich muss oder möchte einen Vorfall melden. Mehr : Ich muss oder möchte einen Vorfall melden. CVD-Richtlinie des BSI Mehr : CVD-Richtlinie des BSI Ich suche grundsätzliche Informationen um mich vor einem Vorfall zu schützen. Mehr : Ich suche grundsätzliche Informationen um mich vor einem Vorfall zu schützen. Ich suche aktuelle Informationen über Bedrohungen. Mehr : Ich suche aktuelle Informationen über Bedrohungen. Kurz-URL: https://www.bsi.bund.de/dok/schwachstellen-KRITIS"
