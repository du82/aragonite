["https://bsi.bund.de/DE/Karriere/Stellenangebote/stellenangebot_node.html"]
title = "BSI  -  Stellenangebote"
full_description = 'Stellenangebote Bedingt durch die wachsende Bedeutung des Themas IT-Sicherheit wird es weiterhin zahlreiche Ausschreibungen für die Fachabteilungen des BSI geben. Mit unserem RSS-Newsfeed auf der Seite service.bund.de informieren wir euch schnell und bequem über aktuelle Stellenangebote. #TeamBSI-Bewerberumfrage Das #TeamBSI legt großen Wert auf einen transparenten und gut funktionierenden Bewerbungsprozess. Deshalb interessiert uns, wie ihr diesen wahrnehmt: Was läuft gut? Was können wir besser machen? Solltet ihr euch im Zeitraum von Oktober 2024 bis März 2025 über unser Online-Bewerberportal bei uns beworben haben oder noch bewerben wollen, könnt ihr an unserer Umfrage teilnehmen. Wir freuen uns über euer Feedback. Vielen Dank! Das BSI in Freital Um Länder, Kommunen und Wirtschaft vor Ort besser unterstützen zu können sowie ein hohes Niveau an IT-Sicherheit in ganz Deutschland sicherzustellen, sind wir mit unserem Zweitstandort in Freital bei Dresden vertreten. Am neuen Zweitstandort sollen bis zu 200 Mitarbeiter*innen beschäftigt werden. Neben Fachkräften aus dem MINT-Bereich sucht das BSI auch Personal für zentrale Aufgaben wie die Verwaltung oder Hausmeisterdienste. Die Einarbeitung erfolgt dabei zeitweise in Bonn. Schaut gerne bei unseren derzeit ausgeschriebenen Stellen für Freital vorbei. Wir freuen uns auf eure Bewerbung! Weitere Informationen erhaltet ihr hier. Das BSI in Saarbrücken Das BSI wächst weiter und so bauen wir derzeit einen Standort in Saarbrücken auf. Die Mitarbeitenden am Standort beschäftigen sich schwerpunktmäßig mit der Sicherheit von Systemen, die auf Methoden und Verfahren der Künstlichen Intelligenz (KI) beruhen. Darüber hinaus analysieren sie konkrete KI-basierte Angriffe auf IT-Systeme und entwickeln geeignete Gegenmaßnahmen. Das BSI sucht überwiegend MINT-Fachkräfte mit Kenntnissen im Bereich Künstliche Intelligenz. Die Einarbeitung erfolgt vor Ort und im Rahmen regelmäßiger Dienstreisen zwischen den Standorten Bonn und Saarbrücken. Schaut gerne bei unseren derzeit ausgeschriebenen Stellen für Saarbrücken vorbei. Wir freuen uns auf eure Bewerbung! Weitere Informationen erhaltet ihr hier. Master/Diplom (Universität) Titel Ort Bewerbungsfrist Leitung (w/m/d) des Teams „IT Strategie u. IT Planung“ - BSI-2025-026 Bonn 04.03.2025 Mehrere Referent/innen als Unterstützer/innen und Taktgeber/innen für Strategie und Steuerung im Leitungsbereich BSI-2025-028 bonn 04.03.2025 Fachbereichsleitung „IT-Sicherheitslage” (w/m/d) BSI-2025-027 Bonn 07.03.2025 Referentin/Referent (w/m/d) im Referat W14 - BSI-2025-024 Bonn 12.03.2025 IT-Sicherheitsexpertin / IT-Sicherheitsexperte (w/m/d) im Bereich Onlinezugang und Onlinewahlen; BSI-2025-019 Freital 13.03.2025 Wir suchen Digitale Talente (w/m/d) - BSI-2025-033 Freital 24.03.2025 Bachelor/Diplom (FH) Titel Ort Bewerbungsfrist IT-Expertin / IT-Experte (w/m/d) für sichere 5G-Netze; BSI-2025-030 20.03.2025 Fachadministratorinnen/Fachadministratoren (w/m/d) für die ERP-Software MACH - BSI-2025-031 Bonn 24.03.2025 Wir suchen Digitale Talente (w/m/d) - BSI-2025-032 Freital 24.03.2025 sonstige Abschlüsse Titel Ort Bewerbungsfrist Mitarbeitende IT-Support (w/m/d) im Referat TK 31 „IT-Strategie und IT-Planung“ - BSI-2025-029 Bonn 03.03.2025 Technikerin/Techniker (w/m/d) im Bereich Digitalisierung und mobiler eID-Technologien BSI-2025-020 Freital 13.03.2025 Ausbildung im BSI Titel Ort Bewerbungsfrist Zur Zeit keine Stellenangebote. Weitere Stellenangebote TitelOrtBewerbungsfrist Volljuristinnen/Volljuristen (m/w/d) für IT-Sicherheits-und (IT-)Vertragsrecht oder für die rechtliche Begleitung von Verwaltungs-, Aufsichts- und Bußgeldverfahren - VJ 2025-001Bonn25.03.2025 Ähnliche Themen Wa­rum BSI? Ar­bei­ten im BSI Ein­stieg FAQ Ter­mi­ne Kon­takt Per­so­nal­ge­win­nung Zurück zu Bundesamt für Sicherheit in der Informationstechnik Das BSI als Arbeitgeber Das BSI ist auch 2024 der beliebteste IT-Arbeitgeber für Absolventinnen und Absolventen im öffentlichen Dienst Das BSI ist 2024 der beliebteste IT-Arbeitgeber für Professionals im öffentlichen Dienst Das BSI als Partner von: Nationaler Pakt für Frauen in MINT-Berufen Das BSI ist ausgezeichnet als "MINT minded company 2024" Das BSI hat die Charta der Vielfalt unterschrieben Das BSI ist Mitglied bei Employers for Equality'
