["https://bsi.bund.de/DE/Karriere/Einstieg/einstieg_node.html"]
title = "BSI  -  Einstieg"
full_description = "Einstiegsmöglichkeiten im BSIGestaltet mit uns IT-Sicherheit in Deutschland und entdeckt eure Einstiegsmöglichkeiten. Ob beim Berufseinstieg von Anfang an mittendrin oder Aufgaben mit Anspruch für Profis mit Erfahrung – Informationstechnik ist eure Welt. Wie wäre es damit, Deutschlands digitale Zukunft zu sichern? Beim BSI bringt ihr eure Erfahrung und Ideen in ein Thema ein, das für uns alle immer wichtiger wird. Angesichts dieser großen Aufgabe arbeiten mittlerweile rund 1500 Beschäftigte im #TeamBSI und dieses wird aufgrund neuer Themen und Aufgaben weiter stetig wachsen. Deshalb suchen wir engagierte Expertinnen und Experten, deren Herz auf der digitalen Seite schlägt. Ein sicherer Job und spannende Tätigkeitsfelder für Auszubildende, Studierende und Berufserfahrene. Das Zukunftsthema IT-Sicherheit aktiv mitgestalten zu können, bedeutet Herausforderung und Chance gleichermaßen. Gute Aussichten, das Beste aus sich zu machen. Weitere Informationen Stu­di­um und Aus­bil­dung Ab­sol­vent/in­nen Be­rufs­er­fah­re­ne Zurück zu Bundesamt für Sicherheit in der Informationstechnik"
