title = "BSI  -  Unternehmen"
full_description = "Unternehmen: Einen Vorfall bewältigen, melden, sich informieren, vorbeugen Ihr Unternehmen ist von einem IT-Sicherheitsvorfall betroffen? Dann gilt es, unverzüglich zu handeln. Die folgenden Seiten geben Ihnen Unterstützung, z. B. über die Digitale Rettungskette des Cyber-Sicherheitsnetzwerks, um die ersten Schritte zur Bewältigung des Vorfalls angehen zu können. Damit es gar nicht erst zu einem IT-Sicherheitsvorfall kommt, haben wir Ihnen hier zahlreiche Informationen zur Prävention bereitgestellt. Daneben empfehlen wir eine kostenlose Teilnahme an der Allianz für Cyber-Sicherheit! Ich habe einen Vorfall – Was soll ich tun? Mehr : Ich habe einen Vorfall – Was soll ich tun? Ich habe einen Vorfall – Checkliste Organisatorisches Mehr : Ich habe einen Vorfall – Checkliste Organisatorisches Ich habe einen Vorfall – Checkliste Technik Mehr : Ich habe einen Vorfall – Checkliste Technik Ich möchte einen IT-Sicherheitsvorfall melden. Mehr : Ich möchte einen IT-Sicherheitsvorfall melden. CVD-Richtlinie des BSI Mehr : CVD-Richtlinie des BSI Ich suche Informationen zur reaktiven Unterstützung durch das Cyber-Sicherheitsnetzwerk Mehr : Ich suche Informationen zur reaktiven Unterstützung durch das Cyber-Sicherheitsnetzwerk Ich suche grundsätzliche Informationen, um mich vor einem IT-Sicherheitsvorfall zu schützen Mehr : Ich suche grundsätzliche Informationen, um mich vor einem IT-Sicherheitsvorfall zu schützen Ich suche aktuelle Informationen über Bedrohungen. Mehr : Ich suche aktuelle Informationen über Bedrohungen. Kurz-URL: https://www.bsi.bund.de/dok/vorfall-melden"
