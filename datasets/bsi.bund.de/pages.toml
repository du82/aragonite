["https://bsi.bund.de/DE/Das-BSI/BSI-Standorte/bsi-standorte_node.html"]
title = "BSI  -  BSI Standorte"
full_description = "Standorte des BSI Der Hauptsitz des Bundesamtes für Sicherheit in der Informationstechnik (BSI) befindet sich in der Bundesstadt Bonn. Mehrere Liegenschaften befinden sich im Stadtgebiet. Auch in Freital ist das BSI mit einem Standort vertreten. Dazu und auch zum derzeit geplanten Neubauvorhaben finden Sie im Folgenden weitere Informationen. In Saarbrücken verfügt das BSI ebenfalls über einen Standort. Das BSI ist zusätzlich in zahlreichen Regionen Deutschlands mit Ansprechpartnern vertreten. Mit dem Verbindungswesen wird die Vernetzung des BSI auf nationaler und internationaler Ebene gestärkt. Die Verbindungspersonen sind zentrale Anlaufstellen für Länder und Kommunen, Bundes- und EU-Behörden in den jeweiligen Regionen. Weitere Informationen BSI-Stand­orte in Bonn Freit­al Saar­brücken BSI vor Ort Zu­sam­men­ar­beit mit Bund und Län­dern Zurück zu Bundesamt für Sicherheit in der Informationstechnik Kurz-URL: https://www.bsi.bund.de/dok/6628302"
