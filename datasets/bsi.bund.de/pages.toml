["https://bsi.bund.de/DE/Service-Navi/Die-E-Rechnung-im-BSI/die-e-rechnung-im-bsi_node.html"]
title = "BSI  -  Die E-Rechnung im BSI"
full_description = 'Die E-Rechnung im BSI Inhaltsverzeichnis Allgemeine Informationen zur E-Rechnung im BSI Informationen zur Übermittlung von E-Rechnungen im BSI Hintergrundinformationen zur E-Rechnung Häufig gestellte Fragen (FAQ) Allgemeine Informationen zur E-Rechnung im BSI Das BSI ist in der Lage, elektronische Rechnungen (kurz E-Rechnungen) entgegenzunehmen und zu verarbeiten. Alles, was Sie für den elektronischen Rechnungsaustausch mit uns wissen müssen, ist nachfolgend beschrieben. Seit dem 27. November 2020 ist die elektronische Rechnungsstellung an die gesamte Bundesverwaltung verpflichtend. Ausnahmen von der Verpflichtung (beispielsweise im Falle von Direktaufträgen bis 1.000 € ohne USt) sind in § 3 Abs. 3 der E-Rechnungsverordnung (kurz E-RechV) geregelt. Wir bitten Sie, von der Möglichkeit einer elektronischen Rechnungsstellung Gebrauch zu machen, selbst wenn sie dazu nicht gesetzlich verpflichtet sein sollten. Als Rechnungssteller profitieren Sie von folgenden Vorteilen: effizientere Arbeitsabläufe, kürzere Durchlaufzeiten, schnellere Rechnungsbegleichungschneller und einfacher Zugriff auf RechnungsdatenErmöglichung einer digitalen und revisionssicheren ArchivierungKostenersparnis für Papier, Druck und Porto Bei Fragen zur elektronischen Abrechnung Ihres bestehenden Auftrags mit dem BSI wenden Sie sich bitte an: Rechnungen@bsi.bund.de Informationen zur Übermittlung von E-Rechnungen im BSI Die folgenden Hinweise richten sich an Rechnungssteller, die zur elektronischen Rechnungsstellung aufgefordert sind oder sich grundsätzlich mit dieser Thematik auseinandersetzen wollen. Weiterführende Informationen zu einzelnen Themen finden Sie unter den jeweiligen Verlinkungen. Schritt 1: Bin ich zur elektronischen Rechnungsstellung verpflichtet? Zunächst ist zu prüfen, ob eine Verpflichtung zur elektronischen Rechnungsstellung vorliegt. Ausnahmen von der Verpflichtung sind in der E-RechV geregelt. Zudem sind vertragliche Vereinbarungen zu berücksichtigen. Schritt 2: Auf welcher Plattform kann ich meine E-Rechnung an das BSI einreichen? Das BSI empfängt elektronische Rechnungen über die Zentrale Rechnungseingangsplattform des Bundes (ZRE). Die ZRE erreichen Sie unter xrechnung.bund.de. Schritt 3: Muss ich mich an der Rechnungseingangsplattform registrieren? Zur Verwendung der jeweiligen Plattform ist eine einmalige Registrierung erforderlich. Die Registrierung ist kostenfrei und muss unabhängig vom genutzten Übertragungsweg der E-Rechnung durchgeführt werden. Weitere Informationen zur Registrierung finden Sie hier. Bei technischen Fragen zur Rechnungseingangsplattform wenden Sie sich bitte an die Portalbetreiberin (Bundesdruckerei). Folgende E-Mail-Adresse für den Support ist dort für Rechnungssteller eingerichtet: sendersupport-xrechnung@bdr.de. Die Support-Hotline ist über die Rufnummer 030 / 25984436 werktags von Montag bis Freitag in der Zeit von 08:00 bis 16:00 Uhr (MEZ) erreichbar. Schritt 4: Über welche Kanäle kann ich eine elektronische Rechnung an das BSI versenden? Sofern eine Software zur elektronischen Rechnungsstellung genutzt wird, stehen in der Rechnungseingangsplattform folgende Übertragungskanäle zur Verfügung: Peppol, E-Mail, De-Mail sowie der manuelle Upload. Alternativ besteht die Möglichkeit, eine E-Rechnung über eine Weberfassung manuell zu erfassen und auf der Plattform einzureichen. Der vom Rechnungssteller präferierte Übertragungsweg ist vor dem Rechnungsversand auszuwählen. Übertragungskanal Peppol: Beim elektronischen Rechnungsaustausch mit dem BSI lautet die Peppol Participant-ID: 0204 991-07335-68 Schritt 5: Was geschieht nach Versand meiner Rechnung? Nach Einreichung Ihrer E-Rechnung auf den Rechnungseingangsplattformen findet eine sogenannte Validierung statt. Hierbei wird Ihre E-Rechnung auf die Erfüllung der formalen Anforderungen geprüft. Wenn die Prüfung erfolgreich abgeschlossen wurde, wird uns Ihre Rechnung zur Abholung auf der Plattform bereitgestellt. Nach der Bereitstellung können Sie den Status Ihrer E-Rechnung bis zur Abholung über die Plattformen eingesehen. Bei Bedarf kann eine automatische E-Mail-Benachrichtigung bei einem Statuswechsel der Rechnung eingerichtet werden. Inhalte einer E-Rechnung Eine elektronische Rechnung hat gemäß § 5 E-RechV neben den umsatzsteuerrechtlichen Rechnungsbestandteilen (vgl. hierzu § 14 UStG) mindestens folgende Angaben zu enthalten: Leitweg-Identifikationsnummer: 991-07335-68Zahlungsbedingungen oder alternativ das FälligkeitsdatumBankverbindungsdaten des Zahlungsempfängers De-Mail- bzw. E-Mail-Adresse des RechnungsstellersZusätzliche Angaben (Auftragsnummer) werden dem Rechnungssteller bei Beauftragung mitgeteilt. Bitte beachten Sie beim elektronischen Rechnungsaustausch mit dem BSI die folgenden Hinweise: RechnungsbestandteilDatenfeld Standard XRechnungAngabe des BSI für RechnungsstellerLeitweg Identifikationsnummer (Leitweg-ID)"Käuferreferenz" (BT-10)Es handelt sich um eine Pflichtangabe auf jeder Rechnung. Bitte geben Sie diese Leitweg-ID auf allen elektronischen Rechnungen an: 991-07335-68 Bestellnummer"Bestellreferenz" (BT-13)Bitte entnehmen Sie die zu verwendende Bestellreferenz (Auftragsnummer) stets dem Auftragsdokument. Ohne Angabe dieser Bestellreferenz kann die E-Rechnung durch das BSI abgelehnt werden.Lieferantennummer"Lieferantennummer" (BT-29)Eine Lieferantennummer wird für die Rechnungsbearbeitung nicht benötigt.Anforderungen an das Rechnungsformat Für die Ausstellung von elektronischen Rechnungen an die Bundesverwaltung ist grundsätzlich der Standard XRechnung in der jeweils gültigen Fassung zu verwenden. Zusätzlich kann jeder andere Standard (z. B. ZUGFeRD ab Version 2.2 im Profil XRECHNUNG als rein strukturierte XML-Datei) verwendet werden, wenn dieser den Anforderungen der europäischen Norm für die elektronische Rechnungsstellung (EN-16931), der E-RechV und den Nutzungsbedingungen der Rechnungseingangsplattformen entspricht. Rechnungsformate, die nicht den Anforderungen der europäischen Norm entsprechen, können nicht berücksichtigt werden. Weiterführende Informationen sowie die jeweils gültige Version zum Standard XRechnung finden Sie bei der Koordinierungsstelle für IT-Standards (KoSIT) unter https://www.xoev.de/xrechnung-16828. Informationen zu rechnungsbegründenden Unterlagen Rechnungsbegründende Unterlagen bzw. Anlagen sind in den Rechnungsdatensatz einzubetten und dürfen nicht als Anhang einer E-Mail oder De-Mail versendet werden. Die maximal zulässige Größe einer Rechnung ist abhängig vom gewählten Übertragungskanal (bspw. 10 MB bei E-Mailanhängen oder 11 MB bei Anhängen in der Weberfassung). Bitte beachten Sie die Nutzungsbedingungen der Plattform. Die maximale Anzahl der eingebetteten rechnungsbegründenden Dokumente ist auf 200 beschränkt. Zugelassene Dateitypen der eingebetteten Dokumente sind: „png“, „pdf“, „jpg“, „jpeg“, „xlsx“, „ods“ und „csv“. Anlagen dürfen keine aktiven Inhalte (bspw. Makros) enthalten. Änderungen an diesen Beschränkungen werden über die Rechnungseingangsplattform bekannt gegeben. Unberührt von den vorstehenden Regelungen bleiben Rechnungsbelege mit Anlagen, die nach anderen Rechtsvorschriften einer papiergebundenen Versandart bedürfen (Ausfuhrnachweise, Zolldokumente o. Ä.). Zentrale Informationsseite der E-Rechnung im Bund Weitere grundlegende Informationen zur elektronischen Rechnungsstellung finden Sie auf der zentralen E-Rechnungswebseite des Bundes: https://www.e-rechnung-bund.de/. Webseite Koordinierungsstelle für IT-Standards (KoSIT) Weiterführende Informationen sowie die jeweils gültige Version zum Standard XRechnung finden Sie bei der KoSIT unter: https://www.xoev.de/xrechnung-16828. Hintergrundinformationen zur E-Rechnung Die E-Rechnungsverordnung des Bundes verpflichtet die öffentliche Verwaltung im Rahmen von öffentlichen Aufträgen zum Empfang von elektronischen Rechnungen. Ebenso sind die Lieferanten und Dienstleister des Bundes zum Versand von elektronischen Rechnungen verpflichtet. Die E-RechV regelt die Fristen, die Übertragungswege, den Datenstandard sowie die Ausnahmen des elektronischen Rechnungsaustauschs. Link zur E-RechV: https://www.e-rechnung-bund.de/wp-content/uploads/2020/07/e-rechnungsverordnung_20171013.pdf Verbindlichkeit der elektronischen Form (§ 3 E-RechV) Grundsätzlich gilt die Verpflichtung zur elektronischen Rechnungsstellung an den Bund seit dem 27.11.2020. Die Ausnahmen werden in der Verordnung geregelt: Rechnungen, die nach Erfüllung eines Direktauftrags bis zu einem Betrag von 1.000 € gestellt werdenRechnungen, die den Ausnahmeregelungen nach § 8 oder § 9 E-RechV unterfallen (geheimhaltungsbedürftige Rechnungsdaten sowie Angelegenheiten des Auswärtigen Dienstes und der sonstigen Beschaffungen im Ausland)Rechnungen, die in Verfahren der Organleihe nach § 159 Absatz 1 Nummer 5 des Gesetzes gegen Wettbewerbsbeschränkungen auszustellen sind Unabhängig von der gesetzlichen Verpflichtung kann sich eine Pflicht zur Einreichung von E-Rechnungen auch aus dem jeweilig zugrundeliegenden Auftrags- bzw. Vertragsverhältnis ergeben. Anforderungen an das Rechnungsdatenmodell und an die Übermittlung (§ 4 E-RechV) Um europaweit einen einheitlichen technischen Standard für die E-Rechnung zu etablieren, wurde seitens der EU eine Norm (CEN 16931) für das Datenformat zur elektronischen Rechnungsstellung entwickelt. Diese Norm legt ein Datenmodell für die Struktur und den Inhalt von elektronischen Rechnungen als Standard fest. In Deutschland soll grundsätzlich der Datenaustauschstandard XRechnung verwendet werden, der auf der europäischen CEN-Norm basiert. Zudem ist die E-Rechnung über ein zentrales Portal des Bundes einzureichen. Inhalt der elektronischen Rechnung (§ 5 E-RechV) 1. Die elektronische Rechnung hat neben den umsatzsteuerrechtlichen Rechnungsbestandteilen mindestens folgende Angaben zu enthalten: eine Leitweg-Identifikationsnummerdie Bankverbindungsdatendie Zahlungsbedingungen De-Mail-Adresse oder eine E-Mail-Adresse des Rechnungsstellers 2. Die elektronische Rechnung hat zusätzlich zu den Angaben nach Absatz 1 folgende Angaben zu enthalten, wenn diese dem Rechnungssteller bereits bei Beauftragung übermittelt wurden: die Lieferantennummereine Bestellnummer Häufig gestellte Fragen (FAQ) Wie kann die E-Rechnung im Standard XRechnung erstellt werden? Grundsätzlich gibt es vier Möglichkeiten, um eine E-Rechnung im Standard XRechnung zu erstellen: Sie nutzen Dienstleister und Rechnungsnetzwerke, d. h., Sie haben die Rechnungserstellung an externe Dienstleister ausgelagert.Sie nutzen das Web-Portal der zentralen Rechnungseingangsplattformen des Bundes (ZRE und OZG-RE), d. h., Sie erstellen eine Rechnung manuell und senden direkt aus dem Portal.Ihr System bietet die Erstellung und/oder Übermittlung der E-Rechnung im Standard XRechnung (zukünftig) an. D. h., Sie können E-Rechnungen direkt aus Ihrer Buchhaltungssoftware generieren und im Idealfall auch senden. Viele Systeme beinhalten die Umwandlung einer Rechnung in den Standard XRechnung bereits.Sie setzen die Erstellung einer E-Rechnung im Standard XRechnung in Ihren Systemen selbst um und entscheiden sich für einen Übertragungskanal. Sollte Ihr System über keine Funktion der Umwandlung in den Standard XRechnung verfügen, können Sie sich verschiedenster Programme anderer Dienstleister bedienen, die sich auf die Umwandlung von Rechnungsdatensätzen in XRechnung spezialisiert haben. Diese fungieren als Zwischenschritt zwischen der Erstellung einer Rechnung in Ihrer eigenen Buchhaltungssoftware und der Einreichung einer elektronischen Rechnung im Standard XRechnung bei der ZRE oder OZG-RE. Alternativ können Sie diese Schnittstelle selbst programmieren (lassen). Unterstützung für die technische Umsetzung des Standards XRechnung in Ihren Systemen können Sie auf den Webseiten der KoSIT erhalten. Was ist eine Leitweg-ID und wo erhalte ich Informationen darüber? Um eine elektronische Rechnung an den Rechnungsempfänger adressieren zu können, muss dieser eindeutig identifizierbar sein. Die Leitweg-ID ermöglicht eine elektronische Adressierung und Weiterleitung der E-Rechnung durch die Zentralen Rechnungseingangsplattformen des Bundes an die angeschlossenen ERP- bzw. Freigabesysteme der Behörden der Bundesverwaltung. Die Leitweg-ID wird im Standard XRechnung im Feld “Käuferreferenz” (BT-10) angegeben und muss als Pflichtangabe auf jeder E-Rechnung übermittelt werden. Die Leitweg-ID des BSI wird Ihnen bei der Auftragserteilung im Auftrag mitgeteilt. Als Rechnungssteller brauchen sie keine eigene Leitweg-ID. Wie kann der XRechnungsdatensatz visualisiert werden? Üblicherweise wird die Visualisierung des XML-Datensatzes innerhalb des (ERP-)Systems vorgenommen. Die KoSIT bietet ebenfalls eine entsprechende Entwicklungsressource zur Visualisierung an. Die Komponenten zur Unterstützung der Visualisierung innerhalb eines Systems sind öffentlich im XRechnungs-GitHub verfügbar. Muss der Standard XRechnung für die Ausstellung von E-Rechnungen an die Bundesverwaltung verwenden werden? Für die Ausstellung von elektronischen Rechnungen an die Bundesverwaltung ist grundsätzlich der Standard XRechnung in der jeweils aktuellen Fassung zu verwenden. Zusätzlich kann jeder andere Standard (z. B. ZUGFeRD ab 2.2 Profil XRechnung als rein strukturierte XML-Datei) verwendet werden, wenn dieser den Anforderungen der europäischen Norm für die elektronische Rechnungsstellung (EN-16931), der E-Rechnungsverordnung des Bundes (E-RechV) und den Nutzungsbedingungen der Rechnungseingangsplattformen des Bundes entspricht. Wofür steht die Bezeichnung XRechnung? XRechnung bezeichnet den Standard zur elektronischen Rechnungsstellung bei öffentlichen Auftraggebern und setzt die Richtlinie 2014/55/EU in Deutschland um. Der Standard XRechnung wird von der KoSIT (Koordinierungsstelle für IT-Standards) im Auftrag des IT-Planungsrats betrieben. Ferner koordiniert die KoSIT die Weiterentwicklung des Standards XRechnung unter Einbezug von Expertinnen und Experten aus Bund, Ländern und Kommunen. Was ist eine elektronische Rechnung (E-Rechnung)? Eine E-Rechnung im Sinne der EU-Norm ist keine eingescannte Papier- oder PDF-Rechnung, sondern eine in einem strukturierten Format ausgestellte Rechnung, die elektronisch übermittelt und empfangen wird sowie eine automatische Verarbeitung ohne Medienbrüche ermöglicht. Die E-Rechnung basiert auf einem XML-Datenformat, das in erster Linie der maschinellen Verarbeitung dient und sich nicht ohne Weiteres für eine manuelle Sichtprüfung eignet. Die elektronische Rechnungsstellung kann über verschiedene Standards bzw. Spezifikationen ermöglicht werden, darunter z. B. im Standard XRechnung (§ 3 E E-RechV). Ähnliche Themen Pres­se Me­dia­thek Pu­bli­ka­tio­nen Newslet­ter und So­ci­al Me­dia Ver­an­stal­tun­gen Ver­ga­ben an Ex­ter­ne Kos­ten für Leis­tun­gen des BSI Kon­takt Fra­gen & Ant­wor­ten Zurück zu Bundesamt für Sicherheit in der Informationstechnik Kurz-URL: https://www.bsi.bund.de/dok/14709852'
