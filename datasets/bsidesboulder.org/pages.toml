["https://bsidesboulder.org/archive/2022/2022-event"]
title = "[Archive] 2022 Event - BSides Boulder"
description = """
Youtube of the Event
Speakers
Sponsors
Talks
Included for History 2022 Day of Event Page NOTE: we are continually adding more information to this page in preparation for our June 4th event.
Location and times BSides Boulder 2022 will be held at the Wolf Law Building of the University of Colorado’s Law School. If you’re trying to plug that into a maps app, the specific address is 2450 Kittredge Loop Drive, Boulder, CO 80305."""
full_description = "[Archive] 2022 EventYoutube of the EventSpeakersSponsorsTalksIncluded for History2022 Day of Event Page NOTE: we are continually adding more information to this page in preparation for our June 4th event.Location and timesBSides Boulder 2022 will be held at the Wolf Law Building of the University of Colorado’s Law School. If you’re trying to plug that into a maps app, the specific address is 2450 Kittredge Loop Drive, Boulder, CO 80305.The conference will run from 9:15am - 4:30pm on Saturday, June 4th, 2022. Doors open at 8:30am.Registration (physical and virtual)You can register for BSides Boulder on Eventbrite any time before 11:59pm on Friday, June 3rd. You can also register in-person on the day of the event using PayPal.If you are planning on attending BSides virtually, you don’t have to register, but you’ll still want to join our Discord. You can find more information on our virtual event page.Check-inDoors to the event open at 8:30am. We will initially be performing check-ins and on-site registrations on the bottom floor of Wolf Law, just inside of the front doors. If you are planning on arriving late, please note that check-in and registration may move to the second floor later in the day.If you registered online, please bring a physical or digital copy of your Eventbrite ticket. You should have received an email when you purchased your ticket; we will be using these to verify registrations on-site.DiscordIf you are attending the physical component of the event you are not required to sign up for the BSides Boulder Discord. However, we will be using it to give live updates throughout the event and notify everyone when talks are about to start, so you may find it convenient to join.You can use the following invite link to join: https://discord.gg/xVPfmc66ScheduleFor an exact list of events, you can check our schedule page.TalksThe morning session of talks will run from 9:30am - 12:30pm, and the afternoon session runs from 1:30pm - 4:30pm. For a list of all of the talks and their summaries, visit our talks page.LunchLunch will go from 12:30pm - 1:20pm. Lunch will be catered by Snarf’s Sandwiches for those attending the physical event. If you have dietary restrictions, we will have some vegetarian, vegan, and gluten-free options.ParkingIf you are planning on taking your car to BSides, there are multiple parking lots near the law school and off-campus that you can use to park. You can either pay for a spot using the ParkMobile app when you arrive, or you can buy a full-day permit for Lot 402 in advance at: https://cuboulder.pmreserve.comMap of the parking lots around the eventContacting the organizersIf you need to contact the organizers during or after the event, you can do one of the following:During the event, the organizers and volunteers will be walking around with special nametags to identify ourselves.You can send us an email at info@bsidesboulder.org. You can also contact us through our Discord channel; all of the organizers have the Admin role and have [ADMIN] in front of their handles."
year_published = 2025
clearnet = "https://bsidesboulder.org/archive/2022/2022-event"
