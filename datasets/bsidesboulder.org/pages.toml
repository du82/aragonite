full_description = "[Archive] 2023 EventSpeakersSchedulesSponsorsIncluded for HistoryRegistrationYou can register for BSides Boulder on Eventbrite any time before 11:59pm on Thursday, June 22nd. We will also accept additional in-person registrations up to our attendee limit (100 people).Registration is $10 for students and $20 for everyone else.Back to topLocation and timesBSides Boulder 2023 will be held at the Wolf Law Building of the University of Colorado’s Law School. If you’re trying to plug that into a maps app, the specific address is 2450 Kittredge Loop Drive, Boulder, CO 80305.The conference will run from 9:20am - 4:30pm on Friday, June 23rd, 2023. Doors open at 8:30am.Back to topWorkshopFor our 2023 event, we are hosting a workshop on detection tooling! You can find more information in our workshop announcement. Sign up through Eventbrite or on the day of the event (as space allows).ScheduleFor an exact list of events, you can check our schedule page.TalksThe morning session of talks will run from 9:30am - 12:30pm, and the afternoon session runs from 1:30pm - 4:30pm.LunchLunch will go from 12:30pm - 1:20pm. Lunch will be catered by Snarf’s Sandwiches for those attending the physical event. If you have dietary restrictions, we will have some vegetarian, vegan, and gluten-free options.WorkshopThe workshop runs concurrently with all of the talks after the first talk. It is split into a morning session that runs from 10:30am - 12:30pm, and an afternoon session running from 1:30pm - 4:30pm.ParkingIf you are planning on taking your car to BSides, there are multiple parking lots near the law school and off-campus that you can use to park. You can either pay for a spot using the ParkMobile app when you arrive, or you can buy a full-day permit for Lot 402 in advance at: https://cuboulder.pmreserve.com"
