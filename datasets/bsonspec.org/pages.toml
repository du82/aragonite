["https://bsonspec.org/implementations.html"]
title = "BSON (Binary JSON): Implementations"
full_description = "Implementations of BSON exist for many different programming languages. Some implementations are currently embedded within MongoDB drivers, since MongoDB was the first large project to make use of BSON. Over time those libraries will be made more stand-alone, but they should be usable independently of MongoDB in their current state. assemblyscript-bson - BSON encoder / decoder library written in AssemblyScript, compiles to WebAssembly. Can be used to enable transfer of complex objects between JavaScript and WebAssembly. Originally written to support smart contract development in WebAssembly. libbson - A library providing useful routines related to building, parsing, and iterating BSON documents. Used by the cross-platform libmongoc client library that provides a base for MongoDB drivers in higher-level languages. Mongo-GLib - A library written in C to communicate with the MongoDB database in an asynchronous fashion. Even though the library is written in C, it can be used from higher level libraries such as Python and JavaScript through the use of GObject introspection. The MongoDB C++ Driver Library - The official MongoDB C++ driver includes a robust and well tested BSON implementation. You can use just the BSON portion of the driver library if desired. github.com/jbenet/bson-cpp - A standalone C++ BSON implementation forked from the MongoDB C++ driver, with the non-BSON code pruned away. github.com/dwight/bson-cxx - Yet another C++ BSON implementation originating from the MongoDB C++ driver. Non-BSON code was eliminated, Endian-awareness was added, and some attempts were made to simplify the interface. JSON for Modern C++ - A library to make JSON a first-class data type in C++ which can read and write a subset of BSON that can map to JSON. jsoncons - A C++ header-only library for constructing JSON and JSON-like data formats including BSON, supports encode/decode of BSON byte string. reflect-cpp - A C++-20 library that provides a unified reflection-based interface for various serialization formats, including BSON."
year_published = 2025
