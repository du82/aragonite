title = "BSON (Binary JSON): Specification"
full_description = "BSON is a binary format in which zero or more ordered key/value pairs are stored as a single entity. We call this entity a document. The following grammar specifies version 1.1 of the BSON standard. We've written the grammar using a pseudo-BNF syntax. Valid BSON data is represented by the document non-terminal. The following basic types are used as terminals in the rest of the grammar. Each type must be serialized in little-endian format. The following specifies the rest of the BSON grammar. Note that we use the * operator as shorthand for repetition (e.g. (byte*2) is byte byte). When used as a unary operator, * means that the repetition can occur 0 or more times."
