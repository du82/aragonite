["https://bsonspec.org/faq.html"]
title = "BSON (Binary JSON): FAQ"
full_description = '''BSON is designed to be efficient in space, but in some cases is not much more efficient than JSON. In some cases BSON uses even more space than JSON. The reason for this is another of the BSON design goals: traversability. BSON adds some "extra" information to documents, like length of strings and subobjects. This makes traversal faster. BSON is also designed to be fast to encode and decode. For example, integers are stored as 32 (or 64) bit integers, so they don't need to be parsed to and from text. This uses more space than JSON for small integers, but is much faster to parse. In addition to compactness, BSON adds additional data types unavailable in JSON, notably the BinData and Date data types. The best way to contribute to this site is to fork the bsonspec.org project on GitHub and submit a pull request. The following are some example documents (in JavaScript / Python style syntax) and their corresponding BSON representations.'''
year_published = 2025
