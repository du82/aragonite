["https://buffered.io/posts/shortcuts-windows"]
title = "Shortcuts: Windows · OJ Reeves"
description = "This is the first of a collection of posts that I’m going to be making about shortcuts in applications. I’m constantly on the lookout for keyboard shortcuts to aid in improving the speed of my day to day activities, and I thought it’d be a good idea to start sharing them with you. These posts will probably get edited a few times over the course of their lives as I find more shortcuts :)"
full_description = 'Shortcuts: Windows Published 2007-02-10 by OJ Reeves Read time: 4 min This is the first of a collection of posts that I’m going to be making about shortcuts in applications. I’m constantly on the lookout for keyboard shortcuts to aid in improving the speed of my day to day activities, and I thought it’d be a good idea to start sharing them with you. These posts will probably get edited a few times over the course of their lives as I find more shortcuts :) Below is a list of shortcuts that I use for generally getting around Windows. Note that when I refer to the WIN key I am referring to the Windows/Start key that lies between CTRL and ALT on the keyboard. Most of these shortcuts will work regardless of the application you’re currently using as these shortcuts are ‘unwritten laws’. Some of these are pretty obvious, but I’ll stick them in anyway. Some of them might be XP specific, but most of them will work regardless of the Windows version. WIN + E - Open a new Windows File Explorer window. WIN + R - Open the ‘Run’ dialog. WIN + F - Open a new Windows Search/Find window. WIN + U - Open the Utility Manager (most people don’t even know this exists!). WIN + M - Minimise all windows. WIN + SHIFT + M - Restore all windows to the state they were in before pressing WIN + M. WIN + D - Toggles minimise/restore in the same way that WIN + M and WIN + SHIFT + M do. WIN + Pause/Break - Open the System Properties dialog. WIN + L - Lock the workstation. CTRL + ALT + DEL - If logged in to your machine as a domain user, this will bring up a user options dialog which allows you to change password, lock workstation, etc. If logged into a home machine that is not part of a domain this will invoke the Windows Task Manager. CTRL + ESC - Open the Start menu (handy for those without a Windows key). CTRL + SHIFT + ESC - Open the Windows Task Manager. ALT + TAB - Cycle through applications. ALT + SHIFT + TAB - Cycle through applications in the other direction. CTRL + TAB - Cycle through any tabs in the current application (eg. Firefox). CTRL + SHIFT + TAB - Cycle through any tabs in the current application in the other direction. ALT + SPACE + N - Minimise the current window. ALT + SPACE + X - Maximise the current window. ALT + SPACE + M - Move the current window. CTRL + F4 - Close the current document/tab. ALT + F4 - Close the current application. CTRL + C - Copy the current folder/file/text/image/etc to the clipboard. CTRL + X - Cut the current folder/file/text/image/etc to the clipboard. CTRL + V - Paste the current folder/file/text/image/etc from the clipboard. CTRL + Z - Undo. CTRL + Y - Redo. Print Scrn - Take a screenshot of the entire desktop (including open Windows) and store it on the clipboard. ALT + Print Scrn - Take a screenshot of the current window. Now we’re past the shortcuts, I’d also like to show you some of the other commands that I frequently punch into the ‘Run’ dialog (WIN + R) to quickly launch to applications instead of using the Start menu. services.msc - Open the Windows Services dialog. compmgmt.msc - Open the Computer Management dialog. This is great as it has all the bits that you need to manage your machine, such as IIS, Services, Security, etc. eventvwr - Open the Windows Event Log viewer. iisreset - Reset IIS (if you have it installed). cmd - Open a command prompt. msconfig - Open the System Configuration Utility. calc - Open the Windows Calculator. notepad - See if you can figure this one out yourself ;). drive:\path\to\folder - Open a Windows File Explorer window at the specified location. mspaint - Open MS Paint for quick creation of images files from screen captures. There the ones I can think of at the moment, if I think of some more I’ll add them. Please give me a shout if you use one that I haven’t mentioned! Twitter Facebook Google+'
