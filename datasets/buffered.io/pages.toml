["https://buffered.io/posts/virtual-vista-stuff-up"]
title = "Virtual Vista Stuff-Up · OJ Reeves"
description = "OK, so it looks like I might have been misinformed (er… wrong :)) by stating that the basic versions of Vista can’t be installed on VMs. That’ll teach me not to read the licencing details properly myself! It looks like it was a slight misunderstanding of the terms and structure that MS used in stating the rules. I won’t go into the details myself since Ed Bott has already done it for me."
full_description = "Virtual Vista Stuff-Up Published 2006-10-17 by OJ Reeves Read time: 2 min OK, so it looks like I might have been misinformed (er… wrong :)) by stating that the basic versions of Vista can’t be installed on VMs. That’ll teach me not to read the licencing details properly myself! It looks like it was a slight misunderstanding of the terms and structure that MS used in stating the rules. I won’t go into the details myself since Ed Bott has already done it for me. So, MS haven’t shot themselves in the foot in this regard, but they still seem to be doing it in other ways. One of those ways, which is now 100% confirmed, is that you can only move your installation of Vista to a different machine (read: different hardware) once and once only. Again, this is confirmed courtesty of Ed Bott. Instead of being able to reinstall when you buy a new mobo, and then reinstall again after you buy a new CPU, you may well have to fork out for another Vista licence due to the hardware change. What a lovely feature! Yesterday’s chat (via previous post on Vista) with Bryce got me thinking about what other peoples’ thoughts were regarding the whole stance MS are taking with Vista, and during my searches I found this post by Chris Pirillo (a long-time MS user) which covers his views on said topic. It’s quite an interesting read :) He also took a bit of time to post on his blog after writing the article to cover some other points, again well worth reading. It’s good to see another long-term MS user with the balls to speak out loud and say that Macs are becoming more appealing by the day. I agree with him when he says that MS isn’t really making this a difficult decision to make. I’ve never been a huge fan of Macs, partly because I never had to use them and Windows was familiar, but as time goes by I’m rethinking my position. I keep saying that there’s not enough software out there for me to make the move to Mac (and Linux), but not I’m thinking that I need to make the switch and become one of the developers that can help sort that problem out :D So, sorry about my stuff up, but it doesn’t really improve my view of Vista by much anyway! Twitter Facebook Google+"
