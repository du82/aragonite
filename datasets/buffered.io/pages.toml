["https://buffered.io/posts/bfpg-june-meetup"]
title = "BFPG June Meetup · OJ Reeves"
description = """
The time has come for another meeting of the Functional Programming minds! This months BFPG Meetup, starting 6pm Monday 28th, is the first one at our new venue: Microsoft HQ, Waterfront Place, Brisbane. For details on the location, take a look at the BFPG about page.
This month we have three speakers, and I am one of them! In my talk, “Erlang - Why should you care?”, I will be giving a fairly non-technical introduction to Erlang."""
full_description = "BFPG June Meetup Published 2010-06-25 by OJ Reeves Read time: 2 min The time has come for another meeting of the Functional Programming minds! This months BFPG Meetup, starting 6pm Monday 28th, is the first one at our new venue: Microsoft HQ, Waterfront Place, Brisbane. For details on the location, take a look at the BFPG about page. This month we have three speakers, and I am one of them! In my talk, “Erlang - Why should you care?”, I will be giving a fairly non-technical introduction to Erlang. I’ll be covering off the features of the language, some of its design goals and its history. I aiming to show that this language is not one that was spawned out of academia and that it has been applied in the real-world ever since its conception. If I have time, I’ll also be giving a small demonstration of one of the neatest features of the technology. I’ll be posting the slides and demonstration code here on this blog as well as BFPG’s home after the meetup has taken place. Myself and my comrades, Tom and Tony, will aim to provide a fun and interesting evening at our new venue. Based on the RSVPs so far, it looks like we are going to have one of the biggest turn-outs to date. This is probably due to the exposure we got during last month’s talk by Dave Thomas. There are still plenty of spots left, so if you’re keen to come along, go and sign up. Bring your friends, your friend’s friends and your mum. I hope to see you there! Update (6th July 2010): We had a fantastic turn-out of just short of 50 people (a record breaker for the group so far!). My talk seemed to be fairly well-received. No rotten tomatoes were thrown and the crowd seemed engaged through most of the talk. It felt good! I think many people wanted to see more code, but since that wasn’t the focus of the talk they were a little disappointed. If people are keen for more Erlang goodness at future meetups, then I’ll be happy to dive a little deeper. Here’s a video of my talk: OJ Reeves - Erlang - Why Should You Care. As promised, here are the slides: PPTX PDF (Google Docs) PPT (Google Docs)If you have issues reading the slide deck, or would like it in another format, then please drop me a line. Tagged: Functional Programming, bfpg, meetup Twitter Facebook Google+"
