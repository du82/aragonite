["https://buffered.io/posts/3-months-of-meterpreter"]
title = "3 Months of Meterpreter · OJ Reeves"
description = """
In August this year I was fortunate enough to land a three-month contract working with the awesome people at Rapid7. The job: make Meterpreter more awesome on Windows. That’s right more awesome than it already is. Tough gig, but what an amazing opportunity!

Those three months have already come and gone, and what a ride it has been. In this post I would like to detail some of the work that has gone into Meterpreter, and Metasploit too, with a goal of helping others understand what it does and how it works. Ultimately, I’d love to start seeing some contributions from the community now that it’s substantially easier to build.

So, in a semi-chronological-semi-ad-hoc order, here’s how Meterpreter has evolved."""
full_description = "3 Months of Meterpreter Published 2013-12-27 by OJ Reeves Read time: 49 min In August this year I was fortunate enough to land a three-month contract working with the awesome people at Rapid7. The job: make Meterpreter more awesome on Windows. That’s right more awesome than it already is. Tough gig, but what an amazing opportunity! Those three months have already come and gone, and what a ride it has been. In this post I would like to detail some of the work that has gone into Meterpreter, and Metasploit too, with a goal of helping others understand what it does and how it works. Ultimately, I’d love to start seeing some contributions from the community now that it’s substantially easier to build. So, in a semi-chronological-semi-ad-hoc order, here’s how Meterpreter has evolved. TL;DR This post is long. So if you’re keen to see a nice summary, you should go and read the wicked post over at Security Street which gives a great summary of what’s in this post. Thanks to the rather classy Tod Beardsley for serving this baby up! A Whole New Build Environment Getting contributions from the Open Source community can be tricky enough, even when your build is clean and your development environment is very easy to get up and running. In the case of Meterpreter, neither of these things were true and hence anyone looking to contribute had to first negotiate the gauntlet of getting a functioning build environment configured. My first task was to fix these problems. The immediate goal was to update the source so that it could be built with Visual C++ Express edition. The Express editions of Microsoft’s tools are free to download and use, and hence it would enable those who don’t have a paid version of Visual Studio to build Meterpreter. With that I embarked on the relatively simple job of updating projects, solutions and some areas of the source code. When I started this work, Visual Studio 2012 was the current version and hence that was the target to support. One of my first pull requests to the Meterpreter repository was this upgrade, and thankfully it was very well received. Then in typical fashion, just a couple of weeks after this work, Microsoft decides to release Visual Studio 2013! At first I didn’t consider going through the upgrade process, but soon after I thought it best that the effort was made to bring our toolset up to the bleeding edge and the rest of the team agreed. So no long after, a new pull request was submitted that brought things up to the latest and greatest. Clean Command Line Builds When I first tackled the Meterpreter build I saw two things that were just a little off-putting: There was one component, ext_server_sniffer, which wouldn’t build out of the box because of a missing dependency. This dependency, the packet sniffer SDK, is one that’s available to Rapid7 employees only, due to licensing restrictions on the code. With this dependency missing, the build would finish with errors. There were lots of warnings generated by the C++ compiler even when the build succeeded without errors. This was particularly bad in the case of the 64-bit build, for obvious reasons. There was no way of building everything from the command line; it had to be built from within Visual Studio. This meant that having the build run under the context of something like Jenkins wasn’t possible. I wanted to see these things go away so that all future contributors would see 0 errors and 0 warnings when the build completed. Needless to say, removing all the warnings wasn’t a task that could be done overnight, but the error was definitely one that could be done. I decided to solve the problem of the missing component by having different configurations baked into the projects. Meterpreter’s solution contains the usual Release and Debug configurations that everyone is used to. It now also contains two new configurations called r7_released and r7_debug. The former two build all the projects except for the ext_server_sniffer extension, while the latter two include it. Anyone who works for Rapid7, that has access to the proprietary packet sniffer SDK, would be able to use the configurations prefixed with r7_. All other contributors would be able to use the configurations they’re used to using. This does come with a little bit of confusion for the developer as they need to build with the correct configuration, but this is a small issue that can (and has) been fixed with documentation. On the plus side, the command line build script is in the fortunate position of being able to detect the presence of the dependencies and choose which configuration to run. This means that it never results in an error. So after a few weeks and lots of commits, I took the plunge and finalised the last of the issues with warnings, passed on a pull request which the legendary Juan landed, resulting in this … Clean builds make for a happy OJ. And with that locked in, it was decided by the team that “Treat warnings as errors” would be turned on for each of the projetcs so that any future warnings would result in failed builds. This now helps us keep the build clean. With all this in place, we’re also able to constantly run CI builds for Meterpreter when commits are made to master and when pull requests come in. This is really helping us keep things clean and gives us much quicker feedback on what might be wrong with the source base. Bug Fixes There are a few worthy mentions from the bug fix department that I’d like to share with you. 64-bit Pointer Truncation In some scenarios, on a 64-bit version of Windows, migration of Meterpreter would sometimes result in the session terminating unexpectedly. This rather intimidating bug was the first I attempted to fix when I joined the project, and I documented the analysis and resolution in a previous blog post, so if you’re interested in the detail please have a read of that article. If you’re too lazy, the TL;DR version is that 64-bit pointers were being truncated to 32-bit as a result of a bad function pointer type declaration. This wasn’t an issue until recently because it appears that new versions of ASLR have just started allocating above the 4GB boundary. Crashy Meterpreter with MS08-067 Penetration testers all around the world have fallen in love with MS08-067, and rightly so. It has proved to be a very reliable exploit and has served the industry well. So imagine the dismay that some testers experienced when using the Meterpreter payload with this exploit on Windows XP (without any service packs) and seeing their session crash on startup. Horrible. The reason for this was due to Meterpreter attempting to enumerate NICs on the target box when first setting itself up. In Windows XP SP1 and onwards, certain parts of the Windows API had changed to allow for easier gathering of certain bits of information. Prior to this, it wasn’t so easy. Bear in mind that Meterpreter doesn’t really know anything about the system that it’s running on so it attempts to figure it out as it goes. In this particular case it failed to properly detect the host operating system’s capabilities and attempted to read invalid areas of memory. After much investigation, and a great deal of help from Juan (again, who is legendary, I’m not sure if I mentioned that), we landed a fix for the problem, and there was much rejoicing. Multi-call Railgun failures The glory of Railgun was slightly tarnished by a not-so-stable multi-call function which was causing crashes in Meterpreter sessions. A slight tweak of the code on both the Meterpreter side and the Metasploit side resulted in this problem going away and allowing other modules to make better use of Railgun through a lower number of calls. Less chatty comms can only be a good thing. Sniffer Extension Fixes The ext_server_sniffer extension suffered from a bit of 64-bit hate. It had on a number of occasions crashed sessions under 64-bit and failed to run completely on newer versions of Windows. Some rework of the packet sniffer SDK, along with rebuilding binaries using the new toolchain, resulted in both of these problems disappearing. Deadly Webcam Snapshots A much-loved feature of Meterpreter is it’s ability to take a snapshots from an attached webcam and download them to the attacker’s machine. This nifty feature could sometimes result in crashy sessions, and nobody likes crashy sessions. The reason this was happening was because of the way that webcam capture was implemented combined with the mechanism that Meterpreter uses to manage command execution. Each command that is executed in the context of Meterpreter is run on a separate thread. There are a few reasons for this which we won’t go into now, but bear this mind while we dive into the webcam snapshot implementation. Webcam interaction is controlled using three functions: Starting the webcam using stdapi.webcam.webcam_start. Capturing a frame from the webcam using stdapi.webcam.webcam_get_frame. Stopping the webcam using stdapi.webcam.webcam_stop. When the camera is “started”, Meterpreter fires up COM and uses a set of interfaces to manage camera initialisation and interaction. When the camera is stopped, these interface instances are destroyed and COM is shut down. The problem here is that COM needs to be initialised and shutdown on the same thread, and given that each command is executed on separate threads, COM got upset and sometimes died. The problem wasn’t consistent, in that it worked on quite a few platforms and cameras, but not on others. I was only able to reproduce the problem with one camera on Vista x86. The solution was simple: we now have a separate thread of execution that we use to do all the webcam-related work on. Since this fix has been put in place we haven’t seen any more webcam-related crashes on Windows! Meterpreter not Shutting Down When Meterpreter is launched from an executable generated using msfpayload, the exit command would fail to actually terminate the process. This is obviously a bad thing as far as forensics goes, as leaving running processes behind leaves evidence of exploitation. This bug has been half fixed. That is, the reverse_tcp and bind_tcp payloads now exit cleanly, but the reverse_http and reverse_https payloads still need work (we will get them fixed though). Lots of work had to go into finding a cleaner shutdown process from within Meterpreter, and that is covered in the “Engine Room Improvements” section of this post. The rest falls under the category of “how do we fix the payloads”, which will have to come in a later post once we’ve solved the issue. Unstable Channels You might not know this, but every time you type shell into a Meterpreter prompt, you’re opening a channel. When you download a file, you open a channel. Almost everything you do when you interact with Meterpreter results in a channel being opened. In some cases, such as when using shell, the channel persists for an extended period of time. Pressing CTRL+Z allows you to put such a channel into the background so that you can continue working with other Meterpreter features, after which you can bring the channel back into the foreground using the channels command. Well, that’s how it was supposed to work, but this was broken on both Windows and POSIX builds of Metepreter. The work required to fix this was quite in-depth, and hence is covered in the “Engine Room Improvements” section of this post. Engine Room Improvements Changes have come through in many forms from cosmetic to major heart surgery. This section covers some of the more gory details from the latter of these two categories. Improved Security The last thing that we’d like to have happen to a Meterpreter use is for them to be owned by the victim during an attack. While this might be rather implausible, we decided to run through the source and make a point of addressing any potentially risky function calls. Prime candidates for refactoring include functions such as strcpy, the Honey Badger of the C standard library. We cleaned up a great deal of those in a single pull request and on the whole Meterpreter became much more trustworthy. Command Dispatcher Surgery The notion of a “command” won’t be new to anyone who has used Meterpreter before. Simply, a command is the context of a single instance of execution. It can wrap up a simple request/response call, such as getpid, which allows for execution of commands on the victim’s machine. No rocket science there. However, the implementation of the command mechanism had one limitation that forced a couple of issues to bubble to the surface: Every single command invoked in Meterpreter is executed on a separate thread. For the most part this is OK, and is what you want to have happen behind the scenes so that the main dispatcher thread doesn’t block while waiting for potentially long-running commands to execute. However, there are times when the main dispatcher thread should be used instead. There was no clean way to tell the main dispatcher thread to stop processing commands, and so shutting down cleanly wasn’t as simple job. Instead it required signalling of events across threads which caused some interesting bugs to appear, particularly in POSIX. Instead of attempting to debug the problems that we were seeing, I decided to get the scalpel out and rework the command handling so that there were two modes of operation instead of just the one. At first I thought this change would be quick, but I soon realised there was a bit more to it. The first thing I needed to do was to come up with a way of allowing individual commants to indicate whether they were to be executed on separate threads or not. At first I thought it’d be useful to allow the attacker to tell Meterpreter on the fly, but I follow through with this idea because there’s no only room for abuse, but the attacker isn’t always the best judge of what should happen and on what thread it should happen on. Commands already have two pointers to functions which perform the handling of requests and responses. These pointers of a type called DISPATCH_ROUTINE which is declared as follows: typedef DWORD (*DISPATCH_ROUTINE)(Remote *remote, Packet *packet); At first I felt that this would be easy to reuse for inline processing. However, after some thought, I went instead with the idea of an INLINE_DISPATCH_ROUTINE which has the following prototype: typedef BOOL (*INLINE_DISPATCH_ROUTINE)(Remote *remote, Packet *packet, DWORD* result); The reasons I decided to do this are: It provides a definitive semantic separation of intent between something that’s inline and something that is not. I wanted the prototype to be reflective of the difference in meaning to the caller. The inline dispatch routine needed to have a way of indicating to the calling thread that processing should cease or continue. The return value of the INLINE_DISPATCH_ROUTINE is a simple BOOL which says “continue processing” in the case of TRUE and “stop processing” in the case of FALSE. This simple return value makes it "
