description = "Yes, you can (most probably) consider this to be a fairly regular segment from this point on :) As I said before I’ve always been partial to RCE, and I don’t think I’ll ever get sick of it. Today’s installment is another tutorial that I felt shouldn’t be published. The reason is because it’s a tutorial on how to solve an example reversing challenge for the IITAC online RCE adacemy, and I generally don’t think it’s a good move to show other people how to do this stuff when they can get certified for it."
full_description = "Another Lesson in Software Reversing Published 2007-03-08 by OJ Reeves Read time: 1 min Yes, you can (most probably) consider this to be a fairly regular segment from this point on :) As I said before I’ve always been partial to RCE, and I don’t think I’ll ever get sick of it. Today’s installment is another tutorial that I felt shouldn’t be published. The reason is because it’s a tutorial on how to solve an example reversing challenge for the IITAC online RCE adacemy, and I generally don’t think it’s a good move to show other people how to do this stuff when they can get certified for it. However, this is just a training example so I think I’m safe. The challenge consists of a few tasks:Removing a nag-screenFinding a hard-coded serial numberFinding a valid name/serial combinationWriting a key generatorYou’ll notice from the tutorial that the full source code is included written in 32-bit ASM. Again, I would appreciate the feedback on the quality from anyone who wishes to give it (that includes you Alister ;) ) as I’m always looking to improve what I write. You can grab it from here. Twitter Facebook Google+"
