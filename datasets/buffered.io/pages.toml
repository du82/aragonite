title = "Webmachine, ErlyDTL and Riak - Part 1 · OJ Reeves"
description = """
It has been a long time coming, but the first post is finally here! This is the first in a series of post, as promised a while ago, covering off web development using Erlang. This post is the ubiquitous “get up and running” post, which aims to get your environment set up so that you can dive in to development. The next post will detail how to handle a basic end-to-end web request.

First up, a few things we need to be aware of before we begin:


The information in this post has only been verified on Linux (Mint to be exact). It should work just fine on Mac OSX. I’m almost certain that it won’t work on a Windows machine. So if you’re a Windows developer, you’ll have to wait for another post down the track which covers off how to get your environment ready to rock.
We’ll be downloading, building and installing Erlang, ErlyDTL, Riak and Webmachine.
Rebar is the tool we’ll be using to handle builds, but I won’t be covering it in any depth.
You will need the latest version of Git so make sure it’s downloaded and installed before you follow this article.
We’ll be doing some interaction with Riak via curl, so make sure you have it downloaded and installed as well.
This is intended to be a step-by-step guide targeted at those who are very new to web development in Erlang. This may not be the most ideal set up, nor the best way of doing certain things. I am hoping that those people who are more experienced than I will be able to provide feedback and guidance in areas where I am lacking.
Over the course of this series I’ll be attempting to build an Erlang version of the Code Smackdown site that I’ve been working on here and there with a mate of mine. You’ll see that the sample application we’re working on is called “csd” for obvious reasons.


OK, let’s get into it. First up, Erlang."""
full_description = '''Webmachine, ErlyDTL and Riak - Part 1 Published 2010-09-01 by OJ Reeves Read time: 10 min It has been a long time coming, but the first post is finally here! This is the first in a series of post, as promised a while ago, covering off web development using Erlang. This post is the ubiquitous “get up and running” post, which aims to get your environment set up so that you can dive in to development. The next post will detail how to handle a basic end-to-end web request. First up, a few things we need to be aware of before we begin: The information in this post has only been verified on Linux (Mint to be exact). It should work just fine on Mac OSX. I’m almost certain that it won’t work on a Windows machine. So if you’re a Windows developer, you’ll have to wait for another post down the track which covers off how to get your environment ready to rock. We’ll be downloading, building and installing Erlang, ErlyDTL, Riak and Webmachine. Rebar is the tool we’ll be using to handle builds, but I won’t be covering it in any depth. You will need the latest version of Git so make sure it’s downloaded and installed before you follow this article. We’ll be doing some interaction with Riak via curl, so make sure you have it downloaded and installed as well. This is intended to be a step-by-step guide targeted at those who are very new to web development in Erlang. This may not be the most ideal set up, nor the best way of doing certain things. I am hoping that those people who are more experienced than I will be able to provide feedback and guidance in areas where I am lacking. Over the course of this series I’ll be attempting to build an Erlang version of the Code Smackdown site that I’ve been working on here and there with a mate of mine. You’ll see that the sample application we’re working on is called “csd” for obvious reasons. OK, let’s get into it. First up, Erlang. Installing Erlang R15B01 Download and installation is fairly simple. Right now we’re not worried about enabling all of the features of Erlang, such as interfacing with Java and providing support for GTK. So the boilerplate functionality is enough. Here are the steps to follow: oj@air ~/blog $ wget http://erlang.org/download/otp_src_R15B01.tar.gz ... snip ... oj@air ~/blog $ tar -xzf otp_src_R15B01.tar.gz oj@air ~/blog $ cd otp_src_R15B01/ oj@air ~/blog/otp_src_R15B01 $ ./configure ... snip ... oj@air ~/blog/otp_src_R15B01 $ make ... snip ... oj@air ~/blog/otp_src_R15B01 $ sudo make install ... snip ... Done! Let’s confirm that it has been set up correctly: oj@air ~/blog $ erl Erlang R15B01 (erts-5.9.1) [source] [64-bit] [smp:2:2] [rq:2] [async-threads:0] [hipe] [kernel-poll:false] Eshell V5.9.1 (abort with ^G) 1> q(). ok Excellent. Next let’s get Riak going. Installing Riak 1.2 Considering the power of the software you are about to set up, it is absolutely insane how easy it is to get it running. If any of you have tried to get CouchDB running you’ll no doubt have experienced a few quirks and a bit of pain getting it rolling. Not so with Riak. As mentioned at the start of the article, make sure you have a recent version of Git installed. oj@air ~/blog $ git clone git://github.com/basho/riak Cloning into riak... remote: Counting objects: 12989, done. remote: Compressing objects: 100% (4210/4210), done. remote: Total 12989 (delta 8494), reused 12871 (delta 8386) Receiving objects: 100% (12989/12989), 9.82 MiB | 168 KiB/s, done. Resolving deltas: 100% (8494/8494), done. oj@air ~/blog $ cd riak oj@air ~/blog/riak $ make ./rebar get-deps ==> rel (get-deps) ==> riak (get-deps) Pulling cluster_info from {git,"git://github.com/basho/cluster_info", {branch,"master"}} Cloning into cluster_info... ... sniped LOTS of stuff ... ==> rel (compile) ==> riak (compile) Compiled src/etop_txt.erl I snipped a lot of the make output for obvious reasons. Let’s build a few development nodes of Riak and cluster them together as indicated in the Riak Fast Track: oj@air ~/blog/riak $ make devrel mkdir -p dev (cd rel && ../rebar generate target_dir=../dev/dev1 overlay_vars=vars/dev1_vars.config) ==> rel (generate) mkdir -p dev (cd rel && ../rebar generate target_dir=../dev/dev2 overlay_vars=vars/dev2_vars.config) ==> rel (generate) mkdir -p dev (cd rel && ../rebar generate target_dir=../dev/dev3 overlay_vars=vars/dev3_vars.config) ==> rel (generate) mkdir -p dev (cd rel && ../rebar generate target_dir=../dev/dev4 overlay_vars=vars/dev4_vars.config) ==> rel (generate) oj@air ~/blog/riak $ cd dev oj@air ~/blog/riak/dev $ dev1/bin/riak start oj@air ~/blog/riak/dev $ dev2/bin/riak start oj@air ~/blog/riak/dev $ dev3/bin/riak start oj@air ~/blog/riak/dev $ dev4/bin/riak start oj@air ~/blog/riak/dev $ dev2/bin/riak-admin cluster join dev1 Success: staged join request for 'dev2@127.0.0.1' to dev1 oj@air ~/blog/riak/dev $ dev3/bin/riak-admin cluster join dev1 Success: staged join request for 'dev3@127.0.0.1' to dev1 oj@air ~/blog/riak/dev $ dev4/bin/riak-admin cluster join dev1 Success: staged join request for 'dev4@127.0.0.1' to dev1 This is where things are a different compared to earlier versions of Riak (<= 1.1.4). Here we have just planned to set up our cluster, we haven’t yet actually made any changes. To see the current state of the plan, we can use the new cluster plan command on any of the nodes: oj@air ~/blog/riak/dev $ dev1/bin/riak-admin cluster plan =============================== Staged Changes ================================ Action Nodes(s) ------------------------------------------------------------------------------- join 'dev2@127.0.0.1' join 'dev3@127.0.0.1' join 'dev4@127.0.0.1' ------------------------------------------------------------------------------- NOTE: Applying these changes will result in 1 cluster transition ############################################################################### After cluster transition 1/1 ############################################################################### ================================= Membership ================================== Status Ring Pending Node ------------------------------------------------------------------------------- valid 100.0% 25.0% 'dev1@127.0.0.1' valid 0.0% 25.0% 'dev2@127.0.0.1' valid 0.0% 25.0% 'dev3@127.0.0.1' valid 0.0% 25.0% 'dev4@127.0.0.1' ------------------------------------------------------------------------------- Valid:4 / Leaving:0 / Exiting:0 / Joining:0 / Down:0 Transfers resulting from cluster changes: 48 16 transfers from 'dev1@127.0.0.1' to 'dev4@127.0.0.1' 16 transfers from 'dev1@127.0.0.1' to 'dev3@127.0.0.1' 16 transfers from 'dev1@127.0.0.1' to 'dev2@127.0.0.1' Isn’t that awesome! We can plan our cluster set up before actually commiting changes. This gets a big thumbs up from me. In order to commit changes, we use cluster commit: oj@air ~/blog/riak/dev $ dev1/bin/riak-admin cluster commit Cluster changes committed oj@air ~/blog/riak/dev $ dev2/bin/riak-admin member-status ================================= Membership ================================== Status Ring Pending Node ------------------------------------------------------------------------------- valid 25.0% -- 'dev1@127.0.0.1' valid 25.0% -- 'dev2@127.0.0.1' valid 25.0% -- 'dev3@127.0.0.1' valid 25.0% -- 'dev4@127.0.0.1' ------------------------------------------------------------------------------- Valid:4 / Leaving:0 / Exiting:0 / Joining:0 / Down:0 As we can see from the output, we now have a 4-node Riak cluster up and running. Those four nodes have the following traits: Name Protobuf Port HTTP Port dev1@127.0.0.1 8081 8091 dev2@127.0.0.1 8082 8092 dev3@127.0.0.1 8083 8093 dev4@127.0.0.1 8084 8094 We can talk to any of these nodes and they will replicate their data to the other nodes. Nifty! Now that we have a Riak cluster running for development, let’s get Webmachine ready. Installing Webmachine 1.9.1 Again, the process is very simple: oj@air ~/blog $ git clone git://github.com/basho/webmachine Cloning into webmachine... remote: Counting objects: 1512, done. remote: Compressing objects: 100% (611/611), done. remote: Total 1512 (delta 957), reused 1409 (delta 869) Receiving objects: 100% (1512/1512), 1.32 MiB | 225 KiB/s, done. Resolving deltas: 100% (957/957), done. oj@air ~/blog $ cd webmachine oj@air ~/blog/webmachine $ make ==> webmachine (get-deps) Pulling mochiweb from {git,"git://github.com/basho/mochiweb", {tag,"1.5.1-riak-1.0.x-fixes"}} Cloning into mochiweb... ==> mochiweb (get-deps) ==> mochiweb (compile) Compiled src/mochiweb_sup.erl ... snip ... ==> webmachine (compile) Compiled src/webmachine_util.erl ... snip ... Compiled src/webmachine_request.erl As you can see, Webmachine sits on top of the Mochiweb web server. To create our own application which sits on top of Webmachine, we can utilise the new_webmachine.sh script. So let’s do that to create our Code Smackdown (csd) site: oj@air ~/blog/webmachine $ scripts/new_webmachine.sh usage: new_webmachine.sh name [destdir] oj@air ~/blog/webmachine $ scripts/new_webmachine.sh csd .. ==> priv (create) Writing /Users/oj/code/tmp/csd/README Writing /Users/oj/code/tmp/csd/Makefile Writing /Users/oj/code/tmp/csd/rebar.config Writing /Users/oj/code/tmp/csd/rebar Writing /Users/oj/code/tmp/csd/start.sh Writing /Users/oj/code/tmp/csd/src/csd.app.src Writing /Users/oj/code/tmp/csd/src/csd.erl Writing /Users/oj/code/tmp/csd/src/csd_app.erl Writing /Users/oj/code/tmp/csd/src/csd_sup.erl Writing /Users/oj/code/tmp/csd/src/csd_resource.erl Writing /Users/oj/code/tmp/csd/priv/dispatch.conf Webmachine generates a fully functional website out of the box. So we should be able to build it, fire it up and see it in action: oj@air ~/blog/webmachine $ cd ../csd oj@air ~/blog/csd $ make ==> csd (get-deps) Pulling webmachine from {git,"git://github.com/basho/webmachine","HEAD"} Cloning into webmachine... ==> webmachine (get-deps) Pulling mochiweb from {git,"git://github.com/basho/mochiweb", {tag,"1.5.1-riak-1.0.x-fixes"}} Cloning into mochiweb... ==> mochiweb (get-deps) ==> mochiweb (compile) Compiled src/mochiweb_sup.erl ... snip ... Compiled src/csd_sup.erl oj@air ~/blog/csd $ ./start.sh Erlang R15B01 (erts-5.9.1) [source] [64-bit] [smp:4:4] [async-threads:0] [hipe] [kernel-poll:false] ... snip ... =PROGRESS REPORT==== 11-Jul-2012::22:31:27 === supervisor: {local,csd_sup} started: [{pid,<0.75.0>}, {name,webmachine_mochiweb}, {mfargs, {webmachine_mochiweb,start, [[{ip,"0.0.0.0"}, {port,8000}, {log_dir,"priv/log"}, {dispatch,[{[],csd_resource,[]}]}]]}}, {restart_type,permanent}, {shutdown,5000}, {child_type,worker}] =PROGRESS REPORT==== 11-Jul-2012::22:31:27 === application: csd started_at: nonode@nohost The application is now up and running. As you can see from the output, our csd application has been fired up and is listening on port 8000. Let’s fire it up in a web browser to see if it works. It’s alive! We’re almost done. Before we finish up, let’s get set up our build to include some dependencies. Adding ErlyDTL and Riak Client Dependencies Rebar makes this bit a walk in the park (thanks Dave, you rock!). Just make sure you stop your Webmachine node before continuing by typing q(). into your Erlang console. The rebar.config file is what drives rebar’s dependency mechanism. We need to open this file and add the entries we need to include in our application. Webmachine’s start.sh script by default includes all of the dependencies on start up, so after modifying the configuration, we don’t have to do anything else (other than use the library of course). Open up rebar.config in your favourite editor, it should look something like this: %%-*- mode: erlang -*- {deps, [{webmachine, "1.9.*", {git, "git://github.com/basho/webmachine", "HEAD"}}]}. Edit the file so that it includes both ErlyDTL and the Riak Client: %%-*- mode: erlang -*- {deps, [ {webmachine, ".*", {git, "git://github.com/basho/webmachine", "HEAD"}}, {riakc, ".*", {git, "git://github.com/basho/riak-erlang-client", "HEAD"}}, {erlydtl, ".*", {git, "git://github.com/OJ/erlydtl.git", "HEAD"}} ] }. You’ll notice that the erlydtl reference points at my own fork of the ErlyDTL project. This is because I have made it compile cleanly with rebar so that any dependent projects are also able to be build with rebar. Feel free to use your own fork if you like, but mine is there if you can’t be bothered :) Save the file and build! oj@air ~/blog/csd $ make ==> mochiweb (get-deps) ==> webmachine (get-deps) ==> csd (get-deps) Pulling riakc from {git,"git://github.com/basho/riak-erlang-client","HEAD"} Cloning into riakc... ... snip ... Dependencies sorted. For the final part of this blog post, we’ll include a basic ErlyDTL template and use it to render the page so we can see how it works. Rendering an ErlyDTL Template Rebar has built-in support for the compilation of ErlyDTL templates. It can be configured to behave how you want it to, but out of the box it… … looks for *.dtl files in the ./templates folder … compiles each of the found templates into a module called filename_dtl (eg. base.dtl becomes the module base_dtl) … puts the module beam files into the ebin directory Very handy. Let’s create a very simple template by creating a templates folder, and editing a new file in that folder called sample.dtl <html><body>Hello from inside ErlyDTL. You passed in {{ "{" }}{ param }}.</body></html> Then open up src/csd_resource.erl and search for the to_html() function. It should look like this: to_html(ReqData, State) -> {"<html><body>Hello, new world</body></html>", ReqData, State}. Modify it to look like this: to_html(ReqData, State) -> {ok, Content} = sample_dtl:render([{param, "Slartibartfast"}]), {Content, ReqData, State}. For now, don’t worry about the content of this file. I will cover this off in a future post. In the past, we had to manually modify ebin/csd.app to include the template that we’ve just created. Thankfully, rebar has been updated so that it generates the ebin/csd.app file from the src/csd.app.src file automatically when the application is built. rebar adds the required modules from the src folder and includes the templates from the templates folder. Therefore, with our template and module ready to go, all we need to do is build and run: oj@air ~/blog/csd $ make ==> mochiweb (get-deps) ==> webmachine (get-deps) ==> protobuffs (get-deps) ==> riakc (get-deps) ==> erlydtl (get-deps) ==> csd (get-deps) ==> mochiweb (compile) ==> webmachine (compile) ==> protobuffs (compile) ==> riakc (compile) ==> erlydtl (compile) ==> csd (compile) Compiled src/csd_resource.erl Compiled templates/sample.dtl oj@air ~/blog/csd $ ./start.sh Erlang R15B01 (erts-5.9.1) [source] [64-bit] [smp:2:2] [rq:2] [async-threads:0] [hipe] [kernel-poll:false] ... snip ... ** Found 0 name clashes in code paths ... snip ... =PROGRESS REPORT==== 11-Jul-2012::22:31:27 === application: csd started_at: nonode@nohost Notice how ErlyDTL outputs some information to indicate that no template names have clashed with any other modules. The application is now running, '''
