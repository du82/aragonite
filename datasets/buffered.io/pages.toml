["https://buffered.io/posts/webmachine-erlydtl-and-riak-part-5"]
title = "Webmachine, ErlyDTL and Riak - Part 5 · OJ Reeves"
description = """
{% img right /uploads/2010/09/riak-logo.png ‘Riak Logo’ %}Newcomers to the series should first take a look at the previous four parts of the series (Part 1, Part 2, Part 3, Part 4) first to make sure that you’re up to speed. Feel free to read on if you feel comfortable with the general concepts in use.

When we finished Part 4 we were able to authenticate users using Twitter and OAuth, which is great as we can delegate the responsibility of password management to an external entity.

Now that we know who people are, we want them to be able to do something meaningful with their accounts. That’s what this post is all about."""
full_description = '''Webmachine, ErlyDTL and Riak - Part 5 Published 2012-07-10 by OJ Reeves Read time: 63 min {% img right /uploads/2010/09/riak-logo.png ‘Riak Logo’ %}Newcomers to the series should first take a look at the previous four parts of the series (Part 1, Part 2, Part 3, Part 4) first to make sure that you’re up to speed. Feel free to read on if you feel comfortable with the general concepts in use. When we finished Part 4 we were able to authenticate users using Twitter and OAuth, which is great as we can delegate the responsibility of password management to an external entity. Now that we know who people are, we want them to be able to do something meaningful with their accounts. That’s what this post is all about. Agenda So far it has been hard to see what the goal of this application is. Given the piecemeal nature of the posts it’s hard to project that vision, especially when the content is quite code-heavy. By the end of this post, we’ll not only have a “proper” web application that performs useful functions, we’ll be able to see what this “Code Smackdown” thing really is all about. This post is going to cover the following topics: Riak Secondary Indexes - We’ll be using these so that we can link code snippet submissions to the users who submitted them. Map/Reduce - We’re going to end up with data stored in our database and we’re going to want to query it. Map/reduce is where it’s at! Form submission handling with Webmachine - Users will be able to submit code snippet pairs to the system once they’re logged in. They’ll also be able to vote on submitted snippets. Listing of submissions per-user - Viewing the submissions for a given user will pull out a list from Riak using the secondary indexes and map/reduce. This will allow a user to see what snippets they’ve submitted. Static file serving - Our new UI will require the serving of static content. There are quite a few ways to do this, one of which is using a custom Webmachine resource. While in production it’s a great idea to use a tool like Nginx for this purpose, but we’ll go with the custom Webmachine resource just to keep things a little simpler. Tidying up of templates/UI - Now that we’ve got some content to render, we’ll put together some nicer templates and harness Twitter Bootstrap to make the site a little nicer to look at. You’ll notice that the emphasis will drop off from ErlyDTL as we’ll be doing more rendering of content on the client side using Handlebars while using Backbone.js for logic, routing and event handling. Lots of UI work has been done for this post, but most of that work will not be discussed in detail as there’s already enough content to get through. As always the source code is available so you can read it and play with it. You’ll find the link at the end of the post. Prior to continuing you should make sure you have the latest version of Riak installed. If you don’t, please go and do this now (read Part 1 to learn how to build Riak from scratch). With that … don your robe and Wizard’s hat and let’s begin. Enabling Secondary Indexes As already mentioned we’re going to be storing data in Riak and using the Secondary Index feature to make it easier to link data together and do certain types of queries over that data. Given this requirement the first thing we should do is enable secondary indexes on our cluster. As per the Riak wiki entry … As of version 1.0, Secondary Indexes are enabled by configuring Riak to use the ELevelDB backend riak_kv_eleveldb_backend. Currently, the ELevelDB backend is the only index-capable backend. So we need to go through our Riak development cluster configuration and make sure that our backend is set up correctly. Before continuing, make sure your cluster is no longer running: riak/dev $ dev1/bin/riak stop ok riak/dev $ dev2/bin/riak stop ok riak/dev $ dev3/bin/riak stop ok To modify all the app.config files easily we can run one simple command from the dev (the parent folder which contains all the dev Riak instances): riak/dev $ vim ./**/app.config This will open VIM with all of the app.config files open so that we can easily made the necessary modifications. In each of these files, find the riak_kv configuration section and change the backend like so: ... snip ... %% Riak KV config {riak_kv, [ %% Storage_backend specifies the Erlang module defining the storage %% mechanism that will be used on this node. {storage_backend, riak_kv_eleveldb_backend}, ... snip ... ]} ... snip ... Done. Don’t forget to make sure your dev cluster is running again before you continue: riak/dev $ dev1/bin/riak start riak/dev $ dev2/bin/riak start riak/dev $ dev3/bin/riak start Schema Design Before we get going with any more of the implementation, we need to consider the design of the “schema” we’re going to use when storing our data in Riak. We want our users to be able to: Submit snippets to the system. See a list of snippets they have submitted to the system (and down the track see other lists using filters). Vote for the left- or right- hand snippets to indicate which they prefer. See that they have voted for a snippet before and be reminded of which one they voted for. At the centre of this data there is the snippet. The snippet has the following fields: title: A simple descriptive label. left: One way of performing a function in a given language. right: Another way of performing the same function in a given language (which may not be the same as the language used for left). created: A date/time when the snippet was created/submitted. key: A key/ID which identifies the snippet. These fields will be stored as a blob of JSON. We also need to store with the snippet an identifier for the user that submitted it. Rather than storing this with the payload, we are instead going to create a secondary index which contains this information. We can then use this index to query the store to find out the snippets a user has submitted. This index will be called userid. In future posts we will probably include more indexes and/or fields, but for the functionality we’re aiming to build for this post these fields are sufficient. Next we need to store votes. In a typical RDMBS this problem is well-known and the solutions out there are also well-known. In a KV store this isn’t necessarily the case. What I propose in this post is a possible way of solving this problem. I do not in any way claim that this is the best way. With this, this is what we’re going to do… A vote needs to keep track of who submitted it along with the snippet it was put against. It also needs to have an indication of whether the user preferred the left or right hand side of the snippet. When these votes are stored, we also want to be able to query them in such a way so that, for a given snippet, we can quickly count the number of votes and which way those votes went. This is quite important as the tallying of the votes and displaying them on screen is a key part of the idea behind the application. To identify a vote the key needs to be made up of both the userid of the person who submitted it and the key of the snippet the vote. Therefore, for the vote bucket we’ll create keys in the format: userid-snippetkey While this makes sense, it doesn’t make it easy for us to figure out which votes went against which snippets. To do this, we’ll create a secondary index on the vote which contains the snippet key. This will give us a faster way of finding votes that relate to a key while still keeping the votes separate in the bucket. We can then do a map/reduce over the index and pull out the votes. Originally I had pondered the idea of having another secondary index which contained the vote direction (left or right) and doing multiple map/reduces over the data to count the items. This seemed silly to me. I didn’t think it made sense to invoke two map/reduce jobs when I could do the same thing with one. As a result, I decided to put the direction of the vote inside the vote payload itself as this can be used during a single map/reduce job to total both left and right votes. Down the track the user is going to want to be able to look at what they’ve voted on (as part of a history timeline), so we’ll also add a userid index. Finally, we are going to need to store some more meaningful information about a user for future use, so we’ll create a user bucket and store some metadata for each user with their Twitter ID as the key. Here’s a visual of what we should end up with: {% img /uploads/2012/07/part5-db-schema.png ‘CSD Schema’ %} Now that we have the basics of the schema out of the way, the first thing we should do is adjust our Riak module to include the new features we’ll need to do with secondary indexing and map/reduce. Handling 2i in csd_riak In Riak secondary indexes (2i) are stored as extra metadata alongside the Riak object. Two types of indexes are currently support: integer and binary. These index types are indicated using a naming convention, such that integer indexes are suffixed with _int and binary indexes are suffixed with _bin. Secondary indexes are stored as a key/value pair tuple inside the index section of the meta data. So to start with let’s define a few index-specific macros and helper functions. % ... snip ... -define(INDEX_KEY, <<"index">>). -define(INDEX_SUFFIX_INT, <<"_int">>). -define(INDEX_SUFFIX_BIN, <<"_bin">>). % ... snip ... index(int, Name) -> iolist_to_binary([Name, ?INDEX_SUFFIX_INT]); index(bin, Name) -> iolist_to_binary([Name, ?INDEX_SUFFIX_BIN]). % ... snip ... Here the index function is a simple function which allows us to generate an index name based on a type and a name. This can be called like so: IndexName = index(int, "userid"). - We’ll make use of this in other areas, including the csd_riak_mr module which we’ll cover off shortly. Next we’ll define some functions which make it easier to add indexes to Riak objects. % ... snip ... set_index(RiakObj, Type, Name, Value) -> Meta = riakc_obj:get_update_metadata(RiakObj), Index = case dict:find(?INDEX_KEY, Meta) of error -> []; {ok, I} -> I end, NewIndex = dict:to_list(dict:store(index(Type, Name), value(Value), dict:from_list(Index))), riakc_obj:update_metadata(RiakObj, dict:store(?INDEX_KEY, NewIndex, Meta)). set_indexes(RiakObj, Indexes) -> Meta = riakc_obj:get_update_metadata(RiakObj), Index = case dict:find(?INDEX_KEY, Meta) of error -> []; {ok, I} -> I end, UpdatedIndexes = lists:foldl(fun({T, N, V}, I) -> dict:store(index(T, N), value(V), I) end, dict:from_list(Index), Indexes), NewIndex = dict:to_list(UpdatedIndexes), riakc_obj:update_metadata(RiakObj, dict:store(?INDEX_KEY, NewIndex, Meta)). get_index(RiakObj, Type, Name) -> Meta = riakc_obj:get_metadata(RiakObj), Indexes = dict:fetch(?INDEX_KEY, Meta), IndexKey = index(Type, Name), Value = binary_to_list(proplists:get_value(IndexKey, Indexes)), case Type of int -> list_to_integer(Value); bin -> Value end. % ... snip ... The first function, set_index, is used to update a Riak object instance and include a single new index of a certain type. This function gets existing update metadata (different to “normal” metatdata in that this is what will be used to update the object when saved) and then attemps to retrieve the index section of that data. If found adds the new index value to the list of indexes. If it’s not found then the new indexes is simply inserted into an empty list. This information is then written into a new Riak object via the riakc:update_metadata/2 function. This code can be called like so: NewObj = csd_riak:set_index(RiakObj, int, "userid", 12345). This code converts between lists and dictionaries because I want existing index values to be overwritten with the new values. The second function, set_indexes, is an extended version of set_index in that it allows you to set more than one key at a time. Instead of a single type/name/value combination it accepts a list of tuples of {type, name, value}. The third function, get_index, is a helper function which is designed to get the value of certain index. Note how this function accesses existing metadata via get_metadata/1 rather than get_update_metadata/1. This is due to us being interested in an existing index, not in one that is about to be updated when we next save. While we’re here, we do a converstion of the value to an integer if the index type is an integer. This code can be called like so: UserId = csd_riak:get_index(RiakObj, int, "userid"). Last of all you may have noticed that a couple of these functions are calling another function called value/1. It looks like this: % ... snip ... %% ------------------------------------------------------------------ %% Private Function Definitions %% ------------------------------------------------------------------ value(V) when is_list(V) -> list_to_binary(V); value(V) -> V. As you can see this is an internal function which is there to help make sure that values are in the right format when being stored as an index. With the 2i interface now taken care of, let’s take a look at what we need to do for map/reduce. Supporting Map/Reduce in csd_riak As you’re already aware, Riak’s map/reduce interface requires a set of inputs, one or more map phases and zero or more reduce phases. We could manually construct each of these components each time we want to execute a map/reduce job but that doesn’t quite feel right to me. Instead, I prefer to have a “usable” module that helps construct properly-formed map/reduce jobs to reduce the risk of the caller doing the wrong thing. Callers of our modules shouldn’t have to know about the format of Riak’s map/reduce interface in order to use it. So we’ll provide a helper module which wraps this up. Before we look at the code, bear in mind that this module supports enough functionality to provide what is needed for the application so far. Down the track extra features will be added to support other ways of doing map/reduce, but for now they are beyond the scope of this version of the application. With that, let’s take a look at the code. -module(csd_riak_mr). -author('OJ Reeves <oj@buffered.io>'). %% ------------------------------------------------------------------ %% API Function Exports %% ------------------------------------------------------------------ -export([ create/0, run/2, add_input_index/5, add_map_js/2, add_map_js/3, add_map_js/4, add_reduce_js/2, add_reduce_js/3, add_reduce_js/4, add_reduce_sort_js/2, add_reduce_sort_js/3 ]). %% ------------------------------------------------------------------ %% Private Record Definitions %% ------------------------------------------------------------------ -record(mr, { in_ind = undefined, %% TODO: when the need arises add support for other inputs %% including {bucket, key} and {bucket, key, arg}. phases = [] }). %% ------------------------------------------------------------------ %% API Function Definitions %% ------------------------------------------------------------------ %% @doc Create a mew map/reduce job instance. create() -> #mr{}. run(RiakPid, #mr'''
