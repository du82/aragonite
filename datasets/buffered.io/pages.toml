["https://buffered.io/posts/webmachine-erlydtl-and-riak-part-3"]
title = "Webmachine, ErlyDTL and Riak - Part 3 · OJ Reeves"
description = """
For those of you who are new to the series, you may want to check out Part 1 and Part 2 before reading this post. It will help give you some context as well as introduce you to some of the jargon and technology that I’m using. If you’ve already read then, or don’t want to, then please read on!

This post builds on the previous two, but not without a few little modifications. If you’re interested in following along step by step with your own version of the code running, then get yourself a copy of this changeset before doing so.

In this post we’re going to cover:


A slight refactor of code structure to support the “standard” approach to building applications in Erlang using OTP.
Building a small set of modules to talk to Riak.
Creation of some JSON helper functions for reading and writing data.
Calling all the way from the Webmachine front-end to Riak to extract data and display it in a browser using ErlyDTL templates.


There are quite a few code snippets in this post as well as output from script executions and bash sessions. To avoid confusion, all file listings reference the path to the file that is being modified relative to the root of the project folder.

Be warned, this is a long post :) Get yourself a shmoke und a pancake, a glass of your favourite beverage and put some relaxing music on (instrumental is best).

Are you ready? OK, here we go …"""
full_description = '''Webmachine, ErlyDTL and Riak - Part 3 Published 2010-10-13 by OJ Reeves Read time: 30 min For those of you who are new to the series, you may want to check out Part 1 and Part 2 before reading this post. It will help give you some context as well as introduce you to some of the jargon and technology that I’m using. If you’ve already read then, or don’t want to, then please read on! This post builds on the previous two, but not without a few little modifications. If you’re interested in following along step by step with your own version of the code running, then get yourself a copy of this changeset before doing so. In this post we’re going to cover: A slight refactor of code structure to support the “standard” approach to building applications in Erlang using OTP. Building a small set of modules to talk to Riak. Creation of some JSON helper functions for reading and writing data. Calling all the way from the Webmachine front-end to Riak to extract data and display it in a browser using ErlyDTL templates. There are quite a few code snippets in this post as well as output from script executions and bash sessions. To avoid confusion, all file listings reference the path to the file that is being modified relative to the root of the project folder. Be warned, this is a long post :) Get yourself a shmoke und a pancake, a glass of your favourite beverage and put some relaxing music on (instrumental is best). Are you ready? OK, here we go … A Slight Refactor I was ready to embark on this third post a while back but then I sat back and thought about how I might structure things if I were using another set of technologies. Usually I would put another layer between the web tier and the back-end database cluster as opposed to having the web tier talk to the database directly. It didn’t make sense to me that this approach would be any different in Erlang. I had a chat to two blokes that I really respect to get their views, and then I fired off a question to the Basho guys (via the #riak IRC channel). The Basho lads even made the effort to respond to me via the Riak Recap as they weren’t available at the time to answer me via IRC (thanks again Mark). All three of them confirmed my thoughts. Here’s what appeared in the recap which captures the question and response nicely: Q — I have a Webmachine application which will be talking to Riak. I was going to put application and controller logic in that application and I am wondering if [I] should instead be creating a “core” OTP application with the business style logic in it and have the Webmachine app talk to that app which, in turn, talks to Riak? Is that the general approach that is taken [in Erlang applications]? (from TheColonial via #riak) A — We recommend going with the latter approach. You’re better off to create a core app that talks to Webmachine and Riak separately. Perfect, that makes total sense. Therefore the following describes what I did to modify the code base that I had in order to support this set up. Any failure in implementation, structure or understanding is totally my own and in no way reflects on the abilities and advice of those mentioned above who took the time to offer assistance. Moving on. What we want to end up with is three applications: Application Structure/Responsibility Talks to Riak Bomb-proof data storage and replication. - csd_core An OTP application that provides an API to a set of logic that deals with the transformation of data from a client through to the database. It should keep the clients ignorant of the data storage medium. It should provide business logic that would be required for any client application to be able to talk to a `csd`/Riak back-end. Riak csd_web Provide a nice, web-based interface for the user to experience the goal of the Code Smackdown application. csd_core Given that we’re going to be using this structure, the “root” folder should actually be fairly clean without any source. Instead, each csd-related application should live in its own sub-folder under an apps folder and the root should just contain the means to build it and start it. In essence what we’d like to see in the root folder is something like this: oj@spawn-link ~/blog/csd $ ls -F apps/ dev.haproxy.conf Makefile proxy.sh* rebar* rebar.config start.sh* With that in mind, let’s start the surgery. Moving csd to csd_web There are two ways to approach this problem. The first is to do a find and replace, making sure you cover off file names as well as module names, etc. The second is to simply recreate the web site from scratch, copy over any missing files and make any other adjustments manually that may be required. I preferred the second approach, so that’s what I did. First I recreated the web application, which is now called csd_web in the apps folder: oj@spawn-link ~/blog/csd $ mkdir apps && cd apps oj@spawn-link ~/blog/csd/apps $ ~/blog/webmachine/scripts/new_webmachine.sh csd_web . ==> priv (create) Writing /home/oj/blog/csd/apps/csd_web/README Writing /home/oj/blog/csd/apps/csd_web/Makefile Writing /home/oj/blog/csd/apps/csd_web/rebar.config Writing /home/oj/blog/csd/apps/csd_web/rebar Writing /home/oj/blog/csd/apps/csd_web/start.sh Writing /home/oj/blog/csd/apps/csd_web/ebin/csd_web.app Writing /home/oj/blog/csd/apps/csd_web/src/csd_web.erl Writing /home/oj/blog/csd/apps/csd_web/src/csd_web_app.erl Writing /home/oj/blog/csd/apps/csd_web/src/csd_web_sup.erl Writing /home/oj/blog/csd/apps/csd_web/src/csd_web_resource.erl Writing /home/oj/blog/csd/apps/csd_web/priv/dispatch.conf oj@spawn-link ~/blog/csd/apps $ ls -F csd_web/ Next I removed a few files which weren’t going to be needed any more. I then copied over rebar.config, the ErlyDTL templates and the csd.app.src file (which we need to modify): oj@spawn-link ~/blog/csd/apps $ cd csd_web oj@spawn-link ~/blog/csd/apps/csd_web $ rm README rebar start.sh oj@spawn-link ~/blog/csd/apps/csd_web $ cp ../../rebar.config . oj@spawn-link ~/blog/csd/apps/csd_web $ cp -R ../../templates . oj@spawn-link ~/blog/csd/apps/csd_web $ cp ../../src/csd.app.src ./src/csd_web.app.src I then edited the csd_web.app.src file so that the names were updated (I tidied it up a little and added a version number too): %%-*- mode: erlang -*- {application, csd_web, [ {description, "The Webmachine component of the Code Smackdown application."}, {vsn, "0.0.1"}, {modules, []}, {registered, []}, {applications, [ kernel, stdlib, crypto, mochiweb, webmachine ] }, {mod, {csd_web_app, []}}, {env, []} ] }. I then opened up csd_web_resource.erl and made it look like the original csd_resource.erl so that it called the ErlyDTL template: -module(csd_web_resource). -export([init/1, to_html/2]). -include_lib("webmachine/include/webmachine.hrl"). init([]) -> {ok, undefined}. to_html(ReqData, State) -> {ok, Content} = sample_dtl:render([{param, "Slartibartfast"}]), {Content, ReqData, State}. csd_web is now ready to go. To build it, we need to go back up to the root csd folder and adjust the rebar.config so that it knows to look in the apps sub-folder (thanks to Andrew for pointing this out). We can also remove all the dependencies because that will be taken care of by csd_web: %%-*- mode: erlang -*- {sub_dirs, ["apps/csd_web"]}. Next, I removed all the other left-over stuff in the root folder that wasn’t required any more (including the startup script): oj@spawn-link ~/blog/csd $ rm -rf README priv src templates start.sh I then modify the Makefile so that it does a couple of other things: Includes a target which builds just the current applications without building the dependencies (this will make builds much quicker most of the time). Includes a target which can start the web application, essentially replacing the original startup script. This target will be dependent on the previous target so that it is always up to date when running the application. Includes targets which can start/stop HAproxy. ERL ?= erl APP = csd .PHONY: deps all: deps @./rebar compile app: @./rebar compile skip_deps=true deps: @./rebar get-deps clean: @./rebar clean distclean: clean @./rebar delete-deps webstart: app exec erl -pa $(PWD)/apps/*/ebin -pa $(PWD)/deps/*/ebin -boot start_sasl -s reloader -s csd_web proxystart: @haproxy -f dev.haproxy.conf All that is left to do is start haproxy and launch the application (make sure Riak is running first). These commands need to be done in two different terminal windows. First, start the proxy (note the use of sudo so that we can listen on port 80): oj@spawn-link ~/blog/csd $ sudo make proxystart [2] 1935 Available polling systems : sepoll : pref=400, test result OK epoll : pref=300, test result OK poll : pref=200, test result OK select : pref=150, test result OK Total: 4 (4 usable), will use sepoll. Using sepoll() as the polling mechanism. Then make and start the web application. We have to do a full make first time around so that all the dependencies are resolved: oj@spawn-link ~/blog/csd $ make && make webstart ... snip ... =PROGRESS REPORT==== 4-Apr-2011::21:04:18 === application: csd_web started_at: nonode@nohost Now we should be able to hit localhost and see the ErlyDTL template rendered in all its awesome, black-and-white glory: Refactor complete. Now let’s start work on our new OTP application which will be responsible for talking to Riak. If you need a break, now is the time to take it! Go freshen up, take a leak and refill your glass. Ready to go again? Here we go … Creating the csd_core OTP Application Creation of an OTP-compliant application is another job for Rebar as it comes with a set of templates built-in. Unfortunately those template aren’t 100% and hence don’t do everything we need to do out of the box. But we shall use them as a starting point: oj@spawn-link ~/blog/csd $ mkdir apps/csd_core && cd apps/csd_core oj@spawn-link ~/blog/csd/apps/csd_core $ ../../rebar create-app appid=csd_core ==> csd_core (create-app) Writing src/csd_core.app.src Writing src/csd_core_app.erl Writing src/csd_core_sup.erl We have a very simple application shell set up, but we need to do a bit more work to get it ready. First, let’s create our base csd_core.erl module which is used to fire up our application. For this we will use csd_web.erl (the one which is part of our Webmachine application) as a template. Note that I’ve shuffled things around and removed some things that are not relevant: %% @author OJ Reeves <oj@buffered.io> %% @copyright 2011 OJ Reeves %% @doc csd_core startup code -module(csd_core). -author('OJ Reeves <oj@buffered.io>'). -export([start/0, start_link/0, stop/0]). ensure_started(App) -> case application:start(App) of ok -> ok; {error, {already_started, App}} -> ok end. %% @spec start_link() -> {ok,Pid::pid()} %% @doc Starts the app for inclusion in a supervisor tree start_link() -> ensure_started(crypto), csd_core_sup:start_link(). %% @spec start() -> ok %% @doc Start the csd_core server. start() -> ensure_started(crypto), application:start(csd_core). %% @spec stop() -> ok %% @doc Stop the csd_core server. stop() -> Res = application:stop(csd_core), application:stop(crypto), Res. Next up, edit csd_core.app.src and add some application-specific information: {application, csd_core, [ {description, "Core functionality for the Code Smackdown application."}, {vsn, "0.0.1"}, {registered, []}, {applications, [ kernel, stdlib ] }, {mod, {csd_core_app, []}}, {env, []} ] }. We know that we’ll be talking to Riak, so we need to make sure we’ve included the riakc (Riak client) dependency. Though I haven’t yet talked about it, we’ll also be using Mochiweb’s mochijson2 module to help with handling JSON data, so we shall add this as a dependency to the application. Bear in mind this is already a dependency for the web component of the application, so we’re not actually adding a new dependency to the overall application. We can do this by creating a rebar.config in apps/csd_core and editing it to contain the following: %%-*- mode: erlang -*- {deps, [ {mochiweb, "1.5.1", {git, "git://github.com/mochi/mochiweb", {tag, "1.5.1"}}}, {riakc, ".*", {git, "git://github.com/basho/riak-erlang-client", "HEAD"}} ] }. Then we need to tell rebar to build this new application by adjusting the rebar.config in the csd root folder: %%-*- mode: erlang -*- {sub_dirs, ["apps/csd_core", "apps/csd_web"]}. Now we have enough to get the csd_core application started, even though it doesn’t do anything. We just need to adjust our Makefile target so that it launches the csd_core application as well: ERL ?= erl APP = csd .PHONY: deps all: deps @./rebar compile app: @./rebar compile skip_deps=true deps: @./rebar get-deps clean: @./rebar clean distclean: clean @./rebar delete-deps webstart: app exec erl -pa $(PWD)/apps/\*/ebin -pa $(PWD)/deps/\*/ebin -boot start_sasl -s reloader -s csd_core -s csd_web proxystart: @haproxy -f dev.haproxy.conf Then off we go: oj@spawn-link ~/blog/csd $ make webstart ==> csd_core (compile) Compiled src/csd_core_app.erl Compiled src/csd_core_sup.erl Compiled src/csd_core.erl ... snip ... =PROGRESS REPORT==== 4-Apr-2011::21:49:27 === application: csd_core started_at: nonode@nohost ... snip ... =PROGRESS REPORT==== 4-Apr-2011::21:49:27 === application: csd_web started_at: nonode@nohost As you can see we now have a system which contains both csd_core and csd_web. This is great, but csd_core needs a lot more work. The intent for this application is to be an OTP application which provides an API to the csd logic and back-end database. This means we’re going to need to get ourselves a gen_server set up which can handle requests from various clients. Let’s do that next. Thankfully rebar comes with a simple template that we can use for creating the gen_server behaviour, so we can invoke that from the command line and have it generate the shell for us: oj@spawn-link ~/blog/csd/apps/csd_core $ ../../rebar create template=simplesrv srvid=csd_core_server ==> csd_core (create) Writing src/csd_core_server.erl We now have a very dumb server ready to go, to make it start with the rest of the application we have to modify csd_core_sup, the supervisor and tell it to fire up the server for us: -module(csd_core_sup). -behaviour(supervisor). %% API -export([start_link/0]). %% Supervisor callbacks -export([init/1]). %% Helper macro for declaring children of supervisor -define(CHILD(I, Type), {I, {I, start_link, []}, permanent, 5000, Type, [I]}). %% =================================================================== %% API functions %% =================================================================== start_link() -> supervisor:start_link({local, ?MODULE}, ?MODULE, []). %% =================================================================== %% Supervisor callbacks %% =================================================================== init([]) -> Server = ?CHILD(csd_core_server, worker), Processes = [Server], {ok, { {one_for_one, 5, 10}, Processes} }. With this in place we can now start our application again and we should see the new csd_core_server appear '''
