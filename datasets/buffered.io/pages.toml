["https://buffered.io/posts/im-so-impressed-i-want-to-pay-you-less"]
title = "I'm so impressed I want to pay you less · OJ Reeves"
description = """
The title of this post is a statement that I’ve heard a few times in the past while at work. The people who said it might not have used those exact words, but the intent is the same. Usually I hear it in the following form:

“We’re very happy with the work you’ve done for us as a contractor. We want to keep you on, but would like you to take a job as a permanent employee and continue to work on the project.”

Once they’ve made this point, they then feel the need to harp on about the good points of becoming a permanent employee. Things such as job security, sick/annual leave and better hours tend to get mentioned. All of them are complete bullshit of course.

There is no such thing as job security. Sick and/or annual leave isn’t enough to make up for the difference in pay. Hours tend to always be worse when you’re working for the man, because you’re expected to do whatever needs to be done regardless of the hours. This is worse if you’re working on mission-critical stuff."""
full_description = "I'm so impressed I want to pay you less Published 2010-03-02 by OJ Reeves Read time: 4 min The title of this post is a statement that I’ve heard a few times in the past while at work. The people who said it might not have used those exact words, but the intent is the same. Usually I hear it in the following form: “We’re very happy with the work you’ve done for us as a contractor. We want to keep you on, but would like you to take a job as a permanent employee and continue to work on the project.” Once they’ve made this point, they then feel the need to harp on about the good points of becoming a permanent employee. Things such as job security, sick/annual leave and better hours tend to get mentioned. All of them are complete bullshit of course. There is no such thing as job security. Sick and/or annual leave isn’t enough to make up for the difference in pay. Hours tend to always be worse when you’re working for the man, because you’re expected to do whatever needs to be done regardless of the hours. This is worse if you’re working on mission-critical stuff. Now I have no aversion to doing my fair share of extra work and mission-critical stuff is way more interesting. I often enjoy it. What I don’t enjoy is the expectation for me to give away my free time to my employer for no reward. I don’t get extra time off in lieu. I don’t get overtime pay. I don’t get ownership of the software. I don’t get to see the result of the extra effort I put in. I’m just expected to do it. In other situations I’d be happy to do it, but 999 times out of 1000, the situation isn’t right. I’ve even worked for companies in the past who expect you to give up a lot of your personal time even if there isn’t anything critical that needs to be done. I was expected to write small applications and create other assets that the company could use in future projects. At first this seemed like it could be fun. But the cold hard reality was that all of the effort was totally wasted, because none of the things that were created ever got used. As a contractor, the view from the perspective of the client is different, especially if you’re on an hourly rate. Everything boils down to a financial cost. You’re more likely to get a fair deal as a contractor than you are as a permy (at least here in the Brisbane market) because you’re entitled to make them pay for the time and effort you put in. I realise that this makes me sound rather mercenary. In all honesty, I’m not mercenary. I love technology. I love building software. I don’t go to work just so that I can get paid. In many ways I would work for less pay if the conditions were right. Unfortunately, I am yet to come across a job where those conditions are right. I’ve certainly given it a shot in the past. I took a substantial pay-cut to work for Electronic Arts back in 2005 so that I could work on something that I really wanted to work on. I thoroughly enjoyed it. As far as the technology and the challenges are concerned, it’s the most fun I’ve ever had at work. Unfortunately, the experience I had there led me to believe that the lifestyle isn’t sustainable (at least not for me and my family). Would I do the same again for another job? Definitely. But the only company I would do it for would be Basho and my Erlang-fu is not yet up to scratch so I wouldn’t be considered. Outside of Basho I’m not aware of any other company or work that excites me as much. So for now I will probably remain a contractor, and try to move around and add as much value as I can on a variety of projects, keeping up to speed on many different types of technology. So if you’re reading this, give me a few good reasons as to why permanent work is better than contract work. Why should I consider it? Would you consider it? If you’re a permy, are you looking to go contracting, and why? Feedback and comments are appreciated :) Twitter Facebook Google+"
