["https://buffered.io/posts/help-me-help-you"]
title = "Help Me Help You! · OJ Reeves"
full_description = '''Help Me Help You! Published 2007-07-14 by OJ Reeves Read time: 8 min Some of you might argue that this a fair question, and I'll agree, it is a fair question. But what it lacks is context. My response to the above question was:OK, there are quite a few answers to the question, so can you please clarify a few things for me so I can give you a meaningful answer:What is "it"?What is the "item"? Is it a primitive type, or a class you've created?Is the application a fat-client app, or a web application?Which button are you clicking?...etc You get the idea. I could have answered straight away with a massive rant about the possible reasons why a given scenario results when a button is pressed, but no doubt it would have been a huge waste of time. Instead, I went for the other option, which was to get a better idea of the problem. After a bit of a digging around, it turns out that the above question should have been:Oliver, I have an issue with my web form application. When I press the 'add' button, it is supposed to create a new instance of type Mytype, add that new instance to a collection that is stored in the session, and then post back with the data table populated with the new list of items. When I press the button, the application posts back, but the contents of the list doesn't change. Do you have any idea what's wrong? Man what a difference that made! The essence of getting a good answer to a question is to make sure that the question is a good question in the first place. An example of a not-so-bad-but-could-be-better question hey, any idea where i could get an example html for world timezones? pref with country/region and offset? Now this certainly isn't bad, and it is possible to deduce the intended meaning of the question from the question! But it turns out that the question should have been:hey, do you have any idea where i could get a list of timezones mapped to cities/countries which I can use inside a <select> tag in HTML? The art of meaningful question construction You wouldn’t think that this could be considered an ‘art’, but it is. I’m sure there are lots of people out there who have written up a question on a programming forum only to find that it is totally ignored. Nobody responds, and your post simply makes it way to the bottom of the forum pile regardless of the number of times you bounce it to the top again. If this happens, you’ve asked a shit question. It’s that simple. There are only a few subtle yet important differences that make a question bad instead of good: Assumed knowledge. 9 out of every 10 questions that are asked are ruined by the fact that the asker assumes that the answerer knows enough about the problem space to just belt it out without too much difficulty. Well, here’s a newsflash: they don’t!. People who are spending time on forums, or at work, helping people solve their problems require more than just a generic set of information to be able to answer the question properly. In my view, you should always do what my old high-school English teacher told me before going into my final exams: “To get the marks, state the bloody obvious!”. Thank you Mrs Price, you’re dead right. Too much information on the topic is better than not enough. So be forthcoming, don’t assume that the person you’re asking is already in the loop. Vague terminology. In short, don’t use words that don’t make sense, that are vague, or that don’t add to the meaning. Some examples are: it, item, object, doohicky, thingy, whatsit, dooverlacky, thingamajig, woozit, etc. Be specific. Be direct. Be helpful! Specific terminology. This is the total opposite to the previous point. Don’t bombard someone with jargon, large words, and acronyms. Eg. instead of saying that you’ve broken your pre-regulation destroyer-class solid-fuel recoil booster you should instead use the word spring. Large words won’t make you look smart, they’ll just piss people off and prevent you getting the help you need. Give a good example. A lot of the time, the problem that you have is one that’s come about from being in the depths of your code. If you can, break it out into a separate application, or “spike” as they like to call it in an Agile world, and demonstrate the issue in a much cleaner environment/situation. You’re more likely to receive help if you post a snippet of code than if you dump your entire application in source form on a forum. Think before you speak. You’re in a rush. We know that. Everyone’s always in a rush. People tend to jump headfirst into a question without really thinking about what they’re asking, and it doesn’t benefit them or the person they’re speaking to. Take that extra 10 seconds to think about what it is you actually need to ask. When you’re able to word in such a way that almost anyone would be able to understand you without prior knowledge, your question is ready to be asked. Keep it as short as possible without losing information. Yes, this point slightly contradicts the point I made earlier about too much information being better than not enough. But the point is that you needn’t be verbose. Keep it as short as you can, but make sure you’ve got enough information out to make things clear. Pages and pages of text, and/or a 10 minute ear-bashing is enough to put anyone off helping you. Do a bit of research first. This is more for those technical problems than anything, but the rule does generally apply to anything. Chances are that someone else out there has had the same problem as you. It’s highly likely that the problem has been solved, and there is information out there which is freely available should you make an effort to seek it out. If you can’t find it after a few minutes of searching, then get your thoughts together and write up a decent question. One guaranteed way of pissing someone off is to ask them a question which can be answered by the first result of a basic a Google search. Make the effort to help yourself before you take up someone else’s time. Try to solve the problem yourself first. This will not only give you a better understanding of the problem, but it will show that you’ve actually made an effort to solve the problem rather than just getting someone else to do your homework for you. Be polite. Be rude, be blunt, be expecting, and you’ll be ignored (and rightly so). Don’t expect help from people if you’re not going to be courteous and/or use manners. If you get help, express appreciation. If someone takes the time to respond to get clarification on your problem, again you should make it obvious that you are grateful. They’re on your side, so try and keep them there. Look at the question from the perspective of the listener. This is probably the most important point. While writing your question ask yourself:Do they know what BLAH actually is?Do they need to know what BLAH actually is?Are they aware of the environment I’m working in?Would they need to know your hardware specs?Should they be made aware of the language you’re using?Is there enough context in my question to remove confusion?Is there evidence of the fact that I’ve tried to solve the problem myself?..the list goes on. Post a meaningful title. Again this applies in the online world when posting to forums. If you’re going to write a post to ask for help, give some context to your problem in your post heading. Here are some things that you should avoid:HELP!! URGENT HELP REQUIRED!!Stupid homework problemWhy won’t this work?I have 15 mins to finish this.. plz help!GIVE ME HELP NOW!You don’t have to be a rocket scientist to know why those titles are bad. Most regular forum users will just skip your post, and the moderators will probably tear you a new a**eshole for being stupid. Instead, try something like the following:Memory allocation problem using malloc() in C++CSS problem with IE, works in Firefox These kinds of topic headings are going to not only help give context, but will most likely attract people who are experts in those respective areas. Questions that should never be asked There are some questions that should never, ever be asked. How do I write Quake XVI? You don’t. You’re not smart enough.How do I stop my console program from disappearing when it finishes? Ask Google.Where can I download insert application name? You don’t. Go and buy it.How do I hack into Hotmail? The authors of Hotmail are much smarter than you. Instead, go outside and look at something shiny.Can you do my homework for me? Errr.. no.…etc. A final thought… Most of the time, people who give a great deal of thought to a problem before asking for someone’s help end up solving the problem themselves. You may find that before you even get to voice your question, the answer becomes clear because you’ve put effort into defining your question! Twitter Facebook Google+'''
