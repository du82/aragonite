["https://buffered.io/posts/i-dont-need-your-frickin-framework"]
title = "I Don't Need Your Frickin' Framework! · OJ Reeves"
description = """
How many companies have you worked with/for that have their own framework? How many have been in the process of developing their own framework? How many have been in the process of redeveloping their own framework? How many have taken another framework and hacked improved it?

When I attempt to answer the questions listed above, I start to shiver. I feel the need to burn my clothes and take a very long shower."""
full_description = "I Don't Need Your Frickin' Framework! Published 2009-04-13 by OJ Reeves Read time: 5 min How many companies have you worked with/for that have their own framework? How many have been in the process of developing their own framework? How many have been in the process of redeveloping their own framework? How many have taken another framework and hacked improved it? When I attempt to answer the questions listed above, I start to shiver. I feel the need to burn my clothes and take a very long shower. In the early days of my career, frameworks were few and far between. These days it is no longer the case. An alarming number of companies are carrying the burden of their own frameworks. A huge number of private and public sector organisations are currently paying people to write new frameworks! For some reason, many nave project managers and team leads feel the need to invest a great deal of time and moolah into building the next-generation, latest-and-greatest, all-singing-all-dancing, cover-every-possible-web-and-rich-client-case framework before they start to do what they’re being paid to do: solve a business problem. The last job I worked on was one of those places. On my first day I was told that the project team (which at that point was just 2 of the 6 developers) were building a new framework. They were also building a code generator that used this framework. This dynamic duo of programs would be used in conjunction with each other to build any kind of application under the sun. It would solve all of the issues without the developer having to think, all while making poverty history. What a joke. The code generator was never finished and the framework was never used. The money that was intended to be burned while adding more features to an existing application disappeared in a blur of Greenfield over-engineering of a framework that simply was not required. This kind of problem happens so much these days, and it’s just appalling. What I want to say is: I am frickin’ tired of it! The example I mentioned above is probably the worst I’ve seen for a while. I’d love to go into a fair bit of depth to uncover some “interesting” features of the framework, but it’s not worth it. I would like to highlight just a few points about it though: It was based on CSLA, which is already a rather large framework that attempts to do way too much via an enormous amount of code. The author decided that some parts of CSLA weren’t good enough and hence needed to be “improved”. The “improvements” were atrocious. It was supposed to be Open Source, but as far as I’m aware it never made it onto the Web, hence I can’t point you at it. In some areas of code, you were required to invoke functions through a generic MessagePortal helper object which invoked the required function via reflection after attempting to infer a stack of unnecessary information. This was interesting, as you knew what you needed to call. But you still had to pass in function names as string parameters, hence losing knowledge, and wait for the framework to regain that knowledge by inspecting the code at runtime. Even though the excessive use of reflection was <sarcasm>an obvious win</sarcasm>, we also copped the added bonus of having another 35 (yes, that’s right 35) function calls appearing in our call-stack. Those developers who attempted to use it were bitten constantly by esoteric and undocumented pitfalls in the design. It took around 3 times longer during development to do the “basics” (such as create objects and have them load from a DB). This is compared to using no framework and loading objects manually via ADO. It was unable to load any form of object graph. It not only leaked database connections every time you made a database call, it leaked two extra connections during start-up while it attempts to read some database information, such as schema, into memory. The code generator was written in such a way that the first half of the generator would be used to generate the other half (epic fail)! The author wasn’t able to use it. I hence conclude that this framework was a large, unwieldy, bloated, over-engineered, slow and riddled with design flaws. This is all for something that was actually totally unnecessary. Why? … .. because this was “The Framework” v2.0! Yup, it was the second version. The first was also a dog’s breakfast, but at least it was finished. So what’s my point? Am I trying to say that use of any framework is bad? Having helper libraries and well-designed platforms to build on are an epic fail? Most definitely not. What I am saying is this: there are people out there with minds immeasurably superior to ours who have already done a better job of solving this problem. Stop writing your own frameworks. Stop writing code generators. There are already options out there. So to all of you wannabe framework developers: stop what you’re doing. You’re wasting cash and not adding value. We’ve already got a framework. It’s called Microsoft .NET. Now get out of the way and let me use it! Tagged: .net, bloat, framework, overengineering, programming Twitter Facebook Google+"
author = "OJ Reeves"
year_published = 2009
