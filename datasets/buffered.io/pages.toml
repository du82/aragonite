["https://buffered.io/posts/setting-up-trac-mercurial-and-ssh-on-windows"]
title = "Setting up Trac, Mercurial and SSH on Windows · OJ Reeves"
description = """
WARNING - This blog post is long :)
This post has been edited since it was published. Please see the end of the article for any notes/modifications

Some Background Info
I had the need to do this for work recently. It was nothing short of a right royal pain in the butt. It was such a pain, in fact, that I have decided to document what I had to do to get it working so that other poor unfortunates will feel less pain if they have to do this themselves.

Almost regardless of the company and the software I’m working on, I use Mercurial for source code control. For the work I am doing at the moment, I was also using hg because the company I am involved with is relatively new and they hadn’t yet sorted out a plan for version control or ALM. It was working quite well and I was pushing all my changes to my NAS box to make sure I had other copies backed up, etc. I was living the dream :)"""
full_description = '''Setting up Trac, Mercurial and SSH on Windows Published 2009-05-16 by OJ Reeves Read time: 25 min WARNING - This blog post is long :) This post has been edited since it was published. Please see the end of the article for any notes/modifications Some Background Info I had the need to do this for work recently. It was nothing short of a right royal pain in the butt. It was such a pain, in fact, that I have decided to document what I had to do to get it working so that other poor unfortunates will feel less pain if they have to do this themselves. Almost regardless of the company and the software I’m working on, I use Mercurial for source code control. For the work I am doing at the moment, I was also using hg because the company I am involved with is relatively new and they hadn’t yet sorted out a plan for version control or ALM. It was working quite well and I was pushing all my changes to my NAS box to make sure I had other copies backed up, etc. I was living the dream :) The problem, though, was that this setup was working fine for me as a sole developer, but wasn’t solving the problem for the other developers. There are two other people involved in development, and until now most of the work they have been doing has been in a different area to the bits I have been doing. Sharing and merging code was done by email patches. Those developers weren’t using version control as far as I’m aware. So given the volume of changes and the number of merges that were happening, it was well past time to get something proper in place that we could all use. The original plan was to go with an installation of TFS to handle all of these issues for us. Personally, I am not a huge fan of TFS. The experience I’ve had with it so far hasn’t been great. It also has a shocking effect on the speed of my IDE (I seem to have no choice but to use integration with the IDE, which again isn’t great). To cut this part of the story short, we had issues getting TFS to work. We tried installing a few times, tweaking here and there, but we never managed to get it to work. I know I could have called a TFS guru, such as Snagy to pick his brains and perhaps ask him nicely to help out, but he’s a busy man and there’s no guarantee that we wouldn’t have to start again from scratch. I wasn’t really up for that, and neither was my boss. So I told him that I thought it might just be easier to get a server running with Mercurial for the version control, and Trac for issue tracking and project “stuff”. Not only would it mean that I could just push my local repository to the server and have the entire history transferred (TFS would have been latest version only) but it would save us a substantial cost in license fees, remove the need for VS integration, and everyone could be up and running with a DVCS in no time. My boss, being the legend he is, gave me the thumbs up! Awesome. So the rest of this post is dedicated to what was involved in getting things set up. If you’re not interested, then go read something else :) The need for a bit of security Needless to say, the IP that we’re building is something that my employer is rather protective of! And rightly so. Hence it won’t come as a surprise to hear that security of this information is very important. I decided that having Mercurial run over plan old HTTP would be a bad idea. I was keen to have it tunnel via SSH, and have all clients authenticate using their own private keys. Hence, getting an SSH server was going to be part of the setup. Web server IIS is already installed on the server, and running another web server seemed like overkill. I didn’t want to expose tracd directly over the web as it doesn’t support SSL, so I wanted to get it running under IIS instead. This added another little bit of complexity to the install. What to download There were quite a few bits that I needed to download to get this working, they’re listed below. At first it might not be obvious as to why these things are needed, just trust me :) First, server-side components: Python 2.5.4 - Get this version, not anything earlier or later if you want this guide to work! (download) Setuptools (download) ClearSilver (download) PySqlite (download) flup (download) Trac installer v0.11.4 (download) Mercurial (download) Subversion (download) Apache Tomcat AJP Isapi filter (download) Junction (download) CopSSH (download) Windows Server 2003 Resource Kit (download) Next, client-side: Mercurial (download) PuTTy (download) Quite a lot isn’t it :) Server: Setting up the Python Environment Execute the Python installer. This by default installs Python to C:\python25. Modify the environment variables so that the Python install folder is included in the PATH. Execute the Setuptools installer. Execute the PySqlite installer. Install the downloaded python eggs: Open a command prompt Navigate to the folder where your .egg files are downloaded to. in the command line, type: easy_install [filename.egg]. Do this for ClearSilver and flup. At this point, you should have a working installation of Python 2.5.4 with the required eggs and plug-ins. Server: Setting up Mercurial Execute the Mercurial installer. By default this installs to %programfiles%\Mercurial. Feel free to change this if you like. During the installation, the installer will ask if you want to include the install folder in the system PATH. Make sure you click “yes”, otherwise you’ll have to do it manually afterwards. The Mercurial client is now installed. Later on when installing Trac and getting it to work with Mercurial, I had issues because the Mercurial doesn’t install the Mercurial bindings for Python. No only that, trying to use easy_install to install it didn’t work because I didn’t have Visual Studio 2003 installed on the server (nor did I want to install it!). It turns out that you can get round the issue by doing this: Go to the Mercurial installation folder using Windows Explorer. Locate the file Library.zip. Open this file with an application like WinRAR or 7-zip (using the built-in Windows zip functionality doesn’t work!). Inside that archive there is a folder called mercurial. Extract this folder to a disk. Open another Windows Explorer and navigate to your Python installation directory (eg. C:\Python25). Open up the Lib sub0folder (that’s lib, not libs). Copy or move the extracted mercurial folder to the lib folder. Done! You’ve just “installed” the Mercurial bindings for Python. Later down the track, Trac will not crap out when you try and use it! Server: Setting up TracMercurial Given that we’re using Mercurial for the back-end version control, we’re going to need to set up and install the Mercurial plugin for Trac. This is where the need for SVN comes in. Yes, it’s ironic that you need SVN to get something working with Mercurial! Just do it, ok!? Execute the Subversion installer and let it go through with the default installation. Make sure that the path to the SVN binaries is included in the system PATH environment variable. Open up a command prompt and change directory to a temporary location. run the command: svn co http://svn.edgewall.com/repos/trac/sandbox/mercurial-plugin-0.11 - this gets the right version of the plug-in from source. run the command: cd mercurial-plugin-0.11 run the command: python setup.py bdist_egg - this creates an installable python egg. run the command: python setup.py install - this installs the plug-in to the global location. The TracMercurial plug-in is now installed. We’ll need to configure it slightly when we’ve installed Trac. That information is listed in the next section. Next we need to create a repository which will be used to house our source code. We’ll pretend we’re creating a project called “Slartibartfast”. Create a new folder on the file system somewhere meaningful, such as C:\Repos. Open a command window, and change directory to that folder. create a folder for your project: mkdir Slartibartfast. Change to that folder: cd Slartibartfast. Initialise the repository: hg init . (note the ‘.’ at the end). Your repository is now ready for code! Server: Setting up Trac We’ll start with the basic install: Execute the Trac installer. Default installation settings are fine. It will be installed to the scripts folder under the Python installation folder. At this point it’s a good idea to also add the scripts folder to the system PATH. This gives us the ability to run Python scripts from anywhere. Next up, let’s create a Trac project for our Slartitbartfast project. Create a folder to house your Trac projects, say C:\Trac Open a command window and change directory to your Trac projects folder. Create a folder for your new project: mkdir Slartibartfast Change to that folder: cd Slartibartfast. Start the Trac administration application to start an interactive setup session: trac-admin . initenv You need to fill out some values as it asks for them. Here’s a sample interactive session that I did as a test run: C:\Trac\Slartibartfast>trac-admin . initenv Creating a new Trac environment at C:\Trac\Slartibartfast Trac will first ask a few questions about your environment in order to initialize and prepare the project database. Please enter the name of your project. This name will be used in page titles and descriptions. Project Name [My Project]> Slartibartfast Please specify the connection string for the database to use. By default, a local SQLite database is created in the environment directory. It is also possible to use an already existing PostgreSQL database (check the Trac documentation for the exact connection string syntax). Database connection string [sqlite:db/trac.db]> Please specify the type of version control system, By default, it will be svn. If you don't want to use Trac with version control integration, choose the default here and don't specify a repository directory. in the next question. Repository type [svn]> hg Please specify the absolute path to the version control repository, or leave it blank to use Trac without a repository. You can also set the repository location later. Path to repository [/path/to/repos]> C:\Repos\Slartibartfast Creating and Initializing Project Installing default wiki pages ** ** craploads of import statements go here ** ** --------------------------------------------------------------------- Warning: couldn't index the repository. This can happen for a variety of reasons: wrong repository type, no appropriate third party library for this repository type, no actual repository at the specified repository path... You can nevertheless start using your Trac environment, but you'll need to check again your trac.ini file and the [trac] repository_type and repository_path settings in order to enable the Trac repository browser. --------------------------------------------------------------------- Project environment for 'Slartibartfast' created. You may now configure the environment by editing the file: C:\TracProjects\Slartibartfast\conf\trac.ini If you'd like to take this new project environment for a test drive, try running the Trac standalone web server `tracd`: tracd --port 8000 C:\TracProjects\Slartibartfast Then point your browser to http://localhost:8000/Slartibartfast. There you can also browse the documentation for your installed version of Trac, including information on further setup (such as deploying Trac to a real web server). The latest documentation can also always be found on the project website: http://trac.edgewall.org/ Congratulations! You may notice the message: Warning: couldn’t index the repository. Don’t be too concerned at this point, as we need to do a bit more to make sure that the Mercurial stuff is working. Now we should test to make sure we’re able to start the Trac daemon and see if the project site has been set up. We do that by executing the statement they suggested in the output: tracd –port 8000 C:\TracProjects\Slartibartfast Then we browse to http://localhost:8000 to see if it works! If all goes well you should see a project listing. Click on Slartibartfast and you should see something like this: Trac is telling us why it’s not able to index the repository, it’s because we haven’t enabled the plug-in yet. Let’s do that now. Open up the Trac.ini file which is located inside the conf folder under the main project folder (eg C:\Trac\Slartibartfast\conf\Trac.ini). First, add the following section to the ini file: [hg] # -- Show revision number in addition to the changeset hash show_rev = yes # -- Changeset hash format node_format = short # hex: Show the full SHA1 hash # short: Show a shortened hash for the changesets Then enable the Mercurial plugin by adding the following: [components] tracext.hg.backend.csetpropertyrenderer = enabled tracext.hg.backend.hgdefaultpropertyrenderer = enabled tracext.hg.backend.hgextpropertyrenderer = enabled tracext.hg.backend.mercurialconnector = enabled Note:Make sure that the [hg] and [components] sections don’t already exist. If they do, then add the respective lines to the existing sections rather than creating new ones. For a fresh install, these sections shouldn’t already exist, so you should be safe to add them. Kill the tracd instance by press CTRL+C, then restart it (press the up arrow, then enter). Refresh your browser window and this time you should see this: Excellent, our project is up and our repository is able to be read. We’re done! Server: Setting up the Trac Daemon as a Service The tracd needs to run as a service. This is to make sure it’s always running in a way that IIS can reference it. Given that we’re later going to be hooking this up to IIS, we need to make sure it uses the AJP protocol. Here are the required steps: Install the Windows 2003 resource kit. Open a command window, and navigate to where the resource kit binaries are installed. On my system that was at C:\Program Files\Windows Resource Kits\Tools Create a service called “Trac” by executing the following command: InstSrv Trac “C:\Program Files\Windows Resource Kits\Tools\SrvAny.exe” - (note the use of the full path is necessary for this to work). Next we need to hack the registry a little to pass the right parameters and have the tracd started. Open regedit. Go to HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\Trac Create a new sub-key called Parameters Inside this new sub-key, create two new values: Application of type String. Set the value to the full path of python.exe. Eg C:\python25\python.exe AppParameters of type String. Set the value to C:\python25\Scripts\tracd-script.py –port 8009 C:\Trac\Slartibartfast - (note the change of port number, it’s there for a reason we’ll cover shortly). Open the services tool from the Control Panel, find the Trac service and start it up! Navigate to http://localhost:8009 to make sure it still works. If you get the same site as you did before, then all is going well. If not, then you revisit the steps to make sure you haven’t missed anything out and that your pointing to the right location of the trac project. Now that'''
