["https://buffered.io/posts/csaw-2014-saturn"]
title = "CSAW 2014 - Saturn · OJ Reeves"
description = "This post contains a detailed account of how I solved the Saturn exploitation challenge during CSAW 2014 CTF. I thought that this challenge was very entertaining, hopefully you will too."
full_description = "CSAW 2014 - Saturn Published 2014-09-22 by OJ Reeves Read time: 32 min This post contains a detailed account of how I solved the Saturn exploitation challenge during CSAW 2014 CTF. I thought that this challenge was very entertaining, hopefully you will too. Introduction The challenge, worth 400 points, is the second-last in the list of exploitation challenges on the page. When selected, we’re presented with a download link to a binary called saturn and the following description: You have stolen the checking program for the CSAW Challenge-Response-Authentication-Protocol system. Unfortunately you forgot to grab the challenge-response keygen algorithm (libchallengeresponse.so). Can you still manage to bypass the secure system and read the flag? nc 54.85.89.65 8888 Written by crowell Once downloaded, we take a look at the details of the file: $ file saturn saturn: ELF 32-bit LSB executable, Intel 80386, version 1 (SYSV), dynamically linked (uses shared libs), for GNU/Linux 2.6.24, BuildID[sha1]=0xa55828fef5637b04d127681ada4a06b332d54a9c, stripped The binary is an x86 (hooray!) ELF but has been stripped (booo) which means general analysis in gdb isn’t going to be pleasant. On attempting to run this binary we get an error printed to the console: $ ./saturn ./saturn: error while loading shared libraries: libchallengeresponse.so: cannot open shared object file: No such file or directory Just like the instructions indicated, we don’t have the required library libchallengeresponse.so handy and so we can’t run it. Let’s see which functions it depends on by using objdump: $ objdump --dynamic-reloc ./saturn ./saturn: file format elf32-i386 DYNAMIC RELOCATION RECORDS OFFSET TYPE VALUE 08049ffc R_386_GLOB_DAT __gmon_start__ 0804a060 R_386_COPY stdin 0804a080 R_386_COPY stdout 0804a00c R_386_JUMP_SLOT read 0804a010 R_386_JUMP_SLOT printf 0804a014 R_386_JUMP_SLOT fflush 0804a018 R_386_JUMP_SLOT fclose 0804a01c R_386_JUMP_SLOT __stack_chk_fail 0804a020 R_386_JUMP_SLOT fwrite 0804a024 R_386_JUMP_SLOT fread 0804a028 R_386_JUMP_SLOT puts 0804a02c R_386_JUMP_SLOT __gmon_start__ 0804a030 R_386_JUMP_SLOT exit 0804a034 R_386_JUMP_SLOT __libc_start_main 0804a038 R_386_JUMP_SLOT fopen 0804a03c R_386_JUMP_SLOT fileno 0804a040 R_386_JUMP_SLOT fillChallengeResponse All of the functions above look to be fairly standard impors from the likes of libc, except for fillChallengeResponse. My guess here was that this is the only function that is included in the missing library, so removing the dependency shouldn’t cause too many issues. To fix up the binary to allow it to function we need to: Patch the binary so that it no longer depends on this library. Stub out any function calls to this library in the code. Preparing the Binary I used patchelf to remove the reference to the library from the saturn binary using the --remove-needed switch, like so: $ ./patchelf --remove-needed libchallengeresponse.so ./saturn When we run the binary now, we get a different error: $ ./saturn ./saturn: symbol lookup error: ./saturn: undefined symbol: fillChallengeResponse So we have removed the dependency on the library, but as suspected we need to remove references to the function call. It’s time to fire up IDA to see where the fillChallengeResponse function is used. I used the Pro version but I believe you can use the community version as well. Bear in mind that some of the interface to the community version is probably going to be a little bit different, but you should still be able to follow along if you don’t have Pro. With the binary loaded, we can see the full list of functions in the functions window. This list includes the fillChallengeResponse response function: Selecting _fillChallengeResponse in the function list takes us to the location in the code where the import is invoked. Using IDA’s Xref functionality we can find where this function stub is called by pressing X: Double-clicking the only entry in the list takes us to the source of the call, which shows some interesting functionality: From this disassembly we can infer the following about the fillChallengeResponse function: It’s probably a cdecl function. It takes two parameters passed via [esp] and [esp+4] (remember that the top of the stack contains the first parameter). The two parameters, off_804a050 and off_804a054 passed in are addresses to areas of memory, which implies that the call to the function is going to fill this memory with values. The return parameter indicates success or failure of the function. We can confirm this last point by looking at the contents of the branch for when the return value (coming via EAX) is -1 (aka 0FFFFFFFFh): On failure, the program exits with a status code of 1. Given that the function is called fillChallenageResponse it’s probably safe to assume that the two parameters are for the challenge and response buffers, respectively. Running along with this assumption, I renamed these values in IDA so that I could easily recognise them later. Once renamed, we can see where they live in memory by double-clicking on one of them. On doing this I renamed the buffers that the pointers pointed to in IDA, again to make it easy to recognise: One thing that is interesting about these values is that they are 0x20 bytes in size: This implies that they are arrays of data that are to be populated and hence the challenge / response component generates 32 bytes of data, each. Keep this in mind as it’ll become important later on. Going back to our function call site, we can patch the bytes directly in IDA so that the function call no longer happens. However, we need to bear in mind that the last part of this functionality is jnz short loc_8048AAC. This is a conditional jump at this point, but we need to make it standard jump so that this code path is always taken. That is, we want to change the JNZ to a JMP. To do all of this this, we right-click on the address 08048A84 and select Synchronize with -> Hex view-1. We can switch over to Hex View-1 and see the contents of memory at the location we want to change. From 8B at location 08048A84 through to the FF located 08048A9C, we need to modify these bytes so that they’re all NOP instructions. We go from this: To this: Notice how the very last modified byte has not been set to 90, but instead it’s set to CC. This instruction is a software breakpoint instruction, so when a debugger is attached the debugger will break. This is a little trick I like to apply to binaries like this so that they’re easier to debug behind other applications, such as netcat. When I first attempted to exploit this I didn’t write the breakpoint byte into the binary, but later on I came back and added it to make debugging easier. To save you this pain, I thought I’d add it during the first pass. More on this later when it comes time to debug. Finally, to modify the jump, we need to change the next byte, which is 75, to EB, as this is the opcode for a JMP SHORT instruction. We can’t use straight F2 to edit because we’re not just typing numbers in, so instead we have to use Edit -> Patch program -> Change byte..., like so: Hit OK to apply the change. We need to then write the changes back to the input file by choosing Edit -> Patch program -> Apply patches to input file.... The dialog box that appears asks us to specify the range of changes to write, and so to make sure we’re getting all the changes we’ve made, we’re going to specify the entire address range: With the patches applied, the disassembly of the function call site now looks like this: We can see all the references have been removed, and the jump at the end is not conditional. We can now copy this binary back to Linux to see if it runs. However, we can’t just run it by itself, because if we do, it will crash thanks to the CC instruction we added. So to validate that it works, we can run it via gdb: $ gdb ./saturn ... snip ... [-------------------------------------code-------------------------------------] 0x8048a9b: nop 0x8048a9c: nop 0x8048a9d: int3 => 0x8048a9e: jmp 0x8048aac | 0x8048aa0: mov DWORD PTR [esp],0x1 | 0x8048aa7: call 0x80486a0 <exit@plt> | 0x8048aac: mov DWORD PTR [esp],0x8048be4 | 0x8048ab3: call 0x8048680 <puts@plt> |-> 0x8048aac: mov DWORD PTR [esp],0x8048be4 0x8048ab3: call 0x8048680 <puts@plt> 0x8048ab8: mov eax,ds:0x804a080 0x8048abd: mov DWORD PTR [esp],eax JUMP is taken [------------------------------------------------------------------------------] ... snip ... Excellent! The application now runs, and hits our breakpoint instruction. We can see the NOP instructions leading up to it, and the JMP instruction immediately after which leaps over the exit call. When we type c to continue, we get: gdb-peda$ c Continuing. CSAW ChallengeResponseAuthenticationProtocol Flag Storage The application is now waiting for input on stdin. If we type a couple of characters from the keyboard we’ll see the application terminate. However, we know that it’s running and we’re ready to begin debugging. A Note on LD_PRELOAD I’ve had a few people ask me why I didn’t just use LD_LIBRARY_PATH/LD_PRELOAD with a custom library. The short answer is that I did try it, but for some reason it wouldn’t work on my machine (could be a Fedora thing, not sure). At some point I’ll dig into it to see what is wrong, it could just be that I was doing something stupid. However, in the middle of a CTF when time is precious, debugging my environment wasn’t something I was up for. Instead, I changed tact and went with patching the binary this way. While it might seem like it was a bit of an epic job, the process of patching took just a couple of minutes. Debugging the Binary As we can see from the above run in gdb, the program reads from stdin and writes to stdout. However, when we connect to it over a network, we need to talk via sockets. In order to simulate this scenario, and allow us to create an exploit which we don’t have to modify when we target the remote host, we need to get this application running behind a socket. One of the things that is particularly annoying about such challenges is that they’re a pain in the butt to debug behind the likes of xinit. Instead, what I do is hide it behind a backgrounded instance of netcat set up to constantly accept new connections on the same port as the live target, like so: $ nc -l -p 8888 -e ./saturn -k & [1] 789 Your version of nc might be different to mine, but the command line above says -l: Bind and listen for incoming connections. -p: Specify the source port which is 8888. -e: Executes the given command, which maps stdin and stdout for saturn to the socket. -k: Accept multiple connections in listen mode (aka “keep open”). The backgrounded process’ ID is rendered to screen, in this case it’s 789, and we can use this ID to attach to it via gdb: $ gdb -p 789 GNU gdb (GDB) Fedora 7.6.1-46.fc19 ... snip ... gdb-peda$ c Continuing. To make sure this is working, we launch an nc client and connect to the port: $ nc localhost 8888 Then in gdb: [New process 30599] ... snip ... [-------------------------------------code-------------------------------------] 0x8048a9b: nop 0x8048a9c: nop 0x8048a9d: int3 => 0x8048a9e: jmp 0x8048aac | 0x8048aa0: mov DWORD PTR [esp],0x1 | 0x8048aa7: call 0x80486a0 <exit@plt> | 0x8048aac: mov DWORD PTR [esp],0x8048be4 | 0x8048ab3: call 0x8048680 <puts@plt> |-> 0x8048aac: mov DWORD PTR [esp],0x8048be4 0x8048ab3: call 0x8048680 <puts@plt> 0x8048ab8: mov eax,ds:0x804a080 0x8048abd: mov DWORD PTR [esp],eax JUMP is taken [------------------------------------------------------------------------------] ... snip ... This is looking very familiar. When we hit c again in gdb, the process continues and we see the nc client receive the prompt appear: $ nc localhost 8888 CSAW ChallengeResponseAuthenticationProtocol Flag Storage Now that our environment has been configured and is ready to debug, proper analysis of the behaviour can begin. It’s worth noting at this point the reason why the CC breakpoint was added to the binary in the first place. Without this hard-coded breakpoint I wasn’t able to get gdb to break when the new child starts. I’m sure there’s a way, but I couldn’t find it in the documentation. This means that I’m not able to set breakpoints inside the code for saturn at all, because doing it once attached to the process fails due to the fact that the saturn binary hasn’t yet been loaded. Instead, the hard-coded breakpoint forces gdb to break on the entry-point, allowing me to get my breakpoints before it continues. It’s hacky, but it works! The only frustration left is that each time a connection is made, gdb follows the child process and hence the debug session dies with it. This is fine, because we can easily reconnect to the parent process and go again by typing attach 789 into the gdb console. Time to analyse the behaviour of the application. Binary Analysis of Challenge Extraction This is where the fun starts. We begin by going back to IDA, and looking at some of the basic flow around the application where the banner is rendered: The first section of this code is rendering the challenge banner to screen and flushing stdout. It then moves on to set a local flag variable (located at 1Ch) to 0 and jumps to the next location. That flag variable is then checked to see if it’s 0, and if it isn’t then the branch to the right is taken and the program terminates. This flag appears to be used later in the code as a means to tell the code to terminate some kind of loop. In our case, the flag has just been set to 0 and hence the left branch is taken where a function is immediately called. Double-clicking on this function name shows us its body, and it simple reads in a single byte from the input stream, and returns it in EAX so that the caller can handle it. Given that the purpose of this function is quite clear, I renamed it in IDA like so: With the single byte now accessible in EAX, the function returns and control is passed back to the caller where that byte is stored in a local variable at esp+1Bh. This value is then masked with 0F0h and compared against 0A0h, and if it matches the following branch is taken: Here we can see that a new function is being called with a single parameter passed in via [esp], and this value is the byte that was read off the wire. So at this point we can assume that the body of this main function is a simple dispatch loop for a protocol of some kind. So when the caller passes in a byte which matches the above condition, a new function is called. The body of which looks like this: The two things that immediately jumped out at me here were: buf_challenge_offset is being accessed at 08048873. Something that looks like a 32-bit hex value is being outputted to screen at 080488D0 At first it looks like a challenge value is being read from the challenge buffer and sent to the caller as a 4-byte block. Deeper analysis of this function confirms this (we’ll see it in the debugger in just a minute). However, there’s one other thing that’s inte"
