full_description = ".NET MVC Published 2007-03-28 by OJ Reeves Read time: 2 min Isn’t it amazing how life can just hit turbo without prior warning, and your time seems to just disappear! I need to find some way of sticking blogging back into my routine :) For the last couple of weeks I’ve been playing around a fair bit with Ruby and Rails. I’ve been having a great deal of fun at the same time, and I recommend it to any of you who are thinking of taking up some of your own time with learning web development. It’s really good fun, it’s interesting, and it’s a great platform for building web apps on. Sure it has its pitfalls (as do all web development options), but it’s a worthy contender and it’s only going to get better. More on that in another post ;) The reason I mentioned it is because of the news that ASP.NET has an MVC framework in the works, which looks like it’s going to be very similar to the way Rails works. I think this is a good thing as it’ll force people to move away from an (possibly) unnecessary MVP approach (for most things) and work with a well-structured MVC (which a surprising amount of developers don’t yet know about!). No doubt this is another effort by Microsoft to rip off some code from another established project and claim it as their own, but still if it works and works well, then I’m not really complaining. Anyway, what do you guys think? Is this a good or a bad thing? Twitter Facebook Google+"
