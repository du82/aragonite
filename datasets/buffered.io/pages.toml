["https://buffered.io/posts/the-future-is-erlang"]
title = "The Future is Erlang · OJ Reeves"
description = "For quite a while I’ve been using my spare cycles to chew over a problem. This problem is not one that hasn’t been solved before, but one that I feel can be solved in a much better way. From the bit of research that I’ve done, I can see at least three areas which can be improved on dramatically. So I’ve decided, after a long period of deliberation, to go ahead and build my solution and release it to the world as a service!"
full_description = "The Future is Erlang Published 2009-10-31 by OJ Reeves Read time: 3 min For quite a while I’ve been using my spare cycles to chew over a problem. This problem is not one that hasn’t been solved before, but one that I feel can be solved in a much better way. From the bit of research that I’ve done, I can see at least three areas which can be improved on dramatically. So I’ve decided, after a long period of deliberation, to go ahead and build my solution and release it to the world as a service! I know, this kind of thing happens thousands of times a day. Some arbitrary geek decided to build the next killer app and expects to make a crapload of cash out of it. While that would be nice, the ultimate goal isn’t the cash. The goal for me is to build something that gets used, and for me to begin to master an area of technology that I’ve had a quiet passion for for a long period of time now. My plan is simple. While learning the technologies that I will be using I’ll be building another application and blogging about it so that all of you can learn with me. Meanwhile, I shall use my learnings to build this other application at the same time. The final result should be a series of posts which help other people learn the technology stack, give better coverage and visibility to languages and technologies that a lot of the geek world doesn’t know about (and really should!), and for me to carve myself a bit of a niche here on the East coast of Ozland. I am hoping to be able to consult my services out to other businesses as a result. For those that are interested in following along, here is the full tech stack and toolset that I’ll be using: Erlang - A fantastic cross-platform functional programming language that has some amazing features. Webmachine - A HTTP toolkit which sits on top of Mochiweb that makes it easy to build well-behaved HTTP applications. Nitrogen - An Erlang-based framework that makes it easy to build websites. Riak or CouchDB - Both of these amazing pieces of tech are potential candidates for the back-end storage. I'm not yet sure which one I'll go with. jQuery - A great JavaScript library for the front-end. VIM - My favourite text editor :) Xubuntu - Ubuntu Karmic Koala with XFCE as the window manager. Mercurial - My favourite version control system. Trac - A project tracking tool. VirtualBox - My choice for virtualisation. I tend to run Windows 7 as my primary OS, so most of my dev will be in a VM. When I get my desktop machine back up and running (with all three monitors!) it'll most likely multiboot Win 7 and Xubuntu. Google Wave - I'll be using this for communications with some really switched on people in the Erlang community who have kindly offered to help me with questions and whatnot specific to some of the areas of tech I've mentioned above. During the course of my blogging/learning I’ll be focussing on Webmachine, Riak/CouchDB, Erlang and Nitrogen. All the other tools will probably get mentioned along the way, but the primary goal is to focus on these things. I’m really excited! I’m currently in the process of documenting my goals and the design for the main application. Once that’s done, I’ll get started with the fun stuff. I’ve got a lot to do and it should be a fun ride. I hope you enjoy following along! Twitter Facebook Google+"
