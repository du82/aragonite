["https://buffered.io/posts/pcs-for-the-family"]
title = "PCs for the Family · OJ Reeves"
description = "I know for sure that many of the geeks out there on the World Wide Wibbly have the “fun” task of sorting out every possible computer issue for any/all of their family and friends in the cases where they’re not geeks themselves. I am one such geek, and I’ll be honest and say that I do not mind helping out. It’s actually a bit of fun! I starting pondering thoughts on this topic when I stumbled across Roy’s MomPC blog post a week or two ago."
full_description = "PCs for the Family Published 2006-11-09 by OJ Reeves Read time: 5 min I know for sure that many of the geeks out there on the World Wide Wibbly have the “fun” task of sorting out every possible computer issue for any/all of their family and friends in the cases where they’re not geeks themselves. I am one such geek, and I’ll be honest and say that I do not mind helping out. It’s actually a bit of fun! I starting pondering thoughts on this topic when I stumbled across Roy’s MomPC blog post a week or two ago. I read the post with interest and think that it’s quite a handy little reference for those people looking to achieve the same thing. By the same token, I think there are some gaps in what was said. I also think that there’s a fundamental flaw in the assumption that Windows XP has to be used as the operating system. I’ll get onto that point a bit more in a moment, but for now I’d like to comment on a few other options that Roy hasn’t covered. Firewall The main reasons for having a software firewall on Windows is to prevent nasty trojans from getting out to do their thing, and to prevent other trojans and script kiddies (skiddies) from getting in. Windows Defender is indeed one option, but it’s not the only one. Tiny Firewall is a nice option (though it looks like it might not be supported any more!) which is free for home use, and there’s always ZoneAlarm which is also free for home use. These two do a good enough job as well. The latter has improved somewhat now that it no longer “phones home” while protecting you :) Antivirus I’ve never been a huge advocate of AVG, so I don’t agree with Roy on this point. Instead I have found that both the 32 and 64-bit versions of Avast do a very good job of keeping the baddies at bay. I’ve been using this for well over a year now at home, and I have nothing but good things to say about it. People’s experiences do vary though, so take my comments with a grain of salt. If you’re looking for a freebie that’s good, then Avast is a winner. Email I’d strongly recommend the use of Thunderbird for all email-based stuff. This removes the need for having Outlook and/or Outlook Express installed at all. It’s got a built-in news reader and RSS feed reader, and is basically a fabulous comms application - better yet it’s a freebie! Office Applications For most home users, I personally feel that buying a licenced copy of Microsoft Office is overkill. People write a letter here and there, they might open a few word docs that are downloaded off the web, or want to open up some crappy powerpoint presentation with the latest “fluffy bunnies in tu-tus wishing you wealth, happiness and friendship for the rest of your days” accompanied with some cheezy music and awful text animations. At the end of the day, OpenOffice is more than sufficient for these purposes. Again, it’s free software, it has fairly regular releases (given that it’s a rather large application) and it’s cross-platform too. I can’t see the need to go for another office application which costs a fortune when 9 time out of 10 this will suffice. Of course, there are cases where people need more than just a standard word processor. OpenOffice has its quirks and pitfalls, and if you’re looking to go for a package with a lot of functionality then MS Office might just be on the cards for you. Browser FireFox. ‘Nuff said. The Key Point - What Operating System? As I stated at the start of this post, I’m not really sure why Windows XP has to be the default installation for a family PC. The big thing that most people will focus on here is usability, followed closely by the range of software and support for things such as scanners, digital cameras and MP3 players - which you can’t argue with to a point. In Roy’s case, I think Windows XP is unnecessary. I think a default installation of Ubuntu with all the required software set up would be more than enough for the default family PC. It’d be a lot easier to secure, wouldn’t require constant maintenance and reinstalling every few months like Windows does, and doesn’t cost a bean. Ubuntu with FireFox, Thunderbird, OpenOffice and perhaps a few games (Solitaire, Mahjongg, etc) would keep the average non-geek family member amused for hours, and would probably cover most, if not all, of the things that the users want to do. The set up of a software firewall wouldn’t be so much of an issue since there’s very little (to no) malware that runs on Linux, hence it’s probably not needed. You don’t need to run antivirus software (though I still think you should) on Linux as 99.99999% of viruses are targetted at the Windows platform. Finally, auto-updates are on by default which means the OS keeps itself up to date just like the Auto-update feature of Windows. Bring on Ubuntu installs for the family I say! There’s no need to give yourself the extra workload of maintaining a family Windows machine when it doesn’t have to have Windows running on it. Do yourself, and your family a favour - get yourself a Linus distro, and just see how much longer it lasts before you have to blast it away and reinstall from scratch. Twitter Facebook Google+"
