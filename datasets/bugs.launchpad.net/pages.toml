* 1 simple backports from upstream

[Test Plan]

* Compile tested
* Boot tested
* Will be further tested by Microsoft

[Regression potential]

* Changes are largely localized to MANA and hyper-v. scsi change simply ..."""
full_description = "* Microsoft requested patches to implement debugfs in MANA driver to improve debugging in userspace, improve available settings in ethtool, and vmbus enhancements to fix potential hang and improve throughput * Changes are largely localized to MANA and hyper-v. scsi change simply initializes as variable that should have already been initialized. Most changes have been upstreamed for some months. * Introduction of debugfs to MANA driver could introduce regressions if not well tested. This bug is awaiting verification that the linux-azure-nvidia/6.8.0-1012.13 kernel in -proposed solves the problem. Please test the kernel and update this bug with the results. If the problem is solved, change the tag 'verification-needed-noble-linux-azure-nvidia' to 'verification-done-noble-linux-azure-nvidia'. If the problem still exists, change the tag 'verification-needed-noble-linux-azure-nvidia' to 'verification-failed-noble-linux-azure-nvidia'. If verification is not done by 5 working days from today, this fix will be dropped from the source code, and this bug will be closed. See https://wiki.ubuntu.com/Testing/EnableProposed for documentation how to enable and use -proposed. Thank you!"
