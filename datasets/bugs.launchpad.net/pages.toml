["https://bugs.launchpad.net/bugs/2097573"]
title = "Bug #2097573 “Grace CMDQV Support” : Bugs : linux-azure-nvidia package : Ubuntu"
description = """
SRU Justification

[Impact]

* Microsoft requested patches to support virtual command queues via CMDQV hardware

[Fix]

* 7 clean cherry-picks from upstream
* 5 simple backports from upstream
* 2 patches to enable CONFIG_TEGRA241_CMDQV

[Test Plan]

* Compile tested
* Boot tested
* Will be further tested by Microsoft

[Regression potential]

* Most changes limited to drivers/iommu/arm/arm-smmu-v3/
* One change to generic drivers/iommu/iommu.c code, which required backport. However, this patch..."""
full_description = "* 7 clean cherry-picks from upstream * 5 simple backports from upstream * 2 patches to enable CONFIG_TEGRA241_CMDQV * Most changes limited to drivers/iommu/arm/arm-smmu-v3/ * One change to generic drivers/iommu/iommu.c code, which required backport. However, this patch was upstream, and the conflict was trivial * Choosing to apply an independent patchset to iommu and leaving some context carries some risk that the patchset is dependent on previous patches not yet applied. This regression should be largely mitigated as Microsoft is performing thorough testing on their end. This bug is awaiting verification that the linux-azure-nvidia/6.8.0-1012.13 kernel in -proposed solves the problem. Please test the kernel and update this bug with the results. If the problem is solved, change the tag 'verification-needed-noble-linux-azure-nvidia' to 'verification-done-noble-linux-azure-nvidia'. If the problem still exists, change the tag 'verification-needed-noble-linux-azure-nvidia' to 'verification-failed-noble-linux-azure-nvidia'. If verification is not done by 5 working days from today, this fix will be dropped from the source code, and this bug will be closed. See https://wiki.ubuntu.com/Testing/EnableProposed for documentation how to enable and use -proposed. Thank you!"
