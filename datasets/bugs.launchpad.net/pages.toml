["https://bugs.launchpad.net/+tour"]
title = "Bug tracker for open source and other software projects — Launchpad tour"
description = "Canonical Launchpad Tour - Sharing code means sharing bugs: issues found in free software may originate in code upstream or downstream in a distribution’s packaging. Launchpad tracks how each bug affects different communities and helps you work across project boundaries to find a fix"
full_description = "When projects share free software code they share its bugs. The discussion about how to fix one bug can become fragmented across different reports in multiple trackers. Launchpad brings the discussion to you. At a glance you can see how the bug affects different communities, whether they're tracking it in Launchpad or external tools such as Bugzilla, Trac, Sourceforge or elsewhere. You can even share a comment history across project boundaries and tools, and use Launchpad's API and email interfaces for easy integration with your project workflow. In Launchpad, you can share a bug report and its comment history with other communities interested in finding a fix. Each project — or even different releases within a project — can track its own status, importance and assignee for that same bug report. Even if the bug is tracked elsewhere — such as in Trac, Sourceforge or Bugzilla — Launchpad can monitor its status. Using our bug tracker plugins for Bugzilla and Trac you can share a comment history for the same bug tracked both in Launchpad and an external tracker. And to help find low-hanging fruit, there’s a “Bugs fixed elsewhere” report that shows which of your bugs are marked fixed in other communities. Launchpad helps you bring bugs and fixes together. You can easily see any patches attached to a bug report and you can jump straight to a list of all the bug reports, associated with your project, that have patches. For fixes that require more than a simple patch, you can link directly to the Bazaar branch (including imports from Git, Subversion and CVS) you're working in, allowing everyone interested in the bug to watch your solution evolve or even download your branch, make their own changes and then upload them back to Launchpad for everyone to see. A single URL points to the latest version of the fix and a single command merges it into the project's trunk branch. Manage bug reports entirely through your email client. You can use email to report, subscribe, comment on, assign, prioritise and make just about any other update to bugs tracked in Launchpad. Launchpad will also mail you with updates on any bug you're interested in, whether an individual bug or all the bugs associated with a particular project or package. Read more about the bug tracker's email interface > And, if you prefer, you can also subscribe to bug information in your feed reader with our Atom feeds."
year_published = 2025
clearnet = "https://bugs.launchpad.net/+tour"
