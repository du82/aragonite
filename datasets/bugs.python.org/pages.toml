title = "Issue 1002: Patch to rename HTMLParser module to lower_case - Python tracker"
full_description = '''what is this and other series of patches you have submitted, paulsmith? I fail to understand. Why is the need for changing Library? You are just adding up SPAM here. I am participating in the Python Sprint here at Google, and was just going through the Py3k Sprint Tasks spreadsheet, one of them being to rename standard library modules which use CamelCase to lower_and_underscore, the more modern naming. But your "standalone diffs" will break things and dependencies with other modules, so I was worried about them. Are you taking care of them all? I grep'd for HTMLParser module imports in other standard library modules, renamed, and ran the unit tests. I also updated the mapping in 2to3's fix_imports.py. The only thing I can't do is the actual `svn mv` to rename the module itself. Is part of the problem that this issue was initially flagged as Python 2.6? It's supposed to be 3.0, but that flag wasn't available yesterday when I opened it. orsenthil: that this will break external modules is completely acceptable. Those modules won't work out-of-the-box with Python 3 anyway, and hopefully Paul's patch to 2to3 will alleviate some of the burden. Do note that HTMLParse is slated to become html.parser in 3.0, so these patches are out-of-date. They can be used, though, to possibly help all references to HTMLParser (although 2to3 should handle that). Closing as out of date to try to make the number of PEP 3108 issues more manageable. HTMLParser is becoming html.parser in 3.0.'''
