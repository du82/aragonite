["https://bugs.python.org/issue1028"]
title = "Issue 1028: Tkinter binding involving Control-spacebar raises unicode error - Python tracker"
full_description = "The control-spacebar binding is used in IDLE to force open the completions window. It's causing IDLE to exit with a utf8 decode error. Attached is a Tkinter cut-down exhibiting the problem and a patch. The cutdown runs ok on 2.6 but not on py3k because the latter uses PyUnicode_FromString on all the arguments and errs out when it encounters a character outside the utf-8 range. Strangely, on my system, control-spacebar is sending a two byte string, C0E8 via the %A parameter. Control-2 does the same. Other keys with combinations of modifier keys send one byte. Linux trader 2.6.18-ARCH #1 SMP PREEMPT Sun Nov 19 09:14:35 CET 2006 i686 Intel(R) Pentium(R) 4 CPU 2.40GHz GenuineIntel GNU/Linux Can the problem be confirmed? Using PyUnicode_FromUnicode on %A works because the unicode string is copied instead of decoded, and that parameter is supposed to be unicode, in any case. The patch fixes the problem on my system but should be reviewed, especially whether the cast in the call to PyUnicode_FromUnicode is suitably cross- platform. Assigning to Neal since he's working a lot of Unicode issues right now. I can check it in if I get approval. Heh, I see we have the same damn problem SF had: when a comment is edited, it doesn't re-wrap properly when submitted. You have to remove the returns manually after editing. Sorry, I reverted r57540 because it caused segfault at IDLE exit. (See issue4313) I reopened this issue. Here is a patch that doesn't use magic numbers :P I didn't hit the problem described in issue4313 with this one, and PythonCmd should be doing this anyway, but ideally we should move to Tcl_CreateObjCommand. I confirmed PythonCmd_check_for_utf.diff worked on my machine. IDLE didn't crash. >I can reproduce it here with tk8.4, using tk8.5 doesn't cause this. That is, this is a bug of tk8.4, and solved in tk8.5 which is already stable release? If so, I feel python don't have to workaround this bug. # I'm a little worry about performance because Tcl_NumUtfChars() will be called for every command string. By the way, I cannot reproduce this bug with tk8.4.12(on windows). What is your tk version? Maybe older than that?"
