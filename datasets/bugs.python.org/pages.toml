["https://bugs.python.org/issue6028"]
title = "Issue 6028: Interpreter aborts when chaining an infinite number of exceptions - Python tracker"
full_description = '''def error_handle(): try: print(5/0) except: error_handle() error_handle() Fatal Python error: Cannot recover from stack overflow. Aborted The interpreter should not crash. Perhaps a RuntimeError should be thrown instead. This is normal behaviour, actually. The RuntimeError *is* raised, but you catch it in the except clause and then recurse again ad infinitum. The interpreter realizes that it "cannot recover from stack overflow", as the message says, and then bails out. Hmm, the interpreter should not crash so easily with pyre Python code. (The same code correctly raises RuntimeException wich python 2.x) The issue should be corrected IMO. The exact behavior seem to depend on where the recursion limit is detected: - If it is detected at the beginning of the function (at the start of PyEval_EvalFrameEx) or before the "try" statement, the exception is correctly propagated and displayed. This case always happens with 2.x, and you get the same on 3.0 if you add for example str([[[[[[[[]]]]]]]]) at the beginning of the function. - The crash occurs when the recursion limit is detected while PyEval_EvalFrameEx calls PyErr_NormalizeException() (in the "why == WHY_EXCEPTION" block). This does not change the control flow: the original exception is simply replaced by the RuntimeError, and nested calls continue 50 more frames. Here is a tentative patch. Amaury, your patch might make some individual cases better, but it won't prevent a FatalError from occurring in all cases. Also, it makes things worse in the following case: def recurse(): try: recurse() except: recurse() recurse() (the script goes into an uninterruptible infinite loop, rather than raising an explicit Fatal error) More useful, IMHO, would be to patch Py_FatalError() so that a traceback is printed. The code you posted causes an infinite loop in the 2.x branch as well. Anyway, I do not see how crashing is a desired result. An infinite loop means the programmer made a mistake somewhere. A crash means the interpreter did.'''
