["https://bugs.python.org/issue1022"]
title = "Issue 1022: use bytes for code objects - Python tracker"
full_description = "This patch has a hack to read in marshaled code objects. Bytes can't be marshaled currently (they are stored as strings). So when reading a marshaled code object, the hack converts them to bytes. All tests except test_modulefinder pass. The issue is that since bytes are mutable, they aren't suitable for code objects since a user could change them at any time. I have security/stability issues with code objects having mutable bytecode. This would allow someone to possibly crash the interpreter with crappy bytecode. I also have a worry that someone might come up with some clever way of causing different code to execute through manipulating what LOAD_GLOBALS or STORE_GLOBALS accesses/sets."
year_published = 2025
