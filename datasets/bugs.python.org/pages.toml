["https://bugs.python.org/issue1528167"]
title = "Issue 1528167: Tweak to make string.Templates more customizable - Python tracker"
full_description = '''Python's $-style templating is wired for optional case-insensitivity under the hood, but doesn't expose this via the API. The attached patch (against trunk/ r50813) adds a new optional argument to turn this behavior on, and includes doc and tests. Logged In: YES user_id=340931 Warning: I've discovered that I introduced a bug. New patch forthcoming. Logged In: YES user_id=340931 I've replaced the patch with one that polishes off a few bugs and ambiguities, with accompanying tests and doc. Logged In: YES user_id=849994 The patch looks very thorough and complete, I will try to look into it after 2.5 is out. Don't let that prevent you reviewing 5 patches, Chad ;-) Logged In: YES user_id=80475 Barry, is this something you want or is it at odds with the notion of "simplified templating"? Logged In: YES user_id=12800 I'm not psyched about the patch. First, I've always thought that case insensitivity ought to be handled by the mapping from which the keys are being extracted and by setting the idpattern. Second, I definitely don't like adding the case_sensitive argument to substitute() and safe_substitute(). Because it lives in the same namespace as kws it makes for icky rules on resolving any conflicts. Is there a reason why the existing mechanisms are insufficient? Logged In: YES user_id=340931 Thanks for your responses, all. > Is there a reason why the existing mechanisms are > insufficient? The problem is kws: you can't customize it from the outside like you can the mapping argument. If we replaced _multimap with mapping.update(kws), then we'd have our hook and I think I'd be satisfied. Would you be any more psyched about that patch? :) Logged In: YES user_id=340931 Ok, here it is! I added a test but wasn't sure this warranted a doc change. Cf.: http://docs.python.org/dev/lib/node40.html Logged In: YES user_id=80475 The replacement of _multimap is a semantic change. Formerly, a dictionary passed in as a positional argument is left unmolested; now, it is mutated to reflect kwds. Also, the _multimap setup is an O(1) step while the update() approach is O(n). Also, the current implementation only requires the positional argument to support __getitem__(); now, it requires a more fully compliant duck (one that provides an .update() method). - mapping = _multimap(kws, args[0]) + mapping = args[0] + mapping.update(kws) Current behavior: >>> t = Template('the $speed brown') >>> d = dict(speed='quick') >>> t.safe_substitute(d, speed='slow') 'the slow brown' >>> d {'speed': 'quick'} After the patch, it returns {'speed': 'slow'}. Likewise the following now works, but would fail after the patch: >>> t = Template('the $speed brown') >>> class D: def __getitem__(self, key): return 'quick' >>> t.safe_substitute(D(), speed='slow') 'the slow brown' The whole approach is misguided, and the use case itself is suspect. If some change is warranted, consider a cleaner, more general-purpose solution like having an optional key= argument to the Template constructor for pre-processing keys: >>> t = Template('the $speed brown', key=str.lower)'''
