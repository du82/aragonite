title = "Issue 1006: Refactor test_winreg.py to use unittest. - Python tracker"
full_description = '''This patch refactors test_winreg.py to use unittest. When this patch is applied, Lib/test/output/test_winreg can be removed. I also made a few formatting changes to ensure that all lines are constrained to 80-characters. The original test_winreg.py took a command-line argument, "--remote", to specify the name of a remote computer to run tests on. For now, I've added a unittest test called "testRemoteMachineRegistryWorks" which raises a test_support.TestSkipped exception if the "--remote" argument wasn't specified. I'm not sure if this is optimal behavior; it can be changed if not, of course.'''
