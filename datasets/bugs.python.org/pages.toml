["https://bugs.python.org/issue47204"]
title = "Issue 47204: Ensure PyEval_GetGlobals() doesn't set an exception when returning NULL - Python tracker"
full_description = '''While working on the first PR for bpo-44800 I provoked an obscure failure in PyImport_ImportModule by making PyEval_GetGlobals set an exception when returning NULL (as PyEval_GetLocals has done since bpo-18408 was implemented for Python 3.4). This ticket covers adding an embedding test case that: * ensures PyEval_GetGlobals() returns NULL without an exception when no Python frame is active * ensures PyEval_GetLocals() returns NULL and sets an exception when no Python frame is active * ensures PyImport_ImportModule still works when no Python frame is active There's an option to slightly change the behaviour of `PyEval_GetLocals()` to NOT set an exception in the "no Python frame" case, and instead only set the error when there is a Python frame, but something goes wrong when attempting to access the fast locals array (such as a memory allocation failure). Core dev forum thread for the C API question: https://discuss.python.org/t/subtle-c-api-discrepancy-pyeval-getlocals-vs-pyeval-getglobals-with-no-python-frame/14797'''
year_published = 2025
clearnet = "https://bugs.python.org/issue47204"
