["https://bugs.python.org/issue1033"]
title = "Issue 1033: Support for newline and encoding in tempfile module - Python tracker"
full_description = "It would be useful for tempfile.TemporaryFile and friends to pass newline and encoding arguments to the underlying io.open call. For example, several tests in test_csv use TemporaryFile and need to handle unicode file output or preserve exact newlines. This is simpler with direct support in TemporaryFile. The attached patch makes the following changes: 1) tempfile.TemporaryFile, NamedTemporaryFile, and SpooledTemporaryFile now pass newline and encoding to the underlying io.open call. 2) test_tempfile is updated 3) test_csv is updated to use the new arguments. One change I forgot to mention that may need discussion. I've changed the 'bufsize' arguments in tempfile to 'buffering', since that is consistent with the same change in os.fdopen. Thanks! Committed revision 57594. General note: please run Tools/scripts/reindent.py over your files after editing so I won't have to."
year_published = 2025
clearnet = "https://bugs.python.org/issue1033"
