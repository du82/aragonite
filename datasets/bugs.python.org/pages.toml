full_description = "This should be fixed in the docs and also in 3.11. Now that we've shipped releases that include the frame, we should keep doing it. If it's impossible to get a frame object in 3.11 (because it would deoptimize all the work that's been done there), it should pass None. Changing the value of the argument is fine, but changing the schema is not. Message416554 ➜ This issue tracker has been migrated to GitHub, and is currently read-only. For more information, see the GitHub FAQs in the Python's Developer Guide. Author steve.dower Recipients Dutcho, steve.dower Date 2022-04-02.13:14:53 SpamBayes Score -1.0 Marked as misclassified Yes Message-id <1648905293.19.0.88367991843.issue47192@roundup.psfhosted.org> In-reply-to Content This should be fixed in the docs and also in 3.11. Now that we've shipped releases that include the frame, we should keep doing it. If it's impossible to get a frame object in 3.11 (because it would deoptimize all the work that's been done there), it should pass None. Changing the value of the argument is fine, but changing the schema is not. History Date User Action Args 2022-04-02 13:14:53steve.dowersetrecipients: + steve.dower, Dutcho 2022-04-02 13:14:53steve.dowersetmessageid: <1648905293.19.0.88367991843.issue47192@roundup.psfhosted.org> 2022-04-02 13:14:53steve.dowerlinkissue47192 messages 2022-04-02 13:14:53steve.dowercreate"
