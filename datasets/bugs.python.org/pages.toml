["https://bugs.python.org/issue1019"]
title = "Issue 1019: Cleanup pass on _curses and _curses_panel - Python tracker"
full_description = '''*BEFORE* APPLYING THIS PATCH, YOU MUST % svn move Include/py_curses.h Modules/_py_curses.h (A "patch" can't convey that sort of information.) I made a pass cleaning up _curses and _curses_panel. Mainly I cleaned up the header file, moving unnecessary things into the two .c files. I also changed the way information is passed from _curses to _curses_panel. Instead of a Py_CObject which points to functions--which Neil Norwitz suspected could be a security hole--it now passes cleaner information (one type, one int * pointer). Finally, I made a code-cleanup pass as per PEP 7. I tried to run the various demos in Demo/curses/ with the new version. They all work except for xmas.py. Before your patch, they all ran. So I cannot apply this yet. (No time to look into it further, alas.) Unfortunately, the patch is hard to review with all the whitespace cleanup distracting from semantic changes. Can you produce a patch with only those changes? The major reason I undertook this patch was to fix the security hole of the CObject. That entire class of security holes is now fixed by the capsule object. The rest of the diffs aren't interesting enough to worry about. So I'm abandoning my patch.'''
