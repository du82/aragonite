["https://bugs.python.org/issue9305"]
title = "Issue 9305: Don't use east/west of UTC in date/time documentation - Python tracker"
full_description = '''I am opening this to supersede issue7229. See discussion following msg107148. In many places offsets representing the difference between local time and UTC are described as minutes or seconds east or west of UTC. This is not correct because UTC is not a place and minutes and seconds don't measure distance in this context. Replacing UTC with the Prime Meridian will not fix that because some regions in the western hemisphere use positive offsets from UTC. or example, Madrid is at 3° 42' West, but uses Central European Time which is UTC+1. I believe geographical references in the python documentation are irrelevant. What users are interested in is how to convert local time to UTC and UTC to local time rather than what is the sign of time.timezone in Madrid. I suggest the following wording for time.timezone description: time.timezone: The number of seconds one must add to the local time to arrive at UTC. Similarly, tzinfo.utcoffset() can be defined as "Returns timedelta one must add to UTC to arrive at local time." On Mon, Jul 19, 2010 at 7:21 PM, Alexander Belopolsky <report@bugs.python.org> wrote: > > I suggest the following wording for time.timezone description: > > time.timezone: The number of seconds one must add to the local time to arrive at UTC. Makes sense. I can't see any other real explanation for -7200 value if I am in +2 UTC timezone. > Similarly, tzinfo.utcoffset() can be defined as "Returns timedelta one must add to UTC to arrive at local time." I believe the correct convention is "Return timedelta...". Another concern - if UTC is 0 reference point then there is no reason to add something to it - you just can say - "Return timedelta equal to local UTC offset." On Tue, Jul 20, 2010 at 10:46 AM, anatoly techtonik <report@bugs.python.org> wrote: > .. Another > concern - if UTC is 0 reference point then there is no reason to add > something to it - you just can say - "Return timedelta equal to local > UTC offset." No, UTC is not a 0 reference point, it is a time scale. UTC offset is the value that is used to translate between time expressed in UTC and local time. To make an analogy, expressing time in UTC is like expressing temperature in Kelvin scale. You need to subtract 273 from the value in ºK to arrive at the value in ºC. Documenting utcoffset() as "Return timedelta equal to local UTC offset." is almost circular. It does not explain whether it has to be added or subtracted from UTC to arrive at local time.'''
year_published = 2025
clearnet = "https://bugs.python.org/issue9305"
tags = ['"return', '"returns', "14:57", "16:21", "2010-07-19", "2010-07-20", "2010-11-20", "2014-06-29", "2022-04-11", "added"]
