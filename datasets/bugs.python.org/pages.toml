["https://bugs.python.org/issue44800"]
title = "Issue 44800: Code readability: rename InterpreterFrame to `_Py_framedata` - Python tracker"
full_description = '''When merging the bpo-44590 changes into my PEP 558 implementation branch, I found it very hard to follow when the code was referring to the new interpreter frames rather than the existing Python frame objects that were historically used for both execution and introspection. The "interpreter frame" name was also a little confusing, since the introspection frames are still associated with a specific interpreter, they're just not required for code execution anymore, only for code introspection APIs that call for a full Python object. So, inspired by the "gi_xframe" (etc) attributes added in https://github.com/python/cpython/pull/27077, I'm proposing the following internal refactoring: * Rename "pycore_frame.h" to "pycore_xframe.h" * Rename the _interpreter_frame struct to _execution_frame * Rename the type from InterpreterFrame to ExecFrame * Use "xf_" rather than "f_" as the struct field prefix on execution frames * Use "xframe" and "xf" rather than "frame" and "f" for execution frame variables * Consistently use _PyExecFrame as the access function prefix, rather than a confusing mixture of _PyFrame and _PyInterpreterFrame * Rename _PyThreadState_PushFrame to _PyThreadState_PushExecFrame * Rename _PyThreadState_PopFrame to _PyThreadState_PopExecFrame As a side effect of working on this, I noticed some changes that are needed to adapt the GDB integration hooks to the new frame state layout. PR for this proposed refactoring is now up, with a review requested from Mark: https://github.com/python/cpython/pull/27525/ The PR mostly follows what I originally posted, except that I went with _Py_execution_frame and _PyExecFrame for the struct and typedef names, since these are present in a public header. The outdated GDB hooks I found were in the gdbinit example file, rather than the actual libpython.py file that test_gdb covers. I suspect the gdbinit example will need further adjustments to actually work with Python 3.11, so rather than fully updating the implementation dependent pieces, I just added a comment suggesting it be checked after the interpreter optimisation development for 3.11 settles down.'''
