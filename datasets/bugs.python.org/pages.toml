title = "Issue 1014: cgi:  parse_qs and parse_qsl misbehave on empty strings - Python tracker"
full_description = '''In Python 2.4.4, cgi.parse_qs(qs='', strict_parsing=True) errors out: Traceback (most recent call last): File "<stdin>", line 1, in ? File "/usr/lib/python2.4/cgi.py", line 183, in parse_qs for name, value in parse_qsl(qs, keep_blank_values, strict_parsing): File "/usr/lib/python2.4/cgi.py", line 217, in parse_qsl raise ValueError, "bad query field: %r" % (name_value,) ValueError: bad query field: '' To the best of my knowledge, this is bad behavior, since a large percentage of URLs actually used have empty query strings. Addionally, if the default value is empty string, you expect it work with empty string. If a non empty value is needed, it would use None as the default. Hi Sean, This is a very minor issue (IMO) with Python 2.4. Why did you assign it to gvanrossum? Makes me wonder at your assignments. Thanks, Senthil I don't see what the problem is. You requested strict_parsing=True, and this is what strict parsing does.'''
