["https://bugs.python.org/issue1046"]
title = "Issue 1046: HTMLCalendar.formatyearpage not behaving as documented - Python tracker"
full_description = "The function HTMLCalendar.formatyearpage in module calendar takes at most 5 arguments (year, month, css, encoding) whereas documentation (http://docs.python.org/lib/module-calendar.html) says it takes at most 6 (theyear, themonth[, width[, css[, encoding]]]). Also, the title tag in the head of the produced document with (year, month, css) as arguments isn't properly closed ; the line is <title>Calendar for 2008</title when it should be <title>Calendar for 2008</title> This happend with linux (debian sid), with Python 2.5.1 Note: I haven't tested if the encoding did what it should Joined files : - HTMLyearbug.py: reproduces the bug - 2008cal.html: the output produced by this file"
