["https://bugs.python.org/issue47244"]
title = "Issue 47244: email.utils.formataddr does not respect double spaces - Python tracker"
full_description = '''It seems that `email.utils.formataddr` and `email.utils.parseaddr` are not directly inverse from each other, because `formataddr` does not respect double spaces within the "realname" section. For example: ``` from email.utils import formataddr, parseaddr identity = '"foo bar" <foo@example.com>' print(formataddr(parseaddr(identity))) # 'foo bar <foo@example.com>' print(formataddr(parseaddr(formataddr(parseaddr(identity))))) # 'foo bar <foo@example.com>' ``` The first round trip strips the quotes, and the second round trip strips the double space in the "realname" section. The utility function only seems to check for special characters, but it should also check for double spaces.'''
year_published = 2025
clearnet = "https://bugs.python.org/issue47244"
