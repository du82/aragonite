["https://bugs.python.org/issue18408"]
title = "Issue 18408: Fixes crashes found by pyfailmalloc - Python tracker"
full_description = '''I created a first toy based on the PEP 445 to test of Python handles MemoryError: in short, Python handles them badly... Home page of the project: https://pypi.python.org/pypi/pyfailmalloc I will use this issue to track crashes found by this tool. New changeset 111c2a070f28 by Victor Stinner in branch 'default': Issue #18408: PyObject_GC_NewVar() now raises SystemError exception if nitems http://hg.python.org/cpython/rev/111c2a070f28 New changeset ba766323b53a by Victor Stinner in branch 'default': Issue #18408: Fix PyDict_New() to handle correctly new_keys_object() failure http://hg.python.org/cpython/rev/ba766323b53a New changeset 68887e177dd4 by Victor Stinner in branch 'default': Issue #18408: Fix list.pop() to handle list_resize() failure (MemoryError). http://hg.python.org/cpython/rev/68887e177dd4 New changeset 697d722d97f9 by Victor Stinner in branch 'default': Issue #18408: Fix marshal reader for Unicode strings: handle http://hg.python.org/cpython/rev/697d722d97f9 New changeset de1473f4503b by Victor Stinner in branch 'default': Issue #18408: Fix PyType_Ready() and type.__bases__ setter to handle http://hg.python.org/cpython/rev/de1473f4503b New changeset f4311870e329 by Victor Stinner in branch 'default': Issue #18408: Fix call_function() of ceval.c to handle PyTuple_New() failure http://hg.python.org/cpython/rev/f4311870e329 New changeset df8b40593a08 by Victor Stinner in branch 'default': Issue #18408: Fix _PyUnicodeWriter_Finish(): clear writer->buffer, http://hg.python.org/cpython/rev/df8b40593a08 "I created a first toy based on the PEP 445 to test of Python handles MemoryError: in short, Python handles them badly..." Ooops: to test *how* Python handles.. New changeset ba79f6a86300 by Victor Stinner in branch 'default': Issue #18408: Fix ConvParam() of the ctypes module to handle paramfunc failure http://hg.python.org/cpython/rev/ba79f6a86300 New changeset 2ef2edfd1a4c by Victor Stinner in branch 'default': Issue #18408: Fix zlib.compressobj() to handle PyThread_allocate_lock() failure http://hg.python.org/cpython/rev/2ef2edfd1a4c New changeset a45407fa4a5b by Victor Stinner in branch 'default': Issue #18408: Fix PyCode_Optimize(): raise a MemoryError on memory allocation http://hg.python.org/cpython/rev/a45407fa4a5b New changeset ed0c9d77e179 by Victor Stinner in branch 'default': Issue #18408: Fix usage of _PyBytes_Resize() http://hg.python.org/cpython/rev/ed0c9d77e179 New changeset d605c6b8095c by Victor Stinner in branch 'default': Issue #18408: _PyUnicodeWriter_Finish() now clears its buffer attribute in all http://hg.python.org/cpython/rev/d605c6b8095c New changeset 549d8d3297f2 by Victor Stinner in branch 'default': Issue #18408: Fix _PyMem_DebugRealloc() http://hg.python.org/cpython/rev/549d8d3297f2 New changeset c91e7f707562 by Victor Stinner in branch 'default': Issue #18408: Fix select.select() to handle PyList_New() failure (MemoryError) http://hg.python.org/cpython/rev/c91e7f707562'''
