["https://bugs.python.org/issue1034"]
title = "Issue 1034: [patch] Add 2to3 support for displaying warnings as Python comments - Python tracker"
full_description = "Per a Python-3000 mailing list discussion here -- http://mail.python.org/pipermail/python-3000/2007-August/009835.html -- I have implemented an addition to the 2to3 utility that enables warnings to be output as comments in Python source code instead of being logged to stdout. See the attached patch and a description of the changes here: http://mail.python.org/pipermail/python-3000/2007-August/009881.html I'm also attaching 2to3_comment_warnings.diff, which is an example of how we could integrate the insert_comment() method from the first patch to replace the current functionality of fixes.basefix.BaseFix.warning(). On the patch: 1. I think both a log message and the comment should be written. The point needs to be reinforced to users. 2. I'd like to see some tests. 3. Maybe an option to turn the auto comments off? This is interesting. I'd like to have someone else weigh in before it is applied though. I think this would be a good addition so I took Adrian's patch and brought it up to date. I'll need to expand the testing, but I think Benjamin's 1 and 3 are covered."
