["https://bugs.python.org/issue13388"]
title = "Issue 13388: document hg commit hooks in the devguide - Python tracker"
full_description = "---- Our Hg repo has some useful hooks on commit messages that allow to specify which issue to notify for commits, and which issue to close. AFAIU, it's currently documented only in the code of the hook (http://hg.python.org/hooks/file/tip/hgroundup.py). I think adding a short description into the devguide would be a good idea, probably here: http://docs.python.org/devguide/committing.html#commit-messages-and-news-entries ---- +1d by Brett and Georg on pydev. I'll prepare a patch. Attaching a patch with the suggested change. Based on the doc-string in the implementation of the hook. I'm not sure if it matters, but Sphinx documentation suggests using ^ as the underlining character for subsubsections. Otherwise, looks good. Petri, I have actually tried to stay consistent within the same document, and it uses ' for this level of heading. Perhaps it's just not following the Sphinx guide? IIRC the restructured text parser will also shout at you if these are inconsistent. Ah, sorry. I didn't check other files in the devguide. The ReST parser is OK with any underline character, as long as it's consistent within a single file. New changeset e4fcac92a80a by Ezio Melotti in branch 'default': Closes #2771. #13388 now needs to be updated. http://hg.python.org/test/rev/e4fcac92a80a An updated patch attached, explaining that several issues can be mentioned in a single commit message +1 to most of the patch, except one piece of wording: “commit message hooks”. This does not occur in the Mercurial documentation or help, and is misleading (commits happen on your maching, the hooks run on the server). I’d just use “hooks” or “Mercurial hooks”. New changeset 21758f27f98f by Eli Bendersky in branch 'default': document existing hooks for commit messages mentioning issues. Closes issue 13388 http://hg.python.org/devguide/rev/21758f27f98f > The commit details (including its changeset, branch and commit message) In Mercurial terminology, a changeset *is* a commit (or if you really want to make a distinction, a commit is the action that creates a changeset). I think you meant “diff”. Moreover, only the first line of the commit message is added, which is IMO worth mentioning. Finally, I think we should recommend the “#12345” style: For one thing, it makes our hgweb application create links."
