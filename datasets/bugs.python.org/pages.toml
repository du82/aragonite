full_description = "Worked with Alex Martelli at the Google Python Sprint to backport ABC to 2.6. Added abc.py and test_abc.py to svn trunk. Committed revision 58099. (I had to backport test_typechecks.py myself, and fix one issue in abc.py.) Are you going to backport _abcoll.py and its tests? Yes. I plan to work on it this weekend. I hope that's okay. On 9/10/07, Guido van Rossum <report@bugs.python.org> wrote: > > Guido van Rossum added the comment: > > Committed revision 58099. > (I had to backport test_typechecks.py myself, and fix one issue in abc.py.) > > Are you going to backport _abcoll.py and its tests? > > ---------- > assignee: -> gvanrossum > nosy: +gvanrossum > resolution: -> accepted > status: open -> closed > > __________________________________ > Tracker <report@bugs.python.org> > <http://bugs.python.org/issue1026> > __________________________________ > Hi Guido, I just wanted to let you know that I have completed porting _abcoll.py but ran into other test failures after running testall. The following tests failed: test_class test_compile test_descr test_dict test_nis test_richcmp test_shelve test_userdict test_weakref Also since there are no bytes in 2.6, is it correct to replace bytes with str? This is in _abcoll.py. Thanks, Ben A. On 9/10/07, Benjamin Aranguren <report@bugs.python.org> wrote: > > Benjamin Aranguren added the comment: > > Yes. I plan to work on it this weekend. I hope that's okay. > > On 9/10/07, Guido van Rossum <report@bugs.python.org> wrote: > > > > Guido van Rossum added the comment: > > > > Committed revision 58099. > > (I had to backport test_typechecks.py myself, and fix one issue in abc.py.) > > > > Are you going to backport _abcoll.py and its tests? > > > > ---------- > > assignee: -> gvanrossum > > nosy: +gvanrossum > > resolution: -> accepted > > status: open -> closed > > > > __________________________________ > > Tracker <report@bugs.python.org> > > <http://bugs.python.org/issue1026> > > _______________________________