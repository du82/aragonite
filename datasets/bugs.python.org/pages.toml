title = "Issue 47214: builtin_function_or_method is also either a function or a method - Python tracker"
full_description = '''the. ``` import inspect inspect.isfunction ``` does not consider a ``` builtin_function_or_method ``` as a function. for example, ``` inspect.isfunction(abs) ``` gives, ``` False ``` in the background even the builtin `abs` is a function, so shouldn't it return True? the way this check is implemented is by matching the type of a builtin_function_or_method with, ``` type(len) ``` and since, `type(len)` is `builtin_function_or_method`, so, the `inspect.isfunction` check gives False. But in my opinion, it should return True, even for builtin functions or methods. https://docs.python.org/3/library/inspect.html#inspect.isfunction says this: """ inspect.isfunction(object) Return True if the object is a Python function, which includes functions created by a lambda expression. """ Emphasis on the "Python function", as in, something written in Python using a `def` statement or a `lambda` expression. If isfunction returns True, you can presumably access function-specific implementation details like the functions's f.__code__ attribute. If you need to check for "anything that works as a function", you can use `callable()`: >>> callable(lambda: 2) True >>> callable(abs) True >>> def f(x): return x >>> callable(f) True I'm not an expert on the inspect module, but I'm guessing it's not worth breaking backwards-compatibility to change this behavior. Would extra emphasis in the documentation have been helpful for you, or were you mostly attempting to rely on the function's name? but `callable` returns `True` for classes with `__call__` also, it does not check whether the argument passed to it is a function or not. I want some way to return `True` for both builtin functions and Python functions, but not for classes. And similarly, some way to return `True` for both builtin methods and Python methods. Should the documentation for `inspect.isfunction` include, `this does not include builtin functions.`, and similarly for `inspect.ismethod`? Should I create a PR to add these two sentences to the documentation?'''
year_published = 2025
clearnet = "https://bugs.python.org/issue47214"
