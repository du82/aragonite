title = "Message 416685 - Python tracker"
full_description = "init of class GzipFile has mtime as an optional argument, but open() function does not. When using open(), mtime will always be set to the current time and so far there was no way of fixing it to a specific timestamp. In case two people would tar.gz the same file and take its sha, the shas would be different. With an option to fix the mtime, they could have a unique sha. PR containing code change and the tests is already ready. Message416685 ➜ This issue tracker has been migrated to GitHub, and is currently read-only. For more information, see the GitHub FAQs in the Python's Developer Guide. Author ellaellela Recipients ellaellela Date 2022-04-04.17:47:01 SpamBayes Score -1.0 Marked as misclassified Yes Message-id <1649094421.3.0.554667285415.issue47216@roundup.psfhosted.org> In-reply-to Content init of class GzipFile has mtime as an optional argument, but open() function does not. When using open(), mtime will always be set to the current time and so far there was no way of fixing it to a specific timestamp. In case two people would tar.gz the same file and take its sha, the shas would be different. With an option to fix the mtime, they could have a unique sha. PR containing code change and the tests is already ready. History Date User Action Args 2022-04-04 17:47:01ellaellelasetrecipients: + ellaellela 2022-04-04 17:47:01ellaellelasetmessageid: <1649094421.3.0.554667285415.issue47216@roundup.psfhosted.org> 2022-04-04 17:47:01ellaellelalinkissue47216 messages 2022-04-04 17:47:01ellaellelacreate"
