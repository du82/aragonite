["https://bugs.python.org/issue47231"]
title = "Issue 47231: TarFile.getmember cannot work on tar sourced directory over 100 characters - Python tracker"
full_description = "A fix was made to unify handling of the trailing slash in TarFile.getmember related to https://bugs.python.org/issue21987. This change fixed the <100 character case, but made it so directories over 100 character which come from a tar file can no longer be accessed through getmember, even if returned from getnames. This appears to be because internal to tarfile, member names still include the trailing slash on directories over 100 characters but getmember will always remove the trailing slash from the provided name so the comparison will always fail. A simple example of this is as follows using 3.10.4. 1. Download: https://developer.arm.com/-/media/Files/downloads/gnu-a/10.3-2021.07/binrel/gcc-arm-10.3-2021.07-x86_64-aarch64-none-linux-gnu.tar.xz 2. place attached python script in same directory 3. run on 3.8.2 -> fails to get stripped version of path (line 16) 4. run on 3.10.4 -> fails to get even unstripped version (line 12 & 16)"
year_published = 2025
clearnet = "https://bugs.python.org/issue47231"
