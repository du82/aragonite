["https://bugs.python.org/issue1005"]
title = "Issue 1005: Patches to rename Queue module to queue - Python tracker"
full_description = "Patches 2to3/fixes/fix_imports.py. Note that patch to Lib doesn't include `svn mv Lib/Queue.py Lib/queue.py` (issue reporter without commit privileges). Thank you, Paul, for the patches. I reviewed the patches and improved them. Here the list of changes: - Added unit test for the import fixers. - Renamed Lib/Queue.py to Lib/queue.py. - Updated Tools/webchecker/wsgui.py. - Updated the documentation. Hopefully, the patches won't get out of date by the time we do the library reorganization. Yes, thanks for the patches, Paul! Guido sent out an email today saying that the reorg will probably be the main focus of the next Py3K release after 3.0a2. So hopefully they won't go too stale. And I just realized it might end up being best to roll Queue into threading or collections. Probably won't know until it actually happens. =)"
