["https://bugs.python.org/msg248062"]
title = "Message 248062 - Python tracker"
full_description = "What i do is the last doc is like this : 1) Replace the filename with a random name 2) Run mailcap.findmatch() with the random name 3) If exists, replace the quote characters ' before and behind the random name with nothing. 4) Now the random name has no quoting from mailcap itself 5) So now we can use our own quote() savely Message248062 ➜ This issue tracker has been migrated to GitHub, and is currently read-only. For more information, see the GitHub FAQs in the Python's Developer Guide. Author TheRegRunner Recipients TheRegRunner, docs@python, r.david.murray Date 2015-08-05.19:32:41 SpamBayes Score -1.0 Marked as misclassified Yes Message-id <1438803162.34.0.530396020897.issue24778@psf.upfronthosting.co.za> In-reply-to Content What i do is the last doc is like this : 1) Replace the filename with a random name 2) Run mailcap.findmatch() with the random name 3) If exists, replace the quote characters ' before and behind the random name with nothing. 4) Now the random name has no quoting from mailcap itself 5) So now we can use our own quote() savely History Date User Action Args 2015-08-05 19:32:42TheRegRunnersetrecipients: + TheRegRunner, r.david.murray, docs@python 2015-08-05 19:32:42TheRegRunnersetmessageid: <1438803162.34.0.530396020897.issue24778@psf.upfronthosting.co.za> 2015-08-05 19:32:42TheRegRunnerlinkissue24778 messages 2015-08-05 19:32:41TheRegRunnercreate"
