["https://bugs.python.org/issue1047"]
title = "Issue 1047: py3k: corrections for test_subprocess on windows - Python tracker"
full_description = '''I join three patches for py3k on Windows: 1/ getargs.diff adds the 'Z' and 'Z#' format specifiers for PyArg_ParseTuple. They mimic z and z# for unicode strings, by accepting a Unicode or None (in which case the Py_UNICODE* pointer is set to NULL). With doc and tests. 2/ subprocess.diff converts file PC/_subprocess.c to unicode. We use the Unicode version of the win32 api (and Z conversion from previous patch) 3/ stdout.diff: sys.stdout must not convert the line endings, Windows already does it. Without this patch, when redirecting the output of python, the file contains \r\r\n for each line. (test_subprocess did catch this) Committed revision 57669. I have no way to test this so you'll have to watch the buildbot. However, I didn't include the patch to _fileio.c that prevents closing fds 0, 1, 2; I think that's the wrong thing to do and if it causes problems it needs to be addressed in a different way.'''
