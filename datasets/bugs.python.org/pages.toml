title = "Issue 1027: uudecoding (uu.py) does not supprt base64, patch attached - Python tracker"
full_description = "The uu.py library for uuencoding and uudecoding does not support base64 encodins. The patch addached here adds base64 decoding, but does not add encoding support. I think the 2.4 version is in maintenance mode, so no new features are added. You may target 2.5 or 2.6. But the patch is incorrect: the base64 name is undefined. You should include test cases and documentation changes also; please read http://www.python.org/dev/patches/ Now it's too late for 2.5 and probably for 2.6 too. If there are no news this can probably be closed."
