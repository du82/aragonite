["https://bugs.python.org/issue47216"]
title = "Issue 47216: adding mtime option to gzip open() - Python tracker"
full_description = "init of class GzipFile has mtime as an optional argument, but open() function does not. When using open(), mtime will always be set to the current time and so far there was no way of fixing it to a specific timestamp. In case two people would tar.gz the same file and take its sha, the shas would be different. With an option to fix the mtime, they could have a unique sha. PR containing code change and the tests is already ready. Issue47216 ➜ This issue tracker has been migrated to GitHub, and is currently read-only. For more information, see the GitHub FAQs in the Python's Developer Guide. This issue has been migrated to GitHub: https://github.com/python/cpython/issues/91372 classification Title: adding mtime option to gzip open() Type: enhancement Stage: patch review Components: Library (Lib) Versions: Python 3.11 process Status: open Resolution: Dependencies: Superseder: Assigned To: Nosy List: ellaellela Priority: normal Keywords: patch Created on 2022-04-04 17:47 by ellaellela, last changed 2022-04-11 14:59 by admin. Pull Requests URL Status Linked Edit PR 32310 open ellaellela, 2022-04-04 17:48 Messages (1) msg416685 - (view) Author: Marin M (ellaellela) * Date: 2022-04-04 17:47 init of class GzipFile has mtime as an optional argument, but open() function does not. When using open(), mtime will always be set to the current time and so far there was no way of fixing it to a specific timestamp. In case two people would tar.gz the same file and take its sha, the shas would be different. With an option to fix the mtime, they could have a unique sha. PR containing code change and the tests is already ready. History Date User Action Args 2022-04-11 14:59:58adminsetgithub: 91372 2022-04-04 17:48:26ellaellelasetkeywords: + patchstage: patch reviewpull_requests: + pull_request30371 2022-04-04 17:47:01ellaellelacreate"
