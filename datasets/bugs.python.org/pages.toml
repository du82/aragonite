title = "Issue 1038: [py3k] pdb does not work in python 3000 - Python tracker"
full_description = '''The Lib/pdb.py debugger fails in the py3k branch. Traceback (most recent call last): File "/usr/local/gps/python/py3k/Lib/pdb.py", line 1247, in main pdb._runscript(mainpyfile) File "/usr/local/gps/python/py3k/Lib/pdb.py", line 1173, in _runscript self.run(statement) File "/usr/local/gps/python/py3k/Lib/bdb.py", line 365, in run exec(cmd, globals, locals) File "<string>", line 1 exec("# bla bla bla first line of your file being debugged ^ SyntaxError: EOL while scanning single-quoted string Uncaught exception. Entering post mortem debugging Why are you using _runscript(), which is an internal routine? I've had a fair amount of success with other invocations, like pdb.run().'''
