title = "Issue 47233: show_caches option affects code positions reported by dis.get_instructions(...) - Python tracker"
full_description = "The Instructions reported by dis.get_instructions(...) and dis.Bytecode(...) have different positions depending on the value of their show_caches argument. test2.py reproduces the problem. Nice catch. The fix should be pretty simple: just move this line... https://github.com/python/cpython/blob/c1d93b6411f975d67e43942f1a2745a22983c18c/Lib/dis.py#L425 ...up to the top of the for loop. Are you interested in working on this? Issue47233 ➜ This issue tracker has been migrated to GitHub, and is currently read-only. For more information, see the GitHub FAQs in the Python's Developer Guide. This issue has been migrated to GitHub: https://github.com/python/cpython/issues/91389 classification Title: show_caches option affects code positions reported by dis.get_instructions(...) Type: behavior Stage: patch review Components: Versions: Python 3.11 process Status: open Resolution: Dependencies: Superseder: Assigned To: Nosy List: 15r10nk, brandtbucher Priority: normal Keywords: patch Created on 2022-04-05 19:47 by 15r10nk, last changed 2022-04-11 14:59 by admin. Files File name Uploaded Description Edit test2.py 15r10nk, 2022-04-05 19:47 Pull Requests URL Status Linked Edit PR 32406 open 15r10nk, 2022-04-07 20:40 Messages (3) msg416810 - (view) Author: 15r10nk (15r10nk) * Date: 2022-04-05 19:47 The Instructions reported by dis.get_instructions(...) and dis.Bytecode(...) have different positions depending on the value of their show_caches argument. test2.py reproduces the problem. msg416828 - (view) Author: Brandt Bucher (brandtbucher) * Date: 2022-04-05 23:01 Nice catch. The fix should be pretty simple: just move this line... https://github.com/python/cpython/blob/c1d93b6411f975d67e43942f1a2745a22983c18c/Lib/dis.py#L425 ...up to the top of the for loop. Are you interested in working on this? msg416944 - (view) Author: 15r10nk (15r10nk) * Date: 2022-04-07 20:52 I moved the line. Is there anything else required? unittests? History Date User Action Args 2022-04-