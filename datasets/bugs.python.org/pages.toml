title = "Issue 47194: Upgrade to zlib v1.2.12 in CPython binary releases - Python tracker"
full_description = "zlib v1.2.11 as used in Windows binary releases contains a security issue that, while fixed in its git repo years ago, never wound up in a release or a CVE until just now. Folllow the https://www.openwall.com/lists/oss-security/2022/03/24/1 thread and the and recently assigned CVE-2018-25032. I believe we only ship our own zlib on Windows so this issue is tagged as such. The above oss-security thread is where an idea of severity will come out. New changeset 6066739ff7794e54c98c08b953a699cbc961cd28 by Zachary Ware in branch 'main': bpo-47194: Update zlib to v1.2.12 on Windows to resolve CVE-2018-25032 (GH-32241) https://github.com/python/cpython/commit/6066739ff7794e54c98c08b953a699cbc961cd28 New changeset 0f0f85e9d8088eb789cda35477900df32adff546 by Miss Islington (bot) in branch '3.9': bpo-47194: Update zlib to v1.2.12 on Windows to resolve CVE-2018-25032 (GH-32241) https://github.com/python/cpython/commit/0f0f85e9d8088eb789cda35477900df32adff546 New changeset 16a809ffb7af14898ce9ec8165960d96cbcd4ec3 by Miss Islington (bot) in branch '3.10': bpo-47194: Update zlib to v1.2.12 on Windows to resolve CVE-2018-25032 (GH-32241) https://github.com/python/cpython/commit/16a809ffb7af14898ce9ec8165960d96cbcd4ec3 New changeset 387f93c156288c170ff0016a75af06e109d48ee1 by Miss Islington (bot) in branch '3.7': bpo-47194: Update zlib to v1.2.12 on Windows to resolve CVE-2018-25032 (GH-32241) (GH-32251) https://github.com/python/cpython/commit/387f93c156288c170ff0016a75af06e109d48ee1"
