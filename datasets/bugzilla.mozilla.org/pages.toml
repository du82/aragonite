["https://bugzilla.mozilla.org/describecomponents.cgi"]
title = "Browse"
full_description = '''<div class="noscript"> <div class="inner"> <p>Please enable JavaScript in your browser to use all the features on this site.</p> </div> </div> Which product and component would you like to have described? Find product and component: No components found Result limited to 100 components An error occurred or choose from the following selections Core Shared components used by Firefox and other Mozilla software, including handling of Web content; Gecko, HTML, CSS, layout, DOM, scripts, images, networking, etc. Issues with web page layout probably go here, while Firefox user interface issues belong in the Firefox product. (More info) Firefox For bugs in Firefox Desktop, the Mozilla Foundation's web browser. For Firefox user interface issues in menus, bookmarks, location bar, and preferences. Many Firefox bugs will either be filed here or in the Core product. Bugs for developer tools (F12) should be filed in the DevTools product. (more info) Fenix Firefox for Android: Fenix is an Android browser built using Android Components that re-imagines how a mobile browser would look if it was built from scratch to demonstrate better design for typical mobile use cases (more info). Firefox for iOS Firefox for iOS is the Firefox mobile experience developed for the iOS platform. Focus For bugs in Firefox Focus for Android. Bugs in Firefox Focus for iOS should be filed on GitHub DevTools For bugs in Firefox DevTools, the developer tools within the Firefox web browser. This includes issues about the user interface of the toolbox, special pages such as about:debugging and about:devtools, and developer-related APIs. WebExtensions File feature requests and bugs related to the WebExtension add-on API. Toolkit The Mozilla Toolkit is a set of APIs, built on top of Gecko, which provide advanced services to XUL applications. These services include Profile Management, Chrome Registration, Browsing History, Extension and Theme Management, Application Update Service, and Safe Mode. (More info) GeckoView The GeckoView components for Android Mozilla Localizations Translation, spelling and other errors in language packs and localized builds (more info) User Research Requests for the Firefox User Research Team. Thunderbird For bugs in MZLA's Thunderbird desktop mail client. Bugs in the back-end (e.g. protocols) should be filed in the MailNews Core product. Bugs in calendar should be filed in the Calendar product. Bugs for the chat features, file in the Chat Core product. SeaMonkey An all-in-one internet application suite, including web browser, e-mail and newsgroup client, and HTML composer. (more info) Other Products Other Mozilla products which aren't listed here'''
