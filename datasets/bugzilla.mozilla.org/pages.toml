title = "Create a new Bugzilla account"
full_description = '''<div class="noscript"> <div class="inner"> <p>Please enable JavaScript in your browser to use all the features on this site.</p> </div> </div> function onSubmit() { var email = document.getElementById('login').value; var agreed = document.getElementById('etiquette').checked; if (email == '') { alert('You must enter your email address.'); return false; } var isValid = email.match(/@/) && email.match(/@.+\./) && !email.match(/\.$/) && !email.match(/[\\()&<>,'"\[\]]/) ; if (!isValid) { alert( "The e-mail address doesn't pass our syntax checking for a legal " + "email address.\n\nA legal address must contain exactly one '@', and " + "at least one '.' after the @.\n\nIt must also not contain any of " + "these special characters: \ ( ) & < > , ; : \" [ ], or any whitespace." ); return false; } if (!agreed) { alert( "You must agree to follow Bugzilla Etiquette, " + "and the Mozilla Community Participation Guidelines." ); return false; } return true; } I need help using a Mozilla Product Firefox Support Support for the Firefox web browser. Thunderbird Support Support for Thunderbird email client. Inappropriate uses of Bugzilla Inappropriate use of this service will result in your account being banned and your institution blocked. Creating bugs as part of a school assignment. Trying out Bugzilla to see if it suits your needs or testing out some part of Bugzilla for proper functionality. Instead, go to bugzilla-dev.allizom.org, and log in using a GitHub account. Note: You can also set up your own instance of Bugzilla for evaluation or classroom training by following the directions on our project repository. I want to help Great! There are a few things to know and do: Please read our Bug Writing Guidelines. Bugzilla is a public place. Your comments and other activities onbugs will generally be publicly visible, and your email address will be accessible through public APIs and will be visible to all logged-in users ofBugzilla. Some people use an alternative email address for this reason. See Mozilla's Websites, Communications & Cookies Privacy Notice for more information on our privacy policies. When using Bugzilla to submit patches, comments, code, and any other content, you agree to our policies on open source licensing and content submission. See Mozilla’s Websites and Communications Terms of Use for more information. You understand that your conduct on this site is subject to both Bugzilla Etiquette, and the Mozilla Community Participation Guidelines. By creating an account, you agree to abide by them. Please give us an email address you want to use. Once we confirm that it works, you'll be asked to set a password and then you can start filing bugs and helping fix them. Create an account Email Address: I have read Bugzilla Etiquette and the Mozilla Community Participation Guidelines and agree to abide by them.'''
