title = "Reporting and Charting Kitchen"
full_description = '<div class="noscript"> <div class="inner"> <p>Please enable JavaScript in your browser to use all the features on this site.</p> </div> </div> Bugzilla allows you to view and track the state of the bug database in all manner of exciting ways. Current State Search - list sets of bugs. Tabular reports - tables of bug counts in 1, 2 or 3 dimensions, as HTML or CSV. Graphical reports - line graphs, bar and pie charts. Duplicates - list of most frequently reported bugs. Change Over Time Old Charts - plot the status and/or resolution of bugs against time, for each product in your database. Triage Reports Unconfirmed Report - Report on UNCONFIRMED bugs to assist triage. Triage Owners - Report on triage owners per product and component. Other Reports User Changes - Show changes made by an individual user. Release Tracking Report - For triaging release-train flag information. Suggested Reviewers - All suggestions for the "review" flag.'
