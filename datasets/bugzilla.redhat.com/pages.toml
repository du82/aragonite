title = "5.7.14. Bugzilla::Comment — Red Hat Bugzilla 5.0.4.rh103 documentation"
full_description = "5.7.14. Bugzilla::Comment¶ 5.7.14.1. NAME¶ Bugzilla::Comment - A Comment for a given bug 5.7.14.2. SYNOPSIS¶ use Bugzilla::Comment; my $comment = Bugzilla::Comment->new($comment_id); my $comments = Bugzilla::Comment->new_from_list($comment_ids); 5.7.14.3. DESCRIPTION¶ Bugzilla::Comment represents a comment attached to a bug. This implements all standard Bugzilla::Object methods. See Bugzilla::Object for more details. Accessors¶ bug_id int The ID of the bug to which the comment belongs. creation_ts string The comment creation timestamp. body string The body without any special additional text. work_time string Time spent as related to this comment. is_private boolean Comment is marked as private. already_wrapped If this comment is stored in the database word-wrapped, this will be 1. 0 otherwise. author Bugzilla::User who created the comment. count int The position this comment is located in the full list of comments for a bug starting from 0. collapsed boolean Comment should be displayed as collapsed by default. tags array of strings The tags attached to the comment. add_tag Description Attaches the specified tag to the comment. Params tag string The tag to attach. remove_tag Description Detaches the specified tag from the comment. Params tag string The tag to detach. body_full Description string Body of the comment, including any special text (such as “this bug was marked as a duplicate of…”). Params is_bugmail boolean. 1 if this comment should be formatted specifically for bugmail. wrap boolean. 1 if the comment should be returned word-wrapped. Returns A string, the full text of the comment as it would be displayed to an end-user. 5.7.14.4. Methods in need of POD¶ set_type bug set_extra_data set_is_private attachment is_about_attachment extra_data preload type update activity This documentation undoubtedly has bugs; if you find some, please file them here."
