prise Application Platform 6: JBoss Enterprise Application Platform 6 JBoss Enterprise BRMS Platform 5: The JBoss Enterprise BRMS Platform 5 is a complete solution for the development and management of rules-based applications using JBoss Rules in your enterprise. JBoss Enterprise Portal Platform 4: JBoss Enterprise Portal Platform 4 is the open source implementation of the Java EE suite of Portal services running atop JBoss Enterprise Application Platform. It comprises a set of JBoss Enterprise Middleware components that have been tested and certified together to provide an integrated experience. JBoss Enterprise Portal Platform 5: JBoss Enterprise Portal Platform 5 is the open source implementation of the Java EE suite of Portal services running atop JBoss Enterprise Application Platform. It comprises a set of JBoss Enterprise Middleware components that have been tested and certified together to provide an integrated experience. JBoss Enterprise Portal Platform 6: JBoss Enterprise Portal Platform 6 is the open source implementation of the Java EE suite of Portal services running atop JBoss Enterprise Application Platform. It comprises a set of JBoss Enterprise Middleware components that have been tested and certified together to provide an integrated experience. JBoss Enterprise SOA Platform 4: The JBoss Enterprise SOA platform 4 is a single platform to find, integrate and orchestrate SOA business services, enterprise applications, and other IT assets into automated business processes. JBoss Enterprise SOA Platform 5: The JBoss Enterprise SOA platform 5 is a single platform to find, integrate and orchestrate SOA business services, enterprise applications, and other IT assets into automated business processes. JBoss Enterprise WFK Platform 1: JBoss Web Framework Kit combines popular open source web frameworks into a single solution for Java applications. JBoss Enterprise Web Server 1: JBoss Enterprise Web Server is a fully integrated and certified set of components