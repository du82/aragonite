title = "4.1. Parameters — Red Hat Bugzilla 5.0.4.rh103 documentation"
full_description = "4.1. Parameters¶ Bugzilla is configured by changing various parameters, accessed from the Parameters link, which is found on the Administration page. The parameters are divided into several categories, accessed via the menu on the left. 4.1.1. Required Settings¶ The core required parameters for any Bugzilla installation are set here. urlbase is always required; the other parameters should be set, or it must be explicitly decided not to set them, before the new Bugzilla installation starts to be used. urlbase Defines the fully qualified domain name and web server path to this Bugzilla installation. For example, if the Bugzilla query page is http://www.foo.com/bugzilla/query.cgi, the urlbase should be set to http://www.foo.com/bugzilla/. ssl_redirect If enabled, Bugzilla will force HTTPS (SSL) connections, by automatically redirecting any users who try to use a non-SSL connection. Also, when this is enabled, Bugzilla will send out links using sslbase in emails instead of urlbase. sslbase Defines the fully qualified domain name and web server path for HTTPS (SSL) connections to this Bugzilla installation. For example, if the Bugzilla main page is https://www.foo.com/bugzilla/index.cgi, the sslbase should be set to https://www.foo.com/bugzilla/. cookiepath Defines a path, relative to the web document root, that Bugzilla cookies will be restricted to. For example, if the urlbase is set to http://www.foo.com/bugzilla/, the cookiepath should be set to /bugzilla/. Setting it to / will allow all sites served by this web server or virtual host to read Bugzilla cookies. 4.1.2. General¶ maintainer Email address of the person responsible for maintaining this Bugzilla installation. The address need not be that of a valid Bugzilla account. utf8 Use UTF-8 (Unicode) encoding for all text in Bugzilla. Installations where this parameter is set to off should set it to on only after the data has been converted from existing legacy character encodings to UTF-8, using the contrib/recode.pl script. Note If you turn this parameter from off to on, you must re-run checksetup.pl immediately afterward. shutdownhtml If there is any text in this field, this Bugzilla installation will be completely disabled and this text will appear instead of all Bugzilla pages for all users, including Admins. Used in the event of site maintenance or outage situations. announcehtml Any text in this field will be displayed at the top of every HTML page in this Bugzilla installation. The text is not wrapped in any tags. For best results, wrap the text in a <div> tag. Any style attributes from the CSS can be applied. For example, to make the text green inside of a red box, add id=message to the <div> tag. upgrade_notification Enable or disable a notification on the homepage of this Bugzilla installation when a newer version of Bugzilla is available. This notification is only visible to administrators. Choose disabled to turn off the notification. Otherwise, choose which version of Bugzilla you want to be notified about: development_snapshot is the latest release from the master branch, latest_stable_release is the most recent release available on the most recent stable branch, and stable_branch_release is the most recent release on the branch this installation is based on. 4.1.3. Administrative Policies¶ This page contains parameters for basic administrative functions. Options include whether to allow the deletion of bugs and users, and whether to allow users to change their email address. allowbugdeletion The pages to edit products and components can delete all associated bugs when you delete a product (or component). Since that is a pretty scary idea, you have to turn on this option before any such deletions will ever happen. allowemailchange Users can change their own email address through the preferences. Note that the change is validated by emailing both addresses, so switching this option on will not let users use an invalid address. allowuserdeletion The user editing pages are capable of letting you delete user accounts. Bugzilla will issue a warning in case you’d run into inconsistencies when you’re about to do so, but such deletions still remain scary. So, you have to turn on this option before any such deletions will ever happen. last_visit_keep_days This option controls how many days Bugzilla will remember that users have visited specific bugs. 4.1.4. User Authentication¶ This page contains the settings that control how this Bugzilla installation will do its authentication. Choose what authentication mechanism to use (the Bugzilla database, or an external source such as LDAP), and set basic behavioral parameters. For example, choose whether to require users to login to browse bugs, the management of authentication cookies, and the regular expression used to validate email addresses. Some parameters are highlighted below. auth_env_id Environment variable used by external authentication system to store a unique identifier for each user. Leave it blank if there isn’t one or if this method of authentication is not being used. auth_env_email Environment variable used by external authentication system to store each user’s email address. This is a required field for environmental authentication. Leave it blank if you are not going to use this feature. auth_env_realname Environment variable used by external authentication system to store the user’s real name. Leave it blank if there isn’t one or if this method of authentication is not being used. user_info_class Mechanism(s) to be used for gathering a user’s login information. More than one may be selected. If the first one returns nothing, the second is tried, and so on. The types are: CGI: asks for username and password via CGI form interface. Env: info for a pre-authenticated user is passed in system environment variables. user_verify_class Mechanism(s) to be used for verifying (authenticating) information gathered by user_info_class. More than one may be selected. If the first one cannot find the user, the second is tried, and so on. The types are: DB: Bugzilla’s built-in authentication. This is the most common choice. RADIUS: RADIUS authentication using a RADIUS server. Using this method requires additional parameters to be set. Please see RADIUS for more information. LDAP: LDAP authentication using an LDAP server. Using this method requires additional parameters to be set. Please see LDAP for more information. rememberlogin Controls management of session cookies. on - Session cookies never expire (the user has to login only once per browser). off - Session cookies last until the users session ends (the user will have to login in each new browser session). defaulton/defaultoff - Default behavior as described above, but user can choose whether Bugzilla will remember their login or not. requirelogin If this option is set, all access to the system beyond the front page will require a login. No anonymous users will be permitted. webservice_email_filter Filter email addresses returned by the WebService API depending on if the user is logged in or not. This works similarly to how the web UI currently filters email addresses. If requirelogin is enabled, then this parameter has no effect as users must be logged in to use Bugzilla anyway. emailregexp Defines the regular expression used to validate email addresses used for login names. The default attempts to match fully qualified email addresses (i.e. ‘user@example.com’) in a slightly more restrictive way than what is allowed in RFC 2822. Another popular value to put here is ^[^@]+, which means ‘local usernames, no @ allowed.’ emailregexpdesc This description is shown to the user to explain which email addresses are allowed by the emailregexp param. emailsuffix This is a string to append to any email addresses when actually sending mail to that address. It is useful if you have changed the emailregexp param to only allow local usernames, but you want the mail to be delivered to username@my.local.hostname. createemailregexp This defines the (case-insensitive) regexp to use for email addresses that are permitted to self-register. The default (.*) permits any account matching the emailregexp to be created. If this parameter is left blank, no users will be permitted to create their own accounts and all accounts will have to be created by an administrator. password_complexity Set the complexity required for passwords. In all cases must the passwords be at least 6 characters long. no_constraints - No complexity required. mixed_letters - Passwords must contain at least one UPPER and one lower case letter. letters_numbers - Passwords must contain at least one UPPER and one lower case letter and a number. letters_numbers_specialchars - Passwords must contain at least one letter, a number and a special character. password_check_on_login If set, Bugzilla will check that the password meets the current complexity rules and minimum length requirements when the user logs into the Bugzilla web interface. If it doesn’t, the user would not be able to log in, and will receive a message to reset their password. 4.1.5. Attachments¶ This page allows for setting restrictions and other parameters regarding attachments to bugs. For example, control size limitations and whether to allow pointing to external files via a URI. allow_attachment_display If this option is on, users will be able to view attachments from their browser, if their browser supports the attachment’s MIME type. If this option is off, users are forced to download attachments, even if the browser is able to display them. If you do not trust your users (e.g. if your Bugzilla is public), you should either leave this option off, or configure and set the attachment_base parameter (see below). Untrusted users may upload attachments that could be potentially damaging if viewed directly in the browser. attachment_base When the allow_attachment_display parameter is on, it is possible for a malicious attachment to steal your cookies or perform an attack on Bugzilla using your credentials. If you would like additional security on attachments to avoid this, set this parameter to an alternate URL for your Bugzilla that is not the same as urlbase or sslbase. That is, a different domain name that resolves to this exact same Bugzilla installation. Note that if you have set the cookiedomain parameter, you should set attachment_base to use a domain that would not be matched by cookiedomain. For added security, you can insert %bugid% into the URL, which will be replaced with the ID of the current bug that the attachment is on, when you access an attachment. This will limit attachments to accessing only other attachments on the same bug. Remember, though, that all those possible domain names (such as 1234.your.domain.com) must point to this same Bugzilla instance. To set this up you need to investigate wildcard DNS. allow_attachment_deletion If this option is on, administrators will be able to delete the contents of attachments (i.e. replace the attached file with a 0 byte file), leaving only the metadata. maxattachmentsize The maximum size (in kilobytes) of attachments to be stored in the database. If a file larger than this size is attached to a bug, Bugzilla will look at the maxlocalattachment parameter to determine if the file can be stored locally on the web server. If the file size exceeds both limits, then the attachment is rejected. Setting both parameters to 0 will prevent attaching files to bugs. Some databases have default limits which prevent storing larger attachments in the database. E.g. MySQL has a parameter called max_allowed_packet, whose default varies by distribution. Setting maxattachmentsize higher than your current setting for this value will produce an error. maxlocalattachment The maximum size (in megabytes) of attachments to be stored locally on the web server. If set to a value lower than the maxattachmentsize parameter, attachments will never be kept on the local filesystem. Whether you use this feature or not depends on your environment. Reasons to store some or all attachments as files might include poor database performance for large binary blobs, ease of backup/restore/browsing, or even filesystem-level deduplication support. However, you need to be aware of any limits on how much data your webserver environment can store. If in doubt, leave the value at 0. Note that changing this value does not affect any already-submitted attachments. 4.1.6. Bug Change Policies¶ Set policy on default behavior for bug change events. For example, choose which status to set a bug to when it is marked as a duplicate, and choose whether to allow bug reporters to set the priority or target milestone. Also allows for configuration of what changes should require the user to make a comment, described below. duplicate_or_move_bug_status When a bug is marked as a duplicate of another one, use this bug status. letsubmitterchoosepriority If this is on, then people submitting bugs can choose an initial priority for that bug. If off, then all bugs initially have the default priority selected here. letsubmitterchoosemilestone If this is on, then people submitting bugs can choose the Target Milestone for that bug. If off, then all bugs initially have the default milestone for the product being filed in. musthavemilestoneonaccept If you are using Target Milestone, do you want to require that the milestone be set in order for a user to set a bug’s status to IN_PROGRESS? commenton* All these fields allow you to dictate what changes can pass without comment and which must have a comment from the person who changed them. Often, administrators will allow users to add themselves to the CC list, accept bugs, or change the Status Whiteboard without adding a comment as to their reasons for the change, yet require that most other changes come with an explanation. Set the “commenton” options according to your site policy. It is a wise idea to require comments when users resolve, reassign, or reopen bugs at the very least. Note It is generally far better to require a developer comment when resolving bugs than not. Few things are more annoying to bug database users than having a developer mark a bug “fixed” without any comment as to what the fix was (or even that it was truly fixed!) noresolveonopenblockers This option will prevent users from resolving bugs as FIXED if they have unresolved dependencies. Only the FIXED resolution is affected. Users will be still able to resolve bugs to resolutions other than FIXED if they have unresolved dependent bugs. 4.1.7. Bug Fields¶ The parameters in this section determine the default settings of several Bugzilla fields for new bugs and whether certain fields are used. For example, choose whether to use the Target Milestone field or the Status Whiteboard field. useclassification If this is on, Bugzilla will associate each product with a specific classification. But you must have editclassification permissions enab"
