title = "3.12. Backups — Red Hat Bugzilla 5.0.4.rh103 documentation"
full_description = "3.12. Backups¶ 3.12.1. Database¶ Here are some sample commands you could use to backup your database, depending on what database system you’re using. You may have to modify these commands for your particular setup. Replace the $VARIABLEs with appropriate values for your setup. 3.12.1.1. MySQL¶ mysqldump --max-allowed-packet=32M -u $USERNAME -p $DATABASENAME > backup.sql The value for max-allowed-packet should be the value you’ve set in your MySQL configuration file, and should be larger than the largest attachment in your database. See the mysqldump documentation for more information on mysqldump. 3.12.1.2. PostgreSQL¶ pg_dump --no-privileges --no-owner -h localhost -U $USERNAME > bugs.sql 3.12.2. Bugzilla¶ The Bugzilla directory contains some data files and configuration files which you would want to retain. A simple recursive copy will do the job here. cp -rp $BUGZILLA_HOME /var/backups/bugzilla This documentation undoubtedly has bugs; if you find some, please file them here."
year_published = 2025
