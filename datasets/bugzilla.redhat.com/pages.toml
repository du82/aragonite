title = "3. Installation and Maintenance Guide — Red Hat Bugzilla 5.0.4.rh103 documentation"
full_description = "3. Installation and Maintenance Guide¶ Note If you just want to use Bugzilla, you do not need to install it. None of this chapter is relevant to you. Ask your Bugzilla administrator for the URL to access it from your web browser. You may want to read the User Guide. Bugzilla can be installed under Linux, Windows, Mac OS X, and perhaps other operating systems. However, if you are setting it up on a dedicated machine and you have control of the operating system to use, the Bugzilla team wholeheartedly recommends Linux as an extremely versatile, stable, and robust operating system that provides an ideal environment for Bugzilla. In that case, you may want to read the Quick Start instructions. 3.1. Quick Start (Ubuntu Linux 14.04) 3.2. Linux 3.3. Windows 3.4. Mac OS X 3.5. Web Server 3.6. Database Server 3.7. Essential Post-Installation Configuration 3.8. Optional Post-Install Configuration 3.9. Migrating From Other Bug-Tracking Systems 3.10. Moving Bugzilla Between Machines 3.11. Upgrading 3.12. Backups 3.13. Sanity Check 3.14. Merging Accounts 3.15. One Installation, Multiple Instances This documentation undoubtedly has bugs; if you find some, please file them here."
