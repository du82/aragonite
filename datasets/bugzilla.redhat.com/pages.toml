full_description = "5.7.126. Bugzilla::Extension::ActivityReport::WebService¶ 5.7.126.1. NAME¶ Bugzilla::Extension::ActivityReport::WebService - The API for accessing Activity Reports. 5.7.126.2. DESCRIPTION¶ This API allows you to access some of the Activity Reports. 5.7.126.3. METHODS¶ user_activity Description: Show changes made by an individual user. Params: who: Comma separate list of users to report on. from: Date to start report. * Optional. to: date to end report. * Optional. sort: How to sort report. when or bug. * Optional. Returns: A hash with the following keys: from: The date the reports starts. to: The date the report ends. who: The list of users included in the report. who_count: The number of users icovered in the report. operations: An array of the actions performed. sort: The order the operations are sorted. This documentation undoubtedly has bugs; if you find some, please file them here."
