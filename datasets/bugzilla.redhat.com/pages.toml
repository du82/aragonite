full_description = "4. Administration Guide¶ For those with admin privileges, Bugzilla can be administered using the Administration link in the header. The administrative controls are divided into several sections: 4.1. Parameters 4.1.1. Required Settings 4.1.2. General 4.1.3. Administrative Policies 4.1.4. User Authentication 4.1.5. Attachments 4.1.6. Bug Change Policies 4.1.7. Bug Fields 4.1.8. Graphs 4.1.9. Group Security 4.1.10. LDAP 4.1.11. RADIUS 4.1.12. Email 4.1.13. Query Defaults 4.1.14. Shadow Database 4.1.15. Memcached 4.1.16. User Matching 4.1.17. Advanced 4.1.18. Extensions 4.2. Default Preferences 4.3. Users 4.3.1. Creating Admin Users 4.3.2. Searching For Users 4.3.3. Modifying Users 4.3.4. Creating New Users 4.3.5. Deleting Users 4.3.6. Impersonating Users 4.4. Classifications, Products, Components, Versions, and Milestones 4.4.1. Classifications 4.4.2. Products 4.4.3. Components 4.4.4. Versions 4.4.5. Milestones 4.5. Flags 4.5.1. Flag Properties 4.5.2. Deleting a Flag 4.6. Custom Fields 4.6.1. Adding Custom Fields 4.6.2. Editing Custom Fields 4.6.3. Deleting Custom Fields 4.7. Field Values 4.7.1. Viewing/Editing Legal Values 4.7.2. Deleting Legal Values 4.8. Workflow 4.9. Groups and Security 4.9.1. Creating Groups 4.9.2. Editing Groups and Assigning Group Permissions 4.9.3. Assigning Users to Groups 4.9.4. Assigning Group Controls to Products 4.10. Keywords 4.11. Whining 4.11.1. The Event 4.11.2. Whining Schedule 4.11.3. Whining Searches 4.11.4. Saving Your Changes 4.12. Quips 4.13. Installed Extensions This documentation undoubtedly has bugs; if you find some, please file them here."
