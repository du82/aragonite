title = "5.7.89. Bugzilla::WebService::Bug — Red Hat Bugzilla 5.0.4.rh103 documentation"
full_description = "5.7.89. Bugzilla::WebService::Bug¶ 5.7.89.1. NAME¶ Bugzilla::Webservice::Bug - The API for creating, changing, and getting the details of bugs. 5.7.89.2. DESCRIPTION¶ This part of the Bugzilla API allows you to file a new bug in Bugzilla, or get information about bugs that have already been filed. 5.7.89.3. METHODS¶ See Bugzilla::WebService for a description of how parameters are passed, and what STABLE, UNSTABLE, and EXPERIMENTAL mean. Although the data input and output is the same for JSONRPC, XMLRPC and REST, the directions for how to access the data via REST is noted in each method where applicable. 5.7.89.4. Utility Functions¶ fields¶ UNSTABLE Description Get information about valid bug fields, including the lists of legal values for each field. REST You have several options for retreiving information about fields. The first part is the request method and the rest is the related path needed. To get information about all fields: GET /rest/field/bug To get information related to a single field: GET /rest/field/bug/<id_or_name> The returned data format is the same as below. Params You can pass either field ids or field names. Note: If neither ids nor names is specified, then all non-obsolete fields will be returned. In addition to the parameters below, this method also accepts the standard include_fields and exclude_fields arguments. ids (array) - An array of integer field ids. names (array) - An array of strings representing field names. Returns A hash containing a single element, fields. This is an array of hashes, containing the following keys: id int An integer id uniquely identifying this field in this installation only. type int The number of the fieldtype. The following values are defined: 0 Unknown 1 Free Text 2 Drop Down 3 Multiple-Selection Box 4 Large Text Box 5 Date/Time 6 Bug Id 7 Bug URLs (“See Also”) 8 Keywords 9 Date 10 Integer value is_custom boolean True when this is a custom field, false otherwise. name string The internal name of this field. This is a unique identifier for this field. If this is not a custom field, then this name will be the same across all Bugzilla installations. display_name string The name of the field, as it is shown in the user interface. is_mandatory boolean True if the field must have a value when filing new bugs. Also, mandatory fields cannot have their value cleared when updating bugs. is_on_bug_entry boolean For custom fields, this is true if the field is shown when you enter a new bug. For standard fields, this is currently always false, even if the field shows up when entering a bug. (To know whether or not a standard field is valid on bug entry, see create.) visibility_field string The name of a field that controls the visibility of this field in the user interface. This field only appears in the user interface when the named field is equal to one of the values in visibility_values. Can be null. visibility_values array of strings This field is only shown when visibility_fieldmatches one of these values. When visibility_field is null, then this is an empty array. value_field string The name of the field that controls whether or not particular values of the field are shown in the user interface. Can be null. values This is an array of hashes, representing the legal values for select-type (drop-down and multiple-selection) fields. This is also populated for the component, version, target_milestone, and keywordsfields, but not for the product field (you must use Product.get_accessible_products for that. For fields that aren’t select-type fields, this will simply be an empty array. Each hash has the following keys: name string The actual value–this is what you would specify for this field in create, etc. sort_key int Values, when displayed in a list, are sorted first by this integer and then secondly by their name. sortkey DEPRECATED - Use sort_key instead. visibility_values If value_field is defined for this field, then this value is only shown if the value_field is set to one of the values listed in this array. Note that for per-product fields, value_field is set to 'product'and visibility_values will reflect which product(s) this value appears in. is_active boolean This value is defined only for certain product specific fields such as version, target_milestone or component. When true, the value is active, otherwise the value is not active. description string The description of the value. This item is only included for the keywords field. is_open boolean For bug_status values, determines whether this status specifies that the bug is “open” (true) or “closed” (false). This item is only included for the bug_status field. can_change_to For bug_status values, this is an array of hashes that determines which statuses you can transition to from this status. (This item is only included for the bug_status field.) Each hash contains the following items: name the name of the new status comment_required this boolean True if a comment is required when you change a bug into this status using this transition. Errors 51 (Invalid Field Name or Id) You specified an invalid field name or id. History Added in Bugzilla 3.6. The is_mandatory return value was added in Bugzilla 4.0. sortkey was renamed to sort_key in Bugzilla 4.2. is_active return key for values was added in Bugzilla 4.4. REST API call added in Bugzilla 5.0 flag_types¶ UNSTABLE Description Get information about valid flag types that can be set for bugs and attachments. REST You have several options for retreiving information about flag types. The first part is the request method and the rest is the related path needed. To get information about all flag types for a product: GET /flag_types/<product> To get information about flag_types for a product and component: GET /flag_types/<product>/<component> The returned data format is the same as below. Params You must pass a product name and an optional component name. product (string) - The name of a valid product. component (string) - An optional valid component name associated with the product. Returns A hash containing two keys, bug and attachment. Each key value is an array of hashes, containing the following keys: id int An integer id uniquely identifying this flag type. name string The name for the flag type. Flag names do not need to be unique. type string The target of the flag type which is either bug or attachment. description string The description of the flag type. values array An array of string values that the user can set on the flag type. is_requestable boolean Users can ask specific other users to set flags of this type. is_multiplicable boolean Multiple flags of this type can be set for the same bug or attachment. Errors 106 (Product Access Denied) Either the product does not exist or you don’t have access to it. 51 (Invalid Component) The component provided does not exist in the product. History Added in Bugzilla 5.0. Red Hat added this in Bugzilla 4.4.2015 legal_values¶ DEPRECATED - Use fields instead. Description Tells you what values are allowed for a particular field. REST To get information on the values for a field based on field name: GET /rest/field/bug/<field_name>/values To get information based on field name and a specific product: GET /rest/field/bug/<field_name>/<product_id>/values The returned data format is the same as below. Params field - The name of the field you want information about. This should be the same as the name you would use in create, below. product_id - If you’re picking a product-specific field, you have to specify the id of the product you want the values for. Returns values - An array of strings: the legal values for this field. The values will be sorted as they normally would be in Bugzilla. Errors 106 (Invalid Product) You were required to specify a product, and either you didn’t, or you specified an invalid product (or a product that you can’t access). 108 (Invalid Field Name) You specified a field that doesn’t exist or isn’t a drop-down field. History REST API call added in Bugzilla 5.0. 5.7.89.5. Bug Information¶ attachments¶ EXPERIMENTAL Description It allows you to get data about attachments, given a list of bugs and/or attachment ids. Note: Private attachments will only be returned if you are in the insidergroup or if you are the submitter of the attachment. REST To get all current attachments for a bug: GET /rest/bug/<bug_id>/attachment To get a specific attachment based on attachment ID: GET /rest/bug/attachment/<attachment_id> The returned data format is the same as below. Params Note: At least one of ids or attachment_ids is required. ids See the description of the ids parameter in the get method. attachment_ids array An array of integer attachment ids. Also accepts the include_fields, and exclude_fields arguments. Returns A hash containing two elements: bugs and attachments. The return value looks like this: { bugs => { 1345 => [ { (attachment) }, { (attachment) } ], 9874 => [ { (attachment) }, { (attachment) } ], }, attachments => { 234 => { (attachment) }, 123 => { (attachment) }, } } The attachments of any bugs that you specified in the ids argument in input are returned in bugs on output. bugs is a hash that has integer bug IDs for keys and the values are arrayrefs that contain hashes as attachments. (Fields for attachments are described below.) For any attachments that you specified directly in attachment_ids, they are returned in attachments on output. This is a hash where the attachment ids point directly to hashes describing the individual attachment. The fields for each attachment (where it says (attachment) in the diagram above) are: data base64 The raw data of the attachment, encoded as Base64. size int The length (in bytes) of the attachment. creation_time dateTime The time the attachment was created. last_change_time dateTime The last time the attachment was modified. id int The numeric id of the attachment. bug_id int The numeric id of the bug that the attachment is attached to. file_name string The file name of the attachment. summary string A short string describing the attachment. content_type string The MIME type of the attachment. is_private boolean True if the attachment is private (only visible to a certain group called the “insidergroup”), False otherwise. Defaults to your setting under General Preferences (which is a Red Hat customisation). is_obsolete boolean True if the attachment is obsolete, False otherwise. is_patch boolean True if the attachment is a patch, False otherwise. creator string The login name of the user that created the attachment. flags An array of hashes containing the information about flags currently set for each attachment. Each flag hash contains the following items: id int The id of the flag. name string The name of the flag. type_id int The type id of the flag. creation_date dateTime The timestamp when this flag was originally created. modification_date dateTime The timestamp when the flag was last modified. status string The current status of the flag. setter string The login name of the user who created or last modified the flag. requestee string The login name of the user this flag has been requested to be granted or denied. Note, this field is only returned if a requestee is set. is_active Red Hat Extension int If the FlagType that this flag belongs to is active or not Errors This method can throw all the same errors as get. In addition, it can also throw the following error: 304 (Auth Failure, Attachment is Private) You specified the id of a private attachment in the attachment_idsargument, and you are not in the “insider group” that can see private attachments. History Added in Bugzilla 3.6. In Bugzilla 4.0, the attacher return value was renamed to creator. In Bugzilla 4.0, the description return value was renamed to summary. The data return value was added in Bugzilla 4.0. In Bugzilla 4.2, the is_url return value was removed (this attribute no longer exists for attachments). The size return value was added in Bugzilla 4.4. The flags array was added in Bugzilla 4.4. REST API call added in Bugzilla 5.0. comments¶ STABLE Description This allows you to get data about comments, given a list of bugs and/or comment ids. REST To get all comments for a particular bug using the bug ID or alias: GET /rest/bug/<id_or_alias>/comment To get a specific comment based on the comment ID: GET /rest/bug/comment/<comment_id> The returned data format is the same as below. Params Note: At least one of ids or comment_ids is required. In addition to the parameters below, this method also accepts the standard include_fields and exclude_fields arguments. ids array An array that can contain both bug IDs and bug aliases. All of the comments (that are visible to you) will be returned for the specified bugs. comment_ids array An array of integer comment_ids. These comments will be returned individually, separate from any other comments in their respective bugs. new_since dateTime If specified, the method will only return comments newerthan this time. This only affects comments returned from the idsargument. You will always be returned all comments you request in the comment_ids argument, even if they are older than this date. Returns Two items are returned: bugs This is used for bugs specified in ids. This is a hash, where the keys are the numeric ids of the bugs, and the value is a hash with a single key, comments, which is an array of comments. (The format of comments is described below.) Note that any individual bug will only be returned once, so if you specify an id multiple times in ids, it will still only be returned once. comments Each individual comment requested in Defaults to your setting under General Precomment_ids is returned here, in a hash where the numeric comment id is the key, and the value is the comment. (The format of comments is described below.) A “comment” as described above is a hash that contains the following keys: id int The globally unique ID for the comment. bug_id int The ID of the bug that this comment is on. attachment_id int If the comment was made on an attachment, this will be the ID of that attachment. Otherwise it will be null. count int The number of the comment local to the bug. The Description is 0, comments start with 1. text string The actual text of the comment. creator string The login name of the comment’s author. creator_id The internal login id of the comment’s author. This is a Red Hat Extension. time dateTime The time (in Bugzilla’s timezone) that the comment was added. creation_time dateTime This is exactly same as the time key. Use this field instead of time for consistency with other methods including get and attachments. For compatibility, time is still usable. However, please note that timemay be deprecated and removed in a future release. is_private boolean True if this comment is private (only visible to a certain group called the “insidergroup”), False otherwise. Defaults to your setting under General Preferences (which is a Red"
