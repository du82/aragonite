["https://bugzilla.redhat.com/docs/en/html/integrating/api/sanitycheck/sanitycheck.html"]
title = "5.7.255. sanitycheck — Red Hat Bugzilla 5.0.4.rh103 documentation"
full_description = "5.7.255. sanitycheck¶ 5.7.255.1. NAME¶ sanitycheck.pl - Perl script to perform a sanity check at the command line 5.7.255.2. SYNOPSIS¶ ./sanitycheck.pl [--help] ./sanitycheck.pl [--verbose] --login <user@domain.com> 5.7.255.3. OPTIONS¶ –help Displays this help text –verbose Causes this script to be more verbose in its output. Without this option, the script will return only errors. With the option, the script will append all output to the email. –login This should be passed the email address of a user that is capable of running the Sanity Check process, a user with the editcomponents priv. This user will receive an email with the results of the script run. –errors_to Instead of mailing –login, mail the ‘mail_errors_to’ address. –param Set parameters to ae.g. If you wanted to fix repair_bugs_fulltext pss to sanitycheck.cgi. e.g. If you wanted to fix bug full text records --param repair_bugs_fulltext Can be set multiple times. 5.7.255.4. DESCRIPTION¶ This script provides a way of running a ‘Sanity Check’ on the database via either a CLI or cron. It is equivalent to calling sanitycheck.cgi via a web browser. This documentation undoubtedly has bugs; if you find some, please file them here."
