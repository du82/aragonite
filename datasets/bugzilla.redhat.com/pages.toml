title = "5.7.23. Bugzilla::DB::Pg — Red Hat Bugzilla 5.0.4.rh103 documentation"
full_description = "5.7.23. Bugzilla::DB::Pg¶ 5.7.23.1. NAME¶ Bugzilla::DB::Pg - Bugzilla database compatibility layer for PostgreSQL 5.7.23.2. DESCRIPTION¶ This module overrides methods of the Bugzilla::DB module with PostgreSQL specific implementation. It is instantiated by the Bugzilla::DB module and should never be used directly. For interface details see Bugzilla::DB and DBI. bz_start_transaction¶ Customize how transactions start for RHBZ 1255227 Functions¶ sql_like_escape Description The postgres versions of the sql_like methods use the ANSI SQL LIKE statements to perform substring searching. To prevent issues with users attempting to search for strings containing special characters associated with LIKE, we escape them out so they don’t affect the search terms. Params $fragment - The string fragment in need of escaping and quoting Returns The fragment with any pre existing %,_,| characters escaped out, wrapped in percent characters and quoted. sql_as_numeric Description The postgres versions of the sql_as_numeric. Params $value - The value to coerse. $is_field - Is it a field name? Returns An SQL fragment to corese the field or vlaue to a numeral. This is a Red Hat extension. 5.7.23.3. Methods in need of POD¶ quote sql_date_format sql_fulltext_search bz_explain bz_sequence_exists bz_last_key sql_position sql_like sql_ilike sql_not_ilike sql_limit sql_not_regexp sql_string_concat sql_date_math sql_to_days bz_check_server_version sql_from_days bz_table_list_real sql_regexp sql_istring sql_group_concat bz_setup_database This documentation undoubtedly has bugs; if you find some, please file them here."
