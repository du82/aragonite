["https://buildah.io/blogs/2018/02/27/buildah-builds-itself.html"]
title = "Buildah Blocks- Buildah builds itself! | buildah.io"
description = "Buildah Blocks- Buildah builds itself! By Tom Sweeney GitHub Twitter I’m a fan of Isaac Asimov’s “Three Laws of Robotics” and I’m beginning to wonder if these laws need to be wired into Buildah. You see Buildah builds itself. It’s self-propagating."
full_description = "I’m a fan of Isaac Asimov’s “Three Laws of Robotics” and I’m beginning to wonder if these laws need to be wired into Buildah. You see Buildah builds itself. It’s self-propagating. We recently were building out our test system for Buildah and for part of that testing we needed to make sure Buildah’s RPM would build. Buildah uses Travis CI to do its testing and within our test bats file we create a container and then the RPM within it to make sure the RPM builds appropriately. While reviewing the code for that test, I commented that it would be nice if we could create a second container to install the RPM on and maybe make sure the command buildah help worked. Nalin Dahyabhai, who started the Buildah project, one upped that (truth be told, that’s Nalin’s Standard Operating Procedure). What he put together was deceptively simple, yet extremely powerful. First Nalin creates a container using the command ‘buildah from’ using Fedora 27. This creates a container that runs Fedora 27. He then uses ‘buildah mount’ to get the location of the container’s root file system and saves that to the ‘$root’ variable. Once that’s in hand, a directory is created for the rpm bits and pieces to be placed into that will be needed to make an RPM for Buildah. Now that a container is ready, the necessary spec files are put in place and rpmbuild is invoked on the container to make the rpm file for Buildah. Then a second container is built again using Fedora 27 and the rpm file that was built on the first container is copied into this new container. Then the rpm is installed using dnf. Buildah has now been installed onto the new container with the latest bits from GitHub. With the new container up and running, Nalin’s able to run a number of commands in the container pulling out key information to verify that the rpm is installed and works as expected. There you have it, Buildah building and testing itself. Granted I’m not too worried if Buildah doesn’t follow the “Three Laws of Robotics” at this point, but this technique is really powerful. This test runs on each and every pull request to Buildah. If the RPM can’t be built, installed and minimal operations completed, the tests won’t run and the code won’t get committed."
author = "tsweeney"
year_published = 2018
year_updated = 2018
