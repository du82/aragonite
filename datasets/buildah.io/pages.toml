["https://buildah.io/releases/2019/01/22/Buildah-version-v1.6.html"]
title = "Buildah version 1.6 Release Announcement | buildah.io"
description = "Buildah version 1.6 Release Announcement We’re pleased to announce the release of Buildah version 1.6 which is now available from GitHub for any Linux distro. We are shipping this release on Fedora, RHEL 7, CentOS, openSUSE and Ubuntu in the near future. The Buildah project has continued to grow over the past several weeks, welcoming several new contributors to the mix. Updates were made to the performance of many commands, a buildah info command has been added, Dockerfile processing updates and bug fixes."
full_description = "We’re pleased to announce the release of Buildah version 1.6 which is now available from GitHub for any Linux distro. We are shipping this release on Fedora, RHEL 7, CentOS, openSUSE and Ubuntu in the near future. The Buildah project has continued to grow over the past several weeks, welcoming several new contributors to the mix. Updates were made to the performance of many commands, a buildah info command has been added, Dockerfile processing updates and bug fixes. Many performance changes have been made throughout the image handling code including but not limited to faster compression and parallel pulls of images. Note: the output of the buildah pull command has changed slightly to reflect these changes. A number of changes were made in the way that Dockerfiles are processed including processing one-line Dockerfiles, processing the COPY --from command, processing the ADD --chown command and several performance related changes. If you haven’t yet, install Buildah from one of the Linux repos or GitHub and give it a spin. We’re betting you’ll find it’s an easy and quick way to build containers in your environment without a daemon being involved! For those of you who contributed to this release, thank you very much for your contributions! If you haven’t joined our community yet, don’t wait any longer! Come join us on GitHub, where Open Source communities live."
