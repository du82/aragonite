["https://buildah.io/blogs/2019/06/22/mailinglist.html"]
title = "Buildah Mailing list | buildah.io"
description = "Buildah Mailing List By Tom Sweeney GitHub Twitter We’ve received a number of requests for a mailing list for Buildah and we’re happy to announce that one has just been created! We’ve built a friendly community on IRC and GitHub and plan to continue that growth in this new mailing list. The maintainers of the project are all members of the list and we’re happy to take any and all questions there about Buildah. You can also just use the list as a way to track what’s going on with Buildah as release announcements and other important news will be posted there."
full_description = "We’ve received a number of requests for a mailing list for Buildah and we’re happy to announce that one has just been created! We’ve built a friendly community on IRC and GitHub and plan to continue that growth in this new mailing list. The maintainers of the project are all members of the list and we’re happy to take any and all questions there about Buildah. You can also just use the list as a way to track what’s going on with Buildah as release announcements and other important news will be posted there. Regardless of which method you use, a confirmation email will be sent to you. After you reply back to that confirmation email, you’ll then be able to send mail directly to buildah@lists.buildah.io. You can then also go to the list’s web page and from there you can see all of the past conversations on the list or manage your subscription. Please note, if you have a bug that you’d like to report, it’s best to report them here by creating a “New issue” rather than sending an email to the list. We hope over time this mailing list will be a friendly and useful tool for the entire Buildah community."
