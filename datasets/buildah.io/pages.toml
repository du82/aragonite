["https://buildah.io/blogs/2018/01/26/using-image-registries-with-buildah.html"]
title = "Using OCI Image Registries with Buildah | buildah.io"
description = "Using OCI Image Registries with Buildah By ipbabble GitHub Twitter Prerequisite: Buildah version 0.9 or greater. First some terminology. In the container image space, Docker popularized two terms: Container image registry Container image repository The container image registry, or registry, is a shared data store for pushing and pulling container images. It has a well-known API for such requests. Docker Hub is an example of a public registry. Various vendors and developers store their images on Docker Hub. Most organizations I’ve dealt with don’t wish to pull images from a public registry for reasons such as security or network bandwidth usage. Instead they would prefer to use a local private registry."
full_description = "The container image registry, or registry, is a shared data store for pushing and pulling container images. It has a well-known API for such requests. Docker Hub is an example of a public registry. Various vendors and developers store their images on Docker Hub. Most organizations I’ve dealt with don’t wish to pull images from a public registry for reasons such as security or network bandwidth usage. Instead they would prefer to use a local private registry. The second term is a container image repository, A repository is a local storage area on a host. Images are often pulled from a registry to the host’s repository and run on the host. Sometimes they are modified, tagged and pushed back into a registry as a new image or a new version of an image. On a host that is using Buildah, and its underlying OCI-based technology, this repository is located in /var/lib/containers/storage. This is used by, but not to be confused with, the containers/storage and containers/image library projects. These projects use the /var/lib/containers/storage directory by default. When you develop a useful container image using Buildah you may wish to share it with others either in a local container image registry or a remote or public container image registry. The purpose of this tutorial is to demonstrate how Buildah can be used to move OCI-compliant images in and out of private or public registries. In the first tutorial we built an image from scratch that we called fedora-bashecho and we pushed it to a local Docker repository using the docker-daemon protocol. We are going to use the same image to push to a private Docker registry. If you have not performed the first tutorial it is important that you do that now, before you proceed. First we must pull down a registry image. We are going to use the registry image from Docker Hub. As a shortcut we will save the container name that is returned from the buildah from command, into a bash shell variable called registry. This is just like we did in Tutorial 1:"
