["https://buildah.io/releases/2019/06/25/Buildah-version-v1.9.html"]
title = "Buildah version 1.9 Release Announcement | buildah.io"
description = "Buildah version 1.9 Release Announcement We’re pleased to announce the release of Buildah version 1.9 which is now available from GitHub for any Linux distro. We are shipping this release on Fedora, RHEL 7, CentOS, openSUSE and Ubuntu in the near future. The Buildah project has continued to grow over the past several weeks, welcoming several new contributors to the mix. A number of changes were made to expedite the building of containers and installing software onto them, a new option has been added for dns handling for bud and from commands, symbolic link handling in the build process has been corrected, Buildah container images are now available at quay.io/buildah, and more!"
full_description = "We’re pleased to announce the release of Buildah version 1.9 which is now available from GitHub for any Linux distro. We are shipping this release on Fedora, RHEL 7, CentOS, openSUSE and Ubuntu in the near future. The Buildah project has continued to grow over the past several weeks, welcoming several new contributors to the mix. A number of changes were made to expedite the building of containers and installing software onto them, a new option has been added for dns handling for bud and from commands, symbolic link handling in the build process has been corrected, Buildah container images are now available at quay.io/buildah, and more! If you haven’t yet, install Buildah from one of the Linux repos or GitHub and give it a spin. We’re betting you’ll find it’s an easy and quick way to build containers in your environment without a daemon being involved! For those of you who contributed to this release, thank you very much for your contributions! If you haven’t joined our community yet, don’t wait any longer! Come join us on GitHub, where Open Source communities live."
