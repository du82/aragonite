title = "Buildah Release Announcements | buildah.io"
description = "Buildah - a tool that facilitates building OCI container images."
full_description = "We’re pleased to announce the release of Buildah version 1.38.0, which is now available from GitHub for any Linux distro. We are shipping this release on Fedora 40 and Fedora 41. Buildah will also be shipped on CentOS, OpenSUSE, and Ubuntu soon. In addition, container images will be available at https://quay.io/repository/buildah/stable and https://quay.io/repository/containers/buildah. The Buildah project has continued to grow over the past several weeks, welcoming several new contributors to the mix. This release features notable changes: If you haven’t yet, install Buildah from one of the Linux repos or GitHub and give it a spin. We’re betting you’ll find it’s an easy and quick way to build containers in your environment without a daemon being involved! For those of you who contributed to this release, thank you very much for your contributions! If you haven’t joined our community yet, don’t wait any longer! Come join us on GitHub, where Open Source communities live. We’re pleased to announce the release of Buildah version 1.37.0, which is now available from GitHub for any Linux distro. We are shipping this release on Fedora 39 and Fedora 40. Buildah will also be shipped on CentOS, OpenSUSE, and Ubuntu soon. In addition, container images will be available at https://quay.io/repository/buildah/stable and https://quay.io/repository/containers/buildah. The Buildah project has continued to grow over the past several weeks, welcoming several new contributors to the mix. This release features notable changes: If you haven’t yet, install Buildah from one of the Linux repos or GitHub and give it a spin. We’re betting you’ll find it’s an easy and quick way to build containers in your environment without a daemon being involved! For those of you who contributed to this release, thank you very much for your contributions! If you haven’t joined our community yet, don’t wait any longer! Come join us on GitHub, where Open Source communities live. We’re pleased to announce the release of Buildah version 1.36.0, which is now available from GitHub for any Linux distro. We are shipping this release on Fedora 39 and Fedora 40. Buildah will also be shipped on CentOS, OpenSUSE, and Ubuntu soon. In addition, container images will be available at https://quay.io/repository/buildah/stable and https://quay.io/repository/containers/buildah."
