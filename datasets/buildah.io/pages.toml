["https://buildah.io/releases/2019/08/16/Buildah-version-v1.10.1.html"]
title = "Buildah version 1.10.1 Release Announcement | buildah.io"
description = "Buildah version 1.10.1 Release Announcement We’re pleased to announce the release of Buildah version 1.10.1 which is now available from GitHub for any Linux distro. We are shipping this release on Fedora, RHEL 7, RHEL 8, CentOS, openSUSE and Ubuntu in the near future. Also container images will be available at https://quay.io/repository/buildah/stable. The Buildah project has continued to grow over the past several weeks, welcoming several new contributors to the mix. Notable enhancements. A number of changes were made to buildah config to make removing values and volumes easier. Better support for additional stores(defined in the /etc/containers/mounts.conf file). Listing images now can indicate whether an image is from a read/only store Deleting all images does not attempt to remove from read/only stores Committing images with read/only stores now works.. Buildah unshare has a new --mount option that allows you to mount the container image while entering a user namespace. Initial support for potential HPC use cases."
