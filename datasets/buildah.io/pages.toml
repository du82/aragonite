["https://buildah.io/blogs/2019/05/14/buildah-blocks-images.html"]
title = "Buildah Blocks: Playing with Buildah Images | buildah.io"
description = "Buildah Blocks: Playing with Buildah Images By Tom Sweeney GitHub Twitter So you always wanted to play with Buildah but you didn’t want to have to install or clone it onto your system. Until recently you were helplessly stuck unless a good friend let you play with it on their system. So many possible containers, so little time! Well now if you have a containers runtime system like Podman on your machine, there are a number of container images that are now available that you can pull and then play with Buildah. Each image has Fedora latest (version 30 at the time of this writing) and a variant of Buildah within it."
full_description = "So you always wanted to play with Buildah but you didn’t want to have to install or clone it onto your system. Until recently you were helplessly stuck unless a good friend let you play with it on their system. So many possible containers, so little time! Well now if you have a containers runtime system like Podman on your machine, there are a number of container images that are now available that you can pull and then play with Buildah. Each image has Fedora latest (version 30 at the time of this writing) and a variant of Buildah within it. The container images are available publicly on the Buildah repository on quay.io. There are three different variants of Buildah, each in their own container image. The first is “stable”. The Buildah that was used to build this container image is the latest release of Buildah that’s passed through all of the production and kit testing. Currently that’s Buildah v1.7. The next variant in the image is “testing”. The version of Buildah in this image is the version that is still in the updates-testing repository, but has not gone through final testing on Fedora Updates System. Often times this version and the stable version will be the same if there’s no release in progress. Finally, for those of you who hark back to the days of Evil Knievil, there’s the “upstream” variant. Buyer beware on this one, whenever a commit is made to the Buildah project on GitHub this container image is created with the latest bits. If you want to see how the absolute latest and greatest is working, or you want to test out the latest fix that was just merged, this is the one for you. That’s great, but how do I use these or get to them? Let’s take a look under the covers. As mentioned previously, I’d recommend using Podman as the containers runtime engine. It has the advantage of not requiring a daemon and has a CLI that is very familiar to those that have run Docker. OK, that’s kind of neat, we’ve the stable image pulled down and we’ve created a container from it. A quick side note, just replace the word “stable” in the pull command above with either “upstream” or “testing” if you want to use one of those variants. Let’s just peak at the image we pulled down."
