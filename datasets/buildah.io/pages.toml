title = "Buildah version 1.7 Release Announcement | buildah.io"
description = "Buildah version 1.7 Release Announcement We’re pleased to announce the release of Buildah version 1.7 which is now available from GitHub for any Linux distro. We are shipping this release on Fedora, RHEL 7, CentOS, openSUSE and Ubuntu in the near future. The Buildah project has continued to grow over the past several weeks, welcoming several new contributors to the mix. Updates were made to the performance of pulling and pushing images, an –add-history option has been added to several commands, the Cobra CLI is now being used and bug fixes."
full_description = "We’re pleased to announce the release of Buildah version 1.7 which is now available from GitHub for any Linux distro. We are shipping this release on Fedora, RHEL 7, CentOS, openSUSE and Ubuntu in the near future. The Buildah project has continued to grow over the past several weeks, welcoming several new contributors to the mix. Updates were made to the performance of pulling and pushing images, an –add-history option has been added to several commands, the Cobra CLI is now being used and bug fixes. If you haven’t yet, install Buildah from one of the Linux repos or GitHub and give it a spin. We’re betting you’ll find it’s an easy and quick way to build containers in your environment without a daemon being involved! For those of you who contributed to this release, thank you very much for your contributions! If you haven’t joined our community yet, don’t wait any longer! Come join us on GitHub, where Open Source communities live."
