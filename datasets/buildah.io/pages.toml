["https://buildah.io/releases/2020/01/14/Buildah-version-v1.12.0.html"]
title = "Buildah version 1.12.0 Release Announcement | buildah.io"
description = "Buildah version 1.12.0 Release Announcement We’re pleased to announce the release of Buildah version 1.12.0 which is now available from GitHub for any Linux distro. We are shipping this release on Fedora, RHEL 8, RHEL 7, CentOS, openSUSE and Ubuntu in the near future. Also container images will be available at https://quay.io/repository/buildah/stable. The Buildah project has continued to grow over the past several weeks, welcoming several new contributors to the mix. Notable enhancements: A new manifest command. A new --history option for the image command. A new --device option has been added to the bud and from commands. Changes to the --pull option used by the bud and from commands. Buildah now uses a ‘Containerfile’ by default rather than a ‘Dockerfile’."
full_description = "We’re pleased to announce the release of Buildah version 1.12.0 which is now available from GitHub for any Linux distro. We are shipping this release on Fedora, RHEL 8, RHEL 7, CentOS, openSUSE and Ubuntu in the near future. Also container images will be available at https://quay.io/repository/buildah/stable. The Buildah project has continued to grow over the past several weeks, welcoming several new contributors to the mix. This release comprises changes made for v1.11.1, v1.11.2, v1.11.3, v1.11.4, v1.11.5, v1.11.6 and v1.12.0. If you haven’t yet, install Buildah from one of the Linux repos or GitHub and give it a spin. We’re betting you’ll find it’s an easy and quick way to build containers in your environment without a daemon being involved! For those of you who contributed to this release, thank you very much for your contributions! If you haven’t joined our community yet, don’t wait any longer! Come join us on GitHub, where Open Source communities live."
