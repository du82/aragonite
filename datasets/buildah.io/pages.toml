["https://buildah.io/blogs/2018/01/16/buildah-blocks.html"]
title = "Buildah Blocks - OCI Shell Game | buildah.io"
description = "Buildah Blocks - OCI Shell Game By Tom Sweeney GitHub Twitter I’ve always been fascinated by the three shells and a pea game that street hustlers have used for years to make a bit of coin. I love watching a talented person running the game, but I know better than to bet on it! However, playing the game with Buildah leads to everyone being a winner. I had a bit of time to play, so I tried out a variant of the shell game with Open Containers Initiative (OCI) containers. I made a quick example showing how you can create an OCI image with Buildah, saved the image to a repository on Docker Hub and then used both Docker and Buildah to run that image from Docker Hub. Nothing terribly fancy, but the video does illustrate that Buildah is OCI-compliant and the images it creates can be used by other OCI-compliant technologies."
full_description = "I’ve always been fascinated by the three shells and a pea game that street hustlers have used for years to make a bit of coin. I love watching a talented person running the game, but I know better than to bet on it! However, playing the game with Buildah leads to everyone being a winner. I had a bit of time to play, so I tried out a variant of the shell game with Open Containers Initiative (OCI) containers. I made a quick example showing how you can create an OCI image with Buildah, saved the image to a repository on Docker Hub and then used both Docker and Buildah to run that image from Docker Hub. Nothing terribly fancy, but the video does illustrate that Buildah is OCI-compliant and the images it creates can be used by other OCI-compliant technologies. The demo was recorded on a Fedora 27 virtual machine that was installed and then updated on December 23, 2017. I decided to “leverage” William Henry’s Buildah Tutorial #1 a bit to create a Dockerfile that runs his runecho.sh file. Prior to the video, I did the following on the virtual machine: The demo shows an image built by Buildah being placed on Docker Hub and then run by both Docker and Buildah from there. I’ve included the commands used in the video at the bottom of this blog. I will note that Red Hat is currently developing Podman. Once that is fully developed, the podman run command will be the suggested way to run your container; the Buildah variant of that command will be positioned for quick testing purposes. I hope that you enjoyed the video and this article gives you a little more information on the Buildah project. Buildah is an Open Source project and contributors are always welcome. We’d love to see you there!"
