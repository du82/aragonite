description = "Bun is stable and ready for production."
full_description = '''Bun 1.0 is finally here.Bun is a fast, all-in-one toolkit for running, building, testing, and debugging JavaScript and TypeScript, from a single file to a full-stack application. Today, Bun is stable and production-ready.Install Buncurlnpmbrewdockercurlcurl -fsSL https://bun.sh/install | bashdocument.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#zyZrPXCsesXD");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`curl -fsSL https://bun.sh/install | bash`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});document.querySelector(".tab-eryHffouNn.tabchild-0").addEventListener("click",(e)=>{document.querySelectorAll(".tab-eryHffouNn.active").forEach((el)=>el.classList.remove("active"));document.querySelectorAll(".tab-eryHffouNn.tabchild-0").forEach((el)=>el.classList.add("active"));document.querySelectorAll(".tabitem-eryHffouNn").forEach((el)=>el.classList.remove("active"));document.querySelectorAll(".tabitem-eryHffouNn.tabchild-0").forEach((el)=>el.classList.add("active"))});npmnpm install -g bundocument.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#YbtVpLvYYeZW");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`npm install -g bun`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});document.querySelector(".tab-eryHffouNn.tabchild-1").addEventListener("click",(e)=>{document.querySelectorAll(".tab-eryHffouNn.active").forEach((el)=>el.classList.remove("active"));document.querySelectorAll(".tab-eryHffouNn.tabchild-1").forEach((el)=>el.classList.add("active"));document.querySelectorAll(".tabitem-eryHffouNn").forEach((el)=>el.classList.remove("active"));document.querySelectorAll(".tabitem-eryHffouNn.tabchild-1").forEach((el)=>el.classList.add("active"))});brewbrew tap oven-sh/bundocument.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#XGWuFrUJGPIh");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`brew tap oven-sh/bun`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});brew install bundocument.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#VrFbfGXZiQzX");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`brew install bun`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});document.querySelector(".tab-eryHffouNn.tabchild-2").addEventListener("click",(e)=>{document.querySelectorAll(".tab-eryHffouNn.active").forEach((el)=>el.classList.remove("active"));document.querySelectorAll(".tab-eryHffouNn.tabchild-2").forEach((el)=>el.classList.add("active"));document.querySelectorAll(".tabitem-eryHffouNn").forEach((el)=>el.classList.remove("active"));document.querySelectorAll(".tabitem-eryHffouNn.tabchild-2").forEach((el)=>el.classList.add("active"))});dockerdocker pull oven/bundocument.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#PqqOEUdrEqZh");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`docker pull oven/bun`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});docker run --rm --init --ulimit memlock=-1:-1 oven/bundocument.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#axlQQwVCLAQW");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`docker run --rm --init --ulimit memlock=-1:-1 oven/bun`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});document.querySelector(".tab-eryHffouNn.tabchild-3").addEventListener("click",(e)=>{document.querySelectorAll(".tab-eryHffouNn.active").forEach((el)=>el.classList.remove("active"));document.querySelectorAll(".tab-eryHffouNn.tabchild-3").forEach((el)=>el.classList.add("active"));document.querySelectorAll(".tabitem-eryHffouNn").forEach((el)=>el.classList.remove("active"));document.querySelectorAll(".tabitem-eryHffouNn.tabchild-3").forEach((el)=>el.classList.add("active"))});Upgrade Bunbun upgradedocument.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#YUOEMpLYdYmt");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`bun upgrade`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});Bun is an all-in-one toolkitWe love JavaScript. It's mature, it moves fast, and its developer community is vibrant and passionate. It's awesome.However, since Node.js debuted 14 years ago, layers and layers of tooling have accumulated on top of each other. And like any system that grows and evolves without centralized planning, JavaScript tooling has become slow and complex.Why Bun existsBun's goal is simple: eliminate slowness and complexity without throwing away everything that's great about JavaScript. Your favorite libraries and frameworks should still work, and you shouldn't need to unlearn the conventions you're familiar with.You will however need to unlearn the many tools that Bun makes unnecessary:Node.js — Bun is a drop-in replacement for Node.js, so you don't need:nodenpx — bunx is 5x fasterdotenv, cross-env — Bun reads .env files by defaultnodemon, pm2 — built-in watch modews — built-in WebSocket servernode-fetch, isomorphic-fetch — built-in fetchTranspilers — Bun can run .js, .ts, .cjs, .mjs, .jsx, and .tsx files, which can replace:tsc — (but you can keep it for typechecking!)babel, .babelrc, @babel/preset-*ts-node, ts-node-esmtsxBundlers — Bun is a JavaScript bundler with best-in-class performance and an esbuild-compatible plugin API, so you don't need:esbuildwebpackparcel, .parcelrcrollup, rollup.config.jsPackage managers — Bun is an npm-compatible package manager with familiar commands. It reads your package.json and writes to node_modules, just like other package managers, so you can replace:npm, .npmrc, package-lock.jsonyarn, yarn.lockpnpm, pnpm.lock, pnpm-workspace.yamllernaTesting libraries — Bun is a Jest-compatible test runner with support for snapshot testing, mocking, and code coverage, so you no longer need:jest, jest.config.jsts-jest, @swc/jest, babel-jestjest-extendedvitest, vitest.config.tsWhile these tools are each good in their own right (mostly), using them all together inevitably creates fragility and a slow developer experience. They perform a lot of redundant work; when you run jest, your code will be parsed 3+ times by various tools! And the duct tape, plugins, and adapters required to stitch everything together always frays eventually.Bun is a single integrated toolkit that avoids these integration problems. Each tool in this toolkit provides a best-in-class developer experience, from performance to API design.Bun is a JavaScript runtimeBun is a fast JavaScript runtime. Its goal is to make the experience of building software faster, less frustrating, and more fun.Node.js compatibilityBun is a drop-in replacement for Node.js. That means existing Node.js applications and npm packages just work in Bun. Bun has built-in support for Node APIs, including:built-in modules like fs, path, and net,globals like __dirname and process,and the Node.js module resolution algorithm. (e.g. node_modules)While perfect compatibility with Node.js isn't possible — looking at you node:v8 — Bun can run virtually any Node.js application in the wild.Bun is tested against test suites of the most popular Node.js packages on npm. Server frameworks like Express, Koa, and Hono just work. As do applications built using the most popular full-stack frameworks. Collectively, these libraries and frameworks touch every part of Node.js's API surface that matters.Full-stack applications built with Next.js, Remix, Nuxt, Astro, SvelteKit, Nest, SolidStart, and Vite work in Bun.Note — For a detailed breakdown of Node.js compatibility, check out: bun.sh/nodejs.SpeedBun is fast, starting up to 4x faster than Node.js. This difference is only magnified when running a TypeScript file, which requires transpilation before it can be run by Node.js.Bun runs a "hello world" TypeScript file 5x faster than esbuild with Node.js.Unlike Node.js and other runtimes that are built using Google's V8 engine, Bun is built using Apple's WebKit engine. WebKit is the engine that powers Safari and is used by billions of devices every day. It's fast, efficient, and has been battle-tested for decades.TypeScript and JSX supportBun has a JavaScript transpiler that's baked into the runtime. That means you can run JavaScript, TypeScript, and even JSX/TSX files, no dependencies needed.bun index.tsdocument.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#vOYccPwWPMBF");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`bun index.ts`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});bun index.jsxdocument.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#OiNGGVTkQTXm");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`bun index.jsx`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});bun index.tsxdocument.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#tZJEhsowPboS");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`bun index.tsx`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});ESM & CommonJS compatibilityThe transition from CommonJS to ES modules has been slow and full of terrors. After ESM was introduced, Node.js took 5 years before supporting it without an --experimental-modules flag. Regardless, the ecosystem is still full of CommonJS.Bun supports both module systems, all the time. No need to worry about file extensions, .js vs .cjs vs .mjs, or including "type": "module" in your package.json.You can even use import and require(), in the same file. It just works.import lodash from "lodash"; const _ = require("underscore"); document.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#asVInqCLVrjb");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`import lodash from "lodash"; const _ = require("underscore");`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});Web APIsBun has built-in support for the Web standard APIs that are available in browsers, such as fetch, Request, Response, WebSocket, and ReadableStream.const response = await fetch("https://example.com/"); const text = await response.text(); document.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#wwaDXtzYNGTz");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`const response = await fetch("https://example.com/"); const text = await response.text();`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});You no longer need to install packages like node-fetch and ws. Bun's built-in Web APIs are implemented in native code, and are faster and more reliable than the third-party alternatives.Hot reloadingBun makes it easier for you to be productive as a developer. You can run Bun with --hot to enable hot reloading, which reloads your application when files change.bun --hot server.tsdocument.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#VOxzdgtOSjvf");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`bun --hot server.ts`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});Unlike tools that hard-restart the entire process, like nodemon, Bun reloads your code without terminating the old process. That means HTTP and WebSocket connections don't disconnect and state isn't lost.PluginsBun is designed to be highly-customizable.You can define plugins to intercept imports and perform custom loading logic. A plugin can add support for additional file types, like .yaml or .png. The Plugin API is inspired by esbuild, which means that most esbuild plugins will just work in Bun.import { plugin } from "bun"; plugin({ name: "YAML", async setup(build) { const { load } = await import("js-yaml"); const { readFileSync } = await import("fs"); build.onLoad({ filter: /\.(yaml|yml)$/ }, (args) => { const text = readFileSync(args.path, "utf8"); const exports = load(text) as Record<string, any>; return { exports, loader: "object" }; }); }, }); document.addEventListener('''
