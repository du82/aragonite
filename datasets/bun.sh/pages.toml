title = "FFI – API | Bun Docs"
description = "Call native code from JavaScript with Bun's foreign function interface (FFI) API."
full_description = '''⚠️ Warning — bun:ffi is experimental, with known bugs and limitations, and should not be relied on in production. The most stable way to interact with native code from Bun is to write a Node-API module.Use the built-in bun:ffi module to efficiently call native libraries from JavaScript. It works with languages that support the C ABI (Zig, Rust, C/C++, C#, Nim, Kotlin, etc).dlopen usage (bun:ffi)To print the version number of sqlite3:import { dlopen, FFIType, suffix } from "bun:ffi"; // `suffix` is either "dylib", "so", or "dll" depending on the platform // you don't have to use "suffix", it's just there for convenience const path = `libsqlite3.${suffix}`; const { symbols: { sqlite3_libversion, // the function to call }, } = dlopen( path, // a library name or file path { sqlite3_libversion: { // no arguments, returns a string args: [], returns: FFIType.cstring, }, }, ); console.log(`SQLite 3 version: ${sqlite3_libversion()}`); document.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#uYsfZvGKPGNd");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`import { dlopen, FFIType, suffix } from "bun:ffi"; // \`suffix\` is either "dylib", "so", or "dll" depending on the platform // you don't have to use "suffix", it's just there for convenience const path = \`libsqlite3.\${suffix}\`; const { symbols: { sqlite3_libversion, // the function to call }, } = dlopen( path, // a library name or file path { sqlite3_libversion: { // no arguments, returns a string args: [], returns: FFIType.cstring, }, }, ); console.log(\`SQLite 3 version: \${sqlite3_libversion()}\`);`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});PerformanceAccording to our benchmark, bun:ffi is roughly 2-6x faster than Node.js FFI via Node-API.Bun generates & just-in-time compiles C bindings that efficiently convert values between JavaScript types and native types. To compile C, Bun embeds TinyCC, a small and fast C compiler.UsageZig// add.zig pub export fn add(a: i32, b: i32) i32 { return a + b; } document.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#nnfeYsTioSMp");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`// add.zig pub export fn add(a: i32, b: i32) i32 { return a + b; }`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});To compile:zig build-lib add.zig -dynamic -OReleaseFastdocument.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#IWQIOmskFpbY");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`zig build-lib add.zig -dynamic -OReleaseFast`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});Pass a path to the shared library and a map of symbols to import into dlopen:import { dlopen, FFIType, suffix } from "bun:ffi"; const { i32 } = FFIType; const path = `libadd.${suffix}`; const lib = dlopen(path, { add: { args: [i32, i32], returns: i32, }, }); console.log(lib.symbols.add(1, 2)); document.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#MucOOKTKqptz");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`import { dlopen, FFIType, suffix } from "bun:ffi"; const { i32 } = FFIType; const path = \`libadd.\${suffix}\`; const lib = dlopen(path, { add: { args: [i32, i32], returns: i32, }, }); console.log(lib.symbols.add(1, 2));`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});Rust// add.rs #[no_mangle] pub extern "C" fn add(a: i32, b: i32) -> i32 { a + b } document.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#VihHArvlvhOG");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`// add.rs #[no_mangle] pub extern "C" fn add(a: i32, b: i32) -> i32 { a + b }`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});To compile:rustc --crate-type cdylib add.rsdocument.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#CawUjpKbQhWZ");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`rustc --crate-type cdylib add.rs`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});C++#include <cstdint> extern "C" int32_t add(int32_t a, int32_t b) { return a + b; } document.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#xLDYaNjCagMY");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`#include <cstdint> extern "C" int32_t add(int32_t a, int32_t b) { return a + b; }`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});To compile:zig build-lib add.cpp -dynamic -lc -lc++document.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#aVWqibphfBTw");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`zig build-lib add.cpp -dynamic -lc -lc++`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});FFI typesThe following FFIType values are supported.FFITypeC TypeAliasesbufferchar*cstringchar*function(void*)(*)()fn, callbackptrvoid*pointer, void*, char*i8int8_tint8_ti16int16_tint16_ti32int32_tint32_t, inti64int64_tint64_ti64_fastint64_tu8uint8_tuint8_tu16uint16_tuint16_tu32uint32_tuint32_tu64uint64_tuint64_tu64_fastuint64_tf32floatfloatf64doubledoubleboolboolcharcharnapi_envnapi_envnapi_valuenapi_valueNote: buffer arguments must be a TypedArray or DataView.StringsJavaScript strings and C-like strings are different, and that complicates using strings with native libraries.How are JavaScript strings and C strings different?JavaScript strings:UTF16 (2 bytes per letter) or potentially latin1, depending on the JavaScript engine & what characters are usedlength stored separatelyImmutableC strings:UTF8 (1 byte per letter), usuallyThe length is not stored. Instead, the string is null-terminated which means the length is the index of the first \0 it findsMutabledocument.querySelector("#bucHCxCehY-summary").addEventListener("click",()=>{const deets=document.querySelector("#bucHCxCehY-details");const open=document.querySelector("#bucHCxCehY-open");const closed=document.querySelector("#bucHCxCehY-closed");if(deets.classList.contains("hidden")){deets.classList.remove("hidden");open.classList.remove("hidden");closed.classList.add("hidden")}else{deets.classList.add("hidden");open.classList.add("hidden");closed.classList.remove("hidden")}});To solve this, bun:ffi exports CString which extends JavaScript's built-in String to support null-terminated strings and add a few extras:class CString extends String { /** * Given a `ptr`, this will automatically search for the closing `\0` character and transcode from UTF-8 to UTF-16 if necessary. */ constructor(ptr: number, byteOffset?: number, byteLength?: number): string; /** * The ptr to the C string * * This `CString` instance is a clone of the string, so it * is safe to continue using this instance after the `ptr` has been * freed. */ ptr: number; byteOffset?: number; byteLength?: number; } document.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#ttPBIOLdXXic");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`class CString extends String { /** * Given a \`ptr\`, this will automatically search for the closing \`\\0\` character and transcode from UTF-8 to UTF-16 if necessary. */ constructor(ptr: number, byteOffset?: number, byteLength?: number): string; /** * The ptr to the C string * * This \`CString\` instance is a clone of the string, so it * is safe to continue using this instance after the \`ptr\` has been * freed. */ ptr: number; byteOffset?: number; byteLength?: number; }`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});To convert from a null-terminated string pointer to a JavaScript string:const myString = new CString(ptr); document.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#AVZxDrbmuRqy");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`const myString = new CString(ptr);`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});To convert from a pointer with a known length to a JavaScript string:const myString = new CString(ptr, 0, byteLength); document.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#DSaSLjRuqKbQ");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`const myString = new CString(ptr, 0, byteLength);`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});The new CString() constructor clones the C string, so it is safe to continue using myString after ptr has been freed.my_library_free(myString.ptr); // this is safe because myString is a clone console.log(myString); document.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#aQnsGWsQuXTC");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`my_library_free(myString.ptr); // this is safe because myString is a clone console.log(myString);`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});When used in returns, FFIType.cstring coerces the pointer to a JavaScript string. When used in args, FFIType.cstring is identical to ptr.Function pointersNote — Async functions are not yet supported.To call a function pointer from JavaScript, use CFunction. This is useful if using Node-API (napi) with Bun, and you've already loaded some symbols.import { CFunction } from "bun:ffi"; let myNativeLibraryGetVersion = /* somehow, you got this pointer */ const getVersion = new CFunction({ returns: "cstring", args: [], ptr: myNativeLibraryGetVersion, }); getVersion(); document.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#NuNRQLQkEySd");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`import { CFunction } from "bun:ffi"; let myNativeLibraryGetVersion = /* somehow, you got this pointer */ const getVersion = new CFunction({ returns: "cstring", args: [], ptr: myNativeLibraryGetVersion, }); getVersion();`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});If you have multiple function pointers, you can define them all at once with linkSymbols:import { linkSymbols } from "bun:ffi"; // getVersionPtrs defined elsewhere const [majorPtr, minorPtr, patchPtr] = getVersionPtrs(); const lib = linkSymbols({ // Unlike with dlopen(), the names here can be whatever you want getMajor: { returns: "cstring", args: [], // Since this doesn't use dlsym(), you have to provide a valid ptr // That ptr could be a number or a bigint // An invalid pointer will crash your program. ptr: majorPtr, }, getMinor: { returns: "cstring", args: [], ptr: minorPtr, }, getPatch: { returns: "cstring", args: [], ptr: patchPtr, }, }); const [major, minor, patch] = [ lib.symbols.getMajor(), lib.symbols.getMinor(), lib.symbols.getPatch(), ]; document.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#TBfzMVaKZkGi");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`import { linkSymbols } from "bun:ffi"; // getVersionPtrs defined elsewhere const [majorPtr, minorPtr, patchPtr] = getVersionPtrs(); const lib = linkSymbols({ // Unlike with dlopen(), the names here can be whatever you want getMajor: { returns: "cstring", args: [], // Since this doesn't use dlsym(), you have to provide a valid ptr // That ptr could be a number or a bigint // An invalid pointer will crash your program. ptr: majorPtr, }, getMinor: { returns: "cstring", args: [], ptr: minorPtr, }, getPatch: { returns: "cstring", args: [], ptr: patchPtr, }, }); const [major, minor, patch] = [ lib.symbols.getMajor(), lib.symbols.getMinor(), lib.symbols.getPatch(), ];`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});CallbacksUse JSCallback to create JavaScript callback functions that can be passed to C/FFI functions. The C/FFI function can call into the JavaScript/TypeScript code. This is useful for asynchronous code or whenever you want to call into JavaScript code from C.import { dlopen,'''
