["https://bun.sh/blog/bun-v1.2"]
title = "Bun 1.2 | Bun Blog"
description = "Built-in Postgres client with Bun.sql, built-in S3 object support with Bun.s3, a new text-based lockfile: bun.lock, Express is 3x faster, and a major update on Node.js compatibility."
full_description = '''Bun is complete toolkit for building and testing full-stack JavaScript and TypeScript applications. If you're new to Bun, you can learn more from the Bun 1.0 blog post.Bun 1.2Bun 1.2 is a huge update, and we're excited to share it with you.Here's the tl;dr of what changed in Bun 1.2:There's a major update on Bun's progress towards Node.js compatibilityBun now has a built-in S3 object storage API: Bun.s3Bun now has a built-in Postgres client: Bun.sql (with MySQL coming soon)bun install now uses a text-based lockfile: bun.lockWe also made Express 3x faster in Bun.Node.js compatibilityBun is designed as a drop-in replacement for Node.js.In Bun 1.2, we started to run the Node.js test suite for every change we make to Bun. Since then, we've fixed thousands of bugs and the following Node.js modules now pass over 90% of their tests with Bun.For each of these Node modules, Bun passes over 90% of the Node.js test suite.Here's how we did it.How do you measure compatibility?In Bun 1.2, we changed how we test and improve Bun's compatibility with Node.js. Previously, we prioritized and fixed Node.js bugs as they were reported, usually from GitHub issues where someone tried to use an npm package that didn't work in Bun.While this fixed actual bugs real users ran into, it was too much of a "wack-a-mole" approach. It discouraged doing the large refactors necessary for us to have a shot at 100% Node.js compatibility.That's when we thought: what if we just run the Node.js test suite?There are so many tests in the Node.js repository, that the files can't all be listed on GitHub.Running Node.js tests in BunNode.js has thousands of test files in its repository, with most of them in the test/parallel directory. While it might seem simple enough to "just run" their tests, it's more involved than you might think.Internal APIsFor example, many tests rely on the internal implementation details of Node.js. In the following test, getnameinfo is stubbed to always error, to test the error handling of dns.lookupService().test/parallel/test-dns-lookupService.jsconst { internalBinding } = require("internal/test/binding"); const cares = internalBinding("cares_wrap"); const { UV_ENOENT } = internalBinding("uv"); cares.getnameinfo = () => UV_ENOENT; document.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#xpphyKgNqYjk");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`const { internalBinding } = require("internal/test/binding"); const cares = internalBinding("cares_wrap"); const { UV_ENOENT } = internalBinding("uv"); cares.getnameinfo = () => UV_ENOENT;`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});To run this test in Bun, we had to replace the internal bindings with our own stubs.test/parallel/test-dns-lookupService.jsBun.dns.lookupService = (addr, port) => { const error = new Error(`getnameinfo ENOENT ${addr}`); error.code = "ENOENT"; error.syscall = "getnameinfo"; throw error; }; document.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#OGQIsmXEoJtG");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`Bun.dns.lookupService = (addr, port) => { const error = new Error(\`getnameinfo ENOENT \${addr}\`); error.code = "ENOENT"; error.syscall = "getnameinfo"; throw error; };`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});Error messagesThere are also Node.js tests that check the exact string of error messages. And while Node.js usually doesn't change error messages, they don't guarantee it won't change between releases.const common = require("../common"); const assert = require("assert"); assert.throws( () => Buffer.allocUnsafe(5).copy(Buffer.allocUnsafe(5), -1, 0), { name: 'RangeError', code: 'ERR_OUT_OF_RANGE', message: 'The value of "targetStart" is out of range. It must be >= 0. Received -1' } ); document.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#WoHMujhwQgrQ");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`const common = require("../common"); const assert = require("assert"); assert.throws( () => Buffer.allocUnsafe(5).copy(Buffer.allocUnsafe(5), -1, 0), { name: 'RangeError', code: 'ERR_OUT_OF_RANGE', message: 'The value of "targetStart" is out of range. It must be >= 0. Received -1' } );`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});To work around this, we had to change the assertion logic in some tests to check the name and code, instead of the message. This is also the standard practice for checking error types in Node.js. Additionally, we sometimes update the message when Bun provides more info for the user than Node.js.{ name: "RangeError", code: "ERR_OUT_OF_RANGE", message: 'The value of "targetStart" is out of range. It must be >= 0. Received -1' message: 'The value of "targetStart" is out of range. It must be >= 0 and <= 5. Received -1' },document.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#eRykkydaRHWX");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`{ name: "RangeError", code: "ERR_OUT_OF_RANGE", message: 'The value of "targetStart" is out of range. It must be >= 0. Received -1' message: 'The value of "targetStart" is out of range. It must be >= 0 and <= 5. Received -1' },`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});While we do try to match the error messages of Node.js as much as possible, there are times where we want to provide a more helpful error message, as long as the name and code are the same.Progress so farWe've ported thousands of files from the Node.js test suite to Bun. That means for every commit we make to Bun, we run the Node.js test suite to ensure compatibility.A screenshot of Bun's CI where we run the Node.js test suite for every commit.Every day, we are adding more and more passing Node.js tests to Bun, and we're excited to share more progress on Node.js compatibility very soon.In addition to fixing existing Node.js APIs, we've also added support for the following Node.js modules.node:http2 serverYou can now use node:http2 to create HTTP/2 servers. HTTP/2 is also necessary for gRPC servers, which are also now supported in Bun. Previously, there was only support for the HTTP/2 client.import { createSecureServer } from "node:http2"; import { readFileSync } from "node:fs"; const server = createSecureServer({ key: readFileSync("key.pem"), cert: readFileSync("cert.pem"), }); server.on("stream", (stream, headers) => { stream.respond({ ":status": 200, "content-type": "text/html; charset=utf-8", }); stream.end("<h1>Hello from Bun!</h1>"); }); server.listen(3000); document.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#faGmOdEUbLdA");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`import { createSecureServer } from "node:http2"; import { readFileSync } from "node:fs"; const server = createSecureServer({ key: readFileSync("key.pem"), cert: readFileSync("cert.pem"), }); server.on("stream", (stream, headers) => { stream.respond({ ":status": 200, "content-type": "text/html; charset=utf-8", }); stream.end("<h1>Hello from Bun!</h1>"); }); server.listen(3000);`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});In Bun 1.2, the HTTP/2 server is 2x faster than in Node.js. When we support new APIs to Bun, we spend a lot of time tuning performance to ensure that it not only works, but it's also faster.Benchmark of a "hello world" node:http2 server running in Bun 1.2 and Node.js 22.13.node:dgramYou can now bind and connect to UDP sockets using node:dgram. UDP is a low-level unreliable messaging protocol, often used by telemetry providers and game engines.import { createSocket } from "node:dgram"; const server = createSocket("udp4"); const client = createSocket("udp4"); server.on("listening", () => { const { port, address } = server.address(); for (let i = 0; i < 10; i++) { client.send(`data ${i}`, port, address); } server.unref(); }); server.on("message", (data, { address, port }) => { console.log(`Received: data=${data} source=${address}:${port}`); client.unref(); }); server.bind(); document.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#SUBNLxQHQolG");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`import { createSocket } from "node:dgram"; const server = createSocket("udp4"); const client = createSocket("udp4"); server.on("listening", () => { const { port, address } = server.address(); for (let i = 0; i < 10; i++) { client.send(\`data \${i}\`, port, address); } server.unref(); }); server.on("message", (data, { address, port }) => { console.log(\`Received: data=\${data} source=\${address}:\${port}\`); client.unref(); }); server.bind();`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});This allows packages like DataDog's dd-trace and @clickhouse/client to work in Bun 1.2.node:clusterYou can use node:cluster to spawn multiple instances of Bun. This is often used to enable higher throughput by running tasks across multiple CPU cores.Here's an example of how you can create a multi-threaded HTTP server using cluster:The primary worker spawns n child workers (usually equal to the number of CPU cores)Each child worker listens on the same port (using reusePort)Incoming HTTP requests are load balanced across the child workersimport cluster from "node:cluster"; import { createServer } from "node:http"; import { cpus } from "node:os"; if (cluster.isPrimary) { console.log(`Primary ${process.pid} is running`); // Start N workers for the number of CPUs for (let i = 0; i < cpus().length; i++) { cluster.fork(); } cluster.on("exit", (worker, code, signal) => { console.log(`Worker ${worker.process.pid} exited`); }); } else { // Incoming requests are handled by the pool of workers // instead of the primary worker. createServer((req, res) => { res.writeHead(200); res.end(`Hello from worker ${process.pid}`); }).listen(3000); console.log(`Worker ${process.pid} started`); } document.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#InLkLNTcHdnl");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`import cluster from "node:cluster"; import { createServer } from "node:http"; import { cpus } from "node:os"; if (cluster.isPrimary) { console.log(\`Primary \${process.pid} is running\`); // Start N workers for the number of CPUs for (let i = 0; i < cpus().length; i++) { cluster.fork(); } cluster.on("exit", (worker, code, signal) => { console.log(\`Worker \${worker.process.pid} exited\`); }); } else { // Incoming requests are handled by the pool of workers // instead of the primary worker. createServer((req, res) => { res.writeHead(200); res.end(\`Hello from worker \${process.pid}\`); }).listen(3000); console.log(\`Worker \${process.pid} started\`); }`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});Note that reusePort is only effective on Linux. On Windows and macOS, the operating system does not load balance HTTP connections as one would expect.node:zlibIn Bun 1.2, we rewrote the entire node:zlib module from JavaScript to native code. This not only fixed a bunch of bugs, but it made it 2x faster than Bun 1.1.Benchmark of inflateSync using node:zlib in Bun and Node.js.We also added support for Brotli in node:zlib, which was missing in Bun 1.1.import { brotliCompressSync, brotliDecompressSync } from "node:zlib"; const compressed = brotliCompressSync("Hello, world!"); compressed.toString("hex"); // "0b068048656c6c6f2c20776f726c642103" const decompressed = brotliDecompressSync(compressed); decompressed.toString("utf8"); // "Hello, world!" document.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#xBnfbTxwTDtP");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`import { brotliCompressSync, brotliDecompressSync } from "node:zlib"; const compressed = brotliCompressSync("Hello, world!"); compressed.toString("hex"); // "0b068048656c6c6f2c20776f726c642103" const decompressed = brotliDecompressSync(compressed); decompressed.toString("utf8"); // "Hello, world!"`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});C++ addons using V8 APIsIf you want to use C++ addons alongside your JavaScript code, the easiest way is to use N-API.However, before N-API existed, some packages used the internal V8 C++ APIs in Node.js. What makes this complicated is that Node.js and Bun use different JavaScript engines: Node.js uses V8 (used by Chrome), and Bun uses JavaScriptCore (used by Safari).Previously, npm packages like cpu-features, which rely on these V8 APIs, would not work in Bun.require("cpu-features")(); document.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#tCdcyKhNaBLz");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`require("cpu-features")();`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});dyld[94465]: missing symbol called fish: Job 1, 'bun index.ts' termina'''
