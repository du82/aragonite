title = "Glob – API | Bun Docs"
description = "Bun includes a fast native Glob implementation for matching file paths."
full_description = 'Bun includes a fast native implementation of file globbing.QuickstartScan a directory for files matching *.ts:import { Glob } from "bun"; const glob = new Glob("**/*.ts"); // Scans the current working directory and each of its sub-directories recursively for await (const file of glob.scan(".")) { console.log(file); // => "index.ts" } document.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#fwTFViJFqbki");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`import { Glob } from "bun"; const glob = new Glob("**/*.ts"); // Scans the current working directory and each of its sub-directories recursively for await (const file of glob.scan(".")) { console.log(file); // => "index.ts" }`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});Match a string against a glob pattern:import { Glob } from "bun"; const glob = new Glob("*.ts"); glob.match("index.ts"); // => true glob.match("index.js"); // => false document.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#brCEjlNrFbGA");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`import { Glob } from "bun"; const glob = new Glob("*.ts"); glob.match("index.ts"); // => true glob.match("index.js"); // => false`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});Glob is a class which implements the following interface:class Glob { scan(root: string | ScanOptions): AsyncIterable<string>; scanSync(root: string | ScanOptions): Iterable<string>; match(path: string): boolean; } interface ScanOptions { /** * The root directory to start matching from. Defaults to `process.cwd()` */ cwd?: string; /** * Allow patterns to match entries that begin with a period (`.`). * * @default false */ dot?: boolean; /** * Return the absolute path for entries. * * @default false */ absolute?: boolean; /** * Indicates whether to traverse descendants of symbolic link directories. * * @default false */ followSymlinks?: boolean; /** * Throw an error when symbolic link is broken * * @default false */ throwErrorOnBrokenSymlink?: boolean; /** * Return only files. * * @default true */ onlyFiles?: boolean; } document.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#UaYjRXeJoQUW");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`class Glob { scan(root: string | ScanOptions): AsyncIterable<string>; scanSync(root: string | ScanOptions): Iterable<string>; match(path: string): boolean; } interface ScanOptions { /** * The root directory to start matching from. Defaults to \`process.cwd()\` */ cwd?: string; /** * Allow patterns to match entries that begin with a period (\`.\`). * * @default false */ dot?: boolean; /** * Return the absolute path for entries. * * @default false */ absolute?: boolean; /** * Indicates whether to traverse descendants of symbolic link directories. * * @default false */ followSymlinks?: boolean; /** * Throw an error when symbolic link is broken * * @default false */ throwErrorOnBrokenSymlink?: boolean; /** * Return only files. * * @default true */ onlyFiles?: boolean; }`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});Supported Glob PatternsBun supports the following glob patterns:? - Match any single characterconst glob = new Glob("???.ts"); glob.match("foo.ts"); // => true glob.match("foobar.ts"); // => false document.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#yDfgZeuSoqIv");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`const glob = new Glob("???.ts"); glob.match("foo.ts"); // => true glob.match("foobar.ts"); // => false`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});* - Matches zero or more characters, except for path separators (/ or \)const glob = new Glob("*.ts"); glob.match("index.ts"); // => true glob.match("src/index.ts"); // => false document.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#bnbPUNKTXwMW");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`const glob = new Glob("*.ts"); glob.match("index.ts"); // => true glob.match("src/index.ts"); // => false`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});** - Match any number of characters including /const glob = new Glob("**/*.ts"); glob.match("index.ts"); // => true glob.match("src/index.ts"); // => true glob.match("src/index.js"); // => false document.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#jKwggwthmekI");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`const glob = new Glob("**/*.ts"); glob.match("index.ts"); // => true glob.match("src/index.ts"); // => true glob.match("src/index.js"); // => false`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});[ab] - Matches one of the characters contained in the brackets, as well as character rangesconst glob = new Glob("ba[rz].ts"); glob.match("bar.ts"); // => true glob.match("baz.ts"); // => true glob.match("bat.ts"); // => false document.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#wKZSJoGcJoqO");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`const glob = new Glob("ba[rz].ts"); glob.match("bar.ts"); // => true glob.match("baz.ts"); // => true glob.match("bat.ts"); // => false`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});You can use character ranges (e.g [0-9], [a-z]) as well as the negation operators ^ or ! to match anything except the characters contained within the braces (e.g [^ab], [!a-z])const glob = new Glob("ba[a-z][0-9][^4-9].ts"); glob.match("bar01.ts"); // => true glob.match("baz83.ts"); // => true glob.match("bat22.ts"); // => true glob.match("bat24.ts"); // => false glob.match("ba0a8.ts"); // => false document.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#ZEcxdqFkUSXr");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`const glob = new Glob("ba[a-z][0-9][^4-9].ts"); glob.match("bar01.ts"); // => true glob.match("baz83.ts"); // => true glob.match("bat22.ts"); // => true glob.match("bat24.ts"); // => false glob.match("ba0a8.ts"); // => false`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});{a,b,c} - Match any of the given patternsconst glob = new Glob("{a,b,c}.ts"); glob.match("a.ts"); // => true glob.match("b.ts"); // => true glob.match("c.ts"); // => true glob.match("d.ts"); // => false document.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#fAIgRRimBccq");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`const glob = new Glob("{a,b,c}.ts"); glob.match("a.ts"); // => true glob.match("b.ts"); // => true glob.match("c.ts"); // => true glob.match("d.ts"); // => false`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});These match patterns can be deeply nested (up to 10 levels), and contain any of the wildcards from above.! - Negates the result at the start of a patternconst glob = new Glob("!index.ts"); glob.match("index.ts"); // => false glob.match("foo.ts"); // => true document.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#dsOQYmUvavps");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`const glob = new Glob("!index.ts"); glob.match("index.ts"); // => false glob.match("foo.ts"); // => true`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});\ - Escapes any of the special characters aboveconst glob = new Glob("\\!index.ts"); glob.match("!index.ts"); // => true glob.match("index.ts"); // => false document.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#xHUzMtHNakpL");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`const glob = new Glob("\\\\!index.ts"); glob.match("!index.ts"); // => true glob.match("index.ts"); // => false`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});'
