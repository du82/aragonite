title = "HTTP client – API | Bun Docs"
description = "Bun implements Web-standard fetch with some Bun-native extensions."
full_description = '''Bun implements the WHATWG fetch standard, with some extensions to meet the needs of server-side JavaScript.Bun also implements node:http, but fetch is generally recommended instead.Sending an HTTP requestTo send an HTTP request, use fetchconst response = await fetch("http://example.com"); console.log(response.status); // => 200 const text = await response.text(); // or response.json(), response.formData(), etc. document.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#dWrUJsLJJQgY");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`const response = await fetch("http://example.com"); console.log(response.status); // => 200 const text = await response.text(); // or response.json(), response.formData(), etc.`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});fetch also works with HTTPS URLs.const response = await fetch("https://example.com"); document.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#BZmfMUkUBECl");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`const response = await fetch("https://example.com");`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});You can also pass fetch a Request object.const request = new Request("http://example.com", { method: "POST", body: "Hello, world!", }); const response = await fetch(request); document.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#MLkzVyudUPna");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`const request = new Request("http://example.com", { method: "POST", body: "Hello, world!", }); const response = await fetch(request);`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});Sending a POST requestTo send a POST request, pass an object with the method property set to "POST".const response = await fetch("http://example.com", { method: "POST", body: "Hello, world!", }); document.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#WxxyCDTSqbxa");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`const response = await fetch("http://example.com", { method: "POST", body: "Hello, world!", });`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});body can be a string, a FormData object, an ArrayBuffer, a Blob, and more. See the MDN documentation for more information.Proxying requestsTo proxy a request, pass an object with the proxy property set to a URL.const response = await fetch("http://example.com", { proxy: "http://proxy.com", }); document.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#FVwFDyzOMvRD");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`const response = await fetch("http://example.com", { proxy: "http://proxy.com", });`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});Custom headersTo set custom headers, pass an object with the headers property set to an object.const response = await fetch("http://example.com", { headers: { "X-Custom-Header": "value", }, }); document.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#MSiAhxnsKzhh");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`const response = await fetch("http://example.com", { headers: { "X-Custom-Header": "value", }, });`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});You can also set headers using the Headers object.const headers = new Headers(); headers.append("X-Custom-Header", "value"); const response = await fetch("http://example.com", { headers, }); document.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#jgNZlRYZEExb");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`const headers = new Headers(); headers.append("X-Custom-Header", "value"); const response = await fetch("http://example.com", { headers, });`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});Response bodiesTo read the response body, use one of the following methods:response.text(): Promise<string>: Returns a promise that resolves with the response body as a string.response.json(): Promise<any>: Returns a promise that resolves with the response body as a JSON object.response.formData(): Promise<FormData>: Returns a promise that resolves with the response body as a FormData object.response.bytes(): Promise<Uint8Array>: Returns a promise that resolves with the response body as a Uint8Array.response.arrayBuffer(): Promise<ArrayBuffer>: Returns a promise that resolves with the response body as an ArrayBuffer.response.blob(): Promise<Blob>: Returns a promise that resolves with the response body as a Blob.Streaming response bodiesYou can use async iterators to stream the response body.const response = await fetch("http://example.com"); for await (const chunk of response.body) { console.log(chunk); } document.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#GEJcTFtvOzCa");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`const response = await fetch("http://example.com"); for await (const chunk of response.body) { console.log(chunk); }`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});You can also more directly access the ReadableStream object.const response = await fetch("http://example.com"); const stream = response.body; const reader = stream.getReader(); const { value, done } = await reader.read(); document.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#XmCPnWWmjphK");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`const response = await fetch("http://example.com"); const stream = response.body; const reader = stream.getReader(); const { value, done } = await reader.read();`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});Streaming request bodiesYou can also stream data in request bodies using a ReadableStream:const stream = new ReadableStream({ start(controller) { controller.enqueue("Hello"); controller.enqueue(" "); controller.enqueue("World"); controller.close(); }, }); const response = await fetch("http://example.com", { method: "POST", body: stream, }); document.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#WYCROBdnqHai");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`const stream = new ReadableStream({ start(controller) { controller.enqueue("Hello"); controller.enqueue(" "); controller.enqueue("World"); controller.close(); }, }); const response = await fetch("http://example.com", { method: "POST", body: stream, });`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});When using streams with HTTP(S):The data is streamed directly to the network without buffering the entire body in memoryIf the connection is lost, the stream will be canceledThe Content-Length header is not automatically set unless the stream has a known sizeWhen using streams with S3:For PUT/POST requests, Bun automatically uses multipart uploadThe stream is consumed in chunks and uploaded in parallelProgress can be monitored through the S3 optionsFetching a URL with a timeoutTo fetch a URL with a timeout, use AbortSignal.timeout:const response = await fetch("http://example.com", { signal: AbortSignal.timeout(1000), }); document.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#bmpYqXvIraAq");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`const response = await fetch("http://example.com", { signal: AbortSignal.timeout(1000), });`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});Canceling a requestTo cancel a request, use an AbortController:const controller = new AbortController(); const response = await fetch("http://example.com", { signal: controller.signal, }); controller.abort(); document.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#KLQEVAdsvvIX");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`const controller = new AbortController(); const response = await fetch("http://example.com", { signal: controller.signal, }); controller.abort();`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});Unix domain socketsTo fetch a URL using a Unix domain socket, use the unix: string option:const response = await fetch("https://hostname/a/path", { unix: "/var/run/path/to/unix.sock", method: "POST", body: JSON.stringify({ message: "Hello from Bun!" }), headers: { "Content-Type": "application/json", }, }); document.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#VZHfmeARtAlE");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`const response = await fetch("https://hostname/a/path", { unix: "/var/run/path/to/unix.sock", method: "POST", body: JSON.stringify({ message: "Hello from Bun!" }), headers: { "Content-Type": "application/json", }, });`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});TLSTo use a client certificate, use the tls option:await fetch("https://example.com", { tls: { key: Bun.file("/path/to/key.pem"), cert: Bun.file("/path/to/cert.pem"), // ca: [Bun.file("/path/to/ca.pem")], }, }); document.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#LUsjoRmmkRws");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`await fetch("https://example.com", { tls: { key: Bun.file("/path/to/key.pem"), cert: Bun.file("/path/to/cert.pem"), // ca: [Bun.file("/path/to/ca.pem")], }, });`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});Custom TLS ValidationTo customize the TLS validation, use the checkServerIdentity option in tlsawait fetch("https://example.com", { tls: { checkServerIdentity: (hostname, peerCertificate) => { // Return an error if the certificate is invalid }, }, }); document.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#kQUpCUzvdDDN");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`await fetch("https://example.com", { tls: { checkServerIdentity: (hostname, peerCertificate) => { // Return an error if the certificate is invalid }, }, });`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});This is similar to how it works in Node's net module.Disable TLS validationTo disable TLS validation, set rejectUnauthorized to false:await fetch("https://example.com", { tls: { rejectUnauthorized: false, }, }); document.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#qordFqWVBFhb");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`await fetch("https://example.com", { tls: { rejectUnauthorized: false, }, });`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});This is especially useful to avoid SSL errors when using self-signed certificates, but this disables TLS validation and should be used with caution.Request optionsIn addition to the standard fetch options, Bun provides several extensions:const response = await fetch("http://example.com", { // Control automatic response decompression (default: true) decompress: true, // Disable connection reuse for this request keepalive: false, // Debug logging level verbose: true, // or "curl" for more detailed output }); document.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#OqRqczIcNPEA");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`const response = await '''
