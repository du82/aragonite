title = "Bun 1.1 | Bun Blog"
description = "Bun now supports Windows!"
full_description = '''Bun is a fast, all-in-one toolkit for running, building, testing, and debugging JavaScript and TypeScript, from a single script to a full-stack application. If you're new to Bun, you can learn more in the Bun 1.0 blog post.Bun 1.1 is huge update.There's been over 1,700 commits since Bun 1.0, and we've been working hard to make Bun more stable and more compatible with Node.js. We've fixed over a thousand bugs, added tons of new features and APIs, and now, Bun supports Windows!Windows SupportYou can now run Bun on Windows 10 and later! This is a huge milestone for us, and we're excited to bring Bun to a whole new group of developers.Bun on Windows passes 98% of our own test suite for Bun on macOS and Linux. That means everything from the runtime, test runner, package manager, bundler — it all works on Windows.To get started with Bun on Windows, run the following command in your terminal:powershell -c "irm bun.sh/install.ps1 | iex"document.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#zYvjPjVFAvez");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`powershell -c "irm bun.sh/install.ps1 | iex"`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});bun install on WindowsBun has a built-in, npm-compatible package manager that installs packages. When installing a Vite React App, bun install runs 18x faster than yarn and 30x faster than npm on Windows.Time spent installing dependencies in a vite react app using `--ignore-scripts` on Windows.bun run on WindowsYou can also run scripts using bun run, which is a faster alternative to npm run. To make bun run even faster on Windows, we engineered a new file-format: .bunx.The .bunx file is a cross-filesystem symlink that is able to start scripts or executables using Bun or Node.js. We decided to create this for several reasons:Symlinks are not guaranteed to work on Windows.Shebangs at the top of a file (#!/usr/bin/env bun) are not read on Windows.We want to avoid creating three permutations of each executable: .cmd, .sh, and .ps1.We want to avoid confusing "Terminate batch job? (Y/n)" prompts.The end result is that bun run is 11x faster than npm run, and bunx is also 11x faster than npx.Time spent running `bunx cowsay` vs `npx cowsay` on Windows.Even if you only use Bun as a package manager and not a runtime, .bunx just works with Node.js. This also solves the annoying "Terminate batch job?" prompt that Windows developers are used to when sending ctrl-c to a running script.bun --watch on WindowsBun has built-in support --watch mode. This gives you a fast iteration cycle between making changes and having those changes affect your code. On Windows, we made to sure to optimize the time it takes between control-s and process reload.On the left, making changes to a test file. On the right, `bun test --watch` on Windows.Node.js APIs on WindowsWe've also spent time optimizing Node.js APIs to use the fastest syscalls available on Windows. For example, fs.readdir() on Bun is 58% faster than Node.js on Windows.Time spent listing files in a directory, 1000 times on Windows.While we haven't optimized every API, if you notice something on Windows that is slow or slower than Node.js, file an issue and we will figure out how to make it faster.Bun is a JavaScript runtimeWindows support is just one anecdote when compared to the dozens of new features, APIs, and improvements we've made since Bun 1.0.Large projects start 2x fasterBun has built-in support for JavaScript, TypeScript, and JSX, powered by Bun's very own transpiler written in highly-optimized native code.Since Bun 1.0, we've implemented a content-addressable cache for files larger than 50KB to avoid the performance overhead of transpiling the same files repeatedly.This makes command-line tools, like tsc, run up to 2x faster than in Bun 1.0.Time spent running `tsc --help` in Bun and Node.js. The Bun ShellBun is now a cross-platform shell — like bash, but also on Windows.JavaScript is the world's most popular scripting language. So, why is running shell scripts so complicated?import { spawnSync } from "child_process"; // this is a lot more work than it could be const { status, stdout, stderr } = spawnSync("ls", ["-l", "*.js"], { encoding: "utf8", }); document.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#OukZrPTIXfYU");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`import { spawnSync } from "child_process"; // this is a lot more work than it could be const { status, stdout, stderr } = spawnSync("ls", ["-l", "*.js"], { encoding: "utf8", });`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});Different platforms also have different shells, each with slightly different syntax rules, behavior, and even commands. For example, if you want to run a shell script using cmd on Windows:rm -rf doesn't work.FOO=bar <command> doesn't work.which doesn't exist. (it's called where instead)The Bun Shell is a lexer, parser, and interpreter that implements a bash-like programming language, along with a selection of core utilities like ls, rm, and cat.The shell can also be run from JavaScript and TypeScript, using the Bun.$ API.import { $ } from "bun"; // pipe to stdout: await $`ls *.js`; // pipe to string: const text = await $`ls *.js`.text(); document.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#TjGivwHdHcax");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`import { $ } from "bun"; // pipe to stdout: await $\`ls *.js\`; // pipe to string: const text = await $\`ls *.js\`.text();`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});The syntax makes it easy to pass arguments, buffers, and pipes between the shell and JavaScript.const response = await fetch("https://example.com/"); // pipe a response as stdin, // pipe the stdout back to JavaScript: const stdout = await $`gzip -c < ${response}`.arrayBuffer(); document.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#zypqgGSDKNpI");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`const response = await fetch("https://example.com/"); // pipe a response as stdin, // pipe the stdout back to JavaScript: const stdout = await $\`gzip -c < \${response}\`.arrayBuffer();`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});Variables are also escaped to prevent command injection.const filename = "foo.js; rm -rf /"; // ls: cannot access 'foo.js; rm -rf /': // No such file or directory await $`ls ${filename}`; document.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#iaBpzisXmICZ");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`const filename = "foo.js; rm -rf /"; // ls: cannot access 'foo.js; rm -rf /': // No such file or directory await $\`ls \${filename}\`;`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});You can run shell scripts using the Bun Shell by running bun run.bun run my-script.shdocument.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#tRLWJKunHGYm");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`bun run my-script.sh`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});The Bun Shell is enabled by default on Windows when running package.json scripts with bun run. To learn more, check out the documentation or the announcement blog post.Bun.GlobBun now has a built-in Glob API for matching files and strings using glob patterns. It's similar to popular Node.js libraries like fast-glob and micromatch, except it matches strings 3x faster.Use glob.match() to match a string against a glob pattern.import { Glob } from "bun"; const glob = new Glob("**/*.ts"); const match = glob.match("src/index.ts"); // true document.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#pjfGdLFkWUXz");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`import { Glob } from "bun"; const glob = new Glob("**/*.ts"); const match = glob.match("src/index.ts"); // true`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});Use glob.scan() to list files that match a glob pattern, using an AsyncIterator.const glob = new Glob("**/*.ts"); for await (const path of glob.scan("src")) { console.log(path); // "src/index.ts", "src/utils.ts", ... } document.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#mYTdGLnkXNKL");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`const glob = new Glob("**/*.ts"); for await (const path of glob.scan("src")) { console.log(path); // "src/index.ts", "src/utils.ts", ... }`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});Bun.SemverBun has a new Semver API for parsing and sorting semver strings. It's similar to the popular node-semver package, except it's 20x faster.Use semver.satisfies() to check if a version satisfies a range.import { semver } from "bun"; semver.satisfies("1.0.0", "^1.0.0"); // true semver.satisfies("1.0.0", "^2.0.0"); // false document.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#ZQjHDFwtnzzb");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`import { semver } from "bun"; semver.satisfies("1.0.0", "^1.0.0"); // true semver.satisfies("1.0.0", "^2.0.0"); // false`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});Use semver.order() to compare two versions, or sort an array of versions.const versions = ["1.1.0", "0.0.1", "1.0.0"]; versions.sort(semver.order); // ["0.0.1", "1.0.0", "1.1.0"] document.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#yVzAkOPUaKMG");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`const versions = ["1.1.0", "0.0.1", "1.0.0"]; versions.sort(semver.order); // ["0.0.1", "1.0.0", "1.1.0"]`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});Bun.stringWidth()Bun also supports a new string-width API for measuring the visible width of a string in a terminal. This is useful when you want to know how many columns a string will take up in a terminal.It's similar to the popular string-width package, except it's 6000x faster.import { stringWidth } from "bun"; stringWidth("hello"); // 5 stringWidth("👋"); // 2 stringWidth("你好"); // 4 stringWidth("👩‍👩‍👧‍👦"); // 2 stringWidth("\u001b[31mhello\u001b[39m"); // 5 document.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#fgevEIcgjhgH");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`import { stringWidth } from "bun"; stringWidth("hello"); // 5 stringWidth("\uD83D\uDC4B"); // 2 stringWidth("你好"); // 4 stringWidth("\uD83D\uDC69‍\uD83D\uDC69‍\uD83D\uDC67‍\uD83D\uDC66"); // 2 stringWidth("\\u001b[31mhello\\u001b[39m"); // 5`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});It supports ANSI escape codes, fullwidth characters, graphemes, and emojis. It also supports Latin1, UTF-16, and UTF-8 encodings, with optimized implementations for each.server.urlWhen you create an HTTP server using Bun.serve(), you can now get the URL of the server using the server.url property. This is useful for getting the formatted URL of a server in tests.import { serve } from "bun"; const server = serve({ port: 0, // random port fetch(request) { return new Response(); }, }); console.log(`${server.url}`); // "http://localhost:1234/" document.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#mmssxKjnMTsU");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`import { serve } from "bun"; const server = serve({ port: 0, // random port fetch(request) { return new Response(); }, }); console.log(\`\${server.url}\`); // "http://localhost:1234/"`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});server.requestIP()You can also get the IP address of a HTTP request using the server.requestIP() method. This does not read headers like X-Forwarded-For or X-Real-IP. It simply returns the IP address of the socket, which may correspond to the IP address of a proxy.import { serve } from "bun"; const server = serve({ port: 0, fetch(request) { console.log(server.requestIP(request)); // "127.0.0.1" return new Response(); }, }); document.addEventListener("DOMContentLoaded",()=>{const clicker=doc'''
