full_description = '''Bun v1.2.4 is here! →Bun is a fast JavaScriptall-in-one toolkit| let handle; function startBlink() { handle = setInterval(() => { // show/hide .blink const blink = document.querySelector(".blink"); blink.style.visibility = blink.style.visibility === "hidden" ? "visible" : "hidden"; }, 500); } function stopBlink() { const blink = document.querySelector(".blink"); blink.style.visibility = "visible"; clearInterval(handle); } const options = ["runtime", "package manager", "bundler", "test runner", "Node-compatible runtime", "all-in-one toolkit"]; async function replaceTyper(){ const typer = document.getElementById("typer"); const current = typer.innerText; const next = options[(options.indexOf(current) + 1) % options.length]; const CHAR_DELAY = 40; const WORD_DELAY = 2300; stopBlink(); while(typer.innerText.length > 0) { typer.innerText = typer.innerText.slice(0, -1); // wait await new Promise((resolve) => setTimeout(resolve, CHAR_DELAY)); } // type in next for(let i = 0; i < next.length; i++) { typer.innerText += next[i]; await new Promise((resolve) => setTimeout(resolve, CHAR_DELAY)); } startBlink(); // wait await new Promise((resolve) => setTimeout(resolve, WORD_DELAY)); replaceTyper(); } startBlink(); setTimeout(()=>{ replaceTyper(); }, 4000); Develop, test, run, and bundle JavaScript & TypeScript projects—all with Bun. Bun is an all-in-one JavaScript runtime & toolkit designed for speed, complete with a bundler, test runner, and Node.js-compatible package manager. Bun aims for 100% Node.js compatibility.Install Bun v1.2.4Linux & macOSWindowsView install scriptcurl -fsSL https://bun.sh/install | bashdocument.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#fOwVCgqngnIk");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`curl -fsSL https://bun.sh/install | bash`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});powershell -c "irm bun.sh/install.ps1 | iex"document.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#AwHVlHCELkOP");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`powershell -c "irm bun.sh/install.ps1 | iex"`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});USED BYExpressPostgresWebSocketExpress.js 'hello world'HTTP requests per second (Linux x64)bun: 59,026 requests per second59,026deno: 25,335 requests per second25,335node: 19,039 requests per second19,039Bunv1.2Denov2.1.6Node.jsv23.6.0View benchmarkWebSocket chat serverMessages sent per second (Linux x64, 32 clients)bun: 2,536,227 messages sent per second2,536,227deno: 1,320,525 messages sent per second1,320,525node: 435,099 messages sent per second435,099Bun.serve()v1.2Deno.serve()v1.2.6ws (Node.js)v23.6.0View benchmarkLoad a huge tableQueries per second. 100 rows x 100 parallel queriesbun: 50,251 queries per second50,251node: 14,398 queries per second14,398deno: 11,821 queries per second11,821Bunv1.2Node.jsv23.6.0Denov2.1.6View benchmark'''
