title = "Bun v1.2.4 | Bun Blog"
description = "Up to 60% faster Bun.build on macOS, codesigning support for single-file executables on macOS, dev server stability improvements, fixes a regression from v1.2.3 affecting Hono, fixes up/down buttons in `bun init` on Windows, and improves Node.js compatibility"
full_description = '''This release makes Bun.build up to 60% faster on macOS, introduces codesigning support for single-file executables on macOS, improves dev server stability, fixes a regression from v1.2.3 affecting Hono, fixes a regression from v1.2.3 affecting bun init on Windows, fixes a bug where stdin streams that were paused immediately would prevent the process from exiting, fixes a bug where Buffer.prototype.indexOf could return incorrect results when searching for number values with a byte offset, and fixes a bug where net.Socket error handlers could receive JSC::Exception objects instead of Error instances.To install Buncurlnpmpowershellscoopbrewdockercurlcurl -fsSL https://bun.sh/install | bashdocument.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#sRmVEuhRLVrH");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`curl -fsSL https://bun.sh/install | bash`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});document.querySelector(".tab-lpwMEEUxeG.tabchild-0").addEventListener("click",(e)=>{document.querySelectorAll(".tab-lpwMEEUxeG.active").forEach((el)=>el.classList.remove("active"));document.querySelectorAll(".tab-lpwMEEUxeG.tabchild-0").forEach((el)=>el.classList.add("active"));document.querySelectorAll(".tabitem-lpwMEEUxeG").forEach((el)=>el.classList.remove("active"));document.querySelectorAll(".tabitem-lpwMEEUxeG.tabchild-0").forEach((el)=>el.classList.add("active"))});npmnpm install -g bundocument.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#PZseEykZwpVS");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`npm install -g bun`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});document.querySelector(".tab-lpwMEEUxeG.tabchild-1").addEventListener("click",(e)=>{document.querySelectorAll(".tab-lpwMEEUxeG.active").forEach((el)=>el.classList.remove("active"));document.querySelectorAll(".tab-lpwMEEUxeG.tabchild-1").forEach((el)=>el.classList.add("active"));document.querySelectorAll(".tabitem-lpwMEEUxeG").forEach((el)=>el.classList.remove("active"));document.querySelectorAll(".tabitem-lpwMEEUxeG.tabchild-1").forEach((el)=>el.classList.add("active"))});powershellpowershell -c "irm bun.sh/install.ps1|iex"document.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#IvRVftiuwcng");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`powershell -c "irm bun.sh/install.ps1|iex"`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});document.querySelector(".tab-lpwMEEUxeG.tabchild-2").addEventListener("click",(e)=>{document.querySelectorAll(".tab-lpwMEEUxeG.active").forEach((el)=>el.classList.remove("active"));document.querySelectorAll(".tab-lpwMEEUxeG.tabchild-2").forEach((el)=>el.classList.add("active"));document.querySelectorAll(".tabitem-lpwMEEUxeG").forEach((el)=>el.classList.remove("active"));document.querySelectorAll(".tabitem-lpwMEEUxeG.tabchild-2").forEach((el)=>el.classList.add("active"))});scoopscoop install bundocument.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#OFvuPGrhJGAa");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`scoop install bun`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});document.querySelector(".tab-lpwMEEUxeG.tabchild-3").addEventListener("click",(e)=>{document.querySelectorAll(".tab-lpwMEEUxeG.active").forEach((el)=>el.classList.remove("active"));document.querySelectorAll(".tab-lpwMEEUxeG.tabchild-3").forEach((el)=>el.classList.add("active"));document.querySelectorAll(".tabitem-lpwMEEUxeG").forEach((el)=>el.classList.remove("active"));document.querySelectorAll(".tabitem-lpwMEEUxeG.tabchild-3").forEach((el)=>el.classList.add("active"))});brewbrew tap oven-sh/bundocument.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#KyTTRqKyoKPr");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`brew tap oven-sh/bun`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});brew install bundocument.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#CkEICdjKKfdR");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`brew install bun`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});document.querySelector(".tab-lpwMEEUxeG.tabchild-4").addEventListener("click",(e)=>{document.querySelectorAll(".tab-lpwMEEUxeG.active").forEach((el)=>el.classList.remove("active"));document.querySelectorAll(".tab-lpwMEEUxeG.tabchild-4").forEach((el)=>el.classList.add("active"));document.querySelectorAll(".tabitem-lpwMEEUxeG").forEach((el)=>el.classList.remove("active"));document.querySelectorAll(".tabitem-lpwMEEUxeG.tabchild-4").forEach((el)=>el.classList.add("active"))});dockerdocker pull oven/bundocument.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#nIwVKuYSTTAD");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`docker pull oven/bun`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});docker run --rm --init --ulimit memlock=-1:-1 oven/bundocument.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#sGUzekXZBLTD");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`docker run --rm --init --ulimit memlock=-1:-1 oven/bun`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});document.querySelector(".tab-lpwMEEUxeG.tabchild-5").addEventListener("click",(e)=>{document.querySelectorAll(".tab-lpwMEEUxeG.active").forEach((el)=>el.classList.remove("active"));document.querySelectorAll(".tab-lpwMEEUxeG.tabchild-5").forEach((el)=>el.classList.add("active"));document.querySelectorAll(".tabitem-lpwMEEUxeG").forEach((el)=>el.classList.remove("active"));document.querySelectorAll(".tabitem-lpwMEEUxeG.tabchild-5").forEach((el)=>el.classList.add("active"))});To upgrade Bunbun upgradedocument.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#oQupwVGEXJIm");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`bun upgrade`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});Bun.build gets up to 60% faster on macOSBun now uses a dedicated I/O threadpool for file operations during builds on macOS and Windows, significantly improving build performance. This addresses filesystem contention issues that were slowing down builds on these platforms.This optimization is automatically enabled on macOS and Windows systems with more than 3 logical CPUs, where it provides the most benefit.In the next version of Bunbun build & Bun․build gets up to 60% faster on macOS pic.twitter.com/JHA4NceCTo— Jarred Sumner (@jarredsumner) February 23, 2025 Codesign single-file executables on macOSPreviously, the executables produced for macOS by bun build --compile could not be code signed, due to an issue with our code handling the Mach-O executable format. Now, these executables can be code signed.In the next version of BunSingle-file executables on macOS support codesigning, thanks to @joglekar_pranav pic.twitter.com/31VnQ0CME4— Bun (@bunjavascript) February 25, 2025 Learn how to codesign compiled executables on macOS.Fixed: bun init ↑↓ on WindowsThe bun init command now works properly on Windows with full support for keyboard navigation. Arrow keys (up/down) work correctly for navigating options, Enter works for selection, and Ctrl+C works to cancel the operation.PS C:\Users\bun\project> bun init ? Select a project template - Press return to submit. Blank React ❯ Library document.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#cQnfJBSJNCgD");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`PS C:\\Users\\bun\\project> bun init ? Select a project template - Press return to submit. Blank React ❯ Library`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});Thanks to @pfgithub for the contribution!Fixed: Regression from v1.2.3 affecting HonoWhen using Hono with Bun, some applications that export default a Hono instance would fail to start with an argument validation error for routes in Bun.serve due to a name conflict with the routes option in Hono. We've added a workaround and integration tests to avoid introducing regressions that affect Hono in the future.import { Hono } from "hono"; const app = new Hono(); app.get("/", (c) => c.text("Hello World!")); export default app; // Now works properly with Bun.serve document.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#DaLRcRbBkldC");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`import { Hono } from "hono"; const app = new Hono(); app.get("/", (c) => c.text("Hello World!")); export default app; // Now works properly with Bun.serve`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});Node.js compatibilityFixed: Stat assertion failure on WindowsWe fixed a bug that in certain cases caused an assertion failure when calling stat in node:fs on Windows.import { stat } from "node:fs/promises"; const stats = await stat("large-file.txt"); console.log(stats.size, stats.mtime); document.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#HMKRwKwhBLds");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`import { stat } from "node:fs/promises"; const stats = await stat("large-file.txt"); console.log(stats.size, stats.mtime);`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});Fixed: net.Socket error handlingA bug has been fixed in node:net socket error handling where bare JSC::Exception objects could be passed to JavaScript code. JSC::Exception is a class used internally by the JavaScript engine, and these objects exhibit strange behavior if they are passed to JavaScript code. Now, all exception objects are properly converted to JavaScript Error instances before being passed to error handlers.const socket = new net.Socket(); socket.on("error", (err) => { console.log(err instanceof Error); // Now always true }); document.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#BYbSiiTAAqQR");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`const socket = new net.Socket(); socket.on("error", (err) => { console.log(err instanceof Error); // Now always true });`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});Thanks to @heimskr for fixing this!net.SocketAddressBun now exposes the SocketAddress class matching Node.js' API, providing a way to represent and manipulate IP socket addresses.import { SocketAddress } from "node:net"; const addr = SocketAddress.parse("[0::1]:1234"); // ipv6 ::1 1234 console.log(addr.family, addr.address, addr.port); document.addEventListener("DOMContentLoaded",()=>{const clicker=document.querySelector("#EJpOTGSAyVqg");clicker.addEventListener("click",(ev)=>{navigator.clipboard.writeText(`import { SocketAddress } from "node:net"; const addr = SocketAddress.parse("[0::1]:1234"); // ipv6 ::1 1234 console.log(addr.family, addr.address, addr.port);`).then(()=>{clicker.querySelector(".clipboard").classList.add("hidden");clicker.querySelector(".check").classList.remove("hidden");setTimeout(()=>{clicker.querySelector(".clipboard").classList.remove("hidden");clicker.querySelector(".check").classList.add("hidden")},2500)})})});Thanks to @DonIsaac for the contribution!Buffer fixesFixed: Buffer.prototype.indexOf for number values with byteOffsetWhile improving our Node.js test coverage for Buffer, we introduced a bug in Bun v1.2.3 that affected Buffer.prototype.indexOf when searching for number values with a byte offset. This has been fixed to properly handle number searches by considering the byte offset, matching Node.js behavior. We've also submitted a PR to Node.js to improve their test coverage for this case (and ours by using their tests).const buffer = Buffer.from("abcdef"); // Searching for character codes (numbers) now works correctly buffer.indexOf(100, 2); // Returns 3 (byte value 100 = 'd' found at index 3) buffer.indexOf(102, 5); // Returns 5 (byte value 102 = 'f' found at index 5) buffer.inde'''
