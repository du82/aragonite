title = "Name that Ware Contest Rules «  bunnie's blog"
full_description = "Name that Ware Contest Rules Spirit: The spirit of this competition is to teach people how to think about reverse engineering hardware by example. Thus, there is an emphasis on trying to disclose the process of arriving at an answer, and not so much the correctness of the answer itself. So, if you happen to work for the company that makes the product I picture on this page, and simply state what it is, you will most likely not win the contest. However, if your logic is well-reasoned and clear, and you arrive at an incorrect answer, you run a high chance of winning. Judging: At the end of each month, bunnie will judge all posts in the comment area for the page. The post will be archived as a permanent page with the winning comment will be called out, along with any additional comments I may have about the ware or the comment. In order to recieve your prize, you must leave me at least your email address in your comment posting (the email will not show up in the comment posting itself). Prizes: The prize may vary from month to month, but nominally, the winner may choose from either a $25 gift card for Amazon.com, or select prizes from the bunniestudios merch page. Some months I may chose a particularly difficult ware, and increase the prize. Other months, I may chose a no-brainer ware and just make the prize having your name entered into the Name that Ware hall of fame. Disclaimers: bunnie reserves the right to judge entries on any metric he choses. Also, by entering a post, you are agreeing to have your post distributed under a Creative Commons non-commercial, share-alike, attribution license. In other words, don’t post anything you feel is proprietary or you would like to reserve for future commercial efforts. This work is licensed under a Creative Commons License. 15 Responses to “Name that Ware Contest Rules” bunnie’s blog » Blog Archive » Name that Ware December 2007 says: January 7, 2008 at 12:36 am […] I’m also going to try something a little bit new for this competition. I’m going to stick with the original rules of Name That Ware–e.g., prizes awarded based on my personal, subjective opinion of “best analysis” merits–but for now I’m going to up the prize stakes. Now that chumbys are shipping to customers, we have a few misfit chumbys that get sent back. Thankfully, we don’t have enough of these returns to make it worthwhile to implement a rework program, so for now they just sit in inventory, gathering dust. Many of these units are “hacker-functional” e.g., a hacker would be happy to get one, but they do not meet the chumby quality standard for some cosmetic reason, such as a loose screw rattling around on the inside. I figure one of the best things we could do for these misfit chumbys is to find them a home in the hands of someone that can breathe new life into them–someone who can hack them and create something new and interesting out of them. Significantly, the unit would not come with any of the packaging or accessories that are part of the usual chumby experience–they would just be a chumby and a power supply in a brown box. […] Necole Mellady says: March 3, 2010 at 2:21 am Lots of Fantastic information in your blogpost, I favorited your blog post so I can visit again in the future, Thanks, Necole Mellady Iliana Boser says: March 15, 2010 at 9:59 am not bad not bad, check out my personal blog! Yong Francy says: March 24, 2010 at 8:06 am Awesome blog, you just got a new follower this very minute Tamara Schultz says: April 9, 2010 at 3:08 am Dang I just entered a long and comprehensive comment, and when I tried to submit it my browser freaked out. Did you get it or do I need to redo it? Flossie Scopel says: April 9, 2010 at 7:56 am Hiya. been following your articles latetly and I came across this one. Thanks, it’ll keep me thinking for a while. Henry Flamio says: April 9, 2010 at 7:17 pm I feel I should say, I enjoy reading this website. Could let me know how I can go about subscribing with it? MSN 