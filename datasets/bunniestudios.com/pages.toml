title = "Hacking the PIC 18F1320 «  bunnie's blog"
full_description = '''Hacking the PIC 18F1320 I thought it would be fun to try out some of the hacking techniques I had heard about on the PIC series of microcontrollers. PIC microcontrollers typically come with a set of “configuration fuses” that typically include settings to prevent the modification or readback of certain regions of memory. Quite often, a legitimate need arises to read out the contents of a secured, programmed PIC. A typical example is a company that has lost the documentation or the personnel that originally created the codes for a secured PIC. This often happens when a company needs to revise or upgrade a legacy line of products. I scored four PIC18F1320’s from Joe’s stash (it’s nice having lots of fellow hackers in San Diego) and started stripping them down. This is what a PIC18F1320 looks like in its native state: The first thing to do is to take the top off so you can see the silicon within. While there are many homebrew techniques for doing this, they typically involve the application of fuming Nitric or Sulfuric acid. Neither of these are compounds that you would want to have around your home, nor are they easy to obtain since Nitric acid in particular is an important compound for explosives fabrication. I’ve found that the easiest and most reliable way to do this is to just send the part to a failure analysis lab, such as MEFAS, and for about $50 and a two-day wait, you can have a decapped part in your hands. For this project, I decapped three total parts; two were functionally decapped (silicon revealed with device still in lead frame, fully functional), and the last one was fully decapsulated so that it was just a bare silicon die completely absent a package. The last die was fully decapsulated because my inspection microscope has a very short working distance at the highest magnifications. A little sweeping around the die revealed several prominent features, as shown below: The above annotations are my best guesses at what various structures do; I could be wrong, and if you happen to have anything to share, please do post a note! One set of structures grabbed my attention immediately: a set of metal shields over transistors, following a regular pattern that had about the right number of devices to account for all the security bits. Full metal shields covering a device is very rare in silicon, and like a big X marking the spot, it draws attention to itself as holding something very important. Let’s think a little bit more about this metal shield. What is the significance? First, let’s review some interesting facts about FLASH technology (the type of memory technology used in this PIC device to store the security fuse information). FLASH technology uses a floating-gate transistor structure very similar to that found in the old UV-eraseable EPROM technologies (remember the days of the ceramic packaged 2716’s with quartz windows?). Data is stored in both FLASH and UV-EPROM devices by causing electrons to tunnel into the floating gate, where the electrons will remain for decades. The extra electrons residing in the floating gate creates a measurable offset in the characteristics of the storage transistor. The difference is that FLASH memory can withdraw the stored electrons (erase the device) using only electrical pulses, whereas a UV-EPROM requires energetic photons to knock the electrons out of the floating gate. The UV light required to accomplish this is typically on a wavelength of around 250 nm. This wavelength of UV is a bit difficult to manipulate, since it requires expensive quartz optics to manipulate without excessive loss. Here’s the important observation that comes out of these facts: FLASH devices can usually also be erased using UV light since they have a similar transistor structure to UV-EPROM devices. The encapsulation around a FLASH device normally prevents any UV light from effectively reaching the die, but since the PIC devices had the plastic around them removed, I can now attempt to apply UV light to see what happens. I performed a simple experiment where I programmed the PIC device with a ramping pattern (0x00->0xFF over and over again) and then tossed it in my UV-EPROM eraser for the length of oh, about a good long shower and some email checking. When I took the device out of the eraser, I found that indeed the FLASH memory was blanked to it’s normal all 1’s state, and that the security fuses were unaffected. Significantly, if I did not bake the PIC device for long enough, I would get odd readings out of the array, such as all 0’s, a phenomemon that I do not understand. I’m supposing it could be due to some effect involving incomplete erasure and the reference bitlines used to drive the reference leg of the sense amps on the FLASH array. Also note that the UV light works just as well on the EEPROM array. Clearly, the metal shields over the security fuses were provisioned to thwart attempts to selectively erase the security fuses while leaving the FLASH memory array unaffected. The picture above illustrates the problem I have (and its solution) (click on the image for a larger, clearer version). In order for the FLASH memory transistor to be erased, high-intensity UV light must strike the floating gate. The metal shield effectively reflects all of the incident light. However, due to the optical index mismatch between the oxide and the silicon interfaces, light at certain angles will reflect off of the silicon surface. In order to witness an example of this reflective effect, jump in a swimming pool and submerse your head and look up at the water-air interface. You will note that the water looks highly reflective at an oblique angle. This is due to the index mismatch between water and air causing total internal reflection of light. This reflection can be used to cause the UV light to bounce up and the metal shield, and bounce back onto the floating gate. Thus, by angling the PIC inside the ROM eraser, I can get enough light to bounce into the FLASH memory transistor region and cause erasure. After a couple of attempts, I developed a technique that seems to work relatively well. Picture of the chip inside the UV eraser (note blue halo around chip due to active UV lamp). The chip is stuck into the antistatic foam at an angle. This still doesn’t prevent me from erasing the desired data in the program FLASH space. In order to prevent erasure of this data, a hard-mask is formed using a very carefully cut piece of electrical tape that was stuck onto the surface of the die using a steady hand, two tweezers, and a microscope. The electrical tape effectively blocks the UV light from directly hitting the FLASH code memory regions, and it also somewhat absorbs light bounced back from the silicon substrate. Here’s a picture of the die in package with electrical tape over the FLASH rom array. Using this technique, I was able to effectively reset the security fuses without impacting the FLASH code array too much. The pictures below show the array memory status according to the programming/readback tool I was using. A part of the code array was still erased, but probably some judicious resizing of the electrical tape could fix that problem. Screenshot of PIC programmer workspace of device settings before erasure. Note settings of security fuses and the values programmed in the FLASH rom in the window behind the fuse window. Screenshot of PIC programmer workspace of device settings after erasure. Note that security fuses are disabled while the FLASH rom contens in the window behind the fuse window read out identically to what was programmed in previously. And thus one can selective erase portions of a PIC’s contents. Fun! 83 Responses to “Hacking the PIC 18F1320” bunnie’s blog » Blog Archive » New Chip Hacker Blog says: November 1, 2007 at 2:11 am […] Flylogic Engineering now has an interesting blog up on chip hacking! If you liked the posts on my blog about chip hacking, you may very much enjoy the postings at Flylogic. They’ve actually got a very nice piece up on the PIC18F1320 which reveals new findings about a device that I have some prior familiarity with. I’m looking forward to reading part II of their series! […] Reply Beeru says: October 14, 2012 at 12:04 pm sir my device is 16f882, 16f887, 16f72 how i found hex file Reply Sean says: December 17, 2015 at 10:38 pm I remember Flylogic looking through microscopes at the SLE4442 to get around the 3-byte, 3-try code. I found a simpler method. There is no LOCK command – it’s set back into secure mode when the power is turned off. I put a groove in the plastic to the +5 & earth with a battery so, once the card was unlocked, you could take it home and use the command ‘read security code’. I know, this is OOOLLLLLDDD but I always look for a simple answer. What can I say about this? Genius at work… and WOW cc microscope & cool hand luke work. Reply Nafez says: February 26, 2016 at 8:23 am Please i want your help i have 16f72 pic I have super pro programmer 280u I can not copy the code or uploade The pic for inverter I did not anderstand the way in your tatorial iam from palestine 00972599907123 my viber mobile or whats up Reply Nafez says: February 26, 2016 at 8:24 am My email fuze.ece@gmail.com Reply merhaba says: March 25, 2020 at 2:51 am https://www.bunniestudios.com/blog/?page_id=40 I read the blog, protected dspic33?read can you help me with this Reply Ashvinbhai dhokiya says: September 12, 2021 at 4:03 am I’m cloning all type microcontroller Please check your my website My mobile number 987 946 6956 please tell me Reply Deepesh says: May 24, 2022 at 5:20 pm I need service to retrieve hex file from a locked microcontroller Reply fatih says: July 21, 2021 at 5:20 pm Can you tell us about this simple method? Reply accusensume says: April 4, 2010 at 11:03 am nice to see you on blog Reply john says: April 29, 2010 at 3:37 am no no no nice to see you! on the blog… nigga Reply Martin says: May 31, 2010 at 11:49 am Do you have any idea how are code protection fuses handled in these PICs ? I mean are they read and data stored in some flip flop during reset, or are all CPx bits hardwired to logic gates disallowing access to certain areas during ICSP programming? Reply gashtaan says: August 11, 2023 at 1:13 pm Hi, it’s quite old post, but it still interests me these days. Have you gain any knowledge about it over the time? Reply Boiling chips in tree sap. « s3c's Blog says: July 19, 2010 at 1:45 am […] – a Cautionary Note Safety Protection Guides and Fact about Microcontroller You Should Know Hacking the PIC 18F1320 IC reverse engineering Blog Silicon […] Reply Migsantiago says: September 29, 2010 at 2:11 pm Hi! What’s the model of microscope you used Bunnie? Reply Peter says: October 16, 2010 at 11:20 am nice meet you! I’m a Korean and working for medical company. We have PIC-18F1320_I/SS to reset count. Can you reset count data ? We will send it to you, if you can. I’m waiting for your answer. have a good day Reply david ding says: November 2, 2010 at 5:26 pm Hi Peter, I am in Toronto. I can work it. Reply Jason says: October 20, 2010 at 7:25 am Bunnie, I’m currently working in the UK on a large counterfeit investigation for a lawfirm of a household name in consumer electronics. We could do with your skills on the team can we please make contact? Best regards, Jason Reply BS says: March 11, 2013 at 11:21 am He’d be mad if he helps you, sorry to say ! The same skills he is sharing here is the ones that could get him in prison… Then again a lot of people have a price. To those i usually say ” we found a slut, all we need now is the right amount of money !!” Reply BS says: March 11, 2013 at 11:22 am *are (late in the night already lol) Reply What? says: June 4, 2015 at 12:49 am What? Reversing hardware doesn’t land you in prison. I do it for a living. Reply Isaac Padget says: October 20, 2010 at 5:29 pm Checkout MySwapsCollection.com For a list of crafts made by girlscouts. Reply mitchell says: December 19, 2010 at 3:09 am I just Googled for shields electronics and Got your Page.Your Post Hacking the PIC 18F1320 « bunnie's blog is really Nice.Pl. keep posting on shields electronics Reply Twistedreflex says: March 17, 2011 at 12:58 pm I have a 16F648A/628A I would like the security feature reset on. Would you be willing to work this chip? Reply Dominic says: March 19, 2011 at 12:11 pm I have a pic16c57c-04/p and I tried to read the program,but was unsucesslful. If you can do anything with chip please contact me. Reply Jack says: March 17, 2013 at 10:37 pm PIC12\16\18\30系列我们能够攻击。And提取出芯片程序代码，如果您需要帮忙，可以联系我。您只需提供一个或者2个样品给我。szjack86@gmail.com。 Reply xin hướng dẫn lấy chương trình từ con pic đã bật chức năng bảo vệ - Page 2 says: August 24, 2012 at 9:55 am […] chương trình của con pic dùng bất cứ phần mềm nào để nạp chip. Đây là link chỉ cách. Tôi sẽ không dịch, bạn nào giỏi tiếng Anh thì tham […] Reply Oswaldo says: January 4, 2013 at 12:37 pm Greetings I wonder if it is possible to read information from a pic or 16f627A 12f627A that are blocked and do that way, if it were so kind to answer a lot would know thank Reply Sunil says: January 21, 2013 at 2:20 pm Can anybody copy code from the following MCUs? MC9S12XS128MAA MC9S12B128 MB90F867ES Reply Tom says: July 15, 2013 at 10:16 pm Those guys from http://www.break-ic.com are good with these types. “Everything they make, we can break”. Reply Jack says: March 18, 2013 at 12:58 am Hello. We were able to extract the MCU program code, copy the code.For example, AVR, PIC, TI, Freescale, Renesas, etc. If you need any help, please contact us. E-mail: szjack86@gmail.com Reply David says: June 11, 2013 at 7:10 pm Hello. Could you tell me if the other PIC Devices are hackable in the same way? Sincerely David Reply Anand says: July 4, 2013 at 7:44 pm Hi… While we fusing program in PIC 16f877a IC by using win pic programmer. if program successfully fused, win pic shows” Programming Failed”. My questions is how win pic tells 