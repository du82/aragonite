full_description = '« Winner, Name that Ware, November 2024 Winner, Name that Ware December 2024 » Name that Ware, December 2024 The ware for December 2024 is shown below. This one should be a cakewalk, and I’m mostly sharing it because I had trouble searching for a recent example at an image quality sufficient to make out most of the part numbers. Maybe this can help someone else in a similar fix! Warm wishes for a safe and happy new year to all! This entry was posted on Tuesday, December 31st, 2024 at 6:05 pm and is filed under name that ware. You can follow any responses to this entry through the RSS 2.0 feed. You can leave a response, or trackback from your own site. 7 Responses to “Name that Ware, December 2024” h says: December 31, 2024 at 6:16 pm well that’s an LED matrix, the kind that big LED video displays are made from. This kind uses the HUB-75E wiring / serial streaming flavour Reply Joe says: December 31, 2024 at 8:07 pm well, you were too fast :o) totally agree, must be an LED tile for a video wall. This one probably: https://kamami.pl/en/matrix/1183431-waveshare-23706-rgb-full-color-led-matrix-panel-2mm-pitch-64×64-pixels-adjustable-brightness-5906623427178.html Reply h says: January 2, 2025 at 8:30 pm Oooo good call on the pitch. Kinda feel I ought to have narrowed down the kind of tile a bit better, given the ubiquity of the things… will have to see whether the adjudicator feels my response was too broad Reply Ian Mason says: December 31, 2024 at 8:50 pm Yeah, the layout gives away that it’s intended to daisy chain and the heap of ICN2037 constant current LED drivers seals the deal. Reply Bryan says: December 31, 2024 at 8:13 pm Agree that it’s the board from an LED matrix as used in shops around here. I found one in the street a few years ago and got it going with an arduino. Reply rasz_pl says: January 1, 2025 at 5:39 pm “HUB75E” gave it away instantly, its some kind of standard for 64×64 led panels. Cheap hackable FPGA controllers have same connectors and some form of 75/75E print on them https://github.com/q3k/chubby75 The amount of plane stitching on this board is surprising :o looks like some fancy audiophile gear. Reply fm says: January 6, 2025 at 6:40 pm Its a waveshare RGB Matrix display https://www.waveshare.com/rgb-matrix-p2-64×64.htm Reply Leave a Reply Click here to cancel reply. Name (required) Mail (will not be published) (required) Website Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() );'
