title = "bunnie's burrow"
full_description = "Irassyaimase! I, like other Web users, am working to fulfill the old man's prophecy by providing this home page. The Internet conquers space; it folds and flattens our four dimensional world of three spacial and one temporal coordinate into a two dimensional world of but one node and one temporal coordinate. And who sez that computers are impersonal? Individuals identify themselves with their home page; every home page is colored by the author. The internet is filled with the synergy of human intellect; it is almost a conscious entity in its own right. Its two-dimensional body is intangible to us, but the internet is our evolutionary successor. I hope to influence this child, if ever so minutely, by configuring these bits into something which will communicate a likeness of myself. My name is Andrew Shane Huang; my Chinese name is Huang(2) Xin(1) Guo(2) (and if you mix my name and my father's, it's a prophecy). I am 183 cm (6 ft) tall, 83.9 kg (185 lb). I'm Asian, but that's a bit general (after all, over 20% of the world is Asian). I was born in 1975 (year of the rabbit), and I call Kalamazoo, MI my home. I just finished my PhD dissertation at the Massachusetts Institute of Technology. I was working in Tom Knight's Project Aries research group. My interests include all aspects of moving information between processors--physics of communication, high speed signalling, reliability, fault tolerance, protocols, data placement, coherence (or lack thereof), and APIs. The project has been undergoing a lot of change lately, so the web page is somewhat out of date, but that's a natural consequence of how fast technology moves these days. Here is a presentation on my work-in-progress (postscript only, try ghostscript to view) with respect to abstract machines and streams, and a short white-paper about some of my ideas on spatially aware decentralized computing. My finished thesis can also be found here. One of the technologies used in our project is PIM (processor-in-memory) technology. The idea is that by integrating processors into memory at the chip level, one can achieve several orders of magnitude more bandwidth--in fact, bandwidth that scales with memory size--and an order of magnitude decrease in latency. This places the idea of getting rid of data caches within the realm of consideration, an important step in large multi-processor systems where cache coherence requirements become a limiting factor. To test out some ideas involving PIM technology in the near term, I have built a simulation platform that centers around a card that plugs into a PC-100 compliant DIMM slot in a PC. The card consists of a fast, 288-bit wide bank of SSRAM connected to a large Xilinx Virtex-E device, and another Virtex-E device to handle the PC-100 interface. Of course, the final system does not call for standard PC parts anywhere, but there are certain barriers to making chips that fosters a compromise =)"
