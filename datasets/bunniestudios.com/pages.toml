full_description = 'On Hacking MicroSD Cards Today at the Chaos Computer Congress (30C3), xobs and I disclosed a finding that some SD cards contain vulnerabilities that allow arbitrary code execution — on the memory card itself. On the dark side, code execution on the memory card enables a class of MITM (man-in-the-middle) attacks, where the card seems to be behaving one way, but in fact it does something else. On the light side, it also enables the possibility for hardware enthusiasts to gain access to a very cheap and ubiquitous source of microcontrollers. In order to explain the hack, it’s necessary to understand the structure of an SD card. The information here applies to the whole family of “managed flash” devices, including microSD, SD, MMC as well as the eMMC and iNAND devices typically soldered onto the mainboards of smartphones and used to store the OS and other private user data. We also note that similar classes of vulnerabilities exist in related devices, such as USB flash drives and SSDs. Flash memory is really cheap. So cheap, in fact, that it’s too good to be true. In reality, all flash memory is riddled with defects — without exception. The illusion of a contiguous, reliable storage media is crafted through sophisticated error correction and bad block management functions. This is the result of a constant arms race between the engineers and mother nature; with every fabrication process shrink, memory becomes cheaper but more unreliable. Likewise, with every generation, the engineers come up with more sophisticated and complicated algorithms to compensate for mother nature’s propensity for entropy and randomness at the atomic scale. These algorithms are too complicated and too device-specific to be run at the application or OS level, and so it turns out that every flash memory disk ships with a reasonably powerful microcontroller to run a custom set of disk abstraction algorithms. Even the diminutive microSD card contains not one, but at least two chips — a controller, and at least one flash chip (high density cards will stack multiple flash die). You can see some die shots of the inside of microSD cards at a microSD teardown I did a couple years ago. In our experience, the quality of the flash chip(s) integrated into memory cards varies widely. It can be anything from high-grade factory-new silicon to material with over 80% bad sectors. Those concerned about e-waste may (or may not) be pleased to know that it’s also common for vendors to use recycled flash chips salvaged from discarded parts. Larger vendors will tend to offer more consistent quality, but even the largest players staunchly reserve the right to mix and match flash chips with different controllers, yet sell the assembly as the same part number — a nightmare if you’re dealing with implementation-specific bugs. The embedded microcontroller is typically a heavily modified 8051 or ARM CPU. In modern implementations, the microcontroller will approach 100 MHz performance levels, and also have several hardware accelerators on-die. Amazingly, the cost of adding these controllers to the device is probably on the order of $0.15-$0.30, particularly for companies that can fab both the flash memory and the controllers within the same business unit. It’s probably cheaper to add these microcontrollers than to thoroughly test and characterize each flash memory chip, which explains why managed flash devices can be cheaper per bit than raw flash chips, despite the inclusion of a microcontroller. The downside of all this complexity is that there can be bugs in the hardware abstraction layer, especially since every flash implementation has unique algorithmic requirements, leading to an explosion in the number of hardware abstraction layers that a microcontroller has to potentially handle. The inevitable firmware bugs are now a reality of the flash memory business, and as a result it’s not feasible, particularly for third party controllers, to indelibly burn a static body of code into on-chip ROM. The crux is that a firmware loading and update mechanism is virtually mandatory, especially for third-party controllers. End users are rarely exposed to this process, since it all happens in the factory, but this doesn’t make the mechanism any less real. In my explorations of the electronics markets in China, I’ve seen shop keepers burning firmware on cards that “expand” the capacity of the card — in other words, they load a firmware that reports the capacity of a card is much larger than the actual available storage. The fact that this is possible at the point of sale means that most likely, the update mechanism is not secured. In our talk at 30C3, we report our findings exploring a particular microcontroller brand, namely, Appotech and its AX211 and AX215 offerings. We discover a simple “knock” sequence transmitted over manufacturer-reserved commands (namely, CMD63 followed by ‘A’,’P’,’P’,’O’) that drop the controller into a firmware loading mode. At this point, the card will accept the next 512 bytes and run it as code. From this beachhead, we were able to reverse engineer (via a combination of code analysis and fuzzing) most of the 8051’s function specific registers, enabling us to develop novel applications for the controller, without any access to the manufacturer’s proprietary documentation. Most of this work was done using our open source hardware platform, Novena, and a set of custom flex circuit adapter cards (which, tangentially, lead toward the development of flexible circuit stickers aka chibitronics). Significantly, the SD command processing is done via a set of interrupt-driven call backs processed by the microcontroller. These callbacks are an ideal location to implement an MITM attack. It’s as of yet unclear how many other manufacturers leave their firmware updating sequences unsecured. Appotech is a relatively minor player in the SD controller world; there’s a handful of companies that you’ve probably never heard of that produce SD controllers, including Alcor Micro, Skymedi, Phison, SMI, and of course Sandisk and Samsung. Each of them would have different mechanisms and methods for loading and updating their firmwares. However, it’s been previously noted that at least one Samsung eMMC implementation using an ARM instruction set had a bug which required a firmware updater to be pushed to Android devices, indicating yet another potentially promising venue for further discovery. From the security perspective, our findings indicate that even though memory cards look inert, they run a body of code that can be modified to perform a class of MITM attacks that could be difficult to detect; there is no standard protocol or method to inspect and attest to the contents of the code running on the memory card’s microcontroller. Those in high-risk, high-sensitivity situations should assume that a “secure-erase” of a card is insufficient to guarantee the complete erasure of sensitive data. Therefore, it’s recommended to dispose of memory cards through total physical destruction (e.g., grind it up with a mortar and pestle). From the DIY and hacker perspective, our findings indicate a potentially interesting source of cheap and powerful microcontrollers for use in simple projects. An Arduino, with its 8-bit 16 MHz microcontroller, will set you back around $20. A microSD card with several gigabytes of memory and a microcontroller with several times the performance could be purchased for a fraction of the price. While SD cards are admittedly I/O-limited, some clever hacking of the microcontroller in an SD card could make for a very economical and compact data logging solution for I2C or SPI-based sensors. Slides from our talk at 30C3 can be downloaded here, or you can watch the talk on Youtube below. Team Kosagi would like to extend a special thanks to .mudge for enabling this research through the Cyber Fast Track program. Please see here for a translation of this page into Russian. 12 Responses to “On Hacking MicroSD Cards” Field Report: 2014-12-12 Retrieve the Costal Discharge Sensors | An Arduino based underwater sensor project says: January 7, 2015 at 10:59 pm […] while the logger slept. (That’s probably some kind of record, and I am temped to mail it to Bunny, to see where it came from.) And just to pour salt on the wound, the 7-8 month lifespan […] Reply 拆客江湖 – My way ! My life ! says: March 5, 2018 at 9:30 pm […] 4） 如何修改MicroSD上的程序達到電腦和MicroSD的數據之間的中間人（Man-In-The-Middle）攻擊；以及 5） 和斯諾登（Edward […] Reply scott taggart says: April 13, 2018 at 9:35 am Fascinating and informative video. Thanks! Reply Memory card data recovery says: August 22, 2018 at 4:13 am The vulnerabilities lie in every data storage device. The possibility depends on the type that is the storage type. There are magnetic storage devices that are the external hard disk drives and SSD or SD cards which are memory chips. Reply porno says: September 16, 2018 at 2:53 am great thanks broooo Reply VAT Consultancy Dubai. says: August 9, 2019 at 3:08 pm A micro SD card can be hack easily by any hacker. This information is very useful and very beneficial. Reply Making your own Linux distribution for the Raspberry Pi for fun and profit, part 1 – Pixelspark says: October 14, 2019 at 2:01 am […] Raspbian is quite complex, you never know what else could cause issues. Additionally, SD cards, being tiny computers themselves, are famous for not coping well with sudden power loss. Our software doesn’t need to write […] Reply Mark Fernandes says: April 1, 2020 at 8:52 pm Hello, Thank you so much for enlightening the community as to these major security vulnerabilities concerning SD cards. I’m drafting some notes about this, and would be grateful if you could confirm whether the following paragraph from the notes, is correct: “SD card firmware is mostly a blackbox according to team Kosagi (in the video linked-to on the webpage), whereas USB device firmware specifications are generally more open and publicly available; this leads one to believe that from a purely programming perspective, it is easier to create malware for USB firmware (than it is for SD card firmware). According to the team, it also appears it is harder to tamper with SD cards by sneakily adding or modifying hardware elements in them, than it is for USB devices (see same video); their quite small size especially compared with USB devices, also supports such a conclusion. Because of these things, SD cards may generally have smaller attack surfaces in relation to both firmware reprogramming, and hardware tampering. Therefore, it may be best to assume that for higher security, if the alternative is USB storage, the use of SD cards is to be preferred for peripheral-based storage and retrieval whenever no extra special security measures are in place. However, because the USB device firmware specifications are more open and publicly available, it could in fact be easier to detect malware in USB devices than it is to do the same in SD cards. Also, reinstalling USB device firmware is often possible but the same for SD cards is generally almost impossible. So if you have a special process in place for ensuring the integrity of USB device firmware in the ways just mentioned, it may actually be more secure to use USB devices than to use SD cards.” Reply Mark Fernandes says: April 2, 2020 at 1:04 am Hello again, Just had a thought, with these security weaknesses in NAND flash, could SSDs be less secure than HDDs, because of something like the following attack: 1) Malware in firmware copies user’s SSD data to blocks O, P, and Q. 2) Malware then marks blocks O, P, and Q as bad blocks to be ignored. 3) Malware then deletes malware firmware code so there’s virtually no evidence that there ever was malware in the firmware. Not really sure how HDDs would deal with such, but would have thought that thorough scans of HDDs would reveal blocks incorrectly marked as bad…. Reply Mark Fernandes says: November 4, 2020 at 1:10 am In case anyone’s interested, I think I’ve figured out a way to be able to use SD cards securely. Simply put, it is to use encryption, so that the SD card isn’t aware of the data it receives and stores. For more about these thoughts, see the content I wrote at https://en.wikibooks.org/wiki/Talk:End-user_Computer_Security/Preliminaries#Dealing_with_the_situation_where_you_want_to_work_with_potentially_security-compromised_equipment/software Such encryption seems to be in play with mobile phone external SD cards where you can choose only to use the external SD card as encrypted storage. Reply David W Clifton says: July 8, 2021 at 12:16 pm Hey I was wondering if a phone could be bugged bby a sd card my girlfriend was giving one by a friend that wants to be more than friends and she said she was talking about taking a ride to a place and 5 min later he calls her saying hey we should take a ride to that eake exact place which dont seek like it could be a coincidence Reply George S Thompson says: August 29, 2022 at 6:19 am Sounds like you’re trying to solve a social problem with a technological answer. Just let her do what she wants and if she’s unfaithful, time to ditch her. Sounds like it’s already time. Reply Leave a Reply Click here to cancel reply. Name (required) Mail (will not be published) (required) Website Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() );'
