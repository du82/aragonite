description = "Author: So Mayer Publisher: Cipher Press Paperback Staff Pick! Sam says… How could I resist these annals of resistance? This book, like So, contains multitudes. It is a debut collection of stories that takes in a lifetime spent thinking, through language, how history might yet be different, if we only to look at it dif"
