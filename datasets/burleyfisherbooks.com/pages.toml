full_description = '#FeaturedMedia-product-template-32736424460538 { max-width: 363.546875px; max-height: 530px; } #FeaturedMedia-product-template-32736424460538-wrapper { max-width: 363.546875px; } <img src="//burleyfisherbooks.com/cdn/shop/files/9781784744267_530x@2x.jpg?v=1700765615" alt="A House for Alice" id="FeaturedMedia-product-template" class="product-featured-media" style="max-width: 530px;"> A House for Alice Regular price £18.99 Sale price £18.99 Regular price Sale Sold out Unit price /per Default Title Error Quantity must be 1 or more Add to cart This item is a recurring or deferred purchase. By continuing, I agree to the cancellation policy and authorize you to charge my payment method at the prices, frequency and dates listed on this page until my order is fulfilled or I cancel, if permitted. Adding product to your cart Author: Diana Evans Publisher: Chatto & Windus Hardback Staff Pick! Cat says… I read Ordinary People by Diana Evans when it came out in 2019 and it has been one of those books that has stayed with me, with its images coming into my head from time to time. With this in mind I knew I had to read A House for Alice, a loose sequel to Ordinary People. It has some of the same characters as OP, in particular Melissa and Michael, who are now divorced and in new relationships. We also meet new characters like Melissa’s father Cornelius who dies in a house fire on the same night as the Grenfell Tower Fire, and Alice, her mother who decides after his death to leave London and spend her last years in her home country of Nigeria. Evans is an absolute master of free indirect discourse, and the book is populated with characters whose minds we move in and out of seamlessly. The broad scope of characters is matched by how much of London she covers as the book moves around the city with the characters. From Kilburn to Peckham, it feels like we’re in the safe hands of a Londoner, or of course several Londoners. Share Share on Facebook Tweet Tweet on Twit