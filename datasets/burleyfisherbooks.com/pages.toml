["https://burleyfisherbooks.com/blogs/news/events-handy-guide-for-publishers"]
title = """
Events - Handy guide for publishers
– Burley Fisher Books"""
description = """
We love events at Burley Fisher, and we are very pleased to be welcoming people back to the shop after such a difficult period!
We thought it would be handy to make a short guide explaining how we programme events at the shop to hopefully answer a lot of the questions that any potential writer or publisher might have.
First thing is, please send all questions or enquiries to events[at]burleyfisherbooks.com
Now, some basic details:

Capacity is 35-40 seated, 50 standing
We have a fully licensed bar with beer, wine and soft drinks
Doors will be at 6.30pm for around a 7pm start. We aim to be finished by 9/9.30pm
We cannot host events during opening hours (10 am - 6 pm)
We are wheelchair accessible. Unfortunately our toilet is not. 

We hold two types of events

Events on a hire basis i.e. launches, publisher showcases etc
Events which we programme i.e. in conversation events

Conditions for hire-basis events:

We have a £100 non-refundable hire charge to cover staffing, insurance, depreciation etc. Once the fee is received the ﻿date of the booking is confirmed.
We have a minimum £150 bar spend. Either publishers can put money behind the bar or people can buy their own drinks and, if less that £150 is spent, we recover the difference from the publisher
We ask that all books sold at events are supplied to us at our standard terms. For small presses see this guide. For larger publishers, we will order with your reps.
Launches can be either public or private (your choice). For public launches we're very happy to list the event on our website and create a free ticketing page.

Conditions for programmed events:

We charge £5 tickets to cover staffing, insurance, depreciation etc
With programmed events we have to assess whether we think we are able to draw an audience. Please do not be offended if we are unable to accommodate you or, if you are emailing from a publisher, your authors. We have to be realistic about what people in the local area will turn up for!
Have a look at the events on our website to get an idea of the kinds of thing that we do (or come along to one! ;))
We will upload events to our calendar, create a ticketing page, and promote the event via our newsletter and socials – we expect that you (publisher, author/s) will also promote the event. We can supply our logo and links as needed.
We ask that all books sold at events are supplied to us at our standard terms. For small presses see this guide. For larger publishers, we will order with your reps.﻿
The bar will be open
Any pitches, please send to events[at]burleyfisherbooks.com

Thank you! Hope to see you for an event at the shop soon xox"""
