description = "Editor: Leone Ross Publisher: Peepal Tree Paperback Staff Pick! So says… As you’d expect from the author of This One Sky Day, this anthology edited by Leone Ross spills marvels: every story is a surprise and yet they build a fantastic multi-faceted world together, one that draws on Afrofuturism with a witty British sla"
