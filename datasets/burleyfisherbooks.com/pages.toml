description = "Author: Mark Hyatt Editors: Sam Ladkin and Luke Roberts Publisher: Nightboat Books Paperback Staff Pick! Sam says… In his brief, tragic but beautiful life, the time given to Mark to write was briefer still. After an abusive childhood, he learned to read and write when he was thirteen. When he ended his life in the 70s,"
full_description = '#FeaturedMedia-product-template-31951696560378 { max-width: 352.78125px; max-height: 530px; } #FeaturedMedia-product-template-31951696560378-wrapper { max-width: 352.78125px; } <img src="//burleyfisherbooks.com/cdn/shop/files/9781643621784_530x@2x.jpg?v=1683732288" alt="So Much for Life: Selected Poems" id="FeaturedMedia-product-template" class="product-featured-media" style="max-width: 530px;"> So Much for Life: Selected Poems Regular price £14.99 Sale price £14.99 Regular price Sale Sold out Unit price /per Default Title Error Quantity must be 1 or more Add to cart This item is a recurring or deferred purchase. By continuing, I agree to the cancellation policy and authorize you to charge my payment method at the prices, frequency and dates listed on this page until my order is fulfilled or I cancel, if permitted. Adding product to your cart Author: Mark Hyatt Editors: Sam Ladkin and Luke Roberts Publisher: Nightboat Books Paperback Staff Pick! Sam says… In his brief, tragic but beautiful life, the time given to Mark to write was briefer still. After an abusive childhood, he learned to read and write when he was thirteen. When he ended his life in the 70s, his poems were almost lost, but for the intervention of other poets who drove overnight to collect and Xerox them. Out of this small window of time, he bathes us in light. Beautiful, melancholic, wry and liltingly musical, his poems chronicle hus struggles with depression, rejection and the legacy of his childhood abuse. They also speak of boredom, horniness, curiosity, altogether of a fertile and fragile intelligence, which shone for far too short a time. Share Share on Facebook Tweet Tweet on Twitter Pin it Pin on Pinterest {"id":7974238454010,"title":"So Much for Life: Selected Poems","handle":"so-much-for-life-selected-poems","description":"\u003cp\u003eAuthor: Mark Hyatt\u003c\/p\u003e\n\u003cp\u003eEditors: Sam Ladkin and Luke Roberts\u003c\/p\u003e\n\u003cp\u003ePublisher: Nightboat Boo