realistic about what people in the local area will turn up for! Have a look at the events on our website to get an idea of the kinds of thing that we do (or come along to one! ;)) We will upload events to our calendar, create a ticketing page, and promote the event via our newsletter and socials – we expect that you (publisher, author/s) will also promote the event. We can supply our logo and links as needed. We ask that all books sold at events are supplied to us at our standard terms. For small presses see this guide. For larger publishers, we will order with your reps.﻿ The bar will be open Any pitches, please send to events[at]burleyfisherbooks.com Thank you! Hope to see you for an event at the shop soon xox Share Share on Facebook Tweet Tweet on Twitter Pin it Pin on Pinterest"
