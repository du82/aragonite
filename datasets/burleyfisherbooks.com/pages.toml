description = "Author: K Patrick Publisher: 4th Estate Hardback Staff Pick! Cat says… Mrs S, set in the 1990s, about a lesbian affair in an all girls’ boarding school between the narrator, who has taken up the job as matron in the school and the eponymous Mrs S, the headteacher’s wife. It is definitely sexy, the will-they-won’t-they"
full_description = '''#FeaturedMedia-product-template-32736442188026 { max-width: 332.078125px; max-height: 530px; } #FeaturedMedia-product-template-32736442188026-wrapper { max-width: 332.078125px; } <img src="//burleyfisherbooks.com/cdn/shop/files/9780008560997_530x@2x.jpg?v=1700766021" alt="Mrs S" id="FeaturedMedia-product-template" class="product-featured-media" style="max-width: 530px;"> Mrs S Regular price £16.99 Sale price £16.99 Regular price Sale Sold out Unit price /per Default Title Error Quantity must be 1 or more Add to cart This item is a recurring or deferred purchase. By continuing, I agree to the cancellation policy and authorize you to charge my payment method at the prices, frequency and dates listed on this page until my order is fulfilled or I cancel, if permitted. Adding product to your cart Author: K Patrick Publisher: 4th Estate Hardback Staff Pick! Cat says… Mrs S, set in the 1990s, about a lesbian affair in an all girls’ boarding school between the narrator, who has taken up the job as matron in the school and the eponymous Mrs S, the headteacher’s wife. It is definitely sexy, the will-they-won’t-they aspect of the plot is paced very well before opening up into a fully blown secret affair. Hung over all of it, however is the sad and frustrating atmosphere of a homophobic society, Section 28 was a law that forbade the ‘promotion’ of homosexuality in schools and was in effect from 1988-2003. The knowledge that the novel is set in this time period gives the affair its doomed romantic quality. We don't ever believe that Mrs S is likely to leave her husband and the protection that their relationship gives her as part of the status quo and we can grieve with the narrator about this, but Mrs S too must suffer this lose, her queerness being secret and shameful, not having the chance to fully realise all the types of people she could love, erotically and otherwise. One of the things I found most interesting about this novel was the distinctions between different types of queerness. How does homophobia affect the narrator, a young butch woman, who people read as gay in different ways to Mrs S, an older, femme and (possibly) bi woman? How does their queerness manifest itself distinctly from how it would in our own time? Would the narrator now think of themselves as a woman at all? There is an important moment between the two characters when Mrs S talks to her lover about why she binds her breasts, whether this means she wants to be a man. Mrs S wants an explanation,‘But she doesn’t understand. And yet understanding is everything to her, she cannot see the ego in it, her need to grasp it all, rather than accept what she does not know.’ I felt moved by this difference between the queer characters (lesbians in a broad sense), them talking during and after sex, the attempt to understand each other and the sometimes failure of this, that they were set up to fail and that they didn’t have the liberty to keep on trying. Share Share on Facebook Tweet Tweet on Twitter Pin it Pin on Pinterest {"id":8090300416250,"title":"Mrs S","handle":"mrs-s","description":"\u003cp\u003eAuthor: K Patrick\u003c\/p\u003e\n\u003cp\u003ePublisher: 4th Estate\u003c\/p\u003e\n\u003cp\u003eHardback\u003c\/p\u003e\n\u003cp\u003e\u003cstrong\u003eStaff Pick! Cat says…\u003c\/strong\u003e\u003c\/p\u003e\n\u003cp\u003e\u003ci\u003e\u003cspan style=\"font-weight: 400;\"\u003eMrs S\u003c\/span\u003e\u003c\/i\u003e\u003cspan style=\"font-weight: 400;\"\u003e, set in the 1990s, about a lesbian affair in an all girls’ boarding school between the narrator, who has taken up the job as matron in the school and the eponymous Mrs S, the headteacher’s wife.\u003c\/span\u003e\u003c\/p\u003e\n\u003cp\u003eIt is definitely sexy, the will-they-won’t-they aspect of the plot is paced very well before opening up into a fully blown secret affair. Hung over all of it, however is the sad and frustrating atmosphere of a homophobic society, Section 28 was a law that forbade the ‘promotion’ of homosexuality in schools and was in effect from 1988-2003. The knowledge that the novel is set in this time period gives the affair its doomed romantic quality. We don't ever believe that Mrs S is likely to leave her husband and the protection that their relationship gives her as part of the status quo and we can grieve with the narrator about this, but Mrs S too must suffer this lose, her queerness being secret and shameful, not having the chance to fully realise all the types of people she could love, erotically and otherwise.\u003cbr\u003e\u003c\/p\u003e\n\u003cp\u003e\u003cspan style=\"font-weight: 400;\"\u003eOne of the things I found most interesting about this novel was the distinctions between different types of queerness. How does homophobia affect the narrator, a young butch woman, who people read as gay in different ways to Mrs S, an older, femme and (possibly) bi woman? How does their queerness manifest itself distinctly from how it would in our own time? Would the narrator now think of themselves as a woman at all? There is an important moment between the two characters when Mrs S talks to her lover about why she binds her breasts, whether this means she wants to be a man. Mrs S wants an explanation,‘But she doesn’t understand. And yet understanding is everything to her, she cannot see the ego in it, her need to grasp it all, rather than accept what she does not know.’ \u003c\/span\u003e\u003c\/p\u003e\n\u003cp\u003e\u003cspan style=\"font-weight: 400;\"\u003eI felt moved by this difference between the queer characters (lesbians in a broad sense), them talking during and after sex, the attempt to understand each other and the sometimes failure of this, that they were set up to fail and that they didn’t have the liberty to keep on trying.\u003c\/span\u003e\u003c\/p\u003e","published_at":"2023-12-12T16:46:19+00:00","created_at":"2023-11-23T19:00:19+00:00","vendor":"Burley Fisher Books","type":"Book","tags":["boty23","curated","LGBT