["https://burleyfisherbooks.com/blogs/news/save-the-date-join-us-for-valentines4palestine"]
title = """
Save the Date! Join Us for #Valentines4Palestine
– Burley Fisher Books"""
description = """
On Wednesday 14 February 2024, Burley Fisher will be one of the many independent bookshops holding #Valentines4Palestine events. Join us in-store for poetry and more: book your £6 ticket here, all proceeds go to the fundraiser.



The event is part of a fundraiser for the PEN Emergency Fund to provide support ringfenced for writers at risk who are in and from Palestine. All proceeds will be directed via English PEN to the PEN Emergency Fund.

For every £1000 we raise, the PEN Emergency Fund will support one emergency grant to a Palestinian writer at risk.


All donations are welcome. Please share news of the event and the fundraiser using the hashtag #Valentines4Palestine. Art by Loose Associations @looseassociations"""
