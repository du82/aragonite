description = "Author: Mickaël Correia Translator: Fionn Petch Publisher: Pluto Paperback Staff Pick! So says… If you like your football grassroots, community-owned, politically-radical, antifa, anti-corruption, feminist and generally on the barricades, this Eric Cantona drop-kick of a book is for you. Correia, a social issues journa"
