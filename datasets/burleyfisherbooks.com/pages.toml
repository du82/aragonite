title = """
Burley Fisher Books
– Burley Fisher Books"""
description = "Haggerston's independent bookshop"
full_description = '''Welcome to Burley Fisher BooksShop <div class="hero hero--medium hero__overlay" role="img" aria-label="shopfront" style="background-image: url('//burleyfisherbooks.com/cdn/shop/files/sam_shop_2048x.jpg?v=1613705273'); background-position: center center;"></div> Haggerston's independent bookseller We are a bookshop in Haggerston, East London, selling new and second hand books with a specialism in indie presses and zines.We were London's bookshop of the year 2021 and 2022.Our website is still a work in progress, so if there is anything you can't find please don't hesitate to contact us using the link at the top! #TextColumnImage-1594126227035 { max-width: 589.4392523364486px; max-height: 530px; } #TextColumnImageWrapper-1594126227035 { max-width: 589.4392523364486px; } <p> <img src="//burleyfisherbooks.com/cdn/shop/files/BFXmas_480x480@2x.jpg?v=1700773194" class="feature-row__image" /> </p> Books of the Year 2024 It's our favourite time of the year, when we get to play Santa and stack up bookish goodies under your tree! The Burley Fisher elves – Cat, Emma, Enya, Forest, Lu, Sam & So – have been in the workshop crafting our reviews for your delectation. Click on any link to order online, or sleigh by the shop to pick up & get them wrapped up! Fiction, Short Fiction, Non-Fiction, Poetry, Younger Readers, and Zines all blurbed passionately below, or hit the collection and get stuck in. As ever, we're celebrating indie presses, writing in translation & our collective bookish curiosity to bring you some books you may already love – and some that may surprise you (and your family, your friends, your co-workers & anyone you need to Secret Santa…).Our overall Book of the Year is ADAM BY GBOYEGA ODUBANJO! Get your crackers and paper crowns ready to celebrate it in-store on 18 December 2024, with readings and presence (if not presents). As Emz says, "Most of my favourite books of this year have been from events that have been held in the shop. Sometimes the best way to be introduced to a book is hearing the author speak about it!" Read about & order our Books of the Year #TextColumnImage-feature-columns-1 { max-width: 530.0px; max-height: 530px; } #TextColumnImageWrapper-feature-columns-1 { max-width: 530.0px; } <p> <img src="//burleyfisherbooks.com/cdn/shop/files/riso_480x480@2x.jpg?v=1729788593" class="feature-row__image" /> </p> Burley Fisher Community Press Thanks to a grant from the arts council, we are now offering an affordable risograph printing service at the bookshop.A quick explainer, provided by the good folks at Risotto Studio:It looks like a photocopier, but works as a screenprinter; using rich spot colours and stencils to create tactile and vibrant prints, affordably and with little impact to our environment.Risograph printing has been used for high-volume printing in places like schools & political parties for many years, but over the past decade, it has undergone a resurgence with creatives adopting the process because of its tactile and unique results!The RISO was designed to be a duplicator, with most of the work and cost in the artwork's set-up. So the more you print, the more economical the price becomes per print.We will be running introductory workshops for those new to the process on how to design posters and zines to take best advantage from this unique printing process.To register interest in the service or in the workshops, please click the button below Register interest Featured: Staff picks Glimpse: An Anthology of Black British Speculative Fiction #ProductCardImage-collection-8087907565818 { max-width: 127.359375px; max-height: 195px; } #ProductCardImageWrapper-collection-8087907565818 { max-width: 127.359375px; } <img class="grid-view-item__image" src="//burleyfisherbooks.com/cdn/shop/files/9781845235420_195x195@2x.jpg?v=1700509070" alt="" style="max-width: 127.359375px;"> Glimpse: An Anthology of Black British Speculative Fiction Regular price £10.99 Sale price £10.99 Regular price Uni