description = "Need printing? Burley Fisher Community Press is at your service. A risograph printing service is in operation for writers, artists, zine-makers and local businesses. We can advise on printing zines, pamphlets, magazines, journals, posters, flyers, leaflets, prints, invitations, menus, cards, forms and more. Each projec"
full_description = "Burley Fisher Community Press: Printing Service by Sam Fisher February 7, 2025 Need printing? Burley Fisher Community Press is at your service. A risograph printing service is in operation for writers, artists, zine-makers and local businesses. We can advise on printing zines, pamphlets, magazines, journals, posters, flyers, leaflets, prints, invitations, menus, cards, forms and more. Each project has different requirements so get in touch if you’d like a quote: print@burleyfisherbooks.com The risograph machine was designed to be a duplicator so it can print at commercial speed. Most of the time and cost goes into the set-up of the artwork - it is therefore more economical to print in larger quantities. We have a two-drum printer which means that two colours can be printed at a time. If you require more than two colours then the paper will be fed through the printer again. We can print up to A3 size and on paper under 210gsm and over 80gsm. We use recycled paper - email or visit the shop to look at samples. Your print file must be sent as a PDF with a 5mm bleed. If you are unsure how to lay out a zine/pamphlet for print we can email you a template or lay it out for you at extra cost. If you are new to making zines please consider attending one of our introductory zine-making workshops! We have four ink drums so we can offer four different colours: Black #000000 Blue #0078bf Fluorescent Pink #ff48b0 Sunflower Yellow #ffb511 The HEX codes are approximations of the coloured inks which you can use to make digital mock-ups of your design. Risograph inks can be layered to create different colours. The opacity of your design can also be lowered to create different shades. Please see our colour chart below for examples of this. Risograph printing is a sustainable alternative to other forms of digital printing as it uses very little energy. Riso inks are plant-based and the master roll which makes the stencil is made from plant fibres. Here are some examples of what we have printed for people so far (and here is what we have printed and published ourselves): Share Share on Facebook Tweet Tweet on Twitter Pin it Pin on Pinterest"
