description = "Author: Julia Armfield Publisher: Picador Paperback Staff Pick! Cat says… I was very impressed with the structure of this novel. The narrative splits between two wives, Leah and Miri. Leah has returned from a deep sea mission in a submarine where something has gone badly wrong, her story is concerned with what happened"
