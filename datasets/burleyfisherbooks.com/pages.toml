["https://burleyfisherbooks.com/blogs/news/palestinian-campaign-for-the-academic-and-cultural-boycott-of-israel-pacbi-x-burley-fisher-books"]
title = """
Palestinian Campaign for the Academic and Cultural Boycott of Israel (
– Burley Fisher Books"""
description = """
Joining with many writers, publishers and bookshops, Burley Fisher Books is signing on to the call of the Palestinian Campaign for the Academic and Cultural Boycott of Israel (PACBI) for boycott, divestment and sanctions (BDS). This means boycotting complicit academic and cultural products and institutions, including any cultural activity funded by the Israeli state.
Initiated in 2004 and inspired by the cultural boycott campaign against apartheid South Africa, PACBI aims to draw a line between culture workers and the actions of governments funding and endorsing the ethnic cleansing of Palestinians by Israel. 
PACBI is institutional and does not target individuals as such. Committed to freedom of expression as stipulated in the United Nations International Covenant on Civil and Political Rights (ICCPR), PACBI rejects, on principle, boycotts of individuals based on their opinion or identity (such as citizenship, race, gender, or religion).
For more information on the BDS movement, please see this link:
https://bdsmovement.net/pacbi
And to see other writers and institutions who are signed up, please follow this link:
https://www.writersagainstthewarongaza.com/pacbi
Let's see an end to the war on Gaza.
Burley Fisher Books"""
full_description = "Palestinian Campaign for the Academic and Cultural Boycott of Israel (PACBI) x Burley Fisher Books by Sam Fisher October 24, 2024 Joining with many writers, publishers and bookshops, Burley Fisher Books is signing on to the call of the Palestinian Campaign for the Academic and Cultural Boycott of Israel (PACBI) for boycott, divestment and sanctions (BDS). This means boycotting complicit academic and cultural products and institutions, including any cultural activity funded by the Israeli state. Initiated in 2004 and inspired by the cultural boycott campaign against apartheid South Africa, PACBI aims to draw a line between culture workers and the actions of governments funding and endorsing the ethnic cleansing of Palestinians by Israel. PACBI is institutional and does not target individuals as such. Committed to freedom of expression as stipulated in the United Nations International Covenant on Civil and Political Rights (ICCPR), PACBI rejects, on principle, boycotts of individuals based on their opinion or identity (such as citizenship, race, gender, or religion). For more information on the BDS movement, please see this link: https://bdsmovement.net/pacbi And to see other writers and institutions who are signed up, please follow this link: https://www.writersagainstthewarongaza.com/pacbi Let's see an end to the war on Gaza. Burley Fisher Books Share Share on Facebook Tweet Tweet on Twitter Pin it Pin on Pinterest"
