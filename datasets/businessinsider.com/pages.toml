["https://businessinsider.com/cities-abroad-lowest-cost-of-living-highest-quality-of-life-2025-2"]
title = "8 Global Cities With Lowest Cost of Living, Highest Quality of Life - Business Insider"
description = "Live your best life in these relatively affordable spots abroad, where housing, a cup of coffee, and a gym membership are cheaper than in the US."
full_description = '''Real Estate 8 cities around the world with the lowest cost of living and highest quality of life Alcynna Lloyd, Jordan Pandy, and Dan Latu 2025-03-01T09:15:02Z Share icon An curved arrow pointing right. Share Facebook Email X LinkedIn Copy Link lighning bolt icon An icon in the shape of a lightning bolt. Impact Link Save Article Icon A bookmark Save Read in app Kuala Lumpur is one of the international cities with both a low cost of living and a high quality of life. lechatnoir/Getty Images This story is available exclusively to Business Insider subscribers. Become an Insider and start reading now. Have an account? Log in. Many Americans tell Business Insider how they moved abroad for more affordable and fulfilling lives.Mercer consultants identified cities that offer low costs of living and a high quality of life.The eight spots range from Old-World gems in Eastern Europe to a Canadian hub for food and culture. As inflation continues to drive up the cost of everyday necessities, more Americans are looking abroad, hoping to find places where their money goes further and life is sweeter.But where to go? Researchers at HR and financial consulting firm Mercer analyzed over 200 everyday expenses, including housing, food, healthcare, and entertainment, in 226 cities worldwide to identify the most and least expensive spots. Mercer also weighed safety, infrastructure, environmental friendliness, and connectivity to determine eight cities in Europe, Asia, and the Americas that offer a balance of low living costs and high living standards.To give readers a feel for day-to-day expenses in each city, Business Insider used cost-of-living data from Numbeo. Numbeo combines user-submitted spending figures with data from government institutions and service companies to estimate prices for various things, such as what it would cost a single person or a family to live in the city center. It also provides typical prices for everyday items like coffee, a meal for two, and a gym membership. While the methodology relies on crowdsourced data, which may vary widely, it can be a useful tool for getting a general sense of what it costs to live around the world.Read on to learn more about eight cities that offer opportunities to live both cheaply and well, according to Mercer. They are presented in alphabetical order. Business Insider used the latest population estimates from Demographia for all cities except Ljubljana, which uses a Slovenian government estimate. Numbeo expenses have been converted from local currency into US dollars. Budapest, Hungary <img class="no-script" src="https://i.insider.com/66a2b66d1a227600e631c635?width=600&format=jpeg&auto=webp" /> Budapest, Hungary. ZoltanGabor/Getty Images Population: 2.407 millionKnown for: Budapest is the largest city in Hungary and the nation's capital. It's known for its Gothic architecture, bohemian nightlife, and historic thermal baths.Average monthly rent for a one-bedroom home in the city center: $670Monthly costs for a single person (excluding housing): $704.40Monthly costs for a family of four (excluding housing): $2,490.90Cost of a cappuccino: $2.49Cost of a three-course meal for two: $52.34Monthly cost of a gym membership: $54.72Someone who lives there said: Budapest has a vibrant social atmosphere all year long, according to Sabrina Arnold, who lived there for four months. "There are so many things to do, even in the winter and summer. In the summer, there's lots of street food, festivals, lots of concerts and music, or you can just chill next to the river," she said in a YouTube video posted in late 2023. "In the winter, there's lots of Christmas markets and ice rinks."It might be hard to live there because: That hustle and bustle may not be for everyone. "It's very touristy. There's always a lot going on in the city especially on the weekends. If you don't like that, then Budapest might not be right for you," Arnold said in her video. Kuala Lumpur, Malaysia <img class="no-script" src="https://i.insider.com/67ac816ceb4be2fff9a45bb2?width=600&format=jpeg&auto=webp" /> Kuala Lumpur, Malaysia Alexander Spatari/Getty Images Population: 9.387 millionKnown for: The capital of Malaysia, Kuala Lumpur is known for its rich multiculturalism, blending native cultures along with Indian, Chinese, and Western influences. The city, nicknamed KL, goes all out for major festivals including Diwali and Lunar New Year.Average monthly rent for a one-bedroom home in the city center: $499.60Monthly costs for a single person (excluding housing): $573.90Monthly costs for a family of four (excluding housing): $2,035.40Cost of a cappuccino: $2.89Cost of a three-course meal for two: $27.13Monthly cost of a gym membership: $43.56Someone who lives there said: Kuala Lumpur's range of cultures translates to an unbeatable food scene. "A city after my own heart, the best activity in KL has to be eating! Malaysians love their food, and so do expats! Thanks to the diversity of the city, you'll find Malaysian, Indian and Chinese food all over, as well as western options and everything in between," blogger Lynne Lessar wrote in a post about living in Kuala Lumpur.It might be hard to live there because: It can require some patience, especially with items and etiquette more common in other parts of the world. "The entertainment industry isn't exactly supported in Malaysia and alcohol is relatively expensive for the region," Lessar wrote. "Still, there are pockets of great nightlife and plenty of great things to do. Just bear in mind that Malaysia is not known for customer service, so keep your spirit light and patience high while you're out, as service takes time here." Ljubljana, Slovenia <img class="no-script" src="https://i.insider.com/67aca5077bb3f854015c9bda?width=600&format=jpeg&auto=webp" /> Ljubljana, Slovenia Tuul & Bruno Morandi/Getty Images Population: 288,382Known for: Ljubljana is the largest city and capital of Slovenia, a country located just east of Italy and sandwiched between Austria and Croatia. Ljubljana stands out for its charm and ease compared to other major European cities that get more flooded with tourists.Average monthly rent for a one-bedroom home in the city center: $931.11Monthly costs for a single person (excluding housing): $885.40Monthly costs for a family of four (excluding housing): $3,023.90Cost of a cappuccino: $2.34Cost of a three-course meal for two: $63Monthly cost of a gym membership: $45.45Someone who lives there said: Aaron Arnold — who moved from Texas to Slovenia, where he lives as an expat — maintains that Ljubljana is one of Europe's best-kept secrets. "Although Ljubljana is growing in the tourism world, it's definitely not as big of a place like Budapest. I think of all the European capital cities that I know — Ljubljana is much more chill and more of a hidden gem," Arnold said in a YouTube video.It might be hard to live there because: Adapting to Slovenian culture can be an adjustment for Americans, in part because locals may not be especially welcoming right off the bat, Arnold said in a different video. "I didn't actually make a friend from Slovenia until three weeks after my arrival," Arnold added. Montreal, Canada <img class="no-script" src="https://i.insider.com/67be038d69253ccddf978502?width=600&format=jpeg&auto=webp" /> Montreal, Canada Atlantide Phototravel/Getty Images Population: 3.75 millionKnown for: Montreal is a French-Canadian hub known for its vibrant cafés, nightlife, and packed schedule of summer festivals. The city is also dotted with historic architecture and European-style sights.Average monthly rent for a one-bedroom home in the city center: $1,201.41Monthly costs for a single person (excluding housing): $973.10Monthly costs for a family of four (excluding housing): $3,593Cost of a cappuccino: $3.52Cost of a three-course meal for two: $69.93Monthly cost of a gym membership: $37.12Someone who lives there said: Montreal is a epicenter of vibrant culture. "No matter which neighborhood you live in, you're guaranteed that a trendy local spot is just around the corner," writer Rosemary Twomey said on the Montreal site MTLblog.com.It might be hard to live there because: Winters are no joke in Montreal — the city averages 85 inches of snow a year. "Although the snow that never seems to disappear is one of the downfalls of Montreal, the city and the people in it are always up to the challenge of having fun in the cold," Twomey wrote. Panama City <img class="no-script" src="https://i.insider.com/5d960557e94e863cb46c2896?width=600&format=jpeg&auto=webp" /> Panama City. Rodrigo Cuel/Shutterstock Population: 2.067 millionKnown for: Panama City is the capital of Panama. It is known for its coastal lifestyle and, of course, its eponymous canal, which connects the Atlantic and Pacific Oceans.Average monthly rent for a one-bedroom home in the city center: $1,050Monthly costs for a single person (excluding housing): $831Monthly costs for a family of four (excluding housing): $2,965.1Cost of a cappuccino: $3.50Cost of a three-course meal for two: $55Monthly cost of a gym membership: $47.43Someone who lives there said: "The city, Latin America's answer to Miami, is a place where towering skyscrapers meet the ocean, and palm trees sway to the rhythm of a unique cultural blend — Spanish vibes with various splashes of indigenous, African, North American and Caribbean influences," according to a blog post from the Nomad Capitalist, a site with advice and information for people who can work remotely and want to live abroad.It might be hard to live there because: Panama City's laid-back vibe may be a good thing most of the time. However, expats have shared online that things get done at a slower pace than they're used to. Santiago, Chile <img class="no-script" src="https://i.insider.com/62ec4adba1c9b900198047ac?width=600&format=jpeg&auto=webp" /> Santiago, Chile. Germán Vogel/Getty Images Population: 7.099 millionKnown for: Santiago's modern city center stands in contrast to the craggy Andes mountains in the distance.Average monthly rent for a one-bedroom home in the city center: $503.71Monthly costs for a single person (excluding housing): $729.50Monthly costs for a family of four (excluding housing): $2,581.6Cost of a cappuccino: $3.05Cost of a three-course meal for two: $52.98Monthly cost of a gym membership: $35.18Someone who lives there said: "Santiago's mountainous backdrop makes for one dramatic skyline. I've lived here for a year and a half now, and (when I can see them) these mountains still surprise me every day," Lauren on Location, who calls herself a serial expat, said in a 2017 blog post.It might be hard to live there because: Santiago is located on the San Ramón Fault and experiences somewhat frequent earthquakes. According to Earthquake Track, the city had 43 earthquakes in the last 365 days. Warsaw, Poland <img class="no-script" src="https://i.insider.com/66a2bbd7a0fc5856d5979608?width=600&format=jpeg&auto=webp" /> Warsaw, Poland. Alexander Spatari/Getty Images Population: 2.028 millionKnown for: Warsaw is Poland's capital and most populous city. It has a rich history and many cultural attractions.Average monthly rent for a one-bedroom home in the city center: $1,052.87Monthly costs for a single person (excluding housing): $820.20Monthly costs for a family of four (excluding housing): $2,694.10Cost of a cappuccino: $3.94Cost of a three-course meal for two: $50.54Monthly cost of a gym membership: $39.55Someone who lives there said: "First and foremost, Warsaw has got some lovely parks and plenty of museums," Richard Blanks, a native of Great Britain living in Poland, said in a blog post about Warsaw life as an expat. "There's no chance that you'll get bored here easily."It might be hard to live there because: Warsaw can have stretches of fiercely cold temperatures. "The weather can be a significant drawback, with cold and long winters, and relatively short summers," Joshua Wood said on Expat Exchange, a site he cofounded. Zagreb, Croatia <img class="no-script" src="https://i.insider.com/5925706ddd08958a318b48d8?width=600&format=jpeg&auto=webp" /> Zagreb, Croatia. Shutterstock/Dreamer4787 Population: 691,000Known for: Zagreb is a city where Central Europe, the Mediterranean, and Southeast Europe meet.Average monthly rent for a one-bedroom home in the city center: $748.67Monthly costs for a single person (excluding housing): $797.50Monthly costs for a family of four (excluding housing): $2,768Cost of a cappuccino: $2.18Cost of a three-course meal for two: $62.87Monthly cost of a gym membership: $42.35Someone who lives there said: "Zagreb is the cultural, political, and economic hub of Croatia. While it might be overshadowed by the Adriatic's coastal gems, this city has its own allure: grand Austro-Hungarian architecture, sprawling parks, and a blend of old-world charm and contemporary dynamism," Jonelle Simunich. a California native with Croatian heritage who has lived in cities around the world, wrote in a blog post.It might be hard to live there because: Zagreb is heavily reliant on tourism, according to blogger Nicola Curtis, and some local businesses shut down during low season. "Most of the bars and restaurants close down from the end of October until the beginning of April, and while it's a chilled-out time, it can be a little boring at times," she wrote. Read next Housing Affordability Canada'''
