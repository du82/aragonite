n with the e-mail newsletter (e-mail opens and clicks) through tracking technology such as pixel tags and web-beacons, which are discussed in Section 4.5. In addition, you may choose to sign up for our loyalty rewards program. If you sign up for our loyalty rewards program, we may collect your email address when you sign-up, in order to send you the reward. 2.2 Automatically Collected Technical Data: When you visit the Website, we automatically collect data about your use of the Website (“Automatically Collected Technical Data”), including: the pages on the Website you have accessed, the IP address you are using, the referrer-URL, the date and time of your visit, your browsing activity, the time, frequency, and duration of page interactions, search queries made, clicks on banners and links, the type of browser and version used to access the Website, whether you have Java and cookies enabled, the operating system used, the type of device you used, demographic information, language settings, geographic location, and other information about how you interacted with this Website. To collect this technical data, we use cookies and similar technologies, which contain a unique identifier, consisting of a string, which enables websites to recognize devices used to access a website on each subsequent visit throughout its lifetime. These identifiers do not allow us to draw any conclusions as to your identity. 2.3 Information You Provide To Our Vendors: Our vendors help us improve your experience on the Website by providing services described in Section 4 of this Policy. As explained in Section 4, they may collect data in performing their services for us that they then may share with us. 3. How We Use and Share the Information We may use and share the information we collect to operate the Website and run our business as described below: 3.1 To provide, customize, measure, and improve this Website; We use the information we collect to provide, manage and improve the technical and functional aspects of the Website, to redesign the Website to be more user-friendly, and to optimize the selection of Website contents and functionalities. We also use the information we collect for internal business purposes such as troubleshooting, data analysis, testing, and research. We do not combine Automatically Collected Technical Data with other data sources. The temporary storage of the IP address of Website Visitors is necessary for technical reasons and to ensure the security of our system, in particular relating to the recognition of misuse. We only retain such data for as long as it is necessary for the stated purposes. IP addresses will be deleted or masked after 14 days at the latest. 3.2 To process and record your redemption of promotional offers; This Website is provided to you free of charge. We pay for this Website through commissions we receive based on your interaction with promotional offers. We use information about your visit to our Website, i.e. your decision to accept our promotional offers, for reporting purposes in order to bill and collect our commission from business partners. 3.3 To offer promotional sweepstakes; When we offer promotional sweepstakes, we typically ask you for certain personal information in order for you to participate. This includes your name, surname, age, address, phone number, social media account, and/or email address. When you provide us this information, we will only use it to administer the sweepstakes—unless you have given your explicit consent to use such data for another purpose. 3.4 To provide you loyalty reward benefits; 3.5 To provide you with our newsletter, personalize your newsletter communications, compile reports on newsletter activities and provide other statistical and analytical services relating to the usage of the newsletter; 3.6 To respond to your inquiries; 3.7 To protect the safety of Website Visitors; 3.8 To fulfill contractual obligations in the event a merger, sale of company assets, consolidation or restructuring, financing, or acquisition of all or a portion of our business by or into another company, or to provide such information in negotiations to create such contractual obligations; 3.9 To enforce our policies and Terms of Service; and 3.10 To provide you with personalized content; We may also use this information to tailor to your interests the content and promotional offers we may display on this Website or otherwise send to you. For this purpose, we create pseudonymised usage profiles. These usage profiles help us to better understand your needs and preferences, so we can provide you with individual and interest-based contents and promotional offers. Pseudonymous usage profiles do not allow us to draw any conclusions as to your identity, and we do not combine user profiles with data that directly identifies you (e.g., email address), unless you have explicitly allowed us to do so. 3.11 To prevent fraud or potentially illegal activities (including, without limitation, copyright infringement) on or through the Website. 4. Third-Party Services We work with various third-party vendors to provide services through the Website to improve the user experience, to better understand how users interact with the Website, and to help provide our users content and advertising that reflects their interests. 4.1 Loyalty Rewards Program If you sign-up for our loyalty rewards program, we may share your information with technical third party service providers with which we have entered into a contractual relationship to assist with the administration of the program. These service providers may process your email address and other personal data on our behalf and in accordance with our instructions, including to help us issuing the Rewards. Our service providers are prohibited from using this information to contact you on their behalf or to disclose the information to third parties, except as necessary to perform services on our behalf. 4.2 Newsletter If you s