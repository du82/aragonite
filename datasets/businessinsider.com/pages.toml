full_description = '''Tech Elon Musk and Neuralink exec Shivon Zilis welcome fourth child together Milan Sehmbi 2025-03-01T13:02:59Z Share icon An curved arrow pointing right. Share Facebook Email X LinkedIn Copy Link lighning bolt icon An icon in the shape of a lightning bolt. Impact Link Save Article Icon A bookmark Save Read in app Andrew Harnik/Getty Image This story is available exclusively to Business Insider subscribers. Become an Insider and start reading now. Have an account? Log in. Neuralink executive Shivon Zilis announced on X that she had welcomed another child with Elon Musk.Musk responded to her post with a heart emoji.The pair had already welcomed three children together: twins Strider and Azure, and daughter Arcadia.Billionaire Elon Musk and Neuralink executive Shivon Zilis have announced the birth of their fourth child together. Zilis first shared the news in a post on X on Friday, writing: "Discussed with Elon and, in light of beautiful Arcadia's birthday, we felt it was better to also just share directly about our wonderful and incredible son Seldon Lycurgus. Built like a juggernaut, with a solid heart of gold. Love him so much."Musk responded to her post with a heart emoji. The pair had already welcomed three children together, twins Strider and Azure, and daughter Arcadia.It comes weeks after influencer Ashley St. Clair said she had also had a child with Musk."Five months ago, I welcomed a new baby into the world. Elon Musk is the father," she wrote on X in mid-February, adding that she had not previously disclosed the news in an effort to protect the child's privacy and safety. Musk has not publicly acknowledged St. Clair's claim.Musk has also welcomed six children with his first wife Justine Wilson: Nevada Alexander (who died at just 10 weeks of age), twins Griffin and Vivian, and triplets Kai, Saxon, and Damian.The Tesla CEO also has three children with the musician Grimes: two sons, X Æ A-12 and Techno Mechanicus, and a daughter, Exa Dark Sideræl. Musk has long warned of the risks posed by declining birth rates.In a post on X in July 2022, he said that "a collapsing birth rate is the biggest danger civilization faces by far" and that he was doing his "best to help the underpopulation crisis." Read next Elon Musk'''
