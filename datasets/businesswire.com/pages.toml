title = "Incyte présentera de nouvelles données de son portefeuille de dermatologie lors du congrès annuel 2025 de l'Académie américaine de dermatologie (AAD) | Business Wire"
description = "Incyte (Nasdaq : INCY) annonce aujourd'hui que de multiples résumés présentant de nouvelles données de son portefeuille de dermatologie seront présent"
full_description = '''Incyte présentera de nouvelles données de son portefeuille de dermatologie lors du congrès annuel 2025 de l'Académie américaine de dermatologie (AAD) - Les résumés pour la crème à base de ruxolitinib (Opzelura®) incluent de multiples présentations sur la dermatite atopique et des données de dernière minute sur le prurigo nodulaire (PN) - Les données de pipeline présentées incluent des données pour l'axatilimab (Niktimvo™) chez les patients présentant des manifestations dermatologiques de la maladie du greffon contre l'hôte (GVHD) chronique March 01, 2025 08:55 PM Eastern Standard Time WILMINGTON, Delaware--(BUSINESS WIRE)--Incyte (Nasdaq : INCY) annonce aujourd'hui que de multiples résumés présentant de nouvelles données de son portefeuille de dermatologie seront présentés lors du congrès annuel 2025 de l'Académie américaine de dermatologie (AAD), qui se tiendra du 7 au 11 mars 2025 à Orlando. « Nous sommes ravis de partager de nouvelles données pour la crème à base de ruxolitinib (Opzelura®) dans de multiples indications, y compris le prurigo nodulaire et l'axatilimab (Niktimvo™) chez les patients présentant des manifestations dermatologiques de la maladie du greffon contre l'hôte (GVHD) chronique lors du congrès annuel de l'AAD de cette année », déclare Jim Lee, M.D., Ph.D., vice-président du groupe, Inflammation et auto-immunité, Incyte. « La participation active d’Incyte à ce congrès clé renforce notre engagement à répondre aux besoins critiques en dermatologie tout en favorisant un dialogue constructif avec les chercheurs, les patients et les parties prenantes afin d’éclairer le développement de traitements innovants. » Les résumés clés comprennent : Présentation orale de dernière minute Prurigo nodulaire (PN) Efficacité et innocuité de la crème Ruxolitinib chez les patients atteints de prurigo nodulaire : résultats d'une étude de phase 3, randomisée, contrôlée par véhicule (TRuE-PN1) (session : S028 – Late-Breaking Research : session 1. Samedi 8 mars 2025, 9h24 ET) Présentations par affiche Dermatite atopique (DA) Innocuité à long terme de la crème Ruxolitinib chez les adultes et les adolescents atteints de dermatite atopique légère à modérée : événements indésirables d'intérêt des études TRuE-AD1 et TRuE-AD2 de phase 3 (résumé : #64524) Association du début de l'administration de la crème Ruxolitinib avec la réduction de l'utilisation d'autres traitements topiques, corticostéroïdes oraux et produits biologiques pour la dermatite atopique, indépendamment de l'utilisation antérieure de produits biologiques (résumé : #64526) Contrôle et sécurité des maladies à 52 semaines avec application au besoin de la crème Ruxolitinib chez les enfants âgés de 2 à 11 ans atteints de dermatite atopique modérée et/ou plus étendue : analyse en sous-groupe de l’étude TRuE-AD3 (résumé : #64656) La crème de Ruxolitinib a démontré des avantages à long terme en matière de contrôle des maladies et de qualité de vie chez les adultes et les adolescents atteints de dermatite atopique légère à modérée (résumé : #64727) Maladie du greffon contre l'hôte (GVHD) Axatilimab pour les patients présentant des manifestations dermatologiques de la maladie du greffon contre l'hôte chronique : une analyse post hoc (résumé : #64616) De plus amples informations concernant le congrès annuel AAD 2025 sont disponibles à l’adresse suivante : https://www.aad.org/member/meetings-education/am25. À propos de la crème Opzelura® (ruxolitinib) 1,5% Opzelura, une nouvelle formulation de la crème à base de ruxolitinib, l’inhibiteur sélectif des enzymes JAK1/JAK2 développée par Incyte, a été approuvée par la U.S. Food & Drug Administration pour le traitement topique du vitiligo non segmentaire chez les patients âgés de 12 ans et plus, et est le premier et le seul traitement approuvé aux États-Unis pour la repigmentation. Opzelura est également approuvé aux États-Unis pour le traitement topique de courte durée et le traitement chronique non continu de la dermatite atopique (DA) légère à modérée chez les patients non immunodéprimés âgés de 12 ans et plus, dont la maladie n’est pas suffisamment contrôlée par des traitements topiques sur ordonnance ou lorsque de tels traitements ne sont pas recommandés. L’utilisation d’Opzelura en association avec des agents biologiques thérapeutiques, d’autres inhibiteurs des enzymes JAK ou des immunosuppresseurs puissants, tels que l’azathioprine ou la ciclosporine, n’est pas recommandée. En Europe, la crème Opzelura (ruxolitinib) 15 mg/g est approuvée pour le traitement du vitiligo non segmentaire avec atteinte faciale chez les adultes et les adolescents de 12 ans et plus. Incyte détient les droits mondiaux de développement et de mise sur le marché de la crème à base de ruxolitinib, commercialisée aux États-Unis sous le nom d’Opzelura. Opzelura et le logo Opzelura sont des marques déposées d’Incyte. À propos de Niktimvo™ (axatilimab-csfr) Niktimvo (axatilimab-csfr) est un anticorps inhibiteur du récepteur du facteur-1 de stimulation des colonies (CSF-1R), dont l'utilisation est approuvée aux États-Unis pour le traitement de la maladie du greffon contre l'hôte (GVHD) chronique après l'échec d'au moins deux lignes antérieures de traitement systémique, chez des patients adultes et pédiatriques pesant au moins 40 kg (88,2 lbs). En 2016, Syndax a obtenu d'UCB les droits exclusifs mondiaux de développement et de mise sur le marché de l'axatilimab. En septembre 2021, Syndax et Incyte ont conclu un accord de licence exclusif de codéveloppement et de co-mise sur le marché à l'échelle mondiale pour l'axatilimab dans le traitement de la GVHD chronique et de toute autre indication future. L’axatilimab fait l’objet d’essais d’association de première intention dans la GVHD chronique. Un essai d’association de phase 2 avec le ruxolitinib (NCT06388564) et un essai d’association de phase 3 avec des stéroïdes (NCT06585774) sont en cours. L’axatilimab fait également l’objet d’un essai de phase 2 en cours chez des patients atteints de fibrose pulmonaire idiopathique (NCT06132256). Niktimvo est une marque déposée d’Incyte. Toutes les autres marques sont la propriété de leurs propriétaires respectifs. À propos du povorcitinib (INCB54707) Le povorcitinib (INCB54707) est un inhibiteur oral de la petite molécule JAK1 actuellement dans des essais cliniques de phase 3 pour le vitiligo, l'hidradénite suppurée (HS) et le prurigo nodulaire (PN), ainsi que dans des essais de phase 2 pour l'asthme et l'urticaire chronique spontanée. À propos d’Incyte Société biopharmaceutique internationale dont la mission est de « Solve On » , Incyte suit la science pour trouver des solutions pour les patients dont les besoins médicaux ne sont pas satisfaits. Grâce à la découverte, au développement et à la commercialisation de produits thérapeutiques exclusifs, Incyte a constitué un portefeuille de médicaments de premier ordre pour les patients et un solide portefeuille de produits dans les domaines de l’oncologie, de l’inflammation et de l’auto-immunité. Incyte, dont le siège social se trouve à Wilmington, dans le Delaware, est présente en Amérique du Nord, en Europe et en Asie. Pour de plus amples renseignements sur Incyte, veuillez visiter Incyte.com et suivez-nous sur les médias sociaux : LinkedIn, X, Instagram, Facebook, YouTube. Déclarations prospectives d’Incyte À l’exception des informations historiques énoncées dans les présentes, les questions exposées dans le présent communiqué de presse, y compris les déclarations relatives à la présentation des données du pipeline de développement clinique d’Incyte, à savoir si ou quand des composés ou associations de développement seront approuvés ou disponibles dans le commerce pour une utilisation chez l’humain partout dans le monde en dehors des indications déjà approuvées dans des régions spécifiques, et l’objectif d’Incyte d’améliorer la vie des patients, contiennent des prédictions, des estimations et d’autres déclarations prospectives. Ces déclarations prospectives sont fondées sur les attentes actuelles d'Incyte et sont assujettis à des risques et à des incertitudes qui peuvent faire en sorte que les résultats réels diffèrent considérablement, y compris les développements imprévus et les risques liés à : des retards imprévus ; la poursuite de la recherche et du développement et les résultats des essais cliniques qui pourraient être infructueux ou insuffisants pour satisfaire aux normes réglementaires applicables ou justifier la poursuite du développement ; la capacité d'inscrire un nombre suffisant de participants aux essais cliniques ; les déterminations faites par la FDA, l'EMA et d'autres autorités de réglementation ; l’efficacité ou l’innocuité des produits d’Incyte et de ses partenaires ; l’acceptation des produits d’Incyte et de ses partenaires sur le marché ; la concurrence sur le marché ; les exigences en matière de vente, de commercialisation, de fabrication et de distribution ; et d’autres risques détaillés de temps à autre dans les rapports d’Incyte déposés auprès de la Securities and Exchange Commission, y compris son rapport annuel sur formulaire 10-K pour l’exercice clos le 31 décembre 2024. Incyte décline toute intention ou obligation de mettre à jour ces déclarations prospectives. Le texte du communiqué issu d’une traduction ne doit d’aucune manière être considéré comme officiel. La seule version du communiqué qui fasse foi est celle du communiqué dans sa langue d’origine. La traduction devra toujours être confrontée au texte source, qui fera jurisprudence. Contacts Médias media@incyte.com Investisseurs ir@incyte.com // Add toggle of sharing section var internalToggle = new BWToggle("bw-release-internal", "#bw-release-internal h2", "#bw-internal-content"); internalToggle.set(false);'''
