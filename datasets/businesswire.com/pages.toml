title = "BeiGene anuncia resultados financeiros e atualizações comerciais do quarto trimestre e de todo o ano de 2024 | Business Wire"
description = "BeiGene, Ltd. (NASDAQ: ONC; HKEX: 06160; SSE: 688235), uma empresa internacional de oncologia que pretende mudar seu nome para BeOne Medicines Ltd., a"
full_description = 'BeiGene anuncia resultados financeiros e atualizações comerciais do quarto trimestre e de todo o ano de 2024 Receitas totais de US$ 1,1 bilhão e US$ 3,8 bilhões a nível mundial no quarto trimestre e durante todo o ano, aumentos de 78% e 55%, respectivamente; redução do prejuízo operacional GAAP e obtenção de lucro operacional não GAAP positivo no ano inteiro Receitas do BRUKINSA de US$ 828 milhões e US$ 2,6 bilhões a nível mundial no quarto trimestre e durante todo o ano, aumentos de 100% e 105%, respectivamente; avanços nos programas de estágio fundamental para o inibidor de BCL2 sonrotoclax e BTK CDAC BGB-16673 Foram introduzidas seis e 13 Novas Entidades Moleculares (NMEs) na clínica no quarto trimestre e durante todo o ano, respectivamente; são previstas múltiplas leituras de dados para programas inovadores de tumores sólidos no primeiro semestre de 2025 A orientação de receita para todo o ano de 2025 é de US$ 4,9 bilhões a US$ 5,3 bilhões, reafirmando a expectativa de lucro operacional positivo GAAP e geração de fluxo de caixa das operações em 2025 Download Image Full Size Small Preview Thumbnail (Graphic: Business Wire) (Graphic: Business Wire) Image Full Size Small Preview Thumbnail Image Full Size Small Preview Thumbnail March 01, 2025 08:08 PM Eastern Standard Time SAN MATEO, Califórnia--(BUSINESS WIRE)--BeiGene, Ltd. (NASDAQ: ONC; HKEX: 06160; SSE: 688235), uma empresa internacional de oncologia que pretende mudar seu nome para BeOne Medicines Ltd., anunciou hoje resultados financeiros e atualizações corporativas do quarto trimestre e de todo o ano de 2024. "Nossos resultados do quarto trimestre e do ano inteiro demonstram nosso tremendo crescimento como uma potência mundial em oncologia, reforçado pelo sucesso contínuo do BRUKINSA e o desenvolvimento de uma das sequências de etapas quanto a tumores sólidos mais prolíficos em oncologia com múltiplas leituras de dados esperadas este ano", disse John V. Oyler, Cofundador, Presidente e Diretor Executivo da BeiGene. "O BRUKINSA é agora líder inequívoco em novos pacientes com LLC nos EUA, detém a identificação mais ampla de qualquer inibidor de BTK e serve como a pedra angular de nossa franquia de hematologia, mostrando uma imensa promessa como coluna vertebral ao lado de nosso inibidor de BCL2 em estágio avançado, sonrotoclax, e nosso potencial CDAC BTK de primeira classe. Também estamos criando futuras franquias para tumores sólidos em cânceres de mama, pulmão e gastrointestinal, ao aproveitar nossas plataformas em anticorpos multiespecíficos, degradadores de proteínas e conjugados de anticorpos-fármacos. O ano de 2025 marca um ponto de inflexão, pois prevemos alcançar uma receita operacional GAAP positiva e fluxo de caixa operacional, junto com nossa intenção de mudar nosso nome para BeOne com nosso novo símbolo NASDAQ, ONC." Panorama financeiro do quarto trimestre e de todo o ano de 2024 (valores em milhares de dólares dos EUA e não auditados) Quarto trimestre Ano inteiro 2024 2023 % mudança 2024 2023 % mudança Receitas líquidas de produtos $ 1.118.035 $ 630.526 77 % $ 3.779.546 $ 2.189.852 73 % Receita líquida de colaborações $ 9.789 $ 3.883 152 % $ 30.695 $ 268.927 (89 )% Receita total $ 1.127.824 $ 634.409 78 % $ 3.810.241 $ 2.458.779 55 % Perda de GAAP das operações $ (79.425 ) $ (383.795 ) (79 )% $ (568.199 ) $ (1.207.736 ) (53 )% Lucro (prejuízo) ajustado das operações* $ 78.603 $ (267.224 ) 129 % $ 45.356 $ (752.473 ) 106 % * Para uma explicação sobre nosso uso de medidas financeiras não GAAP, consulte a seção "Nota sobre o uso de medidas financeiras não GAAP" mais adiante neste comunicado à imprensa, e para uma reconciliação de cada medida financeira não GAAP com as medidas GAAP mais comparáveis, consulte a tabela no fim deste comunicado à imprensa. Principais atualizações comerciais O BRUKINSA® (zanubrutinib) é um inibidor de pequenas moléculas de BTK disponível via oral, concebido para proporcionar inibição completa e sustentada da proteína BTK, ao otimizar a biodisponibilidade, meia-vida e seletividade. Com farmacocinética diferenciada quanto a outros inibidores de BTK aprovados, o BRUKINSA demonstrou inibir a proliferação de células B malignas em diversos tecidos referentes à doença. O BRUKINSA possui a identificação mais ampla a nível mundial de qualquer inibidor de BTK, sendo o único inibidor de BTK a oferecer a flexibilidade de uma ou duas dosagens diárias. O programa de desenvolvimento clínico do BRUKINSA inclui cerca de 7.100 pacientes inscritos até o momento em mais de 30 países e regiões em mais de 35 ensaios. O BRUKINSA tem aprovação em mais de 70 mercados e mais de 180.000 pacientes foram tratados em todo o mundo. As vendas do BRUKINSA nos EUA totalizaram US$ 616 milhões e US$ 2,0 bilhões no quarto trimestre e em todo o ano de 2024, representando um crescimento de 97% e 106%, respectivamente, quanto aos períodos do ano anterior, com mais de 60% do crescimento da demanda trimestre a trimestre proveniente do uso ampliado em leucemia linfocítica crônica (LLC), já que o BRUKINSA continuou ganhando participação como líder em novos inícios em pacientes nos EUA com LLC e todas as outras indicações aprovadas; as vendas do BRUKINSA na Europa totalizaram US$ 113 milhões e US$ 359 milhões no quarto trimestre e em todo o ano de 2024, representando um crescimento de 148% e 194%, respectivamente, quanto aos períodos do ano anterior, impulsionado pelo aumento da participação de mercado em todos os principais mercados, incluindo Alemanha, Itália, Espanha, França e Reino Unido; e Foi assinado um contrato de resolução de litígio de patente com a MSN Pharmaceuticals, Inc. e a MSN Laboratories Private Ltd., concedendo à MSN o direito de vender uma versão genérica do BRUKINSA nos EUA não antes de 15 de junho de 2037, sujeito a potencial aceleração ou extensão sob circunstâncias usuais para contratos deste tipo. TEVIMBRA® (tislelizumab) é um anticorpo monoclonal anti-proteína de morte celular programada 1 (PD-1) de imunoglobulina G4 humanizada (IgG4) exclusivamente projetado com alta afinidade e especificidade de ligação contra PD-1; é concebido para minimizar a ligação aos receptores Fc-gama (Fcγ) em macrófagos, ajudando as células imunológicas do corpo a detectar e combater tumores. O TEVIMBRA é o ativo fundamental do portfólio de tumores sólidos da BeiGene e demonstrou potencial em diversos tipos de tumores e cenários de doenças. O programa de desenvolvimento clínico TEVIMBRA inclui quase 14.000 pacientes inscritos até o momento em 35 condados e regiões em 70 ensaios, incluindo 21 estudos de habilitação de registro. O TEVIMBRA é aprovado em 45 mercados, e mais de 1,3 milhão de pacientes foram tratados a nível mundial. As vendas de tislelizumabe totalizaram US$ 154 milhões e US$ 621 milhões no quarto trimestre e em todo o ano de 2024, representando um crescimento de 20% e 16%, respectivamente, quanto aos períodos do ano anterior; Recebeu aprovação da Food and Drug Administration (FDA) dos EUA em combinação com quimioterapia à base de platina e fluoropirimidina para o tratamento de primeira linha de adenocarcinoma gástrico ou da junção gastroesofágica HER2-negativo irressecável ou metastático em adultos cujos tumores expressam PD-L1 (≥1); e Recebeu aprovação da Comissão Europeia (CE) em combinação com quimioterapia para o tratamento de primeira linha do carcinoma espinocelular de esôfago e adenocarcinoma gástrico ou da junção gastroesofágica. Principais destaques da sequência de etapas A estratégia de portfólio da BeiGene enfatiza a geração rápida de dados de prova com conceito clínico em estágio inicial, possibilitada por seu enfoque de velocidade e custo vantajoso ("Fast to Proof of Concept") para operações de desenvolvimento mundial. A equipe interna de pesquisa e desenvolvimento mundial da empresa, incluindo operações clínicas e desenvolvimento, é composta por quase 3.700 colegas que conduzem testes em seis continentes e se esforçam por garantir a qualidade rigorosa dos dados mediante cooperações com reguladores e pesquisadores em mais de 45 países. Este enfoque estratégico maximiza recursos ao canalizar investimentos com base em dados para os candidatos clinicamente diferenciados mais promissores com rapidez, sem prioridade dos outros. Com uma das maiores equipes de pesquisa em oncologia do setor, a BeiGene demonstrou pontos fortes na descoberta translacional de pequenas moléculas e produtos biológicos, incluindo três tecnologias de plataforma: anticorpos multiespecíficos, compostos de ativação de degradação quimérica (CDACs) e conjugados anticorpo-fármaco (ADCs). Hematologia BRUKINSA Na reunião anual da Sociedade Americana de Hematologia (ASH), foi apresentado o acompanhamento de 5 anos do estudo SEQUOIA; com ajuste para o impacto da COVID-19, o estudo demonstrou que o tratamento com BRUKINSA reduziu o risco de progressão ou morte em 75% em comparação ao bendamustina-rituximabe em pacientes com LLC sem tratamento prévio (TN); Prevê a aprovação da formulação do comprimido BRUKINSA pela FDA e pela CE no segundo semestre de 2025; Prevê uma análise provisória da sobrevida livre de progressão para o estudo de fase 3 MANGROVE no linfoma de células do manto TN (LCM) no segundo semestre de 2025; e Prevê a conclusão da inscrição para a parte de linfoma folicular reincidente / refratário (R/R) do estudo de fase 3 MAHOGANY no segundo semestre de 2025. Sonrotoclax (inibidor BCL2) Leituras de dados planejadas nos ensaios de fase 2 de R/R CLL e R/R MCL e possíveis submissões de aprovação acelerada no segundo semestre de 2025; Na ASH, foram apresentados dados do grupo de expansão de 320 mg de um estudo de fase 1/1b com um acompanhamento médio de 1,5 anos, demonstrando nenhuma progressão em pacientes com LLC TN em combinação com o BRUKINSA; Mais de 1.800 pacientes foram inscritos até o momento no programa; Inscrição concluída no estudo CELESTIAL de fase 3 em LLC do Tennessee; Prevê a inscrição dos primeiros indivíduos em ensaios mundiais de fase 3 em R/R CLL e R/R MCL no primeiro semestre de 2025; e Inscrição contínua no ensaio mundial de fase 2 sobre macroglobulinemia de Waldenström. BGB-16673 (BTK CDAC) Continuidade da inscrição em potencial no registro, permitindo o estudo de fase 2 da LLC R/R com leitura de dados esperada para 2026; Mais de 500 pacientes inscritos até o momento no programa; Prevê o início do ensaio de fase 3 em LLC R/R em comparação à escolha do médico no primeiro semestre de 2025; e Prevê o início do ensaio comparativo de fase 3 contra o inibidor não covalente de BTK pirtobrutinibe na LLC R/R no segundo semestre de 2025. Tumores sólidos Prevê leituras de dados para BGB-43395 (inibidor de CDK4), BG-68501 (inibidor de CDK2) e BG-C9074 (B7H4 ADC) no primeiro semestre de 2025, e dados internos de prova de conceito para BG-60366 (EGFR CDAC), BGB-53038 (inibidor de panKRAS), BG-C137 (FGFR2b ADC), BGB-C354 (B7H3 ADC) e BG-C477 (CEA ADC) no segundo semestre de 2025. Câncer de pulmão Tarlatamabe (AMG757, DLL3xCD3 BiTE): prevê a leitura de dados do estudo de fase 3 em câncer de pulmão em pequenas células de segunda linha no primeiro semestre de 2025; Advan-TIG-302 (anticorpo TIGIT): prevê a leitura de dados provisórios do estudo de fase 3 em câncer de pulmão em células não pequenas de primeira linha com alto índice de PD(L)1 no segundo semestre de 2025; BG-60366 (EGFR CDAC): entrada na clínica no quarto trimestre de 2024; mecanismo degradador diferenciado para abolir por completo a sinalização do EGFR; altamente potente em mutações do EGFR sensíveis e resistentes ao osimertinibe; dados sólidos de eficácia pré-clínica com dosagem oral e diária; BG-89894 (inibidor de MAT2A): entrada em escalonamento de dose no quarto trimestre de 2024; características potencialmente melhores da categoria com potência e penetração cerebral superiores; forte sinergia entre PRMT5i e MAT2Ai em modelos pré-clínicos; BGB-58067 (inibidor PRMT5 cooperativo com MTA): entrada na clínica no início de janeiro de 2025; potencial de melhor qualidade com alta potência, seletividade e penetrabilidade cerebral; e BG-T187 (anticorpo triespecífico EGFR x MET): escalonamento de dose iniciado no quarto trimestre de 2024; design biparatópico MET diferenciado com atividade inibitória MET ideal para buscar a melhor oportunidade da categoria. Cânceres de mama e ginecológico BGB-43395 (inibidor de CDK4): aumento contínuo da dose em monoterapia e em combinação com fulvestranto e letrozol na faixa de dose eficaz prevista; mais de 180 pacientes inscritos até o momento e prova de conceito esperada para o primeiro semestre de 2025; planejamento em curso para o ensaio de fase 3 em câncer de mama metastático HR+/HER2- de segunda linha em combinação com terapia endócrina; e BG-68501 (inibidor de CDK2) e BG-C9074 (B7H4 ADC): escalonamento contínuo da dose de monoterapia; mais de 50 pacientes e mais de 70 pacientes inscritos até o momento, respectivamente. Câncer gastrointestinal Zanidatamab (anticorpo biespecífico HER2) em combinação com tislelizumabe e quimioterapia: prevê a leitura dos dados primários de PFS do estudo de fase 3 em adenocarcinoma gastroesofágico HER2-positivo de primeira linha no segundo semestre de 2025; e Os NMEs avançaram para a clínica no quarto trimestre de 2024: BGB-53038 (inibidor do panKRAS): altamente potente e seletivo com ampla atividade contra mutações do KRAS em diversos tipos de tumores; limita a toxicidade ao poupar outras proteínas RAS; as mutações do KRAS estão presentes em 19% dos cânceres; e BG-C137 (FGFR2b ADC): ADC potencial de primeira classe para um alvo validado em cânceres gastrointestinais superiores e de mama; eficácia potencial superior em comparação ao principal anticorpo monoclonal em modelos de alta e média expressão. Inflamação e imunologia BGB-45035 (IRAK4 CDAC): atualmente em escalonamento de dose em grupos SAD e MAD com mais de 130 indivíduos inscritos; degradador potente e seletivo que tem como alvo as funções de quinase e andaime do IRAK4 para degradação completa do alvo; estudo de fase 2 planejado para 2025; prova de conceito para degradação tecidual do IRAK4 no segundo semestre de 2025. Atualizações corporativas Anúncio da intenção de mudar o nome da empresa para BeOne Medicines, aguardando a aprovação dos acionistas; o novo nome reflete o compromisso da empresa em desenvolver medicamentos inovadores para eliminar o câncer mediante parcerias com a comunidade internacional para atender o maior número possível de pacientes; Anúncio de um contrato de licenciamento mundial com a CSPC Zhongqi Pharmaceutical Technology (Shijiazhuang) Co., Ltd. para SYH2039 (BG-89894), um novo inibidor de MAT2A que está sendo explorado para tumores sólidos como monoterapia e em combinação com BGB-58067 (inibidor PRMT5 cooperativo com MTA); Alteração do símbolo de ações da Nasdaq da empresa de "BGNE" para "ONC"; e Foi organizado um seminário online para pesquisadores em 16 de dezembro de 2024, destacando dados importantes da franquia de hematologia do ASH 2024 e do Simpós'
