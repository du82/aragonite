title = "Incyte gibt auf der Jahrestagung der American Academy of Dermatology (AAD) 2025 neue Daten aus seinem Dermatologie-Portfolio bekannt | Business Wire"
description = "Incyte (Nasdaq: INCY) gab heute bekannt, dass auf der Jahrestagung der American Academy of Dermatology (AAD) 2025, die vom 7. bis zum 11. März 2025 in"
full_description = 'Incyte gibt auf der Jahrestagung der American Academy of Dermatology (AAD) 2025 neue Daten aus seinem Dermatologie-Portfolio bekannt - Zu den Abstracts für Ruxolitinib-Creme (Opzelura®) gehören mehrere Präsentationen zu atopischer Dermatitis und brandaktuelle Daten zu Prurigo nodularis (PN) - Zu den vorgestellten Pipeline-Daten gehören Daten für Axatilimab (Niktimvo™) an Patienten mit dermatologischen Manifestationen der chronischen Graft-versus-Host-Krankheit (GVHD) March 01, 2025 08:50 PM Eastern Standard Time WILMINGTON, Del.--(BUSINESS WIRE)--Incyte (Nasdaq: INCY) gab heute bekannt, dass auf der Jahrestagung der American Academy of Dermatology (AAD) 2025, die vom 7. bis zum 11. März 2025 in Orlando, USA, abgehalten wird, mehrere Abstracts mit neuen Daten aus dem Dermatologie-Portfolio des Unternehmens vorgestellt werden. „Wir freuen uns darauf, bei der diesjährigen Jahrestagung der AAD neue Daten zur Ruxolitinib-Creme (Opzelura®) für verschiedene Indikationen, einschließlich Prurigo nodularis, und zu Axatilimab (Niktimvo™) für die Behandlung von Patienten mit dermatologischen Manifestationen der chronischen Graft-versus-Host-Krankheit präsentieren zu dürfen“, sagte Jim Lee, M.D., Ph.D., Group Vice President, Inflammation and Autoimmunity, Incyte. „Die aktive Teilnahme von Incyte an diesem wichtigen Kongress untermauert unseren Einsatz für die Adressierung kritischer Anforderungen in der Dermatologie und die Förderung eines konstruktiven Dialogs mit Forschern, Patienten und Befürwortern, um die Entwicklung innovativer Behandlungen zu fördern.“ Zu den wichtigsten Abstracts gehören: Neueste mündliche Präsentation Prurigo Nodularis (PN) Wirksamkeit und Sicherheit von Ruxolitinib-Creme bei Patienten mit Prurigo Nodularis: Ergebnisse einer randomisierten, Vehikel-kontrollierten Phase-3-Studie (TRuE-PN1) (Sitzung: S028 – Aktuelle Forschung: Sitzung 1. Samstag, 8. März 2025, 9:24 Uhr ET) ePoster Atopische Dermatitis (AD) Langfristige Sicherheit von Ruxolitinib-Creme an Erwachsenen und Jugendlichen mit leichter bis mittelschwerer atopischer Dermatitis: Nebenwirkungen von Interesse aus den TRuE-AD1- und TRuE-AD2-Phase-3-Studien ​ (Abstract: #64524) Zusammenhang des Behandlungsbeginns mit Ruxolitinib-Creme mit der Verringerung anderer topischer Behandlungen, oraler Kortikosteroide und Biologika für atopische Dermatitis, unabhängig von der vorherigen Nutzung von Biologika (Abstract: #64526) 52-wöchige Sicherheits- und Krankheitskontrollstudie bei bedarfsgerechter Anwendung von Ruxolitinib-Creme an Kindern im Alter zwischen 2 und 11 Jahren mit mittelschwerer und/oder ausgedehnterer atopischer Dermatitis: Subgruppenanalyse aus der TRuE-AD3-Studie ​ (Abstract: #64656) Ruxolitinib-Creme zeigte eine langfristige Krankheitskontrolle und Verbesserung der Lebensqualität bei Erwachsenen und Jugendlichen mit leichter bis mittelschwerer atopischer Dermatitis ​​ (Abstract: #64727) Graft-versus-Host-Krankheit (GVHD) Axatilimab für Patienten mit dermatologischen Manifestationen der chronischen Graft-versus-Host-Krankheit: Eine Post-hoc-Analyse ​ (Abstract: #64616) Weitere Informationen zur Jahrestagung der AAD 2025 finden Sie unter: https://www.aad.org/member/meetings-education/am25. Über Opzelura® (Ruxolitinib)-Creme 1,5% Opzelura, eine neuartige Cremeformulierung mit dem selektiven JAK1/JAK2-Inhibitor Ruxolitinib von Incyte, wurde von der U.S. Food & Drug Administration für die topische Behandlung von nicht-segmentaler Vitiligo bei Patienten ab 12 Jahren zugelassen und ist die erste und einzige in den USA zugelassene Behandlung zur Repigmentierung. Opzelura ist in den USA außerdem zur kurzzeitigen und nicht andauernden chronischen Behandlung von leichter bis mittelschwerer atopischer Dermatitis (AD) bei nicht immungeschwächten Patienten ab 12 Jahren zugelassen, deren Krankheit mit verschreibungspflichtigen topischen Therapien nicht ausreichend kontrolliert werden kann oder wenn diese Therapien nicht angezeigt sind. Die Anwendung von Opzelura in Kombination mit therapeutischen Biologika, anderen JAK-Inhibitoren oder starken Immunsuppressiva wie Azathioprin oder Cyclosporin wird nicht empfohlen. In Europa ist die Opzelura (Ruxolitinib)-Creme 15 mg/g für die Behandlung von nicht-segmentaler Vitiligo mit Betroffenheit des Gesichts bei Erwachsenen und Jugendlichen ab 12 Jahren zugelassen. Incyte verfügt über die weltweiten Rechte für die Entwicklung und Vermarktung von Ruxolitinib-Creme, die in den Vereinigten Staaten als Opzelura vermarktet wird. Opzelura und das Opzelura-Logo sind eingetragene Marken von Incyte. Über Niktimvo™ (Axatilimab-CSFR) Niktimvo™ (Axatilimab-CSFR) ist ein neuartiger Anti-CSF-1R-Antikörper, der in den USA für die Behandlung der chronischen Graft-versus-Host-Disease (cGVHD) bei erwachsenen und pädiatrischen Patienten mit einem Körpergewicht von mindestens 40 kg (88,2 lbs) zugelassen ist, nachdem mindestens zwei vorherige systemische Therapielinien versagt haben. Im Jahr 2016 erwarb Syndax von UCB die weltweiten Exklusivrechte zur Entwicklung und Vermarktung von Niktimvo. Im September 2021 schlossen Syndax und Incyte eine exklusive weltweite Lizenzvereinbarung zur gemeinsamen Entwicklung und Vermarktung von Axatilimab bei cGVHD und allen zukünftigen Indikationen. Axatilimab wird in Frontline-Kombinationsstudien bei chronischer GvHD untersucht. Eine Phase-2-Kombinationsstudie mit Ruxolitinib (NCT06388564) und eine Phase-3-Kombinationsstudie mit Steroiden (NCT06585774) sind im Gange. Zudem wird Axatilimab in einer laufenden Phase-2-Studie bei Patienten mit idiopathischer Lungenfibrose untersucht (NCT06132256). Niktimvo ist eine Marke von Incyte. Alle anderen Marken sind das Eigentum ihrer jeweiligen Inhaber. Über Povorcitinib (INCB54707) Povorcitinib (INCB54707) ist ein oral verabreichter niedermolekularer JAK1-Inhibitor, der gegenwärtig in klinischen Phase-3-Studien zur Behandlung von Vitiligo, Hidradenitis suppurativa (HS) und Prurigo nodularis (PN) untersucht wird. Außerdem laufen derzeit auch Phase-2-Studien zu Povorcitinib zu Asthma und chronischer spontaner Urtikaria (CSU). Über Incyte Incyte ist ein weltweit tätiges biopharmazeutisches Unternehmen, das gemäß seiner Tagline Solve On. die Wissenschaft einsetzt, um Lösungen für Patienten mit ungedeckten medizinischen Bedürfnissen zu finden. Durch die Entdeckung, Entwicklung und Vermarktung eigener Therapeutika hat Incyte ein Portfolio von First-in-Class-Arzneimitteln für Patienten und eine starke Produktpipeline in den Bereichen Onkologie sowie Entzündung und Autoimmunität aufgebaut. Incyte hat seinen Hauptsitz in Wilmington, US-Bundesstaat Delaware, und unterhält Niederlassungen in Nordamerika, Europa und Asien. Für weitere Informationen zu Incyte besuchen Sie Incyte.com. Folgen Sie uns in den sozialen Medien: LinkedIn, X, Instagram, Facebook, YouTube. Zukunftsgerichtete Aussagen von Incyte Abgesehen von den hierin enthaltenen Informationen aus der Vergangenheit enthalten die Aussagen der vorliegenden Pressemitteilung – darunter Aussagen zur Präsentation von Daten aus der klinischen Entwicklungspipeline von Incyte, Aussagen zur Frage, ob oder wann Wirkstoffe oder Kombinationen für die Anwendung am Menschen in einem Land, in dem sie noch nicht zugelassen sind, zugelassen oder im Handel erhältlich sein werden, sowie Aussagen zum Ziel von Incyte, die Lebensqualität von Patienten zu verbessern – Prognosen, Schätzungen und andere zukunftsgerichtete Aussagen. Diese zukunftsgerichteten Aussagen beruhen auf den derzeitigen Erwartungen von Incyte und unterliegen Risiken und Unwägbarkeiten, die dazu führen können, dass die tatsächlichen Ergebnisse erheblich abweichen. Dazu gehören unvorhergesehene Entwicklungen und Risiken im Zusammenhang mit unerwarteten Verzögerungen; weitere Forschung und Entwicklung und die Ergebnisse klinischer Studien, die möglicherweise nicht erfolgreich oder unzureichend sind, um die geltenden behördlichen Vorgaben zu erfüllen oder eine weitere Entwicklung zu rechtfertigen; die Fähigkeit, eine ausreichende Anzahl von Probanden in klinische Studien aufzunehmen; Entscheidungen der FDA, EMA sowie weiterer Aufsichtsbehörden; die Wirksamkeit oder Sicherheit der Produkte von Incyte und Partnern; die Akzeptanz der Produkte von Incyte und Partnern auf dem Markt; der Marktwettbewerb; Verkaufs-, Marketing-, Herstellungs- und Vertriebsanforderungen; sowie weitere Risiken, die bisweilen in den von Incyte bei der US-Börsenaufsichtsbehörde Securities and Exchange Commission (SEC) eingereichten Berichten, einschließlich des Jahresberichts auf Formblatt 10-Q für das am 31. Dezember 2024 beendete Geschäftsjahr, beschrieben werden. Incyte lehnt jede Absicht oder Verpflichtung ab, diese zukunftsgerichteten Aussagen zu aktualisieren. Die Ausgangssprache, in der der Originaltext veröffentlicht wird, ist die offizielle und autorisierte Version. Übersetzungen werden zur besseren Verständigung mitgeliefert. Nur die Sprachversion, die im Original veröffentlicht wurde, ist rechtsgültig. Gleichen Sie deshalb Übersetzungen mit der originalen Sprachversion der Veröffentlichung ab. Contacts Medien media@incyte.com Investoren ir@incyte.com // Add toggle of sharing section var internalToggle = new BWToggle("bw-release-internal", "#bw-release-internal h2", "#bw-internal-content"); internalToggle.set(false);'
