title = "Guidepost Solutions fortalece sua presença na América Latina com a nomeação de Melissa Price como diretora-geral no México | Business Wire"
description = "A Guidepost Solutions, líder global em investigações nacionais e internacionais, soluções de conformidade, monitoramento e consultoria em segurança e"
full_description = 'Guidepost Solutions fortalece sua presença na América Latina com a nomeação de Melissa Price como diretora-geral no México Com sólida experiência em litígios e profundo conhecimento do mercado mexicano, Price reforça a expertise da Guidepost Solutions em investigações transnacionais e compliance Download Image Full Size Small Preview Thumbnail Melissa Price, Managing Director, Guidepost Solutions (Photo: Business Wire) Melissa Price, Managing Director, Guidepost Solutions (Photo: Business Wire) Image Full Size Small Preview Thumbnail Image Full Size Small Preview Thumbnail February 28, 2025 02:43 PM Eastern Standard Time NOVA YORK--(BUSINESS WIRE)--A Guidepost Solutions, líder global em investigações nacionais e internacionais, soluções de conformidade, monitoramento e consultoria em segurança e tecnologia, anunciou hoje a nomeação da experiente advogada Melissa Price como diretora-geral, com base na Cidade do México. Ex-procuradora federal dos EUA e ex-funcionária sênior do Departamento de Justiça e do Departamento de Estado no México, Price traz uma vasta experiência para a crescente carteira de clientes da Guidepost com operações no México e região. "A profunda compreensão de Melissa sobre os sistemas jurídicos e regulatórios dos EUA e do México, aliada à sua experiência nos setores público e privado, trará insights valiosos para nossos clientes que enfrentam desafios internacionais complexos em questões legais, investigativas e de compliance", disse Julie Myers Wood, CEO da Guidepost Solutions. "Com a abertura de nosso escritório na Cidade do México em 2024, a chegada de Melissa reforça nosso compromisso em oferecer orientação estratégica de alto nível para nossa crescente base global de clientes". Antes de ingressar na Guidepost Solutions, Price trabalhou na Embaixada dos EUA na Cidade do México como coordenadora de programas do Bureau of International Narcotics and Law Enforcement, fornecendo expertise em iniciativas de capacitação, prioridades de missão e legislação criminal nos EUA e no México. Ela também atuou como advogada de ligação no Escritório de Assuntos Internacionais do Departamento de Justiça dos EUA, colaborando diretamente com a Fiscalía General de la República (FGR) do México. Além disso, contribuiu para o Escritório de Desenvolvimento, Assistência e Treinamento de Promotores no Exterior da Embaixada, onde desenvolveu currículos especializados em técnicas de litígio e tráfico de armas, capacitando mais de 750 promotores, investigadores e juízes estaduais e federais. No início de sua carreira como promotora, Price atuou como procuradora assistente dos EUA em Washington, D.C., onde conduziu processos de grande repercussão relacionados a narcóticos, armas de fogo e crimes violentos, sendo reconhecida com o Special Achievement Award em 2018. Além disso, trabalhou em escritórios renomados, como O’Melveny & Myers, LLP, e Lewis Baach Kaufmann Middlemiss, com foco em litígios financeiros complexos e disputas transnacionais. Price é formada em Direito pela University of California, Berkeley School of Law. Fluente em espanhol e com sete anos de experiência atuando na Cidade do México, ela agrega um profundo conhecimento em questões jurídicas transnacionais à prática internacional da Guidepost. Sobre a Guidepost Solutions LLC A Guidepost Solutions é referência em investigações nacionais e internacionais, soluções de compliance, monitoramento e consultoria em segurança e tecnologia. Atendemos nossos clientes onde quer que precisem – seja presencialmente ao redor do mundo ou por nossos escritórios em Bogotá, Chicago, Dallas, Honolulu, Londres, Los Angeles, Cidade do México, Miami, Nova York, Palm Beach, Phoenix, San Francisco, Seattle, Singapura, Walnut Creek e Washington, DC. Para mais informações, acesse www.guidepostsolutions.com. O texto no idioma original deste anúncio é a versão oficial autorizada. As traduções são fornecidas apenas como uma facilidade e devem se referir ao texto no idioma original, que é a única versão do texto que tem efeito legal. Contacts MÍDIA: Rebecca Bender, Montieth & Company rbender@montiethco.com // Add toggle of sharing section var internalToggle = new BWToggle("bw-release-internal", "#bw-release-internal h2", "#bw-internal-content"); internalToggle.set(false);'
