mLab, Floating in the Falling Universe of Flowers, Video: teamLab) teamLab Planets, a museum in Toyosu, Tokyo, where you can immerse yourself with your entire body, has unveiled a cherry blossom-themed artwork by the international art collective teamLab. (teamLab, Floating in the Falling Universe of Flowers, Video: teamLab) MPEG-4 Video teamLab Planets, a museum in Toyosu, Tokyo, where you can immerse yourself with your entire body, has unveiled a cherry blossom-themed artwork by the international art collective teamLab. (teamLab, Floating in the Falling Universe of Flowers, Video: teamLab) Image Full Size Small Preview Thumbnail teamLab Planets, a museum in Toyosu, Tokyo, where you can immerse yourself with your entire body, has unveiled a cherry blossom-themed artwork by the international art collective teamLab. (teamLab, Drawing on the Water Surface Created by the Dance of Koi and People - Infinity, Video: teamLab) MPEG-4 Video Highlight Video: teamLab Planets TOKYO DMM © teamLab A new large-scale Athletics Forest and other installations opened at teamLab Planets TOKYO DMM in Toyosu, Tokyo, on Wednesday, January 22, 2025. MPEG-4 Video Image Full Size Small Preview Thumbnail February 28, 2025 11:43 AM Eastern Standard Time TOKIÓ--(BUSINESS WIRE)--A 2025. januári jelentős bővülést követően a teamLab Planets TOKYO DMM.com (a továbbiakban: teamLab Planets) éves szinten jelentős, 130%-os növekedést ért el a jegyeladások terén*1. A látogatók tartózkodási ideje is jelentősen megnövekedett. Egy nemrégiben készült felmérés szerint a „2 óránál hosszabb ideig” itt tartózkodó látogatók aránya hozzávetőleg 48%-kal, míg a „3 óránál hosszabb ideig itt tartózkodók" aránya mintegy 20%-kal emelkedett*2. Idén tavasszal a teamLab Planets két hatalmas művészeti terét is teljes virágba borult cseresznyevirágok fogják díszíteni. A Floating in the Falling Universe of Flowers (A hulló virágok univerzumában lebegve) területen, ahol szezonális virágok virágoznak és idővel átalakulnak, cseresznyevirágok fogják betölteni az egész teret. A Drawing on the Water Surface Created by the Dance of Koi and People - Infinity (A koi pontyok és az emberek tánca által létrehozott rajz a víz felszínén - Infinity) területen, ahol a látogatók mezítláb járhatnak a vízben, a víz felszínén úszkáló koi pontyok cseresznyevirágokká változnak és szétszóródnak, amikor emberekhez ütköznek. Ezek a cseresznyevirágok március 1. szombattól április 30. szerdáig lesznek megtekinthetőek. A nagyszabású bővítés keretében több mint 20 új műalkotást mutattak be Januárban a teamLab Planets hozzávetőlegesen másfélszeresére bővítette területét, amelynek során több mint 20, oktatási projektekre épülő új műalkotás került bemutatásra, köztük pl. az Athletics Forest, a Catching and Collecting Forest , valamint a Future Park . Ezenkívül az újonnan létrehozott Sketch Factory lehetővé teszi a látogatók számára, hogy a műalkotási térben készített rajzaikból eredeti termékeket készítsenek, amelyeket haza is vihetnek. A nagyszabású bővítéssel kapcsolatos bővebb információkért tekintse meg ezt a sajtóközleményt. *1 A hivatalos teamLab Planets weboldal jegyvásárlási adatai alapján, a 2025. január 22. és február 16., valamint a 2024. január 24. és február 18. közötti körülbelül egy hónapot összehasonlítva. *2 A felmérés a teamLab Planets TOKYO DMM.com weboldalán készült A felmérés időszaka: 2025. január 1-től február 18-ig A felmérés módja: Online látogatói kérdőív Érvényes válaszok: 2525 (január 1-től január 21-ig: 669 válasz, január 22-től február 18-ig: 1856 válasz) A felmérés eredménye: A „2 óránál hosszabb ideig” itt tartózkodó látogatók aránya a bővítés előtti körülbelül 12%-ról 60% körülire nőtt. A „3 óránál hosszabb ideig” itt tartózkodók aránya 1%-ról körülbelül 20%-ra nőtt. Virágzó cseresznyevirágokat bemutató műalkotások Floating in the Falling Universe of Flowers Szezonális virágok virágoznak, és az idő múlásával megváltoznak, az élet szétterjed az univerzumban. Feküdjön le vagy üljön nyugodtan a térben, és engedje, hogy a teste lebegjen, és feloldódjon a műalkotások világában. Virágok nőnek, rügyeznek, virágoznak, majd idővel a szirmaik lehullanak, a virágok elhervadnak és elpusztulnak. A születés és halál körforgása örökké tart. A műalkotás nem egy előre rögzített kép, amelyet lejátszanak, hanem egy számítógépes program hozza létre, amely folyamatosan, valós időben jeleníti meg a műalkotást. Összességében folyamatosan változik, és a korábbi vizuális állapotok soha nem ismétlődnek. Az univerzum ebben a pillanatában soha többé nem látható újra. Drawing on the Water Surface Created by the Dance of Koi and People - Infinity Koi pontyok úszkálnak a végtelenbe nyúló víz felszínén. Az emberek besétálhatnak a vízbe. A koi pontyok mozgását befolyásolja az emberek jelenléte a vízben és a többi hal is. Amikor a halak beleütköznek az emberekbe, virágokká válnak és szétszóródnak. Egy év során a virágzó virágok az évszakokkal együtt változnak. A koi pontyok pályáját az emberek jelenléte határozza meg, és ezek a pályák vonalakat hagynak a víz felszínén. A munkát egy számítógépes program valós időben jeleníti meg, amely nincs előre felvéve, sem pedig körkörösen ismétlődő. A néző és az installáció interakciója folyamatos változást okoz a műalkotásban. A korábbi vizuális állapotok soha nem reprodukálhatók, és soha nem is ismétlődnek meg. A teamLab Planets koncepciója A többi emberrel együtt, teljes testével elmerülve, testével észlelve váljon eggyé a műalkotással A teamLab Planets egy múzeum, ahol vízben sétálhatunk, és amelyeket a teamLab alkotói közössége hozott létre. A műalkotások az emberek jelenlétével változnak, és a műalkotások létezése folytonosságot hoz létre az egyén, és a többi ember között. Merüljön el fizikailag a hatalmas műalkotások tereiben, érzékelje azokat egész testével, és váljon eggyé a művészettel. teamLab Planets TOKYO DMM https://www.teamlab.art/e/planets/ #teamLabPlanets Toyosu, Tokyo ( teamLab Planets TOKYO, Toyosu 6-1-16, Koto-ku, Tokyo ) Bemutató videó https://youtu.be/F7nODEETR4s Sajtóanyag https://www.dropbox.com/sh/ir7d2aui794eo6z/AAChbzX5wPsQm8cgkQ2ViFD4a?dl=0 E közlemény hivatalos, mérvadó változata az eredeti forrásnyelven közzétett szöveg. A fordítás csak az olvasó kényelmét szolgálja, és összevetendo a forrásnyelven írt szöveggel, amely az egyetlen jogi érvénnyel bíró változat. Contacts teamLab Planets PR osztály E-MAIL: pr-info@planets.art Interjúval kapcsolatos kérdések: https://forms.gle/fAtnDKLpQKFME6XR9 // Add toggle of sharing section var internalToggle = new BWToggle("bw-release-internal", "#bw-release-internal h2", "#bw-internal-content"); internalToggle.set(false);'''
