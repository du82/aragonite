title = "Novo estudo sobre transtorno bipolar mostra que uma dieta cetogênica leva a benefícios para a saúde mental e física | Business Wire"
description = "New bipolar disorder study shows that a ketogenic diet leads to mental and physical health benefits. Dr. Iain Campbell, PhD, Baszucki Metabolic Psychiatry Research Fellow, shares how his personal experience alleviating bipolar disorder symptoms through ketosis led to the genesis of a pilot trial published this week in BJPsych Open. Dr. Campbell provides a summary of the report findings while study participants share personal testimonials of their experience. This work highlights the potential of metabolic interventions for mental health conditions. This video is a product of Metabolic Mind, a nonprofit initiative of Baszucki Group. To learn more about metabolic approaches to mental disorders, including ketogenic therapy, visit Metabolic Mind (metabolicmind.org)."
full_description = '''Novo estudo sobre transtorno bipolar mostra que uma dieta cetogênica leva a benefícios para a saúde mental e física O primeiro estudo piloto europeu mostra melhora no humor, energia e ansiedade, alimentando a esperança de um novo tratamento de saúde mental Download MPEG-4 Video Loading media player... jQuery(function() { //create video element var attributes = { 'id': 'news_video', 'class': 'video-js vjs-default-skin', 'width': '640', 'data-height': '264', 'onloadstart': 'this.volume=0.4' } var element = $('<video/>').attr(attributes); $('#media-player').html(element); //Social share var shareOptions = { socials: ['fbFeed', 'tw', 'linkedin', 'mail'], url: window.location.href, title: 'Novo estudo sobre transtorno bipolar mostra que uma dieta cetog\u00EAnica leva a benef\u00EDcios para a sa\u00FAde mental e f\u00EDsica', description: 'BusinessWire news share', image: 'https://mms.businesswire.com/media/20250211109743/pt/2377556/5/2024_11_11_Edinburgh_Landscape_Video_CC.jpg', // required for Facebook and Messenger fbAppId: '140586622674265', // optional for Facebook redirectUri: window.location.href + '#close', } //activate Video.JS theme videojs('news_video', { controls: true, autoplay: false, preload: 'auto', poster: 'https://mms.businesswire.com/media/20250211109743/pt/2377556/5/2024_11_11_Edinburgh_Landscape_Video_CC.jpg', sources: [ {src: "https://mms.businesswire.com/media/20250211109743/pt/2377556/19/2024_11_11_Edinburgh_Landscape_Video_CC.mp4&.mp4?download=1", type: "video/mp4"} ] }).share(shareOptions); }); New bipolar disorder study shows that a ketogenic diet leads to mental and physical health benefits. Dr. Iain Campbell, PhD, Baszucki Metabolic Psychiatry Research Fellow, shares how his personal experience alleviating bipolar disorder symptoms through ketosis led to the genesis of a pilot trial published this week in BJPsych Open. Dr. Campbell provides a summary of the report findings while study participants share personal testimonials of their experience. This work highlights the potential of metabolic interventions for mental health conditions. This video is a product of Metabolic Mind, a nonprofit initiative of Baszucki Group. To learn more about metabolic approaches to mental disorders, including ketogenic therapy, visit Metabolic Mind (metabolicmind.org). New bipolar disorder study shows that a ketogenic diet leads to mental and physical health benefits. Dr. Iain Campbell, PhD, Baszucki Metabolic Psychiatry Research Fellow, shares how his personal experience alleviating bipolar disorder symptoms through ketosis led to the genesis of a pilot trial published this week in BJPsych Open. Dr. Campbell provides a summary of the report findings while study participants share personal testimonials of their experience. This work highlights the potential of metabolic interventions for mental health conditions. This video is a product of Metabolic Mind, a nonprofit initiative of Baszucki Group. To learn more about metabolic approaches to mental disorders, including ketogenic therapy, visit Metabolic Mind (metabolicmind.org). MPEG-4 Video Image Full Size Small Preview Thumbnail February 28, 2025 11:52 AM Eastern Standard Time SAN MATEO, Califórnia--(BUSINESS WIRE)--O Baszucki Group anunciou hoje um novo estudo piloto sobre uma dieta cetogênica no transtorno bipolar. "Pela primeira vez em anos, senti que meu cérebro estava finalmente funcionando com o combustível adequado", disse um dos participantes do estudo. Publicado hoje no BJPsych Open, o estudo é o primeiro a usar neuroimagem para demonstrar que uma dieta cetogênica pode melhorar o metabolismo cerebral em pessoas com diagnóstico de transtorno bipolar. Com mais de 100 anos de evidências de eficácia na epilepsia, uma dieta cetogênica vem sendo estudada agora em todo o mundo para uma variedade de condições psiquiátricas e neurológicas. O primeiro estudo europeu do gênero, apoiado pelo Baszucki Group, usou técnicas avançadas de imagem cerebral, incluindo espectroscopia de ressonância magnética (MRS), para medir mudanças no metabolismo cerebral. A imagem revelou reduções em neurotransmissores excitatórios geralmente elevados no transtorno bipolar, sugerindo um mecanismo potencial por trás da eficácia de uma dieta cetogênica. O estudo também mostrou que os níveis de cetona se correlacionaram com a melhora dos sintomas em um subconjunto de pessoas que relataram avaliações diárias. Este teste piloto aponta a uma nova direção importante para a pesquisa e oferece esperança com opções inovadoras para tratamento de pessoas que vivem com esta doença mental grave. Codirigida pelos cientistas da Universidade de Edimburgo, Iain Campbell, PhD, um pesquisador de Psiquiatria Metabólica do Baszucki Group, Daniel Smith, MD, FRCPsych, Chefe de Psiquiatria, e Harry Campbell, MD, FRSE, FMedSci, a equipe de pesquisa inscreveu 27 participantes com transtorno bipolar em um teste piloto de 6 a 8 semanas de uma dieta cetogênica. Vinte participantes concluíram o estudo, demonstrando que a intervenção foi segura e tolerável nesta população. A maioria alcançou e manteve a cetose, com 91% das leituras positivas para cetonas no sangue. Entre os participantes que ofereceram avaliações confiáveis ​​de dados diários de cetona e saúde mental, o aumento do nível de cetona foi correlacionado com melhoras no humor, energia, impulsividade e ansiedade, com alguns descrevendo a intervenção como transformadora. "Uma dieta cetogênica me deu uma tábua de salvação, restaurando minha energia e meu senso de esperança", disse um participante do estudo. "Senti que finalmente estava curando minha mente, não apenas controlando meus sintomas bipolares. Isso me abriu para novas possibilidades e um futuro mais brilhante." "Usar uma dieta cetogênica é como dar um banho quente na minha mente", disse outro participante. "O nervosismo se foi. Sinto-me mais calmo, mais claro e meu cérebro está funcionando novamente." Os marcadores da função metabólica também melhoraram. Dezenove dos 20 participantes perderam uma média de 9,3 libras (4,2 kg) e viram melhorias no Índice de Massa Corporal (IMC) e na pressão arterial. Estas descobertas sugerem que uma dieta cetogênica pode ajudar a mitigar os riscos comuns de saúde metabólica associados ao transtorno bipolar e seus tratamentos farmacológicos, o que pode levar à redução da esperança de vida. "Observamos marcadores de excitotoxicidade reduzida em duas áreas cerebrais importantes: o córtex cingulado anterior e o córtex cingulado posterior, ambos implicados no transtorno bipolar. Também observamos efeitos em um marcador associado à sinalização de lítio e insulina no córtex cingulado posterior", disse o Dr. Iain Campbell, que também vive com o transtorno e segue uma dieta cetogênica para aliviar seus sintomas."Estes resultados se somam a um pequeno, mas crescente corpo de evidências sugerindo que uma dieta cetogênica pode ser uma intervenção metabólica adjuvante eficaz para transtorno bipolar. Há uma necessidade urgente de estudos de replicação maiores e ensaios clínicos aleatórios concebidos com cuidado para desenvolver estas descobertas." Estas mudanças estão alinhadas à hipótese de sobrecarga metabólica, uma teoria proposta pelos Drs. Campbell, postulando que a desregulação energética é central ao mecanismo do transtorno bipolar e que abordar esta desregulação pode ser a chave para o sucesso da terapia de dieta cetogênica. Uma nova fronteira na saúde mental Este estudo piloto abriu caminho para uma iniciativa mais ampla na Universidade de Edimburgo, que foi possível graças a uma bolsa de pesquisa competitiva do Conselho de Pesquisa Médica da UKRI que estabeleceu o primeiro Centro Europeu de Psiquiatria Metabólica. O centro, para o qual o Baszucki Group também contribuiu com financiamento, é uma cooperação de mais de 100 cientistas dedicados a acelerar a pesquisa sobre as conexões entre metabolismo e saúde mental. Seu foco é explorar o potencial da terapia cetogênica e outras intervenções metabólicas para tratar doenças mentais graves. Este estudo é o segundo ensaio piloto publicado recentemente para demonstrar a segurança e a eficácia potencial da terapia cetogênica na melhoria dos marcadores metabólicos e de saúde mental em doenças mentais graves. O primeiro ensaio, também financiado pelo Baszucki Group, foi conduzido na Universidade de Stanford e também sugeriu que alterações metabólicas sistêmicas de uma dieta cetogênica podem ajudar a estabilizar o cérebro em doenças mentais graves. "Este teste é outro importante passo adiante, a fim de estabelecer a terapia cetogênica como um tratamento padrão para doenças mentais graves", disse Jan Ellison Baszucki, Cofundador e Presidente do Baszucki Group. "Estamos orgulhosos de ter apoiado esta pesquisa e continuamos na esperança de que os estudos em curso continuarão avançando nossa compreensão da intervenção metabólica que salvou a vida de nosso filho." À medida que cresce a conscientização sobre a profunda conexão entre a função metabólica e a saúde do cérebro, este estudo avança o movimento científico mundial rumo a enfoques neurometabólicos para compreender e tratar doenças mentais. Sobre o Baszucki Group Lançado em 2021 pelo Fundador e Diretor Executivo da Roblox, David Baszucki, e pelo autor de best-sellers, Jan Ellison Baszucki, o Baszucki Group aproveita doações privadas, investimentos de impacto, advocacia, narrativa e criação de comunidades para impulsionar mudanças fundamentais. Um objetivo principal do Baszucki Group é transformar os resultados de saúde mental ao apoiar iniciativas na intersecção do metabolismo, psiquiatria e neurociência. Para saber mais sobre enfoques metabólicos para transtornos mentais, incluindo terapia cetogênica, acesse Metabolic Mind (Mente Metabólica), uma iniciativa sem fins lucrativos do Baszucki Group. O texto no idioma original deste anúncio é a versão oficial autorizada. As traduções são fornecidas apenas como uma facilidade e devem se referir ao texto no idioma original, que é a única versão do texto que tem efeito legal. Contacts Colby Zintl colby@baszuckigroup.org // Add toggle of sharing section var internalToggle = new BWToggle("bw-release-internal", "#bw-release-internal h2", "#bw-internal-content"); internalToggle.set(false);'''
