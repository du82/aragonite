title = "ATKR Investor Alert: A Securities Fraud Class Action Lawsuit Has Been Filed Against Atkore Inc. (ATKR) - Contact Kessler Topaz Meltzer & Check, LLP | Business Wire"
description = "The law firm of Kessler Topaz Meltzer & Check, LLP (www.ktmc.com) informs investors that a securities class action lawsuit has been filed against"
full_description = 'ATKR Investor Alert: A Securities Fraud Class Action Lawsuit Has Been Filed Against Atkore Inc. (ATKR) - Contact Kessler Topaz Meltzer & Check, LLP March 01, 2025 09:57 AM Eastern Standard Time RADNOR, Pa.--(BUSINESS WIRE)--The law firm of Kessler Topaz Meltzer & Check, LLP (www.ktmc.com) informs investors that a securities class action lawsuit has been filed against Atkore Inc. (“Atkore”) (NYSE: ATKR) on behalf of those who purchased or otherwise acquired Atkore common stock between February 1, 2024, and February 3, 2025, inclusive (the “Class Period”). The lead plaintiff deadline is April 23, 2025. CONTACT KESSLER TOPAZ MELTZER & CHECK, LLP: If you suffered Atkore losses, you may CLICK HERE or copy and paste the following link into your browser: https://www.ktmc.com/new-cases/atkore-inc?utm_source=PR&utm_medium=link&utm_campaign=atkr&mktm=r You can also contact attorney Jonathan Naji, Esq. by calling (484) 270-1453 or by email at info@ktmc.com. DEFENDANTS’ ALLEGED MISCONDUCT: The complaint alleges that, throughout the Class Period, Defendants made false and misleading statements and/or failed to disclose that: (1) Atkore engaged in an anticompetitive price-fixing scheme that artificially inflated the price of PVC pipes (both water pipes and electrical conduit pipes); (2) in turn, Atkore reaped significant, unsustainable financial benefits from its anticompetitive conduct; (3) as Atkore’s price-fixing scheme was exposed, Atkore and its price fixing co-conspirators were no longer able to artificially inflate the price of PVC pipes, resulting in a substantial decrease in the price of PVC pipes; (4) Atkore’s business and operations were negatively impacted; and (5) as a result of the foregoing, Defendants’ positive statements about Atkore’s business, operations, and prospects were materially false and misleading and/or lacked a reasonable basis at all relevant times. THE LEAD PLAINTIFF PROCESS: Atkore investors may, no later than April 23, 2025, seek to be appointed as a lead plaintiff representative of the class through Kessler Topaz Meltzer & Check, LLP or other counsel, or may choose to do nothing and remain an absent class member. A lead plaintiff is a representative party who acts on behalf of all class members in directing the litigation. The lead plaintiff is usually the investor or small group of investors who have the largest financial interest and who are also adequate and typical of the proposed class of investors. The lead plaintiff selects counsel to represent the lead plaintiff and the class and these attorneys, if approved by the court, are lead or class counsel. Your ability to share in any recovery is not affected by the decision of whether or not to serve as a lead plaintiff. Kessler Topaz Meltzer & Check, LLP encourages Atkore investors who have suffered significant losses to contact the firm directly to acquire more information. CLICK HERE TO SIGN UP FOR THE CASE OR GO TO: https://www.ktmc.com/new-cases/atkore-inc?utm_source=PR&utm_medium=link&utm_campaign=atkr&mktm=r ABOUT KESSLER TOPAZ MELTZER & CHECK, LLP: Kessler Topaz Meltzer & Check, LLP prosecutes class actions in state and federal courts throughout the country and around the world. The firm has developed a global reputation for excellence and has recovered billions of dollars for victims of fraud and other corporate misconduct. All of our work is driven by a common goal: to protect investors, consumers, employees and others from fraud, abuse, misconduct and negligence by businesses and fiduciaries. The complaint in this action was not filed by Kessler Topaz Meltzer & Check, LLP. For more information about Kessler Topaz Meltzer & Check, LLP please visit www.ktmc.com. May be considered attorney advertising in certain jurisdictions. Past results do not guarantee future outcomes. Contacts Kessler Topaz Meltzer & Check, LLP Jonathan Naji, Esq. (484) 270-1453 280 King of Prussia Road Radnor, PA 19087 info@ktmc.com // Add toggle of sharing section var internalToggle = new BWToggle("bw-release-internal", "#bw-release-internal h2", "#bw-internal-content"); internalToggle.set(false);'
