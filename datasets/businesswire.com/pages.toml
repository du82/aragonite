title = "teamLab Planets (Tokio, Toyosu) uzyskuje wzrost sprzedaży biletów rok po roku o 130% w następstwie znacznej rozbudowy. Nastąpiło także znaczne wydłużenie średniego czasu odwiedzin | Business Wire"
description = "teamLab Planets, a museum in Toyosu, Tokyo, where you can immerse yourself with your entire body, has unveiled a cherry blossom-themed artwork by the international art collective teamLab. (teamLab, Floating in the Falling Universe of Flowers, Video: teamLab)"
full_description = '''teamLab Planets (Tokio, Toyosu) uzyskuje wzrost sprzedaży biletów rok po roku o 130% w następstwie znacznej rozbudowy. Nastąpiło także znaczne wydłużenie średniego czasu odwiedzin Kwiaty wiśni rozkwitną w dwóch immersyjnych przestrzeniach w sobotę 1 marca Download MPEG-4 Video Loading media player... jQuery(function() { //create video element var attributes = { 'id': 'news_video', 'class': 'video-js vjs-default-skin', 'width': '640', 'data-height': '264', 'onloadstart': 'this.volume=0.4' } var element = $('<video/>').attr(attributes); $('#media-player').html(element); //Social share var shareOptions = { socials: ['fbFeed', 'tw', 'linkedin', 'mail'], url: window.location.href, title: 'teamLab Planets (Tokio, Toyosu) uzyskuje wzrost sprzeda\u017Cy bilet\u00F3w rok po roku o 130% w nast\u0119pstwie znacznej rozbudowy. Nast\u0105pi\u0142o tak\u017Ce znaczne wyd\u0142u\u017Cenie \u015Bredniego czasu odwiedzin', description: 'BusinessWire news share', image: 'https://mms.businesswire.com/media/20250225115820/pl/2391949/5/200123_Floating_in_the_Falling_Universe_of_Flowers_sakura_clean.jpg', // required for Facebook and Messenger fbAppId: '140586622674265', // optional for Facebook redirectUri: window.location.href + '#close', } //activate Video.JS theme videojs('news_video', { controls: true, autoplay: false, preload: 'auto', poster: 'https://mms.businesswire.com/media/20250225115820/pl/2391949/5/200123_Floating_in_the_Falling_Universe_of_Flowers_sakura_clean.jpg', sources: [ {src: "https://mms.businesswire.com/media/20250225115820/pl/2391949/19/200123_Floating_in_the_Falling_Universe_of_Flowers_sakura_clean.mp4&.mp4?download=1", type: "video/mp4"} ] }).share(shareOptions); }); teamLab Planets, a museum in Toyosu, Tokyo, where you can immerse yourself with your entire body, has unveiled a cherry blossom-themed artwork by the international art collective teamLab. (teamLab, Floating in the Falling Universe of Flowers, Video: teamLab) teamLab Planets, a museum in Toyosu, Tokyo, where you can immerse yourself with your entire body, has unveiled a cherry blossom-themed artwork by the international art collective teamLab. (teamLab, Floating in the Falling Universe of Flowers, Video: teamLab) MPEG-4 Video teamLab Planets, a museum in Toyosu, Tokyo, where you can immerse yourself with your entire body, has unveiled a cherry blossom-themed artwork by the international art collective teamLab. (teamLab, Floating in the Falling Universe of Flowers, Video: teamLab) Image Full Size Small Preview Thumbnail teamLab Planets, a museum in Toyosu, Tokyo, where you can immerse yourself with your entire body, has unveiled a cherry blossom-themed artwork by the international art collective teamLab. (teamLab, Drawing on the Water Surface Created by the Dance of Koi and People - Infinity, Video: teamLab) MPEG-4 Video Highlight Video: teamLab Planets TOKYO DMM © teamLab A new large-scale Athletics Forest and other installations opened at teamLab Planets TOKYO DMM in Toyosu, Tokyo, on Wednesday, January 22, 2025. MPEG-4 Video Image Full Size Small Preview Thumbnail February 28, 2025 11:50 AM Eastern Standard Time TOKIO--(BUSINESS WIRE)--Firma teamLab Planets TOKYO DMM.com (zwana odtąd teamLab Planets) odnotowała znaczny wzrost sprzedaży biletów rok do roku o 130% w następstwie istotnej rozbudowy w styczniu 2025 roku*1 . Nastąpiło także znaczne wydłużenie średniego czasu odwiedzin: zgodnie z przeprowadzoną niedawno ankietą udział odwiedzających, którzy spędzili w obiekcie „2 godziny lub więcej” wzrósł o około 48%, a tych, których pobyt trwał „3 godziny lub więcej” – o około 20%*2 . Wiosną tego roku dwie ogromne przestrzenie artystyczne w teamLab Planets dostąpią przemiany dzięki rozkwitającym kwiatom wiśni. Przestrzeń „Płynąc przez spadający wszechświat kwiatów", w której sezonowe kwiaty rozkwitają i zmieniają się w czasie, zostanie wypełniona kwiatami wiśni w całości. W przestrzeni „Rysując na powierzchni wody, którą tworzy taniec koi i ludzi – nieskończoności”, w której odwiedzający chodzą boso w wodzie, karpie koi pływające po powierzchni wody będą zmieniać się w kwiaty wiśni i rozpadać w zetknięciu z ludźmi. Kwiaty wiśni będzie można zobaczyć od 1 marca (sobota) do 30 kwietnia (środa). Odsłonięcie ponad 20 nowych dzieł sztuki w ramach znacznej rozbudowy W styczniu firma teamLab Planets powiększyła swoją przestrzeń o mniej więcej połowę, odsłaniając ponad 20 nowych dzieł sztuki, skupionych na projektach edukacyjnych, takich jak „Gimnastyczny las”, „Las łowcy i kolekcjonera”oraz „Park przyszłości”. Ponadto „Fabryka szkiców” została otwarta w nowej odsłonie, umożliwiającej zwiedzającym przekształcenie rysunków wykonanych przez nich w artystycznej przestrzeni w oryginalne produkty, które zabiorą ze sobą. Więcej informacji na temat rozbudowy podano w tym komunikacie prasowym. *1 Na podstawie danych dotyczących sprzedaży biletów na oficjalnej witrynie teamLab Planets; porównano okres około jednego miesiąca od 22 stycznia do 16 lutego 2025 r. z okresem od 24 stycznia do 18 lutego 2024 r. *2 Badanie przeprowadzone w teamLab Planets TOKYO DMM.com Czas wykonania badania: od 1 stycznia do 18 lutego 2025 r. Metoda badania: kwestionariusz online dla zwiedzających Liczba prawidłowych odpowiedzi: 2525 (od 1 do 21 stycznia: 669 odpowiedzi, od 22 stycznia do 18 lutego: 1856 odpowiedzi) Wyniki badania: odsetek zwiedzających, którzy spędzają w obiekcie „2 godziny lub więcej” wzrósł z około 12% przed rozbudową do około 60%. Odsetek spędzających w obiekcie „3 godziny lub więcej” wzrósł z około 1% do około 20%. Dzieła sztuki, w których występują kwiaty wiśni w rozkwicie „Płynąc przez spadający wszechświat kwiatów" Sezonowe kwiaty rozkwitają i zmieniają się z czasem, życie rozprzestrzenia się na wszechświat. Połóż się lub usiądź cicho w przestrzeni, a z czasem Twoje ciało zacznie się unosić i rozpłynie się w świecie dzieła sztuki. Kwiaty rosną, tworzą pąki i rozkwitają, a z czasem ich płatki opadają, kwiaty więdną i obumierają. Cykl narodzin i śmierci powtarza się bez końca. Dzieło nie stanowi odtworzenia zarejestrowanych wcześniej obrazów; tworzy je program komputerowy, który w sposób ciągły generuje dzieło w czasie rzeczywistym. Całość podlega ciągłym przemianom i nie sposób odtworzyć wcześniejszych stanów wizualnych. Nigdy nie zobaczymy wszechświata ponownie takim, jaki jest w tym momencie. „Rysując na powierzchni wody, którą tworzy taniec koi i ludzi – nieskończoności” Karpie koi pływają po powierzchni wody, rozciągającej się w nieskończoność. Ludzie mogą wchodzić do wody. Na ruch karpi koi wpływa obecność w wodzie ludzi, a także innych koi. Zderzenie z ludźmi sprawia, że ryby zamieniają się w kwiaty, które rozpadają się. W ciągu roku kwitnące kwiaty będą zmieniać się wraz z porami roku. Trajektoria ruchu karpi koi jest wyznaczana pod wpływem obecności ludzi, a trajektorie kreślą linie na powierzchni wody. Dzieło jest tworzone w czasie rzeczywistym przez program komputerowy. Nie zostało wcześniej zarejestrowane ani nie jest odtwarzane w pętli. Interakcje między widzem a instalacją sprawiają, że w dziele sztuki stale zachodzą zmiany. Zwizualizowanych stanów nie można odtworzyć i nigdy nie wystąpią one ponownie. Koncepcja teamLab Planets Całym ciałem: zanurzaj się, postrzegaj i stań się częścią dzieła sztuki teamLab Planets to muzeum, w którym możesz przemieszczać się przez wodę, stworzone przez kolektyw artystyczny teamLab. W dziełach sztuki zachodzą zmiany pod wpływem obecności ludzi, a ich istnienie polega na zatarciu granicy między dziełem a ciałem Twoim i ciałami innych zwiedzających. Dokonaj fizycznego zanurzenia w ogromnych artystycznych przestrzeniach, postrzegaj je całym ciałem i stań się częścią dzieła sztuki. teamLab Planets TOKYO DMM https://www.teamlab.art/e/planets/ #teamLabPlanets Toyosu, Tokio ( teamLab Planets TOKYO, Toyosu 6-1-16, Koto-ku, Tokio ) Film z podsumowaniem atrakcji https://youtu.be/F7nODEETR4s Zestaw dla prasy https://www.dropbox.com/sh/ir7d2aui794eo6z/AAChbzX5wPsQm8cgkQ2ViFD4a?dl=0 Oficjalną, obowiązującą wersję niniejszego zawiadomienia stanowi tekst oryginalny sporządzony w języku źródłowym. Tekst tłumaczenia służy wyłącznie celom orientacyjnym, został sporządzony wyłącznie dla celów ułatwienia zrozumienia zawiadomienia i należy interpretować go w odniesieniu do tekstu źródłowego, który jest jedyną wersją mającą skutki prawne. Contacts Dział PR teamLab Planets E-MAIL: pr-info@planets.art Kontakt w sprawie wywiadów: https://forms.gle/fAtnDKLpQKFME6XR9 // Add toggle of sharing section var internalToggle = new BWToggle("bw-release-internal", "#bw-release-internal h2", "#bw-internal-content"); internalToggle.set(false);'''
