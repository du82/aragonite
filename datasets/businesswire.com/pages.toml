title = "DJ Spinderella Reunites with AHF for Florida AIDS Walk 20th Anniversary | Business Wire"
description = "Legendary hip hop DJ and rapper DJ Spinderella, who rose to fame with the iconic rap group Salt-N-Pepa, will be joining AIDS Healthcare Foundation’s 2"
full_description = 'DJ Spinderella Reunites with AHF for Florida AIDS Walk 20th Anniversary Annual 5k and music festival prepares to celebrate two decades of raising millions of dollars for South Florida HIV/AIDS nonprofit, service organizations Download Image Full Size Small Preview Thumbnail (Graphic: Business Wire) February 28, 2025 05:29 PM Eastern Standard Time FORT LAUDERDALE, Fla.--(BUSINESS WIRE)--Legendary hip hop DJ and rapper DJ Spinderella, who rose to fame with the iconic rap group Salt-N-Pepa, will be joining AIDS Healthcare Foundation’s 20th year celebration of the Florida AIDS Walk & Music Festival sponsored by AHF Pharmacy at Fort Lauderdale Beach on Saturday March 15th. DJ Spinderella opened for Ricky Martin during AHF’s World AIDS Day Concert in Miami this past December. AHF’s Florida AIDS Walk & Music Festival, an annual beachside 5k walk and concert, raised more than $3M in 2024 for local nonprofit AIDS Service Organizations (ASOs) serving people living with HIV in the South Florida region and is on track to match that benchmark again this year. “We are excited to have DJ Spinderella’s talent on stage once again here in South Florida as we celebrate our 20th annual Florida AIDS Walk & Music Festival on March 15th,” said Tracy Jones, AHF Southern Bureau Chief. “Her commitment to safer sex awareness dates back decades, and her talent is timeless. In addition, as we celebrate 20 years of Florida AIDS Walk, we are proud to expand our beneficiaries this year to include organizations whose work is directly helping to address the growing HIV/AIDS epidemic in this community. Ending the HIV epidemic means meeting people where they are to get them the care they need in all the ways they need it most.” WHEN: Saturday, March 15, 2025 TIME: 8:00 am – Site opens 9:45 am – Formal ceremony begins 10:00 am – 5k walk begins 11:00 am – Music Festival starts 11:05 am – Opening performances 11:30 am – DJ Spinderella 12:30 pm – Headliner 2:00 pm – Music Festival ends WHERE: Fort Lauderdale Beach 1100 Seabreeze Blvd Ft. Lauderdale, FL 33316 REGISTRATION: www.FloridaAidsWalk.org. 2025 Beneficiaries: Afro Pride Florida, Aqua, Broward House, Equality Florida, Latinos Salud, The McKenzie Project, Inc., Positive People Network, The Pride Center at Equality Park, Prism, Safe Schools South Florida, SAVE LGBTQ, SunServe, Transinclusive, Ujima Men’s Collective, and World AIDS Museum and Educational Center. About HIV/AIDS in Florida: The South makes up more than 50% of new HIV diagnoses. (CDC) Florida ranks third in the number of new HIV diagnoses as of 2022. (KFF) More than 51,000 people are living with HIV in Miami-Dade and Broward counties. (FLHealthCharts) Of the top 20 U.S. cities with the highest HIV/AIDS rates, the Fort Lauderdale/Pompano Beach/Sunrise metropolitan area was ranked first. The Miami/Miami Beach/Kendall metropolitan area was ranked second, and the Miami/Fort Lauderdale/Pompano Beach coastal region was ranked fourth. (Insider Monkey) In 2022 and 2023, Miami-Dade County had the highest HIV prevalence in Florida, followed by Broward County which had the second highest HIV prevalence. (CDC AtlasPlus, FLHealthCharts) AIDS Healthcare Foundation (AHF), the world’s largest HIV/AIDS healthcare organization, provides cutting-edge medicine and advocacy to more than 2.2 million individuals across 47 countries, including the U.S. and in Africa, Latin America/Caribbean, the Asia/Pacific Region, and Eastern Europe. In January 2025, AHF received the MLK, Jr. Social Justice Award, The King Center’s highest recognition for an organization leading work in the social justice arena. To learn more about AHF, visit us online at AIDShealth.org, find us on Facebook, and follow us on Instagram, Twitter, and TikTok. Contacts Imara Canady, AHF National Communications Director Mobile: 770-940-6555 imara.canady@ahf.org // Add toggle of sharing section var internalToggle = new BWToggle("bw-release-internal", "#bw-release-internal h2", "#bw-internal-content"); internalToggle.set(false);'
