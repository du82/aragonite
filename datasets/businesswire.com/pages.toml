title = "Guidepost Solutions Refuerza Presencia en América Latina con el Nombramiento de Melissa Price como Directora Gerente en México | Business Wire"
description = "Guidepost Solutions, líder global en investigaciones nacionales e internacionales, soluciones de cumplimiento, monitoreo, y consultoría en seguridad y"
full_description = 'Guidepost Solutions Refuerza Presencia en América Latina con el Nombramiento de Melissa Price como Directora Gerente en México El sólido historial en litigios de Price y su profunda experiencia trabajando en México fortalecen la experiencia de Guidepost Solutions en investigaciones y cumplimiento transfronterizos Download Image Full Size Small Preview Thumbnail Melissa Price, Managing Director, Guidepost Solutions (Photo: Business Wire) Melissa Price, Managing Director, Guidepost Solutions (Photo: Business Wire) Image Full Size Small Preview Thumbnail Image Full Size Small Preview Thumbnail February 28, 2025 02:42 PM Eastern Standard Time NUEVA YORK--(BUSINESS WIRE)--Guidepost Solutions, líder global en investigaciones nacionales e internacionales, soluciones de cumplimiento, monitoreo, y consultoría en seguridad y tecnología, anunció hoy el nombramiento de la experimentada litigante Melissa Price como directora gerente de México. Como exfiscal federal de EE. UU. y como funcionaria tanto del Departamento de Justicia como del Departamento de Estado en México, Price aporta una amplia experiencia a la creciente lista de clientes de Guidepost con negocios en México y la región. “El profundo conocimiento de Melissa de los sistemas legales y regulatorios tanto de EE. UU. como de México, combinado con su experiencia en los sectores público y privado, brindará perspectivas invaluables a nuestros clientes que enfrentan desafíos legales, investigativos y de cumplimiento internacional complejos,” dijo Julie Myers Wood, CEO de Guidepost Solutions. “Habiendo ampliado nuestra presencia en la región con la apertura de nuestra oficina en Ciudad de México en 2024, la incorporación de Melissa refuerza nuestro compromiso de proporcionar orientación estratégica de alto nivel a nuestra creciente base de clientes globales.” Antes de unirse a Guidepost Solutions, Price trabajó en la Embajada de EE. UU. en Ciudad de México, sirviendo como coordinadora de programas para la Oficina de Asuntos Internacionales de Narcóticos y Aplicación de la Ley. Desde ahí proporcionó experiencia en iniciativas de desarrollo de capacidades, prioridades de misión, y el derecho penal de EE. UU. y México. También actuó como enlace legal para la Oficina de Asuntos Internacionales del Departamento de Justicia de EE. UU., trabajando estrechamente con la Fiscalía General de la República (FGR) de México. Además, contribuyó a la Oficina de Desarrollo y Entrenamiento de la Fiscalía en el Extranjero de la Embajada, donde diseñó planes de estudio especializados en habilidades de litigio y tráfico de armas de fuego, capacitando a más de 750 fiscales estatales y federales, investigadores y jueces. Al principio de su carrera como fiscal, Price se desempeñó como fiscal asistente de EE. UU. en Washington, D.C., donde procesó casos de alto perfil relacionados con narcóticos, armas de fuego y delitos violentos. Su servicio le valió un Premio de Logro Especial en 2018. También ha trabajado en destacados bufetes de abogados, incluyendo O’Melveny and Myers, LLP, y Lewis Baach Kaufmann Middlemiss, enfocándose en litigios financieros complejos y disputas transfronterizas. Price tiene un Juris Doctor de la Facultad de Derecho de la Universidad de California, Berkeley. Fluida en español, con siete años de experiencia trabajando en Ciudad de México, aporta una profunda experiencia en asuntos legales transfronterizos a la práctica internacional de Guidepost. Acerca de Guidepost Solutions LLC Guidepost Solutions es líder en investigaciones nacionales e internacionales, soluciones de cumplimiento, monitoreo, y consultoría en seguridad y tecnología. Trabajamos donde sea que sus necesidades nos lleven, ya sea en el terreno alrededor del mundo, o desde una de nuestras oficinas ubicadas en Bogotá, Chicago, Dallas, Honolulu, Londres, Los Ángeles, Ciudad de México, Miami, Nueva York, Palm Beach, Phoenix, San Francisco, Seattle, Singapur, Walnut Creek, y Washington, DC. Para más información, visite www.guidepostsolutions.com. Contacts MEDIA CONTACT: Karina Chalita, Guidepost Solutions kchalita@guidepostsolutions.com +57 310 290 9969 // Add toggle of sharing section var internalToggle = new BWToggle("bw-release-internal", "#bw-release-internal h2", "#bw-internal-content"); internalToggle.set(false);'
