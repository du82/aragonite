full_description = '''News //<![CDATA[ function reload() { window.location.reload(); } //]]> jQuery(document).ready(function(){ jQuery('span[id*="hyde_mkup"]').hide(); //hide all span whose id contains "hyde_mkup" }); Group by: Date (Most Recent First) Industry Subject Region Go //<![CDATA[ function redirect1(){ redirect2(0) } function redirect2(){ document.HeadlineSearchNavForm.submit(); } //]]> Today is March 02, 2025. All times in Eastern Time. NIQ報告顯示全球美妝產業價值較去年同期成長7.3% 03/02/2025 - 12:00 AM 芝加哥--(BUSINESS WIRE)--(美國商業資訊)-- 全球領先的的消費者洞察與市場研究顧問公司NielsenIQ (NIQ)透露，全球美妝產業的價值較去年同期實現了7.3%的穩健成長。拉丁美洲以及非洲-中東地區引領成長，增幅最為顯著，而北美和西歐也分別展現出強勁的成長率，達到7.8%和7.7%。在亞太地區，韓國、印度、泰國、新加坡和紐西蘭正成為主要市場，推動了整體價值的成長。通膨... more » NIQ、世界のビューティー業界が前年比7.3%増の成長を報告 03/02/2025 - 12:00 AM シカゴ--(BUSINESS WIRE)--（ビジネスワイヤ） -- 世界の消費者インテリジェンスで知られるNIQは、世界のビューティー業界が前年比で7.3%の堅調な増加を見せていることを明らかにしました。中南米とアフリカ・中東地域が最大の成長率を記録しており、北米と西欧もそれぞれ+7.8%、+7.7%と堅調な成長率を示しています。アジア太平洋地域では、韓国、インド、タイ、シンガポール、ニュ... more » NIQ报告称全球美业销售额年同比增长7.3% 03/02/2025 - 12:00 AM 芝加哥--(BUSINESS WIRE)--(美国商业资讯)-- 全球领先的消费者研究和零售监测公司尼尔森IQ（NIQ）公布，全球美业销售额年同比增长7.3%。拉丁美洲、非洲及中东地区的增幅最大，北美和西欧也分别呈现出+7.8%和+7.7%的强劲增长势头。在亚太地区，韩国、印度、泰国、新加坡和新西兰正在成为领先市场，为整体销额增长做出了贡献。通货膨胀是这一全球扩张的主要驱动力，但收入提升和新... more » Shareholder Class Action Lawsuit Against Driven Brands Holdings Inc. Survives Motion to Dismiss: Johnson Fistel LLP Continues to Investigate the Directors and Officers for Breach of Fiduciary Duties 03/01/2025 - 09:09 PM SAN DIEGO--(BUSINESS WIRE)--Johnson Fistel, LLP announces it is investigating whether certain directors and officers of Driven Brands Holdings Inc. (NASDAQ: DRVN) breached their fiduciary duties to... more » Samenvatting: Incyte onthult nieuwe gegevens uit haar dermatologieportfolio tijdens de jaarlijkse bijeenkomst van de American Academy of Dermatology (AAD) 2025 03/01/2025 - 08:58 PM WILMINGTON, Del.--(BUSINESS WIRE)--Incyte (Nasdaq: INCY) maakte vandaag bekend dat een aantal samenvattingen met nieuwe gegevens uit haar dermatologieportfolio zullen