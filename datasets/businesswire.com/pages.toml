["https://businesswire.com/news/home/20250227276426/de"]
title = "BeiGene gibt Finanzergebnisse für das vierte Quartal und das Gesamtjahr 2024 sowie Geschäftsaktualisierungen bekannt | Business Wire"
description = "BeiGene, Ltd. (NASDAQ: ONC; HKEX: 06160; SSE: 688235), ein globales Onkologieunternehmen, das beabsichtigt, seinen Namen in BeOne Medicines Ltd. zu än"
full_description = "BeiGene gibt Finanzergebnisse für das vierte Quartal und das Gesamtjahr 2024 sowie Geschäftsaktualisierungen bekannt Gesamtumsatz weltweit von 1,1 Milliarden US-Dollar und 3,8 Milliarden US-Dollar für das vierte Quartal und das Gesamtjahr, was einem Anstieg von 78 % bzw. 55 % entspricht; verringerter GAAP-Betriebsverlust und positives Nicht-GAAP-Betriebsergebnis für das Gesamtjahr Weltweite BRUKINSA-Umsätze von 828 Millionen US-Dollar und 2,6 Milliarden US-Dollar für das vierte Quartal und das Gesamtjahr, was einem Anstieg von 100 % bzw. 105 % entspricht; Fortschritte bei den entscheidenden Programmen für den BCL2-Inhibitor Sonrotoclax und BTK CDAC BGB-16673 Sechs bzw. 13 neue Wirkstoffe (New Molecular Entities, NMEs) wurden im vierten Quartal bzw. im Gesamtjahr in die klinische Prüfung gebracht; für das erste Halbjahr 2025 werden mehrere Datenauswertungen für innovative Programme für solide Tumore erwartet Umsatzprognose für das Gesamtjahr 2025 von 4,9 bis 5,3 Milliarden US-Dollar, Bestätigung des erwarteten positiven GAAP-Betriebsergebnisses und der Cashflow-Generierung aus dem operativen Geschäft im Jahr 2025 Download Image Full Size Small Preview Thumbnail (Graphic: Business Wire) (Graphic: Business Wire) Image Full Size Small Preview Thumbnail Image Full Size Small Preview Thumbnail February 28, 2025 02:35 PM Eastern Standard Time SAN MATEO, Kalifornien--(BUSINESS WIRE)--BeiGene, Ltd. (NASDAQ: ONC; HKEX: 06160; SSE: 688235), ein globales Onkologieunternehmen, das beabsichtigt, seinen Namen in BeOne Medicines Ltd. zu ändern, gab heute Finanzergebnisse und Unternehmensaktualisierungen für das vierte Quartal und das Gesamtjahr 2024 bekannt. „Unsere Ergebnisse für das vierte Quartal und das Gesamtjahr belegen unser enormes Wachstum als globales Onkologie-Kraftpaket, das durch den anhaltenden Erfolg von BRUKINSA und die Entwicklung einer der produktivsten Pipelines für solide Tumore in der Onkologie mit mehreren Datenauswertungen, die in diesem Jahr erwartet werden, gestärkt wird“, sagte John V. Oyler, Mitbegründer, Vorsitzender und CEO von BeiGene. „BRUKINSA ist jetzt der unangefochtene Marktführer bei neuen CLL-Patienten in den USA, verfügt über die breiteste Zulassung aller BTK-Inhibitoren und dient als Eckpfeiler unseres Hämatologie-Geschäfts. Es ist ein vielversprechendes Rückgrat neben unserem BCL2-Inhibitor Sonrotoclax in der Spätphase und unserem potenziellen First-in-Class-BTK-CDAC. Wir bauen auch zukünftige solide Tumor-Franchises bei Brust-, Lungen- und Magen-Darm-Krebs auf, indem wir unsere Plattformen für multispezifische Antikörper, Protein-Degradatoren und Antikörper-Wirkstoff-Konjugate nutzen. 2025 markiert einen Wendepunkt, da wir davon ausgehen, ein positives GAAP-Betriebsergebnis und einen positiven Betriebs-Cashflow zu erzielen, und gleichzeitig beabsichtigen, unseren Namen in BeOne mit unserem neuen NASDAQ-Ticker ONC zu ändern.“ Finanzübersicht für das vierte Quartal und das Gesamtjahr 2024 (Beträge in Tausend US-Dollar und ungeprüft) Viertes Quartal Geschäftsjahr 2024 2023 % Veränderung 2024 2023 % Veränderung Nettoproduktumsätze $ 1,118,035 $ 630,526 77 % $ 3,779,546 $ 2,189,852 73 % Nettoumsätze aus Zusammenarbeit $ 9,789 $ 3,883 152 % $ 30,695 $ 268,927 (89 )% Gesamtumsatz $ 1,127,824 $ 634,409 78 % $ 3,810,241 $ 2,458,779 55 % GAAP-Betriebsverlust $ (79,425 ) $ (383,795 ) (79 )% $ (568,199 ) $ (1,207,736 ) (53 )% Angepasster Betriebsgewinn (-verlust)* $ 78,603 $ (267,224 ) 129 % $ 45,356 $ (752,473 ) 106 % * Eine Erläuterung unserer Verwendung von Nicht-GAAP-Finanzkennzahlen finden Sie im Abschnitt „Hinweis zur Verwendung von Nicht-GAAP-Finanzkennzahlen“ weiter unten in dieser Pressemitteilung. Eine Abstimmung der einzelnen Nicht-GAAP-Finanzkennzahlen mit den am besten vergleichbaren GAAP-Kennzahlen finden Sie in der Tabelle am Ende dieser Pressemitteilung. Wichtige Geschäftsaktualisierungen BRUKINSA® (Zanubrutinib) ist ein oral verfügbarer, niedermolekularer BTK-Inhibitor, der durch Optimierung der Bioverfügbarkeit, Halbwertszeit und Selektivität eine vollständige und anhaltende Hemmung des BTK-Proteins bewirken soll. Mit einer differenzierten Pharmakokinetik im Vergleich zu anderen zugelassenen BTK-Inhibitoren hemmt BRUKINSA nachweislich die Vermehrung bösartiger B-Zellen in einer Reihe krankheitsrelevanter Gewebe. BRUKINSA hat die weltweit umfassendste Zulassung aller BTK-Inhibitoren und ist der einzige BTK-Inhibitor, der die Flexibilität einer ein- oder zweimal täglichen Dosierung bietet. Das klinische Entwicklungsprogramm für BRUKINSA umfasst bisher etwa 7.100 Patienten, die in mehr als 30 Ländern und Regionen an mehr als 35 Studien teilnehmen. BRUKINSA ist in mehr als 70 Märkten zugelassen und weltweit wurden bereits mehr als 180.000 Patienten behandelt. Der Umsatz von BRUKINSA in den USA belief sich im vierten Quartal und im Gesamtjahr 2024 auf insgesamt 616 Millionen US-Dollar und 2, 0 Milliarden US-Dollar im vierten Quartal und im Gesamtjahr 2024, was einem Wachstum von 97 % bzw. 106 % gegenüber den Vorjahreszeiträumen entspricht, wobei mehr als 60 % des Nachfragewachstums von Quartal zu Quartal auf den erweiterten Einsatz bei chronischer lymphatischer Leukämie (CLL) zurückzuführen sind, da BRUKINSA weiterhin Marktanteile als Marktführer bei neuen Patienten in den USA bei chronischer lymphatischer Leukämie (CLL) und allen anderen zugelassenen Indikationen; der Umsatz von BRUKINSA in Europa belief sich im vierten Quartal und im Gesamtjahr 2024 auf insgesamt 113 Millionen US-Dollar bzw. 359 Millionen US-Dollar, was einem Wachstum von 148 % bzw. 194 % im Vergleich zu den Vorjahreszeiträumen entspricht, was auf einen höheren Marktanteil in allen wichtigen Märkten, einschließlich Deutschland, Italien, Spanien, Frankreich und Großbritannien, zurückzuführen ist; und Abschluss einer Vergleichsvereinbarung in einem Patentstreitverfahren mit MSN Pharmaceuticals, Inc. und MSN Laboratories Private Ltd., die MSN das Recht einräumt, frühestens am 15. Juni 2037 eine generische Version von BRUKINSA in den USA zu verkaufen, vorbehaltlich einer möglichen Beschleunigung oder Verlängerung unter Umständen, die für einen Vergleich dieser Art üblich sind. TEVIMBRA® (Tislelizumab) ist ein einzigartig konzipierter humanisierter monoklonaler Immunglobulin-G4 (IgG4)-Antikörper gegen das programmierte Zelltodprotein 1 (PD-1) mit hoher Affinität und Bindungsspezifität gegen PD-1; er ist so konzipiert, dass er die Bindung an Fc-Gamma (Fcγ)-Rezeptoren auf Makrophagen minimiert und so die Immunzellen des Körpers dabei unterstützt, Tumore zu erkennen und zu bekämpfen. TEVIMBRA ist der grundlegende Vermögenswert des Portfolios von BeiGene für solide Tumore und hat bei mehreren Tumorarten und Krankheitsbildern Potenzial gezeigt. Das klinische Entwicklungsprogramm für TEVIMBRA umfasst fast 14.000 Patienten, die bisher in 35 Ländern und Regionen in 70 Studien, darunter 21 zulassungsrelevante Studien, aufgenommen wurden. TEVIMBRA ist in 45 Märkten zugelassen und weltweit wurden bereits mehr als 1,3 Millionen Patienten behandelt. Der Umsatz von Tislelizumab belief sich im vierten Quartal und im Gesamtjahr 2024 auf insgesamt 154 Millionen US-Dollar bzw. 621 Millionen US-Dollar, was einem Wachstum von 20 % bzw. 16 % im Vergleich zu den Vorjahreszeiträumen entspricht. Erhielt die Zulassung der US-amerikanischen Food and Drug Administration (FDA) in Kombination mit einer platin- und fluoropyrimidinbasierten Chemotherapie für die Erstlinienbehandlung von inoperablem oder metastasiertem HER2-negativem Magen- oder gastroösophagealem Adenokarzinom bei Erwachsenen, deren Tumore PD-L1 (≥1) exprimieren; und Zulassung der Europäischen Kommission (EC) in Kombination mit einer Chemotherapie für die Erstlinienbehandlung von Plattenepithelkarzinomen der Speiseröhre und Magen- oder gastroösophagealem Adenokarzinom. Wichtige Pipeline-Highlights BeiGenes Portfoliostrategie legt den Schwerpunkt auf die schnelle Generierung von Daten zum Nachweis des Konzepts im Frühstadium, die durch den schnellen und kostengünstigen Ansatz („Fast to Proof of Concept“) für globale Entwicklungsaktivitäten ermöglicht werden. Das interne globale Forschungs- und Entwicklungsteam des Unternehmens, einschließlich der klinischen Abläufe und Entwicklung, besteht aus fast 3.700 Mitarbeitern, die Studien auf sechs Kontinenten durchführen und sich durch die Zusammenarbeit mit Aufsichtsbehörden und Forschern in über 45 Ländern für eine strenge Datenqualität einsetzen. Dieser strategische Ansatz maximiert die Ressourcen, indem Investitionen, die an Daten gekoppelt sind, schnell in die vielversprechendsten klinisch differenzierten Kandidaten gelenkt werden und andere an Priorität verlieren. Mit einem der größten Onkologie-Forschungsteams der Branche hat BeiGene seine Stärken in der translationalen Entdeckung von kleinen Molekülen und Biologika unter Beweis gestellt, darunter drei Plattformtechnologien: multispezifische Antikörper, chimäre Degradationsaktivierungsverbindungen (CDACs) und Antikörper-Wirkstoff-Konjugate (ADCs). Hämatologie BRUKINSA Auf der Jahrestagung der American Society of Hematology (ASH) wurden die 5-Jahres-Ergebnisse der SEQUOIA-Studie vorgestellt. Unter Berücksichtigung der Auswirkungen von COVID-19 zeigte die Studie, dass die Behandlung mit BRUKINSA das Risiko einer Progression oder des Todes bei Patienten mit behandlungsnaiver chronischer lymphatischer Leukämie (CLL) im Vergleich zu Bendamustin-Rituximab um 75 % reduzierte; die Zulassung von BRUKINSA-Tablettenformulierungen durch die FDA und die Europäische Kommission wird im zweiten Halbjahr 2025 erwartet; eine Zwischenanalyse des progressionsfreien Überlebens für die Phase-3-Studie MANGROVE bei TN-Mantelzelllymphom (MCL) wird im zweiten Halbjahr 2025 erwartet; und Abschluss der Rekrutierung für den Teil der Phase-3-Studie MAHOGANY zum rezidivierten/refraktären (R/R) follikulären Lymphom wird in der zweiten Jahreshälfte 2025 erwartet. Sonrotoclax (BCL2-Inhibitor) Geplante Datenauswertung in Phase-2-Studien zu R/R CLL und R/R MCL und potenzielle beschleunigte Zulassungsanträge in der zweiten Jahreshälfte 2025; Auf der ASH-Tagung wurden Daten aus der 320-mg-Expansionskohorte einer Phase-1/1b-Studie mit einer medianen Nachbeobachtungszeit von 1,5 Jahren vorgestellt, die bei Patienten mit TN-CLL in Kombination mit BRUKINSA keine Progression zeigten; Bisher wurden mehr als 1.800 Patienten in das Programm aufgenommen; Abschluss der Rekrutierung für die Phase-3-Studie CELESTIAL bei TN-CLL; Voraussichtliche Rekrutierung der ersten Probanden für globale Phase-3-Studien bei R/R-CLL und R/R-MCL im zweiten Halbjahr 2025; und Fortsetzung der Rekrutierung für die globale Phase-2-Studie bei Waldenström-Makroglobulinämie. BGB-16673 (BTK CDAC) Die Aufnahme in die Phase-2-Studie zur potenziell zulassungsrelevanten Behandlung von R/R-CLL wurde fortgesetzt, die Daten werden voraussichtlich 2026 veröffentlicht; Bisher wurden mehr als 500 Patienten in das Programm aufgenommen; Der Beginn der Phase-3-Studie zur Behandlung von R/R-CLL im Vergleich zur Wahl des Arztes wird für das erste Halbjahr 2025 erwartet; und Voraussichtlicher Beginn der Phase-3-Head-to-Head-Studie gegen den nichtkovalenten BTK-Inhibitor Pirtobrutinib bei R/R-CLL im zweiten Halbjahr 2025. Solide Tumore Voraussichtliche Datenauswertung für BGB-43395 (CDK4-Inhibitor), BG-68501 (CDK2-Inhibitor) und BG-C9074 (B7H4 ADC) im ersten Halbjahr 2025 und interne Proof-of-Concept-Daten für BG-60366 (EGFR CDAC), BGB-53038 (panKRAS-Inhibitor), BG-C137 (FGFR2b ADC), BGB-C354 (B7H3 ADC) und BG-C477 (CEA ADC) im zweiten Halbjahr 2025. Lungenkrebs Tarlatamab (AMG757, DLL3xCD3 BiTE): Datenauswertung der Phase-3-Studie zur Zweitlinienbehandlung von kleinzelligem Lungenkrebs im ersten Halbjahr 2025 erwartet; Advan-TIG-302 (TIGIT-Antikörper): vorläufige Datenauswertung aus Phase-3-Studie zur Erstlinienbehandlung von PD(L)1-hohem nicht-kleinzelligem Lungenkrebs im zweiten Halbjahr 2025 erwartet; BG-60366 (EGFR CDAC): Eintritt in die klinische Phase im vierten Quartal 2024; differenzierter Degradationsmechanismus zur vollständigen Ausschaltung der EGFR-Signalübertragung; hochwirksam bei Osimertinib-sensitiven und -resistenten EGFR-Mutationen; starke präklinische Wirksamkeitsdaten bei oraler und täglicher Dosierung; BG-89894 (MAT2A-Inhibitor): Eintritt in die Dosis-Eskalation im vierten Quartal 2024; potenziell beste Eigenschaften seiner Klasse mit überlegener Wirksamkeit und Hirnpenetration; starke Synergie zwischen PRMT5i und MAT2Ai in präklinischen Modellen; BGB-58067 (MTA-kooperativer PRMT5-Inhibitor): Anfang Januar 2025 in die klinische Phase eingetreten; Potenzial als Klassenbester mit hoher Wirksamkeit, Selektivität und Durchdringungsfähigkeit des Gehirns; und BG-T187 (EGFR x MET trispezifischer Antikörper): Beginn der Dosissteigerung im vierten Quartal 2024; differenziertes MET-biparatopisches Design mit optimaler MET-Hemmaktivität, um die beste Chance in dieser Klasse zu nutzen. Brust- und gynäkologische Krebserkrankungen BGB-43395 (CDK4-Inhibitor): Fortsetzung der Dosissteigerung in Monotherapie und in Kombination mit Fulvestrant und Letrozol im erwarteten wirksamen Dosisbereich; bisher wurden mehr als 180 Patienten aufgenommen und der Wirksamkeitsnachweis wird für das erste Halbjahr 2025 erwartet; die Planung für eine Phase-3-Studie zur Zweitlinienbehandlung von metastasierendem HR+/HER2-Brustkrebs in Kombination mit einer endokrinen Therapie ist im Gange; und BG-68501 (CDK2-Inhibitor) und BG-C9074 (B7H4 ADC): Fortsetzung der Dosissteigerung in der Monotherapie; bisher wurden mehr als 50 bzw. mehr als 70 Patienten aufgenommen. Gastrointestinale Krebserkrankungen Zanidatamab (bispezifischer HER2-Antikörper) in Kombination mit Tislelizumab und Chemotherapie: primäre PFS-Daten der Phase-3-Studie zur Erstlinienbehandlung des HER2-positiven gastroösophagealen Adenokarzinoms werden voraussichtlich im zweiten Halbjahr 2025 bekannt gegeben; und Neue Wirkstoffe, die im vierten Quartal 2024 in die klinische Prüfung aufgenommen wurden: BGB-53038 (panKRAS-Inhibitor): hochwirksam und selektiv mit breiter Aktivität gegen KRAS- Mutationen bei mehreren Tumorarten; begrenzt die Toxizität, indem andere RAS-Proteine verschont bleiben; KRAS-Mutationen sind bei 19 Prozent aller Krebserkrankungen vorhanden; und BG-C137 (FGFR2b ADC): potenzielles First-in-Class-ADC für ein validiertes Ziel bei Tumoren des oberen Gastrointestinaltrakts und Brustkrebs; potenziell überlegene Wirksamkeit im Vergleich zu führenden monoklonalen Antikörpern in Modellen mit hoher und mittlerer Expression. Entzündung und Immunologie BGB-45035 (IRAK4 CDAC): derzeit in der Dosiseskalation in SAD- und MAD-Kohorten mit mehr als 130 eingeschlossenen Probanden; potenter und selektiver Degrader, der sowohl auf die Kinase- als auch auf die Gerüstfunktionen von IRAK4 abzielt, um eine vollständige Degradation des Ziels zu erreichen; Phase-2-Studie für 2025 geplant; Proof-of-Concept für die Degradation von Gewebe-IRAK"
