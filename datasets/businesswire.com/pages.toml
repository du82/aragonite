y 28, 2025 11:52 AM Eastern Standard Time 加利福尼亚州圣马特奥--(BUSINESS WIRE)--(美国商业资讯)-- Baszucki Group今天宣布了一项关于生酮饮食治疗双相障碍的新试验研究。其中一名研究参与者表示，"多年来，我第一次感觉到我的大脑终于正常工作了。”这项研究今天首次发布在 BJPsych Open 上，它首次利用神经成像技术证明，生酮饮食可以改善双相障碍患者的大脑新陈代谢。生酮饮食对癫痫的疗效已历经100多年的验证，目前世界各地正在研究生酮饮食对各种精神和神经疾病的疗效。 这项欧洲首创的研究得到了Baszucki Group的支持，它采用核磁共振波谱（MRS）等先进的大脑成像技术来测量大脑新陈代谢的变化。成像结果显示，双相障碍患者通常会升高的兴奋性神经递质有所减少，这显示出生酮饮食有效的潜在机制。研究还表明，在一部分每日报告症状评分的个体中，酮体水平与症状改善相关。这项试点试验为研究指明了重要的新方向，并为患有这种严重精神疾病的患者提供了创新治疗方案的希望。 该研究小组由以下爱丁堡大学的科学家共同领导：Iain Campbell博士（Baszucki代谢精神病学研究员)、英国皇家精神科医学院院士Daniel Smith医学博士（精神病学系主任）和爱丁堡皇家学会院士、医学科学院院士Harry Campbell医学博士，并招募了27名双相障碍患者参加为期6-8周的生酮饮食试验。20名参与者完成了研究，证明对这一群体进行的干预是安全和可耐受的。大多数人都达到并维持了生酮状态，91%的血酮读数呈阳性。在提供可靠的每日酮体和心理健康数据评估的参与者中，酮体水平的提高与情绪、精力、冲动性和焦虑的改善相关，有些人认为干预措施改变了他们的生活。 “生酮饮食挽救了我的生命，让我恢复了活力和希望。”一位研究参与者表示，“我感觉我终于治愈了我的心灵，而不仅仅是控制我的双相障碍症状。它让我看到了新的可能性和更光明的未来。” “生酮饮食就像心灵热水浴。”另一位参与者表示，“激烈的情绪消失了。我感觉更平静、更清晰，我的大脑又开始工作了。” 新陈代谢功能指标也有所改善。20名参与者中有19人平均减重9.3磅（4.2千克），体重指数（BMI）和血压也有所改善。这些研究结果表明，生酮饮食可能有助于减轻与双相障碍及其药物治疗相关的常见代谢健康风险，而这些风险可能导致寿命缩短。 Iain Campbell博士也患有这种疾病，并通过生酮饮食来缓解症状，他表示，“我们在前扣带皮层和后扣带皮层这两个关键脑区观察到兴奋毒性降低的标记物，而这两个脑区都与双相障碍有关。我们还观察到在后扣带皮层中，一种与锂和胰岛素信号传导相关的标志物也受到了影响。这些结果为少量但不断增加的证据增添了新的内容，即生酮饮食可能是治疗双相障碍的一种有效的辅助代谢干预措施。目前急需进行更大规模的重复研究和精心设计的随机临床试验，以巩固这些研究成果。” 这些变化与Campbell博士提出的新陈代谢超速假说相吻合，该假说认为能量失调是双相障碍的核心机制，而解决这种失调可能是生酮饮食疗法取得成功的关键。 心理健康的新领域 这项试点研究为爱丁堡大学开展更广泛的相关计划铺平了道路。建立首个欧洲代谢精神病学中心的英国研究与创新医学研究理事会（UKRI Medical Research Council）提供的竞争性研究补助金确保了该研究的顺利开展。代谢精神病学中心由100多名科学家组成，致力于加速新陈代谢与心理健康之间联系的研究。该中心也获得了Baszucki Group的资助，其重点是探索生酮疗法和其他代谢干预措施治疗严重精神疾病的潜力。 这项研究是最近发表的第二项试点试验，证明了生酮疗法在改善重症精神病患者代谢和精神健康指标方面的安全性和潜在疗效。 在斯坦福大学进行的首次试验也是由Baszucki Group资助，并且同样表明生酮饮食带来的系统代谢变化可能有助于稳定重症精神病患者的大脑。 Baszucki Group联合创始人兼总裁Jan Ellison Baszucki表示，“这项试验在将生酮疗法确立为严重精神疾病的标准治疗方法方面又迈出了重要一步。我们很荣幸能支持这项研究，并希望正在进行的研究能继续增进我们对新陈代谢干预疗法的了解，这种疗法挽救了我儿子的生命。” 随着人们对代谢功能与大脑健康之间深刻联系的认识不断加深，这项研究推动了全球科学界尝试采用神经代谢方法去理解和治疗精神疾病。 关于Baszucki Group 由Roblox创始人兼首席执行官David Baszucki和畅销书作家Jan Ellison Baszucki于 2021 年创立的Baszucki Group利用私人捐赠、影响力投资、宣传、讲故事和社区建设来推动基础性变革。Baszucki Group的主要目标是通过支持新陈代谢、精神病学和神经科学交叉领域的倡议，改变心理健康成果。要了解更多有关代谢疗法（包括生酮疗法）治疗精神障碍的信息，请访问Baszucki Group的非营利计划Metabolic Mind。 免责声明：本公告之原文版本乃官方授权版本。译文仅供方便了解之用，烦请参照原文，原文版本乃唯一具法律效力之版本。 Contacts Colby Zintl colby@baszuckigroup.org // Add toggle of sharing section var internalToggle = new BWToggle("bw-release-internal", "#bw-release-internal h2", "#bw-internal-content"); internalToggle.set(false);'''
