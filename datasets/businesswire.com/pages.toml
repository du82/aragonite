full_description = "ベイジーン、2024年第4四半期および通年の決算結果と事業の最新情報を発表 第4・四半期の総売上高は11億ドル（前年同期比78%増）、通年では38億ドル（前年同期比55%増）を記録。GAAPベースの営業損失を縮小し、通年の非GAAPベース営業利益はプラスを達成 BRUKINSAのグローバル売上高は、第4・四半期で8億2,800万ドル（前年同期比100%増）、通年で26億ドル（前年同期比105%増）を記録。また、BCL2阻害剤「Sonrotoclax」とBTK CDAC「BGB-16673」の重要な臨床試験を進展 第4・四半期に6つ、通年で13の新分子実体（NME）が臨床段階に進展。2025年上半期には、革新的な固形腫瘍プログラムに関する複数のデータを発表予定 2025年通年の売上高見通しは49億～53億ドル、GAAPベースの営業利益の黒字化と営業活動によるキャッシュフロー創出の達成を再確認 Download Image Full Size Small Preview Thumbnail (Graphic: Business Wire) (Graphic: Business Wire) Image Full Size Small Preview Thumbnail Image Full Size Small Preview Thumbnail March 01, 2025 08:14 PM Eastern Standard Time カリフォルニア州、サンマテオ--(BUSINESS WIRE)--（ビジネスワイヤ） -- グローバルながん領域専門の製薬企業であるベイジーン（NASDAQ：ONC、HKEX：06160、SSE：688235）（BeOne Medicines Ltd.へ社名変更予定）は、2024年第4・四半期および通年の決算結果と企業最新情報を発表しました。 「当社の第4・四半期および通年の業績は、グローバルながん治療リーダーとしての当社の大幅な成長を示しており、BRUKINSAの継続的な成功と、がん分野で最も有望な固形腫瘍パイプラインの開発によってさらに強化されています。また、今年は複数のデータ発表を予定しています」と、ベイジーンの共同創業者・会長兼最高経営責任者（CEO）であるジョン・V・オイラーは述べました。「BRUKINSAは現在、米国における新規慢性リンパ性白血病（CLL）患者の治療開始数において先頭に立っており、BTK阻害剤の中で最も広範な適応を持ち、当社の血液腫瘍事業の基盤を担っています。また、後期開発段階にあるBCL2阻害剤のsonrotoclaxや、トップクラスとなることが見込まれるBTK CDACと併用することで、治療の基盤として非常に大きな可能性を示しています。さらに当社は、多特異性抗体、タンパク質分解薬、抗体薬物複合体（ADC）のプラットフォームを活用することで、乳がん、肺がん、消化器がんの分野における将来の固形腫瘍事業を構築しています。2025年は転換点となっており、GAAPベースの営業利益の黒字化と営業キャッシュフローの創出を達成する見込みです。また、社名をBeOneに変更し、新たなNASDAQティッカーシンボル『ONC』での取引を開始する予定です。」 2024年第4・四半期および通年の財務ハイライト （千米ドル単位・監査前） 第4・四半期 通年 2024 2023 変化率 2024 2023 変化率 製品純収益 $ 1,118,035 $ 630,526 77 % $ 3,779,546 $ 2,189,852 73 % 協業による純収益 $ 9,789 $ 3,883 152 % $ 30,695 $ 268,927 (89 )% 総売上 $ 1,127,824 $ 634,409 78 % $ 3,810,241 $ 2,458,779 55 % GAAPベースの営業損失 $ (79,425 ) $ (383,795 ) (79 )% $ (568,199 ) $ (1,207,736 ) (53 )% 調整後営業収益（損失）* $ 78,603 $ (267,224 ) 129 % $ 45,356 $ (752,473 ) 106 % *非GAAP財務指標の使用に関する説明については、本プレスリリースの「非GAAP財務指標の使用に関する注記」セクションを参照してください、各非GAAP財務指標と最も比較可能なGAAP指標との調整については、本プレスリリースの最後の表をご覧ください。 主要な事業アップデート BRUKINSA®（ザヌブルチニブ）は、経口投与可能なBTK阻害剤で、バイオアベイラビリティ、半減期、選択性を最適化することで、BTKタンパク質を完全かつ持続的に阻害するよう設計されています。また、他の承認済みBTK阻害剤と比較して差別化された薬物動態を持ち、疾患関連組織内で悪性B細胞の増殖を抑制することが実証されています。尚、BRUKINSAは、BTK阻害剤の中で最も広範な適応を持ち、1日1回または2回の柔軟な投与が可能な、唯一のBTK阻害剤です。BRUKINSAの臨床開発プログラムには、これまでに30以上の国と地域における35以上の試験で約7,100人の患者が参加しています。また、現在、70以上の市場で承認されており、世界中で18万人以上の患者が治療を受けています。 米国でのBRUKINSAの売上は、2024年第4・四半期で6億1,600万ドル（前年同期比97%増）、通年で20億ドル（前年同期比106%増）を記録しました。四半期ごとの需要増加の60%以上は、CLLでの使用拡大によるものです。BRUKINSAは、米国におけるCLLおよびその他の承認適応で新規患者の治療開始数を牽引しており、その地位をさらに拡大し、市場シェアを継続的に伸ばしています。欧州でのBRUKINSAの売上は、2024年第4・四半期で1億1,300万ドル（前年同期比148%増）、通年で3億5,900万ドル（前年同期比194%増）を記録しました。この成長は、ドイツ、イタリア、スペイン、フランス、英国を含む主要市場全体での市場シェア増加がその要因となっています。 MSN Pharmaceuticals, Inc.およびMSN Laboratories Private Ltd.と特許訴訟の和解契約を締結し、MSNに対し、BRUKINSAのジェネリック版を最短2037年6月15日以降に米国で販売する権利を付与しました。ただし、和解の一般的な条件に基づき、販売開始時期が早まるまたは延長される可能性があります。 TEVIMBRA®（ティスリズマブ） は、特異的にPD-1を標的とする高親和性・高結合特異性を持つ、独自設計のヒト化免疫グロブリンG4（IgG4）抗PD-1モノクローナル抗体です。マクロファージ上のFcガンマ（Fcγ）受容体への結合を最小限に抑えるよう設計されており、体内の免疫細胞が腫瘍を検出・攻撃する際の手助けとなります。 TEVIMBRAは、ベイジーンの固形腫瘍ポートフォリオの基盤となっており、複数の腫瘍タイプや疾患領域で有望な可能性を示しています。TEVIMBRAの臨床開発プログラムには、これまでに35の国と地域で実施された（承認申請を支援する21の試験を含む）70の試験に約14,000人の患者が参加しています。現在、45の市場で承認され、世界中で130万人以上の患者が治療を受けています。 ティスリズマブの売上は、2024年第4・四半期で1億5,400万ドル（前年同期比20%増）、通年で6億2,100万ドル（前年同期比16%増）を記録しました。 米国食品医薬品局（FDA）から、プラチナ系およびフルオロピリミジン系化学療法との併用による、PD-L1（≥1）を発現する切除不能または転移性HER2陰性胃がんおよび胃食道接合部腺がんの成人に対する一次治療としての承認を取得しました。 欧州委員会（EC）から、化学療法との併用による食道扁平上皮がん、および胃がん・胃食道接合部腺がんの一次治療としての承認を取得しました。 パイプラインの主なハイライト ベイジーンのポートフォリオ戦略は、迅速な初期段階の臨床概念実証データの生成を重視しており、グローバル開発業務におけるコストやスピードで優位な「迅速な概念実証」戦略を活用しています。臨床運営および開発をはじめとする当社の社内グローバル研究開発チームは、約3,700名のスタッフで構成され、6大陸にわたって臨床試験を実施しており、45か国以上の規制当局や研究者と連携することで高品質なデータの確保に努めています。この戦略的アプローチにより、データに基づいた投資判断を行い、最も有望で臨床的に差別化された候補に迅速にリソースを集中させ、優先度の低いプログラムの見直しを行い、資源を最大限に活用しています。ベイジーンは業界で最も大規模ながん研究チームを擁しており、多特異性抗体、キメラ分解活性化化合物（CDAC）、抗体薬物複合体（ADC）などの3つのプラットフォーム技術を含むトランスレーショナルな小分子およびバイオ医薬品の発見において強みを発揮しています。 血液学 BRUKINSA 米国血液学会（ASH）年次総会にて、SEQUOIA試験の5年間にわたるフォローアップ結果を発表しました。結果では、COVID-19の影響を調整した結果、BRUKINSAによる治療は、未治療（TN）CLL患者において、ベンダムスチン・リツキシマブ併用療法と比較して疾患進行または死亡のリスクを75%低減することが示されました。 2025年後半に、BRUKINSAの錠剤製剤について米国FDAおよびECの承認が見込まれています。 2025年後半に、TNマントル細胞リンパ腫（MCL）を対象とした第3相MANGROVE試験の無増悪生存期間に関する中間解析を実施予定です。 2025年後半に、再発・難治性（R/R）濾胞性リンパ腫を対象とした第3相MAHOGANY試験の患者登録を完了予定です。 Sonrotoclax（BCL2阻害剤） 2025年後半に、R/R CLLおよびR/R MCLを対象とした第2相試験のデータ発表を予定しており、早期承認申請の可能性が見込まれています。 ASHにて、中央値1.5年のフォローアップ期間における第1/1b相試験の320mg拡大コホートのデータを発表しました。TN CLL患者において、BRUKINSAとの併用療法による疾患進行は見受けられませんでした。 現在までに1,800人以上の患者がプログラム全体に登録されています。 TN CLLを対象とした第3相CELESTIAL試験の患者登録を完了しました。 2025年上半期に、R/R CLLおよびR/R MCLを対象としたグローバル第3相試験の最初の被験者登録を予定しています。 ワルデンシュトレームマクログロブリン血症を対象としたグローバル第2相試験の患者登録を継続中です。 BGB-16673 (BTK CDAC) R/R CLLを対象とした第2相試験の患者登録を継続中で、2026年にデータ発表が予定されます。 現在までに500人以上の患者がプログラムに登録されています。 2025年上半期に、医師が選択した治療法との比較を行う、R/R CLLを対象とした第3相試験を開始する予定です。 2025年後半に、R/R CLLを対象とした非共有結合型BTK阻害剤ピルトブリチニブとの直接比較を行う第3相試験を開始する予定です。 固形腫瘍 2025年上半期に、BGB-43395（CDK4阻害剤）、BG-68501（CDK2阻害剤）、BG-C9074（B7H4 ADC）のデータ発表を予定しており、2025年下半期には、BG-60366（EGFR CDAC）、BGB-53038（panKRAS阻害剤）、BG-C137（FGFR2b ADC）、BGB-C354（B7H3 ADC）、BG-C477（CEA ADC）の社内での概念実証データの発表を予定しています。 肺がん タルラタマブ（AMG757、DLL3xCD3 BiTE）：2025年上半期に、第2治療選択としての小細胞肺がんに関する第3相試験のデータ発表を予定しています。 Advan-TIG-302（TIGIT抗体）：2025年下半期に、一次治療としてのPD(L)1高表現型非小細胞肺がんに関する第3相試験の中間データ発表を予定しています。 BG-60366（EGFR CDAC）：2024年第4・四半期に臨床試験に入りました。EGFRシグナル伝達を完全に抑制する差別化された分解機構を持ち、オシメルチニブ感受性および耐性のあるEGFR変異に対して非常に強力で、経口投与および1日1回の投与で強力な前臨床効果データを示しています。 BG-89894（MAT2A阻害剤）：2024年第4・四半期に用量漸増試験に入りました。優れた効果と脳への浸透性を備えた、クラス最適候補の特性を持っており、PRMT5iとMAT2Aiの前臨床モデルにおける強力な相乗効果が確認されています。 BGB-58067（MTA協働型PRMT5阻害剤）：2025年1月初めに臨床試験に入りました。高い効力、選択性、脳への浸透性を備えた、クラス最適候補とされています。 BG-T187（EGFR x MET三特異的抗体）：2024年第4・四半期に用量漸増試験を開始しました。最適なMET阻害活性を持つ差別化されたMET二重抗原設計により、トップレベルとなる機会を追求しています。 乳がんおよび婦人科系がん BGB-43395（CDK4阻害剤）：単剤療法および、フルベストラントとレトロゾールの予想有効用量範囲での併用で用量漸増を継続しています。これまでに180人以上の患者が登録されており、2025年上半期に概念実証データを発表予定です。また、内分泌療法との併用による第二選択のHR+/HER2-転移性乳がんを対象とした、第3相試験の計画が進行中です。 BG-68501（CDK2阻害剤）およびBG-C9074（B7H4 ADC）：単剤療法での用量漸増を継続しており、これまでにそれぞれ50人以上、70人以上の患者が登録されています。 消化器がん ザニダタマブ（HER2二特異的抗体）とティスリズマブおよび化学療法との併用：2025年下半期に、一次治療としてのHER2陽性胃食道接合部腺がんにおける第3相試験の主要な無増悪生存期間（PFS）データ発表を予定しています。 2024年第4・四半期に臨床試験段階に進展したNMEには以下が含まれます。 BGB-53038（panKRAS阻害剤）：複数の腫瘍タイプにおけるKRAS変異に対して幅広い活性を持つ、高力価かつ選択的な薬剤で、他のRASタンパク質を温存することで毒性を抑制します。KRAS変異は全癌の19%に存在します。 BG-C137（FGFR2b ADC）：上部消化器がんおよび乳がんの検証済みターゲットに対する初のADC候補であり、高および中程度の発現モデルの両方において主要なモノクローナル抗体と比較して優れた効果を示すことが期待されています。 炎症および免疫学 BGB-45035（IRAK4 CDAC）：現在、SAD（単回投与）およびMAD（反復投与）の両コホートで用量漸増試験を実施中で、130人以上の被験者が登録されています。IRAK4のキナーゼおよび足場機能の両方を標的とする強力で選択的な分解剤で、完全なターゲット分解を達成します。2025年に第2相試験を計画しており、2025年下半期には組織内IRAK4分解の概念実証を予定しています。 企業の最新情報 株主の承認を前提に、会社名を「BeOne Medicines」に変更する意向を発表しました。新たな社名は、グローバル・コミュニティと協力してできるだけ多くの患者にサービスを提供し、がんを排除する革新的な医薬品の開発に取り組む同社のコミットメントを反映しています。 SYH2039（BG-89894）という新規MAT2A阻害剤について、固形腫瘍の単剤療法およびBGB-58067（MTA協働型PRMT5阻害剤）との併用療法としての研究が進められている中、CSPC Zhongqi Pharmaceutical Technology（石家荘市）との間でグローバル・ライセンス契約を発表しました。 当社のNASDAQ株式ティッカーシンボルを「BGNE」から「ONC」に変更しました。 2024年12月16日に投資家向けウェビナーを開催し、2024年のASHおよびサンアントニオ乳がんシンポジウムからの血液学事業の主要データを紹介し、また、2025年1月13日のJ.P.モルガン ヘルスケア カンファレンスでも発表を行いました。ウェビナーの再生と資料は、当社ウェブサイトの「投資家向けイベントおよびプレゼンテーション」セクションでご覧いただけます。 2024年第4・四半期および通年の業績ハイライト 2024年第4・四半期および通年の売上高は、それぞれ11億ドルと38億ドルで、前年同期の6億3,400万ドルおよび25億ドルと比較して、主に米国および欧州でのBRUKINSA製品の売上増加により成長しました。 製品売上高は、2024年第4・四半期で11億ドル、通年で38億ドルに達し、前年同期の6億3,100万ドルおよび22億ドルと比較して増加しました。製品売上高の増加は、主にBRUKINSAの売上増加によるものです。2024年第4・四半期および通年において、当社最大市場である米国では、製品売上高がそれぞれ6億1,600万ドルおよび20億ドルで、前年同期の3億1,300万ドルおよび9億4,600万ドルと比較して大きな増加を見せました。2024年第4・四半期の米国売上は、季節性および顧客の注文パターンのタイミングにより、約3,000万ドルのプラスの影響を受けました。BRUKINSAの売上増加に加えて、製品売上高は、アムジェンからのライセンス取得製品およびティスリズマブの成長もプラスの影響を与えました。 2024年第4・四半期および通年におけるグローバル製品売上高に占める売上総利益率は、それぞれ85.6%および84.3%で、前年同期のGAAPベースでの83.2%および82.7%と比較して増加しました。売上総利益率は、ポートフォリオ内の他の製品に対して、グローバルなBRUKINSAの売上比率が高まったことから、四半期ごとおよび前年同期比で増加しました。ただし、ティスリズマブの生産効率を高めるため、より大規模な生産ラインに移行したことに伴い、2024年第4・四半期および通年で、それぞれ1,600万ドルおよび3,300万ドルの加速減価償却費用が影響を受け、一部相殺されました。加速減価償却費を含まない調整後の基準では、2024年第4・四半期および通年の製品売上に対する売上総利益率は、それぞれ87.4%および85.5%に増加し、前年同期の83.7%および83.2%と比較して改善しました。 営業経費 2024年第4・四半期および2023年第4・四半期の営業経費はそれぞれ以下の表にまとめました： GAAPベース 非GAAPベース （単位：千ドル、%表示は除く） Q4 2024 Q4 2023 変化率 Q4 2024 Q4 2023 変化率 研究開発 $542,012 $493,987 10% $474,874 $437,383 9% 販売費及び一般管理費 $504,677 $418,385 21% $433,059 $361,435 20% 営業経費合計 $1,046,689 $912,372 15% $907,933 $798,818 14% 2024年および2023年通年の営業経費はそれぞれ以下の表にまとめました。 GAAPベース 非GAAPベース （単位：千ドル、%表示は除く） FY 2024 FY 2023 変化率 FY 2024 FY 2023 変化率 研究開発 $1,953,295 $1,778,594 10% $1,668,368 $1,558,960 7% 販売費及び一般管理費 $1,831,056 $1,508,001 21% $1,549,864 $1,284,689 21% 営業経費合計 $3,784,351 $3,286,595 15% $3,218,232 $2,843,649 13% 2024年第4・四半期および通年の研究開発（R&D）費は、前年同期比でGAAPおよび調整後の両方で増加しており、前臨床プログラムが臨床試験に進展したことと、初期臨床プログラムが後期段階に進展したことが主な要因となっています。ライセンス取得資産に関連する進行中の研究開発（R&D）の前払金およびマイルストーン支払いは、2024年第4・四半期で6,300万ドル、通年で1億1,400万ドルとなり、前年同期の3,180万ドルおよび4,680万ドルと比較して増加となりました。 2024年第4・四半期および通年の販売費および一般管理費（SG&A）は、前年同期比でGAAPおよび調整後の両方で増加しました。これは、主に米国および欧州でのBRUKINSAのグローバル商業展開への継続的な投資が影響しています。SG&A費用の製品売上高に対する割合は、2024年第4・四半期および通年でそれぞれ45%および48%となり、前年同期の66%および69%と比較して大幅に改善しました。 純損失 GAAP純損失は、2024年第4・四半期および通年において前年同期比で改善しました。営業損失の減少が主な要因となっています。 2024年第4・四半期の1株当たり純損失は0.11ドル、1米国預託証券（ADS）当たり1.43ドルとなり、前年同期の1株当たり0.27ドル、1ADS当たり3.53ドルと比較して減少しました。2024年通年の純損失は、1株当たり0.47ドル、1米国預託証券（ADS）当たり6.12ドルで、前年の1株当たり0.65ドル、1ADS当たり8.45ドルと比較して減少となりました。 2024年第4・四半期の営業キャッシュフローは7,500万ドルで、前年同期比で2億9,700万ドル増加しました。2024年通年では、営業活動によるキャッシュの流出が1億4,100万ドルとなり、前年同期比で10億ドル減少しました。この期間の営業キャッシュフローの改善は、主にGAAPベースの営業損失の改善および非GAAPベースの営業利益の向上によるものです。 ベイジーンの2024年財務諸表に関する詳細には、米国証券取引委員会（SEC）に提出された当社の2024年度年次報告書（Form 10-K）をご参照ください。 2025年通年の業績見通し ベイジーンの財務見通しは以下のとおりです。 FY 20251 総売上 $4,900,000,000～$5,300,000,000 GAAPベースの営業経費（R&DおよびSG&A） $4,100,000,000～$4,400,000,000 補足: GAAP売上総利益率が80％台中盤 通年黒字GAAPベース営業利益 営業活動によるプラスのキャッシュフロー創出 1本見通しには、新たな重要な事業開発活動や異常・一時的項目は含まれていません。また、2025年1月31日時点の為替レートを前提としています。 ベイジーンの2025年通年の総売上高見通しは、BRUKINSAの米国市場でのリーダーシップと、欧州およびその他の重要な国際市場での継続的な拡大による力強い売上高成長などが期待されることから、49億ドルから53億ドルとなっています。売上総利益率は、製品構成や生産効率の向上により、2024年と比較して80％台中盤の範囲になると見込まれています。ベイジーンのGAAPベースの営業経費見通しには、引き続き有意義な営業レバレッジを実現するペースでの商業および研究分野の成長を支援する投資の見込みが含まれています。株式報酬費用、減価償却費、償却費を除外した非GAAPベースの営業経費は、GAAPベースの営業経費と同様の推移を見込んでおり、調整項目は従来の慣行から変更はありません。営業経費の見通しには、新たな重要な事業開発活動や異常・一時的な項目は含まれていません。 カンファレンス・コールおよびウェブキャスト 同社の2024年第4・四半期および通年の決算カンファレンス・コールは、2025年2月27日（木）午前8時（米国東部時間）よりウェブキャストで、およびベイジーンの公式ウェブサイトの投資家向けページ（www.beigene.com）から配信が行われました。スライド資料による補足情報およびウェブキャストの再配信も提供される予定です。 ベイジーンについて ベイジーン（BeOne Medicines Ltd.へ社名変更予定）は、がん患者にとってより安価で利用しやすい革新的な治療法を発見・開発するグローバルながん領域専門の製薬企業です。当社は広範な製品ポートフォリオを有し、社内の専門技術や提携により、多様な新規治療薬の開発を推進しています。また、私たちは、必要としているより多くの患者さんが、医薬品にアクセスできるよう、状況を根本的に改善することに全力を尽くしています。拡大中の当社のグローバル・チームは世界6大陸にまたがり、1万1千人以上の社員を擁しています。ベイジーンについての詳細は、公式ウェブサイトwww.beigene.comをご覧いただくか、LinkedIn、X（旧Twitter）、Facebook、Instagramをフォローしてください。 ベイジーンは、重要な情報を開示し、Regulation FDに基づく開示義務を遵守するために、公式ウェブサイトの投資家セクション、X（旧Twitter）アカウント（x.com/BeiGeneGlobal））、LinkedInアカウント（linkedin.com/company/BeiGene）、Facebookアカウント（facebook.com/BeiGeneGlobal）、およびInstagramアカウント（instagram.com/BeiGeneGlobal）を活用する意向です。したがって、投資家の皆様は、ベイジーンの公式ウェブサイト、Xアカウント、LinkedInアカウント、Facebookアカウント、Instagramアカウントに加え、同社のプレスリリース、SEC提出書類、公開カンファレンス・コール、プレゼンテーション、ウェブキャストも併せて確認する必要があります。 将来見通しに関する記述 本プレスリリースには、1995年米国私募証券訴訟改革法およびその他の連邦証券法に基づく将来見通しに関する記述が含まれています。これには、概念実証データの発表時期、臨床試験の実施および結果、試験の被験者登録状況、規制当局の承認、ベイジーンの将来の売上高、営業利益、キャッシュフロー、営業経費、売上総利益率、ベイジーンの固形腫瘍パイプラインの将来性および複数の疾患領域や治療手法における患者のアンメットニーズへの対応能力、ベイジーンの臨床試験および新規分子の将来の成功、ならびに「ベイジーンについて」の項目に記載されているベイジーンの計画、取り組み、願望、目標に関する記述が含まれます。実際の結果は、さまざまな重要な要因により、将来見通しに関する記述と大きく異なる可能性があり、これには、ベイジーンの医薬品候補の有効性および安全性を実証する能力、医薬品候補の臨床試験結果が、さらなる開発や販売承認を支持しない可能性があること、規制当局の対応が臨床試験や販売承認の開始、時期、進捗に影響を及ぼす可能性、ベイジーンが販売中の医薬品や、承認を取得した場合の医薬品候補について商業的成功を収める能力、ベイジーンの医薬品や技術に関する知的財産権を取得・維持する能力、医薬品の開発、製造、商業化、およびその他のサービスを実施するためのベイジーンによる第三者への依存、医薬品の規制当局の承認取得や商業化におけるベイジーンの限られた経験、事業のための追加資金を獲得し、医薬品候補の開発を完了し、収益性を達成し、維持するベイジーンの能力、ならびにベイジーンの最新のForm 10-K年次報告書の「リスク要因」と題するセクションおよびベイジーンが米国証券取引委員会（SEC）へ提出した報告書に記載された潜在的リスク、不確実性、その他の重要な要因の説明でより詳細に説明されているリスクなどが含まれます。本プレスリリースに記載されているすべての情報は、発表日時点のものであり、法律で義務付けられない限り、ベイジーンはその情報を更新する義務を負いません。また、ベイジーンの財務見通しは、重大な不確実性を伴う推計および前提に基づいています。 要約連結損益計算書（米国GAAPベース） （単位：千米ドル、株式、米国預託株式（ADS）、1株当たりおよび1ADS当たりのデー