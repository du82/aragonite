["https://www.businesswire.com/news/home/20250301674833/en/5795630/Prime-Healthcare-Completes-Historic-Acquisition-of-Ascension-Hospitals-and-Care-Sites-in-Illinois"]
title = "Prime Healthcare Completes Historic Acquisition of Ascension Hospitals and Care Sites in Illinois | Business Wire"
description = "Resurrection Medical Center (Chicago) - Prime Healthcare Completes Historic Acquisition of Ascension Hospitals and Care Sites in Illinois (Photo: Business Wire)"
full_description = '''Prime Healthcare Completes Historic Acquisition of Ascension Hospitals and Care Sites in Illinois Download Image Full Size Small Preview Thumbnail Resurrection Medical Center (Chicago) - Prime Healthcare Completes Historic Acquisition of Ascension Hospitals and Care Sites in Illinois (Photo: Business Wire) Resurrection Medical Center (Chicago) - Prime Healthcare Completes Historic Acquisition of Ascension Hospitals and Care Sites in Illinois (Photo: Business Wire) Image Full Size Small Preview Thumbnail Image Small Preview Thumbnail March 01, 2025 09:00 AM Eastern Standard Time ONTARIO, Calif.--(BUSINESS WIRE)--Prime Healthcare announced today that it has successfully completed the historic acquisition of eight Ascension Illinois hospitals, four senior living and post-acute care facilities, and physician practices, signaling a new era of service excellence and award-winning healthcare in the Greater Chicago area. After an extensive review process, the Illinois Health Facilities and Services Review Board voted unanimously to approve the acquisition and the Archdiocese of Chicago and the Vatican granted endorsement. Throughout each evaluation phase, Prime Healthcare's decades-long mission of saving, improving and investing in community hospitals, and its tradition of ensuring health equity and social responsibility have been consistently recognized. "Prime Healthcare is honored to welcome these hospitals into our award-winning system, building upon our legacy of transforming healthcare and preserving access to life-saving services," said Sunny Bhatia, MD, President and Chief Medical Officer of Prime Healthcare. "For nearly two decades, we have uniquely revitalized hospitals, ensuring they not only survive but thrive—delivering compassionate, evidence-based care that communities can trust. This milestone is a testament to the dedication of our physicians, nurses, and staff, whose unwavering commitment makes our mission possible. With deep gratitude, we embrace this opportunity to improve wellness for generations to come." Prime Healthcare is nationally recognized for award-winning quality care and has been named a 10 Top and 15 Top Health System by Truven Health Analytics. Prime Healthcare was named one of America's Greatest Workplaces for 2024 by Newsweek and Plant-A Insights Group, showcasing its environment where diverse backgrounds and identities are valued and celebrated. Its hospitals have been named among the nation's "100 Top Hospitals" 69 times and have received more Patient Safety Excellence Awards from Healthgrades than any other health system in the past eight years. Prime Healthcare has received more than 500 awards from national organizations such as The Leapfrog Group, U.S. News & World Report, and the Lown Institute, which honored Prime Healthcare as a "Top 10 Health System" in the nation for health equity and social responsibility. "This transition marks a significant moment in our community, but I want to make it clear: the quality of care our residents rely on will not be compromised," Alderman Daniel La Spata said. "Prime Healthcare has committed to not only maintaining but enhancing the services at Saint Mary Hospital, ensuring that our neighborhood continues to have access to top-tier medical care. This moment is not just about preserving what we have — it's about building a stronger, more resilient healthcare system for the future." Prime Healthcare has earned a national reputation for turning around financially struggling hospitals and preserving quality healthcare in more than 600 communities across the nation since its founding in 2001. Since 2010, Prime Healthcare has provided more than $14 billion in community benefits and charity care. "As a physician-founded and led health system, our mission is rooted in service, compassion, clinical excellence and a deep commitment to patient-centered care. We are honored to extend our mission to Chicagoland as we uplift communities and preserve access to care," said Kavitha Bhatia, MD, President and Chair of Prime Healthcare Foundation. "We are profoundly grateful to all our staff, physicians, nurses and leaders who make this mission possible, transform lives every day and advance our shared legacy of excellence, innovation and service." As part of the transition, Prime Healthcare has made offers of employment to substantially all associates and has committed $250 million to invest in facility upgrades, capital improvements, substantial technology investments and system upgrades. Prime Healthcare will also maintain charity care programs, preserving the facilities' role in ensuring care for the most vulnerable. Prime Healthcare believes in supporting spiritual and holistic wellness and has gained approval from the Archdiocese of Chicago and the Vatican. These hospitals will continue an affiliation with the Catholic Church and traditions to honor every person's spiritual care. "Prime Healthcare's acquisition of these hospitals will help ensure that our Illinois communities receive the treatment and services they need in a setting that upholds the dignity of the human person. Together, we look forward to maintaining a healthcare environment that not only heals the body but also nourishes the soul," said Deacon Gerald Keenan, Archdiocese of Chicago. With Prime Healthcare's presence in the third largest metropolitan area in the United States, the Chicagoland hospitals and facilities join an award-winning national health system that now includes 51 hospitals, more than 360 outpatient locations, over 10,500 licensed beds, and nearly 57,000 employees and affiliated physicians dedicated to providing the highest quality healthcare. "We all chose healthcare to serve our communities, and I believe the transition to Prime Healthcare for these facilities remains the best possible action for the communities we are privileged to serve and the patients cared for by the dedicated team of associates and physicians," said Polly Davenport, Ascension Illinois Market CEO. The acquisition, which is the largest in the history of Prime Healthcare, features eight acute care hospitals: Holy Family Medical Center (Des Plaines); Mercy Medical Center (Aurora); Resurrection Medical Center (Chicago); Saint Francis Hospital (Evanston); Saint Joseph Medical Center (Joliet); Saint Joseph Hospital (Elgin); St. Mary’s Hospital (Kankakee); and Saint Mary of Nazareth Hospital (Chicago). St. Mary’s Hospital (Kankakee) and Saint Francis Hospital (Evanston) become members of Prime Healthcare Foundation, a 501(c)(3) public charity. The transaction also includes the following post-acute, home health and senior living facilities: Fox Knoll Village (Aurora), Villa Franciscan Place (Joliet), Heritage Village and Heritage Lodge (Kankakee), Resurrection Place (Park Ridge), Rainbow Hospice (Chicago), Ascension at Home Illinois (Joliet) and Ascension at Home Illinois (Kankakee). "This acquisition represents an opportunity for our community to benefit from Prime Healthcare's commitment to compassionate, high-quality care," said Illinois State Representative Eva-Dina Delgado (D-3rd District). "I am looking forward to seeing the positive impact this transition will bring to our neighborhoods, from preserving critical healthcare services to creating new opportunities for healthcare professionals. Prime Healthcare's dedication to investing in our hospitals and ensuring equitable access to care aligns perfectly with our community's needs and aspirations. This is not just a change in ownership; it's a renewed promise to keep our community healthy, thriving, and well-cared for." About Prime Healthcare and Prime Healthcare Foundation: Prime Healthcare is an award-winning health system operating 51 hospitals and more than 360 outpatient locations in 14 states, providing over 2.5 million patient visits annually. It is one of the nation's leading health systems, with nearly 57,000 employees and physicians. Eighteen of the Prime Healthcare hospitals are members of the Prime Healthcare Foundation, a 501(c)(3) not-for-profit public charity. Based in Ontario, California, Prime Healthcare is nationally recognized for award-winning quality care and has been named a 10 Top and 15 Top Health System by Truven Health Analytics. Its hospitals have been named among the nation's "100 Top Hospitals" 69 times and have received more Patient Safety Excellence Awards from Healthgrades than any other health system in the past eight years. To learn more, please visit primehealthcare.com. Find Prime Healthcare on: LinkedIn: linkedin.com/company/prime-healthcare Twitter: twitter.com/_PrimeHealth Facebook: facebook.com/primehealthcare Instagram: instagram.com/prime_healthcare/ Contacts Media Contact: Mark Reece | mreece@primehealthcare.com 916-303-6440 // Add toggle of sharing section var internalToggle = new BWToggle("bw-release-internal", "#bw-release-internal h2", "#bw-internal-content"); internalToggle.set(false);'''
