の他の特別項目や実質的な事象は、発生した期間内でその規模が大きい場合、不定期に非GAAPベースの調整に含まれることがあります。ベイジーンは、非GAAP財務指標で除外される費用の決定、およびそのような指標の使用に関する関連規定、管理、承認の指針となる確立された非GAAPの方針を維持しています。ベイジーンは、これらの非GAAPベースの財務指標をGAAPベースの数値と合わせて考慮することで、ベイジーンの営業成績の全体的な理解を深めることができると考えています。非GAAP財務指標は、投資家の方々にベイジーンの過去の財務結果や傾向、また今後の財務結果や傾向の予想をより完全に理解していただくこと、また、各期間間の比較や予測情報との比較を容易にすることを目的として掲載しています。さらに、これらの非GAAP財務指標は、ベイジーンの経営陣が、事業を計画、予測する目的で、また業績を測定するために使用する指標の一つです。これらの非GAAP財務指標は、GAAPに準拠して計算された財務指標に加えて考慮されるべきであり、GAAPに準拠して計算された財務指標に代わるものでも、GAAPに準拠して計算された財務指標に優るものでもありません。ベイジーンが使用する非GAAP財務指標は、他の企業が使用する非GAAP財務指標とは異なる方法で算出される可能性があり、したがって比較できない可能性があります。 主要なGAAP指標と非GAAP指標との調整表 (単位：千ドル) （未監査） 第4・四半期 通年 2024 2023 2024 2023 GAAP基準から調整後製品売上原価への調整： GAAP基準の製品売上原価 $160,560 $105,832 $594,089 $379,920 差し引き：減価償却費 18,089 1,898 42,707 8,578 差し引き：無形資産償却費 1,183 1,119 4,729 3,739 調整後製品売上原価 $141,288 $102,815 $546,653 $367,603 GAAP基準から調整後研究開発費への調整： GAAP基準の研究開発費 $542,012 $493,987 $1,953,295 $1,778,594 差し引き：株式による報酬費用 44,992 39,424 186,113 163,550 差し引き：減価償却費 22,146 17,180 98,814 56,084 調整後研究開発費 "
