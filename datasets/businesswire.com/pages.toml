e report findings while study participants share personal testimonials of their experience. This work highlights the potential of metabolic interventions for mental health conditions. This video is a product of Metabolic Mind, a nonprofit initiative of Baszucki Group. To learn more about metabolic approaches to mental disorders, including ketogenic therapy, visit Metabolic Mind (metabolicmind.org). New bipolar disorder study shows that a ketogenic diet leads to mental and physical health benefits. Dr. Iain Campbell, PhD, Baszucki Metabolic Psychiatry Research Fellow, shares how his personal experience alleviating bipolar disorder symptoms through ketosis led to the genesis of a pilot trial published this week in BJPsych Open. Dr. Campbell provides a summary of the report findings while study participants share personal testimonials of their experience. This work highlights the potential of metabolic interventions for mental health conditions. This video is a product of Metabolic Mind, a nonprofit initiative of Baszucki Group. To learn more about metabolic approaches to mental disorders, including ketogenic therapy, visit Metabolic Mind (metabolicmind.org). MPEG-4 Video Image Full Size Small Preview Thumbnail February 28, 2025 11:51 AM Eastern Standard Time SAN MATEO, Calif.--(BUSINESS WIRE)--Baszucki Group maakte vandaag een nieuw pilootonderzoek bekend over een ketogeen dieet bij bipolaire stoornis. “Voor het eerst sinds jaren voelde het alsof mijn hersenen eindelijk met de juiste brandstof aan het werk waren,” verklaarde een van de deelnemers aan het onderzoek. De studie, die vandaag in BJPsych Open werd gepubliceerd, is het eerste onderzoek waarin neuro-imaging wordt gebruikt om aan te tonen dat een ketogeen dieet het hersenmetabolisme kan verbeteren bij mensen bij wie een bipolaire stoornis werd vastgesteld. Deze bekendmaking is officieel geldend in de originele brontaal. Vertalingen zijn slechts als leeshulp bedoeld en moeten worden vergeleken met de tekst in de brontaal, die als enige rechtsgeldig is. Contacts Colby Zintl colby@baszuckigroup.org // Add toggle of sharing section var internalToggle = new BWToggle("bw-release-internal", "#bw-release-internal h2", "#bw-internal-content"); internalToggle.set(false);'''
