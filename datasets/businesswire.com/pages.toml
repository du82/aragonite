title = "BeiGene anuncia resultados financieros y actualizaciones comerciales del cuarto trimestre y del año completo de 2024 | Business Wire"
description = "BeiGene, Ltd. (NASDAQ: ONC; HKEX: 06160; SSE: 688235), una compañía global de oncología que tiene la intención de cambiar su nombre a BeOne Medicines"
full_description = 'BeiGene anuncia resultados financieros y actualizaciones comerciales del cuarto trimestre y del año completo de 2024 Ingresos globales totales de $1.1 mil millones y $3.8 mil millones para el cuarto trimestre y el año completo, aumentos del 78% y 55%, respectivamente; pérdida operativa GAAP reducida e ingreso operativo no GAAP positivo para todo el año Ingresos globales de BRUKINSA de $828 millones y $2.6 mil millones para el cuarto trimestre y el año completo, aumentos del 100% y 105%, respectivamente; avances en los programas de etapa fundamental para el inhibidor de BCL2 sonrotoclax y el CDAC BTK BGB-16673 Se introdujeron seis y trece nuevas entidades moleculares (NME) en la práctica clínica en el cuarto trimestre y en el año completo, respectivamente; se prevén múltiples resultados de los programas innovadores de tumores sólidos en el primer semestre de 2025 La previsión de ingresos para todo el año 2025 de 4.900 millones a 5.300 millones de dólares reafirma los ingresos operativos GAAP positivos previstos y la generación de flujo de efectivo de las operaciones en 2025 Download Image Full Size Small Preview Thumbnail (Graphic: Business Wire) (Graphic: Business Wire) Image Full Size Small Preview Thumbnail Image Full Size Small Preview Thumbnail March 01, 2025 08:05 PM Eastern Standard Time SAN MATEO, California--(BUSINESS WIRE)--BeiGene, Ltd. (NASDAQ: ONC; HKEX: 06160; SSE: 688235), una compañía global de oncología que tiene la intención de cambiar su nombre a BeOne Medicines Ltd., anunció hoy los resultados financieros y actualizaciones corporativas del cuarto trimestre y del año completo de 2024. “Nuestros resultados del cuarto trimestre y del año completo demuestran nuestro tremendo crecimiento como potencia mundial en oncología, reforzado por el éxito continuo de BRUKINSA y el desarrollo de una de las líneas de investigación en tumores sólidos más prolíficas en oncología, con múltiples lecturas de datos previstas para este año”, dijo John V. Oyler, cofundador, presidente y director ejecutivo de BeiGene. “BRUKINSA es ahora el líder inequívoco en nuevos inicios de tratamiento para pacientes con LLC en los EE. UU., tiene la etiqueta más amplia de todos los inhibidores de BTK y sirve como piedra angular de nuestra franquicia de hematología, mostrando una inmensa promesa como columna vertebral junto con nuestro inhibidor de BCL2 en etapa avanzada, sonrotoclax, y nuestro potencial CDAC BTK de primera clase. También estamos construyendo futuras franquicias de tumores sólidos en cánceres de mama, pulmón y gastrointestinales aprovechando nuestras plataformas en anticuerpos multiespecíficos, degradadores de proteínas y conjugados anticuerpo-fármaco. “El año 2025 marca un punto de inflexión, ya que anticipamos lograr un ingreso operativo y un flujo de efectivo operativo GAAP positivos junto con nuestra intención de cambiar nuestro nombre a BeOne con nuestro nuevo símbolo NASDAQ, ONC." Panorama financiero del cuarto trimestre y del año completo de 2024 (Cantidades en miles de dólares estadounidenses y no auditadas) Cuarto trimestre Año completo 2024 2023 % Cambio 2024 2023 % Cambio Ingresos netos por productos $ 1,118,035 $ 630,526 77 % $ 3,779,546 $ 2,189,852 73 % Ingresos netos por colaboraciones $ 9,789 $ 3,883 152 % $ 30,695 $ 268,927 (89 )% Ingresos totales $ 1,127,824 $ 634,409 78 % $ 3,810,241 $ 2,458,779 55 % Pérdidas GAAP derivadas de las operaciones $ (79,425 ) $ (383,795 ) (79 )% $ (568,199 ) $ (1,207,736 ) (53 )% Ingresos (pérdidas) operativos ajustados* $ 78,603 $ (267,224 ) 129 % $ 45,356 $ (752,473 ) 106 % * Para obtener una explicación de nuestro uso de medidas financieras no GAAP, consulte la sección "Nota sobre el uso de medidas financieras no GAAP" más adelante en este comunicado de prensa y para una conciliación de cada medida financiera no GAAP con las medidas GAAP más comparables, consulte la tabla al final de este comunicado de prensa. Actualizaciones comerciales clave BRUKINSA® (zanubrutinib) es un inhibidor de BTK de molécula pequeña disponible por vía oral diseñado para proporcionar una inhibición completa y sostenida de la proteína BTK mediante la optimización de la biodisponibilidad, la semivida y la selectividad. Con una farmacocinética diferenciada en comparación con otros inhibidores de BTK aprobados, se ha demostrado que BRUKINSA inhibe la proliferación de células B malignas en una serie de tejidos relevantes para la enfermedad. BRUKINSA tiene la etiqueta más amplia a nivel mundial de todos los inhibidores de BTK y es el único inhibidor de BTK que proporciona la flexibilidad de una o dos dosis diarias. El programa de desarrollo clínico de BRUKINSA incluye aproximadamente 7100 pacientes inscritos hasta la fecha en más de 30 países y regiones en más de 35 ensayos. BRUKINSA está aprobado en más de 70 mercados y se han tratado a más de 180 000 pacientes en todo el mundo. Las ventas de BRUKINSA en EE. UU. totalizaron $616 millones y $2.000 millones en el cuarto trimestre y el año completo de 2024, lo que representa un crecimiento del 97% y 106%, respectivamente, en comparación con los períodos del año anterior, y más del 60% del crecimiento de la demanda trimestre a trimestre provino de un uso ampliado en leucemia linfocítica crónica (LLC), ya que BRUKINSA continuó ganando participación como líder en nuevos inicios de pacientes en EE. UU. en LLC y todas las demás indicaciones aprobadas; Las ventas de BRUKINSA en Europa totalizaron $113 millones y $359 millones en el cuarto trimestre y el año completo de 2024, lo que representa un crecimiento del 148% y 194%, respectivamente, en comparación con los períodos del año anterior, impulsado por una mayor participación de mercado en todos los mercados principales, incluidos Alemania, Italia, España, Francia y el Reino Unido; y Celebró un acuerdo de resolución de litigio de patentes con MSN Pharmaceuticals, Inc. y MSN Laboratories Private Ltd. otorgando a MSN el derecho de vender una versión genérica de BRUKINSA en los EE. UU. no antes del 15 de junio de 2037, sujeto a una posible aceleración o extensión en circunstancias habituales para acuerdos de este tipo. TEVIMBRA® (tislelizumab) es un anticuerpo monoclonal anti-proteína de muerte celular programada 1 (PD-1) de inmunoglobulina G4 (IgG4) humanizada de diseño exclusivo con alta afinidad y especificidad de unión contra PD-1; está diseñado para minimizar la unión a los receptores Fc-gamma (Fcγ) en los macrófagos, lo que ayuda a las células inmunitarias del cuerpo a detectar y combatir los tumores. TEVIMBRA es el activo fundamental de la cartera de tumores sólidos de BeiGene y ha demostrado potencial en múltiples tipos de tumores y entornos de enfermedad. El programa de desarrollo clínico de TEVIMBRA incluye casi 14.000 pacientes inscritos hasta la fecha en 35 condados y regiones en 70 ensayos, incluidos 21 estudios que permiten el registro. TEVIMBRA está aprobado en 45 mercados y más de 1,3 millones de pacientes han sido tratados en todo el mundo. Las ventas de tislelizumab totalizaron $154 millones y $621 millones en el cuarto trimestre y el año completo de 2024, lo que representa un crecimiento del 20% y el 16%, respectivamente, en comparación con los períodos del año anterior; Recibió la aprobación de la Administración de Alimentos y Medicamentos de los EE. UU. (FDA) en combinación con quimioterapia basada en platino y fluoropirimidina para el tratamiento de primera línea del adenocarcinoma gástrico o de la unión gastroesofágica HER2-negativo irresecable o metastásico en adultos cuyos tumores expresan PD-L1 (≥1); y Recibió la aprobación de la Comisión Europea (CE) en combinación con quimioterapia para el tratamiento de primera línea del carcinoma de células escamosas de esófago y del adenocarcinoma gástrico o de la unión gastroesofágica. Aspectos destacados del proyecto La estrategia de cartera de BeiGene pone énfasis en la generación rápida de datos de prueba de concepto clínicos en etapa temprana, gracias a su enfoque de operaciones de desarrollo global con ventajas de velocidad y costo (“Fast to Proof of Concept”). El equipo de investigación y desarrollo global interno de la empresa, que incluye operaciones y desarrollo clínicos, está compuesto por casi 3700 colegas que realizan ensayos en seis continentes y se esfuerzan por garantizar una calidad rigurosa de los datos mediante colaboraciones con reguladores e investigadores en más de 45 países. Este enfoque estratégico maximiza los recursos al canalizar las inversiones controladas por datos hacia los candidatos clínicamente diferenciados más prometedores de manera rápida y restar prioridad a otros. Con uno de los equipos de investigación oncológica más grandes de la industria, BeiGene ha demostrado fortalezas en el descubrimiento de moléculas pequeñas y productos biológicos traslacionales, incluidas tres tecnologías de plataforma: anticuerpos multiespecíficos, compuestos de activación de degradación quimérica (CDAC) y conjugados anticuerpo-fármaco (ADC). Hematología BRUKINSA En la reunión anual de la Sociedad Estadounidense de Hematología (ASH), se presentó un seguimiento de 5 años del estudio SEQUOIA; con ajuste por el impacto de COVID-19, el estudio demostró que el tratamiento con BRUKINSA redujo el riesgo de progresión o muerte en un 75% en comparación con bendamustina-rituximab en pacientes con LLC sin tratamiento previo (TN); Se prevé que la formulación en comprimidos de BRUKINSA reciba la aprobación de la FDA y la CE en la segunda mitad de 2025; Prever un análisis provisional de supervivencia libre de progresión para el estudio MANGROVE de fase 3 en linfoma de células del manto (MCL) TN en la segunda mitad de 2025; y Se prevé completar la inscripción para la parte de linfoma folicular recidivante/refractario (R/R) del estudio de fase 3 MAHOGANY en la segunda mitad de 2025. Sonrotoclax (inhibidor de BCL2) Lecturas de datos planificadas en los ensayos de fase 2 de R/R CLL y R/R MCL y posibles presentaciones de aprobación acelerada en la segunda mitad de 2025; En ASH, se presentaron datos de la cohorte de expansión de 320 mg de un estudio de fase 1/1b con una mediana de seguimiento de 1,5 años que no demostró progresión en pacientes con LLC TN en combinación con BRUKINSA; Más de 1.800 pacientes inscritos hasta la fecha en todo el programa; Se completó la inscripción en el estudio de fase 3 CELESTIAL en LLC TN; Se prevé inscribir a los primeros sujetos en ensayos globales de Fase 3 en LLC R/R y LCM R/R en la primera mitad de 2025; y Continúa la inscripción en el ensayo global de fase 2 sobre la macroglobulinemia de Waldenström. BGB-16673 (BTK CDAC) Continuación de la inscripción potencial para el estudio de fase 2 de LLC R/R, con lectura de datos prevista para 2026; Más de 500 pacientes inscritos hasta la fecha en todo el programa; Anticipar el inicio del ensayo de fase 3 en LLC R/R en comparación con la elección del médico en la primera mitad de 2025; y Se anticipa el inicio del ensayo comparativo de fase 3 contra el inhibidor no covalente de BTK pirtobrutinib en LLC R/R en la segunda mitad de 2025. Tumores sólidos Se anticipan lecturas de datos para BGB-43395 (inhibidor de CDK4), BG-68501 (inhibidor de CDK2) y BG-C9074 (ADC B7H4) en la primera mitad de 2025, y datos internos de prueba de concepto para BG-60366 (EGFR CDAC), BGB-53038 (inhibidor de panKRAS), BG-C137 (ADC FGFR2b), BGB-C354 (ADC B7H3) y BG-C477 (ADC CEA) en la segunda mitad de 2025. Cáncer de pulmón Tarlatamab (AMG757, DLL3xCD3 BiTE): se prevé la lectura de datos del estudio de fase 3 en cáncer de pulmón de células pequeñas de segunda línea en la primera mitad de 2025; Advan-TIG-302 (anticuerpo TIGIT): se anticipa la lectura de datos provisionales del estudio de fase 3 en cáncer de pulmón de células no pequeñas con PD(L)1 alto de primera línea en la segunda mitad de 2025; BG-60366 (EGFR CDAC): ingresado en la clínica en el cuarto trimestre de 2024; mecanismo degradador diferenciado para abolir por completo la señalización de EGFR; altamente potente en mutaciones de EGFR sensibles y resistentes a osimertinib; sólidos datos de eficacia preclínica con dosificación oral y diaria; BG-89894 (inhibidor de MAT2A): entró en aumento de dosis en el cuarto trimestre de 2024; posibles características mejores en su clase con potencia superior y penetración cerebral; fuerte sinergia entre PRMT5i y MAT2Ai en modelos preclínicos; BGB-58067 (inhibidor de PRMT5 cooperativo con MTA): se introdujo en la clínica a principios de enero de 2025; potencial de primera clase con alta potencia, selectividad y penetrabilidad cerebral; y BG-T187 (anticuerpo triespecífico EGFR x MET): aumento de dosis iniciado en el cuarto trimestre de 2024; diseño biparatópico MET diferenciado con actividad inhibidora de MET óptima para buscar la mejor oportunidad en su clase. Cáncer de mama y ginecológico BGB-43395 (inhibidor de CDK4): aumento continuo de la dosis en monoterapia y en combinación con fulvestrant y letrozol en el rango de dosis eficaz previsto; más de 180 pacientes inscritos hasta la fecha y prueba de concepto prevista para la primera mitad de 2025; planificación en marcha para ensayo de fase 3 en cáncer de mama metastásico HR+/HER2- de segunda línea en combinación con terapia endocrina; y BG-68501 (inhibidor de CDK2) y BG-C9074 (ADC B7H4): aumento continuo de la dosis de monoterapia; más de 50 pacientes y más de 70 pacientes inscritos hasta la fecha, respectivamente. Cánceres gastrointestinales Zanidatamab (anticuerpo biespecífico HER2) en combinación con tislelizumab y quimioterapia: se prevé la lectura de los datos primarios de SSP del estudio de fase 3 en adenocarcinoma gastroesofágico HER2-positivo de primera línea en la segunda mitad de 2025; y Los NME avanzaron hacia la clínica en el cuarto trimestre de 2024: BGB-53038 (inhibidor de panKRAS): altamente potente y selectivo con amplia actividad contra mutaciones de KRAS en múltiples tipos de tumores; limita la toxicidad al preservar otras proteínas RAS; las mutaciones de KRAS están presentes en el 19 por ciento de los cánceres; y BG-C137 (ADC FGFR2b): posible primer ADC de su clase para un objetivo validado en cánceres gastrointestinales superiores y de mama; posible eficacia superior en comparación con el anticuerpo monoclonal líder en modelos de expresión alta y media. Inflamación e inmunología BGB-45035 (IRAK4 CDAC): actualmente en aumento de dosis en cohortes SAD y MAD con más de 130 sujetos inscritos; degradador potente y selectivo que se dirige tanto a las funciones de quinasa como de andamiaje de IRAK4 para una degradación completa del objetivo; estudio de fase 2 planificado para 2025; prueba de concepto para la degradación de IRAK4 en tejidos en la segunda mitad de 2025. Actualizaciones corporativas Anunció la intención de cambiar el nombre de la Compañía a BeOne Medicines, pendiente de la aprobación de los accionistas; el nuevo nombre refleja el compromiso de la Compañía de desarrollar medicamentos innovadores para eliminar el cáncer asociá'
