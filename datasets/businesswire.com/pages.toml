title = "新たな双極性障害研究により、ケトジェニック食が精神的および身体的健康に有益であることが判明 | Business Wire"
description = "New bipolar disorder study shows that a ketogenic diet leads to mental and physical health benefits. Dr. Iain Campbell, PhD, Baszucki Metabolic Psychiatry Research Fellow, shares how his personal experience alleviating bipolar disorder symptoms through ketosis led to the genesis of a pilot trial published this week in BJPsych Open. Dr. Campbell provides a summary of the report findings while study participants share personal testimonials of their experience. This work highlights the potential of metabolic interventions for mental health conditions. This video is a product of Metabolic Mind, a nonprofit initiative of Baszucki Group. To learn more about metabolic approaches to mental disorders, including ketogenic therapy, visit Metabolic Mind (metabolicmind.org)."
full_description = '''新たな双極性障害研究により、ケトジェニック食が精神的および身体的健康に有益であることが判明 欧州初のパイロット研究が気分、エネルギー、不安の改善を示し、新たな精神健康治療の可能性に期待 Download MPEG-4 Video Loading media player... jQuery(function() { //create video element var attributes = { 'id': 'news_video', 'class': 'video-js vjs-default-skin', 'width': '640', 'data-height': '264', 'onloadstart': 'this.volume=0.4' } var element = $('<video/>').attr(attributes); $('#media-player').html(element); //Social share var shareOptions = { socials: ['fbFeed', 'tw', 'linkedin', 'mail'], url: window.location.href, title: '\u65B0\u305F\u306A\u53CC\u6975\u6027\u969C\u5BB3\u7814\u7A76\u306B\u3088\u308A\u3001\u30B1\u30C8\u30B8\u30A7\u30CB\u30C3\u30AF\u98DF\u304C\u7CBE\u795E\u7684\u304A\u3088\u3073\u8EAB\u4F53\u7684\u5065\u5EB7\u306B\u6709\u76CA\u3067\u3042\u308B\u3053\u3068\u304C\u5224\u660E', description: 'BusinessWire news share', image: 'https://mms.businesswire.com/media/20250211020119/ja/2377556/5/2024_11_11_Edinburgh_Landscape_Video_CC.jpg', // required for Facebook and Messenger fbAppId: '140586622674265', // optional for Facebook redirectUri: window.location.href + '#close', } //activate Video.JS theme videojs('news_video', { controls: true, autoplay: false, preload: 'auto', poster: 'https://mms.businesswire.com/media/20250211020119/ja/2377556/5/2024_11_11_Edinburgh_Landscape_Video_CC.jpg', sources: [ {src: "https://mms.businesswire.com/media/20250211020119/ja/2377556/19/2024_11_11_Edinburgh_Landscape_Video_CC.mp4&.mp4?download=1", type: "video/mp4"} ] }).share(shareOptions); }); New bipolar disorder study shows that a ketogenic diet leads to mental and physical health benefits. Dr. Iain Campbell, PhD, Baszucki Metabolic Psychiatry Research Fellow, shares how his personal experience alleviating bipolar disorder symptoms through ketosis led to the genesis of a pilot trial published this week in BJPsych Open. Dr. Campbell provides a summary of the report findings while study participants share personal testimonials of their experience. This work highlights the potential of metabolic interventions for mental health conditions. This video is a product of Metabolic Mind, a nonprofit initiative of Baszucki Group. To learn more about metabolic approaches to mental disorders, including ketogenic therapy, visit Metabolic Mind (metabolicmind.org). New bipolar disorder study shows that a ketogenic diet leads to mental and physical health benefits. Dr. Iain Campbell, PhD, Baszucki Metabolic Psychiatry Research Fellow, shares how his personal experience alleviating bipolar disorder symptoms through ketosis led to the genesis of a pilot trial published this week in BJPsych Open. Dr. Campbell provides a summary of the report findings while study participants share personal testimonials of their experience. This work highlights the potential of metabolic interventions for mental health conditions. This video is a product of Metabolic Mind, a nonprofit initiative of Baszucki Group. To learn more about metabolic approaches to mental disorders, including ketogenic therapy, visit Metabolic Mind (metabolicmind.org). MPEG-4 Video Image Full Size Small Preview Thumbnail February 28, 2025 11:53 AM Eastern Standard Time サンマテオ、カリフォルニア州--(BUSINESS WIRE)--（ビジネスワイヤ） -- Baszucki Groupは本日、双極性障害におけるケトジェニック食の新たなパイロット研究を発表しました。「何年かぶりに、自分の脳がようやく正しい燃料で動いていると感じました」と、研究参加者の一人は語っています。本研究は『 BJPsych Open』 に掲載され、神経画像技術を活用してケトジェニック食が双極性障害の脳代謝を改善する可能性を示した初の研究です。ケトジェニック食は100年以上にわたりてんかんの治療効果が確認されており、現在、様々な精神疾患や神経疾患に対する研究が世界的に進められています。 Baszucki Groupの支援を受けた欧州初の本研究では、磁気共鳴分光法（MRS）を含む高度な脳画像技術を用いて脳代謝の変化を測定しました。その結果、双極性障害で通常増加する興奮性神経伝達物質の減少が確認され、ケトジェニック食の有効性のメカニズムが示唆されました。また、日々の評価を行った一部の参加者では、ケトン体レベルの上昇が症状の改善と相関していることが示されました。本パイロット試験は、新たな研究の方向性を示し、この深刻な精神疾患を持つ人々に革新的な治療法への希望をもたらします。 エディンバラ大学のイアン・キャンベル博士（Baszucki代謝精神医学研究フェロー）、ダニエル・スミス医学博士（FRCPsych、精神医学部長）、およびハリー・キャンベル医学博士（FRSE、FMedSci）の共同主導のもと、双極性障害の27名を対象に、6～8週間のケトジェニック食のパイロット試験を実施しました。そのうち20名が試験を完了し、この食事法が安全で耐容性のあるものであることを示しました。参加者の91%が血中ケトン体の陽性反応を示し、信頼性の高い日々のケトン体および精神健康データを提供した参加者では、ケトン体レベルの上昇が気分、やる気、衝動性、不安の改善と相関していることが確認されました。一部の参加者は、この食事法が「人生を変えた」と述べています。 「ケトジェニック食は私に命綱を与え、やる気と希望を取り戻してくれました」と、ある研究参加者は述べました。「双極性障害の症状を管理するだけでなく、心を癒しているように感じました。新たな可能性と明るい未来を開いてくれました。」 「ケトジェニック食は、まるで私の心に温かいお風呂を与えるようなものです」と別の参加者は語りました。「神経質な感覚がなくなり、落ち着き、頭がすっきりと働くようになりました。」 また、代謝機能の指標も改善しました。20名中19名が平均4.2kg（9.3ポンド）の体重減少を達成し、BMIや血圧の改善が見られました。これらの結果は、ケトジェニック食が双極性障害およびその薬物療法に伴う代謝健康リスクを軽減し、寿命短縮のリスクを緩和する可能性を示唆しています。 「前帯状皮質および後帯状皮質という双極性障害に関与する2つの主要な脳領域において、興奮毒性の減少を示すマーカーが観察されました。また、後帯状皮質において、リチウムおよびインスリンシグナル伝達に関連するマーカーにも影響が確認されました」と、双極性障害を抱えながら自身もケトジェニック食を実践するイアン・キャンベル博士は述べています。「これらの結果は、双極性障害に対する補助的な代謝介入としてのケトジェニック食の可能性を示唆する、限られたが成長しつつある証拠の一部です。今後、大規模な追試研究や慎重に設計された無作為化臨床試験の実施が急務となります。」 これらの変化は、キャンベル博士らが提唱する「代謝過駆動仮説」と一致しており、この仮説ではエネルギーの調節異常が双極性障害の根本的なメカニズムであり、その修正がケトジェニック食療法の鍵となる可能性を指摘しています。 精神健康の新たなフロンティア 本パイロット研究は、エディンバラ大学におけるより大規模な研究の基盤となりました。この研究は、英国UKRI医療研究評議会の競争的研究助成金により設立された欧州初の「代謝精神医学ハブ」によって支えられています。Baszucki Groupも資金提供したこのハブには、100名以上の科学者が集い、代謝と精神健康の関係性を加速的に研究しています。その焦点は、ケトジェニック療法やその他の代謝介入を重症精神疾患の治療法として探求することにあります。 本研究は、最近発表されたもう一つのパイロット試験に続くものであり、ケトジェニック療法が代謝および精神健康マーカーの両方を改善する可能性があることを示しました。最初の試験はスタンフォード大学で実施され、Baszucki Groupが資金提供し、ケトジェニック食による全身の代謝変化が重症精神疾患の安定化に寄与する可能性を示唆しました。 「本試験は、重症精神疾患の標準治療としてケトジェニック療法を確立するための重要な一歩です」と、Baszucki Groupの共同創設者兼社長であるジャン・エリソン・バスズッキは述べました。「私たちはこの研究を支援できたことを誇りに思い、継続的な研究によって、私たちの息子の命を救った代謝制御の仕組みへの理解を深められることを期待しています。」 代謝機能と脳健康の密接な関係に対する認識が高まる中、本研究は精神疾患の理解と治療に向けた神経代謝的アプローチを推進する世界的な科学運動を前進させます。 Baszucki Groupについて 2021年にRobloxの創設者兼CEOであるデビッド・バスズッキとベストセラー作家のジャン・エリソン・バスズッキによって設立されたBaszucki Groupは、民間寄付、インパクト投資、アドボカシー、ストーリーテリング、コミュニティ構築を活用し、社会変革を推進しています。Baszucki Groupの主要目的の一つは、代謝、精神医学、神経科学の交差点にある取り組みを支援することで、精神健康の結果を変革することです。精神障害に対する代謝アプローチやケトジェニック療法の詳細については、Baszucki Groupの非営利イニシアチブであるMetabolic Mindをご覧ください。 本記者発表文の公式バージョンはオリジナル言語版です。翻訳言語版は、読者の便宜を図る目的で提供されたものであり、法的効力を持ちません。翻訳言語版を資料としてご利用になる際には、法的効力を有する唯一のバージョンであるオリジナル言語版と照らし合わせて頂くようお願い致します。 Contacts Colby Zintl colby@baszuckigroup.org // Add toggle of sharing section var internalToggle = new BWToggle("bw-release-internal", "#bw-release-internal h2", "#bw-internal-content"); internalToggle.set(false);'''
