title = "Neue Studie zur bipolaren Störung zeigt, dass eine ketogene Ernährung zu Vorteilen für die psychische und physische Gesundheit führt | Business Wire"
description = "New bipolar disorder study shows that a ketogenic diet leads to mental and physical health benefits. Dr. Iain Campbell, PhD, Baszucki Metabolic Psychiatry Research Fellow, shares how his personal experience alleviating bipolar disorder symptoms through ketosis led to the genesis of a pilot trial published this week in BJPsych Open. Dr. Campbell provides a summary of the report findings while study participants share personal testimonials of their experience. This work highlights the potential of metabolic interventions for mental health conditions. This video is a product of Metabolic Mind, a nonprofit initiative of Baszucki Group. To learn more about metabolic approaches to mental disorders, including ketogenic therapy, visit Metabolic Mind (metabolicmind.org)."
full_description = '''Neue Studie zur bipolaren Störung zeigt, dass eine ketogene Ernährung zu Vorteilen für die psychische und physische Gesundheit führt Erste europäische Pilotstudie dieser Art zeigt Verbesserung von Stimmung, Energie und Angst – Hoffnung auf neue Behandlung von psychischen Erkrankungen Download MPEG-4 Video Loading media player... jQuery(function() { //create video element var attributes = { 'id': 'news_video', 'class': 'video-js vjs-default-skin', 'width': '640', 'data-height': '264', 'onloadstart': 'this.volume=0.4' } var element = $('<video/>').attr(attributes); $('#media-player').html(element); //Social share var shareOptions = { socials: ['fbFeed', 'tw', 'linkedin', 'mail'], url: window.location.href, title: 'Neue Studie zur bipolaren St\u00F6rung zeigt, dass eine ketogene Ern\u00E4hrung zu Vorteilen f\u00FCr die psychische und physische Gesundheit f\u00FChrt', description: 'BusinessWire news share', image: 'https://mms.businesswire.com/media/20250211661273/de/2377556/5/2024_11_11_Edinburgh_Landscape_Video_CC.jpg', // required for Facebook and Messenger fbAppId: '140586622674265', // optional for Facebook redirectUri: window.location.href + '#close', } //activate Video.JS theme videojs('news_video', { controls: true, autoplay: false, preload: 'auto', poster: 'https://mms.businesswire.com/media/20250211661273/de/2377556/5/2024_11_11_Edinburgh_Landscape_Video_CC.jpg', sources: [ {src: "https://mms.businesswire.com/media/20250211661273/de/2377556/19/2024_11_11_Edinburgh_Landscape_Video_CC.mp4&.mp4?download=1", type: "video/mp4"} ] }).share(shareOptions); }); New bipolar disorder study shows that a ketogenic diet leads to mental and physical health benefits. Dr. Iain Campbell, PhD, Baszucki Metabolic Psychiatry Research Fellow, shares how his personal experience alleviating bipolar disorder symptoms through ketosis led to the genesis of a pilot trial published this week in BJPsych Open. Dr. Campbell provides a summary of the report findings while study participants share personal testimonials of their experience. This work highlights the potential of metabolic interventions for mental health conditions. This video is a product of Metabolic Mind, a nonprofit initiative of Baszucki Group. To learn more about metabolic approaches to mental disorders, including ketogenic therapy, visit Metabolic Mind (metabolicmind.org). New bipolar disorder study shows that a ketogenic diet leads to mental and physical health benefits. Dr. Iain Campbell, PhD, Baszucki Metabolic Psychiatry Research Fellow, shares how his personal experience alleviating bipolar disorder symptoms through ketosis led to the genesis of a pilot trial published this week in BJPsych Open. Dr. Campbell provides a summary of the report findings while study participants share personal testimonials of their experience. This work highlights the potential of metabolic interventions for mental health conditions. This video is a product of Metabolic Mind, a nonprofit initiative of Baszucki Group. To learn more about metabolic approaches to mental disorders, including ketogenic therapy, visit Metabolic Mind (metabolicmind.org). MPEG-4 Video Image Full Size Small Preview Thumbnail February 28, 2025 11:49 AM Eastern Standard Time SAN MATEO, Kalifornien--(BUSINESS WIRE)--Die Baszucki Group kündigte heute eine neue Pilotstudie über eine ketogene Diät bei bipolarer Störung an. „Zum ersten Mal seit Jahren hatte ich das Gefühl, dass mein Gehirn endlich mit dem richtigen Treibstoff versorgt wird“, sagte einer der Studienteilnehmer. Die heute in BJPsych Open veröffentlichte Studie ist die erste, die mithilfe von Neuroimaging nachweist, dass eine ketogene Diät den Gehirnstoffwechsel bei Personen mit einer diagnostizierten bipolaren Störung verbessern kann. Die ketogene Diät hat sich seit über 100 Jahren bei Epilepsie bewährt und wird nun weltweit bei einer Vielzahl von psychiatrischen und neurologischen Erkrankungen untersucht. Diese europaweit erste Studie dieser Art, die von der Baszucki Group unterstützt wurde, nutzte fortschrittliche bildgebende Verfahren, darunter die Magnetresonanzspektroskopie (MRS), um Veränderungen im Gehirnstoffwechsel zu messen. Die Bildgebung zeigte eine Verringerung der exzitatorischen Neurotransmitter, die bei bipolaren Störungen typischerweise erhöht sind, was auf einen möglichen Mechanismus für die Wirksamkeit einer ketogenen Diät hindeutet. Die Studie zeigte auch, dass der Ketonspiegel mit der Verbesserung der Symptome bei einer Untergruppe von Personen korrelierte, die tägliche Bewertungen abgaben. Dieser Pilotversuch weist auf eine wichtige neue Richtung für die Forschung hin und gibt Hoffnung auf innovative Behandlungsmöglichkeiten für Menschen, die mit dieser schweren psychischen Erkrankung leben. Unter der gemeinsamen Leitung der Wissenschaftler der Universität Edinburgh, Iain Campbell, PhD Baszucki Metabolic Psychiatry Research Fellow, Daniel Smith, MD, FRCPsych, Chair of Psychiatry, und Harry Campbell, MD, FRSE, FMedSci, nahmen 27 Teilnehmer mit einer bipolaren Störung in eine 6- bis 8-wöchige Pilotstudie zu einer ketogenen Diät auf. Zwanzig Teilnehmer schlossen die Studie ab, was zeigt, dass die Intervention in dieser Population sicher und verträglich war. Die meisten erreichten und hielten die Ketose aufrecht, wobei 91 % der Messwerte positiv für Blutketone waren. Bei den Teilnehmern, die täglich zuverlässige Daten zu Ketonwerten und psychischer Gesundheit zur Verfügung stellten, korrelierte ein erhöhter Ketonspiegel mit Verbesserungen der Stimmung, Energie, Impulsivität und Angst, wobei einige die Intervention als lebensverändernd beschrieben. „Eine ketogene Diät hat mir einen Rettungsanker geboten und mir meine Energie und Hoffnung zurückgegeben“, sagte ein Studienteilnehmer. „Ich hatte das Gefühl, dass ich endlich meinen Geist heilen konnte und nicht nur meine bipolaren Symptome in den Griff bekam. Es hat mir neue Möglichkeiten und eine bessere Zukunft eröffnet.“ „Eine ketogene Diät ist wie ein warmes Bad für meinen Geist“, sagte ein anderer Teilnehmer. „Die Nervosität ist verflogen. Ich bin ruhiger, klarer und mein Gehirn funktioniert wieder.“ Auch die Marker der Stoffwechselfunktion verbesserten sich. Neunzehn von zwanzig Teilnehmern nahmen durchschnittlich 4,2 kg ab und verzeichneten Verbesserungen beim Body-Mass-Index (BMI) und beim Blutdruck. Diese Ergebnisse deuten darauf hin, dass eine ketogene Ernährung dazu beitragen kann, die mit einer bipolaren Störung und ihren pharmakologischen Behandlungen verbundenen allgemeinen Risiken für die Stoffwechselgesundheit zu mindern, die zu einer verkürzten Lebenserwartung führen können. „Wir beobachteten Anzeichen einer verringerten Exzitotoxizität in zwei wichtigen Hirnarealen: dem anterioren und posterioren cingulären Cortex – beide sind an bipolaren Störungen beteiligt. Wir beobachteten auch Auswirkungen auf einen Marker, der mit der Lithium- und Insulin-Signalübertragung im hinteren cingulären Cortex in Verbindung gebracht wurde“, sagte Dr. Iain Campbell, der ebenfalls mit der Störung lebt und eine ketogene Diät befolgt, um seine Symptome zu lindern. „Diese Ergebnisse ergänzen eine kleine, aber wachsende Zahl von Belegen, die darauf hindeuten, dass eine ketogene Diät eine wirksame zusätzliche Stoffwechselintervention bei bipolaren Störungen sein könnte. Es besteht ein dringender Bedarf an größeren Replikationsstudien und sorgfältig konzipierten randomisierten klinischen Studien, um auf diesen Erkenntnissen aufzubauen.“ Diese Veränderungen stehen im Einklang mit der von den Doktoren Campbell aufgestellten metabolischen Überlastungshypothese, einer Theorie, die besagt, dass eine Energiedysregulation für den Mechanismus der bipolaren Störung von zentraler Bedeutung ist und dass die Behandlung dieser Dysregulation der Schlüssel zum Erfolg einer ketogenen Diättherapie sein könnte. Eine neue Grenze der psychischen Gesundheit Diese Pilotstudie ebnete den Weg für eine breitere Initiative an der Universität Edinburgh, die durch ein wettbewerbsorientiertes Forschungsstipendium des UKRI Medical Research Council ermöglicht wurde, das den ersten europäischen Metabolic Psychiatry Hub gründete. Das Zentrum, zu dem auch die Baszucki Group finanziell beigetragen hat, ist eine Zusammenarbeit von über 100 Wissenschaftlern, die sich der Beschleunigung der Forschung über die Zusammenhänge zwischen Stoffwechsel und psychischer Gesundheit verschrieben haben. Der Schwerpunkt liegt auf der Erforschung des Potenzials der ketogenen Therapie und anderer metabolischer Interventionen zur Behandlung schwerer psychischer Erkrankungen. Diese Studie ist die zweite kürzlich veröffentlichte Pilotstudie, die die Sicherheit und potenzielle Wirksamkeit der ketogenen Therapie bei der Verbesserung sowohl der metabolischen als auch der psychischen Gesundheitsmarker bei schweren psychischen Erkrankungen nachweist. Die erste Studie, die ebenfalls von der Baszucki Group finanziert wurde, wurde an der Stanford University durchgeführt und deutete ebenfalls darauf hin, dass systemische Stoffwechselveränderungen durch eine ketogene Ernährung dazu beitragen können, das Gehirn bei schweren psychischen Erkrankungen zu stabilisieren. „Diese Studie ist ein weiterer wichtiger Schritt, um die ketogene Therapie als Standardbehandlung für schwere psychische Erkrankungen zu etablieren“, sagte Jan Ellison Baszucki, Mitbegründer und President der Baszucki Group. „Wir sind stolz darauf, diese Forschung unterstützt zu haben, und hoffen weiterhin, dass die laufenden Studien unser Verständnis der Stoffwechselintervention, die das Leben unseres Sohnes gerettet hat, weiter verbessern werden.“ Da das Bewusstsein für die tiefe Verbindung zwischen Stoffwechselfunktion und Gehirngesundheit wächst, treibt diese Studie die globale wissenschaftliche Bewegung in Richtung neurometabolischer Ansätze zum Verständnis und zur Behandlung psychischer Erkrankungen voran. Über die Baszucki Group Die 2021 vom Roblox-Gründer und Chief Executive Officer David Baszucki und der Bestsellerautorin Jan Ellison Baszucki gegründete Baszucki Group nutzt private Spenden, Impact Investing, Lobbyarbeit, Storytelling und Community Building, um grundlegende Veränderungen voranzutreiben. Ein Hauptziel der Baszucki Group ist es, die Ergebnisse im Bereich der psychischen Gesundheit zu verbessern, indem sie Initiativen an der Schnittstelle von Stoffwechsel, Psychiatrie und Neurowissenschaften unterstützt. Wenn Sie mehr über metabolische Ansätze bei psychischen Störungen, einschließlich der ketogenen Therapie, erfahren möchten, besuchen Sie Metabolic Mind, eine gemeinnützige Initiative der Baszucki Group. Die Ausgangssprache, in der der Originaltext veröffentlicht wird, ist die offizielle und autorisierte Version. Übersetzungen werden zur besseren Verständigung mitgeliefert. Nur die Sprachversion, die im Original veröffentlicht wurde, ist rechtsgültig. Gleichen Sie deshalb Übersetzungen mit der originalen Sprachversion der Veröffentlichung ab. Contacts Colby Zintl colby@baszuckigroup.org // Add toggle of sharing section var internalToggle = new BWToggle("bw-release-internal", "#bw-release-internal h2", "#bw-internal-content"); internalToggle.set(false);'''
