title = "Riassunto: Incyte presenterà i nuovi dati del suo portafoglio dermatologico all'edizione 2025 del congresso annuale dell'American Academy of Dermatology (AAD) | Business Wire"
description = "Incyte (Nasdaq: INCY) ha annunciato oggi che diversi abstract riportanti nuovi dati del suo portafoglio dermatologico saranno presentati all'edizione"
full_description = '''Incyte presenterà i nuovi dati del suo portafoglio dermatologico all'edizione 2025 del congresso annuale dell'American Academy of Dermatology (AAD) - Gli abstract in evidenza per ruxolitinib crema (Opzelura®) includono diverse presentazioni sulla dermatite atopica e dati innovativi sulla prurigo nodularis (PN) - I dati della pipeline presentati includono quelli relativi ad axatilimab (Niktimvo™) in pazienti con manifestazioni dermatologiche della malattia cronica del trapianto contro l'ospite (GvHD) March 01, 2025 08:56 PM Eastern Standard Time WILMINGTON, Delaware--(BUSINESS WIRE)--Incyte (Nasdaq: INCY) ha annunciato oggi che diversi abstract riportanti nuovi dati del suo portafoglio dermatologico saranno presentati all'edizione 2025 del congresso annuale dell'American Academy of Dermatology (AAD), che si terrà dal 7 all'11 marzo a Orlando. "Siamo impazienti di poter condividere i nuovi dati sul ruxolitinib crema (Opzelura®) per molteplici indicazioni, tra cui la prurigo nodularis, e axatilimab (Niktimvo™) in pazienti con manifestazioni dermatologiche della malattia cronica del trapianto contro l'ospite (GvHD) in occasione del meeting annuale dell'AAD di quest'anno", ha dichiarato il dottor Jim Lee, Vicepresidente del gruppo, divisione Inflammation and Autoimmunity di Incyte. Il testo originale del presente annuncio, redatto nella lingua di partenza, è la versione ufficiale che fa fede. Le traduzioni sono offerte unicamente per comodità del lettore e devono rinviare al testo in lingua originale, che è l'unico giuridicamente valido. Contacts Contatto per i media media@incyte.com Contatto per gli investitori ir@incyte.com // Add toggle of sharing section var internalToggle = new BWToggle("bw-release-internal", "#bw-release-internal h2", "#bw-internal-content"); internalToggle.set(false);'''
