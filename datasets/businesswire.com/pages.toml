title = "新的雙相情感障礙研究顯示，生酮飲食對身心健康有益 | Business Wire"
description = "新的雙相情感障礙研究顯示，生酮飲食對身心健康有益。Baszucki代謝精神病學研究員Iain Campbell博士分享了他個人透過生酮飲食緩解雙相情感障礙症狀的經歷，這促成了本周發表在《英國精神病學雜誌：開放版》上的一項先導性試驗的誕生。Campbell博士總結了該報告的研究結果，同時研究參與者分享了他們的個人經歷。這項工作彰顯了代謝介入措施在治療心理健康狀況方面的潛力。該影片是Baszucki Group的非營利性計畫Metabolic Mind的成果。如欲進一步瞭解精神障礙的代謝治療方法，包括生酮療法，請造訪Metabolic Mind網站(metabolicmind.org)。"
