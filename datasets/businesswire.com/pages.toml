title = "BeiGene公布2024年第四季及全年財務業績和業務進展 | Business Wire"
description = "(美國商業資訊)-- 計畫更名為BeOne Medicines Ltd.的全球性腫瘤公司BeiGene, Ltd. (NASDAQ: ONC; HKEX: 06160; SSE: 688235)今日公布了2024年第四季及全年的財務業績和公司業務進展。 BeiGene共同創辦人、董事長兼執行長Joh"
full_description = 'BeiGene公布2024年第四季及全年財務業績和業務進展 2024年第四季和全年全球營收總額分別為11億美元和38億美元，較去年同期成長78%和55%；按美國通用會計準則(GAAP)計算的營運虧損收窄，且全年實現非GAAP營業收入為正 2024年第四季和全年全球BRUKINSA營收分別為8.28億美元和26億美元，較去年同期成長100%和105%；BCL2抑制劑sonrotoclax和BTK CDAC BGB-16673的關鍵階段計畫取得進展 2024年第四季和全年分別有6個和13個新分子實體(NME)進入臨床試驗階段；預計2025年上半年創新實質腫瘤計畫將有多項資料讀出 2025年全年營收指引為49億美元至53億美元，重申預計2025年將實現正GAAP營業收入和經營活動現金流生成 Download Image Full Size Small Preview Thumbnail （圖片：美國商業資訊） Image Full Size Small Preview Thumbnail Image Full Size Small Preview Thumbnail March 01, 2025 08:11 PM Eastern Standard Time 加州聖馬提歐--(BUSINESS WIRE)--(美國商業資訊)-- 計畫更名為BeOne Medicines Ltd.的全球性腫瘤公司BeiGene, Ltd. (NASDAQ: ONC; HKEX: 06160; SSE: 688235)今日公布了2024年第四季及全年的財務業績和公司業務進展。 BeiGene共同創辦人、董事長兼執行長John V. Oyler表示：「我們2024年第四季及全年的業績顯示，做為全球腫瘤領域的重要力量，我們實現了巨大的成長。BRUKINSA的持續成功，以及腫瘤領域最多產的實質腫瘤研發產品線之一的發展，加上預計今年將有多項資料讀出，都進一步鞏固了我們的地位。BRUKINSA目前在美國新診斷的慢性淋巴性白血病(CLL)病患中已成為無可爭議的頂尖藥物，擁有所有BTK抑制劑中最廣泛的適應症標籤，是我們血液腫瘤產品線的基石，與我們處於後期研發階段的BCL2抑制劑sonrotoclax以及潛在的同類首創BTK CDAC藥物一起，展現出做為核心藥物的巨大潛力。我們還透過利用多特異性抗體、蛋白質降解劑和抗體偶聯藥物等平台，在乳癌、肺癌和胃腸道癌領域打造未來的實質腫瘤產品線。2025年是一個轉捩點，我們可望實現正GAAP營業收入和經營現金流，同時我們計畫將公司名稱更改為BeOne，並啟用新的那斯達克股票代號ONC。」 2024年第四季及全年財務概況 （金額以千美元為單位，未經稽核） 第四季 全年 2024年 2023年 變化百分比 2024年 2023年 變化百分比 產品淨營收 $ 1,118,035 $ 630,526 77 % $ 3,779,546 $ 2,189,852 73 % 合作淨營收 $ 9,789 $ 3,883 152 % $ 30,695 $ 268,927 (89 )% 營收總額 $ 1,127,824 $ 634,409 78 % $ 3,810,241 $ 2,458,779 55 % GAAP營運虧損 $ (79,425 ) $ (383,795 ) (79 )% $ (568,199 ) $ (1,207,736 ) (53 )% 調整後的營運收入（虧損）* $ 78,603 $ (267,224 ) 129 % $ 45,356 $ (752,473 ) 106 % * 有關我們使用非GAAP財務指標的解釋，請參閱本新聞稿下文中的「關於非GAAP財務指標使用的說明」部分；有關各非GAAP財務指標與最具可比性的GAAP財務指標的調節，請參閱本新聞稿末尾的表格。 重大業務更新 BRUKINSA® (zanubrutinib)是一種可口服的小分子BTK抑制劑，旨在透過生物利用度、半衰期和選擇性的最佳化，提供對BTK蛋白的完全且持續的抑制作用。相較其他已核准的BTK抑制劑，BRUKINSA具有差異化的藥物動力學特性，已被證明能夠抑制多種疾病相關組織中惡性B細胞的增殖。BRUKINSA在全球擁有最廣泛的適應症標籤，並且是唯一可靈活選擇每日一次或兩次服用的BTK抑制劑。BRUKINSA臨床開發計畫迄今已在30多個國家和地區招募了約7100名病患，涉及超過35項臨床試驗。BRUKINSA已在70多個市場獲得核准，全球累計治療病患已超過18萬名。 2024年第四季及全年，BRUKINSA在美國的銷售額總計分別為6.16億美元和20億美元，較上年同期分別成長97%和106%；較前一季需求成長的60%以上來自在慢性淋巴性白血病(CLL)治療中的使用擴大，BRUKINSA在美國CLL新病患起始治療以及所有其他已獲准適應症中的佔有率持續領先；2024年第四季及全年，BRUKINSA在歐洲的銷售額總計分別為1.13億美元和3.59億美元，較上年同期分別成長148%和194%，這歸功於在德國、義大利、西班牙、法國和英國等所有主要市場的市場佔有率成長；以及 與MSN Pharmaceuticals, Inc.和MSN Laboratories Private Ltd.達成專利訴訟和解協議，授予MSN不早於2037年6月15日在美國銷售BRUKINSA學名藥的權利，但在符合此類和解慣例的情況下，該日期可能提前或延後。 TEVIMBRA® (tislelizumab) 是一種具有獨特設計的人源化免疫球蛋白G4 (IgG4)抗程式性細胞死亡蛋白1 (PD-1)單克隆抗體，對PD-1具有高親和力和高特異性，旨在最大程度地減少其與巨噬細胞表面的Fcγ受體結合，協助機體的免疫細胞辨識並對抗腫瘤。 TEVIMBRA是BeiGene實質腫瘤產品組合的核心資產，並在多種腫瘤類型和疾病治療環境中展現出潛力。TEVIMBRA臨床開發計畫迄今已在35個國家和地區招募了近14,000名病患，涉及70項試驗，其中包括21項註冊研究。TEVIMBRA已在45個市場獲准，並已在全球治療病患超過130萬。 2024年第四季及全年，tislelizumab的銷售額總計分別為1.54億美元和6.21億美元，較上年同期分別成長20%和16%； 獲得美國食品藥物管理局(FDA)核准，與含鉑和氟嘧啶類化療共同用於無法切除或轉移性HER2陰性、腫瘤表達PD-L1 (≥1)的成人胃或胃食管交界腺癌的一線治療；以及 獲得歐盟委員會(EC)核准，與化療共同用於食管鱗狀細胞癌和胃或胃食管交界腺癌的一線治療。 重大研發產品線亮點 BeiGene的產品組合策略強調快速生成早期臨床概念驗證資料，這歸功於其具有速度和成本優勢的全球開發營運模式（「快速驗證概念」）。公司內部的全球研發團隊，包括臨床營運和開發團隊，由近3700名員工組成，在六大洲展開試驗，並透過與超過45個國家的主管機關和研究人員合作，努力確保資料的嚴謹性和高品質。這種策略方法可以充分利用資源，將以資料為導向的投資迅速投入到最有希望實現臨床差異化的候選專案中，並降低其他專案的優先順序。BeiGene擁有業界最大的腫瘤研究團隊之一，在小分子和生物製劑的轉化研究方面表現出色，建立了多特異性抗體、嵌合式降解啟動化合物(CDAC)和抗體藥物偶聯物(ADC)三大平台技術。 血液學 BRUKINSA 在美國血液學會(ASH)年會上，公布了SEQUOIA研究的5年隨訪資料；經調整新冠疫情的影響後，該研究顯示，在初治(TN) CLL病患中，相較bendamustine-rituximab，BRUKINSA治療使疾病惡化或死亡風險降低75%； 預計2025年下半年BRUKINSA片劑將獲得FDA和EC核准； 預計2025年下半年將對初治套細胞淋巴瘤(MCL)的3期MANGROVE研究進行無進展存活期的中期分析；以及 預計2025年下半年將完成3期MAHOGANY研究中復發/難治(R/R)濾泡性淋巴瘤部分的入組。 Sonrotoclax（BCL2抑制劑） 計畫在2025年下半年公布復發/難治CLL和復發/難治MCL的2期試驗資料，並可能遞交加快核准申請； 在ASH年會上，公布了1/1b期研究中320 mg擴充佇列的資料，中位隨訪1.5年顯示，在初治CLL病患中與BRUKINSA共同使用無進展； 目前該計畫已入組超過1800名病患； 已完成初治CLL的3期CELESTIAL研究的入組； 預計2025年上半年將在復發/難治CLL和復發/難治MCL的全球3期試驗中入組首批受試者；以及 繼續在華氏巨球蛋白血症的全球2期試驗中入組病患。 BGB-16673 (BTK CDAC) 繼續入組可能支援註冊的復發/難治CLL的2期研究，預計2026年讀出資料； 目前該計畫已入組超過500名病患； 預計2025年上半年將啟動復發/難治CLL的3期試驗，與醫生選擇的治療方案進行對比；以及 預計2025年下半年將啟動與非共價BTK抑制劑pirtobrutinib在復發/難治CLL中的3期頭對頭試驗。 實質腫瘤 預計2025年上半年將讀出BGB-43395（CDK4抑制劑）、BG-68501（CDK2抑制劑）和BG-C9074 (B7H4 ADC)的資料，2025年下半年將獲得BG-60366 (EGFR CDAC)、BGB-53038（panKRAS抑制劑）、BG-C137 (FGFR2b ADC)、BGB-C354 (B7H3 ADC)和BG-C477 (CEA ADC)的內部概念驗證資料。 肺癌 Tarlatamab (AMG757, DLL3xCD3 BiTE)：預計2025年上半年將讀出二線小細胞肺癌3期研究的資料； Advan-TIG-302（TIGIT抗體）：預計2025年下半年將讀出一線PD(L)1高表達非小細胞肺癌3期研究的中期資料； BG-60366 (EGFR CDAC)：2024年第四季進入臨床試驗階段；具有差異化的降解機制，能夠完全抑制EGFR訊號；對osimertinib敏感及耐藥的EGFR突變具有高度有效性；強大的臨床前療效資料，適用於口服每日給藥； BG-89894（MAT2A抑制劑）：2024年第四季進入劑量遞增階段；具有潛在的同類最佳特性，效力強且能穿透血腦屏障；在臨床前模型中，PRMT5和MAT2A之間具有強大的相乘作用； BGB-58067（MTA協同PRMT5抑制劑）：2025年1月初進入臨床試驗階段；具有同類最佳的潛力，效力高、選擇性強且能穿透血腦屏障；以及 BG-T187（EGFR x MET三特異性抗體）：2024年第四季啟動劑量遞增；具有差異化的MET雙位點設計，具有最佳的MET抑制活性，可望成為同類最佳藥物。 乳癌和婦科癌症 BGB-43395（CDK4抑制劑）：繼續在預期的有效劑量範圍內進行單藥治療以及與fulvestrant和letrozole共同治療的劑量遞增；目前已入組超過180名病患，預計2025年上半年獲得概念驗證資料；正在計畫展開與內分泌治療共同用於二線HR+/HER2-轉移性乳癌的3期試驗；以及 BG-68501（CDK2抑制劑）和BG-C9074 (B7H4 ADC)：繼續進行單藥劑量遞增；目前分別已入組超過50名和70名病患。 胃腸道癌 Zanidatamab（HER2雙特異性抗體）與tislelizumab和化療共同使用：預計2025年下半年將讀出一線HER2陽性胃食管腺癌3期研究的主要無進展存活期(PFS)資料；以及 2024年第四季進入臨床試驗階段的NME： BGB-53038（panKRAS抑制劑）：效力高、選擇性強，對多種腫瘤類型的KRAS突變具有廣泛活性；透過不影響其他RAS蛋白來限制毒性；19%的癌症存在KRAS突變；以及 BG-C137 (FGFR2b ADC)：在上消化道癌和乳癌中，可能是針對已驗證標靶的同類最佳ADC；在高表達和中等表達模型中，可能比主要單克隆抗體具有更優越的療效。 發炎和免疫學 BGB-45035 (IRAK4CDAC)：目前正在進行單次遞增劑量(SAD)和多次遞增劑量(MAD)佇列的劑量遞增，已入組超過130名受試者；是一種強效且選擇性的降解劑，可同時靶向IRAK4的激酶和支架功能，以實現完全的標靶降解；計畫2025年展開2期研究；2025年下半年將獲得組織IRAK4降解的概念驗證資料。 公司業務進展 宣布擬將公司更名為BeOne Medicines，尚待股東批准；新名稱體現了公司致力於透過與全球社群合作，開發創新藥物以消除癌症，為盡可能多的病患服務的承諾； 宣布與CSPC Zhongqi Pharmaceutical Technology (Shijiazhuang) Co., Ltd.達成全球授權協議，授權該公司對SYH2039 (BG-89894)進行開發，這是一種新型MAT2A抑制劑，正在探索做為單藥療法以及與BGB-58067（MTA協同PRMT5抑制劑）共同用於實質腫瘤的治療； 將公司在那斯達克的股票代號從「BGNE」更改為「ONC」；以及 2024年12月16日舉辦了投資人網路研討會，重點介紹了2024年ASH年會和2024年聖安東尼奧乳癌研討會中血液腫瘤產品線的關鍵資料，並於2025年1月13日在2025年J.P. Morgan醫療健康大會上進行了展示。網路研討會的重播和相關資料可在公司網站的投資人活動與簡報部分取得。 2024年第四季及全年財務亮點 2024年第四季及全年的營收分別為11億美元和38億美元，而上年同期分別為6.34億美元和25億美元，主要成長動力來自BRUKINSA在美國和歐洲的產品銷售額成長。 2024年第四季及全年的產品營收總計分別為11億美元和38億美元，上年同期分別為6.31億美元和22億美元。產品營收的成長主要歸功於BRUKINSA的銷售額增加。2024年第四季及全年，美國是公司最大的市場，產品營收分別為6.16億美元和20億美元，上年同期分別為3.13億美元和9.46億美元。2024年第四季，美國的銷售額還受到季節性因素和客戶訂單時間模式的正向影響，約為3000萬美元。除了BRUKINSA的營收成長外，Amgen的授權產品和tislelizumab的成長也對產品營收產生了正向影響。 按GAAP計算，2024年第四季及全年以占全球產品銷售額百分比計算的毛利率分別為85.6%和84.3%，上年同期分別為83.2%和82.7%。由於全球BRUKINSA的銷售額占比相對於我們產品組合中的其他產品比例更高，毛利率較前一季和較去年同期均有所上升，但部分被2024年第四季及全年分別為1600萬美元和3300萬美元的加快折舊費用的影響所抵銷，這是由於tislelizumab轉向更高效、更大規模的生產線所致。在不包括加快折舊的調整後基礎上，2024年第四季及全年以占產品銷售額百分比計算的毛利率分別提高至87.4%和85.5%，而上年同期分別為83.7%和83.2%。 營運支出 下表分別集中整理了2024年第四季和2023年第四季的營運支出： GAAP 非GAAP （以千為單位，百分比除外） 2024年第四季 2023年第四季 變化百分比 2024年第四季 2023年第四季 變化百分比 研發 $542,012 $493,987 10% $474,874 $437,383 9% 銷售、總務和行政 $504,677 $418,385 21% $433,059 $361,435 20% 營運支出總額 $1,046,689 $912,372 15% $907,933 $798,818 14% 下表分別集中整理了2024年全年和2023年全年的營運支出： GAAP 非GAAP （以千為單位，百分比除外） 2024會計年度 2023會計年度 變化百分比 2024會計年度 2023會計年度 變化百分比 研發 $1,953,295 $1,778,594 10% $1,668,368 $1,558,960 7% 銷售、總務和行政 $1,831,056 $1,508,001 21% $1,549,864 $1,284,689 21% 營運支出總額 $3,784,351 $3,286,595 15% $3,218,232 $2,843,649 13% 相較上年同期，2024年第四季及全年的研發(R&D)支出在GAAP和調整後基礎上均有所增加，主要原因是將臨床前計畫推進至臨床階段，以及將早期臨床計畫推進至後期階段。2024年第四季及全年，與正在進行的授權引進資產研發相關的預付費用和里程碑付款總計分別為6300萬美元和1.14億美元，上年同期分別為3180萬美元和4680萬美元。 相較上年同期，2024年第四季及全年的銷售、總務和行政(SG&A)支出在GAAP和調整後基礎上均有所增加，這是由於繼續在BRUKINSA的全球商業化推廣方面進行投資，主要集中在美國和歐洲市場。2024年第四季及全年，SG&A支出占產品銷售額的百分比分別為45%和48%，上年同期分別為66%和69%。 淨虧損 相較與上年同期，2024年第四季及全年的GAAP淨虧損有所改善，主要原因是營運虧損的減少。 2024年第四季，每股淨虧損為0.11美元，每股美國存托股份(ADS)淨虧損為1.43美元，上年同期每股淨虧損為0.27美元，每股ADS淨虧損為3.53美元。2024年全年每股淨虧損為0.47美元，每股ADS淨虧損為6.12美元，上年同期每股淨虧損為0.65美元，每股ADS淨虧損為8.45美元。 2024年第四季經營活動產生的現金為7500萬美元，較上年同期增加2.97億美元。2024年全年經營活動使用的現金為1.41億美元，較上年同期減少10億美元。該期間經營現金流的改善主要歸功於GAAP營運虧損的改善和非GAAP經營收入。 如欲瞭解有關BeiGene 2024年財務報表的更多詳情，請參閱BeiGene向美國證券交易委員會遞交的2024會計年度Form 10-K年度報告。 2025年全年指引 BeiGene的財務指引總結如下： 2025會計年度1 營收總額 49億美元至53億美元 GAAP營運支出（研發和SG&A） 41億美元至44億美元 其他： GAAP毛利率百分比在80%中段範圍 全年GAAP營業收入為正 經營活動產生的現金流為正 1 不包括任何潛在的新的重大業務發展活動或不尋常/非經常性項目。採用2025年1月31日的外匯匯率。 BeiGene 2025年全年營收總額指引為49億美元至53億美元，其中包括預期BRUKINSA在美國的領先地位以及在歐洲和其他重要全球市場的持續擴張將推動營收強勁成長。由於產品組合和生產效率的原因，預計毛利率百分比將在80%中段範圍，相較2024年有所變化。BeiGene對GAAP基礎上的合併營運支出的指引包括預期將以一定的速度進行投資，以支援商業和研究方面的成長，同時繼續實現有意義的營運槓桿。非GAAP營運支出，不包括與以股份為基礎的薪酬、折舊和攤銷費用相關的成本，可望與GAAP營運支出保持一致，調節項目與現有做法相同。營運支出指引不包括任何潛在的新的重大業務發展活動或不尋常/非經常性項目。 電話會議和網路廣播 公司關於2024年第四季及全年的業績電話會議將於美國東部時間2025年2月27日（星期四）上午8點透過網路廣播的形式播出，可前往BeiGene網站(www.beigene.com)的「投資人」版塊觀看。此外，還將提供以幻燈片形式呈現的補充資訊以及網路廣播的重播。 關於BeiGene 計畫更名為BeOne Medicines Ltd.的BeiGene是一家全球性腫瘤公司，致力於發現和開發對全球癌症病患而言更可負擔且易於取得的創新療法。憑藉廣泛的產品組合，我們正透過內部能力及合作加快開發多元化的新型療法研發產品線。我們致力於為更多需要藥物的病患從根本上改善藥物的取得途徑。我們日益壯大的全球團隊由遍布六大洲的超過11,000名同事組成。如欲瞭解有關BeiGene的更多資訊，請造訪www.beigene.com並在LinkedIn、X（前身為Twitter）、Facebook和Instagram上關注我們。 BeiGene打算利用其網站的「投資人」部分、X（前稱Twitter）帳戶(x.com/BeiGeneGlobal)、LinkedIn帳戶(linkedin.com/company/BeiGene)、Facebook帳戶(facebook.com/BeiGeneGlobal)以及Instagram帳戶(instagram.com/BeiGeneGlobal)揭露重要資訊，並遵守FD法規規定的揭露義務。因此，除BeiGene的新聞稿、SEC呈報文件、公開電話會議、簡報和網路廣播外，投資人還應關注BeiGene的網站、X帳戶、LinkedIn帳戶、Facebook帳戶和Instagram帳戶。 前瞻性陳述 本新聞稿包含《1995年私人證券訴訟改革法案》和其他聯邦證券法所定義的前瞻性陳述，其中包括關於概念驗證資料讀出時間、臨床試驗活動和資料讀出、研究入組情況以及監管核准；BeiGene未來的營收、營業收入、現金流、營運支出和毛利率百分比；BeiGene實質腫瘤研發產品線的未來發展及其在多個疾病領域和治療模式中滿足未被滿足的病患需求的能力；BeiGene臨床試驗及新分子實體的未來成功；以及「關於BeiGene」標題下所述BeiGene的計畫、承諾、抱負和目標的陳述。由於各類重大因素影響，實際結果可能與前瞻性陳述中所述的結果大相逕庭，包括BeiGene證明其候選藥物療效和安全性的能力；其候選藥物的臨床結果可能不支援進一步開發或上市核准；主管機關的行動可能影響臨床試驗及上市核准的開始、時機和進展；BeiGene的上市藥物和獲准的候選藥物獲得商業成功的能力；BeiGene為其藥物和技術取得和維護智慧財產權保護的能力；BeiGene依賴第三方進行藥物開發、製造、商業化和其他服務；BeiGene在獲得監管核准和實現藥品商業化方面的經驗有限；BeiGene獲得額外營運資金和完成候選藥物開發以及實現並維持盈利的能力；以及BeiGene在最近的Form 10-K年度報告中題為「風險因素」的部分進一步討論的風險，與BeiGene隨後向美國證券交易委員會遞交的文件中討論的潛在風險、不確定性和其他重要因素。本新聞稿中的所有資訊反映的是新聞稿發表當日的情況，除非法律要求，否則BeiGene無義務更新此類資訊。BeiGene的財務指引是依據一些估計和假設得出的，這些估計和假設可能存在重大不確定性。 簡明合併營運報表（美國GAAP） （除股票、美國存托股份(ADS)、每股和每股ADS資料外，其餘金額單位均為千美元） 第四季 全年 2024年 2023年 2024年 2023年 （未經稽核） （經稽核） 營收 產品營收，淨額 $1,118,035 $630,526 $3,779,546 $2,189,852 合作營收 9,789 3,883 30,695 268,927 營收總額 1,127,824 634,409 3,810,241 2,458,779 產品銷售成本 160,560 105,832 594,089 379,920 毛利 967,264 528,577 3,216,152 2,078,859 營運支出 研發 542,012 493,987 1,953,295 1,778,594 銷售、總務和行政 504,677 418,385 1,831,056 1,508,001 營運支出總額 1,046,689 912,372 3,784,351 3,286,595 營運虧損 (79,425) (383,795) (568,199) (1,207,736) 利息收入，淨額 7,808 16,274 47,836 74,009 其他（支出）收入，淨額 (13,734) 16,749 (12,638) 307,891 所得稅前虧損 (85,351) (350,7