title = "NIQ报告称全球美业销售额年同比增长7.3% | Business Wire"
description = "(美国商业资讯)-- 全球领先的消费者研究和零售监测公司尼尔森IQ（NIQ）公布，全球美业销售额年同比增长7.3%。拉丁美洲、非洲及中东地区的增幅最大，北美和西欧也分别呈现出+7.8%和+7.7%的强劲增长势头。在亚太地区，韩国、印度、泰国、新加坡和新西兰正在成为领先市场，为整体销额增长做出了贡献。"
full_description = 'NIQ报告称全球美业销售额年同比增长7.3% 拉丁美洲（+19.1%）和非洲中东地区（+27.1%）增长强劲 美国41%的美妆和个人护理产品销售额来自电商平台 社交电子商务推动了全球68%的美业消费 March 02, 2025 12:00 AM Eastern Standard Time 芝加哥--(BUSINESS WIRE)--(美国商业资讯)-- 全球领先的消费者研究和零售监测公司尼尔森IQ（NIQ）公布，全球美业销售额年同比增长7.3%。拉丁美洲、非洲及中东地区的增幅最大，北美和西欧也分别呈现出+7.8%和+7.7%的强劲增长势头。在亚太地区，韩国、印度、泰国、新加坡和新西兰正在成为领先市场，为整体销额增长做出了贡献。通货膨胀是这一全球扩张的主要驱动力，但收入提升和新消费者的涌入也推动了增长。 电子商务引领零售革命： 电子商务正在推动全球美妆个护产品的销售，各地区的增长水平不尽相同。在中国，美发和护肤品销售总额中有87%在线上渠道实现。在印度，网购美妆产品占17%，而在巴西，这一数字还不到10%。尽管存在这些差异，但就美妆个护产品而言，网上销售超越实体店是大势所趋。 美国的线上销售额持续大幅超越线下，通过电商平台售出的美妆和个护产品占销售总额的41%。在过去四年里，亚马逊等平台通过有竞争力的价格、快速的送货服务和丰富的选择，获得了7.3个百分点的市场份额。越来越多的消费者转向亚马逊作为其购物渠道，消费额逐年上升。虽然数字商务在过去五年里取得了巨大增长，而实体店零售基本保持不变。未来的零售商需要完善店内体验，以满足现代消费者的需求。 消费者对电子商务的青睐，既是出于市场扩张，也有从实体店抢夺份额的因素。向网上购物的转变不仅仅是受疫情影响的趋势，更是消费者行为的结构性变化，尤其是在年轻一代中。 社交电商的全球崛起： 社交电商是一种全球趋势，这些平台上68%的购买行为属于冲动消费。TikTok商店已跃升为美国第八大保健和美业电子零售商，实现了10亿美元的美业销售额。12.5%的美国线上购物者通过该应用购买过保健和美业产品，许多人还会重复购买。在中国，31%的护肤品消费来自抖音。抖音/TikTok商店已成为消费者发现品牌、了解和测试新产品的首选之地。 尽管数字商务正在崛起，但实体店零售仍具有重要意义。消费者喜欢亲自触摸体验和个性化咨询服务，尤其是在护肤品等高价位商品方面。零售商需要在便利性和顾客满意度之间取得平衡，并投资于线上发现与线下体验无缝结合的混合模式。 NIQ美妆与个护高级副总裁Tara James Taylor表示：“在瞬息万变的美容行业，2025年的成功是一种微妙的平衡。创新与传统、实惠与奢华、可持续与可扩展、个性化与包容性之间的动态变化正在重塑美业品牌方和零售商的市场。对于那些希望在这个万亿美元的全球美业市场中蓬勃发展的企业而言，找到适合的平衡点至关重要。” 点击了解有关2025年美业趋势和现状的更多洞察，加入Beauty inner Circle，获取更多权威见解。 关于NIQ NielsenIQ（NIQ）是全球领先的消费者研究与零售监测公司，致力于提供对消费者行为最全面的洞察，并揭示新的增长途径。2023年，NIQ与GfK完成合并，两家极具全球影响力的行业领导者实现整合。如今，我们的全球业务遍及90多个国家和地区，覆盖约85%的世界人口及超过7.2万亿美元的全球消费者支出。凭借全面的零售解读与消费者洞察，通过卓越的商业智能平台和分析工具，传递市场全貌（Full View ™）。 有关更多信息，请访问：nielseniq.cn。 ​免责声明：所有产品和公司名称均为其各自持有人的商标™或注册商标®。对其使用并不意味着与其有任何联系或获其认可。 免责声明：本公告之原文版本乃官方授权版本。译文仅供方便了解之用，烦请参照原文，原文版本乃唯一具法律效力之版本。 Contacts Sweta Patra sweta.patra@nielseniq.com Hana Hu Hana.hu@nielseniq.com // Add toggle of sharing section var internalToggle = new BWToggle("bw-release-internal", "#bw-release-internal h2", "#bw-internal-content"); internalToggle.set(false);'
