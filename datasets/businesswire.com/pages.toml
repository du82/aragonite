title = "Samenvatting: Incyte onthult nieuwe gegevens uit haar dermatologieportfolio tijdens de jaarlijkse bijeenkomst van de American Academy of Dermatology (AAD) 2025 | Business Wire"
description = "Incyte (Nasdaq: INCY) maakte vandaag bekend dat een aantal samenvattingen met nieuwe gegevens uit haar dermatologieportfolio zullen worden voorgesteld"
full_description = 'Incyte onthult nieuwe gegevens uit haar dermatologieportfolio tijdens de jaarlijkse bijeenkomst van de American Academy of Dermatology (AAD) 2025 - De voorgestelde samenvattingen voor ruxolitinib crème (Opzelura®) omvatten verschillende presentaties in atopische dermatitis en de allernieuwste gegevens betreffende prurigo nodularis (PN) - De voorgestelde pijplijngegevens omvatten gegevens over axatilimab (Niktimvo™) bij patiënten met dermatologische verschijnselen van chronische GvHD (graft-versus-host disease = omgekeerde afstotingsziekte) March 01, 2025 08:58 PM Eastern Standard Time WILMINGTON, Del.--(BUSINESS WIRE)--Incyte (Nasdaq: INCY) maakte vandaag bekend dat een aantal samenvattingen met nieuwe gegevens uit haar dermatologieportfolio zullen worden voorgesteld tijdens de jaarlijkse bijeenkomst van de American Academy of Dermatology (AAD) van 2025, die doorgaat van 7 tot 11 maart 2025 in Orlando. “We kijken ernaar uit om nieuwe gegevens mee te delen over ruxolitinib cream (Opzelura®) binnen de verschillende indicaties, waaronder prurigo nodularis, en axatilimab (Niktimvo™) bij patiënten met dermatologische verschijnselen van chronische GvHD (graft-versus-host disease = omgekeerde afstotingsziekte) tijdens de jaarlijkse bijeenkomst van AAD dit jaar,” verklaart Jim Lee, M.D., Ph.D., Group Vice President, Inflammation & Autoimmunity van Incyte. Deze bekendmaking is officieel geldend in de originele brontaal. Vertalingen zijn slechts als leeshulp bedoeld en moeten worden vergeleken met de tekst in de brontaal, die als enige rechtsgeldig is. Contacts Media media@incyte.com Investeerders ir@incyte.com // Add toggle of sharing section var internalToggle = new BWToggle("bw-release-internal", "#bw-release-internal h2", "#bw-internal-content"); internalToggle.set(false);'
