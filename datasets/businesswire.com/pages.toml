title = "Resumen: Incyte presentará nuevos datos de su cartera de dermatología en la Reunión Anual 2025 de la American Academy of Dermatology (AAD) | Business Wire"
description = "Incyte (Nasdaq: INCY) anunció hoy que múltiples resúmenes que presentan nuevos datos de su cartera de dermatología serán presentados en la Reunión Anu"
full_description = 'Incyte presentará nuevos datos de su cartera de dermatología en la Reunión Anual 2025 de la American Academy of Dermatology (AAD) - Los resúmenes destacados para ruxolitinib en crema (Opzelura®) incluyen múltiples presentaciones sobre dermatitis atópica y datos de última hora sobre el prurigo nodular (PN) - Se presentarán datos de la cartera de investigación que incluyen información para axatilimab (Niktimvo™) en pacientes con manifestaciones dermatológicas de la enfermedad de injerto contra huésped (GVHD) March 01, 2025 08:53 PM Eastern Standard Time WILMINGTON, Delaware--(BUSINESS WIRE)--Incyte (Nasdaq: INCY) anunció hoy que múltiples resúmenes que presentan nuevos datos de su cartera de dermatología serán presentados en la Reunión Anual 2025 de la American Academy of Dermatology, que se llevará a cabo del 7 al 11 de marzo de 2025 en Orlando. "Estamos muy entusiasmados por compartir nuevos datos para ruxolitinib en crema (Opzelura®) utilizados en múltiples indicaciones, como el prurigo nodular y el medicamento axatilimab (Niktimvo™) en pacientes con manifestaciones dermatológicas de la enfermedad de injerto contra huésped (GVHD) en la Reunión Anual de la American Academy of Dermatology de este año", dijo Jim Lee, M.D., Ph.D., vicepresidente ejecutivo de grupo, Inflamación y Autoinmunidad, Incyte. El comunicado en el idioma original es la versión oficial y autorizada del mismo. Esta traducción es solamente un medio de ayuda y deberá ser comparada con el texto en idioma original, que es la única versión del texto que tendrá validez legal. Contacts Contacto de prensa media@incyte.com Inversionistas ir@incyte.com // Add toggle of sharing section var internalToggle = new BWToggle("bw-release-internal", "#bw-release-internal h2", "#bw-internal-content"); internalToggle.set(false);'
