title = "Une nouvelle étude sur le trouble bipolaire montre qu’un régime cétogène est bénéfique pour la santé mentale et physique | Business Wire"
description = "New bipolar disorder study shows that a ketogenic diet leads to mental and physical health benefits. Dr. Iain Campbell, PhD, Baszucki Metabolic Psychiatry Research Fellow, shares how his personal experience alleviating bipolar disorder symptoms through ketosis led to the genesis of a pilot trial published this week in BJPsych Open. Dr. Campbell provides a summary of the report findings while study participants share personal testimonials of their experience. This work highlights the potential of metabolic interventions for mental health conditions. This video is a product of Metabolic Mind, a nonprofit initiative of Baszucki Group. To learn more about metabolic approaches to mental disorders, including ketogenic therapy, visit Metabolic Mind (metabolicmind.org). (Photo: Business Wire)"
full_description = '''Une nouvelle étude sur le trouble bipolaire montre qu’un régime cétogène est bénéfique pour la santé mentale et physique Une étude pionnière en Europe montre une amélioration de l'humeur, de l'énergie et de l'anxiété, suscitant l'espoir d'un nouveau traitement de la santé mentale. Download MPEG-4 Video Loading media player... jQuery(function() { //create video element var attributes = { 'id': 'news_video', 'class': 'video-js vjs-default-skin', 'width': '640', 'data-height': '264', 'onloadstart': 'this.volume=0.4' } var element = $('<video/>').attr(attributes); $('#media-player').html(element); //Social share var shareOptions = { socials: ['fbFeed', 'tw', 'linkedin', 'mail'], url: window.location.href, title: 'Une nouvelle \u00E9tude sur le trouble bipolaire montre qu\u2019un r\u00E9gime c\u00E9tog\u00E8ne est b\u00E9n\u00E9fique pour la sant\u00E9 mentale et physique', description: 'BusinessWire news share', image: 'https://mms.businesswire.com/media/20250211057289/fr/2377556/5/2024_11_11_Edinburgh_Landscape_Video_CC.jpg', // required for Facebook and Messenger fbAppId: '140586622674265', // optional for Facebook redirectUri: window.location.href + '#close', } //activate Video.JS theme videojs('news_video', { controls: true, autoplay: false, preload: 'auto', poster: 'https://mms.businesswire.com/media/20250211057289/fr/2377556/5/2024_11_11_Edinburgh_Landscape_Video_CC.jpg', sources: [ {src: "https://mms.businesswire.com/media/20250211057289/fr/2377556/19/2024_11_11_Edinburgh_Landscape_Video_CC.mp4&.mp4?download=1", type: "video/mp4"} ] }).share(shareOptions); }); New bipolar disorder study shows that a ketogenic diet leads to mental and physical health benefits. Dr. Iain Campbell, PhD, Baszucki Metabolic Psychiatry Research Fellow, shares how his personal experience alleviating bipolar disorder symptoms through ketosis led to the genesis of a pilot trial published this week in BJPsych Open. Dr. Campbell provides a summary of the report findings while study participants share personal testimonials of their experience. This work highlights the potential of metabolic interventions for mental health conditions. This video is a product of Metabolic Mind, a nonprofit initiative of Baszucki Group. To learn more about metabolic approaches to mental disorders, including ketogenic therapy, visit Metabolic Mind (metabolicmind.org). (Photo: Business Wire) New bipolar disorder study shows that a ketogenic diet leads to mental and physical health benefits. Dr. Iain Campbell, PhD, Baszucki Metabolic Psychiatry Research Fellow, shares how his personal experience alleviating bipolar disorder symptoms through ketosis led to the genesis of a pilot trial published this week in BJPsych Open. Dr. Campbell provides a summary of the report findings while study participants share personal testimonials of their experience. This work highlights the potential of metabolic interventions for mental health conditions. This video is a product of Metabolic Mind, a nonprofit initiative of Baszucki Group. To learn more about metabolic approaches to mental disorders, including ketogenic therapy, visit Metabolic Mind (metabolicmind.org). (Photo: Business Wire) MPEG-4 Video Image Full Size Small Preview Thumbnail February 28, 2025 11:50 AM Eastern Standard Time SAN MATEO, Californie--(BUSINESS WIRE)--Le groupe Baszucki a annoncé aujourd'hui une nouvelle étude pilote sur un régime cétogène pour le trouble bipolaire. « Pour la première fois depuis des années, j'ai eu l'impression que mon cerveau fonctionnait enfin avec le bon carburant », a déclaré l'un des participants à l'étude. Publiée aujourd'hui dans le BJPsych Open, l'étude est la première à utiliser la neuroimagerie pour démontrer qu'un régime cétogène pourrait améliorer le métabolisme cérébral chez les individus ayant des troubles bipolaires. Avec plus de 100 ans de preuves concernant son efficacité dans l'épilepsie, le régime cétogène est désormais étudié dans le monde entier pour diverses affections psychiatriques et neurologiques. Cette étude européenne inédite, soutenue par le groupe Baszucki, a utilisé des techniques d'imagerie cérébrale avancées, notamment la spectroscopie par résonance magnétique (SRM), pour mesurer les changements dans le métabolisme cérébral. L'imagerie a révélé des réductions des neurotransmetteurs excitateurs généralement élevés dans le trouble bipolaire, suggérant un mécanisme potentiel derrière l'efficacité d'un régime cétogène. L'étude a également montré que les niveaux de cétones étaient corrélés à une amélioration des symptômes chez un sous-groupe d'individus ayant fourni des évaluations quotidiennes. Cet essai pilote ouvre une nouvelle voie importante pour la recherche et offre de l'espoir pour des options de traitement innovantes pour les personnes vivant avec cette maladie mentale grave. Codirigée par des scientifiques de l'Université d'Édimbourg, dont Iain Campbell, PhD, un boursier de recherche en psychiatrie métabolique Baszucki, Daniel Smith, MD, FRCPsych, dirigeant du service de psychiatrie, et Harry Campbell, MD, FRSE, FMedSci, l'équipe de recherche a recruté 27 participants atteints de trouble bipolaire dans un essai pilote de 6 à 8 semaines sur un régime cétogène. Vingt participants ont terminé l'étude, démontrant que l'intervention était sûre et tolérable pour cette population. La plupart ont atteint et maintenu un état de cétose, avec 91 % des lectures positives pour les cétones sanguines. Parmi les participants ayant fourni des évaluations quotidiennes fiables sur les niveaux de cétones et la santé mentale, une augmentation du niveau de cétones était corrélée à des améliorations de l'humeur, de l'énergie, de l'impulsivité et de l'anxiété, certains décrivant l'intervention comme une expérience qui a changé leur vie. « Le régime cétogène m'a donné une bouée de sauvetage, en me redonnant de l'énergie et de l'espoir », a déclaré un participant à l'étude. « J’avais l’impression de guérir mon esprit, pas seulement de gérer mes symptômes bipolaires, ce qui m’a ouvert de nouvelles possibilités et un avenir meilleur. » « L'utilisation d'un régime cétogène revient à donner à mon esprit un bain chaud », a déclaré un autre participant . « La nervosité a disparu. Je me sens plus calme, plus lucide, et mon cerveau fonctionne à nouveau. » Les marqueurs de la fonction métabolique se sont également améliorés. Dix-neuf des 20 participants ont perdu en moyenne 9,3 livres (4,2 kg) et ont vu des améliorations de leur indice de masse corporelle (IMC) ainsi que de leur tension artérielle. Ces résultats suggèrent qu'un régime cétogène pourrait aider à atténuer les risques pour la santé métabolique souvent associés au trouble bipolaire et à ses traitements pharmacologiques, qui peuvent entraîner une diminution de l'espérance de vie. « Nous avons observé des marqueurs de réduction de l'excitotoxicité dans deux zones clés du cerveau : le cortex cingulaire antérieur et le cortex cingulaire postérieur— tous deux impliqués dans le trouble bipolaire. Nous avons également observé des effets sur un marqueur associé à la signalisation du lithium et de l'insuline dans le cortex cingulaire postérieur », a déclaré le Dr Iain Campbell, qui vit également avec le trouble bipolaire et suit un régime cétogène pour soulager ses symptômes. « Ces résultats viennent s'ajouter à un ensemble de preuves encore limité, mais en croissance, suggérant qu'un régime cétogène pourrait être une intervention métabolique adjuvante efficace pour le trouble bipolaire. Il est urgent de mener des études de réplication plus larges et des essais cliniques randomisés soigneusement conçus pour approfondir ces découvertes. » Ces changements sont en accord avec l'hypothèse du surcroît métabolique, une théorie proposée par les Drs. Campbell, qui postule que la dysrégulation énergétique est au cœur du mécanisme du trouble bipolaire et que corriger cette dysrégulation pourrait être la clé du succès de la thérapie par régime cétogène. Une nouvelle frontière pour la santé mentale Cette étude pilote a ouvert la voie à une initiative plus large à l'Université d'Édimbourg, rendue possible par une subvention de recherche compétitive du UKRI Medical Research Council, qui a permis de créer le premier Hub européen de psychiatrie métabolique. Ce hub, auquel le groupe Baszucki a également contribué financièrement, est une collaboration de plus de 100 scientifiques dédiés à accélérer la recherche sur les liens entre le métabolisme et la santé mentale. Son objectif est d'explorer le potentiel de la thérapie cétogène et d'autres interventions métaboliques pour traiter les maladies mentales graves. Cette étude est la deuxième étude pilote récemment publiée qui démontre l’innocuité et le potentiel de la thérapie cétogène pour améliorer à la fois les marqueurs de la santé métabolique et mentale dans le cadre des maladies mentales graves. Le premier essai, également financé par le groupe Baszucki, a été mené à l'Université de Stanford et a également suggéré que les changements métaboliques systémiques liés à un régime cétogène pourraient contribuer à la stabilisation du cerveau dans les maladies mentales graves. « Cet essai est une autre étape importante dans l'établissement de la thérapie cétogène en tant que traitement standard pour les maladies mentales graves », a déclaré Jan Ellison Baszucki, cofondatrice et présidente du groupe Baszucki. « Nous sommes fiers d'avoir soutenu cette recherche et nous espérons que les études en cours continueront à faire progresser notre compréhension de l'intervention métabolique qui a sauvé la vie de notre fils ». Alors que l'on prend de plus en plus conscience du lien étroit entre la fonction métabolique et la santé du cerveau, cette étude fait progresser le mouvement scientifique mondial en faveur d'approches neurométaboliques pour la compréhension et le traitement des maladies mentales. À propos du groupe Baszucki Lancé en 2021 par David Baszucki, fondateur et président-directeur général de Roblox, et Jan Ellison Baszucki, auteur de best-sellers, le groupe Baszucki, s'appuie sur les dons privés, l'investissement d'impact, le plaidoyer, la narration et la construction de communautés pour provoquer un changement fondamental. L'un des principaux objectifs du groupe Baszucki est de révolutionner les résultats en matière de santé mentale en soutenant des initiatives à l'intersection du métabolisme, de la psychiatrie et des neurosciences. Pour en savoir plus sur les approches métaboliques des troubles mentaux, y compris la thérapie cétogène, visitez le site Metabolic Mind, une initiative à but non lucratif du groupe Baszucki. Le texte du communiqué issu d’une traduction ne doit d’aucune manière être considéré comme officiel. La seule version du communiqué qui fasse foi est celle du communiqué dans sa langue d’origine. La traduction devra toujours être confrontée au texte source, qui fera jurisprudence. Contacts Colby Zintl colby@baszuckigroup.org // Add toggle of sharing section var internalToggle = new BWToggle("bw-release-internal", "#bw-release-internal h2", "#bw-internal-content"); internalToggle.set(false);'''
