Image Full Size Small Preview Thumbnail February 28, 2025 11:53 AM Eastern Standard Time 加州聖馬提歐--(BUSINESS WIRE)--(美國商業資訊)-- Baszucki Group今天宣布了一項關於生酮飲食對雙相情感障礙影響的新先導性研究。「多年來，我第一次感覺我的大腦終於用上了合適的『燃料』。」該研究的一位參與者說道。這項研究今天發表在《英國精神病學雜誌：開放版》( BJPsych Open )上，是首次利用神經影像學來證明生酮飲食可能改善被診斷患有雙相情感障礙個體的大腦代謝。生酮飲食在癲癇治療方面已有超過100年的有效證據，如今，世界各地都在研究它對各種精神和神經疾病的作用。 這項由Baszucki Group支援的歐洲首例此類研究使用了先進的大腦成像技術，包括磁共振波譜成像(MRS)，來測量大腦代謝的變化。成像結果顯示，雙相情感障礙中通常升高的興奮性神經遞質有所減少，這顯示了生酮飲食有效性背後的一種潛在機制。該研究還顯示，在那些進行每日自我評估的參與者中，有一部分人的酮體水準與症狀改善相關。這項先導性試驗為研究指明了一個重要的新方向，並為患有這種嚴重精神疾病的病患提供了創新治療方案的希望。 該研究由愛丁堡大學的科學家共同領導，其中包括Iain Campbell博士（Baszucki代謝精神病學研究員）、精神病學系主任Daniel Smith, MD, FRCPsych和Harry Campbell, MD, FRSE, FMedSci。研究團隊招募了27名雙相情感障礙病患，進行了為期6至8周的生酮飲食先導性試驗。20名參與者完成了研究，這顯示該介入措施在這一人群中是安全且可耐受的。大多數人達到並維持了酮症狀態，91%的血酮偵測結果呈陽性。在那些提供了可靠的每日酮體和心理健康資料評估的參與者中，酮體水準的升高與情緒、精力、衝動性和焦慮狀況的改善相關，有些人將這種介入描述為改變了他們的生活。 一位研究參與者表示：「生酮飲食給了我一條生命線，恢復了我的精力和希望。我感覺我終於在治癒我的心靈，而不僅僅是控制我的雙相情感障礙症狀。它為我開啟了新的可能性和更光明的未來。」 另一位參與者表示：「採用生酮飲食就像是給我的大腦洗了個熱水澡。那種煩躁不安的感覺消失了。我感覺更平靜、思維更清晰，我的大腦又能正常運轉了。」 代謝功能指標也有所改善。20名參與者中有19人平均減重9.3磅（4.2公斤），並且體重指數(BMI)和血壓都有所改善。這些發現顯示，生酮飲食可能有助於減輕與雙相情感障礙及其藥物治療相關的常見代謝健康風險，這些風險可能會導致壽命縮短。 Iain Campbell博士表示（他本人也患有這種疾病，並透過生酮飲食來緩解症狀）：「我們在大腦的兩個關鍵區域——前扣帶回皮質和後扣帶回皮質中觀察到了興奮性毒性降低的指標，這兩個區域都與雙相情感障礙有關。我們還觀察到一個指標的變化，該指標與後扣帶回皮質中的鋰和胰島素訊號傳導有關。這些結果為越來越多但仍相對較少的證據增添了新的內容，顯示生酮飲食可能是雙相情感障礙的一種有效的輔助代謝介入措施。我們迫切需要進行更大規模的重複研究和精心設計的隨機臨床試驗，以進一步證實這些發現。」 這些變化與代謝超速假說相一致，這是Campbell博士提出的一種理論，該理論認為能量調節失調是雙相情感障礙發病機制的核心，而解決這種失調問題可能是生酮飲食療法成功的關鍵。 心理健康領域的新尖端 這項先導性研究為愛丁堡大學的一項更廣泛的計畫奠定了基礎，這歸功於英國研究與創新署(UKRI)醫學研究委員會的一項競爭性研究資助，該資助協助建立了第一個歐洲代謝精神病學中心。Baszucki Group也為該中心提供了資金支援，100多名科學家透過該中心攜手合作，致力於加快對代謝與心理健康之間聯繫的研究。其重點是探索生酮療法和其他代謝介入措施在治療嚴重精神疾病方面的潛力。 這項研究是最近發表的第二項先導性試驗，證明了生酮療法在改善嚴重精神疾病病患的代謝和心理健康指標方面的安全性和潛在療效。第一項試驗也由Baszucki Group資助，在史丹佛大學進行，該試驗同樣顯示，生酮飲食引起的全身性代謝變化可能有助於穩定嚴重精神疾病病患的大腦功能。 Baszucki Group共同創辦人兼總裁Jan Ellison Baszucki表示：「這項試驗是將生酮療法確立為嚴重精神疾病標準治療方法的又一重要進展。我們很驕傲能夠支援這項研究，並希望正在進行的研究能夠繼續加深我們對這種代謝介入措施的理解，它曾挽救了我們兒子的生命。」 隨著人們對代謝功能與大腦健康之間深刻聯繫的體認不斷提高，這項研究推動了全球科學界朝著透過神經代謝方法理解和治療精神疾病的方向發展。 關於Baszucki Group Baszucki Group由Roblox創辦人兼執行長David Baszucki和暢銷書作家Jan Ellison Baszucki于2021年創立，該集團利用私人捐贈、影響力投資、宣傳宣導、故事講述和社群建設等方式推動根本性變革。Baszucki Group的一個主要目標是透過支援代謝、精神病學和神經科學交叉領域的研究計畫來改善心理健康狀況。如欲進一步瞭解精神障礙的代謝治療方法，包括生酮療法，請造訪Baszucki Group的非營利性計畫Metabolic Mind的網站。 免責聲明：本公告之原文版本乃官方授權版本。譯文僅供方便瞭解之用，煩請參照原文，原文版本乃唯一具法律效力之版本。 Contacts Colby Zintl colby@baszuckigroup.org // Add toggle of sharing section var internalToggle = new BWToggle("bw-release-internal", "#bw-release-internal h2", "#bw-internal-content"); internalToggle.set(false);'''
