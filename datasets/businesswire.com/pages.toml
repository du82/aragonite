title = "BeiGene annonce ses résultats financiers du quatrième trimestre et de l’année 2024 ainsi que des nouvelles de ses activités | Business Wire"
description = "BeiGene, Ltd. (NASDAQ : ONC ; HKEX : 06160 ; SSE : 688235), une société mondiale d’oncologie qui a l’intention de changer de nom pour devenir BeOne Me"
full_description = "BeiGene annonce ses résultats financiers du quatrième trimestre et de l’année 2024 ainsi que des nouvelles de ses activités Revenus mondiaux totaux de 1,1 milliard de dollars et 3,8 milliards de dollars pour le quatrième trimestre et l’année entière, soit des augmentations de 78 % et 55 %, respectivement ; réduction de la perte d’exploitation PCGR et obtention d’un revenu d’exploitation non-PCGR positif pour l’année entière Revenus mondiaux de BRUKINSA de 828 millions de dollars et de 2,6 milliards de dollars pour le quatrième trimestre et l’ensemble de l’année, soit des augmentations de 100 % et de 105 %, respectivement ; avancement des programmes au stade pivot pour l’inhibiteur de BCL2 sonrotoclax et pour le CDAC BTK BGB-16673 Avancement de 6 et 13 nouvelles entités moléculaires (NEM) en clinique au quatrième trimestre et sur l’ensemble de l’année, respectivement ; anticipation de multiples données pour les programmes innovants sur les tumeurs solides au cours du premier semestre 2025 Prévisions de revenus pour l’année 2025 de 4,9 à 5,3 milliards de dollars, réaffirmation d’un résultat d’exploitation PCGR positif et d’une génération de flux de trésorerie à partir des opérations en 2025 Download Image Full Size Small Preview Thumbnail (Graphic: Business Wire) (Graphic: Business Wire) Image Full Size Small Preview Thumbnail Image Full Size Small Preview Thumbnail March 01, 2025 08:02 PM Eastern Standard Time SAN MATEO, Californie--(BUSINESS WIRE)--BeiGene, Ltd. (NASDAQ : ONC ; HKEX : 06160 ; SSE : 688235), une société mondiale d’oncologie qui a l’intention de changer de nom pour devenir BeOne Medicines Ltd., a annoncé aujourd’hui les résultats financiers et des nouvelles de l’entreprise pour le quatrième trimestre et l’année complète 2024. « Nos résultats du quatrième trimestre et de l’année complète démontrent notre formidable croissance en tant que géant mondial de l’oncologie, renforcée par le succès continu de BRUKINSA et le développement de l’un des pipelines de tumeurs solides les plus prolifiques en oncologie, avec de multiples données attendues cette année », déclare John V. Oyler, cofondateur, président du conseil d’administration et directeur général de BeiGene. « BRUKINSA est aujourd’hui le leader incontesté en termes de traitements de nouveaux patients atteints de LLC aux États-Unis, détient l’étiquette la plus large de tous les inhibiteurs de BTK et sert de pierre angulaire à notre franchise hématologique, montrant d’immenses promesses en tant qu’épine dorsale aux côtés de notre inhibiteur de BCL2 en phase avancée, sonrotoclax, et de notre CDAC BTK potentiel, le premier de sa catégorie. Nous construisons également de futures franchises de tumeurs solides dans les cancers du sein, du poumon et gastrointestinaux en tirant parti de nos plateformes d’anticorps multi-spécifiques, de dégradateurs de protéines et de conjugués anticorps-médicaments. L’année 2025 marque un point d’inflexion, car nous prévoyons d’atteindre un résultat d’exploitation PCGR positif et un flux de trésorerie d’exploitation, parallèlement à notre intention de devenir BeOne avec notre nouveau ticker NASDAQ, ONC. » Aperçu financier du quatrième trimestre et de l’année complète 2024 (Montants en milliers de dollars américains et non audités) Quatrième trimestre Année complète 2024 2023 % de changement 2024 2023 % de changement Revenus nets des produits $ 1 118 035 $ 630 526 77 % $ 3 779 546 $ 2 189 852 73 % Revenus nets des collaborations $ 9 789 $ 3 883 152 % $ 30 695 $ 268 927 (89 ) % Total des revenus $ 1 127 824 $ 634 409 78 % $ 3 810 241 $ 2 458 779 55 % Perte d’exploitation PCGR $ (79 425 ) $ (383 795 ) (79 ) % $ (568 199 ) $ (1 207 736 ) (53 ) % Résultat (perte) d’exploitation ajusté* $ 78 603 $ (267 224 ) 129 % $ 45 356 $ (752 473 ) 106 % * Pour une explication de notre utilisation des mesures financières non-PCGR, voir la section « Note sur l’utilisation des mesures financières non PCGR » plus loin dans ce communiqué de presse et pour un rapprochement de chaque mesure financière non-PCGR avec les mesures PCGR les plus comparables, voir le tableau à la fin de ce communiqué de presse. Principales nouvelles commerciales BRUKINSA® (zanubrutinib) est une petite molécule inhibitrice de la BTK, disponible par voie orale, conçue pour inhiber complètement et durablement la protéine BTK en optimisant sa biodisponibilité, sa demi-vie et sa sélectivité. Avec une pharmacocinétique différenciée par rapport aux autres inhibiteurs de BTK approuvés, il a été démontré que BRUKINSA inhibe la prolifération des cellules B malignes dans un certain nombre de tissus pertinents pour la maladie. BRUKINSA possède l’étiquette la plus large de tous les inhibiteurs de la BTK et est le seul inhibiteur de la BTK à offrir la flexibilité d’une ou deux prises par jour. Le programme de développement clinique de BRUKINSA comprend environ 7 100 patients recrutés à ce jour dans plus de 30 pays et régions, dans le cadre de plus de 35 essais. BRUKINSA est approuvé dans plus de 70 marchés et plus de 180 000 patients ont été traités dans le monde. Les ventes américaines de BRUKINSA ont totalisé 616 millions de dollars et 2,0 milliards de dollars au quatrième trimestre et pour l’ensemble de l’année 2024, soit une croissance de 97 % et 106 %, respectivement, par rapport aux périodes de l’année précédente, plus de 60 % de la croissance de la demande d’un trimestre à l’autre provenant de l’utilisation élargie dans la leucémie lymphoïde chronique (LLC), BRUKINSA ayant continué à gagner des parts de marché en tant que leader en termes de traitement de nouveaux patients aux États-Unis. Les ventes de BRUKINSA en Europe ont totalisé 113 millions de dollars et 359 millions de dollars au quatrième trimestre et pour l’ensemble de l’année 2024, soit une croissance de 148 % et 194 %, respectivement, par rapport aux périodes de l’année précédente, grâce à l’augmentation de la part de marché sur tous les principaux marchés, notamment l’Allemagne, l’Italie, l’Espagne, la France et le Royaume-Uni ; et Conclusion d’un accord de règlement du litige en matière de brevets avec MSN Pharmaceuticals, Inc. et MSN Laboratories Private Ltd. accordant à MSN le droit de vendre une version générique de BRUKINSA aux États-Unis au plus tôt le 15 juin 2037, sous réserve d’une accélération ou d’une extension potentielle dans des circonstances habituelles pour un règlement de ce type. TEVIMBRA® (tislelizumab) est un anticorps monoclonal humanisé de type immunoglobuline G4 (IgG4) anti-protéine 1 de mort cellulaire programmée (PD-1) de haute affinité et spécificité de liaison contre PD-1 ; il est conçu pour minimiser la liaison aux récepteurs Fc-gamma (Fcγ) sur les macrophages, aidant ainsi les cellules immunitaires de l’organisme à détecter et à combattre les tumeurs. TEVIMBRA est l’actif fondamental du portefeuille de BeiGene dans le domaine des tumeurs solides et a démontré son potentiel dans de multiples types de tumeurs et de maladies. Le programme de développement clinique de TEVIMBRA comprend près de 14 000 patients recrutés à ce jour dans 35 pays et régions dans le cadre de 70 essais, dont 21 études permettant l’enregistrement. TEVIMBRA est approuvé dans 45 marchés et plus de 1,3 million de patients ont été traités dans le monde. Les ventes de tislelizumab ont totalisé 154 millions de dollars et 621 millions de dollars au quatrième trimestre et pour l’ensemble de l’année 2024, soit une croissance de 20 % et 16 %, respectivement, par rapport aux périodes de l’année précédente ; Obtention de l’approbation de la Food and Drug Administration (FDA) des États-Unis en association avec une chimiothérapie à base de platine et de fluoropyrimidine pour le traitement de première ligne de l’adénocarcinome gastrique ou de la jonction gastro-œsophagienne HER2-négatif non résécable ou métastatique chez les adultes dont les tumeurs expriment PD-L1 (≥1) ; et Obtention de l’approbation de la Commission européenne (CE) en association avec la chimiothérapie pour le traitement de première ligne du carcinome épidermoïde de l’œsophage et de l’adénocarcinome gastrique ou de la jonction gastro-œsophagienne. Principales caractéristiques du pipeline La stratégie de portefeuille de BeiGene met l’accent sur la production rapide de données de preuve de concept clinique à un stade précoce, grâce à son approche rapide et économique (« Fast to Proof of Concept ») des opérations de développement mondial. L’équipe interne de recherche et développement de la société, y compris les opérations cliniques et le développement, comprend près de 3 700 collègues qui mènent des essais sur six continents et s’efforcent d’assurer une qualité rigoureuse des données en collaborant avec les organismes de réglementation et les chercheurs dans plus de 45 pays. Cette approche stratégique permet de maximiser les ressources en canalisant les investissements générés par les données vers les candidats les plus prometteurs et les plus différenciés sur le plan clinique, et en donnant la priorité aux autres. Avec l’une des plus grandes équipes de recherche en oncologie de l’industrie, BeiGene a démontré ses forces dans la découverte translationnelle de petites molécules et de produits biologiques, y compris trois technologies de plateforme : les anticorps multispécifiques, les composés chimériques d’activation de la dégradation (CDAC) et les conjugués anticorps-médicaments (ADC). Hématologie BRUKINSA Lors de la réunion annuelle de l’American Society of Hematology (ASH), BRUKINSA a présenté le suivi à 5 ans de l’étude SEQUOIA ; après ajustement pour l’impact de COVID-19, l’étude a démontré que le traitement par BRUKINSA réduisait le risque de progression ou de décès de 75 % par rapport à la bendamustine-rituximab chez les patients atteints de LLC naïve de traitement (TN) ; Prévoir les approbations de la FDA et de la CE pour la formulation en comprimés de BRUKINSA au cours du second semestre 2025 ; Prévoir une analyse intermédiaire de la survie sans progression pour l’étude de phase 3 MANGROVE dans le lymphome à cellules du manteau TN (MCL) au cours du second semestre 2025 ; et Fin du recrutement pour la partie de l’étude de phase 3 MAHOGANY portant sur le lymphome folliculaire récidivant/réfractaire (R/R) au cours du second semestre 2025. Sonrotoclax (inhibiteur de BCL2) Les données des essais de phase 2 sur la LLC R/R et la MCL R/R devraient être disponibles et des demandes d’homologation accélérées pourraient être déposées au cours du second semestre 2025 ; À l’ASH, présentation des données de la cohorte d’expansion de 320 mg d’une étude de phase 1/1b après un suivi médian de 1,5 an, démontrant l’absence de progression chez les patients atteints de LLC TN en association avec BRUKINSA ; Plus de 1 800 patients ont été recrutés à ce jour dans l’ensemble du programme ; Fin du recrutement pour l’étude de phase 3 CELESTIAL dans la LLC-TN ; Le recrutement des premiers sujets dans les essais mondiaux de phase 3 pour la LLC R/R et la MCL R/R est prévu pour le premier semestre 2025 ; et Poursuite du recrutement dans l’essai mondial de phase 2 dans la macroglobulinémie de Waldenström. BGB-16673 (BTK CDAC) Poursuite du recrutement de patients susceptibles de participer à l’étude de phase 2 sur la LLC R/R, dont les résultats sont attendus en 2026 ; Plus de 500 patients ont été recrutés à ce jour dans l’ensemble du programme ; Prévoir le lancement d’un essai de phase 3 dans la LLC R/R par rapport au choix du médecin au cours du premier semestre 2025 ; et Début d’un essai de phase 3 en tête-à-tête avec le pirtobrutinib, un inhibiteur non covalent de la BTK, dans la LLC R/R au cours du second semestre 2025. Tumeurs solides Prévision des données sur le BGB-43395 (inhibiteur de CDK4), le BG-68501 (inhibiteur de CDK2) et le BG-C9074 (ADC B7H4) au cours du premier semestre 2025, et des données internes de preuve de concept sur le BG-60366 (CDAC EGFR), le BGB-53038 (inhibiteur panKRAS), le BG-C137 (ADC FGFR2b), le BGB-C354 (ADC B7H3), et le BG-C477 (ADC CEA) au cours du second semestre 2025. Cancer du poumon Tarlatamab (AMG757, DLL3xCD3 BiTE) : les données de l’étude de phase 3 sur le cancer du poumon à petites cellules de deuxième ligne devraient être disponibles au cours du premier semestre 2025 ; Advan-TIG-302 (anticorps TIGIT) : les données intermédiaires de l’étude de phase 3 sur le cancer du poumon non à petites cellules de première ligne avec un taux élevé de PD(L)1 devraient être disponibles au cours du second semestre 2025 ; BG-60366 (EGFR CDAC) : entrée en clinique au quatrième trimestre 2024 ; mécanisme de dégradation différencié pour abolir complètement la signalisation de l’EGFR ; très puissant pour les mutations de l’EGFR sensibles et résistantes à l’osimertinib ; données précliniques solides sur l’efficacité avec un dosage oral et quotidien ; BG-89894 (inhibiteur de MAT2A) : entrée en phase d’escalade de dose au quatrième trimestre 2024 ; caractéristiques potentielles de meilleur de sa catégorie avec une puissance et une pénétration cérébrale supérieures ; forte synergie entre PRMT5i et MAT2Ai dans les modèles précliniques ; BGB-58067 (inhibiteur PRMT5 coopératif MTA) : entrée en clinique début janvier 2025 ; potentiel de meilleur de sa catégorie avec une puissance, une sélectivité et une pénétrabilité cérébrale élevées ; et BG-T187 (anticorps trispécifique EGFR x MET) : début de l’escalade des doses au quatrième trimestre 2024 ; conception biparatopique MET différenciée avec une activité inhibitrice MET optimale pour poursuivre l’opportunité de devenir le meilleur de sa catégorie. Cancers du sein et gynécologiques BGB-43395 (inhibiteur de CDK4) : poursuite de l’escalade de la dose en monothérapie et en association avec le fulvestrant et le létrozole dans la fourchette de dose efficace anticipée ; plus de 180 patients ont été recrutés à ce jour et la preuve de concept est attendue au premier semestre 2025 ; planification en cours pour un essai de phase 3 dans le cancer du sein métastatique de deuxième ligne HR+/HER2- en association avec une thérapie endocrinienne ; et BG-68501 (inhibiteur de CDK2) et BG-C9074 (ADC B7H4) : poursuite de l’escalade de la dose en monothérapie ; plus de 50 patients et plus de 70 patients ont été recrutés à ce jour, respectivement. Cancers gastrointestinaux Zanidatamab (anticorps bispécifique HER2) en association avec le tislelizumab et la chimiothérapie : anticipation des données primaires de PFS de l’étude de phase 3 dans l’adénocarcinome gastro-œsophagien HER2-positif de première ligne au cours du second semestre 2025 ; et NEM avancés en clinique au cours du quatrième trimestre 2024 : BGB-53038 (inhibiteur panKRAS) : très puissant et sélectif avec une large activité contre les mutations KRAS dans de multiples types de tumeurs ; limite la toxicité en épargnant les autres protéines RAS ; les mutations KRAS sont présentes dans 19 pour cent des cancers ; et BG-C137 (ADC FGFR2b) : premier ADC potentiel de sa catégorie pour une cible v"
