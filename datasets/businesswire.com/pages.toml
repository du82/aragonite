title = "Riassunto: Un nuovo studio sul disturbo bipolare dimostra gli effetti benefici di una dieta chetogenica sulla salute mentale e fisica | Business Wire"
description = "New bipolar disorder study shows that a ketogenic diet leads to mental and physical health benefits. Dr. Iain Campbell, PhD, Baszucki Metabolic Psychiatry Research Fellow, shares how his personal experience alleviating bipolar disorder symptoms through ketosis led to the genesis of a pilot trial published this week in BJPsych Open. Dr. Campbell provides a summary of the report findings while study participants share personal testimonials of their experience. This work highlights the potential of metabolic interventions for mental health conditions. This video is a product of Metabolic Mind, a nonprofit initiative of Baszucki Group. To learn more about metabolic approaches to mental disorders, including ketogenic therapy, visit Metabolic Mind (metabolicmind.org)."
full_description = '''Un nuovo studio sul disturbo bipolare dimostra gli effetti benefici di una dieta chetogenica sulla salute mentale e fisica Il primo studio pilota di questo genere in Europa dimostra miglioramenti a livello di umore, energia e ansia, con buone speranze per un nuovo trattamento per la salute mentale Download MPEG-4 Video Loading media player... jQuery(function() { //create video element var attributes = { 'id': 'news_video', 'class': 'video-js vjs-default-skin', 'width': '640', 'data-height': '264', 'onloadstart': 'this.volume=0.4' } var element = $('<video/>').attr(attributes); $('#media-player').html(element); //Social share var shareOptions = { socials: ['fbFeed', 'tw', 'linkedin', 'mail'], url: window.location.href, title: 'Riassunto: Un nuovo studio sul disturbo bipolare dimostra gli effetti benefici di una dieta chetogenica sulla salute mentale e fisica', description: 'BusinessWire news share', image: 'https://mms.businesswire.com/media/20250211079837/it/2377556/5/2024_11_11_Edinburgh_Landscape_Video_CC.jpg', // required for Facebook and Messenger fbAppId: '140586622674265', // optional for Facebook redirectUri: window.location.href + '#close', } //activate Video.JS theme videojs('news_video', { controls: true, autoplay: false, preload: 'auto', poster: 'https://mms.businesswire.com/media/20250211079837/it/2377556/5/2024_11_11_Edinburgh_Landscape_Video_CC.jpg', sources: [ {src: "https://mms.businesswire.com/media/20250211079837/it/2377556/19/2024_11_11_Edinburgh_Landscape_Video_CC.mp4&.mp4?download=1", type: "video/mp4"} ] }).share(shareOptions); }); New bipolar disorder study shows that a ketogenic diet leads to mental and physical health benefits. Dr. Iain Campbell, PhD, Baszucki Metabolic Psychiatry Research Fellow, shares how his personal experience alleviating bipolar disorder symptoms through ketosis led to the genesis of a pilot trial published this week in BJPsych Open. Dr. Campbell provides a summary of the report findings while study participants share personal testimonials of their experience. This work highlights the potential of metabolic interventions for mental health conditions. This video is a product of Metabolic Mind, a nonprofit initiative of Baszucki Group. To learn more about metabolic approaches to mental disorders, including ketogenic therapy, visit Metabolic Mind (metabolicmind.org). New bipolar disorder study shows that a ketogenic diet leads to mental and physical health benefits. Dr. Iain Campbell, PhD, Baszucki Metabolic Psychiatry Research Fellow, shares how his personal experience alleviating bipolar disorder symptoms through ketosis led to the genesis of a pilot trial published this week in BJPsych Open. Dr. Campbell provides a summary of the report findings while study participants share personal testimonials of their experience. This work highlights the potential of metabolic interventions for mental health conditions. This video is a product of Metabolic Mind, a nonprofit initiative of Baszucki Group. To learn more about metabolic approaches to mental disorders, including ketogenic therapy, visit Metabolic Mind (metabolicmind.org). MPEG-4 Video Image Full Size Small Preview Thumbnail February 28, 2025 11:52 AM Eastern Standard Time SAN MATEO, California--(BUSINESS WIRE)--Baszucki Group oggi ha annunciato un nuovo studio pilota su una dieta chetogenica nel disturbo bipolare. "Per la prima volta da anni ho avuto la sensazione che il mio cervello stesse finalmente funzionando con il carburante giusto", ha dichiarato uno dei partecipanti allo studio. Pubblicato oggi sulla rivista BJPsych Open, lo studio per la prima volta utilizza l'imaging cerebrale per dimostrare come una dieta chetogenica possa essere in grado migliorare il metabolismo del cervello negli individui con diagnosi di disturbo bipolare. Il testo originale del presente annuncio, redatto nella lingua di partenza, è la versione ufficiale che fa fede. Le traduzioni sono offerte unicamente per comodità del lettore e devono rinviare al testo in lingua originale, che è l'unico giuridicamente valido. Contacts Colby Zintl colby@baszuckigroup.org // Add toggle of sharing section var internalToggle = new BWToggle("bw-release-internal", "#bw-release-internal h2", "#bw-internal-content"); internalToggle.set(false);'''
