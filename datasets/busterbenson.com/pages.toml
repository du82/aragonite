title = "38 is great: cultivate quality time - Buster's Notes"
description = "This is my 9th year of yearly birthday reflections. Here are the previous 8:"
full_description = "Buster's Notes The Piles Annual Reviews My Life in Weeks Quirky Clock Codex Vitae My Book About RSS 38 is great: cultivate quality time My year in review. This is my 9th year of yearly birthday reflections. Here are the previous 8: 37: More kiloslogs 36: Talk it out 35: Love the struggle 34: Cultivating the core 33: Frugal to the max 32: No problem 31: Double down 30: Higher highs and lower lows It is also the 6th anniversary-ish of my 8:36pm project (see the story here). This year I took a photo at 8:36pm on 339 out of the 365 days, missing 26, for a 93% success rate. Over the 6 years in all I’ve taken a photo on 2,114 of the 2,197 days, for an overall success rate of 96.2%. Update on last year’s motto: more kiloslogs My 37th year started off on an exploration of the kiloslog, which is my made-up word representing the idea of working slowly towards a distant goal (see 1 Metric Kiloslog for a full explanation). I set the goal to do 1,000 small things that would get me closer to running a marathon. I’ve been thinking about this all year and ended up finally going on a couple 5+ mile runs in the last few weeks after spending almost an entire year working on knee issues. I actually felt quite victorious even with this small goal since the frustration of this particular knee issue has felt extremely frustrating in its lack of progress despite PT, stretching, and lots of patience. I’m still not entirely sure that I’ll be able to fully recover without giving in to knee surgery, but since it’s gotten a bit better recently I’m holding out hope. That said, I also have a referral for a good local orthopedic surgeon to take a look the second I lose hope. I did stop using technology to track my progress around 900/1000, because I found that the work of tracking was as difficult as the work itself. A common theme in my frustrations with quantified self and self-tracking in general. In addition to working on the kiloslog towards running a marathon, I’ve also started fixating on an even longer-term health vision: to ride a bike on my 100th birthday. I like thinking about this for a couple reasons: It’s a silly visualization. I can actually sort of picture myself, aged 100, getting on a bike and wobbling down the street. Perhaps a crowd is cheering me on. Perhaps we live in a cloud city and we’re all cyborgs. The daydream is ripe with material to play around with. It gives my health goal a purpose. The intrinsic motivation that this taps into is part of my core quality of life motivation. I want to enjoy a long, healthy life, for the purposes of enjoying it all the way through to a simple activity on my 100th birthday. It’s flexible in the short-term but encourages long-term consistency. I don’t have to sweat the small things that aren’t going to make a long-term impact, simply because they are part of some program that’s supposed to have a short term impact. This single, silly, vivid health vision informs my eating habits, my exercise routine (for the kiloslog and other stuff), my stress levels, my creativity, and my social habits. It’s a single ribbon that ties it all together, paces me, keeps and makes me happy to think about. What would you like to do on your 100th birthday? Replace 100th birthday with whatever birthday you think represents the pinnacle of a life worth living. If you think of something, tweet it to me. That’s basically where my thoughts on behavior change, health-improvement, and quantified self ended up for the year. Nothing earth-shattering or billion dollar start-up worthy, but it feels right to me and I’m gonna stick with it for now. New ideas for the new year A couple themes / ideas have been swirling around in my head, seemingly unconnected for the most part. The kiloslog mentioned above is one of them. Here are some very brief descriptions of a few others: The Codex Vitae: This is an idea coined by Robin Sloan in his book Mr Penumbra’s 24-Hour Bookstore. The idea is that you write a book, the Codex Vitae or Book of Life, that represents everything you have learned in your life. You work on drafts your entire life and it gets stored and read by a privileged few upon your death. Expanding a bit further on it, I think this is a great way of thinking about self-expression. Our lives are filled with a desire to know the universe, and to be known. To leave a dent. This is just my English-major-y way of representing the dent in the form of a text, because words are so cool. Maybe one day we’ll be able to download our brains into a computer and that would more directly represent our full body of knowledge from life. Quality Time: My own Codex Vitae’s first chapter could possibly be about quality time and its role as the primary ends (and means) for a fulfilled life. I see 3 kinds of quality time that we should seek out. The first is quality time with our own selves. Know thyself, and in the process find our deep interests and find people that we can connect deeply with. The second is quality time with those interests, and the third is quality time with those people we can connect deeply with. They each feed into each other, you can’t really connect deeply with others until you know yourself sufficiently well. And often times interests are strengthened by having people you can connect with and share with. It seems pretty ungameable to me. Seek quality time with yourself, your interests, and others and you will not regret anything on your death bed (see The Death Bed Game for more thoughts around that). Optionality: Or, as Nassim Nicolas Taleb calls it: antifragility. I like the word optionality because it seems more neutral, almost boring even, and yet it is probably one of the most simple and powerful ideas that I’ve ever encountered. The easiest way to describe it is the degree to which your eggs are in different baskets. The more baskets, and the more eggs, and the more evenly distributed those eggs are in those baskets, the higher the optionality. The beauty of optionality is that it has both protective and self-strengthening qualities. Say that you have 12 eggs in 1 basket. If something happens to that basket, all of your eggs are doomed (low optionality). On the other hand, say that you have 12 eggs in 6 baskets (2 in each). If something happens to one of the baskets, you still have 10 eggs (higher optionality). Now imagine that you have 12 eggs in 12 baskets, and every time one of the baskets is destroyed, one of the other eggs hatches and creates 2 new eggs and you get 2 new baskets. Now, say that all of the eggs are different colors, and that there are monsters that prefer certain colors of eggs for breakfast. As the monsters wake up every morning and have breakfast, the type of eggs that they like will become more rare. There will be more eggs left from colors that they don’t like. In a way, the set of eggs will become stronger (less likely to be eaten). This is how high optionality works. The final twist is that in order for this to really work, it has to have some level of randomness involved… because what if the monster also adapts over time and begins to prefer new colors of eggs… in order for the set of eggs to be safe from complete elimination, there should be enough variation in the colors that some eggs won’t get eaten… and that those eggs will hatch and grow and the population of future eggs will represent eggs that are less appetizing to monster. Optionality is the key to natural selection and evolution. It’s also the key to idea generation, investment strategy, product management, and many other things. Qualities of high optionality things include: A. A variety of options that aren’t connected to one another. For example, if you have 3 green eggs in 3 baskets and a green-egg eating monster comes, you’re going to lose all of your eggs even though they were in different baskets. Same if you own 3 different houses that are all on the same block and it gets hit by a flood, or 3 different emerging tech stocks when the equity markets dry up. True variety would imply that a disaster of any kind won’t take out all of your options… at least 1 must survive and it needs to be a strong one that has traits that led to its survival. Another word to describe this is that the options must be diversified. B. There should be relatively quick feedback loops. The period of time between “something bad happens” and “the population shifts to favor the stronger options” should be short. If 10 bad things happen before the population adapts, the optionality is lower than if it only takes 1 or 2 bad things to adapt. C. The adaptations must have some element of randomness. In other words, variety must not decrease over time, even if the environment becomes predictable. Eventually the environment will change in a new way, and then the variety will need to be sufficient to survive an unexpected change. If a green-egg eating monster turns into a red-egg eating monster, there should be some non-red eggs, and maybe even some green eggs, around. This makes logical sense, but in practice it seems counter-intuitive to build systems with high optionality. We tend to build systems that converge on a single design over time (see monocultures) because they are predictable and efficient in a given environment. But environments change, and without the ability to predict how those changes will happen ahead of time, optionality is required even in the safest of environments. I rambled on even longer about this topic here: Live like a hydra. Soloverse: This is the least-fully-formed idea of the bunch and something that I’m sure will shift over time. The universe is this giant space/time environment that we are all a part of. The soloverse is our mental model of the universe that our brain uses to think about the universe and everything in it. It turns out, we can’t really think about the universe directly (it’s way too big), we can only think about our mental model of the universe as it exists in our soloverse. I first came across this idea last year and found some interesting explorations of the idea referenced by the word umwelt, which is German for “environment” or “surroundings” and pronounced ooom-velt. I just made up the term soloverse because it’s easier for me to think of it as a private universe in our minds. A few thoughts about soloverses: A. The soloverse is our local cache of the universe. When we’re babies, our caches are not very primed, and we are forced to take in the full firehose of the universe… unsorted, uncategorized, raw. It’s overwhelming. Our brains are designed to start building this soloverse almost immediately in order to gain some foothold on the raw craziness of all the information coming in. The soloverse is built up from basic building blocks like light and dark, smells, sounds, and eventually patterns (mom, hungry, cold, soft), and then eventually concepts (blanket, food) and meanings (safe, scared, good, bad). B. What we think of as the universe is actually our soloverse. From these basic building blocks we create beliefs and build simulations that allow us to predict future occurrences (if I cry, mom will come to me). At some point we arrive at a concept of our own selves and other people. “The concept of a person is arguably the most important interface ever developed.” — Kevin Smokler C. The soloverse contains gods and archetypes. Some of our most powerful beliefs and traditional characters (God, the hero, the devil, the wizard, the fairy godmother) all exist only in our soloverses. Unicorns, dragons, Santa, astrology, luck, fairness, truth, good and evil, beginning middle and end, physics, etc are all shadows of the structure that our soloverse is running on (our brains, and the pattern matching hierarchies that they are built from) and most likely absent from the universe that they are attempting to model. This quirk is actually really fascinating to explore. D. The soloverse is the most powerful tool we have. The model of the universe that we each have is highly personal, and idiosyncratic to the experiences we’ve had. There are also large portions of which there is probably lots of overlap (common sense, myths, popular culture, things we learn in school, etc). An unhealthy soloverse could lead to poor/misinformed decision-making. An unhealthy soloverse could be responsible for cruelty, prejudice, hatred, wars, and all kinds of other unfortunate things. What could we do to help ourselves and each other have healthier soloverses? Could we address this issue directly and have an impact? E. A comprehensively complete soloverse must also model every other soloverse that exists. In order to build a real “to scale” model of the universe it has to also include every other soloverse out there, including itself. We can’t escape our personal soloverse, but we can make it a more hospitable place to live in the meantime. A new motto: cultivate quality time For the last 9 years now I’ve been doing some sort of birthday review. And for the last year I’ve been doing a monthly report that I send out to a small group of friends (inspired by Nick Crocker’s Elephants) with a quick update on monthly progress, some personal stuff, and a hello. Cultivating quality time means a couple things to me: it means attempting to remove circumstances that hinder quality time, and it means attempting to put into place or strengthen circumstances that encourage quality time. In my time using Reporter (see How I track my life) to get a better sense of the conditions that hinder and encourage quality time, the lowest hanging fruit appeared to be the condition of being well-rested. But I don’t want to get too pre-occupied with lowest hanging fruit. I want to build a sustainable style of living that supports frequent course correction (ie has optionality) towards quality time cultivation and which favors long-term sustainability over short-term momentum (ie behaves like a kiloslog). Here’s what I’ve come up with, in the form of a draft codex. Prototype of a Codex Vitae: How to play Every day: In the morning, read the list under Review Every Day. Every month: On the 1st of every month, read the list under Review Every Month. Every year: On your birthday, read the list under Review Every Year. Review Every Day Things I’d like to have primed in my brain every morning. This is stuff currently churning in the front of my brain, which probably has high turnover but which also has a good chance of getting somewhere new. Seek quality time: With myself, with other people, and with my interests. Look at what’s uncomfortable: Don’t avoid the unresolved, unwanted, conflicted things that would benefit from attention. Slog towards riding a bike on my 100th birthday: Eat mostly plants. Exercise regularly. Think decades, not days. Review/update this list Review Every Month Things I’d like to check in on the 1st of every month. Review the Lexicon Review my Beliefs Review my Personal Canon Write a new Monthly Report and share Review/update this li"
