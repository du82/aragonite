["https://busterbenson.com/2008/05/27/no-problem"]
title = "32: No problem - Buster's Notes"
description = "The theme of my 30th birthday, and the following year, was Higher highs and lower lows."
full_description = "Buster's Notes The Piles Annual Reviews My Life in Weeks Quirky Clock Codex Vitae My Book About RSS 32: No problem My 32nd year in review. The theme of my 30th birthday, and the following year, was Higher highs and lower lows. The theme of my 31st birthday, and the following year, was Double down. Double down on love, on friends, and on my projects. This year, I feel like I should shift the focus a bit. Not so much about building building building, and more about enjoying what has been built and what happens to exist. This is a big deal for me cause I almost always feel like I’m not doing enough. That I have to keep being more ambitious, thinking bigger, not getting too lax lest I fall into a rut, etc. Just as a reminder to myself, I’m gonna re-post my “unified theory of enjoyable living” which I started putting together in January of 2007 and have been adding to and editing since then: I. IN A NUTSHELL It’s not what you do, but how you do it It’s not what happens to you, but which qualities it brings out in you Do unto yourself and others always with your best judgment Pursue shared enjoyment II. PREPARATION Don’t dilly dally Don’t feel sorry for yourself Exercise, eat healthy, and manage stress Dress and appear as your best self Strive to know yourself Tell people about yourself Appreciate your different energy levels and moods Notice body language Keep your word Be the change you want to see in the world Harness the ability to focus your attention Be a beacon of strength III. EXECUTION Try to have good intentions Be the maker of your own meaning Participate in extraordinary problems Explore all options and hedge bets while exploring Be confidently all-in once a decision has been made Strive for a lifestyle vision Stake your reputation on your vision Invite others to help you Take responsibility and credit for your own failure and success Be comfortable with big failure and big success IV. CALIBRATION Retry things you don’t like or agree with every once in a while Consider criticism from people who know you Listen closely for things you can’t easily hear Relax and always give yourself and others a break Pictures from the party. May 27, 2008 · In these piles: self-reflection, year-in-review"
