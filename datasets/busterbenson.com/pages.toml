title = "Buster's Notes - Notes"
full_description = '''Buster's Notes The Piles Annual Reviews My Life in Weeks Quirky Clock Codex Vitae My Book About RSS November update! 12-09-2024 Month 2 of 9 in this experiment to grow 750 to sustainability I analyzed 15 years of testimonials from users of 750words.com to learn how their private journaling habits have helped them 12-03-2024 Or, how I plan to get around the task of marketing my site by letting people speak for themselves October report! Month one of this experiment in sustainability 11-13-2024 Month 1 of 9 in this experiment to grow 750 to sustainability A new way to share stats 10-24-2024 Testing a new sharing feature on 750 Words Want to help 750 Words become sustainable? 10-18-2024 A 9-month experiment in growing to sustainability 48 — Be Buster Benson, BBB, Be Be Be, 🐝🐝🐝 10-10-2024 My 48th year in review New Partner Program incentives focus on high-quality human writing 07-18-2023 Changes are coming in August to the way we pay writers for great stories and which countries we support. Here’s what’s happening, why, and what it means for you. New experimental feature: the Streak Fairy 06-11-2023 Repair your writing streak 47 — CHALANT! ☄️ 05-31-2023 My 47th year in review A Quirky Clock That Doesn’t Track Time 12-12-2022 The conspiracy of Time and how to let go. A Big Linky Map of Medium 12-07-2022 An attempt at sketching out a bird’s eye view of the wide variety of different kinds of stories people are writing on Medium How To Coach Yourself 10-24-2022 The standard model of behavior change is silly. Come read about my much weirder systems model! Ideas I'm Mulling 07-05-2022 A disorganized collection of short notes with no center. Blog about ideas I'm mulling 07-05-2022 A slow meditation of unrelated ideas that I'm mulling for various reasons. This Could Work podcast interview about 750 Words 05-31-2022 Good questions about how I use private journaling. 46: A Blagenflorble Heart 05-28-2022 My 46th year in review Pocket Tarot 08-21-2021 Early notes on the language in tarot cards. 45: Year of Reconstellation 05-28-2021 My 45th year in review Brackish Notes, Spring 2021 03-25-2021 A low-expectations, low-value blog of sorts Visualizing our shared mood, take one 01-28-2021 Results from the question about how we can best help A house covered in kudzu 01-10-2021 A return after 8 months of quiet with questions about a question Notes on Tim Urban's epic blog post series, "A Story of Us" 07-14-2020 I found a lot in here that resonated with me about how humans, and groups, and society all interconnect, and how it can become dysfunctional. Letter.wiki conversation on White Fragility 06-08-2020 A conversation with Jonathan Church on Robin DiAngelo's book, White Fragility. Notes on White Fragility, by Robin DiAngelo 06-03-2020 Raw notes on Robin DiAngelo's book Notes on Awakening from the Meaning Crisis, by John Vervaeke 06-01-2020 Raw notes with one quick pass on summarizing the 50 YouTube series. 44: Year of the Amateur 05-28-2020 My 44th year in review An Amateur’s Unfinished Map of Whatever Comes to Mind as This is Happening 05-28-2020 My new website. 750 Words V2 Updates, Timeline, Bugs 05-28-2020 I’ll keep it super simple and just keep this doc updated with the latest changes and news and thoughts happening as V2 is being built. Feel free to add comments or questions. One meaningful thing 04-07-2020 A space within upheaval. Why We Should Create Personal Mythologies (and How) 01-23-2020 An experiment in using mythic mode to confront the meaning crisis. Snake Fables, Book I 01-23-2020 A few prototype myths offered as an experiment in designing a personal mythology. What are the qualities of a wicked problem? 12-18-2019 They're personal, difficult, complex, and make us feel very conflicted. We need an alternative to the Hero’s Journey 12-14-2019 A pleasant oath to remember our humanity. Working on 750 Words V2 12-09-2019 10 years later, a chance to give this little side project the love it deserves. We Now Know Why We Are Yelling! 11-19-2019 O. M. G. My book is finally out! My book, Why Are We Yelling? The Art of Productive Disagreement 11-19-2019 Published November 19th, 2019 by Penguin Random House To Argue Productively, Meet in a Neutral Space 11-12-2019 The spaces where we disagree have a hidden effect on our arguments Testing the disagreement template 10-31-2019 If you're in a gnarly disagreement and you feel like the conversation keeps going in circles, here's one way out: tease apart the questions that get raised in the disagreement into FACTS, VALUES, and PROPOSALS. On Facebook, content moderation, free speech, and personal responsibility 10-25-2019 Using head, heart, and hands to understand a disagreement happening on Twitter about whether people have a moral responsibility to leave their jobs at Facebook. The Marvelous, Thinking Fractal That Is Us 10-24-2019 Take a break from whatever you’re doing to consider just how amazing it is that we exist simultaneously as a collective of intuitions, as individuals, as members of teams, organizations, nations, and as a small part of the natural world — all folded into a marvelous, thinking fractal. 8 ways to practice the art of productive disagreement 10-11-2019 A brief tour of the framework from Why Are We Yelling? Ooh look, a book 10-09-2019 I updated my book website with some new things. Podcast tour for Why Are We Yelling? 10-01-2019 A selection of podcasts I appeared on to talk about productive disagreement. An alternative to zingers 09-16-2019 3 interesting new developments in productive disagreement: etter.wiki, change a view, and impossible conversations. What Can We Do About Our Bias? 06-03-2019 A 4-step roadmap for developing an always-on, honest relationship to bias. 43: All in & with the flow 05-31-2019 My 43rd year in review. Pocket Biases 05-10-2019 Keep your friends close and your cognitive biases closer. Well that backfired 04-12-2019 History of a bias that got ahead of itself. How I bootstrapped my side project into a $20k/mo lifestyle business 04-03-2019 750 Words interview with Indie Hackers $1/month early bird special ⛅️ 03-22-2019 Join the inner circle. Oakland schools are struggling 02-20-2019 A 1–pager outlining evidence of the problem, diverse perspectives, and existing initiatives that attempt to address the problems. The Green New Deal is a 1-Pager for America 02-12-2019 It's meant to spark a conversation, so let's talk about it! History of my name 02-06-2019 A lot of people ask me if Buster is my real name. Here's the answer. The definition of “emotional labor” has changed 01-20-2019 Guidelines for Fruitful Dialogue 01-18-2019 A work-in-progress. Feedback encouraged. The Beginning of a Fruitful Dialogue 01-17-2019 Things we’ve seen and learned 10 days into the formation of a new friendly and diverse space on the internet. The Hippocratic Oath 01-17-2019 A pleasant oath to remember our humanity. Can a friendly and diverse dialogue exist between liberals and conservatives on the internet? 01-09-2019 Let’s learn from past mistakes and keep trying. Announcing a new friendly and diverse community: Fruitful 01-07-2019 Call for early adopters! 30 fundamentals 01-04-2019 Lots of things I agree with in John Nerst's 30 Fundamentals. Equilibriums and Limits: a better way to look at most every political issue 01-02-2019 Understand the difference between equilibriums and limits. Sarah Mei’s thread about the negative space of technology 12-31-2018 Every technology has both upsides and downsides. History of my beliefs (so far) 12-31-2018 My beliefs are constantly changing, and so are the tools I use to share them. Monopoly’s Anti-Capitalist, Socialist Roots as a Teaching Game at Wharton 12-30-2018 Games can and have been used as very effective educational tools. Should We Be Happy? 12-12-2018 A weird comic about happiness. A prisoner’s dilemma cheat sheet 07-29-2018 Because cooperation is hard. Dilemma! 07-21-2018 The 2nd ever prisoner’s dilemma tournament that happens entirely on Facebook. 42: Dig deeper 07-02-2018 My 42nd year in review. A rational person's 1-minute guide to why rational thinking often fails to persuade people 10-27-2017 Read this if you think learning about biases will make you more persuasive. Great zinger! 💫 08-15-2017 You get 1 zinger point for what you just said. 41: Seek endarkenment 05-28-2017 My 41st year in review. 7 Habits of Highly Effective People 02-06-2017 A classic. But one that has earned the reputation. Cognitive bias cheat sheet, simplified 01-07-2017 Follow-up on the original, trying to boil it down some more. Cognitive bias cheat sheet 09-01-2016 Original full analysis of 200+ cognitive biases. Codex Vitae - Better Humans 07-17-2016 Life of Clodia 06-01-2016 An incomplete choose-your-own-adventure story about an adventurous asteroid. 40: Mind the loops 05-28-2016 My 40th year in review. How Did This Happen? 02-08-2016 Round One: Humanity is destroyed by a super artificial intelligence. How did this happen??? Systems Thinking For Kids 09-20-2015 I figure if I can explain it to kids, then I'd understand it myself. 39: Make wiggle room 06-13-2015 My 39th year in review. The Element of Irreducible Rascality 05-27-2015 This is one of my favorite phrases coined by Alan Watts Self-coaching experiment results 11-29-2014 First 9 participants. Better than meditation 10-22-2014 Private journaling is a better alternative to meditation. Universe ↔ soloverse 10-18-2014 Each of us has an entire universe stored in our heads, and I call that the soloverse. 3-lane product development 08-10-2014 My take on building products people love. The Technology 07-30-2014 A sort of winding manifesto for building technology products. 38 is great: cultivate quality time 05-28-2014 My year in review. How I track my life 03-17-2014 The most important thing to track is quality time. The concept of a person 02-17-2014 The most important interface ever developed. Smarter than smart 02-17-2014 There are 2 ways to be smart. Make better resolutions 12-31-2013 Consider the environment that your resolutions are made in. Make your own @horse_ebooks 09-23-2013 Long live @horse_ebooks! Managing my internet rage 08-28-2013 Getting super angry isn’t as fun as it used to be. Live like a hydra 08-24-2013 Thoughts on how to get stronger when things are chaotic. What's your life change score? 07-25-2013 The higher, the more difficult it might be. The Elephants 07-13-2013 Using accountability as the primary tool for self-improvement is well-articulated here. The death bed game 06-29-2013 He/she who dies with the most death bed points, wins. Know Thy Umwelt 06-16-2013 I find a German word to help me articulate the idea of our internal mental copy of the universe. Experimenting with subjectivity 06-05-2013 After going to the Quantified Self conference last month and thinking about it for a few weeks, I’ve decided to start a new self-tracking experiment… 37: More kiloslogs 05-28-2013 My 37th year in review. Celebrate your next death day 05-17-2013 I just passed the mid-point. If I lived 100 times 05-04-2013 Predicting the year of my death. 1 metric kiloslog 04-22-2013 Three cognitive biases walk into a bar... 04-07-2013 Sometimes they can cancel each other out. Too simple, cheap, easy, obvious bias 03-20-2013 I made this one up. How to change yourself (v0.1) 03-18-2013 In 6 steps. Are your habits tiny or huge? 03-13-2013 Hint: there are no tiny habits. The game of life 03-05-2013 With 4 levels. My two brains 03-03-2013 Our filters 02-23-2013 The only way we see things. The long slog 02-19-2013 Different modes of work. $1 for you (conclusion) 01-28-2013 Reflections on the experiment. Is this your best possible work? 01-23-2013 This is the only question that really matters. Starter kit for a solar-powered self-replicating 3D printer that can make enough money to buy its own materials, pick them up, and print children when it feels ready. 01-04-2013 A silly invention that could destroy us. My 2013 resolution: memento morning 12-31-2012 My resolution for 2013. Rabbit Rabbit Resolution Accountability Squad 12-28-2012 Make only 1 resolution. "Anything is possible." 12-08-2012 As long as you have infinite time and resources. Codex Vitae 11-28-2012 A book that captures everything that you think is worth knowing about your life. Doesn't have to be a real book. Disconnect Saturdays 11-18-2012 A challenge. A/B fit 11-18-2012 Quality doesn’t exist as a stand-alone attribute. Only fitness does. What I'm tracking now and why 11-04-2012 Zoomed out 10-30-2012 My father passed away 19 years ago today. Behavior change is belief change 10-10-2012 Are we what we repeatedly do? Who you are vs who you want to be 10-06-2012 My first glimpse of IFS (Internal Family Systems). Look, look, look 10-05-2012 Robin Sloan's Fish tap-essay / manifesto about returning to things we love. $1 for you 09-26-2012 Help me stop complaining. The "I don't want to" habit 09-22-2012 Addressing our inner voices. Tweet fearlessly 09-16-2012 My reaction to the more careful social-media personas emerging when the internet started becoming professional. The half-plants diet 08-17-2012 I’ve been trying to reduce everything I know about health, and behavior change, and habits, into their simplest possible implementations. Here’s one I’ve been kicking around that’s eating related and I’d love your feedback on it (especially if you think you’d want to try to do it with me). A friendly safety reminder 08-17-2012 Nothing is safe. Why 'Just Do It' is bullshit 07-31-2012 Because everything isn't possible. Everything I (currently) know about starting and keeping habits in one long manifesto 07-25-2012 Written for the Bold Academy blog. A duck bears no grudges 07-11-2012 The post I wrote when we closed down Habit Labs. 36: Talk it out 05-28-2012 My 36th year in review. What I’ve learned taking photos every day at 8:36 p.m. 06-11-2011 I’ve learned that there is beauty in the impossible, in the unfinishable, in the imperfect. I’ve learned that it’s okay to be boring, and to let other people know you’re boring. 35: Love the struggle 05-28-2011 My 35th year in review. Spring, Sponge, or Stone? 03-22-2011 Every day, when you wake up, ask yourself: am I a SPRING, a SPONGE, or a STONE? I'm a techno-futuro-optimist 01-10-2011 Thoughts related to Kevin Kelly's What Technology Wants Why Wasn't I Consulted? 01-06-2011 The web is a customer service medium more than anything else. We are paper boats 11-25-2010 Appreciate the impermanence 34: Cultivate the core 05-28-2010 My 34th year in review. 750 words a day, or a defense of private, unfiltered, unplanned writing 12-16-2009 Launching 750words.com 33: Frugal to the max 05-28-2009 My 33rd year in review. 32: No problem 05-27-2008 My 32nd year in review. 31: Double down 05-29-2007 My 31st year in review. History of my self-tracking 02-07-2007 I've been interested in self-tracking since 2002, here's how I was thinking about it in 2007. 30: Higher highs and lower lows 05-31-2006 My 30th year in rev'''
