["https://busybox.net/FAQ.html"]
title = "BusyBox"
full_description = '''"I use Foomatic-9000 modem. In my modem, Busybox v1.23.4 is installed. I can reach my modem's Telnet interface and I can reach shell prompt. I want to change configuration, and add some tools. Can I enable FTP? SCP? If I edit a file on the device, I can't save it, I get 'filesystem is read only' error. How can I save a changed file?" Questions like the example above is a sign that the person asking it does not fully understand what Busybox is. Busybox is not a complete solution for running modems, or wireless access points, etc. Busybox is only a set of programs. Even though it is a fairly comprehensive set of programs needed to run a Linux system, these programs per se can not "run a modem", just like construction worker's toolbox and materials can't build a house by themselves. In order to make Busybox-based system useful, developers of this system add their own parts. At the very least, there are some shell scripts and configuration files, which control which tools are to be run, when, and how. Often, there are also some web pages and CGI scripts (in order to implement web-based configuration). Also, often developers add other tools beside Linux kernel and Busybox. Since these scripts, configuration files and other tools are custom-designed for a specific device, Busybox mailing list is usually a wrong place to ask about inner workings of such a device. "Can I enable FTP?" - "We don't know whether Foomatic-9000 firmware comes with Busybox binary with enabled ftpd applet. (If you have access to shell prompt, try running "busybox ftpd --help"). If it does, you probably will be able to enable it. Unfortunately, we don't know how Foomatic-9000 firmware manages starting and stopping of various services (in case they already have ftpd sevice and it is just disabled), or how to create and enable a new service on Foomatic-9000 (if they dont). Try googling for it." "Can I enable SCP?" - "Busybox-1.23.4 does not have scp applet. However, Foomatic-9000 might have scp installed (say, if they have dropbear installed), and it may be possible to enable it. If not, it may be possible to build and install your own scp tool. Try googling for it."'''
