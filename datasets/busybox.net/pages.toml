["https://busybox.net/developer.html"]
title = "BusyBox"
full_description = '''If you feel comfortable with the above and have proven to continually fulfill these requirements, or somebody asks you to apply for write-access to the repository who itself is maintainer of a project, then please apply for an account (if needed). Git push access requires an account on Morris. The server behind busybox.net and uclibc.org. If you want to be able to push commits to Git, first contribute some stuff to show you are serious, can handle some responsibility, and that your patches don't generally need a lot of cleanup. Then, very nicely ask one of us (Denys Vlasenko for primarily BusyBox, or Bernhard Reutner-Fischer primarily for uClibc) for an account. If you're approved for an account, you'll need to send an email from your preferred contact email address with the username you'd like to use when committing changes to GIT, and attach a public ssh key to access your account with. If you don't currently have an ssh version 2 DSA key at least 4096 bits long, you can generate a key using the command ssh-keygen -b 4096 -t dsa and hitting enter at the prompts. This will create the files ~/.ssh/id_dsa and ~/.ssh/id_dsa.pub You must then send the content of 'id_dsa.pub' to me so I can set up your account. (The content of 'id_dsa' should of course be kept secret, anyone who has that can access any account that's installed your public key in its .ssh/authorized_keys file.) Note that if you would prefer to keep your communications with us private, you can encrypt your email using Denys' public key or Bernhard's public key. Once you are setup with an account, you will need to use your account to checkout a copy of BusyBox from GIT: You can then enter the newly checked out project directory, make changes, check your changes, diff your changes, revert your changes, and and commit your changes using commands such as: For additional detail on how to use GIT, please visit the GIT overview site. You might also want to read online the manpages or tutorial. A morris account also gives you a personal web page (https://busybox.net/~username comes from ~/public_html on morris), and of course a shell prompt you can ssh into (as a regular user, root access is reserved for folks doing maintenancy stuff only). But keep in mind an account on Morris is a priviledge, not a requirement. Most contributors to busybox and uClibc haven't got one, and accounts are handed out to make the project maintainers' lives easier, not because "you deserve it".'''
