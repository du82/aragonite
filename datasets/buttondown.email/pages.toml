title = "Paid subscriptions"
description = "Earn money from your newsletter. Beer money? Rent money?"
full_description = "Charge for access to your newsletter with Buttondown. Get the best terms in the industry. Start making money from your email in the way that works best for you. With our flexible pricing model, first-class payment gateway, and easy ability to get started, you’ll be up & running to make money in no time. Email’s been in a weird place lately. We all know it’s essential, especially as more people rely on email to stay informed. But it’s become less certain of which email provider to go with, because of so many changes in the industry. We help you make money from your newsletter, and we want you to keep all of it. Our business succeeds when you do. And our creator-friendly tools are used by tens of thousands of people every month. You need an email provider that delivers the features you expect, saves you money, and won’t turn into something you don’t need. Our roadmap is geared for the long haul. We chat with our customers all the time to make sure we’re always building something that meets their needs. And we’re committed to making the best email solution for your needs, no matter your size."
