["https://buttondown.email/blog/2019-05-16-sending-newsletters-that-get-delivered"]
title = "Sending newsletters that get delivered"
description = "Verifying your domain will ensure that your newsletter arrives in your readers' inbox."
full_description = '''This blog post will help you with the most important thing you care about if you're writing and sending a newsletter: making sure your newsletter ends up in your subscribers' inboxes, and not in the Spam folder. If your newsletter isn't doing this, then no brilliant writing or incredible tactics matters — it's all going to waste. The biggest part of making sure your newsletter gets delivered is by making sure you're the one sending it; that, as far as your email address is concerned, you are who you say you are. You see, spammers and malicious actors like to impersonate others (specifically, their email addresses) in order to trick folks into giving personal information or misreading an email — in order to solve this, email hosts like Gmail and Yahoo have developed the concepts of DKIM and SPF records, which are sort of optional drivers' licenses for emails: they sit on your domain and verify that you're giving your newsletter application the right to send emails on your behalf. SPF and DKIM have gotten so prevalent, and so important, that Gmail now only shares images from domains that have valid SPF and DKIM messages: It's important to choose a newsletter provider that lets you send your emails through SPF and DKIM. Thankfully, with Buttondown it's easy: That's it! It should only take a couple minutes for you to get trustworthy, high-deliverability emails that end up in your subscribers' inboxes. If you aren't sending emails from a custom domain (and your main email is through Hotmail, ProtonMail, Gmail, or another common provider), another good tactic to ensure high deliverability is sending using Buttondown's email address for your account rather than your own. This is because many mailboxes penalize conflicting addresses on emails ("This email says it's coming from justin at gmail.com but it's actually coming from justin at buttondown.email...looks suspicious!"). This is easy and free to do: just check the box that says Would you like to send emails from Buttondown's domain? in your Settings page.'''
year_published = 2025
clearnet = "https://buttondown.email/blog/2019-05-16-sending-newsletters-that-get-delivered"
