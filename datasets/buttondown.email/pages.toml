full_description = "Campaign Refinery is a boutique email service provider focusing on email campaign deliverability. The company prides itself on its exclusive clientele and performance-first platform. Campaign Refinery promises businesses that its tools will provide rapid growth. Campaign Refinery speaks a lot about how its platform is unique because its email campaign tools prioritize email deliverability and performance. These features are supposed to keep your email lists clean, subscribers engaged, and emails personalized to your audience Of course, performance is an important aspect of email marketing campaigns but isn’t the sole factor to determine a successful campaign. Multiple factors such as engagement and community building are equally important. Buttondown incorporates features to hit all key points for long-term campaign success. We provide simple, easy-to-use features. We provide an intuitive editor, automation, analytics, integrations, surveys, and segmentation tools. Best of all, Buttondown’s deliverability is among the highest in the industry, and our spam protection is best-in-class. No matter if you are starting a side hustle or running an enterprise, you deserve exceptional service for an affordable price. Campaign Refinery’s pricing plans are different from most email service providers. A majority of platforms, including Buttondown, base prices on subscriber count. Campaign Refinery bases its prices on email credits. You are allowed an unlimited amount of subscribers and are allotted an amount of credits for each tier. Each email sent is one credit. There are a few caveats to their pricing and credit systems-using certain features cost you more credits. Here is a breakdown: At Buttondown, we prefer to keep it straightforward. We are here to support you, not drain your wallet or confuse you with credits. You have access to all of our powerful email marketing tools for one price. That will never change. Choosing Buttondown is choosing to put yourself first. We prosper when you prosper which is why we will continue to put your interest first-always."
