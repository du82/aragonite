["https://buttondown.email/stories/cassidoo"]
title = "How Cassidy Williams uses Buttondown"
description = "Cassidoo (as she's known online) has cultivated a readership of tens of thousands of developers and engineers using Buttondown."
full_description = '''Cassidy Williams is a software engineer and developer advocate by profession who loves teaching people coding skills (and making them laugh with dumb jokes)! She's currently the CTO of a small AI startup called Contenda, and has worked at a bunch of other companies, large and small — almost always focusing on how to make developers build better. Cassidy's been a true Buttondown O.G. — she's been sending newsletters for almost five years through the platform, and we caught up with her to learn more about her process and how she uses Buttondown. My newsletter is a little bit of tech news, a little bit of what I'm up to, a little bit of technical interview practice, and a little bit of fun non-tech things too, every week. It's a joy to write and I love it when people say that they've learned something from it! I am very online, heh. I'm in a bunch of Discord groups where folks promote articles they write, plus I subscribe to a bunch of different blogs (both tech-related and not) that I pull content from, plus I "harvest" links from Reddit, Hacker News, Twitter, and a few other spots where things pop up. As for the interview question... that really varies. I try to pull those from actual technical interviews (I'm in some groups where people share their interview experiences), and try to do variations of questions you see on sites like LeetCode and HackerRank! : Oh man, I am just a lot more focused on my workflows now, more than anything! I now have templates that I use to populate the newsletter, I have scripts that I run that renders all of the people answering interview questions, I have a dedicated bookmark tool for the newsletter... all of that has made a big difference over time! I started building some of my automations once I had enough responses to my newsletter that I couldn't keep up manually. The interview question of the week in particular was tough to keep track of after a while (because people send in their answers on Twitter, by responding to the email, on Discord, and a few other spots), where in the first year or so I'd only get a couple responses here and there, but now I consistently get between 10 and 30 responses each week!'''
year_published = 2023
