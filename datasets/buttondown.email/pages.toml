["https://buttondown.email"]
title = "Buttondown"
description = "Newsletter software for people like you."
full_description = "Email platforms have been in a weird place lately. Platforms grow and stop supporting you. Or they’ll shut down, despite the fact that you need your email to work like it’s a utility that you can depend on. Or they’ll hike their fees, forcing you to go through a stressful migration. Or they’ll add dozens of features that you’ll never want to use. Or they’ll just turn flatly evil. Email should theoretically be easy: write something, send it, repeat. And that’s how it usually is – until it’s not. Turns out email is only hard when other people make it hard. What if your email provider actually wanted you to succeed, and wasn’t trying to slowly bleed you dry? What if your email provider didn’t change to support a few rich customers? Or they just stuck around at all? We power single individuals and enterprise-grade businesses without compromising on either. That’s because email, at its core, should be simple. We put lots of effort into the most important parts of your email experience, because that’s what you tell us to do. Groaning about the possibility of migrating your whole list? Afraid something will get lost or broken? That’s why we offer one-click concierge migration for your whole list, no matter how large it may be. Just create your account for free, contact us, and we’ll get you migrated within one business day."
