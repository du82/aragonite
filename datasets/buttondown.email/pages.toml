["https://buttondown.email/stories/data-is-plural"]
title = "How Jeremy Singer-Vine uses Buttondown"
description = 'Jeremy publishes Data Is Plural, a "weekly journal of useful/curious datasets" that uses Buttondown to manage subscribers and send emails'
full_description = "I’m a data journalist based in New York City. Until early 2022, I worked in newsrooms, using data analysis and computer programming to guide and support investigative reporting, most recently as the data editor at BuzzFeed News for 7+ years. I left that job to go freelance and to start the Data Liberation Project — an initiative to identify, obtain, reformat, clean, document, publish, and disseminate government datasets of public interest. I started writing Data Is Plural in late 2015, to scratch a proverbial itch. At the time, it seemed there wasn’t a great way to learn about public datasets. There were giant data portals, but they felt overwhelming and often lacked key context. There were also smaller, more niche data portals, but spread all across the web. And there were one-off blog posts here and there, highlighting a few gems. What I was hoping for — but couldn’t find — was what Data Is Plural became: A steady, concise feed describing a handful of datasets each week. DIP’s format has remained the same pretty much since launching: Five datasets per weekly edition, one paragraph of description each. So have the criteria: The datasets should be freely, publicly available and downloadable in bulk or via API; bonus points for originality, good documentation, open data formats, temporal freshness, and detail. When I started writing Data Is Plural, I didn’t know what to expect ... but the thought of still writing it more than eight years later never crossed my mind. A few motivations have propelled DIP’s longevity. There’s the joy of hearing from readers who find the newsletter helpful. There’s the satisfaction of watching the archive grow into a resource of its own. Also, as someone who’s mostly inactive on social media, the newsletter has also been a helpful way to convey occasional updates about my work. And, last but not least, I keep writing the newsletter because I genuinely enjoy the process: looking for datasets, exploring them, and trying to understand them well enough to summarize."
year_published = 2023
clearnet = "https://buttondown.email/stories/data-is-plural"
