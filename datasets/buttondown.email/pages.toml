["https://buttondown.email/pricing"]
title = "No-nonsense email for everyone."
description = "A full breakdown of our pricing plans, including add-ons and discounts."
full_description = "You’re probably looking at other email tools. Fair! And you’re wondering why those charge a lot more than us. Also fair! Maybe you think we’re not up to the demands that your business needs, or you think we’re not ready for “prime time.” In short, we don’t want to overcharge you, even if you’re a big enterprise company that’s used to being overcharged. We want to give you the best possible service, no matter your list size. Are you registered as a 501(c)(3) non-profit (or your country's equivalent)? You can get a 50% discount on your plan. Send us an email with proof of registry and we'll get you set up. All of these prices assume that you're sending at most one email a day to your entire subscriber base. If you're sending more than that, you'll need to contact us and we can talk about what usage-based pricing would look like for you. We're a small team of engineers, writers, and designers who are passionate about making emails better, fully remote and have been since our founding in 2017. We're profitable, self-funded, and have no plans to change that. We charge for active subscribers — you only pay for the people who are actively receiving your emails."
