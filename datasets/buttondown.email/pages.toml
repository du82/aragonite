["https://buttondown.email/blog/2019-05-04-may"]
title = "May updates"
description = "This past month has been focused on bug bashing, but also some fun product updates!"
full_description = '''I wrote last month that April was going to be filled with small and necessary work, a nice step back before diving into some renewed projects. It was exactly that! Buttondown has been buggy the past few months. It feels bad to admit that, but it's true; the "bugs" tag in my issue tracker has been growing wider and more bulbous, and it feels good (and, frankly, necessary) to dedicate some time tackling it. I announced last month that I had added support for custom SPIF/DKM records for premium accounts, and I'm thrilled to announce that it's now available for <em>everyone</em>. If you own your own domain, you can now use it to sign the emails you send from Buttondown, greatly improving deliverability: There are a couple reasons why I decided to make this a free feature: but it really comes down to one thing: deliverability is important, and it feels gross to essentially gate high deliverability behind $29/month. In what may be the most niche feature ever, you can now automatically apply UTM tags to all outgoing links from your newsletter. May is going to also be a heavy bug-squash-and-technical-debt month, but with a couple meatier things to handle:'''
