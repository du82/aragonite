["https://buttondown.email/alternatives"]
title = "Buttondown alternatives"
description = "Buttondown's a great tool, but it's not for everyone."
full_description = '''Buttondown is a very powerful tool — but it's not for everyone. Here, you'll find some alternatives to Buttondown if you're looking for a specific feature that might not fit what we try to do. We would rather do a few things exceptionally well than make something that's for everyone. Why? Because a tool for "everyone" ends up being for no one. In fact, you're probably reading this because your email platform got too bogged down with features you don't find yourself using. Here's a list of some very broad things that Buttondown doesn't handle (and has no real plan on handling): Email marketers might be familiar with automated sequences that are personalized to specific behaviors, sending different sequences based on what customers do. Buttondown offers this in the form of automations, but it's not as complex as some of the other tools out there. If you're looking to have these sorts of workflows where you need branching logic, retries, and so on, check out Kit. Buttondown offers a web archive which keeps track of the emails you've sent. However, if you're interested in more advanced publishing tools like block-based editing & deep template customization, Buttondown may not be the best tool for you. We recommend Ghost, which offers newsletter & paid subscription functionality on top of their core CMS. If you want to use software that you can host yourself and audit the source code, we'd recommend checking out Listmonk. Buttondown allows you to attach files & images to your emails, but that's not quite the same thing as being a full-fledged media host. If you're looking for a place to grow your media presence by gating access to content, check out Patreon or Memberful. If you're looking for an email solution for your store, it's almost certainly a better idea for you to choose an option that handles things like coupon codes, shopping cart integrations, and so on. Bento really shines here. If you're not sure whether your use case is a good fit for Buttondown, please email us. We'll reply quickly and spare you the hard sell; we care far more about your finding the right tool for your needs.'''
