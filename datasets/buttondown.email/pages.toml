full_description = "Howdy, friends! I'm writing this belated update having just arrived back in Seattle from a week of leisure and wine in Paris. Apologies for the sluggishness in responding to emails and DMs; rest assured, I'll be spending the next few days getting back to folks. I cannot be more excited about all of these new ships. There’s a lot of work to be done still (especially on that last piece: paid subscriptions are barebone, and I need to flesh out analytics and reporting) but this represents the culmination of a lot of work and I am thrilled to have it across the line. April is going to be a languid month, filled with paying down some technical debt, solving myriad bugs, and getting my ducks in a row. I’m not promising anything too huge, but some small stuff you may enjoy: I've updated Buttondown's running costs for April. Notable are the increased Clearbit costs and the ever-rising costs of Mailgun's email validation; if I have time, I'm going to work on ameliorating both."
