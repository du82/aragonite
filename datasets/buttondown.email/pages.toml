["https://buttondown.email/features"]
title = "Mastodon"
full_description = "Buttondown has the power of the big players, focused on one thing: the best email for creators & businesses. Charge for your newsletter however you’d like. Ask readers to name their own price. Set up a free tier. The best part? We won’t charge you extra for paid subscribers, so you’ll keep all of the revenue that you make. Build custom sequences for new subscribers. Create flows for tagged subscribers. Survey customers to personalize their content. Control exactly when & how each email is sent. Buttondown is GDPR-compliant and then some. We don't collect any data about you or your subscribers by default. Want a closer look into subscriber behavior & email performance? It’s available in one click, giving you the right insights at a glance. Overwhelmed by the prospect of switching mailing list providers? We’ll migrate your list to Buttondown for free, no matter how large it is. Buttondown connects with your whole marketing & tech system to make sure that you’re making the most out of every email you send – seamlessly & without fuss. Connect Buttondown to other apps. Tweak your email flows however you need. Write how you like to write. Email is great. Replies to your emails are great, too. But what if you want your subscribers to read what each other has written, and talk to one another? Buttondown’s built-in comments interface gives your favorite readers a place to talk with each other and stay connected with you. Unlike other email providers, comments are a first-party feature of Buttondown, and you can build automations & integrations for them just like you would any other part of your newsletter. Want to know what your audience thinks? Our surveys allow you to gather valuable feedback, conduct polls, and gain insights to tailor your content and improve your newsletter. Subscribers answer straight in their browser, which improves completion rates. You’ll get the results in your inbox and your analytics pages. Buttondown’s surveys boast response rates 200% higher than the industry average. Why? Because they’re easy to answer, and they’re sent from a trusted source. Subscribers don’t have to click through to a third-party site, and they don’t have to worry about their data being sold to advertisers."
