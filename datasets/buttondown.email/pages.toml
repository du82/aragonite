full_description = "You may have run across Mad Mimi due to their aggressive marketing with GoDaddy, their parent company! They've been around for a long time, and are competitively priced: cheaper than — well, not cheaper than Buttondown, but certainly cheaper than Mailchimp and many other competitors. Their features are easy but basic — very much harkening back to an older version of the web, but missing many essential features common to good web applications of 2024 such as strong local support, autosaves, integrations, and more. Many users will find that there are some noticeable omissions when it come to the functionality available in Mad Mimi, particularly when it comes to autoresponders, marketing automation, reporting and split testing. Mad Mimi was officially discontinued on August 30, 2024. If you are looking for a great replacement, Buttondown is an excellent choice. With Buttondown, you have a simple newsletter platform without sacrificing the analytics, integrations and API that you'd expect in a modern web app."
