title = "Privacy policy"
description = "Simply put: Buttondown doesn't do anything weird with your data"
full_description = 'Thank you for choosing to be part of our community at Buttondown, LLC (“Company”, “we”, “us”, or “our”). We are committed to protecting your personal information and your right to privacy. If you have any questions or concerns about our policy, or our practices with regards to your personal information, please contact us at justin@buttondown.email. When you visit our website buttondown.com, and use our services, you trust us with your personal information. We take your privacy very seriously. In this privacy policy, we seek to explain to you in the clearest way possible what information we collect, how we use it and what rights you have in relation to it. We hope you take some time to read through it carefully, as it is important. If there are any terms in this privacy policy that you do not agree with, please discontinue use of our Sites and our services. This privacy policy applies to all information collected through our website (such as buttondown.com), and/or any related services, sales, marketing or events (we refer to them collectively in this privacy policy as the "Services"). Please read this privacy policy carefully as it will help you make informed decisions about sharing your personal information with us. In Short: We collect personal information that you provide to us such as name, address, contact information, passwords and security data, and payment information. We collect personal information that you voluntarily provide to us when registering at the Services expressing an interest in obtaining information about us or our products and services, when participating in activities on the Services or otherwise contacting us. The personal information that we collect depends on the context of your interactions with us and the Services, the choices you make and the products and features you use. The personal information we collect can include the following: Publicly Available Personal Information. We collect email addresses, business email, social media, and other similar data. Credentials. We collect passwords, password hints, and similar security information used for authentication and account access. Payment Data. We collect data necessary to process your payment if you make purchases, such as your payment instrument number (such as a credit card number), and the security code associated with your payment instrument. All payment data is stored by Stripe. You may find their privacy policy link(s) here: stripe.com.'
