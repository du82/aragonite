["https://buttondown.email/features/for/businesses"]
title = "Mastodon"
full_description = "You've got better things to do than fight your email tool. That's why we've built Buttondown for the needs of any business: so you can migrate fast, configure powerful automations, and develop wonderful customer relationships. Tag your visitors based on their behavior – and send out targeted emails to them. Track what people are doing at scale, and adapt your workflows to meet their specific needs. We're proud of our automations, and we're building out new features in this space all the time. Send welcome sequences to new customers. Send emails to specific tags. Segment customers by behavior and develop relationships that feel one-to-one. Want multiple people to publish at once? Need others to review your work before it goes out? You can invite as many people as you need. We focus on the best infrastructure we can deliver, regardless of your size. With our best-in-class deliverability rates & high uptime, you'll reach more customers – which means you'll convert more customers. Buttondown is known for having the best support in the industry. We use our support inquiries to drive our feature roadmap, so we're building things that we know you'll use. And if you're concerned that migration will take a while, reach out to us and we'll do it for you. Buttondown is widely known for having the best RESTful API in the industry. Not only can you do essentially anything through it, but we've documented it extensively, too. We've structured our business to be around for the long haul – and it's run by a real person. We're also widely beloved by our customers: With our exclusive focus on email, we currently don't handle omnichannel communications. Fortunately, our integrations and API let you connect to other focused tools. Because we're focused on sending out the best possible email, we tend not to focus on every specific need of any one platform. We've found this trade-off results in our having a more stable, durable business, which allows us to serve our existing customers as well as possible. If we're missing a specific feature that you find you might need, don't hesitate to reach out."
