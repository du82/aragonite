["https://buttondown.email/features/rss"]
title = "Write once. Publish everywhere."
description = "Buttondown can slurp up your RSS feed and either automatically send out emails or create drafts."
full_description = "But we also operate in the other direction. Do you have an RSS feed that you want to turn into a newsletter? Buttondown can turn your RSS feed into automatic emails or drafts. Gone are the days of copy-and-pasting your blog posts into your newsletter client. Want to send your blog posts to a specific list or tag? Buttondown can handle that, too, making sure the right people get the right content. RSS stands for Really Simple Syndication. It’s a way for people to automatically check a bunch of blogs, news outlets, and newsletters(!) at once. Rather than going to sites one by one to see what’s changed, you compile a list of RSS feeds, and refresh all of them at the same time. You can read more about what RSS is here. Want to make last-second tweaks before sending things out? Buttondown can wait for your final stamp of approval. Whether you're sending out digests or weekly/monthly roll-ups, Buttondown makes sure you're not accidentally sending out duplicates or drafts. Want to send your blog posts to a specific list or tag? Buttondown can handle that, too — making sure the right people get the right content."
