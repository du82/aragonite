full_description = 'Beautiful Photos of Young Sharon Tate Taken by Orlando Suero in 1966 Stories Editorial Team — July 29, 2024 · Comments off FacebookXPinterestEmailRedditLinkedInWhatsApp Orlando Suero, a talented photographer, was born in New York in 1925. His passion for photography began in 1939 when he experimented with a Kodak Jiffy camera. He further honed his skills by attending the prestigious NY Institute of Photography and working at Compo Photo Color, where he had the opportunity to print images for Edward Steichen’s renowned collection, “The Family of Man.” In 1954, Suero embarked on a significant assignment to document Jackie and Senator John F. Kennedy, which marked the beginning of his successful career. Known for his friendly and approachable demeanor, Suero captured stunning portraits of Hollywood icons such as Natalie Wood and Brigitte Bardot. His subjects often felt at ease in front of his lens, allowing him to create captivating images. Sadly, Orlando Suero passed away in 2019 at the age of 94, leaving behind a legacy of remarkable photography. Among his notable works are these beautiful portraits of Sharon Tate taken in 1966. h/t: vintag.es <img decoding="async" src="https://buzzbloq.com/wp-content/uploads/2024/07/1722264003_167_Beautiful-Photos-of-Sharon-Tate-Taken-by-Orlando-Suero-in.jpg" alt="Sharon Tate By Orlando Suero 1" width="990" height="657" class="alignnone size-large wp-image-1151278" /> <img loading="lazy" decoding="async" src="https://buzzbloq.com/wp-content/uploads/2024/07/1722264003_798_Beautiful-Photos-of-Sharon-Tate-Taken-by-Orlando-Suero-in.jpg" alt="Sharon Tate By Orlando Suero 2" width="990" height="1238" class="alignnone size-large wp-image-1151279" /> <img loading="lazy" decoding="async" src="https://buzzbloq.com/wp-content/uploads/2024/07/1722264004_965_Beautiful-Photos-of-Sharon-Tate-Taken-by-Orlando-Suero-in.jpg" alt="Sharon Tate By Orlando Suero 3" width="990" height="1488" class="alignnone size-large wp-image-1151280