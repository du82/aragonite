["https://bylinetimes.com/2025/01/31/gb-news-ofcom-complaints-guest-boycott-hosts-label-lgbt-people-paedos-and-deviants"]
title = "GB News Hit by Guest Boycott After Hosts Label LGBT+ People 'Paedos' and 'Deviants' – Byline Times"
