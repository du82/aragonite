["https://bylinetimes.com/2024/08/09/bbc-blocks-peace-organisations-advert-in-proms-guide-despite-planning-to-broadcast-anti-war-piece"]
title = "BBC Blocks Peace Organisation’s Advert in Proms Guide Despite Planning to Broadcast 'Anti-War' Piece  – Byline Times"
description = "The Pacifist group Peace Pledge Union and its associated peace education charity argue that its advert was “in no way polemical”."
full_description = 'Byline Times is an independent, reader-funded investigative newspaper, outside of the system of the established press, reporting on ‘what the papers don’t say’ – without fear or favour. To support its work, subscribe to the monthly Byline Times print edition, packed with exclusive investigations, news, and analysis. Help us build the better media Britain deserves The BBC has pulled an advert for a peace organisation in its Proms concert guide for being too political, despite planning to broadcast a major anti-war piece during its televised coverage. The Pacifist group Peace Pledge Union and its associated peace education charity argue that its advert was “in no way polemical”. However, the anti-war organisation has noted with irony that a highlight of this year’s Proms Concerts season will be a performance of the ‘War Requiem’, a major work by renowned 20th Century British composer Benjamin Britten on Saturday 17th August. Britten was a pacifist and conscientious objector, and wrote the War Requiem as his “artistic response to the horrors of war, and as a reflection of his anti-war beliefs,” the PPU notes. Britten was a prominent member of the Peace Pledge Union – the UK’s primary pacifist organisation – for decades. Weeks ago the group booked an advert in the concert programme highlighting how Britten’s philosophy continued to resonate with many people to this day, but they have just heard the ad has been dropped. ENJOYING THIS ARTICLE? HELP US TO PRODUCE MORE Receive the monthly Byline Times newspaper and help to support fearless, independent journalism that breaks stories, shapes the agenda and holds power to account. PAY ANNUALLY – £39.50 A YEAR PAY MONTHLY – £3.75 A MONTH MORE OPTIONS We’re not funded by a billionaire oligarch or an offshore hedge-fund. We rely on our readers to fund our journalism. If you like what we do, please subscribe. Albert Beale of the PPU said the decision raises a wider issue of the widespread acceptance, in principle, of the use of violence in warfare. That is viewed as “the norm” and isn’t of itself “political”. There is an underlying assumption that fighting can be justified, in most news reporting from conflict zones, Beale claims. “But a complete rejection of such violence is outside the norm and hence is political. For a pacifist, accepting the morality of any use of killing at all is as much a political stance as our ‘never under any circumstances’ one.” He added: “It’s hard to reconcile the BBC’s willingness to promote a profoundly political piece of musical culture – such as the War Requiem – whilst refusing to allow an organisation with which the composer was closely associated to refer to the reality of its timeless message. “It’s ironic that for the media, peace seems these days to be more controversial than war. Can it really be that violence is non-political, but peace is political?” The Peace Pledge Union (PPU) is one of the UK’s oldest pacifist organisations, founded in 1934. PPU members pledge not to support war and to work for the removal of the causes of war. The PPU’s work includes promoting peacebuilding, challenging militarism, providing educational resources on peace and distributing the white poppy in memory of all victims of war. The Peace Pledge Union is not linked to any political party and PPU members include supporters of several parties and none. A BBC spokesperson told Byline Times: “We consider each ad individually and apply the principles of the BBC guidelines on a case-by-case basis.” Byline Times understands that the BBC Proms does not take ads from campaign groups. The organisation debated including the PPU ad but in the end it was decided to veto the organisation’s ad. The Peace Pledge Union is the British section of War Resisters’ International, which works with peace campaigners and conscientious objectors globally to resist “war and militarism”. The Pulled Ad <img decoding="async" src="https://lh7-rt.googleusercontent.com/docsz/AD_4nXfnNh_H8x3-CXodzUNibVPlpRJ9lLR4S8uXcN8pX0YT60Rmb6r-xEI0nIsBjPUKSjzRVHnLmcjWKOXSa1Odsy0cYH9kIFL_65xUdpXjMmBjIbSuUMTnySNFtw57eFMhJJ709q4vnlXyHbVetzZGZVrtE6do?key=XcMZxtnKUGZw5EfGUtIcBQ" alt="" data-eio="l" /> <img decoding="async" width="24" height="24" class="wp-image-199513" style="width: 24px;" src="https://bylinetimes.com/wp-content/uploads/2023/05/newspaper.svg" alt="" data-eio="l"> Subscribers Get More from JOSIAH Josiah Mortimer also writes the On the Ground column, exclusive to the print edition of Byline Times. So for more from him… Subscribe to Byline Times <img decoding="async" width="595" height="717" src="https://bylinetimes.com/wp-content/uploads/2023/11/Josiah.jpg" alt="" class="wp-image-216679" style="aspect-ratio:1;object-fit:cover;width:367px;height:auto" srcset="https://bylinetimes.com/wp-content/uploads/2023/11/Josiah.jpg 595w, https://bylinetimes.com/wp-content/uploads/2023/11/Josiah-327x394.jpg 327w" sizes="(max-width: 595px) 100vw, 595px" data-eio="l" />'
