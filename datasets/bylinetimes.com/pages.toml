["https://bylinetimes.com/2025/01/28/levi-davis-murdered-at-sea"]
title = "Levi Davis - Murdered At Sea? – Byline Times"
description = "Part Two of a five part special investigation by Dan Evans and Tom Latchem into a missing person’s case with dark criminal undertones"
full_description = 'A version of this article was first published in the July 2024 edition of Byline Times Was Levi Davis seen a nautical mile out to sea in the central shipping channel of Barcelona’s busy commercial port, clothed, and shouting for help in the dead of night? If so, how did he get there and why could rescuers on scene in less than four minutes find no trace? Byline Times has established that Levi could not have possibly swam there himself. So was he murdered? And what have the police done about it? It’s 06:32 on Sunday 30 October 2022. The Maltese cruise ship MSC Bellissima is a nautical mile from the entrance to the southern mouth of Barcelona’s commercial port, initiating its docking procedure. In the darkness, a young British crew member is walking deck number five on the ship’s port side when something unexpected is illuminated on the surface in its lights. Rising from the tidal swells, 15°C at that time of year, a voice with an English accent is screaming: “Help me, help me, help me.” In the predawn gloom, maybe 30 metres away, is a man – he thinks – of around 30 years old. He can’t make out the colour of his skin. He can see he’s clothed but no more. The crewman cries “man overboard” and, by 06:33, the Bellissima’s bridge is being alerted over its internal systems. Thirty seconds later, its Man Overboard alarm sounds. At 171,598 tonnes and carrying up to 4,500 passengers, the Bellissima is too big to abort its manoeuvre into the kilometres-long rocky breakwaters that funnel craft into harbour. The faster response is to call in the Catalan Coast Guard. At 06:34, the Bellissima broadcasts a satellite position for the man in distress. His location is close to a floating radio beacon for traffic using this central two-way channel into port, called the Sierra Buoy. At 06:35, a life ring is thrown from the ship’s starboard rear quarter, catching the wake of the 316m vessel, as three more passengers report hearing yells from the water. At 06:35:50, a Maritime Rescue boat arrives at the scene and is quickly followed by another, and then five more from the police and Civil Guard. A helicopter scrambles above, tracking the southbound current as it washes away from the Spanish landmass. The wind speed is two to three knots – ‘light air’ strong enough to push small ripples across the sea’s surface. The search goes on for almost 12 hours but once a head count of those on the Bellissima and other ships in the area shows no one missing, it is called off at dusk. Whoever was in the water – clothed, fighting for life, and fully four kilometres from the port’s public areas – had vanished in less than four minutes. <img decoding="async" class="wp-block-fabrica-article-preview-image__image" src="https://bylinetimes.com/wp-content/uploads/2025/01/Losing-Levi-Logo.jpg" data-eio="l" /> PART ONE: ‘My Name Is Levi Davis and My Life Is in Danger’ – Reopening the Case of the Rugby Star Who Disappeared Part One of a five part special investigation by Dan Evans and Tom Latchem Dan Evans and Tom Latchem A Case for Murder When Levi first disappeared there was an initial flurry of media interest fuelled in part by the public speculations of a private investigator who’d volunteered to solve the mystery. Febrile headlines about alleged £100,000 drug debts unpaid and supposedly imminent arrests of shadowy third parties muddied the water early. But as each line of inquiry came to nothing, so public attention dwindled. Byline Times has seen the official findings of the Catalan authorities. No evidence is recorded of a body washing up or being caught in nets, as experts suggest might have been expected after a couple of days or weeks. And beyond a very belated search by divers of the port breakwaters’ hidden areas in May 2023 and remote scans of the seabed and dykes of the nearby River Llobregat delta the following July, there appears to have been no further critical assessment of the sighting. For example, nowhere in the findings is the obvious question posed as to how exactly Levi – as the Spanish police assume it was – could have possibly found himself at sea under these circumstances. This newspaper has spoken to two maritime experts who agree Levi – who was a weak-to-average swimmer – simply could not have got out to the Sierra Buoy in the dark on his own. “It would be practically impossible to swim out to this beacon from land under these circumstances,” said shipping commentator Peter Elson. “You’d lose your sense of direction almost immediately – in seconds. If you are not a great swimmer it would be a complete nightmare. Drinking too much seawater or getting run down by a ship is quite likely. Clothed, it would be even more difficult. It is therefore very unlikely that this person arrived at this location in the ocean without the involvement of a third party.” Dr Emili Garcia Ladona, a senior researcher for Spain’s Institute of Marine Sciences agrees. He said: “In the dark, even with relatively calm conditions, with the maritime traffic, the sea agitation produced by such huge navigation vessels is enough to lead to confusion. “It is not the same as swimming in a pool. People not trained to swim at sea will tire faster, and under stress even faster still. Considering the temperature range in seawater at the end of October, hypothermia will set in quickly. “Then there are the currents to fight against. From sea level, it would be hard to focus on a reference point like the Sierra Buoy or gauge its distance properly. Finally, the point where he was detected is in the middle of the traffic separation lines of one of the entrances to Barcelona harbour [which is a high traffic zone].” These expert opinions raise questions about a key conclusion of the Catalan inquiry – that no evidence of criminality was discovered. Well-placed Mossos sources have confirmed that beyond the taking of interviews from cruise ship witnesses, the only other enquiries made were the physical sea and river searches conducted seven and nine months later respectively. Julie Davis said: “From the description of the person crying for help, it’s clear they didn’t want to die. To me as a layperson, it is hard to see an innocent explanation. “The fact they were abandoned in the water amounts in my mind to one of three things; either there was an accident and he fell in and someone didn’t report it and just left him there to die, or he was kidnapped and escaped from a vessel trying to save himself, or someone was trying to murder him. “All three possibilities suggest crime. But the investigating authorities don’t seem to see that and I do not understand why.” Twelve Vessels Byline Times has obtained historic mapping data of the seagoing traffic around the port on the night in question. According to ship tracking and maritime analytics provider marinetraffic.com 12 vessels travelled in close proximity to the Sierra Buoy in the six hours between the last ping of Levi’s phone from a mast at the port’s cruise ship wharf and Man Overboard alarm on the MSC Bellissima. <img decoding="async" src="https://lh7-rt.googleusercontent.com/docsz/AD_4nXfaCjJc7q1nevHPISEAYGvm_4f1ix304ca_CZTuUm4t3oR543_MDFnpfGDavMTwUEzJrGIePjJ5FmRrpOHDWjonJfuMlMySR1I3LQ147sK9dCh15QtBx6iU5pqMsckU62NmlaEaQg?key=_4mpDIYFN2Tn3UQ9PA8CmmkA" alt="" data-eio="l" />The position of the MSC Bellissima at 0632 on 30 October, 2022, when it raised a Man Overboard SOS while approaching the Port of Barcelona. There were a number of vessels, represented by the coloured dots and arrows, but whose identities we have anonymised, nearby at the time © marinetraffic.com At the furthest plausible periphery, a small UK-owned ‘pleasure’ yacht and an oil tanker were moored approximately 1,000m away all evening. But a dozen others passed the exact spot, including three container or cargo ships, one oil tanker, one ferry, and two cruise ships. Also in the area were three ‘pilot’ boats, whose job it is to guide large ships in and out of the harbour. These include one which goes past the location where the MSC Bellissima reported the man just before it raised an SOS after which its pilot boat doubled back to be ’first’ on the rescue scene. It was then joined within 20 minutes by two other pilot boats. All three then appeared to search the area where the man was spotted. Byline Times has put questions about the sighting and its significance to the Mossos d’Esquadra. It and the overseeing court declined to comment. Instead, they told the Davis family to hire lawyers if they wish to ask any further questions. A Mossos insider did however reveal the limited extent of its enquiries. They said: “If a boat sees something strange or relevant it has an obligation to send a signal to the harbour authorities. We checked the related records and the only relevant incident was the cruiser with the man overboard alert.” Flashing Light ‘Then there is the significance of the Sierra Buoy itself – which only adds further to the mystery. In the report, the buoy is mentioned as a mere detail. And yet its two-by-two metre base, though listing with the waves, is anchored to the seabed. <img decoding="async" src="https://lh7-rt.googleusercontent.com/docsz/AD_4nXfUQ5y3VbNRSJ5nq1RyU5i9-24B34jk4Rp-JC4EGaWGdWCOzuiv2wuFQL9jUJs8REdkVSD6d6QWBCPZJfOg98F4NcKxSWH9tWrRLeTKEZ3ej_0hEKnaKDT5WqvIYtb160YQht5p4A?key=_4mpDIYFN2Tn3UQ9PA8CmmkA" alt="" data-eio="l" />The Sierra Buoy close to where a man was spotted in the sea off the coast of Barcelona © Salvamento Maritimo / X Within its four-metre structure are housed radio transponders, solar panels and weather instruments topped by a flashing light. It also has ropes attached at the base and a smaller pedestal float (as seen in the above photo) alongside, which is more accessible from sea level than the main section which, Dr Garcia Ladona said, could sustain a person “for a few hours without a problem”. Julie added: “The Mossos seem to have decided that Levi probably drowned and then concluded that because they could find no body then there is no evidence of crime. “This seems to me to be a completely flawed approach. In my opinion, the opposite is much more likely.” ‘Jumping at Shadows’ Two weeks before he headed to Ibiza, Levi Davis spent three days with his university friend Mike Guida in Berkshire. “Levi had been staying with me on and off for about three weeks,” Mr Guida told Byline Times. “He’d nip to London for a bit and then he’d come back. He’s one of my closest friends so it was pretty normal for him to come visit on the fly.” Among many conversations during the period (with several other friends too) Levi talked about going to Barcelona. “He was enjoying his music and wanting to get his life back on track after some setbacks with his rugby. He’d done his Anterior Cruciate Ligament which is quite a serious knee injury,” Guida said. “He said a few times he wanted to go to Barcelona for inspiration.” Then, during their last time together, over the first weekend of October 2022, Levi acted out of character. While celebrating a birthday at a local pub, he became suspicious of two men drinking there. “Levi was convinced they were undercover police watching him,” Guida said. “They were just two random blokes in the pub. Nothing sinister. But he wouldn’t have it. He was jumping at shadows.” He knew that Levi had been using cannabis and initially put his behaviour down to the effects of the drug. Levi later played it down, telling another friend he had known the men weren’t police, and that he was “making a joke” out of a life “situation” he had now “woken up to”. But Guida knew that Levi’s smoking had become heavier since an emotional breakdown a few months earlier in his kitchen. “He was crying in my arms,” Guida recalled. “It was his lowest point of vulnerability in the six years I’d known him. He told me ‘I messed up. Someone is blackmailing me’. “He said the person worked for major TV networks but was adamant that he couldn’t say who, but he did mention his first name.” Levi also told Guida he had stuff on his laptop “that he couldn’t show me for my own safety”. “I remember it clearly,” Guida said. “That computer was his life. He went nowhere without it.”And yet, by the time Levi left Britain two weeks later, the laptop – and whatever was on it – was gone. “He went to a party in a hotel in London and lost it there,” said one of two sources who confirm this account. “He searched for it for days afterwards. He was really, really, upset.” Seeing Levi in distress troubled Guida greatly. He believed what his friend was saying. “He was extremely honest and loyal to people he trusted,” said Guida, who said he felt powerless to help. “I didn’t know what to do. Levi was not a stupid guy. He was trying to protect his mates. It was difficult to see,” he added. Byline Times has since learnt that Levi later tracked the laptop using his iCloud ‘FindMy’ function but he vanished before he could try and recover it. He had also been worrying about people accessing his communications through malware on his devices. “He talked about people hacking into his information – into his laptop,” said Julie. “Certain things were going on with his accounts which were odd. He thought they had got into his personal details. It was around the time his laptop went missing – about a month before he went to Ibiza.” An analysis of Levi’s digital footprint showed that his email address, phone number, date of birth and a password appeared in an open-source data breach in March 2020. Although it hasn’t been forensically confirmed that bad actors used this or any compromised data to unlawfully access Levi’s private information, his social media accounts have been found to have exhibited unexplained activity. Security Code Levi’s brother Nathan has shown Byline Times new evidence regarding Levi’s WhatsApp. On 2 and 5 March 2023 his account generated a new security code on four occasions, which according to WhatsApp is: “likely because you or your contact reinstalled WhatsApp, changed phones, or added or removed a paired device.” Nathan said: “Suddenly my phone just said ‘your security code with Levi changed.’ The last time I’d had a notification like that was the day he was travelling to Barcelona and since then it’d been complete silence. “I thought it was really weird. Nothing had changed with my phone so I thought that meant activity on his side. I messaged him as soon as I spotted it – just said “bro”. But there was no reply. It still made me feel better – that he was alive. But now I don’t know what to believe.” Instagram Levi was a heavy Instagram user with more than 19,000 followers in 2022. According to a former advisor, Levi would often respond to “random people” and “didn’t always protect himself enough” on social media. Instagram has been a particular focus for speculation. Following his disappearance there were reports in British media that up to 38 contacts had been deleted from Levi’s account. A private detective claimed at the time that the deletio'
