["https://bylinetimes.com/2025/01/27/my-name-is-levi-davis-and-my-life-is-in-danger-reopening-the-case-of-the-rugby-star-who-disappeared"]
title = "‘My Name Is Levi Davis and My Life Is in Danger’ - Reopening the Case of the Rugby Star Who Disappeared – Byline Times"
description = "Articles predominantly based on historical research, official reports, court documents and open source intelligence."
full_description = 'On 29 October 2022, the British Rugby winger, singer, and reality TV star Levi Davis went missing in mysterious circumstances in Barcelona. Four days beforehand, he’d told his 19,000 Instagram followers his life was under threat from a sextortion gang. Now, a year after the case was officially shelved in Spain, police in the UK are facing calls from a Government Minister and Levi’s family for a full international review as Byline Times publishes a major new investigation. A version of this article was first published in the July 2024 edition of Byline Times It’s a missing person’s case with dark criminal undertones, conspicuously unsolved two years after the rugby union professional and reality television contestant Levi Davis stepped off a ferry in Barcelona and vanished. Twelve months later, police probes in the Catalan capital were being shelved without conclusion. Inquiries in the UK had already hit a brick wall; inert for lack of evidence as to the fate of the former Bath Rugby and X Factor: Celebrity star. The second anniversary of Levi’s disappearance passed on 29 October with no appeals for fresh information from the investigating force in Spain, the Mossos d’Esquadra. “We have nothing new,” it admitted when asked. To all intents and purposes, Levi’s case is cold. For his family and many friends, hopes of a miracle breakthrough have faded. Reluctantly, many are accepting Levi will never “just walk back through the door”. The loss has left an open wound, grief denied, and many many questions. The circumstances surrounding Levi’s disappearance are as perplexing as they are disturbing. Four days before he vanished on 29 October 2022, he waived his rights to anonymity and recorded a 15-minute Instagram post in which he said he was a victim of drug rape, death threats, and a long campaign of blackmail. “My name is Levi Davis,” the then 24-year-old told his 19,000 or so followers. “And my life is in danger.” A day after that, he deleted the video from public view, though – presciently, it turned out – shared it for safekeeping with old university friends. For, three days later, he was gone, apparently without a trace. The Levi grimly addressing the camera through a black and white filter, making claims of sexual abuse, coercion, corruption, organised crime, and the UK entertainment industry, was unrecognisable from the talented and trusting young extravert his friends knew and loved. Here instead was a man brought low, speaking of things more familiar to a P-Diddy indictment, or the plot of the Netflix show Baby Reindeer, and as far removed as could possibly be from the flying rugby winger whose talents and lust for life propelled him from a childhood in care to the brink of stardom. “Whatever happened to Levi hit him hard,” his birth mother Julie Davis told Byline Times. “He had his future in his own hands. And I think someone, some people, went out of their way to hurt him and control him. It’s heartbreaking. I can accept that Levi might well be gone forever. But I can’t accept that someone targeted my son and escaped any consequences.” <img decoding="async" class="wp-block-fabrica-article-preview-image__image" src="https://bylinetimes.com/wp-content/uploads/2024/10/Lost-Julie-Davis-at-the-port-in-Barcelona-where-Levi-was-last-located-credit-Sean-from-Byline.jpg" data-eio="l" /> EXCLUSIVE Fresh Evidence in Missing Levi Davis Cold Case Sparks Top-Level Calls for New Probe Dan Evans and Tom Latchem reveal fresh evidence in one of the most baffling missing person cases of recent years Dan Evans and Tom Latchem Things Do Not Add Up When Levi first disappeared there was an initial flurry of media interest fuelled in part by the public speculations of a private investigator who’d volunteered to solve the mystery. Febrile headlines about alleged £100,000 drug debts unpaid and supposedly imminent arrests of shadowy third parties muddied the water early. But as each line of inquiry came to nothing, so public attention dwindled. Then in October 2023, the Mossos d’Esquadra conceded defeat in a case it had described as “disturbing” and lacking “logical explanation”. According to its own official report, it concluded that the absence of Levi’s body meant there was “no sign of criminality”. The matter was going into cold storage indefinitely pending new evidence. In London, in January 2022, nine months before Levi vanished, detectives opened – and a week later closed – a report he made of a drug rape at a flat in the Ealing area of the city, in which he said he was filmed and then blackmailed. “An investigation was carried out and detectives spoke to the victim,” a Metropolitan Police spokesperson told Byline Times, adding: “The investigation could not be progressed further and was closed on 29 January 2022.” “Everything just stopped,” Julie said. “I get it that people go missing all the time, that bad things happen to good people, and that the police have to focus resources. But I wanted a second opinion. Too many things do not add up.” <img decoding="async" width="922" height="1324" src="https://bylinetimes.com/wp-content/uploads/2025/01/image-1-1.jpg" alt="" class="wp-image-242184" srcset="https://bylinetimes.com/wp-content/uploads/2025/01/image-1-1.jpg 922w, https://bylinetimes.com/wp-content/uploads/2025/01/image-1-1-654x939.jpg 654w, https://bylinetimes.com/wp-content/uploads/2025/01/image-1-1-327x470.jpg 327w, https://bylinetimes.com/wp-content/uploads/2025/01/image-1-1-768x1103.jpg 768w" sizes="(max-width: 922px) 100vw, 922px" data-eio="l" />Face of desperation: Levi addressing the camera for his disturbing Instagram post © Levi Davis/ Instagram ‘I Ask, No I Beg… Try to Understand’ Levi’s 15-minute Instagram post is difficult to watch. “I ask, no I beg, that you share that you listen and try to understand what I am telling you,” he implores. Byline Times has spent 17 months trying to do so. We began exploring Levi’s case in August 2023, while investigating the phenomenon of catfishing and online sexploitation. We tracked Julie down to an estate of smart executive homes in the West Midlands. She wasn’t easy to find, for good reason. At Levi’s insistence, his mum was taking care to protect her location, having not long moved house with his two younger siblings. “He was desperate for us all to move,” Julie told us. “He said people were threatening to harm us in order to get to him. He was scared for our safety.” In the course of our investigation, this newspaper has spoken to more than 40 separate sources. Many are happy to be quoted openly while others have asked not to be named for reasons including similar personal security concerns. We have spoken to Levi’s closest friends, former teammates, professional advisors, eye-witnesses, private investigators, other journalists, and – most disturbingly – people within an entertainment industry that exposed him to what appears to be unconscionable sexual and psychological abuse, to build the most definitive picture yet of his life and loss. And we have established a timeline that tracks Levi from the roar of the rugby stadium to the shiny floors of reality TV, where predators eye starlets “like candy”, to the streets of London and Birmingham, the Balearic party island of Ibiza, and (it seems likely) the treacherous open seas around the port of Spain’s famous old city. We found a story of three lives: of an infant born into a troubled upbringing; a youth lifted from uncertain prospects by rare sporting and musical talents; and a man whose quest for acceptance and identity left him wide open to base human exploitation in the digital age. This is the story of Levi Davis. Moonshot It is October 2019 and 21-year-old Levi is entering a new world. A casting agent for X Factor: Celebrity has heard of a precocious rugby talent with a strong voice, natural stage confidence, and compelling backstory. ‘The X Factor’: pop mogul Simon Cowell’s gladiatorial reality talent show franchise and an annual UK tabloid obsession in which – for 15 lucrative seasons – contestants sang for judges’ approval, viewer votes, and a moonshot at stardom. <img decoding="async" width="1144" height="1446" src="https://bylinetimes.com/wp-content/uploads/2025/01/image-1.jpg" alt="" class="wp-image-242181" srcset="https://bylinetimes.com/wp-content/uploads/2025/01/image-1.jpg 1144w, https://bylinetimes.com/wp-content/uploads/2025/01/image-1-654x827.jpg 654w, https://bylinetimes.com/wp-content/uploads/2025/01/image-1-327x413.jpg 327w, https://bylinetimes.com/wp-content/uploads/2025/01/image-1-768x971.jpg 768w" sizes="(max-width: 1144px) 100vw, 1144px" data-eio="l" />Happy days – Levi with fellow X Factor: Celebrity contestants during filming in 2019. © X Factor: Celebrity/ SyCo Entertainment For the very few, there was a record contract and manufactured music career at the end of the rainbow. For the rest, it was an entree to the fame game – a popularity contest with more snakes than ladders in which the naive seldom last long. Cowell’s producers loved Levi, the kid who came through foster care to win a full boarding scholarship to the £35,000-a-year Denstone College, study Sports Performance at Bath University, play for the England under-18s and 19s, and win a contract with Bath Rugby itself. They teamed him up with former England fullback Ben Foden and Scotland winger Thom Evans in a trio called Try Star. “Levi’s vocals carried the band,” said one management source. “[The others] were better known in the world of rugby, but he was the greater musical talent – Try Star needed him.” “He was really excited,” the management source added. “He went to LA to film at the X Factor judges’ houses and had an amazing time. They stayed in a great hotel. They got looked after. The camera crews were following them – Levi loved that side of it. It was all new to him. It appealed to his ego. I’d say he got carried away slightly in the buzz. But he was 21, so that was quite normal.” <img decoding="async" src="https://lh7-rt.googleusercontent.com/docsz/AD_4nXcf9PRR5oYhMT7AEHzphCskf3EygJJBpZ0f85Rdo_L7WFNGM2DLRCk4n1Jv0AUlJM2RmXSV3TvvdPxS5RuSHLSJQPpHYE9j1roLd3hHdj9u3AhrtGXu-Q9Rq9QQjYQngG3_cs_N?key=2o81WwA2vOa_K-oHiY9SADMH" alt="" data-eio="l" />A star rising: Levi filming X Factor: Celebrity in 2019 © Supplied Yet even at this early stage, it wasn’t all smiles amid the glamour. “Levi was the youngest and least famous of the three,” added a family source. “He felt overwhelmed sometimes. He phoned home from America in tears about it. He was homesick and miserable. But he pushed through and got on with the job.” Levi helped Try Star to fifth place in the series. Appearing on prime-time Saturday night television was a huge boost to his fledgling music career. But it also, seemingly, left him vulnerable – both to predators inhabiting the peripheries of the entertainment industry and aspects of his own nature. Organised Crime “It’s important that you know I am a personable guy,” Levi later told his Instagram followers. “I didn’t use (sic) to have a guard up. But for reasons I am about to tell you I have not been myself for a very long time.” “I do not blame this on anybody as we are all an aggregate of our own decisions,” he went on, before telling of being drug-raped, sexually extorted and hounded systematically to the point of mental breakdown. Levi’s sincerity is palpable. But the acceptance of personal responsibility – typical of a character forged in the close-knit collectives of professional team sport – seems misplaced given he was left fearing for his life. “By doing this I am not safe,” Levi said. “I try not to put individuals’ names in this. And I try to be as vague as possible through fear of retaliation. However, I understand that I am not the only one this is happening to. And this has happened to.” It’s hard to fathom the scale of Levi’s words, so monstrous are the things he describes. The allegations may resonate with anyone following the ongoing trial of the former Abercrombie & Fitch CEO Mike Jeffries, who has pleaded not guilty to sex trafficking charges. Or the life-imprisonment of ‘catfish killer’ Alexander McCartney the man from Newry, Northern Ireland, who groomed, sexually abused, and blackmailed around 3,000 children, sharing their images with other offenders across the world. As Levi put it: “With organised crime, it is not one person, it is an aggregate of people. People that you do not know. People that get into your lives through whatever means possible.” Against the Odds University friend Ben Kaiser recalled strong reservations in Levi’s friendship group about his suitability for celebrity life. “There was a view that going on that TV show was the worst thing ever for Levi – being exposed to the music industry, which is renowned for exploitation,” Mr Kaiser told Byline Times. “I don’t think he recognised when people were taking advantage – he just wanted to please people. He wouldn’t say ‘no’. The worst environment was to go on X Factor. But he wanted us to be proud of him.” In his Instagram post, Levi is clear that his troubles began after appearing on the Simon Cowell show. Byline Times has spoken extensively to sources including former contestants and staff on the 2019 edition of X Factor: Celebrity and found no evidence of wrongdoing by anyone connected with the production. “X Factor was a generally positive experience,” said Julie. “Although he didn’t like how controlling it was – he wasn’t allowed to use his own doctor for example – it was a big opportunity. “And there were all sorts of people buzzing around promising him things around the edges of the show. He talked about one music producer who was going to develop and promote his career even if he didn’t win. Levi was ambitious. He was also young and trusting. I think that was dangerous for him.” <img decoding="async" width="936" height="1190" src="https://bylinetimes.com/wp-content/uploads/2025/01/image-1-5.jpg" alt="" class="wp-image-242204" srcset="https://bylinetimes.com/wp-content/uploads/2025/01/image-1-5.jpg 936w, https://bylinetimes.com/wp-content/uploads/2025/01/image-1-5-654x831.jpg 654w, https://bylinetimes.com/wp-content/uploads/2025/01/image-1-5-327x416.jpg 327w, https://bylinetimes.com/wp-content/uploads/2025/01/image-1-5-768x976.jpg 768w" sizes="(max-width: 936px) 100vw, 936px" data-eio="l" />Behind the cameras: Levi and Try Star get some final adjustments before performing for the judges and onlooking live audience © Supplied A Cooler Crowd It was self-evident to those guiding Levi’s career that he would struggle to maintain professional sport and professional music at the same time. “Levi was always meant to go straight back to rugby,” said one former advisor. “That was the deal. But his head was turned. Music and TV brought a cooler crowd than rugby. And having had a taste of fame Levi was impatient for more. There was a lot of partying and schmoozing. Levi wanted to fit in. He was a young guy having fun. That’s where he started us'
