["https://bylinetimes.com/2025/01/29/sextortion-and-onlyfans-the-on-demand-content-king-and-the-case-of-levi-davis"]
title = "Sextortion and OnlyFans: The On Demand Content King and the Case of Levi Davis – Byline Times"
description = "Part Three of a five-part special investigation by Dan Evans and Tom Latchem into a missing person’s case with dark criminal undertones"
full_description = 'Byline Times is an independent, reader-funded investigative newspaper, outside of the system of the established press, reporting on ‘what the papers don’t say’ – without fear or favour. To support its work, subscribe to the monthly Byline Times print edition, packed with exclusive investigations, news, and analysis. Help us build the better media Britain deserves “Everybody knows the bio is where it gets sticky”, reads Levi Davis’ OnlyFans account landing page. Through the lens of what followed, the gambit is triple-loaded. Levi’s header image sets the tone of what – for $24 a month – he would be sharing. The strategically placed bottle green boxing gloves say enough. “Take a look and see what else you can find” invites a strapline with five suggestive emojis. What the intro didn’t tell people, though, is that “doing OnlyFans” had been at the front of Levi’s mind for a long time. And in the end, when he did, it was an act of defiance. But was it also a motive for murder? According to three primary sources Byline Times has tracked down during a 17-month special investigation into the rugby player’s unexplained disappearance, Levi had been coming under pressure for at least a year to perform on OnlyFans in order to earn money for a “sex trafficking” outfit. But when on 28 October 2022 he eventually posted content, the hashtag said something else: “My First Nudes #takeitback.” ​​“This is me taking my power back,” Levi had told Instagram a couple of days earlier. “I understand that they have videos of me. Hence why my OnlyFans makes sense.” Cries For Help The Instagram post itself was, on one hand, an act of rebellion and, on the other, a cry for help. A few days later, on 29 October 2022, Levi stepped off a ferry from Ibiza to Barcelona and disappeared, apparently without trace. He had given every impression of loving life during a brief jaunt up La Rambla for a pint at the Old Irish Bar. Seven hours after that, a man was seen stricken out to sea – four kilometres from the ferry gates, in a shipping lane, clothed, screaming for help, in the dead of night. The Catalan police believe it was Levi Davis. They said as much in their official report, right before icing his case. How he got there, they do not know – and they have not asked. But Byline Times has independently found powerful evidence to suggest that he could not have got there on his own. <img decoding="async" class="wp-block-fabrica-article-preview-image__image" src="https://bylinetimes.com/wp-content/uploads/2023/08/wootton-1308x938-1.jpg" data-eio="l" /> The Media Scandal the Media Didn’t Want to Touch: Byline Times Will Keep Exposing the ‘Dark Forces’ in the Shadows This newspaper will continue its special investigation into TV presenter Dan Wootton and expose wrongdoing in the established media – without fear or favour Hardeep Matharu Key Individuals Byline Times has further identified several key individuals who may have more information about what was happening in Levi’s life in the lead-up to his disappearance. Among them is an unnamed Brazilian trans woman who was “a fixture” at a number of the parties Levi was attending in London in 2020, and who is thought to have further knowledge of his lifestyle and the people he was encountering. Another is a television industry figure Levi claimed was targeting him in the UK, whose activities are examined in detail in a further part of this investigation. And a third is a person in whom Levi confided much – a friend in Ibiza who helped him set up his OnlyFans account. That person, Richard Squire, was also the last person to confirm seeing Levi before he left unexpectedly for Barcelona. Squire has given statements to the Catalan authorities about Levi’s disappearance and was prominent in the unsuccessful search for his friend. He is understood to be keen to assist the authorities and has said as much to Levi’s family. Julie Davis, Levi’s mother, said: “There are lots of loose ends and leads the police have never looked at and which I am calling on them to look at now.” Between Calm and Chaos When Levi first brought up his OnlyFans idea late in 2021, friends thought he was just being madcap. “It seemed incompatible with the music career he was trying to build and the sport that paid his bills,” said one former teammate and mentor. “I hoped he was joking.” By October 2022, however, the sport had suffered and the music was a long way from profitable. Rugby clubs had come and gone. Income dried up. But the blackmail seemingly remained. Under its weight, Levi’s life oscillated between calm and chaos; drugs and sobriety. By his own admission, his mental health was knocked. On Instagram he described a recent post-drugs psychosis diagnosis. He had been prescribed medication – also for depression and anxiety. Levi rejected the diagnosis and had travelled without his meds. “I have never seen him so deluded that he is imagining things,” said one close female long-term friend, “but he was vulnerable.” In that last video, Levi Davis looked haunted. Yet two years earlier, the athlete was on the very definition of an upward trajectory: scoring mazy tries from the wing for Bath, getting an ITV1 X Factor: Celebrity judges’ ovation for his soulful ‘No Diggity’, enjoying the attention his talent attracted. Hard, then, to overstate the impact of sextortion. Trap-House <img decoding="async" src="https://lh7-rt.googleusercontent.com/docsz/AD_4nXeKRZp5MGvTK7KoE8iQ_ywyfRYutWe3G6XDHF5QPGcejRaQojciNHXWbyLSZafFGVg668C2zUPZVAZd1Wk0WU2QFjrLr6h-yOu7OObIxljQCX8r9_QLcJRbSC--klO54ijYdNe6XQ?key=7DGysLwBmawZKTuSdrfECnF3" alt="" style="width:800px;height:auto" data-eio="l" />Levi’s home in West Ealing, London, became a trap house. Photo: Google Streetview The more the blackmail bit, the more it seems Levi sought distraction in drugs. When he moved into his flat in West Ealing in July 2020, backing on to a well-known supermarket, with an anonymous entrance of nondescript brick, he quickly met local dealers, operating out of a suburban “trap house”. At the time, Levi was enjoying success. He was playing for Ealing and appearing on TV. Outwardly, he was doing well financially. But, according to former colleagues, his money went as quickly as it came in. It has been a running theme in this investigation that Levi was often short of cash. Whether this was due, in part, to having to service the alleged blackmail, Levi’s Monzo and Barclays bank accounts might tell. But their contents have never – yet – been examined by police. Nor have the activities of the “trappers” – described as a “Somali county lines gang” – Levi got in trouble with. A friend said that “Levi was naïve about London” and “met these people in the street and thought they were friends”. “They came around to use his [music] studio equipment at first in his spare room,” the friend told Byline Times. “They were low-rent – selling skunk [marijuana], heavily cut cocaine and ketamine mainly.” Another source added: “It was easy for Levi to say ‘I’ll pay you back another time’. But that built up. Some things you just say have to learn to say ‘no’ to or they become too much to replenish. “These Somalis were giving him things that he could not afford. They were doing it on purpose, I believe. The first favour is fine. He had got some things for free and, at some point, he had to compensate. “They were just inconsequential figures from the street. It was obvious they were just using him. They stole his flatmate’s watch one time. They ended up taking over his flat to sell drugs from and hiring cars in his name and getting parking tickets and stuff and generally just being a problem.” This phase of Levi’s life is significant for three reasons. Firstly, it has been speculated in the media that he was fleeing these people when he disappeared, allegedly owing more than £100,000. Byline Times has learned through underworld contacts that this was untrue. “There are main suppliers whose job it is to know when someone owes a hundred grand for a drugs debt and Levi was not known to them,” according to a crime source. Secondly, although Levi was being bullied over a much smaller and almost certainly falsely-inflated sum of money, this newspaper has found it to be independent of the blackmail Levi spoke of on Instagram. And thirdly, it illustrates just how vulnerable Levi was. <img decoding="async" class="wp-block-fabrica-article-preview-image__image" src="https://bylinetimes.com/wp-content/uploads/2025/01/Losing-Levi-Logo.jpg" data-eio="l" /> ‘My Name Is Levi Davis and My Life Is in Danger’ – Reopening the Case of the Rugby Star Who Disappeared Part One of a five part special investigation by Dan Evans and Tom Latchem Dan Evans and Tom Latchem “Levi’s life was spinning out of control,” according to a source. “He wasn’t facing up to reality. Drugs were around him a lot more and it caused problems because people that loved him didn’t like to see it. “And it all completely coincided with what was going on in his other life – these chaotic parties. He was getting more and more unhappy, losing motivation, and in the end having bouts of deep paranoia. “He carried it all for about two years before he went to a doctor for some help. Predictably, they said it was the drugs that caused it. But Levi thought it was the other way around.” Critical New Proof? The exact nature of the blackmail allegations, though integral to the mystery of Levi Davis’ disappearance, has never been particularised. Byline Times has pieced a picture together based on many hours of source interviews and it seems clear that financial – and other – advantages may have been taken in more than one way. Julie Davis spoke to her son at length over a period of months about what was eating him. “The blackmail would be for him to go and work, whether it was here or abroad, for them,” she said. “It was really getting to his head. Whether he felt ‘I’ll go to Barcelona, or Ibiza and do some work for them, because otherwise they are just going to continue with the blackmail’, I don’t know. “I think the work might be of a sexual nature because he opened an OnlyFans account, he said, to take back ownership. They were blackmailing him and every day he just couldn’t focus or concentrate and he was worried for our lives. He felt it necessary to do it. I have told the police all of this. They said they need evidence.” Julie’s account is consistent with those of others. A management source said: “Levi talked about the parties [sex parties he was attending sometimes under duress]. They gave him stuff to hand out to people. “He said he was at this party and had taken drugs but he didn’t know what they were; that they had videos of him [taken afterward with a pretext of ‘role play’] and that he was being blackmailed and that it was [people] in the [entertainment] industry.” Another source spoke of an alert going up when Levi “disappeared for a few days” early in 2022 and missed a scheduled media engagement. Worried colleagues and loved ones tracked his iPhone to a café in South Kensington, London, where they found him deeply traumatised. A couple of days later, over a curry, he described regaining consciousness at one of the sex parties “with his feet in a bowl of water and an electric current attached”. “He was distressed and looked beyond horrific,” according to a source. “Pretty much straight away after that there was an intervention from his family to remove Levi from London.” <img decoding="async" class="wp-block-fabrica-article-preview-image__image" src="https://bylinetimes.com/wp-content/uploads/2025/01/Losing-Levi-Logo-2.png" data-eio="l" /> EXCLUSIVE Levi Davis – Murdered At Sea? Part Two of a five part special investigation by Dan Evans and Tom Latchem into a missing person’s case with dark criminal undertones Dan Evans and Tom Latchem ‘Blackmail Images’ Levi Davis spoke on Instagram about the need “to find evidence” of his abuse, which he said existed on the dark web. Byline Times has learned that he may have been at least partially successful. We have spoken to one associate who claims Levi entrusted them with one of the “blackmail images”. It is understood that the image will be made available to any investigating police force “if the person is asked”. The associate said: “Levi sent one of the images to someone he knew for safekeeping. It was a sexual image involving Levi and another person. He shared it confidentially with this person who has said they’ll pass it over to the police and the police only. “Julie Davis is aware of the situation and so are the police in the UK. It is now up to the police whether they are interested in taking statements. All they need to do is pick up the phone and ask.” Organised Abuse When Levi talked about his blackmail, he spoke of betrayal by people he had seen as “companions” in a London sex party scene who had gone on to wage a long-term campaign against him. In private messages with university friends, seen by Byline Times, he said he had been targeted in a “variety of schemes”. “Many times we had met but, on the last occasion, I was drugged and I was blackmailed,” Levi said publicly on Instagram. “I am no expert but do know what happened,” he added on the social media platform. “Shaping me into positions in films. Shaping me in role play all in the name of companionship – but these are not my companions. These are not my friends.” In his description, the relationship with his tormentors was complex. Levi spoke of “gaslighting”, digital surveillance, and overt threats to harm him and his family. There had been moments where he, seemingly, broke away for a while but “went back” to “conform” as he grew to “understand their demands”, he said. One of Levi’s group told Byline Times: “He started mentioning OnlyFans a few months before he went missing. It was quite sudden. There were subtle mentions – as I took it, jokes – and then he said, ‘I’m gonna do it – it makes sense that I do’. “We were surprised, and asked him if it was a great idea given he wanted to pursue an acting and singing career, but the financial side was enough for us to accept it made sense to him.” But another source, a very close friend and confidant between summer 2020 and late 2021, offers a further extraordinary component to Levi’s OnlyFans decision. “I remember Levi wanted to make a bit of money and, that for him to make money, whoever wanted money from him told him ‘we have to make an OnlyFans account under (your name) and that money will come to us’,” they said.” “Word for word, Levi told me ‘some mafia, some human trafficking people, they are threatening me, they are threatening to kill me if I don’t pay them back, and the only way I can pay them back is let them set up an OnlyFans account, and make content; all that sexual stuff’. “That was the blackmail. So, whatever he was gonna make from OnlyFans, that’s him paying them back.” The claim that Levi had been under pressure to set up on OnlyFans was confirmed by a second source. It is not clea'
