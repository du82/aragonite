title = "ByteTalk"
description = "聊聊程序员的故事"
full_description = "Linghao 曾就读于 CMU，目前在 Google 工作，生活在湾区，偏爱科幻小说和独立游戏，喜欢写作和分享。本次访谈会聊到他在 CMU 学习的一些经历，在 Google 从事的具体工作，从 Engineer 到 TL 到 TLM 角色的转变带来的心态和做事方式上的改变，时间管理，对科幻小说和独立游戏的一些见解和推荐，以及写作与分享方面的心得。内容较多，可以挑感兴趣的收听，相信会有所收获。 Xiaohanyu 在多家国外公司工作过（Shopee、gojek），旅居过多个城市，是一名全栈工程师，也是热文 教育对人的改变有多大？ 的作者，本期播客就跟 Xiaohanyu 来聊聊他的故事。 Shu 目前住在柏林，就职于 Vercel（也是 Vercel 早期员工），主要 Focus 在 Next.js 的研发。高中就接触编程，在前端开发和设计上有较深的积累，有不少受欢迎的作品：如 SWR，Satori, Nextra。本期播客我们就来聊聊 Shu 的故事。 Logseq 是一款注重隐私（数据存储在本地）、开源的笔记工具。上手简单，又足够灵活，可以记录想法、笔记、管理 Todo 等等。我自己近一个月每天都用它来记录各种事项。这期节目有幸邀请到了 Logseq 的创造者秦天生（tiensonqin），来聊聊 Logseq 背后的故事和理念。 Anthony Fu 是一个 Fulltime Open Sourcerer，有许多优秀的作品，是 Vue 和 Vite 团队的核心成员，目前在 NuxtLab 工作，本期我们就来聊聊他的故事。 初识 yihong 是通过他的 Running Page，记录了近 10 年的跑步数据，可以看到每天跑了多少公里和对应的跑步路线。能够坚持跑 10 年的人就很少（后来聊了下，原来跑了 20 年，只是跑步 App 只记录了 10 年），然后能把数据拿到还整理得这么清楚，还专门做了一个页面开源，就更少了。 本期访谈的嘉宾是 Randy，他目前在微软中国工作，从 14 年就开始写博客。能感受到他对编程的热情和一种理想主义情怀，就摘录他博客上的一段话作为嘉宾介绍吧："
