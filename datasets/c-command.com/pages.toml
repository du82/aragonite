["https://c-command.com/dropdmg/help/create-macos-install-di"]
title = "DropDMG Manual: Create macOS Install Disk…"
full_description = "Once you’ve downloaded the macOS installer from the Mac App Store, this command helps you to create an installation disk. This makes it possible to re-install macOS, install it in a virtual machine, or install it on a different Mac without having to download it again. Additionally, if there are problems with a Mac’s hard drive, you may not be able to boot it and access the installer or recovery partition, but you will still be able to reinstall from the install disk that you create here. You can also use it as an emergency disk to boot a Mac and repair or reformat its hard drive, or to restore from a Time Machine backup. When updating to a new version of macOS, it is recommended that you create your install disk before running the macOS installer, as the installer may delete itself (which would require you to download it again to create the install disk). Choose Create macOS Install Disk from the File menu. DropDMG will ask you to select an installer (downloaded from the Mac App Store or Apple’s developer site) and then to select a destination volume. It will then erase the destination volume and use it to create a bootable install disk. In rare cases, the macOS Catalina installer will say that it successfully created the install disk but actually create an empty Install macOS Catalina volume. DropDMG includes a workaround to try to prevent this from happening, but if this occurs it should work if you simply choose the Create macOS Install Disk command again. When running macOS 10.15 or later, you can use the softwareupdate command in Terminal to download installers for previous macOS versions: The Mac App Store version of DropDMG cannot create a bootable installer volume due to App Store limitations. However, you can still create one manually using the Terminal application: You will need to change Monterey to a different name depending on the version of macOS that you are installing. You will need to change Sierra to a different name depending on the version of macOS that you are installing."
