["https://c-command.com/dropdmg/help/mount-image"]
title = "DropDMG Manual: Mount Image…"
full_description = "The most straightforward way to mount a disk image is to double-click it. This works on any macOS installation, even if DropDMG isn’t installed. DropDMG also provides the Mount Image… command in the File menu, for additional options and convenience. When you double-click an encrypted disk image, macOS prompts you for the passphrase. DropDMG lets you avoid this step, which is particularly handy when bulk-mounting images with the same passphrase or when mounting segmented disk images. The Enter Passphrase… button lets you specify the passphrase for mounting the disk image. The From Configuration pop-down menu lets you use a passphrase that’s stored in your keychain as part of a configuration. One advantage of using DropDMG’s Mount Image… command, rather than double-clicking a disk image in the Finder, is that DropDMG only makes you enter the passphrase for an encrypted, segmented disk image once. The Finder requires that you type the passphrase once for each segment or that you store the passphrase in the keychain, which you might not want to do. Additionally, DropDMG’s Mount Image… command will skip the display of any software license agreements. You can hold down the Command or Shift key to mount multiple disk images at once using the same options."
year_published = 2025
clearnet = "https://c-command.com/dropdmg/help/mount-image"
