["https://c-command.com/dropdmg/help/configurations"]
title = "DropDMG Manual: Configurations"
full_description = "DropDMG provides many options for creating disk images and archives. Configurations let you create named sets of these options, so that you can quickly switch between your favorite combinations rather than re-entering all the settings each time. Use the + button to create a new configuration and the - button or the Delete key to remove one. Several commands are available in the action menu and contextual menu: Tip: You can quickly change configurations, without first opening the Settings window, by using the pop-up menu in the DropDMG window, by Control-clicking on DropDMG’s icon in the Dock, or by using Temporary options."
