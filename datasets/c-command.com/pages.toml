["https://c-command.com/blog/2024/03/08/dropdmg-3-6-7"]
title = "C-Command Software Blog      -  DropDMG 3.6.7"
full_description = "« EagleFiler 1.9.13 EagleFiler 1.9.14 » DropDMG 3.6.7 March 8th, 2024 (DropDMG) Update Download Buy DropDMG Version 3.6.7 of DropDMG is now available. DropDMG makes it easy to create a professional disk image for your app. Disk images pack entire folders or disks into a single compressed file, either for transport across the Internet or simply for backup or archival. They are Apple’s preferred format for distributing Mac software and the only archive format whose contents you can directly access in the Mac Finder—no extraction or third-party software required. Deliver your Mac app on a .dmg file with a software license agreement, a custom volume icon, and a precise icon layout atop a Retina-optimized background picture. Customers can install simply by dragging and dropping the app onto the convenient Applications folder link. Code-sign your .dmg so that macOS knows it can be trusted after download. This is a free update for owners of DropDMG 3.0 that includes the following enhancements: DropDMG now double-checks the positions of invisible icons to make sure they don’t appear on top of your layout. Fixed a bug where some errors when applying a layout were not properly handled. Improved the following sections of the manual: Change Image Passphrase… Command-line tool Creating a DropDMG Quick Action Signing Verify Signature… Why don’t the icons appear in the desired positions in the mounted disk image? Updated various user interface elements and documentation to reference updated locations in System Settings. Added an ellipsis to the Create macOS Install Disk… command and updated it for macOS 14 Sonoma. Each help page now has a link to a Google translation so you can view it in a different language. Made various fixes and updates to prevent Cocoa from logging warnings. DropDMG 3.6.7 works with macOS 10.13 through macOS 14. Older DropDMG versions are available for older versions of macOS. In-depth information about DropDMG is available in the manual. If you enjoy using DropDMG, please take a moment to review it on the Mac App Store, Product Hunt, or MacUpdate or to mention it on Twitter, Mastodon, Facebook, or your own site. We’d really appreciate it. Update (2024-03-08): DropDMG 3.6.7 has been submitted to the Mac App Store and is awaiting approval from Apple. Update (2024-03-08): DropDMG 3.6.7 is now available from the Mac App Store."
