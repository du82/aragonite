["https://c-command.com/dropdmg/help/basics"]
title = "DropDMG Manual: Basics"
full_description = "DropDMG automatically determines what you want it to do based on the files or folders that you give it. The goal is to create an output file that matches the options you’ve chosen in the settings. For example, suppose you’ve set DropDMG to create compressed .dmg files: When given multiple files or folders, DropDMG creates a separate disk image or archive for each. To group multiple items into a single image or archive, move them into a new folder, and then drop it on DropDMG. You can create a Quick Action for DropDMG and then invoke it from the Finder’s preview pane or the Touch Bar."
