["https://c-command.com/blog/2024/05/02/eaglefiler-1-9-14"]
title = "C-Command Software Blog      -  EagleFiler 1.9.14"
full_description = "« DropDMG 3.6.7 SpamSieve 3.0.4 » EagleFiler 1.9.14 May 2nd, 2024 (EagleFiler) Update Download Buy EagleFiler Version 1.9.14 of EagleFiler is now available. EagleFiler makes organizing and managing your information easy. It lets you archive and search mail, Web pages, PDF files, word processing documents, images, and more. Use it to collect information from a variety of sources. Browse different types of files using a familiar three-pane interface. Organize them into folders and annotate them with tags and notes, or leave everything in one folder and pin-point the information you need using the live search. Since EagleFiler stores its library in Finder format, you can use it in concert with the other tools in your Mac ecosystem. EagleFiler is a digital filing cabinet, a research assistant, snippet collector, and document organizer. You can use it to write a journal, track all the files for a project or job, manage your bookmarks, save your favorite Web articles, store financial statements and receipts, run a paperless office, plan a trip, collect your course notes, archive your e-mail correspondence, search mailing list archives, research a purchase, remember recipes to cook or books to read, store scientific papers, sort photos, gather legal case notes, or assemble a scrapbook. It’s the most flexible tool on your Mac. This is a free update that includes the following enhancements: Worked around a bug in Safari 17.4 that prevented the capture key from working. Worked around an issue where importing from Evernote could fail if the ENEX file contained a note with an invalid SVG file. Fixed an issue where the New Record ‣ From Clipboard command didn’t let you import by “pasting” a file after using Edit ‣ Copy in Finder. Updated the following sections of the manual: How can I encrypt my files? Importing From Safari Importing Mail From Apple Mail Importing Web Pages and URLs Fixed a bug where a phase search could incorrectly find a record where the search terms matched but not in the proper order. Fixed a bug where some files imported from Evernote could have truncated names or tags. Fixed a bug where importing from Evernote could fail if a note had multiple attachments with very long filenames that were similar. Fixed internal errors that could occur in the process of closing a library. EagleFiler 1.9.14 works with macOS 10.13 through macOS 14. Older EagleFiler versions are available for older versions of macOS. In-depth information about EagleFiler is available in the manual. If you enjoy using EagleFiler, please take a moment to review it on the Mac App Store, Product Hunt, or MacUpdate or to mention it on Twitter, Mastodon, Facebook, or your own site. We’d really appreciate it. Update (2024-05-02): EagleFiler 1.9.14 has been submitted to the Mac App Store and is awaiting approval from Apple. Update (2024-05-02): EagleFiler 1.9.14 is now available from the Mac App Store."
