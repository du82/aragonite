["https://c-command.com/dropdmg/help/sharing-licenses-and-la"]
title = "DropDMG Manual: Sharing Licenses and Layouts"
full_description = "DropDMG automatically saves configurations, licenses, and layouts in its folder in Application Support. You may, however, wish to share your licenses and layouts with other users. This is especially useful if you want to keep them under a version control system such as Subversion or Git. To export a configuration, drag it from the source list to the Finder. This will create a .plist file. If the configuration references any licenses or layouts, you will need to export them as described below. To export a layout, drag it from the source list to the Finder. This will create a folder containing an Info.plist, the background image file, etc. To export a license, drag it from the source list to the Finder. This will create a folder containing a .plist file and a .rtf file for each language. To import a configuration, layout, or license, quit DropDMG and drag the exported file or folder into the corresponding DropDMG folder: When creating a disk image using the dropdmg command-line tool, you can specify detached licenses or layouts using the --license-folder and --layout-folder parameters. The configuration options can be specified directly, without referencing an exported configuration file. Corresponding parameters are available for AppleScript."
year_published = 2025
