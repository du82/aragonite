["https://c-command.com/blog/2024/11/21/eaglefiler-1-9-16"]
title = "C-Command Software Blog      -  EagleFiler 1.9.16"
full_description = "« SpamSieve 3.1 SpamSieve 3.1.1 » EagleFiler 1.9.16 November 21st, 2024 (EagleFiler) Update Download Buy EagleFiler Version 1.9.16 of EagleFiler is now available. EagleFiler makes organizing and managing your information easy. It lets you archive and search mail, Web pages, PDF files, word processing documents, images, and more. Use it to collect information from a variety of sources. Browse different types of files using a familiar three-pane interface. Organize them into folders and annotate them with tags and notes, or leave everything in one folder and pin-point the information you need using the live search. Since EagleFiler stores its library in Finder format, you can use it in concert with the other tools in your Mac ecosystem. EagleFiler is a digital filing cabinet, an information organizer, and a snippet manager. You can use it to write a journal, track the files for a project or job, save your favorite Web pages locally, store financial statements, run a paperless office, plan a trip, archive your e-mail correspondence, search mailing list archives, or research a purchase. Use EagleFiler as a bookmark manager, a recipe database, and an issue tracker. Store scientific papers, assemble a scrapbook, or gather notes for a legal case or college course. It’s the most flexible tool on your Mac. This is a free update that includes the following enhancements: Improved the formatting of community notes and quote tweets when importing from X/Twitter. Worked around a bug in macOS 15 where sometimes the system help viewer wouldn’t open to the right help page. EagleFiler will instead open help files in the user’s Web browser. Fixed a bug where Merge Mailboxes/Message Files might fail if the files were stored in iCloud Drive but not downloaded to the Mac. Fixed a bug where EagleFiler might improperly recognize certain folders as mailboxes when importing. EagleFiler no longer triggers the “find devices on local networks” prompt on macOS 15. Made some changes to track down an issue where files stored in OneDrive on macOS 15 might be incorrectly reported as missing. Removed support for Growl, as all supported macOS versions now have Notification Center built-in. Removed various unused code. Fixed the broken help button in the Settings window. The diagnostic report now includes information about the app’s logs, the crash logs folder, and components that could cause AppleScript errors. EagleFiler is now built with Xcode 16 and the macOS 15 SDK. EagleFiler 1.9.16 works with macOS 10.13 through macOS 15. Older EagleFiler versions are available for older versions of macOS. In-depth information about EagleFiler is available in the manual. If you enjoy using EagleFiler, please take a moment to review it on the Mac App Store, Product Hunt, or MacUpdate or to mention it on Twitter, Mastodon, Facebook, or your own site. We’d really appreciate it. Update (2024-11-21): EagleFiler 1.9.16 has been submitted to the Mac App Store and is awaiting approval from Apple. Update (2024-11-21): EagleFiler 1.9.16 is now available from the Mac App Store."
