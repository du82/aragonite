["https://c-command.com/bbautocomplete/manual"]
title = "BBAutoComplete Manual"
description = "C-Command Software develops award-winning software for macOS."
full_description = "This manual is also available in BBAutoComplete’s Help menu, as a PDF (293K), and as multi-page online help. For other languages, please see Google Translate. BBAutoComplete adds word auto-completion to Affrus, BBEdit, Mailsmith, Microsoft Word, Script Debugger, Smile, Tex-Edit Plus, and TextWrangler. You type the start of a word, press a key, and BBAutoComplete types the letters to complete the word. If BBAutoComplete guessed wrong, you can keep pressing the key to cycle through other possible completions. Other auto-completion utilities need to be taught the abbreviations and expansions that you use; BBAutoComplete avoids this hassle by automatically looking for expansions in the program’s open documents. This means that it always suggests completions that are relevant to your current task. BBAutoComplete is probably most useful for programmers, who need to remember and type long variable and method names, but it can also help with prose writing. It’s useful any time you need to type long words quickly and accurately. BBEdit 9 and later have a built-in auto-completion feature, however BBAutoComplete is preferable in some ways: If you know AppleScript, you can hook it up to other scriptable text editors. If you do, please send me your glue script, so that I can include it with the BBAutoComplete distribution. BBAutoComplete includes AppleScripts that let you invoke it from inside other programs. To access these scripts, choose Show Scripts from the BBAutoComplete menu. Find the color corresponding to the application that you’re using, e.g. BBEdit 12. These scripts need to be installed in particular locations so that they show up in the Scripts menus of the aforementioned programs. The scripts go in the folder ~/Library/Application Support/BBEdit/Scripts. You may need to set the trigger keys after installing the scripts. The Launch and Quit Scripts folder contains optional scripts that open BBAutoComplete when you open your editor and quit it when your editor quits."
