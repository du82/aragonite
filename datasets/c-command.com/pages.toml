["https://c-command.com/scripts/index"]
title = "C-Command Scripts"
full_description = "Most scripts have an Install Location listed at the top of the page that will tell you where the script should be installed. For some scripts, the Install Location will say Droplet. In this case, open the script in Script Editor, choose File ‣ Export…, and set the File Format to Application. Once the Script menu is activated, each installed script will appear in the menu when the relevant application is frontmost. To run the script, just select it from the menu. FastScripts is a third-party application that provides an enhanced Script menu. The script files are installed in the same location as with the system Script menu. FastScripts supports keyboard shortcuts (see the Suggested Key Binding recommended for some scripts) and also runs the scripts more quickly. A script saved as a droplet is a regular macOS application. You can drag and drop files onto the application to have it process them. Each script’s page lists a Last Modified date. If you open a downloaded script file in Script Editor, the top of the script will show where it was downloaded from and the Last Modified date. If the script on this site was modified more recently than your copy of the script, we recommend replacing your script with a freshly downloaded copy."
author = "Michael Tsai"
