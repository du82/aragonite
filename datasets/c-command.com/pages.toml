["https://c-command.com/dropdmg/help/layouts"]
title = "DropDMG Manual: Layouts"
full_description = "When you double-click a disk image, macOS mounts it and opens a Finder window showing its top-level contents. Layouts let you control the appearance of this window: the window position, background picture, view options, and icon positions. Additionally, when you create a disk image with a layout, DropDMG sets it to automatically open the window when mounting the image or inserting a disc burned from the image. Note: The files/folders that you add to a layout are only used for the purposes of designing the layout, i.e. specifying where each icon goes. The actual contents of the disk image are determined by the source folder that you drag onto DropDMG. Normally, you would add an icon to the layout for each file that will be in your source folder. However, a layout can have more files than the source folder, in which case you can reuse that layout for different purposes. A layout can also have fewer files than the source folder, in which case DropDMG will leave the icon positions of the extra files unspecified. See the Making Images With Background Pictures section for a tutorial on creating disk images with background pictures and layouts. Use the + button to create a new layout and the - button or the Delete key to remove one. Several commands are available in the action menu and contextual menu: DropDMG automatically saves the layouts that you create, as you edit them. You can also create copies of the layouts outside DropDMG, as described in the Sharing Licenses and Layouts section. Set the background image by dragging an image file onto the well or by clicking the Choose… button. The background image determines the size of the layout. If you do not specify a background image, DropDMG uses a plain white background with dimensions 640×480. The background image can be a 72 or 144dpi image, a PDF file, or a multi-resolution TIFF file. DropDMG will render a multi-resolution background picture that’s optimized for display on both Retina and non-Retina Macs. DropDMG looks at the background image’s actual resolution (dots per inch) to determine whether to treat it as Retina; it does not, e.g., look for @2x in the filename."
year_published = 2025
