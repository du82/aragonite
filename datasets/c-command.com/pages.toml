["https://c-command.com/blog/2019/09/03/bbautocomplete-1-6-1"]
title = "C-Command Software Blog      -  BBAutoComplete 1.6.1"
full_description = "« EagleFiler 1.8.9 DropDMG 3.5.7 » BBAutoComplete 1.6.1 September 3rd, 2019 (BBAutoComplete) Download Version 1.6.1 of BBAutoComplete is now available. BBAutoComplete adds word auto-completion to scriptable applications. You type the start of a word, press a key, and BBAutoComplete types the letters to complete the word. If BBAutoComplete guessed wrong, you can keep pressing the key to cycle through other possible completions. Other auto-completion utilities need to be taught the abbreviations and expansions that you use; BBAutoComplete avoids this hassle by automatically looking for expansions in the program’s open documents. This means that it always suggests completions that are relevant to your current task. BBAutoComplete is probably most useful for programmers, who need to remember and type long variable and method names, but it can also help with prose writing and LaTeX. It’s useful any time you need to type long words quickly and accurately. This update includes the following enhancements: The Software Update… installer now works on macOS 10.15. If you’ve already updated to macOS 10.15, you can use it to download the new version but will have to install it manually, as described in the Updating From a Previous Version section of the manual. BBAutoComplete now supports the Hardened Runtime on macOS 10.14 and later. BBAutoComplete is now notarized by Apple. Fixed a bug where the front-window-only script for BBEdit reported an error. The About window now includes a link to the privacy policy and has an updated layout. Improved support for Dark Mode. Improved the diagnostic report. Updated to Xcode 10.3. BBAutoComplete 1.6.1 works with macOS 10.7 through 10.15. Older versions are available for older versions of macOS. In-depth information about BBAutoComplete is available in the manual."
year_published = 2025
