["https://c-command.com/privacy"]
title = "Privacy Policy"
description = "C-Command Software develops award-winning software for macOS."
full_description = "We respect your right to privacy and collect as little data from you as is reasonably possible. We never sell, rent, or give away your data to anyone. None of your data is subject to automated decision making. Please contact us if you have any questions about this privacy policy or need to update any of your information. All user data (e.g. e-mails filtered or trained with SpamSieve, files edited or imported into EagleFiler, disk images or archives created with DropDMG) stays on your Mac. None of our apps transmit it to any servers. We rely on reputable companies such as Paddle, FastSpring, and Apple, to process orders. They have their own privacy policies. When placing an order with Paddle or FastSpring, you may need to enter your name, e-mail address, billing address, and phone number. The address and phone number are only used for fraud prevention; we will not send you anything in the mail or call you. We receive this billing information via a secure connection and store it on our server in order to help identify you if you contact us to look up your serial number or request information about your order. We never have access to your credit card or bank account number. Our applications have a Software Update… feature to automatically check for new versions. This is enabled by default, but you can opt out by unchecking Check for updates automatically. If enabled, the software will periodically contact our c-command.com Web server over a secure connection. It transmits the following information to the server: the name of the product and its version, the version of macOS, the kind of Mac and processor, whether the application has been purchased, the name and version of the current mail program, the values of certain esoteric preferences, and the name of the current language. This information is used to guide future product development. No personal information is transmitted. Instead of the Software Update… command, applications purchased from the Mac App Store have a similar feature to check for news about the application. You can opt out by choosing Check for News… from the application menu and unchecking Check for news automatically."
