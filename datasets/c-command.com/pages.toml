["https://c-command.com/dropdmg/help/new-blank-disk-image"]
title = "DropDMG Manual: New Blank Disk Image…"
full_description = "This creates an empty disk image with the specified format and size and mounts it in the Finder. The blank disk image acts as a virtual disk. Applications can directly read and write to files stored on the disk image, but the files disappear when you eject the disk image. Double-click the disk image file to make its contents accessible again. By setting the disk image to be encrypted, your virtual disk can act as a mini FileVault. When using FileVault, your entire drive is encrypted. Disk images created by DropDMG use the same encryption technology as FileVault, but they let you encrypt select groups of files with different passwords and also ensure that backups of those file are encrypted. Case-insensitive APFS is the file system used by macOS 10.13 and later. Blank disk images of this type can be used for testing how apps work with a file system that is Unicode normalization-preserving (unlike HFS+) but not normalization-sensitive. Developer preview with macOS 10.12.4 and later. Fully supported on macOS 10.13 and later. Note: macOS 10.13 currently has two bugs that can lead to data loss if you try to copy more data to a sparse APFS disk image than its containing volume can hold."
