["https://c-command.com/blog/2023/09/21/spamsieve-3-0"]
title = "C-Command Software Blog      -  SpamSieve 3.0"
full_description = "« EagleFiler 1.9.12 SpamSieve 3.0.1 » SpamSieve 3.0 September 21st, 2023 (SpamSieve) Update Download Buy SpamSieve Version 3.0 of SpamSieve is now available. Save time by adding powerful spam filtering to the e-mail client on your Mac. SpamSieve gives you back your inbox, using Bayesian spam filtering to provide amazing accuracy that’s constantly improving. SpamSieve learns and adapts to your mail, so it’s able to block nearly all the junk—without putting good messages in the Junk mailbox. It’s quick and easy to control SpamSieve from within Apple Mail, Outlook, Airmail, MailMate, GyazMail, Mailsmith, and more. SpamSieve running on your Mac can keep the spam off your iPhone/iPad, and you can even train SpamSieve from your iOS device. SpamSieve protects your privacy. It does not need access to your mail account login and does not transmit your mail data anywhere. All the processing is done on your Mac. SpamSieve 3.0 is a major upgrade. It costs $39.99 for new users (no subscriptions), $19.99 for previous SpamSieve owners, and is free for people who purchased SpamSieve 2.x on or after January 1, 2023. There’s a 30-day fully-featured trial for new users and upgraders. If you’re updating from SpamSieve 2, SpamSieve 3 will start out in trial mode, and you can just click the Check Upgrade Options button to have it take you to the store and automatically apply the upgrade discount. If you aren’t ready to upgrade yet, SpamSieve 2 is still available, and you can downgrade by quitting SpamSieve and replacing the new app file with the old one. All your data is preserved. Highlights SpamSieve 3 is compatible with macOS 10.13 (High Sierra) through macOS 14 (Sonoma) and is recommended for all customers using those versions of macOS. SpamSieve 3 is required for customers using Apple Mail with Sonoma. We recommend updating SpamSieve before updating to Sonoma. Here’s a guide explaining the transition. When you launch SpamSieve 3, it will offer to automatically migrate all your old training data and accuracy statistics (so that you don’t need to retrain it), or you can choose to start fresh. Your SpamSieve 2 data is left untouched, so it’s possible to revert to the old version if necessary. The new version of the Apple Mail plug-in also works with SpamSieve 2. Training done with version 2 after updating to version 3 will stay with version 2 (and vice-versa). The Apple Mail integration has been completely rewritten for compatibility with macOS 14 Sonoma. On Sonoma, SpamSieve now uses a Mail extension rather than a Mail plug-in (as Sonoma no longer supports plug-ins). The extension needs to be enabled in Mail’s Settings ‣ Extensions window. It is no longer necessary to install any files or to give SpamSieve Full Disk Access. You will now train SpamSieve from the SpamSieve menu bar icon at the top of the screen or from SpamSieve’s Dock icon, rather than from the Message menu in Mail. If you had previously used SpamSieve with Apple Mail, the first time SpamSieve launches on Sonoma it will explain how to make the transition to using the Mail extension. The new setup is also described in the Setting Up Apple Mail section of the manual. With earlier versions of macOS, you can continue using the Mail plug-in, as before. With macOS 13 Ventura and macOS 12 Monterey, you can choose whether to use the Mail extension (which is simpler to set up) or the Mail plug-in (which is more customizable). You can click Uninstall Plug-In… (which will also offer to delete the old Mail rule) in Settings ‣ Apple Mail ‣ Setup if you plan to switch all your Macs to using the extension. The Microsoft Outlook support has been rewritten to be simpler and easier to set up. It is no longer necessary to install any script files. The Outlook Filter Mailboxes helper app is no longer needed. If you don’t store large amounts of mail in your inbox, it’s no longer necessary to create any rules in Outlook. If you had previously used SpamSieve with Outlook, you can continue to use the existing scripts and Outlook Filter Mailboxes, or you can remove the Outlook Filter Mailboxes app and switch to the new setup by following either the Setting Up Outlook or Setting Up Outlook (Large Inboxes) instructions. SpamSieve’s e-mail parser has been rewritten in Swift for better accuracy, stability, and speed. SpamSieve is better able to understand messages that use newer e-mail formats, as well as malformed messages that don’t follow the specification. Where previous versions might get confused and give up (ignoring parts of the message) or even crash, the new parser engine is more resilient. Being able to read and understand more of the e-mail message increases the filtering accuracy, since it’s able to see spammy content that was invisible to SpamSieve 2, either because of bugs in the e-mail sending software or because spammers were deliberately trying to evade filters. The corpus, blocklist, and allowlist have been rewritten to use a new database format. This greatly reduces SpamSieve’s launch time and memory use, while enabling lots of new features. The text-based log file and history database have been replaced by a new log database and Log window, which is easier to browse and search. The log includes lots more information about each message to help you understand what SpamSieve did and why, and what you might want to do in response. It should be your first stop when troubleshooting. The Settings window has been redesigned, consolidating options and commands that were previously in other menus, scripts, or esoteric preferences. Many of the labels have been reworded for clarity, and there are now links to open relevant sections of the help for more detailed explanations. There is now a Show Dock icon setting to more easily hide SpamSieve’s Dock icon. With the Dock icon hidden, you can access all of SpamSieve’s windows and commands from the new SpamSieve menu bar icon. If both the Dock icon and menu bar icon are hidden, you can still access the settings by opening SpamSieve from your Applications folder when it’s already running. Apple Mail Filtering is now controlled from within SpamSieve’s Settings window rather than from Mail’s settings. You can now choose to Enable spam filtering using Mail extension (for the newer, simpler setup) or Enable spam filtering using Mail plug-in (which works the same way as in SpamSieve 2). You can also select Disable spam filtering in Apple Mail to temporarily turn off filtering (without having to uninstall anything). The Settings window has new buttons to Install Plug-In or Uninstall Plug-In…. The latter will also uninstall any SpamSieve rules. To stop using the Mail extension, you can just select Disable spam filtering in Apple Mail, which removes SpamSieve’s launch agent. There’s nothing further to uninstall, aside from the app itself. There’s a new Filter Messages menu command to manually apply SpamSieve to the selected messages. This has a keyboard shortcut of Command-Control-L. Mail’s Apply Rules command has a keyboard shortcut of Command-Option-L, and it still works to apply the Mail rules, but it no longer applies SpamSieve when using the Mail extension (because there is no more SpamSieve rule). We have long recommended setting Mail to move the messages SpamSieve catches to the All Junk mailbox rather than to the Spam mailbox. This is still the case when using the Mail plug-in, and with the Mail extension the Spam mailbox is no longer an option. There remains a SpamSieve setting to control where spam messages move when you train them. If you had been using Spam, you may want to change this to Junk so that all your spam messages end up in the same place. SpamSieve normally moves spam messages to the Junk mailbox. When using the Mail extension, there’s a new Move it to the Trash if the spam score is at least option. This separates the more spammy messages (in Trash), which are less likely to be mistakes, from the less spammy ones (in Junk), so that you can concentrate your efforts on reviewing those. For example, if you set the score to 99, when you train a message as spam, its sender will go on SpamSieve’s blocklist, and future messages from the same name or address will go directly to the Trash. There’s a new Mark it as read setting to mark new messages as read if SpamSieve thinks they’re spam, e.g. so that you aren’t distracted by the unread count in Mail’s sidebar. The Color the background according to how spammy it is setting is now available in the Settings window (instead of via the Change Settings command). There’s now a legend so that you can see which spam levels the different colors correspond to. There’s a new Filter spam messages in other mailboxes option. This makes it possible for SpamSieve to filter messages that other rules (either in Mail or on your mail server) moved out of the inbox. This is especially important when using the Mail extension, because Mail only sends new messages to the extension if they remain in the inbox after processing your Mail rules. With the Mail plug-in, this was not a concern because the SpamSieve rule was at the top of the list, so it was applied first. However, even with the plug-in, Mail does not apply rules to messages that were moved out of the inbox by a server rule or by another device before they got to your Mac. With this option, it is now possible for SpamSieve to filter all new messages, no matter where they are. Filtering messages in other mailboxes is not immediate: SpamSieve needs to periodically check whether any new messages have arrived. If you receive lots of new messages and spend a lot of time in Mail, you may see a new message before SpamSieve does. It may not be clear whether a spam message is visible because SpamSieve made a mistake and thought it was good or simply because SpamSieve hadn’t had a chance to examine it yet. The new Add green flag to unread good messages option lets you choose to have SpamSieve mark messages that it has checked with a green flag. Messages with no flag are pending processing; they are not mistakes that need to be trained as spam. In rare cases, a Mail bug may prevent new messages from being sent to the SpamSieve extension for analysis. You can enable green flags for the inbox using the Including in the inbox option, and if this and the Log window show that SpamSieve is not seeing the inbox messages, you can add the inboxes to the Select Mailboxes to Filter… sheet to have SpamSieve filter them without relying on the Mail extension. You can now control from the Settings window whether messages that you train as spam are moved to the Junk, to the Trash mailbox, or to a custom mailbox; and whether they should be marked as read. You can also control whether messages trained as good are moved back to the inbox or marked as unread. SpamSieve now shows an error message and help link in the settings if it’s missing Automation access to control Apple Mail or Full Disk Access to use the Apple Mail plug-in. The new Setting the Junk Mailbox in Apple Mail section to the manual consolidates and updates several previous sections. The Apple Mail - Rescue Good Messages and Apple Mail - Remote Training scripts are still supported. They do not need to be updated to continue working with SpamSieve 3. They work best when SpamSieve is set to move trained messages to the Junk mailbox. Outlook Filtering is now controlled by SpamSieve itself rather than using the Outlook Filter Mailboxes helper app. In SpamSieve’s Settings window, you can choose to Enable spam filtering for Inbox. This is a simpler setup that’s available for users who don’t keep lots of old messages in the inbox. You can also choose to Enable spam filtering for InboxSpamSieve, which uses Outlook rules to temporarily store messages in the InboxSpamSieve folder until they have been processed, as with previous versions of SpamSieve. You can also select Disable spam filtering in Outlook to temporarily turn off filtering or if you want to uninstall—there are no more extra files that need to be manually deleted. You can now train SpamSieve from the SpamSieve menu bar icon at the top of the screen or from SpamSieve’s Dock icon, rather than from the system script menu. The training commands now have keyboard shortcuts. There’s a new Filter Messages menu command to manually apply SpamSieve to the selected messages. You can now set in the Settings window how often SpamSieve checks for new messages to filter. There’s also a Filter Now button that shows whether filtering is currently in progress and lets you tell SpamSieve to filter right away. The Settings window now has a Mark less spammy messages as “Uncertain Junk” checkbox. There are also checkboxes to control whether messages trained as spam (or good) are moved to the Junk E-mail folder (or to the inbox) or marked as read (or as unread). SpamSieve still supports Outlook 2011. This works the same way as in SpamSieve 2, except that the scripts can now be installed directly from the Settings window, and there are links to the setup instructions right there. SpamSieve now shows an error message and help link in the settings if it’s missing Automation access to control Apple Mail or Outlook. Other Settings The Filters and Training settings have been consolidated. There are now buttons to open the various SpamSieve windows directly from the Settings window, along with links to open the relevant help sections. The old Use Habeas Safelist, “ADV” messages are spam, and Encoded HTML mail is spam filters have been retired. The old Allow good/spam duplicates in corpus checkboxes were not very useful and have been removed. The Update Address Book “Me” Card command has been replaced with an Edit Addresses button, as it no longer worked due to privacy restrictions in macOS. This is useful in conjunction with the Catch spam sent from my own addresses setting (which used to be called Exclude my addresses). Notification sounds are now shown without filename extensions and are remembered even if extension hidden flag is changed. SpamSieve now supports Notification Center, with options for notifying for Good messages sent from Contacts, Other good messages, The number of new good messages, and Uncertain spam messages. There’s now a slider for controlling which messages are considered uncertain. The old support for Growl notifications has been retired. There’s a new Other Clients tab of the Settings, which offers installation buttons and links to the setup instructions for the other mail apps that SpamSieve supports. Bayesian Filtering SpamSieve is better able to understand Emoji and Asian languages, so that runs of these characters are properly tokenized into words even when they are not separated by whitespace. This greatly improves the filtering accuracy for messages containing such characters. SpamSieve also has a better understanding of Unicode normalization and of certain special characters, which improves recognition of words that had been seen before, but in a slightly di"
