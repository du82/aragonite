["https://c-command.com/blog/2024/07/01/spamsieve-3-0-5"]
title = "C-Command Software Blog      -  SpamSieve 3.0.5"
full_description = "« SpamSieve 3.0.4 EagleFiler 1.9.15 » SpamSieve 3.0.5 July 1st, 2024 (SpamSieve) Update Download Buy SpamSieve Version 3.0.5 of SpamSieve is now available. Save time by adding powerful spam filtering to the e-mail client on your Mac. SpamSieve gives you back your inbox, using Bayesian spam filtering to provide amazing accuracy that’s constantly improving. SpamSieve learns and adapts to your mail, so it’s able to block nearly all the junk—without putting good messages in the Junk mailbox. It’s quick and easy to control SpamSieve from within Apple Mail, Outlook, Airmail, MailMate, GyazMail, Mailsmith, and more. SpamSieve running on your Mac can keep the spam off your iPhone/iPad, and you can even train SpamSieve from your iOS device. SpamSieve protects your privacy. It does not need access to your mail account login and does not transmit your mail data anywhere. All the processing is done on your Mac. SpamSieve 3.0.5 is a free update for those who have already purchased the SpamSieve 3.0 upgrade. If you’re using SpamSieve 2 and haven’t upgraded yet, the easiest way is to first let SpamSieve install the new version. At launch, it will show the Purchase window, and you can click the Check Upgrade Options button to get the upgrade discount without having to enter your old serial number. The changes in this version are: Apple Mail Preliminary testing shows that SpamSieve is compatible with macOS 15 Sequoia Developer Beta 2. Further updates may be required when Apple updates Mail in a subsequent Sequoia beta. Worked around some problems where Mail could temporarily hang during spam filtering if the network connection was very slow or when encountering a macOS bug where Mail redownloads messages that have already been downloaded. If SpamSieve detects that Mail is slow reading a message, it will postpone filtering for a while to give it time to finish downloading everything. It can also help to go to Mail ‣ Settings ‣ Accounts ‣ Account Information and set Download Attachments to All for each account. This will encourage Mail to fully download messages right away. The Filter Now button in Settings ‣ Apple Mail ‣ Filtering can now be used to manually filter the Mail inboxes, even when automatic filtering is disabled or postponed. Worked around an issue where sometimes filtering in Mail didn’t work because Mail was so bogged down that it couldn’t read the inboxes for SpamSieve in a timely manner. The mailbox outline for Filter spam messages in other mailboxes now recognizes the lowercase spam and junk names as being for mailboxes that should not be filtered. Fixed a bug where SpamSieve would try to repair files related to Mail plug-ins when running on macOS 14, which doesn’t support plug-ins. Fixed a bug where updating certain settings could cause a spurious error to be logged if you were not using the Mail plug-in. Improved the error reporting to track down a Mail AppleScript issue when finding new messages to filter. Microsoft Outlook The Settings ‣ Outlook ‣ Setup window clarifies that, when using Enable spam filtering for Inbox, the non-spam messages left in the inbox are marked with the Good category after SpamSieve has processed them. Settings Fixed a bug where the notification score slider was too narrow on macOS 10.13. Modernized the editable text fields to use shaded bezels instead of solid lines. Secondary label text throughout the user interface now uses the modern gray coloring. Icons Due to a macOS bug, clicking the SpamSieve menu bar icon does not show the menu when the Mac has multiple displays, a window on the secondary display is full screen, and you are clicking the menu bar icon on that display. You can work around this by accessing the SpamSieve commands in another way (e.g. via the keyboard shortcuts or the menu bar icon on the main display) or by unchecking Show Dock icon in the settings. Fixed a bug where the application icon in the Dock or Command-Tab switcher could appear pixellated when it was badged to show that SpamSieve was in the process of filtering or training a message. General SpamSieve now disables automatic filtering for Apple Mail and Outlook when the Mac is not connected to the Internet, to avoid hangs that could occur when trying to read messages that can’t be downloaded from the server. The Open in External Viewer command now works in the Corpus and Log windows when the table view has a selected message but doesn’t have keyboard focus. Improved the error reporting when a database can’t be accessed because the disk is full. Worked around a problem where SpamSieve could crash if Core Data’s conflict resolution failed because the database file was damaged. Made various updates for macOS 15, Xcode 16, and Swift 6. Documentation Improved the following sections of the manual: Apple Mail Customization If Apple Mail Is Running Slowly Log Move it to the Trash if the spam score is at least Only Filtering Certain Accounts Show menu bar icon Uninstalling SpamSieve SpamSieve 3.0.5 works with macOS 10.13 through macOS 15 and requires an e-mail client. Older SpamSieve versions are available for older versions of macOS. In-depth information about SpamSieve is available in the manual. If you enjoy using SpamSieve, please take a moment to review it on MacUpdate or to mention it on Twitter, Mastodon, Facebook, or your own site. We’d really appreciate it."
