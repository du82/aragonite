["https://c-command.com/dropdmg/help/custom-volume-icon"]
title = "DropDMG Manual: Custom volume icon"
full_description = "Normally when a disk image is mounted, it shows up on the desktop with a plain white icon that looks like a hard drive. With this option checked, DropDMG will customize the icon in one of two modes: If the top level of the image contains an application, DropDMG will badge the application’s icon onto the gray or white drive icon. Or, if the disk image contains a single file, DropDMG will badge that file’s icon onto the drive. DropDMG renders an optimized version of the badged icon for each size up to 512×512. DropDMG currently does not support directly creating a .sparsebundle or .sparseimage disk image with a custom icon. You can, however, create a .dmg disk image with a custom icon and then convert it to the desired format."
