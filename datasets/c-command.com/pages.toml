["https://c-command.com/bbautocomplete/help/using-bbautocomplete"]
title = "BBAutoComplete Manual: Using BBAutoComplete"
full_description = "To use BBAutoComplete, type the first few letters of a long word in one of the supported applications. Then invoke the BBAutoComplete AppleScript from the Scripts menu, or use a keyboard shortcut (Command-/ by default). BBAutoComplete will insert the letters to complete the word. If you aren’t happy with the completion BBAutoComplete chose, invoke the BBAutoComplete AppleScript again. You can do this repeatedly to cycle through possible completions. The order in which BBAutoComplete suggests completions is deterministic. With a little practice you’ll be able to predict what BBAutoComplete will suggest, and how many completions you’ll need to cycle through to get the one you want. Here are the rules: Note that this auto-completion algorithm is the same as dabbrev-expand (M-/) in GNU Emacs, except for being case-sensitive. (If you don’t know what Emacs is, stick with BBEdit.)"
