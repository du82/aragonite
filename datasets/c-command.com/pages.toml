["https://c-command.com/dropdmg/help/signing"]
title = "DropDMG Manual: Signing"
full_description = "Apple recommends that Mac applications be distributed on disk images that are code signed. The signature allows the customer to verify that the downloaded disk image is exactly as you created it, that it has not been maliciously modified, and that it was created by a valid Mac developer registered with Apple’s Developer ID program. If the disk image is not signed, an application stored on it will be subject to Gatekeeper Path Randomization (a.k.a. App Translocation). That is, macOS will copy it to a read-only, random location prior to launch. The app will not be able to update itself or access its external resources, and it can lose privacy permissions that you had granted. macOS stops using path randomization on an app when the user moves it (via Finder—other ways of moving the file don’t work). However, neither the failure mode nor the remedy is made clear to the user, so it’s best to avoid potential problems entirely by using a signed disk image. macOS 10.12 and later automatically verify the signature when mounting a disk image. Signed disk images can still be mounted on earlier versions of macOS, which ignore the signature. To have DropDMG sign your disk image, choose the appropriate signing identity from the Signing pop-up menu in the Configurations settings. This is probably one whose name begins with Developer ID Application. In the event that you have multiple identities with the same name, DropDMG will show a tooltip that shows the SHA1 hash for the identity so that you can tell which is which. Signed disk images can be created on macOS 10.11.5 and later. Only read-only disk images in .dmg format can be signed. Secure signing requires access to Apple’s trusted timestamp server, so your Mac must be connected to the Internet when you create the disk image with DropDMG. You can verify the signature of a disk image or archive, and see who signed it, using the Verify Signature… command. Separate from code signing, Apple recommends that applications and disk images be notarized. Notarization is required for new developers starting with macOS 10.14.5 and for all developers starting with macOS 10.15. (“Required” means that, without notarization, macOS will prevent launching the app and will show a scary alert window saying that it couldn’t check the app for malware.)"
