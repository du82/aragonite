["https://c-command.com/dropdmg/help/making-a-bootable-devic.html"]
title = "DropDMG Manual: Making a Bootable Device Image of a Hard Drive"
full_description = "A device image is a special kind of disk image that is an exact, block-level copy of the source volume and its filesystem, including features such as hard links and compressed system files. You can use device images to: Since a device image is an exact copy of a drive, DropDMG has to make sure that the drive contents don’t change while it’s making the image. In order to do this, it unmounts the drive, copies the data, and then remounts the drive. The startup disk is always in use and thus cannot be unmounted. To create a device image of your startup disk there are several options: If you just want to a create a regular (non-device) image containing all the files and folders on a volume, you can use CreateDeviceImages in the esoteric preferences to tell DropDMG not to create device images."
