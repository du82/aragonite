["https://c2.com/sportscar.html"]
title = "English Sports Car"
full_description = '''It's not our car. Of course we too would like to know what is up. Why would anyone choose those particular letters for a vehicle license plate? If you're the owner, or know the owner, or just have any more insight into the coincidence please let us know. PL has been kind enough to offer this explaination. I imported the Mazda MX5/ EUNOS sports car (in British Racing Green of course) and had to buy a number plate. I chose C because my christian name is Cliff and chose C2 because C1 wasn't available. ".COM" is certainly to advertise that that's the business I'm in. Also in the UK the middle letter of the 'COM' part used to signify where the car was registered. 'O' is for Birmingham the city I originally came from. The Number C2.COM certainly causes a lot of interest, with people stopping me for a chat, and shouted comments from other drivers when we are in a traffic jam. AND I'm quite certain that the local police know the number... so I have to be a paragon of virtue. Immediately I had purchased the no. I checked to see whether the domain name was available and regrettably you had already purchased it. I like your idea of number plate collecting. I will arrange a photograph of C2.COM for you. By the way the'.' is only the head of a screw, pretending to hold the number plate in place!! Next time I see the car parked, I must also leave a note for Cliff to thank him for putting me out of my misery. He must also be a bit of a local celebrity by now!'''
year_published = 2025
