["https://c2.com/kaweah/index.html"]
title = "The Kaweah River Page"
full_description = "The Kaweah River is located in the foothills of the southern Sierra Nevada Range of California along Highway 198 at the southern entrance to Sequoia National Park. The river passes through the small town of Three Rivers and ends up in Lake Kaweah (Terminus Reservoir). It's one of the shortest drainages in the US from its headwaters at 12000 feet to Lake Kaweah. The Kaweah River, like its neighbors the Kings, Tule and Kern, never sees the Pacific Ocean. Instead, it splits into many channels upon entering the San Joaquin Valley below Lake Kaweah and is mostly consumed by irrigation. What's left, if any, ends up in Tulare Lake. Local weatherstation CW4177 is operated by the Kaweah River Page since 2005. Try all the below links to see what you like best. CWOP site will always be most current as that is where the raw data is uploaded. Other sites get their data from CWOP time delayed. Temperature, Rainfall and Snowpack Graphs for current conditions in Sequoia National Park. This is one of the webmaster's favorite links. (plot images in this page are broken ever since DWR reconfigured it's plotting methods and broke a good thing, the ability to embed DWR plots in a webpage. DWR broke a really good thing and I can't seem to be able to DWR to fix it.) Disclaimer: River running is inherently dangerous. Know and understand the AWA Safety Code before you attempt any whitewater activities. The author makes no warranties as to the accuracy of the information contained herein. ....Bla, bla, bla.... Find out more About the Author or The History of the Kaweah River Page or Send Email to the author/webmaster at or Our Home on the Kaweah River Internet Provider and Sponser of the Kaweah River Page, Cunningham and Cunningham Inc. (c2.com) Computer Consultants The Kaweah River Page, http://c2.com/kaweah/Copyright © 1996 through 2016 by Bill Pooley. All rights reserved. The Kaweah River Page is a non profit web site. The links to commercial operations have been freely donated as well as political endorsements. This web page is Y2K compliant and tediously edited by hand. It contains no browser corrupting, site slowing Java or Java script, cookies, annoying popup windows and only a rare occational banner ad. The main page is designed to work with a dialup connection. Only a simple html editor, Araneae, is used to highlight the html syntax during editing. Spelling and errors in grammar are par for the course, I'm an engineer for Heaven sakes, not an English teacher. This website is best viewed on a monitor with at least 768x1024 display size and 16 Million colors."
