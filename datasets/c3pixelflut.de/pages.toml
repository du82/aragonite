title = "F.A.Q. | c3Pixelflut"
description = "Pixelflut auf dem Chaos Communication Congress"
full_description = "F.A.Q. German (english below) Wie schnell seid ihr angebunden? Lokal am Pixelfluttisch sind wir mit 40 Gigabit zum Switch verbunden. Dieser ist wiederum mit 10 Gigabit zum Congressnetz angebunden. Am Tisch hast du somit eine gute Chance auf ein volles Gigabit mit deinem Laptop. Warum erreiche ich den Server nicht über WLAN? Wir haben Verbindungen aus dem WLAN blockiert, um das WLAN für alle halbwegs nutzbar zu halten. Bitte nutzt das verkabelte Netzwerk. IPv6? Ne... Ums für alle fair zu halten gibt's nur legacy IPs. Wo finde ich den Quellcode des Servers? Den findest du hier Server Source (opens new window) Wie kann ich etwas zur Website beitragen? Feel free to support us. Source (opens new window) In case of Pixel-Panic: CALL DECT PIXL (7495) English How fast is your connection? Locally at the Pixelflut table, we’re connected to the switch at 40 Gigabits. In turn, that switch is connected to the Congress network at 10 Gigabits. So at the table, you have a good chance of reaching a full Gigabit with your laptop. Why can’t I reach the server via Wi-Fi? We’ve blocked Wi-Fi connections so that the wireless network remains reasonably usable for everyone. Please use the wired network. IPv6? No, thanks. Where can I find the server’s source code? You can find it here: Server Source (opens new window) How can I contribute to the website? Feel free to support us. Source (opens new window) In case of Pixel-Panic: CALL DECT PIXL (7495)"
