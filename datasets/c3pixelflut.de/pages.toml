title = "Wie? | c3Pixelflut"
description = "Pixelflut auf dem Chaos Communication Congress"
full_description = '''Wie? Server IPs Den Server an der Wand erreicht ihr aus dem Congress netz und dem Rest der 🌍 unter wall.c3pixelflut.de und lauscht auf dem TCP-Port 1337 Bei uns Lokal am Switch (Ja nur da!) ist der Server über table.c3pixelflut.de auf TCP-Port 1337 erreichbar. Der Server für Einsteiger ist bei uns Lokal am Switch (Ja nur da!) erreichbar via newcomer.c3pixelflut.de und lauscht auf dem TCP-Port 1337 ⚠️ Verbindungen aus dem WLAN werden blockiert️⚠️ Statistiken Die Statistiken zu unserem Server findest du unter stats.c3pixelflut.de (opens new window) Befehle PX <x> <y> <rrggbb|aarrggbb> # Setze den Pixel an der Stelle x und y mit angegebener Hexadezimal Farbe PX <x> <y> # Antwort des Servers entspricht dem Hexadezimal Farbe des Pixels SIZE # Antwort des Servers entspricht der Spielfeldgröße auf dem Server OFFSET <x> <y> # Setze den offset für die zuküntigen Pixel der Connection Beispiel Python3 Script in Python3 #!/usr/bin/python3 import sys import socket from PIL import Image sock = socket.socket(socket.AF_INET, socket.SOCK_STREAM) sock.connect((sys.argv[1], int(sys.argv[2]))) def pixel(x, y, r, g, b, a=255): if a == 255: sock.send(b'PX %d %d %02x%02x%02x\n' % (x, y, r, g, b)) else: sock.send(b'PX %d %d %02x%02x%02x%02x\n' % (x, y, r, g, b, a)) im = Image.open(sys.argv[3]).convert('RGBA') _, _, w, h = im.getbbox() for x in range(w): for y in range(h): r, g, b, a = im.getpixel((x, y)) pixel(x, y, r, g, b, a) Aufruf python3 client.py wall.c3pixelflut.de 1337 picture.png'''
