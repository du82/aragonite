title = "HTB Forwardslash Writeup - c4e’s Blog"
description = "Forwardslash is a hard-rated box (medium difficulty imo) in which we exploit an LFI in the web server to get access to some sensitive info that lets us SSH in. In our initial SSH session we exploit a SUID binary to obtain once again read access to a file with credentials that we use to move laterally to another user. From there we have sudo rights to access an encrypted luks image file, so we only have to bruteforce the key to then gain root and complete the machine."
full_description = "HTB Forwardslash Writeup Forwardslash is a hard-rated box (medium difficulty imo) in which we exploit an LFI in the web server to get access to some sensitive info that lets us SSH in. In our initial SSH session we exploit a SUID binary to obtain once again read access to a file with credentials that we use to move laterally to another user. From there we have sudo rights to access an encrypted luks image file, so we only have to bruteforce the key to then gain root and complete the machine. Updated: July 4, 2020 Twitter Facebook LinkedIn Previous Next Comments Bypassing GLIBC 2.32’s Safe-Linking Without Leaks into Code Execution: The House of Rust The House of Rust is a heap exploitation technique that drops a shell against full PIE binaries that don’t leak any addresses. Q4CTF 2020 Heap Writeups Soluciones a los problemas de heap del CTF de Q4 del 2020: Wallet, Mision, Motoko, 420. Sombrero-Q4 CTF [PWN] Berlin Aquí dejo un writeup cortito para el desafío Berlin de la categoría PWN, hecho por dplastico del CTF de SombreroBlanco, llevado a cabo el fin de semana del 25 de Julio. Tenia una puntuacion de 500 pts y, si bien el CTF tenia puntuacion dinámica, se mantuvo ahi por la baja cantidad de soluciones que tuvo. HTB ropmev2 Writeup ropmev2 was a fun binary exploitation challenge by r4j in which we needed to rop our way through some twists to be able to build a successful exploit."
