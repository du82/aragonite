["https://c4ebt.github.io/2021/01/22/House-of-Rust.html"]
title = "Bypassing GLIBC 2.32’s Safe-Linking Without Leaks into Code Execution: The House of Rust - c4e’s Blog"
description = "The House of Rust is a heap exploitation technique that drops a shell against full PIE binaries that don’t leak any addresses."
full_description = 'Bypassing GLIBC 2.32’s Safe-Linking Without Leaks into Code Execution: The House of Rust The House of Rust is a heap exploitation technique that drops a shell against full PIE binaries that don’t leak any addresses. If you prefer to read this on Github, check out this repo. Breakdown The House of Rust leverages a UAF to perform a number of well-known attacks that when combined result in the bypass of single list Safe-Linking without the need for leaks. The weak point it targets to effectively bypass Safe-Linking is the tcache stashing mechanism. It utilizes some Heap Feng Shui, one Tcache Stashing Unlink+ attack, one Tcache Stashing Unlink attack, two largebin attacks and finishes off with a FSOP attack on the stdout FILE stream. About Safe-Linking From the original CheckPoint Research post on the creation of Safe Linking: Safe-Linking makes use of randomness from the Address Space Layout Randomization (ASLR), now heavily deployed in most modern operating systems, to “sign” the list’s pointers. When combined with chunk alignment integrity checks, this new technique protects the pointers from hijacking attempts. Safe-Linking XORs single list pointers with the 28 ASLR bits of the heap location of the pointer, making it impossible to corrupt successfully without a heap leak. Here’s their code implementation: #define PROTECT_PTR(pos, ptr, type) \ ((type)((((size_t)pos) >> PAGE_SHIFT) ^ ((size_t)ptr))) #define REVEAL_PTR(pos, ptr, type) \ PROTECT_PTR(pos, ptr, type) Where pos is the position of the pointer in the heap, PAGE_SHIFT is 12 for 64-bit environments, and ptr is the original single list pointer. A Note to Safe-Linking Creators Again, from the original CheckPoint Research post: “Safe-Linking is not a magic bullet that will stop all exploit attempts against modern-day heap implementations. However, this is another step in the right direction. By forcing an attacker to have a pointer leak vulnerability before he can even start his heap-based exploit, we gradually raise the bar.” Mad respect for Eyal Itkin and all the people that participated in the creation and implementation of the Single List Pointer Mangling. In my opinion, it is one of the most effective security mitigations that GLIBC has implemented lately. Although “forcing an attacker to have a pointer leak vulnerability before he can even start his heap-based exploit” is now proven to not be 100% accurate :D. About Other Techniques At the time of publication I’m only aware of the existence of one other technique that claims to bypass Safe-Linking without leaks: The House of IO by @Awarau1, which is described in his blog. The House of IO targets the tcache_perthread_struct to gain control over unmangled tcache_head pointers. As mentioned in the blog post: The attack demands that the attacker has an underflow primitive, a use-after-free at a specific offset [+8] from the beginning of a struct, or a primitive which allows the attacker to place the tcache_perthread_struct on a tcache linked list. (…) Statistically speaking (at least from our experience), an underflow is by far less common than a plain overflow vulnerability. Additionally, to make the free() variants of this attack useful in the real world there are corner cases which need to be fulfilled – such as a UAF on a pointer field at an offset of 8 bytes within a struct, a badly ordered set of calls to free() on a struct, or through some other means by which to call free() on a pointer to the tcache_perthread_struct. In my opinion (and it looks like the author of the blog post agrees), the primitives required for the House of IO are too demanding and unrealistic. The House of Rust implementation I will present in this post also uses the tcache_perthread_struct, but simply because it is the weakest useful spot after the implementation of Safe-Linking and therefore results in a cleaner exploit. The HoR primitives perfectly allow for a direct attack into libc’s stdout FILE stream without any need of touching the tcache_perthread_struct. Such an attack would require one extra Tcache Stashin Unlink+ attack and one extra largebin attack, so I opted for a tcache_perthread_struct approach. In that sense, the House of IO and the House of Rust are completely distinct, as their central targets are different mechanisms (tcache_perthread_struct and tcache stashing mechanism respectively). Regardless of all this, kudos to @Awarau1 as well for developing a smart bypass very shortly after the new GLIBC version was released. Variations and Requirements The vanilla House of Rust technique requires good heap control where allocation pointers aren’t nulled, leading to UAF scenarios. It requires around 65 allocations with sizes of up to 0x1b00. The stdout FSOP technique used in the vanilla version requires that the binary isn’t line-buffered or fully-buffered. House of Corrosion variation: The “House of Crust”. The House of Rust Safe-Linking bypass primitives can be leveraged into a way more complex variation leading to a House of Corrosion-like attack (hence the name “House of Crust”). This variation shares the same requirements as the vanilla HoR, except it needs a higher number of allocations and request sizes. The upside is that it doesn’t require the target binary to not be line-buffered or fully-buffered, since it relies completely on relative overwrites and doesn’t aim for the same stdout FSOP. Both the House of Rust and the House of Crust require a 1/16 libc load-address entropy bruteforce. Previous Knowledge As mentioned in the breakdown, the House of Rust utilizes a number of other attacks to achieve its primitives. If you haven’t heard of them before or want to know how they work in detail I encourage you to do so before reading this post to get a better understanding of everything. Detailed explanations about these attacks can be found in the following links: Tcache Stashing Unlink and Tcache Stashing Unlink+ attacks: https://qianfei11.github.io/2020/05/05/Tcache-Stashing-Unlink-Attack/ Post 2.30 Largebin Attack: https://github.com/shellphish/how2heap/blob/master/glibc_2.31/large_bin_attack.c Stdout Leak-Oriented FSOP: https://vigneshsrao.github.io/posts/babytcache/ House of Corrosion: https://github.com/CptGibbon/House-of-Corrosion/blob/master/README.md House of Rust Summary The House of Rust can be divided into 5 steps that are executed in the following order: Heap Feng Shui Tcache Stashing Unlink+ (TSU+) and Largebin attack Tcache Stashing Unlink (TSU) and Largebin attack stdout FSOP leak Final shell Stage 1: Heap Feng Shui The sole purpose of this stage is to set up the heap for the other attacks. Thus, I will skip its explanation in this section and will reference it along the way. Keep in mind that it is very important to make all (or most) allocations in the beginning of the exploit, since allocating other chunks afterwards might get them served from unintended places such as forgotten smallbin chunks, or it could sort chunks from the unsortedbin into their respective bins when not intended. Stage 2: Tcache Stashing Unlink+ and Largebin Attack Start by allocating 14 0x90-sized chunks (this size is not strictly the only option but it is the one I recommend). 7 of these chunks will be later freed into their tcachebin, allowing the next 7 chunks to go to the unsortedbin and be immediately sorted into the 0x90 smallbin. Additionally, 5 more allocations are required for a largebin attack (3 fencepost, 0x20-sized chunks, 2 large chunks). Before allocating the first 14 chunks, allocate 2 large chunks such that the second qword of data of the second chunk overlaps the size field of the 14th 0x90-sized chunk. Free both of these chunks, consolidating them with the top chunk and “resetting” the heap. Repeat this step such that the second qword of the second chunk overlaps the bk_nextsize field of the first large chunk. Again, free both chunks to “reset” the heap. The purpose of this is to be able to edit the 0x90-sized chunk size and the large chunk bk_nextsize through the UAF bug. These chunks will be called write-after-free (WAF) chunks. After setting the position of these 2 WAF chunks properly, allocate a 0x30 sized chunk to later free it to write its address to the respective tcache_head in the tcache_perthread_struct. Free the first 14 chunks ascending in an interwoven manner to avoid consolidation, filling up the tcachebin and putting 7 chunks in the unsortedbin. Allocate a large chunk to sort the unsorted chunks into the 0x90 smallbin. Edit the first WAF chunk to change the 14th chunk size so it chains with the first large chunk (0xb0 size if the fencepost chunk is 0x20 sized). Using the UAF, free the 14th chunk a second time, putting it into the 0xb0 tcachebin and writing the tcache_key to the chunk’s second qword of data. Note that freeing this chunk into the tcachebin corrupts both the smallbin fd and bk. The tcache_key points to the beginnig of the tcache_perthread_struct. Edit chunk 14 to modify its bk’s LSB, changing it to "\x80". This points it higher up in the tcache_perthread_struct, more specifically to the 0x30 &tcache_head - 0x18. The presence of the 0x30 tcache_head is important to satisfy the need for a writable address in the TSU+ attack. At this point, the 14th chunk is sorted into the smallbin and its bk is ready, pointing at the target location for the TSU+ attack. The issue is that the chunk’s fd is completely corrupted, and executing the TSU+ attack now would cause a crash. This is why Tcache Stashing Unlink attacks were thought to be completely leak-dependant (until now ;) ). The corrupt fd pointer can be “fixed” with a largebin attack. Aim a largebin attack at the first qword of the 14th chunk. To do this first free the first large chunk and sort it into its largebin by requesting a larger chunk and then freeing it. Overwrite the LSB of its bk_nextsize using the second WAF chunk. This ends up corrupting its fd_nextsize, but it doesn’t matter. Make the bk_nextsize point to the address of the 14th chunk - 0x10. Then, free the second large chunk and request and free a larger chunk to sort it into the largebin. This results in the address of the second largebin being written to the 14th chunk’s fd. Edit the second largebin chunk and modify its bk’s LSB to point it back to the 14th chunk. This closes the smallbin chain, and the TSU+ can be executed effectively without crashing or aborting. Finally, trigger the TSU+ attack. To do this, empty up the tcachebin by allocating seven chunks from it, and then allocate one more chunk, which will be served from the smallbin, to start the stashing mechanism and execute the attack. This stage results in the 0x90 tcache head being pointed to the 0x080 offset from the tcache_perthread_struct. At this point, the next 0x90 sized request will be served at the tcache_perthread_struct. Stage 3: Tcache Stashing Unlink and Largebin Attack As explained in the first stage, most of the allocations that are part of this stage actually have to be made at the beginning of the exploitation in the Heap Feng Shui stage, to avoid sorting or servicing chunks unintendedly. The purpose of this stage is to write a libc value somewhere in the tcache_perthread_struct close to the final chunk allocated in the second stage. The pros of using a TSU attack instead of a TSU+ attack in this stage is that there is no need for a writable address to be present at the target+0x18. Start by allocating 15 0xa0 sized chunks (again, this size is not strictly the only option but it is the one I recommend). In a similar fashion to the second stage, allocate 5 more chunks (3 0x20 sized, fencepost chunks and 2 large chunks). Note that the large chunks used in this stage must not belong to the same largebin as the ones used in the first stage. If the chunks used in the first stage belonged to the 0x400 largebin, use chunks that would go into the 0x480 largebin for this stage. Similarly to the previous stage, allocate large chunks and free them to get WAF chunks to overwrite critical metadata later. The same metadata has to be overwritten: the 15th small chunk’s size, and the first large chunk’s bk_nextsize. Again, like in the second stage, free the 15 chunks ascending in an interwoven manner to avoid consolidation, filling up the tcachebin and putting 7 chunks in the unsortedbin. Allocate a large chunk to sort the unsorted chunks into the 0xa0 smallbin. From here, this stage is exactly the same as the second stage, except the LSB that is overwritten over the tcache_key has to point up a little higher in the tcache_perthread_struct (there is some freedom here). Executing the largebin attack and later the TSU attack achieves the goal of writing a libc address into the tcache_perthread_struct close to the final stage 2 chunk. Stage 4: stdout FSOP leak The goal of this stage is to get a libc leak through a stdout FSOP technique. Start by editing the chunk over the tcache_perthread_struct to overwrite the 2 LSBs of the libc value written on the third stage to point it to the stdout FILE structure. This requires guessing 4 bits of libc load-address entropy. On a successful guess, a chunk can be allocated from the appropiate tcachebin overlapping with _IO_2_1_stdout_. From here, the FSOP technique to get a leak is fairly simple, and is described thoroughly in this post by sherl0ck. To execute the technique, overwrite the _IO_2_1_stdout_._flags field with the value 0xfbad1800. Null out the following 3 qwords, belonging to the fields _IO_read_ptr, _IO_read_end and _IO_read_base. Finally, null out the next qword’s LSB belonging to _IO_write_base. This produces a huge information leak the next time there is stdout activity through the file stream. Keep in mind that all these fields have to be overwritten at the same time, else unexpected behavior may occur. Stage 5: Final Shell Having a libc leak, the final stage of getting a shell is extremely simple. Edit the chunk over the tcache_perthread_struct writing the value of &__free_hook over some tcache_head. Allocate a chunk from the appropiate tcachebin, and overwrite __free_hook with the address of system. Finally, edit a chunk in the heap putting the string "/bin/sh\x00" in its first qword and then free it. This results in a call to system("/bin/sh\x00"), dropping a shell. House of Crust The House of Crust utilizes the House of Rust primitives to leverage a House of Corrosion-like attack and drop a shell on completely leakless (yes, no stdout FSOP for leak) PIE binaries. Disclaimer The House of Crust transplanting primitives can be achieved in a GLIBC build-independent basis, but the final FSOP attack heavily depends on the GLIBC build. As there is still no official or universally accepted GLIBC version 2.32 build for most systems, I had to build my own from source. I experimented and built 6 different libcs (from 2 different sources in 3 different systems), and the final FSOP attack I use in this demonstration was only possible on this build due to sy'
