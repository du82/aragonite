sky Le Sacre du printemps Igor Stravinsky Mars, the Bringer of War Gustav Holst Mars, the Bringer of War Gustav Holst Mercury, the Winged Messenger Gustav Holst Mercury, the Winged Messenger Gustav Holst Moonlight Ludwig van Beethoven Neptune, the Mystic Gustav Holst Neptune, the Mystic Gustav Holst Piano Quintet No. 2 Gabriel Fauré Piano Quintet No. 2 Gabriel Fauré Quintet Luigi Boccherini Quintet Luigi Boccherini Rondo Alla Turca (Turkish March) Wolfgang Amadeus Mozart Saturn, the Bringer of Old Age Gustav Holst Saturn, the Bringer of Old Age Gustav Holst Spring Antonio Vivaldi Spring Antonio Vivaldi Summer Antonio Vivaldi Summer Antonio Vivaldi Symphonie fantastique Hector Berlioz Symphonie fantastique Hector Berlioz Symphony No. 40 in G minor Wolfgang Amadeus Mozart Symphony No. 40 in G minor Wolfgang Amadeus Mozart Symphony No. 41 in C Major, “Jupiter” Wolfgang Amadeus Mozart Symphony No. 41 in C Major, “Jupiter” Wolfgang Amadeus Mozart The Barber of Seville Overture Gioachino Rossini The Barber of Seville Overture Gioachino Rossini The Four Seasons Antonio Vivaldi The Four Seasons Antonio Vivaldi The Four Seasons Antonio Vivaldi The Four Seasons Antonio Vivaldi The Planets Gustav Holst The Planets Gustav Holst The Planets Gustav Holst The Planets Gustav Holst Toccata and Fugue in D Minor Johann Sebastian Bach Uranus, the Magician Gustav Holst Uranus, the Magician Gustav Holst Venus, the Bringer of Peace Gustav Holst Venus, the Bringer of Peace Gustav Holst Wedding March Felix Mendelssohn Wedding March Felix Mendelssohn William Tell Overture Gioachino Rossini William Tell Overture Gioachino Rossini Winter Antonio Vivaldi Winter Antonio Vivaldi How they were made I can't read music but I can parse it. The talent of reading music has always escaped me which is a little ironic considering I grew up in a musical family. However, I've always enjoyed how sheet music looks so I took a shot at visualizing the notes from musical scores and the result is this series of p