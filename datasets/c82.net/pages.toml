["https://c82.net/typography/term/albion-press"]
title = "Albion press - A Brief Visual Exploration of A Dictionary of Typography"
description = "An Iron Press in which the power is gained by causing an inclined piece of steel to become perpendicular; in so doing the platen is forced down, and the impression takes place at the moment the piece …"
full_description = "First edition Second edition Albion press An Iron Press invented by Mr. R. C. Cope. It is of great power, and smooth and easy in working. It is much esteemed for its extreme lightness; it runs very easily, the pull is short, the power great, and the means whereby it is obtained so simple that there is little fear of the Press getting out of order. The power is gained by causing an inclined piece of steel to become perpendicular; in so doing the platen is forced down, and the impression takes place at the moment the piece of steel is brought into a vertical position. On the return of the bar, the platen is raised by a spiral spring fixed on the head of the press. Albion press An Iron Press in which the power is gained by causing an inclined piece of steel to become perpendicular; in so doing the platen is forced down, and the impression takes place at the moment the piece of steel is brought into a vertical position. On the return of the bar, the platen is raised by a spiral spring fixed on the head of the press. The great merits of this press are—Its great power, and, the means whereby it is obtained being so simple, there is little danger of its getting out of order; it is smooth and easy in working; the pull is short; and it is extremely light. It is very easily taken down for cleaning, and put up again. Following are instructions for its erection:— Put the feet on the staple, as marked, and raise the staple on them; then place the spring and box on top of staple, dropping in the long loop bold, which is connected with it, into the long hole in the centre. Connect the piston by passing the round bolt through the hold in the staple, and fasten with pin and washer. Put the pull-handle in its place with bolt, tightening it so as to allow the pull-handle to be free. Attach on, with the four screws, the slides or guide pieces to the piston. Place the chill, or crooked piece, in the piston, also the tumbler, or wedge-shaped piece, taking care the bright or numbered side is toward the pull-handle. Connect the chill with the bolt in pull-handle, and screw up the nut or top of the spring-box sufficiently to draw back the pull-handle, so as to keep all parts in their places. The wedge and brass guard in front of piston are intended to regulate the impression exerted on the forme. The other parts of this press may be fixed in the same manner as the Columbian (q.v.). « Back"
