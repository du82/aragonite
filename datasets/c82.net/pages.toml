title = "Abbreviation - A Brief Visual Exploration of A Dictionary of Typography"
description = "The form to which a word or phrase is reduced by contraction or omission; or a letter or a combination of letters standing for a word or phrase of which they are a part; as S. for south; J. for Joseph…"
full_description = "First edition Second edition Abbreviations In the primitive times of Printing most Latin words were abbreviated, in order to save paper, composition, and presswork. As reading, however, became more general, they were by degrees abolished, except in legal works. The present practice in regard to abbreviations,—as in side-notes, &c.,—is not to abridge a word at the end of a syllable, but always to annex one or more letters of the next syllable; and always to carry the reading part so far that it cannot be mistaken for any other word. A vast number of abbreviations are in use at present, such as Ps. for Psalms; Jan. for January; A.B. for Artium Baccalaureus (Bachelor of Arts); L.S. for locus sigilli; Juv. for Juvenalis, &c. A complete list of these will be found in “The Guide to Typography,” by Henry Beadnell, 1859, Vol. I., p. 199, et seq. Abbreviation The form to which a word or phrase is reduced by contraction or omission; or a letter or a combination of letters standing for a word or phrase of which they are a part; as S. for south; J. for Joseph. In the primitive times of Printing most Latin words were abbreviated, in order to save paper, composition, and presswork. As reading, however, became more general, they were by degrees abolished, except in legal works. The ancient printers did not divide words at the ends of lines by hyphens. To avoid divisions they used vowels with a mark of abbreviation to denote that one or more letters were omitted in the word: e.g., cōpose for compose; cōpletiō for completion, &c. The present practice in regard to abbreviations,—as in side-notes, &c.—is not to abridge a word at the end of a syllable, but always to annex one or more letters of the next syllable; and always to carry the reading part so far that it cannot be mistaken for any other word. A vast number of abbreviations are in use at present, a complete list of which will be found in most good Dictionaries, but Printers should remember that the custom of using a multitude of contractions is more honoured in the breach than in the observance. After every contraction a period must be placed. Occasionally as in poetry and conversational matter, a word is contracted by an apostrophe, as can’t and don’t, or as th’, but that sign renders the full-point unnecessary. « Back"
