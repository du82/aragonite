title = "Book II - The Four Books of Architecture"
description = "Digital edition of Palladio's famous architectural treatise based on the 1738 English edition by Isaac Ware"
full_description = "Book II Italian, Greek & Latin Houses Book contents Chapter I Of the decorum or conveniency that ought to be observed in private fabrics I have explained in the foregoing book all those things, that to me seemed most worthy of consideration for the building of public edifices, and private houses, that the work might be beautiful, graceful and durable: I have there also mentioned some things belonging to the conveniency of private houses, to which this other book shall chiefly be applied: for that house only ought to be called convenient, which is suitable to the quality of him that is to dwell in it, and whose parts correspond to the whole and to each other. But the architect ought above all to observe, that (Vitruvius says in the first and sixth book) for great men, and particularly those in a republic, the houses are required with loggias and spacious halls adorned, that in such places those may be amused with pleasure, who shall wait for the master to salute, or ask him some favour: and for gentlemen of a meaner station, the fabrics ought also to be less, of less expense, and have fewer ornaments. For judges and advocates, they ought likewise to be so built, that in their houses there may be handsome and well adorned places to talk in, that their clients may remain there without inconvenience. Merchants houses ought to have places facing the north, where their merchandizes may be lodged; and to be so disposed, that the master may not be in fear of thieves. Decorum is also to be observed in regard to the work, if the parts so answer to the whole, as that in great edifices there may be great members, in the little, small, and middling in the middle-sized: for what a disagreeable and unseemly thing would it be, if in a very large fabric there should be small halls and rooms; and, on the contrary, in a little one, there should be two or three rooms that took up the whole. As much as possible, one ought therefore, as has been said, to have a regard to those who are inclined to build; and not so much to mind what they can afford to lay out as the quality of the building that is proper for them: when that is settled, the parts are to be so disposed, that they may be suitable to the whole, and to each other, and such ornaments are to be applied as shall seem most proper. But an architect is very often obliged, to conform more to the will of those who are at the expense, than to that which ought to be observed. Chapter II Of the compartment or disposition of rooms, and of other places That the houses may be commodious for the use of the family, without which they would be greatly blame-worthy, far from being commendable, great care ought to be taken, not only in the principal parts, as the loggia, halls, courts, magnificent rooms, and ample stairs, light and easy of ascent; but also, that the most minute and least beautiful parts be accommodated to the service of the greatest and more worthy: for as in the human boy there are some noble and beautiful parts, and some rather ignoble and disagreeable, and yet we see that those stand in very great need of these, and without them they could not subsist; so in fabrics, there ought to be some parts considerable and honoured, and some less elegant; without which the other could not remain free, and so consequently would lose part of their dignity and beauty. But as our Blessed Creator has ordered these out members in such a manner, that the most beautiful are in places most exposed to view, and the less comely in places the most seen, and the less beautiful, in places much hidden from the eye as possible; that in them may be lodged all the foulness of the house, and all those things that may give any obstruction, and in any measure render the more beautiful parts disagreeable. I approve therefore that in the lowest part of the fabric, which I made somewhat underground, may be disposed to the cellars, the magazines for wood, pantries, kitchens, servants-halls, wash-houses, ovens, and such like things necessary for daily use. From which disposition follow two conveniences, the one, that the upper part remains all free; and the other and no less important, is, that the said upper apartments are wholesomer to live in, the floor be looked at, and to look out of. It is also to be observed, that in the remaining part of the fabric there may be great, middle-sized, and small rooms, and all near one another, that they may reciprocally be made use of. The small rooms may be divided off, to make closets where studies or libraries may be placed, riding accoutrements and other lumber, which may be every day wanted, and which would not be so proper to be in rooms, where one either sleeps, eats, or where strangers are received. What contributes also to conveniency is, that the rooms for summer be ample, spacious and turned to the north; and those for the winter to the south and west, and rather small than otherwise: because we seek the shades and winds in summer, and in winter the sun; besides small rooms are much more easily warmed than large. But those which we would make use of in spring and autumn, must be turned to the east, and ought to look over greens and gardens. In this particular part, studies and libraries ought also to be; because the morning is the most proper time of all other to make use of them. But the large rooms with the middling, and those with the small, ought to be so distributed, that, as I have elsewhere said, one part of the fabric may correspond with the other; and that so the body of the edifice, may have in itself a certain convenience in its members, that may render the whole beautiful and graceful. But as most commonly in cities, either the neighbours walls, the streets, or public places, prescribe certain limits, which the architect cannot surpass, it is proper he should conform himself to the circumstances of the situation; to which, if I mistake not, the following plans and elevations will give a great insight, and which may also serve as an example of what has been said in the foregoing book. Chapter III Of the designs of town-houses I am convinced, that in the opinion of those, who shall see the following fabrics, and know how difficult it is to introduce a new custom, especially in building, of which profession every one is persuaded that he knows his part, I shall be esteemed very fortunate, to have found gentlemen of so noble and generous a disposition, and of such excellent judgement, as to have harkened to my reasons, and departed from that antiquated custom of building without grace of beauty at all; and, indeed, I cannot but very heartily thank God, as we ought in all our actions to do, for granting me such a share of his favour, as to have been able to put in practice many of those things, which I have learnt from my very great fatigues and voyages, and by my great study. And although some of the designed fabrics are not entirely finished, yet may one by what is done comprehend what the whole will be when finished. I have prefixed to each the name of the builder, and the place where they are, that every one may, if he pleases, really see how they succeed. And here the reader may take notice, that in placing the said designs, I have respect neither to the rank or dignity of the gentlemen to be mentioned; but I have inserted them where I thought most convenient: not but they are all very honourable. Pl. 1 Let us know to come to the fabrics, of which the following is in Udine the metropolis of Friuli, and was raised from the foundation by Signor Floriano Antonini, a gentleman of that city. The first order of the front is of rustic work, the columns of the front, of the entrance, and of the loggia backwards are of the Ionic order. The first rooms are vaulted; the greater have the height of the vaults according to the first method beforementioned, for the height of the vaults in places that are longer than they are broad. The rooms above have flat ceilings, and so much wider than those below, as the contraction or diminution of the walls, and the height of the ceilings, equal to their breadth. Over these are other rooms which may server for granaries. The height of the hall reaches to the roof. The kitchen is out of the house, but very commodious nevertheless. The necessary places are on the sides of the stairs, and although they are in the body of the fabric, they do not give any offensive smell; because they are placed in part remote from the sun, and have vents from the bottom of the pit all through the thickness of the wall, to the very summit of the house. This line is half the Vicentine foot, with which the following fabrics have been measured. The whole foot is divided into twelve inches, and each inch into four minutes. Pl. 2 In Vicenza upon the Piazza, which is vulgarly called the Isola, the Count Valerio Chiericato, an honourable gentleman of that city, has built according to the following invention. This fabric has in the part below a loggia forwards, that takes in the whole front: the pavement of the first order rises above the ground five foot; which has been done not only to put the cellars and other places underneath, that belong to the conveniency of the house, which would not have succeeded if they had been made entirely underground, because the river is not far from it; but also that the order above might the better enjoy the beautiful situation forwards. The larger have rooms the height of their vaults, according to the first method for the height of vaults: the middle-sized are with groined vaults, and their vaults as high as those of the larger. The small rooms are also vaulted, and are divided off. All these vaults are adorned with most excellent compartments of stucco, by Messer Bartolomeo Ridolfi, a Veronese sculptor; and paintings by Messer Domenico Rizzo, and Messer Batista Venetiano, men singular in this profession. The hall is above in the middle of the front, and takes up the middle part of the loggia below. Its height is up to the roof; and because it projects forward a little, it has under the angles double columns. From one part to the other of this hall, there are two loggias, that is, on each side one; which have their soffites or ceilings adorned with very beautiful pictures, and afford a most agreeable sight. The first order of the front is Doric, and the second Ionic. Pl. 3 Here follows the design of part of the front in a large form. Pl. 4 The following designs are of the house of the Count Iseppo de Porti, a very noble family of the said city. This house fronts two public streets, and therefore has two entrances, which have four columns each, that support the vault, and render the place above it secure. The first rooms are vaulted. The height of those, that are on each side of the said entrances, is according to the last method for the height of vaults. The second rooms, that is, of the second order, are with flat ceilings: and thus the first, as well as the second of that part of the fabric, which has been done, are adorned with paintings, and most beautiful stuccos by the hands of the aforesaid excellent artists, and of Messer Paolo Veronese, a most excellent painter. The court encompassed with porticos, to which one goes from the said entrances by a passage, is to have columns six and thirty foot and an half high, that is, as high as the first and second order. Behind these columns there are pilasters one foot and three quarters broad, and one foot and two inches thick, which support the pavement of the loggia above. This court divides the whole house into two parts: that forwards is for the use of the master, and the women belonging to him; and that backward to lodge strangers in; whereby those of the house, and the strangers will remain free in every aspect: to which the ancients, and especially the Greeks, had a very great regard. Besides which, this partition will also serve in case the descendants of the said gentleman, should choose to have their apartments separate. Pl. 5, 6 I have placed the principal stairs under the portico, that they may answer to the middle of the court; and those who have a mind to go up, may as it were be compelled to see the most beautiful part of the fabric; and also, that being in the middle, they may serve on part as well as the other. The cellars and such-like places are underground. The stables are out of the square of the house, and have their entrance under the stairs. Of the designs in a large form, the first is part of the front, and the second of the part towards the court. Pl. 7 The following fabric is in Verona, and was begun by the Count Giovianni Battista della Torre, a gentleman of that city, who being overtaken by death, could not finish it; but there is a great part done. One goes into this house by the flanks, where the passages are ten feet wide; from which one comes into the courts, each fifty feet long; and from these into an open hall, which has four columns for the greater security of the vault above. From this hall one goes to the stairs, which are oval, and open in the middle. The said courts have corridors or balconies round them, level with the floor of the second rooms. The other stairs serve for the greater conveniency of the whole house. This compartment succeeds extremely well in this situation; which is long and narrow, and has the principal street towards one of the lesser fronts. Pl. 8 The following designs are of a fabric in Vicenza, of the Count Ottavio de Thieni: It belonged to Count Marc’ Antonio, who began it. This house is situated in the middle of the city, near the piazza, and therefore I have thought proper to dispose of that part towards the piazza into shops: because the architect is also to consider the advantage of the builder, when it can be done conveniently, and where the situation is sufficiently large. Every shop has over it a mezato for the use of the shop-keeper; and over them are the rooms for the master. This house is insular, that is, encompassed by four streets. The principal entrance, or as one may say, the master-gate, has a loggia forwards, and fronts the most frequented street of the city. The city hall is to be above; which will project even with the loggia. There are two entrances in the wings, which have the columns in the middle, placed there not so much for ornament, as they are to render the part above it secure, and to make the height proportionable to the breadth. From these entrances one goes into the court encompassed all round with loggias of pilasters. In the first order they are Rustic, and in the second of the Composite order. In the angles, there are octangular rooms, that succeed well, as well with respect to their form, as for diverse uses to which they may be accommodated. The rooms of this fabric that are now finished, have been adorned with the most beautiful stuccos, by Messer Alessandro Vittoria, and Messer Bartolomeo Ridolfi; and with paintings, by Messer Anselmo Canera, and Messer Bernardino In"
