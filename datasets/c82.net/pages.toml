["https://c82.net/atf"]
title = "ATF Typesetter Model B"
description = "A modern reproduction of a brochure for antique typographical machinery"
full_description = "This text was set by the light beam of a 40-watt lamp; a photographic lens; and a transparent disc that weighs less than two ounces, changes in less than 10 seconds, carries 168 different type images, packs the composing power of a double-letter font of hot metal mats, and costs less than an empty hot metal mat magazine. It was set on a unit that weighs under 125 pounds; takes up less floor space than the average office desk; runs on an ordinary electric light circuit; and uses less power than a portal TV. It was set automatically, under coded tape control. The unit that cut the tape simultaneously typed a compositor’s proof that enabled the Comp to catch most errors at once, and to correct all visible errors before photosetting. It was set on a low-cost sensitized paper and could just as readily have been set directly on film. It was developed and ready for paste-up in less time than it takes to proof and correct the average hot metal galley. It was set, automatically justified and leaded, at a production rate that can average ten 11-pica lines of 8½ point Century Schoolbook a minute. It was set without a pound of pressure and without an ounce of metal. It was set without leads, sugs, galleys, chases, quoins, furniture, stones, saws, proof presses or furnaces. It was set on the fast new ATF Model B Typesetter—the logical, field-proven way to set professional-grade text for any process than prints from plates. 1 Manuscript is marked for type styles and sizes, line widths, leading, necessary instructions of any kind. 2 After setting the measures, the operator types until a panel light warns that the justification zone has been reached. A switch justifies the line and returns the keyboard carriage. 3 Errors caught at once are immediately corrected by deleting wrong codes, or by deleting the whole line. 4 The control tape and the compositor’s proof. Errors noted after proof-reading are easily corrected before the composition is photoset. 5 After inserting the control tape into the properly set-up photographic unit, the operator can return to the keyboard. 6 Sharp, smear-proof type images are produced on inexpensive photographic paper, or on film. Light-proof film/paper receivers can be removed at any time for development. 7 On paper the developed image is high-contrast black-on-white. Film can be processed either as a positive or as a negative. Emulsion-to-emulsion contact with the plate can always be maintained. 8 Wether the end-product is on paper for immediate paste-up, or on film for positive or negative plate-making, the photographic image is always sharp, clear and uniform. Model B Typesetter Keyboard Unit This is the production control center of the Model B Typesetter. It punches the coded tape that carries all control data for high-speed automated typesetting. It simultaneously types a compositor’s proof for fast detection and correction of errors, before photosetting. The control tape captures all the labor and skill of composition. Tapes can be filed, re-run, edited, revised, added to, merged, even mailed to operated remote Typesetter photographic units. Keyboard speed, and the typographic quality of Typesetter composition, are limited only the compositor’s skill. The Keyboard is mechanically faster than any operator. In semi-automatic operation the within-line rate of speed is approximately 600 character and function codes per minute. Model B Typesetter Photographic Unit This is the quality control center of the Model B Typesetter. Under automatic coded tape control it produces flawless reproductions of original type desings: smear-proof, uniform in color, with no broken or pitted characters, no ragged edges or serifs, no chance of plugging or embossment. The developed image on photographic paper or film is ideal for all reproduction processes that use photomechanical plates. Maximum image quality is insured by a fixed, pre-focused optical system; by built-in voltage regulation for constant density of light; and by a grey-scale control disc for uniform development. Within-line photoraphic speed of the Model B approximates 330 codes per minute. In production figures this can produce ten 11-pica lines of 8½ point Century Schoolbook straight matter. More versatile than ever New width control circuits Extend the Typesetter’s ability to mix type styles and sizes. Changeable Width Control Boards plug into permanent receptacles in the keyboard and photo unit desks. New width control circuitry makes it practical to mix two styles and/or sizes of type on one disc. Mixtures must have approximately the same set-width for automatic composing. For semi-automatic composing, any mixture of available styles or sizes is feasible. New three-position dials covern selection or mixture of the composition. The new width circuits also extend the Typesetter’s inherent versatility in setting sorts and “pi” characters from the keyboard—and at normal keyboarding speed. Key caps of transparent plastic can be supplied with special arrangements for proper keyboard identification. There is no limitation on furnishing special discs and control boards for special applications. Width Control Receptacles accept Width Control Boards wired to specific type styles. Nine Width Control Boards can be stored in handy desk compartments. Attractive, specially designed metal desks are furnished with both the Keyboard and Photographic Units. Each desk houses essential operating equipment and accessories. Keyboard Layouts and Controls Essential keyboarding functions are controlled by nine finger-tip switches on the keyboard panel: The Punch On switch controls the operation of the code punch mechanism. When locked int the down position an individual code is punched for every character or function. The Tape Feed switch runs tape throught the punch without coding. Standard practice is to begin and end every tape with blank sections that can be written for identification or production instructions. The Code Delete switch is used to cancel any incorrect codes in the tape. The Start Read switch is used in cutting duplicate tapes semi-automatically, or for corrections and added material. The Non Justify switch insures uniform word spacing for both non-justified and justified composition. When in the down position it permits only non-justified composition. The Stop Read switch is used in conjunction with the Start Read switch. The Stop Code switch enters a code to halt the automatic operation of the Photographic Unit for monitor attention. The Line Delete switch is used to cancel incorrect lines or portions of lines. It is usually the simplest and fastest method in-process correction. The J-Car Return switch is used to simultaneously record justification, line space, and carriage return codes for automatic operation of the Photographic Unit. It also line spaces and mechanically returns the carriage of the Keyboard Unit. The Indicating Light in the center of the panel signals when justification of a line is possible. Automatic justification is on a word space basis. Plus and minus letter spacing is also possible in fixed increments. Illustrated below is Standard Keyboard Layout No. 8 and control switches. Standard Keyboard Layout No. 18: Straight Matter with Fractions and Aligning Leaders at Base Line. Standard Keyboard Layout No. 6: Standard Typewriter, IBM, CCC. Above is a non-standard Keyboard Layout. it was custom-made for a Technical Manual application. It is just a sample of the many special arrangements possible. Faster than ever: New High-Speed Type Discs Establish new standards for text and tabular production By successfully combining the efficiency of coded-tape control with the economy of the low-cost photo type disc, ATF is able to bring all the benefits of high-speed phototypesetting within the reach of the majority. Weighing under two ounces, a single Model B type disc packs the composing power of a double-letter font of hot metal matrices or two cold type reproducing machines. A disc contains 168 different type characters in standard or custom arrangements. Standard type discs contain two fonts—with a complete complement of caps, lowercase, figures, and standard sorts in one type size from 5 to 14 points. A disc usually consists of a roman or sans serif font and a companion font of either bold or italic. Companion fonts appear in red on the proof typescript. Special type discs can carry virtually any 168 characters in mixed fonts—with special symbols, accents, logotypes, ligatures or marks. There is practically no limitation on furnitshing a custom-tailored disc for a special need. Adjusting to the photographic unit to meet the full range of styles and sizes available on type discs is a simple three-step procedure: inserting the right set-width gear for the selected point size; inserting the new disc; and dialing the proper width setting. Automatic Variable Leading Exact between-line spacing is ensured by high-precision feeding of the photographic paper or film. Primary line spacing can be adjusted from 1 to 16 points in half-points. For example, you can set 8 on 9 pt.–9 on 9½ pt.–10 on 12 pt. Additional line spacing, variable by half-points to the full primary spacing of 16 points, can be obtained with the Automatic Variable Leading control pictured above. As directed by the coded tape, this control automatically inserts the specified amount of additional spacing, then automatically returns to the primary setting. Automati Variable Leading is an invaluable asset in setting chapter heads, sub-heads, etc. Other Quality Controls Built-in Voltage Regulator Automatically regulates fluctuations in the line-voltage and insures uniform intensity of light during photosetting. A calibrated dial can be set for optimum intensity for the nature of the composition. Grey-Scale Control Disc An invaluable quality control device used with every take of copy to insure uniform image development. Auxiliary Shutter An extra safeguard against light streaks during high-speed exposure. Several Examples of Varied Composition Here are some graphic examples of varied composition formats that can be handled with greater ease by the ATF Typesetter than by conventional typesetting methods. Codes in the tape carry all the necessary control instructions for automatic operation of the photographic unit. Centered HeadingJustified Straight Matter Typesetter Development The initial ATF Typesetter was introduced in 1958 after fifteen years of intensive research and field testing. It was designed to be just what it has proven to be—the first and only direct photographic text typesetter within the economic reach of the majority of potential users. Justified and Centered Matter Today, field-proven Typesetters are established in world-wide installations—producing high quality type composition for every modern printing process and for virtually every application of the print word. Left Run-Around Right Run-Around The Model B Typesetter will consolidate and extend the technical break-through spearheaded by the original model. The new Typesetter is faster, more versatile, and contains many refinements developed and tested during the intervening years. The benefits of phototypesetting are self-evident to the offset or gravure printer. Either it frees him from an expensive and illogical dependence on metal type, or provides him with typesetting superior in quality and design to the product of cold-typewriters. Tabular Centering Emmett F. Rahn Gordon T. Musert Willard D. Adsom Bonsal F. Druell 121 Alameda DriveFt. Lauderdale, Florida 470 Sunnyside Blvd.Savanah 7, Georgia 707 Sunset AvenueYakima 11, Washington 1105 Trinity CircleBoston 8, Massachusetts Tabular Centering Part Number Size Lots Net Price List Price 435621 22 100 8.75 14.50 435632 9 100 7.00 12.00 435646 xx 100 7.85 12.50 Aligned Leaders In the Rocky Mountain States: A. E. Heinohn Printing Machinery and Supplies Denver, Colo. 1443 Blake St. \bCherry 4-2481 Albuquerque, N. M. 5231 Central Av., W. \b\bChapel 3-9581 Phoenix, Ariz. 1828 W. Jefferson St.\b \bAlpine 2-3905 Salt Lake City, Utah 246 W. First South St. \b\bElgin 9-7641 El Paso, Texas 416 N. Elpaso St. \b\bKeystone 3-1780 Here are a few of the Typesetter faces available 8 pt. Baskerville 8 pt. Baskerville Italic 8 pt. Baskerville Bold All Baskerville faces are avilable in 6, 8, 9, 10, 11, 12 and 14 pt. 10 pt. Bodoni Book 10 pt. Bodoni Book Italic Bodoni Book and Bodoni Book Italic are available in 8, 9, 10 and 12 pt. 10 pt. Century Schoolbook 10 pt. Century Schoolbook Italic 10 pt. Century Schoolbook Bold All Century Schoolbook faces are available in 6, 8, 8½, 9, 10 and 12 pt. 10 pt. Garamond 10 pt. Garamond Italic 10 pt. Garamond Bold 10 pt. Garamond Bold Italic All Garamond faces are available in 8, 9, 10, 12 and 14 pt. 14 pt. Spartan Book 14 pt. Spartan Book Italic 14 pt. Spartan Medium 14 pt. Spartan Medium Italic 14 pt. Spartan Heavy 14 pt. Spartan Heavy Italic 14 pt. Spartan Heavy Condensed 14 pt. Spartan Heavy Condensed Italic All Spartan faces except Spartan Black are available in 6, 8, 9, 10, 12 and 14 pt. 12 pt. Spartan Black Spartan Black is available in 6, 8, 9, 10 and 12 pt. 6 pt. Copperplate Gothic Light No. 2 Copperplate Gothic faces are available in 6 and 12 pt. Light and Heavy—three fonts per disc. Matchless Clarity and Versatility In direct photographic typesetting the image is produced by a light beam of constant intensity. This accounts for the matchless uniformity and sharpness of Typesetter composition. There is never any friction or impression involved, so there is never a chance of embossment. And because there are no ink or carbon pigments involved, there is no chance of plugged letters, smearing, or slurring, grey or uneven characters. The Typesetter images is so sharp and clear that it can be enlarged immensely without loss of quality or density. This is a bonus benefit in setting headlines or display advertising matter. Below is a lower case “a” as it appears on the photographic paper or film, and as it appears after great photographic enlargement, without retouching. a The ATF Typesetter has many applications in widely diversified fields. The versatile Typesetter is the field-proven system of rapid, low-cost composition for: Newspapers Shoppers Newsletters Books Pamphlets Brochures Yearbooks Annual Reports Business Forms Legal Forms Bulletins Instrument Dials Maps Certificates Dictionaries Encyclopedias Directories Guides Catalogs Technical Manuals Parts Lists Price Lists Schedules House Organs Magazines Job Printing Advertising Check Imprinting Circuit Printing Flip Charts Time Tables Tariff Books Statistical Tables Scientific Texts Music Lyrics Product Plates Rate Books Address Labels Overlays Almanacs Horoscopes Racing Forms Placards Programs Projection Slides TV Slides Displays Templates . . . and many applications yet unknown. The range of applications increases daily with the realization that the era of setting type with a beam of light is here "
