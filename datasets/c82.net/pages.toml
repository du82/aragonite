["https://c82.net/architecture/book3"]
title = "Book III - The Four Books of Architecture"
description = "Digital edition of Palladio's famous architectural treatise based on the 1738 English edition by Isaac Ware"
full_description = "Book III Ways, Bridges, Piazzas & Xisti Book contents The Preface to the Reader Having fully treated of private edifices, and taken notice of all the most necessary advertencies that ought in them to be had; and having, besides this, put the designs of many of those houses, that have been by me directed, both within and without cities, and of those which (according to Vitruvius) were made by the ancients; it is very proper, that, in directing my discourse to more excellent, and to more magnificent fabrics, I should now pass on to the public edifices: in which, as they are made more stately, and with more exquisite ornaments than the private, and serve for the use and conveniency of everybody, princes have therein a very ample opportunity to make the world acquainted with the greatness of their souls, and architects a very fine one to show their capacity in beautiful and wonderful inventions. I desire therefore in this book, in which my antiquities begin, and in the others, which, God willing, shall follow, that so much the more attention may be applied, in considering the little that shall be said, and the designs that shall be given, as I have, with far greater fatigue, and much longer vigilancy, reduced those fragments that remained of the ancient edifices, to such a form, that the observers of antiquity may (I hope) take delight therein, and the lovers of architecture may thence receive very great utility; there being much more to be learnt from good examples in a little time, by measuring and seeing the entire edifices, with all their parts, upon a small leaf, than in a long time from words, by which, with the imagination only, and still some difficulty, the reader is able to attain a firm and certain knowledge of what he reads, and with much more difficulty will he put in practice. And to everyone, that is not altogether void of judgement, it may be very manifest, how good the method was, which the ancients observed in building; since after so much time, and after so many ruins and mutations of empires, there still remain both in Italy and out of it, the vestigates of so many of their sumptuous edifices, by which we are able to get at a certain knowledge of the Roman virtue and grandeur, which perhaps had not otherwise been believed. I therefore, in this third book, (in placing the designs of the edifices contained in it) shall observe this order. In the first place, I shall put those of the streets, and of the bridges, and belonging to that part of architecture which regards the ornaments of cities and of provinces, and which serves for the universal conveniency of mankind. For, as in the other fabrics which the ancients made, one may easily apprehend that they had no regard either to expense, or to any labour to bring them to that pitch of excellency, which has been granted them from our imperfection; so, in directing the roads, they took very great care, that they should be made in such manner, that also in them might be known the grandeur and magnificence of their minds. Wherefore, to make them both commodious and short, they cut through mountains, dried up fens, and joined with bridges, and so made easy and plain, those places, that had been sunk, either by vales or torrents. I shall, afterwards, treat of piazzas in the manner that Virtruvius shews us the Greeks and Latins made them, and of those places that ought to be distributed round the piazzas. And because, among these, that place is worthy of great consideration, where the judges administer justice, called by the ancients Basilica, the designs of it shall be particularly set down. But because it is not sufficient, that the regions and the cities be well disposed and governed by most sacred laws, and have magistrates, who, as executors of the laws, keep the citizens in awe; if men are not also made prudent by learning, and strong and hearty by bodily exercise, that they may be able to govern both themselves and others, and to defend themselves from those who would oppress them; which is one principal reason why the in habitants of some countries, when dispersed in many small places, unite themselves, and form cities: wherefore the ancient Greeks made in their cities (as Vitruvius relates) some edifices, which they called Palestrae and Xisti, in which the philosophers assembled to dispute concerning the sciences, and the younger men were everyday exercised; and at certain appointed times the people assembled there to see the wrestlers contend. The designs of those edifices shall also be inserted, and an end so put to this third book. After which, shall follow that of the temples belonging to religion, without which it would be impossible that civil society could be maintained. This line is half the Vicentine foot, with which the following edifices have been measured. The whole foot is divided into twelve inches, and each inch into four minutes. Chapter I Of Roads The roads ought to be short, commodious, safe, delightful and beautiful; they will be short and commodious if made in a straight line, and if they be made ample, that so the carts and the cattle meeting, do not impede one another. And therefore it was an established law among the ancients, that the roads should not be narrower than eight foot, where they were straight; nor less than sixteen wide where they were crooked and winding. They will, besides this, be commodious if they are made even, that is, that there may not be any places, in which one cannot easily march with armies, and if they are not obstructed by water or rivers. We therefore read that the Emperor Trajan, regarding these two qualities, necessarily required in roads, when he repaired the most celebrated Appian way, which in many places was damaged by length of time, dried up fenny places, leveled mountains, filled up valleys, and erecting bridges where necessary, made traveling thereon very expeditious and easy. Roads will be safe if made on hills, or if, when made through fields, according to ancient custom, they have a causeway to travel on, and if they have no places near them in which robbers and enemies can conveniently hide themselves; that so the travelers and the armies may be able to look about them, and easily discover if there should be any abuscade laid for them. Those roads that have the three abovesaid qualities, are also necessary beautiful and delightful to travelers, because of their straight direction from the city. The conveniency they afford, and besides being in them able to see at a great distance, and besides to discover a good deal of the country, whereby great part of the fatigue is alleviated, and our minds (having always a new prospect before our eyes) find great satisfaction and delight. A straight street in a city affords a most agreeable view, when it is ample and clean; on each side of which there are magnificent fabrics, made with those ornaments, which have been mentioned in the forgoing books. As in cities beauty is added to the streets by find fabrics: so without they are adorned with trees; which being planted on each side of them, by their verdure enliven our minds, and by their shade afford very great conveniency. Of these kinds of roads there are many in the Vicentine; and among the rest, those that are at Cigogna, a villa belonging to the Signor Conte Odoardo Thieni, are celebrated; and at Quinto, a villa belonging to the Signor Conte Ottavio, of the same family: which being designed by me, have been since adorned, by the diligence and industry of the said gentlemen. The roads that are thus made, afford very great conveniencies, because that by their straight direction, and by being somewhat raised above the remaining part of the fields, speaking of those which are without the city, in the time of war, as I have said, the enemies may be discovered from a great distance, and so that resolution, which shall seem most convenient to the commander, may be taken; besides all which, at other times, with regard to the affairs that commonly happen among men, their brevity and conveniency will afford infinite advantages. But because the streets are either within or without a city, I shall, in the first place, made particular mention of the qualities which those of a city ought to have; and then how those without are to made. And since there are some that are called military, which pass through the middle of the city, and lead from one city to another, and serve for the universal conveniency of travelers, and are those through which armies march, and carriages are conveyed; and others not military, which departing from the military, either lead to another military way, or are made for the use and particular conveniency of some villa: I shall, in the following chapters, only treat of the military ones, omitting the non-military, because these ought to be regulated by them; and the more they shall be like them, the more they’ll be commended. Chapter II Of the Compartment of ways within the cities In the compartment or disposition of the ways within a city, regard ought to be made to the temperature of the air, and to the region of the heaven, under which the city is situated. For in those of a temperate and cool air, the streets ought to be made ample and broad; considering, that by their breadth the city will be much wholesomer, more commodious, and more beautiful; seeing that the less subtile, and the more freely the air comes, so much the less it will offend the head. The more the city, therefore, is in a cold place, and hath a subtile air, and where the edifices are made very high, so much the wider the streets ought to be made, that they may, in each of their parts, be visited by the sun. And as to conveniency, there is no doubt, that, as much better room may be allowed to men, to cattle, and to carriages in broad than in the narrow streets, broad ones are more convenient than the narrow; it being manifest, that as there is much more light in the broad ones, and also that as one side is not so much obstructed by the other, is opposite, one is able, in the large ones, much better to consider the beauty of the temples, and of the palaces, whereby the eye receives greater contentment; it adds besides a greater ornament to the city. But the city being in a hot country, its streets ought to be made narrow, and the houses high, that by their shade, and by the narrowness of the streets, the heat of the side may be tempered; by which means it will be more healthy. This is known by the example of Rome, which, according to Cornelius Tacitus, grew hotter, and less healthy, after Nero, to make it beautiful, had widened its streets. In such case, however, for the greater ornament and conveniency of the city, the streets most frequented by the principal arts, and by passengers, ought to be made spacious, and adorned with magnificent and sumptuous fabrics, that foreigners who pass through it, may easily incline to believe, that to the beauty and largeness of this, the other streets of the city may also correspond. The principal streets, which we have called military, in the cities ought to be so comparted, that they may be straight, and lead from the gates of the city in a direct line to the greatest and principal piazza; and sometimes also, the site permitting it, lead in the same manner directly to the opposite gate; and according to the greatness of the city, by the same line. Of such streets, between the said principal piazza, and any of the gates you please, there ought to be one or more piazzas, made somewhat less than the before-said principal piazza. The other streets, especially the more noble of them, ought also to be made, not only to lead the principal piazza, but also to the most remarkable temples, palaces, porticos, and other public fabrics. But in this compartment of the streets, it ought to be observed, with the utmost diligence (as Vitruvious teaches us in the sixth chapter of his first book) that they should not in a direct line face some winds; that through them furious and violent winds may not be felt; but that they may, with more salubrity to the inhabitants, come broken, gentle, purified and spend, left the same inconveniency should be incurred which happened to those who in the island of Lesbos laid out the streets of Mitylene, from which the city the whole island has now taken the name. The streets in a city ought to be paved; and we read, that under the consulship of M. Æmilius, the censors began to pave in Rome, where some are still to be seen, which are all even, and are paved with irregular stones; which manner of paving, how it was done, shall be mentioned hereafter. But if one is willing to divide the place where men are to talk, from that which serves for the use of carts and of cattle, I should like that the streets were divided, that on the one and on the other part there were porticos made, through which the citizens might, under cover, go and do their business, without being molested by the sun, by the rains and snow: in which manner are almost all the streets of Padua disposed, a very ancient city, and celebrated of learning. Or if no porticos be made, (in which case the streets will be more ample and pleasant) some margins are to be made on each side, paved with mattoni, which are baked stones, thicker and narrower than bricks, because they do not at all offend the feet in walking; and the middle part is to be left for the carts and cattle, and to be paved with flints, or any other hard stones. The streets ought to be somewhat concave in the middle, and slanting, that the water which falls from the houses may all run to one place, and have a freer course, whereby the streets are left clean, and are not the cause of bad air; as is the case when it stops in any place, and there are putrifies. Chapter III Of the Ways without the city The ways without the city ought to be made ample, commodious, having trees on either side, by which travelers may be defended from the scorching heats of the sun, and their eyes receive some recreation from the verdure. The ancients took great care of these ways: that they might therefore always be in good repair, they established proveditors and curators of them; by whom many of them were made, of which there still remains some memory of their beauty and conveniency, although they have been impaired by time. But the Flaminian and the Appian are the most famous of them all; the first was made by Flaminius, while he was consul, after the victory he had over the Genoese. This way began from the gate Flumentana, now called del Popolo, and passing through Tuscany, and through Umbria, led to Rimini; from which city it was afterwards continued to Bologna by M. Lepidus, his colleague; and near the foot of the Alps, by windings, to avoid the fens, he carried it to Aquileia. The Appian took its name from Appius Claudius, by whom it was made with much skill and at great expense: thence, for its magnificence and wonderful artifice, it was by the poets"
