["https://c82.net/euclid/book1"]
title = "Book I - Byrne’s Euclid"
description = "A reproduction of Oliver Byrne's celebrated work from 1847 plus interactive diagrams, cross references, and posters designed by Nicholas Rougeux"
full_description = "Definitions Postulates Axioms Elucidations Proposition I Proposition II Proposition III Proposition IV Proposition V Proposition VI Proposition VII Proposition VIII Proposition IX Proposition X Proposition XI Proposition XII Proposition XIII Proposition XIV Proposition XV Proposition XVI Proposition XVII Proposition XVIII Proposition XIX Proposition XX Proposition XXI Proposition XXII Proposition XXIII Proposition XXIV Proposition XXV Proposition XXVI Proposition XXVII Proposition XXVIII Proposition XXIX Proposition XXX Proposition XXXI Proposition XXXII Proposition XXXIII Proposition XXXIV Proposition XXXV Proposition XXXVI Proposition XXXVII Proposition XXXIX Proposition XL Proposition XLI Proposition XLII Proposition XLIII Proposition XLIV Proposition XLV Proposition XLVI Proposition XLVII Proposition XLVIII Book I. Definitions. I. A point is that which has no parts. II. A line is length without breadth. III. The extremities of a line are points. IV. A ſtraight or right line is that which lies evenly between its extremities. V. A ſurface is that which has length and breadth only. VI. The extremities of a ſurface are lines. VII. A plane ſurface is that which lies evenly between its extremities. VIII. A plane angle is the inclination of two lines to one another, in a plane, which meet together, but are not in the ſame direction. Definition 9 figure IX. A plane rectilinear angle is the inclination of two ſtraight lines to one another, which meet together, but are not in the ſame ſtraight line. Definition 10 figure X. When one ſtraight line ſtanding on another ſtraight line makes the adjacent angles equal, each of theſe angles is called a right angle, and each of theſe lines is ſaid to be perpendicular to the other. Definition 11 figure XI. An obtuſe angle is an angle greater than a right angle. Definition 12 figure XII. An acute angle is leſs than a right angle. XIII. A term or boundary is the extremity of any thing. XIV. A figure is a ſurface encloſed on all ſides by a line or lines. Definition 15 figure XV. A circle is a plane figure, bounded by one continued line, called its circumference or periphery; and having a certain point within it, from which all ſtraight lines drawn to its circumference are equal. XVI. This point (from which the equal lines are drawn) is called the centre of the circle. Definition 17 figure XVII. A diameter of a circle is a ſtraight line drawn through the centre, terminated both ways in the circumference. Definition 18 figure XVIII. A ſemicircle is the figure contained by the diameter, and the part of the circle cut off by the diameter. Definition 19 figure XIX. A ſegment of a circle is a figure contained by a ſtraight line, and the part of the circumference which it cuts off. XX. A figure contained by ſtraight lines only, is called a rectilinear figure. XXI. A triangle is a rectilinear figure included by three ſides. Definition 22 figure XXII. A quadrilateral figure is one which is bounded by four ſides. The ſtraight lines Blue line and Red line connecting the vertices of the oppoſite angles of a quadrilateral figure, are called its diagonal. XXIII. A polygon is a rectilinear figure bounded by more than four ſides. Definition 24 figure XXIV. A triangle whoſe three ſides are equal, is ſaid to be equilateral. Definition 25 figure XXV. A triangle which has only two ſides equal is called an iſoſceles triangle. XXVI. A ſcalene triangle is one which has no two ſides equal. Definition 27 figure XXVII. A right angled triangle is that which has a right angle. Definition 28 figure XXVIII. An obtuſe angled triangle is that which has an obtuſe angle. Definition 29 figure XXIX. An acute angled triangle is that which has three acute angles. Definition 30 figure XXX. Of four-ſided figures, a ſquare is that which has all its ſides equal, and all its angles right angles. Definition 31 figure XXXI. A rhombus is that which has all its ſides equal, but its angles are not right angles. Definition 32 figure XXXII. An oblong is that which has all its angles right angles, but has not all its ſides equal. Definition 33 figure XXXIII. A rhomboid is that which has its oppoſite ſides equal to one another, but all its ſides are not equal, nor its angles right angles. XXXIV. All other quadrilateral figures are called trapeziums. Definition 35 figure XXXV. Parallel ſtraight lines are ſuch as are in the ſame plane, and which being produced continually in both directions, would never meet. Postulates. I. Let it be granted that a ſtraight line may be drawn from any one point to any other point. II. Let it be granted that a finite ſtraight line may be produced to any length in a ſtraight line. III. Let it be granted that a circle may be deſcribed with any centre at any diſtance from that centre. Axioms. I. Magnitudes which are equal to the ſame are equal to each other. II. If equals be added to equals the ſums will be equal. III. If equals be taken away from equals the remainders will be equal. IV. If equals be added to unequals the ſums will be unequal. V. If equals be taken away from unequals the remainders will be unequal. VI. The doubles of the ſame or equal magnitudes are equal. VII. The halves of the ſame or equal magnitudes are equal. VIII. Magnitudes which coincide with one another, or exactly fill the ſame ſpace, are equal. IX. The whole is greater than its part. X. Two ſtraight lines cannot include a ſpace. XI. All right angles are equal. Axiom 12 figure XII. If two ſtraight lines ( Red and blue lines ) meet a third ſtraight line (Black line) ſo as to make the two interior angles ( Yellow angle and Red angle ) on the ſame ſide leſs than two right angles, theſe two ſtraight lines will meet if they be produced on that ſide on which the angles are leſs than two right angles. The twelfth axiom may be expreſſed in any of the following ways: Two diverging ſtraight lines cannot be both parallel to the ſame ſtraight line. If a ſtraight line interſect one of the two parallel ſtraight lines it muſt also interſect the other. Only one ſtraight line can be drawn through a given point, parallel to a given ſtraight line. Elucidations. Geometry has for its principal objects the expoſition and explanation of the properties of figure, and figure is defined to be the relation which ſubſiſts between the boundaries of ſpace. Space or magnitude is of three kinds, linear, ſuperficial, and ſolid. Vertex A Angles diagram B C D E F G H Angles might properly be conſidered as a fourth ſpecies of magnitude. Angular magnitude evidently conſiſts of parts, and muſt therefore be admitted to be a ſpecies of quantity. The ſtudent muſt not ſuppoſe that the magnitude of an angle is affected by the length of the ſtraight lines which include it, and of whoſe mutual divergence it is the meaſure. The vertex of an angle is the point where the ſides or the legs of the angle meet, as A. An angle is often deſignated by a ſingle letter when its legs are the only lines which meet together at its vertex. Thus the red and blue lines form the yellow angle, which in other ſyſtems would be called the angle A. But when more than two lines meet in the ſame point, it was neceſſary by former methods, in order to avoid confuſion, to employ three letters to deſignate an angle about that point, the letter which marked the vertex of the angle being always placed in the middle. Thus the black and red lines meeting together at C, form the blue angle, and has been uſually denominated the angle FCD or DCF. The lines FC and CD are the legs of the angle; the point C is its vertex. In like manner the black angle would be deſignated the angle DCB or BCD. The red and blue angles added together, or the angle HCF added to FCD, make the angle HCD; and ſo of the other angles. When the legs of an angle are produced or prolonged beyond its vertex, the angles made by them on both ſides of the vertex are ſaid to be vertically oppoſite to each other: Thus the red and yellow angles are ſaid to be vertically oppoſite angles. Superpoſition is the proceſs by which one magnitude may be conceived to be placed upon another, ſo as exactly to cover it, or ſo that every part of each ſhall exactly coincide. A line is ſaid to be produced, when it is extended, prolonged, or has its length increaſed, and the increaſe of length which it receives is called its produced part, or its production. The entire length of the line or lines which encloſe a figure, is called its perimeter. The firſt ſix books of Euclid treat of plane figures only. A line drawn from the centre of a circle to its circumference, is called a radius. The lines which include a figure are called its ſides. That ſide of a right angled triangle, which is oppoſite to the right angle, is called the hypotenuſe. An oblong is defined in the ſecond book, called a rectangle. All the lines which are conſidered in the firſt ſix books of the Elements are ſuppoſed to be in the ſame plane. The ſtraight-edge and compaſſes are the only inſtruments, the uſe of which is permitted in Euclid, or plane Geometry. To declare this reſtriction is the object of the poſtulates. The Axioms of geometry are certain general propoſitions, the truth of which is taken to be ſelf-evident and incapable of being eſtablished by demonſtration. Propoſitions are thoſe reſults which are obtained in geometry by a proceſs of reaſoning. There are two ſpecies of propoſitions in geometry, problems and theorems. A Problem is a propoſition in which ſomething is propoſed to be done; as a line to be drawn under ſome given conditions, a circle to be deſcribed, ſome figure to be conſtructed, &c. The ſolution of the problem conſiſts in ſhowing how the thing required may be done by the aid of the rule or ſtraight-edge and compaſſes. The demonſtration conſiſts in proving that the proceſs indicated in the ſolution really attains the required end. A Theorem is a propoſition in which the truth of ſome principle is aſſerted. This principle muſt be deduced from the axioms and definitions, or other truths previously and independently eſtablished. To ſhow this is the object of demonſtration. A Problem is analogous to a poſtulate. A Theorem reſembles an axiom. A Poſtulate is a problem, the ſolution of which is aſſumed. An Axiom is a theorem, the truth of which is granted without demonſtration. A Corollary is an inference deduced immediately from a propoſition. A Scholium is a note or obſervation on a propoſition not containing an inference of ſufficient importance to entitle it to the name of a corollary. A Lemma is a propoſition merely introduced for the purpoſe of eſtablishing ſome more important propoſition. Proposition I. Problem. Proposition 1 figure On a given finite ſtraight line (Black line) to deſcribe an equilateral triangle. Deſcribe Blue circle and black line and Red circle and black line (poſtulate 3.); draw Yellow line and Red line (poſt. 1.). then Triangle will be equilateral. For Black line = Yellow line (def. 15.); and Black line = Red line (def. 15.), ∴ Yellow line = Red line (axiom. 1.); and therefore Triangle is the equilateral triangle required. Q. E. D. Proposition II. Problem. Proposition 2 figure From a given point ( Blue and red lines ), to draw a ſtraight line equal to a given finite ſtraight line (Black line) Draw Black dotted line (poſt. 1.), deſcribe Isoceles triangle (pr. 1.), produce Red line (poſt. 2.), deſcribe Blue circle and black line (poſt. 3.), and Red circle and red and yellow lines (poſt. 3.); produce Red line (poſt. 2.), then Blue line is the line required. For Yellow and red lines = Blue and red lines (def. 15.), and Red line = Red line (conſt.), ∴ Yellow line = Blue line (ax. 3.), but (def. 15.) Black line = Yellow line = Blue line ; ∴ Blue line drawn from the given point ( Blue and red lines ), is equal the given line Black line. Q. E. D. Proposition III. Problem. Proposition 3 figure From the greater ( Black lines ) of two given ſtraight lines, to cut off a part equal to the leſs (Blue line). Draw Red line = Blue line (pr. 2.); deſcribe Circle and red line (poſt. 3.), then Blue line = Black line. For Red line = Black line (def. 15.), Blue line = Red line (conſt.); ∴ Blue line = Black line (ax. 1.). Q. E. D. Proposition IV. Theorem. Proposition 4 figure If two triangles have two ſides of the one reſpectively equal to two ſides of the other, (Red line to Red line and Blue line to Blue line) and the angles ( Left yellow angle and Right yellow angle ) contained by thoſe equal ſides alſo equal; then their baſes or their ſides (Black line and Black line) are alſo equal: and the remaining and their remaining angles oppoſite to equal ſides are reſpectively equal ( Left blue angle = Right blue angle and Left red angle = Right red angle ): and the triangles are equal in every reſpect. Let the two triangles be conceived, to be ſo placed, that the vertex of one of the equal angles, Left yellow angle or Right yellow angle ; ſhall fall upon that of the other, and Red line to coincide with Red line, then will Blue line coincide with Blue line if applied: conſequently Black line will coincide with Black line, or two ſtraight lines will encloſe a ſpace, which is impoſſible (ax. 10), therefore Black line = Black line, Left blue angle = Right blue angle and Left red angle = Right red angle , and as the triangles Left triangle and Right triangle coincide, when applied, they are equal in every reſpect. Q. E. D. Proposition V. Theorem. Proposition 5 figure In any iſoſceles triangle Isoceles triangle if the equal ſides be produced, the external angles at the baſe are equal, and the internal angles at the baſe are alſo equal. Produce Red line, and Red line, (poſt. 2.), take Yellow line = Yellow line, (pr. 3.); draw Blue line and Blue line. Then in Left triangle and Right triangle we have, Left red and yellow lines = Right red and yellow lines (conſt.), Black angle common to both, and Red line = Red line (hyp.) ∴ Left blue and yellow angles = Right blue and yellow angles , Blue line = Blue line and Left red angle = Right red angle (pr. 4.). Again in Lower left triangle and Lower right triangle we have Yellow line = Yellow line, Left red angle = Right red angle and Blue line = Blue line, ∴ Left yellow angle plus remaining angle = Right yellow angle plus remaining angle and Left yellow angle = Right yellow angle (pr. 4.) but Left blue and yellow angles = Right blue and yellow angles , ∴ Left blue angle = Right blue angle (ax. 3.) Q. E. D. Proposition VI. Theorem. Proposition 6 figure In any triangle ( ) if two angles ( Yellow angle and Black angle ) are equal, the ſides ( Black lines and Blue line) oppoſite to them are alſo equal. For if the ſides be not equal, let one of them Black lines be greater than the other Blue line, and from it cut off Black line = Blue line (pr. 3.), draw Yellow line. Then Small triangle and , Black line = Blue line, (conſt.) Yellow angle = Black angle (hyp.) and Red line common, ∴ the triangles are equal (pr. 4.) a part equal to the whole, which is "
