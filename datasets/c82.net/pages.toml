all portion of chestnut brown. The colors in these photos are approximate and are intended to serve as examples of where to find the colors described in nature. Contribute your photo » Tiger moth Photo: Kurt Kulac Pochard duck Photo: Diliff Fuchsia berries Photo: MPF Olivenite (olive copper ore) Photo: Rob Lavinsky 22. Ink Black Berry of Deadly Night Shade Oliven ore Ink Black, is velvet black, with a little indigo blue in it. The colors in these photos are approximate and are intended to serve as examples of where to find the colors described in nature. Contribute your photo » Nightshade berries Source Olivenite (olive copper ore) Photo: Rob Lavinsky 23. Velvet Black* Mole. Tail Feathers of Black Cock. Black of Red and Black West-Indian peas. Obsidian None Velvet Black, is the characteristic colour of the blacks; it is the colour of black velvet. W. The colors in these photos are approximate and are intended to serve as examples of where to find the colors described in nature. Contribute your photo » Mole Photo: Stanislaw Szydlo Black guillemot Photo: Boaworm Cowpeas Photo: David E Mead Obsidian Photo: ArnoWinter Black velvet Photo: FixiPixi_deluxe Blues Color Name Animal Vegetable Mineral Parts 24. Scotch Blue Throat of Blue Titmouse. Stamina of Single Purple Anemone. Blue Copper Ore. Scotch Blue, is Berlin blue, mixed with a considerable portion of velvet black, a very little grey, and a slight tinge of carmine red. W. The colors in these photos are approximate and are intended to serve as examples of where to find the colors described in nature. Contribute your photo » Blue titmouse Photo: Francis Franklin Purple anemone Photo: Buntysmum Blue copper ore Photo: Eric Hunt 25. Prussian Blue Beauty Spot on Wing of Mallard Drake. Stamina of Bluish Purple Anemone. Blue Copper Ore Prussian Blue, is Berlin blue, with a considerable portion of velvet black, and a small quantity of indigo blue. The colors in these photos are approximate and are intended to serve as examples of where to find the colors described in nature. Contribute your photo » Mallard drake Photo: Alorin Bluish purple anemone Photo: Hanay Blue copper ore Photo: Eric Hunt 26. Indigo Blue Blue Copper Ore. Indigo Blue, is composed of berlin blue, a little black, and a small portion of apple green. The colors in these photos are approximate and are intended to serve as examples of where to find the colors described in nature. Contribute your photo » Blue copper ore Photo: Eric Hunt 27. China Blue Rhynchites Nitens Back Parts of Gentian Flower. Blue Copper Ore from Chessy. China Blue, is azure blue, with a little prussian blue in it. The colors in these photos are approximate and are intended to serve as examples of where to find the colors described in nature. Contribute your photo » Blue beetle (similar to rhynchites nitens) Photo: Yogendra Joshi Gentian flower Photo: Twdragon Blue copper ore Photo: Eric Hunt 28. Azure Blue Breast of Emerald-crested Manakin Grape Hyacinth. Gentian. Blue Copper Ore. Azure Blue, is Berlin blue, mixed with a little carmine red: it is a burning colour. W. The colors in these photos are approximate and are intended to serve as examples of where to find the colors described in nature. Contribute your photo » Antillean-crested hummingbird Photo: Charles J. Sharp Grape hyacinth Photo: Vera Kratochvil Gentian flower Photo: Twdragon Blue copper ore Photo: Eric Hunt 29. Ultramarine Blue Upper Side of the Wings of small blue Heath Butterfly. Borrage. Azure Stone or Lapis Lazuli. Ultramarine Blue, is a mixture of equal parts of Berlin and azure blue. The colors in these photos are approximate and are intended to serve as examples of where to find the colors described in nature. Contribute your photo » Blue heath butterfly Photo: Lairich Rig Borage Photo: Paasikivi Lapis lazuli (azure) Photo: Hannes Grobe 30. Flax-Flower Blue Light Parts of the Margin of the Wings of Devil’s Butterfly. Flax flower. Blue Copper Ore Flax-Flower Blue, is Berlin blue,