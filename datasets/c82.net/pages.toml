title = "About - C82: Works of Nicholas Rougeux"
description = "C82 is dedicated to the works of Nicholas Rougeux, including data art, visualization, and design."
full_description = "About I am a Chicago-based designer and data artist focusing in web and UX design. From a young age, my fascination with the digital world led to a healthy obsession with data visualization and fractal artwork, which has been published in publications and exhibitions around the world. Since my start in the digital art and online worlds, simplicity and clarity have played key roles in what I have created. With everything I create, I try to embrace these concepts. C82 was born from a desire to display the digital art I created and the hope of getting my name out there in the online world. Over time it evolved into a playground for personal experiments and a vehicle for voicing my opinion on art and the web. Much of the art on this site is sold as high-quality posters on Zazzle—an online community for sharing custom artwork. Zazzle allows me to offer my work in a variety of sizes and materials at good prices. I’ve been a member for many years and can personally attest to the quality of the posters. I’m a picky person and Zazzle has impressed me a great deal. Contact I try to respond to every email in a timely fashion. Your information is temporarily stored so I can respond to you but not used for any other purpose. It will be deleted after I have responded to you. Fill out my online form. var zguahm0o9oox1;(function(d, t) { var s = d.createElement(t), options = { 'userName':'rougeux', 'formHash':'zguahm0o9oox1', 'autoResize':true, 'height':'497', 'async':true, 'host':'wufoo.com', 'header':'show', 'ssl':true}; s.src = ('https:' == d.location.protocol ? 'https://' : 'http://') + 'www.wufoo.com/scripts/embed/form.js'; s.onload = s.onreadystatechange = function() { var rs = this.readyState; if (rs) if (rs != 'complete') if (rs != 'loaded') return; try { zguahm0o9oox1 = new WufooForm();zguahm0o9oox1.initialize(options);zguahm0o9oox1.display(); } catch (e) {}}; var scr = d.getElementsByTagName(t)[0], par = scr.parentNode; par.insertBefore(s, scr); })(document, 'script');"
