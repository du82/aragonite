title = "A Monograph of the Trochilidæ, or Family of Humming-Birds"
description = "Digital edition of John Gould’s monumental work depicting all known species between 1849 and 1887"
full_description = "Published between 1849 and 1887, English ornithologist John Gould’s monumental work depicts and describes all the known species of hummingbirds at the time—comprising 418 lithographic plates and information on 537 species. Gould’s introduction included a wealth of information on hummingbirds’ etymology, other ornithologists’ research, anatomy, and more. Illustrations have been restored to their original vibrancy by enhancing colors and removing unwanted marks in a process that took nearly 150 hours to complete. Featuring all 422 illustrated species from John Gould’s A Monograph of the Trochilidæ, or Family of Humming-Birds arranged by color."
