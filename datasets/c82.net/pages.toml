full_description = "Latest from the blog Making of The Natural System of Colours February 18, 2025 Recreating Mose Harris’ color wheels from the eighteenth century seemed straightforward until it wasn’t. I’ve long admired his “prismatic” and “compound” wheels and set a small design challenge for myself to recreate them digitally. As with most projects, it took an unexpected turn, but ultimately a good one. Living With Nausea: My Story in Six Charts January 12, 2025 I used to have boring health. I never had more than the flu, been admitted to the hospital, and I could eat whatever I wanted, whenever I wanted. In late 2023, that changed when I developed chronic nausea. Making of Lilies & Roses of P.J. Redouté November 3, 2024 “Patience” was this project’s theme. Breathing new life into Les Liliacées and Les Roses—two of Pierre-Joseph Redouté’s most well known collections—taught me a lot about it during the year I spent on this project. More from the blog »"
