title = "Apprentice - A Brief Visual Exploration of A Dictionary of Typography"
description = "An apprentice is, a person described in law books as a species of servant, and so called from the French verb apprendre—to learn—because he is bound by indenture to serve a master for a ce…"
full_description = "First edition Second edition Apprentice An apprentice is, a person described in law books as a species of servant, and so called from the French verb apprendre, to learn, because he is bound by indenture to serve a master for a certain term, receiving in return for his services instruction in his master’s trade, profession, or art; the master, on the other hand, contracting to instruct the apprentice and, according to the nature of the agreement, to provide him with food and clothing, and to pay him small wages. Sometimes a premium is paid by the apprentice, or on his behalf to his master. By a provision of the 5th Eliz., c. 4, which remained in force until a recent period, it was in general required that every person exercising a trade in England should have previously served as apprentice to it for seven years, but by 54 George III. c. 96 that provsion was abolished. The term of apprenticeship is now determined by the mutual convenience of the contracting parties and the custom of the trade. A mere agreement does not constitute an apprenticeship; there must be regular indentures formally entered into.—See “Chambers’s Encyclopædia,” Vol. I., p. 331. Apprentice An apprentice is, a person described in law books as a species of servant, and so called from the French verb apprendre—to learn—because he is bound by indenture to serve a master for a certain term, receiving in return for his services instruction in his master’s trade, profession, or art; the master, on the other hand, contracting to instruct the apprentice and, according to the nature of the agreement, to provide him with food and clothing, and to pay him small wages. Sometimes a premium is paid by the apprentice, or on his behalf to his master. By a provision of the 5th Elizabeth, c. 4, which remained in force until a recent period, it was in general required that every person exercising a trade in England should have previously served as apprentice to it for seven years, but by 54 George III., c. 96 that provsion was abolished. The term of apprenticeship is now determined by the mutual convenience of the contracting parties and the custom of the Trade. A mere agreement does not constitute an apprenticeship; there must be regular indentures formally entered into. It is not unusual to apprentice boys to the Printing business until the age of fourteen years. They then serve seven years’ apprenticeship, and, on their completion of this term of servitude, they are said to be “out of their time,” to celebrate which event a very peculiar custom is in vogue in some printing-offices. (See Out of his Time.) An apprentice who does not complete the whole of the term with one master, and is transferred to another, is called a Turn Over (q.v.). An apprentice who lives within the residence or premises of his employer is called an in-door apprentice; one who resides with his parents or friends is called an out-door apprentice. Formerly the majority of apprentices were “in-door,” but at present by far the larger number are out-door. The qualifications which ought to be required in every boy desirous of being apprenticed are, that he should have had a fair education; that he is a good speller; has a turn for reading; and that his eyesight is good. He should be particuarly enjoined to be punctual, obedient, and courteous. « Back"
