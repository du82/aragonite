title = "Book V - Byrne’s Euclid"
description = "A reproduction of Oliver Byrne's celebrated work from 1847 plus interactive diagrams, cross references, and posters designed by Nicholas Rougeux"
full_description = "Definitions Axioms Proposition I Proposition II Proposition III Definition V Proposition IV Proposition V Proposition VI Proposition A Definition XIV Proposition B Proposition C Proposition D Proposition VII Definition VII Proposition VIII Proposition IX Proposition X Proposition XI Proposition XII Proposition XIII Proposition XIV Proposition XV Definition XIII Proposition XVI Definition XVI Proposition XVII Definition XV Proposition XVIII Proposition XIX Definition XVII Proposition E Definition XVIII Definition XIX Definition XX Proposition XX Proposition XXI Proposition XXII Proposition XXIII Proposition XXIV Proposition XXV Definition X Definition XI Definition A Proposition F Proposition G Proposition H Proposition K Book V. Definitions. I. A leſs magnitude is ſaid to be an aliquot part or ſubmultiple of a greater magnitude, when the leſs meaſures the greater; that is, when the leſs is contained a certain number of times exactly in the greater. II. A greater magnitude is ſaid to be a multiple of a leſs, when the greater is meaſured by the leſs; that is, when the greater contains the leſs a certain number of times exactly. III. Ratio is the relation which one quantity bears to another of the ſame kind, with reſpect to magnitude. IV. Magnitudes are ſaid to have a ratio to one another, when they are of the ſame kind; and the one which is not the greater can be multiplied ſo as to exceed the other. The other definitions will be given throughout the book where their aid is firſt required. Axioms. I. Equimultiples or equiſubmultiples of the ſame, or of equal magnitudes, are equal. If A = B, then twice A = twice B, that is, 2 A = 2 B; 3 A = 3 B; 4 A = 4 B &c. &c. and 1 / 2 of A = 1 / 2 of B; 1 / 3 of A = 1 / 3 of B; &c. &c. II. A multiple of a greater magnitude is greater than the ſame multiple of a leſs. Let A > B, then 2 A > 2 B; 3 A > 3 B; 4 A > 4 B; &c. &c. III. That magnitude, of which a multiple is greater than the ſame multiple of another, is greater than the other. Let 2 A > 2 B, then A > B; or, let 3 A > 3 B, then A > B or, let m A > m B, then A > B. &c. &c. Proposition I. Theorem. If any number of magnitudes be equimultiples of as many others, each of each: what multiple soever any one of the firſt is of its part, the ſame multiple ſhall of the firſt magnitudes taken together be of all the others taken together. Let Red dome Red dome Red dome Red dome Red dome be the ſame multiple of Red dome , that Yellow home Yellow home Yellow home Yellow home Yellow home is of Yellow home . that Blue drop Blue drop Blue drop Blue drop Blue drop is of Blue drop . Then is evident that Red dome Red dome Red dome Red dome Red dome Yellow home Yellow home Yellow home Yellow home Yellow home Blue drop Blue drop Blue drop Blue drop Blue drop } is the ſame multiple of { Red dome Yellow home Blue drop which that Red dome Red dome Red dome Red dome Red dome is of Red dome ; becauſe there are as many magnitudes in { Red dome Red dome Red dome Red dome Red dome Yellow home Yellow home Yellow home Yellow home Yellow home Blue drop Blue drop Blue drop Blue drop Blue drop } = { Red dome Yellow home Blue drop as there are in Red dome Red dome Red dome Red dome Red dome = Red dome . The ſame demonſtration holds in any number of magnitudes, which has here been applied to three. ∴ If any number of magnitudes, &c. Proposition II. Theorem. If the firſt magnitude be the ſame multiple of the ſecond that the third is of the fourth, and the fifth the ſame multiple of the ſecond that the ſixth is of the fourth, then ſhall the firſt, together with the fifth, be the ſame multiple of the ſecond that the third, together with the ſixth, is of the fourth. Let Yellow circle Yellow circle Yellow circle , the firſt, be the ſame multiple of Yellow circle , the ſecond, that Red drop Red drop Red drop , the third, is of Red drop , the fourth; and let Blue circle Blue circle Blue circle Blue circle , the fifth, be the ſame multiple of Yellow circle , 