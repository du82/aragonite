["https://c82.net/hummingbirds/illustrations"]
title = "Classification - A Monograph of the Trochilidæ, or Family of Humming-Birds"
description = "Digital edition of John Gould’s monumental work depicting all known species between 1849 and 1887"
full_description = "I commence my first volume with that well-marked section of the family comprising the genera Grypus, Eutoxeres, Phaëthornis, and their allies. The members of all these genera are remarkable for being destitute of metallic brilliancy, and, as their trivial name of “hermits” implies, for affecting dark and gloomy situations. They constitute, perhaps, the only group of the great family of Humming-Birds which frequent the interior of the forests, and there obtain their insect food, some from the undersides of the leaves of the great trees, while others assiduously explore their stems in search of such lurking insects as may be concealed in the crevices of the bark. It has been said that spiders constitute the food of many species of this group; and I believe that such is the case, for we find the bills admirably adapted for their capture, particularly those of Grypus and Eutoxeres. To individualize by name any particular country in South America in which these birds are found is unnecessary, for they are generally distributed over its temperate and hotter portions; but they are not to be met with either very far north or very far south of the equator; that is to say, their range is bounded northwardly by Southern Mexico, and southwardly by Bolivia. Within these limits, the high and the low lands are alike tenanted by them; but it is in the equatorial region that they are the most numerous, and where all, or nearly all, the genera have representatives. In the colouring of their plumage the sexes are generally alike. As a whole, they form a well-marked division, distinguished by their own especial peculiarities of form and style of plumage. I commence the second volume with the Campylopteri, a group of Humming-Birds distinguished by their great size, by the diversity of their colouring, and by the broad, dilated shafts of the first three primaries or quill-feathers of the males. The members of this group are spread over nearly the whole of the temperate regions of America, from Mexico to the equator, including Brazil, Guiana, Venezuela, and some of the West Indian Islands."
