full_description = "Ο Ευκλειδης του Byrne Τα Πρωτα Εξι Βιβλια Των Στοιχειων Του Ευκλειδη Με Εγχρωμα Διαγραμματα Και Συμβολα Μιά αναπαραγωγή του περίφημου έργου του Oliver Byrne του 1847 συμπληρωμένη με διαδραστικά διαγράμματα, ενδοπαραπομπές και πόστερ, σχεδιασμένη από τον Nicholas Rougeux Εξερευνήστε το Βιβλια. Προταση 47 σχήμα Βιβλιο I. Βασική γεωμετρία του επιπέδου Προταση 7 σχήμα Βιβλιο II. Γεωμετρική άλγεβρα Προταση 21 διάγραμμα 1 Βιβλιο III. Ο κύκλος και τα στοιχεία του Προταση 4 σχήμα Βιβλιο IV. Κανονικά πολύγωνα Προταση 24 σχήμα Βιβλιο V. Λόγοι και αναλογίες Proposition 3 figure Βιβλιο VI. Ομοιότητα ευθύγραμμων σχημάτων Περί του έργου Μάθετε για την αρχική έκδοση του Μπερν και για το πως κατασκευάστηκε αυτή η ιστοσελίδα, τον σχεδιασμό της, την τυπογραφία της και άλλα σχετικά. Μάθετε περισσότερα Πως έγινε το έργο Ποστερ. Διακοσμήστε τους τοίχους σας με πολύχρωμα λεπτομερή πόστερ από κάθε πρόταση της αρχικής έκδοσης του βιβλίου του Μπερν (1847) των Στοιχείων του Ευκλείδη. Δείτε τα πόστερ"
