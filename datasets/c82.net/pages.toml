title = "Book IV - The Four Books of Architecture"
description = "Digital edition of Palladio's famous architectural treatise based on the 1738 English edition by Isaac Ware"
full_description = "Book IV Ancient Temples Book contents The Preface to the Reader If upon any fabric labour and industry may be bestowed, that it may be comparted with beautiful measure and proportion; this, without any doubt, ought to be done in temples; in which the maker and giver of all things, the almighty and supreme God, ought to be adored by us, and be praised, and thanked for his continual benefactions to us, in the best manner that our strength will permit. If, therefore, men in building their own habitations, take very great care to find out excellent and expert architects, and able artificers, they are certainly obliged to make use of still much greater care in the building of churches. And if in those they attend chiefly to conveniency, in these they ought to have a regard to the dignity and grandeur of the Being there to be invoked and adored; who being the supreme good, and highest perfection, it is very proper, that all things consecrated to him, should be brought to the greatest perfection we are capable of. And indeed, if we consider this beautiful machine of the world, with how many wonderful ornaments it is filled, and how the heavens, by there continual revolutions, change the seasons according as nature requires, and their motion preserves itself by the sweetest harmony of temperature; we cannot doubt, that the little temples we make, ought to resemble this very great one, which, by his immense goodness, was perfectly completed with one word of his; or imagine that we are not obliged to make in them all the ornaments we possibly can, and build them in such a manner, and with such proportions, that all the parts together may convey a sweet harmony to the eyes of the beholders, and that each of them separately may serve agreeably to the use for which it shall be appointed. For which reason, although they are worthy to be much commended, who being guided by an exceeding good spirit, have already built temples to the supreme God, and still build them; it does not seem, nevertheless, that they ought to remain without some little reprehension, if they have not also endeavoured to make them in the best and most noble form our condition will permit. Hence, because the ancient Greeks and Romans employed the utmost care in building the temples to their Gods, and composed them of the most beautiful architecture, that they might be made with so much greater ornaments, and in greater proportion, as that they might be suitable for the God to whom they were consecrated; I shall show in this books the form and the ornaments of many ancient temples, of which the ruins are still to be seen, and by me have been reduced into designs, that everyone may know in what form, and with what ornaments churches ought to be built. And although there is but a small part of some of them to be seen standing above-ground, I nevertheless for that small part, (the foundations that could be seen being also considered) have endeavoured, by conjecture, to show what they must have been when they were entire. And in this Vitruvius has been a very great help to me; because, I saw, agreeing with what he teacheth us, it was not difficult for me to come at the knowledge of their aspect, and of their form. But to the ornaments, that is, the bases, columns, capitals, cornices, and such like things, I have added nothing of my own; but they have been measured by me with the utmost attention, from different fragments, found in the places where these temples stood. And I make no doubt, but that they, who shall read this book, and shall consider the designs in it carefully, may be able to understand many places, which in Vitruvius are reputed very difficult, and to direct their mind to the knowledge of the beautiful and proportionable forms of temples, and to draw from them various very noble inventions; making use of which in a proper time and place, they may show, in their works, how one may, and ought to vary, without departing from the precepts of the art, and how laudable and agreeable such variations are. But before we come to the designs, I shall, as I usually do, briefly mention those advertences, that in building of temples ought to be observed; having also taken them from Vitruvius, and from other very excellent men, who have written of so noble an art. Chapter I Of the Site that ought to be chosen for the building of temples Tuscany was not only the first to receive architecture into Italy, as a stranger, from whence the order called Tuscan had its measures; but also the things belonging to the Gods, which the greatest part of the world, led into blind error, adored. She was mistress of the neighbouring people, and showed what sort of temples, and in what place, and with what ornaments, respecting the quality of the Gods, they ought to be built; which observations, although in many temples one may see, they have not been considered, I shall briefly relate nevertheless, how they have been left us by writers; that such as delight in antiquity, may remain in this part satisfied, and that the mind of everyone may be roused and inflamed to employ all suitable care in the building of churches; because it would be a very unseemly, and a blameable thing, that we, who have the true worship, should be out-done in this point, by those who had not light of truth. And, because the places, in which sacred temples are to be built, are the first things that ought to be considered, I shall make mention of them in this chapter. I Say therefore, that the ancient Tuscans directed that the temples dedicated to Venus, to Mars, and to Vulcan, should be made without the city, as to those who incited men’s minds to lasciviousness, to wars, and to broils; and within the city to those that presided over chastity, over peace, and good arts; and that so such Gods, into whose care particularly the city might be put; and those to Jupiter, Juno, and to Minerva, whom they also esteemed to be protectors of the city. Temples should be built upon very high places, in the middle of the country, and on a rock. And to Pallas, to Mercury, and to Isis, because they presided over artificers and merchants, they usually built temples near the piazzas, and sometimes over the very piazza; to Apollo, and to Bacchus near the theatre; to Hercules near the circus, and the amphitheatre. Those to Æsculapius, to Health, and to those Gods by whose medicines they thought men recovered their health, they built in places extremely healthy, and near wholesome waters; that by coming from a bad and pestilential air, to a good wholesome one, and by drinking those waters, the inform might the sooner, and with less difficulty, be cured, whereby a zeal for religion might be increased. And, to the rest of the other Gods, they likewise thought it necessary to find places to build their temples, persuant to the properties they attributed to them, and to the manner of their sacrifices. But we, who are by the special grace of God freed from that darkness, having departed from their vain, and false superstition, shall choose those sites for temples, that shall be in the most noble, and most celebrated part of the city, far from dishonoured places, and on beautiful and ornamented piazzas, in which many streets finish, whereby every part of the temple may be seen with its dignity, and afford devotion and admiration to whomever sees and beholds it. And if they city there be hills, the highest part of them is to be chosen; but in case there be no elevated places, the floor of the temple is to be raised, as much as is convenient, above the rest of the city. One is besides to ascend to the temple by steps; since the ascent alone to a temple is what affords greater devotion and majesty. The fronts of temples must be made to face the greatest part of the city, that religion may seem to be placed as the safeguard and protetrix of citizens. But if temples are built without the city, then their fronts must be made to face the public streets, or the rivers, if they are built near them; that passengers may see them, and make their salutations and reverences before the front of the temple. Chapter II Of the forms of Temples, and of the decorum to be observed in them Temples are made round, quadrangular, of six, eight, and more sides; all which terminate in the capacity of a circle, in the form of a cross, and of many other forms and figures, according to the various inventions of men, which, when they are done with beautiful and suitable proportions, and distinguished by elegant and ornamented architecture, they deserve to be praised. But the most beautiful, and most regular forms, and from which the others receive their measures, are the round, the quadrangular; and therefore Vitruvius only mentions these two, and shows us how they are to be comparted, as shall be inserted when the compartment of temples comes to be treated of. In temples that are not round, one ought carefully to observe, that all the angles be equal, let the temple be of four, of six, or of sides and angles. The ancients had a regard to what was suitable to every one of their gods; not only in the choice of the places in which they were to build temples, as has been said before; but also in the choice of the form. Hence to the fun, and moon, because they continually revolve round the world, and by their revolution produce effects manifest to everybody, they made temples of a round form, or at least such as came near to roundness; and thus also to Vesta, which they said was goddess of the earth, which we know is a round body. To Jupiter, as patron of the air, and of the heavens, they made temples uncovered in the middle, with porticos round them, as I shall hereafter observe. In the ornaments also, they had very great consideration to what God they built: therefore to Minerva, to Mars, and to Hercules, they made of the temples of Doric work; because to the Gods of the soldiery, of which they were made presidents, hey said fabrics without delicacy and neatness were most suitable. To Venus, to Flora, to the Muses, to the Nymphs, and to the more delicate goddesses, they said temples ought to be made that were suitable to the blooming and tender virgin age: hence they gave the Corinthian work to them; it appearing to them, that delicate and blooming works, ornamented with leaves, and with volutas, were more suitable to that age. But to Juno, to Diana, to Bacchus, and to other gods, whom neither the gravity of the first, nor the delicacy of the second, seemed to suit, they assigned Ionic works, which between the Doric and Corinthian hold the middle place. Thus we read, that the ancients in building their temples endeavoured to observe the decorum, in which consists the most beautiful part of architecture. And therefore we also, that have no false gods, in order to observe the decorum concerning the form of temples, must choose the most perfect, and most excellent. And since the round is such, because it is the only one amongst all the figures that is simple, uniform, equal, strong, and capacious, let us make our temples round. For which purposes this figure is particularly fit, because it being enclosed by one termination only, in which is to be found neither beginning nor end, nor are they to be distinguished one from the other; but having its parts similar one to another, and all participating of the figure of the whole; in a word the extreme being found in all its parts, equally distant from the middle, it is exceeding proper to demonstrate the infinite essence, the uniformity, and the justice of God. Besides which, it cannot be denied, but that strength and perpetuity, is more sought after in churches, than in all other fabrics; since they are dedicated to the omnipotent and supreme God and that in them are preserved the most celebrated and most memorable things of the city. Hence, and for this reason also, it ought to be said, that the round figure, in which there is never an angle, is particularly suited to temples. Temples ought also to be very capacious, that many people may there be able to assist at divine service. And amount all the figures that are terminated by an equal circumference, none is more capacious than the round. Those churches also are very laudable, that are made in the form of a cross, which have their entrance in the part that representing the foot of the cross, and opposite to which should be the principal altar, and the choir; and in the two branches, that are extended from either side like arms, two other entrances, or two other altars; because that being fashioned in the form of the cross, they represent to the eyes of the beholders that wood from which depended our salvation. And of this form, I have made the church of San. Giorgio Maggiore at Venice. Temples ought to have ample porticos, and with larger columns than other fabrics require; and it is proper that they should be great and magnificent (but yet not greater than the bigness of the city requires) and built with large and beautiful proportions. Whereas for divine worship, in which all magnificence and grandeur is required, they ought to be made with the most beautiful orders of columns, and to each other ought to be given its proper and suitable ornaments. They must be made of the most excellent, and of the most precious matter; and the divinity may be honoured as much as possible, both as well with the form, as matter: and if it were possible, they ought to be so made, that they might have so much beauty, that nothing more beautiful could be imagined; and so disposed in each of their parts, that those who enter there, may be astonished, and remain in a kind of ecstasy in admiring their grace and beauty. Of all the colours, none is more proper for churches than white; since the purity of colour, as of the life, is particularly grateful to God. But if they are painted, those pictures will not be proper, which by their signification alienate the mind from the contemplation of divine things, because we ought not in temples to depart from gravity, or those things, that being looked on render our minds more inflamed for divine service, and for god works. Chapter III Of the aspects of Temples By aspect is understood the first view which a temple exhibits to such as approach it. The most regular and the best understood aspects of temples are seven, concerning which is seemed to me necessary to insert here, what Vitruvius says, in the first chapter of the first book, that this part, which, by reason of the little attention paid to antiquity, has been by many reputed difficult, and by few hitherto well understood, may be made easy and clear by what I shall mention of it, and by the designs that are to follow, which may serve as an example of what he teaches us. And I thought it proper to make use also of the names which he does, that they who shall apply themselves to the reading of Vitruvius, to which I exhort every one, may therein observe the same names, to the end that they may no"
