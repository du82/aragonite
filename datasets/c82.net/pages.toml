["https://c82.net/architecture/book1"]
title = "Book I - The Four Books of Architecture"
description = "Digital edition of Palladio's famous architectural treatise based on the 1738 English edition by Isaac Ware"
full_description = "Book I The Five Orders & Observations in Building Book contents Chapter I Of the several particulars that ought to be considered and prepared before we begin to build Great care ought to be taken, before building is begun, of the several parts of the plan and elevation of the whole edifice intended to be raised: For three things, according to Vitruvius, ought to be considered in every fabric, without which no evidence, duration and beauty. That will therefore cannot be called perfect, which should be useful and not durable, or durable and not useful, or having both these should be without beauty. An edifice may be esteemed commodious, when every part or member stands in its due place and fit situation, neither above or below dignity and use; or when the loggia’s, halls, chambers, cellars and granaries are conveniently disposed, and in their proper places. The strength, or duration, depends upon the walls being carried directly upright, thicker below than above, and their foundations strong and solid: observing to place the upper columns directly perpendicular over those that are underneath, and the openings of the doors and windows exactly over one another; so that the solid be upon the solid, and the void over the void. Beauty will result from the form and correspondence of the whole, with respect to the several parts, of the parts with regard to each other, and of these again to the whole; that the structure may appear an entire and complete body, wherein each member agrees with the other, and all necessary to compose what you intend to form. When those several particulars have been duly examined upon the model or draught, then an exact calculation ought to be made of the whole expense, and a timely provision made of the money, and of those materials that shall seem most necessary, to the end that nothing may be wanting, or prevent the completing of the work. In so doing, the builder will not only be commended; but it will also be of the utmost advantage to the whole structure, if the walls are equally and expeditiously carried up: for being thus dispatched, they will settle proportionably, everywhere alike, and not be subject to those clefts so commonly found in buildings that have been finished at diverse times. Therefore, having made the choice of the most skillful artists that can be had, by whose advice the work may the more judiciously be carried on, you must then provide a sufficient quantity of timber, stone, sand, lime and metals; concerning which provision I intend to lay down some very useful directions. There must also be a sufficient number of joists, to frame the floors of the halls and chambers; which ought to be disposed and placed in such a manner, that the distance betwixt each joist may be the width of one joist and an half when they are framed together. You must likewise observe, that when the jambs of doors and windows are to be made, not to choose stones bigger than a fifth, or less than a sixth part of the void or opening. And if you intend to adorn the building with columns or pilasters, make the bases, capitals, and architraves of stones, and the other parts of brick. With respect to the walls, care must be taken, as they are raised, that they may proportionably be diminished in the thickness. Which observation, if rightly applied, may be of singular service, and enable you to make a truer estimate of the charge, and avoid great part of the expense. But as I shall treat more distinctly of these several particulars under their respective heads, this general hint may suffice at present, and may serve as a sketch of the whole fabric. The same regard is likewise to be had to the quality and goodness of those materials, that the best may be chosen. The experience gained from the buildings of the others, will very much help to determine what is fit and expedient to be done. And although Vitruvius, Leon Baptista Alberti, and other excellent writers, have laid down very useful rules with respect to the choice of the materials, I shall nevertheless take notice of such as are most essential, that nothing may appear to be wanting in this treatise. Chapter II Of Timber Vitruvius tells us, in the ninth chapter of his second book, that timber ought to be felled in autumn, or during the winter season, in the wane of the moon; for then the trees recover the vigor and solidity that in spring and summer was dispersed among their leaves and fruit. It will, moreover, be free from a certain moisture, and very apt to engender worms, and rot it, which at that time will be consumed and dried up. It ought likewise to be cut but to the middle of the pith, and so left until it is thoroughly dry, that the moisture, the cause of putrefaction, may gradually distill and drop away. When felled, it must be laid in a proper place, where it may be sheltered from the south sun, high winds, and rain. That of a spontaneous growth especially ought to be fully dried, and daubed over with cow-dung, to prevent its splitting. It should not be drawn through the dew, but removed rather in the afternoon; nor wrought when wet and damp, or very dry: the one being apt to cause rottenness, and the other to make clumsy work. Neither will it in less than three years be dry enough to be made use of in planks for the floors, windows, and doors. Those therefore who are about to build, ought to be informed from men thoroughly acquainted with the nature of timber, that they may know which is fit for such and such uses, and which not. In the above-mentioned chapter Vitruvius gives many other useful directions, besides what other learned men have written upon that subject. Chapter III Of Stones Stones are either natural, or artificially made by the industry of men. The former are taken out of quarries, and serve to make lime (of which more hereafter) and also to raise walls. Those of which walls are commonly made, are marble and hard stone, also called live stone; or soft, and tender. Marble and live stone ought to be wrought as soon as they are taken out of the quarry, which then may be done with much more ease than after they have continued some time exposed to the air. But the softer kind must be dug in summer, and placed under a proper shelter for the space of two years before they are used, that they may more gradually harden, being thus defended from high winds, rain, and frosts (especially when the nature of the stone is not well known, or if it be dug out of a place that never was opened before) by which means they will be made much fitter to resist the inclemencies of the weather. The reason for keeping them so long is, that being sorted, those which have received damage, may be placed in the foundations; and the others, which have not been injured, should be used above the ground: and thus they will last a long time. The stones artificially made are commonly called quadrelli, or bricks, from their shape. These ought to be made of a chalky, whitish, and soft earth, dug up in autumn, and tempered in winter, that, in the spring following, it may be the more conveniently be worked up into bricks; always avoiding that earth that is over fat or sandy. But if necessity obliges to make them in the winter or summer time, they must carefully be covered during the former season with dry sand, and in the latter with straw. When made, they require a long time to dry; for which reason a good shelter is the most proper place, to cause the outside and inside to dry or harden equally, which can’t be accomplished in less than two years. And as bricks are made either larger or smaller, according to the quality of the building, and their intended use; so the ancients made them larger for public and great buildings than for small and private ones; and therefore holes ought to be made here and there through the larger, that they may dry and burn the better. Chapter IV Of Sand There are three sorts of sand commonly found; pit, river, and sea sand. The best of all is pit sand, and is either black, white, red, or ash-colored; which last is a kind of earth calcined by subterraneous fires pent up in the mountains, and taken out of pits in Tuscany. They also dig out of the earth in Terra di Lavoro, in the territories of Baia and Cuma, a sort of sand, called Pozzolana Vitruvius, which immediately cements in the water, and makes buildings very strong. But long experience has shown, that of all the several kinds of pit sand, the white is the worst. The best river sand is that which is found in rapid streams, and under waterfalls, because it is most purged. Sea sand, although the worst, ought to be of a blackish color, and shine like glass: that which is large grained, and nearest to the shore, is best. Pit sand, being fattest, makes, for that reason, the most tenacious cement, and is therefore employed in walls and long vaults; but it is apt to check. River sand is very fit for covering and rough-casting of walls. Sea sand soon wets and soon dries, and wastes by reason of its salt, which makes it very unfit to sustain any considerable weight. Every kind of sand will be good that feels crisp when handled, and, if laid upon white clothes, will either stain or leave earth behind it. But that sand is bad, which, being mixed with water, makes it turbid and dirty: As also such as has remained a long while exposed to the weather; for then it will contained so much earth and corrupt moisture, that it will be apt to produce shrubs and wild fig-trees, which are very prejudicial to buildings. Chapter V Of Lime, and of the method of working it into mortar The stones of which lime is made, are either dug out of hills, or taken out of rivers. All those taken out of hills are good where dry, brittle, free from moisture, or the mixture of any substance, which being consumed by the fire, diminishes the stone. That lime will therefore be best which is made of the most hard, solid, white stone, and which, being burned, is left a third part lighter than the stone of which it was made. There is also a spongy sort of stone, the lime of which is very good for covering and rough-casting of walls; likewise a scaly rugged stone, taken out of the hills of Padua, that makes an excellent lime for such buildings as are most exposed to the weather, or stand under water, because it immediately sets, grows hard, and is very lasting. All stones taken out of the earth are much better to make lime of, than those which are collected; and rather taken from a shady moist pit, than from a dry one. The white are better than the brown, as being the most easily worked. The pebbles found in rivers and rapid streams, are excellent for lime, and make very white neat work; therefore it is chiefly used in the rough-casting of walls. All stones, either dug out of the hills or rivers, burn quicker or slower, in proportion to the fire given to them, but are generally calcined in sixty hours. When calcined, they must be wetted, in order to slack them; observing not to pour on the water all at once, but at several times, to prevent its burning before it be well-tempered, and afterwards must be laid in a moist shady place, only covering it lightly with sand, taking care not to mix anything with it; and when used, the more it is worked up with the sand, the better it will cement; except that made of scaly stone, like that from Padua, because that must be used as soon as it is slacked, to prevent its burning and consuming away; it will otherwise be useless. To make mortar, lime should be mixed with sand in this proportion; three parts of pit sand to one of lime, but two of sea or river sand to one of lime. Chapter VI Of Metals The metals commonly employed in buildings, are iron, lead, and copper. Iron serves to make nails, hinges, bars, gates, bolts for fastenings, and such like works. There is no iron anywhere found pure; nor any, when taken out of the earth, but must first be melted, and then purged of its dross by the fire, to make it fit for use. For then it will easily be made red-hot, will be soft enough to be wrought, and spread under the hammer: And if not well hammered when red-hot, it will burn and waste away. It is a sign the iron is good, if, when reduced into bars, you see he veins run straight and uninterrupted, and that the ends of the bars be clean and without dross: From these veins will show that the iron is free from lumps and flaws; by the ends we may know the goodness of the middle; and, when wrought into square plates, or any other shape, if its sides are straight and even, we may conclude it is equally good in all its parts, as it has equally in every part endured the hammer. Magnificent palaces, churches, towers, and other public edifices, are generally covered with lead. The pipes and gutters to convey the water, are also made of the same. It likewise serves to fasten the hinges and iron-work in the jambs of doors and windows. The three sorts of lead usually found, are the white, black, and that of a colour between both, by some called ash-coloured. The black is so called, not because it is really such, but because it is intermixed with some blackness; therefore the ancients, to distinguish it from the white, gave it very properly that name. The white is much more perfect, and of greater value than the black. And the ash-coloured holds the middle rank betwixt both. Lead is either taken out of the earth in a great mass, without any mixture, or in small shining, blackish lumps; and is sometimes found sticking in small flakes to the rocks, to marble, and to stones. All the different sorts melt very easily, because the heat of the fire liquifies it before it can be made red-hot; and if thrown into an extreme hot furnace, it will not preserve its substance, but be converted into litharge and dross. Of the three sorts the black is the softest and most weighty, and therefore will easily spread under the hammer. The white is harder and lighter. The ash-coloured is much harder than the white, and is of a middle weight between both. Public buildings are sometimes covered with copper; and the ancients also made nails and cramps thereof, which were fixed in the stone below, and to that above, to united and tie them together, and prevent them from being pushed out of their place. And by means of these nails and cramps, a building, which can’t possibly be made without a great number of pieces of stone, is so joined and fixed together, that it appears to be one entire piece, and for the same reason is much stronger and more durable. These nails and cramps were likewise made of iron; but the ancients most commonly made them of copper, because it is less subject to rust, and consequently will last much longer. The Letters for inscriptions, that were placed in the friezes of buildings without, were made of copper; and history informs us, that the hundred famous gates of Babylon, and Hercules’ two pillars, eight cubits high, in the island of Gades, were also made of that metal. The best and most excellent copper"
