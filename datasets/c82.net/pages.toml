full_description = "First edition Second edition Account-line This is a term used in a Compositor’s bill for the week; it is supposed to represent the value of certain portions of the work really executed, but which from being in an unfinished state cannot be entered with a specific charge: it is therefore the custom to charge “on account” somewhere about the estimated value of the work done, and which is deducted, week after week, until the general bill is made out, when the account is balanced. When travelling on this “line,” horseflesh is very often eaten.—Straker. Account-line This is a term used in a Compositor’s bill for the week. It is supposed to represent the value of certain portions of the work really executed, but which from being in an unfinished state cannot be entered with a specific charge; it is therefore the custom to charge “on account” somewhere about the estimated value of the work done, and which is deducted, week after week, until the general bill is made out, when the account is balanced. —See Dead Horse. « Back"
