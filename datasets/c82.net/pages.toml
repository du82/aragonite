les of where to find the colors described in nature. Contribute your photo » Pied Wagtail Photo: Albert Bridge 12. Pearl Grey Backs of black headed and Kittiwake Gulls. Back of Petals of Purple Hepatica. Porcelain Jasper. Pearl Grey, is ash grey mixed with a little crimson red and blue, or bluish grey with a little red. W. The colors in these photos are approximate and are intended to serve as examples of where to find the colors described in nature. Contribute your photo » Black-headed gull Photo: Hobbyfotowiki Purple Hepatica Photo: Archenzo Moggio Porcelain Jasper Photo: Daderot 13. Yellowish Grey Vent coverts of White Rump. Stems of the Barberry. Common Calcedony. Yellowish Grey, is ash grey mixed with lemon yellow and a minute portion of brown. W. The colors in these photos are approximate and are intended to serve as examples of where to find the colors described in nature. Contribute your photo » Northern wheatear Photo: Imran Shah Barberry bush Photo: Famartin Chalcedony Photo: Rob Lavinsky 14. Bluish Grey Back and tail Coverts Wood Pigeon. Limestone Bluish Grey, is ash grey mixed with a little blue. W. The colors in these photos are approximate and are intended to serve as examples of where to find the colors described in nature. Contribute your photo » Wood pigeon Photo: Tristan Ferne Limestone Photo: Hans 15. Greenish Grey Quill feathers of the Robin. Bark of Ash Tree. Clay Slate Wacke. Greenish Grey, is ash grey mixed with a little emerald green, a small portion of black, and a little lemon yellow. W. The colors in these photos are approximate and are intended to serve as examples of where to find the colors described in nature. Contribute your photo » European robin Photo: Partonez Ash tree Photo: Spablab Greywacke Photo: Michael C. Rygel 16. Blackish Grey Back of Nut-hatch. Old Stems of Hawthorn. Flint. Blackish Grey, a blackish lead grey of Werner without the lustre is ash grey, with a little blue and a portion of black. The colors in these photos are