title = "A Brief Visual Exploration of A Dictionary of Typography"
full_description = "A Brief Visual Exploration ofA Dictionary of Typography And its Accessory Arts Written by John Southward, 1870–1875.Reproduced by Nicholas Rougeux, 2020. ☟ John Southward was a printer in Liverpool and wrote A Dictionary of Typography and its Accessory Arts as parts that appeared in the Printers’ Register from 1870 to 1871. The dictionary is a comprehensive list of most aspects relating to printing including equipment, typography terminology, history, and best practices. In 1875, a second revised edition was published as a stand-alone publication. First edition scans from the Internet Archive Second edition scans from the Internet Archive Taking inventory This project is a short visual exploration of the differences between the two editions of Southward’s Dictionary viewed as a single alphabetical list of terms. The first difference explored is a simple inventory of the terms and color coding them based on whether they were in the first edition, second, or both. 48 761 terms in both editions 143 Combining all the terms from both editions into a single alphabetical list and only showing the first letter of each term creates a snapshot of which ones were removed, added, and kept as the dictionary evolved from the first to the edition. a a a a a a a a a a a a a a a a a a a a a a a a a a a a a a a a a a a a a a a a a a a a a a a a a a a b b b b b b b b b b b b b b b b b b b b b b b b b b b b b b b b b b b b b b b b b b b b b b b b b b b b b b b b b b b b b b b b b b b b b b b b b c c c c c c c c c c c c c c c c c c c c c c c c c c c c c c c c c c c c c c c c c c c c c c c c c c c c c c c c c c c c c c c c c c c c c c c c c c c c c c c c c c c c c c c d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d d e e e e e e e e e e e e e e e e e e e e e e e e e e e f f f f f f f f f f f f f f f f f f f f f f f f f f f f f f f f f f f f f f f f f f f f f f f f f f f f f f f f f f f f f f f f g g g g g g g g g g g g g g g g g g g g g g g g