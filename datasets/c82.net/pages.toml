full_description = "Definitions Proposition I Proposition II Proposition III Proposition IV Proposition V Proposition VI Proposition VII Proposition VIII Proposition IX Proposition X Proposition XI Proposition XII Proposition XIII Proposition XIV Proposition XV Proposition XVI Proposition XVII Proposition XVIII Proposition XIX Proposition XX Proposition XXI Proposition XXII Proposition XXIII Proposition XXIV Proposition XXV Proposition XXVI Proposition XXVII Proposition XXVIII Proposition XXIX Proposition XXX Proposition XXXI Proposition XXXII Proposition XXXIII Proposition XXXIV Proposition XXXV Proposition XXXVI Proposition XXXVII Book III. Definitions. I. Equal circles are thoſe whoſe diameters are equal. Definition 2 figure II. A right line is said to touch a circle when it meets the circle, and being produced does not cut it. Definition 3 figure III. Circles are ſaid to touch one another which meet but do not cut one another. Definition 4 figure IV. Right lines are ſaid to be equally diſtant from the centre of a circle when the perpendiculars drawn to them from the centre are equal. V. And the ſtraight line on which the greater perpendicular falls is ſaid to be farther from the centre. Definition 6 figure VI. A ſegment of a circle is the figure contained by a ſtraight line and the part of the circumference it cuts off. Definition 7 figure VII. An angle in a ſegment is the angle contained by two ſtraight lines drawn from any point in the circumference of the ſegment to the extremities of the ſtraight line which is the baſe of the ſegment. Definition 8 figure VIII. An angle is ſaid to ſtand on the part of the circumference, or the arch, intercepted between the right lines that contain the angle. Definition 9 figure IX. A ſector of a circle is the figure contained by two radii and the arch between them. Definition 10 figure a X. Similar ſegments of circles are thoſe which contain equal angles. Definition 10 figure b Circles which have the ſame centre are called concentric circles. Proposition I. Problem. Proposition 1 figure To find the centre of a given circle Blue circle. Draw within the circle any ſtraight line Red and dotted red line , make Red line = Red dotted line, draw Black line ⊥ Red and dotted red line ; biſect Black line, and the point of biſection is the centre. For, if it be poſſible, let any other point as the point of concourſe of Blue line, Blue dotted line and Black dotted line be the centre. Becauſe in Top triangle and Bottom triangle Blue line = Black dotted line (hyp. and B. 1, def. 15.) Red line = Red dotted line (conſt.) and Blue dotted line common, Blue and yellow angles = Black angle (B. 1, pr. 8.), and are therefore right angles; but Black and yellow angles = Right angle (conſt.) Black angle = Black and yellow angles (ax. 11.) which is abſurd; therefore the aſſumed point is not the centre of the circle; and in the ſame manner it can be proved that no other point which is not on Black line is the centre, therefore the centre is in Black line, and therefore the point where Black line is biſected is the centre. Q. E. D. Proposition II. Theorem. Proposition 2 figure A ſtraight line (Red line) joining two points in the circumference of a circle Red circle, lies wholly within the circle. Find the centre of Red circle (B. 3. pr. 1.); from the centre draw Black line to any point in Red line, meeting the circumference from the centre; draw Yellow line and Blue line. Then Blue angle = Black angle (B. 1. pr. 5.) but Yellow angle > Blue angle or > Black angle (B. 1. pr. 16.) ∴ Yellow line > Black line (B. 1. pr. 19.) but Yellow line = Black and dotted black line , ∴ Black and dotted black line > Black line; ∴ Black line < Black and dotted black line ; ∴ every point in Red line lies within the circle. Q. E. D. Proposition III. Theorem. Proposition 3 figure If a ſtraight line (Black line) drawn through the centre of a circle Blue circle biſects a chord ( Red and dotted red line ) which does not paſs through the centre, it is perpendicular to it; or, if perpendicular to it, it biſects it. Draw Blue line and Yellow line to the centre of the circle. In Left triangle and Right triangle Yellow line = Blue line, Black line common, and Red line = Red dotted line ∴ Black angle = Yellow angle (B. 1. pr. 8.) and ∴ Black line ⊥ Red and dotted red line (B. 1. def. 10.) Again let Black line ⊥ Red and dotted red line Then in Left triangle and Right triangle Blue angle = Red angle (B. 1. pr. 5.) Black angle = Yellow angle (hyp.) and Yellow line = Blue line ∴ Red line = Red dotted line (B. 1. pr. 26.) and ∴ Black line biſects Red and dotted red line . Q. E. D. Proposition IV. Theorem. Proposition 4 figure If in a circle two ſtraight lines cut one another, which do not both paſs through the centre, they do not biſect one another. If one of the lines paſs through the centre, it is evident that it cannot be biſected by the other, which does not paſs through the centre. But if neither the lines Black line or Red line paſs through the centre, draw Black dotted line from the centre to their interſection. If Black line be biſected, Black dotted line ⊥ to it (B. 3. pr. 3.) ∴ Blue and yellow angles = Right angle and if Red line be biſected, Black dotted line ⊥ Red line (B. 3. pr. 3.) ∴ Blue angle = Right angle and ∴ Blue angle = Blue and yellow angles ; a part equal to the whole, which is abſurd: ∴ Black line and Red line do not biſect one another. Q. E. D. Proposition V. Theorem. Proposition 5 figure If two circles Blue and red circles interſect, they have not the ſame centre. Suppoſe it poſſible that two interſecting circles have a common centre; from ſuch ſuppoſed centre draw Yellow line to the interſecting point, and Black and dotted black line meeting the circumferences of the circles. Then Yellow line = Black line (B. 1. def. 15.) and Yellow line = Black and dotted black line (B. 1. def. 15.) ∴ Black line = Black and dotted black line ; a part equal to the whole, which is abſurd: ∴ circles ſuppoſed to interſect in any point cannot have the ſame centre. Q. E. D. Proposition VI. Theorem. Proposition 6 figure If two circles Red and black circles touch one another internally they have not the ſame centre. For, if it be poſſible, let both circles have the ſame centre; from ſuch a ſuppoſed centre draw Blue and dotted blue line cutting both circles, and Yellow line to the point of contact. Then Yellow line = Blue dotted line (B. 1. def. 15.) and Yellow line = Blue and dotted blue line (B. 1. def. 15.) ∴ Blue dotted line = Blue and dotted blue line ; a part equal to the whole, which is abſurd; therefore the aſſumed point is not the centre of both circles; and in the ſame manner it can be demonſtrated that no other point is. Q. E. D. Proposition VII. Theorem. Figure I. Proposition 7 figure 1 Figure II. Proposition 7 figure 2 If from any point within a circle Blue circle which is not the centre, lines { Black and dotted black line Red line Blue line are drawn to the circumference; the greateſt of thoſe lines is that ( Black and dotted black line ) which paſſes through the centre, and the leaſt is the remaining part (Yellow line) of the diameter. Of the others, that (Red line) which is nearer to the line paſſing through the centre, is greater than that (Blue line) which is more remote. Fig. 2. The two lines ( Blue and dotted blue line and Red line) which make equal angles with that paſſing through the centre, on oppoſite ſides of it, are equal to each other; and there cannot be drawn a third line equal to them, from the ſame point to the circumference. Figure I. To the centre of the circle draw Red dotted line and Blue dotted line; then Black dotted line = Red dotted line (B. 1. def. 15.) Black and dotted black line = Black line + Red dotted line > Red line (B. 1. pr. 20.) in like manner Black and dotted black line may be ſhewn to be greater than Blue line, or any other line drawn from the ſame point to the circumference. Again, by (B. 1. pr. 20.) Black line + Blue line > Blue dotted line = Yellow line + Black line, take Black line from both; ∴ Blue line > Yellow line (ax.), and in like manner it may be ſhewn that Yellow line is leſs than any other line drawn from the ſame point to the circumference. Again, in Red triangle and Blue triangle , Black line common, Black and yellow angles > Yellow angle , and Red dotted line = Blue dotted line ∴ Red line > Blue line (B. 1. pr. 24.) and Red line may in like manner be proved greater than any other line drawn from the ſame point to the circumference more remote from Black and dotted black line . Figure II. If Red angle = Yellow angle then Blue and dotted blue line = Red line, if not take Blue line = Red line draw Yellow and dotted yellow line , then in Left triangle and Right triangle , Black line common, Red angle = Yellow angle and Red line = Blue line ∴ Red dotted line = Yellow line (B. 1. pr. 4.) ∴ Red dotted line = Yellow and dotted yellow line = Yellow line a part equal to the whole, which is abſurd: ∴ Red line = Blue and dotted blue line ; and no other line is equal to Red line drawn from the ſame point to the circumference; for if it were nearer to the one paſſing through the centre it would be greater, and if it were more remote it would be leſs. Q. E. D. Proposition VIII. Theorem. The original text of this propoſition is here divided into three parts. Proposition 8 figure 1 I. If from a point without a circle, ſtraight lines { Black and dotted black line Red line Blue line&c. } are drawn to the circumference; of thoſe falling upon the concave circumference the greateſt is that ( Black and dotted black line ) which paſſes through the centre, and the line (Red line) which is nearer the greateſt is greater than that (Blue line) which is more remote. Draw Blue dotted line and Red dotted line to the centre. Then, Black and dotted black line which paſſes through the centre, is greateſt; for ſince Black dotted line = Red dotted line, if Black line be added to both, Black and dotted black line = Black line + Red dotted line; but > Red line (B. 1. pr. 20.) ∴ Black and dotted black line is greater than any other line drawn from the ſame point to the concave circumference. Again in Blue triangle and Red triangle , Blue dotted line = Red dotted line, and Black line common, but Yellow and black angles > Yellow angle , ∴ Red line > Blue line (B. 1. pr. 24.); and in like manner Red line may be ſhewn > than any other line more remote from Black and dotted black line . Proposition 8 figure 2 II. Of thoſe lines falling on the convex circumference the leaſt is that (Black dotted line) which being produced would paſs through the centre, and the line which is nearer to the leaſt is leſs than that which is more remote. For, ſince Red line + Red dotted line > Black and dotted black line (B. 1. pr. 20.) and Red line = Black line, ∴ Red dotted line > Black dotted line (ax. 5.) And again, ſince Blue line + Blue dotted line > Red line + Red dotted line (B. 1. pr. 21.), and Blue line = Red line, ∴ Red dotted line < Blue dotted line. And ſo of others. Proposition 8 figure 3 III. Alſo the lines making equal angles with that which paſſes through the centre are equal, whether falling on the concave or convex circumference; and no third line can be drawn equal to them from the ſame point to the circumference. For if Dotted red and yellow line > Blue dotted line, but making Yellow angle = Blue angle ; make Red dotted line = Blue dotted line, and draw Dotted black and red line . Then in Red triangle and Blue triangle we have Red dotted line = Blue dotted line, and Black line common, and alſo Blue angle = Yellow angle , ∴ Dotted black and red line = Blue line (B. 1. pr. 4.); but Blue line = Black dotted line; ∴ Black dotted line = Dotted black and red line , which is abſurd. ∴ Blue dotted line is not = Red dotted line, nor to any part of Dotted red and yellow line , ∴ Dotted red and yellow line is not > Blue dotted line. Neither is Blue dotted line > Dotted red and yellow line , they are ∴ = to each other. And any other line drawn from the ſame point to the circumference muſt lie at the ſame ſide with one of theſe lines, and be more or leſs remote than it from the line paſſing through the centre, and cannot therefore be equal to it. Q. E. D. Proposition IX. Theorem. Proposition 9 figure If a point be taken within a circle Blue circle, from which more than two equal ſtraight lines (Yellow dotted line, Yellow line, Blue line) can be drawn to the circumference, that point muſt be the centre of the circle. For if it be ſuppoſed that the point Yellow and blue point in which more than two equal ſtraight lines meet is not the centre, ſome other point Black and red dotted line muſt be; join theſe two points by Black line, and produce it both ways to the circumference. Then ſince more than two equal ſtraight lines are drawn from a point which is not the centre, to the circumference, two of them at leaſt muſt lie at the ſame ſide of the diameter Red, black, and red dotted line ; and ſince from a point Red, yellow, and blue point , which is not the centre, ſtraight lines are drawn to the circumference; the greateſt is Black and red dotted line , which paſſes through the centre: and Blue line which is nearer to Black and red dotted line , > Yellow line which is more remote (B. 3. pr. 8.); but Blue line = Yellow line (hyp.) which is abſurd. The ſame may be demonſtrated of any other point, different from Red, yellow, and blue point , which muſt be the centre of the circle. Q. E. D. Proposition X. Theorem. Proposition 10 figure Proposition 10 figure One circle Blue circle cannot interſect another Red circle in more points than two. For if it be poſſible, let it interſect in three points; from the centre of Blue circle draw Black line, Yellow line and Blue line to the points of interſection; ∴ Black line = Yellow line = Blue line (B. 1. def. 15.), but as the circles interſect, they have not the ſame centre (B. 3. pr. 5.): ∴ the aſſumed point is not the centre of Red circle, and ∴ as Black line, Yellow line and Blue line are drawn from a point and not the centre, they are not equal (B. 3. prs. 7, 8); but it was ſhewn before that they were equal, in which is abſurd; the circles therefore do not interſect in three points. Q. E. D. Proposition XI. Theorem. Proposition 11 figure If two circles Blue circle and Black circle touch one another internally, the right line joining their centres, being produced, ſhall paſs through a point of contact. For if it be poſſible, let Black line join their centres, and produce it both ways; from a point of contact draw Red line to the centre of Blue circle, and from the ſame point of contact draw Blue dotted line to the centre of Black circle. Becauſe in Yellow triangle ; Black line + Red line > Blue dotted line (B. 1. pr. 20.), and Blue dotted line = Yellow and black line as they are radii of Black circle, but Black line + Red line > Yellow and black line ; take away Black line which is common, and Red line > Yell"
