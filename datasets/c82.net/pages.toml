title = "Advertisement duty - A Brief Visual Exploration of A Dictionary of Typography"
description = "A duty formerly levied on advertisements. This duty was first levied in the reign of Queen Anne, by 10 Anne, c. 19 (1712), and it was charged according to length, some change too place, and the duty, …"
full_description = "Second edition Advertisement duty A duty formerly levied on advertisements. This duty was first levied in the reign of Queen Anne, by 10 Anne, c. 19 (1712), and it was charged according to length, some change too place, and the duty, which had been reduced from 3s. to 6d. to 1s. 6d. in Great Britain, and from 2s. 6d. to 1s. in Ireland, and by 3 and 4 William IV., c23 (June 23, 1833), was entirely repealed by 16 and 17 Victora, c. 63, s. 6 (August 4, 1853). « Back A duty formerly levied on advertisements. This duty was first levied in the reign of Queen Anne, by 10 Anne, c. 19 (1712), and it was charged according to length, some change too place, and the duty, which had been reduced from 3s. to 6d. to 1s. 6d. in Great Britain, and from 2s. 6d. to 1s. in Ireland, and by 3 and 4 William IV., c23 (June 23, 1833), was entirely repealed by 16 and 17 Victora, c. 63, s. 6 (August 4, 1853)."
