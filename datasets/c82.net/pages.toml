full_description = "Werner’s Nomenclature of Colours By P. Syme A recreation of the original 1821 color guidebook with new cross references, photographic examples, and posters designed by Nicholas Rougeux Explore » Colors Explore all 110 colors painted by Syme with photos of where to find each color as outlined in the original guide. Posters Decorate your walls with creative data visualizations designed to highlight the beautiful colors used in the original guidebook. Original guidebook See scans of the original guidebook created by Syme from 1821 that Charles Darwin consulted during his voyages. Colors These colors are scans of the original swatches Syme painted in the 18th century extracted from the scanned copy on the Internet Archive. While the original colors have aged, they have been preserved here as in the original in an effort to faithfully reproduce the guide. Punctuation and capitalization can be unusual in places because it is the same as in the original. Whites Greys Blacks Blues Purples Greens Yellows Oranges Reds Browns Whites Color Name Animal Vegetable Mineral Parts 1. Snow White* Breast of the black-headed Gull. Snow-Drop. Carara Marble and Calc Sinter. None Snow White, is the characteristic colour of the whites; it is the purest white colour; being free of all intermixture, it resembles new-fallen snow. W. The colors in these photos are approximate and are intended to serve as examples of where to find the colors described in nature. Contribute your photo » Black-headed gull Photo: Hans Hillewaert Snowdrop Photo: Geoff Doggett Carrara marble Photo: James St. John Calcareous sinter Photo: Michael Linnenbach 2. Reddish White Egg of Grey Linnet Back of the Christmas Rose. Porcelain Earth. Reddish White, is composed of snow white, with a very minute portion of crimson red and ash grey. W. The colors in these photos are approximate and are intended to serve as examples of where to find the colors described in nature. Contribute your photo » Grey linnet