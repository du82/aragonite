["https://c9x.me/qscm"]
title = "QSCM - A tiny bootstrapped Scheme"
full_description = '''I am fascinated by systems that are self-sufficients, when I was a kid I wanted to make a lego car that would run by itself but the battery pack was too heavy for the engine that I had. Then I learned about computers, and I became interested in compilers, and more specifically bootstrapped compilers. These compilers are able to ingest their own source code and compile themselves. This page describes my first attempt at writing such a compiler. As a target for my bootstrapped compiler, I chose C, it's pretty high level, and if I can make the output of my compiler small enough I can probably have a nice entry for the IOCCC! To make the task non-trivial, we need a source language that is not simply a new syntax for C, we need a semantic gap that the compiler will bridge. A functional language is a natural thing to consider at this point, and if we want easy parsing, it is clear that what we need is something that is similar to Scheme. The let keyword is a classic, it simply gives a name to an intermediate computation, for example (let x 3 ...) will bind 3 to the variable x and evaluate the body (leaved as an ellipsis) using this fresh binding. The if construct will be our only way to do branching, when the condition evaluates to anything that is not 0, the "then" branch is taken, in all other cases the "else" is used. Computations are sequenced using do, the last computation of a do construct will determine the result of the whole sequence. Functions are created by the fun construct. Finally def sets a gobal variable to a given value. A qscm program can use integer literals in base 10, string literals (which are read-only 0-terminated strings), and character literals like #a #b #c. Here follows the typical factorial example: To make the language suitable to do anything more than integer manipulations we garnish it with a "standard library" that includes the following 17 primitves: Here is a simple program that reads one line from the input and prints it backwards. Note how we use pointers just like in C (this is the dirty/fun part of this Scheme). Looping is achieved by simple recursion.'''
