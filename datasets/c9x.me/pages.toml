["https://c9x.me/articles/gthreads/intro.html"]
title = "Green threads explained (intro)"
full_description = '''A short and self contained explanation that will guide you through an implementation of user threads. Green threads or userland threads (depending on your generation) provide high efficiency concurrency in a lot of mainstream languages. To only cite a few, CPython (via external libraries), Haskell, Go and Erlang are users of this technique. This series of short articles will expose the core ideas that rule this concurrency primitive. I will try to make this tutorial self contained and with very few prerequisites. During the course of my explanations, you will have the occasion to implement your own green thread machinery for C on the x86-64 architecture. I provide a reference implementation hosted by Github so you can play with working code. This tutorial is divided in small sections — some parts correspond to branches in the git repository, their title start with "Code" followed by a number. For instance, "Code 0" will correspond to the code0 branch. If you find any typo or have any suggestion about this tutorial, you can fill an issue on the Github page of the tutorial. Even better, if you want to make some modifications: fork the tutorial's repository and submit a pull request, I will be glad to integrate it here. The full tutorial is not yet complete since I am not sure what I want to develop after having presented the base. The plan is to investigate and develop more topics once I get feedback from you for the first parts. Going through current implementations' code is also an alternative for further articles. Green threads are threads that are scheduled by a virtual machine (VM) instead of natively by the underlying operating system. This definition from Wikipedia raises several points. First and unsurprisingly green threads are threads: they can be seen as lightweight processes executed concurrently and sharing the same address space. Second, they are provided by a user mode program, meaning that we do not need to hack the kernel in order to implement them!'''
