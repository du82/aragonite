["https://c9x.me/archive/spec.html"]
title = "memex - Archiving Tool"
full_description = "You will find here a complete description of the sdar archives and how they are used by the memex tool. The description should be accurate enough that from it alone and an sdar key it is possible to recover data from an archive. One goal is that this page is going to be mirrored by archive.org (or similar) and thus guarantee the perennity of memex archives. Another goal is to give memex users a precise understanding of the data model so that they may use the low level sdar tool to edit their archives. In 2019, with the objective of building some form of encrypted git, I specced a central bit of infrastructure precisely: sdar. sdar stands for secret deduplicated archive. It provides encrypted and content-addressed storage. The sdar tool can add data to an ephemeral stash area, each piece of data added to the stash is given an address computed from the data itself. Eventually, the stash committed, that is, consolidated as a segment of the archive. An archive is the mere sum of its segments. The sdar tool can retrieve data from an archive using addresses. In the final scheme, each segment of an archive represents one update to the memex. The user modifies its local copy of the memex, consolidates all the local changes in a segment, then uploads the segment to some remote storage. This way, very little information is leaked to the backup hosting service: only update sizes and rate of change — pretty much the least amount of information that could leak. Synchronization with other versions of the archive could also be easy (assuming segment names do not conflict): just rsync the segment directory. The cryptography is handled by nacl's cryptobox. sdar loads the archive key from ~/sdar.key (or some other user-supplied path) and, for each segment, it generates a new key pair. The segment's private key is used to encrypt the data for the public archive key. This way, it is possible to create a new segment without having access to the private part of the archive key. Put another way, it is possible to add to an archive without knowing the read key. The detailed layout of an sdar key file is:"
