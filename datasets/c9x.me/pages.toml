["https://c9x.me/compile"]
title = "QBE - Compiler Backend"
full_description = "QBE is a compiler backend that aims to provide 70% of the performance of industrial optimizing compilers in 10% of the code. QBE fosters language innovation by offering a compact user-friendly and performant backend. The size limit constrains QBE to focus on the essential and prevents embarking on a never-ending path of diminishing returns. The C codebase of QBE is intended to remain hobby-scale and pleasant to hack on. Despite the small footprint, QBE provides a number of optimizations with good impact/weight ratio. It also facilitates integration with foreign systems by implementing the C ABI in full. This means that programs compiled by QBE can trivially call into C, and vice versa. The current version of QBE can target amd64 (linux and osx), arm64, and riscv64. The snippet below is a self-contained program written in QBE intermediate language that shows how to define simple functions, perform arithmetic on words, and call into a variadic C function. Copy the example in a file, then compile it with qbe -o out.s file.ssa && cc out.s. The output binary should run smoothly, leaning on your local libc to print its output to the terminal."
