title = "Green threads explained (code0)"
description = "To start with, let's include this bunch of headers. I use C99 so we have booleans and precise integer types. This will be convenient to explicit the size of variables used."
full_description = "A short and self contained explanation that will guide you through an implementation of user threads. Here we dive into the code to get a very small but effective implementation of green threads. We will use the knowledge of the ABI to craft a data structure representing an execution thread. This structure will then be used to interrupt and restore the control flow hence providing the base building block to get working user threads. The code described here can be found in the code0 branch of the Github repository. A Makefile is included and should work on any platform having the GNU compilation toolkit installed. For this first version of the threading library, we simply use a single C file to store both the code of the library and the example. This is quite reasonable since everything fits in 133 lines. To start with, let's include this bunch of headers. I use C99 so we have booleans and precise integer types. This will be convenient to explicit the size of variables used. We first need to declare some constants useful in the rest of the code. To simplify, the number of green threads available is currently fixed to 4. This number includes the bootstrap thread which will be the only thread available when the program starts. The StackSize constant gives the size of a thread stack, I choose 4Mb, this should be more than sufficient for many applications. This is getting serious, the structure gt describes what a green thread is from the threading library's point of view. The ctx member of a thread structure captures a CPU state. This member can be seen as a frozen execution context for the thread so it is meaningful only when the thread is in state Ready. You might have noticed that only callee save registers appear in a context; more details about this will be given in gtswtch below. For simplicity, all the thread structures we will use will be stored in the gttbl array. At any point, when the library is initialized, the gtcur pointer points to the thread being currently executed."
