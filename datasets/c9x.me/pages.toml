["https://c9x.me/archive"]
title = "memex - Archiving Tool"
full_description = "Memex archives are composed of encrypted segments that can safely be synced among a group of machines and shared with mainstream storage providers such as rsync.net or Google drive. This way, personal files are shared, archived, and backed up without being revealed. Memex archives are not tied to a specific storage provider and are easy to relocate, should the need arise (e.g., lower costs or unreliable infrastructure). The data layer of the memex tool is provided by sdar, a secure deduplicated archive management tool. Sdar is a generic content-addressed database that stores the data encrypted. Values in an sdar archive can be as large as multiple petabytes. Random access in archives and values is possible and efficient. Using memex is not just yet a walk in the park. If you want to give it a shot, the instructions below should get you started. Most memex subcommands accept a -h flag that concisely explains their usage. Start by getting the source code and compiling it; GNU make, a C11 compiler and a bare Go installation should suffice to build everything. Then, create an archive key and initialize a new repository. The sdar key is the key to all data archived by the memex tool. It is displayed in clear by the keygen and keydump sdar subcommands. I recommend that you back it up on paper if you plan to use memex for archival. The newly created segment file .repo/seg/0d1b2... is safe to share and back up on untrusted storage. Each new commit will create a new segment but, if need be, sdar can be used to fuse segments. It can be interesting to keep segments split in order to only transfer newly committed data when re-syncing a memex archive with remote storage. In addition to segments, it is also recommended to back up the address of the head commit (here, 06879cc...81). However, the loss of this information is not critical as it can be recovered (inefficiently) from segments and the archive key."
