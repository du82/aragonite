["https://c9x.me/notes"]
title = "Notes"
full_description = '''Notes These are my personal opinions on various subjects, they are sorted in chronological order. I tried to keep them short. If you have any comments, I would be glad that you drop me a mail. July 14, 2023 It is folklore that, under some conditions, open-addressed hash tables with quadratic probing do not miss free slots. This note explains why with a proof. Let me break things down a little. With hash tables, the prime problem to solve when implementing insertion is conflicts: You are handed a key value pair (K₁,V₁) and, after hasing the key K₁, you realize that the table slot designated by the hash value is already filled with a binding (K₂,V₂). Chaining implementations will just cram the binding in the slot anyway, hence creating a bucket with more than one binding in a single table slot. Open-addressing implementations will instead go look for another slot. One obvious strategy for searching is to go look at the next slot, and the next one, and so on, potentially wrapping around when the last slot of the table is visited. Quadratic probing offers an alternative scheme: instead of scanning slot h+i mod N at the i-th step, it scans the slot h+P(i) mod N where P is a polynomial function of degree 2. This strategy helps with the clustering problem that linear probing may create. The polynomial P of interest to us here is P(X) = (X + X²)/2. The polynomial P outputs so-called triangular numbers (they can be stacked in a triangle shape), and the sequence P(0), P(1), P(2), ... is easily computed: p_i = 0; for (i=0; i<N; i++) { assert(p_i == (i + i*i)/2); p_i += i; } But, more importantly, if the table size is a power of 2, and there is a single free slot, quadratic probing will find it. It is not an obvious fact and I prove it below. Formally, we want to show that as i ranges over the interval I=[0,2ⁿ), h+P(i) mod 2ⁿ ranges over I as well. Said differently, we want to show that the function mapping x to h+P(x) mod 2ⁿ is a bijection over I. Since I is finite, it is sufficent to show that the map is injective; that is, it maps different values of I to different values. To prove injectivity we consider i and j in I such that h+P(i) mod 2ⁿ = h+P(j) mod 2ⁿ and show that i must be equal to j. We first reason by equivalence: (h + P(i) mod 2ⁿ) = (h + P(j) mod 2ⁿ) ⟺ (h + (i + i²)/2) - (h + (j + j²)/2) = k2ⁿ ⟺ (i + i²) - (j + j²) = k2ⁿ⁺¹ ⟺ (i - j)(1 + i + j) = k2ⁿ⁺¹ Breaking the products on both sides we get that there must be three integers k₁, k₂, and m such that: A := i - j = k₁2ᵐ with k = k₁k₂ B := 1 + i + j = k₂2ⁿ⁺¹⁻ᵐ and 0 ≤ m ≤ n + 1 We now consider three cases: If m is not 0 nor n+1 then it must be that both A and B are even. That is however impossible because B = 1 + 2j + A, so when A is even, B is odd, and vice versa. If m is n+1, we must then have i - j = k₁2ⁿ⁺¹, but since i and j are in the interval I, i - j is in (-2ⁿ,2ⁿ), so k₁ can only be zero and thus i equals j. If m is 0, we again use a size argument. Since i and j are in I, we have that 1 + i + j is in (0,2ⁿ⁺¹-1). So k₂ must be positive and less than 1; these requirements prove that the present case is impossible. The only possible outcome for the case analysis is thus that i equals j. Unwinding everything, the map h+P(x) mod 2ⁿ is injective on I, so it is also bijective on I, so when i ranges from 0 to 2ⁿ-1, the map ranges over all of I, and thus quadratic probing indeed vists all slots! November 16, 2022 Say you are given two integer ranges [a, b) where a is inclusive and b is exclusive. We would like to write a function that returns whether the two ranges overlap or not. I suggest you try it out before reading the rest of the note. We are now going to take a viewpoint on the problem which I hope you will find original. Formally, the two intervals overlap if and only if they have (at least) one element in common. So we would like to decide if the following formula holds: F := ∃x. x ∈ [a₁, b₁( && x ∈ [a₂, b₂( However, programming languages are really only subsets of the mathematical language, and most of them won't let us express the existential quantification. What we would like to find is a formula Fx that is equivalent to F but free of constructs that cannot be used in typical programming languages. In particular, Fx must be free of the existential quantifier. It so happens that this business of eliminating quantifiers is a cornerstone of automated reasoning, where it goes by the unsurprising name of "quantifier elimination". Quite often the idea behind these procedures is to eliminate quantified variables by forming a conjunction of all the implicands. Let's see how this would work on our formula: 0: F := ∃x. x ∈ [a₁, b₁( && x ∈ [a₂, b₂( 1: <=> ∃x. (a₁ ≤ x && x < b₁) && (a₂ ≤ x && x < b₂) 2: ==> a₁ < b₁ && a₁ < b₂ && a₂ < b₂ && a₂ < b₁ In the last step we considered all pairs (a,b) that sandwich the variable x and formed the inequalities a < b. By construction, and by transitivity of ≤,<, the resulting conjunction is a consequence of our original formula F. In other words, if the two ranges overlap, then the formula on line 2 must hold. Interestingly for integers, and in fact for any total order, the formula on line 2 is equivalent to F (take x to be max(a₁,a₂)). That's one thing we can easily formally verify using HOL Light: prove (`(?(x:int). (a1 <= x /\ x < b1) /\ (a2 <= x /\ x < b2)) <=> a1 < b1 /\ a1 < b2 /\ a2 < b2 /\ a2 < b1`, EQ_TAC THENL [ARITH_TAC; ALL_TAC] THEN STRIP_TAC THEN EXISTS_TAC `max (a1:int) a2` THEN ASM_ARITH_TAC);; Finally, note that the two conjuncts a₁ < b₁ and a₂ < b₂ are simply saying that the two input ranges are non-empty. If the two ranges are known to be non-empty, then the check degenerates to a₁ < b₂ && a₂ < b₁. January 15, 2019 It has been forever since my last note! I hereby take it as new year's resolution to share more about the interesting thought nuggets I come across. In computer hardware, arithmetic primitives are in fact modular primitives; this means that the result of a+b is defined as the mathematical sum of a and b modulo a power of 2 (usually, 2³² or 2⁶⁴). The mathematical structure obtained is a modular ring in which all operations "wrap around". It is only a ring and not a field because the multiplication operation does not have an inverse; to see why an inverse function for multiplication cannot be defined, observe that 42 is the result of both 21×2 and (2³¹+21)×2! An elementary result equivalent to Bézout's identity is that any number co-prime with the modulus has a multiplicative inverse. In a computer, this means that for any odd number a, a number b exists shuch that a✕b = 1. Now there is a particularly cute algorithm to find multiplicative inverses, and it is what motivated me to write this note. The core idea of the algorithm lies in an observation I found quite surprising: a multiplicative inverse b of a modulo 2ⁿ can be used to find an inverse c of a modulo 2²ⁿ. Let's see how. ab = 1 (mod 2ⁿ) ⇒ ab - 1 = k2ⁿ ⇒ (ab - 1)² = 0 (mod 2²ⁿ) ⇒ a²b² - 2ab + 1 = 0 (mod 2²ⁿ) ⇒ 2ab - a²b² = 1 (mod 2²ⁿ) ⇒ a(2b - ab²) = 1 (mod 2²ⁿ) ⇒ c = 2b - ab² (mod 2²ⁿ) This gives us the inductive step of the algorithm; to bootstrap it we simply need to find an inverse b of a modulo some small power of 2. To that end, one can check that all odd numbers are their own inverse modulo 4 (and 8). Putting it together in C. uint32_t mulinv(uint32_t a) { uint32_t b = a; /* 1/a mod 2² */ b *= 2 - a*b; /* 1/a mod 2⁴ */ b *= 2 - a*b; /* 1/a mod 2⁸ */ b *= 2 - a*b; /* 1/a mod 2¹⁶ */ b *= 2 - a*b; /* 1/a mod 2³² */ return b; } For those really eager for performance, it turns out that b = 3*a ^ 2 is a cute initialization by Peter Montgomery which yields an inverse of a modulo 2⁵ and allows to cut one refinement step! February 15, 2017 Undefined behavior in C is a common source of bugs, and sometimes, of funny ones. Here is my story about one. A few months ago I was working on a function that looked like this. for (i=0; arr[i]!=0 && i<2; ++i) { /* do some work */ } When my program was compiled without optimizations it would behave correctly, but turning optimizations on made it incorrect. I was able to quickly pinpoint the above loop as the root of my issues, but the symptom of the bug was quite unusual: Stepping in the debugger revealed that the loop body was only executed once, when it should have been running twice! Indeed, the array arr contained two non-zero values. After a little bit of head scratching, I eventually realized what the compiler was doing. The variable arr was declared as int arr[2], so accessing its third element is undefined behavior. Because of this, a valid program cannot access arr[2]; but if the loop body is run twice, the test condition will check arr[2]!=0 at the end of the second iteration. The consequence of this reasoning is that, assuming the input program is valid, the second loop iteration will not be run and can be gotten rid of! I thought this was quite a remarkable use of undefined behavior: Invalid array accesses do not happen in valid programs, so if the compiler can prove such access happens in a branch, it means that the branch is dead code. February 9, 2017 The φ nodes of SSA form are often defined as taking one argument per predecessor block. In both my compiler and LLVM, the data structures are based on this definition. However, with some more experience, I think it is more sensible to require φ arguments to be linked with incoming edges, not predecessors. I will give two practical examples to prove this point, but first, let me clarify the concept of edge. In a control flow graph (CFG), I call edge a link between two basic blocks. An essential point is that edges to a block are not in one-to-one correspondence with the block's predecessors. This is because of jumps like if(%cond) goto @b else @b, where a conditional jump jumps to the same block in two (or more) cases. While such a jump may look contrived, it can result from optimizations, or even from lowering C-style switch statements where multiple cases have the same body. The program below will serve to illustrate my claim. @src %var = .... %cond = ... if(%cond) goto @dst else @dst @dst %foo = φ(@src %var, ...) Following the usual requirement, the φ node %foo has one argument for the @src predecessor block. Assume now that the predecessor is dead code and gets deleted by this natural deletion code. void blockdel(Block block) { /* do stuff... */ foreach succ in block.successors { foreach phi in succ.phis { phi.remove_arg(block) } } } Stepping through this function reveals that the remove_arg method will erroneously be called twice. In my compiler, the second invocation caused an assertion failure. On the other hand, if φ nodes have one argument per incoming edge, the loop above is naturally changed to some correct code. Another case where things could go wrong is in a CFG simplification pass. Such a pass will likely remove spurious empty blocks and adjust links elsewhere in consequence. But consider the following program. @blk0 ... if(%cond) goto @blk1 else @blk2 @blk1 jmp @blk3 @blk2 jmp @blk3 @blk3 %foo = φ(@blk1 %v1, @blk2 %v2) The simplification pass will remove both @blk1 and @blk2. After deleting @blk1 the block of the first φ argument will be updated to @blk0. Now if the same thing happens to the second empty block, two arguments of the φ node will bogusly end up with the same incoming block. Solving these issues in my compiler required careful logic to handle the "multiplicity" of predecessors. However I think the edge-based design is better, and I might adopt it in the future. January 5, 2016 Because of a misuse of an archiving command I had to delete more than 40,000 files polluting my home directory. The UNIX way should make it easy because the decompression program can output the list of files it extracted. Unfortunately, it turned out to be surprisingly hard for at least two reasons: first 40,000 files is a lot and second, files used funny characters (white-spaces, dashes at the beginning, patheseses, etc.). After some Googling, here is the final command I used, phew. tr \\n \\0 <list.txt | xargs -0 -n 1 rm -f -- November 13, 2015 While browsing information about compilers I found it difficult to find a formal definition of SSA form (Static Single Assignment). For whatever reason, it's often under-specified or simplifed. So anyway, if you are like me and like formal definitions, here it is. A program is in SSA form when: Variables are assigned only once. All the uses of a variable are dominated by the unique definition. The φ nodes are at the beginning basic blocks. The φ nodes have one argument for each predecessor of their basic block. Uses of φ arguments are counted at the end of the corresponding predecessor. The concept of domination is from graph theory: an instruction A dominates another B when all the paths from the entry point of the program to B go through A. Please let me know if the definition above looks wrong to you. Finally, if you want informal examples, the Wikipedia page has plenty! October 20, 2015 I would like to share some thoughts I had about tagged data. Sum types and such are getting really common in mainstream languages, they are usually implemented using what I'll call a tag field. A tag is a small number that indicates what is the kind of the data considered. For example, in C, we often use the following idiom to mimic sum types: struct Fruit { enum { FruitNone, /* invalid fruit */ FruitApple, FruitBanana, FruitCherry, } kind; union { struct Apple apple; struct Banana banana; struct Cherry cherry; } u; }; Like in the example, most of the programming languages represent the tag using a machine integer. However, if you are programming with high space constraints it might be worth thinking more about the appropriate representation of the tag field. Let's say that you want a tagged structure that can be either one integer of type A in the range [0-255] or integers of type B, C, and D that lie in the range [0-63], then, because there are 4 different cases, the tag field needs to be at least 2 bits long, and because the type A needs at least 8 bits (8 bits represent at most 28 = 256 values), the whole tagged data-structure would need at least 8+2 = 10 bits for storage. The point is now that the whole reasoning above assumes that the tag bit-width is constant, but in the above case it is actually smarter to have a variable bit-width for the tag. Here is why: if we use the tag 0 to represent the kind of data A, and 3, 5, 7 to represent respectively the kinds B, C, and D, then we use only 1 bit for the tag in the A case and 3 bits in all the other cases. So instead of using 10 bits of storage as above we use max(8+1,6+3) = 9 bits! (Note that the above works because 3, 5, and 7 have 1 as least significant bit, so they are never confused with the A kind.) September 19, 2015 The x64 architecture is better than i386 in many regards but one surprise it reserved to programmers is that immediates remain 32 bits const'''
