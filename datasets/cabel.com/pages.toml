["https://cabel.com/2024/02/13/firehouse-five-and-the-cinderella-surprise"]
title = "Firehouse Five and the Cinderella Surprise – cabel.com"
description = "My goal was to preserve some never-before-heard recordings of an incredible Dixieland jazz band made up of mostly Disney employees, the Firehouse Five Plus Two. But along the way, I accidentally discovered an incredible lost song that was cut from Walt Disney's Cinderella. And you're about to hear it too. Let's go. Firehouse Five Plus…"
full_description = "My goal was to preserve some never-before-heard recordings of an incredible Dixieland jazz band made up of mostly Disney employees, the Firehouse Five Plus Two. But along the way, I accidentally discovered an incredible lost song that was cut from Walt Disney’s Cinderella. And you’re about to hear it too. Let’s go. Firehouse Five Plus Who? photo via D23 Here’s the backstory. In the early 1940’s, a bunch of talented folks in the powerful orbit of legendary Disney animator Ward Kimball, which naturally included plenty of folks from the Disney animation and sound departments, discovered that they shared a common love of jazz. During World War II, they started a studio band called the Huggajeedy Eight, and mostly played as part of Disney “camp shows” — vaudeville-style programs put on by studio personnel for soldiers at local military bases. Then, around 1945, Ward met a local trumpeter, Johnny Lucas, and together they started the San Gabriel Valley Blueblowers, playing frequently around LA. With that foundation, here’s how Ward likes to tells it: “Some of us used to gather in my office at lunchtime to listen to my records of jazz legends. We decided to really get into the spirit of the music by playing along with the records. Then one day the phonograph broke down right in the middle of ‘Royal Garden Blues’. Undaunted, we kept right on playing and found to our amazement that we sounded pretty good all by ourselves!” —Ward Kimball, legendary animator (and train enthusiast) The group included also-legendary animator Frank Thomas on piano, assistant director Danny Alguire on cornet, designer and Imagineer Harper Goff on banjo, and more. Interestingly, folks like Goff and Alguire were band members first, and were later hired at Disney, sometimes through the intervention of Ward (like Alguire) and sometimes on their own merits (like Goff). These lunchtime listening sessions became lunchtime jam sessions. Soon, they were being asked to play parties and dances. And before you know it, the Firehouse Five Plus Two was born. “When the band was asked by the local Horseless Carriage Club to play for its auto tour to San Diego, I quickly found and restored a 1914 fire truck and with the group now uniformed as firemen, we logically changed our name to the Firehouse Five Plus Two.” —Ward Kimball Why the Plus Two? Simple. “The ‘Plus Two’ was added so that people who hired us would know that they were getting seven musicians!” Duh. As the band’s popularity grew, their day jobs remained. “Walt always liked music and he was very proud of us. He couldn’t get over the fact that some of the guys who worked for him as animators and artists were all of a sudden the toast of the music world.” —Ward Kimball It was inevitable, then, that the Firehouse Five Plus Two would also work their way into the Disney canon. The band made an iconic appearance in the (very strange, very Charlie McCarthy-heavy) Alice In Wonderland-promoting television special One Hour in Wonderland (1950). Of course, it was shot on a soundstage, not in a real animation office, but what great set dressing: photo via @wardkimball They appeared in an episode of the Mickey Mouse Club: The band also makes an animated, hilariously-caricatured cameo in the Goofy short How to Dance (1953): The Firehouse Five Plus Two became, if you’ll forgive me, white hot. Ward summarizes: “We made movies at MGM and Universal Studios, played for Bing Crosby’s golf tournaments and radio shows, appeared on national television with such diversified luminaries as the Disney Mouseketeers, Milton Berle, Ed Wynn, and Lawrence Welk, culminating with over 15 years of summer appearances at the Golden Horseshoe at Disneyland. By the time we decided to retire the band in 1971, we had managed to record 12 albums which have sold worldwide. All this in our spare time.” —Ward Kimball What an incredible success for a side project. Eventually, Ward — and the Firehouse Five Plus Two — fell out of favor with Walt. Ward had a string of unfortunate conflicts, including a promotional ad for “Babes in Toyland” that put Ward front and center as director and angered Walt so much he had him removed from the picture entirely, and the band got caught up in the fray. “I remember [Walt] was having a picnic at the Golden Oak Ranch, [but] I had to leave at 2 o’clock and drive to San Diego to play at the Hotel Coronado with the band. So I went over and asked them if I could have a plate of food earlier. Walt walks up, while I’m sitting all by myself, with Betty [Kimball’s wife], and I’m eating, and he says to Betty, ‘Don’t you feed him at home?’ I said, ‘Gee, Walt, I have to go and play a job in San Diego.’ He made some sarcastic remark: ‘Don’t we pay you enough?’ You see, this fed the way he was feeling. Walt couldn’t understand why I would leave a Disney party that he planned, desert it at 3 in the afternoon, and go to San Diego and play with the band. He was so proud of that band for years. When these things all got added up, the band got thrown in the hopper, too.” —Ward Kimball, talking to Michael Barrier Still, even today, the Firehouse Five Plus Two remains a culturally important part of Disney. Maybe you spotted this familiar logo in The Princess and the Frog (2009)? Even better, this great homage just made it into the real world — at Tiana’s Palace at Disneyland, in 2023. There’s one other reason I’m fascinated by this band. Firehouse Five Plus Two perfectly captures a kind-of longing and nostalgia for a something I wish I could’ve experienced: a very special, early, creative, just-a-group-of-friends time at the Walt Disney Company. Just think: nobody got fired for this side project. This was Ward’s idea with no studio affiliation or investment. He didn’t have to CC:’d and BCC: this dream across huge teams of PR folks or lawyers. They practiced at lunch — during work hours. They were even allowed to sell their albums on a non-Disney music label. And yet, Walt even appreciated and leveraged the group to his benefit. A lot of this was simply the power of Ward, but still, could this happen today? It’s maybe not impossible, but it feels unlikely. Hey… wait a second! That was a lot of blabbering. Do you want to hear what the Firehouse Five sounds like?! Here are a handful of Firehouse Five albums on your favorite streaming services! Click on any cover to enjoy. (There’s more, but these ones are available everywhere.) (Also, a Cabel reminder to always buy the music you want to keep forever — these albums can, and will, disappear from streaming services at some point in the future.) Ok, you’re caught up. That’s the Firehouse Five Plus Two. Then, The Auction Let’s just say… it caught my eye immediately. The auction listing read: Lot #: 452Description: (ca. 1947) Collection of rare, unique live master recordings by The Firehouse Five on (6) original 78rpm records. These early direct-to-78 recordings capture the group as their swinging Dixieland sound began to coalesce.Each record includes multiple tracks, and retains a Walt Disney Productions label hand written (presumably by Kimball) with cheeky titles. An incredible, one-of-a-kind relic of underground Disney history. Mysterious acetate wafers that might contain one-of-a-kind, never-heard moments from this incredible band?! I simply had to get and/or hear these. So, I bid — and $1,000 later (once again, welcome to the world’s least profitable blog), a package showed up. I opened this vintage “His Master’s Voice” record folio as carefully as possible… …and when I took a look at that first label… …I knew I was in for something special. It began to sink in that what was in front of me was literally one-of-a-kind — and contained recordings that, most likely, nobody has heard in 70 years. And then I told myself: “Cabel you really can’t screw this up.” Getting Them Saved I needed a way to get these archived. Folks, I wasn’t about to slap them on an Urban Outfitters USB Turntable. That’s where Bryce Roe comes in. I emailed the Northeast Document Conservation Center, which I found via some Googling (“old records safe digitize no destroy important”, probably). They’re a non-profit conservation and preservation center in Andover, MA, that offers book, paper, photograph, and audio conservation, digital imaging, and more. Bryce replied: “We would be delighted to work with you to preserve your valuable recordings. These appear to be lacquer instantaneous discs, and they are quite fragile compared to vinyl — you were wise to be cautious about handling and playback! We offer traditional stylus playback reformatting for discs that are in stable condition, and we also offer a ‘non-touch’, optical scanning method using IRENE for discs that are too damaged to be played via a contact method or as a safer alternative for playable discs.” —Bryce Roe, NEDCC Ok, yeah, NEDCC seemed like a good lead. So after spending even more money on this post (someone who is good at the economy please help me budget this. my blog is dying), I put the records safely in the mail. If you want to get technical — and I do! — Karl Fleck, who did the archiving work, shared with me some process notes: “There are a lot of moving parts when it comes to transferring audio from a disc. Many of those parts have to deal with the lack of standardization in the characteristics of disc recording. So before I began the actual transfers, I ran a couple tests. First, I played the disc and captured some audio with different sized styli because the groove dimensions on discs were not standardized at the time and varied depending on the original disc cutting machine. Then, I compared the test audio and listened for which stylus produced the cleanest audio, or, the audio with the least amount of noise and distortion. Another technical setting was the playback equalization – AKA EQ. This setting determines the overall frequency balance of the audio content. Similar to the stylus selection, I listened to many EQ settings and determined which one was most appropriate for the time period and which had the most natural frequency balance.” —Karl Fleck, NEDCC Eventually, the work was done, and some digital files arrived at my doorstep. I took a deep breath, put on my headphones, and hit play. Firehouse Five: The Lost Rehearsals Let’s listen to these records together! But before we start, I want to note that I spoke with some wonderful people who helped me here. Theodore Thomas is a talented filmmaker — and also the son of Frank Thomas, Disney animator and Firehouse Five pianist. Don Hahn is a Disney legend, historian, and producer (Beauty and the Beast, Lion King, Atlantis, etc.) Stacia Martin is an encyclopedic source of Disney knowledge, an equally incredible artist (just watch her draw Figment — while talking!!), a 40+ year Disney employee and true delight. So, here we go: 1. Yes Sir! That’s M’Baby Go on, hit play! The first thing I have to mention, of course, is that Ward Kimball couldn’t help himself — on this label, he’s temporarily renamed the band to the “Outhouse Oaters”. (In modern terms, I think this loosely translates to “Crappy Western”.) This song is a Firehouse Five classic, but what’s interesting is that it’s surprisingly slow for them — I think what’s happening here is that we get to be in the room as they’re finding their footing and learning the song, playing it slow to get it under their belt. Also, this is clearly recorded with a single microphone — this isn’t a professional mixed record. This was almost certainly a lunch-time, skunkworks deal. 2. Shake That Thing First, omg, “Outhouse Oaters” was just the beginning. Now, the band’s temporary name is the “Farthouse Fuckheads”!! Every time I look at that label, I laugh. Every time. (It’s also funny, because we don’t really imagine folks in the ‘good old days’ using this kind of language, do we? Maybe because it’s not in that media. But, oh, they did.) Second, this disc is particularly special to me — I think this song isn’t available on any Firehouse Five record! It was normally just part of their live set. Now it’s saved! I’m also delighted by the strikethrough on “Walt Disney Productions” (“no copyright intended”) and the “throw away when finished”. Whoever didn’t do that — thank you. 3. Everybody Loves My Baby (Warm-up) This mysteriously-labelled disc contains a very short snippet of the band getting up to speed on Everybody Loves My Baby. There’s a much longer version a few discs down. 4. Has Anybody Seen My Gal? Good lord. Just when I thought we’d reached the alternate-name comedy peak, here come the “Jackoff Jackrabbits”!! This recording is starting to feel a little bit more like the pace of a Firehouse Five song. Also, at the beginning there’s a little bit of dialog, that to me sounds like “Five foot two with a Charleston gimme, hey Johnny, what is the beat?” After that you can hear trumpet-player Johnny Lucas exclaim “A-wat-dat!” and stomp out a six-count for tempo. It’s like being there. 5. Brass Bell (Frank’s Rag) More great chatter up top: “This is called Frank’s Rag, that title’ll have to do for now. Frank wrote it himself, right Frank?” I love this, because it captures a brief moment right before the song was formally known as “Brass Bell”, another Firehouse Five classic, as it was labelled. Again, it feels so dang slow! But I guess that’s what practice is all about? The song ends with a fantastic Ward “How do ya like it?!” 6. Everybody Loves My Baby No funny band name here, just a really nice recording of a great song with a fun Frank piano solo in the middle. 7. Silver Threads Among The Clinkers Gold It was inevitable. Our beloved band has another new, temporary name, via Ward Kimball: the “Whorehouse Five”. (And once again I thank whoever ignored the “Please Destroy” instructions written on the disc.) This is another song I don’t believe was ever released on a Firehouse Five album! And I love the coin-operated player piano gag at the beginning — it’s all played so straight until it starts to swing half-way through! The end of the song, though, is a treat. (Skip to 3:45). If you listen closely, there’s great real-life band discussion that takes place. My best transcription: “What’s the idea, Ed?” “Yeah, let’s hear this idea!” (That’s Ward talking to Ed Penner, Tuba player.) “Well, so you know [unknown venue] has a kitty at the front?” (Ted Thomas reminds me a kitty was a container — a barrel, a basket, a jar — to collect money and tips for the band.) “Yeah…” “Let’s make a kitty barrel and let’s rig it up so that if anybody [puts money in?], a firecracker goes off, a smoke bomb, bells ring, lights, I mean really…” “I suppose I’m going to have to make it?” (Ward, of course.) “You know, Lucas hates kitties!” “You know I made [a barrel] for a kitty up there in Pasadena, and no one put anything in it…” (Ward’s referring to one of the earliest jobs the Firehosue Five ever had as a band in Pasadena.) “But you know at the Cavern…” (Ted also notes that the Cavern might "
