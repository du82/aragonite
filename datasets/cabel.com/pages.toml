title = "Notes on Lloyd Center (2022) – cabel.com"
description = "This normally would be a short Twitter thread; bear with me as I practice new skills. As a kid growing up in Portland, Lloyd Center mall was the center of everything. As a toddler, when the mall was still outdoors, my dad used to walk me up and down the exact spiral staircase you can…"
full_description = "This normally would be a short Twitter thread; bear with me as I practice new skills. As a kid growing up in Portland, Lloyd Center mall was the center of everything. As a toddler, when the mall was still outdoors, my dad used to walk me up and down the exact spiral staircase you can see in this postcard, over and over. (I loved that fountain, lined on the inside with orange tile.) As a kid I basically lived in the Electronics Boutique, knew all the employees, and unofficially sold video games to overwhelmed parents. Then, as the mall was enclosed in the most 90’s way possible… Doug Beghtel/Oregonian Archives …as teens we loved to climb around on the new, easily-accessible roof and peer down through the glass at the ice rink. Once, we scaled a ladder all the way up inside this giant Meier & Frank “M&F” tower sign as it swayed terrifyingly in the wind. We were pretty dumb. Since the glory days, retailers started to leave one at a time. A few remain — shout out to Barnes & Noble — but it’s pretty haunted in there overall. But! Don’t fire up the echoey vaporwave for your dead mall YouTube video just yet. In 2022, Lloyd Center is an extremely interesting enigma: a dead mall that is not quite dead. ① Against all logic and reason, the ice skating rink, downsized in a recent remodel, still remains a vibrant community space. I took this picture just a few days ago. ② Also against all logic and reason, my favorite childhood place in the mall — Joe Brown’s Carmel Corn — is still in business to this day, one of the very few remaining tenants, holding strong. It is the best carmel corn you will ever eat, period. ③ Actually using logic and reason, an incredible experiment is taking place right now — thanks to low rent and high need, local indie shops have started to slowly take over abandoned storefronts. What was once clearly a Spencer’s Gifts, is now a record store, Musique Plastique: What was once a… Torrid, I think?… is now the incredible Floating World Comics. I absolutely love the idea of an “indie mall”. I want it to be a big thing so bad. Ok, yeah, I don’t know if Lloyd can hold in forever. Why do some malls survive and some die? But I dream that Lloyd Center remains a gathering space for the people of Portlanders of any era. Best,Cabel PS: If you go to Floating World Comics, make sure to pick up a copy of Santos Sisters #2 PPS: If I owned Lloyd Center, not that anyone is asking, I’d first demolish the majority of the confusing/scary/mall-obscuring parking and replace it with one clean, easily-understandable parking level like it had at opening. Then I’d demolish half of the mall (west of the ice rink) and make it modern outdoor-style shopping again. Then I’d lean in heavily on the “indie mall” idea for the remaining indoor half — elaborately theme it to classic mall nostalgia, so many possibilities."
