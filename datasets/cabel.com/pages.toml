["https://cabel.com/2024/09/08/thank-goodness-ive-written-some-ad-music"]
title = "Thank Goodness I’ve Written Some Ad Music – cabel.com"
description = "This summer, a new video game came out that changed the way we think about comedy in games, becoming an instant smash hit in the process. That's right, I'm talking about Thank Goodness You're Here! from Coal Supper. Ok, yeah, sure, I work for Panic and we published the game, so I was contractually required…"
full_description = "This summer, a new video game came out that changed the way we think about comedy in games, becoming an instant smash hit in the process. That’s right, I’m talking about Thank Goodness You’re Here! from Coal Supper. Ok, yeah, sure, I work for Panic and we published the game, so I was contractually required to write that opener, but I assure you, it’s very good and very funny. Thank Goodness You’re Here! has some in-world commercials, and I was extremely happy to get the chance to write the background music for those ads. Adverts? Feels like I should call them adverts instead of commercials, but I’m maybe not allowed to. My musical skills are somewhat limited but catchy jingles and retro vibes are definitely my “core competencies”, ugh. With James providing YouTube reference, I watched a ton of incredible ’70s/’80s British ads and tried to focus on the instrumentation and loose feel of that incredible era. I’ve collected all of the background music into a little mini-soundtrack video just for you. I hope you enjoy it! (And here’s the same video on YouTube, if you prefer.) Thanks,Cabel PS: Thank you Will and James for letting me do this PPS: The “Big Ron” jingle at the end, that we didn’t use, felt like too much (overcooking the comedy) and gave American-trying-to-be-British vibes… but I still love it PPPS: Please buy the game thanks"
