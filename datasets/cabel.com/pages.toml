description = "I'm an online idiot who grew up obsessed with computers, video games, and running pretend businesses. Nothing has really changed since. After a small bit of college, I reconnected with my childhood friend Steven Frank and we started a company called Panic. We're in Portland, Oregon. We started making Mac/iOS apps like Transmit (file transfer…"
full_description = "I’m an online idiot who grew up obsessed with computers, video games, and running pretend businesses. Nothing has really changed since. After a small bit of college, I reconnected with my childhood friend Steven Frank and we started a company called Panic. We’re in Portland, Oregon. We started making Mac/iOS apps like Transmit (file transfer client, still going strong), Nova (incredible native code editor), Prompt (lovely SSH app), Audion (best music player for Mac, R.I.P.), and lots more. We gradually grew to an incredible team of about 30 folks. Then, we accidentally fell into publishing amazing video games like Firewatch, Untitled Goose Game, and many more to come. Finally, we decided to stretch and try something new, so we make a tiny handheld video game system called Playdate, Personally: I love a good interest/obsession, and this blog will likely reflect any number of specific interests/obsessions at any given point in time. There are also a lot of bizarre Cabel sidequests: I once created the Sidetalkin’ site to make fun of the Nokia N-Gage, I did some of the earliest hands-on “Hey Guys” YouTube product reviews and then never did another one again, I occasionally write music for friends, etc. I would love to meet you someday. I really love meeting people. (But I’m ready to leave a party after ten minutes. What’s up with that?) • For really really old historical blog posts (2012 and below), visit Cabel’s Blog LOL. • Feel free to write me — cabel+blog@cabel.com — but be warned that I’m not great at email. 🙁"
