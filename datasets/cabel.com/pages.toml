["https://cabel.com/2024/05/19/my-gdc-24-talk-the-playdate-story"]
title = "My GDC ’24 Talk: The Playdate Story – cabel.com"
description = '''In January, I was invited to GDC, the Game Developers Conference, to give a talk about Playdate. That talk — "The Playdate Story: What Was it Like to Make Handheld Video Game System Hardware?" — has been made available free for all to view. Now, it's been 10 years since my last talk at XOXO here…'''
full_description = "In January, I was invited to GDC, the Game Developers Conference, to give a talk about Playdate. That talk — “The Playdate Story: What Was it Like to Make Handheld Video Game System Hardware?” — has been made available free for all to view. Now, it’s been 10 years since my last talk at XOXO here in Portland (I was maybe 12% less nervous for this one! Progress), and really this talk feels like a sequel to me. It covers a lot of our adventures since then, and I did my best to again give an honest look at the many ups and downs that come from trying something totally new. There’s a couple wild stories in here, too. If you watch it, thank you. I really appreciate it. (You can also click here to visit the GDCVault website.) Best,CabelPS: yeah I gave a talk at the Game Developers Conference and totally failed to mention we published Firewatch and Untitled Goose Game?! Why PPS: it might have seemed like I was joking about SLOWBIZ® but that’s just because I felt self-conscious about it… I actually really do think there’s an important philosophy there. Maybe that’s my next talk 10 years from now?"
