title = "CABINET / Cabinet Events"
full_description = "(Click here for directions to Cabinet­’s event s­paces in Brooklyn and Berlin. All events organized by Cabinet unless otherwise noted.) Book Launch and Discussion / “Attention Is Discovery: The Life and Legacy of Astronomer Henrietta Leavitt,” with Anna Von Mertens and Rebecca Dinerstein Knight Cabinet, 300 Nevins St, BrooklynWednesday, 11 December 2024, 7–9 pm Please join us to celebrate the recent publication of Attention Is Discovery: The Life and Legacy of Astronomer Henrietta Leavitt (MIT Press, 2024) by visual artist and author Anna Von Mertens. This multifaceted project is a recognition and celebration of the woman whose discovery founded modern cosmology and of the power of attention in scientific observation, artistic creation, and the making of meaning. Von Mertens will present a richly illustrated talk, which will be followed by a discussion with novelist Rebecca Dinerstein Knight, who contributed a guest essay to the project. Presentation / “Bodies of Evidence,” with Adam Broomberg and Ido Nahari Cabinet, 300 Nevins St, BrooklynTuesday, 12 November 2024, 7–9 pm Please join us for a presentation by Adam Broomberg and Ido Nahari that tracks how images of violence in Palestine have circulated and functioned in the past thirteen months. Vital to this discussion is the visibility of affliction—the war-torn bodies of damageable Palestinian victims vs. seemingly invulnerable Israeli soldiers—and how such optics sanctify certain forms of life while devaluing others wholesale. Book Launch / “Permitting Art: Visual Arts and the First Amendment on the Streets of New York,” with Legal Scholar (and First-Time Street Vendor) Brian Soucek Outdoors at the southwest corner of West Houston St and Broadway, New York Saturday, 9 November 2024, 2–5 pm Please come, rain or shine, to see the premise of our new book—legal scholar Brian Soucek’s Permitting Art: Visual Arts and the First Amendment on the Streets of New York—in action! The book examines the First Amendment argument with which artists successfully sued New York City for the right to sell artworks on the street without a vending permit, as had long been the case with books. This launch event will see Soucek and the Cabinet editorial team use these legal gains to vend, vend, vend books and art. Please drop by, and do bring our poor author coffee and cookies from time to time."
