["https://cabinetmagazine.org/exhibitions/warsza_najafi_niesluchowski_was_there_new_york.php"]
title = "CABINET / Exhibition / “And Warren Niesłuchowski Was There: Guest, Host, Ghost”"
description = """
An exhibition and publication about our late friend<br/>
Curated and edited by Joanna Warsza and Sina Najafi"""
full_description = "Exhibition dates: 11 October–6 November 2022Location: Cabinet, 300 Nevins Street, Brooklyn (map and directions here) Gallery hours: Thursday to Saturday, 12–6 pm, and by appointmentOpening: Tuesday, 11 October, 6–9 pmRemarks by the curators at 7 pm. Simon Leung and Jim Fletcher will perform Leung’s My friend, the War at 7:30 pm. Sylvère got drunk and teased Diego, something about politics, and Diego got mad and tossed his drink in Sylvère’s face. And Warren Niesluchowski was there, and John and Anya. … Warren’s a friend, an artworld personality and critic, a smart and cultivated guy. … Warren knows everyone in the artworld.—Chris Kraus, I Love Dick, 1997 Warren Niesłuchowski (1946–2019), one of the most charismatic and eccentric figures in the art world, was many things at once: an exhilarating conversationalist, a polymath, an attentive companion of artists, a polyglot translator, a networker without status, a walking bibliography, and a dandy, to name a few. And from 2003 till the end of his life, he had no home of his own, instead traveling on a minimal budget from city to city to live as the guest of others, coming and going on his own inexplicable schedule. He lived—as he himself used to say, echoing Duchamp and Derrida—the life of a “guest, host, ghost.” The exhibition and the publication focus on Niesłuchowski’s homeless years, and feature his email correspondence with close friends, many of whom are remarkable artists and intellectuals in their own right; a number of artworks made about, or in partnership with, Niesłuchowski; and documentation of his travels. The emails are full of erudition, congeniality, and translinguistic twists, but are also marked by the emotional burden of being perpetually on the road. They bear witness to his role as a generous companion to others and to the inheritance of someone who was an ontological wanderer by birth and by choice, permanently looking for what he called “an adoption by an imaginary family.”"
author = "Joanna Warsza and Sina Najafi"
year_published = 2025
