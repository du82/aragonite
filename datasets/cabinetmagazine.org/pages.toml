["https://cabinetmagazine.org/books/conflict_shoreline.php"]
title = "CABINET / The Conflict Shoreline: Colonization as Climate Change in the Negev Desert"
description = "by Eyal Weizman and Fazal Sheikh"
full_description = "The Conflict Shoreline: Colonization as Climate Change in the Negev Desert by Eyal Weizman (text) and Fazal Sheikh (photographs) Hardcover, 96 pages, 8 (w) x 10.5 (h) inchesColor and black-and-white illustrations Published by Steidl in association with Cabinet Books, 2015The PDF has been uploaded by a third party here. The village of al-‘Araqib has been destroyed and rebuilt more than seventy times in the “battle over the Negev,” an ongoing Israeli state campaign to uproot the Bedouins from the northern threshold of the desert. Unlike other frontiers fought over during the Israel–Palestine conflict, however, this threshold is not demarcated by fences and walls but advances and recedes in response to cultivation, colonization, displacement, urbanization, and climate change. The fate of al-‘Araqib, like that of other Bedouin villages along the desert’s threshold, its “aridity line,” is bound up with deep environmental changes. But whereas even the most committed environmentalists today conceive of climate change as an accidental and unintentional side effect of modernity, Israeli architect and theorist Eyal Weizman argues that from the point of view of colonial history, climate change has never been simply collateral damage. It has always been a stated goal; “making the desert bloom” is, in effect, “changing the climate.” In examining this history, Weizman outlines attempts—from the Ottoman era through the period of European colonization to the present—to scientifically define, measure, and map the threshold of the desert. Such efforts have been important because imperial and, later, national governments—whose laws have never recognized property rights in the desert—aimed to push back this threshold as they tried to expand the limits of arable land and bring the nomads under state control. In the Negev, the displacement of the weather and the displacement of the Bedouins have gone hand in hand. But while the desert edge, and the Bedouins, have been driven further and further south, global climate change today acts as a major counterforce. Predictably, the Bedouins are caught in the middle."
