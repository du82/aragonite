["https://cabinetmagazine.org/exhibitions/basha_tuning_baghdad.php"]
title = "CABINET / Exhibition / “Tuning Baghdad Tea Salon”"
description = "Curated by Regina Basha"
full_description = "Exhibition dates: 18 May–7 June 2019Location: Cabinet, Ebersstraße 3, 10827 BerlinGallery hours: Wednesdays, Thursday, and Saturdays, 12–5 pm, and by appointmentOpening events: Saturday, 18 May, 3–8 pm, and Sunday, 19 May, 4–6 pmFacebook Event Cabinet is pleased to present “Tuning Baghdad Tea Salon,” a three-week engagement with materials from Regine Basha’s family archive that provide a point of entry into the musical and cultural life of Iraq’s diasporic, 150,000-strong Jewish community that left in the late 1940s and early 1950s and is now spread throughout the world. In the arena of house parties (called chalghi in the diaspora, after a type of musical ensemble) in Los Angeles, Montreal, London, and elsewhere, the cuisine, social rituals, and music—in particular Iraqi Maqam music—are found intact among the Iraqi-Jewish diaspora. In this context, “tuning Baghdad” refers both to what Basha remembers as the long, protracted affair of tuning instruments at house parties and to the kinds of internal adjustments the guests would make in order to recreate the atmosphere experienced in Baghdadi house parties. Prior to the 1930s, music in Iraq was for the most part folkloric, ritualistic, or religious—used in Muslim and Jewish prayer, for instance, and primarily heard at weddings, funerals, and circumcision ceremonies. Many of these ritualistic practices were shared between Muslims and Jews, and the communities would often attend one another’s gatherings. In 1936, shortly after the establishment of Iraq’s national radio service, the Jewish composers Saleh and Daoud El-Kuwaity founded a live broadcast ensemble for it. Radio—a modernizing and secularizing force—also gave voice to a number of other prominent musical ensembles, including a beloved group of Iraqi-Jewish musicians who played so-called chalghi Baghdad music not only at weddings and house parties but also in the city’s increasingly numerous coffee houses. In 1932, when the first important pan-Arab music conference took place in Cairo, Iraq was represented by an ensemble consisting of a Jewish chalghi Baghdad group and the Muslim Maqam singer Mohammed Al-Qubanjii."
