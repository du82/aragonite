["https://cabinetmagazine.org/information"]
title = "CABINET / About Cabinet"
full_description = "What Is Cabinet? Founded as a non-profit in 2000, Cabinet is an award-winning quarterly magazine of art and culture based in New York that confounds expectations of what is typically meant by the words “art,” “culture,” and sometimes even “magazine.” Its hybrid sensibility merges the popular appeal of an arts periodical, the visually engaging style of a design magazine, and the in-depth exploration of a scholarly journal to create a sourcebook of ideas for an eclectic international audience of readers, from artists and designers to scientists, philosophers, and historians. Using essays, interviews, and artist projects to present a wide range of topics in language accessible to the non-specialist, Cabinet is designed to encourage a new culture of curiosity, one that forms the basis both for an ethical engagement with the world as it is and for imagining how it might be otherwise. In an age of increasing specialization, Cabinet looks to previous traditions of the well-rounded thinker to forge a new type of magazine designed for the intellectually curious reader of the future. Columns Cabinet’s continuity from issue to issue largely resides in its columns. Every issue since the magazine’s inception has featured a column titled “Colors,” in which we ask a wide variety of writers (ranging from scientists to poets and many others in between) to consider a specific color we assign them. Contributors to the “Colors” column have included Spencer Finch, Daniel Handler, Lyn Hejinian, Shelley Jackson, Aaron Kunin, Paul La Farge, Jonathan Lethem, Ben Marcus, Tom McCarthy, Eileen Myles, Maggie Nelson, Lisa Robertson, Luc Sante, Lytle Shaw, Frances Stark, and Lynne Tillman. Other regular columns include “Inventory,” which provides an occasion to make creative reassessments of various types of catalogues, lists, and taxonomies—recent installments have focused on a collection of tokens left with eighteenth-century orphans at London’s Foundling Hospital and an assortment of jewelry die sets made by a Polish-born Brooklyn craftsman—and “Leftovers,” which recently included a consideration of incorruptible bodies, both sacred and secular. “Ingestion” examines the intersections between eating, aesthetics, and philosophy—a recent column featured Brooke Holmes on digestion, health, and dreams in ancient Rome. Finally, Cabinet currently publishes a regular column entitled “Legend,” in which Wayne Koestenbaum provides one or more captions to a picture provided by the magazine’s editors."
