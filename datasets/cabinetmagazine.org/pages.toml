["https://cabinetmagazine.org/books/24Hours_OReilly.php"]
title = "CABINET / The Ambivalents"
description = "by Sally O’Reilly"
full_description = "Softcover, 52 pages, 5 (w) × 7.5 (h) inchesColor and black-and-white illustrations Cabinet Books, 2017 Support independent publishing: $12 directly from us; $10 for subscribers Sally O’Reilly’s The Ambivalents and its companion—Jeff Dolven’s Take Care—are the result of an unusual experiment. The sixth and fifth volumes of Cabinet’s “24-Hour Book” series, respectively, they were written in the exact same twenty-four-hour period, with O’Reilly working in a room at the Inner Temple in London and Dolven installed at Cabinet’s gallery space in New York. Both writers were asked to respond to a prompt, which was revealed to them one day in advance. The prompt took the form of a found document—the 1986 catalogue for Braintree Scientific, an American company that manufactures lab products used in experiments on rats and mice. (A pdf of the catalogue is available here. Readers may wish to consult it before reading this book.) O’Reilly’s response to the prompt was to compose dozens of letters to the company in the guise of a wide range of characters, including an artist, a literary critic, a dissatisfied customer, several schoolchildren, and a man who, like the animals on display in the catalogue, is perhaps close to death. Advance praise for the book“Sally O’Reilly’s degree of access to the Braintree Scientific archives—if in fact that is her source—is unprecedented; I don’t know how she did it. The letters she has brought us, wherever she found them, are extraordinary—by turns factually revelatory, piercingly insightful, puzzlingly off-topic, and simply heartbreaking. The editorial achievement is nothing less than genius. And all in the space of twenty-four hours! Surely among the year’s most significant work on the 1986 catalogue, or indeed, any other catalogue.” —Jeff Dolven, author of Take Care About Cabinet’s “24-Hour Book” series Inspired by literary precedents such as automatic writing, by the resourcefulness of the bricoleur making do with what is at hand, and by the openness toward chance that all artistic production under severe constraint must necessarily incorporate, this series invites distinguished authors and artists to be incarcerated in an unfamiliar space to complete a project from start to finish within twenty-four hours."
