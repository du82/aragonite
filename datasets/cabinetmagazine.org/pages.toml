full_description = "Project / “School of Death, or, L’École de la Mort” Forum -1, Petite Salle, Centre Pompidou, Paris 6–13 October 2016Organized by Simon Critchley and Sina Najafi Cabinet is pleased to announce the Paris incarnation of the School of Death, an educational institution dedicated to exploring the relationship between death and the examined life. Unlimited Edition / The Last Calendar November 2011 This 2012 oversized wall calendar, featuring artworks by Bigert & Bergström illustrating twelve methods of divination, ignores the familiar holidays in favor of more than sixty significant dates in the history of apocalyptic prophecy. Project / “Collector’s Album of Traders, Traitors, Translators, and Experientialists” Sharjah16 March – 16 May 2011 For its contribution to Sharjah Biennial 10, Cabinet presented “A Collector’s Album of Traitors, Traders, Translators and Experientialists.” Project / Key to the City, by Paul Ramirez Jonas Cabinet, 300 Nevins Street, Brooklyn 3 June – 6 September 2010 Cabinet contribution to Paul Ramirez Jonas’s Key to the City project, presented by Creative Time. Project / “Time-Money Roll” 2009– This continuous roll of time-money is Cabinet’s contribution to Time/Bank, an e-flux project in which groups and individuals trade time and skills directly and bypass money as a measure of value. Originally presented at e-flux’s launch of Time/Bank at the 2009 Frieze Art Fair, Cabinet’s roll of time-money is worth 24 hours. Project / Documenta Magazines Kassel, Germany 16 June – 23 September 2007 Cabinet was one of the magazines asked by Documenta to participate in its “magazines project” and help commission texts responding to the three “leitmotifs” of Documenta 12. Project / Cabinet at Proteus Gowanus Proteus Gowanus, 543 Union Street, Brooklyn 2005–2008 Cabinet contributed on an ongoing basis to Proteus Gowanus, an exhibition venue and reading room near the Gowanus Canal. Cabinet’s activities and presentations took place in an enormous