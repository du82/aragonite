["https://cabinetmagazine.org/events/art_education.php"]
title = "CABINET / Panel /“Art Education: A Study,” with Bruce High Quality Foundation University, Colin Lang, Robert Linsley, Mira Schor, and Howard Singerman"
full_description = "Date: Sunday, 10 January 2010, 7–9 pmLocation: Cabinet, 300 Nevins Street, Brooklyn (map and directions here)FREE. No RSVP necessary Organized by Ad Hoc Vox Cabinet presents “Art Education: A Study,” a panel discussion on the relationship between art and pedagogy. Too bohemian for the establishment, too avant-garde for the academy, too anti-intellectual for school: the artist, in many popular conceptions, resists education. Yet from the Académie des Beaux-Arts, to the Bauhaus, to the MFA, the history of art is also a history of the institutions that have accredited its practitioners. These institutions have determined both how art is made and distributed, and what art is—defining art not only functionally, but also philosophically. Ad Hoc Vox, itself an educational context, will not only examine this history in light of current debates about the MFA and the professionalization of the arts, but also by considering alternatives offered to us by non-traditional methods of education, the history of the academy, and models for the future of art school. To do so we have gathered together artists and art historians who have looked closely and critically at how art education has shaped artistic production. The panel’s participants are Bruce High Quality Foundation University, Colin Lang, Robert Linsley, Mira Schor, and Howard Singerman. Colleen Asper will moderate the panel, which will be followed by a Q&A with the audience. About Ad Hoc Vox Organized by Colleen Asper and Jennifer Dudley, Ad Hoc Vox is an ongoing series of discussions and lectures without a fixed location that addresses a wide range of issues in contemporary art. About the Participants Bruce High Quality Foundation University is a purposively unaccredited free university of the arts founded September 11, 2009 in TriBeCa by the Bruce High Quality Foundation. The school operates without teachers and promotes collaboration between artists as a critical learning model. Colin Lang is a Ph.D. candidate in the history of art department at Yale University. He is currently finishing his dissertation entitled Room 19, 1966–1969, which examines the early work of Imi Knoebel, Blinky Palermo, Imi Giese, and Jörg Immendorff, all students under Joseph Beuys at the Düsseldorf State Art Academy. His writing has appeared in Artforum and Texte zur Kunst."
