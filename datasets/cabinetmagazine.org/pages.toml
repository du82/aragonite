full_description = "Cabinet will be publishing its final print issue (number 68) before moving to an entirely digital format. Our next three issues will be published as follows: Issue 67—already printed Issue 68—ca. April 2023 Issue 69 (our first digital issue)—May-ish 2023 We are currently offering both print and digital subscriptions.Digital subscriptions: Once we become a fully online magazine, we will publish on a monthly schedule instead of a quarterly one. Which is to say, a one-year digital subscription will be for twelve issues (e.g.; issue 69 to issue 80), spanning ca. one year. You can, however, pre-order a digital subscription now. Why do it now? That is because you will receive, as a bonus, immediate digital access to our current and past issues, as well as digital access to the final print issue (issue 68) when it becomes available.Print subscriptions: If you are interested in receiving print issues, we do offer mini-subscriptions for lovers of ink and paper. A two-issue subscription gives you issues 67 and 68; a one-issue subscription gives you issue 68. All print-issue subscriptions come with full digital access to current and past issues. Please note that the print subscriptions do not extend past issue 68. If you’d like to get the print issues and then continue with a digital subscription once we go fully online with issue 69, you need to buy two subscriptions, with the digital subscription kicking in after the print subscription expires. We will make sure the two subscriptions are placed in tandem so that you experience no interruption to your online access.Below are all the ways in which you can purchase your subscription. Option 1:You can begin or renew a print or digital institutional subscription through our online shop. Option 2: You can print out our PDF-formatted ordering form and send it to our office with your credit card information or a check in US dollars drawn on a US bank. Since your subscription will include digital access, we ask that you sign and return the attached institutional licensing agreement. Subscriptions cannot be honored without the agreement."
