["https://cabinetmagazine.org/issues/69/levin_jones.php"]
title = "CABINET / Inside the Kill Chain: An Interview with Craig Jones"
description = "A history of lawfare"
full_description = "Warfare today is often closely supervised by lawyers, yet, as Craig Jones shows in his important study The War Lawyers, this does not necessarily mean violence and brutality have been mitigated. Tracing the emergence of what he describes as “lawfare,” Jones focuses on the United States, where this phenomenon first emerged, and Israel, where it has been perfected over the last two decades. Combining historical research with hundreds of hours of interviews with senior military lawyers, Jones’s account suggests that the conventional understanding of the relation between law and war, and perhaps even our understanding of law more generally, should be rethought. Boaz Levin spoke to Jones via video in June 2021. Cabinet: Your book offers what for many will be a surprising account of the relation between law and war. Whereas a wider public might associate law and legality with efforts to make war more humane and, ideally, less violent and less deadly, your account shows in great detail how the relationship between law and war is in fact very different, and more complicated. You describe law as becoming a kind of “medium of violence”—a means by which it is often legitimized, rather than simply a way of limiting it. What led you to write this book? Craig Jones: I first learned about military lawyers back in 2008–2009, around the time of “Operation Cast Lead,” the Israeli bombing of Gaza, which lasted three weeks at the end of 2008. At the time, there were lots of accusations of illegality made against Israel, and those accusations were based precisely on that conception of law, which you just nicely summarized—the sort of public or human rights version of law as something which should limit violence. And, therefore, when Israel behaved in such an aggressive way—for example, by bombing hospitals, United Nations buildings, killing lots of civilians, doing all kinds of things that ostensibly could be called war crimes, or at least prompt calls for investigations into possible war crimes—that was the understanding of law that human rights activists and lawyers, and many liberals and others internationally, turned to. From this perspective, there is a line which should not be crossed, but Israel crossed it, and continues to cross it. And, in response to this, Israel, for the first time—at least that I’m aware of—publicized the extent to which military lawyers or legal advisers were involved in overseeing those operations in very intimate detail, down to signing off on every single strike, or at least all those strikes that were preplanned. At a senior level, the law was part of the questions that shaped the operation: How is this operation going to look from a macro perspective? What are the objectives? What do we want to do? How much do we want to punish Hamas and the people of Gaza? And their position was that not only was it not illegal, but that they had lawyers ensuring that it was cutting-edge law, “the best version of law”—amazing, highly trained lawyers who had gone to the best law schools in the US and Israel. And these lawyers, who speak perfect English, were able to narrate to English-speaking audiences around the world a justification for the violence we were seeing. So, that’s largely how I first became interested in military lawyers; before that, I didn’t even know that they existed."
author = "Boaz Levin and Craig Jones"
year_published = 2024
clearnet = "https://cabinetmagazine.org/issues/69/levin_jones.php"
tags = ["boaz", "chain:", "craig", "history", "inside", "interview", "jones", "kill", "lawfare", "levin"]
