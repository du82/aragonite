title = "CABINET / Cabinet Exhibitions"
full_description = "Exhibition / “One for the Ages: The World of Matt Freedman” Cabinet, 300 Nevins Street, Brooklyn 26 October–23 November 2024 Cabinet is pleased to present “One for the Ages: The World of Matt Freedman,” an exhibition on Freedman (1957–2020) and his inspirationally diverse career as a sculptor, graphic artist, performer, writer, and curator. An accompanying book of the same name features essays by fifty contributors, as well as extensive documentation of Freedman’s four-decade-long practice, which was marked by his exuberant creative energy, intellectual generosity, enthusiastic dedication to collaboration, and excellent good humor. Exhibition / “And Warren Niesłuchowski Was There” Cabinet, 300 Nevins Street, Brooklyn 11 October–6 November 2022Curated by Joanna Warsza and Sina Najafi Cabinet is pleased to present the fourth iteration of “And Warren Niesłuchowski Was There,” a traveling exhibition on Niesluchowski (1946–2019) as a practitioner of an ethical, ontological homelessness—one made possible by the postwar order even as it rejected many of its principal tenets. An accompanying book has been co-published with the Museum of Modern Art in Warsaw. Exhibition / “Tuning Baghdad Tea Salon” Cabinet, Ebersstraße 3, Berlin 18 May–8 June 2019Curated by Regine BashaCabinet is pleased to present “Tuning Baghdad Tea Salon,” a three-week engagement with materials from Regine Basha’s family archive that provide a point of entry into the musical and cultural life of Iraq’s diasporic, 150,000-strong Jewish community that left in the late 1940s and early 1950s and is now spread throughout the world. Exhibition / “From Russia with Doubt” Cabinet, 300 Nevins Street, Brooklyn 18–29 November 2013Curated by Adam LernerCo-organized with the Museum of Contemporary Art Denver Cabinet is pleased to announce the opening of “From Russia with Doubt,” an exhibition of unauthenticated Soviet-era artworks. Co-organized with MCA Denver. Exhibition / “Curiosity: Art and the 