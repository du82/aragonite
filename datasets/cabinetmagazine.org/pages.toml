title = "CABINET / Rent the Cabinet Event Space"
full_description = "­­­Cabinet is a non-profit arts organization located in the Gowanus area of Brooklyn at 300 Nevins Street, between Union and Sackett Streets, and close to Park Slope, Boerum Hill, and Carroll Gardens. The ground-floor space is suitable for film screenings, receptions, conferences, workshops, book launches, meetings, retreats, photo shoots, small dinners, wellness classes, and more (not suitable for dance parties, primal scream therapy sessions, or live, amplified music, however).With roughly 1,000 square feet, the space can accommodate up to 74 people. See a floor plan and more photos of the space below. A larger floor plan is available here. For availability and additional information, please call us at + 1 718 222-8434, or email us at rentals@cabinetmagazine.org and let us know the type of event you are planning, your proposed date(s), and your phone number Address­ 300 Nevins Street (between Union and Sackett). Cabinet is conveniently located near the F, G, and R lines and there is often free street parking in front of the building in the evening. Detailed directions and map are here. Space­ 1,000 square feet outfitted with audio/visual equipment, a kitchen, and bathroom. The L-shaped space consists of a 850-square-foot main space and a 150-square-foot side gallery. Double doors opening to an adjacent alleyway make it very convenient to unload heavy items from vehicles. Please note that the space has highly efficient ceiling fans but no air conditioning. E­quipment­ Sixty black folding chairs; eight 6' × 2.5' plastic tables; and two 4' × 2' plastic tables. HD Digital projector with 10'-wide projection area and retractable screen. Wireless internet access. Five microphones, including a wireless handheld mic and two lapel mics. PA system (ready to connect to an mp3 player or computer). Please note that we cannot accommodate DJs or live bands, and that music can only be played at a moderate level). Kitchen­ The space has a recently constructed open kitchen, which has an induction stove, a convection oven, and an under-counter refrigerator and freezer. A microwave oven is also available."
