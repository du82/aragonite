["https://cabinetmagazine.org/events/alfonso_arus_loss_cuban_finotype_and_its_materiality.php"]
title = "CABINET / Presentation and One-Day Exhibition / “Cuban Finotype and Its Materiality,” with María A. Cabrera Arús, Jacqueline Loss, and Jairo Alfonso"
full_description = "Date: Wednesday, 21 October 2015, 7–9 pm; exhibition on view from 2 pmLocation: Cabinet, 300 Nevins Street, Brooklyn (map and directions here)FREE. No RSVP necessary What does it take to be fino? Is it only refinement and elegance? How do Cubans imagine it? Are these notions included in their aesthetic aspirations and everyday practices? Were these sensibilities ever part of post-revolutionary Cuba? How might they also reflect moral and spiritual states, historical and political legacies, and changing international solidarities? What might they turn into in the so-called new Cuba? Cultural critic Jacqueline Loss and sociologist María A. Cabrera Arús will discuss the notion of fino that circulates both in Cuba and its diaspora, and the material culture that has shaped it. Loss will present a trailer for the documentary that she and Juan Carlos Alom are making entitled Finotype, along with a related digital project that she is currently working on, while Cabrera Arús will talk about her project “Cuba Material,” an archive of the material culture of Cuban socialism between the years 1959 and 1989. Their presentation will be accompanied by a one-day exhibition of objects—drawn from Cabrera Arús’s archive—that arguably gave shape to some of the notions of fino tackled in Loss and Alom’s documentary, along with artworks by Jairo Alfonso that engage with Cuban material culture. The exhibition will be on view from 2 pm on the day of the panel. About the Participants Jairo Alfonso, graduate of Havana’s Higher Institute of Art, has worked with different media, but his latest work is based on drawing and video, which he uses to explore contemporary material culture from an “archeological” point of view. Alfonso has had more than ten solo exhibitions and participated in some sixty group shows, including, most recently “Flow: Economies of the Look and Creativity in Contemporary Art from the Caribbean,” (IDB Cultural Center, Washington DC, 2014) and “Cuban America: An Empire State of Mind” (Lehmann College Art Gallery, New York, 2014). His work is included in the collections of the Museum of Latin American Art, Los Angeles, and the Havana Galerie, Zurich, among others."
