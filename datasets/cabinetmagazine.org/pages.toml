["https://cabinetmagazine.org/books/24Hours_HarveyPorter.php"]
title = "CABINET / When Up and Down Left Town"
description = "by Matthea Harvey and Amy Jean Porter"
full_description = "Softcover, 54 pages, 5 (w) × 7.5 (h) inchesColor and black-and-white illustrations Cabinet Books, 2016 Support independent publishing: $10 directly from us; $8 for subscribers The third volume in Cabinet’s “24-Hour Book” series—a collaboration between poet Matthea Harvey and artist Amy Jean Porter—imagines a world where Up and Down, connected by horizontal zippers to the Middle, suddenly unzip themselves, leaving humans to experience a world without contrails or dachshunds. About Cabinet’s “24-Hour Book” series Inspired by literary precedents such as automatic writing, by the resourcefulness of the bricoleur making do with what is at hand, and by the openness toward chance that all artistic production under severe constraint must necessarily incorporate, this series invites distinguished authors and artists to be incarcerated in an unfamiliar space to complete a project from start to finish within twenty-four hours. About Matthea Harvey Matthea Harvey is the author of five books of poetry, most recently If the Tabloids Are True What Are You? and an erasure, Of Lamb, with drawings by Amy Jean Porter. She has also written two books for children. About Amy Jean Porter Amy Jean Porter’s drawings and installations have been shown in solo shows in New York, Los Angeles, and Paris, and featured in publications such as Cabinet, McSweeney’s, and The Awl. Her books include Of Lamb, written by Matthea Harvey. Cabinet wishes to thank the Andy Warhol Foundation for the Visual Arts for their support of this project."
