["https://cabinetmagazine.org/events/blum_lowry_our_history.php"]
title = "CABINET / Presentation and Discussion / “Our History || Notre histoire,” with Michael Blum and Glenn D. Lowry"
full_description = "Date: Wednesday, 3 June 2015, 7–9 pm Location: Cabinet, 300 Nevins Street, Brooklyn (map and directions here) FREE. No RSVP necessary Please join us for an evening of Canadian and Quebecois stories as Michael Blum presents his exhibition and book Our History || Notre histoire, a project on Canadian and Quebecois politics realized at Galerie de l’UQAM in Montreal last fall. After his presentation, Blum will be joined by Glenn Lowry for a discussion. Our History || Notre histoire consisted of a pair of mock national museums with a single (emergency) exit, offering a facetious understanding of both conflicted narratives while addressing the longstanding issue of “two solitudes,” a phrase used in Canada to describe the Anglophone and Francophone communities’ unwillingness to engage in dialogue with one other. The exhibition grew out of the specific political context of Quebec between 2012 and 2014, a period that saw, in rapid succession, the events surrounding the Maple Spring, the Parti Québécois’s Charter of Quebec Values, and the return and quick disappearance of the sovereignty debate with the election of a neoliberal government. While all this was taking place, television viewers were being treated to live coverage of the sessions of the Commission of Inquiry on the Awarding and Management of Public Contracts in the Construction Industry. Before visitors chose which museum to enter first, they encountered a neutral space where a publication was available for reading. Framed by quotes from authors Michel Tremblay and Mordecai Richler—whose writings epitomize their respective Francophone and Anglophone cultures, albeit in ways that, ironically, prove to be self-defeating—the publication gathered answers by over eighty respondents, in English and French, to a non-scientific survey that Blum circulated at the outset of the project and which included questions such as: A Q&A will follow Blum’s conversation with Lowry. Copies of Our History || Notre histoire will be available for purchase."
