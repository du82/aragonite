full_description = "Thank you for considering a donation to Cabinet. There are many ways to support us, including in honor or in memory of a loved one. All donations, great and small, are highly appreciated, and they are acknowledged online on this page. Cabinet is published by Immaterial Incorporated, a 501(c)(3) tax-exempt organization, and your contribution is fully tax-deductible if you pay taxes in the US. Please note that in exchange for higher amounts, we offer limited edition artworks by Matthew Buckingham, Justine Kurland, Vik Muniz, Jude Tallichet, and Terry Winters. If you elect to receive an artwork, the tax-deductible amount of your donation will decrease by the estimated value of the work, as required by law. 2. You can send a check made out to “Cabinet” to Cabinet, 300 Nevins Street, Brooklyn, NY 11217-3028, USA. Please mark the envelope “Balm from Gilead.” 4. You can call us at +1 718 222-8434 extension 1. This is the also the simplest way to make a donation for which you’d like a limited edition artwork as we need to calculate the shipping rates on a case-by-case basis. If you work for a company that offers a matching gift program, please take the time to send us the appropriate forms. This is an easy way to double or even triple your gift, and every dollar helps."
