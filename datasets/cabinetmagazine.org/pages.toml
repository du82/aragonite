["https://cabinetmagazine.org/books/the_virtual_sentence.php"]
title = "CABINET / The Virtual Sentence: A Book of Exercises"
description = "by Kyle Booten, D. Graham Burnett, Brian Dillon, Jeff Dolven, Jan Mieszkowski, Sally O’Reilly, Mónica de la Torre, and Elena Vogman"
full_description = "The Virtual Sentence: A Book of Exercises by Kyle Booten, D. Graham Burnett, Brian Dillon, Jeff Dolven, Jan Mieszkowski, Sally O’Reilly, Mónica de la Torre, and Elena Vogman Introduction by Jeff Dolven Softcover, 80 pages, 7 (w) × 10 (h) inches Black-and-white illustrations Cabinet Books, 2024 Support independent publishing: $14 directly from us; $12 for subscribers The Virtual Sentence is an exercise book for the era of ChatGPT. Its title is indebted to Gilles Deleuze, who uses “virtual” to name a reality that is neither actual (already here), nor potential (not yet here). Said of the sentence, the term points to the articulate alternatives that surround what gets spoken out loud or committed to ink and pixel. This is neither the total space of linguistic possibility, nor the particulars of what you might have said, considered afterward in a spirit of regret, or relief. In other words, the virtual sentence is not concerned with the before or with the after. Rather, it is what you might be saying, even as you say what you actually say, and what you might be hearing, even as you hear what you actually hear—a “might” that is in fact simultaneous with sentence making, surrounding it and making it meaningful. The virtual sentence inhabits a space defined by a kind of immanent syntactic and lexical alterity. What might be otherwise is already there. Today, the space of the virtual sentence is increasingly endangered, most dramatically by the accelerating aptitude of text-prediction algorithms used in the large-scale, unsupervised language models collectively known as Generative Pre-trained Transformers (GPT). This is the technology that companies like Google and Apple rely on when they volunteer to finish sentences in your texts and emails. Gmail, for example, offers tools “personalized to your writing style.” It can do this because it has read every email you have written, and also what everyone else has written, which is why it proposes what you want to say more quickly than your wants do."
author = "Cabinet"
year_published = 2025
clearnet = "https://cabinetmagazine.org/books/the_virtual_sentence.php"
