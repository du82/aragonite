["https://cabinetmagazine.org/information/PSnewsday.php"]
title = "CABINET / Cabinet Press"
full_description = "There’s a certain elegant economy to the new exhibit at the SculptureCenter in Long Island City. “The Paper Sculpture Show,” which begins next Sunday with a 2 p.m. public opening, involves 29 artists in a concept that originated in an issue of Cabinet, a magazine about art that sometimes becomes art. “The editors wanted artwork to print in their magazine for readers to build [into sculptures],” explains Mary Ceruti, who curated the exhibit, along with artist Matt Freedman and Cabinet editor Sina Najafi. The issue, which featured contributions by five artists, went over so well that plans were hatched for a book. Subsequently, those intentions blossomed into the full-scale show, whose concept follows a simple outline. Each artist has a blank piece of paper 10 inches by 13 inches, Ceruti says, and fills it with his or her own individual design, accompanied by instructions for assembly. Hopefully, exhibit visitors who cut out the shapes will wind up with a miniature paper sculpture, just like the ones replicated in “The Paper Sculpture Book” ($29.95, Independent Curators). Even the workstations that will be set up with the sculpture examples and pieces of paper at various spots within the 4,000- square-foot space follow a plan. They will be constructed from 4-by-8-foot sheets of plywood, emulating the paper format. As Manhattan artist Allan Wexler explains, the larger-scale workstations are simply versions of smaller paper models included in the book. “So someone could be sitting at a workstation constructing from paper a model of the workstation they’re sitting at,” he says, suggesting that it’s something of a surrealist game. “So then, which one is the model?” Carrying the idea further, the book itself becomes a set of instructions for any venue wanting to mount a similar show. “Each person becomes their own architect.” The interactive nature of the show, which runs through Dec. 7, leaves lots of room for variation. The artists all came up with something unique, and each piece has its own difficulty factor. Some may be as easy as piecing together a Burger King crown. Others boggle logic. “They reflect different approaches,” says Ceruti, toying with some of those paper models of the workstations in the mostly empty gallery on a recent afternoon. “For instance, there’s a very conceptual project that almost exists as a pure idea and doesn’t need to be built at all.” That would be a single page filled with impossibly detailed instructions from artist David Shrigley."
year_published = 2025
clearnet = "https://cabinetmagazine.org/information/PSnewsday.php"
