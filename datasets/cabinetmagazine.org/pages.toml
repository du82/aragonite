["https://cabinetmagazine.org/books/exchange_lewitt_book.php"]
title = "CABINET / An Exchange with Sol LeWitt"
full_description = "Softcover, 192 pages, 7.9 (w) × 10.5 (h) inchesBlack-and-white illustrations Cabinet Books, 2011Support independent publishing: $10 directly from us Although celebrated for the revolutionary role he played in the development of both Conceptualism and Minimalism, Sol LeWitt was also renowned for his exchanges of artwork with various artists throughout his lifetime. For LeWitt, the act of exchange seemed to be not only a personal gesture, but also an integral part of his conceptual practice. In addition to encouraging the circulation of artworks through a gift economy that challenged the art world’s dominant economic model, LeWitt’s exchanges with friends and strangers have the same qualities of generosity and risk that characterized his work in general. In the spirit of continuing the artist’s lifelong philosophy of open exchange, in 2011 MASS MoCA and Cabinet presented “An Exchange with Sol LeWitt,” a two-part exhibition curated by Regine Basha. The works of art that LeWitt received throughout his life, as well as records of what he offered in return, are maintained by the Sol LeWitt Private Collection in Chester, Connecticut—Eva Hesse, Steve Reich, Robert Mangold, Hanne Darboven, and Robert Ryman are some of the distinguished artists whose works are included in the collection. LeWitt did not restrict this practice to established contemporaries and friends, but also consistently traded with admirers and amateur artists whom he did not know. Inspired by the artist’s code of conduct, Basha initiated an open call for images, objects, music, film, books, and ephemera. The response was overwhelming, with over one thousand submissions received from around the world. Featuring work in all media, as well as found objects and mementos, the exhibition will showcase contributions by artists such as Fia Backström, Daniel Bozhkov, Luis Camnitzer, Teresita Fernandez, Harrell Fletcher, Jenny Perlin, Paul Ramirez Jonas, Pedro Reyes, Steve Roden, and Anton Vidokle & Julieta Aranda, among hundreds of others."
