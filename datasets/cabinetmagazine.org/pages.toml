["https://cabinetmagazine.org/events/barrada_yto.php"]
title = "CABINET / Screening and Book Launch / “Yto Barrada”"
full_description = "Date: Friday, 24 January 2014, 7–9 pm (screening at 7:30)Location: Cabinet, 300 Nevins Street, Brooklyn (map and directions here)FREE. No RSVP necessary Please join us for an evening of film to celebrate the publication of the new book Yto Barrada (JRP|Ringier), which includes essays by Jean-François Chevrier, Juan Goytisolo, Marie Muracciole, and an interview with the artist. French-Moroccan artist Yto Barrada explores post-colonial history and contemporary geopolitical shifts from a non-western perspective, with a particular focus on her hometown of Tangiers. To celebrate the publication of her new monograph, which provides a retrospective of her films, installations, sculptures, and publications, the artist will be present for the screening of three of her films: Hand-Me-Downs (2011, 15 mins), The Magician (2003, 18 mins), and The Smuggler (2006, 11 mins). A surprise film from the collection of Cinémathèque de Tanger, which Barrada co-founded, will also be shown. The screening will begin at 7:30 pm. Copies of the book will be available for purchase, courtesy of D.A.P. About the Participant Yto Barrada was born in Paris in 1971 and grew up in Tangier, Morocco. She studied history and political science at the Sorbonne and photography in New York. Her work—ranging across photographs, films, publications, installations and sculptures—engages with the peculiar situation of her hometown of Tangier. Her work has been exhibited at Tate Modern, London; The Renaissance Society, Chicago; Witte de With, Rotterdam; The Museum of Modern Art, New York; The Centre Pompidou, Paris; and the 2007 and 2011 Venice Biennales. She was the Deutsche Bank Artist of the Year for 2011, after which her exhibit “RIFFS” toured widely, and is the 2013 recipient of the Robert Gardner Fellowship in Photography. In 2014, she will have exhibitions at the Walker Art Center, Minneapolis, and MACBA, Barcelona. Barrada is also the founding director of Cinémathèque de Tanger."
