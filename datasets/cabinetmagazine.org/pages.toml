["https://cabinetmagazine.org/events/afternoon_of_fauna.php"]
title = "CABINET / “An Afternoon of Fauna: From Ants to Whales”"
full_description = "Date: Saturday, 12 January 2013, 2–6 pmLocation: New Museum, 235 Bowery, Manhattan (map and directions here)$10 Admission. Purchase tickets here. Spiders, parrots, songbirds, chickens, lobsters, king crabs, dogs, chimps, pigs, seals, orangutans—these are only a few inhabitants of the menagerie that appears in Rosemarie Trockel’s work. For this event in association with the artist’s exhibition “A Cosmos” at the New Museum, Cabinet invites visitors to take a trip through the animal world inspired by J.B.S. Haldane’s seminal 1920s essay “On Being the Right Size.” Making its way from smallest to largest, the program will investigate the scientific, literary, and cultural significance of various animals through a series of brief presentations, films, sound recordings, readings, and more. Contributors include Rachel Berwick, Bigert & Bergström, David Brooks, D. Graham Burnett, Elizabeth Demaray, Jeff Dolven, Amy Globus, Jeffrey Kastner, Nina Katchadourian, Carla Nappi, Sina Najafi, Yoshua Okon, George Pendle, Dominic Pettman, Hugh Raffles, Joel Smith, Jim Trainor, Michael Wang, Gregory Williams, among others."
