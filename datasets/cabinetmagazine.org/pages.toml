["https://cabinetmagazine.org/kiosk/dukes_hunter_april_09_2024.php"]
title = "CABINET / A Stamp on History"
description = "Remembering Deir Yassin"
full_description = "His stamp collection is spread over the mattress – stamps of all sizes, large and small, squares and rectangles, with differently coloured serrated edges. Among them I see one with strange angular lettering. It looks ancient, pharaonic. I read the small Arabic script: Israel. When I point to it, my uncle puts his stubby finger to his mouth and whispers, “Hush.” He turns his head to look around him, as if to see whether anyone has overheard us. Silently, I scrutinise the stamp more carefully. I am curious about the image on it. It is of an extended arm with strong fingers gripping an orange and white flower. What sort of body produces such a grip? I imagine broad shoulders and thick rippling muscles. Could that unreachable land be peopled by giants? There is writing on the side in Roman script, which I can’t read. I ask my uncle to translate and he tells me it is French for “the conquest of the desert.” I ask what conquest means and he explains.[1] —Raja Shehadeh On 9 April 1948, Zionist paramilitaries attacked the Palestinian village of Deir Yassin, a hillside community some five miles west of the Western Wall. During this early Friday morning, around 130 soldiers climbed up from the southeastern valley abreast quarried limestone veins.[2] The New York Times would hastily report that they encountered an “Arab force” of “2,500 men.” [3] Present-day historians put the population of Deir Yassin closer to 700, less a force than a village. The soldiers systemically massacred approximately ninety-three unarmed Palestinians, two-thirds of whom were children, women, and men over the age of sixty—this number does not include combatant deaths.[4] This conquest was an early salvo of David Ben-Gurion’s Plan Dalet, a program to ethnically cleanse Palestinian communities and establish a Jewish state across the whole of Mandatory Palestine. Liaising with neighboring settlements, Deir Yassin had previously reached a non-aggression pact ratified by Haganah, the central Zionist military organization in Jerusalem; by approving the attack proposals of two offshoot ultra groups—Irgun (aka Etzel) and Lehi (aka the Stern Gang)—Haganah’s leadership tried to insulate itself from backlash.[5] A commander for this unit would come to admit that, in the events leading up to 9 April, “there was not even one [hostile] incident between Deir Yassin and the Jews.”[6]"
author = "Hunter Dukes"
year_published = 2024
