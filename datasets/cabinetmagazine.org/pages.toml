["https://cabinetmagazine.org/events/dillon_curiosityartandthepleasuresofknowing.php"]
title = "CABINET / Exhibition / “Curiosity: Art and the Pleasures of Knowing”"
description = "Curated by Brian Dillon"
full_description = "Exhibition dates: 24 May–15 September 2013 Location: Turner Contemporary, Margate, UKHours: 10 am–6 pm “Curiosity: Art and the Pleasures of Knowing” is an exhibition that moves wittily, sometimes mysteriously, between contemporary art, anatomy, Old Master drawings, the history of criminology, Cold War secrets, the origins of museums, and voyeurism in everyday life. Taking as a starting point the cabinets of curiosities that flourished throughout Europe in the seventeenth century, “Curiosity” is a detailed meditation on the nature of wonder, fascination, and inquiry. Renowned architect David Chipperfield conceived the design for the Turner Contemporary installment of the exhibition, which is set to tour to Norwich Castle Museum & Art Gallery and De Appel, Amsterdam. Like its ancestor the Wunderkammer, this exhibition happily juxtaposes past and present to create a picture of knowledge and invention that is encyclopedic but highly eccentric. Attention and concentration are recurrent themes of the exhibition: contemporary works include Nina Katchadourian’s sly photographs made on long-haul flights using materials to hand, including lavatory supplies and in-flight magazines and meals; Matt Mullican’s videos of himself under hypnosis becoming deeply interested in his own shoe and other objects; and Tacita Dean’s film of the artist Claes Oldenburg in his studio as he cleans the objects on his bookshelves. Katie Paterson invites us to pore over identical images of darkness sourced from observatories all around the world, and prepares a fragment of meteorite that will be taken into orbit by the European Space Agency in 2014, while Gerard Byrne films and photographs the territory around Loch Ness, producing a compelling map of the frontiers between art, science, and fantasy. Visitors will encounter recent works such as these among an intriguing array of historical artifacts. The German glassmakers Leopold and Rudolph Blaschka did not call themselves artists, but in the late nineteenth century they produced an astonishing series of exquisitely detailed models of aquatic creatures: still used as teaching aids, they hover somewhere between works of art and scientific specimens. But curiosity has a less alluring history too. The Center for Land Use Interpretation, a scholarly-artistic institute based in Los Angeles, will exhibit a series of Rolodexes and index cards that once belonged to the US nuclear facility at Los Alamos: bearing the names and addresses of contractors hired by the government, they attest to an era of intense military-industrial secrecy. Curiosity can also coax us into seeing things that are not exactly there: a collection of ravishingly patterned and colored stones that belonged to the renegade surrealist writer Roger Caillois is part of the long tradition of artists projecting their visions onto the natural world."
author = "Cabinet"
year_published = 2025
