full_description = "­Cabinet is a non-profit 501(c)(3) magazine published by Immaterial Incorporated. Contributions to Immaterial Incorporated for the magazine and its related activities are fully tax-deductible. Donations of $500 or more qualify for one of the artist limited editions presented on this page. Please note that if you elect to receive a limited edition as a thank-you gift, the tax-deductible amount of your donation will decrease by the estimated value of that gift, as required by law. If you would like more information about our limited editions or require an estimate for shipping fees, please call us at + 1 718 222-8434 or email us at editions@cabinetmagazine.org. We accept payment by check (in US dollars on a US bank only), Paypal, credit card, or bank transfer. Vik Muniz, Cabinet of Curiosity, 2012 Silver gelatin print; 16 × 20 inches (unframed)Signed and numbered edition of 25Courtesy of the artist and Sikkema Jenkins & Co. Gallery, New YorkCan be chosen as a gift for donations of $2,500 or more (plus shipping) About the Artist Vik Muniz (born 1961) is a photographer and self-described “low-tech illusionist” who lives in Brooklyn and Rio de Janeiro. In his work, Muniz has used a wide range of materials—from chocolate and sugar to junk and toys—to create images, often art historical, that he records with a camera. He has had solo shows at the Whitney Museum of American Art, New York; the International Center of Photography, New York; and MACRO, Rome, among others, and his work is in the collection of museums worldwide, including the Museum of Modern Art, New York; Fondation Cartier pour l’Art Contemporain, Paris; the Metropolitan Museum of Art, New York; and Tate Gallery, London. Muniz is represented by Sikkema Jenkins & Co., New York; Xippas Gallery, Paris; and Nara Roesler Gallery, São Paulo. Terry Winters, Strings (for Cabinet), 2012 Woodcut; 10 5/8 × 13 1/2 inches (unframed) Signed and numbered edition of 100Courtesy of the artistCan be chosen a