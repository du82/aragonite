["http://www.cabinetmagazine.org/issues/6/shaw.php"]
title = "CABINET / Linnaeus: Pruning Names"
description = "The Enlightenment’s meta-gardener"
full_description = "Whatever use the flowers of rhetoric may have in language for ornamenting speech, at least in the nomenclature of species they are monstrosities: for here we demand the bare and simple truth apart from any trope, metaphor or irony. —Linnaeus It is commonly believed that the name of a plant which is derived from that of a Botanist shows no connexion between the two. But anyone who has but slight knowledge of the history of letters will easily discover a link by which to connect the name with the plant, and indeed there will be such charm in the association that it will never fade from his memory.—Linnaeus[1] In the first passage above from his 1737 treatise on naming plants, the Critica botanica, we encounter one of the Enlightenment’s central figures, the Swedish scientist and explorer, Carl Linnaeus (1707–1778), weeding rhetorical monstrosities from the would-be rational garden of scientific nomenclature. In the course of the book such weeding will also entail a radical downsizing in the number of names by which a plant is identified, a process that will culminate in the genus/species binomial structure of nomenclature (not fully articulated until the 1750s) for which Linnaeus is best remembered. In the second selection, however, we see Linnaeus making a special peace with the most disturbing and irrational of such monstrosities, as he seems to find human features on leaves, naturalizing the link not merely between things and names generally, but between the thing-ness of a plant and a botanist’s name. These passages thus mark the two edges of Linnaeus’s project of revising scientific nomination: on the one hand, the desire for names to exhibit a linguistic purity—a state of non-rhetorical, manifest plainness that would resist figurative associations; on the other, as the scientist’s own name makes its way into the system, inscribing itself on the very plant itself, we are invited to read attributes of the man back into the plant. Though this link between botanist and specimen begins as arbitrary, in time it becomes motivated. We connect Milleria, an American plant with a closely shut calyx protecting two seeds, to the 18th-century English botanist Philip Miller, for instance, not merely because the plant is named after the botanist who discovered it, but because, after years of mental commerce between the protective quality of this plant’s calyx and our knowledge of Philip Miller’s careful preservation of specimens (especially seeds) on sea voyages back to England, the plant’s conspicuous protective architecture will seem to embody Philip Miller-ness."
author = "Lytle Shaw"
year_published = 2002
clearnet = "http://www.cabinetmagazine.org/issues/6/shaw.php"
