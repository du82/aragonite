["https://cabinetmagazine.org/events/soucek_lena_gilmore_permitting_art.php"]
title = "CABINET / Book Launch / “Permitting Art: Visual Arts and the First Amendment on the Streets of New York,” with Brian Soucek and Jonathan Gilmore"
full_description = "Date: Thursday, 7 November 2024, 7–9 pm Location: Cabinet, 300 Nevins Street, Brooklyn (map and directions here) FREE. No RSVP necessaryInformation about our street launch on 9 November is available here. On the occasion of the publication of our new book, legal scholar Brian Soucek’s Permitting Art: Visual Arts and the First Amendment on the Streets of New York, please join us for a discussion featuring philosopher Jonathan Gilmore and the author. The first volume in Cabinet’s “Art before the Law” series, Permitting Art examines two federal cases, brought a decade apart, challenging vending laws that prevented artworks from being sold on the streets of New York City without a permit. Printed matter had always been exempted from this requirement because words are protected by the First Amendment of the US Constitution, and in 1995, a group of New York artists filed a federal suit against the city claiming that the visual arts are also a form of speech and should be similarly exempted. Their success led the city to allow sales of paintings, photography, sculpture, and prints on the street. But what qualifies as a painting? A second lawsuit, filed in 2004 by two graffiti artists who had been prevented from selling their painted T-shirts and hats on the street, forced the courts to address this question. Were these artists selling clothing that happened to have art on it, or paintings that happened to be on an unconventional material? About the ParticipantsJonathan Gilmore is a philosopher and art critic. He teaches at the CUNY Graduate Center, where he is the chair of the philosophy program. He is also a coeditor of The Journal of Aesthetics and Art Criticism. His most recent book, Apt Imaginings: Feelings for Fictions and Other Creatures of the Mind (Oxford University Press, 2020), was awarded the annual Outstanding Monograph Prize by the American Society of Aesthetics. Brian Soucek is professor of law and Chancellor’s Fellow at the University of California, Davis. A lawyer and philosopher of art, Soucek’s interdisciplinary work spanning law and aesthetics was cited to the US Supreme Court in the 5Pointz aerosol art case and 303 Creative, the case that determined whether web designers have an expressive exemption from antidiscrimination laws. His articles include “Aesthetic Judgment in Law,” Alabama Law Review, 2017; “The Constitutional Irrelevance of Art,” North Carolina Law Review, 2021; “Censorship and Subsidy,” in A Companion to Arthur C. Danto (Wiley Blackwell, 2022); “Censorship and Selective Support for the Arts,” in The Oxford Handbook of Ethics and Art (Oxford University Press, 2023); and “Tax Law as Muse,” Cornell Law Review, 2025. His next book, The Opinionated University: Academic Freedom, Diversity, and the Myth of Neutrality in American Higher Education, will be published by the University of Chicago Press in 2025."
author = "Cabinet"
year_published = 2025
