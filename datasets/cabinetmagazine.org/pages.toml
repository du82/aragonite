["https://cabinetmagazine.org/events/fabrication_of_blindness.php"]
title = "CABINET / Exhibition / “Julia Mandle: Fabrication of Blindness”"
description = "Co-presented with French Institute Alliance Française"
full_description = "Dates: 19–27 September 2009 Location: Cabinet, 300 Nevins Street, Brooklyn, NY (map and directions here) Gallery hours: Tuesday to Sunday, 12–6 pmOpening reception: Saturday, 19 September, 5–8 pm Discussion: Monday, 21 September, 7–9 pm Embroidery circles: Saturday and Sunday, 26–27 September, 1–5 pm The French Institute Alliance Française (FIAF), in partnership with Cabinet, is pleased to present Julia Mandle’s “Fabrication of Blindness” as part of FIAF’s “Crossing the Line” festival. A memorial to, and protest of, America’s use of torture in Iraq, Guantanamo Bay, and beyond, “Fabrication of Blindness” takes the form of a large dark cloud made out of the black military sandbags that are used to hood prisoners. For the work, Mandle has collected letters, poems, and stories by the detainees, words from which have been embroidered onto the hoods during a series of embroidery circles in New York City and Washington, D.C. Inspired by the images of French war photographer Jean-Marc Bouju, “Fabrication of Blindness” was originally created during Mandle’s residency at Baryshnikov Arts Center. “I have come to believe that it might only be when we feel the painful reality of what our country has caused – and stay with it, not turn a blind eye—that we will be inspired to truly act and change course. I believe that art can play an instigating role,” said artist Julia Mandle. “Julia Mandle’s poignant and beautiful installation directly challenges us to evaluate our own relationship to global or political events,” said Lili Chopra, Artistic Director of FIAF. “She raises the critical question; What is democracy if we don’t participate in it?” On Monday, 21 September, from 7 to 9 pm, Mandle will engage in a conversation about the work with scholar Marc Falkoff, the editor of a collection of writings by Guantanamo Bay detainees. They will discuss the project’s place in the intersection of art and activism, exploring the practice of art as a politicizing agent."
