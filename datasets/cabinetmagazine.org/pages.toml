["https://cabinetmagazine.org/exhibitions/oddlots.php"]
title = "CABINET / Exhibition / “Odd Lots: Revisiting Gordon Matta-Clark’s “Fake Estates””"
description = "A two-part exhibition at White Columns and Queens Museum of Art<br />Curated by Jeffrey Kastner, Sina Najafi, and Frances Richard"
full_description = "White Columns: 9 September–15 October 2005Location: 320 West 13th Street, New YorkOpening reception: 9 September, 7–9 pm Queens Museum of Art: 11 September 2005–22 January 2006Location: New York City Building, Flushing Meadows, Corona Park, Queens Opening reception:17 September, 1–6 pm “Odd Lots: Revisiting Gordon Matta-Clark’s Fake Estates” examines the complex and provocative project by Gordon Matta-Clark known as Fake Estates through his original materials, a series of guided tours, and commissioned works by eighteen artists. Participating Artists and Tour Guides Artists and tour guides include Francis Alÿs, Jimbo Blachly, Isidro Blasco, Michael Crewdson, Jaime Davidovich, Mark Dion, Maximilian Goldfarb, Valerie Hegarty, Julia Mandle, Helen Mirra, Margaret Mittelbach, Matthew Northridge, Dennis Oppenheim, Sarah Oppenheimer, Dan Price, Lisa Sigal, Katrin Sigurdardottir, Lytle Shaw, Jane South, Jude Tallichet, Nato Thompson, Mierle Laderman Ukeles, and Clara Williams. With participating artists ranging from Matta-Clark’s contemporaries to emerging practitioners, “Odd Lots” seeks to activate the legacy of an “artist’s artist” whose dovetailing interests in architecture, sculpture, and performance remain influential across a variety of disciplines. The exhibition de-emphasizes the image of Matta-Clark as a chainsaw-wielding urban land artist obsessed with the “object to be destroyed.” Instead, it underscores aspects of his work that investigate dematerialization, use value, and systems of social organization. Gordon Matta-Clark and Fake Estates In 1973, Matta-Clark discovered that the City of New York periodically auctioned off “gutterspace”—unusably small slivers of land sliced from the urban grid through anomalies in city planning. He purchased fifteen of these lots, fourteen in Queens and one in Staten Island. Over the next years, he collected the maps, deeds, and other bureaucratic documentation attached to the slivers; photographed, spoke, and wrote about them; and considered using them as sites for his unique brand of “anarchitectural” intervention into urban space. Matta-Clark died in 1978 at the age of thirty-five without realizing his plans for Fake Estates, and ownership of the properties reverted to the city. The archival material that he had assembled went into storage and was not rediscovered until the early 1990s, when it was assembled into exhibitable collages. Thus, Fake Estates has emerged not only as a mordant commentary on issues surrounding property, materiality, and disappearance that marked the whole of Matta-Clark’s career, but as artifacts of his own estate, reminders of the powers of absence and presence that govern our relationship to the past."
author = "Cabinet"
year_published = 2025
clearnet = "https://cabinetmagazine.org/exhibitions/oddlots.php"
