["https://cabinetmagazine.org/issues/69/white.php"]
title = "CABINET / Love Lines"
description = "A suggestion on some letters of the Yukaghir"
full_description = "The following letter came to me via its recipient. With their permission, and the permission of its author, I have reproduced it here. Dear [name redacted], I’m writing with a reference I think you might find useful, and because I have devoted some thought to its relevance re: your research into Joyce’s letters to his wife. (He really was a dirty man.) I hope this letter finds you well. It’s been a while. I know that you might be at work on an article, and it is my hope that this bit of research could be illuminating to that project. The reference I have in mind I first encountered in Waldemar Jochelson’s multi-part ethnography The Yukaghir and the Yukaghirized Tungus published between 1910 and 1926. Franz Boas commissioned the text in 1900 for the American Museum of Natural History. It concerns the people—previously thought to have disappeared—then living in the Kolyma River region of Siberia. Jochelson’s study is extensive, covering broadly the details of Yukaghir language, religion, song, material culture, social life, etc. One section in particular, though, stopped me, and I was reminded of you and your work. In his chapter on “Art and Pictographic Writing,” Jochelson discusses a set of images produced by the unmarried women of the Yukaghir culture. They were each collected, with one exception, in 1892 by Samuel Shargorodsky, a political exile and friend of Jochelson’s who three years later published what he learned of their meaning in the Russian journal Zemlevedeniye. Shargorodsky developed a close relationship with the Yukaghir he lived with, which was how he came to know of the young women’s images and their apparent meanings. Shargorodsky recorded the meaning of each image for his article, and Jochelson, in his own study, translated them into English. For ease, I rely primarily on Jochelson, who reproduced large portions of Shargorodsky’s writing, along with versions of Shargorodsky’s images. For a while, I struggled with how to describe these images to you—to find the right word. Ultimately, I settled on the same term Jochelson chose. Love letters. It made me think of you."
author = "David Allen White"
year_published = 2024
