["https://cabinetmagazine.org/issues/69/dukes.php"]
title = "CABINET / Sapiens?"
description = "The origins and obsolescence of an epithet"
full_description = "In his final years, Carl Linnaeus began to forget the names of things. He passed much of this time at his country home outside Uppsala, where even in the protracted hours of Swedish summers, he had a mind of winter, as if waking each day in a foreign room. Illness was a known foe. There had been toothaches since the womb, he sometimes claimed, and gout attacks for decades. The former he treated with a tobacco pipe, and found relief from podagra by eating wild strawberries, two liters a day. (It is said that Linnaeus and his acolytes consumed so much of the fruit that its price sextupled in their local market.)[1] Even his most severe crises were soothed by nature. After sustaining a stroke in the botanical gardens of Uppsala, a place he thought had no precedent outside of Eden’s gates, it was the sight of specimens from Suriname, preserved in aquavit, that made him miraculously new again. But the old cures worked no longer, and there were fresh degradations of the mind.[2] In a letter written the year before his death in 1778, he reported that “God has determined to break all the bonds that attach me to terrestrial objects.”[3] Styled by admirers as God’s registrar, the father of modern taxonomy now embarked on a final task: relinquishing the subtle world he’d catalogued across a lifetime. “Few reach this stage, but if they do, they often are like children again.”[4] As a child, Carl had once accompanied his father to a party on the Swedish lake Möckeln, whose winds were thought to gust when undines did their laundry. Here a pastor delighted guests by reciting the Latin words for local plants. Succisa, tormentilla, orchides: names fragrant and strange, a kind of botanical mass, which sounded to a contemporary like the “conjuration of hobgoblins.”[5] Revisiting this moment in his diaries, published in the third person, Linnaeus recalled how “from that hour [he] never ceased harassing his father with questions about the name, qualities, and nature of every plant he met.” But the child’s mind was not yet the storehouse its adult form would become: he used to rapidly forget what he had learned, “especially the names of plants.”[6] And his father refused to answer any further questions until his son committed known things to memory. This primal scene seemed to set ablaze a lifelong obsession with the retention of names. He was known to lecture students on how “if the name be lost, the knowledge of the object is lost also,” a sentiment repeated across many of his works.[7] And where there was nothing worth retaining, he created anew, baptizing more than ten thousand species with novel nominations. When not taxonomizing, he practiced medicine and published an early description of aphasia. This frightful strain of “forgetfulness” was spotted in a learned and gouty man from Uppsala, who “had forgotten all nouns.”[8] Linnaeus could not have foreseen, when writing these words at thirty-eight, that he was describing his future. Would it have been any salve to learn that some of his names will outlive us all?"
author = "Hunter Dukes"
year_published = 2024
