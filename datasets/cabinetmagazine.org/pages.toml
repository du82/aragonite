["https://cabinetmagazine.org/events/bancoult_naughton_vine_chagos.php"]
title = "CABINET / Presentation and Discussion / “Hijacking an Island: How America Stole a Nation,” with Louis Olivier Bancoult, Paula Naughton, and David Vine"
full_description = "Date: Monday, 20 April 2015, 7–9 pm Location: Cabinet, 300 Nevins Street, Brooklyn (map and directions here) FREE. No RSVP necessary Please join us for a presentation on and discussion of the history of the Chagos Islands, with Louis Olivier Bancoult, leader of the Chagos Refugees Group; David Vine, associate professor of anthropology at American University in Washington, DC, and author of Island of Shame; and Paula Naughton, creator of The New Atlantis, a multi-media documentary project chronicling the history of the islands. The New Atlantis project tells the story and plight of the people of the Chagos Islands—a small isolated archipelago in the middle of the Indian Ocean. In 1973, the population were forcibly evicted from their homeland by the British government to make way for a US naval base called Diego Garcia. The Chagossians have been living in abject poverty ever since and little record of their culture and existence has survived. They have remained steadfast, however, and are fighting political and legal obstacles to return to their homeland. The governments involved created a fiction that a permanent population had never existed, a claim made easier to uphold because photographic evidence to the contrary has now been dispersed, much like the Chagos community itself. The New Atlantis project maneuvers through this fiction in order to bear witness to the untold history. Taking testimonials from the displaced Chagossians as a starting point, the project uses archival material obtained from a variety of sources, such as photos from Flickr, retired US Navy Seabees, museums, individuals, and documents from Wikileaks. An entirely different mode of documentation is offered in the paintings of Chagossian artist Clement Siatous, whose visual summonings of his homeland are done entirely from memory. All of these merge together to form an achronological tale of a lost Atlantis. This evening’s discussion is timed to coincide with the visit of Louis Olivier Bancoult to the US in order to call on the Obama administration and the United Nations delegations to support Chagossians’ right to return and their claims for reparations and justice. Our discussion marks Bancoult’s visit, as well as the launch of the project website."
