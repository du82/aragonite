["https://cabinetmagazine.org/issues/2/index.php"]
title = "CABINET / Table of Contents 02"
description = """
How do you restore a giant Matthew Barney pound cake? Why will we be eating food with our noses soon? Where do you find the best clay to make fake pre-Columbian artifacts? What makes capitalists love Buddhism? Where do you find the recipe for the Brecht pastry? How do you make a radio-controlled chimpanzee?

