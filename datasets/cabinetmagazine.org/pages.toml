["https://cabinetmagazine.org/subscribe/faq.php"]
title = "CABINET / FAQ"
full_description = "I’ve moved, but I asked the post office to forward my mail. Why should I bother to change my address with you? I haven’t moved, but my copy of Cabinet was lost in the mail, so I’d like to have it re-sent, since it was the USPS’s fault. I’m inordinately curious, and I’d like to know how much re-sending an issue costs your organization. I live in a far-flung land. For subscription price purposes, I’m not sure where I fit in. Can you help? If I moved from the US to Prague / Auckland / Timbuktu in the middle of my subscription, can I receive my remaining issues at my new address? I want to find out if my friend subscribes already before I give him a gift subscription. Can you look this up for me? When can I expect the arrival of my order of an unlimited edition, T-shirt, tote bag, or other merchandise? An email that I expected from Cabinet never arrived / I didn’t receive an email confirmation for my online order. What happened? If I order merchandise (books, T-shirts, etc.) and I decide it’s not to my liking, can I return it? I’ve moved. How can I change my address? Simply email shop@cabinetmagazine.org with your new mailing address, and we will update our records. I’ve moved, but I asked the post office to forward my mail. Why should I bother to change my address with you? The simple act of changing your address will save you from dreadful delivery delays and losses, and will save us from the time-consuming task of problem-solving. Periodicals class mail—the category that we use for sending issues to subscribers—is wonderful and cheap but it does NOT include any forwarding services; this is true even if you ask the post office to forward your mail. The USPS regulations stipulate that it must toss out publications rather than forward them to you (sometimes publications slip through the regulations and end up at your new address, but this is, in fact, a USPS error). Sadly, your undeliverable issue ends up costing us extra money. What typically happens when an issue is sent to an outdated address is that the post office throws out your magazine (which costs us $6 to print) along with the envelope it came in ($1.25). They then send us a note saying that they shredded the issue (this note costs us 0.85 cents). Sometimes, the USPS goes against regulation and sends the magazine back to us, which incurs an additional $3.82 to our postal account. We are very grateful when subscribers update their address in a timely manner so that we can avoid these unnecessary losses."
