["https://cabinetmagazine.org/kiosk"]
title = "CABINET / Kiosk"
full_description = "At a party on Neckarstraße one hopeless weekend last January, I escaped into the twofold luxury of potent conversation and mild inebriation in the company of Klaus V--, one of the few people I recognized there. He was telling me about the political history of Transoxiana (birthplace of Timur, part of the Chaghatayid khanate, bounded by the Oxus and Jaxartes), which he recently conquered on horseback during fieldwork in Central Asia. I enjoy Klaus’s exhaustive style and had braced myself against our host’s kitchen island to better receive the torrent of proper nouns. It made me remember the past. … The Holocaust and the Nakba—the expulsion of Palestinians from historical Palestine, which has been ongoing since the end of 1947—are deeply intertwined. The Nakba is, among other things, a direct consequence of the Holocaust. Yet it is excluded from German collective memory, its relationship to German history only legible negatively in the representation of Israel as a safe haven for Jews. The nation’s once-lauded “memory culture” never links Israel’s self-conception as a Jewish state to the systematic expulsion and dispossession of Palestinians. The violence experienced by Palestinians must remain unspoken, taboo. When made visible, it becomes threatening—something that competes with the Holocaust and contaminates the German culture of remembrance. This is why the violence against Palestinians cannot be acknowledged as a continuation of European anti-Semitism. Doing so would force Germany—home to the largest Palestinian community in Europe—to confront the ongoing present of its history and to acknowledge that the nation’s moral rehabilitation is incomplete. … In our new series on fact-checking for Kiosk, “Cutting the Bean,” we feature short articles that showcase knowledge as a path toward marvel, that mount what Marina Warner describes as “a rescue operation of magic from the realm of irrationality,” and that celebrate Caillois’s “debacle of the evident.” We are all raised in boxes of a kind, and ferns lie waiting in the footnotes. …"
