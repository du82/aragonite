["https://cabinetmagazine.org/events/dion_williams.php"]
title = "CABINET / Exhibition / “An Ordinall of Alchimy”"
description = "Organized by Mark Dion and Robert Williams"
full_description = "Dates: 30 March–17 April 2010Location: Cabinet, 300 Nevins Street, Brooklyn, NY (map and directions here)Gallery hours: Tuesday to Saturday­, 12–6 pm, and by appointmentOpening reception: Saturday, 27 March, 7–9 pmPanel discussion with Mark Dion, Sal Randolph, McKenzie Wark, and Robert Williams: Saturday, 27 March, 6–7 pm “An Ordinall of Alchimy” is a Mildred’s Lane project organized by Mark Dion & Robert Williams, with Matt Bettine, Joey Cruz, Kathryn Cornelius, Gabriella D’Italia, Scott Jarrett, Aislinn Pentecost-Farren, John Wanzel, Laura E. Wertheim, and Bryan Wilson. The exhibition inaugurates “999,” an occasional series of exhibitions presented by Cabinet in which artists are invited to assemble work under a single constraint: everything installed in the gallery must have been acquired on Ebay for a total of less than $999. When the exhibition comes down, its contents are offered for sale as a single item, once again on Ebay. In 2009, Mark Dion, Robert Williams, and their students at the Pennsylvania artists’ colony Mildred’s Lane used Cabinet’s invitation as an opportunity to explore the theme of alchemical transformation. “An Ordinall of Alchimy” comprises the objects they assembled, a collection keyed to the seven basic processes of practical alchemy: Calcination, Fixation, Solution, Distillation, Sublimation, Separation, and Projection. In conjunction with the opening of the exhibition, Sal Randolph and McKenzie Wark will join Dion and Williams for a panel discussion titled “Spinning Straw into Gold—Art, Value, and the Alchemical Collector.” Generous support for this exhibition has been provided by Paul Singh. Gabriella D’Italia’s participation is funded in part by a grant from the Maine Arts Commission, an independent state agency supported by the National Endowment for the Arts. For a PDF of the press release for this exhibition, including a detailed listing of the items purchased on Ebay, click here. After a stay in Philadelphia at Slought Foundation, “An Ordinall of Alchimy” went up for auction on Ebay."
