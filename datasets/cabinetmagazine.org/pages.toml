["https://cabinetmagazine.org/events/exchange_lewitt.php"]
title = "CABINET / Exhibition / “An Exchange with Sol LeWitt”"
description = """
Curated by Regine Basha<br />
A two-part exhibition co-presented by MASS MoCA and Cabinet"""
full_description = "Cabinet: 21 January–5 March 2011Location: 300 Nevins Street, Brooklyn (directions here)Hours: Tuesday to Saturday­, 12–6 pmOpening reception: Thursday, January 20, 7–9 pm MASS MoCA: 23 January–31 March 2011 Location: 1040 MASS MoCA Way, North Adams, MA (directions here)Hours: 11 am–5 pm every day except TuesdayOpening reception: Saturday, January 22, 4:30–6:30 pm Although celebrated for the revolutionary role he played in the development of both Conceptualism and Minimalism, Sol LeWitt was also renowned for his exchanges of artwork with various artists throughout his lifetime. For LeWitt, the act of exchange seemed to be not only a personal gesture, but also an integral part of his conceptual practice. In addition to encouraging the circulation of artworks through a gift economy that challenged the art world’s dominant economic model, LeWitt’s exchanges with friends and strangers have the same qualities of generosity and risk that characterized his work in general. In the spirit of continuing the artist’s lifelong philosophy of open exchange, and in conjunction with the “LeWitt Wall Drawing Retrospective” on view at MASS MoCA through 2033, MASS MoCA and Cabinet present “An Exchange with Sol LeWitt,” curated by Regine Basha. The two-part exhibition will be on view at Cabinet from January 21 through March 5, 2011 and in MASS MoCA’s Prints and Drawings Gallery from January 23 through March 31, 2011. The works of art that LeWitt received throughout his life, as well as records of what he offered in return, are maintained by the Sol LeWitt Private Collection in Chester, Connecticut—Eva Hesse, Steve Reich, Robert Mangold, Hanne Darboven, and Robert Ryman are some of the distinguished artists whose works are included in the collection. LeWitt did not restrict this practice to established contemporaries and friends, but also consistently traded with admirers and amateur artists whom he did not know. Inspired by the artist’s code of conduct, Basha initiated an open call for images, objects, music, film, books, and ephemera. The response was overwhelming, with over one thousand submissions received from around the world. Featuring work in all media, as well as found objects and mementos, the exhibition will showcase contributions by artists such as Fia Backström, Daniel Bozhkov, Luis Camnitzer, Teresita Fernandez, Harrell Fletcher, Jenny Perlin, Paul Ramirez Jonas, Pedro Reyes, Steve Roden, and Anton Vidokle/Julieta Aranda, among hundreds of others."
