["https://cabinetmagazine.org/issues/68/pendle.php"]
title = "CABINET / Ingestion / Rising from the Bread"
description = "The great British loaf, ca. 1903"
full_description = "“Ingestion” is a column that explores food within a framework informed by aesthetics, history, and philosophy. In an early draft of Marcel Proust’s monumental À la recherche du temps perdu, the narrator is sent reeling back through his memories not by the delicate taste of a madeleine cake, but by the hearty crunch of hot buttered toast. Why did Proust choose to change his edible prompt to memory? The reason is not recorded, but perhaps it was because bread was just too obvious. “Bit on the nose, isn’t it, Marcel?” one can imagine his early readers remarking, sending a panicked Proust rushing to his local boulangerie to sniff out other baked goods. Éclair? Non! Macaron? Non! Madeleine? Un moment… Everyone feels something when they taste, or smell, bread. Usually these things are intensely positive. The ability of a yeasty whiff to conjure up feelings of home, comfort, and satiety marks bread as a powerful emotive stimulant. Psychologists have even suggested that the smell of bread makes us more prone to acts of altruism.[1] Such is bread’s ability to make us feel good that it’s now used against us as a Potemkin scent. Supermarkets pump the smell of bread into their overlit aisles to convince us to spend more time in them. Realtors put a loaf in the oven of houses they are trying to sell to impart an aura of coziness to their empty square feet. There is little we can do to stop bread marching down our olfactory bulb to the bottom of our brain and tugging on our better natures. As much as bread is curled around our memories and emotions, it also pervades the world around us. It’s in our language as the staff of life. It’s money or dough. It’s in metaphors (“breadwinner”), idioms (“best thing since sliced bread”), and everyday words like “companion” (com meaning “with,” panis meaning “bread”). In Arabic, the word aish means both bread and life. And unsurprisingly, bread is perched at the center of our politics. Marie-Antoinette didn’t actually say, “Let them eat cake”—what she actually said was “Qu’ils mangent de la brioche,” let them eat brioche—but regardless, she was making light of her poor subjects’ bread situation, something that has frequently led to conflagrations throughout history. Bread and riot go together like, well, bread and butter, and from ancient Rome to present-day Sudan, the rising price of bread has been a perpetual cause of revolution. Sometimes it seems as if all human existence can be found baked in alongside the flour and salt."
author = "George Pendle"
year_published = 2024
