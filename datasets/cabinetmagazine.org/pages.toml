["https://cabinetmagazine.org/kiosk/dukes_hunter_29_august_2024.php"]
title = "CABINET / Kojève & Cigarettes"
description = "Fact-checking American <span class="
full_description = "There is no existential, Kierkegaardian uniqueness in the individual cigarette, only an abstract Hegelian generality.[1]—Richard Klein At a party on Neckarstraße one hopeless weekend last January, I escaped into the twofold luxury of potent conversation and mild inebriation in the company of Klaus V--, one of the few people I recognized there. He was telling me about the political history of Transoxiana (birthplace of Timur, part of the Chaghatayid khanate, bounded by the Oxus and Jaxartes), which he recently conquered on horseback during fieldwork in Central Asia. I enjoy Klaus’s exhaustive style and had braced myself against our host’s kitchen island to better receive the torrent of proper nouns. It made me remember the past. Soon into our friendship, struck up on a graduate course in England, he confided how schoolyard adversaries would call him de omgevallen boekenkast—“the fallen-over bookcase,” an almost onomatopoeic phrase in his native tongue—due to a lifelong tendency to rain down knowledge. (In an attempt to make a learned joke, I once looked up the names of people possibly crushed to death by bookcases—the Basra-born polymath Abu ’Uthman ’Amr ibn Bahr ibn Mahbub al-Kinani al-Fuqaymi al-Basri al-Jahiz, the French virtuoso Charles-Valentin Alkan—but I never worked up the courage to tease, terrified that Klaus would generously ask my thoughts on Mu’tazilism, perpetuum mobile, or the topics of numerous other links pointing outward from these figures; he remains “Klausipedia” in certain circles.)[3] I thought it was all an act for a time, that he laid in a stock of repartee on unlikely subjects the evening before, but my awe for him crystalized some years later, when I first met his mother. She recounted a V-- family holiday where Klaus, having recently consumed a particularly verbose multivolume encyclopedia—his sole wish for Christmas at some preternatural age—identified dozens of birds in the nearby forest, based solely on remembered descriptions of their calls."
author = "Hunter Dukes"
year_published = 2024
