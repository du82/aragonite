["https://cabinetmagazine.org/books/shaw.php"]
title = "CABINET / The Moiré Effect"
description = "by Lytle Shaw"
full_description = "Softcover, 128 pages, 4.3 (w) × 7.1 (h) inchesBlack-and-white illustrations Cabinet Books & Bookhorse, 2012Support independent publishing: $12 directly from us; $10 for subscribers Ernst Moiré was a mysterious Swiss photographer whose career has been obscured by silence, documentary voids, and misinformation. So much of his life is shrouded in speculation and half-truths that he sometimes seems more like a phantasm than the flesh-and-blood figure who will forever be remembered as the inadvertent inventor of the blur that bears his name. In 2002, Cabinet magazine dispatched literary scholar and detective Lytle Shaw to Zurich to investigate the reclusive figure’s life and work. Shaw published his initial findings in Cabinet issue 7, but the puzzle of Moiré continued to vex him, and it is only now, a decade later, that the full story of his continuing investigation can finally be told. The Moiré Effect tracks the artist from his humble Alpine beginnings as the son of a postal clerk to his fateful founding of a Zurich photography studio in the 1890s and his subsequent role in the lives of a number of curious figures—including the legendary Dutch architect Mer Awsümbildungs, the theosophist philosopher Rudolph Steiner, and several members of the old and fiercely secretive Chadwick family. Hailed by Harry Mathews as a “complex” and “excitingly” written book bound to “delight” and “entertain,” Shaw’s thriller takes readers on a journey through the elegant salons of Swiss palazzi and the dusty bowels of ancient archives, finally ascending to a mountainous conclusion as hair-raising as it is bedevilingly oblique. About Lytle Shaw Lytle Shaw is a New York–based writer whose books include Cable Factory 20, The Lobe, Principles of the Emeryville Shellmound, and Frank O’Hara: The Poetics of Coterie. His art writing has appeared in Cabinet, Artforum, and Parkett and in catalogues for Dia Art Foundation, the Drawing Center, and the Reina Sofía. With Jimbo Blachly, Shaw oversees the Chadwick family archive, which has been exhibited widely and is represented by Winkleman Gallery in New York."
