["https://cabinetmagazine.org/information/submissions.php"]
title = "CABINET / Submissions Guidelines for “Cabinet” magazine and Kiosk"
full_description = "Submissions Policy We receive a large number of submissions, both for issues of Cabinet magazine and for the Kiosk section of our website. In order to be able to look at everything we get and not keep you hanging for months, our submission policy is (unfortunately) as follows: 2) We will contact you within 6 weeks of submission. If you have not heard from us within 6 weeks, assume that we were not able to use your submission. We do not mind it at all if you submit the piece to other publications at the same time. We wish we could have a more generous policy that showed our appreciation for your keeping us in mind but we are a tiny non-profit organization run largely on a volunteer basis and we really can’t do anything else. Thanks for your understanding. General Guidelines (see below for additional guidelines for writers and artists) We only accept electronic submissions sent to the address given at the very end of this page (this pertains to both texts and artist projects). Emails sent to other Cabinet addresses will not be processed. You must include the word “submission” in the subject line of your email so that it does not get eaten up by our spam filters. Please put your name(s), email address, phone number, as well as a very short biography on the first page of the text. Authors should feel free to include relevant images in tiff, gif, jpeg, or pdf format. Please do not send enormous pictures with your submission and limit the size of the submission to a maximum of 15 MB. Texts should be submitted as an attachment in Microsoft Word or a file format we can open with Microsoft Word. Please note that if your piece is accepted, all editorial work needs to be done in Microsoft Word and its Track Changes function. We do not publish poetry or fiction. Please see below for more guidelines for what is not a good fit for our pages. We do not accept texts previously published (in print or online) in English. We are, however, open to translations of texts that have never been published in English. We do not accept artist projects previously published in another magazine."
