["https://cabinetmagazine.org/books/papersculpture.php"]
title = "CABINET / The Paper Sculpture Book"
full_description = "The Paper Sculpture BookIntroduction by Mary Ceruti, Matt Freedman, and Sina Najafi Essay by Frances Richard Softcover, 160 pages, 9.65 (w) × 13.3 (h) inchesColor and black-and-white illustrations Cabinet Books, Independent Curators International & SculptureCenter, 2003 In 2003, Cabinet—in collaboration with SculptureCenter, NY, and Independent Curators International, NY—organized “The Paper Sculpture Show,” a traveling exhibit and book in which the viewer/reader was invited to assemble three-dimensional sculptures from flat pages designed by twenty-nine established and emerging contemporary artists. Each artist was given up to three pages with the instructions that assembly should require very basic materials such as tape and rubber bands. The exhibition—curated by Mary Ceruti, director of SculptureCenter; artist Matt Freedman; and Sina Najafi—opened at SculptureCenter on 7 September 2003 and subsequently traveled to nineteen additional venues. (See below for full list.) The Paper Sculpture Book is a self-contained art show featuring all twenty-nine of these sculptures and includes an introduction by the curators and an essay by Frances Richard. Drawing on cultural paradigms as diverse as paper doll books, Mad magazine “fold-ins,” and exploded schematic diagrams, the artists in “The Paper Sculpture Show” (and in its incarnation as a book) offer a visually stunning and conceptually rich hands-on exploration of the diversity of artistic practice today. The curators’ introduction adopts the open-ended and playful spirit of the project to address the complicated and often contradictory issues raised by an exhibition and art book in which the artists and visitors collaborate to make the works of art: Who are the true creators of these pieces? What is the role of the viewers/builders? Are the pieces in the show works of art or mere reproductions? Where do we locate failure or success in a project like this? Frances Richard’s essay provides a meditation on paper itself as a material particularly suited to the paradoxical nature of such a project. Ephemeral yet valuable, technologically simple yet conceptually rich, paper is uniquely able to absorb and preserve the imprints of the people—in this case, both artists and participating audience members—through whose hands it has passed."
