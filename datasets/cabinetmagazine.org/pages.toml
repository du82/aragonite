["https://cabinetmagazine.org/issues/68/bigert.php"]
title = "CABINET / Light Devoured"
description = "From surrogate kings to sun shields"
full_description = "When Tintin is captured by an ancient Inca tribe in his fourteenth adventure, Prisoners of the Sun, he finds an article on his cell floor that forecasts a coming solar eclipse. This will prove to be significant since he, Captain Haddock, and Professor Calculus are to be burned at the stake. Tintin manages to see to it that the execution is staged at the right moment. When the Inca Prince of the Sun orders the pyre to be lit, Tintin invokes the Sun God: “O God of the Sun, sublime Pachacamac, display thy power, I implore thee! … If this sacrifice is not thy will, hide thy shining face from us!” In this patronizing Occidental fable of mathematical calculation triumphing over traditional belief, the weather god gives way to the scientist, whose knowledge gives Tintin the power to produce an apparent miracle. The scientist who made such exact prognostications possible was the German astronomer Johannes Kepler. In 1600, he was hired as an assistant by the Danish astronomer Tycho Brahe and was given the painstaking task of analyzing observations of Mars made by Tycho and compiling them into a new set of astronomical tables. The aim was to improve on the Copernican tables published in 1543, the first to propose a heliocentric worldview with planets orbiting the sun in circular paths. But after nearly four years of work under miserable conditions—Kepler was constantly sick and suffered from double vision in one eye, among other things—he could not get Tycho’s calculations to add up. (Tycho himself had died in 1602.) He tried using the Copernican model but there were inexplicable discrepancies between that and real observations. Then, in 1604, having almost given up, he finally came to the idea that the planets might be moving not along circular but, rather, elliptical paths, and at varying speeds. The further away from the sun, the slower the speed. Kepler published his findings in 1609 in his Astronomia Nova (New Astronomy); his revolutionary “Rudolphine Tables,” named after the Holy Roman emperor who had commissioned the undertaking, appeared in 1627. These tables could be used to forecast the positions of the planets at any given moment some fifty times more accurately than had previously been the case, which in turn made it possible not only to forecast solar and lunar eclipses with minute precision but also to reconstruct such events in the past. Kepler’s discovery meant that the date of any event whose historical record connected it to a celestial event could now be calculated with unprecedented exactitude."
author = "Mats Bigert"
year_published = 2024
