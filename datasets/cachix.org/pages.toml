["https://cachix.org"]
title = "Cachix - Nix binary cache hosting"
description = "Cachix - Nix Binary Cache hosting infrastructure"
full_description = "Never build software twice. Leverage the Nix ecosystem to share binaries between CI, development and deployment environments. Get started Schedule a call Trusted by many businesses Share binaries between all environments Cachix provides a few different ways to share binaries: $ cachix push mycache $ cachix watch-store mycache $ cachix watch-exec mycache nix-build Learn more. Use your binaries seamlessly Run $ cachix use mycache to configure Nix and you're all set! Use auth tokens to protect read access to your binary cache: $ cachix authtoken AUTH-TOKEN. Build faster Everything you need to share binaries. Set up your Nix infrastructure in a few minutes and avoid maintenance work. Garbage Collection To prevent your cache from growing indefinitely, least recently used entries are collected once you reach your storage limit. Access Management Grant your team members write and/or read access to a cache. Allows revoking the token at any time. Continuous Integration Guides Learn how to integrate Cachix with your favorite CI to start sharing binaries. Fast Comes with a number of optimizations to speed up binary cache roundtrips. Deduplication To save space, entries from cache.nixos.org are not stored in your cache. Content Delivery Network Cloudflare CDN enables performance and unlimited bandwidth on all plans. Widely used by the Nix community From Open Source projects to established businesses. Developers 9187 Transferred last month 293 TB Binary Caches 6215 Ready to get started? Get in touch or create an account. Schedule a call Get started"
year_published = 2025
