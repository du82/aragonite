["https://cad-journal.net/about.html"]
title = "CAD Journal | About the Journal"
description = "Computer-Aided Design and Applications is an international journal on the applications of CAD and CAM. It publishes papers in the general domain of CAD plus in emerging fields like bio-CAD, nano-CAD, soft-CAD, garment-CAD, PLM, PDM, CAD data mining, CAD and the internet, CAD education, genetic algorithms and CAD engines. The journal is aimed at all developers and users of CAD technology to ptovide CAD solutions for various stages of design and manufacturing. The journal publishes all about Computer-Aided Design and Computer-Aided technologies."
full_description = "Computer-Aided Design and Applications is a world-leading journal in the field of CAD, publishing papers in both traditional areas as well as in new and emerging fields of the discipline, including theoretical papers but with special focus on the applied. The journal welcomes technical papers on new technologies and their implications; application papers on applications of existing techniques; survey papers on the state-of-the art in a particular sub-domain; review papers on current events/developments; and product demonstrations to keep readers up to date on important new products. All manuscript submissions are subject to initial appraisal by the Editor-in-Chief, and, if found suitable for further consideration, to rigorous peer review by independent, anonymous expert referees. All peer review is double blind. Computer-Aided Design and Applications is aimed at researchers, academics, developers, technical and business managers, as well as members of relevant government sectors working in or responsible for the general area of CAD/CAM. Disciplines represented include various forms of engineering; industrial design and general manufacturing; many disciplines of science, e.g. mathematics, computer science and psychology; arts and creative design; bio-medical areas; CAD/CAM enterprises dealing with large scale product management, multi-national consulting and system building."
