["https://caddyserver.com/docs/caddyfile/matchers"]
title = "Request matchers (Caddyfile) — Caddy Documentation"
description = "Caddy is a powerful, enterprise-ready, open source web server with automatic HTTPS written in Go"
full_description = '''window.$(function() { // We'll add links on the matchers in the code blocks // to their associated anchor tags. let headers = $('article h3').map((i, el) => el.id.replace(/-/g, "_")).toArray(); window.$('pre.chroma .k') .filter((k, item) => headers.includes(item.innerText)) .map(function(k, item) { let text = item.innerText.replace(/</g,'&lt;').replace(/>/g,'&gt;'); let url = '#' + item.innerText.replace(/_/g, "-"); window.$(item).html(`<a href="${url}" style="color: inherit;" title="${text}">${text}</a>`); }); // Link matcher tokens based on their contents to the syntax section window.$('pre.chroma .nd') .map(function(k, item) { let text = item.innerText.replace(/</g,'&lt;').replace(/>/g,'&gt;'); let anchor = "named-matchers" if (text == "*") anchor = "wildcard-matchers" if (text.startsWith('/')) anchor = "path-matchers" window.$(item).html(`<a href="#${anchor}" style="color: inherit;" title="Matcher token">${text}</a>`); }); }); Request Matchers Request matchers can be used to filter (or classify) requests by various criteria. Syntax Examples Wildcard matchers Path matchers Named matchers Standard matchers client_ip expression file header header_regexp host method not path path_regexp protocol query remote_ip vars vars_regexp Syntax In the Caddyfile, a matcher token immediately following the directive can limit that directive's scope. The matcher token can be one of these forms: * to match all requests (wildcard; default). /path start with a forward slash to match a request path. @name to specify a named matcher. If a directive supports matchers, it will appear as [<matcher>] in its syntax documentation. Matcher tokens are usually optional, denoted by [ ]. If the matcher token is omitted, it is the same as a wildcard matcher (*). Examples This directive applies to all HTTP requests: reverse_proxy localhost:9000 And this is the same (* is unnecessary here): reverse_proxy * localhost:9000 But this directive applies only to requests having a path starting with /api/: reverse_proxy /api/* localhost:9000 To match on anything other than a path, define a named matcher and refer to it using @name: @postfoo { method POST path /foo/* } reverse_proxy @postfoo localhost:9000 Wildcard matchers The wildcard (or "catch-all") matcher * matches all requests, and is only needed if a matcher token is required. For example, if the first argument you want to give a directive also happens to be a path, it would look exactly like a path matcher! So you can use a wildcard matcher to disambiguate, for example: root * /home/www/mysite Otherwise, this matcher is not often used. We generally recommend omitting it if syntax doesn't require it. Path matchers Matching by URI path is the most common way to match requests, so the matcher can be inlined, like this: redir /old.html /new.html Path matcher tokens must start with a forward slash /. Path matching is an exact match by default, not a prefix match. You must append a * for a fast prefix match. Note that /foo* will match /foo and /foo/ as well as /foobar; you might actually want /foo/* instead. Named matchers All matchers that are not path or wildcard matchers must be named matchers. This is a matcher that is defined outside of any particular directive, and can be reused. Defining a matcher with a unique name gives you more flexibility, allowing you to combine any available matchers into a set: @name { ... } or, if there is only one matcher in the set, you can put it on the same line: @name ... Then you can use the matcher like so, by specifying it as the first argument to a directive: directive @name For example, this proxies websocket requests to localhost:6001, and other requests to localhost:8080. It matches requests that have a header field named Connection containing Upgrade, and another field named Upgrade with exactly websocket: example.com { @websockets { header Connection *Upgrade* header Upgrade websocket } reverse_proxy @websockets localhost:6001 reverse_proxy localhost:8080 } If the matcher set consists of only one matcher, a one-liner syntax also works: @post method POST reverse_proxy @post localhost:6001 As a special case, the expression matcher may be used without specifying its name as long as one quoted argument (the CEL expression itself) follows the matcher name: @not-found `{err.status_code} == 404` Like directives, named matcher definitions must go inside the site blocks that use them. A named matcher definition constitutes a matcher set. Matchers in a set are AND'ed together; i.e. all must match. For example, if you have both a header and path matcher in the set, both must match. Multiple matchers of the same type may be merged (e.g. multiple path matchers in the same set) using boolean algebra (AND/OR), as described in their respective sections below. For more complex boolean matching logic, it's recommended to the expression matcher to write a CEL expression, which supports and &&, or ||, and parentheses ( ). Standard matchers Full matcher documentation can be found in each respective matcher module's docs. Requests can be matched the following ways: client_ip client_ip <ranges...> expression client_ip('<ranges...>') By the client IP address. Accepts exact IPs or CIDR ranges. IPv6 zones are supported. This matcher is best used when the trusted_proxies global option is configured, otherwise it acts identically to the remote_ip matcher. Only requests from trusted proxies will have their client IP parsed at the start of the request; untrusted requests will use the remote IP address of the immediate peer. As a shortcut, private_ranges can be used to match all private IPv4 and IPv6 ranges. It's the same as specifying all of these ranges: 192.168.0.0/16 172.16.0.0/12 10.0.0.0/8 127.0.0.1/8 fd00::/8 ::1 There can be multiple client_ip matchers per named matcher, and their ranges will be merged and OR'ed together. Example: Match requests from private IPv4 addresses: @private-ipv4 client_ip 192.168.0.0/16 172.16.0.0/12 10.0.0.0/8 127.0.0.1/8 This matcher is commonly paired with the not matcher to invert the match. For example, to abort all connections from public IPv4 and IPv6 addresses (which is the inverse of all private ranges): example.com { @denied not client_ip private_ranges abort @denied respond "Hello, you must be from a private network!" } In a CEL expression, it would look like this: @my-friends `client_ip('12.23.34.45', '23.34.45.56')` expression expression <cel...> By any CEL (Common Expression Language) expression that returns true or false. Caddy placeholders (or Caddyfile shorthands) may be used in these CEL expressions, as they are preprocessed and converted to regular CEL function calls before being interpreted by the CEL environment. Most other request matchers can also be used in expressions as functions, which allows for more flexibility for boolean logic than outside expressions. See the documentation for each matcher for the supported syntax within CEL expressions. For convenience, the matcher name may be omitted if defining a named matcher that consists solely of a CEL expression. The CEL expression must be quoted (backticks or heredocs recommended). This reads quite nicely: @mutable `{method}.startsWith("P")` In this case the CEL matcher is assumed. Examples: Match requests whose methods start with P, e.g. PUT or POST: @methods expression {method}.startsWith("P") Match requests where handler returned error status code 404, would be used in conjunction with the handle_errors directive: @404 expression {err.status_code} == 404 Match requests where the path matches one of two different regular expressions; this is only possible to write using an expression, because the path_regexp matcher can normally only exist once per named matcher: @user expression path_regexp('^/user/(\w*)') || path_regexp('^/(\w*)') Or the same, omitting the matcher name, and wrapping in backticks so it's parsed as a single token: @user `path_regexp('^/user/(\w*)') || path_regexp('^/(\w*)')` You may use heredoc syntax to write multi-line CEL expressions: @api <<CEL {method} == "GET" && {path}.startsWith("/api/") CEL respond @api "Hello, API!" file file { root <path> try_files <files...> try_policy first_exist|smallest_size|largest_size|most_recently_modified split_path <delims...> } file <files...> expression `file({ 'root': '<path>', 'try_files': ['<files...>'], 'try_policy': 'first_exist|smallest_size|largest_size|most_recently_modified', 'split_path': ['<delims...>'] })` expression file('<files...>') By files. root defines the directory in which to look for files. Default is the current working directory, or the root variable ({http.vars.root}) if set (can be set via the root directive). try_files checks files in its list that match the try_policy. To match directories, append a trailing forward slash / to the path. All file paths are relative to the site root, and glob patterns will be expanded. If the try_policy is first_exist (the default), then the last item in the list may be a number prefixed by = (e.g. =404), which as a fallback, will emit an error with that code; the error can be caught and handled with handle_errors. try_policy specifies how to choose a file. Default is first_exist. first_exist checks for file existence. The first file that exists is selected. smallest_size chooses the file with the smallest size. largest_size chooses the file with the largest size. most_recently_modified chooses the file that was most recently modified. split_path will cause the path to be split at the first delimiter in the list that is found in each filepath to try. For each split value, the left-hand side of the split including the delimiter itself will be the filepath that is tried. For example, /remote.php/dav/ using a delimiter of .php would try the file /remote.php. Each delimiter must appear at the end of a URI path component in order to be used as a split delimiter. This is a niche setting and is mostly used when serving PHP sites. Because try_files with a policy of first_exist is so common, there is a one-line shortcut for that: file <files...> An empty file matcher (one with no files listed after it) will see if the requested file—verbatim from the URI, relative to the site root—exists. This is effectively the same as file {path}. Since rewriting based on the existence of a file on disk is so common, there is also a try_files directive which is a shortcut of the file matcher and a rewrite handler. Upon matching, four new placeholders will be made available: {file_match.relative} The root-relative path of the file. This is often useful when rewriting requests. {file_match.absolute} The absolute path of the matched file, including the root. {file_match.type} The type of file, file or directory. {file_match.remainder} The portion remaining after splitting the file path (if split_path is configured) Examples: Match requests where the path is a file that exists: @file file Match requests where the path followed by .html is a file that exists, or if not, where the path is a file that exists: @html file { try_files {path}.html {path} } Same as above, except using the one-line shortcut, and falling back to emitting a 404 error if a file is not found: @html-or-error file {path}.html {path} =404 Some more examples using CEL expressions. Keep in mind that placeholders are preprocessed and converted to regular CEL function calls before being interpreted by the CEL environment, so concatenation is used here. Additionally, the long-form must be used if concatenating with placeholders due to current parsing limitations: @file `file()` @first `file({'try_files': [{path}, {path} + '/', 'index.html']})` @smallest `file({'try_policy': 'smallest_size', 'try_files': ['a.txt', 'b.txt']})` header header <field> [<value> ...] expression header({'<field>': '<value>'}) By request header fields. <field> is the name of the HTTP header field to check. If prefixed with !, the field must not exist to match (omit value arg). <value> is the value the field must have to match. One or more may be specified. If prefixed with *, it performs a fast suffix match (appears at the end). If suffixed with *, it performs a fast prefix match (appears at the start). If enclosed by *, it performs a fast substring match (appears anywhere). Otherwise, it is a fast exact match. Different header fields within the same set are AND-ed. Multiple values per field are OR'ed. Note that header fields may be repeated and have different values. Backend applications MUST consider that header field values are arrays, not singular values, and Caddy does not interpret meaning in such quandaries. Example: Match requests with the Connection header containing Upgrade: @upgrade header Connection *Upgrade* Match requests with the Foo header containing bar OR baz: @foo { header Foo bar header Foo baz } Match requests that do not have the Foo header field at all: @not_foo header !Foo Using an CEL expression, match WebSocket requests by checking for the Connection header containing Upgrade and the Upgrade header equalling websocket: @websockets `header({'Connection':'*Upgrade*','Upgrade':'websocket'})` header_regexp header_regexp [<name>] <field> <regexp> expression header_regexp('<name>', '<field>', '<regexp>') expression header_regexp('<field>', '<regexp>') Like header, but supports regular expressions. The regular expression language used is RE2, included in Go. See the RE2 syntax reference and the Go regexp syntax overview. As of v2.8.0, if name is not provided, the name will be taken from the named matcher's name. For example a named matcher @foo will cause this matcher to be named foo. The main advantage of specifying a name is if more than one regexp matcher (e.g. header_regexp and path_regexp, or multiple different header fields) is used in the same named matcher. Capture groups can be accessed via placeholder in directives after matching: {re.<name>.<capture_group>} where: <name> is the name of the regular expression, <capture_group> is either the name or number of the capture group in the expression. {re.<capture_group>} without a name, is also populated for convenience. The caveat is that if multiple regexp matchers are used in sequence, then the placeholder values will be overwritten by the next matcher. Capture group 0 is the full regexp match, 1 is the first capture group, 2 is the second capture group, and so on. So {re.foo.1} or {re.1} will both hold the value of the first capture group. Only one regular expression is supported per header field, since regexp patterns cannot be merged; if you need more, consider using an expression matcher. Matches against multiple different header fields will be AND'ed. Example: Match requests where the Cookie header contains login_ followed by a hex string, with a capture group that can be accessed with {re.login.1} or {re.1}. @login header_regexp login Cookie login_([a-f0-9]+) This can be simplified by omitting the name, which will be inferred from the named matcher: @login header_regexp C'''
