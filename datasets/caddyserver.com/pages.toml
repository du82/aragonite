["https://caddyserver.com/docs/automatic-https"]
title = "Automatic HTTPS — Caddy Documentation"
description = "Caddy is a powerful, enterprise-ready, open source web server with automatic HTTPS written in Go"
full_description = '''Automatic HTTPS Caddy is the first and only web server to use HTTPS automatically and by default. Automatic HTTPS provisions TLS certificates for all your sites and keeps them renewed. It also redirects HTTP to HTTPS for you! Caddy uses safe and modern defaults -- no downtime, extra configuration, or separate tooling is required. Caddy innovated automatic HTTPS technology; we've been doing this since the first day it was feasible in 2015. Caddy's HTTPS automation logic is the most mature and robust in the world. Here's a 28-second video showing how it works: Menu: Overview Activation Effects Hostname requirements Local HTTPS Testing ACME Challenges On-Demand TLS Errors Storage Wildcard certificates Overview By default, Caddy serves all sites over HTTPS. Caddy serves IP addresses and local/internal hostnames over HTTPS using self-signed certificates that are automatically trusted locally (if permitted). Examples: localhost, 127.0.0.1 Caddy serves public DNS names over HTTPS using certificates from a public ACME CA such as Let's Encrypt or ZeroSSL . Examples: example.com, sub.example.com, *.example.com Caddy keeps all managed certificates renewed and redirects HTTP (default port 80) to HTTPS (default port 443) automatically. For local HTTPS: Caddy may prompt for a password to install its unique root certificate into your trust store. This happens only once per root; and you can remove it at any time. Any client accessing the site without trusting Caddy's root CA certificate will show security errors. For public domain names: These are common requirements for any basic production website, not just Caddy. The main difference is to set your DNS records properly before running Caddy so it can provision certificates. If your domain's A/AAAA records point to your server, ports 80 and 443 are open externally, Caddy can bind to those ports (or those ports are forwarded to Caddy), your data directory is writeable and persistent, and your domain name appears somewhere relevant in the config, then sites will be served over HTTPS automatically. You won't have to do anything else about it. It just works! Because HTTPS utilizes a shared, public infrastructure, you as the server admin should understand the rest of the information on this page so that you can avoid unnecessary problems, troubleshoot them when they occur, and properly configure advanced deployments. Activation Caddy implicitly activates automatic HTTPS when it knows a domain name (i.e. hostname) or IP address it is serving. There are various ways to tell Caddy your domain/IP, depending on how you run or configure Caddy: A site address in the Caddyfile A host matcher at the top-level in the JSON routes Command line flags like --domain or --from The automate certificate loader Any of the following will prevent automatic HTTPS from being activated, either in whole or in part: Explicitly disabling it via JSON or via Caddyfile Not providing any hostnames or IP addresses in the config Listening exclusively on the HTTP port Prefixing the site address with http:// in the Caddyfile Manually loading certificates (unless ignore_loaded_certificates is set) Special cases: Domains ending in .ts.net will not be managed by Caddy. Instead, Caddy will automatically attempt to get these certificates at handshake-time from the locally-running Tailscale instance. This requires that HTTPS is enabled in your Tailscale account and the Caddy process must either be running as root, or you must configure tailscaled to give your Caddy user permission to fetch certificates. Effects When automatic HTTPS is activated, the following occurs: Certificates are obtained and renewed for all qualifying domain names HTTP is redirected to HTTPS (this uses HTTP port 80) Automatic HTTPS never overrides explicit configuration, it only augments it. If you already have a server listening on the HTTP port, the HTTP->HTTPS redirect routes will be inserted after your routes with a host matcher, but before a user-defined catch-all route. You can customize or disable automatic HTTPS if necessary; for example, you can skip certain domain names or disable redirects (for Caddyfile, do this with global options). Hostname requirements All hostnames (domain names) qualify for fully-managed certificates if they: are non-empty consist only of alphanumerics, hyphens, dots, and wildcard (*) do not start or end with a dot (RFC 1034) In addition, hostnames qualify for publicly-trusted certificates if they: are not localhost (including .localhost, .local and .home.arpa TLDs) are not an IP address have only a single wildcard * as the left-most label Local HTTPS Caddy uses HTTPS automatically for all sites with a host (domain, IP, or hostname) specified, including internal and local hosts. Some hosts are either not public (e.g. 127.0.0.1, localhost) or do not generally qualify for publicly-trusted certificates (e.g. IP addresses -- you can get certificates for them, but only from some CAs). These are still served over HTTPS unless disabled. To serve non-public sites over HTTPS, Caddy generates its own certificate authority (CA) and uses it to sign certificates. The trust chain consists of a root and intermediate certificate. Leaf certificates are signed by the intermediate. They are stored in Caddy's data directory at pki/authorities/local. Caddy's local CA is powered by Smallstep libraries . Local HTTPS does not use ACME nor does it perform any DNS validation. It works only on the local machine and is trusted only where the CA's root certificate is installed. CA Root The root's private key is uniquely generated using a cryptographically-secure pseudorandom source and persisted to storage with limited permissions. It is loaded into memory only to perform signing tasks, after which it leaves scope to be garbage-collected. Although Caddy can be configured to sign with the root directly (to support non-compliant clients), this is disabled by default, and the root key is only used to sign intermediates. The first time a root key is used, Caddy will try to install it into the system's local trust store(s). If it does not have permission to do so, it will prompt for a password. This behavior can be disabled in the configuration if it is not desired. If this fails due to being run as an unprivileged user, you may run caddy trust to retry installation as a privileged user. It is safe to trust Caddy's root certificate on your own machine as long as your computer is not compromised and your unique root key is not leaked. After Caddy's root CA is installed, you will see it in your local trust store as "Caddy Local Authority" (unless you've configured a different name). You can uninstall it any time if you wish (the caddy untrust command makes this easy). Note that automatically installing the certificate into the local trust stores is for convenience only and isn't guaranteed to work, especially if containers are being used or if Caddy is being run as an unprivileged system service. Ultimately, if you are relying on internal PKI, it is the system administrator's responsibility to ensure Caddy's root CA is properly added to the necessary trust stores (this is outside the scope of the web server). CA Intermediates An intermediate certificate and key will also be generated, which will be used for signing leaf (individual site) certificates. Unlike the root certificate, intermediate certificates have a much shorter lifetime and will automatically be renewed as needed. Testing To test or experiment with your Caddy configuration, make sure you change the ACME endpoint to a staging or development URL, otherwise you are likely to hit rate limits which can block your access to HTTPS for up to a week, depending on which rate limit you hit. One of Caddy's default CAs is Let's Encrypt , which has a staging endpoint that is not subject to the same rate limits : https://acme-staging-v02.api.letsencrypt.org/directory ACME challenges Obtaining a publicly-trusted TLS certificate requires validation from a publicly-trusted, third-party authority. These days, this validation process is automated with the ACME protocol , and can be performed one of three ways ("challenge types"), described below. The first two challenge types are enabled by default. If multiple challenges are enabled, Caddy chooses one at random to avoid accidental dependence on a particular challenge. Over time, it learns which challenge type is most successful and will begin to prefer it first, but will fall back to other available challenge types if necessary. HTTP challenge The HTTP challenge performs an authoritative DNS lookup for the candidate hostname's A/AAAA record, then requests a temporary cryptographic resource over port 80 using HTTP. If the CA sees the expected resource, a certificate is issued. This challenge requires port 80 to be externally accessible. If Caddy cannot listen on port 80, packets from port 80 must be forwarded to Caddy's HTTP port. This challenge is enabled by default and does not require explicit configuration. TLS-ALPN challenge The TLS-ALPN challenge performs an authoritative DNS lookup for the candidate hostname's A/AAAA record, then requests a temporary cryptographic resource over port 443 using a TLS handshake containing special ServerName and ALPN values. If the CA sees the expected resource, a certificate is issued. This challenge requires port 443 to be externally accessible. If Caddy cannot listen on port 443, packets from port 443 must be forwarded to Caddy's HTTPS port. This challenge is enabled by default and does not require explicit configuration. DNS challenge The DNS challenge performs an authoritative DNS lookup for the candidate hostname's TXT records, and looks for a special TXT record with a certain value. If the CA sees the expected value, a certificate is issued. This challenge does not require any open ports, and the server requesting a certificate does not need to be externally accessible. However, the DNS challenge requires configuration. Caddy needs to know the credentials to access your domain's DNS provider so it can set (and clear) the special TXT records. If the DNS challenge is enabled, other challenges are disabled by default. Since ACME CAs follow DNS standards when looking up TXT records for challenge verification, you can use CNAME records to delegate answering the challenge to other DNS zones. This can be used to delegate the _acme-challenge subdomain to another zone. This is particularly useful if your DNS provider doesn't provide an API, or isn't supported by one of the DNS plugins for Caddy. DNS provider support is a community effort. Learn how to enable the DNS challenge for your provider at our wiki. On-Demand TLS Caddy pioneered a new technology we call On-Demand TLS, which dynamically obtains a new certificate during the first TLS handshake that requires it, rather than at config load. Crucially, this does not require hard-coding the domain names in your configuration ahead of time. Many businesses rely on this unique feature to scale their TLS deployments at lower cost and without operational headaches when serving tens of thousands of sites. On-demand TLS is useful if: you do not know all the domain names when you start or reload your server, domain names might not be properly configured right away (DNS records not yet set), you are not in control of the domain names (e.g. they are customer domains). When on-demand TLS is enabled, you do not need to specify the domain names in your config in order to get certificates for them. Instead, when a TLS handshake is received for a server name (SNI) that Caddy does not yet have a certificate for, the handshake is held while Caddy obtains a certificate to use to complete the handshake. The delay is usually only a few seconds, and only that initial handshake is slow. All future handshakes are fast because certificates are cached and reused, and renewals happen in the background. Future handshakes may trigger maintenance for the certificate to keep it renewed, but this maintenance happens in the background if the certificate hasn't expired yet. Using On-Demand TLS On-demand TLS must be both enabled and restricted to prevent abuse. Enabling on-demand TLS happens in TLS automation policies if using the JSON config, or in site blocks with the tls directive if using the Caddyfile. To prevent abuse of this feature, you must configure restrictions. This is done in the automation object of the JSON config, or the on_demand_tls global option of the Caddyfile. Restrictions are "global" and aren't configurable per-site or per-domain. The primary restriction is an "ask" endpoint to which Caddy will send an HTTP request to ask if it has permission to obtain and manage a certificate for the domain in the handshake. This means you will need some internal backend that can, for example, query the accounts table of your database and see if a customer has signed up with that domain name. Be mindful of how quickly your CA is able to issue certificates. If it takes more than a few seconds, this will negatively impact the user experience (for the first client only). Due to its deferred nature and the extra configuration required to prevent abuse, we recommend enabling on-demand TLS only when your actual use case is described above. See our wiki article for more information about using on-demand TLS effectively. Errors Caddy does its best to continue if errors occur with certificate management. By default, certificate management is performed in the background. This means it will not block startup or slow down your sites. However, it also means that the server will be running even before all certificates are available. Running in the background allows Caddy to retry with exponential backoff over a long period of time. Here's what happens if there's an error obtaining or renewing a certificate: Caddy retries once after a brief pause just in case it was a fluke Caddy pauses briefly, then switches to the next enabled challenge type After all enabled challenge types have been tried, it tries the next configured issuer Let's Encrypt ZeroSSL After all issuers have been tried, it backs off exponentially Maximum of 1 day between attempts For up to 30 days During retries with Let's Encrypt, Caddy switches to their staging environment to avoid rate limit concerns. This isn't a perfect strategy, but in general it's helpful. ACME challenges take at least a few seconds, and internal rate limiting helps mitigate accidental abuse. Caddy uses internal rate limiting in addition to what you or the CA configure so that you can hand Caddy a platter with a million domain names and it will gradually -- but as fast as it can -- obtain certificates for all of them. Caddy's internal rate limit is currently 10 attempts per ACME account per 10 seconds. To avoid leaking resources, Caddy aborts in-flight tasks (including ACME transactions) when config is changed. While Caddy is capable of handling frequent config reloads, be'''
author = "Caddy Web Server"
year_published = 2025
clearnet = "https://caddyserver.com/docs/automatic-https"
