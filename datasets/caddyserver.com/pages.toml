["https://caddyserver.com/docs/caddyfile/response-matchers"]
title = "Response matchers (Caddyfile) — Caddy Documentation"
description = "Caddy is a powerful, enterprise-ready, open source web server with automatic HTTPS written in Go"
full_description = '''window.$(function() { // Response matchers window.$('pre.chroma .nd:contains("@")') .map(function(k, item) { let text = item.innerText.replace(/</g,'&lt;').replace(/>/g,'&gt;'); let url = '#' + item.innerText.replace(/_/g, "-"); window.$(item).addClass('nd').removeClass('k') window.$(item).html(`<a href="#syntax" style="color: inherit;">${text}</a>`); }); window.$('pre.chroma .k:contains("status")') .html('<a href="#status" style="color: inherit;">status</a>'); window.$('pre.chroma .k:contains("header")') .html('<a href="#header" style="color: inherit;">header</a>'); // We'll add links to all the subdirectives if a matching anchor tag is found on the page. addLinksToSubdirectives(); }); Response Matchers Response matchers can be used to filter (or classify) responses by specific criteria. These typically only appear as config inside of certain other directives, to make decisions on the response as it's being written out to the client. Syntax Matchers status header Syntax @name { status <code...> header <field> [<value>] } Matchers status status <code...> By HTTP status code. <code...> is a list of HTTP status codes. Special cases are strings like 2xx and 3xx, which match against all status codes in the range of 200-299 and 300-399, respectively. Example: @success status 2xx header header <field> [<value>] By response header fields. <field> is the name of the HTTP header field to check. If prefixed with !, the field must not exist to match (omit value arg). <value> is the value the field must have to match. If prefixed with *, it performs a fast suffix match (appears at the end). If suffixed with *, it performs a fast prefix match (appears at the start). If enclosed by *, it performs a fast substring match (appears anywhere). Otherwise, it is a fast exact match. Different header fields within the same set are AND-ed. Multiple values per field are OR'ed. Note that header fields may be repeated and have different values. Backend applications MUST consider that header field values are arrays, not singular values, and Caddy does not interpret meaning in such quandaries. Example: Match responses with the Foo header containing the value bar: @upgrade header Foo *bar* Match responses with the Foo header having the value bar OR baz: @foo { header Foo bar header Foo baz } Match responses that do not have the Foo header field at all: @not_foo header !Foo'''
