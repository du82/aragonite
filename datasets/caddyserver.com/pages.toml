["https://caddyserver.com/docs/command-line"]
title = "Command Line — Caddy Documentation"
description = "Caddy is a powerful, enterprise-ready, open source web server with automatic HTTPS written in Go"
full_description = '''Command Line Caddy has a standard unix-like command line interface. Basic usage is: caddy <command> [<args...>] The <carets> indicate parameters that get replaced by your input. The[brackets] indicate optional parameters. The (brackets) indicate required parameters. The ellipses ... indicates a continuation, i.e. one or more parameters. The --flags may have a single-letter shortcut like -f. Quick start: caddy, caddy help, or man caddy (if installed) caddy adapt Adapts a config document to native JSON caddy build-info Prints build information caddy completion Generate shell completion script caddy environ Prints the environment caddy file-server A simple but production-ready file server caddy file-server export-template Auxiliary command for the file server to export the default file browser template caddy fmt Formats a Caddyfile caddy hash-password Hashes a password and outputs base64 caddy help View help for caddy commands caddy list-modules Lists the installed Caddy modules caddy manpage Generate manpages caddy reload Changes the config of the running Caddy process caddy respond A quick-and-clean, hard-coded HTTP server for development and testing caddy reverse-proxy A simple but production-ready HTTP(S) reverse proxy caddy run Starts the Caddy process in the foreground caddy start Starts the Caddy process in the background caddy stop Stops the running Caddy process caddy storage export Exports the contents of the configured storage to a tarball caddy storage import Imports a previously exported tarball to the configured storage caddy trust Installs a certificate into local trust store(s) caddy untrust Untrusts a certificate from local trust store(s) caddy upgrade Upgrades Caddy to the latest release caddy add-package Upgrades Caddy to the latest release, with additional plugins added caddy remove-package Upgrades Caddy to the latest release, with some plugins removed caddy validate Tests whether a config file is valid caddy version Prints the version Signals How Caddy handles signals Exit codes Emitted when the Caddy process exits Subcommands caddy adapt caddy adapt [-c, --config <path>] [-a, --adapter <name>] [-p, --pretty] [--validate] Adapts a configuration to Caddy's native JSON config structure and writes the output to stdout, along with any warnings to stderr, then exits. --config is the path to the config file. If omitted, assumes Caddyfile in current directory if it exists; otherwise, this flag is required. --adapter specifies the config adapter to use; default is caddyfile. --pretty will format the output with indentation for human readability. --validate will load and provision the adapted configuration to check for validity (but it will not actually start running the config). Note that a config which is successfully adapted may still fail validation. For an example of this, use this Caddyfile: localhost tls cert_notexist.pem key_notexist.pem Try adapting it: caddy adapt --config Caddyfile It succeeds without error. Then try: caddy adapt --config Caddyfile --validate adapt: validation: loading app modules: module name 'tls': provision tls: loading certificates: open cert_notexist.pem: no such file or directory Even though that Caddyfile can be adapted to JSON without errors, the actual certificate and/or key files do not exist, so validation fails because that error arises during the provisioning phase. Thus, validation is a stronger error check than adaptation is. Example To adapt a Caddyfile to JSON that you can easily read and tweak manually: caddy adapt --config /path/to/Caddyfile --pretty caddy build-info caddy build-info Prints information provided by Go about the build (main module path, package versions, module replacements). caddy completion caddy completion [bash|zsh|fish|powershell] Generates shell completion scripts. This allows you to get tab-complete or auto-complete (or similar, depending on your shell) when typing caddy commands. To get instructions for installing this script into your specific shell, run caddy help completion or caddy completion -h. caddy environ caddy environ Prints the environment as seen by caddy, then exits. Can be useful when debugging init systems or process manager units like systemd. caddy file-server caddy file-server [-r, --root <path>] [--listen <addr>] [-d, --domain <example.com>] [-b, --browse] [--reveal-symlinks] [-t, --templates] [--access-log] [-v, --debug] [--no-compress] [-p, --precompressed] Spins up a simple but production-ready static file server. --root specifies the root file path. Default is the current working directory. --listen accepts a listener address. Default is :80, unless --domain is used, then :443 will be the default. --domain will only serve files through that hostname, and Caddy will attempt to serve it over HTTPS, so make sure any public DNS is configured properly first if it's a public domain name. The default port will be changed to 443. --browse will enable directory listings if a directory without an index file is requested. --reveal-symlinks will show the target of symbolic links in directory listings, when --browse is enabled. --templates will enable template rendering. --access-log enables the request/access log. --debug enables verbose logging. --no-compress disables compression. By default, Zstandard and Gzip compression are enabled. --precompressed specifies encoding formats to search for precompressed sidecar files. Can be repeated for multiple formats. See the file_server directive for more information. This command disables the admin API, making it easier to run multiple instances on a local development machine. caddy file-server export-template caddy file-server export-template Exports the default file browsing template to stdout caddy fmt caddy fmt [<path>] [-w, --overwrite] [-d, --diff] Formats or prettifies a Caddyfile, then exits. The result is printed to stdout unless --overwrite is used, and will exit with code 1 if there are any differences. <path> specifies the path to the Caddyfile. If -, the input is read from stdin. If omitted, a file named Caddyfile in the current directory is assumed instead. --overwrite causes the result to be written to the input file instead of being printed to the terminal. If the input is not a regular file, this flag has no effect. --diff causes the output to be compared against the input, and lines will be prefixed with - and + where they differ. Note that unchanges lines are prefixed with two spaces for alignment, and that this is not a valid patch format; it's just meant as a visual tool. caddy hash-password caddy hash-password [-p, --plaintext <password>] [-a, --algorithm <name>] Convenient way to hash a plaintext password. The resulting hash is written to stdout as a format usable directly in your Caddy config. --plaintext is the plaintext form of the password. If omitted, interactive mode will be assumed and the user will be shown a prompt to enter the password manually. --algorithm may be bcrypt or any installed hash algorithm. Default is bcrypt. caddy help caddy help [<command>] Prints CLI help text, optionally for a specific subcommand, then exits. caddy list-modules caddy list-modules [--packages] [--versions] [-s, --skip-standard] Prints the Caddy modules that are installed, optionally with package and/or version information from their associated Go modules, then exits. In some scripted situations, it may be redundant to print all of the standard modules as well, so you may use --skip-standard to omit those from the output. NOTE: Due to a bug in Go, version information is only available if Caddy is built as a dependency and not as the main module. Use xcaddy to make this easier. caddy manpage caddy manpage (-o, --directory <path>) Generates manual/documentation pages for Caddy commands and writes them to the directory at the specified path. The output of this command can be read by the man command. --directory (required) is the path to the directory into which to write the man pages. It will be created if it does not exist. Once generated, the manual pages generally need to be installed. This procedure varies by platform, but on typical Linux systems, it's something like this: $ caddy manpage --directory man $ gzip -r man/ $ sudo cp man/* /usr/share/man/man8/ $ sudo mandb Then you can run man caddy (or man caddy-* for subcommands) to read documentation in your terminal. Manual pages are separate documentation from what is on our website. Our website has more comprehensive documentation that is updated often. caddy reload caddy reload [-c, --config <path>] [-a, --adapter <name>] [--address <interface>] [-f, --force] Gives the running Caddy instance a new configuration. This has the same effect as POSTing a document to the /load endpoint, but this command is convenient for simple workflows revolving around config files. Compared to the stop, start, and run commands, this single command is the correct, semantic way to change/reload the running configuration. Because this command uses the API, the admin endpoint must not be disabled. --config is the config file to apply. If -, the config is read from stdin. If not specified, it will try a file called Caddyfile in the current working directory and, if it exists, it will adapt it using the caddyfile config adapter; otherwise, it is an error if there is no config file to load. --adapter specifies a config adapter to use, if any. This flag is not necessary if the --config filename starts with Caddyfile or ends with .caddyfile which assumes the caddyfile adapter. Otherwise, this flag is required if the provided config file is not in Caddy's native JSON format. --address needs to be used if the admin endpoint is not listening on the default address and if it is different from the address in the provided config file. Note that only TCP addresses are supported at this time. --force will cause a reload to happen even if the specified config is the same as what Caddy is already running. Can be useful to force Caddy to reprovision its modules, which can have side-effects, for example: reloading manually-loaded TLS certificates. caddy respond caddy respond [-s, --status <code>] [-H, --header "<Field>: <value>"] [-b, --body <content>] [-l, --listen <addr>] [-v, --debug] [--access-log] [<status|body>] Starts one or more simple, hard-coded HTTP servers that are useful for development, staging, and some production use cases. It can be useful for verifying or debugging HTTP clients, scripts, or even load balancers. --status is the HTTP status code to return. --header adds an HTTP header; Field: value format is expected. This flag can be used multiple times. --body specifies the response body. Alternatively, the body can be piped from stdin. --listen is the listener address, which can be any network address recognized by Caddy, and may include a port range to start multiple servers. --debug enables verbose debug logging. --access-log enables access/request logging. With no options specified, this command listens on a random available port and answers HTTP requests with an empty 200 response. The listen address can be customized with the --listen flag and will always be printed to stdout. If the listen address includes a port range, multiple servers will be started. If a final, unnamed argument is given, it will be treated as a status code (same as the --status flag) if it is a 3-digit number. Otherwise, it is used as the response body (same as the --body flag). The --status and --body flags will always override this argument. A body may be given in 3 ways: a flag, a final (and unnamed) argument to the command, or piped to stdin (if flag and argument are unset). Limited template evaluation is supported on the body, with the following variables: Variable Description .N Server number .Port Listener port .Address Listener address Examples Empty 200 response on a random port: caddy respond HTTP response with a body: caddy respond "Hello, world!" Multiple servers and templates: $ caddy respond --listen :2000-2004 "I'm server {{.N}} on port {{.Port}}" Server address: [::]:2000 Server address: [::]:2001 Server address: [::]:2002 Server address: [::]:2003 Server address: [::]:2004 $ curl 127.0.0.1:2002 I'm server 2 on port 2002 Pipe in a maintenance page: cat maintenance.html | caddy respond \ --listen :80 \ --status 503 \ --header "Content-Type: text/html" caddy reverse-proxy caddy reverse-proxy [-f, --from <addr>] (-t, --to <addr>) [-H, --header-up "<Field>: <value>"] [-d, --header-down "<Field>: <value>"] [-c, --change-host-header] [-r, --disable-redirects] [-i, --internal-certs] [-v, --debug] [--access-log] [--insecure] A simple but production-ready reverse proxy. Useful for quick deployments, demos, and development. Simply shuttles HTTP(S) traffic from the --from address to the --to address. Multiple --to addresses may be specified by repeating the flag. At least one --to address is required. The --to address may have a port range as a shortcut to expand to multiple upstreams. Unless otherwise specified in the addresses, the --from address will be assumed to be HTTPS if a hostname is given, and the --to address will be assumed to be HTTP. If the --from address has a host or IP, Caddy will attempt to serve the proxy over HTTPS with a certificate (unless overridden by the HTTP scheme or port). If serving HTTPS: --disable-redirects can be used to avoid binding to the HTTP port. --internal-certs can be used to force issuance certs using the internal CA instead of attempting to issue a public certificate. For proxying: --header-up can be used to set a request header to send to the upstream. --header-down can be used to set a response header to send back to the client. --change-host-header sets the Host header on the request to the address of the upstream, instead of defaulting to the incoming Host header. This is a shortcut for --header-up "Host: {http.reverse_proxy.upstream.hostport}" --insecure disables TLS verification with the upstream. WARNING: THIS DISABLES SECURITY BY NOT VERIFYING THE UPSTREAM'S CERTIFICATE. --debug enables verbose logging. This command disables the admin API so it is easier to run multiple instances on a local development machine. caddy run caddy run [-c, --config <path>] [-a, --adapter <name>] [--pidfile <file>] [-e, --environ] [--envfile <file>] [-r, --resume] [-w, --watch] Runs Caddy and blocks indefinitely; i.e. "daemon" mode. --config specifies an initial config file to immediately load and use. If -, the config is read from stdin. If no config is specified, Caddy will run with a blank configuration and use default settings for the admin API endpoints, which can be used to feed it new configuration. As a special case, if the current working directory has a file called "Caddyfile" and the caddyfile config adapter is plugged in (default), then that file will be loaded and used to configure Caddy, even without any command line flags. --adapter is the name of the config adapter to use when loading the initial config, if a'''
author = "Caddy Web Server"
year_published = 2025
clearnet = "https://caddyserver.com/docs/command-line"
tags = ['''"i'm''', "--adapter", "--body", "--config", "--directory", "--from", "--listen", "--status", "--to", "/usr/share/man/man8/"]
language = "en"
internal-references = ["none"]
external-references = ["aniftyco.com", "appcove.com", "approximated.app", "caddy.community", "en.wikipedia.org", "framer.com", "fusionauth.com", "github.com", "jhalderm.com", "json.org", "marketplace.redhat.com", "matt.life", "qualys.com", "smallstep.com", "stedolan.github.io", "store.caddyserver.com", "tools.ietf.org", "twitter.com", "words.filippo.io", "zerossl.com"]

["https://caddyserver.com/docs/architecture"]
title = "Architecture — Caddy Documentation"
description = "Caddy is a powerful, enterprise-ready, open source web server with automatic HTTPS written in Go"
full_description = '''Architecture Caddy is a single, self-contained, static binary with zero external dependencies because it's written in Go. These values comprise important parts of the project's vision because they simplify deployment and reduce tedious troubleshooting in production environments. If there's no dynamic linking, then how can it be extended? Caddy sports a novel plugin architecture that expands its capabilities far beyond that of any other web server, even those with external (dynamically-linked) dependencies. Our philosophy of "fewer moving parts" ultimately results in more reliable, more manageable, less expensive sites—especially at scale. This semi-technical document describes how we achieve that goal through software engineering. Overview Caddy consists of a command, core library, and modules. The command provides the command line interface you are hopefully familiar with. It's how you launch the process from your operating system. The amount of code and logic here is fairly minimal, and has only what is needed to bootstrap the core in the user's desired way. We intentionally avoid using flags and environment variables for configuration except as they pertain to bootstrapping config. Modules can add subcommands to the command line interface! For instance, that's where the caddy file-server command comes from. These added commands may have any flags or use any environment variables they want, even though the core Caddy commands minimize their use. The core library, or "core" of Caddy, primarily manages configuration. It can Run() a new configuration or Stop() a running config. It also provides various utilities, types, and values for modules to use. Modules do everything else. Many modules come built into Caddy, which are called the standard modules. These are determined to be the most useful to the most users. Sometimes the terms module, plugin, and extension get used interchangeably, and usually that's OK. Technically, all modules are plugins, but not all plugins are modules. Modules are specifically a kind of plugin that extends Caddy's config structure. Caddy core At its core, Caddy merely loads an initial configuration ("config") or, if there isn't one, opens a socket to accept new configuration later on. A Caddy configuration is a JSON document, with some fields at its top level: { "admin": {}, "logging": {}, "apps": {•••}, ... } The core of Caddy knows how to work with some of these fields natively: admin so it can set up the admin API and manage the process logging so it can emit logs But other top-level fields (like apps) are opaque to the core of Caddy. In fact, all Caddy knows to do with the bytes in apps is deserialize them into an interface type that it can call two methods on: Start() Stop() ... and that's it. It calls Start() on each app when a config is loaded, and Stop() on each app when a config is unloaded. When an app module is started, it initiates the app's module lifecycle. If you are a programmer who is building Caddy modules, you can find analogous information in our Extending Caddy guide, but with more focus on code. Module lifecycle There are two kinds of modules: host modules and guest modules. Host modules (or "parent" modules) are those that load other modules. Guest modules (or "child" modules) are those that get loaded. All modules are guest modules -- even app modules. Modules get loaded, are provisioned and validated, get used, then are cleaned up, in this sequence: Loaded Provisioned and validated Used Cleaned up Caddy kicks off the module lifecycle when a config is loaded first by initializing all the configured app modules. From there, it's turtles all the way down as each app module takes it the rest of the way. Load phase Loading a module involves deserializing its JSON bytes into a typed value in memory. That's... basically it. It's just decoding JSON into a value. Provision phase This phase is where most of the setup work goes. All modules get a chance to provision themselves after being loaded. Since any properties from the JSON encoding will already have been decoded, only additional setup needs to take place here. The most common task during provisioning is setting up guest modules. In other words, provisioning a host module also results in provisioning its guest modules, all the way down. You can get a sense for this by traversing Caddy's JSON structure in our docs. Anywhere you see {•••} is where guest modules may be used; and as you click into one, you can continue exploring all the way down until there are no more guest modules. Other common provisioning tasks are setting up internal values that will be used during the module's lifetime, or standardizing inputs. For example, the http.matchers.remote_ip module uses the provisioning phase to parse CIDR values out of the string inputs it received from the JSON. That way, it doesn't have to do this during every HTTP request, and is more efficient as a result. Validation also can take place in the provision phase. If a module's resulting config is invalid, an error can be returned here which aborts the entire config load process. Use phase Once a guest module is provisioned and validated, it can be used by its host module. What exactly this means is up to each host module. Each module has an ID, which consists of a namespace and a name in that namespace. For example, http.handlers.reverse_proxy is an HTTP handler because it is in the http.handlers namespace, and its name is reverse_proxy. All modules in the http.handlers namespace satisfy the same interface, known to the host module. Thus, the http app knows how to load and use these kinds of modules. Cleanup phase When it is time for a config to be stopped, all modules get unloaded. If a module allocated any resources that should be freed, it has an opportunity to do so in the cleanup phase. Plugging in A module -- or any Caddy plugin -- gets "plugged in" to Caddy by adding an import for the module's package. By importing the package, the module registers itself with the Caddy core, so when the Caddy process starts, it knows each module by name. It can even associate between module values and names, and vice-versa. Plugins can be added without modifying the Caddy code base at all. There are instructions in the readme for doing this! Managing configuration Changing a running server's active configuration (often called a "reload") can be tricky with the high levels of concurrency and thousands of parameters that servers require. Caddy solves this problem elegantly using a design that has many benefits: No interruption to running services Granular config changes are possible Only one lock required (in the background) All reloads are atomic, consistent, isolated, and mostly durable ("ACID") Minimal global state You can watch a video about the design of Caddy 2 here. A config reload works by provisioning the new modules, and if all succeed, the old ones are cleaned up. For a brief period, two configs are operational at the same time. Each configuration is associated with a context which holds all the module state, so most state never escapes the scope of a config. This is good news for correctness, performance, and simplicity! However, sometimes truly global state is necessary. For example, the reverse proxy may keep track of the health of its upstreams; since there is only one of each upstream globally, it would be bad if it forgot about them every time a minor config change was made. Fortunately, Caddy provides facilities similar to a language runtime's garbage collector to keep global state tidy. One obvious approach to on-line config updates is to synchronize access to every single config parameter, even in hot paths. This is unbelievably bad in terms of performance and complexity—especially at scale—so Caddy does not use this approach. Instead, configs are treated as immutable, atomic units: either the whole thing is replaced, or nothing gets changed. The admin API endpoints—which permit granular changes by traversing into the structure—mutate only an in-memory representation of the config, from which a whole new config document is generated and loaded. This approach has vast benefits in terms of simplicity, performance, and consistency. Since there is only one lock, it is easy for Caddy to process rapid reloads.'''
author = "Caddy Web Server"
year_published = 2025
clearnet = "https://caddyserver.com/docs/architecture"
