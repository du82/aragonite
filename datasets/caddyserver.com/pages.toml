full_description = '''Placeholders In Caddy, placeholders are processed by each individual plugin as needed; they do not automatically work everywhere. This means that if you wish for your plugin to support placeholders, you must explicitly add support for them. If you are not yet familiar with placeholders, start by reading here! Placeholders Overview Placeholders are a string in the format {foo.bar} used as dynamic configuration values, which is later evaluated at runtime. Caddyfile environment variables substitutions which start with a dollar sign like {$FOO} are evaluated at Caddyfile-parse time, and do not need to be handled by your plugin. These are not placeholders, despite sharing the same { } syntax. It is therefore important to understand that {env.HOST} (a global placeholder) is inherently different from {$HOST} (a Caddyfile env-var substitution). As an example, see the following Caddyfile: :8080 { respond {$HOST} 200 } :8081 { respond {env.HOST} 200 } When you adapt this Caddyfile to JSON with HOST=example caddy adapt you will get: { "apps": { "http": { "servers": { "srv0": { "listen": [":8080"], "routes": [ { "handle": [ { "body": "example", "handler": "static_response", "status_code": 200 } ] } ] }, "srv1": { "listen": [":8081"], "routes": [ { "handle": [ { "body": "{env.HOST}", "handler": "static_response", "status_code": 200 } ] } ] } } } } } In particular, look at the "body" field in both srv0 and srv1. Since srv0 used {$HOST} (Caddyfile env-var substitution), the value became example, as it was processed during Caddyfile parse time when producing the JSON config. Since srv1 used {env.HOST} (a global placeholder), it remains untouched when adapting to JSON. This does mean that users writing JSON config (not using Caddyfile) cannot use the {$ENV} syntax. For that reason, it's important that plugin authors implement support for replacing placeholders when the config is provisioned. This is explained below. Implementing placeholder support You should not process placeholders in UnmarshalCaddyfile(). Instead, placeholders should be replaced later, either in the Provision() step, or during your module's execution (e.g. ServeHTTP() for HTTP handlers, Match() for matchers, etc.), using a caddy.Replacer. Examples Here, we are using a newly constructed replacer to process placeholders. It has access to global placeholders such as {env.HOST}, but not HTTP placeholders such as {http.request.uri} because provisioning happens when the config is loaded, and not during a request. func (g *Gizmo) Provision(ctx caddy.Context) error { repl := caddy.NewReplacer() g.Name = repl.ReplaceAll(g.Name,"") return nil } Here, we fetch the replacer from the request context r.Context() during ServeHTTP. This replacer has access to both global placeholders and per-request HTTP placeholders such as {http.request.uri}. func (g *Gizmo) ServeHTTP(w http.ResponseWriter, r *http.Request, next caddyhttp.Handler) error { repl := r.Context().Value(caddy.ReplacerCtxKey).(*caddy.Replacer) _, err := w.Write([]byte(repl.ReplaceAll(g.Name,""))) if err != nil { return err } return next.ServeHTTP(w, r) }'''
author = "Caddy Web Server"
year_published = 2025
clearnet = "https://caddyserver.com/docs/extending-caddy/placeholders"
tags = ["caddy", "caddyfile", "config", "during", "examples", "global", "implementing", "json", "overview", "placeholder"]
language = "en"
internal-references = ["none"]
external-references = ["aniftyco.com", "appcove.com", "approximated.app", "caddy.community", "en.wikipedia.org", "framer.com", "fusionauth.com", "github.com", "jhalderm.com", "json.org", "marketplace.redhat.com", "matt.life", "qualys.com", "smallstep.com", "stedolan.github.io", "store.caddyserver.com", "tools.ietf.org", "twitter.com", "words.filippo.io", "zerossl.com"]

