title = "Global options (Caddyfile) — Caddy Documentation"
description = "Caddy is a powerful, enterprise-ready, open source web server with automatic HTTPS written in Go"
full_description = '''window.$(function() { // We'll add links on the options in the code block at the top // to their associated anchor tags. let headers = $('article h5').map((i, el) => el.id.replace(/-/g, "_")).toArray(); window.$('pre.chroma .k') .filter((k, item) => headers.includes(item.innerText)) .map(function(k, item) { let text = item.innerText.replace(/</g,'&lt;').replace(/>/g,'&gt;'); let url = '#' + item.innerText.replace(/_/g, "-"); window.$(item).html(`<a href="${url}" style="color: inherit;" title="${text}">${text}</a>`); }); // Add links on comments to their respective sections window.$('pre.chroma .c1') .filter((k, item) => item.innerText.includes('#')) .map(function(k, item) { let text = item.innerText; let before = text.slice(0, text.indexOf('#')); // the leading whitespace text = text.slice(text.indexOf('#')); // only the comment part let url = '#' + text.replace(/#/g, '').trim().toLowerCase().replace(/ /g, "-"); window.$(item).html(`${before}<a href="${url}" style="color: inherit;" title="${text}">${text}</a>`); }); // Surgically fix a duplicate link; 'name' appears twice as a link // for two different sections, so we change the second to #name-1 window.$('pre.chroma .line:contains("ca [<id>]")') .next() .find('a:contains("name")') .attr('href', '#name-1'); }); Global options The Caddyfile has a way for you to specify options that apply globally. Some options act as default values; others customize HTTP servers and don't apply to just one particular site; while yet others customize the behavior of the Caddyfile adapter. The very top of your Caddyfile can be a global options block. This is a block that has no keys: { ... } There can only be one at most, and it must be the first block of the Caddyfile. Possible options are (click on each option to jump to its documentation): { # General Options debug http_port <port> https_port <port> default_bind <hosts...> order <dir1> first|last|[before|after <dir2>] storage <module_name> { <options...> } storage_clean_interval <duration> admin off|<addr> { origins <origins...> enforce_origin } persist_config off log [name] { output <writer_module> ... format <encoder_module> ... level <level> include <namespaces...> exclude <namespaces...> } grace_period <duration> shutdown_delay <duration> # TLS Options auto_https off|disable_redirects|ignore_loaded_certs|disable_certs email <yours> default_sni <name> fallback_sni <name> local_certs skip_install_trust acme_ca <directory_url> acme_ca_root <pem_file> acme_eab { key_id <key_id> mac_key <mac_key> } acme_dns <provider> ... on_demand_tls { ask <endpoint> permission <module> } key_type ed25519|p256|p384|rsa2048|rsa4096 cert_issuer <name> ... renew_interval <duration> cert_lifetime <duration> ocsp_interval <duration> ocsp_stapling off preferred_chains [smallest] { root_common_name <common_names...> any_common_name <common_names...> } # Server Options servers [<listener_address>] { name <name> listener_wrappers { <listener_wrappers...> } timeouts { read_body <duration> read_header <duration> write <duration> idle <duration> } keepalive_interval <duration> trusted_proxies <module> ... client_ip_headers <headers...> metrics trace max_header_size <size> enable_full_duplex log_credentials protocols [h1|h2|h2c|h3] strict_sni_host [on|insecure_off] } # File Systems filesystem <name> <module> { <options...> } # PKI Options pki { ca [<id>] { name <name> root_cn <name> intermediate_cn <name> intermediate_lifetime <duration> root { format <format> cert <path> key <path> } intermediate { format <format> cert <path> key <path> } } } # Event options events { on <event> <handler...> } } General Options debug Enables debug mode, which sets the log level to DEBUG for the default logger. This reveals more details that can be useful when troubleshooting (and is very verbose in production). We ask that you enable this before asking for help on the community forums. For example, at the top of your Caddyfile, if you have no other global options: { debug } http_port The port for the server to use for HTTP. For internal use only; does not change the HTTP port for clients. This is typically used if within your internal network, you needed to port forward 80 to a different port (e.g. 8080) before it reaches Caddy, for routing purposes. Default: 80 https_port The port for the server to use for HTTPS. For internal use only; does not change the HTTPS port for clients. This is typically used if within your internal network, you needed to port forward 443 to a different port (e.g. 8443) before it reaches Caddy, for routing purposes. Default: 443 default_bind The default bind address(es) to be used for all sites, if the bind directive is not used in the site. Default: empty, which binds to all interfaces. Keep in mind that this will only apply to servers which are generated by the Caddyfile; this means that the HTTP server created by Automatic HTTPS for HTTP-to-HTTPS redirects will not inherit these bind addresses. To work around this, make sure to declare an http:// site (it can be empty, with no directives) so that it exists when the Caddyfile is adapted, to receive the bind addresses. { default_bind 10.0.0.1 } order Assigns an order to HTTP handler directive(s). As HTTP handlers execute in a sequential chain, it is necessary for the handlers to be executed in the right order. Standard directives have a pre-defined order, but if using third-party HTTP handler modules, you'll need to define the order explicitly by either using this option or placing the directive in a route block. Ordering can be described absolutely (first or last), or relatively (before or after) to another directive. For example, to use the replace-response plugin, you'd want to make sure its directive is ordered after encode so that it can perform replacements before the response is encoded (because responses flow up the handler chain, not down): { order replace after encode } storage Configures Caddy's storage mechanism. The default is file_system. There are many other available storage modules provided as plugins. For example, to change the file system's storage location: { storage file_system /path/to/custom/location } Customizing the storage module is typically needed when syncing Caddy's storage across multiple instances of Caddy to make sure they all use the same certificates and keys. See the Automatic HTTPS section on storage for more details. storage_clean_interval How often to scan storage units for old or expired assets and remove them. These scans exert lots of reads (and list operations) on the storage module, so choose a longer interval for large deployments. Accepts duration values. Storage will always be cleaned when the process first starts. Then, a new cleaning will be started this duration after the previous cleaning started if the previous cleaning finished in less than half the time of this interval (otherwise next start will be skipped). Default: 24h { storage_clean_interval 7d } admin Customizes the admin API endpoint. Accepts placeholders. Takes network addresses. Default: localhost:2019, unless the CADDY_ADMIN environment variable is set. If set to off, then the admin endpoint will be disabled. When disabled, config changes will be impossible without stopping and starting the server, since the caddy reload command uses the admin API to push the new config to the running server. Remember to use the --address CLI flag with compatible commands to specify the current admin endpoint, if the address of the running server was changed from the default. Also supports these sub-options: origins configures the list of origins that are allowed to connect to the endpoint. A default is intelligently chosen: if the listen address is loopback (e.g. localhost or a loopback IP, or a unix socket) then the allowed origins are localhost, ::1 and 127.0.0.1, joined with the listen address port (so localhost:2019 is a valid origin). if the listen address is not loopback, then the allowed origin is the same as the listen address. If the listen address host is not a wildcard interface (wildcards include: empty string, or 0.0.0.0, or [::]), then Host header enforcement is performed. Effectively, this means that by default, the Host header is validated to be in origins, since the interface is localhost. But for an address like :2020 which has a wildcard interface, Host header validation is not performed. enforce_origin enables enforcement of the Origin request header. This is most useful when the listen address is a wildcard interface (since Host is not validated), and the admin API is exposed to the public internet. It enables CORS preflight checks and ensures that the Origin header is validated against the origins list. Only use this if you're running Caddy on your development machine and need to access the admin API from a web browser. For example, to expose the admin API on a different port, on all interfaces — ⚠️ this port should not be exposed publicly, otherwise anyone can control your server; consider enabling origin enforcement if you need it to be public: { admin :2020 } To turn off the admin API — ⚠️ this makes config reloads impossible without stopping and starting the server: { admin off } To use a unix socket for the admin API, allowing access control via file permissions: { admin unix//run/caddy-admin.sock } To only allow requests having a matching Origin header: { admin :2019 { origins localhost enforce_origin } } persist_config Controls whether the current JSON config should be persisted to the configuration directory, to avoid losing config changes performed via the admin API. Currently, only the off option is supported. By default, the config is persisted. { persist_config off } log Configures named loggers. The name can be passed to indicate a specific logger for which to customize the behavior. If no name is specified, the behavior of the default logger is modified. You can read more about the default logger and an explanation of how logging works in Caddy. Multiple loggers with different names can be configured by using the log multiple times. The differs from the log directive, which only configures HTTP request logging (also known as access logs). The log global option shares its configuration structure with the directive (except for include and exclude), and complete documentation can be found on the directive's page. output configures where to write the logs. See the log directive for complete documentation. format describes how to encode, or format, the logs. See the log directive for complete documentation. level is the minimum entry level to log. Default: INFO. Possible values: DEBUG, INFO, WARN, ERROR, and very rarely, PANIC, FATAL. include specifies the log names to be included in this logger. By default, this list is empty (i.e. all logs are included). For example, to include only logs emitted by the admin API, you would include admin.api. exclude specifies the log names to be excluded from this logger. By default, this list is empty (i.e. no logs are excluded). For example, to exclude only HTTP access logs, you would exclude http.log.access. The logger names that include and exclude accept depend on the modules used, and easiest way to discover them is from prior logs. Here is an example logging as json all http access logs and admin logs to stdout: { log default { output stdout format json include http.log.access admin.api } } grace_period Defines the grace period for shutting down HTTP servers (i.e. during config changes or when Caddy is stopping). During the grace period, no new connections are accepted, idle connections are closed, and active connections are impatiently waited upon to finish their requests. If clients do not finish their requests within the grace period, the server will be forcefully terminated to allow the reload to complete and free up resources. Accepts duration values. By default, the grace period is eternal, which means connections are never forcefully closed. { grace_period 10s } shutdown_delay Defines a duration before the grace period during which a server that is going to be stopped continues to operate normally, except the {http.shutting_down} placeholder evaluates to true and {http.time_until_shutdown} gives the time until the grace period begins. This causes a delay if any server is being shut down as part of a config change, and effectively schedules the change for a later time. It is useful for announcing to health checkers of this server's impending doom and to give time for a load balancer to move it out of the rotation; for example: { shutdown_delay 30s } example.com { handle /health-check { @goingDown vars {http.shutting_down} true respond @goingDown "Bye-bye in {http.time_until_shutdown}" 503 respond 200 } handle { respond "Hello, world!" } } TLS Options auto_https Configures Automatic HTTPS, which is the feature that enables Caddy to automate certificate management and HTTP-to-HTTPS redirects for your sites. There are a few modes to choose from: off: Disables both certificate automation and HTTP-to-HTTPS redirects. disable_redirects: Disable only HTTP-to-HTTPS redirects. disable_certs: Disable only certificate automation. ignore_loaded_certs: Automate certificates even for names which appear on manually-loaded certificates. Useful if you specified a certificate using the tls directive which contains names (or wildcards) that you instead want to be managed automatically. This option does not affect Caddy's default protocol, which is always HTTPS, when a site address has a valid domain name. This means that auto_https off will not cause your site to be served over HTTP, it will only disable automatic certificate management and redirects. This means that if you wish to serve your site over HTTP, you should change your site address to be prefixed with http:// or suffixed with :80 (or the http_port option). { auto_https disable_redirects } email Your email address. Mainly used when creating an ACME account with your CA, and is highly recommended in case there are problems with your certificates. Keep in mind that Let's Encrypt may send you emails about your certificate nearing expiry, but this may be misleading because Caddy may have chosen to use a different issuer (e.g. ZeroSSL) when renewing. Check your logs and/or the certificate itself (in your browser for example) to see which issuer was used, and that its expiry is still valid; if so, you may safely ignore the email from Let's Encrypt. { email admin@example.com } default_sni Sets a default TLS ServerName for when clients do not use SNI in their ClientHello. { default_sni example.com } fallback_sni ⚠️ Experimental If configured, the fallback becomes the TLS ServerName in the ClientHello if the original ServerName doesn't match any certificates in the cache. The uses for this are very niche; typically if a client is a CDN and passes through the ServerName of the downstream handshake but can accept a certificate with the origin's hostname instead, then you would set this as'''
