["https://caddyserver.com/features"]
title = "All features of the Caddy Web Server"
description = "Caddy is a powerful, enterprise-ready, open source web server with automatic HTTPS written in Go"
full_description = "Features in this color are provided by optional plugins. Overview Caddy is essentially a configuration management system that can run various apps like an HTTP server, TLS certificate manager, PKI facilities, and more. It can be extended with plugins known as config modules. Caddy sports a flexible and powerful HTTP reverse proxy, on-line configuration API, and a robust, production-ready static file server, and serves all sites over HTTPS by default with automagic TLS certificates. Overall program technical specifications Language The language choice is crucial for a web server. Language impacts development speed and ease, performance, testing, deployment complexity, ecosystem reliability, dependencies, tooling, error handling and reliability, and much, much more. Go offers strong advantages in all these areas, allowing for rapid development, robust production performance, and high scalability. Go Memory safety guarantees Most servers (NGINX, Apache, HAProxy, etc.) and their dependencies are written in C, which are vulnerable to catastrophic memory safety bugs (such as buffer overflows) like Heartbleed. Go programs like Caddy are impervious to a whole class of security vulnerabilities. Strong Build artifacts Caddy compiles directly to native CPU instructions. There is no interpreter required; and many instructions are architecture-optimized. Static binaries are also more secure because there is no dynamic linking. Platform-native static binary Runtime dependencies Caddy is statically compiled. Dynamically-linked applications can easily break in production and may be less secure as shared executable resources are loaded from various places around the system. Generally, Caddy binaries do not necessarily require external libraries — not even libc. None Compile time On consumer hardware, standard Caddy builds compile in just a few seconds. This is crucial for rapid iteration, plugin development, and low-cost deployments. Other servers written in C/C++ can take several minutes. ~30 seconds cold build,~2 seconds hot Deployment environments Caddy can go practically anywhere and be deployed a variety of ways. In general, upgrading is as simple as replacing the binary. Command line interface System service Containers Kubernetes Embedded Supply chain and releases Go modules verify the integrity of our dependencies and we cryptographically sign our release artifacts so you know what you can trust. Cryptographically verified Operating systems Caddy runs on every major platform for which Go compiles. Linux Windows macOS FreeBSD OpenBSD NetBSD Android Microarchitectures Run Caddy with native code on numerous CPU platforms. x86 (i386, i686) x86-64 (AMD64) ARM ARM 64 (AArch64) MIPS MIPS64[LE] PPC64[LE] RISCV64 S390X Apple Silicon (Apple ARM; M1, M2, etc.) Regular expression engine Caddy's regular expression language is based on the Thompson NFA and has numerous performance improvements over PCRE used by other web servers. It guarantees the runtime cost increases linearly instead of exponentially. This is ideal when evaluating untrusted input. RE2 Syntax RE2 Concurrency model Go's runtime optimizes scheduled CPU time in smarter ways than the operating system can using lightweight user-space threads called goroutines. Caddy utilizes all CPU cores and easily handles hundreds of thousands of requests per second. Goroutines (epoll + kqueue) Plugin model Caddy can be extended by compile-time plugins, which compile as native code, in a way that cannot be broken during deployments or by system upgrades. With no IPC or RPC calls, Caddy extensions perform equally well with native code. Compile-time static High-level capabilities Configuration changes With zero-downtime graceful reloads, Caddy's configuration can be changed while it is running. It's programmable/scriptable for powerful automation. RESTful HTTP API Config files Secure remote access App modules Top-level configuration structures are called app modules, or Caddy apps. They provide the bulk of Caddy's functionality. Anyone can write app modules, and Caddy comes with several standard apps built-in. HTTP TLS PKI Events Raw TCP & UDP SSH PHP Dynamic DNS Security Process supervision Profiling Logs All Caddy modules use Caddy's centralized logging facilities. Caddy's logging can be configured as to format, verbosity, output, and more. Leveled Structured High efficiency, zero-allocation Extensible Delete, filter, redact, and censor fields IP masking Hash values Regex replacement Storage Assets and state, including certificates and OCSP staples, are stored in configurable storage backends. In fact, multiple instances of Caddy configured with the same storage are considered part of a cluster and can coordinate automatically. File system Embedded (in-memory) Postgres Redis Vault Consul Command line interface Caddy's CLI is not only useful—it's helpful. While most server CLIs merely run the process and reload config, Caddy's CLI goes the extra lightyear to help make administering your modern web server a breeze. Plugins can register their own subcommands to extend Caddy's CLI. Command help If you misspell a command or flag, miss an argument, or don't know the subcommand, help text is automatically printed. You can also access overall command help or subcommand help with caddy help or -h. Built-in, automatic (man pages can also be generated) Admin API wrappers Several subcommands use administration API endpoints for use with the CLI to help you perform common tasks like loading config from files or stopping the server. Adapt config to JSON Start the server, optionally with config Gracefully reload configuration Stop the server Binary utilities Since custom builds of Caddy are so common, several commands exist to help you manage and get detailed information about your build. Detailed build metadata List installed config modules List dependencies Add and remove plugin packages Print the version Upgrade the Caddy binary Configuration utilities If you choose to use configuration files, Caddy's CLI helps you manage them. Format Caddyfile Validate configuration List dependencies Add and remove plugin packages Print the version Module utilities Modules may register their own subcommands to provide common functionality that can be utilized without a config document. Static file server HTTP reverse proxy Static HTTP responses (templateable) Storage import/export (backup/restore) Hash password for use with HTTP basic auth Export file browse template Integration utilities Several subcommands can help you integrate Caddy into your shell environment. Generate shell completion script Print the environment Generate man pages Install Caddy-managed root CA into trust stores Remove Caddy-managed root CA from trust stores System signals Caddy has support for common operating system signals/interrupts, with subtle differences in behavior for each one. Signal documentation INT (graceful stop) QUIT TERM Exit codes Whether Caddy exits successfully or with an error, the exit code can give a hint to your process supervisor or script how to handle that. Configuration We've designed Caddy so that its configuration not only provides access to features, but it IS a feature in and of itself. No more quibbling over which config file format is the best: use whatever you want! Caddy's config adapters allow you to use whatever config format you prefer. Native config format Caddy's native configuration format is ubiquitous: it has tooling in nearly every operating system, platform, programming language, and API ecosystem. Almost all other formats can be translated down into JSON, which balances human readability and programmability. You'll find it a powerful ally of your web server. JSON Config adapters You can always write your config in another format and with config adapters, Caddy will implicitly translate it into JSON for you so you can work with what you like. Caddyfile JSON 5 JSON-C NGINX Conf YAML CUE TOML HCL Dhall MySQL Human-friendly config The Caddyfile is most users' favorite way to write their web server config by hand because its syntax is forgiving while also being designed with a structure that makes it easy to read and write. It is translated to JSON automatically. Caddyfile Export Caddy's administration API allows you to have runtime access to the current configuration in JSON format with a simple GET request. Config API Caddy receives its configuration through an API endpoint, which can accept JSON or any other format it has a config adapter for. Config files If you prefer normal shell commands for managing configuration, Caddy's CLI wraps the API endpoints for you. Automatic HTTPS Our flagship feature, powered by CertMagic. Caddy is the first and only major server that enables HTTPS by default, and automatically procures and renews certificates for all your sites. Fully-native, integrated auto-HTTPS is far superior to any solution that requires external tooling or cron jobs. Caddy's certificate maintenance is the best in the industry because it is more robust, reliable, and scalable than any other solution. Caddy simplifies your infrastructure instead of complexifying it. Sure, you can try deploying 100,000 sites with Certbot and a cron job—but if that doesn't fall over by itself, the web server will. Only Caddy is designed to massively scale TLS certificates both horizontally and vertically. Never manually generate a CSR again. Never click a link in an email to download a certificate. Never (mis)configure your web server to use them. Never miss reminders to renew your certificates, one-by-one, every few months before they expire. You won't even have to think about certificates or TLS. It's truly automagic. Compliance Caddy's TLS defaults are secure without any additional configuration, and passes compliance tests across various industries. PCI DSS compliant NIST compliant HIPAA compliant Industry best practices On-Demand TLS Serving domains that aren't yours? Or have lots of them? No problem! With just a few lines of config, On-Demand TLS gets certificates dynamically during TLS handshakes, scaling your deployments to tens of thousands of certs. This functionality is exclusive to Caddy. Certificate issuers Get certificates from any issuing authority in a way compatible with them. Certificate issuers take a CSR and return a certificate resource. Most sites will simply use ACME to get certificates. But Caddy can also issue its own self-signed certificates for internal use, testing, or development. Caddy's issuer sources are pluggable, so Caddy can automate certificates from any issuer modules. ACME Internal (self-signed) Microsoft Active Directory Certificate Services Certificate managers Unlike issuers, which take a CSR and return a certificate that Caddy has to manage, certificate managers are modules that can return always-valid certificates on-demand; that is, they are managing the certificates for us. Caddy can get interface with HTTP endpoints or Tailscale to get certificates in this manner, with other ways available through plugins. HTTP Tailscale Cluster coordination Across all Caddy instances configured with the same storage, Caddy automatically coordinates and shares resources across the cluster. This includes certificate operations and the certificates themselves, OCSP staples, and session ticket keys. This results in reduced latency for your clients and higher scalability. Obtaining & renewing certificates Loading existing certificates OCSP staples Session ticket keys (STEKs) Redirect HTTP to HTTPS By default, HTTP requests will be redirected to HTTPS. Automatic redirects OCSP OCSP indicates when certificates are revoked. Servers should staple OCSP responses to certificates to provide clients with better security and privacy. Caddy is the first and only server to do this automatically and by default. It also caches responses to weather OCSP responder outages, and shares them across its cluster. This can all be disabled if needed. Automatic OCSP stapling with caching Must-Staple Caddy can obtain certificates that force OCSP stapling if the CA supports it. This may grant a higher degree of security in the case of revocation. Revocation handling Revoked certificates automatically get replaced. Because Caddy staples and refreshes OCSP responses, it can detect if your certificate has been revoked, and if so, it will replace it with a fresh certificate. Session ticket hardening TLS connections are pointless if an attacker steals the key to encrypt session tickets. Caddy has been academically cited as the only server to rotate these keys regularly to limit attack windows. Automatic STEK rotation Key types You can customize the type of key used for your certificates. Ed25519 ECDSA P256 ECDSA P384 RSA 2048 RSA 4096 Certificate lifetimes Most ACME clients assume 90-day certificates, or don't expect certificates shorter than 7 days. Caddy can successfully manage certificates with lifetimes on the order of hours and minutes. Instead of hard-coding a certain age before renewing, Caddy computes the age relative to the lifespan of each certificate, called a Renewal Window Ratio. By default, Caddy renews certificates after 2/3 of their usable lifetime. This ratio works for most validity periods, but can be adjusted. Any lifetime Intelligent error handling If Caddy can't get a certificate, errors are logged and Caddy will backoff exponentially and retry as long as needed until it succeeds (typically up to 30 days but could be longer). Caddy makes every reasonable effort to keep your certificate renewed. Exponential backoff Built-in throttling Caddy conforms to best practices and doesn't blast CAs with requests for certificates; instead, each order is carefully timed to avoid overwhelming CA servers. ACME Caddy's ACME client is best-in-class, with higher reliability and more production experience than any other integrated ACME client available today. Caddy has been using ACME since before the public availability of Let's Encrypt, and Caddy works with any ACME-compatible CA. Compatibility Some ACME clients are only tested with Let's Encrypt. Caddy is guaranteed compatible with all ACME-capable CAs. All RFC 8555-compliant certificate authorities, such as: Let's Encrypt ZeroSSL Google Trust Services BuyPass DigiCert GlobalSign SSL.com Smallstep Test endpoints By default, Caddy will fall back to a CA's test or staging endpoint (if there is one) after a failed attempt at getting a certificate to avoid hitting CA-enforced production rate limits. This could also be an ACME server you set up solely for the purpose of validating DNS configurations. Let's Encrypt (others configurable) External account binding Optionally configure External Account Binding (EAB) to enable Caddy to work with CAs that require you to have a separate account with them. Challenge types Caddy supports all major ACME challenge types for Web PKI and can also be extended to support others. HTTP-01 TLS-ALPN-01 DNS-01 Alternate challenge ports W"
author = "Caddy Web Server"
