["https://cadenaser.com/nacional/2025/01/30/memorias-de-un-caracol-la-joya-de-la-animacion-para-adultos-que-reivindica-con-humor-negro-la-libertad-y-el-amor-entre-hermanos-cadena-ser"]
title = "'Memorias de un caracol', la joya de la animación para adultos que reivindica con humor negro la libertad y el amor entre hermanos  | Cine y TV  | Cadena SER"
description = "El australiano Adam Elliott, autor de títulos premiados como &#039;Harvie Krumpet&#039; y &#039;Mary and Max&#039;, está nominado al Oscar por esta historia oscura, cómica y a la vez tierna de dos hermanos separados frente a un mundo de fanatismos religiosos, perversiones y avaricia | Cadena SER"
full_description = '''El cine en la SERCine y TV'Memorias de un caracol', la joya de la animación para adultos que reivindica con humor negro la libertad y el amor entre hermanosEl australiano Adam Elliott, autor de títulos premiados como 'Harvie Krumpet' y 'Mary and Max', está nominado al Oscar por esta historia oscura, cómica y a la vez tierna de dos hermanos separados frente a un mundo de fanatismos religiosos, perversiones y avariciaFotograma de 'Memorias de un caracol' . Credit: Courtesy of Arenamedia Pty Ltd. /IFC Films / Courtesy of Arenamedia Pty Ltd. AmpliarCerrarFacebookTwitterLinkedInWhatsAppJosé M. RomeroJoseMRomeroromero_joseCadena SER30/01/2025 - 07:00 UTCMadridAdam Elliott (Berwick, Victoria, 1972) es uno de los grandes artesanos de la animación contemporánea. Sus cortometrajes y películas en stop motion son auténticos trabajos de orfebrería que han ido creciendo en ambición para crear universos complejos, con muchos escenarios y personajes, y con narraciones que colocan en el centro de la historia a personajes marginados. En un tiempo dominado por los efectos digitales y las películas videojuego, el director australiano se mantiene fiel a este laborioso proceso donde cada elemento es real y cada movimiento surge fotograma a fotograma. "Me ha llevado tres años escribir el guion, tres recaudar el dinero y dos años hacer la película, pero todas esas etapas se mezclan. También soy un poco megalómano. Soy un fanático del control. He hecho el guion, el guion gráfico, el diseño de producción. Ayudo con la música. Ayudo con la edición. Hago muchos de los escenarios y gran parte del trabajo. Tengo un gran equipo de personas que me ayudan, el stop motion es increíblemente lento, teníamos siete animadores y cada animador solo hacía de cinco a 10 segundos por día. El rodaje duró 32 semanas, toda la animación es lenta, en Disney o Pixar también, y además es muy cara. En esta película no hay CGI ni Inteligencia Artificial, cada personaje, accesorio y set es algo que puedes tocar y coger de la mano, incluso el fuego es de celofán, el humo del cigarrillo es algodón. Son todos materiales tangibles y táctiles", explicaba en conversación con la Cadena SER en el pasado Festival de San Sebastián.Tras títulos multipremiados y reconocidos como el corto Harvie Krumpet y su primera película, Mary and Max, Elliott estrena Memorias de un caracol, una historia en la que vuelve a temas recurrentes de su filmografía con su habitual humor negro. Si en el corto con el que ganó el Oscar en 2004 trazaba un relato humanista sobre un hombre con síndrome de Tourette que se enfrenta a numerosas desgracias y contratiempos, y en su debut en el largometraje narraba la amistad entre un cuarentón obeso de Nueva York con síndrome de Asperger y una niña australiana solitaria, depresiva y acosada en el colegio, en esta ocasión el autor indaga también en las relaciones familiares, en la soledad, en la marginación y en el profundo amor entre dos hermanos que perdieron a su madre al nacer y poco más tarde se quedaron huérfanos por la muerte de su padre alcohólico y tetrapléjico. De ahí que la protagonista de esta historia se obsesione con coleccionar caracoles, en todas sus formas y materiales, como una metáfora de alguien reservada, escondida, con un caparazón a cuestas por el miedo al juicio de los demás."Todas mis películas están basadas en mí mismo, en la fusión de mis experiencias, pero también de mi familia y amigos. Con esta película, quería contar la historia de una coleccionista porque mi madre y mi padre eran coleccionistas, no de una forma extrema pero lo eran. Y siempre me ha fascinado saber por qué coleccionamos, todo el mundo colecciona cosas. Y la mayoría de las cosas que tenemos en nuestras casas no las necesitamos. Leí muchos libros sobre psicología y hablé con muchos psicólogos. Y cuanto más aprendí, se reveló que estas personas han sufrido muchos traumas en sus vidas. La pérdida de un gemelo o de un hermano o de un padre y esa acaparación compulsiva como forma de sobrellevar la situación. Realmente es un trastorno mental", cuenta de esta historia de dos gemelos que han aprendido a sobrevivir solos, que les encanta el cine y la lectura y que sufren a los 'malotes' del colegio. Una por haber nacido con el labio hendido y el otro por ser un chico solitario (y pirómano) que no le interesan las chicas."Una amiga mía nació con el paladar hendido de forma muy grave. Y cuando era niña, fue acosada y objeto de burlas y se sometió a muchas cirugías en el labio. Se acabó convirtiendo en una persona muy extrovertida, colorida, vibrante y segura de sí misma. ¿Cómo pasa de ser una niña sin confianza a una persona tan extravagante? Esas dos ideas se unieron y escribí muchos borradores del guion. Creo que hice 16 borradores. Nunca sé muy bien de qué van a tratar mis películas hasta quizás el cuarto o quinto borrador. Y luego está el tema de las jaulas, las jaulas que creamos para nosotros mismos. Mis películas son muy densas y tienen todo tipo de capas, no van solo de un tema simple. Nunca sé realmente de qué tratan mis películas hasta unos diez años después de terminarlas. He hecho miles de entrevistas y por eso hice esta película, es como una terapia", añade del proceso de esta obra ambientada en los años 70 y que recorre varias décadas en la vida de los personajes.Adam Elliot, director de 'Memorias de un caracol' / MATT IRWINAmpliarAdam Elliot, director de 'Memorias de un caracol' / MATT IRWINCerrarLa historia empieza con esos dos hermanos gemelos conviviendo con un padre con discapacidad y sin apenas dinero, después son separados y enviados con dos familias de acogida. Ella llega a la casa de una pareja 'swinger' y nudista que la abandona, y él acaba encerrado en una granja de ultracatólicos. Por el camino, y por todos los años que abarca la película, se encuentran con hombres fetichistas y pervertidos, con personajes que sufren enfermedades mentales y también con una anciana excéntrica que simboliza la bondad, la esperanza y la vitalidad de buscar siempre tu propia vida. "No me gustan los villanos, son personajes habitualmente unidimensionales. En la película trato de que también esos personajes muestren su historia y sus traumas, son personaje también dañados, intento crear personajes muy reales, creíbles y auténticos que, aunque sean de plastilina, se parezcan a alguien", defiende Elliott que, eso sí, denuncia las consecuencias del fanatismo religioso y las falsas terapias de conversión para homosexuales. .c-w{ max-width:444px; width:100%; margin:32px auto; background:#00755E; border-radius:4px; display:flex; align-items:center; justify-content:center; } .c-w a{ display:flex; align-items:center; justify-content:center; padding:4px 24px; } .c-w img{ width:24px; margin-right:12px; } .c-w p{ font:18px/25px Poppins; text-align:center; color:#fff; margin:0; } @media (max-width:444px){ .c-w a{ padding:4px 12px; } .c-w img{ width:24px; margin-right:8px; } .c-w p{ font:14px/25px Poppins; } } @media (max-width:335px){ .c-w p{ font:13px/25px Poppins; } } Únete al canal de WhatsApp de la SER "Me gusta desafiar y enfrentarme al público. Yo soy un ateo acérrimo y tengo un problema con la religión. De niño me la impusieron y solía ir todos los domingos a la iglesia y dar mi dinero. Sigo teniendo un problema con eso, con los cultos organizados y lo irónico que es que estas iglesias que tienen que dedicarse a dar y cuidar al prójimo al final no lo hagan. Son muy anticristianos. La religión tiene mucho de hipocresía. También es verdad que tenía muchas ganas de incendiar una iglesia", bromea el director sobre una de las mejores escenas de la película.En Memorias de un caracol se habla de extremismo religioso, pero también de adicciones, perversiones, violencia, sexo, salud mental, cuerpos no normativos, diversidad... Frente a muchas competidoras de la temporada de premios, como Del revés 2 (Pixar), Robot Salvaje (Dreamworks) o la independiente Flow, esta no es una película para un público infantil y familiar, sino que confía en un espectador dispuesto a entrar en una historia compleja y oscura a través de la animación. "Sin duda es una película para adultos. En realidad, depende de los padres si quieren mostrársela a sus hijos o llevarse a sus hijos. No aceptaría a nadie menor de 12 años. Creo que puede ser un poco traumático. Pero dicho esto, mis películas a menudo se enseñan en las escuelas como dispositivos educativos, así que es irónico. Guillermo del Toro dijo hace unos años en su discurso de los premios de la Academia que la animación no es un género, es un medio. Y me alegro mucho de que haya dicho eso, porque siempre lo he sentido. Tiene que ver con que a todos nos criaron con Disney, Pixar Animation y Warner Brothers. Por eso, gran parte de la animación estadounidense es para niños. Pero, por ejemplo, en los países de Europa del Este hay una fuerte tradición de animación surrealista para adultos. Algo está cambiando, el público se está dando cuenta de que la animación es para todas las edades y que lo importante es la historia", argumenta Adam Elliott.Si en sus anteriores trabajos contó con actores reconocidos como Geoffrey Rush y el fallecido Philip Seymour Hoffman, para este proyecto son Sarah Snook, la única hija del clan de los Succession, y Kodi Smit-McPhee, el actor revelación de El poder del perro, los que ponen voz a esta maravillosa fábula que reivindica a los inadaptados y el amor entre hermanos. Una obra mayor, ingeniosa, sorprendente y emocionante, capaz de unir la tragedia y la comedia, lo macabro y lo luminoso, la inocencia y la extravagancia, la ternura y la violencia, la desesperación y la esperanza. Memorias de un caracol, que ganó el premio a mejor largometraje en Annecy, el principal festival de animación, ha estado nominada a los Globos de Oro y ahora compite por el Oscar, es, ante todo, un relato vitalista frente al miedo y la hostilidad de un mundo cruel.José M. Romero Cubre la información de cine y series para El Cine en la SER y coordina la parte digital y las redes... Leer másLo más leídoLo más escuchadoPlayT12x24 | A quien madruga, RR le abraza15/02/2025Play"El Real Madrid tiene que olvidarse de esta guerra arbitral...": El perjuicio que supone la cruzada blanca contra el arbitraje16/02/2025PlayEl comunicado del Alavés contra el estamento arbitral, la entrevista a Álvaro García y las previas de los partidos ligueros de mañana16/02/2025PlayFlash Deportes | 23:0015/02/2025PlayMillás solo necesita 5 minutos para explicar el fenómeno Montoya y revela qué escena de una película es igual a su reacción16/02/2025'''
