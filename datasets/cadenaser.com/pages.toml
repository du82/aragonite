["https://cadenaser.com/nacional/2025/02/14/hbo-anuncia-la-nueva-temporada-de-euphoria-con-rosalia-como-estrella-invitada-cadena-ser"]
title = "HBO anuncia la nueva temporada de 'Euphoria' con Rosalía como estrella invitada  | Sociedad  | Cadena SER"
description = "La cantante catalana se unirá al campeón de la Super Bowl Marshawn Lynch interpretando roles fundamentales en la serie | Cadena SER"
full_description = '''SociedadHBO anuncia la nueva temporada de 'Euphoria' con Rosalía como estrella invitadaLa cantante catalana se unirá al campeón de la Super Bowl Marshawn Lynch interpretando roles fundamentales en la serieRosalía, en una imagen de archivo. / Marc PiaseckiAmpliarCerrarFacebookTwitterLinkedInWhatsAppRedacciónAgenciasCadena SER14/02/2025 - 21:46 UTCMadridHan pasado tres años desde que se estrenó la segunda temporada de 'Euphoria'. La huelga de guionistas y actores del pasado año, junto con la masiva popularidad que alcanzó el elenco desde su lanzamiento y que les ha permitido participar en otros proyectos, son solo algunos de los factores que han influido en esta demora. Ahora, la espera ha llegado a su fin, y HBO ya ha anunciado la tercera entrega de este conocido drama de adolescentes, que podría ver la luz el año que viene.Más informaciónAtresmedia lanza el tráiler de la nueva serie de 'Física o Química' y confirma la aparición de uno de sus personajes más míticosEl futuro de 'Los Misterios de Laura' vuelve a estar en el aire: "Tenemos cuatro capítulos escritos"Para esta nueva temporada el reparto original vuelve casi en su totalidad. Figuras como Zendaya, Hunter Schafer, Eric Dane, Jacob Elordi, Alexa Demie y Maude Apatow volverán a interpretar su papel en la pantalla, mientras que Martha Kelly y Chloe Cherry "han sido ascendidas a personajes habituales de la serie", según se ha desprendido del comunicado oficial publicado en X. "HBO anunció hoy el regreso del elenco principal y el nuevo elenco que protagonizará la tercera temporada de la serie dramática ganadora del Emmy Euphoria, así como miembros clave nuevos y recurrentes del equipo".HBO today announced the returning main cast and new cast starring in season three of the Emmy®-winning drama series Euphoria, as well as new and returning key crew members. Euphoria is created, written, directed and executive produced by Sam Levinson, stars Emmy winner Zendaya,…— euphoria (@euphoriaHBO) February 14, 2025 Además del elenco original, 'Euphoria' ha integrado a varias figuras conocidas para que interpreten papeles secundarios aunque importantes en el drama. Una de las artistas confirmadas ha sido Rosalía. No es la primera vez que la cantante catalana es relacionada con este drama juvenil. De hecho, durante la primera temporada, la artista compuso junto con Billie Eilish 'Lo vas a olvidar', una canción que sonaría durante el episodio especial dedicado a Hunter Schafer.Rosalía se une a otros nuevos miembros del elencoA la cantante española se unirán en este nuevo elenco el campeón de la Super Bowl Marshawn Lynch, además de Darrell Britt-Gibson, Priscilla Delgado, James Landry Hébert, Anna Van Patten y el protagonista de 'A Different World', Kadeem Hardison. De hecho, este último no ha dudado en mostrar su emoción por formar parte del nuevo reparto. "Es increíble volver a rodar con Zendaya", ha señalado.Esta última entrega, no obstante, no contará con Nika King, Austin Abrams y Algee Smith, miembros del reparto original y que interpretan a Leslie Bennett, Ethan y Chris McKay, respectivamente. Además, este drama incorporará como coproductor a Colleen Atwood, cuatro veces ganador en los Premios Oscar, además de Natasha Newman-Thomas como encargada del diseño del vestuario y a Francois Audouy como diseñador de producción. .c-w{ max-width:444px; width:100%; margin:32px auto; background:#00755E; border-radius:4px; display:flex; align-items:center; justify-content:center; } .c-w a{ display:flex; align-items:center; justify-content:center; padding:4px 24px; } .c-w img{ width:24px; margin-right:12px; } .c-w p{ font:18px/25px Poppins; text-align:center; color:#fff; margin:0; } @media (max-width:444px){ .c-w a{ padding:4px 12px; } .c-w img{ width:24px; margin-right:8px; } .c-w p{ font:14px/25px Poppins; } } @media (max-width:335px){ .c-w p{ font:13px/25px Poppins; } } Únete al canal de WhatsApp de la SER La serie, nominada 25 veces a los Premios Emmy y con nueve victorias a su espalda, ofrece una mirada a la vida de un grupo de estudiantes de secundaria mientras lidian con problemas de drogas, sexo y violencia. La tercera temporada de 'Euphoria' ya se encuentra rodándose en Los Ángeles, aunque se prevé que estos nuevos no verán la luz hasta 2026.Series televisiónSeries dramaZendayaLo más leídoLo más escuchadoPlayT12x24 | A quien madruga, RR le abraza15/02/2025Play"El Real Madrid tiene que olvidarse de esta guerra arbitral...": El perjuicio que supone la cruzada blanca contra el arbitraje16/02/2025PlayEl comunicado del Alavés contra el estamento arbitral, la entrevista a Álvaro García y las previas de los partidos ligueros de mañana16/02/2025PlayFlash Deportes | 23:0015/02/2025PlayMillás solo necesita 5 minutos para explicar el fenómeno Montoya y revela qué escena de una película es igual a su reacción16/02/2025'''
