["https://cadenaser.com/nacional/2025/02/07/feijoo-sigue-evitando-explicar-la-posicion-del-pp-sobre-la-propuesta-de-trump-en-gaza-hoy-toca-vivienda-cadena-ser"]
title = 'Feijóo sigue evitando explicar la posición del PP sobre la propuesta de Trump en Gaza: "Hoy toca vivienda"  | Política  | Cadena SER'
description = "Feijóo apuesta por recuperar las &#039;cuentas ahorro vivienda&#039; de Aznar para facilitar el acceso de los jóvenes | Cadena SER"
full_description = '''PolíticaFeijóo sigue evitando explicar la posición del PP sobre la propuesta de Trump en Gaza: "Hoy toca vivienda"Feijóo apuesta por recuperar las 'cuentas ahorro vivienda' de Aznar para facilitar el acceso de los jóvenesEl líder del PP, Alberto Núñez Feijóo, aborda el problema de la vivienda con asociaciones juveniles, este viernes en Madrid / Chema Moya (EFE)AmpliarCerrarFacebookTwitterLinkedInWhatsAppRedacciónCadena SER07/02/2025 - 13:55 UTCMadridEl PP sigue evitando pronunciarse sobre su posición sobre la propuesta del presidente de los EEUU, Donald Trump, en la Franja de Gaza. Alberto Núñez Feijóo ha presentado un plan de ayudas para facilitar a los menores de 40 años el acceso a un hogar y, cuando la prensa le ha preguntado sobre otras cuestiones como el reparto de migrantes o Palestina, él se ha limitado a decir: "Hoy toca vivienda".Feijóo apuesta por recuperar las 'cuentas ahorro vivienda' de Aznar que dará a los menores de 40 años una deducción en el IRPF equivalente al 20% de las aportaciones anuales que hagan al Estado, que podrán ascender hasta los 2.000 euros al año. Además, estas cantidades serán avaladas en el caso de que se quiera comprar una vivienda.El líder de la oposición anunció esta última medida de su plan de vivienda ante una decena de organizaciones de representación juvenil. Posteriormente, fuentes del PP confirmaron que esta medida será "muy parecida" a la cuenta ahorro vivienda que aprobó el Gobierno de José María Aznar y que fue derogada por José Luis Rodríguez Zapatero."La hucha hogar funcionará como un sistema de ahorro para los jóvenes hasta cumplir los 40 años. Podrán aportar 2.000 euros cada año hasta un máximo de aportación de 40.000 y le activaremos una deducción del 20% en el impuesto de la renta [sobre la cantidad aportada cada año]. Y, por tanto, con esos 40 000 de ahorro se ahorrarán otros 8.000 en impuestos", explicó Feijóo.Esta medida es adicional a otras ya anunciadas para los jóvenes. A principios de esta semana avanzó que si gobierna dará una deducción del 15% en el IRPF a todos los menores de 40 años que vivan en régimen de alquiler,y una rebaja progresiva de este mismo gravamen que propone para los jóvenes en sus primeros cuatro años de carrera profesional, en los que podrán ahorrarse este impuesto si dedican la cantidad íntegra que debían pagar a Hacienda a la compra de una vivienda. En materia fiscal, apuesta también por eximir del impuesto de donaciones las cantidades traspasadas entre familiares si se destinan a la adquisición de un inmueble. .c-w{ max-width:444px; width:100%; margin:32px auto; background:#00755E; border-radius:4px; display:flex; align-items:center; justify-content:center; } .c-w a{ display:flex; align-items:center; justify-content:center; padding:4px 24px; } .c-w img{ width:24px; margin-right:12px; } .c-w p{ font:18px/25px Poppins; text-align:center; color:#fff; margin:0; } @media (max-width:444px){ .c-w a{ padding:4px 12px; } .c-w img{ width:24px; margin-right:8px; } .c-w p{ font:14px/25px Poppins; } } @media (max-width:335px){ .c-w p{ font:13px/25px Poppins; } } Únete al canal de WhatsApp de la SER Otra de las promesas de Feijóo es bonificar el 75% en las rentas del alquiler a todos los propietarios que pongan en el mercado viviendas que hayan estado vacías durante los dos años anteriores, con el objetivo de estimular la oferta y bajar los precios. Y en el ámbito de la compra, hace tres semanas cerró un acuerdo con los 11 presidentes autonómicos del PP para ampliar hasta los 40 años la edad máxima para acceder a los avales que las comunidades están dando a sus ciudadanos para poder hipotecarse por hasta un 100% del valor de la vivienda.Alberto Núñez FeijóoPPFranja GazaDonald TrumpViviendaLo más leídoLo más escuchadoPlayT12x24 | A quien madruga, RR le abraza15/02/2025Play"El Real Madrid tiene que olvidarse de esta guerra arbitral...": El perjuicio que supone la cruzada blanca contra el arbitraje16/02/2025PlayEl comunicado del Alavés contra el estamento arbitral, la entrevista a Álvaro García y las previas de los partidos ligueros de mañana16/02/2025PlayFlash Deportes | 23:0015/02/2025PlayMillás solo necesita 5 minutos para explicar el fenómeno Montoya y revela qué escena de una película es igual a su reacción16/02/2025'''
