["https://cadenaser.com/comunitat-valenciana/2025/02/15/sadiq-salva-al-valencia-en-la-ceramica-con-un-empate-de-oro-ante-el-villarreal-1-1-radio-valencia"]
title = "Sadiq salva al Valencia en La Cerámica con un empate de oro ante el Villarreal (1-1)  | SER Deportivos Valencia  | Cadena SER"
description = "El tanto del delantero nigeriano en el 83’ permite al Valencia dormir fuera del descenso  | Cadena SER"
full_description = 'SER Deportivos ValenciaFútbolvalencia cfSadiq salva al Valencia en La Cerámica con un empate de oro ante el Villarreal (1-1)El tanto del delantero nigeriano en el 83’ permite al Valencia dormir fuera del descenso VILLARREAL, 15/02/2025.- El delantero del Valencia Sadiq Umar (c) celebra su gol contra el Villarreal, durante el partido de la jornada 24 de LaLiga entre el Villarreal CF y el Valencia CF, este sábado en el estadio de la Cerámica.- EFE/ Andreu Esteban / ANDREU ESTEBAN (EFE)AmpliarCerrarFacebookTwitterLinkedInWhatsAppEFEE. RequeniRadio Valencia15/02/2025 - 22:49 UTCVila-real (Castellón), 15 feb (EFE).- Un gol del delantero nigeriano Umar Sadiq en los últimos minutos del partido frenó la marcha del Villarreal hacia la Liga de Campeones y permitió al Valencia sumar un punto de oro en su pelea por escapar del descenso. El duelo autonómico no reflejó la diferencia clasificatoria entre ambos equipos y fue más equilibrado de lo esperado. El Villarreal, tras el gol de Gueye en la primera parte, tuvo el partido controlado, pero la ofensiva final del Valencia le permitió rescatar un punto cuando peor lo estaba pasando. Corberán situó de nuevo a Luis Rioja como lateral derecho en una defensa de cinco y al equipo de Marcelino le costó trabajo descifrar el entramado táctico de su rival, que acumulaba jugadores en la zona media para dejar los carriles libres para Gayá y Rioja. La fórmula le funcionó en los primeros minutos al Valencia, que fue el que protagonizó las primeras llegadas y disparos. El equipo de Marcelino, incómodo durante los primeros minutos, apeló a la paciencia y a la posesión para encontrar su ritmo habitual de juego. .c-w{ max-width:444px; width:100%; margin:32px auto; background:#00755E; border-radius:4px; display:flex; align-items:center; justify-content:center; } .c-w a{ display:flex; align-items:center; justify-content:center; padding:4px 24px; } .c-w img{ width:24px; margin-right:12px; } .c-w p{ font:18px/25px Poppins; text-align:center; color:#fff; margin:0; } @media (max-width:444px){ .c-w a{ padding:4px 12px; } .c-w img{ width:24px; margin-right:8px; } .c-w p{ font:14px/25px Poppins; } } @media (max-width:335px){ .c-w p{ font:13px/25px Poppins; } } Únete al canal de WhatsApp de la SER El Villarreal picó piedra hasta encontrar entre líneas a Baena, cuya movilidad y calidad permitió a su equipo comenzar a asomarse al área de Mamardashvili. Poco a poco el Villarreal acabó hundiendo en su área al Valencia, que se quedó sin ninguna capacidad de salida ni amenaza. Avisó Ayoze con un remate centrado y flojo y poco después fue Pape Gueye inauguró el marcador, tras asistencia de Yeremy Pino, con un disparo cruzado y potente desde fuera del área al que no pudo llegar Mamardashvili. El gol le hizo daño al Valencia y desató al Villarreal, que con su juego de toque habitual comenzó a encontrar a los hombres libres en su media punta. Baena, por dos ocasiones, rozó el segundo, pero el Valencia, con más corazón que fútbol, encontró fuerzas para sobrevivir y animarse a buscar el empate antes del descanso, aunque sin peligro real sobre la portería de Conde. Tras el descanso, el Valencia dio un paso adelante, elevando su presión en campo contrario y mostrando un punto mayor de agresividad. Corberán renovó su ataque con Iván Jaime y Sadiq, dos refuerzos del mercado de invierno, y adelantó la posición de Rioja, lo que permitió al Villarreal disfrutar de espacios para contragolpear. El Valencia, sin juego interior ni desborde, buscó en las acciones a balón parado la manera de aproximarse al empate, mientras el Villarreal, dinamizado con la entrada de Buchanan, tuvo la opción de sentenciar en un remate de Comesaña y en un gol anulado a Pépé por fuera de juego. Ya en el tramo final del partido, y con Rafa Mir en el campo, el Valencia se lanzó con todo a por el empate. Pepelu rozó el gol con un disparo que salió rozando el palo y poco después fue Sadiq el que pasaportó a la red de cabeza un rechace Conde a remate de Mir. El empate enloqueció en un tramo final en el que pudo pasar cualquier cosa. El Villarreal tuvo su opción en un remate de Comesaña, y el Valencia, liberado por fin de complejos, mostró ambición para buscar hasta el último instante un botín mayor y aunque ni las fuerzas ni su juego le alcanzaron para más durmió fuera del descenso a la espera del resto de resultados. Ficha técnica: 1 Villarreal: Diego Conde; Pau Navarro, Foyth, Costa, Cardona; Yeremy Pino (Buchanan, min. 65), Parejo, Gueye (Comesaña, min. 65), Álex Baena, Ayoze (Denis, min. 81) y Pépé (Barry, min. 74). 1 Valencia: Mamardashvili; Rioja (Rafa Mir, min. 77), Foulquier, Mosquera, Tárrega, Gayà; Pepelu, Javi Guerra, Diego López (Fran Pérez, min. 66), Almeida (Iván Jaime, min. 54) y Hugo Duro (Sadiq, min. 54). Goles: 1-0, min. 32: Gueye. 1-1, min. 83: Sadiq. Árbitro: De Burgos Bengoetxea (Comité vasco). Mostró tarjeta amarilla a Diego López, Gayá, Pepelu, Fran Pérez y Sadiq por el Valencia. Incidencias: Encuentro correspondiente a la vigésimo cuarta jornada de LaLiga EA Sports disputado en el estadio de La Cerámica ante 19.701 espectadores. En los prolegómenos del partido, los canteranos del Villarreal saltaron al campo para dirigirse a la afición y leer un manifiesto contra el odio. EFELo más leídoLo más escuchadoPlay"El Real Madrid tiene que olvidarse de esta guerra arbitral...": El perjuicio que supone la cruzada blanca contra el arbitraje16/02/2025PlayRoncero explota contra el arbitraje del Osasuna-Real Madrid: "la vida ha cambiado... ahora el Madrid es la víctima"15/02/2025PlayRufián confiesa qué es lo que más le gusta de Pedro Sánchez: "Lo valoro mucho"15/02/2025PlayUnicaja y Real Madrid disputarán la final de la Copa del Rey de Baloncesto y la guerra arbitral entre el Real Madrid y el CTA16/02/2025PlayFlash Deportes | 23:0015/02/2025'
