full_description = 'SociedadAsí celebró la SER el Día Mundial de la RadioVisitas de los oyentes, actuaciones en directo y muchas sorpresas más en un día para el recuerdoAmpliarCerrarFacebookTwitterLinkedInWhatsAppRedacciónCadena SER13/02/2025 - 22:27 UTCMadridLa SER celebró el Día de la Radio este 13 de febrero abriendo los estudios de algunos de los programas más destacados de su programación para que los oyentes formen parte de una fecha tan especial.La celebración de la jornada comenzó con Si amanece nos vamos, que abrió sus puertas a la audiencia en la noche del 12 al 13 y sigue con Hoy por Hoy, que contó con público durante El Abierto en el que Àngels Barceló analizó toda la actualidad política y social junto a sus colaboradores y también durante el tramo magazín, con las mejores entrevistas, historias y personajes.Día de la radio en la SER, en imágenesCarles Francino también recibió oyentes en La Ventana y compartió con ellos un programa muy especial, centrado como siempre en las historias humanas. Hora 25 de Aimar Bretos abrió así mismo sus puertas a la audiencia, para compartir con ellos su entrevista de actualidad, el análisis político en el que caben todas las voces y los reportajes que plantean preguntas sobre los temas que afectan a todos.Los oyentes también tuvieron la oportunidad de participar en dos de los programas más recientes de la SER: Ni tan bien, con Carolina Iglesias y Hora Veintipico, con Héctor de Miguel. El humor y el análisis más afilado de la actualidad se dan la mano en estos dos formatos.La jornada no acabó ahí, pues El Larguero dejó sus puertas abiertas para compartir con los oyentes en el estudio el mejor análisis deportivo, sin tremendismos, con humor y con rigor y El Faro celebró su ya tradicional encuentro con los oyentes en una noche más especiales del año para Mara Torres y su equipo. .c-w{ max-width:444px; width:100%; margin:32px auto; background:#00755E; border-radius:4px; display:flex; align-items:center; justify-content:center; } .c-w a{ display:flex; align-items:center; justify-content:center; padding:4px 24px; } .c-w img{ width:24px; margin-right:12px; } .c-w p{ font:18px/25px Poppins; text-align:center; color:#fff; margin:0; } @media (max-width:444px){ .c-w a{ padding:4px 12px; } .c-w img{ width:24px; margin-right:8px; } .c-w p{ font:14px/25px Poppins; } } @media (max-width:335px){ .c-w p{ font:13px/25px Poppins; } } Únete al canal de WhatsApp de la SER RadioOyentesLo más leídoLo más escuchadoPlayT12x24 | A quien madruga, RR le abraza15/02/2025Play"El Real Madrid tiene que olvidarse de esta guerra arbitral...": El perjuicio que supone la cruzada blanca contra el arbitraje16/02/2025PlayEl comunicado del Alavés contra el estamento arbitral, la entrevista a Álvaro García y las previas de los partidos ligueros de mañana16/02/2025PlayFlash Deportes | 23:0015/02/2025PlayMillás solo necesita 5 minutos para explicar el fenómeno Montoya y revela qué escena de una película es igual a su reacción16/02/2025'
