["https://cadenaser.com/canarias/2025/02/16/decenas-de-manifestantes-se-concentran-en-tenerife-contra-el-modelo-turistico-de-las-islas-bajo-canticos-de-canarias-no-se-vende-radio-club-tenerife"]
title = 'Decenas de manifestantes se concentran en Tenerife contra el modelo turístico de las islas, bajo cánticos de "Canarias no se vende"  | Sociedad  | Cadena SER'
description = "Los organizadores consideran que &quot;el turismo de masas está destruyendo Canarias&quot;, con una &quot;cifra completamente insostenible&quot; de casi dieciocho millones de turistas el año pasado. Abogan por una moratoria turística.  | Cadena SER"
full_description = '''SociedadDecenas de manifestantes se concentran en Tenerife contra el modelo turístico de las islas, bajo cánticos de "Canarias no se vende"Los organizadores consideran que "el turismo de masas está destruyendo Canarias", con una "cifra completamente insostenible" de casi dieciocho millones de turistas el año pasado. Abogan por una moratoria turística. Asistentes a la protesta convocada por 'Canarias tiene un límite' ante un congreso de industria turística en Santa Cruz de TenerifeAmpliarCerrarFacebookTwitterLinkedInWhatsAppRedacciónSER Las Palmas16/02/2025 - 13:54 UTCSanta Cruz de TenerifeVarias decenas de personas se han manifestado este domingo ante el congreso "FVW Travel Talk" de la industria turística alemana, que se celebra en Santa Cruz de Tenerife, para protestar por la gestión turística del archipiélago y defender a las islas de cara al futuro porque, han expresado lemas como el "Canarias no se vende, se ama y se defiende". Con bucios, silbatos y pancartas, manifestantes de todo tipo de edad se han reunido en plena Rambla de Santa Cruz de Tenerife, a la altura del Hotel Mencey de la capital. Esta convocatoria se suma a las pasadas el 20 de abril de 2024, que congregó a miles de personas en las distintas capitales de las Islas, para protestar contra el turismo masivo, y las últimas del 20 de octubre, en los núcleos turísticos de Tenerife y Gran Canaria."Vamos a hacer mucho ruido para que nos escuchen bien quién está dentro", espetó una de las voces manifestantes minutos antes de comenzar la reivindicación, convocada por 'Canarias tiene un límite', bajo la presencia y vigilancia de agentes de la Policía Nacional. Expresaron diferentes cosignas y reflejaron ese "grito social" que también fue manifestado en convocatorias anteriores, ante la gestión y el actual modelo económico del Archipiélago: "No es turismofobia, es superviviencia". "Menos cemento y más fundamento", se podía escuchar en los minutos iniciales."No ha cambiado absolutamente nada después de las grandes manifestaciones que hubo el año pasado, y estamos aquí para reivindicar que se pongan límites al turismo, una moratoria turística", ha expresado en declaraciones a los medios de comunicación el activista y documentalista Felipe Ravina. Ha aclarado que estas protestan "no van en contra el turismo" sino que solicitan que "se pongan límites", ya que será "positivo" para las islas: "Se va a poder ofrecer un turismo de mayor calidad y, también (una mejor calidad de vida) para que aquí vivimos. Ya todo el mundo sufre de alguna manera las consecuencias del turismo de masas"Ravina ha señalado que "gran parte de la población" es consciente de ese daño, y por diferentes motivos: "alguien compra tu propiedad para hacer una vivienda vacacional, el lugar de toda la vida lo transforman para hacer villas de lujo, vas al supermercado de toda la vida y ya no escuchas hablar español", ha enumerado. "Realmente los datos dicen que estamos prácticamente en el top de pobreza y de exclusión social. Por lo tanto, esa riqueza que se supone que genera (el turismo) no está llegando a la gente", ha puntualizado el documentalista tinerfeño, que ha señalado, además, cómo ese turismo "de masas" está "poco a poco deteriorando" las islas, "consumiendo más territorio" y afectando, cada vez, a la población.Preguntado por si habrán nuevas manifestaciones próximamente, ha confirmado que pronto anunciarán nuevas fechas porque lo que se trata, según ha explicado, es de "seguir mostrando" a la clase política que el "descontento" es "cada vez" mayor. "La gente va a seguir luchando". Además de pedir una moratoria turística, la manifestación de este domingo también ha estado impregnada por un "grito" en contra de los proyectos turísticos que están en marcha en las islas, como es el caso, en Tenerife, de Cuna del Alma y La Tejita, en el sur, así en la situación provocada por los vertidos al mar. .c-w{ max-width:444px; width:100%; margin:32px auto; background:#00755E; border-radius:4px; display:flex; align-items:center; justify-content:center; } .c-w a{ display:flex; align-items:center; justify-content:center; padding:4px 24px; } .c-w img{ width:24px; margin-right:12px; } .c-w p{ font:18px/25px Poppins; text-align:center; color:#fff; margin:0; } @media (max-width:444px){ .c-w a{ padding:4px 12px; } .c-w img{ width:24px; margin-right:8px; } .c-w p{ font:14px/25px Poppins; } } @media (max-width:335px){ .c-w p{ font:13px/25px Poppins; } } Únete al canal de WhatsApp de la SER "Seguimos nadando en aguas contaminadas. Seguimos con los mismos problemas tras años y años de lucha", ha apostillado Ravina, que ha indicado que "solo en Tenerife, tenemos más de 200 emisarios activos vertiendo aguas residuales en toda la costa. Si se muere el territorio, ¿dónde pongo yo el corazón?", rezaba una discreta pancarta entre la multitud de color y personas, un clamor "social" que ha pedido, de nuevo, "una moratoria" al turismo de las islas, así como un cambio del actual modelo por uno mucho más amable, que garantice "calidad" y futuro para las islas.ManifestacionesTurismoLo más leídoLo más escuchadoPlayT12x24 | A quien madruga, RR le abraza15/02/2025Play"El Real Madrid tiene que olvidarse de esta guerra arbitral...": El perjuicio que supone la cruzada blanca contra el arbitraje16/02/2025PlayEl comunicado del Alavés contra el estamento arbitral, la entrevista a Álvaro García y las previas de los partidos ligueros de mañana16/02/2025PlayFlash Deportes | 23:0015/02/2025PlayMillás solo necesita 5 minutos para explicar el fenómeno Montoya y revela qué escena de una película es igual a su reacción16/02/2025'''
