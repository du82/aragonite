["https://cadenaser.com/nacional/2025/01/29/la-audiencia-de-madrid-tumba-los-registros-a-juan-carlos-barrabes-que-ordeno-el-juez-peinado-cadena-ser"]
title = "La Audiencia de Madrid tumba los registros a Juan Carlos Barrabés que ordenó el juez Peinado  | Tribunales  | Cadena SER"
description = "La sala de apelaciones madrileña considera que el juez que investiga la actividad profesional de Begoña Gómez no justificó una decisión que acordó mientras el empresario estaba ingresado en el hospital | Cadena SER"
full_description = 'TribunalesLa Audiencia de Madrid tumba los registros a Juan Carlos Barrabés que ordenó el juez PeinadoLa sala de apelaciones madrileña considera que el juez que investiga la actividad profesional de Begoña Gómez no justificó una decisión que acordó mientras el empresario estaba ingresado en el hospitalCarlos Barrabés, en una imagen de archivo. AmpliarCerrarFacebookTwitterLinkedInWhatsAppPedro JiménezpedrojimenezgCadena SER29/01/2025 - 12:50 UTCLa Audiencia de Madrid ha dado la razón al empresario Juan Carlos Barrabés y a la Fiscalía que recurrieron los registros al exprofesor de la cátedra que codirigía Begoña Gómez en la Universidad Complutense. El juez, Juan Carlos Peinado, ordenó los registros sin el visto bueno del fiscal y sin adelantarle la decisión con un margen de cortesía. La diligencia se practicó cuando Barrabés, que sufre una grave enfermedad, estaba ingresado en el hospital. Dice el auto que Peinado "no justificó los motivos para practicar la diligencia tanto en su domicilio como en el de sus empresas, al hacer una referencia genérica e imprecisa y sin referir a dato alguno de la información proporcionada en los informes de la UCO ni mencionar los resultados de la instrucción que se inició en el mes de abril del pasado año" . Únicamente se basa, añade, "en la relación amistosa entre Juan Carlos Barrabés y Begoña Gómez, a los efectos, esposa del Presidente del Gobierno que habría intermediado en la adjudicación de contratos públicos, hechos todos conocidos desde el inicio de la investigación". A eso hay que sumar que "la fundamentación sobre proporcionalidad, es genérica e imprecisa, la que entendemos insuficiente para legitimar la injerencia". Además, el tribunal tampoco pasa por alto que el registro se efectuara con el investigado en el hospital y reprochan a Juan Carlos Peinado que "en la resolución que acuerda la medida no se motiva ni justifica esta situación de urgencia para la práctica de la citada diligencia cuando se encontraba el investigado ingresado en el hospital, máxime cuando el juzgado comprobó tal situación, habiendo transcurrido un mes desde que prestó declaración sin que conste exista hecho nuevo alguno que justifique la urgencia".Carlos BarrabésJuan Carlos PeinadoBegoña Gómez FernándezPedro Jiménez Redactor Jefe en la Cadena SER. Antes he pasado por los equipos de Hora 14, Radio Madrid, Fin de Semana,... Leer másLo más leídoLo más escuchadoPlayT12x24 | A quien madruga, RR le abraza15/02/2025Play"El Real Madrid tiene que olvidarse de esta guerra arbitral...": El perjuicio que supone la cruzada blanca contra el arbitraje16/02/2025PlayEl comunicado del Alavés contra el estamento arbitral, la entrevista a Álvaro García y las previas de los partidos ligueros de mañana16/02/2025PlayFlash Deportes | 23:0015/02/2025PlayMillás solo necesita 5 minutos para explicar el fenómeno Montoya y revela qué escena de una película es igual a su reacción16/02/2025'
