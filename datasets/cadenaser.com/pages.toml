["https://cadenaser.com/nacional/2025/01/30/la-fiscal-provincial-niega-haber-filtrado-el-expediente-tributario-del-novio-de-ayuso-cadena-ser"]
title = "La fiscal provincial niega haber filtrado el expediente tributario del novio de Ayuso  | Tribunales  | Cadena SER"
description = "Pilar Rodríguez, que no ha respondido a las acusaciones del caso, ha explicado que casi 600 personas tuvieron acceso a la documentación que se investiga por un presunto delito de revelación de secretos | Cadena SER"
full_description = 'TribunalesLa fiscal provincial niega haber filtrado el expediente tributario del novio de AyusoPilar Rodríguez, que no ha respondido a las acusaciones del caso, ha explicado que casi 600 personas tuvieron acceso a la documentación que se investiga por un presunto delito de revelación de secretosLa fiscal provincial de Madrid, Pilar Rodríguez (d), a su llegada este jueves al Tribunal Supremo / Borja Sánchez-Trillo (EFE)AmpliarCerrarFacebookTwitterLinkedInWhatsAppPedro JiménezpedrojimenezgCadena SER30/01/2025 - 11:14 UTCMadridEl juez que investiga al fiscal general del Estado, Álvaro García Ortiz, y a dos estrechos colaboradores por un presunto delito de revelación de secretos ha interrogado este jueves a la fiscal provincial de Madrid. Pilar Rodríguez está imputada por haber el elevado al jefe del Ministerio Público el expediente tributario abierto al novio de Ayuso junto con la denuncia que el Ministerio Público interpuso contra él por dos delitos fiscales y otro de falsedad documental. Álvaro García Ortiz requirió esa documentación con el objetivo de elaborar una nota de prensa que desmintiera el bulo que filtró la Comunidad de Madrid de que el fiscal había ofrecido un pacto a Alberto González Amador para cerrar el caso. La verdad era que fue primero el comisionista el que envió un correo en el reconocía sus delitos y pedía un pacto para evitar el juicio. El fiscal general del Estado niega su participación en la filtración del correo del novio de AyusoRodríguez ha respondido al juez, a la Fiscalía, que no ha formulado preguntas porque ha insistido en que la causa es nula, y a la Abogacía del Estado, pero no a las acusaciones. La investigada ha rechazado haber filtrado los documentos y ha asegurado que elevó el expediente en base a los principios de unidad y jerarquía que rigen en el Ministerio Público. El artículo 25 del Estatuto establece la obligación de los fiscales de dar cuenta a su superior jerárquico de los asuntos que tengan trascendencia mediática. Álvaro García Ortiz, dentro de las funciones que le corresponden, pidió el expediente y ella lo elevó. El propio fiscal general declaró este miércoles que "yo di la orden y los fiscales actuaron por delegación". Cientos de personas con acceso a los documentosLa investigada también ha explicado el recorrido de esos documentos desde que la defensa de Alberto González Amador envió el correo con la confesión a una cuenta genérica de la Fiscalía de Delitos Económicos y hasta que entró la denuncia en el decanato de los juzgados de Plaza de Castilla. El expediente tributario y la denuncia pasaron por las manos de 571 personas relacionadas con la Fiscalía y en el caso del correo electrónico fueron 60 las que tuvieron acceso directo al mismo, sin contar con el entorno del comisionista y de la Presidenta de la Comunidad de Madrid que pudieran haber tenido acceso al mismo.Alberto González AmadorIsabel Díaz AyusoFiscalesÁlvaro García OrtizPedro Jiménez Redactor Jefe en la Cadena SER. Antes he pasado por los equipos de Hora 14, Radio Madrid, Fin de Semana,... Leer másLo más leídoLo más escuchadoPlayT12x24 | A quien madruga, RR le abraza15/02/2025Play"El Real Madrid tiene que olvidarse de esta guerra arbitral...": El perjuicio que supone la cruzada blanca contra el arbitraje16/02/2025PlayEl comunicado del Alavés contra el estamento arbitral, la entrevista a Álvaro García y las previas de los partidos ligueros de mañana16/02/2025PlayFlash Deportes | 23:0015/02/2025PlayMillás solo necesita 5 minutos para explicar el fenómeno Montoya y revela qué escena de una película es igual a su reacción16/02/2025'
author = "Pedro Jiménez García"
