["https://cadenaser.com/nacional/2023/04/20/la-historia-de-un-policia-acusado-de-estar-a-sueldo-de-narcos-perdi-40-kilos-intentando-demostrar-mi-inocencia-escuche-miles-de-mis-propias-llamadas-cadena-ser"]
title = 'La historia de un policía acusado de estar a sueldo de narcos: "Perdí 40 kilos intentando demostrar mi inocencia, escuché miles de mis propias llamadas"  | Hora 25  | Cadena SER'
description = "El podcast &#039;Caso Macedonia: historia de una persecución&#039; cuenta cómo se desarrolló una gran investigación que acabó apuntando al subinspector de los mossos d&#039;Esquadra José Ranea   | Cadena SER"
full_description = '''Hora 25TribunalesLa historia de un policía acusado de estar a sueldo de narcos: "Perdí 40 kilos intentando demostrar mi inocencia, escuché miles de mis propias llamadas"El podcast 'Caso Macedonia: historia de una persecución' cuenta cómo se desarrolló una gran investigación que acabó apuntando al subinspector de los mossos d'Esquadra José Ranea Play/PauseMostrar OpcionesCaso Macedonia: historia de una persecución01:07:53CerrarDescargarCompartirCerrarCompartirFacebookTwitterLinkedinWhatsappEmbeberEl código iframe se ha copiado en el portapapelesFacebookTwitterLinkedInWhatsAppV. Olazábalvic_olazabalA. BretosCadena SER20/04/2023 - 20:20 UTCMadridLos periodistas Aimar Bretos y Víctor Olazábal reconstruyen en un podcast estrenado en Hora 25 la macrocausa que dirigió el juez de Barcelona Joaquín Aguirre para desmontar una supuesta trama de corrupción policial vinculada al tráfico de drogas. 'Caso Macedonia: historia de una persecución' se divide en tres episodios que siguen el curso de las investigaciones desde la enorme maraña inicial en la que estaban implicados distintos cuerpos policiales hasta su desenlace en la figura de un hombre, un solo agente policial, sobre el que se acaba depositando el grueso de las acusaciones: José Ranea, subinspector de los Mossos d'Esquadra.Asuntos Internos de los mossos pinchan los teléfonos de Ranea. De esas grabaciones, los investigadores extraen la conclusión de que Ranea está a sueldo de los narcos. Él hace lo imposible para desmontar esa teoría. "Perdí 40 kilos después de pasarme más de un año escuchando mis llamadas para demostrar mi inocencia", dice Ranea a los dos periodistas de Hora 25, que acuden hasta su pueblo, Vilanovai la Geltrú, en la provincia de Barcelona, para escuchar su testimonio. "En la puerta de prisión me enteré de quiénes eran mis amigos y quiénes no". Este caso pasa a ser la investigación de su vida. Pagará un precio personal y profesional muy alto en el camino. "Ha sido un via crucis con muchas estaciones", dice hoy el agente.Más informaciónESPECIAL | Escucha el podcast 'Caso Macedonia: historia de una persecución'El podcast 'Caso Macedonia: historia de una persecución' recorre a través del testimonio de Ranea todo lo que ocurre en los trece años que duró el caso, cuya sentencia se dictó en septiembre de 2022. Junto a su relato, el de los periodistas que mejor conocen el caso porque lo siguieron en las distintas etapas de la investigación: Andrea Villoria, Anna Punsí, Jesús García Bueno y Carlos Quílez. ¿Cómo empezó? ¿Cuál era el objetivo del juez? ¿Qué tipo de policía era Ranea? ¿Cómo fue su detención y su juicio? ¿Cómo ha cambiado la relación entre los policías y sus confidentes a raíz del Caso Macedonia?El reportaje se ha estrenado de forma íntegra en Hora 25 y sus tres episodios se encuentran disponibles en SER Podcast, en las plataformas de audio y en cadenaser.com.Episodio 1 | Policías, narcos y confidentesPlay/PauseMostrar OpcionesEpisodio 1 | Policías, narcos y confidentes17:28CerrarDescargarCompartirCerrarCompartirFacebookTwitterLinkedinWhatsappEmbeberEl código iframe se ha copiado en el portapapelesEpisodio 2 | Un policía de callePlay/PauseMostrar OpcionesEpisodio 2 | Un policía de calle21:44CerrarDescargarCompartirCerrarCompartirFacebookTwitterLinkedinWhatsappEmbeberEl código iframe se ha copiado en el portapapelesEpisodio 3 | Ya nada es como antesPlay/PauseMostrar OpcionesEpisodio 3 | Ya nada es como antes31:07CerrarDescargarCompartirCerrarCompartirFacebookTwitterLinkedinWhatsappEmbeberEl código iframe se ha copiado en el portapapelesInvestigación policialMossos d'EsquadraLo más leídoLo más escuchadoPlayLoreto Ochando habla sin tapujos de la gestión de Mazón: "La alarma a las ocho y once minutos, cuando los cadáveres flotaban por las calles"15/02/2025PlayEsther Palomera tira de ironía para analizar el caso del fiscal general del Estado: “Se le ha imputado por desvelar un secreto que conocía medio Madrid”14/02/2025PlayRufián confiesa qué es lo que más le gusta de Pedro Sánchez: "Lo valoro mucho"15/02/2025PlayHora 14 Fin de Semana (15/02/2025)15/02/2025PlayAna Belén revela su desternillante método para calentar la voz: se lo enseñaron ‘Los Javis’ y desde entonces siempre recurre a él14/02/2025'''
