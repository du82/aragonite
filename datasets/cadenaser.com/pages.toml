["https://cadenaser.com/nacional/2025/01/30/la-asociacion-francisco-de-vitoria-lleva-a-europa-sus-alegaciones-contra-la-reforma-legal-del-acceso-a-la-carrera-judicial-cadena-ser"]
title = "La Asociación Francisco de Vitoria lleva a Europa sus alegaciones contra la reforma legal del acceso a la carrera judicial  | Tribunales  | Cadena SER"
description = "La segunda asociación de jueces en España considera que hay medidas que ponen en riesgo la independencia judicial | Cadena SER"
full_description = 'TribunalesLa Asociación Francisco de Vitoria lleva a Europa sus alegaciones contra la reforma legal del acceso a la carrera judicialLa segunda asociación de jueces en España considera que hay medidas que ponen en riesgo la independencia judicialVista de la entrada principal del Palacio de Justicia de PonferradaAmpliarCerrarFacebookTwitterLinkedInWhatsAppPedro JiménezpedrojimenezgCadena SER30/01/2025 - 09:29 UTCLa Asociación Judicial Francisco de Vitoria ha enviado al Comisario de Justicia Europeo sus alegaciones contra la reforma que plantea el Gobierno para el acceso a las carreras judicial y fiscal que amplía las becas y garantiza que uno de cada cuatro jueces entren por el cuarto turno. Además, soluciona definitivamente la situación del millar de jueces sustitutos que ejercen en España.La segunda asociación por número de afiliados considera que hay "elementos positivos", pero subraya que los negativos ponen en grave riesgo la independencia judicial y que estas reformas deben hacerse con un "consenso amplio". Medidas que amenazan los principios fundamentales de igualdad, mérito y capacidad, los cuales deben prevalecer en cualquier proceso de acceso, promoción y estabilización en la carrera judicial. Play/PauseMostrar Opciones"Increíble que no se hubiese hecho hasta ahora": Aimar Bretos analiza las medidas de la reforma de la justicia05:31CerrarDescargarCompartirCerrarCompartirFacebookTwitterLinkedinWhatsappEmbeberEl código iframe se ha copiado en el portapapelesEspecialmente el concurso forzoso, la estabilización de jueces sustitutos y magistrados suplentes, y la "posible politización" del sistema a través de organismos dependientes del Ejecutivo. Estas reformas, entienden que lejos de solucionar los problemas estructurales del sistema judicial, podrían exacerbarlos al generar desigualdades y comprometer la calidad profesional de los jueces. .c-w{ max-width:444px; width:100%; margin:32px auto; background:#00755E; border-radius:4px; display:flex; align-items:center; justify-content:center; } .c-w a{ display:flex; align-items:center; justify-content:center; padding:4px 24px; } .c-w img{ width:24px; margin-right:12px; } .c-w p{ font:18px/25px Poppins; text-align:center; color:#fff; margin:0; } @media (max-width:444px){ .c-w a{ padding:4px 12px; } .c-w img{ width:24px; margin-right:8px; } .c-w p{ font:14px/25px Poppins; } } @media (max-width:335px){ .c-w p{ font:13px/25px Poppins; } } Únete al canal de WhatsApp de la SER GobiernoReforma judicialAJFVPedro Jiménez Redactor Jefe en la Cadena SER. Antes he pasado por los equipos de Hora 14, Radio Madrid, Fin de Semana,... Leer másLo más leídoLo más escuchadoPlayT12x24 | A quien madruga, RR le abraza15/02/2025Play"El Real Madrid tiene que olvidarse de esta guerra arbitral...": El perjuicio que supone la cruzada blanca contra el arbitraje16/02/2025PlayEl comunicado del Alavés contra el estamento arbitral, la entrevista a Álvaro García y las previas de los partidos ligueros de mañana16/02/2025PlayFlash Deportes | 23:0015/02/2025PlayMillás solo necesita 5 minutos para explicar el fenómeno Montoya y revela qué escena de una película es igual a su reacción16/02/2025'
