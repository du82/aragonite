full_description = 'A Vivir AragónActualidad¡Pies, para qué os quiero!: Los Dragones preparan la Maratón de Zaragoza Son el grupo de running de Special Olympics, una muestra de integración a través del deporte Play/PauseMostrar Opciones¡Pies, para qué os quiero! ( 15/02/2025)14:17CerrarDescargarCompartirCerrarCompartirFacebookTwitterLinkedinWhatsappEmbeberEl código iframe se ha copiado en el portapapelesFacebookTwitterLinkedInWhatsAppRedacciónCadena SER15/02/2025 - 13:00 UTCZaragoza Tienen algún tipo de discapacidad intelectual, pero eso no les impide correr una maratón. Para ello entrenan junto a voluntarios los martes y jueves en Zaragoza. Son Los Dragones, el grupo de corredores de Special Olympics Aragón. Su coordinador, Sergio Catarecha, nos visita esta semana junto a David Constante de Runningzgz. Los dos nos explicarán cómo crean una burbuja dentro de la carrera de 42 kilómetros para que puedan llegar a meta acompañados de padres y voluntarios. Para ellos, cuya vida diaria ya es una carrera de fondo, es chute de energía y una motivación especial. RunnerAragónZaragozaLo más leídoLo más escuchadoPlayLa Ventana a las 16h | Nieves Concostrina se opone a San Valentín14/02/2025PlayLa Ventana a las 16h | "Están más en la edad del pavo que mis hijas": el caso de la pareja de personas mayores con Alzheimer que ha recaudado 90.000 firmas14/02/2025PlayEl amor en San Valentín tiene nombre de canción: estas son las más escuchadas14/02/2025PlayHora 14 Fin de Semana: La Portada (15/02/2025)15/02/2025PlayLa palabra del día | Poliamor14/02/2025'
