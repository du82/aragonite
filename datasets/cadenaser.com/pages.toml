["https://cadenaser.com/nacional/2025/01/29/detectados-los-cinco-elementos-basicos-para-la-vida-en-un-asteroide-cadena-ser"]
title = "Detectados los cinco elementos básicos para la vida en un asteroide  | Cadena SER  | Cadena SER"
description = "Una nave espacial de la NASA logró recolectar y enviar a la Tierra muestras del asteroide Bennu | Cadena SER"
full_description = 'Ciencia y tecnologíaDetectados los cinco elementos básicos para la vida en un asteroideUna nave espacial de la NASA logró recolectar y enviar a la Tierra muestras del asteroide BennuImagen del asteroide Bennu tomada por una sonda espacial de la NASA. / NASA (Reuters)AmpliarCerrarFacebookTwitterLinkedInWhatsAppJavier GregoriJavierGregoriCadena SER29/01/2025 - 16:00 UTCUn equipo de científicos de japón ha detectaron las cinco nucleobases (es decir, los bloques que construyen el ADN y el ARN) en muestras traídas a la Tierra del asteroide Bennu. Una nave de la NASA, la OSIRIS-REx, logró viajar hasta esta enorme roca espacial, recolectar la mayor cantidad de material y traerlo de vuelta a nuestro planeta de forma aislada y segura. Estos nuevos hallazgos corroboran la teoría de que los asteroides, pequeños cuerpos sin aire que se encuentran en el interior del Sistema Solar, aportaron los elementos químicos imprescindibles para el desarrollo de la vida en la Tierra hace ya miles de millones de años. Hasta ahora, solo dos países (Estados Unidos y Japón) han logrado realizar con éxito misiones espaciales para recolectar muestras de asteroides, pero la nave de la NASA ha conseguido traer la mayor cantidad de material, que se mantiene sin contaminar desde el origen de nuestro sistema solar. En concreto, la misión OSIRIS-REX recolectó 21 gramos de muestras del asteroide Bennu (una gran roca espacial que tienen una edad de 4.500 millones de años) y logró traerlas a la Tierra el pasado mes de septiembre del 2023. .c-w{ max-width:444px; width:100%; margin:32px auto; background:#00755E; border-radius:4px; display:flex; align-items:center; justify-content:center; } .c-w a{ display:flex; align-items:center; justify-content:center; padding:4px 24px; } .c-w img{ width:24px; margin-right:12px; } .c-w p{ font:18px/25px Poppins; text-align:center; color:#fff; margin:0; } @media (max-width:444px){ .c-w a{ padding:4px 12px; } .c-w img{ width:24px; margin-right:8px; } .c-w p{ font:14px/25px Poppins; } } @media (max-width:335px){ .c-w p{ font:13px/25px Poppins; } } Únete al canal de WhatsApp de la SER Descubrimiento histórico Y en estas muestras, se ha descubierto amoníaco y materia orgánica soluble rica en nitrógeno, según los resultados que publica la revista “Nature Astronomy” Además, entre estos nuevos hallazgos, un grupo de científicos japoneses detectaron las cinco bases nitrogenadas, es decir, las moléculas necesarias para construir ADN y ARN, lo que respalda la teoría de que los asteroides podrían haber traído los componentes básicos de la vida a la Tierra. El equipo internacional de científicos que está analizando estas muestras de OSIRIS-REx, está dirigido por Daniel Glavin y Jason Dworkin, investigadores del famoso Centro Goddard de la NASA. Las valiosas muestras del asteroide Bennu se han manipulado siempre bajo una capa de nitrógeno para evitar la contaminación por la atmósfera terrestre. Hasta el momento, se ha podido estudiar una pequeña muestra de 17,75 mg y se analizó en busca de N-heterociclos (moléculas orgánicas con una estructura de anillo que contienen carbono y nitrógeno) mediante espectrometría de masas de alta resolución en la Universidad de Kyushu, en Japón. Análisis espacial Ese análisis ha revelado que la concentración de N-heterociclos es de aproximadamente 5 nmol/g, entre 5 y 10 veces mayor que la reportada en el asteroide Ryugu, cuyas muestras fueron recoleptadas y traídas a la Tierra por una nave japonesa. Además de las cinco bases nitrogenadas (adenina, guanina, citosina, timina y uracilo) necesarias para la formación del ADN y el ARN, los investigadores nipones también encontraron xantina, hipoxantina y ácido nicotínico (vitamina B3). Sin embargo, tadavía queda mucho trabajo por delante, ya que estos “hallazgos indican que es necesario estudiar más a fondo la química de las bases nitrogenadas en las muestras de Bennu”, explica el profesor Naraoka. Otro resultado importante de este proyecto es que, al comparar los meteoritos con las muestras del asteroide Bennu, se ha creado una referencia para el reanálisis de otros meteoritos en colecciones de todo el mundo. NASAEspacio exteriorAsteroidesVidaLa TierraSistema solarJavier Gregori Periodista especializado en ciencia y medio ambiente. Desde 1989 trabaja en los Servicios Informativos... Leer másLo más leídoLo más escuchadoPlayT12x24 | A quien madruga, RR le abraza15/02/2025Play"El Real Madrid tiene que olvidarse de esta guerra arbitral...": El perjuicio que supone la cruzada blanca contra el arbitraje16/02/2025PlayEl comunicado del Alavés contra el estamento arbitral, la entrevista a Álvaro García y las previas de los partidos ligueros de mañana16/02/2025PlayFlash Deportes | 23:0015/02/2025PlayMillás solo necesita 5 minutos para explicar el fenómeno Montoya y revela qué escena de una película es igual a su reacción16/02/2025'
