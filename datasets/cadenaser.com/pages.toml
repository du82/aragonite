["https://cadenaser.com/audio/1739626292573"]
title = "Vivienda, gasolina y comida: el alto coste para las familias cuyos hijos reciben tratamientos contra el cáncer fuera de su casa - Hora 14 Aragón (15/02/2025) | Cadena SER"
description = "<p>La escasez de vivienda y los altos precios pasan factura a las familias de los menores con cáncer cuando deben trasladarse para recibir tratamiento a otras ciudades. Se enfrentan a alquileres temporales que superan los 2.000 euros al mes, mientras tienen que seguir haciendo frente a los gastos de su vivienda habitual.</p> | Cadena SER"
