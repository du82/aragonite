["https://cadenaser.com/nacional/2025/02/10/el-detalle-que-refleja-el-gran-cambio-del-fc-barcelona-celebran-los-rechaces-defensivos-como-si-fueran-goles-cadena-ser"]
title = "El detalle que refleja el estado de euforia del FC Barcelona: Hansi Flick les ha convencido por completo  | Fútbol  | Cadena SER"
description = "El FC Barcelona de Hansi Flick vuelve a meterse de lleno en la lucha por LaLiga | Cadena SER"
full_description = 'Carrusel DeportivoFútbolEl detalle que refleja el estado de euforia del FC Barcelona: Hansi Flick les ha convencido por completoEl FC Barcelona de Hansi Flick vuelve a meterse de lleno en la lucha por LaLigaPlay/PauseMostrar OpcionesEl detalle que refleja el gran cambio del FC Barcelona: "Celebran los rechaces defensivos como si fueran goles"04:09CerrarDescargarCompartirCerrarCompartirFacebookTwitterLinkedinWhatsappEmbeberEl código iframe se ha copiado en el portapapelesFacebookTwitterLinkedInWhatsAppDavid Justodavidjusto_Cadena SER10/02/2025 - 09:21 UTCMadridEl FC Barcelona se ha impuesto este fin de semana por un gol a cuatro al Sevilla FC para volver a meterse de lleno en la lucha por LaLiga. Después de superar un bache de resultados negativos, en los que apenas pudieron sumar seis puntos de los últimos 24, los de Hansi Flick han vuelto a la senda de la victoria con el objetivo de recuperar el liderato de la competición. Gracias a esta victoria, y al empate entre el Real Madrid y el Atlético del pasado sábado, el conjunto catalán vuelve a estar a tan solo dos puntos del liderato de una liga muy disputada.Más información"La gente se ha ido en dos estadios consecutivos porque no quiere ver al Barça someter a su equipo": la nueva realidad de los pupilos de FlickEl Barça confirma la pelea por LaLiga: tras golear al Sevilla por 1-4De hecho, los últimos resultados del FC Barcelona les han aupado como los grandes favoritos al título liguero. En la última encuesta realizada por Carrusel Deportivo, el FC Barcelona es el gran favorito a la victoria final de LaLiga con más de un 85% de los votos. Una encuesta sobre la que se ha hablado largo y tendido en la Cadena SER, donde hemos analizado el gran cambio del FC Barcelona para volver a ser aquel equipo que maravilló a comienzos a temporada. A pesar de que algunos como Antón Meana pensaban que el conjunto catalán estaba muy tocado en Liga, y que no iba a ser capaz de recuperarse, ha conseguido darle la vuelta a la situación. Hansi Flick devuelve la ilusiónTodo ello, tal y como explica Lluís Flaquer, gracias a un Hansi Flick que ha sido capaz de devolver a sus jugadores a su mejor nivel: "El papel de Hansi Flick es tremendo. Repasas jugador por jugador y ves a Kounde a un nivel alto, a Balde en uno de sus mejores momentos y a Pedri rindiendo a su máximo nivel. Pero no solo eso. También ha recuperado a Eric García para la causa, ha conseguido que jugadores como Raphinha hayan llegado a su prime y que Lewandowski esté marcando más goles que nunca. El 99% de los jugadores está rindiendo a máximo nivel y la responsabilidad digo yo que es del entrenador". Un Hansi Flick que les ha exprimido a nivel físico pero que, además, les ha convencido con sus ideas para poder llevar al equipo a un nuevo nivel: "Más allá del físico, lo que llama la atención es el convencimiento de todos en lo que les propone el entrenador. Los jugadores han hecho suya la idea de Flick". Una idea arriesgada, tanto por los peligros que asumen en defensa como por el desgaste que supone para jugadores como Raphinha, pero que ha conseguido unir todavía más al vestuario: "Son conscientes de que se les abren las puertas a hacer una temporada brillante cuando hace 10 meses esta misma plantilla acabó como acabó. Flick ha convencido de que su idea les puede llevar a buen puerto".El gran cambio del FC BarcelonaPor todo ello, el equipo de Carrusel Deportivo ha llegado a la conclusión de que esta unión es una de las grandes fortalezas del FC Barcelona "En esa unión de grupo está una de las claves. El equipo cree que puede ir sacando adelante los partidos independientemente de los obstáculos que pueda encontrarse en el camino. Han llegado a un momento decisivo de la temporada en un estado óptimo en lo físico, en lo mental y en lo futbolístico". En ese momento, los colaboradores se han fijado en un momento concreto del encuentro en el que Iñigo Martínez ha celebrado por todo lo alto una intercepción defensiva. Tanto o incluso más que si hubieran marcado un gol. .c-w{ max-width:444px; width:100%; margin:32px auto; background:#00755E; border-radius:4px; display:flex; align-items:center; justify-content:center; } .c-w a{ display:flex; align-items:center; justify-content:center; padding:4px 24px; } .c-w img{ width:24px; margin-right:12px; } .c-w p{ font:18px/25px Poppins; text-align:center; color:#fff; margin:0; } @media (max-width:444px){ .c-w a{ padding:4px 12px; } .c-w img{ width:24px; margin-right:8px; } .c-w p{ font:14px/25px Poppins; } } @media (max-width:335px){ .c-w p{ font:13px/25px Poppins; } } Únete al canal de WhatsApp de la SER Algo que también han hecho otros jugadores como Raphinha y Gerard Martín en acciones posteriores, demostrando así la implicación de este equipo con las ideas de Hansi Flick: "Celebran los rechaces defensivos como si fueran goles marcados. Cuando juegas con tanta convicción, se crea como una especie de fanatismo en torno al entrenador que parece que si te lo dice Flick te lo crees". Todo esto, unido a los ajustes realizados por el entrenador, convierten al FC Barcelona en aspirante a todo: "Son pequeñas decisiones que acaban construyendo un equipo que es semifinalista de la Copa del Rey, que está sentado en el sofá viendo como se pelean los demás por entrar en octavos de Champions League y que tiene en su mano ganar LaLiga".FlickDeportesFútbolFC BarcelonaLigas fútbolDavid Justo (Astrabudua, 1991) Periodista especializado en tecnología que aborda la vida digital desde otro punto... Leer másLo más leídoLo más escuchadoPlay"El Real Madrid tiene que olvidarse de esta guerra arbitral...": El perjuicio que supone la cruzada blanca contra el arbitraje16/02/2025PlayRoncero explota contra el arbitraje del Osasuna-Real Madrid: "la vida ha cambiado... ahora el Madrid es la víctima"15/02/2025PlayRufián confiesa qué es lo que más le gusta de Pedro Sánchez: "Lo valoro mucho"15/02/2025PlayUnicaja y Real Madrid disputarán la final de la Copa del Rey de Baloncesto y la guerra arbitral entre el Real Madrid y el CTA16/02/2025PlayFlash Deportes | 23:0015/02/2025'
