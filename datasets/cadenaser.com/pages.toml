["https://cadenaser.com/nacional/2025/02/14/ninos-como-arma-de-guerra-cadena-ser"]
title = "Niños como arma de guerra  | Punto de Fuga  | Cadena SER"
description = "Naciones Unidas calcula que entre 2005 y 2020 más de 93.000 menores fueron reclutados como niños soldado, y las ONG advierten un aumento de la violencia contra la infancia. Los límites a la justicia universal favorecen la impunidad de sus criminales | Cadena SER"
full_description = 'Punto de FugaInternacionalNiños como arma de guerraNaciones Unidas calcula que entre 2005 y 2020 más de 93.000 menores fueron reclutados como niños soldado, y las ONG advierten un aumento de la violencia contra la infancia. Los límites a la justicia universal favorecen la impunidad de sus criminalesPlay/PauseMostrar OpcionesLos niños como arma de guerra29:56CerrarDescargarCompartirCerrarCompartirFacebookTwitterLinkedinWhatsappEmbeberEl código iframe se ha copiado en el portapapelesFacebookTwitterLinkedInWhatsAppP. MoránPablo_MoranJ. Bañuelos@JaviBanuelosL. RieraLuciaRBCCadena SER15/02/2025 - 07:00 UTCLa infancia siempre es víctima inocente de todas las guerras, pero en ocasiones, los menores son también instrumento de guerra, forzados a participar como niños soldado. Naciones Unidas calcula que entre 2005 y 2020 más de 93.000 niños fueron reclutados y utilizados como parte de conflictos. El 12 de febrero se ha celebrado el Día Internacional contra el Uso de Niños Soldado y Amnistía Internacional ha querido poner el foco en el sufrimiento de los niños y niñas de Haití como consecuencia de la violencia de las bandas criminales, que no ha dejado de crecer en el país desde el asesinato del presidente Jovenel Moïse hace cuatro años.“A día de hoy, el 85% de Puerto Príncipe está bajo el control de las bandas criminales”, explica Pilar San Martín, coordinadora del equipo de Respuesta de Crisis de las Américas. Se estima que solo el año pasado murieron 5.600 personas por la violencia de las pandillas, que reclutan a la fuerza a niños, para realizar robos y defender armados los territorios que controlan, y niñas, para violarlas y prostituirlas. “En Haití lamentablemente el aborto no es libre, entonces muchas de las niñas intentan interrumpir su embarazo con métodos que las ponen en riesgo. Tenemos casos de niñas que bebieron lejía”, asegura San Martín. En su informe, la organización documenta los innumerables abusos contra la infancia, que incluyen el reclutamiento en bandas criminales, la violencia sexual, secuestros, homicidios y lesiones.En otros países como México, que oficialmente no es un territorio en conflicto, la violencia de las bandas criminales también tiene un impacto devastador para la infancia. “México es el corredor humanitario más peligroso del mundo por la cantidad de secuestros, extorsiones, robos, que vive la población movilidad­ –los migrantes extranjeros, pero también los desplazados internos­–”, cuenta Fátima Andraca, directora de Programas y Respuesta Humanitaria de Save The Children Mexico.Han encontrado en la ruta niñas de unos doce años víctimas de violaciones y violencia de género que llegan traumatizadas a la frontera y, cada vez más, sin acompañar por ningún adulto, lo que las hace aún más vulnerables. Entre otros, Andraca ha conocido el caso de una niña de cuatro años que estuvo cuatro días secuestrada. “Imagínate lo que eso genera en su vida, en su desarrollo, en su salud mental”, incide.Las violaciones a los derechos humanos que se han dado contra niñas secuestradas por ejemplo por la guerrilla colombiana, violadas repetidamente, obligadas a abortar, perseguidas y torturadas de múltiples formas, tienen difícil persecución en la legislación internacional. Ruth María Abril, profesora del CEU, experta en Derecho Internacional Humanitario, sitúa el problema en la lentitud de la justicia. “La justicia colombiana ha definido los marcos legales sobre los que se va a enjuiciar a las personas que han cometido estos crímenes y ahora tienen que ir enjuiciando uno por uno”, explica. “Pero en el medio hay muchos que ya se han quedado fuera. De hecho, alguno de los jefes de la guerrilla está ahora en el Parlamento colombiano”. El resultado es que muchos de estos crímenes de guerra quedan impunes. .c-w{ max-width:444px; width:100%; margin:32px auto; background:#00755E; border-radius:4px; display:flex; align-items:center; justify-content:center; } .c-w a{ display:flex; align-items:center; justify-content:center; padding:4px 24px; } .c-w img{ width:24px; margin-right:12px; } .c-w p{ font:18px/25px Poppins; text-align:center; color:#fff; margin:0; } @media (max-width:444px){ .c-w a{ padding:4px 12px; } .c-w img{ width:24px; margin-right:8px; } .c-w p{ font:14px/25px Poppins; } } @media (max-width:335px){ .c-w p{ font:13px/25px Poppins; } } Únete al canal de WhatsApp de la SER Impunidad de los crímenes de guerra contra la infanciaPara evitar esa impunidad, Abril ha reclamado a España que vuelva a aplicar la justicia universal para que cualquier perpetrador de crímenes de guerra que esté en España sea juzgado. Pero esto, reconoce, tiene implicaciones políticas que lo hacen problemático. Por eso la ley cambió y se limitó la jurisdicción universal hasta el punto de que es necesario que haya un vínculo para poder juzgar al criminal, como que sean él o la víctima españoles o que el delito se haya cometido en el territorio.“Existe un panorama mundial en el que los derechos humanos no están garantizados”, lamenta Andraca. La trabajadora humanitaria critica la falta de atención adecuada por parte de las autoridades y la invisibilización social de las víctimas y sus historias. “El mundo adulto ha normalizado que una niña sea madre a los 13 años” denuncia. “Se ha normalizado el reclutamiento infantil forzado, que las niñas y los niños trabajen en cortas edades en lugar de estar en una escuela”. Andraca aporta otra cifra a este drama que demuestra la normalización de la violencia contra la infancia: en México, siete niñas y niños son asesinados cada día.“La impunidad es lo que más favorece a los criminales”, añade Ruth María Abril. Sabiendo que no van a ser perseguidos o que, si lo son, van a beneficiarse de una amnistía o una pena mínima, no temen por las consecuencias de sus actos. “Si los criminales tuviesen miedo, eso evitaría que ellos y, sobre todo la estructura de poder que tienen muchos de ellos por debajo, cometiesen esos crímenes”.Niños soldadoGuerraInfanciaViolencia sexualLo más leídoLo más escuchadoPlayT12x24 | A quien madruga, RR le abraza15/02/2025Play"El Real Madrid tiene que olvidarse de esta guerra arbitral...": El perjuicio que supone la cruzada blanca contra el arbitraje16/02/2025PlayEl comunicado del Alavés contra el estamento arbitral, la entrevista a Álvaro García y las previas de los partidos ligueros de mañana16/02/2025PlayFlash Deportes | 23:0015/02/2025PlayMillás solo necesita 5 minutos para explicar el fenómeno Montoya y revela qué escena de una película es igual a su reacción16/02/2025'
