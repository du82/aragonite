["https://cadenaser.com/nacional/2025/01/30/la-virgen-de-la-tosquera-la-pelicula-basada-en-los-relatos-de-mariana-enriquez-que-compite-en-sundance-cadena-ser"]
title = "‘La Virgen de la Tosquera’, la película basada en los relatos de Mariana Enríquez que compite en Sundance  | Cine y TV  | Cadena SER"
description = "La directora argentina Laura Casabé cuenta con producción española en esta película que compara la crisis de la adolescencia y la crisis política de un país  | Cadena SER"
full_description = '''El cine en la SERCine y TV‘La Virgen de la Tosquera’, la película basada en los relatos de Mariana Enríquez que compite en SundanceLa directora argentina Laura Casabé cuenta con producción española en esta película que compara la crisis de la adolescencia y la crisis política de un país AME4069. LOS ÁNGELES (ESTADOS UNIDOS), 25/01/2025.- Fotografía cedida por Ajimolido Films y Miyagi Films de una escena de la película La virgen de la tosquera. La directora argentina Laura Casabé hace su debut en el Festival de Sundance con el filme de terror 'La Virgen de la tosquera', la primera adaptación al cine de la obra de Mariana Enríquez, en la que explora el misticismo y la oscuridad de la amistad femenina en la adolescencia en medio de la crisis económica y social de Argentina en 2001. EFE/ Leo Furió SOLO USO EDITORIAL/SOLO DISPONIBLE PARA ILUSTRAR LA NOTICIA QUE ACOMPAÑA (CRÉDITO OBLIGATORIO) / Leo Furió (EFE)AmpliarCerrarFacebookTwitterLinkedInWhatsAppPepa BlanespepablanesCadena SER30/01/2025 - 08:52 UTCMadridEn los últimos años, las escritoras latinoamericanas han abierto una brecha en la literatura en español. Indagando con distintos géneros, con lo mágico y lo fantasmagórico, tan ligado a un territorio, y alertando de los problemas políticos que asolan a la intimidad del individuo, han creado novelas y relatos que empiezan ahora a llegar al cine. Claudia Llosa adaptó a Samanta Schweblin en Distancia de rescate para hablar del dolor de la maternidad. Elisa Miller se atrevió con Temporada de huracanes de Fernanda Melchor. Paula Hernández filmará la adaptación de El viento que arrasa de Selva Almada, y Camila Sosa también verá dos de sus libros en la gran pantalla. De todas las escritoras, quizá la más popular sea Mariana Enríquez que tiene varias adaptaciones en marcha. Una de ellas acaba de hacer su estreno triunfal en el Festival de Sundance, La virgen de la tosquera de Laura Casabé."Encontrar a Mariana Enríquez fue, para mí, un antes y un después, porque me sentí absolutamente representada por su literatura, por la capacidad de crear universos posibles vinculados con el terror gótico", decía la directora en una entrevista en la SER. Ha decidido adaptar dos relatos del libro Los peligros de fumar en la cama. Ahí se encontró con títulos como El carrito, sobre un hombre que maldice a un vecindario, y La Virgen de la tosquera, que terminó fusionando. "Me gustan particularmente mucho estos libros de cuentos. porque tiene un tono muy especial y una forma de abordar el lenguaje de género que me interesaba. Y además, es muy fácil imaginar visualmente por cómo describe las escenas de terror cotidiano Mariana"La película sigue la historia de Natalia, una adolescente de 19 años que pasa un verano junto a sus dos amigas y su amor platónico Diego. Las cosas comienzan a ponerse turbias cuando Silvia, una chica atractiva e independiente, llega a la ciudad y se suma a sus planes. A Natalia le rodea la violencia, en la ciudad hay apagones que desestabilizan la seguridad de la gente, los vecinos rechazan y estigmatizan la pobreza y el machismo atraviesa todos los ámbitos de su vida. Las tres amigas, resentidas por la falta de atención de Diego, pasan el tiempo cuestionándose su propia personalidad bajo la presencia de Silvia, deseando la mirada masculina y comentarios sobre cómo deberían ser para poder tener un novio. "Esas adolescentes, esas chicas, esa manera de entender la adolescencia, esos escenarios, eran un poco como si hablaran también de mi propia adolescencia y me sentí muy representada por esas mujeres".El filme es un retrato de adolescencia en un verano caluroso, donde la crisis del país se mete en los momentos íntimos de los jóvenes. "Me cautivaban esos personajes y encima me daba la posibilidad de tener un final complejo. Aparte, tenía ganas de contar una historia de adolescentes, de qué supone empezar la vida adulta. Atravesar la adolescencia en un momento de crisis es tremendo".El otro relato tiene que ver con un hombre con un carrito, donde lleva sus pertenencias. Anda sucio y andrajoso, vive en la calle. Lo ha perdido todo. Los vecinos le rehuyen y temen que la pobreza sea contagiosa. Esa es la primera escena del filme. "Lo que me sucedió con El carrito es que yo tuve 19 años durante el 2001 en Argentina", reconoce la directora. Tenía la edad de su protagonista cuando estalló el corralito en su país, una crisis económica sin precedentes que marcó la vida de los ciudadanos. "Pensé que El carrito era una suerte de alegoría, una metáfora de aquel tiempo. Luego cuando lo hablé con Mariana Enríquez, me dijo que en realidad hablaba de la crisis del 89. Ahí empecé a pensar en que esas crisis se han ido repitiendo en mi país hasta hoy". .c-w{ max-width:444px; width:100%; margin:32px auto; background:#00755E; border-radius:4px; display:flex; align-items:center; justify-content:center; } .c-w a{ display:flex; align-items:center; justify-content:center; padding:4px 24px; } .c-w img{ width:24px; margin-right:12px; } .c-w p{ font:18px/25px Poppins; text-align:center; color:#fff; margin:0; } @media (max-width:444px){ .c-w a{ padding:4px 12px; } .c-w img{ width:24px; margin-right:8px; } .c-w p{ font:14px/25px Poppins; } } @media (max-width:335px){ .c-w p{ font:13px/25px Poppins; } } Únete al canal de WhatsApp de la SER La clave del éxito de las autoras latinoamericanas, que mencionábamos al inicio, tiene que ver con la forma de unir lo íntimo y lo político. Algo que consigue la directora en esta película. "Es clave el contexto político social de la historia y la forma en que atraviesa el cotidiano de los personajes". Para Laura Casabé, es también una constante en el cine argentino. "Hay una tradición fuerte de cine político. Se me ocurren las películas de Aristaráin, con las que yo me crié. Después Trapero había mucha referencias en sus filmes al contexto político y social. Es una manera de hacernos cargo de cosas que nos atraviesan, de no olvidarnos de lo que pasa, de hablar de esa violencia para no quedar entumecidos", señalaba la directora que señalaba entre sus referentes también a autores españoles. "El cine española hora es también político. Pienso en Almodóvar, cuyas películas han sido mi formación. Mis padres me dejaban verlas, pero me tapaban los ojos en las escenas de sexo".Ese compromiso sigue hoy, en un momento donde la crisis política y económica vuelve a asolar a Argentina. "Una de las reflexiones más interesantes de esta historia es que el miedo es algo intrínseco en argentina. El miedo a caer en la pobreza, a perderlo todo. Es algo que se nos ha grabado en nuestra estructura psicológica y emocional. Mariana usa todo eso pero desde un lugar a los Stephen King".La virgen de la tosquera coquetea con el género del terror, que bebe de autores como King, del cine americano, pero en lo profundo también hay ecos de ese realismo mágico del boom. "La realidad es que nosotros vivimos en un territorio que realismo mágico es particular, aunque el realismo mágico quizás le pertenece más a García Márquez, sí creo que vivimos en un territorio bastante mágico, donde lo irreal y la realidad conviven. Hemos empezado a apropiarnos de nuestras historias y entender que nuestro territorio es muy rico y que el género es la posibilidad de experimentar sensaciones muy intensas y muy viscerales, pero también como desde la seguridad de tu casa".Para la directora, el género es mucho más pop y acerca al gran público problemas sociales que, a priori, han estado reservadas para un cierto tipo de cine realista o costumbrista. De ahí, el éxito de Cuando acecha la maldad, una película de terror que fue un exitazo en su país, en Argentina, y que coincidió con la llegada de Milei al poder. "Nos ampara para poder ser muy crudos y directos y referirnos de una manera metafórica y alegórica a los males concretos que nos están circundando. El género es catalizador de las emociones y también una forma de exorcizarlas".La película fue hecha en el en la transición al gobierno de Miley y eso perjudicó a la producción. "Había una inflación del 25 por ciento cuando estábamos empezando a filmar, con lo cual la película se desfinanció completamente. Fue una gran fortuna poder trabajar con productores de España y de México, que asumieron la película como suya en ese momento en que todo en Argentina estaba en el aire". De hecho, cambiaron el lugar de rodaje, de los suburbios de Buenos Aires, se fueron a los de Mendoza. "Lo más cruel, más allá de todo lo que está pasando en cine, es que comenzó una gran fuerte difamación a todas las personas que hacemos cine, y cultura. Una difamación absoluta de nuestro trabajo, hasta tal punto que la gente nos grita en la calle que nos vayamos a trabajar y nos tiran cosas cuando ven un rodaje. Esto es real. Me pasó a mí en su momento en Mendoza y le acaba de pasar a Benjamín ahora rodando con Netflix". Se refiere a Benjamín Naishtat, director de películas como Rojo y Puag, que ha firmado el guion de La virgen de la tosquera.Pepa Blanes Es jefa de Cultura de la Cadena SER. Licenciada en Periodismo por la UCM y Máster en Análisis Sociocultural... Leer másLo más leídoLo más escuchadoPlayT12x24 | A quien madruga, RR le abraza15/02/2025Play"El Real Madrid tiene que olvidarse de esta guerra arbitral...": El perjuicio que supone la cruzada blanca contra el arbitraje16/02/2025PlayEl comunicado del Alavés contra el estamento arbitral, la entrevista a Álvaro García y las previas de los partidos ligueros de mañana16/02/2025PlayFlash Deportes | 23:0015/02/2025PlayMillás solo necesita 5 minutos para explicar el fenómeno Montoya y revela qué escena de una película es igual a su reacción16/02/2025'''
