["https://cadenaser.com/nacional/2024/11/12/entrevista-joan-yago-nada-de-carmen-laforet-habla-de-nuestra-realidad-politica-actual-sigue-interpelando-al-espectador-de-hoy-cadena-ser"]
title = '''Entrevista | Joan Yago: "'Nada' de Carmen Laforet habla de nuestra realidad política actual, sigue interpelando al espectador de hoy"  | Ocio y cultura  | Cadena SER'''
description = "El dramaturgo está al frente de la primera adaptación teatral de este clásico de nuestra literatura, premio Nadal en 1944, que acaba de estrenarse en el CDN   | Cadena SER"
full_description = '''La Hora ExtraOcio y culturaEntrevista | Joan Yago: "'Nada' de Carmen Laforet habla de nuestra realidad política actual, sigue interpelando al espectador de hoy"El dramaturgo está al frente de la primera adaptación teatral de este clásico de nuestra literatura, premio Nadal en 1944, que acaba de estrenarse en el CDN Play/PauseMostrar OpcionesEntrevista | Joan Yago: "'Nada' de Carmen Laforet habla de nuestra realidad política actual, sigue interpelando al espectador de hoy"18:14CerrarDescargarCompartirCerrarCompartirFacebookTwitterLinkedinWhatsappEmbeberEl código iframe se ha copiado en el portapapelesFacebookTwitterLinkedInWhatsAppRaquel GarcíaCadena SER12/11/2024 - 07:00 UTC'Nada' de Carmen Laforet es mucho más que una novela de posguerra nos cuenta Yago, al que le llegó el encargo de hacer la primera adaptación de la obra al teatro desde el Centro Dramático Nacional. En vísperas del estreno en el teatro María Guerrero conversamos con el dramaturgo de cómo se enfrenta la responsabilidad de adaptar por primera vez un clásico y de cómo nos interpela una obra escrita hace 80 años.¿Recuerdas la primera vez que leíste la novela de Carmen Laforet?A lo largo de este año me ha venido mucho a la mente. Yo tenía 17 años y estaba haciendo primero de bachillerato. Es una cosa que, no sé exactamente por qué, pero que se repite muchas veces entre miembros del equipo, lo decía Alfredo Sanzol, el director del Centro Dramático Nacional, que todos leímos 'Nada' cuando éramos adolescentes, conservamos un recuerdo mejor o peor, pero lo olvidamos y ahora ha vuelto a nuestras vidas con mucha fuerza.Es una nueva lectura que llega pasados los años y también desde otro punto de vista, el de adaptar la novela, que supongo te habrá aportado mucha información y otra mirada. ¿Qué recuerdo tenías?Yo tenía un recuerdo muy bueno y a la vez súper difuso. Recordaba que la novela iba de una chica que se iba a vivir a Barcelona y no recordaba nada más. No recordaba las escenas de violencia brutal, las descripciones maravillosas, los momentos luminosos, los momentos oscuros. Entonces, ha sido como ostras, todo esto está aquí. No recordaba, por ejemplo, el importantísimo peso que tienen las heridas de la Guerra Civil española, que acaba de terminar tan sólo hace unos meses en la novela. Creo que en mi primera lectura se me pasó totalmente por alto y ha sido muy interesante esto que dices, leerla sabiendo que la vas a adaptar, porque de alguna manera tienes que hacer este trabajo de ir descubriendo que hay aquí que a mí me apetezca replicar, dar altavoz, repetir. Ha sido un proceso lento y bonito. .c-w{ max-width:444px; width:100%; margin:32px auto; background:#00755E; border-radius:4px; display:flex; align-items:center; justify-content:center; } .c-w a{ display:flex; align-items:center; justify-content:center; padding:4px 24px; } .c-w img{ width:24px; margin-right:12px; } .c-w p{ font:18px/25px Poppins; text-align:center; color:#fff; margin:0; } @media (max-width:444px){ .c-w a{ padding:4px 12px; } .c-w img{ width:24px; margin-right:8px; } .c-w p{ font:14px/25px Poppins; } } @media (max-width:335px){ .c-w p{ font:13px/25px Poppins; } } Únete al canal de WhatsApp de la SER 'Nada' nos cuenta la historia de una generación de jóvenes que tuvieron que volver a construir su propio relato después de la Guerra Civil. Han pasado 80 años desde su publicación. ¿Qué interés crees que tiene hoy la novela?. ¿De qué forma nos interpela en 2024?Creo que desde más de un sitio y creo que es la maravilla de nada. 'Nada' no se puede definir. Perdón, el juego de palabras es inevitable, pero no se puede definir como nada. No es una novela de posguerra, no es una novela romántica, no es una novela iniciática y de pérdida de inocencia, pero es todo. Creo que cualquier persona que es o ha sido joven, que tiene o ha tenido 18 años y se ha sentido perdida, que no sabe qué quiere hacer en la vida, quién quiere ser, que siente encima todo el peso de la familia se va a sentir profundamente interesada por la novela. Cualquier persona que sienta un cierto interés hacia nuestra historia y hacia la movida que llevamos encima y que han llevado encima nuestros abuelos, nuestros padres, se va a sentir súper interesada por todo lo historiográfico y cualquier persona que haya sentido una relación extraña de amistad que va más allá de la amistad, que tiene amor, pero que no es exactamente amor romántico, que tiene o no tiene un espacio para el deseo, se va a sentir interesada por la relación tan maravillosa y tan compleja que hay en la novela entre Andrea y Ena. Es una novela que lo tiene todo y no se puede resumir como una novela sobre algo determinado. Yo creo que éste es el gran interés de la obra de Carmen Laforet y lo que nosotros también, como hemos podido, hemos intentado mantener y trasladar al escenario.Es la primera vez que se adapta la novela de Carmen Laforet, supongo que la responsabilidad es mucho mayor. ¿Cómo te enfrentas a la adaptación de un texto que es un clásico de nuestra literatura?Pues la verdad es que mi primera respuesta fue un no cuando me dijeron de hacerlo, porque pensé que esto no se puede hacer, que no se va a hacer bien. Pero cuando hablando con Beatriz Jaén, la directora, nos dimos cuenta que nadie lo había hecho, dijimos pues alguien lo tiene que hacer por primera vez y quizás va a ser difícil, quizás va a ser insatisfactorio, pero alguien lo tiene que probar y de alguna manera yo creo que notamos todos, la directora y los actores y las actrices, el propio Centro Dramático Nacional, notamos una gran responsabilidad y un gran peso. Encima sabemos que la novela va a dejar insatisfecha a algunas personas porque tienen una relación muy intensa con el libro, no van a ver en la obra lo que nosotros hemos visto, no van a ver en la obra la imagen que ellos tienen en sus cabezas. Sólo puedo decir que nosotros nos hemos aproximado al material original con muchísimo cariño, con muchísimo respeto y nos hemos pensado tres veces cada paso que dábamos, si quitábamos o poníamos una coma y que lo hemos hecho también como hemos podido. Hay algo en mí cuando tengo tanta presión que soy capaz de desactivarla porque si no la presión me dejaría absolutamente quieto. De tanta presión que siento termino por no sentirla y ahora ya pienso que venga el público y que la disfrute.¿Con qué ideas partías para hacer la adaptación?. ¿Desde el principio querías que fuera una adaptación absolutamente fiel del texto?Quizás no desde el principio, pero pronto, al darnos cuenta de que nunca se había hecho una adaptación desde un gran centro de creación público, pensamos seguramente que no es el momento de ponernos nosotros a juguetear, a reescribir, a cambiar el punto de vista. Piensa en Hamlet, que se ha adaptado 800 veces, el Quijote se ha adaptado 800 veces. Ahora quien la adapta puede ermitirse ponerse juguetón y decir voy a explicar el Quijote desde el punto de vista de Sancho, pero 'Nada' de Carmen Laforet al ser ésta su primera versió teatral nos ha llevado sin que nadie nos lo haya impuesto a ser relativamente conservadores. Respetar el producto que dicen los cocineros, no echarle demasiadas cosas, decir aquí lo tienes. Evidentemente hemos tenido que hacer operaciones, recortar mucho texto, fundir personajes, eliminar cosas, pero hemos intentado que sean operaciones que no llamen mucho la atención, que sean discretas y que incluso quien no se sepa la novela de memoria, tal vez ni siquiera las note, pero evidentemente están ahí, y se ha tenido que decidir cómo hacerlo.Ensayo de 'Nada' de Carmen Laforet en el CDN / Bárbara Sánchez PalomeroAmpliarEnsayo de 'Nada' de Carmen Laforet en el CDN / Bárbara Sánchez PalomeroCerrar¿El resultado final es muy diferente de lo que imaginabas cuando empezaste a trabajar el texto?Siempre hay cosas que son diferentes pero siempre me quedo más con las cosas que son iguales, porque es tan satisfactorio como dramaturgo cuando de repente, cuando además no has podido estar muy presente en el proceso de ensayo, yo he estado yendo y viniendo desde Barcelona, y cuando entras en la sala de ensayo y ves un momento en que dices esto es exactamente como me lo había imaginado, esto es exactamente como aquella conversación que tuvimos hace cinco meses Beatriz y yo. Esto es exactamente lo que sentí cuando leí la novela. Estos momentos son muy maravillosos.'Nada' nos habla de la construcción de una identidad desde el trauma, el de la Guerra Civil española. Desde un punto de vista, el de una generación de jóvenes nacida en la década de los 20, sobre todo, desde el punto de vista de una mujer, Andrea, a través de sus relaciones, de sus miedos, de sus anhelos. ¿Cómo has trabajado esa mirada de género, ese personaje de Andrea, su mundo interior y su lugar frente al resto de personajes?Ha sido imprescindible tener al lado a Beatriz Jaén, la directora. Nos hemos intentado acompañar durante todo el proceso mucho el uno al otro. Ella ha estado conmigo durante la adaptación y yo he intentado estar con ella durante los ensayos. Lo que hemos hecho ha sido no añadir mucho a lo que ya hay porque Andrea es un personaje terriblemente moderno, terriblemente contemporáneo. Es la famosa chica rara, como se refirió a ella Carmen Martín Gaite, una chica joven nacida en la década de los 20, pero que tiene una mirada hacia la vida, un sentimiento de libertad, un anhelo de libertad profundamente moderno, profundamente contemporáneo. Ella no se ve capaz de cambiar su mundo, pero tiene muy claro cuáles son las cosas de este mundo que no quiere que formen parte de su vida. Son muy claras sus referencias al terrible escenario de violencia machista con el que tiene que convivir en su casa, su anhelo de libertad, su anhelo de independencia, su claridad de no voy a depender de la vida de un hombre, mi objetivo en la vida no es casarme y tener hijos, no quiere decir que no quiera casarme y tener hijos, pero no he venido a la vida a esto. Yo he venido a la vida a vivir y ya veremos hacia dónde me lleva esto. Yo creo que volviendo a la pregunta al principio es lo que más va a interesar al espectador contemporáneo, porque creo que hay algo bello de esta juventud rebelde que todos hemos tenido dentro cuando teníamos 17, 18 años. Creo que si ves la obra con 18 años te puede empoderar, creo que especialmente si eres una chica y eres una chica que no está pudiendo vivir la vida como a ti te gustaría, y si ya no eres una chica o un chico, si eres una persona crecida, pues de alguna manera la obra te conecta con este sentimiento de rebeldía y de no conformarte con el mundo que tienes a tu alrededor.¿Cómo habéis jugado con toda ese mundo interior de Andrea para equilibrar con la parte de acción de la novela?Era sin duda el gran reto a nivel de administración de la información en la adaptación. 'Nada' tiene la voz narrativa, el libre flujo de pensamiento del personaje de Andrea que hace de narrador y tiene unas descripciones maravillosas, largos pasajes de pensamiento, opiniones, etcétera. Y luego tiene muchos otros personajes, toda la familia, los estudiantes, los bohemios, con escenas con mucha acción. Nosotros nos hemos esforzado por mantenerlo todo, intentar encontrar el equilibrio entre una voz narrativa que también interpreta la actriz, intentando que no apabulle, intentando dejar espacio para los demás y a la vez darle temperatura. A esta parte vamos a llamarle 'chejoviana' o 'tennesseewilliamsiana' de la obra. El otro día veía un pase y tengo la sensación satisfactoria de que nos hemos acercado a lo que queríamos hacer. Insisto, habrá quien quizás no conecte, quien diga que es una obra demasiado pegada a la novela original o habrá quien diga, os habéis saltado este capítulo que es mi capítulo favorito. Relacionarse con un material que es tan importante para tanta gente, sin duda nos va a llevar a opiniones muy variopintas. Yo sólo puedo decir que hemos hecho lo que queríamos hacer, lo que creíamos que teníamos que hacer y que estoy súper contento con el resultado.Te documentas muchísimo cuando te pones a escribir un texto. En este caso al tratarse de una adaptación, ¿has obviado en gran medida esa esa parte o aun así te has metido en esa época, en ese momento y has hecho todo ese trabajo, que entiendo que también te ofrece una respuesta diferente del público?Ha habido una primera fase de empezar leyendo los prólogos de las versiones de las diferentes ediciones, de leer un par de biografías de Carmen Laforet, ver documentales, el propio ensayo de Carmen Martín Gaite. Nos hemos relacionado con todo ese mundo, ese material bibliográfico, los muchos análisis, incluso las disputas y polémicas que hay acerca de las diferentes lecturas del personaje de Andrea, de su relación con el personaje de Ena, cuán de biográfico es, qué peso tiene el elemento biográfico en la novela. Pero tengo que decir que cuando terminó esta fase y empezó lo que es el proceso de adaptación propiamente dicho, de relacionarme con el texto, fue muy fluido, muy poco complejo y muy instintivo. Era como si el texto me fuera diciendo esto lo puedes quitar, esto lo tienes que mantener. Y no había una idea teórica en la que se apoyaban las decisiones, sino que era una cosa muy escultórica de ir quitando, añadiendo, esto lo vamos a cambiar de sitio. Estoy contento porque ha sido un trabajo con una parte dura y de darle muchas vueltas pero lo de antes, lo que fueron los meses de estar adaptando el texto fueron muy fluidos y muy felices.Hace unos días nuestros compañeros del cine en la SER hablaban con Eduard Fernández, protagonista de 'Marco', ese falso superviviente del Holocausto. Hablaba Eduard Fernández de esa sensación de estar aún en aquellas dos Españas, de que todavía no podemos nombrar las cosas por su nombre. ¿Qué reflexión te provoca comparar esa fotografía que hace la novela de la posguerra con la actualidad, con el día de hoy?En la rueda de prensa ha habido un momento muy bonito en el que Beatriz Jaén, la directora, ha dicho es que Andrea es mi abuela, es la generación de nuestros abuelos y a veces tendemos a alejarlo demasiado en el tiempo, como si esto fuera una historia que pasó hace ya casi 100 años. Hemos convivido con los protagonistas de esta historia, hemos dormido en sus casas, han comido en nuestra mesa, somos en nuestra familia los personajes de esta historia, algunos tenemos la suerte todavía de tenerlos cerca. Yo creo que la novela habla de la España de hoy. Habla de unos elementos historiográficos que siguen afectando a la España en la que vivimos, que la continuamos teniendo en nuestra actualidad política. Vosotros lo sabéis que sois periodistas. Esto no va de los Reyes Godos. Esto no va de una historia que pasó hace mil años. La Barcelona que describe 'Nada' siento que es la Barcelona en la que yo vivo todavía y es una ciudad a la que evidentemente le han pasado muchísimas cosas, pero yo creo que hemos tenido que hacer un ejercicio de ver con qué nos podemos conectar de la novela. Yo me siento conectado con la novela'''
