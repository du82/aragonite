["https://cadenaser.com/nacional/2025/02/12/criticas-a-la-psiquiatra-marian-rojas-estape-por-lo-que-dijo-en-el-hormiguero-un-experto-desmonta-su-discurso-cadena-ser"]
title = "Críticas a la psiquiatra Marian Rojas Estapé por lo que dijo en 'El Hormiguero': un experto desmonta su discurso  | Sociedad  | Cadena SER"
description = "La autora de &#039;Cómo hacer que te pasen cosas buenas&#039; fue invitada al programa de Pablo Motos y dejó varias citas que han sido muy comentadas en redes | Cadena SER"
full_description = '''SociedadCríticas a la psiquiatra Marian Rojas Estapé por lo que dijo en 'El Hormiguero': un experto desmonta su discursoLa autora de 'Cómo hacer que te pasen cosas buenas' fue invitada al programa de Pablo Motos y dejó varias citas que han sido muy comentadas en redesLa psiquiatra Marian Rojas Estapé en su entrevista de anoche en 'El Hormiguero'.AmpliarCerrarFacebookTwitterLinkedInWhatsAppR.S.Cadena SER12/02/2025 - 20:19 UTCLa psiquiatra y escritora Marian Rojas Estapé fue la invitada de este miércoles por la noche de El Hormiguero para hablar junto a Pablo Motos de salud mental y de su último libro, Encuentra tu persona vitamina. La experta estuvo hablando sobre varios temas y dio consejos para reducir los niveles de cortisol e incluir diariamente algunas rutinas vitamínicas que pueden ayudar a una persona a tener mejor ánimo, según defiende en sus obras. Más informaciónLos problemas de salud mental entre los jóvenes se multiplican por 6 en una década por culpa de la precariedadAngy Fernández reivindica el acceso a la salud mental y lanza un mensaje a los políticosRojas Estapé ha asegurado que "las dos únicas cosas que le llenan el corazón al ser humano son el amor y el trabajo" y que las gratificaciones instantáneas no son las que dan la felicidad. Esta intoxicación de dopamina insensibiliza a la persona para los placeres cotidianos, dice la psiquiatra. Marian Rojas Estapé revela las dos únicas cosas que llenan el corazón del ser humano #MarianRojasEH pic.twitter.com/9UeIzYdVc6— El Hormiguero (@El_Hormiguero) February 11, 2025 Además, la escritora ha criticado el exceso de dopamina que muchas personas buscan en la actualidad y lo ha achacado a las redes sociales, el consumo de drogas, la pornografía o el alcohol. "Mi cerebro no quiere que yo sea un dispensador crónico de dopamina", dice Rojas Estapé, que cree que convertirse en un adicto a alguna de estas actividades convierten a la persona en una adicta. El exceso de dopamina explicado por Marian Rojas Estapé #MarianRojasEH pic.twitter.com/VvFW0uS5ex— El Hormiguero (@El_Hormiguero) February 11, 2025 Además, la psiquiatra ha explicado que una persona se despierta con el 100% de energía, pero que al final del día, al llegar al 20%, sale la peor versión de la persona, sobre todo con las personas que más queremos. Para ello, Rojas Estapé recomienda las rutinas vitamínicas que puedan ayudar a bajar los niveles de cortisol, mencionando la importancia del deporte, de aburrirse sin móvil, de divagar, de dedicar tiempo a la gente que queremos. "Intoxicados de miedo nos salva el amor, las relaciones", dice la psiquiatra, que recomienda meter en la rutina la meditación, la contemplación y el baile.Marian Rojas Estapé nos da las rutinas vitamínicas para ser más feliz #MarianRojasEH pic.twitter.com/AzHJgquRAJ— El Hormiguero (@El_Hormiguero) February 11, 2025 Las críticas de un neuropsicólogo al discurso de Marian Rojas EstapéEl neuropsicólogo Nacho Roura ha compartido en sus redes sociales una crítica airada hacia el discurso de la psiquiatra, al que califica de "simplista". "Una divulgación que te pide que bailes y cantes mientras el mundo arde a tu alrededor", son las palabras que ha usado el experto para calificar a la autora, a la que la reconoce como "uno de los mayores fenómenos literarios en el campo de la autoayuda". Roura indica que con el vídeo quiere dejar claras las tres cosas que, desde su punto de vista, han hecho famosa a la invitada de El Hormiguero. .c-w{ max-width:444px; width:100%; margin:32px auto; background:#00755E; border-radius:4px; display:flex; align-items:center; justify-content:center; } .c-w a{ display:flex; align-items:center; justify-content:center; padding:4px 24px; } .c-w img{ width:24px; margin-right:12px; } .c-w p{ font:18px/25px Poppins; text-align:center; color:#fff; margin:0; } @media (max-width:444px){ .c-w a{ padding:4px 12px; } .c-w img{ width:24px; margin-right:8px; } .c-w p{ font:14px/25px Poppins; } } @media (max-width:335px){ .c-w p{ font:13px/25px Poppins; } } Únete al canal de WhatsApp de la SER Roura califica el discurso de la psiquiatra de "reduccionismo biólogico indiscriminado y constante" que cree que la causa de la conducta humana y todos los problemas relacionados con ella, como los trastornos mentales, se encuentran en el cerebro. "Esta corriente de divulgación biologicista no deja de ser reduccionista porque estás localizando todas estas causas de la conducta en fenómenos neuroquímicos ignorando todo lo demás, el contexto sociocultural, económico, político, psicológico, de crianza y relacional", ha apuntado el neuropsicólogo. "Esto lleva a afirmaciones tremendamente generales en términos en los que todos entendemos lo que quiere decir, identifica cosas buenas (dopamina) y malas (cortisol). Persona dopamina, vitamina. Persona sufrimiento, tóxica. No dejan de ser reducciones absurdas de las relaciones sociales que tenemos desde una perspectiva individualista. Es curioso porque en la entrevista dice que no le gusta el término de persona tóxica, pero tiene un libro que se llama Encuentra tu persona vitamina", critica Roura. El neuropsicólogo apunta que entiende que la psiquiatra quiera dar un mensaje quedándose "con frases chulas" y "nombres muy atractivos" reduciéndolo todo. "El hecho de explicar estos fenómenos sociales en esta perspectiva centrada en el funcionamiento del cerebro individual es incorrecto y tiene unas consecuencias necesarias, es la contrapartida de que esos problemas sociales y culturales se tienen que tratar exclusivamente desde el individuo", ha comentado Roura. "Un discurso que se solapa mucho con el de los gym-bros"Sobre las rutinas vitamínicas que hay que seguir, Roura considera que es absurdo pensar que "si no haces todo esto (en referencia al deporte y lo que destaca la psiquiatra) y te siguen yendo mal las cosas, por algo será". "Este discurso se solapa mucho con el de los gym-bros, que tiene mucha cosa neoliberal y de clase detras. ¿Dónde medito si no tengo un piso? Dentro de estas actividades, que son individuales y haces tú para ti, no encontramos ningun tipo de solución colectiva, ni animar a la organización para cambiar las condiciones de vida. Es un tipo de divulgacion que ignora las condiciones materiales de vida de la persona", ha criticado el experto. "Cuando tú le dices a una persona que hay que parar, la persona se tiene que poder permitir parar. ¿Cómo paras? Ese es uno de los grandes problemas, que cuando la persona no para porque no sabe es cuando le paran el cuerpo y la cabeza", ha reflexionado el profesional, que añade que no todo dentro de la divulgación de la psiquiatra es malo, porque es una gran oradora, pero lo considera "alienante y acontextual". "Estos ingredientes que cristalizan lo simple, en lo que la persona puede coger y aplicar directamente a su vida aunque se le lleve a frustración, tras frustación, tras frustación, son las cosas faciles. Pero la salud, ni física ni mental, especialmente la mental, no es un asunto fácil que podemos reducir a un libro de autoayuda", ha sentenciado el neuropsicólogo en su vídeo, que ya lleva 2.000 'me gustas'. La dopamina, el cortisol y la autoayuda fueron ayer a divertirse al hormiguero. Yo no, que tengo unos puntos de sutura en la nariz.Pero os dejo una reflexión sobre la divulgación de Marian Rojas y el vídeo entero en mi instagram 👇🏽 pic.twitter.com/1nIx4TsCWo— Nacho Roura (@neuronach) February 12, 2025 El HormigueroLo más leídoLo más escuchadoPlayT12x24 | A quien madruga, RR le abraza15/02/2025Play"El Real Madrid tiene que olvidarse de esta guerra arbitral...": El perjuicio que supone la cruzada blanca contra el arbitraje16/02/2025PlayEl comunicado del Alavés contra el estamento arbitral, la entrevista a Álvaro García y las previas de los partidos ligueros de mañana16/02/2025PlayFlash Deportes | 23:0015/02/2025PlayMillás solo necesita 5 minutos para explicar el fenómeno Montoya y revela qué escena de una película es igual a su reacción16/02/2025'''
