["https://cadenaser.com/nacional/2025/01/29/el-juez-del-supremo-que-investiga-al-fiscal-general-anuncia-durante-su-interrogatorio-la-ampliacion-de-la-investigacion-cadena-ser"]
title = "El juez del Supremo que investiga al fiscal general anuncia durante su interrogatorio la ampliación de la investigación  | Tribunales  | Cadena SER"
description = "Ángel Hurtado responde a la defensa de Álvaro García Ortiz que el objeto de la causa se divide en tres partes: la publicación de la denuncia y el expediente tributario del novio de Ayuso, la publicación del correo con su confesión y la nota de prensa que desmintió el bulo | Cadena SER"
full_description = 'TribunalesEl juez del Supremo que investiga al fiscal general anuncia durante su interrogatorio la ampliación de la investigaciónÁngel Hurtado responde a la defensa de Álvaro García Ortiz que el objeto de la causa se divide en tres partes: la publicación de la denuncia y el expediente tributario del novio de Ayuso, la publicación del correo con su confesión y la nota de prensa que desmintió el buloEl fiscal general del Estado, Álvaro García Ortiz, a su llegada este miércoles al Tribunal Supremo / Daniel González (EFE)AmpliarCerrarFacebookTwitterLinkedInWhatsAppPedro JiménezpedrojimenezgCadena SER29/01/2025 - 13:58 UTCMadridEl interrogatorio como investigado del fiscal general del Estado —que ha durado menos de una hora y media— ha comenzado con polémica. La defensa de Álvaro García Ortiz ha pedido al juez del Tribunal Supremo que enumere los hechos por los que se le investiga. Ángel Hurtado ha explicado que investiga la publicación del expediente tributario y de la denuncia al novio de Ayuso, el correo en el que Alberto González Amador reconoce que ha cometido dos delitos fiscales y la publicación de la nota de prensa que desmintió el bulo de que el Ministerio Público había ofrecido un pacto al comisionista para evitar el juicio en la causa que tiene abierta por fraude fiscal. En este punto, el Abogado del Estado ha protestado porque el objeto del proceso desborda el auto por el que la sala de lo penal admitió la causa. Hurtado se ha mantenido firme y ha señalado que el objeto de la causa cambia y que ahora se rige por el auto que dictó el pasado 13 de enero.No contesta al juezÁlvaro García Ortiz solo ha querido responder a las preguntas de la Abogacía del Estado que le defiende y de la Fiscalía porque la causa se basa en el allanamiento de su despacho oficial y del de la jefa de Madrid. Una diligencia, ha dicho, que invade derechos fundamentales y contra la que se presentó recurso de apelación que aún no ha sido resuelto. No hay precedentes en la historia europea de una medida similar contra un jefe del Ministerio Público, ha defendido García Ortiz. Por este motivo, porque no conoce todo el contenido de la investigación, no ha querido responder a las preguntas del juez que, dice, “creo que parte de una certeza que le impide descubrir la verdad”. El Fiscal General también se ha negado a responder a la acusación particular del novio de Ayuso porque, dice, en su querella inicial omitió hechos relevantes para la investigación. Por ejemplo que él mismo envió a la mano derecha de Ayuso, Miguel Ángel Rodríguez, al menos el correo con la respuesta del fiscal al ofrecimiento de pacto, y a El Mundo el contenido de los dos correos. Estas omisiones son las que han dirigido desde el principio las sospechas hacia la fiscalía y se han visto agravadas porque el querellante nunca desmintió las falsedades que se estaban difundiendo en su nombre: “La mentira nunca puede ser un secreto”, según el Fiscal General.Más informaciónUna jurista responde a quienes se preguntan por qué todavía no ha declarado el novio de AyusoDos testigos aseguran que Miguel Ángel Rodríguez movió el bulo contra la Fiscalía desde la tarde del 13 de marzoJesús Maraña no da crédito al auto del juez Ángel Hurtado y le acusa por falta de imparcialidad: "Te deja helado"La Fiscalía no ha formulado ninguna pregunta. Según fuentes jurídicas porque considera que practicando el interrogatorio reconocería la validez de una causa que no la tiene. Y es que no existe prueba de cargo y no hay nada secreto que proteger porque fue el propio González Amador quien divulgó sus comunicaciones con el fiscal en las que pedía un pacto y reconocía sus delitos. Cuando esos datos fueron divulgados, dejaron de ser secretos.Más de 300 daciones de cuenta en 2024Álvaro García Ortiz ha asumido en primera persona la nota de prensa que redactó su directora de comunicación con la información que él le proporcionaba y ha defendido la recopilación de toda la información del expediente tributario para desmentir el bulo de que el Ministerio Público había ofrecido el pacto al comisionista cuando todo sucedió al revés. Sin embargo, ha explicado que fue la Fiscal Superior de la Comunidad de Madrid, Almudena Lastra, quien activó los mecanismos para elaborar esa nota cuando tuvo conocimiento del bulo que difundía la mano derecha de Isabel Díaz Ayuso, Miguel Ángel Rodríguez. Una nota de prensa que salió publicada "después de que la Cadena SER hubiera desmentido el bulo de El Mundo". El investigado se ha apoyado en los principios de unidad y jerarquía que hay en la Fiscalía para pedir los documentos. "Yo di la orden y los fiscales actuaron por delegación", ha explicado. En este sentido ha normalizado la dación de cuentas de aquella noche revelando el dato de que en 2024 hubo 305 peticiones de información contando con la de Alberto González Amador y que en muchos expedientes tributarios, como ocurre con futbolistas y entrenadores de fútbol, se hace para elaborar una nota de prensa explicativa.Lastra, desafecta con FortunyA preguntas de su defensa, García Ortiz ha asegurado que él no filtró el correo en el que Alberto González Amador reconocía que había cometido dos delitos fiscales y que tampoco dio orden para que se hiciera. Incluso, ha ido más allá y ha rechazado la posibilidad de que la filtración del correo saliera de la Fiscalía, aunque ha insinuado que él no era el único que lo tenía en su poder. Los tenían, y los hicieron circular Miguel Ángel Rodríguez y la pareja de la presidenta de la Comunidad de Madrid, pero también los tenía la Fiscal Superior de la Comunidad de Madrid, Almudena Lastra que es, ha señalado, "desafecta" hacia la Fiscalía General. .c-w{ max-width:444px; width:100%; margin:32px auto; background:#00755E; border-radius:4px; display:flex; align-items:center; justify-content:center; } .c-w a{ display:flex; align-items:center; justify-content:center; padding:4px 24px; } .c-w img{ width:24px; margin-right:12px; } .c-w p{ font:18px/25px Poppins; text-align:center; color:#fff; margin:0; } @media (max-width:444px){ .c-w a{ padding:4px 12px; } .c-w img{ width:24px; margin-right:8px; } .c-w p{ font:14px/25px Poppins; } } @media (max-width:335px){ .c-w p{ font:13px/25px Poppins; } } Únete al canal de WhatsApp de la SER El cambio de móvilÁlvaro García Ortiz también ha respondido a las preguntas por el cambio de móvil cuando la investigación ya estaba abierta. García Ortiz ha asegurado que ha cambiado 6 veces de móvil en los últimos cuatro años y que habitualmente borra contenido por seguridad y por ser una obligación legal, ya que tiene información sensible que afecta a multitud de investigaciones penales, además de información de carácter personal, y de que informó a la UCO durante el allanamiento de su despacho de que había cambiado de dispositivo recientemente. Ha desmarcado esta actuación de la investigación porque nadie se podía imagina que se iba a producir un registro de estas características.Álvaro García OrtizTribunal SupremoAlberto González AmadorIsabel Díaz AyusoJuecesÁngel HurtadoPedro Jiménez Redactor Jefe en la Cadena SER. Antes he pasado por los equipos de Hora 14, Radio Madrid, Fin de Semana,... Leer másLo más leídoLo más escuchadoPlayT12x24 | A quien madruga, RR le abraza15/02/2025Play"El Real Madrid tiene que olvidarse de esta guerra arbitral...": El perjuicio que supone la cruzada blanca contra el arbitraje16/02/2025PlayEl comunicado del Alavés contra el estamento arbitral, la entrevista a Álvaro García y las previas de los partidos ligueros de mañana16/02/2025PlayFlash Deportes | 23:0015/02/2025PlayMillás solo necesita 5 minutos para explicar el fenómeno Montoya y revela qué escena de una película es igual a su reacción16/02/2025'
