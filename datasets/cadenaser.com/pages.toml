["https://cadenaser.com/nacional/2025/01/31/indra-adquiere-por-725-millones-el-89-de-hispasat-empresa-operadora-y-proveedora-de-servicios-por-satelite-cadena-ser"]
title = "Indra adquiere por 725 millones el 89% de Hispasat, empresa operadora y proveedora de servicios por satélite  | Economía y negocios  | Cadena SER"
description = "La compañía lo ha anunciado a través de la Comisión Nacional del Mercado de Valores (CNMV)  | Cadena SER"
full_description = 'Economía y negociosIndra adquiere por 725 millones el 89% de Hispasat, empresa operadora y proveedora de servicios por satéliteLa compañía lo ha anunciado a través de la Comisión Nacional del Mercado de Valores (CNMV) Sede Central de INDRAAmpliarCerrarFacebookTwitterLinkedInWhatsAppEPCadena SER31/01/2025 - 21:09 UTCIndra ha adquirido el 89,68% de Hispasat, el operador de telecomunicaciones de Rededia, por 725 millones de euros, según ha informado la compañía a través de la Comisión Nacional del Mercado de Valores (CNMV) en la noche de este viernes."Indra ha suscrito un acuerdo con Redeia Corporación para la adquisición del 89,68% del capital social de Hispasat, operador y proveedor de servicios por satélite, por un importe de 725 millones de euros", señala el comunicado remitido a la CNMV.El movimiento, que está pendiente de aprobación en el Consejo de Ministros, hará que la compañía de satélites obtenga un valor de 966 millones de euros. "A dichos efectos, Indra ha asegurado la financiación por un total de 700 millones de euros, estando previsto que el resto del importe sea cubierto con cargo a caja existente. La operación está sujeta al cumplimiento de determinadas condiciones suspensivas, de carácter esencialmente regulatorio, tanto en España como en otras jurisdicciones", añade.La operación también está sujeta a la aprobación por la junta general de accionistas de Indra, así como a la ejecución de determinados acuerdos para que Indra consolide contablemente Hisdesat, el operador de servicios gubernamentales por satélite en las áreas de defensa, seguridad, inteligencia y asuntos exteriores. .c-w{ max-width:444px; width:100%; margin:32px auto; background:#00755E; border-radius:4px; display:flex; align-items:center; justify-content:center; } .c-w a{ display:flex; align-items:center; justify-content:center; padding:4px 24px; } .c-w img{ width:24px; margin-right:12px; } .c-w p{ font:18px/25px Poppins; text-align:center; color:#fff; margin:0; } @me