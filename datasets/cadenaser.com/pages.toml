["https://cadenaser.com/nacional/2024/11/12/alvaro-pombo-premio-cervantes-2024-cadena-ser"]
title = "El escritor Álvaro Pombo, Premio Cervantes 2024  | Ocio y cultura  | Cadena SER"
description = "Renovador del realismo subjetivo, poeta, ensayista, académico, es uno de los grandes novelistas de nuestra lengua donde la ironía y el humor destacan en la creación de un mundo propio | Cadena SER"
full_description = '''La Hora ExtraOcio y culturaEl escritor Álvaro Pombo, Premio Cervantes 2024Renovador del realismo subjetivo, poeta, ensayista, académico, es uno de los grandes novelistas de nuestra lengua donde la ironía y el humor destacan en la creación de un mundo propioEl escritor Álvaro Pombo, nuevo Premio Cervantes 2024. Archivo. / Europa PressFacebookTwitterLinkedInWhatsAppPepa BlanespepablanesCadena SER12/11/2024 - 17:40 UTCMadridPor segundo año consecutivo, un escritor español se hace con el Premio Cervantes. Álvaro Pombo entra en la lista selecta de escritores y escritoras merecedores del máximo galardón de nuestras letras a un escritor en activo, pues a sus 84 años, el escritor santanderino continúa escribiendo. De hecho, en Anagrama publicaba el mes pasado su última novela, El Exclaustrado, una reflexión sobre la religión y la fe, sobre la duda y el engaño. En esa novela aparecen algunas de las claves presentes en toda su obra, que el jurado elogiaba a través de las palabras del ministro de Cultura, Ernest Urtasun. "Tiene una extraordinaria personalidad creadora, lírica singular y gran narración"."A su notabilísimo nivel como poeta y ensayista, se une el ser uno de los grandes novelistas de nuestra lengua, que indaga en la condición humana desde las perspectivas afectivas de unos sentimientos profundos y contradictorios", añaden. Recuerdan que, "en sus creaciones, muestra el mundo a través de la construcción de un lenguaje en el que las deformaciones de la realidad aparecen reflejadas bajo el disfraz de la ironía y del humor". Y consideran además que "en su prosa, la oralidad se refleja en la voluntad de un estilo que aspira a 'escribo como hablo' valdesiano". "Álvaro Pombo ha creado aquello que define a los grandes escritores, un mundo literario propio imperecedero e imprescindible que conmueve y conduele", subraya el jurado del premio. Intelectual de vanguardia, fue una de las primeras personalidades en hacer pública su homosexualidad y, en su pasión por los clásicos, repartió su interés entre la filosofía y la literatura. Sus narraciones, aparentemente sencillas, están llenas de humor, costumbrismos y simbolismo dentro de una tradición arraigada en su gusto por los clásicos de la filosofía y la literatura.Nacido en Santander en 1939 y ha tenido una carrera curiosa. Primero estudió Filosofía y Letras en la Universidad Complutense de Madrid. Después, logró el título de Bachelor of Arts en Philosophy por el Birkbeck College de Londres, pero acabó trabajando en un Banco precisamente en esa ciudad, en Londres. Una etapa donde descubrió su amor por la cultura y la literatura inglesas. Pombo es académico de la RAE, donde ocupa desde 2004 el sillón «j» y donde leyó su discurso de ingreso titulado Verosimilitud y verdad, temas que por cierto ocupan su última novela, El exclaustrado, que publicó en Anagrama el mes pasado. En ella habla también de un tema que ha inquietado a Pombo en muchos de sus escritos, la idea de Dios. De eso versa quizá su ensayo más famoso, La ficción suprema.Su obra ha sido traducida a múltiples lenguas: alemán, francés, holandés, griego, inglés, italiano, noruego y portugués. También fue el cabeza de lista al Senado por Unión Progreso y Democracia (UPyD) por la Comunidad de Madrid, pero no logró el escaño ni en los comicios de 2008 ni en los de 2011. Su paso por la político lo contó también de manera literaria en El temblor del héroe. Una novela en la que abordó algunos de sus habituales temas como las complejas relaciones, la soledad, las dificultades para mantener el amor y la fragilidad. Para Pombo, en la actualidad, el desinterés es el núcleo de todo: "Podemos dejar que las cosas se vayan a la porra, que las relaciones se deterioren, o podemos hacer una especie de cosa ambigua, pero las circunstancias contemporáneas favorecen mucho esta situación de falta de sustancia en las personas, de falta de compromiso", subrayaba el autor.Está considerado como uno de los renovadores del realismo subjetivo y define su método literario como “psicología-ficción” gracias a obras como El héroe de las mansardas de Mansard, con la que ganó el Premio Herralde de Novela) Donde las mujeres, un libro que le dio el Premio Nacional de Narrativa de 1997, o La cuadratura del círculo, con el que logró el Premio Fastenrath de 2001, también El cielo raso, Premio Fundación José Manuel Lara, donde ya ahondaba en su homosexualidad, un tema que volvió a retratar en Contra natura, Premio Ciutat de Barcelona y el SalambóAlrededores, Una ventana al norte le dio el Premio Arcebispo Juan de San Clemente, , La previa muerte del lugarteniente Aloof, Santander, 1936 el Francisco Umbral. Ha ganado el Planeta y el Nadal. Y también nos ha dado poemas, el volumen Protocolos (1973-2003)recoge sus cuatro poemarios. .c-w{ max-width:444px; width:100%; margin:32px auto; background:#00755E; border-radius:4px; display:flex; align-items:center; justify-content:center; } .c-w a{ display:flex; align-items:center; justify-content:center; padding:4px 24px; } .c-w img{ width:24px; margin-right:12px; } .c-w p{ font:18px/25px Poppins; text-align:center; color:#fff; margin:0; } @media (max-width:444px){ .c-w a{ padding:4px 12px; } .c-w img{ width:24px; margin-right:8px; } .c-w p{ font:14px/25px Poppins; } } @media (max-width:335px){ .c-w p{ font:13px/25px Poppins; } } Únete al canal de WhatsApp de la SER Dotado con 125.000 euros, el oficialmente llamado Premio de Literatura en Lengua Castellana Miguel de Cervantes recayó el año pasado en el escritor leonés Luis Mateo Díez, y que recogerá el próximo 23 de abril en el Paraninfo de la Universidad de Alcalá de Henares.Premio CervantesCulturaLiteraturaPepa Blanes Es jefa de Cultura de la Cadena SER. Licenciada en Periodismo por la UCM y Máster en Análisis Sociocultural... Leer másLo más leídoLo más escuchadoPlayT12x24 | A quien madruga, RR le abraza15/02/2025Play"El Real Madrid tiene que olvidarse de esta guerra arbitral...": El perjuicio que supone la cruzada blanca contra el arbitraje16/02/2025PlayEl comunicado del Alavés contra el estamento arbitral, la entrevista a Álvaro García y las previas de los partidos ligueros de mañana16/02/2025PlayFlash Deportes | 23:0015/02/2025PlayMillás solo necesita 5 minutos para explicar el fenómeno Montoya y revela qué escena de una película es igual a su reacción16/02/2025'''
