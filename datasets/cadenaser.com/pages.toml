["https://cadenaser.com/nacional/2024/11/10/la-hora-extra-un-viaje-al-corazon-de-las-tinieblas-cadena-ser"]
title = "La Hora Extra | Un viaje al corazón de las tinieblas  | Ocio y cultura  | Cadena SER"
description = "La muerte y los desastres de la guerra atraviesan este nuevo episodio de La Hora Extra a través del teatro y la literatura | Cadena SER"
full_description = '''La Hora ExtraOcio y culturaLa Hora Extra | Un viaje al corazón de las tinieblasLa muerte y los desastres de la guerra atraviesan este nuevo episodio de La Hora Extra a través del teatro y la literaturaPlay/PauseMostrar OpcionesLa Hora Extra | Un viaje al corazón de las tinieblas31:00CerrarDescargarCompartirCerrarCompartirFacebookTwitterLinkedinWhatsappEmbeberEl código iframe se ha copiado en el portapapelesFacebookTwitterLinkedInWhatsAppRaquel GarcíaCadena SER10/11/2024 - 07:00 UTCHoy conversamos con el dramaturgo Joan Yago, encargado de la primera adaptación al teatro de 'Nada' de Carmen Laforet, bailamos con la muerte con la compañía La Veronal entre las obras maestras del Reina Sofía, leemos al premio Goncourt Mathias Enard, que acaba de sacar nueva novela, y nos adentramos en los universos de dos grandes maestros, Hilma af Klint y Vincent van GoghUn viaje a Barcelona, llegar a medianoche sin que nadie te espere, estar sola pero sin miedo, al contrario, que resulte excitante esa profunda libertad de la noche... Ésta es la carta de presentación de 'Nada' de Carmen Laforet, premio Nadal en 1944, una novela que es mucho más que una novela de posguerra. Es una historia que nos habla de una juventud rebelde que intenta construir su propia identidad en medio de los desastres que deja una guerra desde la mirada de una chica de 18 años que solo busca encontrar su camino. 'Nada' acaba de ser adaptada por primera vez al teatro, un encargo del Centro Dramático Nacional al dramaturgo Joan Yago. Con él hemos conversado de cómo se enfrenta la responsabilidad de adaptar por primera vez un clásico y de cómo nos interpela una obra escrita hace 80 años.'Nada' de Carmen Laforet en el CDN / Bárbara Sánchez PalomeroAmpliar'Nada' de Carmen Laforet en el CDN / Bárbara Sánchez PalomeroCerrar¿Hablamos poco de la muerte?. ¿Por qué nos da tanto miedo?. Éste es el terreno que explora la compañía de danza contemporánea La Veronal en su último montaje 'Tontetaz, mañana es la pregunta' que acaba de estrenar en el marco del Festival de Otoño con todas las entradas agotadas. Una obra concebida para el espacio de un museo, en este caso el Reina Sofía, que ofrece al espectador ser parte activa de una triple propuesta: una instalación, un vídeo y una performance que nos invitan a reflexionar sobre nuestra forma de entender la muerte.'Totentaz - Morgen ist die Frage' de La VeronalAmpliar'Totentaz - Morgen ist die Frage' de La VeronalCerrarDesde Barcelona llega a Madrid 'Jauría' de Miguel del Arco, ahora en Nave 10 de Matadero. La obra sobre el juicio a La Manada, estrenada en 2019 cuando todavía no había sentencia del Supremo, un texto construido íntegramente con fragmentos de las declaraciones de los acusados y de la denunciante, sumarios y transcripciones publicadas en los medios, nos llega ahora revisado, con algunos elementos nuevos, otro elenco y una nueva mirada que ofrece el paso del tiempo.AmpliarCerrarEsta semana conocíamos el nombre del nuevo premio Goncourt, el galardón de mayor prestigio de las letras francesas, que este año ha recaído en 'Houris' de Kamel Daoud, un relato sobre las secuelas de la guerra civil en Argelia en los años 90. Sobre la guerra, sobre cómo la guerra nos atraviesa habla la última novela del también premio Goncourt Mathias Enard. .c-w{ max-width:444px; width:100%; margin:32px auto; background:#00755E; border-radius:4px; display:flex; align-items:center; justify-content:center; } .c-w a{ display:flex; align-items:center; justify-content:center; padding:4px 24px; } .c-w img{ width:24px; margin-right:12px; } .c-w p{ font:18px/25px Poppins; text-align:center; color:#fff; margin:0; } @media (max-width:444px){ .c-w a{ padding:4px 12px; } .c-w img{ width:24px; margin-right:8px; } .c-w p{ font:14px/25px Poppins; } } @media (max-width:335px){ .c-w p{ font:13px/25px Poppins; } } Únete al canal de WhatsApp de la SER Mathias Enard y portada de su última novelaAmpliarMathias Enard y portada de su última novelaCerrarDesde Gaza nos llega el trabajo del ilustrador Mohammad Sabaaneh que nos muestra el horror y la muerte que está sufriendo el pueblo palestino. '30 segundos en Gaza' es el título de este álbum publicado por la Fundación Al Fanar. 30 segundos es la duración de los vídeos en redes que los gazatíes mandan documentando la masacre que sufren desde hace más de un año y que, en muchas ocasiones, son borrados por las mismas redes sociales. Se trata de dibujos hechos a mano con tinta china que no se pueden borrar. Es una forma de dar permanencia, nos contaba el artista, a una barbarie que no se puede olvidar.Viñeta de '30 segundos en Gaza'AmpliarViñeta de '30 segundos en Gaza'CerrarSu nombre estuvo olvidado durante años, sepultado por la historia que sí otorgó un lugar a Kandinsky y Mondrian como precursores de la abstracción. Casi nadie sabía de ella hasta que en 2018 el Guggenheim de Nueva York le dedicó una gran retrospectiva. Ahora el Guggenheim de Bilbao abre sus puertas a Hilma af Klint, la artista sueca que legó a su sobrino su ingente obra al morir con una condición: que pasaran al menos 20 años hasta que pudieran exponerla porque creía que el mundo no estaba preparado para entenderla.Hilma af KlintAmpliarHilma af KlintCerrarFueron sus últimos años de vida, una de sus épocas más prolíficas, en la que pintó algunas de sus obras maestras como 'Los girasoles', 'Casa amarilla' y 'Noche estrellada sobre el Ródano'. La National Gallery ha abierto sus puertas al Vincent Van Gogh más poético y conceptual, el que vivió en el sur de Francia, el que se inspiró en poetas y escritores, el que intentó fundar con Gauguin una residencia de artistas. El museo celebra con esta espectacular exposición 200 años de historia.'Noche estrellada sobre el Ródano' de Vincent Van Gogh / Patrice Schmidt / RMN-GPAmpliar'Noche estrellada sobre el Ródano' de Vincent Van Gogh / Patrice Schmidt / RMN-GPCerrarCDNCarmen LaforetGuerra civil españolaPosguerraMuseo Reina SofíaNaves del EspañolMiguel del ArcoPremio GoncourtMathias EnardFranja GazaVincent van GoghNational GalleryGuggenheim BilbaoCómicMuseosLo más leídoLo más escuchadoPlayT12x24 | A quien madruga, RR le abraza15/02/2025Play"El Real Madrid tiene que olvidarse de esta guerra arbitral...": El perjuicio que supone la cruzada blanca contra el arbitraje16/02/2025PlayEl comunicado del Alavés contra el estamento arbitral, la entrevista a Álvaro García y las previas de los partidos ligueros de mañana16/02/2025PlayFlash Deportes | 23:0015/02/2025PlayMillás solo necesita 5 minutos para explicar el fenómeno Montoya y revela qué escena de una película es igual a su reacción16/02/2025'''
