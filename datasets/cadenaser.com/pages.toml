["https://cadenaser.com/nacional/2025/02/01/abres-por-error-una-carta-para-tu-vecina-en-la-que-le-informan-de-que-tiene-clamidia-que-haces-cadena-ser"]
title = "Abres por error una carta para tu vecina en la que le informan de que tiene clamidia: ¿Qué haces?  | Sociedad  | Cadena SER"
description = "Ángeles Caballero ha sorprendido a todos en &#039;La cena de los idiotés&#039; con una historia de despistes, adulterio y venganza | Cadena SER"
full_description = '''Hora 25La cena de los idiotésSociedadAbres por error una carta para tu vecina en la que le informan de que tiene clamidia: ¿Qué haces?Ángeles Caballero ha sorprendido a todos en 'La cena de los idiotés' con una historia de despistes, adulterio y venganzaPlay/PauseMostrar OpcionesAbres por error una carta para tu vecina en la que le informan de que tiene clamidia: ¿Qué haces?08:13CerrarDescargarCompartirCerrarCompartirFacebookTwitterLinkedinWhatsappEmbeberEl código iframe se ha copiado en el portapapelesFacebookTwitterLinkedInWhatsAppAndrés PuentesCadena SER01/02/2025 - 12:13 UTCMadridLa Cena de los Idiotas siempre deja temas para la reflexión, ya sea por parte de Aimar Bretos, Ángeles Caballero y Manuel Jabois, colaboradores habituales del programa, o de alguno de los invitados. En esta ocasión, los participantes fueron Maya Pixelskaya, presentadora de El Condensador de Fluzo, y Cristalino, nominado como actor revelación en los próximos premios Goya. En este caso, fue Caballero quien dejó a todos boquiabiertos con su dilema.La periodista comenzó explicando que el protagonista de esta historia vivía en "un chalet adosado a las afueras de cualquier población". Normalmente teletrabaja y lleva una vida bastante rutinaria, hasta que, de repente, un día, mientras revisaba el correo, una carta del Servicio Madrileño de Salud le sorprende. La abre y descubre que le han "detectado clamidia".Con la preocupación del momento, esta persona empieza a pensar en mil posibilidades hasta que se da cuenta de que no se ha hecho ninguna revisión reciente. Es entonces cuando comprende que realmente no es la destinataria de esa carta, pero sí sabe quién lo es: su vecina.Más informaciónMaría Patiño dice lo que todo el mundo piensa sobre las desigualdades económicas en el mundo laboral: "Hay gente que juega al fútbol y gana por horas…"Fernando Tejero se sincera sobre sus complejos: "La barba es la máscara de los feos"Según contó Ángeles, esta vecina "vive a caballo entre Madrid y Barcelona" y, hace unas semanas, mencionó que debía irse un par de meses a la ciudad condal por trabajo. Por lo tanto, esta persona sabe que no podrá entregarle la carta en mano. En ese momento, se da cuenta de que la única opción es dársela a su marido, con quien se acostó hace meses. Aquel encuentro, además, le "pareció un fiasco" y le dejó "muy mal cuerpo", hasta el punto de cogerle muchísima manía a este hombre.El dilema que planteaba la periodista giraba en torno a este incómodo contacto con un vecino al que tanto odia. Ángeles expuso las dos únicas soluciones viables: Dejarle la carta y explicarle que la abrió por accidente, o vengarse de él, comunicarle que su esposa ha contraído una enfermedad de transmisión sexual y esperar a ver su reacción. .c-w{ max-width:444px; width:100%; margin:32px auto; background:#00755E; border-radius:4px; display:flex; align-items:center; justify-content:center; } .c-w a{ display:flex; align-items:center; justify-content:center; padding:4px 24px; } .c-w img{ width:24px; margin-right:12px; } .c-w p{ font:18px/25px Poppins; text-align:center; color:#fff; margin:0; } @media (max-width:444px){ .c-w a{ padding:4px 12px; } .c-w img{ width:24px; margin-right:8px; } .c-w p{ font:14px/25px Poppins; } } @media (max-width:335px){ .c-w p{ font:13px/25px Poppins; } } Únete al canal de WhatsApp de la SER Las opiniones de los demás comensales fueron bastante similares. Cristalino aseguró que vengarse le daría "reparo" y que optaría por confesar que había leído la carta por accidente, dejando caer que conocía su contenido. De este modo, su vecino sabría que alguien más manejaba la información sobre la enfermedad de su esposa.Maya Pixelskaya expresó una postura similar. Afirmó que, en lo personal, no es "nada vengativa", por lo que simplemente le explicaría que abrió la carta sin querer. Sin embargo, le advertiría de que sabe lo que pone en ella y que, si él no se lo cuenta a su esposa, lo hará ella misma. Manuel Jabois se mostró de acuerdo y aseguró que llamaría a la puerta, se disculparía y no le "contaría nada más".Hablar con el cartero: una opción completamente diferenteLa sorpresa la dio Aimar Bretos, quien se desmarcó por completo de las opciones planteadas por Ángeles. En su lugar, aseguró que "hablaría con el cartero". "Le diría: 'Mire, su fallo me ha metido a mí en un lío increíble. Solvéntelo usted sin decir que he sido yo quien la ha abierto'", explicó el presentador de Hora 25.Sin embargo, la más radical fue la propia inventora del dilema, quien confesó a los demás que se "regocijaría" e "intentaría ver la cara que pone" el vecino al despedirse.Play/PauseMostrar OpcionesLa cena de los idiotés 2x18 | Un tarantrán y se acabó59:14CerrarDescargarCompartirCerrarCompartirFacebookTwitterLinkedinWhatsappEmbeberEl código iframe se ha copiado en el portapapelesEnfermedades ginecológicasVecinosSexualidadAndrés Puentes Antes trabajaba como redactor en el equipo de Hora 25, ahora escribo sobre actualidad en la web. Graduado... Leer másLo más leídoLo más escuchadoPlayLoreto Ochando habla sin tapujos de la gestión de Mazón: "La alarma a las ocho y once minutos, cuando los cadáveres flotaban por las calles"15/02/2025PlayEsther Palomera tira de ironía para analizar el caso del fiscal general del Estado: “Se le ha imputado por desvelar un secreto que conocía medio Madrid”14/02/2025PlayRufián confiesa qué es lo que más le gusta de Pedro Sánchez: "Lo valoro mucho"15/02/2025PlayHora 14 Fin de Semana (15/02/2025)15/02/2025PlayAna Belén revela su desternillante método para calentar la voz: se lo enseñaron ‘Los Javis’ y desde entonces siempre recurre a él14/02/2025'''
