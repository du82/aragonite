["https://cadenaser.com/nacional/2025/01/29/la-ocurrencia-de-elon-musk-que-llevo-a-un-error-a-los-astronomos-confunden-un-coche-con-un-asteroide-potencialmente-peligroso-para-la-tierra-cadena-ser"]
title = "Una ocurrencia de Elon Musk lleva a un error a los astrónomos: confunden un coche con un asteroide potencialmente peligroso  | Ciencia y tecnología  | Cadena SER"
description = "Hace seis años, SpaceX lanzó al espacio un cohete con un Tesla Roadster, que desde entonces vaga por el espacio  | Cadena SER"
full_description = 'Ciencia y tecnologíaUna ocurrencia de Elon Musk lleva a un error a los astrónomos: confunden un coche con un asteroide potencialmente peligrosoHace seis años, SpaceX lanzó al espacio un cohete con un Tesla Roadster, que desde entonces vaga por el espacio El Tesla Roadster de Elon Musk en el espacio. / Space XAmpliarCerrarFacebookTwitterLinkedInWhatsAppRedacciónCadena SER29/01/2025 - 10:37 UTCMadridEl 6 de febrero de 2018, la empresa de transporte aeroespacial SpaceX lanzó su cohete Falcon Heavy desde la plataforma de lanzamiento 39A del centro espacial John F. Kennedy de Cabo Cañaveral (Florida, EEUU). El cohete más potente del mundo por aquel entonces ponía rumbo al espacio con un Tesla Roadster en su interior con el objetivo de demostrar que era capaz de poner cargas pesadas en órbitas muy lejanas. No era un coche cualquiera, ya que había pertenecido al director ejecutivo de SpaceX y Tesla, Elon Musk.Una ocurrencia del magnate que, seis años después, ha provocado que los astrónomos confundieran el vehículo con un asteroide potencialmente peligroso para la Tierra. Los hechos ocurrieron el 2 de enero de 2025. Ese día, un grupo de científicos descubrió un "asteroide" a menos de 240.000 kilómetros de nuestro planeta, entre la Tierra y la Luna, al que decidieron llamar 2018 CN41.Sin embargo, tras analizarlo con más detalle, descubrieron que se trataba de un asteroide, sino del descapotable rojo Tesla Roadster, que SpaceX lanzó a bordo del cohete Falcon Heavy en 2018. El error solo duró 17 horas, pero lo hemos conocido este martes.El coche, que llegó a ser conducido por el propio Elon Musk, fue enviado al espacio con la intención de llegar a la órbita de Marte, pero su paradero era un misterio desde entonces. Ahora hemos sabido que continúa moviéndose sin control entre la Tierra y Marte, con un maniquí llamado Starman, en honor a la famosa canción de David Bowie, sentado al volante. Originalmente, llevaba puestas dos canciones del artista sonando en bucle: Space Oddity y Life on Mars.Tras comprobar que se trataba de una confusión, los astrónomos rectificaron y eliminaron el nombre del falso asteroide de los registros oficiales. .c-w{ max-width:444px; width:100%; margin:32px auto; background:#00755E; border-radius:4px; display:flex; align-items:center; justify-content:center; } .c-w a{ display:flex; align-items:center; justify-content:center; padding:4px 24px; } .c-w img{ width:24px; margin-right:12px; } .c-w p{ font:18px/25px Poppins; text-align:center; color:#fff; margin:0; } @media (max-width:444px){ .c-w a{ padding:4px 12px; } .c-w img{ width:24px; margin-right:8px; } .c-w p{ font:14px/25px Poppins; } } @media (max-width:335px){ .c-w p{ font:13px/25px Poppins; } } Únete al canal de WhatsApp de la SER Space XAstronomíaTesla MotorsElon MuskLo más leídoLo más escuchadoPlayT12x24 | A quien madruga, RR le abraza15/02/2025Play"El Real Madrid tiene que olvidarse de esta guerra arbitral...": El perjuicio que supone la cruzada blanca contra el arbitraje16/02/2025PlayEl comunicado del Alavés contra el estamento arbitral, la entrevista a Álvaro García y las previas de los partidos ligueros de mañana16/02/2025PlayFlash Deportes | 23:0015/02/2025PlayMillás solo necesita 5 minutos para explicar el fenómeno Montoya y revela qué escena de una película es igual a su reacción16/02/2025'
