["https://cadenaser.com/nacional/2025/01/29/karla-sofia-gascon-y-elena-lopez-riera-nominadas-a-los-premios-cesar-del-cine-frances-cadena-ser"]
title = "Karla Sofía Gascón y Elena López Riera, nominadas a los Premios César del cine francés   | Ocio y cultura  | Cadena SER"
description = "‘Las novias del sur’ opta a Mejor Cortometraje Documental y Gascón aspira a la mejor interpretación | Cadena SER"
full_description = '''El cine en la SEROcio y culturaKarla Sofía Gascón y Elena López Riera, nominadas a los Premios César del cine francés ‘Las novias del sur’ opta a Mejor Cortometraje Documental y Gascón aspira a la mejor interpretaciónKarla Sofía Gascón, en el Festival de Cannes para presentra 'Emilia Pérez', la película en la que comparte pantalla con Selena Gómez. / Neilson BarnardAmpliarCerrarFacebookTwitterLinkedInWhatsAppEFECadena SER29/01/2025 - 11:33 UTCLa actriz española Karla Sofía Gascón aspira al César a la mejor interpretación femenina por su papel en 'Emilia Pérez', film que acumula 12 nominaciones en estos galardones, que son los más importantes del cine francés. El narcomusical de Jacques Audiard ha sido, no obstante, superado en nominaciones por 'El conde de Montecristo' y 'L'amour ouf', 'Corazones rotos' . Estos dos últimos títulos, dirigidos por Matthieu Delaporte y Alexandre de La Patellière en el primer caso y por Gilles Lellouche en el segundo, acumularon respectivamente 14 y 13 nominaciones respectivamente, según la lista dada a conocer este miércoles por la Academia de los César. Gascón, que ya ha hecho historia como la primera actriz trans nominada a los Premios Óscar, deberá competir en su categoría con su compañera de reparto Zoe Saldaña y con las francesas Adèle Exarchopoulos 'L'amour ouf', Hafsia Herzi, 'Borgo' y Hélène Vincent (Quand vient l’automne).'Las novias del sur', de Elena López Riera, ha sido nominada como Mejor Cortometraje Documental para los Premios César 2025. .c-w{ max-width:444px; width:100%; margin:32px auto; background:#00755E; border-radius:4px; display:flex; align-items:center; justify-content:center; } .c-w a{ display:flex; align-items:center; justify-content:center; padding:4px 24px; } .c-w img{ width:24px; margin-right:12px; } .c-w p{ font:18px/25px Poppins; text-align:center; color:#fff; margin:0; } @media (max-width:444px){ .c-w a{ padding:4px 12px; } .c-w img{ width:24px; margin-right:8px; } .c-w p{ font:14px/25px Poppins; } } @media (max-width:335px){ .c-w p{ font:13px/25px Poppins; } } Únete al canal de WhatsApp de la SER Todas las nominacionesEn la categoría de mejor película, las películas nominadas fueron: El conde de Montecristo.En fanfare.Misericorde.L'histoire de Souleymane'.Emilia Pérez.Y en la de actor, los francesesFrançois Civil por su papel en el drama romántico 'L'amour ouf'.Benjamin Lavernhe como protagonista de la comedia 'En fanfare'.Karim Leklou por el humor negro de 'Miséricorde'.Tahar Rahim por su trabajo metiéndose en la piel del legendario Charles Aznavour (en el biopic 'Monsieur Aznavour'.) Pierre Niney por su versión del conde de Montecristo. En cuanto a la realización, el premio a la mejor dirección se lo disputarán:Jacques Audiard ('Emilia Pérez' ).La dupla Matthieu Delaporte y Alexandre de La Patellière ('El conde de Montecristo').Gilles Lellouche ('L'amour ouf').Boris Lojkine ('L'histoire de Souleymane').Alain Guiraudie ('Miséricorde'). Estos dos últimos filmes también han cosechado un buen puñado de nominaciones, justo por detrás de las grandes favoritas, con ocho cada una. En el apartado de mejor filme extranjero, tampoco en Francia hubo recompensa para el español Pedro Almodóvar ya que optarán:'Anora'.'The Seed of the Sacred Fig'.' The Apprentice' 'The Substance' 'The zone of interest' La gala tendrá lugar el próximo 28 de febrero y en ella se hará entrega de un César de honor a la actriz estadounidense Julia Roberts, así como al cineasta grecofrancés Costa-Gavras. La ceremonia estará presidida por la actriz Catherine Deneuve y presentada por el rapero, director y actor Jean-Pascal Zadi, conocido por sus papeles cómicos. De cara a esta gala, la Academia de los César ha reforzado sus reglas contra las violencias sexuales después de la avalancha de denuncias que vivió el celuloide francés en los últimos dos años y que ya en 2024 tuvieron un papel protagonista en la ceremonia con un emocionante discurso de la actriz Judith Godrèche, embajadora del 'Me Too' galo. En concreto, después de que el año pasado se decidiera no dar ningún protagonismo en la gala de ese año a quienes hubieran aparecido como sospechosos de violencia sexual o sexista en un procedimiento judicial, la Academia anunció la semana pasada que a cualquier miembro en esa situación se le suspenderá su derecho de voto hasta el término del procesoKarla Sofía GascónPremios CésarLo más leídoLo más escuchadoPlayT12x24 | A quien madruga, RR le abraza15/02/2025Play"El Real Madrid tiene que olvidarse de esta guerra arbitral...": El perjuicio que supone la cruzada blanca contra el arbitraje16/02/2025PlayEl comunicado del Alavés contra el estamento arbitral, la entrevista a Álvaro García y las previas de los partidos ligueros de mañana16/02/2025PlayFlash Deportes | 23:0015/02/2025PlayMillás solo necesita 5 minutos para explicar el fenómeno Montoya y revela qué escena de una película es igual a su reacción16/02/2025'''
