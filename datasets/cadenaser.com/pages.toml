["https://cadenaser.com/nacional/2025/02/14/la-asociacion-de-promotores-de-cataluna-sugiere-construir-dos-entradas-en-los-edificios-para-separar-las-viviendas-sociales-de-las-privadas-cadena-ser"]
title = 'La Asociación de Promotores de Cataluña sugiere construir "dos entradas" en los edificios para separar las viviendas sociales de las privadas  | Sociedad  | Cadena SER'
description = "Esta medida tendría lugar en los edificios que estén afectados por la normativa que obliga a que el 30% de la nueva construcción se destine al alquiler social | Cadena SER"
full_description = 'SociedadLa Asociación de Promotores de Cataluña sugiere construir "dos entradas" en los edificios para separar las viviendas sociales de las privadasEsta medida tendría lugar en los edificios que estén afectados por la normativa que obliga a que el 30% de la nueva construcción se destine al alquiler socialPlay/PauseMostrar OpcionesLa Asociación de promotores de Cataluña plantea crear "dos puertas" para separar las viviendas de ricos y pobres01:33CerrarDescargarCompartirCerrarCompartirFacebookTwitterLinkedinWhatsappEmbeberEl código iframe se ha copiado en el portapapelesFacebookTwitterLinkedInWhatsAppRedacciónCadena SER14/02/2025 - 20:39 UTCContinúa el debate sobre vivienda en Cataluña, concretamente sobre cómo abordar la normativa municipal que obliga a que el 30% de los edificios de nueva construcción vayan destinados al alquiler social. En este contexto, la patronal señala que está resultando muy complicada la venta de bloques mixtos, aquellos que combinan algunos pisos de vivienda pública junto con otros de libre mercado.Más informaciónEl PSOE de Vila exige al gobierno local que recupere las ayudas al alquilerPlataforma de Afectados por la Hipoteca: "El programa de Alquiler Seguro es arbitrario e inseguro"Así se ha desprendido de un nuevo congreso sobre la vivienda en el que se ha resaltado este problema emergente. Preguntada al respecto, la vicepresidenta de la Asociación de Promotores de Cataluña, Elena Massot, ha concluido que hay compradores para los que compartir edificio con gente de alquiler social supone un inconveniente. Massot, así, ha planteado una solución para evitar esta situación.Se trata de la construcción de "dos puertas" o accesos distintos para entrar al mismo edificio, que segreguen a las personas en función de su renta. Una de estas entradas, de este modo, estaría disponible para los de libre mercado, mientras que la otra lo estaría para la gente de alquiler social.Massot, por su parte, ha aclarado que las razones detrás de esta segregación por rentas no tiene nada que ver con evitar "la mixtura social". No solo eso, sino que la vicepresidenta también ha agregado que con esta nueva medida, las familias con menos posibilidades económicas tendrían que pagar menos gastos de comunidad, lo que supondría un beneficio añadido.Alcarazo se enzarza con la medida de MassotEn el ya citado congreso sobre vivienda también se encontraba la portavoz del sindicato de inquilinas, Carmen Alcarazo, quien no ha dudado en enzarzarse con Massot tras escuchar la medida propuesta. "Entiendo que a los ricos les da asco compartir escalera con los pobres", ha comentado Alcarazo, al tiempo que la vicepresidenta de la citada asociación negaba rotundamente estas declaraciones: "Yo no he dicho eso", ha apostillado. .c-w{ max-width:444px; width:100%; margin:32px auto; background:#00755E; border-radius:4px; display:flex; align-items:center; justify-content:center; } .c-w a{ display:flex; align-items:center; justify-content:center; padding:4px 24px; } .c-w img{ width:24px; margin-right:12px; } .c-w p{ font:18px/25px Poppins; text-align:center; color:#fff; margin:0; } @media (max-width:444px){ .c-w a{ padding:4px 12px; } .c-w img{ width:24px; margin-right:8px; } .c-w p{ font:14px/25px Poppins; } } @media (max-width:335px){ .c-w p{ font:13px/25px Poppins; } } Únete al canal de WhatsApp de la SER Ha sido entonces cuando Elena Massot ha vuelto a incidir en que los compradores se "echan para atrás" cuando descubren que convivirían en un edificio mixto con gente de alquiler social, sobre todo por la diferencia tan elevada en las rentas. Además, la vicepresidenta no ha dudado en justificar esta propuesta. "Lo que hacemos es aportar una solución", ha argumentado.Viviendas alquilerViviendaLo más leídoLo más escuchadoPlayT12x24 | A quien madruga, RR le abraza15/02/2025Play"El Real Madrid tiene que olvidarse de esta guerra arbitral...": El perjuicio que supone la cruzada blanca contra el arbitraje16/02/2025PlayEl comunicado del Alavés contra el estamento arbitral, la entrevista a Álvaro García y las previas de los partidos ligueros de mañana16/02/2025PlayFlash Deportes | 23:0015/02/2025PlayMillás solo necesita 5 minutos para explicar el fenómeno Montoya y revela qué escena de una película es igual a su reacción16/02/2025'
