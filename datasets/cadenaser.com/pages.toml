["https://cadenaser.com/nacional/2025/02/12/trump-esta-haciendo-posible-el-sueno-mas-humedo-de-putin-el-analisis-de-una-experta-sobre-las-negociaciones-de-paz-en-ucrania-cadena-ser"]
title = '"Trump está haciendo posible el sueño más húmedo de Putin": el análisis de una experta sobre las negociaciones de paz en Ucrania  | Internacional  | Cadena SER'
description = "Aimar Bretos entrevista a Carmen Claudín, investigadora sénior asociada del CIDOB | Cadena SER"
full_description = '''Hora 25La entrevistaInternacional"Trump está haciendo posible el sueño más húmedo de Putin": el análisis de una experta sobre las negociaciones de paz en UcraniaAimar Bretos entrevista a Carmen Claudín, investigadora sénior asociada del CIDOBPlay/PauseMostrar OpcionesCarmen Claudín: "Trump está haciendo posible el sueño más húmedo de Putin"05:58CerrarDescargarCompartirCerrarCompartirFacebookTwitterLinkedinWhatsappEmbeberEl código iframe se ha copiado en el portapapelesFacebookTwitterLinkedInWhatsAppJosema Jiménezjosemajimenez84Cadena SER12/02/2025 - 21:35 UTCMadridEl presidente de los Estados Unidos, Donald Trump, ha hablado esta tarde con el presidente ruso, Vladimir Putin y con el ucraniano, Volodimir Zelenski, para intentar poner fin a la guerra en Ucrania. Lo ha hecho por ese orden, que es importante: primero Putin, después Zelenski. Por lo que sabemos a esta hora, Trump y Putin han pactado iniciar negociaciones de inmediato para la paz. Lo que no sabemos es en qué términos. En 'Hora 25', analizamos el escenario que se abre ahora con Carmen Claudín, investigadora sénior asociada del CIDOB (Centro de Asuntos Internacionales de Barcelona).¿Qué debemos concluir del anuncio que han hecho hoy Trump y Putin? "Es un acuerdo entre dos cómplices de una misma visión del mundo y de cómo deben ser resueltos los grandes problemas del momento. Ni siquiera ya es el reparto que se hizo a la salida de la guerra en Yalta, donde al menos había tres representantes: Churchill, Roosevelt y Stalin. Churchill ha desaparecido de este mapa, su equivalente, que es Europa. Y solo quedan Trump y Putin. Ni diría siquiera que quedan Estados Unidos y Rusia, porque quiero pensar que ninguno de los dos representa del todo a su país, pero el hecho es que en este momento ellos mandan", responde la experta.Y continúa: "Por parte de Trump, lo que está haciendo es una traición a un pueblo que ha demostrado su valor, defendiéndose contra un enemigo infinitamente más potente que él y que gracias a eso, por cierto, ha impedido que Rusia gane. A pesar de que puede ocurrir que efectivamente estos dos líderes consigan imponer a los ucranianos esta solución, aún así no es una victoria de Rusia. Rusia lo que pretendía era acabar con Ucrania, la Ucrania independiente y soberana. Esta Ucrania sigue de pie. Trump ha hecho posible el sueño más húmedo de Putin. Es evidente que hay una complicidad entre ellos".Respecto al papel de la Unión Europea: "Lo lamentable es que Europa no está en la mesa. Pero eso es en gran parte culpa de la UE porque no hemos sido capaces de estar a la altura de lo que Ucrania necesitaba. Es cierto que hemos enviado mucha ayuda económica y militar, pero esa ayuda militar no ha sido suficiente, no lo ha sido nunca. Siempre ha estado supeditada al miedo de escalar el llamado conflicto, y digo llamado porque no es un conflicto, sino una guerra. Todas las armas que hemos enviado, las ayudas defensivas y de ataque, han sido insuficientes porque han llegado tarde y desfasadas. Cuando llegaban la situación en el terreno ya había cambiado. Los ucranianos son heroicos, pero con el heroísmo no puedes derribar tanques", concluye Carmen Claudín.Donald TrumpRusiaUcraniaGuerraVladímir PutinVolodimir ZelenskiJosema Jiménez Periodista de Sanlúcar de Barrameda. Trabajo en la Cadena SER desde 2018. Antes en Hoy por Hoy, ahora... Leer másLo más leídoLo más escuchadoPlayLoreto Ochando habla sin tapujos de la gestión de Mazón: "La alarma a las ocho y once minutos, cuando los cadáveres flotaban por las calles"15/02/2025PlayEsther Palomera tira de ironía para analizar el caso del fiscal general del Estado: “Se le ha imputado por desvelar un secreto que conocía medio Madrid”14/02/2025PlayRufián confiesa qué es lo que más le gusta de Pedro Sánchez: "Lo valoro mucho"15/02/2025PlayHora 14 Fin de Semana (15/02/2025)15/02/2025PlayAna Belén revela su desternillante método para calentar la voz: se lo enseñaron ‘Los Javis’ y desde entonces siempre recurre a él14/02/2025'''
