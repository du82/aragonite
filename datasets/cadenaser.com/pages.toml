["https://cadenaser.com/castillayleon/2025/02/16/miles-de-leoneses-exigen-en-las-calles-un-plan-de-urgencia-que-saque-de-la-uvi-a-la-provincia-radio-leon"]
title = 'Cerca de 15.000 personas exigen en las calles “un plan de urgencia" que "saque de la UVI” a la provincia de León  | Sociedad  | Cadena SER'
description = "Miles de personas han respondido a la llamada de los cuatro principales sindicatos de clase de León para dejar constancia en las calles del hartazgo de la sociedad leonesa ante la grave crisis económica y social que sufre la provincia. | Cadena SER"
full_description = 'SociedadCerca de 15.000 personas exigen en las calles “un plan de urgencia" que "saque de la UVI” a la provincia de LeónVista de la manifestaciónAmpliarCerrarFacebookTwitterLinkedInWhatsAppMaría García BeberideRadio León16/02/2025 - 11:48 UTCLeónMiles de personas han respondido a la llamada de los cuatro principales sindicatos de clase de León para dejar constancia en las calles del hartazgo de la sociedad leonesa ante la grave crisis económica y social que sufre la provincia.De hecho, las cifras son discrepantes entre organizadores y fuentes oficiales. Los segundos hablan de 13.500 personas en esa movilización, mientras los organizadores disparan la participación en varios miles de personas más.El objetivo de la marcha era llamar la atención de las administraciones superiores para que actúen con urgencia ante la decadencia demográfica y de desarrollo que atraviesa León.Una pancarta por la autonomía para LeónAmpliarUna pancarta por la autonomía para LeónCerrarBajo el lema ‘Más soluciones, menos cuentos’, los cuatro sindicatos convocantes reclaman un plan de emergencia de inversión pública que se centre en la reindustrialización, las infraestructuras, los servicios públicos y el empleo de calidad.Cabecera de la movilización en LeónAmpliarCabecera de la movilización en LeónCerrarCon la despoblación desbocada, León ha perdido cerca de 53.000 habitantes en apenas dos décadas, el envejecimiento disparado y la peor tasa de actividad de toda España, los sindicatos han conseguido recuperar el pulso a la calle para dejar constancia del hartazgo social ante este declive. .c-w{ max-width:444px; width:100%; margin:32px auto; background:#00755E; border-radius:4px; display:flex; align-items:center; justify-content:center; } .c-w a{ display:flex; align-items:center; justify-content:center; padding:4px 24px; } .c-w img{ width:24px; margin-right:12px; } .c-w p{ font:18px/25px Poppins; text-align:center; color:#fff; margin:0; } @media (max-width:444px){ .c-w a{ padding:4px 12px; } .c-w img{ width:24px; margin-right:8px; } .c-w p{ font:14px/25px Poppins; } } @media (max-width:335px){ .c-w p{ font:13px/25px Poppins; } } Únete al canal de WhatsApp de la SER Otra pancarta clama por un futuro en la provinciaAmpliarOtra pancarta clama por un futuro en la provinciaCerrarMás de 60 asociaciones y colectivos se han adherido a la protesta de los sindicatos, alcanzando así la transversalidad que buscaban las organizaciones convocantes.Todas la comarca se unieron a la marcha como esta representación de LacianaAmpliarTodas la comarca se unieron a la marcha como esta representación de LacianaCerrarTodos los partidos políticos han estado presentes, excepto la ultraderecha, la patronal leonesa, los 20 colegios profesionales inscritos en ColproLeón, así como asociaciones sociales y culturales de distinta índole.Pancartas a favor del LexitAmpliarPancartas a favor del LexitCerrarEn la marcha ha habido también fuerte presencia delos movimientos leonesistas, tanto de carácter político, en este caso liderados por UPL, como de carácter social. Xuntanza Llionesista y Conceyu País Lliones se encargaron de ondear la bandera autonomista reclamando formar la décimo octava comunidad autónoma como única vía para solucionar los problemas que atraviesa la región leonesa.Reivindicación del LexitAmpliarReivindicación del LexitCerrarMiles de personas se sumaron a sus cánticos presidido por las letras gigantes que formaban un gran LEXIT, ya habitual en este tipo de citas.María García Beberide Periodista. Contando historias en la radio desde 2012. Tras aprender el oficio en Radio Bierzo, aterricé... Leer másLo más leídoLo más escuchadoPlayGol Luis Chacón (2-2) (15/02/2025)15/02/2025PlayGol de Luis Chacón (2-1) (15/02/2025)15/02/2025'
