["https://cadenaser.com/nacional/2025/01/30/el-actor-richard-gere-goya-internacional-2025-cadena-ser"]
title = "El actor Richard Gere, Goya Internacional 2025  | Cine y TV  | Cadena SER"
description = "El actor y productor estadounidense recibirá la máxima distinción del cine español a un cineasta internacional &quot;por su extraordinaria contribución al arte cinematográfico protagonizando algunas de las películas más icónicas de la historia&quot; | Cadena SER"
full_description = 'El cine en la SERCine y TVEl actor Richard Gere, Goya Internacional 2025El actor y productor estadounidense recibirá la máxima distinción del cine español a un cineasta internacional "por su extraordinaria contribución al arte cinematográfico protagonizando algunas de las películas más icónicas de la historia"Richard Gere, el pasado mes de diciembre en Madrid(Photo by Pamela Rovaris/Archivio Pamela Rovaris/Mondadori Portfolio via Getty Images) / Mondadori PortfolioAmpliarCerrarFacebookTwitterLinkedInWhatsAppRedacciónCadena SER30/01/2025 - 11:02 UTCMadridTras Cate Blanchett, Juliette Binoche y Sigourney Weaver, la Academia de Cine española concede el Goya Internacional a Richard Gere, el actor americano afincado desde hace unos meses en España. En un comunicado, la institución argumenta que el actor y productor estadounidense recibirá este galardón el próximo 8 de febrero en Granado "por su extraordinaria contribución al arte cinematográfico, protagonizando algunas de las películas más icónicas de la historia del cine, y el compromiso social manifestado en lo personal y profesional".Richard Gere es uno de los grandes galanes del cine, un actor carismático y también comprometido protagonista de títulos como Días del cielo, Oficial y caballero, American Gigolo, The Cotton Club, Pretty Woman, y el musical Chicago, por el que gano el Globo de Oro. Gere lleva cinco décadas actuando y recogerá el Goya Internacional precisamente en el año en el que se cumple el 50 aniversario de su debut en la gran pantalla. Terrence Malick, Francis Ford Coppola, John Schlesinger, Robert Altman, Paul Schrader, Richard Brooks, Lasse Hallström, Mike Figgis, Todd Haynes, Rob Marshall, Mira Nair y Jerry Zucker son algunos de los directores/as que conforman la filmografía del también protagonista de Cónsul honorario, Atrapados sin salida, Buscando al señor Goodbar, Siempre a tu lado (Hachiko), Asuntos sucios, Mr. Jones, El primer caballero, Chacal, La gran estafa, I’m not there, El caso Wells, Amelia y Los amos de Brooklyn. Gere nació en Filadelfia hace 75 años y creció en una pequeña ciudad de la Parte Alta del Estado de Nueva York.Más informaciónRichard Gere: "Yo fui objetor de conciencia de Vietnam, fue una estupidez involucrarnos en esa guerra"Julia Roberts (con quien rodó la ya clásica Pretty Woman y Novia a la fuga), Kim Bassinger (Asuntos sucios y Análisis final), Jodie Foster (Sommersby), Winona Ryder (Otoño en Nueva York), Susan Sarandon (¿Bailamos? y El fraude), Diane Keaton (Buscando al señor Goodba), Diane Lane (The Cotton Club, Infiel y Noches de tormenta) y Uma Thurman (Análisis final y la recientemente estrenada Oh, Canada) han sido algunas de las co-protagonistas de Gere, que en el 2007 recibió el Premio Donostia del Festival de San Sebastián. Hace más de 30 años fundó la Gere Foundation para canalizar su intenso activismo en favor de la autonomía del Tíbet y la preservación de la cultura tibetana enarbolada por el Dalai Lama –Gere practica el budismo desde los veinte años–; así como su apoyo a los derechos de los pueblos indígenas, los refugiados y las personas sin hogar. Su profundo compromiso con estas causas traspasa fronteras y le ha llevado a colaborar, entre otras, con las ONG’s Survival International, Open Arms y Hogar Sí. El actor también es un fuerte defensor de la protección del medioambiente y a través de su fundación respalda un ambicioso proyecto de conservación natural, Sierra a Mar, en México.⚠️ Aviso a productores y directores españoles. Richard Gere está deseando escuchar ofertas para trabajar aquíEl actor, que reside en España desde hace algunos meses, presenta #OhCanada 📽️ Pronto la entrevista completa pic.twitter.com/rMm3bC3flB— El cine en la SER (@ElCineEnLaSER) December 19, 2024 Richard Gere, que ha encontrado su sitio en España –reside en nuestro país desde el pasado otoño– empezó como músico –toca varios instrumentos– antes de dedicarse a la actuación. Fiel a su imagen –inconfundible su pelo largo y plateado–, el que fue icono de moda en los años ochenta –los trajes de Armani que lució en American Gigolo le convirtieron en el hombre del momento– ha manifestado que la persona que más influencia ha tenido en su vida ha sido su padre, en quien se inspiró para su última película Oh, Canada. Durante la promoción de esa película concedió varias entrevistas en España y manifestó su deseo de trabajar aquí. "Claro que me gustaría trabajar aquí. Sé que tenéis un gran cine español, tengo muchas ganas de conocer a más gente aquí y pasar a formar parte de vuestra industria", respondía a preguntas de la Cadena SER.Richard GerePremios GoyaLo más leídoLo más escuchadoPlayT12x24 | A quien madruga, RR le abraza15/02/2025Play"El Real Madrid tiene que olvidarse de esta guerra arbitral...": El perjuicio que supone la cruzada blanca contra el arbitraje16/02/2025PlayEl comunicado del Alavés contra el estamento arbitral, la entrevista a Álvaro García y las previas de los partidos ligueros de mañana16/02/2025PlayFlash Deportes | 23:0015/02/2025PlayMillás solo necesita 5 minutos para explicar el fenómeno Montoya y revela qué escena de una película es igual a su reacción16/02/2025'
