["https://cadenaser.com/audio/1739750196841"]
title = "El Real Madrid se reúne con el CTA, el Barça puede ser líder de Liga y Unicaja es nuevo campeón de Copa | CADENA SER"
description = "<p>Unicaja se ha proclamado campeón de la Copa del Rey de baloncesto después de vencer al Real Madrid en el Gran Canaria Arena por 93 a 79, Alberto Díaz pasó por el Carrusel Canalla para celebrar el triunfo. El Real Madrid visitará mañana la sede de la RFEF en Las Rozas para escuchar los audios del VAR del Espanyol-Real Madrid. Además, el Barça podría ser líder de LaLiga si gana mañana al Rayo Vallecano y la entrevista con la madre de una de las víctimas de la agresión de unos ultras del Valencia a unos aficionados del Villarreal.</p> | Cadena SER"
