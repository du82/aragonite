["https://cadenaser.com/cmadrid/2025/02/13/arcopoli-alerta-de-la-desaparicion-de-su-observatorio-contra-delitos-de-odio-por-falta-de-financiacion-del-gobierno-de-ayuso-radio-madrid"]
title = "Arcópoli alerta de la desaparición de su Observatorio contra delitos LGTBI por falta de financiación del Gobierno de Ayuso   | Sociedad  | Cadena SER"
description = "En 2023, el Observatorio madrileño contra la LGTBIfobia documentó más de 200 incidentes de odio en la región | Cadena SER"
full_description = '''SociedadArcópoli alerta de la desaparición de su Observatorio contra delitos LGTBI por falta de financiación del Gobierno de Ayuso En 2023, el Observatorio madrileño contra la LGTBIfobia documentó más de 200 incidentes de odio en la regiónManifestación en favor de los derechos LGTBI en Madrid / SOPA ImagesAmpliarCerrarFacebookTwitterLinkedInWhatsAppLydia Payolydia_pmRadio Madrid13/02/2025 - 06:30 UTCMadridDenuncian desde la asociación que el Gobierno madrileño ha cambiado la línea de subvenciones, de las específicas para personas LGTBI, a la convocatoria general del IRPF donde hay más proyectos -que abordan otros asuntos- entre los que repartir la financiación y, por eso, se reduce la cuantía.Una decisión que para Arcópoli responde a la deriva que el ejecutivo de Ayuso lleva con el colectivo LGTBI. "Evidentemente, esta es la hoja de ruta que la Comunidad de Madrid, y la presidenta, está siguiendo contra los derechos del colectivo", señala Luis Fernando Rosales, coordinador de la asociación. Y sigue: "Lo hemos visto con la modificación de las leyes -que luego ha tenido que hacer otra modificación porque sabía que era inconstitucional- lo hemos visto también con la eliminación a las subvenciones específicas LGTBI, y con la eliminación de la subdirección LGTBI en la Consejería de Familia".Una herramienta para visibilizar los delitos de odioDesde su origen, en 2016, el Observatorio recibía una subvención pública anual de 40 mil euros, pero para 2025 el apoyo se reducirá a 28.000€. Un proyecto que solo en 2023 documentó más de 200 incidentes de odio, a pesar de que solo 2 de cada 10 personas denuncian este tipo de violencia. "Es un poco desolador porque, al final, la administración pública debe de proveer de ciertos recurso que permitan a las personas encontrar justicia y, principalmente, reparación ante estos casos de acoso, agresiones o discriminación que se siguen sucediendo en la sociedad", lamenta Rosales.El Observatorio no solo documenta las agresiones físicas y verbales al colectivo LGTBI en la región y ofrece asesoría jurídica y acompañamiento a las víctimas, sino que también presenta cada año un informe que constituye una radiografía de los delitos de odio en la Comunidad de Madrid que "sirve para visibilizar estos incidentes".Play/PauseArcópoli denuncia falta de financiación01:05Mostrar OpcionesCerrarDescargarCompartirCerrarCompartirFacebookTwitterLinkedinWhatsappEmbeberEl código iframe se ha copiado en el portapapelesLa manera de evaluar del IRPF y las cuantías repartidas dejan al Observatorio en "mínimos históricos, a pesar de haber obtenido los mejores resultados", señala el portavoz. Una cuantía insuficiente, porque solo una persona trabajando a jornada completa cuesta 30.000", explican desde Arcópoli. Por eso, han lanzado una campaña de 'crowdfunding' para intentar llegar al mínimo y garantizar la continuidad del Observatorio. .c-w{ max-width:444px; width:100%; margin:32px auto; background:#00755E; border-radius:4px; display:flex; align-items:center; justify-content:center; } .c-w a{ display:flex; align-items:center; justify-content:center; padding:4px 24px; } .c-w img{ width:24px; margin-right:12px; } .c-w p{ font:18px/25px Poppins; text-align:center; color:#fff; margin:0; } @media (max-width:444px){ .c-w a{ padding:4px 12px; } .c-w img{ width:24px; margin-right:8px; } .c-w p{ font:14px/25px Poppins; } } @media (max-width:335px){ .c-w p{ font:13px/25px Poppins; } } Únete al canal de WhatsApp de la SER Desde la Consejería de Asuntos Sociales explican que la asociación obtuvo en las subvenciones del IRPF del año 2024 un total de 133.000 euros por cuatro proyectos concedidos, frente a los 158.000 euros que recibió en 2023 entre las subvenciones de IRPF y LGTBI. Señalan, además, que la decisión de Arcópoli de incluir el proyecto del Observatorio en una línea fuera de la específica dedicada a proyectos LGTBI es la causa de la bajada de fondos percibidos.MadridComunidad LgtbiqLGTBIfobiaIsabel Díaz AyusoPP MadridLydia Payo Redactora de informativos y de la parte digital de Radio Madrid. Presentadora del Podcast 'Todo es Empezar'... Leer másLo más leídoLo más escuchadoPlayLas noticias de las 12:0015/02/2025PlayLa columna de Espido Freire. ‘Andy Warhol. Posters’: los 15 minutos de fama se nos han quedado cortos16/02/2025PlayRufián se sincera sobre el momento en el que se le subió la fama a la cabeza: "Me creía que lo que hacía era trascendente"14/02/2025Play'Camino al zoo', la rompedora obra del Teatro Bellas Artes que nos pone frente al espejo de la condición humana16/02/2025PlayFlash Deportes | 23:0014/02/2025'''
