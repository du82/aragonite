["https://cadenaser.com/aragon/2025/01/15/el-pueblo-viejo-de-belchite-al-borde-de-su-desaparicion-si-no-se-nos-escucha-no-sabemos-si-seran-10-o-20-anos-pero-sera-dificil-de-mantenerlo-radio-zaragoza"]
title = 'El pueblo viejo de Belchite, al borde de su desaparición: "Si no se nos escucha, no sabemos si serán 10 o 20 años, pero será difícil de mantenerlo"  | Sociedad  | Cadena SER'
description = "Un jurado de Nueva York ha incluido estas ruinas en la lista de los 25 monumentos en “peligro de extinción” del planeta, los World Monuments Watch 2025, que buscan visibilizar el patrimonio en peligro para recibir el apoyo insitucional necesario para su conservación | Cadena SER"
full_description = 'SociedadEl pueblo viejo de Belchite, al borde de su desaparición: "Si no se nos escucha, no sabemos si serán 10 o 20 años, pero será difícil de mantenerlo"Un jurado de Nueva York ha incluido estas ruinas en la lista de los 25 monumentos en “peligro de extinción” del planeta, los World Monuments Watch 2025, que buscan visibilizar el patrimonio en peligro para recibir el apoyo insitucional necesario para su conservaciónPlay/PauseMostrar OpcionesLa Ventana de Aragón, desde el pueblo viejo de Belchite20:01CerrarDescargarCompartirCerrarCompartirFacebookTwitterLinkedinWhatsappEmbeberEl código iframe se ha copiado en el portapapelesFacebookTwitterLinkedInWhatsAppPilar TardioRadio Zaragoza15/01/2025 - 19:00 UTCZaragozaEn el pueblo viejo de Belchite hace décadas que no rondan zagales ni se cantan jotas como en sus años prósperos. El que ronda de forma habitual por sus calles en ruinas es el silencio que, aunque se rompe de forma esporádica cuando llegan visitas turísticas, podría reinar para siempre si no se protege lo que queda en pie de él. Un 30% de esta localidad fue destruida durante la Guerra Civil Española, si bien, ha sido el paso de los años y el abandono de sus calles lo que ha hecho que Belchite viejo esté al borde de su desaparición.Hoy en día, solo queda un 15% de este pueblo, un porcentaje que cada año va bajando y sus expertos y vecinos pronostican que, si no se actúa, no quede nada del Belchite Viejo en 20 años. Aunque hoy un jurado de Nueva York lo ha posicionado en el mapa mundial, incluyéndolo en la lista de los 25 monumentos en "peligro de extinción" del planeta, los World Monuments Watch 2025. "Cada vez que vengo, cambia Belchite. Hay una grieta más y una piedra más. De ahí que tuve la idea de enviar esta candidatura", explicaba Joan Sastre, el nominador y precursor de esta candidatura, en el programa "La Ventana de Aragón".Un reconocimiento internacional que puede cambiar el rumbo de este enclave, ya que esta organización se encarga de visibilizar el patrimonio que se encuentra en peligro de desaparición en todo el mundo para que reciba el apoyo institucional necesario para su conservación.Fue la famosa jota de Belchite, escrita por Natalio Baquero, lo que encandiló al jurado estadounidense para elegir este monumento, el único español que este año formará parte de esa prestigiosa lista. Su alcalde, Carmelo Pérez, espera recoger sus frutos. Señalaba que "si nos hacen caso, tendremos Belchite para muchos años. Si no se nos escucha, no sabemos si serán 10, 15 0 20 años, pero será difícil mantener este pueblo".Pese a que existe un Plan Director del Gobierno de Aragón desde el año 2005 y que el Ejecutivo aragonés ha realizado pequeñas actuaciones en los edificios más emblemáticos del pueblo -en sus dos iglesias, por ejemplo-, apenas ha habido obras de mantenimiento en las casas de la antigua localidad. El Ayuntamiento de Belchite, que ha invertido más de un millón de euros de fondos propios en estos últimos 8 años, espera desde el año 2022 que el Gobierno de España ejecute una partida plurianual de 7 millones de euros en 4 años para preservar el enclave, que se incluye en sus presupuestos. .c-w{ max-width:444px; width:100%; margin:32px auto; background:#00755E; border-radius:4px; display:flex; align-items:center; justify-content:center; } .c-w a{ display:flex; align-items:center; justify-content:center; padding:4px 24px; } .c-w img{ width:24px; margin-right:12px; } .c-w p{ font:18px/25px Poppins; text-align:center; color:#fff; margin:0; } @media (max-width:444px){ .c-w a{ padding:4px 12px; } .c-w img{ width:24px; margin-right:8px; } .c-w p{ font:14px/25px Poppins; } } @media (max-width:335px){ .c-w p{ font:13px/25px Poppins; } } Únete al canal de WhatsApp de la SER Entre los edificios que todavía no se han caído se pueden ver sus dos iglesias, varios palacios renacentistas, junto a la entrada desde donde comienzan las visitas guiadas, o las dos plazas, epicentro de la vida social en aquel entonces. En una de ellas, se conserva una de las casas más modernas del pueblo, desde donde Franco les hizo una promesa a los vecinos de Belchite, después de que su pueblo quedara devastado. Se comprometió a levantar, sobre esas ruinas, un nuevo pueblo. Que tendrían agua, para que no les faltara pan que llevar a las mesas de sus casas, mientras ya contaba con los planos de un pueblo nuevo.Así, en 1964 dejaría de rondar y cantar jotas el último vecino del pueblo viejo de Belchite. Aunque su silencio, dicen los del nuevo Belchite, todavía tiene muchas historias que contar.AragónZaragozaPatrimonio artísticoPatrimonio culturalPatrimonio históricoHistoriaHistoria arteBelchiteGuerra civilGuerra civil españolaGuerraDespoblaciónEspaña vacíaLo más leídoLo más escuchadoPlayEl Punto Crítico, de Alberto Castrillo-Ferrer: ¡La generación del 25! - Hora 14 Aragón (14/02/2025)14/02/2025PlayHora 14 Fin de Semana: La Portada (15/02/2025)15/02/2025Play¡Pies, para qué os quiero! ( 15/02/2025)15/02/2025PlayVivienda, gasolina y comida: el alto coste para las familias cuyos hijos reciben tratamientos contra el cáncer fuera de su casa - Hora 14 Aragón (15/02/2025)15/02/2025'
