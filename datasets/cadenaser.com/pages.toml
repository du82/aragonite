["https://cadenaser.com/nacional/2025/01/29/espana-pondra-en-orbita-el-satelite-militar-mas-avanzado-de-europa-el-spainsat-ng-i-cadena-ser"]
title = "España pone en órbita el satélite militar más avanzado de Europa, el SpainSat NG I  | Ciencia y tecnología  | Cadena SER"
description = "Este nuevo satélite de nueva generación está preparado para sobrevivir a cualquier ataque nuclear en el espacio. A partir de ahora será el encargado de blindar las comunicaciones de las Fuerzas Armadas y permitirá a España convertirse en el quinto país capaz de suministrar comunicaciones a la OTAN | Cadena SER"
full_description = 'Ciencia y tecnologíaEspaña pone en órbita el satélite militar más avanzado de Europa, el SpainSat NG IEste nuevo satélite de nueva generación está preparado para sobrevivir a cualquier ataque nuclear en el espacio. A partir de ahora será el encargado de blindar las comunicaciones de las Fuerzas Armadas y permitirá a España convertirse en el quinto país capaz de suministrar comunicaciones a la OTAN(C) Airbus Defence and Space SAU 2024FacebookTwitterLinkedInWhatsAppJavier Bañuelos@JaviBanuelosCadena SER29/01/2025 - 11:55 UTCEsta madrugada, a las 2:34 (hora española), desde el complejo de lanzamiento del Kenedy Space Center en Cabo Cañaveral (Florida), un cohete Falcon 9 de SpaceX - del todopoderoso Elon Musk- ha lanzado al espacio al satélite de comunicaciones seguras más potente de Europa, el SpainSat NG I, un satélite español de nueva generación que está considerado como uno los grandes hitos de la investigación espacial española, porque este nuevo satélite militar va a ser el encargado de blindar las comunicaciones de las Fuerzas Armadas – operado por Hisdesat- a través de uno de los sistemas más avanzados que se ha construido nunca en Europa. Es sin duda, uno de los proyectos más importantes del sector espacial español hasta la fecha, que ha invertido cinco años de trabajo y más de 2.000 millones de euros en este moderno satélite militar.El SpainSat NG I busca ya su posición en la órbita ‘GEO’ (geoestacionaria), a 36.000 kms de la Tierra, tiene cinco meses de travesía y se calcula que estará operativo entre julio y agosto de este año, cuando se ubique en su latitud exacta. Junto a su hermano gemelo, el SpainSat NG II – que será lanzado al espacio a finales de año- van a tener la capacidad de cubrir dos tercios del planeta, desde Denver (en la costa oeste de Estados Unidos) hasta Singapur, en el continente asiático. Solo quedará fuera el océano Pacífico. Con unas dimensiones de 6,7 metros de altura y 2,7 metros de ancho y un peso de casi 6 toneladas, tendrá una vida útil de 15 años, aunque sus creadores confían en que dure mucho más, igual que ha ocurrido con los satélites que van a ser sustituidos, el SpainSat y el XTAREUR, lanzados hace casi 20 años, y que apuran sus últimas reservas de combustible para retirarse a una órbita cementerio.🛰️ El satélite SPAINSAT NG I, listo para su lanzamiento.Si todo progresa según el plan previsto, será enviado a órbita desde Cabo Cañaveral #Florida, la madrugada del día 30, hora local de España. ¡Todo un hito para la industria espacial 🇪🇸!Info: https://t.co/2QqO1EQTpC pic.twitter.com/sSlgIHho3f— Ministerio Defensa (@Defensagob) January 28, 2025 Tanto Hisdesat - dueño del SpainSat, como Airbus - su contratista- coinciden en que estamos ante los satélites de comunicaciones militares más potentes de Europa porque “van a multiplicar por más de diez la capacidad que se ofrecía hasta ahora, es decir, más datos en menos tiempo y más seguros”, detalla a la SER el responsable del programa SpainSat NG de Airbus Defense&Space España, Enrique Granell, una mejora crucial para las misiones militares porque “obviamente, las Fuerzas Armadas y los demás usuarios de este de este servicio de comunicaciones se podrán beneficiar de recibir y transmitir más datos en menor tiempo”, añade.Unas antenas activas, únicas en EuropaSu equipo ha diseñado el gran secreto de este satélite, las antenas activas – a través de la banda X- que ofrecen, por un lado “flexibilidad” porque permiten cambiar de forma “dinámica e inmediata” la posición de la cobertura, es decir, "serán capaces de cambiar la ubicación de las coberturas en la Tierra más de 10.000 veces por segundo”, una capacidad que garantizará unas comunicaciones más fiables, más precisas y más seguras, a través de la banda X, transmisión utilizada para las comunicaciones gubernamentales y militares.Esas antenas activas además gozan de una gran “resiliencia” porque también son capaces de geolocalizar cualquier emisor que pudiese tratar de interferir en las comunicaciones, es decir, podrán “identificar en qué punto de la tierra se están produciendo esas interferencias, para evitar esa zona de la tierra y así blindarnos ante esas amenazas que podrían provocar un problema en las comunicaciones”, explica el portavoz de Airbus Defense&Space, contratista del SpainSat NG. .c-w{ max-width:444px; width:100%; margin:32px auto; background:#00755E; border-radius:4px; display:flex; align-items:center; justify-content:center; } .c-w a{ display:flex; align-items:center; justify-content:center; padding:4px 24px; } .c-w img{ width:24px; margin-right:12px; } .c-w p{ font:18px/25px Poppins; text-align:center; color:#fff; margin:0; } @media (max-width:444px){ .c-w a{ padding:4px 12px; } .c-w img{ width:24px; margin-right:8px; } .c-w p{ font:14px/25px Poppins; } } @media (max-width:335px){ .c-w p{ font:13px/25px Poppins; } } Únete al canal de WhatsApp de la SER El SpainSat NG también está preparado para sobrevivir a cualquier ataque nuclear, un blindaje necesario ante la nueva arma rusa antisatélites que ha resucitado el temor a un conflicto nuclear en el espacio “efectivamente tenemos protecciones para ese tipo de amenazas - pulsos electromagnéticos – provocadas por explosiones nucleares en altura que permitirían al satélite sobrevivir a un fenómeno de este tipo”.Esas capacidades última generación van a permitir a España entrar en el selecto grupo que ofrece comunicaciones militares por satélite a la OTAN. Solo cuatro naciones tienen ese certificado: EEUU, Reino Unido, Francia e Italia, un reducido club al que se sumará España.Más del 45% del satélite diseñado en EspañaEn un complejísimo contexto geopolítico, en plena crisis de Ucrania, estos satélites no solo van a proporcionar autonomía estratégica a España, también garantizan la soberanía tecnológica porque más del 45% del satélite ha sido diseñado en España, reduciendo así la dependencia de terceros países. El consorcio liderado por España ha contado con Airbus como empresa tractora, pero también con la implicación de Thales, proyecto que dirige Hisdesat, el cliente final que operará estos dos nuevos satélites.Su desarrollo no ha sido un camino sencillo, primero la pandemia de Covid’19 provocó retrasos en la fabricación y después llegó la invasión rusa de Ucrania que desbarató buena parte de los planes de desarrollo afectando a la cadena de suministros de piezas muy sensibles, entre ellas, el motor iónico del satélite, que iba a ser fabricado por una compañía rusa con base en Kaliningrado y tuvo que ser sustituido por completo por otro de fabricación europea, según ha informado ABC.Espacio exteriorMinisterio de DefensaJavier Bañuelos Redactor Jefe en la Cadena SER responsable de la información sobre Interior y Defensa. Soy diplomado... Leer másLo más leídoLo más escuchadoPlayT12x24 | A quien madruga, RR le abraza15/02/2025Play"El Real Madrid tiene que olvidarse de esta guerra arbitral...": El perjuicio que supone la cruzada blanca contra el arbitraje16/02/2025PlayEl comunicado del Alavés contra el estamento arbitral, la entrevista a Álvaro García y las previas de los partidos ligueros de mañana16/02/2025PlayFlash Deportes | 23:0015/02/2025PlayMillás solo necesita 5 minutos para explicar el fenómeno Montoya y revela qué escena de una película es igual a su reacción16/02/2025'
