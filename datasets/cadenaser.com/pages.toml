["https://cadenaser.com/nacional/2024/11/13/corina-oproae-premio-tusquets-el-comunismo-podria-haber-sido-lo-mas-maravilloso-del-mundo-y-llego-a-ser-lo-peor-cadena-ser"]
title = 'Corina Oproae, premio Tusquets: "El comunismo podría haber sido lo más maravilloso del mundo y llegó a ser lo peor"  | La Hora Extra  | Cadena SER'
description = "La escritora rumana nos presenta &#039;La casa limón&#039;, novela con la que se ha hecho con el premio Tusquets de novela 2024. La historia de una niña en la Rumanía de finales de los 80, a las puertas de la caída del régimen de Ceaușescu | Cadena SER"
full_description = '''La Hora ExtraOcio y culturaCorina Oproae, premio Tusquets: "El comunismo podría haber sido lo más maravilloso del mundo y llegó a ser lo peor"La escritora rumana nos presenta 'La casa limón', novela con la que se ha hecho con el premio Tusquets de novela 2024. La historia de una niña en la Rumanía de finales de los 80, a las puertas de la caída del régimen de CeaușescuPlay/PauseMostrar OpcionesCorina Oproae, premio Tusquets: "El comunismo podría haber sido lo más maravilloso del mundo y llegó a ser lo peor"36:16CerrarDescargarCompartirCerrarCompartirFacebookTwitterLinkedinWhatsappEmbeberEl código iframe se ha copiado en el portapapelesFacebookTwitterLinkedInWhatsAppDaniel de la FuenteCadena SER13/11/2024 - 06:30 UTCCorina Oproae nació en Făgăraș, una ciudad de Transilvania, Rumanía, en 1973. Desde 1998 reside en Barcelona. La poeta y traductora ha obtenido el XX Premio Tusquets Editores de novela 2024 con La casa limón, sobre los años de “descomposición” del régimen de Ceaușescu narrados desde los ojos de una niña. El jurado, presidido por Antonio Orejudo y formado por Bárbara Blasco, Eva Cosculluela, Silvia Hidalgo y Juan Cerezo, en representación de la editorial, ha acordado por unanimidad premiar esta obra, que consideran “extraordinaria y singular en la literatura española, por su escritura precisa y evocadora, cruda y onírica, y por el testimonio de vivencias históricas de la Europa del Este”.Aunque se trata de su primera novela, Oproae tiene publicados tres libros de poesía en castellano y, en catalán, La mà que tremola, en el que reflexiona sobre una lengua que no es la materna. "El premio ha significado una alegría y una sorpresa, porque escribo en una lengua que no me no me viene dada por nacimiento. De hecho, cuando tenía 18 años llegué a la literatura española antes de llegar a la lengua española. Y claro, recibir este reconocimiento para mí significa una aceptación en un sistema literario que no te viene dado por nacimiento", dice la escritora.No recuerdo cuántos años tengo, pero sí que vivo debajo de una gran mesa de madera, en un castillo infinito, cuyos muros están hechos de libros. Acaricio temerosa cada libro que cojo, como para asegurarme de que el castillo no se me derrumba. Huelo los libros uno a uno. Me chifla hacerlo. Así comienza La casa limón, una novela en la que los sentidos están muy presentes, el del olfato en particular.Cubierta de 'La casa limón', de Corina Oproae / TusquetsAmpliarCubierta de 'La casa limón', de Corina Oproae / TusquetsCerrarRecoges una cita de Louise Glück: "Miramos el mundo una sola vez, en la infancia. El resto es memoria". Has dicho que la niña de La casa limón no eres tú, no es tu historia, pero sí está basada en tus recuerdos, vivencias y memoria. ¿Cómo ha sido ese juego entre la ficción y la autoficción y el reconstruir un pasado, el de la infancia, que probablemente recuerdes más a través de la memoria de otros que de la tuya propia?Es y no es una historia autobiográfica. Claro, coinciden ciertas cosas. Creo que, cuando escribimos aquello que nos sucede, nuestra biografía se traslada de alguna forma u otra, en los poemas de manera más destilada. Para mí en este libro hay muchas historias, está construido casi como si fuera un rompecabezas. Muchas de esas historias, en esa coincidencia de edad con la protagonista, me han impactado de tal manera que yo creo que mi cerebro las interpreta como si fueran propias. Son sucesos que me llegan de una forma que me determinan la visión sobre ciertas cosas posteriores en la vida. Aunque no me han pasado a mí, es como si las incorporase. Y todo eso se traslada a la novela, todo ese imaginario que desarrollo en mi literatura, todas las obsesiones en las que intento adentrarme, vienen del mundo de la infancia. La infancia es un territorio muy complicado, creo que para todos. Y todo es un juego entre la ficción y la realidad, porque todo lo que recordamos son memorias de memorias. Como decía Borges, no hay primeras imágenes. En el fondo todo es construido y reconstruido. .c-w{ max-width:444px; width:100%; margin:32px auto; background:#00755E; border-radius:4px; display:flex; align-items:center; justify-content:center; } .c-w a{ display:flex; align-items:center; justify-content:center; padding:4px 24px; } .c-w img{ width:24px; margin-right:12px; } .c-w p{ font:18px/25px Poppins; text-align:center; color:#fff; margin:0; } @media (max-width:444px){ .c-w a{ padding:4px 12px; } .c-w img{ width:24px; margin-right:8px; } .c-w p{ font:14px/25px Poppins; } } @media (max-width:335px){ .c-w p{ font:13px/25px Poppins; } } Únete al canal de WhatsApp de la SER Dice la niña: "leí en un libro que si alguien las cuenta o las escribe, las historias se apaciguan como una tormenta, como un amor loco que se asienta y se vuelve tranquilo y seguro con el paso del tiempo". ¿Cómo te ha ayudado la escritura a apaciguar tormentas, obsesiones o traumas de tu infancia?Cuando uno tiene obsesiones y ciertos traumas es muy difícil. No hay soluciones mágicas. Pero sí que en este libro tuve la necesidad de volver a la infancia, de volver a la adolescencia, a la época de la madurez. Yo no me tuve que exiliar de Rumanía, fue una elección. Yo tenía una beca en la Complutense y la cambié por por la Autónoma en Barcelona, por amor, básicamente. Es un exilio, digamos, voluntario. La vida me llevaba por unos derroteros que me pedían dejar aquello atrás. No tenía necesidad de contar aquello, sino que tenía necesidad de olvidarlo. Yo soy una persona muy alegre en el día a día, aunque no lo dirían los libros ni los poemas que escribo. Y llegó cierto momento en el cual había cosas que me venían constantemente, que me pedían regresar, que me pedían volver la vista atrás y mirar las cosas y analizarlas. Y en ese proceso de escritura y de análisis es cuando se resuelven cosas, cuando miras las cosas y llegas a aceptarlas.La casa limón es la casa que el padre de esta niña había heredado de sus padres. Hasta que un día, "los que en nuestro país se preocupan por la gente nos han cambiado la casa limón por un piso en un bloque de color gris que papá detesta. Un piso que el padre llama una caja de cerillas". ¿Quiénes son esos que en Rumanía se preocupaban por la gente? Ese monstruo enfadado y hambriento que se come la casa a bocados. ¿Por qué derriban la casa limón?Esto sucedió no solamente en Rumanía, sino en todos los países del Este. En Rusia también. Todos esos edificios de estética comunista donde todos los pisos son iguales. A poquito que te alejes del centro de las ciudades los encuentras por todas partes, unos edificios que son realmente feos. En Rumanía hubo esta intención de derribar todo lo que se había construido antes y esta es una de las metáforas que vertebran el libro. Había estas demoliciones masivas, la niña presencia este derribo y es un hecho muy traumático. Se hizo con el objetivo de que todos tuviéramos las mismas condiciones, unas viviendas parecidas y más control. La propiedad privada pasó a ser propiedad del Estado. Te decían que te iban a dar una casa en un edificio maravilloso donde todos estaríamos cumpliendo con el sueño de la nación.¿Cómo es criarse para esta niña o para ti en un estado policial, de completa vigilancia y control, no solo por parte del Estado, sino por parte también de vecinos? Esos policías de balcón, que llamamos aquí durante la pandemia, vecinos que vigilaban que todo ciudadano cumpliera con las normas y, si no lo hacían, lo denunciaban. Eso genera una desconfianza total incluso hacia el más cercano.Claro, era así, aquí también ha habido una dictadura y hay gente que a veces te cuenta que se vivía mejor en esas épocas. Son relatos que no quiero escuchar, porque lo que había era una falta de libertad. Todo este control por parte de la Securitate, que es la policía secreta, los teléfonos podían ser escuchados. Había toda esta hipervigilancia y no se decían ciertas cosas. Por ejemplo, circulaban chistes sobre El Gran Dirigente (Ceaușescu), pero a los niños no se les contaban o no podían estar presentes para que luego no lo dijeran, no sea que alguno de los vecinos sea uno de los delatores del sistema, porque mucha gente implicada en esto. Eso crea recelo, casi miedo a relacionarte con la gente. Pero por otro lado, los niños tenían muchísima más libertad que hoy. Yo recuerdo que tenía una sensación de libertad. En ciertos momentos me podía ir, como la protagonista, a casa de mis abuelos y ahí nadie me vigilaba. Los adultos no vigilaban tanto a los niños, mientras que nosotros ahora, en la sociedad en la que vivimos, creo que los niños no tienen ni un minuto para poder estar solos. Estamos hiper vigilándolos."Cuando tenemos que abandonar nuestra casa limón y trasladarnos a vivir al piso que papá llama la caja de cerillas, es cuando se me ocurre la idea de construirme un castillo". Ese castillo era el lugar predilecto de esta niña, al que deseaba volver en todo momento. Un refugio que contiene el globo terráqueo entero.¿ Sigue siendo la literatura ese castillo para ti?Sí, creo que yo nací con un libro bajo el brazo. Esto sí es autobiográfico. Yo antes de saber leer, tenía obsesión con los libros y eso es real. La mesa del comedor donde me hacía el castillo de libros es una metáfora, pero es totalmente real. En el pasillo de la casa teníamos una biblioteca bastante grande y cada día me ponía los libros en el comedor haciendo como muros. Evidentemente lo que es inventado es el hecho de que nadie me hiciera recogerlos cada noche, mis padres me hacían guardarlos cada día. Mi madre me leía libros en voz alta, poemas en voz alta y me los aprendí de memoria antes de saber leer. Los libros me han acompañado siempre y lo que más me tranquiliza en la vida, cuando estoy nerviosa, es ponerme a arreglar libros. Por lo tanto, la relación con los libros es muy física y además, para la protagonista de la historia, los libros son una ventana al mundo, en un mundo sin libertad, te abren la perspectiva y te abren la imaginación.El proceso de derrumbe de la casa es algo traumático. De hecho, el padre de la niña deja de hablar. Los silencios marcan mucho esta novela, porque también la niña pierde el habla. Respiramos nuestro propio miedo. Una dictadura, traumas, ¿cómo resuena esta historia con la española?Claro, aquí también se ha vivido una dictadura, aunque fuera una dictadura de derechas. Las dictaduras son sistemas aberrantes que tienen en común cosas. Mucha gente que me ha leído me ha dicho que Rumanía es casi un país exótico para ellos, pero que parece que les estoy contando su propia historia. Es lo que dices, están los silencios, es una historia plagada de tabús. Está el tabú de la enfermedad, de la enfermedad mental. De hecho, lo que sucedió aquí en los psiquiátricos, en la época franquista, es un tema que me interesa mucho, que toco muy de pasada en el libro, pero que me gustaría indagar más, porque también en Rumanía sucedieron cosas tremendas. Los psiquiátricos eran centros donde los presos políticos eran torturados, por ejemplo. De estos temas no se hablaba en las familias, porque te podía traer problemas, por eso al padre de la niña le mandan a vivir a la casa de los tíos. Esta densidad y este dolor tan grande, que también sucedía aquí durante el Franquismo, te obliga a no hablar, es casi una reacción natural del ser humano, un mecanismo de supervivencia.Corina Oproae presenta 'La casa limón' en La Hora Extra / Daniel de la FuenteAmpliarCorina Oproae presenta 'La casa limón' en La Hora Extra / Daniel de la FuenteCerrar"Las chicas de mi edad piensan en chicos y en divertirse, pero para mí la muerte se ha convertido en una obsesión", dice la protagonista. "Deseo pertenecer a otra familia, más simple, más llana, más alegre y si acaso con más vida y menos muerte". Las campanas doblan, tañen más veces de las que nos gustaría a lo largo de la novela. ¿Cuál es la relación de esta niña con la muerte, desde tan pequeña? ¿Cómo son esos rituales en torno a la muerte en aquella Rumanía y cómo han cambiado hoy?Claro, la niña empieza a tener conciencia de la muerte de forma muy temprana. Es una de mis obsesiones. Al principio del libro son muertes que se celebran, eso tiene que ver con esa Rumanía ancestral, con esa Transilvania ancestral en la cual la muerte es vista como un desenlace natural. Nosotros ahora, en la sociedad en la que vivimos, donde todos los escaparates nos están llamando a la hiper vida, la muerte no tiene cabida. En la historia, a medida que va creciendo, a la niña también le tocan otras muertes, muertes mucho más cercanas y que determinan también la manera de ver la vida. Por ejemplo, en una conversación con la madre, esta le habla de la muerte y le dice que de la muerte lo que hay que aprender es cómo vivir, no poner el acento en la muerte, sino en la vida.El 1 de octubre de 1966 el dictador rumano promulgaba el Decreto 770. El aborto pasaba a castigarse con duras penas de prisión. El decreto se anunciaba en televisión como una nueva página en la historia de nuestra encomiable lucha contra la decadencia del imperialismo. Con la caída del Muro de Berlín y del régimen, se aprueba el derecho al aborto...Al día siguiente, de hecho....pero los derechos reproductivos de las mujeres no parecen garantizados en ninguna parte del mundo 35 años después. Parece que seguimos instalados en ese mundo bipolar que entonces parecía que llegaba a su fin. Capitalismo y comunismo, occidente y oriente, con la extrema derecha queriendo prohibir el aborto porque las bajas tasas de natalidad en Europa también traen decadencia, dicen, nos van a reemplazar los árabes y el islam. Seguimos instalados en un mundo parecido a aquel, ¿es la pérdida o ausencia de memoria uno de nuestros grandes males y por eso seguimos repitiendo la historia?Claro, parecería natural que con todas las lecciones que nos ha dado la historia, nuestra reacción como seres humanos debería ser intentar a toda costa no repetir los errores del pasado. Pero no está sucediendo. Creo que la literatura y los que escribimos tenemos este deber de recordar las lecciones que da la historia. Evidentemente, hay ciertos progresos que se han hecho en cuanto a la situación que vivieron muchas mujeres en Rumanía. Ese decreto que mencionabas dio lugar a muchísimos niños que se llamaron decretitos y causó un problema social tremendo, porque muchos de esos niños fueron abandonados y creó todo este problema de los orfanatos, que es un tema que también ha tratado mucho el cine rumano y de manera espectacular. Ha habido progresos, pero luego vienen siempre los populismos, la extrema derecha y parece que todo fuera otra vez hacia atrás. Hay que tratar de mantener y afianzar todo lo que hemos conseguido en este mundo en el siglo XXI. Y estas historias pueden poner un pequeño grano de arena en todo este entramado tan complejo, en este mundo tan complejo. El comunismo llegó a ser lo peor, cuando en el fondo era lo más maravilloso o podría haber sido lo más maravilloso del mundo, y esa casa limón es como una metáfora'''
