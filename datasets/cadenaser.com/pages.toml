["https://cadenaser.com/nacional/2024/11/11/manuel-rivas-a-estas-alturas-si-trabajas-con-las-palabras-mirar-hacia-otro-lado-realmente-es-bastante-canalla-cadena-ser"]
title = 'Manuel Rivas:  "A estas alturas, si trabajas con las palabras, mirar hacia otro lado, realmente, es bastante canalla"  | Ocio y cultura  | Cadena SER'
description = "El escritor gallego publica, una década después de su última novela, &#039;Detrás del cielo&#039;, un noir en el que reflexiona sobre la corrupción, la masculinidad y el poder en una Mancondo gallega | Cadena SER"
full_description = '''La Hora ExtraOcio y culturaManuel Rivas: "A estas alturas, si trabajas con las palabras, mirar hacia otro lado, realmente, es bastante canalla"El escritor gallego publica, una década después de su última novela, 'Detrás del cielo', un noir en el que reflexiona sobre la corrupción, la masculinidad y el poder en una Mancondo gallegaManuel Rivas, galician writer in galician language in the Torre de Hrcules lighthouse area. A new Archeological Park has been created with various artists sculptures in the area in which during de Spanish Civil 1936 War democrats were killed / ANNA SERRANOAmpliarCerrarFacebookTwitterLinkedInWhatsAppPepa BlanespepablanesCadena SER11/11/2024 - 07:04 UTCCasi una década después de su última novela, el escritor gallego Manuel Rivas regresa a este género con Detrás del cielo, (Alfaguara) un noir que rompe los cánones del género de la novela negra, pero que utiliza para contarnos a toda una región, Galicia, y a todo un país. Con la máxima de que lo local es universal y que el poder y la corrupción nos afectan en nuestra vida íntima, el escritor se adentra en las dinámicas de un grupo de amigos, poderosos, que salen de caza para acabar con El solitario, un jabalí que amenaza a una comarca inventada en la Galicia rural. "Escribí un libro de poesía que me dio que pensar sobre este mundo. Tengo la idea de que lo que escribo se va ensanchando, es un poco como los anillos de los árboles. Todo lo que escribo repercute en lo siguiente. Es así como siento esta historia", nos cuenta en la SER sobre el origen de su nueva novela.La caza del hombre por el hombre está detrás de este proyecto literario que comienza con este trabajo y que podría acabar en una trilogía que en su base habla del miedo. "El miedo al abandono contemporáneo. Creo que la literatura siempre ha tenido que ver con el miedo. Los cuentos tienen que ver con el miedo y el miedo más humano es el miedo al abandono. Para escribir no se puede ser cobarde", explica Rivas. El miedo mueve a esos personajes. el miedo a no estar en el cotarro, a no tener su parte del pastel, el miedo a perderlo todo, el miedo a ser descubiertos. Un miedo que roza esa impunidad que los hombres con poder y dinero han construido. "También surge el miedo en los personajes más déspotas, en los personajes. Y esto también es en parte la novela, es el miedo a ser descubiertos lo que está latente", matiza el escritor.Un microcosmos de personajes que se adentran en el bosque para cazar a un animal, una obsesión para todos ellos, una especie de Moby Dick en la Galicia actual, en una historia donde la naturaleza es sumamente importante, pues parece la única cosa que puede parar la avaricia atroz de los humanos en este sistema capitalista. "Se ha acelerado la codicia, la dominación", reconoce Rivas. "Parece que la naturaleza quiere parar la historia, porque quiere contener a esa cuadrilla de de cazadores. En una especie de autodefensa, utiliza la niebla, una niebla imprevista", comenta sobre uno de los capítulos de esta novela.El planteamiento del libro, unos hombres yendo de caza en medio de un contexto político y social determinado, nos lleva a pensar en el filme de Carlos Saura, La Caza, que se leyó como una alegoría del régimen franquista. "Los mecanismos del poder son cada vez también más grandes", dice sobre esta comparación. "La depredación es también cada vez más poderosa y vemos como al poder le acompaña la corrupción, y cuanto más déspota es el poder. Lo que se llama dictadura no deja de ser la ocupación de una mafia que tiene el poder político, el poder coactivo, también el poder militar y acaba impregnando a toda la sociedad".La ambición mueve a estos hombres, a comprar y vender tierras, a hacer negocios, a blanquear dinero, a traficar con droga, a quitar de en medio al que moleste y a usar a las mujeres a su antojo. "En esa cuadrilla, además hay una argamasa que tiene que ver con con la posesión del poder y con la pulsión destructiva que es la argamasa del machismo", explica el escritor, que pone en boca de esos tipejos expresiones machistas, un lenguaje soez, que algunos empiezan a reivindicar para atacar al feminismo. "Los gestos son importantes y también la apariencia de los personajes, pero lo que es decisivo es cómo hablan", dice Rivas que ha pergeñado a la perfección ese lenguaje de barra de bar. "Es el lenguaje apodíctico, ese que no quiere escuchar, el lenguaje imperativo, la palabra de orden, del que manda. eso, por desgracia, lo vemos en el tiempo de hoy, que resulta muy atractivo para para mucha gente. La palabra de orden, el dominar el terror semántico. Intimidar a través de la palabra. Eso es, en parte, lo que explica la situación actual de invasión y brutalidad. Tiene que ver con el estupor que nos causa ese tipo de lenguaje, porque cada vez es más descarado". .c-w{ max-width:444px; width:100%; margin:32px auto; background:#00755E; border-radius:4px; display:flex; align-items:center; justify-content:center; } .c-w a{ display:flex; align-items:center; justify-content:center; padding:4px 24px; } .c-w img{ width:24px; margin-right:12px; } .c-w p{ font:18px/25px Poppins; text-align:center; color:#fff; margin:0; } @media (max-width:444px){ .c-w a{ padding:4px 12px; } .c-w img{ width:24px; margin-right:8px; } .c-w p{ font:14px/25px Poppins; } } @media (max-width:335px){ .c-w p{ font:13px/25px Poppins; } } Únete al canal de WhatsApp de la SER Hablaba Karl Popper de la Ley de las especies picantes, donde el disparate de mañana será más grave que el de hoy. Pasa en este grupúsculo que ha inventado Rivas, pero pasa en las tertulias televisivas, en el Congreso de los Diputados, en la Asamblea de Madrid y, por supuesto, en las redes sociales. Un lenguaje que el escritor ha detectado escuchando. "La herramienta más importante a la hora de escribir es la escucha, el momento previo, digamos, a ese momento caligráfico", reconoce. Ese lenguaje que ha trasladado a sus personajes se basa también en el silencio de los demás. "Un silencio fértil, que lleva a la complicidad. Un silencio que es el paso previo a esa violencia. Ocurre con la palabra paz, nadie la nombra, hay silencio en torno a ella. Esa palabra es como una rata escapando en un cementerio", dice sobre el momento actual, con el genocidio en Gaza. Sin embargo, dice que es optimista y que frente a este lenguaje imperativo, hay otro que es capaz de desarmar al poder. "Ese lenguaje que desarma el lenguaje del poder, que lo desarticula y, además, normalmente es una voz baja o a veces muy marginal, que está también en los bares. Por un lado, se escucha el exabrupto de la barra de bar, pero hay también en la esquina gente que se ríe. En esa risa en extinción está también la salvación".La historia la cuenta un narrador que está dentro de ese grupo. Es el conseguidor. El que mira para otro lado, el que se aprovecha, pero nunca forma parte del núcleo irradiador. "Graba con los ojos. Es como una cámara y como una grabadora. Representa y encarna, de alguna forma, una cultura popular. Es un personaje que dentro tiene una pugna muy grande, un conflicto interior entre esa excitación creativa y esa excitación destructiva que también se da en el ámbito público", nos cuenta sobre un personaje con el que se ha adentrado en entender mejor a la condición humana en el mundo de hoy. "Ocurre que es más fácil imaginarse el fin del mundo que cualquier otra cosa. Antes decíamos eso de otro mundo es posible, ahora, más bien tendremos que decir, irónicamente, que otro fin del mundo es posible. Tenemos que afrontar estos problemas, porque si los afrontamos, afrontaremos las soluciones".Como decimos, los arquetipos de un género, utilizado hasta la extenuación y que hoy ha derivado en el true crime televisivo, van difuminándose gracias a un lenguaje preciso y rico, que Rivas utiliza con precisión y maestría y a una trama que mezcla lo real con lo alegórico. "Cuando se habla de novela negra, yo siempre pienso en que las novelas que hemos llamado de guerra, sobre nuestra Guerra Civil, son una especie de género negro español". Así aparece la corrupción urbanística, la corrupción moral, las dinámicas de poder, la obediencia, la conciencia también y, en esa trama del prostíbulo, el maltrato a las mujeres. También el narcotráfico, un tema que el autor ya ha tratado en su obra anteriormente. "Forma parte de ese de esa fórmula que comentábamos de la codicia. El tema del narco tiene que ver mucho con una acumulación inmediata, un enriquecimiento inmediato. Es una buena metáfora del mundo, todo lo que pasa alrededor de la cocaína. Va muy asociada al poder, tanto que incluso el consumidor siente ese vértigo de ser más echado para adelante cuando la consume", explica el autor.Desde siempre, en su obra ha tratado temas como la memoria histórica, la naturaleza, el amor, el respeto, el narco, la corrupción, el poder, la injusticia. Temas que le preocupan como escritor, que aborda desde la ficción y la poesía y que también asume como parte indispensable de su obligación ciudadana. "La palabra compromiso parece que es ya una palabra de museo", dice. "Siempre ha habido la caricatura a los intelectuales que defienden causas. Desde El Caso Dreyfus", reconoce sobre esas voces que, desde la prensa, han cuestionado la capacidad de escritores y cineastas para hablar de asuntos políticos y sociales. "Esos que escriben contra el compromiso de escritores o cineastas o artistas, en realidad, se comprometen con todo lo otro, se comprometen con la injusticia, están del lado de la justicia. A estas alturas, si trabajas con las palabras, si trabajas con los sentimientos, si trabajas con las ideas, con la imaginación, mirar hacia otro lado, no afrontar la realidad, realmente, es bastante canalla".Pepa Blanes Es jefa de Cultura de la Cadena SER. Licenciada en Periodismo por la UCM y Máster en Análisis Sociocultural... Leer másLo más leídoLo más escuchadoPlayT12x24 | A quien madruga, RR le abraza15/02/2025Play"El Real Madrid tiene que olvidarse de es