["https://cadenaser.com/andalucia/2025/02/16/una-mujer-herida-por-arma-blanca-en-jaen-radio-jaen"]
title = "Se investiga un presunto caso de violencia de género en Jaén  | Sociedad  | Cadena SER"
description = "Varias patrullas de policía y sanitarios se han personado en el número 48 de la calle Almendros Aguilar de la capital jiennense en lo que podría ser un presunto caso de violencia de género | Cadena SER"
full_description = 'SociedadSe investiga un presunto caso de violencia de género en JaénVarias patrullas de policía y sanitarios se han personado en el número 48 de la calle Almendros Aguilar de la capital jiennense en lo que podría ser un presunto caso de violencia de géneroUna ambulancia con las puertas traseras abiertas en la calle Almendros Aguilar de Jaén. / Radio JaénAmpliarCerrarFacebookTwitterLinkedInWhatsAppJose Gómez GarridoJoseAutomatasRadio Jaén16/02/2025 - 17:12 UTCJaénSe investiga un presunto caso de violencia de género en Jaén. Varias patrullas de policía y sanitarios se han personado en el número 48 de la calle Almendros Aguilar de la capital jiennense en lo que podría ser un presunto caso de violencia de género. La agresión se ha producido delante de una hija que ha intentado intervenir en la situación. La mujer se encontraba con vida al llegar los sanitarios y las fuerzas policiales al domicilio.Fuentes policiales han confirmado a Radio Jaén Cadena SER que el suceso se ha producido esta misma tarde, alrededor de las 17:30, y que la mujer presentaba un corte en el cuello producido por arma blanca. Los servicios policiales tuvieron que cortar el tráfico rodado en los alrededores del domicilio. La mujer agredida tiene 55 años. Ha sido trasladada a un centro hospitalario y parece que su vida no corre peligro. La hija también ha sufrido heridas en el forcejeo y fue atendida por los sanitarios en el lugar del suceso.Fuentes consultadas por Radio Jaén Cadena SER confirman que se ha producido la detención de un hombre. Otras fuentes confirmaban a esta redacción que se trata del marido de la mujer, algo que también ha confirmado la delegación del Gobierno de España en Andalucía. No constan denuncias previas, órdenes de alejamiento ni registros en el sistema Viogen relacionados con la pareja. .c-w{ max-width:444px; width:100%; margin:32px auto; background:#00755E; border-radius:4px; display:flex; align-items:center; justify-content:center; } .c-w a{ display:flex; align-items:center; justify-content:center; padding:4px 24px; } .c-w img{ width:24px; margin-right:12px; } .c-w p{ font:18px/25px Poppins; text-align:center; color:#fff; margin:0; } @media (max-width:444px){ .c-w a{ padding:4px 12px; } .c-w img{ width:24px; margin-right:8px; } .c-w p{ font:14px/25px Poppins; } } @media (max-width:335px){ .c-w p{ font:13px/25px Poppins; } } Únete al canal de WhatsApp de la SER SociedadAgresiones físicasJaénPolicíaLo más leídoLo más escuchadoPlayT12x24 | A quien madruga, RR le abraza15/02/2025Play"El Real Madrid tiene que olvidarse de esta guerra arbitral...": El perjuicio que supone la cruzada blanca contra el arbitraje16/02/2025PlayEl comunicado del Alavés contra el estamento arbitral, la entrevista a Álvaro García y las previas de los partidos ligueros de mañana16/02/2025PlayFlash Deportes | 23:0015/02/2025PlayMillás solo necesita 5 minutos para explicar el fenómeno Montoya y revela qué escena de una película es igual a su reacción16/02/2025'
