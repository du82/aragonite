["https://cadenaser.com/2022/02/18/las-sombras-de-belchite"]
title = "Las sombras de Belchite  | Historia | Ocio y cultura  | Cadena SER"
description = "Casas fantasmales y callejuelas que aún exhalan viejos lamentos  | Cadena SER"
full_description = 'Hoy por Hoy Madrid NorteHistoria | Ocio y culturaLas sombras de BelchiteCasas fantasmales y callejuelas que aún exhalan viejos lamentos Imagen de Belchite el viejoAmpliarCerrarFacebookTwitterLinkedInWhatsAppNacho López LlandresSER Madrid Norte18/02/2022 - 11:57 UTCAlcobendasEspaña tiene su propio destino que eriza la piel. Se trata de Belchite Viejo, boceto del actual pueblo de Belchite, situado a 50 km de Zaragoza, donde el 24 de agosto de 1937 tuvo lugar la infame Batalla de Belchite. Una contienda cuyo legado en forma de casas fantasmales y callejuelas que aún exhalan viejos lamentos hoy emociona a cualquier viajero.Con nuestro experto en enigmas y misterios, Álvaro Martín, hablamos esta semana de lo que esconde este pueblo considerado maldito para muchos, en el que estudiosos de los paranormal han conseguido captar todo tipo de psicofonías y sucesos.Play/PauseCon Álvaro Martín en nuestro espacio de misterios, hablamos de las sombras de Belchite13:43Mostrar OpcionesCerrarDescargarCompartirCerrarCompartirFacebookTwitterLinkedinWhatsappEmbeberEl código iframe se ha copiado en el portapapelesConcebido como lugar de paso para un Bando Republicano que pretendía apoderarse de Zaragoza, el pueblo de Belchite se convirtió en foco de conflicto tras la aparición de una guarnición de civiles. El enfrentamiento entre ambos bandos se concentró entre el 24 y 25 de agosto de 1937, siendo tomado por las tropas republicanas el 7 de septiembre tras la pérdida de más de 5.000 personas y un bombardeo devastador. Tras sopesar la idea de una reconstrucción, Francisco Franco decidió nombrar la derruida Belchite como “pueblo adoptivo” y símbolo de su triunfo, ordenando la construcción de Belchite Nuevo en mayo de 1940. Más de ochenta años después, Belchite Viejo y Belchite Nuevo aún representan el ying yang ideológico de aquellos tiempos silenciados por el poder.HistoriaMisteriosBelchiteFenómenos paranormalesFantasmasLo más leídoLo más escuchadoPlayT12x24 | A quien madruga, RR le abraza15/02/2025Play"El Real Madrid tiene que olvidarse de esta guerra arbitral...": El perjuicio que supone la cruzada blanca contra el arbitraje16/02/2025PlayEl comunicado del Alavés contra el estamento arbitral, la entrevista a Álvaro García y las previas de los partidos ligueros de mañana16/02/2025PlayFlash Deportes | 23:0015/02/2025PlayMillás solo necesita 5 minutos para explicar el fenómeno Montoya y revela qué escena de una película es igual a su reacción16/02/2025'
