["https://cadenaser.com/nacional/2025/01/30/cientificos-del-csic-logran-reconectar-la-medula-espinal-totalmente-seccionada-de-una-rata-cadena-ser"]
title = "Científicos del CSIC logran reconectar la médula espinal totalmente seccionada de una rata con espuma de grafeno    | Cadena SER  | Cadena SER"
description = "Han utilizado espumas de grafeno 3D y esto es una nueva vía para curar lesiones medulares  | Cadena SER"
full_description = 'Ciencia y tecnologíaCientíficos del CSIC logran reconectar la médula espinal totalmente seccionada de una rata con espuma de grafeno Han utilizado espumas de grafeno 3D y esto es una nueva vía para curar lesiones medulares Médula espinal.(Getty Images)AmpliarCerrarFacebookTwitterLinkedInWhatsAppJavier GregoriJavierGregoriCadena SER30/01/2025 - 11:47 UTCEsta nueva espuma tiene tres dimensiones y ha sido creada con óxido de grafeno reducido. Con este componente, un equipo del Instituto de Ciencia de Materiales del CSIC (el Consejo Superior de Investigaciones Científicas) ha conseguido reconectar la médula espinal de una rata, que estaba totalmente seccionada a nivel de su tórax.Más informaciónUna prueba con "estimulación cerebral del hipotálamo" permite subir escaleras a pacientes con lesiones medularesSergio Peris-Mencheta, tras someterse a un trasplante de médula: "Soy un señor de 150 años que se desplaza como puede"Lesiones medulares, rotura de dedos del pie o contusiones, las lesiones más habituales en veranoEste avance ha sido realizado con fondos europeos y demuestra el enorme potencial que este tiene el grafeno para el tratamiento de las lesiones medulares.Además, abre un nuevo camino de investigación con el objetivo de poder curar a los pacientes parapléjicos, en diferentes estados de la enfermedad. De hecho este proyecto de investigación se ha realizado con la colaboración del Hospital Nacional de Parapléjicos de Toledo.Técnica pioneraLo que ha conseguido este grupo del CSIC es aumentar los enlaces químicos entre láminas de esta espuma, que se llama “scaffold” y que ha sido confeccionada con óxido de grafeno reducido.En concreto, "se le hace un tratamiento térmico, a 220ºC, con lo que conseguimos una mayor estabilidad mecánica", explica Conchi Serrano, la investigadora que ha liderado este avance y que lleva trabajando en este material para aplicaciones de regeneración neural más de una década. .c-w{ max-width:444px; width:100%; margin:32px auto; background:#00755E; border-radius:4px; display:flex; align-items:center; justify-content:center; } .c-w a{ display:flex; align-items:center; justify-content:center; padding:4px 24px; } .c-w img{ width:24px; margin-right:12px; } .c-w p{ font:18px/25px Poppins; text-align:center; color:#fff; margin:0; } @media (max-width:444px){ .c-w a{ padding:4px 12px; } .c-w img{ width:24px; margin-right:8px; } .c-w p{ font:14px/25px Poppins; } } @media (max-width:335px){ .c-w p{ font:13px/25px Poppins; } } Únete al canal de WhatsApp de la SER De este modo, cuando se coloca el “scaffold” en la médula espinal aparecen gran cantidad de vasos sanguíneos, que son fundamentales para nutrir el nuevo tejido, y neuritas, es decir, los filamentos que unen unas neuronas con otras.Además, se observa cómo las neuronas que han sobrevivido en la zona alrededor de la lesión proyectan sus prolongaciones a través del “scaffold” y lo invaden en toda su extensión en 3 dimensiones. Todo esto, por otra parte, mejora con el tiempo: los resultados son incipientes tras 10 días de implante, pero son mucho más prometedores a los 4 meses.Una persona con lesión medular podrá caminar con un exoesqueleto que se controla con la mente"Nuestros scaffolds de óxido de grafeno reducido favorecen el crecimiento de vasos sanguíneos más abundantes y más grandes, y neuritas más abundantes, más largas y, además, distribuidas de manera más homogénea en el espacio de la lesión", destaca esta investigadora del CSIC.El cerebro respondeLa gran noticia es que los registros electrofisiológicos que se han realizado a esta rata parapléjica han demostrado la respuesta de su cerebro cuando se estimula la médula por debajo de la zona dañada.“Registramos respuesta en el cerebro, por lo que confirmamos no sólo que hay tejido neural atravesando el scaffold, sino que vuelve a reconectarse con el cerebro".De hecho, esta respuesta cerebral se aprecia en la formación reticular, una zona de gran relevancia funcional para la función motora.Proyecto europeoEste trabajo forma parte del proyecto “Piezo4Spine”, financiado por la Unión Europea, que busca curar las lesiones medulares gracias a la nanotecnología.Con este objetivo se están desarrollando también nanomedicinas, que en la siguiente fase de estos trabajos serán incorporadas al scaffold para promover aún más estos hallazgos regenerativos tan prometedores.Cuando se produce una lesión en la médula espinal, normalmente esta no se rompe por completo, sino que las lesiones suelen afectar solo a una parte concreta, en uno o varios niveles de la extensión de la médula.Aun así, esta investigación ha demostrado que este material puede potenciar la reconexión del tejido neural incluso cuando la lesión es completa.Así lo explica Conchi Serrano, investigadora del ICMM-CSIC y una de las autoras principales del trabajo: "nuestro equipo había demostrado ya que estas espumas generan un ambiente prorreparativo en la médula espinal de rata, pero queríamos hacerlo también ampliando el tamaño de lesión y cambiando el nivel espinal, y hemos conseguido replicar los resultados".CSICParapléjicosCienciaGrafenoInvestigación científicaJavier Gregori Periodista especializado en ciencia y medio ambiente. Desde 1989 trabaja en los Servicios Informativos... Leer másLo más leídoLo más escuchadoPlayT12x24 | A quien madruga, RR le abraza15/02/2025Play"El Real Madrid tiene que olvidarse de esta guerra arbitral...": El perjuicio que supone la cruzada blanca contra el arbitraje16/02/2025PlayEl comunicado del Alavés contra el estamento arbitral, la entrevista a Álvaro García y las previas de los partidos ligueros de mañana16/02/2025PlayFlash Deportes | 23:0015/02/2025PlayMillás solo necesita 5 minutos para explicar el fenómeno Montoya y revela qué escena de una película es igual a su reacción16/02/2025'
