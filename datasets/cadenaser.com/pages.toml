["https://cadenaser.com/nacional/2025/02/12/zelenski-sanciona-al-expresidente-poroshenko-lider-de-la-oposicion-al-que-derroto-en-las-elecciones-de-2019-cadena-ser"]
title = "Zelenski sanciona al expresidente Poroshenko, líder de la oposición al que derrotó en las elecciones de 2019  | Internacional  | Cadena SER"
description = "No se han dado a conocer los detalles de las sanciones ni los motivos, si bien el nombre del expresidente ha aparecido vinculado a diversos casos de corrupción | Cadena SER"
full_description = 'InternacionalZelenski sanciona al expresidente Poroshenko, líder de la oposición al que derrotó en las elecciones de 2019No se han dado a conocer los detalles de las sanciones ni los motivos, si bien el nombre del expresidente ha aparecido vinculado a diversos casos de corrupciónUn momento del vídeo publicado por Petró Poroshenko en su cuenta de FacebookAmpliarCerrarFacebookTwitterLinkedInWhatsAppAntonio MartínantmartinbCadena SER12/02/2025 - 21:29 UTCPetró Poroshenko desapareció de las noticias internacionales casi por completo después de su derrota electoral ante un entonces desconocido cómico llamado Volodímir Zelenski, que le sucedió en la presidencia del país después de las elecciones de 2019. Este jueves, en la misma tarde en la que se ha confirmado que Donald Trump y Vladimir Putin han hablado sobre el futuro de Ucrania, se ha conocido también que Zelenski ha decidido imponer sanciones contra el que ha sido su principal rival político.El líder del partido opositor Solidaridad Europea ha confirmado en un vídeo publicado en Facebook que ha sido sancionado, si bien no ha dado más detalles al respecto. Poroshenko habla de una decisión "inconstitucional" con motivaciones políticas y se define a sí mismo como el líder de la oposición ucraniana en un contexto en el que el país, sometido a la ley marcial por la invasión rusa, está pendiente de la convocatoria de nuevas elecciones. De hecho, Poroshenko confirmó el pasado año, momento en que deberían haberse celebrado los comicios, que no descartaba presentarse de nuevo. Zelenski busca a alguien a culpar de sus errores— Petró Poroshenko, expresidente de UcraniaPoroshenko carga con dureza contra Zelenski, de quien dice que "en lugar de prepararse para unas negociaciones importantísimas con Trump y para encontrarse con líderes mundiales en la Conferencia de Múnich, se ha pasado el día tratando de sancionarme". El expresidente ucraniano acusa a su sucesor de ser responsable de "ignorar los problemas del ejército, de ignorar la información de la Inteligencia aliada sobre la inminente invasión, de no prepararse para la guerra ni preparar a la ciudadanía". Los miles de millones que se ganaron vendiendo los intereses ucranianos y la seguridad ucraniana deben ser bloqueados y deben servir para proteger a Ucrania— Volodímir ZelenskiLas sanciones las ha impuesto el Consejo Nacional de Defensa y Desarrollo de Ucrania y Zelenski ha confirmado esta tarde la publicación de un decreto oficial de especial relevancia este viernes, aunque no ha citado a Poroshenko durante su mensaje diario. Sí que ha explicado que se ha reunido con este Consejo y que "cualquier persona que destruya la seguridad nacional de Ucrania y ayude a Rusia debe ser responsable de sus actos". .c-w{ max-width:444px; width:100%; margin:32px auto; background:#00755E; border-radius:4px; display:flex; align-items:center; justify-content:center; } .c-w a{ display:flex; align-items:center; justify-content:center; padding:4px 24px; } .c-w img{ width:24px; margin-right:12px; } .c-w p{ font:18px/25px Poppins; text-align:center; color:#fff; margin:0; } @media (max-width:444px){ .c-w a{ padding:4px 12px; } .c-w img{ width:24px; margin-right:8px; } .c-w p{ font:14px/25px Poppins; } } @media (max-width:335px){ .c-w p{ font:13px/25px Poppins; } } Únete al canal de WhatsApp de la SER Años bajo sospechaPoroshenko se hizo mundialmente conocido después de acceder a la presidencia en las elecciones posteriores a la llamada Revolución del Maidán de 2014 y de la huida del país del dirigente prorruso Viktor Yanukovich. Sin embargo, con el paso de los años su figura ha perdido prestigio por distintas investigaciones que le relacionan con casos de corrupción.Desde el supuesto desvío de dinero del erario público para sus vacaciones personales hasta la aparición de su nombre en los Papeles de Panamá, su imagen pública fue cayendo sin parar durante su mandato hasta terminar siendo derrotado de una manera abrumadora por Zelenski, que por 2019 era un cómico conocido por sus imitaciones en la televisión ucraniana.En 2021, las autoridades confirmaron que le consideraban sospechoso del delito de alta traición por la supuesta venta ilegal de carbón procedente de las regiones ocupadas por los rusos en el Donbás. Las distintas investigaciones contra él se encontraban suspendidas por la invasión rusa. UcraniaVolodimir ZelenskiPetro PoroshenkoAntonio Martín Redactor de la sección de Internacional. Se incorporó a la Cadena SER en 2005 y desde entonces ha formado... Leer másLo más leídoLo más escuchadoPlayT12x24 | A quien madruga, RR le abraza15/02/2025Play"El Real Madrid tiene que olvidarse de esta guerra arbitral...": El perjuicio que supone la cruzada blanca contra el arbitraje16/02/2025PlayEl comunicado del Alavés contra el estamento arbitral, la entrevista a Álvaro García y las previas de los partidos ligueros de mañana16/02/2025PlayFlash Deportes | 23:0015/02/2025PlayMillás solo necesita 5 minutos para explicar el fenómeno Montoya y revela qué escena de una película es igual a su reacción16/02/2025'
