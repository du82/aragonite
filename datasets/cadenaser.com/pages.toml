title = "El patronato del CNIO destituye por unanimidad a la directora del centro, María Blasco  | Ciencia y tecnología  | Cadena SER"
description = "El Patronato, en su resolución a la que ha tenido acceso la SER , habla “un clima de trabajo incompatible con un centro como este”  | Cadena SER"
full_description = 'Ciencia y tecnologíaEl patronato del CNIO destituye por unanimidad a la directora del centro, María BlascoEl Patronato, en su resolución a la que ha tenido acceso la SER , habla “un clima de trabajo incompatible con un centro como este” La directora científica del Centro Nacional de Investigaciones Oncológicas (CNIO), María Blasco, durante su comparecencia ante los medios en la que ha anunciado este martes que denunciará ante la Fiscalía la actual bicefalia del Centro. / J.P.Gandul (EFE)AmpliarCerrarFacebookTwitterLinkedInWhatsAppJavier Ruiz MartínezjruizmzCadena SER29/01/2025 - 12:26 UTCMañana muy fría a las puertas del ministerio de ciencia. Ya temprano, hemos visto llegar a algunos de los patronos, con sus ideas muy claras. Dicen que “la crisis institucional del CNIO afecta a todos los investigadores del cáncer en España, no solo a los de ese centro”. “Porque el ruido afecta a las donaciones y hay que seguir investigando contra el cáncer”. Y con las ideas tan claras el resultado de la votación ha sido unanimidad. Todos los patronos han votado a favor de que María Blasco y el gerente del centro Juan Arroyo sean destituidos de forma inmediata. Los patronos han evaluado los datos económicos y la deuda de 4 millones y medio del centro. Se ha evaluado la petición de dimisión de Blasco de la mitad de los jefes científicos del centro. Y, por supuesto, la situaciones de acoso que han denunciado públicamente algunos trabajadores.El Patronato, en su resolución a la que ha tenido acceso la SER , habla “un clima de trabajo incompatible con un centro como este”. Se nombra a Fernando Peláez como director científico interino y se inicia un concurso público internacional para una nueva dirección científica.Decisión tomadaLa decisión estaba tomada porque eran mayoría los patronos que, según ha podido confirmar la SER, pensaban que Blasco debía irse por su mala gestión y por el escenario de desencuentros y autoritarismo que han vivido la mayoría de los investigadores y trabajadores del centro. Una nueva carta de 23 jefes científicos del centro había descrito como mala la gestión de Blasco por lastrar al centro y, en ella, reclamaban su dimisión. .c-w{ max-width:444px; width:100%; margin:32px auto; background:#00755E; border-radius:4px; display:flex; align-items:center; justify-content:center; } .c-w a{ display:flex; align-items:center; justify-content:center; padding:4px 24px; } .c-w img{ width:24px; margin-right:12px; } .c-w p{ font:18px/25px Poppins; text-align:center; color:#fff; margin:0; } @media (max-width:444px){ .c-w a{ padding:4px 12px; } .c-w img{ width:24px; margin-right:8px; } .c-w p{ font:14px/25px Poppins; } } @media (max-width:335px){ .c-w p{ font:13px/25px Poppins; } } Únete al canal de WhatsApp de la SER Según ha podido saber la SER, cuatro comunidades autónomas presentes en el patronato -Murcia, Extremadura, Castilla y León y Baleares- también eran de esta opinión, ante "el deterioro de la imagen y la mala gestión del CNIO". Los castellano-leoneses lo han dicho públicamente y el resto, en privado, entre quejas de falta de transparencia contra el Ministerio de Ciencia y el Patronato.También eran de la misma opinión la mayoría del resto de patronos entre los que se encuentran varias fundaciones científicas y asociaciones contra el cáncer. La decisión de este miércoles ha llegado en una delicada situación económica para el CNIO, con 4,5 millones de euros de deuda, y con numerosos trabajadores pidiendo su cese por "mala gestión, autoritarismo y escenarios de acoso laboral".Más informaciónLa directora científica del CNIO, María Blasco, denuncia ante la Fiscalía presuntas irregularidades del gerente del centroEl patronato del CNIO exige a Blasco y su gerente dos informes "por separado" sobre las cuentas del centro y paraliza CNIO-arteFuentes del Gobierno habían confirmado ya a la SER que la investigadora alicantina iba a ser apartada de su cargo porque "la crisis reputacional era ya demasiado grande" y los patronos estaban reclamando "que era necesario un relevo".A Blasco, que seguía insistiendo en que "solo es la directora científica" y que "el responsable es el gerente", al que ha denunciado ante la fiscalía, se le reprocha una mala gestión económica que ha generado esos 4,5 millones de euros de deuda en los últimos años y que viene lastrando el centro, provocado falta de medios materiales muy importantes.Lo que desencadenó todo este caso fue la denuncia pública de la inoperancia -por fallos y no reposición- de tres de los cuatro microscopios confocales que tiene el centro y que son claves para estudiar el cáncer. "Nadie duda del prestigio de la científica alicantina", señalaban diversas fuentes, pero la situación ha llegado a tal punto que "es necesario un cambio de dirección que devuelva el CNIO a sus mejores años".Los 23 jefes de equipo de la organización que han pedido su cese por carta al patronato en dos ocasiones también están en estas tesis mientras insisten en que los desencuentros con Blasco y la falta de diálogo de la todavía directora son constantes.Javier Ruiz Martínez Redactor de temas de sociedad, ciencia e innovación en la SER. Trabajo en el mejor trabajo del mundo:... Leer másLo más leídoLo más escuchadoPlayT12x24 | A quien madruga, RR le abraza15/02/2025Play"El Real Madrid tiene que olvidarse de esta guerra arbitral...": El perjuicio que supone la cruzada blanca contra el arbitraje16/02/2025PlayEl comunicado del Alavés contra el estamento arbitral, la entrevista a Álvaro García y las previas de los partidos ligueros de mañana16/02/2025PlayFlash Deportes | 23:0015/02/2025PlayMillás solo necesita 5 minutos para explicar el fenómeno Montoya y revela qué escena de una película es igual a su reacción16/02/2025'
