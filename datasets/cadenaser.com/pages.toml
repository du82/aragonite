["https://cadenaser.com/2022/01/31/hora-25-50-anos-haciendo-familia-cada-noche-con-los-oyentes"]
title = "Hora 25: 50 años haciendo familia cada noche con los oyentes  | Hora 25  | Cadena SER"
description = "Miguel Ángel Aguilar, María Esperanza Sánchez y Aimar Bretos comparten sus recuerdos sobre Hora 25 con varios oyentes | Cadena SER"
full_description = '''Hora 25SociedadHora 25: 50 años haciendo familia cada noche con los oyentesMiguel Ángel Aguilar, María Esperanza Sánchez y Aimar Bretos comparten sus recuerdos sobre Hora 25 con varios oyentesPlay/PauseMostrar OpcionesEdición especial por el 50 aniversario de 'Hora 25' (parte II)24:07CerrarDescargarCompartirCerrarCompartirFacebookTwitterLinkedinWhatsappEmbeberEl código iframe se ha copiado en el portapapelesFacebookTwitterLinkedInWhatsAppMarisol RojasMrojas_Cadena SER31/01/2022 - 22:23 UTCMadridAimar Bretos ya ha celebrado el 50 aniversario de Hora 25. Este fin de semana, quedó con voces históricas de la tertulia y con un grupo de oyentes que se han enganchado al programa en diferentes momentos de su vida. No podían faltar Miguel Ángel Aguilar, un hombre que en sí mismo se ha convertido en hilo conductor del programa. Ha compartido su ironía, su memoria, su sentido del humor y su colmillo con Carlos Llamas, Ángels Barceló y Pepa Bueno. Recuerda perfectamente cómo fue la recuperación de la tertulia: "Parece que fue ayer. Era periodismo químicamente puro: el comentario muy pegado a la noticia". Le escucha atentamente María Esperanza Sánchez, analista de Hora 25 que todavía tiene presente con qué ánimo iba al programa: "Había gente tan buena, tan absolutamente respetable, que sabía tanto, tanto... Cuando yo llegaba a mi casa pensaba: "¿Por qué voy a seguir mañana?" Pero la verdad es que lo pasaba muy bien y era gente tan maravillosa que era un placer poder estar con ellos".Siguen atentos sus reflexiones Antonio Ferrero, María del Carmen Díaz, Rosa Ballestero, Javier Muñío y Fabio Segovia. Todos son oyentes del programa. Cualquier adjetivo se quedaría corto para definirlos. Todos forman parte de esa audiencia a la que se dirigía María Esperanza Sánchez con un consejo de Iñaki Gabilondo grabado a fuego: "No creáis que sois los más listos. Entre todos los que nos están escuchando, cada uno sabe mucho de una cosa y entre todos infinitamente más que vosotros". Nunca se olvidó de esas palabras: "Entendí que para salir, hay que prepararse, para no decir algo que no sea conveniente o que no sea cierto", concluye Sánchez. Antonio Ferrero. Una radio pegada a un pastor R: "Las voces de Hora 25 son como esa familia que tienes en Argentina. No los has visto nunca, pero sabes que están allí. Yo trabajo hasta 16 horas diarias en el monte, en las sierras... ¿Con quién hablas? ¿A quién escuchas? Es algo más serio de lo que vosotros os pensáis. Estoy temblando, me siento como un niño con zapatos nuevos, por poder escuchar a Miguel Ángel o a María Esperanza"María del Carmen Díaz. Desde los 15 años, escuchando Hora 25 R: "La cercanía que supone teneros en el oído, con los auriculares. Ese sentimiento para mí es muy bonito. Lo poco o mucho que sé de muchas cosas es gracias a la radio. Vosotros me habéis dado eso. Para mí, Hora 25 es el final del día visto con tranquilidad. No dais gritos, no confrontáis chillando, los contertulios exponen sus ideas y cada oyente se queda con lo que quiere".R: "Hora 25 ha cambiado a mejor, como la sociedad. Cuando escucho a María Esperanza me emociono, porque fue una de las primeras contertulias en la radio. Su presencia supuso dar voz a las mujeres y ella era una forma diferente de informar". Rosa Ballestero. Una oyente muy fielR: "Para mí Hora 25 ha supuesto un antes y un después, una forma distinta de ver las cosas. Carlos Llamas, para mí era la ironía, la forma de informar. Lo era todo. Todos los 4 de octubre me acuerdo que es el día que murió Carlos Llamas. Sentí que se había ido algo mío" Javier Muñío. Tercera generación de oyentes de Hora 25 R: "Desde que era pequeñito, siempre lo he escuchado. De niño, era la manera de irme a dormir. A base de oírlo y oírlo, lo acabé escuchando. Ahora lo escucho todas las noches y es mi manera preferida de informarme".R: "Un buen amigo escuchaba los podcast de la competencia y yo le daba los argumentos que había escuchado la noche anterior en Hora 25, porque me parecían muy buenos. Un día, le dije: "Si tanto te gusta, ponte el podcast de Hora 25". Desde entonces lo escucha y comentamos juntos la tertulia".Fabio Segovia. Llegó por casualidad a Hora 25 y se quedóR: "Llegué a España hace 20 años y la radio me acompaña cuando trabajo en el autobús. La Ser está llena de monstruos, en el buen sentido. Y tú, Aimar, eres ahora uno de ellos. Me gustan los periodistas que insisten para conseguir la información. Me acuerdo que llegué a Hora 25, ya en la época de Ángels. Recuerdo el programa que hizo en El Cairo y ahí creo que empecé a ser fanático de Hora 25"Hora 25Cadena SERMiguel Ángel AguilarOyentesMarisol Rojas Trabaja en la Cadena Ser desde 2007. Empezó madrugando en Hoy por Hoy y ahora trasnocha en Hora 25.... Leer másLo más leídoLo más escuchadoPlayLoreto Ochando habla sin tapujos de la gestión de Mazón: "La alarma a las ocho y once minutos, cuando los cadáveres flotaban por las calles"15/02/2025PlayEsther Palomera tira de ironía para analizar el caso del fiscal general del Estado: “Se le ha imputado por desvelar un secreto que conocía medio Madrid”14/02/2025PlayRufián confiesa qué es lo que más le gusta de Pedro Sánchez: "Lo valoro mucho"15/02/2025PlayHora 14 Fin de Semana (15/02/2025)15/02/2025PlayAna Belén revela su desternillante método para calentar la voz: se lo enseñaron ‘Los Javis’ y desde entonces siempre recurre a él14/02/2025'''
