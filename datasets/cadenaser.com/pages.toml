["https://cadenaser.com/nacional/2025/02/01/la-batalla-por-la-vivienda-desde-una-inmobiliaria-cadena-ser"]
title = "La batalla por la vivienda desde una inmobiliaria  | Economía y negocios  | Cadena SER"
description = "La brecha entre la oferta y la demanda de la vivienda en alquiler crece a tal ritmo que en este momento dos de cada 10 alquileres no pasan ni 24 horas anunciados. En Crónica 24/7 le seguimos la pista a un piso en alquiler. ¿Cuánto tarda en encontrar interesados? ¿Qué se pide? ¿Quién gana esta carrera contrarreloj? | Cadena SER"
full_description = 'Economía y negociosLa batalla por la vivienda desde una inmobiliariaLa brecha entre la oferta y la demanda de la vivienda en alquiler crece a tal ritmo que en este momento dos de cada 10 alquileres no pasan ni 24 horas anunciados. En Crónica 24/7 le seguimos la pista a un piso en alquiler. ¿Cuánto tarda en encontrar interesados? ¿Qué se pide? ¿Quién gana esta carrera contrarreloj?Play/PauseMostrar OpcionesLa batalla por la vivienda desde una inmobiliaria28:25CerrarDescargarCompartirCerrarCompartirFacebookTwitterLinkedinWhatsappEmbeberEl código iframe se ha copiado en el portapapelesFacebookTwitterLinkedInWhatsAppPilar Díaz de Aguilarpilaar_daCadena SER01/02/2025 - 09:03 UTCMadridMuchos españoles quieren un piso y muy pocos pueden permitírselo porque el parque inmobiliario escasea en nuestro país: en los últimos años, de media, se ha construido media vivienda por cada nuevo hogar. El resultado son precios cada vez más altos, sobre todo en las zonas céntricas, y una competición cada más complicada por conseguirlos. Para comprobarlo, María Ibáñez ha entrado en la carrera por alquilar un piso para comprobar qué sucede en los minutos y horas posteriores a que un piso se publique en Madrid, una de las ciudades más perjudicadas.En la inmobiliaria Capitalis Servicios Inmobiliarios van a publicar un piso a las 16:00, en cinco minutos, en su portal, Idealista y Fotocasa. "La vivienda que vamos a publicar es de 98m2. Es de tres habitaciones, dos baños, está en buen estado y el precio es de 1.200 euros. Se incluyen la calefacción y el agua", detalla Martín Calvet, Director de la inmobiliaria. Llega la hora programada y ya está colgado. No ha pasado ni un minuto, suena el teléfono y, mientras atienden al primer cliente, llaman otras seis personas. “A una he podido atenderla, pero a cinco no porque estaba en conversación”, explica David, socio de Calvet.A los cinco minutos, a las 16:05, el balance es de 20 contactos en total y dos llamadas atendidas. David cuenta que le "han llegado a ofrecer pagarle para quedarse con un inmueble": "Mira, esto no funciona así, es ilegal que cobremos al inquilino, al menos nosotros no lo hacemos. Quien nos paga es el propietario". De hecho, en una de las llamadas, un interesado agradece a David que le avise de que está prohibido por ley que las inmobiliarias cobren a los inquilinos. Según el chico al teléfono, "en todas las agencias le han exigido un pago". Tres horas después de haber publicado el anuncio, hay 20 visitas agendadas para el próximo día, y quedan 71 emails y 25 llamadas por devolver.En este episodio de Crónica 24/7 analizamos el problema de la vivienda desde dentro, desde una inmobiliaria, para ver cómo de difícil es encontrar un espacio digno en el que vivir en España.Play/PauseMostrar OpcionesReportaje EP162 | Carrera contrarreloj: el minuto a minuto de cómo se alquila un piso10:15CerrarDescargarCompartirCerrarCompartirFacebookTwitterLinkedinWhatsappEmbeberEl código iframe se ha copiado en el portapapelesEl chat que te hace los deberes“Redáctame un texto sobre la transición española que parezca escrito por un niño de 14 años. Es para una trabajo del colegio”. Con esta sencilla frase, cualquier persona, de cualquier edad, puede acceder a una redacción sobre el tema en cuestión gracias a las aplicaciones de ChatGPT. De hecho, según un estudio reciente, el 65% de los estudiantes en España admite utilizar la Inteligencia Artificial para hacer trabajos y deberes. Una ventaja para la comunidad educativa, o un riesgo. Según cómo se integre la Inteligencia Artificial en la rutina de las aulas. .c-w{ max-width:444px; width:100%; margin:32px auto; background:#00755E; border-radius:4px; display:flex; align-items:center; justify-content:center; } .c-w a{ display:flex; align-items:center; justify-content:center; padding:4px 24px; } .c-w img{ width:24px; margin-right:12px; } .c-w p{ font:18px/25px Poppins; text-align:center; color:#fff; margin:0; } @media (max-width:444px){ .c-w a{ padding:4px 12px; } .c-w img{ width:24px; margin-right:8px; } .c-w p{ font:14px/25px Poppins; } } @media (max-width:335px){ .c-w p{ font:13px/25px Poppins; } } Únete al canal de WhatsApp de la SER La clave de todo esto está en integrar las aplicaciones que ha permitido desarrollar la inteligencia artificial en el entorno escolar y universitario, en lugar de buscar un muro de contención (que sería como poner puertas al campo). "Los alumnos tienen que saber discriminar lo que es válido de lo que no lo es. Los profesores tenemos formación para detectar si la información que nos ha proporcionado la inteligencia artificial es correcta o no, y ellos deben aprender los riesgos que supone fiarse al cien por cien, por eso tenemos que enseñarles a trabajar correctamente con este sistema", cuenta Carlos, profesor de bachillerato en el colegio San Viator de Madrid.Rodrigo Taramona, experto en inteligencia artificial, explica la gran oportunidad que tiene la comunidad educativa y, en general, el mundo entero. "Es el miedo a lo desconocido y concretamente a la tecnología, lo que puede llevar a creer que estas herramientas son enemigos. Creo que si somos conscientes de que tenemos un ultra educador que nos puede ayudar en las aulas a completar ese campo de desconocimiento que tienen tanto alumnos como profesores -porque nadie sabe todo en esta vida- tenemos una oportunidad fantástica que aprovechar". En este nuevo episodio de Crónica 24/7, Almudena Lopesino explica las ventajas e inconvenientes de que la Inteligencia Artificial se convierta en un aliado para los alumnos.Play/PauseMostrar OpcionesReportaje EP162 | El chat que te hace los deberes05:49CerrarDescargarCompartirCerrarCompartirFacebookTwitterLinkedinWhatsappEmbeberEl código iframe se ha copiado en el portapapelesCinco minutos para no olvidarEste lunes, medio centenar de supervivientes han vuelto a Auschwitz en los actos de conmemoración de los 80 años de su liberación. Allí han estado más de cincuenta países y organizaciones internacionales. También han acudido los reyes de España, los monarcas de Reino Unido, Bélgica, Países Bajos, Dinamarca y Suecia, así como los presidentes de Italia, Sergio Mattarella; Francia, Emmanuel Macron; Alemania, Frank-Walter Steinmeier, y Austria, Alexander Van der Bellen.Con este motivo, uno de los pocos supervivientes contemporáneos que queda del holocausto ha recibido a la Cadena SER, y otros medios internacionales, para contar su historia. "En mi cabeza hay muchas pesadillas. No hay día que no piense en mis padres y parientes asesinados. Todo lo que tengo que hacer es lavarme la cara y entonces lo veo, el número en el brazo", cuenta. Lleva tatuado en el brazo el número 116927 y en marzo cumple 100 años. "Debemos asegurarnos de que algo así no vuelva a suceder. Tenéis que sentaros a la mesa y resolver vuestras diferencias", afirma en un mensaje dirigido a los jóvenes.-FOTODELDÍA- AUSCHWITZ-BIRKENAU (POLONIA), 27/01/2025.- Los Reyes de España participan en el acto de conmemoración del 80 aniversario de la liberación del campo de exterminio nazi de Auschwitz al que asisten cerca de 60 jefes de Estado, de Gobierno, ministros y diplomáticos, este lunes en Auschwitz-Birkenau (Polonia). EFE/Juanjo Martín / JUANJO MARTINAmpliar-FOTODELDÍA- AUSCHWITZ-BIRKENAU (POLONIA), 27/01/2025.- Los Reyes de España participan en el acto de conmemoración del 80 aniversario de la liberación del campo de exterminio nazi de Auschwitz al que asisten cerca de 60 jefes de Estado, de Gobierno, ministros y diplomáticos, este lunes en Auschwitz-Birkenau (Polonia). EFE/Juanjo Martín / JUANJO MARTINCerrarCuando se cumplen ocho décadas, escuchamos - en este episodio de Crónica 24/7 y de la mano de la corresponsal en Berlín, Carmen Viñas - su voz y los horrores que vivió para evitar que se repitan. Play/PauseReportaje EP162 | Cinco minutos para no olvidar05:27Mostrar OpcionesCerrarDescargarCompartirCerrarCompartirFacebookTwitterLinkedinWhatsappEmbeberEl código iframe se ha copiado en el portapapelesViviendaPisos estudiantesVentasAnuncios publicitariosNazismoAniversariosAuschwitzSupervivientesChatGPTPilar Díaz de Aguilar Graduada en Derecho y Periodismo por la Universidad CEU San Pablo. Máster en la Escuela de El País.... Leer másLo más leídoLo más escuchadoPlayT12x24 | A quien madruga, RR le abraza15/02/2025Play"El Real Madrid tiene que olvidarse de esta guerra arbitral...": El perjuicio que supone la cruzada blanca contra el arbitraje16/02/2025PlayEl comunicado del Alavés contra el estamento arbitral, la entrevista a Álvaro García y las previas de los partidos ligueros de mañana16/02/2025PlayFlash Deportes | 23:0015/02/2025PlayMillás solo necesita 5 minutos para explicar el fenómeno Montoya y revela qué escena de una película es igual a su reacción16/02/2025'
