title = 'El juez invita a Aldama a entregar la "documentación sensible" que le pidió el PSOE  | Política  | Cadena SER'
description = "Santiago Pedraz dicta una providencia, después de que los socialistas reclamaran al presunto cabecilla de la causa de hidrocarburos que entregara un la documentación que le dio su mano derecha cuando fue puesto en libertad | Cadena SER"
full_description = 'PolíticaEl juez invita a Aldama a entregar la "documentación sensible" que le pidió el PSOESantiago Pedraz dicta una providencia, después de que los socialistas reclamaran al presunto cabecilla de la causa de hidrocarburos que entregara un la documentación que le dio su mano derecha cuando fue puesto en libertadEl abogado y empresario Víctor de Aldama a su llegada este jueves al Parlamento de Canarias / Miguel Barreto (EFE)AmpliarCerrarFacebookTwitterLinkedInWhatsAppPedro JiménezpedrojimenezgCadena SER07/02/2025 - 17:46 UTCEl juez de la Audiencia Nacional, Santiago Pedraz, ha dictado una providencia en la que responde al escrito del PSOE en el que reclama a Víctor de Aldama que entregue un sobre con "documentación sensible" que el pasado 30 de noviembre le entregó su mano derecha, Luis Escolano, en Calatayud. Más informaciónVíctor de Aldama insiste ante el juez en el pago de comisiones y aporta pantallazos de conversaciones con Koldo GarcíaLa Guardia Civil atribuye al empresario Víctor de Aldama un papel capital en la organización criminal dedicada al fraude del IVA de hidrocarburosInformación sensible sobre la trama de hidrocarburos que podría incluso afectar al Presidente del Gobierno y que recibió después de que consiguiera la libertad provisional a petición de la Fiscalía. La acusación popular pidió al comisionista, que está en libertad por su compromiso a colaborar en las investigaciones abiertas por el caso de hidrocarburos y el caso Ábalos, que predicara con el ejemplo. El escrito señalaba que "es, por tanto, momento para activar esta oferta de colaboración" a la que los socialistas no dan credibilidad. Por eso han instado a que presente esa documentación y ahora Pedraz dicta un escrito en el que le dice que "si lo estima oportuno, aporte lo requerido".Víctor de AldamaSantiago PedrazPedro Jiménez Redactor Jefe en la Cadena SER. Antes he pasado por los equipos de Hora 14, Radio Madrid, Fin de Semana,... Leer másLo más leídoLo más escuchadoPlayT12x24 | A quien madruga, RR le abraza15/02/2025Play"El Real Madrid tiene que olvidarse de esta guerra arbitral...": El perjuicio que supone la cruzada blanca contra el arbitraje16/02/2025PlayEl comunicado del Alavés contra el estamento arbitral, la entrevista a Álvaro García y las previas de los partidos ligueros de mañana16/02/2025PlayFlash Deportes | 23:0015/02/2025PlayMillás solo necesita 5 minutos para explicar el fenómeno Montoya y revela qué escena de una película es igual a su reacción16/02/2025'
