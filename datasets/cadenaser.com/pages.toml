title = "Jóvenes sacados de Silicon Valley, exempleados de X y con apodos sexuales: así son los trabajadores 'DOGE' de Elon Musk en el Gobierno de EEUU  | Cadena SER  | Cadena SER"
description = "El departamento del magnate busca depurar las agencias federales mediante despidos masivos para, supuestamente, reducir la corrupción en Estados Unidos | Cadena SER"
full_description = '''Hora 25InternacionalJóvenes sacados de Silicon Valley, exempleados de X y con apodos sexuales: así son los trabajadores 'DOGE' de Elon Musk en el Gobierno de EEUUEl departamento del magnate busca depurar las agencias federales mediante despidos masivos para, supuestamente, reducir la corrupción en Estados UnidosPlay/PauseMostrar OpcionesJóvenes sacados de Silicon Valley, exempleados de X y con apodos sexuales: así son los empleados 'DOGE' de Elon Musk03:56CerrarDescargarCompartirCerrarCompartirFacebookTwitterLinkedinWhatsappEmbeberEl código iframe se ha copiado en el portapapelesFacebookTwitterLinkedInWhatsAppSara CanalsCadena SER12/02/2025 - 22:15 UTCWashingtonEste martes, el despacho oval de la Casa Blanca acogía una imagen histórica: el presidente de Estados Unidos, Donald Trump, firmaba un decreto para otorgar más poder al magnate Elon Musk y su Departamento de Eficiencia Gubernamental (DOGE) para depurar las agencias federales del país y, según dice la administración entrante, reducir la corrupción despidiendo a funcionariado americano. En la simbólica sala le acompaña el propio Musk, vestido con la gorra de MAGA (Make America great again) y con su hijo, llamado X (como su red social), subido a hombros mientras atendía a la prensa.Más información"Trump está haciendo posible el sueño más húmedo de Putin": el análisis de una experta sobre las negociaciones de paz en UcraniaTrump y Putin acuerdan comenzar "inmediatamente" la negociación para el fin de la guerra en Ucrania tras una conversación telefónicaPues bien, el personal que el dueño de empresas como Tesla está enviando a las agencias federales para revisar el trabajo y plantear despidos masivos son, por regla general, jóvenes veinteañeros que acuden vestidos con ropa informal y sin autorización legal para realizar esas inspecciones de trabajo.El perfil más destacado entre estos DOGE de Musk es el de un joven ingeniero de Silicon Valley, que ya han trabajado en sus empresas (como Tesla, X o SpaceX) y cuyo cargo es muy dudoso. Es decir, les distribuyen a las agencias federales bajo títulos como "asesor" o "empleado especial del Gobierno" (puesto que posee Musk y que te limita a trabajar para el gobierno un máximo de 130 días anuales) y logran acceder a información muy sensible sobre pagos y empleados.Uno de estos DOGE, que pertenecen al departamento dirigido por el magnate, dimitió hace solo unos días después de que el Wall Street Journal destapase algunos comentarios racistas suyos publicados en redes. Se llama Marko Elez, tiene 25 años y trabajó para Musk en X y SpaceX (antes Twitter). El vicepresidente americano, JD Vance, salió en su defensa asegurando que la "estúpida actividad en redes sociales" no debería "arruinar la vida de un niño". Esto convenció al presidente Trump y en una rueda de prensa aseguró que no conocía el asunto, pero que Elon le traerá de vuelta porque "errar es humano, pero perdonar es divino"."Big balls" como asesor principal del Departamento de EstadoOtro de estos empleados es un adolescente de 19 años, que acaparó el foco mediático por su apodo, Big Balls (huevos grandes), y que trabajó para la empresa Neuralink (también de Musk) y a quien ha puesto frente al Departamento de Estado como "asesor principal". .c-w{ max-width:444px; width:100%; margin:32px auto; background:#00755E; border-radius:4px; display:flex; align-items:center; justify-content:center; } .c-w a{ display:flex; align-items:center; justify-content:center; padding:4px 24px; } .c-w img{ width:24px; margin-right:12px; } .c-w p{ font:18px/25px Poppins; text-align:center; color:#fff; margin:0; } @media (max-width:444px){ .c-w a{ padding:4px 12px; } .c-w img{ width:24px; margin-right:8px; } .c-w p{ font:14px/25px Poppins; } } @media (max-width:335px){ .c-w p{ font:13px/25px Poppins; } } Únete al canal de WhatsApp de la SER En declaraciones a medios este martes, Musk aseguraba que todo lo que hace su departamento lo comparte a través de internet, pero lo cierto es que DOGE tiene una mínima presencia online: solo tiene una cuenta de X donde comparte alguno de sus recortes y una web con información muy genérica sobre la administración (desde el organigrama al número de agencias y empleados) donde llama la atención una pestaña titulada "ahorros". Esto es, en la teoría, lo que Musk ahorra al Estado, y donde no hay ni un dato, solo una frase acompañada de un corazón. "El ticket llegará pronto, a más tardar el día de San Valentín", reza el apartado. San Valentín que se celebrará este mismo viernes.Donald TrumpElon MuskEstados UnidosSara Canals Corresponsal en Washington. Periodista especializada en Relaciones Internacionales por la New York University... Leer másLo más leídoLo más escuchadoPlayLoreto Ochando habla sin tapujos de la gestión de Mazón: "La alarma a las ocho y once minutos, cuando los cadáveres flotaban por las calles"15/02/2025PlayEsther Palomera tira de ironía para analizar el caso del fiscal general del Estado: “Se le ha imputado por desvelar un secreto que conocía medio Madrid”14/02/2025PlayRufián confiesa qué es lo que más le gusta de Pedro Sánchez: "Lo valoro mucho"15/02/2025PlayHora 14 Fin de Semana (15/02/2025)15/02/2025PlayAna Belén revela su desternillante método para calentar la voz: se lo enseñaron ‘Los Javis’ y desde entonces siempre recurre a él14/02/2025'''
