["https://cadenaser.com/castillalamancha/2025/02/11/puede-revertirse-la-despoblacion-este-proyecto-ya-lo-esta-logrando-ser-cuenca"]
title = "¿Puede revertirse la despoblación? Este proyecto ya lo está logrando  | Sociedad  | Cadena SER"
description = "Proyecto Arraigo trabaja en varias provincias españolas para conectar a familias que quieren asentarse en el medio rural  | Cadena SER"
full_description = 'Hoy por Hoy CuencaSociedad¿Puede revertirse la despoblación? Este proyecto ya lo está lograndoProyecto Arraigo trabaja en varias provincias españolas para conectar a familias que quieren asentarse en el medio rural Play/PauseMostrar Opciones¿Puede revertirse la despoblación? Este proyecto lo está logrando en varias provincias19:28CerrarDescargarCompartirCerrarCompartirFacebookTwitterLinkedinWhatsappEmbeberEl código iframe se ha copiado en el portapapelesFacebookTwitterLinkedInWhatsAppPaco AuñónpacoaunonmuelasSER Cuenca11/02/2025 - 13:43 UTCCuencaEn el espacio Mirando por Cuenca que emitimos en Hoy por Hoy Cuenca hemos conocido el trabajo que realiza Proyecto Arraigo para asentar población en las localidades más pequeñas de la provincia de Cuenca. Este proyecto, que opera en diversos territorios de España, lleva años desarrollándose en la provincia gracias a la colaboración con la Diputación de Cuenca.El gerente de Proyecto Arraigo en el ámbito nacional, Javier Sánchez explicó que se trata de una empresa de innovación social “que facilita la conexión entre familias interesadas en mudarse al medio rural y pueblos que buscan repoblarse. Para que el proceso funcione, ambas partes deben estar interesadas”."El perfil de familias que buscan no está vinculado exclusivamente a una necesidad laboral o de dependencia, sino a un interés genuino por la calidad de vida en el ámbito rural, la educación de sus hijos y la riqueza del tejido social de los pueblos”, detalla Sánchez.Proyecto Arraigo estima implantar unas 40 familias en la provincia de Cuenca a lo largo de este año 2025. / Diputación de CuencaAmpliarProyecto Arraigo estima implantar unas 40 familias en la provincia de Cuenca a lo largo de este año 2025. / Diputación de CuencaCerrarArraigo contra la despoblaciónEl proyecto opera en numerosas provincias de Aragón, Castilla y León y Castilla-La Mancha, y en la Comunidad Foral de Navarra, trabajando con diputaciones como las de Cuenca, Palencia, Burgos y León. También colaboran con ayuntamientos que, de forma individual o agrupada, desean impulsar iniciativas de repoblación.Javier Sánchez, gerente de Proyecto Arraigo. / Cadena SERAmpliarJavier Sánchez, gerente de Proyecto Arraigo. / Cadena SERCerrarProceso de selección y adaptaciónEl primer paso para los interesados es inscribirse a través de la web de Proyecto Arraigo. “A partir de ahí, un equipo de más de 40 técnicos de territorio contacta con las familias para conocer sus motivaciones y expectativas”, explica el gerente. “A estas familias se les informa sobre la necesidad de asumir una residencia efectiva en el pueblo, empadronarse, inscribirse en los servicios sanitarios y educativos, y comprometerse con la comunidad”. .c-w{ max-width:444px; width:100%; margin:32px auto; background:#00755E; border-radius:4px; display:flex; align-items:center; justify-content:center; } .c-w a{ display:flex; align-items:center; justify-content:center; padding:4px 24px; } .c-w img{ width:24px; margin-right:12px; } .c-w p{ font:18px/25px Poppins; text-align:center; color:#fff; margin:0; } @media (max-width:444px){ .c-w a{ padding:4px 12px; } .c-w img{ width:24px; margin-right:8px; } .c-w p{ font:14px/25px Poppins; } } @media (max-width:335px){ .c-w p{ font:13px/25px Poppins; } } Únete al canal de WhatsApp de la SER ¿Cómo es el proceso?El proceso de selección es mutuo: no solo la familia elige el pueblo, sino que también el ayuntamiento y la comunidad local deben aceptar y dar la bienvenida a los nuevos habitantes.Más informaciónLos últimos habitantes de los pueblos más pequeños de la provincia de CuencaLa despoblación ya dejó pueblos abandonados en Cuenca en los siglos XVI y XVIICausas y posibles soluciones a la despoblación en la provincia de Cuenca“El ayuntamiento es el principal aliado de Proyecto Arraigo, colaborando en la acogida e integración de las familias”, dice Sánchez. “En algunos casos, una familia puede visitar varios pueblos antes de decidir en cuál establecerse, asegurando que encajan bien en el entorno y pueden contribuir a la comunidad”.Los técnicos de territorio desempeñan un papel clave, ya que conocen a fondo las características y necesidades de cada pueblo. Evalúan aspectos como la situación de las escuelas, negocios cerrados que podrían reactivarse o la demanda de empleo en determinadas áreas. A través de este análisis, buscan conectar familias con pueblos que puedan beneficiarse mutuamente.Gabriela Díaz es técnica de Proyecto Arraigo en Huete y Saelices, en Cuenca. / Cadena SERAmpliarGabriela Díaz es técnica de Proyecto Arraigo en Huete y Saelices, en Cuenca. / Cadena SERCerrarExperiencias en Huete y SaelicesGabriela Díaz es técnica de Proyecto Arraigo en Huete y Saelices, municipios que han participado en las tres ediciones del programa en Cuenca, mostrando un fuerte interés en atraer nuevos pobladores.“En el caso de Saelices, en la primera edición se asentó una de las primeras familias que llegó a Cuenca a través de Proyecto Arraigo”, nos cuenta. “Esta familia llegó con un contrato de trabajo y continúa viviendo en el pueblo. En la segunda edición, se logró atraer a un emprendedor, Alberto, quien abrió la panadería ‘La Tahona de Saelices’, aunque su proceso de asentamiento tomó más tiempo”.Por su parte, en Huete, “tres familias participaron en la primera edición, aunque solo una de ellas se estableció durante seis meses”, explica Díaz. “En la edición más reciente, dos familias han conseguido asentarse en la localidad. El éxito del arraigo depende de múltiples factores, como la disponibilidad de empleo, la integración en la comunidad y la existencia de redes de apoyo”.Desafíos del arraigo ruralUno de los principales desafíos que enfrentan las familias que se mudan a pueblos pequeños es la falta de apoyo social. “Mientras que las familias con hijos tienen más posibilidades de integrarse a través del sistema educativo y las relaciones entre los niños, las personas que se trasladan solas pueden encontrar mayores dificultades para establecer lazos con la comunidad”, explica el gerente de Proyecto Arraigo.El empleo es otro factor determinante. “Aunque muchos nuevos pobladores llegan con oportunidades laborales previas o como emprendedores, la falta de trabajo estable en el medio rural sigue siendo un obstáculo para el arraigo definitivo”.Reunión de los técnicos de Proyecto Arraigo en Cuenca. / Cadena SERAmpliarReunión de los técnicos de Proyecto Arraigo en Cuenca. / Cadena SERCerrarArraigo en la ManchuelaPalmira Escobar es técnica de repoblación del Proyecto Arraigo en localidades como Chumillas, Almodóvar del Pinar, Olmedilla de Alarcón y Piqueras del Castillo. Explica que “cada territorio tiene sus particularidades, pero en esta zona los pueblos cuentan con un censo muy bajo, como el caso de uno con solo 36 habitantes”. Su labor consiste en “conocer bien a los vecinos para identificar oportunidades de empleo y vivienda”, siendo esta última una de las principales dificultades en estos municipios y en el ámbito rural en general.A pesar de su baja densidad de población, estas localidades están bien conectadas, a unos 30-40 minutos de Cuenca y cerca de núcleos más grandes como Motilla del Palancar, con servicios esenciales a pocos kilómetros. Escobar destaca “su entorno natural, con llanuras y serranía, además de la cercanía al embalse de Alarcón, lo que las hace atractivas para el turismo y posibles emprendimientos”.En los últimos años, algunas familias se han asentado en estos pueblos, especialmente en el sector de la hostelería. Sin embargo, “el proceso es lento, ya que es fundamental que los nuevos habitantes encajen bien con la comunidad y la oferta disponible”, matiza Escobar.Palmira Escobar es técnica de repoblación del Proyecto Arraigo en localidades como Chumillas, Almodóvar del Pinar, Olmedilla de Alarcón y Piqueras del Castillo., en Cuenca / Cadena SERAmpliarPalmira Escobar es técnica de repoblación del Proyecto Arraigo en localidades como Chumillas, Almodóvar del Pinar, Olmedilla de Alarcón y Piqueras del Castillo., en Cuenca / Cadena SERCerrarProyecto Arraigo internacionalProyecto Arraigo está ampliando su estrategia con un enfoque internacional para atraer familias de Hispanoamérica, especialmente de Cuba, a pueblos de Cuenca. “Este programa busca cubrir vacantes laborales que no encuentran perfiles nacionales adecuados, facilitando el asentamiento de nuevos pobladores en el medio rural”, explica el gerente. “Además, trabajan con empresas de la provincia para conectar trabajadores con oportunidades locales. Un técnico internacional en Cuenca filtrará y preparará a las familias antes de su llegada, asegurando su integración.El objetivo final es, como enfatiza Sánchez, “conseguir asentamientos sostenibles y duraderos, beneficiando tanto a las familias como a los pueblos que las acogen”.A pesar de estos desafíos, Proyecto Arraigo sigue trabajando en facilitar la integración de nuevos pobladores, reforzando la conexión entre las necesidades de los municipios y las expectativas de quienes desean cambiar su estilo de vida.CuencaDespoblaciónDiputación Provincial CuencaPaco Auñón Director y presentador del programa Hoy por Hoy Cuenca. Periodista y locutor conquense que ha desarrollado... Leer másLo más leídoLo más escuchadoPlayT12x24 | A quien madruga, RR le abraza15/02/2025Play"El Real Madrid tiene que olvidarse de esta guerra arbitral...": El perjuicio que supone la cruzada blanca contra el arbitraje16/02/2025PlayEl comunicado del Alavés contra el estamento arbitral, la entrevista a Álvaro García y las previas de los partidos ligueros de mañana16/02/2025PlayFlash Deportes | 23:0015/02/2025PlayMillás solo necesita 5 minutos para explicar el fenómeno Montoya y revela qué escena de una película es igual a su reacción16/02/2025'
