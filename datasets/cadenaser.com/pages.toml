title = "Cadena SER: Noticias de Hora 25"
description = "Últimas noticias sobre deportes, política, economía, cultura y sociedad. Escucha los programas y emisoras de la Cadena SER a la carta, la radio online y los podcast."
full_description = '''Hora 25Con Aimar BretosLunes a Viernes 20:00 a 23:30FacebookInstagramTwitterPortadaSeccionesPodcastBuscarHora 25 DeportesLo que hay que saber sobre deporte cada día. Estarás informado y escucharás la mejor música. Con Jesús Gallego y la redacción de deportes de la SER. En directo en Hora 25 de lunes a viernes a las 20:30 y a cualquier hora si te suscribes.Último episodioPlayAncelotti se cansa del 'caso Vinicius' | 14/02/2025 26:24Hora 25 de los NegociosTodo lo que hay que saber de economía y finanzas y nunca supiste resolver. Gracias al podcast de Javier Ruiz no te engañarán más. Informativo de actualidad que aborda lo más destacado del día. En directo en Hora 25 de lunes a viernes a las 21:00 y a cualquier hora si te suscribes.Último episodioPlayLa luz vuelve a empujar los precios | 14/02/2025 04:52La contraLa reflexión del periodista y escritor Manuel Jabois. Una mirada singular y una perspectiva distinta que, sin embargo, apela a todo.ActualidadLos asuntos más relevantes de la vida social, política, económica y cultural tienen su espacio en el programa.Último episodioPlayEsther Palomera habla sobre las amenazas de Miguel Ángel Rodríguez | 18/03/2024 04:16La entrevistaLa entrevista que te importa y remata el día. Aimar Bretos frente a quienes te importa escuchar, escritores, políticos, personas que son noticia, pero también quienes deberían serlo.Último episodioPlayLa encuesta del CIS sobre Pedro Sánchez: "Me han preguntado si debería irse o seguir" | 26/04/2024 02:40Hora Veintipico en Hora 25Héctor de Miguel se cuela en Hora 25 para contar sus cosas.Último episodioPlayOtra movida con un software | 11/02/2025 02:02El análisis de Xavier Vidal-FolchEl periodista Xavier Vidal-Folch sondea la realidad para ofrecernos su particular mirada del mundo. Todos los días a las 20:23 de la tarde.Último episodioPlayEl análisis de Xavier Vidal-Folch | Ursula, a la defensiva | 14/02/2025 02:04Las entrevistas de Aimar¿Qué pasó con algunos de los políticos más mediáticos de este país? ¿Qué fue de aquel mítico presentador? ¿Quieres aprenderlo todo sobre inteligencia artificial o energía nuclear? Aimar Bretos charla en profundidad con personajes relevantes de la sociedad española, con protagonistas, expertos y recogiendo los testimonios más sobrecogedores. Cada noche proponemos una conversación reposada, alejada del ruido del día, para escuchar la historia detrás de cada invitado.Último episodioPlayLas entrevistas de Aimar | Ana Belén | 13/02/2025 27:50Mirada 25Las historias, investigaciones y trabajos periodísticos más cuidados, elaborados por el equipo de Hora 25 de la Cadena SER. El mejor periodismo en audio: el rigor en la información, el poder de la narración y la atracción de la edición sonora.Último episodioPlay"Si el que toma la decisión supiera lo que sufre la gente..." cuenta atrás para el cierre de la planta navarra de BSH | 03/02/2025 18:17El día en dos minutosLas noticias más importantes del día resumidas en dos minutos.Último episodioPlayEl día en dos minutos (14/02/2025) | 14/02/2025 03:49Gastro 25Un repaso a la actualidad gastronómica con Carlos G. Cano: entrevistas, productos de temporada, tendencias...Último episodioPlayGastro 25 | Entrevista a Luis Suárez de Lezo | 15/05/2024 32:17Pero qué broma es estaMiguel Ángel Aguilar aporta su particular visión sobre los grandes asuntos de la actualidad.La cena de los idiotésAimar Bretos invita a cenar cada semana a cuatro amigos. Algunos se conocen entre ellos y otros no. Cada uno plantea un dilema -ético, moral o político- en el que todos tienen que mojarse... asumiendo los riesgos de salir salpicados.Último episodioPlayLoreto Ochando habla sin tapujos de la gestión de Mazón: "La alarma a las ocho y once minutos, cuando los cadáveres flotaban por las calles" | 15/02/2025 04:56Punto y 25Soledad Gallego-Díaz y Joaquín Estefanía ponen el punto y 25 del programa con su análisis de la actualidad. Todos los días a las 23:25.Último episodioPlayEuropa Encadenada | 13/02/2025 01:52Hora 25 de 22 a 23.30hReflexión y crítica de los acontecimientos más importantes del día. Profundizamos con Enric Juliana, Lucía Méndez, Pablo Simón, Manuel Jabois, Cristina Monge, Elisa de la Nuez o Xavier Vidal Folch. Reportajes y entrevistas a políticos, expertos y personajes de la actualidad. En directo en Hora 25 a las 22:00.Último episodioPlayMaría Jesús Montero mantiene su intención de que el salario mínimo interprofesional tenga que tributar el IRPF | 14/02/2025 01:20:29AnteriorSiguiente'''
