["https://cadenaser.com/nacional/2025/02/13/el-atropello-en-munich-ensombrece-el-debate-de-television-con-preguntas-a-los-candidatos-alemanes-a-una-semana-de-las-elecciones-cadena-ser"]
title = "El atropello en Múnich ensombrece el debate de televisión con preguntas a los candidatos alemanes a una semana de las elecciones  | Internacional  | Cadena SER"
description = "En el evento han participado los cuatro principales líderes involucrados en las elecciones alemanas del próximo 23 de febrero | Cadena SER"
full_description = '''InternacionalEl atropello en Múnich ensombrece el debate de televisión con preguntas a los candidatos alemanes a una semana de las eleccionesEn el evento han participado los cuatro principales líderes involucrados en las elecciones alemanas del próximo 23 de febreroFriedrich Merz, candidato a canciller y presidente de la Unión Demócrata Cristiana de Alemania (CDU), habla durante el programa 'Klartext' de la cadena ZDF / MICHAEL KAPPELER / POOL (EFE)AmpliarCerrarFacebookTwitterLinkedInWhatsAppRedacciónCadena SER13/02/2025 - 22:16 UTCEl atropellamiento deliberado que ha dejado al menos 30 heridos en la ciudad de Múnich (sur) ha ensombrecido este jueves el debate en un programa televisado de preguntas a los cuatro principales candidatos a las elecciones de Alemania del 23 de febrero, que ha girado en torno a la migración y a la seguridad, aunque también se han tocado temas como la economía, la guerra de Ucrania o la lucha contra el cambio climático.Más informaciónZelenski advierte a Trump: "No aceptaremos cualquier negociación bilateral sobre Ucrania sin nosotros"Trump asegura que funcionarios estadounidenses y rusos se reunirán este viernes en Múnich (Alemania), con Ucrania invitadaEl canciller y candidato socialdemócrata a la reelección, Olaf Scholz, ha afirmado ante las preguntas de algunos de los 120 invitados a la emisión de la cadena pública ZDF que el autor del atentado "será condenado y será deportado antes de que termine de cumplir la condena". Ha subrayado además la necesidad de realizar "más deportaciones" y ha señalado que bajo su Gobierno han aumentado en un 70 % pero "no es suficiente", a la par que ha defendido proyectos de su Ejecutivo, que quedarán inacabados, para aumentar las competencias de la Policía.El ministro de Economía y candidato verde, Robert Habeck, no ha aludido directamente a la migración, pero ha enfatizado la necesidad de una "gran ofensiva de seguridad" para implementar las 350.000 órdenes de detención abiertas que, según ha dicho, existen en Alemania y para acelerar los procedimientos judiciales.La candidata ultraderechista Alice Weidel ha apuntado por su parte falsamente que el detenido por el atropello de Múnich hubiera tenido que ser expulsado de vuelta a Afganistán y que vivía de las ayudas sociales, cuando las autoridades han informado de que contaba con un permiso de residencia y trabajaba. "Con la AfD (Alternativa para Alemania) no hubiera estado aquí", ha asegurado. No obstante, ha afirmado que su partido propugna una "cultura de la bienvenida" para los extranjeros "cualificados y que pagan impuestos", al ser interpelada por una solicitante de asilo rechazada que trabajaba en una residencia de ancianos.Un salto al agua fría por UcraniaEntre los temas abordados en los 140 minutos de programa se contaron la deuda pública, los precios de la energía, los temores de desindustrialización, la lucha contra el cambio climático o la situación después de que la administración del presidente estadounidense, Donald Trump, indicara su disposición a negociar con Moscú el fin de la guerra en Ucrania. .c-w{ max-width:444px; width:100%; margin:32px auto; background:#00755E; border-radius:4px; display:flex; align-items:center; justify-content:center; } .c-w a{ display:flex; align-items:center; justify-content:center; padding:4px 24px; } .c-w img{ width:24px; margin-right:12px; } .c-w p{ font:18px/25px Poppins; text-align:center; color:#fff; margin:0; } @media (max-width:444px){ .c-w a{ padding:4px 12px; } .c-w img{ width:24px; margin-right:8px; } .c-w p{ font:14px/25px Poppins; } } @media (max-width:335px){ .c-w p{ font:13px/25px Poppins; } } Únete al canal de WhatsApp de la SER Tanto Scholz como el favorito de las encuestas, el democristiano Merz, han asegurado que la noticia no les ha pillado por sorpresa y recalcaron la importancia de una respuesta europea unitaria. "Habrá que dar un salto al agua fría que será doloroso", ha señalado Merz, que ha advertido de que el presidente Vladímir Putin sueña con una "Gran Rusia" y si se le apacigua atacará a continuación a los países bálticos."Con Crimea hace diez años nos equivocamos. Si en diez años miramos atrás y vemos que otra vez nos equivocamos, el precio será toda vía más grande", ha afirmado el líder de la Unión Democristiana (CDU), respondiendo a los temores de una mujer preocupada por una posible entrada de Alemania en la guerra.Encontronazo por el cordón sanitarioAl llegar al programa, Merz ha dicho a la cara a Weidel que su bloque conservador no pactará con la AfD, segunda en las encuestas, tal y como ha reiterado en otras ocasiones, mientras ella aseguraba, esforzándose por sonreír, que su formación estaría encantada de coaligarse con los conservadores. "Solo hemos tomado una decisión: con Ustedes, no", ha afirmado Merz en relación a las posibles alianzas postelectorales y ha instado a observar lo que ocurre con otros partidos que intentan cooperar con la ultraderecha a nivel europeo, por ejemplo en Austria."¿Queremos cooperar con un partido que es abiertamente de extrema derecha, que es abiertamente xenófobo?", ha preguntado el líder conservador, que ha aludido también a las posturas expresadas poco antes por Weidel sobre la necesidad de reformar la UE y devolver competencias a los estados miembros.Merz ha advertido de que AfD ha duplicado sus votos en los últimos tres años, según los sondeos, pero ha manifestado la expectativa de que los partidos de centro logren llegar a un compromiso, en particular a lo tocante a sus propias propuestas migratorias, para frenar así el auge ultra. De acuerdo con dos sondeos difundidos este jueves y elaborados por Infratest dimap y por Allensbach, el bloque conservador de Merz está ampliando su ventaja sobre sus rivales y ha subido hasta el 32% en intención de voto.La ultraderecha le sigue con un 20-21%, mientras que los socialdemócratas de Scholz se sitúan en el 15% según una de las encuestas y empatados en el 14 % con los Verdes según la otra, con La Izquierda, entretanto, en el 6% y los liberales en el umbral de quedarse fuera del Parlamento.MúnichAlemaniaEleccionesLo más leídoLo más escuchadoPlayT12x24 | A quien madruga, RR le abraza15/02/2025Play"El Real Madrid tiene que olvidarse de esta guerra arbitral...": El perjuicio que supone la cruzada blanca contra el arbitraje16/02/2025PlayEl comunicado del Alavés contra el estamento arbitral, la entrevista a Álvaro García y las previas de los partidos ligueros de mañana16/02/2025PlayFlash Deportes | 23:0015/02/2025PlayMillás solo necesita 5 minutos para explicar el fenómeno Montoya y revela qué escena de una película es igual a su reacción16/02/2025'''
