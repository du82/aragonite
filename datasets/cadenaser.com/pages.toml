ght: 100%; left: 0; overflow: hidden; position: absolute; top: 0; width: 100%; z-index: 1; } .t-c-h25 .parallax { position: fixed; top: 0; -webkit-transform: translate3d(0, 0, 0); transform: translate3d(0, 0, 0); -webkit-transform-style: preserve-3d; transform-style: preserve-3d; width: 100%; background-position: center; background-repeat: no-repeat; background-size: cover; } .t-c-h25 .parallax-audio{ position: sticky; padding: 16px; top: 66px; z-index: 4; display: flex; align-items: center; justify-content: flex-end; } .t-c-h25 .txt-audio{ width: 220px; background: rgba(0, 0, 0, 0.5); display: flex; justify-content: center; align-items: center; z-index: 2; font: 600 14px/18px Poppins, sans-serif; color: #FFFFFF; padding: 10px; position: absolute; top: 50px; right: 92px; } .t-c-h25 .txt-audio span{ margin-left: 10px; } .t-c-h25 .card-audio{ width: 56px; position: absolute; top: 50px; right: 20px; } .t-c-h25 .c-pl-a.pl-n{ height: 68px; margin: 24px 0; } .t-c-h25 .c-pl-a.pl-n .bt-pp{ min-width: 48px; max-width: 48px; min-height: 48px; max-height: 48px; border-width: 8px; } .t-c-h25 .c-pl-a.pl-n .opc{ height: 48px; align-items: center; } .c-pl-a.pl-n .tit, .c-pl-a.pl-n .tim{ font: 13px/16px Poppins; margin: 0; } .t-c-h25 .hide-img{ background: rgba(0,0,0,0.9); color: #fff; font: 600 14px/18px Poppins, sans-serif; display: flex; justify-content: center; flex-direction: column; text-align: center; position: absolute; top: 0; bottom: 0; left: 0; right: 0; z-index: 3; } .t-c-h25 .hide-img-btn{ height: 40px; width: 260px; border-radius: 20px; background-color: #FFFFFF; font: 14px/20px Poppins, sans-serif; text-align: center; color: #000000; margin: 0 auto 33px; display: flex; justify-content: center; align-items: center; margin-top: 20px; cursor: pointer; } .t-c-h25 .show-img{ opacity: 0; animation-duration: .5s; animation-name: fade-out; } .t-c-h25 .credits-c{ background: #fbfbfb; width: 100%; padding: 48px 0 68px; margin-top: 24px; } .t-c-h25 .credits{ max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; align-items: flex-start; } .t-c-h25 .credits span{ display: block; background: #FFD400; padding: 8px 24px; font: 700 16px/24px Poppins; color: #191C30; margin-bottom: 24px; text-transform: uppercase; } .t-c-h25 .credits p{ font: 16px/24px Poppins; color: #191C30; margin: 0 0 0 24px; } .t-c-h25 .text-block{ display: block; padding-bottom: 15px; } @media screen and (max-width: 768px){ .t-c-h25 .section-header { height: 100%; } .t-c-h25 .header{ height: 100%; padding: 0 16px; } .t-c-h25 .header .title{ padding: 50px 0 24px; } .t-c-h25 .header h1{ font: 700 40px/48px Poppins, sans-serif; max-width: 450px; } .t-c-h25 .header span{ font: 18px/24px Poppins, sans-serif; } .t-c-h25 .header p{ font: 18px/22px Poppins, sans-serif; margin: 24px auto; } .t-c-h25 .header .c-pl-a.pl-n{ margin: 0 auto; } .t-c-h25 .content{ padding: 0 16px; } .t-c-h25 .content .first-p{ font: 20px/26px Poppins, sans-serif; } .t-c-h25 .content p{ font: 16px/20px Poppins, sans-serif; } .t-c-h25 .content .quote p{ font: 20px/24px Poppins, sans-serif; } .t-c-h25 .content .quote p:before{ left: -4px; } .t-c-h25 .media-container .caption{ font: 12px/16px Poppins, sans-serif; padding: 0 16px; } .t-c-h25 .container-txt{ align-items: center; } .t-c-h25 .container-txt p{ font: 16px/20px Poppins, sans-serif; } .t-c-h25 section{ height: 100vh; } } El viaje de un corazón para volver a latir Un reportaje de Aimar Bretos, Víctor Olazábal y Alejandro Becerra Un trasplante de corazón empieza con una llamada que activa una cuenta atrás: el tiempo que corre hasta que el órgano del donante se implanta en el cuerpo del receptor. Esta historia recorre todo el operativo que se organiza tras esa llamada. 27/11/2023 Play/Pause Mostrar Opciones Cerrar Descargar Compartir Cerrar Compartir Facebook Twitter Linkedin Whatsapp Embeber El código iframe se ha copiado en el portapapeles Compartir Juan tiene 43 años. Desde los 28 ha sufrido 5 infartos y en las últimas semanas ha tenido que ingresar de urgencia en el hospital Puerta de Hierro de Madrid. No hay más tiempo. Parte de su corazón no se desempeña como debería; él sabe que sólo le funciona "un cachito". El resto del órgano está muerto. Los médicos han sido muy claros: sin un trasplante inmediato, su esperanza de vida se verá reducida a dos años como máximo. En algún momento de 2023, que no podemos especificar, Juan ha permanecido ingresado en planta, después ha pasado a una UCI y a un quirófano. En unas 18 horas ha recibido un trasplante de corazón. Pero viajemos al principio. Un día, tras una llamada, los coordinadores de trasplantes del hospital madrileño han subido a su cama y le han dado la noticia: hay un corazón para él, con un porcentaje muy alto de compatibilidad. Juan es optimista, pero sabe que no es fácil. No es la primera vez que un grupo de cirujanos viaja a por un órgano y vuelve con las manos vacías. En un momento de la tarde todo se ha puesto en marcha. Los médicos han subido a Juan a una unidad de cuidados intensivos y afronta con esperanza lo que va a ser una larga noche y mañana. También con algo de miedo. Estoy emocionado, con nervios de poder vivir de nuevo. Es tener una segunda oportunidad" Juan, el receptor Un trasplante de corazón en España comienza con una llamada. Es el inicio de una cadena que tiene un principio y un fin. El objetivo es que A, que en este caso es Juan, reciba el corazón de B, un donante anónimo que ha fallecido en algún hospital del territorio español, en las condiciones que estipula la ley. Un equipo de 'Hora 25' ha podido seguir toda la cadena de solidaridad desde esa llamada hasta el despertar de Juan con un nuevo corazón. Pegados a un equipo de médicos del Puerta de Hierro. Un operativo cubierto por la sanidad pública de nuestro país que sigue unos protocolos muy engrasados que incluyen logística, cirugía precisa y eficiencia de los recursos. La llamada se recibe en la sede central de la Organización Nacional de Trasplantes (ONT). Es una institución que depende del Ministerio de Sanidad y en la que trabajan 45 personas. La sala desde la que se produce el contacto con un hospital es reducida, con seis puestos que ocupan normalmente enfermeras o médicas. Los teléfonos nunca paran de sonar. Hay varios objetos importantes: una pizarra con datos en la que aparecen los horarios de algunos aeropuertos o por quién preguntar en una situación determinada. También una lista con los pacientes que necesitan un trasplante urgente. Son pacientes en urgencia cero, es decir, aquellos que tienen prioridad sobre otros enfermos que, aunque necesiten un órgano, no lo requieren en un periodo corto de tiempo. Play/Pause Mostrar Opciones Cerrar Descargar Compartir Cerrar Compartir Facebook Twitter Linkedin Whatsapp Embeber El código iframe se ha copiado en el portapapeles La ONT recibe llamadas pero también las hace cuando tiene un órgano para ser trasplantado. El teléfono se descuelga en un hospital cualquiera de toda España. En este caso es el situado en Majadahonda (Madrid), que cuenta con una unidad de coordinación de trasplantes. Allí trabajan David Uruñuela y Carlina García. Ellos se reparten las 24 horas una guardia permanente para los receptores a su cargo o los posibles donantes que haya en su hospital. En esa primera llamada de la ONT al Puerta de Hierro hay un intercambio de datos clave: grupo sanguíneo, edad, género, causa del fallecimiento del donante y, por supuesto, urgencia. "Hoy me han dicho que posiblemente haya uno. Van a verlo y si todo va bien me lo ponen hoy", explica Juan desde la UCI. "Hasta que no estamos seguros de que vamos a ir a ver el órgano no les decimos nada. Es un baile de emociones que no tiene sentido", apunta Carlina. Hay órganos que por sus características y disponibilidad solo pueden ser trasladados por vía aérea. El corazón, como ocurre con Juan, tiene un tiempo de isquemia de 4 horas, es decir, el tiempo máximo que un órgano puede pasar "desconectado" del cuerpo. Es muy poco tiempo para que el traslado sea en ambulancia. El avión es la única solución. "El menor tiempo posible" es la expresión que más se va a repetir en las horas que dura el operativo. "Teniendo los datos de la ONT hablamos con las personas del equipo, cardiólogos y cirujanos cardíacos, para ver si el corazón con esas características sirve para nuestro receptor. Si vemos que sí, ponemos todo en marcha: volvemos a hablar con la ONT, ellos hablan con el hospital donante y organizamos a todas las personas que tienen que ir allí y que preparan aquí al paciente", explica García. Ese "todas las personas" en este caso son tres cirujanos cardíacos, un intensivista rotante y una enfermera instrumentista. Además, se ha dispuesto una ambulancia para el traslado al aeropuerto, un avión privado con dos pilotos cedido por una empresa y el personal implicado en el hospital donante. Hasta la llegada a ese centro, todo es relativamente tranquilo, pero tras el explante los tiempos se aceleran. "¿Cómo decidimos que un órgano sirve para una persona u otra? Lo primero: el mismo grupo sanguíneo, después un tamaño parecido y la tercera cosa es la gravedad. Eso lo sabemos porque todas las semanas los equipos médicos interdisciplinares nos reunimos y vemos cómo están los pacientes de nuestra lista. En igualdad de condiciones, priorizamos al paciente que está más grave. Todo se hace con muchísima claridad, pero el tiempo de espera es incierto porque depende de que haya más o menos órganos. En todo caso, tienen la seguridad de que irá primero quien más lo necesite", aclara la coordinadora de trasplantes. Es duro y complicado, pero hay veces que uno no entra en lista de espera porque la supervivencia es corta" David Uruñuela, enfermero "La esperanza de vida la tienes en cuenta antes de incluir a un paciente en lista de espera. Lo que queremos con el trasplante es convertir una enfermedad, que es terminal si no hacemos nada, en una enfermedad crónica en la que el paciente deberá llevar una medicación, pero con una vida relativamente normal. El equipo de cardiólogos valora si, según la esperanza de vida, tiene sentido incluir al paciente o no porque al final no podemos arriesgarnos a perder algo tan valioso y escaso como un corazón. Es duro y complicado, pero hay veces que no entra en lista de espera porque la supervivencia es corta", añade Uruñuela. Juan es un paciente joven, pero muy enfermo. Todo se hace con un objetivo: que pueda vivir más. Mucho más. Carlina ha activado al equipo que viaja un par de horas antes. Hasta ese instante, el teléfono echa humo porque tiene que llamar individualmente a todos los implicados, incluido el conductor de la ambulancia y la empresa que cede el avión. Los cirujanos que viajan no son los mismos que luego implantan el corazón, porque ese grupo se quedará en Madrid preparando a Juan en un preoperatorio largo y complicado. El primer grupo observará el corazón, comprobará su validez y lo extraerá, para traerlo en una nevera refrigerada. "Todo el mundo tiene que estar prep'''
