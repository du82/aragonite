["https://cadenaser.com/cataluna/2025/02/12/el-supremo-confirma-cuatro-anos-y-medio-de-prision-a-laura-borras-por-prevaricacion-y-falsedad-sercat"]
title = "El Supremo confirma cuatro años y medio de prisión a Laura Borrás por prevaricación y falsedad   | Tribunales  | Cadena SER"
description = "El tribunal rechaza aplicarle la amnistía | Cadena SER"
full_description = 'TribunalesEl Supremo confirma cuatro años y medio de prisión a Laura Borrás por prevaricación y falsedad El tribunal rechaza aplicarle la amnistíaLaura Borrás, en una foto de archivo de cuando era presidenta del Parlament / Quique Garcia (EFE)AmpliarCerrarFacebookTwitterLinkedInWhatsAppAgencia ServimediaCadena SER12/02/2025 - 11:54 UTCMadridLa Sala de lo Penal del Tribunal Supremo ha confirmado la condena a cuatro años y medio de prisión, 13 años de inhabilitación y multa de 36.000 euros impuesta a la expresidenta del Parlament de Catalunya Laura Borrás por delitos de prevaricación administrativa, continuado de falsedad en documento oficial y como inductora de un delito continuado de falsedad en documento mercantil, por adjudicar de forma irregular a un conocido, mediante 18 contratos menores, la elaboración del portal web de la Institució de les Lletres Catalanes (ILC), que ella dirigía entre 2013 y 2018, por valor de 335.700 euros.Más informaciónLaura Borràs, condenada a cuatro años y medio de prisión por fraccionar contratos y adjudicarlos a dedo a un amigoLaura Borràs descarga culpas en la funcionaria que la incriminó: "Ella hizo la contratación"El informático amigo de Laura Borràs confiesa y la incrimina: "Acordamos dividir el trabajo en varios contratos"Además, el tribunal, de acuerdo con la Fiscalía, rechaza la petición de la recurrente de que se le aplicase la Ley de Amnistía de junio de 2024, ya que los hechos probados que han sido calificados como delitos de prevaricación y de falsedad no guardan relación alguna con el proceso independentista catalán.La Sala desestima íntegramente el recurso de casación de Borrás en el que, entre otros motivos, cuestionaba la proporcionalidad de la pena impuesta y se basaba para ello en que el Tribunal Superior de Justicia de Cataluña propuso en su sentencia un indulto parcial para dejar en dos años la pena de prisión, y en el voto particular discrepante de una magistrada del tribunal catalán que reclamaba una condena inferior.Laura BorràsTribunal SupremoPrisionesPrevaricaciónAmnistíaLo más leídoLo más escuchadoPlayT12x24 | A quien madruga, RR le abraza15/02/2025Play"El Real Madrid tiene que olvidarse de esta guerra arbitral...": El perjuicio que supone la cruzada blanca contra el arbitraje16/02/2025PlayEl comunicado del Alavés contra el estamento arbitral, la entrevista a Álvaro García y las previas de los partidos ligueros de mañana16/02/2025PlayFlash Deportes | 23:0015/02/2025PlayMillás solo necesita 5 minutos para explicar el fenómeno Montoya y revela qué escena de una película es igual a su reacción16/02/2025'
