["https://www.cadsketcher.com/cad-sketcher-roadmap"]
title = "CAD Sketcher Roadmap | CAD Sketcher"
full_description = 'CAD Sketcher RoadmapThis is the easy to read version of the CAD Sketcher roadmap. This page is very flexible currently and not much is set in stone. However, the closer we get to release 1.0.0 and the more support we receive the more likely things will become finalized and maybe even dated.Feature RequestsView & Share IdeasBounty HuntingHard Work Has A PriceBug ReportsIt Broke...CAD Sketcher Roadmap: ServicesChange LogCAD Sketcher Roadmap: ServicesCAD Sketcher 0.27.0The Checkpoint UpdateLearn MoreRoadmap KeyReleases:○ - Open, more features could still be added via requests.● - Closed, no more features to be added to release.​Features:☐ - Feature confirmed as possible.◍ - Feature possibility unknown, further research needed.✇ - Underdevelopment ☑ - Development complete.CAD Sketcher Roadmap: Text● Release 1.0.0The Sketcher FundamentalsCAD Sketcher Addon:☑ Constraint Shortcuts.☑ Communicating that a sketch is fully constrained.☑ Horizontal/Vertical distance constraint mode.☑ Keeping Materials after sketch edits.☑ Linked duplicate support.☑ Modifier application support. (Destructive workflow)☑ Sketch bevel tool.☑ Coincident point auto merging.☑ Improved constraint. symbol placement.☑ Radial mode to diameter constraint.☑ Constraint display toggle.☑ Entity Grab: Move All Selected.☑ Expose Workplane XYZ ( Quaternion(WXYZ) Conversion )☑ Workplane To 3D Cursor.☑ Reference Dimensions☑ Blender Driver Support.☑ Selection Modifiers.☑ Shortcut in all tooltips.☑ Trim entity tool.☑ Constraints selectability toggle.☑ Sketch Force Update Button.☑ Entity Renaming.☐ Auto Dimensional Inputs.☐ Entity Copy & Paste.☐ Offset Tool☑ Drag box selection.☐ Bug Fixing.☐ Maintainable & Extendable Code Architecture.☐ Thorough Testing & Tweaking before1.0.0 Release.​Other:✇ Website.☑ Shortcut sheet.☐ Documentation update.✇ Discord Community.✇ Social media.☐ User onboarding.☐ Dev contribution onboarding.☑ Acceptance to Open Collective.✇ Communicate with early sponsors.☐ Maker Tales free youtube course.CAD Sketcher Roadmap: Text○ Release 2.0.0Referencing FundamentalsCAD Sketcher Addon:☐ Linked Sketches.☐ Sketch Duplication.◍ Mesh face referenced workplans.☐ Improved Sketch to sketch referencing.☐ Referenceable Tables ( Maybe CSV Support )☐ Better entity organization☐ UI update​Have more Ideas let us know: Feature Requests ​Other:☐ Maker Tales free youtube course.CAD Sketcher Roadmap: TextThe FutureCAD Sketcher Addon:◍ Project lines from objects◍ Snapping to outside geometry◍ Smooth shading support☐ CAD Sketcher "API" letting other addons plugin to the power of CAD Sketcher.​Other:☐ CAD Sketcher external development fund and community driven green light program.CAD Sketcher Roadmap: TextHave A Suggestion?Let Us KnowCAD Sketcher Roadmap: TextVersion NumberingWe are using Semantic Versioning.In a nutshell:First number is for "BIG" updates.Second number is feature adding.Thrid number is bugfixes. CAD Sketcher Roadmap: TextSee The Work Being DoneView Dev Change LogCAD Sketcher Roadmap: Text'
