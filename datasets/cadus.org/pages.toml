full_description = "Einsatzgebiet Paqua Neu-Guineaadmin2023-11-21T15:56:31+00:00 Einsatzgebiet Papua Neu-GuineaEMT-Einsatz in Papua-Neuguinea Übersicht:Ein zehnköpfiges medizinisches Team von CADUS hat in Papua-Neu Guinea das lokale Gesundheitsystem mit einer „Shadowing“-Mission im Kampf gegen COVID19 unterstützt. Dort gab es zuletzt durch die Delta-Variante viele Probleme. Projektverlauf: Aufgrund der schwierigen Pandemiesituation bat die Regierung von Papua-Neu Guinea Ende 2021 die WHO EMT-Struktur um medizinische Unterstützung. CADUS antwortete auf die Bitte und schickte neun Mediziner:innen und einen Head of Mission (Einsatzleitung) nach Papua-Neu Guinea. Dort verbrachte das Team drei Wochen im Nonga-Hospital und Umgebung, in der Region East New Britain. Als Shadowing-Mission stand vor allem die Weitergabe von Expert:innen-Wissen im Vordergrund, das sich die Mediziner:innen in den zwei vorherigen Jahren in Deutschland bei der Behandlung von Corona-Patient:innen aneignen konnten. Unsere Mediziner:innen beobachteten den örtlichen Krankenhausalltag und die lokalen Prozesse, um sie dann in Zusammenarbeit mit ihren papua-neuguinesischen Kolleg:innen zu verbessern. Obwohl die Personal- und Ressourcenknappheiten des dortigen Gesundheitssystems eine große Herausforderung waren, konnte mit relativ wenig Mitteln bereits viel erreicht werden. Das Team gab Schulungen zu Lagerungspositionen von Patient:innen, Triagierung, Hygiene und Schutzbekleidung der Angestellten. Auch ein bereits vorhandens CPAP-Beatmungsgerät konnte umgemodelt und mit entsprechenden Schulungen für die Beatmung von Patient:innen genutzt werden. So gelang es unserem Team in Zusammenarbeit mit ihren lokalen Kolleg:innen, in einer relativ kurzen Zeit einen möglichst nachhaltigen und positiven Effekt auf die Prozesse und den Krankenhausalltag zu haben."
