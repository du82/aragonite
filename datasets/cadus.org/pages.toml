full_description = "Einsatzgebiet Pakistanadmin2023-11-20T18:14:30+00:00 Einsatzgebiet PakistanUnterstützung für Kabul Luftbrücke Übersicht:In Pakistan unterstützen wir die Organisation Kabul Luftbrücke mit einem Hygienekonzept und medizinischer Unterstützung. Dort warten die evakuierten Personen aus Afghanistan auf ihre Papiere für die Einreise nach Deutschland. Projektverlauf:Anfang Februar 2022 ist eine unserer Medics nach Islamabad geflogen, um das Team von Kabul Luftbrücke zu untersützen. Kabul Luftbrücke ist eine zivile Organisation, die seit der Übernahme der Taliban im August 2021 daran arbeitet, gefährdete Personen aus Aufghanistan zu evakuieren und sie beim Asylantrag zu unterstützen. Die Evakuierten werden von Kabul erst einmal nach Islamabad, der Hauptstadt von Pakistan geflogen und warten dort auf die nötigen Papiere für die Weiterreise. In Islamabad war das Corona-Virus in dem Zeitraum stark verbreitet, und gleichzeitig wurden nur wenige Gegenmaßnahmen getroffen. Damit die Wartenden sich in Islamabad nicht mit COVID19 infizieren, führte unsere Medic Tests durch und erstellte ein Hygienekonzept für die Organisation vor Ort."
