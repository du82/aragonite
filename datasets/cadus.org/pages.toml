["https://cadus.org/einsatzgebiet-nordost-syrien"]
title = "Einsatzgebiet Nordost-Syrien - cadus.org"
description = "Die technische Speicherung oder der Zugang ist unbedingt erforderlich für den rechtmäßigen Zweck, die Nutzung eines bestimmten Dienstes zu ermöglichen, der vom Teilnehmer oder Nutzer ausdrücklich gewünscht wird, oder für den alleinigen Zweck, die Übertragung einer Nachricht über ein elektronisches Kommunikationsnetz durchzuführen."
full_description = "Einsatzgebiet Nordost-Syrienadmin2023-12-08T00:52:22+00:00 Einsatzgebiet Nordost-SyrienNeun Jahre lang war CADUS mit verschiedenen Projekten in der Region aktiv. Schon kurz nach der Gründung unseres Vereins im Sommer 2014 waren wir das erste Mal vor Ort in Nordost-Syrien, damals noch Rojava genannt. Als erstes führten wir eine „fact finding mission“ durch: nahe der umkämpften Stadt Kobani war unser gemischtes Team sowohl journalistisch tätig als auch um eine medizinisch Einschätzung der Lage bemüht. Daraus resultierte wenig später unsere erste Mission mit medizinischem Fokus. Es folgten mehrere Einsätze mit dem Ziel der Ausbildung von Ersthelfer:innen. Schließlich fiel die Entscheidung, ein mobiles Krankenhaus für die gegen den sogenannten Islamischen Staat (IS) kämpfende Region zu bauen. Die Beschaffung und Umrüstung der Fahrzeuge für das Mobile Hospital begründete unseren Crisis Response Makerspace. Wir mieteten uns ein, schafften Werkzeuge an, und arbeiteten mit einer wachsenden Gruppe von Ehrenamtlichen daran, medizinische Versorgung für Nordost-Syrien mobil auf die Straße zu bringen. Anfang 2017 war es soweit: Fahrzeuge und medizinisches Equipment wurden auf den Weg gebracht. CADUS in Rojava 2015: fact finding missionIm Irak war jedoch erstmal Schluss: das Mobile Hospital kam nicht über die Grenze. Gleichzeitig tobte in Mossul der Befreiungskampf gegen den IS. Die WHO wurde auf unsere mobile medizinische Versorgung aufmerksam und bat uns, dort nahe der Front mit einem Trauma Stabilization Point (TSP) zu unterstützen. In einem verlassenen Gebäude hat das CADUS Team schnell die medizinische Notversorgung eingerichtet und alles darangesetzt, auch in unmittelbarer Nähe des Kampfgeschehens die Menschen zu stabilisieren, so dass sie den Transport in das nächste Krankenhaus überstehen. Mobile Hospital on the road to Middle East 2017Nach Mossul folgten weitere TSP-Einsätze im Irak, bis Anfang 2018 endlich das Mobile Hospital unserer Partnerorganisation, dem Kurdischen Roten Halbmond, in Nordost-Syrien übergeben werden konnte. Der Kampf gegen den IS tobte auch dort weiter, inmitten der zahlreichen weiteren Konflikte in der Region. Auch hier wurde der Ruf nach einem TSP laut, und die WHO unterstütze Pläne in dieser Richtung. Allerdings kam das Projekt hier nie über die Planungsphase hinaus, sondern wurde von anderen Geschehnissen mit neuen, dringenden Bedarfen überholt. Die Kämpfe ließen Rakka als Trümmerfeld zurück. Hier unterstützten wir den Kurdischen Roten Halbmond dabei, eine Primary Health Care Clinic (PHC), also eine Station der medizinischen Grundversorgung, zu eröffnen. Nach zwei Jahren des gemeinsamen Betriebs übernahmen unsere Partner komplett die Leitung. Wir hatten unterdessen alle Hände voll zu tun, als Anfang 2019 das Camp Al Hol für Internally Displaced Persons (IDPs, Binnenvertriebene) von wenigen tausend auf über 70.000 Menschen anwuchs im Zuge der Zerschlagung einer der letzten Hochburgen des IS in Nordost-Syrien. CADUS beteiligte sich am Aufbau eines Feldkrankenhauses und übernahm außerdem die Leitung der internen Rettungsleitstelle des Camps. Das Feldkrankenhaus haben wir von 2019 bis 2023 betrieben. Unsere Mitarbeitenden vor Ort haben schließlich ihre eigene NGO gegründet und führen das Projekt seither fort. Die Rettungsleitstelle wurde wiederum vom Kurdischen Roten Halbmond übernommen, mit dem wir schon vielfach zusammengearbeitet haben. Auch wenn CADUS nicht immer direkt vor Ort sein kann, so war es uns durch diese Kooperation immerhin möglich, aus der Ferne durch Spenden humanitärer Hilfsgüter die Betroffenen des schweren Erdbebens Anfang 2023 unterstützen, und auch die medizinische Notversorgung während der Invasion der Türkei Ende 2019. Der Rückzug aus Nordost-Syrien war keine leichte Entscheidung für uns. Aber letztendlich arbeiten wir immer darauf hin, regionale Kapazitäten aufzubauen und die humanitäre Hilfe lokale Hände zu übergeben. Auch wenn der Weg dorthin schwer war und unser Verein zeitweise auch intern zu kämpfen hatte, können wir doch sagen, dass wir das Kapitel Nordost-Syrien in der Geschichte von CADUS erfolgreich abgeschlossen haben. CADUS Ambulance in cooperation with KRC during Turkish attacks 2019"
