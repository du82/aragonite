full_description = "Verhärtete Fronten – CADUS Jahresrückblick 2024 Gallerie Verhärtete Fronten – CADUS Jahresrückblick 2024 blog, CADUS, EMT, Gaza, Jahresrückblick, Syrien, Ukraine Verhärtete Fronten – CADUS Jahresrückblick 2024Jonas Gruenwald2025-01-20T11:50:06+00:00Januar 15th, 2025| Das Jahr 2024 war für uns gleich in dreifacher Hinsicht besonders: wir feierten unser 10jähriges Jubiläum, starteten in unseren bisher herausforderndsten Einsatz und haben uns nach einigen arbeitsreichen Jahren endlich als Emergency Medical Team klassifiziert. Aber der Reihe nach.Read More CADUS beim 38c3 – Berichte aus dem Feld und ein ganz besonderes Arbeitsamt Gallerie CADUS beim 38c3 – Berichte aus dem Feld und ein ganz besonderes Arbeitsamt blog, CADUS, Netzwerk CADUS beim 38c3 – Berichte aus dem Feld und ein ganz besonderes ArbeitsamtCorinna Schaefer2025-01-03T14:01:04+00:00Januar 3rd, 2025|Zum Abschluss des Jahres 2024 haben wir uns noch einmal richtig ins Zeug gelegt: Auf dem Chaos Communication Congress 38C3 gab es mehrere Vorträge von CADUS und eine recht ungewöhnliche humanitäre Job-Beratung.Read More Freude und Sorge: Nordost-Syrien nach dem Sturz des Assad-Regimes Gallerie Freude und Sorge: Nordost-Syrien nach dem Sturz des Assad-Regimes blog, Syrien Freude und Sorge: Nordost-Syrien nach dem Sturz des Assad-RegimesCorinna Schaefer2024-12-28T20:58:21+00:00Dezember 16th, 2024| Am Morgen den 8. Dezember 2024 haben wir uns bei CADUS verwundert die Augen gerieben: Assad ist weg, das Regime in Syrien gestürzt nach 54 Jahren brutaler Diktatur. Diejenigen die die systematische Folter überlebt haben können die Gefängnisse verlassen.Read More"
