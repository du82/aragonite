["https://www.cadus.org/ueber-uns/vision-mission"]
title = "Vision & Mission - cadus.org"
description = "Die technische Speicherung oder der Zugang ist unbedingt erforderlich für den rechtmäßigen Zweck, die Nutzung eines bestimmten Dienstes zu ermöglichen, der vom Teilnehmer oder Nutzer ausdrücklich gewünscht wird, oder für den alleinigen Zweck, die Übertragung einer Nachricht über ein elektronisches Kommunikationsnetz durchzuführen."
full_description = "Vision & MissionJonas Gruenwald2024-02-22T12:27:32+00:00 Vision & MissionWir leisten medizinische und technische Unterstützung dort, wo sie dringend benötigt wird. Um Menschenleben zu retten, Leiden zu lindern und weitere Not zu verhindern. Denn jeder Mensch soll Zugang zu Hilfe bekommen wenn er sie braucht. Ebenso sollte jeder Mensch die Möglichkeit erhalten, sich durch den Aufbau eigener Kapazitäten unabhängig zu machen. Darum arbeiten wir gemeinsam mit Partner:innen vor Ort an kreativen, bedarfsorientieren Lösungen. Wir teilen unser Wissen durch Trainings, und setzen uns in diesem Sinne für nachhaltige, respektvolle humanitäre Hilfe ein. Nothilfe Humanitäre Nothilfe muss ankommen CADUS leistet medizinische und technische Nothilfe, mobil und modular. Auch dort, wo sonst niemand hilft. Denn Menschen, die in Not sind – egal wo und aus welchem Grund – haben ein Recht auf Unterstützung. Kooperation Starke Partnerschaften CADUS setzt auf Kooperation, Trainings und interdisziplinäre Netzwerke. Denn nachhaltige humanitäre Hilfe geht nur gemeinsam mit den von Krisen, Krieg und Katastrophen Betroffenen. Innovation Humanitäre Nothilfe braucht Kreativität Im CADUS Crisis Response Makerspace liegen Einsatzerfahrung, Ideen, und das Werkzeug, um sie umzusetzen, direkt beieinander. Hier schaffen wir kreative Lösungen und teilen diese nach dem open-source-Prinzip. Information Die Frage nach dem Warum Krisen verstehen, um sie zu überwinden: CADUS fragt nach, schafft Öffentlichkeit, setzt sich für Betroffene ein. Und wagt dabei auch einen kritischen Blick auf das Arbeitsfeld der humanitären Hilfe, und auf das eigene Handeln. Deine Spende macht es möglich, dass wir unsere Ressourcen und Fähigkeiten dort einsetzen, wo sie am dringendsten gebraucht werden. Jetzt für Nothilfe spenden"
year_published = 2021
