["https://cadus.org/einsatzgebiet-ukraine"]
title = "Einsatzgebiet Ukraine - cadus.org"
description = "Die technische Speicherung oder der Zugang ist unbedingt erforderlich für den rechtmäßigen Zweck, die Nutzung eines bestimmten Dienstes zu ermöglichen, der vom Teilnehmer oder Nutzer ausdrücklich gewünscht wird, oder für den alleinigen Zweck, die Übertragung einer Nachricht über ein elektronisches Kommunikationsnetz durchzuführen."
full_description = "Einsatzgebiet Ukraineadmin2023-11-20T13:10:09+00:00 Einsatzgebiet UkraineDirekt nach dem Angriff Russlands auf die Ukraine im Februar 2022 ist CADUS aktiv geworden. Mit Beschaffung und Transport humanitärer Hilfsgüter haben wir zu Anfang die zivilgesellschaftliche Initiative Project Nadiya an der slowakisch-ukrainischen Grenze unterstützt. Bereits einen Monat später sind wir mit unserem MEDEVAC-Einsatz in der Ukraine gestartet. Zu den medizinischen Evakuierungen kamen ein mobiler Makerspace und der Aufbau eines vielfältigen medizinischen Trainingsprogramms hinzu. MEDEVACMit unseren Rettungsfahrzeugen führen wir medizinische Evakuierungen durch. Zeitraum: seit März 2022 Die Verlegung unseres ersten Rettungswagens nach Lviv im März 2022 markierte den Beginn unseres MEDEVAC-Einsatzes in der Ukraine. Dort führen wir medizinische Evakuierungen durch, und haben zu Anfang auch den MEDEVAC-Einsatz anderer internationaler Organisationen vor Ort koordiniert. Neben drei Rettungsfahrzeugen die wir in der Ukraine selbst mit einem Team vor Ort betreiben, haben wir 22 weitere und viel medizinisches Equipment, z.b. 75 Beatmungsgeräte, für die lokale ukrainische Rettungsstruktur beschafft und übergeben. Ende 2022 haben wir unseren Einsatzschwerpunkt nach Dnipro verlegt, und seit Oktober 2023 führen wir in Kooperation mit Ärzte ohne Grenzen/MSF auch im Landkreis Donetsk intensivmedizinische Transporte durch. Weitere Projekte mit medizinischem Schwerpunkt für die Ukraine sind die MICU (Mobile Intensive Care Unit), ein zur fahrenden Intensivstation umgebauter Reisebus, und die mobile PHC (Primary Health Care), eine rollende Arztpraxis für die medizinische Grundversorgung. Beide Fahrzeuge haben wir in Berlin in unserem Crisis Response Makerspace umgebaut und ausgestattet, und anschließend in die Ukraine überführt und an Partnerorganisationen übergeben. TrainingsSchulungen für Menschen mit und ohne medizinische Ausbildung. Zeitraum: seit März 2022 In sieben unterschiedlichen Kursen bilden wir Laien und Fachkräfte in der Ukraine notfallmedizinisch weiter und unterstützen so den Aufbau und die Verbesserung lokaler Rettungsstrukturen. Bisher haben über 1500 Personen in 11 Städten zu den verschiedenen Themen teilgenommen. Die bereits vor dem Krieg lokal sehr unterschiedlich ausgeprägten medizinischen Versorgungsstrukturen waren spätestens mit dem Angriff Russlands auf die Ukraine im Februar 2022 überlastet. Zeitgleich wollten viele Ukrainer:innen, lokale Initiativen und Organisationen helfen, diese Lücke zu schließen. Neben Material fehlte den regulären Rettungskräften und Freiwilligen aber häufig auch eine spezifische Ausbildung gerade im Bereich der Versorgung von Kriegsverletzungen. Wir begannen mit ersten Trainings im Bereich der lebensrettenden Sofortmaßnahmen im Westen der Ukraine. Mittlerweile bieten wir sieben Kurse im Bereich der vorklinischen Versorgung an, von akuter Verletzungsversorgung, ersten Maßnahmen im Fall von Explosionsverletzungen über das Erlernen von Beatmungstechniken bis zum Umgang mit biologischen, chemischen und radioaktiven Gefahren. Bei Abschluss des Kurses erhalten die Kandidat:innen ein Zertifikat. Des Weiteren streben wir eine Zertifizierung der Kurse nach internationalem Continuing Medical Education Standard (CME) an und arbeiten dafür unter anderem mit der Ternopil National Medical University, der größten medizinischen Ausbildungsstätte in der Ukraine, zusammen. Zukünftig wird der Fokus verstärkt auf der Standardisierung der Trainings für eine Übergabe und dem train-the-trainer Ansatz liegen, damit Kurse auch in lokaler Eigenregie unserer Partner angeboten werden können. Mobiler MakerspaceWiederaufbau und Schaffung von Unterkünften. Zeitraum: Mai – August 2022 In unserem Crisis Response Makerspace in Berlin haben wir einen mobile Makerspace auf Basis einen Transporters gebaut und im Mai 2022 auf den Weg in die Ukraine gebracht. Zusammen mit mehreren ukrainischen und deutschen Partnerorganisationen haben wir uns am Wiederaufbau in der Ukraine beteiligt – mitten im Krieg. Unser Team ehrenamtlicher Handwerker:innen hat in lokalen Kooperationen Gebäude wieder hergerichtet als Unterkunft für Binnen-Geflüchtete. Auch eine Feuerwehr-Station und eine Schule wurden wiederhergerichtet. Finanziert wurde das Projekt bis August 2022 durch die GIZ. Nach Ende der Finanzierung mussten wir den Mobile Makerspace vorerst zurückholen. Doch die Ausstattung einer neuen rollenden Werkstatt ist in Berlin in vollem Gange, und Gespräche laufen mit potentiellen neuen Geldgeber:innen. Wir hoffen, dass wir auch im Bereich Wiederaufbau unseren Einsatz bald fortsetzen können. Latest NewsView all Interview: Als Ärztin in der Ukraine Drei Jahre Ukraine-Krieg – drei Jahre Nothilfe Verhärtete Fronten – CADUS Jahresrückblick 2024"
