full_description = "CADUS Startseiteadmin2024-12-20T11:52:44+00:00 Menschenleben retten. Leid lindern. Weitere Not verhindern. Wir müssen jetztbedingungslos humanitär handeln. Jetzt für Nothilfe spendenCADUS International Disaster ResponseCADUS ist eine gemeinnützige, unabhängige, internationale Hilfsorganisation aus Berlin. In unseren Projekten leisten wir schnelle, bedarfsorientierte Nothilfe, und fördern den Aufbau langfristiger Kapazitäten vor Ort. Dabei folgen wir den humanitären Prinzipien und setzen auf lokale Kooperationen. Gemeinsam arbeiten wir an kreativen Lösungen und teilen diese öffentlich. Unser Engagement beinhaltet vier Schwerpunkte: Nothilfe, Kooperation, Innovation und Information. Aktuelle EinsatzgebieteGaza. Wir sind das erste deutsche Emergency Medical Team, das in der gegenwärtigen humanitären Katas-trophe in Gaza hilft. Seit Februar 2024 sind wir mit einem Team in Gaza im Einsatz und führen unter anderem Patiententransporte aus Nord-Gaza durch. Der Einsatz wird durch die WHO-EMT-Struktur koordiniert. Ukraine. Seit Februar 2022 sind wir in der Ukraine aktiv und führen mit unseren Rettungsfahrzeugen medi-zinische Evakuierungen durch. Außerdem geben wir Trainings für Menschen mit und ohne medizinische Ausbildung. Mit unserem mobilen Makerspace helfen wir beim Wiederaufbau. Neuigkeiten Interview: Als Ärztin in der Ukraine Drei Jahre Ukraine-Krieg – drei Jahre Nothilfe Verhärtete Fronten – CADUS Jahresrückblick 2024 CADUS beim 38c3 – Berichte aus dem Feld und ein ganz besonderes Arbeitsamt Freude und Sorge: Nordost-Syrien nach dem Sturz des Assad-Regimes Statement zum MedEvac vom 03.11.24 Unsere vier Säulen des EngagementsNothilfeWir leisten medizinische und technische Nothilfe. Auch dort, wo sonst niemand hilft. KooperationIn unseren Einsätzen kooperieren wir vor Ort und bauen gemeinsam durch Trainings Kapazitäten auf. InnovationWir schaffen kreative Lösungen für bedarfsorientierte Hilfe nach dem open-source-Prinzip. InformationWir diskutieren humanitäre Hilfe (selbst-) kritisch, und fragen nach den Ursachen von Krisen. Mehr über unsere GrundsätzeEinsatzgebieteMit unseren Projekten sind wir international aktiv. Schwerpunkte unserer Arbeite befinden sich aktuell in der Ukraine und in Gaza. Aber auch in Nordost-Syrien, im Irak, im Mittelmeer und in Bosnien-Herzegowina waren wir schon im Einsatz. Alle Einsätze Abonniere jetzt unseren Newsletter!Bleibe informiert über unsere Einsätze, Veranstaltungen und Themen aus der Humanitären Nothilfe. E-Mail* Ich stimme der Verarbeitung meiner persönlichen Daten (eMail) zu *Ich stimme dem Empfang des Newsletters zu *Anmelden"
