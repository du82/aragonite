full_description = "EhrenamtJonas Gruenwald2024-12-25T15:54:59+00:00 Engagiere dich ehrenamtlich bei CADUSEhrenamtliche bei CADUS – ohne euch läuft hier nix! Ob du mal in unserem Berliner Crisis Response Makerspace mit anpacken oder für ein paar Wochen in den Einsatz gehen möchtest: es gibt viele verschiedene Möglichkeiten, wie du dich bei CADUS ehrenamtlich engagieren kannst. Für die meisten Tätigkeiten sind eine Ausbildung und/oder Erfahrung in einem speziellen Bereich notwendig. Diese musst du nicht unbedingt mitbringen, wir bieten für einige Bereiche Fortbildungen an. Wenn du an ehrenamtlicher Mitarbeit innerhalb von Deutschland interessiert bist, schreib eine email an volunteer.management[at]cadus.org Für einen Einsatz im Ausland, lies hier weiter."
