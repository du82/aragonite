full_description = "CADUS Homepageadmin2024-12-20T11:58:40+00:00 Saving lives. Alleviate suffering. Prevent further hardship. We must act unconditionally humanitarian now. Donate now for emergency responseCADUS International Disaster ResponseCADUS is a non-profit, independent, international emergency response organization from Berlin. In our projects, we provide rapid, needs-oriented emergency aid and promote long-term capacity building on the ground. Thereby we follow humanitarian principles and rely on local cooperation. We work together on creative solutions and share them publicly. Our commitment focuses on four areas: Emergency aid, cooperation, innovation and information. Current deployment areasGaza. We are the first German Emergency Medical Team to help in the current humanitarian catastrophe in Gaza. We have been deployed in Gaza with a team since February 2024 and, among other things, are transporting patients from North Gaza. The mission is coordinated by the WHO-EMT structure. Ukraine. We have been active in Ukraine since February 2022 and carry out medical evacuations with our rescue vehicles. We also provide training for people with and without medical training. We are helping with reconstruction with our mobile makerspace. News Nicht eine, sondern viele: Feministische Perspektiven aus unserem CADUS Team Interview: As a doctor in Ukraine Three years of war in Ukraine – three years of emergency response Hardened fronts – CADUS annual review 2024 CADUS at 38c3 – Reports from the field and a very special job center Joy and concern: North-east Syria after the fall of the Assad regime Our four pillars of commitmentEmergency responseWe provide emergency medical and technical support. Even where no one else helps. CooperationIn our assignments, we cooperate locally and build capacity together through training. InnovationWe develop creative solutions for needs-oriented support according to the open-source principle. InformationWe discuss humanitarian aid (self-)critically and ask about the causes of crises. More about our principlesDeployment regionsWe are internationally active with our projects. Our work is currently focused on Ukraine and Gaza. But we have also been deployed in Northeast-Syria, Iraq, the Mediterranean and Bosnia-Herzegovina. All deployments Subscribe to our newsletter now!Stay informed about our missions, events and topics related to humanitarian emergency response. e-mail* I consent to the processing of my personal data (e-mail) *I agree to receive the newsletter *subscribe"
