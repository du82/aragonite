full_description = "Operational area Gazaadmin2024-05-15T15:32:35+00:00 Operational area GazaPeriod: since February 2024 CADUS has a medical team on the ground in Gaza. The mission is coordinated by the WHO EMT structure. We are the first German Emergency Medical Team to help in the current humanitarian catastrophe in Gaza. Initially, we provided medical support to the European Hospital. However, we soon changed the focus of our work to a Trauma Stabilization Point (TSP). There, we work side by side with the local team in the emergency care of seriously injured and sick people. On behalf of the WHO, we also carry out medical evacuations (MEDEVAC) from the north of Gaza to the south. The press has reported on our efforts many times. Our doctor Verena reports from the European Hospital in Gaza. Latest NewsView all Interview: As a doctor in Ukraine Three years of war in Ukraine – three years of emergency response Hardened fronts – CADUS annual review 2024"
