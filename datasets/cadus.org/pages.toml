["https://www.cadus.org/einsatzgebiet-griechenland"]
title = "Einsatzgebiet Griechenland - cadus.org"
description = "Die technische Speicherung oder der Zugang ist unbedingt erforderlich für den rechtmäßigen Zweck, die Nutzung eines bestimmten Dienstes zu ermöglichen, der vom Teilnehmer oder Nutzer ausdrücklich gewünscht wird, oder für den alleinigen Zweck, die Übertragung einer Nachricht über ein elektronisches Kommunikationsnetz durchzuführen."
full_description = "Einsatzgebiet Griechenlandadmin2023-11-20T18:32:03+00:00 Einsatzgebiet GriechenlandEMT Einsatz auf Lesbos im Camp Kara Tepe 2 Ende 2020 war CADUS gemeinsam mit dem ASB für zwei Monate auf Lesbos und leistete dort humanitäre Hilfe. Im Lager Kara Tepe 2 sind hauptsächlich Geflüchtete aus dem abgrebannten Lager Moria untergebracht. Die EMT-Struktur der WHO hatte uns um eine gemeinsame Mission mit dem ASB angefragt, um die medizinische Versorgung im Camp von dem norwegischen Emergency Medical Team zu übernehmen. Bedenken zu BeginnDie Entscheidung für diesen Einsatz fiel uns nicht leicht, denn wir wollten auf keinen Fall als humanitäres Feigenblatt dienen und uns an einem neuen Camp beteiligen, in dem die Bedingungen an die menschenunwürdigen Verhältnisse im ehemaligen Lager Moria anzuschließen schienen. Doch ist es unsere Überzeugung, dass Menschen in Notlagen unterstützt werden müssen, unabhängig von politischen Bedenken. Und so entschieden wir uns für den Einsatz. Eigene Position nutzenIn der Zeit vor Ort auf Lesbos versorgten wir die Menschen im Lager medizinisch und beobachteten die Gesamtsituation. Zusätzlich arbeiteten wir eng mit den lokalen NGOs zusammen, die hier schon lange wichtige Arbeit leisten. Aufgrund der akuten COVID19-Pandemie war auch das EMLab (Europäisches Mobiles Labor) vor Ort und führte Tests durch. Unsere Behandlungsstatistik zeigte, dass etwa ein Drittel der gesundheitlichen Probleme der Menschen im Camp „directly related“ waren, also direkt aus den schlechten hygienischen Verhältnissen, Unterversorgung und angespannter Lage vor Ort resultierten. Bis zum Projektabschluss Mitte Dezember 2020 wurden insgesamt 3.000 Behanldungen durch CADUS und den ASB durchgeführt."
year_published = 2023
year_updated = 2023
