full_description = "Unser TeamJonas Gruenwald2025-03-04T13:33:09+00:00 Nico Stender Makerspace Koordinator WeiterlesenNico koordiniert alle Arbeit in unserem Berliner Crisis Response Makerspace und unterstützt die dort laufenden Projekte. Der CADUS Fuhrpark wird ebenfalls von Nico verwaltet. Und wie ist Nico zu CADUS gekommen? „Nachdem ich einige Jahre als Tischler und auf diversen Baustellen gearbeitet habe und festgestellt habe, dass ich das Handwerk zwar liebe, mir jedoch ein Stück gesellschaftlicher Mehrwert fehlt, beschloss ich, mich der humanitären Hilfe zuzuwenden. Zu Cadus kam ich im April 2022 im Rahmen eines Praktikums, damals studierte ich “internationale Not- und Katastrophenhilfe“. Seitdem kümmere ich mich um den Makerspace in Berlin, unterstütze die technische Seite unserer Nothilfeprojekte und stelle meine handwerkliche Expertise der humanitären Welt zur Verfügung wo ich kann. Motiviert werde ich durch den Wunsch nach einer gerechteren Welt und die Hoffnung bei CADUS mit Gleichgesinnten dazu beitragen zu können.“Camila ‚Cami‘ Villalobos Head of HR & Volunteers WeiterlesenCami kümmert sich um den Aufbau und die Pflege unseres Volunteer Pools, die Einbindung der Ehrenamtlichen und das Onboarding in unsere Organisation. Zusammen mit Daniele leitet sie das Crewing für die CADUS-Einsätze und organisiert deren einsatzspezifisches Training.Cami war und ist vielseitig engagiert: „Ich habe fast 10 Jahre mein eigenes Catering unternehmen geleitet und seit dem ich denken kann koche ich für politische Aktionen, Camps und Festivals – deswegen leite ich auch das CADUS Kitchen Module, eine sofort Einsatzbereite, mobile Küche die dort kochen kann wo es nötig ist und schreibe grade an einem internationalem Kochbuch, dass ohne Frischwaren auskommt aber trotzdem gesundes und kulturell sensitives Essen bietet.Neben CADUS organisiere ich seit 14 Jahren LARP Veranstaltungen, die sich häufig mit dystopischen Welten und deren Folgen auseinandersetzen. Dieses Wissen nutze ich, um bei CADUS Simulationen und Hostile Environment Awareness Trainings zu gestalten. Ich habe einen verschlungenen Weg zurückgelegt bis ich bei der humanitären Hilfe gelandet bin, wo ich immer hin wollte. Ich weiß, dass humanitäre Hilfe und Emergency Response nicht die Antwort auf alle Fragen sind. Aber die internationale Hilfe ist für mich ein wichtiger, menschlicher Schritt und eine wertvolle Auseinandersetzung mit Privilegien, Geschichte und Betroffenheit abseits von politischen Geschicken.Dr. Corinna Schäfer Head of Support Services WeiterlesenCorinna ist Gründungsmitglied von CADUS, und hat seitdem in unterschiedlichen Positionen die verschiedenen Bereiche der Organisation mit aufgebaut. Heute leitet sie die Abteilung Support Services. Dazu gehören Communications, IT, Finanzen, Logistik und die Verwaltung der Hauptniederlassung Berlin. Corinna ist außerdem im Forschungsbereich tätig. Zur Zeit arbeitet sie an einem Projekt im Bereich der Informations- und Kommunikationstechnik. Darüber hinaus ist sie auch immer wieder als Teile eines CADUS Nothilfe-Teams im internationalen Einsatz. Florian IT Administrator WeiterlesenFlorian kümmert sich zusammen mit Uli darum, dass alle Laptops funktionieren und auf dem neusten Stand sind, ist für sämtliche Probleme in der IT ansprechbar und stets auf der Suche nach Fehlern und Optimierungen. Er arbeitet im Büro, im Makerspace und von unterwegs. Florian über seine Arbeit bei CADUS: „Ich freue mich sehr, Teil des Teams zu sein und mithelfen zu dürfen, die Technik am Laufen zu halten damit in den wichtigen Einsätzen und im Berliner Büro alles ein bisschen angenehmer ist.“Ayla Mayer Projektmanagement WeiterlesenAyla ist für das Projektmanagement der Auslandseinsätze von CADUS zuständig. In der Berliner Hauptniederlassung kümmert sie sich ausserdem um Prozessgestaltung und innere Kommunikation. Imke Schwietering Personaler:in WeiterlesenImke kümmert sich um alle Festangestellten bei CADUS. Dazu gehört die Begleitung von Einstellungsprozessen, Verträge aufsetzen, HR-relevante Policies und SOPs entwickeln, Personalentwicklung strukturieren und fördern. Lysann Kaiser Co-Geschäftsführung WeiterlesenLysann leitet CADUS zusammen mit Sebastian. ‘A boat is safe in the harbour. But this is not the purpose of a boat.‘ (P. Coehlo) Lysann über ihre Motivation, bei CADUS einzusteigen: „Unfortunately, daily news flooded with mainly negative updates. We swiftly try to assist those affected by crises and conflicts or even natural disasters. Humanitarian organizations are often in one place for a very long time. For me, working for CADUS also means going where nobody wants to go and operate. By that I mean helping affected people where the images are no longer shown in the media. I hope I can contribute on that matter and help to ship CADUS safe and sound in that direction. I grew up in Thuringia, where I also completed a nurse training programme in a rural hospital and was drawn to Berlin, where I studied Medical Education and later International Health at Charité. After several years of working in Berlin, I found my passion to work in the humanitarian sector. For over seven years, I worked with MSF and ICRC in various war and conflict zones and with a big humanitarian need. Since August 2023 I am working for and with CADUS as a Co-Chair.“ Matthew ‚Mat‘ Nelms Projektmanager Ukraine WeiterlesenMat unterstützt die tägliche Verwaltung und treibt laufenden Projekte voran. Einer seiner Schwerpunkte ist das Schreiben von Projektanträgen und MEAL. Vor CADUS hat Mat im Bereich internationale Entwicklung gearbeitet. Nach der Arbeit engagiert er sich für Organisationen, die gegen die wohnungspolitische Notlage und Gentrifizierungskrise in Berlin kämpfen. Dr. Matthias Grott Vorstand WeiterlesenMatthias Grott ist Mitglied des Vorstandes und seit der Gründung des Vereins im Jahr 2014 bei CADUS ehrenamtlich aktiv. Nach seinem Zivildienst als Rettungssanitäter studierte er Physik und erforscht nun die Planeten unseres Sonnensystems. Bei CADUS gestaltet er im Rahmen der Vorstandsarbeit gemeinsam mit den Vorstandsmitgliedern und den Mitgliedern der Geschäftsführung die strategische Entwicklung der Organisation. Über sein Engagement sagt Matthias: „Ich freue mich, bei CADUS einen Beitrag zu einer gerechteren und humaneren Gesellschaft leisten zu können. Wir helfen Menschen in akuten Notlagen, schaffen nachhaltige Perspektiven und bemühen uns gemeinsam um eine gerechtere Welt.“ Sebastian Jünemann Co-Geschäftsführung WeiterlesenSebastian hat 2014 CADUS gegründet. Seitdem leitet er die Organisation, mit einem besonderen Fokus auf den Bereich Emergency Response. Sebastian hat Biologie, Pädagogik und Organisationspsychologie studiert, aber sein Herz schlug immer schon primär für die Notfallmedizin. Er war seit 1999 regelmäßig in der humanitären Hilfe für diverse Organisationen im Einsatz und hat neben seinen Studiengängen durchgehend in leitender Funktion im Rettungsdienst gearbeitet. 2014 gab er die Initialzündung zur Gründung von CADUS. Simon Strutwolf Öffentlichkeitsarbeit WeiterlesenSimon ist Teil des PR-Teams, speziell für den Bereich Social Media und Öffentlichkeitsarbeit. Von der sozialen Arbeit und dem Aufbau eines Siebdruck-Kollektivs bis hin zur Beteiligung an verschiedenen Kultur- und Veranstaltungsprojekten in der Berliner Subkultur, als aktiver Teil eines kollektiven Kneipenbetriebs bis hin zum Engagement in selbstorganisierten Strukturen – das sind die Erfahrungen, die Simon schließlich zu CADUS und in die humanitäre Nothilfe führten. Sophie Wolf Öffentlichkeitsarbeit WeiterlesenSophie ist Teil des PR-Teams, speziell für den Bereich Campaigning und Fundraising. Ihr Know-how im Bereich Kommunikation hat sie in verschiedenen Agenturnetzwerken als Creative Director gesammelt. Neben ihrer Arbeit bei CADUS ist sie außerdem als freiberufliche Kreative tätig. „Empathie ist der wichtigste Aspekt in der Kommunikation, den man nutzen und fördern sollte.“ Kira Crewing & Volunteer Management WeiterlesenKira unterstützt unser Team im Bereich Crewing und Volunteer-Management. Tankred Beume Head of Emergency Response WeiterlesenTankred hält CADUS für neue Einsätze bereit und arbeitet ständig daran, unsere ‚readiness‘ noch zu verbessern. Er ist bei uns außerdem der Ansprechpartner des WHO EMT Netzwerks. Tankred hat alle aktuellen Katastrophen und Krisen genau im Blick und evaluiert unsere Möglichkeiten der Hilfeleistung. Dabei muss er auch einen guten Überblick über unsere eigenen Kapazitäten behalten.Wie ist Tankred zu CADUS gekommen? „Nach einer Ausbildung und Arbeit im Rettungsdienst und Berufsfeuerwehr habe ich den sicheren Arbeitsplatz verlassen um ein Studium in der Not- und Katastrophenhilfe zu absolvieren und dann in der humanitären Hilfe meinen Beruf und Berufung zu finden. Zum Glück hat’s geklappt. Der internationale Austausch mit Organisationen und Menschen die von überall kommen um an besonderen Orten zu helfen hat für mich über die Jahre viele Bekanntschaften und Freundschaften geformt.“ Jonas Grünwald Communications, WASH, Administratives WeiterlesenJonas hat vielseitige Aufgaben bei CADUS: Als Teil des Communications-Teams macht er die Hintergründe, Schwierigkeiten, und Erfolge unserer Projekte transparent und bringt die Anliegen der von Krisen und Katastrophen Betroffenen an die Öffentlichkeit. Im Bereich WASH ist der Biologe verantwortlich für alle Projektbereiche rund um (Trink-)Wasser und Hygiene. Darüber hinaus hält Jonas den Laden am Laufen, indem er administrative Aufgaben des Vereins übernimmt. Über die Ziele seiner Arbeit sagt Jonas: „Besonders wichtig ist mir eine dauerhafte Veränderung der gesellschaftlichen Verhältnisse, die zu Krieg, Ausbeutung und Unterdrückung führen und welche Rolle humanitäre Hilfe dabei spielen kann.“ Finanz-Team Buchhaltung & Controlling WeiterlesenUnser Finanz-Team besteht derzeit aus vier Personen. Sie kümmern sich um Abrechnungen, haben die Übersicht über unsere Konten und erstellen den Jahresabschluss. Anna-Lea Training & Education WeiterlesenAnna-Lea koordiniert den Bereich Training und Education bei CADUS. Als Sozialarbeiterin und systemische Beraterin bringt sie umfassende Erfahrungen aus der Anti-Gewaltarbeit und feministischen Projekten in die Gestaltung der Programme ein. Nach langem Engagement als Volunteer bei CADUS, unter anderem bei den Hostile Environment Awareness Trainings (HEAT), widmet sie sich nun ganz der humanitären Hilfe. Zu ihrer Motivation sagt sie: „Die Zukunft macht mir wenig Hoffnung, aber Aufgeben ist keine Option. Wer, wenn nicht wir, können hier noch etwas bewirken? Das Privileg helfen zu können, müssen wir nutzen – alles andere könnte ich mir nicht verzeihen!“Sarah Parsons Head of Mission, Ukraine WeiterlesenZusammen mit Thorsten leitet Sarah unseren Einsatz vor Ort in der Ukraine. Sarah erzählt von ihren täglichen Aufgaben: “I’m responsible for overseeing all our operations in Ukraine from an infield perspective. Day to day, I support our Medevac and Training teams in making sure they have everything they need in order to work. I make sure our programs are in line with the needs in the area that we work, meet with partner organizations so that we’re working together as best as possible, and scope out new and emerging needs that we can help to fill. I also keep an eye on the security situation and make sure our programs here have a balanced approach to risk. I conduct rapid security assessments whenever the team travels to new locations that are closer to the front line than our base of operations and work together with the back office to develop policies that help to keep our people safe. Outside from work, I climb (mediocre-ly), kayak (very poorly) and enjoy traveling and live music. Gloria Logistiker*in WeiterlesenGloria kommt aus dem Bereich der Nothilfe.Von ihrem Standort am Stadtrand von Berlin aus arbeitet Gloria mit dem Logistikteam von CADUS zusammen, um das logistische Management der Projekte der Organisation zu überwachen, einschließlich Lagerhaltung, Lieferkette, Beschaffung und Lagerplanung.Gloria unterstützt aktiv Freiwilligenteams, die im Makerspace Materialien für CADUS-Missionen vorbereiten.Gloria steht entschieden für das Prinzip „Solidarität, nicht Wohltätigkeit“ein. Ronja Heinemann Projektmanagement WeiterlesenRonja arbeitet als Projektmanagerin im Emergency Response Department. Sie ist zuständig für die EMT-Klassifikation und Ansprechpartnerin des WHO EMT Netzwerkes. Mit ihrer langjährigen Erfahrung in den Bereichen Projekt-, Prozess- und Qualitätsmanagement sorgt sie für den reibungslosen Ablauf bei CADUS. Obwohl es Ronja schon immer wichtig war einen sinnvollen Job zu haben, ist sie erst durch CADUS zur humanitären Hilfe gekommen. Ronja sagt dazu: „Endlich habe ich das Gefühl mit meiner Arbeit etwas wirklich Sinnvolles zu tun.“ Thorsten Schroer Head of Mission, Ukraine WeiterlesenZusammen mit Sarah leitet Thorsten unseren Einsatz vor Ort in der Ukraine. Er hält die Mission am Laufen, kümmert sich um das Team, und löst täglich Probleme aller Art. Sicherheit im Einsatz, die humanitäre Lage in der Ukraine und die dortige Repräsentation von CADUS sind weitere wichtige Aufgabenfelder. Thorsten ist gelernter Rettungsassistent und hat eine Fortbildung zum Entminer/Deminer absolviert. Über seine Motivation für die Arbeit sagt er: „I always have been drawn to and worked/volunteered in international assistance and humanitarian aid. With CADUS I had the chance to make it my full-time profession. I highly identify with the collaborative and open approach CADUS shows.“ Ulrich ‚Uli‘ Reichel IT Administrator WeiterlesenAls IT-Admin ermöglicht Uli allen Mitarbeitenden den Zugang zu Daten, Tools, Verbindungen und Hardware. Gleichzeitig hält er ungerwünschten Zugriff davon fern. Was Uli täglich macht beschreibt er so: „Einführen und Erklären von neuen Tools, Prozessen, Datensicherheit, Grund- und Aufbauwissen über alles, was Daten verarbeitet, eine Tastatur oder eine IP-Adresse hat. Material und Personal auf den neuesten Stand bringen. Immer zwischen Fehlersuche und Vorantreiben der Dinge. Meistens im Büro zu finden, wo ich auf einen oder mehrere Bildschirme schaue, mit Mitarbeitenden spreche und manchmal auch elektronische Geräte oder Kabel zwischen blinkenden Dingen im Makerspace ziehe.“ Konstantin Aaron PfaffProgramme Officer Weiterlesen Konstantin ist verantwortlich für die Leitung der CADUS-Strategien für Monitoring, Evaluation, Accountability, and Learning (MEAL) und Informationsmanagement (IM) für alle Programme und HQ, Unterstützung der Datenerfassung, Berichterstattung und Projektevaluierung, um die Einhaltung der Geberanforderungen zu gewährleisten und die Wirkung der Projekte zu verbessern. Er unterstützt die Entwicklung von Projekt Proposals, die Beziehungen zu den Gebern und die Koordinierung zwischen Organisationen, um die Projekte auf die Bedürfnisse der Gemeinschaft abzustimmen. Darüber hinaus bietet er administrative und technische Unterstützung an. Mit einem Hintergrund "
