full_description = "NetzwerkCorinna Schaefer2024-04-26T12:40:10+00:00 Unser NetzwerkCADUS steht für ein breites, diverses und internationales Netzwerk. Neben den vielen Ehrenamtlichen aus verschiedensten Bereichen, die sich bei uns engagieren, kooperieren wir immer wieder mit großen und kleinen Organisationen aus humanitärer Hilfe, Wissenschaft & Forschung, und gesellschaftspolitischem Engagement. Airlink CCC Chaos Computer Club e.V. Disaster Ready Heyva Sor A Kurd Médecins Sans FrontièresSea-Watch e.V. ŞÎLÊR – Crisis Responsex-hain hack+makeSTELP e.V. – supporter on site#LeaveNoOneBehindAktuelle Forschungskooperationen5G-SPRINT CADUS kooperiert mit der Technischen Hochschule Wildau und dem Frauenhofer-Institut für Offene Kommunikationssysteme FOKUS im Projekt 5G-SPRINT. Ziel ist die Schaffung einer fliegenden 5G-Funkzelle. Hiermit soll ein lokales, nomadisches Funknetz realisiert werden, das kurzfristig für die humanitäre Nothilfe verfügbar und variabel einsetzbar ist, und schnell an sich verändernde Einsatzbedingungen angepasst werden kann."
