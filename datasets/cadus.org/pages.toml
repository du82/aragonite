full_description = "Ausbildungadmin2024-12-18T09:38:40+00:00 Trainings und Schulungen*Unser Ausbildungsbereich und diese Seite werden gerade umgestaltet.* CADUS engagiert sich vielfältig im Ausbildungsbereich. Unsere (zukünftigen) Einsatzkräfte, können sich bei uns fortbilden und spezifisches Fachwissen aneignen. International bieten wir in Krisengebieten Trainings an, damit Zivilbevölkerung und medizinische Kräfte optimal auf akute Notsituationen selbstbestimmt und aus eigenen Kräften reagieren können. Wie wir unsere Trainings im Einsatz umsetzen kannst du am Beispiel der Ukraine in unserem Blog lesen. Zum Blogbeitrag"
