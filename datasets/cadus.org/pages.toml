["https://www.cadus.org/unsere-arbeit/makerspace"]
title = "Makerspace - cadus.org"
description = "Die technische Speicherung oder der Zugang ist unbedingt erforderlich für den rechtmäßigen Zweck, die Nutzung eines bestimmten Dienstes zu ermöglichen, der vom Teilnehmer oder Nutzer ausdrücklich gewünscht wird, oder für den alleinigen Zweck, die Übertragung einer Nachricht über ein elektronisches Kommunikationsnetz durchzuführen."
full_description = "Makerspaceadmin2024-01-15T16:32:06+00:00 Crisis Response MakerspaceEin Makerspace für die humanitäre HilfeDer CADUS Crisis Response Makerspace in Berlin ist der erste humanitäre Makerspace in Deutschland. Er wird zur Einsatzplanung und -vorbereitung, sowie zur Durchführung jeglicher einsatzunterstützender Arbeiten im technischen und medizinischen Bereich genutzt. So haben wir in der jüngeren Vergangenheit mit großem ehrenamtlichem Engagement Fahrzeuge wie die Primary Health Care Unit und die Mobile Intensive Care Unit zur Unterstützung des Gesundheitswesens in der Ostukraine ausgestattet. Und auch für unsere eigenen Einsatz-Teams bauen und reparieren wir notwendiges Equipment. Anderen (humanitären) Organisationen stellen wir den Makerspace für ihre Projekte zur Verfügung und fördern so die Kooperation innerhalb der humanitären Welt. Diese Kooperationen machen einen wichtigen Teil unserer Vision aus. Der CADUS Crisis Response Makerspace vernetzt sich mit anderen Makerspaces in unseren Einsatzländern und weltweit, und ermöglicht Zusammenarbeit über Grenzen hinweg. Makerspace – was ist das eigentlich?Ein Makerspace ist ein Ort, der das Prinzip Co-Working aufgreift und es vom Büro in die Werkstatt trägt. Makerspaces sind offene Werkstätten, in denen Menschen verschiedener fachlicher Hintergründe zusammenkommen, um Ideen und Wissen zu teilen, sowie um gemeinsam an Projekten zu arbeiten. Makerspaces leben den Do-It-Yourself-Gedanken und zeichnen sich dadurch aus, dass sie den “Makern“ eine Vielzahl von Werkzeugen, Maschinen und Technik zur Verwirklichung der eigenen Projekte zur Verfügung stellen und den Umgang damit unterstützen. So wird der Zugang zu moderner Fertigungstechnik ermöglicht und die Kooperationen verschiedenster Menschen gefördert. Der CADUS Crisis Response Makerspace greift das Konzept Makerspace auf und denkt es weiter. Da CADUS sich der humanitären Hilfe verschreibt, ist auch unser Makerspace diesem Gedanken verpflichtet und unterstützt die Verwirklichung unserer Nothilfeprojekte. In unseren Räumen direkt an der Spree finden sich klassisches Handwerk und moderne Technologie zusammen. Es gibt Bereiche für Holz- und Metallverarbeitung, eine Ecke für Elektronikarbeiten und die digitale Komponente wird durch eine CNC-Fräse, 3D Druck und Laser-Cutting abgedeckt. Außerdem bietet der Makerspace Veranstaltungstechnik, die Konferenzen, Lehrveranstaltungen oder einfach geselliges Beisammensein ermöglicht. StartseiteWas wir tunMakerspaceAktuelle Projekte Crisis Response MakerspaceMobile Makerspace für die UkraineMakerspace macht Makerspace: wir haben einen mobile Makerspace auf Basis einen Transporters gebaut und im Mai 2022 auf den Weg in die Ukraine gebracht. Zusammen mit mehreren ukrainischen und deutschen Partnerorganisationen haben wir uns am Wiederaufbau in der Ukraine beteiligt – mitten im Krieg. Aktuell arbeiten wir daran, die rollende Werkstatt wieder in den Einsatz zu schicken. Mehr erfahrenMobile Intensive Care Unit – MICUAus einem alten Reisenbus haben wir eine rollende Intensivstation gebaut und in der Ukraine in den Einsatz gebracht. Die MICU ermöglicht den Transport mehrerer Patient:innen in kritischem Zustand, auch wenn in einer Krisensituation nur wenige der benötigten Mediziner:innen und Fahrer:innen zu Verfügung stehen. Mehr erfahrenMobile Primary Health Care – PHCEinen alten Allrad-LKW haben wir ausgebaut zu einer rollenden Arztpraxis. Mit dieser versorgt nun eine ukrainische Organisation die Menschen im Osten des Kriegsgebiets. Dank Solaranlage und durchdachter Stromplanung an Bord ist das Fahrzeug während der Behandlung der Patient:innen autark. Mehr erfahrenAbgeschlossene Projekte Crisis Response MakerspaceDusch-LKW für die BalkanrouteFür den WASH-Bereich (Wasser, Sanitär und Hygiene) haben wir den Dusch-LKW entwickelt und an eine Organisation übergeben, die ihn für die Versorgung von Menschen auf der Flucht an Europas Außengrenzen einsetzt. Mobile Klinik für BosnienIm Winter 2018 fand im Makerspace ein weiterer Umbau statt: in Rekordzeit verwandelten viele helfende Hände einen Transporter und einen Pickup in eine mobile Klinik und brachten sie auf den Weg nach Bosnien-Herzegowina. In Sarajevo haben wir damit vier Monate lang Menschen auf der Flucht medizinisch versorgt. Mobile Hospital für Nordost-Syrien und IrakSchon früh engagierte sich CADUS in Nordost-Syrien und traf dabei auf eine dynamische Kriegssituation mit schnell wechselnden Frontverläufen. Aufgrund dieser Erfahrung planten und bauten wir ein mobiles Krankenhaus mit dessen Hilfe wir 2017 in Mossul/Irak zahlreiche Menschenleben retten konnten. Das Mobile Hospital haben wir schließlich an unsere Partnerorganisation in Nordost-Syrien übergeben."
