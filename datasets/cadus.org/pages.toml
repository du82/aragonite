full_description = "Unterstützenadmin2025-01-28T19:40:27+00:00 Zusammen können wir etwas bewegen!Engagiere dich ehrenamtlich Ob Mitanpacken im Berliner Crisis Response Makerspace oder Teilnehmen an den Einsätzen – bei CADUS gibt es viele Möglichkeiten, aktiv zu werden. Du brauchst nicht immer Vorerfahrung: Für einige Bereiche bieten wir Fortbildungen an, damit du gut vorbereitet bist. Mehr Infos findest du hier. Supporte unsere Kampagnen auf Social Media Unterstütze unsere Einsätze, indem du unsere Kampagnen mit deiner Community teilst. Klicke auf die Kampagnen, um zum Download zu gelangen. Love Solidarity Kampagne Infomaterial Ob Flyer, Sticker oder Poster – verteile unser Infomaterial. Einfach an info@cadus.org schreiben und Material anfragen. Du kannst auch Flyer selbst drucken. Hier kommst du zu unserem Download-Bereich mit PDFs und hilfreichen Tipps. Bring unsere Botschaft auf die Straße Bei unserem Partnershop Black Mosquito findest du Soli-Merch. Mit dem Kauf von Soli Shirts, Postern & Co supportest du uns auf mehrfache Weise und teilst mit der Welt, dass wir eine gemeinsame solidarische Vision haben. Spende! Ob Geschenkspende oder Dauerspende – wir freuen uns über jede Spendenart und Spendenhöhe! So hilfst du uns dabei, stets einsatzbereit zu sein und um unsere Einsätze fortzuführen. Starte jetzt gleich deine eigene Spendenaktion für CADUS! Abonniere jetzt unseren Newsletter!Bleibe informiert über unsere Einsätze, Veranstaltungen und Themen aus der Humanitären Nothilfe. E-Mail* Ich stimme der Verarbeitung meiner persönlichen Daten (eMail) zu *Ich stimme dem Empfang des Newsletters zu *Anmelden"
