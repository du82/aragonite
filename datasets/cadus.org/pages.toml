full_description = "Interview: Als Ärztin in der Ukraine Gallerie Interview: Als Ärztin in der Ukraine blog, Ukraine Interview: Als Ärztin in der Ukraine Seit mehr als einem Jahr arbeitet Oksana als Ärztin für uns in der Ukraine. Im Kurzinterview gibt die gebürtige Ukrainerin uns einen Einblick in ihre täglichen Erfahrungen. Von Infield Team|2025-02-25T16:19:06+00:00Februar 25th, 2025| Weiterlesen Drei Jahre Ukraine-Krieg – drei Jahre Nothilfe Gallerie Drei Jahre Ukraine-Krieg – drei Jahre Nothilfe blog, Ukraine Drei Jahre Ukraine-Krieg – drei Jahre Nothilfe Auf den Tag genau drei Jahre ist es her, dass Russland die Ukraine angegriffen hat. 11 Jahre seit der Besetzung der Krim. Für die Menschen in der Ukraine bedeutet das unter widrigsten Bedingungen ihr Leben gestalten zu müssen, trotz Tot und Zerstörung. Seit drei Jahren unterstützen wir die Menschen in der Ukraine dabei. Ein Beitrag unseres Teams in der Ukraine: Von Lara Solty|2025-03-04T10:58:14+00:00Februar 24th, 2025| Weiterlesen Verhärtete Fronten – CADUS Jahresrückblick 2024 Gallerie Verhärtete Fronten – CADUS Jahresrückblick 2024 blog, CADUS, EMT, Gaza, Jahresrückblick, Syrien, Ukraine Verhärtete Fronten – CADUS Jahresrückblick 2024 Das Jahr 2024 war für uns gleich in dreifacher Hinsicht besonders: wir feierten unser 10jähriges Jubiläum, starteten in unseren bisher herausforderndsten Einsatz und haben uns nach einigen arbeitsreichen Jahren endlich als Emergency Medical Team klassifiziert. Aber der Reihe nach. Von Jonas Gruenwald|2025-01-20T11:50:06+00:00Januar 15th, 2025| Weiterlesen CADUS beim 38c3 – Berichte aus dem Feld und ein ganz besonderes Arbeitsamt Gallerie CADUS beim 38c3 – Berichte aus dem Feld und ein ganz besonderes Arbeitsamt blog, CADUS, Netzwerk CADUS beim 38c3 – Berichte aus dem Feld und ein ganz besonderes Arbeitsamt Zum Abschluss des Jahres 2024 haben wir uns noch einmal richtig ins Zeug gelegt: Auf dem Chaos Communication Congress 38C3 gab es mehrere Vorträge von CADUS und eine recht ung