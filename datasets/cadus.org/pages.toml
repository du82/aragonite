title = "Jetzt Spenden - cadus.org"
description = "Die technische Speicherung oder der Zugang ist unbedingt erforderlich für den rechtmäßigen Zweck, die Nutzung eines bestimmten Dienstes zu ermöglichen, der vom Teilnehmer oder Nutzer ausdrücklich gewünscht wird, oder für den alleinigen Zweck, die Übertragung einer Nachricht über ein elektronisches Kommunikationsnetz durchzuführen."
full_description = "Jetzt Spendenadmin2025-02-21T13:32:37+00:00 CADUS braucht deine Unterstützung Spende für Nothilfe!CADUS handelt bedingungslos humanitär. In Krisen, Kriegen und Katastrophen helfen wir vor Ort, Menschenleben zu retten, Leid zu lindern, und neues Leid zu verhindern. Mit deiner Spende können wir schnell und flexibel auf Notlagen reagieren und unsere solidarische Hilfe langfristig planen. Jetzt spenden! Bitte Javascript aktivierenDas kann deine Spende bewirken: 10 Euro: Versorgung einer kleinen Brandwunde. 30 Euro: Wasserdesinfektions- und Konservierungs-tabletten, um 200 Liter sauberes Trinkwasser zu erhalten, wenn Trinkwasser knapp ist. 50 Euro: Eine Wunde säubern und nähen, Verabreichung von Antibiotika gegen die Entzündung der Wunde. 100 Euro: 4qm reparierte Dachfläche nach Kriegsschaden, repariert durch unser Mobile Makerspace Team. 150 Euro: Ein komplettes Individual First Aid Kit für unsere Teammitglieder. Denn im Kriegsgebiet ist auch die eigene Sicherheit essenziell, um anderen Hilfe leisten zu können. 300 Euro: Drei Stunden medizinisches Training für lokale Ersthelfer*innen in von Krisen betroffenen Gebieten. 500 Euro: Medizinische Evakuierung von kritisch kranken Patient*innen per CADUS Rettungswagen in das nächste funktionstüchtige Krankenhaus. Per Direkt-Überweisung spenden: IBAN: DE55 1009 0000 2533 5240 04 BIC: BEVODEBBXXX Kreditinstitut: Volksbank Berlin Kontoinhaber: CADUS e.V. Falls du über 300 € spendest und dafür eine Bescheinigung brauchst, schreibe deinen Namen und Anschrift am besten direkt in den Verwendungszweck. Spendenbescheinigung CADUS e.V. ist beim Finanzamt als gemeinnützige Organisation anerkannt und von der Körperschaftsteuer befreit. Daher kannst Du Spenden an uns von der Steuer absetzen. Lege deiner Steuererklärung einfach die von uns ausgestellte Spendenbescheinigung bei. Für Spenden ab einem Betrag von 300,00 € werden Spendenbescheinigungen im 1. Quartal des Folgejahres versendet. Dafür benötigen wir Deine vollständige Anschrift. Als Nachweis für Spenden bis zu 300,00 € wird der Einzahlungsbeleg der Überweisung vom Finanzamt allgemein anerkannt. Beifügen kannst du unseren vereinfachten Zuwendungsnachweis. Zur Schonung unserer administrativen Kosten bitten wir Dich, in diesen Fällen von der Anforderung einer separaten Spendenbescheinigung abzusehen. Du hast noch Fragen zu CADUS? Weiter unten findest du unser FAQ zu Spendenquittungen oder schreibe eine Email an spenden@cadus.org. Häufige Fragen zu Spendenquittungen Kann ich meine Spendenbescheinigung auch nur per E-Mail als PDF erhalten? Leider nein! Wir sind rechtlich dazu verpflichtet, eine Spendenbescheinigung auf postalischen Weg zu schicken. Per Email können wir ledigilch einen Scan verschicken – zeitgleich mit der postalischen Zusendung. Wieso habe ich noch keine Spendenquittung erhalten? Wir versenden automatisch im 1. Quartal des Folgejahres eine Spendenbescheinigung über alle von Dir im Kalenderjahr getätigten Spenden. Ich habe über betterplace.org gespendet. Erhalte ich dafür auch eine Spendenquittung? Wenn du über betterplace.org gespendet hast, erhältst du auch von betterplace.org auch deine Spendenbescheinigung – wir können dir leider keine Spendenbescheinigung ausstellen. Noch Fragen? Wenn du Fragen zu CADUS hast, wende dich gerne an spenden@cadus.org. Deine Ansprechpartnerin ist Sophie. Wie kann ich CADUS noch unterstützen?Starte eine Spendenaktion! Ob Weihnachtsfeier in der Firma, Geburstagsparty oder Spendenlauf – starte deine eigene Spendenaktion, um CADUS zu unterstützen. Hier findest du mehr Infos. Spenden sind ein tolles Geschenk. Du bist auf der Suche nach einem Geschenk mit Herz und Verstand? Mit deiner Geschenkspende tragen du und die beschenkte Person dazu bei, Menschenleben zu retten und weitere Not zu verhindern. Hier findest mehr dazu."
