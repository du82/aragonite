full_description = "Presseadmin2025-01-27T13:48:38+00:00 Für die Presse – aus der PresseWir freuen uns immer über Interesse an unserer Arbeit, und natürlich auch von Journalist:innen. Gerne stellen wir unsere Projekte vor und vermitteln Interview-Partner:innen. Weiteres Material wie Fotos und Infobroschüren stellen wir auf Anfrage zur Verfügung. Unter Umständen ist es auch möglich, unsere Arbeit direkt vor Ort im Einsatz journalistisch zu begleiten. Da wir häufig in aktiven Konflikt-Gebieten arbeiten, können wir das nicht immer ermöglichen. Aber wir freuen uns auch hier über entsprechende Anfragen, und prüfen ob ein Besuch beim Team im Feld möglich ist. Anfragen bitte an: presse[at]cadus.org Infomaterialien unter Ressourcen Presse-Berichte24.01.25Berliner Hilfsorganisation im Gazastreifen „Wir bleiben in Gaza, solange wir gebraucht werden“rbb24 03.10.2024Im Niemandsland: Wie Gaza systematisch zerstört wurdeStern 24.09.2024Gaza: »Die hygienischen Umstände sind katastrophal«nd 03.09.2024Krieg in Nahost – Wie Patrick in Gaza hilftDeutschlandfunk Nova 28.08.2024„Das ist eine menschengemachte Katastrophe“fluter 22.08.2024«Es gibt keinen sicheren Platz»WOZ Die Wochenzeitung 19.08.2024„Die Triage muss hier viel, viel härter durchgeführt werden“Südwest Presse 16.08.2024Patrick Münz (Hilfsorganisation Cadus) zur aktuellen humanitären Situation im GazastreifenPhoenix auf Youtube oder ARD Mediathek 25.07.2024Hilfsorganisation Cadus: Humanitäre Hilfe in Gaza eingeschränktRBB 24 Inforadio 02.06.2024Notfallhilfe bei Erdbeben-Szenario im Ahrtal – Übung mit ÜberraschungenSWR 02.06.2024Medizinische Versorgung während einer Katastrophe: Großübung für Einsatzkräfte im AhrtalRhein-Zeitung 20.05.2024Fairfax nurse recalls horror, heartbreak of mission in GazaMarin Independent Journal 16.05.2024‘Kill Zones’, Body Bags and Starvation: Gaza aid Workers on The Devastating Reality of Life in the World’s Most Dangerous PlaceByline Times 15.05.2024I have worked in the world’s most dangerous combat zones. Never have I felt as unsafe as I did in GazaThe Guardian 07.05.2024Angst in Rafah: „Jeder weiß, dass etwas passieren wird“Stern 25.04.2024„Im Norden Gazas versteht man, was es heißt, wenn Menschen verhungern“Zeit Online 17.04.2024Weltspiegel extra: Aktuelle Lage in GazaARD Weltspiegel16.04.2024Emergency Medical Teams in Gaza: Saving lives and preserving healthWorld Health Organization Berliner Hilfsorganisation in GazaRadioeins 14.04.2024Gaza: Freiwillige üben für medizinischen Nothilfe-Einsatzrbb24 11.04.2024Health workers back from Gaza: we’ve never seen so many dead childrenKALW 06.04.2024Their colleagues are dead but these aid workers refuse to leave GazaThe Times 05.04.2024Arzt in Gaza: „Auch wir haben rote Linien“Evangelische Zeitung Berliner Gaza-Helfer nach Angriff: Dachten, dass wir „einen bestimmten Schutz haben“Berliner Zeitung 04.04.2024Rettung aus Gaza: Wenn Helfen lebensgefährlich istMonitor Gaza-Helfer: Situation „nicht in Worte zu fassen“Deutsche Welle03.04.2024Nach Israels Luftschlag gegen NGO: Hilfslieferungen nach Gaza vorerst gestopptDeutsche Welle Israelischer Angriff auf Hilfskonvoi nur eine „Fehlidentifikation“? Deutscher Missionsleiter hat ZweifelStern 21.03.2024Freiwillige retten im Krisengebiet MenschenlebenDeutschlandfunk Nova 17.03.2024Severely injured patients trapped in Gaza’s hospitals as evacuations are haltedThe Guardian Evacuation standstill leaves critically injured stranded in Gaza hospitalsArab News 14.03.202430-Jähriger aus Schifferstadt rettet Menschenleben im GazastreifenMannheimer Morgen 12.03.2024Ein Ort, an dem nur noch das Leid wächstAugsburger Allgemeine 10.03.2024Fairfax nurse to provide medical aid in GazaMarin Independent Journal 08.03.2024„Es braucht nicht viel, bis die Stimmung in Rafah kippt“FAZ 06.03.2024Hungersnot in Gaza: Können Spenden aus Deutschland helfen?Stern 04.03.2024Medizinische Hilfe im GazastreifenZDF Morgenmagazin 01.03.2024Deutscher Kriegssanitäter in Rafah: „Wir sind de facto eingesperrt“Stern „Wir sind permanent im Einsatz“ZDF Mittagsmagazin 28.02.2024Aid in Gaza: A month on, did the ICJ make any difference?Stories of our times 27.02.2024Rettungssanitäter in Gaza: „Viele Menschen müssten nicht sterben“Badische Zeitung 26.02.2024Helfer über Lage in Rafah: „Die Menschen können nirgendwo hin“Salzburger Nachrichten 25.02.2024Mit Notärzten im Gaza-EinsatzARD Weltspiegel 22.02.2024Berliner Helfer nach Gaza-Einsatz: „Viele sterben, die nicht sterben müssten“Berliner Zeitung 21.02.2024Erst der Hunger, dann die InfekteTAZ 15.02.2024Experte: In Rafah gibt es bereits eine humanitäre KatastropheNDR Info RadioBerliner Helfer im Gazastreifen: „Manche wollen lieber sterben, als so weiterzuleben“Spiegel online Israels mögliche Bodenoffensive in RafahTagesspiegel Drohender Angriff auf RafahSpiegel online / AFP Auf schmalem Grat zwischen Krieg und FriedenRheinische Post / AFP 13.02.2024Notfallsanitäter über chaotische Lage in Rafah: „Unfassbare Masse an Menschen“ProsiebenDeutscher Helfer in RafahntvSebastian Jünemann live aus Rafah, GazaRTL11.02.2024Evakuierungen: „Niemand hat einen Plan“heute journal04.02.2024Humanitäre Hilfe: Von Berlin bis nach Gaza. Die Hilfsorganisation Cadus leistet Unterstützung in PalästinaND01.2024How to Tolocar. Playbook for Mobile MakerspacesDeutsche Gesellschaft für Internationale Zusammenarbeit (GIZ) GmbH: Tolocar Playbook S. 64-67 Aktuelle PressemitteilungenNothilfe-Einsatz in Gaza: Berliner Organisation entsendet Team 29.01.2024 Die Berliner humanitäre Nothilfe-Organisation CADUS entsendet Anfang Februar ein medizinisches Team nach Gaza. CADUS wird damit das erste deutsche Emergency Medical Team (EMT) im Gaza-Streifen sein. CADUS-Gründer und CEO Sebastian Jünemann erklärt: „Dies ist bisher der komplizierteste Einsatz unserer Organisation. Logistische Herausforderungen und die angespannte Sicherheitslage gehen einher mit der besonders schweren humanitären Krise im Gaza-Streifen.“ Humanitäre Krise in Gaza Durch den militärischen Einsatz Israels in Gaza, als Antwort auf die Terroranschläge vom 07. Oktober, sind bisher über 25.000 Menschen gestorben und mehr als 63.000 Menschen verletzt worden. Laut Informationen der Weltgesundheitsorganisation (WHO) mangelt es flächendeckend neben der medizinischen Versorgung auch an Wasser, Lebensmitteln, Treibstoff, Unterkünften und Kommunikationsmitteln. Medizinische Hilfe trotz Ungewissheit Diese Umstände bringen nicht nur die Menschen in Gaza in eine Notlage, sondern erschweren zusätzlich internationale Hilfe. „Trotz aller intensiven Vorbereitungen wissen wir nicht mit Gewissheit, was uns vor Ort erwarten wird. Aber wir sind uns sicher, dringend benötigte medizinische Hilfe in Gaza leisten zu können.“, erläutert Tankred Beume, Leiter der Emergency Response bei CADUS. Der Einsatz findet im Auftrag der WHO und im Rahmen der WHO-Emergency-Medical-Team (EMT)-Struktur statt. Von den Folgen der Haushaltssperre sind auch mögliche Geldgeber für diese Mission betroffen. Daher finanziert CADUS den Einsatz aus den letzten Reserven der Organisation und ruft zu Spenden auf. Über CADUS Die unabhängige und gemeinnützige Organisation wurde 2014 gegründet. CADUS war jahrelang in Nordost-Syrien und weiteren Gebieten im Einsatz. Derzeit ist die Organisation vor allem in der Ukraine aktiv. Ihre Tätigkeiten dort umfassen medizinische Evakuierungen und Trainings für medizinisches Fachpersonal. Im CADUS Crisis Response Makerspace stattet die Organisation ihre Einsatzfahrzeuge aus und entwickelt Equipment für die internationale Not- und Katastrophenhilfe. Alle Pressemitteilungen"
