full_description = "Einsatzgebiet Iraqadmin2023-12-08T01:13:34+00:00 Einsatzgebiet IraqDas Engagement von CADUS im Irak begann relativ spontan: eigentlich sollte Anfang 2017 das in Berlin fertiggestellte Mobile Hospital die Grenze nach Nordost-Syrien überqueren, kam dort aber nicht weiter. Gleichzeitig tobte in Mossul der Befreiungskampf gegen den sogenannten Islamischen Staat (IS). Die WHO wurde auf unsere mobile medizinische Versorgung aufmerksam und bat uns, dort nahe der Front mit einem Trauma Stabilization Point (TSP) zu unterstützen. In einem verlassenen Gebäude hat das CADUS Team schnell die medizinische Notversorgung eingerichtet und alles darangesetzt, auch in unmittelbarer Nähe des Kampfgeschehens die Menschen zu stabilisieren, so dass sie den Transport in das nächste Krankenhaus überstehen. Nach Mossul folgten weitere TSP-Einsätze im Irak, bis Anfang 2018 endlich das Mobile Hospital unserer Partnerorganisation, dem Kurdischen Roten Halbmond, in Nordost-Syrien übergeben werden konnte. CADUS Mobile Hospital in Mosul, 2017. Photo: Ruben NeugebauerAls Cross-Border Organization in Nordost-Syrien führte uns unser Weg in den nächsten Jahren immer wieder durch die Kurdische Region des Irak (KR-I). In Erbil bauten wir unser Regionalbüro auf, und gingen immer wieder Kooperationen in der Region ein. So führten wir mehrere Klinik-Partnerschaften in Mossul und Erste-Hilfe Schulungen für Ambulanz-Fahrer:innen in Duhok im Jahr 2022 durch."
