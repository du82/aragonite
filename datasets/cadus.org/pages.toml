["https://www.cadus.org/wie-wir-arbeiten"]
title = "Wie wir arbeiten - cadus.org"
description = "Die technische Speicherung oder der Zugang ist unbedingt erforderlich für den rechtmäßigen Zweck, die Nutzung eines bestimmten Dienstes zu ermöglichen, der vom Teilnehmer oder Nutzer ausdrücklich gewünscht wird, oder für den alleinigen Zweck, die Übertragung einer Nachricht über ein elektronisches Kommunikationsnetz durchzuführen."
full_description = "Wie wir arbeitenadmin2024-11-20T12:16:15+00:00 Wie wir ArbeitenCADUS e.V. ist ein beim Amtsgericht Charlottenburg eingetragener gemeinnütziger und unabhängiger Verein, gegründet im Sommer 2014. Offiziell vertreten wird der Verein durch die drei Vorstände: Dr. Matthias Grott, Anna Sauerwein und Astrid Barrera. Mit der Geschäftsführung hat der Vorstand Sebastian Jünemann und Lysann Kaiser beauftragt. Der Hauptsitz der Organisation befindet sich in Berlin/Deutschland. In der Ukraine haben wir eine Zweigniederlassung. In der Vergangenheit verfügte CADUS bereits über Zweigstellen in Erbil/Irak und in Hassakeh/Nordost-Syrien. Die Satzung und der CADUS Code of Conduct bilden den Rahmen der Aktivitäten des Vereins. Darüber hinaus hat CADUS den Code of Conduct for the International Red Cross and Red Crescent Movement and NGOs in Disaster Relief unterzeichnet und ist den international anerkannten Humanitären Prinzipien verpflichtet. Als Teil der EMT-Struktur der WHO ist CADUS den dort definierten Mindest-Standards für medizinische Einsatz-Teams verpflichtet. Die Tätigkeit des Vereins stützt sich auf Hauptamtliche und Ehrenamtliche gleichermaßen. Ein breites Netzwerk aus verschiedenen Gewerken, die Kreativität und kritisches Denken miteinander vereinen, hat CADUS zu dem gemacht was es heute ist: eine außergewöhnliche humanitäre Nothilfe-Organisation, die in ihrem Makerspace innovative Lösungen und Konzepte entwickelt, und gleichzeitig humanitäre Einsätze in hochkomplexen Krisen durchführt. Mobile Makerspace construction UKR 2022CADUS OrganigrammVier Felder des Engagements von CADUSNothilfeCADUS leistet medizinische und technische Unterstützung bei Krisen, Konflikten und Katastrophen. Unsere Unterstützung ist bedarfsorientiert, unsere Einsatzkonzepte sind mobil und modular. Zu den bisherigen, aktuellen und zukünftigen Einsatzgebieten gehören Migrations- und Fluchtrouten, Camps, Seenotrettung, aktive Konfliktgebiete, Pandemien und Naturkatastrophen. Wir wahren die humanitären Grundsätze. Wenn wir Verstöße gegen diese Grundsätze oder die Verweigerung grundlegender Menschenrechte beobachten, arbeiten wir daran, diese transparent zu machen. Wo immer möglich, unterstützen wir die Betroffenen und konfrontieren die Verantwortlichen. InnovationCADUS entwickelt wirksame Konzepte zur Bewältigung neuer humanitärer Herausforderungen. Im Zentrum steht dabei unser Crisis Response Makerspace in Berlin. Wir arbeiten mit Forschungseinrichtungen, Entwickler:innen und anderen Organisationen in Deutschland und international zusammen. Wir lieben interdisziplinäre Arbeit und verbinden unsere Einsatzerfahrung mit Wissenschaft und Handwerk. Eigene Entwicklungen werden dokumentiert und veröffentlicht. Wir nutzen und unterstützen Open-Source-Tools und sind bestrebt, unser Wissen und unsere Fertigkeiten weiterzugeben. KooperationCADUS arbeitet, wo immer möglich, mit lokalen Partner:innen zusammen. Wir setzen auf die Einbindung regionaler Ressourcen, Kapazitäten und vorhandenem Wissen, und bemühen uns um die Stärkung der Strukturen vor Ort. Die Adressat:innen unserer humanitären Arbeit werden nach Möglichkeit in alle Phasen der Projektgestaltung und -durchführung einbezogen. Wir sind ein verlässlicher Partner bei Vereinbarungen und planen nachhaltige Exit-Strategien. Durch Schulungen vor Ort und die Bereitstellung von Lehrmaterial und Ressourcen tragen wir zum Aufbau lokaler Kapazitäten bei. Außerdem bauen wir Ressourcen auf und teilen sie mit anderen Organisationen: Ausrüstung, Lager- und Transportkapazitäten, Wissen und Fähigkeiten. InformationWir recherchieren und betreiben gezielte Öffentlichkeitsarbeit. Wir organisieren Vorträge, Workshops, Diskussionsveranstaltungen und tragen zu wissenschaftlichen Publikationen bei. Im Rahmen unseres kritischen Ansatzes setzen wir uns mit dem humanitären Bereich und unserer eigenen Rolle auseinander und thematisieren so die politischen und gesellschaftlichen Auswirkungen der humanitären Hilfe. Bei der Planung und Durchführung von Projekten berücksichtigen wir den jeweiligen Kontext."
year_published = 2023
year_updated = 2024
