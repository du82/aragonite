full_description = "Einsatzgebiet Polenadmin2023-11-20T18:12:32+00:00 Einsatzgebiet PolenKurzeinsatz an der polnisch-belarussischen Grenze Übersicht:Zwischen Weihnachten und Neujahr unterstützten wir die örtliche Initiative Grupa Granica mit Sachspenden und einem kleinen Support-Team. Projektverlauf:Bereits einige Wochen vor dem Einsatz war CADUS mit Grupa Granica in Kontakt, um den Bedarf für spezifische medizinische und kommunikationstechnische Ausrüstung zu ermitteln. Während der Weihnachtsfeiertage brauchte die Gruppe nicht nur materielle Unterstützung sondern auch medizinisches Fachpersonal. Ein Ärztin und eine weitere CADUS-Mitarbeiterin machten sich auf den Weg an die Grenze, um die lokale Initiative dort zu unterstützen. Unsere Ärztin begleitete bei Alamierung das örtliche Unterstützungs-Netzwerk, um Geflüchtete medizinisch zu versorgen, die sich dort im Wald verstecken und versuchten, über die Grenze zu kommen. Kälte und Perspektivlosigkeit setzten den Menschen dort sehr schwer zu."
