full_description = "Einsatzgebiet Gazaadmin2024-05-12T11:09:00+00:00 Einsatzgebiet GazaZeitraum: seit Februar 2024 CADUS ist mit einem medizinischen Team vor Ort in Gaza. Der Einsatz wird von der WHO EMT-Struktur koordiniert. Wir sind das erste deutsche Emergency Medical Team das in der gegenwärtigen humanitären Katastrophe in Gaza hilft. Anfänglich haben wir das European Hospital medizinisch unterstützt. Doch schon bald haben wir unseren Arbeitsschwerpunkt in einen Trauma Stabilization Point (TSP). Dort arbeiten wir Seite an Seite mit dem lokalen Team in der Notversorgung von Schwerverletzten und Erkrankten. Im Auftrag der WHO führen wir außerdem medizinische Evakuierungen (MEDEVAC) vom Norden Gazas in den Süden durch. Die Presse hat vielfach über unseren Einsatz berichtet. Unsere Ärztin Verena berichtet aus dem European Hospital in Gaza. Latest NewsView all Interview: Als Ärztin in der Ukraine Drei Jahre Ukraine-Krieg – drei Jahre Nothilfe Verhärtete Fronten – CADUS Jahresrückblick 2024"
