full_description = "Spendenaktion startenCadusPR2024-11-05T08:42:37+00:00 Starte deine Online Spendenaktion für CADUS!Unterstütze unsere humanitären Einsätze mit einer Online Spendenaktion und lass Dich von Deinem Freundeskreis, von Deiner Familie und Deinem Netzwerk unterstützen! Ob zum Geburtstag, zur Firmenfeier oder zur Hochzeit – Anlässe gibt es hierfür viele. Hier startest du deine Online Spendenaktion. Dann einfach Foto hochladen und Deine Aktion mit ein paar Worten beschreiben. Das Wichtigste: Teile Deine Aktion mit Deinen Freund*innen, Deiner Familie und Deinen Kolleg*innen! Im Namen der CADUS Einsatz Teams: Vielen Dank für Dein großes Engagement! Bitte Javascript aktivieren"
