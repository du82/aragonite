full_description = "Geschenkspendeadmin2024-11-05T08:43:48+00:00 Mit Schenken Gutes tun!CADUS e.V. leistet seit über 10 Jahren humanitäre Nothilfe in Kriegs- und Krisengebieten. Wir arbeiten dort, wo Hilfe dringend benötigt wird. Deine Geschenkspende hilft dabei, Menschenleben zu retten, Leid zu lindern und weitere Not zu verhindern. Wie das geht? Ganz einfach: 1. Spendenformular auswählen und Wunschbetrag eintragen. 2. Klicke auf „Ich möchte meine Spende verschenken“ und Du erhältst Deine Spendenurkunde per E-Mail. 3. Verschenke deine Spende & tue Gutes! Bitte Javascript aktivieren Du willst CADUS noch mehr unterstützen?Wie wäre es, wenn du zum nächsten Geburtstag oder zur nächsten Firmenfeier eine Online Spendenaktion startest? Wie einfach das geht, erfährst Du hier. Mit einer regelmäßigen Spende können wir schnell und flexibel auf Notfälle reagieren und unsere Hilfe langfristig planen. Schon wenn du uns jeden Monat 5 Euro spendest, ist das ein wichtiger Beitrag."
