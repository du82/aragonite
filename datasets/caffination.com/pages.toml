["https://www.caffination.com/food-n-coffee/coffee-travels-bristol-pa-calm-waters-coffee-roasters-10268"]
title = "Coffee travels : Bristol PA, Calm Waters Coffee Roasters ⋆ The CaffiNation"
description = "Tucked away on Mill St in Bristol PA is Calm Waters coffee roaster. A lovely little cafe that serves their own roasted coffee. The roaster is off site but near by. I stopped in with my family to sample some of their faire. The shop was nice and clean, the staff was friendly and the coffee tasty. Not much more you can ask for. As is my usual go to I had a cold brew and an espresso. I also sampled a pastry, a coffee cake. My wife and daughter had a vanilla cold brew as well. My wife is not a hardcore coffee drinker, she likes sweet things and her beverage was great. She said she usually has to add sweetener to coffee when we visit these little ships but the blend they used for the cold brew was mild and not bitter in any way. Very palatable and enjoyable. There are only 3 flavored syrup options available but I drink my coffee black. And they had vanilla so my wife and daughter were happy My cold brew was very mellow with subtle earthy tones, hints of chocolate and stone fruit. Not bitter at all, smooth mouth feel and […]"
full_description = "Coffee travels : Bristol PA, Calm Waters Coffee Roasters by Paul Muller | Food n Coffee | 0 comments Tucked away on Mill St in Bristol PA is Calm Waters coffee roaster. A lovely little cafe that serves their own roasted coffee. The roaster is off site but near by. I stopped in with my family to sample some of their faire. The shop was nice and clean, the staff was friendly and the coffee tasty. Not much more you can ask for. As is my usual go to I had a cold brew and an espresso. I also sampled a pastry, a coffee cake. My wife and daughter had a vanilla cold brew as well. My wife is not a hardcore coffee drinker, she likes sweet things and her beverage was great. She said she usually has to add sweetener to coffee when we visit these little ships but the blend they used for the cold brew was mild and not bitter in any way. Very palatable and enjoyable. There are only 3 flavored syrup options available but I drink my coffee black. And they had vanilla so my wife and daughter were happy My cold brew was very mellow with subtle earthy tones, hints of chocolate and stone fruit. Not bitter at all, smooth mouth feel and a light acidity. Very pleasant and tasty. I think you can find a lot about a place by drinking their espresso. The blend was nice and bright with hints of cherry and brown sugar with a slight sweetness to it. The coffee shines and not the roast. I bought some coffee to sample at home and I’ll let you know how that turns out. If you find yourself in Bristol you would do well to stop in and try some of their offerings. Highly recommended. Share:Click to share on Facebook (Opens in new window)Click to share on Reddit (Opens in new window)Click to share on Twitter (Opens in new window)Click to share on Tumblr (Opens in new window)Click to share on Pinterest (Opens in new window)Click to share on Pocket (Opens in new window)MoreClick to print (Opens in new window)Click to email a link to a friend (Opens in new window)Click to share on Linked