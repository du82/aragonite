title = "Coffee Burger ⋆ The CaffiNation"
description = "Here is the simple recipe for the Coffee Burger Complete with a Photo walk through at the bottom of the page Ingredients: (Why some recipes make this item hard to find I’ll never understand) 1 lb of Lean Ground Beef, or Turkey 1 Can of French Onion Soup Breadcrumbs (I chose Italian Style) Ground Coffee, does not have to be high quality Salt Black Pepper Chili Pepper Garlic, Power or Minced Grill or Cast Iron Griddle tin foil or wax paper Trying to keep down on the editorial content and just make this a straight recipe is hard! *For every one pound of ground meat you use you need one can of french onion soup. 1.) Mix the soup and the meat until they are nice and loose. the meat should practically float in the soup concentrate. make sure there are no lumps or wads of onion or beef. 2.) Add about a quarter of a teaspoon of salt, pepper to taste and the garlic. I use a teaspoon of minced for 1 pound of meat, i use a quarter of a teaspoon of powder for the same size recipe. 3.) Slowly add the breadcrumbs to thicken the burger up […]"
full_description = "Coffee Burger Here is the simple recipe for the Coffee Burger Complete with a Photo walk through at the bottom of the page Ingredients: (Why some recipes make this item hard to find I’ll never understand) 1 lb of Lean Ground Beef, or Turkey 1 Can of French Onion Soup Breadcrumbs (I chose Italian Style) Ground Coffee, does not have to be high quality Salt Black Pepper Chili Pepper Garlic, Power or Minced Grill or Cast Iron Griddle tin foil or wax paper Trying to keep down on the editorial content and just make this a straight recipe is hard! *For every one pound of ground meat you use you need one can of french onion soup. 1.) Mix the soup and the meat until they are nice and loose. the meat should practically float in the soup concentrate. make sure there are no lumps or wads of onion or beef. 2.) Add about a quarter of a teaspoon of salt, pepper to taste and the garlic. I use a teaspoon of minced for 1 pound of meat, i use a quarter of a teaspoon of powder for the same size recipe. 3.) Slowly add the breadcrumbs to thicken the burger up you want them still very wet but firm enough to hold a patty shape. The patties when formed, or to test the consistency you can roll a meatball should be tacky enough to pull at your fingers without being sticky enough to pull apart. 4.) Form patties roughly the same size as each other and place them on aluminum foil or wax paper to keep them separate. burgers this moist will start to stick together so give them room to breath.for the burgers that will be getting the royal coffee treatment leave them slightly more moist then the standard patties 5.) Spread about a half of a cup of coffee grounds onto a sheet of tinfoil or wax paper. Mix in chili pepper to taste. I like to spread the coffee grounds around nice and evenly so that there are no clumps when you lay the burger down into the mix 6.) Gently place burger onto mixture, carefully flip and then roll along the edges making sure for complete coverage. 6a.) While you’re making the patties start heating you griddle. Preheat the cast iron slowly only adding the nonstick spray just before you drop the burgers on it. Why non stick spray on a cast iron griddle? Aren’t they already non stick? Well when you have a crust on your food, with tiny pieces they burn quicker without the spray. If they burn then you food smells and tastes a bit like charcoal, even if the burger itself was fine. 6b.) If you’re going to use a grill, which i heavily recommend then be sure to clean the grill itself or the burgers will stick. Don’t scratch the grate, just brush it clear of old burned food. high heat for 5 minutes in a burn off, medium to low heat to cook 7.) Place burger onto griddle cooking on medium for about 5 minutes, Then Flip and cover. Burger should be firm to the touch when done to medium. Covering allows for the burger to cook evenly. 8.) Flip once more onto the first cooked side and place cheese on the burger cover and let cook on low heat for 1 minute until Cheese is melted, provolone works very good. the cheese in the picture is low fat American… not the best pairing but it got the job done. Server with fries and love! Enjoy Flickr Set is a Step by Step Picture journey Share:Click to share on Facebook (Opens in new window)Click to share on Reddit (Opens in new window)Click to share on Twitter (Opens in new window)Click to share on Tumblr (Opens in new window)Click to share on Pinterest (Opens in new window)Click to share on Pocket (Opens in new window)MoreClick to print (Opens in new window)Click to email a link to a friend (Opens in new window)Click to share on LinkedIn (Opens in new window)Like this:Like Loading..."
