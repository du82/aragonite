title = "Coffee flavored Doritos ⋆ The CaffiNation"
description = "Flavors from around the world can seem odd. Flavors of various products here may seem odd to other countries but we can all get behind an interesting flavor debuting somewhere. Enter coffee flavored Doritos. I’ve had coffee encrusted steak and hamburgers but a chip? Sadly it’s only available in Australia. But maybe a bag could find it’s way to my doorstep. That would be awesome.  I love a savory take on coffee maybe slightly salty. But this seems just crazy enough to work. I only hope it’s not latte flavored so many coffee flavored things have cream and sugar in them too approximate a flavored beverage. I like coffee flavored coffee. Give me single origin chips, artisanal flavor combinations"
