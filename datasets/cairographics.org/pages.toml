full_description = '''The following cairo-related mailing lists are available. Everyone is free to subscribe or read the archives of all mailing lists. Note: As a spam-prevention measure, posts to these mailing lists are only accepted from subscribers. So you will have to subscribe to a list before you can post to it. After subscribing you may disable delivery of messages if desired, (while still being "subscribed" to allow continued posting). We sincerely apologize for any inconvenience this may cause. Name Description Subscription Archives cairo@cairographics.org General discussion, (API debate, porting efforts, usage questions, etc.). This list is currently the primary resource for learning about cairo and making contributions. Subscribe to cairo cairo archives cairo-announce@cairographics.org Moderated, low-traffic list for announcements (i.e., new cairo snapshots or releases). Subscribe to cairo-announce cairo-announce archives cairo-commit@cairographics.org Automated git commit messages of every change to the code of cairo and related packages. Fairly high-traffic and only interesting for people who don't mind seeing the ugly guts of software. Subscribe to cairo-commit cairo-commit archives cairo-bugs@cairographics.org Automated messages of every change to any bug in the freedesktop bugzilla for cairo and related components. Fairly high-traffic and only interesting for people who don't mind seeing the ugly guts of software. Subscribe to cairo-bugs cairo-bugs archives'''
