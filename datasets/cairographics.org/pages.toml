["https://cairographics.org/news/cairo-1.18.2"]
title = "cairo-1.18.2"
full_description = '''A new cairo release 1.18.2 is now available from: https://cairographics.org/releases/cairo-1.18.2.tar.xz which can be verified with: https://cairographics.org/releases/cairo-1.18.2.tar.xz.sha256sum a62b9bb42425e844cc3d6ddde043ff39dbabedd1542eba57a2eb79f85889d45a *cairo-1.18.2.tar.xz https://cairographics.org/releases/cairo-1.18.2.tar.xz.sha256sum.asc (signed by Emmanuele Bassi) Additionally, a git clone of the source tree: git clone https://gitlab.freedesktop.org/cairo/cairo.git will include a signed 1.18.2 tag which points to a commit named: 200441e6855854eb4dbf338e44d67b00ababe07f which can be verified with: git verify-tag 1.18.2 and can be checked out with a command such as: git switch -C build 1.18.2 Release 1.18.2 (2024-09-01 Emmanuele Bassi ) ============================================================== A new stable release. The malloc-stats code has been removed from the tests directory [#640]; the canonical location for it is: https://github.com/behdad/malloc-stats Cairo now requires a version of pixman equal to, or newer than, 0.40. [!522] There have been multiple build fixes for newer versions of GCC [!525, !542]; for MSVC [#808]; for Solaris [!540]; and on macOS 10.7 [#810]. PNG errors caused by loading malformed data are correctly propagated to callers, so they can handle the case. [!524] Both stroke and fill colors are now set when showing glyphs on a PDF surface. [#813] All the font options are copied when creating a fallback font object. [#819] When drawing text on macOS, Cairo now tries harder to select the appropriate font name. [#811] Cairo now prefers the COLRv1 table inside a font, if one is available. [!537] Cairo requires a C11 toolchain when building. [!479] Full changes since 1.18.0 ========================= Adrian Johnson (70): Merge branch 'msvc-alloca-fix' into 'master' Fix surface type mismatch error in pdf-interchange Require pixman >= 0.40 Merge branch 'fix-tags-incorrect-surface' into 'master' Merge branch 'pdf-userfont-stroke' into 'master' Merge branch 'font-options' into 'master' Merge branch 'surface-error-png' into 'master' Merge branch 'prefer-colrv1-table' into 'master' Merge branch 'ft-font-accuracy-new' into 'master' Fix implicit conversion warning Merge branch '838-confidential-issue' into 'master' Update CI to Fedora 40 Allow links to specify 'dest' and 'uri' Merge branch 'build-svg-fuzzer' into 'master' Merge branch 'dest-and-uri' into 'master' pdf tags: Fix crash when popping the top most group following by a show_text Fix crash if font error in recording surface Merge branch 'update-to-fedora-40' into 'master' Only use PIXMAN_r8g8b8_sRGB if available Create _cairo_calloc() macro to replace calloc() cff: Don't try allocating a zero sized array pdf: return subset status and always cleanup Require C11 Merge branch 'c11' into 'master' Merge branch 'pdf-finish' into 'master' Update meson wraps Merge branch 'update-meson-wraps' into 'master' Merge branch 'cff-global-subs-fix' into 'master' Update minimum FreeType to 2.10 ft: replace deprecated FT_Get_X11_Font_Format() Merge branch 'update-freetype' into 'master' Update required fontconfig version Update required libpng version Use intptr_t for cairo_atomic_intptr_t Enable pdf-structure test Add support for C11 atomics Merge branch 'pdf-structure-test' into 'master' Merge branch 'update-fontconfig-and-libpng' into 'master' Merge branch 'c11-atomics' into 'master' Fix meson deprecation warning meson: Use cc.has_define instead of cc.get_define for variables that may be undefined Merge branch 'meson-fixes' into 'master' Set CLOEXEC when opening files Merge branch 'cloexec' into 'master' Fix cairo-ft-font.c build failure when fontconfig not available Build mingw-32 in CI with fontconfig disabled Merge branch 'ft-no-fc' into 'master' Make _cairo_calloc() consistent with _cairo_malloc() Use _cairo_calloc() to allocate structs Merge branch 'calloc' into 'master' Merge branch 'uninitialized-var' into 'master' Merge branch 'master' into 'master' Merge branch 'wip/otte/xlib-overflow' into 'master' ps: fix max form size Ensure face variables in cairo_stroker_t are initialized Make Coverity happy Fix bug in cairo-trace when writing A8 images Ensure extent_y_scale is initialized Check return value of _cairo_boxes_copy_to_clip() doc: Ensure @ in "@cairo:" is escaped when referring the the font family name Merge branch 'various-fixes' into 'master' Add clang build to CI offsetof is ANSI C Merge branch 'clang-build' into 'master' Merge branch 'bugfix/compile-without-cpp' into 'master' Fix MSYS clang build error Windows should always use win32 atomics meson: use has_define() to check if define exists Merge branch 'msys-clang-fix' into 'master' Remove README.win32 Alan Coopersmith (1): Fix alloca undefined on Solaris Behdad Esfahbod (2): [pdf] Set both fill and stroke colors in show_text_glyphs Copy font-options during creation of a fallback font Benjamin Otte (1): xlib: Enlarge array for new formats Dan Yeaw (1): Fix alloca undefined with MSVC Daniel Holbert (1): Switch to calloc in _cairo_cff_font_fallback_create Diego Pino Garcia (1): [quartz] Fix: Cairo 1.18.0 doesn't draw italic or bold text on Mac Emmanuele Bassi (12): Post-release version bump to 1.18.1 Merge branch 'master-next' into 'master' Merge branch 'remove-malloc-stats' into 'master' Merge branch 'require-pixman-0.40' into 'master' Merge branch 'alloc-size' into 'master' Merge branch 'fix-issue-811' into 'master' Merge branch 'master' into 'master' Merge branch 'fix-pixman-enum' into 'master' Merge branch 'moz-bug-1897561' into 'master' Merge branch 'moz-bug-1896173' into 'master' Apply 1 suggestion(s) to 1 file(s) Release Cairo 1.18.2 Félix Poisot (1): tests: remove gl reference images Heiko Lewin (1): Fix cairo_glyph_path() early clipping Koichi Akabe (4): Fix "out of memory" when using linear gradient Destroy used pattern coding style Merge branch 'master' into fix-gradient-scale-crash Marek Kasik (1): Prefer COLRv1 table Matthias Clasen (2): Fix a memory leak Avoid an uninitialized use Niveditha Rau (1): Update file meson.build Ryan Schmidt (1): quartz-font: Fix transposed constants Sam James (1): cairo-ps-surface: fix -Walloc-size Thomas Devoogdt (2): meson: always skip IPC_RMID_DEFERRED_RELEASE check when cross-compiling meson: only require cpp for windows Tim-Philipp Müller (7): util: remove malloc-stats ci: update windows image ci: keep meson logs in windows builds as artefacts Merge branch 'ci-artefacts' into 'master' ci: install latest Meson on windows jobs Merge branch 'ci-meson-windows' into 'master' Merge branch 'alloca' into 'master' Uli Schlachter (11): Merge branch 'kCTFontTraitColorGlyphs' into 'master' _cairo_surface_create_in_error(): Add PNG_ERROR support Merge branch 'bugfix/cross-compile' into 'master' Merge branch 'fix-warning' into 'master' Mark _cairo_debug_svg_render() cairo_public Merge branch 'fix-gradient-scale-crash' into 'master' Remove two unused files Merge branch 'remove-unused-files' into 'master' Merge branch 'master' into 'master' Merge branch 'fix_glyph_path' into 'master' Merge branch 'remove-win32-readme' into 'master' Vincent Lefevre (1): Improve accuracy of computed metrics for FT fonts'''
