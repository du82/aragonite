["https://cairographics.org/samples"]
title = "Cairo samples"
full_description = '''This page contains samples of cairo's rendered output and the code snippets used to create them. The snippets are meant to be short, and easy to understand. The original snippets were created by Øyvind Kolås for a paper submitted to GUADEC 2004. All of his original snippet code is considered to be part of the public domain. RSS Atom arc double xc = 128.0; double yc = 128.0; double radius = 100.0; double angle1 = 45.0 * (M_PI/180.0); /* angles are specified */ double angle2 = 180.0 * (M_PI/180.0); /* in radians */ cairo_set_line_width (cr, 10.0); cairo_arc (cr, xc, yc, radius, angle1, angle2); cairo_stroke (cr); /* draw helping lines */ cairo_set_source_rgba (cr, 1, 0.2, 0.2, 0.6); cairo_set_line_width (cr, 6.0); cairo_arc (cr, xc, yc, 10.0, 0, 2*M_PI); cairo_fill (cr); cairo_arc (cr, xc, yc, radius, angle1, angle1); cairo_line_to (cr, xc, yc); cairo_arc (cr, xc, yc, radius, angle2, angle2); cairo_line_to (cr, xc, yc); cairo_stroke (cr); arc negative double xc = 128.0; double yc = 128.0; double radius = 100.0; double angle1 = 45.0 * (M_PI/180.0); /* angles are specified */ double angle2 = 180.0 * (M_PI/180.0); /* in radians */ cairo_set_line_width (cr, 10.0); cairo_arc_negative (cr, xc, yc, radius, angle1, angle2); cairo_stroke (cr); /* draw helping lines */ cairo_set_source_rgba (cr, 1, 0.2, 0.2, 0.6); cairo_set_line_width (cr, 6.0); cairo_arc (cr, xc, yc, 10.0, 0, 2*M_PI); cairo_fill (cr); cairo_arc (cr, xc, yc, radius, angle1, angle1); cairo_line_to (cr, xc, yc); cairo_arc (cr, xc, yc, radius, angle2, angle2); cairo_line_to (cr, xc, yc); cairo_stroke (cr); clip cairo_arc (cr, 128.0, 128.0, 76.8, 0, 2 * M_PI); cairo_clip (cr); cairo_new_path (cr); /* current path is not consumed by cairo_clip() */ cairo_rectangle (cr, 0, 0, 256, 256); cairo_fill (cr); cairo_set_source_rgb (cr, 0, 1, 0); cairo_move_to (cr, 0, 0); cairo_line_to (cr, 256, 256); cairo_move_to (cr, 256, 0); cairo_line_to (cr, 0, 256); cairo_set_line_width (cr, 10.0); cairo_stroke (cr); clip image int w, h; cairo_surface_t *image; cairo_arc (cr, 128.0, 128.0, 76.8, 0, 2*M_PI); cairo_clip (cr); cairo_new_path (cr); /* path not consumed by clip()*/ image = cairo_image_surface_create_from_png ("data/romedalen.png"); w = cairo_image_surface_get_width (image); h = cairo_image_surface_get_height (image); cairo_scale (cr, 256.0/w, 256.0/h); cairo_set_source_surface (cr, image, 0, 0); cairo_paint (cr); cairo_surface_destroy (image); curve rectangle Unless you know what you are doing, you should probably use rounded rectangle instead. /* a custom shape that could be wrapped in a function */ double x0 = 25.6, /* parameters like cairo_rectangle */ y0 = 25.6, rect_width = 204.8, rect_height = 204.8, radius = 102.4; /* and an approximate curvature radius */ double x1,y1; x1=x0+rect_width; y1=y0+rect_height; if (!rect_width || !rect_height) return; if (rect_width/2<radius) { if (rect_height/2<radius) { cairo_move_to (cr, x0, (y0 + y1)/2); cairo_curve_to (cr, x0 ,y0, x0, y0, (x0 + x1)/2, y0); cairo_curve_to (cr, x1, y0, x1, y0, x1, (y0 + y1)/2); cairo_curve_to (cr, x1, y1, x1, y1, (x1 + x0)/2, y1); cairo_curve_to (cr, x0, y1, x0, y1, x0, (y0 + y1)/2); } else { cairo_move_to (cr, x0, y0 + radius); cairo_curve_to (cr, x0 ,y0, x0, y0, (x0 + x1)/2, y0); cairo_curve_to (cr, x1, y0, x1, y0, x1, y0 + radius); cairo_line_to (cr, x1 , y1 - radius); cairo_curve_to (cr, x1, y1, x1, y1, (x1 + x0)/2, y1); cairo_curve_to (cr, x0, y1, x0, y1, x0, y1- radius); } } else { if (rect_height/2<radius) { cairo_move_to (cr, x0, (y0 + y1)/2); cairo_curve_to (cr, x0 , y0, x0 , y0, x0 + radius, y0); cairo_line_to (cr, x1 - radius, y0); cairo_curve_to (cr, x1, y0, x1, y0, x1, (y0 + y1)/2); cairo_curve_to (cr, x1, y1, x1, y1, x1 - radius, y1); cairo_line_to (cr, x0 + radius, y1); cairo_curve_to (cr, x0, y1, x0, y1, x0, (y0 + y1)/2); } else { cairo_move_to (cr, x0, y0 + radius); cairo_curve_to (cr, x0 , y0, x0 , y0, x0 + radius, y0); cairo_line_to (cr, x1 - radius, y0); cairo_curve_to (cr, x1, y0, x1, y0, x1, y0 + radius); cairo_line_to (cr, x1 , y1 - radius); cairo_curve_to (cr, x1, y1, x1, y1, x1 - radius, y1); cairo_line_to (cr, x0 + radius, y1); cairo_curve_to (cr, x0, y1, x0, y1, x0, y1- radius); } } cairo_close_path (cr); cairo_set_source_rgb (cr, 0.5, 0.5, 1); cairo_fill_preserve (cr); cairo_set_source_rgba (cr, 0.5, 0, 0, 0.5); cairo_set_line_width (cr, 10.0); cairo_stroke (cr); curve to double x=25.6, y=128.0; double x1=102.4, y1=230.4, x2=153.6, y2=25.6, x3=230.4, y3=128.0; cairo_move_to (cr, x, y); cairo_curve_to (cr, x1, y1, x2, y2, x3, y3); cairo_set_line_width (cr, 10.0); cairo_stroke (cr); cairo_set_source_rgba (cr, 1, 0.2, 0.2, 0.6); cairo_set_line_width (cr, 6.0); cairo_move_to (cr,x,y); cairo_line_to (cr,x1,y1); cairo_move_to (cr,x2,y2); cairo_line_to (cr,x3,y3); cairo_stroke (cr); dash double dashes[] = {50.0, /* ink */ 10.0, /* skip */ 10.0, /* ink */ 10.0 /* skip*/ }; int ndash = sizeof (dashes)/sizeof(dashes[0]); double offset = -50.0; cairo_set_dash (cr, dashes, ndash, offset); cairo_set_line_width (cr, 10.0); cairo_move_to (cr, 128.0, 25.6); cairo_line_to (cr, 230.4, 230.4); cairo_rel_line_to (cr, -102.4, 0.0); cairo_curve_to (cr, 51.2, 230.4, 51.2, 128.0, 128.0, 128.0); cairo_stroke (cr); fill and stroke2 cairo_move_to (cr, 128.0, 25.6); cairo_line_to (cr, 230.4, 230.4); cairo_rel_line_to (cr, -102.4, 0.0); cairo_curve_to (cr, 51.2, 230.4, 51.2, 128.0, 128.0, 128.0); cairo_close_path (cr); cairo_move_to (cr, 64.0, 25.6); cairo_rel_line_to (cr, 51.2, 51.2); cairo_rel_line_to (cr, -51.2, 51.2); cairo_rel_line_to (cr, -51.2, -51.2); cairo_close_path (cr); cairo_set_line_width (cr, 10.0); cairo_set_source_rgb (cr, 0, 0, 1); cairo_fill_preserve (cr); cairo_set_source_rgb (cr, 0, 0, 0); cairo_stroke (cr); fill style cairo_set_line_width (cr, 6); cairo_rectangle (cr, 12, 12, 232, 70); cairo_new_sub_path (cr); cairo_arc (cr, 64, 64, 40, 0, 2*M_PI); cairo_new_sub_path (cr); cairo_arc_negative (cr, 192, 64, 40, 0, -2*M_PI); cairo_se