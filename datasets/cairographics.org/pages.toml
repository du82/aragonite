title = "cairo-1.17.8"
full_description = '''A new cairo snapshot 1.17.8 is now available from: https://cairographics.org/snapshots/cairo-1.17.8.tar.xz which can be verified with: https://cairographics.org/snapshots/cairo-1.17.8.tar.xz.sha256sum 5b10c8892d1b58d70d3f0ba5b47863a061262fa56b9dc7944161f8c8b783bc64 *cairo-1.17.8.tar.xz https://cairographics.org/snapshots/cairo-1.17.8.tar.xz.sha256sum.asc (signed by Emmanuele Bassi) Additionally, a git clone of the source tree: git clone https://gitlab.freedesktop.org/cairo/cairo.git will include a signed 1.17.8 tag which points to a commit named: c3b672634f0635af1ad0ffa8c15b34fc7c1035cf which can be verified with: git verify-tag 1.17.8 and can be checked out with a command such as: git switch -C build 1.17.8 Release 1.17.8 (2023-01-30 Emmanuele Bassi ) ============================================================== A new cairo snapshot! And it only took less than one year, this time! Many thanks to everyone who contributed to cairo, and especially to (in no particular order): - Adrian Johnson - Khaled Hosny - Behdad Esfahbod - Matthias Clasen - Uli Schlachter - Manuel Stoeckl - Fujii Hironori - Tim-Philipp Müller - Luca Bacci - Caolán McNamara - John Ralls In a continuing effort to reduce the amount of legacy code, and increase the long-term maintainability of cairo, the following backends have been removed: - GL and GLES drawing Additionally, cairo's Autotools build system has been removed; from now on, cairo will only support the Meson build system. While the end result should be identical, further testing is appreciated. In this snapshot, cairo gained support for rendering COLRv1 fonts, and rendering SVG and COLRv1 fonts with custom palettes. Support for macOS and Windows has been improved, with lots of build and bug fixes. Lots of safety issues have been fixed, with array bounds checking and plugging memory leaks, as well as fixes for bugs identified via fuzzying. This is going to be the last snapshot of the 1.17 development cycle; we only expect minor bug fixing and improvements until the 1.18.0 release. Full changes since 1.17.6 ========================= Adrian Johnson (159): pdf: reset current operator when resetting clip pdf: reset gstate in groups Merge branch 'master' into issue-514 On vector surfaces render color glyphs in the fallback resolution Update ref images Ensure DWrite toy fonts can not fail if font name not found Fix type1-subset indexing Check font status in show_text_glyphs Add CAIRO_DEBUG_PS_NO_DATE env var to remove date from PS output Replace use of ctype functions with internal version where only ASCII chars are used cairoint.h: update some comments Dwrite: implement is_synthetic() Fix DWrite error handling DWrite: Use twin font if default font not found Allow the C++ code in dwrite-font to use the debug functions Fix scaled_glyph hash lookup on Win64 Fix Win64 compile warning Dwrite glyph_path fails when the font matrix is not a positive uniform scale DWrite: ensure all private functions are static DWrite: check 'head' table as well as 'name' when comparing fonts DWrite: Replace manual or missing ref counting with RefPtr Fix mingw warning Merge branch 'font-status' into 'master' Merge branch 'color-font-vector-surface' into 'master' Merge branch 'fix-color-glyph-clear-surface' into 'master' Fix the scaled_glyph_init color glyph logic Merge branch 'fix-color-glyph' into 'master' Merge branch 'issue-514' into 'master' Merge branch 'quartz-core-text' into 'master' Fix GL warnings Add -Werror for meson CI build Add mingw-32 and mingw-64 CI builds dwrite: Fix incorrect rendering of some SVG fonts Merge branch 'warnings' into 'master' Merge branch 'mingw-ci' into 'master' python script to view tests results Merge branch 'view-test-results' into 'master' Make it easier for cairo-test-suite to find the source dir Fix deadlock in cairo-scaled-font.c Fix deadlock in cairo-scaled-font.c Remove unused code Clamp path coordinates Update long-lines test view-test-results.py: try up to 10 ports big-trap test works autotools CI: build it faster Update huge-linear and huge-radial pdf ref images Merge branch 'try-ports' into 'master' Merge branch 'clamp-coordinates' into 'master' Merge branch 'scaled-font-deadlock' into 'master' Add color palette option Add color mode option Test color_mode option in ft-color-font test svg: Fix invalid output when image size is 0x0 Merge branch 'mutex-fix' into 'master' Merge branch 'color-option' into 'master' Merge branch 'dwrite-disable' into 'master' ft: move CAIRO_SCALED_GLYPH_INFO_METRICS into separate function user fonts: ensure snap_x/y_scale are initialized Fix ink extents of recording surfaces within recording surfaces Support SVG fonts in FT backend FT SVG color font test SVG font test using cairo logo ft-svg-render test Fuzzer FT: support COLRv0 recording surface Add some missing slim_hidden entries Merge branch 'lzw_eod_code_width' into 'master' Merge branch 'negative-version-values' into 'master' Merge branch 'bug-535' into 'master' Merge branch 'pbounds-size' into 'master' Bash completion for cairo-test-suite Merge branch 'bash-completion' into 'master' Merge branch 'lzw-compress-1-byte' into 'master' Merge branch 'ft-svg-fonts' into 'master' user-font-color test: draw glyphs again inside a group Copy completion.bash to $builddir/test Add README.meson file for meson test Merge branch 'test-readme' into 'master' Support check-def.sh in meson build Merge branch 'tests' into 'master' Move check-refs.sh into its own test Fix mingw build failure when SVG fonts enabled Fix bug in strndup implementation Fix mingw warning: "ERROR" redefined Fix leak Use _cairo_strndup where appropriate Fix user-font with foreground in group failures on image, PDF, and PS Merge branch 'foreground-color-in-group' into 'master' Remove the test ignore that was unintentionaly committed in !380 Merge branch 'undo-ignore' into 'master' Merge branch 'separate-check-refs' into 'master' Merge branch 'mingw-fixes' into 'master' COLRv1 glyph renderer Integrate COLR v1 renderer with cairo-ft-font.c Fix a couple of bugs and add a #define to enable debug Render COLRv1 to a recording surface Use cairo-ft-font.c decompose function COLRv1: Use cairo style and types Require -DDEBUG_ENABLE_COLR_V1 to enable the COLR v1 renderer Enable error log output of meson test --no-suite=slow in CI Remove autotools build Rename INSTALL.meson and README.meson Merge branch 'colr-v1' into 'master' Merge branch 'pr/Fix617' into 'master' Merge branch 'bug-566' into 'master' Merge branch 'bug-619' into 'master' Merge branch 'bug-606' into 'master' PS: Wrap embedded EPS in %%BeginDocument/%%EndDocument as required by EPS spec Merge branch 'eps' into 'master' Merge branch 'defining-windows-version-macros-in-meson-build' into 'master' README fixes We don't use HAVE_CONFIG_H anymore Add emacs modeline to CODING_STYLE Documentation fixes Add a test that demonstrates a recording surface bug when re-used on different surfaces pdf-tagged-text depends on PDF Fix shared use of recording surface with paginated targets Merge branch 'meson-and-doc-fixes' into 'master' Merge branch 'fix-shared-recording-surface' into 'master' Ensure outline font is used when CAIRO_COLOR_MODE_NO_COLOR is set colrv1: Don't use EM size when hint metrics is off colrv1: Fix palette alpha Merge branch 'colrv1-fixes' into 'master' Merge branch 'colr-foreground-alpha' into 'master' Merge branch 'optimize-paint-composite' into 'master' Merge branch 'colrv1-stack-variable' into 'master' svg-font: return SVG_FONT_ERROR on error svg-font: fix parse bug on empty tags Merge branch 'custom-color-palette-2' into 'master' Silence make-cairo-def.sh output Add test for SVG font palettes Merge branch 'fix-svg-crash' into 'master' Merge branch 'fix-clear-color-glyphs' into 'master' Merge branch 'svg-font-palette' into 'master' dwrite: use custom palette when rendering COLRv0 Add new cairo_user_scaled_font_get_foreground_source() function Update user font tests to test foreground col