full_description = "Ruby bindings for cairo are available at GitHub since 2010/08/21. Install: RubyGems For RubyGems users. % sudo gem install cairo For Windows user: % gem install cairo --platform x86-mingw32 Install: tar.gz For non-RubyGems users. The latest version is rcairo-1.10.0 % wget http://cairographics.org/releases/rcairo-X.X.X.tar.gz % tar xvzf rcairo-X.X.X.tar.gz % cd rcairo-X.X.X % ruby extconf.rb % make % sudo make install Documentation API Reference git Anonymous access: % git clone git://github.com/rcairo/rcairo.git For developers: % git clone git@github.com:rcairo/rcairo.git Features PNG saving PostScript saving PDF saving SVG saving Win32 support Quartz support recording surface support tee surface support script surface support XML surface support GL surface support all cairo API TODO Documentation in English (there is full documentation in Japanese) Format engine (table, chart, ...) QR code module Dependencies (cairo binding) cairo, cairo development files ruby, ruby header development files"
