["https://cal.com/docs/introduction/quick-start/self-hosting/docker"]
title = "Docker - Cal.com Docs"
full_description = ":root { --primary: 17 24 39; --primary-light: 214 214 214; --primary-dark: 17 24 39; --background-light: 255 255 255; --background-dark: 13 13 15; --gray-50: 243 243 244; --gray-100: 238 238 239; --gray-200: 223 223 223; --gray-300: 206 206 207; --gray-400: 159 159 159; --gray-500: 112 112 113; --gray-600: 80 80 81; --gray-700: 63 63 63; --gray-800: 37 38 38; --gray-900: 23 23 23; --gray-950: 10 10 11; }Cal.com Docs home pageSearch or ask...SupportDashboardDashboardSearch...NavigationGetting StartedDockerDevelopingSelf HostingPlatformAPI v2 ReferenceAPI v1 ReferenceGetting StartedInstallationDatabase migrationsUpgradingSSO setupDockerLicense keyDeploymentsAWSAzureElestioGCPRailwayRenderVercelAppsInstall AppsGuidesApp Store and IntegrationWhite LabelingSponsorshipGetting StartedDockerThe Docker configuration for Cal is an effort powered by people within the community. Cal.com, Inc. does not provide official support for Docker, but we will accept fixes and documentation. Use at your own risk. If you want to contribute to the Docker repository, reply here. The Docker configuration can be found in our docker repository. ​Requirements Make sure you have docker & docker compose installed on the server / system. Note: docker compose without the hyphen is now the primary method of using docker-compose, per the Docker documentation. ​Getting Started Clone calcom-docker git clone --recursive https://github.com/calcom/docker.git calcom-docker Change into the directory cd calcom-docker Update the calcom submodule git submodule update --remote --init Rename .env.example to .env and then update .env Build and start Cal.com via docker compose docker compose up --build (First Run) Open a browser to http://localhost:5555 to look at or modify the database content. a. Click on the User model to add a new user record. b. Fill out the fields (remembering to encrypt your password with BCrypt) and click Save 1 Record to create your first user. Open a browser to http://localhost:3000 and login with your just created, first user. ​Configuration ​Build-time variables These variables must be provided at the time of the docker build, and can be provided by updating the .env file. Changing these is not required for evaluation, but may be required for running in production. Currently, if you require changes to these variables, you must follow the instructions to build and publish your own image. NEXT_PUBLIC_WEBAPP_URL NEXT_PUBLIC_LICENSE_CONSENT NEXT_PUBLIC_TELEMETRY_KEY ​Important Run-time variables NEXTAUTH_SECRET ​Git Submodules This repository uses a git submodule. To update the calcom submodule, use the following command: git submodule update --remote --init For more advanced usage, please refer to the git documentation: https://git-scm.com/book/en/v2/Git-Tools-Submodules ​Troubleshooting SSL edge termination: If running behind a load balancer which handles SSL certificates, you will need to add the environmental variable NODE_TLS_REJECT_UNAUTHORIZED=0 to prevent requests from being rejected. Only do this if you know what you are doing and trust the services/load-balancers directing traffic to your service. Failed to commit changes: Invalid ‘prisma.user.create()’: Certain versions may have trouble creating a user if the field metadata is empty. Using an empty json object {} as the field value should resolve this issue. Also, the id field will autoincrement, so you may also try leaving the value of id as empty. Was this page helpful?YesNoSuggest editsRaise issueSSO setupLicense keyxgithublinkedinPowered by MintlifyOn this pageRequirementsGetting StartedConfigurationBuild-time variablesImportant Run-time variablesGit SubmodulesTroubleshooting"
