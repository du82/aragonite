full_description = ":root { --primary: 17 24 39; --primary-light: 214 214 214; --primary-dark: 17 24 39; --background-light: 255 255 255; --background-dark: 13 13 15; --gray-50: 243 243 244; --gray-100: 238 238 239; --gray-200: 223 223 223; --gray-300: 206 206 207; --gray-400: 159 159 159; --gray-500: 112 112 113; --gray-600: 80 80 81; --gray-700: 63 63 63; --gray-800: 37 38 38; --gray-900: 23 23 23; --gray-950: 10 10 11; }Cal.com Docs home pageSearch or ask...SupportDashboardDashboardSearch...NavigationGetting StartedIntroductionDevelopingSelf HostingPlatformAPI v2 ReferenceAPI v1 ReferenceGetting StartedIntroductionLocal DevelopmentOpen Source ContributionIntroductionCode stylingPull requestsContributor's GuideGuidesAPI DevelopmentApp Store and IntegrationAuth and ProvisionAutomationEmailEmbedsGetting StartedIntroduction Start developingFollow our quickstart guide to start developing with Cal.comSelf HostLearn how to self-host Cal.com for controlled instanceAPILearn how to use Cal.com’s API to CRUD various Cal resources programmatically ​Welcome to the Cal.com Documentation! This is the documentation for Cal.com, an open source scheduling platform that enables you to take bookings on your own terms. Set your availability, connect your favourite calendar and video conferencing platforms, and share your link. It’s that simple. It covers everything from setup to usage and development. Here you can explore advice and explanations for all of our features, as well as discover new tips and tricks to get the most out of the Cal.com software. This also includes the more advanced documentation covering how to build on top of Cal.com both in the codebase, by API and more. These guides will go into depth on how you can best integrate and extend Cal.com for your needs.Was this page helpful?YesNoSuggest editsRaise issueLocal DevelopmentxgithublinkedinPowered by MintlifyOn this pageWelcome to the Cal.com Documentation!"
