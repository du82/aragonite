 within an organizationOrgs / SchedulesGETGet all schedulesGETGet all schedulesPOSTCreate a scheduleGETGet a scheduleDELDelete a schedulePATCHUpdate a scheduleOrgs / TeamsGETGet all teamsPOSTCreate a teamGETGet teams membership for userGETGet a teamDELDelete a teamPATCHUpdate a teamOrgs / Teams / BookingsGETGet organization team bookingsOrgs / Teams / MembershipsGETGet all membershipsPOSTCreate a membershipGETGet a membershipDELDelete a membershipPATCHUpdate a membershipOrgs / Teams / Routing forms / ResponsesGETGet routing form responsesOrgs / Teams / SchedulesGETGet schedules of a team memberOrgs / UsersGETGet all usersPOSTCreate a userDELDelete a userPATCHUpdate a userOrgs / Users / OOOGETGet all ooo entries of a userPOSTCreate an ooo entry for userDELDelete ooo entry of a userPATCHUpdate ooo entry of a userGETGet all OOO entries of org usersOrgs / WebhooksGETGet all webhooksPOSTCreate a webhookGETGet a webhookDELDelete a webhookPATCHUpdate a webhookApi KeysPOSTRefresh API KeyBookingsGETGet all bookingsPOSTCreate a bookingGETGet a bookingPOSTReschedule a bookingPOSTCancel a bookingPOSTMark a booking absencePOSTAutomatically reassign booking to a new hostPOSTReassign a booking to a specific userPOSTConfirm booking that requires a confirmationPOSTDecline booking that requires a confirmationCalendarsPOSTSave an ICS feedGETCheck an ICS feedGETGet busy timesGETGet all calendarsGETGet oAuth connect URLGETSave an oAuth calendar credentialsPOSTSync credentialsGETCheck a calendar connectionPOSTDisconnect a calendarConferencingPOSTConnect your conferencing applicationGETGet OAuth conferencing app auth urlGETconferencing apps oauths callbackGETList your conferencing applicationsPOSTSet your default conferencing applicationGETGet your default conferencing applicationDELDisconnect your conferencing applicationDestination CalendarsPUTUpdate destination calendarsEvent TypesGETGet all event typesPOSTCreate an event typeGETGet an event typeDELDelete an event typePATCHUpdate an event typeEvent Types / WebhooksGETGet all webhooksPOSTCreate a webhookDELDelete all webhooksGETGet a webhookDELDelete a webhookPATCHUpdate a webhookMeGETGet my profilePATCHUpdate my profileOAuth ClientsGETGet v2oauth clientsPOSTPost v2oauth clientsGETGet v2oauth clients 1DELDelete v2oauth clientsPATCHPatch v2oauth clientsGETGet v2oauth clients managed usersSchedulesGETGet all schedulesPOSTCreate a scheduleGETGet default scheduleGETGet a scheduleDELDelete a schedulePATCHUpdate a scheduleSelected CalendarsPOSTAdd a selected calendarDELDelete a selected calendarSlotsGETFind out when is an event type ready to be booked.POSTReserve a slotGETGet reserved slotDELDelete v2slotsreservationsPATCHUpdated reserved a slotStripeGETGet stripe connect URLGETSave stripe credentialsGETCheck stripe connectionGETCheck team stripe connectionTeamsGETGet teamsPOSTCreate a teamGETGet a teamDELDelete a teamPATCHUpdate a teamTeams / Event TypesGETGet a team event typePOSTCreate an event typeGETGet an event typeDELDelete a team event typePATCHUpdate a team event typePOSTCreate a phone callTeams / MembershipsGETGet all membershipsPOSTCreate a membershipGETGet a membershipDELDelete a membershipPATCHCreate a membershipTimezonesGETGet all timezonesWebhooksGETGet all webooksPOSTCreate a webhookGETGet a webhookDELDelete a webhookPATCHUpdate a webhookGetting StartedIntroduction to API v2Introduction to Cal.com API v2 endpoints​Authentication The Cal.com API has 3 authentication methods: API key Platform OAuth client credentials Managed user access token If you are a platform customer you don’t need an API key and must instead use OAuth credentials or a managed user access token. We cover when to use which below. ​1. API key You can view and manage your API keys in your settings page under the security tab in Cal.com. API Keys are under Settings > Security Test mode secret keys have the prefix cal_ and live mode secret keys have the prefix cal_live_. Your API keys carry many privileges, so be sure to keep them secure! Do not share your secret API keys in publicly accessible areas such as GitHub, client-side code, and so forth. Authentication to the API is performed via the Authorization header. For example, the request would go something like: 'Authorization': 'Bearer YOUR_API_KEY' in your request header. All API requests must be made over HTTPS. Calls made over plain HTTP will fail. API requests without authentication will also fail. ​2. OAuth client credentials You need to use OAuth credentials when: Managing managed users API reference Creating OAuth client webhooks API reference Refreshing tokens of a managed user API reference Teams related endpoints: Managing organization teams API reference, adding managed users as members to teams API reference, creating team event types API reference. OAuth credentials can be accessed in the platform dashboard https://app.cal.com/settings/platform after you have created an OAuth client. Each one has an ID and secret. You then need to pass them as request headers: x-cal-client-id - ID of the OAuth client. x-cal-secret-key - secret of the OAuth client. ​3. Managed user access token After you create a managed user you will receive its access and refresh tokens. The response also includes managed user’s id, so we recommend you to add new properties to your users table calAccessToken, calRefreshToken and calManagedUserId to store this information. You need to use access token when managing managed user’s: Schedules API reference Event types API reference Bookings - some endpoints like creating a booking is public, but some like getting all managed user’s bookings require managed user’s access token API reference It is passed as an authorization bearer request header Authorization: Bearer <access-token>. Validity period: access tokens are valid for 60 minutes and refresh tokens for 1 year, and tokens can be refreshed using the refresh endpoint API reference. After refreshing you will receive the new access and refresh tokens that you have to store in your database. Recovering tokens: if you ever lose managed user’s access or refresh tokens, you can force refresh them using the OAuth client credentials and store them in your database API reference. ​Navigating endpoints Platform customers have the following endpoints available: Endpoints prefixed with “Platform”. Endpoints with no prefix e.g “Bookings”, “Event Types”. If you are at least on the ESSENTIALS plan, then all endpoints prefixed with “Orgs” except “Orgs / Attributes”. Non-platform customers have all the endpoints except the ones prefixed with “Platform”.Was this page helpful?YesNoSuggest editsRaise issueDifferences between v1 and v2xgithublinkedinPowered by MintlifyOn this pageAuthentication1. API key2. OAuth client credentials3. Managed user access tokenNavigating endpoints"
