["https://calcolomassimale.marcolabarile.me/articoli/come-testare-il-massimale"]
title = "Come Testare il Massimale"
description = "Prima di tutto, come per ogni seduta di allenamento, è consigliato iniziare con un riscaldamento generale. Lo scopo è migliorare il flusso sanguigno e aumentare la frequenza cardiaca..."
full_description = "Come testare il massimaleIntroduzioneIl massimale, o 1RM (One-Rep Max), è la quantità massima di peso che puoi sollevare in un esercizio per una singola ripetizione. Diversamente da una serie di singole alzate, richiede tutta la tua energia fisica e mentale per sollevare il peso esattamente una volta.In pratica, l'1RM è una misura della tua forza massima in un certo esercizio (es. squat, panca, stacco).1. RiscaldamentoPrima di tutto, come per ogni seduta di allenamento, è consigliato iniziare con un riscaldamento generale. Lo scopo è migliorare il flusso sanguigno e aumentare la frequenza cardiaca. Alcune opzioni: camminata veloce o corsa leggera, cyclette, vogatore o qualsiasi altra attività aerobica (cardio) che non richieda più di 10 minuti e non ti affatichi troppo.Successivamente è opportuno passare ad esercizi di mobilità: più un'area del tuo corpo è rigida, più importanti saranno gli esercizi di mobilità che la coinvolgono. Questi possono essere aspecifici ma anche specifici per l'esercizio di cui vuoi provare il massimale. Ad esempio, se stai preparando uno squat, potresti effettuare delle circonduzioni delle ginocchia, stretching dei quadricipiti, squat senza bilanciere.2. AvvicinamentoIl miglior riscaldamento per un massimale è fare lo stesso esercizio con pesi submassimali. In questo modo si iniziano ad attivare il tuo sistema nervoso, muscoli e articolazioni. Attenzione però: devi arrivare ad eseguire il massimale senza essere affaticato. Il volume totale della fase di avvicinamento deve essere basso ma allo stesso tempo devi evitare aumenti eccessivi nella successione di carichi utilizzati. Più si progredisce con i carichi, più gli incrementi devono essere piccoli.Non esiste una formula valida per tutti gli atleti. In generale c'è chi preferisce riscaldarsi con un volume basso, medio oppure alto (sempre ragionevolmente limitato).Questa tabella mostra un programma di avvicinamento che può servirti come punto di partenza:# Set1RM %RepsRiposo140%5~ 2min250%4~ 2min360%3~ 2min470%2~ 3min580%2~ 3min690%1~ 3min7100%1~ 5-15min8++2-5%1~ 5-15minQui per 100% dell'1RM si intende il massimale precedente, necessario da conoscere per la maggior parte delle programmazioni di forza. Se non hai a disposizione un massimale precedente, puoi provare a calcolarlo.3. Carichi massimaliUna volta raggiunto il precedente massimale (100% dell'1RM) bisogna procedere sempre tramite singole alzate.A questo punto ci sono delle regole fondamentali:Gli incrementi devono essere al più uguali, in pratica decrescenti. Ad esempio, se hai raggiunto il vecchio massimale di 100kg facendo salti da 5kg, il prossimo carico potrà aumentare al più di 5kg. In pratica, però, conviene diminuire ancora gli incrementi in modo da aumentare la possibilità di completare con successo una serie di PRs (Personal Records). Questo approccio ti peserà di meno anche psicologicamente in quanto sarebbe difficile riprendersi da un tentativo di massimale fallito dovuto ad un incremento incauto.Riposati per il tempo necessario. I carichi massimali pesano molto sul sistema nervoso che ha bisogno di tempo per ricaricarsi. Tipicamente le pause in questa fase dovrebbero durare dai 5 ai 15 minuti, ma ad ogni modo non dovresti passare alla prossima alzata se ti senti ancora affaticato dalla precedente.Chiedi l'aiuto di uno spotter per eseguire queste alzate impegnative in sicurezza e prevenire gravi infortuni. Inoltre, un secondo paio di occhi può darti feedback importanti utili a guidare la progressione verso il nuovo massimale.ConclusioneQuesto articolo mostra un punto di partenza per approcciarsi al test del massimale. Ogni atleta però poi sviluppa ed evolve il proprio metodo nel corso della sua carriera, che sia agonistica o amatoriale. Ti consigliamo di sperimentare un po' in ogni sessione di test in modo da capire cosa può funzionare meglio per te."
author = "Calcolo Massimale"
