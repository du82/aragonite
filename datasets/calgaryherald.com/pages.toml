title = "Parker: Architectural firm DIALOG celebrates 65th anniversary | Calgary Herald"
description = "In its 65 years, Architectural firm DIALOG has been hugely successful in shaping Calgary’s skyline and community spaces, writes David Parker"
full_description = '''Breadcrumb Trail LinksHomeBusinessLocal Business Share this Story : Parker: Architectural firm DIALOG marks 65 years of building a better Calgary Copy Link Email X Reddit Pinterest LinkedIn Tumblr Parker: Architectural firm DIALOG marks 65 years of building a better CalgaryUnder the DIALOG name, the firm has completed some exciting major projectsAuthor of the article:By David Parker • Calgary HeraldPublished Feb 27, 2025Last updated 2 days ago3 minute read Join the conversation You can save this article by registering for free here. Or sign-in if you have an account.The reimagined Glenbow Museum was designed by Calgary architectural firm DIALOG, which is celebrating its 65th year of operation in Calgary. Photo by Courtesy, DIALOG /Postmedia NetworkArticle contentMartin Cohos chose to move to Calgary from Montreal in 1958, and a couple of years later the call of the mountains attracted Michael Evamy and Philippe Delesalle from the same city. Fortunately, they found each other, and in 1960 the architects with kindred spirits founded a firm that since 2010 has been known as DIALOG.Article contentArticle contentWe apologize, but this video has failed to load.Try refreshing your browser, ortap here to see other videos from our team.Parker: Architectural firm DIALOG marks 65 years of building a better Calgary Back to video Article contentIn its 65 years it has been hugely successful in shaping Calgary’s skyline and community spaces with impactful design, creating meaningful, sustainable and inclusive places. The anniversary is a time to honour its original and current partners and shared commitment to building a thriving city, and to celebrate the projects that reimagined how Calgarians live.Article contentAdvertisement 1Story continues belowThis advertisement has not loaded yet, but your article continues below.Article contentArticle contentOne of its founding projects was being selected in 1963 to design Holy Trinity Anglican Church — since renamed Holy Cross — on 19th Street N.W. The following year it was Bishop Grandin Senior High School, and then its first introduction to health care, with the interns’ residence at Foothills Hospital in 1966.Article contentBanking Innovations Neo Financial Sponsored by Neo Financial Scroll Left Scroll RightArticle contentArticle contentNoon News RoundupYour weekday lunchtime roundup of curated links, news highlights, analysis and features.There was an error, please provide a valid email address.Sign UpBy signing up you consent to receive the above newsletter from Postmedia Network Inc.Thanks for signing up!A welcome email is on its way. If you don't see it, please check your junk folder.The next issue of Noon News Roundup will soon be in your inbox.We encountered an issue signing you up. Please try againInterested in more newsletters? Browse here.Article contentSince then, DIALOG has been recognized as a leader in that sector, thanks somewhat to the expertise of partner Jim Goodwin, who recently celebrated 50 years with the firm. He is recognized as a specialist in his field in designing institutional buildings, including hospital and related health-care facilities.Article contentArticle contentRecently, DIALOG — with Stantec — designed the Arthur J.E. Child Cancer Centre and is currently working on a major expansion to the Red Deer Regional Hospital, which includes a new patient tower and renovations to the existing building.Article contentArticle contentAs the firm grew it attracted a broad range of clients, designing buildings such as the Whyte Museum of the Canadian Rockies in Banff in 1968, Alberta College of Art in 1973, and Bankers Hall and Bankers Court built over 10 years, completed in 2009.Article contentAdvertisement 2Story continues belowThis advertisement has not loaded yet, but your article continues below.THIS CONTENT IS RESERVED FOR SUBSCRIBERS ONLYSubscribe now to read the latest news in your city and across Canada.Unlimited online access to articles from across Canada with one account.Get exclusive access to the Calgary Herald ePaper, an electronic replica of the print edition that you can share, download and comment on.Enjoy insights and behind-the-scenes analysis from our award-winning journalists.Support local journalists and the next generation of journalists.Daily puzzles including the New York Times Crossword.SUBSCRIBE TO UNLOCK MORE ARTICLESSubscribe now to read the latest news in your city and across Canada.Unlimited online access to articles from across Canada with one account.Get exclusive access to the Calgary Herald ePaper, an electronic replica of the print edition that you can share, download and comment on.Enjoy insights and behind-the-scenes analysis from our award-winning journalists.Support local journalists and the next generation of journalists.Daily puzzles including the New York Times Crossword.REGISTER / SIGN IN TO UNLOCK MORE ARTICLESCreate an account or sign in to continue with your reading experience.Access articles from across Canada with one account.Share your thoughts and join the conversation in the comments.Enjoy additional articles per month.Get email updates from your favourite authors.THIS ARTICLE IS FREE TO READ REGISTER TO UNLOCK.Create an account or sign in to continue with your reading experience.Access articles from across Canada with one accountShare your thoughts and join the conversation in the commentsEnjoy additional articles per monthGet email updates from your favourite authorsSign In or Create an AccountEmail AddressContinueor <button type="button" class="button button--icon-reverse button__social-login button__social-login--icon-left-aligned" onclick="window.location.assign('<#= Endpoint #>');"> <span class="button__text button__text--<#=Name.toLowerCase()#>"><#= (Name.toLowerCase() === 'live' ) ? 'Microsoft' : Name #></span> <span class="button__icon button__icon--<#=Name.toLowerCase()#>" aria-hidden="true"></span> </button> View more offersIf you are a Home delivery print subscriber, online access is included in your subscription. Activate your Online Access NowArticle contentArticle contentSuccess in the Calgary area meant more staff and the need for larger premises. In 2006, what was then named Cohos Evamy moved to its present location in the Customs House on 11th Avenue S.W., sharing space with the University of Calgary faculty of environmental design. As work expanded into other cities, it became associated with other architectural firms in Vancouver, Edmonton and Toronto, and in 2010 came together with five other firms with a shared vision to become DIALOG.Article contentArticle contentToday, it boasts a multidisciplinary team of 640 employees — architects, engineers, interior designers, urban planners and landscape architects — in Toronto, Edmonton, Vancouver and San Francisco, as well as the Calgary studio of 170 staff that includes 13 partners and 39 associates.Article contentArticle content“It’s been an incredible journey working alongside so many talented people and communities, shaping not just Calgary’s skyline but the way we live, connect and grow together,” Calgary studio chair Chris Lenzin says.Advertisement 1This advertisement has not loaded yet.Trending Bell: Angry Canadians lose their minds, Liberals paint Poilievre as Trump Columnists Severely injured Calgarian set to return from Mexico on medevac flight News Day 1 at the Brier: How's the Gushue-Bottcher dynamic holding up? Sports Opinion: Why did the city agree to pave over paradise? Columnists Alberta premier vows public 'repercussions' if any AHS contract wrongdoing uncovered News Advertisement 2AdvertisementThis advertisement has not loaded yet, but your article continues below.Article contentArticle content“Design has always been about people for us, Michael Evamy used to say we make ‘people places.’ As we celebrate 65 years, we look ahead — continuing to create places that bring us together, shape communities and look after the world we share.”Article contentArticle contentUnder the DIALOG name, the firm has completed some exciting major projects — along with the cancer centre — that include Decidedly Jazz Danceworks, Telus Sky with Bjarke Ingels Group, Calgary Central Library and, at the University of Calgary, the MacKimmie Complex and the Energy Environment Experiential Learning building.Article contentArticle contentThere is lots on the books today keeping the Calgary studio busy, with major works that include Scotia Place, the much-anticipated Calgary premier destination for sports, concerts and events designed with HOK; Glenbow Reimagined, a comprehensive renovation to the 1970s complex; Eau Claire Plaza, a significant public space redevelopment; and the University of Calgary Spy Hill expansion, enhancing veterinary education.Article contentAdvertisement 3Story continues belowThis advertisement has not loaded yet, but your article continues below.Article contentArticle contentLooking through the lens of its past, Lenzin says the firm remains committed to pushing boundaries, designing for impact and creating places that inspire.Article contentArticle contentNotesArticle contentArticle contentThe newly renovated Animal Health Education Centre at Olds College marked a significant milestone in advancing animal health education. It is offering students more flexibility and credentialing opportunities starting in September with three new programs: veterinary technician assistant, veterinary medical receptionist and veterinary technician. The change increases enrolment capacity while giving students from each program the opportunity to work together, fostering a collaborative learning environment across all three programs.Article contentArticle contentDavid Parker appears regularly in the Herald. Read his columns online at calgaryherald.com/business. He can be reached at 403-830-4622.Article contentArticle contentAdvertisement 2This advertisement has not loaded yet.window._taboola = window._taboola || []; _taboola.p