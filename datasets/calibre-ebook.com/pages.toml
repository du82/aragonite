["https://calibre-ebook.com/download_linux"]
title = """
calibre - 
Download for Linux"""
description = "calibre: The one stop solution for all your e-book needs. Comprehensive e-book software."
full_description = '''Download for Linux The latest release of calibre is 7.26.0. What's new. Please do not use your distribution provided calibre package, as those are often buggy/outdated. Instead use the Binary install described below. Binary install calibre has a binary install that includes private versions of all its dependencies. It runs on 64-bit Intel or ARM compatible machines. To install or upgrade, simply copy and paste the following command into a terminal and press Enter: sudo -v && wget -nv -O- https://download.calibre-ebook.com/linux-installer.sh | sudo sh /dev/stdin While you wait for the download to complete, please consider contributing to support the development of calibre. Note If you get an error about an untrusted certificate, that means your computer does not have any root certificates installed and so cannot download the installer securely. If you still want to proceed, pass the --no-check-certificate option to wget, like this: sudo -v && wget --no-check-certificate -nv -O- https://download.calibre-ebook.com/linux-installer.sh | sudo sh /dev/stdin You must have xdg-utils, wget, xz-utils and Python installed on your system before running the installer. You can uninstall calibre by running sudo calibre-uninstall. Alternately, simply deleting the installation folder will remove 99% of the installed files. If you get an error about Wayland when running calibre from the terminal and calibre does not start, run calibre as QT_QPA_PLATFORM=xcb calibre which will prevent it from using Wayland. You need GLIBC 2.34 or higher and libstdc++.so.6.0.30 (from gcc 11.4.0) or higher to run calibre If you get an error Could not load the Qt platform plugin xcb you are missing some needed X11-XCB libraries, such as libxcb-cursor0 or libxcb-xinerama0, for details see here. On servers, if you get an error about a missing libEGL, you might need to install some OpenGL packages such as libegl1 and libopengl0 You can change the folder calibre is installed into from the default (/opt) like this: sudo -v && wget -nv -O- https://download.calibre-ebook.com/linux-installer.sh | sudo sh /dev/stdin install_dir=/opt Change /opt above to whatever folder you want calibre automatically installed to. You can also do an "isolated" install that only touches files inside the installation folder and does not need to be run as root, like this: wget -nv -O- https://download.calibre-ebook.com/linux-installer.sh | sh /dev/stdin install_dir=~/calibre-bin isolated=y Reverting to a previous version You can install a previous calibre release, like this: sudo -v && sudo calibre-uninstall && wget -nv -O- https://download.calibre-ebook.com/linux-installer.sh | sudo sh /dev/stdin version=4.23.0 Change 4.23.0 above to whatever version you want installed. Manual binary install If you wish to revert to an earlier calibre release or download a calibre upgrade manually, download the tarball of that release from here (choose the 32-bit or 64-bit version, as appropriate). Assuming you want calibre in /opt/calibre, run the following command, changing the path to calibre-tarball.txz below as appropriate: sudo mkdir -p /opt/calibre && sudo rm -rf /opt/calibre/* && sudo tar xvf /path/to/downloaded/calibre-tarball.txz -C /opt/calibre && sudo /opt/calibre/calibre_postinstall Source install WARNING: calibre is a highly complex piece of software with lots of very finicky dependencies. If you install from source, you are on your own. Please do not open bug reports or expect any form of support. You have been warned. If you're still determined to install from source, read on: Make sure your system has Python 3 installed. Install the various dependencies listed below Run the following commands in a terminal: curl -L https://calibre-ebook.com/dist/src | tar xvJ cd calibre* && sudo python3 setup.py install Dependencies The up-to-date list of dependencies that the official calibre binaries are bundled with, can be seen in sources.json. While calibre might work with versions of dependencies other than those listed there, it is not tested/supported. In addition to those dependencies various build time requirements such as pkg-config, a C/C++ compiler, etc are needed.'''
