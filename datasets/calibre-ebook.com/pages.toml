["https://calibre-ebook.com/whats-new"]
title = "calibre - What's new"
description = "This allows readers of the book to listen to it with sentence tracking, even if they do not have a functioning text-to-speech system in the reading software. You can even assign different voices to different parts of the text for a more immersive experience. The tool is available from the Tools menu in the book editor."
full_description = '''What's new See what's new in calibre 7.0 Changelog Major new features Release: 7.26 [14 Feb, 2025] New features Allow specifying web search links that are used when clicking on item names in the Book details panel for custom columns via Preferences->Add your own columns Content server: When clicking on author names in the book details page perform the same action as clicking it in the calibre program's Book details panel Bug fixes Fix a regression in 7.17 that caused various minor problems with editing metadata directly in the book list Closes tickets: 2097677 Fix a regression in the previous release that broke conversion using Heuristics and TXT input documents E-book viewer: Fix header/footer text size too small when using multiple monitors and the primary monitors DPI is much less than secondary monitor DPI Closes tickets: 2097563 Fix series mapping rules in the metadata preferences not working Closes tickets: 2097947 Fix setting custom icon for category doesn't work Closes tickets: 2098133 Kobo driver: Fix a regression that broke working with very old Kobo devices Closes tickets: 2092732 Improved news sources Science Journals Barrons Release: 7.25 [07 Feb, 2025] New features Allow setting custom icons for items in the Tag browser by right clicking on them and choosing "Manage icon for this value" Kindle driver: Allow import of KFX files from 2024 Kindles that use the MTP protocol A new tweak in Preferences->Tweaks to control the East Asian language used when transliterating to English Add an option to adjust the size of the link and note icons in Book details under Preferences->Look & feel->Book details Bug fixes Nook driver: Fix the Glowlight 4 not working on Windows Closes tickets: 2068527 MTP driver: Fix Internal storage and SD card being swapped on some devices that have buggy firmware that assigns the SD card a lower id than the internal storage Template dialog: Respect the tweak for title/series when editing save to disk and send to device templates Closes tickets: 2096841 Content server: Fix icons for individual formats not being shown in the Tag browser New news sources Alternatives Economiques by Kabonix Zerodeux by Kabonix Afrique XXI by Kabonix Orient XXI by Kabonix Contretemps by Kabonix Faz.net by Anonymous Moview Web and Football League World by SpicyPoison Improved news sources spektrum.de Economist Arret sur images Le Canard Enchaine Foreign Affairs Release: 7.24 [10 Jan, 2025] New features Allow creating rules to transform series names in the Bulk metadata editor and Preferences->Metadata download Closes tickets: 2091268 Conversion: Automatically set the page progression direction for books that do not have it set and have their primary language either Arabic or Hebrew Content server: Book details view: Make calibre://show-book and calibre://view-book URLs in the comments work Edit book: Spell check: Add a button to export the currently displayed list of words as a CSV file Closes tickets: 2092496 Add from ISBN: Add a checkbox to automatically convert obsolete ISBN 10 to ISBN 13 Closes tickets: 2092483 Save single format to disk: Allow choosing the book cover as the format to save Closes tickets: 2092395 Option to show a button to access all available actions from the status bar in Preferences->Look & feel->Main interface Bug fixes Read aloud: Fix no audio produced when text contains <3 and using the Windows legacy speech engine Closes tickets: 2092948 Fix Tabbing while editing cells in the book list not always working Closes tickets: 2092643 Windows build: Also sign the portable launcher exes Fix viewing books via the Cover browser not working when in device view Closes tickets: 2092630 Improved news sources LWN Weekly Outlook India Livemint Release: 7.23 [20 Dec, 2024] New features 🎄 Happy holidays to everyone! Content server: Allow managing the data files associated with a book by clicking the three dots in the top right corner of the book's page and choosing "Manage data files" Closes tickets: 2091646 Edit metadata dialog: Allow right clicking on the cover to view it in a popup window at larger size Closes tickets: 2091216 Add an option to expand the Tag browser tree to show the item that was current when the library was closed Add import and export stored template to Preferences / template functions Various Quality-of-Life improvements to the dialog used to edit columns with fixed sets of values Resolve doi.org links when pasting identifiers Closes tickets: 2091152 Bug fixes Viewer: Fix some HTMLZ files not opening on some systems Closes tickets: 2091451 Amazon metadata plugin: Update for changed markup for some books on amazon search results page Closes tickets: 2091542 New news sources Le Canard Enchaine by Kabonix Improved news sources Economist Irish Times Popular Science ACM Queue Release: 7.22 [29 Nov, 2024] New features E-book viewer: Read Aloud: Add an option to control the position of the popup control bar. It can now be placed along the top or bottom edges so as to overlap less with text. System tray menu: Add action to restart calibre Closes tickets: 2087754 Tolino driver: Support new firmware Bug fixes Windows: Enable popup OS notifications even when system tray icon is disabled to match behavior on other platforms. Notifications can be disabled via Preferences->Look & feel->Disable notifications on job completion Fix a regression that caused incorrect English transliteration of Japanese text even when the UI language is set to Japanese Closes tickets: 2087850 macOS: Dark mode: Fix a regression that caused the scrollbar to no longer be transient Closes tickets: 2088153 DOCX Input: When some text has multiple footnotes insert a space between the consecutive foot note numbers so that they are distinct Closes tickets: 2089433 DOCX Input: Fix ToC nesting not working if the styles for the ToC levels do not use integer margins E-book viewer: Fix spurious chapter transition after configuring Read aloud PDF Input: Fix reflow of lines in files with little text not working Closes tickets: 2089436 New news sources Economist News by unkn0wn Improved news sources Economist Indian Express Economist World Ahead Frontline Infobae Release: 7.21 [08 Nov, 2024] New features Edit book: A new tool to create an audio overlay in EPUB files for all text using the Read aloud facility This allows readers of the book to listen to it with sentence tracking, even if they do not have a functioning text-to-speech system in the reading software. You can even assign different voices to different parts of the text for a more immersive experience. The tool is available from the Tools menu in the book editor. Dark mode: make scrollbar more visible with higher contrast and rounded corners E-book viewer: In flow mode when scrolling across internal file boundaries using the mouse wheel/touchpad have a short half second pause to ease the transition. Can be controlled via the Scrolling section of the Viewer preferences. ebook-meta.exe: Add an option to disallow rendered cover of first page for EPUB Book details: Add an action to download the cover to the context menu when right clicking the cover Closes tickets: 2082075 Read aloud: Add a restore defaults button to the configuration dialog Closes tickets: 2086609 Auto adding: Allow excluding arbitrary file types not just known book file types Closes tickets: 2086478 Edit metadata dialog: Add an action to open the book's folder to the context menu of the formats list Closes tickets: 2083583 Bug fixes Read aloud: Fix only first 32000 characters per chapter being read Closes tickets: 2086571 Content server: Read aloud: Fix clicking on a word to skip reading aloud to that word causing word highlighting to stop working Closes tickets: 2086661 Linux: Handle speech dispatcher with dummy output module and no voices more gracefully When renaming authors fix empty author folder not being removed if it contained file explorer metadata but was otherwise empty Edit metadata dialog: Fix keyboard shortcuts to edit prev/next raising an error when trying to go beyond the first/last book Closes tickets: 2086193 Linux: ToC Editor: Fix a regression in 7.17 that broke using the Create new entry button Closes tickets: 2085576 Content server: Fix changing the language of a book not working for non-English user interface language and for books that have no existing language Closes tickets: 2085005 Linux: Read aloud with Piper: Fix audio not playing on some Linux systems Notes browser: When searching books search over all currently selected categories not just the last selected one New news sources Unz Review and Sonar21 by unkn0wn Improved news sources Substack Live Mint NYPost Ars Technica Indian Express Reuters Release: 7.20 [18 Oct, 2024] New features PDF Input: Automatic header/footer detection and removal A new, dedicated PDF Input engine for calibre that implements automatic detection of headers and footers based on document analysis. The new engine is the default to go back to using the old engine, select it in the PDF Input section of the Conversion dialog. Read Aloud: Allow configuring an extra pause at the end of every sentence when using the Piper TTS engine Closes tickets: 2083058 PDF Output: Add _WIDTH_PIXELS_ and _HEIGHT_PIXELS_ variables to know the width and height of the header/footer area in templates Windows: Use calibre's bundled SSL certificates instead of the system certificate store by default Can be turned off via CALIBRE_USE_SYSTEM_CERTIFICATES=1 env var Trim image tool: Add a control to adjust aspect ratio Kobo driver: Add support for the new firmware used by the Tolino Shine 5 Bug fixes Fix a regression in previous release that broke copying of book to another library if the books author does not exist in the destination database Read aloud: Piper backend: Fix not working with voices whose names have non-ASCII characters on Windows. Content server: Fix book with non-ASCII filenames not downloading in the Kindle browser when using the /mobile view Content server: Fix embedding the server HTML inside a third party iframe causing an error New news sources NYT Magazine by unkn0wn RedaktionsNetzwerk Deutschland by epubli Improved news sources The Wire Nikkei Asia Magazine Swarajya Mainichi Nautilus National Geographic Science Journal Times Literary Supplement Saechsische Zeitung India Today Scientific American Release: 7.19 [27 Sep, 2024] New features E-book viewer: Halve the time taken to open large EPUB format books for the first time A four hundred thousand word EPUB book now opens in under a second on typical hardware. PDF new engine: Improve header/footer detection For column icons and grid view emblems, support icons for both light and dark themes News downloads: Mark links to locally available articles with a middle-dot When saving a layout also save the main window geometry Closes tickets: 2079784 Bug fixes Windows: Read Aloud: Fix an occasional crash when stopping read aloud when using the legacy windows TTS engine Closes tickets: 2080705 Windows: Read Aloud: Fix clicking in text to change what is being read causing tracking of currently read word to fail when using the legacy Windows TTS engine Closes tickets: 2080705 Read aloud: Fix reading large numeric words causing text synchronization to fail when using some legacy TTS engines Closes tickets: 2080708 EPUB3 metadata: Fix setting series number to zero not working Closes tickets: 2080701 Comic Input: Handle comics whose internal files have control codes in their filenames Closes tickets: 2081982 E-book viewer: Fix a regression that broke searching in Japanese books that use <ruby> text Closes tickets: 2071348 E-book viewer: Fix a regression in the previous release that broke Read aloud for selected text Closes tickets: 2080655 Amazon metadata plugin: Workaround for downloads failing because Google discontinued its webcache Cover grid: Suppress the 2px border Qt draws for the list view New news sources NYT News based on feeds by unkn0wn Improved news sources NY Times NYT Book Review Courrier International Le Monde TLS Magazine Scientific American Engadget Release: 7.18 [13 Sep, 2024] New features E-book viewer: Read aloud: A new Text-to-Speech engine (Piper) that uses a neural network for realistic sounding voices To use it access the viewer controls and click the Read aloud button or press 'Ctrl+S'. The neural network is run locally, no cloud services are used. Using the OS Text-to-Speech engine is still possible by clicking the configure button on the Read aloud control bar. Note that the new engine highlights the currently read sentence rather than word. New experimental engine to convert PDF files with support for automatic header/footer removal Closes tickets: 2076346 Turn it on via the PDF input section of the conversion dialog. Content server: Viewer: Read Aloud: Implement word-by-word tracking when reading aloud if the browser and OS used support it, for example, Chromium on Windows, Firefox on Android and Safari on macOS Image popup: Add a context menu with an option to reset the current zoom Closes tickets: 2080315 Edit metadata dialog: Show the number of data files on the data files button Bug fixes Fix a regression in the previous release that broke using Tab key to move around the book list while editing cells E-book viewer: Fix scrollbar position not updating during continuous scroll Closes tickets: 2077801 E-book viewer: Fix a harmless error when the book contains page list references whose targets do not exist Closes tickets: 2077871 Linux binary build: Fix missing libdeflate dependency Closes tickets: 2077794 New news sources Muy Interesante México by unkn0wn Salzburger Nachrichten by İlker Melik Sıtkı Computer Weekly by İlker Melik Sıtkı Improved news sources Revista Muy Interesante Ars Technica South China Morning Post Times Literary Supplement Hackernews Star Gazetesi Hurriyet Gorafi Times Online Release: 7.17 [23 Aug, 2024] New features E-book viewer: Support for jumping to and displaying paper edition page numbers If an e-book contains embedded information about the pages from the paper edition of the book, the calibre E-book viewer can now jump to a page number via the Go to button in the viewer controls. You can also optionally have the current paper edition page number displayed in the header/footer by adding "Pages from paper edition" to either the header or footer in the viewer settings. Edit book: When text is selected allow changing the indentation of all lines in the selection by pressing Tab to increase one level or Shift+Tab to decrease one level Closes tickets: 2076251 Allow a plugboard to change the series_index as well as the series name. News download: News recipes can now optionally use browser engines based on either Qt or Chromium network stacks instead of mechanize Email delivery: When sending emails to Kindles do not convert filenames to English letters as Amazon appears to have finally fixed their email servers to handle non-English filenames Quickview: Add a toolt'''
