["https://www.calligraphyqalam.com/styles/taliq"]
title = "Ta‘liq - Calligraphy Qalam"
description = "Introducing the art of Arabic, Ottoman, & Persian calligraphy"
full_description = "Ta‘liq (Pronounced “tah-leek”) < Previous style: Shikaste Next style: Tawqi‘ > Meaning “Ta‘liq” means “suspension,” or “hanging together” Uses Used for official correspondence in the royal court Used for writing books and letters Used for transcribing literary works Sometimes used for poems and calligraphy specimens Timeline Developed in the 3rd or 4th century A.D. Used until almost the end of the 13th century Kufic is mostly obsolete today because it is difficult to write any text of length. It is occasionally still used for titles of manuscripts or in architectural inscriptions Distinctive characteristics Formed in 11th century, standardized by 13th century Still in use today Notes Letters that don’t connect on the left are often connected in this script (unauthorized ligatures) Descending strokes appear as loops Letters are rounded with extreme contrasts in letter spacing Wide spaces appear between lines Lines ascend upward as they move from right to left Ta‘liq script. Freer Gallery of Art. https://asia.si.edu/object/F1929.65/ Ta‘liq script. https://www.metmuseum.org/art/collection/search/665800 Image gallery View the full ta‘liq image gallery .envira-dynamic-gallery .envira-gallery-item {padding-right:40px !important;}.envira-dynamic-gallery .envira-title, #envira-gallery-343 .envira-caption {text-align:left !important;}@media only screen and (max-width: 768px) { .envira-dynamic-gallery .envira-gallery-item { width: 100% !important; } }AllEulogy to a rulerFolio of calligraphyFolio of calligraphyLetter in Ta’liq Script<img src='https://www.calligraphyqalam.com/wordpress/wp-content/uploads/2021/07/iiif-service_amed_amedscd_2019714537_0001-full-pct_100-0-default-scaled.jpg' alt='Eulogy to a ruler' class='envira_noscript_images ' /><img src='https://www.calligraphyqalam.com/wordpress/wp-content/uploads/2021/07/FS-5705_01.jpg' alt='Folio of calligraphy' class='envira_noscript_images ' /><img src='https://www.calligraphyqalam.com/wordpress/wp-cont