full_description = "Muhaqqaq (Pronounced “moo-huk-uk”; Turkish–Muhakkak; Persian–Mohaqqaq) < Previous style: Maghribi Next style: Naskh > Meaning “Muhaqqaq” means “fully-realized,” and “strongly expressed” Uses Muhaqqaq was used throughout the Islamic world to write fine, large Qur’ans or architectural inscriptions Companion script Muhaqqaq is most often written in conjunction with rayhani, which is a smaller version of the same script. Timeline Developed in the 10th century Refined by Şeyh Hamdullah in the 15th century Yielded its place to Thuluth at the end of the 17th century Muhaqqaq is mostly obsolete today, but by tradition is still used to write the bismillah (an Islamic phrase meaning, “In the name of God, most gracious, most compassionate”) Distinctive characteristics Precise, angular script with upright letters Carefully balanced ascenders and horizontal letters Strong horizontal emphasis (wider than it is shorter) Descending strokes end in a straight, sharp points rather than turning upwards in a hook Descending round strokes often encircle the following letter Muhaqqaq script. Freer Galler of Art. https://asia.si.edu/object/F1945.18/ Muhaqqaq and thuluth scripts. Freer Galler of Art. https://asia.si.edu/object/F1930.59/ Muhaqqaq and thuluth scripts. Courtesy of the Nasser D Khalili Collection of Islamic Art. QUR 413. Muhaqqaq script. Courtesy of the Arthur M. Sackler Gallery https://asia.si.edu/object/S1998.230/ Image gallery View the full muhaqqaq image gallery .envira-dynamic-gallery .envira-gallery-item {padding-right:40px !important;}.envira-dynamic-gallery .envira-title, #envira-gallery-343 .envira-caption {text-align:left !important;}@media only screen and (max-width: 768px) { .envira-dynamic-gallery .envira-gallery-item { width: 100% !important; } }AllBaysunqur Qur’an fragmentDetached folio from a Qur’an, sura 11:61-71Folio from a Qur'an, sura 5:68-69Folio from a Qur‘an Manuscript<img src='https://www.calligraphyqalam.com/wordpress/wp-content/uplo