full_description = "Thuluth (Pronounced “thoo-looth”; Turkish–Sulus) < Previous style: Tawqi‘ Next style: Divani > Meaning “Thuluth” means “one-third.” This possibly refers to its pen size (one-third the size of the pen used for a larger script called tumar) Uses Script par excellence for writing many different kinds of texts Used particulary for titles and architectural inscriptions Companion script Thuluth is most often written in conjunction with naskh. Naskh, however, is not based on the Thuluth script, it is merely a smaller companion script Timeline Developed in the 10th century Refined by Seyh Hamdullah in the 15th century Still in use today Distinctive characteristics Vertical strokes have a leftward slant, horizontals have a deep curve The ends of most descending letters come up in a hook Often written so the letters interlace Many alternate letter forms exist in this script Notes Thuluth is often considered the most powerful and versatile script. Some experts say you are not a calligrapher until you can write thuluth. Jali thuluth script. Courtesy of the Nasser D Khalili Collection of Islamic Art. CAL 334. Thuluth, naskh and riqa’ scripts. Courtesy of the Nasser D Khalili Collection of Islamic Art. Thuluth script. Courtesy of the Nasser D Khalili Collection of Islamic Art. Thuluth and naskh scripts. Courtesy of the Nasser D Khalili Collection of Islamic Art. Image gallery View the full thuluth image gallery .envira-dynamic-gallery .envira-gallery-item {padding-right:40px !important;}.envira-dynamic-gallery .envira-title, #envira-gallery-343 .envira-caption {text-align:left !important;}@media only screen and (max-width: 768px) { .envira-dynamic-gallery .envira-gallery-item { width: 100% !important; } }AllAlbum of Calligraphies Including Poetry and Prophetic Traditions (Hadith)Album of calligraphyAlbum of calligraphyAlbum page<img src='https://www.calligraphyqalam.com/wordpress/wp-content/uploads/2021/07/DT4827-scaled.jpg' alt='Album of Calligraphies Includi