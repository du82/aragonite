["https://www.calligraphyqalam.com/styles/divani"]
title = "Divani - Calligraphy Qalam"
description = "Introducing the art of Arabic, Ottoman, & Persian calligraphy"
full_description = "Divani (pronounced “Dee-wa-nee”) < Previous style: Thuluth Next style: Kufic > Meaning “Divani” is derived from the word “divan,” the name for the Ottoman royal chancery Uses Used in the Ottoman court to write official documents, including proclamation scrolls, edicts, land and title grants, appointments, correspondence, endowments, etc. Timeline Developed in the 16th century Reached its artistic peak in the 19th century Still in use today Distinctive characteristics Wide spaces appear between lines Lines ascend upward as they move from right to left When written in large (djali or jali) form, the empty spaces in the script are filled with small dots in a veil of decorative detail Letters and words that don’t connect on the left are often connected in this script (unauthorized ligatures) Notes Divani is difficult to read and write in its large (djali or jali) form because of its extreme stylization and the number of unauthorized connections. This made Divani an ideal script for court documents, because it insured confidentiality and protected them from forgery Jali Divani composition. Work by Wissam Shawkat. Iraq/U.A.E. Image courtesy of the artist. https://www.wissamshawkat.com/ Divani script. Freer Galler of Art. https://asia.si.edu/object/F1985.16/ Divani script. The Metropolitan Museum of Art. https://www.metmuseum.org/art/collection/search/453274 Divani script. Courtesy of the Nasser D Khalili Collection of Islamic Art. Image gallery View the full divani image gallery .envira-dynamic-gallery .envira-gallery-item {padding-right:40px !important;}.envira-dynamic-gallery .envira-title, #envira-gallery-343 .envira-caption {text-align:left !important;}@media only screen and (max-width: 768px) { .envira-dynamic-gallery .envira-gallery-item { width: 100% !important; } }AllBasmala CircleCalligraphic Composition in DécoupageDivani alphabetDivani Bismillah<img src='https://www.calligraphyqalam.com/wordpress/wp-content/uploads/2021/07/Basmala_circle.jpg