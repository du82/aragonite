title = "Video Gallery - Calligraphy Qalam"
description = "Introducing the art of Arabic, Ottoman, & Persian calligraphy"
full_description = '''Video Gallery #envira-gallery-275 {}#envira-gallery-275 .envira-gallery-item {padding-right:40px !important;}#envira-gallery-275 .envira-title, #envira-gallery-275 .envira-caption {text-align:left;}@media only screen and (max-width: 768px) { #envira-gallery-275 .envira-gallery-item { width: 100% !important; } }These videos introduce the art of Arabic script calligraphy, discuss its connection with Islam, give tips on how to read calligraphy, introduce calligraphy tools, give a demo of calligraphy being written, and interview calligraphy students and teachers. PlayIntroduction to Arabic, Ottoman, & Persian CalligraphyThis video introduces the viewer to Arabic script calligraphy in the Arab, Ottoman and Persian traditions. It discusses the unique features of the Arabic alphabet, and gives an overview of the process of learning calligraphy.PlayDemonstration of Arabic script calligraphyIn this video, New York-based calligrapher Elinor Aishah Holland demonstrates how to write the "Rabi Yasir," a phrase written by beginning students of Arabic script calligraphy.PlayInterview with Elinor Aishah HollandThis video is an interview with New York-based calligrapher Elinor Aishah Holland. Ms. Holland is a teacher of calligraphy in the Latin and Arabic scripts.PlayThe Islamic Context of Arabic Script CalligraphyThis video gives an overview of how the religion of Islam has influenced the art of Arabic script calligraphy.PlayTools used for Arabic script calligraphyIn this video, New York-based calligrapher Elinor Aishah Holland gives an overview of the tools and materials needed to write Arabic script calligraphy.PlayHow to read Arabic script calligraphyIn this video New York-based calligrapher Elinor Aishah Holland and Arlington, VA-based calligrapher Mohamed Zakariya give tips on how to read Arabic script calligraphy.PlayInterview with Christopher GowIn this video, calligraphy student Christopher Gow discusses how he started studying Arabic script calligraphy, and what he likes about this art form.PlayInterview with Iqbal KhaiyIn this interview, calligraphy student Iqbal Khaiy discusses what it's like for a native Arabic speaker to begin learning Arabic script calligraphy.PlayInterview with Linda DassinThis video is an interview with calligraphy student Linda Dassin, who talks about the process of learning Arabic script calligraphy.<img src='https://www.calligraphyqalam.com/wordpress/wp-content/uploads/2021/07/1469705_1920x1080.jpeg' alt='Introduction video to Arabic, Ottoman, &amp; Persian Calligraphy' class='envira_noscript_images ' /><img src='https://www.calligraphyqalam.com/wordpress/wp-content/uploads/2021/07/4102434_1920x1080.jpeg' alt='Demonstration of Arabic script calligraphy' class='envira_noscript_images ' /><img src='https://www.calligraphyqalam.com/wordpress/wp-content/uploads/2021/07/2246052_1920x1080.jpeg' alt='Interview with Elinor Aishah Holland' class='envira_noscript_images ' /><img src='https://www.calligraphyqalam.com/wordpress/wp-content/uploads/2021/07/2246929_1920x1080.jpeg' alt='The Islamic Context of Arabic Script Calligraphy' class='envira_noscript_images ' /><img src='https://www.calligraphyqalam.com/wordpress/wp-content/uploads/2021/07/2564277_1920x1080.jpeg' alt='Tools used for Arabic script calligraphy' class='envira_noscript_images ' /><img src='https://www.calligraphyqalam.com/wordpress/wp-content/uploads/2021/07/3479604_1920x1080.jpeg' alt='How to read Arabic script calligraphy' class='envira_noscript_images ' /><img src='https://www.calligraphyqalam.com/wordpress/wp-content/uploads/2021/07/3344150_1920x1080.jpeg' alt='Interview with Christopher Gow' class='envira_noscript_images ' /><img src='https://www.calligraphyqalam.com/wordpress/wp-content/uploads/2021/07/2572486_1920x1080.jpeg' alt='Interview with Iqbal Khaiy' class='envira_noscript_images ' /><img src='https://www.calligraphyqalam.com/wordpress/wp-content/uploads/2021/07/4103787_1920x1080.jpeg' alt='Interview with Linda Dassin' class='envira_noscript_images ' />'''
