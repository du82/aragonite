full_description = "Naskh (Pronounced “nask”; Turkish–Nesih) < Previous style: Muhaqqaq Next style: Nasta‘liq > Meaning “Naskh” is derived from the verb “nasakha,” meaning “to transcribe or copy” Uses Naskh eventually replaced Kufic as the script of choice for the Qur’an; now more Qur’ans are written in Naskh than in all other scripts combined Popular for writing books because of its legibility Adapted for printing, it is still the most common font in printed Arabic Companion script Thuluth is the larger script often used in conjunction with naskh Timeline Developed in the 10th century Refined by Şeyh Hamdullah in the 15th century Still in use today Distinctive characteristics Small script, neat and balanced Letter shapes are more fluid and curved than rayhani Letters lean slightly to the left Descending letters end in an upward hook Equal division between flat and round shapes and heavy and light strokes Highly legible, clear and quick to write Notes Called the “servant of the Qur’an” because it is used so often for copying this holy book Because the letter shapes in naskh are based on different proportions than the other scripts, it is hard to learn to write naskh well Naskh script. Arthur M. Sackler Gallery. https://asia.si.edu/object/S1986.482 Naskh script. Arthur M. Sackler Gallery. https://asia.si.edu/object/S1998.228/ Naskh script. Courtesy of the Library of Congress, African and Middle Eastern Division. https://www.loc.gov/item/2019714536/ Naskh script. Arthur M. Sackler Gallery. https://asia.si.edu/object/S1998.233/ Image gallery View the full naskh image gallery .envira-dynamic-gallery .envira-gallery-item {padding-right:40px !important;}.envira-dynamic-gallery .envira-title, #envira-gallery-343 .envira-caption {text-align:left !important;}@media only screen and (max-width: 768px) { .envira-dynamic-gallery .envira-gallery-item { width: 100% !important; } }AllAlbum of Calligraphies Including Poetry and Prophetic Traditions (Hadith)Album of calligraphyAlbum 