title = "Nasta‘liq - Calligraphy Qalam"
description = "Introducing the art of Arabic, Ottoman, & Persian calligraphy"
full_description = "Nasta‘liq (Pronounced “nes-tah-leek”; called “talik” in Turkey, called “farsi” in the Arab world) < Previous style: Naskh Next style: Rayhani > Meaning “Nasta‘liq” is thought to be a hybrid of the words “naskh” and “ta‘liq” Uses Nasta‘liq was originally devised to write the Persian language Used in Persia and India/Pakistan for literary and non-Qur’anic works Used for writing Persian poetry Used for albums of calligraphic specimens, called qit‘a Timeline Developed in 15th century Iran and perfected in the 16th century in Baghdad and Tabriz Still in use today Distinctive characteristics Features characteristics of both naskh and ta‘liq Vertical strokes are short, horizontal strokes are broad and sweeping Letter shapes appear to be deep and hook-like Letter shapes vary widely in thickness Overall impression of swiftness, calm, fluidity Letters appear to “float” or “hang” across the page. This quality is increased when the text is arranged diagonally, as is common in nasta‘liq poetry Nasta‘liq is never written with vowels except an occasional hamza and shadda Notes Very difficult to execute Possibly created by Mir ‘Ali Tabrizi as a result of a dream about flying ducks Nasta‘liq script. Courtesy of the Library of Congress, African and Middle Eastern Division. https://www.loc.gov/item/2019714662/ Nasta‘liq script. Courtesy of the Library of Congress, African and Middle Eastern Division. https://www.loc.gov/item/2019714526/ Nasta‘liq script. Freer Gallery of Art. https://asia.si.edu/object/F1929.66 Nasta‘liq script. Freer Gallery of Art. https://asia.si.edu/object/F1948.28/ Nasta‘liq script. Freer Gallery of Art. https://asia.si.edu/object/F1942.18b/ Image gallery View the full nasta‘liq image gallery .envira-dynamic-gallery .envira-gallery-item {padding-right:40px !important;}.envira-dynamic-gallery .envira-title, #envira-gallery-343 .envira-caption {text-align:left !important;}@media only screen and (max-width: 768px) { .envira-dynamic-gallery .envira-gallery-item { width: 100% !important; } }AllAlbum Leaf of Shekasteh-ye Nasta‘liqAlbum Leaf with Calligraphic Exercise (siyah mashq)Album of JahangirAlbum Page with Qur’anic Verses<img src='https://www.calligraphyqalam.com/wordpress/wp-content/uploads/2021/07/DP-13133-026-scaled.jpg' alt='Album Leaf of Shekasteh-ye Nasta‘liq' class='envira_noscript_images ' /><img src='https://www.calligraphyqalam.com/wordpress/wp-content/uploads/2021/07/DP-12711-001-scaled.jpg' alt='Album Leaf with Calligraphic Exercise (siyah mashq)' class='envira_noscript_images ' /><img src='https://www.calligraphyqalam.com/wordpress/wp-content/uploads/2021/07/FS-6922_07-scaled.jpg' alt='Album of Jahangir' class='envira_noscript_images ' /><img src='https://www.calligraphyqalam.com/wordpress/wp-content/uploads/2021/07/1140_cal-0275.jpg' alt='Album Page with Qur’anic Verses' class='envira_noscript_images ' />"
