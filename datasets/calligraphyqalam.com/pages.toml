full_description = "Ruq‘ah (Pronounced “ruk-ah”; Turkish–Rik‘a; Persian–Riq‘a). Note on this name: we are using the name ruq‘ah to describe this script, in order to differentiate it from the not-related script, riqa‘) < Previous style: Riqa‘ Next style: Shikaste > Meaning “Ruq‘ah” is derived from the noun ruq’a, meaning “a patch or piece of cloth” because it was written on small scraps of paper Uses Originally devised to write Turkish for the late Ottoman bureauocracy Used broadly across the Arab and Ottoman world for personal correspondence and handwriting Timeline Developed in second half of 18th century Still in use today Distinctive characteristics A simplification of the divani script constructed from short strokes Letters are more straight than rounded Notes Easier to learn and write than other scripts. Good script for beginners. Ruq‘ah script. Image courtesy of Elisabeth Kvernen. Ruq‘ah script. “The Diwani-Jaly Diwani-Riq‘a Mashqs by M. Halim Özyazici” Ruq‘ah script. The Museum of Islamic Art. Image gallery View the full ruq‘ah image gallery .envira-dynamic-gallery .envira-gallery-item {padding-right:40px !important;}.envira-dynamic-gallery .envira-title, #envira-gallery-343 .envira-caption {text-align:left !important;}@media only screen and (max-width: 768px) { .envira-dynamic-gallery .envira-gallery-item { width: 100% !important; } }AllruqahRuq‘ah scriptRuq’ah alphabetRuq’ah composition<img src='https://www.calligraphyqalam.com/wordpress/wp-content/uploads/2021/07/ruqah.jpg' alt='' class='envira_noscript_images ' /><img src='https://www.calligraphyqalam.com/wordpress/wp-content/uploads/2021/07/Riqa-practice-scaled.jpg' alt='Ruq‘ah script' class='envira_noscript_images ' /><img src='https://www.calligraphyqalam.com/wordpress/wp-content/uploads/2021/07/riqa-letters-scaled.jpg' alt='Ruq’ah alphabet' class='envira_noscript_images ' /><img src='https://www.calligraphyqalam.com/wordpress/wp-content/uploads/2021/07/riqa-final-scaled.jpg' alt='Ruq’ah composition' c