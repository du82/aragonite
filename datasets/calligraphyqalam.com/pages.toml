full_description = "Site Credits Acknowledgements I am indebted above all to Elinor Aishah Holland, calligrapher of the Arabic and Latin scripts and member of my thesis committee. Without her, I could not have completed this project. Aishah, thank you for your dedication and friendship. It’s been a delight to work with you, and I look forward to our future collaborations. Thank you to my husband Joshua Kvernen, who now knows almost as much about calligraphy as I do! Josh, I am so grateful for your support, encouragement, advice and love. I am exceedingly grateful to Amy Pointer and Julie Simon, members of the University of Baltimore faculty who served on my thesis committee and provided me with insightful feedback at every stage of my (very long) thesis project. Thank you both for believing in me, and encouraging me to pursue excellence. Thank you also to Mohamed Zakariya, master Islamic calligrapher and my calligraphy teacher. I am so grateful for your kindness and generosity towards both myself and the many other students you teach. I’m also indebted to other members of the University of Baltimore community who walked alongside me during this thesis process. Thanks especially to Arthur Magida, who agreed to help edit my writing—little did he know what he was getting into! Thank you also to Ed Gold, Jaye Crooks, Jonathan Braucher, Megan Rhee, Sean Cohen and so many others who encouraged and assisted me along the way. For the redesign of this website, I am exceedingly grateful for the support of the College of Arts and Letters at James Madison University. Many other people and organizations have given generously of their time and resources to support this project. I am so grateful to you all. Thank you! Artists Hassan Massoudy Jila Peacock Khaled Al-Saai Mamoun Sakkal Mehdi Saeedi Native & Zen Two Nja Mahdaoui Reza Abedini Visual Dhikr Wissam Shawkat Organizations African and Middle Eastern Division, Library of Congress Freer and Sackler Galleries, Smithsonian Institution Beinecke Rare Book and Manuscript Library, Yale University Nasser D. Khalili Collection of Islamic Art Sakıp Sabancı Museum, Sabancı University New York Society of Scribes American Association of Teachers of Arabic Disclaimers Any errors or omissions are solely the fault of the author. Please contact me using the link in the footer if you find information that should be changed or added to this website."
