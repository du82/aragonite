full_description = "Rayhani (Pronounced “ray-ha-nee”; Turkish–Reyhani; Persian–Raihan) < Previous style: Nasta‘liq Next style: Riqa‘ > Meaning “Rayhani” means “the aromatic plant basil” or “having a fragrance” Uses Rayhani was used for copying Qur’ans Companion script Muhaqqaq is the larger script often used in conjunction with rayhani. Timeline Developed in the 10th century Refined by Şeyh Hamdullah in the 15th century Like muhaqqaq, the use of rayhani began to decline after the 17th century in favor of naskh Distinctive characteristics A small version of muhaqqaq Letter shapes are more pointy than naskh Usually has a pronounced spike on the initial alif-lam letter shape Notes An easily readable script Rayhani script. Courtesy of the Library of Congress, African and Middle Eastern Division. https://www.loc.gov/item/2019714474/ Naskh and Rayhani script. The Chester Beatty Library. https://viewer.cbl.ie/viewer/image/Is_1431/9/ Calligrapher: Abu’l-Hasan `Ali ibn Hilal, known as Ibn al-Bawwab. Naskh and Rayhani script. The Chester Beatty Library. https://viewer.cbl.ie/viewer/image/Is_1431/9/ If the foreign kings brag to us of their proverbs, we shall boast to them of what we have of the styles [scripts] of calligraphy, because of the nobility of the art. Caliph Al-Ma’mun Image gallery View the full rayhani image gallery .envira-dynamic-gallery .envira-gallery-item {padding-right:40px !important;}.envira-dynamic-gallery .envira-title, #envira-gallery-343 .envira-caption {text-align:left !important;}@media only screen and (max-width: 768px) { .envira-dynamic-gallery .envira-gallery-item { width: 100% !important; } }AllFolio from a Qur'an, sura 5:68-69Qur’anic versesQur’anic versesThe Ibn al-Bawwab Qur‘an<img src='https://www.calligraphyqalam.com/wordpress/wp-content/uploads/2021/07/FS-7375_44-2-scaled.jpg' alt='Folio from a Qur&#039;an, sura 5:68-69' class='envira_noscript_images ' /><img src='https://www.calligraphyqalam.com/wordpress/wp-content/uploads/2021/07/1-87-154