title = "Tawqi‘ - Calligraphy Qalam"
description = "Introducing the art of Arabic, Ottoman, & Persian calligraphy"
full_description = "Tawqi‘ (Pronounced “tao-kee”; Turkish–Tevki‘; Persian–Toqi‘) < Previous style: Ta‘liq Next style: Thuluth > Meaning “Tawqi‘ ” is derived from the Arabic verb, waqa’a, meaning “to sign,” because it was regularly used to write the signature on a ruler’s decrees Uses Most often used for scrolls, diplomas, royal documents and calligraphic tours de force Used in ancient Persia for writing the final colophon of a book, showing the date and place of writing Companion script Tawqi‘ is most often written in conjunction with riqa‘, which is a smaller version of the same script Timeline Developed in the 10th century Refined by Şeyh Hamdullah in the 15th century Gradually replaced by divani in the 19th century Mostly obsolete today Distinctive characteristics A smaller variant of thuluth, its letters are somewhat more compressed and rounded Letters that don’t connect on the left are often connected in this script (unauthorized ligatures), allowing it to be written with speed Features proportionally shorter ascending strokes and shorter, more deeply curved horizontal strokes Tawqi’ and Persian naskh scripts. Courtesy of the Library of Congress, African and Middle Eastern Division. https://www.loc.gov/item/2019714489/ Arabic in black naskh script, colophon in tawqi’ script. Arthur M. Sackler Gallery. https://asia.si.edu/object/S1986.482 Image gallery View the full tawqi‘ image gallery .envira-dynamic-gallery .envira-gallery-item {padding-right:40px !important;}.envira-dynamic-gallery .envira-title, #envira-gallery-343 .envira-caption {text-align:left !important;}@media only screen and (max-width: 768px) { .envira-dynamic-gallery .envira-gallery-item { width: 100% !important; } }AllBook of PrayersBook of PrayersQur’anic verses<img src='https://www.calligraphyqalam.com/wordpress/wp-content/uploads/2021/07/FS-S1986.482_001-000001-scaled.jpg' alt='Book of Prayers' class='envira_noscript_images ' /><img src='https://www.calligraphyqalam.com/wordpress/wp-content/upl