title = "Call me by my gender"
description = "Why does calling women “females” sound so creepy? How about calling nonbinary people “they/thems”? And why does it matter?"
full_description = "why not “a female” or “a male”? those words describe sex, not gender. gender is about our identity and expression – things that actually matter in our everyday lives. “biological sex”, on the other hand, relates to things like chromosomes, gonads, genitals – if you're not someone's doctor or something, then focusing on them so much is… kinda creepy 😬 they're biological terms they're mostly used for animals (who don't have genders). think of nature documentaries and sentences like “the male tries to seduce the female with his birdsong”. sure, humans are part of the animal kingdom too. but we're undeniably different from other animals – reducing us to only our “zoological” nature while dismissing culture and civilisation is quite insulting. it makes you sound like a cop law enforcement uses those terms to distance themselves from the perp's humanity. think of sentences like “the officers have identified a 45yo black male as a primary suspect, he was resisting arrest and got fatally wounded as a result”. it makes you sound like an incel “females” and even “femoids” or “foids” is a common vocabulary among incels – they don't consider women fully human and emphasise it in the language they use. it makes you sound like a transphobe transphobes are obsessed with people's genitals at birth and deliberately emphasise someone's “biological sex” to misgender them. they literally made “adult human female” their identification mark. the usage is usually not symmetrical, skewed against women There are entire subreddits (/r/MenAndFemales, /r/femalesandmen, /r/men_and_females) collecting instances of people using “a female” and “a man” in the same sentence (as well as infantalising adult women as “girls”). it makes you sound like a ferengi srsly, just stop why not “a they/them”, “a she/her”, etc.? people aren't pronouns pronouns are just parts of speech, they're tools that we use to communicate and to describe ourselves and the world around us. just because someone wants to be referred to using a particular set of pronouns, doesn't mean you should see their entire personhood as if it was solely defined by that fact. not all nonbinary people use “they/them” as a matter of fact, every person regardless of gender can use whatever pronouns they want. many enbies use binary forms (“she/her”, “he/him”), many use neopronouns (like “xe/xem”, “fæ/fær”). don't just assume. its usage is not symmetrical, skewed against trans people i don't think i've ever seen a cis person described with “she's a she/her” or “he's a he/him”. for some reason people only tend to do that when they talk about trans and gender non-conforming people. almost as if they didn't treat our identity seriously or something…"
author = "Andrea Vos <andrea@avris.it>"
year_published = 2025
