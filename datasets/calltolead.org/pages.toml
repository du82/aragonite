  Dear Governor Newsom,As current and former employees of frontier AI companies like OpenAI, Google DeepMind, Anthropic, Meta, and xAI, we are writing in our personal capacities to express support for California Senate Bill 1047.We believe that the most powerful AI models may soon pose severe risks, such as expanded access to biological weapons and cyberattacks on critical infrastructure. It is feasible and appropriate for frontier AI companies to test whether the most powerful AI models can cause severe harms, and for these companies to implement reasonable safeguards against such risks.Despite the inherent uncertainty in regulating advanced technology, we believe SB 1047 represents a meaningful step forward. We recommend that you sign SB 1047 into law.Sincerely,Signatories are actively being added. This list is updated periodically.Geoffrey Hinton Turing Award Winner; Formerly Google BrainChristopher Olah Co-Founder and Interpretability Lead, Anthropic; Formerly Interpretability Lead, OpenAI; Jan Leike Alignment Science Co-lead, Anthropic; Formerly Superalignment Co-lead, OpenAI; Research Scientist, DeepMindNicholas Joseph Head of Pretraining, Anthropic; Formerly OpenAIJames Bradbury Head of Compute, Anthropic; Formerly Google DeepMindRob Keele Head of Legal, xAIScott Aaronson Professor of Computer Science, University of Texas at Austin; Formerly OpenAIOpenAIJuan Felipe Cerón Uribe Research EngineerLeo Gao, Member of Technical StaffDan Mossing Member of Technical StaffMichael Pokorny Research EngineerBrydon Eastman Research ScientistAdrien Ecoffet Member of Technical StaffKevin Liu Member of Technical StaffShantanu Jain Member of Technical StaffTim Marple Member of Intelligence & Investigations StaffAshvin Nair Member of Technical StaffMike Heaton Member of Technical StaffChris Hallacy Member of Technical StaffAnonymous Technical or Policy Staff, OpenAIAnonymous Technical or Policy Staff, OpenAIAnonymous Technical or Policy Staff, OpenAIAnonymous Technical or Poli