 9th, 2024. It calls on Governor Newsom to lead on AI regulation and sign California’s Senate Bill 1047 into law. .fe-66de0334682c140416260573 { --grid-gutter: calc(var(--sqs-mobile-site-gutter, 6vw) - 11.0px); --cell-max-width: calc( ( var(--sqs-site-max-width, 1500px) - (11.0px * (8 - 1)) ) / 8 ); display: grid; position: relative; grid-area: 1/1/-1/-1; grid-template-rows: repeat(184,minmax(24px, auto)); grid-template-columns: minmax(var(--grid-gutter), 1fr) repeat(8, minmax(0, var(--cell-max-width))) minmax(var(--grid-gutter), 1fr); row-gap: 11.0px; column-gap: 11.0px; } @media (min-width: 768px) { .background-width--inset .fe-66de0334682c140416260573 { --inset-padding: calc(var(--sqs-site-gutter) * 2); } .fe-66de0334682c140416260573 { --grid-gutter: calc(var(--sqs-site-gutter, 4vw) - 11.0px); --cell-max-width: calc( ( var(--sqs-site-max-width, 1500px) - (11.0px * (24 - 1)) ) / 24 ); --inset-padding: 0vw; --row-height-scaling-factor: 0.0215; --container-width: min(var(--sqs-site-max-width, 1500px), calc(100vw - var(--sqs-site-gutter, 4vw) * 2 - var(--inset-padding) )); grid-template-rows: repeat(159,minmax(calc(var(--container-width) * var(--row-height-scaling-factor)), auto)); grid-template-columns: minmax(var(--grid-gutter), 1fr) repeat(24, minmax(0, var(--cell-max-width))) minmax(var(--grid-gutter), 1fr); } } .fe-block-yui_3_17_2_1_1725825738084_3814 { grid-area: 1/2/184/10; z-index: 1; @media (max-width: 767px) { } } .fe-block-yui_3_17_2_1_1725825738084_3814 .sqs-block { justify-content: flex-start; } .fe-block-yui_3_17_2_1_1725825738084_3814 .sqs-block-alignment-wrapper { align-items: flex-start; } @media (min-width: 768px) { .fe-block-yui_3_17_2_1_1725825738084_3814 { grid-area: 1/2/159/26; z-index: 1; } .fe-block-yui_3_17_2_1_1725825738084_3814 .sqs-block { justify-content: flex-start; } .fe-block-yui_3_17_2_1_1725825738084_3814 .sqs-block-alignment-wrapper { align-items: flex-start; } } Dear Governor Newsom,As current and former employees of frontier AI companies like OpenAI, Google DeepMind, Anthropic, Meta, and xAI, we are writing in our personal capacities to express support for California Senate Bill 1047.We believe that the most powerful AI models may soon pose severe risks, such as expanded access to biological weapons and cyberattacks on critical infrastructure. It is feasible and appropriate for frontier AI companies to test whether the most powerful AI models can cause severe harms, and for these companies to implement reasonable safeguards against such risks.Despite the inherent uncertainty in regulating advanced technology, we believe SB 1047 represents a meaningful step forward. We recommend that you sign SB 1047 into law.Sincerely,Signatories are actively being added. This list is updated periodically.Geoffrey Hinton Turing Award Winner; Formerly Google BrainChristopher Olah Co-Founder and Interpretability Lead, Anthropic; Formerly Interpretability Lead, OpenAI; Jan Leike Alignment Science Co-lead, Anthropic; Formerly Superalignment Co-lead, OpenAI; Research Scientist, DeepMindNicholas Joseph Head of Pretraining, Anthropic; Formerly OpenAIJames Bradbury Head of Compute, Anthropic; Formerly Google DeepMindRob Keele Head of Legal, xAIScott Aaronson Professor of Computer Science, University of Texas at Austin; Formerly OpenAIOpenAIJuan Felipe Cerón Uribe Research EngineerLeo Gao, Member of Technical StaffDan Mossing Member of Technical StaffMichael Pokorny Research EngineerBrydon Eastman Research ScientistAdrien Ecoffet Member of Technical StaffKevin Liu Member of Technical StaffShantanu Jain Member of Technical StaffTim Marple Member of Intelligence & Investigations StaffAshvin Nair Member of Technical StaffMike Heaton Member of Technical StaffChris Hallacy Member of Technical StaffAnonymous Technical or Policy Staff, OpenAIAnonymous Technical or Policy Staff, OpenAIAnonymous Technical or Policy Staff, OpenAIAnonymous Technical or Policy Staff, OpenAIAnonymous Technical or Policy Staff, OpenAIAnonymous Te