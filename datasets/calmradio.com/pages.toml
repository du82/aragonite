description = "Enjoy our full collection of relaxing music and nature sounds. It's perfect for mediation, focus, calm, and sleep. Find the right channel for you."
full_description = "Dear Calm Radio Team, I would like to thank you for your great station, we enjoy almost every day the beautiful music. Hi there – Just wanted to send a very sincere ‘thank you’ for the new Renaissance channel! I was so excited when I logged on one day and saw it had appeared. Your service is wonderful – I use it every day. Thanks for being out there! Hi Jeff, Just to let you know that calm radio helped both my husband and myself during his fight with cancer. We played such beautiful music in our home right through and at night we would have the waves crashing one going all night. I play the ZEN one everyday and its so wonderful & calming. It is a great service you are giving. Calm Radio helps drown out the trains that go by with loads of coal bound for and from China and Russia. We're in Ulaanbaatar, Mongolia and it's a place that cries out for calm. This collection of music and your service is one of the best 'things' that ever happened in my life. 40 years of practicing medicine has left its imprint on my psyche...Thank you. M Daly You amaze me! You keep finding ways to improve. I love the new channel menu as well as the many new channels. Eric Harry & Calm Radio you just keep getting better! I think this is the first time I've ever written two letters of appreciation to a company. I can't help it. You keep getting better. You are the most welcome part of my work day. Thanks! Maggie A. Just letting you know we're getting Calm Radio crystal clear down here in the beautiful Golden Bay area of the South Island of New Zealand. I love the music stream and have just signed up for a 12 month subscription. Ken I have to say that I am still amazed at your near instantaneous response! I have never had ANYONE answer a support request in such a timely - but more importantly, personal - and HELPFUL - manner! Nancy We’re available on all your favorite devices. Download our app from the Apple App Store or Google Play Store and listen directly on your mobile device, or enjoy our desktop apps if you prefer. We’re also available on Apple TV, Sonos, Grace Digital radios, Bluesound, Samsung Smart TV, LG Smart TV, Roku, Android TV, Fire TV, and many more."
