["https://calmtech.com/papers/open-house.html"]
title = "Calm Technology"
full_description = '''A few years ago I found myself on a stage at the MIT Media Lab, arguing with Nicholas Negroponte in front of 700 people. Nick was rhapsodizing about a world in which computerized "intelligent agents" will answer our every need. To illustrate Nick's idea, an actor dressed as a butler introduced speakers and entertained the audience with snide remarks. The butler was fun, up to a point, but also distracting and intrusive. Fortunately, Nick was wrong about what to expect from the third wave in computing. The defining words will not be "intelligent" or "agent", but rather "invisible" and "calm" and "connection". The first wave of computing, from 1940 to about 1980, was dominated by many people serving one computer. The second wave, still peaking, has one person and one computer in uneasy symbiosis, staring at each other across the desktop without really inhabiting each other's worlds. The third wave, just beginning, has many computers serving each person everywhere in the world. I call this last wave "ubiquitous computing" or "ubicomp". Over the next twenty years computers will inhabit the most trivial things: clothes labels (to track washing), coffee cups (to alert cleaning staff to moldy cups), light switches (to save energy if no one is in the room), and pencils (to digitize everything we draw). In such a world, we must dwell with computers, not just interact with them. Interacting with something keeps it distant and foreign. If you are only interacting with your spouse the relationship may be in trouble. We dwell with nature, and roommates, and anything that we let enter us, and we it. Dwelling with computers means that they have their place, and we ours, and we co-exist comfortably Unfortunately, our existing metaphors for computers (and nature, for that matter) are inadequate to describe the "dwelling" relationship. And no metaphor is more misleading than "smart". "Smart House": Does this mean any more than a house with a computer in it? Does it mean anything like "Better House"? Do we really think that everything in the world would be better if it were smarter? Smart Cappuccino? Smart Park? The "Smart House" of 1935 had an electric light in every room. The "Smart House" of 1955 dared to put a TV and a telephone in every room. And the "Smart House" of 2005 will have computers in every room. But what will they do?'''
year_published = 2025
clearnet = "https://calmtech.com/papers/open-house.html"
