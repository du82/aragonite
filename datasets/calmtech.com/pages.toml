title = "Calm Technology"
description = "Calm technology is maintained by Amber Case"
full_description = "The following exercises are a companion to the book Designing Calm Technology available from O’Reilly Books and Amazon.com If you work with a team, it may be useful to complete these exercises in a small group. The challenges and process are largely the same, though you’ll also want to set aside some additional time to brainstorm concepts, then discuss and edit down to the most promising ones. It may also be useful to have each team member pursue a different solution, then compare your results at the end. Imagine that you are a person who habitually presses the snooze button, leaving you too little time to get ready, or even causing you to sleep through the alarm and miss work. At best, you tend to skip breakfast, and arrive at work groggy and unfocused. Your challenge is to redesign the alarm clock in a way that avoids these outcomes, but still wakes you up in the calmest possible way. For a user who often sleeps through the first alarm, morning is probably an anxiety-prone part of the day. Rather than solving the problem by making a louder, more jarring audio alarm, consider combining audio, visual and/or haptic alerts in ways that make them more effective than they would be independently. Remember also that an alarm clock is a timed trigger, and should be treated as such. It’s also worth spending a few minutes to search online for unusual approaches to alarm clocks. Clocky, for example, is a unique alternative: equipped with wheels and a motor, it actually runs away once the alarm sounds, forcing the user to find it before it can be silenced. There are also alarm clocks that use bright light, and smartphone apps that use vibration to wake the user. Each of these has its flaws, but the general idea—that waking up doesn’t have to mean getting yelled at—is worth considering. Imagine that you sleep with a partner who works on a very different schedule from you. You wake up earlier, and he or she needs to rest. Redesign an alarm clock that addresses this situation, making sure you wake up on time, but your partner stays asleep. And again, do it in the calmest way possible. Here are some considerations:"
