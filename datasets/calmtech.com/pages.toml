["https://calmtech.com/book.html"]
title = "Calm Technology"
description = "Calm technology is maintained by Amber Case"
full_description = "How can we design technology that becomes a part of a user’s life and not a distraction from it? This practical book explores the concept of calm technology, a method for smoothly capturing a user’s attention only when necessary, while calmly remaining in the background most of the time. Author Amber Case expands on ideas first introduced by researchers at Xerox PARC in 1995 with a series of principles, patterns and examples of how they apply to our current technology landscape, especially the Internet of Things. This book is ideal for UX and product designers, managers, creative directors, developers, and anyone that cares about making products that exist alongside humans in a state of harmony. Sound can profoundly impact how people interact with your product. Well-designed sounds can be exceptionally effective in conveying subtle distinctions, emotion, urgency, and information without adding visual clutter. In this practical guide, Amber Case and Aaron Day explain why sound design is critical to the success of products, environments, and experiences. Just as visual designers have a set of benchmarks and a design language to guide their work, this book provides a toolkit for the auditory experience, improving collaboration for a wide variety of stakeholders, from product developers to composers, user experience designers to architects. You’ll learn a complete process for designing, prototyping, and testing sound."
