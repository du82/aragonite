title = "Calm Technology"
description = "Calm technology is maintained by Amber Case"
full_description = "The following is a short list of papers that cover aspects of Calm Technology™ and Ubiquitous Computing. These papers encapsulate a great deal of thinking about the future of computing. Many are far ahead of their time. Ubiquitous computing is roughly the opposite of virtual reality. Where virtual reality puts people inside a computer-generated world, ubiquitous computing forces the computer to live out here in the world with people. The Technologist's Responsibilities and Social Change. Mark Weiser. Computer-Mediated Communication Magazine, V2N4. April 1, 1995. Some Computer Science Problems in Ubiquitous Computing. Mark Weiser. Communications of the ACM, July 1993. The Portable Common Runtime Approach to Interoperability. Mark Weiser, Alan Demers, and Carl Hauser. ACM Symposium on Operating Systems Principles, December 1989."
