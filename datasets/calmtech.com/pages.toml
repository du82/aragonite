["https://calmtech.com/index.html"]
title = "Calm Technology"
description = "Calm technology is maintained by Amber Case"
full_description = "When we design products, we aim to choose the best position for user interface components, placing the most important ones in the most accessible places on the screen. Equally important is the design of communication. How many notifications are necessary? How and when should they be displayed? To answer this, we can be inspired by the principles of calm technology.1 If a technology works well, we can ignore it most of the time. A teapot tells us when it is ready, and is off or quiet the rest of the time. A tea kettle can be set and forgotten, until it sings. It does not draw constant attention to itself until necessary. An inner office window provides an understanding of whether someone is busy or not without the need to interrupt them. This simple display easily allows one to see whether the restroom on a plane is occupied or not. The message is universal and requires no translation. Roomba doesn't have a spoken language, just simple tones. This tone-based language makes it easy for anyone to understand what Roomba is saying, and eliminates the need to translate the tone into many different languages. Roomba chirps happily when a task is finished. When Roomba gets stuck or needs cleaning, the device emits a somber tone. Orange and green status lights are secondary display that help communicate status in an unambiguous way. Sleep Cycle is a mobile application that monitors your sleep and allows you to track times of deep sleep and REM. Set an alarm and Sleep Cycle will wake you up before the time at the best place in your sleep cycle with a soft noise or buzz. Because the haptic alert occurs under your pillow, you can configure it so that you can wake up without anyone else being affected by the alarm. SleepCycle rewards users with a sleep score, detailing how well they slept that night. A smart badge is simple. Smart badges are small, wearable technologies that don't require a charger, user interface or operating system. Floor navigation, when done well 2, can quietly show people where to go in unfamiliar spaces when traveling."
