["https://calmtech.com/papers/technologists-responsibilities-and-social-change.html"]
title = "Calm Technology"
full_description = '''I am honored to offer a few words of commentary on previous "Last Link" columns by David Porush and Stephen Doheny-Farina. First let me explain a little bit about Ubiquitous Computing, or Ubicomp, a technology I helped develop and one they mentioned concern about in their columns. I weigh in as an engineer, someone whose primary interest is "what should I build next?" Ubicomp is an unusual project for an engineer, for two reasons. First, I took inspiration from anthropology; and second, I knew that whatever we did would be wrong. The anthropological critique was common in some quarters of Xerox PARC when I arrived in 1987. It went approximately like this: the most profound technologies are those that become embedded in people's lives; current computers force people to separate their machine life from the rest of their lives, so computers in their current form would never become a very significant or profound technology. Now where Doheny-Farina might have breathed a sigh of relief, I took this as a challenge. Could I design a radically new kind of computer that could more deeply participate in the world of people? This led me quickly to the second conclusion, that I would get it wrong. As I began to glimpse what such an information applicance might look like, I saw that it would be so different from today's computer that I could not begin to understand or build it. So I set out, instead, to build some things that my colleagues and I could put in use, things as different as we could imagine from today's computers, yet using technology that could be made solid today. Using these things would then change us. From that new perspective, I would then again try to glimpse our new kind of computer and try again. Thus PARC launched projects to build inch-, foot-, and yard-sized computers--the Tabs, Pads, and Boards of Ubiquitous Computing, phase 1. Interestingly, the active badges that track location, that have Doheny-Farina so concerned, were not invented at PARC at all, but by Olivetti and Digital Equipment Corporation. (Old order page for the Active Badge here | more Active Badge information here). However, we gladly used them as a way to help our machines know more about us, so they could better serve us. And thus we found ourselves in the middle of a controversy.'''
