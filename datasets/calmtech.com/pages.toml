["https://calmtech.com/about"]
title = "Calm Technology"
description = "Calm Technology is maintained by Amber Case"
full_description = "Calm Technology™ is an effort to expand the awareness of how humans and computers can live in harmony, and how pass-through, robust technologies can help us manage emerging complexities and coordination needs in our homes and the wider world. Designer and researcher Amber Case learned about a set of small papers about Calm Technology while writing her thesis on smartphones in 2007. This discovery led her to question why these ideas were not more widely known. Starting in 2010, she expanded on the papers by creating the Principles of Calm Technology, and in 2015, an influentual book called Calm Technology: Principles and Patterns for Non-Intrusive Design. Now, the concept of Calm Technology and Case's principles for Calm product design have been widely adopted by companies all over the world, including Microsoft, Samsung, Google, Virgin Global and AirBNB. Calm Technology also inspired Kyoto-based Calm Technology startup Mui Lab. Case is a frequent traveler and speaker on the topic of Calm Technology, leading workshops and deep consulting work at many companies and institutions. Amber Case studies the interaction between humans and computers and how technology is changing everyday life. Case is currently a Research Director at The Metagovernance Project, where she runs the Department of Calm Technology and is incubating a standards body based on the principles of Calm Technology. Case received the Claude Shannon Innovation Award from Bell Labs and spent two years as a fellow at MIT’s Center for Civic Media and Harvard’s Berkman Klein Center for Internet & Society. Case was the co-founder of EverCharge (acquired by SK Group in 2022), and Geoloqi (acquired by Esri in 2012). You can follow her Medium: https://medium.com/@caseorganic and Twitter: https://twitter.com/caseorganic. The terms “Calm Computing” and “Calm Technology” were coined in 1995 by PARC Researchers Mark Weiser and John Seely Brown in reaction to the increasing complexities that information technologies were creating. He felt that the promise of computing systems was that they might “simplify complexities, not introduce new ones.”1"
year_published = 2025
clearnet = "https://calmtech.com/about"
