["https://calmtech.com/papers/coming-age-calm-technology.html"]
title = "Calm Technology"
full_description = 'The important waves of technological change are those that fundamentally alter the place of technology in our lives. What matters is not technology itself, but its relationship to us. In the past fifty years of computation there have been two great trends in this relationship: the mainframe relationship, and the PC relationship. Today the Internet is carrying us through an era of widespread distributed computing towards the relationship of ubiquitous computing, characterized by deeply imbedding computation in the world. Ubiquitous computing will require a new approach to fitting technology to our lives, an approach we call "calm technology". This article briefly describes the relationship trends, and then expands on the challenges of designing for calm using both the center and the periphery of our perception and the world. The first era we call "mainframe", to recall the relationship people had with computers that were mostly run by experts behind closed doors. Anytime a computer is a scarce resource, and must be negotiated and shared with others, our relationship is that of the mainframe era. There is mainframe computing today: a shared office PC, and the great physical simulations of everything from weather to virtual reality, have in common sharing a scarce resource. The second great trend is that of the personal computer. In 1984 the number of people using personal computers surpassed the number of people using shared computers.[2] The personal computing relationship is personal, even intimate. You have your computer, it contains your stuff, and you interact directly and deeply with it. When doing personal computing you are occupied, you are not doing something else. Some people name their PC - many people curse or complain to their PC. The personal computer is most analogous to the automobile - a special, relatively expensive item, that while it may "take you where you want to go", requires considerable attention to operate. And just as one can own several cars, one can own several personal computers: for home, for work, and for the road.'
