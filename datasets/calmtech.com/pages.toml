["https://calmtech.com/press.html"]
title = "Calm Technology"
description = "Calm technology is maintained by Amber Case"
full_description = '''How To Tell Better Mobile Stories From The Man Creating Them One Pandemic And Smart Object At A Time. "Technology should not have to require our undivided attention all the time. Technology should be something that helps our lives easier and better. And it does not have to be so complicated. "Technology shouldn't require all of our attention, just some of it, and only when necessary." Certainly, wearables are failing at being a Calm Technology. Another issue with wearables is their incessant need for our attention: it’s less the unobtrusive ideal of “put it on and forget it” and more a flashback to your worst Tamogotchi nightmare. The user has to spend a considerable amount of time dealing with the device itself and with the data it produces. Each has its own app sending you alerts and constant software updates. "Technology innovation is an evolutionary process where new products, solutions, and ideas are built on the theories and inventions of those who came before us. Mark Weiser, John Seeley Brown, and Rich Gold worked together at one of the nation’s most advanced technology labs — Xerox PARC. They introduced the idea of calm technology, but with each generation of technology innovation, things get forgotten. Mark and Rick passed away; John is now the only survivor of this trio. Amber Case has made it her mission to tell their story, and make sure that their perspectives on seamless communications and preserving personal privacy in an age of connected devices and real-time information are not lost. Amber Case is now the Director for Research and Development at ESRI, and blogs regularly at caseorganic.com. She launched calmtechnology.com as a tribute to these great minds and to inspire software developers on the relationship between ubiquitous computing (connected everything) and people (privacy, expectations, perceptions)." "How can we free ourselves from our devices and make them work for us, conform to us? The solution is ‘Calm Technology,’ a concept developed by Xerox PARC Chief Scientist Mark Weiser that is summed up as "that which informs but doesn't demand our focus or attention.'''
