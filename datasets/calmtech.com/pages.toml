["https://calmtech.com/papers/the-world-is-not-a-desktop.html"]
title = "Calm Technology"
full_description = "A good tool is an invisible tool. By invisible, I mean that the tool does not intrude on your consciousness; you focus on the task, not the tool. Eyeglasses are a good tool -- you look at the world, not the eyeglasses. The blind man tapping the cane feels the street, not the cane. Of course, tools are not invisible in themselves, but as part of a context of use. With enough practice we can make many apparently difficult things disappear: my fingers know vi editing commands that my conscious mind has long forgotten. But good tools enhance invisibility. I think the value of invisibility is generally understood. Unfortunately, our common metaphors for computer interaction lead us away from the invisible tool, and towards making the tool the center of attention. Take multimedia. The idea, as near as I can tell, is that people already spend hours a week at home watching television, so clearly television is attractive, and we want our computer interfaces to be attractive, so let's put TV into them. To mention a few things that may be wrong with this chain of reasoning: is everything we spend a lot of time doing attractive (sleeping? breathing? worrying?); will the attactiveness of multimillion dollar production TV translate to casual computer TV? And most importantly for this essay, should computer interfaces be attractive at all? Attractiveness is the opposite of invisible. Take intelligent agents. The idea, as near as I can tell, is that the ideal computer should be like a human being, only more obedient. Anything so insidiously appealing should immediately give pause. Why should a computer be anything like a human being? Are airplanes like birds, typewriters like pens, alphabets like mouths, cars like horses? Are human interactions so free of trouble, misunderstanding, and ambiguity that they represent a desirable computer interface goal? Further, it takes a lot of time and attention to build and maintain a smoothly running team of people, even a pair of people. A computer I need to talk to, give commands to, or have a relationship with (much less be intimate with), is a computer that is too much the center of attention."
year_published = 2025
clearnet = "https://calmtech.com/papers/the-world-is-not-a-desktop.html"
