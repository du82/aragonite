["https://calnewport.com/37-signals-formula-for-a-satisfying-career-hint-its-not-passion"]
title = "37 Signal's Formula for a Satisfying Career (Hint: It's Not Passion) - Cal Newport"
description = "Rethinking the Laborious Slog Supporters of the passion hypothesis assume that the key to enjoying your career is choosing the right type of work. I’ve ... Read more"
full_description = "37 Signal’s Formula for a Satisfying Career (Hint: It’s Not Passion) January 26, 2023December 29, 2013 Rethinking the Laborious Slog Supporters of the passion hypothesis assume that the key to enjoying your career is choosing the right type of work. I’ve been arguing that there are many other (and often way more important) factors that help determine whether you end up loving your career. What you do for a living, in other words, is just a small piece in the satisfaction puzzle. A recent Fast Company article by 37 Signal’s David Hansson (promoting his new co-authored book, REMOTE), provides a nice case study for my philosophy. Here’s Hansson: “[T]he problem isn’t actually the work itself. It’s the fight against the hostile environment surrounding the work that’s the laborious slog…The fact is that most people like to work. Really work, that is. Engage their brain and their talents in the creation of value.” As the article then elaborates, the “hostile environment” causing people to be unhappy with their jobs includes factors such as long commutes, requirements to live near the company offices (even if you otherwise dislike the location), and hyper-distracting office cultures. If you can minimize these environmental negatives (i.e., by promoting remote work agreements), Hansson notes, you can significantly increase peoples’ happiness. As career advice, “follow flexible work arrangements” sounds less sexy than “follow your passion,” but Hansson reminds us that career satisfaction is not a particularly sexy pursuit, but is instead the outcome of many careful decisions about many subtle factors. (Photo by The Other Dan) Deep Habits: The Importance of Planning Every Minute of Your Work DayOn Quiet Creativity <img alt='' src='https://secure.gravatar.com/avatar/bc017c470bff6a93ed8f2f10256b0cc2?s=50&#038;d=mm&#038;r=g' srcset='https://secure.gravatar.com/avatar/bc017c470bff6a93ed8f2f10256b0cc2?s=100&#038;d=mm&#038;r=g 2x' class='avatar avatar-50 photo' height='50' width='50' decoding='async'/> Kumara S Raghavendra December 30, 2013 at 5:53 am I have always felt that if you’re spending most of your waking hours doing something, you are bound to e passionate about it at some point. We just need to stop other things from preventing people reaching that point. We must enable them instead. Reply"
