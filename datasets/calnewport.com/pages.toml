full_description = 'Press November, 2022 Making Sense with Sam Harris Cal and Sam Harris discuss the rise and fall of social media. <img decoding="async" width="800" height="800" class="gb-image gb-image-82caacb7" src="https://calnewport.com/wp-content/uploads/2022/02/timferrissshow-logo-800.jpg" alt="The Tim Ferriss Show artwork" title="timferrissshow-logo-800" srcset="https://calnewport.com/wp-content/uploads/2022/02/timferrissshow-logo-800.jpg 800w, https://calnewport.com/wp-content/uploads/2022/02/timferrissshow-logo-800-300x300.jpg 300w, https://calnewport.com/wp-content/uploads/2022/02/timferrissshow-logo-800-150x150.jpg 150w, https://calnewport.com/wp-content/uploads/2022/02/timferrissshow-logo-800-768x768.jpg 768w" sizes="(max-width: 800px) 100vw, 800px" /> February, 2022 Tim Ferriss Show Cal and Tim Ferriss to discuss craftsmanship and the value of slow productivity. <img decoding="async" width="508" height="415" src="https://calnewport.com/wp-content/uploads/2021/12/today_show_logo.gif" alt="The Today Show logo" class="wp-image-10655"/> December, 2021 Today Show Cal appears on The Today Show to discuss the growing interest in time blocking. <img decoding="async" width="486" height="393" src="https://calnewport.com/wp-content/uploads/2021/08/gma-logo.jpg" alt="Good Morning America logo" class="wp-image-10659" srcset="https://calnewport.com/wp-content/uploads/2021/08/gma-logo.jpg 486w, https://calnewport.com/wp-content/uploads/2021/08/gma-logo-300x243.jpg 300w" sizes="(max-width: 486px) 100vw, 486px" /> August, 2021 Good Morning America Cal appears on Good Morning America to discuss A World Without Email. <img decoding="async" width="1000" height="1000" class="gb-image gb-image-9feddf43" src="https://calnewport.com/wp-content/uploads/2021/03/here-now-1000.jpg" alt="The Here &amp; Now logo" title="here-now-1000" srcset="https://calnewport.com/wp-content/uploads/2021/03/here-now-1000.jpg 1000w, https://calnewport.com/wp-content/uploads/2021/03/here-now-1000-300x300.jpg 300w, https://calnewport.com/wp-content/uploads/2021/03/here-now-1000-150x150.jpg 150w, https://calnewport.com/wp-content/uploads/2021/03/here-now-1000-768x768.jpg 768w" sizes="(max-width: 1000px) 100vw, 1000px" /> March, 2021 Here & Now (NPR) Cal appears on NPR’s Here & Now to discuss A World Without Email <img decoding="async" width="500" height="281" src="https://calnewport.com/wp-content/uploads/2021/03/new-york-time-logo.png" alt="The New York Times logo" class="wp-image-10661" srcset="https://calnewport.com/wp-content/uploads/2021/03/new-york-time-logo.png 500w, https://calnewport.com/wp-content/uploads/2021/03/new-york-time-logo-300x169.png 300w" sizes="(max-width: 500px) 100vw, 500px" /> March, 2021 The Ezra Klein Show On his third appearance on the Ezra Klein Show, Cal and Ezra discuss A World Without Email. <img decoding="async" width="800" height="749" src="https://calnewport.com/wp-content/uploads/2019/08/atc-logo-800.webp" alt="All Things Considered logo" class="wp-image-10668" srcset="https://calnewport.com/wp-content/uploads/2019/08/atc-logo-800.webp 800w, https://calnewport.com/wp-content/uploads/2019/08/atc-logo-800-300x281.webp 300w, https://calnewport.com/wp-content/uploads/2019/08/atc-logo-800-768x719.webp 768w" sizes="(max-width: 800px) 100vw, 800px" /> August, 2019 All Things Considered (NPR) Cal appears on NPR’s All Things Considered to discuss whether or not email was a mistake. <img decoding="async" width="800" height="218" class="gb-image gb-image-598ceba5" src="https://calnewport.com/wp-content/uploads/2019/04/the-new-yorker-logo.gif" alt="The New Yorker logo" title="the-new-yorker-logo"/> April, 2019 The New Yorker Jia Tolentino reviews Digital Minimalism in the pages of The New Yorker. <img decoding="async" width="1280" height="720" src="https://calnewport.com/wp-content/uploads/2019/04/breakfast-club-logo.jpg" alt="The Breakfast Club Power logo" class="wp-image-10672" srcset="https://calnewport.com/wp-content/uploads/2019/04/breakfast-club-logo.jpg 1280w, https://calnewport.com/wp-content/uploads/2019/04/breakfast-club-logo-300x169.jpg 300w, https://calnewport.com/wp-content/uploads/2019/04/breakfast-club-logo-1024x576.jpg 1024w, https://calnewport.com/wp-content/uploads/2019/04/breakfast-club-logo-768x432.jpg 768w" sizes="(max-width: 1280px) 100vw, 1280px" /> April, 2019 The Breakfast Club Cal appears on The Breakfast Club to discuss the dangers of social media and the power of digital minimalism. <img decoding="async" width="800" height="463" src="https://calnewport.com/wp-content/uploads/2019/01/the-wall-street-journal-logo-png-8.png" alt="The Wall Street Journal logo" class="wp-image-10689" srcset="https://calnewport.com/wp-content/uploads/2019/01/the-wall-street-journal-logo-png-8.png 800w, https://calnewport.com/wp-content/uploads/2019/01/the-wall-street-journal-logo-png-8-300x174.png 300w, https://calnewport.com/wp-content/uploads/2019/01/the-wall-street-journal-logo-png-8-768x444.png 768w" sizes="(max-width: 800px) 100vw, 800px" /> January, 2019 Wall Street Journal Cal is the subject of the WSJ’s Weekend Interview. <img decoding="async" width="800" height="424" class="gb-image gb-image-ec6c3b70" src="https://calnewport.com/wp-content/uploads/2019/01/gq-logo.gif" alt="GQ logo" title="gq-logo"/> January, 2019 GQ Magazine Cal argues that we’ll one day look back on smartphones like cigarettes. <img decoding="async" width="800" height="508" src="https://calnewport.com/wp-content/uploads/2017/07/hidden-brain-logo.gif" alt="Hidden Brain logo" class="wp-image-10683"/> July, 2017 Hidden Brain (NPR) Cal appears on NPR’s Hidden Brain to discuss the value of deep work in an age of distraction.'
