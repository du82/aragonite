full_description = "Two Chances to See Me Next Week April 4, 2024 I really enjoyed meeting so many of you at my Politics and Prose event a couple weeks ago. It was meaningful for me to be talking about my books in person again after having to launch my last title during a pandemic. It was also a great opportunity to thank people for their support of Slow Productivity, which just yesterday landed #4 on the NYT’s monthly business bestseller list. (If you haven’t bought Slow Productivity yet, you should! If you read this newsletter, you’ll love it…) It’s with all this in mind that I wanted to briefly share two upcoming opportunities to come meet me and hear me talk about Slow Productivity in the DC area next week! On Monday (4/8) at 5:30pm I’ll be giving a book talk on campus at Georgetown University. The event, which is open to the public, will be held in the Fisher Colloquium (in the business school building on main campus), and will include plenty of time for questions. If you’re in the Georgetown area, please come attend! (Details.) On Thursday (4/11) at 6:00pm I’ll be recording a “live” podcast at People’s Book, in my hometown of Takoma Park, MD (which is right at the DC border and easily accessible from metro). I’ve been looking forward to this event! I’ll do a deep dive segment, then producer Jesse and I will take live questions from the audience. This is also a chance to support my favorite independent bookstore (which is literally right around the corner from my podcast studio). This event is free and open to the public, but you should RSVP here if you’re planning on coming. (Details.) Can You Tweet Your Way to Impact?Do We Need AI to Revolutionize Work?"
