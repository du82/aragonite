description = "[Originally sent to the Study Hacks Newsletter on 2/8/07] I recently gave a talk at Dartmouth College, where I covered many of the big picture ... Read more"
full_description = "My Talk at Dartmouth and “Grand Projects” January 26, 2023July 20, 2007 [Originally sent to the Study Hacks Newsletter on 2/8/07] I recently gave a talk at Dartmouth College, where I covered many of the big picture conclusions I’ve developed concerning the college experience. Some students requested that I post my slides online — so I did. You can find them at: https://calnewport.com/articles/ Feel free to do what you want with them. For this talk I was able to go beyond the nitty-gritty technical details (which I so love) and discuss some bigger ideas, such as how to take an idea you are passionate about and transform it into a head-turning accomplishment (referred to in HOW TO WIN as a “Grand Project”). I think this is an interesting topic, and I’m currently putting together a post that summarizes a recent survey I conducted where asked some of the most accomplished young people I know to try to explain what’s the difference between a “doer” and a “dreamer.” Expect this post within 7-10 days. What separates talkers and doers? <img alt='' src='https://secure.gravatar.com/avatar/d6a0c4114706169dcbe3b33ec3ff95d4?s=50&#038;d=mm&#038;r=g' srcset='https://secure.gravatar.com/avatar/d6a0c4114706169dcbe3b33ec3ff95d4?s=100&#038;d=mm&#038;r=g 2x' class='avatar avatar-50 photo' height='50' width='50' decoding='async'/> Andresito April 11, 2009 at 2:17 pm Cal, Those slides are legendary, so meaningful to me even just as plain slides. Well. after longer than 8 months reading your stuff (today 2009) including The Red Book, I can consider you a good friend of mine… and believe me that sharing your knowledge like you do triggers the same desire for me to contribute. So, after I got to know your lifestyle I’ve become also obsessed with this utopia of the Zen Valedictorian. This is something you cannot have a clear finish point nor progress indicator, so I focus on what I do everyday. Changing lifestyle for better has been a great advice from you. Good job! Reply"
