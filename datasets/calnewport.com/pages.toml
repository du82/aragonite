description = "Learn about the writing history of Cal Newport, New York Times bestselling author of seven books. Also, learn about his books."
full_description = '<img decoding="async" width="55" height="58" class="gb-image gb-image-75cd75c1" src="https://calnewport.com/wp-content/uploads/2022/10/writing.svg" alt="write" title="writing"/> Writing Bestselling Author Cal signed his first book deal with Random House soon after his 21st birthday, while still an undergraduate at Dartmouth College. He went on to publish eight books (and counting), which include multiple New York Times bestsellers, and have been translated into over 40 languages and cumulatively sold well over 2,000,000 copies worldwide. He’s also a regular contributor to major publications including the New York Times, the Atlantic, and WIRED. In recent years, his magazine work has been focused mainly on The New Yorker, where he became a Contributing Writer in 2021. Cal’s early books focused on student advice. In 2012, he transitioned into the world of idea writing with his fourth title, So Good They Can’t Ignore You, which challenged the conventional career wisdom to “follow your passion.” This was followed by his Technology and Society trilogy: Deep Work (2016), Digital Minimalism (2019), and A World Without Email (2021), which combined his roles as an academic technologist and popular writer to examine, for a broad audience, the impact of technology on the quest to live and work in meaningful and deep ways. His most recent book Slow Productivity (2024) argues that digital office technologies introduced unsustainable overload to knowledge work, and then provides a concrete plan for reducing this problem. In addition to his traditional book and article publications, Cal has also been an enthusiastic supporter of digital media. He’s published a popular blog/newsletter since 2007 and more recently has branched into podcasting and video. In the fall of 2022, he launched a dedicated online portal, TheDeepLife.com, to organize the various digital media he produces related to the major themes of his work. More information on Cal’s books can be found below. For more on Cal’s recent magazine writing, see his New Yorker archive. For more on Cal’s podcast, videos, and courses, visit his online media portal at TheDeepLife.com Books New York Times bestseller Slow Productivity: The Lost Art of Accomplishment Without Burnout Do fewer things. Work at a natural pace. Obsess over quality. Available online from these stores: <img decoding="async" width="110" height="31" src="https://calnewport.com/wp-content/uploads/2022/10/amazon.png" alt="amazon" class="wp-image-440" title=""/> <img decoding="async" width="133" height="21" src="https://calnewport.com/wp-content/uploads/2022/10/download.png" alt="barnes" class="wp-image-442"/> <img decoding="async" width="126" height="44" src="https://calnewport.com/wp-content/uploads/2022/10/amazon-co-uk-logo-1-2.png" alt="amazon.uk" class="wp-image-453"/> <img decoding="async" width="138" height="21" src="https://calnewport.com/wp-content/uploads/2022/10/bookshop.orglogo-1-1.png" alt="bookshop" class="wp-image-446"/> <img decoding="async" width="217" height="321" src="https://calnewport.com/wp-content/uploads/2022/10/deep-work-cal-newport-2-1.png" alt="without email" class="wp-image-438" srcset="https://calnewport.com/wp-content/uploads/2022/10/deep-work-cal-newport-2-1.png 217w, https://calnewport.com/wp-content/uploads/2022/10/deep-work-cal-newport-2-1-203x300.png 203w" sizes="(max-width: 217px) 100vw, 217px" /> New York Times bestseller A World Without Email: Reimagining Work in an Age of Communication Overload A bold vision for liberating workers from the tyranny of the inbox–and unleashing a new era of productivity Available online from these stores: <img decoding="async" width="110" height="31" src="https://calnewport.com/wp-content/uploads/2022/10/amazon.png" alt="amazon" class="wp-image-440" title=""/> <img decoding="async" width="133" height="21" src="https://calnewport.com/wp-content/uploads/2022/10/download.png" alt="barnes" class="wp-image-442"/> <img decoding="async" width="126" height="44" src="https://calnewport.com/wp-content/uploads/2022/10/amazon-co-uk-logo-1-2.png" alt="amazon.uk" class="wp-image-453"/> <img decoding="async" width="138" height="21" src="https://calnewport.com/wp-content/uploads/2022/10/bookshop.orglogo-1-1.png" alt="bookshop" class="wp-image-446"/> <img decoding="async" width="212" height="314" src="https://calnewport.com/wp-content/uploads/2022/10/deep-work-cal-newport-4-1.png" alt="digital minimalism" class="wp-image-456" srcset="https://calnewport.com/wp-content/uploads/2022/10/deep-work-cal-newport-4-1.png 212w, https://calnewport.com/wp-content/uploads/2022/10/deep-work-cal-newport-4-1-203x300.png 203w" sizes="(max-width: 212px) 100vw, 212px" /> New York Times bestseller Digital Minimalism: Choosing a Focused Life in a Noisy World The key to living well in a high tech world is to use much less technology. Available online from these stores: <img decoding="async" width="110" height="31" src="https://calnewport.com/wp-content/uploads/2022/10/amazon.png" alt="amazon" class="wp-image-440"/> <img decoding="async" width="133" height="21" src="https://calnewport.com/wp-content/uploads/2022/10/download.png" alt="barnes" class="wp-image-442"/> <img decoding="async" width="126" height="44" src="https://calnewport.com/wp-content/uploads/2022/10/amazon-co-uk-logo-1-2.png" alt="amazon.uk" class="wp-image-453"/> <img decoding="async" width="138" height="21" src="https://calnewport.com/wp-content/uploads/2022/10/bookshop.orglogo-1-1.png" alt="bookshop" class="wp-image-446"/> <img decoding="async" width="217" height="321" src="https://calnewport.com/wp-content/uploads/2022/10/deep-work-cal-newport-1-1.png" alt="deep work" class="wp-image-457" srcset="https://calnewport.com/wp-content/uploads/2022/10/deep-work-cal-newport-1-1.png 217w, https://calnewport.com/wp-content/uploads/2022/10/deep-work-cal-newport-1-1-203x300.png 203w" sizes="(max-width: 217px) 100vw, 217px" /> 1,500,000+ copies sold Deep Work: Rules for Focused Su