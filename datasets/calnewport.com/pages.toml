full_description = "25 Articles Every Student Should Read January 26, 2023December 6, 2007 The Best of Student Productivity Blogging As I head off for my Internet-free European vacation, I want to leave you with enough content to keep your mind humming. Accordingly, I bravely dived into my blogroll and pulled out my favorite student productivity articles. Read all 25: they will change the way you think about being a student. See you in 11 days! Study Hacks: Five Study Traps I’ve Seen Others Fall Into | The University Blog How to Write a Fascinating Thesis Statement | Student Hacks How to Ace Your Finals Without Studying | Scott Young Living with Microsoft Word | Academic Productivity Taking Notes that Work | LifeHack Four Ways to Use Wikipedia (hint: never cite it) | GearFire Don’t You Dare…in a Formal Paper | That College Kid How to Memorize Anything | Hack College Top Four Reasons People’s Study Management Systems Fail | GearFire How to Take Notes on Power Point Slides | Study Hacks How to Use a Flat Outline to Write Outstanding Papers, Fast | Study Hacks How to Build a Paper Research Database | Study Hacks Practical Hacks: The Burnt Toast Method (Hang Over Cure) | Hack College How to Talk to a Professor | Life Hack Seven Steps to Creating the Perfect Course Schedule | GearFire Mindset Hacks: Thinking Like an Entrepreneur in College | Ben Casnocha Four Easy Ways to Improve Your Brain Health | Student Hacks Reading is Productivity | ProtoScholar The Unconventional Scholar: Ignore Your GPA | Study Hacks Productivity Hacks: Nine Tips to Stay Productive in a Spontaneous Life | Scott Young My Graduate Student Planner | ProtoScholar How to Keep a Laser Focus Without Burning Out | Scott Young The Art of the Finish: How to Go From Busy to Accomplished | Scott Young Pseudo-Work Does Not Equal Work | Study Hacks The Einstein Principle: Accomplish More By Doing Less | Study Hacks I’m on Vacation for the Next 10 Days…Monday Master Class: The Most Important Paper Research Advice You’ve Never Heard"
