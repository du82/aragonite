["https://calnewport.com/after-you-vote-unplug"]
title = "After You Vote: Unplug - Cal Newport"
description = "I’m writing this post about eighteen hours before the first polls open on Election Day, and it feels tense out there. The New York Times, ... Read more"
full_description = "After You Vote: Unplug November 4, 2024November 4, 2024 I’m writing this post about eighteen hours before the first polls open on Election Day, and it feels tense out there. The New York Times, for example, just posted an article headlined: “How Americans Feel About the Election: Anxious and Scared.” Based on extensive interviews conducted over this past weekend, the Times concludes: “Americans across the political spectrum reported heading to the polls in battleground states with a sense that their nation was coming undone. While some expressed relief that the long election season was finally nearing an end, it was hard to escape the undercurrent of uneasiness about Election Day.” These results probably come as no surprise. The question then becomes what to do with this anxiety. The first step, of course, is to vote — and not just vote, but to approach your decision honestly and dispassionately. By the time you read this, you’ve likely already completed this step. But then what? Here I have a suggestion that I think could be healing for all points of the political spectrum: use the stress of this election to be the final push needed to step away from the exhausting digital chatter that’s been dominating your brain. Take a break from social media. Stop listening to news podcasts. Unsubscribe, at least for a while, from those political newsletters clogging your inbox with their hot takes and tired in-fighting. I suggest you switch to a slower pace of media consumption. Don’t laugh at this suggestion, because I’m actually serious: consider picking up the occasional old-fashioned printed newspaper (free from algorithmic optimization and click-bait curation) at your local coffee shop or library to check in, all at once, on anything major going on in the world. I think I might setup a Sunday-only paper subscription as my main source of news this winter. Equally important is how you redirect your newly liberated attention. Consider aiming it toward real community, with real people who actually live near you, to retrain your brain to stop thinking of the world as hopelessly fractured into vicious tribes. (If right now you’re scouring this post to seek evidence as to whether I’m friend or foe, then you’re already severely suffering from this malady. ) Consider reading books again. There’s a pleasure in the conquest of deep ideas that’s been lost as we thrashed in a digital sea of churning distraction. Spend more time in nature to discover that despite the apocalyptic tenor of the online world, its analog counterpart persists, and is beautiful. The Republic will still stand without our constant digital vigilance. But it’s unclear if our mental health can survive the status quo. ##### Two announcements to share… For the past twelve years, my longtime friend Joshua Fields Millburn, of The Minimalists fame, has been teaching a fantastic online course called How to Write Better. It’s open this week for a new session, so if you’re interested in improving your writing ability (which you should be), please check it out! If you’re still on the fence about whether or not to read my new book, Slow Productivity, check out this insightful new review from Real Clear Books that was published last week. The Perfect Cheating Machine?The Tao of Cal"
