full_description = 'Heschel on the Joys of Slowness February 5, 2024February 2, 2024 In 1951, Abraham Joshua Heschel published a monograph titled simply, The Sabbath. It consisted of ten short chapters, comprising of less than a hundred total pages, illustrated with original wood engravings by Ilya Schor. Early in the book, Heschel establishes the unique importance the Bible places on rest: “It is, indeed, a unique occasion at which the distinguished word qadosh [a transliteration of the Hebrew term for ‘holy’] is used for the first time: in the Book of Genesis at the end of the story of creation. How extremely significant is the fact that it is applied to time: ‘And God blessed the seventh day and made it holy.‘ There is no reference in the record of creation to any object in space that would be endowed the quality of holiness.” As Heschel elaborates, this idea was new. In pagan religions, places were holy; a sacred mountain, say, or a deified river. But the Abrahamic faiths found something Godly in a ritual of rest amid the flow of time. Read more 4 Comments My new book: Slow Productivity January 22, 2024 It’s hard to believe that we’re less than two months away from the publication of my new book, ​Slow Productivity: The Lost Art of Accomplishment … Read more 21 Comments On Slow Writing January 18, 2024 <img decoding="async" width="640" height="427" src="https://calnewport.com/wp-content/uploads/2024/01/writing-outside-640px.jpg" alt="" class="wp-image-15839" srcset="https://calnewport.com/wp-content/uploads/2024/01/writing-outside-640px.jpg 640w, https://calnewport.com/wp-content/uploads/2024/01/writing-outside-640px-300x200.jpg 300w" sizes="(max-width: 640px) 100vw, 640px" /> Someone recently forwarded me an essay from a blogger named Henrik Karlsson. It opens with an admission: “When I started writing online, the advice I got was to publish frequently and not overthink any single piece.” Karlsson was not alone in receiving this suggestion. As social media erupted into cultural dominance over the past decade, it carried in its wake a force that thoroughly disrupted written media: virality. An article or post that hit the Twitter or Facebook zeitgeist just right could summon hundreds of times more readers than average. Because it was difficult to predict which pieces might ascend to this cyber-blessed state, the optimal strategy became, as Karlsson was told, to publish as much as possible, maximizing the odds that you stumble onto something sticky. What makes Karlsson’s essay interesting, however, is that he decided to test this hypothesis on his own work. “I’ve now written 37 blog posts and I no long think this is true,” he writes. “Each time I’ve given in to my impulse to ‘optimize’ a piece it has performed massively better.” Using new subscribers as a metric of success, Karlsson calculated more specifically that spending twice as long on an article yields, on average, more than four times the number of new subscribers. Read more 11 Comments'
