full_description = '''Podcast Listen & Watch <img decoding="async" width="150" height="150" src="https://calnewport.com/wp-content/uploads/2022/11/cal-newport-podcast-cover-150.jpg" alt="" class="wp-image-10447"/> In 2020, Cal launched a podcast called Deep Questions with Cal Newport. On this show, he answers questions and shares case studies from his readers on all topics relevant to the quest to live and work deeply in an increasingly shallow world. The show was a hit, accumulating over 7,000,000 downloads in its first two years, and continuing to grow ever since. <img decoding="async" width="150" height="150" src="https://calnewport.com/wp-content/uploads/2022/11/cal-newport-studio-150.jpg" alt="Cal Newport in his studio" class="wp-image-10457"/> In the spring of 2022, Cal began releasing videos of full podcast episodes, as well as shorter clips of popular segments, on a new YouTube channel. More recently the channel has grown to also include original video productions on the general theme of living a deep life. This channel is a good entry point into the ideas discussed on Cal’s show. <img decoding="async" width="200" height="119" src="https://calnewport.com/wp-content/uploads/2022/11/cal-newport-the-deep-life2-200.jpg" alt="Cal Newport's The Deep Life website screenshot" class="wp-image-10481"/> In the fall of 2022, Cal launched TheDeepLife.com to be the online home for his growing catalog of multimedia productions. TheDeepLife.com is where you can now find all of Cal’s audio and video content, including the full archives of every podcast episode, including show notes and clips, and all of his videos. Subscribe and listen to Deep Questions with Cal Newport on all of the major podcast platforms. Browse the Deep Questions archives and submit your questions/case studies for the show at the listen hub on TheDeepLife.com. Watch videos of full podcast episodes and clips of popular segments on YouTube or at the watch hub on TheDeepLife.com.'''
