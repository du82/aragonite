full_description = '<img decoding="async" width="54" height="49" class="gb-image gb-image-75cd75c1" src="https://calnewport.com/wp-content/uploads/2022/09/schollership.svg" alt="scholarship" title="schollership"/> Scholarship Computer Science Professor Cal is currently a Full Professor of Computer Science at Georgetown University. Before arriving at Georgetown in 2011, he studied at MIT, where he received his PhD working with Nancy Lynch in the Theory of Distributed Systems group, and spent two years as a postdoctoral associate working with Hari Balakrishnan in the Networks and Mobile Systems group. His computer science research focuses on distributed algorithm theory, with a particular interest in what can and cannot be solved in challenging network settings. More recently, Cal’s has also become involved in the emerging discipline of digital ethics. He is one of the founding faculty members of Georgetown’s Center for Digital Ethics, where he currently holds a secondary appointment, and is the inaugural Director of the College of Art and Science’s new Computer Science Ethics and Society major. Find out more about Cal’s general audience writing here.For additional details on Cal’s academic career, see his CV.Cal’s academic email address: [email protected](To contact Cal about his non-academic writing, please see the contact page) Selected Academic Publications Recent Smoothed Analysis of Information Spreading in Dynamic Networks Michael Dinitz, Jeremy Fineman, Seth Gilbert, and Calvin NewportProceedings of the International Symposium on Distributed Computing (DISC). October, 2022. Winner of Best Paper Award. Preparing for Disaster: Leveraging Precomputation to Efficiently Repair Graph Structures Upon Failures Calvin Newport, Nitin Vaidya, and Alex Weaver.Proceedings of the ACM Symposium on Parallelism in Algorithms and Architectures (SPAA). July, 2022. Contention Resolution with Predictions Seth Gilbert, Calvin Newport, Nitin Vaidya, and Alex Weaver.Proceedings of th