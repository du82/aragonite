full_description = 'Meet Cal Newport Computer Scientist & Bestselling Author Cal is an MIT-trained computer science professor at Georgetown University who also writes about the intersections of technology, work, and the quest to find depth in an increasingly distracted world. Want to live a deeper life? Subscribe to Cal’s newsletter. Sign up to join more than 100,000 subscribers who have Cal’s essays delivered straight to their inbox every week. You’ll receive the essays via email. Your email address is never sold or shared. <img decoding="async" width="60" height="47" src="https://calnewport.com/wp-content/uploads/2022/09/Frame.svg" alt="writer" class="wp-image-100" style="width:65px;height:51px"/> Cal the Writer New York Times Best Seller Cal is the author of eight books, including, most recently, Slow Productivity, A World Without Email, Digital Minimalism, and Deep Work. His titles have cumulatively sold well over 2,000,000 copies, have been published in more than 40 languages, and include multiple New York Times bestsellers. In addition to his books, Newport is a contributing writer for the New Yorker and is the host of the Deep Questions podcast. Find out more about Cal’s books Watch or Listen to Cal’s podcast Browse Cal’s New Yorker archive <img decoding="async" width="55" height="51" src="https://calnewport.com/wp-content/uploads/2022/09/Frame-1.svg" alt="academic" class="wp-image-104"/> Cal the Academic Georgetown Professor Cal is currently a Full Professor of Computer Science at Georgetown University. Before arriving at Georgetown, he earned his PhD from MIT. Cal’s academic research focuses on the theory of distributed systems, with a particular interest in what can and cannot be solved in challenging settings. More recently, he’s also become involved in the emerging discipline of digital ethics. In his academic career to date, Cal has published over 65 peer-reviewed articles that have been cited over 4,500 times. More on Cal’s scholarship Cal’s Google Scholar profile Cal’s academic CV Featured Articles Cal writes for both general and academic audiences on a variety of topics. Here are two featured articles from both of these categories. General audience What Type of Mind Does ChatGPT Have? In this long-form article for The New Yorker, Cal takes a close look at the technical operations of the large language model powering ChatGPT. He argues that it’s unproductive to imagine this technology as a black box “alien” intelligence, and that we should instead strive to understand what’s really happening underneath the hood. Read more Academic audience Smoothed Analysis of Information Spreading in Dynamic Networks In this 2022 article, which won the Best Paper award at the International Symposium on Distributed Computing (DISC), Cal and his co-authors prove that information spreading in dynamic networks is perhaps not as hard as existing lower bounds imply. Read more The Technology and Culture Trilogy Between 2016 and 2021, Cal published three culture-shifting, bestselling books that dissected the rise of digital distraction at work and at home, and provided frameworks for combating these diversions. Start here if you want to understand how you lost your focus and learn what you can do to gain it back. <img decoding="async" width="1000" height="1510" class="gb-image gb-image-7ace34fc" src="https://calnewport.com/wp-content/uploads/2023/09/deep-work-cover.webp" alt="deep work" srcset="https://calnewport.com/wp-content/uploads/2023/09/deep-work-cover.webp 1000w, https://calnewport.com/wp-content/uploads/2023/09/deep-work-cover-199x300.webp 199w, https://calnewport.com/wp-content/uploads/2023/09/deep-work-cover-678x1024.webp 678w, https://calnewport.com/wp-content/uploads/2023/09/deep-work-cover-768x1160.webp 768w" sizes="(max-width: 1000px) 100vw, 1000px" /> Deep Work: Rules for Focused Success in a Distracted World More about Cal’s books <img decoding="async" width="1000" height="1510" class="gb-image gb-image-8a2b741b" src="https://calnewport.com/wp-content/uploads/2023/09/a-world-without-email-cover-1.webp" alt="world without email" srcset="https://calnewport.com/wp-content/uploads/2023/09/a-world-without-email-cover-1.webp 1000w, https://calnewport.com/wp-content/uploads/2023/09/a-world-without-email-cover-1-199x300.webp 199w, https://calnewport.com/wp-content/uploads/2023/09/a-world-without-email-cover-1-678x1024.webp 678w, https://calnewport.com/wp-content/uploads/2023/09/a-world-without-email-cover-1-768x1160.webp 768w" sizes="(max-width: 1000px) 100vw, 1000px" /> A World Without Email: Reimagining Work in an Age of Communication Overload More about Cal’s books <img decoding="async" width="1000" height="1510" class="gb-image gb-image-d2edf0b4" src="https://calnewport.com/wp-content/uploads/2023/09/digital-minimalism-cover-1000.webp" alt="Digital Minimalism book cover" srcset="https://calnewport.com/wp-content/uploads/2023/09/digital-minimalism-cover-1000.webp 1000w, https://calnewport.com/wp-content/uploads/2023/09/digital-minimalism-cover-1000-199x300.webp 199w, https://calnewport.com/wp-content/uploads/2023/09/digital-minimalism-cover-1000-678x1024.webp 678w, https://calnewport.com/wp-content/uploads/2023/09/digital-minimalism-cover-1000-768x1160.webp 768w" sizes="(max-width: 1000px) 100vw, 1000px" /> Digital Minimalism: Choosing a Focused Life in a Noisy World More about Cal’s books'
