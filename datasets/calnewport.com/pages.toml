["https://calnewport.com/the-perfect-cheating-machine"]
title = "The Perfect Cheating Machine? - Cal Newport"
description = "Many predictions and concerns tumbled into the slipstream trailing ChatGPT’s dazzling, turbulent entrance onto the technology scene in late 2022. Few of these initial warnings ... Read more"
full_description = "The Perfect Cheating Machine? October 14, 2024 Many predictions and concerns tumbled into the slipstream trailing ChatGPT’s dazzling, turbulent entrance onto the technology scene in late 2022. Few of these initial warnings felt more immediate than those of imminent disruptions to higher education. “Could the chatbot, which provides coherent, quirky, and conversational responses to simple language inquires, inspire more students to cheat?”, asked an NBC News article, published only a week after ChatGPT’s initial launch. Several months later, a professor in the Texas A&M system took this warning to heart and failed his entire class after convincing himself that every one of his students had used AI to write their final assignments. (It turns out that his method of detection—asking ChatGPT itself whether it produced the submissions—was unreliable. He later changed the grades.) “AI seems almost built for cheating,” explains Ethan Mollick, in his recent bestseller, Co-Intelligence. He predicted, in particular, that paper writing as a pedagogical tool might be on the way out, forcing institutions to adapt to other methods to teach composition: “In-school assignments on non-internet-enabled computers, combined with written exams, will ensure students learn basic writing skills.” It’s hard to believe that it’s been almost two years since we first started hearing these concerns about ChatGPT providing students the perfect cheating machine. As a professor and writer myself, these issues interest me, especially when it comes to academic compositions. So in my most recent article for The New Yorker, published earlier this month, and titled “What Kind of Writer is ChatGPT?,” I set out to understand how these tools are currently being put to work by students tackling writing assignments. My approach was to move beyond speculation and watch actual students use AI on actual assignments, with a particular focus on a graduate student I called Chris, who was using ChatGPT to write a significant anthropology paper. As I explain in the article, what I observed Chris doing was more complicated than you might have guessed: “He was not outsourcing his exam to ChatGPT; he rarely made use of the new text or revisions that the chatbot provided. He also didn’t seem to be streamlining or speeding up his writing process. If I had been Chris’s professor, I would have wanted him to disclose his use of the tool, but I don’t think I would have considered it cheating. So what was it?” I recommend that you read the full article to learn the full answer. But to preview what I discovered: students aren’t simply outsourcing their writing to tools like ChatGPT, but they’re also not using them in clearly harmless ways either. The reality is something different and new; less a method to speed up the task of writing and more an approach to reducing its cognitive burden. The bigger point to be made here, however, is about how we think about this new age of artificial intelligence in which we’ve been enveloped since late 2022. These tools are undeniably powerful. Accordingly, they will undeniably end up changing some things about our lives in major ways. But predicting these changes has proven exceedingly difficult. If you’re interested in these trends, spend less time listening to people explaining how the next version of some model is going to change everything all at once, and instead directly observe what people are doing with the versions of the technology they have access to right now. The stories are less flashy, but as you look deeper you’ll find interesting things going on. ##### In the latest episode of my podcast, Deep Questions, released earlier today, I take an unconventional look at the idea of discipline and how to improve it (listen | watch) Have you read my new book, Slow Productivity: The Lost Art of Accomplishment without Burnout? If not, here’s yet another reason to consider doing so: Goodreads just listed Slow Productivity as #1 on their recently released list of the “Most Popular Self Help Books of 2024.” When Time Management Was EasyAfter You Vote: Unplug"
