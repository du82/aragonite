["https://calnewport.com/blog/page/2"]
title = "Study Hacks - Decoding Patterns of Success - Cal Newport"
description = "The Study Hacks blog by author and professor Cal Newport - on deep work, success, productivity, work-life balance."
full_description = "On Ultra-Processed Content June 19, 2024 When I visited London last month, a large marketing push was underway for the paperback edition of Chris van Tulleken’s UK bestseller, Ultra-Processed People: Why Do We All Eat Stuff That Isn’t Food…and Why Can’t We Stop? It seemed to be prominently displayed in every bookstore I visited, and, as you might imagine, I visited a lot of bookstores. Unable to ignore it, I eventually took a closer look and learned more about the central villain of van Tulleken’s treatise: ultra-processed food, a term coined in 2009 as part of a new food classification system, and inspired by Michael Pollan’s concept of “edible food-like substances.” Ultra-processed foods, at their most damaging extreme, are made by breaking down core stock ingredients such as corn or soy into their basic organic building blocks, then recombining these elements into hyper-palatable combinations, rich in salt, sugar, and fat, soaked with unpronounceable chemical emulsifiers and preservatives. As Chris van Tulleken points out, the problem with ultra-processed foods is that they’re engineered to hijack our desire mechanisms, making them literally irresistible. The result is that we consume way more calories than we need in arguably the least healthy form possible. Give me a bag of Doritos (a classic ultra-processed food) and I’ll have a hard time stopping until it’s empty. I’m much less likely to similarly gorge myself on, say, a salad or baked chicken. I was thinking about this book recently as Scott Young and I were prepared to re-open our course, Life of Focus, for new registrations next week. One of the three month-long modules of this course focuses on implementing ideas from my book Digital Minimalism to help you regain control of your attention from the insistent attraction of screens. It occurred to me that in this concept of ultra-processed food we can find a useful analogy for understanding both our struggles to disconnect, and for how we might succeed in this aspiration going forward. Read more 15 Comments"
year_published = 2024
year_updated = 2024
