full_description = '''Slow Productivity The Lost Art of Accomplishment Without Burnout Our current definition of “productivity” is broken. It pushes us to treat busyness as a proxy for useful effort, leading to impossibly lengthy task lists and ceaseless meetings. We’re overwhelmed by all we have to do and on the edge of burnout, left to decide between giving into soul-sapping hustle culture or rejecting ambition altogether. But are these really our only choices? <img loading="lazy" decoding="async" width="126" height="44" src="https://calnewport.com/wp-content/uploads/2022/10/amazon-co-uk-logo-1-2.png" alt="amazon.uk" class="wp-image-453"> <img decoding="async" src="https://m.media-amazon.com/images/G/02/Audible/Homestead/logo/audiblelogo._CB482869198_.png" /> Audiobook "This brilliant and timely book is for all of us who've grown disillusioned with conventional productivity advice, yet still yearn to get meaningful things done. With his trademark blend of philosophical depth and realistic techniques, Newport outlines an approach that's more human and vastly more effective in the long run."Oliver Burkeman, author of Four Thousand Weeks "If you are stretched thin and having trouble getting everything done, you need to speed up, right? Wrong. In Slow Productivity, Cal Newport does what he does best, delivering counterintuitive secrets that just might save your career and sanity."Arthur C. Brooks, author of Build the Life You Want "With profound insights backed by research, analysis, and examples from the lives of scientists and artists, Cal Newport explores a better way to work—one that promises more calm, clarity, and creativity."Gretchen Rubin, author of The Happiness Project "Cal's mix of storytelling and practical advice makes this a super engaging read that you'll want to revisit repeatedly."Ali Abdaal, author of Feel-Good Productivity "For anyone who wants individual advice on how to be more productive, there's nobody better than Cal Newport: calm, evidence-based, and inspiring."Johann Hari, author of Stolen Focus "Slow Productivity is an opportunity to understand why we so often feel frustrated with the demands of the world we live in—and what we can accomplish if we choose to turn inward, once again."Meera Lee Patel, author of Start Where You Are <img decoding="async" class="fl-photo-img wp-image-15723 size-medium" src="https://calnewport.com/wp-content/uploads/2023/12/slow_productivity_excerpt-1-199x300.png" alt="slow_productivity_excerpt-1" itemprop="image" height="300" width="199" title="slow_productivity_excerpt-1" srcset="https://calnewport.com/wp-content/uploads/2023/12/slow_productivity_excerpt-1-199x300.png 199w, https://calnewport.com/wp-content/uploads/2023/12/slow_productivity_excerpt-1.png 512w" sizes="(max-width: 199px) 100vw, 199px" /> Download a free excerpt of the book body button.formkit-submit.formkit-submit { padding: 10px !important; font-size: 16px !important; } .formkit-alert { color: #000 !important; }'''
