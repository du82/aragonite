title = "Study Hacks - Decoding Patterns of Success - Cal Newport"
description = "The Study Hacks blog by author and professor Cal Newport - on deep work, success, productivity, work-life balance."
full_description = 'Back to the (Internet) Future February 24, 2025 On Saturday, the Washington Nationals baseball team played their first spring training game of the season. I was listening to the radio call in the background as I went about my day. I also, however, kept an eye on a community blog called Talk Nats. The site moderators had posted an article about today’s game. As play unfolded, a group of Nationals fans gathered in the comment threads to discuss the unfolding action. Much of the discussion focused on specific plays. “Nasty from Ferrer,” noted a commenter, soon after one of the team’s best relief pitchers, Jose Ferrer, struck out two batters. “Looks like we took the Ferreri [sic] out of the garage,” someone else replied. There were also jokes, such as when, early in the game, someone deadpanned: “Anyone who K’s [strikes out] is cut.” As well as more general discussion of the season ahead. If you followed the thread long enough, it became clear that many of the commenters know each other, while others were meeting for the first time. As the game wrapped up, someone mentions that they’re listening from a part of Canada that recently received three feet of snow. Another commentator replied by recalling a trip they took to that same area: “It was amazing.” Ultimately, over 540 comments were left over the duration of an otherwise uneventful, early season exhibition match. Read more Leave a comment Productivity Rain Dances February 17, 2025 <img decoding="async" width="640" height="291" src="https://calnewport.com/wp-content/uploads/2025/02/williamson-640px-2.jpg" alt="" class="wp-image-16490" srcset="https://calnewport.com/wp-content/uploads/2025/02/williamson-640px-2.jpg 640w, https://calnewport.com/wp-content/uploads/2025/02/williamson-640px-2-300x136.jpg 300w" sizes="(max-width: 640px) 100vw, 640px" /> A reader recently sent me a clip from Chris Williamson’s podcast. In the segment, Williamson discusses his evolving relationship with productivity: “Look, I come from a productivity background. When I first started this show, I was chatting shit about Pomodoro timers, and Notion external brains, and Ebbinhaus forgetting curves, and all of that. Right? I’ve been through the ringer, so I’m allowed to say, and, um, you realize after a while that it ends up being this weird superstitious rain dance you’re doing, this sort of odd sort of productivity rain dance, in the desperate hope that later that day you’re going to get something done.” I was intrigued by this term “productivity rain dance.” Some additional research revealed that Williamson had discussed the concept before. In a post from last summer, he listed the following additional examples of rain dance activities: “Sitting at my desk when I’m not working” “Being on calls with no actual objective” “Keeping Slack notifications at zero, sitting on email trying to get the Unread number down” “Saying yes to a random dinner when someone is coming through town” What do these varied examples, from obsessing over Ebbinhaus forgetting curves to waging war against your email inbox, have in common? They’re focused on activity in the moment instead of results over time. “The problem is that no one’s productivity goal is to maximize inputs,” Williamson explains. “It’s to maximize outputs.” When you look around the modern office environment, and see everyone frantically answering emails as they jump on and off Zoom meetings, or watch to solo-entrepreneur lose a morning to optimizing their ChatGPT-powered personalized assistant, you’re observing rain dances. Everyone’s busy, but is no one is asking if all these gyrations are actually opening the clouds. Read more 2 Comments'
