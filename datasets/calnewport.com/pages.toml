title = "The End of Screens? - Cal Newport"
description = "Believe it or not, one of the most important technology announcements of the past few months had nothing to do with artificial intelligence. While critics ... Read more"
full_description = "The End of Screens? May 22, 2023 Image by Sightful Believe it or not, one of the most important technology announcements of the past few months had nothing to do with artificial intelligence. While critics and boosters continue to stir and fret over the latest capabilities of ChatGPT, a largely unknown 60-person start-up, based out of Tel Aviv, quietly began demoing a product that might foretell an equally impactful economic disruption. The company is named Sightful and their new offering is Spacetop: “the world’s first augmented reality laptop.” Spacetop consists of a standard computer keyboard tethered to pair of goggles, styled like an unusually chunky pair of sport sunglasses. When you put on the goggles, the Spacetop technology inserts multiple large virtual computer screens into your visual field, floating above the keyboard as if you were using a computer connected to large external monitors. As oppose to virtual reality technology, which places you into an entirely artificial setting, Spacetop is an example of augmented reality (AR), which places virtual elements into the real world. The goggles are transparent: when you put them on at your table in Starbucks you still see the coffee shop all around you. The difference is now there are also virtual computer screens floating above your macchiato. To be clear, I don’t believe that this specific product, which is just now entering a limited, 1000-person beta testing phase, will imminently upend the technology industry. The goggles are still too big and unwieldy (more Google Glass than Ray Ban), and the field of vision for their virtual projections remains too limited to fully support the illusion of screens that exist in real space. But I increasingly believe that Sightful may have stumbled into the right strategy for finally pushing AR into the mainstream. Unlike Magic Leap, the over-hyped Google-backed start-up that burned through $4 billion trying to develop a general-purpose AR device that could do all things for all people, Sightful has remained much more focused with their initial product. Spacetop solves a narrow problem that’s perfectly suited for AR: limited screen space for mobile computing. Their initial audience will likely be power users who desperately crave monitor real estate. (As I learned researching a 2021 New Yorker article about working in virtual reality, computer programmers, in particular, will happily embrace even the most wonky of cutting-edge technologies if it allow them to use more windows simultaneously.) This narrowness simplifies many of the technical issues that afflicted the general-purpose AR technologies developed by companies like Magic Leap. Projecting virtual screens is much easier than trying to render arbitrary 3D objects in a real space, as you don’t have to worry about matching the ambient lighting. Furthermore, the keyboard base provides a familiar user interface and vastly simplifies the process of tracking head movements. In other words, this is a problem that AR has a chance to convincingly solve. And once this door is open, and AR emerges as a legitimate profitable consumer technology, significant disruption might soon follow. Imagine the following scenario: In the third generation of their technology, Sightful achieves a small enough form-factor and large enough field of vision for their AR goggles to appeal to the much broader market segment of business users looking for more screen space when working away from the orfice. Seeing the potential, Apple invests several hundred million dollars to develop the iGlass: a pair of fashion-forward AR goggles, connected wirelessly to an elegant, foldable base on which you can touch or type, marketed as a replacement for the iPad and MacBook that can fit in your pocket while still providing you a screen bigger than their biggest studio monitors. Spooked, Samsung scrambles to release a high-end AR television experience that allows you to enjoy a virtual 200-inch television in any room. Apple smells blood and adds television functionality as a software update to iGlass. Soon Samsung’s market drastically shrinks. This sets off the first of multiple cataclysmic consolidations in the consumer electronics sector. Within a decade, we find ourselves in a world largely devoid of screens. Computation unfolds in the cloud and is presented to us as digital projections on thin plastic optical wave-guides positioned inches from our eyes. I don’t, at this point, mean this prognostication to be either optimistic or dystopian. I want only to emphasize that in a moment in which we’re all so enthralled with the question of whether or not autoregressive token predictors might take our jobs, there are some other major technological fault lines that are beginning to rumble and might very well be close to radically shifting. ##### In other news: Speaking of a potential AR revolution, I talked about Apple’s upcoming splashy entrance into this space during the final segment of Episode 249 of my podcast, Deep Questions. My friend Adam Alter, who I quoted extensively in Digital Minimalism, has a fantastic new book out titled Anatomy of a Breakthrough. Here’s my blurb from the back cover: “A deeply researched and compelling guide to breaking through the inevitable obstacles on the path to meaningful accomplishment.” Check it out! On Kids and SmartphonesOn the Slow Productivity of John Wick"
