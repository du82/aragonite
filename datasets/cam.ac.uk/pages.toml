title = "About the University | University of Cambridge"
description = "The University of Cambridge has over 20,000 students from more than 140 countries. Find out about our unique institution."
full_description = "Cambridge at a glance The University of Cambridge has more than 24,000 students, from over 140 countries. Find out more about our unique institution. Read More How the University and Colleges work There are 31 Colleges, 6 Schools and over 150 Faculties and Departments that make up the University of Cambridge, covering a vast array of subjects and specialised areas of research. Find out how we work together. Read More Term dates Cambridge's Academic Year commences on 1 October and finishes on 30 September. See the Term dates Visiting the University Discover the University of Cambridge through open days, virtual tours, and detailed information about our departments and accessibility. Visit the University History The University of Cambridge has been at the forefront of academic study and research since 1209. Here is a selection of our discoveries and innovations so far. Read More Civic and community engagement Discover how the University works with partners in Cambridge and throughout the East of England. See examples of our local engagement Mission and core values The University's mission is to contribute to society through the pursuit of education, learning and research at the highest international levels of excellence. Read More Annual reports and financial statements View and download the University of Cambridge Group's Annual Reports and Financial Statements. Go to our annual report pages A global University The University of Cambridge is a global institution. See an overview of Cambridge's international activities in pursuit of its mission to contribute to society through excellence of education, learning and research. Go to our Global Cambridge pages"
