title = "Term dates | University of Cambridge"
description = "Cambridge’s academic year starts on 1 October and ends on 30 September. The academic year has 3 terms: Michaelmas Lent Easter During each term, there’s an 8-week period called ‘Full Term’. This is"
full_description = "Cambridge’s academic year starts on 1 October and ends on 30 September. The academic year has 3 terms: Michaelmas Lent Easter During each term, there’s an 8-week period called ‘Full Term’. This is when undergraduate teaching takes place. Academic activities for postgraduate students take place throughout the academic year. 2024/25 Full Term dates Michaelmas Full Term 2024 Starts: Tuesday 8 October 2024 Ends: Friday 6 December 2024 Lent Full Term 2025 Starts: Tuesday 21 January 2025 Ends: Friday 21 March 2025 Easter Full Term 2025 Starts: Tuesday 29 April 2025 Ends: Friday 20 June 2025 2025/26 Full Term dates Michaelmas Full Term 2025 Starts: Tuesday 7 October 2025 Ends: Friday 5 December 2025 Lent Full Term 2026 Starts: Tuesday 20 January 2026 Ends: Friday 20 March 2026 Easter Full Term 2026 Starts: Tuesday 28 April 2026 Ends: Friday 19 June 2026 New students Your College, Faculty or Department will send you information about preparing for your time in Cambridge, including when to arrive. Find out about coming to Cambridge as a new student Add term dates to your calendar Add term dates to your calendar app using Google or iCal More about term dates The University’s Statutes and Ordinances have more information about term dates, including: future term dates Division of Term dates Find out more about term dates in the University’s Statutes and Ordinances (PDF, 730 KB), under the heading ‘Dates of Term and Full Term’. Other dates and timetables Degree ceremony dates Exam timetables Lecture timetables"
