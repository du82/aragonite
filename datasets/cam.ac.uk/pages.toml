["https://cam.ac.uk/about-this-site/accessibility"]
title = "Accessibility statement for the University of Cambridge | University of Cambridge"
description = "This website is run by the University of Cambridge and this accessibility statement applies to www.cam.ac.uk. We want as many people as possible to be able to use this website. For example, that"
full_description = "This website is run by the University of Cambridge and this accessibility statement applies to www.cam.ac.uk. We want as many people as possible to be able to use this website. For example, that means you should be able to: change colours, contrast levels and fonts zoom in up to 300% without the text spilling off the screen navigate most of the website using just a keyboard navigate most of the website using speech recognition software listen to most of the website using a screen reader AbilityNet has advice on making your device easier to use if you have a disability. How accessible this website is All pages should comply with WCAG 2.0 AA and where possible comply with WCAG2.2 AA. We know some parts of this website are not fully accessible: some text, links and buttons have poor colour contrast some page headings are labelled in the wrong order some tables are difficult to understand for screen readers some buttons cannot be interpreted by assistive technology some elements are not keyboard accessible some pages don't have fully functioning responsive design most older PDF documents are not fully accessible to screen reader software some live and pre-recorded video and audio do not have transcripts, audio descriptions or captions many images do not have text descriptions Requesting information in a different format If you need information on this website in a different format, email accessibility@cam.ac.uk. We’ll consider your request and get back to you in 5 business days. Creating alternative format documents If you are a student or member of staff with a disability, you can convert inaccessible files with SensusAccess software. It converts documents, text or files into an e-book, text file, audio or braille. You can also use this service if you support someone in the University with a disability. Reporting accessibility problems with this website We’re always looking to improve the accessibility of this website. If you find any problems not listed on this page email accessibility@cam.ac.uk and give details of the URLs and the problems you encountered. Enforcement procedure The Equality and Human Rights Commission (EHRC) is responsible for enforcing the Public Sector Bodies (Websites and Mobile Applications) (No. 2) Accessibility Regulations 2018 (the ‘accessibility regulations’). If you’re not happy with how we respond to your complaint, contact the Equality Advisory and Support Service (EASS). (Link opens in a new window) Technical information about this website’s accessibility The Public Sector Bodies (Websites and Mobile Applications) (No. 2) Accessibility Regulations 2018 (the ‘accessibility regulations’) do not apply to the University of Cambridge. However, the University of Cambridge is committed to making its websites and mobile applications accessible and in this regard to complying voluntarily with the accessibility regulations. This accessibility statement is published in that context. Compliance status This website is partially compliant with the Web Content Accessibility Guidelines version 2.1 AA standard, due to the following non-compliances. Non-accessible content The content listed is non-accessible for the following reasons. Non-compliance with the accessibility regulations Many images do not have a text alternative, so people using a screen reader cannot access the information. This fails WCAG 2.1 success criterion 1.1.1 (non-text content). Some video and audio files on our site do not have audio description, transcripts or captions. This fails WCAG 2.1 success criteria: 1.2.2 (captions pre-recorded) 1.2.3 (audio description or text alternative) 1.2.4 (captions live) The hierarchy of some page headings is incorrect. This means that information may be presented in the wrong order to people using assistive technology. This fails WCAG 2.1 success criterion 1.3.2 (Meaningful sequence). Some text, links and buttons have poor colour contrast. This fails WCAG2.1 success criterion 1.4.3 (Contrast – minimum) Some URL link text does not describe its purpose or destination. This means that it is not always clear where a link will take the user. This fails WCAG2.1 success criterion 2.4.4 (Link purpose) Some form controls and inputs do not have labels. This means that it is not always clear what the purpose of the field is. This fails WCAG2.1 success criterion 2.4.6 (Headings and labels) Older PDF documents are not fully accessible to screen reader software. What we’re doing to improve accessibility We’re working to fix the issues identified in this accessibility statement and aim to fix these in 2025. We are currently re-platforming our content management systems and introducing new typefaces and codebases for our websites. These are being built with an accessibility-first approach. We are also refreshing our training for content creators so that content can be created with accessibility at the forefront as well. Preparation of this accessibility statement The University has an extensive web presence. We have listed all known accessibility issues in this statement. A new report was compiled in autumn 2024 to inform the design of our new platform. This statement was was last reviewed on 21 January 2025."
year_published = 2022
clearnet = "https://cam.ac.uk/about-this-site/accessibility"
