description = "The University of Cambridge admits talented students from around the world to its undergraduate and postgraduate programmes. Browse our courses."
full_description = "Foundation Year The Cambridge Foundation Year provides a stepping stone to study at Cambridge. It is a fully-funded, one year course. It is for for students who have experienced disadvantage in their education. The Foundation Year Part-time postgraduate study Our part-time courses offer a more flexible way to study for a research degree at Cambridge. You can fit your studies around your career and other commitments. Part-time postgraduate study Executive and professional education These are courses for people working in executive environments, leaders, managers and professionals. We offer study options for you and your organisation. Executive and professional education Online courses Cambridge Advance Online offers online study for professionals. Led by University of Cambridge academics, you can study on a flexible schedule to suit your needs. Browse online courses Courses in education We offer all levels of study at the Faculty of Education. This includes the Cambridge PGCE and professional development. Education courses Doctoral training Cambridge has a range of funded doctoral training programmes. These can provide support with your tuition fees, living costs and research costs. Doctoral training"
