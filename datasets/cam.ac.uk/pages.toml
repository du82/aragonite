["https://cam.ac.uk/research"]
title = "Research | University of Cambridge"
full_description = "The tale of the tomb of Thutmose II Cambridge University's Dr Judith Bunbury is Deputy Mission Director of the archaeological project in the Theban Mountain area that found the lost tomb of Thutmose II. Read more Cambridge initiative to address risks of future engineered pandemics Covid-19 showed us how vulnerable the world is to pandemics – but what if the next pandemic were somehow engineered? How would the world respond – and could we stop it happening in the first place? Read more The coral whisperer Duygu Sevilgen has built a coral lab in the basement of an old Zoology building. Here, 10 experimental tanks host multicoloured miniature forests, with each tank representing a different marine environment. Duygu uses extremely small sensors to record the fine details of coral skeletons and listen to their dialogue with algae. In doing so, she determines how much change corals can bear, and improves our chances of saving them in the wild. Read more New global map promises to better pinpoint vital rare earth deposits Cambridge geoscientists are developing an atlas that could lead to a more complete understanding of how viable rare earth element deposits form and help locate more secure sources, by mapping the global distribution of critical metals deposits within unusual igneous rocks. Read more"
