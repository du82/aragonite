title = "University of Cambridge"
description = "The University of Cambridge is one of the world’s leading universities, with a rich history of radical thinking dating back to 1209."
full_description = "Search Menu Close Undergraduate study Postgraduate study Alumni Business and enterprise Cambridge students News Jobs Research Colleges and Departments Staff pages Contact Cambridge About the University The lost tomb of Thutmose II “Getting hard hatted up and exploring the tomb chamber is a long adrenaline burn,” said Dr Judith Bunbury, a Cambridge geo-archaeologist. Dr Bunbury is Deputy Mission Director of the archaeological project that has discovered a lost tomb of Thutmose II. This is the first royal tomb to be found since King Tutankhamun’s tomb in 1922. Undergraduate study Postgraduate study Courses How to apply How to choose a College International students Term dates Visit us Courses Funding How to apply Fees International students Virtual tour Undergraduate Learn more about undergraduate study Find your undergraduate course Postgraduate Learn more about postgraduate study Find your postgraduate course Our world-leading researchers are exploring how AI can benefit society. Video of Our world-leading researchers are exploring how AI can benefit society. Why Cambridge? Find out why studying at Cambridge is for you How to apply Step-by-step guidance on the applications process Undergraduate study Postgraduate study Libraries Museums Research Business and enterprise Alumni Sport News Updates from across the University News - New global map aims to pinpoint key rare earth deposits Cambridge geoscientists are developing an atlas that could lead to a better understanding of how crucial earth element deposits form and help locate more secure sources, by mapping their global distribution. News - Cambridge initiative to address risks of future engineered pandemics The Engineered Pandemics Risk Management Programme will investigate the social and biological factors that might drive an engineered pandemic and build capability to tackle it. News - The coral whisperer Dr Duygu Sevilgen uses extremely small sensors to record the fine details of coral skeletons. She can then determine how much change corals can bear to improve our chances of saving them. See more news Events Concerts, lectures, sports events, and more Admissions - Discover Cambridge: Monday 17 to Friday 21 March Join us for this series of lunchtime webinars exploring the practicalities of applying for postgraduate study at Cambridge. Sport - The Varsity Matches: Saturday 8 March at StoneX Stadium The Varsity Matches take place at StoneX Stadium in London: women's KO at 12noon; men's KO at 3pm. Dedicated coaches are running from Cambridge. Admissions - Subject Masterclasses: until Thursday 15 May Explore your chosen subject in greater depth while experiencing typical undergraduate teaching at Cambridge with our Subject Masterclasses. See more events Student perspectives POV: Attend a Cambridge Foundation Year Interview Video of POV: Attend a Cambridge Foundation Year Interview History student Ami resits a Foundation Year interview to give applicants an idea of what to expect. The course is a stepping stone to undergraduate study in the Arts, Humanities and Social Sciences at Cambridge. YouTube Cambridge on Instagram Dr Layla Ettinghausen graduated from Cambridge last summer. She now works as a Foundation Year 1 doctor. See more of Cambridge's places and people by following us on Instagram. Instagram Follow us Facebook Instagram LinkedIn Tik Tok Twitter YouTube"
