["https://cam.ac.uk/research/research-at-cambridge"]
title = "Research at Cambridge | University of Cambridge"
description = "In Cambridge, we are committed to achieving excellence in research and scholarship, and to ensuring that our research contributes to the well-being of society. We seek to provide a creative and"
full_description = "In Cambridge, we are committed to achieving excellence in research and scholarship, and to ensuring that our research contributes to the well-being of society. We seek to provide a creative and supportive environment in which ideas are generated and can flourish. The excellence and diversity of our research across the Schools of Arts & Humanities, Humanities & Social Sciences, Clinical Medicine, Technology, Physical Sciences and Biological Sciences, and our role as one of the founder members of the Cambridge Network, means that in addition to our achievements in fundamental research, we are also well-positioned to make significant contributions to the global innovation agenda and, by conveying the implications of our research, to contribute to the formulation of policy. In addition to the activities ongoing within the six Schools, we have identified a number of Strategic Research Initiatives & Networks and Interdisciplinary Research Centres which build on the existing research base in Cambridge to tackle challenges that can only be addressed by multi-disciplinary teams of researchers. Our aim is to provide academic leadership in these areas and to develop strategic partnerships around the world to advance research, and the impact of that research, in these fields."
