["https://www.cambridgeday.com/category/arts-and-culture/celebrations"]
title = "Celebrations Archives - Cambridge Day"
full_description = "After a frigid parade winding through Harvard square, Oscar nominee and “Wicked” star Cynthia Erivo was awarded the Hasty Pudding Theatrical Society’s 75th Woman of the Year honor and a Pudding Pot to match. Harvard’s Hasty Pudding Theatricals awarded its 58th Man of the Year honor Friday to “Mad Men” and “Landman” actor Jon Hamm. Cambridge is getting a Porchfest, but when it arrives in early to mid-July it won’t look much like the annual event run every May in Somerville. The cemetery partners with Masary Studios to design the huge installations, which are at Mount Auburn Saturday through Dec. 21. This weekend’s 19th annual three-day Honk! Festival drew thousands to Somerville on Friday and Saturday, then down into Cambridge on Sunday for a parade to Oktoberfest in Harvard Square. The Somerville Arts Council organized ArtBeat 2024 with an eye for performances and activities that are “out there.” Artists and performers could convey untouched nature or feral ferocity. The kickoff to summer that began in 1996 and draws crowds of up to 30,000 people takes place in front of Cambridge City Hall. The solar eclipse seen from 2:16 to 4:39 p.m. April 8 is the best we’re getting until 2079. Here are ways to appreciate it. The 60th anniversary celebration of Tutoring Plus has Bar Enza food, themed tables and honors for local educator Khari Milner to help a nonprofit teaching and mentoring children for free since its start in 1964. Sure, our calendars are filled with increasingly commodified holidays, but they’re also filling up with new days of nationwide significance."
