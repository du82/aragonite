title = "Business + Money Archives - Cambridge Day"
full_description = "Founded by 23-year-old Abdelrahman Hassan, the Luxor Cafe will be open until 2 a.m. during the Muslim holy month of fasting and prayer. A four-story redevelopment next to Redbones Barbecue will provide a trio of three-bedroom condominium units atop a commercial space in Davis Square. A plan to replace the parking lot at the Margaret Fuller Neighborhood House nonprofit with affordable housing met resistance at a meeting with residents, several of whom wondered where the parking would go. Send legal ads and public notices at least six business days ahead of the intended publication date to [email protected] with contact information that includes a contact name, phone number and address. The Board of Zoning Appeal will … Bands want to be heard, but getting them audiences in the area’s underground music scene runs the risk of drawing attention that kills the scene. It was a quandary without an answer at an early February gathering. Local musicians say a temporary closing of The Burren for construction of a planned 25-story housing redevelopment would hurt the arts community. A “game changer” of a contract for Somerville city workers was funded Thursday by the City Council, with $1.5 million going to pay for average raises of up to 17 percent and better paid family and medical leave benefits. The Walgreens in Cambridge’s Central Square is one of 1,200 the chain is closing nationwide. Signs posted at the store entrance say the last day is March 27, and shelves are already emptying. As expected, eight out of nine councillors supported bans on single- and two-family zones, dubbed “exclusionary zoning,” to address a housing affordability crisis."
