["https://www.cambridgeday.com/article-comments-guidelines"]
title = "Comment Guidelines - Cambridge Day"
description = "UPDATED: Jan 22, 2025 We strive for Cambridge Day to be the trusted news source for Cambridge, with news that addresses the interests of the community in a timely, accurate and objective manner. We fully recognize there are different views on any issue of consequence, and there is obvious value in lively engagement from readers; that’s […]"
full_description = "Comment Guidelines UPDATED: Jan 22, 2025 We strive for Cambridge Day to be the trusted news source for Cambridge, with news that addresses the interests of the community in a timely, accurate and objective manner. We fully recognize there are different views on any issue of consequence, and there is obvious value in lively engagement from readers; that’s a sign of a healthy and robust community. As stated in a previous post, we consider that some comments on Cambridge Day articles have not supported a civil discourse. We want to avoid and eliminate the insults, flame wars, and personal insults we’ve seen in the paper recently, and so we asked for your help and advice. Most of you, though not everyone, believe we should continue to include comments. While some organizations have discontinued them, we share the view that comments can be valuable to provide a forum for public discussion, that is assuming the discourse can be civil and productive. On anonymity, there were mixed opinions. Many share the concern that anonymity can fuel the kind of vitriol we see on too many social media sites, but others feel anonymity should be allowed as a form of protection against harassment and intimidation by people seen as having power and influence. We have decided to allow individuals to remain anonymous, but all commenters will be asked to confirm their identity with an authentic email address that won’t be published. To elaborate on why we decided to keep anonymous comments on the website. This is not a simple issue, and we are trying to reflect the concerns of readers and best practices of media sites in general. Some have eliminated comments entirely; some allow comments on some articles but not others (e.g., New York Times); some allow comments on all articles (e.g., Washington Post). Both of those publications allow anonymous comments. The comment section presents a forum for readers to engage, give feedback on articles, and add information or insights that may have been missed by the writer. These posts sometimes lead to ideas for new articles. To be sure, sometimes the comments include posts that violate our new guidelines, which we intend to enforce. There have been instances of community members using information gathered on the Cambridge Day website to contact individuals they disagree with outside of the website, and in some cases researching and calling out home addresses and places of employment – behavior that can be experienced as harassment or intimidation. We want our readers and commenters to feel safe on the site and not feel that their personal identifiable information could be used to intimidate or harm them in any way. Anonymity helps shield people from such behavior, but it also can be used to act irresponsibly, and we’ll use moderation to address this. We have not observed a discernible difference in civility between those that use their real name and those who use anonymous names; the spectrum of civility applies to both categories. Further, we also ask individuals to refrain from calling others on the site “liars” or calling out “lies”. Lying implies knowing one’s intent; please use the term “false information” or “incorrect” or similar language that does not presume intent to mislead. That’s the kind of content we are hoping to avoid. It’s acceptable to point out something you believe to be untrue and make a correction citing a relevant source. We will solicit the help of thoughtful volunteer moderators who will ensure that comments meet our guidelines. We hope it won’t be necessary to suspend anyone from the comments on Cambridge Day, but on behalf of the community, we will remove inappropriate comments and ask offenders to refrain from posting. Guidelines: Be respectful and civil; encourage constructive dialogue free from insults, personal attacks, harassment or hate speech. Stay on topic and keep comments to 1,000 characters (approx 250 words)or less. If you have more to say, consider writing a letter to the editor. Don’t post more than three comments on any topic and use second or third comments for clarification and not repetition. Share only information you are confident is accurate and avoid unverified claims. Link to sources you believe are accurate and consistent with the guidelines. Respect the privacy of fellow commenters, journalists and public figures, and not harass fellow commenters offline based on the dialogue online or any other information obtained from the Cambridge Day website. Please report comments that you believe violate our guidelines to [email protected] Thank you for being part of our community and helping us create a space for healthy and respectful dialogue. If you have further thoughts – or would be open to serving as a volunteer moderator – please email us at [email protected] Our policy is a work in progress and will continue to evolve as we see how it is playing out. We are grateful for your help along the way!"
