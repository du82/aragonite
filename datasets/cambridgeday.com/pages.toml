["https://www.cambridgeday.com/category/arts-and-culture/dance"]
title = "Dance Archives - Cambridge Day"
full_description = "Union Square is already buzzing with nightlife and construction, but professional dancers will soon have a space of their own with The Hive. The skies and streets should be cleared of snow in time for the final weekend of Dance Now, live performances that include excerpts from an all-dance reimagining of “Annie Get Your Gun”; Aysha Upchurch’s dance of persistence; Peter DiMuro’s take on our “stupefying existence” during Covid; and Kristin Wagner’s celebration of meaningless beauty. Central Square-based Dance Complex has opened a 4,000-square-foot annex in Kendall Square for artistic experimentation and says it is taking applications from “artists of all kinds” to use it. The closing of Green Streets Studios after 28 years in Central Square has been turned into a broader effort to stop the loss of arts in Cambridge. The Lion’s Jaw performance + dance festival is not just for avant-garde dancers to swap cutting-edge pedagogy – although it is an exceptional opportunity for it – and seats are open for its shows even as its fourth year in Central Square sees its classes sold out. Green Street Studios is closing in Central Square after 28 years, another victim of rising rents and another loss for the Central Square Cultural Arts District. A theater for dance performances is years off in the Canal District at Kendall Square, which is why the VLA Dance company brings its “Bare Velvet” to a unique space Friday and Saturday: a former office building cafeteria. The words “experimental” and “improvisational” aren’t uncommon in the works put on at Central Square’s newly expanded Dance Complex, but that doesn’t mean they’re not on the calendar far ahead of time. The latest innovation for the Cambridge Symphony Orchestra arrives on stage Saturday with some of the same excitement felt by Parisians in 1910, as the orchestra brings Stravinsky’s “The Firebird” to life in a semi-staged production of the full ballet. What takes the stage Thursday at the Agassiz Baldwin Afterschool’s Hip Hop Festival’s 20th anniversary show will be essentially the same as what kids of the previous generation saw in 1996 – stunning hip-hop acts starring everyone from preteens to professionals."
