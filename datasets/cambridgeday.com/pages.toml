["https://www.cambridgeday.com/category/arts-and-culture/food/what-hes-having"]
title = "What We're Having Archives - Cambridge Day"
full_description = "We’ve always been fans of La Saison and its airy, stay-fresh-for-days croissants. If you dig olives, the bakery’s vegetarian olive sandwich makes it your paradise too. Tasting tables in the area are disappearing, but one with novel, local dishes is back at the cozy and intimate chef’s counter at Erin Miller’s Urban Hearth. Chūka (or chukka) is Japanese-Chinese fusion, and at Mimi’s that’s exactly what’s cooked up in a comforting and classically retro-hip diner space. Here’s a quick look of some of our wings and pizza favorites to get you warmed up, pregamed and through the gridiron rematch between the Eagles and Chiefs. Indulge at the new Black Ruby with a messy but delicious Crispy Basil Thai Burger – maybe with the best meat alternative in town – and a chicken satay sandwich and tom yum shrimp roll that will impress. The last of the dormant Darwin’s Ltd. cafes has finally been recycled and rebooted. The Smoot Standard replaces the old Darwin’s outpost near MIT with an ambitious slate of breakfast, lunch and dinner menus. Colette Wine Bistro was taken over last fall and transformed from into a Southern supper club with a French infusion, the Margeaux Supper Parlor. Hot Tomatoes in Union Square after stints in Boston, goes beyond serving slices and sandwiches – but has plenty of those, and several with delicious ham. Before you commit to a New Year’s diet of kale and quinoa, you might want to hit up Bred Gourmet between Kendall and Central squares for some of the most sinful – and flavorful – burgers in town, part of a welcome Dorchester-to-Cambridge Caribbean narrative. Newly opened replacement Pollo 2Go is a Latin-inspired cantina that, as you can guess, specializes in chicken, but also serves up patties and the Puerto Rican street food classics mofongo and trifongo."
