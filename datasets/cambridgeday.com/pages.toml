["https://www.cambridgeday.com/category/arts-and-culture/art"]
title = "Art Archives - Cambridge Day"
full_description = "The immediacy and animacy of photography are on exhibit in an exciting, grassroots group show and a small but lovely solo exhibition in Harvard’s Davis Center. An exhibit combines talents in sculpture and painting, incorporating commentary on the degradation and instability wrought by climate change. Painter Adam Leveille’s “Nissenbaum, Midday” is back on display with Melissa London’s “Laundry Boy” photograph a month after their apparent theft. The paintings in Janiva Ellis’ solo exhibition, “Fear Corroded Ape,” look like how the past two weeks have felt: inconclusive yet ominous. Martha Friend’s iconic “Sapphire City” house in Somerville – the one with the collection of blue glass bottles out front – has a quaint addition. Social figure-drawing classes have been taking Somerville by storm over the past year, and the results are on display for one more week at the Arts at the Armory. The Somerville Museum reopens to the public Thursday after several months of construction with “The Art of the Festival,” Bruce McCoy Owens’ celebration of religious festivities and sacred spaces largely in the Kathmandu Valley. Tilde Cambridge has been slinging coffee and wine for less than a month near Davis Square, but it’s already a burgeoning hub for local art. Winners of the fifth annual Cambridge City Nature Art Challenge are on display at locally owned businesses and other venues. The contest gives a way for Cambridge students to connect with local wildlife through art. At Harvard Art Museums, it’s the last week to see “Made in Germany?” – a kaleidoscopic exhibition exploring the opposing ideas of openness and xenophobic nationalism in the country’s recent history."
