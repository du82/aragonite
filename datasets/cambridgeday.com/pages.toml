ian co-founded an online student information system, joined the Robotics Club and sang in a talent show. Now he is known for working under Elon Musk to slash through federal agencies. Suspects in The Port gun incident are charged, including a 17-year-old from Cambridge Three kids have been charged with firearm offenses after what authorities are calling a “brazen daytime shooting” in The Port neighborhood of Cambridge. Somerville Media Center hosts grand opening after a year and a half between homes The Somerville Media Center opened its doors to the community Wednesday in a new location in Ward 2 in an event filled with officials, residents and members of the SMC who use its television, video and podcast equipment. School Committee should elect its own leader, Cambridge councillors say in a rethink of rules Cambridge’s first big governmental overhaul after 80-plus years isn’t leading to big changes, but seeing mainly tweaks to budget and staff approval processes. Attend Cambridge meetings for Feb. 27-March 6 about a police drone request, support for the arts Public meetings this week look at the BB&N school appealing an opinion that it didn’t use its land, a police request for a drone, zoning in squares and along traffic corridors and city support for the arts and artists. A BETTERPlease consider making a financial contribution to maintain, expand and improve Cambridge Day. Our new donation platform provides tax deductibility through our new 501c3 nonprofit fiscal sponsor, powered by Stripe. Please consider a recurring contribution. DONATE NOW Features New England Glass and the history of glassmaking in East Cambridge The glass industry was an early presence in the newly developing East Cambridge of the 1810s and had a decadeslong run there. Checklist State Rep. Dave Rogers seeks summer interns Rep. Owens announces March office hours Opinion In Cambridge special education, parents watch haphazard priorities result in uneven outcomes This budget season, Cambridge’s 