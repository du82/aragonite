title = "News Archives - Cambridge Day"
full_description = "In his year at Cambridge Rindge and Latin School, Cole Killian co-founded an online student information system, joined the Robotics Club and sang in a talent show. Now he is known for working under Elon Musk to slash through federal agencies. Three kids have been charged with firearm offenses after what authorities are calling a “brazen daytime shooting” in The Port neighborhood of Cambridge. The Somerville Media Center opened its doors to the community Wednesday in a new location in Ward 2 in an event filled with officials, residents and members of the SMC who use its television, video and podcast equipment. Cambridge’s first big governmental overhaul after 80-plus years isn’t leading to big changes, but seeing mainly tweaks to budget and staff approval processes. Public meetings this week look at the BB&N school appealing an opinion that it didn’t use its land, a police request for a drone, zoning in squares and along traffic corridors and city support for the arts and artists. Public meetings this week look at a four-story Davis project and home demolitions, politics, the next city budget and Stop & Shop labor organizing. Three shootings that took place in Cambridge, Somerville and Belmont within around 10 hours are being investigated as marking “the most significant surge in gun violence here since 2022,” an official said. Gunfire returned to The Port neighborhood Monday after three months of peace, as Cambridge police reported multiple gunshots heard but no shooting victims found onsite or at area hospitals. As sanctuary cities, Somerville and Chelsea have laws on the books protecting marginalized communities. Officials say they are resisting Trump administration efforts to coerce cities into participating in mass immigrant deportation efforts. Jason Mackey positions himself as a pragmatic progressive able to translate community needs into action. As an entrepreneur, Mackey said that he has developed an ability to network, a “can-do attitude” and sense of persistence."
