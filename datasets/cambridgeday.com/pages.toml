title = "Opinion Archives - Cambridge Day"
full_description = "This budget season, Cambridge’s School Committee should get back to a core truth of special education: What are the needs of the kid in front of you? Downsizing must be guided by a clear strategic plan that refocuses the organization on its core activities. Secondly, there must be a sharing of the pain by the senior management of the organization. Elon Musk misses the mark. When a major network invited me to discuss Black History Month through the lens of presidential politics, I declined. Not because the platform wasn’t valuable, but because our story deserves more than being defined by opposition. As a way to solve rising demand and high prices, Cambridge’s multifamily housing proposal feels ham-handed. There are other ways to do this. Cambridge should adopt a policy prohibiting large-scale developments in areas at or below 12 feet above sea level, protecting the city from future climate risks and showing a commitment to responsible and equitable urban planning. On Monday the City Council is set to pass – and finalize – the most consequential Cambridge zoning change in decades. An option called “three-plus-three-plus-three” is a better way forward for the city. The Cambridge City Council is poised to pass a zoning petition that would allow much taller and denser housing in all residential areas. This action deserves especially careful consideration by all who will be affected. The Chinese American Association of Cambridge’s Lunar New Year event held Sunday at Cambridge Rindge and Latin School started with a cultural fair with snacks and drinks and went on to include speeches and performances. Instead of walking a beat, engaging with residents – housed and unhoused – and addressing needs proactively, officers will watch us all remotely. A group has developed a “People’s Budget” that includes a set of priorities for adminstrators to consider for inclusion in a fiscal 2026 budget."
