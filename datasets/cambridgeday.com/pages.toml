full_description = "Paid legal notices for Cambridge for Feb. 13-20 by admin | Feb 20, 2025 | Business + Money | 0 comments Home | Business + Money Paid legal notices for Cambridge for Feb. 13-20 Thursday, February 20, 2025 Send legal ads and public notices at least six business days ahead of the intended publication date to [email protected] with contact information that includes a contact name, phone number and address. The Board of Zoning Appeal will hold a Virtual Public Meeting, THURSDAY – FEBRUARY 27, 2025. Members of the public can participate or view the meeting remotely using the Zoom Webinar link: https://cambridgema.zoom.us/j/85299551558 Or join by phone: Dial +1 929 436 2866 or +1 301 715 8592 – Webinar ID: 852 9955 1558 6:00 P.M. CASE NO. BZA-1148745 30 GERRY’S LANDING ROAD Residence A-1 Zone BUCKINGHAM BROWNE & NICHOLS – TARA GOHLMANN – C/O CYNTHIA WESTERMAN Appeal: Determination of ISD Commissioner’s letter dated 12/17/24 that the variance granted in BZA-017262-2020 lapsed for non-use. Art. 4.000, Sec. 4.50 (Institutional Use Classification). Sec. 4.56.c (Institutional Uses). Art. 9.000, Sec. 9.10 (Enforcement). Art. 10.000, Sec. 10.20 (Appeal). 6:15 P.M. CASE NO. BZA-1148744 30 GERRY’S LANDING ROAD Residence A-1 Zone BUCKINGHAM BROWNE & NICHOLS – TARA GOHLMANN – C/O CYNTHIA WESTERMAN Variance: To allow the use of the parcel for all Educational Uses. Art. 4.000. Sec. 4.50 (Institutional Use). Sec. 4.56.c (Use-Category-Institutional Uses). Art. 10.000, Sec. 10.30 (Variance). 6:30 P.M. CASE NO. BZA-1143657 50-52 WASHBURN AVENUE #50 Residence B Zone 50-52 WASHBURN AVE CONDOMINIUM – C/O JEROME KIMBROUGH Variance: To construct accessory garage building violating height, front and side yard setbacks. Relief for GFA and open space. Art. 5.000, Sec. 5.31 (Table of Dimensional Requirements). Art. 4.000, Sec. 4.21 (Accessory Uses). Art. 10.000, Sec. 10.30 (Variance). 6:45 P.M. CASE NO. 1148878 18-20 FARWELL PLACE Residence C-2 Zone GARY CHAFETZ & C. RIEDER – C/O DAVID W. TORREY, ARCHITECT Special Permit: To construct new posts and roof over the main entrance that are within side yard setbacks. Art. 5.000, Sec. 5.31 (Table of Dimensional Requirements). Art. 8.000, Sec. 8.22.2.d (Non-Conforming Structure). Art. 10.000, Sec. 10.40 (Special Permit). 7:00 P.M. CASE NO. 1148175 102 KINNAIRD STREET Residence C-1 Zone JOE CAMILLUS & SHOBA RAMANADHAN Variance: To construct addition to the rear of the building which encroaches into rear yard setback. Art. 5.000, Sec. 5.31 (Table of Dimensional Requirements). Art. 8.000, Sec. 8.22.3 (Non-Conforming structure). Art. 10.000, Sec. 10.30 (Variance). Special Permit: To install new windows in the left non-conforming side setbacks. At. 8.000, Sec. 8.22.2.c (Non-Conforming Structure). Art. 10.000, Sec. 10.40 (Special Permit). 7:15 P.M. CASE NO. 1149291 29 MT. AUBURN STREET Office 3 Zone/Harvard Square ROMAN CATHOLIC ARCHBISHOP OF BOSTON, A CORPORATE SOLE – SIGNARAMA – C/O PAMELA JAGIELLO & MICHAEL COHEN Variance: Installation of a wall sign at greater height than allowed by Article 7. Art. 7.000. Sec. 7.16.22.c (Wall Sign). & Art. 10.000, Sec. 10.30 (Variance). 7:30 P.M. CASE NO. 1147479 1105 MASSACHUSETTS AVENUE – UNIT 1C Business B Zone UNIT 1C 1105 MASS AVE CONDO NOMINEE TRUST – C/O JOHN CARMICHAEL Variance: To renovate an 848 square foot office condominium for use as a single residential dwelling that aligns with the existing uses of the building. Art. 5.000, Sec. 5.31 (Table of Dimensional Requirements). Sec. 5.26 (Conversion). Art. 8.000, Sec. 8.22.3 (Non-Conforming Structure). Art. 10.000, Sec. 10.30 (Variance). TO VIEW BZA CASE APPLICATIONS, PLANS & SUBMISSIONS, GO TO: https://www.cambridgema.gov/inspection/zoning.aspx at top of page, click “Calendar” > Click hearing date > Click “Board of Zoning Appeal Agenda.” Any information filed after the agenda has been posted can be viewed at the Inspectional Services Department located at 831 Mass Avenue, Cambridge by appointment only. Copies of this petition are also on file in the office of the City Clerk, City Hall, Cambridge, MA. Interested persons may provide comments to the Board of Zoning Appeal by participating during the hearing and/or may provide written comments for the Board’s consideration by mailing or delivering them to the attention of the Secretary, Board of Zoning Appeal, 831 Mass Avenue, 02139 or by emailing them to [email protected]. Comments must be submitted prior to the Hearing and include the Case Number. Continued cases are not re-advertised but are posted on the office board at the City Clerk’s Office in City Hall & on the same B Z A We b Page 48 hours prior to hearing. SECTION 000116 – INVITATION TO BID Putnam Gadens Roof Replacement Putnam Gardens LLC MMT Inc. February 19, 2025 Putnam Gardens LLC CAMBRIDGE HOUSING AUTHORITY PLANNING & DEVELOPMENT DEPARTMENT Cambridge Housing Authority, in its capacity as managing member, acting on behalf of Putnam Gardens LLC, the Owner and Awarding Authority, invites sealed bids for the Putnam Gardens Roof Replacement Project at 64 Magee St, Cambridge, MA 02139. The project consists of a full roof replacement for (3) three, three-story residential apartment buildings with flat membrane roofs. The work shall include the replacement of edge metal flashing and all roof accessories. The work is estimated to cost $1,000,000. All bids are subject to Federal Davis Bacon prevailing wage rates as required by the Mass. Dept. of Labor Standards and included in the project specifications. General bids shall be accompanied by a bid deposit not less than five (5%) of the greatest possible bid amount and made payable to Putnam Gardens LLC. A 100% payment bond and a 100% performance bond will be required for the awarded contract. General bids will be received until Thursday, March 6, 2025, at 2:00 PM and publicly opened on-line, forthwith. A site visit for all interested general bidders will begin at Putnam Gardens, 64 Magee St, Cambridge, MA 02139 on Thursday, February 27, 2025, at 10:00 AM. All bidders are invited and encouraged to attend. Attendees of the site visit should RSVP to [email protected]. Deadline for General Bidder questions shall be submitted by Monday, March 3, 2025, by 2:00PM. Questions received after the above deadlines may not be considered by the Awarding Authority. No interpretations of the meaning of the plans, specifications or other pre-bid documents shall be made to any bidder orally. Every request for such interpretation must be in writing. Questions concerning this project must be submitted to PutnamGardens [email protected]. Bid forms and contract documents will be available at WWW.PROCORE.COM on Wednesday, February 19, 2025, at 10:00 AM (may be downloaded and viewed electronically). THIS PROJECT IS BEING ELECTRONICALLY BID, HARD COPY BIDS AND EMAILED BIDS WILL NOT BE ACCEPTED BY THE AWARDING AUTHORITY. ALL BIDS shall be electronically submitted through WWW.PROCORE.COM. At any time during the bidding process, you may download and print the various bid documents for your company’s records. Additional instructions to complete the other bid forms are accessible on the Procore website. The Awarding Authority reserves the right to reject any and all bids and to waive any informalities in the bidding process if it is in the public interest to do so. The Awarding Authority also reserves the right to reject the bids if less than three bids are received. Bids shall remain in effect for 60 days, Saturdays, Sundays and legal holidays excluded after opening. Successful bidders shall agree to commence work and complete the Work in accordance with the dates set forth in the Bidding Documents and Contract Documents. Interested in bidding on future CHA Projects? Go to CHA’s Interested Vendor page at www.cambridge-housing.org and enter your company’s contact information for our future bid solicitations. Please include your company’s info, a contact email, and the trade(s) that your company provides so we can send you future projects directly. CAMBRIDGE HOUSING AUTHORITY REQUEST FOR PROPOSALS ROOFTOP RIGHTS FOR WIRELESS EQUIPMENT ROOFTOP SPACE The Cambridge Housing Authority (CHA), as Agent for Truman Apartments LLC (CHA) is seeking an Offeror(s) for a lease for specific roof rights at Truman Apartments. The rapid growth of the wireless communication industry has resulted in an increased need for strategically located tall structures as antenna sites. As the owner of several midrise and high-rise housing structures throughout the city as well as low-rise buildings with flat roofs, the CHA hopes to generate revenue by providing rooftop space to the wireless communications industry. The selected Offeror(s) will lease the exclusive or non-exclusive rights to designated roof location(s). It will also be the Offeror’s responsibility to manage the site in a mutual agreement between the Offeror(s) and the Cambridge Housing Authority on behalf of the owner of the property. The scope of services will include, but not be limited to, Offeror(s) will be responsible for the installation, maintenance, administration and security of the antenna site(s). The Offeror(s) agree that they will cooperate with the CHA and other Offeror(s) and/or existing lessors in achieving the maximum utilization of space without causing interference to existing installations. The Offeror(s) shall be prepared to provide independent architectural and structural engineering certification that any and all modifications to the structure will meet all Commonwealth of Massachusetts Building Codes and be visually acceptable to the CHA. The Offeror(s) shall prepare and submit two sets of scaled drawings 24” x 36. Bids are subject to M.G. L. Chapter 30B. This lease will be for ten years with two renewable 5 year terms at the sole discretion of the CHA. CHA may, at their sole discretion, use a third party to help evaluate the proposals. The Request for Proposal for this project will be available on Thursday, February 6, 2025, after 10:00 AM. Bidders may obtain the RFP ELECTRONICALLY by contacting Andrew Kerivan, at [email protected] . Any questions or requests for further information must be submitted in writing to the attention of Andrew Kerivan, Director of Asset Management at [email protected] no later than 3:00pm on Tuesday, February 18, 2025. No inquiry received after the stated deadline will be considered. Proposals will be received ELECTRONICALLY until 02:00 PM on Friday, March 7, 2024. Vendors should e-mail their Qualifications Proposal to Andrew Kerivan, [email protected] and Cost Proposal SEPARATELY to Rocky Ludger, [email protected] . In the body of each e-mail, vendors should clearly identify the Qualifications Proposal or Cost Proposal with the name of the firm. Pursuant to Chapter 30B §6 the contract will awarded to the most advantageous proposal from a responsive and responsible proposer taking into consideration price and non-price proposal. The time of acceptance of the proposal by the Cambridge Housing Authority is 60 days from the date of the receipt. Award of the contract is conditioned on approval by the Cambridge Housing Authority’s Board of Commissioners. The contract is subject to appropriation of adequate funds, and may be cancelled in the event such funds are not available. Please see RFP for additional information. Rock-Andral Ludger, Senior Purchasing Agent INVITATION TO BID CAMBRIDGE HOUSING AUTHORITY 22 LOPEZ AVE HVAC REPAIRS ESSEX STREET MANAGEMENT, INC. C/O CAMBRIDGE HOUSING AUTHORITY PLANNING & DEVELOPMENT DEPARTMENT Project #24-lop-001 – 22 Lopex Ave HVAC Repairs The Cambridge Housing Authority, in its capacity as managing member, acting on behalf of Essex Street Management, Inc., the owner and Awarding Authority, invites sealed bids from Trade Bidders and General Contractors for the above-named project in Cambridge, Massachusetts, in accordance with the documents prepared by BWA Architecture, Inc. The project includes removal of the existing heating system and installation of a new central VRF system with wall mounted fan coil units in eight (8) one-bedroom residential units. Removal of existing electrical and replacement with new for the HVAC work with cutting/patching and painting work required. The work is estimated to cost $450,000. Bids are subject to M.G.L. c.149 and to minimum wage rates as required by the Federal Department of Labor prevailing wage decision for Middlesex County Massachusetts, Residential Construction type. A site visit for all interested Bidders will be held at 10:00AM on Wednesday March 5, 2025, at 22 Lopez Ave, Cambridge, MA 02141. All bidders are strongly encouraged to attend. Attendees of the site visit should RSVP to [email protected]. All Bidders must be DCAMM certified, and all bidders must include a current DCAMM Certificate of Eligibility, a signed DCAMM Sub-Bidder’s Update Statement, with their bid in addition to a bid deposit in the amount of five (5%) of the amount of the bid. Trade Category Estimate HVAC $250,000 Electrical $75,000 All bidder questions must be submitted in writing by electronic submission to the Architect at [email protected]. Include “22 Lopez Ave HVAC Repairs Bidder RFI” in the email subject line. The deadline for Bidder questions is on Friday March 7, 2025, by 4:00PM. THIS PROJECT IS BEING ELECTRONICALLY BID, AND HARD COPY BIDS WILL NOT BE ACCEPTED. All bids shall be electronically submitted through www.PROCORE.com. At any time during the bidding process, you may download and print the various bid documents for your company’s records. Additional instructions to complete the other bid forms are accessible on the Procore website. Filed Sub Bids are due by Friday March 14th at 2:00PM. General Bids are due by Friday March 21st, at 2:00PM. The Awarding Authority reserves the right to reject any and all bids and to waive any informalities in the bidding process if it is in the public interest to do so. The Awarding Authority also reserves the right to reject the bids if less than three bids are received. Bids shall remain in effect for 60 days, Saturdays, Sundays and legal holidays excluded after opening. Successful bidders shall agree to commence work and complete the Work in accordance with the dates set forth in the Bidding Documents and Contract Documents. Interested in bidding on future CHA Projects? Go to CHA’s Interested Vendor page at www.cambridge-housing.org and enter your company’s contact information for our future bid solicitations. Please include your company’s info, a contact email, and the trade(s) that your company provides so we can send you future projects directly. LEGAL NOTICE CAMBRIDGE HISTORICAL COMMISSION Notice is hereby given that a public meeting will be held on Thursday, March 6, 2025, at 6:00 PM to consider the following matters under M.G.L. Ch. 40C and Ch. 2.78 of the Code of the City of Cambridge: This meeting will be held online with remote participation. The public may participate via Zoom webinar (https://zoom.us/) "
