["https://www.cambridgeday.com/category/arts-and-culture/food/snack"]
title = "Snack Archives - Cambridge Day"
full_description = "The Nine Bar Espresso shop in Somerville’s Davis Square, has a solid pastry selection with the added fun of ordering through a window. After a long wait, babka – the sweet treat sometimes described as “part bread, part cake” – arrives in Cambridge’s Kendall Square. With almost its whole menu under $10, Tasty Burger is a mainstay in Central and Harvard squares for inexpensive burgers and sandwiches. Achilito’s in Harvard Square has a long menu of burritos with various meats and other fillings that are a solid option for a cheap but filling meal. These dumplings are a nice way to start a meal at Porter Square’s newest addition, Black Ruby Thai Craft Burger and Dining. A hand pie bigger than your hand, in flavors from Greek to Mexican, for as little as $7.50 at North Cambridge’s gourmet family-run farm stand. Revival is usually a solid pick for good coffee and good food in one place, but avoid the Salt-N-Pepa sandwich from its breakfast menu. Even if it could’ve done with a less doughy shell, this empanada from a new Cambridgeport location is warming and well spiced – worth its salt. A huge cookie in Cambridge, this time from a primarily coffee-focused shop but once again somehow simultaneously overwhelming and underwhelming. A new artisanal ice cream called Van Leeuwen has come to town – we tried the praline butter cake variety – and it’s actually very good."
