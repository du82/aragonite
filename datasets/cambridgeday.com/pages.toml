["https://www.cambridgeday.com/category/arts-and-culture/fashion"]
title = "Fashion Archives - Cambridge Day"
full_description = "There are questionable choices on the streets in freezing temperatures. Amid the chaos, one group seems to have winter style figured out. You may have already noticed animal prints making a comeback in our streetwear, with cheetah, leopard and even zebra patterns sneaking into fashion since late last year. But there’s more thar can we expect this spring. Harvard has an argument to make for being our most romance-coded square, which can come in handy for the upcoming Valentine’s Day. First ladies have long used fashion as a means to convey the values of a new administration. Here’s what Melania Trump wore Monday. If you have tickets for a music festival and need outfit inspiration, these lookbooks courtesy of the lovely attendees of Boston Calling are for you. Fashion became a communal celebration at Streets & Avenues, a hip-hop event at an unlikely location – MIT’s Music and Theater Arts Department – hosted by McKersin Previlus, a lecturer and artist-in-residence at the school. Three events in Cambridge this weekend bring back Studio 54 and the 1970s. Here’s how to dress – and shop – your way into the resurgent decade of disco. Instead of paying for holiday overnight gift shipping, support local businesses. If you’re struggling with figuring out what to get last-minute for the fashion-focused people in your life and where to find it, this guide is for you. The newest edition of the flea market Found is in Central Square for the next six months, arrayed in three storefronts down Columbia Street off Jill Brown-Rhone Park. Among the many grassroots sellers at The Foundry’s vintage-and-vinyl fair known as Found, one booth stood out for its collection of intricate clothing and its popularity."
