["https://www.cambridgeday.com/category/arts-and-culture/comedy/laugh"]
title = "Laugh Archives - Cambridge Day"
full_description = "“Come celebrate the men in your life by listening to women” is how the collective Men in Comedy pitches its second annual “Men’s History Month” show. In Wyrd’s “Silly Love Songs” you can fulfill your dream of living inside a musical, then look in on “New Faces in Hell,” in which the cast arrives in the underworld. As Black History Month draws to a close, Gordon Baker-Bone brings “Drunk Black History” to town and raises a glass to some hidden figures. A/V Comedy Club co-curators Jack Simon and Cem Illhan have built the kind of comedy space you’d expect to find in Kendall Square – exacting, technical and cerebral (while still being very funny). Much like their work on Max’s “Our Flag Means Death” and for the online satirical magazine Reductress, Jes Tom’s comedy delights in subverting assumptions. Living through sexual misadventures can feel humiliating, but Natalie Wall knows there’s something compelling about hearing them happen to other people. He’s Juror No. 11 on Freevee’s “Jury Duty,” Eric on Max’s “The Sex Lives of College Girls” and Matt on NBC’s “St. Denis Medical,” but Mekki Leeper is first, foremost and always a working stand-up eager to share an hour with an audience. While there’s a long lineage of Jewish performers in comedy, it’s tended to privilege a small segment of white, cynical male perspectives – the Mort Sahls, Lenny Bruces and Jerry Seinfelds. A new show aims to widen that scope. The best roast battlers walk the line between being incisive toward their opponent and making a joke broad or familiar enough that the audience can get it. It has to stun but not debilitate. Each line requires a likable bravado. The “L’Chaim Laugh Fest” launches at The Rockwell in the new year, at the very end of Hanukkah, preceded by a “Chosen Show” at The Comedy Studio."
