["https://www.cambridgeday.com/2025/02/28/suspects-in-the-port-gun-incident-are-charged-including-a-17-year-old-from-cambridge"]
title = "Suspects in The Port gun incident are charged, including a 17-year-old from Cambridge - Cambridge Day"
description = "Three kids have been charged with firearm offenses after what authorities are calling a “brazen daytime shooting” in The Port neighborhood of Cambridge."
full_description = "Suspects in The Port gun incident are charged, including a 17-year-old from Cambridge by Marc Levy | Feb 28, 2025 | News | 0 comments Home | News Suspects in The Port gun incident are charged, including a 17-year-old from Cambridge By Marc Levy Friday, February 28, 2025 Marc Levy Cambridge police commissioner Christine Elow at a January community meeting. Three kids have been charged with firearm offenses after what authorities are calling a “brazen daytime shooting” on Monday in The Port neighborhood of Cambridge. The charges were filed against a 14-year-old Bostonian; 15-year-old from Framingham; and a 17-year-old Cantabrigian. “Gun violence, particularly violence involving youth, has been an ongoing concern and a top priority for the Cambridge Police Department,” said the city’s police commissioner, Christine Elow, on Friday. She said she was glad officials “were able to quickly identify and bring charges against those believed to have been responsible for this troubling act of violence.” At around 2:15 p.m. Monday, an argument between two people led to one shooting at the other multiple times, hitting no one, police said. The suspects fled. Within moments of the incident, a police officer overheard talking on a police scanner said he had “one at gunpoint” at the Central Square CVS. Investigators spoke with witnesses and collected surveillance video from around where the shooting took place at Bishop Allen Drive and School Street. That helped detectives identify the three kids, according to a Friday press release from the office of Middlesex district attorney Marian Ryan. A search warrant was obtained and served at the Cambridge kid’s home. It yielded “additional evidence, including a 30-round capacity magazine and ammunition” that linked the suspects to the shooting, Ryan said. Court proceedings against people below the age of 18 are generally closed to the public, but Ryan’s office released the charges heard during arraignments: The 17-year-old Cantabrigian: Assault with a dangerous weapon, discharging a firearm within 500 feet of a building, carrying a firearm without a license, possessing a firearm and ammunition without a license. He was also charged with possession of a large-capacity magazine and ammunition. The 14-year-old Bostonian: Assault with a dangerous weapon The 15-year-old from Framingham: Accessory after the fact and assault and battery on a police officer – because he threw an object at an officer, officials said. The kid also damaged items in the interview room at the Cambridge Police Department, they said. Previous story Gunfire in The Port leads off a ‘significant surge’ including incidents in Somerville and Belmont February 26, 2025.previous-next { margin-bottom: 30px!important; } Belmont, Somerville, The Port, gunfire, police Submit a CommentYou must be logged in to post a comment."
