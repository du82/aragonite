["https://www.cambridgeday.com/category/arts-and-culture/comedy"]
title = "Comedy Archives - Cambridge Day"
full_description = "“Come celebrate the men in your life by listening to women” is how the collective Men in Comedy pitches its second annual “Men’s History Month” show. In Wyrd’s “Silly Love Songs” you can fulfill your dream of living inside a musical, then look in on “New Faces in Hell,” in which the cast arrives in the underworld. As Black History Month draws to a close, Gordon Baker-Bone brings “Drunk Black History” to town and raises a glass to some hidden figures. After a frigid parade winding through Harvard square, Oscar nominee and “Wicked” star Cynthia Erivo was awarded the Hasty Pudding Theatrical Society’s 75th Woman of the Year honor and a Pudding Pot to match. Mike Dorval, a longtime presence on the Boston comedy scene, revealed a lymphoma diagnosis last fall. The Boston comedy community is rallying around. A/V Comedy Club co-curators Jack Simon and Cem Illhan have built the kind of comedy space you’d expect to find in Kendall Square – exacting, technical and cerebral (while still being very funny). Harvard’s Hasty Pudding Theatricals awarded its 58th Man of the Year honor Friday to “Mad Men” and “Landman” actor Jon Hamm. Much like their work on Max’s “Our Flag Means Death” and for the online satirical magazine Reductress, Jes Tom’s comedy delights in subverting assumptions. The characters Mekki Leeper plays on television’s “Jury Duty,” “The Sex Lives of College Girls” and“St. Denis Medical” share an undercurrent of anxiety, but chatting ahead of a sold-out stand-up show, there was an ease to him. Living through sexual misadventures can feel humiliating, but Natalie Wall knows there’s something compelling about hearing them happen to other people."
