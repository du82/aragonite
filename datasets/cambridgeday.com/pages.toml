["https://cambridgeday.com/about"]
title = "About this site - Cambridge Day"
description = "Cambridge Day is a Web-only source for news and entertainment about Cambridge and surrounding communities."
full_description = "About this site Cambridge Day is published by Cambridge News Inc. ABOUT CAMBRIDGE NEWS INC. A coalition of Cambridge residents have launched a nonpartisan newsroom dedicated to in-depth journalism that will help residents make informed decisions to better their lives and hold local institutions accountable. Research shows that while Cambridge is a hub of innovation and civic engagement, its 120,000 residents lack access to consistent reporting on local government, education, housing, community happenings and issues. Our rebuilt news source will address this critical gap in local journalism, and so we seek your counsel. As a first step, we have established a nonprofit news organization, Cambridge News Inc., to be led by a community based board, and we have acquired the current Cambridge Day. Additionally, the Cambridge Community Foundation has established and seeded a Local News Fund that will support Cambridge News Inc. Next, we plan to hire a Publisher, an Editor-in-Chief, and reporters to transform Cambridge Day into a vital, trusted news outlet for Cambridge, using a range of media. Here’s a link to a report reflecting what led us to this point. Supporting Cambridge News Inc. – There are many ways to financially support the mission of Cambridge News Inc. – personal checks, DAF transfers, securities, ACH, QCD from an IRA or online. Click here for more information about supporting Cambridge News Inc. For coverage of films, film events and repertory series: Film editor Tom Meek at [email protected] Getting published or being heard: If you feel you have time and skills to contribute, make contact at [email protected]. (Letters may be sent for posting to [email protected]; news tips or other communication with the editor that isn’t intended to appear on the website with your name attached should be sent to [email protected].) Corrections, updates and clarifications The editor is interested in learning of and correcting errors of fact, quote or context as quickly as possible. If necessary, the editor can be reached at (617) 230-9632, although email is the preferred means of communication. Text can be linked to and cited under the principles of fair use; use of Cambridge Day photos should be requested by contacting the editor at [email protected]. Some content appeared previously on a blog maintained by the editor or in the print edition of Cambridge Day, which was distributed around the city during October and November 2005. While in certain high-profile settings, heavy reliance on previously written material may be disappointing to readers and therefore bad PR for a publication, in general the editor does not believe you can “plagiarize” yourself. A post that relies significantly on information from a press release that hasn’t been independently verified by Cambridge Day, however, will be identified as such. Failure to do so is an error that will be corrected upon notification of the editor. ADVERTISING There are three primary ad locations on the website that can be used in combination: A box that appears on all stories is $150 a week; the bar above the flag is $150 a week; homepage placement alone, which is also slightly smaller than an ad that appears on all pages, is $75. Getting both a box that appears on all stories is and the bar above the flag is $225 weekly. Homepage placement plus the top bar is $200. All three (homepage, bar and all “inside” pages) is $300. The bar above the flag is an exclusive spot; the other placements may have ads from other businesses appearing either above or below. All ad placements get placement on mobile as well, but only two mobile placements are allowed at a time. Cambridge Day has an advertising partnership with a news publisher in Arlington (YourArlington.com), and combination rates are available. Local performance ad policy: To promote local arts for which admission is typically charged, Cambridge Day accepts advertising at lower rates for small, local arts organizations or performers holding events within Cambridge and Somerville. Payment must be in advance by paper check or through the Blink donation boxx. The offer is based on the advertiser providing images to post (typically with a link to a website). Please inquire at [email protected] or 617.230.9632. This page’s local performance ad policy was updated Nov. 1, 2023."
