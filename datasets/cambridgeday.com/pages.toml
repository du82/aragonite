["https://www.cambridgeday.com/category/arts-and-culture/design"]
title = "Architecture + Design Archives - Cambridge Day"
full_description = "A Musical Fence interactive art installation is back in Cambridge permanently in the common at Cambridge Crossing, inspired by works seen on the streets of Central Square in 1980. Four finalist art proposals are in for the remaking the Tobin Montessori and Vassal Lane Upper Schools in West Cambridge. The winner of the $650,000 commission won’t be announced until November, but the first step to a decision is homework: learning about each project. Improvements to Palmer Street, the alley in Harvard Square, debuted officially Friday. New planters, public art displays, games and more were installed with the goal of making Palmer Street a more inviting public space. Just A Start, a Cambridge nonprofit, has updated its brand with a new website, logo and tagline – “Building homes, careers and futures” – with the help of teen artists and designers at the Artists For Humanity studio. I know people watch movies on their phones and someone will get rich streaming movies on smartwatches, or at least streaming TikTok videos. But after a year of watching movies online I am so looking forward to watching movies in an actual movie house. At a time most Bostonians are either befuddled or enraged by the development they see and experience, it is worthwhile to review some of the dissenting and cautionary literature. Peter Blake took on the Brutalist Paul Rudolph and Le Corbusier’s “Radiant City.” Overall, planning has been fitful and opaque here, with developers nurturing political connections to city councillors in exchange for approval of projects on an ad hoc basis. What if we leveraged our strengths toward a better approach? I begin by confessing that I have a weakness for Taco Bell, though I don’t understand the menu. I visited one before or after foreign movies at the long-vanished Nickelodeon theater; at Prospect and Hampshire streets; and in North Cambridge, a KFC combination known to locals as “Ken-taco.” Incorporating a historically significant home into a redevelopment plan proposed for 169 Rindge Ave. in North Cambridge could mean a home from the Ulysses S. Grant era bumping up against cubist structures from the time of Trump. The developer’s done something similar nearby."
