title = "Men and their history, by the people who know them best. Maybe second-best. - Cambridge Day"
description = '“Come celebrate the men in your life by listening to women" is how the collective Men in Comedy pitches its second annual “Men’s History Month” show.'
full_description = "Men and their history, by the people who know them best. Maybe second-best. by Amma Marfo | Mar 1, 2025 | Laugh | 0 comments Home | Arts + Culture | Comedy | Laugh Men and their history, by the people who know them best. Maybe second-best. By Amma Marfo Saturday, March 1, 2025 Lloyd Sharp Men in Comedy co-producer Viv Martin. “Come celebrate the men in your life by listening to women” is the pitch for the all-femme comedy collective Men in Comedy’s second annual “Men’s History Month” show. Held cheekily each Women’s History Month, it features stand-up from some rising female and nonbinary comedians who are “willing to speak on men’s experiences for them.” Last year’s inaugural edition was Men in Comedy’s biggest show to date and “proved that, contrary to some of the things male comics had advised us, so many people are eager to show up for an all-femme lineup,” coproducer Viv Martin said. In addition to its roster, Men in Comedy is becoming infamous for the activities alongside the jokes. Previous shows have included animation-themed poetry slams, art auctions and drinking games with pies in the face as punishment; this year’s historically aware show includes trivia about, as they put it, “the greatest moments in men’s history.” “Men in Comedy Presents: Men’s History Month” at 9 p.m. March 14 at The Rockwell, 255 Elm St., Davis Square, Somerville. $15 to $20. Comedy, Davis Station, Somerville, gender Submit a CommentYou must be logged in to post a comment."
