title = "Film Ahead Archives - Cambridge Day"
full_description = "A scrappy UHF station with its finger on the pulse of a thriving music scene, the three films that swept all five of the top Oscar categories, David Lynch from his creative team and cinéma vérité genius Frederick Wiseman come to our screens. Tributes continue for the dearly departed David Lynch as well as for the undersung Tarsem Singh, while the Harvard Film Archive introduces the Harvard Undergraduate Cinematheque and reintroduces “Eephus” director Carson Lund. This year brings the 50th Boston Sci-Fi Film Festival to the Somerville Theatre, “Casablanca” and other favorites to The Brattle. Also on the schedule: The Bugs Bunny Film Festival, the Fleischer Studios’ Greatest Hits and York Cat Film Festival at Kendall Square. Experience the “Dread of Winter” at The Brattle with films such as “Repulsion” and David Lynch’s increasingly esteemed “Twin Peaks: Fire Walk With Me,” scare yourself silly in Someville with with Italian Giallo and prepare for the 50th Boston Sci-Fi Film Festival. The Harvard Film Archive goes back to the 1900s for works by Georges Méliès, while the Somerville Theater reassesses “Jennifer’s Body” from 2009 and shows “Once Upon a Time … In Hollywood” in 70 mm. The Brattle, meanwhile, has French winter dread and German queer cinema. From “Anora” to “The Substance,” cinema proved itself still vibrant last year, and The Brattle has the reels to prove it. The Harvard Film Archive, meanwhile, adds Rosine Mbakam of Cameroon to its ongoing celebration of French New Waver Delphine Seyrig. The Harvard Film Archive returns from winter break with an overdue tribute to French New Wave actor Delphine Seyrig and the Belmont World Film’s Family Film Festival is back too, bringing cinema for the kids to The Brattle screens. Infamous X-rated 1979 epic “Caligula” has a new version in time for a new age of Trump; new linked docs travel to tense times through time; “The Sting” shines for Oscar gold; and High Energy Vintage screens ’80s kiddie schlockfest “Mac and Me.”"
