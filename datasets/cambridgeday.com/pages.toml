title = "Comics Archives - Cambridge Day"
full_description = "This weekend’s Massachusetts Independent Comics Expo is expected to draw thousands, but now to Boston instead of where it started in Porter Square. Its driving force remains here, though, in Dan Mazur, co-founder of the Boston Comics Roundtable. After the all-virtual Massachusetts Independent Comics Expo demanded by 2020’s raging pandemic, the free event returns Saturday and Sunday in a new form defined by a more confusing Covid moment: as a Mini-MICE with room to breathe inside the open-air Starlight Square entertainment complex. Cambridge became home to a new comics and memorabilia shop, Amaya Bros. Comics, Aug. 1, and Somerville can expect open doors at a renovated Hub Comics in Union Square as soon as late this week. What’s normally a one-day event has become even broader five days of discussion on comic books, science fiction, fantasy, cosplay and other aspects of pop culture, still focused on creators who are women, non-binary, LGBTQ and people of color. (But open to all.) The Boston Comics Roundtable – which until the coronavirus shutdown met weekly to write and draw in its not-so-secret lair in Porter Square – has created its first series designed specifically for kids, and especially for local kids: “Boston Powers.” Cambridge Day is not getting a comics page – not yet, anyway. But starting this weekend, its free email newsletter (subscribe here) adds the first comics panel of work from the artist at Star Jelly on Instagram. People are coming from as far as Los Angeles, Seattle and France for this weekend’s Massachusetts Independent Comics Expo, but for some local comics professionals the gathering never ends. A Boston Comic Roundtable anthology on the wonders of science has far exceeded its crowdfunding goal – overshooting the $8,000 the editors asked by nearly $6,500 with about a week to go in the campaign. Along with Gillian Anderson of “The X Files” and Stan Lee and other comics creators who travel the country from one comics and entertainment convention to the next, the eighth Boston Comic Con will have a taste of the hometown."
