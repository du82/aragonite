["https://www.cambridgeday.com/2025/02/27/a-week-of-events-in-cambridge-and-somerville-from-mardi-gras-fun-to-an-outdoor-maple-boil"]
title = "A week of events in Cambridge and Somerville, from Mardi Gras fun to an outdoor maple boil - Cambridge Day"
description = "In a look ahead at a week of Cambridge and Somerville events, there are sweaty dance parties and Mardi Gras, a maple boil and hot chocolate bar, Grand Bazaar, “American Jezebel” opera and visits with Angélique Kidjo and Ngozi Adichie."
full_description = "A week of events in Cambridge and Somerville, from Mardi Gras fun to an outdoor maple boil by Monica Velgos | Feb 27, 2025 | Events ahead | 0 comments Home | Arts + Culture | Events ahead A week of events in Cambridge and Somerville, from Mardi Gras fun to an outdoor maple boil By Monica Velgos Thursday, February 27, 2025 Thursday, Feb. 27 Lauren Francis-Sharma via social media Lauren Francis-Sharma is set to read in the coming week in Cambridge. Thursday Morning Talks: Sabrineh Ardalan on “Seeking Safety: Asylum and the Border” from 10:15 a.m. to noon at Holy Trinity Armenian Church, 145 Brattle St., West Cambridge. $20, and registration is required. Ardalan, as director of the Harvard Immigration and Refugee Clinical Program, trains law students engaged in deportation defense, district court and appellate litigation and policy advocacy and teaches courses on trauma, refugees and international labor migration. The January and February lecture series is a fundraiser for Mount Auburn Hospital in its 88th year. Information is here. “Trump 2.0: Journalistic Insights on U.S.-Asia Relations” panel discussion from 11:45 a.m. to 1:30 p.m. in the Belfer Case Study Room at Harvard University’s Fairbank Center for Chinese Studies, South Concourse, S020, 1730 Cambridge St., Harvard Square. Free. Voice of America’s Steven L. Herman, The Washington Post’s Josh Rogin and The New York Times’ Edward Wong discuss shifting geopolitical dynamics in Asian countries. Moderated by James Robson, director of the Harvard-Yenching Institute. Information is here. Danehy Park winter plant walk from 4 to 5:30 p.m. meeting at the parking lot of Danehy Park at 99 Sherman St., in Neighborhood 9 just east of Fresh Pond, Cambridge (rain date: March 6). Free, but register. Stroll the park with clinical herbalist Mo Katz-Christy to discover and learn about weeds, cultivated plants, trees and shrubs. Bring a notebook, if you like. Information is here. Transforming Learning: Speculative Climate Design from 4 to 6 p.m. at The MIT Museum, 314 Main St., Kendall Square, Cambridge. Free with museum admission (teens free). A panel discussion explores the benefits of designing alternative futures, including a hands-on exercise. Information is here. Harvard Art Museums at Night from 5 to 9 p.m. in the Calderwood Courtyard at Harvard Art Museums, 32 Quincy St., near Harvard Square, Cambridge. Free. During this recurring event, wander exhibits (including the new one by Joana Choumali), catch spotlight tours, browse the shop, enjoy sounds from DJ C-Zone and buy refreshments from Jack’s Abby. This month, staff from the American Repertory Theater offer a Grecian-themed scavenger hunt – with clues that untangle museum mysteries – to promote their production of “The Odyssey.” Information is here. ArtsThursdays: “The Power and Bias of Measurements” conversation from 6 to 7 p.m. at the Harvard Science Center, Hall A, 1 Oxford St., near Harvard Square, Cambridge. Free, and RSVP preferred. Colombo-American artist Nancy Friedemann-Sánchez with a panel of professors of history of medicine and science discuss how art can illuminate the systems that measured humans for the slave trade and persist in Latin America and the United States. The related exhibition “Measuring Difference” is free to browse. Information is here. Central Square Cooks! cookbook club from 6 to 7 p.m. at the Cambridge Public Library Central Square Branch, 45 Pearl St. Free. This month, make and bring a dish from “Jubilee: Recipes from Two Centuries of African American Cooking” by Toni Tipton-Martin – or just come to talk about your experience with this cookbook. Information is here. “BeeFound: Washington & Wheatley Write!” lecture and poetry workshop from 6 to 8 p.m. in the carriage house at Longfellow House and the Washington’s Headquarters National Historic Site, 105 Brattle St., West Cambridge. Free, but register. Local Poet Populist emeritus Toni Bee and Northeastern University’s Nicole Aljoe discuss Phillis Wheatley Peters, one of the best-known poets in pre-19th century America who was also an enslaved person, and explore if her international fame influenced the politics of our nation’s first president. Includes poetry prompts for writing, an open mic for sharing and dinner. Information is here. “The Weighing of Souls: A Lecture Performance” from 6:30 to 8 p.m. in the Cader Room at Swartz Hall, 45 Francis Ave., Harvard Divinity School, in the Baldwin neighborhood near the Somerville border, Cambridge. Free, but register. Alice Oswald, poet-in-residence at the Center for the Study of World Religions, tries to find one of the lost plays of Aeschylus. Co-sponsored by the Authors Guild Foundation. Information is here. Death Cafe from 6:30 to 8 p.m. at the Somerville Public Library East Branch, 115 Broadway. Free, but register. Not a bereavement or counseling session, but an opportunity to engage in interesting and thought-provoking conversations “to increase awareness of death with a view to helping people make the most of their (finite) lives.” Tea and cake served. Information is here. “The Odyssey” adapted by playwright Kate Hamill at 7 p.m. at the Loeb Drama Center, 64 Brattle St., Harvard Square, Cambridge (and continuing through March 16). $60 to $150 and 14-plus. A contemporary take on Homer’s “Odyssey” that reimagines the stories of both Odysseus and his wife, Penelope, and asks how we can learn to embrace healing and forgiveness so cycles of violence and revenge can end. We wrote about it here. Information is here. Lauren Francis-Sharma reads from “Casualties of Truth” at 7 p.m. at Harvard Book Store, 1256 Massachusetts Ave., Harvard Square, Cambridge. Free. The novelist discusses her thriller set between Washington, D.C., and Johannesburg, South Africa. Journalist Mark Cecil of “The Thoughtful Bro” podcast joins. Information is here. “Majority Rules: An American Musical” at 7 p.m. at The Rockwell, 255 Elm St., Davis Square, Somerville. $15 to $20 and 16-plus. Emerson and Berklee students wrote this musical about a U.S. presidential candidate who campaigns to eradicate Greek life nationwide, and the “Frattiest Frat Bro of the Year” who leads a newly formed Greek Party to victory. Information is here. Seven poets read from 7 to 9 p.m. at Café Phinista, 1876 Massachusetts Ave., Porter Square, Cambridge. $15 to $20. “Espresso your thoughts, steep in poetry… and mingle over mugs and metaphors” while listening to poets Philip Nikolayev, Jean Dany Joachim, Pedro Poitevin, Willy Ramirez, Jonathan Bennett, Alan Smith Soto and Michael McCarthy. Information is here. This Music series from 7 to 10 p.m. at Lilypad, 1353 Cambridge St., Inman Square, Cambridge. $10 to $15. The first set is violinist Ángela Varo’s Bulla with Isaac Romagosa (guitar), Rafael Heredia Horimoto (percussion), Ferran Rico (electric bass) and Arman Wali (keys); the second set features trumpeter Lemuel Marc with Bahar Badieitabar (oud), Maliq Wynn (drums), Aidan Devine (bass) and Hidemi Akaiwa (piano). Information is here. Blues Union February Dances: Tea Talks for Black History Month from 7 to 11 p.m. at Dance Union, 16 Bow St., Union Square, Somerville. $10 to $25. An all-levels lesson in the first hour then an hour of Tea Talk (community conversations and group actions) followed by two hours of social dancing. Wear shoes that allow you to pivot; no need to bring a partner. Masks and proof of vaccination required. Information is here. Being Human: Storytelling and readings at 7:30 p.m. in the blue wing at the Museum of Science, 1 Science Park, Boston, on the Cambridge border. Free with preregistration and 18-plus. A panel of Emerson College community members, including bestselling author P. Carl, explore questions such as “How are our bodies and brains connected?” as part of the college’s partnership with the museum as it launches its “being human” focus this year. Information is here. Chilean songwriter Nano Stern at 7:30 p.m. at Club Passim, 47 Palmer St., Harvard Square, Cambridge. $28 to $30. The multilingual multi-instrumentalist performs on the final day of his Berklee College of Music residency. His ninth and most recent studio recording “Aún creo en la belleza” [I still believe in beauty] “builds a refuge of words and sounds that reflect the worries and calmness of the intense times in which we live,” and his voice sounds a little like Cat Stevens. Information is here. Anikaya Dance Theater presents “Conference of the Birds” at 8 p.m. at Arrow Street Arts, 2 Arrow Street, Harvard Square, Cambridge (and continuing through March 9). $1 to $65. This multimedia movement theater work inspired by the 12th century poem of Farid Ud din Attar depicts stories gathered from refugees and other migrants. Choreographer Wendy Jehlen collaborated with dancers, choreographers, musicians and video artists from 12 countries. Information is here. Friday, Feb. 28 Angélique Kidjo via social media Angélique Kidjo comes to Somerville on Friday. “Balancing Majority and Minority Rights” conference from 9:15 a.m. to 5:30 p.m. at Adolphus Busch Hall, lower level conference room, 27 Kirkland St., near Harvard Square, Cambridge. Free. German, Austrian and U.S. political scientists and legal scholars discuss the consequences of democratic backsliding. Information is here. Susan Meiselas talks about her “44 Irving Street, Cambridge, MA” photography exhibition from 12:30 to 1 p.m. at Harvard Art Museums, 32 Quincy St., near Harvard Square, Cambridge. Free, but check in at visitor services to join. The artist’s 1971 photo series provides an intimate look into rooms in a Cambridge boarding house where she and diverse other tenants lived. Information is here. National Day of Reading: A Celebration of Trans Stories from 4 to 5 p.m. at the Cambridge Public Library Central Square Branch, 45 Pearl St. Free, but registration is helpful. Librarians read aloud from books that support and affirm transgender and nonbinary youth at an all-ages story time. Refreshments provided. Information is here. Witnesses: Ukrainian Writers Documenting Russia’s War from 5 to 6:30 p.m. in the Fong Auditorium of Boylston Hall, Harvard Yard, Cambridge. Free. Writer and editor Sasha Dovzhyk discusses the recent poetry and prose by fellow Ukrainians, including novelist Victoria Amelina’s posthumously published testimony, reportage and memoir “Looking at Women Looking at War.” Also via Zoom. Information is here. Cantata Singers Community Sing with guest artist Sophia Miller at 6 p.m. at Arts at the Armory, 191 Highland Ave., Somerville. $25. An opportunity for musicians and nonmusicians of all ages to select from a list of songs that includes the Beatles’ “Across the Universe.” Food and drinks provided. Information is here. “Ex Uno Plures” art exhibit opening reception from 6 to 8 p.m. at the Cambridge Center for Adult Education, 42 Brattle St., Harvard Square. Free. Works in printmaking, bookbinding and paper arts created by visual arts students and instructors in the center community. Information is here. “Psyched Out” Improv at 7 p.m. at The Rockwell, 255 Elm St., Davis Square, Somerville. $17 to $22. First, live psychic readings. Then comedy based on those readings. Information is here. “The Odyssey” adapted by playwright Kate Hamill (continued) at 7 p.m. at the Loeb Drama Center, 64 Brattle St., Harvard Square, Cambridge. $124 to $150 and 14-plus. Information is here. Sam Klug reads from “The Internal Colony: Race and the American Politics of Global Decolonization” at 7 p.m. at Harvard Book Store, 1256 Massachusetts Ave., Harvard Square, Cambridge. Free. The Loyola University Maryland professor discusses how policy debates fed discord between Black activists and state policymakers in the 1960s and 1970s. Boston University’s Chad Williams joins. Information is here. Danielle Wood presents “Harriet Jacobs: Journey to Saturn” at 7 p.m. at the Massachusetts Institute of Technology’s Media Lab, 75 Amherst St., in Area II near Kendall Square, Cambridge. Free. As part of the MIT Artfinity Festival, the director of the Space Enabled Research Group at the MIT Media Lab combines spoken word, music and dance to examine concepts of space through the writings of 19th century African American poets and abolitionists, revealing a perspective of home visible only through satellite imagery. Information is here. Detention stand-up comedy with Salma Zaky at 7, 9 and 11 p.m. at Goofs Comedy Club, 432 McGrath Highway, Prospect Hill, Somerville (and Saturday). $25 and 21-plus. A weekend of performances from a New York transplant from Los Angeles with Egyptian and French background who was named a “Comic to Watch” at the 2024 New York Comedy Festival. Information is here. Josiah Reibstein and the HubTones Mardi Gras Party at 7:30 p.m. at Regattabar, 1 Bennett St., Harvard Square, Cambridge. $20 to $30. Guest vocalist Robbie Pate joins Reibstein (bass and tuba), Dan Gabel (trombone and vocals), Annie Linders (trumpet and vocals), Joseph Thieman (piano, accordion) and David Andrew Moore (drums). Information is here. Eliza Carthy performs from 7:30 to 9:30 p.m. at Luthier Collective, 487 Somerville, Ave., near Union Square, Somerville. $20 to $25. The daughter of English traditional folk legends Martin Carthy and Norma Waterson sings and fiddles in a repair shop that sometimes hosts small acoustic performances. Information is here. Anikaya Dance Theater presents “Conference of the Birds” (continued) at 8 p.m. at Arrow Street Arts, 2 Arrow Street, Harvard Square, Cambridge. $1 to $65. Information is here. Angélique Kidjo at 8 p.m. at the Somerville Theatre, 55 Davis Square. $48 to $79. The five-time Grammy-winning Beninese star returns with a blend of West African traditions and elements of American R&B, funk and jazz. Information is here. Hasty Pudding Theatricals presents “101 Damnations” at 8 p.m. at Harvard University’s Farkas Hall, 12 Holyoke St., Harvard Square, Cambridge (and continuing through March 9). $51. This year’s original musical is set in hell with pun-named characters navigating and scheming against the forces keeping them from getting what they want (often a reassignment to heaven), including its chief executive, Lucy Fur. Information is here. The Bevis Frond performs at 8 p.m. at Somerville Theatre’s Crystal Ballroom, 55 Davis Square. $25 to $30. U.K. guitarist and songwriter Nick Saloman brings “an iconoclastic collision of distinctly British psychedelia, space-rock, grunge, slow-burning soulful laments, even grizzled folk and more-than-occasional moments of sublime pop genius.” Information is here. Harvard Wind Ensemble Spring Concert at 8 p.m. at Harvard’s Lowell Lecture Hall, 17 Kirkland St., Harvard Square, Cambridge. Free. Founded in the 1960s, the ensemble offers musicians of the Harvard community the opportunity to study and perform original literature for winds and percussion. Information is here. The Toni Lynn Washington Band at Boston Swing Central from 8 to 11:45 p.m. at Q Bal"
