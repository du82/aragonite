["https://www.cambridgeday.com/category/arts-and-culture/issues"]
title = "Issues Archives - Cambridge Day"
full_description = "The president of Harvard made an unjust decision in 1890, against his own directives, that silently smoothed the path for multitudes of much worse injustices to come – injustices that tore through the 20th century and still afflict us. Please enjoy the recording of the Jan 29 Conversation on Multifamily Housing. We heard loud and clear from readers that more coverage on the topic of multifamily zoning would be valuable. To that end, we found 3 speakers who are knowledgeable on the to … Leaders in urban planning and housing advocacy come together to talk about multifamily zoning reform under consideration by Cambridge’s City Council. In a final installment of Black Cambridge trailblazers for 2024, meet men who excelled as athletes and went on to work with youth and in expanding college multiculturalism and as an award-winning producer and director in documentary television. Meet two extraordinary women born and raised in Cambridge who broke barriers and extended the boundaries of their respective careers. We continue Black History Month with Emory Clark, who dreamed of owning his own pharmacy and made it come true (with a sideline in ice cream), and Charles Lenox, whose quiet work helped build Cambridge business community in the early 1800s. We begin Black History Month with Rowena Taylor, a midcentury Cambridge assistant city solicitor and a lawyer in private practice with an office in the Abbot Building in Harvard Square; and Dr. Mary Crutchfield Wright Thompson, a 1930 Tufts Dental School grad known as “Dr. Mary” to generations of Cambridge students. Protests disrupting City Council meetings. Physical clashes with police. The furious signing of petitions and letters and equally furious reactions to them. If a comeback for progressive activism is underway, here are two more items for the argument. We are indebted to the sacrifices made by our veterans to ensure the freedoms of all Americans. We honor them and thank them for their service. Robert Gilbert was a Black man who lived in Inman Square, a respected member of the community – and a genius ornithologist, photographer, musician, chef, entrepreneur and possibly even model for an F. Scott Fitzgerald character."
