title = "Film Archives - Cambridge Day"
full_description = "A scrappy UHF station with its finger on the pulse of a thriving music scene, the three films that swept all five of the top Oscar categories, David Lynch from his creative team and cinéma vérité genius Frederick Wiseman come to our screens. In theaters and streaming now are the Osgood Perkins horror film “The Monkey’ and sci-fi action mishmash “Elevation.” Tributes continue for the dearly departed David Lynch as well as for the undersung Tarsem Singh, while the Harvard Film Archive introduces the Harvard Undergraduate Cinematheque and reintroduces “Eephus” director Carson Lund. In theaters and streaming now are “Bridget Jones: Mad About the Boy,” a sequel that returns a series to greatness, terrific musical doc “Sly Lives! (aka the Burden of Black Genius)’ and “Captain America: Brave New World.” This year brings the 50th Boston Sci-Fi Film Festival to the Somerville Theatre, “Casablanca” and other favorites to The Brattle. Also on the schedule: The Bugs Bunny Film Festival, the Fleischer Studios’ Greatest Hits and York Cat Film Festival at Kendall Square. In theaters and streaming now are the thrilling and largely true “The Order,” action comedy with a touch of romance “Love Hurts” and starry but silly “The Gorge.” Experience the “Dread of Winter” at The Brattle with films such as “Repulsion” and David Lynch’s increasingly esteemed “Twin Peaks: Fire Walk With Me,” scare yourself silly in Someville with with Italian Giallo and prepare for the 50th Boston Sci-Fi Film Festival. Now in theaters and streaming are the Oscar-nominated Brazilian drama “I’m Still Here” and the rom-com “You’re Cordially Invited,” with Will Ferrell and Reese Witherspoon. The Harvard Film Archive goes back to the 1900s for works by Georges Méliès, while the Somerville Theater reassesses “Jennifer’s Body” from 2009 and shows “Once Upon a Time … In Hollywood” in 70 mm. The Brattle, meanwhile, has French winter dread and German queer cinema."
