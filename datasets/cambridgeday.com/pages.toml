title = "Features Archives - Cambridge Day"
full_description = "The glass industry was an early presence in the newly developing East Cambridge of the 1810s and had a decadeslong run there. Washington’s Birthday has been largely forgotten as a distinct celebration, but its commemoration in Civil War-era Cambridge provided a model for honor, patriotism and devotion to country that the city sorely needed. The Cambridge Plant & Garden Club has just completed a two-year project to identify and describe for the first time 21 pocket parks throughout the city. The executive editor of reviews and lead “gadget expert” at America’s Test Kitchen offers a cooking demonstration, Q&A and discussion of local culinary history. By the time Carter’s Ink moved to East Cambridge in 1910, where it built a factory on First Street facing the Charles River, the company had long since learned the importance of product innovation. The company was here until the mid-1970s. Martin Luther King Jr.’s three most significant public appearances in Cambridge – in 1954, 1960 and 1967 – illustrate his evolution as a preacher and activist, as well as the larger shifts in the Civil Rights Movement’s ideology. The question is whether a similar group of people interviewed today would have the same memories of growing up in the neighborhood. Do you have a story about East Cambridge to share? What aspects of the neighborhood’s past are you curious about? Where should we go and what should we focus on during our year there? One way in which Cantabrigians took action at the holiday was to raise funds for soldiers and their families – or to offer oneself and others a “clean slate,” such as by extending an olive branch to other areas of the country during civil war. In 2024, our Neighborhood History Center initiative immersed us in the heart of North Cambridge. This vibrant community, brimming with close-knit families, beloved institutions and burgeoning gems, embraced us warmly."
