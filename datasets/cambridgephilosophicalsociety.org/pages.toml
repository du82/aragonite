["https://www.cambridgephilosophicalsociety.org/funding/henslow-fellows/dr-david-willer"]
title = "Henslow Fellowship Profile | Cambridge Philosophical Society"
description = "Founded in 1819 'for the purpose of promoting scientific inquiry'. The Cambridge Philosophical Society is an exciting hub for the promotion of scientific research"
full_description = "Dr David Willer Henslow Fellow 2021- David’s research focuses on innovation in under exploited and high potential fish and seafood sectors to benefit human health and environmental sustainability as well as thought leadership to guide policy. A key component of his work is the development of novel ‘breakthrough’ aquaculture production systems. Much of this work focuses on bivalve shellfish – clams, mussels, and oysters – which are rich in protein, omega-3, and essential micronutrients, and have a lower environmental footprint than meat and many terrestrial crops. For example, David is investigating the development of a new ‘Naked Clam’ aquaculture sector, involving shell-less clams which feed on wood and grow an order of magnitude faster than other bivalves. His team is also looking at developing ‘Urban Bivalve’ production systems to enable production of bivalves more rapidly, to a higher quality and food safety level, and to enable access in new locations. He collaborates with innovative global food manufacturers on research across the supply chain to help bring bivalve-based foods to the consumer mass market. David also looks at mechanisms that could be used to drive demand of sustainable nutritious fish and seafood in place of other meat and fish products. Behavioural choice experiments have been run across University Canteens, aiming to find ways to increase consumption of sustainable bivalves and low-trophic fish. Other areas under investigation include the importance of processing to drive mass-market consumption of bivalves, the role of fish and seafood in mother, baby and brain health, and systems to drive consumption of underutilised components and by-products of fish and seafood. David works extensively on thought leading policy related projects which aim to improve the global sustainability and performance of fishery and aquaculture food systems. This includes developing new metrics and tools to assess production efficiency and footprint in for example in high-value finfish aquaculture and cephalopod fisheries. It also includes projects aiming to better define our global marine activities in order to more effectively enforce policy. This work also helps to inform David’s work on seafood production and demand to ensure that it is highly relevant and makes wise use of resources. More Henslow Profils Dr Carrie Soderman Henslow Fellow 2023- Dr Emily Mitchell Henslow Fellow 2016-2019"
