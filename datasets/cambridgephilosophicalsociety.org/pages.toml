["https://www.cambridgephilosophicalsociety.org/funding/henslow-fellowship"]
title = "Henslow Fellowship | Cambridge Philosophical Society"
description = "Three year funding across a wide range of fields – with over twenty-one Henslow Fellows receiving funding from 2010 to date."
full_description = "Three year funding across a wide range of fields – with over thirty Henslow Fellows receiving funding from 2010 to date. The Society regularly sponsors three-year Research Fellowships, “Henslow Fellowships”, in the fields of Natural Science, Engineering, Mathematics, Computer Science and Clinical Sciences. The Henslow Fellowships are awarded to selected colleges to augment research fellowship provision within Colleges, rather than to substitute for existing schemes. The aims of the Philosophical Society are “to promote research in all branches of science and to encourage the communication of the results of scientific research.” The advertisement and selection of each of the Henslow Fellowships is made by the College, in full consultation with the Cambridge Philosophical Society. Henslow Fellow Profiles Dr Tiffany Ki Henslow Fellow 2024 Dr Ankit Dilip Kumar Henslow Fellow 2024 Dr David Hardman Henslow Fellow 2024 Dr Alec Christie Henslow Fellow 2021-2024 Dr Georg Maierhofer Henslow Fellow 2023- Juan Benito Moreno Henslow Fellow 2023- Timothy Chisholm Henslow Fellow 2023- Dr Francesco Fournier-Facio Henslow Fellow 2023- Dr David Willer Henslow Fellow 2021- Dr Carrie Soderman Henslow Fellow 2023- Dr Rajesh Bhagat Henslow Fellow 2020- Dr Harriet Groom Henslow Fellow 2014-2017 Dr Sarah Morgan Henslow Fellow 2017-2020 Dr Emily Mitchell Henslow Fellow 2016-2019"
