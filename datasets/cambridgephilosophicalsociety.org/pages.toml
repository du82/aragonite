["https://www.cambridgephilosophicalsociety.org/events/event/professor-jim-woodhouse"]
title = "Acoustics of musical instruments - why is a saxophone like a violin? | Cambridge Philosophical Society"
description = "Founded in 1819 'for the purpose of promoting scientific inquiry'. The Cambridge Philosophical Society is an exciting hub for the promotion of scientific research"
full_description = "Musical instruments like the clarinet and saxophone do not obviously have anything in common with a bowed violin string. This talk will explore the physics behind how these instruments work, and it will reveal some unexpectedly strong parallels between them. This is all the more surprising because all of them rely on strongly nonlinear phenomena, and nonlinear systems are notoriously tricky: significant commonalities between disparate systems are rare. For all the instruments, computer simulations will be used to give some insight into questions a musician may ask: What variables must a player control, and how? Why are some instruments “easier to play” than others? The entrance to the Yusuf Hamied Department of Chemistry can be found at the side of the Scott Polar Research Institute, opposite the boat. The Bristol-Myers Squibb Lecture Theatre is located directly in the entrance as you enter the building. From Darwin’s paper on evolution to the development of stem cell research, publications from the Society continue to shape the scientific landscape. Mathematical Proceedings is one of the few high-quality journals publishing original research papers that cover the whole range of pure and applied mathematics, theoretical physics and statistics. Biological Reviews covers the entire range of the biological sciences, presenting several review articles per issue. Although scholarly and with extensive bibliographies, the articles are aimed at non-specialist biologists as well as researchers in the field. The Spirit of Inquiry celebrates the 200th anniversary of the remarkable Cambridge Philosophical Society and brings to life the many remarkable episodes and illustrious figures associated with the Society, including Adam Sedgwick, Mary Somerville, Charles Darwin, and Lawrence Bragg. Become a Fellow of the Society and enjoy the benefits that membership brings. Membership costs £20 per year. Please Note: Due to building works, the CPS office at 17 Mill Lane, Cambridge is now closed until further notice. Business operations as usual. Please contact us by email only: philosoc@group.cam.ac.uk"
year_published = 2025
