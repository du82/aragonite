["https://www.cambridgephilosophicalsociety.org/events/2025-02"]
title = ""
description = "Founded in 1819 'for the purpose of promoting scientific inquiry'. The Cambridge Philosophical Society is an exciting hub for the promotion of scientific research"
full_description = 'Kipling’s “Iron‒Cold Iron‒is master of them all” captures the familiar importance of metals as structural materials. Yet common metals are not necessarily hard; they can become so when deformed. This phenomenon, strain hardening, was first explained by G. I. Taylor in 1934. Ninety years on from this pioneering work on dislocation theory, we explore the deformation of metals when dislocations do not exist, that is when the metals are non-crystalline. These amorphous metals have record-breaking combinations of properties. They behave very differently from the metals that Taylor studied, but we do find phenomena for which his work (in a dramatically different context) is directly relevant. During the Covid-19 pandemic, U.K. policy-makers claimed to be "following the science". Many commentators objected that the government did not live up to this aim. Others worried that policy-makers ought not blindly "follow" science, because this involves an abdication of responsibility. In this talk, I consider a third, even more fundamental concern: that there is no such thing as "the" science. Drawing on the case of adolescent vaccination against Covid-19, I argue that the best that any scientific advisory group can do is to offer a partial perspective on reality. In turn, this has important implications for how we think about science and politics. From Darwin’s paper on evolution to the development of stem cell research, publications from the Society continue to shape the scientific landscape. Mathematical Proceedings is one of the few high-quality journals publishing original research papers that cover the whole range of pure and applied mathematics, theoretical physics and statistics. Biological Reviews covers the entire range of the biological sciences, presenting several review articles per issue. Although scholarly and with extensive bibliographies, the articles are aimed at non-specialist biologists as well as researchers in the field. The Spirit of Inquiry celebrates the 200th anniversary of the remarkable Cambridge Philosophical Society and brings to life the many remarkable episodes and illustrious figures associated with the Society, including Adam Sedgwick, Mary Somerville, Charles Darwin, and Lawrence Bragg.'
year_published = 2025
