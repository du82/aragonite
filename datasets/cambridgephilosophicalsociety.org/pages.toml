["https://www.cambridgephilosophicalsociety.org/about/nobel-winners"]
title = "Nobel Winners | Cambridge Philosophical Society"
description = "{nobel_meta_description}"
full_description = "Since its inception in 1901, numerous Fellows and Honorary Fellows of the Society have been awarded the Nobel Prize. The first two recipients were Honorary Fellows Hendrik A Lorentz and Pieter Zeeman in 1902 for the Nobel Prize in Physics. The Society's first women winner was Honorary Fellow Marie Curie in 1903 for the Nobel Prize in Physics. Marie Curie was the first person to win or share two Nobel Prizes, being awarded the Nobel Prize in Chemistry in 1911.In 1964, Dorothy Hodgkin became not only the first female Fellow of the Society to win a Nobel Prize (Chemistry) but also the first female member of the University of Cambridge to do so. The Nobel Prize is one of many prestigious awards in the field of science that our members have been awarded and these include; The Copley Medal, The Royal Medal, The Dalton Medal, The Lomonosov Gold Medal, Max Planck Medal, The Goethe Prize, The Dirac Medal, The Eddington Medal, and the Albert Einstein Award to name but a few. We currently have 49 Nobel Prize winners. Sir Peter J. Ratcliffe 2019 | Physiology or Medicine Honorary Fellow Richard Henderson 2017 | Nobel Prize in Chemistry Honorary Fellow Roger Penrose 2020 | Nobel Prize in Physics Fellow Robert G Edwards 2010 | Nobel Prize in Medicine Fellow Venki Ramakrishnan 2009 | Nobel Prize in Chemistry Honorary Fellow Sydney Brenner 2002 | Nobel prize in Physiology or Medicine Honorary Fellow John Sulston 2002 | Nobel Prize in Physiology or Medicine Honorary Fellow Tim Hunt 2001 | Nobel Prize in Physiology or Medicine Honorary Fellow John Ernest Walker 1997 | Nobel Prize in Chemistry Honorary Fellow Pierre-Gilles de Gennes 1991 | Nobel Prize for Physics Honorary Fellow Subramanyan Chandrasekhar 1983 | Nobel Prize in Physics Fellow Aaron Klug 1982 | Nobel Prize in Chemistry Fellow Abdus Salam 1979 | Nobel Prize in Physics Fellow Nevill Mott 1977 | Nobel Prize in Physics Fellow James Meade 1977 | Nobel Prize in Economics Fellow Antony Hewish 1974 | Nobel Prize in Physics Fellow Martin Ryle 1974 | Nobel Prize in Physics Fellow Ronald Norrish 1967 | Nobel Prize in Chemistry Fellow George Wald 1967 | Nobel Prize in Physiology or Medicine Honorary Fellow Dorothy Hodgkin 1964 | Nobel Prize in Chemistry Fellow Alan Hodgkin 1963 | Nobel Prize in Medicine Fellow Francis Crick 1962 | Nobel Prize in Medicine Fellow John Kendrew 1962 | Nobel Prize in Chemistry Fellow Peter B Medawar 1960 | Nobel Prize in Physiology or Medicine Honorary Fellow Alexander Todd 1957 | Nobel Prize in Chemistry Fellow Max Born 1954 | Nobel Prize in Physics Fellow Archer Martin 1952 | Nobel Prize in Chemistry Fellow John Cockcroft 1951 | Nobel Prize in Physics Fellow Patrick Blackett 1948 | Nobel Prize in Physics Fellow Edward Appleton 1947 | Nobel Prize in Physics Fellow George Thomson 1937 | Nobel Prize in Physics Fellow James Chadwick 1935 | Nobel Prize in Physics Fellow Paul Dirac 1933 | Nobel Prize in Physics Fellow Edgar Adrian 1932 | Nobel Prize in Physiology or Medicine Fellow Frederick Hopkins 1929 | Nobel Prize in Medicine Fellow Owen Richardson 1928 | Nobel Prize in Physics Fellow Arthur Compton 1927 | Nobel Prize in Physics Honorary Fellow Charles Wilson 1927 | Nobel Prize in Physics Fellow Francis Aston 1922 | Nobel Prize in Chemistry Fellow Niels Bohr 1922 | Nobel Prize in Physics Honorary Fellow Jules Bordet 1919 | Nobel Prize in Physiology or Medicine Honorary Fellow Max Planck 1918 | Nobel Prize in Physics Honorary Fellow Lawrence Bragg 1915 | Nobel Prize in Physics Fellow Ernest Rutherford 1908 | Nobel Prize in Chemistry Fellow J. J. Thomson 1906 | Nobel Prize in Physics Fellow Lord Rayleigh 1904 | Nobel Prize in Physics Fellow Marie Curie 1903 | Nobel Prize in Physics Honorary Fellow Pieter Zeeman 1902 | Nobel Prize in Physics Honorary Fellow Hendrik A Lorentz 1902 | Nobel Prize in Physics Honorary Fellow"
