["https://www.cambridgephilosophicalsociety.org/events/event/the-unknown-maxwell"]
title = "The Unknown Maxwell | Cambridge Philosophical Society"
description = "Founded in 1819 'for the purpose of promoting scientific inquiry'. The Cambridge Philosophical Society is an exciting hub for the promotion of scientific research"
full_description = "In the millennium poll, James Clerk Maxwell (1831-1879) was voted the third greatest physicist of all time – behind Newton and Einstein. He is best known for his equations of electromagnetism and thermodynamic relations, but his interests and achievements extended far beyond these fields. His profound insights across many extraordinarily diverse areas have laid the foundations for much of contemporary physical science. The day will begin with an overview of James Clerk Maxwell’s life and achievements. The talks following will focus on just a few of the fields where he did seminal work, and in which current research is revealing interesting developments. There will be a small exhibition of artefacts including some of Maxwell’s models from the Cavendish collection. The exhibition catalogue can be found here James Clerk Maxwell had strong links with the Cambridge Philosophical Society during his time at Cambridge. He studied mathematics as an undergraduate – initially at Peterhouse, but moving to Trinity before the end of his first term. He graduated in 1854, and shortly afterwards presented his first paper On the transformation of surfaces by bending to the Cambridge Philosophical Society. His career took him to Aberdeen, King’s College London and ther family estates at Glenlair before returning to Cambridge in 1871 to become the first Cavendish Professor of Experimental Physics. He was President of the Cambridge Philosophical Society 1875-1877. In 1879 he died in Cambridge at the age of 48. You are welcome to buy sandwiches, cakes, snacks and drinks in the Engineering Department’s cafeteria on the second floor, and you may also use this room to eat your own food. Professor Bill Baker (Cambridge University Honorary Professor of Structural Engineering), Professor Allan McRobie (Engineering) The Unknown Maxwell Professor Bruce J. Hunt is a historian of science at the University of Texas at Austin. He is the author of three books on the history of 19th century physics and technology and is currently working on a biography of James Clerk Maxwell. The Mechanical Origins of Maxwell’s Equations Professor Malcolm Longair graduated in Electronic Physics from Queen's College, Dundee and moved to Cambridge as a research student in the Radio Astronomy Group of the Cavendish Laboratory, Cambridge, supervised by Martin Ryle. His primary research interests are in the fields of high-energy astrophysics and astrophysical cosmology. He was appointed the ninth Astronomer Royal of Scotland in 1980, as well as the Regius Professor of Astronomy, University of Edinburgh, and the director of the Royal Observatory, Edinburgh. He was head of the Cavendish Laboratory from 1997 to 2005. He has served on and chaired many international committees, boards and panels, working with both NASA and the European Space Agency. He has received much recognition for his work over the years, including a CBE in the millennium honours list for his services to astronomy and cosmology. Introduction to Maxwell artefacts Professor Isobel Falconer is a Professor in the History of Mathematics at St Andrews University. She is interested in the relations between maths and physics in the nineteenth century, and the interaction of both with the cultural context. She was curator of the museum at the Cavendish Laboratory 1978-1980, and has published on James Clerk Maxwell, J J Thomson, J H Poynting and other Cambridge-educated physicists. More recently she has collaborated with Malcolm Longair to select, digitise, and describe, 406 historic images from the Cavendish and made them publicly available at https://cudl.lib.cam.ac.uk/collections/cavendish/1...; many of these chronicle everyday life in the Cavendish. She was a trustee of the James Clerk Maxwell Foundation 2018-2024. Maxwell and the nature of primary colours Professor John Mollon. After taking his first and second degrees in Psychology at Oxford, John Mollon was a Post-doctoral Fellow at Bell Telephone Labs, Murray Hill, where he first began research in colour vision. He became a lecturer in Experimental Psychology at Cambridge in 1976 and subsequently Professor of Visual Neuroscience. His research interests cover visual perception, behavioural genetics, and the physical basis of human memory – as well as the history of these fields. He is a Tillyer Medalist of the Optical Society of America and is President of the International Colour Vision Society. From Maxwell’s fields to quantised light Professor Sir Peter Knight is Chair of the UK National Quantum Technology Programme Strategy Advisory Board and has been involved in the creation of the UK programme since its inception, including the creation of the UK Quantum Strategy and the commitment of £2.5bn over the next decade to the field. He is an Emeritus Professor at Imperial College. He was knighted in 2005 for his work in optical physics. Knight was the 2004 President of the Optical Society of America and 2011-2013 President of the Institute of Physics. He was until 2010 chair of the UK Defence Scientific Advisory Council and remains a UK Government science advisor. Maxwell and the Geometry of Structural Equilibrium Professor Bill Baker is a structural engineering Consulting Partner at Skidmore, Owings & Merrill (SOM) in Chicago. He joined the firm in 1981, became a Partner in 1996 and transitioned to the role of a Consulting Partner in 2019. In addition to his professional practice, he teaches at MIT and the University of Cambridge where he is the Emeritus Honorary Professor of Structural Engineering Design."
year_published = 2025
