["https://www.cambridgephilosophicalsociety.org/media/talking-science"]
title = "Video | Cambridge Philosophical Society"
description = "Founded in 1819 'for the purpose of promoting scientific inquiry'. The Cambridge Philosophical Society is an exciting hub for the promotion of scientific research"
full_description = "Gaia: Mapping the Stars Tagged with: Astronomy YouTube Talking Science Dr Dannielle Green - The ecological effects of plastic pollution Tagged with: Natural Sciences YouTube Talking Science Dr Carrie Soderman - The geochemistry of the Earth’s mantle Tagged with: Geology Earth Sciences YouTube Talking Science Bivalve - The answer to food security? Tagged with: Talking Science Dr Emily Mitchell - Henslow Fellow 2016-2019 Tagged with: Talking Science 12 Next Page From Darwin’s paper on evolution to the development of stem cell research, publications from the Society continue to shape the scientific landscape. Mathematical Proceedings is one of the few high-quality journals publishing original research papers that cover the whole range of pure and applied mathematics, theoretical physics and statistics. Biological Reviews covers the entire range of the biological sciences, presenting several review articles per issue. Although scholarly and with extensive bibliographies, the articles are aimed at non-specialist biologists as well as researchers in the field. The Spirit of Inquiry celebrates the 200th anniversary of the remarkable Cambridge Philosophical Society and brings to life the many remarkable episodes and illustrious figures associated with the Society, including Adam Sedgwick, Mary Somerville, Charles Darwin, and Lawrence Bragg. Become a Fellow of the Society and enjoy the benefits that membership brings. Membership costs £20 per year. Proteins are the active molecules of life. However, most proteins do not work on their own in health or disease; a key challenge, therefore, is understanding how these molecules interact with each other to give rise to function or malfunction. This talk will outline our efforts to discover, understand and use the basic principles that drive protein assembly into larger scale structures and phases. I will discuss how controlling transitions between such phases can help us ameliorate biological malfunction when it occurs in disease, and well as develop new classes of functional materials."
