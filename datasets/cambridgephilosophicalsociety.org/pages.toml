full_description = "The Cambridge Philosophical Society has recently expanded its presence on social media by joining Bluesky. CPS Council member Professor John Carr helps to re-create a 10th Century recipe for incense from the collection of the Parker Library at Corpus Christi College. CPS Vice-President Dr. Claire Barlow to give keynote address at the next Research Café on Sustainability The Research Cafe at West Hub is holding an event on Climate Change on Wenesday, 24th April 2024 with keynote by Professor Lord Martin Rees Proteins are the active molecules of life. However, most proteins do not work on their own in health or disease; a key challenge, therefore, is understanding how these molecules interact with each other to give rise to function or malfunction. This talk will outline our efforts to discover, understand and use the basic principles that drive protein assembly into larger scale structures and phases. I will discuss how controlling transitions between such phases can help us ameliorate biological malfunction when it occurs in disease, and well as develop new classes of functional materials. More powerful, longer-lasting, faster-charging batteries – made from increasingly more sustainable resources and manufacturing processes – are required for low-carbon transport and stable electricity supplies in a “net zero” world. Rechargeable batteries are the most efficient way of storing renewable electricity; they are required for electrifying transport as well as for storing electricity on both micro and larger electricity grids when intermittent renewables cannot meet electricity demands. The first rechargeable lithium-ion batteries were developed for, and were integral to, the portable electronics revolution. The development of the much bigger batteries needed for transport and grid storage comes, however, with a very different set of challenges, which include cost, safety and sustainability. New technologies are being investigated, such as those involving reactions between Li and oxygen/sulfur, using sodium and magnesium ions instead of lithium, or involving the flow of materials in an out of the electrochemical cell (in redox flow batteries). Importantly, fundamental science is key to producing non-incremental advances and to develop new strategies for energy storage and conversion."
