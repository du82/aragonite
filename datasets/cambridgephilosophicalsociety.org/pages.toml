["https://www.cambridgephilosophicalsociety.org/funding/henslow-fellows/dr-georg-maierhofer"]
title = "Henslow Fellowship Profile | Cambridge Philosophical Society"
description = "Founded in 1819 'for the purpose of promoting scientific inquiry'. The Cambridge Philosophical Society is an exciting hub for the promotion of scientific research"
full_description = "Dr Georg Maierhofer Henslow Fellow 2023- Dr Georg Maierhofer is a Henslow Fellow at Clare Hall and works in the Department of Applied Mathematics and Theoretical Physics at the University of Cambridge. His research interests lie in Computational Mathematics for Partial Differential Equations (PDEs). PDEs are a central foundation of modern scientific modelling and help describe phenomena as varied as atmospheric processes and the generation and propagation of noise in the form of sound waves. Computational Mathematics is used to simulate nature by solving these PDEs approximately and without such numerical techniques many of humanity’s greatest technological and scientific advances would be impossible – from supercomputers processing terabytes of data on a daily basis for weather forecasting to sophisticated numerical models predicting the movement of atoms in particle accelerators. Dr Maierhofer’s main research concerns the study of so-called structure-preserving numerical methods for PDEs – algorithms which can replicate the ‘physical behaviour’ of solutions to PDEs, by preserving associated conservation laws such as the preservation of energy. A particular focus lies on the understanding of properties of symplectic methods when applied to infinite-dimensional Hamiltonian systems – differential equations that can be written in a unified formalism that encompasses a powerful mathematical description of many physical systems and their conservation laws. The rigorous understanding of advantages and limitations of such structure-preserving methods could lead to improved simulation tools for example improving the accuracy of weather forecasts. This research is complemented by a broader interest in the applications of computational mathematics, such as the simulation of extreme ocean waves, and the use of machine learning for the enhancement of classical methods from numerical analysis, for instance in meshing problems and the acceleration of classical solvers for time evolution PDEs. More Henslow Profils Dr Alec Christie Henslow Fellow 2021-2024 Dr Carrie Soderman Henslow Fellow 2023-"
year_published = 2025
