["https://www.cambridgephilosophicalsociety.org/events/2025-04"]
title = ""
description = "Founded in 1819 'for the purpose of promoting scientific inquiry'. The Cambridge Philosophical Society is an exciting hub for the promotion of scientific research"
full_description = "From Darwin’s paper on evolution to the development of stem cell research, publications from the Society continue to shape the scientific landscape. Mathematical Proceedings is one of the few high-quality journals publishing original research papers that cover the whole range of pure and applied mathematics, theoretical physics and statistics. Biological Reviews covers the entire range of the biological sciences, presenting several review articles per issue. Although scholarly and with extensive bibliographies, the articles are aimed at non-specialist biologists as well as researchers in the field. The Spirit of Inquiry celebrates the 200th anniversary of the remarkable Cambridge Philosophical Society and brings to life the many remarkable episodes and illustrious figures associated with the Society, including Adam Sedgwick, Mary Somerville, Charles Darwin, and Lawrence Bragg. Become a Fellow of the Society and enjoy the benefits that membership brings. Membership costs £20 per year. Please Note: Due to building works, the CPS office at 17 Mill Lane, Cambridge is now closed until further notice. Business operations as usual. Please contact us by email only: philosoc@group.cam.ac.uk © Copyright 1819-2024 The Cambridge Philosophical Society. All rights reserved.Registered Charity Number 213811"
