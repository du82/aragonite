full_description = "The next Research Café is themed around Sustainability, and we are excited to announce that our keynote speaker will be Claire Barlow. Claire is a sustainability and materials engineer, currently serving as the President of the Cambridge Philosophical Society and has been a Senior Member at Newnham College since 1980. Claire's extensive experience includes roles as Course Director for the Manufacturing Engineering Tripos, Director of Undergraduate Education, Deputy Head of the Engineering Department with special responsibility for teaching, and Interim Head of the Department. If you wish to connect with other researchers, raise your profile and be part of this community, join us on the 25th of September. We have limited places, sign up here!PLANNED SCHEDULE FOR THE EVENT 25th SEPT 2024: 11:30-12:00 - Reception and Refreshments 12:00-13:00 - Talks 13:00-14:30 - Pizza and Engagement Prize Draw 2pm Tagged with:"
