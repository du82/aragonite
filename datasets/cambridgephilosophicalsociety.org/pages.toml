["https://www.cambridgephilosophicalsociety.org/about/hopkins-prize"]
title = "Hopkins Prize | Cambridge Philosophical Society"
full_description = 'The following are the Regulations for the WILLIAM HOPKINS PRIZE founded in memory of WILLIAM HOPKINS (1793-1866). 1. That the Prize be called "THE WILLIAM HOPKINS PRIZE" 2. That this Prize be adjudged once in three years. 3. That it be adjudged for the best original memoir, invention or discovery, in connextion with Mathematico-physical or Mathematico-experimental science that may have been published during the three years immediately preceding, but that the adjudicators be at liberty, if it seem to them advisable in any particular case, to award the Prize for a discovery in Mathematics alone, or in Experimental Physicsalone, or for one which has not been published within theforementioned period. 4. That it be confined to those who are or have been Members of the University of Cambridge. 5. That the fund be vested in the Cambridge Philosophical Society, and the Prize adjudged by three Fellows of the Society, nominated by the Council of the Society for each occasion. 6. That, in the event of any difficulty arising in carrying out the above provisions in any particular instance, either from lack of a prize-subject of sufficient merit, or from anyother cause, the Council be at liberty to carry over the amount of the Prize for that term towards augmenting the fund for future prizes, or to award it to someone not a member of the University. Award of the William Hopkins Prize 1867 - SIR G. G. STOKES 1870 - J. CLERK MAXWELL 1873 - LORD RAYLEIGH 1876 - LORD KELVIN 1879 - SIR G. H. DARWIN 1882 - SIR R. T. GLAZEBROOK 1885 - W. M. HICKS 1888 - SIR H. LAMB 1891 - SIR J. J. THOMSON 1894 - W. D. NIVEN 1897 - SIR J. LARMOR 1900 - S. S. HOUGH 1903 - J. H. POYNTING 1906 - W. BURNSIDE 1909 - G. H. BRYAN 1912 - C. T. R. WILSON 1915 - R. A. SAMPSON 1918 - SIR F W. DYSON 1921 - SIR A. S. EDDINGTON 1924 - SIR J. H. JEANS 1927 - SIR G. I. TAYLOR 1930 - P. A. M. DIRAC 1933 - P. M. S. BLACKETT 1936 - E. A. MILNE 1939 - SIR J. D. COCKCROFT 1942 - H. J. BHABHA 1945 - C. F.