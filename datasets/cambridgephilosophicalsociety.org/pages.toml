title = "Video | Cambridge Philosophical Society"
description = "Founded in 1819 'for the purpose of promoting scientific inquiry'. The Cambridge Philosophical Society is an exciting hub for the promotion of scientific research"
full_description = "Discovery Exhibition - Unifying the sciences through mathematics Tagged with: Science 200th Anniversary YouTube Video CPS History Discovering a Science of Man Tagged with: Science 200th Anniversary YouTube Video CPS History Discovery Exhibition The founding of the Cambridge Philosophical Society Tagged with: 200th Anniversary YouTube Video CPS History From Darwin’s paper on evolution to the development of stem cell research, publications from the Society continue to shape the scientific landscape. Mathematical Proceedings is one of the few high-quality journals publishing original research papers that cover the whole range of pure and applied mathematics, theoretical physics and statistics. Biological Reviews covers the entire range of the biological sciences, presenting several review articles per issue. Although scholarly and with extensive bibliographies, the articles are aimed at non-specialist biologists as well as researchers in the field. The Spirit of Inquiry celebrates the 200th anniversary of the remarkable Cambridge Philosophical Society and brings to life the many remarkable episodes and illustrious figures associated with the Society, including Adam Sedgwick, Mary Somerville, Charles Darwin, and Lawrence Bragg. Become a Fellow of the Society and enjoy the benefits that membership brings. Membership costs £20 per year. Proteins are the active molecules of life. However, most proteins do not work on their own in health or disease; a key challenge, therefore, is understanding how these molecules interact with each other to give rise to function or malfunction. This talk will outline our efforts to discover, understand and use the basic principles that drive protein assembly into larger scale structures and phases. I will discuss how controlling transitions between such phases can help us ameliorate biological malfunction when it occurs in disease, and well as develop new classes of functional materials. More powerful, longer-lasting, faster-charging batteries – made from increasingly more sustainable resources and manufacturing processes – are required for low-carbon transport and stable electricity supplies in a “net zero” world. Rechargeable batteries are the most efficient way of storing renewable electricity; they are required for electrifying transport as well as for storing electricity on both micro and larger electricity grids when intermittent renewables cannot meet electricity demands. The first rechargeable lithium-ion batteries were developed for, and were integral to, the portable electronics revolution. The development of the much bigger batteries needed for transport and grid storage comes, however, with a very different set of challenges, which include cost, safety and sustainability. New technologies are being investigated, such as those involving reactions between Li and oxygen/sulfur, using sodium and magnesium ions instead of lithium, or involving the flow of materials in an out of the electrochemical cell (in redox flow batteries). Importantly, fundamental science is key to producing non-incremental advances and to develop new strategies for energy storage and conversion."
