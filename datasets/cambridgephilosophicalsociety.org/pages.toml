["https://www.cambridgephilosophicalsociety.org/funding/henslow-fellows/emily-mitchell"]
title = "Henslow Fellowship Profile | Cambridge Philosophical Society"
description = "Founded in 1819 'for the purpose of promoting scientific inquiry'. The Cambridge Philosophical Society is an exciting hub for the promotion of scientific research"
full_description = "Dr Emily Mitchell Henslow Fellow 2016-2019 Emily's research investigates the role of ecological processes on evolution through deep-time, from the first animal communities of the Ediacaran, to the present. The first animal communities are found in the Ediacaran time period, 580 million years ago, which consisted of sessile benthic organisms that lived in the deep-sea. Therefore, to understand how macro-ecology has changed through deep-time, she studies a wide range of different benthic communities from the fossil record and in the modern Antarctic and deep-sea. To collect fossil data in the field, she uses novel field-based laser-scanning techniques from aerospace to digitally capture entire rock surfaces. Emily work on modern systems uses data collected using AOV and ROVs to create 3D digital models. Through the application of statistical and mathematical ecology to the fossil and modern benthic communities, I reconstruct how species interact with each other and their environment, and what the driving factors behind these interactions are. These results then feed into theoretical models to explore how these relationships influence macro-evolutionary patterns over the last 580 million years. More Henslow Profils Dr Harriet Groom Henslow Fellow 2014-2017 Dr Sarah Morgan Henslow Fellow 2017-2020"
year_published = 2025
