["https://www.cambridgephilosophicalsociety.org/funding/sedgwick-studentships"]
title = "Sedgwick Studentships | Cambridge Philosophical Society"
description = "Founded in 1819 'for the purpose of promoting scientific inquiry'. The Cambridge Philosophical Society is an exciting hub for the promotion of scientific research"
full_description = "A partnership was established between the Cambridge Philosophical Society and Anglia Ruskin University in 2021 where the Society would support two PhD studentships “Sedgwick Studentships”. CPS funds the tuition fees and stipend, and ARU is responsible for bench fees and consumables. The students are registered on the ARU Doctoral Programme and are based at the Cambridge campus. The subject areas for the studentships are in fields where ARU shows research excellence, and the field of Life Sciences was selected for the first rounds of studentships. The Sedgwick Studentships provide a welcome addition to the limited number of Chancellor’s Studentships currently available at ARU and operate under the same regulations. The aims of the Philosophical Society are “to promote research in all branches of science and to encourage the communication of the results of scientific research.” The advertisement and selection of each of the Sedgwick Studentships is made by ARU, in full consultation with the Cambridge Philosophical Society. Sedgwick Studentship Profiles Owen Turner Sedgwick Studentship 2024-2027 Evie Carter Sedgwick Studentship 2023-2026 Lewis Spurrier-Best Sedgwick Studentship 2023-2026"
