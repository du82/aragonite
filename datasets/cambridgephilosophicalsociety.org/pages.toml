["https://www.cambridgephilosophicalsociety.org/funding/sedgwick-studentship-profile/evie-carter"]
title = "Sedgwick Profile | Cambridge Philosophical Society"
description = "Founded in 1819 'for the purpose of promoting scientific inquiry'. The Cambridge Philosophical Society is an exciting hub for the promotion of scientific research"
full_description = "Evie Carter Sedgwick Studentship 2023-2026 Evie is a PhD student working at Anglia Ruskin University and Cambridge University. She has previously studied archaeology and biological anthropology and has worked in the commercial archaeology sector prior to her PhD. Her research focusses on human diversity in Madagascar. In partnership with researchers at the University of Antananarivo, Evie will collect new genetic and anthropometric data from married couples in Malagasy communities. These, and existing, data will be used to examine the settlement process of Madagascar to better understand the history of genetic admixture in the population. The project will then explore how assortative mating and natural selection have contributed to the extensive diversity observed both within and between different communities on the island. As highly structured marital practices are a feature of Malagasy communities, this research will investigate how the interaction of caste-based social systems and assortative mating have forged Malagasy genetic, and phenotypic, diversity. In her fieldwork, Evie will also collect 3D facial photographs to study the genetic architecture of human face shape, with the aim of identifying genes that play a role in facial development. More Sedgwick Profiles Lewis Spurrier-Best Sedgwick Studentship"
year_published = 2025
