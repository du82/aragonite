["https://www.cambridgephilosophicalsociety.org/funding/henslow-fellows/dr-tiffany-ki"]
title = "Henslow Fellowship Profile | Cambridge Philosophical Society"
description = "Founded in 1819 'for the purpose of promoting scientific inquiry'. The Cambridge Philosophical Society is an exciting hub for the promotion of scientific research"
full_description = "Dr Tiffany Ki Henslow Fellow 2024 Tiff works in the Insect Ecology Group of the Department of Zoology at the University of Cambridge and is the Henslow Fellow at Darwin College, Cambridge. She is particularly fascinated by insects, and how museum collections can be used to understand long-term biodiversity change and inform conservation action today. She completed her PhD at the University of York and Natural History Museum (UK), where she focussed on the butterflies of Sulawesi and examined their long-term change using museum collections. Tiff’s current project is focussed on examining the UK macromoth communities using the Cambridge Zoology Museum’s Insect Collections. She is interested in disentangling the relative impact of anthropogenic threats, such as street lighting, climate change and land-use change, on species and communities over the past two centuries. In particular, her project aims to identify how species and communities have responded to the different transitions in artificial lighting (e.g. duration, intensity and colour of lighting) and provide timely and novel insights to inform effective conservation policy and practice. More Henslow Profils Dr Alec Christie Henslow Fellow 2021-2024 Dr Emily Mitchell Henslow Fellow 2016-2019"
