["https://www.cambridgephilosophicalsociety.org/funding/henslow-fellows/harriet-groom"]
title = "Henslow Fellowship Profile | Cambridge Philosophical Society"
description = "Founded in 1819 'for the purpose of promoting scientific inquiry'. The Cambridge Philosophical Society is an exciting hub for the promotion of scientific research"
full_description = "Dr Harriet Groom Henslow Fellow 2014-2017 It was as an undergraduate at Cambridge where Dr Harriet Groom's passion for molecular virology first began. Harriet completed her PhD under the supervision of Andrew Lever in the Department of Medicine, understanding the control of HIV gene expression. She then moved to the National Institute of Medical Research (now Francis Crick Institute) in London where she helped to disprove the reported novel retrovirus XMRV’s link to human infection and disease. Harriet then began my work on cellular inhibition of retroviruses, focusing on HIV, before moving back to Cambridge in 2015 as a Henslow Research Fellow at Downing College and an Associate Principal Investigator in the Department of Medicine where she continued work on cellular inhibitors of HIV. In her current fellowship Harriet continues to unpick how the intricate interactions between cells and viruses during infection can dictate host response and help us understand normal cell behaviour using retroviruses, herpesviruses and coronaviruses as model systems. Harriet is currently a Stanley Elmore Research Fellow at Sidney Sussex College and an associated PI in the Department of Medicine, where she researches the molecular interactions between retroviruses and human cells. More Henslow Profils Dr Emily Mitchell Henslow Fellow 2016-2019 Dr Sarah Morgan Henslow Fellow 2017-2020"
