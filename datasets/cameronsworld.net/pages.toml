["https://cameronsworld.net"]
title = "Cameron's World"
description = "GeoCities was a web-hosting service that made it possible for people to build their own home pages. During the 90s, users from all over the world created personalized corners of the Internet. By the time the U.S. service shut down in October 2009, there were over 38 million GeoCities pages. Cameron’s World brings together archived material from thousands and thousands of these sites. In an age where we interact primarily with branded and marketed web content, Cameron’s World is a tribute to the lost days of unrefined self-expression on the Internet. This project recalls the visual aesthetics from an era when it was expected that personal spaces would always be under construction."
full_description = '''Catscape Navigator is a web purrowser based upon a gif I found in the GeoCities archives. Graphics, including the amazing animated loader, were created by an unknown user. If you can prove you created the graphics please email me and I will pleased to add your credit! Hello! Welcome to my net home. I don't know if you have a website or not but let me tell you something... writing an intro is hard. Instead of putting up flashy pictures all over the place or nothing worth reading I have decided to make a page that will explain a little about myself. Anyway, since you were brave enough to enter here’s a little about me: 搜尋引擎網站! Yahoo! Hobbies: everything including daydreaming. Friends: I’ve swapped friends about a hundred times since the last major update What I’m doing at the moment (Not Literally!): I’m collecting rainbows and I play the fool! Are you smiling yet?? --- I hope so! Quotes: “Is a Sunset . . . The End or a Begining?”. "You can’t love anybody until you love yourself”. “How to be an artist: Stay loose and learn to watch snails.” I never planned on making a page. However I need something to show for all the time I spend on this computer. So why not?? Well that’s all I can think of for now. Be sure to visit again, this page is always changing! I wish all of you happy net surfing!! I hope you find what you’re looking for. Friday 20th August, 1999 Production of the page commenced, i began looking for a simple way to generate mouseover code, cause I am not an expert at javascript. Captain Log's Stardate: 51589.7 We are departing Starbase 169. Our next mission is to join a small fleet of Federation Ships to research damage caused by the Dominion. Tuesday 26th October, 1999 First of all I would like to take this time to thank Geocities for this free Web site, any one can join. Even if you can't make web pages, they have all the material for you to use right on line and also have a help section for making web pages & a whole lot more.'''
year_published = 2025
