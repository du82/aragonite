full_description = "Introducing the Amasis Web Font Posted on Thursday, August 16, 2012 at 1:00am PDT by Samuel Sidler This past weekend, we deployed the Amasis web font on headings throughout our website. We’re excited to finally be able to use the popular web font technology present in Camino 2.1 and to be able to use the same font on our website as we use in our logotype. We would like to thank fonts.com for providing a license to make this possible; without their support, we would be unable to take advantage of web fonts on caminobrowser.org. We’ve added fonts.com to the Thanks section of our Contribute page, alongside our current hosting sponsor NetworkRedux. Thanks so much, fonts.com! Camino 2.1.2 Released! Posted on Wednesday, March 14, 2012 at 1:15pm PDT by Samuel Sidler We’ve just released Camino 2.1.2, a maintenance release which contains various security and stability updates to Camino 2.1. All users are urged to update. In addition, Camino 2.1.2 is available in the following languages: Chinese (Simplified) Dutch English (US) French German Italian Japanese Norwegian (Bokmål) Spanish (Castellano) Swedish As always, you can download Camino 2.1.2 in English (or the multilingual version) from our website, and existing Camino users will receive this release via software update. When you first launch a new version of Camino, the welcome page now checks for an outdated Flash Player plug-in to help keep you up to date. If you see an update message, please follow the link to install the latest Flash Player plug-in to get the most stable and secure browsing experience. Camino 2.1.1 Released! Posted on Tuesday, February 21, 2012 at 1:00pm PST by Samuel Sidler We’ve just released Camino 2.1.1, a maintenance release which contains various security and stability updates to Camino 2.1. All users are urged to update. In addition, Camino 2.1.1 is available in the following languages: Chinese (Simplified) Dutch English (US) French Italian Japanese Norwegian (Bokmål) Spanish (Castellano) Swedish As always, you can download Camino 2.1.1 in English (or the multilingual version) from our website, and existing Camino users will receive this release via software update. When you first launch a new version of Camino, the welcome page now checks for an outdated Flash Player plug-in to help keep you up to date. If you see an update message, please follow the link to install the latest Flash Player plug-in to get the most stable and secure browsing experience. Feed Use this feed to track our blog in your favorite feed reader. Blog Archives 2013 2012 2011 2010 2009 2008 2007 2006 2005"
