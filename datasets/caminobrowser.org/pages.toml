["https://caminobrowser.org/features"]
title = "Camino. Features"
description = "Camino is a Mac OS X-native browser built on Mozilla’s Gecko rendering engine."
full_description = 'Requires Mac OS X 10.4 or later.For earlier version of Mac OS X, click here. var link = document.getElementById("url") var userLang = (navigator.language) ? navigator.language : navigator.userLanguage; if (userLang == "en" || userLang == "en-us" || userLang == "en_US") { var newurl = "/download/releases/" + latestRelease + "/"; link.href = newurl; } else { var newurl = "/download/releases/" + latestRelease + "-MultiLang/"; link.href = newurl; } What makes Camino special? Built from the ground up exclusively for Mac OS X, Camino is designed to make your browsing experience better. With features like annoyance blocking, tab overview, and phishing and malware detection, Camino keeps you browsing safer and faster on the Web. Location Bar Autocomplete Camino 2.1 includes enhanced location bar autocomplete, making it even easier to visit web pages you’ve visited before. Camino now matches against both titles and URLs of pages from your Bookmarks and History. Tab Overview Can’t find that webpage? With Camino’s Tab Overview, you can see all your open tabs at a glance and switch to the one you’re looking for with ease. Phishing & Malware Protection Camino includes built-in phishing and malware protection using the same data provider as popular browsers like Firefox, Safari, and Google Chrome. Annoyance Blocking Camino’s built-in annoyance blocking can block pop-ups, ads, and Flash animations. If a site requires Flash animations or pop-ups, Camino can add an exception for just that site and still block annoyances on other sites. Keychain Support Camino includes the ability to save usernames and passwords in the Mac OS X Keychain, maintaining compatibility with Safari and other Mac OS X applications and making switching browsers easier. Tabbed Browsing Camino’s many tabbed browsing features include a scrollable tab bar, drag and drop rearranging of tabs, and a tabs menu listing all the window’s tabs. And look, it does all the usual browser stuff too… AppleScript Support As a good Mac OS X citizen, Camino includes AppleScript support to help automate your browsing tasks. To learn about AppleScript features in Camino, see our AppleScript developer guide. Spell-checking Camino includes support for spell-checking in every text field. Unlike in Firefox, this spell-checker is the same one used throughout Mac OS X, so you don’t have to maintain multiple dictionaries. Feed Detection Camino supports the detection of RSS and Atom feeds in web pages and can pass the feeds to your favorite feed reader, including certain web-based readers like Google Reader and My Yahoo. Full Content Zoom On a web page designed by a 20 year-old with bionic eyes? Full content zoom scales the entire content of a web page instead of just increasing (or decreasing) the text size. Software Update Camino’s software update support (based on the popular Sparkle Mac OS X update framework) makes it easy to stay up-to-date with the latest features and security fixes. Recently Closed Tabs The History menu contains a sub-menu listing the last 20 closed web pages, giving you quick access to that page you didn’t mean to close. Session Saving Camino includes “session saving,” or optionally remembering what pages you were visiting when you quit and automatically loading them the next time you start. Download Notifications Camino includes support for the Growl notification system and also “bounces” the Downloads icon in the Dock on Mac OS X 10.5 and up, making it easy to tell when a download is finished. Web Standards Built on top of the Gecko 1.9.2 rendering engine, Camino includes support for the most popular web standards in use on today’s websites.'
