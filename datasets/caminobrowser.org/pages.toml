["https://caminobrowser.org/contact"]
title = "Camino. Contact"
description = "Camino is a Mac OS X-native browser built on Mozilla’s Gecko rendering engine."
full_description = "Contact Not sure who to contact? Check below for people and places to contact no matter what needs you have. We think our Help section is pretty good, but if you couldn’t find what you were looking for, post your question in our Camino forum on mozillaZine, which has community members ready to help with any problems you encounter. You can send us your thoughts at caminofeedback@mozilla.org. We read all the feedback we receive, but generally don’t have time to reply individually to each email. Note: Our feedback address is not for technical support. If you have a support issue, please try our Help options. Getting ready to write a glowing review of Camino and need a press contact? Check out our press page to see who to contact. Note: This address is not for technical support with Camino. If you have a support issue, please try our Help options."
