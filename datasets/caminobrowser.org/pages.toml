full_description = "Camino 1.0.3 Released Posted on Thursday, September 14, 2006 at 10:00am PDT by Samuel Sidler Camino 1.0.3 contains various security and stability updates to Camino 1.0.2. All users should upgrade. In addition, Camino 1.0.3 is being released in several other localizations and languages, listed below: Danish Dutch English (British) French German German (Schweizer) Italian Japanese Korean Lithuanian Polish Portuguese Portuguese (Brazillian) Russian Slovak Spanish (Castellano) Swedish Download Camino 1.0.3 English now or the multilingual version. Camino 1.0.2 Released Posted on Tuesday, June 20, 2006 at 10:00am PDT by Samuel Sidler Camino 1.0.2 contains various security and stability updates to Camino 1.0.1. All users should upgrade. In addition, Camino 1.0.2 is being released in several other localizations and languages, listed below: Danish Dutch English (British) French German German (Schweizer) Italian Japanese Korean Lithuanian Polish Portuguese Portuguese (Brazillian) Russian Slovak Spanish (Castellano) Swedish Download Camino 1.0.2 English now or the multilingual version. Tab Master Posted on Friday, May 26, 2006 at 10:00am PDT by Wevah Please welcome Desmond Elliott to our magical team! He won a Summer of Code spot to fix up and enhance our fantastic tabs! You can follow his progress via his blog, which is also included on our Community Blogs page. Camino 1.0.1 Released Posted on Tuesday, May 2, 2006 at 10:00am PDT by Samuel Sidler Camino 1.0.1 contains various security and stability updates to Camino 1.0. All users should upgrade. In addition, Camino 1.0.1 is being released in several other localizations and languages, listed below: Danish Dutch English (British) French German German (Schweizer) Italian Japanese Korean Lithuanian Polish Portuguese Portuguese (Brazillian) Russian Slovak Spanish (Castellano) Swedish Download Camino 1.0.1 English now or the multilingual version. Camino 0.8.5 Released Posted on Wednesday, April 25, 2006 at 10:00am PDT by Samuel Sidler Camino 0.8.5 has been released for users of Mac OS X 10.1. This will be the final maintenance and security release for all users of Mac OS X 10.1 and contains numerous security fixes as well as some stability fixes. Users of Mac OS X 10.2 and up should continue to use Camino 1.0. Camino 0.8.5 is also available in the same languages Camino 0.8.4 was available in. Download Camino 0.8.5 now in English or in its multilingual version. Japanese Version of Website Now Live! Posted on Monday, March 20, 2006 at 10:00am PDT by Samuel Sidler As a testament to the localization support Camino has, today we're announcing a version of caminobrowser.org completely translated into Japanese. We're still sorting a few issues out, but overall the site is gorgeous. It can be accessed from http://jp.caminobrowser.org. You'll also notice a new section in our footer linking to the Japanese version. We hope to add more languages to this in the future. As always, please let us know if you have any issues. Camino 1.0 Released! Posted on Tuesday, February 14, 2006 at 10:00am PDT by Samuel Sidler The Camino Project is proud to announce the Camino 1.0 web browser, the culmination of four years of work by dedicated volunteers. Designed exclusively for Mac OS X, Camino 1.0 is built on Mozilla’s Gecko rendering engine and offers one of the fastest browsing experiences available. The only browser available that combines the rendering power of Gecko with the Aqua user interface, Camino 1.0 offers superior integration with the Mac platform and a focused feature set. Among Camino’s signature features are elegant tabbed browsing, an enhanced bookmarks manager, and built-in ad-blocking. Download Camino 1.0 (Universal) now. Camino 1.0 is also available in a multilingual version, featuring the following languages: Danish Dutch English (British) French German Italian Japanese Polish Portuguese Portuguese (Brazillian) Russian Slovak Swedish Feed Use this feed to track our blog in your favorite feed reader. Blog Archives 2013 2012 2011 2010 2009 2008 2007 2006 2005"
