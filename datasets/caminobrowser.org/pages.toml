["https://caminobrowser.org/blog"]
title = "Camino. Blog"
description = "Camino is a Mac OS X-native browser built on Mozilla’s Gecko rendering engine."
full_description = "Camino Reaches Its End Posted on Thursday, May 30, 2013 at 2:00pm PDT by Stuart Morgan After a decade-long run, Camino is no longer being developed, and we encourage all users to upgrade to a more modern browser. Camino is increasingly lagging behind the fast pace of changes on the web, and more importantly it is not receiving security updates, making it increasingly unsafe to use. Fortunately, Mac users have many more browsers to choose from than they did when Camino started ten years ago. Former Camino developers have helped build the three most popular – Chrome, Firefox, and Safari – so while this is the end of Camino itself, the community that helped build it is still making the web better for Mac users. Thank you to all our loyal users, and to everyone who contributed in countless ways over the years to make Camino what it was. Introducing the Amasis Web Font Posted on Thursday, August 16, 2012 at 1:00am PDT by Samuel Sidler This past weekend, we deployed the Amasis web font on headings throughout our website. We’re excited to finally be able to use the popular web font technology present in Camino 2.1 and to be able to use the same font on our website as we use in our logotype. We would like to thank fonts.com for providing a license to make this possible; without their support, we would be unable to take advantage of web fonts on caminobrowser.org. We’ve added fonts.com to the Thanks section of our Contribute page, alongside our current hosting sponsor NetworkRedux. Thanks so much, fonts.com! Camino 2.1.2 Released! Posted on Wednesday, March 14, 2012 at 1:15pm PDT by Samuel Sidler We’ve just released Camino 2.1.2, a maintenance release which contains various security and stability updates to Camino 2.1. All users are urged to update. In addition, Camino 2.1.2 is available in the following languages: Chinese (Simplified) Dutch English (US) French German Italian Japanese Norwegian (Bokmål) Spanish (Castellano) Swedish As always, you can download Camino 2.1.2 in English (or the multilingual version) from our website, and existing Camino users will receive this release via software update. When you first launch a new version of Camino, the welcome page now checks for an outdated Flash Player plug-in to help keep you up to date. If you see an update message, please follow the link to install the latest Flash Player plug-in to get the most stable and secure browsing experience. Camino 2.1.1 Released! Posted on Tuesday, February 21, 2012 at 1:00pm PST by Samuel Sidler We’ve just released Camino 2.1.1, a maintenance release which contains various security and stability updates to Camino 2.1. All users are urged to update. In addition, Camino 2.1.1 is available in the following languages: Chinese (Simplified) Dutch English (US) French Italian Japanese Norwegian (Bokmål) Spanish (Castellano) Swedish As always, you can download Camino 2.1.1 in English (or the multilingual version) from our website, and existing Camino users will receive this release via software update. When you first launch a new version of Camino, the welcome page now checks for an outdated Flash Player plug-in to help keep you up to date. If you see an update message, please follow the link to install the latest Flash Player plug-in to get the most stable and secure browsing experience. Camino 2.1 Released! Posted on Tuesday, November 29, 2011 at 12:30pm PST by Samuel Sidler After over a year of hard work, the Camino Project is proud announce Camino 2.1, a notable new update to the Camino web browser. Camino 2.1 includes a number of new features and enhancements, including overhauled location bar autocomplete, improved control over plug-ins, and displays web content using Mozilla’s Gecko 1.9.2 rendering engine, improving web compatibility and providing all users with an improved browsing experience. For a list of features in Camino, visit our features page. Also, see the release notes for more detailed information about changes in Camino 2.1. Camino 2.1 is available today in 6 languages: Dutch English (US) French Italian Japanese Swedish Three other languages, Chinese (Simplified), Norwegian and Spanish, are expected to be available in the near future (if you’d like to help translate Camino 2.1 into your language, visit the Camino Localization Project at http://cl10n.rwx.it/). As always, you can download Camino 2.1 in English (or the multilingual version) from our website, and existing Camino users will receive this release via software update. When you first launch a new version of Camino, the welcome page now checks for an outdated Flash Player plug-in to help keep you up to date. If you see an update message, please follow the link to install the latest Flash Player plug-in to get the most stable and secure browsing experience. Camino 2.0.9 Released! Posted on Wednesday, September 14, 2011 at 12:00pm PDT by Samuel Sidler We’ve just released Camino 2.0.9, a maintenance release which contains various security and stability updates to Camino 2.0.x. All users are urged to update. In addition, Camino 2.0.9 is available in the following languages: Chinese (Simplified) Danish Dutch English (US) French German Italian Japanese Norwegian (Bokmål) Polish Russian Slovenian Spanish (Castellano) Swedish Turkish As always, you can download Camino 2.0.9 in English (or the multilingual version) from our website, and existing Camino users will receive this release via software update. When you first launch a new version of Camino, the welcome page now checks for an outdated Flash Player plug-in to help keep you up to date. If you see an update message, please follow the link to install the latest Flash Player plug-in to get the most stable and secure browsing experience. Camino 2.1 Beta 2 Released! Posted on Friday, September 9, 2011 at 11:45am PDT by Samuel Sidler After a month of hard work following the release of Camino 2.1 Beta 1, the Camino Project is proud to announce the third preview release of Camino 2.1. Camino 2.1 Beta 2 is primarily a security update for users of Camino 2.1 Beta 1. For more information and to download, please visit our preview site (users of earlier Camino 2.1 preview releases or nightly builds will be notified of the new preview release by software update and can install the new preview release by choosing Check for Updates… from the Camino menu). Camino 2.0.8 Released! Posted on Friday, September 9, 2011 at 11:45am PDT by Samuel Sidler We’ve just released Camino 2.0.8, a maintenance release which contains various security and stability updates to Camino 2.0.x. All users are urged to update. In addition, Camino 2.0.8 is available in the following languages: Chinese (Simplified) Danish Dutch English (US) French German Italian Japanese Norwegian (Bokmål) Polish Russian Slovenian Spanish (Castellano) Swedish Turkish As always, you can download Camino 2.0.8 in English (or the multilingual version) from our website, and existing Camino users will receive this release via software update. When you first launch a new version of Camino, the welcome page now checks for an outdated Flash Player plug-in to help keep you up to date. If you see an update message, please follow the link to install the latest Flash Player plug-in to get the most stable and secure browsing experience. Camino 2.1 Beta 1 Released! Posted on Monday, August 1, 2011 at 12:00pm PST by Samuel Sidler After several months of hard work following the release of Camino 2.1 Alpha 1, the Camino Project is proud to announce the second preview release of Camino 2.1. Camino 2.1 Beta 1 contains several notable improvements, including improved control over plug-ins, overhauled location bar autocomplete, a new history backend, the ability to hide the status bar, and enhanced support for web standards provided by version 1.9.2 of the Gecko rendering engine. For more information and to download, please visit our preview site (users of nightly builds will be notified of the new preview release by software update and can install the new preview release by choosing Check for Updates… from the Camino menu). The Future of Camino Posted on Monday, March 28, 2011 at 8:30pm PDT by Stuart Morgan Mozilla today announced the end of Gecko embedding, which Camino uses to include the Gecko rendering engine inside of a native Cocoa interface. While embedding has long been relatively low priority, being officially unsupported is a significant change. As important parts of embedding stop working, core Gecko contributors will longer be fixing them. Such breakages are unfortunately common—in fact, making sure that embedding breakages were resolved was a significant amount of the work that went into the release of Camino 2.0, as well as the upcoming Camino 2.1. Without support for embedding, releases of Camino using newer versions of Gecko—like the one used in Firefox 4—won’t be possible. What exactly does this announcement mean for Camino and our users? In the short term, very little. The Camino Project is committed to finishing Camino 2.1, which will bring Camino users the same version of Gecko used in Firefox 3.6. The first beta version of this release will be ready soon, with the stable release following in May. We will also continue to release security and stability updates for Camino as we have always done, for as long as Gecko 1.9.2 is supported. This means that as long as web sites support Firefox 3.6, Camino will keep working, too. Beyond that, the future is unclear. As a purely community-based open source project, no one is employed to work on Camino; all Camino developers are volunteers, working on Camino in their spare time, as a labor of love. While maintaining embedding in a fork of Gecko is theoretically possible, we don’t have the manpower for a sustained effort of that kind. A more realistic option would be to port Camino to WebKit, but while this would be much easier to maintain in the future, it would require a large amount of initial work. While we would like to take that approach, we don’t have the manpower to do it on our own—we encourage anyone who might be interested in adapting the Camino code to a new rendering engine join our development discussion list. As always, we appreciate all of our loyal users who have encouraged and supported us over the last decade. We’ll let you know more about our long term plans once we know more, but for now we’ll get back to doing what we love: working to bring you the next great version of Camino! Feed Use this feed to track our blog in your favorite feed reader. Blog Archives 2013 2012 2011 2010 2009 2008 2007 2006 2005"
