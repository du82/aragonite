["https://caminobrowser.org/releases/1.0.1"]
title = "Camino. Releases. 1.0.1"
description = "Camino is a Mac OS X-native browser built on Mozilla’s Gecko rendering engine."
full_description = '''Camino 1.0.1 Release Notes Camino 1.0.1 is no longer the current release. Please download the latest stable release. Changes since Camino 1.0 The following changes and improvements have been made since the Camino 1.0 release. In Camino 1.0.1, we have made the following changes and improvements since version 1.0: Fixed several critical security issues, including those fixed in version 1.8.0.3 of the Mozilla Gecko rendering engine. Upgraded the bundled Java Embedding Plugin (http://javaplugin.sf.net) to version 0.9.5+d Improved ad-blocking, especially of German ads Enabled the opening of local SVG files Fixed an issue where Camino on Intel-based Macs was unable to read Keychain entries stored by Camino on PowerPC-based Macs. About Camino 1.0 Camino 1.0 brings you a heavily-updated version of the only native Mac OS X browser using Mozilla’s Gecko rendering engine. Thousands of bugs were fixed in Gecko 1.8, providing users with improved web page compatibility. The features listed below are just some of the many in Camino 1.0. Note: Due to major changes in Camino, Mac OS X 10.1 is no longer supported. Users still running Mac OS X 10.1 should continue to use Camino 0.8.5. We want to know what you think! Be sure to contact us and let us know what you think. What's New in Camino 1.0 Camino 1.0 brings a heavily updated version of the only native Mac OS X browser using Mozilla.org's Gecko HTML rendering engine (version 1.8), the same rendering engine used by the popular Firefox 1.5 web browser. Here's what's new in Camino 1.0: Universal Binary - Camino is now a universal binary, allowing it to run natively on both PowerPC- and Intel-based Macs. New Tab Bar Appearance - The new tab bar appearance allows for easier usability. Download Manager Pause/Resume - The download manager now supports pause and resume and has been highly optimized and revised for better performance. Annoyance Blocking - With built-in ad- and pop-up blocking, Camino now allows you to ignore the things you hate most. Certificate Support - The addition of certificate support yields better security. Java Embedding Plugin - JEP improves Java performance immensely. Form Fill from Address Book - Form fill from Address Book makes filling in those pesky web forms much easier. History Searching - Finding past web pages is even easier with history searching built-in to the History Manager. Support for More Web Standards - Thanks to the Gecko rendering engine, Camino now supports SVG, the <canvas> tag, and JavaScript 1.6, as well as improved CSS 2 and CSS 3 support. See the complete release notes for a list of all changes from 0.8.4 to 1.0. Downloading and Installing System Requirements Camino now requires Mac OS X 10.2 (users of 10.1 can download Camino 0.8.5 English) or Multilingual. In addition a minimum of 30 MB of free hard drive space and 128 MB or RAM is required. Downloading Camino You can download Camino from the main project page. Installing Camino Installing Camino is as simple as copying the app to your Applications folder. Instructions can be found on the disk image. Known issues Microsoft's Windows Media Player (WMP) plugin causes major rendering issues in Camino. Since Microsoft has discontinued WMP on Mac OS X, Camino no longer supports the use of the WMP plugin; instead, all users should download the free Flip4Mac (F4M) plugin, version 2.0.1 or higher, from flip4mac.com. Version 2.0.1 displays some WMP content off-center in Camino; this will be fixed in the next maintenance release of the F4M plugin. Although typing performance has improved in Camino 1.0, typing in form fields can be slow when Flash or animated images are present. Turning off animations can improve performance in some cases. Shockwave Director content displays at the wrong location in the browser window when hardware rendering is enabled. Switch the plugin to software rendering to solve this. Java applets on some web pages may crash on Mac OS X 10.4 in certain configurations. This can happen after a system update fails to fully upgrade all components of the system. If you experience crashes on pages that use Java applets, apply or reapply the latest “combo update” from Apple to ensure that your system is up to date. Due to a bug in Mac OS X 10.2.x and 10.3.x, Norwegian users of the Camino Multilingual edition will need to manually select their desired user interface language and manually set their 'accept-language' string. To make Camino Multilingual run in Nynorsk or Bokmål, select Camino Multilingual in the Finder and choose "Get Info" from the File menu. In the resulting window, click the triangle next to "Languages:" and uncheck every language except the one desired as Camino's UI language.To set the accept-language string, add the string user_pref("camino.accept_languages", "nb,nn,no,en"); to your user.js file, where the languages are listed in the order in which you'd prefer them if a server can send content in multiple languages. (In this example, you want Bokmål first, then Nynorsk, then generic Norwegian, then English if none of the other three languages are available.) You may now launch Camino.Apple fixed this bug in Mac OS X 10.4, so no work-arounds are necessary. Download English | Multilingual Release Date May 2, 2006 Available Languages Danish Dutch English (GB) English (US) French German German (Schweizer) Italian Japanese Korean Lithuanian Polish Portuguese (BR) Portuguese (PT) Russian Slovak Spanish (Castellano) Swedish'''
