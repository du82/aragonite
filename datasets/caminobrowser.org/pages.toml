full_description = "Camino 2.0.6 Released! Posted on Tuesday, November 16, 2010 at 11:45am PST by Samuel Sidler We’ve just released Camino 2.0.6, a maintenance release which contains various security and stability updates to Camino 2.0.x. All users are urged to update. In addition, Camino 2.0.6 is available in the following languages: Chinese (Simplified) Danish Dutch English (US) French German Italian Japanese Norwegian (Bokmål) Polish Russian Slovenian Spanish (Castellano) Swedish Turkish As always, you can download Camino 2.0.6 in English (or the multilingual version) from our website, and existing Camino users will receive this release via software update. When you first launch a new version of Camino, the welcome page now checks for an outdated Flash Player plug-in to help keep you up to date. If you see an update message, please follow the link to install the latest Flash Player plug-in to get the most stable and secure browsing experience. Camino 2.0.5 Released! Posted on Tuesday, October 26, 2010 at 11:00am PDT by Samuel Sidler We’ve just released Camino 2.0.5, a maintenance release which contains various security and stability updates to Camino 2.0.x. All users are urged to update. In addition, Camino 2.0.5 is available in the following languages: Chinese (Simplified) Danish Dutch English (US) French German Italian Japanese Norwegian (Bokmål) Polish Russian Slovenian Spanish (Castellano) Swedish Turkish As always, you can download Camino 2.0.5 in English (or the multilingual version) from our website, and existing Camino users will receive this release via software update. When you first launch a new version of Camino, the welcome page now checks for an outdated Flash Player plug-in to help keep you up to date. If you see an update message, please follow the link to install the latest Flash Player plug-in to get the most stable and secure browsing experience. Camino 2.0.4 Released! Posted on Thursday, August 26, 2010 at 11:00am PDT by Samuel Sidler We’ve just released Camino 2.0.4, a maintenance release which contains various security and stability updates to Camino 2.0.x. All users are urged to update. In addition, Camino 2.0.4 is available in the following languages: Chinese (Simplified) Danish Dutch English (US) French German Italian Japanese Norwegian (Bokmål) Polish Russian Slovenian Spanish (Castellano) Swedish Turkish As always, you can download Camino 2.0.4 in English (or the multilingual version) from our website, and existing Camino users will receive this release via software update. Camino 2.0.3 Released! Posted on Wednesday, May 26, 2010 at 10:15am PDT by Samuel Sidler We’ve just released Camino 2.0.3, a maintenance release which contains various security and stability updates to Camino 2.0.x. All users are urged to update. In addition, Camino 2.0.3 is available in the following languages: Chinese (Simplified) Danish Dutch English (US) French German Italian Japanese Norwegian (Bokmål) Polish Russian Slovenian Spanish (Castellano) Swedish Turkish As always, you can download Camino 2.0.3 in English (or the multilingual version) from our website, and existing Camino users will receive this release via software update. Camino and the 2010 Google Summer of Code Posted on Thursday, March 25, 2010 at 5:45pm PDT by Smokey Ardisson As March comes to a close, student thoughts often turn to term papers, finals, and summer employment. If you are a student developer looking for an interesting summer job, we’re excited to announce that the Camino Project is once again participating in the Google Summer of Code (we’re listed under the Mozilla Project). We’re looking for student developers interested in making a meaningful contribution to a great Mac web browser used by hundreds of thousands. Past projects, such as the scrollable tab bar in Camino 1.6, the tab overview feature in Camino 2, and the improved location bar autocomplete in Camino 2.1 nightly builds, have been rewarding experiences for student developers, the Camino Project, and our users who ultimately benefit from the new features. We have provided a list of project suggestions on our wiki to get you started, but if you have your own idea, we’re interested in hearing about it. Whatever project you are thinking of taking on, we encourage you to come to the #camino channel on irc.mozilla.org and let us know that you are applying! Google’s deadline for student applications for this summer’s program is Friday, April 9, 2010; if you’re interested in working on a Camino project, you have two weeks to develop and polish your application. See Google’s 2010 Summer of Code home page for more information on deadlines and the application process. We look forward to receiving applications for this summer, and we wish all applicants good luck! Camino 1.6.11 Released! Posted on Monday, March 15, 2010 at 1:00pm PDT by Samuel Sidler Today the Camino Project is releasing Camino 1.6.11, the final security and stability release of the Camino 1.6.x series. This release is designed only for our users on Mac OS X 10.3.9; users of Mac OS X 10.4 or higher should use Camino 2.0.2 instead. Since Camino 2 no longer supports Mac OS X 10.3.9, Camino 1.6.11 is the final release for our users on 10.3. We wish you well, and we hope to see you again when you next upgrade your OS or get a new Mac. Camino 1.6.11 is available in the following languages: Catalan Chinese (Simplified) Czech Dutch English (US) French German Italian Japanese Norwegian (Bokmål) Polish Portuguese (Brazillian) Russian Slovenian Spanish (Castellano) Swedish As always, you can download Camino 1.6.11 in English (or the multilingual version) from our website, and existing Camino 1.6.x users on Mac OS X 10.3.9 will receive this release via software update. Camino 2.0.2 Released! Posted on Tuesday, February 23, 2010 at 1:00pm PST by Samuel Sidler We’ve just released Camino 2.0.2, a maintenance release which contains various security and stability updates to Camino 2.0. All users are urged to update. In addition, Camino 2.0.2 is available in the following languages: Chinese (Simplified) Danish Dutch English (US) French German Italian Japanese Norwegian (Bokmål) Polish Russian Slovenian Spanish (Castellano) Swedish Turkish As always, you can download Camino 2.0.2 in English (or the multilingual version) from our website, and existing Camino users will receive this release via software update. Camino is an About.com Best Independent Browser Finalist! Posted on Thursday, February 4, 2010 at 1:00pm PST by Smokey Ardisson About.com has just released the list of finalists in the 2010 About.com Reader’s Choice Awards, and Camino is one of the five finalists in the “Best Independent Browser” category. We’re excited to be recognized, especially as the sole Mac-only browser in the category. Voting runs through February 24, so if you’re a Camino fan, you can vote on this page. (You can access all the About.com Reader’s Choice Awards categories here and vote for your favorite sites and programs in other categories.) Feed Use this feed to track our blog in your favorite feed reader. Blog Archives 2013 2012 2011 2010 2009 2008 2007 2006 2005"
