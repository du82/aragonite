["https://caminobrowser.org/releases/2.1.1"]
title = "Camino. Releases. 2.1.1"
description = "Camino is a Mac OS X-native browser built on Mozilla’s Gecko rendering engine."
full_description = "Camino 2.1.1 Release Notes Camino 2.1.1 is no longer the current release. Please download the latest stable release. Changes since Camino 2.1 The following changes and improvements have been made since the Camino 2.1 release. Camino 2.1.1 contains the following improvements over version 2.1: Upgraded to version 1.9.2.27 of the Mozilla Gecko rendering engine, which includes several critical security and stability fixes. Blocked versions of Adobe Flash Player 10 older than 10.3.183.15 and Flash Player 11 older than 11.1.102.62 on Intel Macs due to severe security issues. Tweaked the autocomplete algorithm to reduce the weight of visit count. Added a hidden preference to allow turning off autocomplete’s use of page titles in matches. The location sheet once again shows an autocomplete window. It is now possible to clear the “Recently Closed Pages” menu with the “Clear History…” menu item even when history is disabled. Improved the appearance of the bookmark toolbar in background windows on Mac OS X 10.7. On Mac OS X 10.7, Camino now appears in the “Productivity“ category when sorting Finder windows by category. Camino now correctly checks for the presence of a Java plug-in on Mac OS X 10.7. The “open location” AppleScript command now supports optional “referrer” and “loading in background” parameters. Camino will now display an error message when the “open location” command’s direct parameter is empty or missing. A new “reload” command allows AppleScripts to reload browser windows and tabs. The status of Camino’s offline mode is now available to AppleScript, and scripts can toggle offline mode on and off using the application object’s “online” property. The AppleScript “visit count” bookmark property once again works correctly. Pressing Escape will now cancel Tab Overview. “Fill Form” no longer fills disabled hidden form controls. The “Block Flash animations” checkbox is no longer enabled if Flash is not installed. Camino now correctly resolves Bonjour services that do not include an initial forward slash in their “path” information. About Camino 2.1 This release displays web pages with Gecko 1.9.2, the same rendering engine used by the popular Firefox 3.6 web browser, improving web compatibility and sharing many of the security fixes and Gecko improvements that are in that version of Firefox. The features listed below are just some of the many changes in Camino 2.1. Camino 2.1 is available for Mac OS X 10.4 and later. Features in Camino 2.1 The following are the major changes and improvements made since the Camino 2.0 release. A full list of features and fixes is also available. Web content support Camino now uses version 1.9.2 of Mozilla’s Gecko rendering engine, which contains thousands of bug fixes, enhanced support for web standards, and improved JavaScript performance. Enhanced location bar autocomplete A completely rewritten autocomplete now searches both bookmarks and history and matches against page titles as well as page URLs. Changes to plug-in support Camino now disables certain insecure or incompatible versions of common plug-ins. A new “Internet Plug-Ins” folder in the profile allows for Camino-only plug-ins. A new hidden preference allows disabling specific plug-ins. Camino no longer includes a Java plug-in; users who need to run Java applets should install Java Plug-In 2 or the Java Embedding Plugin, as appropriate for the version of Mac OS X in use. Offline mode New “Work Offline” and “Go Online” items in the “Camino” menu allow Camino to enter offline mode and provide a more useful experience when no network connection is available. Status Bar The status bar can now be hidden by choosing “Hide Status Bar” in “View” menu. Known Issues For information about other issues or problems, please visit our Help page. Some routers are incompatible with the DNS prefetch feature included in Camino 2.1.x. If pages take an extremely long time to load or fail to load completely, check with your router manufacturer for updated firmware. If no firmware updates are available or they do not fix the problem, disable prefetch by setting the network.dns.disablePrefetch hidden preference to true. If “Ask me before accepting each cookie” is checked, Camino will display a cookie dialog for each cookie request from a web page. Incompatible third-party plug-ins: PDF Browser Plugin version 2.4 and newer are incompatible with Camino; to display PDF files in Camino on Mac OS X 10.6 or newer, use version 2.3 of the plug-in. Incompatible third-party software: 1Password is known to crash Camino in some cases, particularly when customizing the toolbar. If you experience crashes, try removing 1Password's Camino integration. Download English | Multilingual Release Date February 21, 2012 Available Languages Chinese (Simplified) Dutch English (US) French Italian Japanese Norwegian (Bokmål) Spanish (Castellano) Swedish"
