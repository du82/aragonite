["https://caminobrowser.org/blog/2005"]
title = "Camino. Blog. 2005 Archives"
description = "Camino is a Mac OS X-native browser built on Mozilla’s Gecko rendering engine."
full_description = "Camino 1.0 Beta 1 is out Posted on Monday, November 7, 2005 at 10:00am PDT by Samuel Sidler We've just released Camino 1.0 beta 1. This is by far the finest Camino release ever. It’s so great, we're calling it our stable release and replacing the download link on the main page with it. Check out the release notes for more information on what’s changed. In addition report any bugs you find to bugzilla so we can get them fixed in time for our next release. Camino 1.0 Alpha 1 Released Posted on Wednesday, September 14, 2005 at 10:00am PDT by Samuel Sidler We've gone and done it again. The first preview of our upcoming 1.0 release has been made available. Camino 1.0a1 adds numerous features over our previous alpha (0.9a2) including pause/resume for downloads, the Java Embedding Plugin, major bookmark enhancements, and certificate viewing/editing. For a complete list of changes, see the release notes. Based on Gecko 1.8 beta, we think Camino 1.0a1 is one of our most stable releases ever. So, download this preview now and tell us what you think. Camino Nightly Link Update Posted on Tuesday, August 16, 2005 at 10:00am PDT by Wevah The “nightly” link on this site now downloads the most recent build from /latest-1.0/ instead of /latest/, since this is what people should be testing the most to help us with bugs up to the 1.0 release. If you still reeeeeal'y want a trunk build, you can grab it from /latest/ as in the past. Yay! Camino 0.9 Alpha 2 Released Posted on Monday, July 18, 2005 at 10:00am PDT by Samuel Sidler Our second alpha of the upcoming Camino 0.9 has just been released! This version incorporates numerous fixes as well as new features. For a complete list of changes, see the release notes. Otherwise, start your download now! Camino 0.9 Alpha 1 Released! Posted on Monday, June 20, 2005 at 10:00am PDT by Samuel Sidler It's been almost two months since the last release of Camino and three days short of a year since the release of 0.8. Today, however, you can download a sneak peak of the next release of Camino. You'll notice a new download icon on our main page next to the nightly download icon. This is where you can download the alpha version of our upcoming 0.9 release. Please note that this is an alpha. There are still many bugs to be fixed and a few more features, but this is the future of Camino. Release notes detailing all the new features and bug fixes are available, but here's a list of some of the major ones: Form fill New tabs Midas support Spotlight bookmark search (Tiger only) Also with this release comes the requirement of Mac OS X 10.2 and above. We no longer support Mac OS X 10.1. Users still on 10.1 should download our latest stable release, 0.8.4. So what’re you waiting for? Go download this new alpha release and check out the future of Camino. Camino 0.8.4 Released Posted on Thursday, April 28, 2005 at 10:00am PDT by Samuel Sidler We've just released Camino 0.8.4! This latest version is available in English and many other languages (Chinese Simplified, Chinese Traditional, Czech, Danish, Dutch, French, German, German Swiss, Italian, Japanese, Lithuanian, Norwegian bokmål, Norwegian nynorsk, Portuguese, Slovak, Spanish (Castellano), and Swedish). Several security issues were fixed with this release as well a bug making Camino Mac OS X Tiger 10.4 compatible. Right on time! View the release notes for information on other changes. It is recommended that all users upgrade due to the nature of the security bugs fixed. So, go download Camino 0.8.4 English, or its multilingual counterpart! Contributors’ Combined RSS Feed Posted on Friday, April 15, 2005 at 10:00am PDT by Wevah The combined RSS feed for the contributors’ blogs section is now live. It’s not completely valid because I decided it wasn’t a good idea to put e-mail addresses into the author tag. (Edit: Also, MagpieRSS seems to be messing up character entities in the feeds.) Site Updates Posted on Tuesday, April 12, 2005 at 10:00am PDT by Samuel Sidler We’ve been doing some work behind the scenes and have finally implemented the Contributors’ Blogs part of the Community section. There, you'll find the most recent articles from contributors of the Camino project. In addition, any contributor who would like to host a blog with us, may now do so. Simply contact us for more info. Speaking of contacting us... I forgot to mention two new links that were placed on all of our pages. The Contact page contains a listing of contacts within the Camino project. Hopefully this will help you direct your questions and comments to the right person. The second link is the Search page. Powered with Google’s Site Search, finding information on our site could never be easier. We're continually working to make caminobrowser.org better and better. If you have questions or comments about the website, feel free to email us. Multilingual Version of Camino 0.8.3 Released Posted on Tuesday, April 5, 2005 at 10:00am PDT by Jasper Hauser The multilingual version of Camino 0.8.3 is now available. The multilingual package contains the following languages: Chinese (Simplified) Chinese (Traditional) Czech Danish Dutch French German Italian Japanese Lithuanian Norwegian bokmål Norwegian nynorsk Portuguese Swedish We’re still looking for Spanish speaking users to assist us with the Spanish translation. If you’re interested, please contact the Camino Localization Project. Who Works on Camino? Posted on Monday, April 4, 2005 at 10:00am PDT by Samuel Sidler This question gets asked a lot. People don't seem to know who the active contributors are or if Camino is even still in development (though hopefully the website cleared that up). Well, now, everyone can know. We've put up a page in our development section, which lists the teams Camino is broken up in to. In no way is the list complete as many, many more people contribute to Camino. The list just contains most of the major contributors. Take a look. Camino is growing faster than ever thanks to those people. Macnews.de Interviews Josh Aas Posted on Friday, April 1, 2005 at 10:00am PDT by Jasper Hauser Josh Aas did an interview with macnews.de, but they only posted it in German. Josh made an English version available on his blog. Camino 0.8.3 Released Posted on Thursday, March 31, 2005 at 10:00am PDT by Samuel Sidler We've just released Camino 0.8.3! This latest release on the Camino 0.8 branch fixes many crash issues and upgrades Camino to the Mozilla Gecko 1.7.6 engine. Check out the complete release notes. Please note: The multilingual version of 0.8.3 isn’t quite ready yet. As soon as it is, we’ll let you know. Website Issues Posted on Monday, March 28, 2005 at 10:00am PDT by Samuel Sidler Over the last day or two, you may have noticed downtime. I assure you, the server this site runs on was up the entire time. However, one of our DNS servers went down. I apologize for this. Over the next 48 hours, as DNS information updates, you may or may not notice that we have a new host. With a guarantee of 100% uptime (unless some act of God changes that) and no issues with DNS, I’m looking forward to keeping this site on 24/7. Apologies for this weekend. We’re making it better. Camino 0.9 Progress Posted on Saturday, March 26, 2005 at 10:00am PDT by Jasper Hauser Josh Aas writes, By making some tough calls (no form autofill in 0.9) and fixing a bunch of bugs, we are down to 35 bugs blocking an 0.9 release. We’ll be down some more by the end of the day.At this point we could really use some bug triage help. If people could go over Camino bugs and set the 0.9 blocker request flag on any that look critical (we have such a flag in bugzilla now), that would be great. We don't want to miss any critical issues.Read more » Camino 0.8.3 Release Candidate Posted on Thursday, March 24, 2005 at 10:00am PDT by Samuel Sidler If you haven’t seen Mike Pinkerton’s blog yet, a Release Candidate for Camino 0.8.3 has been made public. Compare this version with 0.8.2 (not the trunk nightly builds) and if all is well, the final release will be made. Check out Mike’s post for more info and to download the release candidate. 0.8.3 Coming Soon and 0.9 Roadmap Posted on Wednesday, March 23, 2005 at 10:00am PDT by Jasper Hauser Mike Pinkerton just posted on his weblog (Read more): Now that the 17branch is allowing checkins, I’ve landed the last thing on our checklist for an 083 release. This morning I’m spinning a build (branded 082+) which will be the first release candidate.As far as 0.9 goes, we’ve decided we need to shorten our timeline and get this baby out the door sooner rather than waiting for all the features we wanted. Nightly builds already have a lot of great improvements and we need to get into a cycle of releasing more often, not once a year. That means some features will have to wait, namely big ticket items like spell checking and autofill (which, btw, is much harder than one would think). I know people have been begging for those features for a long time, but we can’t hold the world waiting for them. It’s better to release without them then never release...” It’s a Small Town Posted on Tuesday, March 22, 2005 at 10:00am PDT by Jasper Hauser With the launch of the new site we didn’t really make sure to send out release notes to news websites. But with the power of weblogs and the fact that news websites (Slashdot) keep their eyes open all the time we had some serious traffic. It's good fun watching Camino popping up all over the web. Unfortunately a large group of websites seem to think we also released a new version (v0.8.2) while we released that version early December 2004. We are actually hard at work finalizing v0.8.3 which should get released pretty soon. Better yet, v0.9 is right around the corner as well. As the website is still being worked on, please send us any comments or bugs you find. It’s Official Now Posted on Monday, March 21, 2005 at 12:00pm PDT by Jasper Hauser All of the important things have been done. Submitted to google, so you will always find us. www.mozilla.org/projects/camino will link this way. I made sure all my private camino/chimera pages and sections on my website now link here. www.caminox.org links this way. Later next week I hope to finalize the website making sure the community section is done. Also making sure all links from within Camino work for 083 and 09. Enough to keep me busy for a while but the result is very nice! Enjoy. Welcome to the New Camino Project Website! Posted on Monday, March 21, 2005 at 10:00am PDT by Samuel Sidler This is it. Our brand new website. Months of work went into making this the best possible website for you, the community, to use. This last week, the Camino-Docs team poured their heart and souls into making sure every error was found. That doesn’t mean it’s perfect, but pretty close. So have a look around. We’ve made it easier to tell your friend about Camino’s features as well as given them the easiest way possible to help out. Casual users will love the simple beauty of the site. Power users will find the help section quite helpful in getting the most out of Camino. Even developers and programmers get a revamped section allowing them to easily build and work on Camino. A big thank you to Jasper Hauser, the designer of this website. Without him, you’d be looking at black text on a white background. If you have any questions at all, please drop us an email. Feed Use this feed to track our blog in your favorite feed reader. Blog Archives 2013 2012 2011 2010 2009 2008 2007 2006 2005"
