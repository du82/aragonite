["https://caminobrowser.org/blog/2008"]
title = "Camino. Blog. 2008 Archives"
description = "Camino is a Mac OS X-native browser built on Mozilla’s Gecko rendering engine."
full_description = "Camino 2.0 Beta 1 Released! Posted on Tuesday, December 23, 2008 at 11:45am PST by Samuel Sidler After months of hard work following the release of Camino 1.6, the Camino Project is proud to announce the second preview release of Camino 2. Camino 2.0 Beta 1 contains several notable improvements, including support for rearranging tabs by drag and drop, the ability to disable “Block Flash animation” on a per-site basis, tab overview, full content zoom, better support for Full Keyboard Access in the browser window, and a “Recently Closed Pages” menu. Camino 2.0 Beta 1 also has all of the improvements in version 1.9.0 of Mozilla’s Gecko rendering engine, leading to better performance with popular plug-ins and enhanced support for web standards. For more information and to download, please visit our preview site. Camino 1.6.6 Released! Posted on Tuesday, December 16, 2008 at 3:30pm PST by Samuel Sidler We’ve just released Camino 1.6.6, a maintenance release which contains various security and stability updates to Camino 1.6.x. All users are urged to update. In addition, Camino 1.6.6 is available in the following languages: Catalan Czech Dutch English (US) French German Italian Japanese Norwegian (Bokmål) Polish Portuguese (Brazillian) Russian Spanish (Castellano) Swedish Download Camino 1.6.6 in English or its multilingual version now. Camino 1.6.5 Released! Posted on Tuesday, November 18, 2008 at 1:45pm PST by Samuel Sidler We’ve just released Camino 1.6.5, a maintenance release which contains various security and stability updates to Camino 1.6.x. All users are urged to update. In addition, Camino 1.6.5 is available in the following languages: Catalan Czech Dutch English (US) French German Italian Japanese Norwegian (Bokmål) Polish Portuguese (Brazillian) Russian Spanish (Castellano) Swedish Download Camino 1.6.5 in English or its multilingual version now. Camino 2.0 Alpha 1 Released! Posted on Tuesday, October 21, 2008 at 11:00am PDT by Samuel Sidler After months of hard work following the release of Camino 1.6, the Camino Project is proud to announce the first preview release of Camino 2. Camino 2.0 Alpha 1 contains several notable improvements, including tab overview, full content zoom, better support for Full Keyboard Access in the browser window, and a “Recently Closed Pages” menu. Camino 2.0 Alpha 1 also has all of the improvements in version 1.9.0 of Mozilla’s Gecko rendering engine, leading to better performance with popular plug-ins and enhanced support for web standards. For more information and to download, please visit our preview site. Camino 1.6.4 Released! Posted on Tuesday, September 23, 2008 at 4:45pm PDT by Samuel Sidler We’ve just released Camino 1.6.4, a maintenance release which contains various security and stability updates to Camino 1.6.x. All users are urged to update. In addition, Camino 1.6.4 is available in the following languages: Catalan Czech Dutch English (US) French German Italian Japanese Norwegian (Bokmål) Polish Portuguese (Brazillian) Russian Spanish (Castellano) Swedish Download Camino 1.6.4 in English or its multilingual version now. Camino 1.6.3 Released! Posted on Thursday, August 7, 2008 at 11:45am PDT by Samuel Sidler We’ve just released Camino 1.6.3, a maintenance release which contains various security and stability updates to Camino 1.6.x. All users are urged to update. In addition, Camino 1.6.3 is available in the following languages: Czech Dutch English (US) French German Italian Japanese Norwegian (Bokmål) Polish Portuguese (Brazillian) Russian Spanish (Castellano) Swedish Download Camino 1.6.3 in English or its multilingual version now. Camino 1.6.1 MultiLang Updated! Posted on Wednesday, June 4, 2008 at 1:45pm PDT by Samuel Sidler We’ve just released an updated version of the Camino 1.6.1 MultiLang build. This version fixes a serious problem with the Bookmarks Manager in the Spanish localization and a sizing problem with the update window in the French localization. Software update will announce the update to users of the MultiLang version. Camino 1.6.1 Released! Posted on Tuesday, May 20, 2008 at 2:00pm PDT by Samuel Sidler We’ve just released Camino 1.6.1, a maintenance release which contains various security and stability updates to Camino 1.6. All users are urged to update. In addition, Camino 1.6.1 is available in the following languages: Czech Dutch English (US) French German Italian Japanese Norwegian (Bokmål) Polish Portuguese (Brazillian) Russian Spanish (Castellano) Swedish Download Camino 1.6.1 in English or its multilingual version now. Camino 1.6 Released! Posted on Thursday, April 17, 2008 at 1:00pm PDT by Samuel Sidler The Camino Project is proud to announce Camino 1.6, a major update to the Camino web browser. Camino 1.6 includes a number of new features and improvements on top of Camino 1.6 including a customizable toolbar search field, a find bar, software update, a scrolling tab bar, and enhanced AppleScript support. For a list of features in Camino, check out our features page. Also, check out our release notes for more detailed information. Camino 1.6 is available today in 11 languages: Dutch English (US) French German Italian Japanese Norwegian (Bokmål) Polish Portuguese (Brazillian) Russian Swedish As always, you can download Camino 1.6 (or the multilingual version) from our website. Camino 1.6 is available for users of Mac OS X 10.3.9 or later. 2008 Summer of Code Deadline Extended! Posted on Monday, March 31, 2008 at 2:25pm PDT by Samuel Sidler Google announced today that the deadline for student applications for this summer’s program has been extended until Monday, April 7, 2008. If you’re interested in applying for one of our suggested projects, or if you have another idea for a Camino project, you have another week to develop and polish you application. We look forward to receiving applications for this summer, and we wish all applicants good luck! Camino 1.6 Beta 4 Released! Posted on Thursday, March 27, 2008 at 2:00pm PDT by Samuel Sidler You might recall that we released Camino 1.6 Beta 3 only two days ago. Unfortunately, we discovered a crash related to clicking on <select>s after the release, and early crash data indicated that many users were experiencing this crash. Because of this, we decided to release Camino 1.6 Beta 4 to fix that crash and a less common crash that could happen when opening the Privacy preferences. We’d like to apologize for the short time between updates, and we hope all of our users enjoy Camino 1.6 Beta 4. Camino 1.6 Beta 4 contains the same enhancements as Camino 1.6 Beta 3; you can read all about those features in the Camino 1.6 Beta 3 post. Camino 1.6 Beta 4 requires Mac OS X 10.3.9 or higher. For more information and to download, please visit our preview site or choose Check for Updates… from the Camino menu in Camino 1.6 Alpha 1 and newer. Camino 1.6 Beta 3 Released! Posted on Tuesday, March 25, 2008 at 2:15pm PDT by Samuel Sidler After months of hard work following the release of Camino 1.5, the Camino Project is proud to announce the third preview release of Camino 1.6. Camino 1.6 Beta 3 contains several enhancements that build upon the great features in Camino 1.5, including Keychain support for multiple accounts, the ability to use certain web-based feed readers, a new Find toolbar, improved capabilities for adding and managing search engines, improved tabbed browsing, better AppleScript support, and built-in software update for release builds. Camino 1.6 Beta 3 now requires Mac OS X 10.3.9 or higher. For more information and to download, please visit our preview site or choose Check for Updates… from the Camino menu in Camino 1.6 Alpha 1 and newer. Camino 1.5.5 Released! Posted on Thursday, February 7, 2008 at 8:30pm PST by Samuel Sidler We’ve just released Camino 1.5.5, a maintenance release which contains various security and stability updates to Camino 1.5.4. All users are urged to update. In addition, Camino 1.5.5 is being released in the following localizations: Czech Dutch English (British) English (US) French German Italian Japanese Norwegian (Bokmål) Polish Portuguese (Brazillian) Russian Slovak Spanish (Castellano) Swedish Download Camino 1.5.5 in English or its multilingual version now. Camino 1.6 Beta 2 Released! Posted on Tuesday, January 21, 2008 at 10:00am PDT by Samuel Sidler After months of hard work following the release of Camino 1.5, the Camino Project is proud to announce the second preview release of Camino 1.6. Camino 1.6 Beta 2 contains several enhancements that build upon the great features in Camino 1.5, including a new Find toolbar, improved capabilities for adding and managing search engines, improved tabbed browsing, better AppleScript support, and built-in software update for release builds. For more information and to download, please visit our preview site or choose Check for Updates… from the Camino menu in Camino 1.6 Alpha 1 and newer. Feed Use this feed to track our blog in your favorite feed reader. Blog Archives 2013 2012 2011 2010 2009 2008 2007 2006 2005"
