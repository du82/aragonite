["https://caminobrowser.org/releases/0.7"]
title = "Camino. Releases. 0.7"
description = "Camino is a Mac OS X-native browser built on Mozilla’s Gecko rendering engine."
full_description = 'Camino 0.7 Release Notes Camino 0.7 is no longer the most recent release. Please download the latest stable release. As of this release, Chimera is now called Camino. The following changes and improvements have been made since the Chimera 0.6 release. Highlights Name change (legal reasons). New name is Camino™. This was the primary reason why this release was delayed, sorry for the wait. New Download Manager, with auto-download and auto-dispatch. Compatible with URL Manager Pro Page Text Encodings menu Global History in the sidebar Send Link menu item, and other new toolbar buttons Dragging of images and links to the desktop, and other applications Support for Shockwave Directory content Uses Bonjour (Rendezvous) to show local FTP and web servers Supports Proxy Auto-config User Interface Camino now has a Text Encoding submenu, allowing you to override the character set of a page when it doesn’t display correctly. Camino now supports the Menu Sharing protocol, allowing applications like URL Manager Pro to work. Popup windows no longer do an ugly resize-flash when they appear. If you type something in the URL bar before Camino finishes loading the first page, it will no longer get replaced by the page URL. Global history is now visible in the sidebar (and is much faster than before). Redesigned content-generated dialogs (like cookie and JavaScript dialogs) to autosize. JS dialogs are identified by a ‘[JavaScript Application]’ label to avoid spoofing attacks now. Menus and Toolbars New, brighter toolbar icons. Added a “Send Link” command to the File menu (with an optional toolbar button), which opens a mail message with the URL of the current page in your favorite mail application. Added additional optional toolbar buttons for New Tab, Close Tab, Search etc. Added some new items to the context menus, relating to frames, and copying images. Added support for copying images to the clipboard, and dragging images and links to the desktop, and to other applications. Fixed an issue that would cause the wrong window to be used for loading a bookmark, or URL sometimes. The “small icons” toolbar mode is shorter now to save screen space. Downloading Downloads are now shown in a Download manager, reducing the number of open windows. If you quit while downloads are in progress, Camino will warn you now. Downloads now start automatically, saving into your Downloads folder, without asking you where to save the file. Option-click a link if you want to specify a different location at which save the file. Added a preference (in the Downloads tab of the Navigation pane) to automatically dispatch downloaded files to helper applications. For security reasons, this defaults to being off. Plugins Shockwave Director content now loads in Camino. The Default plugin (which displays when you’re missing the plugin for some content) correctly remembers which MIME type you’ve seen before now. Context menus for plugins now display correctly, RealPlayer video displays more reliably, and plugins are less likely to draw incorrectly when being scrolled. The QuickTime plugin now correctly handles more MIME types now. Fixed various MRJ (Java) plugin issues (but not, as yet, the problem of typing and dragging in applets). Web Page Display The default resolution was set to 96dpi, to better match other Mac browsers. You may have to adjust your preferred font sizes to compensate. The User-Agent string now contains ”Mach-O” and “Camino” to allow web authors to more accurately identify the browser. Framesets loaded in background tabs show correctly now Typing performance in textareas was somewhat improved. Tabbing to a text field now selects its content. If JavaScript on a page calls window.close(), we now close just the tab for that page, if there are multiple tabs. Form controls no longer draw in ”bold” Pages loading in background tabs now show errors if the load fails, as they should. Camino now respects the “autocomplete=off” attribute on web forms, for sites that don’t want username/password filling for security reasons. Fixed an issue with the sizing of form controls when zooming. Fixed some "smearing" display problems with absolutely-positioned elements. If you need to see JavaScript errors, you can set a hidden pref ("chimera.log_js_to_console") to have Camino dump them to the console. Bookmarks Command-clicking a toolbar link, or a bookmark in the sidebar will load it in a new tab now. You can put a bookmark folder in the Dock menu now (do a Get Info on a bookmark folder in Camino). Mac OS X 10.2 only. It’s now possible to convert a bookmarks tab group to a normal folder, and vice versa (via a checkbox in the bookmark Get Info panel). You can import Camino-format bookmarks.xml files. It’s now possible to export bookmarks to an HTML file now (via an item on the application menu) Site icons (“favicons”) are shown on the bookmarks toolbar now. Networking Camino will now pick up changes made to the system proxy settings (e.g. when you change Locations in the Network System Preferences) without having to be restarted. Camino will only show “Connection Refused” and “Unknown host” errors for the main page now, rather than images and iframe contents. This helps those using proxy techniques for image blocking. Other Changes The Print dialog now has a “Web Browser” panel that allows you to control the printing of background colors and images, among other options. Camino now supports the Services menu in web content. You can get the URL of the front window via AppleEvents now. Holding down the Shift key while using the scrollwheel scrolls sideways now. Fixed an issue with QuickDraw that caused a number of random crashes. Camino will now run if your home directory is on a network volume. Some memory leaks were fixed. Added the ability to set the preferred minimum font size, in the Advanced panel of the Appearance font prefs. Fixed an issue where Camino could use a lot of CPU when waking from sleep. Camino is more compatible with the “Metallizer” haxie now. Known issues Shockwave Director content displays at the wrong location in the window, if hardware rendering is enabled. Typing and dragging in Java applets does not work correctly. The Windows Media Player plugin is not compatible with Camino. If you try to open Camino’s AppleScript dictionary, say from Script Editor, you’ll get an error. To work around this, open the application package, and remove the “Localized.rsrc” file in Contents/Resources/English.lproj. This will, however, prevent Shockwave Director content from loading so we recommend you do this on a copy of the application. Issues remain when typing in non-Roman languages; sometimes hitting the Delete key can cause Camino to go Back, rather than deleting text. Download English | Multilingual--> Release Date March 6, 2003 Available Languages English (US)'
