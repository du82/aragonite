title = "CAMMAC – Welcome to CAMMAC"
full_description = "LES INSCRIPTIONS POUR LES CAMPS ET RETRAITES MUSICAUX 2025 SONT MAINTENANT OUVERTES: RÉSERVEZ VOTRE PLACE DÈS MAINTENANT! CAMMAC: vivre la musique! Faire de la musique est au cœur de la mission de CAMMAC – notre but est de créer un véritable paradis où les mélomanes peuvent se réunir pour chanter, jouer, apprendre et écouter de la musique. À CAMMAC, vous trouverez un environnement détendu, convivial et non compétitif où vous pourrez rencontrer des gens qui partagent votre passion pour la musique. Que vous soyez au tout début de votre cheminement en tant que musicien ou que vous possédiez une grande expérience, nos professeurs exceptionnels vous offriront le soutien nécessaire pour évoluer, peu importe votre âge ou votre niveau de compétence. Vous ne savez pas lire la musique? Ce n’est pas grave! Jumelez-vous à un chanteur aguerri qui vous aidera à suivre. L’objectif est de s’immerger dans l’expérience musicale, tout en ayant du plaisir. Bien que cela constitue un défi de taille, nous sommes fiers de dire que les nouveaux participants nous disent souvent que CAMMAC a changé leur vie! DÉCOUVREZ LE MEILLEUR DE CE QUE LA NATURE ET LA MUSIQUE ONT À OFFRIR! Le Centre musical CAMMAC: unique au Canada La vision et les valeurs fondamentales de CAMMAC sont un exemple du type de société que nous souhaitons au Canada: des gens qui vivent une vie heureuse, saine et productive et qui, par des expériences artistiques communes, cultivent leur croissance personnelle et leur sentiment d’appartenance; et ce, dans un environnement bilingue établissant des ponts entre nos cultures. Les concerts, camps et des programmes musicaux proposés par le Centre musical CAMMAC permettent aux mélomanes et musiciens amateurs de vivre des expériences uniques et enrichissantes, dans un cadre naturel d’une beauté exceptionnelle. En cultivant des expériences musicales inclusives qui transcendent les barrières de l’âge, de la langue et de la culture, nos activités illustrent pleinement ce que Simon Brault, PDG du Conseil des arts du Canada, décrit comme une «culture participative» dans son ouvrage La Culture avec un grand C. DÉCOUVREZ LES PROGRAMMES AU CENTRE MUSICAL CAMMAC CAMMAC: un soutien essentiel à la musique canadienne CAMMAC joue un rôle essentiel dans l’écosystème musical canadien. Au fil des années, nous avons nourri les talents de nombreux artistes canadiens de renom, parmi lesquels on retrouve Yannick Nézet-Séguin, Daniel Taylor, Timothy Hutchins et Gregory Charles. De surcroît, les participants aux activités de CAMMAC sont hautement représentatifs du public cible des concerts de musique classique professionnelle – les personnes mêmes qui permettent à la musique classique de survivre dans le monde d’aujourd’hui. APPORTEZ VOTRE SOUTIEN À LA MISSION DE CAMMAC EN FAISANT UN DON CARTES POSTALES MUSICALES DE CAMMAC ÉDITION 2024: UNE VITRINE NUMÉRIQUE D'EXCELLENCE ARTISTIQUE! À la suite de la publication de Cartes postales musicales du Centre musical CAMMAC en 2021, nous sommes ravis de vous présenter une nouvelle série de vidéos, à nouveau soutenue par le Conseil des arts du Canada dans le cadre de la subvention Présent numérique! Créées entre octobre 2023 et mars 2024, ces neuf nouvelles vidéos ont été filmées au Centre musical CAMMAC, dans la région des Laurentides au Québec, et au Conservatoire de musique de Montréal. Elles mettent en vedette un groupe éclectique de 26 membres du corps professoral exceptionnel de CAMMAC, dont plusieurs figurent parmi les meilleurs artistes interprètes du Canada. Ce projet a été réalisé avec le soutien du programme Présent numérique du Conseil des arts du Canada. POUR EN SAVOIR PLUS ET VOIR LES VIDÉOS ET CE N’EST PAS TOUT En plus de son Centre musical dans les Laurentides, CAMMAC est présent dans les régions d’Ottawa-Gatineau, de Toronto et de Montréal, où une foule d’activités musicales sont offertes – des concerts, des lectures à vue et plus encore – pour le plus grand plaisir des mélomanes. PARTENAIRES"
year_published = 2025
