ery__thumb swiper-lazy" src="https://live.staticflickr.com/65535/51177372067_d5474bab13_m.jpg" width="240" height="160" loading="lazy" data-eio="l" /> <img decoding="async" class="cmpr-gallery__thumb swiper-lazy" src="https://live.staticflickr.com/65535/51178050941_5146c77233_m.jpg" width="240" height="160" loading="lazy" data-eio="l" /> <img decoding="async" class="cmpr-gallery__thumb swiper-lazy" src="https://live.staticflickr.com/65535/51179144675_b51ec3ce27_m.jpg" width="240" height="160" loading="lazy" data-eio="l" /> <img decoding="async" class="cmpr-gallery__thumb swiper-lazy" src="https://live.staticflickr.com/65535/51178272553_b4c74f7109_m.jpg" width="240" height="160" loading="lazy" data-eio="l" /> <img decoding="async" class="cmpr-gallery__thumb swiper-lazy" src="https://live.staticflickr.com/65535/51179144185_bfabf640cf_m.jpg" width="160" height="240" loading="lazy" data-eio="l" /> <img decoding="async" class="cmpr-gallery__thumb swiper-lazy" src="https://live.staticflickr.com/65535/51178272078_890fb5abab_m.jpg" width="240" height="160" loading="lazy" data-eio="l" /> <img decoding="async" class="cmpr-gallery__thumb swiper-lazy" src="https://live.staticflickr.com/65535/51178049841_21f6edf242_m.jpg" width="160" height="240" loading="lazy" data-eio="l" /> Mehr Bilder findest Du auf dem flickr-Account von Campact. Mehr zum Thema Datenschutz im Campact-Blog Blog 12.09.2024 Friedemann Ebelt Widerstandslos in den Digitalzwang? Ticket kaufen oder Überweisung abschicken nur noch per App: Immer mehr Anbieter verlagern ihre Angebote ausschließlich auf die Smartphones ihrer Kundschaft. Welche Konsequenzen dieser Digitalzwang hat und mit welchen Apps man sich unabhängiger von Google und Co. machen kann. Mehr im Blog lesen Blog 09.09.2024 Lena Rohrbach Gesicht zeigen statt Gesichtserkennung Die Regierung will Stimm- und Gesichtserkennung nutzen, um Straftäter ausfindig zu machen. Dabei birgt diese Technologie große Risiken – und Potenzial, an falscher Stelle eingesetzt zu werden. Mehr im Blog lesen Blog 15.08.2024 Friedemann Ebelt Herbst 2024: EU-Pläne für umfassende digitale Überwachung Im Herbst stehen mehrere Termine in Brüssel an, bei denen es um das kaum bekannte „Going Dark“-Programm gehen wird. Wer sich für digitale Grund- und Freiheitsrechte interessiert, sollte da mal genauer hinschauen. Es geht um die Wiedereinführung der anlasslosen und massenhaften Speicherung von Telefon- und Internetdaten und um den Zugriff auf alle verschlüsselten Daten in Smartphones, bei Dienstanbietern oder in Fahrzeugen. Mehr im Blog lesen'
