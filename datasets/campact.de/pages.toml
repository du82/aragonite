["https://www.campact.de/ueber-campact/datenschutz-socialmedia"]
title = "Datenschutz Social Media"
description = "Alle aktuellen Aktionen und Appelle bei Campact – über 2,5 Millionen Unterstützer stehen hinter unserer Bürgerbewegung."
full_description = "Datenschutzerklärung – Social Media Datenschutzerklärung für unsere Social Media Seiten: Nachfolgend möchten wir Dich über den Umgang mit Deinen Daten gem. Art. 13 Datenschutzgrundverordnung (DSGVO) informieren. Verantwortlicher Campact e.V. betreibt folgende Social Media Seiten: X: https://x.com/campact Facebook: https://de-de.facebook.com/campact/ Instagram: https://www.instagram.com/campact.de XING: https://www.xing.com/companies/campacte.v. LinkedIn: https://www.linkedin.com/company/campact-e-v- YouTube: https://www.youtube.com/channel/UCFlVLBEz8BImvDRHLjfOYbw Google+: https://plus.google.com/+campact In Fragen des Datenschutzes (Auskunft und Löschung gemäß DSGVO) wende Dich bitte an „datenschutz[at]campact.de“. Unsere Kontaktdaten findest Du in unserem Impressum. Neben uns gibt es noch den Betreiber der Social-Media-Plattform an sich. Auch dieser ist insofern ein weiterer Verantwortlicher, der eine Datenverarbeitung durchführt, auf die wir jedoch nur begrenzten Einfluss haben. An den Stellen, an denen wir Einfluss nehmen und die Datenverarbeitung parametrisieren können, wirken wir im Rahmen der uns zur Verfügung stehenden Möglichkeiten auf den datenschutzgerechten Umgang durch den Betreiber der Social-Media-Plattform hin. An vielen Stellen können wir die Datenverarbeitung durch den Betreiber der Social-Media-Plattform aber nicht beeinflussen und wissen auch nicht genau, welche Daten dieser verarbeitet. Hierüber klärt der Betreiber allerdings in seiner jeweiligen Datenschutzerklärung auf. Datenverarbeitung durch uns Die von Dir auf unseren Social Media Seiten eingegebenen Daten wie z. B. Kommentare, Videos, Bilder, Likes, öffentliche Nachrichten etc. werden durch die Social-Media-Plattform veröffentlicht und von uns zu keiner Zeit für andere Zwecke verwendet oder verarbeitet. Wir behalten uns lediglich vor, Inhalte zu löschen, sofern dies erforderlich sein sollte. Ggf. teilen wir Deine Inhalte auf unserer Seite, wenn dies eine Funktion der Social-Media-Plattform ist und kommunizieren über die Social-Media-Plattform mit Euch. Rechtsgrundlage ist Art. 6 Abs. 1 S. 1 lit. f DSGVO. Die Datenverarbeitung erfolgt im Interesse unserer Öffentlichkeitsarbeit und Kommunikation.Wenn Du einer bestimmten Datenverarbeitung, auf die wir einen Einfluss haben, widersprechen möchtest, wende Dich bitte an die im Impressum genannten Kontaktdaten. Wir prüfen den Widerspruch dann oder leiten ihn bei Bedarf an die Social-Media-Plattform weiter.Sofern Du uns eine Anfrage auf der Social-Media-Plattform stellst, verweisen wir je nach der erforderlichen Antwort ggf. auch auf andere, sichere Kommunikationswege, die Vertraulichkeit garantieren. Die Möglichkeit, uns vertrauliche Anfragen an unsere im Impressum genannte Anschrift zu schicken, besteht immer.Wie bereits ausgeführt, achten wir an den Stellen, an denen uns der Anbieter der Social-Media-Plattform die Möglichkeit gibt, darauf, unsere Social-Media-Seiten möglichst datenschutzkonform zu gestalten. Im Hinblick auf Statistiken, die uns der Anbieter der Social-Media-Plattform zur Verfügung stellt, können wir diese nur bedingt beeinflussen und auch nicht abschalten. Optionale Statistiken der Social-Media-Plattformen nehmen wir in der Regel nicht in Anspruch. Spendenmöglichkeiten bilden hier eine Ausnahme. Bei der Teilnahme an einer Spendenaktion exportieren wir die im Zuge dieser von den jeweiligen Social-Media-Plattformen (insbesondere Facebook) zur Verfügung gestellten Daten wie zum Beispiel Name, E-Mail, Spendenaktion, Höhe der Spende sowie das Datum. Die Angaben verarbeiten wir für eigene statistische Analysezwecke, im berechtigten Interesse unser Spendenaufkommen validieren zu können. Einsatz von JotURL In unseren Links setzen wir die DeepLink-Funktion des Anbieters JotURL ein, damit das Angebot direkt in der jeweiligen App aufgerufen werden kann. Hierbei erhalten wir anonyme statistische Informationen zu den aufgerufenen Links. Die hierzu erhobenen und notwendigen Verbindungsdaten (z.B. User-Agent, IP-Adressen, Abrufzeit) werden vom Anbieter nicht gespeichert. Die Verarbeitung erfolgt auf Grundlage von Artikel 6, Absatz 1 S.1 lit. f DSGVO. LinkedIn Lead Gen Forms Im Rahmen der Öffentlichkeitsarbeit für unser Weact-Partnerprogramm bei LinkedIn nutzen wir sog. „Lead Gen Forms“. Bei Lead Gen Forms handelt es sich um Werbeanzeigen auf LinkedIn, welche die Einbindung von Kontaktformularen ermöglichen. Die Rechtsgrundlage für den Einsatz dieser Technologie ist Art. 6 Abs. 1 S. 1 lit. f DSGVO. Unser berechtigtes Interesse für den Einsatz dieser Tools dient Marketingzwecken im Rahmen der Öffentlichkeitsarbeit. Mit der Nutzung dieser Formulare bieten wir Interessent*innen die Möglichkeit, uns gezielt um INformationen bitten zu können und entsprechende Kontaktinformationen zu hinterlassen. Diese Funktionalität nutzen wir, um Interessent*innen weitere Informationen zu unserem WeAxct-Partner-Programm zukommen zu lassen. LinkedIn (LinkedIn Lead Generation) LinkedIn setzt zur sog. „Leadgenerierung“ (Kundendatensammlung) Formulare ein und es können Funktionen und Inhalte des Dienstes LinkedIn eingebunden werden. Sofern Du Mitglied der Plattform LinkedIn bist, kann LinkedIn den Aufruf der o.g. Inhalte und Funktionen den dortigen Profilen der Nutzer zuordnen. Weitere Informationen zum Datenschutz und den Lead Gen Ads von LinkedIn findest Du hier: https://www.linkedin.com/legal/privacy-policy bzw. https://business.linkedin.com/de-de/marketing-solutions/native-advertising/lead-gen-ads Du hast die Möglichkeit, dies künftig zu unterbinden, wenn Du ein Opt-Out-Cookie setzt: https://www.linkedin.com/psettings/guest-controls/retargeting-opt-out. Die anschließende Kontaktaufnahme mittels E-Mail erfolgt auf Grundlage Deiner Einwilligung gem. Art. 6 Abs. 1 S. 1 lit. a DSGVO und kann jederzeit durch eine E-Mail an „partner(at)weact.de“ widerrufen werden. Datenverarbeitung durch den Betreiber der Social Media Plattform Der Betreiber der Social-Media-Plattform setzt Webtrackingmethoden ein. Das Webtracking kann dabei auch unabhängig davon erfolgen, ob Du bei der Social-Media-Plattform angemeldet oder registriert bist. Wie bereits dargestellt, können wir auf die Webtrackingmethoden der Social-Media-Plattform leider kaum Einfluss nehmen. Wir können dieses z.B. nicht abschalten.Bitte sei Dir darüber bewusst: Es kann nicht ausgeschlossen werden, dass der Anbieter der Social-Media-Plattform Deine Profil- und Verhaltensdatendaten nutzt, etwa um die Gewohnheiten, persönlichen Beziehungen, Vorlieben usw. auszuwerten. Wir haben insofern keinen Einfluss auf die Verarbeitung Deiner Daten durch den Anbieter der Social-Media-Plattform. Nähere Informationen zur Datenverarbeitung durch den Anbieter der Social-Media-Plattform und weiterer Widerspruchsmöglichkeiten findest Du in der Datenschutzerklärung des Anbieters: X: https://www.x.com/privacy Facebook: https://www.facebook.com/about/privacy/update Instagram: https://www.instagram.com/campact.de XING: https://privacy.xing.com/ LinkedIn: https://www.linkedin.com/static?key=privacy_policy YouTube: https://policies.google.com/privacy?hl=de Google+: https://policies.google.com/privacy?hl=de In den Fällen, in denen wir gemeinsam mit der Social-Media-Plattform für die Verarbeitung verantwortlich sind, findest Du die wesentlichen Inhalte der gemeinsamen Verarbeitung Deiner Daten hier: Facebook: https://www.facebook.com/legal/terms/page_controller_addendum Messengerangebote Campact bietet über WhatsApp Informationen an. Das Angebot kann jeder nutzen, der den Messengerdienst auf seinem mobilen Gerät installiert hat. Bei der Nutzung dieses Angebots gelten die jeweiligen Allgemeinen Geschäftsbedingungen sowie die Datenschutzerklärungen des jeweiligen Messengerdienstanbieters. Mit Installation des Messengerdienstes hast Du den Allgemeinen Geschäftsbedingungen sowie der Datenverarbeitung zugestimmt. Auf die Datenverarbeitung bei den Messengerdiensten haben wir keinen Einfluss. Des Weiteren erhalten wir durch die Nutzung unseres Angebots keinen Zugriff auf personenbezogene Daten, die beim Messengerdienstanbieter gespeichert sind. Die Datenschutzerklärung des Messengerdienstes kannst Du hier abrufen: WhatsApp Deine Rechte als Nutzer*in Bei Verarbeitung Deiner personenbezogenen Daten gewährt die DSGVO Dir als Webseitennutzer bestimmte Rechte, die Du sowohl gegenüber uns als auch gegenüber Facebook ausüben kannst: Auskunftsrecht (Art. 15 DSGVO):Du hast das Recht, eine Bestätigung darüber zu verlangen, ob betreffende personenbezogene Daten verarbeitet werden; ist dies der Fall, so besteht ein Recht auf Auskunft über diese personenbezogenen Daten und auf die in Art. 15 DSGVO im Einzelnen aufgeführten Informationen. Recht auf Berichtigung und Löschung (Art. 16 und 17 DSGVO):Du hast das Recht, unverzüglich die Berichtigung betreffender unrichtiger personenbezogener Daten und ggf. die Vervollständigung unvollständiger personenbezogener Daten zu verlangen.Du hast zudem das Recht, zu verlangen, dass betreffende personenbezogene Daten unverzüglich gelöscht werden, sofern einer der in Art. 17 DSGVO im Einzelnen aufgeführten Gründe zutrifft, z. B. wenn die Daten für die verfolgten Zwecke nicht mehr benötigt werden. Recht auf Einschränkung der Verarbeitung (Art. 18 DSGVO):Du hast das Recht, die Einschränkung der Verarbeitung zu verlangen, wenn eine der in Art. 18 DSGVO aufgeführten Voraussetzungen gegeben ist, z. B. wenn Du Widerspruch gegen die Verarbeitung eingelegt hast, für die Dauer einer etwaigen Prüfung. Recht auf Datenübertragbarkeit (Art. 20 DSGVO):In bestimmten Fällen, die in Art. 20 DSGVO im Einzelnen aufgeführt werden, hast Du das Recht, die betreffenden personenbezogenen Daten in einem strukturierten, gängigen und maschinenlesbaren Format zu erhalten bzw. die Übermittlung dieser Daten an einen Dritten zu verlangen. Widerspruchsrecht (Art. 21 DSGVO):Werden Daten auf Grundlage von Art. 6 Abs. 1 S. 1 lit. f erhoben (Datenverarbeitung zur Wahrung berechtigter Interessen), steht Dir das Recht zu, aus Gründen, die sich aus Deiner besonderen Situation ergeben, jederzeit gegen die Verarbeitung Widerspruch einzulegen. Wir verarbeiten die personenbezogenen Daten dann nicht mehr, es sei denn, es liegen nachweisbar zwingende schutzwürdige Gründe für die Verarbeitung vor, die die Interessen, Rechte und Freiheiten der betroffenen Person überwiegen, oder die Verarbeitung dient der Geltendmachung, Ausübung oder Verteidigung von Rechtsansprüchen. Beschwerderecht bei einer Aufsichtsbehörde Gemäß Art. 77 DSGVO hast Du das Recht auf Beschwerde bei einer Aufsichtsbehörde, wenn Du der Ansicht bist, dass die Verarbeitung der Dich betreffenden Daten gegen datenschutzrechtliche Bestimmungen verstößt. Das Beschwerderecht kann insbesondere bei einer Aufsichtsbehörde in dem Mitgliedstaat Deines Aufenthaltsorts, Arbeitsplatzes oder des Orts des mutmaßlichen Verstoßes geltend gemacht werden. Kontaktdaten des Datenschutzbeauftragten Unser Datenschutzbeauftragter steht gerne für Auskünfte oder Anregungen zum Thema Datenschutz zur Verfügung: Dr. Uwe Schlägerdatenschutz nord GmbHKonsul-Smidt-Straße 8828217 BremenWeb: www.datenschutz-nord-gruppe.deE-Mail: office@datenschutz-nord.deTelefon: 0421 69 66 32 0"
