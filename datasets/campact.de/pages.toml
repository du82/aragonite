full_description = 'Datenschutz Campact fordert von Industrie und Politik Datenschutz und -sicherheit. Auf dieser Seite findest Du alle aktuellen Kampagnen und Informationen zu vergangenen Aktionen.<img fetchpriority="high" decoding="async" width="1400" height="733" src="https://www.campact.de/wp-content/uploads/2023/09/campact-kampagnen-datenschutz.jpg" class="wp-block-cmpr-intro__image" alt="Datenschutz statt Profite! Eine Protest-Aktion von Campact gegen den mangelnden Datenschutz bei Facebook und Co." srcset="https://www.campact.de/wp-content/uploads/2023/09/campact-kampagnen-datenschutz.jpg 1400w, https://www.campact.de/wp-content/uploads/2023/09/campact-kampagnen-datenschutz-300x157.jpg 300w, https://www.campact.de/wp-content/uploads/2023/09/campact-kampagnen-datenschutz-1024x536.jpg 1024w, https://www.campact.de/wp-content/uploads/2023/09/campact-kampagnen-datenschutz-768x402.jpg 768w" sizes="(max-width: 1400px) 100vw, 1400px" data-eio="l" /> Datenschutz: Aktionen von Campact Schufa: Finger weg von meinem Konto Ob Kontostand oder Gehalt: Mit diesen Informationen will die Schufa ihre Datenmacht ausbauen. Und nutzt dazu unsere Abhängigkeit vom Schufa-Score aus. Schütze Deine Daten – sag Nein zu diesen Ausspäh-Plänen! Appell unterzeichnen Erfolg: WhatsApp knickt ein Nach massiver Kritik an den neuen WhatsApp-Datenschutzbestimmungen lenkt der Mutterkonzern Facebook ein. Das ist auch der Erfolg von über 250.000 Campact-Unterstützer*innen. Mehr erfahren Bestelle den Campact-Newsletter Dein Engagement entscheidet, ob Campact mit seinen Appellen und Aktionen erfolgreich ist. Abonniere jetzt den Campact-Newsletter und schließe Dich uns an. Mehr erfahren Schließe Dich uns an Campact-Aktion vor der Facebook-Zentrale in Hamburg Externer Inhalt von Flickr: Mit einem Klick kannst Du Dir die Bildergalerie ansehen. Lies mehr in unserer Datenschutzerklärung. <img decoding="async" class="cmpr-gallery__image swiper-lazy" src="https://live.staticflickr.com/65535/51177373832_b052