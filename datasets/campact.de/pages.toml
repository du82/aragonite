["https://www.campact.de/externe-dienste-bei-campact"]
title = "Externe Dienste bei Campact"
description = "Welche externen Dienste und Dienstleister kommen auf der Website von Campact zum Einsatz? Erfahren Sie es hier."
full_description = "Externe Dienste und Dienstleister Auf der Website von Campact kommen zurzeit folgende externe Dienste und Dienstleister zum Einsatz. Dienste LamaPoll – Eine Umfragesoftware, mit der wir kurz vor einem Kampagnenstart prüfen, ob eine Kampagnenidee auch von der Mehrzahl der Campact-Aktiven mitgetragen wird. Je nach Situation nutzen wir diesen Dienst auch um andere Umfragen durchzuführen. Hier finden Sie weitere Informationen zum Einsatz von Lamapoll durch Campact. WordPress – Eine Blog-Software (betrieben auf einem eigenen Server), mit der wir unsere Berichterstattung von Aktionen und über aktuelle politische Entwicklungen organisieren. Facebook – Campact betreibt eine eigene Facebook-Page, auf der wir über unsere Kampagnen und Aktionen berichten. Auf campact.de bieten wir Campact-Aktiven die Möglichkeit, Informationen über Aktionen und Kampagnen mit Freunden auf Facebook zu teilen und so zu verbreiten oder Fan der Campact-Page zu werden. Die dabei zum Einsatz kommenden Share- und Vernetzen-Buttons sind durch Two-Clicks-Buttons organisiert, so dass Informationen erst nach Aktivierung des Buttons an Facebook übermittelt werden. X – Campact Informationen können auch über einen X-Stream abonniert werden. Per Button können Sie dies auch über campact.de tun. Ebenfalls per Klick können Sie Informationen über Aktionen und Kampagnen in Ihren X-Stream posten. Wie bei Facebook wird die Verbindung zu X erst bei Aktivierung des jeweiligen Buttons erstellt. YouTube – Um eine möglichst hohe Verbreitung der von uns produzierten Videos zu erreichen, stellen wir unsere Kampagnenvideos auf die Videoplattform Youtube ein. Auf www.campact.de wird eine Verbindung zu Youtube erst mit dem Click auf das Video erstellt. In unserem WordPress-Blog unter blog.campact.de sind die Videos in älteren Beiträgen gelegentlich noch direkt eingebunden. Flickr – Auf dem Bilderdienst Flickr finden Sie alle Fotos von Campact-Aktionen. Bilder unter www.campact.de werden jeweils direkt und nicht über Flickr eingebunden. Werbung über Google-Adwords & Co. – Campact wirbt auch im Internet mit Suchwort- oder inhaltsbezogener Online-Werbung. Die Anzeigen erscheinen z.B. in der Google-Suche oder auf Webseiten von Tageszeitungen und haben bereits mehrere zehntausend Menschen zu Campact geführt und damit das Gewicht unserer politischen Kampagnen weiter erhöht. Bei Klick auf diese Anzeigen wird eine Datenverbindung zu Werbeanbieter (wie Google) aufgebaut. Auf Campact.de werden keine Werbebanner von Drittanbieter angezeigt. Kredikartendienst – Campact nutzt ein Kreditkartenformular des Finanzdienstleisters Nexi. Zu diesem Zeitpunkt wird durch Campact zunächst nur eine interne Kennziffer für die Zuordnung der Spenden zu den richtigen Kampagnen übertragen. Nexi speichert bei erfolgter Spende aus Sicherheitsgründen Ihre IP-Adresse und die persönlichen Daten (Adresse / Kreditkartendaten), um die Spende abbuchen zu können. Mehr zum Datenschutz bei Nexi finden Sie unter https://www.nexi.de/de/legal-footer/datenschutzerklaerung Sniply – Dieses Tool zum Anzeigen von Artikeln als Banner in Onlineportalen setzen wir zur Verbreitung von Blogbeiträgen ein. Facelift – Um unsere Facebookseite besser betreuen zu können nutzen wir dieses Werkzeug. Recruitee – Um unsere Kommunikation mit Bewerber*innen zu optimieren setzen wir dem Dienst Recruitee ein. Podigee – Ein Dienst, den wir zur Bereitstellung unseres Podcasts nutzen. PIWIK – Ein Dienst den wir zum Consentmanagement und zu Analysezwecken einsetzen Videotaxi – Ein Dienst den wir zum streamen von Webinaren und anderen Onlineveranstaltungen nutzen. Easypromos – Ein Dienst den wir zum erstellen von Bildmosaiken nutzen. AppSignal – Ein Dienst zur Fehleranalyse und Leistungsverbesserung. Myra – Ein Dienst zum Schutz vor webbasierten Angriffen. Dienstleister Webhosting – Die Seiten unter *.campact.de betreiben wir mit Hilfe der Dienstleister Raidbox, Freistil, Syseleven und InternetX. Mailversand – Unseren Newsletter versenden wir über den Mailingdienstleister Mailjet der zum Konzern Sinch gehört. Kreditkartendienstleister – Die Verarbeitung von Spenden via Kreditkarte erfolgt durch die Nexi GmbH Materialversand und Konfektionierung – führen wir regelmäßig mit der Heimert Print GmbH und mit dem Druckhaus Dülmen durch, welches auch viele unserer Aktionsmaterialien produziert. Spendendatenbank OpenMove – Für unsere Spendenverwaltung nutzen wir die Software OpenMove der KR2 Media Data GmbH, welche uns auch bei deren Betrieb unterstützt. IT-Dienstleistungen und Entwicklung – Bei der Weiterentwicklung und im Betrieb unserer Kampagnensoftware werden wir von AboutSource tatkräftig unterstützt. Aktenvernichtung – Die datenschutzkonforme Vernichtung von Akten und Datenträgern übernimmt für uns die Lebenshilfe Rotenburg-Verden gGmbH. SMS-Versand – Die SMS mit dem Bestätigungscode versenden wir über unseren Dienstleister Sinch. Die SMS-Informationen selbst versendet unser SMS-Dienstleister websms für uns. Bewerbungen – Für unseren Bewerbungsprozess arbeiten wir mit Talents4Good zusammen. WordPress – bei dem Betrieb unserer verschiedenen WordPress-Seiten werden wir von der Agentur Palasthotel unterstützt."
year_published = 2025
year_updated = 2024
