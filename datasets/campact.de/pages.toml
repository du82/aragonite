["https://www.campact.de/ueber-campact/transparenz"]
title = "Transparent und seriös: Erfahre hier, wie Campact arbeitet"
description = "Campact ist seriös, unabhängig und arbeitet überparteilich. Transparenz und Glaubwürdigkeit sind Campact als Bürgerbewegung enorm wichtig."
full_description = 'Transparenz Campact setzt sich seit Jahren für mehr Transparenz in der Politik ein. Das können wir uns nur glaubhaft tun, wenn wir auch über die eigenen Strukturen und Finanzen von Campact seriös und transparent berichten. Campact beteiligt sich daher an der Initiative Transparente Zivilgesellschaft. <img decoding="async" src="https://www.campact.de/wp-content/uploads/2023/11/itz-logo.svg" class="wp-block-cmpr-intro__image" alt="Logo Initiative Transparente Zivilgesellschaft" data-eio="l" /> Campact ist Teil der Initiative Transparente Zivilgesellschaft Bei seiner Arbeit folgt Campact den Richtlinien der Initiative Transparente Zivilgesellschaft. Auf Initiative von Transparency Deutschland e.V. haben zahlreiche Akteure aus der Zivilgesellschaft und der Wissenschaft zehn grundlegende Punkte definiert, die jede zivilgesellschaftliche Organisation der Öffentlichkeit zugänglich machen sollte. Dazu zählen unter anderem die Satzung, die Namen der wesentlichen Entscheidungsträger*innen sowie Angaben über Mittelherkunft, Mittelverwendung und Personalstruktur. Campact erfüllt alle zehn Transparenzinformationen der Initiative Transparente Zivilgesellschaft und macht noch weitere öffentlich. Die Transparenzinformationen sind übersichtlich auf folgender Seite aufgelistet: https://campact.org/itz Transparenzbericht Einmal im Jahr veröffentlicht Campact einen Transparenzbericht, mit dem wir über unsere Kampagnen, Erfolge und Aktionen informieren. Campact finanziert sich durch Spenden von hunderttausenden Menschen und verfolgt seine Anliegen unabhängig von Parteipolitik und Konzerninteressen. Uns ist wichtig, unabhängig zu sein und zu bleiben. Campact ist und bleibt überparteilich. Staatliche Mittel oder Parteispenden kommen für die Arbeit von Campact nicht infrage. Lobbyregister Als Kampagnen-Organisation setzt sich Campact seit Jahren für ein verpflichtendes Lobbyregister ein. Seit dem 1. Januar 2022 ist es endlich da; damit ist ein erster wichtiger Schritt für mehr Transparenz und Nachvollziehbarkeit bei der politischen Entscheidungsfindung gelungen. Die Einträge im Register geben einen ersten Überblick, wer mit welchen Mitteln Einfluss auf die Politik nehmen möchte und wie breit die Interessenvertretung in Deutschland verteilt ist. Auch Campact e.V. betreibt Lobbyarbeit – um für eine progressive Politik zu streiten. Im offiziellen Lobbyregister des Deutschen Bundestages machen wir diese Arbeit transparent. Transparent und seriös: Campact legt Fehler offen Gläsernes und seriöses Arbeiten heißt für Campact auch, Fehler transparent zu machen. Wir verfassen jedes Jahr hunderte Newsletter, Pressemeldungen und Blogbeiträge. Dabei bemühen wir uns um Fehlerfreiheit und inhaltliche Korrektheit. Aber auch uns passieren manchmal kleine Fehler – dann berichtet Campact seriös und transparent darüber und informiert die Unterstützer*innen zeitnah. Über größere Fehler informieren wir die Empfänger*innen unseres Newsletters direkt per E-Mail. Damit diese Korrekturen auch langfristig auf unserer Webseite auffindbar sind, gibt es die Seite Fehlermeldung. Dort gibt es einen Überblick über die Korrekturen, die wir gemacht haben. Datenschutz Über die Campact-Websites bringen immer mehr Menschen ihren politischen Willen zum Ausdruck. Sie engagieren sich so gemeinsam für eine zukunftsweisende Politik oder drücken ihren Protest aus, wenn Gemeinwohl-Interessen bedroht sind. Bei E-Mail-Aktionen, Petitionen oder Spenden werden dabei persönliche Angaben wie Name und Anschrift übermittelt und bei Campact gespeichert. Uns liegen die Themen Datenschutz und Datensicherheit sehr am Herzen und wir bemühen uns, den bestmöglichen Schutz Deiner Daten zu gewährleisten. Du hast als Nutzer*in das Recht, Auskunft darüber zu verlangen, welche Daten über Dich bei uns gespeichert sind und zu welchem Zweck diese Speicherung erfolgt. Für Auskünfte, Wünsche oder Anregungen zum Thema Datenschutz stehen wir unter datenschutz@campact.de gerne zur Verfügung. Mehr über Campact Jahresberichte Einen Überblick über Finanzen und die Jahresberichte von Campact. Mehr erfahren Initiative Transparente Zivilgesellschaft Campact und die Initiative Transparente Zivilgesellschaft. Mehr erfahren Der Verein Alles zum Verein und seinen Strukturen. Mehr erfahren'
