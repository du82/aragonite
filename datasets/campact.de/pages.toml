["https://www.campact.de/ueber-campact/vereinsmitglieder"]
title = "Vereinsmitglieder | Campact"
description = "Die Vereinsmitglieder des Campact e.V.: Sie setzen sich aus dem Förderkreis, dem Mitarbeiterkreis und berufenen Mitgliedern zusammen."
full_description = 'Die Mitglieder von Campact e.V. Die Mitgliederversammlung ist das höchste Gremium von Campact e.V. Die insgesamt zwölf Mitglieder kontrollieren und unterstützen die Arbeit des Vereinsvorstands.<img fetchpriority="high" decoding="async" width="1940" height="1092" src="https://www.campact.de/wp-content/uploads/2023/09/campact-aktion.jpg" class="wp-block-cmpr-intro__image" alt="Campact-Protest in Düsseldorf, 8.5.2022" srcset="https://www.campact.de/wp-content/uploads/2023/09/campact-aktion.jpg 1940w, https://www.campact.de/wp-content/uploads/2023/09/campact-aktion-300x169.jpg 300w, https://www.campact.de/wp-content/uploads/2023/09/campact-aktion-1024x576.jpg 1024w, https://www.campact.de/wp-content/uploads/2023/09/campact-aktion-768x432.jpg 768w, https://www.campact.de/wp-content/uploads/2023/09/campact-aktion-1536x865.jpg 1536w, https://www.campact.de/wp-content/uploads/2023/09/campact-aktion-1280x720.jpg 1280w, https://www.campact.de/wp-content/uploads/2023/09/campact-aktion-840x472.jpg 840w, https://www.campact.de/wp-content/uploads/2023/09/campact-aktion-528x298.jpg 528w" sizes="(max-width: 1940px) 100vw, 1940px" data-eio="l" /> Mitglieder aus dem Förderkreis Katrin…ist seit Jahrzehnten zivilgesellschaftlich aktiv, war zehn Jahre Abgeordnete und hat 20 Jahre ein Institut geleitet, das die Rechte von Menschen mit Behinderung stärken will. Diese Tätigkeit übt sie nun freiberuflich aus. Anja W.… hat in London Journalismus studiert und dort 12 Jahre gelebt, inzwischen arbeitet sie im Bereich Employer Branding bei einer gemeinnützigen Kultur- und Bildungseinrichtung. Sie interessiert sich besonders für Umweltschutz und soziales. Anja wohnt mit ihrem Mann und Sohn in München. Dieter… hat nach seiner Promotion in Germanistik als Filmautor, Redakteur Ökologie und Redaktionsleiter Sozialpolitik für die ARD gearbeitet. Seine Schwerpunkte sind Energiepolitik, Klimaschutz und soziale Gerechtigkeit. Ehrenamtlich engagierte er sich bei ver.di Bayern im Vorstand öffentlich-rechtlicher Rundfunk und war lange beim BR Personalrat. Dieter hat einen erwachsenen Sohn und lebt in München. Markus … hat nach seiner Ausbildung an der Deutschen Journalistenschule als freier Journalist in Bonn und Berlin gearbeitet. Seine Beiträge über die Bundespolitik waren vor allem in verschiedenen Radiosendern der ARD zu hören und in Fachzeitschriften zu lesen. Danach arbeitete er als Pressesprecher, u.a. für den Deutschen Journalistenverband. Er hat zwei erwachsene Töchter und lebt in einem kleinen Dorf in Brandenburg. Mitglieder aus dem Mitarbeiterkreis Ann-Kathrin … arbeitete 14 Jahre lang als freie Journalistin und Redakteurin – zuletzt in der Politik- und Online-Redaktion beim RedaktionsNetzwerk Deutschland. Ehrenamtlich hat sie eine Wohnungsbaugenossenschaft mitgegründet und ein Tandemprogramm für geflüchtete und ansässige Journalist*innen aufgebaut. Seit 2019 ist sie Campaignerin bei Campact. Clara … forschte zu Flucht in Sub-Sahara Afrika und sozialen Bewegungen weltweit. Nach ihrem Master in Medienkultur arbeitete sie in Kulturprojekten und in der Entwicklungszusammenarbeit. Als Aktivistin streitet sie für eine feministische Welt. Über die Pressearbeit kam sie 2020 zu Campact. Und verstärkt nun als Campaignerin das WeAct Team. Danny … hat seine politischen Wurzeln in antifaschistischen Bewegungen und der politischen Jugendbildung. Seit 2019 arbeitet er bei Campact, seit 2021 unterstützt Danny das Team als Projektmanager Kampagnenarbeit. Er ist ausgebildeter Kaufmann für Neue Medien und hat Politik-, Kommunikations- und Medienwissenschaften studiert. Judith … kam über ein Praktikum während des Studiums zu Campact und ist seit 2021 im Campact Organizing angestellt. Berufene Mitglieder Chadi … arbeitet als Politologe, Journalist, Coach und Gestalttherapeut. Als Co-Vorsitzender der Neuen deutschen Medienmacher:innen setzte er sich über fünf Jahre lang für mehr Vielfalt in der deutschen Medienlandschaft ein.Im Ausland war er u.a. für das Auswärtige Amt, UN-IOM, den Deutschen Entwicklungsdienst (jetzt GIZ) und die Europäische Kommission tätig. Im Inland lehrte er am Otto-Suhr-Institut der Freien Universität Berlin Politikwissenschaft und entwickelte für die Friedrich-Ebert-Stiftung für Geflüchtete die Seminarreihe „Demokratische Bildung auf Arabisch“, die er auch heute noch leitet. Gisela … lebt in Berlin und ist beruflich als Coach, Teamentwicklerin und Autorin tätig. Bis 2016 hat sie in unterschiedlichen Settings auch Campact begleitet und einen guten Einblick in die Organisation, ihre Inhalte und ihren Spirit erhalten. Eine große Motivation, auch in der Mitgliederversammlung zu einem guten Wachstum von Campact beizutragen. Bevor sie sich vor 10 Jahren selbständig gemacht hat, hat sie über 20 Jahre beim BUND zunächst ehrenamtlich und dann hauptberuflich gearbeitet, u.a. im Bundesvorstand, als Bundesgeschäftsführerin der BUNDjugend und als Geschäftsführerin der Natur & Umwelt GmbH. Lena … hat Philosophie in Berlin studiert und arbeitet für Amnesty International als Referentin für Wirtschaft und Menschenrechte, Rüstungsexportkontrolle und Menschenrechte im digitalen Zeitalter. Sie hat viele Jahre ehrenamtlich mit Kindergruppen des NABU e.V. den Wald und Streuobstwiesen erkundet, sich politisch und als Gleichstellungsbeauftragte ihrer Uni feministisch engagiert und journalistisch gearbeitet. Stefan … ist von Haus aus Architekt und arbeitet seit über 20 Jahren in der nachhaltigen Stadtentwicklung und der Klima- und Energiepolitik. Stefan ist seit 2017 Generalsekretär der internationalen Stiftungsplattform‚ foundations-20‘ und seit 2015 Lehrbeauftragter der Hamburger Universität (HCU). Von 2007 bis 2017 war er Abteilungsleiter‚ Energie und Nachhaltige Städte‘ und Vorstandsmitglied des ‚World Future Council‘ (WFC), einer Schwesterorganisation des sog. Alternativen Nobelpreises. Zuvor war er 10 Jahre Sprecher von Greenpeace Deutschland und leitete dort das Klima- und Energieressort.'
year_published = 2025
year_updated = 2025
clearnet = "https://www.campact.de/ueber-campact/vereinsmitglieder"
