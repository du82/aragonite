["https://campact.de"]
title = "Campact bewegt Politik!"
description = "Campact ist eine Kampagnen-Organisation – und vereint die Kraft von über 3 Millionen Menschen. Schließe Dich jetzt an."
full_description = 'Angriff auf die Zivilgesellschaft abwehren! CDU-Chef Friedrich Merz greift die Demokratiebewegung an – weil sie ihn kritisiert hat. Dabei ist das ihr Recht. Fordere jetzt die SPD auf, die Zivilgesellschaft zu schützen und zu stärken! Bereits 0 Unterzeichner*innen Appell unterzeichnen Willkommen bei Campact Campact ist eine Kampagnen-Organisation – und vereint die Kraft von über 3,5 Millionen Menschen. Campact setzt sich entschlossen für progressive Politik ein und verteidigt unsere Demokratie. Campact finanziert sich durch Spenden von Hunderttausenden Menschen – unabhängig von Politik und Konzernen. Über Campact Weitere Aktionen und News Soziale Netzwerke als demokratische Kraft retten Musk, Zuckerberg und Co. gefährden unsere Demokratie. Sie lassen zu, dass sich rechtsextreme Hetze auf Social Media rasant verbreitet. Die Initiative Save Social fordert ein Ende der Monopolmacht von Tech-Konzernen. Petition unterzeichnen Milliardärssteuer jetzt! Marode Brücken, volle Kitas, Ärztemangel – die öffentlichen Kassen sind leer. Während Milliardäre immer reicher werden und kaum Steuern zahlen. Fordere jetzt mit Martyna Linartas auf WeAct eine Milliardärssteuer! Petition unterzeichnen Medikamentenversorgung sichern Immer mehr wichtige Medikamente fehlen – mit dramatischen Folgen. Doch die Politik zögert. Kirsten Terhag-Atalay fordert auf WeAct: Produktion zurück nach Europa holen, Versorgung sichern. Mach mit! Petition unterzeichnen Schließe Dich uns an Unsere Erfolge <img decoding="async" src="https://www.campact.de/wp-content/uploads/2024/09/campact-illustration-mitmachen.svg" alt="Mach jetzt mit: Schließe Dich jetzt Deutschlands größter Kampagnen-Organisation an." class="wp-image-43633" style="aspect-ratio:1;object-fit:cover" data-eio="l" /> Werde jetzt aktiv Ob mit einer Unterschrift unter einem Appell, dem Abonnieren unseres Newsletters, einer einmaligen Spende oder einem regelmäßigen Förderbetrag – jeder Einsatz zählt. Mit Campact treten über 3,5 Millionen Menschen für progressive Politik ein. Unsere Kampagnen treiben den ökosozialen Fortschritt voran und verteidigen unsere Demokratie. Auf WeAct, der Petitionsplattform von Campact, kannst Du selbst Politik bewegen: mit Deiner eigenen Petition. Du willst Campact immer bei Dir tragen? In unserem Shop findest Du bestimmt etwas Passendes.'
