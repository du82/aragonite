full_description = 'Pressestelle Die Pressestelle bietet Journalist*innen Informationen zu Kampagnen und Themen von Campact und WeAct (auch Bildmaterial). Auf Anfrage vermitteln wir auch Gesprächspartner*innen. Kontakt aufnehmen presse@campact.de 0173 2518013 presse@campact.de 01512 2125420 presse@campact.de 0151 70605315 presse@campact.de 0151 170174499 Pressemitteilungen suchen Suche Thema AfDAgrarAllgemeinAppell-PetitionBundestagswahlBürgerrechteCampactCDUCoronaCSUDatenschutzDemokratieDemonstrationDie LinkeEnergieErnährungEUFDPFinanzenG7GemeinnützigkeitGesundheitswesenGrünenHandelHate SpeechKlimaschutzKohleMedienMigrationNaturschutzPestizideRassismusRechtsextremismusSozialesSPDStudieTiereUmweltUnionVerbraucher-VerbraucherinnenVerkehrWaffenexporteWahlenWeActWirtschaft Jahr 20252024202320222021202020192018 Suchen Pressemitteilung 04.03.2025 Erfolg für Campact vor dem OLG Hamburg: Christoph Ploß (CDU) nimmt Berufung zurück Berlin/Hamburg, 4. März 2025. Der Bundestagsabgeordnete Christoph Ploß (CDU) hat seine Berufung in einem von Campact angestrengten Verfügungsverfahren zurückgenommen. Zuvor hatte das Landgericht Ploß untersagt, zu behaupten, die Bundesregierung würde Campact Steuergelder zuschustern. Dies hat Campact durch das Landgericht Hamburg per einstweiliger Verfügung verbieten lassen. Gegen die erstinstanzliche Entscheidung hatte Ploß Berufung eingelegt. In der […] Mehr erfahren Pressemitteilung 03.03.2025 475.000 Menschen fordern: Schutz der Zivilgesellschaft muss in den Koalitionsvertrag Campact, foodwatch, Amadeu Antonio Stiftung und Omas gegen Rechts übergeben Appell im Willy-Brandt-Haus Nach den Angriffen der Unionsfraktion auf kritische Nichtregierungsorganisationen (NGOs) fordern fast 500.000 Bürger*innen einen besseren Schutz der Zivilgesellschaft. In einem gemeinsamen Online-Appell von Campact, foodwatch, Amadeu Antonio Stiftung und Omas gegen Rechts fordern die Unterzeichner*innen, dass demokratisches Engagement ausreichend geschützt werden muss. […] Mehr erfahren Pressemitteilung 26.02.2025 Juristischer Erfolg für Campact: Einstweilige Verfügung gegen CDU Leipzig Das Landgericht Leipzig hat eine von Campact beantragte einstweilige Verfügung gegen die CDU Leipzig erlassen. Die CDU Leipzig hatte auf ihren Social-Media-Kanälen im Februar 2025 wahrheitswidrig behauptet, dass Campact staatliche Fördermittel erhalte und diese zur Organisation von Demonstrationen gegen die Union einsetze. Der Kreisverband bezog sich dabei unter anderem auf Artikel der BILD-Zeitung. Eine vorgerichtliche […] Mehr erfahren Pressemitteilung 22.02.2025 55.000 Menschen auf Großdemonstrationen in Hamburg Heute Mittag versammelten sich rund 15.000 Menschen bei der Großkundgebung “Hamburg wählt Zusammenhalt”. Zudem zogen mindestens 40.000 Menschen bei der “DEMODISKOTHEK – Klare Kante gegen Rechts” am Nachmittag durch Hamburg (Stand 17.45 Uhr). Die Großdemonstrationen setzen einen Tag vor der Bundestagswahl ein Zeichen gegen den Rechtsruck. Insgesamt sind dieses Wochenende rund 160 Demonstrationen bundesweit angemeldet. […] Mehr erfahren Pressemitteilung 16.02.2025 315.000 Menschen auf Anti-Rechts-Demonstrationen bundesweit Berlin, 16. Februar 2025. Knapp 315.000 Menschen waren seit Freitag bundesweit auf der Straße, um eine Woche vor der Bundestagswahl gegen den Rechtsruck hierzulande zu demonstrieren. Heute nahmen alleine in Berlin 38.000 Menschen an der Demonstration “Mutig. Menschlich. Miteinander” organisiert vom Bündnis “Hand in Hand Berlin” teil. Am Samstag fand bereits in Frankfurt am Main […] Mehr erfahren Pressemitteilung 14.02.2025 “Klima nicht den Rechten überlassen” – 25.000 Menschen unterstützen Fridays for Future-Petition Anlässlich des heutigen Klimastreiks erhöht Fridays for Future den Druck auf die Politik: Auf WeAct, der Petitionsplattform der Kampagnen-Organisation Campact, wurde die Petition “Es geht ums Ganze: Klima nicht den Rechten überlassen” gestartet. Knapp 25.000 Menschen unterstützen bereits die Petition. Mit mehr als 130 Erstunterzeichner*innen wie Luisa Neubauer, Barbara Schöneberger und Marc Uwe-Kling fordert Fridays […] Mehr erfahren Pressemitteilung 13.02.2025 Umfrage: Drei Viertel der Deutschen sind für härteres Vorgehen gegenüber Internetplattformen Eine große Mehrheit wünscht sich, dass die EU bei Internetplattformen wie X und Facebook härter durchgreift. Das ergab eine repräsentative Umfrage von forsa im Auftrag der Kampagnen-Organisation Campact. Darin empfinden 77 Prozent der Befragten es als wichtig bis sehr wichtig, dass die EU-Kommission konsequent gegen Plattformbetreiber vorgeht, wenn diese gegen EU-Recht verstoßen. Dr. Felix Kolb, […] Mehr erfahren Pressemitteilung 11.02.2025 Neue Initiative “Save Social” startet WeAct-Petition zur demokratischen Rettung Sozialer Medien Rund 100 Erstunterzeichnende aus Kultur, Wirtschaft und Medien haben bei WeAct, der Petitionsplattform von Campact, die Petition “Soziale Netzwerke als demokratische Kraft retten” gestartet. Gemeinsam bilden sie die Initiative “Save Social”, die sich heute erstmals in Berlin vorgestellt hat. Die Initiative schlägt zehn konkrete Schritte in ihrer WeAct-Petition vor, um den Einfluss von Big-Tech-Monopolen auf […] Mehr erfahren const pageUrlFactory = (page) => page > 1 ? `https://www.campact.de/presse/page/${page}/#pressemitteilungen-suchen` : `https://www.campact.de/presse/#pressemitteilungen-suchen`; document.addEventListener("DOMContentLoaded", ()=>{ document.getElementById("pagination").withPageUrl(pageUrlFactory); }) Eintragung in den Presseverteiler Wenn Sie regelmäßig Campact News erhalten möchten, dann können Sie sich hier registrieren. Bitte geben Sie uns an, welche Art von Meldungen Sie interessieren. Eine Mehrfachauswahl ist auch möglich. Felder mit einem * sind Pflichtfelder und müssen ausgefüllt werden. Persönliche Daten * Anrede Frau Herr Divers * Vorname * Nachname * E-Mail * Medium * Themen Alle Themen Klima/Energie Umwelt/Agrar Verkehr Rassismus Demokratie/Partizipation Handel Soziales Gesundheit Bildberichterstattung * Ich bin damit einverstanden, dass Campact meine Daten nutzt, um mir Informationen und Pressemeldungen zu den von mir ausgewählten Themen per E-Mail zuzusenden. Diese Einwilligung kann jederzeit widerrufen werden. Hier geht es zur Datenschutz-Policy von Campact. Jetzt anmelden Sie werden angemeldet… Vielen Dank für Ihr Interesse an unserem Presseverteiler.Innerhalb der nächsten 24h erhalten Sie von uns ein E-Mail an die von Ihnen angegebene E-Mail-Adresse: peter@lustig.de Bitte antworten Sie auf diese E-Mail, um uns die Eintragung in den Presseverteiler zu bestätigen. Erst damit schließen Sie die Eintragung in unseren Presseverteiler ab. Zurück zum Formular Etwas ist schiefgelaufen… Zurück zum Formular'
