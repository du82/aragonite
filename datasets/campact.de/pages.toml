["https://www.campact.de/ueber-campact/team"]
title = "Der Campact-Vorstand und das Team"
description = "Politik bewegen: Da kommt es auf jeden Einzelnen an. Bei Campact arbeitet ein buntes Team, das eine wertschätzende Diskussionskultur pflegt."
full_description = 'Das Campact-Team Wer steckt eigentlich hinter der Kampagnen-Organisation Campact? Bei Campact arbeiten mehr als Hundert Menschen entschlossen für progressive Politik. Erfahre hier mehr über die Gründer, den geschäftsführenden Vorstand und die einzelnen Teams.<img fetchpriority="high" decoding="async" width="2400" height="1350" src="https://www.campact.de/wp-content/uploads/2023/09/ampel-scholz-lindner-baerbock.jpeg" class="wp-block-cmpr-intro__image" alt="Die Spitzen der Ampel-Regierung (von links) Christian Lindner (FDP), Annalena Baerbock (Die Grünen) und Olaf Scholz (SPD) als große Pappmaché-Masken bei einer Aktion in Berlin. Foto: Campact / Nick Jaussi [CC BY-NC 2.0]" srcset="https://www.campact.de/wp-content/uploads/2023/09/ampel-scholz-lindner-baerbock.jpeg 2400w, https://www.campact.de/wp-content/uploads/2023/09/ampel-scholz-lindner-baerbock-300x169.jpeg 300w, https://www.campact.de/wp-content/uploads/2023/09/ampel-scholz-lindner-baerbock-1024x576.jpeg 1024w, https://www.campact.de/wp-content/uploads/2023/09/ampel-scholz-lindner-baerbock-768x432.jpeg 768w, https://www.campact.de/wp-content/uploads/2023/09/ampel-scholz-lindner-baerbock-1536x864.jpeg 1536w, https://www.campact.de/wp-content/uploads/2023/09/ampel-scholz-lindner-baerbock-2048x1152.jpeg 2048w, https://www.campact.de/wp-content/uploads/2023/09/ampel-scholz-lindner-baerbock-1280x720.jpeg 1280w, https://www.campact.de/wp-content/uploads/2023/09/ampel-scholz-lindner-baerbock-840x472.jpeg 840w, https://www.campact.de/wp-content/uploads/2023/09/ampel-scholz-lindner-baerbock-528x298.jpeg 528w" sizes="(max-width: 2400px) 100vw, 2400px" data-eio="l" /> Geschäftsführung … ist Diplom-Biologe und Politikwissenschaftler. Nach dem Studium baute er Attac-Deutschland mit auf und koordinierte die Öffentlichkeitsarbeit. Er gründete gemeinsam mit Felix Kolb die Bewegungsstiftung, die Kampagnen und Projekte sozialer Bewegungen fördert. 2004 initiierte er mit Günter Metzges und Felix Kolb Campact. Seitdem ist er Geschäftsführender Vorstand. Christoph Bautz ist außerdem Mitglied im Stiftungsrat der 2019 gegründeten Demokratie-Stiftung Campact. Christoph Bautz bei LinkedIn … promovierte in Neuester Geschichte und arbeitete als Journalistin für diverse Print-, TV- und Onlinemedien. 2003 wechselte sie in die Pressestelle der Deutschen Bundesstiftung Umwelt, bevor der WWF sie 2005 als Pressesprecherin holte. 2012 wurde sie dort Leiterin Digitale Kommunikation. Sie ist Mitglied von Futurewoman, speakerinnen.org und Digital Media Women. Seit November 2020 ist sie Geschäftsführerin bei Campact, seit Oktober 2022 Geschäftsführende Vorständin und seit Oktober 2024 auch stellvertretende Vorständin der Demokratie-Stiftung Campact. Astrid Deilmann bei LinkedIn … ist Diplom-Volkswirtin, Beraterin für systemische Organisationsentwicklung und Coach für agile Teamentwicklung. Sie ist zertifiziert in Projekt-, Qualitäts- und Nachhaltigkeitsmanagement. Daphne Heinsen interessiert sich für progressive Politik in ihrer direkten Umgebung ebenso wie für globale Fragen. Sie ist seit 2017 Geschäftsführerin, seit Oktober 2018 Geschäftsführende Vorständin. Daphne Heinsen ist zudem Vorständin der Demokratie-Stiftung Campact. … ist Politikwissenschaftler. Er promovierte zwischen 2002 und 2005 an der FU Berlin über die politischen Auswirkungen sozialer Bewegungen. Seine Dissertation erschien im Campus-Verlag. Nach dem Studium war er Pressesprecher von Attac. Zusammen mit Christoph Bautz stieß er die Bewegungsstiftung an und initiierte mit ihm und Günter Metzges Campact. Er ist seit April 2008 Geschäftsführender Vorstand. Felix Kolb bei LinkedIn Die Teams bei Campact PresseUnsere Pressestelle informiert Redaktionen über unsere Aktionen und Kampagnen, hält Kontakt zu Journalist*innen weltweit und beantwortet Presse-Anfragen zu allen Campact-Themen und WeAct. Personal und AdministrationUnser Team Personal und Administration sucht und findet neue Mitarbeitende, koordiniert Fortbildungsprogramme, überweist den Lohn, bändigt Finanzamt und Urlaubsansprüche und unterstützt den Vorstand. KampagnenUnsere drei Kampagnen-Teams schmieden langfristige Strategien für progressiven Wandel, starten mutige Eil-Aktionen, analysieren die politische Lage, organisieren Demonstrationen und mobilisieren Menschen in ganz Deutschland. WeActUnser Team von der Petitionsplattform WeAct plant Kampagnen und Aktionen mit Bürger*innen, recherchiert Themen, hilft beim Texten und bei der Strategie und gestaltet so Politik im Kleinen und im Großen mit. OrganizingDas Team macht aus kleinen Ideen große Demos und ist Ansprechpartner für die Campact-Unterstützer*innen bei Aktionen. Redaktion und ProducingUnsere Newsletter- und Online-Redaktion bearbeitet die Campact-Mailings und kümmert sich um Blog und Online-Auftritt. Die Producer*innen bauen redaktionelle Inhalte passgenau in verschiedene Tools ein und planen und versenden die Campact-Mailings. Social MediaUnser Social-Media-Team teilt auf Facebook, Twitter, Instagram und Co. aktuelle News zu den Kampagnen, erzählt mit viralen Videos und Grafiken Geschichten, die bewegen – und erreicht damit Millionen Menschen. Politisches MarketingUnser Marketing-Team kombiniert Daten und Kreativität, um unsere Appelle, Petitionen, Demos und Aktionen über unsere Campact-Unterstützer*innen hinaus bekannt zu machen. Mit den richtigen Botschaften auf unterschiedlichen Plattformen wollen wir Bürger*innen bewegen und progressiven Wandel vorantreiben. FundraisingUnser Fundraising-Team sorgt dafür, dass Campact seine Rechnungen bezahlen kann, betreut die Spender*innen und Fördernde und verantwortet den Transparenzbericht. TechnikUnsere IT-Technik-Profis schützen Daten und Server, machen den Versand von Millionen E-Mails überhaupt erst möglich und denken voraus, was bei Campact in Zukunft technisch möglich sein muss. UX & AnalyticsIm Team User Experience und Analytics dreht sich alles um die Interaktion zwischen Bürger*innen und Campact – hier werden Ideen entwickelt, wie man unsere Systeme benutzerfreundlicher machen und Kampagnen effektiver gestalten kann. So ist Campact organisiert Über Campact Campact, das sind über 3 Millionen Menschen, die entschlossen für progressive Politik eintreten und unsere Demokratie verteidigen. Erfahre hier mehr über die Arbeit von Campact. Mehr zu Campact Finanzen Campact finanziert sich durch Spenden aus dem Kreise der über 3 Millionen Campact-Unterstützer*innen und regelmäßige Beiträge der Campact-Förder*innen. Mehr erfahren Stiftung "Für eine Welt, in der alle Menschen ihre Freiheit gleichermaßen verwirklichen können." Um dieses Ziel zu erreichen, fördert die Demokratie-Stiftung Campact sozialen, ökologischen und demokratischen Fortschritt. Die Demokratie-Stiftung Campact'
