["https://www.campact.de/ueber-campact/fehlermeldung"]
title = "Fehlermeldung – Wir korrigieren uns"
description = "Campact verschickt jedes Jahr Hunderte Newsletter, dabei passieren Fehler. Auf dieser Seite klären wir darüber auf."
full_description = "Wir korrigieren uns Campact verfasst jedes Jahr hunderte Newsletter, Pressemeldungen und Blogbeiträge. Dabei bemühen wir uns um Fehlerfreiheit und inhaltliche Korrektheit. Aber auch uns passieren manchmal Fehler, die wir hier zeitnah korrigieren. Korrekturen für 2024 18. Dezember 2024 – In unserem Newsletter „Elon Musk und die AfD“ ist uns leider ein Fehler passiert. Die Plattform der Nachdenkseiten finanziert sich ausschließlich über Spenden. Die angegebenen Quellen bezogen sich allein auf Alternativmedien wie Nius oder Compact. 16. Oktober 2024 – In unserer Kampagne „Fakten statt Fake News: ARD und ZDF schützen“ haben wir angegeben, dass „bis zu fünf TV- und 20 Radiosender“ von Streichungen beim öffentlich-rechtlichen Rundfunk betroffen sein könnten. Dabei haben wir uns auf Medienberichte berufen. Hinsichtlich der unterschiedlichen Zahlen, die in den Medien kursieren, haben wir nun entschieden, uns auf den Entwurf des Reformstaatsvertrages zu berufen und von „bis zu fünf TV- und 16 Radiosendern“ zu sprechen. Die entsprechenden Passagen haben wir auf unseren Websites angepasst. 5. Februar 2024 – Bei dem am 3. Februar auf unserem X-Kanal (vormals Twitter) geposteten Foto handelt es sich um eine Zusammenstellung verschiedener Impressionen der Berliner Demonstration „Hand in Hand“. Dies hätten wir besser kenntlich machen sollen. Wir bedauern, dass bei manchen dadurch der Eindruck entstanden ist, dass es sich um ein einziges Foto der Reichstagswiese handelt. Nichtsdestoweniger handelt es sich bei sämtlichen verwendeten Bilder um Originalfotos, die auf der Berliner Demonstration vergangenen Samstag aufgenommen wurden. Es wurde also nichts manipuliert. Hunderttausende Menschen haben vor dem Reichstag und den angrenzenden Flächen ein Zeichen gegen die AfD und rechtsextreme Netzwerke gesetzt. Korrekturen für 2022 3. Februar 2022 – In unserer Kampagne „Stoppt den Schufa-Deal” haben wir uns an einigen Stellen missverständlich ausgedrückt. Unsere Aussage „Das Unternehmen will die Schufa kaufen – und damit intime Daten von Millionen von Konsument*innen” lässt sich so lesen, als hätte der Schufa-Käufer direkten Zugriff auf die Daten der Bürger*innen. Das ist nicht der Fall. Tatsächlich haben die Anteilseigner der Schufa in der Regel keinen Zugang zu den Daten selbst. Allerdings können diese die Unternehmenspolitik der Schufa – und damit auch deren künftigen Umgang mit unseren Daten – beeinflussen. Der Investor EQT hat es laut Informationen der SZ vor allem auf eine hohe Rendite der Schufa abgesehen. Wir befürchten daher, dass EQT als künftiger Eigentümer vor allem auf weiterhin hohe Gewinne drängt – im Zweifel auch zulasten des Datenschutzes. Wir haben die entsprechenden Passagen auf den Kampagnenseiten angepasst, um Unklarheiten und Missverständnisse zu vermeiden. Korrekturen für 2021 10. Dezember 2021 – In unserer vierteljährlichen Förder-Info haben wir den Namen der gewählten Förder*innen-Vertreterin falsch genannt. Richtig ist: Miriam Albert und Günter Bolz haben die Wahl gewonnen und sind damit in ihrem Amt bestätigt worden, die Förder*innen in der Mitgliederversammlung zu vertreten. Wir bitten, diese Verwirrung zu entschuldigen. 19. Juli 2021 – In unserem Newsletter „Impfpatente freigeben: Aktion in Berlin” kam es leider zu einer Verwechslung. Die Aktion, die wir gemeinsam mit der europäischen Kampagnenorganisation WeMove und der Initiative ZeroCovid veranstalten, findet am Dienstag, den 20. Juli statt – und nicht am 20. Juni. Wir bitten dies zu entschuldigen. Korrekturen für 2020 Am 8. Oktober 2020 haben unsere Newsletter-Empfänger*innen aus Berlin, Osnabrück und Düsseldorf zusätzlich zu einer an sie gerichteten Mail auch noch eine Mail bekommen, die sich an unsere Empfänger*innen in Hamburg richtete. Hintergrund war ein technischer Fehler. Wir bitten, das zu entschuldigen. Korrekturen für 2019 keine Korrekturen für 2018 25. Juli 2018 – In dem Video zu unserer Kampagne „Rewe grillt den Regenwald“ kam es leider zu einer Verwechslung. Das tut uns leid. Der WWF hat mehrere Grillholzkohlen von Rewe untersucht. Dabei wurde in der “Grill Holz-Kohle” des Holzkohlewerks Lüneburg, das REWE beliefert, Tropenholz gefunden. Auch in zwei von proFagus vertriebenen Marken, die bei Penny verkauft werden, ist Tropenholz enthalten. Dabei handelt es sich um Grill Country Barbeque Charcoal Briquettes und Grill Country Holzkohle. Und Penny gehört zur REWE Group. Die im Video gezeigte Kohle von proFagus ist in der Studie des WWF nicht negativ aufgefallen. Wir bitten dies zu entschuldigen. 02. Februar 2018 – In unseren Transparenzberichten 2015 und 2016 konnte fälschlicherweise der Eindruck entstehen, Campact hätte seiner australischen Schwesterorganisation GetUp finanzielle Mittel zu deren Aufbau zur Verfügung gestellt. Richtig ist, dass Campact GetUp den Mitgliedsbeitrag für das Netzwerk OPEN (Online Progressive Engagement Network) überwiesen hat, der ausschließlich zu dessen Förderung dient. GetUp sind aus dieser Überweisung keine finanziellen Vorteile für eigene Zwecke erwachsen. Wir haben die Transparenzberichte am 01. Februar 2018 dementsprechend korrigiert. Korrekturen für 2017 12. Oktober 2017 – Im Newsletter „Extremisten in der AfD: Jetzt muss die Mehrheit ran“, den wir am 12. Oktober verschickt haben, nannten wir den AfD-Fraktionsvorsitzenden André Poggenburg versehentlich Poppenburg. Als wir auf den Fehler aufmerksam wurden, haben wir den Versand gestoppt und den Fehler korrigiert. Bis dahin wurden rund 100.000 Campact-Aktive mit der fehlerhaften Version beschickt. Folge Campact So ist Campact organisiert Finanzen Mehr erfahren Der Verein Mehr erfahren Stiftung Mehr erfahren"
year_published = 2025
year_updated = 2024
