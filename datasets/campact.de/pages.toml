title = "Willkommen bei Campact - über uns"
description = "Mit Campact engagieren sich über drei Millionen Menschen für Klimaschutz, soziale Gerechtigkeit und verteidigen unsere Demokratie. Mach mit."
full_description = 'Was ist Campact? Campact ist eine Kampagnen-Organisation, mit der über 3,5 Millionen Menschen für progressive Politik eintreten und unsere Demokratie verteidigen. Gemeinsam bewegen wir seit 20 Jahren Politik und engagieren uns für Klimaschutz, soziale Gerechtigkeit und eine starke Zivilgesellschaft. Zu Campact gehören auch die Petitionsplattform WeAct, auf der Du Deine eigene Petition starten kannst, und die gemeinnützige Demokratie-Stiftung Campact. <img fetchpriority="high" decoding="async" width="2400" height="1350" src="https://www.campact.de/wp-content/uploads/2023/08/campact-demo-hambacher-wald.jpg" class="wp-block-cmpr-intro__image" alt="Campact-Vorstand Christoph Bautz auf der Demo-Bühne" srcset="https://www.campact.de/wp-content/uploads/2023/08/campact-demo-hambacher-wald.jpg 2400w, https://www.campact.de/wp-content/uploads/2023/08/campact-demo-hambacher-wald-300x169.jpg 300w, https://www.campact.de/wp-content/uploads/2023/08/campact-demo-hambacher-wald-1024x576.jpg 1024w, https://www.campact.de/wp-content/uploads/2023/08/campact-demo-hambacher-wald-768x432.jpg 768w, https://www.campact.de/wp-content/uploads/2023/08/campact-demo-hambacher-wald-1536x864.jpg 1536w, https://www.campact.de/wp-content/uploads/2023/08/campact-demo-hambacher-wald-2048x1152.jpg 2048w, https://www.campact.de/wp-content/uploads/2023/08/campact-demo-hambacher-wald-1280x720.jpg 1280w, https://www.campact.de/wp-content/uploads/2023/08/campact-demo-hambacher-wald-840x472.jpg 840w, https://www.campact.de/wp-content/uploads/2023/08/campact-demo-hambacher-wald-528x298.jpg 528w" sizes="(max-width: 2400px) 100vw, 2400px" data-eio="l" /> Willkommen bei Campact Campact ist eine Kampagnen-Organisation – und vereint die Kraft von über 3,5 Millionen Menschen. Campact setzt sich entschlossen für progressive Politik ein und verteidigt unsere Demokratie. Campact finanziert sich durch Spenden von Hunderttausenden Menschen – unabhängig von Politik und Konzernen. Campact unterstützen Wie arbeitet Campact? Campact vereint über 3,5 Millionen Menschen in ganz Deutschland. Wenn wichtige politische Entscheidungen anstehen, starten wir Kampagnen – digital und auf der Straße. Wir schmieden breite Bündnisse und mobilisieren eine starke Bewegung. Wir finanzieren uns durch Spenden von Hunderttausenden Menschen und verfolgen unsere Anliegen unabhängig von Parteipolitik und Konzerninteressen. Campact steht für Transparenz. Mit unserem Transparenzbericht legen wir jedes Jahr unsere Einnahmen und Ausgaben offen, wir informieren über Strukturen und Finanzen unseres Vereins. Wir sind Teil der „Initiative Transparente Zivilgesellschaft“. Auf WeAct, der Petitionsplattform von Campact, unterstützen wir Dich dabei, Deine eigene Petition zu starten – zu einem Thema, das Dir wichtig ist. Seit 2019 ist auch die gemeinnützige Demokratie-Stiftung Teil von Campact. Gemeinsam mit Campact e.V. treibt sie den ökosozialen Fortschritt voran und verteidigt unsere Demokratie. Campact hat sich zu einem fairen Frauenanteil auf Leitungsebene verpflichtet – die Organisation FAIR SHARE überprüft uns regelmäßig. Campact liegt im aktuellen Ranking der mittelgroßen NGOs in Deutschland auf Platz 14. Unsere Kampagnen-Organisation kommt auf einen Frauenanteil von 65 Prozent im Personal und 50 Prozent Frauen in der obersten Führungsetage. Wofür steht Campact? Unsere Kampagnen treiben den ökosozialen Fortschritt voran und verteidigen unsere Demokratie. Damit eine gerechte Gesellschaft entsteht, in der alle Menschen sicher und selbstbestimmt in Frieden und Freiheit leben können. Wir treten faktenbasiert für progressive Politik ein. Dies bedeutet für uns, … Demokratie und Menschenrechte zu verteidigen und sich mutig gegen autoritäre Kräfte zu stellen. Umwelt und Klima zu schützen und sich gegen marktradikales Wirtschaften zu wenden. den gesellschaftlichen Zusammenhalt zu stärken und sich gegen soziale Kälte einzusetzen. Campact: 20 Jahre für Veränderung Externer Inhalt von YouTube: Mit einem Klick kannst Du Dir das Video ansehen. Lies mehr in unserer Datenschutzerklärung. Schließe Dich uns an Wer steckt hinter Campact? Campact, das sind über 3,5 Millionen Menschen, die entschlossen für progressive Politik eintreten und unsere Demokratie verteidigen. Sie sind die Basis unserer Kampagnen-Organisation. Sie unterzeichnen Appelle, verteilen Info-Material, debattieren mit Politiker*innen oder demonstrieren auf der Straße. Gemeinsam bewegen wir so Politik.All das wäre nicht möglich ohne das Campact-Team: Es analysiert die politische Lage, startet Eil-Aktionen, organisiert Demos und mobilisiert Menschen in ganz Deutschland. Und es unterstützt all diejenigen, die auf unserer Petitionsplattform WeAct selbst eine Petition erstellen. Campact Geschäftsführender Vorstand Christoph Bautz und Dr. Felix Kolb gründeten 2004 Campact – und brachten so Online-Petitionen nach Deutschland. Seit 2017 verstärken Daphne Heinsen und seit 2020 Dr. Astrid Deilmann die Führung bei Campact. Mehr zum Campact-Team Jubiläum: 20 Jahre Campact So ist Campact organisiert Finanzen Campact finanziert sich durch Spenden aus dem Kreise der über 3,5 Millionen Campact-Unterstützer*innen und regelmäßige Beiträge der Campact-Förder*innen. Mehr erfahren Verein Campact setzt sich unter anderem für mehr Transparenz in der Politik ein. Das können wir nur dann glaubhaft tun, wenn wir auch über die eigenen Strukturen und Finanzen von Campact e.V. leicht zugänglich informieren. Der Verein und seine Strukturen Stiftung „Für eine Welt, in der alle Menschen ihre Freiheit gleichermaßen verwirklichen können.“ Um dieses Ziel zu erreichen, fördert die Demokratie-Stiftung Campact ökosozialen und demokratischen Fortschritt. Die Demokratie-Stiftung Campact <img decoding="async" src="https://www.campact.de/wp-content/uploads/2024/02/itz-logo.svg" alt="Als Bürgerbewegung setzt Campact auf partizipative Schwarmfinanzierung – Zehntausende Förder*innen und Spender*innen sichern die Unabhängigkeit und Stärke von Campact. Dabei erfüllt Campact alle Transparenzinformationen der Initiative Transparente Zivilgesellschaft." class="wp-image-38929" data-eio="l" />'
year_published = 2025
year_updated = 2025
