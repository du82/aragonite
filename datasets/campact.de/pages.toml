["https://www.campact.de/campact/ueber-campact/der-verein"]
title = "Über Campact - Der Verein"
description = "Wie ist Campact organisiert? Hier informieren wir über den Verein, über die Gremien und darüber, wie Entscheidungen getroffen werden."
full_description = 'Campact: Der Verein und seine Strukturen Campact setzt sich unter anderem für mehr Transparenz in der Politik ein. Das können wir nur dann glaubhaft tun, wenn wir auch über die eigenen Strukturen und Finanzen von Campact e.V. leicht zugänglich informieren. Campact hat sich daher auch der „Initiative Transparente Zivilgesellschaft“ angeschlossen und veröffentlicht sogar noch mehr Informationen, als von der Initiative gefordert wird. Über Campact Campact ist eine Kampagnen-Organisation – und vereint die Kraft von über 3,5 Millionen Menschen. Campact setzt sich entschlossen für progressive Politik ein und verteidigt unsere Demokratie. Campact finanziert sich durch Spenden von Hunderttausenden Menschen – unabhängig von Politik und Konzernen. Über Campact So ist Campact organisiert Über Campact Campact, das sind über 3,5 Millionen Menschen, die entschlossen für progressive Politik eintreten und unsere Demokratie verteidigen. Erfahre hier mehr über die Arbeit von Campact. Mehr zu Campact Finanzen Campact finanziert sich durch Spenden aus dem Kreise der über 3,5 Millionen Campact-Unterstützer*innen und regelmäßige Beiträge der Campact-Förder*innen. Mehr erfahren Stiftung "Für eine Welt, in der alle Menschen ihre Freiheit gleichermaßen verwirklichen können." Um dieses Ziel zu erreichen, fördert die Demokratie-Stiftung Campact sozialen, ökologischen und demokratischen Fortschritt. Die Demokratie-Stiftung Campact Rechtsform Campact e.V. ist im Vereinsregister des Amtsgerichts Charlottenburg unter der VR Nummer 25165 B eingetragen. Campact war wegen Förderung der Volks- und Berufsbildung sowie der Studentenhilfe, allgemeine Förderung des demokratischen Staatswesens sowie Förderung des bürgerschaftlichen Engagements als gemeinnützig anerkannt. Im Oktober 2019 wurde Campact der steuerliche Status als gemeinnütziger Verein aberkannt. Campact hatte sich in seiner Satzung auf die Förderung politischer Bildung und des demokratischen Staatswesens berufen. Diese beiden recht allgemeinen Zwecke sind vom Bundesfinanzhof massiv eingeschränkt worden. Für die breite Themenpalette, die Campact bearbeitet, fehlen außerdem zum Teil eigene, spezifische Zwecke in der Abgabenordnung. Dennoch ist die Arbeit von Campact selbstlos und findet im Rahmen der freiheitlich-demokratischen Grundordnung statt – ist also der Idee nach gemeinnützig. Campact setzt seine gemeinnützige Arbeit deshalb als Idealverein fort. Für Spenden und Förderbeiträge dürfen aber keine Zuwendungsbestätigungen mehr ausgestellt werden. Satzung In der Aufbauphase von Campact sind wir mit einer sehr einfachen Rechtskonstruktion mit sehr wenigen ausgewählten Mitgliedern gestartet. Dadurch waren wir sehr schnell handlungsfähig und gegen Einflussversuche politischer Splittergruppen weitgehend geschützt. Zwischenzeitlich ist Campact und auch unser politisches Gewicht sehr gewachsen. Deshalb haben wir uns 2010 auf die Suche nach einer neuen Vereinsstruktur gemacht, die einerseits weiterhin schnelle Entscheidungen und schnelles Handeln gewährleistet, andererseits aber auch eine wirksame, demokratisch legitimierte Kontrolle des geschäftsführenden Vorstands gewährleistet. Die gefundene neue Struktur haben wir in weiten Teilen dem erfolgreich praktizierten Modell von Greenpeace Deutschland entlehnt und mit Wahlen auf dem Campact-Förder*innen-Treffen, unter den Campact-Mitarbeiter*innen und der letzten Mitgliederversammlung (nach altem Modell) vom 8. März 2011 umgesetzt. Die aktuelle Satzung (Stand: 17. November 2023) sieht zwölf Mitglieder vor, die verschiedene Gruppen innerhalb von Campact repräsentieren. Diese Zwölf unterstützen und kontrollieren die Arbeit des Vereinsvorstandes. Mitglieder des Vorstandes dürfen selbst nicht mehr Mitglieder des Vereins sein. Die aktuelle Vereinsstruktur soll die schnelle Handlungs- und Konfliktfähigkeit von Campact besser sicherstellen als das Modell eines reinen Mitgliederverbandes. Schließe Dich uns an Aus welchen Gruppen kommen die zwölf Mitglieder? Die Campact-Förder*innen wählen auf dem jährlich stattfindenden Förder*innen-Treffen vier Vertreter*innen, die sie innerhalb von Campact e.V. repräsentieren. Das Campact-Team wählt ebenfalls vier Vertreter*innen. Außerdem bringen vier um Campact verdiente, aber nicht bei Campact arbeitende Menschen externen Sachverstand ein. Die letzten vier werden vom Vorstand vorgeschlagen, müssen aber satzungsgemäß von den Förder*innen und Mitarbeiter*innen bestätigt werden. Erfahre mehr zur aktuellen personellen Zusammensetzung der Campact-Mitgliederversammlung. Mitgliederversammlung Der Mitgliederversammlung obliegen insbesondere: Wahl und Entlastung des Vereinsvorstands Beschluss von Änderungen der Vereinssatzung Entscheidung über Ausschlüsse aus dem Verein Wahl der Mitglieder des Haushaltsausschusses Genehmigung der Jahresabschlussrechnung und des Haushalts Diskussion der strategischen Ausrichtung von Campact Der Vereinsvorstand Der Vereinsvorstand setzt sich derzeit aus Christoph Bautz, Dr. Felix Kolb (beide Gründer von Campact), Dr. Astrid Deilmann und Daphne Heinsen zusammen. Sie verantworten die Themenauswahl, die Geschäftsführung und die Außendarstellung des Vereins. Wie werden Kampagnenthemen ausgewählt? Entscheidungen über den Start einer neuen Kampagne werden in der Regel in einem Treffen zwischen Vorstand, Campaigner*innen und Pressesprecherin besprochen. In Entscheidungen fließen so weit wie möglich Hinweise externer Expert*innen (aus anderen Verbänden und Initiativen) und Rückmeldungen der Campact-Unterstützer*innen ein. Unabhängigkeit Campact finanziert sich aus Förderbeiträgen der Campact-Förder*innen und Spenden der Campact-Unterstützer*innen (siehe auch Transparenzbericht). Ihr regelmäßiger Beitrag sichert unsere politische Unabhängigkeit. Campact ist parteipolitisch neutral. Im Fokus ist immer das Thema der einzelnen Kampagne. Dabei ist es uns egal, welcher Partei wir letztendlich auf die Füße treten müssen, um Lobbyinteressen in die Schranken zu weisen. Beteiligung der Aktiven Mehr als drei Millionen Menschen haben den Campact-Newsletter abonniert und unterstützen die Kampagnen von Campact. Bei Aktivitäten vor Ort helfen uns viele Campact-Aktive, zum Beispiel bei Unterschriftenübergaben oder Kundgebungen in der Bundeshauptstadt oder den Landeshauptstädten sowie in den Wahlkreisen von Bundestagsabgeordneten. Mehr als 83.000 Förder*innen sind der Grundstein für unsere finanzielle Unabhängigkeit und für unsere Möglichkeiten der Weiterentwicklung von Campact. Auf unserer Petitionsplattform WeAct können Aktive außerdem eigene Kampagnen starten. Vor dem Start neuer Kampagnen befragen wir in der Regel mindestens 10.000 zufällig ausgewählte Empfänger*innen des Campact-Newsletters per Online-Umfrage. Alle Campact-Unterstützer*innen werden zudem regelmäßig in großen Umfragen nach ihren Einschätzungen zu politischen Entwicklungen befragt. Die Förder*innen erhalten viermal jährlich eine Förder-Info, mit allen Infos zu unseren Kampagnen und vielen Hintergrundberichten. In die Weiterentwicklung von Campact können sie sich unter anderem durch die Teilnahme am jährlichen Förder*innen-Treffen einbringen. Dort werden turnusmäßig auch die Vertreter*innen für Campact e.V. gewählt.'
