["https://www.campact.de/ueber-campact/finanzen"]
title = "So finanziert sich Campact - der Transparenzbericht"
description = "Campact finanziert sich aus Spenden der über drei Millionen Campact-Unterstützern. Staatliche Mittel oder Parteispenden kommen nicht in Frage."
full_description = 'Finanzen Campact finanziert sich durch Spenden aus dem Kreise der 3,5 Millionen Campact-Unterstützer*innen und regelmäßige Beiträge der Campact-Förder*innen – also von Menschen wie „Du und ich“. Uns ist wichtig, unabhängig zu sein und zu bleiben. Staatliche Mittel, Partei- oder Konzernspenden kommen für die Arbeit von Campact nicht infrage. <img fetchpriority="high" decoding="async" width="1161" height="653" src="https://www.campact.de/wp-content/uploads/2024/08/finanzen-schwarmfinanzierung.jpg" class="wp-block-cmpr-intro__image" alt="" srcset="https://www.campact.de/wp-content/uploads/2024/08/finanzen-schwarmfinanzierung.jpg 1161w, https://www.campact.de/wp-content/uploads/2024/08/finanzen-schwarmfinanzierung-300x169.jpg 300w, https://www.campact.de/wp-content/uploads/2024/08/finanzen-schwarmfinanzierung-1024x576.jpg 1024w, https://www.campact.de/wp-content/uploads/2024/08/finanzen-schwarmfinanzierung-768x432.jpg 768w, https://www.campact.de/wp-content/uploads/2024/08/finanzen-schwarmfinanzierung-840x472.jpg 840w, https://www.campact.de/wp-content/uploads/2024/08/finanzen-schwarmfinanzierung-160x90.jpg 160w, https://www.campact.de/wp-content/uploads/2024/08/finanzen-schwarmfinanzierung-528x298.jpg 528w" sizes="(max-width: 1161px) 100vw, 1161px" data-eio="l" /> Wir lassen ein immer größeres Netzwerk von Menschen entstehen, die mit Campact politisch aktiv werden und – so weit es ihnen möglich ist – auch mit kleineren oder größeren Spenden die Kampagnenarbeit für eine lebendige Demokratie unterstützen. Einen kurzen Überblick über die wichtigsten Fakten zu den Finanzen findest Du unter Einnahmen und Ausgaben 2023. Eine detaillierte Auflistung und weitere Informationen kannst Du im aktuellen Transparenzbericht 2023 nachlesen. Herkunft der Zuwendungen des Campact e.V. Die ausführliche Gewinn- und Verlustrechnung findest Du im Finanzteil des Transparenzberichts 2023 ab Seite 72. Organisationen (juristische Personen), deren Zuwendung 2023 mehr als 10 Prozent des Gesamtjahresbudgets ausgemacht hat: keine Organisationen (juristische Personen), deren Zuwendung 2023 mehr als 5 Prozent des Gesamtjahresbudgets ausgemacht hat: keine Organisationen (juristische Personen), deren Zuwendung 2023 5.000 oder mehr Euro betrug: keine Natürliche Personen, deren Zuwendung 2023 mehr als 10 Prozent des Gesamtjahresbudgets ausgemacht hat: keine Natürliche Personen, deren Zuwendung 2023 mehr als 5 Prozent des Gesamtjahresbudgets ausgemacht hat: keine Natürliche Personen, deren Zuwendung 2022 mehr als 5.000 Euro betrug: sechs Transparenzbericht Eine detaillierte Aufstellung der Herkunft und Verwendung der Campact-Mittel sowie viele weitere Hintergrundinformationen über Campact findest Du im aktuellen Transparenzbericht 2023. Transparenzberichte vorhergehender Jahre hier als PDFs: Transparenzbericht für 2022 Transparenzbericht für 2021 Transparenzbericht für 2020 Transparenzbericht für 2019 Transparenzbericht für 2018 Transparenzbericht für 2017 Transparenzbericht für 2016 Transparenzbericht für 2015 Transparenzbericht für 2014 Transparenzbericht für 2013 Transparenzbericht für 2012 Transparenzbericht für 2011 Transparenzbericht für 2010 Transparenzbericht für 2009 Die Berichte folgen den Richtlinien der Initiative Transparente Zivilgesellschaft, der sich Campact angeschlossen hat. Auf Initiative von Transparency Deutschland e.V. haben zahlreiche Akteure aus der Zivilgesellschaft und der Wissenschaft zehn grundlegende Punkte definiert, die jede zivilgesellschaftliche Organisation der Öffentlichkeit zugänglich machen sollte. Dazu zählen unter anderem die Satzung, die Namen der wesentlichen Entscheidungsträger*innen sowie Angaben über Mittelherkunft, Mittelverwendung und Personalstruktur. Campact erfüllt alle zehn Transparenzinformationen der Initiative Transparente Zivilgesellschaft und macht noch weitere öffentlich. Um noch mehr Transparenz zu gewährleisten, veröffentlicht und korrigiert Campact seit Oktober 2017 seine Fehler auf der Seite Fehlermeldung. Über Campact Campact ist eine Kampagnen-Organisation – und vereint die Kraft von über 3,5 Millionen Menschen. Campact setzt sich entschlossen für progressive Politik ein und verteidigt unsere Demokratie. Campact finanziert sich durch Spenden von Hunderttausenden Menschen – unabhängig von Politik und Konzernen. Campact unterstützen Über Campact Mehr erfahren Datenschutz Mehr erfahren Der Verein Mehr erfahren'
