["https://www.campact.de/ueber-campact/einnahmen-und-ausgaben-2023"]
title = "Einnahmen und Ausgaben 2023 | Campact"
description = "Erfahre alles über die Finanzen der Kampagnen-Organisation Campact: Die Einnahmen und Ausgaben 2023 auf einen Blick."
full_description = 'Campact Finanzen 2023 Ob mit einer Unterschrift, durch Engagement vor Ort oder mit einem Plakat bei der Demo: Bei Campact bringt sich jede*r nach den eigenen Möglichkeiten ein. Diejenigen, die uns finanziell unterstützen, bilden dabei das Fundament. Egal ob größere Spenden oder regelmäßige kleinere Beträge: Diese Unterstützung gibt uns Ausdauer für langfristige Ziele und macht uns unabhängig von Parteien und öffentlichen Institutionen. Wir bedanken uns herzlich bei unseren Spender*innen und Förder*innen für ihr Engagement und das große Vertrauen.Die gemeinsame Bewegung besteht aus dem eingetragenen Verein Campact und der gemeinnützigen Demokratie-Stiftung Campact. Die folgenden Zahlen beziehen sich, soweit nicht anders vermerkt, immer auf beide Körperschaften. Separate Gewinn- und Verlustrechnungen sowie Bilanzen findest Du im aktuellen Transparenzbericht auf den Seiten 72 bis 80. Einnahmen Campact erzielte im Jahr 2023 Einnahmen in Höhe von 16,1 Millionen Euro. Davon stammen 63,5 Prozent aus regelmäßigen Förderbeiträgen, 22,7 Prozent aus zweckgebundenen Kampagnen- und Projektspenden, 10,6 Prozent aus freien Spenden und 3,2 Prozent aus sonstigen Einnahmen. Im Vergleich zum Vorjahr stiegen die Erträge von Campact um rund 1,9 Millionen Euro. Zurückzuführen war dies vor allem auf gestiegene Einzelspenden. Die Förderbeiträge stiegen um rund 414.000 Euro, die freien Spenden stiegen um rund 217.000 Euro und die zweckgebundenen Spenden stiegen um rund 1,37 Millionen Euro. Campact finanziert sich durch Spenden aus dem Kreise der über drei Millionen Campact-Unterstützer*innen und durch regelmäßige Beiträge der Campact-Förder*innen. Um unabhängig zu sein und zu bleiben, setzt Campact auf partizipative Schwarmfinanzierung. Ende 2023 förderten 88.858 Menschen Campact mit einem durchschnittlichen Monatsbeitrag von 9,96 Euro. Ende 2022 waren es 83.534. Die Einnahmen aus den Förderbeiträgen geben Planungssicherheit und ermöglichen es Campact, blitzschnell Kampagnen zu starten und langfristig an einem politischen Thema dranzubleiben. Darüber hinaus haben im Jahr 2023 168.982 Menschen zweckgebunden für Kampagnen und Projekte gespendet sowie freie Spenden getätigt. 92 Prozent der Menschen, die den Verein oder die Stiftung finanziell unterstützten, haben im gesamten Jahr bis zu 200 Euro an Campact gegeben. 14 natürliche Personen haben 5.000 Euro und mehr an die Demokratie-Stiftung Campact und an den Verein haben 6 natürliche Personen 5.000 Euro und mehr gespendet. <img fetchpriority="high" decoding="async" width="1224" height="834" src="https://www.campact.de/wp-content/uploads/2024/08/campact-finanzen-schwarmfinanzierung.jpg" alt="" class="wp-image-43267" srcset="https://www.campact.de/wp-content/uploads/2024/08/campact-finanzen-schwarmfinanzierung.jpg 1224w, https://www.campact.de/wp-content/uploads/2024/08/campact-finanzen-schwarmfinanzierung-300x204.jpg 300w, https://www.campact.de/wp-content/uploads/2024/08/campact-finanzen-schwarmfinanzierung-1024x698.jpg 1024w, https://www.campact.de/wp-content/uploads/2024/08/campact-finanzen-schwarmfinanzierung-768x523.jpg 768w" sizes="(max-width: 1224px) 100vw, 1224px" data-eio="l" /> Ausgaben 2023 im Überblick Im Jahr 2023 gab Campact rund 15,1 Millionen Euro aus. Das waren insgesamt 0,9 Millionen Euro mehr als im Vorjahr. Vor allem die Ausgaben für die Kampagneninfrastruktur stiegen im Vergleich zum Vorjahr um rund 315.000 Euro. Für Kampagnen wendete Campact rund 115.000 Euro mehr auf. Die Ausgaben für die Öffentlichkeitsarbeit und das Fundraising stiegen ebenfalls um rund 285.000 Euro. Die Kosten für die Verwaltung stiegen um rund 237.000 Euro. Die Ausgaben für Empowerment sanken im Vergleich zum Vorjahr um rund 75.000 Euro und die Kosten für die Petitionsplattform WeAct stiegen mit rund 20.000 Euro nur leicht. <img decoding="async" width="812" height="1024" src="https://www.campact.de/wp-content/uploads/2024/08/campact-finanzen-ausgaben-812x1024.jpg" alt="" class="wp-image-43277" srcset="https://www.campact.de/wp-content/uploads/2024/08/campact-finanzen-ausgaben-812x1024.jpg 812w, https://www.campact.de/wp-content/uploads/2024/08/campact-finanzen-ausgaben-238x300.jpg 238w, https://www.campact.de/wp-content/uploads/2024/08/campact-finanzen-ausgaben-768x968.jpg 768w, https://www.campact.de/wp-content/uploads/2024/08/campact-finanzen-ausgaben.jpg 1000w" sizes="(max-width: 812px) 100vw, 812px" data-eio="l" /> Jahresergebnis 2023 Im Jahr 2023 beliefen sich die Einnahmen aus Spenden, regelmäßigen Förderbeiträgen und sonstigen Erträgen auf 16,14 Millionen Euro. Die Ausgaben betrugen im gleichen Zeitraum 15,09 Millionen Euro. Die Einnahmen sind gegenüber dem Vorjahr gestiegen, die Kosten allerdings auch. In Summe wurde das Jahr mit einem positiven Jahresergebnis beendet. Nach wie vor verfügen der Verein und die Stiftung über Rücklagen, auf die Campact in Zukunft zurückgreifen kann. So kann die Arbeit auch in wirtschaftlich schwierigen Zeiten ohne Kürzungen fortgesetzt werden. <img decoding="async" width="1024" height="976" src="https://www.campact.de/wp-content/uploads/2024/08/campact-finanzen-jahresergebnis-1024x976.jpg" alt="" class="wp-image-43279" srcset="https://www.campact.de/wp-content/uploads/2024/08/campact-finanzen-jahresergebnis-1024x976.jpg 1024w, https://www.campact.de/wp-content/uploads/2024/08/campact-finanzen-jahresergebnis-300x286.jpg 300w, https://www.campact.de/wp-content/uploads/2024/08/campact-finanzen-jahresergebnis-768x732.jpg 768w, https://www.campact.de/wp-content/uploads/2024/08/campact-finanzen-jahresergebnis.jpg 1206w" sizes="(max-width: 1024px) 100vw, 1024px" data-eio="l" /> Transparenzbericht Eine detaillierte Aufstellung der Herkunft und Verwendung der Campact-Mittel sowie viele weitere Hintergrundinformationen über Campact findest Du im aktuellen Transparenzbericht 2023. Transparenzberichte vorhergehender Jahre hier als PDFs: Transparenzbericht für 2022 Transparenzbericht für 2021 Transparenzbericht für 2020 Transparenzbericht für 2019 Transparenzbericht für 2018 Transparenzbericht für 2017 Transparenzbericht für 2016 Transparenzbericht für 2015 Transparenzbericht für 2014 Transparenzbericht für 2013 Transparenzbericht für 2012 Transparenzbericht für 2011 Transparenzbericht für 2010 Transparenzbericht für 2009 Die Berichte folgen den Richtlinien der Initiative Transparente Zivilgesellschaft, der sich Campact angeschlossen hat. Auf Initiative von Transparency Deutschland e.V. haben zahlreiche Akteure aus der Zivilgesellschaft und der Wissenschaft zehn grundlegende Punkte definiert, die jede zivilgesellschaftliche Organisation der Öffentlichkeit zugänglich machen sollte. Dazu zählen unter anderem die Satzung, die Namen der wesentlichen Entscheidungsträger*innen sowie Angaben über Mittelherkunft, Mittelverwendung und Personalstruktur. Campact erfüllt alle zehn Transparenzinformationen der Initiative und macht noch weitere öffentlich. Auf dieser Seite findest Du die Transparenzinformationen übersichtlich aufgelistet.'
