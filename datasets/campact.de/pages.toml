["https://www.campact.de/ueber-campact/online-umfragen-lamapoll"]
title = "Online-Umfragen - Lamapoll | Campact"
description = "Zur Durchführung von Online-Umfragen nutzen wir die Technik von LamaPoll. Alles zu Datenerfassung und Datenschutz."
full_description = "Online-Umfragen Zur Durchführung von Online-Umfragen nutzen wir die Technik der Lamano GmbH & Co. KG, Prenzlauer Allee 36G, 10405 Berlin, im Weiteren Lamapoll genannt. LamaPoll ist ein Webdienst zum Erstellen und Durchführen von Umfragen. LamaPoll stellt technische Infrastrukturen und Softwarelösungen bereit, die es seinen Kunden ermöglichen, sichere Online-Umfragen zu erstellen, durchzuführen und auszuwerten. Die Datenverarbeitung erfolgt auf der Grundlage Ihrer Einwilligung gem. Art. 6 Abs. 1 S. 1 lit. a DSGVO, durch Ihre Teilname an der Umfrage. Alle Verbindungen von den Systemen von LamaPoll sind standardmäßig nach dem aktuellen Stand der Technik verschlüsselt – somit ist jegliche Datenübertragung vor dem Mithören durch Dritte geschützt. Weiterhin legt LamaPoll größten Wert auf die sichere Speicherung von Daten – alle Server von LamaPoll sind gehärtet, durch Firewalls, Virenscanner etc. geschützt und immer mit den neusten Sicherheitsupdates gepatcht. Das Umfrage-Tool wird regelmäßig durch Sicherheitschecks und Penetrationstest, unter anderem durch das Bundesamt für Sicherheit in der Informationstechnik (BSI), überprüft. Alle Server stehen in Deutschland und unterliegen deutschen Datenschutz- und Sicherheitsbestimmungen: Die eingesetzten Rechenzentren verfügen über die BS-7799-TÜV-Zertifizierung sowie über die unabhängige TÜV-Zertifizierung nach DIN ISO 27001. Eine Datenverarbeitung außerhalb der EU bzw. des EWR findet nicht statt. Falls Sie Fragen zu den Anonymitätseinstellungen von Umfragen oder den verarbeiteten personenbezogenen Daten haben, wenden Sie sich bitte direkt an uns. Hier geht es zu unserem Kontaktformular. Welche Daten speichern wir bei Umfragen und welche Daten werden erfasst: Server-Logfiles Wenn Sie auf eine Umfrage zugreifen, werden automatisch Informationen allgemeiner Natur erfasst. Diese Daten (Server-Logfiles) beinhalten: – Zugriffszeitpunkt (Datum & Uhrzeit)– Ihren Webbrowser– Ihr Betriebssystem– die aufgerufene Umfrage– ggf. die Webseite von der aus Sie die Umfrage aufgerufen haben (Referrer URL)– IP-Adresse Hierbei handelt es sich ausschließlich um Daten, welche keine unmittelbaren Rückschlüsse auf Ihre Person zulassen. Diese Daten sind technisch notwendig, um von Ihnen angeforderte Umfragen korrekt auszuliefern und fallen bei Nutzung des Internets zwingend an. Sie sind für Betrieb, Wartung, Schutz und Überwachung der ordnungsgemäßen Funktionsweise des Systems erforderlich. Im Missbrauchsfall werden diese Protokolle genutzt, um Reproduktionsszenarien und ggf. von uns zu erbringende Nachweise zu erstellen. Im Fehlerfall werden diese Protokolle genutzt, um ein schnellstmögliches Systemupdate zu ermöglichen. Wir nutzen diese Daten ausschließlich im Bedarfsfall und nur für den Schutz, die Wartung und zur Sicherstellung des ordnungsgemäßen Betriebs des Systems. Erfassung allgemeiner statistischer Informationen Bei Beantwortung einer Umfrage werden folgende allgemeine Informationen erfasst: – Datum, Start- und Endzeitpunkt, Dauer der Beantwortung– Verwendeter Webbrowser und Betriebssystem– Sprache, in der die Umfrage beantwortet wurde Hierbei handelt es sich ausschließlich um Daten, welche i.d.R. keine Rückschlüsse auf Ihre Person zulassen. Bei anonymen Umfragen ist sichergestellt, dass diese Daten niemals in irgendeiner Weise mit Ihren Antworten verknüpft werden. Bei nicht-anonymen Umfragen werden diese Daten mit Ihren Antworten zu Auswertungszwecken. Falls Sie Fragen zu den Anonymitätseinstellungen einer Umfrage haben, wenden Sie sich bitte direkt an uns. Erhebung und Speicherung von Antworten Alle erhobenen Daten – insbesondere Ihre Antworten – werden über sichere SSL-verschlüsselte Verbindungen zu uns übertragen und auf den Servern von Lamapoll sicher gespeichert. Sie werden in grafisch und tabellarisch aufbereiteter Form ausgewertet. Die Speicherung erfolgt für die Dauer der Abwicklung der Umfrage und im Rahmen der jeweiligen gesetzlichen Aufbewahrungsfrist (z.B. handels- und steuerrechtliche Aufbewahrungsfristen). Nach Ablauf der Frist werden die entsprechenden Daten routinemäßig gelöscht, sofern sie nicht mehr zur Vertragserfüllung oder Vertragsanbahnung erforderlich sind und/oder unsererseits kein berechtigtes Interesse an der Weiterspeicherung fortbesteht. Eine Verknüpfung zwischen Ihrer Person und Ihren Antworten ist nur dann möglich, wenn explizit entsprechende Einstellungen an der Umfrage vorgenommen wurden und Daten oder Attribute mit Personenbezug hinterlegt sind. Außerdem können wir als Gastgeber von Umfragen Sie innerhalb der Umfrage nach personenbezogenen Daten fragen. IP-Adresse Wenn Sie auf eine Umfrage zugreifen, wird Ihre IP-Adresse an Lamapoll übertragen, jedoch nicht Ihren Antworten zugeordnet. Die IP-Adresse wird nicht gespeichert, es sei denn, dass von uns als Gastgeber der Umfrage Einstellungen getroffen wurden, durch die eine Mehrfachteilnahme aufgrund der IP-Adresse verhindert werden soll. In diesem Fall wird die IP-Adresse als kryptografischer Hash zusammen mit der Umfrage-ID von Lamapoll gespeichert. Sie wird dann zum Abgleich verwendet, um zukünftige Teilnehmer mit der gleichen IP-Adresse von der Umfrage auszuschließen. Ihre IP-Adresse ist nach Verschlüsselung bzw. Umwandlung in einen kryptografischen Hash nicht mehr lesbar oder dekodierbar. Sie wird auch niemals mit Ihren abgegebenen Antworten verknüpft (auch nicht bei nicht-anonymen Umfragen). Nach Beendigung bzw. Löschung der Umfrage wird Ihre verschlüsselte IP-Adresse wieder gelöscht. Die oben genannten Daten werden von der Lamano GmbH & Co. KG im Rahmen einer Auftragsverarbeitung gem. Art. 28 DSGVO verarbeitet Cookies Lamapoll verwendet in seinen Umfragen sogenannte „Cookies“. Cookies sind sehr kleine Textdateien, die Ihr Browser auf Ihrer Festplatte speichert. Das Speichern von Cookies wird von der jeweiligen Webseite die Sie besuchen veranlasst. Beim erneuten Besuch einer Webseite sendet Ihr Browser automatisch das zuvor gespeicherte Cookie an den Webseiten-Server. Gewöhnlich wird in einem Cookie nur eine alphanummerische ID gespeichert, die es der jeweiligen Webseite ermöglicht, Sie wieder zu erkennen. Cookies können nicht verwendet werden, um Programme zu starten oder Viren auf einen Computer zu übertragen. Cookies werden insbesondere benötigt, um die Beantwortung bzw. das Unterbrechen und Fortsetzen von Umfragen zu ermöglichen, um ggf. Mehrfachteilnahmen zu verhindern und um Ihnen mehrsprachige Umfragen in der richtigen Sprache anzuzeigen und werden so lange in Ihrem Browser gespeichert, bis Sie diese löschen. Sie können die Verwendung von Cookies jederzeit über die Einstellungen Ihres Browsers deaktivieren. Bitte verwenden Sie die Hilfefunktionen Ihres Internetbrowsers, um zu erfahren, wie Sie diese Einstellungen ändern können. Bitte beachten Sie, dass die Teilnahme an unseren Umfragen über Lamapoll nicht mehr funktioniert, wenn Sie die Verwendung von Cookies deaktiviert haben."
