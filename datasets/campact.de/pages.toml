["https://www.campact.de/ueber-campact/vorstand"]
title = "Vorstand - Campact"
description = "Der Vereinsvorstand von Campact: Christoph Bautz, Felix Kolb und Daphne Heinsen bilden den Vorstand des Campact e.V."
full_description = "Der Vorstand Der Vorstand von Campact besteht aus vier Mitgliedern: Christoph Bautz, Dr. Astrid Deilmann, Daphne Heinsen und Dr. Felix Kolb. … ist Diplom-Biologe und Politikwissenschaftler. Nach dem Studium baute er Attac-Deutschland mit auf und koordinierte die Öffentlichkeitsarbeit. Er gründete gemeinsam mit Felix Kolb die Bewegungsstiftung, die Kampagnen und Projekte sozialer Bewegungen fördert. 2004 initiierte er mit Günter Metzges und Felix Kolb Campact. Seitdem ist er Geschäftsführender Vorstand. Christoph Bautz ist außerdem Mitglied im Stiftungsrat der 2019 gegründeten Demokratie-Stiftung Campact. Christoph Bautz bei LinkedIn … promovierte in Neuester Geschichte und arbeitete als Journalistin für diverse Print-, TV- und Onlinemedien. 2003 wechselte sie in die Pressestelle der Deutschen Bundesstiftung Umwelt, bevor der WWF sie 2005 als Pressesprecherin holte. 2012 wurde sie dort Leiterin Digitale Kommunikation. Sie ist Mitglied von Futurewoman, speakerinnen.org und Digital Media Women. Seit November 2020 ist sie Geschäftsführerin bei Campact, seit Oktober 2022 Geschäftsführende Vorständin und seit Oktober 2024 auch stellvertretende Vorständin der Demokratie-Stiftung Campact. Astrid Deilmann bei LinkedIn … ist Diplom-Volkswirtin, Beraterin für systemische Organisationsentwicklung und Coach für agile Teamentwicklung. Sie ist zertifiziert in Projekt-, Qualitäts- und Nachhaltigkeitsmanagement. Daphne Heinsen interessiert sich für progressive Politik in ihrer direkten Umgebung ebenso wie für globale Fragen. Sie ist seit 2017 Geschäftsführerin, seit Oktober 2018 Geschäftsführende Vorständin. Daphne Heinsen ist zudem Vorständin der Demokratie-Stiftung Campact. … ist Politikwissenschaftler. Er promovierte zwischen 2002 und 2005 an der FU Berlin über die politischen Auswirkungen sozialer Bewegungen. Seine Dissertation erschien im Campus-Verlag. Nach dem Studium war er Pressesprecher von Attac. Zusammen mit Christoph Bautz stieß er die Bewegungsstiftung an und initiierte mit ihm und Günter Metzges Campact. Er ist seit April 2008 Geschäftsführender Vorstand. Felix Kolb bei LinkedIn"
year_published = 2025
year_updated = 2025
