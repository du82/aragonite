["https://www.campact.de/x.com/campact"]
title = "Kampagnen-Organisation Campact verlässt X | Campact"
description = "Campact kehrt X den Rücken, ferner fordert eine WeAct-Petition die EU dazu auf, X zum Schutze der Demokratie vorerst abzuschalten"
full_description = "Presseübersicht Kampagnen-Organisation Campact verlässt X CampactDemokratieMedien Elon Musk hat aus der Plattform X einen Hort voller Hass, Hetze und Desinformation gemacht, deshalb stellt die Kampagnen-Organsiation Campact mit sofortiger Wirkung ihre Aktivität auf X ein. Diese Abkehr von X umfasst auch die persönlichen Accounts der gesamten Campact-Geschäftsführung. Zeitgleich wurde eine Petition der Initiative Progressive Lore auf WeAct – der Petitionsplattform von Campact – mit der Forderung gestartet, X vorerst abzuschalten und so die Demokratie vor illegaler Einflussnahme zu schützen. Mit ihrer Forderung wendet sich die Petition an die EU-Kommissarin für Digitales, Henna Virkkunen. Gleichzeitig appelliert sie an die Kanzlerkandidaten Friedrich Merz, Robert Habeck und Olaf Scholz, sich der Forderung anzuschließen. Innerhalb weniger Stunden unterschrieben bereits 27.679 Menschen (Stand 9.1.2025, 16.30Uhr) die Petition. Dr. Astrid Deilmann, Geschäftsführende Vorständin bei Campact, kommentiert den Austritt: “Elon Musk hat aus X ein willfähriges Werkzeug für Hetze, Desinformation und Demokratiezersetzung gemacht. Musk verfolgt die klare politische Agenda, Rechtsextremisten auch in Europa zu mehr Macht und Einfluss zu verhelfen. Wer auf X bleibt, verleiht der Plattform den Anstrich von Normalität und Relevanz. Deshalb fordern wir weitere reichweitenstarke Akteure aus Zivilgesellschaft, Politik und Medien dazu auf, ihre Accounts bei X still zu legen.” Bereits jetzt läuft ein Verfahren gegen die Plattform X wegen Miss­ach­tung des europäischen Di­gi­tal Ser­vices Act (DSA). Der DSA verpflichtet X und generell alle sozialen Netzwerke, gegen die Verbreitung illegaler Inhalte und Informationsmanipulation vorzugehen und sieht als letzten Schritt ein Verbot vor. Musk selbst hat mit seinem Account in zahlreichen Fällen die Verbreitung von Falschinformationen oder gar Verschwörungstheorien befeuert und sie teilweise selbst ins Leben gerufen. TEILEN"
author = "Iris Rath"
year_published = 2025
year_updated = 2025
clearnet = "https://www.campact.de/x.com/campact"
