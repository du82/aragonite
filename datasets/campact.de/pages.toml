title = "Campact und die Initiative Transparente Zivilgesellschaft"
description = "Campact erfüllt alle zehn Transparenzinformationen der Initiative Transparente Zivilgesellschaft (ITZ) – lesen Sie hier mehr dazu."
full_description = 'Campact und die Initiative Transparente Zivilgesellschaft (ITZ) Campact erfüllt alle zehn Transparenzinformationen der Initiative Transparente Zivilgesellschaft und macht noch weitere öffentlich – sowohl online, als auch in seinem jährlichen Transparenzbericht. 1. Name, Sitz, Anschrift und Gründungsjahr Campact e.V., Sitz: Berlin, Verwaltung: Artilleriestr. 6, 27283 Verden/Aller, gegründet 2004 2. Vollständige Satzung sowie Angaben zu den Zielen unserer Organisation Aktuelle Satzung vom 17. November 2023 Unsere Ziele und Vision findest Du auf Über Campact Antworten auf häufig gestellte Fragen 3. Angaben zur Steuerbegünstigung Im Oktober 2019 wurde Campact der steuerliche Status als gemeinnütziger Verein aberkannt. Campact hatte sich in seiner Satzung auf die Förderung politischer Bildung und des demokratischen Staatswesens berufen. Diese beiden recht allgemeinen Zwecke sind vom Bundesfinanzhof massiv eingeschränkt worden. Für die breite Themenpalette, die Campact bearbeitet, fehlen außerdem zum Teil eigene, spezifische Zwecke in der Abgabenordnung. Dennoch ist die Arbeit von Campact selbstlos und findet im Rahmen der freiheitlich-demokratischen Grundordnung statt – ist also der Idee nach gemeinnützig. Campact setzt seine gemeinnützige Arbeit deshalb als Idealverein fort. Für Spenden und Förderbeiträge dürfen aber keine Zuwendungsbestätigungen mehr ausgestellt werden. Der Ablehnungsbescheid des Finanzamts ist hier. Der Fragebogen der Initiative Transparente Zivilgesellschaft für zivilgesellschaftliche Organisationen ohne Gemeinnützigkeitsstatus. 4. Name und Funktion wesentlicher Entscheidungsträger Geschäftsführender Vorstand: Christoph Bautz, Dr. Astrid Deilmann, Daphne Heinsen, Dr. Felix Kolb Haushaltsausschuss: Gisela Enders, Cornelia Anderer, Bernd Arian Weiteres zum Verein findest Du auf: Der Verein und seine Strukturen 5. Tätigkeitsbericht Im Transparenzbericht 2023 auf den Seiten 53 bis 58. Die Transparenzberichte der letzten Jahre kannst Du unter „Finanzen“ anschauen. 6. Personalstruktur Bei Campact e.V. waren 109 Mitarbeiter*innen im Jahr 2023 fest angestellt. Insgesamt entspricht das 87 Mitarbeiter*innen in Vollzeit. Außerdem werden studentische Hilfskräfte, Praktikant*innen und – wenn möglich – ein*e FSJler*in beschäftigt. Tausende Campact-Aktive engagieren sich bei großen Demonstrationen, lokalen Aktionen und Online-Appellen. 7. Angaben zur Mittelherkunft Im Transparenzbericht 2023 auf den Seiten 53 bis 58. Die Transparenzberichte der letzten Jahre kannst Du unter „Finanzen“ anschauen. 8. Angaben zur Mittelverwendung Im Transparenzbericht 2023 auf den Seiten 59 ff. Die Transparenzberichte der letzten Jahre kannst Du unter „Finanzen“ anschauen. 9. Gesellschaftsrechtliche Verbundenheit mit Dritten Campact e.V. hat die HateAid gGmbH 2019 mitgegründet und ist Mitgesellschafter (50 Prozent der Anteile). Campact arbeitet international mit anderen progressiven NGOs zusammen. 10. Namen von Personen, deren jährliche Zuwendungen mehr als 10 % des Gesamtjahresbudgets ausmachen Organisationen (juristische Personen), deren Zuwendung 2023 mehr als 10 Prozent des Gesamtjahresbudgets ausgemacht hat: keine Organisationen (juristische Personen), deren Zuwendung 2023 mehr als 5 Prozent des Gesamtjahresbudgets ausgemacht hat: keine Organisationen (juristische Personen), deren Zuwendung 2023 5.000 oder mehr Euro betrug: keine Natürliche Personen, deren Zuwendung 2023 mehr als 10 Prozent des Gesamtjahresbudgets ausgemacht hat: keine Natürliche Personen, deren Zuwendung 2023 mehr als 5 Prozent des Gesamtjahresbudgets ausgemacht hat: keine Natürliche Personen, deren Zuwendung 2023 mehr als 5.000 Euro betrug: sechs Weitere Hinweise Erfahre mehr über die Transparenzmaßnahmen bei Campact: Transparenz Um noch mehr Transparenz zu gewährleisten, hat Campact seit Oktober 2017 eine Webseite, auf der Fehler öffentlich genannt und korrigiert werden. Die Transparenzberichte der letzten Jahre kannst Du unter „Finanzen“ anschauen. <img decoding="async" src="https://www.campact.de/wp-content/uploads/2024/02/itz-logo.svg" alt="" class="wp-image-38929" data-eio="l" />'
