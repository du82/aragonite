title = "Daten­schutz­erklärung"
description = "Datenschutz und Datensicherheit liegen Campact sehr am Herzen. Das wichtigste Prinzip dabei ist die Datensparsamkeit."
full_description = "Datenschutzerklärung Wir freuen uns über Deinen Besuch auf unseren Webseiten. Nachfolgend möchten wir Dich über den Umgang mit Deinen Daten gemäß Artikel 13 der Datenschutz-Grundverordnung (DSGVO) bei Campact e.V. informieren. Falls darüber hinaus Fragen offen bleiben, kontaktier uns bitte via datenschutz@campact.de. Letzte Aktualisierung am 21. Januar 2025 Im Juni 2019 wurde die Demokratie-Stiftung Campact ins Leben gerufen. Campact e.V. und die Stiftung betreiben entsprechend Art. 26 EU-DSGVO in „Joint Controllership“ eine Nutzer*innen-Datenbank. Diese wird ausschließlich von Mitarbeiter*innen der beiden Kooperationspartner*innen – unterstützt von einer Buchhaltungsfirma – bearbeitet. Die Demokratie-Stiftung Campact und Campact haben die Zusammenarbeit gem. Art. 26 EU-DSGVO vertraglich vereinbart und dabei insbesondere die Zuständigkeiten und Verantwortlichkeiten der beiden Vertragspartner*innen geregelt. Welche Daten von Nutzer*innen erhebt Campact? Wir speichern und werten personenbezogene Informationen aus, um die politische Arbeit von Campact möglichst erfolgreich zu gestalten. Art, Umfang und Zweck der Datenspeicherung erfolgt auf Basis der Datenschutzgrundverordnung und weiterer rechtlicher Rahmenbedingungen (z.B. Bundesdatenschutzgesetz, Handelsgesetzbuch, Strafgesetzbuch oder die Abgabenordnung). Je nach Aktivität im Rahmen von Campact (bspw. Appell-Unterschrift oder Spende) und / oder Beziehung zu Campact (Newsletter-Abonnement vorhanden / nicht vorhanden) unterscheiden sich Art und Dauer von Datenspeicherung und -nutzung durch Campact. Entsprechend wird in den nächsten Abschnitten beschrieben, bei welcher Einwilligung welche Daten zu welchem Zweck und wie lange gespeichert werden. Bitte nutze die folgenden Sprungmarken, um zu den jeweils passenden Sektionen zu gelangen: Welche Daten werden gespeichert und genutzt, wenn ich: einen Campact–Appell unterzeichne? eine WeAct-Petition unterzeichne? eine Bestellung tätige? den Campact-Newsletter (E-Mail oder SMS / Messenger) abonniert habe? eine Spende tätige? Förder*in werde bzw. bin? eine Kontaktanfrage stelle? die Website besuche? Newsletter (E-Mail oder SMS / Messenger) Im Regelfall erfolgt die Datenspeicherung und -verarbeitung bei Campact im Rahmen des Abonnement des Newsletters (E-Mail oder SMS / Messenger). Hierzu findest Du in diesem Abschnitt Informationen. Beim Campact-Newsletter handelt es sich um einen personalisierten Newsletter. Entlang Deiner Interaktionen (bspw. Appell-Teilnahmen) und anderer Daten (Details unten) informieren wir dich gezielt – z.B. insbesondere über Themen, die dir persönlich am Herzen liegen. Diese Datenspeicherung und -nutzung erfolgt auf der Grundlage Deiner Einwilligung gem. Art. 6 Abs. 1 S. 1 lit. a DSGVO, unserem berechtigten Interesse gem. Art. 6 Abs. 1 S.1 lit f., sowie auf Basis von Art. 9 DSGVO Abs. 2 lit. d im Rahmen unserer rechtmäßigen Tätigkeiten als eingetragene politische Vereinigung. Die Einwilligung in die Datenspeicherung und -nutzung gilt für den Zeitraum des Newsletter-Abonnements. Du kannst diese jederzeit durch Abbestellen des Newsletters widerrufen. Nach dem Entzug der Einwilligung werden die auf Basis der Newsletter-Einwilligung gespeicherten Daten anonymisiert und zu statistischen Zwecken weiter vorgehalten. Zudem hashen wir Deine E-Mail-Adresse und halten sie in dieser Form weiter vor. Falls Du Dich in Zukunft bei uns neu registrierst, können wir anhand des Hashes feststellen, dass Du früher bei uns aktiv warst. Deine vorherigen Aktivitätsdaten werden Dir jedoch nicht mehr zugeordnet. Wir haben technische und organisatorische Maßnahmen ergriffen, die eine entsprechende Zuordnung verhindern. Die Speicherung der gehashten E-Mail-Adresse beruht dabei auf Art. 6 Abs. 1 lit. f) DSGVO, wobei unser berechtigtes Interesse darin liegt zu erfahren, wie hoch die Quote an zu uns zurückkehrenden Personen ist. Diese werden für eine Dauer von 4 Jahren gespeichert, um zu erkennen, ob Du Dich noch einmal bei uns registrierst. Welche Daten werden für den personalisierten Newsletter (E-Mail oder SMS / Messenger) erhoben? Bei Nutzung der Webseite und anderer Angebote (bspw. E-Mails) von Campact werden je nach Aktivität und Eingabe seitens der Nutzer*innen personenbezogene Daten erhoben, gespeichert und zur Personalisierung genutzt. Dabei unterscheiden sich die gespeicherten Daten nach der Aktivität im Rahmen des Campact-Angebots. Mögliche Aktivitäten sind bspw. – Unterschrift eines Appells– Teilnahme an Nachrichten-Aktionen– Bestellung von Aktionsmaterial– Spenden– Förder*in werden– Daten auf unser Server laden (Audio, Video, Text)– Entscheidungen treffen (z.B. Umfragen, Ankündigung an einer Demo teilzunehmen oder nicht)– Anmeldung zu einer Aktion– Nutzung des Kontaktformulars– Senden einer Nachricht an Campact (Telefon, E-Mail oder sonstiges)– Öffnen von E-Mails und Klicks auf enthaltene Links, Nachladen von Bildern Durch diese Interaktionen kannst Du uns je nach Aktivität folgende Informationen zur Verfügung stellen: Deinen Namen, Adresse und Telefonnummer, Zahlungsinformationen, Dein Alter, Deine Standortinformationen, Deine maskierte IP-Adresse, Bilder- Video und Toninformationen, Informationen bzgl. Identität und Stand, Unternehmens- und Finanzinformationen. Wenn Du den Campact-Newsletter per E-Mail erhältst, kannst Du diesen jederzeit unter https://me.campact.de/nl/abbestellen oder über den Link zur Abbestellung des Newsletters, den Du in jeder Newsletter-E-Mail findest, abbestellen. Wenn Du den Newsletter per SMS oder Messengerdienst erhältst, kannst Du den Newsletter abbestellen, indem Du uns eine Nachricht über das Kontaktformular sendest. Datenspeicherung und -nutzung bei einzelnen Aktivitäten auf unserer Webseite Unabhängig von der Frage, ob Du einen Newsletter erhältst oder nicht, werden Daten bei Teilnahme an Campact-Aktionen gespeichert und genutzt. Hier findest Du Erläuterungen zu den unterschiedlichen Interaktionen auf unserer Seite. Appellunterschriften Um Campact-Appelle möglich zu machen, werden bei einer Appell-Unterschrift die Unterzeichnung, deren Zeitpunkt sowie E-Mail, Name und Postleitzahl gespeichert und gegebenenfalls in der Form „Vorname, erster Buchstabe des Nachnamens und Postleitzahl“ an die Appell-Empfänger*innen übergeben. Diese Datenspeicherung und -nutzung erfolgt auf der Grundlage Deiner Einwilligung gem. Art. 6 Abs. 1 S. 1 lit. a DSGVO sowie auf Basis von Art. 9 DSGVO Abs. 2 lit. d im Rahmen unserer rechtmäßigen Tätigkeiten als eingetragene politische Vereinigung. Die Einwilligung in die Datenspeicherung und -nutzung gilt für die Laufzeit der Aktion. Du kannst sie jederzeit durch eine entsprechende Nachricht an datenschutz[at]campact.de unter Angabe des Namens und der verwendeten E-Mail-Adresse für die Zukunft widerrufen. Ohne Newsletter-Abonnement erfolgt die Löschung der Daten zum Ende des Appells oder bei einem Widerruf der Einwilligung. Die Löschung erfolgt als Anonymisierung der Daten. Anschließend werden die anonymen Daten ohne jeglichen Personenbezug zu statistischen Zwecken weiter vorgehalten. Appell-Unterschriften über Drittanbieter Neben der persönlichen Eingabe Deiner Daten ermöglichen wir auch die Unterschrift über Drittanbieter. Die erhobenen Daten unterscheiden sich nicht von den oben beschriebenen Appell-Unterschriften, aber zusätzlich sind folgende Informationen zu berücksichtigen: Appellunterschrift via Facebook Wenn Du einen unserer Appelle via Facebook unterzeichnest, übermittelt Facebook Deinen Namen, Dein Profilbild und Deine E-Mail-Adresse an Campact. Name und E-Mail-Adresse werden im weiteren Verlauf für die Unterschrift genutzt. Dein Profilbild wird nicht genutzt und nicht von uns gespeichert. Eine Verbindung wird erst mit dem Klick auf den Button aufgebaut, wenn Du Dich tatsächlich entschieden hast, via Facebook zu unterschreiben. Vorher erfolgt keine Datenübertragung.Erst nach einem Klick auf den entsprechenden Button werden Inhalte des Drittanbieters nachgeladen. Hierdurch erhält der Drittanbieter die Information, dass Du unsere Seite aufgerufen haben sowie die in diesem Rahmen technisch erforderlichen Nutzungsdaten.Außerdem ist der Drittanbieter unter Umständen in der Lage, Trackingtechnologien zu implementieren. Campact e.V. hat auf die weitere Datenverarbeitung Durch den Drittanbieter keinen Einfluss. Mit dem Klick auf den entsprechenden Button gibst Du die Einwilligung, Inhalte des Drittanbieters nachzuladen. Die Einbettung erfolgt auf Grundlage Deiner Einwilligung gem. Art. 6 Abs. 1 S. 1 lit. a DSGVO. Deine Einwilligung gibst Du durch Deinen Klick auf den Button. Bitte beachte, dass die Nutzung dieses Services dazu führt, dass Deine Daten außerhalb der EU bzw. des EWR verarbeitet werden. In einigen Ländern besteht dabei das Risiko, dass Behörden auf die Daten zu Sicherheits- und Überwachungszwecken zugreifen, ohne dass Du hierüber informiert wirst oder Rechtsmittel einlegen kannst. Sofern wir Anbieter in unsicheren Drittländern einsetzen und Du einwilligst, erfolgt die Übermittlung in ein unsicheres Drittland auf Grundlage von Art. 49 Abs. 1 lit. a DSGVO.Weitere Informationen zu Facebook und den Privatsphäre-Einstellungen findest Du in den Datenschutzhinweisen (https://de-de.facebook.com/about/privacy/) und den Nutzungsbedingungen (https://www.facebook.com/legal/terms) der Facebook Inc. Appellunterschrift via Google Wenn Du einen unserer Appelle via Google unterzeichnest, übermittelt Google Deinen Namen, Dein Profilbild, Deine Spracheinstellungen und Deine E-Mail-Adresse an Campact. Name und E-Mail-Adresse werden im weiteren Verlauf für die Unterschrift genutzt. Dein Profilbild wird nicht genutzt und nicht von uns gespeichert. Eine Verbindung wird erst mit dem Klick auf den Button aufgebaut, wenn Du dich tatsächlich entschieden hast, via Google zu unterschreiben. Vorher erfolgt keine Datenübertragung.Erst nach einem Klick auf den entsprechenden Button werden Inhalte des Drittanbieters nachgeladen. Hierdurch erhält der Drittanbieter die Information, dass Du unsere Seite aufgerufen hast sowie die in diesem Rahmen technisch erforderlichen Nutzungsdaten. Außerdem ist der Drittanbieter unter Umständen in der Lage, Trackingtechnologien zu implementieren. Wir haben auf die weitere Datenverarbeitung durch den Drittanbieter keinen Einfluss. Mit dem Klick auf den entsprechenden Button gibst Du uns die Einwilligung, Inhalte des Drittanbieters nachzuladen.Die Einbettung erfolgt auf Grundlage Deiner Einwilligung gem. Art. 6 Abs. 1 S. 1 lit. a DSGVO. Deine Einwilligung gibst Du durch Deinen Klick auf den Button. Bitte beachte, dass die Nutzung dieses Services dazu führt, dass Deine Daten außerhalb der EU bzw. des EWR verarbeitet werden. In einigen Ländern besteht dabei das Risiko, dass Behörden auf die Daten zu Sicherheits- und Überwachungszwecken zugreifen, ohne dass Du hierüber informiert wirst oder Rechtsmittel einlegen kannst. Sofern wir Anbieter in unsicheren Drittländern einsetzen und Du einwilligst, erfolgt die Übermittlung in ein unsicheres Drittland auf Grundlage von Art. 49 Abs. 1 lit. a DSGVO. Weitere Informationen zu Google und den Privatsphäre-Einstellungen findest Du inden Datenschutzhinweisen und den Nutzungsbedingungen (https://policies.google.com/privacy) der Google Inc. Bestellung von Aktionsmaterial Um Bestellungen über unsere Seite zu ermöglichen, werden bei einer Bestellung diese, deren Zeitpunkt sowie E-Mail, Name, Anschrift und evtl. je nach Aktion weitere Informationen gespeichert und gegebenenfalls an Versanddienstleister*innen übermittelt. Diese Datenspeicherung und -nutzung erfolgt zur Durchführung der Bestellung auf der Grundlage von Art. 6 Abs. 1 S. 1 lit. b DSGVO sowie gff. auf Basis von Art. 9 DSGVO Abs. 2 lit. d im Rahmen unserer rechtmäßigen Tätigkeiten als eingetragene politische Vereinigung. Ohne Newsletter-Abonnement erfolgt die Löschung der Daten zum Ende der Bestell-Aktion. Die Löschung erfolgt als Anonymisierung der Daten. Anschließend werden die anonymen Daten ohne jeglichen Personenbezug zu statistischen Zwecken weiter vorgehalten. Kontaktieren-Aktionen Um Politiker*innen und Entscheider*innen gezielt zu erreichen setzen wir auch verschiedene Formate der direkten Kontaktaufnahme via E-Mail, SMS, Messenger und anderen Kanälen ein. Hierbei versendest Du über Deine eigenen Kanäle Nachrichten an die angesprochenen Personen. Wir registrieren in diesem Zusammenhang die Tatsache des Klicks auf einen Kontaktieren-Button, Deinen Namen und Deine jeweiligen Kontaktdaten. Diese Datenspeicherung und -nutzung erfolgt auf der Grundlage unseres berechtigten Interesses gem. Art. 6 Abs. 1 S. 1 lit. f DSGVO derartige Aktion koordinieren zu können sowie auf Basis von Art. 9 DSGVO Abs. 2 lit. d im Rahmen unserer rechtmäßigen Tätigkeiten als eingetragene politische Vereinigung. Ohne Newsletter-Abonnement erfolgt die Löschung der Daten zum Ende der Kontaktieren-Aktion. Die Löschung erfolgt als Anonymisierung der Daten. Anschließend werden die anonymen Daten ohne jeglichen Personenbezug zu statistischen Zwecken weiter vorgehalten. Koordination von Aktionen Um uns vor Ort zu vernetzen, gezielt Informationen zu verteilen oder Aktionen vor Ort bekannt zu machen, erstellen wir interaktive Übersichtskarten. Innerhalb dieser ist es möglich, sich als Teilnehmer*in oder Veranstalter*in von derartigen Aktionen einzutragen. Um diese Aktionen zu ermöglichen, werden Deine Markierungen gespeichert und ohne Personenbezug auf den jeweiligen Karten veröffentlicht. Siehe auch den Punkt „Kartenmaterial“ weiter unten. Diese Datenspeicherung und – nutzung erfolgt auf der Grundlage unseres Berechtigten Interesses gem. Art. 6 Abs. 1 S. 1 lit. f DSGVO diese Aktionen öffentlichkeitswirksam darzustellen sowie auf Basis von Art. 9 DSGVO Abs. 2 lit. d im Rahmen unserer rechtmäßigen Tätigkeiten als eingetragene politische Vereinigung. Ohne Newsletter-Abonnement erfolgt die Löschung der Daten zum Ende der Koordinieren-Aktion oder bei einem Widerruf der Einwilligung. Die Löschung erfolgt als Anonymisierung der Daten. Anschließend werden die anonymen Daten ohne jeglichen Personenbezug zu statistischen Zwecken weiter vorgehalten. Feedbackformulare Um gezielt Informationen zu erhalten oder besondere Formate umzusetzen, fragen wir dich gelegentlich danach ob Du, z.B: an einer Aktion teilnehmen, bei einer solchen helfen möchtest oder für andere Formate zur Verfügung stehst (z.B. Interviews, Befragungen aller Art, Organisation von lokalen Veranstaltungen). Diese setzen wir über besondere Formulare auf unserer Website um. Die mit solchen Formularen erhobenen Daten können verschiedene Informationen enthalten, z.B. Adressen und Telefonnummern. Diese Datenspeicherung und – nutzung erfolgt in der Regel auf der Grundlage unseres Berechtigten Interesses gem. Art. 6 Abs. 1 S. 1 lit. f DSGVO Dein Feedback verarbeiten zu können sowie auf Basis von Art. 9 DSGVO Abs. 2 lit. d im Rahmen unserer rechtmäßigen Tätigkeiten als eingetragene politische Vereinigung. In besonderen Fällen erfolgt die e"
