full_description = "Dynamic email content fuels dynamic growth for The GIST How the women-led media brand expanded into new markets and grew their email list from 30,000 to 100,000 in less than 12 months with Campaign Monitor Build an email like this What do you do when you have a great message, an audience hungry for your content, a unique perspective…and a scalability challenge? For sports publisher The GIST, the solution was simple yet elegant. The women-led media brand aims to make the world of sports more accessible and inclusive to all and challenge the status quo of a male-dominated sports and media industry. Campaign Monitor’s flexible platform and dynamic content capabilities were the perfect solutions to help The GIST sustain its growth and continue its mission. With Campaign Monitor, The GIST has been able to achieve their goals and more. 75% less time spent on building segmented emails 233% increase in email list x2 the average industry open rate Dynamic content = dynamic growth The GIST succeeds through the quality, thought, and care it puts in to each of its newsletters. But as the publication pushed into new markets, scaling that amount of time, effort, and resources into a new email for each new market was unsustainable. The team developed a solution that served its growing community and media buyers with Campaign Monitor’s dynamic content capabilities. Dynamic content elements built into the newsletter can easily be adjusted to show content and stories relevant to the individual subscriber. The platform automates the menial manual work of building a new email for each segment, reducing the resources needed to send a newsletter down to 25% of what it would be otherwise. Build an email like this Testing the way to gold-medal results Sports is not a new topic for a publisher to focus on. But The GIST had a new perspective and a goal to target an audience that previously has not been heavily engaged by sports media. The newsletter’s founders had to find out what their audience wanted and responded to on their own. Campaign Monitor’s A/B testing feature was the perfect tool to gather data-backed insights and make incremental improvements in their email KPIs. It’s a large component of what’s helped them increase their average open rate an additional 5% since partnering with Campaign Monitor. Build an email like this As automatic as Serena Williams Making a big first impression and nurturing a new relationship into loyalty is paramount to keeping engagement rates up and advertisers happy. The GIST’s solution is a thoughtful automated email journey delivered to new signups. Campaign Monitor’s automated email journey capabilities make it easy to customize based on a variety of factors, including the location of the subscriber source and their sign up source (organic search, cross-promotion, referral, etc.). The series includes a welcome email, an introduction to The GIST’s story and mission, a reminder about the referral program, and a survey email asking for feedback and input. Build an email like this Growing with Campaign Monitor The GIST was using a different platform when first launching its newsletter program. But as they added new markets and expanded subscriber lists, they began to outgrow their email solution. McClarty said several factors played into the choice to move to Campaign Monitor. The time-saving and scalability potential of dynamic content The existing community of high-quality brands in Campaign Monitor’s email publishing space. Superior email deliverability compared to the competition A user-friendly, intuitive tool Build an email like this"
