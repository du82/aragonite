full_description = "The Campaign to End Loneliness inspires thousands of organisations and people to do more to tackle the health threat of loneliness in older age. If you'd like to keep in touch, please leave your name and email below, or just click the orange button to go to make your donation. This website uses cookies so that we can provide you with the best user experience possible. Cookie information is stored in your browser and performs functions such as recognising you when you return to our website and helping our team to understand which sections of the website you find most interesting and useful. Strictly Necessary Cookie should be enabled at all times so that we can save your preferences for cookie settings. If you disable this cookie, we will not be able to save your preferences. This means that every time you visit this website you will need to enable or disable cookies again. Performance cookies, also known as analytics cookies, are a type of tracking cookie used to collect information about how visitors interact with a website. These cookies play a crucial role in measuring website performance, analyzing user behavior, and improving the overall user experience. They are commonly used by website owners and marketers to gain insights into website traffic, visitor demographics, and user engagement. Targeting cookies, also known as advertising cookies or marketing cookies, are a type of tracking cookie used to deliver personalized advertisements to website visitors. These cookies are typically set by advertising networks or third-party advertisers with the goal of displaying relevant ads based on the user's interests, browsing behavior, and demographics."
