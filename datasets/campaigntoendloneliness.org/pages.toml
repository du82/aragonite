["https://www.campaigntoendloneliness.org/training-on-loneliness"]
title = "Training on loneliness | Campaign to End Loneliness"
description = "We have had the privilege of training countless individuals and organisations over the years on the complexities of loneliness, empowering them with the knowledge and tools to make a meaningful difference."
full_description = "We have had the privilege of training countless individuals and organisations over the years on the complexities of loneliness, empowering them with the knowledge and tools to make a meaningful difference. While we no longer facilitate live training sessions or provide e-learning modules, you can still benefit from some of our training resources. We partnered with NHS Property Services to deliver the first-of-its kind training, enabling over 400 receptionists across England to support patients presenting with signs of loneliness. Feedback from attendees was overwhelmingly positive, with impacts lasting long after the course ended. Our corporate partner TransPennine Express embedded a version of our Introduction to Loneliness e-learning module into their onboarding programme for all staff. Feedback from the facilitated training we delivered for a wide range of organisations showed that 100% of learners agreed or strongly agreed the training: Feedback from our introductory and workplace loneliness e-learning modules also showed positive results, with 100% of learners of both modules agreeing they took something away from the course which will support their work. We are pleased to provide access to the following resources that formed part of our training offer. Please note that the interactive functionality is not included in the pdf versions of our e-learning modules. Thank you to all who joined us in our training sessions, shared their experiences, and applied their learning to make a difference. We would also like to extend a special thanks to Civil Society Consulting who we commissioned to develop the first version of our Loneliness Learning Programme in 2020. The Campaign to End Loneliness inspires thousands of organisations and people to do more to tackle the health threat of loneliness in older age. If you'd like to keep in touch, please leave your name and email below, or just click the orange button to go to make your donation. This website uses cookies so that we can provide you with the best user experience possible. Cookie information is stored in your browser and performs functions such as recognising you when you return to our website and helping our team to understand which sections of the website you find most interesting and useful."
