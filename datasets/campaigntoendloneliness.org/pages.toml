["https://www.campaigntoendloneliness.org/appg-on-tackling-loneliness-and-connected-communities"]
title = "APPG on Tackling Loneliness and Connected Communities | Campaign to End Loneliness"
description = "We work with the British Red Cross to help run the APPG on Tackling Loneliness and Connected Communities, a group which brings together parliamentarians with a common goal of addressing loneliness and increasing social connection."
full_description = "The APPG on Tackling Loneliness and Connected Communities brings parliamentarians together from across the political divide with a common goal of addressing loneliness and increasing social connection across different communities in the UK. The Group is led by co-chairs Tracey Crouch, who was the first ever Minister for Loneliness for the United Kingdom and Kim Leadbeater, MP for Batley and Spen who won the parliamentary seat after the murder of her sister Jo Cox MP. We work with the British Red Cross to help run this All Party Parliamentary Group on Tackling Loneliness and Connected Communities For more information about the All-Party Parliamentary Group on Loneliness and Connected Communities or to find out more about their public events, please email WilliamWall@redcross.org.uk to be added to their mailing list. The APPG report on Loneliness at work explores the extent of loneliness at work in the UK and whether different groups are impacted differently. The Campaign to End Loneliness inspires thousands of organisations and people to do more to tackle the health threat of loneliness in older age. If you'd like to keep in touch, please leave your name and email below, or just click the orange button to go to make your donation. This website uses cookies so that we can provide you with the best user experience possible. Cookie information is stored in your browser and performs functions such as recognising you when you return to our website and helping our team to understand which sections of the website you find most interesting and useful. Strictly Necessary Cookie should be enabled at all times so that we can save your preferences for cookie settings. If you disable this cookie, we will not be able to save your preferences. This means that every time you visit this website you will need to enable or disable cookies again. Performance cookies, also known as analytics cookies, are a type of tracking cookie used to collect information about how 