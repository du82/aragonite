["https://www.campaigntoendloneliness.org/about-the-campaign"]
title = "About the Campaign | Campaign to End Loneliness"
description = "We believe that people of all ages need connections that matter. We have been experts in the field of loneliness and connection since 2011 and our vision is that everyone can live a life free from chronic loneliness."
full_description = "We have been experts in the field of loneliness and connection since 2011. Our vision is that everyone can live a life free from chronic loneliness. Chronic loneliness affects people of all ages and backgrounds and touches the lives of millions. It causes real emotional pain and can impact our physical and mental health. It also has an economic cost in the additional health and care services that are needed by people who are lonely, and the missed contributions that people who are unable to connect could make in their communities. Our work always puts loneliness first. This exclusive focus allows us to maintain a depth of understanding on loneliness and how it relates to other issues. Sheffield Hallam University hosts the Campaign to End Loneliness and has legal responsibility of the Campaign from 1st May 2024. The directors of the Campaign are Professor Andrea Wigfield and Associate Professor Antonia Ypsilanti. The Campaign is supported by in-kind contributions from Sheffield Hallam University as well as, funds from various national and international funding bodies. If you would like to know more about our projects or would like to discuss funding collaborations, please email us at info@campaigntoendloneliness.org The Campaign to End Loneliness is a resource and advocacy organisation dedicated to raising awareness about the impact of loneliness and promoting initiatives to reduce social isolation. However, we do not provide psychological or mental health services. If you or someone you know is experiencing severe emotional distress, loneliness, or mental health challenges, we strongly encourage you to seek support from your GP, or a health care provider. If this is an emergency and you need immediate support, please contact Samaritans on 116 123 – they are open 24 hours a day, every day. The information and resources we provide are intended for educational and informational purposes only and should not be considered a substitute for professional medical or psychological advice, diagnosis, or treatment."
