["https://www.campaigntoendloneliness.org/evaluation"]
title = "Evaluation and measurement | Campaign to End Loneliness"
description = "Evaluation and measurement of loneliness at a local level is vital to understand loneliness, reach the most lonely people, and improve the UK's service provision."
full_description = "Measuring and evaluation of loneliness at a local level is vital to understand loneliness, reach the most lonely people, and improve the UK’s service provision. By measuring your impact on loneliness, it will not only lead to improvements in evaluations, but practical and actionable attempts to reduce loneliness. After government recommendations in 2018, the ONS undertook a process of scoping and consultation on loneliness measures, of which the Campaign to End Loneliness was a participant. As a result, they recommended the “gold standard” in measuring loneliness is to use both direct and indirect measures of loneliness where possible. They recommend four questions to capture different aspects of loneliness. The first three questions are from the University of California, Los Angeles (UCLA) three-item loneliness scale. The last is a direct question about how often the respondent feels lonely, currently used on the Community Life Survey. Using the UCLA scale ensures that loneliness is being measured using a scale that has been assessed as valid and reliable and the single item allows the respondent to say for themselves whether they feel lonely which provides insight into the subjective feeling of loneliness. The reason for asking the four questions together is that the stigma of loneliness may mean that people underreport their feelings if asked directly. The other questions help us understand other aspects that contribute to a person’s feelings of loneliness. To get the best understanding of whether someone is feeling lonely, it is recommended you ask all four questions. However, if you only have space for one question you should use the fourth question, ‘How often do you feel lonely?’ In 2015 we published our guidance on measuring loneliness, to detail how to measure your impact on service-users’ levels of loneliness. This guidance introduces three scales and the ways in which you can use them. These scales have been tried and tested in academic studies. In addition to the UCLA scale and one item scale used in the national indicator, our guidance also features two other scales: The Campaign to End Loneliness Measurement tool and The De-Jong Giervald 6-Item Loneliness Scale."
year_published = 2025
year_updated = 2024
