["https://www.campaigntoendloneliness.org/people"]
title = "Our People | Campaign to End Loneliness"
description = "Meet the Campaign to End Loneliness team and members of our Programme Advisory Group."
full_description = "Andrea is a leading researcher on loneliness and social isolation, specialising in the wider health and social determinants and implications through research, programme evaluation, and evidence-based policy and practice. She has managed around over 100 research projects, many co-produced with organisations and individuals. She is particularly interested in how people with different loneliness experiences perceive, interpret, and interact with their social environment. She is collaborating closely with community groups at-risk for socio-economic exclusion and with organisations interested in tackling loneliness, and promoting social welfare and mental health. Antonia has rich experience in leading or co-leading research grants funded by the European Commission, Age UK, and the Youth Endowment Fund. She is also an active member in her community engaging in a lot of charitable and social welfare activities. The Advisory group comprises stakeholders from the public, private and voluntary sectors, individuals with lived experience of loneliness, as well as academics and researchers, who are working in the loneliness field, with the aim of supporting and steering the work of the Campaign to End Loneliness. Views of those with lived experience of loneliness will be fed into the Advisory Group. The group was established in October 2024. The Campaign to End Loneliness inspires thousands of organisations and people to do more to tackle the health threat of loneliness in older age. If you'd like to keep in touch, please leave your name and email below, or just click the orange button to go to make your donation. This website uses cookies so that we can provide you with the best user experience possible. Cookie information is stored in your browser and performs functions such as recognising you when you return to our website and helping our team to understand which sections of the website you find most interesting and useful. Strictly Necessary Cookie should