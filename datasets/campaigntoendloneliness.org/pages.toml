title = "Press Releases | Campaign to End Loneliness"
description = "We are available for comments, interviews and information. Our exclusive focus on loneliness allows us to maintain a depth of understanding and expertise on this issue and how it relates to wider society."
full_description = "Released on July 4, 2023 Half a million more people are lonely all or most of the time New analysis of Office for National Statistics data shows that the number of people who are chronically lonely has risen to 3.83 million – half a million more than in the first year of the pandemic when 3.24 million people were chronically lonely. 7.1% of the population now say that they are always or often… Read more » Released on July 3, 2023 A Train to Friendship: Join author Max Dickins as he tackles loneliness amongst men Campaign to End Loneliness (CEL), TransPennine Express (TPE), House of Books and Friends, and author Max Dickins are joining forces at Manchester International Airport Station on Monday 3 July. Customers travelling through the station are invited to stop by for a free tea or coffee between 10 and 12 as part of TPE’s partnership with… Read more » Released on April 12, 2023 Younger Brits report higher levels of loneliness Those aged between 16-29 are over two times as likely to report feeling lonely often or always than those over 70 (9.7% versus 3.7%), with those aged between 30-49 close behind at 8.2%, according to new analysis of the latest ONS data. This comes as overall levels of chronic levels of loneliness, where people feel… Read more » Released on January 25, 2023 Report explores extent of loneliness at work in the UK A new report, authored by the British Red Cross and Campaign to End Loneliness for the All-Party Parliamentary Group on Tackling Loneliness and Connected Community has launched today. It explores the extent on loneliness at work in the UK, how it’s changed since the Covid-19 pandemic and provides useful insights based on a unique population-wide… Read more » Released on October 31, 2022 Tackling loneliness through the built environment Make our future neighbourhoods less lonely places on World Cities Day With new figures showing 3.8 million people in Britain are now chronically lonely, the design of our neighbourhoods can play an important role in tackling loneliness and helping people to connect, according to the Campaign to End Loneliness which published a new report Tackling… Read more »"
