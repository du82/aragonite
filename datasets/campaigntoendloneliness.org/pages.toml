["https://www.campaigntoendloneliness.org/health-impact"]
title = "Health impact | Campaign to End Loneliness"
description = "The health impact of loneliness is similar to those associated with many factors that currently receive substantial public health attention and resources. We want to make sure loneliness is treated as the major public health concern it is."
full_description = "The health impacts of loneliness are similar to those associated with many factors that currently receive substantial public health attention and resources (obesity, physical inactivity, air pollution). The close relationship between loneliness and health is well-documented. In 2022, people who said they had a physical and/or mental health diagnosis were over three times as likely to be chronically lonely than those who said they did not [1]. And there is substantial evidence that having a lack of social connections significantly increases the risk of premature mortality. The exact mechanisms by which loneliness can cause negative health outcomes are difficult to demonstrate. Three main pathways have been suggested. These are [2]: Loneliness and social isolation can impact our behaviour, adversely influencing daily activities and functions. For example, loneliness is associated with an increase in difficulties with activities of daily living [3], and a greater risk of being inactive and smoking [3; 4]. There is also evidence that social support can influence medication adherence [5]. So as well as impacting health through psychological and physiological processes, loneliness and social isolation may also affect health indirectly through their effects on health-related behaviours. The effect of loneliness and isolation on mortality is comparable to the impact of well-known risk factors such as obesity, and has a similar influence as cigarette smoking [6]. Loneliness can increase the risk of early mortality by 26% [7]. Poor mental health can lead to loneliness (for example, due to withdrawal or reduced capacity for interaction). But loneliness can also negatively impact mental health. So the relationship can go in both directions. In particular, experiencing severe and long-term loneliness can have a ‘damaging impact on our mental health’ [19]. Loneliness can contribute to a decline in mental health. This can be through things like: having more time alone to ruminate on worries and negative thoughts, losing confidence in the ability to socialise, feeling overwhelmed in social settings, and not talking about how you feel, which can lead to feeling even more overwhelmed [26]."
year_published = 2025
year_updated = 2023
