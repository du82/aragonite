["https://www.campaigntoendloneliness.org/facts-and-statistics"]
title = "Facts and Statistics | Campaign to End Loneliness"
description = "The latest facts and statistics about loneliness help us to learn more about the risk factors and how loneliness affects our lives."
full_description = "Loneliness can affect anyone. Experiences of loneliness can vary, but its effects can be profound and wide-ranging. It is considered by many to be one of the largest public health challenges we face. The latest facts and statistics about loneliness help us to understand more about the risk factors and the impact it can have on different areas of our lives. Loneliness is ‘a subjective, unwelcome feeling of lack or loss of companionship. It happens when there is a mismatch between the quantity and quality of the social relationships that we have, and those that we want’ [3] This definition draws on Perlman and Peplau’s understanding of loneliness. They use the cognitive deficit model, which views loneliness as ‘a discrepancy between one’s desired and achieved levels of social relations’ [4]. This perspective emphasises the significance of desired versus actual social connections, so it helps us distinguish loneliness from social isolation. We therefore understand loneliness as an emotional experience: a perceived deficiency in the amount and/or quality of someone’s existing relationships. There are different types of loneliness. The following three are the most commonly identified in evidence and literature on loneliness [5]: Loneliness is linked to social isolation but it is not the same thing. While loneliness is an emotional experience, isolation is a lack of social contact. Loneliness is a subjective feeling, whereas isolation is an objective state. Social isolation is about the ‘level and frequency of one’s social interactions’ [6]. It is defined as ‘having few social relationships or infrequent social contact with others’ [7]. Feeling lonely is not necessarily the same as being alone. Some people can spend lots of their time on their own and still feel content. Others may be surrounded by people but feel disconnected from them and lonely. Loneliness is not a mental health problem in itself. However, loneliness and poor mental health are interlinked, each can worsen the other [8] and as such, they are closely interlinked. Meanwhile, social connectedness is associated with better mental health [9]."
year_published = 2025
year_updated = 2024
