terkünfte Kinderbetreuung, Kinderspielhaus Spielplatz Kindersanitärbereich, Babywickelraum Adresse: Schilliger Düne, 26434 Wangerland-Schillig GPS-Koordinaten: 53°41’55.9″N 8°01’29.6″E | 53.698847, 8.024875 Strand- und Familiencampingplatz Bensersiel Lage: in direkter Strandnähe Größe: 12-13 ha saisonal vom 29.03.-13.10.2020 geöffnet 750 Standplätze insgesamt, dafür 350 Stellplätze für Urlauber, die Mietcontainer werden privat angeboten und sind nicht über den Campingplatzbetreiber zu buchen beheizbares Freibad und Planschbecken bunte Bäder für Kinder Hallenbad in 500 m Entfernung Kinderanimation, Babywickelraum, Kletterschiff, Indoor-Spielplatz Hunde sind nicht erlaubt Adresse: Am Strand, 26427 Bensersiel (Niedersachsen) GPS-Koordinaten: 53°40’36.5″N 7°34’12.9″E | 53.676802, 7.570239 Fotos: (c) Esens-Bensersiel Tourismus GmbH Camping am Nordseestrand Lage: direkte Strandlage 500 Meter von der Ortsmitte Dornumersiel entfernt 100 Dauerstellplätze, 200 Standplätze für Urlauber Größe: 3,5 ha saisonal vom 01.04.-04.10.2020 geöffnet eigenes Schwimmbad 300 m langer und 150 m breiter Sandstrand Hunde willkommen, separater Hundestrand Planschbecken, beheizbares Freibad Kinderanimation, Aufenthaltsraum Spielplatz Babywickelraum und Sanitärbereich für Kinder Adresse: Am Nordseestrand 1, 26553 Dornumersiel GPS-Koordinaten: 53°40’48.6″N 7°28’54.5″E | 53.680159, 7.481812 Foto: (c) Tourismus GmbH Gemeinde Dornum Nordsee Camp Norddeich Lage: direkt hinter dem Seedeich 513 Standplätze, 37 Mietunterkünfte Größe: 25 ha Kinderanimation, Kinderspielplatz Babywickelraum, Sanitärbereich für Kinder Hunde erlaubt Lebensmittelladen, Restaurant Adresse: Deichstraße 21, 26506 Norddeich (Niedersachsen) GPS-Koordinaten: 53°36’15.2″N 7°08’20.8″E | 53.604211, 7.139121 Camping am Deich Lage: Landseite vom Deich mit Blick auf das Marschland, unweit von Emden und Greetsiel 290 Stellplätze, 17 Mietunterkünfte saisonal geöffnet vom 25.03.-01.11.2020 nächstgelegene Stadt: Krummhörn Wattenmeer fußläufig hinter dem Deich erreichbar Kinderanimation, Kinderland Babywickelraum, Indoor-Spielplatz besondere Gestaltung der Sanitärgebäude als Schiff und Leuchtturm Kinderspielplatz, Hüpfkissen in unmittelbarer Nachbarschaft liegt Norddeutschlands einziger Trockenstrand mit Piratenschiff und Wasserspielanlage Schwimmbad-Oase Greetsiel ist ab dem zweiten Besuch mit der Nordsee-Card kostenfrei nutzbar Hunde willkommen Adresse: Erbsenbindereistraße 3, 26736 Upleward GPS-Koordinaten: 53°25’15.5″N 7°00’53.7″E | 53.420958, 7.014927 Fotos: (c) FB Camping Group Nordsee-Camping Neuharlingersiel Lage: direkt am Grünstrand und Sandstrand ganzjährig geöffnet 1.100 Stellplätze, 300 Zeltplätze 5 Stellplätze für Besucher mit Hunden Spielbereich für Kinder Kinderbadelandschaften in den Sanitärgebäuden Wickelauflagen Leuchttürmchen-Club mit Kinderprogramm Wasserspielanlage Meerwasser-Hallenbad, Saunalandschaft direkt am Campingplatz Adresse: Alt Addenhausen 4, 26427 Neuharlingersiel GPS-Koordinaten: 53°41’45.6″N 7°41’26.5″E | 53.696007, 7.690690 Foto: (c) Kurverein Neuharlingersiel e.V. / Thiel Weitere Camping- und Stellplätze an der Nordsee: PiNCAMP Die Nordsee Nordsee Tourismus Service Tolle Ausflüge und Unternehmungen an der Nordsee mit Kindern Watt, Seehunde, Brandung und der salzige Duft nach Meer sowie Spiel und Spaß für Kinder bei schlechtem Wetter, das alles findest du beim Camping an der Nordsee. Hier habe ich einige Vorschläge für Ausflugsziele und Unternehmungen für Familien mit Kindern gesammelt. Seehundstationen An den Seehundstationen in Friedrichskoog und Norddeich wird es niedlich: Heuler, also Jungtiere, die von ihrer Mutter getrennt wurden, werden hier aufgezogen, um anschließend wieder ausgesetzt zu werden. Wenn du dich für Camping auf Helgoland entscheidest, findest du dort vorgelagerte Seehundbänke, auf denen du die Tiere in ihrem natürlichen Lebensraum beobachten kannst. Fotos: (c) Tanja Klose Wattwanderungen Das Wattenmeer, ein großer Abenteuerspielplatz für Kinder mitten in der Natur, das sich in nahezu allen Regionen an der Nordseeküste auf einer geführten Wattwanderung mit einem Watt- und Gästeführer erkunden lässt, ist charakteristisch für die Nordsee. Im Wandel der Gezeiten haben hier viele Tier- und Pflanzenarten ihr Zuhause. Im Erlebniszentrum Mensch und Watt kannst du auf einer der 20 Stationen viel über das Wattenmeer als Lebensraum für Tiere und Pflanzen lernen. Foto: (c) TMS Büsum GmbH Wandern und Radfahren an der Nordsee Eine klassische Wanderregion ist die Nordseeküste nicht, wenn du gerne ausgedehnte Spaziergänge auf dem Deich unternimmst, bist du hier bei garantiertem Meerblick zu Fuß trotzdem ganz gut aufgehoben. Wenn dir Gegenwind nichts ausmacht, dann kannst du rund 300 Kilometer von Brunsbüttel bis über die dänische Grenze auf dem Nordseeküsten-Radweg unterwegs sein. Alternativ kommen verschiedene Etappentouren oder Standortreisen mit dem Rad an der Nordsee infrage. Aktivurlaub an der Nordsee mit Kindern Schwimm- und Freizeitbäder findest du in Brunsbüttel, Büsum und Albersdorf. Die Dünen-Therme in St. Peter-Ording ist mit ihrem Wasserspielplatz auch für Kleinkinder hervorragend geeignet, für ein ausgiebiges Schläfchen zwischendurch stehen Babybetten zur Verfügung. Bei Ebbe kannst du im Meerwasserfreibad des Nordseeheilbad Bensersiel unter freiem Himmel in dem mit Nordseewasser befüllten Schwimmbecken planschen. Ältere Kinder sammeln an der Nordsee erste Erfahrungen im Kite-Surfen, vor allem in Sankt Peter-Ording. Kleinere Kinder an der Nordsee erfreuen sich am Drachensteigen. Einer der modernsten Strände an der Nordseeküste ist die Perlebucht in Büsum. Eine Lagune, die das Camping mit Kindern am Meer zu einem echten Familienerlebnis werden lässt. Spielgeräte, Klettermöglichkeiten, Hängematten, ein terrassenartiger Einstieg ins Wasser, mehrere Grillplätze und ein Lagerfeuerkreis mit achtzehn Bänken locken Familien zum Camping nach Büsum. Fotos: (c) TMS Büsum GmbH Entertainment und Parks Einige der familienfreundlichen Campingplätze an der Nordsee in Niedersachsen und Schleswig-Holstein verfügen über Indoor-Spielparks. Wer noch mehr Abwechslung braucht, der kann sich ergänzend bei Wal Willi in Friedrichskoog und in der Pelotero Fun-City in Wesselburgen austoben. Im Westküstenpark und Robbarium in Sankt Peter-Ording gibt es im Tierpark auch eine Riesen-Rutsche, ein Hüpfkissen und einen großen Naturspielplatz. Der Land & Leute Erlebnishof bei Wesselburen bringt Kindern die heimische Natur näher und hat einige kirmesähnliche Fahrgeschäfte im Angebot. Erholung ist in einer Parkanlage mit Ruhezonen möglich. Fotos: I-III. (c) Tourismus-Zentrale St. Peter-Ording | IV. Tourismus Service Norden Norddeich Museen An der Nordsee findest du einige Museen und Ausstellungen, die sich für einen Besuch mit Kindern eignen: Waldmuseum Burg in Dithmarschen: Mit Waldlehrpfad und einem Rundwanderweg mitten im Grünen kannst du mit deiner Familie eine Menge über das regionale Ökosystem lernen. Phänomenta in Flensburg: Ein Mitmach-Muse"
