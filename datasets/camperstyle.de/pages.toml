["https://camperstyle.de/ebikes-faltbar-test-tubo-sprint-eflizzer"]
title = "Faltbare E-Bikes im Test: eflizzer Tubo und Sprint | CamperStyle"
description = """
Vermutlich der einzige Mexikaner auf deutschen Campingplätzen. Wurde schon als Kind im väterlichen Bulli mit dem Campingvirus infiziert. Kann (fast) alles mit Multitool, Panzertape und Kabelbindern reparieren.
Lieblingsspots: Mexiko, Norwegen & Südspanien"""
full_description = "E-Bike > Faltbare E-Bikes im Test: eflizzer Tubo und Sprint Jalil Landero Flores | 04.07.2018 Faltbare E-Bikes im Test: eflizzer Tubo und Sprint E-BikeMobilität Mobilität UPDATE 13.07.2018: Aufgrund des Handelskonflikts zwischen der EU und China und den damit verbundenen, angedrohten Strafzöllen auf E-Bike-Importe aus China, wurden wir gerade darüber informiert, dass der deutsche Markt zur Zeit leider nicht mit den eflizzer-Produkten beliefert werden kann. Die Firma Babutec GmbH arbeitet jedoch mit Hochdruck an einer Lösung des Problems und hofft darauf, auf Anfang der Saison 2019 wieder in Deutschland und der EU am Start zu sein. Nachdem wir letztes Jahr bereits die elektrischen Falträder eflizzer 1-2-3 ECO testen durften, haben wir in den letzten Monaten mal zwei weitere Modelle der Schweizer Marke eflizzer unter die Lupe genommen: Das kompakte Tubo und das komfortable Sprint, die uns mit coolen technischen Upgrades überraschten. Mit den eflizzer-Modellen Tubo und Sprint lassen sich bequem auch größere Strecken zurücklegen. [vcex_spacing size=“15px“]Beide Modelle verfügen über einen noch leistungsstärkeren Motor und einen LCD-Monitor mit Tacho, auf dem du neben der Geschwindigkeit und Tageskilometern auch die Motorleistung in mehreren Stufen regulieren kannst. So lässt sich die elektrische Tretunterstützung gezielt an deine Fitness sowie die unterschiedlichen Straßenverhältnisse und Geländeformen anpassen und die Batterie wird geschont. Die Akkus sind jeweils abnehmbar und lassen sich sowohl an den Rädern als auch unabhängig davon (z.B. im Camper) laden. Außerdem sind beide mit Leuchten, Reflektoren und Schutzblechen ausgestattet, also auch im Straßenverkehr problemlos nutzbar, das Material von Sattel und Lenkergriffen ist noch eine Stufe hochwertiger als beim Vorgänger. Während Größe und Bauweise des Tubo im fahrbereiten wie auch im zusammengefalteten Zustand stark an das 1-2-3 ECO erinnert, ist das Sprint etwas größer und mit einem breiteren Rahmen versehen. Beide lassen sich jedoch mit wenigen Handgriffen zusammenklappen und im Kofferraum deines Autos oder der Heckgarage deines Wohnmobils bequem verstauen. Die beiden Modelle sind nicht nur formschön, sondern auch sehr praktisch. Auch größere Steigungen und unebener Untergrund lassen sich mit den eflizzern mühelos bewältigen. Das Tubo lässt sich zu einem leichtgewichtigen Mini-Paket zusammenfalten… Das Sprint hat ein etwas größeres Packmaß, bietet dafür aber mehr Fahrkomfort. InhaltsverzeichnisDetails zum eflizzer TuboDetails zum eflizzer SprintVor- und Nachteile der beiden Modelle sowie Unterschiede zum 1-2-3 ECOUnser FazitFür wen ist welches Modell am besten geeignet? Details zum eflizzer Tubo Das Modell Tubo ist, wie schon erwähnt, dem 1-2-3 ECO sehr ähnlich – aber trotz seines ebenfalls sehr schicken Designs und der tollen Technologie sogar ein Stück günstiger. Ein robustes kleines E-Bike, das sich perfekt für Camper, aber auch z.B. für Pendler oder Bahn-Vielfahrer eignet. Es lässt sich superkompakt zusammenfalten und ist ein echtes Leichtgewicht, das man sich bei Bedarf mal schnell unter den Arm klemmen kann. Durch seine stabile Bauweise kommt es auch mit gepflasterten Straßen oder geschotterten Wegen gut zurecht. Die wichtigsten Merkmale des Tubo im Überblick: [su_list icon=“icon: check-circle-o“ icon_color=“#f2a739″] Kompaktes Packmaß: – Zusammengefaltet 70 x 63 x 42 cm (L x H x B) – Passt auch in kleinere Kofferräume, Heckgaragen oder Stauräume Breite und tragfähige 16“-Reifen: Maximale Flexibilität – für Fahrten auf Straßen, Pflaster, Radwegen oder unebenem Terrain geeignet Abnehmbare und austauschbare Batterie in der Sattelstange: – Kein optisch störender „Kasten“ am Rad – Perfekt zum Laden in Camper, Wohnung oder Büro – Effiziente Diebstahlsicherung – ohne Batterie und Sattel kann das Rad nicht oder nur schwer bewegt werden Handgas als „Starthilfe“: Für Steigungen oder einfach nur aus Bequemlichkeit – komfortables Anfahren dank Handgas Scheibenbremsen: Greifen auch auf nassem oder schlammigem Boden sowie an Abhängen problemlos 5-stufige Regulierung der Motorleistung: Bessere Kraftverteilung und weniger Batterieverbrauch Multifunktionales LCD-Display: Beleuchteter Mini-Monitor mit großer Schrift erleichtert das Ablesen Schönes Design: – Schlicht und funktional, ohne überflüssigen „Schnickschnack“ – Mehrere Farben (schwarz, weiß, rot) für unterschiedliche Geschmäcker – Schwarze Version besonders ästhetisch: alle Komponenten vom Pedal bis zur Felge sind „Black & Black“ – laut Jalil das stylischste Rad, das er bisher gefahren hat – Harmonische Proportionen Geringes Gewicht und gute Gewichtsverteilung: – Nur 14,5 kg – Leichter, aber stabiler Alu-Rahmen – Batterie zentral verbaut – Einfach zu tragen, z.B. über Treppen oder in Zügen – Interessante Option auch für Fahrzeuge mit geringer Zuladungsreserve Gute Reichweite auch für ausgedehntere Touren: Bis zu 40 Kilometer mit Tretunterstützung erreichbar Als “single-speed”-Version oder mit Gangschaltung verfügbar: Mechanische Shimano Nexus 3-Gang-Schaltung für noch mehr Einsatzmöglichkeiten und Komfort (und weniger Energieverbrauch) [/su_list] Der Preis für das Tubo liegt in Deutschland bei 1.090,00 Euro. Weitere Infos: eflizzer.de/produkt/eflizzer-tubo-robustes-elektro-faltrad Details zum eflizzer Sprint Das Sprint ist der „große Bruder“ der Modelle Tubo und 1-2-3 ECO – mit ihm bist du dank seiner etwas größeren Reifen fast wie auf einem normalen Fahrrad unterwegs. Es bietet nicht nur eine hohe Autonomie, sondern auch innovative Features wie zum Beispiel einen USB-Port, der während deiner Touren dein Smartphone lädt. Die wichtigsten Merkmale des Sprint im Überblick: [su_list icon=“icon: check-circle-o“ icon_color=“#f2a739″] Bessere Ergonomie durch stufenlose Höhenverstellbarkeit: – Sowohl Sattel- als auch Lenkerhöhe sind beim Sprint höhenverstellbar. – Bequemere Sitzhaltung, auch für größere Menschen – Weiße Markierungen an den Stangen sorgen dafür, dass die richtige Einstellung schnell wiedergefunden wird. Geringes Gewicht: Mit seinen 17 kg wiegt das Sprint zwar etwas mehr als das Tubo, ist aber trotz E-Antriebs immer noch genauso leicht wie die Mehrheit der herkömmlichen „normalen“ Räder. Großzügige 20”-Reifen: Erhöhen den Fahrkomfort und machen das Rad auch für längere Touren zu einem bequemen Begleiter – trotzdem lässt sich das Sprint platzsparend im Kofferraum oder in öffentlichen Verkehrsmitteln transportieren. Handgas als „Starthilfe“: Hebel am Lenkergriff, der am Berg oder in unebenem Gelände für eine kleine Extraportion Anschub sorgt Shimano 6-Gang-Schaltung: Tretunterstützung und Batterieverbrauch durch verschiedene Gänge optimierbar – vor allem auf längeren Touren und bei Gelände mit vielen Steigungen super praktisch! Hinterradantrieb: – Garantiert gleichmäßige Unterstützung auch in unebenem Gelände oder bei starken Steigungen – Verhindert ein Abrutschen auf nassem oder unbefestigtem Untergrund – Perfekt auch für Fahrten mit kleinem Anhänger für Kinder, Hunde oder Lasten Robuster Gepäckträger: Groß und stabil genug für Körbe oder Fahrradtaschen Abnehmbare und austauschbare 8-Ah-Batterie im Rahmen – Kein störender Kasten außen am Rad – Akku gut geschützt vor Diebstahl und Stößen – Zusätzliche Diebstahlsicherung durch Schloss – Zum Laden in Wohnmobil, Wohnung oder Büro einfach zu entnehmen USB-Anschluss: Akku ist mit einem USB-Port ausgestattet, der von außen zugänglich ist – hier können Smartphone oder Navigationsgerät bequem unterwegs geladen werden. Sehr hohe Reichweite: – 50 bis 60 Kilometer je nach Eigenleistung und Terrain möglich – Durch Wechselakku(s) beliebig erweiterbar Schöne Proportionen und schickes Design: – Harmonisches Gesamtbild durch große Reifen und massiven Rahmen – Verschiedene Farben: Weiß, Schwarz, Grau, Blau, Rot [/su_list] Das Sprint kostet in Deutschland 1.190,00 Euro. Weitere Infos: eflizzer.de/produkt/eflizzer-sprint Vor- und Nachteile der beiden Modelle sowie Unterschiede zum 1-2-3 ECO Die Erfahrungen, die wir mit beiden Modellen gemacht haben, decken sich fast 1:1 mit unserem Langzeittest des 1-2-3 ECO: Vielfältige Einsatzgebiete Auch Sprint und Tubo lassen sich sowohl beim Camping als auch im Alltag vielfältig einsetzen – sei es für kleinere Ausflüge, Städtetouren, Supermarkteinkäufe oder einfach zur Mobilität auf dem Campingplatz. Da wir ja meist in den etwas ruhigeren Ecken stehen, haben wir die Räder sehr häufig genutzt, um zu den Sanitäranlagen zu gelangen, etwas an der Rezeption zu erledigen oder morgens mit dem Hund ganz schnell vom Platz zu kommen, damit nicht aus Versehen ein Geschäft auf der Nachbarparzelle erledigt wird. … Und wenn die kleine Zwiebel mal müde wird, darf sie im knallroten Anhänger ausruhen – den kannst du mit einem Adapter an beiden Rädern anbringen. Bei uns ist der Hund natürlich immer [vcex_spacing size=“15px“]Neles besonderes Highlight waren die Fahrten zu den Waschmaschinen auf dem Sprint: Dank des etwas erhöhten Rahmens konnte sie unseren riesigen Wäschesack bequem zwischen Lenker und Sattel parken, ihn mit den Knien festhalten und per Handgas über den Platz cruisen – unter den Anfeuerungsrufen der Nachbarn! Preis-Leistungsverhältnis Mit Preisen zwischen knapp 1.100 und knapp 1.200 Euro liegen die beiden E-Bikes im unteren Mittelfeld der aktuellen Angebote – qualitativ jedoch bewegen sie sich aus unserer Sicht ziemlich weit oben. Wir jedenfalls können bisher nur Positives berichten. Nach unserem Test der 1-2-3er Serie hatten wir entschieden, die Räder zu übernehmen, da wir schlichtweg nicht mehr auf sie verzichten wollten. Seither sind sie bei uns im Dauereinsatz und laufen und laufen und laufen… Wir gehen davon aus, dass diese Qualität auch bei Tubo und Sprint zu erwarten ist – auf jeden Fall machten sie in den zwei Monaten Testphase einen mindestens ebenso hochwertigen Eindruck. Trotz häufiger Transporte im Kofferraum und regelmäßiger Nutzung über Stock und Stein sind keine Schäden oder Fehlfunktionen aufgetreten. Beide Modelle überzeugten in punkto Qualität und Preis-Leistungsverhältnis. [vcex_spacing size=“15px“]Und so wird auch das Sprint im Team bleiben: Unsere Kollegen Stefanie und Sebastian haben es der Herstellerfirma Babutec nach Abschluss unseres Tests abgekauft und freuen sich riesig, dass es sie zukünftig in ihrem Wohnmobilalltag begleiten wird. Ergonomie und Fahrkomfort Während die Modelle 1-2-3 und Tubo für größtmögliche Mobilität und kleinstmögliches Packmaß konzipiert wurden und auf längeren Fahrten doch etwas unbequem werden, ist das Sprint in punkto Ergonomie und Fahrkomfort ein erheblicher Sprung nach oben. Für eher kleingeratene Menschen wie uns (1,69 m) fühlt es sich fast wie ein normales Fahrrad an, aber auch größere Zeitgenossen erreichen dank Höhenverstellung eine perfekte Mischung aus der Flexibilität eines Klapprades, der Autonomie eines E-Bikes und dem Fahrkomfort eines klassischen Rads. Transport und Handlichkeit Das Tubo ist wie das 1-2-3 in wenigen Sekunden zu einem kleinen Paket „verschnürt“ und findet auch in kleinsten Lücken Platz. Beim Sprint muss man beim Zusammenklappen mit etwas mehr Sorgfalt vorgehen, um alle Komponenten in die optimale Position zu bringen und so hier und da noch einige Zentimeter einzusparen. Ganz so kompakt wie seine beiden „Geschwister“ ist es aufgrund seiner größeren Ausgangsmaße naturgemäß nicht faltbar, es findet jedoch trotzdem in (fast) jedem herkömmlichen Kofferraum und natürlich auch in der Heckgarage eines Wohnmobils Platz. Sowohl das Tubo als auch das Sprint passen in fast jeden Kofferraum und natürlich auch in die Heckgarage des Wohnmobils. [vcex_spacing size=“15px“]In punkto Gewicht und Handling spürt man ebenfalls einen gewissen Unterschied – während sich 1-2-3 und Tubo problemlos unter den Arm packen lassen, braucht man fürs Sprint zum Tragen oder Ein- und Ausladen in der Regel beide Hände – das ist eben der Preis für das deutliche Plus an Komfort. Technik Auch bei Tubo und Sprint setzt der Hersteller in der Konstruktion auf einfache, leicht bedienbare Mechanismen. Mit einigen Hebelbewegungen sind die Räder schnell zusammen- und wieder auseinandergefaltet, Werkzeuge oder aufwändige Bedienungsanleitungen sind hier überflüssig. In punkto Elektronik hat sich jedoch so einiges getan: Anders als beim 1-2-3, das ohne Gangschaltung auskommt und bei dem die Tretunterstützung nur an- oder ausgeschaltet werden kann, sind Sprint und Tubo sehr viel feiner regulierbar. Auch wenn natürlich im Allgemeinen jede zusätzliche elektronische Komponente wieder eine gewisse Fehleranfälligkeit bergen kann, so müssen wir doch zugeben, dass wir von der neuen Technologie sehr begeistert waren. Die verschiedenen Stufen sorgen für eine gleichmäßige, den Rahmenbedingungen angepasste Fahrweise und die Tretunterstützung ist teilweise nur unterbewusst spürbar, aber gleichzeitig doch sehr effizient – das merkt man in erster Linie dann, wenn man sie mal ausschaltet! 🙂 Hinterbauständer vs. umklappbarer Gepäckträger Um das 1-2-3 abzustellen, wird einfach der Gepäckträger nach unten geklappt. Bei Sprint und Tubo ist dies anders gelöst: Hier sorgen klassische Fahrradständer (im Fachjargon: Hinterbauständer) für sicheren Halt. Beide E-Bikes sind mit einem stabilen Hinterbauständer ausgestattet. [vcex_spacing size=“15px“]Wir haben noch nicht abschließend entschieden, was wir besser finden – beide Varianten haben ihre Vor- und Nachteile. Wer zum Beispiel mit Anhänger unterwegs ist, braucht in den meisten Fällen einen Fahrradständer zum Ausklappen, für Fahrten mit Bus und Bahn wiederum ist die Gepäckträgerlösung besser, weil das Rad dann im „geparkten“ Zustand weniger Platz wegnimmt. Die perfekte Alternative wäre wahrscheinlich, beide Möglichkeiten zur Verfügung zu haben – ob dies jedoch technisch umsetzbar wäre, wissen wir nicht. Unser Fazit Beide Modelle, Sprint wie Tubo, sind eine hervorragend geeignet für alle, die sich mehr Mobilität wünschen und gleichzeitig nach einer platz- und gewichtsparenden Option suchen. Die Falträder sind schnell verstaut und so nicht nur für den Transport von A nach B vorbereitet, sondern auch vor begehrlichen Blicken geschützt. In öffentlichen Verkehrsmitteln können sie kostenlos mitgenommen werden. Der austauschbare Akku ist in unseren Augen ein toller Fortschritt: Zum einen kannst du so immer eine geladene Zweitbatterie mitführen und die Reichweite damit mal eben verdoppeln, zum anderen lässt sich der Akku so viel einfacher laden, als wenn du immer das ganze Rad an die Steckdose hängen musst. Und zum dritten bietet diese Lösung natürlich den Vorteil, im Falle eines Defekts oder nachlassender Akkuleistung schnell, einfach und günstig(er) für Ersatz zu sorgen. Das elektrische Faltrad Tubo ist super für kleinere Touren und schnelle Erledigungen geeignet. Sein „größerer Bruder“ Sprint kann aufgrund der ergonomischen Sitzhaltung sogar für ausgiebigere Ausflüge genutzt werden. Bei uns kamen die Räder sogar „offroad“ zum Einsatz und haben gut mitgehalten. Für wen ist welches Model"
