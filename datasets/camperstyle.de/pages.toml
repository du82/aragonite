full_description = "Jobs bei CamperStyle Verstärkung gesucht! Für unser wachsendes Online-Magazin brauchen wir regelmäßig Unterstützung in verschiedenen Tätigkeitsfeldern. Falls du also campingbegeistert bist und gerne freiberuflich in einem ebenso camping- und reiseverrückten Team arbeiten möchtest, schick uns gerne eine Initiativbewerbung an job@camperstyle.de! Wir suchen aktuell: Video-Creator Was du mitbringen solltest: du bist gerne vor der Kamera du hast ein grundlegendes Verständnis von Kameraführung, Bild, Ton und Licht du hast Grundkenntnisse im Videoschnitt Zuverlässigkeit Rechnungstellung (mit oder ohne Umsatzsteuer) Branchenkenntnisse sind kein Muss, aber von Vorteil Was wir dir bieten können: Ortsunabhängiges Arbeiten Freie Zeiteinteilung Ein nettes Team, das sich auch gerne mal zum persönlichen Austausch trifft Regelmäßige Aufträge überdurchschnittliche Bezahlung Was wir uns von dir wünschen: sicheres Auftreten vor der Kamera fristgerechte Erledigung der Aufträge Bei beiderseitiger Zufriedenheit eine langfristige Zusammenarbeit Autor*innen im Bereich Ratgeber/Technik Was du mitbringen solltest: Ein gutes Verständnis für Technik und technische Zusammenhänge Interesse an Camping und Campingfahrzeugen sowie den damit verbundenen Themen Erfahrungen in Recherche und dem Verfassen von Ratgeber-Texten Zuverlässigkeit Rechnungstellung (mit oder ohne Umsatzsteuer) Branchenkenntnisse sind kein Muss, aber von Vorteil Was wir dir bieten können: Ortsunabhängiges Arbeiten Freie Zeiteinteilung Ein nettes Team, das sich auch gerne mal zum persönlichen Austausch trifft Regelmäßige Aufträge überdurchschnittliche Bezahlung Was wir uns von dir wünschen: Gut recherchierte, fundierte und ausführliche Ratgebertexte (je nach Thema 500 bis 1.500 Worte pro Beitrag) auf Basis unserer Briefings Eine fristgerechte Abgabe der Artikel Bei beiderseitiger Zufriedenheit eine langfristige Zusammenarbeit Autor*innen im Bereich Lifestyle Was du mitbringen solltest: Gute bis sehr gute Englischkenntnisse in Wort und Schrift (sicheres Hör- und Leseverständnis, Verfassen von Mails) Interesse an VanLife- und Camping-Themen Gute journalistische Schreibe Gespür für den Camping-Lifestyle Zuverlässigkeit Rechnungstellung (mit oder ohne Umsatzsteuer) Was wir dir bieten können: Ortsunabhängiges Arbeiten Freie Zeiteinteilung Ein nettes Team, das sich auch gerne mal zum persönlichen Austausch trifft Regelmäßige Aufträge überdurchschnittliche Bezahlung Was wir uns von dir wünschen: Kurze, ansprechende Beiträge zu bunten Themen aus der Camperwelt (200 bis 400 Worte) auf Basis unserer Briefings Eine fristgerechte Abgabe der Artikel Bei beiderseitiger Zufriedenheit eine langfristige Zusammenarbeit Wenn du Lust hast, Teil des CamperStyle-Teams zu werden, bewirb dich unter job@camperstyle.de und schreib uns, warum du gerne für uns arbeiten möchtest und welche Erfahrungen du im jeweiligen Job und beim Campen schon sammeln konntest. Schick uns bitte außerdem einige Arbeitsproben (als PDF, Word, Video, Link, idealerweise zum Thema Camping) sowie deine Preisvorstellungen und bestätige uns, dass du eine Steuernummer oder Umsatzsteuer-ID besitzt und Rechnungen ausstellen kannst. Wir freuen uns auf dich!"
