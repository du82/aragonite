["https://camperstyle.de/camping-mit-handicap-geht-das"]
title = "Camping mit Handicap - geht das?"
description = """
Liebt Reisen mit viel Freiheit und wenigen Hindernissen und genießt seit letztem Jahr gemeinsam mit ihrem Freund Felix immer öfter das Leben im fast barrierefreien Mikrokosmos.
Lieblingsspots: Frankreich, Costa Vicentina in Portugal, die schöne Eifel."""
full_description = 'Camping mit Handicap > Camping mit Handicap – geht das? Anahita Balali | 19.08.2020 Camping mit Handicap - geht das? Camping mit Handicap Camping mit Handicap InhaltsverzeichnisDer perfekte UrlaubDer perfekte BulliDer perfekte CampingplatzDie perfekte TherapieUnd was noch nicht perfekt ist – wird perfekt gemachtExperten-Interview im Podcast zum Thema „Camping mit Handicap und Rollstuhl“ Der perfekte Urlaub Wie stelle ich mir einen perfekten Urlaub vor? Natur, Sonne, ein bisschen Abenteuer, keine Hotelburgen, kein Massentourismus, keine Schlangen am Frühstücksbüffet, viel Freiheit, und natürlich kein spießiges Wohnmobil mit Vorzelt, Jägerzaun und Gartenzwerg auf einem überfüllten Campingplatz in Meck-Pomm! Wer jung, mobil und cool ist, schnappt sich deshalb wohl sein Surfbrett, steigt damit in den abgerockten Kastenwagen und fährt so lang, bis er an einem einsamen Strand ankommt. Dort wirft er sich in die Fluten, reitet eine hohe Welle nach der nächsten, legt sich abends müde und glücklich auf seine dünne Isomatte neben den Camper und zählt zum Einschlafen die Sterne über sich. Und ich? Was muss ich tun, um am Ende des Urlaubstages müde und glücklich in den Sternenhimmel schauen zu können? Ich habe MS. Ich kann nicht surfen. Ich kann noch nicht mal barfuss über Sand laufen, geschweige denn, mich im Meer allein über Wasser halten. Und ich kann mich auch nicht einfach auf den Boden legen und einschlafen. Mein Handicap und ich brauchen ein paar kleine Extras. Wir brauchen: einen bequemen Autositz, auf dem man es gut viele Stunden aushalten kann, denn der perfekte Ort ist manchmal ein paar Kilometer entfernt, wir brauchen eine Toilette im Auto, ein gemütliches Bett für kleine Akku-Auflade-Pausen, einen Kühlschrank an Bord für kühle Getränke, falls der Körper mal dringend eine Abkühlung nötig hat, um wieder zu funktionieren. Der perfekte Bulli Nach unzähligen Messebesuchen, Nachmittagen in Wohnmobil-Häusern, Katalog-Durchforstungen und Internet-Recherchen haben wir uns dann einfach für unseren perfekten Bulli entschieden: er ist sechs Meter lang und himmelblau! Er hat alles, was WIR brauchen und alle Extrawürste, die ICH brauche. Bequeme Sitze, eine Toilette, ein gemütliches Bett (mit Sternenblick!), einen Kühlschrank, zwei Kochplatten, eine Dusche, einen Klapptisch zum Drinnen-Essen und einen Campingtisch zum Draußen-Essen, ein Bücherregal und genug Platz für meinen Rolli. Im Bus selbst brauche ich den Rolli zum Glück nicht. Der Bus ist so klein, dass man vom Bett zur Toilette, von der Toilette zum Kühlschrank und vom Kühlschrank zum Esstisch jeweils nur einen einzigen Schritt machen muss. Also perfekt für jemanden wie mich, der nicht gut laufen kann. Der perfekte Campingplatz Welcher Campingplatz für uns perfekt ist, finden wir mit jeder neuen Tour Stück für Stück heraus. Plötzlich entdecken wir wieder irgendein neues Detail, das einen Platz noch „perfekter“ macht. Es gibt Campingplätze mitten in der Natur ohne Sanitäranlagen, ohne Restaurant, ohne Strom, die super für uns sind. Es gibt aber auch Campingplätze mit wunderbaren Sanitäranlagen, mit herrlichen Biergärten, mit Swimming-Pools, mit Aufenthaltsräumen für verregnete Tage. Die sind manchmal auch super. Manche sind barrierefrei, manche nicht. Es gibt Campingplätze am Meer, in den Dünen, am See, im Wald, in der Stadt. Man hat die Qual der Wahl. Und das Schönste ist: Im Gegensatz zum Urlaub im Hotel muss man nie die Frage stellen, ob das Zimmer ohne Treppen zu erreichen ist, ob das Bad barrierefrei ist und ob man mit dem Rollstuhl zum Restaurant kommt. Seit wir mit unserem Bulli unterwegs sind, haben wir ja selbst alles dabei: unser Zimmer, unser Bad und unser Restaurant. Wir haben viel mehr Möglichkeiten als vorher. Wenn uns ein Platz gefällt, weil er direkt am See liegt, dann bleiben wir dort einfach. Uns ist egal, ob sich das Klohäuschen am Ende eines holprigen Schotterweges befindet. Uns ist egal, ob das einzige Café eine Beachbar auf einem schwimmenden Floss ist. Der selbstgemachte Kaffee am offenen Camperfenster schmeckt sowieso am Besten! Die perfekte Therapie Sobald ich unseren Camper betrete, passiert irgendetwas in meinen Nervenbahnen. Ich weiß nicht genau, warum, aber Körper und Geist sind plötzlich hellwach. Ich will auf dem Bett sitzen und unseren Kleiderschrank einräumen, ich will unsere Vorräte im Kühlschrank verstauen, ich will auf dem umgedrehten Beifahrersitz sitzen und Kaffeewasser auf dem Gasherd warm machen. Ich will Pläne schmieden, wo es als nächstes hingeht. Ich will aufs Meer schauen. Und durch die Dachluke in den Sternenhimmel. Ich will. Und ich tue es. Das Leben im Camper ist voller Herausforderungen. Aber das Bedürfnis nach Eigenständigkeit und Selbstbestimmtheit lässt sie mich alle annehmen und meistern. Im Camper ist nicht die MS die Chefin, sondern ICH bin es. Und was noch nicht perfekt ist – wird perfekt gemacht Die Dusche in unserem Camper habe ich noch nie ausprobiert. Da ich mich beim Duschen hinsetzen muss, befürchte ich, dass ich dabei den ganzen Bus unter Wasser setzen würde. Wir suchen uns deshalb in der Regel – zumindest alle paar Tage – Campingplätze mit einer barrierefreien Dusche. Es gibt allerdings Firmen, die Campingwagen individuell aus- und umbauen. Vielleicht ist das der nächste Schritt – eine kleine Sitzdusche ohne Überschwemmungsgefahr. Außerdem kann ich leider nicht eigenständig meinen Rollstuhl aus dem Bus heben, wenn wir irgendwo ankommen und in den Bus heben, wenn wir wieder weiterfahren. Das macht aktuell netterweise mein (nahezu) perfekter Freund. Wenn man den Freund aber nicht immer dafür einspannen will, sondern einfach nur auf einen Knopf drücken möchte, gibt es eine elektrische Hebebühne, die man einbauen kann. Und falls ich mal nicht mehr nur Beifahrerin in unserem himmelblauen Freiheitsmobil sein will: Man kann fast alle Autos auf Handgasbetrieb umbauen lassen! Handgas hin oder her – wir waren jedenfalls letzte Woche wieder unterwegs. Auf einem wunderschönen Naturcampingplatz in Mecklenburg-Vorpommern. Mit Seeblick. Aber ohne Gartenzwerg! Experten-Interview im Podcast zum Thema „Camping mit Handicap und Rollstuhl“ Auch in unserem Podcast sprechen Nele und Sebastian über das Thema „Camping mit Handicap“ und haben unsere Autorin Anahita zu Gast. Im Gespräch geben sie Informationen und Tipps. Hör doch mal rein: [su_spacer size=“10″] [su_box title=“Das könnte dich auch interessieren“] Ein Leitfaden für das Reisen mit Rollstuhl Austausch, Infos und Hilfe für Camper und Reisende mit Behinderung Camping und Reisen mit Behinderung: Hürden abbauen, Bewusstsein schaffen Campingbranche, wir müssen reden – Lösungsansätze für mehr Barrierefreiheit Mutmachgeschichten aus dem Campingalltag: Unterwegs mit einem Sohn mit Behinderung Podcast: Camping mit Handicap und Rollstuhl – Interview mit Anahita Der Offroad-Rollstuhl von WHILL: Auf vier Rädern stylisch zum Strand Reha-Camper: Mehr Freiheit für Reisende im Rollstuhl Messe-Premiere: Barrierearmer Wohnwagen für Menschen mit Handicap Wohnmobil-Führerschein für Menschen mit Handicap – ist das möglich? [/su_box] Fotos: (c) Anahita Das könnte dich auch interessieren Endlich barrierefrei reisen: Entdecke die rollstuhlgerechten Wohnwagenumbauten von Brecht Caravan!Die Tür zur Eigenständigkeit- Adina und Timo haben ihren Wohnwagen barrierefrei umgebautMitcamper-Kolumne: Laktoseintoleranz und andere HandicapsDie Mitcamper-Kolumne Teil 2: Die Schweizer – unauffällig aufmerksamMitcamper-Kolumne: Die hilfsbereite Gabi von nebenanDer barrierefreie Campingplatz: Was braucht er und welche Fördermöglichkeiten gibt es?Wohnmobil-Führerschein für Menschen mit Handicap – ist das möglich?Der Offroad-Rollstuhl von WHILL: Auf vier Rädern stylisch zum StrandMutmachgeschichten aus dem Campingalltag: Unterwegs mit einem Sohn mit BehinderungGastbeitrag: Ein Leitfaden für das Reisen mit Rollstuhl Anahita BalaliLiebt Reisen mit viel Freiheit und wenigen Hindernissen und genießt seit letztem Jahr gemeinsam mit ihrem Freund Felix immer öfter das Leben im fast barrierefreien Mikrokosmos. Lieblingsspots: Frankreich, Costa Vicentina in Portugal, die schöne Eifel. Anahita Balali Liebt Reisen mit viel Freiheit und wenigen Hindernissen und genießt seit letztem Jahr gemeinsam mit ihrem Freund Felix immer öfter das Leben im fast barrierefreien Mikrokosmos. Lieblingsspots: Frankreich, Costa Vicentina in Portugal, die schöne Eifel. Dir hat der Beitrag gefallen? Dann teile ihn mit deinen Freunden! App - Post Subscribe Form Contact .form_field_62_item_sf { display: none!important; position: absolute!important; transform: translateX(1000%)!important; } Erhalte kostenlose Camping-Tipps und Infos per Mail!Anmeldenform.fluent_form_35 .wpf_has_custom_css.ff-btn-submit { background-color:#409EFF;border-color:#409EFF;color:#ffffff;min-width:100%; }form.fluent_form_35 .wpf_has_custom_css.ff-btn-submit:hover { background-color:#ffffff;border-color:#409EFF;color:#409EFF;min-width:100%; } Nach dem Absenden des Formulars bekommst du eine Mail mit einem Link, den du anklicken musst, um dich zum Newsletter anzumelden. Du bekommst dann 1-2 Mal im Monat E-Mails von uns zu Camping-Themen. Die Frequenz hängt von der Menge an News und Ratgebern im Monat ab. Du kannst deine Einwilligung jederzeit per E-Mail an post@camperstyle.de oder durch den sich in jeder Mail befindlichen Link widerrufen. Der Versand erfolgt gemäß unserer Datenschutzerklärung unter https://camperstyle.de/datenschutzerklarung/ window.fluent_form_ff_form_instance_35_1 = {"id":"35","settings":{"layout":{"labelPlacement":"top","helpMessagePlacement":"with_label","errorMessagePlacement":"inline","asteriskPlacement":"asterisk-right"},"restrictions":{"denyEmptySubmission":{"enabled":false}}},"form_instance":"ff_form_instance_35_1","form_id_selector":"fluentform_35","rules":{"email":{"required":{"value":true,"message":"This field is required"},"email":{"value":true,"message":"This field must contain a valid email"}}},"debounce_time":300}; + +