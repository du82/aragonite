["https://camperstyle.de/adina-timo-wohnwagen-barrierefrei"]
title = "Die Tür zur Eigenständigkeit- Adina und Timo haben ihren Wohnwagen barrierefrei umgebaut - CamperStyle"
description = """
Liebt Reisen mit viel Freiheit und wenigen Hindernissen und genießt seit letztem Jahr gemeinsam mit ihrem Freund Felix immer öfter das Leben im fast barrierefreien Mikrokosmos.
Lieblingsspots: Frankreich, Costa Vicentina in Portugal, die schöne Eifel."""
full_description = 'Camping mit Handicap > Die Tür zur Eigenständigkeit- Adina und Timo haben ihren Wohnwagen barrierefrei umgebaut Anahita Balali | 22.01.2023 Die Tür zur Eigenständigkeit- Adina und Timo haben ihren Wohnwagen barrierefrei umgebaut Camping mit HandicapCampergesprächeCamperleben Camping mit Handicap Unsere Autorin Anahita ist leidenschaftliche Camperin. Mit Van, Partner und Rollstuhl geht sie in Deutschland und den europäischen Nachbarländern auf Entdeckungstour. Heute stellt sie uns Adina und Timo von Mobilista vor. Die beiden haben ihren Wohnwagen rollstuhlgerecht umgebaut und Anahita hat sie dazu und zu anderen Themen befragt. Am Anfang Timo hatte bereits viele Jahre Campingerfahrung, als er sich in Adina verliebte. In dem Moment musste er campingtechnisch jedoch noch mal umdenken. Adina hat nämlich nicht nur wunderschöne lange braune Haare, sondern auch einen Rollstuhl. Adina hat eine angeborene Muskelerkrankung, aufgrund derer sie die meiste Zeit im Rollstuhl sitzt. Kleine Distanzen kann sie allerdings auch zu Fuß gehen. Der Rollstuhl sollte einem gemeinsamen Campingerlebnis nicht entgegenstehen, fand Timo. Es musste „einfach“ ein barrierefreier Wohnwagen her. Rollstuhlgerechte Camper und Wohnwagen sind allerdings leider rar gesät. Von der Stange gibt es sie jedenfalls nicht. Und der Gebrauchtmarkt sieht auch mau aus, denn „wer einmal einen umgebaut hat, gibt ihn nicht mehr her“, sagt Timo von mobilista.eu. Da die Beiden aber unbedingt ein kleines gemeinsames Zuhause auf Rädern haben wollten, machten sie sich auf die Suche nach einem geeigneten Wohnwagen, der zumindest irgendwie umbaufähig sein sollte. „Campen war nicht immer mein Thema, aber etwas Eigenes zum Zurückziehen wollte ich auch gern haben“, berichtet Adina. Ihre halbe Kindheit hat sie im Ferienhäuschen ihrer Familie an der Mecklenburgischen Seenplatte verbracht. Ein eigener Platz im dazugehörigen Garten, ein gemütlicher Rückzugsort bei turbulenten Familienfeiern, schien ihr eine sehr gute Idee zu sein. Das Wichtigste bei der Suche nach einem geeigneten Wohnwagen war neben dem Grundriss, dass der Wohnwagen die baulichen Voraussetzungen haben musste, um eine breite Tür einzubauen, eine Tür, die breit genug für den Rollstuhl war. Nach langer Recherche fanden Adina und Timo einen alten LMC, Baujahr 1999, einen „Lord Ambassador“. LMC steht für Lord Münsterland Caravan und ist ein Unternehmen mit Sitz in Nordrhein-Westfalen. Der „Lord“ war zwar noch ganz und gar nicht rollstuhlgerecht, aber er hatte ideale Voraussetzungen, um es irgendwann zu werden. Und dann Da stand er nun der „Kleine Lord“, wie Adina und Timo ihn mittlerweile nennen, aber rein kam Adina mit ihrem Rollstuhl leider noch lange nicht. Die Suche ging also weiter. Diesmal die Suche nach einer breiten Tür. „Wir suchten einen Unfallwagen, bei dem man die Tür ausbauen kann“, berichtet Timo. „Die Firma LMC hat im Jahr 2010 eine Wohnwagen-Rollstuhl-Reihe entwickelt, bei der breite Türen Standard waren“. Ein passender Unfallwagen war jedoch nicht zu finden. Schließlich fanden Adina und Timo die perfekte Tür! „Eine einzige alte Ersatztür war noch da!“, so Timo, irgendwo im Ersatzteillager dieser alten Wohnwagen-Reihe. Zur perfekten Tür kam nun noch der perfekte Umbauer. „Der Werkstattmensch war früher Tischler, und anscheinend hatten wir seinen Ehrgeiz getriggert“, erzählt Timo. „Die Lorbeeren (…) gebühren (…) der Werkstatt, die eine verbreiterte Tür eingebaut und dafür sogar Möbel umgebaut hat“, sagt Timo. „Die Sitzbank wurde verschmälert, das TV-Regal neben der Tür wurde verkleinert.“ So konnte Adina endlich mit ihrem Rollstuhl in den Wohnwagen kommen. Ein entscheidender Schritt in Richtung Camping-Eigenständigkeit war getan! Da am Fahrgestell des Wohnwagens übrigens nichts verändert wurde, war laut Timo die TÜV-Abnahme der Tür „kein Thema“. Und schließlich Ein klitzekleiner Schritt fehlte noch, um es Adina zu ermöglichen, in den Wohnwagen hinein und später auch wieder herauszukommen. Der Abstand zwischen Erdboden und Wohnwagen-Boden musste für Adina überwindbar gemacht werden. Die Beiden besorgten sich also eine mobile Rampe, die sie immer dabei hatten, wenn sie mit dem Wohnwagen unterwegs waren. Über diese konnte Adina dann ohne Hilfe hinein und heraus. Allerdings brauchte sie Hilfe beim Montieren und Ab-Montieren der Rampe. Ganz allein hätte Adina also noch nicht campen können. Da die Rampe sowieso – also auch für Nicht-Rollstuhlfahrer Timo- „nicht gut abnehmbar“ war, entschieden sich Adina und Timo, nicht mehr immer unterwegs zu sein, sondern „Dauercamper“ in Omas Garten zu werden. Sie suchten sich einen schönen Platz und bauten sich vor ihren Wohnwagen ein tolles großes Podest mit fester Rampe. Dieses Podest fungiert jetzt als wunderbare Sonnenterrasse und zugleich – ganz nebenbei – als barrierefreier Weg in den Wohnwagen. Und so war Adinas völlige Eigenständigkeit als Camperin geboren! „Wir sind selbst besonders stolz auf das Podest mit Rampe, das das gemütliche Draußensitzen und Reinfahren für Adina ermöglicht“, erzählt Timo. „Da unser Wohnwagen fest in der Mecklenburgischen Seenplatte steht, nutzen wir ihn insbesondere in den wärmeren Monaten häufig über das Wochenende. Von Berlin aus sind es etwas über zwei Fahrstunden mit dem Auto dorthin, sodass wir dort gern weit draußen die Natur und Abgeschiedenheit geniessen.“ Und Adina schwärmt: „Ich kann dank Podest in den Wohnwagen hereinfahren, bequem am Tisch sitzen, und mit dem Rollstuhl tatsächlich bis ans Bett fahren. Das liegt nicht nur am Umbau, sondern auch an dem spannenden Grundriss unseres Wohnwagens, der den Umbau erstmal ermöglicht hat – und ich kann mich darin sogar mit Rollstuhl drehen.“ Und so wurden Adina und Timo glückliche Camper – ganz seßhaft in Omas Garten. Fotos: © mobilista.eu Das könnte dich auch interessieren Alle Artikel zum Thema Camping mit HandicapKostenlos zur „Reise + Camping“ in Essen: So sicherst du dir deine Tickets für die Camping-Messe!Campingmessen 2025 – alle Term