full_description = 'Camping-Ausrüstung > Carawater Wasserfiltersysteme für mehr Autarkie und Nachhaltigkeit im Wohnmobil Sebastian Vogt | 03.03.2025 Carawater Wasserfiltersysteme für mehr Autarkie und Nachhaltigkeit im Wohnmobil Camping-AusrüstungSanitär & HygieneTrinkwasserZubehör Camping-Ausrüstung Sauberes Wasser im Wohnmobil ist essenziell für Gesundheit, Komfort und Unabhängigkeit unterwegs. Ob beim Freistehen in der Natur oder auf einem Campingplatz: Die Qualität des Wassers entscheidet darüber, ob man unbesorgt trinken, kochen und duschen kann. Carawater ist ein Wasserfiltersystem, das sowohl im Sinne der Autarkie als auch im Sinne der Nachhaltigkeit eingesetzt werden kann. Es ist laut Angaben des Herstellers in der Lage, Wasser an Bord eines Reisemobils fünfmal zu 99,99 Prozent aufbereiten zu können. Das Carawater Wasserfiltersystem gewährleistet durch den Einsatz modernster Filtertechnologien sauberes Wasser von der Befüllung bis zur Entnahme. Hohe Durchflussmengen, effiziente Filtration und eine lange Nutzungsdauer stehen dabei im Vordergrund. InhaltsverzeichnisAUTARX-SystemFILTRADOC-SerieUV-C LED DesinfektionPreis und Verfügbarkeit AUTARX-System Technisch ist das Wasserfiltersystem von Carawater so aufgebaut, dass es aus fünf Filtern besteht, die – beginnend mit Feststoffen – das Wasser immer feiner durchsieben. Naturgemäß braucht es dafür eine stärkere Wasserpumpe, um das Brauchwasser in das Filtersystem einspeisen zu können. Sie wird nach dem ersten Filter installiert, der alle Festbestandteile bindet und damit auch ein Verstopfen der Wasserpumpe verhindert. Anschließend folgen eine Aktivkohle-, Membran-, Kalk- und UVC-Filtration. Es handelt sich dabei um einen Prozess, bei dem immer kleinere Partikel ausgefiltert werden. Am Schluss werden mit UV-Licht die letzten Keime zerstört. Das AUTARX-System von Carawater ermöglicht also die Wiederaufbereitung von Grauwasser zu Trinkwasserqualität, sodass der Frischwassertank bis zu zehnmal genutzt werden kann, ohne sich um die Wasserqualität sorgen zu müssen. Es durchläuft einen fünfstufigen Filtrationsprozess: Externer Sedimentfilter: Entfernt grobe Verunreinigungen; der transparente Filtergehäuse ermöglicht eine visuelle Überprüfung und einfache Reinigung oder Austausch des Filtereinsatzes. Aktivkohlefilter: Entfernt etwa 99 Prozent des freien Chlors, chlorhaltige Lösungsmittel, aromatische Substanzen, Pestizide und andere organische Verbindungen größer als 5 Mikrometer, was zu besserem Geschmack und Geruch des Wassers führt. Niederdruckmembran: Mit einer Porengröße von 0,0001 Mikrometern werden Partikel, die größer als Wassermoleküle sind, zurückgehalten und ins Abwasser geleitet, während sauberes Wasser durchgelassen wird. Weiterer Aktivkohlefilter: Zusätzliche Reinigung des gefilterten Wassers vor dem Eintritt in den Frischwassertank. Keimsperre: Eine Membran dient als Barriere gegen Mikroorganismen und gewährleistet höchste Wasserqualität. Ein im System integrierter Durchflussmesser zeigt das gefilterte Wasservolumen an und signalisiert, wann eine Spülung oder ein Filterwechsel erforderlich ist. Die Spülung erfolgt mit etwa 20 Litern sauberem Wasser nach der Filtration von 600 bis 1.000 Litern, abhängig vom Modell. Der Filterwechsel ist nach 6.000 bis 10.000 Litern notwendig, wobei die Filter zwei bis fünf in einer Einheit untergebracht werden können (Filtradoc Highflow L) und laut Hersteller je nach Größe bis zu 60.000 Liter Durchlauf ermöglichen. Bei Befüllfilter vor der Pumpe werden bis zu 12.000 Liter angegeben. Das AUTARX-System ist in verschiedenen Varianten erhältlich: Basic: Leistung von bis zu 15 Litern pro Stunde, kompakte Abmessungen von 41 x 22,5 x 12 cm. MaxFlow: Leistung von bis zu 30 Litern pro Stunde, gleiche Abmessungen wie das Basic-Modell. Plus: Leistung von bis zu 60 Litern pro Stunde, Abmessungen von 45 x 25,5 x 14 cm. FILTRADOC-Serie Für die Filtration von Frischwasser bietet Carawater die FILTRADOC-Serie in drei Größen an: S-Version: Dreistufige Filtration mit einer Kapazität von bis zu 4,8 Litern pro Stunde; Filterwechsel alle 12.000 Liter. M-Version: Kapazität von bis zu 7 Litern pro Stunde; Filterwechsel nach 30.000 Litern. L-Version: Kapazität von bis zu 9,5 Litern pro Stunde; Filterwechsel nach 60.000 Litern. Die Filtration umfasst Sedimentfilterung, Aktivkohlefilterung zur Entfernung von Chlor, organischen Verbindungen, Schwermetallen, Arzneimittelrückständen und Mikroplastik sowie eine Ultrafiltration mit einer 99,9999 prozentigen Reduktion von Bakterien wie E. coli und Legionellen. UV-C LED Desinfektion Zusätzlich bietet Carawater mit der FILTRADOC UV-C LED eine Wasserdesinfektionseinheit an, die modernste UV-C LED Technologie nutzt, um Keime und Bakterien effektiv abzutöten und somit die Wasserqualität weiter zu erhöhen. Die Carawater Filtersysteme sind darauf ausgelegt, ohne den Einsatz von chemischen Hilfsmitteln zu arbeiten, was sie zu einer umweltfreundlichen und nachhaltigen Lösung für Reisende macht, die Wert auf sauberes und sicheres Wasser legen. Preis und Verfügbarkeit Carwater kostet je nach System zwischen 1.800 und 2.500 Euro. Weitere Informationen und Bestellmöglichkeiten finden sich auf: carawater.de Bildmaterial: (c) Stefan Blanz Das könnte dich auch interessieren Alle Artikel zum Thema Camping-AusrüstungDas brauchst du wirklich beim ersten Wohnmobilurlaub – Essentials für Camping EinsteigerWarme Getränke unterwegs: Der beste ThermobecherThese Omnia accessories ensure a varied camping kitchen on the goCes accessoires Omnia permettent de varier la cuisine de camping en cours de routeDeze Omnia accessoires zorgen voor een gevarieerde kampeerkeuken op reisDieses Omnia-Zubehör sorgt unterwegs für eine abwechslungsreiche CampingkücheEstos accesorios Omnia garantizan una cocina de camping variada cuando viajasÜber 70 Geschenke für Camper: Ideen & Inspirationen für Geburtstag, Weihnachten & Co.Wintercamping: Tipps und Ausrüstung für entspannte Tage im SchneeMegasat Produktneuheiten (2025) 