full_description = 'Fahrzeugzubehör > EMUK Hebekissen Air-Lift (2024) – Druckluftkissen zum Ausnivellieren von Wohnmobil und Wohnwagen Sebastian Vogt | 07.10.2024 EMUK Hebekissen Air-Lift (2024) - Druckluftkissen zum Ausnivellieren von Wohnmobil und Wohnwagen FahrzeugzubehörSicherheit Fahrzeugzubehör Das EMUK Hebekissen Air-Lift, vorgestellt auf dem Caravan Salon 2024, ist ein hochbelastbares, verschleißfestes, benzin-, öl- und säurefestes Druckluft-Hebekissen, welches speziell für Wohnmobile und Wohnwagen entwickelt wurde. Das deutsche Unternehmen EMUK (Edelstahl-Metall-Universal-Konfektion) hat sich primär auf die Herstellung von hochwertigen Wohnwagen- und Anhängerspiegeln spezialisiert. Neben diesen Spezial- und Universalspiegeln bietet EMUK auch diverses Zubehör für Wohnmobile, Caravans und Anhänger an. Produkte wie das EMUK Air-Lift Druckluftkissen sind für ihre hohe Qualität und Langlebigkeit bekannt und werden von Camping-Enthusiasten und Caravan-Fahrern genutzt, um die Sicherheit und den Komfort auf Reisen zu erhöhen. Die wichtigsten Eigenschaften des EMUK Hebekissen Air-Lift Alle Bodenunebenheiten und Höhenunterschiede des Untergrundes können stufenlos von 1,5 cm bis 20 cm ausgeglichen werden. Die Tragkraft des EMUK Air-Lift beträgt 11 Tonnen und schlägt dabei alle bisherigen Bestwerte im Vergleich mit herkömmlichen Ausgleichskeilen. Die Handhabung ist dabei äußerst mühelos und komfortabel. Das Kissen wird einfach unter dem jeweiligen, anzuhebenden Rad platziert. Mit einer Hand-/ Fußpumpe oder einem 12 V Minikompressor kann das Gefährt innerhalb von circa 4 Minuten auf engstem Rangierraum ausnivelliert werden. Die Herstellung des EMUK Air-Lift erfolgt in Manufaktur „Made in Germany“ mit hochwertigsten Materialien in sauberster handwerklicher Qualität. Pulverbeschichtete leichte Aluminiumleisten stabilisieren dabei den mit hochfesten Aramidfasern verstärkten Gummi-Druckkörper. Eine besonders dicke Gummihaut (Sandwichbauweise) verleiht dem Druckluftkissen ausreichenden Schutz gegen äußere Einwirkung durch Steine, Geröll oder Scherben. Das Riffelprofil bietet den anzuhebenden Rädern rutschfesten Halt. EMUK Hebekissen Air-Lift: Technische Daten Abmaße: 48 x 43 x 2 cm Gewicht: 3,6 kg Tragkraft: 11 t bei 6 bar Maximale Höhe: 20 cm Minimale Höhe, unaufgeblasen: 1,5 cm Volumen, unaufgeblasen: 3,6 Liter Befüllen & Entlüften: 1 Autoventil Drucktest geprüft: 48 h bei 5 bar Temperatureinsatz: -20 °C bis +60 °C Passend für Reifenbreiten bis 285 mm Weitere Informationen Alle Informationen zum Produkt sowie Bestellmöglichkeiten finden Interessenten auf der Website des Herstellers: www.emuk.com infoUnsere Berichte von der Messe findest du hier: CamperStyle beim Caravan Salon. Einige der Fahrzeugvorstellungen enthalten 360°-Aufnahmen. So kannst du virtuell im Fahrzeug stehen, dich umschauen und erhältst einen realistischeren Einblick in den Grundriss. Fotos: (c) Jalil Landero Flores Das könnte dich auch interessieren Alle Artikel zum Thema FahrzeugzubehörWarntafeln für Wohnmobile und Wohnwagen in EuropaGPS-Tracker für Camper: Endlose Reiserouten-Aufzeichnung und mehr Sicherheit – 10% beim Kauf sparen!E-Trailer App (2025) – Der komplette Überblick über alle Systeme im Wohnmobil oder WohnwagenBliss Mobil 8 Foot (2025) – Expeditionskabine für Offroad-EnthusiastenAL-KO PROSAFE Radkralle – Professioneller Diebstahlschutz für deinen WohnwagenWebasto Air Top Pro 25 – Leise und kraftstoffsparende Standheizung für Mini-Vans und CamperAL-KO LevelM Pro (2024) – Flexibles und leichtes Hydrauliksystem für WohnmobileNeuheiten 2024 von SpaceCamper: Innovative Dachkonstruktionen und modulare AusbausystemeNeuheiten Caravan Salon 2024: SpaceCamper Roof – Bahnbrechendes Dachzelt und Aufstelldach in einemNeuheiten Caravan Salon 2024: Erstes hydraulisches Stützensystem speziell für Kastenwagen – LevelVan von AL-KO Sebastian VogtIch bin der Nerd im Team. Ich habe 6 Jahre mit meiner Frau im Wohnmobil gelebt und bin damit durch Europa gereist. Dabei haben wir nach und nach unsere drei Hunde gerettet und mitgenommen. Ich liebe Technik, Gadgets und kümmere mich bei CamperStyle um genau diese Themen. Unseren Clouliner haben wir verkauft und derzeit sind wir eher Wochenendcamper. Als digitaler Nomade bin ich immer wieder auf Reisen. Lieblingsspots: Am Wasser. Sebastian Vogt Ich bin der Nerd im Team. Ich habe 6 Jahre mit meiner Frau im Wohnmobil gelebt und bin damit durch Europa gereist. Dabei haben wir nach und nach unsere drei Hunde gerettet und mitgenommen. Ich liebe Technik, Gadgets und kümmere mich bei CamperStyle um genau diese Themen. Unseren Clouliner haben wir verkauft und derzeit sind wir eher Wochenendcamper. Als digitaler Nomade bin ich immer wieder auf Reisen. Lieblingsspots: Am Wasser. Dir hat der Beitrag gefallen? Dann teile ihn mit deinen Freunden! App - Post Subscribe Form Subscribe Erhalte kostenlose Camping-Tipps und Infos per Mail!Anmeldenform.fluent_form_35 .wpf_has_custom_css.ff-btn-submit { background-color:#409EFF;border-color:#409EFF;color:#ffffff;min-width:100%; }form.fluent_form_35 .wpf_has_custom_css.ff-btn-submit:hover { background-color:#ffffff;border-color:#409EFF;color:#409EFF;min-width:100%; } Nach dem Absenden des Formulars bekommst du eine Mail mit einem Link, den du anklicken musst, um dich zum Newsletter anzumelden. Du bekommst dann 1-2 Mal im Monat E-Mails von uns zu Camping-Themen. Die Frequenz hängt von der Menge an News und Ratgebern im Monat ab. Du kannst deine Einwilligung jederzeit per E-Mail an post@camperstyle.de oder durch den sich in jeder Mail befindlichen Link widerrufen. Der Versand erfolgt gemäß unserer Datenschutzerklärung unter https://camperstyle.de/datenschutzerklarung/ window.fluent_form_ff_form_instance_35_1 = {"id":"35","settings":{"layout":{"labelPlacement":"top","helpMessagePlacement":"with_label","errorMessagePlacement":"inline","asteriskPlacement":"asterisk-right"},"restrictions":{"denyEmptySubmission":{"enabled":false}}},"form_instance":"ff_form_instance_35_1"