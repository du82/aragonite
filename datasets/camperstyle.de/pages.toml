["https://camperstyle.de/barrierefreier-campingplatz"]
title = "Barrierefreier Campingplatz: Bedeutung & Fördermöglichkeiten"
description = """
Liebt Reisen mit viel Freiheit und wenigen Hindernissen und genießt seit letztem Jahr gemeinsam mit ihrem Freund Felix immer öfter das Leben im fast barrierefreien Mikrokosmos.
Lieblingsspots: Frankreich, Costa Vicentina in Portugal, die schöne Eifel."""
full_description = "Camping mit Handicap > Der barrierefreie Campingplatz: Was braucht er und welche Fördermöglichkeiten gibt es? Anahita Balali | 29.10.2020 Der barrierefreie Campingplatz: Was braucht er und welche Fördermöglichkeiten gibt es? Camping mit Handicap Camping mit Handicap Wo ist er, der barrierefreie Campingplatz? Und noch wichtiger: Wie ist er? Für mich muss ein Campingplatz vor allem eins haben: eine barrierefreie Dusche und eine barrierefreie Toilette. Und außerdem muss er direkt am Wasser sein. Und zwar so, dass ich alleine rein und raus kann. Und die frischen Brötchen, die will ich morgens alleine in der platzeigenen Kaffeebude abholen können. Und an der Rezeption möchte ich fragen können, wo es barrierefreie Wanderwege oder frischen Fisch gibt. Ich will so eigenständig sein wie möglich. Ob die Wege holprig sind, ob es mal steil bergauf und bergab geht, oder ob vor dem Spülbecken eine kleine Schwelle ist, ist für mich nicht so wichtig, da ich einen Rollstuhl mit elektrischem Zusatzantrieb habe. Dafür stören mich schwere Türen von Behindertentoiletten und Knöpfe an Duschen, die man feste drücken muss, damit Wasser raus kommt. Ich habe nämlich nicht nur schlappe Beine, sondern auch ziemlich unmuskulöse Arme. InhaltsverzeichnisWas braucht ein barrierefreier Campingplatz?Was heißt eigentlich „Barrierefreiheit“?FördermöglichkeitenBarrierefreie Campingplätze findenCampingverbändeFazit zum barrierefreien Campingplatz Was braucht ein barrierefreier Campingplatz? Doch wie muss der barrierefreie Campingplatz für Tom sein, der keinen elektrischen Zusatzantrieb an seinem Rollstuhl hat, dafür aber an den Armen Muskeln aus Stahl? Wie muss er für Laura sein, die gar keine Probleme mit den Beinen hat, dafür aber mit den Händen? Und was wünscht sich Jan, der eine starke Sehbehinderung hat? Die Handicaps sind vielfältig. Doch eins haben sie alle gemeinsam: sie halten ihre Besitzer nicht davon ab, campen zu wollen. Wir sind eben „Handicamper“, wie mein kleiner Neffe sagt. Was sich Camper mit Handicap beim Campen wünschen, hat meine Kollegin Tanja im Artikel „Camping und Reisen mit Behinderung“ schon ziemlich gut beschrieben. Camper mit Handicap wollen, wie jeder andere auch, einen entspannten Urlaub verbringen. Dazu gehört vor allem, dass wir nicht ständig wegen unseres Handicaps an Grenzen stoßen. Wir wollen, dass alles oder zumindest das meiste für uns erreichbar ist. Wir möchten ohne Hindernisse zur Rezeption, ins Restaurant und ins kleine Lädchen, um Olivenöl und Tomaten fürs Abendessen zu kaufen. Wir möchten auch morgens ohne Stolpersteine zum Schwimmbad, danach duschen und nachmittags an den See. Und am Liebsten hätten wir auch noch ein paar Tipps für barrierefreie Freizeitmöglichkeiten in der Nähe. Da aber die Grenzen je nach Handicap unterschiedlich ausfallen, ist es gar nicht so leicht, die Barrierefreiheit klar zu definieren. Foto: (c) Felix Huber Was heißt eigentlich „Barrierefreiheit“? Um zu verstehen, warum es auf manchen Campingplätzen eine wunderbare Toilette für Rollstuhlfahrer gibt, aber auf anderen nicht und warum der Begriff „barrierefrei“ anscheinend nicht immer dasselbe bedeutet, müssen wir ganz oben anfangen: Im Jahr 2006 verabschiedete die UNO-Generalversammlung in New York das Übereinkommen von Menschen mit Behinderung, kurz: die UN-Behindertenrechtskonvention. Der Leitgedanke lautet: Es ist normal, anders zu sein. Ziel ist „Barrierefreiheit“ auf allen Ebenen des gesellschaftlichen Miteinanders. Eine der vielen Vorschriften in Deutschland, mit denen versucht wird, dieses Ziel der Behindertenrechtskonvention umzusetzen, ist die „Verordnung über Camping- und Wochenendplätze Nordrhein-Westfalen“. In allen anderen Bundesländern gelten ähnliche Verordnungen. In § 7 der Verordnung heißt es, dass „alle baulichen Anlagen und sonstige Einrichtungen (…) barrierefrei erreicht und von Menschen mit Behinderung ohne fremde Hilfe benutzt werden können“ müssen. Aber was genau ist mit „barrierefrei“ gemeint? Bei öffentlich zugänglichen Gebäuden kann hier auf die DIN 18040-1 zurückgegriffen werden, für Beherbergungsstätten ist die Barrierefreiheit ausführlich in der DIN 18040-2 geregelt. Ziel dieser Normen ist die Barrierefreiheit baulicher Anlagen, damit sie für Menschen mit Behinderung in der allgemein üblichen Weise, ohne besondere Erschwernis und grundsätzlich ohne fremde Hilfe zugänglich und nutzbar sind. Berücksichtigt werden die Bedürfnisse von Menschen, mit Sehbehinderung oder Hörbehinderung mit motorischen Einschränkungen, die Mobilitätshilfen und Rollstühle benutzen die großwüchsig oder kleinwüchsig sind mit kognitiven Einschränkungen die bereits älter sind wie Kindern mit Kinderwagen oder Gepäck Für Barrierefreiheit auf Campingplätzen gibt es leider keine klare Regelung. Campingplatzbetreiber, die ihren Platz barrierefrei gestalten wollen, halten sich deshalb in der Regel an die DIN 18040-1 und -2. Besser gesagt: Sie halten sich an die Vorgaben der DIN in Bezug auf Menschen mit motorischen Einschränkungen, die Mobilitätshilfen und Rollstühle benutzen. Ab und zu werden auch Menschen mit Seh- oder Hörbehinderung berücksichtigt. Leider viel zu selten. Das musste ich bei meiner Recherche für diesen Artikel feststellen. Wenn sich ein Campingplatz „barrierefrei“ nennt oder über „barrierefreie Sanitäranlagen“ verfügt, ist damit immer gemeint, dass er lediglich „barrierefrei“ für Menschen mit Gehbehinderung ist. Aber immerhin. Stück für Stück werden hoffentlich künftig immer mehr Barrieren abgebaut, so dass sich auch Menschen mit Seh- oder Hörbehinderung oder anderen Handicaps möglichst frei auf Campingplätzen bewegen können. Im weiteren Text bedeutet „Barrierefreiheit“ darum „Barrierefreiheit für Menschen mit Gehbehinderung“. Die Maßnahmen, die zur Barrierefreiheit führen, sind umfangreich und von einem Otto-Normal-Campingplatzbetreiber kaum finanziell zu stemmen. Fotos: (c) Felix Huber Fördermöglichkeiten In der Regel beantragen Betreiber deshalb eine finanzielle Förderung für den Um- oder Neubau ihres Platzes. Im Rahmen der Beantragung der Baugenehmigung wird der so genannte Behindertenbeirat eingeschaltet. Dieser besteht aus Vertretern von Verbänden, Selbsthilfegruppen, der Behindertenbeauftragten, aus Vertretern des Sozialministeriums, der Agentur für Arbeit, der gesetzlichen Krankenkassen, der Deutschen Rentenversicherung, des Integrationsamtes und aus Ärzten. Der jeweilige Landes-Behindertenbeirat überprüft das Bauvorhaben und stimmt erst zu, wenn der gesamte Plan barrierefrei ist. Das Förderprogramm zur Schaffung von Barrierefreiheit in gewerblichen touristischen Unternehmen beispielsweise, fördert mit Mitteln des Europäischen Fonds für regionale Entwicklung folgende Maßnahmen in Hotels und auf Campingplätzen: Um- und Ausbau von Sanitärräumen, Türverbreiterung sowie Neuanschaffung und Um- und Einbau barrierefreier Eingangs- /Durchgangstüren, Anschaffung/Bau/Einbau von Rampen, eines Treppen- oder Hubliftes, einer Hebebühne oder eines Aufzugs, Anschaffung/Einbau geeigneter Möbel, sowohl für Gemeinschaftsflächen (z.B. Empfang, Gastronomischer Bereich, Wellnessbereich) als auch für die barrierefreien Zimmer, Einbau von optischen Blink- oder Warnsignalen sowie Notsignalgebern in Gemeinschaftsräumen und Zimmern, Anschaffung einer induktiven Höranlage, Anschaffung und Einbau taktil erfassbare bzw. akustisch abrufbarer Orientierungshilfen und Leitsysteme und vieles mehr. Bei meinem letzten Urlaub kamen wir durch Zufall auf einen Campingplatz mit grade neu gebautem Sanitärgebäude. Die Farbe war noch nicht trocken, die Handwerker schraubten noch hier und da an etwas herum. Das war meine Chance. „Entschuldigung!“ sagte ich zu einem Herrn, der aussah, als hätte er was zu sagen. „Wie schön, dass Sie so eine tolle neue Rolli-Toilette haben. Das ist nicht selbstverständlich. Leider kriege ich die Tür nicht allein auf. Vielleicht könnte man die noch ein bisschen leichter einstellen …“. Sofort trommelte er die ganze Mannschaft zusammen und lies mich vorführen, dass es unmöglich war, diese schwere Tür vom Rollstuhl aus zu öffnen. Alle waren baff erstaunt. „Danke, dass Sie uns das mal zeigen!“, sagte einer der Handwerker zu mir. „Man kann sich das ja gar nicht vorstellen, wo die Probleme sind.“ Die Tür wurde umgehend anders eingestellt, und meine Nachfolger haben sich hoffentlich gefreut. Etwas verwundert war ich allerdings im gleichen Urlaub auf einem anderen Platz über eine Rollstuhltoilette, die abgeschlossen war. Normalerweise steht dann auf einem Schild, dass die Tür mit dem so genannten Euroschlüssel zu öffnen ist oder man sich den Schlüssel an der Rezeption holen kann. Hier stand nichts. Statt dessen kam die Campingplatzbesitzerin im Laufschritt auf mich zu gerannt. „Es tut mir leid. Ich musste dieses barrierefreie Bad bauen. Sonst hätte ich keine Zuschüsse für meinen Platz bekommen. Da ich aber selbst in einem alten Wohnwagen hier auf dem Platz wohne, habe ich mir das hier als mein Privatbad eingerichtet. Wenn Du willst, können wir uns das gern teilen. Sonst kommt ja nie jemand mit Rollstuhl …„. Da wir nur eine Nacht bleiben wollten und eine eigene Toilette an Bord haben, war ich ganz entspannt und habe ihr gern ihr Privatbad zur alleinigen Nutzung überlassen. Aber ein wenig schmunzeln musste ich schon. Foto: (c) Felix Huber Barrierefreie Campingplätze finden Am Anfang der Vorbereitung können Seiten im Netz helfen, auf denen barrierefreie Plätze aufgelistet sind, zum Beispiel das ADAC-Campingplatzportal PiNCAMP – hier kannst du nach „Sanitärkabine für Rollstuhlfahrer“ filtern. Außerdem ist bei jedem Campingplatz der Bereich „Barrierefreiheit“ zu finden und du kannst viele der Plätze sogar direkt buchen. Oder du schaust auf speziellen Plattformen für barrierefreie Unterkünfte, wie zum Beispiel barrierefreie-campingplaetze.de oder barrierefreie-urlaubswelt.de/unterkuenfte/campingplatz. Einige Beispielplätze Der Campingplatz CAP-Rotach (Friedrichshafen, Baden-Württemberg) wurde uns von einer Leserin ganz besonders empfohlen. Hier sind Platzgelände und Einrichtungen barrierefrei gestaltet und es gibt mehrere Sanitärkabinen für Rollstuhlfahrer. Leider habe ich ihn noch nicht selbst getestet, aber das kommt noch! Auf dem Camping am Hohen Hagen (Dransfeld, Niedersachsen – neuer Name: Regenbogen Dransfeld) gibt es besondere integrative Services für Familien mit pflegebedürftigen Angehörigen oder andere Gäste mit Handicap, z.B. können ein örtlicher Pflegedienst oder ein Rollstuhl-Reparaturservice in Anspruch genommen werden. Besonders idyllisch und naturnah ist der Familien-Campingplatz Pommernland (Zinnowitz, Mecklenburg-Vorpommern): Neben einem separaten Sanitärraum für Rollstuhlfahrer mit barrierefreier Dusche, Duschsitz und Duschhocker sowie Haltegriff und Handlauf, gibt es auch noch zwei rollstuhlgerechte Ferienhäuser. Darüber hinaus stellt der Platz bei Bedarf diverse Hilfsmittel wie Hebegeräte oder Toilettensitzerhöhungen zur Verfügung. Der Campingplatz Hardausee (Suderburg/Hösseringen, Niedersachsen) bietet beheizte Sanitäranlagen mit behindertengerechten Waschbecken, Duschen und Toiletten sowie einer bewegungsmelderaktivierten Beleuchtung. Sanitäranlagen, gastronomische Einrichtungen und wesentliche Wege sind laut Betreiber auf dem Campingplatz Grüntensee (Wertach, Bayern) barrierefrei, ebenso auf dem Campingplatz Neuenhain (Neuental-Neuenhein, Hessen) Auf dem Campingplatz Hvijbjergstrand (Blåvand, Dänemark) ist man ebenfalls gut auf Gäste mit Handicap eingestellt: Gepflasterte Wege, auch am Strand, behindertengerechte Sanitärkabinen und rollstuhlgeeignete Zugänge zu den Restaurants schaffen Bewegungsfreiheit auf dem Platz. Besonders toll fand ich, dass auf der Webseite auch selbstkritisch darauf hingewiesen wird, was z.B. für Rollstuhlfahrer NICHT so gut funktioniert (Wellnessbereich, Erlebnisbad, „PlayCity“). Das hilft Betroffenen auf jeden Fall, sich vorher ein möglichst umfassendes Bild zu machen. Auf dem Camping Belvedere Idrosee (Idro, Italien) war ich selbst neulich. Ein absoluter Traum: Direkt am See gelegen, so dass ich die wenigen Meter mit dem Rolli von unserem Bus fast bis an Wasser fahren konnte. Ein barrierefreies Duschhäuschen Duschsitz, Toilette mit beidseitigen Haltegriffen, einer leichtgängigen Tür, einem unterfahrbaren Becken – und das alles tiptop sauber. Die Rezeption mit einer schön ins Gesamtkonzept integrierten Steinrampe nachgerüstet, daneben ein kleines Lädchen mit italienischen Köstlichkeiten und eine hübsche Bar, ebenfalls barriefrei. Und das Campingplatz-Personal konnte mir sogar noch Tipps zu barrierefreien Wanderwegen und Transportmöglichkeiten geben. Campingverbände Auf Bundesebene setzt sich außerdem der Bundesverband der Campingwirtschaft in Deutschland e.V.BVCD, kurz für mehr Barrierefreiheit auf Campingplätzen ein. Mit seinem Klassifizierungssystem schafft er einen Anreiz für Campingplatzbetreiber, ihren Platz barrierefrei zu gestalten. Im von den Betreibern auszufüllenden Klassifizierungsbogen geht es unter Punkt 2.19 um barrierefreie Sanitäreinrichtungen. Je barrierefreier der Platz ist, desto mehr Punkte sammelt man für einen extra Stern. Neben diesem allgemeinen Klassifizierungssystem existiert seit Kurzem außerdem ein neues Kennzeichnungssystem. In dem vom Bundesministerium für Wirtschaft und Energie geförderten Projekt hat das Deutsche Seminar für Tourismus Berlin ein umfangreiches Informations- und Bewertungssystem für verschiedene touristische Angebote entwickelt. Es trägt den großartigen Namen „Reisen für alle“. Dieses bundesweit einheitliche System ermöglicht es dem Gast, die Eignung des Angebots, zum Beispiel des Campingplatzes, eigenständig zu beurteilen. Ob ein Campingplatz barrierefrei ist oder nicht, bemisst sich in diesem System nicht nach der Selbsteinschätzung des Platzbetreibers, sondern wird von geschulten Erhebern beurteilt. Foto: (c) Anahita Fazit zum barrierefreien Campingplatz Obwohl es keine ganz klare gesetzliche Verpflichtung zur barrierefreien Campingplatzgestaltung gibt und nicht jeder Campingplatzbetreiber in den Genuss einer staatlichen Förderung gelangt, findet man mittlerweile auf immer mehr Campingplätzen barrierefreie Toiletten und Duschen, Rampen und tiefergelegte Rezeptionstresen. Um sich vor bösen Überraschungen zu schützen, sollte man aber auf jeden Fall gut vorbereitet auf Reisen gehen, am Besten mit einer auf die eigenen Bedürfnisse abgestimmten Checkliste: Was brauche ich? Was ist mir wichtig? Was muss ich den Campingplatzbesitzer vorab am Telefon fragen? Also, ran an die Vorbereitung, Checkliste abarbeiten und auf ins nächste Campingwochenende – selbst wenn es nur schnell „um die Ecke“ ist! [su_box title=“Das könnte dich auch interessieren“] Ein Leitfaden für das Reisen mit Rollstuhl Camping mit Handicap – geht das? Austausch, Infos und Hilfe für Camper und Reisende mit Behinderung Camping und Reisen mit Behinderung: Hürden abbauen, Bewusstsein schaffen Campingbranche, wir müssen reden – Lösungsansätze für mehr Barrierefreiheit Mutmachgeschichten "
