title = "Die Menschen hinter CamperStyle - CamperStyle"
description = "Die Idee zu CamperStyle entstand im August 2014, als Nele und Jalil im Rahmen eines halbjährigen Sabbaticals als absolute Anfänger mit ihrem Wohnwagen durch"
full_description = "Die Menschen hinter CamperStyle Die Idee zu CamperStyle entstand im August 2014, als Nele und Jalil im Rahmen eines halbjährigen Sabbaticals als absolute Anfänger mit ihrem Wohnwagen durch Europa reisten und – häufig vergeblich – nach Informationen für ihr neues Camperleben suchten. Eines Morgens, mitten im Baskenland, kam der Gedankenblitz: „Warum gründen wir nicht selbst eine Plattform für Leute wie uns?!“ Im Januar 2015 ging CamperStyle an den Start, zunächst als kleiner Blog, der von den beiden neben ihrer regulären Arbeit betrieben wurde. Doch schnell wurde klar: Das kann so nicht weitergehen. Die Leserschaft wuchs sprunghaft von Monat zu Monat, die ersten Partner klopften an und Nele und Jalil wollten vor allem eines: Die Welt erkunden und von unterwegs aus arbeiten. Also wurden die Jobs gekündigt und Unterstützung musste her. Als erste Autorinnen waren Tanja und Nima an Bord, kurz darauf gesellten sich Stefanie und Sebastian als Experten für Online-Marketing, Social Media und Technik dazu. Der Rest ist Geschichte. Heute, mit fast 2.000 veröffentlichten Artikeln, über einer Million Besuchern pro Monat, einem Podcast, einem eigenen Buch und einer starken Social-Media-Community ist CamperStyle eines der größten Camping-Onlinemagazine im deutschsprachigen Raum. Dahinter steht ein starkes und engagiertes Team, in dem jedes Mitglied seine ganz besonderen Fähigkeiten, Interessen, Vorlieben, Erfahrungen und Wissensgebiete einbringt. So gelingt es uns, jeden Tag vielseitige, bunte und hilfreiche Inhalte für Campingbegeisterte zu kreieren und dabei (fast) jeden Bereich des riesigen Themenfelds „Camping“ abzudecken. Im Folgenden erfährst du mehr über die Menschen, die CamperStyle zu dem machen, was es ist. Nele & Jalil Nele und Jalil Landero Flores sind Journalisten, Videoproduzenten und Fotografen, darüber hinaus Reisebegeisterte, Backpacker und vor allem eines: leidenschaftliche Camper! Mit ihrem Wohnwagen haben sie Road Trips durch 25 europäische Länder unternommen und waren fast vier Jahre auf Dauerreise. Wer einmal diese Freiheit gespürt hat, völlig ungebunden und manchmal sogar ziellos mit dem Camper durch die Lande zu ziehen, den lässt sie nicht mehr los. Doch der Traum vom Leben und Arbeiten unterwegs hat sie nicht nur an wunderschöne Orte geführt, sondern auch vor viele Herausforderungen gestellt. Dieses Wissen und die wertvollen Erfahrungen, die sie auf ihren Reisen sammeln konnten, teilen sie nun mit der CamperStyle-Community. Ob Tipps rund um die Technik und das Reisen im Caravan, tolle Campingplätze, nützliche Camping-Produkte, Checklisten für Einsteiger, Camping-Hacks oder das Campen mit Hund – Nele und Jalil sind echte (Cara)VanLifer. Apropos Hund: Seit Oktober 2016 gehört Zoe, ein frecher kleiner Parson-Russell-Terrier zu ihrer Camperfamilie. Sie mag zwar wie ein Stofftier aussehen, aber bei Pfützen, Maulwurfshügeln, Sand, und Wellen gibt es kein Halten mehr. Nicht umsonst trägt sie den Spitznamen „Matschprinzessin“. Mehr von CamperStyle und den Dreien gibt es auf Facebook, Instagram und in der Facebook-Anfängergruppe. Stefanie & Sebastian Stefanie und Sebastian Vogt sind mit gemeinsam über 20 Jahren Erfahrung als Unternehmer im Online-Marketing tätig. Gestartet als typische Nerds, haben sie irgendwann das Reisen für sich entdeckt – und zu ihrem ersten Wohnmobil kamen sie quasi „aus Versehen“. Aber das ist eine ganz eigene Geschichte… Die Vorteile des ortsunabhängigen Arbeitens haben jedenfalls ihr Fernweh so intensiviert, dass sie fast sechs Jahre im Wohnmobil lebten. Anfang 2016 ist in Portugal Herdenschutz-„Hündchen“ Chief zugestiegen, dessen Aufgabe im Bewachen und Bezaubern liegt – frei nach dem Motto: kannst Du sie nicht vertreiben, wickle sie um den Finger. In den Folgejahren kamen, ebenfalls ungeplant, noch Herdenschützerin Inge und Terriermischling Pepper dazu, was das unstete Reiseleben vorerst etwas einbremste. Mit den nun drei Hunden haben sich Stefanie und Sebastian auf einem hübschen Grundstück in Portugal niedergelassen und brechen von dort aus regelmäßig zu kleineren Campingtrips auf. Die Leidenschaft für den Camper-Lifestyle ist jedoch ungebrochen. So bringen die beiden ihr geballtes Know-How in die technische und strategische Weiterentwicklung von CamperStyle ein und bereichern den Content durch allerhand Wissenswertes rund um das Leben und Arbeiten auf vier Rädern. Besonders liegen ihnen Themen wie Autarkie, Technik und Digitalisierung im Wohnmobil, Internetlösungen für unterwegs und praktische Gadgets. Unser Redaktionsteam Sandra Sandra ist unsere „Allzweckwaffe“ und Neles rechte Hand: Als Redaktionsassistentin organisiert und pflegt sie den CamperStyle-Redaktionsplan, entwickelt gemeinsam mit uns neue Themenideen, koordiniert unsere Autorinnen und Autoren, korrigiert Tippfehler in unseren Artikeln, kümmert sich um die Moderation unserer Camping-Anfängergruppe bei Facebook und versorgt unsere Social-Media-Kanäle mit frischem Content. Natürlich ist sie auch begeisterte Camperin unterwegs und nutzt jede Gelegenheit, um mit ihrem Mann und ihren beiden Töchtern im Wohnwagen zu reisen – am liebsten nach Katalonien, wo sie früher mal eine Weile gelebt hat. Katja Freie Journalistin, freie Lektorin und freiheitsliebende Camperin. Nachdem sie sich entschied, ihre damalige, betriebswirtschaftliche Arbeitswelt zu verlassen, um sich auch beruflich ganz ihrer Leidenschaft – dem geschriebenen Wort – zu widmen, setzte sie sich erneut auf die Studienbank und machte sich anschließend als Journalistin und Lektorin selbstständig. Mit ihrem Wohnmobil ist sie am liebsten mit viel Zeit im Gepäck unterwegs und zieht vor allem in der Natur ihre Energie für den Alltag. Als ausgebildete Technikjournalistin erklärt sie unseren Leser:innen gerne die Welt der Technik im Wohnmobil und rund um den Wohnwagen. Mindestens genauso gerne aber schreibt sie über Produkte und Zubehör für das Camperleben sowie unterschiedliche Reiseziele – in ihrem Herzensland Norwegen sowie in Schweden, Finnland und Südfrankreich kennt sie sich dabei besonders gut aus. Die Welt des Campings ist ihr dabei nicht nur aus der Theorie vertraut, sie kann als Langzeitreisende hier auf praktische Erfahrungen zurückgreifen. Sie weiß deshalb, dass es sinnvoll sein kann, Kleinteile erst selbst zu zerlegen, statt direkt in die Werkstatt zu fahren – und dass mobil arbeitende Camper:innen manchmal auch aufs Dach steigen müssen, um eine E-Mail absenden zu können. Falls du mal eine Lektorin mit Adleraugen suchst: www.freie-lektorin.com Justyna Justyna, unsere Werkstudentin, vereint ihre Leidenschaft für Philosophie und Rechtswissenschaften mit dem Schreiben von präzisen und informativen Artikeln für unser Camping-Magazin. Ihr akademischer Hintergrund befähigt sie zu akribischer Recherche und analytischem Denken, was sich in ihren Newsartikeln und Fahrzeugvorstellungen widerspiegelt. Sie ergründet Themen gründlich und präsentiert Fakten klar und verständlich. Abseits des Schreibtischs teilt Justyna ihre Liebe zum Camping mit ihren zwei treuen Hunden. Sie verbringt ihre freie Zeit gerne in der Natur, erkundet Wanderwege und genießt das Zelten unter freiem Himmel. Diese Erfahrungen ermöglichen ihr ein tiefes Verständnis für die Bedürfnisse und Wünsche unserer Camping-Community. Inspiriert von ihrer Begeisterung für das Campingleben plant Justyna nach ihrem Studium eine aufregende Reise durch Europa. Dafür sucht sie noch nach dem idealen Campervan, um unabhängig und komfortabel zu reisen. Ihre anhaltende Neugierde und ihr Interesse für das Campingleben machen sie zu einer hervorragenden Anlaufstelle für alle Camper, die nach Inspiration und Informationen suchen. Hubert Seine „Camping-Karriere“ begann Hubert mit Zelt und Rucksack. Ob zum Surfen an den Gardasee oder zur Ost-West-Durchquerung Korsikas, er war oft im Mittelmeerraum unterwegs. Es folgten einige Jahre mit einem selbst umgebauten VW Bulli, dann mehrere Jahre mit Wohnmobilen, wobei vor allem Frankreich und Italien die bevorzugten Reiseziele waren. Vom Kastenwagen bis zum luxuriösen Integrierten waren alle Wohnmobiltypen vertreten. Seit einigen Jahren ist er mit SUV und Wohnwagen unterwegs, weil er heute mit Frau und Hund den Komfort eines Campingplatzes mit der Mobilität vor Ort schätzt. Sein beruflicher Werdegang führte ihn in die Verlagsbranche und als Journalist arbeitet er seit vielen Jahren für verschiedene Online-Plattformen aus dem Industrie- und Messebereich. Darüber hinaus liefert er Text- und Bildbeiträge für Wochenzeitungen, Regionalmagazine und einen Reiseführerverlag. Mit seinen Beiträgen für Camperstyle, die seiner Meinung nach vielseitigste Plattform für Camper:innen, bringt er Hobby und Beruf unter einen Hut.Mit seiner langjährigen Erfahrung interessieren ihn alle Themen rund ums Camping. Technik begeistert ihn ebenso wie Werterhaltung und Pflege der Fahrzeuge sowie Reisetipps, vor allem aus Deutschland und Frankreich.Weitere Informationen zu Hubert findest du unter: www.hunscheidt-textundmedien.de Barbara Barbara schreibt seit 2018 Artikel für CamperStyle. Bevor sie mit Mann und Hunden in die Normandie gezogen ist, hat sie als festangestellte Journalistin bei einer Tageszeitung gearbeitet. Hier in der Normandie verdient sie Baguette und Hundefutter als Texterin, Journalistin und (Hunde-)fotografin. Sie betreibt ein Informationsportal für Hundeurlauber:innen und hat einen Krimi geschrieben, der ebenfalls in der Normandie spielt. Neben Schreiben und Fotografieren begeistern sie das Wandern, die Natur, Bogenschießen und natürlich ihre beiden Hunde. Sie zeigt Urlauber:innen die schöne Normandie oder schmackhafte Kräuter für die Küche. Schon früh wurde sie mit dem Campingvirus infiziert – als Jugendliche bei einem Zeltlager, das in Regen, Matsch und Hagel versank. Seitdem war sie mit allem möglichen unterwegs, im Zelt, mit der Kastenente, lange mit einem Bulli (den sie immer noch vermisst), Wohnwagen und zur Zeit wieder mit Zelt oder Minicamper. Zu Barbaras Spezialthemen gehören Campen in Frankreich und Deutschland sowie Camping mit Hund. Tolle Urlaubstipps von Barbara für den Urlaub mit Hund in der Normandie gibt es hier: www.chiennormandie.de Außerdem kannst du Barbara auf Facebook und Instagram folgen. Tanja Tanja liebt das Reisen, die Natur und Roadtrips mit dem Wohnmobil. Seit mehr als 10 Jahren ist sie mit Mietwohnmobilen oder dem Familiencamper unterwegs. Als 2016 ihre zuckersüße Tochter Milana in Tanjas Leben trat, war dies der perfekte Anlass, um direkt auf Elternzeitreise zu gehen. Natürlich ebenfalls im Wohnmobil! Daher ist Tanja unsere Expertin für Reisen mit Kind, aber auch für ihre absoluten Lieblingsregionen: Skandinavien, das Baltikum, Kanada und Neuseeland, Österreich und die Berge, wo sie die landschaftliche Vielfalt ausgiebig mit dem Camper erkundet, in tollen Fotos festhält und viele Tipps und Eindrücke für unsere Leser:innen mitbringt. Auch auf ihrem eigenen Blog Taklyontour.de vereint Tanja ihre Liebe zum Reisen und Schreiben. Dort findest du zahlreiche Reisetipps, Erfahrungsberichte und Tourenvorschläge. Außerdem betreibt sie die Plattform Familienreisefieber.de, auf der sich Nicht-Camper:innen mit Kindern Inspirationen für Ausflüge, Wanderungen, Reisen, Kurztrips oder Freizeitaktivitäten holen können. Nima Das Campingfieber hat Nima erst mit 38 Jahren erfasst, dafür mit voller Wucht. Seit 2015 lebt sie mit ihrem Freund und zwei Hunden Vollzeit in einem Oldtimerbus namens “Horst”. Mit ihm sind die Vier im Süden Europas unterwegs, seit langer Zeit in Griechenland. Doch auch Spanien hat Nima über mehrere Jahre erkundet. Neben ihrer Begeisterung fürs Campen schlägt ihr Herz für Outdooraktivitäten wie Klettern oder Wandern und für Hunde. Besonders Straßenhunde sind ihr ein großes Anliegen. Als ausgebildete Hundetrainerin, Entspannungspädagogin sowie systemischer Coach arbeitet sie online mit Mensch-Hunde-Teams. Dabei unterstützt sie ihre Kund:innen, alltägliche Herausforderungen gelassen zu meistern. Ihr Schwerpunkt bei CamperStyle liegt auf Outdooraktivitäten, dem Reisen mit Hund sowie dem Campen in Griechenland. Durch ihre Griechischkenntnisse ist sie bestens mit Einheimischen vernetzt und mit den Gepflogenheiten des Landes vertraut, speziell bezogen auf das Camping sowie den Aufenthalt mit Vierbeinern. Du findest Nima auch bei Facebook und LinkedIn. Stefan Stefan ist gelernter Geisteswissenschaftler. Die Trennung von Arbeits- und Privatleben hat ihm noch nie besonders gelegen. Gepaart mit seinem Freiheitsdrang scheint er deshalb für ein Leben als Berufsurlauber ganz geeignet. Er arbeitet seit über 20 Jahren freiberuflich als Journalist, Grafiker, Webentwickler und Verleger. Wohnmobile waren schon immer ein Traum für ihn. Mit ihnen lässt sich einfach losfahren und unterwegs sein, um ein Stück vom Glück zu finden. So bereist und beschreibt er seit rund zwanzig Jahren die DACH-Region, um seine Kenntnisse weiterzugeben. Wichtig sind ihm Landschaften, denn sie prägen wesentlich die Menschen und ihre Lebensweise. Für seine Erkundungen nutzt er am liebsten Wohnmobile. Vor zwei Jahren wurde für ihn ein Jugendtraum wahr, als ihm zufällig ein kleiner Oldtimer-Camper zufiel. Doch er restauriert ihn häufiger als er ihn fährt, denn er testet auch seit zehn Jahren neue Reisemobile, die er auch für seine Recherchen nutzt. Seine weiteren Lieblingsthemen sind Kultur und Kulinarik, über die Stefan unabhängig für die campingbegeisterte Leserschaft in Europa in mehreren Medien berichtet. Stefan betreibt mit tourstory.de einen eigenen Blog, außerdem kannst du ihm auf Instagram oder Facebook folgen. Anahita Anahita ist eigentlich Juristin und arbeitet in einer Behörde. Im echten Leben tingelt sie aber mit ihrem Camper, ihrem Freund Felix und mit Fahri, dem tollsten Hund der Welt, durch Europa. Sie freut sich dabei über ihren fast barrierefreien Mikrokosmos und schreibt am Ende auch noch darüber. Mit im Gepäck ist außerdem immer Anahitas Rollstuhl. Sie kennt sich deshalb aus mit Hindernissen im Camper und mit Herausforderungen bei der Campingplatzsuche, und sie weiß von vielen Begegnungen mit Mitcamper:innen und Campingplatzbetreiber:innen zu berichten. Diese Begegnungen sind teils skurril, teils traurig und teils ganz wunderbar. Dabei dachte Anahita zuerst, dass es unmöglich sei, mit Handicap zu campen. Wie sich herausstellte, ist es das aber gar nicht. Mit viel „ich-will-aber“, viel Kreativität, viel Ausdauer und wenig Toleranz bei „geht-nicht“ hat sie sich vor ein paar Jahren in dieses Abenteuer gestürzt und will jetzt unbedingt noch viel mehr Menschen mit Handicap fürs Campen begeistern. Denn nur, wenn es genug „Handi-Camper“ gibt, kann die Campingwelt endlich barrierefreier werden! Geraldine Geraldine wurde das Unterwegssein in die Wiege gelegt – sie ist im Camper aufgewachsen. Auf ihren vielen Reisen allein durch Nah- und Fernost lernte sie gegensätzliche Welten kennen und begab sich neben dem Studium der Geographie und Ethnologie in eine zirkuspädagogische Ausbildung. Im Anschl"
