title = "Campergespräche: MTB-Profi Guido Tschugg - CamperStyle"
description = """
Vermutlich der einzige Mexikaner auf deutschen Campingplätzen. Wurde schon als Kind im väterlichen Bulli mit dem Campingvirus infiziert. Kann (fast) alles mit Multitool, Panzertape und Kabelbindern reparieren.
Lieblingsspots: Mexiko, Norwegen & Südspanien"""
full_description = 'Campergespräche > Campergespräche: MTB-Profi Guido Tschugg Jalil Landero Flores | 18.06.2019 Campergespräche: MTB-Profi Guido Tschugg CampergesprächeCamperlebenE-BikeMobilität CamperlebenMobilität Eingefleischten Mountainbike-Fans ist er sicherlich ein Begriff: Guido Tschugg (43) ist seit dem Jahr 2000 MTB-Profi und hat während seiner aktiven Karriere national wie international von sich reden gemacht. Downhill, 4Cross, Freeride – der gebürtige Allgäuer ist einer der bekanntesten Biker Deutschlands und war als einziger deutscher Vertreter bereits zweimal bei der Red Bull Rampage am Start. Was aber wohl die wenigsten wissen: Guido ist auch begeisterter Camper! Wir haben den sympathischen Ex-Weltmeister interviewt. Foto: (c) SAWIKO CamperStyle: Zunächst vielleicht noch ein paar Details zu dir. Wie lebst du und wie sieht dein Alltag als Profi-Sportler aus? Guido Tschugg: Ich lebe mit meiner Frau und unseren zwei Kids auf einem ehemaligen Bauernhof im Chiemgau. Neben dem Bikesport selbst und meinen Aktivitäten für meine Sponsoren wie Husqvarna, SAWIKO und Sunlight, berate ich auch Bike-Firmen in der Produktentwicklung. Ein weiteres Steckenpferd von mir ist das Designen und Bauen von Pumptracks, Dirtbike- und Teststrecken – außerdem organisiere ich eigene Events, werde als MTB-Testimonial für Festivals oder Messen gebucht und produziere MTB-Fotostrecken und Action-Videos. Außerdem bin ich ein leidenschaftlicher Motocrosser. Wie Ihr seht, dreht sich mein Leben größtenteils um zwei Räder. CamperStyle: Das klingt nach einem vollen Terminkalender. Was sagt denn deine Famile dazu? Guido Tschugg: Meine Frau war selbst lange Zeit in der Szene aktiv und zieht da nach wie vor voll mit. Sie hilft mir zum Beispiel bei der Organisation und Promotion meiner alljährlichen X-Mas Jam. Hierbei handelt es sich um ein Winter-MTB-Event auf meiner Dirt-Bike Strecke unter einer Autobahnbrücke bei Wangen im Allgäu. Hier lassen die Kids, Youngsters, Hobbyfahrer und Profis gemeinsam die Bike-Saison ausklingen und der Spaß am Biken steht ganz klar im Vordergrund. Bei anderen Events, wie dem Ferienprogramm auf unserem Bauernhof oder den Camp & Ride Events meines Sponsors Sunlight, packe ich meine Familie einfach ein. Gerade für die Kinder ist das immer cool und natürlich sehr aufregend. CamperStyle: Du hast ja einen ungewöhnlichen Weg eingeschlagen – vom 4Cross-Profi zum „E-Biker“, als erster namhafter Fahrer. Wie konnte das denn passieren? Guido Tschugg (lacht): Das hat in der Tat für etwas Wirbel gesorgt und die Kollegen spöttelten, ich sei jetzt wohl alt geworden und würde nun in Rente gehen. Doch der Hintergrund war ein ganz anderer: Ich habe wie gesagt ja ein Faible fürs Motocross und als vor fünf, sechs Jahren die ersten Hersteller anfingen, geeignete E-Bikes für Gravity und Freeride zu bauen, habe ich da eine große Nummer gewittert. Für mich war das einfach die perfekte Kombination aus Mountainbike und Motocross, deshalb bin ich kurzerhand zu meinem aktuellen Sponsor Husqvarna gewechselt. Das E-Bike lässt sich fast genauso bewegen wie ein „normales“ Downhill-Rad, aber man kann viel mehr damit machen – unter anderem sind höhere Geschwindigkeiten möglich und du brauchst keinen Lift oder Shuttle mehr. Sportlich anspruchsvoll ist das Ganze trotzdem. Und um zu beweisen, dass ich es noch „kann“, habe ich vor zwei Jahren auch eine neue Renn-Lizenz beantragt und bin in der Masterklasse Ü40 nochmal eine letzte Downhill-Weltmeisterschaft mitgefahren – natürlich ohne E-Bike! Dann war Schluss mit dem Geläster… (Lacht) Foto: (c) Husqvarna Bicycles / Martin Erd (c) Sunlight GmbH / Martin Erd CamperStyle: Du bist ja wahnsinnig viel unterwegs – und meistens sieht man dich mit Camper. Warum Vanlife statt Hotel? Guido Tschugg: Das Campen taugt mir einfach. Früher war ich schon mit Wohnwagen und VW-Bus unterwegs, beim Wohnmobil bin ich aber so richtig auf den Geschmack gekommen. Aktuell fahre ich einen Kastenwagen, der ist für mich ideal. Man hat absolute Flexibilität, auch für kurze Tagesmeetings, und gleichzeitig ist vor Ort immer alles Wichtige dabei. Ich bin damit ganz nah an den Locations, was vor allem für frühe Termine total praktisch ist. Bei einem Fotoshooting an einem coolen Freeride-Gelände in Südfrankreich mussten wir zum Beispiel morgens teilweise um 5, 6 Uhr raus, um das perfekte Licht einzufangen. Da ist man schon froh, wenn man sich die 15, 20 Kilometer aus dem nächsten Ort sparen kann. Tagsüber genieße ich es, mir zwischendurch mal einen Cappuccino zu machen, Pasta zu kochen oder einfach kurz Siesta zu halten. Ach und … die eigene Toilette ist natürlich auch nicht zu verachten! Foto: (c) SAWIKO CamperStyle: Ja, diesen kleinen Luxus haben wir auch zu schätzen gelernt. Und fast genauso wichtig: Man kann sich seinen Schlafplatz aussuchen… Guido Tschugg: Das stimmt – mein Van ist das schönste Hotel. Er bringt mich an Stellen, an denen du sonst niemals eine Übernachtungsgelegenheit finden würdest! Außerdem kann ich damit meinen Reiseplan selbst gestalten. Häufig bringe ich zum Beispiel abends noch meine Kinder ins Bett und fahre dann erst los. Unterwegs wird dann einfach mal ein Stündchen geschlafen, um etwas Energie zu tanken, und ich komme entspannt und in meinem eigenen „Zuhause“ am Ziel an. CamperStyle: Könntest du dir vorstellen, unabhängig von deinen Terminen auch mal ganz klassisch Urlaub auf dem Campingplatz zu machen? Na klar, das mache ich regelmäßig mit der ganzen Family. Wobei meine Frau, die sich neben ihrer Selbständigkeit auch das ganze Jahr über um unsere Kids und den Haushalt kümmert, auch mal ins Wellnesshotel will, um sich verwöhnen zu lassen. Aber Camping gibt’s bei uns trotzdem jedes Jahr. Manchmal campen wir sogar am Haus, zum Beispiel, wenn wir spät heimkommen und Kinder schon im Wohnmobil schlafen. Dann lege mich einfach dazu ­– und morgens machen wir die Hecktüren auf und erleben gemeinsam den Sonnenaufgang. Das ist unbezahlbar. CamperStyle: Welche Tipps hast du für Camper, die ebenfalls mit Rädern oder E-Bikes unterwegs sind? Guido Tschugg: Ausrüstungstechnisch sollten auf jeden Fall eine Luftpumpe, Ersatzschläuche, ein Multitool speziell fürs Fahrrad, eine gute App oder Landkarte für schöne Radwege und Trails und natürlich ein Helm für die eigene Sicherheit an Bord sein. Was den Fahrradträger angeht, wäre darauf zu achten, dass er aus massivem Material besteht, eine ausreichende Nutzlast aufweist, in sich stabil ist und zusätzlich mit einem guten Schloss gesichert werden kann. Gerade bei teuren E-Bikes kann es heutzutage passieren, dass Diebe einen normalen Standardträger einfach abschrauben oder sogar „wegschneiden“. Ich selbst hatte bis vor kurzem den FUTURO E-LIFT von SAWIKO montiert und teste nun den AGITO VAN. Der ist direkt am Fahrzeugchassis montiert und die Halterungen hängen nicht am Türblatt – so verschleißen die Fahrzeugtüren und Scharniere nicht. Zu guter Letzt ist für E-Bike-Besitzer vielleicht dieser Hinweis noch wichtig: Viele nehmen aus Gewichts- und Diebstahlgründen den Akku beim Transport raus – das ist eigentlich verboten, denn Akkus mit mehr als 150 Wattstunden gelten als Gefahrgut und dürfen nur in speziellen Boxen transportiert werden. Wenn die Batterien irgendwo im Kofferraum herumliegen, kann das zu Strafen und im schlimmsten Fall zu Führerscheinverlust führen. CamperStyle: Vielen Dank, Guido, für das nette und informative Gespräch. Wir wünschen dir weiterhin viel Erfolg – vielleicht rollt man sich ja mal über den Weg! Mehr zu Guido Tschugg und seinen Radträgern findest du hier: tschugg.sawiko.com Titelbild: (c) SAWIKO Das könnte dich auch interessieren Kostenlos zur „Reise + Camping“ in Essen: So sicherst du dir deine Tickets für die Camping-Messe!Campingmessen 2025 – alle Termine und Informationen13 inspirierende Camping-Bücher, die du kennen solltest3 winterliche Campingrezepte – schnell und einfach nachkochenCampingkarten 2025 im Vergleich: So sparst du wie ein ProfiACSI CampingCard 2025 – kräftig sparen in der NebensaisonADAC Campcard 2025: Sparen auch in der HauptsaisonCCI – Die Camping Card International 2025 im ÜberblickCKE – Camping Key Europe 2025: Die Rabattkarte im ÜberblickDCC – Deutscher Camping-Club: Die Mitglieds- und Rabattkarte 2025 im Überblick Jalil Landero FloresVermutlich der einzige Mexikaner auf deutschen Campingplätzen. Wurde schon als Kind im väterlichen Bulli mit dem Campingvirus infiziert. Kann (fast) alles mit Multitool, Panzertape und Kabelbindern reparieren. Lieblingsspots: Mexiko, Norwegen & Südspanien camperstyle.de Jalil Landero Flores Vermutlich der einzige Mexikaner auf deutschen Campingplätzen. Wurde schon als Kind im väterlichen Bulli mit dem Campingvirus infiziert. Kann (fast) alles mit Multitool, Panzertape und Kabelbindern reparieren. Lieblingsspots: Mexiko, Norwegen & Südspanien Dir hat der Beitrag gefallen? Dann teile ihn mit deinen Freunden! App - Post Subscribe Form Updates Erhalte kostenlose Camping-Tipps und Infos per Mail!Anmeldenform.fluent_form_35 .wpf_has_custom_css.ff-btn-submit { background-color:#409EFF;border-color:#409EFF;color:#ffffff;min-width:100%; }form.fluent_form_35 .wpf_has_custom_css.ff-btn-submit:hover { background-color:#ffffff;border-color:#409EFF;color:#409EFF;min-width:100%; } Nach dem Absenden des Formulars bekommst du eine Mail mit einem Link, den du anklicken musst, um dich zum Newsletter anzumelden. Du bekommst dann 1-2 Mal im Monat E-Mails von uns zu Camping-Themen. Die Frequenz hängt von der Menge an News und Ratgebern im Monat ab. Du kannst deine Einwilligung jederzeit per E-Mail an post@camperstyle.de oder durch den sich in jeder Mail befindlichen Link widerrufen. Der Versand erfolgt gemäß unserer Datenschutzerklärung unter https://camperstyle.de/datenschutzerklarung/ window.fluent_form_ff_form_instance_35_1 = {"id":"35","settings":{"layout":{"labelPlacement":"top","helpMessagePlacement":"with_label","errorMessagePlacement":"inline","asteriskPlacement":"asterisk-right"},"restrictions":{"denyEmpty