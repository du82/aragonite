title = "Endlich barrierefrei reisen: Entdecke die rollstuhlgerechten Wohnwagenumbauten von Brecht Caravan!"
description = "Steffi, mit einer vielseitigen Vergangenheit von Norwegen bis Texas, taucht jetzt ins Camping ein. Mit ihren zwei Kindern möchte sie die Campingwelt erkunden und ihre Erlebnisse teilen. Ihr Ziel: Gemeinsam lernen und die Freuden des Campings mit Familie entdecken. Steffi verbindet ihre Neugier mit dem Wunsch, praktisches Wissen zu sammeln, um die Natur mit ihren Kindern voll auszukosten."
full_description = 'Camping mit Handicap > Endlich barrierefrei reisen: Entdecke die rollstuhlgerechten Wohnwagenumbauten von Brecht Caravan! Stephanie Kolbe | 27.02.2024 Endlich barrierefrei reisen: Entdecke die rollstuhlgerechten Wohnwagenumbauten von Brecht Caravan! Camping mit HandicapCamping-Fahrzeuge Camping mit Handicap Die Freiheit der Straße, die Nähe zur Natur und das unvergleichliche Gefühl von Unabhängigkeit – Camping hat viele Gesichter, doch für Menschen mit Behinderungen bleibt diese Welt oft unzugänglich. Auf Campingplätzen gibt es kaum entsprechende Angebote und auch der Bau oder Umbau von Campingfahrzeugen für die speziellen Bedürfnisse ist meist sehr aufwändig und für „Normalos“ fast unbezahlbar. Manuela Brecht und ihr Team bei Brecht-Caravan in Heilbronn haben sich dieser Herausforderung gestellt und eine Lösung geschaffen, die das Camping für Rollstuhlfahrer nicht nur möglich, sondern auch erschwinglich macht. InhaltsverzeichnisEin Herzensprojekt nimmt Fahrt aufTechnische Herausforderungen und kreative LösungenIndividualität steht im MittelpunktKosten für einen barrierefreien Caravan-UmbauBarrierefreie Wohnwagen – Geschäftsführerin Manuela Brecht im Interview bei CamperStyleZukunftsvisionen und kontinuierliche VerbesserungenEin wichtiger Schritt zu mehr Barrierefreiheit und Inklusion im Campingbereich Ein Herzensprojekt nimmt Fahrt auf Alles begann vor der Pandemie auf der CMT in Stuttgart, wo das Team von Brecht-Caravan auf das große Interesse von Rollstuhlfahrern an barrierefreien Wohnwagen aufmerksam wurde. Warum gerade Wohnwagen? Ganz einfach: Weil viele Menschen mit Handicap bereits einen umgebauten Pkw besitzen, den sie als Zugfahrzeug nutzen können und damit dann am Urlaubsort flexibel bleiben. Diese Begegnungen auf der Messe entfachten eine Vision: Caravans für Camper und Camperinnen mit Behinderung anzubieten, die funktional und gleichzeitig finanziell stemmbar sind. Mit Engagement und einem klaren Ziel begann man bei Brecht-Caravan, diesen Traum in die Realität umzusetzen. Der Grundgedanke: Bereits existierende Serienwohnwagen verschiedener Hersteller, deren Grundrisse nicht zu viele tragende Teile aufweisen, als Basis zu nehmen und diese rollstuhlgerecht umzugestalten: mit breiterer Tür, schmaleren Sitzgruppen, abgesenkten und unterfahrbaren Küchen, befahrbaren Nasszellen und vielem mehr. Technische Herausforderungen und kreative Lösungen Der Weg zur Barrierefreiheit war geprägt von Herausforderungen: Die Stabilität und Statik des Aufbaus zu erhalten, tragende Elemente zu identifizieren, eine korrekte Gewichtsverteilung herzustellen und die Möbel an die Bedürfnisse von Rollstuhlfahrern anzupassen, erforderten innovative Lösungen und viel Kreativität. Durch intensive Recherche, Geduld, technisches Know-How und das Feedback von Betroffenen gelang es über die Jahre, eine ganze Palette an barrierearmen Wohnwagen-Grundrissen zu entwickeln und zu einem überschaubaren Preis anzubieten. Um die Kosten möglichst niedrig zu halten, ohne dabei Kompromisse bei der Qualität oder dem Handling zu machen, arbeiten die Verantwortlichen eng mit Herstellern zusammen. Individualität steht im Mittelpunkt Bei Brecht-Caravan wird jeder Kunde als Individuum betrachtet, dessen Voraussetzungen und Wünsche im Mittelpunkt stehen. Die maßgeschneiderten Umbauten sind dabei nicht nur funktional, sondern auch ästhetisch ansprechend – schließlich will man es im Urlaub gemütlich haben und sich nicht wie in einem Krankenhauszimmer fühlen! Auf der Internetseite von Brecht-Caravan findest du eine Auswahl möglicher Grundrisse, weitere Lösungen können aber jederzeit gemeinsam im persönlichen Gespräch entwickelt werden. Kosten für einen barrierefreien Caravan-Umbau Der Preis für einen solchen Umbau hängt vom Grad der Behinderung, den benötigten Hilfsmitteln und dem gewünschten Basisgrundriss ab. Eine Türverbreiterung beispielsweise liegt bei rund 6.000 bis 8.000 Euro, teilweise ist hier schon die Anpassung einiger Möbel eingeschlossen. Für die Verschmälerung einer Sitzgruppe mit ausziehbarem Tisch werden etwa 1.500 bis 2.000 Euro fällig, die Öffnung des Toilettenraums kommt auf ungefähr 1.000 Euro. Eine umfassende Preisliste gibt es auf Anfrage. Barrierefreie Wohnwagen – Geschäftsführerin Manuela Brecht im Interview bei CamperStyle Die ganze inspirierende Geschichte und die technischen Details hat uns Manuela Brecht im Podcast erzählt – hör doch mal rein: Zukunftsvisionen und kontinuierliche Verbesserungen Brecht Caravan ruht sich nicht auf den bisherigen Erfolgen aus. Das Team ist ständig auf der Suche nach neuen Materialien, Technologien und Designideen, um das Camping-Erlebnis für Menschen mit Behinderungen weiter zu verbessern. Unter anderem wird derzeit an einer Lösung gearbeitet, die auch das Duschen im Fahrzeug ermöglichen soll. Außerdem steht der Umbau von Wohnmobilen und Kastenwagen auf dem Programm. Sobald es hier Neuigkeiten gibt, werden wir den Artikeln entsprechend aktualisieren. Ein wichtiger Schritt zu mehr Barrierefreiheit und Inklusion im Campingbereich Die Initiative von Brecht Caravan zeigt, dass Barrierefreiheit und Inklusion keine fernen Konzepte sind, sondern mit Engagement, Kreativität und der Bereitschaft, bestehende Grenzen zu überwinden, Realität werden können. Dieses Projekt ist mehr als nur ein Geschäftsmodell; es ist ein Schritt hin zu einer inklusiveren Welt, in der die Liebe zur Natur und das Abenteuer des Campings Menschen mit und ohne Handicap verbindet. Kontakt:Brecht Caravan GmbH & Co KGLämlinstr. 1374080 HeilbronnTelefon: +49 7131 38278-0Telefax: +49 7131 38278-59E-Mail: info@brecht-caravan.de Fotos: © brecht-caravan.de Das könnte dich auch interessieren Alle Artikel zum Thema Camping mit HandicapFendt Tendenza (2025) – Entdecke die Highlights der neuesten Grundrisse für 4 PersonenVom Transporter zum Traumvan: SpaceCamper Classic+ Ford (2025)Iridium e-V25 (2025) – Das Wohnmobil der Zukunft?Mehr Platz, mehr Autarkie: Was kann der neue Offtrack Sprinter mit Längsbetten?Adria Compact Max SL (2025) – teilintegriertes Wohnmobil mit Einzelbetten auf VW Crafter BasisDieser gemütliche Mini-Wohnwagen ist für unter 14.000 Euro zu haben!LMC Modo (2025) – Das modulare System für den Selbstausbau im Iveco Daily SwitchWeinsberg X-Pedition (2025) – Offroad-Campervan für Luxus und AbenteuerMobilität trifft Produktivität: Alpine Cross Cabin Adventure Office (2025) als perfekter ReisebegleiterUnternehmensinsolvenzen in der Campingbranche und ihre Auswirkungen auf Verbraucher Stephanie KolbeSteffi, mit einer vielseitigen Vergangenheit von Norwegen bis Texas, taucht jetzt ins Camping ein. Mit ihren zwei Kindern möchte sie die Campingwelt erkunden und ihre Erlebnisse teilen. Ihr Ziel: Gemeinsam lernen und die Freuden des Campings mit Familie entdecken. Steffi verbindet ihre Neugier mit dem Wunsch, praktisches Wissen zu sammeln, um die Natur mit ihren Kindern voll auszukosten. Stephanie Kolbe Steffi, mit einer vielseitigen Vergangenheit von Norwegen bis Texas, taucht jetzt ins Camping ein. Mit ihren zwei Kindern möchte sie die Campingwelt erkunden und ihre Erlebnisse teilen. Ihr Ziel: Gemeinsam lernen und die Freuden des Campings mit Familie entdecken. Steffi verbindet ihre Neugier mit dem Wunsch, praktisches Wissen zu sammeln, um die Natur mit ihren Kindern voll auszukosten. Dir hat der Beitrag gefallen? Dann teile ihn mit deinen Freunden! App - Post Subscribe Form Notify .form_field_78_item_sf { display: none!important; position: absolute!important; transform: translateX(1000%)!important; } Erhalte kostenlose Camping-Tipps und Infos per Mail!Anmeldenform.fluent_form_35 .wpf_has_custom_css.ff-btn-submit { background-color:#409EFF;border-color:#409EFF;color:#ffffff;min-width:100%; }form.fluent_form_35 .wpf_has_custom_css.ff-btn-submit:hover { background-color:#ffffff;border-color:#409EFF;color:#409EFF;min-width:100%; } Nach dem Absenden des Formulars bekommst du eine Mail mit einem Link, den du anklicken musst, um dich zum Newsletter anzumelde