["https://camperstyle.de/camping-rezepte-vegetarisch-einfach"]
title = "Campingrezepte: 3 winterliche Gerichte zum Nachkochen"
description = """
Träumte seit ihrer Kindheit von einem Leben auf Rädern. Tourt jetzt mit Mann und Hund ganzjährig im Wohnwagen durch Europa und verbringt die kalten Wintermonate in Mexiko. Expertin für Caravan, Camping-Ausstattung, Reise-(Geheim)Tipps, Dauerreisen und Arbeiten unterwegs.
Lieblingsspots: Andalusien, Baskenland, Albanien & Mexiko."""
full_description = 'Camperleben > 3 winterliche Campingrezepte – schnell und einfach nachkochen Nele Landero Flores | 23.12.2024 3 winterliche Campingrezepte – schnell und einfach nachkochen CamperlebenCamping-RezepteRezepte mit FleischVegane CampingrezepteVegetarische Campingrezepte Camperleben Die kalten Monate sind angebrochen – wer sehnt sich da nicht nach leckerem, wärmendem Soulfood? Ich habe drei meiner einfachen Lieblings-Campingrezepte für dich ausgewählt, die du schnell und ohne komplizierte Zutaten nachkochen kannst. Ganz egal, ob im Camper oder zu Hause. Alle Rezepte sind vegetarisch bzw. vegan, lassen sich aber mit Würstchen oder Speck auch für Fleischesser aufpeppen. Die Mengen sind jeweils für 2 Erwachsene mit leicht überdurchschnittlichem Appetit kalkuliert – für einen echten Bärenhunger nach einem Tag an der frischen Luft evtl. ein bisschen mehr nehmen 🙂 Omas Kartoffel-Möhren-Eintopf Zutaten für 2 Portionen Kartoffeln (gewürfelt) Karotten (gewürfelt) 1 Stange Sellerie (in ca. 5 mm dicke Scheiben geschnitten – breite Stangen vorher längs halbieren, damit die Stücke nicht so groß werden) Falls vorhanden: 100 g Knollensellerie, Pastinake oder Petersilienwurzel (gewürfelt) Falls vorhanden: etwas frische Petersilie (gehackt) 1 mittelgroße Gemüsezwiebel (grob gehackt) 2 Zehen Knoblauch (fein gehackt oder gepresst) Salz Pfeffer 1-2 EL Öl Wasser oder Gemüsebrühe Für Fleischesser: 150 g Speckwürfel, Mettwürstchen oder Wiener. Anstelle von Wasser/Gemüsebrühe zum Ablöschen kann natürlich auch Fleischbrühe verwendet werden. © CamperStyle Zubereitung Gemüse schneiden. Zwiebeln und Knoblauch in etwas Öl dünsten. Das geschnittene Gemüse dazugeben und unter Rühren ganz leicht anrösten (bitte nicht anbrennen!). Schluckweise mit dem Wasser oder der Brühe ablöschen und etwas am Topfboden schaben, bis sich die Röstaromen lösen. Restliche Flüssigkeit dazugeben, den Topf schließen und das Ganze kurz aufkochen. Mit Salz und Pfeffer würzen, umrühren und auf kleiner Flamme zugedeckt weiterköcheln lassen, bis die gewünschte Bissfestigkeit erreicht ist. Je nach Herd dauert das ca. 30-45 Min. Nach ca. 15 Min. mal nachschauen, ob zu viel oder zu wenig Flüssigkeit im Topf ist. Die Brühe sollte das Gemüse knapp bedecken, aber nicht ertränken. Du kannst bei Bedarf entweder ein wenig Wasser nachfüllen oder den Deckel offen lassen, damit die Flüssigkeit verdampft. Wenn das Gemüse gar ist, mit einer Gabel oder einem Kartoffelstampfer einen kleinen Teil des Gemüses „zermatschen“, damit sich ein leicht cremiger Eintopf ergibt. Einlage für Fleischesser: Mettwürstchen können mitgekocht werden, Wiener sollten erst ganz am Ende kurz zum Aufwärmen mit reingegeben werden. Beim Speck ist es Geschmackssache – ich fand ihn immer in der gebratenen Version leckerer und habe ihn mitsamt dem ausgelassenen Fett in den Eintopf gegeben. Man kann ihn aber auch mitkochen. Ideal ist es, wenn du den Eintopf schon am Vortag zubereitest und über Nacht ziehen lässt. So wird der Geschmack deutlich intensiver und runder. Ich mache immer mindestens die doppelte Menge und wir essen mehrere Tage davon. Zum Einfrieren ist das Gericht jedoch nicht geeignet, da die Kartoffeln und die Karotten eine merkwürdige Konsistenz bekommen. Zum Servieren nur noch etwas frische Petersilie oder andere Kräuter deiner Wahl darüber streuen und voilà! Pasta mit gebratenen Pilzen und Kräuter-Creme-Fraiche Zutaten für 2 Portionen Linguine oder Spaghetti (ca. 100 g pro Person, je nach Appetit) 250 g Pilze (Champignons, Kräuterseitlinge o. Ä., in mundgerechte Stücke geschnitten) 1 mittelgroße Zwiebel (fein geschnitten) 2 Knoblauchzehen (fein gehackt oder gepresst) 200-250 g Kräuter-Creme-Fraiche oder veganen Ersatz 1⁄2 EL Rosmarin (fein gehackt, frisch oder getrocknet) alternativ: 1 kl. Büschel Petersilie (fein gehackt, am besten frisch) 1 EL Öl oder etwas Butter zum Anbraten Salz Pfeffer 1⁄2 TL Paprika edelsüß oder Rauchpaprika (wenn du es ein wenig scharf magst) 1 Kelle Nudelwasser evtl. etwas Parmesan oder vegane Alternative zum Bestreuen © CamperStyle Zubereitung Die Pasta nach Anleitung kochen. Die geschnittenen Pilze mit Knoblauch und Zwiebeln in etwas Öl oder Butter kurz auf hoher Flamme anbraten. Die Pilze sollen leicht gebräunt, aber nicht angebrannt sein. Danach die Temperatur etwas zurückdrehen und unter Rühren garen lassen, bis die Pilze und Zwiebeln die gewünschte Bissfestigkeit erreicht haben. Die Kräuter-Creme-Fraiche und Gewürze dazugeben und alles gut miteinander vermischen. Nun kommen die Nudeln an die Reihe: Sobald sie in der Pfanne bzw. im Topf bei den Pilzen sind, nach und nach etwas Nudelwasser dazugeben und weiter rühren, bis die Sauce nicht mehr dünnflüssig, sondern schön cremig ist. Falls vorhanden, mit etwas gehackten Kräutern (Rosmarin oder Petersilie) garnieren und/oder mit Parmesan bestreuen. Cremige Bohnenpfanne Zutaten für 2 Portionen 1-2 kleine rote Zwiebeln (grob gehackt) 3 Knoblauchzehen (fein gehackt) 2 EL Tomatenmark 1 Dose Kokosmilch 2 kleine Dosen gekochte weiße Bohnen (ca. 300-320 g) 1 EL Öl Für Fleischesser: etwas gebratener Speck oder geschnittene Würstchen (z.B. Wiener) Brot © CamperStyle Zubereitung Gehackte Zwiebel und Knoblauch mit Tomatenmark in Öl anbraten, dann mit Kokosmilch ablöschen und köcheln lassen, bis die Flüssigkeit etwas einreduziert ist. Bohnen dazugeben – ich nutze auch den Sud, in dem die Bohnen eingelegt sind, und spüle die Dosen immer noch mit etwas Wasser nach, das ebenfalls in der Pfanne landet. Alles zusammen ein paar Minuten einkochen, mit Salz/Pfeffer abschmecken und nach persönlichem Geschmack würzen, z.B. mit gehacktem Dill oder Rosmarin, Paprikapulver oder Curry würzen, evtl. eine Prise Chili dazu. Auf Wunsch am Ende die fleischige Einlage dazugeben und kurz mit erwärmen. Mit knusprig gegrilltem oder getoastetem Brot servieren (besonders lecker mit Knoblauchbutter!) Was sind deine liebsten Campinggerichte? Schreib sie gerne in die Kommentare! TippMehr Inspiration gefällig? In dieser Übersicht findest du viele weitere leckere Rezepte für die Zubereitung auf dem Herd, Grill oder im Omnia Backofen:Camping-Rezepte von CamperStyle Titelbild: © CamperStyle Das könnte dich auch interessieren Alle Artikel zum Thema CamperlebenCampingmessen 2025 – alle Termine und Informationen13 inspirierende Camping-Bücher, die du kennen solltestCampingkarten 2025 im Vergleich: So sparst du wie ein ProfiACSI CampingCard 2025 – kräftig sparen in der NebensaisonADAC Campcard 2025: Sparen auch in der HauptsaisonCCI – Die Camping Card International 2025 im ÜberblickCKE – Camping Key Europe 2025: Die Rabattkarte im ÜberblickDCC – Deutscher Camping-Club: Die Mitglieds- und Rabattkarte 2025 im ÜberblickDie meinPLATZ-Clubkarte 2025 – alle Infos im ÜberblickPrzepisy kempingowe: gotowanie w przyczepach kempingowych i kamperach Nele Landero FloresTräumte seit ihrer Kindheit von einem Leben auf Rädern. Tourt jetzt mit Mann und Hund ganzjährig im Wohnwagen durch Europa und verbringt die kalten Wintermonate in Mexiko. Expertin für Caravan, Camping-Ausstattung, Reise-(Geheim)Tipps, Dauerreisen und Arbeiten unterwegs. Lieblingsspots: Andalusien, Baskenland, Albanien & Mexiko. camperstyle.de Nele Landero Flores Träumte seit ihrer Kindheit von einem Leben auf Rädern. Tourt jetzt mit Mann und Hund ganzjährig im Wohnwagen durch Europa und verbringt die kalten Wintermonate in Mexiko. Expertin für Caravan, Camping-Ausstattung, Reise-(Geheim)Tipps, Dauerreisen und Arbeiten unterwegs. Lieblingsspots: Andalusien, Baskenland, Albanien & Mexiko. Dir hat der Beitrag gefallen? Dann teile ihn mit deinen Freunden! App - Post Subscribe Form Erhalte kostenlose Camping-Tipps und Infos per Mail!Anmeldenform.fluent_form_35 .wpf_has_custom_css.ff-btn-submit { background-color:#409EFF;border-color:#409EFF;color:#ffffff;min-width:100%; }form.fluent_form_35 .wpf_has_custom_css.ff-btn-submit:hover { background-color:#ffffff;border-color:#409EFF;color:#409EFF;min-width:100%; } Nach dem Absenden des Formulars bekom