["https://caniuse.com/ciu/about"]
title = "Can I use... Support tables for HTML5, CSS3, etc"
description = "Browser support tables for modern web technologies"
full_description = '''About "Can I use" provides up-to-date browser support tables for support of front-end web technologies on desktop and mobile web browsers. The site was built and is maintained by Alexis Deveria, with occasional updates provided by the web development community. The design used as of 2014 was largely created by Lennart Schoors. FAQ May I use your data in my presentation/article/site, etc? Yes, the support data on this site is free to use under the CC BY 4.0 license. Is there a way to see the support data in colors other than red/green? Yes, you can enable color-blind friendly colors from the theme settings. This color scheme will be used again on revisit. Do you have the data available in a raw format? Yes, the raw support data is available on GitHub and is updated regularly. Could you add feature X to the site? Adding features takes quite some time and there are many requests for additions. Because of this I use GitHub issues to manage requests. Feel free to add/vote for your feature there. If you've done the research yourself already, you can also submit a feature on GitHub. Could you cover email clients too so I can see what I can use in HTML emails? Another site is dedicated to this, see caniemail.com Which features do you choose to add to this list? I use the following criteria: Useful to web designers/developers Likely to be eventually implemented by the majority of browsers Not already fully supported in even old browsers. These features can be made searchable but will not include support tables. Most features are added in priority order from this list. How do you test support? I use a hand-crafted test suite to test features, which tests for basic support of each feature. The test suite is publicly available at tests.caniuse.com. Where do you get your information for upcoming versions? Most information comes directly from the latest developer/preview/nightly builds. When is a feature considered "supported"? When its primary purpose is largely fulfilled. It does not mean it's 100% supported, just that it's usable in most cases. How often is this site updated? I try to keep it as current as possible, with new information being usually being processed within a few days. Data from BCD that appears in search results is updated weekly. Follow the feed if you'd like keep up with new features being added.'''
year_published = 2024
year_updated = 2024
