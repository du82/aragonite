title = "Can I use... Support tables for HTML5, CSS3, etc"
description = "Browser support tables for modern web technologies"
full_description = '''Home Index of features Latest features WebAssembly BigInt to i64 conversion in JS API WebAssembly Threads and Atomics WebAssembly Multi-Value WebAssembly Import/Export of Mutable Globals WebAssembly Non-trapping float-to-int Conversion Most searched features WebP image format Flexbox gap property for Flexbox CSS Grid WebGL Test a feature Our partnership with BrowserStack now lets you test your website for compatibility across 2,000+ real browsers and devices. Test on: IE 11 Safari 17 Safari on iPhone 14 Chrome on Galaxy S23 Did you know? Next If a feature you're looking for is not available on the site, you can vote to have it included. Better yet, if you've done the research you can even submit it yourself! You can import usage data from your Google Analytics account and see exactly how well a feature is supported among your own site's visitors. Look under the Settings panel to get started! Usage data for all countries and continents can be imported via the Settings panel. By default, older browser versions are only shown if they have >= 0.5% usage share. You can increase or decrease this value from the Settings panel. Each feature support table includes a "Usage relative" button. This will resize each browser version cell to be relative to the amount of support it has for the selected usage source. Third party tools The CanIUse Embed — Add support tables to your site Caniuse Component — Add support tables to your presentations Caniuse command line tool Doiuse...? — Lint your CSS to check what features work I want to use — Select multiple features and see what % of users can use them See full list Browser scores Chrome 133: 437 Safari 18.3: 410 Firefox 135: 415 Other support sites Can I email... — Support tables for HTML & CSS in emails Accessibility Support — Support information for web accessibility features in assistive technologies Can I Webview — Documentation for WebView capabilities, limitations & features'''
