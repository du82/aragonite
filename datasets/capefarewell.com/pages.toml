["https://www.capefarewell.com/michael-pinsky-2"]
title = "Michael Pinsky – Cape Farewell"
full_description = "Michael Pinsky Cape Farewell → Profiles → Team → Michael Pinsky Artist, Urban Planner, Activist, Researcher and Cape Farewell Board Member Dr Michael Pinsky is a British artist whose work has been shown in galleries and public spaces internationally. Taking the combined roles of artist, urban planner, activist, researcher, and citizen he often starts residencies and commissions without a specified agenda, working with local people and resources, allowing the physical, social and political environment to define his working methodology. Past work has been shown at TATE Britain; Museum of Contemporary Art, Chengdu; Saatchi Gallery; Victoria and Albert Museum; Institute for Contemporary Art, London; La Villette, Paris; BALTIC, Gateshead; Centre for Contemporary Art, Glasgow and more. His recent installation Pollution Pods is touring internationally and has been exhibited in Somerset House, London, COP 26, Glasgow; COP25, IFEMA, Madrid, Spain; UN Climate Change Summit, New York; Science Gallery Melbourne; Media City Plaza, Manchester; TED Annual Conference, Vancouver; Place des Nations, Geneva; Klimahaus, BremerHaven, Germany and STARMUS, Trondheim, Norway. Dr Michael Pinsky graduated from the Royal College of Art. He has received awards from the RSA, Arts Council England, British Council, Arts and Business, the Wellcome Trust and his exhibition Pontis was shortlisted for the prestigious Gulbenkian Museums Award. Pollution Pods, Michael Pinsky L’eau Qui Dort – Parc de la Villette, Photo Michael PinskyPollution Pods – Kunst Museum Bonn Photo – Michael PinskyPollution Pods, Michael PinskyPollution Pods, Michael PinskyPollution Pods, Michael PinskyMichael Pinsky, ‘Come Hell Or High Water’ River Tyne at Newcastle, Photo by Mark Pinder"
