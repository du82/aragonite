title = "About – Cape Farewell"
description = "Cape Farewell acts as a catalyst, producing opportunities for artists, scientists and communities to work together."
full_description = "MissionClimate is culture: Cape Farewell envisions a sustainable future inspired by the illumination artists give to the global climate challenge What we doWe all need stories that move us if we are to be inspired to make social and behavioural changes in our lives The WaterShedAn experimental station for climate-focused residencies and Cape Farewell’s HQ in Dorset HistoryPioneering close collaboration between arts and science to highlight the urgency of climate change since 2001 About Cape Farewell → About MissionClimate is culture: Cape Farewell envisions a sustainable future inspired by the illumination artists give to the global climate challengeWhat we doWe all need stories that move us if we are to be inspired to make social and behavioural changes in our livesHow we workA small core team works at the centre of an international programme of activityWho we areMeet our core team and collaborators including creatives, scientists and informersThe WaterShedAn experimental station for climate-focused residencies and Cape Farewell’s HQ in DorsetHistoryPioneering close collaboration between arts and science to highlight the urgency of climate change since 2001Our PoliciesIncluding environmental sustainability, ethical fundraising, privacy and accessibilityContactGet in touch to find out more about any aspect of our work Explore more FeatureAn Ode to An Nahl by Shagufta K IqbalWatchDaro Montag’s leafcutter ants – an organism in motionWatchThree new poems by Pete (The Temp) BearderFeatureClimate is still an emergency in the age of Covid-19"
