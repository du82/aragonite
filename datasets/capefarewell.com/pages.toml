["https://www.capefarewell.com/about/mission"]
title = "Mission – Cape Farewell"
description = "Climate is culture: Cape Farewell envisions a sustainable future inspired by the illumination artists give to the global climate challenge"
full_description = "What we doWe all need stories that move us if we are to be inspired to make social and behavioural changes in our lives Mission Cape Farewell → About → Mission Climate is culture: Cape Farewell envisions a sustainable future inspired by the illumination artists give to the urgency of the global climate challenge. David Buckland, Discounting the Future, 2008. Ice Texts series.David Buckland, Ice Texts series, 2004–2005. Installation view, Fundación Canal, 2008. Photo by Ignacio Hernando for Fundación Canal.Mona Hatoum, Hot Spot, 2006. Installation view, Royal Academy of Arts, London, 2009. Antony Gormley, Amazonian Field, 1992. Terracotta, Variable size: approx. 24,000 elements, each 4-40 cm. Installation view, Royal Academy of Arts, London, 2009. Photograph by Francis Ware. Photograph courtesy of Royal Academy of Arts, London.Earth Can You Hear Us? flash mob for ArtCOP21. Photo by Gavin Freeborn.Ackroyd & Harvey, Stranded, 2005–2006. Installation view, Miraikan, Tokyo, 2008. Photo by Kathy Barber.Audiences during Cape Farewell’s Late at Tate at Tate Britain, February 2009.Greta Thunberg (centre) visits Michael Pinsky’s (left) Pollution Pods at the 74th United Nations General Assembly in partnership with the World Health Organization in New York, 2019.“SHIFT Encounters” climate workshop during Shift 2010 at Southbank Centre, London. Photo by Nathan Gallagher. We want to change the way people think about climate change. We work in the powerful space at the intersection of art and science, prompting dialogue between leading creatives, scientists and informers. From these conversations compelling artworks grow, conveying the urgency of climate change with simplicity and directness. “I think of art, at its most significant, as a DEW line, a Distant Early Warning system that can always be relied on to tell the old culture what is beginning to happen to it.” Marshall McLuhan (Canadian Philosopher) See Also What we doWe all need stories that move us if we are to be inspired to make social and behavioural changes in our livesHow we workA small core team works at the centre of an international programme of activityWho we areMeet our core team and collaborators including creatives, scientists and informers"
