["https://www.capefarewell.com/2013-expedition"]
title = "2013 Expedition – Cape Farewell"
description = "Cape Farewell's second Sea Change expedition, explored Scotland’s Northern Islands with a crew of 28 creatives and scientists in 2013"
full_description = "Sea ChangeA four-year programme of research and making across Scotland’s western and northern isles 2011 ExpeditionA month-long expedition by boat across the Western Isles of Scotland from Oban to Lewis Working the MapBeautiful artists’ book by John Cumming documenting social and ecological change across Scotland’s Northern Isles. Available for £9.99 2013 Expedition Cape Farewell → Archive → Expeditions → 2013 Expedition Our second Sea Change expedition, exploring Scotland’s Northern Islands with a crew of 28 creatives and scientists. Photo by Gorm Ashurst, taken during Cape Farewell’s 2013 expedition to Scotland’s Northern Islands.Onboard The Swan during Cape Farewell’s expedition to Scotland’s Northern Islands in 2013.Musicians play on the deck of The Swan during Cape Farewell’s 2013 expedition.Photo by Gorm Ashurst, taken during Cape Farewell’s 2013 expedition to Scotland’s Northern Islands. 19 Aug–8 Sept 2013Scotland’s Northern Islands ExpeditionPeople, Place, Resources on Scotland’s Islands In August 2013 Cape Farewell set sail from Stromness on our second Sea Change expedition, aboard Lerwick community boat The Swan, with a crew of 28 artists, scientists and informers. Journeying from Orkney to the Shetland Islands via Fair Isle, the expedition will consider the relationship between people, place and resources in coastal and island environments, with emphasis on the role of community agency and local knowledge in developing social and ecological resilience. The project will build on Cape Farewell’s established programme of expedition, education and commissions by establishing artist residency and curatorial partnerships with pioneering environmental and cultural organisations across the Northern Isles. Explore the blogFollow the voyage in blogs broadcast from the deck of the ship Meet the crew28 creatives and scientists including musicians, a traditional boatbuilder and a performance poet There is now an urgent need, widely expressed by climate and social scientists and by local communities affected by accelerating change, for more imaginative and effective dialogue between policy-makers, business and community around issues of resource use, cultural resilience, wellbeing and disenfranchisement. This is an outcome not only of climate and resource stresses in marginal rural communities, but also of the industrialisation of renewable energy across the islands and mainland of Scotland. The ethical, empirical and ecological complexities of these issues demand new lenses and ways of identifying, valuing and communicating the constituent qualities of place. Sea Change facilitates knowledge transfer across disciplines and sectors, enhancing the confidence and capacity of artists as key participants in a rapidly evolving discourse around human futures, and supporting them in the creation of new work as acts of cultural participation and relationship. The expedition will offer forms of empirical and imaginative engagement with sites and areas of environmental significance, and will also challenge the separation of the human and natural worlds, in part through consideration of traditional forms of knowledge and practice through which people and place are interwoven. The expedition is part of Sea Change, Cape Farewell’s four-year programme of research and making across Scotland’s western and northern isles. Supporting artists in developing new knowledge and competency in research methods, cross-sector collaboration, agency and advocacy, to become full and influential participants in the network of relations between communities, ecologies and economies. Supported by Creative Scotland, The Bromley Trust, Lighthouse Foundation, Compton, Jon & NoraLee Sedmak and Arts Council England. With thanks to our local partners The Swan Trust, Fair Isle Marine Environment and Tourism Initiative, Fair Isle Bird Observatory and Guest House, The Pier Arts Centre, Orkney, International Centre for Island Technology, Herriot-Watt University and NAFC Marine Centre Shetland. About the expedition The 2013 expedition is intended both to build bridges between disciplines and to extend the capacities, reach and interconnectedness of participating artists. At the same time, the journey will interrogate the idea of expedition itself, emphasising the value of exploration and stewardship of our own, rather than distant and ‘exotic’, places. Two groups of artists will each spend up to 10 days on The Swan, actively involved in sailing the boat and in dialogue and collaborative research with participating scientists and with one another. The boat itself provides a fitting environment for discussion of needs and limits, and issues of resource constraint and climate change adaptation will also be explored in onshore dialogue and community events, including climate cèilidhs, guided walks and site visits, public presentations by artists, scientists and island tradition-bearers, and the launch at Orkney’s Pier Arts Centre of Things Unspoken/Things Unseen, a new artists’ book by Anne Bevan and Andrea Roe. Expedition is a way of seeing place anew, and offers many points of access for participants and local communities to collaborate, celebrate and deepen knowledge of their physical context. The 2013 Orkney-Shetland Expedition is based on the conviction that people, place and resources are intertwined, and that our terrestrial home is inextricably bound up with our maritime environment. Rather than defining islands as remote and isolated, we are developing the idea of the knowledge archipelago, linking island and mainland communities through culture and science, and acknowledging the sea as the essential and threatened medium which carries human and material resources, stories, and forms of local knowledge from place to place. Expedition crew The expedition crew of 28 includes a wide range of scientific and creative folk including: Entrepreneur, public speaker and author Tom Rand Traditional boatbuilder and teacher Ben Duffin Performance poet and writer Sabrina Mahfouz Artists Deirdre Nelson, John Cumming, Ruth MacLennan, Inge Thomson, Jennifer Wilcox and James Brady Photographer and designer Gorm Ashurst Sailor Jo Royle – best known for sailing from America to Australia in a catamaran made entirely from plastic bottles Playwright Bryony Lavery Scientists Charlotte Main, Kate Johnson, Sandy Kerr and Susana Baston Caroline Wickham-Jones, lecturer in Archaeology Musician Karine Polwart Film makers Sarah Fortin, Geneviève Perron and Andy Crabb Video essayist and theorist Ursula Biemann Sound Designer Tam Treanor Teresa Elwes, letter designer and carver and Foundation Director Jens Ambsdorf, Executive Director of the Lighthouse Foundation, Germany And Ruth Little, David Buckland and Yasmine Ostendorf from Cape Farewell Explore all crew profiles on the blog About Sea Change Cape Farewell’s Sea Change is a four-year programme of research and making across Scotland’s western and northern isles that has grown out of the gathering at Cove Park in 2010, and the Scottish Islands Expedition in 2011. Sea Change involves over 30 UK and international artists and scientists, working collaboratively and independently to consider the relationships between people, places and resources in the context of climate change. Part of the London 2012 Festival and the Year of Creative Scotland, the project will culminate during the Glasgow 2014 Commonwealth Games.Find out more Visit the expedition blog See Also Sea ChangeA four-year programme of research and making across Scotland’s western and northern isles2011 ExpeditionA month-long expedition by boat across the Western Isles of Scotland from Oban to LewisWorking the MapBeautiful artists’ book by John Cumming documenting social and ecological change across Scotland’s Northern Isles. Available for £9.99 Related Projects Previous project – 2011 Expedition Next project – 2023 Expedition"
