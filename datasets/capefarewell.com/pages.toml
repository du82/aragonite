description = "An extraordinary body of original and essential creative projects that engage, inspire and communicate on a human scale the urgency of the global climate challenge."
full_description = "2021 wAteR-climaTe festival An inspiring festival bringing climate science to life, timed to coincide with COP26 2018 Social Dreaming Climate Change Exploring the contemporary cultural unconscious of climate change 2013–2017 Tidal Lagoon Swansea Bay Art commissions for the world's first tidal lagoon, a pioneering carbon-free energy project 2013-2016 FarmArt Artist residencies exploring heritage, sustainability and innovation in food production and organic farming 2015 ArtCOP21 Climate Festival An exceptional global festival of cultural activity on climate change during COP21, featuring over 550 events worldwide 2012–2015 Climate Poet-in-Residence Our annual poet-in-residence programme featuring Zia Ahmed, alongside Tom Chivers and performance poet Sabrina Mahfouz 2014 The Sounds of Others: A Biophonic Line The first of our Lovelock Art Commissions, artist Marcus Coates 2013–2014 Carbon 14: Climate is Culture Four months of cultural engagement with one of the most pressing issues of our time 2010–2014 Sea Change A four-year programme of research and making across Scotland’s western and northern isles 2012–2014 Switch Youth Poetics An online poetry project for young writers developed by Cape Farewell, in partnership with The Poetry Society 2010–2013 u-n-f-o-l-d Our exquisite exhibition toured Beijing, New York, Chicago, Vienna and across the UK 2012–2013 Carbon 13 Newly commissioned work by eight international artists at Ballroom Marfa, Texas 2012 Carbon 12 An exciting mix of art commissions and science encompassing biodiversity, atmospherics and oceanography at Espace Foundation EDF, Paris 2011–2012 High Arctic Inspired by the 2010 Arctic Expedition Matt Clark and UVA created High Arctic at the National Maritime Museum – an immersive, interactive environment using sculptural forms, poetry and cutting-edge technology to create a unique installation experience 2010 SHIFT Festival A stimulating, provocative and energising 8-day climate festival at Southbank Centre inspired by Cape Farewell's expeditions to the High Arctic and Andes"
