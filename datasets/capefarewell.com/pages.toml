["https://www.capefarewell.com/poems-pete-the-temp-bearder"]
title = "New Normal – Cape Farewell"
description = "Three new poems by Pete (The Temp) Bearder about climate change, mental health and Covid-19, created for Cape Farewell's SIRENS programme."
full_description = "New Normal Cape Farewell → Features → Watch → New Normal Three new poems by Pete (The Temp) Bearder created during his time as a SIREN with Cape Farewell. Sponsor an Activist by Pete (The Temp) Bearder, 2020A charity advert parody. New Normal by Pete (The Temp) Bearder, 2020Filmed and produced by Jon Hardy.An experimental sound poetry about mental health, climate change and Covid-19. Generous Earth by Pete (The Temp) Bearder and Florence Pardoe, 2020Filmed by Background Noise Productions with Ben Capp Sound. The first film created during his time as a Siren Poet with Cape Farewell, Pete (The Temp) Bearder launches this song in Gratitude to Gaia, with sublime vocals from Florence Pardoe of The Bare Souls. Filmed on location at the Hempen and Hardwick Estate. These films have been created as part of Cape Farewell’s SIRENS programme – a unique take on the climate emergency and response to the Covid-19 pandemic made possible with emergency funding from Arts Council England. About the SIRENS programmeAbout Pete (The Temp) Bearder Categories: Watch Tags: poetry SIRENS Posted: 17 August 2020 Related Posts Previous – The Environmental Refugee Holding Centre (ERHC) Next – Plasticles: Life in Plastic Explore more Watch Nick Drake's moving poem The Farewell Glacier Watch Daro Montag's leafcutter ants - an organism in motion Watch Watch Dr Simon Boxall's lecture at Millfield School Watch Plasticles: Life in Plastic – an epic poem by Chris White"
