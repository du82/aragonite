["https://www.capefarewell.com/take-me-to-the-river"]
title = "Take Me To The River 2024 – Cape Farewell"
description = "A free science day workshop held at Cape Farewell HQ The WaterShed as part of Dorchester Science Festival"
full_description = "RiverRunCommissions interrogating the environmental impact of Dorset farming on the rivers and waters of Poole Bay Take Me To The River 2024 Cape Farewell → Events → Take Me To The River 2024 A free science day workshop held at Cape Farewell HQ The Watershed, as part of Dorchester Science Festival Listened and recorded the magic of underwater sound using Hydrophones Explored the beginnings of life and biodiversity by viewing through microscopesIdentifying river wildlife in Sydling WaterSampling water from rivers and ponds on site Exploring the beginnings of life and biodiversity on our planet Saturday 12th March 2024 Cape Farewell in partnership with Bournemouth University held a free science day workshop, where anyone could get involved with scientists ‘in the field’ whilst they conducted research as part of Dorchester Science Festival. The day of workshops was hosted by Cape Farewell to promote a dialogue on climate change and biodiversity. Activities Members of the public explored the beginnings of life and biodiversity on our planet by sampling water from rivers and ponds on site and viewing through microscopes, led by Professor Genoveva Esteban (Bournemouth University) Identified river wildlife in Sydling Water with Will Beaumont (The Game and Wildlife Conservation Trust). Are climate change or water pollution having an impact on different species? Listened and recorded the magic of underwater sound using Hydrophones, with Professor Adrian Newton (Bournemouth University) and David Rodgers (Electric Backroom Studio) Identified birds and their call sounds with Sam Lloyd (Dorset Wildlife Trust RSPB). Sam identified a pair of Snipes and a group of Chiffchaffs who had just migrated north and looked to be nesting for the summer. Many other birds and waterbirds were identified. Information Cape Farewell Director and Eco-poet Helen Moore also accompanied the groups. The day of activities took place indoors and outdoors with a range of different ages from ranging from 4 years to 75yrs. The Cape Farewell HQ includes the Watershed artists’ lab and six acres of river, lake and wilding terrain. It also sits among organic farms and Natural England’s land, all helping to encourage species resilience. See Also RiverRunCommissions interrogating the environmental impact of Dorset farming on the rivers and waters of Poole BaySIRENSA unique take on the climate emergencyPollution PodsAn immersive installation by Michael Pinsky See Also Previous event – RiverRun Exhibition Next event – Creative Perspectives on Climate Change Launch"
