["https://www.capefarewell.com/an-ode-to-an-nahl"]
title = "An Ode to An Nahl – Cape Farewell"
description = "An Ode to An Nahl – a poem by Shagufta K Iqbal with artwork by Sabba Khan. This poem was made possible by Cape Farewell's SIRENS project, funded by Arts Council England."
full_description = "Feature Listen to BBC Radio 4's Costing the Earth: Art and the Environment show featuring David Buckland Feature · News World leaders experience the Pollution Pods at the UN Climate Summit in NYC, in partnership with the WHO An Ode to An Nahl Cape Farewell → Features → Feature → An Ode to An Nahl A poem by Shagufta K Iqbal Artwork by Sabba Khan. We know we are no differentfrom the honey bees.We too are creatureswith wings of hope. Every living thingin a state of worship, A harmonised falling,we place foreheads to earth,whisper gently our praises,plant duas into palms.Let the wind carryour trust to the Almighty. Hope is the centre of the hive,gleaming back at the faithful,The ummah is one note in a humreverberating into the next duniya.Calls us to place one foot before the other,to find ourselves at the door of prayers. This calling speaks that the moment is now.We know it like the sound of the azaan.Know it like the removing of shoesbefore entering the masjid. The bowing of heads,in Jummah prayers.The collecting of nectarfrom the wildflowers of spring.Know it, like we know the sacred. The miracle of it all,brings you to your knees.Does it not? Yet we are eating a land and a seathat tastes of what we have done. But there is a song,that starts as a slight buzz,sends a murmuring ripple,building like waves through bodies, Listen.You are being called to do better than this.Listen.You are being called to protect more kinder than this. ListenThe earth is waitingfor the touch of a forehead,for the whisper of hope,for the collective placing of handsagainst the heart of it.For we know the way backto the Almightyis through this very soil. This poem was made possible by Cape Farewell’s SIRENS programme, funded by Arts Council England – a unique take on the climate emergency and response to the Covid-19 pandemic. About the SIRENS programme Categories: Feature Tags: poetry SIRENS Posted: 27 August 2020 Related Posts Previous – Climate is still an emergency in the age of Covid-19 Next – Siren Call Explore more Feature Listen to BBC Radio 4's Costing the Earth: Art and the Environment show featuring David Buckland Feature David Suzuki stands accused of seditious libel. Is he talking treason or reason? Feature Ian McEwan: A Boot Room in The Frozen North Feature · News World leaders experience the Pollution Pods at the UN Climate Summit in NYC, in partnership with the WHO"
