title = "Climate is still an emergency in the age of Covid-19 – Cape Farewell"
description = "Change needs public and political buy-in and art is the most effective way to communicate a complex concept to a population, says Cape Farewell's David Buckland"
full_description = "Feature · News World leaders experience the Pollution Pods at the UN Climate Summit in NYC, in partnership with the WHO Climate is still an emergency in the age of Covid-19 Cape Farewell → Features → Feature → Climate is still an emergency in the age of Covid-19 Discounting the Future, David Buckland, 2008 Change needs public and political buy-in and art is the most effective way to communicate a complex concept to a population. It’s the key to unlocking a safer world. Global communities are experiencing an unprecedented cultural challenge: the temporary focus is the Covid-19 virus, but the longer-term one is climate change. Each is and will continue affecting us profoundly. We are awash with journalistic comment and political pronouncements but what does it mean to be human now and how will that evolve in the coming months? Read the full article by Cape Farewell’s David Buckland, published by Arts Professional in May 2020. Read the article on Arts Professional Categories: Feature Posted: 27 May 2020 Related Posts Previous – Pollution Pods at the UN Climate Summit Next – An Ode to An Nahl Explore more Feature David Suzuki stands accused of seditious libel. Is he talking treason or reason? Feature · News World leaders experience the Pollution Pods at the UN Climate Summit in NYC, in partnership with the WHO Feature Ian McEwan: A Boot Room in The Frozen North Feature An Ode to An Nahl by Shagufta K Iqbal"
