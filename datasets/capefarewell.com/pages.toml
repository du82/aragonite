["https://www.capefarewell.com/multi-lingual-slam-poetry-competition-slam"]
title = "Multi-Lingual Slam Poetry Competition – Cape Farewell"
full_description = "Events · News Cape Farewell join Waverley Street Foundation and over 225 grantee partners in Mexico City. 17 December 2024 Events · News The Launch of Creative Perspectives on Climate Change: A year-long partnership between Cape Farewell and Francis Holland School On Tuesday 24th September, David Buckland, Cape Farewell Founder and International Director, was… 27 September 2024 News Listen to David Buckland's radio interview with Simon Parkin on BB Radio Somerset 9 November 2023 Multi-Lingual Slam Poetry Competition Cape Farewell → News → Multi-Lingual Slam Poetry Competition A climate inspired Slam Poetry Competition at Francis Holland School, Sloane Square Francis Holland School year 9 students participated in a multi-lingual Slam Poetry Competition running alongside Creative Perspectives on Climate Change, a collaboration between Cape Farewell and Francis Holland School. All Year 9 students had the incredible opportunity to spend the day with two poets, Michael Vidon and Steve Larkin, in a workshop that was nothing short of inspiring! Together, they crafted powerful poems to raise awareness about global warming and other environmental challenges, all while weaving in as many languages as they could. The afternoon was electric as they took to the stage to perform their outstanding creations in the Slam! Their creativity and passion was completely inspiring. The year 9 students at Francis Holland worked together in teams to create poems that mix different languages whilst raising awareness about climate change. The competition was a great way to bring the students together creatively whilst writing about the ecological crisis we are all facing and how we can help to protect our environment. We are so impressed by what the students have created, that we are sharing the prized poems below. Well Done to all of the students who were involved. Congratulations to Beth, Julia, Aigerim and Indy for their excellent winning poem Nature’s Cry, written in English, Spanish, Italian and Russian. Nature’s Cry By Beth, Julia, Aigerim, Indy In English, Spanish, Italian and Russian Slam Winners and Silver Medalist for Best Expression of Emotions Scroll on the PDF below to read the awarded poems: Categories: News Posted on 29 January 2025 Related Posts Previous – Waverley Street Foundation: Cultivating Community Explore more Events · News Cape Farewell join Waverley Street Foundation and over 225 grantee partners in Mexico City. 17 December 2024 Events · News The Launch of Creative Perspectives on Climate Change: A year-long partnership between Cape Farewell and Francis Holland School On Tuesday 24th September, David Buckland, Cape Farewell Founder and International Director, was… 27 September 2024 News Listen to David Buckland's radio interview with Simon Parkin on BB Radio Somerset 9 November 2023 News Read Cape Farewell's November Newsletter 1 November 2023"
