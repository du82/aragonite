["https://www.capefarewell.com/lily-lloyd"]
title = "Lily Lloyd – Cape Farewell"
description = "Company Manager and Social Media Director"
full_description = "Lily Lloyd Cape Farewell → Profiles → Team → Lily Lloyd Company Manager, Artist and Social Media Director. Lily Lloyd joined the team in February 2020, working alongside founder David Buckland to create Cape Farewell’s growing archive. Lily studied BA photography at Falmouth university before working as an art teacher at Bryanston School. She has been involved in numerous local community art festivals and engagement, as well as achieving a Young Persons Bursary award. Her photographic practice explores the interrelationship between humans and animals. She is particularly interested in the relationship between humans and birds, as shown in her latest photographic series’. Cape Farewell Social Media Links Companionship, 2022Companionship, 2022Companionship, 2022Birdie, 2021, Lily LloydBirdie, 2021, Lily LloydBirdie, 2021, Lily Lloyd"
