["https://www.capefarewell.com/cape-farewell-archive"]
title = "Cape Farewell Archive – Cape Farewell"
description = "Nevada Museum of Art: Centre for Art + Environment takes the Cape Farewell archive as part of their unique Environmental Archive that includes Burning Man."
full_description = "Cape Farewell Archive Cape Farewell → Projects → Cape Farewell Archive Nevada Museum of Art to hold the Cape Farewell archive as part of their unique Environmental Archive. Nevada Museum of Art Over a period of three years the Nevada Museum of Art: Centre for Art + Environment will take the Cape Farewell archive as part of their unique Environmental Archive that includes Burning Man. Since 2001 Cape Farewell has worked with over 350 artists and creatives and 75 climate scientists. We have exhibited worldwide, produced films, engaged millions with the climate change challenge. This substantial body of work will become available for future study and create a legacy for all the creative ambition Cape Farewell has inspired towards building the sustainable future humanity must achieve. About the Environmental Archive collections Read the Cape Farewell intro here For a taste of the materials being included in Nevada’s Environmental Archive, dive into the Archive section of our website and discover over 20 years of extraordinary creative projects and expeditions, alongside our catalogue of books and films, and the people we’ve collaborated with. Explore ArchiveDive into our archive and discover over 20 years of extraordinary creative projects, publications and expeditions, as well as the people we’ve collaborated with Past Creative ProjectsAn extraordinary body of original and essential creative projects that engage, inspire and communicate on a human scale the urgency of the global climate challenge Past ExpeditionsUsing the notion of expedition – Arctic, island, urban and conceptual – to interrogate the scientific, social and economic realities that lead to climate disruption Related Projects Previous project – SIRENS Next project – The WaterShed"
