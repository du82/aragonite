["https://www.capefarewell.com/about/how-we-work"]
title = "How we work – Cape Farewell"
description = "Cape Farewell operates from The WaterShed in Dorset, where a small core team works at the centre of an international programme of activity"
full_description = "How we work Cape Farewell → About → How we work Originally based in London, Cape Farewell now operates from The WaterShed, a 6-acre wilding site on a former fish farm in Dorset. Cape Farewell’s Uummannaq Day at Southbank Centre, 2009. Photo: Nathan Gallagher.David Buckland (left) and Jarvis Cocker (right) photographed at Cape Farewell’s Space to Breathe weekend at Somerset House, January 2017.The expedition crew at Manu Learning Centre. Photo by Ana Cecilia Gonzales Vigil.Ian McEwan reads an extract of his book Solar, for Cape Farewell’s Late at Tate at Tate Britain, February 2009.The WaterShed – Cape Farewell’s HQ in Dorset Cape Farewell’s newly-designed and built low carbon HQ includes an artists’ studio and residence, from where we offer climate-focused artists’ residencies and workshops, and the team’s office. This unique site sits among organic farms, close to the world heritage site of the Jurassic coast. The small core team works at the centre of an international programme of activity. Our scientists and artists undertake action-based research in the field to examine the impact of climate change. The research in turn informs the creative process, and our artists make use of the beautiful studios and residence at Cape Farewell HQ to create and finish many of their artworks. We are a partner organisation and could not succeed without the support of our global network of artists and the collective expertise of our informers and scientists. It is only through our relationships with world-renowned partner organisations that we can bring the artists’ work to the wider public. “One of the world’s greatest ever inventors, Leonardo da Vinci, was also one of the world’s greatest artists. We’ve actually gone away from this integrated approach to solving problems. Cape Farewell is bringing us back to our roots and is really exciting for that.” Dr Simon Boxall, National Oceanographic Centre, and Chair of the Trustees See Also Who we areMeet our core team and collaborators including creatives, scientists and informersGet involvedWe’re all in this together – discover ways you can get involved or show your support Support our workIndividuals, organisations and partners – your support makes a big difference"
year_published = 2025
year_updated = 2024
