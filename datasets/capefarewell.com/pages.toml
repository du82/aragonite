["https://www.capefarewell.com/creative-perspectives-on-climate-change"]
title = "Creative Perspectives on Climate Change – Cape Farewell"
full_description = "Creative Perspectives on Climate Change Cape Farewell → Projects → Creative Perspectives on Climate Change A year-long collaboration between Cape Farewell and Francis Holland School, Sloane Square, London Clare Twomey, Specimen Michael Pinsky and Greta Thunberg Ian McEwan, The Hot Breath of our CivilisationMichael Pinsky, Pollution Pods SculptureDavid Buckland, Ice TextsCape Farewell introduction Clare Twomey, SpecimenChris Drury, ExchangeDavid Buckland, The Silver BulletSiobhan Davies, Walking Dance and Endangered SpeciesDavid Buckland, Internal CombustionAntony Gormley, Marker, Three Made PlacesMichael Pinsky, Pollution PodsAntony Gormley, Three Made PlacesAntony Gormley, Marker Clare Twomey, SpecimenDavid Buckland, Another World is PossibleHelen Moore, Dorset Waterbodies, A Common / wealDavid Buckland, Locked in Ice, SpitsburgenLeonid Tishkov, Arctic CartoonsSiobhan Davies, Endangered SpeciesDavid Buckland, The Silver Bullet Education is key to this narrative, working with Francis Holland’s pupils who will live with the consequences of The Climate Challenge. This year-long partnership with Francis Holland School, Sloane Square follows in the footsteps of Cape Farewell’s three youth-led voyages into the High Arctic and the 2023 ‘Our Life is Here’ Marshall Islands Jo-Jikum youth expedition in the Pacific. The climate challenge cuts across all curriculum subjects, science, economics, Mathematics, Literature and The Arts. Over the school year 2024 – 2025, Francis Holland, Sloane Square is partnering with Cape Farewell to bring Creative Perspectives on Climate Change to the FHS community. The collaboration includes an exhibition of Cape Farewell artworks throughout the school, and presentations by Founder and Director David Buckland alongside Head of Francis Holland, Sloane Square, Alexandra Haydon. There are artworks from Sir Antony Gormley, Siobhan Davies, Dame Rachel Whiteread, Ian McEwan, Helen Moore, Michael Pinsky, Chris Drury, and more. Alongside the exhibition, there will be a series of informed workshops spread across the year, from Choreographer Dame Siobhan Davies, Cape Farewell Founder and Director David Buckland, Artist Michael Pinsky, Artist Clare Twomey, Microbiologist Professor Genoveva Esteban and Oceanographer Dr Simon Boxall. Pupils from Francis Holland School and other schools locally will be engaging with the artworks, workshops and talks and producing their own work in response, culminating in a joint exhibition of student and professional work towards the end of the academic year. At the end of the Spring Term, the project will culminate in a combined exhibition, curated by the girls, of the interdisciplinary work that pupils and visiting students from other schools have produced in response to the project, alongside the professional work from the core exhibition. This is about creative thinking, story-telling and social influence- all key skills identified by the World Economic Forum as skills on the rise and essential for the 2030s workforce; and all skills that will empower our pupils to become the leaders, thinkers, innovators, designers, entrepreneurs, and game-changers of tomorrow. “The excitement of presenting The Climate Challenge to the girls and students at Francis Holland school is a sustaining memory. It is their future our generation has bequeathed to them to address, not the best of gifts but one that they have embraced and engaged with, wholeheartedly. With knowledge and creativity, they will, over the year, find ways to narrate their thoughts and solutions to The Climate Challenge across the complete range of the curriculum.” David Buckland, 2024 Click the PDF’s below to read About The Artists: Click the PDF’s below to follow the Artwork Trail: Creative Perspectives on Climate Change Launch Francis Holland School Website Related Projects Previous project – RiverRun Next project – Two new dynamic ecopoetry books"
