["https://www.capefarewell.com/about/policies/equal-opportunities-policy"]
title = "Equal Opportunities Policy – Cape Farewell"
description = "Cape Farewell is committed to building an organisation which values the differences in people and to promoting equality and diversity in what we do."
full_description = "Access PolicyWe recognise that there are many barriers to access and are committed to making our work as accessible as our resources allow Equal Opportunities Policy Cape Farewell → About → Our Policies → Equal Opportunities Policy Cape Farewell is committed to building an organisation which values the differences in people and to promoting equality and diversity in what we do. We provide a safe and welcoming environment where everyone is valued, included and respected, and we foster good relations among those we work with. We are clear that discrimination, harassment and victimisation in any form are not acceptable. Our motivation is more than needing to fulfil our statutory duty. It is an important part of our culture. No worker or person we work with will receive less favourable treatment due to their race, creed, colour, nationality, ethnic or national origin, age, religion or similar belief, gender, gender identity, sexual orientation, marital status, pregnancy and maternity, marriage or civil partnership, membership or non-membership of a trade union, disability or associative disability. We aim to embed our approach in how we: Recruit staff, support their career development and enable them to fulfil their roles; care for and communicate with those we work with, both those engaged by Cape Farewell and members of the public, by taking their needs and circumstances into account; Plan and deliver our work; Consult and engage with all those we work with; Work with contractors who deliver services on our behalf. This policy is applied to all recruitment and projects we undertake by ensuring that: Wherever possible, all vacancies are advertised simultaneously internally and externally; All vacancy advertisements include an appropriate short statement on equal opportunities; All staff and practitioners are recruited in a way that is fair and also positively encourages applicants from under-represented groups; The buildings and venues we work in are accessible; We design our activities and events in a way that promotes diversity and accessibility; Diversity and access considerations are a key driver of project teams’ decision-making processes; Marketing communications (including print and digital) are accessible; partners we work with have an Equal Opportunity Policy; We make all reasonable adjustments to accommodate the needs of people working with us. To monitor whether we have achieved this, Cape Farewell: Asks that all employees, applicants, board members and project personnel complete an Equal Opportunities Monitoring form; Maintains records of employees, applicants, board members and project personnel to monitor diversity within the organisation (this data will be confidential); Where practical, surveys those participating in projects or attending events, to monitor the diversity of those engaging with our work (this data will be confidential and anonymous); Regularly identifies where improvements need to be made and implement strategies to address this. This policy has been reviewed by The Cape Farewell core team in October 2023 Policy to be reviewed in October 2024 See Also Our PoliciesIncluding environmental sustainability, ethical fundraising, privacy and accessibilityWho we areMeet our core team and collaborators including creatives, scientists and informersAccess PolicyWe recognise that there are many barriers to access and are committed to making our work as accessible as our resources allow"
year_published = 2025
year_updated = 2024
clearnet = "https://www.capefarewell.com/about/policies/equal-opportunities-policy"
