["https://www.capefarewell.com/support-us"]
title = "Support our work – Cape Farewell"
description = "Help Cape Farewell create a better future for people and planet – we are all in this together. Your donation will help us balance the financial weight of the carbon industries."
full_description = "Support our work Cape Farewell → Support our work Cape Farewell could not exist without the support of the people who love our work. Every gift, however large or small, makes a big difference to us. Make a Donation Help Cape Farewell create a better future for people and planet – we are all in this together. Your donation will help us balance the financial weight of the carbon industries and their misinformation. We can kick the fossil fuel habit. We make every penny, cent and centime count, delivering a focused and powerful agenda. Cape Farewell’s work is pioneering and we rely on dedicated individuals who love what we do to make change happen. Sponsors & Grantmakers Cape Farewell is a charitable organisation, whose work is made possible by the generous support of our partners and sponsors. For corporate partnerships and Trust/Foundation awards, please contact David Buckland. “Cape Farewell, a wedding of art and science, to heal the earth’s divorce.” Yann Martel Cape Farewell’s Uummannaq Day at Southbank Centre, 2009. Photo: Nathan Gallagher.Cynthia Hopkins, This Clement World, 2012/4Mona Hatoum, Hot Spot, 2006. Installation view, Royal Academy of Arts, London, 2009. Lemn Sissay photographed during Cape Farewell’s 2008 Disko Bay expedition. Photo by Nathan Gallagher.Ackroyd & Harvey, Stranded, 2005–2006. Installation view, Miraikan, Tokyo, 2008. Photo by Kathy Barber.Ian McEwan reads an extract of his book Solar, for Cape Farewell’s Late at Tate at Tate Britain, February 2009.Robyn Hitchcock playing together with KT Tunstall, Graham Coxon and Kathryn Williams at SHIFT’s Maritime Evening. Photo by Nathan Gallagher.London College of Fashion’s Centre for Sustainable Fashion showcase at Queen Elizabeth Hall for SHIFT. Photo by Nathan Gallagher.Marcus Brigstocke performs in the Eden Project’s Mediterranean Biome for Cape Farewell’s Cool Sounds from the Frozen Arctic. Marcus Brigstocke in conversation with Ed Miliband for SHIFT at Queen Elizabeth Hall. Photo by Nathan Gallagher.“SHIFT Encounters” climate workshop during Shift 2010 at Southbank Centre, London. Photo by Nathan Gallagher.Earth Can You Hear Us? flash mob for ArtCOP21. Photo by Gavin Freeborn."
