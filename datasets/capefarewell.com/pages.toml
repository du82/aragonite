["https://www.capefarewell.com/there-goes-the-ice"]
title = "There Goes the Ice – Cape Farewell"
description = "Written by Robyn Hitchcock and performed by Robyn Hitchcoc and KT Tunstall, There Goes the Ice  was inspired by Cape Farewell's Disko Bay Expedition."
full_description = "Unfold bookReleased to accompany the Unfold exhibition, this exquisite book profiles the work of the artists, alongside innovative responses to climate change. Available for £18 Robyn HitchcockEnglish singer-songwriter and psych folk guitarist who also dabbles in most forms of art 2009 Andes ExpeditionOur first expedition outside of the Arctic visited shrinking glaciers, cloud forests, areas of deforestation and the Amazon There Goes the Ice Cape Farewell → Features → Watch → There Goes the Ice By Robyn Hitchcock and KT Tunstall, inspired by Cape Farewell’s Disko Bay Expedition. There Goes the Ice performed by Robyn Hitchcock and KT Tunstall There Goes the Ice Words by Robyn HitchcockMusicians: Robyn Hitchcock and KT TunstallVisual artist/video by David Buckland Written by Robyn Hitchcock and performed by Robyn Hitchcock and KT Tunstall, There Goes the Ice was inspired by Cape Farewell’s Disko Bay Expedition along the remote West Coast of Greenland in 2008. During the voyage, Robyn Hitchcock wrote the song after artist Chris Wainwright asked him to spell our “Here Comes The Sun” with semaphore lights on the deck of the ship. Robyn took the song fresh to KT Tunstall in the next-door cabin and they recorded it there and then. The work featured in Cape Farewell’s exquisite international touring exhibition Unfold, reaching audiences in Beijing, Liverpool, New York, Chicago, Falmouth, Newcastle, London and Vienna, as well as the accompanying Unfold book. See also u-n-f-o-l-dOur exquisite exhibition toured Beijing, New York, Chicago, Vienna and across the UKUnfold bookReleased to accompany the Unfold exhibition, this exquisite book profiles the work of the artists, alongside innovative responses to climate change. Available for £18Robyn HitchcockEnglish singer-songwriter and psych folk guitarist who also dabbles in most forms of artKT TunstallBrit Award winning, Grammy nominated singer/songwriter and firm festival favourite 2009 Andes ExpeditionOur first expedition outside of the Arctic visited shrinking glaciers, cloud forests, areas of deforestation and the Amazon Categories: Watch Posted: 10 September 2008 Related Posts Next – Leafcutter ants Explore more Watch Watch Dr Simon Boxall's lecture at Millfield School Watch Daro Montag's leafcutter ants - an organism in motion Watch Three new poems by Pete (The Temp) Bearder Watch Plasticles: Life in Plastic – an epic poem by Chris White"
