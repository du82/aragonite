["https://www.capefarewell.com/helen-moore"]
title = "Helen Moore – Cape Farewell"
description = "Helen Moore is an award-winning ecopoet, socially engaged artist and writer"
full_description = "Helen Moore Cape Farewell → Profiles → Creatives → Helen Moore Award-winning ecopoet, socially engaged artist and writer Helen Moore Helen received one of Cape Farewell’s RiverRun art commissions, interrogating the environmental impact of Dorset farming on the rivers and waters of Poole Bay. Helen Moore is a British ecopoet, socially engaged artist and writer. She has published three ecopoetry collections, Hedge Fund, And Other Living Margins (Shearsman Books, 2012), ECOZOA (Permanent Publications, 2015), acclaimed by John Kinsella as “a milestone in the journey of ecopoetics”, and The Mother Country (Awen Publications, 2019) exploring aspectsof British colonial history. Helen offers an online mentoring programme, Wild Ways to Writing, and works with students internationally. In 2020 her work was nominated for the Forward and Pushcart Prizes and received grants from the Society of Authors, Royal Literary Fund and Arts Council England. About the RiverRun projectAbout the wAteR-climaTe festivalwww.helenmoorepoet.com"
