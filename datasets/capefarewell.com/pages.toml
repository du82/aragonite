["https://www.capefarewell.com/watershed"]
title = "The WaterShed – Cape Farewell"
description = "The WaterShed is an experimental, station for climate-focused residencies and Cape Farewell's headquarters in Dorset, England."
full_description = "wAteR-climaTe festivalAn inspiring festival bringing climate science to life, timed to coincide with COP26 RiverRunCommissions interrogating the environmental impact of Dorset farming on the rivers and waters of Poole Bay The WaterShed Cape Farewell → Projects → The WaterShed An ecologically designed, experimental station for climate-focused residencies and Cape Farewell’s HQ in Dorset. The WaterShed – Cape Farewell’s HQ in DorsetDavid Buckland at The WaterShed, Cape Farewell’s HQThe WaterShed – Cape Farewell’s HQ in DorsetThe WaterShed – Cape Farewell’s HQ in DorsetThe WaterShed – Cape Farewell’s HQ in DorsetAerial view of The WaterShed, situated among organic farms in Dorset The WaterShed in Dorset is finally completed and the Cape Farewell team are enjoying operating from their new base. For the past two years we’ve been converting an old abandoned trout farm into a climate change “experimental station”. Ecologically designed, and set in an area of outstanding beauty and ecological care, The WaterShed is the brand new office and HQ of Cape Farewell and will become an artists’ studio, offering climate-focused artists’ residencies and climate workshops. This unique site sits among organic farms, close to the world heritage site of the Jurassic coast. See Also wAteR-climaTe festivalAn inspiring festival bringing climate science to life, timed to coincide with COP26RiverRunCommissions interrogating the environmental impact of Dorset farming on the rivers and waters of Poole BaySIRENSA unique take on the climate emergency Related Projects Previous project – Cape Farewell Archive Next project – SIRENS at MAST Studios"
