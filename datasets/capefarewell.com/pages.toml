full_description = "Climate Scientist Dr Andrew Weaver Fellow of the Royal Society of Canada, Canadian Meteorological and Oceanographic Society Marine and Coastal Geoscientist Dr Carol Cotterill Trained as a theatre designer, but a convoluted path led to re-training as a geoscientist, and working for the British Geological Survey British Geological Survey Dave Smith Head of Marine Operations and Engineering at British Geological Survey and involved in the development of remotely operated coring tools Scientist, Broadcaster, Author David Suzuki Scientist, broadcaster, author, and co-founder of the David Suzuki Foundation Biological Oceanographer Dr Debora Iglesias-Rodriguez Interested in the way ocean respond to human perturbation and is currently researching the impact of increasing atmospheric carbon dioxide levels on ocean PH Oceanographer Emily Venables Oceanography PhD student from SAMS, working on the impact of mixing between warm cold ocean currents Geographer Prof Joe Smith Director of the Royal Geographic Society, formerly at the OU specialising in environmental issues Environmental Health Scientist Joy Guillemot Works on the front lines of humanitarian and development action, implementing public health programmes in the context of disasters, conflict, and fragile environments Scientist Maria Salta Completing her PhD on the discovery of novel natural products and biomimetics against marine biofouling organisms Scientist Prof Mark Maslin A leading climatologist with particular expertise in past global and regional climatic change Climate Change Communicator Rhian Salmon Climate change communicator with a PhD in atmospheric chemistry and extensive experience in Antarctica Marine Social Ecologist Ruth Brennan Marine social ecologist in the Centre for Coastal and Oceans Governance at SAMS Oceanographer and Board Member Dr Simon Boxall Lecturer in Ocean and Earth Science at the University of Southampton Biologist Dr Tom Wakeford Biologist and action researcher ba