["https://www.capefarewell.com/2004-expedition"]
title = "2004 Expedition – Cape Farewell"
description = "Cape Farewell's 2004 Art/Science Expedition circumnavigating the main island of Svalbard, sailing almost as far north as possible"
full_description = "Art & Climate ChangeOur first major touring exhibition created in partnership with the Natural History Museum Art From The ArcticOur first film, directed by David Hinton and co-produced by the BBC, seen by a worldwide audience of over 12 million in TV broadcasts and film festivals across the world Burning IceCape Farewell’s first major book title, republished in 2016 to mark it’s 10th anniversary. Available for £20 2004 Expedition Cape Farewell → Archive → Expeditions → 2004 Expedition Circumnavigating the main island of the Svalbard archipelago and sailing almost as far north as possible. Walking on an ice cap during the 2004 Art/Science Expedition, Svalbard. Photo by Ackroyd & Harvey.Glacier ice at the foot of Kongsvegen Glacier. September 2004. Max Eastley recording sound during the 2004 Art/Science Expedition, Svalbard.Old research station hut at Kinnvika. Photo by Alex Hartley.Gautier Deblonde, Svalbard, 2004Dr Simon Boxall at the helm of the Noorderlicht during Cape Farewell’s 2004 expedition.Alex Hartley on the bowsprit of the Noorderlicht, Hinlopen Straight, Svalbard, 2004. 10–26 September 2004Longyearbyen – Kinvika – TromsøCircumnavigating Spitsbergen The second Cape Farewell Art/Science Expedition launched on the 10th September 2004 with the objective of creating art works towards an exhibition in 2006, developing a new GCSE science education module and conducting oceanography measurements and experiments in partnership with the National Oceanography Centre, Southampton. The voyage combined the arts, science and media with the adventure of the High Arctic expedition. The Cape Farewell crew circumnavigated Spitsbergen, the main island of the Svalbard archipelago, aboard the Noorderlicht – sailing almost as far North as possible. The oceans they sailed hold the key to measuring and understanding how the planet is warming and to what degree this will effect our urban lives. The on board scientists involved the whole crew in ocean experiments that monitored these seas – revealing the information and secrets locked under this cold and icy surface. The artists continued their work with the scientists, being inspired by the ice, seas and extreme environment to find new and innovative ways to represent this extraordinary place and the implications of climate change. “Was that pale blue dream true? … It was a journey to another world without the galling necessity of death. The desolation and absoluteness of the 80th parallel and its neighbourhood wrestles with everything we carry around in our choice-drowned heads. Its pared-down world of clicking ice and sharp air, its spectral animals and light games, these are True. To hell with Real.” Michèle Noach Supported by Nesta, Arts Council England, British Council: Norway, Lighthouse Foundation, the Geographical Association, Greenpeace Environmental Trust and Somerset House. Proud to partner with National Oceanography Centre: Southampton, the Royal Navy, RSA Arts & Ecology, Big Heart Media, Bullet Creative and Oceanwide Expeditions. Meet the crew David Buckland – Expedition leader and artist Dr Simon Boxall – Oceanographer Quentin Cooper – Presenter of BBC Radio 4’s Material World Max Eastley – Musician/sound recordist David Hinton – Film director Heather Ackroyd – Artist Dan Harvey – Artist Alex Hartley – Artist Gautier Deblonde, Artist Sarah Fletcher – Oceanographer Michèle Noach – Artoonist Nick Edwards – Artist Colin Izod – Director, Big Heart Media Kathy Barber – Artist and designer Michael Vingoe – Teacher Albert Bailey – Sound recordist, Big Heart Media Philip Chavannes – Cameraperson, Big Heart Media Joe Chapman – Cameraperson and technical advisor, Big Heart Media Sean Buckland – Student Emily Boxall – Student Partners and sponsors Cape Farewell is a charitable organisation made possible through sponsorship, partnerships and donations. We would like to thank the following companies and organisations for their generous support in making the 2004 Art/Science Expedition possible: Nesta Arts Council England National Oceanography Centre, Southampton The Royal Navy British Council, Norway Lighthouse Foundation Geographical Association Greenpeace Environmental Trust RSA Arts & Ecology Somerset House Big Heart Media Bullet Creative Oceanwide Expeditions Among the key expedition sponsors were NESTA, the National Endowment for Science, Technology and the Arts, an organisation that invests in UK creativity and innovation. Set up by Act of Parliament in 1998, NESTA uses the interest on a National Lottery endowment to pioneer ways of supporting and promoting innovation and creativity across science, technology, the arts and learning. NESTA was created to invest at the highest point of risk, and offer individuals, groups and small businesses the time, space, money and support to push at the frontiers of knowledge and practice. See Also Art & Climate ChangeOur first major touring exhibition created in partnership with the Natural History MuseumArt From The ArcticOur first film, directed by David Hinton and co-produced by the BBC, seen by a worldwide audience of over 12 million in TV broadcasts and film festivals across the world Burning IceCape Farewell’s first major book title, republished in 2016 to mark it’s 10th anniversary. Available for £20 Related Projects Previous project – 2003 Expedition Next project – 2005 Expedition"
