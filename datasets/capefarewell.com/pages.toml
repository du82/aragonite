["https://www.capefarewell.com/pollution-pods-un-climate-summit-2019"]
title = "Pollution Pods at the UN Climate Summit – Cape Farewell"
description = "Commissioned by the World Health Organization (WHO), Cape Farewell installed Michael Pinsky's immersive artwork Pollution Pods on the North Lawn of the United Nations Headquarters"
full_description = "Pollution Pods at COP25World leaders are urged to experience the viscerally powerful Pollution Pods at COP25 in Madrid Pollution Pods European TourPollution Pods visit Klimahaus and headline the UN WHO’s first Global Conference on Air Pollution and Climate Change News Things Unspoken presents new work by artists Anne Bevan and Andrea Roe – part of our Sea Change programme Pollution Pods at the UN Climate Summit Cape Farewell → News → Pollution Pods at the UN Climate Summit 21–24 September 2019UN SG Climate SummitUnited Nations HQ, New York Greta Thunberg (centre) visits Michael Pinsky’s (left) Pollution Pods at the 74th United Nations General Assembly in partnership with the World Health Organization in New York, 2019.Greta Thunberg visits Michael Pinsky’s Pollution Pods at the 74th United Nations General Assembly in partnership with the World Health Organization in New York, 2019.Greta Thunberg (centre) visits Michael Pinsky’s (left) Pollution Pods at the 74th United Nations General Assembly in partnership with the World Health Organization in New York, 2019.Michael Pinsky’s Pollution Pods at the 74th United Nations General Assembly in partnership with the World Health Organization in New York, 2019.Michael Pinsky’s Pollution Pods at the 74th United Nations General Assembly in partnership with the World Health Organization in New York, 2019. World leaders are urged to experience the viscerally powerful artwork at the UN headquarters this September, at the 74th United Nations General Assembly in partnership with the World Health Organization. Commissioned by the World Health Organization (WHO), Cape Farewell installed Michael Pinsky’s immersive artwork Pollution Pods on the North Lawn of the United Nations Headquarters from 21–24 September 2019, urging world leaders to act on climate and clean up our air. As part of the Clean Air Initiative, in which governments must commit to making our air safe by 2030 at the latest, and to encourage urgent action on climate change for the sake of our health, the World Health Organisation (WHO) is urging world leaders, youth activists and the media to walk through this viscerally powerful art installation during the UN Youth Climate Summit, the UN Climate Action Summit, the HL meeting on UHC, and the UN General Assembly. Cape Farewell thanks the following local suppliers for their support with the project in New York: Camp Production Services, Stonewolf Contracting and Event Engineering & Operations. About the Pollution PodsRead the reviews See Also Pollution PodsAn immersive installation by Michael PinskyPollution Pods at COP25World leaders are urged to experience the viscerally powerful Pollution Pods at COP25 in MadridPollution Pods European TourPollution Pods visit Klimahaus and headline the UN WHO’s first Global Conference on Air Pollution and Climate Change Categories: Feature News Tags: Pollution Pods Posted: 21 September 2019 Related Posts Previous – Costing the Earth – Art and the Environment Next – Pollution Pods at COP25 Explore more News Listen to David Buckland's radio interview with Simon Parkin on BB Radio Somerset News Nick Drake launches a new collection of poetry The Farewell Glacier News Cape Farewell's website wins distinction in the 2006 Webby Awards News Things Unspoken presents new work by artists Anne Bevan and Andrea Roe – part of our Sea Change programme"
