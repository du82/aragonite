full_description = "All Complete List of Creatives See all the creatives who have voyaged and worked with us over the years Artists Ackroyd & Harvey Artists and often collaborators whose time-based works have an intrinsic bias towards process and event Adrian Newton Adrian Newton Professor in Conservation Ecology at Bournemouth University. Adrian Newton is part of Cape Farewell’s RiverRun project, interrogating the environmental impact of Dorset farming on the rivers and waters of Poole… Artist Adriane Colburn Creates installations and maps that seek to investigate changes in the natural and urban landscape Artist Alex Hartley British artist who confronts our experiences and understanding of the built and natural environments Artist Annie Cattrell Artist whose practice is informed by working with specialists in neuroscience, meteorology, engineering and psychiatry Artist Antony Gormley One of the UK's most iconic artists, using the human form to explore man's existence in and relation to the world Architect Bob Davies Architect and environmentalist with an interest in how architecture and the environment affect human health Artist Chris Wainwright Artist, curator, professor and former Pro Vice-Chancellor of the University of the Arts London Artist, Poet, Choreographer and Collaborator Clare Whistler Artist, Poet, Choreographer and Collaborator Clare makes work in performance, site-specific work in the landscape, poetry, music and visual art. Her international career as a dancer, choreographer and director has… Performance Artis Cynthia Hopkins Creates unique multi-media performance pieces which intertwine truth and fiction Artist, Lecturer and Researcher Daro Montag Artist who works with living organisms and natural processes Founder and International Director David Buckland Artist, designer, film-maker, founder and international director of Cape Farewell Photographer Donald Weber Award winning photographer who investigates global climate change as a social process,