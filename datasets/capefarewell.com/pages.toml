full_description = '''Take Me To The River 15th March 2025 Work with scientists and conservationists ‘in the field’ for a free, exciting, hands-on workshop at The WaterShed on Saturday 15th March. Waverley Street Foundation: Cultivating Community Cape Farewell join Waverley Street Foundation and over 225 grantee partners in Mexico City. Online book launch event for river / run by Helen Moore river / run, an ecopoetic trilogy: an online launch with Dr Helen Moore and David Buckland. Get involved Cape Farewell → Get involved Don't miss Take Me To The River 15th March 2025 Work with scientists and conservationists ‘in the field’ for a free, exciting, hands-on workshop at The WaterShed on Saturday 15th March. Waverley Street Foundation: Cultivating Community Cape Farewell join Waverley Street Foundation and over 225 grantee partners in Mexico City. Online book launch event for river / run by Helen Moore river / run, an ecopoetic trilogy: an online launch with Dr Helen Moore and David Buckland. Take Me To The River 2024 A free science day in March 2024 workshop held at Cape Farewell HQ Current ProjectsInspiring meaningful dialogue and action, and communicating the urgency of the global climate challenge Artist ResidenciesAt our experimental station for climate-focused residencies The WaterShed in Dorset OpportunitiesFind recent opportunities including open calls for artists, residencies, jobs and more Support our workIndividuals, organisations and partners – your support makes a big difference SubscribeAdd your voice – subscribe to our mailing list for the latest news and projects FollowWe’re all in this together – find our latest posts and connect with us on social media Follow (function () { var timer, abortTimer; timer = setInterval( function() { if ( window.jQuery ) { clearInterval( timer ); afterContentArrived( window.jQuery ); } }, 67); abortTimer = setTimeout( function () { if ( !window.jQuery ) { clearInterval( timer ); console.log('FLOW-FLOW DEBUG MESSAGE: No jQ