title = "Expeditions – Cape Farewell"
description = "Using the notion of expedition – Arctic, island, urban and conceptual – to interrogate the scientific, social and economic realities that lead to climate disruption."
full_description = "Marshall Islands 2023 Expedition The 30 strong powerful team sailed to the heart of The Marshall Islands Scotland’s Northern Islands 2013 Expedition Our second Sea Change expedition, exploring Scotland’s Northern Islands Scottish Islands 2011 Expedition A month-long expedition by boat across the Western Isles of Scotland from Oban to Lewis Svalbard and Spitsbergen 2010 Arctic Expedition Sailing north of the 80th parallel to the ice edge from Spitsbergen Andean Rainforests, Peru 2009 Andes Expedition Our first expedition outside of the Arctic visited shrinking glaciers, cloud forests, areas of deforestation and the Amazon West Coast of Greenland 2008 Disko Bay Expedition Exploring the spectacular Disko Bay with a crew dominated by an international array of musicians Svalbard to Greenland 2007 Expedition An epic journey sailing over 1800 nautical miles and encountering gale force nine winds, with an crew of creatives and scientists Locked in Ice, Spitsbergen 2005 Expedition Battling temperatures of -30°C to join the Noorderlicht locked in ice at Tempelfjorden, just north of the 79th parallel Circumnavigating Spitsbergen 2004 Expedition Circumnavigating the main island of the Svalbard archipelago and sailing almost as far north as possible Spitsbergen via Bear Island 2003 Expedition Cape Farewell's first Arctic expedition - a voyage that took them from Tromsø to Spitsbergen via Bear Island Svalbard and Greenland Youth Expeditions Taking young people to some of the most fragile ecosystems of our planet to witness dramatic environmental changes"
