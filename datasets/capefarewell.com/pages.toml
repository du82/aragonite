["https://www.capefarewell.com/about/policies/access-policy"]
title = "Access Policy – Cape Farewell"
description = "Cape Farewell believe that all people and sectors of the community have an equal and fundamental right to engage with our work. We recognise that there are many barriers to access."
full_description = "Equal Opportunities PolicyValuing differences in people and promoting equality and diversity in what we do Safeguarding PolicyCreating an environment where the welfare of children, young people and adults at risk is of paramount importance Access Policy Cape Farewell → About → Our Policies → Access Policy Cape Farewell believes that all people and sectors of the community have an equal and fundamental right to engage with our work. We will provide welcoming and accessible opportunities for different audiences and promote our activities and work through accessible means of communication. We adhere to national statutes of law, including the Equality Act 2010 and the Disability Discrimination Act 2005, and follows national standards, ethical codes and best practice guidelines. We use the social model of disability, based on the principle that disability is caused by the way society is organised, rather than by a person’s impairment or difference. We define access as something that is made possible when physical, cultural, social, sensory, intellectual, financial, emotional or attitudinal barriers are identified and removed or reduced. To do this and ensure equality of access we will consider the following aspects of accessibility: Physical: enabling people with physical disabilities, the elderly and those caring for young people to reach and engage with Cape Farewell’s activities and work, both in terms of physical access to venues, locations, etc, and in terms of access of experiencing work, such as captioning, audio description, etc Sensory: where possible, to consider and build in a wide range of different sensory experiences Intellectual/ Literacy: we acknowledge that people have different learning styles and reading ability levels and will adopt a clear and accessible written style and allow for those engaging with us to use alternative communication forms, such as video applications / submissions, etc Cultural: we acknowledge and recognise cultural differences and seek to represent varied cultural experiences and issues Emotional / Attitudinal: to ensure that all who work with or engage with Cape Farewell feel welcomed and valued Financial: we will aim to minimise financial barriers to activities and work We will ensure delivery of this policy in a number of ways, including: Consultation with a range of advisors, consultants and community representatives Seeking out and adopting best practice guidance Consideration of varied audience needs and learning styles in programme planning Consideration of access issues and barriers Consultation with audiences and non-users to ensure development of the broadest possible access Ensure that partner venues have access policies and provisions Ensure that contractors and outside agencies working for, or with Cape Farewell adopt and observe our access policy or have a similar policy in place. Useful Resources See Graeae’s Access Essentials document below for an essential guide to access tools, language, tips for venue accessibility and more.Access Essentials guide PDF 812Kb See Also Our PoliciesIncluding environmental sustainability, ethical fundraising, privacy and accessibilityEqual Opportunities PolicyValuing differences in people and promoting equality and diversity in what we doSafeguarding PolicyCreating an environment where the welfare of children, young people and adults at risk is of paramount importance"
