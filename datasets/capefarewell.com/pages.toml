["https://www.capefarewell.com/2011-expedition"]
title = "2011 Expedition – Cape Farewell"
description = "Cape Farewell's 2011 Scottish Islands Expedition was our first Sea Change expedition, a month-long expedition by boat across the Western Isles of Scotland from Oban to Lewis."
full_description = "Sea ChangeA four-year programme of research and making across Scotland’s western and northern isles Working the MapBeautiful artists’ book by John Cumming documenting social and ecological change across Scotland’s Northern Isles. Available for £9.99 2011 Expedition Cape Farewell → Archive → Expeditions → 2011 Expedition Our first Sea Change expedition, a month-long expedition by boat across the Western Isles of Scotland from Oban to Lewis. Sheep pens in Village Bay, St Kilda. Photo by Ruth Little during Cape Farewell’s 2011 Scottish Islands Expedition. Photo by Annie Cattrell during Cape Farewell’s 2011 Scottish Islands Expedition. Mingulay, Barra, Vatersay. Photo by Ruth Little. 15 July–12 Aug 2011Scottish Islands Expedition This July Cape Farewell marks its 10th anniversary and embarks on its biggest project yet, in partnership with Cove Park: a four-week expedition by boat across the western isles of Scotland. After 10 years exploring distant environments (Arctic and Andes), Cape Farewell brings its focus to local frontiers, to investigate climate impacts closer to home and engage with inspiring models of resilience and adaptation. The engagement begins with four, week-long voyages (15 July–12 August 2011) across the Scottish islands, each with a crew of up to 12 artists and scientists. Travelling on a marine mammal research vessel, the Song of the Whale, from Oban via the Small Isles, Skye and the Inner and Outer Hebrides to St Kilda, Harris, Lewis and the Shiants, the journey will explore the impact of climate change on island cultures and ecologies, and investigate stewardship projects which are revitalising the relationship between communities and their contexts. Explore the blog4 weeks, 32 artists, 9 scientists, 1 boat – follow the voyage as we sail across Scotland’s western isles Meet the crew41 artists, storytellers, film makers, architects, acclaimed Gaelic singers, community leaders, scientists, poets and a chef The expedition crew includes island artists, storytellers, film makers, playwrights, architects, designers, musicians, community leaders, social scientists, ecologists, marine biologists, oceanographers, poets, acclaimed Gaelic singers and a chef. Their experiences during the voyage will be shared via the expedition blog. This expedition is part of Sea Change, Cape Farewell’s four-year programme of research and making across Scotland’s western and northern isles. Supported by Creative Scotland, Arts Council England, The Bromley Trust, Eden Project and Lighthouse Foundation. Expedition crew The expedition crew of 41 featured: Award-winning novelist/filmmaker Xiaolu Guo Sailor Jo Royle – best known for sailing from America to Australia in a catamaran made entirely from plastic bottles Gaelic singers Julie Fowlis, Mary Jane Lamond and Mary Smith Artists Alison Turnbull and Annie Cattrell Theatre maker David Harradine Playwright Iain Finlay Macleod Storyteller Ian Stephen Poet Jo Shapcott Chef Oliver Rowe Environmental scientist Debora Iglesias-Rodriguez And many more… Explore all crew profiles on the blog Partners and supporters We are working together with a wide range of amazing institutions, organisations and communities: Cove Park, National Oceanography Centre, Scottish Association for Marine Science, International Centre for Island Technology, Scottish National Heritage, Comhairle Nan Eilean Siar, Storas Uibhist, Barra & Vatersay, Eigg Heritage Trust, Global Islands Network, University of Western Scotland, University of the Highlands and Islands, Sabhal Mor Ostaig, An Tobar, An Lanntair, Taigh Chearsabhagh, Historic Scotland, Siar FM, National Trust for Scotland, Canna Community Association, RSPB Balranald, Machair Life and SEALL Arts. And many thanks for the support of Creative Scotland, Arts Council England, The Bromley Trust, Eden Project and Lighthouse Foundation. About Sea Change Cape Farewell’s Sea Change is a four-year programme of research and making across Scotland’s western and northern isles that has grown out of the gathering at Cove Park in 2010. Sea Change involves over 30 UK and international artists and scientists, working collaboratively and independently to consider the relationships between people, places and resources in the context of climate change. Part of the London 2012 Festival and the Year of Creative Scotland, the project will culminate during the Glasgow 2014 Commonwealth Games.Find out more Visit the expedition blog See Also Sea ChangeA four-year programme of research and making across Scotland’s western and northern isles2013 ExpeditionOur second Sea Change expedition, exploring Scotland’s Northern IslandsWorking the MapBeautiful artists’ book by John Cumming documenting social and ecological change across Scotland’s Northern Isles. Available for £9.99 Related Projects Previous project – 2010 Arctic Expedition Next project – 2013 Expedition"
