title = "Marfa Dialogues NY: Climate is Culture – Cape Farewell"
description = "Listen to Marfa Dialogues New York: Climate is Culture featuring Mel Chin, Tom Ackers, Melanie Gilligan, David Buckland, Tom Rand and Hamil Hamilton in conversation."
full_description = "Feature Listen to BBC Radio 4's Costing the Earth: Art and the Environment show featuring David Buckland Marfa Dialogues NY: Climate is Culture Cape Farewell → Features → Feature → Marfa Dialogues NY: Climate is Culture A discussion about climate change and sustainability hosted by Ballroom Marfa, featuring creatives, scientists and entrepreneurs from the Carbon14 exhibition. Listen to Marfa Dialogues NY: Climate is Culture from Oct 2013 – featuring artists Mel Chin, Tom Ackers, Melanie Gilligan, David Buckland, Cleantech specialist Tom Rand and environmental lawyer Hamilton Fish (moderator) in conversation about climate change, sustainability and Cape Farewell’s Carbon 14 exhibition. This conversation builds on Cape Farewell’s Carbon 13 exhibition at Ballroom Marfa, Texas in 2012, and the related event Marfa Dialogues: Art and Environmental Activism – a three-day symposium of conversations around climate change and sustainability with artists, performers, writers, scientists and entrepreneurs including Rebecca Solnit. Marfa Dialogues: Art and Environmental Activism panel discussion, part of Cape Farewell’s Carbon13 exhibition at Ballroom Marfa, Texas. Photo by Lesley Brown. Marfa Dialogues NY, organized by Ballroom Marfa in collaboration with the Rauschenberg Foundation, featured two months of programming including community forums, art exhibitions, musical performances, and panels in New York City to engage a deeper examination of climate change. The programme ran between 1 Oct–30 Nov 2013. Carbon 14: Climate is culture exhibitionBallroom Marfa: Marfa Dialogues NYBallroom Marfa: Marfa Dialogues 2012 Categories: Feature Posted: 31 August 2012 Related Posts Previous – A Boot Room in The Frozen North Next – The Trial of David Suzuki Explore more Feature Listen to BBC Radio 4's Costing the Earth: Art and the Environment show featuring David Buckland Feature David Suzuki stands accused of seditious libel. Is he talking treason or reason? Feature Climate is still an emergency in the age of Covid-19 Feature Siren Call: the power of performance poetry"
