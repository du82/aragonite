description = "Discover Daro Montag’s fascinating Leafcutter ants artworks inspired by Cape Farewell’s Andes expedition to the Amazon rainforest and exhibited with their Unfold exhibition."
full_description = "Unfold bookReleased to accompany the Unfold exhibition, this exquisite book profiles the work of the artists, alongside innovative responses to climate change. Available for £18 2009 Andes ExpeditionOur first expedition outside of the Arctic visited shrinking glaciers, cloud forests, areas of deforestation and the Amazon Leafcutter ants Cape Farewell → Features → Watch → Leafcutter ants Discover Daro Montag’s fascinating Leafcutter ants artworks created during the 2009 Andes expedition, and featured in the Unfold exhibition and book. Daro Montag, Leafcutter ant drawing, Amazon rainforest, 2009 Leafcutter ants – an organism in motionHarvesting food supplies from a distant locationFollowing ingrained patterns of behaviour. An oily line of carbon disrupts their path.What happens when they encounter this totally unexpected intrusion into their world?What choices do they have?What decisions do they make?Can they learn from experience and adapt to the new circumstances?Can they incorporate this knowledge into their worldview? In what way is our behaviour reflected in that of the ants?In what way does their behaviour mirror ours? What responses will we make as carbon completely changes our world? Daro Montag’s Leafcutter ants works were part of Cape Farewell’s exquisite international touring exhibition Unfold, reaching audiences in Beijing, Liverpool, New York, Chicago, Falmouth, Newcastle, London and Vienna. They were also featured in the accompanying Unfold book. Watch Daro’s footage of the leafcutter ants in action below, filmed during the 2009 Andes Expedition, Cape Farewell’s first expedition outside the Arctic, an 18 day trek through shrinking glaciers, cloud forests, lower forests, areas of deforestation and the Amazon. Daro Montag and Leafcutter ants, digital video by Matt Wainwright, 2009 See also u-n-f-o-l-dOur exquisite exhibition toured Beijing, New York, Chicago, Vienna and across the UKUnfold bookReleased to accompany the Unfold exhibition