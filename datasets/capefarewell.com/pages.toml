["https://www.capefarewell.com/online-book-launch-event-for-river-run-by-helen-moore"]
title = "Online book launch event for river / run by Helen Moore – Cape Farewell"
description = "river / run, an ecopoetic trilogy: an online launch with Dr Helen Moore and David Buckland."
full_description = "RiverRunCommissions interrogating the environmental impact of Dorset farming on the rivers and waters of Poole Bay Online book launch event for river / run by Helen Moore Cape Farewell → Events → Online book launch event for river / run by Helen Moore A free online launch for river / run, an ecopoetic trilogy (Cape Farewell Books, Oct 2024) by internationally acclaimed ecopoet, writer and academic, Dr Helen Moore. river / run an ecopoetic trilogy by Helen MooreHelen Moore with a section of ‘Dorset Waterbodies’ at the Atkinson Gallery, Somerset, 2024 Credit: Moment PhotographyHelen Moore, photo by Sally BergPictish stone carving of goose and salmon in the National Museum of Scotland, 7th Century, photo by Helen MooreNiusia Winczewska and Hanien Conradie, Animate Earth Collective (with Spiritlab Ceramics)David Buckland, photo by Brock Scott river / run, an ecopoetic trilogy: an online launch with Dr Helen Moore and David Buckland. Climate is culture: where creativity shapes our ecological future A free online launch for river / run, an ecopoetic trilogy (Cape Farewell Books, Oct 2024) by internationally acclaimed ecopoet, writer and academic, Dr Helen Moore. David Buckland, the founder and director of Cape Farewell, will introduce Helen and the RiverRun project, which between 2020-21 brought together artists and scientists to explore the climate impacts and pollution affecting the Poole Bay watershed in Dorset and the wild Atlantic Salmon who live and breed there. Helen will read from her new book, a trilogy of longform landscape ecopoems about British rivers and Salmon. The reading will be followed by a Q&A. Endorsements for river / run ‘Helen Moore is a poet of the luminous present and a precursor of ecopoetics. When asked by the public for contemporary poets writing about the natural world, Helen Moore is the first on our list of recommendations.’ Chris McCabe, Head Librarian, Poetry Library, London ‘Helen has the extraordinary ability to understand and digest the complex scientific concepts and processes that take place in the natural world, translating them into inspiring poems. As a scientist, I recognise the significant value these poems contribute to our field. They serve as a powerful instrument to connect with communities that traditional scientific communication struggles to reach.’ Professor Genoveva F. Esteban, Bournemouth University, UK ‘The story of the endangered Atlantic salmon, that most iconic and romantic of animals, is in desperate need of telling, and Helen’s stunning poems about its almost mythical life cycle grasp the baton that Ted Hughes left with works such as ‘October Salmon.’’ Jim Murray, actor and activist To attend the launch on Tuesday 26th November 7-8.30pm, please book your free ticket via the Eventbrite link below, and you will receive the zoom link. Book your free tickets here Purchase Helen’s book here See Also RiverRunCommissions interrogating the environmental impact of Dorset farming on the rivers and waters of Poole BaySIRENSA unique take on the climate emergencyPollution PodsAn immersive installation by Michael Pinsky See Also Previous event – Creative Perspectives on Climate Change Launch Next event – Waverley Street Foundation: Cultivating Community"
