["https://www.capefarewell.com/waverley-street-foundation-cultivating-community"]
title = "Waverley Street Foundation: Cultivating Community – Cape Farewell"
description = "Cape Farewell join Waverley Street for Cultivating Community, hosted in Mexico City"
full_description = "Waverley Street Foundation: Cultivating Community Cape Farewell → Events → Waverley Street Foundation: Cultivating Community Cape Farewell join Waverley Street Foundation and over 225 grantee partners in Mexico City In October 2024, Director David Buckland and Manager Lily Lloyd were invited by Waverley Street Foundation to attend the inaugural Cultivating Community, hosted in Mexico City. The convening consisted of over 225 grantee partners, with workshops, lectures, collaboration, and connecting with other global grantees. David and Lily participated in future-focused workshops to cultivate approaches to climate solutions, including speed networking and journey mapping. They were immersed in art, music, poetry and trying incredible locally sourced food. They shared strategies for tackling climate challenges by creative problem solving and engaged in enriching and dynamic conversations with global grantee partners. Waverley Street Foundation All of the grantees and facilitators at Waverley Street Foundation’s Cultivating Community gathering See Also Previous event – Online book launch event for river / run by Helen Moore Next event – Take Me To The River 15th March 2025"
