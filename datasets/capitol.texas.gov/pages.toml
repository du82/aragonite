["https://capitol.texas.gov/Calendars/CalendarsHouse.aspx"]
title = "Texas Legislature Online - House Calendars"
full_description = "View House Calendars View house calendars for a specific date. View house calendars for upcoming dates. View house calendars for a specific legislature. House Calendars The house rules provide for four types of calendars: the Daily House Calendar, which contains a list of new bills and resolutions scheduled by the Committee on Calendars for consideration by the house; the Supplemental House Calendar (prepared by the Committee on Calendars), which may contain: (a) measures passed to third reading on the previous day; (b) measures on the Daily House Calendar for a previous day that were not reached for consideration; (c) measures on the Daily House Calendar for the current day; (d) postponed business from a previous day; and (e) notice to call from the table a measure laid on the table subject to call on a previous day; the Local, Consent, and Resolutions Calendar, which contains a list of local or noncontroversial bills scheduled by the Committee on Local and Consent Calendars for consideration by the house; and the Congratulatory and Memorial Calendar, which contains a list of congratulatory and memorial resolutions and motions scheduled by the Committee on Rules and Resolutions for consideration by the house. List of Items Eligible for Consideration This list is prepared by the chief clerk of the house, upon request of the speaker, when the volume of legislation warrants (normally during the last few weeks of a regular session). The list, which must be distributed six hours before it may be considered, contains: (1) house bills with senate amendments eligible to be considered; (2) senate bills for which the senate has requested the appointment of a conference committee; and (3) conference committee reports eligible to be considered. View full explanation of house calendar process"
year_published = 2025
clearnet = "https://capitol.texas.gov/Calendars/CalendarsHouse.aspx"
tags = ["bills", "calendar", "calendars", "committee", "committees", "consideration", "contact", "day;", "help", "home"]
