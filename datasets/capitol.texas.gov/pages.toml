full_description = '''//<![CDATA[ var theForm = document.forms['Form1']; if (!theForm) { theForm = document.Form1; } function __doPostBack(eventTarget, eventArgument) { if (!theForm.onsubmit || (theForm.onsubmit() != false)) { theForm.__EVENTTARGET.value = eventTarget; theForm.__EVENTARGUMENT.value = eventArgument; theForm.submit(); } } //]]> function CSP_focus(id) { var o = document.getElementById(id); if (o != null) o.focus(); } Login E-mail Address: Remember Me Password: Account Options: New User? | Forgot Password? | Delete Account | Change E-mail Address //<![CDATA[ var Page_ValidationSummaries = new Array(document.getElementById("PageValidationSummary")); //]]> //<![CDATA[ var PageValidationSummary = document.all ? document.all["PageValidationSummary"] : document.getElementById("PageValidationSummary"); PageValidationSummary.displaymode = "List"; //]]> CSP_focus('txtEmailAddress'); MyTLO Features The MyTLO section of the Texas Legislature Online website offers personalized viewing of legislative content. Bill List: A custom list of bills created by: Manually entering the bill number Adding the bill number from the bill history page or bill or text search results page Adding all the bills from a bill search result set Bill Alert: Receive e-mail notification when bills on this custom list have selected significant actions added. Bills are added by: Manually entering the bill number Adding the bill number from the bill history page Adding the bill number from a text or bill search results page Bill Subject: Receive alerts when bills are assigned a specific subject. Other alerts: Receive e-mail notification when selected calendars, committee hearing notices, committee minutes are posted, or the house/senate adjourn. Access RSS feeds for legislative content through your favorite newsreader software. Access legislative content on your wireless mobile device. Save your bill, amendment, and text searches to use later. Usage of the bill list, alert list, and saved search features requires registration. Service is FREE of charge (privacy policy). NOTE: Bill alerts are removed prior to the prefiling period for each regular session. Once prefiling begins, bill alerts will remain intact until the next prefiling period.'''
