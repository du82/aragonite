["https://capitol.texas.gov/Resources/StateLinks.aspx"]
title = "Texas Legislature Online - State Government Resources"
full_description = "Texas Executive Branch Governor's Office This site provides access to the governor’s press releases and speeches, as well as information regarding initiatives and appointments. Lieutenant Governor's Office This page provides biographical and other information about the lieutenant governor, including the duties of the office, with links to the lieutenant governor’s press releases and speeches. Secretary of State This site provides access to on-line versions of the Texas Register, Texas Administrative Code, and the Uniform Commercial Code, as well as access to elections and voter registration data, the Texas Border and Mexican Affairs Division, and business and nonprofit organization forms and the statutes that create or affect such organizations. Comptroller of Public Accounts This site, which provides a fiscal overview of Texas government, contains information about Texas taxes and revenue, the Texas economy, and the Texas Performance Review. On-line periodicals include Fiscal Notes, Tax Policy News, Texas Innovator, Statewise, and others. General Land Office This site offers information about the agency and updates on programs that it oversees, such as Adopt-a-Beach, oil-spill prevention and response, alternative fuels and alternative energy development, and various coastal preservation and management programs. The site also provides information on state-owned submerged lands through the agency's Energy Land and Lease Inventory System. Attorney General's Office This site provides access to attorney general opinions, letter opinions, open records decisions, open records and open meetings handbooks, and press releases of the attorney general. Texas Legislative Branch House of Representatives This site includes information on house membership, committees, and calendars. Committee information includes hearing schedules, audiovisual files of hearing deliberations, and interim study assignments. Speaker of the House This site provides biographical and other information about the speaker and about the powers and duties of the office. Senate This site provides information on senate membership, committees, and--during the legislative session--agenda items, including gubernatorial nominations awaiting senate confirmation. Committee information includes hearing schedules, audiovisual files of hearing deliberations, and interim study assignments. President of the Senate (Lieutenant Governor’s Office) This page provides biographical and other information about the lieutenant governor, including the duties of the office, with links to the lieutenant governor’s press releases and speeches. Legislative Budget Board This site offers a description of the board and its duties, member and staff information, the calendar for schedules and hearings, and on-line LBB documents, including the Texas Fact Book and the General Appropriations Act. Legislative Reference Library This site provides legislative information such as a list of all amendments to the Texas Constitution and bills vetoed between 1895 and 2001; tables that cross-reference chapters of session laws to bill number and vice versa; an index to the sections of statutes affected by bills; the number of bills introduced, passed, and vetoed; and interim committee charges and reports. It also includes directions on how to compile legislative history. State Auditor's Office This site provides the text of reports released by the auditor since April 1996; an electronic hotline for reporting fraud, waste, or abuse at a Texas state agency or college or university; manuals and guides relating to financial statements, best practices, audits, bonds, and performance development reviews; statistical and analytical tools; and more. State Preservation Board This board is the entity responsible for the preservation and maintenance of the Texas Capitol and its grounds. This site provides related historical information, visitor and tourist information, and a link to the Texas State History Museum website. Sunset Advisory Commission This site lists schedules for current and future sunset reviews. It includes recent sunset reports and self-evaluations by state agencies that are up for review in the next sunset cycle. It also lists all agencies subject to sunset review and gives each agency’s last and next sunset review dates. Texas Legislative Council This site describes the council’s legal, research, redistricting, information systems, and other services in behalf of legislators. It includes various council publications and gives procedures and price information for requests by the public of certain legislative documents. Texas Judicial Branch Supreme Court This site provides information about the justices; includes search capabilities on case and attorney information from the Case Management System and full text searches of orders and opinions; and offers automatic e-mail updates on case status. Court of Criminal Appeals This site provides information about the court, the justices, and court opinions and issues and includes a searchable appellate court index. Texas Judiciary Online This site provides information about the Texas Supreme Court, the Texas Court of Criminal Appeals, and the appellate and district courts. It includes links to the Office of Court Administration, certain municipal and county courts, and numerous other judicial entities and information resources."
