["https://capitol.texas.gov/Resources/Awards.aspx"]
title = "Texas Legislature Online - Awards"
full_description = "NCSL LINCS and NALIT 2008 Online Democracy Award The Online Democracy Award seeks to recognize a state legislative web site that stands out for making democracy user-friendly. The award is sponsored by NCSL’s Legislative Information and Communication Staff Section (LINCS) and National Association of Legislative Information Technology (NALIT). Texas' website was recognized for its ease of navigation, depth of content and openness and availability of information for the public. Best of Texas 2007 - Best Technology Solution Serving the Public Awards program established to salute IT professionals and local government organizations for their dedication, hard work and contributions in the state of Texas. Winners are selected based on a set of criteria, including collaboration between agencies, innovative use of technology and improvement of services to citizens or state employees. Texas Association of State Systems for Computing and Communications State Agency Excellence Award The TASSCC Excellence Award recognizes those who have implemented a technical application that significantly improved internal operations, customer services, or communications. Special consideration is given to projects that use leading edge technology or that use existing technology in an innovative manner. Center for Digital Government Digital Government Achievement Award The Digital Government Achievement Award is a national program that recognizes outstanding agency and department Web sites and applications that enhance information interactions, transactions and/or services. The categories include government-to-government, government-to-business, government-to-citizen, and government internal."
