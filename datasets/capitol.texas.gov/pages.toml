["https://capitol.texas.gov/Calendars/CalendarsSenate.aspx"]
title = "Texas Legislature Online - Senate Calendars and Agenda Items"
full_description = "View Senate Calendars and Agenda Items View senate calendars and agenda items for a specific date. View senate calendars and agenda items for upcoming dates. View senate calendars and agenda items for a specific legislature. Senate Calendars and Agenda Items The senate agenda includes the following information: notice of intent, giving the number, author or sponsor, and short caption for each measure that may be considered during the day’s session; list of senate bills returned from the house with amendments; status of bills in conference committees, giving a short caption and brief history of the action on the bills; local and uncontested bills calendar; gubernatorial appointments to boards and commissions that have been reported favorably from the Senate Committee on Nominations and are awaiting confirmation by the senate; committee hearings scheduled, including short captions for all measures scheduled to be considered by the committees; regular order of business, listing all bills and resolutions that have been reported favorably from committees in the order in which they were reported to the senate; miscellaneous announcements; senate floor action, giving the numbers and short captions for and action taken on all measures brought up for consideration during the previous legislative day; senate committee action, giving the same information for all measures considered by committees on the previous day; and morning call, which includes senate and house bills and resolutions on first reading and referral to committee, the introduction and consideration of memorial and congratulatory resolutions, messages and executive communications, and other motions. View full explanation of senate calendar and agenda process"
