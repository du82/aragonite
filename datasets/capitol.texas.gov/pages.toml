title = "Texas Legislature Online - Search"
full_description = "Bill Search Search bills for a specific legislature based on combination of author/sponsor, committee, subject, and action. Text Search Search against the text of bills, bill analyses, fiscal notes, and amendments using a simple or Boolean search. Amendment Search Search against the text of amendments using a simple or Boolean search. Texas Statutes Search the text of statutes (codified law) by exact phrase or a specific code. Individual statutes are also available for download as zipped HTML, PDF, or Word documents. House Journals Search and view the official daily proceedings in the house chamber. Senate Journals Search and view the official daily proceedings in the senate chamber. Texas Constitution Search the text of the constitution by exact phrase. The text is also available as a downloadable Word document. Legislative Archive System The Legislative Archive System provides electronic access to scanned copies of the official bill files from the collection of the Legislative Reference Library. The files are scanned and made available as PDF documents. The system also allows users to search for legislation across multiple legislative sessions."
