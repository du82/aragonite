["https://carbonplan.org/blog/offsets-fires-update"]
title = "Monitoring forest carbon offsets for the 2022 fire season – CarbonPlan"
description = "We have updated our wildfire monitoring tool in preparation for the 2022 fire season."
full_description = ".css-b6pqm4{font-size:18px;line-height:1.35;font-family:relative-book-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;letter-spacing:0.01em;margin-top:1em;margin-bottom:1em;}@media screen and (min-width: 40em){.css-b6pqm4{font-size:18px;}}@media screen and (min-width: 64em){.css-b6pqm4{font-size:18px;}}@media screen and (min-width: 102em){.css-b6pqm4{font-size:24px;}}.css-11llkvq{font-size:18px;line-height:1.35;font-family:relative-book-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;letter-spacing:0.01em;margin-top:1em;margin-bottom:1em;font-size:18px;line-height:1.35;font-family:relative-book-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;letter-spacing:0.01em;margin-top:1em;margin-bottom:1em;}@media screen and (min-width: 40em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 64em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 102em){.css-11llkvq{font-size:24px;}}@media screen and (min-width: 40em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 64em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 102em){.css-11llkvq{font-size:24px;}}With the onset of the summer fire season, we’ve dusted off and revamped our tool for monitoring wildfires in forest carbon offset projects. In addition to a few visual tweaks, we’ve made a number of behind-the-scenes technical improvements that will allow us to better respond if fire burns through one of California’s forest carbon offset projects. Last year we identified and tracked fires across nine projects that burned over 158,000 acres. Our monitoring tool tracks actively burning wildfires that intersect with forest offset projects enrolled in California’s offsets program. Since last year we have expanded the number of projects we’re tracking from 74 to 119, in locations across the continental United States and coastal Alaska. We also moved the fire monitoring tool to a .css-fnw7dn{color:var(--theme-ui-colors-text);-webkit-text-decoration:underline;text-decoration:underline;cursor:pointer;}@media (hover: hover) and (pointer: fine){.css-fnw7dn:active{color:var(--theme-ui-colors-text);}.css-fnw7dn:hover{color:var(--theme-ui-colors-secondary);}}.css-1kesrdv{color:var(--theme-ui-colors-text);-webkit-text-decoration:underline;text-decoration:underline;cursor:pointer;color:var(--theme-ui-colors-text);-webkit-text-decoration:underline;text-decoration:underline;cursor:pointer;}@media (hover: hover) and (pointer: fine){.css-1kesrdv:active{color:var(--theme-ui-colors-text);}.css-1kesrdv:hover{color:var(--theme-ui-colors-secondary);}}@media (hover: hover) and (pointer: fine){.css-1kesrdv:active{color:var(--theme-ui-colors-text);}.css-1kesrdv:hover{color:var(--theme-ui-colors-secondary);}}standalone website, separating it from the offsets mapping tool we released as part of our analysis of crediting errors in California’s forest offsets protocol. This allowed us to preserve the original crediting error analysis, while making it possible to add new features to the fire monitoring tool, like increasing the number of offset projects we’re tracking and adding the ability to directly link to map coordinates. Ongoing monitoring of wildfire across California’s forest offsets projects is especially important given the program’s vulnerability to fire and other disturbance risks. We recently released an academic study demonstrating that wildfires have already burned through the buffer pool credits that California has set aside to insure against carbon losses from wildfires for the next 100 years. Although the buffer pool still contains millions of credits, there is mounting evidence that the program has significantly underestimated the risks to forest carbon permanence. The precarious state of California’s buffer pool makes every fire season a high-stakes affair. The stakes are especially high this year as much of the American West remains deep in the throes of exceptional drought. The ongoing drought means heightened fire risk across large swathes of the West and, more specifically, above-normal wildfire risk for individual forest carbon offsets projects. To get a sense of what that risk might look like, we overlaid offset project locations with the National Interagency Fire Center predictive services’ seasonal fire potential outlooks (Table 1). For each month, we summed the number of offset credits issued to projects with “above normal” wildfire risk. .css-1rkzpad{box-sizing:border-box;margin:0;min-width:0;margin-top:48px;margin-bottom:48px;}@media screen and (min-width: 40em){.css-1rkzpad{margin-top:48px;margin-bottom:48px;}}@media screen and (min-width: 64em){.css-1rkzpad{margin-top:48px;margin-bottom:48px;}}@media screen and (min-width: 102em){.css-1rkzpad{margin-top:64px;margin-bottom:64px;}}@media print{.css-1rkzpad{break-inside:avoid;}}.css-11cfehs{box-sizing:border-box;margin:0;min-width:0;margin-bottom:24px;}@media screen and (min-width: 40em){.css-11cfehs{margin-bottom:24px;}}@media screen and (min-width: 64em){.css-11cfehs{margin-bottom:24px;}}@media screen and (min-width: 102em){.css-11cfehs{margin-bottom:32px;}}.css-1d0lxqk{box-sizing:border-box;margin:0;min-width:0;display:grid;grid-gap:16px;grid-template-columns:repeat(2, 1fr);-webkit-column-gap:24px;column-gap:24px;row-gap:0;}@media screen and (min-width: 40em){.css-1d0lxqk{grid-template-columns:repeat(4, 1fr);}}@media screen and (min-width: 64em){.css-1d0lxqk{grid-template-columns:repeat(4, 1fr);}}@media screen and (min-width: 102em){.css-1d0lxqk{grid-template-columns:repeat(4, 1fr);}}@media screen and (min-width: 40em){.css-1d0lxqk{-webkit-column-gap:32px;column-gap:32px;row-gap:0;}}@media screen and (min-width: 64em){.css-1d0lxqk{-webkit-column-gap:32px;column-gap:32px;row-gap:0;}}@media screen and (min-width: 102em){.css-1d0lxqk{-webkit-column-gap:48px;column-gap:48px;row-gap:0;}}.css-16xm7vf{box-sizing:border-box;margin:0;min-width:0;grid-column-start:1;grid-column-e