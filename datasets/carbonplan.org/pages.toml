title = "When carbon offsets and zombie forests collide – CarbonPlan"
description = "A new paper about declining habitat suitability for conifers in California's Sierra Nevada demonstrates the shaky scientific foundations of California's forest offsets program."
full_description = '''.css-b6pqm4{font-size:18px;line-height:1.35;font-family:relative-book-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;letter-spacing:0.01em;margin-top:1em;margin-bottom:1em;}@media screen and (min-width: 40em){.css-b6pqm4{font-size:18px;}}@media screen and (min-width: 64em){.css-b6pqm4{font-size:18px;}}@media screen and (min-width: 102em){.css-b6pqm4{font-size:24px;}}.css-11llkvq{font-size:18px;line-height:1.35;font-family:relative-book-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;letter-spacing:0.01em;margin-top:1em;margin-bottom:1em;font-size:18px;line-height:1.35;font-family:relative-book-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;letter-spacing:0.01em;margin-top:1em;margin-bottom:1em;}@media screen and (min-width: 40em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 64em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 102em){.css-11llkvq{font-size:24px;}}@media screen and (min-width: 40em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 64em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 102em){.css-11llkvq{font-size:24px;}}A few weeks ago, a group of researchers at Stanford University published a study about .css-fnw7dn{color:var(--theme-ui-colors-text);-webkit-text-decoration:underline;text-decoration:underline;cursor:pointer;}@media (hover: hover) and (pointer: fine){.css-fnw7dn:active{color:var(--theme-ui-colors-text);}.css-fnw7dn:hover{color:var(--theme-ui-colors-secondary);}}.css-1kesrdv{color:var(--theme-ui-colors-text);-webkit-text-decoration:underline;text-decoration:underline;cursor:pointer;color:var(--theme-ui-colors-text);-webkit-text-decoration:underline;text-decoration:underline;cursor:pointer;}@media (hover: hover) and (pointer: fine){.css-1kesrdv:active{color:var(--theme-ui-colors-text);}.css-1kesrdv:hover{color:var(--theme-ui-colors-secondary);}}@media (hover: hover) and (pointer: fine){.css-1kesrdv:active{color:var(--theme-ui-colors-text);}.css-1kesrdv:hover{color:var(--theme-ui-colors-secondary);}}the “zombie forests” of the Sierra Nevada, documenting how much of the region's low-elevation conifer forests are no longer in equilibrium with current and future climate conditions. Although the trees are still alive, they're mismatched with prevailing climate conditions and especially vulnerable to catastrophic disturbances, like wildfire and drought. Upon their all-but-inevitable demise, these forests will likely be replaced by entirely different ecosystems. It's a fascinating study, with a little something for everyone: global environmental change, creatures from the grave, ecological niche modeling, future climate projections, and even a century-old forest survey. We wondered whether any of these zombie forests are enrolled in California's forest offsets program. Given that these forests are already "cheating death," using them to make offsetting claims intended to last 100 years would raise concerns. Helpfully, the authors have released their data under a CC-BY-SA license, meaning we can easily determine the magnitude of the problem we might be looking at. We identified at least four improved forest management projects (CAR1381, CAR1382, CAR1384, and CAR1409) in parts of the Sierra Nevada where the researchers identified potential zombie forest conditions. All four projects are under development by Sierra Pacific Industries (SPI) and largely consist of conifers. If approved, the projects could receive over 2.6 million offset credits that would be eligible for use in California's cap-and-trade program. When we look at projected conifer habitat suitability in the years 2080 to 2100, we find that a significant fraction of the acreage of all four projects is classified as either "mismatched" or "severely mismatched" with the historical climatological niche of conifer forests in the Sierra Nevada (Table 1). In the case of SPI's Mosquito 2019 project (CAR1384), nearly the entire project area (97.1 percent) is classified as zombie forest. For the remaining projects, between 18.5 and 82.7 percent of enrolled acres are projected to be unsuitable for conifer forests by 2100. It's worth noting that we're reporting future changes in habitat suitability assuming a fairly ambitious climate mitigation scenario, SSP2-4.5, which puts the estimates in Table 1 on the conservative end of the spectrum. Since California's forest carbon offsets program requires that projects consider risks over the next 100 years, thinking about habitat suitability over this timescale is critical. Any losses from zombie forests over that period will need to be compensated for by the program's already-strained buffer pool. .css-1rkzpad{box-sizing:border-box;margin:0;min-width:0;margin-top:48px;margin-bottom:48px;}@media screen and (min-width: 40em){.css-1rkzpad{margin-top:48px;margin-bottom:48px;}}@media screen and (min-width: 64em){.css-1rkzpad{margin-top:48px;margin-bottom:48px;}}@media screen and (min-width: 102em){.css-1rkzpad{margin-top:64px;margin-bottom:64px;}}@media print{.css-1rkzpad{break-inside:avoid;}}.css-11cfehs{box-sizing:border-box;margin:0;min-width:0;margin-bottom:24px;}@media screen and (min-width: 40em){.css-11cfehs{margin-bottom:24px;}}@media screen and (min-width: 64em){.css-11cfehs{margin-bottom:24px;}}@media screen and (min-width: 102em){.css-11cfehs{margin-bottom:32px;}}.css-idqwcx{box-sizing:border-box;margin:0;min-width:0;display:block;margin-top:32px;margin-bottom:32px;}.css-511wzr{box-sizing:border-box;margin:0;min-width:0;display:block;}.css-10uwqcs{box-sizing:border-box;margin:0;min-width:0;display:grid;grid-gap:16px;grid-template-columns:repeat(4, 1fr);-webkit-column-gap:24px;column-gap:24px;row-gap:0;vertical-align:baseline;border:0;outline:0;margin:0;padding:0;border-style:solid;border-width:0px;border-top-width:1px;border-color:var(--theme-ui-colors-muted);padding-top:16px;padding-bottom:16px;margin-bottom:2px;border-bottom-wi