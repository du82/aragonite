["https://carbonplan.org/blog/cdr-standards-call"]
title = "Industry call for CDR Standards Initiative – CarbonPlan"
description = "We summarize a public letter from 35 organizations across the CDR ecosystem calling for a scientifically-grounded standards body for long-duration CDR that could review and harmonize emerging protocols."
full_description = ".css-b6pqm4{font-size:18px;line-height:1.35;font-family:relative-book-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;letter-spacing:0.01em;margin-top:1em;margin-bottom:1em;}@media screen and (min-width: 40em){.css-b6pqm4{font-size:18px;}}@media screen and (min-width: 64em){.css-b6pqm4{font-size:18px;}}@media screen and (min-width: 102em){.css-b6pqm4{font-size:24px;}}.css-11llkvq{font-size:18px;line-height:1.35;font-family:relative-book-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;letter-spacing:0.01em;margin-top:1em;margin-bottom:1em;font-size:18px;line-height:1.35;font-family:relative-book-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;letter-spacing:0.01em;margin-top:1em;margin-bottom:1em;}@media screen and (min-width: 40em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 64em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 102em){.css-11llkvq{font-size:24px;}}@media screen and (min-width: 40em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 64em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 102em){.css-11llkvq{font-size:24px;}}Last November, .css-fnw7dn{color:var(--theme-ui-colors-text);-webkit-text-decoration:underline;text-decoration:underline;cursor:pointer;}@media (hover: hover) and (pointer: fine){.css-fnw7dn:active{color:var(--theme-ui-colors-text);}.css-fnw7dn:hover{color:var(--theme-ui-colors-secondary);}}.css-1kesrdv{color:var(--theme-ui-colors-text);-webkit-text-decoration:underline;text-decoration:underline;cursor:pointer;color:var(--theme-ui-colors-text);-webkit-text-decoration:underline;text-decoration:underline;cursor:pointer;}@media (hover: hover) and (pointer: fine){.css-1kesrdv:active{color:var(--theme-ui-colors-text);}.css-1kesrdv:hover{color:var(--theme-ui-colors-secondary);}}@media (hover: hover) and (pointer: fine){.css-1kesrdv:active{color:var(--theme-ui-colors-text);}.css-1kesrdv:hover{color:var(--theme-ui-colors-secondary);}}Stripe, Lowercarbon Capital, Isometric, and CarbonPlan organized a convening focused on carbon dioxide removal (CDR) measurement, reporting, and verification (MRV). At the convening, there was broad agreement that more robust structures are needed to ensure high-quality quantification and verification of carbon removal deployments. In an open letter that was collaboratively written by a working group coming out of the November convening, 35 organizations representing carbon removal buyers, suppliers, verifiers, non-profits, and academics call for the creation of an independent standards initiative that would provide a trusted, scientific stamp-of-approval for CDR protocols. We envision this initiative establishing a transparent and predictable process for consolidating the best available science, reviewing existing and forthcoming protocols, and harmonizing MRV approaches across and within CDR pathways. This process would provide reference points to ensure that claimed permanent removals are consistently and rigorously quantified and are aligned with relevant system boundaries. We also suggest that the initiative should be conscientiously set up to avoid conflicts of interest — particularly that funding for the standards initiative should not involve issuing or selling carbon credits. If you are interested in joining the call for high quality CDR standards, you can add your signature to the open letter here. If you have any questions or would like more information about potential next steps, please feel free to reach out to hello@carbonplan.org."
