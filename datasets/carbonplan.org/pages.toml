title = "Which states' insurance markets are most exposed to climate risks? – CarbonPlan"
description = "We analyze different ways the Federal Insurance Office could identify the most climate-vulnerable states."
full_description = ".css-b6pqm4{font-size:18px;line-height:1.35;font-family:relative-book-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;letter-spacing:0.01em;margin-top:1em;margin-bottom:1em;}@media screen and (min-width: 40em){.css-b6pqm4{font-size:18px;}}@media screen and (min-width: 64em){.css-b6pqm4{font-size:18px;}}@media screen and (min-width: 102em){.css-b6pqm4{font-size:24px;}}.css-11llkvq{font-size:18px;line-height:1.35;font-family:relative-book-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;letter-spacing:0.01em;margin-top:1em;margin-bottom:1em;font-size:18px;line-height:1.35;font-family:relative-book-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;letter-spacing:0.01em;margin-top:1em;margin-bottom:1em;}@media screen and (min-width: 40em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 64em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 102em){.css-11llkvq{font-size:24px;}}@media screen and (min-width: 40em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 64em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 102em){.css-11llkvq{font-size:24px;}}The Federal Insurance Office (FIO) recently .css-fnw7dn{color:var(--theme-ui-colors-text);-webkit-text-decoration:underline;text-decoration:underline;cursor:pointer;}@media (hover: hover) and (pointer: fine){.css-fnw7dn:active{color:var(--theme-ui-colors-text);}.css-fnw7dn:hover{color:var(--theme-ui-colors-secondary);}}.css-1kesrdv{color:var(--theme-ui-colors-text);-webkit-text-decoration:underline;text-decoration:underline;cursor:pointer;color:var(--theme-ui-colors-text);-webkit-text-decoration:underline;text-decoration:underline;cursor:pointer;}@media (hover: hover) and (pointer: fine){.css-1kesrdv:active{color:var(--theme-ui-colors-text);}.css-1kesrdv:hover{color:var(--theme-ui-colors-secondary);}}@media (hover: hover) and (pointer: fine){.css-1kesrdv:active{color:var(--theme-ui-colors-text);}.css-1kesrdv:hover{color:var(--theme-ui-colors-secondary);}}proposed to solicit information from insurance companies about how climate risks may impact the affordability and availability of homeowners insurance policies. We submitted a comment supporting the call in which we emphasized the importance of nationwide data collection efforts and encouraged FIO to release its data publically. We also conducted analyses to support some potential modifications to the data solicitation, which we describe below. The FIO proposal would involve collecting information nationwide from companies writing more than $100 million in policies. Additionally, in 10 states identified as the most “climate vulnerable,” FIO will solicit additional information in order to cover at least 80% of the state insurance market. FIO identified these states using FEMA’s National Risk Index (NRI) product. With enough resources, soliciting information to meet that 80% threshold nation-wide would of course be preferable, but as an initial step, we were pleased to see the targeted requests in regions that have been most heavily impacted by climate disasters to date. Assessing the climate vulnerability of states, however, depends on the choice of metrics included in the analysis. The NRI captures expected annual losses from agriculture, buildings, and population, as well as the summed total of all three sectors. These losses are determined separately for 18 hazards. In its proposed approach, FIO ranked states according to the summed total expected annual loss for a subset of 15 climate hazards. As Figure 1 demonstrates through an interactive tool, changing the type of loss, or choosing a different subset of hazards, can change the ranking of most vulnerable states and result in a different set of top 10 most vulnerable states than the ones FIO identified. See our GitHub repository for more details on the analysis. .css-1rkzpad{box-sizing:border-box;margin:0;min-width:0;margin-top:48px;margin-bottom:48px;}@me