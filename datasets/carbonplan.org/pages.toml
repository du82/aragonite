title = "Updating Enhanced Weathering in the CDR Verification Framework – CarbonPlan"
description = "Updating our representation of Enhanced Weathering in the CDR Verification Framework in response to helpful feedback."
full_description = ".css-b6pqm4{font-size:18px;line-height:1.35;font-family:relative-book-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;letter-spacing:0.01em;margin-top:1em;margin-bottom:1em;}@media screen and (min-width: 40em){.css-b6pqm4{font-size:18px;}}@media screen and (min-width: 64em){.css-b6pqm4{font-size:18px;}}@media screen and (min-width: 102em){.css-b6pqm4{font-size:24px;}}.css-11llkvq{font-size:18px;line-height:1.35;font-family:relative-book-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;letter-spacing:0.01em;margin-top:1em;margin-bottom:1em;font-size:18px;line-height:1.35;font-family:relative-book-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;letter-spacing:0.01em;margin-top:1em;margin-bottom:1em;}@media screen and (min-width: 40em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 64em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 102em){.css-11llkvq{font-size:24px;}}@media screen and (min-width: 40em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 64em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 102em){.css-11llkvq{font-size:24px;}}Last September, we released a .css-fnw7dn{color:var(--theme-ui-colors-text);-webkit-text-decoration:underline;text-decoration:underline;cursor:pointer;}@media (hover: hover) and (pointer: fine){.css-fnw7dn:active{color:var(--theme-ui-colors-text);}.css-fnw7dn:hover{color:var(--theme-ui-colors-secondary);}}.css-1kesrdv{color:var(--theme-ui-colors-text);-webkit-text-decoration:underline;text-decoration:underline;cursor:pointer;color:var(--theme-ui-colors-text);-webkit-text-decoration:underline;text-decoration:underline;cursor:pointer;}@media (hover: hover) and (pointer: fine){.css-1kesrdv:active{color:var(--theme-ui-colors-text);}.css-1kesrdv:hover{color:var(--theme-ui-colors-secondary);}}@media (hover: hover) and (pointer: fine){.css-1kesrdv:active{color:var(--theme-ui-colors-text);}.css-1kesrdv:hover{color:var(--theme-ui-colors-secondary);}}CDR Verification Framework that maps out the key uncertainties associated with quantifying net carbon removal and storage durability for different carbon dioxide removal pathways. The framework summarizes our uncertainty mapping for each pathway with a metric called the Verification Confidence Level (VCL), which represents our confidence that carbon removal outcomes can be accurately quantified using the best scientific understanding, measurement, and modeling approaches available today. In response to helpful feedback from scientists and practitioners following the initial release of the tool, we are now updating the Verification Framework’s Enhanced Weathering pathway. These updates do not change our assessment of the VCL of Enhanced Weathering, but they do reflect important conceptual shifts that we wanted to document and explain in this blog post. .css-1rkzpad{box-sizing:border-box;margin:0;min-width:0;margin-top:48px;margin-bottom:48px;}@media screen and (min-width: 40em){.css-1rkzpad{margin-top:48px;margin-bottom:48px;}}@media screen and (min-width: 64em){.css-1rkzpad{margin-top:48px;margin-bottom:48px;}}@media screen and (min-width: 102em){.css-1rkzpad{margin-top:64px;margin-bottom:64px;}}@media print{.css-1rkzpad{break-inside:avoid;}}.css-11cfehs{box-sizing:border-box;margin:0;min-width:0;margin-bottom:24px;}@media screen and (min-width: 40em){.css-11cfehs{margin-bottom:24px;}}@media screen and (min-width: 64em){.css-11cfehs{margin-bottom:24px;}}@media screen and (min-width: 102em){.css-11cfehs{margin-bottom:32px;}}.css-1hhpycn{box-sizing:border-box;margin:0;min-width:0;margin-top:0;}.css-1f1jyzx{box-sizing:border-box;margin:0;min-width:0;display:inline-block;font-size:14px;font-family:relative-mono-11-pitch-pro,Menlo,monospace;letter-spacing:0.07em;cursor:pointer;color:var(--theme-ui-colors-primary);background-color:transparent;border-style:solid;border-color:var(--theme-ui-colors-primary);line-height:1.35;border-width:0px;border-bottom-width:1px;text-transform:uppercase;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;-webkit-transition:opacity 0.05s;transition:opacity 0.05s;padding-top:1px;padding-bottom:2px;padding-left:0;padding-right:0;margin:0;opacity:1;width:-webkit-max-content;width:-moz-max-content;width:max-content;margin-right:8px;margin-bottom:4px;}@media screen and (min-width: 40em){.css-1f1jyzx{font-size:14px;}}@media screen and (min-width: 64em){.css-1f1jyzx{font-size:14px;}}@media screen and (min-width: 102em){.css-1f1jyzx{font-size:16px;}}before.css-lgwau8{box-sizing:border-box;margin:0;min-width:0;display:inline-block;font-size:14px;font-family:relative-mono-11-pitch-pro,Menlo,monospace;letter-spacing:0.07em;cursor:pointer;color:var(--theme-ui-colors-primary);background-color:transparent;border-style:solid;border-color:var(--theme-ui-colors-primary);line-height:1.35;border-width:0px;border-bottom-width:1px;text-transform:uppercase;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;-webkit-transition:opacity 0.05s;transition:opacity 0.05s;padding-top:1px;padding-bottom:2px;padding-left:0;padding-right:0;margin:0;opacity:0.24;width:-webkit-max-content;width:-moz-max-content;width:max-content;margin-right:8px;margin-bottom:4px;}@media screen and (min-width: 40em){.css-lgwau8{font-size:14px;}}@media screen and (min-width: 64em){.css-lgwau8{font-size:14px;}}@media screen and (min-width: 102em){.css-lgwau8{font-size:16px;}}after.css-o9017y{box-sizing:border-box;margin:0;min-width:0;width:100%;margin-top:16px;}.css-1f1ra8m{box-sizing:border-box;margin:0;min-width:0;margin-bottom:0;}.css-14449re{box-sizing:border-box;margin:0;min-width:0;color:var(--theme-ui-colors-secondary);display:block;text-align:left;font-size:16px;}@media screen and (min-width: 40em){.css-14449re{font-size:16px;}}@media screen and (min-width: 64em){.css-14449re{font-size:16px;}}@media screen and (min-width: 102em){.css-14449re{font-size:18px;}}.css-14449re a{color:var(--theme-ui-colors-secondary);}.css-14449re a:hover{color:var(--theme-ui-colors-primary);}.css-14449re>p{display:inline;font-size:16px;}@media screen and (min-width: 40em){.css-14449re>p{font-size:16px;}}@media screen and (min-width: 64em){.css-14449re>p{font-size:16px;}}@media screen and (min-width: 102em){.css-14449re>p{font-size:18px;}}.css-1sk0a8c{box-sizing:border-box;margin:0;min-width:0;text-transform:uppercase;letter-spacing:0.07em;display:inline-block;}figure 1 .css-3dr1uz{box-sizing:border-box;margin:0;min-width:0;display:inline-block;margin-left:4px;margin-right:4px;padding-right:4px;}/The Enhanced Weathering pathway diagram as initially released (before) and as updated to reflect the changes described in this blog post (after). You can explore the updated diagram in more detail in the interactive tool. In the initial release, we framed our analysis of Enhanced Weathering around an understanding that the additional flux of dissolved inorganic carbon (DIC) from the site of rock application represented captured CO₂. This was a somewhat limited view, however, and the feedback we received encouraged us to instead think about Enhanced Weathering as causing an overall shift in CO₂ fluxes as a result of the alkalinity introduced by rock weathering. We think this framing more accurately captures the reality and complexity of Enhanced Weathering as a carbon cycle intervention, and we have adopted it in the updated framework. This change most notably affects our treatment of weathering that is facilitated by non-carbonic acids. Previously, we considered these reactions to result in “lost alkalinity” — in other words, rock weathering that didn’t lead to the formation of additional DIC at the site of rock application. With the updated framing, we acknowledge that some non-carbonic acids could drive CO₂ outgassing elsewhere in the broader biogeochemical system if not neutralized via rock weathering. Accordingly, it may be appropriate to account for this avoided outgassing depending on how confidently the counterfactual can be characterized and how quickly the outgassing would have otherwise occurred. Practically, this means that some weathering facilitated by non-carbonic acid may contribute to net carbon storage and could be accounted for as such. In addition to the conceptual shift described above, this update includes three smaller changes. First, we have included a more explicit representation of marine carbonate precipitation in the framework. Eventually, the formation and burial of carbonate minerals will release CO₂ stored by mineral weathering. This process undoes most or all of the carbon storage associated with carbonate rock weathering, and around half of the storage associated with silicate rock weathering. The carbonate precipitation process occurs slowly and is unlikely to have a significant impact on estimates of carbon storage on decadal to millennial timescales. On geologic timescales, however, it is an important process to characterize. Second, we changed the calculation of total carbon removal to begin with observed mineral weathering (component 2) rather than mineral application (component 1). While demonstrating mineral application is clearly an important component of MRV, carbon removal is a function of mineral weathering — not mineral application. Third, we corrected a few instances where we described carbonic acid system reactions incorrectly and renamed some components for clarity. A full accounting of the changes can be found on GitHub. Overall, these changes do not affect our classification of the Enhanced Weathering pathway as VCL 3, meaning that current quantification capacity can establish permanent carbon removal occurred, but significant uncertainties remain. We look forward to continued engagement with the broader community to make the Verification Framework as useful and accurate a tool as possible. Many thanks to those who gave us feedback on the initial release of the Enhanced Weathering pathway, including Dr. Adam Wolf (Eion), Dr. Becca Neumann (University of Washington), Dr. Chris Reinhard (Georgia Tech, Lithos), Dr. Kate Maher (Stanford University), Dr. Laura Lammers (Travertine), and Dr. Noah Planavsky (Yale, Lithos). Any remaining mistakes or mischaracterizations are our sole responsibility."
