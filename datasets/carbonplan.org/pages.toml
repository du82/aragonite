["https://carbonplan.org/blog/cdr-database-archived"]
title = "Archiving the CDR Database – CarbonPlan"
description = "Why we are archiving the CDR Database and shifting our attention to other priorities in the carbon removal ecosystem."
full_description = ".css-b6pqm4{font-size:18px;line-height:1.35;font-family:relative-book-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;letter-spacing:0.01em;margin-top:1em;margin-bottom:1em;}@media screen and (min-width: 40em){.css-b6pqm4{font-size:18px;}}@media screen and (min-width: 64em){.css-b6pqm4{font-size:18px;}}@media screen and (min-width: 102em){.css-b6pqm4{font-size:24px;}}.css-11llkvq{font-size:18px;line-height:1.35;font-family:relative-book-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;letter-spacing:0.01em;margin-top:1em;margin-bottom:1em;font-size:18px;line-height:1.35;font-family:relative-book-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;letter-spacing:0.01em;margin-top:1em;margin-bottom:1em;}@media screen and (min-width: 40em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 64em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 102em){.css-11llkvq{font-size:24px;}}@media screen and (min-width: 40em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 64em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 102em){.css-11llkvq{font-size:24px;}}One of our first projects at CarbonPlan was building the .css-fnw7dn{color:var(--theme-ui-colors-text);-webkit-text-decoration:underline;text-decoration:underline;cursor:pointer;}@media (hover: hover) and (pointer: fine){.css-fnw7dn:active{color:var(--theme-ui-colors-text);}.css-fnw7dn:hover{color:var(--theme-ui-colors-secondary);}}.css-1kesrdv{color:var(--theme-ui-colors-text);-webkit-text-decoration:underline;text-decoration:underline;cursor:pointer;color:var(--theme-ui-colors-text);-webkit-text-decoration:underline;text-decoration:underline;cursor:pointer;}@media (hover: hover) and (pointer: fine){.css-1kesrdv:active{color:var(--theme-ui-colors-text);}.css-1kesrdv:hover{color:var(--theme-ui-colors-secondary);}}@media (hover: hover) and (pointer: fine){.css-1kesrdv:active{color:var(--theme-ui-colors-text);}.css-1kesrdv:hover{color:var(--theme-ui-colors-secondary);}}CDR Database. Over the last two years, we analyzed more than 200 carbon dioxide removal (CDR) proposals, across a wide range of approaches, with the goal of bringing more openness, transparency, and accountability to the carbon removal ecosystem. In the early days of our organization, the CDR Database was by far our most-accessed research product. We learned a lot from analyzing project proposals, especially about emerging approaches to permanent CDR. When we started this work two years ago, analyzing proposals repeatedly forced us to wrap our heads around the science of novel CDR approaches, calibrate our analytical findings across harmonized metrics, and try to make our insights accessible to a broad and growing audience. Because we worked with data from prominent corporate buyers, the database also became a reasonably comprehensive survey of the landscape of CDR projects for purposes of transparency and market intelligence. But the field is in a different place today than it was when we started. Several CDR projects that were only getting off the ground a couple years ago are now starting to make physical deliveries — progress that, for us, illustrates the need not only to evaluate proposals, but also to evaluate outcomes. Meanwhile, new project proposals arrive seemingly every week, whether in the context of investment decision-making, catalytic corporate funding, or research grants. Evaluating the nuances of an ever-expanding pipeline of proposals requires a growing degree of time and resources, especially when proposals push on the boundaries of existing methods or involve twists on concepts already being pursued by others. The good news is that the capacity for key decision-makers in the public and private sectors has expanded in parallel. (We’ve also helped to communicate key scientific principles in public by contributing to the CDR Primer, a free online book covering the technical basics of the field.) As a result of these changes, we see diminishing returns for the kind of high-level, cross-cutting proposal evaluation that went into our original CDR Database. Instead, we want to focus our efforts moving forward on monitoring the CDR ecosystem as projects start operating in earnest, with a specific interest in supporting the development of standards and systems for measurement, reporting, and verification (MRV). Along the way, we will also look for opportunities to dive deep into specific CDR approaches to help understand and communicate challenges and opportunities — for example, as we did for a subset of seaweed farming approaches or via our ton-year accounting explainer. Compared to producing new additions to the CDR Database, we consider MRV and deep-dive analyses more critical to our public-interest mission and better matched to the strengths of our team in relation to the growing number of investors, analysts, and private-sector actors who can ably review startup pitch decks. For these reasons, we will not be updating the CDR Database from this point forward, but we will leave the current version available online as an archival resource that is clearly marked with its legacy status. We thank all those who have used or provided feedback on the resource, and especially Microsoft and Stripe for making their CDR procurement processes transparent. We look forward to sharing more on our new CDR work in the months and years ahead."
year_published = 2025
