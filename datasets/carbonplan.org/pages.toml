ple-system,BlinkMacSystemFont;font-weight:400;letter-spacing:0.01em;margin-top:1em;margin-bottom:1em;}@media screen and (min-width: 40em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 64em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 102em){.css-11llkvq{font-size:24px;}}@media screen and (min-width: 40em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 64em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 102em){.css-11llkvq{font-size:24px;}}The ocean plays an essential role in the global carbon cycle. It stores about 38,000 billion metric tons of carbon, making it the largest active reservoir of carbon on the planet. It also soaks up about one quarter of the CO₂ emitted annually by humans. Scientists and engineers are currently exploring how to amplify the ocean’s natural ability to absorb and store carbon. One promising approach is called ocean alkalinity enhancement (OAE). OAE mimics natural geochemical processes that shift ocean chemistry to remove CO₂ from the atmosphere. This could be a highly scalable approach to carbon dioxide removal (CDR), but making it work requires a rigorous understanding of ocean processes and how they vary over time and space.OAE relies on adding alkaline materials, like crushed rocks or hydroxides, to the surface ocean — but this action alone does not guarantee carbon removal..css-1e1rxlp{box-sizing:border-box;margin:0;min-width:0;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;}.css-15hmh0z{box-sizing:border-box;margin:0;min-width:0;font-size:16px;cursor:pointer;color:var(--theme-ui-colors-blue);-webkit-transition:color 0.2s ease-in-out;transition:color 0.2s ease-in-out;}@media screen and (min-width: 40em){.css-15hmh0z{font-size:16px;}}@media screen and (min-width: 64em){.css-15hmh0z{font-size:16px;}}@media screen and (min-width: 102em){.css-15hmh0z{font-size:20px;}}1.css-152u3o5{box-sizing:border-box;margin:0;min-width:0;float:none;clear:none;margin-right:0;margin-left:0;width:calc(4 * 100vw / 6 - 30px);margin-top:16px;margin-bottom:16px;vertical-align:baseline;position:relative;display:none;}@media screen and (min-width: 40em){.css-152u3o5{float:none;clear:none;margin-right:calc(1 * 100vw / 8);margin-left:calc(1 * 100vw / 8);width:calc(4 * 100vw / 8 - 42px);margin-top:16px;margin-bottom:16px;display:none;}}@media screen and (min-width: 64em){.css-152u3o5{float:right;clear:right;margin-right:calc(-1 * (3 * (100vw - 32px * 13) / 12 + 32px * 3));margin-left:0;width:calc(2 * (100vw - 32px * 13) / 12 + 32px);margin-top:0;margin-bottom:16px;display:initial;}}@media screen and (min-width: 102em){.css-152u3o5{float:right;clear:right;margin-right:calc(-1 * (3 * (100vw - 48px * 13) / 12 + 48px * 3));margin-left:0;width:calc(2 * (100vw - 48px * 13) / 12 + 48px);margin-top:0;margin-bottom:24px;display:initial;}}.css-152u3o5 a{color:inherit;}.css-152u3o5 a:hover{color:inherit;}.css-olltdc{box-sizing:border-box;margin:0;min-width:0;width:100%;}.css-wk0sv2{box-sizing:border-box;margin:0;min-width:0;font-family:relative-book-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;width:100%;font-size:14px;line-height:1.25;letter-spacing:0.0125em;color:var(--theme-ui-colors-blue);opacity:1;display:inline-block;-webkit-transition:opacity 0.2s ease-in-out;transition:opacity 0.2s ease-in-out;text-align:left;}@media screen and (min-width: 40em){.css-wk0sv2{font-size:14px;opacity:1;text-align:left;}}@media screen and (min-width: 64em){.css-wk0sv2{font-size:13px;opacity:0.5;text-align:right;}}@media screen and (min-width: 102em){.css-wk0sv2{font-size:15px;text-align:right;}}.css-9d3yd0{box-sizing:border-box;margin:0;min-width:0;position:relative;right:100%;margin-right:10px;margin-top:-50px;text-align:right;line-height:1.25;letter-spacing:0.0125em;display:none;}@media screen and (min-width: 40em){.css-9d3yd0{display:none;}}@media screen and (min-width: 64em){.css-9d3yd0{display:initial;}}1.css-17i6oxh{box-sizing:border-box;margin:0;min-width:0;margin-top:0;text-align:left;display:initial;line-height:1.25;letter-spacing:0.0125em;}@media screen and (min-width: 40em){.css-17i6oxh{margin-top:0;display:initial;}}@media screen and (min-width: 64em){.css-17i6oxh{margin-top:-16px;display:block;}}@media screen and (min-width: 102em){.css-17i6oxh{margin-top:-18px;}}Strictly speaking, electrochemical OAE methods actually remove acid from the surface ocean, but this is functionally equivalent to adding a base such as hydroxide. Instead, these materials shift the chemistry of the water, making it able to absorb and store more CO₂. Although this initial chemical shift happens quickly, it takes time for the ocean to absorb CO₂ from the atmosphere. Since the ocean is always in motion, carbon removal can happen far from where alkalinity is added. Furthermore, if ocean circulation moves the alkalinity-treated water away from the surface and out of contact with the atmosphere, the process of absorbing atmospheric CO₂ can be cut short. Natural variations in these physical circulation dynamics mean that alkalinity deployed in different locations or at different times of the year can result in different amounts of carbon removal. Understanding these dynamics is critical for deciding where and when it makes sense to pursue OAE, and estimating how much carbon actually gets removed from the atmosphere.The OAE Efficiency Map is a new tool for understanding these dynamics and informing related decisions. Using a global ocean biogeochemical model, .css-fnw7dn{color:var(--theme-ui-colors-text);-webkit-text-decoration:underline;text-decoration:underline;cursor:pointer;}@media (hover: hover) and (pointer: fine){.css-fnw7dn:active{color:var(--theme-ui-colors-text);}.css-fnw7dn:hover{color:var(--theme-ui-colors-secondary);}}.css-1kesrdv{color:var(--theme-ui-colors-text);-webkit-text-decoration:underline;text-decoration:underline;cursor:pointer;color:var(--theme-ui-colors-text);-webkit-text-decoration:underline;text-decoration:underline;cursor:pointer;}@media (hover: hover) and (pointer: fine){.css-1kesrdv:active{color:var(--theme-ui-colors-text);}.css-1kesrdv:hover{color:var(--theme-ui-colors-secondary);}}@media (hover: hover) and (pointer: fine){.css-1kesrdv:active{color:var(--theme-ui-colors-text);}.css-1kesrdv:hover{color:var(--theme-ui-colors-secondary);}}[C]Worthy and collaborators simulated how efficiently OAE leads to carbon removal and its dependence on the location and season in which the alkaline materials are added to the ocean, and described the results in a scientific paper. The “efficiency” of OAE is defined as the amount of CO₂ that will be transferred from the atmosphere to the ocean per unit of alkalinity added. Together, [C]Worthy and CarbonPlan have turned this dataset into an interactive online tool. With it, you can explore global patterns in OAE efficiency, and drill down to visualize how alkalinity released in a specific region and season will move through the ocean and result in carbon removal over time.Scientists, companies, policymakers, and society at large are all still learning about OAE — both its potential as a carbon removal strategy and its safety for ocean ecosystems. We hope this tool helps build intuition about how OAE works, supports smart decision-making about real-world deployments, and informs ongoing efforts to create scientifically informed standards and effective regulatory frameworks for ocean-based CDR..css-a7gsc6{font-size:34px;font-family:relative-medium-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;line-height:1.1;margin-top:32px;margin-bottom:24px;}@media screen and (min-width: 40em){.css-a7gsc6{font-size:34px;margin-top:48px;margin-bottom:32px;}}@media screen and (min-width: 64em){.css-a7gsc6{font-size:34px;margin-top:48px;margin-bottom:32px;}}@media screen and (min-width: 102em){.css-a7gsc6{font-size:48px;}}.css-1ebnuvp{font-size:34px;font-family:relative-medium-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;line-height:1.1;margin-top:32px;margin-bottom:24px;font-size:34px;font-family:relative-medium-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;line-height:1.1;margin-top:32px;margin-bottom:24px;}@media screen and (min-width: 40em){.css-1ebnuvp{font-size:34px;margin-top:48px;margin-bottom:32px;}}@media screen and (min-width: 64em){.css-1ebnuvp{font-size:34px;margin-top:48px;margin-bottom:32px;}}@media screen and (min-width: 102em){.css-1ebnuvp{font-size:48px;}}@media screen and (min-width: 40em){.css-1ebnuvp{font-size:34px;margin-top:48px;margin-bottom:32px;}}@media screen and (min-width: 64em){.css-1ebnuvp{font-size:34px;margin-top:48px;margin-bottom:32px;}}@media screen and (min-width: 102em){.css-1ebnuvp{font-size:48px;}}Introduction to Ocean Alkalinity EnhancementIf you’re new to OAE, there are a few foundational concepts that are important to understand in order to interpret our methods and effectively use the new tool..css-1lil6wb{font-size:24px;font-family:relative-medium-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;line-height:1.2;margin-top:24px;margin-bottom:16px;}@media screen and (min-width: 40em){.css-1lil6wb{font-size:24px;margin-top:32px;margin-bottom:24px;}}@media screen and (min-width: 64em){.css-1lil6wb{font-size:24px;margin-top:32px;margin-bottom:24px;}}@media screen and (min-width: 102em){.css-1lil6wb{font-size:34px;}}.css-2rwp0w{font-size:24px;font-family:relative-medium-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;line-height:1.2;margin-top:24px;margin-bottom:16px;font-size:24px;font-family:relative-medium-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;line-height:1.2;margin-top:24px;margin-bottom:16px;}@media screen and (min-width: 40em){.css-2rwp0w{font-size:24px;margin-top:32px;margin-bottom:24px;}}@media screen and (min-width: 64em){.css-2rwp0w{font-size:24px;margin-top:32px;margin-bottom:24px;}}@media screen and (min-width: 102em){.css-2rwp0w{font-size:34px;}}@media screen and (min-width: 40em){.css-2rwp0w{font-size:24px;margin-top:32px;margin-bottom:24px;}}@media screen and (min-width: 64em){.css-2rwp0w{font-size:24px;margin-top:32px;margin-bottom:24px;}}@media screen and (min-width: 102em){.css-2rwp0w{font-size:34px;}}01 — The ocean stores enormous amounts of carbon and constantly exchanges CO₂ with the atmosphere.CO₂ is constantly being passed back and forth between the ocean and the atmosphere to maintain equilibrium — a state in which the concentration of dissolved CO₂ at the surface of the ocean is in balance with the amount of CO₂ gas in the atmosphere.22Notably, the deep ocean does not stay close to equilibrium with the atmosphere, which is one reason the ocean can store so much carbon. When ocean circulation brings deep water to the surface, it can exchange CO₂ with the atmosphere. However, since the ocean is stratified and of such large volume, ventilating the deep ocean requires hundreds to thousands of years. Ea"
