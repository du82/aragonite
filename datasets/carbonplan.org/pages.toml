title = "How we’re making it easier to work with open climate data – CarbonPlan"
description = "The open source Python library Kerchunk can speed up climate research."
full_description = ".css-b6pqm4{font-size:18px;line-height:1.35;font-family:relative-book-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;letter-spacing:0.01em;margin-top:1em;margin-bottom:1em;}@media screen and (min-width: 40em){.css-b6pqm4{font-size:18px;}}@media screen and (min-width: 64em){.css-b6pqm4{font-size:18px;}}@media screen and (min-width: 102em){.css-b6pqm4{font-size:24px;}}.css-11llkvq{font-size:18px;line-height:1.35;font-family:relative-book-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;letter-spacing:0.01em;margin-top:1em;margin-bottom:1em;font-size:18px;line-height:1.35;font-family:relative-book-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;letter-spacing:0.01em;margin-top:1em;margin-bottom:1em;}@media screen and (min-width: 40em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 64em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 102em){.css-11llkvq{font-size:24px;}}@media screen and (min-width: 40em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 64em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 102em){.css-11llkvq{font-size:24px;}}Several of our projects at CarbonPlan have relied on terabyte-scale public climate datasets. Working with data at this scale presents challenges related to data storage and computing resources. We believe that .css-fnw7dn{color:var(--theme-ui-colors-text);-webkit-text-decoration:underline;text-decoration:underline;cursor:pointer;}@media (hover: hover) and (pointer: fine){.css-fnw7dn:active{color:var(--theme-ui-colors-text);}.css-fnw7dn:hover{color:var(--theme-ui-colors-secondary);}}.css-1kesrdv{color:var(--theme-ui-colors-text);-webkit-text-decoration:underline;text-decoration:underline;cursor:pointer;color:var(--theme-ui-colors-text);-webkit-text-decoration:underline;text-decoration:underline;cursor:pointer;}@media (hover: hover) and (pointer: fine){.css-1kesrdv:active{color:var(--theme-ui-colors-text);}.css-1kesrdv:hover{color:var(--theme-ui-colors-secondary);}}@media (hover: hover) and (pointer: fine){.css-1kesrdv:active{color:var(--theme-ui-colors-text);}.css-1kesrdv:hover{color:var(--theme-ui-colors-secondary);}}Kerchunk — an open source Python library in the Pangeo ecosystem — can address some of these challenges. It’s designed to make working with large archival datasets faster and easier by creating reusable reference files. We started using and contributing to this library and have found that creating and sharing Kerchunk references of public datasets in a data commons can help speed up open science workflows. As a concrete example, we had success exploring the use of Kerchunk to speed up workflows in our recent extreme heat analysis. Below, we briefly summarize different approaches to working with large scientific data, explain why Kerchunk is an advance, and describe how we used it. .css-1lil6wb{font-size:24px;font-family:relative-medium-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;line-height:1.2;margin-top:24px;margin-bottom:16px;}@media screen and (min-width: 40em){.css-1lil6wb{font-size:24px;margin-top:32px;margin-bottom:24px;}}@media screen and (min-width: 64em){.css-1lil6wb{font-size:24px;margin-top:32px;margin-bottom:24px;}}@media screen and (min-width: 102em){.css-1lil6wb{font-size:34px;}}.css-2rwp0w{font-size:24px;font-family:relative-medium-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;line-height:1.2;margin-top:24px;margin-bottom:16px;font-size:24px;font-family:relative-medium-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;line-height:1.2;margin-top:24px;margin-bottom:16px;}@media screen and (min-width: 40em){.css-2rwp0w{font-size:24px;margin-top:32px;margin-bottom:24px;}}@media screen and (min-width: 64em){.css-2rwp0w{font-size:24px;margin-top:32px;margin-bottom:24px;}}@media screen and (min-width: 102em){.css-2rwp0w{font-size:34px;}}@media screen and (min-width: 40em){.css-2rwp0w{font-size:24px;margin-top:32px;margin-bottom:24px;}}@media screen and (min-width: 64em){.css-2rwp0w{font-size:24px;margin-top:32px;margin-bottom:24px;}}@media screen and (min-width: 102em){.css-2rwp0w{font-size:34px;}}Migrating to the cloud Large climate datasets are often stored in physical data centers. Using them might require downloading data to a local university's server or downloading one small piece of data at a time to a laptop. Some systems even require you to wait while a robot arm retrieves and reads data from a tape archive. This approach requires spending lots of time transferring and processing, uses lots of storage space for duplicate data, and is hard to reproduce. As an alternative, it’s possible to avoid ever downloading data by instead hosting both data and computing resources in the cloud. This approach, sometimes called “data-proximate” computing, reduces data transfer costs and makes it easy to scale workflows up and down. This approach works especially well when data are in an analysis-ready cloud-optimized (ARCO) format, such as Zarr, GeoTIFF, or Parquet. With these formats, users can access small parts of the data or read multiple parts in parallel without loading the entire dataset, which can speed up processing. Why use Kerchunk Analyzing data in the cloud works well when data are already in an ARCO format. But often that won’t be the case. Many datasets are in older, archival formats, which are not as amenable to cloud-based access. It might be necessary, however, to use such archival formats for compliance reasons, or it might be prohibitively costly to process and store an ARCO copy of a large archival dataset. The key innovation of Kerchunk is to create a reusable reference file from an archival dataset so that it can be read as if it were an ARCO data format such as Zarr. When a software tool tries to read the data, the reference file essentially tells the tool what portion of the original file to access, without ever creating a copy of the data. When using Kerchunk, we can also combine many individual archival files to create a “virtual reference dataset.” For example, we might use Kerchunk to combine thousands of “daily” files into a single reference dataset containing 80+ years of climate data. These aggregations are both faster to work with and easy to open with modern tools. Kerchunk thus offers the best of both worlds: stable, well-maintained and updated datasets stored in a conventional format and cloud-optimized access patterns. As an additional benefit, Kerchunk reference files are small in size and easy to share, better supporting open science and reproducibility. Real-world analysis using Kerchunk As part of our recent work on extreme heat, we created a global dataset of wet bulb globe temperature (WBGT) for multiple climate models and emissions scenarios. To calculate WBGT, we used the NEX-GDDP-CMIP6 dataset, which is a spatially downscaled version of the CMIP6 archive. This dataset is nearly 33 terabytes in size and is composed of more than 7000 NetCDF files — roughly the same as the storage capacity as 33 MacBook Pros. Instead of creating an ARCO copy of the NEX-GDDP-CMIP6 dataset, we created a virtual reference dataset using Kerchunk in an open source pipeline, which allowed us to speed up our WBGT calculations. We used Dask and the Coiled platform to parallelize the generation on NetCDF references over 500 individual machines. With our distributed approach, it took about 30 minutes to create Kerchunk reference files for the entire dataset. The resulting references are only 290 megabytes in size. After creating them once, these references can be used by anyone to read the NEX-GDDP-CMIP6 dataset as if it were an ARCO dataset. To validate the performance improvement, we compared workflows for calculating WBGT with and without Kerchunk. .css-1rkzpad{box-sizing:border-box;margin:0;min-width:0;margin-top:48px;margin-bottom:48px;}@media screen and (min-width: 40em){.css-