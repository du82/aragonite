 ways, such as when you: (a) create an online account, (b) submit, post, or otherwise share Content (as defined in our Terms of Use) on or through any of the Services, (c) make a donation or purchase, (d) participate in or register for our online or in-person meetings, events, or discussion fora, (e) apply for a job with us, (f) contact us or provide feedback, or (g) interact with our Github repository. This information may include but is not limited to your first and last name, email address, phone number, mailing address, geographic location, content, code, data, feedback, institutional affiliation, social media,and if you apply for a job with us your qualifications and experience, and employment history. We may also collect additional information about you in connection with our conferences and events (e.g., dietary and other preferences), and the provision of this information to us by you is optional."
