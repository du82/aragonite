["https://carbonplan.org/blog/sec-offset-disclosure"]
title = "Comments to the Securities and Exchange Commission on carbon offset disclosure – CarbonPlan"
description = "We summarize our comments to the SEC on the agency's proposed climate-risk disclosure rule. In our comments, we commend the rule's robust approach to carbon offsets and encourage the SEC to strengthen the proposed provisions for carbon removal."
full_description = ".css-b6pqm4{font-size:18px;line-height:1.35;font-family:relative-book-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;letter-spacing:0.01em;margin-top:1em;margin-bottom:1em;}@media screen and (min-width: 40em){.css-b6pqm4{font-size:18px;}}@media screen and (min-width: 64em){.css-b6pqm4{font-size:18px;}}@media screen and (min-width: 102em){.css-b6pqm4{font-size:24px;}}.css-11llkvq{font-size:18px;line-height:1.35;font-family:relative-book-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;letter-spacing:0.01em;margin-top:1em;margin-bottom:1em;font-size:18px;line-height:1.35;font-family:relative-book-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;letter-spacing:0.01em;margin-top:1em;margin-bottom:1em;}@media screen and (min-width: 40em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 64em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 102em){.css-11llkvq{font-size:24px;}}@media screen and (min-width: 40em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 64em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 102em){.css-11llkvq{font-size:24px;}}We recently .css-fnw7dn{color:var(--theme-ui-colors-text);-webkit-text-decoration:underline;text-decoration:underline;cursor:pointer;}@media (hover: hover) and (pointer: fine){.css-fnw7dn:active{color:var(--theme-ui-colors-text);}.css-fnw7dn:hover{color:var(--theme-ui-colors-secondary);}}.css-1kesrdv{color:var(--theme-ui-colors-text);-webkit-text-decoration:underline;text-decoration:underline;cursor:pointer;color:var(--theme-ui-colors-text);-webkit-text-decoration:underline;text-decoration:underline;cursor:pointer;}@media (hover: hover) and (pointer: fine){.css-1kesrdv:active{color:var(--theme-ui-colors-text);}.css-1kesrdv:hover{color:var(--theme-ui-colors-secondary);}}@media (hover: hover) and (pointer: fine){.css-1kesrdv:active{color:var(--theme-ui-colors-text);}.css-1kesrdv:hover{color:var(--theme-ui-colors-secondary);}}submitted comments to the Securities and Exchange Commission (SEC) regarding their proposed climate-risk disclosure rule. The proposed rule represents a significant step forward for U.S. climate-related financial regulation. Under the new SEC rule, a publicly-traded company would be required to disclose its climate-related financial risks, strategies for managing those risks, and any climate targets or goals it may have set. We focused our comments on the proposed rule’s provisions for carbon offsets disclosure. Crucially, the proposed rule stipulates that companies must disclose their use of offsets and must report the use of offsets separately from their gross emissions. Separate reporting is necessary to ensure that investors are able to discern the balance between a company’s internal and external mitigation efforts, which is in turn required to evaluate a company’s net-zero alignment. We commend the SEC for developing a robust approach to carbon offset disclosure, and believe that if finalized, the rule will provide much-needed information to investors. To illustrate why the proposed offset disclosure is necessary to provide material information to investors, we grounded our letter’s discussion of offset risks in examples drawn from voluntary disclosures and regulatory filings with the SEC. These existing practices highlight potential risks from companies’ interactions in the voluntary carbon markets, which face challenges including a limited supply of high-quality credits and opaque pricing. They also present a potentially volatile future that is largely reliant on a still-emerging set of voluntary standards. As carbon markets become increasingly woven into corporate climate strategy, robust disclosure rules are necessary to protect investors and help steer capital toward companies that best manage climate risks. Disclosure is needed because systemic issues in the voluntary carbon markets could lead to financial risks, including the impact that new regulations could have on credit supply and demand; the emerging threat of anti-greenwashing litigation; and increased credit prices from strengthening voluntary standards. For instance, if markets move towards supplying higher quality credits — including the permanent carbon removal required to achieve net-zero targets — prices could significantly increase, raising costs for companies who develop a business plan reliant on a glut of cheap offsets. We also encourage the SEC to strengthen its proposed offset disclosure rules to specifically identify companies’ reliance on carbon removal services. Integrating carbon removal into disclosure requirements is critical because corporate net-zero goals and targets require the use of carbon removal to neutralize whatever residual emissions remain after a company decarbonizes its operations and value chain. While not every company plans to set a net-zero target, many investors are interested in net-zero alignment and many companies have already decided to pursue this kind of climate target. We’ve previously explored how today’s voluntary offset disclosures do not provide adequate information to investors. These existing gaps underscore the importance of consistent, comparable, and reliable information furnished in regulatory filings — exactly as the SEC has proposed. We look forward to the SEC’s final rulemaking and further efforts to improve offset market disclosures."
