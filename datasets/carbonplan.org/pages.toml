title = "California’s shrinking buffer pool – CarbonPlan"
description = "New data released by the California Air Resources Board shows that California’s forest offset buffer pool has shrunk two quarters in a row."
full_description = ".css-b6pqm4{font-size:18px;line-height:1.35;font-family:relative-book-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;letter-spacing:0.01em;margin-top:1em;margin-bottom:1em;}@media screen and (min-width: 40em){.css-b6pqm4{font-size:18px;}}@media screen and (min-width: 64em){.css-b6pqm4{font-size:18px;}}@media screen and (min-width: 102em){.css-b6pqm4{font-size:24px;}}.css-11llkvq{font-size:18px;line-height:1.35;font-family:relative-book-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;letter-spacing:0.01em;margin-top:1em;margin-bottom:1em;font-size:18px;line-height:1.35;font-family:relative-book-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;letter-spacing:0.01em;margin-top:1em;margin-bottom:1em;}@media screen and (min-width: 40em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 64em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 102em){.css-11llkvq{font-size:24px;}}@media screen and (min-width: 40em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 64em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 102em){.css-11llkvq{font-size:24px;}}New data released yesterday by the California Air Resources Board (CARB) shows that California's forest carbon buffer pool shrank by 0.97 million credits, compared to Q4 2023. This marks the second quarter in a row where CARB’s official reporting has shown the buffer pool decreasing in size. In the previous quarter, the buffer pool lost more than 3.4 million credits. The quarterly losses from these official reports from CARB are consistent with our previous attempts to independently track carbon losses on a project-by-project basis. California’s forest offsets program uses a sort of self-insurance program, called a buffer pool, to insure carbon losses that stem from unexpected events, like wildfire. All projects pay into the pool when they’re issued new credits. The regulator retires credits from the pool when something goes wrong. While we’ve .css-fnw7dn{color:var(--theme-ui-colors-text);-webkit-text-decoration:underline;text-decoration:underline;cursor:pointer;}@media (hover: hover) and (pointer: fine){.css-fnw7dn:active{color:var(--theme-ui-colors-text);}.css-fnw7dn:hover{color:var(--theme-ui-colors-secondary);}}.css-1kesrdv{color:var(--theme-ui-colors-text);-webkit-text-decoration:underline;text-decoration:underline;cursor:pointer;color:var(--theme-ui-colors-text);-webkit-text-decoration:underline;text-decoration:underline;cursor:pointer;}@media (hover: hover) and (pointer: fine){.css-1kesrdv:active{color:var(--theme-ui-colors-text);}.css-1kesrdv:hover{color:var(--theme-ui-colors-secondary);}}@media (hover: hover) and (pointer: fine){.css-1kesrdv:active{color:var(--theme-ui-colors-text);}.css-1kesrdv:hover{color:var(--theme-ui-colors-secondary);}}regularly covered carbon losses at the scale of individual projects, this update looks at CARB’s Compliance Instrument Reports, which provide an official accounting of the current size of California’s forest offset buffer pool. These data provide additional context about the significance of carbon loss events over the years at a program-wide scale (Figure 1). .css-1rkzpad{box-sizing:border-box;margin:0;min-width:0;margin-top:48px;margin-bottom:48px;}@media screen and (min-width: 40em){.css-1rkzpad{margin-top:48px;margin-bottom:48px;}}@media screen and (min-width: 64em){.css-1rkzpad{margin-top:48px;margin-bottom:48px;}}@media screen and (min-width: 102em){.css-1rkzpad{margin-top:64px;margin-bottom:64px;}}@media print{.css-1rkzpad{break-inside:avoid;}}.css-11cfehs{box-sizing:border-box;margin:0;min-width:0;margin-bottom:24px;}@media screen and (min-width: 40em){.css-11cfehs{margin-bottom:24px;}}@media screen and (min-width: 64em){.css-11cfehs{margin-bottom:24px;}}@media screen and (min-width: 102em){.css-11cfehs{margin-bottom:32px;}}.css-n5svn3{box-sizing:border-box;margin:0;min-width:0;width:100%;height:275px;}@med