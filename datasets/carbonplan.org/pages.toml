idth: 64em){.css-1ct0h9y{font-size:14px;}}@media screen and (min-width: 102em){.css-1ct0h9y{font-size:18px;}}.css-z48a9j{padding-left:4px;padding-right:4px;padding-bottom:3px;padding-top:1px;margin-left:1px;margin-right:1px;font-size:14px;font-family:relative-mono-11-pitch-pro,Menlo,monospace;letter-spacing:0.07em;background-color:var(--theme-ui-colors-hinted);color:var(--theme-ui-colors-primary);border-radius:1px;padding-left:4px;padding-right:4px;padding-bottom:3px;padding-top:1px;margin-left:1px;margin-right:1px;font-size:14px;font-family:relative-mono-11-pitch-pro,Menlo,monospace;letter-spacing:0.07em;background-color:var(--theme-ui-colors-hinted);color:var(--theme-ui-colors-primary);border-radius:1px;}@media screen and (min-width: 40em){.css-z48a9j{font-size:14px;}}@media screen and (min-width: 64em){.css-z48a9j{font-size:14px;}}@media screen and (min-width: 102em){.css-z48a9j{font-size:18px;}}@media screen and (min-width: 40em){.css-z48a9j{font-size:14px;}}@media screen and (min-width: 64em){.css-z48a9j{font-size:14px;}}@media screen and (min-width: 102em){.css-z48a9j{font-size:18px;}}Flows and Tasks. Adapting existing Python functions into Prefect tasks only requires adding a decorator. Using Prefect provided several useful features, including the ability to add notifications — logging, retries, caching, failure, etc. — to our pipelines, and relatively smooth integration with Dask for running our workflows at scale both in parallel and distributed settings. In the sections that follow, we’ll delve deeper into some specific technological choices we made, their challenges, and the lessons we learned. Prefect orchestration and caching In complex processing pipelines, which tend to occasionally fail, caching data between processing steps makes it possible to restart a task upon failure without restarting the pipeline from scratch. While prefect has some built-in caching support, it lacks (at version 0.15.13) caching of Xarray datasets. Because of this limitation, we explored alternative solutions, each of which had strengths and weaknesses. .css-1lil6wb{font-size:24px;font-family:relative-medium-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;line-height:1.2;margin-top:24px;margin-bottom:16px;}@media screen and (min-width: 40em){.css-1lil6wb{font-size:24px;margin-top:32px;margin-bottom:24px;}}@media screen and (min-width: 64em){.css-1lil6wb{font-size:24px;margin-top:32px;margin-bottom:24px;}}@media screen and (min-width: 102em){.css-1lil6wb{font-size:34px;}}.css-2rwp0w{font-size:24px;font-family:relative-medium-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;line-height:1.2;margin-top:24px;margin-bottom:16px;font-size:24px;font-family:relative-medium-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;line-height:1.2;margin-top:24px;margin-bottom:16px;}@media screen and (min-width: 40em){.css-2rwp0w{font-size:24px;margin-top:32px;margin-bottom:24px;}}@media screen and (min-width: 64em){.css-2rwp0w{font-size:24px;margin-top:32px;margin-bottom:24px;}}@media screen and (min-width: 102em){.css-2rwp0w{font-size:34px;}}@media screen and (min-width: 40em){.css-2rwp0w{font-size:24px;margin-top:32px;margin-bottom:24px;}}@media screen and (min-width: 64em){.css-2rwp0w{font-size:24px;margin-top:32px;margin-bottom:24px;}}@media screen and (min-width: 102em){.css-2rwp0w{font-size:34px;}}Caching via the xpersist package We initially worked around Prefect's lack of caching support for Xarray objects by using xpersist, a Python package that extends prefect’s caching functionality with Zarr support, using code similar to the following example: .css-1uml2x8{box-sizing:border-box;margin:0;min-width:0;padding:16px;font-size:14px;font-family:relative-mono-11-pitch-pro,Menlo,monospace;letter-spacing:0.07em;border-radius:1px;overflow-wrap:break-word;word-wrap:break-word;word-break:break-word;white-space:break-spaces;color:var(--theme-ui-colors-primary);background-color:var(--theme-ui-c