["https://carbonplan.org/blog/geochemical-cdr-measurements"]
title = "New report makes geochemical CDR measurements understandable and accessible – CarbonPlan"
description = "“Measurements in Geochemical Carbon Dioxide Removal” by Campbell et al. presents a timely synthesis of measurement techniques to support CDR decision-making with a strong technical foundation."
full_description = ".css-b6pqm4{font-size:18px;line-height:1.35;font-family:relative-book-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;letter-spacing:0.01em;margin-top:1em;margin-bottom:1em;}@media screen and (min-width: 40em){.css-b6pqm4{font-size:18px;}}@media screen and (min-width: 64em){.css-b6pqm4{font-size:18px;}}@media screen and (min-width: 102em){.css-b6pqm4{font-size:24px;}}.css-11llkvq{font-size:18px;line-height:1.35;font-family:relative-book-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;letter-spacing:0.01em;margin-top:1em;margin-bottom:1em;font-size:18px;line-height:1.35;font-family:relative-book-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;letter-spacing:0.01em;margin-top:1em;margin-bottom:1em;}@media screen and (min-width: 40em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 64em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 102em){.css-11llkvq{font-size:24px;}}@media screen and (min-width: 40em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 64em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 102em){.css-11llkvq{font-size:24px;}}Yesterday, researchers published the first edition of .css-fnw7dn{color:var(--theme-ui-colors-text);-webkit-text-decoration:underline;text-decoration:underline;cursor:pointer;}@media (hover: hover) and (pointer: fine){.css-fnw7dn:active{color:var(--theme-ui-colors-text);}.css-fnw7dn:hover{color:var(--theme-ui-colors-secondary);}}.css-1kesrdv{color:var(--theme-ui-colors-text);-webkit-text-decoration:underline;text-decoration:underline;cursor:pointer;color:var(--theme-ui-colors-text);-webkit-text-decoration:underline;text-decoration:underline;cursor:pointer;}@media (hover: hover) and (pointer: fine){.css-1kesrdv:active{color:var(--theme-ui-colors-text);}.css-1kesrdv:hover{color:var(--theme-ui-colors-secondary);}}@media (hover: hover) and (pointer: fine){.css-1kesrdv:active{color:var(--theme-ui-colors-text);}.css-1kesrdv:hover{color:var(--theme-ui-colors-secondary);}}“Measurements in Geochemical Carbon Dioxide Removal” (Campbell et al. 2023), to which CarbonPlan contributed a forward. This work was led by scientists at Heriot-Watt University, and funded in part by the Industrial Decarbonisation Research and Innovation Centre (IDRIC). The report consolidates technical best practices for geochemical measurements that are relevant to carbon dioxide removal (CDR) approaches like enhanced weathering and alkaline waste mineralization. It is freely accessible to the public, and should serve as a resource for all members of the geochemical CDR community to learn about relevant analytical techniques and how they can contribute to more effective and informed decision-making. There are two features of this report that we are especially excited to highlight. First, this report provides a much-needed summary of the “what,” the “why,” and the “how” of scientific measurements that are relevant to geochemical CDR. It is rare to find this type of information in a clear, consolidated, and publicly accessible form. Information about laboratory measurement techniques is often buried in dense scientific papers, many of which are restricted to paying customers and institutions. Even the relevant, freely available papers can be hard for non-experts to find because they are spread across the many scientific disciplines that geochemical CDR touches. Moreover, scientific papers are usually narrow in scope and assume the reader has some basic knowledge about how the lab instruments work. This report provides a useful entry point to anyone interested in understanding geochemical measurements and how they might be used for CDR. Second, this report represents a broad and collaborative effort that is poised to evolve alongside our understanding of geochemical CDR. Carbon removal accounting is improving through smarter field sampling, better laboratory precision, and new types of measurements. This report can capture those changes in future editions. The authors of the first edition want feedback from the CDR community and invite collaborations with CDR researchers and companies in preparing for the next edition. We think this potential for cross-disciplinary engagement elevates the significance of this report beyond its content alone. As interest, research, and investment in geochemical CDR accelerates, it will be important to ensure that the “big picture” — as embodied in monitoring, reporting, and verification (MRV) standards or deployment plans — rests upon a rigorous technical foundation. By making technical knowledge more widely accessible, “Measurements in Geochemical Carbon Dioxide Removal” supports progress toward understanding and effectively implementing geochemical CDR."
year_published = 2025
