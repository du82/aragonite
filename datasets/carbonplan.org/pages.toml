x;margin-bottom:2px;border-bottom-width:1px;}@media screen and (min-width: 40em){.css-sroztq{grid-template-columns:repeat(6, 1fr);}}@media screen and (min-width: 64em){.css-sroztq{grid-template-columns:repeat(6, 1fr);}}@media screen and (min-width: 102em){.css-sroztq{grid-template-columns:repeat(6, 1fr);}}@media screen and (min-width: 40em){.css-sroztq{-webkit-column-gap:32px;column-gap:32px;row-gap:0;padding-top:16px;padding-bottom:18px;}}@media screen and (min-width: 64em){.css-sroztq{-webkit-column-gap:32px;column-gap:32px;row-gap:0;padding-top:16px;padding-bottom:18px;}}@media screen and (min-width: 102em){.css-sroztq{-webkit-column-gap:48px;column-gap:48px;row-gap:0;padding-top:20px;padding-bottom:22px;}}Time20 min 24 seconds2 min 49 seconds As the table above shows, the ARCO/Kerchunk method took under three minutes, compared to the 20 minutes that would be required to download the data. And these times are based on processing just a small subset of the data — for the entire dataset, the use of Kerchunk can reduce processing time from weeks to days. Try it yourself! We hope that the example above shows the utility of Kerchunk for large-scale analysis of Earth Science data. The Kerchunk reference we made can be freely used or redistributed, and the source NEX-GDDP-CMIP6 dataset used to create the reference is licensed under Creative Commons Zero license (CC0) and the underlying CMIP6 datasets are licensed under Creative Commons - Attribution 4.0 (CC4). More examples of using Kerchunk can be found on the official docs as well as the Project Pythia cookbook. The Kerchunk project is under active development, so you might find some sharp edges and breaking changes. At the time of writing, Kerchunk supports NetCDF 3 and 4, GRIB2, TIFF/GeoTIFF and FITS; other archival formats are not yet supported. Additionally, if your use case requires a different chunking schema than the underlying file chunking, you will want to look to ETL tools such as pangeo-forge-recipes and x