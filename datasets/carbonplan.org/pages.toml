res, droughts, and floods, have already taken a significant financial toll..css-1e1rxlp{box-sizing:border-box;margin:0;min-width:0;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;}.css-wv55ls{box-sizing:border-box;margin:0;min-width:0;font-size:16px;cursor:pointer;color:var(--theme-ui-colors-yellow);-webkit-transition:color 0.2s ease-in-out;transition:color 0.2s ease-in-out;}@media screen and (min-width: 40em){.css-wv55ls{font-size:16px;}}@media screen and (min-width: 64em){.css-wv55ls{font-size:16px;}}@media screen and (min-width: 102em){.css-wv55ls{font-size:20px;}}1.css-ct36pl{box-sizing:border-box;margin:0;min-width:0;float:none;clear:none;margin-right:0;margin-left:0;width:calc(4 * 100vw / 6 - 30px);margin-top:16px;margin-bottom:16px;vertical-align:baseline;position:relative;display:none;}@media screen and (min-width: 40em){.css-ct36pl{float:none;clear:none;margin-right:calc(1 * 100vw / 8);margin-left:calc(1 * 100vw / 8);width:calc(4 * 100vw / 8 - 42px);margin-top:16px;margin-bottom:16px;display:none;}}@media screen and (min-width: 64em){.css-ct36pl{float:right;clear:right;margin-right:calc(-1 * (3 * (100vw - 32px * 13) / 12 + 32px * 3));margin-left:0;width:calc(2 * (100vw - 32px * 13) / 12 + 32px);margin-top:0;margin-bottom:16px;display:initial;}}@media screen and (min-width: 102em){.css-ct36pl{float:right;clear:right;margin-right:calc(-1 * (3 * (100vw - 48px * 13) / 12 + 48px * 3));margin-left:0;width:calc(2 * (100vw - 48px * 13) / 12 + 48px);margin-top:0;margin-bottom:24px;display:initial;}}.css-olltdc{box-sizing:border-box;margin:0;min-width:0;width:100%;}.css-1n5estl{box-sizing:border-box;margin:0;min-width:0;font-family:relative-book-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;width:100%;font-size:14px;line-height:1.25;letter-spacing:0.0125em;color:var(--theme-ui-colors-yellow);opacity:1;display:inline-block;-webkit-transition:opacity 0.2s ease-in-out;transition:opacity 0.2s ease-in-out;text-align:left;}@media screen and (min-width: 40em){.css-1n5estl{font-size:14px;opacity:1;text-align:left;}}@media screen and (min-width: 64em){.css-1n5estl{font-size:13px;opacity:0.5;text-align:right;}}@media screen and (min-width: 102em){.css-1n5estl{font-size:15px;text-align:right;}}.css-9d3yd0{box-sizing:border-box;margin:0;min-width:0;position:relative;right:100%;margin-right:10px;margin-top:-50px;text-align:right;line-height:1.25;letter-spacing:0.0125em;display:none;}@media screen and (min-width: 40em){.css-9d3yd0{display:none;}}@media screen and (min-width: 64em){.css-9d3yd0{display:initial;}}1.css-17i6oxh{box-sizing:border-box;margin:0;min-width:0;margin-top:0;text-align:left;display:initial;line-height:1.25;letter-spacing:0.0125em;}@media screen and (min-width: 40em){.css-17i6oxh{margin-top:0;display:initial;}}@media screen and (min-width: 64em){.css-17i6oxh{margin-top:-16px;display:block;}}@media screen and (min-width: 102em){.css-17i6oxh{margin-top:-18px;}}NOAA National Centers for Environmental Information (NCEI) (2023) U.S. Billion-Dollar Weather and Climate Disasters In 2022 alone, there were 18 events that together caused a total of $165 billion in damages. Entities are taking steps in response: governmental institutions around the globe are .css-fnw7dn{color:var(--theme-ui-colors-text);-webkit-text-decoration:underline;text-decoration:underline;cursor:pointer;}@media (hover: hover) and (pointer: fine){.css-fnw7dn:active{color:var(--theme-ui-colors-text);}.css-fnw7dn:hover{color:var(--theme-ui-colors-secondary);}}.css-1kesrdv{color:var(--theme-ui-colors-text);-webkit-text-decoration:underline;text-decoration:underline;cursor:pointer;color:var(--theme-ui-colors-text);-webkit-text-decoration:underline;text-decoration:underline;cursor:pointer;}@media (hover: hover) and (pointer: fine){.css-1kesrdv:active{color:var(--theme-ui-colors-text);}.css-1kesrdv:hover{color:var(--theme-ui-colors-secondary);}}@media (hover: hover) and (pointer: fine){.css-1kesrdv:active{color:var(--theme-ui-colors-text);}.css-1kesrdv:hover{color:var(--theme-ui-colors-secondary);}}proposing and issuing climate-related financial standards; non-governmental organizations have set forth voluntary frameworks for climate-related financial risk disclosure;2.css-152u3o5{box-sizing:border-box;margin:0;min-width:0;float:none;clear:none;margin-right:0;margin-left:0;width:calc(4 * 100vw / 6 - 30px);margin-top:16px;margin-bottom:16px;vertical-align:baseline;position:relative;display:none;}@media screen and (min-width: 40em){.css-152u3o5{float:none;clear:none;margin-right:calc(1 * 100vw / 8);margin-left:calc(1 * 100vw / 8);width:calc(4 * 100vw / 8 - 42px);margin-top:16px;margin-bottom:16px;display:none;}}@media screen and (min-width: 64em){.css-152u3o5{float:right;clear:right;margin-right:calc(-1 * (3 * (100vw - 32px * 13) / 12 + 32px * 3));margin-left:0;width:calc(2 * (100vw - 32px * 13) / 12 + 32px);margin-top:0;margin-bottom:16px;display:initial;}}@media screen and (min-width: 102em){.css-152u3o5{float:right;clear:right;margin-right:calc(-1 * (3 * (100vw - 48px * 13) / 12 + 48px * 3));margin-left:0;width:calc(2 * (100vw - 48px * 13) / 12 + 48px);margin-top:0;margin-bottom:24px;display:initial;}}.css-152u3o5 a{color:inherit;}.css-152u3o5 a:hover{color:inherit;}2See, for example, the Task Force on Climate-Related Financial Disclosures (TCFD). and policy efforts are emerging to better identify climate risks to the financial system and overall economy.33 For example, in 2021, President Biden issued Executive Order 14030 (EO 14030) to direct certain financial regulatory agencies to take steps to integrate climate-related financial risk into areas such as market regulation and financial stability. Later that year, the Financial Stability Oversight Council released its Report on Climate-Related Financial Risk, which identified climate risk as an “emerging and increasing threat” to U.S. financial stability and recommended that financial regulators evaluate whether existing assessment, disclosure, and risk management frameworks need to be updated or enhanced to include the consideration of climate-related financial risk. The physical risks of climate change44Climate-related financial risk assessments can include transition risk (i.e., the risks associated with societal responses to a changing climate, such as climate-related shifts in legislation, regulation, technology, and consumer preferences) as well as physical risk (i.e., the risks associated with weather and climate hazards). Here, we focus solely on physical risk. can be either acute (e.g., short-lived weather events like hurricanes) or chronic (e.g., changes in baseline conditions, like rising sea levels).55Condon et al. (2021) Mandating Disclosure of Climate-Related Financial Risk New York University Journal of Legislation and Public Policy Estimating physical climate risk exposure for a particular entity — an industry, city, or business — requires an interdisciplinary process that encompasses climate science, economics, and finance, and spans multiple timescales and geographies. .css-a7gsc6{font-size:34px;font-family:relative-medium-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;line-height:1.1;margin-top:32px;margin-bottom:24px;}@media screen and (min-width: 40em){.css-a7gsc6{font-size:34px;margin-top:48px;margin-bottom:32px;}}@media screen and (min-width: 64em){.css-a7gsc6{font-size:34px;margin-top:48px;margin-bottom:32px;}}@media screen and (min-width: 102em){.css-a7gsc6{font-size:48px;}}.css-1ebnuvp{font-size:34px;font-family:relative-medium-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;line-height:1.1;margin-top:32px;margin-bottom:24px;font-size:34px;font-family:relative-medium-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;line-height:1.1;margin-top:32px;margin-bottom:24px;}@media screen and (min-width: 40em){.css-1ebnuvp{font-size:34px;margin-top:48px;margin-bottom:32px;}}@media screen and (min-width: 64em){.css-1ebnuvp{font-size:34px;margin-top:48px;margin-bottom:32px;}}@media screen and (min-width: 102em){.css-1ebnuvp{font-size:48px;}}@media screen and (min-width: 40em){.css-1ebnuvp{font-size:34px;margin-top:48px;margin-bottom:32px;}}@media screen and (min-width: 64em){.css-1ebnuvp{font-size:34px;margin-top:48px;margin-bottom:32px;}}@media screen and (min-width: 102em){.css-1ebnuvp{font-size:48px;}}A collaborative workshop series To better understand this diversity, the Environmental Defense Fund (EDF), the Initiative on Climate Risk and Resilience Law (ICRRL), and CarbonPlan hosted a joint workshop in May of 2022 on the use of physical climate information in the financial sector. The workshop convened former regulators and domain experts across multiple communities of practice — physical climate science modeling, economics, financial risk, law, and public policy — to discuss: (1) if and how physical risk information was currently being used; and (2) current gaps, challenges, and concerns with the use of physical risk information. A key takeaway from this workshop was the need for better translation of physical climate science concepts across disciplines and more robust frameworks to guide the analytical process of risk assessment, corroborating a recent call for a new profession of “climate translation.”66Fiedler et al. (2021) Business Risk and the Emergence of Climate Analytics Nature Climate Change In the Fall of 2022, we explored this key takeaway further via a workshop series focused on extreme heat and electric utilities. The goal of these sessions was two-fold: (1) to map, in as much detail as possible, how climate data was being used throughout the analytical process of a physical climate-related financial risk assessment; and (2) to identify opportunities to improve the process of estimating and evaluating climate risk. This report summarizes outcomes of the Fall workshops and, in particular, highlights the discussions centered around how climate-related financial risk assessments are currently conducted. This report also collates community concerns and identifies opportunities for improvement in the process of conducting and using climate-related financial risk assessments.77 We note that this summary joins a variety of related approaches, inquiries, and guides. For example, the TCFD offers guidance on assessing climate-related financial risk. Focusing on the electric sector Physical climate risks are relevant to the entire United States economy. Any given company is subject to specific physical risks and will be exposed to particular harms, depending on the type and location of its physical assets, infrastructure, workers, and supply chain partners.5.css-1wcvjcq{box-sizing:border-box;margin:0;min-width:0;float:none;clear:none;margin-right:0;margin-left:0;width:calc(4 * 100vw / 6 - 30px);margin-top:16px;margin-bottom:16px;vertical-align:baseline;position:relative;display:none;}@media screen and (min-width: 40em){.css-1wcvjcq{float:none;clear:none;margin-right:calc(1 * 100vw / 8);margin-left:calc(1 * 100vw / 8);width:calc(4 * 100vw / 8 - 42px);margin-top:16px;margin-bottom:16px;}}@media screen and (min-width: 64em){.css-1wcvjcq{float:right;clear:right;margin-right:calc(-1 * (3 * (100vw - 32px * 13) / 12 + 32px * 3));margin-left:0;width:calc(2 * (100vw - 32px * 13) / 12 + 32px);margin-top:0;margin-bottom:16px;}}@media screen and (min-width: 102em){.css-1wcvjcq{float:right;clear:right;margin-right:calc(-1 * (3 * (100vw - 48px * 13) / 12 + 48px * 3));margin-left:0;width:calc(2 * (100vw - 48px * 13) / 12 + 48px);margin-top:0;margin-bottom:24px;}}5Condon et al. (2021) Mandating Disclosure of Climate-Related Financial Risk New York University Journal of Legislation and Public Policy To narrow scope, the workshop focused on a particular case study about the financial risk to one sector (electric utilities) impacted by one climatic hazard (extreme heat). This focus area was chosen for two reasons. First, electric utilities serve an important public function through the provision of essential services. Power outages pose serious health consequences, such as temperature-related illness or disruption of care for individuals who rely on electricity-dependent medical equipment.88Casey et al. (2020) Power Outages and Community Health: A Narrative Review Current Environmental Health Reports .css-1for8tw{box-sizing:border-box;margin:0;min-width:0;font-size:16px;color:var(--theme-ui-colors-yellow);display:initial;}@media screen and (min-width: 40em){.css-1for8tw{font-size:16px;}}@media screen and (min-width: 64em){.css-1for8tw{font-size:16px;}}@media screen and (min-width: 102em){.css-1for8tw{font-size:20px;}},99According to the North American Electric Reliability Corporation’s (NERC) 2021 Long-Term Reliability Assessment, long duration weather events driven by climate change threaten reliability when demand for electricity is driven above forecasts and supplies are reduced, especially when extremely hot weather encompasses a wide area"
