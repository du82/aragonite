o,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;letter-spacing:0.01em;margin-top:1em;margin-bottom:1em;}@media screen and (min-width: 40em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 64em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 102em){.css-11llkvq{font-size:24px;}}@media screen and (min-width: 40em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 64em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 102em){.css-11llkvq{font-size:24px;}}If it wasn’t clear before the summer of 2023 that climate change is raising temperatures, it better be clear now. This past July broke the record for the .css-fnw7dn{color:var(--theme-ui-colors-text);-webkit-text-decoration:underline;text-decoration:underline;cursor:pointer;}@media (hover: hover) and (pointer: fine){.css-fnw7dn:active{color:var(--theme-ui-colors-text);}.css-fnw7dn:hover{color:var(--theme-ui-colors-secondary);}}.css-1kesrdv{color:var(--theme-ui-colors-text);-webkit-text-decoration:underline;text-decoration:underline;cursor:pointer;color:var(--theme-ui-colors-text);-webkit-text-decoration:underline;text-decoration:underline;cursor:pointer;}@media (hover: hover) and (pointer: fine){.css-1kesrdv:active{color:var(--theme-ui-colors-text);}.css-1kesrdv:hover{color:var(--theme-ui-colors-secondary);}}@media (hover: hover) and (pointer: fine){.css-1kesrdv:active{color:var(--theme-ui-colors-text);}.css-1kesrdv:hover{color:var(--theme-ui-colors-secondary);}}hottest month ever measured. And that was before a life-threatening heat dome boiled large swaths of the US Midwest in August. As extreme heat becomes commonplace, people need to know when and where it will occur. But modeling and predicting heat is complicated. Temperature on its own doesn’t tell the whole story. For example, when it’s hot you sweat, and the water evaporates to cool you down. But if there’s too much moisture in the air (high humidity), that cooling effect can stop working. The amounts of sunlight and wind also matter (the former heats you up, and the latter cools you down)..css-1e1rxlp{box-sizing:border-box;margin:0;min-width:0;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;}.css-wv55ls{box-sizing:border-box;margin:0;min-width:0;font-size:16px;cursor:pointer;color:var(--theme-ui-colors-yellow);-webkit-transition:color 0.2s ease-in-out;transition:color 0.2s ease-in-out;}@media screen and (min-width: 40em){.css-wv55ls{font-size:16px;}}@media screen and (min-width: 64em){.css-wv55ls{font-size:16px;}}@media screen and (min-width: 102em){.css-wv55ls{font-size:20px;}}1.css-152u3o5{box-sizing:border-box;margin:0;min-width:0;float:none;clear:none;margin-right:0;margin-left:0;width:calc(4 * 100vw / 6 - 30px);margin-top:16px;margin-bottom:16px;vertical-align:baseline;position:relative;display:none;}@media screen and (min-width: 40em){.css-152u3o5{float:none;clear:none;margin-right:calc(1 * 100vw / 8);margin-left:calc(1 * 100vw / 8);width:calc(4 * 100vw / 8 - 42px);margin-top:16px;margin-bottom:16px;display:none;}}@media screen and (min-width: 64em){.css-152u3o5{float:right;clear:right;margin-right:calc(-1 * (3 * (100vw - 32px * 13) / 12 + 32px * 3));margin-left:0;width:calc(2 * (100vw - 32px * 13) / 12 + 32px);margin-top:0;margin-bottom:16px;display:initial;}}@media screen and (min-width: 102em){.css-152u3o5{float:right;clear:right;margin-right:calc(-1 * (3 * (100vw - 48px * 13) / 12 + 48px * 3));margin-left:0;width:calc(2 * (100vw - 48px * 13) / 12 + 48px);margin-top:0;margin-bottom:24px;display:initial;}}.css-152u3o5 a{color:inherit;}.css-152u3o5 a:hover{color:inherit;}.css-olltdc{box-sizing:border-box;margin:0;min-width:0;width:100%;}.css-1n5estl{box-sizing:border-box;margin:0;min-width:0;font-family:relative-book-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;width:100%;font-size:14px;line-height:1.25;letter-spacing:0.0125em;color:var(--theme-ui-colors-yellow);opacity:1;display:inline-block;-webkit-transition:opacity 0.2s ease-in-out;transition:opacity 0.2s ease-in-out;text-align:left;}@media screen and (min-width: 40em){.css-1n5estl{font-size:14px;opacity:1;text-align:left;}}@media screen and (min-width: 64em){.css-1n5estl{font-size:13px;opacity:0.5;text-align:right;}}@media screen and (min-width: 102em){.css-1n5estl{font-size:15px;text-align:right;}}.css-9d3yd0{box-sizing:border-box;margin:0;min-width:0;position:relative;right:100%;margin-right:10px;margin-top:-50px;text-align:right;line-height:1.25;letter-spacing:0.0125em;display:none;}@media screen and (min-width: 40em){.css-9d3yd0{display:none;}}@media screen and (min-width: 64em){.css-9d3yd0{display:initial;}}1.css-17i6oxh{box-sizing:border-box;margin:0;min-width:0;margin-top:0;text-align:left;display:initial;line-height:1.25;letter-spacing:0.0125em;}@media screen and (min-width: 40em){.css-17i6oxh{margin-top:0;display:initial;}}@media screen and (min-width: 64em){.css-17i6oxh{margin-top:-16px;display:block;}}@media screen and (min-width: 102em){.css-17i6oxh{margin-top:-18px;}}While wind generally has a cooling effect, at very high temperatures, wind can increase the heat transfer to a body, as opposed to away from it. These parameters vary from minute to minute. And they vary geographically, often at fine spatial scales, especially within cities where human activity and infrastructure trap heat. We want to help planners and the public navigate this complicated science by producing actionable data that will make it easier to understand the risks. As part of a collaborative project with The Washington Post, we developed a new dataset modeling extreme heat under a changing climate. We built on a foundation of academic work, aiming to combine the best pieces of several existing methods and datasets to produce something new, albeit with several assumptions and approximations. And we’re making all of our data, methods, and code fully public. In this explainer we describe how and why we developed the new dataset, and provide details on our methods, assumptions, and results. .css-a7gsc6{font-size:34px;font-family:relative-medium-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;line-height:1.1;margin-top:32px;margin-bottom:24px;}@media screen and (min-width: 40em){.css-a7gsc6{font-size:34px;margin-top:48px;margin-bottom:32px;}}@media screen and (min-width: 64em){.css-a7gsc6{font-size:34px;margin-top:48px;margin-bottom:32px;}}@media screen and (min-width: 102em){.css-a7gsc6{font-size:48px;}}.css-1ebnuvp{font-size:34px;font-family:relative-medium-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;line-height:1.1;margin-top:32px;margin-bottom:24px;font-size:34px;font-family:relative-medium-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;line-height:1.1;margin-top:32px;margin-bottom:24px;}@media screen and (min-width: 40em){.css-1ebnuvp{font-size:34px;margin-top:48px;margin-bottom:32px;}}@media screen and (min-width: 64em){.css-1ebnuvp{font-size:34px;margin-top:48px;margin-bottom:32px;}}@media screen and (min-width: 102em){.css-1ebnuvp{font-size:48px;}}@media screen and (min-width: 40em){.css-1ebnuvp{font-size:34px;margin-top:48px;margin-bottom:32px;}}@media screen and (min-width: 64em){.css-1ebnuvp{font-size:34px;margin-top:48px;margin-bottom:32px;}}@media screen and (min-width: 102em){.css-1ebnuvp{font-size:48px;}}Choosing a metric Many different metrics capture how we experience the combined effects of temperature, humidity, and other factors, and they all say something slightly different about the risks. Among them, the wet-bulb globe temperature (WBGT) is probably the most widely used, especially in international contexts. Originally developed under the US military to monitor heat illness,2.css-ct36pl{box-sizing:border-box;margin:0;min-width:0;float:none;clear:none;margin-right:0;margin-left:0;width:calc(4 * 100vw / 6 - 30px);margin-top:16px;margin-bottom:16px;vertical-align:baseline;position:relative;display:none;}@media screen and (min-width: 40em){.css-ct36pl{float:none;clear:none;margin-right:calc(1 * 100vw / 8);margin-left:calc(1 * 100vw / 8);width:calc(4 * 100vw / 8 - 42px);margin-top:16px;margin-bottom:16px;display:none;}}@media screen and (min-width: 64em){.css-ct36pl{float:right;clear:right;margin-right:calc(-1 * (3 * (100vw - 32px * 13) / 12 + 32px * 3));margin-left:0;width:calc(2 * (100vw - 32px * 13) / 12 + 32px);margin-top:0;margin-bottom:16px;display:initial;}}@media screen and (min-width: 102em){.css-ct36pl{float:right;clear:right;margin-right:calc(-1 * (3 * (100vw - 48px * 13) / 12 + 48px * 3));margin-left:0;width:calc(2 * (100vw - 48px * 13) / 12 + 48px);margin-top:0;margin-bottom:24px;display:initial;}}2C P Yaglou & D Minard (1957) Control of heat casualties at military training centers AMA Arch Ind Health WBGT combines four key variables — temperature, humidity, solar radiation,33Solar radiation captures the warming effects of sunlight. It typically ranges from 300 W/m² (noon on a sunny day in the winter) to 600 W/m² (noon on a cloudy day in the summer) to 900 W/m² (noon on a sunny day in the summer). and wind — into a single number. Safety thresholds for that number have been developed in the context of athletic training, strenuous work (particularly outdoors), and other activities. While the units of WBGT are familiar (degrees Celsius or Fahrenheit), the scale may not be, with even moderately high values still posing substantial risk. The Occupational Safety and Health Administration (OSHA), for example, says that strenuous work at a WBGT of 25 ºC (77 ºF) or higher poses a risk of heat-related illness. When WBGT is over 32 ºC (89.6 ºF) a short period of outdoor work, even by a healthy individual, risks illness or death.44In 2021 President Biden instructed OSHA to draft an extreme heat standard, but it is taking years to develop. The calculator below (Figure 1) can help build intuition for how different variables together determine WBGT. Use it to confirm, for example, that with low humidity (10%), light wind (1 m/s), and moderate radiation (500 W/m²), a WBGT of 32 ºC (89.6 ºF) requires a blazingly hot temperature of 45 ºC (113 ºF). Despite the unintuitive scale, WBGT accounts for more physical variables than alternatives like the heat index or Humidex, and therefore provides a more detailed window into the risks of heat stress.55 There is much discussion in the public health literature about the relative importance of humidity in determining health outcomes. We hope that our research can help support that work. .css-1rkzpad{box-sizing:border-box;margin:0;min-width:0;margin-top:48px;margin-bottom:48px;}@media screen and (min-width: 40em){.css-1rkzpad{margin-top:48px;margin-bottom:48px;}}@media screen and (min-width: 64em){.css-1rkzpad{margin-top:48px;margin-bottom:48px;}}@media screen and (min-width: 102em){.css-1rkzpad{margin-top:64px;margin-bottom:64px;}}@media print{.css-1rkzpad{break-inside:avoid;}}.css-1f1ra8m{box-sizing:border-box;margin:0;min-width:0;mar"
