-jfbheh{box-sizing:border-box;margin:0;min-width:0;display:grid;grid-gap:16px;grid-template-columns:repeat(3, 1fr);-webkit-column-gap:24px;column-gap:24px;row-gap:0;vertical-align:baseline;border:0;outline:0;margin:0;padding:0;border-style:solid;border-width:0px;border-top-width:1px;border-color:var(--theme-ui-colors-muted);padding-top:16px;padding-bottom:18px;margin-bottom:2px;border-bottom-width:1px;}@media screen and (min-width: 40em){.css-jfbheh{grid-template-columns:repeat(3, 1fr);}}@media screen and (min-width: 64em){.css-jfbheh{grid-template-columns:repeat(3, 1fr);}}@media screen and (min-width: 102em){.css-jfbheh{grid-template-columns:repeat(3, 1fr);}}@media screen and (min-width: 40em){.css-jfbheh{-webkit-column-gap:32px;column-gap:32px;row-gap:0;padding-top:16px;padding-bottom:18px;}}@media screen and (min-width: 64em){.css-jfbheh{-webkit-column-gap:32px;column-gap:32px;row-gap:0;padding-top:16px;padding-bottom:18px;}}@media screen and (min-width: 102em){.css-jfbheh{-webkit-column-gap:48px;column-gap:48px;row-gap:0;padding-top:20px;padding-bottom:22px;}}Warm Springs ACR2602.68New reporting.css-1f1ra8m{box-sizing:border-box;margin:0;min-width:0;margin-bottom:0;}.css-14449re{box-sizing:border-box;margin:0;min-width:0;color:var(--theme-ui-colors-secondary);display:block;text-align:left;font-size:16px;}@media screen and (min-width: 40em){.css-14449re{font-size:16px;}}@media screen and (min-width: 64em){.css-14449re{font-size:16px;}}@media screen and (min-width: 102em){.css-14449re{font-size:18px;}}.css-14449re a{color:var(--theme-ui-colors-secondary);}.css-14449re a:hover{color:var(--theme-ui-colors-primary);}.css-14449re>p{display:inline;font-size:16px;}@media screen and (min-width: 40em){.css-14449re>p{font-size:16px;}}@media screen and (min-width: 64em){.css-14449re>p{font-size:16px;}}@media screen and (min-width: 102em){.css-14449re>p{font-size:18px;}}.css-1sk0a8c{box-sizing:border-box;margin:0;min-width:0;text-transform:uppercase;letter-spacing:0.07em;display:inline-block;}table 1 .css-3dr1uz{box-sizing:border-box;margin:0;min-width:0;display:inline-block;margin-left:4px;margin-right:4px;padding-right:4px;}/Magnitude of, and source of current information on, wildfire reversals that have burned six of California's forest carbon offset projects. Magnitude denominated in units of million tCO₂. We know about the status of reversals from three different sources: reversals verified by the California Air Resources Board (3 projects), reversals with project paperwork quantifying the magnitude of pending carbon losses (2 projects), and new reporting on the possible termination of ACR260. Under the worst case scenario, wildfire-caused credit losses through the end of the 2022 fire season could total as much as 9.11 million credits. That total far exceeds the approximately 6.5 million credits set aside in the buffer pool to insure against carbon losses due to wildfire. With the program's wildfire reserve likely exhausted, California's regulator will need to compensate future wildfire losses using credits that were initially set aside to protect against other risks, like drought and disease. Looking to the future, it's unsettling that tens of millions of additional credits have been issued to fire-prone forests throughout the West, including arid forests in Arizona and New Mexico, eastern Washington, and northern California. Wildfires in these projects are all but inevitable, posing an existential threat to the solvency of the buffer pool and the continued operation of California's forest offsets program."
