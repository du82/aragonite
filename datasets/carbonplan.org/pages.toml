["https://carbonplan.org/research/ew-quantification"]
title = "Quantifying enhanced weathering – CarbonPlan"
description = "A tool for exploring methods used to quantify enhanced weathering outcomes."
full_description = 'Below, you can explore what kinds of quantitative methods might play a role in estimating net carbon removal from enhanced weathering. Read more in the accompanying .css-63tp4q{box-sizing:border-box;margin:0;min-width:0;color:var(--theme-ui-colors-text);-webkit-text-decoration:underline;text-decoration:underline;cursor:pointer;}@media (hover: hover) and (pointer: fine){.css-63tp4q:active{color:var(--theme-ui-colors-text);}.css-63tp4q:hover{color:var(--theme-ui-colors-secondary);}}explainer. Bulk density refers to the mass of dry soil per unit volume and is influenced by many factors, including soil type and field management. Bulk density measurements are required to rigorously extrapolate soil-based concentration measurements (see e.g., "Soil total carbon," "Soil inorganic carbon," "Soil organic carbon," or "Trace metals") to field-scale stock estimates. Various methods exist to estimate bulk density, including the core method, excavation method, and clod method. Equivalent soil mass accounting is a less widely used, but more rigorous method for reporting soil stock measurements based on soil mass instead of soil volume. Cation exchange capacity (CEC) refers to the negatively charged sites on soil solid surfaces (e.g., clay minerals, organic matter) where cations are attracted, held, and exchanged with soil pore water — collectively called the soil exchange complex. Interactions between cations produced from weathering reactions and the soil exchange complex can produce a delay between initial weathering and detectable changes to cation or dissolved inorganic carbon concentrations in soil pore water or field runoff. Characterizing the CEC and changes in base saturation (the type of cations present on the exchange complex) can be important for interpreting other weathering signals. Changes are most likely to be observed in base saturation/exchange complex cations. However, cation exchange capacity (CEC) itself could change if secondary clay minerals form or if the system pH changes as a result of weathering, which would impact the fraction of CEC that is pH-dependent.'
