["https://carbonplan.org/blog/bootleg-fire-update"]
title = "Klamath East poised for automatic termination – CarbonPlan"
description = "Carbon losses from the Bootleg Fire are severe enough to cause the termination of a forest offset project in Oregon."
full_description = ".css-b6pqm4{font-size:18px;line-height:1.35;font-family:relative-book-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;letter-spacing:0.01em;margin-top:1em;margin-bottom:1em;}@media screen and (min-width: 40em){.css-b6pqm4{font-size:18px;}}@media screen and (min-width: 64em){.css-b6pqm4{font-size:18px;}}@media screen and (min-width: 102em){.css-b6pqm4{font-size:24px;}}.css-11llkvq{font-size:18px;line-height:1.35;font-family:relative-book-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;letter-spacing:0.01em;margin-top:1em;margin-bottom:1em;font-size:18px;line-height:1.35;font-family:relative-book-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;letter-spacing:0.01em;margin-top:1em;margin-bottom:1em;}@media screen and (min-width: 40em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 64em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 102em){.css-11llkvq{font-size:24px;}}@media screen and (min-width: 40em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 64em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 102em){.css-11llkvq{font-size:24px;}}The Klamath East (ACR273) forest carbon offset project is slated for automatic termination as a result of the catastrophic .css-fnw7dn{color:var(--theme-ui-colors-text);-webkit-text-decoration:underline;text-decoration:underline;cursor:pointer;}@media (hover: hover) and (pointer: fine){.css-fnw7dn:active{color:var(--theme-ui-colors-text);}.css-fnw7dn:hover{color:var(--theme-ui-colors-secondary);}}.css-1kesrdv{color:var(--theme-ui-colors-text);-webkit-text-decoration:underline;text-decoration:underline;cursor:pointer;color:var(--theme-ui-colors-text);-webkit-text-decoration:underline;text-decoration:underline;cursor:pointer;}@media (hover: hover) and (pointer: fine){.css-1kesrdv:active{color:var(--theme-ui-colors-text);}.css-1kesrdv:hover{color:var(--theme-ui-colors-secondary);}}@media (hover: hover) and (pointer: fine){.css-1kesrdv:active{color:var(--theme-ui-colors-text);}.css-1kesrdv:hover{color:var(--theme-ui-colors-secondary);}}Bootleg Fire that burned through the project in 2021. New paperwork, filed on Monday, puts total wildfire-induced carbon losses at over 3 million tCO₂. The extent of the damage was so severe that the project's current standing live carbon stocks are lower than the project's baseline carbon stocks. As a result, California's rules require that the entire project be terminated. Automatic termination means retiring 100 percent of the credits already issued to the project from the program's buffer pool — totalling at least 1.14 million offset credits. When combined with the estimated 3.95 million credits that have already or are soon to be retired from the buffer pool, total known wildfire losses through the end of the 2021 fire season stand at 5.09 million credits. We previously estimated that the buffer pool was designed with the assumption that about 6 million credits would be sufficient to cover the wildfire risk of the current portfolio of projects for the next 100 years. The termination of ACR273 would mean about 84 percent of those credits are now gone. And, as we've discussed before, that number will continue to grow once we have an official reversal estimate for the 2020 Lionshead fire. Taken together, it seems increasingly likely that the entire wildfire portion of California's forest carbon buffer pool has already been depleted."
