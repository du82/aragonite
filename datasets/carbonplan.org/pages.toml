["https://carbonplan.org/blog/ftx-donation-return"]
title = "We’re returning our unsolicited donation from FTX – CarbonPlan"
description = "Two years ago, we received a donation we didn’t ask for. Last month, we were asked to send it back."
full_description = ".css-b6pqm4{font-size:18px;line-height:1.35;font-family:relative-book-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;letter-spacing:0.01em;margin-top:1em;margin-bottom:1em;}@media screen and (min-width: 40em){.css-b6pqm4{font-size:18px;}}@media screen and (min-width: 64em){.css-b6pqm4{font-size:18px;}}@media screen and (min-width: 102em){.css-b6pqm4{font-size:24px;}}.css-11llkvq{font-size:18px;line-height:1.35;font-family:relative-book-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;letter-spacing:0.01em;margin-top:1em;margin-bottom:1em;font-size:18px;line-height:1.35;font-family:relative-book-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;letter-spacing:0.01em;margin-top:1em;margin-bottom:1em;}@media screen and (min-width: 40em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 64em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 102em){.css-11llkvq{font-size:24px;}}@media screen and (min-width: 40em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 64em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 102em){.css-11llkvq{font-size:24px;}}In the summer of 2021, we received an unsolicited donation of $200k from the charity arm of the now-disgraced cryptocurrency firm FTX. It was unsolicited both in the sense that we did not ask for it, nor did we agree to accept it. A .css-fnw7dn{color:var(--theme-ui-colors-text);-webkit-text-decoration:underline;text-decoration:underline;cursor:pointer;}@media (hover: hover) and (pointer: fine){.css-fnw7dn:active{color:var(--theme-ui-colors-text);}.css-fnw7dn:hover{color:var(--theme-ui-colors-secondary);}}.css-1kesrdv{color:var(--theme-ui-colors-text);-webkit-text-decoration:underline;text-decoration:underline;cursor:pointer;color:var(--theme-ui-colors-text);-webkit-text-decoration:underline;text-decoration:underline;cursor:pointer;}@media (hover: hover) and (pointer: fine){.css-1kesrdv:active{color:var(--theme-ui-colors-text);}.css-1kesrdv:hover{color:var(--theme-ui-colors-secondary);}}@media (hover: hover) and (pointer: fine){.css-1kesrdv:active{color:var(--theme-ui-colors-text);}.css-1kesrdv:hover{color:var(--theme-ui-colors-secondary);}}story in Forbes covered the bizarre incident well. After much consternation, we decided to keep the money, which we considered the best of several bad options. While the donation had no specific project or terms associated with it, we used the money, in large part, to fund our research on the problems with migrating carbon offsets to the blockchain, and we acknowledged the funding when publishing our research. We thought that was the end of the story. But as soon as we, with the rest of the world, heard about the collapse of FTX, we began to wonder when the other shoe would drop. Sure enough, at the end of December 2023, right before our holiday break, we received an email from the lawyers representing FTX’s debtors. The debtors wanted the money back. And other nonprofits, including Stanford University and the Metropolitan Museum of Art, had already decided to voluntarily return the donations FTX gave them. After counsel from both our lawyers and our Board, we agreed to return the money. As a small nonprofit, losing $200k right at the start of a new year was painful. But we’re fortunate to be in a financial position where the impact on our work and plans was minimal. Many nonprofits were not so lucky. Some also likely received, and are now returning, much larger sums of money. My heart goes out to those that are struggling to deal with the fallout. It’s an unfortunate reality that so many of our public support systems today rely on a network of underfunded nonprofit organizations and the donors that support them. But that system, at least, operates according to a set of norms — and in some cases, laws — around the giving and receiving of donations. Those norms include intentionality, integrity, veracity, and transparency. Those norms allow the nonprofit community to operate effectively and do good work. In this instance, FTX violated those norms. We were lucky to come out relatively unscathed, and our work will continue in full force. But I expect the consequences will continue to be felt by others for years to come."
year_published = 2025
clearnet = "https://carbonplan.org/blog/ftx-donation-return"
