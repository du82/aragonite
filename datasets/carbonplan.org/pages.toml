["https://carbonplan.org/blog/soil-protocols-added"]
title = "Additions to our analysis of soil carbon protocols – CarbonPlan"
description = "We analyzed three new soil carbon protocols and added them our interactive database."
full_description = ".css-b6pqm4{font-size:18px;line-height:1.35;font-family:relative-book-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;letter-spacing:0.01em;margin-top:1em;margin-bottom:1em;}@media screen and (min-width: 40em){.css-b6pqm4{font-size:18px;}}@media screen and (min-width: 64em){.css-b6pqm4{font-size:18px;}}@media screen and (min-width: 102em){.css-b6pqm4{font-size:24px;}}.css-11llkvq{font-size:18px;line-height:1.35;font-family:relative-book-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;letter-spacing:0.01em;margin-top:1em;margin-bottom:1em;font-size:18px;line-height:1.35;font-family:relative-book-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;letter-spacing:0.01em;margin-top:1em;margin-bottom:1em;}@media screen and (min-width: 40em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 64em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 102em){.css-11llkvq{font-size:24px;}}@media screen and (min-width: 40em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 64em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 102em){.css-11llkvq{font-size:24px;}}In July 2021, we published an .css-fnw7dn{color:var(--theme-ui-colors-text);-webkit-text-decoration:underline;text-decoration:underline;cursor:pointer;}@media (hover: hover) and (pointer: fine){.css-fnw7dn:active{color:var(--theme-ui-colors-text);}.css-fnw7dn:hover{color:var(--theme-ui-colors-secondary);}}.css-1kesrdv{color:var(--theme-ui-colors-text);-webkit-text-decoration:underline;text-decoration:underline;cursor:pointer;color:var(--theme-ui-colors-text);-webkit-text-decoration:underline;text-decoration:underline;cursor:pointer;}@media (hover: hover) and (pointer: fine){.css-1kesrdv:active{color:var(--theme-ui-colors-text);}.css-1kesrdv:hover{color:var(--theme-ui-colors-secondary);}}@media (hover: hover) and (pointer: fine){.css-1kesrdv:active{color:var(--theme-ui-colors-text);}.css-1kesrdv:hover{color:var(--theme-ui-colors-secondary);}}analysis of 14 protocols that certify or issue credits for soil carbon removal. Our systematic review of the protocols was also published as an interactive database, which we are updating now with the release of this short blog post. We originally analyzed publicly available protocols that generate credits for the voluntary carbon market. In response to public feedback, we are expanding this database to include three additional protocols that were designed by governments – two protocols from Australia and one from Alberta, Canada – but whose credits can also be used by voluntary actors. This blog post summarizes our findings from reviewing the three additional protocols. We applied the same four metrics applied in our initial analysis: rigor, additionality, durability, and safeguards. We recommend reading this article for more details regarding the four metrics and our methods. .css-a7gsc6{font-size:34px;font-family:relative-medium-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;line-height:1.1;margin-top:32px;margin-bottom:24px;}@media screen and (min-width: 40em){.css-a7gsc6{font-size:34px;margin-top:48px;margin-bottom:32px;}}@media screen and (min-width: 64em){.css-a7gsc6{font-size:34px;margin-top:48px;margin-bottom:32px;}}@media screen and (min-width: 102em){.css-a7gsc6{font-size:48px;}}.css-1ebnuvp{font-size:34px;font-family:relative-medium-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;line-height:1.1;margin-top:32px;margin-bottom:24px;font-size:34px;font-family:relative-medium-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;line-height:1.1;margin-top:32px;margin-bottom:24px;}@media screen and (min-width: 40em){.css-1ebnuvp{font-size:34px;margin-top:48px;margin-bottom:32px;}}@media screen and (min-width: 64em){.css-1ebnuvp{font-size:34px;margin-top:48px;margin-bottom:32px;}}@media screen and (min-width: 102em){.css-1ebnuvp{font-size:48px;}}@media screen and (min-width: 40em){.css-1ebnuvp{font-size:34px;margin-top:48px;margin-bottom:32px;}}@media screen and (min-width: 64em){.css-1ebnuvp{font-size:34px;margin-top:48px;margin-bottom:32px;}}@media screen and (min-width: 102em){.css-1ebnuvp{font-size:48px;}}Australia measurement protocol The most recent Australia measurement protocol was published in 2018, and has been used by over 100 projects to date. It is is currently under review and revisions to the protocol are possible by the end of 2021. We analyzed this protocol as published, without taking into account possible changes as a result of the public review process. .css-1lil6wb{font-size:24px;font-family:relative-medium-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;line-height:1.2;margin-top:24px;margin-bottom:16px;}@media screen and (min-width: 40em){.css-1lil6wb{font-size:24px;margin-top:32px;margin-bottom:24px;}}@media screen and (min-width: 64em){.css-1lil6wb{font-size:24px;margin-top:32px;margin-bottom:24px;}}@media screen and (min-width: 102em){.css-1lil6wb{font-size:34px;}}.css-2rwp0w{font-size:24px;font-family:relative-medium-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;line-height:1.2;margin-top:24px;margin-bottom:16px;font-size:24px;font-family:relative-medium-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;line-height:1.2;margin-top:24px;margin-bottom:16px;}@media screen and (min-width: 40em){.css-2rwp0w{font-size:24px;margin-top:32px;margin-bottom:24px;}}@media screen and (min-width: 64em){.css-2rwp0w{font-size:24px;margin-top:32px;margin-bottom:24px;}}@media screen and (min-width: 102em){.css-2rwp0w{font-size:34px;}}@media screen and (min-width: 40em){.css-2rwp0w{font-size:24px;margin-top:32px;margin-bottom:24px;}}@media screen and (min-width: 64em){.css-2rwp0w{font-size:24px;margin-top:32px;margin-bottom:24px;}}@media screen and (min-width: 102em){.css-2rwp0w{font-size:34px;}}Rigor This protocol features empirical crediting based on robust soil sampling requirements and receives our highest possible rigor score. Only 3 of 14 protocols in our initial analysis (BCarbon, FAO and Verra Soil) featured similarly rigorous sampling and quantification methodologies. Additionality This protocol received a middle ground score for additionality. The singular additionality screen implemented in this protocol is a “newness” requirement that aims to ensure a new management activity is adopted after a project is declared eligible to generate credits. If a buyer wants confidence that their purchase creates climate benefits that would not have happened otherwise, the newness requirement is one piece of the puzzle — it requires a new action to be taken and sidesteps the challenges associated with activity backdating. However, a newness requirement does not screen out practices that are widely adopted or would have been implemented without additional support. (Although an exclusive focus on newness can’t reliably ensure additionality, many of the protocols we reviewed have even weaker standards — and several have none at all.) Durability This protocol also received a middle ground score for durability. Projects credited under this protocol may choose either a 25- or 100-year permanence obligation. In either case, a flat 5% discount is applied to account for a generic risk of reversal. If a project chooses a 25-year permanence obligation, an additional 20% discount is applied. While this discount gestures toward the distinct challenges of temporary carbon removal, it does not specifically address permanence risks, including the possibility that temporarily stored carbon could be reversed entirely after the project crediting period ends. Safeguards This protocol received a high score for safeguards. Applicable Australian laws provide for landowner protections and data privacy. Australia estimation protocol The Australia estimation protocol was published in 2015, but has not been used since. We included it here because it serves as an important contrast with the Australia protocol that is in wide use and which earned a significantly higher score in our review. This protocol shares durability and safeguard characteristics with the Australia measurement protocol reviewed above, but differs significantly in its quantification rigor and additionality metrics. Rigor Under this protocol, projects estimate changes to soil carbon using regional default values which are associated with each eligible project activity. Crediting is based on multiplying default values by the duration of the project. Projects are not required to perform soil sampling at any point. Accordingly, this protocol received the lowest possible score for rigor. Additionality This protocol uses the same “newness” requirement to establish additionality as the Australia measurement protocol described above. Although we gave the measurement protocol a score of 2/3, we assigned a score of 1/3 here because no site-specific modeling or analysis is required. Instead, this protocol uses default parameters to calculate carbon savings, which provides a strong incentive to developers to preferentially select profitable locations for development — potentially resulting in the exact same kind of adverse selection outcomes we documented in California’s forest offsets program. As a result, the potential benefits of a “newness” screen are outweighed by its shortcomings in the context of a protocol without rigorous, project-specific analysis. Alberta protocol The Alberta Quantification Protocol for Conservation Cropping was published in 2012, replacing a predecessor that operated from 2002-2012. It has been used by 47 projects, but was withdrawn in 2020. Existing projects may be credited through the end of 2021, but no new projects may be developed under it. Rigor This protocol received a low score for rigor. Projects estimate changes to soil carbon using regional default factors, and are not required to perform soil sampling at any point. Additionality This protocol also received a low score for additionality. No additionality screens are applied at the project level. Instead, the protocol’s eligible activity — in this case, no-till agriculture — is deemed additional on the basis of having less than a 40% adoption rate. Furthermore, if the protocol’s activity does not satisfy this generous performance test, the protocol may also justify its activity’s additionality via a barriers analysis. In our view, the high adoption threshold and loosely-defined barriers analysis applied at the protocol-level do not provide meaningful additionality protections. The Government of Alberta recently determined that this protocol no longer met additionality standards and withdrew it from operation in 2020. Durability This protocol also received a low score for durability. The protocol applies a crediting discount based on observed, regional rates of reversal. The credits issued are claimed to represent permanent climate benefits. If a project experiences a reversal, the insurance mechanism is to exclude the affected fields from crediting for the affected year(s). Beyond the crediting period, there is no insurance mechanism to back up the claim that all issued credits are permanent. Safeguards This protocol received a high score for safeguards. The Government of Alberta is subject to various general privacy protections that also apply in this context. Conclusions Combining the new analysis with our results from before, we can look at all the protocols we have analyzed together. .css-1rkzpad{box-sizing:border-box;margin:0;min-width:0;margin-top:48px;margin-bottom:48px;}@media screen and (min-width: 40em){.css-1rkzpad{margin-top:48px;margin-bottom:48px;}}@media screen and (min-width: 64em){.css-1rkzpad{margin-top:48px;margin-bottom:48px;}}@media screen and (min-width: 102em){.css-1rkzpad{margin-top:64px;margin-bottom:64px;}}@media print{.css-1rkzpad{break-inside:avoid;}}.css-11cfehs{box-sizing:border-box;mar