rity Council for the Voluntary Carbon Market (ICVCM) has promised a way forward out of that crisis. The ICVCM represents a major effort to create a labeling system that identifies high-quality carbon credits so that buyers can participate in the market with renewed confidence. Unfortunately, the first credit quality labels released by the ICVCM raise concerns about whether this effort can provide the quality assurance the market desperately wants and needs. We analyzed fourteen carbon offset projects credited under the Climate Action Reserve’s US Landfill Protocol Version 6.0, which the ICVCM has now approved for its quality label. By comparing crediting data from the Climate Action Reserve with landfill gas collection data from the US Environmental Protection Agency, we found that nearly 50 percent of the credits issued under this protocol are likely non-additional. These credits do not represent high-quality outcomes for the climate. While our analysis explores a small subset of landfill projects, the focus of this commentary is on the ICVCM’s assessment process, itself. So much effort has gone into establishing the ICVCM as a point of oversight for the offsets industry as a whole. It is important to know how well that oversight is playing out. Landfills provide a window for studying these broader, market-wide dynamics. We conclude that those planning to rely on the ICVCM quality label should proceed cautiously; the ICVCM process may not be set up to reliably separate the wheat from the chaff. .css-a7gsc6{font-size:34px;font-family:relative-medium-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;line-height:1.1;margin-top:32px;margin-bottom:24px;}@media screen and (min-width: 40em){.css-a7gsc6{font-size:34px;margin-top:48px;margin-bottom:32px;}}@media screen and (min-width: 64em){.css-a7gsc6{font-size:34px;margin-top:48px;margin-bottom:32px;}}@media screen and (min-width: 102em){.css-a7gsc6{font-size:48px;}}.css-1ebnuvp{font-size:34px;font-fam