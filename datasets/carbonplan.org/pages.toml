determine which offsets back up corporate climate claims. More transparency is finally coming for a subset of the market. In 2023, California adopted AB1305, a first-of-its-kind bill that requires companies operating in the state to disclose their voluntary use of carbon offsets, and the role those offsets play in supporting public climate claims..css-1e1rxlp{box-sizing:border-box;margin:0;min-width:0;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;}.css-w083ou{box-sizing:border-box;margin:0;min-width:0;font-size:16px;cursor:pointer;color:var(--theme-ui-colors-purple);-webkit-transition:color 0.2s ease-in-out;transition:color 0.2s ease-in-out;}@media screen and (min-width: 40em){.css-w083ou{font-size:16px;}}@media screen and (min-width: 64em){.css-w083ou{font-size:16px;}}@media screen and (min-width: 102em){.css-w083ou{font-size:20px;}}1.css-152u3o5{box-sizing:border-box;margin:0;min-width:0;float:none;clear:none;margin-right:0;margin-left:0;width:calc(4 * 100vw / 6 - 30px);margin-top:16px;margin-bottom:16px;vertical-align:baseline;position:relative;display:none;}@media screen and (min-width: 40em){.css-152u3o5{float:none;clear:none;margin-right:calc(1 * 100vw / 8);margin-left:calc(1 * 100vw / 8);width:calc(4 * 100vw / 8 - 42px);margin-top:16px;margin-bottom:16px;display:none;}}@media screen and (min-width: 64em){.css-152u3o5{float:right;clear:right;margin-right:calc(-1 * (3 * (100vw - 32px * 13) / 12 + 32px * 3));margin-left:0;width:calc(2 * (100vw - 32px * 13) / 12 + 32px);margin-top:0;margin-bottom:16px;display:initial;}}@media screen and (min-width: 102em){.css-152u3o5{float:right;clear:right;margin-right:calc(-1 * (3 * (100vw - 48px * 13) / 12 + 48px * 3));margin-left:0;width:calc(2 * (100vw - 48px * 13) / 12 + 48px);margin-top:0;margin-bottom:24px;display:initial;}}.css-152u3o5 a{color:inherit;}.css-152u3o5 a:hover{color:inherit;}.css-olltdc{box-sizing:border-box;margin:0;min-width:0;width:100%;}.css-fdbs1p{box-sizing:border-box;margin:0;min-width:0;font-family:relative-book-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;width:100%;font-size:14px;line-height:1.25;letter-spacing:0.0125em;color:var(--theme-ui-colors-purple);opacity:1;display:inline-block;-webkit-transition:opacity 0.2s ease-in-out;transition:opacity 0.2s ease-in-out;text-align:left;}@media screen and (min-width: 40em){.css-fdbs1p{font-size:14px;opacity:1;text-align:left;}}@media screen and (min-width: 64em){.css-fdbs1p{font-size:13px;opacity:0.5;text-align:right;}}@media screen and (min-width: 102em){.css-fdbs1p{font-size:15px;text-align:right;}}.css-9d3yd0{box-sizing:border-box;margin:0;min-width:0;position:relative;right:100%;margin-right:10px;margin-top:-50px;text-align:right;line-height:1.25;letter-spacing:0.0125em;display:none;}@media screen and (min-width: 40em){.css-9d3yd0{display:none;}}@media screen and (min-width: 64em){.css-9d3yd0{display:initial;}}1.css-17i6oxh{box-sizing:border-box;margin:0;min-width:0;margin-top:0;text-align:left;display:initial;line-height:1.25;letter-spacing:0.0125em;}@media screen and (min-width: 40em){.css-17i6oxh{margin-top:0;display:initial;}}@media screen and (min-width: 64em){.css-17i6oxh{margin-top:-16px;display:block;}}@media screen and (min-width: 102em){.css-17i6oxh{margin-top:-18px;}}AB1305 also establishes disclosure requirements for entities that market or sell voluntary carbon offsets. AB1305 will go into full effect in January 2025, but a handful of companies have already posted AB1305-compliant disclosures online. We tracked down 25 of these early disclosures and transcribed their data. We were left with two primary takeaways. First, while AB1305 disclosures are a clear improvement over the status quo, they are not easy to find or use. Most of the early AB1305 disclosure documents were difficult to locate online, many were incomplete or contained errors, and almost all were in a PDF format that required tedious data entry before analysis was possible. While the content of disclosures often dominates policy discussions, it is just as important to specify process requirements, such as data formats, to ensure that disclosures are accessible and actionable. Second, despite these challenges, these disclosures contained useful evidence of companies using low-quality, discredited offsets to make public carbon neutrality claims. AB1305 makes the links between companies and the offset credits they use unambiguous and transparent, a combination that we hope will promote accountability across the carbon market. .css-1lil6wb{font-size:24px;font-family:relative-medium-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;line-height:1.2;margin-top:24px;margin-bottom:16px;}@media screen and (min-width: 40em){.css-1lil6wb{font-size:24px;margin-top:32px;margin-bottom:24px;}}@media screen and (min-width: 64em){.css-1lil6wb{font-size:24px;margin-top:32px;margin-bottom:24px;}}@media screen and (min-width: 102em){.css-1lil6wb{font-size:34px;}}.css-2rwp0w{font-size:24px;font-family:relative-medium-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;line-height:1.2;margin-top:24px;margin-bottom:16px;font-size:24px;font-family:relative-medium-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;line-height:1.2;margin-top:24px;margin-bottom:16px;}@media screen and (min-width: 40em){.css-2rwp0w{font-size:24px;margin-top:32px;margin-bottom:24px;}}@media screen and (min-width: 64em){.css-2rwp0w{font-size:24px;margin-top:32px;margin-bottom:24px;}}@media screen and (min-width: 102em){.css-2rwp0w{font-size:34px;}}@media screen and (min-width: 40em){.css-2rwp0w{font-size:24px;margin-top:32px;margin-bottom:24px;}}@media screen and (min-width: 64em){.css-2rwp0w{font-size:24px;margin-top:32px;margin-bottom:24px;}}@media screen and (min-width: 102em){.css-2rwp0w{font-size:34px;}}01 – Discoverability and data format AB1305 provides few requirements about how disclosures must be made, stipulating only that the required information be “disclose[d] on the entity’s internet website.” This means a company can choose where and how to post their disclosures. Disclosure documents aren’t submitted to a central authority and there are no schema or formatting requirements. Both of these decisions put the onus on researchers, regulators, and other interested parties to track down and process disclosures made under AB1305. We stumbled across our first AB1305 disclosure while researching an offset project for an unrelated analysis. After entering the project’s ID number into Google, one of the search results linked to an AB1305 disclosure form. Curious, we started looking for other disclosures by searching for variants of the exact phrase “AB1305” and various keywords like “Verra” and “Gold Standard.” We found 25 disclosure documents with information on offsets. You can take a look at the data using this online viewer or download the data if you want to dive deeper. .css-1rkzpad{box-sizing:border-box;margin:0;min-width:0;margin-top:48px;margin-bottom:48px;}@media screen and (min-width: 40em){.css-1rkzpad{margin-top:48px;margin-bottom:48px;}}@media screen and (min-width: 64em){.css-1rkzpad{margin-top:48px;margin-bottom:48px;}}@media screen and (min-width: 102em){.css-1rkzpad{margin-top:64px;margin-bottom:64px;}}@media print{.css-1rkzpad{break-inside:avoid;}}.css-1f1ra8m{box-sizing:border-box;margin:0;min-width:0;margin-bottom:0;}.css-1nsuwaj{box-sizing:border-box;margin:0;min-width:0;display:grid;grid-gap:16px;grid-template-columns:repeat(6, 1fr);-webkit-column-gap:24px;column-gap:24px;row-gap:0;}@media screen and (min-width: 40em){.css-1nsuwaj{grid-template-columns:repeat(6, 1fr);}}@media screen and (min-width: 64em){.css-1nsuwaj{grid-template-columns:repeat(6, 1fr);}}@media screen and (min-width: 102em){.css-1nsuwaj{grid-template-columns:repeat(6, 1fr);}}@media screen and (min-width: 40em){.css-1nsuwaj{-webkit-column-gap:32px;column-gap:32px;row-gap:0;}}@media screen and (min-width: 6