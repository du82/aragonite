dding-right:4px;}/The number of carbon offset credits exposed to “above normal” fire risk over the summer months. Each credit represents 1 tCO₂. Fire risk values come for the National Interagency Fire Center predictive services’ fire potential outlooks. Between now and September, there will be at least 20 million offset credits classified at “above normal” risk each month. The month of June (before the arrival of summer monsoon rains) is an especially risky time for the three large projects in Arizona and New Mexico, which have collectively received nearly 16 million credits. Earlier this month, the Cienegita fire ignited on the edge of CAR1183, but was rapidly contained. As the fire season progresses, projects scattered throughout northern California, southern Oregon, and eastern Washington become the primary concern. We’ll post any relevant updates on Twitter and this blog. In the meantime, you’re welcome to read more about our data sources or look at the code underlying the analysis and the web map."
