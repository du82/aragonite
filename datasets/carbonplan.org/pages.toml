title = "New data added to the Compliance Users tool – CarbonPlan"
description = "We updated the Compliance Users tool to include the latest available cap-and-trade program data about who used which offsets during the program’s fourth compliance period."
full_description = ".css-b6pqm4{font-size:18px;line-height:1.35;font-family:relative-book-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;letter-spacing:0.01em;margin-top:1em;margin-bottom:1em;}@media screen and (min-width: 40em){.css-b6pqm4{font-size:18px;}}@media screen and (min-width: 64em){.css-b6pqm4{font-size:18px;}}@media screen and (min-width: 102em){.css-b6pqm4{font-size:24px;}}.css-11llkvq{font-size:18px;line-height:1.35;font-family:relative-book-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;letter-spacing:0.01em;margin-top:1em;margin-bottom:1em;font-size:18px;line-height:1.35;font-family:relative-book-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;letter-spacing:0.01em;margin-top:1em;margin-bottom:1em;}@media screen and (min-width: 40em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 64em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 102em){.css-11llkvq{font-size:24px;}}@media screen and (min-width: 40em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 64em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 102em){.css-11llkvq{font-size:24px;}}In 2022, we built a .css-fnw7dn{color:var(--theme-ui-colors-text);-webkit-text-decoration:underline;text-decoration:underline;cursor:pointer;}@media (hover: hover) and (pointer: fine){.css-fnw7dn:active{color:var(--theme-ui-colors-text);}.css-fnw7dn:hover{color:var(--theme-ui-colors-secondary);}}.css-1kesrdv{color:var(--theme-ui-colors-text);-webkit-text-decoration:underline;text-decoration:underline;cursor:pointer;color:var(--theme-ui-colors-text);-webkit-text-decoration:underline;text-decoration:underline;cursor:pointer;}@media (hover: hover) and (pointer: fine){.css-1kesrdv:active{color:var(--theme-ui-colors-text);}.css-1kesrdv:hover{color:var(--theme-ui-colors-secondary);}}@media (hover: hover) and (pointer: fine){.css-1kesrdv:active{color:var(--theme-ui-colors-text);}.css-1kesrdv:hover{color:var(--theme-ui-colors-secondary);}}tool that makes data about offset use within the California cap-and-trade program more accessible. Earlier this month, the California Air Resources Board (CARB) released its annual data update, which we have now added to the tool. California’s cap-and-trade program requires regulated companies to periodically surrender compliance instruments — state-issued allowances or carbon offsets — equal to their emissions during a given compliance period. Using the tool, you can search for an offset project, a company, or an emitting facility and see who has used which offsets to satisfy their compliance obligations. With this update, the tool now offers data on compliance offset use over the past decade, from 2013 through 2023. Regulated entities in California have used more than 165 million offset credits for compliance purposes during this period. This latest batch of data sums up the program’s fourth compliance period (2021-2023). In the previous two years, CARB’s data provided only a partial view into the extent of program-wide offset usage. This was because regulated companies are only required to meet 30% of their compliance obligation during the first two years of each compliance period. The remainder of their obligation for those years came due at the end of the full compliance period in 2023, and is reflected in the data released this year. Notably, during the fourth compliance period, regulated entities could fulfill up to 4 percent of their total compliance obligation using offsets. Of 294 regulated entities, 110 hit this threshold. Overall, 3.1 percent of all compliance instruments surrendered during this compliance period were offsets. Although that number may sound small, it’s a large portion of the total emission reductions expected to be delivered by the cap-and-trade program, meaning the quality of credits is central to the efficacy of the program as a whole. For more context on this tool and the data it surfaces, see our original blog post or check out our GitHub repository."
