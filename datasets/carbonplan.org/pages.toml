["https://carbonplan.org/blog/buffer-update-two"]
title = "Another buffer pool update – CarbonPlan"
description = "New reporting indicates that the wildfire component of California's buffer pool is almost surely depleted."
full_description = ".css-b6pqm4{font-size:18px;line-height:1.35;font-family:relative-book-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;letter-spacing:0.01em;margin-top:1em;margin-bottom:1em;}@media screen and (min-width: 40em){.css-b6pqm4{font-size:18px;}}@media screen and (min-width: 64em){.css-b6pqm4{font-size:18px;}}@media screen and (min-width: 102em){.css-b6pqm4{font-size:24px;}}.css-11llkvq{font-size:18px;line-height:1.35;font-family:relative-book-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;letter-spacing:0.01em;margin-top:1em;margin-bottom:1em;font-size:18px;line-height:1.35;font-family:relative-book-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;letter-spacing:0.01em;margin-top:1em;margin-bottom:1em;}@media screen and (min-width: 40em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 64em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 102em){.css-11llkvq{font-size:24px;}}@media screen and (min-width: 40em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 64em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 102em){.css-11llkvq{font-size:24px;}}New reporting from .css-fnw7dn{color:var(--theme-ui-colors-text);-webkit-text-decoration:underline;text-decoration:underline;cursor:pointer;}@media (hover: hover) and (pointer: fine){.css-fnw7dn:active{color:var(--theme-ui-colors-text);}.css-fnw7dn:hover{color:var(--theme-ui-colors-secondary);}}.css-1kesrdv{color:var(--theme-ui-colors-text);-webkit-text-decoration:underline;text-decoration:underline;cursor:pointer;color:var(--theme-ui-colors-text);-webkit-text-decoration:underline;text-decoration:underline;cursor:pointer;}@media (hover: hover) and (pointer: fine){.css-1kesrdv:active{color:var(--theme-ui-colors-text);}.css-1kesrdv:hover{color:var(--theme-ui-colors-secondary);}}@media (hover: hover) and (pointer: fine){.css-1kesrdv:active{color:var(--theme-ui-colors-text);}.css-1kesrdv:hover{color:var(--theme-ui-colors-secondary);}}Oregon Public Broadcasting provides strong evidence that the wildfire component of California's forest carbon buffer pool has almost surely been depleted. The reporting confirms that Klamath East (ACR273), which burned in the 2021 Bootleg Fire, will be terminated. Somewhat unexpectedly, they report that the Warm Springs project (ACR260), which burned in the 2020 Lionshead Fire, might also be headed for termination. To our knowledge, this is the first public disclosure by the project owner about the potential magnitude of the project's pending reversal. We've estimated the potential magnitude of the Lionshead reversal on two previous occasions. First, as part of tracking the Lionshead Fire in 2020, we made a back-of-the-envelope estimate that the fire might reverse 0.96 million credits. Later, as part of a more detailed review of the effects of wildfire on offset projects, we estimated the minimum size of the reversal at 1.38 million credits. This new reporting on the possible termination of ACR260, which would trigger the retirement of at least 2.67 million credits, strongly suggests our previous estimates were conservative. These new details about ACR260 allow us to provide a comprehensive update on the potential magnitude of the wildfire reversals we've previously analyzed (Table 1). .css-1rkzpad{box-sizing:border-box;margin:0;min-width:0;margin-top:48px;margin-bottom:48px;}@media screen and (min-width: 40em){.css-1rkzpad{margin-top:48px;margin-bottom:48px;}}@media screen and (min-width: 64em){.css-1rkzpad{margin-top:48px;margin-bottom:48px;}}@media screen and (min-width: 102em){.css-1rkzpad{margin-top:64px;margin-bottom:64px;}}@media print{.css-1rkzpad{break-inside:avoid;}}.css-11cfehs{box-sizing:border-box;margin:0;min-width:0;margin-bottom:24px;}@media screen and (min-width: 40em){.css-11cfehs{margin-bottom:24px;}}@media screen and (min-width: 64em){.css-11cfehs{margin-bottom:24px;}}@media screen and (min-width: 102em){.css-11cfe