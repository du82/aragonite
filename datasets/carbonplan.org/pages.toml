rimary);}.css-14449re>p{display:inline;font-size:16px;}@media screen and (min-width: 40em){.css-14449re>p{font-size:16px;}}@media screen and (min-width: 64em){.css-14449re>p{font-size:16px;}}@media screen and (min-width: 102em){.css-14449re>p{font-size:18px;}}.css-1sk0a8c{box-sizing:border-box;margin:0;min-width:0;text-transform:uppercase;letter-spacing:0.07em;display:inline-block;}table 1 .css-3dr1uz{box-sizing:border-box;margin:0;min-width:0;display:inline-block;margin-left:4px;margin-right:4px;padding-right:4px;}/Magnitude of reported reversals, from preliminary project paperwork. ACR255 reported two separate reversal events and therefore appears twice in the table. Our analysis only examined the project’s sixth reporting period. Reversal estimates denominated in million tCO₂. The new data report a total reversal of 3.95 million tCO₂, including losses from a handful of smaller fires that weren’t part of our study (like the Williams Flat fire that burned ACR255 in 2019). For comparison, our estimated carbon losses for CAR1102 were about 7% to 28% higher than reported outcomes, with an absolute error of about 14,000 to 59,000 tCO₂. In contrast, our projections for ACR255 were about 25% to 43% lower than what the project reported, with an absolute error of about 791,000 to almost 1.4 million tCO₂. One reason that may explain why ACR255’s reported losses are substantially higher than our estimates is that we only projected wildfire carbon losses, whereas projects report losses inclusive of harvest and other causes of tree mortality. In this case, we understand that ACR255 experienced exceptionally strong winds in 2021 that not only fueled the growth of wildfires, but also blew down trees across the project area — leading to higher overall carbon losses. Together, these new data show that our analysis is substantially more conservative than reported losses. Our earlier calculations intentionally erred on the side of underestimating carbon losses, yet still found that the program’s buffer pool is severely undercapitalized. That two projects have now reported substantially higher numbers only reinforces the concerns we raised about the buffer pool’s design and ongoing solvency. For additional context, the California Air Resources Board previously retired 1.12 million tCO₂ from the buffer pool to account for two previously verified wildfire reversals. Although the newer reversals from ACR255 and CAR1102 are still under final review, they should bring verified wildfire losses to over 5 million tCO₂. As we showed in our previous analysis, the buffer pool has around 6 million tCO₂ explicitly set aside to handle fire losses for the next 100 years, meaning that reported losses from ACR255 and CAR1102 will deplete over 80 percent of the fire component of the buffer pool. Program-wide wildfire losses will inevitably grow when official data become available for the Lionshead and Bootleg fires, which burned a pair of projects in Oregon (ACR260 Warm Springs and ACR273 Klamath East). We estimated those losses to be a minimum of 1.38 and 1.15 million tCO₂, respectively, which would bring total wildfire reversals to about 7.60 million tCO₂ — more than fully depleting the number of buffer pool credits set aside to manage wildfire risks over the next 100 years. One important caveat is in order. By design all buffer pool credits are cross-fungible, meaning that credits contributed for any one risk factor can be used to cover losses due to another risk factor. As a result, our core finding that actual wildfire losses have depleted the contributions set aside for wildfire protections doesn’t mean that the buffer pool is about to collapse. Instead, it indicates that California policymakers fundamentally underestimated the risk of wildfire such that the program is unprepared for a warmer, drier future. Although the disconnect between projected and actual wildfire risks is striking enough on its own, the magnitude of carbon losses experienced by ACR255 raises additional concerns that could threaten nearly half of the buffer pool. Under California’s rules, forest offset projects are automatically terminated when their carbon stocks fall below baseline levels. Termination, in turn, requires the buffer pool to retire as many credits as the project has earned in total. ACR255 is a very large project that is surprisingly close to termination. Recent wildfires caused standing live above ground carbon stocks to fall from about 82.69 to 73.24 tCO₂ per acre. The project’s minimum baseline level is 62.84 tCO₂ per acre. Thus, if ACR255 were to experience future carbon losses of a similar magnitude to those reported in the latest batch of project documents, it will be automatically terminated. Termination of ACR255 would require the California Air Resources Board to retire buffer pool credits equal to the total number of credits issued to the project — about 15.2 million tCO₂ to date, or about half of the current buffer pool. Taken together, these new data add to "
