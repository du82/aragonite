["https://carbonplan.org/blog/cloud-downscaling-pipelines"]
title = "Building open source downscaling pipelines for the cloud – CarbonPlan"
description = "We describe our experiences building cloud-based data analysis pipelines for climate model downscaling, including specific challenges we faced and lessons we learned."
full_description = '''.css-b6pqm4{font-size:18px;line-height:1.35;font-family:relative-book-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;letter-spacing:0.01em;margin-top:1em;margin-bottom:1em;}@media screen and (min-width: 40em){.css-b6pqm4{font-size:18px;}}@media screen and (min-width: 64em){.css-b6pqm4{font-size:18px;}}@media screen and (min-width: 102em){.css-b6pqm4{font-size:24px;}}.css-11llkvq{font-size:18px;line-height:1.35;font-family:relative-book-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;letter-spacing:0.01em;margin-top:1em;margin-bottom:1em;font-size:18px;line-height:1.35;font-family:relative-book-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;letter-spacing:0.01em;margin-top:1em;margin-bottom:1em;}@media screen and (min-width: 40em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 64em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 102em){.css-11llkvq{font-size:24px;}}@media screen and (min-width: 40em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 64em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 102em){.css-11llkvq{font-size:24px;}}We recently completed a .css-fnw7dn{color:var(--theme-ui-colors-text);-webkit-text-decoration:underline;text-decoration:underline;cursor:pointer;}@media (hover: hover) and (pointer: fine){.css-fnw7dn:active{color:var(--theme-ui-colors-text);}.css-fnw7dn:hover{color:var(--theme-ui-colors-secondary);}}.css-1kesrdv{color:var(--theme-ui-colors-text);-webkit-text-decoration:underline;text-decoration:underline;cursor:pointer;color:var(--theme-ui-colors-text);-webkit-text-decoration:underline;text-decoration:underline;cursor:pointer;}@media (hover: hover) and (pointer: fine){.css-1kesrdv:active{color:var(--theme-ui-colors-text);}.css-1kesrdv:hover{color:var(--theme-ui-colors-secondary);}}@media (hover: hover) and (pointer: fine){.css-1kesrdv:active{color:var(--theme-ui-colors-text);}.css-1kesrdv:hover{color:var(--theme-ui-colors-secondary);}}global climate model downscaling project, for which we processed hundreds of terabytes of climate data entirely using cloud infrastructure. We chose to use the cloud for several reasons: scalability, reproducibility, and the ability to access large volumes of data in cloud storage directly, rather than downloading to local machines. Working in the cloud on a project at this scale also posed several challenges. In this post, we explain how we approached the problem, and then highlight what worked well and where we struggled. We hope the lessons learned might be useful to others working on related efforts. .css-a7gsc6{font-size:34px;font-family:relative-medium-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;line-height:1.1;margin-top:32px;margin-bottom:24px;}@media screen and (min-width: 40em){.css-a7gsc6{font-size:34px;margin-top:48px;margin-bottom:32px;}}@media screen and (min-width: 64em){.css-a7gsc6{font-size:34px;margin-top:48px;margin-bottom:32px;}}@media screen and (min-width: 102em){.css-a7gsc6{font-size:48px;}}.css-1ebnuvp{font-size:34px;font-family:relative-medium-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;line-height:1.1;margin-top:32px;margin-bottom:24px;font-size:34px;font-family:relative-medium-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;line-height:1.1;margin-top:32px;margin-bottom:24px;}@media screen and (min-width: 40em){.css-1ebnuvp{font-size:34px;margin-top:48px;margin-bottom:32px;}}@media screen and (min-width: 64em){.css-1ebnuvp{font-size:34px;margin-top:48px;margin-bottom:32px;}}@media screen and (min-width: 102em){.css-1ebnuvp{font-size:48px;}}@media screen and (min-width: 40em){.css-1ebnuvp{font-size:34px;margin-top:48px;margin-bottom:32px;}}@media screen and (min-width: 64em){.css-1ebnuvp{font-size:34px;margin-top:48px;margin-bottom:32px;}}@media screen and (min-width: 102em){.css-1ebnuvp{font-size:48px;}}Design and motivation We designed this project around an open-source package that allows users to run multiple downscaling algorithms composed of common utilities using shared infrastructure. We also started by ensuring that the primary datasets — observational training data and the CMIP6 data archive — were available in the Analysis Ready Cloud Optimized (ARCO) Zarr format. This approach has several benefits. First, it saves compute resources by separating the steps of downscaling that are common across multi-GCM ensembles (e.g. creating temporal summaries of a reference dataset) or across multiple downscaling methods (e.g. creating the same regridded intermediate product). Especially combined with caching (see below), this makes it possible for repeated analyses to share intermediate datasets, which saves on computation. Second, by using pipelines that run in cloud infrastructure and access public data, we ensure that our approach will be usable and reproducible by others. In particular, this implementation should serve as a reference to help lower the barrier for a broader community to do this kind of work in the cloud. Third, implementing multiple methods in a common pipeline framework with shared utilities makes it easier to understand how methods differ, in most cases just by directly reading the code. This supports knowledge transfer and future methods development whether by us or by others. High-level architecture The specific analysis pipeline we implemented consisted of a workflow with shared data pre-processing tasks, downscaling algorithm-specific tasks, and optional data post-processing tasks such as creating multi-scale pyramids. .css-1rkzpad{box-sizing:border-box;margin:0;min-width:0;margin-top:48px;margin-bottom:48px;}@media screen and (min-width: 40em){.css-1rkzpad{margin-top:48px;margin-bottom:48px;}}@media screen and (min-width: 64em){.css-1rkzpad{margin-top:48px;margin-bottom:48px;}}@media screen and (min-width: 102em){.css-1rkzpad{margin-top:64px;margin-bottom:64px;}}@me