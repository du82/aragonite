["https://carbonplan.org/blog/buffer-update-three"]
title = "Nearly a third of California’s forest offset buffer pool has gone up in smoke – CarbonPlan"
description = "New paperwork shows that carbon losses insured by California’s forest offset buffer pool are higher than previously estimated."
full_description = ".css-b6pqm4{font-size:18px;line-height:1.35;font-family:relative-book-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;letter-spacing:0.01em;margin-top:1em;margin-bottom:1em;}@media screen and (min-width: 40em){.css-b6pqm4{font-size:18px;}}@media screen and (min-width: 64em){.css-b6pqm4{font-size:18px;}}@media screen and (min-width: 102em){.css-b6pqm4{font-size:24px;}}.css-11llkvq{font-size:18px;line-height:1.35;font-family:relative-book-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;letter-spacing:0.01em;margin-top:1em;margin-bottom:1em;font-size:18px;line-height:1.35;font-family:relative-book-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;letter-spacing:0.01em;margin-top:1em;margin-bottom:1em;}@media screen and (min-width: 40em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 64em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 102em){.css-11llkvq{font-size:24px;}}@media screen and (min-width: 40em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 64em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 102em){.css-11llkvq{font-size:24px;}}For the third time in a row, the “Finite Carbon - Colville IFM project” (ACR255) has filed paperwork indicating that the project has lost more carbon than it gained. That puts the project in reversal and means California’s forest offset buffer pool will need to step in to insure against those losses. California’s forest offsets program requires that roughly 20 percent of generated credits be deposited into a buffer pool, which is a reserve of credits set aside to protect against unforeseen carbon losses due to events like wildfires or disease. The .css-fnw7dn{color:var(--theme-ui-colors-text);-webkit-text-decoration:underline;text-decoration:underline;cursor:pointer;}@media (hover: hover) and (pointer: fine){.css-fnw7dn:active{color:var(--theme-ui-colors-text);}.css-fnw7dn:hover{color:var(--theme-ui-colors-secondary);}}.css-1kesrdv{color:var(--theme-ui-colors-text);-webkit-text-decoration:underline;text-decoration:underline;cursor:pointer;color:var(--theme-ui-colors-text);-webkit-text-decoration:underline;text-decoration:underline;cursor:pointer;}@media (hover: hover) and (pointer: fine){.css-1kesrdv:active{color:var(--theme-ui-colors-text);}.css-1kesrdv:hover{color:var(--theme-ui-colors-secondary);}}@media (hover: hover) and (pointer: fine){.css-1kesrdv:active{color:var(--theme-ui-colors-text);}.css-1kesrdv:hover{color:var(--theme-ui-colors-secondary);}}newest round of paperwork filed by ACR255, which is accompanied by a third-party verification statement, shows that the Colville project lost over 1.79 million tons of CO₂ during its seventh reporting period, which ran from July 2021 to July 2022. The project recorded two previous reversals, which totalled over 3.71 million tons of CO₂. This new reversal, which the project attributes to the 2021 wildfire season, brings the project’s carbon losses from the last three reporting periods to over 5.5 million tons of CO₂. From a program-wide standpoint, ACR255’s newly reported reversal brings total wildfire-related losses to nearly 11 million credits. Records indicate that just over 33.5 million credits have been placed in the buffer pool over the program’s full history. That means nearly a third of the buffer pool has already been consumed by wildfire in just 10 years. The scale of wildfire reversals far exceeds the buffer pool’s design. We estimate that California’s forest offset program has only set aside 6.6 million credits to insure against wildfire for the next 100 years, a number now dwarfed by the scale of reported wildfire reversals. The program’s regulator, the California Air Resources Board, has already announced its intentions to reform the mechanics of the buffer pool. Given the current pace of carbon losses, those reforms cannot come soon enough."
