["https://carbonplan.org/blog/physical-risk-workshop"]
title = "An interdisciplinary workshop on climate risk and financial regulation – CarbonPlan"
description = "We hosted a workshop with the Environmental Defense Fund (EDF) and the Initiative on Climate Risk and Resilience Law (ICRRL) on physical climate risk and financial regulation."
full_description = ".css-b6pqm4{font-size:18px;line-height:1.35;font-family:relative-book-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;letter-spacing:0.01em;margin-top:1em;margin-bottom:1em;}@media screen and (min-width: 40em){.css-b6pqm4{font-size:18px;}}@media screen and (min-width: 64em){.css-b6pqm4{font-size:18px;}}@media screen and (min-width: 102em){.css-b6pqm4{font-size:24px;}}.css-11llkvq{font-size:18px;line-height:1.35;font-family:relative-book-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;letter-spacing:0.01em;margin-top:1em;margin-bottom:1em;font-size:18px;line-height:1.35;font-family:relative-book-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;letter-spacing:0.01em;margin-top:1em;margin-bottom:1em;}@media screen and (min-width: 40em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 64em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 102em){.css-11llkvq{font-size:24px;}}@media screen and (min-width: 40em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 64em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 102em){.css-11llkvq{font-size:24px;}}The human and economic costs of climate change are increasingly visible across the U.S. In turn, regulators tasked with overseeing the economy and financial markets are focusing their attention to risks from climate hazards like floods, wildfires, and heatwaves. In 2021, the Biden Administration issued an .css-fnw7dn{color:var(--theme-ui-colors-text);-webkit-text-decoration:underline;text-decoration:underline;cursor:pointer;}@media (hover: hover) and (pointer: fine){.css-fnw7dn:active{color:var(--theme-ui-colors-text);}.css-fnw7dn:hover{color:var(--theme-ui-colors-secondary);}}.css-1kesrdv{color:var(--theme-ui-colors-text);-webkit-text-decoration:underline;text-decoration:underline;cursor:pointer;color:var(--theme-ui-colors-text);-webkit-text-decoration:underline;text-decoration:underline;cursor:pointer;}@media (hover: hover) and (pointer: fine){.css-1kesrdv:active{color:var(--theme-ui-colors-text);}.css-1kesrdv:hover{color:var(--theme-ui-colors-secondary);}}@media (hover: hover) and (pointer: fine){.css-1kesrdv:active{color:var(--theme-ui-colors-text);}.css-1kesrdv:hover{color:var(--theme-ui-colors-secondary);}}executive order directing key regulatory agencies to review how they can address climate-related financial risk. In the year that followed, several agencies have taken encouraging steps to integrate climate risk into their work. Despite these important developments, much remains to be done to successfully ensure that climate change considerations are integrated into financial regulation — a task that requires collaboration and engagement across different technical domains. In May of 2022, CarbonPlan, the Environmental Defense Fund (EDF), and the Initiative on Climate Risk and Resilience Law (ICRRL) hosted a joint Chatham House Rule workshop on physical climate risk and U.S. financial regulation. Motivated by the need to identify core constraints that arise when linking physical climate data to the financial sector, this workshop brought together former regulators, climate scientists, and experts in finance and economics. Our goal was to better understand what physical climate change information was being used by regulators, and what strategies exist that could improve the use of that information. Coming out of the workshop, it’s clear that there is a need for more collaboration opportunities between financial practitioners and climate scientists. It’s also clear that determining how regulatory agencies can best oversee and support physical climate-risk responses requires ongoing effort from both scientists and regulators. .css-a7gsc6{font-size:34px;font-family:relative-medium-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;line-height:1.1;margin-top:32px;margin-bottom:24px;}@media screen and (min-width: 40em){.css-a7gsc6{font-size:34px;margin-top:48px;margin-bottom:32px;}}@media screen and (min-width: 64em){.css-a7gsc6{font-size:34px;margin-top:48px;margin-bottom:32px;}}@media screen and (min-width: 102em){.css-a7gsc6{font-size:48px;}}.css-1ebnuvp{font-size:34px;font-family:relative-medium-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;line-height:1.1;margin-top:32px;margin-bottom:24px;font-size:34px;font-family:relative-medium-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;line-height:1.1;margin-top:32px;margin-bottom:24px;}@media screen and (min-width: 40em){.css-1ebnuvp{font-size:34px;margin-top:48px;margin-bottom:32px;}}@media screen and (min-width: 64em){.css-1ebnuvp{font-size:34px;margin-top:48px;margin-bottom:32px;}}@media screen and (min-width: 102em){.css-1ebnuvp{font-size:48px;}}@media screen and (min-width: 40em){.css-1ebnuvp{font-size:34px;margin-top:48px;margin-bottom:32px;}}@media screen and (min-width: 64em){.css-1ebnuvp{font-size:34px;margin-top:48px;margin-bottom:32px;}}@media screen and (min-width: 102em){.css-1ebnuvp{font-size:48px;}}Emerging Themes The workshop identified several emerging themes and directions for further research. .css-1kpyvvq{-webkit-padding-start:20px;padding-inline-start:20px;margin-block-start:-8px;font-size:18px;}@media screen and (min-width: 40em){.css-1kpyvvq{-webkit-padding-start:20px;padding-inline-start:20px;margin-block-start:-8px;font-size:18px;}}@media screen and (min-width: 64em){.css-1kpyvvq{-webkit-padding-start:20px;padding-inline-start:20px;margin-block-start:-8px;font-size:18px;}}@media screen and (min-width: 102em){.css-1kpyvvq{-webkit-padding-start:24px;padding-inline-start:24px;margin-block-start:-16px;font-size:24px;}}.css-lmmbg1{-webkit-padding-start:20px;padding-inline-start:20px;margin-block-start:-8px;font-size:18px;-webkit-padding-start:20px;padding-inline-start:20px;margin-block-start:-8px;font-size:18px;}@media screen and (min-width: 40em){.css-lmmbg1{-webkit-padding-start:20px;padding-inline-start:20px;margin-block-start:-8px;font-size:18px;}}@media screen and (min-width: 64em){.css-lmmbg1{-webkit-padding-start:20px;padding-inline-start:20px;margin-block-start:-8px;font-size:18px;}}@media screen and (min-width: 102em){.css-lmmbg1{-webkit-padding-start:24px;padding-inline-start:24px;margin-block-start:-16px;font-size:24px;}}@media screen and (min-width: 40em){.css-lmmbg1{-webkit-padding-start:20px;padding-inline-start:20px;margin-block-start:-8px;font-size:18px;}}@media screen and (min-width: 64em){.css-lmmbg1{-webkit-padding-start:20px;padding-inline-start:20px;margin-block-start:-8px;font-size:18px;}}@media screen and (min-width: 102em){.css-lmmbg1{-webkit-padding-start:24px;padding-inline-start:24px;margin-block-start:-16px;font-size:24px;}} Policymakers and interested stakeholders need to engage directly with each other to determine challenges and identify solutions. Actors in the financial sector could benefit from a climate science ‘translator’ to reduce the risk of the misinterpretation or misapplication of climate data. Robust scientific and practical frameworks are needed to guide the analytical process. Open-source climate models and data are needed to support stress-testing and scenario analyses. You can read a more in-depth summary of the workshop here."
