ystem-ui,-apple-system,BlinkMacSystemFont;font-weight:400;letter-spacing:0.01em;margin-top:1em;margin-bottom:1em;}@media screen and (min-width: 40em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 64em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 102em){.css-11llkvq{font-size:24px;}}@media screen and (min-width: 40em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 64em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 102em){.css-11llkvq{font-size:24px;}}It’s possible — and increasingly popular — to achieve carbon removal (CDR) by tweaking an existing process rather than creating a new one. From modifying the use of alkalinity to treat wastewater, to switching what kinds of rocks farmers use to raise the pH of their soils, these projects are now common enough that we’ve started referring to them as CDR “optimization projects.” Optimization projects are exciting because they could help clean up emissions-intensive systems and remove carbon from the atmosphere without requiring a lot of new physical investments. They’re the definition of low-hanging fruit. But supporting them via carbon removal credits requires dealing with some tricky carbon accounting questions. Optimization projects are meant to remove carbon, but often also end up avoiding emissions associated with the processes they tweak. To issue carbon removal credits, it is therefore necessary to distinguish between the removal and avoided emissions benefits. But there are different ways to separate the benefits, and seemingly small changes to the accounting rules can produce markedly different crediting outcomes. The rules that are used to credit optimization projects today are often too vague to evaluate whether or not the credits conflate carbon removal and avoided emissions. This ambiguity sets a concerning precedent given the expectation that carbon removal and avoided emissions credits are distinct benefits. To build a credible market for carbon removal credits, these protocols will have to change, establishing clear and precise rules to differentiate removals. But these issues also highlight the fact that carbon removal credits might not be the best way to finance all optimization projects. Crediting removals offers little incentive to reduce existing process emissions. Moreover, as we’ll show, taking a careful approach to crediting removals can actually penalize optimization projects in cases where separating out the avoided emissions is hard. Optimization projects can bring some easy climate wins that we shouldn’t ignore. But we also shouldn’t bend the definition of carbon removal to make them work. Instead, we should start thinking about other ways to support these projects that don’t require the line between removals and avoided emissions to be so rigidly defined. .css-a7gsc6{font-size:34px;font-family:relative-medium-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;line-height:1.1;margin-top:32px;margin-bottom:24px;}@media screen and (min-width: 40em){.css-a7gsc6{font-size:34px;margin-top:48px;margin-bottom:32px;}}@media screen and (min-width: 64em){.css-a7gsc6{font-size:34px;margin-top:48px;margin-bottom:32px;}}@media screen and (min-width: 102em){.css-a7gsc6{font-size:48px;}}.css-1ebnuvp{font-size:34px;font-family:relative-medium-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;line-height:1.1;margin-top:32px;margin-bottom:24px;font-size:34px;font-family:relative-medium-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;line-height:1.1;margin-top:32px;margin-bottom:24px;}@media screen and (min-width: 40em){.css-1ebnuvp{font-size:34px;margin-top:48px;margin-bottom:32px;}}@media screen and (min-width: 64em){.css-1ebnuvp{font-size:34px;margin-top:48px;margin-bottom:32px;}}@media screen and (min-width: 102em){.css-1ebnuvp{font-size:48px;}}@media screen and (min-width: 40em){.css-1ebnuvp{font-size:34px;margin-top:48px;margin-bottom:32px;}}@media screen and (min-width: 64em){.css-1ebnuvp{font-size:34px;margin-top:48px;margin-bottom:32px;}}@media screen and (min-width: 102em){.css-1ebnuvp{font-size:48px;}}Avoided emissions can hide in carbon removal credits Emissions reduction represents the bulk of the work needed to slow climate change, but carbon removal will likely be needed to stop climate change or reverse it. Following this logic, the carbon market has coalesced around differentiating credits that represent carbon removal from those representing avoided emissions..css-1e1rxlp{box-sizing:border-box;margin:0;min-width:0;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;}.css-5hbjbr{box-sizing:border-box;margin:0;min-width:0;font-size:16px;cursor:pointer;color:var(--theme-ui-colors-grey);-webkit-transition:color 0.2s ease-in-out;transition:color 0.2s ease-in-out;}@media screen and (min-width: 40em){.css-5hbjbr{font-size:16px;}}@media screen and (min-width: 64em){.css-5hbjbr{font-size:16px;}}@media screen and (min-width: 102em){.css-5hbjbr{font-size:20px;}}1.css-152u3o5{box-sizing:border-box;margin:0;min-width:0;float:none;clear:none;margin-right:0;margin-left:0;width:calc(4 * 100vw / 6 - 30px);margin-top:16px;margin-bottom:16px;vertical-align:baseline;position:relative;display:none;}@media screen and (min-width: 40em){.css-152u3o5{float:none;clear:none;margin-right:calc(1 * 100vw / 8);margin-left:calc(1 * 100vw / 8);width:calc(4 * 100vw / 8 - 42px);margin-top:16px;margin-bottom:16px;display:none;}}@media screen and (min-width: 64em){.css-152u3o5{float:right;clear:right;margin-right:calc(-1 * (3 * (100vw - 32px * 13) / 12 + 32px * 3));margin-left:0;width:calc(2 * (100vw - 32px * 13) / 12 + 32px);margin-top:0;margin-bottom:16px;display:initial;}}@media screen and (min-width: 102em){.css-152u3o5{float:right;clear:right;margin-right:calc(-1 * (3 * (100vw - 48px * 13) / 12 + 48px * 3));margin-left:0;width:calc(2 * (100vw - 48px * 13) / 12 + 48px);margin-top:0;margin-bottom:24px;