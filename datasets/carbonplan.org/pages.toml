title = "Adding nuance on agricultural lime in the CDR Verification Framework – CarbonPlan"
description = "Lime is used to manage soil pH in many agricultural fields and can remove carbon from the atmosphere when it weathers. We are updating our CDR Verification Framework tool to emphasize that changes in lime use and weathering should be accounted for in enhanced weathering and biochar deployments."
full_description = ".css-b6pqm4{font-size:18px;line-height:1.35;font-family:relative-book-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;letter-spacing:0.01em;margin-top:1em;margin-bottom:1em;}@media screen and (min-width: 40em){.css-b6pqm4{font-size:18px;}}@media screen and (min-width: 64em){.css-b6pqm4{font-size:18px;}}@media screen and (min-width: 102em){.css-b6pqm4{font-size:24px;}}.css-11llkvq{font-size:18px;line-height:1.35;font-family:relative-book-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;letter-spacing:0.01em;margin-top:1em;margin-bottom:1em;font-size:18px;line-height:1.35;font-family:relative-book-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;letter-spacing:0.01em;margin-top:1em;margin-bottom:1em;}@media screen and (min-width: 40em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 64em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 102em){.css-11llkvq{font-size:24px;}}@media screen and (min-width: 40em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 64em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 102em){.css-11llkvq{font-size:24px;}}Last year, we released the CDR Verification Framework, a tool that maps out the key uncertainties associated with calculating net carbon removal for different methods, which our framework refers to as “pathways to carbon removal.” The CDR Verification Framework is designed to be updated over time as our understanding of different pathways evolves. We are currently updating the “.css-fnw7dn{color:var(--theme-ui-colors-text);-webkit-text-decoration:underline;text-decoration:underline;cursor:pointer;}@media (hover: hover) and (pointer: fine){.css-fnw7dn:active{color:var(--theme-ui-colors-text);}.css-fnw7dn:hover{color:var(--theme-ui-colors-secondary);}}.css-1kesrdv{color:var(--theme-ui-colors-text);-webkit-text-decoration:underline;text-decoration:underline;cursor:pointer;color:var(--theme-ui-colors-text);-webkit-text-decoration:underline;text-decoration:underline;cursor:pointer;}@media (hover: hover) and (pointer: fine){.css-1kesrdv:active{color:var(--theme-ui-colors-text);}.css-1kesrdv:hover{color:var(--theme-ui-colors-secondary);}}@media (hover: hover) and (pointer: fine){.css-1kesrdv:active{color:var(--theme-ui-colors-text);}.css-1kesrdv:hover{color:var(--theme-ui-colors-secondary);}}Change in agricultural lime use” component in the enhanced weathering and biochar pathways. This component captures the possibility that some CDR deployments could affect a farmer’s application of agricultural lime, a soil amendment that is commonly used to manage soil pH. In the previous version of the framework, we assumed that lime application was consistently a net source of CO₂, and that displacing agricultural lime through a CDR deployment would therefore result in avoided emissions. In reality, lime dissolves (i.e., “weathers”) when it is applied to soil just like other mineral feedstocks, and could result in carbon removal. This update does not change our overall confidence in the ability to accurately quantify the outcomes of either pathway considered, as captured by the Verification Confidence Level (VCL) metric, but does reflect a more nuanced understanding of what can happen when a CDR project changes agricultural lime use. Most agricultural lime applications use carbon-bearing carbonate limestone (CaCO₃, MgCO₃), also called aglime (West & McBride, 2005). One unit of aglime has the potential to weather and produce two units of inorganic carbon. Importantly, only one unit of that inorganic carbon comes from the atmosphere — the other comes from the rock itself. In contrast, when a mineral that doesn’t contain carbon weathers, such as a silicate (e.g., CaSi₂Al₂O₈) or quicklime (CaO), both units of inorganic carbon are atmosphere-derived. Because aglime weathering releases carbon to the system that was previously stored in the rock, it has the potential to become a source of carbon to the atmosphere. How do we know when aglime is a carbon source or sink? It’s easy to find literature that characterizes lime use as a net source (e.g., IPCC, 1997, 2006; Bing et al., 2023; Beerling et al., 2023). But there are also many examples where lime weathering is found to be a carbon sink (e.g., Oh and Raymond, 2006; Hamilton et al., 2007; Zhang et al., 2022). What distinguishes these results is often the characteristics of the study site, or how far the study tracks carbon over space and time. These factors matter because, across space and time, different processes can release inorganic carbon to the atmosphere, affecting the balance of what’s removed versus what’s emitted. For example, carbonate precipitation in soils, rivers, or the ocean can release carbon back into the atmosphere, sometimes long after the weathering occurred. Additionally, if aglime weathers in acidic soils, it can release carbon locally as it dissolves, but could result in net carbon removal downstream when the dissolved minerals leave the acidic soil. Because of all this, pre-existing agricultural lime application serves as a baseline against which the enhanced weathering deployment must be compared. For example, on a field where aglime is already being applied, carbon removal could be achieved by replacing aglime with a silicate or by increasing aglime application to optimize for carbon removal. In either case, the baseline effect of agricultural lime weathering should be considered site-by-site, and accounted for with the same spatial and temporal boundaries as the enhanced weathering deployment. If biochar provides pH benefits when applied to soils, it could reduce the application of agricultural lime as well, and then would require similar accounting. In practice, the “liming potential” of biochar can vary from one feedstock to the other and may not affect farmer behavior. This update to the CDR Verification Framework recognizes that lime weathering can be a carbon source or a carbon sink. If a CDR project changes how farmers apply agricultural lime, those changes must be considered when calculating net carbon removal."
