["https://carbonplan.org/blog/bigcoast-project-boundary"]
title = "To know if an offset project is burning, first you have to find it – CarbonPlan"
description = "Figuring out the location of an offset project shouldn't involve a scavenger hunt."
full_description = ".css-b6pqm4{font-size:18px;line-height:1.35;font-family:relative-book-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;letter-spacing:0.01em;margin-top:1em;margin-bottom:1em;}@media screen and (min-width: 40em){.css-b6pqm4{font-size:18px;}}@media screen and (min-width: 64em){.css-b6pqm4{font-size:18px;}}@media screen and (min-width: 102em){.css-b6pqm4{font-size:24px;}}.css-11llkvq{font-size:18px;line-height:1.35;font-family:relative-book-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;letter-spacing:0.01em;margin-top:1em;margin-bottom:1em;font-size:18px;line-height:1.35;font-family:relative-book-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;letter-spacing:0.01em;margin-top:1em;margin-bottom:1em;}@media screen and (min-width: 40em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 64em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 102em){.css-11llkvq{font-size:24px;}}@media screen and (min-width: 40em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 64em){.css-11llkvq{font-size:18px;}}@media screen and (min-width: 102em){.css-11llkvq{font-size:24px;}}Wildfires across Canada have .css-fnw7dn{color:var(--theme-ui-colors-text);-webkit-text-decoration:underline;text-decoration:underline;cursor:pointer;}@media (hover: hover) and (pointer: fine){.css-fnw7dn:active{color:var(--theme-ui-colors-text);}.css-fnw7dn:hover{color:var(--theme-ui-colors-secondary);}}.css-1kesrdv{color:var(--theme-ui-colors-text);-webkit-text-decoration:underline;text-decoration:underline;cursor:pointer;color:var(--theme-ui-colors-text);-webkit-text-decoration:underline;text-decoration:underline;cursor:pointer;}@media (hover: hover) and (pointer: fine){.css-1kesrdv:active{color:var(--theme-ui-colors-text);}.css-1kesrdv:hover{color:var(--theme-ui-colors-secondary);}}@media (hover: hover) and (pointer: fine){.css-1kesrdv:active{color:var(--theme-ui-colors-text);}.css-1kesrdv:hover{color:var(--theme-ui-colors-secondary);}}burned millions of acres this year. As the fire season started, I sat down to see if any Canadian forest offset projects were burning. Forests release carbon when they burn, which can undo the carbon storage promised by forest carbon offset projects. CarbonPlan has been tracking US-based offset projects threatened or destroyed by wildfires for several years now and I wanted to see if we could do the same for Canadian projects. But it was nearly impossible to figure out if any of Canada's offset projects were on fire. That’s because the rules governing the global carbon market don't always require a project to divulge its exact borders. Often only the province or country is documented. In other words, no one knows the precise locations of all the world’s active offset projects, a startling reality that prevents systematic oversight of the growing voluntary carbon market. One way to find out what’s on fire is to call up offset developers and ask. That’s what reporters from Bloomberg did this spring to confirm that part of BigCoast, a forest offset project in British Columbia, was burning. In an ideal world, you shouldn't need to get someone on the phone to figure this out. And that made me curious – could I replicate what those reporters discovered using only publicly available data? It seemed straightforward at first. BigCoast's project documentation includes a few static, PDF maps of the project area. Unfortunately, those turned out to be such low-resolution that it was all but impossible to compare them to fire data. My next step was to visit the official BigCoast project page at the Verra offset registry, where there's a clearly labeled boundary file named .css-1ct0h9y{padding-left:4px;padding-right:4px;padding-bottom:3px;padding-top:1px;margin-left:1px;margin-right:1px;font-size:14px;font-family:relative-mono-11-pitch-pro,Menlo,monospace;letter-spacing:0.07em;background-color:var(--theme-ui-colors-hinted);color:var(--theme-ui-colors-primary);border-radius:1px;}@media screen and (min-width: 40em){.css-1ct0h9y{font-size:14px;}}@media screen and (min-width: 64em){.css-1ct0h9y{font-size:14px;}}@media screen and (min-width: 102em){.css-1ct0h9y{font-size:18px;}}.css-z48a9j{padding-left:4px;padding-right:4px;padding-bottom:3px;padding-top:1px;margin-left:1px;margin-right:1px;font-size:14px;font-family:relative-mono-11-pitch-pro,Menlo,monospace;letter-spacing:0.07em;background-color:var(--theme-ui-colors-hinted);color:var(--theme-ui-colors-primary);border-radius:1px;padding-left:4px;padding-right:4px;padding-bottom:3px;padding-top:1px;margin-left:1px;margin-right:1px;font-size:14px;font-family:relative-mono-11-pitch-pro,Menlo,monospace;letter-spacing:0.07em;background-color:var(--theme-ui-colors-hinted);color:var(--theme-ui-colors-primary);border-radius:1px;}@media screen and (min-width: 40em){.css-z48a9j{font-size:14px;}}@media screen and (min-width: 64em){.css-z48a9j{font-size:14px;}}@media screen and (min-width: 102em){.css-z48a9j{font-size:18px;}}@media screen and (min-width: 40em){.css-z48a9j{font-size:14px;}}@media screen and (min-width: 64em){.css-z48a9j{font-size:14px;}}@media screen and (min-width: 102em){.css-z48a9j{font-size:18px;}}ProjectArea_BigCoast.kml. But as soon as I loaded the data, it was clear I had a problem. Rather than delineating specific bits of forest protected by the project, the data indicated that BigCoast encompassed an area of over 50 million acres – nearly 20 percent of the total land area of British Columbia. The posted boundary even included large areas of the Pacific Ocean, a place that certainly doesn't have any forest protection going on. After digging deeper on the Internet, I convinced myself that this posted boundary data has nothing to do with the BigCoast project, but is instead the boundary of the British Columbia Coastal Fire Centre, a provincial administrative district used for managing wildfires. .css-1rkzpad{box-sizing:border-box;margin:0;min-width:0;margin-top:48px;margin-bottom:48px;}@media screen and (min-width: 40em){.css-1rkzpad{margin-top:48px;margin-bottom:48px;}}@media screen and (min-width: 64em){.css-1rkzpad{margin-top:48px;margin-bottom:48px;}}@media screen and (min-width: 102em){.css-1rkzpad{margin-top:64px;margin-bottom:64px;}}@media print{.css-1rkzpad{break-inside:avoid;}}.css-11cfehs{box-sizing:border-box;margin:0;min-width:0;margin-bottom:24px;}@media screen and (min-width: 40em){.css-11cfehs{margin-bottom:24px;}}@media screen and (min-width: 64em){.css-11cfehs{margin-bottom:24px;}}@media screen and (min-width: 102em){.css-11cfehs{margin-bottom:32px;}}.css-nupf7v{box-sizing:border-box;margin:0;min-width:0;display:block;width:100%;position:relative;overflow:clip;}.css-1f1ra8m{box-sizing:border-box;margin:0;min-width:0;margin-bottom:0;}.css-14449re{box-sizing:border-box;margin:0;min-width:0;color:var(--theme-ui-colors-secondary);display:block;text-align:left;font-size:16px;}@media screen and (min-width: 40em){.css-14449re{font-size:16px;}}@media screen and (min-width: 64em){.css-14449re{font-size:16px;}}@media screen and (min-width: 102em){.css-14449re{font-size:18px;}}.css-14449re a{color:var(--theme-ui-colors-secondary);}.css-14449re a:hover{color:var(--theme-ui-colors-primary);}.css-14449re>p{display:inline;font-size:16px;}@media screen and (min-width: 40em){.css-14449re>p{font-size:16px;}}@media screen and (min-width: 64em){.css-14449re>p{font-size:16px;}}@media screen and (min-width: 102em){.css-14449re>p{font-size:18px;}}.css-1sk0a8c{box-sizing:border-box;margin:0;min-width:0;text-transform:uppercase;letter-spacing:0.07em;display:inline-block;}figure 1 .css-3dr1uz{box-sizing:border-box;margin:0;min-width:0;display:inline-block;margin-left:4px;margin-right:4px;padding-right:4px;}/The uploaded boundary of the BigCoast offset project, provided by the Verra offset registry. The boundary's overlap with the Pacific ocean suggests the data does not depict the actual areas of forest protected by the project. Back at the drawing board, I next found a document entitled .css-2kca21{box-sizing:border-box;margin:0;min-width:0;word-break:break-all;}VCS_Joint_Prjct_Description_Monitoring_Report_BigCoast.pdf that contained an appendix labeled “Project area polygon location.” I was hoping this appendix would be the jackpot. Instead, it turned out to be one the most baffling pieces of paperwork I've ever seen. Rather than post machine-readable boundary data – an ESRI shapefile, KML, or GeoJSON – the project developer elected to provide more than 70,000 latitude/longitude coordinate pairs in table form, spread across 688 pages of a PDF. I can’t imagine a less user-friendly format. But, somewhat perversely, the sheer absurdity of the whole thing became a challenge – I felt compelled to figure out if I could make something sensible of it. .css-1o0rifk{box-sizing:border-box;margin:0;min-width:0;background-color:var(--theme-ui-colors-muted);padding:16px;margin-left:-16px;margin-right:-16px;}@media screen and (min-width: 40em){.css-1o0rifk{padding:32px;margin-left:-32px;margin-right:-32px;}}@media screen and (min-width: 64em){.css-1o0rifk{padding:32px;margin-left:-32px;margin-right:-32px;}}@media screen and (min-width: 102em){.css-1o0rifk{padding:48px;margin-left:-48px;margin-right:-48px;}}.css-12mrx8n{box-sizing:border-box;margin:0;min-width:0;position:relative;}.css-fdmyc2{box-sizing:border-box;margin:0;min-width:0;width:100%;border-width:3px;border-style:solid;border-color:var(--theme-ui-colors-primary);}.css-7gzruf{box-sizing:border-box;margin:0;min-width:0;position:absolute;top:0;left:0;width:100%;height:100%;cursor:-webkit-zoom-in;cursor:zoom-in;-webkit-transition:0.2s background;transition:0.2s background;}@media (hover: hover) and (pointer: fine){.css-7gzruf:hover{background:rgba(57,58,61,0.2);}.css-7gzruf:hover div{opacity:1;}}.css-1s68i0f{box-sizing:border-box;margin:0;min-width:0;position:absolute;top:50%;left:50%;-webkit-transform:translate(-54%, -50%);-moz-transform:translate(-54%, -50%);-ms-transform:translate(-54%, -50%);transform:translate(-54%, -50%);}.css-odfxe5{box-sizing:border-box;margin:0;min-width:0;opacity:0;-webkit-transition:0.2s opacity;transition:0.2s opacity;-webkit-transform:rotate(135deg);-moz-transform:rotate(135deg);-ms-transform:rotate(135deg);transform:rotate(135deg);}.css-1kcnufj{box-sizing:border-box;margin:0;min-width:0;-webkit-transform:rotate(-135deg);-moz-transform:rotate(-135deg);-ms-transform:rotate(-135deg);transform:rotate(-135deg);margin-right:8px;width:12px;fill:var(--theme-ui-colors-secondary);}.css-uvutt5{box-sizing:border-box;margin:0;min-width:0;-webkit-transform:rotate(45deg);-moz-transform:rotate(45deg);-ms-transform:rotate(45deg);transform:rotate(45deg);width:12px;fill:var(--theme-ui-colors-secondary);}figure 2 /Screenshot of the first page of the “Project area polygon location” appendix. The appendix includes an additional 687 pages with data, which we used to infer the boundary of the BigCoast offset project. Transforming the data into something useful required some experimentation. Coordinates alone aren't sufficient to recreate complex geometries. You also need to know how coordinates relate to each other. Typically, you’d lay out connected points in “rings,” starting with a single point and moving clockwise until you come back to where you started. This strategy allows you to draw even the most complicated shapes. But it gets trickier when the shape you're describing has more than one ring, because you also need to know where one ring ends and the next begins. Needless to say, these sorts of subtle details didn't come across in PDF format. Ultimately, I appealed to brute force. Rather than treating each point as a coordinate, I just drew a 100x100 meter square around each point, an approach known as buffering. From there, you just need to take the intersection of the tens of thousands of squares to create a single geometry. If you squint and tilt your head, our reconstructed boundary looks sort of similar to the various, blurry static maps included in BigCoast's project documents. Our effort is at least more credible than the boundary uploaded to Verra. As further validation, our reconstruction has an area of 106,567 acres, which is remarkably close to 108,780 acres, the project's official acreage as listed in BigCoast's project documentation. And when I overlaid the inferred boundary against British Columbia's wildfire dataset, I calculated that about 276 acres – or 112 hectares – of the project burned in the Cameron Bluffs Fire. That's pretty close to the “[a]bout 100 hectares” of burned forest the owner of the project told Bloomberg about. The time it took me to figure this out: upwards of 5 hours. .css-hkehjx{box-sizing:border-box;margin:0;min-width:0;position:absolute;top:0;left:0;}.css-pejb8m{box-sizing:border-box;margin:0;min-width:0;color:var(--theme-ui-colors-primary);border:none;background-color:transparent;margin:0;padding:0;cursor:pointer;text-transform:uppercase;font-family:relative-book-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;letter-spacing:0.07em;margin-right:16px;font-size:34px;-webkit-transition:color 0.15s;transition:color 0.15s;}@media screen and (min-width: 40em){.css-pejb8m{font-size:34px;}}@media screen and (min-width: 64em){.css-pejb8m{font-size:34px;}}@media screen and (min-width: 102em){.css-pejb8m{font-size:48px;}}@media (hover: hover) and (pointer: fine){.css-pejb8m:hover{color:var(--theme-ui-colors-secondary);}}-.css-zshczd{box-sizing:border-box;margin:0;min-width:0;color:var(--theme-ui-colors-primary);border:none;background-color:transparent;margin:0;padding:0;cursor:pointer;text-transform:uppercase;font-family:relative-book-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;letter-spacing:0.07em;font-size:34px;-webkit-transition:color 0.15s;transition:color 0.15s;}@media screen and (min-width: 40em){.css-zshczd{font-size:34px;}}@media screen and (min-width: 64em){.css-zshczd{font-size:34px;}}@media screen and (min-width: 102em){.css-zshczd{font-size:48px;}}@media (hover: hover) and (pointer: fine){.css-zshczd:hover{color:var(--theme-ui-colors-secondary);}}+figure 3 /Our reconstructed boundary of the BigCoast offset project (light green) overlaid against the much larger and inaccurate boundary data uploaded to the Verra offset registry (green). Toggle the + in the upper left of the figure to zoom in for more detail. It shouldn’t be this way and it doesn’t have to be. Some offset protocols, like the Climate Action Reserve’s Mexico Forest Protocol already require projects to share machine-readable boundary data. California’s forest offset program does the same. It's exactly these data that have allowed us to track the many wildfires that have burned projects enrolled in California's offset program. Figuring out if an offset project is burning – or doing any other analysis that requires exact borders – shouldn't involve phone calls or sifting through PDFs. All offset registries, offset rati"
