title = "About – CarbonPlan"
description = "We’re a nonprofit that analyzes climate solutions based on the best available science and data."
full_description = "Addressing the climate crisis requires action on several fronts. In addition to rapidly achieving deep emission reductions, we also need gigaton-scale carbon removal and sound strategies for adapting to climate change. Our solutions must respect science and support just outcomes. We no longer have time for approaches that don’t work. Our .css-63tp4q{box-sizing:border-box;margin:0;min-width:0;color:var(--theme-ui-colors-text);-webkit-text-decoration:underline;text-decoration:underline;cursor:pointer;}@media (hover: hover) and (pointer: fine){.css-63tp4q:active{color:var(--theme-ui-colors-text);}.css-63tp4q:hover{color:var(--theme-ui-colors-secondary);}}team analyzes the design and implementation of climate programs across the public and private sectors. Our work focuses primarily on carbon offsets, carbon removal, and climate risks. In all three areas, we aim to ensure the scientific integrity and transparency of climate services and solutions. Addressing the climate crisis requires action on several fronts. In addition to rapidly achieving deep emission reductions, we also need gigaton-scale carbon removal and sound strategies for adapting to climate change. Our solutions must respect science and support just outcomes. We no longer have time for approaches that don’t work. Our team analyzes the design and implementation of climate programs across the public and private sectors. Our work focuses primarily on carbon offsets, carbon removal, and climate risks. In all three areas, we aim to ensure the scientific integrity and transparency of climate services and solutions. We study fundamental climate science topics relevant to both mitigation and adaptation, and we analyze the implementation of climate programs to ensure that they line up with the science. We work with companies, nonprofits, and government organizations to develop robust climate programs, and we collaborate with journalists to raise public awareness and promote accountability."
