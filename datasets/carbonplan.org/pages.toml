stem-ui,-apple-system,BlinkMacSystemFont;letter-spacing:0.05em;margin-bottom:1px;margin-top:8px;}@media screen and (min-width: 40em){.css-19zc0k4{grid-column-start:3;grid-column-end:5;font-size:16px;margin-top:0;}}@media screen and (min-width: 64em){.css-19zc0k4{grid-column-start:3;grid-column-end:5;font-size:16px;margin-top:0;}}@media screen and (min-width: 102em){.css-19zc0k4{grid-column-start:3;grid-column-end:5;font-size:18px;margin-top:0;}} Percent Area Mismatched Mosquito 2019 .css-11lt0pv{box-sizing:border-box;margin:0;min-width:0;color:var(--theme-ui-colors-secondary);} CAR138497.1% Cohasset 2019 CAR138282.7% Martell CAR140956.1%.css-10rm12q{box-sizing:border-box;margin:0;min-width:0;display:grid;grid-gap:16px;grid-template-columns:repeat(4, 1fr);-webkit-column-gap:24px;column-gap:24px;row-gap:0;vertical-align:baseline;border:0;outline:0;margin:0;padding:0;border-style:solid;border-width:0px;border-top-width:1px;border-color:var(--theme-ui-colors-muted);padding-top:16px;padding-bottom:18px;margin-bottom:2px;border-bottom-width:1px;}@media screen and (min-width: 40em){.css-10rm12q{grid-template-columns:repeat(4, 1fr);}}@media screen and (min-width: 64em){.css-10rm12q{grid-template-columns:repeat(4, 1fr);}}@media screen and (min-width: 102em){.css-10rm12q{grid-template-columns:repeat(4, 1fr);}}@media screen and (min-width: 40em){.css-10rm12q{-webkit-column-gap:32px;column-gap:32px;row-gap:0;padding-top:16px;padding-bottom:18px;}}@media screen and (min-width: 64em){.css-10rm12q{-webkit-column-gap:32px;column-gap:32px;row-gap:0;padding-top:16px;padding-bottom:18px;}}@media screen and (min-width: 102em){.css-10rm12q{-webkit-column-gap:48px;column-gap:48px;row-gap:0;padding-top:20px;padding-bottom:22px;}} RBS 2019 CAR138118.5%.css-1f1ra8m{box-sizing:border-box;margin:0;min-width:0;margin-bottom:0;}.css-14449re{box-sizing:border-box;margin:0;min-width:0;color:var(--theme-ui-colors-secondary);display:block;text-align:left;font-size:16px;}@media screen and (min-width: 40em){.css-14449re{font-size:16px;}}@media screen and (min-width: 64em){.css-14449re{font-size:16px;}}@media screen and (min-width: 102em){.css-14449re{font-size:18px;}}.css-14449re a{color:var(--theme-ui-colors-secondary);}.css-14449re a:hover{color:var(--theme-ui-colors-primary);}.css-14449re>p{display:inline;font-size:16px;}@media screen and (min-width: 40em){.css-14449re>p{font-size:16px;}}@media screen and (min-width: 64em){.css-14449re>p{font-size:16px;}}@media screen and (min-width: 102em){.css-14449re>p{font-size:18px;}}.css-1sk0a8c{box-sizing:border-box;margin:0;min-width:0;text-transform:uppercase;letter-spacing:0.07em;display:inline-block;}table 1 .css-3dr1uz{box-sizing:border-box;margin:0;min-width:0;display:inline-block;margin-left:4px;margin-right:4px;padding-right:4px;}/Percent of project area classified as "Mismatched" or "Severely Mismatched" with the habitat needs of conifer forests. Vegetation climate mismatch makes forests more vulnerable to catastrophic disturbance, like wildfire and drought. There is one other project worth discussing — a compliance reforestation project named Camp Refo (CAR1491), which is also owned by SPI and is being developed within the burn scar of the devastating 2018 Camp Fire. From initial project documentation, SPI reports that they're replanting "young early seral stage conifer forests," which are exactly the types of trees that are likely no longer suitable for the warming, low elevation parts of the Sierra Nevada. By the end of the century, nearly the entire project (96.1 percent) will be "severely mismatched" with the historical habitat of Sierra Nevada conifers. These are almost certainly not the types of forests to use as the basis for making robust carbon offsetting claims. The pending enrollment of rapidly changing and uniquely vulnerable forests under California's forest offsets program is another example of the program underestimating the risks posed by climate change to long-term forest carbon storage. It's striking that homeowners in these same parts of the Sierra Nevada are losing their insurance policies, yet California's forest carbon buffer pool continues to underwrite risky, ecologically unstable, and fire-prone forest carbon projects. We highlighted this inconsistency in a comment letter we submitted to CARB late last year. In that same letter, we called on CARB to impose a moratorium on new projects in high risk areas, like the Sierra Nevada foothills, until CARB has completed its revision of how its forest offsets protocol calculates risk. This new research on zombie forests makes clear that failure to act immediately will only further weaken the environmental integrity of CARB's forest offsets program. .css-a7gsc6{font-size:34px;font-family:relative-medium-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;line-height:1.1;margin-top:32px;margin-bottom:24px;}@media screen and (min-width: 40em){.css-a7gsc6{font-size:34px;margin-top:48px;margin-bottom:32px;}}@media screen and (min-width: 64em){.css-a7gsc6{font-size:34px;margin-top:48px;margin-bottom:32px;}}@media screen and (min-width: 102em){.css-a7gsc6{font-size:48px;}}.css-1ebnuvp{font-size:34px;font-family:relative-medium-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;line-height:1.1;margin-top:32px;margin-bottom:24px;font-size:34px;font-family:relative-medium-pro,Roboto,system-ui,-apple-system,BlinkMacSystemFont;font-weight:400;line-height:1.1;margin-top:32px;margin-bottom:24px;}@media screen and (min-width: 40em){.css-1ebnuvp{font-size:34px;margin-top:48px;margin-bottom:32px;}}@media screen and (min-width: 64em){.css-1ebnuvp{font-size:34px;margin-top:48px;margin-bottom:32px;}}@media screen and (min-width: 102em){.css-1ebnuvp{font-size:48px;}}@media screen and (min-width: 40em){.css-1ebnuvp{font-size:34px;margin-top:48px;margin-bottom:32px;}}@media screen and (min-width: 64em){.css-1ebnuvp{font-size:34px;margin-top:48px;margin-bottom:32px;}}@media screen and (min-width: 102em){.css-1ebnuvp{font-size:48px;}}Data & Methods We've shared the underlying data and code that we used in writing this post. Our methods come with two small caveats. First, all the projects discussed in this post are not yet finalized, meaning CARB has not officially issued them credits. That means we're working with potentially incomplete information that is subject to change. Normal project paperwork, like the initial offset project data report that lists things like species information and official project acreage, is not yet available. A more formal assessment will only be possible if these projects become fully recognized by CARB. Second, we don't have access to CARB's official project boundary data for these projects. Instead, we inferred likely project boundaries from provisional data posted to the Climate Action Reserve registry. In the case of Martell (CAR1409), documents have the project covering 87,266 acres. From the available boundary data, we calculated the project area to be 75,823'''
