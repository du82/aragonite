ors-secondary);}}CDR Verification Framework is an interactive tool that maps out the key uncertainties associated with calculating net carbon removal for different CDR pathways. In collaboration with Frontier, we have now updated the tool to improve the representation of approaches that rely on terrestrial biomass. With the addition of two new pathways, the framework now includes five biomass-based pathways: biomaterial injection, biomass burial, biomass sinking, biochar applied to soils, and bioenergy with carbon capture and storage (BECCS). All of these pathways rely on photosynthesis to remove carbon from the atmosphere, and share a set of upstream uncertainties associated with the choice of biomass feedstock. However, each pathway takes a unique approach to storing the biomass carbon. Our evaluation reflects how confident we are that the approach can store carbon for at least 1000 years. .css-1rkzpad{box-sizing:border-box;margin:0;min-width:0;margin-top:48px;margin-bottom:48px;}@media screen and (min-width: 40em){.css-1rkzpad{margin-top:48px;margin-bottom:48px;}}@media screen and (min-width: 64em){.css-1rkzpad{margin-top:48px;margin-bottom:48px;}}@media screen and (min-width: 102em){.css-1rkzpad{margin-top:64px;margin-bottom:64px;}}@media print{.css-1rkzpad{break-inside:avoid;}}.css-11cfehs{box-sizing:border-box;margin:0;min-width:0;margin-bottom:24px;}@media screen and (min-width: 40em){.css-11cfehs{margin-bottom:24px;}}@media screen and (min-width: 64em){.css-11cfehs{margin-bottom:24px;}}@media screen and (min-width: 102em){.css-11cfehs{margin-bottom:32px;}}.css-c5r61t{box-sizing:border-box;margin:0;min-width:0;width:100%;height:225px;margin-top:64px;}@media screen and (min-width: 40em){.css-c5r61t{height:260px;}}@media screen and (min-width: 64em){.css-c5r61t{height:270px;}}@media screen and (min-width: 102em){.css-c5r61t{height:300px;}}.css-4qx60b{box-sizing:border-box;margin:0;min-width:0;position:absolute;height:8px;width:calc(100% - 1px);left:0px;top:1px;