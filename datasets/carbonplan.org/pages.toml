sor:pointer;}@media (hover: hover) and (pointer: fine){.css-1kesrdv:active{color:var(--theme-ui-colors-text);}.css-1kesrdv:hover{color:var(--theme-ui-colors-secondary);}}@media (hover: hover) and (pointer: fine){.css-1kesrdv:active{color:var(--theme-ui-colors-text);}.css-1kesrdv:hover{color:var(--theme-ui-colors-secondary);}}Oxford Principles for Net Zero Aligned Carbon Offsetting and SBTi’s Corporate Net-Zero Standard. This distinction has also become a focus of broader CDR policy conversations, with growing advocacy around establishing separate policy targets for emission reductions and carbon removals.22In January 2024, over 100 academics, research institutes, NGOs, and companies signed an open letter calling for the adoption of separate targets for carbon removal and emission reduction. CarbonPlan was a signatory. To quantify the climate benefit of a CDR optimization project, it must be compared to the counterfactual — what would have happened if the CDR project did not exist. But the counterfactual, like the project itself, can include both carbon removals and emissions. Because of this complexity, some accounting approaches comparing the project and counterfactual can end up hiding avoided emission benefits within credits that are labeled as carbon removal. We’re going to use enhanced rock weathering (ERW) as a case study to illustrate how accounting rules might inadvertently conflate avoided emission and carbon removals. ERW uses crushed rock to accelerate natural chemical reactions that remove CO₂ from the atmosphere. Many farmers already spread crushed rock on their fields, usually limestone, to raise soil pH. ERW attempts to optimize this existing agricultural process by changing the quantity or type of rock applied. The fact that “liming” is already widespread is often seen as an advantage of ERW — we already know how to spread crushed rock and we have the infrastructure to do it.3.css-ct36pl{box-sizing:border-box;margin:0;min-width:0;float:none;clear:non