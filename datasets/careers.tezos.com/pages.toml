full_description = "Search jobs 22Explore companies 15Talent networkMy job alertsPowered by GetroShowing 15 companies TriliTech12 jobsTriliTech is a blockchain research and development hub based in London, focused on the open-source Tezos blockchain. The company offers innovative solutions and collaborative opportunities for startups, artists, and established brands to create value and build community on the blockchain. With a dedicated team supporting developers through training, idea incubation, and recruitment, TriliTech drives adoption and technological advancement within the Tezos ecosystem. Their expertise spans core development, adoption strategies, and entrepreneurship, positioning them as a key player in the rapidly growing blockchain industry.Nomadic Labs7 jobsNomadic Labs is a leading research and development center focused on the Tezos blockchain, operating in France, Luxembourg, Germany, and Belgium. With a team of over 50 engineering researchers, they specialize in the core development, evolution, and adoption of the Tezos protocol. Their business model includes providing technical support to companies and institutions looking to leverage the Tezos blockchain for various applications, including decentralized finance, tokenization, and NFTs. Nomadic Labs differentiates itself through its commitment to open-source contributions and collaboration with academic institutions, positioning itself as a key player in the Tezos ecosystem.Madfish1 jobsMadfish is a blockchain technology company focused on developing open-source projects for the DeFi ecosystem. Their key products include the Temple wallet, Quipu Swap, and Yupana.Finance, which facilitate decentralized finance operations on the Tezos blockchain. With a strong emphasis on democratization and economic liberation through decentralized technologies, Madfish has transitioned from an outsourcing model to a product-focused approach, gaining traction in the crypto space. They have established themselves as a leading player in the Tezos ecosystem, with significant monthly transaction volumes and a commitment to innovation in decentralized solutions.Tezos Foundation1 jobsTezos Foundation is a Swiss foundation that promotes the Tezos protocol through grants and capital deployment to support the long-term success of the Tezos blockchain ecosystem. It operates within a decentralized community, deploying resources to ensure independent organizations can address challenges and foster innovation. The foundation's role is to sustain a vibrant ecosystem, enabling developers, researchers, and validators to collaborate and drive global adoption of the Tezos protocol, which is characterized by its energy efficiency and self-upgradability.Papers1 jobsPapers is a web3 venture studio that supports the entire lifecycle of innovative products in web3, from concept development to company growth. Founded as a software service provider, it has evolved to develop impactful ventures in blockchain, online security, and cryptography. With a focus on high-tech talent and a collaborative team, Papers aims to build secure futures for both its clients and the internet at large, positioning itself as a leader in the web3 space.LughLugh is positioned as the first player to issue a euro-pegged stablecoin, EURL, in a trustworthy environment, backed by Société Générale and audited by Deloitte. The EURL stablecoin is designed for both individuals and enterprises, facilitating transactions, hedging against volatility, and enabling innovative use cases in the financial and commercial sectors. With a commitment to compliance and security, Lugh aims to provide a reliable and transparent digital asset that mirrors the euro at a 1:1 ratio, making it a significant player in the growing stablecoin market.DogamiDogami is a mass-market NFT play-to-earn game that is centered around 3D NFT dog avatars. In the 'Petaverse,' gamers can do four things: adopt, play, earn, and socialize. The game's overarching goal is to breed the rarest and best dog. Dogami has appealing play-and-earn mechanisms, the most notable of which are in-game play-to-earn rewards. It enables users to adopt and play with their virtual NFT dogs in exchange for $DOGA cryptocurrency.WertWert is a licensed virtual currency provider that offers a unified payment solution for NFTs and fiat onramps, enabling seamless transactions for web3 assets. Their platform allows for easy integration into web and mobile applications, catering to both crypto natives and non-crypto users. With a focus on compliance and regulatory adherence, Wert differentiates itself by providing a decentralized approach that empowers clients to maintain their brand identity. The company operates globally, serving users in over 200 countries, and charges zero fees for basic services, earning revenue only when clients do. This model positions Wert as a reliable partner in the rapidly evolving DeFi and NFT markets.Tezos CommonsTezos Commons Foundation is a US based non-profit corporation. The foundation was formed in the spring of 2018, and leadership was elected through a collaborative effort of over 70 global Tezos community leaders. TCF is an independent entity that supports and guides community endeavors across the Tezos Commonwealth. We work closely with other Tezos operating organizations and provide a critical bridge between the vision of the Core Engineering team, the resources of Tezos Foundation, and the passion of the broader ecosystem of users, delegates, developers, businesses, and enthusiasts.fxhashfxhash is a platform that empowers artists and collectors to engage with generative art on the blockchain. It provides tools for creating, buying, selling, and collecting generative art projects, fostering a vibrant community of artists and curators. The platform differentiates itself through its focus on generative art, offering a safe and user-friendly environment for both creators and collectors. With a growing ecosystem, fxhash is positioned as a leader in the generative art space, attracting a diverse range of users and projects.TezsureWe are building tools and building blocks for DeFi on the Tezos blockchain.objktWe are a fast-moving startup on a mission to build the largest community-owned NFT marketplace, empowering creators and collectors in a brand new economy.Load more"
