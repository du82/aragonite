title = "carl | carl is a calendar for the commandline. It tries to mimic the various cal(1) implementations out there, but also adds enhanced features like colors and ical support."
description = "carl is a calendar for the commandline. It tries to mimic the various cal(1) implementations out there, but also adds enhanced features like colors and ical support."
full_description = "carl is a calendar for the commandline. It tries to mimic the various cal(1) implementations out there, but also adds enhanced features like colors and ical support. If you find any bugs or have ideas for additional features, please don’t hesitate to create a bug report or a feature request on codeberg or github. The configuration file is located XDG_CONFIG_DIRS/carl/config.toml or XDG_CONFIG_HOME/.carl/config.toml (the latter has precedence). It can be used to define the name of a themefile as well as one or more icalfiles. Icalfile listings contain paths to icalfiles and can be combined with their own styledefinitions. All the events from those icalfiles are then highlighted using either the IsEvent property (see below) or using the style defined togehter with the ical listing. When using the -a or --agenda switch, the event summary is displayed below the calendar in a bullet list, with the bullet also highlighted with the corresponding style. The themefile is read from XDG_CONFIG_DIRS/carl/<themename>.toml or XDG_CONFIG_HOME/.carl/<themename>.toml (the latter has precedence). Themefiles and Icalfile listings can contain custom style settings. A style changes how a specific date in the calendar is displayed. A style consists of a list of stylenames and optionally a weight and a styletype ('Dark' or 'Light'). If no styletype is set, the style is effective in either case. The various possible stylenames are listed at the bottom. A datestyle consists of a list of properties of a date and a style. The date has to fullfill all of the properties for the style to be applied."
