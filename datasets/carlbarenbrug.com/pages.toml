["https://carlbarenbrug.com/099-framer"]
title = "099 + Framer - Carl Barenbrug"
description = "099 Supply is a collaborative project that builds tools for creators. We began with a catalogue of photorealistic product mockups made for Photoshop. And we're …"
full_description = "099 + Framer 099 Supply is a collaborative project that builds tools for creators. We began with a catalogue of photorealistic product mockups made for Photoshop. And we're continuing to grow this collection slowly, but we recognised that we need to diversify. So we're building out a new product range in parallel. Specifically, modular web components for no-code website building platform, Framer. Our launch collection, available for just $1 each for a limited time, features a theme toggle, analogue clock, counter, mini web browser, loader, and a digital poster. Each component has a variety of options for you to easily customise and make your own. Each component can be used in any new or existing Framer website. Check out the demos and get your copy. And if there's any components you'd like to see us make, do let me know. Theme toggle web component for Framer Clock web component for Framer Counter web component for Framer Mini browser component for Framer Loader web component for Framer Digital poster web component for Framer"
