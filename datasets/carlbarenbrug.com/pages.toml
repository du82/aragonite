["https://carlbarenbrug.com/books-2022"]
title = "End of Year Book Review (2022) - Carl Barenbrug"
description = "I enjoy books (more so audio books than reading), but I don't consume them very much or as often as I'd like. At least in my own mind I don't get through many, …"
full_description = "End of Year Book Review (2022) I enjoy books (more so audio books than reading), but I don't consume them very much or as often as I'd like. At least in my own mind I don't get through many, but what's the global average? I don't honestly care. This year I wanted to make a concerted effort to consume more books, one way or another. I managed 10. A personal record in fact. So if you're curious about what those titles were, here you go: Hell Yeah or No by Derek Sivers 9/10 Anything You Want by Derek Sivers 8/10 The Practice of Not Thinking by Ryunosuke Koike 7/10 Invention by James Dyson 8/10 Hitchhiker’s Guide to the Galaxy by Douglas Adams 7/10 Zero Negativity by Ant Middleton 6/10 Sum: Forty Tales from the Afterlives by David Eagleman 7/10 Win by Harlan Coben 7/10 Homo Deus by Yuval Noah Harari 10/10 21 Lessons for the 21st Century by Yuval Noah Harari 10/10 For 2023, I'm aiming to consume 15 books mixing philosophy, design, fiction, and biography. And I'll be starting with God is Not Great by Christopher Hitchens. Note: I'm sharing this because my friend Manu requested it. He has a book list too, which you should check out."
