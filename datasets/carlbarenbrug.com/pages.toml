full_description = "099 Supply Creative Direction + UI/UX Design 099 Supply is a studio with a strong Swiss design influence that builds digital tools for creators. We began with a catalogue of photorealistic product mockups made for Photoshop. We're now building a new product range in parallel; modular web components for no-code website building platform, Framer. creative direction web design UX design copywriting research and development product development socials management Visit 099.supply Creative Direction + UI/UX Design Minimalism Life Creative Direction + UI/UX Design Minimalism Life® is a community-driven resource hub focused on the nuances of minimalism. It spans art, design, and lifestyle, and encourages creative initiatives through collaborative working. We created an intentionally low-stimulating digital environment for people to discover various minimalism-inspired resources from tooling to reading materials. creative direction web design UX design lead curation copywriting Visit minimalism.com Creative Direction + UI/UX Design TalkJS Product Design TalkJS is a fully-distributed company dedicated to building a chat API that helps people ship a chat feature in their app or website in minutes. Customers receive a complete suite of embeddable UIs and flexible APIs that work seamlessly in any chat or messaging use case. web and dashboard design UI app design UX design vector + coded graphics research and development project management Visit talkjs.com Product Design Minimalissimo Creative Direction + Curation Minimalissimo is an independent print and digital magazine dedicated to minimalism. We showcase a curated selection of the finest examples of art, architecture, interiors, furniture, lighting, and product design. Our gallery might inspire you to create something yourself, to share a design with your network, or to help you find the item you want. Minimalissimo is also a creative studio focused on web and product design, applying a distinctively minimal visual language to communicate value and honesty. creative direction web design lead curation copywriting + editorials product design ecommerce management Visit minimalissimo.com Creative Direction + Curation"
