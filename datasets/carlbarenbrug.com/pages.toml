["https://carlbarenbrug.com/care-in-design"]
title = "Care in Design - Carl Barenbrug"
description = "Care in design is ultimately about feeling rather than seeing. It is about being thoughtful of users—of humans. It is designing product details that you might …"
full_description = "Care in Design Care in design is ultimately about feeling rather than seeing. It is about being thoughtful of users—of humans. It is designing product details that you might randomly discover (sometimes even years later) rather than only designing what should be seen. Care in design is worrying about the small and quiet things like the way something has been considerately packaged or a fun interaction on a website at the stroke of a key or being mindful of accessibility for minorities, that in turn will receive a quiet nod (or tweet) of approval or a gentle smile. Care in design is design that is loved and appreciated by makers and by users—a feeling of connection. As a designer, I would like to put more care into my work."
