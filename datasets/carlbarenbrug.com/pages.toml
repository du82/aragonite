["https://carlbarenbrug.com/learning"]
title = "Things I Learned This Year - Carl Barenbrug"
description = "Personalisation sells, but good design satisfies. Don't wait for perfect execution. Ship and iterate. You don't need to fill your time. Creating calendar white …"
full_description = "Things I Learned This Year Personalisation sells, but good design satisfies. Don't wait for perfect execution. Ship and iterate. You don't need to fill your time. Creating calendar white space provides a buffer for work and play. Find the intersection of doing what makes you happy, what is smart for you long-term, and what is useful to others. Whatever that is, do it often. Ideas are worth nothing unless executed. They are just a multiplier. Execution is worth millions. The extremes inform the mean, but not vice versa. Design for the edge-cases; the middle will take care of itself. Friends are not forever, but they enrich our lives like no others can. Age should never hold back your confidence. Drinking enough water in a day is actually pretty hard. Nobody cares how many books you've read. People care what books you've read. And timing can determine quality. The impact a book can have on you is dependent on where you are in life. Don't dwell on augmenting your life. Self-care is more important than you probably think. Move to your own rhythm. This is where progress is realised. Keeping pace with others is a losing battle. How slowly or quickly you think is not an accurate measurement of your intelligence. Slow thinking is more deliberate and less emotional. Just because AI is available, doesn't mean you need it in your product. Personal websites and newsletters are far more valuable than any social media presence. You can’t teach minimalism to somebody who hasn’t felt the pain of having too much stuff. Solo projects evolve faster, but collaborative projects evolve better. We don't need a million followers. And maybe we don't need a thousand true fans. But we probably could use ten good internet friends to make our digital life better. Email is the best form of communication. Especially if you write informally. It's okay to obsess over numbers, but only if they give a sense of mission rather than distraction."
