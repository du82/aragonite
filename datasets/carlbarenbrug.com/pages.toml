title = "FormFeelingFunction® - Carl Barenbrug"
description = "Sometimes things need to end so we can create something new. Essentially, what's ending is Minimalissimo, and what's beginning is a creative lab I’ve named …"
full_description = "FormFeelingFunction® Sometimes things need to end so we can create something new. Essentially, what's ending is Minimalissimo, and what's beginning is a creative lab I’ve named FFF. I feel like I've done my part in curating beautiful minimalism on the web over the past 12+ years. Now, I’m ready to shift gears — from curating to creating minimalist products of my own. These will be both digital and physical, made in collaboration with Manu. We'll also be offering web services tailored to architects and interior designers. The basic idea behind FFF is to make things we like, with taste, simplicity, and purpose. Everything is experimental, which means failure isn't a concern — only learning, refining, and iterating. We're not in this for growth; we're in it for the love of creation, for fun, and for making useful things. Where that journey takes us? Well, we'll see. We'll explain the concept, principles, and philosophy behind FFF when we launch the next iteration of the site. Work starts in 2025. In the meantime, go ahead and bookmark formfeelingfunction.com"
