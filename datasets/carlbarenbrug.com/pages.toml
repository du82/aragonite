full_description = "Real Rock Experiences Since 2019, climbing has been an integral part of my life. I got into it very late in life, but it's a sport that has given me so much physically, mentally, and socially. This page is my photographic and (maybe) video archive of my real rock climbing (esp. bouldering) journey in pursuit of improving my level of strength, technique, and grade. Logbook Highest grade climbed = f7A+/V7 ✶ Climbing logbook Moments Session on Fast Cars and Camper Vans 7A at Carrick Fell in the Lake District, England, October 2024 Captain Haddock LH 7A, Bowden Doors in Northumberland, England, August 2024 Sport climbing in Arco, Italy, July 2024 The Argonaut, 6C, Back Bowden in Northumberland, England, May 2024 Scoop Traverse 7A, Bowden Doors, Northumberland, England, August 2023 Bowden Doors, Northumberland, England, April 2023 The wave feature at Bowden Doors, Northumberland, England, April 2023 Wolfcrag, Scotland, April 2023 Wolfcrag, Scotland, April 2023 Back Bowden in Northumberland, England, November 2022 Polished pockets in Premariacco, Italy, May 2022 My first experience sport climbing on real rock in Slovenia, May 2022 Standing alongside my climbing mentor, Ivan Moreale, May 2022"
