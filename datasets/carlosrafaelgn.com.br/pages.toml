title = "Referências sobre Programação Web"
full_description = '//<![CDATA[ "use strict"; BasicLayout.header(true); //]]> Sempre que você precisar de alguma referência sobre as aulas de Programação Web, você pode consultar um desses recursos: Eu - o professor :) Exemplos de códigos (desde o primeiro) e programas postados online Material de sala de aula (anotações) Learn - Mozilla Developer Network Conjunto de recursos voltados exclusivamente para o ensino de HTML, CSS e JavaScript HTML CSS JavaScript Khan Academy Material de alta qualidade, em português, que cobre desde tópicos básicos até avançados HTML e CSS JavaScript e DOM Material Completo Mozilla Developer Network Material sobre HTML, HTML5, CSS, JavaScript, AJAX, DOM e outras tecnologias, voltados não apenas para os browsers da Mozilla, apesar do nome :) Documentação Completa O conteúdo é muito extenso, e conforme navego pela documentação vou separando algumas páginas interessantes Acessibilidade Acessibilidade ARIA JavaScript Lexical grammar Using XMLHttpRequest Strict mode Working with objects Iterators and generators Manipulating the browser history Gráficos Drawing Graphics with Canvas CanvasRenderingContext2D CSS Unidades de medida Using CSS multiple backgrounds Using CSS flexible boxes Using CSS multi-column layouts W3C e Acessibilidade Web Content Accessibility Guidelines (WCAG) 2.0 Techniques for WCAG 2.0 Understanding WCAG 2.0 Accessible Rich Internet Applications (WAI-ARIA) 1.0 - Roles Accessible Rich Internet Applications (WAI-ARIA) 1.0 - States and Properties WebPlatform.org Explicações e informações sobre como utilizar HTML, CSS, JavaScript e outras tecnologias WebPlatform.org The JavaScript Tutorial Material em inglês com muitos tutoriais sobre diversos aspectos e funcionalidades do JavaScript :) Documentação Completa Attributes and custom properties Udemy Material em inglês com bastante informação introdutória JavaScript Tutorial: Learn the Basics HTML Canvas Deep Dive Livro online com muita informação sobre Canvas, tanto 2D como 3D (Web