title = "Cores e Acessibilidade"
full_description = '//<![CDATA[ "use strict"; BasicLayout.header(true); //]]> Cor do texto Cor do fundo Contraste calculado21.00:1 Simular disfunção visual Exemplos Texto Normal - AA Texto Normal - AAA Texto Largo - AA Texto Largo - AAA Explicação A World Wide Web Consortium (W3C) criou o WCAG (Web Content Accessibility Guidelines), que estabelece regras e boas práticas para desenvolvedores Web criar páginas e conteúdos acessíveis a todo tipo de pessoas, e de todas as idades. Entre as boas práticas definidas, está o ajuste das cores do fundo e do texto das páginas para facilitar a leitura das páginas (práticas G17 e G18). Para ser aprovado no nível AA, o texto deve ter um contraste mínimo com o fundo de 4.5:1 para fontes normais (< 18pt ou < 14pt negrito), e 3:1 para fontes largas (> 18pt ou > 14pt negrito). Para ser aprovado no nível AAA, o texto deve ter um contraste mínimo com o fundo de 7:1 para fontes normais, e 4.5:1 para fontes largas. O cálculo do contraste é baseado na fórmula fornecida pela W3C, extraída da técnica G18 da WCAG 2.0, disponível aqui. Para mais informações e ferramentas sobre acessibilidade, ver: WCAG 2.0 Techniques for WCAG 2.0 Understanding WCAG 2.0 Contrast (Minimum) Contrast (Enhanced) Web Accessibility Tools Consortium ou suas ferramentas Tipo de disfunção Espectro normal Essa funcionalidade requer uma API que não está disponível em seu browser :( Espectro distorcido Essa funcionalidade requer uma API que não está disponível em seu browser :( A exibição acima é apenas uma aproximação, calculada através de uma transformação linear baseada nas matrizes de Loren Petrich, disponíveis aqui. Para mais informações sobre disfunções visuais, ver: Protanopia (Deficiência do vermelho) Deuteranopia (Deficiência do verde) Tritanopia (Deficiência do azul) Color Blindness Daltonismo Tipo de disfunção Imagem para testarEscolher arquivo...'
