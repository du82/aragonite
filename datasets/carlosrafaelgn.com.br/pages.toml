["https://carlosrafaelgn.com.br/Aula/TipoAnim.html"]
title = "Tipos de Animação"
full_description = '//<![CDATA[ "use strict"; BasicLayout.header(true); //]]> A seguir são mostradas duas técnicas de animação. A da esquerda utiliza uma imagem vetorial, e por isso todos os quadros (frames) podem ser calculados conforme necessário, dando um resultado final mais preciso. Já a da direita, utiliza imagens matriciais (bitmaps). Com esse tipo de imagem, todos os possíveis quadros devem ser previamente desenhados, e a única tarefa do programa é escolher qual quadro será exibido na tela. Cada um desses tipos oferece vantagens e desvantagens. VantagemDesvantagem VetorialPrecisão nos quadros gerados, sendo possível obter qualquer quadro desejado em tempo realCusto computacional elevado, se comparado à animação matricial, devido à quantidade de cálculos necessários MatricialBaixo custo computacionalImpossibilidade de se obter qualquer quadro que não esteja previamente desenhado Vetorial Matricial (Sprites) FPS'
