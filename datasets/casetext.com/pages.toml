full_description = '''CoCounsel: One GenAI assistant for professionals Trained by industry experts, backed by authoritative content, and equipped with best-in-class security, Thomson Reuters CoCounsel frees you to focus on complex, high-value work that better serves your clients, organization, and business Existing Casetext customer? Sign in here Looking for CoCounsel Core, formerly Casetext? View plans Rely on CoCounsel to be with you every step of the way Let CoCounsel be your trusted partner, delivering professional-grade generative AI (GenAI) to amplify your expertise. View video Advanced GenAI skills help you work smarter Now professionals can delegate substantive work to GenAI and trust the results. CoCounsel provides: A single, unified GenAI experience across Thomson Reuters Access to the most innovative large-language models (LLMs) backed by the industry's most trusted and reliable content Technology built, maintained, and expanded by over 1,000 GenAI and machine-learning (ML) experts Integration with industry-leading platforms such as Westlaw, Practical Law, and Microsoft 365 to save time and enhance productivity Data privacy We never use customer data to train artificial intelligence models Threat protection We perform regular vulnerability scans and annual third-party penetration testing Secure processing Data are encrypted in transit and at rest with industry-standard protocols CoCounsel for legal professionals Research more efficiently, increase productivity, and practice with confidence using generative AI built on more than 150 years of authoritative legal content and expertise. GenAI skills that are core to your legal work Solve your toughest challenges using the most advanced and comprehensive set of GenAI skills available. Complete mundane tasks such as reviewing, comparing, and summarizing documents quicker than ever, freeing you to spend time on creative thinking and strategic planning. Learn more about CoCounsel Core Save valuable time with an end-to-end drafting solution Spend less time on drafting and more time focusing on high-value work that delivers results for your clients. This secure, comprehensive drafting tool puts a GenAI assistant at your fingertips directly where you work. Learn more about CoCounsel Drafting Conduct research with greater speed and efficiency Jumpstart your research and get accurate answers with unparalleled speed and accuracy. Westlaw Precision uses generative AI to help you get relevant answers to your legal research questions from sources you trust. Learn more about Westlaw Precision with CoCounsel Combine expert legal know-how and content with powerful generative AI Leverage CoCounsel's generative AI capabilities in Practical Law to quickly deliver answers and apply insights backed by the industry’s largest collection of expertly created and maintained how-to guidance, templates, and more. Learn more about Practical Law Join the legal professionals already seeing the benefits of CoCounsel 12,200+ law firms using CoCounsel (45% year-over-year growth) 4,900+ legal departments using CoCounsel (23% year-over-year growth) 137% year-over-year increase in CoCounsel usage* *Based on U.S. usage data Legal insights The economic impact of Westlaw Precision with CoCounsel Thomson Reuters commissioned Forrester Consulting to conduct a Total Economic Impact (TEI) study and examine the cost savings and business benefits enabled by Westlaw Precision. Download the report CoCounsel Drafting: Embracing AI for legal drafting in Microsoft Word Legal professionals spend more than 60% of their time drafting and reviewing legal documents. CoCounsel Drafting makes it possible to devote more attention to high-value work. Read the article How generative AI improves efficiency and accuracy in courts The right generative AI (GenAI) assistant can streamline court operations, letting legal staff focus on helping more people get justice quickly and reliably. Read white paper CoCounsel for tax, audit, and accounting professionals Streamline workflows, speed up your research, and deliver results with generative AI technology backed by unrivaled expertise. Find answers faster than ever Save time and effort by reducing long research sessions into simple tasks with AI-assisted research that frees you to focus on complex, high-value work that requires your professional skills and human expertise. Learn more about Checkpoint Edge with CoCounsel Tax, audit, and accounting insights How can your small-size firm use GenAI? No matter the size of your accounting firm, GenAI offers a transformative opportunity for operational efficiencies and sustainable growth. Read blog How the C-suite can support GenAI adoption in tax departments There is no part of tax and trade untouched by the meteoric rise of GenAI — nor the risk it introduces. This blog post explores the challenges and opportunities of GenAI adoption. Read blog The role of technology and AI in advisory services Forward-thinking accounting firms are driving business growth through advisory services, requiring a shift in mindset and business model that embraces generative AI technology. Read blog Professionals are choosing CoCounsel “I think it's exponentially less time, because you don't know where to start sometimes to get answers. With AI-Assisted Research on CoCounsel, you don't have to worry about where to go. You just ask, and you get a response. It's concentrated in one place instead of looking at five different places.” Founding partner Mid-size law firm Frequently asked questions What is the difference between CoCounsel, CoCounsel branded products, and existing Thomson Reuters products enhanced by CoCounsel? CoCounsel is the GenAI assistant for professionals, available wherever you work within the Thomson Reuters ecosystem or integrated platforms such as Microsoft 365. CoCounsel branded products offer unique skills, such as Search a Database and Review Documents within CoCounsel Core. CoCounsel can also focus on assisting in a specific area of work like faster drafting within CoCounsel Drafting. Existing TR products enhanced by CoCounsel are standalone products that integrate CoCounsel to facilitate specific tasks such as Westlaw Precision with CoCounsel’s AI-Assisted Research, helping users save time and maximize the value of their access to trusted Thomson Reuters content. Does Thomson Reuters or third parties retain user content or prompts to train their GenAI-based products or underlying large-language models (LLM)? No. Your user content and prompts are not used to train or improve CoCounsel and associated products or LLMs, used in Thomson Reuters or third-party output, or stored by OpenAI or Google. Thomson Reuters GenAI third-party partners, such as OpenAI and Google, are contractually prohibited from using any customer data to train their models. Additionally, where applicable, Thomson Reuters has established systemic controls to turn off third parties' abuse-monitoring solutions to ensure there is no human access to Thomson Reuters customers' data or inclusion of that data in third-party models. How long does Thomson Reuters retain user content and prompts? Retention of user content and prompts is customized to fit customer needs and set up at the organization account level with the support of a Thomson Reuters client manager. We then delete user content and user prompts in accordance with the customer's retention policy. Users can delete their content and prompts in the product at any time. How does Thomson Reuters protect user privacy and data? All GenAI LLM requests originating from Thomson Reuters are processed under the identity "Thomson Reuters," never identifying the Thomson Reuters customer who made the request. We secure all data in transit via TLS 1.2, and symmetric encryption (AES-256) protects data at rest. All interactions with GenAI LLM providers use zero-retention API calls. Where are user content and user prompts stored when retained? Systematic procedures and hosting are in the U.S. We process all interactions with OpenAI GPT and Google Gemini in the U.S. We host backup data in separate availability time zones in the U.S.* *Region-based hosting is available in the UK, Australia, and Canada. What guardrails are in place to prevent bias in Thomson Reuters content? We have developed and implemented prompting "guardrails," ensuring our GenAI-based products will only produce responses from content drawn from a clearly defined and limited set of verified information, such as our own content databases. This practice restricts the large language model's ability to produce potentially objectionable content broadly sourced from the internet. Questions about CoCounsel? We're here to support you. 646-540-3000 Call us or submit your email and a sales representative will contact you within one business day. Contact us CoCounsel support View product training and support Already a customer? Sign in to CoCounsel'''
