full_description = '''Welcome to Casiopeia!Our name is inspired by the constellation "Cassiopeia", and is suggested by yeongJIN_COOL, taking advantage of the beginning of the word cassiopeia be very similar to the word/brand casio.If you want to program for casio calculators you're in the right place! We are a young, but active community. Announcement: http://www.casio.com/news/detail/casio- ... calculator Seems as if they are basically porting the fx-CP400 3D graphing functionality. I did not read anything regarding touch, so this is nothing like the HP Prime. According to French online sellers, this model will be available in June 2016. fx-CP400 emulator with OS 2.01: https://edu.casio.com/softwarelicense/ Casio Education France website: http://www.casio-education.fr/products/fx-cp400 Casio Education Australia published recently on its website the announcement of the future OS 2.00 for Classpad II, which will be released in August. Some of the main new features are: Sliders & pinch zoom in graphs Interact with secants and chords in the new Interactive Differential Calculus application Plot the values of the tangent's slope and see the idea of a derivative function forming Explore the connection between a function and its derivative function Graphs can now be viewed horizontally 3D Graphing, with wire mesh and surface colouring Physium periodic table 3D Graphing is in my opinion the most awaited feature, particularly by former users of previous monochrome models (classpad 300/330...) that had this functionality. Taking into consideration the size of the screen, sliders & pinch zoom in graphs will be useful in the analysis of functions. Physium seems to be an interesting alternative to CPeriodic. Source: Casio Education Australia As anticipated in the previous news today was released a new OS update (2.04) for fx9860 series calculators. It introduces some features initially added in Casio Prizm OS last updates (but not all). List of confirmed features added: Vector Calculus (memories A-Z and commands) Automatic parentheses List of features not added: SolveN has not been updated Improved Equation Solver RanSamp#, StdDev_Sigma(), Variance_Sigma2() commands Improved graphical resolution of integrals A new version of fa-124 was also released. In recent days was also discovered more Information about the fx9860GIIs (that comes with os 2.03). You can read the post of TeamFX here for more details. Download: http://edu.casio.com/dl/'''
