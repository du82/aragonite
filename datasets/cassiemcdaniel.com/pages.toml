title = "About — Cassie McDaniel"
description = "My story Give me a problem to chew on. An overview – I’ve led design teams at startups, non-profits and embedded product teams, leading brand,..."
full_description = "My story Give me a problem to chew on. An overview – I’ve led design teams at startups, non-profits and embedded product teams, leading brand, research, product design and cross-functional teams. I enjoy building teams, coaching and mentoring both ICs and managers, establishing and advocating for design (and customer) culture, and leading teams with kindness. I’m passionate about mission-driven initiatives, whether that is enabling creative culture, driving environmental advocacy, or designing humane digital products. My background running my own design studio gives me a tremendous respect for building a business from the ground up, and my desire for impact has given me a hunger for solving problems at scale. Give me a delicious problem to chew on, alongside a compassionate and talented team, and I’m SO excited to dig in. SocialLinkedinBluesky Substack MediumInstagram Dribbble MentoringADPList Roots in digital Interactive design has always led me down interesting paths. Some of my first projects included designing flash sites in 13 languages for European ad campaigns, putting in the hours on big ad agency projects for shoe companies and the fast food industry. As I gained experience, I moved closer to work that was aligned with my own values, especially arts and technology organizations. Design in healthcare My first significant departure from traditional design work was stepping into the world of healthcare in 2011, where I was the first visual designer embedded in the Human Factors team, a part of the Centre for Global eHealth Innovation at Toronto General Hospital. We designed and tested interfaces for medical devices and I got into the world of mobile app design, specifically for self-care of chronic diseases like diabetes, asthma and heart disease. One of our projects, Bant app, won several awards including the People’s Choice at the mHealth World Congress. Other work is still in clinical trials. I became a design lead in the Centre and grew an in-house studio with both staff and physical space. I helped bring Hacking Health to Toronto to connect designers with medical professionals. I blogged regularly to attract designers to the industry and spoke across Canada and in the U.S. at Harvard and HXD Conference in Boston, Medicine 2.0 in Vancouver, and others. It was during this period that I was on the founding team of Creative Mornings Toronto. I also started the Women && Tech project to highlight the stories of women in our industry, one of the first projects to do so. Technology non-profit In healthcare, progress was painfully slow-moving and I felt I could do greater good in a faster-paced environment. I decided to move back into technology where there was also more room for me to grow.I started at the Mozilla Foundation as a UX/UI designer working on the Webmaker suite of tools: Thimble, X-Ray Goggles, Popcorn maker and the Webmaker mobile app. I advocated for design within this developer-centric organization and forged a role for myself as Design Director. I now oversaw a team doing the product design work I previously did single-handedly, including brand design, web literacy and advocacy work around Net Neutrality, event branding and wayfinding for the annual Mozfest, and Mozilla’s large scale fundraising campaigns. My colleagues were talented and ambitious and I learned so much about leading a team, my craft, and the serious issues threatening the openness of the web today. Mozillians remain one of my favorite groups of alums. The work I did and the people I met at this intense, mission-driven organization have become foundational to my belief that my skills are flexible and infinitely applicable to helping lift up the things that I believe in. Running a studioAfter Mozilla I started a small design studio with my husband. We built a sought-after design business in the town of Paris, Ontario (1.5 hours from Toronto). We ran campaigns, built and refined websites and apps, and created short films & animations. We were deeply embedded in our local community and frequently volunteered for causes we believed in. We ran the frequently sold-out Paris Lectures event series & workshops featuring local artisans, 20 events that grew from 13 people to 150+ with waiting lists. Not bad for a town of 10,000. Our business grew steadily until my mother's Parkinson's diagnosis drew us back to Florida. Currently Head of DesignLeading product, brand & research at MediumAdvocate for design & humansOver the years I have learned what doing work I love feels like. I have led projects, teams, and functional departments across a range of industries, remote and otherwise. I have started side hustles, seen them grow, and absorbed how different people, organizations and business models operate, and what is important to me at work often boils down to people and mission. Those closest to me know I am authentic, compassionate, and an excellent detangler of complex challenges. I act like an owner and care a lot about inclusion. Anyone who’s been in design review with me knows I have a penchant for the big picture and an obsession with what story the details are telling.Currently I am Head of Design at Medium. Before that, I was Product Design Director at Lattice helping to lead our Platform team and initiatives. Previously, I led design at Glitch and Webflow. I welcome opportunities to meet other people doing interesting things! Be sure to say hello. SkillsDesign LeadershipProduct Design (UX/UI)Graphic Design + BrandingContent Strategy User Research & TestingWriting & CommunicationRemote WorkOpen SourceSectorsTechnology/softwareStartups & small businesses Arts & cultureHealthcareVolunteering Friends of Wekiva Board Member (since ’24) ADPList Mentor (since ‘24) Master Gardener (since ‘23) Orlando Designers Admin (since ‘19)"
year_published = 2007
