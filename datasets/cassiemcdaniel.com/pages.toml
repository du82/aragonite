title = "Design — Cassie McDaniel"
description = "Design I've been designing professionally for nearing 20 years, leading design teams remotely for half of that. Most recently I led..."
full_description = "Design I've been designing professionally for nearing 20 years, leading design teams remotely for half of that. Most recently I led product design for the Platform team at Lattice, a group of 60+ designers, engineers, and PMs supporting all product verticals to build at scale to the highest quality bar. Together we built complex, interconnected HR software to enable high performing teams and help make work meaningful. While I take much pride in the product work I’ve accomplished with my teams of designers, PMs, engineers, researchers, data scientists and our CSM and go-to-market friends, the part I am most proud of personally is supporting my teams and partners to be successful in their day-to-day jobs. I lean in to being an amplifier of other people’s strengths. Design has enabled me in my career by teaching me to ask the right questions. I aim to get to the important points quickly, and then strategize and visually communicate where we want to go next. This skill has helped in all my work as an individual UX/UI or graphic designer, as well as in business reviews with executives. I’ll never stop asking questions, and I’ll never stop pushing for improvement in both what and how we build. Leadership experience 2021-2024—Product Design Director, Lattice 2020-2021—Senior Product Design Manager, Webflow 2019-2020—Design Director, Glitch 2018- 2019—Lead UX/UI Designer, Adobe 2016-2018—Co-founder/Designer, Jane & Jury 2013-2017—UX/UI Designer → Design Director, Mozilla Download my résumé Led and coached a team of 6-12 reports, and altogether a team of 60 Engineers, Product Managers, Product Designers, Researchers and Data Scientists) Responsible for four major product areas including Engagement, Goals, Analytics (0 to 1), and Platform. Accountable for product success and strategy implementation via monthly executive Business Reviews Established Design Systems and Content Design teams and practices Led redesign of design hiring process Helped establish Brand and Design Ops leadership, mature our Research practices, and grow design team from 10 to 30 Led a team of 5-6 reports including product design managers and ~50 engineers Responsible for Webflow’s largest product area, called Capabilities, which included Dynamic Data, Memberships, Logic, and Canvas (Designer Experience) Created new Capabilities pillar strategy with my engineering and product counterparts Launched new Logic and Memberships products Led redesign of our product development process Helped establish Brand and Research leadership 3 direct reports and multiple illustration and brand contractors Worked closedly with VP Marketing to reinvigorate the editorial media efforts Helped shift the company’s product strategy, working closely with Data and Marketing Led design for funding round and homepage redesign, and established brand guidelines Stabilized team during the legitimization of the tech industry’s first union"
