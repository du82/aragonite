["https://casual-effects.com/codeheart"]
title = "codeheart.js"
full_description = "codeheart.js supports the following web browsers: Safari 5.1.5+, Internet Explorer 9.0+, Firefox 12.0+, Chrome 18.0+, and iOS Safari 5.0+ (iPhone/iPad/iPod) on all operating systems. The game library requires a network connection so that it can keep itself up to date. To develop or deploy your game without a network connection, just expand the contents of codeheartjs.zip into the same directory as your game, or the parent of that directory if you want to share one installation over multiple games. To use the advanced online (network) features of codeheart.js, you need to run a relay server with relay.js under Node.js. codeheart.js is an open source (BSD) JavaScript and HTML5 framework designed and implemented by Morgan McGuire. Lily Riopelle at Williams College contributed to early versions of the library."
