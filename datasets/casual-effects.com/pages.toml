title = "Show Me Colors"
full_description = "Click PLAY and then allow camera access when the browser's security banner appears. Video is processed locally and no images will leave your computer. Press the spacebar to download a screenshot at any time. Show Me Colors is a web game for children written in about four hours by Morgan McGuire (@morgan3d) at @CasualEffects for the One Game a Month community game jam. The game works best in a brightly-lit room. Try lots of different objects on screen, such as toys, drawings, and clothing. Because cameras automatically adjust colors, it works best when the background is a neutral color such as white. The game was written in JavaScript using the lightweight codeheart.js framework. The code is open source and can be downloaded as these files:"
