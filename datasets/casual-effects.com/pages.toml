["http://casual-effects.com/gamejam/starjourney"]
title = "Star Journey"
full_description = "The vestiges of the defense fleet are stranded at the edge of the solar system. Players fly star fighters through warp gates while dodging and blast asteroids, trying to return to their home planet before time and fuel run out. Star Journey is a cooperative space game for two players, or for one player cooperating with him- or herself. The control scheme supports game pads, touch screens, and keyboards. It plays best in the Chrome browser using Xbox360 game controllers. Morgan McGuire created the game as a hobby project for One Game A Month and it is free on the web. The game is appropriate for players of all ages. The project was about 72 hours of work spread over more than a year, mostly as short sessions on Saturday nights. I used Emacs and Chrome (with the Tattiebogle Xbox360 controller driver) on OS X as my primary development environment. I made about 250 commits to Subversion over the course of the project. I used Chrome because it has game controller support and better performance than Firefox. The game runs about as well on Safari as Chrome, but without controllers. I released Star Journey as my January 2015 game for the One Game A Month game jam challenge. My young children helped with asset creation and provided essential feedback as playtesters and designers, driving both the visuals and the difficulty curve. I wanted the gameplay to emphasize cooperation. This led to the gate system (which requires player coordination) and the shared resource of remaining ships (which create interdependence and support varying player abilities). The star fighters are color coded to help players distinguish them, and the on-screen controller and background nebula have matching hues. To further reduce confusion, the green player is restricted primarily to the left side of the screen and the purple player to the right. After playing Brothers: A Tale of Two Sons, I realised that the relatively straightforward gameplay in Star Journey enables a single-player cooperative game. So, I added control schemes for a single dual-stick game controller and for a single player holding a tablet."
year_published = 2025
clearnet = "http://casual-effects.com/gamejam/starjourney"
