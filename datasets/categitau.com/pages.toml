full_description = "👋 Welcome! Greetings! I’m Catherine Gitau, and I’m thrilled to welcome you to my personal corner of the web. Here on this site, I delve into the realms of data science, machine learning, deep learning, and the fascinating world of NLP. By day, I’m a Data Scientist at Visa Inc., where I’m continually honing my skills and expertise. But that’s not where my aspirations end —I’m on a mission to evolve into a full-stack data scientist, bridging the gap between data-driven insights and product creation. My passion lies in not only uncovering business-critical insights through data science but also building impactful products that stem from those insights. This has led me to aspire to become a proficient Machine Learning Engineer, equipped to bring these visionary products to life. I’m also engrosed in NLP research, with a unique focus on African languages. So, whether you’re interested in the intricacies of data science, machine learning and deep learning, or curious about the potential of NLP, you’ve arrived at the perfect destination. Join me as we unravel insights, build innovations, and explore the frontiers of technology together! Welcome! While you’re still here feel free to.. Check out my blog posts. Have a look at other articles I’ve written on my Medium. Look at some of the things I have worked on in Projects or on Peep my CV. You can reach out to me on or if you’d like to collaborate on a project, comment on my blog posts or even just to say Hi 🙋 :) Latest Posts 2021 in review and hello 2022! Textual Data Augmentation Tools And Techniques Machine Translation Eval Metrics Must Have 10 Data Science Books Fuzzy String Matching In Python Latest News 💻 November 2021 - Joined VISA.Inc 💻 September 1st 2021 - Launched this personal blog 🥳 🗣️ August 2021 - Presented at LoResMT Workshop @ MT Summit 2021 on Challenges and Advances in MT Systems for African Languages ‍💻 June 2021 - Launched Masakhane Web, A Machine Translation platform for solely African Languages. Recent Favourite Reads 📚 Machine Learning Interviews Book"
