full_description = "These are various quotes, adages, laws, idioms, sayings, and other things that I have found particular insights into the nature of human existence. In some ways, this is a collection of rules I try to live by. I am writing them down here so I don’t forget, and hopefully might inspire others to do the same. If nature has made any one thing less susceptible than all others of exclusive property, it is the action of the thinking power called an idea, which an individual may exclusively possess as long as he keeps it to himself; but the moment it is divulged, it forces itself into the possession of every one, and the receiver cannot dispossess himself of it. Its peculiar character, too, is that no one possesses the less, because every other possesses the whole of it. He who receives an idea from me, receives instruction himself without lessening mine; as he who lights his taper at mine, receives light without darkening me. It is in Apple’s DNA that technology alone is not enough—that it’s technology married with liberal arts, married with the humanities, that yields us the results that make our hearts sing. It was one of those days when it’s a minute away from snowing, and there’s this electricity in the air, you can almost hear it. And this bag was just, dancing with me, like a little kid beggin’ me to play with it – for fifteen minutes. And that’s the day I realized that there was this entire life behind things, and this incredibly benevolent force that wanted me to know that there was no reason to be afraid, ever. Video’s a poor excuse, I know. But it helps me remember – I need to remember. Sometimes, there’s so much beauty in the world – I feel like I can’t take it, like my heart is just going to cave in. This day is early and yet young, so is the new mind also tender and young, so also is the Good Tidings of Peace and Power, and as the new sun of Good Tidings of Peace and Power arose, so it will proceed on its course and prosper; so also will the young mind, and the Good Tidings of Peace and Power shall prevail and prosper. Therefore in the future, your grandchildren forever shall live in peace."
