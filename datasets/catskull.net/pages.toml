title = "Fun with Ghostty Shaders"
description = "Back when Ghostty released I played around with the entire config, including trying to get some shaders to work. iTerm2 has the ability to have an image background in your terminal and ghostty does not, at least not directly. I wanted to get a custom image with a shader but couldn’t get it working."
full_description = 'Feb 22 2025 Fun with Ghostty Shaders #development #fun #ghostty #retro #terminal #visuals Back when Ghostty released I played around with the entire config, including trying to get some shaders to work. iTerm2 has the ability to have an image background in your terminal and ghostty does not, at least not directly. I wanted to get a custom image with a shader but couldn’t get it working. Well, today in the Bullpen Sam posted this link to a repo full of shaders so I decided to give them a go. Pretty soon I realized I should take a picture or video of these so other people don’t have to go through the pain. I ended up finding a couple of combinations I really liked so I’ll highlight those at the top, then the rest is just each shader with a link to the repo. I recommend cloning the entire repo into ~/.config/ghostty/shaders and then you can specify your shaders in the order they will be applied. ~/.config/ghostty/config </> custom-shader = ./shaders/tft.glsl custom-shader = ./shaders/bettercrt.glsl custom-shader = ./shaders/bloom.glsl # only set this during testing, defaults to "true" which animates only active windows # custom-shader-animation = always drunkard+retro-terminal+bloom Your browser does not support the video tag. glitchy+bettercrt+water+bloom Your browser does not support the video tag. retro-terminal+tft balls tft+bettercrt balls tft+retro-terminal+bloom balls animated-gradient-shader↗ Your browser does not support the video tag. bettercrt↗ bloom↗ cineShader-Lava↗ Your browser does not support the video tag. crt↗ cubes↗ Your browser does not support the video tag. dither↗ drunkard↗ Your browser does not support the video tag. fireworks-rockets↗ Your browser does not support the video tag. fireworks↗ Your browser does not support the video tag. galaxy↗ gears-and-belts↗ Your browser does not support the video tag. glitchy↗ Your browser does not support the video tag. glow-rgbsplit-twitchy↗ Your browser does not support the video tag. gradient-background↗ in-game-crt↗ inside-the-matrix↗ Your browser does not support the video tag. just-snow↗ Your browser does not support the video tag. matrix-hallway↗ Your browser does not support the video tag. negative↗ retro-terminal↗ sin-interference↗ Your browser does not support the video tag. smoke-and-ghost↗ sparks-from-fire↗ Your browser does not support the video tag. spotlight↗ Your browser does not support the video tag. starfield-colors↗ Your browser does not support the video tag. starfield↗ Your browser does not support the video tag. tft↗ underwater↗ Your browser does not support the video tag. water↗ Your browser does not support the video tag. Finally for all you young players at home here’s my full current daily ghostty config: ~/.config/ghostty/config </> ont-family = TX-02 font-size = 19 font-thicken = true theme = light:xcodelighthc,dark:xcodedarkhc quick-terminal-animation-duration = 0 keybind = global:super+grave_accent=toggle_quick_terminal cursor-style = block shell-integration-features = no-cursor cursor-style-blink = false link-url = true window-inherit-working-directory = true window-inherit-font-size = true window-theme = system clipboard-trim-trailing-spaces = true mouse-hide-while-typing = true macos-titlebar-proxy-icon = hidden macos-icon = custom-style macos-icon-frame = plastic macos-icon-ghost-color = FFFFFF macos-icon-screen-color = 000000'
