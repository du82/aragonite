["https://catskull.net/my-favorite-wikimedia-images-of-2024.html"]
title = "My Favorite WikiMedia Images Of 2024"
description = "I read a lot of Wikipedia. Doesn’t everyone? I like to look at pictures, especially of rare things, historical things, and illustrations of abstract mathematical concepts."
full_description = "Jan 11 2025 My Favorite WikiMedia Images Of 2024 I read a lot of Wikipedia. Doesn’t everyone? I like to look at pictures, especially of rare things, historical things, and illustrations of abstract mathematical concepts. Each time I come across an image I like, I watch it on WikiMedia. This is all the images I watched in 2024. There are a lot of images in this collection that are fun. There are are some that are shocking. I learn about our past so I can improve our future. Images link to their Wikimedia page, please see for copyright and other information. Images are in alphabetical order. Hover over to colorize, or on mobile I think you can click the shaded border around the image since the images are links to wiki. Trigger warning: death, war, slavery, racism, optical illusions, moving images Crowd at New York's American Union Bank during a bank run early in the Great Depression. The Bank opened in 1917 and went out of business on June 30, 1931.↗ Incidents of the war. A harvest of death, Gettysburg, PA. Dead Federal soldiers on battlefield. Negative by Timothy H. O'Sullivan. Positive by Alexander Gardner.↗ Example of how the Benday dots work.↗ Depiction of Birkebeiner skiers carrying Prince Haakon to safety during the winter of 1206 has become a national Norwegian icon. The prince grew up to be King Haakon IV whose reign marked the end of the period known as the Civil war era in Norway↗ Cadmium sulfide quantum dots on cells↗ Kaleidocycle unfolded as chain of 6 tetrahedra↗ Challenge vs. skill, showing 'flow' region.↗ Convict leasing, children. 1903↗ Crab Nebula - Hubble Space Telescope, 2005↗ Crab Nebula - James Webb Space Telescope, 2023↗ Illustration of a diffeomorphism.↗ Disordered Otaku room.jpg↗ E8 Petrie projection↗ EGA64 Full Palette↗ Tuareg on the dune of Timerzouga, place named Tadrart in the town of Djanet, wilaya of Ilizi 20km from the Algerian-Libyan border (Cultural Park of Tassili).↗ Tuxtla statuette with epiolmec script.↗ Stele of the cactus bearer, excavated 1972↗ Liberty Leading the People - Eugène Delacroix, 1830↗ Fallen tree in forest in Haukkamäki district, Jyväskylä. The forest is situated between the streets Nuutinkorventie and Koppalankaari.↗ Finnish Defence Forces soldiers in nuclear, biological, and chemical (NBC) gear.↗ Clear plastic cutlery changing the polarization state of light between crossed polarizers↗ Sigmund Freud's Sofa↗ NRC Image of Nuclear Fuel Pellet↗ The General MIDI logo↗ The Intermountain Power Plant, which is located in the heart of Utah, in Millard County. It is operated by the Los Angeles Department of Water and Power. Currently burning coal. It will be converted to natural gas by 2025.↗ NASA engineer Ernie Wright looks on as the first six flight ready James Webb Space Telescope's primary mirror segments are prepped to begin final cryogenic testing at NASA's Marshall Space Flight Center.↗ Jan Mostaert - Landscape with a Scene of the Conquest of America↗ Kanizsa triangle.↗ Depiction of aurochs, horses and deer - Lascaux Cave Painting, 17-20,000 years ago↗ Aerial photograph of the National Security Agency, 2013↗ Gravitational light deflection at a neutron star. Due to relativistic light deflection more than half of the surface is visible. Neutron star mass: 1, neutron star radius: 4, All values are in natural units . Patches on the chequered surface: 30 degrees by 30 degrees.↗ The three reactors of Olkiluoto Nuclear Power Plant in Eurajoki, Finland.↗ Photo of an Olmec Jade Mask taken at the museum of Anthropology of Xalapa Vera Cruz, 1200 - 400 BCE↗ Imperial Coat of Arms of Iran under the Pahlavi Dynasty.↗ NRC Image of Fuel Pellets ready for Fuel Assembly completion.↗ Artistic depiction of a phosphene, entoptic phenomenon characterized by the sensation of seeing light, caused by mechanical, electrical, or magnetic stimulation of the retina or visual cortex.↗ Picture of a CD plastic cover between a polarizer and a flat screen monitor. The flat screen light is polarized, so the birefringence of the plastic layer shows colored fringes after the polarizer. Also called Photoelasticimetry or Photoelasticity.↗ Photoelastic experiment to validate the stiffener model. Isochromatic fringe patterns around a steel platelet in a photo-elastic two-part epoxy resin.↗ Tension lines in plastic protractor seen under cross polarized light.↗ Robert Plutchik's Wheel of Emotions.↗ Optical lattices use lasers to separate rubidium atoms (red) for use as information bits in neutral-atom quantum processors -- prototype devices which designers are trying to develop into full-fledged quantum computers.↗ Ring-billed gull and a rainbow over the Niagara River↗ Saltwater Crocodile (Crocodylus porosus) This is Maximo, a 15'+ crocodile at the St. Augustine Alligator Farm.↗ Detail of Raphael's impression of Euclid, teaching students in The School of Athens (1509–1511)↗ Olmec; Figure; Ceramics-Sculpture↗ Self-similarity in the Mandelbrot set shown by zooming in on a round feature while panning in the negative-x direction.↗ Started with random pixels. Simulated annealing by swapping pairs of pixels, fast cooling (was probably actually just steepest decent...) Similar colour pixels attract at short range, repel at slightly less short range.↗ Started with random pixels. Simulated annealing by swapping pairs of pixels, slow cooling Similar colour pixels attract at short range, repel at slightly less short range.↗ Small stellated dodecahedron↗ Sphere wireframe - orthogonal projection of a sphere. The image shows lines, which are drawn as they were painted onto the surface of a sphere.↗ After having seen a plaza using Texas-shaped flagstone tiling many years ago, I decided to reproduce this tessellation. I created this in OpenSCAD. The Texas shape is a 12-sided polygon.↗ A recreation of the interleaved random and pleasing pattern of a Thinking Machines CM-5 computer 16x32 LED panel. The pattern alternates vertically between 4 rows moving to the left and 4 rows moving to the right. The probability for an LED to be on is 25%. This kind of light pattern was also seen in Jurassic Park (1993) where a CM-5 was installed in the park's control room.↗ New York skyline, looking south at dusk. Very tall building on extreme left is the Chrysler Building; very tall building on extreme right is Empire State Building↗ Troops of the Eight-Nation Alliance, 1900, by by Captain C.F. O’Keefe; Colorized by Julius Jääskeläinen.↗ Toronto, Canada, seen across Lake Ontario at twilight. Taken from the end of the pier at Port Dalhousie, Ontario, with Toronto's CN Tower 51 km distant. The ship on the lake is approximately 5-10 km away.↗ A sculpture after a drawing by Escher, it is a stellated dodecahedron. It can be found on the campus of Twente University in front of the 'Mesa+' building.↗ Vasarely Denkmal in Pecs, 4. April 2009↗ Photos of the Weavers during the Ruby Ridge Siege which would leave 3 dead, two of the Weavers and one U.S. Marshall. Due to the mishandling of this situation, the American Militia Movement would rise, leading to the 90s wave of domestic extremism. (1992). This photo was taken about an hour before the shoot-out and was filed as a court record in U.S. v. Weaver.↗ A white light 'Rainbow' transmission hologram. There is no 3D illusion when the hologram is rotated through 90°, but there is the advantage that the image can be viewed without the need for a coherent light source such as a laser.↗ Shop just before Japanese were evacuated from Little Tokyo, Los Angeles, California, by Clem Albers, April 1942↗ Frequency dispersion of surface gravity waves on deep water. The red square moves with the phase velocity, and the green circles propagate with the group velocity. In this deep-water case, the phase velocity is twice the group velocity. The red square overtakes two green circles, when moving from the left to the right of the figure.↗ Gaussian quantum wave packet superposition in 1D.↗ An illustration of the Weber-Fechner law. On each side, the lower square contains 10 more dots than the upper one. However the perception is different: On the left side, the difference between upper and lower square is clearly visible. On the right side, both squares look almost the same.↗ Yello River, China↗ SEM photo of diatomaceous earth↗ Frenel's zone plate with sinusoidal transparency.↗ Landscape of the city of Pripyat with a view of the Chernobyl nuclear power plant, reactor, the fourth power unit and a Chornobyl New Safe Confinement↗"
