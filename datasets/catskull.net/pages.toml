title = "A Mind Forever Voyaging"
description = "Update Aug. 1 2023 I contacted Steve Mertzkey via email recieved confirmation he wrote this short story: “Hi – Yes, I wrote the short story in the AMFV package.”"
full_description = "Mar 15 2022 A Mind Forever Voyaging Update Aug. 1 2023 I contacted Steve Mertzkey via email recieved confirmation he wrote this short story: “Hi – Yes, I wrote the short story in the AMFV package.” Below is a transcription of a short story that was included in the retail box for A Mind Forever Voyaging, an interactive fiction released by Infocom in 1985. The game is unique from most other interactive fictions in that there is no real puzzle solving, instead the player is tasked with simply observing the environment around them. You control PRISM, an artificial intelligence developed to simulate the future, observe, and report back. I have never personally played much of the game, but I’ve been fascinated by the concept for quite some time. The text of this short story is surprisingly uncommon online, so I thought I’d post it here if nothing else for my own archive and reference. A MIND FOREVER VOYAGING Perry Simm was four years old when he became lost in the largest department store in the city. He let go of Mother’s hand to pick up the video cube. He rotated it with wonderment, touching the control knobs and squealing with delight as the images shifted. His brother Clave, Perry’s senior by three years, bounced impatiently in the aisle. “Mom,” he whined, “they’re going to be sold out of the new Skydiver disc, and you promised I could get one.” “Be patient. Clave,” admonished Mother, but across the floor she could see long lines at the Simulation Discs counter. There were stops at the Foodville and the O-Link repair shop still to go. She made a hasty decision. “Perry, Clave and I are going to another department. I want you to wait right here until we get back.” “Okay,” he said, without looking up from the cube. A few minutes later. Perry discovered the selector panel, but while trying to open it he dropped the cube onto the hard plasticrete floor. The six screens flashed brightly and then faded to darkness. Perry became frightened and looked around for Mother. She was nowhere in sight. Fear of discovery and punishment welled up inside him, and in his desire to get away from the broken cube he forgot about the order to stay put. He wandered to the end of the aisle, and spotted Mother a short distance away, rummaging through a bin of myalon vests. As he ran toward her, he realized that it was just a stranger with only a vague resemblance to Mother. Fighting back tears, he decided to return to the spot where the broken cube lay. He wandered down the aisles, each lined with tall shelves of glittering merchandise, and after several confused minutes discovered that he was completely lost. He had no idea how to find Mother, and he had no idea how to find the spot where he had last seen her. He was alone, abandoned. Strangers, huge and terrifying, jostled past. Walls of boxed appliances towered above him. Fear and despair won the battle for his emotions, and he began to cry. After an endless time, during which a lot of strangers had asked a lot of questions which he’d been too confused or too frightened to answer, he found himself in a small, quiet room. The door opened, and Mother came in, scooping him up into her arms. He cried again, burying his face into the warmth of her loving embrace. Abraham Perelman and Aseejh Randu waited in the plush Main Conference Room overlooking the Control Center. Through the window-wall, Perelman could see dozens of technicians, busily preparing for today’s big event. For the umpteenth time he felt thankful to have such a superb, competent team. It was a far cry from the early days, when he had to keep on top of every detail. Perelman glanced over toward Randu, and noticed his friend’s nervousness. “Don’t worry, Aseejh, it’s no big deal. I met him once before, at a social affair in Washington, and he’s an easygoing guy.” “Yes, I have heard that.” A smile tugged at the comers of the Indian’s normally stony face. “But after speaking with Vera, he could very well be whipped into a frenzy!” Vera Gold was the Chief Administrator of the Project. “Nonsense,” Perelman scoffed. “She’ll turn on the charm for him. She saves her venom for underlings like us.” ‘True,” agreed Randu. “By now, she has probably taken credit for the entire project, to say nothing of the inventions of molecular memory and the artificial heart.” A door opened at the far end of the long room, and a few Secret Service agents walked in, followed by the Vice-president, Vera Gold, several aides, and more Secret Service agents. “…speak for the entire staff,” Gold was saying, “when I say what a tremendous honor and pleasure it is that you could attend today.” “Pass me a barf bag,” whispered Perelman to Randu. “You underrate the importance of this Project, Ms. Gold. The President and many other important people have a keen interest in this experiment. As you know, it’s quite an uphill battle against public opinion if we’re to deter Senator Ryder and his Plan.” The retinue had almost reached Perelman and Randu. Vera said, “I hope we can live up to your expectations. And now, despite all your wonderful compliments, I really must share some of the credit with these gentlemen here. Dr. Abraham Perelman and Dr. Aseejh Randu. I don’t want to bore you with technical details, but basically Dr. Randu is our hardware man and Dr. Perelman is our software man.” As the Vice-President shook their hands warmly, Perelman fumed at Gold’s demeaning description. It was THEY who had started the Project, THEY who had… “We’ve met before. Dr. Perelman, haven’t we?” the Vice-President was asking. Perelman nodded. “At an NESR banquet two years ago.” “I remember it well. I think we discussed baseball standings. Later, I learned that you were an expert in AI. Perhaps I can make up for my ignorance then by asking you to give me a brief overview now. I find the entire field fascinating.” “It would be my pleasure, Mr. Vice-President,” Perelman responded. He grinned to himself as he noticed Gold giving him one of her best “keep in your place” glares. “I think we really ought to begin the tour…” Gold insinuated. Perelman turned to Gold, smiling sweetly. “I’m sure I can answer the Vice-President’s request as we go.” Turning back to their guest, he said “Did you know that the first serious work in artificial intelligence was done around the middle of the twentieth century?” Perry Simm was six years old when he was bullied on his first day of elementary school. So far, it had been a day of strange, confusing images: Mother and Lather waving goodbye as he boarded the huge yellow bus, the older children with badges herding everyone down the long hallways lined with colorful nubbly tiles, the friendly Ms. Borne writing her name on the whiteboard, the boxes of brand-new crayons, the frightening hugeness of the school auditorium. Perry was cutting shapes out of colored construction paper when a funny sound filled the room, and Ms. Borne told everyone that it was time to go home. He barely remembered to grab his lunchbox, the brand-new one with the pony pictures all over it, and the red hat that Grandma had knitted. Then, confusion in the hallways again. One of the older children with a badge, who Perry had learned were called Monitors, asked him for his bus route number. “Seven,” he said, confidently. Mother had drilled the number into him. Soon Perry was standing on the sidewalk with a group of other children. He looked around, but didn’t see anyone from his class. Everyone seemed to be older and bigger than Perry. Slowly he realized that someone from behind was talking to him. “Hey! Hey, you with the red hat!” Perry turned around, and found himself facing three older boys. Two of them were wearing Monitor badges. “That’s a great hat, runt,” said the tallest of the three. “Where ‘d you get it?” “Grandma,” replied Perry, confused by their amusement. “Hey,” one of the older boys shouted over Perry’s head, “look at Grandma’s boy here, wearing a hat in September!” “What are you going to wear in December, runt, a spacesuit?!” The boys laughed again, and Perry began to get a funny feeling deep in his chest. “And look at this lunchbox!” said the third of the boys. “What pretty ponies, huh?” “Hey, Grandma’s boy, do you like ponies?” The tallest boy suddenly reached out and grabbed Perry’s hat. “What’ 1 1 Grandma say if you come home without your hat, huh?” “Gimme that,” shouted Perry, tears beginning to spill down his face. “Look, the runt’s a crybaby! The runt’s a crybaby!” Suddenly, through the tears. Perry became aware of a grown-up standing between him and his tormentors, speaking sternly. A moment later, the man was leading Perry away down the street. “What’s your name, little fella?” asked the man. He had a friendly voice, and as Perry began to wipe away his tears he saw that the man had a friendly face as well. He was carrying Perry’s hat in one hand, and a hefty pile of books in the other hand. “Perry,” he answered, still sniffling a bit. “Well, Perry, everything’s okay now. Why don’t you come in, and we’ll see if we can’t fix you up with some milk and cookies.” The Vice-President glanced at the rows of data banks in the Simulation Controller area, and turned back to Perelman. “Please go on. Your history lesson on AI is fascinating.” Perelman took a deep breath. “Ummm…A major breakthrough in the field came with the realization that the computer and the human mind worked in fundamentally different ways. Computers stored and analyzed data numerically, while the human mind stored and analyzed data symbolically. “You see, computers generally solve problems using algorithms, rigorous step-by-step procedures that are usually mathematical in nature. For example, a program to play the card game Poker would calculate the odds for all possible hands in the current game before making a bet. A person in the same situation couldn’t possibly consider every possible combination of cards, and would have to make a decision based on such factors as experience, judgment, intuition, and rules-of-thumb. This is called the heuristic method of problem-solving.” The tour reached the long tunnel leading to the office wing of the complex. The Vice-President preceded Perelman onto the moving walkway. “By developing methods for computers to solve problems heuristically,” Perelman continued, “the pioneers in Artificial Intelligence soon had developed programs that imitated human problem-solving in very specific areas, such as playing chess, diagnosing diseases, or translating text from one human language to another. These ‘expert systems,’ as they were known, were superb within their area of expertise, and in many cases even improved themselves by ‘learning’ — adding knowledge based on their own experience.” “The political fund-raising telecomputer we use works in that way,” commented the Vice-President. “A good example! These expert systems grew progressively broader and more sophisticated, impressively mimicking human learning and behavior. But!” said Perelman, pausing for dramatic emphasis, “That is precisely ALL they could do.. .mimic! The spark of intelligence was missing. Scientists in the AI field were still distant from that almost mystical goal of creating a computer that could act creatively, that would be aware of its own existence, that would truly be a thinking machine!” Perry Simm was ten years old when he decided that he wanted to be a writer. It was a warm day, probably the warmest so far this spring, so they were sitting on the kitchen veranda, overlooking Rav and Frita’s beautiful wooded backyard. A skycar whizzed over the woods, shattering the peacefulness of the afternoon. “I hate skycars,” said Perry. “They’ve just about finished installing an auto-controller system for the whole city,” said Frita, “and when that’s done they say that skycars will be as common as regular cars are now. How’s the cake. Perry?” “Yum as always. Aunt Frita!” said Perry, licking the last crumbs off the plate. “You ought to have a piece. Uncle Ray.” Ray and Frita weren’t really Perry’s aunt and uncle, but he’d been calling them that ever since that day, years earlier, when Ray had rescued him from a gang of bullies on his first day of school. Almost every day, he would stop by on the way home from school for some of Frita’s home-made croissants and jam, or angelcakes, or pudding. Ray was a writer, and he was fond of saying, “A writer must be, first and foremost, a reader.” He was always giving Perry books to read, and discussing them with Perry afterwards. Perry was easily the best reader in his grade; in fact, he was probably the best student overall. “So what did you think of ‘Lasemight’?” asked Ray, resting his hand on the thin volume. “It was great! Definitely one of the boffest books you’ve ever given me. I read the dragonhunt part three times!” “The dragonhunt chapter is classic,” agreed Ray. Perry furrowed his eyebrows slightly. “It still feels funny to read without any pictures, but I think I’m getting more used to it. Do you have anything for me today?” “Well, I’ve got something special to give you today, if you’re interested.” He reached into his pocket and unrolled a sheaf of paper. “It’s something I’ve just written; you’ll be the first person to ever read it.” Perry bounced in his chair with excitement. “Wow! I’ve never read anything you wrote before!” “Everything I’ve ever written up to now was meant for adults. But this…” Ray paused, organizing his thoughts. “Whenever I write, I have an image in my mind of whom I’m writing for. When I wrote the collection of poems called ‘Apriltime’ I thought of Frita as my audience. And with ‘A Child’s Vision’ I imagined the President reading it as I wrote each word.” He tapped the manuscript is his hand. “When I wrote this, you were my mental audience.” An hour later. Perry lay on his bed and picked up the first sheet of the manuscript with trembling hands. The pages seemed to vibrate with magic, and as he began reading, the magic flowed out of the story and surrounded him. His bedroom vanished in a haze of images and excitement. A brief moment and an eternity later, the story was done, but before the world around him quite settled back into place. Perry knew that, more than anything else, he wanted to be a writer. “In the middle of the 1990’s, work began in earnest to create true machine intelligence. The same methodology was used by several groups, most notably the group at MIT and Japan’s ZOSO Project.” Perelman’s throat felt dry. He wondered if he was being long-winded, but the Vice-President seemed quite attentive. “That methodology was as simple in theory as it was complex in practice: Design a computer with the capacity of a human brain, that stores and processes information just like a human brain. Then program that computer with all the knowledge and experience that a human would absorb from birth to maturity. You’d end up with something that was an exact replica of a human mind, and would therefore, like humans, be sentient. “These groups pro"
