title = "👍 Likes 2.0 (feat. Web Components)"
description = "Last March, I released my first experiment in post-centralized social media called “Likes”. The idea was simple - an image you can click to leave a Like on the page:"
full_description = '''Oct 22 2024 👍 Likes 2.0 (feat. Web Components) #cloudflare #html #javascript #likes #programming #replies #web #web-components Last March, I released my first experiment in post-centralized social media called “Likes”. The idea was simple - an image you can click to leave a Like on the page: Since then, you’ve left over 5,000 Likes across 800+ pages! I’ve been hard at work with my next experiment, Replies, which brings the principles of decentralization to web comments in addition to fully encompassing Likes. Today I’m proud announce that Likes is now a web component! 🙌 const copyToClipboard = (el) => { const rawText = el.getElementsByTagName('pre')[0].textContent const link = el.getElementsByTagName('a')[0] const originalText = link.innerText if (rawText.length && link) { navigator.clipboard.writeText(rawText) link.innerText = "Copied!" setTimeout(()=>{link.innerText = originalText},2000) } } Put this HTML anywhere: You need JS to Click to copy <page-likes></page-likes> <script src="https://catskull.net/public/js/components/likes.js"></script> Here’s what it might look like on your website: 🔒 www.geocities.net/alien-research-group.html 🌎 </> This is the markup it outputs to your page: <page-likes> <a><span>400 Likes</span></a> </page-likes> There are no analytics, tracking pixels, IP logs, or other creative evils at play here. Your Likes are stored in a D1 Database on Cloudflare. Don’t trust me to maintain your Likes? You shouldn’t! Paranoid about importing 3rd party JavaScript? You should be! Fork the code, host it yourself, re-implement it from scratch on GitHub. I’ve updated the worker to flatten out URL params. HTTPS is also now required, but the component still works fine for testing. I hope you continue to leave Likes and Replies.'''
