["https://catskull.net/history-and-overview-of-graphics-apis-on-apple-macos.html"]
title = "History & Overview of Graphics APIs on Apple MacOS"
description = "On June 22, 2020, in the midst of a worldwide pandemic and lockdowns, Apple CEO Tim Cook announced that Apple would begin a 2-year transition to move their desktop computers away from Intel-produced x86-64 microprocessors to their own design based on ARM’s 64-bit architecture1. When the first M1 MacBook Air was released a few months later, I couldn’t resist. Having been very underwhelmed by the Intel chip’s performance in my MacBooks, despite being high-end options (anyone remember “fans going to 11”?), this was, from my perspective, the single greatest leap in personal computer performance in my lifetime. It seemed almost impossible how much performance you could get out of a chip at such low power. I eventually traded in that base model (only 8GB RAM!!) for a 14” M1 Pro (16GB/512GB). The 14” MacBook Pro is the single best computer ever made. Apple CEO Tim Cook announced a “two-year transition plan” to Apple silicon on June 22, 2020. ↩"
full_description = "Apr 1 2024 History & Overview of Graphics APIs on Apple MacOS On June 22, 2020, in the midst of a worldwide pandemic and lockdowns, Apple CEO Tim Cook announced that Apple would begin a 2-year transition to move their desktop computers away from Intel-produced x86-64 microprocessors to their own design based on ARM’s 64-bit architecture1. When the first M1 MacBook Air was released a few months later, I couldn’t resist. Having been very underwhelmed by the Intel chip’s performance in my MacBooks, despite being high-end options (anyone remember “fans going to 11”?), this was, from my perspective, the single greatest leap in personal computer performance in my lifetime. It seemed almost impossible how much performance you could get out of a chip at such low power. I eventually traded in that base model (only 8GB RAM!!) for a 14” M1 Pro (16GB/512GB). The 14” MacBook Pro is the single best computer ever made. I am very interested in emulation - specifically, the huge advancements that have been made in emulating Xbox, Xbox 360, Wii U/Switch, PS2/3, and even regular old x86 via PCem or 86Box. I grew up playing NESticle, SNES9x, DOSBox, Project64, and others. I spent a summer in middle school softmodding an OG Xbox and installing various emulators on it. In many ways, I think I could credit the concept of emulation for the success I’ve had as a professional software engineer. However, as an adult, I haven’t had any Windows computers to play games on because I use Mac. Gaming on Mac has historically been pretty terrible. I remember playing Bioshock Infinite on my specced-out 2013 15” MBP and I seriously thought it was going to melt or warp somehow due to how hot it got. There were a few highlights with Mac ports such as OpenEmu and StarCraft, but for the most part, we’re in the dark. I actually bought an Xbox One but found it too hard to use - I only have time to play infrequently, and every time I turned it on, it would need hours to update. So when the transition to Apple Silicon happened, we finally had enough compute power to do some pretty decent gaming. This has resulted in a lot of additional interest in using that compute power for emulation. Turns out, thanks to a lot of mostly thankless work by some developers whom I aspire to be, you can get really great emulation performance out of even base model chips. We’ve also had some first-party AAA games launch natively on MacOS, including Death Stranding, Resident Evil 4, and Assassin’s Creed Mirage. I find it hard to believe that just 10 years ago the best MacBook you could buy would experience a nuclear meltdown playing a not even that new of a game. As I’ve researched and configured various modern emulators, I have become fascinated specifically with the history of Apple’s use of graphics APIs. I’ve spent countless hours reading the various excellent Wikipedia pages about all of these libraries, APIs, companies, and their histories. I thought I’d compile this knowledge into a single article. I will do my best to reference the related Wikipedia pages or direct sources where applicable. Below I’ve created a chart depicting the rough timeline of computer graphics APIs in general, but specifically as they relate to Apple’s use. ┌───────────────╖ │ 2024+ ┅ ║ 𝘛𝘪𝘮𝘦𝘭𝘪𝘯𝘦 𝘰𝘧 𝘊𝘰𝘮𝘱𝘶𝘵𝘦𝘳 ├───────────────╢ 𝘎𝘳𝘢𝘱𝘩𝘪𝘤𝘴 𝘈𝘗𝘐𝘴 │ Translation ║ │ APIs ║ │ ║ ┌───────────────╖ │ AAA Games ◀────┤ 2023 ┅ ║ ╘═══════════════╝ ├───────────────╢ │ D3DMetal/ ║ ┌───────────────╖ │ GPTK ║ │ 2022 ┅ ╠════▶ ║ ├───────────────╢ ╘═══════════════╝ │ Metal 3/ ║ │ MetalFX ║ ┌───────────────╖ │ ◀────┤ 2020 ┅ ║ ╘═══════════════╝ ├───────────────╢ │ Apple ║ │ Silicon ║ ┌───────────────╖ │ ║ │ 2018 ┅ ╠════▶ DX12 Ultimate ║ ├───────────────╢ ╘═══════════════╝ │ OpenGL ║ │ deprecated ║ │ ║ │ MoltenVK ║ ┌───────────────╖ │ Open Sourced ◀────┤ 2016 ┅ ║ ╘═══════════════╝ ├───────────────╢ │ Vulkan ║ ┌───────────────╖ │ ║ │ 2015 ┅ ╠════▶ MoltenVK 1.0 ║ ├───────────────╢ ╘═══════════════╝ │ ║ │ DirectX 12 ║ ┌───────────────╖ │ ◀────┤ 2014 ┅ ║ ╘═══════════════╝ ├───────────────╢ │ ║ ┌───────────────╖ │ Metal ║ │ 2001 ┅ ╠════▶ ║ ├───────────────╢ ╘═══════════════╝ │ MacOS X ║ │ with OpenGL ║ ┌───────────────╖ │ ◀────┤ 1996 ┅ ║ ╘═══════════════╝ ├───────────────╢ │ ║ │ Direct3D ║ ┌───────────────╖ │ (DirectX 2.0) ║ │ 1995 ┅ ╠════▶ ║ ├───────────────╢ ╘═══════════════╝ │ Windows Game ║ │ SDK ║ │ (DirectX 1.0) ║ │ ║ │ Apple ║ ┌───────────────╖ │ Quickdraw 3D ◀────┤ 1992 ┅ ║ ╘═══════════════╝ ├───────────────╢ │ ║ ┌───────────────╖ │ OpenGL 1.0 ║ │ 1982 ┅ ╠════▶ ║ ├───────────────╢ ╘═══════════════╝ │ Silicon ║ │ Graphics ║ 2024 catskull │ IRIS GL 1.0 ║ CC BY-SA ╘═══════════════╝ In the beginning, there was Silicon Graphics (SGI). They developed the first graphics-specific API as IRIS GL in 19822. Despite dominance in the PC space, large competitors such as IBM apparently skipped their geometry classes. Instead of innovating on their own, industry partners eventually pressured SGI to open source a version of their IRIS GL as OpenGL 1.0 in 19923. One afternoon in 1994, Bill Gates rolled out of bed, jumped in his imported 1983 Toyota AE86, and thought to himself, “If I can’t own computer graphics, I don’t want to be alive.” Windows was getting ready to launch, and he didn’t have anything for gaming. Luckily, unbeknownst to him, a couple of really smart Microsoft engineers were casually working in their free time on some graphics stuff for gaming. It was pretty chill; they named their work the “Manhattan Project” because they wanted to drop a nuke on the stranglehold Japanese companies had on video games. The project was released in 1995 as “Windows Game SDK” 4. Everything was great until Bill Gates showed up at the ‘95 Game Developers Conference in his ‘86, and Hideo Kojima ran up to say how much he loved the car (being a huge fan of the anime). But it turns out Bill Gates didn’t even watch Initial D - HE JUST SAW THE CAR ON A CALENDAR IN THE OFFICE - so everyone in the industry thought Microsoft was pretty lame for a while. Until one night, Bill Gates called John Carmack at like 3am or something and literally begged him to let Microsoft port Doom to Windows. Finally, after (I swear) an hour, John just said ‘fine’ and hung up. Bill Gates with his AE86┅ Here’s where the story gets really crazy. One of the biggest gamers of all time worked for Bill - Gabe Newell. Gabe had been a producer for Windows OS releases for the last 13 years, but when Doom came out only on MS-DOS, he felt like a complete joke. “If I can’t game on Windows, I game what on can?” he said to himself. So one day, Gabe walked past Bill’s office and happened to see him playing Doom. Being an out-of-character cool move for the otherwise snail-like Gates, Gabe decided to investigate. Apparently, Bill could not even get past the first level of Doom. Gabe could tell Bill had been crying but decided to just let it slide. After Gabe showed Bill that the green stuff on the ground was acid and killed you, he showed him the secret chainsaw, and Bill had a lot more fun with that. “Hey, you’re pretty good at games for being a janitor - was it Grape?” Bill said disinterestedly. “John Carmack called me last night crying about how they were trying to port Doom to Windows but our graphics API is so advanced (he specifically said it was better than anything SGI has ever made) they were having trouble, so I told him I could probably take care of it this weekend for him. I’m totally just going to blow him off though; this game isn’t even fun, and I’ve been playing for 9 hours straight.” Gabe walked out of Bill’s office and went to tell the two smartest engineers he’d worked with on Windows about how bad Bill sucked at Doom. “I could literally frag him while AFK. He was getting killed by the acid, ffs!” It came up during the conversation about how John was crying about Windows, so the three of them took a peek under the hood, and it turns out they could port it pretty easily to Windows, probably only a week or two. However, they’d just released Windows 95 and had capped out their bonus for the year, so they decided to take the rest of the year off playing Doom and making fun of Bill Gates behind his back5. Bill Gates pretending to play Doom┅ In August of 1995, Gabe remembered they had ported Doom to Windows and he sent the files back to John Carmack. It was released as technically the first DirectX game. After it came out, Bill totally tried to pretend he loved Doom. He made a bunch of commercials starring himself, talking about how good he was at Doom6. Already chafed, Gabe overheard someone talking about how Bill didn’t even know what Initial D was and decided that was the last straw. One of Gabe’s friends had recently quit Microsoft after years of that kind of BS to work at id Software on Quake and kept emailing Gabe pictures of cool cars to make him jealous. It worked. Gabe called up his buddy Mike and said, “You ready to blow this joint?” “I’m in,” Mike replied. They named their new company Valve7. “A Valve? You can’t even see through that!” exclaimed Bill Gates when he heard the news. Rebuffed and desperate to make up for his huge faux pas at last year’s GDC, Bill went all out for GDC 1996. He showed up wearing a toga in a chariot pulled by actual lions (is that technically even legal?). Luckily, his team had a secret weapon: Direct3D. Direct3D is a component of the DirectX suite of game development tools and was designed to compete directly with OpenGL. Most people thought the tech was pretty cool, but the lions weren’t enough to make up for the Initial D mishap, so a lot of people were still hesitant to use Direct3D over the open-source OpenGL. Nevertheless, Microsoft made a video showing Bill Gates pretending to play MechWarrior against Charles Barkley over the internet, so a lot of people thought that was cool and decided to use Direct3D8. WaterRace for Mac OS┅ Meanwhile, Apple was going through some strong emotions. They were feeling a little left out with all this graphics business, so they released their own graphics API - QuickDraw 3D, powered by a low-level RAVE rendering engine9. This is a lot of names to call something pretty much nobody cared about. Apparently, there were ports of Quake and Unreal10 and this cool game called WaterRace, which is now open source11. In 1999, Steve Jobs took a heroic dose and realized he could combine NeXT and Apple to make a cool new operating system called “OS X,” but a pillar of fire appeared and forbade him from using QD3D, so he had to go with OpenGL12. Then these weird guys from Chicago named “Bungie” showed up talking about some “Halo” game they were going to make, so Steve told them it would be chill if he announced the game as coming to the new OS at Macworld 1999. By the time it actually released two years later, Bungie had entered an exclusive agreement with Microsoft to debut Halo on the Xbox13. Steve Jobs hated video games ever since14. Half-Life┅ In November 1999, Valve released their first game: Half-Life15. Exclusively for Microsoft Windows and built using Direct3D16. It sold a bajillion copies17. Over the following two decades, Microsoft would continue to develop and support DirectX, porting it to their Xbox platform as DirectXbox18 and generally dominating the PC gaming sphere19. OS X ended up being a pretty popular consumer desktop platform, eventually building a small but significant minority share in the overall PC OS market20, monopolized by Microsoft21. Valve made a few more hit games22, and Gabe ended up battling a balrog for 1000 years but was resurrected as “Gaben.” Gaben created a distribution platform for Valve’s games called “Steam23.” By the late 2000s, Steam had become the de facto solution for PC game distribution and largely solved piracy thanks to being mostly DRM-free24. Occasionally, Steve Jobs would troll Gaben by pretending to care about gaming but never really did anything to make it happen25. Crysis on a MacBook Air┅ Over Thanksgiving 2009, Gaben’s niece was visiting from college and asked him to help her get Crysis running on max settings on her 11” MacBook Air. Gaben took a look around to see what games were available on Mac and, after playing SuperTuxKart for 8 seconds, immediately decided he couldn’t live in a world where Mac users were subjected to such horrific gaming. Even though Steve Jobs was still kind of a jerk, Gaben knew that as the one true gaming messiah, he needed to bring gaming to the masses. Valve released Steam on macOS and started porting all their games to Mac. All purchases were cross-platform; if you owned the Windows version, you got the Mac for free. Portal 2, released in 2011, was the first Valve game with both native Mac and Windows ports at launch26. Not that it ran very well on Mac, but, I mean, technically it was pro-gaming. A big part of the reason Steve Jobs trolled Gaben so much was that his iPhone thing was a really big deal. Everybody knew it, especially Bill Gates27, and especially Steve Ballmer28, who had a bright career ahead of him as a basketball team owner and not as a technology CEO29. That success allowed the Apple beehive to do its thing and start efficiency optimizing everything, which resulted in them acquiring companies30 to design their own iPhone SoCs in-house. Starting in 2010 with the iPhone 4’s A4 processor, all subsequent iOS devices, including iPad, Apple TV, Apple Watch, HomePod, AirPods, etc., have used so-called “Apple silicon31.” This level of vertical integration is topped probably only by Samsung because they are the fab. In fact, Samsung manufactured that first A4 and is still a constant silicon fabrication partner for Apple32. In 2011, Steve decided he was ready to do something else for a while, so he called up his good buddy Tim Cook and told him he needed him to be the CEO of Apple for a while. “But what if I don’t know what to do?” Tim asked Steve. “Just follow your heart, like you did when you were at Compaq. Remember that, Tim?” “Yeah, I remember,” Tim replied33. Steve had a lot of great reasons to choose Tim as well - he had somehow navigated the insanity of the 00’s era Apple product launches and kept those iDevices on the shelves. Remember when you couldn’t buy a Wii for a year?34 Remember how you still can’t really buy an Xbox or PlayStation? In late September 2011, Steve Jobs called Gaben on the phone. “Listen,” Steve said, “I want you to know that I really respect the work you’ve done in PC gaming. You took the success of a platform like iTunes and fixed the entire gaming market. If I had a few more years, I’d love to work together on some fun stuff.” “Don’t worry, Steve,” Gaben replied, “I get it. Just so you know, my first computer was an Apple II.” “Oh wow,” Steve replied. Turns out, Steve was right about Tim Cook. There was this creepy guy who’d always kind of just hang around creepily at parties and stuff named Larry Ellison who went all on the news saying Apple would tank because it tanked the last time Steve Jo"
