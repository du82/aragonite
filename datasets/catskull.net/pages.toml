title = "Now served with valid HTML"
description = "I was reminiscing about the cool HTML validator tags that used to be everywhere online, so I decided to run this site (and gizzhead.org) through the W3C’s validator. Turns out, I had some issues!"
full_description = "Jun 12 2024 Now served with valid HTML #html #programming #web-development I was reminiscing about the cool HTML validator tags that used to be everywhere online, so I decided to run this site (and gizzhead.org) through the W3C’s validator. Turns out, I had some issues! The core reason to run your HTML documents through a conformance checker is simple: To catch unintended mistakes—mistakes you might have otherwise missed—so that you can fix them. Why Validate? - W3 validator about page My issues: trailing slash on void elements (meta, etc) alt text on a tags (???) random invalid attributes like aria, role, etc invalid time format for time tags (timezone wrong format) I got them cleaned without too much trouble. Turns out, the W3C knows what they are talking about. I caught a lot of random unintended mistakes! Some of them were trivial, some of them bloating, but all were very helpful as I continue to learn basic HTML."
