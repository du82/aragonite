["https://catskull.net/games-i-played-in-2024.html"]
title = "Games I played in 2024"
description = "I claim to not play very many video games, but apparently that is not true because I not only played some games last year, but beat 29 of them! When I say “beat”, I mean I got to a credits screen. I did not complete any of these games. I also put significant time into a few games that I did not beat for whatever reason; hopefully they make it onto a future list!"
full_description = "Jan 3 2025 Games I played in 2024 #games #meta I claim to not play very many video games, but apparently that is not true because I not only played some games last year, but beat 29 of them! When I say “beat”, I mean I got to a credits screen. I did not complete any of these games. I also put significant time into a few games that I did not beat for whatever reason; hopefully they make it onto a future list! Castlevania Nintendo Entertainment System [1986] | Konami | Nintendo wiki↗ 1/3/24 I’m a big fan of Symphony of the Night but I’ve never bothered to play the original. It’s a good platformer! The trick I’ve learned with playing these old games is to cheat. I use savestates and fast-forward and rewind at will. Dracula is too hard! Castlevania: Aria of Sorrow Game Boy Advance [2003] | | Konami wiki↗ 1/4/24 Shorter than expected. I meant to continue on to the Nintendo DS sequel but got distracted, apparently. Conquests of the Longbow DOS [1991] | Sierra On-Line | Sierra On-Line wiki↗ 1/8/24 I’m a big fan of Sierra’s VGA-era games. I’ve had this game on my radar for about the last 20 years but never had a chance to get it running. Luckilly ScummVM exists and works great on the GOG version of the game. You know at least some of that money is going to Ken Williams on a yacht somewhere! Has some interesting multi-solution puzzles that theoretically would increase the replay value. I mostly followed a walkthrough. I like Robin Hood and overall this game was worth the few hours it took to get through. Photo courtesy of AdventureGamers.com Quest for Glory 1 (VGA) DOS [1992] | Sierra On-Line | Sierra On-Line wiki↗ 1/8/24 This is one of my all time favorite games. A VGA point-and-click adventure game with RPG elements. It has 3 classes: Fighter, Theif, and Wizard. Each class has a unique solution to each challenge, which for the fighter includes grinding and fighting your way through most things. I know the game fairly well but still get thrown off now and then. Quest for Glory II Remake PC (ScummVM) [2008] | AGD Interactive | AGD Interactive wiki↗ 1/9/24 Being a young fan of Quest for Glory, I was never able to make a single step of progress in it’s sequel due to an insane maze-like design of the city. I assume ol’ Kenny wanted to make sure each player had their manual and absolutely did not pirate the game. I stumbled on this project sometime in 2005 and eagerly followed it’s development until it finally released in 2008. Revisiting in 2024, it didn’t hold up quite as well as I remembered, but it’s still well worth playing. Screenshot courtesy of lutris.net Mario & Luigi: Bowser’s Inside Story Nintendo DS [2009] | AlphaDream | Nintendo wiki↗ 1/11/24 I’m a big fan of the Mario & Luigi series and AlphaDream in general (RIP). In 2023 I’d been working my way through the series and had put this one down and came back to it. I opted for the original as opposed to the 3DS remake because I just love the DS aesthetic - even the unique audio profile of the DS is optimal for me and this game as an original soundtrack by the legendary longtime series composer Yoko Shimomura. Truly some of her finest work. The game itself is fine but I prefer the prequel, Partners in Time. I still have a few more of the 3DS titles to work through but no promises for this year. I did get the new Brothership game for Christmas and so far it holds up nicely. Photo courtesy of mariowiki.com We Love Katamari Reroll Nintendo Switch [2005] | MONKEYCRAFT | Bandai Namco wiki↗ 1/30/24 Despite not actually playing one of the games until Katamari Damacy Reroll came out in 2018, I’ve been a fan of this series since my eyes beheld the glory of the North American PS2 box art in a Game Crazy sometime after 2004. I love this game. Playing a Katamari game gives me the satisfaction of setting up thousands of dominos in a careful pattern and watching them fall. Literally rolling through the carefully placed cities and hearing screams of horror and appendages shaking around lifelessly as your ball grows ever larger fills me with indescribable joy. The entire game can be cranked through in a few hours but it’s roughly the audio-visual experience of a psychedelic trip. Even now, it’s hard to remember for sure if any of it was even real. GoldenEye 007 (XBLA) Xbox 360 (xenia) [leaked 2021] | Rare | N/A wiki↗ 2/9/24 This game rules. Did you know that Rare ported it to the Xbox 360 with updated graphics and proper dual analog controls? We don’t know why but it never saw the light of day until it was leaked in 2021. I was able to get this running on my Steam Deck which was a huge hassle but completely worth it. I think this game is only getting better and better with each passing year. I had fun playing on 00 Agent and essentially memorizing each level. The game was an on-rails shooter for most of the development and I think the level design reflects that, which is not a bad thing. Why is headshotting Soviets with a silenced pistol so much fun? Twilight Princess HD Wii U [2016] | Nintendo EPD, Tantalus Media | Nintendo wiki↗ 3/8/24 I never played this game. The whole vibe was just not my thing, the wolf looked kind of dumb and the whole art direction was just kind of jacked up looking to me. I understand now how much the aesthetic was inspired by the Peter Jackson The Lord of the Rings films, which I also have a newfound respect for. And you know what? Everything does look jacked up. I think that is on purpose. This game is a like a fever dream. But it is so fun. I think it might be the best game of all time. It’s a true sequel to Ocarina of Time. I truly got lost solving puzzles deep in a dungeon. It was very refreshing after getting a little too strong a dose of the Breath of the Wild games. Very recommend. I’ve been meaning to play through Windwaker HD, but maybe I should go back to OoT first… Photo courtesy of someone on the internet https://ibb.co/album/mvmBP9 Songs of Conquest Windows, macOS [2024] | Lavapotion | Coffee Stain Publishing wiki↗ 5/27/24 I was consumed by this game. I convinced my friend’s older brother to let me burn his copy of Heroes of Might & Magic III and I loved the hours I spent at the family computer, taking turns. Songs of Conquest has 4 factions, each with their own 4-level maps. Each map progressively gets more involved, and by the last map of each campaign I was spending several hours to navigate through successfully. I just noticed they released a DLC with a new faction but there’s no campaign associated with it, so I’ll skip that. Kirby’s Dream Land Game Boy [1992] | HAL Laboratory | Nintendo wiki↗ 5/28/24 This might be one of the first games I ever beat. We had this growing up and I can distinctly remember getting to the final stage on our Super Game Boy. That was probably age 5-6. It’s not hard, it’s not long, but it’s a lot of fun. And the music is incredible. I played through on the Nintendo Switch online version, those have been a great way to share these memories with my kids. Star Trek: Voyager – Elite Force PC [2000] | Raven Software | Activision wiki↗ 6/10/24 I consider this to be a “golden-era” PC shooter. It’s running the same forked idTech 3 engine Raven later used for the Star Wars Jedi games. Star Trek rules. Voyager rules too and I really don’t care what anyone else thinks. This has some great original voice acting from all 9 members of the cast of the TV show. They even faithfully recreated the LCARS menu system! I also had fun joining a few multiplayer death matches and joining in the chaos. Star Wars: Shadows of the Empire Windows (DREAMM) [1996/97] | LucasArts | LucasArts wiki↗ 6/17/24 Shadows of the Empire was part of the immense marketing campaign for not only the Nintendo 64’s first holiday season, but the generalized Star Wars hype machine in between the theatrical re-release of the original trilogy and the prequel trilogy. Needless to say, this game was hyped. Unfortunately, it plays like a cube of ice. The physics are insanely floaty and you’ll fly off surfaces. The ship combat is kind of fun but also very janky. Yet despite all of this, this game is fun. It has enough variety packed in, and it’s all just decent enough to not cause rage quitting before you lurch over each new milestone. Star Wars: Dark Forces MS-DOS (DREAMM) [1995] | LucasArts | LucasArts wiki↗ 6/??/24 Aaron Giles’ excellent DREAMM project allows me to play a lot of these awesome LucasArts on my Macbook. Most of which I’ve never played. Dark Forces is first on that list! This game RULES! Consider that DOOM was released during the development of this game, it’s really incredible. The graphics and gameplay is very tight! At it’s core, it’s a first-person plat former though, which is a little frustrating at times. But as a general FPS? I’d probably say this is better than DOOM! Star Wars Jedi Knight: Dark Forces II Windows (OpenJKDF2) [1997] | LucasArts | LucasArts wiki↗ 6/??/24 Like the predecessor, this is really a platformer at heart and I found most of the level design to be frustrating. It’s too bad, the engine is good and it’s fun to take out enemies. I just spent WAY TOO LONG getting turned around in each level. Included are full motion video cutscenes, which apparently included the first lightsaber footage filmed since 1983. But man, the cutscenes are horrific. The acting is so bad. Like, mega-yikes. I started playing the expansion, Mysteries of the Sith but rage quit almost immediately. I may go back to it! Star Wars Jedi Knight II: Jedi Outcast PC (OpenJO) [2002] | Raven Software | LucasArts wiki↗ 7/??/24 The two Jedi Knight games developed by Raven are pretty good. Again, they’re really more 3D platformers than shooters, which isn’t really that big of a problem except when the level design is confusing. I think I’m just bad at video games or something. Still, it’s a solid experience set beautifully in the Star Wars universe. Lightsaber combat is fun. Star Wars Jedi Knight: Jedi Academy PC (OpenJK) [2003] | Raven Software | LucasArts wiki↗ 7/5/24 The fourth and final installment of the Jedi Knight series, and the second developed by Raven. It’s probably the best overall in the series. They dump you straight into the Jedi stuff instead of dangling it in front of you for half the game. It’s the first game in the series where the protagonist is not Kyle Katarn, though he does make an appearance. I found that to be refreshing. I liked the game so much that I installed some mods to play through the campaign as a Jawa Sith named Darth Wootee, including full voice acting. It was a blast and hilarious. Star Wars Jedi: Fallen Order PC (CrossOver) [2019] | Respawn Entertainment | Electronic Arts wiki↗ 7/9/24 Admittedly I do not play many modern games, let alone “AAA” games. Let’s just say this felt like a big step forward after grinding through the Jedi Knight games. I got super lost a ton. This was also my first “souls-like” and I enjoyed that. Cave Story All (doukutsu-rs) [2004] | Studio Pixel | Studio Pixel wiki↗ 8/20/24 I think this is the game I’ve beaten the most times out of any game. I love Cave Story. I put it on the list here, but I did not complete hell. Haunted Castle Revisted Nintendo Switch [2024] | M2 | Konami wiki↗ 8/28/24 I am acquaintances with some of the folks at M2 who worked on this game, so I decided to check it out. It’s kind of technically the second Castlevania game, released only in arcades, and the original version apparently is not fun. This is a total re-imagining of that game. The core level design is the same, but it’s playable. I beat the game without too much trouble in about an hour. It’s a good time! Diablo PC (DevolutionX) [1997] | Blizzard North | Blizzard Entertainment wiki↗ 8/29/24 I’ve never been able to get into any Diablo game but the original. I like the extremely linear approach and simple gameplay. Each new floor represents a pretty substantial bump up in difficulty. I played through this one with my brothers using the excellent DevolutionX client with built-in P2P multiplayer! Space Quest V DOS (ScummVM) [1993] | Dynamix | Sierra On-Line wiki↗ 11/18/24 This was another game we had on the family computer. I spent a lot of time on the first level of this game and never made it much further. I don’t think I’d ever properly beat this game so I cranked through it. I like Space Quest in general a lot but man, the games are not very fun. Space Quest 6 Windows (ScummVM) [1995] | Sierra On-Line | Sierra On-Line wiki↗ 11/20/24 Space Quest 6 gets a lot of shade, but I actually enjoy it overall. I think the voice acting is top notch and the plot is at least as interesting as any of the other Space Quest games. The final sequence inside the body was actually quite entertaining - finding all the junk that’s been swallowed and using it to defeat the enemies. I also took the time to set up a Roland SC-55 emulator and the soundtrack was really enjoyable. I also played through the demo, which is a little standalone mission mostly re-using content from the main game. Kirby Super Star SNES [1996] | HAL Laboratory | Nintendo wiki↗ 11/24/24 This was one of my favorite games growing up. The multiple-games-in-one approach was just so digestible to me as a kid. As mentioned above, we also had Kirby’s Dream Land, so I found the first mission to be familiar and fun. As the dedicated little brother, I really appreciated the co-op features, which meant that I got to play too. Just before my kids went on Thanksgiving Break, I set up the SNES Classic on the family TV which ended up being a hit. I now have my own 4 year old who’s enthusiasm for playing video games is unmatched by his abilities, so this became the go-to for us. We played the entire campaign. By the end I was cruising through but we did it. I’ve come to realize that playing video games isn’t so much about playing the video games as it is playing with the kid. So when the kid decides after 3 minutes he’s done, you’re done. It’s fun! Kirby’s Dream Land 2 Game Boy [1995] | HAL Laboratory | Nintendo wiki↗ 12/11/24 This was a pretty common game to see around, but I never owned it so my experience was limited to shorter sessions borrowing friends’ games on a field trip or at their house. I liked the animals and the abilities. However, coming back, especially after Kirby Super Star, I find the animals to be mostly convoluted. If there weren’t abilities and simply the animals, I think it would be less overwhelming. But each animal having it’s own abilities that are different doesn’t vibe with me. It’s too cumbersome to experiment and because each level has one “secret star” that usually needs some specific combination of animal and ability, I was left feeling anxious about getting rid of anything for fear I’d need it for the star. Once I gave up on the stars and just got whatever I thought looked cool, it was more fun. I think the game is designed to be replayed (endlessly), so I’m just not bored enough yet to do all the special stuff! It’s a good game with a good soundtrack, but I"
