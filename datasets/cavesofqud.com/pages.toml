["https://www.cavesofqud.com/frivolous-lives-being-the-foremost-catalogue-of-humanoid-kings-by-the-baccata-yewtarch-volume-i"]
title = "Frivolous Lives: Being the Foremost Catalogue of Humanoid Kings by the Baccata Yewtarch, Volume I – Caves of Qud"
full_description = "This record draws upon the notes and accounts of the constituents of the Consortium of Phyta, hearsay from those who observed the futile lives of the humanoid kings, and personal anecdotes of the kings themselves, who in their struggles to remain relevant beyond their seedling-like lifespans managed to record some useful data. As a matter of convention, I date the reigns of the humanoid kings according to their chronological distance from an event of paramount historical significance, namely the publication of these volumes. Accordingly, take my suffixal notation rendered after the parenthetical dates to signify their occurrence “prior [to] publication”. During this period of humanoid prehistory the greater Girsh entities roamed Outer Qud and humanoid communities were largely isolated. Consortium records predate the end of the Scattered Age, however they are disparate in their assertions and ultimately unreliable; the period’s dearth of scholarship is likely a result of traditions derived from Hegelrut’s contempt of writing implements. The first humanoid to successfully unite the farmsteads of western Qud was Abram, called the Sower. According to the lore of Abram’s descendants (of which the Consortium has chosen not to disabuse them), Abram’s call to arms rallied his kinsmen and under his sovereignty they drove the greater Girsh entities beneath the surface to the depths of Inner Qud at which they now roost. To follow were two or three decades of jubilation and prosperity that lasted until the day Abram, disillusioned by the growing tumult among his sons on the question of succession, famously beat his sword into a ploughshare and dissolved his kingdom. The years that followed Abram’s dissolution were marked by fear, turmoil, and bloodshed. His sons fought fiercely for control of the farmsteads while water barons conspired against them and in some cases staked their own claims. At last, sometime between 970 and 960 PP, Abram acknowledged the futility of the prospect of peace without his providence and returned to the throne with his sword in hand."
year_published = 2025
clearnet = "https://www.cavesofqud.com/frivolous-lives-being-the-foremost-catalogue-of-humanoid-kings-by-the-baccata-yewtarch-volume-i"
