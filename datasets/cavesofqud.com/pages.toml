title = "Caves of Qud"
full_description = "Caves of Qud is a science fantasy RPG & roguelike epic. It’s set in a far future that’s deeply simulated, richly cultured, and rife with sentient plants. Play the role of a mutant from the salt-spangled jungles of Qud, or play as a true-kin descendant from one of the few remaining eco-domes: the toxic arboreta of Ekuemekiyye, the ice-sheathed arcology of Ibul, or the crustal mortars of Yawningmoon. “Caves of Qud is one of the best roguelikes in years, packed with evocative prose and featuring a captivating world of arcane secrets to explore.” “Caves of Qud has a particular kind of New Wave science fiction imagination that just can’t be beat.” Caves of Qud weaves a handwritten narrative through rich physical, social, and historical simulations. The result is a hybrid handcrafted & procedurally-generated world where you can do just about anything. Copyright © 2014-2025 Caves of Qud | Cloud Storage by WindRate Design by Iceable Themes | Styled by Splendorr"
