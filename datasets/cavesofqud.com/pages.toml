["https://www.cavesofqud.com/a-scroll-bound-by-a-strand-of-kelp"]
title = "a scroll bound by a strand of kelp – Caves of Qud"
full_description = "I come from the west. My parents sold me into slavery as a babe, though the practice had been formally abolished in Perth years earlier. As a boy I cut my teeth on the reefs of the Shore of Songs, and lulled the Pale Sea to sleep with many a hymn, that she might return our sailors from the Black Stair unscathed. How the melodies whisked inside my skull even then. I was given no name at birth, but the sailors called me Catu. At five and ten years I ran away. On Ettinspine I roosted with an eremite who ushered me into manhood. I learned to hunt, and laugh, and dream. In time I came to know of the Free City and the ingress afforded my kind. I shoved off from my stony nook, and trekked to their high gate, and settled there, though I preferred to sup with the anglers and other low folk. In a sun-warmed pool under the rampart the Free Seer first noticed me. The slant of his neck from where he watched on the parapet presaged my movements, I still recall. I stood from my bath and shamefully padded to my discarded vest, but stopped. I saw him from that distance, his eyes tucked deep into his shorn dome, his frock as inert as a statue’s, and I felt no more shame. Under his tutelage I rose to prominence in his court. I stood by his side as he treated with the tuyuldars of Odrum, as he plotted against the southern freeholds. When a traitorous canter slipped poison into his cup, I smashed it from his hands and sundered the quisling’s mind. That night, in the hour of the Beetle Moon, he introduced me to the mirth of an assembled mind. Together with the other canters we Joined, and he named me Mirthful, and raised me unto his honor guard. I would be dispossessed of it in under a year. But I must pause now. The Cant loudens, and the Elder nears. I vow to conclude my story if I still draw breath, and if I am free. It is dusk. I sit on the bank of the River Svy, but no fire warms my bones. The risk of drawing moon-doting beasts is too great, and any aggregation of minds is sure to attract the attention of the Elder. Instead, I write by a flame kindled on my thumb."
