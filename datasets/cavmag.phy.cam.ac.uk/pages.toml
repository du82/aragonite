["https://cavmag.phy.cam.ac.uk"]
title = "CAVMAG"
description = "In this edition:"
full_description = '''ISSUE 32 - NOVEMBER 2024 CAVMAG In this edition: THE CAVENDISH AT 150CELEBRATING ITS FOUNDATIONS PLUS :Why soft matter matters by Athene DonaldSeventy years of the Theory of Condensed Matter groupand more... (function(w) { var el = (window.__shadowRoot || document).getElementById('q4UxK6ur2j-background-viewport'); w.Shorthand && w.Shorthand.initInstantImage ? w.Shorthand.initInstantImage(el) : w.SHPreloadInstantImages ? w.SHPreloadInstantImages.push(el) : w.SHPreloadInstantImages = [el]; w.Shorthand.initFocalPointPictures(); })(window) CONTENTS This year the Cavendish Laboratory is celebrating its 150th anniversary. To mark this extraordinary milestone, we’re pleased to present a special edition of CavMag that looks back on a century and a half of scientific innovation that has transformed our understanding of nature and the way we live. In these pages you’ll find articles from our staff charting the histories of some of the lab’s research areas, from soft matter and the theory of condensed matter to radio astronomy and high energy physics. While it’s impossible to cover all the Cavendish’s astonishing achievements in a few short pages, we hope this issue will give you a hint of the breadth and depth of our work, which continues to lead the world, as it has since the days of James Clerk Maxwell. For the cover, we’ve commissioned a special illustration by Stewart Harris that attempts to squeeze 150 years of science into a single image. You may be able to spot a few familiar faces, from famous figures of the past to a smattering of our current staff, chosen in an attempt to cover a range of different research areas. Of course, we couldn’t come close to including all the Cavendish’s important figures and we apologise in advance for any egregious omissions! If you think you can name all the faces on the cover, please write to us at cavmag@phy.cam.ac.uk for the chance to win a much sought-after Cavendish Laboratory mug and a printed poster of the cover artwork. The identity of each face will be revealed in the next issue. Read more Inside, you’ll find details of our plans to celebrate our 150th year, including a special event for our alumni community to be held next January. You’ll also be able to read about a rather exciting theatre project that will bring some of the Cavendish’s history to life for the general public in the very place it all began, the lab in Free School Lane. We’re also pleased to present a number of letters from our readers sharing recollections of their time at the Cavendish Laboratory. Thank you to everyone who wrote in – we only regret that we were unable to publish everything we received. For the full collection, head to our social media channels where we continue to share alumni stories using the hashtag #150CavendishStories. This will be the first of two 150th anniversary editions to fall through your letterbox. While this issue casts an eye back over the Cavendish’s achievements to date, the May 2025 edition will look to the future of our research programme, as we complete the move into the cutting-edge Ray Dolby Centre. As ever, we are keen to hear from you, so please do get in touch via email or using the contact details on the opposite page with any comments or suggestions. We hope you enjoy this 150th anniversary edition of CavMag. Expand Harry Cliff COVER STORY The faces of the Cavendish To mark the 150th anniversary of the Cavendish, our cover image celebrates dozens of those who have played a part in building the historic legacy. Take a closer look at them - and see how many you can identify. (There are clues.) Learn more Join us to celebrate our 150th anniversary! Under the theme "Celebrating our heritage, showcasing our present, and shaping the future," we have a fantastic line-up of events designed to bring our community together. Learn more The Old Cavendish Experience Step inside the lab that changed the world. Learn more HISTORY FEATURES The Birth of the Cavendish Laboratory By the mid 19th century, the University of Cambridge had fallen behind in the physical sciences, leading to a long campaign to establish a laboratory for experimental physics. Malcolm Longair explores how the Cavendish Laboratory came to be. Learn more High energy physics in the postwar era After the Second World War, Cavendish high energy physics increasingly turned towards large international facilities, as Val Gibson explains. Learn more Seventy years of the Theory of Condensed Matter Group Members of the Theory of Condensed Matter Group reflect on pushing back the frontiers of our understanding of matter. Learn more Extraordinary fruit – the growth of soft matter research at the Cavendish Athene Donald writes about the growth of soft matter and biological physics research at the Cavendish. Learn more Tuning in to the cosmos From its origins in wartime radar research, to the latest international radio telescopes, Malcolm Longair charts the history of radio astronomy at the Cavendish Learn more Your Cavendish memories We asked our readers to share their recollections of their time at the Cavendish Laboratory, and received tens of submissions, from detailed memories to funny anecdotes (and even a love story). Here is a non-exhaustive selection. Learn more A potted history of Cavendish outreach From the pioneering work of Brenda Jennison to the ever-evolving programme run by today’s outreach team, Lisa Jardine-Wright and Nicki Humphry-Baker trace the history of the Cavendish Laboratory’s work to inspire the next generation of physicists. Learn more NEWS Research news The latest research and funding news from the Cavendish Learn more Department news Latest news and updates in brief Learn more “We have the keys!” The Ray Dolby Centre transforms the Cambridge West Innovation District into a connected, beautiful and sustainable place Learn more HOW YOU CAN CONTRIBUTE: Information about how to support the work of the Department Read more ARCHIVE ISSUE 31 MAY 2024 ISSUE 30OCTOBER 2023 ISSUE 29MAY 2023 ISSUE 28OCTOBER 2022 Visit the full archive TopBuilt with Shorthand'''
