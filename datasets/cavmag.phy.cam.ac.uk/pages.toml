title = "“We have the keys!”"
full_description = "“We have the keys!” (function(w) { var el = (window.__shadowRoot || document).getElementById('CNbVBgQTZY-background-viewport'); w.Shorthand && w.Shorthand.initInstantImage ? w.Shorthand.initInstantImage(el) : w.SHPreloadInstantImages ? w.SHPreloadInstantImages.push(el) : w.SHPreloadInstantImages = [el]; w.Shorthand.initFocalPointPictures(); })(window) “We have the keys!” The Ray Dolby Centre construction reached completion in May, a significant step in the University's vision to transform the Cambridge West Innovation District into a connected, beautiful and sustainable place, open to all. The stage is now set for this state-of-the-art building to transform scientific research and teaching, and significantly enhance the Cavendish’s world-leading facilities. Image above: (L-R) Peter Norman (RDC Project Team), Thomas Singer (Bouygues UK), Sam Stokes (RDC Project Lead), Franck Girard (Bouygues UK), Mete Atatüre (Head of Cavendish), Graham Matthews (Head of Estates Division), Marie Chuet (Bouygues UK), Matt Allen (Estates Division), Andy Jardine (Deputy Head of Cavendish) and David Hunt (RDC Project Team). © Chris Brock In recent months, attention has turned to the upcoming relocation of around 1,100 Cavendish staff members and students. This move involves the careful migration of research laboratories, scientific equipment, technical instruments, and undergraduate teaching laboratories. “This landmark building, several years in the making, is built to serve our community, the University, the city, and the country,” said Mete Atatüre, Head of the Cavendish Laboratory. “It will help to foster the passion and excellence that our staff and students demonstrate in their work, while providing access to our best-in-class equipment, resources and expertise to any university or industry researcher. “It is incredibly satisfying to see the practical completion of this impressive building and now we must bring it to life. Our move is a hugely complex task that we have carefully planned, and we are impatient to get to this final stage.” The Ray Dolby Centre is expected to be fully operational by the summer of 2025, with an official opening ceremony slated for spring, coinciding with our 150th anniversary celebrations. Image above: External image: © Ståle Eriksen / Jestico + WhilesImage below: Atrium: © Paul Raftery / Bouygues UK TopBuilt with Shorthand"
