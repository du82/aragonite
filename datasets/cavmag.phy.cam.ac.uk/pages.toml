title = "How you can contribute"
full_description = "How you can contribute (function(w) { var el = (window.__shadowRoot || document).getElementById('IwtQhUw135-background-viewport'); w.Shorthand && w.Shorthand.initInstantImage ? w.Shorthand.initInstantImage(el) : w.SHPreloadInstantImages ? w.SHPreloadInstantImages.push(el) : w.SHPreloadInstantImages = [el]; w.Shorthand.initFocalPointPictures(); })(window) Online giving The University’s Office for Development and Alumni Relations (CUDAR) has made it easier to make donations online to the Department and to two of our special programmes. If you wish to make a donation to the Department, please go to: Physics | Support CambridgeOr support the graduate student programme and our outreach activities directly. If you would like your gift to be applied to some other specific aspect of the Development Programme, please contact the Head of Department. A gift in your will One very impactful way of contributing to the long-term development of the Laboratory’s programme is through the provision of a legacy in one’s will. This has the beneficial effect that legacies are exempt from tax and so reduce liability for inheritance tax. The University provides advice about how legacies can be written into one’s will. Visit Legacies | Support Cambridge for info and advice on legacy gifts. It is important that, if you wish to support the Cavendish, or some specific aspect of our development programme, your intentions should be spelled out explicitly in your will. We can suggest suitable forms of words to match your intentions. Please contact the Department’s Chief Operating Officer Samantha Stokes who can provide confidential advice. If you would like to discuss how you might contribute to the Cavendish’s Development Programme, please contact the Head of Department Mete Atatüre, who will be very pleased to talk to you confidentially. Contact The Cavendish LaboratoryJJ Thomson Avenue, Cambridge, CB3 0HETel: +44 (0)1223 337200www.phy.cam.ac.uk Head of DepartmentProfessor Mete Atatüre Tel: +44 (0)1223 337429Email: hod@phy.cam.ac.uk Chief Operating OfficerSamantha StokesTel: +44 (0)1223 747360Email: departmental.administrator@phy.cam.ac.uk TopBuilt with Shorthand"
