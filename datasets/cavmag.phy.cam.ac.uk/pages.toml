["https://cavmag.phy.cam.ac.uk/issue-31/history/150th-anniversary/index.html"]
title = "Cavendish's 150th anniversary"
description = "Your memories needed!"
full_description = "Cavendish's 150th anniversary Your memories needed! Vanessa Bismuth Cavendish Laboratory current site photograph taken in 1974. Cavendish Laboratory current site photograph taken in 1974. (function(w) { var el = (window.__shadowRoot || document).getElementById('uMCJvQqcS2-background-viewport'); w.Shorthand && w.Shorthand.initInstantImage ? w.Shorthand.initInstantImage(el) : w.SHPreloadInstantImages ? w.SHPreloadInstantImages.push(el) : w.SHPreloadInstantImages = [el]; w.Shorthand.initFocalPointPictures(); })(window) A warm thank you to all of you who have already shared with us their stories and treasured memories of their time at the Cavendish, in preparation for our 150th anniversary. Please continue to send anything you would like to share with us and the Cavendish community, be it a photo, a diary entry, an interesting fact, or a funny anecdote. As 2024 also marks the 50th anniversary of our occupation of the West Cambridge site, we are particularly interested to hear from those who remember moving to the ‘new Cavendish’ in 1974. Do you recall what it was like to study or work in those brand-new labs? Did the move from the city centre to the then not very densely populated West Cambridge site have an impact (positive or otherwise) on your experience? We would also be very keen to collect any photo of that time you may have, for our archives. We would also like to do a focus on our technical staff and their often silent yet invaluable contributions to the successes of the laboratory over the years. If the story of Thomson’s talented assistant Ebenezer Everett and a few others are relatively widely known, we recognise that many other unsung heroes have fuelled our scientific achievements and must be celebrated. If you have worked or studied alongside a technician who made a difference, from way back or a more recent past, please also tell us about them. Your narratives will be woven into the fabric of our 150-year history, creating a tapestry of shared memories that will be showcased during the year of festivities, planned to run from June 2024 to June 2025, and in the special 150th anniversary edition of CavMag in the autumn. Please submit all your stories, memories and ideas in the form of a title, short description and an image or a video to communications@phy.cam.ac.uk If you have any questions or need additional information do not hesitate to contact us at the same email address. Submit your story Cavendish Research Assistant Staff, 1900. Ebenezer Everett is first from the right in front row. Cavendish Research Assistant Staff, 1900. Ebenezer Everett is first from the right in front row. TopBuilt with Shorthand"
year_published = 2025
