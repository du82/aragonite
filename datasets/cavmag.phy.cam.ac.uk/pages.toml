full_description = "ISSUE 31 - MAY 2024 CAVMAG In this edition: BACK TO BLACKA discovery from the dawn of the universe And more... (function(w) { var el = (window.__shadowRoot || document).getElementById('Fe1eS4CJgd-background-viewport'); w.Shorthand && w.Shorthand.initInstantImage ? w.Shorthand.initInstantImage(el) : w.SHPreloadInstantImages ? w.SHPreloadInstantImages.push(el) : w.SHPreloadInstantImages = [el]; w.Shorthand.initFocalPointPictures(); })(window) CONTENTS A very warm welcome to the brand-new digital home of CavMag, your alumni magazine from the Cavendish Laboratory. Malcolm Longair founded this magazine in 2009 and remained at the helm for fifteen wonderful years, publishing 30 editions. It is a great privilege, and somewhat daunting, to be taking on editorial responsibility for this magazine. To mark the start of this new era, the team have refreshed the design of the printed magazine and develop this fresh new way of exploring CavMag online. Here you will find all the same stories of scientific research, along with recent developments and news from the Cavendish Laboratory in an immersive, interactive, and truly accessible digital environment that looks great whether you’re browsing on a computer, tablet or smartphone. Read more After spending the past few weeks editing the articles that make up this 31st edition, we have been struck by the sheer breadth and quality of the research that the Cavendish Laboratory produces. Within these digital pages you’ll find stories of the oldest black hole ever seen, new materials that may one day transform computer processing and energy storage, and novel phenomena that have emerged as Cavendish scientists probe complex atomic systems. You will also meet the technician who has run the astrophysics workshop for the past 25 years, discover our recent acquisitions of objects from the life and work of Ray Dolby, and much more. We hope you’ll enjoy this new digital format for CavMag, and we are keen to hear your thoughts on the evolving design and content, both here and in print. If you have feedback or requests for content that we don’t currently cover, please do get in touch at cavmag@phy.cam.ac.uk. Happy reading. Expand Harry Cliff and Vanessa Bismuth RESEARCH FEATURES COVER STORY The oldest black hole An international team led by astronomers at the Cavendish Laboratory have discovered a primeval black hole that existed over 13 billion years ago during the era known as cosmic dawn. Read more DRUG DEVELOPMENT Accelerated by machine learning Read more Magnetic Monopoles Emerge in flakes of rust Read more RESEARCH FEATURES COVER STORY The oldest black hole An international team led by astronomers at the Cavendish Laboratory have discovered a primeval black hole that existed over 13 billion years ago during the era known as cosmic dawn. Read more DRUG DEVELOPMENT Accelerated by machine learning Read more Magnetic Monopoles Emerge in flakes of rust Read more RESEARCH NEWS Colossal caverns ready for Deep Underground Neutrino Experiment The Deep Underground Neutrino Experiment (DUNE) marked a major milestone in February with the completion of three enormous subterranean caverns that will host the experiment’s far detector. Learn more REACH for cosmic dawn REACH (the Radio Experiment for the Analysis of Cosmic Hydrogen), is now beginning to probe the times in the early universe known as cosmic dawn. Learn more FUNDING NEWS Advancing battery research for real-world impact Read more Cambridge team joins ALPHA hunt for dark matter Read more European funding for new thin magnet research Read more RESEARCH NEWS Colossal caverns ready for Deep Underground Neutrino Experiment The Deep Underground Neutrino Experiment (DUNE) marked a major milestone in February with the completion of three enormous subterranean caverns that will host the experiment’s far detector. Learn more REACH for cosmic dawn REACH (the Radio Experiment for the Analysis of Cosmic Hydrogen), is now beginning to probe the times in the early universe known as cosmic dawn. Learn more FUNDING NEWS Advancing battery research for real-world impact Read more Cambridge team joins ALPHA hunt for dark matter Read more European funding for new thin magnet research Read more RESEARCH STORIES Electrons dance themselves in knots Researchers at the Cavendish have discovered new realm of ‘topological phases’ with tangled, knot-like properties, which hold promise for new forms of robust memory storage and processing. Learn more Venus’s dark clouds A team from the Cavendish and the Department of Earth Sciences may have finally solved a hundred-year-old mystery over dark streaks in the atmosphere of Venus. Learn more Resolving electronic gridlock in a Mott insulator Scientists from the Quantum Matter group have given insights into how electrons go from gridlock to freedom. Learn more INTERVIEWS Robert Ssempijja: encounters in art and physics We talk to 2024 Cavendish Arts Science Fellow Robert Ssempijja about his approach to art and what he hopes to achieve during his time in Cambridge. Read interview Peter Doherty: 25 years at Lord’s Bridge We sit down with the long-standing Astrophysics Group's Chief Mechanical Workshop Technician. Read interview INTERVIEWS Robert Ssempijja: encounters in art and physics We talk to 2024 Cavendish Arts Science Fellow Robert Ssempijja about his approach to art and what he hopes to achieve during his time in Cambridge. Read interview Peter Doherty: 25 years at Lord’s Bridge We talk to 2024 Cavendish Arts Science Fellow Robert Ssempijja about his approach to art and what he hopes to achieve during his time in Cambridge. Read interview HISTORY: The Dolby Collection arrives at the Cavendish The group of objects from the life and work of the American engineer and inventor Ray Dolby, will soon be put on display in the main entrance of the newly constructed Ray Dolby Centre. Read more A301 Compressor circuit board and Wilhelm Backhaus record A301 Compressor circuit board and Wilhelm Backhaus record HISTORY: The Dolby Collection arrives at the Cavendish The group of objects from the life and work of the American engineer and inventor Ray Dolby, will soon be put on display in the main entrance of the newly constructed Ray Dolby Centre. Read more Cavendish's 150th anniversary: Your memories, please! Learn more Mapping the history of Cambridge innovation Learn more Cavendish's 150th anniversary: Your memories, please! Learn more Mapping the history of Cambridge innovation Learn more DEPARTMENT NEWS: Outreach Read more News in brief Read more HOW YOU CAN CONTRIBUTE: Information about how to support the work of the Department Read more ARCHIVE ISSUE 30 OCTOBER 2023 ISSUE 29MAY 2023 ISSUE 28OCTOBER 2022 Visit the full archive ISSUE 30 OCTOBER 2023 ISSUE 29MAY 2023 ISSUE 28OCTOBER 2023 Visit the full archive TopBuilt with Shorthand"
