full_description = "The faces of the Cavendish (function(w) { var el = (window.__shadowRoot || document).getElementById('y8xG4y7XGz-background-viewport'); w.Shorthand && w.Shorthand.initInstantImage ? w.Shorthand.initInstantImage(el) : w.SHPreloadInstantImages ? w.SHPreloadInstantImages.push(el) : w.SHPreloadInstantImages = [el]; w.Shorthand.initFocalPointPictures(); })(window) To mark the anniversary, we are celebrating with dozens of the faces of people who have built the Cavendish's legacy. But how many can you identify? Toggle below to switch between the full colour version or a numbered layout. Hover/click to zoom in on faces and fill out your answers in the form provided. One winner will be chosen at random to receive a full colour print of our landmark cover. FULL COLOUR NUMBER KEY VERSION TopBuilt with Shorthand"
