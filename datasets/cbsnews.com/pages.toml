full_description = '''Rep. Sylvester Turner dies at 70, weeks after taking office The cause of death is unclear. Turner took office weeks ago, filling the seat left vacant by the death of Rep. Sheila Jackson Lee. updated 12M ago U.S. has halted sharing intelligence with Ukraine, CIA director says The U.S. has paused intelligence sharing with its war torn ally, according to CIA Director John Ratcliffe. 37M ago Who is Al Green, congressman from Texas removed from Trump's speech? Rep. Al Green, a Texas Democrat, was escorted from the chamber Tuesday night for shouting during President Trump's 2025 address to a joint session of Congress. updated 14M ago live updates Watch Live: Democratic mayors of "sanctuary cities" testify before Congress The mayors of Boston, Chicago, Denver and New York City are testifying before the Republican-led House Oversight Committee Wednesday on their immigration policies. updated 22M ago Supreme Court won't lift lower court order unfreezing $2 billion in foreign aid The Supreme Court split 5-4 in denying the request from the Trump administration. 1H ago Election systems feared vulnerable as government cuts workers tasked with security Cuts to the U.S. cybersecurity agency and FBI affected the federal workers tasked with stopping foreign interference in elections. Feb 25 Are we heading toward a constitutional crisis? President Trump, who tried to overturn the 2020 election result, has been shattering norms upon returning to the Oval Office. Since the nation's founding, the guardrails that have kept presidents in check have been in the courts and Congress. But will they hold? Feb 23 How Trump won the 2024 election — CBS News exit poll results Trump's election victory was a product of voter discontent with the state of the country, the economy and a desire for change, and he made inroads with some Democratic groups. Nov 8, 2024 Full Episodes 3/3: America Decides Trump says Zelenskyy should be "more appreciative"; Understanding DOGE's mass firi