full_description = 'Impact of toxic ash from L.A. wildfires on oceans The Southern California wildfires that sparked eight weeks ago killed 29 people, burned 38,000 acres and destroyed thousands of homes, but researchers say the damage to the ocean is just beginning. David Schecter reports. 15H ago 03:07 Impact of toxic ash from L.A. wildfires on oceans Ex-USAID worker calls mass firings "demeaning" President Trump is giving the heads of federal agencies until next week to submit plans for eliminating more government jobs. The thousands being cut in the mass firing are much more than numbers on a payroll list -- and every one of them has a story. Caitlin Huey-Burns reports. Mar 3 03:23 Foster kids get backpacks to replace trash bags Rob Scheer had to carry his belongings in a trash bag as a foster child, and was shocked to see his own children, who also came from the foster care system, face a similar ordeal decades later. Nancy Cordes has more on how the experience inspired him to take action. Feb 27 03:10 California city is slowly sliding toward the ocean A California neighborhood is slowly sliding toward the ocean, but not all homeowners want to leave. A buyout program only provides 75% of the funding for the city to buy affected properties at fair market value, while the remaining share is absorbed by sellers. Jonathan Vigliotti reports. Feb 26 03:22 Wisconsin Trump voters react to mass firings We are now into week six of President Trump shaking up and paring down the federal workforce -- something that surprised even his closest supporters. Mark Strassmann visits the battleground state of Wisconsin to find out how people who voted for him feel about the mass firings. Feb 25 03:15 Full Episodes Eye on America: Inside U.S. Marshals training In Pennsylvania, we get an exclusive look at how the U.S. Marshals Fugitive Task Force trains to apprehend some of the country’s most wanted criminals. And in Texas, we learn how lawmakers and victims of AI-generated deepfake 