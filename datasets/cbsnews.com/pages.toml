full_description = '''Branded content you can trust CBS News Brand Studio provides creative, narrative-driven branded content from a trusted, legacy brand with the SEO and social media power to deliver results. Jan 1 02:06 Branded content you can trust Paid Program Business pioneers of the Pacific Northwest How Seattle's iconic brands embody the city's spirit of innovation and connection. Dec 6, 2024 Sponsored Cisco and the NFL defended Super Bowl LVII Former NFL star meets with a Cisco engineer and NFL's Chief Information Security Officer to discuss how the tech giant defended the big game from cyberattacks. Jul 9, 2024 A Dream Delivered In this documentary, we follow the incredible story of an African American family who embarks on a journey of discovery after a lost letter from a formerly enslaved ancestor is unearthed. THIS DOCUMENTARY IS PAID FOR BY ANCESTRY. Jun 19, 2022 27:19 The Addiction Crisis in America There were an estimated 108,000 overdose deaths in 2021, a number that has more than doubled since 2015. As many as 20 million Americans have a substance use disorder and yet only 1 in 10 can access care. This portion of the documentary film "Untreated & Unheard: The Addiction Crisis in America" tells the stories of families whose lives have been forever changed by addiction. If you or a loved one is suffering from substance use disorder you can find tools, help and hope at https://drugfree.org/get-support/ THIS PROGRAM WAS PRODUCED BY PARAMOUNT FOR THE NATIONAL NONPROFIT ORGANIZATION PARTNERSHIP TO END ADDICTION Oct 11, 2022 23:34 Small Business Genesis: Roletape Rahiem Thompson, founder of Roletape in Charlotte, North Carolina, wanted to build more than just a video, photography and graphic design small business. He wanted to build a brand of like-minded artists in his community. His entrepreneurial spirit led to the creation of Roletape, an acronym for “real opportunities that lead to elevating the talents of artistic people every day.” May 4, 2022 02:5