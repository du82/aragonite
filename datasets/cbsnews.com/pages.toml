full_description = '''Journalists from The Baltimore Banner, WJZ's media partner, offer a behind-the-scenes look at their latest community-based reporting. Prosecutors nearing criminal charges in Key Bridge collapse Federal prosecutors are closing in on criminal charges in the Key Bridge disaster and could take their case to a grand jury sometime in the new year, according to sources with knowledge of the case. Dec 4, 2024 Under Armour moving global headquarters to Baltimore Peninsula next week Under Armour's long-awaited move into a new global headquarters in South Baltimore will begin next week, President and CEO Kevin Plank told investors Thursday morning. Nov 7, 2024 Maryland election results delayed with voters still in line Maryland is delaying the release of election results across the state because voters are still waiting in line at several polling places in Montgomery and Prince George's counties, according to state elections administrator Jared DeMarinis. Nov 5, 2024 Internal 2023 memo details how Baltimore could cut ties with BOPA A confidential memo from 2023 details how Baltimore could cut ties with the Baltimore Office of Promotion and the Arts, according to our media partner at the Baltimore Banner. Oct 8, 2024 Baltimore Police tie West Baltimore 'clubhouse' to dozens of youth crimes City detectives investigating armed robberies and carjackings last year kept coming back to the same property in West Baltimore. Apr 2, 2024 Survivors of clergy sex abuse can speak in Archdiocese of Baltimore bankruptcy case, judge rules Survivors of clergy sexual abuse will have the opportunity to address the court during two upcoming hearings in the Archdiocese of Baltimore bankruptcy case, a judge ruled on Thursday. Mar 21, 2024 Students sold chocolate to raise money for school. A Baltimore County man stole $29,000 from them. Baltimore County prosecutors said theft totaled $29,000 and occurred between April 2022 and March 2023. Mar 17, 2024 Former Baltimore Mayor Pugh granted early end to probation in 'Healthy Holly' scandal A federal judge agreed Thursday to early termination of former Baltimore Mayor Catherine E. Pugh's probation related to her conviction in the "Healthy Holly" scandal. Mar 14, 2024'''
