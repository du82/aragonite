["https://cbsnews.com/news/john-oliver-loves-performing-stand-up-most-60-minutes"]
title = "John Oliver loves performing stand-up most - CBS News"
description = "Comedian John Oliver tells 60 Minutes that performing stand-up is his &quot;favorite place to be&quot; and explains why bombing on stage is helpful for comedians."
full_description = '''60 Minutes Overtime John Oliver loves performing stand-up most By Brit McCandless Farmer Updated on: February 23, 2025 / 7:02 PM EST / CBS News John Oliver loves performing stand-up most John Oliver loves performing stand-up most 06:08 This week on 60 Minutes, correspondent Bill Whitaker profiles comedian John Oliver. Known for his Sunday night show "Last Week Tonight," Oliver has won awards and accolades for his searing commentary on America. Although Oliver's HBO show is now in its 12th season, he has not lost touch with the stand-up comedy that launched his career. While preparing for a stand-up show backstage at the Beacon Theater in New York City, Oliver told Whitaker that performing stand-up is his "favorite place to be."In the video above, Oliver explains why it is helpful for comedians to perform sets that are not well received by the audience. "It's good for you. Bombing is a key, key part of stand-up," Oliver said. "You learn more from failure than you do from success. There is sometimes a real excitement in struggling through a gig and learning lessons from it. Failure is a hell of a tutor."John Oliver stand-up performance filmed at the Beacon Theatre, NYC. The video above was produced by Brit McCandless Farmer and Scott Rosann. It was edited by Scott Rosann. More from CBS News Finding a plane used to "disappear" people during Argentina's dictatorship Siblings torn apart by Argentina's dictatorship find each other John Lithgow and Geoffrey Rush talk horror in "The Rule of Jenny Pen" The turning tide of U.S. support for Ukraine How Putin likely reacted to the Trump-Zelenskyy fight .component--type-recirculation .item:nth-child(5) { display: none; } #inline-recirc-item--id-8550e73e-a080-43d1-84c1-c77b19585cc5, #right-rail-recirc-item--id-8550e73e-a080-43d1-84c1-c77b19585cc5 { display: none; } #inline-recirc-item--id-8550e73e-a080-43d1-84c1-c77b19585cc5 ~ .item:nth-child(5) { display: block; } In: John Oliver Brit McCandless Farmer Brit McCandless Farmer is a digital producer for 60 Minutes, where her work has been recognized by the Webby, Gracie, and Telly Awards. Previously, Brit worked at the CBS Weekend Evening News, CBS This Morning, CNN, and ABC News. © 2025 CBS Interactive Inc. All Rights Reserved.'''
