full_description = "Finding Common Ground | CBS Reports Los Angeles is home to one of the largest populations of Jews in the world, and one of the largest populations of Muslims in America. For almost two decades, a group there has been trying to build bonds between these two communities, but the attack of Oct. 7, 2023 and its aftermath are putting that mission to the test. CBS Reports and CBS News Race and Culture examine these challenges and explore how the next generation may hold the key to forging paths to unity amid adversity. Sep 21, 2024 21:41 Finding Common Ground | CBS Reports Campaign of Deceit | CBS Reports Since the day George Santos announced his bid for a seat in Congress, much of what he’s said about his life and career has proven to be false. So who is George Santos? CBS Reports follows his unlikely path from a basement in Queens to seaside Brazil to Long Island’s wealthiest suburbs – unwinding a campaign of deceit that delivered him to the loftiest halls of power in Washington. Feb 9, 2023 22:49 Elon Musk, Inc. | CBS Reports Elon Musk has built a reputation for changing the game by ignoring the rules, and his recent acquisition of Twitter is no different. Is the turbulent Twitter buyout just the next chapter in Elon Musk’s odds-defying story? CBS Reports peels back the layers on the high-stakes and high-rewards journey of one of the most polarizing and influential people of our time. Dec 15, 2022 22:36 Defending Taiwan | CBS Reports An increasingly powerful China is stepping up its aggression against the self-governing island of Taiwan -- an alarming development that could result in a U.S.-China showdown with massive economic consequences. CBS Reports heads to Taiwan to examine how the Taiwanese are building resistance in the face of growing threats, and the global stakes of the island’s fate. Oct 6, 2022 23:11 Guns in the Classroom | CBS Reports As America grapples with the crisis of school shootings, solutions to school safety seem to divide into