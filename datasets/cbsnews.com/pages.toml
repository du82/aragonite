full_description = '''Full Episodes Here Comes the Sun: Wendell Pierce and more Actor Wendell Pierce sits down with Nancy Giles to discuss his role in the CBS drama "Elsbeth," his acting journey, and how he has gained courage over the years. Then, Seth Doane visits the Vasari Corridor in Florence, Italy, which was built by the Medici family in the 16th century and recently reopened. "Here Comes the Sun" is a closer look at some of the people, places and things we bring you every week on "CBS Sunday Morning." Mar 2 20:57 Here Comes the Sun: Wendell Pierce and more Here Comes the Sun: Arline Geronimus and more Researcher and author Arline Geronimus sits down with Nancy Giles to discuss her book “Weathering: The Extraordinary Stress of Ordinary Life in an Unjust Society.” Then, Luke Burbank visits a distillery in Naples, New York, where maple syrup is turned into spirits. “Here Comes the Sun” is a closer look at some of the people, places and things we bring you every week on “CBS Sunday Morning.” Feb 23 21:47 Here Comes the Sun: Adrien Brody and more Actor Adrien Brody sits down with Tracy Smith to discuss his latest film "The Brutalist." Then, David Pogue learns about symphony orchestra concerts where a film coincides with a live performance of the music found in the movie. "Here Comes the Sun" is a closer look at some of the people, places and things we bring you every week on "CBS Sunday Morning." Feb 16 20:50 Here Comes the Sun: Darren Criss and more Actor and singer Darren Criss sits down with Kelefa Sanneh to discuss his latest role in Broadway's "Maybe Happy Ending." Then, David Pogue visits the Johnson Space Food Systems Laboratory in Houston, Texas, to learn how scientists are creating foods that will be served on the International Space Station. "Here Comes the Sun" is a closer look at some of the people, places and things we bring you every week on "CBS Sunday Morning." Feb 9 19:37 Here Comes the Sun: Maggie Rogers and more Singer-songwriter Maggie Rogers sits down with Luke Burbank to discuss how she went from being a music student at New York University to selling out Madison Square Garden. Then, Martha Teichner visits a bakery in Nashville that produces the same bread the Kurds have been making for the last 4,000 years. "Here Comes the Sun" is a closer look at some of the people, places and things we bring you every week on "CBS Sunday Morning." Feb 2 20:55'''
