["https://cbsnews.com/news/slotkin-democratic-response-trump-speech-2025"]
title = "Sen. Elissa Slotkin delivers Democratic response to Trump's 2025 speech to Congress - CBS News"
description = "Sen. Elissa Slotkin was elected by a narrow margin in November to represent Michigan after serving several terms in the House."
full_description = '''Politics Sen. Elissa Slotkin delivers Democratic response to Trump's 2025 speech to Congress By Graham Kates Updated on: March 5, 2025 / 9:06 AM EST / CBS News Sen. Elissa Slotkin gives Democratic rebuttal Watch: Sen. Elissa Slotkin refutes Trump's speech to Congress in Democratic rebuttal 10:11 Michigan Sen. Elissa Slotkin delivered the Democratic response to President Trump's address to a joint session of Congress Tuesday night, and warned that the first weeks of his new administration have brought "reckless" approaches to the economy and foreign affairs.Slotkin spoke for roughly 10 minutes in front of a backdrop of American flags following Mr. Trump's nearly two-hour, often campaign-style speech.What did Slotkin say in her response to Trump's speech? "America wants change, but there's a responsible way to make change and a reckless way," Slotkin said.Slotkin pointed to perhaps the most well-known member of Mr. Trump's team, Elon Musk. The world's richest person was lauded by the president for leading the Department of Government Efficiency, or DOGE, a newly-branded agency tasked with dramatically shrinking the size of the federal government."In order to pay for his plan, he may very well come after your Social Security," Slotkin said, referring to a comment Musk made recently calling the popular program a "Ponzi scheme." Slotkin said the president should be focused on bringing "down the price of things," listing groceries, housing and health care."The president talked a big game on the economy, but it's always important to read the fine print. So do his plans actually help Americans get ahead? Not even close," Slotkin said, before recounting a claim frequently made about Trump's relationship with Musk and other ultra-wealthy supporters. "President Trump is trying to deliver an unprecedented giveaway to his billionaire friends. He's on the hunt to find trillions of dollars to pass along to the wealthiest in America."She accused President Trump of levying tariffs that will ultimately lead to steeper prices for Americans,"His tariffs on allies like Canada will raise prices on energy, lumber, and cars and start a trade war that will hurt manufacturing and farmers," Slotkin said. "Your premiums and prescriptions will cost more because the math on his proposals doesn't work without going after your health care." Trump said earlier Tuesday that "tariffs are not just about protecting American jobs, they're about protecting the soul of our country."Slotkin, a former CIA officer, also harshly rebuked Mr. Trump's approach to foreign policy, honing in on the televised argument last week between Mr. Trump and Ukrainian President Volodymyr Zelenskyy. "President Trump loves to say peace through strength. That's actually a line he stole from Ronald Reagan. But let me tell you, after the spectacle that just took place in the Oval Office last week, Reagan must be rolling in his grave," Slotkin said, implying Reagan would be more supportive of an adversary to Russia than Mr. Trump has been to Ukraine.Mr. Trump said during his address that he is "working tirelessly to end the savage conflict in Ukraine."Who is Elissa Slotkin? Slotkin was elected to the Senate in November. She previously represented Michigan in the House since 2019. The 48-year-old worked in national security roles in both the Bush and Obama administrations. Why did the Democrats choose Slotkin to deliver their response?As Slotkin noted in her speech, she and Mr. Trump both won in Michigan during November's election. While serving in the House, she had a reputation for working across the aisle, and promised on the campaign trail to continue her bipartisan efforts in the Senate.Slotkin cited her bipartisan credentials, nodding to the "shared values" in her upbringing, which she said "were bigger than any one party."Slotkin urged Americans not to "tune out," saying "America needs you more than ever."She said voters must hold elected officials accountable by going to town halls, organizing and taking action.Slotkin said it's not "the first time we've experienced significant and tumultuous change as a country." Slotkin later added that the nation has only survived those moments because of "engaged citizens and principled leaders."Kaia Hubbard contributed reporting for this story. More from CBS News Wisconsin audit of Trump election win finds zero voting machine errors MN House rejects bill banning transgender athletes from girls' sports AG Keith Ellison joins other states in suing Trump the administration Farmers say Trump's tariffs will have big impacts Minnesota Gov. Tim Walz is not ruling out presidential run in 2028 .component--type-recirculation .item:nth-child(5) { display: none; } #inline-recirc-item--id-b0e669c5-1939-47a4-8faf-ee0a56858761, #right-rail-recirc-item--id-b0e669c5-1939-47a4-8faf-ee0a56858761 { display: none; } #inline-recirc-item--id-b0e669c5-1939-47a4-8faf-ee0a56858761 ~ .item:nth-child(5) { display: block; } Graham Kates Graham Kates is an investigative reporter covering criminal justice, privacy issues and information security for CBS News Digital. Contact Graham at KatesG@cbsnews.com or grahamkates@protonmail.com © 2025 CBS Interactive Inc. All Rights Reserved.'''
