full_description = '''Eye Opener: President Trump addresses Congress President Trump defends his agenda in a long speech to Congress as his tariff war heats up. Also, tornadoes cause havoc in the deep South, with those storms now moving East. All that and all that matters in today's Eye Opener. 3H ago 01:58 Eye Opener: President Trump addresses Congress Latest Videos Understanding "rage bait" and how it works Some influencers use "rage bait" to spark anger and boost engagement, often spreading misinformation in the process. Media studies professor Jamie Cohen joins to explain how to spot and avoid these tactics. 1H ago 03:57 "Sin City Gigolo" investigates shocking murder A former star of Showtime's "Gigolos" was arrested and charged with murder, a real-life crime that stunned viewers years after the show ended. The new Paramount+ docuseries "Sin City Gigolo: A Murder in Las Vegas" uncovers the dark truth behind the case. Executive producer Jay Blumenfield joins "CBS Mornings Plus" to discuss. 1H ago 04:19 Skier chases Olympic gold As the Special Olympics Winter World Games begin in Torino, Italy, CBS News Minnesota's Marielle Mohs shares the story of a skier who proves it's never too late to follow your dreams. 1H ago 02:52 Breaking down Trump's joint address President Trump's joint address to Congress resembled a campaign speech, promising a new "golden age" while criticizing Joe Biden. He highlighted early executive actions, from trade tariffs to Ukraine-Russia peace talks. Trump received standing ovations from Republicans, while Democrats largely remained seated, some in protest. CBS News political contributors Joel Payne and Terry Sullivan join to analyze. 1H ago 08:18 Actor uses carpentry to change lives Actor Nick Offerman, known for playing master woodworker Ron Swanson on "Parks and Recreation," is a director of the nonprofit "Would Works." The program teaches carpentry skills to young people facing hardships, helping them build careers and stability. Adam Y