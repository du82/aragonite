["https://cbsnews.com/news/how-watch-trump-speech-address-congress-2025"]
title = "Watch Trump's speech for his 2025 joint address to Congress — full video - CBS News"
description = "President Trump addressed a joint session of Congress in his first speech to both chambers since he returned to office. Here&#039;s how to watch his 2025 address."
full_description = '''Politics Watch Trump's speech for his 2025 joint address to Congress — full video By Kaia Hubbard Updated on: March 5, 2025 / 8:33 AM EST / CBS News Watch: Trump's full address to Congress Watch: Trump's full address to Congress 01:38:33 Washington — President Trump addressed a joint session of Congress Tuesday night, marking the first time he spoke before both chambers since he returned to office six weeks ago. Presidents typically address a joint session of Congress early in their tenure to outline a vision or agenda. The first speech before lawmakers is not technically a State of the Union, but rather an Address to a Joint Session of Congress.As is customary, House Speaker Mike Johnson in January invited Mr. Trump to address Congress and "share his America First vision for our future." During his speech, Mr. Trump said "America is back," while touting the actions he has taken since the start of his second term. How to watch Trump's full speech Watch President Trump's full address to the joint session of Congress in the video player above. CBS News carried the president's address and the Democratic response live in a primetime special beginning at 9 p.m. ET Tuesday night. The full speech, Democratic response, and CBS News analysis was also streamed on CBS News 24/7, on CBSNews.com, the free CBS News app and Paramount+.What time did Trump's speech start and end?The president's address was began shortly after 9 p.m. ET and lasted about 1 hour and 40 minutes, including pauses for clapping, applause and other reactions. It was the longest address to a joint session of Congress since at least 1964, including State of the Union speeches, according to The American Presidency Project by the University of California, Santa Barbara.During his first term, Mr. Trump's 2017 joint address to Congress ran about one hour. Over the next three years, his State of the Union addresses averaged 80 minutes, according to the American Presidency Project.The theme of Mr. Trump's address was "The Renewal of the American Dream," and it included highlights of what his administration has done so far, including economic policy, border security and foreign policy plans. The president said in a post on Truth Social late Monday that he would "TELL IT LIKE IT IS!" The president's speech was followed by the official Democratic response, delivered by Sen. Elissa Slotkin of Michigan.Context to know for Trump's address to CongressMr. Trump's address to Congress came six weeks after he returned to office for a second term. So far, Americans agree that he is making major changes to how the government works, though there's a divide on whether they view the changes as better or worse, according to CBS News polling released Sunday. The president has pursued a dramatic overhaul of the federal bureaucracy and a cost-cutting effort alongside Elon Musk, who he's tapped to lead the Department of Government Efficiency, or DOGE. DOGE has been working with Cabinet department and agency heads to shrink the government workforce, while halting swaths of government spending. A number of Democrats are bringing former government employees fired as a result of the DOGE cuts as their guests to Tuesday's address to highlight the individuals personally impacted. The Trump administration in its first six weeks has also worked to bolster border security with a government-wide immigration crackdown, and illegal border crossings were significantly down during Mr. Trump's first month in office. Still, the administration has faced obstacles in its efforts to conduct what it's billed as the largest deportation operation in American history in the U.S. interior. Top Immigration and Customs Enforcement officials have been reassigned in recent weeks amid frustrations that the agency has not carried out sufficient arrests and deportations. ICE's detention capacity has also been stretched thin, with detention centers recently filled at levels above 110%.While Mr. Trump's approach to immigration has received support in recent polling, Americans overwhelmingly say he should prioritize inflation and the economy. At the same time, the president has pursued tariffs that have prompted fears of a trade war among businesses and consumers. On Tuesday, 25% tariffs on Canada and Mexico and higher levies on goods from China took effect, prompting retaliatory actions in response.Meanwhile, Republicans in Congress have been pursuing legislation to support Mr. Trump's agenda, facing headwinds with a narrow majority in the House and differing views on the path forward. Last week, the House adopted a budget resolution that paves the way for implementing the president's agenda on border security, defense and energy priorities, while extending the 2017 tax cuts. But it's not yet clear how the budget blueprint will fare in the Senate, where lawmakers have pursued a different approach. Mr. Trump's return to the White House has also had serious implications on the world stage even in the first six weeks. Last week, a meeting with Ukrainian president Volodymyr Zelenskyy devolved into a feud with Mr. Trump and Vice President JD Vance, and Zelenskyy was ultimately asked to leave the White House without signing a critical multibillion-dollar rare earth minerals deal. On Monday, the White House said it was pausing military aid to Ukraine. The contentious meeting came after Mr. Trump had appeared to blame Ukraine for the war Russia started and labeled Zelenskyy a "dictator," while declining to say the same of Russian President Vladimir Putin. The U.S. has provided Ukraine with billions in weapons since the Russian invasion three years ago, and a split with Zelenskyy may have major implications for its ability to defend itself. Sara Cook contributed to this report. More from CBS News Democrats invite fired federal workers to Trump's address to Congress See who Melania Trump invited to President Trump's speech to Congress Who was the designated survivor for Trump's 2025 joint address to Congress? Congressman Al Green of Texas removed from Trump's speech amid protest .component--type-recirculation .item:nth-child(5) { display: none; } #inline-recirc-item--id-1a5f6c41-7dba-4600-a468-213a43c461da, #right-rail-recirc-item--id-1a5f6c41-7dba-4600-a468-213a43c461da { display: none; } #inline-recirc-item--id-1a5f6c41-7dba-4600-a468-213a43c461da ~ .item:nth-child(5) { display: block; } In: United States Congress Donald Trump Kaia Hubbard Kaia Hubbard is a politics reporter for CBS News Digital, based in Washington, D.C. Twitter © 2025 CBS Interactive Inc. All Rights Reserved.'''
