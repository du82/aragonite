full_description = '''3/2: Face the Nation This week on "Face the Nation with Margaret Brennan," as fallout continues from the unprecedented Oval Office meeting between President Trump and Ukrainian President Volodymyr Zelenskyy, Margaret Brennan speaks to Treasury Secretary Scott Bessent, GOP Reps. Mike Turner and John James and Democratic Sen. Mark Kelly. Mar 2 45:29 3/2: Face the Nation Latest Videos Trump approval rating at 51%, new CBS News poll shows President Trump's approval rating in the latest CBS News polling is 51% — still in positive territory, but by a smaller margin than a month ago. CBS News director of elections and surveys Anthony Salvanto joins "Face the Nation with Margaret Brennan" to break down the latest polling. Mar 2 03:17 James: Zelenskyy "fumbled the bag" in meeting Republican Rep. John James of Michigan tells "Face the Nation with Margaret Brennan" that while "Russia is the aggressor" and President Vladimir Putin is a "war criminal," Ukrainian President Volodymyr Zelenskyy "fumbled the bag pretty hard" in the White House meeting with President Trump. "All those things can be true at the exact same time," James said. Mar 2 06:44 Ukraine's Zelenskyy attends European summit in London Ukrainian President Volodymyr Zelenskyy arrived in London this weekend for summit of European leaders after the unprecedented Oval Office meeting between him and President Trump ended in chaos and Zelenskyy kicked out of the White House, America's alliance with Ukraine appears ruptured as Zelenskyy defends his nation against Russia. Imtiaz Tyab reports from Kyiv. Mar 2 02:04 Kelly: Trump-Zelenskyy meeting a "dumpster fire of diplomacy" Democratic Sen. Mark Kelly of Arizona tells "Face the Nation with Margaret Brennan" that the heated Oval Office meeting between President Trump and Ukrainian President Volodymyr Zelenskyy was a "dumpster fire of diplomacy" after Zelenskyy was "cornered" and "bullied." Mar 2 07:41 Turner: Oval Office meeting "should have been a win" for Zelenskyy GOP Rep. Mike Turner of Ohio tells "Face the Nation with Margaret Brennan" that it the Oval Office meeting between President Trump and Ukrainian President Volodymyr Zelenskyy "should have been a win" for Zelenskyy, but Turner alleged that Zelenskyy "turned it into a debate on American security guarantees during a peace negotiation." Mar 2 07:13'''
