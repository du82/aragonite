can Nightmare" survivors Denise Huskins, Aaron Quinn use their trauma to help retrain law enforcement In an exclusive interview, Huskins and Quinn take us through his interrogation, showing us step-by-step how old-school interrogation training led to their "American Nightmare." Feb 10'''
