["http://www.ccc.de/en/pressemitteilungen"]
title = "CCC | Pressemitteilungen des CCC"
description = "Der Chaos Computer Club ist eine galaktische Gemeinschaft von Lebewesen für Informationsfreiheit und Technikfolgenabschätzung."
full_description = "Das Bündnis „Bits & Bäume“ fordert eine wirksame Mitsprache der Zivilgesellschaft bei der Digitalisierung, demokratische Kontrolle digitaler Infrastrukturen sowie eine globale gerechte Digitalwirtschaft. Digitalpolitik muss aus dem Muff der 1990er gehievt und endlich in den Dienst von Mensch und Umwelt gestellt werden. more … Mit bedeutungsschwangerer Cyber-Rhetorik will d-trust von der Verantwortung für ein großes Datenleck ablenken. Der CCC erklärt die Hintergründe und fordert Konsequenzen. more … Die Verantwortlichen der elektronischen Patientenakte müssen die auf dem 38. Chaos Communication Congress demonstrierten Sicherheitslücken endlich schließen. Der Chaos Computer Club schließt sich einem offenen Brief an, in dem 28 Organisationen aus dem Gesundheitswesen und der Zivilgesellschaft Bundesgesundheitsminister Lauterbach auffordern, Transparenz im gesamten Prozess der ePA herzustellen. more … The Chaos Computer Club (CCC) supports the three hackers who explained in detail at 37C3 how the Polish rail vehicle manufacturer Newag had manipulated its trains in such a way that they could only be repaired in the company's own workshops. The manufacturer reacted to the publications with an attitude not seen since the 90s and sued the hackers under both criminal and civil law. At 38C3, the hackers are now reporting on their legal odyssey, which cost so far around 30,000 euros. The CCC is calling for donations to cover the legal and other resulting costs incurred so far. more … Sicherheitsmängel begleiten die elektronische Patientenakte (ePA) seit ihrer Einführung im Jahr 2020. Mit der Umstellung von Opt-In auf Opt-Out kommt nun die Patientenakte „für alle“: Gesundheitsdaten von über 70 Millionen Versicherten werden ohne deren Zutun über Praxis- und Krankenhausgrenzen hinweg in einer zentralen Datenbank zusammengeführt. Doch auch die „ePA für alle“ kann ihre Sicherheitsversprechen nicht halten. Beim 38C3 wird demonstriert, wie unberechtigte Personen mit wenig Aufwand massenhaften Zugang zur ePA für alle erlangen können. more …"
year_published = 2025
