["http://www.ccc.de/de/updates/2024/38c3-call-for-participation"]
title = "CCC | 38C3: Call for Participation hat begonnen"
description = "Der Chaos Computer Club ist eine galaktische Gemeinschaft von Lebewesen für Informationsfreiheit und Technikfolgenabschätzung."
full_description = 'Die Vorbereitungen für den 38. Chaos Communication Congress sind im vollen Gange und wir freuen uns, euch dazu einzuladen, mit uns das Konferenzprogramm auf den Bühnen zu gestalten, das von Zehntausenden in den Sälen und an den Streams verfolgt wird. Die Vorbereitungen für den 38. Chaos Communication Congress sind im vollen Gange und wir freuen uns, euch dazu einzuladen, mit uns das Konferenzprogramm auf den Bühnen zu gestalten, das von Zehntausenden in den Sälen und an den Streams verfolgt wird. Wir haben Platz für rund 120 Vorträge, Aufrufe, Performances und Spielshows, auf den sich Hackerinnen, Technikfreaks, Bastlerinnen, Künstlerinnen, Utopistinnen mit Sendungsbewusstsein ab jetzt mit ihren Vortragsideen bewerben können. Kuratiert werden die Vorträge von fünf Teams, die sich für jeweils einen der Tracks Art & Beauty, Ethics, Society & Politics, Hardware, Science und Security begeistern und für die Teilnehmerinnen die Perlen herauspicken wollen. Eine ausführliche Version des Calls findet ihr hier, bitte lest die Hinweise dort und auf der Hilfeseite unserer Instanz des Planungssystems pretalx aufmerksam durch, um sicherzustellen, dass eure Einreichung angemessen gewürdigt und ausgewählt wird. Einreichungsende ist der 26. Oktober 2024. Wir warten voller Vorfreude auf eure Ideen, den Congress zu bereichern. Bei Nachfragen wendet euch gern an 38c3-content@cccv.de und behaltet für alle Neuigkeiten zum Congress unser Events-Blog im Auge. Der Chaos Communication Congress ist die jährliche Konferenz und Hackerparty des Chaos Computer Clubs (CCC) und dessen 38. Ausgabe findet dieses Jahr vom 27. bis zum 30. Dezember 2024 unter dem Motto "Illegal Instructions" im CCH in Hamburg statt. An vier Tagen zwischen Weihnachten und Neujahr kommen tausende Hackerinnen, Technikfreaks, Bastlerinnen, Künstlerinnen, Utopistinnen oder einfach Interessierte in Hamburg zusammen, um sich auszutauschen, sich zuzuhören, voneinander zu lernen und miteinander zu feiern. Der Congress ist inzwischen die traditionsreichste deutsche IT-Sicherheitskonferenz, die größte europäische Zusammenkunft der Hackerszene und die wichtigste digitale Gesellschaftskonferenz.'
year_published = 2024
clearnet = "http://www.ccc.de/de/updates/2024/38c3-call-for-participation"
