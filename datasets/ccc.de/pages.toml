["https://ccc.de/en/hackerethik"]
title = "CCC | Hacker Ethics"
description = "Der Chaos Computer Club ist eine galaktische Gemeinschaft von Lebewesen für Informationsfreiheit und Technikfolgenabschätzung."
full_description = 'The hacker ethics were first written down by Steven Levy in his book "Hackers: Heroes of the Computer Revolution (ISBN 0-440-13405-6, 1984). He mentions the Tech Model Railroad Club at MIT, their members constructed a supersystem of relays and switches - some of them became core members of the ai lab. They used the term "hack" for an "elaborate ... prank" with "serious respect implied". The hacker ethics evolved in a time when computers were scarce; and the people sharing a machine had to think about rules of cooperation. The last two point are additions by the CCC from the 80s. After some more or less crazy individuals from the hacker scene had the idea of offering their "hacker know-how" to the KGB there were intense discussions, three letter agencies have a somewhat different opinion about freedom of information. As well were intrusions into outside systems considered more and more counter productive. To protect the privacy of the individual and to strengthen the freedom of the information which concern the public the yet last point was added. Hacker ethics are —like the rest of the world— as such in constant discussion and development. The above rules should be considered as guidelines and basis for discussion.'
year_published = 2025
clearnet = "https://ccc.de/en/hackerethik"
tags = ["calendar", "ethics", "featured", "hacker", "tags"]
language = "en"
