["http://www.ccc.de/de/updates/2024/wahlsoftware-offene-quellen-weniger-missverstandnisse"]
title = "CCC | Wahlsoftware: Offene Quellen – Weniger Missverständnisse"
description = "Der Chaos Computer Club ist eine galaktische Gemeinschaft von Lebewesen für Informationsfreiheit und Technikfolgenabschätzung."
full_description = "Der Chaos Computer Club fordert erneut öffentliche und transparente Wahl- und Auswertungssoftware. Die vorläufige Sitzverteilung im sächsischen Landtag musste nachträglich korrigiert werden, weil die eingesetzte Auswertungssoftware versagt hat. Der Vorgang nährt Misstrauen in das Wahlsystem und führt zur Verbreitung wilder Verschwörungstheorien. Die seit jeher gepflegte Intransparenz gießt Öl in dieses Feuer. Der Chaos Computer Club fordert erneut öffentliche und transparente Wahl- und Auswertungssoftware. Die vorläufige Sitzverteilung im sächsischen Landtag musste nachträglich korrigiert werden, weil die eingesetzte Auswertungssoftware versagt hat. Der Vorgang nährt Misstrauen in das Wahlsystem und führt zur Verbreitung wilder Verschwörungstheorien. Die seit jeher gepflegte Intransparenz gießt Öl in dieses Feuer. Die während einer Wahl abgegebenen Stimmen werden gesammelt und mittels verschiedener Verfahren elektronisch an das zentrale Büro des Landeswahlleiters übermittelt. Dort finden erste Berechnungen zur möglichen Sitzverteilung statt, deren Ergebnisse bereits an den Wahlabenden vorab veröffentlicht werden. Für diese ersten Auswertungen der zusammengeführten Daten werden üblicherweise Programme verwendet, die die festgelegten mathematischen Algorithmen anwenden, um schnell und zuverlässig vorläufige Ergebnisse bereitzustellen. Die Algorithmen für das Sitzberechnungsverfahren in Sachsen wurden zuletzt 2022 in einer Wahlreform geändert und festgelegt. Aufgrund der restriktiven Informationspolitik des Landeswahlleiters ist der Name und die Version der eingesetzten Wahlauswertungs-Software nicht bekannt. Allerdings lässt das erst kürzlich geänderte Sitzberechnungsverfahren den Schluss zu, dass das aktuelle Verfahren entweder nicht oder nur fehlerhaft implementiert wurde. Zugrunde liegende Fehler könnten einfache arithmetische „Missverständnisse“ sein, Rundungsfehler oder schlicht eine stümperhafte Implementierung. Wie jede Software ist auch Wahlsoftware für Fehler anfällig. In der Software-Entwicklung versucht man, solchen Fehlern durch eingehende unabhängige Prüfung und Transparenz entgegenzuwirken. Einerseits sollen Fehler so auffindbar und behebbar werden, andererseits sollen sie sich auch nachvollziehen lassen, wenn sie auftreten."
year_published = 2024
