["https://ccc.de/de/netzneutralitaet"]
title = "CCC | Netzneutralität"
description = "Der Chaos Computer Club ist eine galaktische Gemeinschaft von Lebewesen für Informationsfreiheit und Technikfolgenabschätzung."
full_description = "Die Einschränkung der Netzneutralität aus kommerziellen oder rechtlichen Gründen und die damit einhergehende Diskriminierung von Daten birgt große Gefahren für die Freiheiten im Internet. Der Chaos Computer Club (CCC) setzt sich für die Beibehaltung der Netzneutralität ein. Die Einschränkung der Netzneutralität aus kommerziellen oder rechtlichen Gründen und die damit einhergehende Diskriminierung von Daten birgt große Gefahren für die Freiheiten im Internet. Der Chaos Computer Club (CCC) setzt sich für die Beibehaltung der Netzneutralität ein. Die Chaosradio-Sendung 150 Netzneutralität – Alle Pakete sind gleich! Aber sind einige gleicher? eignet sich gut als Einstieg in die Thematik. Erklärt wird Echtes Netz auch beim 28c3 zum Start der Kampagne für Netzneutralität. Der Chaos Computer Club bietet auch selbst auf nicht-kommerziellen Plattformen Audio- und Videodateien an, beispielsweise unter media.ccc.de oder als Streaming-Dienst bei vielen seiner Veranstaltungen sowie zahlreiche Podcasts. In einer Stellungnahme zum Zero-Rating-Angebot „Vodafone Pass“ haben wir die strukturelle Benachteiligung von kommerzfreien Angeboten bei Aufgabe des Prinzips der Netzneutralität begründet. Grundlage der Argumente all jener, die die innovationsfördernde Architektur des Internets erhalten wollen, ist die Feststellung, daß das Internet aufgrund des End-to-End-Prinzips ein neutrales Netzwerk darstellt, das nicht in der Lage ist, Anwendungen an seinen Rändern auszuschließen oder ihre Ausführung zu behindern. Gegenläufig dazu wird es Netzbetreibern im Zuge neuer technologischer Entwicklungen möglich, bestimmte Anwendungen unter Verletzung der End-to-End-Architektur des Internets zu diskriminieren. (S. 49) If I pay to connect to the Net with a certain quality of service, and you pay to connect with that or greater quality of service, then we can communicate at that level. Implizit steht dahinter eine technische Sicht, die fordert, daß Kommunikation mit der größtmöglichen Dienstqualität vom Netz weitergeleitet wird, nicht weniger."
year_published = 2025
