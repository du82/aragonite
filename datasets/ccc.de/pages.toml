["https://ccc.de/de/faq"]
title = "CCC | FAQ"
description = "Der Chaos Computer Club ist eine galaktische Gemeinschaft von Lebewesen für Informationsfreiheit und Technikfolgenabschätzung."
full_description = "A: Der Chaos Computer Club ist eine galaktische Gemeinschaft von Lebewesen, unabhängig von Alter, Geschlecht und Abstammung sowie gesellschaftlicher Stellung. Diese Gemeinschaft setzt sich grenzüberschreitend für Informationsfreiheit und ein Menschenrecht auf ungehinderte Kommunikation ein. Der Chaos Computer Club versteht sich als ein Forum der Hackerszene, eine Instanz zwischen Hackern, Systembetreibern, Politikern und der Öffentlichkeit. Organisiert ist der Chaos Computer Club in einem Verein nach deutschem Recht – hauptsächlich, um nicht als terroristische Vereinigung zu gelten. A: Seine Satzung betreffend: ja. Allerdings ist der CCC nicht vom Finanzamt als gemeinnützig anerkannt. Eine Spendenbescheinigung für die Mitgliedsbeiträge gibt es also nicht. Wir sehen uns jedoch durchaus als nützlich für die Gesellschaft an und verwenden Spendengelder für sinnvolle Projekte und Veranstaltungen. A: Man wird Hacker, wenn man neben den benötigten Kenntnissen über informationstechnische Systeme die Hackerethik verinnerlicht hat. A: Nein. Der CCC ist kein Dienstleister. Um unsere Neutralität zu wahren, werden wir Dir auch keinen Dienstleister empfehlen. A: Nein, musst Du natürlich nicht. Komm einfach vorbei und hab Spaß. Viele Erfas und Chaostreffs haben spezielle Tage, an denen Neulinge vorbeigucken und reinschnuppern können. A: Die Mitgliedschaft im Chaos Computer Club e. V. steht allen Personen offen, die sich mit den in der Satzung formulierten Zielen und der Hackerethik identifizieren. Wir verstehen uns jedoch als Forum unserer Mitglieder, nicht als deren Unterhaltungszentrale – Eigeninitiative ist gefragt. Formalitäten können in den Informationen zur Mitgliedschaft nachgelesen werden. A: Ja. Dazu einfach das (möglicherweise) vorausgefüllte, ausgedruckte Formular verschenken und von der Beschenkten unterschreiben und einsenden lassen. Wir kommunizieren nur mit dem Mitglied, das Dir dann seinen Chaos Transaction Token (CTT) nennen muss. In den Verwendungszweck der Überweisung (oder gleich des Dauerauftrages) für den Fördermitgliedsbeitrag muss dann dieser CTT eingetragen werden."
