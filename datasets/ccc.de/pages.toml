["https://ccc.de/de/membership"]
title = "CCC | Fördermitgliedschaft im CCC"
description = "Der Chaos Computer Club ist eine galaktische Gemeinschaft von Lebewesen für Informationsfreiheit und Technikfolgenabschätzung."
full_description = "Als Fördermitglied erhält man die unregelmäßig erscheinende Clubzeitschrift, die Datenschleuder, frei Haus. So wird man auf informative und unterhaltsame Weise über die Aktivitäten von Mitgliedern des CCC informiert. Die Fördermitgliedschaft im Chaos Computer Club steht allen natürlichen Personen offen. Sie fördert die tägliche Arbeit sowie Projekte und Infrastruktur des CCC und beinhaltet den Bezug der Datenschleuder. Fülle dieses Antragsformular aus und sende es uns per Post oder vorzugsweise E-Mail zu. Bitte die Unterschrift nicht vergessen! Zur Bestätigung gibt es nach der Eintragung in unsere Datenbank eine E-Mail, sofern eine E-Mail-Adresse angegeben und fehlerfrei lesbar war. Als schriftliche Bestätigung erhältst Du dann gemeinsam mit allen anderen die nächste Ausgabe der Datenschleuder in alter Chaos-Tradition per „gelber Post“. Bitte bei Überweisungen im Verwendungszweck den individuell zugewiesenen Chaos Transaction Token eintragen. Ohne den CTT wird es schwierig, die Zahlungen Deiner Fördermitgliedschaft zuzuordnen. Solltest Du drei Monate nach erfolgter Überweisung noch nichts von uns gehört haben, melde dich bitte direkt in der Mitgliederverwaltung."
year_published = 2025
