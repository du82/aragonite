["https://ccc.de/de/vorratsdatenspeicherung"]
title = "CCC | Vorratsdatenspeicherung"
description = "Der Chaos Computer Club ist eine galaktische Gemeinschaft von Lebewesen für Informationsfreiheit und Technikfolgenabschätzung."
full_description = "Unter Vorratsdatenspeicherung (englisch: data retention, im deutschen Sprachgebrauch des Bundesministeriums des Innern mitunter auch „Mindest-Speicherfrist“) wird die gesetzliche Verpflichtung gegenüber Telekommunikationsanbietern verstanden, - im Kontext von Telefonie Verkehrsdaten (also welcher Teilnehmer wann mit wem wie lange eine Verbindung unterhielt) und - im Kontext von Internet-Service-Providern die jeweils an einen Teilnehmer zeitlich begrenzt vergebene (dynamische) IP-Nummer zu speichern. Zu trennen ist die Vorratsdatenspeicherung von der Speicherungsverpflichtung der sogenannten Bestandsdaten, d. h. der Daten, die Aufschluss über den Inhaber eines Telekommunikationsanschlusses zulassen. Der Chaos Computer Club ist klarer Gegner der Vorratsdatenspeicherung und gegen eine Verpflichtung zum Speichern von Daten, aus denen sich sensible Lebensumstände bzw. Geschäftsverbindungen ableiten lassen, die sich wiederum klar gegen die Interessen des Inhabers im Sinne der informationellen Selbstbestimmung verwenden lassen. Die Verfassungswidrigkeit der Vorratsdatenspeicherung wurde durch das Bundesverfassungsgericht im Jahr 2010 festgestellt. Die damalige EU-Kommissarin für Innenpolitik, Cecilia Malmström, verteidigte die EU-Richtlinie zur Vorratsdatenspeicherung, welche die Grundlage des verfassungswidrigen deutschen Gesetzes war. Auch die EU-Richtlinie ist später vom Europäischen Gerichtshof als rechtswidrig erkannt worden. Der Chaos Computer Club hatte die Aufklärung des Sachverhaltes durch das Bundesverfassungsgericht 2009 mit einem Gutachten unterstützt. Frank Rieger, Sprecher des CCC, hat eine allgemeinverständliche Erklärung zur Vorratsdatenspeicherung geschrieben, die vor dem Urteil des BVerfG am 2. März 2010 erschien. Am 22. September 2022 endete das jahrelange Gezerre um die im Jahr 2015 neuaufgelegte deutsche Vorratsdatenspeicherung mit einem Urteil des Europäischen Gerichtshofs. Er bestätigte seine bisherige Rechtsprechung aus mehreren Urteilen, die andere europäische Länder betrafen, und erklärte die deutschen Regelungen zur Vorratsdatenspeicherung für nicht mit europäischem Recht vereinbar."
year_published = 2025
clearnet = "https://ccc.de/de/vorratsdatenspeicherung"
