["https://ccc.de/de/tags/datenspuren"]
title = "CCC | Chaos Computer Club"
description = "Der Chaos Computer Club ist eine galaktische Gemeinschaft von Lebewesen für Informationsfreiheit und Technikfolgenabschätzung."
full_description = 'Eines der Hauptwerkzeuge zum Erfahrungsaustausch zwischen den Hackern, die sich zum Chaos Computer Club zugehörig fühlen, sind die zahlreichen Veranstaltungen, die organisiert werden von den Erfas, Chaostreffs und einer riesigen Schar freiwilliger "OC" genannter Gruppen. Wir schreiben das Jahr 2009. Nach Lidl kommen weitere deutsche Großunternehmen durch Überwachungsskandale in die Schlagzeilen. Hinzu kommen Maßnahmen der Bundesregierung zur Überwachung der Bürger: Gesundheitskarte, elektronischer Personalausweis, Vorratsdatenspeicherung. Und die Liste wird mit jeder Legislaturperiode länger, zu lang, wie wir finden. Deshalb ruft der Chaos Computer Club Dresden zum sechsten Mal in Folge zur Beteiligung an den Datenspuren auf. Auftaktveranstaltung zur Vortragsreihe „Digitale Verhütung“ mit einem Vortrag zu „Private Datenspuren“. Der Chaos Computer Club Dresden lädt am kommenden Wochenende zum Symposium Datenspuren ins Kulturzentrum Scheune ein.'
