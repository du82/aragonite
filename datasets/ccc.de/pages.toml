full_description = 'Der Chaos Computer Club (CCC) veranstaltet im Sommer, vom Freitag, den 5. Juli, bis zum Sonntag, den 7. Juli 2013, die Hackerkonferenz SIGINT im Mediapark in Köln. Die SIGINT richtet sich an Hackerinnen, Netzbewohnerinnen und Aktivistinnen, steht aber auch allen anderen interessierten Menschen offen. Vom 18. bis 20. Mai 2012 findet in Köln die SIGINT, die Konferenz für Hacker, Netzbewohner und Aktivisten, statt. Du möchtest Dich informieren, Dich mit anderen Aktiven zusammenschließen? Du möchtest nicht, daß alles so bleibt, wie es ist? Dann komm vorbei: Der Chaos Computer Club veranstaltet auch dieses Jahr wieder die SIGINT vom 22. bis 24. Mai 2010 in Köln. Eines der Hauptwerkzeuge zum Erfahrungsaustausch zwischen den Hackern, die sich zum Chaos Computer Club zugehörig fühlen, sind die zahlreichen Veranstaltungen, die organisiert werden von den Erfas, Chaostreffs und einer riesigen Schar freiwilliger "OC" genannter Gruppen.'
