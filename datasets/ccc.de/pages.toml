["https://ccc.de/de/tags/Pressemitteilung"]
title = "CCC | Chaos Computer Club"
description = "Der Chaos Computer Club ist eine galaktische Gemeinschaft von Lebewesen für Informationsfreiheit und Technikfolgenabschätzung."
full_description = "Der Chaos Computer Club (CCC) deckt auf, dass der Volkswagen-Konzern Bewegungsdaten von hunderttausenden Fahrzeugen der Marken VW, Audi, Skoda und Seat systematisch erfasst und über lange Zeiträume speichert. Die Daten, einschließlich Informationen über Fahrzeughalter:innen, waren zudem ungeschützt im Internet zugänglich. Der Schutz personenbezogener Daten ist uns wichtig. Deshalb haben wir mal wieder ein Unternehmen freundlich auf ein massives Datenleck hingewiesen – ungeachtet der möglichen juristischen Konsequenzen durch den Hacker-Paragraphen. Das Recherchezentrum „Correctiv“ hat die Deportationspläne von Mitgliedern der AfD, CDU und Identitären Bewegung bei einem konspirativen Treffen in Potsdam enthüllt. Nun greift die Partei AfD in ihrem Mitgliederblatt die Journalistinnen persönlich an. Der CCC verurteilt diesen Angriff auf kritische Berichterstattung über antidemokratische Entwicklungen. In der heutigen Anhörung des Digitalausschusses wenden sich alle geladenen Sachverständigen gegen die geplante EU-Verordnung zur Chatkontrolle. Der CCC veröffentlicht seine schriftliche Stellungnahme. Das US-Militär hat massenhaft Geräte zur biometrischen Erfassung von Menschen in Afghanistan genutzt. Einige Geräte wurden beim hastigen Abzug der NATO-Truppen zurückgelassen. Forscher des CCC haben bei Analysen solcher Geräte große Mengen an biometrischen und weiteren personenbezogenen Daten gefunden. In den falschen Händen bedeuten diese Daten Lebensgefahr für Menschen in Afghanistan und Irak. Völlig überraschend ist die SPD umgekippt. Nun kann noch die FDP die Chatkontrolle stoppen. Sie müsste sich dafür jedoch an ihr Positionspapier und ihre Beschlüsse halten. Zusammen mit dem Netzwerk European Digital Rights (EDRi) veröffentlicht der CCC ein umfassendes Positionspapier: „A safe Internet for all: upholding private and secure communications“ und erklärt, wie fehlgeleitet der Verordnungsentwurf ist. Der CCC sieht sich gezwungen, auch in diesem Jahr auf den Chaos Communication Congress zu verzichten. Stattdessen rufen wir lokale Gruppen zu dezentralen und unabhängigen Alternativ-Events auf. Das Chaos Communication Camp wird vom 15. bis 19. August 2023 in Mildenberg stattfinden."
year_published = 2025
clearnet = "https://ccc.de/de/tags/Pressemitteilung"
