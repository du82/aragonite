["https://ccc.de/de/tags/datenschutz"]
title = "CCC | Chaos Computer Club"
description = "Der Chaos Computer Club ist eine galaktische Gemeinschaft von Lebewesen für Informationsfreiheit und Technikfolgenabschätzung."
full_description = "Der Chaos Computer Club (CCC) hat seit Beginn seines Bestehens die Chancen und Möglichkeiten, die das vernetzte Leben mit sich bringt, erkannt und propagiert. Viele der ursprünglichen – damals noch futuristisch anmutenden – Visionen sind inzwischen nicht nur Realität, sondern Selbstverständlichkeiten in der Mitte der Gesellschaft geworden. Der Einzug des Internets in den Alltag fast der gesamten Bevölkerung hat uns Datenschutzsorgen gebracht, aber auch zu einer Demokratisierung, einer Bereicherung aus wissenschaftlicher, sozialer und künstlerischer Sicht geführt. Die Selbstheilungskräfte des Internets haben dabei viele befürchtete dystopische Auswüchse ohne staatliches Eingreifen verhindern können. Aus unserer Sicht liegt der aktuellen Diskussion eine Fehleinschätzung zugrunde, an welchen Stellen Regulierungsbedarf notwendig ist und an welchen nicht. Chaos macht Schule ist eine seit etwa 2007 bestehende Initiative mehrerer Erfa-Kreise des Chaos Computer Clubs (CCC), die mit verschiedenen Bildungsinstitutionen zusammenarbeiten. Ziel des Projekts ist es, Schüler, Eltern und Lehrer in den Bereichen Medienkompetenz und Technikverständnis zu stärken. Zum 4. Europäischen Datenschutztag konkretisiert der Chaos Computer Club (CCC) seine Forderung nach einem Datenbrief. Der Gesetzgeber ist nun gefordert, damit jeder Bürger wieder sein informationelles Selbstbestimmungsrecht in die eigene Hand nehmen kann. Der Datenbrief ist eine Forderung des Chaos Computer Clubs (CCC), um die informationelle Selbstverteidigung des Bürgers zu stärken und die Anhäufung von personenbezogenen Daten möglichst unattraktiv zu machen. Er bietet die Chance, die Verarbeitung eigener persönlicher Daten besser zu überblicken und zu kontrollieren. Auf dem Fahndungsplakat des CCC werden Politiker wie Industrielle gesucht, die per Gesetz und Firmenphilosphie die Privatsphäre vieler verletzen und das Recht auf informationelle Selbstbestimmung einschränken. Das Bündnis aktiver Fußball-Fans (BAFF) trifft sich vom 17.-19. Dezember in Oer-Erkenschwick. Hauptthema ist Datenschutz und Überwachung. Geplant ist, die Tickets zu den Spielen der Fußball-Weltmeisterschaft in Deutschland mit RFID-Chips auszustatten."
year_published = 2025
