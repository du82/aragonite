["http://www.ccc.de/de/updates/2024/stopp-cybercrime-convention"]
title = "CCC | Cybercrime Convention: Überwachungsabkommen mit Missbrauchsgarantie"
description = "Der Chaos Computer Club ist eine galaktische Gemeinschaft von Lebewesen für Informationsfreiheit und Technikfolgenabschätzung."
full_description = "Die geplante Cybercrime Convention bei den Vereinten Nationen entpuppt sich als Überwachungsabkommen, das Menschenrechte mit Füßen tritt und weltweit IT-Sicherheitsfachleute und Journalisten gefährdet. Dieses Abkommen darf Europa nicht ratifizieren. Die geplante Cybercrime Convention bei den Vereinten Nationen entpuppt sich als Überwachungsabkommen, das Menschenrechte mit Füßen tritt und weltweit IT-Sicherheitsfachleute und Journalisten gefährdet. Dieses Abkommen darf Europa nicht ratifizieren. Schon 2022 warnte eine große Gruppe von weit über hundert NGOs, Menschenrechts- und Journalistenorganisationen sowie Tech-Unternehmensverbänden davor, die von Russland bei der UNO vorgeschlagene Cybercrime-Konvention zu beschließen. Dutzende Verbesserungsvorschläge, die Vertreter dieser Organisationen in den UN-Verhandlungsprozess einbrachten, wurden jedoch weitgehend ignoriert. Der am Donnerstag beschlossene Vertragstext ist ein gefährlicher Fehlschlag. Denn er enthält weiterhin breite Überwachungsvorgaben, die von den UN-Staaten umzusetzen wären, ohne diese Befugnisse jedoch durch rechtliche Mindeststandards abzusichern. Dazu gehören breite Befugnisse zur Echtzeit-Erfassung von Telekommunikationsmetadaten und das Abhören von Kommunikation. Das Abkommen soll als völkerrechtlicher Vertrag weltweit umgesetzt werden, also auch in Diktaturen, Autokratien und anderen Staaten, deren Menschenrechtsstandards und Schutzrechte unterdurchschnittlich sind. Viele dieser Staaten kennen weder Berufsgeheimnisse für Anwälte oder Ärzte noch garantieren sie ausreichende Schutzrechte für vertrauliche Informationen. Die weitreichenden Überwachungsmaßnahmen der Cybercrime-Konvention würden dort verpflichtend – ohne wirksamen rechtlichen Schutz von Betroffenen vorzuschreiben. Keiner der westlichen Staaten, die sonst gern ihren Einsatz für Menschenrechte betonen, hat in der letzten Verhandlungsrunde noch Versuche unternommen, diese Gefahren abzuwenden. Mindeststandards beim Datenschutz enthält der Vertragstext nicht, dafür aber eine Ausweitung der weltweiten Kooperation bei Strafverfolgern und Geheimdiensten."
year_published = 2024
clearnet = "http://www.ccc.de/de/updates/2024/stopp-cybercrime-convention"
