["http://www.ccc.de/de/publications"]
title = "CCC | Publikationen"
description = "Der Chaos Computer Club ist eine galaktische Gemeinschaft von Lebewesen für Informationsfreiheit und Technikfolgenabschätzung."
full_description = "Die Datenschleuder, das wissenschaftliche Fachblatt für Datenreisende, ist ein Organ des Chaos Computer Clubs. Die Zeitschrift erscheint unregelmäßig. CCC-Mitglieder erhalten die Datenschleuder im Rahmen ihrer Mitgliedschaft. Nichtmitglieder können die Datenschleuder auch abonnieren. Vergangene Ausgaben gibt es hier zum Download. Auf media.ccc.de werden alle Vortragsaufzeichnungen vom Congress, Camp und von vielen weiteren Veranstaltungen in hoher Qualität und werbefrei archiviert. In den vergangenen Jahren trat der CCC als Sachverständiger in Verfahren vor dem Bundesverfassungsgericht auf. Dabei wurde die Expertise in Sachen Wahlcomputer, Vorratsdatenspeicherung, Hackerparagraph, Staatstrojaner, BND-Gesetz, BKA-Gesetz sowie Big Data bei der Polizei angefragt. Unsere Stellungnahmen sind stets öffentlich. Die Stellungnahme zu einer Verfassungsbeschwerde gegen den „Hackerparagraph“ ist hier verfügbar. Eine Pressemitteilung gab es dazu auch. Hier die CCC-Stellungnahme zum Staatstrojaner „Quellen-TKÜ“ (Quellen-Telekommunikationsüberwachung). Älteren Datums, aber immer noch gern gelesen, sind unsere 1985 und 1988 erschienene Hackerbibeln 1 und 2, ein Sammelsurium aus Geschichten der Urzeit der Hackerszene. Die Hackbibel 3 ist eine Fortsetzung der Reihe im Jahr 2024."
year_published = 2025
clearnet = "http://www.ccc.de/de/publications"
