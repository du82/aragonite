["https://ccc.de/de/satzung"]
title = "CCC | Satzung des Chaos Computer Club e. V."
description = "Der Chaos Computer Club ist eine galaktische Gemeinschaft von Lebewesen für Informationsfreiheit und Technikfolgenabschätzung."
full_description = "Die Informationsgesellschaft unserer Tage ist ohne Computer nicht mehr denkbar. Die Einsatzmöglichkeiten der automatisierten Datenverarbeitung und Datenübermittlung bergen Chancen, aber auch Gefahren für den Einzelnen und für die Gesellschaft. Informations- und Kommunikationstechnologien verändern das Verhältnis Mensch-Maschine und der Menschen untereinander. Die Entwicklung zur Informationsgesellschaft erfordert ein neues Menschenrecht auf weltweite, ungehinderte Kommunikation. Der Chaos Computer Club ist eine galaktische Gemeinschaft von Lebewesen, unabhängig von Alter, Geschlecht und Abstammung sowie gesellschaftlicher Stellung, die sich grenzüberschreitend für Informationsfreiheit einsetzt und mit den Auswirkungen von Technologien auf die Gesellschaft sowie das einzelne Lebewesen beschäftigt und das Wissen um diese Entwicklung fördert. 1. Der Verein führt den Namen „Chaos Computer Club“. Der Verein wird in das Vereinsregister eingetragen und dann um den Zusatz „e. V.“ ergänzt. Der Verein hat seinen Sitz in Hamburg. 1. Der Club fördert und unterstützt Vorhaben der Bildung und Volksbildung in Hinsicht neuer technischer Entwicklungen, sowie Kunst und Kultur im Sinne der Präambel oder führt diese durch. Der Vereinszweck soll unter anderem durch folgende Mittel erreicht werden: 2. Der Club verfolgt ausschließlich und unmittelbar gemeinnützige Zwecke im Sinne des Abschnitts „steuerbegünstigte Zwecke“ der Abgabenordnung 1977 (§51ff AO) in der jeweils gültigen Fassung; er dient ausschließlich und unmittelbar der Volksbildung zum Nutzen der Allgemeinheit. Er darf keine Gewinne erzielen, er ist selbstlos tätig und verfolgt nicht in erster Linie eigenwirtschaftliche Zwecke. Die Mittel des Clubs werden ausschließlich und unmittelbar zu den satzungsgemäßen Zwecken verwendet. Die Mitglieder erhalten keine Zuwendung aus den Mitteln des Clubs. Niemand darf durch Ausgaben, die dem Zwecke des Clubs fremd sind oder durch unverhältnismäßig hohe Vergütungen begünstigt werden."
year_published = 2025
clearnet = "https://ccc.de/de/satzung"
