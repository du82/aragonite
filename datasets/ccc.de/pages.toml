["http://www.ccc.de/de/updates/2024/tracking-verbot"]
title = "CCC | Verbot von Tracking und personalisierter Werbung"
description = "Der Chaos Computer Club ist eine galaktische Gemeinschaft von Lebewesen für Informationsfreiheit und Technikfolgenabschätzung."
full_description = "Überwachungswerbung missachtet die Privatsphäre und die informationelle Selbstbestimmung. Die neue EU-Kommission soll mit dem angekündigten Digital Fairness Act ein Verbot von personalisierter Werbung auf den Weg bringen. Überwachungswerbung missachtet die Privatsphäre und die informationelle Selbstbestimmung. Die neue EU-Kommission soll mit dem angekündigten Digital Fairness Act ein Verbot von personalisierter Werbung auf den Weg bringen. Datenschutz ist in Europa ein Grundrecht, die klaren Prinzipien der EU-Datenschutzgrundverordnung gehören durchgesetzt. Personalisierte Werbung mit Tracking, Profilbildung oder Verhaltensanalysen sollte daher endlich als das behandelt werden, was sie ist: ein gefährlicher Manipulationsmechanismus, der nicht normalisiert werden darf. Die Fairness gegenüber den Nutzern und schon gar nicht deren Grundrechte dürfen durch solche Überwachungswerbung weiterhin ausgehebelt werden. Sie schadet dem Einzelnen und der Gesellschaft als Ganzes. Zusammen mit der Wikimedia Deutschland, dem FifF, Germanwatch und dem Konzeptwerk Neue Ökonomie fordern wir: Die neue EU-Kommission soll ein Verbot von personalisierter Werbung auf den Weg bringen. Der erst kürzlich angekündigte Digital Fairness Act kann dafür genutzt werden, um ein Verbot von Tracking und personalisierter Werbung durchzusetzen. Wenn sich digitale Angebote fast ausschließlich über personalisierte Werbung finanzieren, birgt das erhebliche Gefahren für die Demokratie, den sozialen Zusammenhalt, die informationelle Selbstbestimmung, das Klima und die nationale Sicherheit. Mit dem Gesetz über Digitale Dienste (Digital Services Act, DSA) und der Datenschutzgrundverordnung (DSGVO) hat die EU wichtige Grundsteine zum Schutz von Online-Nutzer:innen gelegt. Gleichzeitig zeigen Reaktionen großer Unternehmen auf diese Regelungen, dass ein Paradigmenwechsel im Online-Werbemarkt erforderlich bleibt, da die Freiheit vor manipulativen Praktiken durch die Werbeindustrie beharrlich untergraben wird."
year_published = 2020
