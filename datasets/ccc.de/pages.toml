title = "CCC | Chaos Computer Club"
description = "Der Chaos Computer Club ist eine galaktische Gemeinschaft von Lebewesen für Informationsfreiheit und Technikfolgenabschätzung."
full_description = 'Mitglieder des Chaos Computer Clubs haben sich in den letzten Jahren mit biometrischen Systemen befaßt, Artikel in Zeitschriften und Pressemitteilungen veröffentlicht und Vorträge gehalten. Hier findet sich ein Querschnitt durch unsere Aktivitäten. Das Wissenschaftliche Fachblatt "Die Datenschleuder" des Chaos Computer Clubs (CCC) meldet eine schwerwiegende Datenpanne: Dem Marktforschungsinstitut TNS Infratest/Emnid sind über 41.000 Datensätze mit persönlichsten Daten ihrer Umfrageteilnehmer abhanden gekommen. Die Webseite von Chaosradio wurde komplett überarbeitet, und das bisherige Angebot kommt jetzt in neuer Struktur daher. Die bisher nur als Gesamtpaket angebotenen Podcasts des CCC können jetzt auch separat abonniert werden, und es wurden neue Podcasts bereitgestellt. Unter anderem lassen sich jetzt auch die alten Ausgaben der Datenschleuder als PDF-Podcast beziehen. Der Datenschleuderversand geht in die Sommerpause – Komplettsets der alten Ausgaben jetzt noch schnell bestellen oder bis Ende September warten. Die Datenschleuder #086 hat die Briefkästen der Abonnenten erreicht. Leider ist ein Teil fehlerbehaftet. Mittlerweile ist die Datenschleuder #078 bei unseren Abonnenten eingetroffen. Die Nummer #077 gibt es nun online.'
