["http://www.ccc.de/de/updates/2024/zivilgesellschaft-kritisiert-sicherheitspaket"]
title = "CCC | Zivilgesellschaft kritisiert Sicherheitspaket"
description = "Der Chaos Computer Club ist eine galaktische Gemeinschaft von Lebewesen für Informationsfreiheit und Technikfolgenabschätzung."
full_description = "Die Zivilgesellschaft kritisiert das sogenannte Sicherheitspaket der Bundesregierung, das am Donnerstag im Bundestag in der ersten Lesung besprochen wird. Das Gesetzespaket enthält eine Vielzahl an neuen Befugnissen für Ermittlungsbehörden, welche die Grundrechte von Millionen von Bürger:innen einschränken und insbesondere die Rechte von von Rassismus betroffenen Menschen, Asylbewerber:innen und Geflüchteten aushöhlen. Die Zivilgesellschaft kritisiert das sogenannte Sicherheitspaket der Bundesregierung, das am Donnerstag im Bundestag in der ersten Lesung besprochen wird. Das Gesetzespaket enthält eine Vielzahl an neuen Befugnissen für Ermittlungsbehörden, welche die Grundrechte von Millionen von Bürger:innen einschränken und insbesondere die Rechte von von Rassismus betroffenen Menschen, Asylbewerber:innen und Geflüchteten aushöhlen. Matthias Marx, Sprecher des Chaos Computer Clubs kommentiert: „Die Bundesregierung lässt sich von den Faschisten treiben und schwenkt in Rekordzeit von ‚Anonymität wahren‘ zu ‚alle biometrisch überwachen‘. Es gibt aber keine technischen Lösungen für soziale Probleme. Wenn dieser Gesetzesentwurf verabschiedet wird, dann genügt es nicht mehr, schöne Stellungnahmen zu schreiben und alle drei Jahre eine Demo gegen die Vorratsdatenspeicherung zu organisieren. Künftig müssten wir dazu anleiten, Überwachungsmaßnahmen zu sabotieren und abzuschalten.“ Weiter kommentiert Elina Eickstädt, Sprecherin des Chaos Computer Clubs: „Derzeit diskutieren wir intensiv über verfassungsrechtliche Maßnahmen zum Schutz der Demokratie und der Bevölkerung vor den Folgen einer von der AfD geführten Regierung. Dazu zählt auch, jegliche technischen Voraussetzungen zu verhindern, die früher oder später nicht nur zur Überwachung, sondern auch zur gezielten Unterdrückung genutzt werden können. Das Sicherheitspaket liefert alles, was es jetzt dringend zu verhindern gilt.“ Christian Mihr, stellvertretender Generalsekretär von Amnesty International in Deutschland, sagt: „Aktuell muss es darum gehen, die Menschenrechte hochzuhalten und sich nicht mit rassistischen Zuschreibungen und kopflosen Gesetzesverschärfungen zu überbieten. Nachdem die Ampel-Koalition jahrelang über Gegenmaßnahmen zu Racial Profiling diskutiert hat, will sie jetzt im Rekordtempo anlasslose Kontrollen ausweiten. Diese Befugnisse sind ein Einfallstor für Racial Profiling und gehören stattdessen abgeschafft. All unsere Fotos oder Tonaufnahmen im Netz soll der Staat künftig mit Technologie für Stimm- und Gesichtserkennung durchsuchen dürfen, ob es nun Fotos vom Kindergeburtstag sind, unsere Urlaubs-Schnappschüsse oder ein selbst aufgenommenes Lied. Das verletzt die Privatsphäre der gesamten Bevölkerung. Auch das Recht auf Protest ist bedroht, wenn Menschen sich künftig fragen, ob Fotos von Demonstrationen mit Gesichtserkennung ausgewertet werden. Wir brauchen gerade jetzt eine aktive Zivilgesellschaft, die sich im wahrsten Sinne des Wortes traut, Gesicht zu zeigen – keine eingeschüchterte.“"
year_published = 2024
clearnet = "http://www.ccc.de/de/updates/2024/zivilgesellschaft-kritisiert-sicherheitspaket"
