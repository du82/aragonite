["https://ccc.de/de/updates/2013/hacken-fressen-und-moral"]
title = "CCC | Hacken, Fressen und Moral"
description = "Der Chaos Computer Club ist eine galaktische Gemeinschaft von Lebewesen für Informationsfreiheit und Technikfolgenabschätzung."
full_description = 'In einem Vorabdruck eines Interviews aus der nächsten Ausgabe seiner Vereinszeitung "Die Datenschleuder" zeichnet der Chaos Computer Club (CCC) die Geschichte eines Hackers nach, dessen Software unter anderem an Regierungen des Nahen Ostens verkauft wurde, um Oppositionelle auszuforschen. Für welche Ziele und Zwecke sollten Hacker ihre Talente einsetzen? Kann man heute immer noch ignorieren, was mit den Ergebnissen des eigenen Forschungsdrangs geschieht? In einem Vorabdruck eines Interviews aus der nächsten Ausgabe seiner Vereinszeitung "Die Datenschleuder" zeichnet der Chaos Computer Club (CCC) die Geschichte eines Hackers nach, dessen Software unter anderem an Regierungen des Nahen Ostens verkauft wurde, um Oppositionelle auszuforschen. Für welche Ziele und Zwecke sollten Hacker ihre Talente einsetzen? Kann man heute immer noch ignorieren, was mit den Ergebnissen des eigenen Forschungsdrangs geschieht? Als der CCC zu seinem letzten Congress, dem 29C3, die rhetorische Frage in den Raum stellte, ob die Folgen unseres Handelns "not my department" seien, geschah dies nicht ohne Grund. Das Problem, was hochspezialisierte Fachleute der IT-Sicherheitsforschung mit ihrem speziellen Talent anstellen und für wen, stellt sich immer dringlicher, je stärker Regierungen, Militär und Geheimdienste das Netz und digitale Geräte als Feld der Auseinandersetzung bis hin zum Krieg ansehen. Bleibt Hackern am Ende zum Überleben nichts weiter übrig, als von dieser Militarisierung Digitaliens zu profitieren und ihre Talente meistbietend zu vermieten? Unmittelbar vor dem morgigen 32. Jahrestag der Gründung des CCC ging bei der Redaktion "Die Datenschleuder" ein Interviewangebot eines Aussteigers aus einer dieser schattigen Branchen ein, die seit einiger Zeit im Kreuzfeuer der Kritik steht. Seit Lieferungen von Überwachungsequipment in Länder ruchbar wurden, die es mit Menschenrechten nicht ganz so genau nehmen, gab es immer mal wieder Einblicke in die dunkle Seite der IT-Sicherheitsforschung. Mit diesem Interview können wir nun aber erstmals beleuchten, wie leicht es ist, auf die falsche Seite der Barrikade zu rutschen, aber auch, daß dieser Weg keine Einbahnstraße darstellen muß.'
year_published = 2013
