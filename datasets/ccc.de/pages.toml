["http://www.ccc.de/en/regional"]
title = "CCC | CCC Regional"
description = "Der Chaos Computer Club ist eine galaktische Gemeinschaft von Lebewesen für Informationsfreiheit und Technikfolgenabschätzung."
full_description = "Wie es sich für einen Club gehört, der das Chaos schon im Namen trägt, mag die Struktur des CCC für Außenstehende verwirrend erscheinen. Zum einen gibt es den CCC e.V. mit Sitz in Hamburg, der bundesweit tätig ist. Daneben existieren sogenannte Erfa-Kreise (Erfahrungsaustauschkreise), die man auch als „lokale Niederlassungen“ bezeichnen könnte. Generell lässt sich sagen, dass Erfa-Kreise eng in die Vereinsstruktur des CCC eingebunden sind. Erfa-Kreis zu sein bringt Rechte und Pflichten mit sich. So wird erwartet, dass man sich aktiv am überregionalen Vereinsleben beteiligt, regelmäßige öffentliche Treffen veranstaltet, eine einigermaßen informative Webseite hat, bereit ist, Anfragen von lokal Interessierten zu beantworten und vieles mehr. Daneben bestehen Chaostreffs, die meistens eine lockere Runde von Leuten sind, die sich mit dem CCC verbunden fühlen. Falls Dich die Arbeit im CCC interessiert, es aber in Deiner Nähe noch keinen Treff von Gleichgesinnten gibt, kannst Du selbst einen Chaostreff gründen. Wir empfehlen Dir, Dich auf der Mailingliste chaostreffs(at)lists.ccc.de zu subscriben und dort Dein Vorhaben bekanntzugeben, damit wir von dem neuen Chaostreff erfahren und ihn zu der Liste der Chaostreffs hinzufügen können. Wenn Du auf der Suche nach Mitstreitern bist, kannst Du Dich auf dieser Liste auch umhören. Ansonsten laufen auf der Liste unter anderem Informationen zu den regelmäßig stattfindenden Regiotreffen aller Erfa-Kreise und Chaostreffs zusammen, zu denen Du dann herzlich eingeladen bist, um den Club (oder eher die Menschen dahinter) näher kennenzulernen. Als weiteres sollte noch die Chaos-Family genannt sein. Zur Chaos-Family gehören Clubs, die nicht zum CCC gehören, auch keine Chaostreffs sind. Sie sind aber mit uns sinnverwandt und stehen uns in irgendeiner Form nahe. Seit unserer Satzung vom November 2002 ist der Erfa-Beirat als Organ innerhalb des CCC e.V. aufgenommen. Der Erfa-Beirat ist ein Treffen der Erfa-Kreise, in dem über lokale Projekte, die Aufgabenverteilung zwischen lokalen Gruppen im Verein und Probleme innerhalb der Erfa-Kreise gesprochen wird. Der Erfa-Beirat trifft sich im sogenannten Regiotreffen, auch Chaostreffs und Interessierte können daran teilnehmen, haben jedoch kein Stimmrecht für Entscheidungen. Das Regiotreffen findet etwa vier Mal im Jahr statt, meistens auf clubweiten Veranstaltungen oder sonst durch einen Erfa-Kreis organisiert."
year_published = 2025
