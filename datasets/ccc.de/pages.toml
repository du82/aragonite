["https://ccc.de/en"]
title = "CCC | Home"
description = "Der Chaos Computer Club ist eine galaktische Gemeinschaft von Lebewesen für Informationsfreiheit und Technikfolgenabschätzung."
full_description = "The Chaos Computer Club e. V. (CCC) is Europe's largest association of hackers. For more than forty years we are providing information about technical and societal issues, such as surveillance, privacy, freedom of information, hacktivism, data security, and hacking. As the most influential hacker collective in Europe we organize campaigns, events, lobbying and publications as well as anonymizing services and communication infrastructure. There are many hackerspaces in and around Germany which belong to or share a common bond to the CCC as stated in our hacker ethics. Jedes Jahr am 14. Februar feiert die Free Software Foundation Europe (FSFE) gemeinsam mit anderen Freie-Software-Organisationen und -Enthusiasten den „I Love Free Software Day“, um die Bedeutung der Mitwirkenden von Freier Software hervorzuheben. more … Der Chaos Computer Club (CCC) hat gravierende Datenlecks bei den Legal-Tech-Plattformen myright.de und euflight.de gemeldet. Insgesamt waren Daten von rund 325.000 Nutzer*innen zugänglich. more … Das Bündnis „Bits & Bäume“ fordert eine wirksame Mitsprache der Zivilgesellschaft bei der Digitalisierung, demokratische Kontrolle digitaler Infrastrukturen sowie eine globale gerechte Digitalwirtschaft. Digitalpolitik muss aus dem Muff der 1990er gehievt und endlich in den Dienst von Mensch und Umwelt gestellt werden. more … Mit bedeutungsschwangerer Cyber-Rhetorik will d-trust von der Verantwortung für ein großes Datenleck ablenken. Der CCC erklärt die Hintergründe und fordert Konsequenzen. more … Die Verantwortlichen der elektronischen Patientenakte müssen die auf dem 38. Chaos Communication Congress demonstrierten Sicherheitslücken endlich schließen. Der Chaos Computer Club schließt sich einem offenen Brief an, in dem 28 Organisationen aus dem Gesundheitswesen und der Zivilgesellschaft Bundesgesundheitsminister Lauterbach auffordern, Transparenz im gesamten Prozess der ePA herzustellen. more … The Chaos Computer Club (CCC) supports the three hackers who explained in detail at 37C3 how the Polish rail vehicle manufacturer Newag had manipulated its trains in such a way that they could only be repaired in the company's own workshops. The manufacturer reacted to the publications with an attitude not seen since the 90s and sued the hackers under both criminal and civil law. At 38C3, the hackers are now reporting on their legal odyssey, which cost so far around 30,000 euros. The CCC is calling for donations to cover the legal and other resulting costs incurred so far. more …"
year_published = 2025
