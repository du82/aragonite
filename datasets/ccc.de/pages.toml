["https://ccc.de/de/disclosure"]
title = "CCC | Disclosure"
description = "Der Chaos Computer Club ist eine galaktische Gemeinschaft von Lebewesen für Informationsfreiheit und Technikfolgenabschätzung."
full_description = "Der CCC unterstützt bei der Meldung von Sicherheitslücken nach dem Responsible-Disclosure- beziehungsweise Coordinated-Vulnerability-Disclosure-Verfahren. Der CCC unterstützt bei der Meldung von Sicherheitslücken nach dem Responsible-Disclosure- beziehungsweise Coordinated-Vulnerability-Disclosure-Verfahren. Um eine Sicherheitslücke zu melden, können Reports über Sicherheitslücken an disclosure@ccc.de gesendet werden. Wir nehmen gern auch verschlüsselte E-Mails entgegen. Wir prüfen die Meldungen und leiten sie weiter, wenn wir die Sicherheitslücke nachvollziehen können. Dabei versuchen wir auf Wunsch, eure Identität zu schützen. Bei eventuellen rechtlichen Schritten seitens der Empfänger*innen der Nachricht taucht dann zunächst der CCC als Absenderin der Meldung auf. Zusätzlich schadet es selten, auf gute OpSec zu achten. Wir unterstützen nicht bei der Meldung von Sicherheitslücken, wenn mit der Meldung finanzielle Interessen verfolgt werden. Wenn also eine Bug Bounty oder ähnliche Gegenleistung erwartet wird, dann bearbeiten wir die Meldung nicht. Sobald die Sicherheitslücke behoben wurde oder nach Ablauf von 90 Tagen nach unserer Meldung, veröffentlichen wir hier Informationen zur Sicherheitslücke."
year_published = 2025
clearnet = "https://ccc.de/de/disclosure"
