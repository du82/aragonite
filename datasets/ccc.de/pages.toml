["http://www.ccc.de/de/updates/2024/bdsg-biometrie-verbot"]
title = "CCC | CCC fordert im Innenausschuss Verbot biometrischer Überwachung"
description = "Der Chaos Computer Club ist eine galaktische Gemeinschaft von Lebewesen für Informationsfreiheit und Technikfolgenabschätzung."
full_description = "In der Sachverständigenanhörung im Innenausschuss des Deutschen Bundestages zur Änderung des Bundesdatenschutzgesetz fordert der Chaos Computer Club (CCC) das längst überfällige Verbot der umstrittenen biometrischen Überwachung im öffentlichen Raum. In der Sachverständigenanhörung im Innenausschuss des Deutschen Bundestages zur Änderung des Bundesdatenschutzgesetz fordert der Chaos Computer Club (CCC) das längst überfällige Verbot der umstrittenen biometrischen Überwachung im öffentlichen Raum. Zunehmend werden Fälle bekannt, in denen Polizeibehörden biometrische Überwachungssysteme missbräuchlich und ohne rechtliche Grundlage einsetzen. Diese biometrischen Überwachungssysteme führen im öffentlichen Raum zu einer allgegenwärtigen Erfassung, wie wir sie bisher nur aus dem Internet kennen: Jeder Schritt wird aufgezeichnet und kann dank unserer eindeutigen biometrischen Erkennungsmerkmale – insbesondere unseres Gesichts – detailliert ausgewertet werden. Was wie eine ferne Dystopie klingt, wird bereits heute stückweise in die Realität umgesetzt; ein Prozess, dem wir Einhalt gebieten müssen. Die Anhörung findet am Montag, dem 24. Juni 2024, ab 14 Uhr im Paul-Löbe-Haus, Sitzungssaal E 600, statt. Für den Chaos Computer Club wird Matthias Marx als Sachverständiger teilnehmen."
year_published = 2024
