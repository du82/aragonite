["https://ccc.de/de/tags/congress"]
title = "CCC | Chaos Computer Club"
description = "Der Chaos Computer Club ist eine galaktische Gemeinschaft von Lebewesen für Informationsfreiheit und Technikfolgenabschätzung."
full_description = '''Zum 36. Mal wird der Chaos Computer Club (CCC) zwischen Weihnachten und Silvester den Chaos Communication Congress ausrichten. Der Chaos Computer Club (CCC) veröffentlicht heute den Call for Participation zum 33. Chaos Communication Congress (33C3), der dieses Jahr nochmals im Congress Center Hamburg (CCH) [1] stattfindet. Wie in den vergangenen Jahren werden zum weltweit größten nicht-kommerziellen Hackertreffen zwischen dem 27. und 30. Dezember 2016 mehr als 11.000 Nerds aller Interessensgebiete zum Erfahrungsaustausch, zum Hacken, Basteln, Feiern und Kennenlernen zusammenkommen. In light of recent accusations against a regular visitor and speaker at our events, the Chaos Computer Club re-emphasizes the following: The CCC is, by its charter and by common consent, a galactic organization of all life forms. We are dedicated to providing a safe, comfortable, and supportive experience for everybody attending our events. Der Chaos Computer Club lädt alle galaktischen Lebewesen zum 32. Chaos Communication Congress im Congress Center Hamburg ein. Dieses Jahr wird der durchschnittliche Eintrittspreis des Hackercongresses vom 27. bis zum 30.12.2015 um zehn Euro niedriger sein. Am 27. Dezember ist es wieder soweit: Der 31. Chaos Communication Congress im Congress Center Hamburg wird eröffnet – dieses Jahr unter dem Motto "A new dawn". Die von den Anbietern Deutsche Telekom, web.de, GMX und Freenet als besonders sicher beworbenen "E-Mails made in Germany" werden offenbar weiterhin auch unverschlüsselt über das Internet übertragen. Davor warnt der Chaos Computer Club (CCC), der anläßlich des 30. Chaos Communication Congress die Sicherheitstechniken großer deutscher Anbieter einer kritischen Betrachtung unterzogen hat. During 29C3 pre-order season we saw over a thousand people buying shirts and hoodies online. But not everyone picked up their stuff during Congress, that's why we have around hundred pieces of cloth that belongs to one of you. Der CCC lädt Hacker, Tüftler, Computer-Freaks, Bürgerrechtler, Künstler und offene Interessierte zum jährlichen Chaos Communication Congress, der dieses Jahr vom 27. bis 30. Dezember im CCH in Hamburg stattfindet.'''
