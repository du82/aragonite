["https://ccc.de/en/support"]
title = "CCC | Unterstützen"
description = "Der Chaos Computer Club ist eine galaktische Gemeinschaft von Lebewesen für Informationsfreiheit und Technikfolgenabschätzung."
full_description = "Der Chaos Computer Club ist dezentral in regionalen Vereinen organisiert, und diese leben von den Hackern und Hackerinnen vor Ort, vom Drang herauszufinden, wie Dinge funktionieren, vom Willen, nicht nur am Rechner zu konsumieren, sondern Kunst und Schönheit zu schaffen und sich und andere in freien Netzen zu informieren. Wer den Club kennenlernen und unterstützen will, ist also beim Erfa oder Chaostreff in der Nähe am besten aufgehoben. In chaotisch unterversorgten Gegenden ist es natürlich sowohl möglich als auch gern gesehen, einen eigenen Hackerstammtisch zu organisieren. Freiwillige Helfer bei Wahlbeobachtungen, Organisation von Demonstrationen und als Engel beim jährlichen Congress helfen uns und Euch beim gemeinsamen Land-, Stadt- und Weltverbessern. Da wir hoffen, daß unsere Fühler am Netz keine Einbahnstraßen bedeuten, sind Beiträge zur Diskussion, Texte und Bilder für die Datenschleuder, Angebote von und Nachfragen nach Vorträgen und Hinweise auf bemerkenswerte Vorgänge in der Netzrepublik eine wertvolle Hilfe für die Aktiven. Und letztendlich kostet die Arbeit des Clubs neben viel Zeit, Spaß und Schweiß auch Geld. Daher könnt Ihr uns finanziell bei unseren Projekten, Kampagnen und juristischen Auseinandersetzungen helfen. Dazu bietet sich eine Mitgliedschaft oder ein Abonnement der Datenschleuder an. Der CCC ist nicht gemeinnützig im Sinne der Abgabenordnung – Geldspenden helfen uns, sind aber steuerlich nicht abzugsfähig. Spenden gegen Spendenquittung nimmt die nach dem Tod Wau Hollands ins Leben gerufene und Ziele in seinem Sinne verfolgende gemeinnützige Wau-Holland-Stiftung entgegen."
year_published = 2025
clearnet = "https://ccc.de/en/support"
