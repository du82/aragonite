["https://ccc.de/de/censorship"]
title = "CCC | Internet-Zensur"
description = "Der Chaos Computer Club ist eine galaktische Gemeinschaft von Lebewesen für Informationsfreiheit und Technikfolgenabschätzung."
full_description = 'Früher galt das weltweite Netz als Heimstatt für freie Meinungsäußerung, ungehinderte Kommunikation und Internationalität. Doch heute sehen wir viele Bestrebungen, diese Freiheiten immer weiter einzuschränken. Rechte der Bürger sollen kommerziellen und staatlichen Interessen geopfert werden. Auch Deutschland ist von diesen Maßnahmen betroffen. Früher galt das weltweite Netz als Heimstatt für freie Meinungsäußerung, ungehinderte Kommunikation und Internationalität. Doch heute sehen wir viele Bestrebungen, diese Freiheiten immer weiter einzuschränken. Rechte der Bürger sollen kommerziellen und staatlichen Interessen geopfert werden. Auch Deutschland ist von diesen Maßnahmen betroffen. Die Reporter ohne Grenzen (ROG) haben den 12. März zum "Welttag gegen Internetzensur" erklärt. Zensur im World Wide Web hat eine lange Geschichte. So erwägt die EU-Kommission die Aufnahme von Internetsperren gegen Kinderpornographie in dem Ratsbeschluß gegen die sexuelle Ausbeutung von Kindern. Unter dem Vorwand, moralische Normen, die nationale Sicherheit, Religion oder die Rechte ethnischer Minderheiten oder gar das "spirituell-kulturelle" und wissenschaftliche Potential eines Landes zu beschützen, wird in vielen Ländern Internetzensur betrieben, berichtet ROG. Ihrem Bericht (PDF) zufolge sind zurzeit mindestens siebzig Cyberdissidenten inhaftiert, davon fünfzig Blogger in China. Der Chaos Computer Club (CCC) setzt sich intensiv mit diesem Thema auseinander. Bereits seit seiner Gründung unterstützt der CCC freie Meinungsäußerung, ungehinderte Kommunikation und Internationalität im World Wide Web. Mit einer Kampagne kämpfen die Mitglieder seit 2002 für die Wahrung der Menschen- und Grundrechte in einem freien Internet. Konkret wurde dieser Kampf für die Informationsfreiheit 2008 in China, als tausende Reporter das Reich der Mitte bereisen, um dort über die "Olympischen Spiele" zu berichten und bei ihrer Berichterstattung vor einer elektronischen Chinesischen Mauer standen.'
year_published = 2025
