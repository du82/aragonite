full_description = 'Die MRMCD 2012 finden dieses Jahr vom 7. bis 9. September unter dem Motto „Cyberwar und andere Mythen“ statt. Eines der Hauptwerkzeuge zum Erfahrungsaustausch zwischen den Hackern, die sich zum Chaos Computer Club zugehörig fühlen, sind die zahlreichen Veranstaltungen, die organisiert werden von den Erfas, Chaostreffs und einer riesigen Schar freiwilliger "OC" genannter Gruppen. Diesmal finden die Metarheinmain-Chaosdays vom 1. bis zum 3. September in Darmstadt statt und werden vom ansässigen CCC Darmstadt organisiert. Dieses Jahr finden die Metarheinmain-Chaosdays vom 21. bis zum 23. Juli in Wiesbaden statt und werden vom CCC Mainz organisiert. Vom 2. bis zum 4. September finden in Darmstadt die Metarheinmain Chaosdays statt, eine Veranstaltung für Interessierte im Bereich IT und inbesondere im Bereich IT-Sicherheit, die Wissenstransfer und interessante Bekanntschaften ermöglichen soll. Am kommenden Wochenende lädt das ansässige Chaos im Rhein-Main-Gebiet – kurz Meta-Rhein-Main – zum Basteln, Vortragslauschen und allgemeinen Informationstauschen zu den ChaosDays in Mainz ein.'
