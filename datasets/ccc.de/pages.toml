["http://www.ccc.de/de/updates/2024/chatkontrolle-kuhhandel-wahrend-niemand-hinschaut"]
title = "CCC | Chatkontrolle: Kuhhandel, während niemand hinschaut"
description = "Der Chaos Computer Club ist eine galaktische Gemeinschaft von Lebewesen für Informationsfreiheit und Technikfolgenabschätzung."
full_description = "Der belgische Vorsitz im Rat der EU will die Chatkontrolle am Mittwoch, den 19. Juni, abstimmen lassen. Nach einem weiteren Hütchenspielertrick, den massenhaften Angriff auf Verschlüsselung nicht als solchen erscheinen zu lassen, wackelt nun der Widerstand Frankreichs. Der CCC erinnert daran, dass sich an der Verordnung nichts Nennenswertes geändert hat. Der belgische Vorsitz im Rat der EU will die Chatkontrolle am Mittwoch, den 19. Juni, abstimmen lassen. Nach einem weiteren Hütchenspielertrick, den massenhaften Angriff auf Verschlüsselung nicht als solchen erscheinen zu lassen, wackelt nun der Widerstand Frankreichs. Der CCC erinnert daran, dass sich an der Verordnung nichts Nennenswertes geändert hat. Der belgische „Kompromiss“ sieht vor, dass Nutzer*innen der Chatkontrolle aktiv zustimmen müssen. Natürlich kommt die Ablehnung nicht ohne Strafe: Wer nicht zustimmt, darf überhaupt keine Bilder und Videos mehr versenden – eine starke Einschränkung des Dienstes. „Von Freiwilligkeit kann hier keine Rede sein“, kommentiert Linus Neumann, Sprecher des Chaos Computer Clubs. Im Kontext der Diskussion wird immer wieder behauptet, mit der Chatkontrolle finde kein Angriff auf Verschlüsselung statt: Die eigentliche Übertragung bleibt verschlüsselt und die Untersuchung aller Inhalte findet unabhängig von der Verschlüsselung direkt auf den Geräten statt. Das Ergebnis ist selbstverständlich das gleiche. Dazu kommentiert Meredith Whittaker, Präsidentin des verschlüsselten Messengers „Signal“: Die Anordnung zur Massenüberwachung privater Kommunikation untergräbt die Verschlüsselung grundlegend. Punkt. In der seit inzwischen Jahren anhaltenden Debatte hat sich kein*e einzige Expert*in gefunden, die sich von dieser rhetorischen Täuschung hat blenden lassen. „Kriminelle nutzen bereits heute Verbreitungswege, die von diesen Scans nicht betroffen wären, und werden auch in Zukunft den Scans leicht entgehen. Es ist allgemein bekannt, dass Messenger und soziale Netzwerke sich nicht für die kriminellen Bildersammler eignen“, betonte der CCC schon vor über einem Jahr."
year_published = 2024
