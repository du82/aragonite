["https://ccc.de/de/tags/vorratsdatenspeicherung"]
title = "CCC | Chaos Computer Club"
description = "Der Chaos Computer Club ist eine galaktische Gemeinschaft von Lebewesen für Informationsfreiheit und Technikfolgenabschätzung."
full_description = 'Eine Arbeitsgruppe der EU-Kommission fordert allen Ernstes Zugriff auf jede Ende-zu-Ende-verschlüsselte Kommunikation und obendrauf eine neue Form der europaweiten Massenüberwachung von Telekommunikations- und Internetdaten. Wenn diesem gefährlichen Unsinn nicht Einhalt geboten wird, kann Europa einpacken. Gemeinsame Erklärung des Chaos Computer Clubs, der Humanistischen Union, des Republikanischen Anwältinnen- und Anwältevereins und des Digitale Gesellschaft e. V. Dem Chaos Computer Club (CCC) wurde ein wissenschaftliches Gutachten der kriminologischen Abteilung des Max-Planck-Instituts (MPI) für ausländisches und internationales Strafrecht zugespielt, das sich detailliert mit der Frage der angeblichen "Schutzlücke" durch den Wegfall der Vorratsdatenspeicherung nach dem Urteil des Bundesverfassungsgerichts vom 2. März 2010 beschäftigt. Die Studie kommt zum eindeutigen Ergebnis, daß eine solche immer wieder behauptete Lücke nicht besteht. Die angebliche Notwendigkeit der Speicherung von 300 bis 500 Millionen Datensätzen pro Tag kann laut der Untersuchung nicht durch kriminologische Statistiken belegt werden. Der Chaos Computer Club (CCC) unterstützt nachdrücklich das Anliegen des Offenen Briefes und setzt sich für das Recht für jedermann ein, weiterhin unbeobachtet und frei kommunizieren zu können. Nachdem die Vorratsdatenspeicherung in Deutschland als verfassungswidrig verworfen wurde, ist es Aufgabe der Bundesjustizministerin Sabine Leutheusser-Schnarrenberger, sich dafür einzusetzen, daß endlich auch die EU-Richtlinie abgeschafft wird. Der Arbeitskreis Vorratsdatenspeicherung und der Chaos Computer Club rufen unter dem Motto „Freiheit statt Angst – Für die Grundrechte!“ zu bundesweiten Demonstrationen am 6. November 2007 auf, um die von der Koalition geplante Vorratsdatenspeicherung noch in letzter Minute zu stoppen. In einer gemeinsamen Erklärung sprechen sich Datenschützer, Verbraucherschützer und Journalisten gegen die von der Bundesregierung befürwortete "Vorratsspeicherung von Telekommunikationsdaten" aus.'
year_published = 2025
