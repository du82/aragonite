["http://www.ccc.de/de/updates/2024/polizeiliche-videoueberwachung-koeln"]
title = "CCC | Urteil in Köln: Vormarsch der polizeilichen Videoüberwachung gestoppt"
description = "Der Chaos Computer Club ist eine galaktische Gemeinschaft von Lebewesen für Informationsfreiheit und Technikfolgenabschätzung."
full_description = "Die umstrittene großflächige Videoüberwachung in Köln muss nach jahrelangem juristischen Kampf der Initiative „Kameras stoppen“ und einem Urteil des Verwaltungsgerichts rückgebaut werden. Es bleibt die Frage: Ist bei den Datenschutzbehörden noch jemand wach? Die umstrittene großflächige Videoüberwachung in Köln muss nach jahrelangem juristischen Kampf der Initiative „Kameras stoppen“ und einem Urteil des Verwaltungsgerichts rückgebaut werden. Es bleibt die Frage: Ist bei den Datenschutzbehörden noch jemand wach? Nach einem sechs Jahren dauernden Gerichtsverfahren gegen die permanente Videoüberwachung und das massenhafte Filmen von Unschuldigen durch die Polizei in mehreren Stadtteilen von Köln hat das Verwaltungsgericht gestern ein Urteil gefällt: Die Videoüberwachung ist zwar im Grundsatz rechtmäßig, aber viel zu weitgreifend. Ein Teil der Überwachungsbereiche wird künftig nicht mehr unter permanenter Beobachtung stehen. Auch bei Demonstrationen muss die Polizei fortan die Videoüberwachung deaktivieren. Den Teilerfolg vor dem Verwaltungsgericht Köln kommentiert Calvin Baus, Sprecher des CCC und sachkundige Auskunftsperson für den Kläger und die Klägerin der Initiative „Kameras stoppen“: „Zwar sind die Grundrechte aller Menschen, die in den dauerüberwachten Bereichen wohnen oder arbeiten, nun besser geschützt, allerdings wurde über die massive Einschränkung ihrer Privatsphäre gar nicht gesprochen. Denn dafür ist die Landesbeauftragte für den Datenschutz zuständig, die hier seit Jahren untätig ist.“ Das Grundrecht auf Versammlungsfreiheit ist durch das Urteil klar gestärkt worden: Auf Demonstrationen in Köln dürfen politische Meinungen wieder ohne permanente Überwachung geäußert werden. Aber ob die polizeiliche Videoüberwachung in Datenschutzfragen den rechtlichen Vorgaben genügt, wurde inhaltlich nicht geklärt. Ob das nämlich in Fragen der informationellen Selbstbestimmung der betroffenen Menschen rechtens ist, blieb offen."
