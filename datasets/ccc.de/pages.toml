["https://ccc.de/en/club/transparenz"]
title = "CCC | Transparenzinformationen"
description = "Der Chaos Computer Club ist eine galaktische Gemeinschaft von Lebewesen für Informationsfreiheit und Technikfolgenabschätzung."
full_description = "Kontakt für Transparenzangaben:Birte FrieselChaos Computer Club Düsseldorf e.V.Sonnenstr. 5840227 Düsseldorf Am 21. Mai 2023 fand eine ordentliche Mitgliederversammlung in Potsdam statt. Nach den Tätigkeitsberichten von Vorstand und Kassenprüfern wurden der Finanzbericht sowie das Protokoll der Mitgliederversammlung vom 24.04.2021 genehmigt und der Vorstand für den Berichtszeitraum entlastet. Die Posten der beiden stellvertretenden Vorsitzenden wurden neu besetzt. Zusätzlich hat die Mitgliederversammlung Änderungen in §3.2 und §3.3 der Satzung beschlossen. Der Vorstand hat sich vier mal zu regulären Vorstandssitzungen getroffen. Die Sitzungen am 16. Januar 2023 und 15. November 2023 wurden per Videokonferenz abgehalten. Die Sitzung am 7. April 2023 fand im Rahmen des EasterHegg 20 in Hamburg statt. Die Sitzung am 7. Juli 2023 fand in den Räumlichkeiten des Chaos Computer Club Düsseldorf / Chaosdorf e.V. in Düsseldorf statt. Zur Förderung der Dezentralität bezuschusst der Chaos Computer Club e.V. seine regionalen und lokalen Erfahrungsaustauschkreise (Erfas) mit einem quartalsweisen Zuschuss von circa 750,00 €, welcher für dezentrale Aktivität genutzt werden soll. Der Chaos Computer Club e.V. gewährt Mietkostenzuschüsse an seine Erfas und Chaostreffs zur Starthilfe und Förderung des Aufbaus dezentraler Strukturen und Aktivitäten. Zuschüsse im Jahr 2023 entfallen auf die folgenden Gruppen, sie wurden jeweils im Erfabeirat besprochen und vom Vorstand beschlossen: Der CCC e.V. fördert auf Antrag Projekte von Erfas und von Gruppen, die Projekte im Sinne der Satzung des CCC e.V. umsetzen und eine Förderung beantragen. Die Projekte werden entweder vom Erfa-Beirat beraten und dem Vorstand mit einer Empfehlung zur Entscheidung übergeben, oder direkt beim Vorstand beantragt und entschieden. Diese Projekte umfassen unter anderem den Ausbau oder die Renovierung des jeweiligen Hackspaces, die Durchführung von Veranstaltungen oder zum Beispiel die Produktion von Mobilisierungsmaterial und den Aufbau von Infrastruktur bei Demonstrationen und Veranstaltungen im Sinne der Satzung. Detaillierte Informationen zu den Projekten und deren Bewilligung unterliegen dem Datenschutz und sind daher nicht hier veröffentlicht. Die Projektergebnisse sind teilweise nach Abschluss in der Datenschleuder nachzulesen."
