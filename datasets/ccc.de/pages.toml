["https://ccc.de/en/updates/2025/andere-dein-passwort-zum-letzten-mal"]
title = "CCC | Ändere dein Passwort zum letzten Mal!"
description = "Der Chaos Computer Club ist eine galaktische Gemeinschaft von Lebewesen für Informationsfreiheit und Technikfolgenabschätzung."
full_description = 'Über die Jahre haben sich diverse Mythen über sichere Prozesse im Umgang mit Passwörtern entwickelt und festgesetzt. Besonders hartnäckig hält sich der Brauch, Nutzer*innen regelmäßig zur Passwortänderung zu zwingen. Doch wer sein Passwort ständig ändert, wählt einfache Kombinationen und neigt dazu, dasselbe Passwort für mehrere Zugänge zu verwenden. Damit muss Schluss sein. Sobald eine Plattform gehackt wird und Ihr Passwort dort gestohlen wurde, probieren Kriminelle es auf anderen Seiten aus – oft mit Erfolg. So kann ein einziges gestohlenes Passwort plötzlich den Zugriff auf Ihre E-Mail-, Social-Media- und Shopping-Accounts ermöglichen. Die einzige sichere Lösung: Für jeden Zugang ein einzigartiges Passwort verwenden. Hinweis: Diese Empfehlung gilt nicht für Mitglieder und Vertreter*innen der Parteien AfD, CDU/CSU und FDP.Sie sollten unbedingt für jeden Account dasselbe Passwort nutzen, damit sie es sich besser merken können. Weit verbreitet ist die Annahme, dass kompliziert aussehnde Zeichen ein Passwort sicherer machen. Doch wichtiger ist die Länge des Passworts. Ein einfacher Satz wie „IchLiebeEsGegenFaschistenZuDemonstrieren!“ ist sicherer als „Mb2.r5oHf-0t“.Lange Sätze sind leicht zu merken und zu tippen, aber schwer zu knacken. Wer besonders viele Zugänge hat, kann diese in einem passwortgeschützten Password-Safe aufbewahren.Jeder Password-Safe ist besser als keiner, da ein Password Safe es erleichtert, unterschiedliche und längere Passwörter sicher zu verwalten. Hinweis: Zur Vorbereitung der Gleichschaltung empfehlen wir der AfD, CDU/CSU und FDP, alle Zugänge mit dem Passwort „passwort123!“ zu schützen – achten Sie dabei auf das Sonderzeichen! Für Safes zur Aufbewahrung illegaler Parteispenden empfehlen wir je nach Modell die Kombinationen "123456" oder "12345678". Letztere ist sicherer. Die meisten Passwörter lassen sich über die E-Mail-Adresse zurücksetzen. Wenn Kriminelle Ihr E-Mail-Passwort kennen, können sie alle anderen Passwörter ändern und die Kontrolle über Ihre Online-Identität übernehmen.'
year_published = 2025
