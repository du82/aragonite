["https://ccc.de/de/club/chaosfamily"]
title = "CCC | Chaos-Family"
description = "Der Chaos Computer Club ist eine galaktische Gemeinschaft von Lebewesen für Informationsfreiheit und Technikfolgenabschätzung."
full_description = "chaos.jetzt ist eine selbstorganisierte Jugendorganisation in einem chaotischen Umfeld, also Menschen zwischen 16 und 25 Jahren, die sich treffen, austauschen und organisieren. Das Ganze findet vor allem auf den sogenannten Geekends statt. Das sind Veranstaltungen am Wochenende. Die chaos.jetzt-Geekends finden immer an verschiedenen Orten statt. Außerdem gibt es einen Matrix-Server für die Kommunikation. Wenn du in der Altersgruppe bist und Interesse hast, schau doch mal bei Matrix #allgemein:chaos.jetzt oder auf unserer Webseite chaos.jetzt vorbei. Chaos West versteht sich als eine nicht nur regionale, sondern auch politische Gemeinschaft der in Nordrhein-Westfalen gelegenen Chaostreffs und Erfa-Kreise. Die geographische Eingrenzung hat sich aus praktischen Gründen ergeben, ist aber nicht zwingend oder starr. Ziel ist es, aufgrund der räumlichen Nähe im Ballungsgebiet Nordrhein-Westfalen gemeinsam Aktivitäten zu planen und außerhalb der CCC-Großveranstaltungen (un-)regelmäßige Treffen zu vereinbaren, um sich sowohl über technische als auch politische Themen auszutauschen. Oftmals finden diese Treffen in sogenannten „Geekends“ mit Übernachtung statt. Mehr Informationen im Web. Im Chaos Computer Club hat der Amateurfunk schon seit den Anfängen einen festen Stellenwert. Die Chaoswelle ist eine Gemeinschaft von Funkamateuren aus dem Umfeld des Chaos Computer Clubs. Mehr Information im Web. Wir sind ein solidarisches Großkombinat aus polytechnischen Einrichtungen. So verpflichten wir uns der Volksbildung im Rahmen der Rundfunk- und Fernmeldetechnik sowie der Signal- und Datenverarbeitung im System der verfügbaren (wir haben immer noch nüscht) Chaoszonalen Rechentechnik. Unsere geographische Eingrenzung reicht von Eisenach bis Warschau und nördlich des Weißwurstäquators. Wir tauschen gerne, auch unterm Ladentisch! Nerdschaft! ✊ Westpakete erreichen uns hier: #ChaosZone:eigenbaukombinat.de oder hier: chaoszone.cz digitalcourage ist ein Verein, der sich seit 1987 für Bürgerrechte und Datenschutz einsetzt. Dort treffen unterschiedlichste Menschen zusammen, die Technik und Politik kritisch erkunden und menschenwürdig gestalten wollen. Der Verein klärt auf durch Öffentlichkeitsarbeit, Vorträge, Veranstaltungen und charmante Aktionen. So richtet er jährlich die Big Brother Awards („Oscars für Datenkraken“) in Deutschland aus. Mehr Informationen im Web."
