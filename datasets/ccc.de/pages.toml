["https://ccc.de/de/biometrie"]
title = "CCC | Biometrie"
description = "Der Chaos Computer Club ist eine galaktische Gemeinschaft von Lebewesen für Informationsfreiheit und Technikfolgenabschätzung."
full_description = "Biometrie ist die Vermessung des menschlichen Körpers, die in der letzten Zeit von Computern, biometrische Systeme genannt, übernommen wird. Diese Meßdaten, die ein vereinfachtes Modell des vermessenen Menschen darstellen, können wie andere Daten auch vom Computer gespeichert, komprimiert, übertragen und mit vorher gespeicherten biometrischen Daten verglichen werden. Neben den auch von Menschen erkennbaren Merkmalen wie dem Gesicht, der Stimme, dem Gang oder der Handschrift können speziell konzipierte Computer auch mit Meßgeräten für dem menschlichen Auge verborgene Größen ausgestattet werden. Dazu gehören die Schweißrillen auf den Fingerkuppen (Fingerabdrücke), die Struktur von Netzhaut und Iris oder die chemische Zusammensetzung des Atems. Biometrische Systeme haben wie alle informationselektronischen Produkte Stärken und Schwächen, und wie bei anderen elektronischen Systemen ist Wissen darüber, in welchen Bereichen man sie als Werkzeug sinnvoll einsetzen kann, essentiell für eine Einsatzentscheidung. Beispielsweise ist das Modell, das aufgrund der Vermessung gewonnen wird, nie einmalig – schließlich können auch Menschen andere Menschen verwechseln. Auf der anderen Seite können auch zwei zu unterschiedlichen Zeiten gewonnene Meßdaten derselben Person nicht als identisch erkannt werden, genau wie auch Menschen andere Menschen unrasiert, mit Brille, im Dunkeln oder nach einem Urlaub nicht wiedererkennen, beim genauen Hinschauen lassen sich Menschen jedoch nicht so leicht durch angeklebte Bärte, eine verstellte Stimme oder ein vor das Gesicht gehaltenes Bild überlisten. Hersteller biometrischer Systeme haben ein natürliches Interesse, die Vorteile ihrer Systeme anzupreisen und die Schwächen weniger zu betonen. Problematisch wird es, wenn Vertreter des Staats im Glauben, die Modernität der Systeme würde auf sie abfärben, entweder uninformiert, in falscher Technikgläubigkeit oder einer Kombination von all dem die verpflichtende Erfassung von Bürgern beschließen. Weiter sind biometrische System – so sie denn funktionieren – im Stande, schnell viele Menschen zu erkennen. Die daraus gewonnenen Informationen dringen tief in die Privatsphäre des Menschen ein, und ein gesellschaftlicher Diskurs über diese Technologie wäre vor der flächendeckenden Einführung vonnöten gewesen."
year_published = 2025
