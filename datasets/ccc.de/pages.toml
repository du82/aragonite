["https://ccc.de/de/imprint"]
title = "CCC | Impressum"
description = "Der Chaos Computer Club ist eine galaktische Gemeinschaft von Lebewesen für Informationsfreiheit und Technikfolgenabschätzung."
full_description = "Hinweise zur allgemeinen Kontaktaufnahme gibt es im Kontakt-Bereich. Eine Möglichkeit, uns persönlich kennenzulernen, bieten die lokalen Clubs. Der Chaos Computer Club e.V. ist eingetragen im Vereinsregister des Amtsgerichts Hamburg unter der Vereinsregisternummer 10940. Bitte schickt uns keine Übergabeeinschreiben, wir haben keinen regulären Bürobetrieb und damit keine Möglichkeit, diese entgegenzunehmen. Sie gehen deshalb nach ein paar Wochen wieder zurück an den Absender. Wenn es ein Einschreiben sein muss, dann bitte nur ein Einwurfeinschreiben."
