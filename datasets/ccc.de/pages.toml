["https://ccc.de/de/tags/camp"]
title = "CCC | Chaos Computer Club"
description = "Der Chaos Computer Club ist eine galaktische Gemeinschaft von Lebewesen für Informationsfreiheit und Technikfolgenabschätzung."
full_description = 'In light of recent accusations against a regular visitor and speaker at our events, the Chaos Computer Club re-emphasizes the following: The CCC is, by its charter and by common consent, a galactic organization of all life forms. We are dedicated to providing a safe, comfortable, and supportive experience for everybody attending our events. Eines der Hauptwerkzeuge zum Erfahrungsaustausch zwischen den Hackern, die sich zum Chaos Computer Club zugehörig fühlen, sind die zahlreichen Veranstaltungen, die organisiert werden von den Erfas, Chaostreffs und einer riesigen Schar freiwilliger "OC" genannter Gruppen. Der Ticket-Vorverkauf zum 3. Chaos Communication Camp ist gestartet: Zu Preisen von 100 bis 130 Euro sind Eintrittstickets für das Camp erhältlich, auch Unterstützertickets zum Preis von 500 bzw. 1500 Euro können bereits vorab gekauft werden. Weit über tausend Hacker und Künstler aus aller Welt, über hundert Fachvorträge und Workshops, Kunst und Schönheit aus dem Computer in allen Variationen, Festivalatmosphäre und ein eigener Charterflug aufs Gelände: Nach überaus erfolgreichen Veranstaltungen 1999 und 2003 lädt der Chaos Computer Club zum dritten Mal auf das Chaos Communication Camp. Was würde ein Hacker-Camp an einem Flughafen vollkommen machen? Natürlich die Anreise in einem Flugzeug. Landeanflug, Aussteigen, kurzer Fußmarsch, fertig. Klingt spannend, cool? Sollte man meinen – scheint es aber nicht zu sein, denn die Hacker Foundation hat ein noch größeres Paket geschnürt. The Call for Participation for the Camp has its submission deadline on May, 15th. If you want to participate in the conference program of the Chaos Communication Camp 2007, please do not forget to submit. Das internationale Hacker-Zeltlager, What The Hack, wird wie geplant stattfinden. Nachdem auf Mißverständnissen basierende Zweifel ausgeräumt werden konnten, wird die jüngst noch umstrittene Genehmigung für die Veranstaltung nach Aussage der Offiziellen demnächst erteilt werden. Der CCC ist mit dabei mit dem Chaos Village.'
year_published = 2025
