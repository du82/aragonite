["https://ccc.de/de/hackerethics"]
title = "CCC | Hackerethik"
description = "Der Chaos Computer Club ist eine galaktische Gemeinschaft von Lebewesen für Informationsfreiheit und Technikfolgenabschätzung."
full_description = 'Die Hackerethik ist nur bedingt einheitlich definiert. Es gibt eine ursprüngliche Version aus dem Buch "Hackers" von Steven Levy (ISBN 0-440-13405-6). Unstrittig ist insofern, daß die ursprüngliche Version aus dem MIT-Eisenbahnerclub (Tech Model Railroad Club) kommt und damit aus einer Zeit stammt, in der sich verhältnismäßig viele Leute wenige Computer teilen mußten und entsprechende Überlegungen zum Umgang miteinander und der Materie sinnvoll waren. Die letzten beiden Punkte sind Ergänzungen des CCC aus den 1980er Jahren. Nachdem einige mehr oder weniger Durchgeknallte aus der Hackerszene bzw. aus dem Umfeld auf die Idee kamen, ihr "Hack-Knowhow" dem KGB anzubieten, gab es heftige Diskussionen, weil Geheimdienste konträr zur Förderung freier Information stehen. Aber auch Eingriffe in die Systeme fremder Betreiber wurden zunehmend als kontraproduktiv erkannt. Um den Schutz der Privatsphäre des Einzelnen mit der Förderung von Informationsfreiheit für Informationen, welche die Öffentlichkeit betreffen, zu verbinden, wurde schließlich der bislang letzte Punkt angefügt. Die Hackerethik befindet sich – genauso wie die übrige Welt – insofern in ständiger Weiterentwicklung und Diskussion, die o. g. Regeln dienen als Diskussionsgrundlage und Orientierung.'
year_published = 2025
clearnet = "https://ccc.de/de/hackerethics"
