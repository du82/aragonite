["http://www.ccc.de/de/updates/2025/dont-trust"]
title = "CCC | 5-Punkte-Plan für d(on't)-trust"
description = "Der Chaos Computer Club ist eine galaktische Gemeinschaft von Lebewesen für Informationsfreiheit und Technikfolgenabschätzung."
full_description = "Mit bedeutungsschwangerer Cyber-Rhetorik will d-trust von der Verantwortung für ein großes Datenleck ablenken. Der CCC erklärt die Hintergründe und fordert Konsequenzen. Mit bedeutungsschwangerer Cyber-Rhetorik will d-trust von der Verantwortung für ein großes Datenleck ablenken. Der CCC erklärt die Hintergründe und fordert Konsequenzen. d(on’t)-trust ist ein qualifizierter Vertrauensdiensteanbieter und ein Unternehmen der Bundesdruckerei. Das Unternehmen will “Vertrauen in die Digitalisierung stärken” und “sichere digitale Identitäten” bereitstellen. Unter anderem stellt d(on’t)-trust die elektronischen Heilberufeausweise und Praxisausweise aus, die für den Zugriff auf die Telematik-Infrastruktur und damit die elektronische Patientenakte benötigt werden. Durch eine Kombination aus Versehen, Inkompetenz und mangelnder Sorgfalt hat d(on’t)-trust Daten seiner Kund*innen im Internet veröffentlicht. Zu den von d(on’t)-trust veröffentlichten Daten gehören Vor- und Nachname, E-Mail-Adresse, Geburtsdatum sowie teilweise Adressdaten und Nummern des jeweiligen Ausweisdokuments. Die vermutlich unbeabsichtigte Veröffentlichung dieser Daten ist einem Sicherheitsforscher Anfang Januar aufgefallen. Da die Ampel es versäumt hat, Sicherheitsforschung zu entkriminalisieren und die Hacker-Paragraphen abzuschaffen, hat der Sicherheitsforscher das von d(on’t)-trust verantwortete Datenleck unmittelbar anonym an den CCC gemeldet und die restlose Löschung der Daten versichert. Der CCC erstattet aktuell im Rahmen seiner ehrenamtlichen Arbeit wöchentlich eine hohe Anzahl an Meldungen und konnte das durch d(on’t)-trust verursachte Datenleck erst prüfen, als es bereits beseitigt war. Das Unternehmen d(on’t)-trust hat nach eigenen Angaben “Strafanzeige gegen Unbekannt gestellt” und spricht von einem “Angriff”, bei dem “möglicherweise personenbezogene Daten von Antragstellern entwendet worden seien.” Ein “spezialisiertes IT-Sicherheitsteam” würde gemeinsam mit Sicherheitsbehörden die “Hintergründe des Angriffs” aufklären. Weiterhin erklärt das Unternehmen, “eine Schnittstelle des Portals wurde gezielt manipuliert.” [1]"
