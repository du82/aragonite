["http://www.ccc.de/de/updates/2024/chatkontrolle-weg"]
title = "CCC | CCC fordert, den Vorschlag zur Chatkontrolle endlich zurückzuziehen"
description = "Der Chaos Computer Club ist eine galaktische Gemeinschaft von Lebewesen für Informationsfreiheit und Technikfolgenabschätzung."
full_description = "Die Idee der Chatkontrolle ist ein Angriff auf Verschlüsselung und bleibt eine Bedrohung für alle Menschen, die auf sichere private Kommunikation angewiesen sind. Deshalb fordert ein Bündnis aus mehr als vierzig europäischen Organisationen, die sich für Bürgerrechte und Kinderschutz engagieren, von dem gefährlichen Vorschlag der Chatkontrolle abzusehen und stattdessen endlich Maßnahmen für wirksamen Kinderschutz zu ergreifen. Die Idee der Chatkontrolle ist ein Angriff auf Verschlüsselung und bleibt eine Bedrohung für alle Menschen, die auf sichere private Kommunikation angewiesen sind. Deshalb fordert ein Bündnis aus mehr als vierzig europäischen Organisationen, die sich für Bürgerrechte und Kinderschutz engagieren, von dem gefährlichen Vorschlag der Chatkontrolle abzusehen und stattdessen endlich Maßnahmen für wirksamen Kinderschutz zu ergreifen. Dass die geplante Verordnung zur Chatkontrolle eine Überwachungsinfrastruktur aufbauen und das Ende der Ende-zu-Ende-Verschlüsselung einläuten würde, ist technisch unausweichlich. Deswegen gibt es anhaltenden Protest gegen das Vorhaben von all jenen, denen die Bedeutung sicherer Kommunikation klar ist. Aber auch die Kinderschutzverbände kritisieren die Chatkontrolle-Idee: Sie ist schlicht unwirksam beim Schutz von Kindern. Der Schutz von Kindern vor sexueller Gewalt ist ein wichtiges Anliegen, das alle unterzeichnenden Organisationen unterstützen. Doch wenn das EU-Vorhaben weder diesen Schutz noch irgendwelche sinnvollen Lösungen anbietet, sondern stattdessen eine neue Form der Massenüberwachung etablieren wird, dann muss diese schon viel zu lange diskutierte Idee der Chatkontrolle endlich beerdigt werden. Sie schafft Gefahren für alle Menschen, insbesondere auch für Kinder. Wir fordern zusammen mit dem Kinderschutzbund: Der Entwurf der Chatkontrolle-Verordnung soll sofort zurückgezogen und stattdessen an echtem Kinderschutz gearbeitet werden. Am 20. Juni 2024 war die belgische EU-Ratspräsidentschaft das nun vierte Land, dem es nicht gelang, eine Einigung über die umstrittene Verordnung zur Chatkontrolle (gegen sexuellen Kindesmissbrauch (Child Sexual Abuse, CSA)) zu erzielen. Dieser ungewöhnliche Umstand ist ein Symptom dafür, wie fehlerhaft und irregeleitet der ursprüngliche Verordnungsvorschlag war."
year_published = 2024
