title = "CCC | Chaos Computer Club"
description = "Der Chaos Computer Club ist eine galaktische Gemeinschaft von Lebewesen für Informationsfreiheit und Technikfolgenabschätzung."
full_description = 'Eines der Hauptwerkzeuge zum Erfahrungsaustausch zwischen den Hackern, die sich zum Chaos Computer Club zugehörig fühlen, sind die zahlreichen Veranstaltungen, die organisiert werden von den Erfas, Chaostreffs und einer riesigen Schar freiwilliger "OC" genannter Gruppen. Der Chaos Computer Club Zürich (CCCZH) veranstaltet am kommenden Wochenende vom 12. und 13. Mai die Veranstaltung Chaosdock, um den Erfahrungsaustausch zu verschärfen sowie den Kontaktaufbau und die -pflege zwischen Vereinsmitgliedern und -interessierten zu fördern. Veranstaltungsort sind die Clubräumlichkeiten (DOCK18), wo sich der CCCZH auch wöchentlich trifft.'
