["https://ccc.de/de/updates/2015/chaos-computer-club-ladt-ein-zum-32c3"]
title = "CCC | Chaos Computer Club lädt ein zum 32C3"
description = "Der Chaos Computer Club ist eine galaktische Gemeinschaft von Lebewesen für Informationsfreiheit und Technikfolgenabschätzung."
full_description = "Der Chaos Computer Club lädt alle galaktischen Lebewesen zum 32. Chaos Communication Congress im Congress Center Hamburg ein. Dieses Jahr wird der durchschnittliche Eintrittspreis des Hackercongresses vom 27. bis zum 30.12.2015 um zehn Euro niedriger sein. Der Chaos Computer Club lädt alle galaktischen Lebewesen zum 32. Chaos Communication Congress im Congress Center Hamburg ein. Dieses Jahr wird der durchschnittliche Eintrittspreis des Hackercongresses vom 27. bis zum 30.12.2015 um zehn Euro niedriger sein. Inzwischen ist der Chaos Communication Congress zu einer Veranstaltung der Superlative gewachsen. Die Teilnehmer erwarten 130 sorgfältig ausgewählte Vorträge, unzählige selbstorganisierte Workshops und Assemblies — von den Besuchern selbst bespielte Areale. Der Congress ist gleichzeitig aber auch die größte Kindertagesstätte und Diskothek Hamburgs zwischen den Jahren. Um möglichst vielen die Teilnahme zu ermöglichen, hat es sich eingebürgert, daß alle Teilnehmer soviel zahlen, wie sie können – und nicht mehr. Andererseits soll der Congress natürlich keinen Verlust machen und mit einer schwarzen Null in der Bilanz abgeschlossen werden. Trotzdem können wir für dieses Jahr die durchschnittlichen Ticketpreise um zehn Euro gegenüber letztem Jahr senken und öffnen damit unseren Kulturraum wieder ein Stückchen weiter. Deshalb kommen auch die Teilnehmer der Veranstaltung „Jugend hackt“ schon für zehn Euro auf den Congress. Unter dem Motto „Gated Communities“ zeigen wir mit dem Finger auf den Trend der letzten Jahrzehnte, sich immer weiter in seinen Peer-Groups, Walled Gardens und Filterblasen zurückzuziehen. Es ist an der Zeit, diese wieder aufzubrechen, hineinzuschauen und zu diskutieren. Um eine weitere Mauer in unserer Community niederzureißen, sind hiermit explizit Hackerinnen und Tinkerinnen und alle interessierten Frauen herzlich zum Congress eingeladen. Für Erstbesucher und Erstbesucherinnen zum Congress empfiehlt es sich, mit den ChaospatInnen Kontakt aufzunehmen, die Euch helfen, einen guten Start in den Congress zu haben."
year_published = 2015
clearnet = "https://ccc.de/de/updates/2015/chaos-computer-club-ladt-ein-zum-32c3"
