["http://www.ccc.de/de/updates/2024/biometrischer-uberwachungsexzess-der-bundesregierung"]
title = "CCC | Biometrischer Überwachungsexzess der Bundesregierung"
description = "Der Chaos Computer Club ist eine galaktische Gemeinschaft von Lebewesen für Informationsfreiheit und Technikfolgenabschätzung."
full_description = "Das neue „Sicherheitspaket“ der Bundesregierung beinhaltet gefährliche Überwachungsvorhaben. Die geplante biometrische Erfassung von Gesichtsbildern aus dem Internet ist ein Angriff auf die Privatsphäre aller – ohne klare Notwendigkeit oder Nutzen. Das neue „Sicherheitspaket“ der Bundesregierung beinhaltet gefährliche Überwachungsvorhaben. Die geplante biometrische Erfassung von Gesichtsbildern aus dem Internet ist ein Angriff auf die Privatsphäre aller – ohne klare Notwendigkeit oder Nutzen. Die gestrige Vorstellung eines Überwachungspakets in Reaktion auf den Anschlag in Solingen markiert einen neuen Tiefpunkt im fortwährenden Abbau von Grundrechten. Die Ampel-Koalition möchte faktisch Anonymität beenden und uns alle immer und überall identifizierbar machen. Ermittlungsbehörden sollen das Internet nach Gesichtsbildern durchforsten und diese Daten für biometrische Abgleiche nutzen dürfen. Dieser massive Überwachungsvorstoß zur Gesichtserkennung wird noch nicht einmal begründet. Diese neue Befugnis sollen die Ermittlungsbehörden „unter Beachtung der KI-Verordnung“ und des Datenschutzes erhalten, schreibt die Bundesregierung in ihrem „Sicherheitspaket“-Papier. Beides ist nicht nur eine Selbstverständlichkeit, sondern auch ein Widerspruch: Die KI-Verordnung verbietet es, KI-Systeme zu nutzen, um Datenbanken für biometrische Gesichtserkennung durch das massenhafte ziellose Auslesen von Gesichtsfotos aus dem Netz zu erstellen oder zu erweitern. Verkauft wird die neue biometrische Rundum-Überwachung jetzt als „Maßnahme gegen gewaltbereiten Islamismus“. Doch schon in dem vor zwei Wochen geleakten BMI-Referentenentwurf für ein neues BKA-Gesetz ist die Idee weitreichender biometrischer Überwachung enthalten. Und zwar mit noch mehr biometrischen Daten, die aus dem Internet gesammelt werden sollen, etwa „Bewegungs-, Handlungs- oder Sprechmuster.“ Zusätzlich sollen polizeiliche Daten automatisiert mit Software analysiert und sogar für das Testen und das Training von „KI-Anwendungen“ genutzt werden. Das bedeutet praktisch, dass der ganze Zoo polizeilicher Datenbanken nicht nur zusammengeführt werden soll, sondern die Daten in „KI-Anwendungen“ enden werden. Offenbar ignoriert die Bundesregierung die Fehleranfälligkeit und Risiken von KI und sitzt dem KI-Hype auf."
year_published = 2024
