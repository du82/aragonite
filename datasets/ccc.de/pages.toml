["https://ccc.de/de/campaigns"]
title = "CCC | Chaos-Kampagnen"
description = "Der Chaos Computer Club ist eine galaktische Gemeinschaft von Lebewesen für Informationsfreiheit und Technikfolgenabschätzung."
full_description = 'Zu den Kampagnen des Chaos Computer Clubs gehört seit 2002 das Fahndungsplakat für Datenschnüffler und Überwachungstäter mit wechselnden Motiven. Der Debatte um die biometrische Kompletterfassung der Bundesbürger gibt der Chaos Computer Club (CCC) eine konkretere Form: Seiner Vereinszeitschrift "Die Datenschleuder" wurde ein biometrisches Sammelalbum für die Fingerabdrücke schnüffelfreudiger Politiker beigelegt. Eröffnet wurde das heitere Abdrucksammeln mit einem Fingerabdruck unseres geliebten Innenministers, Dr. Wolfgang Schäuble. Großen Erfolg hatte der Chaos Computer Club mit seiner Kampagne gegen Wahlcomputer. Das Bundesverfassungsgericht hat im März 2009 entschieden, daß der Einsatz von Wahlcomputern nicht verfassungsgemäß ist. Der Kernpunkt dieser Kampagne, der Verfassungsgrundsatz der Öffentlichkeit der Wahl, wurde vom Bundesverfassungsgericht als wesentlich für die Durchführung demokratischer Wahlen definiert. Als Mitglied von EDRi (European Digital Rights) informiert der Chaos Computer Club über die Kampagne gegen die illegale Übermittlung von Flugpassagierdaten in die USA. Bereits seit 2002 unterstützt der CCC freie Meinungsäußerung, ungehinderte Kommunikation und Internationalität im World Wide Web. Mit seiner Kampagne gegen die Einschränkung der Informationsfreiheit kämpfen die Mitglieder für die Wahrung der Menschen- und Grundrechte in einem freien Internet. Konkret wurde der Kampf für die Informationsfreiheit 2008 in China, als tausende Reporter das Reich der Mitte bereisen, um dort über die Olympischen Spiele zu berichten und bei ihrer Berichterstattung vor einer elektronischen Chinesischen Mauer standen – ganz genauso wie die Chinesen selbst auch. Dies ist nur eine Auswahl unserer Aktivitäten. Wenn Du mehr erfahren willst, nimm gern Kontakt mit uns auf.'
