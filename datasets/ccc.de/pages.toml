["http://www.ccc.de/de/datenschutz"]
title = "CCC | Datenschutzerklärung"
description = "Der Chaos Computer Club ist eine galaktische Gemeinschaft von Lebewesen für Informationsfreiheit und Technikfolgenabschätzung."
full_description = "Verantwortlicher für die Erhebung, Verarbeitung und Nutzung Eurer personenbezogenen Daten im Sinne von Art. 4 Nr. 7 DSGVO ist Wenn Du unsere Webseiten www.ccc.de und ds.ccc.de besuchst, werden keine personenbezogenen Daten verarbeitet. Bei der Kontaktaufnahme mit uns (z. B. E-Mail) werden Deine Angaben zur Bearbeitung der Kontaktanfrage und deren Abwicklung gem. Art. 6 Abs. 1 lit. a) DSGVO verarbeitet. Wir löschen die Anfragen, sofern diese nicht mehr erforderlich sind. Hierbei werden gesetzliche Archivierungspflichten beachtet. Wir stellen Mailinglisten zur Verfügung. Eine Mailingliste ist ein Sammlung von E-Mail-Adressen zum Zwecke der Verteilung von Informationen zwischen den Teilnehmerinnen. Der Zugang wird von uns administriert. Rechtsgrundlage für die Verarbeitungen der damit einhergehenden personenbezogenen Daten ist die Einwilligung gemäß Artt. 6 Abs. 1 lit. a) und 7 DSGVO. Diese Einwilligung kann jederzeit für die Zukunft widerrufen werden. Hierzu kann lediglich eine Unsubscribe-E-Mail versandt werden. Die Datenschutz-Grundverordnung garantiert Euch gewisse Rechte, die Ihr uns gegenüber – soweit die gesetzlichen Voraussetzungen vorliegen – geltend machen könnt. Wenn Du Widerspruch einlegst, werden wir Deine personenbezogenen Daten nicht mehr verarbeiten, es sei denn, wir können zwingende schutzwürdige Gründe für die Verarbeitung nachweisen, die Deine Interessen, Rechte und Freiheiten überwiegen, oder die Verarbeitung dient der Geltendmachung, Ausübung oder Verteidigung von Rechtsansprüchen. Ihr könnt Euch auch bei einer Aufsichtsbehörde beschweren, z. B. wenn ein mutmaßlicher datenschutzrechtlicher Verstoß vorliegt. Ihr könnt Euch z. B. an die Aufsichtsbehörde Eures üblichen Aufenthaltsortes, Arbeitsplatzes oder den Ort des mutmaßlichen Verstoßes wenden."
