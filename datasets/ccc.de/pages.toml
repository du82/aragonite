external-references = ["bsky.app", "c3d2.de", "chaosradio.ccc.de", "chinesewall.ccc.de", "dasalte.ccc.de", "de.wikipedia.org", "ds.ccc.de", "easterhegg.eu", "edri.org", "eh22.easterhegg.eu", "entropia.de", "erdgeist.org", "events.ccc.de", "groups.google.de", "hackover.de", "hannover.ccc.de", "media.ccc.de", "social.bau-ha.us", "wahlcomputer.ccc.de", "wauland.de"]

["https://ccc.de/en/publications"]
title = "CCC | Publikationen"
description = "Der Chaos Computer Club ist eine galaktische Gemeinschaft von Lebewesen für Informationsfreiheit und Technikfolgenabschätzung."
full_description = 'Die Datenschleuder, das wissenschaftliche Fachblatt für Datenreisende, ist ein Organ des Chaos Computer Clubs. Die Zeitschrift erscheint unregelmäßig. CCC-Mitglieder erhalten die Datenschleuder im Rahmen ihrer Mitgliedschaft. Nichtmitglieder können die Datenschleuder auch abonnieren. Vergangene Ausgaben gibt es hier zum Download. Auf media.ccc.de werden alle Vortragsaufzeichnungen der Congresse, Camps und vieler weiterer Veranstaltungen in hoher Qualität und werbefrei archiviert. In den vergangenen Jahren trat der CCC als Sachverständiger in Verfahren vor dem Bundesverfassungsgericht auf. Dabei wurde die Expertise in Sachen Wahlcomputer, Vorratsdatenspeicherung, Hackerparagraph und Bundestrojaner angefragt. Unsere Stellungnahmen sind stets öffentlich. Die Stellungnahme zu einer Verfassungsbeschwerde gegen den "Hackerparagraph" ist hier verfügbar. Eine Pressemitteilung gab es dazu auch. Älteren Datums, aber immer noch gern gelesen, ist unsere 1985 erschienene Hackerbibel, ein Sammelsurium aus Geschichten der Urzeit der Hackerszene.'
year_published = 2025
