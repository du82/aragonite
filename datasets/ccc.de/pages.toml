full_description = "Erfa-Kreise sind fest an die Vereinsstruktur gebundene Treffs der lokalen Hackerschaft. Erfa-Kreis steht für Erfahrungsaustauschkreis und ist laut Satzung des Chaos Computer Clubs eine Organisationsform innerhalb des Clubs zur Durchführung seiner Aufgaben auf regionaler Ebene. Um Erfa-Kreis werden zu können, ist es erforderlich, ein eingetragener Verein (e.V.) zu sein. Die Erfas veranstalten regelmäßige öffentliche Treffen, um diverse Projekte voranzutreiben, aktuelle Themen zu diskutieren und natürlich auch, um gemeinsam Spaß zu haben. Chaostreffs sind lockere Zusammentreffen von Hackern, die sich dem CCC nahefühlen. Wer keinen Chaostreff (oder Erfa-Kreis) in seiner Nähe hat, ist herzlich eingeladen, einen zu gründen und andere Interessierte (zum Beispiel per E-Mail an chaostreffs@lists.ccc.de) einzuladen. Chaostreffs gibt es in folgenden Städten:"
