["http://www.ccc.de/de/updates/2024/biometrische-daten-nicht-in-private-hande"]
title = "CCC | Biometrische Daten nicht in private Hände"
description = "Der Chaos Computer Club ist eine galaktische Gemeinschaft von Lebewesen für Informationsfreiheit und Technikfolgenabschätzung."
full_description = "Privatunternehmen sollen am Flughafen biometrische Daten aus dem Chip des Reisepasses auslesen dürfen – ein gefährlicher Präzedenzfall. Der CCC lehnt diesen Vorstoß entschieden ab und fordert die Streichung entsprechender Passagen im Gesetzentwurf. Privatunternehmen sollen am Flughafen biometrische Daten aus dem Chip des Reisepasses auslesen dürfen – ein gefährlicher Präzedenzfall. Der CCC lehnt diesen Vorstoß entschieden ab und fordert die Streichung entsprechender Passagen im Gesetzentwurf. Der Entwurf zum Vierten Bürokratieentlastungsgesetz sieht Änderungen im Passgesetz und im Luftverkehrsgesetz vor, die das Auslesen der Daten des Chips im Reisepass betreffen. Auf diesem Funkchip sind personenbezogene Informationen zum Passbesitzer gespeichert, darunter auch biometrische Daten. Die vorgeschlagenen Änderungen beziehen sich auf das biometrische Gesichtsbild. Künftig sollen Luftfahrtunternehmen, Flughafenbetreiber und Bodenabfertigungsdienstleister dieses biometrische Gesichtsbild auslesen dürfen. Damit wären erstmals gewinnorientierte Privatunternehmen befugt, die Körperdaten aus dem Reisepass-Chip zu nutzen. Bislang war dies selbstverständlich nur bei hoheitlichen und damit behördlichen Grenzkontrollen erlaubt. Sobald die ersten Privatunternehmen auf die staatlicherseits zwangsweise erhobenen Daten zugreifen dürfen, werden andere Branchen Schlange stehen, um auch Zugang zu diesen Informationen mit staatlichem Echtheitssiegel zu erhalten. Der CCC fordert daher die Streichung der entsprechenden Passagen im Gesetzesentwurf. Flugunternehmen das Auslesen sensibler biometrischer Daten aus dem Chip des Reisepasses zu erlauben, ist völlig inakzeptabel. Wir verweisen auf unsere Stellungnahme zum Gesetzentwurf an das Justizministerium vom Februar. „Der Privatisierung von biometrischen Daten aus amtlichen Dokumenten muss Einhalt geboten werden,“ sagte CCC-Sprecher Matthias Marx, „erst recht, wenn dieser schwere Eingriff in die Privatsphäre mit bloßen Komfortleistungen privater Unternehmen begründet wird.“"
year_published = 2024
