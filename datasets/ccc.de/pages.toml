["https://ccc.de/de/tags/regional"]
title = "CCC | Chaos Computer Club"
description = "Der Chaos Computer Club ist eine galaktische Gemeinschaft von Lebewesen für Informationsfreiheit und Technikfolgenabschätzung."
full_description = 'Wie es sich für einen Club gehört, der das Chaos schon im Namen trägt, mag die Struktur des CCC für Außenstehende verwirrend erscheinen. Zum einen gibt es den CCC e. V. mit Sitz in Hamburg, der bundesweit tätig ist. Daneben existieren sogenannte Erfa-Kreise (Erfahrungsaustauschkreise), die man auch als „lokale Niederlassungen“ bezeichnen könnte. Erfa-Kreise sind fest an die Vereinsstruktur gebundene Treffs der lokalen Hackerschaft. Erfa-Kreis steht für Erfahrungsaustauschkreis und ist laut Satzung des Chaos Computer Clubs eine Organisationsform innerhalb des Clubs zur Durchführung seiner Aufgaben auf regionaler Ebene. Um Erfa-Kreis werden zu können, ist es erforderlich, ein eingetragener Verein (e.V.) zu sein. Die Erfas veranstalten regelmäßige öffentliche Treffen, um diverse Projekte voranzutreiben, aktuelle Themen zu diskutieren und natürlich auch, um gemeinsam Spaß zu haben. Chaostreffs sind lockere Zusammentreffen von Hackern, die sich dem CCC nahefühlen. Wer keinen Chaostreff (oder Erfa-Kreis) in seiner Nähe hat, ist herzlich eingeladen, einen zu gründen und andere Interessierte (zum Beispiel per E-Mail an chaostreffs@lists.ccc.de) einzuladen. Chaostreffs gibt es in folgenden Städten: Auch in diesem Jahr wird in den Räumlichkeiten des Chaostreffs Dortmund wieder ein Chaos-West-Grillen stattfinden. In Anlehnung an das Event im letzten Jahr mit über vierzig Teilnehmern wird es das Grillen in diesem Jahr in einer "verlängerten Ausführung" geben. Daneben sollen in diesem Jahr auch Workshops, Vorträge und Lightning Talks stattfinden. Nachdem es seit ein paar Jahren wieder ruhiger war um einen Chaostreff in Bremen, wird sich am morgigen Nikolaustag wieder getroffen. Ob es nun das 21C3-Nachbeben ist, sei dahingestellt. Auf jeden Fall freuen wir uns über jeden neuen Chaostreff, der entsteht. Diesmal in einem Ort, wo der Treff vor etwa fünf Jahren entschlief: Würzburg. Und das nächste Treffen ist auch schon morgen! Am heutigen Freitag trifft sich ab 19 Uhr der neue Chaostreff in Rothenburg ob der Tauber zum ersten Mal.'
