["https://ccc.de/de/updates/2022/chaos-computer-club-hackt-video-ident"]
title = "CCC | Chaos Computer Club hackt Video-Ident"
description = "Der Chaos Computer Club ist eine galaktische Gemeinschaft von Lebewesen für Informationsfreiheit und Technikfolgenabschätzung."
full_description = "Sicherheitsforscher des Chaos Computer Clubs (CCC) haben erfolgreich die gängigen Lösungen für videobasierte Online-Identifizierung (Video-Ident) überwunden. Dabei haben sie sich unter anderem Zugriff auf die elektronische Patientenakte einer Testperson verschafft. Der CCC fordert, diese unsichere Technologie nicht mehr dort einzusetzen, wo ein hohes Schadenspotential besteht. Sicherheitsforscher des Chaos Computer Clubs (CCC) haben erfolgreich die gängigen Lösungen für videobasierte Online-Identifizierung (Video-Ident) überwunden. Dabei haben sie sich unter anderem Zugriff auf die elektronische Patientenakte einer Testperson verschafft. Der CCC fordert, diese unsichere Technologie nicht mehr dort einzusetzen, wo ein hohes Schadenspotential besteht. Im Video-Ident-Verfahren können Nutzer ihre Identität im Internet nachweisen, indem sie ein Video von sich und ihrem Ausweisdokument an einen Video-Ident-Anbieter übertragen und dort durch einen Mitarbeiter oder eine Software prüfen lassen. Anschließend kann der so Identifizierte beispielsweise Mobilfunkverträge abschließen, EU-weit rechtsverbindlich unterschreiben (QES), Kredite beantragen und Bankkonten anlegen – oder eine elektronische Patientenakte (ePA) eröffnen. Eine eigens ersonnene Choreographie soll beim Video-Ident-Verfahren anhand von Indizien wie im Videobild sichtbaren Hologrammen oder der Mimik zwei entscheidende Fragen beantworten: Ist der Ausweis echt? Ist die Person vor der Kamera echt? Die Video-Ident-Anbieter behaupten, ihre Lösungen würden Betrugsversuche sicher erkennen. Dass dieses Versprechen nicht eingehalten wird, zeigt Martin Tschirsich, ein Sicherheitsforscher des CCC, in seinem Bericht, den wir veröffentlichen. Tschirsich demonstrierte bereits 2019, wie Unbefugte in den Besitz von Gesundheitskarten, Arzt- und Praxisausweisen gelangen konnten. Nun legt er ausführlich dar, wie es ihm mit Open-Source-Software sowie ein bisschen roter Aquarellfarbe gelungen ist, mittels „videotechnischer Neukombination mehrerer Quell-Dokumente“ sechs Video-Ident-Lösungen zu überlisten und den Mitarbeitern bzw. der Software eine fremde Identität vorzugaukeln. Bis heute blieben diese Angriffe unerkannt."
year_published = 2022
clearnet = "https://ccc.de/de/updates/2022/chaos-computer-club-hackt-video-ident"
