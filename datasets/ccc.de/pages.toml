["https://ccc.de/en/updates/2024/das-ist-vollig-entgleist"]
title = "CCC | They have not been trained for this"
description = "Der Chaos Computer Club ist eine galaktische Gemeinschaft von Lebewesen für Informationsfreiheit und Technikfolgenabschätzung."
full_description = "The Chaos Computer Club (CCC) supports the three hackers who explained in detail at 37C3 how the Polish rail vehicle manufacturer Newag had manipulated its trains in such a way that they could only be repaired in the company's own workshops. The manufacturer reacted to the publications with an attitude not seen since the 90s and sued the hackers under both criminal and civil law. At 38C3, the hackers are now reporting on their legal odyssey, which cost so far around 30,000 euros. The CCC is calling for donations to cover the legal and other resulting costs incurred so far."
year_published = 2024
