["http://www.ccc.de/de/updates/2024/38c3-illegal-instructions"]
title = "CCC | Der 38. Chaos Communication Congress: Illegal Instructions"
description = "Der Chaos Computer Club ist eine galaktische Gemeinschaft von Lebewesen für Informationsfreiheit und Technikfolgenabschätzung."
full_description = "Ende Dezember ist wieder Congress-Zeit: Der Chaos Computer Club lädt unter dem Motto „Illegal Instructions“ zum 38. Chaos Communication Congress nach Hamburg ins CCH. Ende Dezember ist wieder Congress-Zeit: Der Chaos Computer Club lädt unter dem Motto „Illegal Instructions“ zum 38. Chaos Communication Congress nach Hamburg ins CCH. Die Zeichen stehen auf Sturm. Die politischen und rechtlichen Bemühungen, das Abgleiten Europas in fragmentierte, unfreundliche Überwachungs- und Repressionsgesellschaften zu verhindern, werden immer weniger wirksam und nachhaltig. Es ist an der Zeit, sich wieder auf gute Traditionen zu besinnen: Technischer Widerstand gegen Überwachung, Vermessung, Datenschnorcheln und Infiltration ist dabei eine der notwendigen Komponenten. In diesem Sinne wird der 38. Chaos Communication Congress unter dem Motto „Illegal Instructions“ einen verstärkten Fokus darauf legen, wie wir menschenfeindliche Technologien durch Illegal Instructions überlisten können. Wie alle bisherigen Congresse wird auch der 38C3 eine internationale Veranstaltung sein, die alle demokratisch gesinnten Lebensformen willkommen heißt und zur Vernetzung und produktiven Kooperation einlädt. Neben Vorträgen, Workshops und Lightning Talks wird es ein umfangreiches Kunst- und Kulturprogramm und viel Platz für Assemblies geben, um auszuloten, wie wir mittels Illegal Instructions Sand ins Getriebe der digitalkapitalistischen Überwachungsmaschinerie streuen können. Wer nun statt Weihnachtsferien lieber Lust hat, technische und gesellschaftspolitische Hacks zu präsentieren, verfolgen und diskutieren, hat ab Anfang Oktober die Möglichkeit, am Call for Participation teilzunehmen und unser Programm mitzugestalten. Weitere Informationen zur Anreise, wie ihr teilnehmen könnt, wie ihr an Tickets kommt, wo ihr eure Hackerspaces anmelden könnt und alle weiteren organisatorischen Details findet ihr im Veranstaltungsblog. Der Congress ist ein riesiger selbstgestalteter Freiraum, in dem es von einer unüberschaubar kreativen Anzahl von Workshops nur so wimmelt. Wir erwarten spontane Aktivitäten in den von über 350 komplett selbstorganisierten Gruppen auf die Beine gestellten sogenannten Assemblies, wo Künstlerinnen und Kulturorganisatorinnen zusammen mit Hackerinnen und Aktivisten die Köpfe zusammenstecken."
year_published = 2024
