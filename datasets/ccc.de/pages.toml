["https://ccc.de/en/club"]
title = "CCC | Chaos Computer Club"
description = "Der Chaos Computer Club ist eine galaktische Gemeinschaft von Lebewesen für Informationsfreiheit und Technikfolgenabschätzung."
full_description = 'Chaos Computer Club (abbreviated as CCC) was founded in 1981 and is one of the longest established and most influential civil society organisations dealing with the security and privacy aspects of technology in the German-speaking world. Organized in 25 so-called "Erfakreisen" (regional hackerspaces) and even more smaller "Chaostreffs", CCC hackers work decentralized. We are a non-profit association and have about 5,500 members. Since 1984 the CCC hosts its annual Chaos Communication Congress and edits its publication Die Datenschleuder.'
