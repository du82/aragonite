["https://ccc.de/de/updates/2022/konnektoren-400-millionen-geschenk"]
title = "CCC | Chaos Computer Club spart dem Gesundheitssystem 400 Millionen Euro"
description = "Der Chaos Computer Club ist eine galaktische Gemeinschaft von Lebewesen für Informationsfreiheit und Technikfolgenabschätzung."
full_description = "Zur Verbindung mit dem Gesundheitsdatennetz „Telematik“ sind in deutschen Arztpraxen spezielle Router vorgeschrieben. Nach nur fünf Jahren Laufzeit soll nun ein Gerätetausch alternativlos sein – so zumindest die Hersteller. Dieser Tausch soll das ohnehin angeschlagene Gesundheitssystem mit Mehrkosten von rund 400 Millionen Euro belasten. Der Chaos Computer Club (CCC) zeigt, dass der teure Hardware-Tausch alles andere als nötig ist, und spendiert kostenlos eine Lösung für das Problem. Zur Verbindung mit dem Gesundheitsdatennetz „Telematik“ sind in deutschen Arztpraxen spezielle Router vorgeschrieben. Nach nur fünf Jahren Laufzeit soll nun ein Gerätetausch alternativlos sein – so zumindest die Hersteller. Dieser Tausch soll das ohnehin angeschlagene Gesundheitssystem mit Mehrkosten von rund 400 Millionen Euro belasten. Der Chaos Computer Club (CCC) zeigt, dass der teure Hardware-Tausch alles andere als nötig ist, und spendiert kostenlos eine Lösung für das Problem. Wie viele infrastrukturelle Großprojekte in Deutschland ist auch die Digitalisierung des Gesundheitswesens kein Grund zum Stolz. Sie obliegt der Firma gematik, die mit der „Telematik Infrastruktur“ (TI) ein „sicheres“ Datennetz für Patientendaten wie die elektronische Patientenakte oder das e-Rezept betreibt. Für den Zugang wird in der Arztpraxis ein spezieller VPN-Router benötigt, der TI-Konnektor, der aktuell von drei zertifizierten Herstellern verkauft wird. Mit den TI-Konnektoren hat die gematik für diese Hersteller ein äußerst lukratives Kartell-ähnliches Geschäftsmodell geschaffen, denn die Geräte haben ein künstliches Verfallsdatum, weil Zertifikate auslaufen. Nach nur fünf Jahren im Dienst wollen die drei Hersteller erneut 130.000 Konnektoren verkaufen. Kein Wunder, dass ihnen wenig an einer alternativen Lösung gelegen ist. Aus Sicherheitsgründen haben viele Zertifikate, wie zum Beispiel auch die Zertifikate von Webseiten, ein Verfallsdatum. Das heißt, sie müssen regelmäßig erneuert werden. Ein Problem, das nicht nur bekannt ist, sondern für dessen Lösung es seit langem etablierte technische Verfahren gibt. Der Ablauf nach fünf Jahren kommt also alles andere als überraschend – dennoch hat die gematik keine Verlängerungsmöglichkeit für ihre Konnektoren vorgeschrieben."
year_published = 2022
