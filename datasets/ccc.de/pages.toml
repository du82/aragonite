["https://ccc.de/de/tags/pressemitteilung"]
title = "CCC | Chaos Computer Club"
description = "Der Chaos Computer Club ist eine galaktische Gemeinschaft von Lebewesen für Informationsfreiheit und Technikfolgenabschätzung."
full_description = "Das Bündnis „Bits & Bäume“ fordert eine wirksame Mitsprache der Zivilgesellschaft bei der Digitalisierung, demokratische Kontrolle digitaler Infrastrukturen sowie eine globale gerechte Digitalwirtschaft. Digitalpolitik muss aus dem Muff der 1990er gehievt und endlich in den Dienst von Mensch und Umwelt gestellt werden. Mit bedeutungsschwangerer Cyber-Rhetorik will d-trust von der Verantwortung für ein großes Datenleck ablenken. Der CCC erklärt die Hintergründe und fordert Konsequenzen. Die Verantwortlichen der elektronischen Patientenakte müssen die auf dem 38. Chaos Communication Congress demonstrierten Sicherheitslücken endlich schließen. Der Chaos Computer Club schließt sich einem offenen Brief an, in dem 28 Organisationen aus dem Gesundheitswesen und der Zivilgesellschaft Bundesgesundheitsminister Lauterbach auffordern, Transparenz im gesamten Prozess der ePA herzustellen. Der Chaos Computer Club (CCC) unterstützt die drei Hacker, die auf dem 37C3 detailliert darlegten, wie der polnische Schienenfahrzeughersteller Newag seine Züge ab Werk so manipuliert hatte, dass sie nur noch in firmeneigenen Werkstätten repariert werden können. Der Hersteller reagierte auf die Veröffentlichungen in etwa so souverän, wie es in den 1990er Jahren noch Mode war, und verklagte die Hacker sowohl straf- als auch zivilrechtlich. Auf dem 38C3 berichten die Hacker nun über ihre juristische Odyssee, die bisher rund 30.000 Euro verschlang. Der CCC ruft zu Spenden für die aufgelaufenen Rechtsfolgekosten auf. Sicherheitsmängel begleiten die elektronische Patientenakte (ePA) seit ihrer Einführung im Jahr 2020. Mit der Umstellung von Opt-In auf Opt-Out kommt nun die Patientenakte „für alle“: Gesundheitsdaten von über 70 Millionen Versicherten werden ohne deren Zutun über Praxis- und Krankenhausgrenzen hinweg in einer zentralen Datenbank zusammengeführt. Doch auch die „ePA für alle“ kann ihre Sicherheitsversprechen nicht halten. Beim 38C3 wird demonstriert, wie unberechtigte Personen mit wenig Aufwand massenhaften Zugang zur ePA für alle erlangen können."
year_published = 2025
