["https://ccc.de/de/updates/2009/wahlcomputer-urteil-bverfg"]
title = "CCC | Bundesverfassungsgericht beendet elektronisches Wahlroulette"
description = "Der Chaos Computer Club ist eine galaktische Gemeinschaft von Lebewesen für Informationsfreiheit und Technikfolgenabschätzung."
full_description = "Das Bundesverfassungsgericht hat heute entschieden, daß der Einsatz von Wahlcomputern nicht verfassungsgemäß ist. Vielmehr müssen Wahlen in Deutschland von jedermann ohne Expertenwissen nachvollzogen werden können. Der Verfassungsgrundsatz der Öffentlichkeit der Wahl, den der Chaos Computer Club zum Kernpunkt seiner Kampagne gegen Wahlcomputer gemacht hatte, wurde vom BVerfG als wesentlich für die Durchführung demokratischer Wahlen definiert. Hingegen ist die Geschwindigkeit der Ergebnisermittlung keine Anforderung an eine Wahl. Damit sind die bisher in Deutschland verwendeten NEDAP-Wahlcomputer nur noch Elektroschrott."
