["https://ccc.de/en/contact"]
title = "CCC | Kontakt"
description = "Der Chaos Computer Club ist eine galaktische Gemeinschaft von Lebewesen für Informationsfreiheit und Technikfolgenabschätzung."
full_description = "Im Chaos Computer Club sind weit über hundert freiwillige Aktive rund um die Uhr dabei, die interne Kommunikation und die mit der Außenwelt zu organisieren. Viele der regelmäßig aufkommenden Fragen beantworten wir in unserer FAQ. Für alles andere finden sich hier die Kontaktdaten. In vielen Städten haben sich chaosaffine Vereine und Treffs zusammengefunden, die für viele Detailfragen Antworten, Rat und Tat anzubieten haben. Näheres auf unseren Erfaseiten oder bei den Chaostreffs. Für Neumitgliedschaften, Adressänderungen bei Mitgliedern oder für Abos und Zahlungsmodalitäten wendet ihr Euch bitte an die Mitgliederverwaltung in Hamburg. Dort arbeiten wie in allen Teams des CCC Freiwillige, daher bitten wir, etwas Wartezeit einzuplanen. Für solche Anfragen stehen die Sprecher des Clubs zur Verfügung. Bitte richten Sie Ihre Anfrage möglichst per E-Mail an presse@ccc.de, am besten verschlüsselt mit diesem Key. Anfragen per E-Mail können wir leichter beantworten als telefonische Nachfragen. Bitte schreiben Sie auch dazu, worum es geht und etwaige Deadlines. Wir können dann versuchen, den richtigen Ansprechpartner zuzuordnen. Wir bitten darum, Belegexemplare möglichst elektronisch (PDF, URL) an presse@ccc.de oder, sofern nicht anders vereinbart, an: Chaos Computer Club e. V., Postfach 64 02 36 in 10048 Berlin zu schicken – am besten zu Händen des jeweiligen Sprechers, mit dem Sie Kontakt hatten. Wir unterstützen bei der anonymen Meldung von Sicherheitslücken. Bitte wende dich dafür an das Disclosure-Team. Für Aktuelles wendet ihr Euch bitte an den Blueskye- oder Fediverse-Neuigkeitenverteiler des CCC. Wir haben keine Facebook-Seite. Sollte die Frage oder das Problem in keine der obigen Kategorien passen, helfen die Häcksen und Hacker auf dem Mailverteiler mail@ccc.de gerne weiter. Persönliche oder vertrauliche Daten gehören aber wegen der offenen Struktur des Verteilers nicht in die E-Mail. Des Mediums Newsgroup Kundige finden zudem auf de.org.ccc Zuhörer. Wir weisen darauf hin, dass de.org.ccc kein offizielles Organ des CCC ist, viele Mitlesende und -schreibende gehören dem Club nicht an."
year_published = 2025
clearnet = "https://ccc.de/en/contact"
