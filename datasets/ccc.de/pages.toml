["https://ccc.de/de/office"]
title = "CCC | Die Mitgliederverwaltung"
description = "Der Chaos Computer Club ist eine galaktische Gemeinschaft von Lebewesen für Informationsfreiheit und Technikfolgenabschätzung."
full_description = "Wie jede große Organisation kommt auch der Chaos Computer Club nicht ohne ein wenig Bürokratie aus. Um alle Angelegenheiten, die mit Eurer Mitgliedschaft oder Abonnements der Datenschleuder zu tun haben, kümmert sich ehrenamtlich unsere Mitgliederverwaltung. Von der bekommt Ihr, damit sie Euch später leichter wiederfindet, eine kleine (zur Zeit fünfstellige) Zahl vorgeschlagen. Diese Zahl heißt bei uns Chaosnummer. Einmal Mitglied geworden, sorgt die Mitgliederverwaltung dafür, dass Eure Namen zum Versand auf Eure Datenschleudern kommen und die Kassen Euch beim Congress und beim Camp Nachlass gewähren können. Solltet Ihr das Bezahlen zu lange schleifen lassen, verschickt die Mitgliederverwaltung aber auch freundliche Zahlungserinnerungen. Ihr erreicht die Mitgliederverwaltung per E-Mail unter mitgliedschaft@ccc.de, und wir empfehlen – wie eigentlich für alle E-Mails –, Eure Mails an uns per PGP zu verschlüsseln (unser Key). Der Fingerprint des aktuellen Keys ist: Bevor Ihr die Mitgliederverwaltung kontaktiert, schaut aber bitte noch einmal kurz in unsere Mitgliedschaftsseiten oder in unsere FAQ, vielleicht klären sich ja dort Eure Fragen wie von selbst."
year_published = 2025
clearnet = "https://ccc.de/de/office"
