["https://ccc.de/de/elektronische-gesundheitskarte"]
title = "CCC | Elektronische Gesundheitskarte"
description = "Der Chaos Computer Club ist eine galaktische Gemeinschaft von Lebewesen für Informationsfreiheit und Technikfolgenabschätzung."
full_description = 'Die Elektronische Gesundheitskarte (kurz eGK) ist der Nachfolger der bisherigen Krankenversicherungskarte mit Chip. Laut § 291a SGB V ist ihre Einführung gesetzlich vorgeschrieben. Mit der Einführung der Karte geht die Einrichtung einer komplexen Telematikinfrastruktur einher, mit dessen Aufbau die Firma gematik beauftragt wurde. Der Chaos Computer Club hat erhebliche Bedenken, ob der Teilbereich "elektronische Patientenakte" die hohen Anforderungen an den Datenschutz erfüllt, die von Patienten und Ärzten erwartet werden. Darüberhinaus scheint der Aufbau der komplexen Infrastruktur wirtschaftlich nicht sinnvoll. Die neue eGK verfügt über mehrere Funktionen, die im Chip in unterschiedlichen Bereichen abgelegt sind. Verpflichtend ist die Nutzung der Funktionen Derzeit noch als freiwillige Funktion geplant ist die elektronische Patientenakte. Patienten und Ärzten soll die Möglichkeit gegeben werden, Befunde und andere medizinische Informationen zu speichern und "in die Hände des Patienten" zu geben. Zu diesem Zweck werden die elektronischen Akten vom Arzt verschlüsselt (mit dem kryptographischen Schlüssel aus der Patientenkarte) und auf den Servern der gematik gespeichert. Wenn der Patient die Daten abrufen möchte, werden die verschlüsselten Daten wieder vom Server geholt und erst in der Arztpraxis oder einem speziellen Terminal mit der Versichertenkarte wieder entschlüsselt. Dieses Verfahren wäre aus unserer Sicht auch datenschutzfreundlich, wenn der Patient die alleinige Hoheit über den kryptographischen Schlüssel hätte. Doch für den Fall, daß die eGK mit dem geheimen Schlüssel abhandenkommt, gibt es für die gematik die Möglichkeit, den geheimen Schlüssel für die Patientendaten wiederherzustellen. Zwar verfügt die gematik nicht selbst über die "Nachschlüssel", sondern die damit beauftragte "Informationstechnische Servicestelle der gesetzlichen Krankenversicherung GmbH". Diese ist jedoch nicht ausreichend organisatorisch getrennt gehalten, um einen Zugriff durch Behörden oder Krankenversicherungen auf die Patientenakten mit absoluter Sicherheit ausschließen zu können.'
