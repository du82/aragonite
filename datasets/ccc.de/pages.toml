description = "Der Chaos Computer Club ist eine galaktische Gemeinschaft von Lebewesen für Informationsfreiheit und Technikfolgenabschätzung."
full_description = "A high level working group of the EU Commission is seriously demanding access to all end-to-end encrypted communications and, on top of that, a new form of Europe-wide mass surveillance of telecommunications and internet data. This dangerous nonsense must be stopped. A high level working group of the EU Commission is seriously demanding access to all end-to-end encrypted communications and, on top of that, a new form of Europe-wide mass surveillance of telecommunications and internet data. This dangerous nonsense must be stopped. Together with more than fifty civil rights organizations and associations, the Chaos Computer Club signs an open letter rejecting the recommendations of an EU working group that call for unrestricted access to all personal data – completely detached from technical or legal realities."
