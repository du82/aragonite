["https://ccc.de/de/updates/2024/gegen-uberzogene-eu-uberwachungsplane"]
title = "CCC | Klare Absage gegen überzogene Überwachungspläne der EU-Kommission"
description = "Der Chaos Computer Club ist eine galaktische Gemeinschaft von Lebewesen für Informationsfreiheit und Technikfolgenabschätzung."
full_description = "Eine Arbeitsgruppe der EU-Kommission fordert allen Ernstes Zugriff auf jede Ende-zu-Ende-verschlüsselte Kommunikation und obendrauf eine neue Form der europaweiten Massenüberwachung von Telekommunikations- und Internetdaten. Wenn diesem gefährlichen Unsinn nicht Einhalt geboten wird, kann Europa einpacken. Eine Arbeitsgruppe der EU-Kommission fordert allen Ernstes Zugriff auf jede Ende-zu-Ende-verschlüsselte Kommunikation und obendrauf eine neue Form der europaweiten Massenüberwachung von Telekommunikations- und Internetdaten. Wenn diesem gefährlichen Unsinn nicht Einhalt geboten wird, kann Europa einpacken. Der Chaos Computer Club zeichnet zusammen mit mehr als fünfzig weiteren Bürgerrechtsorganisationen und Verbänden einen offenen Brief, in dem die Empfehlungen einer EU-Arbeitsgruppe zurückgewiesen werden, die einen unbeschränkten Zugang zu allen personenbezogenen Daten fordern – ganz losgelöst von technischen oder rechtlichen Realitäten. In dem offenen Brief fordern wir die Politik nachdrücklich auf, diesen gefährlichen Kurs sofort zu stoppen. Diese fehlgeleiteten und überzogenen Empfehlungen dürfen keinesfalls als Grundlage für die zukünftige EU-Agenda dienen. Die Arbeitsgruppe muss dichtgemacht werden, denn legitimiert ist der Geheimtrupp ohnehin nicht. Was von Strafverfolgern bedrohlich als „Going Dark“ bezeichnet wird, beschreibt lediglich die Tatsache, dass Privatpersonen, Staat und Wirtschaft endlich alle Daten routinemäßig verschlüsseln, um sich vor Kriminellen und Spionage zu schützen. Die Empfehlungen einer sogenannten High Level Working Group (HLG) zu Datenzugriff und Strafverfolgung drohen, diese mühsam errungenen Fortschritte wieder zu untergraben. Die Empfehlungen der überaus einseitig besetzten Arbeitsgruppe der EU-Kommission bedrohen damit nicht nur fundamentale Grundrechte, sondern gefährden auch die IT-Sicherheit in inakzeptablem Maße und schaffen die Grundlage für eine umfassende Überwachung, die alles bisher Geforderte noch übertrifft."
