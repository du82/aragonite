["https://ccc.de/en/tags/ccc"]
title = "CCC | Chaos Computer Club"
description = "Der Chaos Computer Club ist eine galaktische Gemeinschaft von Lebewesen für Informationsfreiheit und Technikfolgenabschätzung."
full_description = "Der Chaos Computer Club lädt alle galaktischen Lebewesen zum 32. Chaos Communication Congress im Congress Center Hamburg ein. Dieses Jahr wird der durchschnittliche Eintrittspreis des Hackercongresses vom 27. bis zum 30.12.2015 um zehn Euro niedriger sein. Wie es sich für einen Club gehört, der das Chaos schon im Namen trägt, mag die Struktur des CCC für Außenstehende verwirrend erscheinen. Zum einen gibt es den CCC e.V. mit Sitz in Hamburg, der bundesweit tätig ist. Daneben existieren sogenannte Erfa-Kreise (Erfahrungsaustauschkreise), die man auch als „lokale Niederlassungen“ bezeichnen könnte."
