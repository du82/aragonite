["http://www.ccc.de/de/updates/2024/offener-brief-biometrische-massenuberwachung-stoppen"]
title = "CCC | Offener Brief: Biometrische Massenüberwachung stoppen"
description = "Der Chaos Computer Club ist eine galaktische Gemeinschaft von Lebewesen für Informationsfreiheit und Technikfolgenabschätzung."
full_description = 'Der als „die KI-Regulierung“ schlechthin gefeierte AI Act erlaubt weiterhin biometrische Massenüberwachung durch die Hintertür. Der Bundestag muss jetzt klar Position beziehen und in der nationalen Umsetzung den Ausbau einer weitgreifenden Überwachungsinfrastruktur verhindern. Der als „die KI-Regulierung“ schlechthin gefeierte AI Act erlaubt weiterhin biometrische Massenüberwachung durch die Hintertür. Der Bundestag muss jetzt klar Position beziehen und in der nationalen Umsetzung den Ausbau einer weitgreifenden Überwachungsinfrastruktur verhindern. Das EU-Parlament beschließt heute mit dem AI Act ein Gesetz, dessen eigentliches Ziel die strengere Regulierung der Entwicklung und des Einsatzes von KI war. Ganz nebenbei schafft es dabei aber einen Rechtsrahmen für die Verwendung von Gesichtserkennungssoftware. Ein weiterer Ausbau von Überwachung im öffentlichen Raum ist hier vorprogrammiert. Die Abgeordneten des Bundestages müssen nun retten, was noch zu retten ist, und dafür sorgen, dass jede Form der biometrischen Fernidentifizierung in Deutschland verboten wird. Der AI Act verbietet zwar biometrische Überwachung im öffentlichen Raum, lässt aber viele Ausnahmen für Strafverfolgungsbehörden. Biometrische Fernidentifizierung darf immer dann angewendet werden, wenn die „abstrakte Gefahr einer Straftat” besteht. Regeln für den konkreten zeitlichen Abstand, der vergangen sein muss, bis eine Identifizierung als nachträglich gilt, gibt es keine. Somit ist der großflächigen Einsatz von nachträglicher Fernidentifikation erlaubt – sprich mehr Gesichtserkennung. Im Koalitionsvertrag heißt es zwar klar, dass „[b]iometrische Erkennung im öffentlichen Raum” auszuschließen ist und der „Einsatz von biometrischer Erfassung zu Überwachungszwecken” abgelehnt wird, die Parteien befinden sich hier aber dennoch auf einem Schlingerkurs: Während sich alle Ampel-Lichter einig sind, biometrische Echtzeit-Erkennung zu verbieten, sieht das Bild bei der nachträglichen Überwachung anders aus: Das grüne Digitalausschuss-Mitglied Bacherle plädiert für einen Einsatz mit Richtervorbehalt, Parsa Marvi, für die SPD im Innenausschuss, kann sich auch nicht zur Linie aus dem Koalitionsvertrag durchringen: Er fordert stattdessen eine Anwendung in einem „deutlich engeren Rahmen".'
year_published = 2024
