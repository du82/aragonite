["https://ccc.de/de/updates/2013/routerzwang"]
title = "CCC | Chaos Computer Club nimmt Stellung zum Routerzwang"
description = "Der Chaos Computer Club ist eine galaktische Gemeinschaft von Lebewesen für Informationsfreiheit und Technikfolgenabschätzung."
full_description = "In einer Stellungnahme an die Bundesnetzagentur wendet sich der Chaos Computer Club (CCC) gegen Zwangsrouter und fordert offene, nicht-proprietäre Hardware für Privatnutzer und Unternehmen. Wenn eine große Anzahl von Anwendern den gleichen Typ Endgerät benutzt, entstehen zudem Sicherheitsrisiken, die jede Monokultur mit sich bringt. In einer Stellungnahme an die Bundesnetzagentur wendet sich der Chaos Computer Club (CCC) gegen Zwangsrouter und fordert offene, nicht-proprietäre Hardware für Privatnutzer und Unternehmen. Wenn eine große Anzahl von Anwendern den gleichen Typ Endgerät benutzt, entstehen zudem Sicherheitsrisiken, die jede Monokultur mit sich bringt. Bereits seit länger Zeit liefern viele Internet-Zugangsanbieter an ihre Kunden vorkonfigurierte Router aus, die sich durch den Nutzer nachträglich nicht mehr selber einrichten lassen. Da die Kunden, die für die Nutzung des Anschlusses notwendigen Zugangsdaten nicht mehr erhalten, sind sie gezwungen, die ausgelieferte Hardware einzusetzen.Die Zugangsanbieter begründen dies damit, daß der Aufwand für Kundenbetreuung geringer sei und zudem bessere Bedingungen bei Zulieferern möglich wären.Für die Nutzer hat diese Praxis zahlreiche Nachteile. So ist der Funktionsumfang der Geräte festgelegt, es kann zu Inkompatibilitäten mit anderen Endgeräten kommen, und die entstehende Monokultur erleichtert großflächige Angriffe auf die Netzwerkinfrastruktur. Nicht zuletzt werden die Zwangsrouter bei einem Providerwechsel nutzlos und zu umweltbelastendem Abfall.Die Bundesnetzagentur hat zu diesem Thema eine Anhörung angesetzt und fordert alle betroffenen Gruppen zu einer schriftlichen Stellungnahme auf. Wir fühlen uns betroffen: Der Chaos Computer Club beteiligt sich mit einer eigenen Stellungnahme und fordert, die Hoheit über die Endgeräte beim Benutzer zu belassen.Links:Stellungnahme des CCC an die Bundesnetzagentur (pdf)Exploits in gängigen Access PointsKontakt:Alexander Noackjali(at)orca-central.deTel.: 0170/9036102"
year_published = 2013
