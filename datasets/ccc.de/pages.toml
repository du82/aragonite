["https://ccc.de/de/tags/updates"]
title = "CCC | Chaos Computer Club"
description = "Der Chaos Computer Club ist eine galaktische Gemeinschaft von Lebewesen für Informationsfreiheit und Technikfolgenabschätzung."
full_description = 'Der Chaos Computer Club (CCC) deckt auf, dass der Volkswagen-Konzern Bewegungsdaten von hunderttausenden Fahrzeugen der Marken VW, Audi, Skoda und Seat systematisch erfasst und über lange Zeiträume speichert. Die Daten, einschließlich Informationen über Fahrzeughalter:innen, waren zudem ungeschützt im Internet zugänglich. Der belgische Vorsitz im Rat der EU will die Chatkontrolle am Mittwoch, den 19. Juni, abstimmen lassen. Nach einem weiteren Hütchenspielertrick, den massenhaften Angriff auf Verschlüsselung nicht als solchen erscheinen zu lassen, wackelt nun der Widerstand Frankreichs. Der CCC erinnert daran, dass sich an der Verordnung nichts Nennenswertes geändert hat. Der Schutz personenbezogener Daten ist uns wichtig. Deshalb haben wir mal wieder ein Unternehmen freundlich auf ein massives Datenleck hingewiesen – ungeachtet der möglichen juristischen Konsequenzen durch den Hacker-Paragraphen. Der Chaos Computer Club wendet sich gegen eine Einschränkung des Fragerechts für parlamentarische Gruppen. Sven "winni" Gohdes, Ehrenmitglied des Chaos Computer Clubs zeigte uns mit seiner offenen positiven Art viele große und kleine Dinge, welche das Leben noch lebenswerter machen. Trotz seiner Erkrankung an Muskelschwund war er eine stetige Anlaufquelle für lange gemeinsame Stunden sowohl in großer als auch in kleiner Runde, bei Tee und zur Entspannung. Nun ist er im Januar mit 57 Jahren verstorben und wird uns fehlen. Das Recherchezentrum „Correctiv“ hat die Deportationspläne von Mitgliedern der AfD, CDU und Identitären Bewegung bei einem konspirativen Treffen in Potsdam enthüllt. Nun greift die Partei AfD in ihrem Mitgliederblatt die Journalistinnen persönlich an. Der CCC verurteilt diesen Angriff auf kritische Berichterstattung über antidemokratische Entwicklungen. Das US-Militär hat massenhaft Geräte zur biometrischen Erfassung von Menschen in Afghanistan genutzt. Einige Geräte wurden beim hastigen Abzug der NATO-Truppen zurückgelassen. Forscher des CCC haben bei Analysen solcher Geräte große Mengen an biometrischen und weiteren personenbezogenen Daten gefunden. In den falschen Händen bedeuten diese Daten Lebensgefahr für Menschen in Afghanistan und Irak.'
year_published = 2025
clearnet = "https://ccc.de/de/tags/updates"
tags = ["136.000", "2022:", "27001-zertifizierung", "alle", "alternativen", "auto", "beenden", "beschneiden!", "biometrie-datenbank", "biometriedaten"]
language = "en"
