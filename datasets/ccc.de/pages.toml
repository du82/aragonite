["https://ccc.de/de/tags/staatstrojaner"]
title = "CCC | Chaos Computer Club"
description = "Der Chaos Computer Club ist eine galaktische Gemeinschaft von Lebewesen für Informationsfreiheit und Technikfolgenabschätzung."
full_description = 'Im Rahmen eines Beschwerdeverfahrens beim Bundesverfassungsgericht gegen die starke Ausweitung der Befugnisse zum Staatstrojanereinsatz wurde der Chaos Computer Club (CCC) um eine Stellungnahme gebeten, die wir veröffentlichen. Der CCC fordert die Ampel-Regierung auf, die Erlaubnis zur Nutzung von Schadsoftware aus der Strafprozessordnung zu entfernen. Endlich ein solides Regierungsprogramm für unsere digitalisierte Welt, wer wünscht sich das nicht? Wir machen hiermit einen Vorschlag. Kürzer konnten wir es leider nicht hinbekommen, denn es hat sich ja einiges aufgestaut. Die technische Analyse von Exemplaren der FinSpy-Schadsoftware untermauert die Begründung für die Strafanzeige gegen den Münchner Hersteller des Staatstrojaners. Der CCC veröffentlicht seinen Bericht sowie mehrere Varianten von FinSpy und eine vollständige Dokumentation der Analyse. Heute sind zwei weitere Verfassungsbeschwerden gegen Staatstrojaner in Karlsruhe eingereicht worden. Die Verfassungswidrigkeit des sogenannten Hessentrojaners, aber auch die unumgänglichen technischen Gefahren hatten der Chaos Computer Club (CCC) sowie zahlreiche weitere Sachverständige bereits während der Anhörung im Landtag betont. Das staatliche Hacken gefährdet die innere Sicherheit. Die Experimente mit staatlicher Schadsoftware müssen endlich beendet werden. Der Chaos Computer Club (CCC) veröffentlicht eine Stellungnahme zum Einsatz staatlicher Spionagesoftware nach dem Urteil des Bundesverfassungsgerichts vom April 2016. [1] Angesichts der Risiken und der Interessenkonflikte, die unweigerlich mit dem Einsatz von Staatstrojanern einhergehen, sollte von der Ausweitung der Nutzung abgesehen werden. Dem Chaos Computer Club (CCC) wurde jüngst eine noch fast fabrikneue Version des Staatstrojaners zugetragen. Der Vergleich zur älteren, vom CCC bereits analysierten Version mit dem aktuellen Schnüffel-Code vom Dezember 2010 förderte neue Erkenntnisse zutage. Entgegen aller Beteuerungen der Verantwortlichen kann der Trojaner weiterhin gekapert, beliebiger Code nachgeladen und auch die angeblich "revisionssichere Protokollierung" manipuliert werden. Der CCC fordert daher einen vollständigen Verzicht auf Trojanereinsätze in Ermittlungsverfahren.'
year_published = 2025
