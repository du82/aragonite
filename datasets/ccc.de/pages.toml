["http://www.ccc.de/de/updates/2025/btw26-bb"]
title = "CCC | Bundestagswahl: Bündnis „Bits & Bäume“ drängt auf nachhaltige und gemeinwohlorientierte Digitalisierung"
description = "Der Chaos Computer Club ist eine galaktische Gemeinschaft von Lebewesen für Informationsfreiheit und Technikfolgenabschätzung."
full_description = "Das Bündnis „Bits & Bäume“ fordert eine wirksame Mitsprache der Zivilgesellschaft bei der Digitalisierung, demokratische Kontrolle digitaler Infrastrukturen sowie eine globale gerechte Digitalwirtschaft. Digitalpolitik muss aus dem Muff der 1990er gehievt und endlich in den Dienst von Mensch und Umwelt gestellt werden. Das Bündnis „Bits & Bäume“ fordert eine wirksame Mitsprache der Zivilgesellschaft bei der Digitalisierung, demokratische Kontrolle digitaler Infrastrukturen sowie eine globale gerechte Digitalwirtschaft. Digitalpolitik muss aus dem Muff der 1990er gehievt und endlich in den Dienst von Mensch und Umwelt gestellt werden. Das Bündnis „Bits & Bäume“ von zwölf Organisationen aus Umwelt-, Sozial-, Digitalpolitik und Wissenschaft legt einen Forderungskatalog an die zukünftige Bundesregierung vor und erwartet von ihr eine nachhaltige und sozial gerechte Digitalisierung. Das Forderungspapier trägt den Titel „Digitale Souveränität und nachhaltige Zukunft durch demokratische Kontrolle“. Wir fordern darin die künftige Bundesregierung auf, in allen Fragen der Digitalisierung das Ziel einer sozial gerechten und nachhaltigen Zukunft zu verfolgen. Die zwölf Organisationen des Bündnisses kritisieren, dass die Chancen der Digitalisierung für dieses Ziel bislang nicht ausreichend genutzt werden. Insbesondere in Zeiten, in denen die enorme Macht von Tech-Milliardären mit Rechtsdrall und deren Tech-Konzernen auf die Politik und Demokratie deutlich wird, muss die deutsche Bundesregierung einen digitalpolitischen Kurs für das Gemeinwohl, für soziale Gerechtigkeit und für die Umwelt vorlegen. Wir fordern, Klimapolitik und Digitalisierung endlich zusammenzudenken und die zunehmende Veränderung der Arbeitswelt durch die Digitalisierung fair und menschlich zu gestalten. Yasmin Fahimi, Vorsitzende des Deutschen Gewerkschaftsbundes, betont: „Die Digitalisierung der Arbeitswelt muss endlich so gestaltet werden, dass menschliche Arbeit aufgewertet wird. Wir sehen seit Jahren, dass Digitalisierung nicht automatisch zu Guter Arbeit führt. Vorausschauende Mitbestimmung der Arbeitnehmer*innen ist der Schlüssel für eine nachhaltige und gesunde Arbeitswelt. Deshalb fordern wir vor allem gesetzliche Regeln für mehr Mitsprache bei KI und Co. Außerdem braucht es eine effektive Kontrolle digitaler Plattformen, um Plattformarbeiter*innen besser zu schützen, Machtmissbrauch einzudämmen und die Demokratie zu stärken.“"
year_published = 2025
clearnet = "http://www.ccc.de/de/updates/2025/btw26-bb"
