["https://ccc.de/de/tags/wahlcomputer"]
title = "CCC | Chaos Computer Club"
description = "Der Chaos Computer Club ist eine galaktische Gemeinschaft von Lebewesen für Informationsfreiheit und Technikfolgenabschätzung."
full_description = "Der Chaos Computer Club fordert erneut öffentliche und transparente Wahl- und Auswertungssoftware. Die vorläufige Sitzverteilung im sächsischen Landtag musste nachträglich korrigiert werden, weil die eingesetzte Auswertungssoftware versagt hat. Der Vorgang nährt Misstrauen in das Wahlsystem und führt zur Verbreitung wilder Verschwörungstheorien. Die seit jeher gepflegte Intransparenz gießt Öl in dieses Feuer. Der Chaos Computer Club veröffentlicht in einer Analyse gravierende Schwachstellen einer bei der Bundestagswahl verwendeten Auswertungssoftware. Im Bericht wird eine Vielfalt erheblicher Mängel und Schwachstellen aufgezeigt. Praktisch anwendbare Angriffstools werden im Sourcecode veröffentlicht. Das Bundesverfassungsgericht hat heute entschieden, daß der Einsatz von Wahlcomputern nicht verfassungsgemäß ist. Vielmehr müssen Wahlen in Deutschland von jedermann ohne Expertenwissen nachvollzogen werden können. Der Verfassungsgrundsatz der Öffentlichkeit der Wahl, den der Chaos Computer Club zum Kernpunkt seiner Kampagne gegen Wahlcomputer gemacht hatte, wurde vom BVerfG als wesentlich für die Durchführung demokratischer Wahlen definiert. Hingegen ist die Geschwindigkeit der Ergebnisermittlung keine Anforderung an eine Wahl. Damit sind die bisher in Deutschland verwendeten NEDAP-Wahlcomputer nur noch Elektroschrott. Der Chaos Computer Club (CCC) hat mit Hilfe freiwilliger Wahlbeobachter am 28. September 2008 in zehn brandenburgischen Kommunen eine weitere Wahlbeobachtung durchgeführt. Ziel war es, den tatsächlichen Einsatz von Wahlcomputern bei den Kommunalwahlen zu dokumentieren und die Behauptungen des Wahlcomputer-Herstellers sowie der zuständigen Bundes- und Landeswahlbehörden zur Sicherheit, Akzeptanz und Bedienerfreundlichkeit zu überprüfen. Bei der bayerischen Kommunalwahl beobachteten interessierte Wähler und bayerische Mitglieder des Chaos Computer Clubs (CCC) eine Reihe schwerwiegender Probleme und realer Manipulationsrisiken, die das Vertrauen in die eingesetzten Barcode- und Computer-Zählsysteme weiter in Frage stellen. Vor den Risiken der computerisierten Auszählung hatte der CCC bereits im Vorfeld gewarnt. [1]"
year_published = 2025
