["http://www.ccc.de/de/updates/2024/sicherheitspaket"]
title = "CCC | „Sicherheitspaket“ mit biometrischer Massenüberwachung: Die Ampel ist bankrott"
description = "Der Chaos Computer Club ist eine galaktische Gemeinschaft von Lebewesen für Informationsfreiheit und Technikfolgenabschätzung."
full_description = "Das heute im Bundestag beschlossene „Sicherheitspaket“ bringt gefährliche Überwachungsbefugnisse und bricht die Versprechen der Parteien der Ampelkoalition und zugleich den Koalitionsvertrag. Das heute im Bundestag beschlossene „Sicherheitspaket“ bringt gefährliche Überwachungsbefugnisse und bricht die Versprechen der Parteien der Ampelkoalition und zugleich den Koalitionsvertrag. Die heute beschlossene Form der biometrischen Massenüberwachung, die noch per Verordnung technisch näher geregelt werden soll, ist nicht möglich, ohne dafür massenhaft biometrisches Datenmaterial aus dem Netz zu scannen und zu analysieren oder auf kommerzielle Dienstleister dafür zurückzugreifen. Versprochen haben die Parteien der Ampel aber genau das Gegenteil: Sie wollten den seit vielen Jahren anwachsenden staatlichen Datensammlungen einen Riegel vorschieben. Doch anstatt der biometrischen Massenüberwachung eine Absage zu erteilen, werden nun Gesichter und Stimmen als biometrische Merkmale analysiert und gehortet. Die dafür notwendige Technologie konnte hinsichtlich Risiken und Konsequenzen gar nicht erst geprüft werden, da es schlicht seitens der Regierung keine Auskunft gab, wie der massenhafte Abgleich technisch vorgenommen werden soll. Dreister geht es wohl kaum, um sich um die notwendige Diskussion rumzudrücken. Zwar wurde nach einer Sachverständigen-Anhörung im Bundestag die Schwelle für den Einsatz der biometrischen Überwachungsinstrumente angehoben und soll nun für die Verfolgung „besonders schwerer Straftaten“ verwendet werden, aber das eigentliche Problem bleibt bestehen: Die Verwendung solcher Technologien setzt voraus, dass Strafverfolgungsbehörden umfangreiche Datensammlungen anfertigen, weiterentwickeln und optimieren oder sich dafür kommerzieller Anbieter bedienen. Betroffen sind nicht nur Straftäter und Menschen im Asylverfahren, sondern wir alle. Es sind unsere Gesichter und Stimmen, die gescannt, biometrisch klassifiziert und gespeichert werden."
year_published = 2024
