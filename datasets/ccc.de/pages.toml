full_description = 'In einem Vorabdruck eines Interviews aus der nächsten Ausgabe seiner Vereinszeitung "Die Datenschleuder" zeichnet der Chaos Computer Club (CCC) die Geschichte eines Hackers nach, dessen Software unter anderem an Regierungen des Nahen Ostens verkauft wurde, um Oppositionelle auszuforschen. Für welche Ziele und Zwecke sollten Hacker ihre Talente einsetzen? Kann man heute immer noch ignorieren, was mit den Ergebnissen des eigenen Forschungsdrangs geschieht? In den letzten Tagen wurden im Rahmen einer rechten Spam-Kampagne Mails verschickt, die CCC-Adressen als Absender trugen. Diese Absenderangaben sind gefälscht. Wir distanzieren uns ausdrücklich von den Inhalten dieser Mails.'
