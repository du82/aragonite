["https://ccc.de/de/campaigns/aktivitaeten_biometrie"]
title = "CCC | Chaos-Aktivitäten Biometrie"
description = "Der Chaos Computer Club ist eine galaktische Gemeinschaft von Lebewesen für Informationsfreiheit und Technikfolgenabschätzung."
full_description = 'Mitglieder des Chaos Computer Clubs haben sich in den letzten Jahren mit biometrischen Systemen befaßt, Artikel in Zeitschriften und Pressemitteilungen veröffentlicht und Vorträge gehalten. Hier findet sich ein Querschnitt durch unsere Aktivitäten. Das Video zeigt, wie einfach beim Samsung Galaxy S8 die Iriserkennung überwunden werden kann. Im Mai 2017 demonstrierte der Chaos Computer Club den Hack. Am Mittwoch führt der Gerichtshof der Europäischen Union (EuGH) in Luxemburg eine Anhörung über die Rechtmäßigkeit der Erfassung von biometrischen Fingerabdrücken für Reisepässe durch. Seit die Bürger vor mehr als sechs Jahren zur obligatorischen Teilnahme am biometrischen Großversuch herangezogen wurden, gibt es jede Menge unbeantwortete Fragen zu den in Ausweispapieren gespeicherten biometrischen Merkmalen. Nun plant die Regierung offenbar, auch genetische Daten in unsere Ausweise und Aufenthaltskarten aufzunehmen. Wir hätten vorher gern erstmal ein paar Antworten. Die Debatte um die biometrische Kompletterfassung der Bundesbürger war bisher eher abstrakt. Um ihr eine konkretere Form zu geben, hat der Chaos Computer Club (CCC) seiner Vereinszeitschrift "Die Datenschleuder" ein biometrisches Sammelalbum für die Fingerabdrücke schnüffelfreudiger Politiker beigelegt. Eröffnet wird das heitere Abdrucksammeln mit einem Fingerabdruck unseres geliebten Innenministers, Dr. Wolfgang Schäuble. Der Abdruck wurde durch CCC-Aktivisten von einem Wasserglas sichergestellt, das Dr. Schäuble bei einer öffentlichen Veranstaltung benutzt hatte. Nach der Klage des Rechtsanwaltes Michael Schwarz gegen die Aufnahme von biometrischen Merkmalen in den Reisepaß ist nun auch Verfassungsbeschwerde eingereicht worden. “Endlich beginnt jetzt die schon lange überfällige gesellschaftliche Debatte und die gerichtlichen Schritte gegen die biometrische Vollerfassung der Bevölkerung”, sagte Dirk Engling, Sprecher des Chaos Computer Clubs (CCC). Biometrie-Experten des Chaos Computer Clubs (CCC) kooperierten mit dem ARD-Wirtschaftsmagazin Plusminus bei einer Demonstration zur einfachen Fälschbarkeit von Fingerabdrücken. Vor laufender Kamera wurde der Fingerabdruck-Scanner an einer Supermarkt-Kasse getäuscht und auf fremde Kosten eingekauft. Nach kurzer Einweisung durch die CCC-Experten waren die Journalisten selbständig in der Lage, mit kopierten Fingerabdrücken das Kassensystem zu überlisten. Damit sind die Behauptungen der Biometrie-Befürworter und -Hersteller, daß so etwas – wenn überhaupt, nur im Labor – möglich sei, nachdrücklich widerlegt.'
year_published = 2025
