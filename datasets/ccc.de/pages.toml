["https://ccc.de/de/tags/easterhegg"]
title = "CCC | Chaos Computer Club"
description = "Der Chaos Computer Club ist eine galaktische Gemeinschaft von Lebewesen für Informationsfreiheit und Technikfolgenabschätzung."
full_description = 'Wir freuen uns, Euch nach Basel einladen zu dürfen. Dieses Jahr findet das Easterhegg von Karfreitag, den 6. bis Ostermontag, den 9. April statt. Eines der Hauptwerkzeuge zum Erfahrungsaustausch zwischen den Hackern, die sich zum Chaos Computer Club zugehörig fühlen, sind die zahlreichen Veranstaltungen, die organisiert werden von den Erfas, Chaostreffs und einer riesigen Schar freiwilliger "OC" genannter Gruppen. Vom 6. bis 9. April 2007 findet das traditionelle “workshop weekend” des Chaos Computer Clubs statt. Der CCC Hamburg lädt anläßlich dieser vier Workshoptage zum Mitmachen, Fachsimpeln und Entspannen ins Eidelstedter Bürgerhaus ein. Der Easterhegg 2007 finden in der Zeit von 6. bis 9. April im Bürgerhaus Eidelstedt in Hamburg statt. Auch dieses Jahr wird es wieder vier Tage Vorträge und Workshops geben. Vom 25. bis 28. März 2005 findet das traditionelle "workshop weekend" des Chaos Computer Clubs statt. Der CCC Hamburg lädt anläßlich dieser vier Workshop-Tage zum Mitmachen, Fachsimpeln und Entspannen ins Eidelstedter Bürgerhaus ein.'
