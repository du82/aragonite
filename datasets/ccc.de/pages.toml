["https://ccc.de/de/updates/2025/epa-transparenz"]
title = "CCC | Ohne Transparenz kein Vertrauen in elektronische Patientenakte"
description = "Der Chaos Computer Club ist eine galaktische Gemeinschaft von Lebewesen für Informationsfreiheit und Technikfolgenabschätzung."
full_description = "Die Verantwortlichen der elektronischen Patientenakte müssen die auf dem 38. Chaos Communication Congress demonstrierten Sicherheitslücken endlich schließen. Der Chaos Computer Club schließt sich einem offenen Brief an, in dem 28 Organisationen aus dem Gesundheitswesen und der Zivilgesellschaft Bundesgesundheitsminister Lauterbach auffordern, Transparenz im gesamten Prozess der ePA herzustellen. Die Verantwortlichen der elektronischen Patientenakte müssen die auf dem 38. Chaos Communication Congress demonstrierten Sicherheitslücken endlich schließen. Der Chaos Computer Club schließt sich einem offenen Brief an, in dem 28 Organisationen aus dem Gesundheitswesen und der Zivilgesellschaft Bundesgesundheitsminister Lauterbach auffordern, Transparenz im gesamten Prozess der ePA herzustellen. Der Vortrag von Bianca Kastl und Martin Tschirsich auf dem 38. Chaos Communication Congress hat allen Interessierten gezeigt, dass Vertrauen in die elektronische Patientenakte (ePA) derzeit nicht gerechtfertigt ist. In der Folge haben sich viele Experten aus dem Gesundheitswesen erschüttert über die Analyse und die demonstrierten technischen und organisatorischen Mängel gezeigt. „Die ePA in ihrem aktuellen Zustand auszurollen, ist angesichts ihrer besorgniserregenden Sicherheitsprobleme eine falsche Entscheidung. Denn die Behauptung, dass die ePA sicher ist, trifft nicht zu. Dass Bundesgesundheitsminister Karl Lauterbach dies wahrheitswidrig und unverfroren behauptet, leugnet die belegten und beweisbaren Schwachstellen“, sagt Calvin Baus, Sprecher des Chaos Computer Clubs. Die gezeigten Probleme, die den Verantwortlichen bei der Gematik und im Ministerium teilweise schon länger als ein Jahrzehnt bekannt sind, werden weiter heruntergespielt und nicht ernst genommen. Da die Schwachstellen auch jetzt noch kleingeredet werden, ist es überfällig, die technischen Details des teuren Mammutprojekts offenzulegen. Unabhängige Sicherheitsforschende müssen Zugang zu allen relevanten Unterlagen und Gutachten erhalten, um ein unverzerrtes Bild des aktuellen Stands der ePA erhalten zu können. Diese Dokumente dürfen nicht länger hinter verschlossenen Türen bleiben, sondern müssen umfassend geprüft werden können. Ohne eine deutliche Kurskorrektur wird es unmöglich sein, das verlorene Vertrauen zurückzugewinnen."
year_published = 2025
clearnet = "https://ccc.de/de/updates/2025/epa-transparenz"
