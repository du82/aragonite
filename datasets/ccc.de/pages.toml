["http://www.ccc.de/de/updates/2024/die-groesste-enttauschung-seit-beginn-der-ampel-regierung"]
title = "CCC | „Sicherheitspaket“: Die größte Enttäuschung seit Beginn der Ampel-Regierung"
description = "Der Chaos Computer Club ist eine galaktische Gemeinschaft von Lebewesen für Informationsfreiheit und Technikfolgenabschätzung."
full_description = "Die Zivilgesellschaft kritisiert die angepassten Maßnahmen des sogenannten Sicherheitspakets, das am Mittwoch, den 16. Oktober 2024, im Innenausschuss des Bundestages beraten und noch diese Woche vom Parlament beschlossen werden soll. Das kosmetisch angepasste „Sicherheitspaket“ der Bundesregierung beinhaltet weiterhin gefährliche Überwachungsvorhaben. Die Zivilgesellschaft kritisiert die angepassten Maßnahmen des sogenannten Sicherheitspakets, das am Mittwoch, den 16. Oktober 2024, im Innenausschuss des Bundestages beraten und noch diese Woche vom Parlament beschlossen werden soll. Das kosmetisch angepasste „Sicherheitspaket“ der Bundesregierung beinhaltet weiterhin gefährliche Überwachungsvorhaben. „Das sogenannte Sicherheitspaket ist die größte Enttäuschung im Hinblick auf Bürgerrechte seit Beginn der Ampel-Regierung. Unter dem Eindruck des Anschlags in Solingen und mehrerer Landtagswahlen ist die Koalition von ihrem Anspruch auf eine vorausschauende, evidenzbasierte und grundrechtsorientierte Sicherheits- und Innenpolitik abgerückt. Trotz der breiten Kritik der geladenen Sachverständigen, zivilgesellschaftlichen Organisationen und Expert*innen sollen die weitgehenden neuen Befugnisse noch diese Woche beschlossen werden. Durch das Gesetzespaket erhalten Bundespolizei, BKA und BAMF neue Befugnisse mit beispielloser Reichweite. Die neuen Befugnisse zum biometrischen Abgleich bzw. zur Identifizierung anhand von allen im Internet öffentlich zugänglichen Daten und die automatisierte Datenanalyse durch Anbietende wie Palantir, Clearview, PimEyes und Co greifen tief in die Grundprinzipien einer offenen, freiheitlichen und selbstbestimmten Gesellschaft ein. Sie verstoßen gegen EU-Recht und die deutsche Verfassung und brechen die Versprechen des Koalitionsvertrages, gegen biometrische Massenüberwachung vorzugehen. Die vorliegenden Änderungsanträge können auch die Bedenken gegenüber dem Missbrauchspotenzial der neuen Befugnisse, der strukturellen Diskriminierung und der grundrechtsschonenden Durchsetzung nicht aus dem Weg räumen. Insbesondere mit Blick auf das Erstarken demokratiefeindlicher Kräfte sind das Sicherheitspaket und die darin enthaltenen Maßnahmen zutiefst besorgniserregend.“"
year_published = 2024
clearnet = "http://www.ccc.de/de/updates/2024/die-groesste-enttauschung-seit-beginn-der-ampel-regierung"
