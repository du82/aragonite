["http://www.ccc.de/de/updates/2024/un-cybercrime"]
title = "CCC | Withdraw support from UN Cybercrime Convention!"
description = "Der Chaos Computer Club ist eine galaktische Gemeinschaft von Lebewesen für Informationsfreiheit und Technikfolgenabschätzung."
full_description = "In a joint letter concerning the United Nations Cybercrime Convention the Chaos Computer Club (CCC) and dozens of signees urge all EU member states to reject the proposal for the UN General Assembly to adopt the draft Convention. In a joint letter concerning the United Nations Cybercrime Convention the Chaos Computer Club (CCC) and dozens of signees urge all EU member states to reject the proposal for the UN General Assembly to adopt the draft Convention. Joint Letter to the European Union and its Member States concerning the United Nations Cybercrime Convention We, the undersigned organisations and individual experts, urge all EU member states to vote no when the draft UN Convention against Cybercrime (A/AC.291/L.15) comes to a vote at the General Assembly. We are united in urging the EU and its member states to reject the proposal to adopt the Convention during the UN General Assembly vote. The breadth and depth of opposition to the draft UN Cybercrime Convention is stark – bringing together human rights groups, media freedom organisations, the Office of the UN High Commissioner for Human Rights (OHCHR), leading security researchers, large tech companies, and industry associations – and indicates the need for a clear departure from the current, damaging and misguided, approach. A decision to withdraw support would not prevent the EU and its member states from continuing to engage in the development of human rights compliant international standards to address cybercrime and capacity building for mutual legal assistance (MLA) requests and preventing and combating cybercrime. Rather, it would provide space for critical reflection and consideration of alternatives. In contrast, EU support for the adoption of the draft UN Cybercrime Convention would contribute to swift and broad ratification, undermining democracy, human rights and the rule of law, endangering a wide range of communities and jeopardising the safety and privacy of Internet users globally. We urge the EU and its member states to withdraw their support from the draft UN Cybercrime Convention and use their mandates to encourage other countries to do the same."
year_published = 2024
