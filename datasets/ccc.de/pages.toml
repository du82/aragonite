["https://ccc.de/en/updates/2025/ilovefreesoftware"]
title = "CCC | I Love Free Software Day: Seid dabei und sagt Danke!"
description = "Der Chaos Computer Club ist eine galaktische Gemeinschaft von Lebewesen für Informationsfreiheit und Technikfolgenabschätzung."
full_description = "Jedes Jahr am 14. Februar feiert die Free Software Foundation Europe (FSFE) gemeinsam mit anderen Freie-Software-Organisationen und -Enthusiasten den „I Love Free Software Day“, um die Bedeutung der Mitwirkenden von Freier Software hervorzuheben. Jedes Jahr am 14. Februar feiert die Free Software Foundation Europe (FSFE) gemeinsam mit anderen Freie-Software-Organisationen und -Enthusiasten den „I Love Free Software Day“, um die Bedeutung der Mitwirkenden von Freier Software hervorzuheben. Ein großes Dankeschön geht am „I Love Free Software Day“-Tag am 14. Februar an alle, die Freie Software entwickeln. Denn ohne sie wäre Freie Software nicht denkbar. Ohne Freie Software würden weite Teile unserer Infrastruktur und unseres täglichen Lebens so nicht funktionieren. Kaum ein Auto läuft heutzutage noch ohne curl und kaum ein Managed Switch oder Router existiert ohne freien Unterbau. Jedes Jahr vertrauen wir im täglichen Leben auf unzählige weitere kleine und große Freie-Software-Projekte. Der „I Love Free Software Day“ soll alle Menschen ermutigen, den Entwickler:innen und Mitwirkenden von Freier Software Danke zu sagen, ihnen Aufmerksamkeit und Wertschätzung entgegenzubringen und ein Zeichen zu setzen, wie wichtig Freie Software für uns alle ist. Freie Software braucht eine engagierte Gemeinschaft, Zusammenarbeit und ein Miteinander der Entwickler:innen und der Nutzer:innen. Die FSFE möchte daher einladen: Sei dabei und mach mit beim diesjährigen „I Love Free Software Day“! Dazu gibt es mehrere Möglichkeiten: Die einfachste und auch für Menschen unter Zeitdruck leicht umsetzbare Variante: Sag der Freien Software, die dir am Herzen liegt, in den sozialen Medien Danke. Die FSFE stellt für deine kreative Dankesnachricht den neu designten Sharepic Generator vor: https://sharepic.fsfe.org/#ilovefs Aber sag mal: Wann hast du zuletzt eine Postkarte verschickt? Vielleicht wäre jetzt ein guter Zeitpunkt. Die FSFE hat da was vorbereitet: Schicke den Menschen hinter der Freien Software, denen du danken willst, eine ILoveFS-Postkarte mit deiner ganz persönlichen Dankesnachricht: https://fsfe.org/contribute/spreadtheword.en.html#ilovefs"
year_published = 2025
clearnet = "https://ccc.de/en/updates/2025/ilovefreesoftware"
