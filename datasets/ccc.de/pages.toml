["https://ccc.de/de/home"]
title = "CCC | Startseite"
description = "Der Chaos Computer Club ist eine galaktische Gemeinschaft von Lebewesen für Informationsfreiheit und Technikfolgenabschätzung."
full_description = "Der Chaos Computer Club (CCC) ist die größte Hackervereinigung Europas und seit über vierzig Jahren Vermittler im Spannungsfeld technischer und sozialer Entwicklungen. Seine Aktivitäten reichen von technischer Forschung und Erkundung am Rande des Technologie­universums über Kampagnen, Veranstaltungen, Politikberatung, Mitteilungen bis zum Betrieb von Anonymisierungs­diensten und Kommunikations­mitteln. Der Club besteht aus dezentralen Gruppen im deutschsprachigen Raum, die regelmäßige Veranstaltungen und Treffen organisieren. Der CCC vermittelt seine Anliegen über vielfältige Publikationen und sucht den Dialog mit technisch und sozial Interessierten und Gleichgesinnten. Er fordert und fördert den Spaß am Gerät und lebt die Grundsätze der Hacker­ethik. Jedes Jahr am 14. Februar feiert die Free Software Foundation Europe (FSFE) gemeinsam mit anderen Freie-Software-Organisationen und -Enthusiasten den „I Love Free Software Day“, um die Bedeutung der Mitwirkenden von Freier Software hervorzuheben. mehr … Der Chaos Computer Club (CCC) hat gravierende Datenlecks bei den Legal-Tech-Plattformen myright.de und euflight.de gemeldet. Insgesamt waren Daten von rund 325.000 Nutzer*innen zugänglich. mehr … Das Bündnis „Bits & Bäume“ fordert eine wirksame Mitsprache der Zivilgesellschaft bei der Digitalisierung, demokratische Kontrolle digitaler Infrastrukturen sowie eine globale gerechte Digitalwirtschaft. Digitalpolitik muss aus dem Muff der 1990er gehievt und endlich in den Dienst von Mensch und Umwelt gestellt werden. mehr … Mit bedeutungsschwangerer Cyber-Rhetorik will d-trust von der Verantwortung für ein großes Datenleck ablenken. Der CCC erklärt die Hintergründe und fordert Konsequenzen. mehr … Die Verantwortlichen der elektronischen Patientenakte müssen die auf dem 38. Chaos Communication Congress demonstrierten Sicherheitslücken endlich schließen. Der Chaos Computer Club schließt sich einem offenen Brief an, in dem 28 Organisationen aus dem Gesundheitswesen und der Zivilgesellschaft Bundesgesundheitsminister Lauterbach auffordern, Transparenz im gesamten Prozess der ePA herzustellen. mehr …"
