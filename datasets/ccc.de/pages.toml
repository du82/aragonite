["https://ccc.de/de/club/chaostreffs"]
title = "CCC | Chaostreffs"
description = "Der Chaos Computer Club ist eine galaktische Gemeinschaft von Lebewesen für Informationsfreiheit und Technikfolgenabschätzung."
full_description = "Chaostreffs sind lockere Zusammentreffen von Hackern, die sich dem CCC nahefühlen. Wer keinen Chaostreff (oder Erfa-Kreis) in seiner Nähe hat, ist herzlich eingeladen, einen zu gründen und andere Interessierte (zum Beispiel per E-Mail an chaostreffs@lists.ccc.de) einzuladen. Chaostreffs gibt es in folgenden Städten: Wir sind ein Chaostreff und Hackspace in Aalen im Aaccellerator, Blezingerstraße 15, 73430 Aalen. Wir treffen uns regelmäßig jeden 3. Dienstag im Monat ab 18:30 Uhr. Für Treffen außerhalb von den Regelterminen verabreden wir uns spontan über Matrix. Unsere Website ist aalen.space An jedem ersten Sonntag des Monats trifft sich der Chaostreff Alzey um 15 Uhr Uhr im Juku Alzey. Alles Weitere ist unter chaostreff-alzey.de zu finden. All creatures welcome! Wir treffen uns monatlich in Amberg in lockerer Runde. Es wird keine Anmeldung benötigt. All Creatures Welcome! Ort und Zeit der Treffen findet ihr auf der Webseite des Chaostreffs. Chaos Amsterdam meets on Thursdays every other week at 19:00 in a social space close to the city center. We can be found on IRC in #chaosamsterdam on the hackint network. More details: https://chaos.amsterdam/ Der Hacker- und Makerspace Mayen-Koblenz (haxko e.V.) befindet sich in der ehemaligen Gastwirtschaft des Bahnhofs Andernach. Unsere Treffen finden in geraden Kalenderwochen freitags und in ungeraden samstags statt. Beginn immer ab 18 Uhr. Thematisch sind wir offen und durch die Location direkt am Bahnhof gut zu erreichen. Weitere Infos unter haxko.space. Kommt vorbei, wir freuen uns auf euch! Aus dem Chaostreff Augsburg entstanden ist das OpenLab heute der Anlaufpunkt für alle die an nachhaltigem Handeln & Herstellen, dem kreativem Umgang mit Technik, Datenschutz und digitaler Selbstbemächtigung interessiert sind. Jeden Donnerstag offen für Interessierte und jeden dritten Donnerstag auch mit Vortrag im bekannten Chaostreff-Stil. Der Chaostreff im Makerspace Schaffenburg ist ein Zusammenschluss von technikbegeisterten Menschen, die zusammen in (A)schaffenburg einen Ort schaffen, der genau dies bietet: Platz und Werkzeug zum Arbeiten, motivierte Menschen mit Know-How, kreative Ideen und Inspiration. Kurz gesagt: Raum für alle, die etwas machen wollen – ein Makerspace! Zu finden sind wir in der Dorfstraße 1 in Aschaffenburg. Informationen unter schaffenburg.org."
