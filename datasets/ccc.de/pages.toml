["http://www.ccc.de/de/updates/2024/das-ist-vollig-entgleist"]
title = "CCC | Das ist völlig entgleist"
description = "Der Chaos Computer Club ist eine galaktische Gemeinschaft von Lebewesen für Informationsfreiheit und Technikfolgenabschätzung."
full_description = "Der Chaos Computer Club (CCC) unterstützt die drei Hacker, die auf dem 37C3 detailliert darlegten, wie der polnische Schienenfahrzeughersteller Newag seine Züge ab Werk so manipuliert hatte, dass sie nur noch in firmeneigenen Werkstätten repariert werden können. Der Hersteller reagierte auf die Veröffentlichungen in etwa so souverän, wie es in den 1990er Jahren noch Mode war, und verklagte die Hacker sowohl straf- als auch zivilrechtlich. Auf dem 38C3 berichten die Hacker nun über ihre juristische Odyssee, die bisher rund 30.000 Euro verschlang. Der CCC ruft zu Spenden für die aufgelaufenen Rechtsfolgekosten auf."
