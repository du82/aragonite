["https://ccc.de/de/club"]
title = "CCC | Chaos Computer Club"
description = "Der Chaos Computer Club ist eine galaktische Gemeinschaft von Lebewesen für Informationsfreiheit und Technikfolgenabschätzung."
full_description = "Die Wurzeln des Chaos Computer Clubs reichen bis ins Jahr 1981 zurück. Am Tisch der Kommune 1 der Zeitung taz in Berlin trafen sich damals Hacker, selbstbezeichnete „Komputerfrieks“ im Rahmen des „tu-wat“-Kongresses. Sie hatten die Möglichkeiten der gerade aufkommenden elektronischen Datennetze erkannt, wollten diese einer kreativen Nutzung zuführen und sich austauschen. Das Treffen führte zunächst zu einer informellen Gründung des Chaos Computer Clubs und wurde als regelmäßiger Treff in Hamburg weitergeführt. Seit 1984 veranstaltet der CCC den jährlichen Chaos Communication Congress. Im selben Jahr erschien auch die erste Ausgabe der Datenschleuder, dem Fachblatt für Datenreisende. Um juristische Missverständnisse auszuschließen, wurde 1986 der Chaos Computer Club als eingetragener Verein (e. V.) zur Förderung der Informationsfreiheit und eines Menschenrechts auf mindestens weltweite ungehinderte Kommunikation gegründet. Neben dem Congress finden heute viele weitere regelmäßige Veranstaltungen statt. Die als „Mission Statement“ formulierte Präambel der Satzung stellt neben der Hackerethik auch heute noch den Kerngedanken des Vereins nach Transparenz staatlichen Handelns und entsprechender Infrastrukturen als Voraussetzung für eine demokratische Ausgestaltung klar in den Vordergrund. Der Verein war von vornherein dezentral in sogenannten Erfa-Kreisen („Erfahrungsaustausch-Kreisen“) organisiert, deren dezentrales Wirken in verschiedener Form mit dem Vereinsleben rückgekoppelt sind. Mit derzeit etwa dreißig Erfakreisen und über 8.000 Mitgliedern ist der CCC e. V. die größte organisierte Hackervereinigung, die informell aber auch mit Hackerspaces und weniger organisierten Gruppen im Kontakt und Austausch steht. Durch öffentlichkeitswirksame Aktionen wie dem BTX-Hack, dem Projekt Blinkenlights, der Veröffentlichung von Wolfgang Schäubles Fingerabdruck, der Manipulation von Wahlcomputern oder der Veröffentlichung des Staatstrojaners hat sich der CCC einen Namen gemacht, soziale Auswirkungen technischer Entwicklungen anschaulich zu kommentieren. Die Expertise des Clubs ist deshalb gefragt: Vom Bundesverfassungsgericht über Datenschutzgremien bis zu Wirtschaftsforen und Juristenkonferenzen beteiligen sich die Experten an Gutachten, Stellungnahmen, Vorträgen und Demonstrationen und tragen so zur öffentlichen Meinungsbildung bei."
year_published = 2025
