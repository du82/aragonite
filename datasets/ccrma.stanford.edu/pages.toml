["https://ccrma.stanford.edu/course-overviews/music-192f-artstudi-175"]
title = "Music 192F / Artstudi 175 | CCRMA"
description = """
Course Description:                         This class will cover creative, historical and theoretical aspects of sited artworks based in sound. We will create, install and critique new works that use sound with special attention the ways that sound intersects with time, space and architecture. Attention will be given both to sound as immaterial signal and to sound in its relation to visual environments and objects. The class is intended for artists, composers and others who want to explore the spatial, social and aesthetic dimensions of sound. Assigned readings will cover sound practices in the contexts of art, music, sound studies and anthropology. Experience in sound recording or production, signal processing and spatialization, or installation are valuable but not required. Curiosity and attention to sounds are."""
