full_description = 'Concert Production Here is a chronological ordering of steps you should take to prepare for a performance at CCRMA: CCRMA concert events typically have some sort of connection to computer music or aspects of CCRMA research. The CCRMA Stage is not suitable for general-purpose concert use. All concerts must be requested at least 2 weeks in advance of first rehearsal. This gives us reasonable time to secure the room, rehearsal time, and a tech person to assist you or train you in using the Stage facilities. Many concerts and events require to have a CCRMA tech person in attendance. Go to: https://music.stanford.edu/resources/reserve/performance-hall-requests and follow the instructions there to request a hall for your event. Enter ALL pertinent info (this information goes directly to the Music Department staff since CCRMA concerts are also Music Department concerts). If your event requires recording, make sure to request it in the reservation form. Go to https://ccrma.stanford.edu/room-guides/ccrma-stage and read the CCRMA Stage Guidelines. Email Nette Worthey (networth at ccrma) a brief description of your intended event and an answer to the question "Why CCRMA?" If approved, a tech person will be assigned to your event and you will receive an email. If your event takes place during regular business hours, the tech person will assist you. If your event happens in the evening or during the weekend—and depending on the nature and specifics of the event—you may have to learn in advance how to operate the equipment yourself, or arrange with the tech person to be there. You are responsible for all clean-up related to your event, including restoring the Stage to its default state and dealing with any food you provide (only allowed with prior approval). Making a Concert Program Concert Publicity Making a Concert Program › HomeNews and EventsAll EventsCCRMA ConcertsColloquium SeriesDSP SeminarsHearing SeminarsGuest LecturesEvent CalendarEvents Mailing List