["https://ccrma.stanford.edu/events/ccrmas-2024-mamst-cohort-in-coherence"]
title = "CCRMA's 2024 MA/MST Cohort: In Coherence | CCRMA"
description = "Multi-disciplinary facility where composers and researchers use computer-based technology as an artistic medium and as a research tool."
full_description = "Date: Mon, 04/08/2024 (All day) - Sun, 07/14/2024 (All day) Location: CCRMA WAVE (Lobby) Event Type: Other CCRMA WAVE (Wall for AudioVisual Expression) presents In Coherence by CCRMA's 2024 MA/MST Cohort. The exhibition runs in the CCRMA Lobby. Our building is currently open only to current CCRMA affiliates and their guests. If you would like to visit the exhibition and you currently do not have access to the building, please contact Constantin Basica to schedule a visit. Featuring works by: Terry Feng, Josh Mitchell, Alex Han, Sami Wurm, Julia Yu, Senyuan Fan, Benny Zhang, Emily Kuo, Yiheng Dong, Soohyun Kim, Max Jardetzky , Victoria Litton, Tristan Peng, and Eito Murakami In Coherence is an audiovisual collage representing the incredibly varied musical interests and talents of CCRMA’s 2024 MA/MST cohort. Each artist completed a minute-long audiovisual piece, given only the last six seconds of a previous artist’s work for inspiration. While each artist’s gesture may appear incoherent at first glance, this sequential juxtaposition places them “in coherent” conversation with each other, a celebration of creative and interdisciplinary audiovisual expression. FREE HomeNews and EventsAll EventsCCRMA ConcertsColloquium SeriesDSP SeminarsHearing SeminarsGuest LecturesEvent CalendarEvents Mailing ListRecent NewsAcademicsCoursesCurrent Year Course ScheduleUndergraduateMastersPhD ProgramVisiting ScholarVisiting Student ResearcherWorkshops 2024ResearchPublicationsAuthorsKeywordsSTAN-MMax Mathews PortraitResearch GroupsSoftwarePeopleFaculty and StaffStudentsAlumniAll UsersUser GuidesNew DocumentationBooking EventsCommon AreasRoomsSystemResourcesPlanet CCRMAMARLBlogsOpportunitiesCFPsAboutThe KnollRenovationDirectionsContact 101 Introduction to Creating Electronic Sound 106 Concert Production 153D Ensemble Sonification of Temporal Data 192F Sound Installation 220B Compositional Algorithms, Psychoacoustics, and Computational Music 222 Sound in Space 223Q Queer