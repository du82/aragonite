["https://ccrma.stanford.edu/events/cynthia-moss-neural-codes-representing-object-distance-in-echolocating-bats"]
title = "Cynthia Moss - Neural codes for representing object distance in echolocating bats | CCRMA"
description = "Multi-disciplinary facility where composers and researchers use computer-based technology as an artistic medium and as a research tool."
full_description = "Date: Mon, 02/10/2025 - 4:00pm - 5:00pm Location: Stanford Neurosciences Building | Gunn Rotunda (E241) Event Type: Hearing Seminar How is auditory information represented in the brain? All that rich information that we hear turns into new knowledge and pleasure. It all spikes, top to bottom, soup to nuts, but what do these spikes mean? How is our world represented? Sneak preview: It’s not just a matter of how often neurons fire! I’m really happy to that Prof. Cynthia Moss will be on campus next *Monday* afternoon for a talk in the Stanford Mind, Brain, Computation and Technology Seminar Series. Cindy studies bats, which are especially interesting because their auditory system directly drives what they eat! (Although now that I write that, my dog comes *running* anytime I open the refrigerator. :-). But the point remains, a bat has a particularly simple pathway between hearing and eating. It’s a good animal model to understand how sound is represented in the brain. Who: Cynthia Moss What: Neural codes for representing object distance in echolocating bats When >>>>>> Mon, 02/10/2025 - 4:00pm - 5:00pm <<<<<<<<<< Where: >>>>>> Stanford Neurosciences Building | Gunn Rotunda (E241), 290 Jane Stanford Way, Stanford, CA 94305 Why: We don’t really know how sound is represented in the brain! Neural codes for 3D auditory localization Prof. Cynthia Moss, Johns Hopkins University Abstract: As humans and other animals move through the natural environment, the distance and direction to objects change, invoking the need to rapidly encode dynamic information about 3D natural scenes. Animals that rely on active sensing provide powerful research models to investigate the neural underpinnings of 3D scene representation, as they produce the very signals that yield sensory input, which then guide motor actions. Echolocating bats, for example, compute the direction of objects from differences in echo intensity, spectrum, and timing at the two ears, and they estimate their distance to objects from the time delay between sonar calls and echo returns. Further, the bat adapts its echolocation behavior in response to 3D spatial information computed from echo returns, and therefore, the directional aim and temporal patterning of the bat’s calls provide a window to its attention to objects in the environment. This talk will summarize three new findings on neural mechanisms of 3D auditory localization in the big brown bat, Eptesicus fuscus. 1) Echo-delay tuned neurons in the midbrain of the freely flying bat show 3D spatial tuning to echoes from physical objects, and sonar-guided attention evokes sharper echo delay tuning and shifts to shorter echo delays. 2) Local field potential recordings from auditory midbrain neurons in the passively listening bat encode the time interval between call-echo pairs in the microsecond range, which aligns with high resolution behavioral performance data. 3) A population of hippocampal CA1 neurons encodes the distance of auditory objects, implicating this brain structure in time-space computations. Collectively, these findings serve to bridge results from behavioral and neurophysiological studies and demonstrate that 3D auditory spatial coding operates through networks of neurons across midbrain and telencephalic brain regions. Bio: Cynthia F. Moss is Professor of Psychological and Brain Sciences, with joint appointments in Neuroscience and Mechanical Engineering. At Johns Hopkins, she directs the Comparative Neural Systems and Behavior Laboratory, aka the Bat Lab. Moss received a B.S. (summa cum laude) from the University of Massachusetts, Amherst, and a Ph.D. from Brown University. She was a Postdoctoral Fellow at the University of Tübingen, Germany, and a Research Fellow at Brown University before joining the faculty at Harvard University. At Harvard, Moss received the Phi Beta Kappa teaching award and was named the Morris Kahn Associate Professor. She also received the National Science Foundation Young Investigator Award. She later moved to the University of Maryland, where she was a Professor in the Department of Psychology and Institute for Systems Research. At the University of Maryland, Moss served as Director of the interdepartmental graduate program in Neuroscience and Cognitive Science. She was recognized in 2010 with the University of Maryland Regents Faculty Award for Research and Creativity. In 2014, Moss joined the faculty at Johns Hopkins University, where she served as Director of the Behavioral Biology Program, 2015-2018, and Chair of the Department of Psychological and Brain Sciences, 2020-2023. She was a visiting scholar at Hong Kong University of Science and Technology, 2018-2019 and Phi Beta Kappa Visiting Scholar, 2023-2024. Her recent awards include the Hartmann Award in Auditory Neuroscience (2017), the James McKeen Cattell Award (2018) and the Alexander von Humboldt Research Prize (2019). She is a Fellow of the American Association for the Advancement of Science, the Acoustical Society of America and the International Society for Neuroethology. FREE Open to the Public"
year_published = 2025
