full_description = "CCRMA is located on the Stanford University campus in The Knoll--a building that was refurbished in 2004 and 2005 to meet its unique needs. For more information on the history of the Knoll and to see hisoric images, visit: https://ccrma.stanford.edu/knoll-renovation. The Knoll facility includes a large space with multichannel sound for teaching, concerts, and acoustic experimentation, an adjoining control room/studio, a digital multi-track recording studio with adjoining control room, two additional studios with digital editing facilities, several work areas with workstations, synthesizers and speakers, a seminar room, an in-house reference library, classrooms, and offices. The building has been wired so that any office or workspace can connect with the underlying network. A gateway connects the network to the campus at large and also to the Internet. Knoll Renovation ‹ About up Knoll Renovation › HomeNews and EventsAll EventsCCRMA ConcertsColloquium SeriesDSP SeminarsHearing SeminarsGuest LecturesEvent CalendarEvents Mailing ListRecent NewsAcademicsCoursesCurrent Year Course ScheduleUndergraduateMastersPhD ProgramVisiting ScholarVisiting Student ResearcherWorkshops 2024ResearchPublicationsAuthorsKeywordsSTAN-MMax Mathews PortraitResearch GroupsSoftwarePeopleFaculty and StaffStudentsAlumniAll UsersUser GuidesNew DocumentationBooking EventsCommon AreasRoomsSystemResourcesPlanet CCRMAMARLBlogsOpportunitiesCFPsAboutThe KnollRenovationDirectionsContact 101 Introduction to Creating Electronic Sound 106 Concert Production 153D Ensemble Sonification of Temporal Data 192F Sound Installation 220B Compositional Algorithms, Psychoacoustics, and Computational Music 222 Sound in Space 223Q Queer Electronic Music Composition 251 Psychophysics and Music Cognition 253 Symbolic Musical Information 319 Research Seminar on Computational Models of Sound 422 Perceptual Audio Coding 451B Neuroscience of Auditory Perception and Music Cognition II: Neural Oscillations C