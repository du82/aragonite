["https://ccrma.stanford.edu/course-overviews/music-106"]
title = "Music 106 | CCRMA"
description = """
Course Description:                         This course offers students hands-on training in technology for music performances. Through real-world scenarios, students gain experience with tools and workflows for sound reinforcement, live mixing, multitrack recording, spatial audio, networked performance, livestreaming, video production, projection mapping, and stage lighting. Acquired skills are applicable to other types of live events such as theater, dance, radio/TV, etc. Activities center on the CCRMA Stage, with visits to other campus venues. Weekly sessions feature tutorials and guided practice, culminating in student-led recitals, collaborative concerts, or assistance with CCRMA events. No prior experience is required; familiarity with audiovisual tools and/or performance experience is welcome."""
