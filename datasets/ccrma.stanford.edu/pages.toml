["https://ccrma.stanford.edu/colloquium"]
title = "Colloquium Series | CCRMA"
description = "Multi-disciplinary facility where composers and researchers use computer-based technology as an artistic medium and as a research tool."
full_description = "The CCRMA Colloquium is a weekly gathering of CCRMA students, faculty, staff, and guests. It is an opportunity for members of the CCRMA community and invited speakers to share the work that they are doing in the field of Computer Music. The colloquium typically happens every Wednesday during the school year from 5:30 - 7:00pm and meets in the CCRMA Classroom, Knoll 217 unless otherwise noted. The schedule for this year's CCRMA Colloquium can be found here: ccrma.stanford.edu/wiki/Colloquium Colloquia and concerts are announced via a mailing list. ‹ CCRMA Concerts up MUS423 Research Seminars › Creative and Equitable Practices in Remote Music Education Date: Thu, 06/03/2021 - 3:30pm - 5:00pm Location: Zoom, link provided by RSVP Event Type: Colloquium Creative and Equitable Practices in Remote Music Education Alex Chechile, CCRMA Postdoctoral Scholar Music education faced a number of challenges over the past year, yet educators continue to adapt using a wide range of strategies. Creative and Equitable Practices in Remote Music Education is a participatory seminar for K-12 teachers to discuss key issues and share working solutions. Topics will include technology for realtime remote music performance, innovative practices for performance and exhibition, and student equity and inclusion. The addressed methodologies will benefit post-pandemic teaching for they cultivate expanded creative practices and can function to increase diversity within the classroom and beyond. We look forward to meeting you! *Open to K-12 Teachers* Creative and Equitable Practices in Remote Music Education Date: Fri, 05/28/2021 - 3:30pm - 5:00pm Location: Zoom, link provided by RSVP Event Type: Colloquium Creative and Equitable Practices in Remote Music Education Alex Chechile, CCRMA Postdoctoral Scholar *Open to K-12 Teachers* Creative and Equitable Practices in Remote Music Education Date: Thu, 05/20/2021 - 3:30pm - 5:30pm Location: Zoom, link provided by RSVP Event Type: Col