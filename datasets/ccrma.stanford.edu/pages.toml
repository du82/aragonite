full_description = "Applying to the Ph.D. program CCRMA offers a Ph.D./Music program in Computer-Based Music Theory and Acoustics. Since CCRMA is multidisciplinary, we may have Ph.D. students from several departments. While all CCRMA faculty are formally within the Music department, Ge Wang holds a courtesy appointment in Computer Science which allows him to serve as primary thesis advisor for Ph.D./CS students. All CCRMA faculty, including adjunct and emeritus, can be secondary advisers on your committee. Application for graduate study is handled in your home department. More Information: You may view the programs in the Stanford Bulletin. Also see the Music Department site for a discussion of the graduate programs in music. Please read the Registrar's information about applying to Stanford. ‹ Masters Program up Visiting Scholar › HomeNews and EventsAll EventsCCRMA ConcertsColloquium SeriesDSP SeminarsHearing SeminarsGuest LecturesEvent CalendarEvents Mailing ListRecent NewsAcademicsCoursesCurrent Year Course ScheduleUndergraduateMastersPhD ProgramVisiting ScholarVisiting Student ResearcherWorkshops 2024ResearchPublicationsAuthorsKeywordsSTAN-MMax Mathews PortraitResearch GroupsSoftwarePeopleFaculty and StaffStudentsAlumniAll UsersUser GuidesNew DocumentationBooking EventsCommon AreasRoomsSystemResourcesPlanet CCRMAMARLBlogsOpportunitiesCFPsAboutThe KnollRenovationDirectionsContact 101 Introduction to Creating Electronic Sound 106 Concert Production 153D Ensemble Sonification of Temporal Data 192F Sound Installation 220B Compositional Algorithms, Psychoacoustics, and Computational Music 222 Sound in Space 223Q Queer Electronic Music Composition 251 Psychophysics and Music Cognition 253 Symbolic Musical Information 319 Research Seminar on Computational Models of Sound 422 Perceptual Audio Coding 451B Neuroscience of Auditory Perception and Music Cognition II: Neural Oscillations CCRMA Department of Music Stanford University Stanford, CA 94305-8180 USA tel: (650) 723