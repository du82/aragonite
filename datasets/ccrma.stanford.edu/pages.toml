title = 'Music 222 "Sound in Space" | Winter 2025'
full_description = "The course will include historical background, theory and techniques for the use of space in music composition and diffusion. We will use both speaker arrays and binaural audio over headphones (and sound capture, with the goal of creating short pieces and sound art). We will be using CCRMA's multichannel surround facilities, including the Listening Room (full 3D 22.8 speaker array), our small concert hall, the Stage (using a full dome with a 56.8 speaker system), and other smaller surround studios available in our building. We will also talk about approaches that could enable you to experiment with surround sound at home."
