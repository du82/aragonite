["https://ccrma.stanford.edu/concerts"]
title = "CCRMA Concerts | CCRMA"
description = "Concerts at the Stanford Center for Computer Research in Music and Acoustics (CCRMA) feature new and recent computer music by graduate students and faculty."
full_description = '''Concerts at CCRMA feature new and recent computer music by students, faculty, staff, and alumni. Our Concert Series also hosts regular performance by local and visiting artists working with computers, electronics, modular synthesizers, visuals, etc. Concerts are announced via our MAILING LIST. Past concerts can be accessed on our Vimeo archive of live streamed events. ‹ All Upcoming Events up Colloquium Series › CCRMA Winter Concerts 2025 Date: Fri, 02/14/2025 - 7:30pm - 9:30pm Date: Sat, 02/15/2025 - 7:30pm - 9:30pm Location: CCRMA Stage / CCRMA LIVE Event Type: Concert CCRMA celebrates the winter season with two ear-warming concerts in the Stage. Students, faculty, staff, and guest artists will present live performances, fixed media electronic music, and audiovisual works. Each evening’s program will feature different artists. FREE and Open to the Public | In Person + Livestream NEKO3 Micro-Workshop with Stanford Graduate Composers Date: Sun, 02/09/2025 - 7:30pm - 11:30pm Location: CCRMA Stage / Zoom Event Type: Concert NEKO3 x Stanford University - Micro-workshop on tour Free Open to the Public Chris Brown & Thea Farhadian | Solos and Duo Performance Date: Wed, 01/15/2025 - 7:30pm - 9:00pm Location: CCRMA Stage / CCRMA LIVE Event Type: Concert CCRMA presents a live performance by Chris Brown and Thea Farhadian. FREE and Open to the Public | In Person + Livestream Robert Fleitz: New Works by Stanford Graduate Composers Date: Sat, 01/11/2025 - 7:30pm - 9:00pm Location: CCRMA Stage Event Type: Concert ABOUT THIS EVENT Helsinki-based pianist/composer Robert Fleitz comes to Stanford University as artist-in-residence to workshop and premiere five new works with Stanford graduate composers. WORKS BY Brian Brown, Kimia Koochakzadeh-Yazdi, Anna Golubkova, Simon Frisch, and Mohammad H. Javaheri FREE Open to the Public Gradients of Control | Robert Fleitz Piano Recital Date: Wed, 01/08/2025 - 7:30pm - 9:00pm Location: CCRMA Stage Event Type: Concert The relationship between composer, performer, audience, and score is a delicate and malleable web—not only in these agents' realities, but in the perceptions that are placed on each of them by the other. These imagines versions, shaped by tradition and context, blur the boundaries between intention and interpretation. In this recital, the solo piano becomes a focal point for exploring how composers and performers negotiate control over musical materials. The scores on this program move from improvisation, to control, and back again; questioning what it means to have "freedom" in a work of composed music, and inviting the listener to examine their own role in the process of meaning- and memory-making. The program features works by Camila Agosto, Manaka Kataoka, Linda Leimane, Rytis Mažulis, Jeffrey Mumford, Lou Sheppard, Julie Zhu and Raimonda Žiūkaitė FREE Open to the Public Composers from Afar | CCRMA 50th Anniversary Date: Fri, 12/06/2024 - 7:30pm - 9:30pm Location: CCRMA Stage / CCRMA LIVE Event Type: Concert CCRMA presents the final event in its 50th Anniversary Concert Series. Composers from Afar remembers pieces by Visiting Artists who have worked on computer music at CCRMA over the years, including Natasha Barrett, Vilbjørg Broch, Ludger Brümmer, Tine Surel Lange, Stéphane Roy, and Marco Trevisani. FREE and Open to the Public | In Person + Livestream Vilbjørg Broch: Reflections Date: Thu, 12/05/2024 - 7:30pm - 9:30pm Location: CCRMA Stage / CCRMA LIVE Event Type: Concert CCRMA Visiting Scholar/Composer Vilbjørg Broch presents a concert of new works. 6-7pm Pre-Show Talk FREE and Open to the Public | In Person + Livestream Stanford Cinematheque: FILM BODIES Date: Wed, 12/04/2024 - 6:30pm - 8:00pm Location: Oshman Hall | McMurtry Building Event Type: Concert The ½ Core+ improvises a live electroacoustic accompaniment to films by Stan Brakhage and Carolee Schneemann in FILM BODIES at Stanford Cinematheque. The ½ Core+ is Constantin Basica, Chris Chafe, Kimia Koochakzadeh-Yazdi, and Fernando Lopez-Lezcano. FREE | Open to Stanford Affiliates Only | Oshman Hall, McMurtry Building, 355 Roth Way, Stanford, CA 94305 Electronic Sound Poetry Date: Tue, 12/03/2024 - 7:30pm - 9:00pm Location: CCRMA Stage Event Type: Concert The composers, poets, lyricists, rappers, computer musicians, and intermedia experimentalists of Mark Applebaum’s Electronic Sound Poetry class present original electronic works, musique concrète soundscapes, songs, audio essays, multi-channel pieces, works with video, and live performances employing vocal sounds produced by singing, speaking, speech synthesis, and digitally processed and collaged words. FREE and Open to the Public Foreign/Domestic Date: Thu, 11/21/2024 - 7:30pm - 9:30pm Location: CCRMA Stage / CCRMA LIVE Event Type: Concert CCRMA presents a live performance by Foreign/Domestic. FREE and Open to the Public | In Person + Livestream 1 of 65 ››'''
