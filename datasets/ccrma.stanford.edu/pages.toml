full_description = "Bachelor of Arts in Music with a Concentration in Music, Science and Technology The Center for Computer Research in Music and Acoustics (CCRMA) does not directly offer an undergraduate degree, however students of the Stanford Music Department can choose to major or minor in Music with a concentration in Music, Science and Technology. The MST specialization is designed for those students with a strong interest in the musical ramifications of rapidly evolving computer technology and digital audio and in the acoustic and psychoacoustic foundations of music. The program entails a substantial research project under faculty guidance and makes use of the highly multi-disciplinary environment at CCRMA. This program can serve as a complementary major to students in the sciences and engineering. For more information, visit the Stanford Music Department and the Stanford Bulletin. ‹ Current Year Course Schedule up Masters Program › HomeNews and EventsAll EventsCCRMA ConcertsColloquium SeriesDSP SeminarsHearing SeminarsGuest LecturesEvent CalendarEvents Mailing ListRecent NewsAcademicsCoursesCurrent Year Course ScheduleUndergraduateMastersPhD ProgramVisiting ScholarVisiting Student ResearcherWorkshops 2024ResearchPublicationsAuthorsKeywordsSTAN-MMax Mathews PortraitResearch GroupsSoftwarePeopleFaculty and StaffStudentsAlumniAll UsersUser GuidesNew DocumentationBooking EventsCommon AreasRoomsSystemResourcesPlanet CCRMAMARLBlogsOpportunitiesCFPsAboutThe KnollRenovationDirectionsContact 101 Introduction to Creating Electronic Sound 106 Concert Production 153D Ensemble Sonification of Temporal Data 192F Sound Installation 220B Compositional Algorithms, Psychoacoustics, and Computational Music 222 Sound in Space 223Q Queer Electronic Music Composition 251 Psychophysics and Music Cognition 253 Symbolic Musical Information 319 Research Seminar on Computational Models of Sound 422 Perceptual Audio Coding 451B Neuroscience of Auditory Perception and Music Cognition II: Neural Oscillations"
