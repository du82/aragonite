["https://ccrma.stanford.edu/guest-lectures"]
title = "Guest Lectures | CCRMA"
description = "Multi-disciplinary facility where composers and researchers use computer-based technology as an artistic medium and as a research tool."
full_description = '''Occasionally, courses offered at CCRMA will bring in a guest lecturer. Often times, those lectures are open, not only to CCRMA students, staff, faculty and researchers, but also to the public. Such events are listed below. ‹ Hearing Seminars up Jonathan Berger receives National Endowment for the Arts commission for My Lai › Manaswi Mishra | AI Lutherie for Live Performances (Workshop) Date: Fri, 02/14/2025 - 12:00pm - 2:00pm Location: CCRMA Classroom Event Type: Guest Lecture Abstract: FREE Open to the Public Victor Arul | Composition Forum Date: Tue, 01/07/2025 - 5:00pm - 7:00pm Location: CCRMA Stage / Zoom Event Type: Guest Lecture The Graduate Composition Forum presents Victor Arul as part of the Harvard x Stanford Composition Student Exchange. FREE and Open to the Public | In Person + Zoom Juhan Nam, "My Journey Toward Musically Intelligent Machines" Date: Fri, 11/15/2024 - 3:30pm - 5:00pm Location: CCRMA Classroom [Knoll 217] (ZOOM Link Below) Event Type: Guest Lecture Abstract Creating intelligent machines that can listen to, play, and even making music has been a longstanding human ambition. Recent advancements in AI, especially through deep learning, have brought us closer to realizing this vision. In this talk, I will share my personal journey in developing musically intelligent machines, beginning with my PhD research on music representation learning during the early days of deep learning, and continuing with my collaborative work with students over the past decade at KAIST. Key topics will include bridging music audio with language, human-AI music ensemble performances, and neural audio processing. Open to the Public The New Sound of New Music: Contemporary Composition and Modern Record Production Practices, two part lecture series with Murat Çolak Date: Thu, 10/31/2024 - 6:00pm - 8:00pm Date: Thu, 11/07/2024 - 2:00pm - 4:00pm Location: CCRMA classroom Event Type: Guest Lecture Murat Colak is a Turkish-American composer, mastering engineer, mixer, record producer, and educator based in New York City. He’s known for his work in contemporary classical and experimental music, with records on acclaimed labels like KAIROS, Edition Wandelweiser, NEOS, New Focus, Jazzland, Innova, Carrier, and Da Vinci Classics among others. During his residency at Stanford University's CCRMA, Dr. Colak will present two public lectures. The first will introduce his creative journey, offering insights into his compositional approach and how it intersects with his approach to sound engineering, especially in crafting acoustics for contemporary concert music.. Free Open to the Public 4D Audio-Visual Learning: A Visual Perspective of Sound Propagation and Production Date: Thu, 08/01/2024 - 3:00pm - 4:00pm Location: CCRMA Classroom Event Type: Guest Lecture Changan Chen (Stanford) joins us to discuss his research. FREE Open to the Public Dynamical mechanisms of how an RNN keeps a beat, uncovered with a low-dimensional reduced model Date: Wed, 07/31/2024 - 3:00pm - 4:00pm Location: CCRMA Classroom Event Type: Guest Lecture Klavdia Zemlianova (Columbia) joins us to discuss her research. FREE Open to the Public Text-to-Audio GenAI: Opportunities and Challenges in Music Production and Audio Content Generation Date: Tue, 07/30/2024 - 3:00pm - 4:00pm Event Type: Guest Lecture Francesca Ronchini (Politecnico di Milano) joins us to discuss her PhD research. FREE Open to the Public Dataset distillation for Audio-visual tasks Date: Mon, 07/29/2024 - 3:00pm - 4:00pm Location: CCRMA Classroom Event Type: Guest Lecture Saksham Singh (UT Dallas) joins us to discuss his PhD research. FREE Open to the Public Leveraging Electric Guitar Tones and Effects to Improve Robustness in Guitar Tablature Transcription Modeling Date: Fri, 07/26/2024 - 3:00pm - 4:00pm Location: CCRMA Classroom Event Type: Guest Lecture Hegel Pedroza (UNAM) joins us to discuss his PhD research. FREE Open to the Public Investigating Bell Patterns in Candomblé from Historical Field Recordings Date: Thu, 07/25/2024 - 3:00pm - 4:00pm Location: CCRMA Classroom Event Type: Guest Lecture Richa Namballa (NYU) joins us to discuss her PhD research. FREE Open to the Public 1 of 13 ››'''
