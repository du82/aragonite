["https://ccrma.stanford.edu/course-overviews/music-223q"]
title = "Music 223Q | CCRMA"
description = """
Course Description:                         Queer Electronic Music Composition is a creative course structured around the historical and theoretical contributions of composers from the LBGQT+ community with an emphasis on computer-based electronic music. Through a series of reading, listening, and media assignments, students will be exposed to the social and historical implications of LGBTQ+ perspectives in music. Queer-led workshops and lectures will provide further insight into the experience of working professionals in music who identify as being a part of the LGBTQ+ community. Creative assignments for the course are centered around personal experience and the subversion or 'queering' of process and/or perspective. Previous experience working in a Digital Audio Workstation is highly recommended. Enrollment permissions are offered through an application process only. Permission numbers will be distributed during the first week of classes."""
