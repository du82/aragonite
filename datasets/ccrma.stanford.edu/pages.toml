["https://ccrma.stanford.edu/about/directions"]
title = "Directions | CCRMA"
description = "Multi-disciplinary facility where composers and researchers use computer-based technology as an artistic medium and as a research tool."
full_description = '''CCRMA is housed in the Knoll 660 Lomita Dr. Stanford, CA 94305 Google Map Please use the following directions in conjunction with the Stanford campus map or Google Map. via Caltrain Take Caltrain to the Palo Alto station. Take Marguerite shuttle service (either B Line or Midnight Express, depending on time of day) onto the Stanford campus; shuttles meet each train. Get off the shuttle at Tressider Union. Walk away from the Union through the Tressider parking lot and cross Mayfield Avenue. A pathway to the left of Florence Moore Hall leads up a hill. At the top of the hill is Lomita Drive, with the Knoll on your left. from 280 Exit at Alpine Road heading east. At the first traffic light, turn right onto Junipero Serra Boulevard. At the next traffic light, turn left onto Campus Drive West. At the stop sign, turn right onto Santa Teresa. Continue on Santa Teresa until the second stop sign, then turn right on Lomita Drive. Stay to the right on Lomita; the Knoll is at 660 Lomita. from 101 Exit at Embarcadero Road heading west. As Embarcadero crosses El Camino Real it becomes Galvez Street. On Galvez, turn left at the first stop sign, onto Campus Drive. Follow Campus Drive to Mayfield Avenue; turn right on Mayfield (and follow it as it curves left). At the end of Mayfield turn left on Lomita Drive. The Knoll is at 660 Lomita. from El Camino Real Turn onto the Stanford Campus at Galvez Street. On Galvez, turn left at the first stop sign, onto Campus Drive. Follow Campus Drive to Mayfield Avenue; turn right on Mayfield (and follow it as it curves left). At the end of Mayfield turn left on Lomita Drive. The Knoll is at 660 Lomita. from Foothill Expressway Follow Foothill across Page Mill, where it becomes Junipero Serra Boulevard. Turn right onto the Stanford Campus at Campus Drive East. At the first stop sign, turn left onto Mayfield Avenue. Follow Mayfield as it curves left. At the end of Mayfield, turn left on Lomita Drive. The Knoll is at 660 Lomita. Parking Parking in front of and behind CCRMA is zoned for Stanford 'C' permits, Mon-Fri 6am-4pm (i.e., parking is free around the building all other times). The nearest visitor pay parking lot is at Tresidder Union (campus map and Google Map), off Mayfield Avenue. For more information about visitor parking on the Stanford campus, please visit the Stanford Parking and Transportation website. Once You're Inside / Where is So-and-So? There are three floors, but confusingly both the first and second are "ground floors": since it's built on a knoll the first floor is the ground floor on the front side (towards campus) and the second floor is the ground floor on the back side (away from campus). Among the rooms at CCRMA most public events take place in the Stage (3rd floor, #317), Classroom (2nd floor, #217), or Seminar Room (3rd floor, #315). If you don't know exactly where you're going, we recommend you come to central second floor area ("Grand Central Station", #211) or the central third floor area (Lounge, #313, which is also a nice place to sit if you need to wait a few minutes), where you can often find people who usually know where to find whomever you're meeting. ‹ Renovation Weekly Alerts (archive) up Contact ›'''
