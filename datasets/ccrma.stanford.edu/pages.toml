["https://ccrma.stanford.edu/events/invariances-in-structure-of-musical-spaces-and-applications-keyboard-design"]
title = "Invariances in the Structure of Musical Spaces and Applications to Keyboard Design | CCRMA"
description = "Multi-disciplinary facility where composers and researchers use computer-based technology as an artistic medium and as a research tool."
full_description = 'Date: Wed, 02/12/2025 - 5:30pm - 7:00pm Location: CCRMA Classroom / Zoom Event Type: Guest Colloquium Abstract This talk describes the general principles underlying two-dimensional keyboard layouts that are invariant in both transposition and tuning. In these layouts, there is a continuous parameter that generates a continuum of tunings that can be mapped to a button field (the "keyboard") so that the geometric shape of each musical interval is the same within a key, across all keys, and throughout all tunings in the continuum. For example, the fingering of a major chord in 7-tone equal temperament, the major chord in 12-tone equal temperament and the major chord in 19-tone equal temperament are all the same (along with many others). A concrete description of these invariances are given by a row-reduced matrix of the temperament-mapping (the "musical spaces" of the title) and the keyboard geometry. The range of values over which consistent fingering can be maintained is described by the valid tuning range. It is also possible to apply the same mapping to "temper" the overtones of the sound, retuning them in the same fashion as the fundamental pitches. The resulting scales contain many intervals that (locally) minimize the sensory dissonance. A number of concrete examples illustrate the generality of the methods and their applicability to a wide variety of commas and temperaments, tuning continua, and keyboard layouts. A prototype software-synthesizer in Max/MSP demonstrates the feasibility of the designs. ﻿This work is in collaboration with Andrew Milne of Western Sydney University. Bio William Sethares received the Ph.D. degree in electrical engineering from Cornell University, and is currently Professor in the Department of Electrical and Computer Engineering at the University of Wisconsin in Madison. His research interests include adaptation and learning in audio, image and signal processing with special focus on the translation of qualitative models of perception into quantitative models. Dr. Sethares is the author of five books, including "Tuning, Timbre, Spectrum, Scale," and "Rhythm and Transforms," which apply perceptual models to the processing (and understanding) of sound. Zoom Link: https://stanford.zoom.us/j/93954711512?pwd=rLzZI9jtbUcNv8XaLMPK2YbBhsKTAT.1 Passcode: 928762 FREE Open to the Public'
