full_description = "CCRMA is a part of the Department of Music at Stanford University. Classes and seminars taught at the center are open to registered Stanford students and visiting scholars. The facility is also available to registered Stanford students and visiting scholars for research projects which coincide with ongoing work at the center. Graduate Programs Overview: Prospective graduate students especially interested in the work at CCRMA should apply to the degree program at Stanford most closely aligned with their specific field of study, e.g., Music, Electrical Engineering, Computer Science, Psychology, etc. Graduate degree programs offered in music include the MA/MST in Music, Science, and Technology, the DMA in Composition, and the PhD in Computer-Based Music Theory and Acoustics. Acceptance in music theory or composition is largely based upon musical criteria, not knowledge of computing. Admission requirements for degree programs can be obtained directly from each particular department. CCRMA does not itself offer a degree. Courses Current Year Course Schedule Undergrad Program Masters Program PhD Program Visiting Scholar Visiting Student Researcher Courses › HomeNews and EventsAll EventsCCRMA ConcertsColloquium SeriesDSP SeminarsHearing SeminarsGuest LecturesEvent CalendarEvents Mailing ListRecent NewsAcademicsCoursesCurrent Year Course ScheduleUndergraduateMastersPhD ProgramVisiting ScholarVisiting Student ResearcherWorkshops 2024ResearchPublicationsAuthorsKeywordsSTAN-MMax Mathews PortraitResearch GroupsSoftwarePeopleFaculty and StaffStudentsAlumniAll UsersUser GuidesNew DocumentationBooking EventsCommon AreasRoomsSystemResourcesPlanet CCRMAMARLBlogsOpportunitiesCFPsAboutThe KnollRenovationDirectionsContact 101 Introduction to Creating Electronic Sound 106 Concert Production 153D Ensemble Sonification of Temporal Data 192F Sound Installation 220B Compositional Algorithms, Psychoacoustics, and Computational Music 222 Sound in Space 223Q Queer Electroni