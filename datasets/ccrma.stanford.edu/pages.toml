["https://ccrma.stanford.edu/events/niloufar-shiri-x-stanford-graduate-composers"]
title = "Niloufar Shiri x Stanford Graduate Composers | CCRMA"
description = "Multi-disciplinary facility where composers and researchers use computer-based technology as an artistic medium and as a research tool."
full_description = "Date: Sun, 03/02/2025 - 7:30pm - 8:30pm Location: CCRMA Stage Event Type: Concert Niloufar Shiri concludes her residency with a concert featuring five new compositions by Stanford Graduate composers, specifically written and developed for the kamancheh. Works by: Celeste Betancur, Brian Brown, Kimia Koochakzadeh-Yazdi, Nick Shaheed, and Mercedes Montemayor Elosua Niloufar Shiri is a kamancheh player, composer, and improviser born and raised in Tehran, Iran, whose work bridges the traditional and experimental, weaving them into a singular musical language. Rooted in the Radif (the classical Persian music repertoire), Shiri’s music navigates the textural and timbral spaces of instruments' harmonic and sonic properties. Drawing inspiration from the intervallic relationships and pitch settings of traditional Iranian music, she analyzes and incorporates the spectral qualities of these extended intervals, uncovering their latent possibilities. Her compositions explore the dynamic interplay of tones and challenge conventional instrumental functions, where each attack and vibration—shaped by its surrounding sonic periphery—unfolds into a rich spectrum of extended sonic possibilities. Shiri has composed solo works, as well as small ensembles and orchestras. She loves reimagining the sonic potential of string instruments and voice, positioning them as central elements in her explorations. Her recent album release, OSHI, is a collaboration with Isaac Otto, an L.A.-based composer and multi-woodwind performer, released on Infrequent Seams. Her pieces have been performed by ensembles such as the JACK Quartet, Del Sol Quartet, International Contemporary Ensemble, Loadbang Ensemble, Eclipse Quartet, Hub New Music, LAMNTH, and the San Diego Symphony performers. She has been featured in festivals such as Mostly Mozart, Ojai Music Festival, Long Beach Opera, Hear Now Festival, LACMA music series, Tehran Contemporary Music Festival, Banff Centre for Arts and Creativity, Festival POTE, Angel City Jazz Festival, Sled Island Festival. As an active Kamancheh performer and researcher, Niloufar has conducted lecture performances and residencies on Kamancheh performance and extended techniques at institutions including Pomona College, Stanford University, University of California San Diego, University of California Irvine, North Carolina State University, Tehran Azad University, Longy School of Music, Seoul Institute of the Arts, and Jordan Center for Persian Studies. Niloufar holds degrees from the University of California, San Diego in music composition, and the University of California, Irvine, where she studied composition and Integrated Composition, Improvisation, and Technology (ICIT). She has a strong foundation in Traditional Iranian music, having graduated from the Tehran Music Conservatory. During her time at UC Irvine, she served as a Research Assistant focusing on a new pedagogical approach to learning Radif and developing a website, Pish-radif.com, aimed at teaching the Iranian musical systems in Radif. This research was supported by the National Endowment for the Arts (NEA). Niloufar is currently pursuing her PhD in composition at the University of Minnesota. FREE Open to the Public"
