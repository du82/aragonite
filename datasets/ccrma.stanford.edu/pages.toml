["https://ccrma.stanford.edu/course-overviews/101"]
title = "Music 101 | CCRMA"
description = """
Course Description:                         Introduction to Creating Electronic Sounds is a beginner level course  that is designed to enable students from a wide variety of backgrounds  in the exploration of creative studies in electronic sound. The course  will survey some of the basic concepts and techniques used to produce  electronic music, while examining historical, social, and technological  occurrences as they relate to the production of electronic sound  beginning in the late 19th century. Weekly reading, listening, and media  assignments will act as a catalyst for group discussion and the  critical analysis of theoretical and conceptual approaches to  composition using electronically-based audio. Throughout  the quarter students will build upon the practical and conceptual  skills necessary to evaluate and produce a portfolio of audio-based  works. Creative assignments will be produced outside of class  time and will in run parallel to historical and theoretical group  discussions. Upon completion of each creative assignment, students will  receive critical feedback on their work. In addition to receiving  critical feedback during class time, students are expected to attend  bi-monthly meetings with their assigned feedback groups. Feedback groups  will be assigned during week three, after registration is finalized."""
full_description = "Course Title: Introduction to Creating Electronic Sounds Instructor: Stephanie Sherriff Course URL: https://ccrma.stanford.edu/wp/101/ Course Description: Introduction to Creating Electronic Sounds is a beginner level course that is designed to enable students from a wide variety of backgrounds in the exploration of creative studies in electronic sound. The course will survey some of the basic concepts and techniques used to produce electronic music, while examining historical, social, and technological occurrences as they relate to the production of electronic sound beginning in the late 19th century. Weekly reading, listening, and media assignments will act as a catalyst for group discussion and the critical analysis of theoretical and conceptual approaches to composition using electronically-based audio. Throughout the quarter students will build upon the practical and conceptual skills necessary to evaluate and produce a portfolio of audio-based works. Creative assignments will be produced outside of class time and will in run parallel to historical and theoretical group discussions. Upon completion of each creative assignment, students will receive critical feedback on their work. In addition to receiving critical feedback during class time, students are expected to attend bi-monthly meetings with their assigned feedback groups. Feedback groups will be assigned during week three, after registration is finalized. HomeNews and EventsAll EventsCCRMA ConcertsColloquium SeriesDSP SeminarsHearing SeminarsGuest LecturesEvent CalendarEvents Mailing ListRecent NewsAcademicsCoursesCurrent Year Course ScheduleUndergraduateMastersPhD ProgramVisiting ScholarVisiting Student ResearcherWorkshops 2024ResearchPublicationsAuthorsKeywordsSTAN-MMax Mathews PortraitResearch GroupsSoftwarePeopleFaculty and StaffStudentsAlumniAll UsersUser GuidesNew DocumentationBooking EventsCommon AreasRoomsSystemResourcesPlanet CCRMAMARLBlogsOpportunitiesCFPsAboutThe KnollRenov