ducators Only* Creative and Equitable Practices in Remote Music Education Date: Thu, 03/04/2021 - 3:30pm - 5:30pm Location: Zoom, link provided by RSVP (limited registration) Event Type: Colloquium CCRMA, and the JackTrip Foundation present: Creative and Equitable Practices in Remote Music Education Hosted by Alex Chechile, CCRMA Postdoc *Open to K-12 Music Educators Only* 1 of 14 ››"
