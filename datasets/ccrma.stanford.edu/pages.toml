["https://ccrma.stanford.edu"]
title = "Center for Computer Research in Music and Acoustics | CCRMA"
description = "Multi-disciplinary facility where composers and researchers use computer-based technology as an artistic medium and as a research tool."
full_description = '''CCRMA WAVE (Wall for AudioVisual Expression) presents CCRMA's 2024 MA/MST Cohort: In Coherence Upcoming Events Stephen de Filippo and Delong Wang | Composition Forum Date: Tue, 02/18/2025 - 5:00pm - 7:00pm Location: CCRMA Stage / Zoom Event Type: Other The Graduate Composition Forum presents Stephen de Filippo and Delong Wang as part of the UCSD x Stanford Composition Student Exchange. FREE and Open to the Public | In Person + Zoom Frontiers in generative speech modeling: binaural, long-form, and beyond Date: Fri, 02/21/2025 - 10:30am - 12:00pm Location: CCRMA Seminar Room Event Type: Hearing Seminar Deep neural networks (DNNs) have made great strides in generating speech from text. All the more amazing because they generate actual waveform samples that sound good. Julian Salazar (Google Deep Mind) will talk about his work on not only generating long-form speech from text, but creating a binaural signal so the voices are properly spatialized. Who: Julian Salazar (Google DeepMind) What: Frontiers in Generative Speech Modeling: Binaural, Long-form, and Beyond When: Friday, February 21 at 10:30AM Where: CCRMA Seminar Room Why: How do we create speech, from text, and spatialize it? Come to CCRMA to hear the latest on synthetic speech from a real speaker. FREE Open to the Public Niloufar Shiri and Jessica Kenney at Stanford Date: Tue, 02/25/2025 - 7:30pm - 9:00pm Location: CCRMA Stage Event Type: Concert Niloufar Shiri, Iranian kamancheh player and composer, begins her residency at Stanford University with a concert featuring her duo with Jessica Kenney, perofrming works written for the kamancheh and electronics. They will present new compositions and improvisations for voices, kamancheh, electronics, and field recordings. their work draws on Bedahe (بداهه) music and dialogues on poetry, translation, and collective liberation. "Slowly on the surface, that the flower may awaken from the pulse of the breath" —Bidel Dehlavi FREE Open to the Public Niloufar Shiri x Stanford Graduate Composers Date: Sun, 03/02/2025 - 7:30pm - 8:30pm Location: CCRMA Stage Event Type: Concert Niloufar Shiri concludes her residency with a concert featuring five new compositions by Stanford Graduate composers, specifically written and developed for the kamancheh. Works by: Celeste Betancur, Brian Brown, Kimia Koochakzadeh-Yazdi, Nick Shaheed, and Mercedes Montemayor Elosua FREE Open to the Public Nathan Corder and Matthew Monaco | Composition Forum Date: Tue, 03/04/2025 - 5:00pm - 8:00pm Location: CCRMA Stage / Zoom Event Type: Other The Graduate Composition Forum presents Nathan Corder and Matthew Monaco as part of the UC Berkeley x Stanford Composition Student Exchange. Nathan and Matthew will speak about their work, after which they will each perform a live set of their music. 5pm Presentations | 7pm Performances | FREE and Open to the Public | In Person + Zoom 1 of 2 ›› Recent Events CCRMA Winter Concerts 2025 Date: Fri, 02/14/2025 - 7:30pm - 9:30pm Date: Sat, 02/15/2025 - 7:30pm - 9:30pm Location: CCRMA Stage / CCRMA LIVE Event Type: Concert CCRMA celebrates the winter season with two ear-warming concerts in the Stage. Students, faculty, staff, and guest artists will present live performances, fixed media electronic music, and audiovisual works. Each evening’s program will feature different artists. FREE and Open to the Public | In Person + Livestream Manaswi Mishra | AI Lutherie for Live Performances (Workshop) Date: Fri, 02/14/2025 - 12:00pm - 2:00pm Location: CCRMA Classroom Event Type: Guest Lecture Abstract: FREE Open to the Public Invariances in the Structure of Musical Spaces and Applications to Keyboard Design Date: Wed, 02/12/2025 - 5:30pm - 7:00pm Location: CCRMA Classroom / Zoom Event Type: Guest Colloquium Abstract FREE Open to the Public Cynthia Moss - Neural codes for representing object distance in echolocating bats Date: Mon, 02/10/2025 - 4:00pm - 5:00pm Location: Stanford Neurosciences Building | Gunn Rotunda (E241) Event Type: Hearing Seminar How is auditory information represented in the brain? All that rich information that we hear turns into new knowledge and pleasure. It all spikes, top to bottom, soup to nuts, but what do these spikes mean? How is our world represented? Sneak preview: It’s not just a matter of how often neurons fire! FREE Open to the Public 1 of 9 ›› Past Live Streamed Events CCRMA Vimeo Channel Recent News David Braun & Ge Wang discuss Faust and ChucK with TouchDesigner derivative.ca/event/touchdesigner-insession-180-david-braun-ge-wang/65762 DEG Presents Hedy Lamarr Award to Dolby Laboratories’ Chief Scientist Poppy Crum Poppy Crum Joins Advisory Board for Engineering & Technology Magazine's Innovation Awards Congratulations to Poppy Crum for joing the Advisory Board for the Engineering & Technology Magazine's Innovation Awards! Check out the interview here, in which she discusses her path from a professional violinist to her position today as a neuroscientist and technologist. JackTrip: Syncing performances online, Stanford News "Stanford-developed software enables musicians isolated by the coronavirus pandemic to jam together again in real-time ... A longstanding software program for online music playing has been optimized for slower, home-based internet connections." https://news.stanford.edu/2020/09/18/jacktrip-software-allows-musicians-sync-performances-online/ By Adam Hadhazy The Curious Composer: Jonathan Berger A Q & A with Jonathan Berger is featured in the September/October edition of Psychology Today. Check out the article in the PDF attached. Congratulations, Jonathan! File Attachment: JBergerInterview 1 of 18 ››'''
