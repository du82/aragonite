["https://ccrma.stanford.edu/courses/422/index.htm"]
title = "Music 422 : Perceptual Audio Coding"
full_description = 'Did you ever wonder how your MP3 files squeeze so much sound into such a small size file? What the difference is between MP3 and AAC? Or which multichannel audio coding format is best for your application? The need for significant reduction in data rate for wide-band digital audio signal transmission and storage has led to the development of psychoacoustics-based data compression techniques. By using this approach we can exploit the limitations of human hearing to remove inaudible components of audio signals. The degree of bit rate reduction achievable without sacrificing perceived quality using these methods greatly exceeds that possible using lossless techniques alone. Perceptual audio coders are currently used in many applications including digital radio and television, digital sound on film, multimedia/internet audio, mobile devices. This class integrates digital signal processing, psychoacoustics, rate/distortion optimization, and programming to provide the basis for understanding and building perceptual audio coding systems. We review the basic principles underlying all the core components of a perceptual audio codec and study the design choices applied in state-of-the-art audio coding schemes, e.g., AC-3 (Dolby Digital), Enhanced AC-3, AC-4; MPEG Layers I, II, and III (MP3); MPEG AAC; and MPEG-H. In-class demonstrations will allow students to hear the quality of state-of-the-art implementations at varying data rates and, as a final project, you will program your own simple perceptual audio coder. The Winter 2025 schedule, subject to updates, is available on CANVAS. Required readings from the course textbook: M. Bosi & R.E. Goldberg, "Introduction to Digital Audio Coding and Standards", Springer, 2003, ISBN: 978-1-4020-7357-1. Students with a disability that may necessitate an academic accommodation or the use of auxiliary aids and services in class must initiate the request with the Student Disability Resource Center (SDRC). Please contact the SDRC as soon as possible; timely notice is needed to arrange for appropriate accommodations.'
author = "Marina Bosi"
