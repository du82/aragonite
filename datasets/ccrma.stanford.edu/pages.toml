["https://ccrma.stanford.edu/events/frontiers-in-generative-speech-modeling-binaural-long-form-and-beyond"]
title = "Frontiers in generative speech modeling: binaural, long-form, and beyond | CCRMA"
description = "Multi-disciplinary facility where composers and researchers use computer-based technology as an artistic medium and as a research tool."
full_description = '''Date: Fri, 02/21/2025 - 10:30am - 12:00pm Location: CCRMA Seminar Room Event Type: Hearing Seminar Deep neural networks (DNNs) have made great strides in generating speech from text. All the more amazing because they generate actual waveform samples that sound good. Julian Salazar (Google Deep Mind) will talk about his work on not only generating long-form speech from text, but creating a binaural signal so the voices are properly spatialized. Who: Julian Salazar (Google DeepMind) What: Frontiers in Generative Speech Modeling: Binaural, Long-form, and Beyond When: Friday, February 21 at 10:30AM Where: CCRMA Seminar Room Why: How do we create speech, from text, and spatialize it? Come to CCRMA to hear the latest on synthetic speech from a real speaker. Frontiers in generative speech modeling: binaural, long-form, and beyond Julian Salazar (Google DeepMind) Abstract: This talk will first overview the generative methods underlying recent progress in end-to-end speech modeling, from neural audio codecs and semantic speech tokens to efficient resynthesis of audio. I'll then present two recent works at Google built atop these principles---ZeroBAS [1], the first zero-shot neural method for mono-to-binaural synthesis; and SpeechSSM [2], the first "language model" for expressive long-form speech---and motivate how these directions along with auditory perception tie into emerging topics in neural audio generation. [1] https://research.google/blog/zero-shot-mono-to-binaural-speech-synthesis/ [2] https://google.github.io/tacotron/publications/speechssm/ Bio: Julian Salazar is a Senior Research Scientist in the Foundational Research unit at Google DeepMind in Mountain View, CA, where he works on generative speech and audio for Google's Gemini models and other audio-native experiences. Before this, he worked at AWS AI Labs for over 5 years, where he did research and development of acoustic and language models for speech recognition. Julian has a degree in Mathematics from Harvard University. FREE Open to the Public'''
