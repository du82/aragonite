["https://ccrma.stanford.edu/events/niloufar-shiri-and-jessica-kenney-stanford"]
title = "Niloufar Shiri and Jessica Kenney at Stanford  | CCRMA"
description = "Multi-disciplinary facility where composers and researchers use computer-based technology as an artistic medium and as a research tool."
full_description = '''Date: Tue, 02/25/2025 - 7:30pm - 9:00pm Location: CCRMA Stage Event Type: Concert Niloufar Shiri, Iranian kamancheh player and composer, begins her residency at Stanford University with a concert featuring her duo with Jessica Kenney, perofrming works written for the kamancheh and electronics. They will present new compositions and improvisations for voices, kamancheh, electronics, and field recordings. their work draws on Bedahe (بداهه) music and dialogues on poetry, translation, and collective liberation. "Slowly on the surface, that the flower may awaken from the pulse of the breath" —Bidel Dehlavi Niloufar Shiri is a freelance kamancheh player, composer, and improviser born and raised in Tehran, Iran. Her work bridges the traditional, experimental, and Bedahe (بداهه) music, weaving them into a singular musical language. Rooted in the Radif (the classical Persian music repertoire), Shiri’s music navigates the textural and timbral spaces of an instrument’s harmonic and sonic properties. Drawing inspiration from the intervallic relationships and pitch settings of traditional Iranian music, she analyzes and incorporates the spectral qualities of these extended intervals, uncovering their latent possibilities. Her compositions explore the dynamic interplay of tones and challenge conventional instrumental functions, where each attack and vibration—shaped by its surrounding sonic periphery—unfolds into a rich spectrum of extended sonic possibilities. Shiri has composed solo works as well as pieces for small ensembles and orchestras. She is actively collaborating with artists such as Jessika Kenney, Antonin Fajt, Jennifer Curtis, Kyle Motl, and Chatori Shimizu. Additionally, she has worked on installations and projects with Farahnaz Hatam Her recent album, OSHI, is a collaboration with Isaac Otto, an L.A.-based composer and multi-woodwind performer, released on Infrequent Seams. Jessika Kenney is a sound and voice artist, composer, teacher, and writer born on Sp'q'n'i?/Spokane lands (www.native-land.ca). Her vocal background spans from punk and jazz roots into geomusicalities, based in long-term study of Indonesian vocal practices and the singing of Classical Persian poetry and radifs with Ostad Hossein Omoumi, combined with her collaborations in electronic music, metal, and recent work centered around the Spokane River. As a composer Kenney has written for solo voices, small ensembles, traditional Javanese gamelan, traditional Korean ensembles, choirs, orchestras, and sound/video installation. Her recordings includes ATRIA, on the SIGE label, as well as many records in the duo with composer/violist Eyvind Kang including ‘Azure’, 'the face of the earth' and 'Aestuarium' on Ideologic Organ. She has recorded as a vocalist for Sarah Davachi, Alvin Lucier, and the PAN project, as well as performing the vocal music of Scelsi, Feldman, and Cage. Jessika has collaborated with many musical gems including Lori Goldston, Holland Andrews, and Niloufar Shiri. Kenney is a student of Indonesian and Persian languages. FREE Open to the Public'''
