description = "Multi-disciplinary facility where composers and researchers use computer-based technology as an artistic medium and as a research tool."
full_description = "Date: Fri, 02/14/2025 - 12:00pm - 2:00pm Location: CCRMA Classroom Event Type: Guest Lecture Abstract: In our world of rapidly accelerating synthetic media, the outputs of generative AI often leave us feeling frustrated, amused, and even manipulated. Early examples of creative AI tools struggle to go beyond imitating styles and patterns, producing a context-less blend of borrowed aesthetics from the datasets they’re trained on. This race to the statistically average flattened aesthetic, misunderstands the core goals of creative expression. In contrast, Audio developers and Instrument builders (you!) understand the importance of providing a toolkit of exploration, intentional serendipity and discovery to a new age of artists performing with AI. In this session, I will share lessons from AI Lutherie for live performances in Opera, Symphony performances and Installations to workshop guidelines for New Interfaces for ‘AI’ musical Interface design. Bio: Manaswi Mishra is a LEGO Pappert Fellow and a current PhD candidate in the Opera of the Future group, MIT Media Lab. His research explores strategies and frameworks for a new age of composing, performing and learning music using A.I. centered on bespoke human intent. His AI instruments have been featured in Opera and Symphony performances like VALIS (2023), Brain Opera (2022), Flow Symphony (2024). His work has been published and exhibited in the MIT Press, Harvard Tech Review, Washington Post, Boston Globe, Conferences of Computational Creativity, ISEA Brisbane, IFA Stuttgart, CVPR 2024, Burning Man 2023, Copyright Society 2023, Bloomberg Law, Seoul Arts Center, etc. Manaswi is also a founding instigator of the Music Tech Community in India and has organized workshops, hackathons and community events to foster a future of music and technology in his home country. FREE Open to the Public HomeNews and EventsAll EventsCCRMA ConcertsColloquium SeriesDSP SeminarsHearing SeminarsGuest LecturesEvent Calendar