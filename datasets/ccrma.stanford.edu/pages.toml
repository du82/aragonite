["https://ccrma.stanford.edu/events/nathan-corder-and-matthew-monaco-composition-forum"]
title = "Nathan Corder and Matthew Monaco | Composition Forum | CCRMA"
description = "Multi-disciplinary facility where composers and researchers use computer-based technology as an artistic medium and as a research tool."
full_description = "Date: Tue, 03/04/2025 - 5:00pm - 8:00pm Location: CCRMA Stage / Zoom Event Type: Other The Graduate Composition Forum presents Nathan Corder and Matthew Monaco as part of the UC Berkeley x Stanford Composition Student Exchange. Nathan and Matthew will speak about their work, after which they will each perform a live set of their music. 5pm Presentations | 7pm Performances | FREE and Open to the Public | In Person + Zoom Nathan Corder Abstract My presentation will explore the role of feedback—audio, data, and behavioral—in shaping my compositional and improvisational practice. By designing models of behaviors, potentials, and interactions within the PureData programming environment, I have developed feedback processes and networks that serve as the foundation of my compositional thinking and decision-making. I will discuss how my patches, as the central locus of my compositional decision making, have evolved to produce sonic results that now function as scores in my recent work. Additionally, I will reflect on how these scores inform new creative strategies and modes of performance. Bio Nathan Corder is an Oakland-based composer of works for electronics, objects, and arrays of people. Corder’s music has been honored and programmed at events such as the International Symposium of New Music (Brazil), Le festival International des Arts Sonores EXHIBITRONIC (Strasbourg), MUSLAB (Mexico City), Echofluxx (Czech Republic), SF Tape Music Festival, mise-en music festival, NUNC!3, NYC Electroacoustic Music Festival, N_SEME, Root Signals, the Yarn/Wire Institute, and SEAMUS. He received the Elizabeth Mills Crothers Award for music composition in 2018 from Mills College. In 2014, Nathan was awarded the Allen Strange Memorial award from SEAMUS. His music has been described as both “something in common with the act of sowing seeds, digging, dragging, foraging, and repeating the process” (Toneshift), and “dizzyingly kinetic sonic events that constantly interlock and overlap… extreme computer music” (Noise Not Music). Active as a composer-performer and improviser on custom-designed electronics and guitar, Corder has collaborated with artists such as Roscoe Mitchell, William Winant, Jaap Blonk, Jack Wright, and Barbara Golden. He is also an active member of the bands TONED, monopiece, and Jitters. Matthew Monaco Abstract My talk will focus on the evolving role of improvisation and transcription in my recent work. Specifically, I will examine the interaction between my longstanding engagement with fragmented, microscopic musical material, and spontaneous, idiomatic redefinitions of such material. My presentation will draw from completed works from 2021-2024, as well as a work in progress for ensemble. In discussing musical examples, I will illustrate some of my views on intuitive orchestration and re-orchestration using perceptual descriptors, building upon Lachanmann’s theory of sound types and Narmour’s theory of melodic profiles. Bio Matthew Monaco (b.1997) is a composer of acoustic and electroacoustic music. He is currently a Ph.D. candidate at the University of California, Berkeley. In 2022, Matthew received his master’s degree from the Conservatoire de Paris (CNSMDP), where he studied composition with Stefano Gervasoni and electronic music with Yan Maresz, Luis Naon, et Grégoire Lorieux. In May 2020, he received his Bachelor of Music from the New England Conservatory, where he studied with Stratis Minakakis, minoring in music theory. His works have been performed in the United States and Europe by groups such as Ensemble intercontemporain, Ensemble l’Itinéraire, Ensemble Court-circuit, the Callithumpian Consort, the Del Sol Quartet, the Brouwer Trio, members of Ensemble Linea, among others."
