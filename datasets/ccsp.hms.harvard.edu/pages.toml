["https://ccsp.hms.harvard.edu"]
title = "CCSP | The Center for Cancer Systems Pharmacology"
description = "The Center for Cancer Systems Pharmacology (CCSP) studies responsiveness and resistance to anti-cancer drugs."
full_description = "The Center for Cancer Systems Pharmacology (CCSP) studies responsiveness and resistance to anti-cancer drugs. How can we identify patients who will benefit from specific anti-cancer medicines and how can side-effects be minimized? Why do only some tumors respond to drugs, and why do those that do respond frequently become drug resistant? How should the choice between chemotherapy, targeted therapy and immunotherapy be made to optimize treatment for individual patients? Our team is attempting to answer these questions using precision medicine approaches that combine laboratory experiments, computation, and clinical research. The Center is committed to training students and postdocs, promoting junior faculty and ensuring that data and software are reproducible, reliable and publicly accessible. Funding: The Center for Cancer Systems Pharmacology at Harvard Medical School is an NCI Cancer Systems Biology Center of Excellence funded by grant U54-CA225088 entitled “Systems Pharmacology of Therapeutic and Adverse Responses to Immune Checkpoint and Small Molecule Drugs” Featured Publications Drug independence and the curability of cancer by combination chemotherapy. Pomeroy, Schmidt, Sorger, Palmer. 2022 Trends Cancer Oncometabolite d-2HG alters T cell metabolism to impair CD8+ T cell function. Notarangelo...Haigis. 2022 Science Single-sequence protein structure prediction using a language model and deep learning. Chowdhury, Bouatta, Biswas, Floristean...AlQuraishi. 2022 Nat Biotechnol Design principles to assemble drug combinations for effective tuberculosis therapy using interpretable pairwise drug response measurements. Larkins-Ford, Degefu... Aldridge. 2022 Cell Rep Med News, Events, & Updates"
