title = "CCSP | Projects"
description = "The Center for Cancer Systems Pharmacology (CCSP) studies responsiveness and resistance to anti-cancer drugs."
full_description = "Projects The Harvard Medical School-based Center for Cancer Systems Pharmacology is an NCI Cancer Systems Biology Center of Excellence that studies responsiveness and resistance to anti-cancer drugs. The Center focuses on targeted small molecule therapies and newly emerging immune checkpoint inhibitors (ICIs), two cornerstones of precision cancer medicine. Center members are trying to identify which patients will benefit from each class of drugs and why cancers that are initially drug-sensitive often become resistant. The Center also studies drug toxicity, with the aim of reducing the burden of therapy for individual patients. Our research is performed using a mix of experimental and computational approaches and follows a bedside to bench and bench to bedside paradigm. We are committed to the generation of reproducible and publicly accessible data and to open-source software. The Center for Cancer Systems Pharmacology involves three inter-linked research projects, a systems pharmacology core, and multiple education and outreach activities. Project 1 Multi-scale modeling of adaptive drug resistance in BRAF-mutant melanoma. We construct computational models that capture and ultimately explain the origins of responsiveness and resistance to RAF/MEK inhibitors in melanoma. This class of drugs (which includes vemurafinib, dabrafenib, cobimetinib, and trametinib) represents a triumph of targeted cancer medicine and often induces dramatic tumor shrinkage in patients with BRAF mutant melanoma. However, response is usually transitory and many individuals develop drug-resistant, resurgent disease. We are attempting to understand the initial steps in the emergence of resistance, which are based on reversible adaptive changes in tumor cells, as well as the contributions of adaptive resistance to the emergence of fully resistant tumor cell clones. The projects involves collecting time-series single-cell and population-level data from cells with diverse genotypes followed by temporally resolved modeling using differential equations, logic-based models, and supervised machine learning. These studies are performed primarily in cell lines and mouse models but are informed by data from patients. Kinetic modeling of adaptive drug resistance in BRAF-mutant cancers. A) Adaptive ERK reactivation in BRAF-mutant melanoma, thyroid and colorectal cancers. B) Structure of the kinetic model explaining adaptive ERK reactivation in BRAF-mutant cancers. C) Simulations predicting the efficacy of different classes of RAF inhibitors (1st generation, paradox breaker and pan-RAF inhibitors) on adaptive ERK reactivation. Project 2 Measuring and modeling the tumor and immune microenvironment before and during therapy and at the time of drug resistance. Nascent tumors are under continuous surveillance by the immune system and suppression of this surveillance is one of the key steps in the development of malignancy. Drugs acting as immune checkpoint inhibitors (ICIs) restore anti-tumor immunity and result in very durable responses (potentially even cures) in some diseases. The key to understanding why ICIs work in some tumor types and not others is understanding a complex tumor milieu (the tumor microenvironment; TME) in which tumor, stromal and immune cells interact. We are exploiting highly multiplexed imaging methods to immuno-profile tumors from patients before and after treatment with ICIs or other therapeutic drugs. The precise proportions and spatiotemporal arrangements of tumor, stromal and immune cells are being measured in tissue biopsies, and single-cell features extracted and associated with disease progression and therapeutic response using machine learning, deep learning and high-dimensional data analysis. Adverse responses in the skin and gut are also being investigated and compared to therapeutic responses at a mechanistic and clinical level. In this case, the aim is to reduce the burden of ICI therapy on individual patients. A multiple recurrent meningioma before and after nivolumab treatment. Radiographic assessment (A-D: MRI). Multiplexed tissue imaging of the tumor immune microenvironment using cyclic immunofluorescence (t-CyCIF) in surgically resected tissue samples before (E) and after (F) nivolumab treatment (G, H: t-CyCIF quantification). JCO Precis Oncol. 2018. Project 3 Mechanisms of immunotherapy action. Animal models, primarily syngeneic and genetically engineered mice, are essential for understanding immune checkpoint mechanisms and the drugs that targets these mechanisms. Only in animals is it possible to differentiate between genetic and non-genetic factors influencing immune cell-tumor recognition and test specific mechanistic hypotheses. We use ICIs administered alone or in combination in tumor-bearing mice to evaluate whether highly efficacious responses arise from co-targeting cells of single lineages (e.g. CD8+ effector T cells) or from concurrent targeting of multiple cell lineages (e.g. CD8+ T cells, regulatory T cells), and to identify the tumor settings in which either strategy might prove more effective. Metabolic, signaling, and transcriptional changes associated with cellular responses to ICIs will be assessed and modeled. Agent-based models are used to study non-cell autonomous mechanisms that mediate the therapeutic effects of checkpoint inhibitors, and novel strategies for combining agents that augment efficacy without increasing toxicity will be identified."
year_published = 2025
year_updated = 2019
