full_description = "January 23, 2025 CDC Organization and Leadership At a glance Overview of the structure of CDC’s Centers, Offices, and Institutes and leadership biographies for each. Organizational Structure CDC is one of the major operating components of the Department of Health and Human Services. View CDC's Official Mission Statements/Organizational Charts to learn more about CDC's organizational structure. Download or Print CDC Organization Chart CDC Federal Advisory Committees Information Federal advisory committees are a key component of CDC's overall strategy to achieve stakeholder and public engagement in its efforts and commitment to improve people's health. Learn More About FAC Immediate Office of the Director and Leadership CDC Director Principal Deputy Director Deputy Director for Program and Science/Chief Medical Officer Deputy Director for Policy, Communications, and Legislative Affairs/Chief Strategy Officer Chief Operating Officer Chief of Staff CDC Centers and Institute and Leadership Center for Forecasting and Outbreak Analytics (CFA) Global Health Center (GHC) National Center on Birth Defects and Developmental Disabilities (NCBDDD) National Center for Chronic Disease Prevention and Health Promotion (NCCDPHP) National Center for Emerging and Zoonotic Infectious Diseases (NCEZID) National Center for Environmental Health (NCEH)/ Agency for Toxic Substances and Disease Registry (ATSDR) National Center for Health Statistics (NCHS) National Center for HIV, Viral Hepatitis, STD, and TB Prevention (NCHHSTP) National Center for Immunization and Respiratory Diseases (NCIRD) National Center for Injury Prevention and Control (NCIPC) National Center for State, Tribal, Local, and Territorial Public Health Infrastructure and Workforce (NCSTLTPHIW) National Institute for Occupational Safety and Health (NIOSH) CDC Offices and Leadership CDC Washington Office (CDC/W) Office of Budget Policy and Appropriations (OBPA) Office of Communications (OC) Office of the Chief Operating Officer (OCOO) Office of the Chief of Staff (OCS) Office of Equal Employment Opportunity (OEEO) Office of Health Equity (OHE) Office of Laboratory Systems and Response (OLSR) Office of Policy, Performance, and Evaluation (OPPE) Office of Public Health Data, Surveillance, and Technology (OPHDST) Office of Readiness and Response (ORR) Office of Science (OS) On This Page Organizational Structure CDC Federal Advisory Committees Information Immediate Office of the Director and Leadership CDC Centers and Institute and Leadership CDC Offices and Leadership January 23, 2025 Sources Print Share Facebook LinkedIn Twitter Syndicate Content Source: Centers for Disease Control and Prevention"
