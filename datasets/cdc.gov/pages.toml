full_description = "September 18, 2024 NCIRD Divisions and Offices At a glance Learn more about NCIRD's organizational structure. Find additional information about each office and division within NCIRD. Office of the Director (OD) OD oversees, coordinates, and evaluates activities across NCIRD, and collaborates with its divisions to advance strategic priorities, which include: Data modernization Advancing health equity Operations across science, program, policy, and communication Financial and human capital management Leadership and organization National Center for Immunization and Respiratory Diseases (NCIRD) Demetre Daskalakis, MD, MPH NCIRD Organizational Chart A visual representation of NCIRD divisions and teams. Download Download Division of Bacterial Diseases (DBD) DBD's mission is to prevent and control illness and death from vaccine-preventable and other respiratory bacterial diseases in the U.S. and worldwide. Keep Reading: About the Division of Bacterial Diseases Division of Viral Diseases (DVD) DVD's mission is to prevent disease, disability, and death from viral diseases through immunization and other prevention measures. Additionally, DVD collaborates with domestic and international partners in response to outbreaks, surveillance, and other public health activities. Keep Reading: About the Division of Viral Diseases Immunization Services Division (ISD) The mission of ISD is to protect people across their lifespan from vaccine-preventable diseases by equitably increasing access, confidence, and demand for vaccines. The division also engages in provider and public education, evaluation, and research. Activities include the administration of: Vaccines for Children Program and Section 317 immunization grants Technical support and funding for immunization information systems Training and education Research to improve vaccine delivery and uptake Program effectiveness evaluation Keep Reading: About the Immunization Services Division Influenza Division (ID) ID's mission is to advance the global control and prevention of seasonal and novel influenza (flu). The division aims to improve influenza pandemic preparedness and response through surveillance, vaccination, and other intervention strategies. ID provides scientific and programmatic leadership for the detection, prevention, and control of influenza domestically and internationally. Keep Reading: About the Influenza Division Coronavirus and Other Respiratory Viruses Division (CORVD) CORVD's mission is to improve public health by preventing illness, disability, and death from respiratory viruses. The Division works to achieve this goal through excellence in public health science and practice in the United States and worldwide. Activities include: Tracking and studying viruses via laboratory and epidemiologic studies Communicating effective vaccine and prevention strategies Domestic and global respiratory virus surveillance Keep Reading: About Coronavirus and Other Respiratory Viruses Division On This Page Office of the Director (OD) Division of Bacterial Diseases (DBD) Division of Viral Diseases (DVD) Immunization Services Division (ISD) Influenza Division (ID) Coronavirus and Other Respiratory Viruses Division (CORVD) September 18, 2024 Sources Print Share Facebook LinkedIn Twitter Syndicate Content Source: National Center for Immunization and Respiratory Diseases (NCIRD); About NCIRD; NCIRD Divisions and Offices"
