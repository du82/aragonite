["https://cdc.gov/overdose-prevention/prevention/index.html"]
title = "Preventing Opioid Overdose | Overdose Prevention | CDC"
description = "Stigma or the fear of stigma may stop someone from sharing their health condition with partners or family members. Stigma may come from a specific person, including a loved one or clinician, or from the larger community. People seeking treatment for OUD may find that some clinicians have stigmatizing attitudes about OUD. Stigmatizing attitudes toward people with OUD among clinicians can create barriers for those seeking the health services they need.1 People who experience health-related stigma may also experience less access to treatment or reduced adherence to treatments.2 Learn more about what you can do to reduce stigma."
full_description = '''May 8, 2024 Preventing Opioid Overdose What to know Overdoses are the leading injury-related cause of death in the United States. Opioids, mainly illegally made fentanyl, are involved in the highest percentage of overdose deaths. Ways to prevent opioid overdose are to improve opioid prescribing, reduce exposure to opioids, prevent illegal opioid use and prescription opioid misuse, and treat opioid use disorder. Opioid use disorder and overdoses are preventable When we act early, we can prevent illegal substance use, including illegal opioids, and misuse of prescription medications, like opioids, that can lead to substance use disorders. Substance use disorders, like opioid use disorder (OUD), impact communities across America. Prevention activities help educate and support individuals, families, and communities and are critical for maintaining both individual and community health. Opioid Use Disorder (OUD), sometimes referred to as "opioid dependence" or "opioid addiction," is a problematic pattern of opioid use that causes significant impairment or distress. OUD is a medical condition that can affect anyone – regardless of race, gender, income level, or social class. Like many other medical conditions, evidence-based treatments are available for OUD, but seeking treatment remains stigmatized. Stigma can be a major barrier to how well prevention and treatment programs work amid the opioid crisis. Keep in mind‎ Stigma or the fear of stigma may stop someone from sharing their health condition with partners or family members. Stigma may come from a specific person, including a loved one or clinician, or from the larger community. People seeking treatment for OUD may find that some clinicians have stigmatizing attitudes about OUD. Stigmatizing attitudes toward people with OUD among clinicians can create barriers for those seeking the health services they need.1 People who experience health-related stigma may also experience less access to treatment or reduced adherence to treatments.2 Learn more about what you can do to reduce stigma. OUD significantly contributes to overdose deaths among people who use illegal opioids or misuse prescription opioids. Opioids—mainly synthetic opioids like illegally made fentanyl--are currently the most represented in overdose deaths. A recent study among 29 states and the District of Columbia showed the percentage of overdose deaths involving counterfeit pills more than doubled from July 2019 to December 2021, and more than tripled in the Western United States. These pills are dangerous because they typically appear as pharmaceutical pills but often contain illegally made fentanyl and illegal benzodiazepines or other drugs, with or without people's knowledge. For every overdose that results in death, there are many more nonfatal overdoses, each one with its own emotional and economic toll.3 OUD and overdose deaths continue to be a major public health concern in the United States, but they are preventable. People can help reduce the risk of counterfeit pill overdose by: Only taking pills prescribed to them Being aware that pills bought illegally might contain highly potent drugs Using fentanyl test strips (FTS), small strips of paper that can detect the presence of fentanyl in all different kinds of drugs (cocaine, methamphetamine, heroin, etc.) and drug forms (pills, powder, and injectables) Get the facts Overdoses are the leading injury-related cause of death in the United States and appear to have accelerated during the COVID-19 pandemic.4 In 2022, 107,941 people died from drug overdoses, which equates to 296 overdoses each day.5 Among the 2022 overdose deaths, nearly 76% involved an opioid.5 Research shows that people who have had at least one overdose are more likely to have another.6 In 2022, an estimated 54.6 million Americans needed substance use disorder treatment, but only 13.1 million people with a substance use disorder in the past year received treatment.7 International Overdose Awareness Day‎ On August 31 of each year, International Overdose Awareness Day (IOAD) is recognized globally as a day to remember and grieve those that we've lost, take action to encourage support and recovery, and help end overdose by spreading awareness about drug overdose prevention. Join us as an IOAD partner by using your voice and platforms to spread messages about ending overdose. International Overdose Awareness Day is a day to remember those lost to overdose, acknowledge the grief of loved ones left behind, and work to end overdose injury and death.Show More Promising prevention strategies Ways to prevent opioid overdose are to improve opioid prescribing, reduce exposure to opioids, prevent illegal opioid use and prescription opioid misuse, and treat opioid use disorder. There are strategies that can help prevent overdose and support the health and well-being of communities. Promote and support the use of the CDC Clinical Practice Guideline for Prescribing Opioids for Pain. Utilize prescription drug monitoring programs, which are state-run databases that track prescriptions for controlled substances and can help improve opioid prescribing, inform clinical practice, and protect those at risk. Learn about the risks of prescription opioids and about the help and resources that are available for someone who may be experiencing opioid use disorder. See CDC's Rx Awareness Campaign for shareable resources and information on improving awareness. Learn more about the dangers of illegally made fentanyl and ways to protect yourself and others, like using fentanyl test strips. Treat opioid use disorder by increasing access to substance use disorder treatment services, including Medications for Opioid Use Disorder (MOUD). Recovery is possible. Reverse overdose by expanding access to naloxone, a drug used to reverse an opioid overdose, for community members (family members and neighbors) and service providers (i.e., first responders). Help communities put effective practices to work by using evidence-based strategies [PDF] How to recognize an overdose‎ Recognizing an opioid overdose can be difficult. If you aren't sure, it is best to treat the situation like an overdose—you could save a life. Administer naloxone or another opioid overdose reversal medication (if available) and then call 911. Try to keep the person awake and breathing and lay the person on their side to prevent choking. Do not leave the person alone. Signs of an overdose may include:- Unconsciousness or inability to awaken- Slow or shallow breathing or difficulty breathing such as choking sounds or gurgling/snoring noise from a person who cannot be awakened- Discolored skin (especially in nails or lips)- Small, constricted "pinpoint pupils" that don't react to light Find treatment for substance use disorder, including opioid use disorder If you or someone close to you needs help for a substance use disorder, talk to your doctor or call SAMHSA's National Helpline at 1-800-662-HELP or go to SAMHSA's Behavioral Health Treatment Services Locator Additional resources: Find Local Health Centers Buprenorphine Treatment Practitioner Locator Opioid Treatment Program Directory Resources Overdose Prevention Overdose Data to Action Drug Free Communities Rx Awareness HHS Opioid Prevention Programs HHS Opioids Portal On This Page Opioid use disorder and overdoses are preventable Promising prevention strategies Resources May 8, 2024 Sources Print Share Facebook LinkedIn Twitter Syndicate Content Source: National Center for Injury Prevention and Control ReferencesElizabeth M. Stone, Alene Kennedy-Hendricks, Colleen L. Barry, Marcus A. Bachhuber, Emma E. McGinty, The role of stigma in U.S. primary care physicians’ treatment of opioid use disorder, Drug and Alcohol Dependence, Volume 221, 2021, 108627, ISSN 0376-8716, https://doi.org/10.1016/j.drugalcdep.2021.108627. Hadland, S. E., Park, T. W., & Bagley, S. M. (2018). Stigma associated with medication treatment for young adults with opioid use disorder: a case series. Addiction science & clinical practice, 13(1), 15. https://doi.org/10.1186/s13722-018-0116-2 Casillas SM, Pickens CM, Tanz LJ, et alEstimating the ratio of fatal to non-fatal overdoses involving all drugs, all opioids, synthetic opioids, heroin or stimulants, USA, 2010–2020Injury Prevention 2024;30:114-124. National Center for Injury Prevention and Control. WISQARS—Web-based Injury Statistics Query and Reporting System. 2023. Available from: https://www.cdc.gov/injury/wisqars/index.html Spencer MR, Garnett MF, Miniño AM. Drug overdose deaths in the United States, 2002–2022. NCHS Data Brief, no 491. Hyattsville, MD: National Center for Health Statistics. 2024. DOI: https://dx.doi.org/10.15620/cdc:135849 Olfson, M., Wall, M., Wang, S., Crystal, S., & Blanco, C. (2018). Risks of fatal opioid overdose during the first year following nonfatal overdose. Drug and alcohol dependence, 190, 112–119. https://doi.org/10.1016/j.drugalcdep.2018.06.004 Substance Abuse and Mental Health Services Administration. (2023). Key substance use and mental health indicators in the United States: Results from the 2022 National Survey on Drug Use and Health (HHS Publication No. PEP23-07-01-006, NSDUH Series H-58). Center for Behavioral Health Statistics and Quality, Substance Abuse and Mental Health Services Administration. https://www.samhsa.gov/data/report/2022-nsduh-annual-national-report'''
