full_description = "January 18, 2024 National Center on Birth Defects and Developmental Disabilities (NCBDDD) Staff Bio Karen Remley, MD, MBA, MPH, FAAP, is the Director for the National Center on Birth Defects and Developmental Disabilities (NCBDDD). Director of National Center on Birth Defects and Developmental Disabilities, Karen Remley, MD, MBA, MPH, FAAP Role at CDC As NCBDDD Director, Dr. Remley leads a center that strives to advance the health and well-being of our nation’s most vulnerable populations. She has more than 30 years of experience in public health and health care, with leadership roles in the public and private sectors. Her “north star” has always been children and families, and she has shaped her career around helping every family have the best opportunity for health and well-being. Previous experience Prior to joining NCBDDD, Dr. Remley served as Senior Advisor to the COVID-19 response for the Office of the Commissioner, Virginia Department of Health, where she was instrumental in increasing and assuring testing for COVID-19 to ensure it was widely available across the Commonwealth of Virginia. She also worked as a Professor of Pediatrics at Eastern Virginia Medical School. Dr. Remley has served on many national committees and commissions working on public health education, health equity, and patient safety, including her roles as Chief Executive Officer of the American Academy of Pediatrics; Commissioner of Health for the Commonwealth of Virginia under two governors; Chief Medical Director of Anthem Blue Cross Blue Shield Virginia; and Chief Executive Officer of Physicians for Peace. In 2018, she served as the Inaugural Senior Fellow at the de Beaumont Foundation, a foundation dedicated to pragmatic solutions to improve public health. Education Dr. Remley earned a Master of Business Administration from the Fuqua School of Business at Duke University, a Master of Public Health at the University of Massachusetts Amherst, and her Doctor of Medicine from University of Missouri in Kansas City. She completed her pediatrics residency at St. Louis Children’s Hospital-Washington University School of Medicine in St. Louis. On This Page Role at CDC Previous experience Education January 18, 2024 Sources Print Share Facebook LinkedIn Twitter Syndicate Content Source: Centers for Disease Control and Prevention"
