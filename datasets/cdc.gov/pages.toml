title = "Office of Budget Policy and Appropriations (OBPA) | About CDC | CDC"
description = "Learn about CDC’s mission to protect you 24-7."
full_description = "October 18, 2024 Office of Budget Policy and Appropriations (OBPA) Staff Bio Elizabeth Solhtalab, MPA is the director of the Office of Budget Policy and Appropriations (OBPA). Role at CDC Elizabeth leads the agency's budget policy and Congressional appropriations functions – providing leadership and strategic advice in support of CDC's resource needs and its public health mission. Previous experience Elizabeth has over 18 years of experience in public health policy and appropriations. Solhtalab began her federal service at the National Center for Chronic Disease Prevention and Health Promotion, where she served in several key policy positions. From 2013-2023, Solhtalab served in leadership positions at the National Center for Injury Prevention and Control at the CDC. She first led the legislative activities and then served as the Associate Director of the Office of Policy and Partnerships. While serving in these roles, the budget for the center increased from $150m to $714m and provided funding for key programmatic efforts, including a national opioid overdose prevention program. She was instrumental in reestablishing a funding line for suicide prevention and establishing a funding line for the prevention of adverse childhood experiences. Before this current CDC role, Solhtalab served in an executive leadership role as the Chief of Policy and Government Relations for Prevent Child Abuse America (PCAA). There, she oversaw all federal and state policy and appropriations activities related to the primary prevention of child abuse and neglect. Prior to joining CDC, Solhtalab worked in state prevention programs in both Georgia and New Mexico and has also served in the United States Air Force. Education Solhtalab holds a bachelor's degree from Georgia State University and a master's degree in public administration from Kennesaw State University. She is a recipient of a US Department of Health and Human Services Group Award for Service to America. On This Page Role at CDC Previous experience Education October 18, 2024 Sources Print Share Facebook LinkedIn Twitter Syndicate Content Source: Centers for Disease Control and Prevention"
