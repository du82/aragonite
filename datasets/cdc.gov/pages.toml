["https://cdc.gov/about/cdc-moving-forward/index.html"]
title = "CDC Moving Forward Summary Report | About CDC | CDC"
description = "About CDC's modernization initiative, CDC Moving Forward"
full_description = '''February 7, 2024 CDC Moving Forward Summary Report At a glance In April 2022, CDC leadership initiated an agency-wide review consisting of 1) a scientific and programmatic review to identify ways to improve and institutionalize how CDC develops and deploys its science, both in pandemic and non-emergency times and 2) a structural review to gather feedback on the agency’s current processes, systems, and structure and solicit suggestions for strategic change. The results of those concurrent reviews led to the August 2022 launch of CDC Moving Forward. Background To address the structural and systemic operational challenges, which were exacerbated during the COVID-19 pandemic, in April 2022, then CDC Director Dr. Rochelle Walensky launched a review of the agency. There were two components to this review, with designated leads for each: Scientific and Programmatic Review: To identify ways to improve and institutionalize how CDC develops and deploys its science, both in pandemic and non-emergency times. Interviews were conducted by Mr. James Macrae, Associate Administrator for the Bureau of Primary Health Care in the U.S. Department of Health and Human Services' Health Resources and Services Administration (HRSA). Structural Review: To gather feedback on the agency's current processes, systems, and structure and solicit suggestions for strategic change, with a strong focus on the agency's core capabilities – a diverse public health workforce, data modernization, laboratory capacity, rapid response to disease outbreaks, and preparedness within the US and around the world. Interviews were conducted by three CDC senior leaders: Dr. Deb Houry and Mr. Robin Bailey. Approach to the Review To accomplish the Scientific and Programmatic Review, approximately 120 interviews were conducted from April 2022 through June 2022 with CDC leadership, staff, and external partners (e.g., those from academic, jurisdictional public health, and former CDC employees and leaders). During the data collection phase, interviewers met regularly with the Director to provide updates and share findings in real time. After presenting to CDC leaders, Mr. Macrae delivered the Scientific and Programmatic Review report to the CDC Director that captured his findings and recommendations specific to his task: to identify ways to improve and institutionalize how CDC develops and deploys its science. This report is included in full as Appendix A. The Structural Review took place alongside the Scientific and Programmatic Review. Over 50 interviews were conducted, and findings are presented below. Taken together, these in-depth reviews offered CDC a clear path forward to improve scientifically and structurally to better serve the American people and execute the mission of the CDC. Structural Review: Findings and Recommendations The major findings from the Structural Review (see Appendix A) included the need for CDC to: Share science and data faster Translate science into practical policy Prioritize public health communications, with a focus on the American public Develop a CDC workforce ready to respond to future threats Promote partnerships In addition to these recurrent themes, CDC leadership identified the following additional overarching concepts and recommendations: CDC's academic approach has sometimes slowed critical agency action. CDC must align incentives with public health action and impact. Acknowledging that the work of the agency requires a deep understanding of the science to develop and implement public health action, the agency's incentive structure – hiring, performance reviews, promotions – however, is too heavily focused on publication productivity rather than an individual's impact or actions. Modification should be made within the agency to better recognize and reward action, such as deploying for a public health response, embedding in the field during an outbreak, and implementing activities that lead to public health impact (e.g., increasing access to screening services or vaccinations). This realignment of incentives toward action and change needs to happen at all levels of the organization. To further this concept, CDC leaders and staff would benefit from more practical, experiential learning opportunities in the field. CDC has a strong foundation of public health workforce programs, including the Epidemic Intelligence Service, to build upon. These programs should be expanded and resourced to increase rotational assignments with jurisdictions. Hands-on experience will strengthen scientific leadership and lead to more practical work from CDC. CDC's silos have impeded critical, cross-cutting support functions. CDC must improve its internal coordination and work with external partners. CDC's centers, institutes, and offices too often work in silos and could better utilize agency-wide approaches to implement policies and strategies, particularly to support public health core capabilities. CDC has deep subject matter expertise across the agency; the cross-cutting functions (e.g., health equity, science, communication, policy, etc.) that serve as the foundation of that expertise need to have the same level of financial and leadership support. CDC's budget, complexity, mission, and staffing have grown substantially over the past decade, and new priorities and challenges have emerged that require additional support, engagement, and leadership. Meanwhile, the agency's critical cross-cutting functions and core capabilities have been woefully underfunded and their presence within the organization have been de-emphasized in comparison to disease-specific subject matter expertise. These functions should be supported, elevated, and empowered to further CDC's mission, engage directly in the work of programs across the agency to meet their intent, and be held accountable. Given the domestic public health threats of the last several years (e.g., COVID-19, mpox, polio, etc.), we can safely assume we do not yet know what the next threat will be; as such, it is critically important to have a strong public health foundational infrastructure – with a complimentary CDC structure – prepared for any next threat. The communities of practice structure (offices stood up in 2018 to supervise most of CDC's national centers) led to layers of reporting and confusion regarding roles and responsibilities; the limited personnel resources and expertise within these units are best redirected to support cross-cutting agency functions. The public health field is a different landscape than it was before the COVID-19 pandemic and in addition to CDC's traditional partners and state, local, tribal, and territorial jurisdictions, there are new partners, community-based organizations, private sector organizations, and the healthcare sector that are engaged in public health. CDC should provide a streamlined opportunity for these organizations to interact with the agency. A "front door" to CDC should be developed to increase collaboration with industry, academia, state/local government, etc., beyond the traditional public health partners. CDC's internal operating model often fails to support the public health core capabilities and cross-cutting functions. CDC must implement new governance with an emphasis on the core capabilities and accountability at all levels. New internal systems, processes, and governance require change to enhance bi-directional accountability and foster collaboration, communication, and timeliness at all levels of the organization. The agency should re-establish an agency-wide, program performance-based framework for programs focused on key agency goals and results, including impact, timeliness, and quality. This process should include an open and transparent way to track initiatives and outcomes, including timeframes for deliverables and schedules for regular progress updates, which should feed into the agency's overarching Strategic Plan. The agency should also stand up a new internal governance model, through an executive board that reports to the CDC Director. The executive governance board should be comprised of no more than five CDC senior leaders, serving rotational assignments, and charged with assessing and recommending the agency's priorities each year. The executive board's work will be informed by the CDC senior leadership team and include annual budget execution planning and review activities to ensure alignment with the agency's overarching strategy. This board's efforts should be closely linked to the new program performance-based framework, as well as the agency's Enterprise Risk Management process, and include a process in which evaluation of impact and action contributes to the annual planning process. CDC would benefit from being nimbler and more flexible. CDC must upskill and train toward a response-capable agency while maintaining the core public health work that is critical to the health of the nation. Throughout its history, CDC has effectively responded to disease outbreaks, which have been relatively small in terms of size and scope as compared to recent public health emergencies (e.g., Ebola, Zika, EVALI, COVID-19, and mpox). Over the past decade, outbreaks and their resultant responses have grown larger and more complex – and the agency has not had the capacity to keep pace. The agency needs a new approach to preparedness from top to bottom, including structure, function, budget, staffing, and authorities. CDC needs to be fast-paced and response-oriented and needs to move agency culture towards integrating preparedness and response into every activity, including defining roles and responsibilities for CIOs and employees. CDC should elevate response-related activities and better integrate cross-cutting preparedness and response elements across the organization. With budget flexibility, and a change to how the agency can execute its budget to support response work, CDC should develop a response-ready cadre of staff trained for preparedness and response activities. This would enable rapid assignment of staff to an emergency response or other urgent public health crisis for the duration of the response. CDC should develop a comprehensive document that explains the challenges and opportunities to help pivot the agency to a response-ready organization moving forward. Lessons learned from the recent responses, along with feedback received from inside and outside the agency, made it clear that CDC needs to receive additional flexibilities and authorities to meet its public health mission and support core public health infrastructure. Highlights include mandatory data reporting, exemption from Paperwork Reduction Act requirements, other transaction authority, and various human resources and financial resources authorities. Next Steps On August 17, 2022, CDC Moving Forward launched, including four inter-related efforts aimed to better position CDC to achieve its vision: Implement changes to improve how CDC develops and delivers its data and science during public health responses, as well as normal operations Stand up new internal systems, processes, and governance within the agency to improve accountability, collaboration, communication, and timeliness within CDC and with its customers, at all levels of the organization Reorganize the agency to breakdown silos, elevate core capabilities, and better leverage resources Articulate new programs, authorities, and flexibilities that will better position CDC and public health for future response activities Mary Wakefield, PhD, RN, a seasoned executive with extensive federal experience, led the initial phases of this effort. Following the June 2023 appointment of Dr. Mandy Cohen as CDC Director, agency leaders continue to champion CDC Moving Forward's vital work, including tracking progress and developing an evaluation framework to measure the success of the changes over time, while allowing for adaptability to adjust the original goals, as needed. Conclusion CDC has made an exceptional impact on the lives of Americans and people around the world over the years. Never in its 75-year history has CDC had to make decisions so quickly, based on limited and evolving science. Traditional scientific and communication processes were inadequate to accelerate quickly and effectively respond to a crisis the size and scope of the COVID-19 pandemic. This review and subsequent improvement efforts will build upon CDC’s rich history. The agency – and all of its staff – have made tremendous progress in many critical public health areas, despite the structural and systemic operational barriers that exist today. Those who work at CDC are deeply committed to the agency, its mission, and public health. Pivoting is especially challenging in a time where countless CDC staff have worked tirelessly for more than two years through the pandemic, which has had a profound impact on staff and their families, but it is critical that these changes occur now to be prepared for the next threat. This review, and subsequent work, are intended to lift up the agency’s work and institute changes in how the agency operates to better support its staff and mission. The challenges identified through this review did not happen overnight, and our progress toward these improvements will be dedicated, gradual, and systematic; it will take time to implement the improvements to better position CDC for the future. Appendix A: COVID-19 Response and the Centers for Disease Control and Prevention: Translating Science and Data into Policy and Communications Observations and Recommendations for the Future A crisis, especially one at a global scale, often reveals an organization's strengths as well as its weaknesses. The COVID-19 global pandemic was no exception. For the Centers for Disease Control and Prevention (CDC), the crisis shined a spotlight on the thousands of dedicated public servants who worked tirelessly over the past two years to support State and local health officials, employers, providers, the American public, and the global public health community in the face of uncertainty and an ever-changing disease. At the same time, the pandemic also highlighted several longstanding challenges and issues that have impacted CDC's ability to fully accomplish its mission. This report focuses on how CDC can better translate science and data into actionable policy and communications during a public health emergency and will be part of an overall assessment of the CDC to inform its future direction and role in public health. This report does not cover areas examined by the concurrent review of how CDC operates (including potential structural changes, internal processes, systems, and governance), alternative funding arrangements, and/or additional or new programmatic authorities and flexibilities. The observations and recommendations presented in this report are organized into five inter-related focus areas and are based on over 120 interviews conducted from'''
author = "CDC"
year_published = 2024
clearnet = "https://cdc.gov/about/cdc-moving-forward/index.html"
