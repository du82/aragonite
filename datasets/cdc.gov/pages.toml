["https://cdc.gov/marburg/situation-summary/index.html"]
title = "Marburg Outbreak in the United Republic of Tanzania: Current Situation | Marburg | CDC"
description = "Learn about Marburg virus disease (MVD), a rare but severe hemorrhagic fever which affects both people and non-human primates."
full_description = "January 23, 2025 Marburg Outbreak in the United Republic of Tanzania: Current Situation What to know The World Health Organization (WHO) had received reports of a cluster of Marburg virus disease (Marburg) cases, including eight deaths in the Kagera region in northwest Tanzania. Marburg is a rare but severe hemorrhagic fever, similar to Ebola virus disease, that can cause serious illness and death. Currently, there are no cases of Marburg reported in other African countries or the United States and the risk of infection with this virus in the United States is low. Current situation In the United Republic of Tanzania On January 14, the WHO issued a notice of a Marburg outbreak in the Kagera region in northwest Tanzania, which includes nine cases and eight deaths. In the United States There have been no reported cases of Marburg in the United States. What CDC is doing CDC has a longstanding presence in Tanzania, having established an office there in 2001. CDC Tanzania works closely with the Government of Tanzania and partner organizations to detect, prevent, and control infectious disease outbreaks and build and strengthen the country's core public health capabilities. CDC posted a Level 1 Travel Health Notice for Tanzania, recommending people practice usual precautions if traveling to Tanzania. CDC is prepared to deploy subject matter experts to assist with the country's investigation and response to this outbreak, as needed. In Africa, CDC continues to engage with our domestic and international public health partners and other U.S. government agencies. CDC and in-country partners across Africa work together on disease strengthening surveillance, laboratory capacity, strengthening workforce capacity, case investigation, case management, infection prevention and control, border health systems, and planning. Resources For the public General inquiries: CDC-INFO (1-800-232-4636) About Marburg Travel Health Notice History of Marburg Disease Outbreaks For clinicians, public health partners, and laboratory staff Viral Hemorrhagic Fevers (VHFs) for Health Care Providers Clinical Treatment of Viral Hemorrhagic Fevers (VHFs) Public Health Management of People with Suspected or Confirmed VHF or High-Risk Exposures Laboratory Testing for Patients with a Suspected VHF or High-Consequence Disease On This Page Current situation What CDC is doing Resources January 23, 2025 Sources Print Share Facebook LinkedIn Twitter Syndicate Content Source: National Center for Emerging and Zoonotic Infectious Diseases (NCEZID)"
