full_description = "David J. Sencer CDC Museum Print Minus Related Pages Ever wonder how CDC scientists merge old-fashioned detective work with high-tech science to crack the cases of mystery diseases? Get the Story! Visit the David J. Sencer CDC Museum at CDC Headquarters. This unique museum features award-winning permanent and changing exhibitions that focus on a variety of public health topics, as well as the history of CDC. The museum is free and open to the public so we would like to see you soon. Now on Display Temporary GalleryHealth is a Human Right: Achieving Health Equity Now Open Lobby GalleryCelebrating 30 Years of Vaccines for Children Now Open Permanent GalleryThe Story of CDC Ongoing About the MuseumGeneral overview of the museum's history, purpose, mission, and goals. ExhibitionsCurrent, online, upcoming, past, and CDC traveling exhibits. Plan Your VisitInformation about guided tours and self-guided visits at the CDC Museum. Museum TourGuided tour information for student and adult groups plus the tour request form. Disease Detective CampA week-long day camp for rising high school juniors and seniors. EducationSTEM-based educational programs offering in-person and online learning​ Related Links Request a Speaker CDC History About CDC Smithsonian Institution Other Resources CDC Museum Brochure [8.8 MB, 2 Pages, 16″ x 9″] CDC Museum Press Sheet [2.3 MB, 1 page] Follow Us Follow @CDCMuseum for the latest news about exhibitions, programming, and events. Global Health Chronicles Global Health Chronicles was launched in collaboration with Emory University’s Libraries, Global Health Institute, and Rollins School of Public Health. The web site is a series of “Chronicles,” each dealing with a different subject. MoreMuseum Info HoursMonday: 9am-5pm Tuesday: 9am-5pm Wednesday: 9am-5pm Thursday: 9am-7pm Friday: 9am-5pm Closed weekends & federal holidays Admission & ParkingAlways Free Government–issued photo ID required for adults over the age of 18 Passport required for non-U.S. citizens Weapons are prohibited. All vehicles will be inspected. Location1600 Clifton Road NE Atlanta, GA 30329 Phone404-639-0830 Tour Questionsmuseumtours@cdc.gov Last Reviewed: August 19, 2024 Source: Centers for Disease Control and Prevention Facebook Twitter LinkedIn Syndicate"
