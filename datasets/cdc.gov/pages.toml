["https://cdc.gov/media/releases/2025/2025-cdc-statement-on-measles-outbreak.html"]
title = "CDC Statement on Measles Outbreak | CDC Newsroom"
description = "CDC public health news, press releases, government public health news, medical and disease news, story ideas, photos."
full_description = "CDC Statement on Measles Outbreak Release For immediate release: February 27, 2025 CDC Media Relations(404) 639-3286media@cdc.govhttps://www.cdc.gov/media/ CDC continues to be in close communication with Texas health authorities about the measles outbreak in West Texas, following the death of a child. HHS sends its deepest condolences to the family. HHS is providing technical assistance, laboratory support, vaccines, and therapeutic medication as needed to the Texas Department of State Health Services and New Mexico Department of Health, which are leading the responses to the outbreaks in their jurisdictions. Measles outbreaks are occurring globally, particularly in Asia, which means that there is an increased likelihood of cases among unvaccinated travelers returning to the U.S., which we saw in the February 19 case of an Orange County, California resident returning from Asia. Vaccination remains the best defense against measles infection. Measles does not have a specific antiviral treatment. Supportive care, including vitamin A administration under the direction of a physician, may be appropriate. HHS Secretary Kennedy has spoken directly to Governor Abbott, Commissioner of the Texas Department of State Health Services Dr. Jennifer A. Shuford, and other public health officials to express HHS' willingness to support local efforts in dealing with the outbreak. ### U.S. DEPARTMENT OF HEALTH AND HUMAN SERVICES Whether diseases start at home or abroad, are curable or preventable, chronic or acute, or from human activity or deliberate attack, CDC’s world-leading experts protect lives and livelihoods, national security and the U.S. economy by providing timely, commonsense information, and rapidly identifying and responding to diseases, including outbreaks and illnesses. CDC drives science, public health research, and data innovation in communities across the country by investing in local initiatives to protect everyone’s health. Sources Print Share Facebook LinkedIn Twitter Syndicate Content Source: Office of Communications (OC)"
