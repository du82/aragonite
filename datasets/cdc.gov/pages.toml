["https://cdc.gov/alzheimers-dementia/php/sdoh/index.html"]
title = "Non-Medical Factors that Affect Alzheimer's Disease and Related Dementias Risk | Alzheimer's Disease and Dementia | CDC"
description = "Dementia is not a specific disease. It is a general term for having trouble remembering, thinking, or making decisions that affect everyday activities."
full_description = '''July 30, 2024 Non-Medical Factors that Affect Alzheimer's Disease and Related Dementias Risk Key points Social determinants of health (SDOH) are the nonmedical factors influencing health—the conditions in which people are born, grow, work, live, and age. These factors and conditions, including education, health care access, physical environment, and social isolation, also affect a person's risk for dementia. Overview Health inequities have persisted across generations. This is in part because policies and practices have limited access to health care and other opportunities for health for some groups of people. A growing body of research suggests that nonmedical factors and social conditions, including education, health care access, physical environment, and social connection, may influence a person's health, including their risk for dementia. More work is needed to understand how these nonmedical factors influence dementia. SDOH affect a wide range of health risks and outcomes. Education Studies show an association between a lower level of education and poorer brain health. Research suggests that the proportion of adults age 45 and older with worsening memory loss or more frequent confusion (known as subjective cognitive decline) is: More than twice as high for people without a high school diploma. Lowest for college graduates.1 One reason may be cognitive reserve.2 Cognitive reserve refers to the level of knowledge and education "banked" in early years. Researchers believe this may protect and compensate for a decline in cognitive health in later years. Access to health care Some chronic conditions are linked to brain health. This is one reason that access to health care can also affect dementia risk. Consistent access to health care services can: Help people prevent chronic diseases by identifying behaviors and conditions that can lead to serious health problems. Aid in early diagnosis of many health conditions, such as diabetes, heart disease, and dementia. Help people manage chronic conditions to avoid complications and hospitalizations. Help diagnose dementia earlier to allow for better care coordination and support. On the other hand, inconsistent or lack of quality health care access deprives people of these opportunities for optimal health, including brain health. Built environment The built environment is the physical environment around us. It includes the spaces where we live, learn, work, and age. Built environments can influence overall community health and individual behaviors, such as physical activity and healthy eating. Unsafe or unhealthy environments or housing can negatively impact brain health.3 Healthy community design, such as adding crosswalks, bike lanes or sidewalks can improve opportunities for exercise, access to services, and community supports. All of these opportunities have a positive impact on brain and physical health. Loneliness and social isolation There is strong evidence that: Social isolation significantly increases a person's risk of premature death from all causes4. People experiencing social isolation or loneliness are at a higher risk for dementia.5 Podcast: Dr. Craig Thomas discusses a report on the impact of social isolation on the health of older adults. Resources Social Determinants of Health. CDC The Built Environment Assessment Tool Manual, CDC, Division of Nutrition, Physical Activity, and Obesity Physical Activity, Strategies and Resources, CDC, Division of Nutrition, Physical Activity, and Obesity Subjective Cognitive Decline Among Adults Aged ≥45 Years — United States, 2015–2016, CDC, MMWR, July 13, 2018. On This Page Overview Education Access to health care Built environment Loneliness and social isolation Resources July 30, 2024 Sources Print Share Facebook LinkedIn Twitter Syndicate Content Source: National Center for Chronic Disease Prevention and Health Promotion ReferencesWooten KG, McGuire LC, Olivari BS, Jackson EMJ, Croft JB. Racial and Ethnic Differences in Subjective Cognitive Decline - United States, 2015-2020. MMWR Morb Mortal Wkly Rep. 2023;72(10):249-255. doi:10.15585/mmwr.mm7210a1 Copenhagen Summit on Cognitive Reserve – Consensus Statement. https://ifa.ngo/wp-content/uploads/2020/05/Copenhagen-Summit-Consensus-Statement_Final.pdf CDC. Addressing Social Determinants of Health and Chronic Diseases. Advancing Health Equity in Chronic Disease. Published 2024. Accessed August 28, 2024. https://www.cdc.gov/health-equity-chronic-disease/social-determinants-of-health-and-chronic-disease/index.html National Academies of Sciences, Engineering, and Medicine. 2020. Social Isolation and Loneliness in Older Adults: Opportunities for the Health Care System. Washington, DC: The National Academies Press. https://doi.org/10.17226/25663 Kuiper JS, Zuidersma M, Oude Voshaar RC, et al. Social relationships and risk of dementia: A systematic review and meta-analysis of longitudinal cohort studies. Ageing Res Rev. 2015;22:39-57. https://doi.org/10.1016/j.arr.2015.04.006 SourcesNational Center for Chronic Disease Prevention and Health Promotion'''
