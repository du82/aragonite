full_description = "July 18, 2024 Español Emergency Use Instructions (EUI) for Oseltamivir What to know On July 19, 2024, CDC issued Emergency Use Instructions (EUI) for an antiviral called oseltamivir, generic for brand name drug Tamiflu, for treatment or post-exposure prophylaxis (PEP) of pandemic influenza A viruses and novel influenza A viruses with pandemic potential. About EUI EUI provide information about emergency use of FDA-approved medical products that differ from or go beyond the information provided in the FDA-approved labeling (package insert). CDC-issued oseltamivir EUI fact sheets for healthcare providers and recipients and caregivers are available below. Oseltamivir Emergency Use Instructions (EUI) Fact Sheet for Healthcare Providers Emergency Use Instructions (EUI) Fact Sheet for Healthcare Providers: Oseltamivir for Treatment or P... Download Download Oseltamivir Emergency Use Instructions (EUI) Fact Sheet for Recipients and Caregivers Oseltamivir Emergency Use Instructions (EUI) Fact Sheet for Recipients and Caregivers Download Download Oseltamivir Emergency Use Instructions (EUI) Fact Sheet for Recipients and Caregivers (Spanish) Oseltamivir Emergency Use Instructions (EUI) Fact Sheet for Recipients and Caregivers (Spanish) Download Download Oseltamivir Emergency Use Instructions (EUI) Fact Sheet for Recipients and Caregivers (Haitian Creole) Oseltamivir Emergency Use Instructions (EUI) Fact Sheet for Recipients and Caregivers (Haitian Creole) Download Download Emergency Use Instructions (EUI) Fact Sheet for Recipients: Oseltamivir for Treatment or Post-Exposure Prophylaxis of Novel Influenza A (K'iche') Emergency Use Instructions (EUI) Fact Sheet for Recipients: Oseltamivir for Treatment or Post-Exposu... Download Download Emergency Use Instructions (EUI) Fact Sheet for Recipients: Oseltamivir for Treatment or Post-Exposure Prophylaxis of Novel Influenza A (Nahuatl) Emergency Use Instructions (EUI) Fact Sheet for Recipients Providers: Oseltamivir for Treatment or P... Download Download July 18, 2024 Sources Print Share Facebook LinkedIn Twitter Syndicate Content Source: National Center for Immunization and Respiratory Diseases (NCIRD)"
