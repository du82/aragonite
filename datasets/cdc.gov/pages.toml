["https://cdc.gov/about/cdc-foundation.html"]
title = "CDC Foundation | About CDC | CDC"
description = "The CDC Foundation is a non-profit organization authorized by Congress to support CDC's mission."
full_description = "January 16, 2024 CDC Foundation Key points The CDC Foundation is the go-to nonprofit authorized by Congress to mobilize philanthropic partners and private-sector resources to support CDC’s critical health protection mission. CDC Foundation The CDC Foundation helps CDC save and improve lives by unleashing the power of collaboration between CDC, philanthropies, corporations, organizations and individuals to protect the health, safety and security of America and the world. The CDC Foundation is the go-to nonprofit authorized by Congress to mobilize philanthropic partners and private-sector resources to support CDC's critical health protection mission. Since 1995, the CDC Foundation has raised over $2.2 billion and launched more than 1,400 programs impacting a variety of health threats from chronic disease conditions including cardiovascular disease and cancer, to infectious diseases like rotavirus and HIV, to emergency responses, including COVID-19 and Ebola. The CDC Foundation managed hundreds of programs in the United States and in 77 countries last year. Because CDC is a federal agency, all scientific findings resulting from CDC research are available to the public and open to the broader scientific community for review. Funding for CDC's work provided through the CDC Foundation is not contingent on the outcomes of research or other scientific activity being favorable to one or more partners. The CDC Foundation works with CDC to ensure that programs will have a meaningful impact for CDC and public health, and complement CDC's priorities and ongoing work. The CDC and CDC Foundation each have review procedures in place to safeguard against possible conflicts of interest. For more information, please visit www.cdcfoundation.org. Web Resources CDC Foundation Blog and Social Media January 16, 2024 Sources Print Share Facebook LinkedIn Twitter Syndicate Content Source: Centers for Disease Control and Prevention"
