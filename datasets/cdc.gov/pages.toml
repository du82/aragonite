["https://cdc.gov/hand-foot-mouth/about/index.html"]
title = "About Hand, Foot, and Mouth Disease | Hand, Foot, and Mouth Disease (HFMD) | CDC"
description = "HFMD is very contagious and usually causes fever, mouth sores, and skin rash. It is common in children under 5 years old, but anyone can get it."
full_description = "May 7, 2024 Español About Hand, Foot, and Mouth Disease Key points Hand, foot, and mouth disease (HFMD) is common in children under 5 years old, but anyone can get it. The illness is usually not serious, but it is very contagious. To prevent spreading HFMD, wash your hands often, clean and disinfect surfaces, and avoid close contact with others. What it is HFMD is a common illness that usually causes fever, mouth sores, and skin rash. It can spread quickly at schools and day care centers. Most people get better on their own in 7 to 10 days. Signs and symptoms Most children have mild symptoms for 7 to 10 days. Symptoms may include: Fever Sore throat Painful mouth sores that blister Rash commonly found on the hands and feet Complications from HFMD are rare. Keep Reading: Detailed HFMD Symptoms and When to See a Doctor A rash on the palms and soles is a common sign of HFMD. Who is at risk HFMD is most common in infants and children younger than 5 years old. If you are pregnant, contact your doctor if you think you may have been exposed to HFMD. Complications from HFMD are rare. However, your own medical history and how far along you are in your pregnancy can affect the situation. How it spreads HFMD is caused by viruses. A person infected with one of these viruses is contagious. This means they can pass the virus easily to other people. HFMD can spread through contact with: Droplets with virus particles made after person sneezes, coughs, or talks Objects and surfaces that have virus particles Fluid from blisters Poop Keep Reading: HFMD: Causes and How It Spreads Prevention HFMD is very contagious. To help prevent catching or spreading HFMD: Wash your hands often with soap and water for at least 20 seconds, especially after changing diapers, using the toilet, and coughing, sneezing, or blowing your nose. Help children wash their hands and keep blisters clean. Avoid touching your face with unwashed hands, especially your eyes, nose, and mouth. Clean and disinfect frequently touched surfaces and shared items, including toys and doorknobs. Avoid close contact with an infected person, such as hugging or kissing them. There is no vaccine in the United States to protect against the viruses that cause HFMD. Teach children how to wash hands often to prevent HFMD from spreading. Treatment and recovery HFMD is usually not serious. Most people get better on their own in 7 to 10 days with minimal or no medical treatment. You can take steps to manage symptoms while you or your child are sick. Manage symptoms at home Relieve pain and fever. Take over-the-counter medications to relieve fever and pain caused by mouth sores. Never give aspirin to children. Prevent dehydration (loss of fluids). You can take steps to relieve symptoms and prevent dehydration while you or your child are sick. Drink enough liquids. Mouth sores can make it painful to swallow, so your child may not want to drink much. Make sure they drink enough to stay hydrated. When to return to school Because HFMD is normally mild, children can continue to go to child care and schools as long as they: Have no fever. Feel well enough to participate in class. Have no uncontrolled drooling with mouth sores. Talk with your child’s healthcare provider if you are still not sure when it is okay for them to return. Sometimes, the local health department may require children with HFMD to stay home to control an outbreak. Resources When and How to Wash Your Hands Hand Hygiene in Healthcare Settings About Non-Polio Enteroviruses A Guide to Clinical Management for HFMD | WHO On This Page What it is Signs and symptoms Who is at risk How it spreads Prevention Treatment and recovery Resources May 7, 2024 Sources Print Share Facebook LinkedIn Twitter Syndicate Content Source: National Center for Immunization and Respiratory Diseases; Division of Viral Diseases"
