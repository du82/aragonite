["https://cdc.gov/listeria/outbreaks/meat-and-poultry-products-11-24"]
title = "Listeria Outbreak Linked to Ready-to-Eat Meat and Poultry Products | Listeria Infection | CDC"
description = "Listeria infection is caused by eating food contaminated with Listeria monocytogenes bacteria. The infection can be very serious for some groups of people."
full_description = '''January 31, 2025 Listeria Outbreak Linked to Ready-to-Eat Meat and Poultry Products Food safety alert Investigation status: Open Recall issued: Yes New as of 12/5: CDC added another strain of Listeria to this outbreak after it was identified in product and environmental testing. If you have any Yu Shang Food recalled products in your home, throw them out or return them to the store. Fast Facts Cases: 19 (8 new)Hospitalizations: 17 (8 new)Deaths: 2 (1 new)States: 8 (4 new) const pageSummaryButtonContainer = document.querySelector('#nav-buttons'); pageSummaryButtonContainer.innerHTML = decodeURIComponent('%3Cdiv%20class%3D%22dfe-outbreak-navs%22%3E%0D%0A%09%3Ca%20href%3D%22%2Flisteria%2Foutbreaks%2Fmeat-and-poultry-products-11-24%2Finvestigation.html%22%20class%3D%22btn%20btn-outline-secondary%22%3EUpdates%3C%2Fa%3E%3Ca%20href%3D%22%2Flisteria%2Foutbreaks%2Fmeat-and-poultry-products-11-24%2Flocations.html%22%20class%3D%22btn%20btn-outline-secondary%22%3ELocations%3C%2Fa%3E%3Ca%20href%3D%22%2Flisteria%2Foutbreaks%2Fmeat-and-poultry-products-11-24%2Ftimeline.html%22%20class%3D%22btn%20btn-outline-secondary%22%3ETimeline%3C%2Fa%3E%3C%2Fdiv%3E%0D%0A%09'); Recalled food Yu Shang Food ready-to-eat meat and poultry products All products with "Yu Shang" (establishment number "P46684" or "EST. M46684") on the label. Includes all products produced prior to October 28, 2024. Recall See USDA's recall notice for full product list. What you should do Do not eat recalled products. Throw them away or return them to where you bought them. Clean your refrigerator, containers, and surfaces that may have touched the recalled foods. Listeria can survive in the refrigerator and can easily spread to other foods and surfaces. Call a healthcare provider right away if you have these symptoms after eating recalled products: Pregnant women: Fever, muscle aches, and tiredness. Your illness may be mild, but Listeria can cause pregnancy loss or premature birth. It can also cause serious illness or death in newborns. Other people may have: Headache, stiff neck, confusion, loss of balance, and convulsions, in addition to fever, muscle aches, and tiredness. What Businesses Should Do Do not sell or serve recalled products. Follow FDA's safe handling and cleaning advice if you sold or served recalled products. Symptoms of Listeria Listeria is especially harmful to women who are pregnant, aged 65 or older, or with weakened immune systems. This is because Listeria is more likely to spread beyond their gut to other parts of their body, resulting in a severe condition known as invasive listeriosis. For pregnant women, Listeria can cause pregnancy loss, premature birth, or a life-threatening infection in newborns. For people who are 65 years or older or who have a weakened immune system, Listeria often results in hospitalization and sometimes death. Symptoms usually start within 2 weeks after eating food contaminated with Listeria but may start as early as the same day or as late as 10 weeks after. Pregnant women: Fever, muscle aches, and tiredness. Your illness may be mild, but Listeria can cause pregnancy loss or premature birth. It can also cause serious illness or death in newborns. Other people may have: Headache, stiff neck, confusion, loss of balance, and convulsions, in addition to fever, muscle aches, and tiredness. See also 记起: 030-2024_Listeria_EXP_FINAL_译稿.pdf FSIS: Yu Shang Food, Inc. Recalls Ready-To-Eat Meat and Poultry Products Due to Possible Listeria Contamination | Food Safety and Inspection Service CDC: About Listeria Infection On This Page Recalled food What you should do What Businesses Should Do Symptoms of Listeria See also January 31, 2025 Sources Print Share Facebook LinkedIn Twitter Syndicate Content Source: National Center for Emerging and Zoonotic Infectious Diseases (NCEZID); Division of Foodborne, Waterborne, and Environmental Diseases'''
