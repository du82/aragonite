["https://cdc.gov/media/releases/2025/us-government-releases-national-one-health-plan.html"]
title = "U.S. Government Releases First National One Health Plan to Protect People, Animals, and Our Environment from Shared Health Threats | CDC Newsroom"
description = "CDC public health news, press releases, government public health news, medical and disease news, story ideas, photos."
full_description = "Español U.S. Government Releases First National One Health Plan to Protect People, Animals, and Our Environment from Shared Health Threats Statement For immediate release: January 10, 2025 CDC Media Relations(404) 639-3286media@cdc.govhttps://www.cdc.gov/media/ The Centers for Disease Control and Prevention (CDC), the U.S. Department of Agriculture (USDA), and the Department of the Interior (DOI) today released the first-ever National One Health Framework to Address Zoonotic Diseases and Advance Public Health Preparedness in the United States. One Health is a collaborative, multisectoral, and transdisciplinary approach that seeks to improve the health of humans, animals, and the environment by recognizing their close connections. The One Health approach importantly provides a framework to navigate health threats shared between people and animals, such as COVID-19, mpox, avian influenza, Ebola and other shared One Health issues. At the direction of Congress in the 2023 Consolidated Appropriations Act, CDC, USDA, and DOI developed this framework to address zoonotic diseases and advance public health preparedness in the United States. CDC, USDA, and DOI are responsible for protecting public health, domestic animal health, and wildlife and environmental health, respectively, and as such are representatives of key One Health sectors for the US government. All three agencies historically address One Health issues and work to help control zoonotic diseases that affect both people and animals. The framework seeks to inform One Health collaboration across the U.S. government for the next five years, describing a common vision, mission, and goals for key federal partners involved in implementing the One Health approach to address zoonotic diseases within the United States. In developing this framework, the U.S. government is helping to ensure that the groundwork is laid for effective disease response in the future so that we can be better prepared for the next potential threat. For more information about One Health and federal coordination of One Health efforts, visit: https://www.cdc.gov/one-health/php/about/federal-one-health-coordination-1.html. ### U.S. DEPARTMENT OF HEALTH AND HUMAN SERVICES Whether diseases start at home or abroad, are curable or preventable, chronic or acute, or from human activity or deliberate attack, CDC’s world-leading experts protect lives and livelihoods, national security and the U.S. economy by providing timely, commonsense information, and rapidly identifying and responding to diseases, including outbreaks and illnesses. CDC drives science, public health research, and data innovation in communities across the country by investing in local initiatives to protect everyone’s health. Sources Print Share Facebook LinkedIn Twitter Syndicate Content Source: Office of Communications (OC)"
