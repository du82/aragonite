description = "Request a CDC Ambassador for your community, organization, or school event."
full_description = "April 24, 2024 Community and School Events At a glance Request CDC participation at your community, organization, or school event. CDC Ambassador Program Do you want CDC to participate in your career day or facilitate a handwashing demonstration at your community, organization, or school event? As part of our CDC Ambassador program, you can request a CDC employee to join your event to share information about their career in public health/STEM and/or provide a handwashing demonstration and healthy hygiene materials. If you are interested in CDC participating in one of these events, complete the form below. A representative will review your request and contact you. Please note, requests are filled by volunteers; our ability to attend your event is based on availability of our CDC Ambassadors. Career days/ STEM events: Ambassador offers an overview of their career at CDC. (Virtually across the U.S.). Handwashing Demonstrations: Ambassador performs a Glo Germ kit demonstration and gives information on the importance of handwashing and healthy behaviors. (Available in-person). CDC Career Resources Careers at CDC Student Programs Fellowships Handwashing and Health Fair Resources Health Promotion Materials Order CDC Publications Contact Community Relations Request CDC participation at your community, organization, or school event. *Disclaimer: All CDC Ambassador requests should be submitted two weeks in advance of the event. Please note that international requests cannot be fulfilled through the CDC Ambassadors program. All fields are required and must be filled out to submit a request. * Required fieldEmail*Please enter your email address.Contact Name*Telephone Number*Email*Event InformationType of Event*Select:Health FairCareer DayLive Handwashing DemonstrationSTEM EventEvent Name*Date of Event*Time of Event*Duration of Event*Event Location*Select:In personVirtualEvent Address*if virtual, put N/APlease enter additional details of your community, organization, or school event request here (for example, purpose, expectations, etc.).*Submit This site is protected by reCAPTCHA and the Google Privacy Policy and Terms of Service apply. var onSubmit = function(token) { CDC.validation.onSubmitHandler(); }; On This Page CDC Ambassador Program CDC Career Resources Handwashing and Health Fair Resources Contact Community Relations April 24, 2024 Sources Print Share Facebook LinkedIn Twitter Syndicate Content Source: Centers for Disease Control and Prevention"
