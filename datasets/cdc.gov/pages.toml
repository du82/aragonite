title = "Measles Cases and Outbreaks | Measles (Rubeola) | CDC"
description = "Find the latest numbers of confirmed U.S. measles cases. CDC updates this page weekly"
full_description = "February 28, 2025 Español Measles Cases and Outbreaks What to know Updated on February 28, 2025. The data on this page reflects measles cases reported to CDC as of noon on Thursdays. Starting 2/21/25, CDC will update this page every Friday. Measles cases in 2025 As of February 27, 2025, a total of 164 measles cases were reported by 9 jurisdictions: Alaska, California, Georgia, Kentucky, New Jersey, New Mexico, New York City, Rhode Island, and Texas. Find more real-time updates of measles cases reported by: Texas Department of State Health Services New Mexico Department of Health There have been 3 outbreaks (defined as 3 or more related cases) reported in 2025, and 93% of cases (153 of 164) are outbreak-associated. For comparison, 16 outbreaks were reported during 2024 and 69% of cases (198 of 285) were outbreak-associated. U.S. Cases in 2024 U.S. Cases in 2025 Total cases 164 Age Under 5 years: 55 (34%) 5-19 years: 79 (48%) 20+ years: 29 (18%) Age unknown: 1 (1%) Vaccination Status Unvaccinated or Unknown: 95% One MMR dose: 3% Two MMR doses: 2% U.S. Hospitalizations in 2025 U.S. Hospitalizations in 2025 20% 20% of cases hospitalized (32 of 164). Percent of Age Group Hospitalized Under 5 years: 29% (16 of 55) 5-19 years: 13% (10 of 79) 20+ years: 17% (5 of 29) Age unknown: 100% (1 of 1) U.S. Deaths in 2025 U.S. Deaths in 2025 1 There has been 1 confirmed death from measles. Measles cases in 2024 As of December 31, 2024, a total of 285 measles cases were reported by 33 jurisdictions: Arizona, California, District of Columbia, Florida, Georgia, Idaho, Illinois, Indiana, Louisiana, Maryland, Massachusetts, Michigan, Minnesota, Missouri, New Hampshire, New Jersey, New Mexico, New York City, New York State, North Carolina, Ohio, Oklahoma, Oregon, Pennsylvania, South Carolina, South Dakota, Tennessee, Texas, Vermont, Virginia, Washington, Wisconsin, and West Virginia. There have been 16 outbreaks (defined as 3 or more related cases) reported in 2024, and 69% of cases (198 of 285) are outbreak-associated. For comparison, 4 outbreaks were reported during 2023 and 49% of cases (29 of 59) were outbreak-associated. U.S. Cases in 2024 U.S. Cases in 2024 Total cases Age Under 5 years: 5-19 years: 20+ years: Vaccination Status Unvaccinated or Unknown: One MMR dose: Two MMR doses: U.S. Hospitalizations in 2024 U.S. Hospitalizations in 2024 Percent of Age Group Hospitalized Under 5 years: 5-19 years: 20+ years: fetch('/wcms/vizdata/measles/MeaslesCasesHospWeekly.json') .then(response => { if (!response.ok) { throw new Error('Network response was not ok ' + response.statusText); } return response.json(); }) .then(data => { // Since the data is now an array, we access the first element const casesData = data[0]; // Update the HTML with the fetched JSON data document.getElementById('total-cases').textContent = casesData['Total_Cases']; document.getElementById('age-under-5').textContent = casesData['Age_Under_5_years']; document.getElementById('age-5-19').textContent = casesData['Age_5-19_years']; document.getElementById('age-20-plus').textContent = casesData['Age_20+_years']; document.getElementById('unvaccinated').textContent = casesData['Unvaccinated_or_Unknown']; document.getElementById('one-dose').textContent = casesData['One_MMR_Dose']; document.getElementById('two-doses').textContent = casesData['Two_MMR_Doses']; document.getElementById('hospitalization-rate').textContent = casesData['US_Hospitalizations_in_2024']; document.getElementById('Cases_Hospitalized').textContent = casesData['Cases_Hospitalized']; document.getElementById('age1-hosp').textContent = casesData['age1_hosp']; document.getElementById('age2-hosp').textContent = casesData['age2_hosp']; document.getElementById('age3-hosp').textContent = casesData['age3_hosp']; }) .catch(error => { console.error('Error fetching data:', error); }); What to know about measles How serious is measles? Measles is an airborne, extremely infectious, and potentially severe rash illness. Before the measles vaccine was introduced, an estimated 48,000 people were hospitalized and 400–500 people died in the United States each year. Keep Reading: Measles Symptoms and ComplicationsMeasles is not a seasonal virus. However, measles is often spread over times of high travel (like spring break) or in situations where unvaccinated persons are in close quarters (like summer camp). Can I get measles while traveling? Did you know that measles can be found around the world? Measles can live in the air for 2 hours after an infectious person leaves the space. Before any international travel, evaluate if your family needs early vaccine doses. After you return, watch your health for 3 weeks and call your healthcare provider if you or your child gets sick with a rash and fever. Why are some fully vaccinated people getting measles? Two doses of MMR vaccine are 97% effective at preventing measles, 1 dose is 93% effective. It is uncommon for someone fully vaccinated to develop measles. However, breakthrough infections (when someone becomes infected after they have been vaccinated) can occur, especially in communities experiencing an outbreak where high levels of measles virus are circulating. The number of breakthrough infections (approximately 5% of total) is consistent with what we have seen in previous years. How do I protect myself? Prevent measles and talk to your healthcare provider about the measles, mumps, and rubella (MMR) vaccine, especially if planning to travel. Keep Reading: Measles Vaccination Why is there more measles activity? Measles was declared eliminated in the United States in 2000. This was thanks to a very high percentage of people receiving the safe and effective measles, mumps, and rubella (MMR) vaccine. In recent years, however: U.S. MMR coverage among kindergarteners is now below the 95% coverage target—much lower in some communities—and is decreasing. Global measles activity is increasing, meaning more chances of an unvaccinated person infected with measles abroad returning to the United States. How does CDC assess measles outbreak risk? CDC is creating models to show how measles outbreaks could occur and spread in the United States. These models can be used to help health departments better identify communities at highest risk and manage healthcare resources. Keep Reading: Assessing U.S. Measles Outbreak Risk Weekly measles cases by rash onset date 2023–2025* (as of February 27, 2025) *2023–2025 case counts are preliminary and subject to change. Map of measles cases in 2024 & 2025 as of February 27, 2025 Yearly measles cases as of February 27, 2025 *2023–2025 case counts are preliminary and subject to change. History of measles cases Measles was officially eliminated from the United States in 2000, meaning there is no measles spreading within the country and new cases are only found when someone contracts measles abroad and returns to the country. Achieving measles elimination status in the United States was a historic public health achievement. The below figure illustrates how common measles was before vaccines and how vaccine policy enabled elimination. View LargerDownload *2023 data are preliminary and subject to change. †Elimination is defined as the absence of endemic measles transmission in a region for ≥ 12 months in the presence of a well-performing surveillance system. MMR vaccine coverage for kindergarteners by school year (2009–2024) The measles, mumps, and rubella (MMR) vaccine is very safe and effective. When more than 95% of people in a community are vaccinated (coverage >95%), most people are protected through community immunity (herd immunity). However, vaccination coverage among U.S. kindergartners has decreased from 95.2% during the 2019–2020 school year to 92.7% in the 2023–2024 school year, leaving approximately 280,000 kindergartners at risk during the 2023–2024 school year. To dive into vaccine coverage data for MMR, visit VaxView. At local levels, vaccine coverage rates may vary considerably, and pockets of unvaccinated people can exist in states with high vaccination coverage. When measles gets into communities of unvaccinated people in the United States, outbreaks can occur. Previous years 2023 From January 1 to December 31, 2023, a total of 59 measles cases were reported by 20 jurisdictions: California, Colorado, District of Columbia, Florida, Hawaii, Idaho, Illinois, Kentucky, Maryland, Missouri, New Jersey, New York City, Ohio, Oregon, Pennsylvania, Texas, Utah, Virginia, Washington, and Wisconsin. *Jurisdictions refer to any of the 50 states, New York City, and the District of Columbia. 2022 From January 1 to December 31, 2022, a total of 121 measles cases were reported by 6 jurisdictions. * For more information, please see the following report: Notes from the Field: Measles Outbreak — Central Ohio, 2022–2023. MMWR. August 4, 2023 *Jurisdictions refer to any of the 50 states, New York City, and the District of Columbia. 2021 From January 1 to December 31, 2021, a total of 49 measles cases were reported by 5 jurisdictions. * For more information, please see the following report: Public Health Actions to Control Measles Among Afghan Evacuees During Operation Allies Welcome — United States, September–November 2021. MMWR. April 29, 2022 *Jurisdictions refer to any of the 50 states, New York City, and the District of Columbia. 2020 From January 1 to December 31, 2020, 13 individual cases of measles were confirmed in 8 jurisdictions.* *Jurisdictions refer to any of the 50 states, New York City, and the District of Columbia. 2019 From January 1 to December 31, 2019, 1,274 individual cases of measles were confirmed in 31 states. This is the greatest number of cases reported in the United States since 1992. The majority of cases were among people who were not vaccinated against measles. Measles is more likely to spread and cause outbreaks in U.S. communities where groups of people are unvaccinated. For more information, please see the following reports: Increase in Measles Cases – United States, January 1-April 26, 2019. MMWR. May 3, 2019 National Update on Measles Cases and Outbreaks – United States, January 1-October 1, 2019. MMWR. October 11, 2019 National Update on Measles Cases and Outbreaks — United States, January 1–October 1, 2019. MMWR. October 11, 2019 Notes from the Field: Community Outbreak of Measles — Clark County, Washington, 2018–2019. MMWR. May 17, 2019 Notes from the Field: Measles Outbreaks from Imported Cases in Orthodox Jewish Communities — New York and New Jersey, 2018–2019. MMWR. May 17, 2019 *Jurisdictions refer to any of the 50 states, New York City, and the District of Columbia. 2018 From January 1 to December 31, 2018, 381 individual cases of measles were confirmed in 28 jurisdictions.* *Jurisdictions refer to any of the 50 states, New York City, and the District of Columbia. 2017 For more information, please see the following report: Measles Outbreak — Minnesota April–May 2017. MMWR. July 14, 2017 *Jurisdictions refer to any of the 50 states, New York City, and the District of Columbia. 2016 For more information please see the following reports: Notes from the Field: Measles Outbreak at a United States Immigration and Customs Enforcement Facility — Arizona, May–June 2016. MMWR. May 26, 2017 Measles Outbreak of Unknown Source — Shelby County, Tennessee, April–May 2016. MMWR. September 30, 2016 *Jurisdictions refer to any of the 50 states, New York City, and the District of Columbia. 2015 For more information please see the following reports: Measles — United States, January 4–April 2, 2015. MMWR. April 17, 2015 Measles Outbreak — California, December 2014–February 2015. MMWR. Feb 20, 2015 *Jurisdictions refer to any of the 50 states, New York City, and the District of Columbia. 2014 For more information please see the following reports: Measles Outbreak in an Unvaccinated Family and a Possibly Associated International Traveler — Orange County, Florida, December 2012–January 2013. MMWR. Sep 12, 2014 Notes from the Field: Measles in a Micronesian Community — King County, Washington, 2014. MMWR. Sep 12, 2014 Measles — United States, January 1–May 23, 2014. MMWR May 29, 2014 Notes from the Field: Measles — California, January 1–April 18, 2014. MMWR. Apr 25, 2014 *Jurisdictions refer to any of the 50 states, New York City, and the District of Columbia. 2013 For more information please see the following reports: Measles — United States, January 1-August 24, 2013. MMWR. Sep 13, 2013 Notes from the field: Measles outbreak among members of a religious community — Brooklyn, New York, March–June 2013. MMWR. Vol 62, No 36;752-3 09/13/2013 Notes from the field: Measles outbreak associated with a traveler returning from India — North Carolina, April–May 2013. MMWR. Vol 62, No 36;753 *Jurisdictions refer to any of the 50 states, New York City, and the District of Columbia. Learn more History of Measles Learn the history of measles, from the pre-vaccine era to measles elimination. Questions About Measles Get answers to questions about protecting against measles, measles vaccine and how measles spreads. On This Page Measles cases in 2025 Measles cases in 2024 What to know about measles Weekly measles cases by rash onset date Map of measles cases in 2024 & 2025 Yearly measles cases History of measles cases MMR vaccine coverage for kindergarteners by school year (2009–2024) Previous years Learn more February 28, 2025 Sources Print Share Facebook LinkedIn Twitter Syndicate Content Source: National Center for Immunization and Respiratory Diseases; Division of Viral Diseases"
