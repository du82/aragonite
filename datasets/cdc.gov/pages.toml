["https://cdc.gov/about/leadership/nchhstp.html"]
title = "National Center for HIV, Viral Hepatitis, STD, and TB Prevention (NCHHSTP) | About CDC | CDC"
description = "Learn about CDC’s mission to protect you 24-7."
full_description = "March 8, 2024 National Center for HIV, Viral Hepatitis, STD, and TB Prevention (NCHHSTP) Staff Bio Jonathan Mermin, MD, MPH, (RADM, USPHS, RET) is the Director of the National Center for HIV, Viral Hepatitis, STD, and TB Prevention (NCHHSTP), and a retired two-star Rear Admiral in the U.S. Public Health Service. Role at CDC Dr. Mermin leads the nation’s efforts to prevent HIV, viral hepatitis, sexually transmitted diseases, and tuberculosis. These infections affect millions of Americans and cause tens of thousands of deaths each year. NCHHSTP focuses on high impact prevention strategies that are cost-effective, scalable, and grounded in the latest research. These strategies save lives, save money, reduce health disparities, and protect the health of all Americans. Previous experience Dr. Mermin served as the Incident Manager for CDC's Mpox response for six months, where he led the agency's efforts to bring accurate information, testing, vaccination, and treatment to communities affected by Mpox, and worked to decrease health inequities associated with the virus. In 2021, during the COVID-19 pandemic, he served for several months as Acting Director of the Center for Preparedness and Response. From 2009-2013, Dr. Mermin directed CDC's Division of HIV Prevention, during which time HIV incidence decreased in the United States, due in part to CDC focusing on more effective interventions and distributing resources based on HIV epidemiology. He previously served as Director of CDC-Kenya and HHS Public Health Attaché for the U.S. Embassy from 2006-2009, and as Director of CDC-Uganda from 1999-2006. In Uganda, he oversaw implementation of the first antiretroviral treatment program funded by CDC outside of the United States. Education Dr. Mermin began his career at CDC in 1995 as an EIS officer with the Foodborne and Diarrheal Diseases Branch. He completed an internal medicine residency at San Francisco General Hospital and a preventive medicine residency at CDC and the California Department of Health Services. He is a graduate of Harvard College and Stanford University School of Medicine and received his MPH from Emory University. He has co-authored more than 200 scientific articles. He currently serves as an Adjunct Professor at Emory University School of Public Health. On This Page Role at CDC Previous experience Education March 8, 2024 Sources Print Share Facebook LinkedIn Twitter Syndicate Content Source: Centers for Disease Control and Prevention"
