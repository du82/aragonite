full_description = "November 19, 2024 Center for Forecasting and Outbreak Analytics (CFA) Staff Bio Dylan George, PhD, is the Director for the Center for Forecasting and Outbreak Analytics (CFA) at CDC. Role at CDC As the director of CFA, Dr. George is responsible for strengthening the nation’s ability to use data, models, and analytics to enable timely, effective decision-making in response to public health threats. Previous experience Before joining CDC, Dr. George was a vice president at Ginkgo Bioworks, where he helped develop improved real-time infectious disease monitoring capabilities and analytics for pandemic response. Prior to Ginkgo, Dr. George was a vice president at In-Q-Tel (IQT), where he vetted life science and healthcare deals, and developed science and technical strategies to strengthen capacity within the U.S. to counter biological threats from infectious disease. In addition, Dr. George has provided technical expertise and interagency coordination supporting the response to the Ebola outbreak in West Africa. Education Dr. George received his Doctor of Philosophy from Colorado State University and focused on quantitative analytical approaches for considering how clinically severe pathogens (e.g., Yersinia pestis, rabies) persist within wildlife populations. On This Page Role at CDC Previous experience Education November 19, 2024 Sources Print Share Facebook LinkedIn Twitter Syndicate Content Source: Centers for Disease Control and Prevention"
