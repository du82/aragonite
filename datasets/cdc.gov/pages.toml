["https://cdc.gov/adenovirus/hcp/outbreaks/index.html"]
title = "Guidelines for Outbreaks | Adenovirus | CDC"
description = "Adenoviruses are common and typically cause mild cold or flu-like symptoms."
full_description = "June 5, 2024 Guidelines for Outbreaks At a glance Different adenovirus types may cause outbreaks. Overview Health advisory CDC released a Health Alert Notice for clinicians and a media statement for parents and caregivers. Clinician guidelines Get clinical guidance for adenovirus Nucleic Acid Amplification Tests (NAATs), including PCR, and additional testing. Testing guidelines Instructions for testing, typing, and submission Adenoviruses usually cause respiratory illnesses or conjunctivitis, and outbreaks can occur throughout the year. There is no specific time of year when adenovirus infections and outbreaks are more common. Adenoviruses is not a nationally notifiable disease in the United States. Clinicians are not required to test for or report cases to health departments or CDC. Therefore, many outbreaks of adenovirus likely go either undetected or unreported. Adenovirus types that can cause outbreaks Reported sporadic cases and outbreaks of adenovirus have included: Acute respiratory illness Adenovirus types 3, 4 and 7 are most commonly associated with acute respiratory illness. Adenovirus type 14 which has been associated with outbreaks of acute respiratory illness among U.S. military recruits and the general public. Severe outcomes Adenovirus types 4 and 7 has been associated with more severe outcomes than other adenovirus types, particularly in people with weakened immune systems. In the last 10 years, instances of severe illness and death from adenovirus type 7 infection have been reported in the United States. Epidemic keratoconjunctivitis Adenovirus types 8, 19, 37, 53, and 54, which can cause epidemic keratoconjunctivitis. Gastroenteritis Enteric adenovirus types 40 and 41, which cause gastroenteritis, usually in children. Spread in bodies of water Some adenoviruses (e.g., 4 and 7) that spread in bodies of water, such as small lakes or swimming pools without adequate chlorine and can cause outbreaks of febrile disease with conjunctivitis. Health Professionals Should: If potential outbreaks in healthcare settings are identified, take appropriate infection control measures specific to adenovirus to help prevent or control outbreaks. This can include: active surveillance isolating ill patients when possible restricting visitors and new admissions monitoring staff for illness and sending them home when sick environmental cleaning using personal protective equipment frequent handwashing or sanitizing Keep Reading: Clinical Overview of Adenovirus On This Page Overview Clinician guidelines Testing guidelines Adenovirus types that can cause outbreaks Health Professionals Should: June 5, 2024 Sources Print Share Facebook LinkedIn Twitter Syndicate Content Source: National Center for Immunization and Respiratory Diseases; Coronavirus and Other Respiratory Viruses Division SourcesNational Center for Immunization and Respiratory Diseases, NCIRD Divisions and Offices Almendares, O., Baker, J. M., Sugerman, D. E., Parashar, U. D., Reagan-Steiner, S., Kirking, H. L., ... & Tate, J. E. (2024). Deaths Associated with Pediatric Hepatitis of Unknown Etiology, United States, October 2021–June 2023. Emerging Infectious Diseases, 30(4), 644. Biggs HM, Lu X, Dettinger L, Sakthivel S, Watson JT, Boktor SW. Adenovirus-Associated Influenza-Like Illness among College Students, Pennsylvania, USA. Emerg Infect Dis. 2018 Nov;24(11):2117-9. http://dx.doi.org/10.3201/eid2411.180488 Notes from the Field: Fatalities Associated with Human Adenovirus Type 7 at a Substance Abuse Rehabilitation Facility — New Jersey, 2017. MMWR. 2018;67:371–372. Killerby ME, Rozwadowski F, Lu X, et al. Respiratory Illness Associated With Emergent Human Adenovirus Genome Type 7d, New Jersey, 2016–2017, Open Forum Infectious Diseases, Volume 6, Issue 2, 1 February 2019, ofz017. Adenovirus-associated epidemic keratoconjunctivitis outbreaks — four states, 2008–2010. MMWR. 2013;62(32);637-41. James L, Vernon M, Jones R, et al. Outbreak of Human Adenovirus Type 3 Infection in a Pediatric Long-Term Care Facility—Illinois, 2005. Clinical Infectious Diseases. Volume 45, Issue 4, 15 August 2007, Pages 416–420."
