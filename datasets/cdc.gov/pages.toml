["https://cdc.gov/norovirus/prevention/index.html"]
title = "How to Prevent Norovirus | Norovirus | CDC"
description = "Norovirus is the leading cause of vomiting and diarrhea, and foodborne illness in the United States. Always wash your hands and handle food well."
full_description = "January 13, 2025 Español How to Prevent Norovirus Key points Norovirus is very contagious, but you can take steps to stop it from spreading. Wash hands well with soap and water; hand sanitizer alone does not work well against norovirus. Do not prepare, handle food, or care for others when you are sick. How norovirus spreads You can find norovirus in your vomit or feces (poop) even before you start feeling sick. The virus can also stay in your poop for 2 weeks or more after you feel better. You can still spread norovirus during that time. Keep Reading: How Norovirus Spreads Prevention steps and strategies If you are sick Do not prepare, handle food, or care for others. Wait at least 2 days (48 hours) after symptoms stop. This is important if you work in a restaurant, school, daycare, long-term care facility, or other places where you may expose people to norovirus. Wash your hands well Wash your hands often with soap and water for at least 20 seconds, especially: After using the toilet or changing diapers. Before eating, preparing, or handling food. Before giving yourself or someone else medicine. Be aware that: Hand sanitizer does not work well against norovirus. You can use hand sanitizers in addition to hand washing, but hand sanitizer is not a substitute for handwashing, which is best. Handle and prepare food safely View Larger Avoid steaming and instead cook oysters and other shellfish well. Before preparing and eating your food: Carefully wash fruits and vegetables well. Cook oysters and other shellfish thoroughly to an internal temperature of at least 145°F. Routinely clean and sanitize kitchen utensils, cutting boards, counters, and surfaces, especially after handling shellfish. Keep raw oysters away from ready-to-eat food in the grocery cart, refrigerator, and on cutting boards. Throw away food that might contain norovirus. Be aware that: Noroviruses are relatively resistant to heat and can survive temperatures as high as 145°F. Quick steaming processes will not heat foods enough to kill noroviruses. Food contaminated with norovirus may look, smell, or taste normal. Clean and disinfect surfaces View Larger Always clean well and disinfect the entire area immediately. After someone vomits or has diarrhea: Wear rubber or disposable gloves and wipe the entire area with paper towels and throw them in a plastic trash bag. Disinfect the area as directed on the product label. To disinfect, use a chlorine bleach solution with a concentration of 1,000 to 5,000 ppm (5 to 25 tablespoons of household bleach [5% to 8%] per gallon of water) or use an EPA-registered disinfecting product against norovirus. Leave bleach disinfectant on the affected area for at least 5 minutes. Clean the entire area again with soap and hot water. Wash laundry, take out the trash, and wash your hands. Wash laundry well Immediately remove and wash clothes or linens that may have vomit or poop on them. Wear rubber or disposable gloves. Handle items carefully without shaking them. Wash the items with detergent and hot water at the maximum available cycle length and then machine dry them at the highest heat setting. Wash your hands after with soap and water. Resources Clean Up After Someone with Norovirus Vomits or has Diarrhea – YouTube Preventing Norovirus at Youth Camps Norovirus Fact Sheet for Food Workers Communications Resources On This Page How norovirus spreads Prevention steps and strategies Resources January 13, 2025 Sources Print Share Facebook LinkedIn Twitter Syndicate Content Source: National Center for Immunization and Respiratory Diseases; Division of Viral Diseases"
