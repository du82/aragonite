["https://cdc.gov/flu/prevention/actions-prevent-flu.html"]
title = "Healthy Habits to Prevent Flu | Influenza (Flu) | CDC"
description = "Prevention and Control of Seasonal Influenza with Vaccines: Recommendations of the Advisory Committee on Immunization Practices — United States, 2024–25 Influenza Season"
full_description = "August 20, 2024 Español Healthy Habits to Prevent Flu What to know There are actions you can take to protect yourself and others from flu and help stop the spread of germs. ACIP Recommendations Recommendations of the Advisory Committee on Immunization Practices‎ Prevention and Control of Seasonal Influenza with Vaccines: Recommendations of the Advisory Committee on Immunization Practices — United States, 2024–25 Influenza Season Recommendations Tips to reduce the risk of seasonal flu The single best way to reduce the risk of seasonal flu and its potentially serious complications is to get vaccinated each year, but preventive actions like avoiding people who are sick, covering your cough and washing your hands also can help stop the spread of germs and prevent respiratory illnesses like flu. This also can include taking steps for cleaner air and hygiene practices like cleaning frequently touched surfaces. Preventing Respiratory Viruses Core strategies can help prevent the spread of viruses that cause common respiratory illnesses. Feb. 29, 2024 Flu: What To Do If You Get Sick Guide on what to do if you are sick Aug. 2, 2024 These tips will help you learn about actions you can take to protect yourself and others from flu and help stop the spread of germs. Avoid close contact. Avoid close contact with people who are sick. When you are sick, keep your distance from others to protect them from getting sick, too. Putting physical distance between yourself and others can help lower the risk of spreading a respiratory virus. Stay home when you are sick. If possible, stay home from work, school, and errands when you're sick. You can go back to your normal activities when, for at least 24 hours, both are true: Your symptoms are getting better overall, and You have not had a fever (and are not using fever-reducing medication1). After these two criteria are met, there are some additional precautions that can be taken to protect others from respiratory illness. Cover your mouth and nose. Cover your mouth and nose when coughing or sneezing. It may prevent those around you from getting sick. Influenza viruses are thought to spread mainly by droplets made when people with flu cough, sneeze or talk. Wearing a mask is an additional prevention strategy that you can choose to do to further protect yourself and others. When worn by a person with an infection, masks reduce the spread of the virus to others. Masks can also protect wearers from breathing in infectious particles from people around them. Clean your hands.Washing your hands often will help protect you from germs. If soap and water are not available, use an alcohol-based hand rub. Handwashing: Clean Hands Save Lives Tips on hand washing and using alcohol-based hand sanitizers Avoid touching your eyes, nose or mouth.Germs can be spread when a person touches something that is contaminated with germs and then touches his or her eyes, nose, or mouth. Take steps for cleaner air.You can improve air quality by bringing in fresh outside air, purifying indoor air or gathering outdoors. Cleaner air can reduce the risk of exposure to viruses. Practice good hygiene and other healthy habits.Cleaning frequently touched surfaces, such as countertops, handrails, and doorknobs regularly can help prevent the spread of some illnesses. Also, get plenty of sleep, be physically active, manage your stress, drink plenty of fluids, and eat nutritious food. Preventing Spread of Respiratory Viruses When You're Sick Take steps to protect others while you are sick and when you start to feel better. Feb. 29, 2024 Flu: What To Do If You Get Sick Guide on what to do if you are sick Aug. 2, 2024 Get Vaccinated‎ Seasonal flu vaccines protect against the three influenza viruses that research indicates will be most common during the upcoming season. There are several flu vaccine options this flu season. The tips and resources below will help you learn about additional actions you can take to protect yourself and others from flu and help stop the spread of germs. Different Types of Flu Vaccines Preventing Flu at School Find out about plans your child's school, childcare program, and/or college has if an outbreak of flu or another illness occurs and whether flu vaccinations are offered on-site. Ask your child's school, childcare program, and/or college about whether they routinely clean frequently touched objects and surfaces, and whether they have a good supply of tissues, soap, paper towels, alcohol-based hand rubs, and disposable wipes on-site. Also ask your child's school, childcare program, and/or college about whether they take steps for cleaner air. Ask how sick students and staff are separated from others and who will care for them until they can go home, and about the absentee policy for sick students and staff. Preventing Flu at Work Find out about your employer's plans if an outbreak of flu or another illness occurs and whether flu vaccinations are offered on-site. Routinely clean frequently touched objects and surfaces, including doorknobs, keyboards, and phones, to help remove germs. Make sure your workplace has an adequate supply of tissues, soap, paper towels, alcohol-based hand rubs, and disposable wipes. Train others on how to do your job so they can cover for you in case you or a family member gets sick and you have to stay home. If you begin to feel sick while at work, go home as soon as possible. Did you know?‎ Nonpharmaceutical interventions (NPIs), are actions – apart from getting vaccinated or taking medicine – that people and communities can take to help slow the spread of illnesses like flu. Materials for Promoting Flu Prevention Everyday Preventive Actions Stay Healthy (Everyday Prevention Actions) Size: 8.5″ x 11″ May 31, 2019 Download Download Every Day Preventive Actions (Spanish) Everything you need to know about the flu illness, including symptoms, treatment and prevention. Jan. 17, 2022 Download Download On This Page ACIP Recommendations Tips to reduce the risk of seasonal flu Preventing Flu at School Preventing Flu at Work Materials for Promoting Flu Prevention August 20, 2024 Sources Print Share Facebook LinkedIn Twitter Syndicate Content Source: National Center for Immunization and Respiratory Diseases (NCIRD) ReferencesMore information about how long people are contagious with flu and what to do if you did not have a fever is available at Flu: What To Do If You Get Sick."
