["https://cdc.gov/about/leadership/coo.html"]
title = "Office of the Chief Operating Officer (OCOO) | About CDC | CDC"
description = "Learn about CDC’s mission to protect you 24-7."
full_description = "January 17, 2024 Office of the Chief Operating Officer (OCOO) Staff Bio Robin D. Bailey Jr., MA, is the Chief Operating Officer of CDC, one of 10 major operating divisions of the Department of Health and Human Services (HHS). CDC Chief Operating Officer, Robin D. Bailey Jr., MA Role at CDC In this role, Bailey oversees management, facilities, and operations at the Atlanta-based public health agency. Specifically, Bailey provides executive oversight for CDC's budget; facilities design, maintenance, security, management analysis, and safety and personnel security; acquisitions, contractual assistance, and grants; information technology and security; and human resources strategy, training, and workplace development. Previous experience Bailey has more than 30 years of service in various senior level positions within the Internal Revenue Service (IRS), the U.S. Department of Agriculture (USDA), and the U.S. Department of the Air Force. As IRS's Human Capital Officer, he provided executive leadership and direction to nearly 2,000 professionals to manage recruitment, hiring, employee development, retention, performance management, payroll, employee services, workforce relations, employee engagement, and recognition programs for more than 80,000 IRS employees. Prior to IRS, Bailey served as Southeast Regional Administrator with the USDA’s Food and Nutrition Service (FNS) in Atlanta, Georgia. He provided executive leadership to orchestrate the execution of all 15 federal nutrition assistance programs that provided more than $25 billion in benefits each year through cooperating state agencies in Alabama, Florida, Georgia, Kentucky, Mississippi, North Carolina, South Carolina, and Tennessee. Prior to this position, he served as the FNS Deputy Administrator for Management and Information Technology in Alexandria, Virginia, where he provided executive oversight of information technology, human resources, contract management, and logistics and facility services. Prior to FNS, he served as Director of Human Resources Management at the U.S. Forest Service in Albuquerque, New Mexico, where he led more than 600 staff who provided human resources management policy and operational services for nearly 50,000 employees. Bailey is an Air Force veteran and served as an Air Force civilian in a wide range of leadership positions, including the Civilian Deputy and Staff Director to the 96th Air Base Wing Commander at Eglin Air Force Base in Florida. In this role he co-led more than 5,000 service members in providing essential base operating support and services for more than 20,000 personnel and family dependents, six wings, and 50 associate units. Education Bailey holds an undergraduate degree from Park College (now Park University), in Parkville, Missouri, and a Master of Arts degree in communications from the University of Oklahoma. On This Page Role at CDC Previous experience Education January 17, 2024 Sources Print Share Facebook LinkedIn Twitter Syndicate Content Source: Centers for Disease Control and Prevention"
