["https://cdc.gov/about/speakers/index.html"]
title = "CDC Speakers Bureau | About CDC | CDC"
description = "Tools, resources, and frequently asked questions for requesting a CDC speaker for your event."
full_description = "February 8, 2024 CDC Speakers Bureau At a glance Request a CDC speaker for your event and read frequently asked questions. About the Speakers Bureau The CDC Speakers Bureau has been in existence since August 1998. It evolved as a means to meet the public's request for first-hand/real-time information on hot topics and emerging public health issues. Since its inception, the Speakers Bureau has received requests from stakeholders around the world such as community organizations, business corporations, and non-profit organizations. CDC employees from all disciplines volunteer their time to engage communities about the agency's public health impact. The topics span a multitude of health concerns including influenza, emergency preparedness, women's health, obesity, immunizations, and HIV/AIDS. The main focus of each presentation is to communicate information that the audience need to protect their health – through health promotion, prevention of disease, injury and disability, and preparedness for new health threats. Request a Speaker Your speaker’s request will take 6-8 weeks to process, so please submit your request accordingly. CDC Director: Speaker Request To request the CDC Director’s participation (attending or speaking) in an event or meeting, please fill out the CDC Director Speaker request form. Community & School Events Request a CDC Ambassador to participate in your school event, career day, STEM event, or to conduct a handwashing demonstration. Frequently Asked Questions How do I request a speaker? For general speaker requests, complete the speaker request form. To request the CDC Director, complete the CDC Director request form. How far in advance should I request a speaker? All requests should be submitted at least 6-8 weeks prior to your event date, and a maximum of 6 months prior to your event. Am I guaranteed to have a speaker for my event? No. We make every attempt to fill all requests; however, CDC Speakers Bureau participants are volunteers and may not be available for all events. Do I have to pay a fee or honoraria for a speaker? No. This is a free service. However, it is customary for the host organization to pay for travel expenses. Who is responsible for paying travel expenses? It is customary for the host organization to pay travel expenses. Are there any events not entitled to receive Speakers Bureau services? Yes. Speakers cannot participate in events for the purpose of fundraising, promotions, or any type of endorsements. Do you want CDC to participate in your career day, health fair, or facilitate a handwashing demonstration at your event? CDC staff are available to come to schools and community events. If you want CDC participation in one of the following: health fairs, career days, or handwashing demonstrations, fill out the form on the community & school events page. On This Page About the Speakers Bureau Request a Speaker CDC Director: Speaker Request Community & School Events Frequently Asked Questions February 8, 2024 Sources Print Share Facebook LinkedIn Twitter Syndicate Content Source: Centers for Disease Control and Prevention"
