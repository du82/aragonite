["https://cdc.gov/about/leadership/cos.html"]
title = "Office of the Chief of Staff | About CDC | CDC"
description = "Learn about CDC’s mission to protect you 24-7."
full_description = "February 24, 2025 Office of the Chief of Staff Staff Bio Matthew Buzzelli is the chief of staff at CDC. Role at CDC In this role, Buzzelli provides strategic counsel to the CDC director and ensures proactive coordination of agency-wide priorities and policies in direct support of CDC’s mission. He is also responsible for executive oversight for numerous agency-wide initiatives to promote and advance public health. Previous experience Buzzelli is a seasoned legal professional with a distinguished career as a trial attorney assigned to the Department of Justice's Criminal Division in Washington, DC. Buzzelli was responsible for leading and overseeing several high-profile investigations on behalf of the US government. Buzzelli previously worked with the Family Office of Norm Miller to support the development of Interstate Batteries' emerging retail and commercial operation. In this capacity, Buzzelli reported directly to the chairman, and played a critical role serving as an advisor while developing key performance indicators for this endeavor. Buzzelli served on the local Airport Authority and Industrial Building Authority and later joined the private equity firm Propeller Airports, LLC in Everett, WA as vice president of Government Relations & In-House Counsel. In this role, he supported Propeller's mission in developing public/private partnerships centered around FAA-controlled assets. He also engaged with local, state, and federal officials and representatives to build and maintain productive relationships vital to Propeller's initiatives. Buzzelli earlier launched The Tekoa Group, a professional, scientific, and technical consultant service that assisted early-stage companies. He previously served on the board of advisors for several entities that specifically focused on cutting edge solutions developing artificial intelligence and machine learning (AI/ML) use cases within the intelligence community and security spaces. On This Page Role at CDC Previous experience February 24, 2025 Sources Print Share Facebook LinkedIn Twitter Syndicate Content Source: Centers for Disease Control and Prevention"
