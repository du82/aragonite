["https://cdc.gov/about/speakers/request-director.html"]
title = "CDC Director: Speaker Request | About CDC | CDC"
description = "Please let us know by emailing the speakersbureau@cdc.gov mailbox. We apologize for any inconvenience."
full_description = '''February 9, 2024 CDC Director: Speaker Request At a glance Request the CDC Director for your event. Requesting the CDC Director: Simply complete all of the fields in the CDC Director speaker request form below and press the submit button. A CDC representative will review your request and contact you. We appreciate you making every effort to submit this form at least 60 days before your event (and a maximum of 6 months prior to your event). Requests of extremely short notice (within 30 days of the event) may not be processed since it will not allow for adequate staffing coordination. Please review the CDC Speakers Bureau Privacy Policy to understand how we use the information gathered to complete speaker requests. If you have any questions or concerns, please contact the Speakers Bureau. All fields are required and must be filled out to submit a request. Request Form Contact Email*Please enter your email addressEvent OverviewEvent Title:*Name of Organization Hosting Event:*Description of Organization:*Event Location:*Event date:*Event start time:*End Time:*Director's participation requested start time*Director's participation requested end time*Please Select Time Zone*Eastern Standard TimeCentral Standard TimeMountain Standard TimePacific Standard TimeContact PersonContact Person:*Contact Office Phone:*Contact Cell Number:*Contact Email:*Event DetailsIs the event flexible?*YesNoWhat is the purpose of this event?:*Proposed role of Director?*Select:SpeakerAttendeeVideo Taped RemarksIf the Director is unable to attend, would you be interested in hosting another CDC speaker?*YesNoIf the Director is unable to attend in person, would joining by video teleconference be an option?*YesNoIf the Director is unable to attend in person or by video teleconference, would a pre-recorded message be an option?*YesNoEvent Link:*Event Link for Director's assistants, if different:*Presentation DetailsTopic of Presentation:*Type of Presentation:*Select:Break-out SessionClosing RemarksKeynote AddressOpening RemarksPanel DiscussionPlenaryIf panel, please provide a list of other invited and/or confirmed panelists.*Other Speakers from CDC:*Length of Presentation:*PowerPoint Requested?*YesNoIf the Director has a last-minute urgent schedule changes, is an alternate speaker acceptable?*YesNoWhat is the Director's requested participation time?*Speaking Time:*Q&A:*Listening to Discussion:*Other:*RemarksWhat specific public health topic(s) would you like the Director to address at this event?*Audience and Key Participants:*Select all key participantsStudentsElected OfficialsBusiness LeadersEducatorsPublic Health/Medical ProfessionalsGeneral PublicMediaOtherAudience Size:*Who will introduce the Director?*After the Director's presentation, should she turn the "podium" over to someone else? If so, who is that person?*If there will be Q&A, will topics/questions be available ahead of time? Who will moderate the discussion?*Are there any other speakers at this event? If so, who?*Please identify other speakers equal to or higher than the Director's level.*Please identify any US government officials speaking at or attending this event:*Please identify any other speakers from CDC requested for this event:*Is this event open to the public or invite only?*Will this event be recorded or livestreamed?*Will the recording be posted on the web for future viewing?*Will media be present?*If so, which media outlets will attend?* Additional DetailsPlease list any social media accounts that plan to cover the event: *In your eyes, what would make this event a success?(optional)If prerecorded remarks are acceptable or requestedPreferred file format:*Who should receive the finished recording?*What is the deadline for receiving the recording?*Does it need to be closed captioned?*Would you like the Director's name and title shown at the bottom of the screen during the opening of the recording (similarly to how names and titles are shown during news interviews)?*Additional comments/information: * This site is protected by reCAPTCHA and the Google Privacy Policy and Terms of Service apply. var onSubmit = function(token) { CDC.validation.onSubmitHandler(); }; Submit* Required field Experiencing Challenges Submitting Your Speakers Request?‎ Please let us know by emailing the speakersbureau@cdc.gov mailbox. We apologize for any inconvenience. February 9, 2024 Sources Print Share Facebook LinkedIn Twitter Syndicate Content Source: Centers for Disease Control and Prevention'''
