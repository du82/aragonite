["https://cdc.gov/about/leadership/orr.html"]
title = "Office of Readiness and Response (ORR) | About CDC | CDC"
description = "Learn about CDC’s mission to protect you 24-7."
full_description = '''January 18, 2024 Office of Readiness and Response (ORR) Staff Bio Henry Walke, MD, MPH, has dedicated his public health career to serving CDC in an array of leadership roles. Currently, Dr. Henry Walke is the Director of the Office of Readiness and Response (ORR). Role at CDC In this role, Dr. Walke supports ORR's four divisions and the CDC Immediate Office of the Director to prepare for, respond to, and improve performance in domestic and global public health emergencies. He plays a critical part in setting the strategic and management priorities for readiness and response programming at the Agency, and is a core partner with CDC's federal, state and local, and community public health organizations. ORR provides programmatic and financial support to advance and enhance state and local health department readiness, response, and recovery capacity. It ensures lifesaving research with select agents and toxins, as well as poliovirus containment, is conducted safely and securely. ORR also develops scientific principles, tools, and the next generation of public health preparedness professionals and leaders and leads continuous improvement in and advancement and implementation of the science of readiness and response. Previous experience From July 2020 through September 2021, Dr. Walke served as incident manager of CDC's COVID-19 response, and as a chief CDC spokesperson. Under his leadership, the response published 8 scientific briefs and over 600 articles in the "Morbidity and Mortality Weekly Report" and other scientific literature. Over 9,000 CDC employees were involved in the response during his tenure there. Prior to joining ORR, Dr. Walke served as director of the Division of Preparedness and Emerging Infections in the National Center for Emerging and Zoonotic Infectious Diseases and before that he was chief of the Bacterial Special Pathogens Branch in the Division of High-Consequence Pathogens and Pathology. In those roles, Dr. Walke collaborated across CDC and with national and international partners to address preparedness and response issues for bioterrorism, emerging infections, and other infectious disease emergencies. In previous roles at CDC, Dr. Walke helped expand the Field Epidemiology and Laboratory Training Program, especially in Asia and the Americas. He joined CDC in 2001 as a medical officer based in Amman, Jordan, leading a Field Epidemiology Training Program and working with Jordan's Ministry of Health to strengthen its infectious and non-communicable disease surveillance and reporting systems. Dr. Walke has worked extensively on CDC's anthrax preparedness efforts, co-chairing the HHS Anthrax Integrated Program Team and taking on co-chair duties for CDC's Anthrax Coordination Unit, which supports the agency's preparedness and response strategy for an anthrax incident. He also played prominent roles in multiple CDC emergency responses, including serving as the EOC's incident manager or deputy incident manager for the Zika, Ebola, and COVID-19 responses and contributing to several hurricane responses (Harvey, Irma, Maria, and Florence), the anthrax Department of Defense incident, and a Burkholderia pseudomallei incident in nonhuman primates. Education Dr. Walke earned undergraduate and medical degrees (with honors) from the University of North Carolina at Chapel Hill, and a Masters in Public Health from Johns Hopkins School of Hygiene and Public Health. He has been board-certified in family medicine and preventive medicine, has coauthored about 55 scientific publications, and has received numerous awards for public health achievements. His professional interests include preparedness and emergency response; surveillance and epidemiology; global health; and supporting the creation of diverse, inclusive work environments that facilitate cooperation and productivity. On This Page Role at CDC Previous experience Education January 18, 2024 Sources Print Share Facebook LinkedIn Twitter Syndicate Content Source: Centers for Disease Control and Prevention'''
