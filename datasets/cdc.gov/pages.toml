full_description = 'CDC Nondiscrimination Notice Print Minus Related Pages <div class="noscript"><a href="//www.youtube-nocookie.com/embed/THChx6WGChg?autohide=0&amp;enablejsapi=1&amp;playerapiid=6202&amp;modestbranding=1&amp;rel=0&amp;origin=https://www.cdc.gov?autohide=0&amp;enablejsapi=1&amp;playerapiid=6202&amp;modestbranding=1&amp;rel=0&amp;origin=https://www.cdc.gov&amp;wmode=opaque?enablejsapi=1" target="_blank" rel="noopener noreferrer">CDC Non-Discrimination Policy in ASL</a></div>Low Resolution VideoThe Centers for Disease Control and Prevention complies with applicable Federal civil rights laws and does not discriminate on the basis of race, color, national origin, age, disability, or sex. CDC does not exclude people or treat them differently because of race, color, national origin, age, disability, or sex. CDC: Provides free aids and services to people with disabilities to communicate effectively with us, such as: Qualified sign language interpreters Written information in other formats (large print, audio, accessible electronic formats, other formats) Provides free language services to people whose primary language is not English, such as: Qualified interpreters Information written in other languages If you need these services, contact CDC at 800-232-4636. If you believe that CDC has failed to provide these services or discriminated in another way on the basis of race, color, national origin, age, disability, or sex, you can file a grievance with the U.S. Department of Health and Human Services, Office for Civil Rights, electronically through the Office for Civil Rights Complaint Portal, or by mail or phone at: U.S. Department of Health and Human Services 200 Independence Avenue, SW Room 509F, HHH Building Washington, D.C. 20201 1-800-368-1019, 800-537-7697 (TDD) Last Reviewed: November 8, 2022 Source: Centers for Disease Control and Prevention Facebook Twitter LinkedIn Syndicate'
