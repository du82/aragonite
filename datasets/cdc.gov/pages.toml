["https://cdc.gov/spanish/acercacdc/director.html"]
title = "Directora interina, primera asistente del director, subdirectora principal | Acerca de los CDC | CDC en Español"
description = "Mandy K. Cohen, MD, MPH, Director, Centers for Disease Control and Prevention; Administrator, Agency for Toxic Substances and Disease Registry"
full_description = "Directora interina, primera asistente del director, subdirectora principal Inglés (English) Imprimir Minus Related Pages Como subdirectora principal, Susan Monarez, PhD, también será designada primera asistente del director. Como primera asistente del director, actuará como directora interina de los CDC y administradora de la ATSDR a partir del 23 de enero del 2025. Experiencia previa La Dra. Monarez llega a los CDC de la Agencia de Proyectos de Investigación Avanzada para la Salud (Advanced Research Projects Agency for Health, ARPA-H), de la cual fue subdirectora desde enero del 2023. Antes de unirse a ARPA-H, la Dra. Monarez dirigió iniciativas de alto impacto enfocadas en el uso ético de la inteligencia artificial y el aprendizaje automático para respaldar mejores resultados de salud; enfoques innovadores para abordar la asequibilidad y accesibilidad de la atención médica; ampliar el acceso a intervenciones de salud mental y conductual, poner fin a la epidemia de opioides, abordar las disparidades en la salud de la morbilidad y mortalidad materna, y mejorar los programas de donación y trasplante de órganos del país. La Dra. Monarez se desempeñó en la Oficina de la Casa Blanca para Políticas de Ciencia y Tecnología y en el Consejo de Seguridad Nacional de los Estados Unidos, donde dirigió esfuerzos para mejorar las capacidades de innovación biomédica del país, como por ejemplo, combatir la resistencia a los antimicrobianos, ampliar el uso de tecnología ponible para promover la salud del paciente, garantizar la privacidad de la información de salud personal, y mejorar la preparación para hacer frente a las pandemias. También ha ocupado cargos de liderazgo en el Departamento de Seguridad Nacional, y ha dirigido numerosas iniciativas de cooperación internacional para promover investigación y desarrollo bilateral y multilateral en innovación de la salud. Susan Monarez, PhD Última revisión: el 11 de febrero del 2025 Fuente: Centros para el Control y la Prevención de Enfermedades Facebook Twitter LinkedIn Syndicate"
