["https://cdc.gov/media/releases/2025/2025-cdc-reports-decline-in-us-drug-overdose-deaths.html"]
title = "CDC Reports Nearly 24% Decline in U.S. Drug Overdose Deaths | CDC Newsroom"
description = "CDC public health news, press releases, government public health news, medical and disease news, story ideas, photos."
full_description = '''CDC Reports Nearly 24% Decline in U.S. Drug Overdose Deaths Release For immediate release: February 25, 2025 CDC Media Relations(404) 639-3286media@cdc.govhttps://www.cdc.gov/media/ New provisional data from CDC's National Vital Statistics System predict a nearly 24% decline in drug overdose deaths in the United States for the 12 months ending in September 2024, compared to the previous year. This is the most recent national data available and shows a continued steep decline in overdose deaths. Provisional data shows about 87,000 drug overdose deaths from October 2023 to September 2024, down from around 114,000 the previous year. This is the fewest overdose deaths in any 12-month period since June 2020. "It is unprecedented to see predicted overdose deaths drop by more than 27,000 over a single year," said Allison Arwady, MD, MPH, Director of CDC's National Center for Injury Prevention and Control. "That's more than 70 lives saved every day. CDC's public health investments, our improved data and laboratory systems for overdose response, and our partnerships with public safety colleagues in every state mean that we are more rapidly identifying emerging drug threats and supporting public health prevention and response activities in communities across America." While this national decline is encouraging news, overdose remains the leading cause of death for Americans aged 18-44, highlighting the importance of sustained efforts to ensure this progress continues. President Trump first declared opioid overdose to be a public health emergency in 2017, a designation that remains in place, and the subsequent public health investments to CDC from Congress have transformed the nation's ability to use data to save lives. In the most recent data, 45 states showed declines in overdose deaths, but five states—Alaska, Montana, Nevada, South Dakota, and Utah—still saw increases in overdose deaths, highlighting the continued need for rapid local data and tailored response. In addition to the large provisional drop in fatal overdoses, we also see smaller decreases in nonfatal overdoses, as measured by emergency department visits for overdose, and welcome continued decreases in self-reported youth substance use. Multiple factors contribute to the drop in overdose deaths, including widespread, data-driven distribution of naloxone, which is a life-saving medication that can reverse an overdose; better access to evidence-based treatment for substance use disorders; shifts in the illegal drug supply; a resumption of prevention and response after pandemic-related disruptions; and continued investments in prevention and response programs like CDC's flagship Overdose Data to Action (OD2A) program. CDC's OD2A program provides the United States with robust data through its fatal (SUDORS) and nonfatal (DOSE) overdose data systems. Currently, 49 state and 41 local health departments receive OD2A funding to collect, improve, and immediately use the data in their communities to implement life-saving activities. For example, the OD2A program funds comprehensive laboratory testing, which allows us to identify emerging substances involved in nonfatal and fatal overdoses and quickly highlight geographic shifts in the illegal drug supply. State and local public health departments, in partnership with CDC experts, use the data to inform where, what, and when overdose prevention efforts are needed in communities to have the greatest impact and save lives. Finally, CDC funds the Overdose Response Strategy, an innovative public health-public safety data collaboration in every state which allows public safety professionals like law enforcement officials to use data to better understand and intercept illegal drugs. We are moving in the right direction, and we must accelerate and strengthen CDC's continued investments in prevention to reduce overdose deaths. Expanding access to evidence-based treatment for substance use disorders—including medications for opioid use disorder such as buprenorphine and methadone—is important, in addition to building more community-driven interventions and promoting education and early intervention to prevent substance use disorders before they begin. For more information on CDC's overdose prevention efforts and data, visit: What CDC is Doing | Overdose Prevention | CDC ### U.S. DEPARTMENT OF HEALTH AND HUMAN SERVICES Whether diseases start at home or abroad, are curable or preventable, chronic or acute, or from human activity or deliberate attack, CDC’s world-leading experts protect lives and livelihoods, national security and the U.S. economy by providing timely, commonsense information, and rapidly identifying and responding to diseases, including outbreaks and illnesses. CDC drives science, public health research, and data innovation in communities across the country by investing in local initiatives to protect everyone’s health. Sources Print Share Facebook LinkedIn Twitter Syndicate Content Source: Office of Communications (OC)'''
author = "CDC"
year_published = 2025
