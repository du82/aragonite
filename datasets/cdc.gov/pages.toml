["https://cdc.gov/bird-flu/hcp/case-definition/index.html"]
title = "Case Definitions for Investigations of Human Infection with Avian Influenza A Viruses in the United States | Bird Flu | CDC"
description = "CDC has developed new interim recommendations for prevention, monitoring, and public health investigations of highly pathogenic avian influenza A(H5N1) virus in animals. Updates to this page are forthcoming."
full_description = "May 3, 2024 Español Case Definitions for Investigations of Human Infection with Avian Influenza A Viruses in the United States What to know This document provides guidance for state and local health departments conducting investigations of possible human infections with avian influenza A viruses in the United States. The following definitions are for the purpose of investigations of confirmed cases, probable cases, and cases of avian influenza A virus infection under investigation in the United States. Until further notification, CDC is requesting notification of all possible cases of avian influenza A virus infection (confirmed, probable and suspected/case under investigation). Human Infection with Avian Influenza Virus Case Definitions Notice‎ CDC has developed new interim recommendations for prevention, monitoring, and public health investigations of highly pathogenic avian influenza A(H5N1) virus in animals. Updates to this page are forthcoming. Recommendations Confirmed Case: Avian influenza A virus infection in a person that is confirmed by CDC's Influenza Division Laboratory or a CDC designated laboratory using methods mutually agreed upon by CDC and the Council of State and Territorial Epidemiologists (CSTE). Suspected Case (also called Case Under Investigation): A person meeting criteria for avian influenza A virus infection below and for whom confirmatory laboratory test results are unknown or pending. Probable Case: A person meeting criteria for avian influenza A virus infection below and for whom laboratory test results do not provide a sufficient level of detail to confirm HPAI A H5 virus infection. Criteria for Avian Influenza A Virus Testing Testing should be performed on persons who meet Epidemiologic criteria AND either Clinical OR Public Health Response criteria. Epidemiologic Criteria Persons with recent exposure (within 10 days) to avian influenza A viruses through one of the following: Exposure to A(H5), A(H7), or A(H9) virus infected birds is defined as follows: Close exposure (within 2 meters) to birds, with confirmed avian influenza A virus infection by A(H5), A(H7), or A(H9) viruses. Bird exposures can include, but are not limited to handling, slaughtering, defeathering, butchering, culling, or preparation of birds for consumption; OR Direct contact with surfaces contaminated with feces or bird parts (e.g., carcasses, internal organs) from infected birds; OR Visiting a live poultry market with confirmed bird infections or associated with a case of human infection with avian influenza A virus. Exposure to an infected person – Close (within 2 meters) unprotected (without use of respiratory and eye protection) exposure to a person who is a confirmed, probable, or symptomatic suspected case of human infection with avian influenza A virus (e.g. in a household or healthcare facility). Laboratory exposure – Unprotected (without use of respiratory and eye protection) exposure to avian influenza A virus in a laboratory. Clinical Criteria Persons with signs and symptoms consistent with acute or lower respiratory tract infection or conjunctivitis, or complications of acute respiratory illness without an identified cause. Examples include but are not limited to: Mild flu-like illness (cough, sore throat, fever or feeling feverish, rhinorrhea, fatigue, myalgia, arthralgia, headache) or conjunctivitis (red eye, discharge from eye) Moderate to severe illness: shortness of breath or difficulty breathing, altered mental status, seizures Complications: pneumonia, respiratory failure, acute respiratory distress syndrome, multi-organ failure, meningoencephalitis Public Health Response Criteria Asymptomatic persons whom public health authorities, in consultation with CDC, determine that testing is needed in order to assess the clinical spectrum of infection with avian influenza A virus as part of public health investigations. Additional Resources Avian Influenza Current Situation Summary Reported Human Infections with Avian Influenza A Viruses Guidance Type Summary for Clinicians Summary of guidance for all viruses that have the potential to cause severe disease Testing and Reporting Guidance for all viruses that have the potential to cause severe disease Case Definitions Avian Influenza A Viruses in the United States Infection Control Guidance for all viruses that are associated with severe disease Treatment Guidance for all viruses that are associated with severe disease Chemoprophylaxis of Persons Exposed to Birds Guidance for all viruses that have the potential to cause severe disease Guidance for all viruses that are associated with severe disease Chemoprophylaxis of Follow-up of Close Contacts Guidance for all viruses that are associated with severe disease On This Page Human Infection with Avian Influenza Virus Case Definitions Criteria for Avian Influenza A Virus Testing Guidance Type May 3, 2024 Sources Print Share Facebook LinkedIn Twitter Syndicate Content Source: National Center for Immunization and Respiratory Diseases (NCIRD)"
