description = "Language assistance for people who speak or read Spanish, Chinese, Vietnamese, Korean, Tagalog, Russian, Arabic, Haitian Creole, French, Polish, Portuguese, Italian, German, Japanese, Farsi, or English."
full_description = 'Error processing SSI file Language Assistance Services – CDC Print Minus Related Pages In November of 2023, the U.S. Department of Health and Human Services (HHS) updated its 2013 Language Access Plan in an effort to “ensure greater access to the life-saving services that HHS provides for people with Limited English Proficiency (LEP) and people with disabilities.” Consistent with the updated HHS plan, CDC launched a 2024 plan which outlines the action steps the agency will take to meet the language access needs of the public while continuing to support communities that may be underserved and improving access to information for people with LEP and people with disabilities. The strategic actions within the CDC plan prioritize efforts that will advance language accessibility to public health information and the agency’s communication with the public. The plan can be found online here: https://www.hhs.gov/sites/default/files/cdc-language-access-plan-2024.pdf <div class="noscript"><a href="//www.youtube-nocookie.com/embed/qXiaNB1Nua4?autohide=0&amp;enablejsapi=1&amp;playerapiid=6208&amp;modestbranding=1&amp;rel=0&amp;origin=https://www.cdc.gov?autohide=0&amp;enablejsapi=1&amp;playerapiid=6208&amp;modestbranding=1&amp;rel=0&amp;origin=https://www.cdc.gov&amp;wmode=opaque?enablejsapi=1" target="_blank" rel="noopener noreferrer">CDC language assistance services notice in ASL</a></div>Low Resolution Video Languages on this page Español (Spanish)繁體中文 (Chinese)Tiếng Việt (Vietnamese)한국어 (Korean)TagalogРусский (Russian)العربية (Arabic)Kreyòl Ayisyen (Haitian Creole) Français (French)Polski (Polish)Português (Portuguese)Italiano (Italian)Deutsch (German)日本語 (Japanese)فارسی (Farsi)English Español (Spanish) ATENCIÓN: Si habla español, tiene a su disposición servicios gratuitos de asistencia lingüística. Llame al 1-800-232-4636. Los Centros para el Control y la Prevención de Enfermedades (CDC) de los EE. UU. cumplen con las leyes federales de derechos civiles aplicables y no discriminan por motivos de raza, color, nacionalidad, edad, discapacidad o sexo. Los CDC no excluyen a las personas ni las trata de forma diferente debido a su origen étnico, color, nacionalidad, edad, discapacidad o sexo. Los CDC: Proporcionan asistencia y servicios gratuitos a las personas con discapacidades para que se comuniquen de manera eficaz con nosotros; algunos de esos servicios son: Intérpretes de lenguaje de señas capacitados. Información escrita en otros formatos (letra grande, audio, formatos electrónicos accesibles, otros formatos). Proporcionan servicios lingüísticos gratuitos a las personas cuyo idioma materno no es el inglés; algunos de esos servicios son: Intérpretes capacitados. Información escrita en otros idiomas. Si necesita recibir estos servicios, comuníquese con los CDC al 1-800-232-4636. Si considera que el Departamento de Salud y Servicios Humanos (HHS) no le proporcionó estos servicios o lo discriminó de otra manera por motivos de origen étnico, color, nacionalidad, edad, discapacidad o sexo, puede presentar un reclamo a la Oficina de Derechos Civiles (Office for Civil Rights) del Departamento de Salud y Servicios Humanos de los EE. UU. de manera electrónica a través del portal de “Office for Civil Rights Complaint”, disponible en https://ocrportal.hhs.gov/ocr/smartscreen/main.jsf, o bien, por correo postal a la siguiente dirección o por teléfono a los números que figuran a continuación: U.S. Department of Health and Human Services 200 Independence Avenue, SW Room 509F, HHH Building Washington, D.C. 20201 1-800-368-1019, 800-537-7697 (TDD) Top of Page 繁體中文 (Chinese) 注意：如果您使用繁體中文，您可以免費獲得語言援助服務。請致電 1-877-696-6775。 U.S. Department of Health and Human Services（HHS、美國衛生及公共服務部）遵守適用的聯邦民權法律規定、不因種族、膚色、民族血統、年齡、殘障或性別而歧視任何人。HHS 不因種族、膚色、民族血統、年齡、殘障或性別而排斥任何人或以不同的方式對待他們。 HHS 向殘障人士免費提供各種援助和服務、以幫助他們與我們進行有效溝通、如： 合格的手語翻譯員 以其他格式提供的書面資訊（大號字體、音訊、無障礙電子格式、其他格式） 向母語非英語的人員免費提供各種語言服務，如： 合格的翻譯員 以其他語言書寫的資訊 如果您需要此類服務、請聯絡 HHS 撥打 1-877-696-6775 如果您認為 HHS 未能提供此類服務或者因種族、膚色、民族血統、年齡、殘障或性別而透過其他方式歧視您、您可以向U.S. Department of Health and Human Services的 Office for Civil Rights（民權辦公室）提交民權投訴、透過 Office for Civil Rights Complaint Portal 以電子方式投訴：https://ocrportal.hhs.gov/ocr/smartscreen/main.jsf，或者透過郵寄或電話的方式投訴： U.S. Department of Health and Human Services 200 Independence Avenue, SW Room 509F, HHH Building Washington, D.C. 20201 1-800-368-1019、800-537-7697 (TDD)（聾人用電信設備） Top of Page Tiếng Việt (Vietnamese) CHÚ Ý: Nếu bạn nói Tiếng Việt, có các dịch vụ hỗ trợ ngôn ngữ miễn phí dành cho bạn. Gọi số 1-877-696-6775. U.S. Department of Health and Human Services (HHS, Bộ Y Tế và Dịch Vụ Nhân Sinh Hoa Kỳ) tuân thủ luật dân quyền hiện hành của Liên bang và không phân biệt đối xử dựa trên chủng tộc, màu da, nguồn gốc quốc gia, độ tuổi, khuyết tật, hoặc giới tính. HHS không loại trừ mọi người hoặc đối xử với họ khác biệt vì chủng tộc, màu da, nguồn gốc quốc gia, độ tuổi, khuyết tật, hoặc giới tính. HHS: Cung cấp dịch vụ hỗ trợ miễn phí cho những người khuyết tật để giao tiếp với chúng tôi có hiệu quả, như: Thông dịch viên ngôn ngữ ký hiệu đủ năng lực Thông tin bằng văn bản ở các định dạng khác (chữ in lớn, âm thanh, định dạng điện tử có thể tiếp cận, các định dạng khác) Cung cấp miễn phí các dịch vụ ngôn ngữ cho những người có ngôn ngữ chính không phải là tiếng Anh, như: Thông dịch viên đủ năng lực Thông tin được trình bày bằng ngôn ngữ khác Nếu bạn cần những dịch vụ này, hãy liên hệ HHS theo số 1-877-696-6775. Nếu bạn tin rằng HHS không cung cấp những dịch vụ này hoặc phân biệt đối xử theo cách khác dựa trên chủng tộc, màu da, nguồn gốc quốc gia, độ tuổi, khuyết tật, hoặc giới tính, bạn có thể nộp đơn khiếu nại với U.S. Department of Health and Human Services, Office for Civil Rights (Văn Phòng Dân Quyền) bằng hình thức điện tử qua Office for Civil Rights Complaint Portal, có trên tranghttps://ocrportal.hhs.gov/ocr/smartscreen/main.jsf, hoặc qua đường bưu điện hoặc bằng điện thoại tại: U.S. Department of Health and Human Services 200 Independence Avenue, SW Room 509F, HHH Building Washington, D.C. 20201 1-800-368-1019, 800-537-7697 (TDD) Top of Page 한국어 (Korean) 주의: 한국어를 사용하시는 경우, 언어 지원 서비스를 무료로 이용하실 수 있습니다. 1-877-696-6775 번으로 전화해 주십시오. Department of Health and Human Services (HHS, 보건복지부)은(는) 관련 연방 공민권법을 준수하며 인종, 피부색, 출신 국가, 연령, 장애 또는 성별을 이유로 차별하지 않습니다. HHS은(는) 인종, 피부색, 출신 국가, 연령, 장애 또는 성별을 이유로 누군가를 배제하거나 다른 방식으로 대우하지 않습니다. HHS: 장애인들이 저희와 효과적으로 의사소통할 수 있도록 다음과 같은 무료 지원과 서비스를 제공합니다. 자격있는 수화 통역자 다른 형식의 서면 정보(큰 활자, 음성, 사용 가능한 전자 형식, 기타 형식) 주로 사용하는 언어가 영어가 아닌 이들에게는 다음과 같은 무료 언어 서비스를 제공합니다. 자격있는 통역자 다른 언어로 작성된 서면 정보 이러한 서비스가 필요하시면 HHS에 -877-696-6775번으로 연락하십시오. HHS 이(가) 인종, 피부색, 출신 국가, 연령, 장애 또는 성별을 이유로 이러한 서비스를 제공하지 않거나 다른 방식으로 차별했다고 생각하시는 경우, https://ocrportal.hhs.gov/ocr/smartscreen/main.jsf 를 통한 전자 방식 또는 우편이나 전화로 Department of Health and Human Services, Office for Civil Rights (시민권 사무국)에 민원을 제출할 수 있습니다. 주소 및 연락처는 다음과 같습니다. U.S. Department of Health and Human Services 200 Independence Avenue, SW Room 509F, HHH Building Washington, D.C. 20201 1-800-368-1019, 800-537-7697 (TDD) Top of Page Tagalog PAUNAWA: Kung nagsasalita ka ng Tagalog, maaari kang gumamit ng mga serbisyo ng tulong sa wika nang walang bayad. Tumawag sa 1-877-696-6775. Sumusunod ang U.S. Department of Health and Human Services (HHS, Kagawaran ng Mga Serbisyong Pangkalusugan at Pantao ng U.S.) sa mga naaangkop na Pampederal na batas sa karapatang sibil at hindi nandidiskrimina batay sa lahi, kulay, bansang pinagmulan, edad, kapansanan o kasarian. Ang HHS ay hindi nagtatangi ng mga tao o hindi nagpapakita ng ibang pakikitungo dahil sa lahi, kulay, bansang pinagmulan, edad, kapansanan o kasarian. Ang HHS ay: Nagbibigay ng mga libreng tulong at serbisyo sa mga taong may kapansanan upang mahusay silang makipag-ugnayan sa amin, gaya ng: Mga kwalipikadong interpreter ng sign language Nakasulat na impormasyon sa iba pang mga format (malaking print, audio, mga naa-access na electronic na format, iba pang mga format) Nagbibigay ng mga libreng serbisyo sa wika sa mga taong hindi Ingles ang pangunahing wika, gaya ng: Mga kwalipikadong interpreter Impormasyong nakasulat sa iba pang mga wika Kung kailangan mo ang mga serbisyong ito, makipag-ugnayan kay HHS sa 1-877-696-6775. Kung naniniwala kang hindi naibigay ng HHS ang mga serbisyong ito o nandiskrimina ito sa ibang paraan batay sa lahi, kulay, bansang pinagmulan, edad, kapansanan o kasarian, maaari kang maghain ng karaingan sa U.S. Department of Health and Human Services, Office for Civil Rights (Tanggapan para sa Mga Karapatang Sibil), sa electronic na paraan sa Office for Civil Rights Complaint Portal, na makikita sahttps://ocrportal.hhs.gov/ocr/smartscreen/main.jsf, o sa pamamagitan ng koreo o telepono sa: U.S. Department of Health and Human Services 200 Independence Avenue, SW Room 509F, HHH Building Washington, D.C. 20201 1-800-368-1019, 800-537-7697 (TDD) Top of Page Русский (Russian) ВНИМАНИЕ: Если вы говорите на русском языке, то вам доступны бесплатные услуги перевода. Звоните 1-877-696-6775. U.S. Department of Health and Human Services (HHS, Министерство здравоохранения и социальных служб США) соблюдает применимое федеральное законодательство в области гражданских прав и не допускает дискриминации по признакам расы, цвета кожи, национальной принадлежности, возраста, инвалидности или пола. HHS не исключает людей и не относится к ним по-разному из-за расы, цвета кожи, национальной принадлежности, возраста, инвалидности или пола. HHS: Для эффективного взаимодействия предоставляет безвозмездную помощь и оказывает услуги людям с ограниченными возможностями, а именно: услуги квалифицированных сурдопереводчиков; письменную информацию в других форматах (крупный шрифт, аудио формат, доступные электронные форматы, прочие форматы). Предоставляет бесплатные услуги перевода людям, для которых английский не является основным языком, а именно: услуги квалифицированных переводчиков; письменную информацию на других языках. Если вы нуждаетесь в таких услугах, обратитесь к HHS по телефону 1-877-696-6775. Если вы считаете, что в HHS вам не предоставили указанных услуг или иным образом дискриминировали вас по признакам расы, цвета кожи, национальной принадлежности, возраста, инвалидности или пола, вы можете подать жалобу в U.S. Department of Health and Human Services, Office for Civil Rights (Управление по гражданским правам), в электронном виде через Office for Civil Rights Complaint Portal, доступный по ссылке:https://ocrportal.hhs.gov/ocr/smartscreen/main.jsf, по почте или по телефону: U.S. Department of Health and Human Services 200 Independence Avenue, SW Room 509F, HHH Building Washington, D.C. 20201 1-800-368-1019, 800-537-7697 (TDD) Top of Page العربية (Arabic) ملحوظة: إذا كنت تتحدث اذكر اللغة، فإن خدمات المساعدة اللغوية تتوافر لك بالمجان. اتصل برقم .1-877-696-6775 تلتزم HHS) Department of Health and Human Services, وزارة الخدمات الصحية والبشرية) بقوانين الحقوق المدنية الفدرالية المعمول بها ولا تميز على أساس العرق أو اللون أو الأصل الوطني أو السن أو الإعاقة أو نوع الجنس. لا تستبعد HHS الأشخاص أو تعاملهم على نحو مختلف بسبب النوع أو اللون أو الأصل الوطني أو السن أو الإعاقة أو نوع الجنس.. :HHS توفر مساعدات وخدمات مجانية للأشخاص من ذوي الإعاقات للتواصل بصورة فعالة معنا، مثل: مترجمي لغة إشارة مؤهلين معلومات كتابية بتنسيقات أخرى (مطبوعة بأحرف كبيرة، مواد صوتية، تنسيقات إلكترونية متيسرة، وغير ذلك من التنسيقات) توفر خدمات لغوية مجانية للأشخاص الذين لغتهم الأساسية ليست الإنجليزية، مثل: مترجمين مؤهلين معلومات مكتوبة بلغات أخرى إذا كنت بحاجة لهذه الخدمات، اتصل بـ HHS على الرقم .1-877-696-6775 إذا كنت تعتقد أن HHS قد أخفقت في توفير تلك الخدمات أو أنها قد ميزت بطريقة أخرى على أساس العرق أو اللون أو الأصل Department of Health and Human Services، مكتب Office for Civil Rights (مكتب الحقوق المدنية)، من خلال مكتب Office for Civil Rights Complaint Portal، المتوفر على الرابط https://ocrportal.hhs.gov/ocr/smartscreen/main.jsf أو بالبريد أو الهاتف على: U.S. Department of Health and Human Services 200 Independence Avenue, SW Room 509F, HHH Building Washington, D.C. 20201 1-800-368-1019, 800-537-7697 (رقم هاتف الصم والبكم) Top of Page Kreyòl Ayisyen (Haitian Creole) ATANSYON: Si w pale Kreyòl Ayisyen, gen sèvis èd pou lang ki disponib gratis pou ou. Rele 1-877-696-6775. U.S. Department of Health and Human Services, (HHS, Ministè Sèvis Sante ak Imen Ameriken) konfòm ak lwa sou dwa sivil Federal ki aplikab yo e li pa fè diskriminasyon sou baz ras, koulè, peyi orijin, laj, enfimite oswa sèks. HHS pa ekskli moun oswa trete yo nan fason ki diferan akoz ras, koulè, peyi orijin, laj, enfimite oswa sèks yo. HHS: Bay èd ak sèvis gratis pou moun ki andikape pou yo kominike avèk nou nan fason ki efikas, tankou: Enèprèt langaj siy ki kalifye Enfòmasyon ekri nan lòt fòma (gwo lèt, odyo, fòma elektwonik ki aksesib, lòt fòma) Bay sèvis lang gratis a moun lang prensipal yo pa Anglè, tankou: Enèprèt kalifye Enfòmasyon ki ekri nan lòt lang Si w bezwen sèvis sa yo, kontakte HHS nan 1-877-696-6775. Si w kwè HHS pa t bay sèvis sa yo oswa te fè diskriminasyon nan yon lòt fason sou baz ras, koulè, peyi orijin, laj, enfimite oswa sèks, ou ka depoze yon plent nan: U.S. Department of Health and Human Services, Office for Civil Rights (Biwo Dwa Sivil) atravè Office for Civil Rights Portal, pa mwayen elektwonik ki disponib nan https://ocrportal.hhs.gov/ocr/smartscreen/main.jsf, oswa pa lapòs oswa: U.S. Department of Health and Human Services 200 Independence Avenue, SW Room 509F, HHH Building Washington, D.C. 20201 1-800-368-1019, 800-537-7697 (TDD) Top of Page Français (French) ATTENTION: Si vous parlez français, des services d’aide linguistique vous sont proposés gratuitement. Appelez le 1-877-696-6775. L’U.S. Department of Health and Human Services (HHS, Département de la Santé et des Services Sociaux des États-Unis) respecte les lois fédérales en vigueur relatives aux droits civiques et ne pratique aucune discrimination basée sur la race, la couleur de peau, l’origine nationale, l’âge, le sexe ou un handicap. HHS n’exclut et ne trai