["https://cdc.gov/about/leadership/ncstltphiw.html"]
title = "National Center for State, Tribal, Local, and Territorial Public Health Infrastructure and Workforce (NCSTLTPHIW) | About CDC | CDC"
description = "Learn about CDC’s mission to protect you 24-7."
full_description = "January 19, 2024 National Center for State, Tribal, Local, and Territorial Public Health Infrastructure and Workforce (NCSTLTPHIW) Staff Bio Leslie Ann Dauphin, PhD, is the Director of the National Center for State, Tribal, Local, and Territorial Public Health Infrastructure and Workforce (NCSTLTPHIW), also known as the Public Health Infrastructure Center (PHIC). Director of the National Center for State, Tribal, Local, and Territorial Public Health Infrastructure and Workforce, Leslie Ann Dauphin, PhDShow More Role at CDC PHIC serves as the connection point between the agency and state, local, and territorial jurisdictions; Tribes; and CDC's public health partners. Dr. Dauphin leads a team of experts that sets the strategic direction for PHIC to ensure that our country's public health infrastructure has the people, services, and systems needed to promote and protect health in every U.S. community (all 50 states, the U.S. Territories, Tribes, and freely associated states). Previous experience Prior to leading PHIC, Dr. Dauphin served in a number of leadership roles across CDC. Most recently, she served as director of the Center for Surveillance, Epidemiology, and Laboratory Services. Dr. Dauphin’s leadership was instrumental to CDC’s response to laboratory safety events in 2014 and in the creation and successful stand up of the Office of Laboratory Science and Safety, where she served as deputy director. Previously, she served as acting Director for the Office of Science and Deputy Associate Director for Laboratory Science within the National Center for Emerging and Zoonotic Infectious Diseases. A trained laboratory scientist, Dr. Dauphin specialized in bioterrorism and emerging threats including anthrax as a research microbiologist and Response Team Coordinator for CDC’s 24/7 laboratory response to bioterrorism threats in the U.S. and abroad. Dr. Dauphin has also served in leadership roles on CDC’s COVID-19 response. Education Dr. Dauphin received her doctoral degree in Microbiology from North Carolina State University. She is a veteran of the U.S. Army, where she was a paratrooper under the 18th Airborne Corps. She received the Southwest Asia Service Medal and the National Defense Service Medal for her service in Saudi Arabia during the first Gulf War, Operation Desert Storm. On This Page Role at CDC Previous experience Education January 19, 2024 Sources Print Share Facebook LinkedIn Twitter Syndicate Content Source: Centers for Disease Control and Prevention"
