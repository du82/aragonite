["https://cdc.gov/adenovirus/php/surveillance/index.html"]
title = "Surveillance of Adenovirus | Adenovirus | CDC"
description = "Information about the adenovirus reporting and surveillance systems, NATRS and NREVSS."
full_description = "June 4, 2024 Surveillance of Adenovirus What to know CDC tracks seasonal trends in adenovirus-associated illness through two surveillance systems. Adenovirus detections are tracked by the National Respiratory and Enteric Virus Surveillance System (NREVSS) and adenovirus typing results are tracked by the National Adenovirus Type Reporting System (NATRS). National Respiratory and Enteric Virus Surveillance System NREVSS is a passive, laboratory-based surveillance system that has monitored adenovirus laboratory results since 1989. Each week, laboratories report the number of weekly aggregate adenovirus tests performed and the number of tests positive for adenovirus by: specimen type location week of specimen collection Serotyping, demographic, and clinical data are not collected in NREVSS. Adenovirus infections are not nationally notifiable in the United States. Adenovirus infections and outbreaks may not be reported, even if they are diagnosed. Keep Reading: National Respiratory and Enteric Virus Surveillance System National Adenovirus Type Reporting System NATRS is a passive, laboratory-based surveillance system that collects limited clinical, demographic, and laboratory data on typed human adenovirus specimens. NATRS was implemented in 2014 to monitor type-specific human adenovirus temporal and geographic circulation patterns. Public Health: National Adenovirus Type Reporting System Publications CDC. Human Adenovirus Surveillance — United States, 2003-2016. MMWR Morb Mortal Wkly Rep. 2017;66(39):1039-42. On This Page National Respiratory and Enteric Virus Surveillance System National Adenovirus Type Reporting System Publications June 4, 2024 Sources Print Share Facebook LinkedIn Twitter Syndicate Content Source: National Center for Immunization and Respiratory Diseases; Coronavirus and Other Respiratory Viruses Division SourcesNational Center for Immunization and Respiratory Diseases, NCIRD Divisions and Offices"
