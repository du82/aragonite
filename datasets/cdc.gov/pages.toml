["https://cdc.gov/about/speakers/request-a-speaker.html"]
title = "Request a Speaker | About CDC | CDC"
description = "Please let us know by emailing the speakersbureau@cdc.gov mailbox. We apologize for any inconvenience."
full_description = "May 21, 2024 Request a Speaker At a glance Request a CDC speaker for your event. Requesting a CDC speaker is very easy: Complete the speaker request form below and press the submit button. A representative will review your request and contact you. Please submit a request at least 60 days before your event (and a maximum of 6 months prior to your event). We may not be able to process requests within 30 days of the event due to staffing coordination. If we do not receive a response to your request for a speaker within 60 days of your original request date, please email the Speakers Bureau. Please note that a submission does not guarantee a CDC speaker; however, we will do our absolute best to secure a speaker for your event. Please review the CDC Speakers Bureau Privacy Policy to understand how we use the information gathered to complete speaker requests. Request Form Contact Email*Please enter your email addressEvent OverviewEvent Title:*Name of Organization Hosting Event:*Event Location:*Event Date (must be at least 60 days out, and a maximum of 6 months prior to your event):*Event Start Time:*Event End time:*Please Select Time Zone*Eastern Standard TimeCentral Standard TimeMountain Standard TimePacific Standard TimeTravel Expenses Covered:**Please note: CDC does not cover travel expenses for requested speakersYesNoExpected Media Coverage:(optional)YesNoWhat is the purpose of this event?:*Will virtual availability be an option for this event?*YesNoContact PersonContact Name:*Organization Name and Location:*Office Number:*Cell Number:*Email:*Please give a brief description of your organization:*Presentation DetailsTopic of Presentation:*Type of Presentation:*Select:Panel DiscussionKeynote AddressBreak-out SessionPlenaryOtherLength of Requested Presentation:*Select30 Minutes1 Hour2 HoursGreater than two hoursAudience and Key Participants:*Select:StudentsElected OfficialsBusiness LeadersEducatorsPublic Health/Medical ProfessionalsGeneral PublicOthersAudience Size:*Select10 - 5051 - 100101 - 150151 - 200201 - 10001000+Audiovisual Capabilities:Audiovisual Capabilities?:*YesNoInstructions* This site is protected by reCAPTCHA and the Google Privacy Policy and Terms of Service apply. var onSubmit = function(token) { CDC.validation.onSubmitHandler(); }; Submit* Required field Experiencing Challenges Submitting Your Speakers Request?‎ Please let us know by emailing the speakersbureau@cdc.gov mailbox. We apologize for any inconvenience. May 21, 2024 Sources Print Share Facebook LinkedIn Twitter Syndicate Content Source: Centers for Disease Control and Prevention"
