["https://cdc.gov/about/advisory-committee-director/index.html"]
title = "Advisory Committee to the Director (ACD) | About CDC | CDC"
description = "Advisory Committee to the Director advises and provides guidance to HHS Secretary and CDC Director."
full_description = "February 13, 2024 Advisory Committee to the Director (ACD) What to know The Advisory Committee to the Director advises and provides guidance to the HHS Secretary and CDC Director to enable CDC to fulfill its mission of protecting public health through, preparedness, disease prevention and health promotion. ACD Meetings The 2025 meeting schedule will be posted when available. Past meeting information can be found here. Designated Federal Officer Debra Houry, MD, MPH Debra Houry, MD, MPH, is the chief medical officer and deputy director for program and science at CDC. She serves as the designated federal officer for the Advisory Committee to the Director. Prior to this role, Dr. Houry served for nearly two years (2021-2023) as CDC’s acting principal deputy director and as director for the National Center for Injury Prevention and Control (2014-2021). ACD Committee Information Function The ACD, CDC, shall advise the Secretary, HHS, and the Director, CDC, on policy and broad strategies that will enable CDC to fulfill its mission of protecting health through health promotion, prevention, and preparedness. The committee recommends ways to prioritize CDC's activities, improve results, and address health disparities. It also provides guidance to help CDC work more effectively with its various private and public sector constituents to make health protection a practical reality. Legislative Authority The Advisory Committee to the Director (ACD or Committee), Centers for Disease Control and Prevention (CDC), is established in accordance with Section 305A of the Public Health Service Act, [42 U.S.C. Section 241], as amended, and is governed by the provisions of Public Law 92-463, (5 U.S.C. §1001 et. seq.), as amended. Background The Advisory Committee to the Director (ACD or Committee), shall (1) make recommendations to the Director regarding ways to prioritize the activities of the agency in alignment with the CDC Strategic Plan required under section 305(c); H.R. 2617-1252; (2) advise on ways to achieve or improve performance metrics in relation to the CDC Strategic Plan, and other relevant metrics, as appropriate; (3) provide advice and recommendations on the development of the Strategic Plan, and any subsequent updates, as appropriate; (4) advise on grant, cooperative agreements, contracts, or other transactions, as applicable; (5) provide other advice to the Director, as requested, to fulfill duties under sections 301 and 311; and (6) appoint subcommittees. Charter Charter for the Advisory Committee to the Director, Centers for Disease Control and Prevention. The PDF of the charter is print only. On This Page ACD Meetings Designated Federal Officer ACD Committee Information February 13, 2024 Sources Print Share Facebook LinkedIn Twitter Syndicate Content Source: Centers for Disease Control and Prevention"
