["https://cdc.gov/listeria/outbreaks/shakes-022025/index.html"]
title = "Listeria Outbreak Linked to Supplement Shakes | Listeria Infection | CDC"
description = "Listeria infection is caused by eating food contaminated with Listeria monocytogenes bacteria. The infection can be very serious for some groups of people."
full_description = "February 24, 2025 Listeria Outbreak Linked to Supplement Shakes Food safety alert Investigation status: Open Recall issued: Yes CDC, FDA and public health officials in several states are investigating a multistate outbreak of Listeria infections linked to supplement shakes. Many people in this outbreak lived in long-term care facilities or were hospitalized before becoming sick. Fast Facts Cases: 38Hospitalizations: 37Deaths: 12States: 21 const pageSummaryButtonContainer = document.querySelector('#nav-buttons'); pageSummaryButtonContainer.innerHTML = decodeURIComponent('%3Cdiv%20class%3D%22dfe-outbreak-navs%22%3E%0D%0A%09%3Ca%20href%3D%22%2Flisteria%2Foutbreaks%2Fshakes-022025%2Finvestigation.html%22%20class%3D%22btn%20btn-outline-secondary%22%3EUpdates%3C%2Fa%3E%3Ca%20href%3D%22%2Flisteria%2Foutbreaks%2Fshakes-022025%2Flocations.html%22%20class%3D%22btn%20btn-outline-secondary%22%3ELocations%3C%2Fa%3E%3Ca%20href%3D%22%2Flisteria%2Foutbreaks%2Fshakes-022025%2Ftimeline.html%22%20class%3D%22btn%20btn-outline-secondary%22%3ETimeline%3C%2Fa%3E%3C%2Fdiv%3E%0D%0A%09'); Recalled food On February 22, 2025, Lyons Magnus LLC recalled frozen supplement shakes that were distributed to food service operators and long-term care facilities. Brands: Sysco Imperial Lyons ReadyCare What you should do Do not eat any recalled products. Throw them away or return them to where you bought them. Clean your refrigerator, containers, and surfaces that may have touched the recalled products. Listeria can survive in the refrigerator and can easily spread to other foods and surfaces. Call a healthcare provider right away if you have these symptoms after eating recalled products. Pregnant women: Fever, muscle aches, and tiredness. Your illness may be mild, but Listeria can cause pregnancy loss or premature birth. It can also cause serious illness or death in newborns. Other people may have: Headache, stiff neck, confusion, loss of balance, and convulsions, in addition to fever, muscle aches, and tiredness. What businesses should do Do not sell or serve recalled supplement shakes. Follow FDA's safe handling and cleaning advice if you sold or served recalled products. Symptoms of Listeria Listeria is especially harmful to pregnant women, people 65 or older, and people with weakened immune systems. This is because Listeria is more likely to spread beyond their gut to other parts of their body, resulting in a severe condition known as invasive listeriosis. For women who are pregnant, Listeria can cause pregnancy loss, premature birth, or a life-threatening infection in newborns. For people who are 65 or older or who have a weakened immune system, Listeria often results in hospitalization and sometimes death. Symptoms usually start within 2 weeks after eating food contaminated with Listeria but may start as early as the same day or as late as 10 weeks after. Pregnant women: Fever, muscle aches, and tiredness. Your illness may be mild, but Listeria can cause pregnancy loss or premature birth. It can also cause serious illness or death in newborns. Other people may have: Headache, stiff neck, confusion, loss of balance, and convulsions, in addition to fever, muscle aches, and tiredness. See also CDC: About Listeria Infection FDA: Outbreak Investigation of Listeria – Supplement Shakes FDA: Lyons Magnus Recalls Supplement Shakes On This Page Recalled food What you should do What businesses should do Symptoms of Listeria See also February 24, 2025 Sources Print Share Facebook LinkedIn Twitter Syndicate Content Source: National Center for Emerging and Zoonotic Infectious Diseases (NCEZID); Division of Foodborne, Waterborne, and Environmental Diseases"
