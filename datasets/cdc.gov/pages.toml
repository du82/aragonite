description = "View data for COVID-19, flu, and RSV activity in your community and across the United States."
full_description = "February 28, 2025 Español Respiratory Illnesses Data Channel This site is updated on Fridays. What to know As of February 28, 2025, the amount of acute respiratory illness causing people to seek healthcare is at a moderate level. Seasonal influenza activity remains elevated nationally but has decreased for two consecutive weeks. COVID-19 activity is declining nationally but elevated in some areas of the country. RSV activity is declining in most areas of the country. Your community snapshot There was a problem loading data. Please wait and try again. Search for your state / territory and your county to receive information on COVID-19, flu, and RSV in your community United States The CDC may not have data for all states, counties, or territories. Read more » Overall respiratory illness activity What it is: A measure of how frequently a wide variety of respiratory symptoms and conditions are diagnosed by emergency department doctors, ranging from the common cold to COVID-19, flu, and RSV. Why it matters: Summarizes the total impact of respiratory illnesses, regardless of which diseases are causing people to get sick. See more data » Learn about this measurement » * Overall respiratory illness activity is displayed at the state or territory level, local data is unavailable at this time. Emergency department visits COVID-19 Flu RSV What it is: A measure of how many people are seeking medical care in emergency departments. Why it matters: When levels are high, it may indicate that infections are making people sick enough to require treatment. See more data » Learn about this measurement » * Emergency department data may cover an entire state or Health Service Area. Each Health Service Area includes one or more counties. * Data is displayed at the state or territory level. Wastewater viral activity level COVID-19 Flu† RSV What it is: A measure of how much virus is present in sewage. Why it matters: People with certain infections can shed pieces of viruses when using the bathroom, showering, or washing clothes — even if they don't have symptoms. Testing wastewater (sewage) helps us track infection levels in the community, including when people aren’t going to the doctor. See more data » Learn about this measurement » * Wastewater data is displayed at the state or territory level, local data is unavailable at this time. † Flu levels are for Influenza A only, which includes avian influenza A(H5). Wastewater data cannot determine the source of viruses (from humans, animals, or animal products). Select another location Weekly national summary Season Outlook The CDC has determined that the highest hospital demand for COVID-19, flu, and RSV to date this season occurred during the week ending February 1, 2025, and it was lower than the peak demand from last season. However, influenza activity remains high in most areas. The peak hospital demand due to COVID-19 during this fall and winter respiratory season was lower than all previous seasons, and nearly 50% lower than the peak demand last season. CDC does not anticipate producing additional respiratory disease outlook updates during the remainder of the 2024-2025 season. Read the entire 2024-2025 Respiratory Season Outlook - February Update (2/19/2025). Protect yourself and your community Looking for guidance? There are simple measures you can take to protect yourself and those around you. Updated CDC Guidance Safeguard your health - Get the latest information from Vaccines.gov Order 4 free at-home COVID-19 tests today on COVIDTests.gov Explore resources and recommendations for older adults - Stay informed and protected Review tailored health recommendations for high-risk individuals Feeling ill? Take immediate steps to protect yourself and others – Start here Have symptoms? Consider wearing a mask Take action against germs – Practice good hygiene Got questions? Check out our FAQs Continue exploring these data Respiratory Virus Activity Levels Updates on how COVID-19, Flu, and RSV may be spreading nationally and in your state Feb. 28, 2025 Severe Viral Respiratory Illness Data on how respiratory viruses are contributing to serious health outcomes Feb. 28, 2025 People Most Impacted by Respiratory Viruses How people of different ages, race and ethnicity, and sex are affected by COVID-19, flu, and RSV. Feb. 28, 2025 Vaccination Trends Vaccination uptake & intent for COVID, flu, and RSV Feb. 28, 2025 Explore related data Modeling Data Anticipated trends for COVID-19 infections, based on modeling, are displayed at the national and state levels. Wastewater Wastewater (sewage) data specific to SARS-CoV-2, the virus that causes COVID-19, are displayed at the national, regional, and state levels. These data can provide an early signal of changes in infection levels. Nursing Homes Data on COVID-19 cases and deaths among residents and staff of nursing homes are displayed at the national and state levels. Hospital Bed Occupancy Weekly trends in overall hospital bed occupancy and reporting status. Stay up to date with the NCIRD bulletin CDC Updates Vaccine Recommendations What to Know for this Fall and Winter Virus Season The Changing Threat of COVID-19 Using Wastewater Data to Inform Public Health Action On This Page Your community snapshot Weekly national summary Season Outlook Protect yourself and your community Continue exploring these data Explore related data Stay up to date with the NCIRD bulletin February 28, 2025 Sources Print Share Facebook LinkedIn Twitter Syndicate Content Source: National Center for Immunization and Respiratory Diseases (NCIRD)"
