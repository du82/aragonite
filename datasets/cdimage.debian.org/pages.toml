title = "Debian installation media for USB, CD, DVD"
full_description = 'Debian on CD FAQ Network Install Live images Buy CDs or DVDs Download Download via HTTP/FTP Download with Torrent Download with Jigdo Rsync Mirrors Verify Debian installation media for USB, CD, DVD If you simply want to install Debian and have an Internet connection on the target computer we recommend the Network Install media which is a smaller download. On i386 and amd64 architectures, all USB/CD/DVD images can be used on a USB stick too. Download USB/CD/DVD images using HTTP. Download USB/CD/DVD images with BitTorrent. The Bittorrent peer to peer system lets many users cooperatively download images at the same time which may speed up your download. Download live images using HTTP, FTP or BitTorrent. Live images are for booting a live system without installing. You can use to try Debian first and then install the contents of the image. Buy finished Debian media. Download USB/CD/DVD images with jigdo. This is only for advanced users. The "jigdo" scheme allows you to pick the fastest out of 300 Debian mirrors worldwide for your download. It features easy mirror selection and "upgrading" of older images to the latest release. Also, it is the only way to download all Debian DVD images. In case of problems, please check the FAQ about Debian CDs/DVDs. Official USB/CD/DVD releases are signed so that you can verify they are authentic. Debian is available for different computer architectures (Most people will need images for amd64, i.e. 64-bit PC-compatible systems). Latest official release of the "stable" USB/CD/DVD images: 12.9.0. Information about known installation issues can be found on the installation information page.'
