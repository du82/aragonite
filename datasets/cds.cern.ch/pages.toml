["https://cds.cern.ch/record/2913818"]
title = "Signals, Noise and Signal processing in Particle Detectors - CERN Document Server"
description = '''
<!--HTML--><p><span style="font-size: 12.0pt; font-family: 'Aptos',sans-serif; mso-fareast-font-family: 'Times New Roman'; mso-bidi-font-family: Aptos; mso-ansi-language: EN-GB; mso-fareast-language: EN-GB; mso-bidi-language: AR-SA;"><span style="font-size: 11.0pt; line-height: 107%; font-family: 'Calibri',sans-serif; mso-fareast-font-family: Aptos; mso-fareast-theme-font: minor-latin; mso-ansi-language: EN-GB; mso-fareast-language: EN-US; mso-bidi-language: AR-SA;">These lectures discuss the basic processes that give rise to signals in particle detectors. The<span style="text-decoration: underline;"> first lecture</span> will summarize the main points from the 2019 lecture series on this topic (<a href="/event/843083/">https://indico.cern.ch/event/843083/</a>) and will discuss further extensions of the Ramo-Shockly theorem  that are valid for the full extent of Maxwell’s equations without limitation to weak conductivity and can be e.g. used for calculation of antenna signals from cosmic rays showers in the atmosphere or in ice. The <span style="text-decoration: underline;">second lecture</span> discusses the theory of electron-hole avalanches leading to a detailed description of Low Gain Avalanche Diodes (LGADs), Silicon Photomultipliers (SiPMs) and Single Photon Avalanche Detectors (SPADs) that are nowadays widely applied in particle physics experiments. The <span style="text-decoration: underline;">third lecture</span> will discuss the different sources of noise arising in detectors and will describe the mathematical tools for quantifying noise. The <span style="text-decoration: underline;">fourth lecture</span> will then discuss signal processing and the theory of optimum filtering. The <span style="text-decoration: underline;">fifth lecture</span> is  foreseen for questions and specific topics that arise during the lectures.</span></span></p>
<p> </p>
Riegler, Werner'''
full_description = "These lectures discuss the basic processes that give rise to signals in particle detectors. The first lecture will summarize the main points from the 2019 lecture series on this topic (https://indico.cern.ch/event/843083/) and will discuss further extensions of the Ramo-Shockly theorem that are valid for the full extent of Maxwell’s equations without limitation to weak conductivity and can be e.g. used for calculation of antenna signals from cosmic rays showers in the atmosphere or in ice. The second lecture discusses the theory of electron-hole avalanches leading to a detailed description of Low Gain Avalanche Diodes (LGADs), Silicon Photomultipliers (SiPMs) and Single Photon Avalanche Detectors (SPADs) that are nowadays widely applied in particle physics experiments. The third lecture will discuss the different sources of noise arising in detectors and will describe the mathematical tools for quantifying noise. The fourth lecture will then discuss signal processing and the theory of optimum filtering. The fifth lecture is foreseen for questions and specific topics that arise during the lectures."
year_published = 2025
clearnet = "https://cds.cern.ch/record/2913818"
