["https://cds.cern.ch/record/2895265"]
title = "Gravitational Wave Astronomy - CERN Document Server"
description = """
<!--HTML--><p>Abstract:<br>The recent discoveries at LIGO/Virgo and pulsar timing arrays have opened a new window to study our universe: gravitational wave astronomy. These observations have shed new light on our understanding of black holes and neutron stars, teaching us about the evolution of stars and galaxies as well as probing fundamental laws of physics. The next generation of gravitational wave experiments will push the frontier to earlier times in the evolution of universe. I will discuss some of the physics questions we hope to answer and the challenges to overcome to achieve this.</p>
Domcke, Valerie"""
