["https://cds.cern.ch/record/1603392"]
title = "The MedAustron Project at CERN, Status Report, May 2013 - CERN Document Server"
description = '''
MedAustron is a light ion-therapy and research centre based on a synchrotron accelerator complex under construction in Austria. It is the first large-scale accelerator facility in Austria. For the implementation of the required accelerator technologies, the county of Lower Austria and the company EBG MedAustron have set up dedicated agreements with CERN. These cover the assistance of CERN for the design and manufacturing follow-up of accelerator components and training of MedAustron personnel. CERN contributed to the MedAustron construction in particular by providing domain expertise, infrastructure, and manpower in relation with the design, the tendering and procurement processes.\nThis document reports on the current status of the accelerator design related activities at CERN at the time of the formal handover of the overall project management from CERN to EBG MedAustron. It gives an overview of the components’ procurement and construction status and reports on the knowledge transferred to the EBG MedAustron company. The progress of the particle accelerator project has been reviewed and was found to be in line with the overall project schedule and the allocated budget. \nThe MedAustron accelerator project has entered the transition from development, which was performed under the guidance of CERN, to installation and commissioning carried out by EBG MedAustron at the facility site in Wiener Neustadt, Austria. The timely start of this phase proofs this collaboration to be a successful large-scale knowledge and technology transfer from CERN to a member state.
Benedikt, M; Dorda, U; Gutleber, J'''
