["https://cds.cern.ch/record/2888554"]
title = "Science for Nuclear Arms Control - CERN Document Server"
description = '''
<!--HTML--><p><span style="mso-fareast-font-family: 'Times New Roman';"><span style="font-size: 11.0pt; font-family: 'Calibri',sans-serif; mso-fareast-font-family: 'Times New Roman'; mso-ansi-language: EN-GB; mso-fareast-language: EN-GB; mso-bidi-language: AR-SA;">With the Russian invasion of Ukraine</span>, the threat of nuclear weapons use has re-emerged in the public debate. Today, there exist over 12,000 nuclear weapons globally, and large fissile material stocks allowing the production of many more. The threat of new states obtaining nuclear weapons persists. The current situation has triggered a new sense of urgency. This lecture series will introduce the topic, highlighting the roles of physicists. </span></p>
<p><span style="mso-fareast-font-family: 'Times New Roman';">The <u>first talk</u> will introduce what makes a nuclear weapon program, focusing on technical aspects and past proliferation cases. It will also look at the physics effects of nuclear weapon explosions. The <u>second talk</u> will address how the world deals with these weapons: What are the related politics, the role of states and the United Nations. What can civil society – including the academic research community – do? The <u>third talk</u> will highlight another important contribution by scientists: International agreements on nuclear nonproliferation and disarmament require internationally developed verification measures to monitor compliance – or: science for peace. Current verification research will be presented, including particle detection.</span></p>
<p><span style="mso-fareast-font-family: 'Times New Roman';">The research of Prof. Malte Göttsche focusses on nuclear verification and disarmament at RWTH Aachen University, Germany. </span></p>
<p><span style="font-size: 11.5pt;"> </span></p>
Göttsche, Malte'''
full_description = "With the Russian invasion of Ukraine, the threat of nuclear weapons use has re-emerged in the public debate. Today, there exist over 12,000 nuclear weapons globally, and large fissile material stocks allowing the production of many more. The threat of new states obtaining nuclear weapons persists. The current situation has triggered a new sense of urgency. This lecture series will introduce the topic, highlighting the roles of physicists. The first talk will introduce what makes a nuclear weapon program, focusing on technical aspects and past proliferation cases. It will also look at the physics effects of nuclear weapon explosions. The second talk will address how the world deals with these weapons: What are the related politics, the role of states and the United Nations. What can civil society – including the academic research community – do? The third talk will highlight another important contribution by scientists: International agreements on nuclear nonproliferation and disarmament require internationally developed verification measures to monitor compliance – or: science for peace. Current verification research will be presented, including particle detection. The research of Prof. Malte Göttsche focusses on nuclear verification and disarmament at RWTH Aachen University, Germany."
