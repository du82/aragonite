["https://cds.cern.ch/record/2924006"]
title = '''Identification des particules dans l'expérience "Lézard" - CERN Document Server'''
description = '''
Un spectromètre de grande acceptance est en cours de montage sur la nouvelle zone expérimentale du C.E.R.N., située en France. En 1978, il recevra un faisceau secondaire de hadrons, dont l'énergie atteindra 400 GeV. L'intensité disponible sera supérieure d'un ordre de grandeur à celle des faisceaux équivalents de Batavia. Cet appareillage a reçu le surnom de "Lézard". Il s'agit du descendant d'un projet très ambitieux, à l'époque comparé à un dinosaure, et qui a succombé à son gigantisme.
Weisz, Sylvain; Astier Badier, Vinh-Mau'''
year_published = 2025
clearnet = "https://cds.cern.ch/record/2924006"
category = "SitesList"
