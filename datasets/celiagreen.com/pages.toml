["http://www.celiagreen.com/biography.html"]
title = "Biography"
full_description = '''I was a precocious child, offspring of a Polish immigrant father and British mother, both from families of notable ability which had come down in the world. When I first went to school at five I had already read what would be a respectable amount for a fairly bright child to get through in its entire primary education. I was equally good at all subjects and my education might have been relatively plain sailing if my parents had been a little better off, or a little more ambitious on my behalf, so that they had taken care only to send me to private schools. My ability was spectacular enough to arouse hostility and obstructionism in egalitarian local authorities. My father, as headmaster of a primary school in the state system, could not escape the pressures placed upon him to oppose and frustrate me. If intelligence is not genetic, as many wish to believe, it is fair enough to blame precocity on a father's "pushing". The crucial turning-point in my education came when I was thirteen. Legislation was passed against the taking of O-levels before the age of 16. I was about to take the exam before the legislation, which would have left me free to take O and A-levels "ad lib", as I had every intention of doing. I estimated that I should be able to get a distinction in any O-level subject within a fortnight starting from scratch, six weeks for A-levels. Maybe a bit more in the case of totally unknown languages. I considered it to be almost too late to be taking this exam, since I could have taken it when I was eight if allowed to have textbooks and a year for preparation, but it was not quite too late to enjoy it, and it was the gateway to all my future exam-taking. My father rashly attracted the attention of local educational "experts" and was threatened with the loss of his job if he did not prevent me from taking the exam. He prevented me. The happiness of my life abruptly ended. From then on my education consisted of a series of appalling arrangements imposed on my by the local authority, which constantly induced my father to oppose the plans and arrangements which I made for myself. My unhappiness, which must have been noticeable, was blamed as usual on overwork and my "pushing" father. The relative protection provided earlier by a direct grant Ursuline convent school which I attended from the ages of 10 to 14 broke down because it had little provision for sixth form work. Eventually I got the top scholarship to Somerville College at the normal age. It would have been better for me if it had been younger, both because it would have been easier to be identified with taking a first degree at 19 than 21 (and even easier to be identified with taking it at 15) and because I would have had fewer nightmarish years behind me which gave the work negative associations.'''
year_published = 2025
