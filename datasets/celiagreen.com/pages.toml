full_description = '''Dr Fabian Wadel, who writes under the name "Fabian Tassano", has collaborated with Celia Green since 1984. From 1994 to 2000 he taught economics to undergraduate and graduate students at Oxford University. From 1998 to 2000 he was Economics Lecturer at Balliol College. From 2000 to 2002 he worked as a senior economist in PricewaterhouseCoopers' London office. Flatter, wider, virtual corporations: competition policy in the New Economy (PDF) An analysis of the possible effects of the internet on business concentration. Vertical mergers and the nature of the firm (PDF) A review of the benefits and drawbacks of vertical integration. Documents related to the book Mediocracy: Inversions and Deceptions by Fabian Tassano The meaning of mediocracy Remarks about mediocracy'''
