["http://www.celiagreen.com/Celia_Green.html"]
title = ""
full_description = "[Note: In May/June 2023, some drastic alterations were made to the Wikipedia article on Dr Green. In our opinion, the motivation for these alterations was clearly hostile. Oxford Forum is therefore hosting an updated version of the Wikipedia article that had stood, largely unaltered, during the period 2010 to 2022.] Celia Elizabeth Green (born 26 November 1935) is a British psychologist and philosopher, best known for her work on lucid dreaming and out-of-body experiences. Celia Green's parents were both primary school teachers, who together authored a series of geography textbooks which became known as The Green Geographies.[1] In 1960 Green was awarded a B.Litt. degree by Oxford University for a thesis, supervised by H. H. Price, on the physiology of altered states of consciousness. From 1957 to 1960, Green held the post of Research Officer at the Society for Psychical Research in London.[2] In 1961, Celia Green founded and became Director of the Institute of Psychophysical Research. The Institute�s principal work during the sixties and seventies concerned hallucinations and other quasi-perceptual experiences in normal subjects. Its main benefactor, from 1963 to 1970, was Cecil Harmsworth King, then Chairman of the IPC group, which owned the Daily Mirror. In 1996 Green was awarded a DPhil degree by Oxford University for a thesis on causation and the mind-body problem. Green is an Honorary Research Fellow at the Department of Philosophy, University of Liverpool.[3] Celia Green's empirical work, some of it undertaken in collaboration with an Oxford psychologist, Charles McCreery, has focussed mainly on hallucinatory experiences in ostensibly normal people. In 1968 Green published Lucid Dreams,[4] a study of dreams in which the subject is aware that he or she is asleep and dreaming. The possibility of conscious insight during dreams had previously been treated with scepticism by some philosophers[5] and psychologists.[6] Green predicted that lucid dreams would be found to be correlated with the rapid eye movement (REM) stage of sleep, a prediction which was subsequently confirmed by experiment.[7][8][9]"
year_published = 2025
