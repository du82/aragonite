["http://www.celiagreen.com/charlesmccreery"]
title = "Charles McCreery"
full_description = "Charles McCreery has worked with Celia Green since 1964. He is the co-author with Dr Green of Apparitions (Hamish Hamilton, 1975) and Lucid Dreaming: the Paradox of Consciousness during Sleep (Routledge, 1994). From 1996 to 2000 he was Lecturer in Experimental Psychology at Magdalen College, Oxford. Charles McCreery presents a theory of out-of-the-body experiences according to which they are a manifestation of sleep. He argues that the subject of an OBE is in stage 1 sleep, often in the form of a brief 'microsleep' episode. McCreery discusses a number of electrophysiological studies carried out on OBEs, including his own work on inducing OBEs in the laboratory, carried out at Oxford University's Department of Experimental Psychology. In the final two chapters McCreery shows how his theory of OBEs can be extended to provide an explanatory model of psychosis. Charles McCreery proposes the controversial thesis that the possession of a private income, either by the genius or by his or her patron, has been a necessary condition of the productivity of the great majority of geniuses throughout history. �This is a courageous, well-argued and timely book.� Professor H.J. Eysenck, PhD, DSc Perception and Hallucination: the Case for Continuity Oxford Forum, Philosophical Paper An analysis of empirical arguments for representationalism. Dreams and Psychosis: a new look at an old hypothesis Oxford Forum, Psychological Paper A theory of psychosis based on a link between sleep and hyperarousal. First-year Statistics for Psychology Students Through Worked Examples 1. Probability and Bayes' Theorem (PDF) 2. Mean, median, mode and skewness (PDF) 3. The Chi-square test (PDF) 4. The t-test and the Mann-Whitney test (PDF) 5. The matched t-test and the Wilcoxon Signed-Rank test (PDF) 6. Analysis of Variance (PDF) Tutorials devised for first-year psychology students at Oxford University."
year_published = 2025
