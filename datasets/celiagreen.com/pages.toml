["http://www.celiagreen.com/lucid-dream-researchers.html"]
title = "Lucid dream researchers"
full_description = "When I met Professor Griffin of the Oxford University philosophy appointments board to discuss how I might get onto a salaried university career track as an academic philosopher, I did not attempt to conceal my bitterness at the fact that the book on lucid dreaming, which I had written under duress because I had no other way of advertising my need for funding to do laboratory research to force my way back into a university career, had provided academics around the world, already safely on career tracks, with advantageous areas of research. He hastened to defend them for doing nothing to improve my position by saying that once a piece of work had been published it was free to anyone to work on it. And of course there is no law asserting that anyone should recognise the socially disadvantaged position of someone else, or do anything more than is strictly prescribed by law to help them. But spontaneous decency is not illegal, even where not socially prescribed. It is not explicitly recognised that it is socially proscribed. There was no law against Professor Griffin himself, having recognised that he had become aware of someone so seriously disadvantaged in life in comparison with himself, donating to me half of his own salary, or any other fraction of it, from that time forwards. Or he might have wished to make a mailing to all academics around the world known to have worked on lucid dreams under university auspices, in which he could have expressed to them his own recognition of my disadvantaged position, and his own hope that each of them would make a significant annual donation out of their own salaries towards compensating me for my continuing lack of salary and advantageous circumstances provided by a university career, despite the fact that there was no legal obligation on them to do so. Many years ago an international conference on lucid dreaming was held at London University and I was invited to contribute by giving a paper, although no one had shown any sign of wanting to provide me with funding to contribute by way of research."
year_published = 2025
clearnet = "http://www.celiagreen.com/lucid-dream-researchers.html"
