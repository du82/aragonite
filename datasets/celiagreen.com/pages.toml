["http://www.celiagreen.com/contact.html"]
title = "Contact"
full_description = '''I receive many e-mails. These tend to fall into two categories: the first is those from people who are interested in the possibility of coming to work with us on a long-term or short-term basis. Regarding this first category. Oxford Forum is based in Cuddesdon, near Wheatley in Oxfordshire. We are aiming to set up an independent university, supported by business enterprises (see Careers). We are not in need of any highly skilled help, except perhaps in DIY and house maintenance, as we could handle any work requiring numeracy, literacy or computer skills ourselves if our time was sufficiently released from administrative chores. In particular, we cannot make use of anyone's computer skills, which we are often offered. The second category of e-mails (and letters) is those from people who want to know my views on some topic or other, or want me to comment on their views. With regard to emails of this kind: I am not in receipt of an academic salary, or indeed of any other kind of renumeration, but am forced to support myself and my institution by my own efforts. If people come to work with us, even in a temporary capacity, they will no doubt find that I talk to them about things of interest to them. However, I will not necessarily be able to reply to emails or letters in this category, particularly from individuals who are themselves in receipt of salaries. People who wish to make a financial contribution towards our efforts can do so by means of donations. Oxford Forum is an unincorporated assocation, so donations need to be made payable to myself or to one of my colleagues. Buying one or more of our books is also a helpful thing to do. To help distinguish your message from spam, please put the title of one of my books in the subject line. var username = "celia.green"; var hostname = "celiagreen.com"; var linktext = username + "@" + hostname ; document.write("<a href='" + "mail" + "to:" + username + "@" + hostname + "'>" + linktext + "</a>"); I would appreciate it if people who quote me on their blogs or websites, and particularly those who reproduce whole sections of my books, give links to this website. Please include a reference to Oxford Forum when giving links to our website, blogs or other pages, as this helps to increase our prominence in Google searches.'''
