["http://www.celiagreen.com/founders.html"]
title = "Founders of the IPR"
full_description = "Joy was born in London, and educated at St. Francis Xavier�s College in Bruges, Belgium, where he became fluent in French. He served in the British Army from 1914 to 1923, and during the First World War saw action in Flanders. In 1924 Joy joined the British Colonial and Foreign Office, where his fluency in French was a professional asset. His first appointment was as Assistant Resident Commissioner for the New Hebrides Condominium, administered jointly by the British and the French. In 1928 he became Resident Commissioner and Consul for the Western Pacific, and conjoint Consul for the Hoorn and Wallace Islands. During the Second World War, Joy added Arabic to his linguistic skills, and in 1940 became Resident Adviser to Sultan Sir Salih Bin Ghalib al Quaiti KCMG, Sultan of the State of Shihr and Mukalla in the Hadhramaut, and to the Sultan of Selyun in the Kathiri State. From 1942 to 1946 he was Civil Secretary to the Government of Aden. His final colonial appointment was as Governor and Commander-in-Chief of St. Helena, a post he held from 1946 to 1953. The island�s website notes that during his governorship he increased wages for all Government workers by one shilling (worth approximately �5 in 2015 currency). In retirement Sir George was instrumental, along with Admiral the Hon. A.C. Strutt and W.H. Salter, in the setting up of the Strutt Research Fund. This Fund supplied the initial financing for the Institute of Psychophysical Research, a charity founded in 1965 by Celia Green and Charles McCreery to carry out research into the mind-body problem. Vice-Admiral the Hon. Arthur Charles Strutt CBE (2 October 1878 – 10 February 1973) was Master of the Fleet under Admiral Sir David Beatty (later Earl Beatty) during the First World War, and took part in the Battle of Jutland. Part of Strutt�s education took place at HMS Britannia, the Naval Shore Establishment now known, since 1953, as HMS�Dartmouth. On 4 October 1899, Strutt was confirmed in the rank of Sub-Lieutenant. He was promoted to the rank of Lieutenant on 31 December 1900. On 15 February 1913, he was appointed to HMS Queen Mary as Navigating Officer, and on 30 June 1913 he was promoted to the rank of Commander."
year_published = 2025
