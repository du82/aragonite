["https://www.cent.co/faqs"]
title = "FAQs"
description = "Learn more about CENT."
full_description = "What is a collectible (NFT)?A collectible, same as a digital collectible, or NFT (non-fungible token) is a unique digital asset that is stored on a blockchain. NFTs are a type of cryptographic token that represents ownership or proof of authenticity of a specific item or piece of content, typically digital in nature. The term “collectible” is used because these digital assets are often created and traded as unique, limited-edition items, making them attractive to collectors.‍Collectibles can represent various digital assets, including digital art, music, videos, virtual real estate, virtual goods in video games, and more. The ownership and scarcity aspects, along with the ability to trace the history of ownership on the blockchain, have contributed to the popularity of collectibles in the digital art and entertainment industries, and many other sectors.What are the types of collectibles I can create on CENT?When you create a collectible on CENT, you can choose to create image/video, or a multimedia release (which allows for audio and rich text).‍How do I release a collectible on CENT?Once you create an account, it’s very simple. Just add title, place text and/or media file(s), set selling price, supply and royalties, done. A few other optional settings allow you to release the right collectible to fit your needs.Do I need crypto to use CENT?Nope. Currently, we use USD for all payment transactions partnering with Stripe and also enable Apple Pay. For those who prefer crypto, we are working on ETH payments soon.Is it free?Absolutely. Our mission is to enable creators and artists to make a creative income. We charge a small service fee of 5% ($0.50 min.) for each paid transaction.How do I sign up?For CENT Pages and a convenient hosted experience, sign up here. If you have a website and would like to create your collectibles on your website, sign up for The Collect Button. If you run a Shopify store and would like to offer digital twins, get CENT’s Shopify Plugin."
year_published = 2025
clearnet = "https://www.cent.co/faqs"
tags = ["cent?", "collectible", "collectibles", "create", "crypto", "faqs", "free?", "need", "release", "sign"]
