["https://central.sonatype.org/faq/closed-source"]
title = "Can I upload a closed source artifact? - Documentation"
full_description = "Can I upload a closed source artifact?⚓︎ Questions⚓︎ What if you want to upload an artifact but the source code of that artifact or project is not public or under an open source license. Can I upload it without publishing the source code? Answer⚓︎ Yes! You can upload artifacts under closed source to the Central Repository. For details please read our Terms of Service for Publishers. Just keep in mind that uploading a jar of the sources to pass the requirements is still needed, but you can add any dummy source JAR file (Eg. a JAR with README content) to pass that requirement step when publishing your artifact."
