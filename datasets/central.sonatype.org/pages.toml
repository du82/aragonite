title = "What Happened To My Deployments? - Documentation"
full_description = "What Happened To My Deployments?⚓︎ My deployments are missing?⚓︎ I uploaded a bundle or published a component and it use to show on the deployments tab here https://central.sonatype.com/publishing/deployments now I can't see it anymore. As of October 25th 2024 we enabled cleaning up of Deployments older then 90 days. This allows for improved performance. What if I had a deployment that I need to refer to?⚓︎ I need to audit a particular component on Maven Central to know who published it and when it occurred. We can help with, please send a request to Central Support for details on the Deployment. If possible provide the deployment id, or if you didn't keep track of it a deployment time."
