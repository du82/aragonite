title = "Consume - Documentation"
full_description = "How to Consume Central A consumer is something that would like to access the content of the Central repository. Central HTTP and HTTPS access is maintained by Sonatype on a Content Delivery Network (CDN). The canonical URLs for accessing Central are HTTPS: https://repo1.maven.org/maven2 or https://repo.maven.apache.org/maven2 HTTP is no longer supported as of January 2020. Some general guidance in configuring tools to use Central can be found below: Apache Maven Gradle Sonatype NXRM SBT Leiningen Eclipse Aether (and Apache Ant) Apache Ivy (and Apache Ant) JFrog Artifactory"
