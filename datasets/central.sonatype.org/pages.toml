["https://central.sonatype.org/news/20210223_new-users-on-s01"]
title = "New Users on s01.oss.sonatype.org - Documentation"
full_description = "New Users on s01.oss.sonatype.org⚓︎ This news article is out-of-date This article was published in February of 2021, and is not 100% accurate to our current practices. We are keeping it as-is in order to preserve the record, but we would like to inform users of the following changes: As a general practice, we are no longer migrating users off of https://oss.sonatype.org onto https://s01.oss.sonatype.org We will not be spinning up new OSSRH instances in the future if s01 encounters similar problems to oss We would request that users who are able, migrate to the Central Publisher Portal if they have concerns about OSSRH performance Question⚓︎ I just signed up with Sonatype to publish my components to Maven Central. I've been instructed to use the hostname https://s01.oss.sonatype.org. What happened to https://oss.sonatype.org? Answer⚓︎ On 25 February 2021, new users who sign up with Sonatype to publish to Maven Central will use https://s01.oss.sonatype.org. Why Are We Doing This?⚓︎ The volume of users on https://oss.sonatype.org has increased significantly since late 2020. With the recent announcement of the sunsetting of JCenter, we have seen a surge in new project signups. Even after multiple rounds of scaling up its underlying infrastructure, https://oss.sonatype.org is still running at close to capacity. Current users may run into long and unpredictable periods of slowness, where staging operations time out. By moving new signups to a new host, we hope to provide some relief to existing customers while we investigate ways to improve performance. We are also assisting existing customers who wish to migrate to the new host. Any traffic that we can offload from https://oss.sonatype.org improves the user experience for all users on that host. Users who publish on https://s01.oss.sonatype.org will experience improved performance simply because they're not contending with the thousands of other users who have signed up on the old host over the years. We will be monitoring performance on the new host closely, and, while we don't expect it to be overwhelmed in the foreseeable future, we can always cap subscribership on https://s01.oss.sonatype.org at a level that ensures peak performance and spin up yet another new host to handle future load. What If I'm Already Publishing on https://oss.sonatype.org?⚓︎ If you signed up before 25 February 2021, this change does not affect you. Even after we've updated our documentation on https://central.sonatype.org to reflect the new host, https://oss.sonatype.org is NOT going away. Your existing builds will continue to run and your artifacts published on https://oss.sonatype.org will continue to sync to Maven Central. How Do I Get Help?⚓︎ Should you encounter any issue, please open a support ticket by sending an email to Central Support."
author = "Joel Orlina"
year_published = 2025
clearnet = "https://central.sonatype.org/news/20210223_new-users-on-s01"
