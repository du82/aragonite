["https://central.sonatype.org/faq/how-to-set-txt-record"]
title = "How do I set the TXT record needed to prove ownership of my Web Domain? - Documentation"
full_description = '''How do I set the TXT record needed to prove ownership of my Web Domain?⚓︎ Question⚓︎ How do I set the TXT record needed to prove ownership of my Web Domain? Answer⚓︎ A TXT record is a type of record in DNS that helps to set a configuration or prove ownership of the domain for web services. You can add multiple TXT records for different services. In this case you must add a TXT record with the verification key associated with the namespace registration request that you opened via the Central Publisher Portal (documentation). As all the Domain Registrars services have different procedures these are some links to some more popular Domain Registrars: Domain Register Create TXT Record Documentation Aliyun https://www.alibabacloud.com/help/zh/alibaba-cloud-dns/latest/create-a-dns-record#h2-txt-5 Bluehost https://www.bluehost.com/help/article/dns-management-add-edit-or-delete-dns-entries Cloudflare https://developers.cloudflare.com/dns/manage-dns-records/how-to/create-dns-records/ Domain.com https://www.domain.com/help/article/dns-management-how-to-update-txt-spf-records Dreamhost https://help.dreamhost.com/hc/en-us/articles/360035516812-Adding-custom-DNS-records#TXT_record GoDaddy https://www.godaddy.com/help/add-a-txt-record-19232 Google Domains https://support.google.com/domains/answer/3290350#zippy=%2Cresource-records Hostgator https://www.hostgator.com/help/article/how-to-change-dns-zones-mx-cname-and-a-record IONOS / 1&1 https://www.ionos.com/help/domains/configuring-txt-and-srv-records/managing-txt-records/ Juming https://qy.juming.com/help/detail?type=4&id=20 Name.com https://www.name.com/support/articles/115004972547-Adding-a-TXT-Record Namecheap https://www.namecheap.com/support/knowledgebase/article.aspx/317/2237/how-do-i-add-txtspfdkimdmarc-records-for-my-domain/ Network Solutions https://customerservice.networksolutions.com/prweb/PRAuth/webkm/help/article/KC-454/networksolutions Squarespace https://support.squarespace.com/hc/en-us/articles/31120980444429-Adding-TXT-records Tencent https://cloud.tencent.com/document/product/302/12648 Xinnet http://www.xinnet.com/xinnews/domain/27556.html Check TXT record⚓︎ You can check that you've successfully set your TXT record using an online tool like https://toolbox.googleapps.com/apps/dig/#TXT/ or using the terminal Windows⚓︎ CMD: nslookup -type=TXT yourdomain.com Powershell: Resolve-DnsName yourdomain.com -Type TXT Linux⚓︎ $ host -t txt yourdomain.com yourdomain.com descriptive text "OSSRH-XXYYZZ" or dig -t txt yourdomain.com macOS⚓︎ dig -t txt yourdomain.com'''
