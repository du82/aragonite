["https://central.sonatype.org/consume/consume-jfrog"]
title = "Consume Central with JFrog Artifactory - Documentation"
full_description = "Consume Central with JFrog Artifactory⚓︎ Artifactory's default configuration indirectly proxies the Central Repository via JCenter. With the recent announcement of the sunsetting of JCenter, JFrog states that: Artifactory installations with remote repositories configured against JCenter, GoCenter, and ChartCenter will not be affected by this sunset. We recommend that JFrog Cloud customers continue using jcenter.bintray.com, gocenter.io, and repo.chartcenter.io as Artifactory remote repositories going forward. JFrog self-hosted customers can also continue fetching from these repositories, but are encouraged to migrate to the canonical repositories. We suggest adding a direct proxy to the Central Repository using the HTTPS URL. We have reports of improved performance when proxying Central directly."
