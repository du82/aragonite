title = "Consume Central with Apache Ivy (and Apache Ant) - Documentation"
full_description = 'Consume Central with Apache Ivy (and Apache Ant)⚓︎ Apache Ivy has a built-in resolver for the Central Repository that can be configured in ivysettings.xml and accesses the repository via HTTP. <ivysettings> <settings defaultResolver="chain"/> <resolvers> <chain name="chain"> <ibiblio name="central" m2compatible="true"/> </chain> </resolvers> </ivysettings> To access the Central Repository with Ivy via HTTPS you can add the URL to the resolver definition in the root attribute. <ivysettings> <settings defaultResolver="chain" /> <resolvers> <chain name="chain"> <ibiblio name="securedcentral" m2compatible="true" root="https://repo1.maven.org/maven2" /> </chain> </resolvers> </ivysettings>'
