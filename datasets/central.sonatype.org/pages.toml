["https://central.sonatype.org/faq/registered-on-portal-oss-errors"]
title = "Registered on central.sonatype.com, but getting oss.sonatype.org errors - Documentation"
full_description = '''Registered on central.sonatype.com, but getting oss.sonatype.org errors⚓︎ Question⚓︎ I registered to publish via central.sonatype.com, but I'm getting errors that mention "oss.sonatype.org" when I attempt to publish with Maven or Gradle. Answer⚓︎ There are two publishing methods available: the legacy OSSRH and the Central Portal method. The account registration method is independent of the publishing method. If you registered to publish via central.sonatype.com that doesn't mean you must publish using Central Portal. There are a couple of decision factors to help you determine which publishing method to use: - Publishing through Gradle is also not yet officially supported in Central Portal. There are several community plugins for gradle that might be of interest if you wish to use Gradle. - SNAPSHOT versions should not be used to sync with Maven Central. If you wish for your artifacts to be available from Maven Central, you will have to publish a release version. Snapshots are supported in legacy OSSRH.'''
year_published = 2025
clearnet = "https://central.sonatype.org/faq/registered-on-portal-oss-errors"
