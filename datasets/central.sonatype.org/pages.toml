["https://central.sonatype.org/faq/classic-search-retired"]
title = "Classic Search Retired on 14 January 2022 - Documentation"
full_description = '''Classic Search Retired on 14 January 2022⚓︎ Question⚓︎ Why can't I access https://search.maven.org/classic/ anymore? Answer⚓︎ As of 14 January 2022, users will no longer be able to access https://search.maven.org/classic/. Any requests for that URL will be redirected to https://search.maven.org/, which has been available since we launched the site upgrade on 8 August 2018. In addition, any links to Classic Search on the current site will be removed. Question⚓︎ Why did this happen? Answer⚓︎ Classic search has been available since January 2011, and access logs show minimal usage of that site. Moreover, the current site maintains all the functionality from Classic Search while providing a better overall user experience. Question⚓︎ Will my bookmarks still work? What about any code that relies on the REST API? Answer⚓︎ Bookmarks will work if you simply remove "/classic" from the bookmarked URL. We have updated our documentation to reflect this. The REST API is unchanged. The original set of documented REST endpoints do not contain "/classic" and will continue to work even after Classic Search is retired.'''
