["https://central.sonatype.org/faq/ossrh-account-management"]
title = "OSSRH Account Password Update - Documentation"
full_description = "OSSRH Account Password Update⚓︎ Question⚓︎ How can I update my OSSRH password ? Answer⚓︎ Our previous OSSRH Account Management Portal has been decomissioned. The OSSRH account profiles were merged with the same authentication provider used by Central Portal. To update your Central Portal account password please follow our Managing Your Credentials instructions. After that use the new password to log in the Nexus host where your OSSRH publisher profile was configured previously. Create a user token in Nexus for deployment pipelines The username and password you use to log in Central Portal and Nexus host cannot be used in deployment pipelines. Follow our instructions to Generate a Token on OSSRH servers."
