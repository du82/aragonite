["https://central.sonatype.org"]
title = "The Central Repository Documentation - Documentation"
description = "Official documentation by the maintainers of The Central Repository"
full_description = "WELCOME Welcome to the documentation for the Central Repository. Serving Open Source Components Since 2002 Why Use Central?⚓︎ Ease of Use The Central Repository is the default repository for Apache Maven, SBT and other build systems and can be easily used from Apache Ant/Ivy, Gradle and many other tools. Ubiquitous Open source organizations such as the Apache Software Foundation, the Eclipse Foundation, JBoss and many individual open source projects publish their components to the Central Repository. What You Want When you develop software you depend on open source components, and these external libraries are predictably available on the Central Repository. Learn more about Central... And Publishing is Easy!⚓︎ Requirements There are some minimal requirements for publishing your component to the Central Repository. These are the basic elements of quality metadata that developers rely on and that the community has standardized on. Register Your Project We require basic information about your project: where artifacts are hosted so that they can be incorporated into the Central Repository, and where to publish them. Deploy Your Components The deployment procedure ensures the basic requirements are met and uploads your components. There are many tools available for this and we have documentation available for the most popular ones. See the Deployment Guide"
