["https://central.sonatype.org/faq/what-is-different-between-central-portal-and-legacy-ossrh"]
title = "What is different between Central Portal and Legacy OSSRH? - Documentation"
full_description = '''What is different between Central Portal and Legacy OSSRH?⚓︎ I am considering migrating from Legacy OSSRH to Central Portal, and I would like to know the differences between them. Publishing⚓︎ Publishing to Maven Central via the Central Portal and via Legacy OSSRH are two different methods: they use different connection endpoints, plugins and authorization credentials. More details can be found in our documentation: Central Portal Legacy OSSRH How do I know if I am on Legacy OSSRH? If you use https://oss.sonatype.org or https://s01.sonatype.org to publish, you are publishing via the Legacy OSSRH service. If you are publishing via a build tool integration, this might be configured as a default, so check the plugin's documentation to be sure, if you didn't manually specify a URL. You will not be able to use Central Portal to publish a component under a namespace that you publish to through Legacy OSSRH, Neither will you be able to do the opposite, and publish using Legacy OSSRH with a namespace that you have access to on Central Portal. Authentication⚓︎ User tokens for the Central Portal use a different token system than OSSRH tokens. When migrating, you must create a new token for your deployment process. If you encounter 401 Unauthorized errors after migrating, you are likely publishing with your old OSSRH token. Gradle⚓︎ Publishing through Gradle is also not yet officially supported in Central Portal. There are however several third-party plugins for Gradle that might be of interest if you wish to use Gradle. Process to Migrate⚓︎ Self-Service Migration⚓︎ At the moment, self-service migration is limited based on the following conditions: Namespaces that only have a single authorized publisher Namespaces that do not have parent or child namespaces As we continue to improve the Central Publisher Portal, we will expand the number of publishers who are able to self-service migrate, so be sure to check our documentation before requesting a manual migration. Navigate to the namespaces page. Observe the section labeled "OSSRH Namespaces". If that section does not exist, there are no OSSRH namespaces associated with your account. If you expect there to be namespaces listed, first verify that they are not associated with a different publisher account, and then contact Central Support. Click on the "Migrate Namespace" button to open the migration popup. Observe the popup. A namespace that passes all of the criteria for self-service migration will display a checkbox to indicate that you have read the documentation and wish to proceed. A namespace that does not pass some of the criteria to be self-service migrated might look like the following: Manual Migration⚓︎ Contact Central Support, using an email address that is associated with a known publisher to the namespace, after reading thoroughly through our documentation to assure you are aware of the difference and how to publish through Central Portal. Central Support confirms you own the namespace, If you do not own the namespace migration might not be permitted. Central Support will send you details about the migration and confirm you are ok to move forward with the migration. After receiving confirmation, migration will be done. Confirmation will be sent to you with details about the migration.'''
year_published = 2025
clearnet = "https://central.sonatype.org/faq/what-is-different-between-central-portal-and-legacy-ossrh"
