["https://central.sonatype.org/faq/what-happened-to-search-maven-org"]
title = "What Happened To search.maven.org? - Documentation"
full_description = "What Happened To search.maven.org?⚓︎ What happened to search.maven.org?⚓︎ I typed https://search.maven.org into my browser, but ended up on https://central.sonatype.com. What happened to https://search.maven.org? On 23 February 2023, we started redirecting users looking for https://search.maven.org to https://central.sonatype.com. We believe that, since its launch in September 2022, https://central.sonatype.com has offered the main functionality of https://search.maven.org along with enhanced component details, including security vulnerability and software quality information. The search index backing https://central.sonatype.com is also updated much more frequently and reliably than the index backing https://search.maven.org, generally within a few minutes after a new component is published to Maven Central. We are also no longer investing in additional features or functionality on https://search.maven.org and are planning a retirement date for that web interface in late 2023/early 2024. Can you add search.maven.org features to central.sonatype.com?⚓︎ There's a feature on https://search.maven.org that I'm unable to find on https://central.sonatype.com. Can you add that feature to the new site? If you discover functionality that's missing or have suggestions for new things to add, we'd love to hear from you! Please contact Central Support. Is it possible to continue using search.maven.org?⚓︎ I really need to keep using a feature on https://search.maven.org. Is there any way I can continue using it? Absolutely! Any request referred to https://central.sonatype.com from https://search.maven.org will result in a pop-up that looks like this: This link appears in that pop-up, and you can click it to be sent back to https://search.maven.org. Clicking that link will also set a flag in your browser's local storage that will keep you from being redirected to https://central.sonatype.com in the future (or at least until you clear your browser cache). What about the search.maven.org API?⚓︎ I rely on the search.maven.org API. Is this going to break existing API usage? Not at all! We implemented this change to target only web browser traffic. API requests will continue to function, and, if you have tooling that relies on those API requests, we expect to support the API even after we've retired the web interface. We are currently investigating migrating the API to use the same data stores as https://central.sonatype.com, not just so that API consumers can take advantage of more frequently and reliably updated data, but also so that we can offer enhanced data via the existing APIs. We will update the community on our progress in the News section."
year_published = 2025
clearnet = "https://central.sonatype.org/faq/what-happened-to-search-maven-org"
