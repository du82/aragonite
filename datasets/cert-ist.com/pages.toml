full_description = '''Comment puis-je bénéficier de ces services ? Les services du Cert-IST sont réservés aux membres adhérents du Cert-IST. Pour obtenir des informations sur les modalités d’adhésion, veuillez prendre contact avec le Cert-IST en remplissant le formulaire disponible à la rubrique Adhésion au Cert-IST. FAQ Introduction au Cert-IST Qu’est-ce que le Cert-IST ? Que veut dire l’acronyme Cert-IST ? Par qui le Cert-IST a-t-il été fondé ? Depuis combien de temps le Cert-IST fonctionne t-il ? Quel est le lien entre le Cert-IST et les autres CERT ? Qu’est-ce que le FIRST ? Les services Cert-IST Quels sont les services proposés par le Cert-IST ? Comment puis-je bénéficier de ces services ? Page d'accueil Que trouve-t-on dans la rubrique "Menaces en cours" ? Que trouve-t-on dans la rubrique "Exemples d'avis" ? Peut-on afficher le contenu des avis listés dans la rubrique "Exemples d'avis" ? Fonctionnement du site Comment effectuer une recherche sur le site public ? Où trouver le plan du site web ? Quelle est la différence entre le site public et le site privé du Cert-IST ? Signaler un incident ou une vulnérabilité Comment signaler un incident ou une vulnérabilité ? Comment envoyer des informations sensibles au Cert-IST ? Le Cert-IST a-t-il une politique de divulgation des failles ? Comment puis-je bénéficier de ces services ? Les services du Cert-IST sont réservés aux membres adhérents du Cert-IST. Pour obtenir des informations sur les modalités d’adhésion, veuillez prendre contact avec le Cert-IST en remplissant le formulaire disponible à la rubrique Adhésion au Cert-IST. Précedent Suivant Partager Imprimer'''
