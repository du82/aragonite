["https://cert-ist.com/public/fr/Partenariat"]
title = "Computer Emergency Response Team - Industrie Services et Tertiaire"
description = "Cert-IST :Computer Emergency Response Team - Industrie, Services et Tertiaire. Le Cert-IST est un centre d'alerte et de réaction aux attaques informatiques destiné aux entreprises françaises. Le Cert-IST est une association de Loi 1901, qui a pour vocation d'assurer pour ses Adhérents des services de prévention des risques et d'assistance aux traitements d'incidents."
full_description = '''Coopération Au niveau international, le Cert-IST est membre du FIRST (Forum for Incident Response and Security Teams) depuis le 01/06/1999. Le Cert-IST peut ainsi s'appuyer sur un réseau mondial de plus de 250 CERT affiliés au FIRST, ce qui donne accès à un système d'alerte unique au monde en fournissant les points de contact nécessaires à l'investigation des incidents trans-frontaliers et en offrant un accès privilégié aux informations non encore publiques. Le Cert-IST a été retenu pour organiser, en 2001, la 13ème conférence du FIRST. Au niveau européen, le Cert-IST est un membre accrédité du Trusted Introducer depuis mars 2006 et participe à la TF-CSIRT qui assure la collaboration entre Computer Security Incident Response Teams (CSIRTs) en Europe. De plus, le Cert-IST a été le coordinateur du projet EISPP ("European Information Security Promotion Programme") de la communauté européenne. Ce projet a pour but de développer un réseau européen de CERT et de mettre à la disposition des PME/PMI des services de sécurité. Au niveau français, le Cert-IST entretient, sous l'égide des organismes de SSI (SGDSN et ANSSI), des relations privilégiées avec ses homologues, et en particulier le CERT-RENATER (dédié à la communauté de l'enseignement et de la recherche), et le CERT-FR (dédié au secteur de l'administration).'''
