["https://cert-ist.com/public/fr/AssociationCertIST"]
title = "Computer Emergency Response Team - Industrie Services et Tertiaire"
description = "Cert-IST :Computer Emergency Response Team - Industrie, Services et Tertiaire. Le Cert-IST est un centre d'alerte et de réaction aux attaques informatiques destiné aux entreprises françaises. Le Cert-IST est une association de Loi 1901, qui a pour vocation d'assurer pour ses Adhérents des services de prévention des risques et d'assistance aux traitements d'incidents."
full_description = "Association Cert-IST Le Cert-IST est une Association Loi 1901, qui a pour vocation d'assurer à ses adhérents des services de prévention des risques et d'assistance au traitement d'incidents. Le mode associatif du Cert-IST garantit son indépendance vis-à-vis des éditeurs et des constructeurs. Il travaille pour la communauté en mutualisant des ressources et en assurant le partage d'expérience. La pérennité du Cert-IST est assurée par ses membres. La confiance des membres du Cert-IST est renforcée chaque jour par : La véracité et le caractère exhaustif des informations transmises La confidentialité des informations privées toujours démontrée La garantie de l'objectivité La pérennité de l'activité L'association Cert-IST a été déclarée sous numéro 2688 au Journal Officiel du 26 avril 2003. Cette déclaration est consultable en ligne. Les nouveaux statuts ont été approuvés lors de l’Assemblé Générale du 19 mars 2019. Vous pouvez joindre le Président de l’association en écrivant à : president @ cert-ist.com Vous pouvez consulter les statuts de l'Association : Statuts"
