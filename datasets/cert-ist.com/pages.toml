full_description = '''Que trouve-t-on dans la rubrique "Menaces en cours"? Cette section liste les menaces en cours, avec pour chacune : le nom de la menace. le niveau de la menace : la jauge indique si pour cette menace le Cert-IST a émis un Avis (AV), un Danger Potentiel (DG) ou une Alerte (AL). la date de la dernière mise à jour du blog associé : ce blog permet au Cert-IST de publier tout au long du déroulement de la menace les informations les plus pertinentes, et en particulier des recommandations et/ou palliatifs pour aider les Membres du Cert-IST à contrôler cette menace. Nota : Sur le site web public, seul le tableau de bord général de suivi est visualisé et il n'est pas possible d'accéder aux détails associés. Le site privé (réservé aux membres du Cert-IST) dispose lui d'un accès complet dans lequel ce même tableau de bord est 'cliquable'.'''
