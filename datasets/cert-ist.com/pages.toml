["https://cert-ist.com/public/en/Risque"]
title = "Computer Emergency Response Team - Industrie Services et Tertiaire"
description = "Cert-IST :Computer Emergency Response Team - Industrie, Services et Tertiaire. Le Cert-IST est un centre d'alerte et de réaction aux attaques informatiques destiné aux entreprises françaises. Le Cert-IST est une association de Loi 1901, qui a pour vocation d'assurer pour ses Adhérents des services de prévention des risques et d'assistance aux traitements d'incidents."
full_description = "Risk levels Le Cert-IST includes in its publications 2 metrics to indicate the severity of a vulnerability: The CVSS score (since 2007) which is a number from 0 (no risk) to 10 (maximum risk). CVSS is a standard defined by www.FIRST.org (worldwide organisation which gathers CERTs). The EISPP risk (since 2003), the value of which can be: Not rated, Low, Medium, High or Very high. This risk was defined as part of the European EISPP project: www.cert-ist.com/eispp. Two calculation methods have been used successively by Cert-IST: EISPP risk 1.3 before 2024, EISPP risk 3.0 from February 2024 onwards. The image below gives an overview of the matrices used to calculate the EISPP risk 3.0."
