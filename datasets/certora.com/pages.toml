full_description = "April 11, 2024Prover v7.3.0 - Enhanced User Experience FeaturesAuthor:Uri KirsteinProver version 7.3.0 is out! This update aims to enhance your user experience and address some minor bugs reported by our users.New Web FeaturesJump to SpecQuickly locate rule definitions or assertion messages within your spec file by clicking the new icon in the Rules, Rule Call Resolution, or Global Call Resolution tab itemsReal-time insightsStay informed with the new Live Statistics tab, providing key metrics on path count, non-linear operations, and memory/storage complexity before job completion. These metrics guide simplification strategies to optimize Prover performance.Job configurations tabExplore the new Configuration tab to quickly access the exact settings used for your verification jobProver UpdatesEasy access to immutables Access immutable variables directly, even if they are private. Read more | ExampleAdvanced rule selection Enhance filtering flexibility with wildcard (*) support in --rule or utilize--exclude_rule for seamless exclusion. Read moreReason about blobhash Verify advanced specifications with Prover's new support for blobhash instruction and hooks. Read morePreliminary support of transient storagePreliminary support for tload and tstore operations in inline-assembly Solidity, along with ALL_TLOAD and ALL_TSTORE hooks. Read more | Example Dispatch-list summarizationEnhance contract behavior modeling with dispatch-list summarization, enabling precise representation of smart contract actions for statically unresolved calls. Read more | ExamplePrecise bitwise operationsFine-tune modeling by using --precise_bitwise_ops to model bitwise operations precisely with the tradeoff of lowering mathint accuracy. Read more | ExampleLocal compilation checksSpeed up development with --compilation_steps_only, enabling local compilation and syntax validation of spec files without server connection. Read moreAccess these updates by ensuring your software is up-to-date with the latest version. To upgrade to v7.3.0, simply run pip install --upgrade certora-cli. View full release notesGet every blog post deliveredSubscribe"
