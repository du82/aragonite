full_description = "Meet our team of security expertsWe bring extensive experience from across the software and blockchain security space, 20% of our employees hold PhDs in formal verification methods. Follow us on TwitterLeadership TeamMooly SagivCEOMooly Sagiv is a leading researcher in formal verification. He co-founded Certora to scale formal verification to secure smart contracts. Mooly is a recipient of numerous prestigious academic awards, including the Friedrich Wilhelm Bessel Research Award, ACM fellow, and the Microsoft Research Outstanding Collaborator, member of European Academy of Science.Shelly GrossmanCTOShelly has an extensive background in formal verification. She is also an experienced software engineer who spent 5 years at Check Point. Shelly is the lead author of the isolation technique for ensuring the correctness of modular reasoning. Nurit DorChief Product OfficerNurit holds a PhD from Tel Aviv University in Static Code Analysis. She is the author of 13 academic papers and 35 patents. She was a CSO at Panaya, a static-analysis company acquired by Infosys and a research manager at KayHut. Nurit has extensive experience in static and dynamic analysis of low-level bytecode, and hands-on experience in transferring ideas from research to robust products.John TomanChief ScientistJohn Toman received his PhD in 2019 from the University of Washington. His research focuses on bringing the power of automated verification to real-world, industrial settings. John’s award-winning, impact-focused research has been published at several top conferences in the field.Jaroslav BendíkVP R&DJaroslav received his Ph.D. in the areas of formal verification and constraint processing. He is the main developer of several state-of-the-art tools for analyzing infeasible Boolean and SMT constraint systems (e.g., UNIMUS or ReMUS), and his work was published at a dozen major conferences in the field. Before joining Certora, Jaroslav worked as a researcher at the National University of Singapore and at the Max Planck Institute for Software Systems.Idit KronzonVP of PeopleIdit has many years of experience in People leadership and OD roles in global leading hi-tech and financial firms including Freescale and Arm. She has proven ability for adding value to the business through HR strategies that support the achievement of business objectives. Idit has a B.Sc. in Psychology and M.Sc. in Organizational Behavior, both from Tel-Aviv University.Chandrakana NandiUS R&D DirectorChandrakana received her PhD from the University of Washington. Her expertise is in compilers, term rewriting, and program synthesis. Her work has won an Adobe Fellowship and Distinguished Paper Awards at POPL and OOPSLA.Johannes SpäthR&D Director Johannes is enthusiastic about security startups and believes that a strong product, backed by an enthusiastic and versatile team can have a massive impact. Originally, he studied mathematics but then found his passion in code analysis, because he is convinced that it can solve many of today’s challenges in security. Sofi VissaniHead of GrowthSofi has been working in the industry for a few years now. She was part of Babylon.finance, a DeFi protocol, and before that, she worked at Open Zeppelin. She is all about exploring new things. In her free time, she has been learning data science and now solidity.TeamDravee Security ResearcherHake security researcher0xa5df Security ResearcherRaiders DeFi Security Technical WriterGreed Security ResearcherMrPotatoMagic Security ResearcherFlint Security ResearcherDeth Security Researcher0xlemon Security ResearcherAvi AdlinUI/UX expert/ Senior Product DesignAlexander Bakst, PhDSenior ResearcherEleonora BellottoSales RepYuval Ben DorSW EngineerEric EilebrechtSenior SW EngineerGad ElbazSecurity EngineerYoav ElmalemDirector Development IntegrationsElad ErdheimVP of Code SecurityAnastasia FedotovSoftware TL, Tech LeadAndrew Ferraiuolo, PhDFormal VerificationTomer GanorSecurity Researcher, Tech LeadAl