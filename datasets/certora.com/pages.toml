full_description = "Blend V1February 3, 2025This document describes the formal verification effort of Blend V1 using Certora’s Sunbeam Prover, a tool developed to verify Soroban smart contracts. February 28, 2025Jito Tip RouterJitoThis document describes the verification effort of the Jito Tip Router using manual code review. The work was undertaken from December 23, 2024, to January 13, 2025.February 24, 2025EigenLayer ProtocolEigenLayerThis document describes the specification and verification of EigenLayer Slashing using the Certora Prover. The work was undertaken from January 10th 2025 to February 11th 2025.February 24, 2025Kamino LendingKamino FinanceThis document describes the specification and verification of the Kamino Lending Protocol using the Certora Prover and the manual code review of two consecutive audits. The work was undertaken from November 4, 2024 to December 13, 2024, as well as from February 3, 2025 to February 21, 2025February 19, 2025MEV Tax HookBalancerThis document describes the specification and verification of MEV Tax Hook using the Certora Prover and manual code review findings. The work was undertaken from 3 February 2025 to 7 February 2025.February 13, 2025Relend NetworkRelend NetworkThis document describes the security assessment of Relend Network using manual code review findings. The work was undertaken from 3 Feb to 7 Feb 2025February 12, 2025Glow LRTGlow FinanceThis document describes the findings of the manual review of Glow LRT, which was undertaken from December 2 to December 6, 2024.February 12, 2025DopplerDopplerThis document describes the manual smart contract security review the Cerotra team conducted from November 4 to November 11, 2024.February 12, 2025LuloLuloThis document describes the findings discovered during the audit of Lulo smart contracts using manual code review, which was undertaken from 18 November 2024 to 23 January 2025.February 5, 2025Lido Dual GovernanceLidoThis document describes the specification and verification of Lido Dual Governance using the Certora Prover and manual code review findings. The work was undertaken from August 8 to September 5, 2024February 5, 2025Stablepool Surge hooksBalancer This document describes the verication of Balancer V3 Stablepool Surge hook manual code review. The work was undertaken from January 23rd 2025 to January 30th 2025.January 28, 2025Boring Bridge Holder Veda LabsThis report presents the smart contract security audit of the Boring Bridge Holder, including manual code review findings for Solana contracts. Conducted in November 2024, the audit identified critical risks and offered insights into program authority, documentation accuracy, and decentralization concerns.January 15, 2025Origin DollarOrigin ProtocolThis document describes the specification and verification of Origin-Dollar using the Certora Prover. The work was undertaken from Nov 26th 2024 to Dec 12th 2024.January 7, 2025Silo v2SiloThis document describes the specification and verification of silo contracts v2 using the Certora Prover and manual code review findings. The work was undertaken from November 4th to November 25th 2024December 30, 2024Gyroscope PoolsBalancerThis document describes the smart contract security review of Gyroscope Pools using the Certora Prover and manual code review findings. The work was undertaken from December 12th, 2024 to December 24th, 2024December 29, 2024Aquarius AMM SecurityAquariusThis report describes the manual code review findings of the new Aquarius protocol. The work was undertaken from November 18, 2024 to December 13, 2024December 13, 2024Stake Deposit InterceptorJito FoundationComprehensive security assessment and formal verification of the Stake Deposit Interceptor using manual code review and Certora Prover, conducted from November 24, 2024, to December 13, 2024.December 12, 2024LiquityBoldThis document describes the specification and verification of BOLD using the Certora Prover. The work was undertaken from September 9,