title = "Gambit - an open source Solidity mutation testing tool"
description = "Gambit is an open source Solidity mutation testing tool to evaluate and strengthen your testing suite."
full_description = "Take your tests to the next levelGambit is an open source Solidity mutation testing tool to evaluate and strengthen your testing suite. View on GitHubBuild confidence in your test suiteGambit introduces faults, called mutants, to the contract you choose to test and measures your test suite’s ability to detect these mutants. The more mutants a test suite detects, or kills, the better the test suite is. Solidity/app/contracts/BallGame.sol// Solidity function that multiples two numbers and returns the result contract Multiply { function mul(uint a, uint b) public returns (uint c) { c = a * b; } }Solidity Mutation/mutations/BallGame.sol// This mutant changes the `*` operator to `+` contract MultiplyMutation { function mul(uint a, uint b) public returns (uint c) { - c = a * b; + /// BinaryOpMutation(`*` |==> `+`) of: `c = a * b;` + c = a + b; } }Flexible integration for any Solidity projectOpen SourceGambit is an open source tool that can be used on any Solidity project. Gambit is built by the Certora team and we are committed to maintaining and updating Gambit as an open source project into the future.View on GitHub→Integrated with ProverMutations generated by Gambit can be used to evaluate both tests as well as formal specifications. This means that if you already running tools like Certora Prover, you can utilize Gambit to ensure the strength of your rules. Learn about Prover→Visualized ResultsGambit is easy to run with our command line tools, and results can be conveniently viewed using the Gambit dashboard. You'll get insights on each violation to help you write better tests. Visualize your resultsGambit DashboardLearn about some of the features that Gambit has to offerOpen Source Fast, extensible, and open-source mutation generator for Solidity.Easy Integration Easy to integrate with both verification tools and testing tools. Already integrated with the certora prover!Adaptive Mutations Traverses the abstract syntax tree of the solidity program to identify valid mutation points.Scored Results User friendly UI that summarizes the results of verifying the mutants and computes a score to evaluate the specification.High Variability Generates unique mutants that are unlikely to be redundant or equivalent to the original program.Targeted Muations Allows users to customize and localize mutants to focus on specific program parts using a simple declarative configuration language.Next steps for better testsIntro to GambitGet a brief introduction to how you can start using Gambit in our introductory blog post. Read Now→Read the DocsDive into the documentation to learn how you can get setup to run Gambit and use the tool to effectively evaluate your testing suite.Go to Docs→Dive into the CodeView the code on GitHub to take a look under the hood, or to open a pull request to make a contribution to the project.View on GitHub→"
