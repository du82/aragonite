full_description = "Privacy PolicyCertora Ltd. (“Certora”, “we”) is committed to maintaining the privacy of its users (“user”, “you”). The following information describes how Certora collects and processes information about you when you use our website (the “Website”).Our Privacy Policy explains:What information we collect and why we collect it.How we use that information.Your rights with regard to the collection of such information.By using our Website, you agree to this Privacy Policy.1. GeneralCertora provides technology for eliminating vulnerabilities in smart contracts by offering a suite of tools for auditing smart contracts, including detecting vulnerabilities and generating assurances that essential properties hold. The Website provides information about Certora and its services and enables its users to use a Demo, contact Certora and apply for a job at Certora (“Services”).2. DeviceYou can access the Website through various Devices. A “Device” is any digital device used to access the Website, including without limitation a desktop, laptop, mobile phone, tablet, or other consumer electronic device. This Privacy Policy governs your access of the Website, regardless of how you access them, and by using our Website you consent to the collection, transfer, processing, storage, disclosure and other uses described in this Privacy Policy.3. Collecting InformationPlease note that the scope of this Privacy Policy is limited only to information collected by Certora through your use of its Website. Some information may be automatically collected, and some is collected when you interact with our Website. The type of information that may be automatically collected is non-personal information, which includes your session durations, the content you accessed on the Website, the frequency and scope of your use of the Website and information about your Device and internet connection including the operating system you use and browser type.Information from which you can be personally identified may also be collected, including but not limited to your name and email address (hereinafter: “Personal Information”). Personal Information shall be collected only if received voluntarily from you, including, without limitation, via the following ways:Contact UsIf you contact us for various reasons such as asking questions, we will collect your name, email address, the name of the company you are associated with and the information related to your inquiry.Use of a DemoIf you use our Demo, we will collect your email address, the name of the company you are associated with and the document you wish we will analyze.Applying for a Job at CertoraIf you wish to apply for a job at Certora we will collect your full name, email address, LinkedIn profile and any information you submitted that is included in your CV.4. Use of InformationWe use the Personal Information we collect from you for a range of different business purposes according to different legal bases of processing. We may use or process your Personal Information for the following purposes. One or more purposes may apply simultaneously.Providing the Requested ServicesWe collect the Personal Information set forth under Section 3 above to provide you with the requested Services.Such collection of information will enable us to provide you with technical and professional assistance, with regard to the Website and Services you are provided with or wish to be provided with.We process the Personal Information where it is necessary for the adequate performance of the contract we have or may have with our users.Improvement and Development of the ServicesWe collect Personal Information to improve and develop our Services and understand feedback on Certora’s Website and to help provide more information on the use of the Services more quickly and easily.We collect Personal Information for ongoing review and improvement of the information provided on our Website to ensure it is user friendly.We collect Personal Information to improve the management and administration of our business and maintain compliancy with our internal policies and procedures.We conduct surveys and research, test features in development, and analyze the information we have to evaluate and improve our Website, develop new features, and conduct audits and troubleshooting activities.We process this information in light of our legitimate interest in improving the Website, to allow our users to have the best experience.Maintain a Safe and Secure EnvironmentWe may use your information to detect and prevent fraud, abuse and security incidents in the following ways;Verify and authenticate your identity and prevent unauthorized or illegal activity;Enhance the safety and security of Website;Conduct security investigations and risk assessments;Prevent or take action against activities that are, or may be, in breach of our terms of service or applicable law.We process this information in light of our legitimate interest in improving our Website by enabling our users to browse in a secure environment.Personalize Content, Advertising and MarketingIf you have used Certora’s Services in the past, we have a legitimate business interest for matching the data we collect with other data we had already collected.This enables us to understand your needs and interests, optimize the content we send you and make it more suitable and relevant to your needs.This also enables us to improve your experience on the Website by providing you with personalized content, recommendations, and features.We process this information in light of our legitimate interest to personalize your experience on the Website and customize our content.5. Disclosure of Information and Transfer of DataExcept as otherwise provided in this Privacy Policy, we reasonably attempt to ensure that we never intentionally disclose any of your Personal Information, to any third party without having received your permission, except as provided for herein or otherwise as permitted or required under law.In order to perform our contractual and other legal responsibilities or purposes, we may, from time to time, need to share your Personal Information with third parties. We may as well share your Personal Information with our affiliates, subsidiaries or any third party service providers and individuals to facilitate our Website or any portion thereof, such as marketing, data management or maintenance services. We may also share your information with analytics service providers for analytics services. Such analytics service providers set their own cookies or other identifiers on your Device, through which they can collect information about your usage of Website. This helps us compile aggregated statistics about the effectiveness of our Website.The above mentioned third parties may be located in countries other than your own, and we may send them information we receive. When such third-party service providers process your Personal Information on our behalf, we will assure that they comply with obligations similar to those which are set forth in this Privacy Policy. We will also assure that they will abide by our data privacy and security requirements and will be allowed to use the Personal Information solely for the purposes we set. We will transfer your Personal Information while using appropriate and suitable safeguards, while using a variety of legal mechanisms, including contracts, to ensure your rights and protections travel with your data.We may also transfer your information, including Personal Information, in connection with a corporate merger, consolidation, the sale of related assets or corporate division or other fundamental corporate changes. Furthermore, information about you may also be released in order to comply with any valid legal obligation or inquiry or process such as a search warrant, subpoena, statute or court order. We will also release specific information in special cases, such as if you use the Website to perform an unlawful act or omission or take any act or omission that may damage Certora, its property and goodwill, or if there is an attempted breach of the security of the Website or a physical or property threat to you or others. With respect to our data protection practices, you have the right to file a complaint to any relevant supervisory data protection authority.6. Your RightsYou have the right at any time to request to access or modify your information. To exercise these options, please contact us at ea@certora.com.In some jurisdictions, in particular those located within the European Union (the “EU“), within the European Economic Area (the “EEA“) or within the United Kingdom (the “UK”), you may be afforded specific rights regarding your Personal Information. Subject to such eligibility, you may have the following rights to:Request a rectification of your Personal Information where the information we hold about you is incorrect or incomplete.Object to the processing of your Personal Information for direct marketing purposes.Object to the processing of your Personal Information where our legal basis for that processing is that such processing is necessary for our legitimate interests.Object to an automated decision-making (including profiling) in certain circumstances.Request the erasure of your Personal Information in certain circumstances, such as where processing is no longer necessary for the purpose it was originally collected for, and there is no compelling reason for us to continue to process or store it.Receive your Personal Information, or ask us to transfer it to another organization that you have provided to us, which we process by automated means, where our processing is either based on your consent or is necessary for the performance of a contract with you.If you wish to file a request regarding any of the above, you may contact us at: ea@certora.com.7. California Privacy RightsThe California Consumer Privacy Act of 2018 (“CCPA”) permits users who are California residents to request to exercise certain rights. If you are a California resident, the CCPA grants you the right to request certain information about our practices with respect to your Personal Information. In particular, you can request the following:The categories and specific pieces of your Personal Information that we have collected.The categories of sources from which we collected your Personal Information.The business or commercial purposes for which we collected your Personal Information.The categories of third parties with which we shared your Personal Information.You can be rest assured that we do not sell your Personal Information. If you choose to exercise your rights, we will not charge you different prices or provide different quality of our Website, unless those differences are related to your provision of your Personal Information.Please note that we will be required to verify your identity and request before we are able to comply with your requests. As a part of this process, government identification may be required.We endeavor to respond to a verifiable consumer request within 45 days of its receipt. If we require more time (up to 90 days), we will inform you of the reason and extension period in writing. Any disclosures we provide, will only cover the 12 month period preceding your verifiable request’s receipt. If, for some reason, we cannot reply within such time frame, our response will include an explanation for our inability to comply. If you wish to exercise your CCPA rights, please contact us at: ea@certora.com.We will not discriminate against you for exercising any of your CCPA rights. Unless permitted by the CCPA, we will not:Deny you goods or services.Charge you different prices or rates for goods or services, including through granting discounts or other benefits, or imposing penalties.Provide you with a different level or quality of goods or services.Suggest that you may receive a different price or rate for goods or services or a different level or quality of goods or services.8. CAN-SPAM ActThe CAN-SPAM Act is a Federal US law that sets the rules for commercial email, establishes requirements for commercial messages, gives recipients the right to have emails stopped from being sent to them, and spells out strict penalties for violations.To be in accordance with CANS-PAM, Certora agrees to the following:Not use false or misleading subjects or email addresses.Identify the commercial message sent to you as an advertisement when required.Include the physical address of our business or site headquarters.Monitor third-party email marketing services for compliance, if one is used.Honor opt-out/unsubscribe requests quickly.Allow users to unsubscribe by using the link at the bottom of each email.If at any time you would like to unsubscribe from receiving future emails, you can email us at ea@certora.com and we will promptly remove you from ALL correspondence.9. CookiesWe may use “cookies” and/or other technologies or files (collectively, “cookies”) to identify how visitors make use of this Website. This aggregated tracking information may be used to help us improve and enhance the Website experience for all of our users. In addition, cookies are used for adjusting the Website to your personal preferences. Cookies contain information such as the pages you visited, the length of time you stayed on the Website, the location from which you accessed the Website and more. If you would prefer not to have cookies stored on your Device, you may modify your browser settings to reject most cookies, or manually remove cookies that have been placed on your Device. However, by rejecting the cookies, you may be unable to fully access the offerings on this Website. To find out more about cookies, visit www.allaboutcookies.org.10. Opt in or Opt OutYou are always in control of your data, and if you choose to receive information from us, you can change your mind later. If, at any time, you would like to stop receiving such information or opt out of a feature, you may notify us by writing to ea@certora.com. You should be aware, however, that it is not always possible to completely remove or modify information in our databases and servers, although we will always make reasonable efforts to do so upon your request.11. Links to Other WebsitesThis Website may provide links to other websites. Please be aware that these other websites are not covered by our Privacy Policy. This Privacy Policy does not cover the information practices exercised by other providers of products or services, advertisers or other websites, companies or individuals, which are not owned or controlled by Certora. We suggest that when linking to another website, you always read that website’s privacy policy before volunteering any personally identifiable information.12. Data SecurityWe deploy industry standard measures to ensure the security, confidentiality, integrity and availability of Personal Information we process. We maintain physi"
