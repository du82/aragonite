["https://certora.com/blog/white-paper"]
title = "Certora Technology White Paper"
description = "Discover how Certora’s innovative tool suite, including the Certora Prover, transforms smart contract security. Explore automated verification, property-based specifications, and advanced static analysis for blockchain protocols."
full_description = "February 24, 2025Certora Technology White PaperUnveiling the Power and Limitations of Certora's Smart Contract Verification TechnologyAuthors:Chandrakana NandiMooly SagivDaniel JacksonEditors:Uri KirsteinSameer AroraJohn TomanNurit DorShelly GrossmanRaiders BlakeCertora Tool SuiteCertora offers a suite of tools for auditing smart contracts, including both the detection of vulnerabilities and the generation of assurances that essential properties always hold. This article assumes that the readers are familiar with the basic ideas of smart contracts. More details of the examples mentioned in this document can be found in our Examples repo.The core of the tool suite is the Certora Prover, a verification tool that takes a low-level contract bytecode (e.g., EVM bytecode program, a Solana eBPF object, or a Stellar WASM object), and a specification written in CVL (Certora Verification Language) or CVLR (Certora Verification Language for Rust). The prover analyzes the code and the spec together to identify scenarios where the code deviates from the specification. The technology automatically locates critical vulnerabilities that even the best auditor may miss and increases confidence in code security by proving that certain key properties are satisfied.Developers and security researchers alike can gain value by using the Certora Prover. For developers, the Prover provides stronger guarantees than either testing or fuzzing, and its setup requires less boilerplate code and harnessing. Researchers can also use the Prover to map out the attack vectors and choose where to focus their efforts.At a high level, the Certora Prover is essentially a sophisticated compiler, translating the smart contract bytecode and the specified properties into a mathematical formula that concisely defines the exact conditions under which the program may violate the expected behavior specified in the properties. This formula is fed into state-of-the-art open source solvers that examine the infinite space of possible executions and find any violating scenarios, which are then translated back by the compiler into the domain of the smart contract. On the other hand, if the formula is not solvable, then it is impossible for the program to violate the expected behavior.Additionally, Certora has developed more tools:Gambit for ensuring specification quality using mutations and vacuity detectionSafeguard for monitoring invariants within an Ethereum nodeQuorum for catching errors in governance proposal payloads.Verification vs. AuditingSince a vulnerability in a smart contract can expose the creator of the contract and its users to huge losses, contract developers are eager to eliminate vulnerabilities before their contracts are deployed. Many security companies provide services based on manual auditing, either performing the auditing with their own experts or outsourcing it through a vulnerability bounty program.Manual audits, while essential, have serious limitations. Certora’s tool suite complements them in many ways:(1) Automatic Rechecking. Every time the code changes, a new audit is needed which requires hiring the same team of external auditors. Scheduling recurring audits ahead of time at a predetermined cadence can be a significant operational challenge; different versions of the same project may therefore end up with different auditors because of which the historical context of project codebase / concerns is lost. In contrast, Certora’s approach lets developers specify critical properties early in the development process which can then be automatically rechecked whenever the code changes — Specify Once, Verify Often!(2) Collaborative Codification. Auditing is usually performed by external security personnel who have extensive general experience but may lack a deep prior understanding of the specific contract at hand. Certora’s property-based approach lets developers and auditors work together to formulate properties that codify security-relevant aspects of the contract, allowing more application-specific and deeper logical flaws to be detected.(3) Stronger Guarantees. Any small mistake or oversight from an auditor can cause a critical vulnerability to be missed. The Certora tool suite has found major vulnerabilities even after extensive auditing. This is not surprising because errors are practically inevitable in manual audits. A user of the Certora tool on the other hand, focuses all their attention on specifying the properties themselves. Since the checking of the properties is fully automated, a successful check guarantees mathematically that the property holds: the prover, unlike a human auditor, never makes reasoning errors. A failed check helps the developer by pinpoint a failing scenario.(4) Ready Availability. The best auditors are typically booked months in advance. Due to the steep learning curve, lack of structured on-boarding resources/initiatives, and high expectations from auditors, Ethereum may continue to endure a significant shortage of code security professionals in the foreseeable future. Since Certora’s approach leverages automatic verification techniques to reduce the amount of repetitive effort needed, its services are more readily available to developers/experts who can specify properties on their code.(5) Shift Left. The Secure Software Development Lifecycle in Web3 has unfortunately been reduced to a 3-step “Build-Audit(s)-Launch” linear timeline where there are enormous and unrealistic expectations from the audit phase(s) which is unsustainable. Specifying and checking of security properties by developers/experts using Certora’s tools will catalyze a “Shift Left” effort where security will be better addressed and significantly improved at earlier stages of the application lifecycle.Preliminary experience suggests that auditing and formal verification work well together. Manual audits can help specify or identify missing rules in formal verification while formal verification can identify corner cases missed by manual audits, especially when code is continuously modified over time.Verification vs. TestingLike any software, smart contracts need to be tested. But testing may not be sufficient for exposing security flaws due to a few limitations.(1) Path Explosion. Every if-statement in a function potentially doubles the number of paths that an execution can take. So paths typically grow exponentially with the size of the code. Testing is rarely able to cover even a high proportion of paths, let alone all of them, so some paths are omitted, leaving dangerous gaps in analysis. Tools based on verification, such as the Certora Prover, consider every path.(2) State Explosion. The number of states of a contract likewise grows exponentially with the number of state components. A tester will usually try and pick some representative states to test, along with some outliers and some that are suspected to be tricky cases. But these will only cover a tiny proportion of the states that can arise in practice. Tools based on verification, such as the Certora Prover, consider every state.(3) Test Suite Cost. A comprehensive test suite is very tedious and difficult to write, maintain, and comprehend. Expected properties, which are the basis of Certora’s technology, are usually much more compact because a single property generalizes over a large number of test cases.Verification vs. FuzzingFuzzing enhances testing by automatically generating many inputs. If used correctly, it can be highly effective in detecting bugs, but it is still hindered by path and state explosion. A rare edge case may require millions of random inputs generated, which may take weeks of execution before being found.Fuzzing starts from a concrete program state. Thus, if reaching the problematic state requires a particular chain of function calls with correlated argument values, the fuzzer may take an extremely long time to find it, if at all. The Certora Prover uses mathematical constraint solving to find such correlations extremely fast. For example, the issue in Maker’s Fundamental Equation of DAI, which required calling two specific functions with correlated arguments, took 13 hours and 125 million iterations to find with fuzzing. In contrast, the Certora Prover took just 23 seconds.Identified Vulnerabilities and Proven PropertiesCertora has analyzed hundreds of smart contracts for a variety of clients, uncovering serious vulnerabilities that, if left undetected, could have led to significant financial losses. Below is a selection of key vulnerabilities identified by the Certora Prover and a description of the properties verified to detect them.Data ConsistencySmart contracts often use multiple representations of key protocol variables. If these representations become inconsistent due to missing or incorrect updates, unexpected behaviors or financial inaccuracies can arise.In Uniswap v4 we verified the consistency between the pool’s tick and its price using the invariant:tickAtSqrtRatio(pool.sqrtPrice) == pool.tickThis invariant was initially violated, uncovering a medium-severity bug, which was subsequently fixed and verified. See the blog post and the specification.In Compound v3, we proved a critical correlation between two different representations of users’ collateral:userCollateral[user][asset].balance > 0 ⇔ isInAssetsIn(userBasic[user].assetsIn, getAssetOffset(asset))This invariant exposed and helped resolve issues in the protocol. See the verification report, specification, and blog post.Correct Sum in Delegated VotingIn AAVE Token v3, we proved that the sum of delegated voting balances and undelegated balances is equal to the total supply. This proof ensures that voting power is not counted twice or lost. See the verification report and specification.Protocol SolvencyProtocol solvency means that it holds enough assets to cover all obligations. Missing solvency checks or denial-of-service (DoS) attacks on liquidation operations can lead to irrecoverable asset losses to the protocol. In Lido's Dual Governance, the Certora Prover verified that the Escrow contract responsible for rage quit assets remains solvent, ensuring:The Escrow holds the correct amount of stETH and ETH.Users withdrawing last receive shares in the same ratio as earlier withdrawals.UnstETH lockers withdraw their exact NFT value at finalization.See the verification report and specification for more details.Transfer Manipulation AttacksThese vulnerabilities arise when a system is susceptible to donation attacks, such as the first depositor attack. In such cases, the system improperly accounts for externally transferred assets or assumes that donation deposits will be small. This can sometimes be exploited, leading to unexpected asset losses for the protocol.Some key properties to prevent this attack are:Dust favors the house – Users should not be able to profit from an immediate operation (e.g., depositing and withdrawing in a single transaction).User asset preservation – A user’s total assets should remain unchanged when another user performs an operation without an allowance.By enforcing these properties, the Certora Prover ensures that protocols remain resistant to financial manipulation and unintended asset redistribution.In SushiSwap Trident, the Certora Prover uncovered a critical bug that can be used to drain the protocol by transferring underlying tokens. See our blog for more details.Staking Reward MiscalculationsSystems based on proof-of-stake distribute rewards periodically, calculating the rewards using block.timestamp - lastTimestamp. If lastTimestamp is not properly initialized to block.timestamp when the contract is created or when rewards distribution begins, this calculation results in block.timestamp - 0, leading to an excessively large time difference. As a result, the system may distribute significantly more rewards than intended.In Aave’s StakeToken, we proved the integrity of reward claiming. You can read in our blog about a critical bug that the same rule prevented.Key Features1. Fully Automated VerificationThe Certora Prover offers push-button verification. The user writes the specification and invokes the Certora Prover with the smart contract to be verified and the specification as arguments. From there on, the user is not required to intervene in the verification process. Ultimately, the Certora Prover produces a user-friendly report listing both properties that were satisfied and those that were not.2. Generation of Counterexample ScenariosMerely knowing that a property was not satisfied by the smart contract is not sufficient for a user to understand where the contract might have vulnerabilities. Therefore, the Certora Prover makes it easier to interpret the verification result by presenting the user with a counterexample. The counterexample represents a concrete state of the smart contract which helps the user narrow down the root cause of the specification violation.3. Rich Specification LanguagesUnlike traditional unit tests, which describe the output for a particular input, the Certora Prover considers the entire (potentially infinite) space of possible inputs. Instead of writing a large number of test cases, one writes a more compact and general specification in CVL or CVLR.CVLR and CVL allow writing symbolic variables, scaling testing coverage significantly. CVL also supports invariants, parametric functions, uninterpreted functions, “ghost” functions that can model contract state not explicitly present in the contract storage, and relational properties. This allows reasoning about infinite behaviors, and also allows equivalence checking between programs (for example that a code refactoring doesn’t introduce new behaviors).4. Powerful Interactive SupportSince formal verification is an undecidable problem, there will always be properties that cannot be verified automatically for some programs. The Certora Prover provides a rich set of features for approximating difficult-to-verify code, giving users fine-grained tools for trading soundness for completeness. These include: (1) bounding the number of executed loop iterations or providing checked loop invariants (2) breaking large code into several pieces to facilitate modular verification.5. Spec CheckingOne of the hardest challenges in formal verification is coming up with the right specification. Errors in a specification can lead users to incorrectly conclude that their contracts are correctly implemented. Therefore, Certora implements techniques for preventing certain patterns of bad specifications. For example, a tautology invariant of the form x = 5 ==> x > 0 will be flagged as a potentially incorrect specification by the system. Certora also offers a mutation verification tool that automatically generates and verifies variations of the original contract, generated by mutating the code. Mutants that pass verification may indicate that the specification had loopholes that can be fixed.Design PrinciplesCert"
