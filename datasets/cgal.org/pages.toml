["https://www.cgal.org/2023/07/28/cgal56"]
title = "CGAL 5.6 released"
full_description = "Added functions CGAL::Polygon_mesh_processing::region_growing_of_planes_on_faces() and CGAL::Polygon_mesh_processing::detect_corners_of_regions(), which enable partitioning a mesh into planar regions using the region growing algorithm from the Shape Detection package. Added the functions CGAL::Polygon_mesh_processing::remesh_planar_patches() and CGAL::Polygon_mesh_processing::remesh_almost_planar_patches(), which can be used to remesh patches of coplanar faces in a mesh. Added the function CGAL::Polygon_mesh_processing::surface_Delaunay_remeshing(), which can be used to remesh a surface triangle mesh using the Delaunay refinement algorithm from the 3D Mesh Generation package. Added the function CGAL::Polygon_mesh_processing::remove_almost_degenerate_faces(), which can be used to remove badly shaped triangles faces in a mesh. Added the functions CGAL::Polygon_mesh_processing::does_triangle_soup_self_intersect() and CGAL::Polygon_mesh_processing::triangle_soup_self_intersections() to identify and report self-intersections in a triangle soup, similarly to existing functions on triangle meshes. Added the function CGAL::Polygon_mesh_processing::triangulate_polygons(), which allows users to triangulate polygon soups. Added a named parameter to CGAL::Polygon_mesh_processing::smooth_shape() to disable the scaling, which otherwise aims to compensate volume loss during smoothing. Deprecated the overloads of functions CGAL::Polygon_mesh_processing::triangulate_hole(), CGAL::Polygon_mesh_processing::triangulate_and_refine_hole(), and CGAL::Polygon_mesh_processing::triangulate_refine_and_fair_hole() which have output iterators for vertices and faces as parameter. They are replaced by overloads with two additional named parameters."
