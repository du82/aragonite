["https://cgal.org/2005/08/01/call-for-papers"]
title = "Call for Papers for special issue of Computational Geometry: Theory and Applications"
full_description = "Call for Papers for the special issue of the journal Computational Geometry: Theory and Applications on CGAL. The international journal Computational Geometry: Theory and Applications is planning a special issue on CGAL, the Computational Geometry Algorithms Library. CGAL is an open source C++ library, see www.cgal.org. Its goal is to make the most important methods developed in computational geometry available to users in industry and academia, by providing easy access to robust and generic geometric algorithms. We solicit original research papers describing contributions to CGAL, or applications critically using CGAL. Topics of interest include implementations of known and new algorithms in computational geometry, the design of generic software, algorithm engineering aspects, experimental verification, and benchmarking. Work describing contributions to CGAL should be related to existing packages, or to new packages submitted to the CGAL editorial board. Formally, acceptance is independent of the package reviewing process, but the opinion of the editorial board will be a factor in the decision. Work describing applications should clearly state in which way the application depends on CGAL, and why the usage of CGAL is crucial for its functionality. We ask for regular papers, not source code, not documentation. It is expected that the paper provides a link to source code, and there may be code fragments also in the paper to show how some functionality is used or realized. Full versions of previous conference papers are encouraged. All efforts will be made to ensure timeliness of the special issue. Please submit only if you are able to deliver the final version of your accepted paper by the indicated date. Electronic submission is preferred. Please email a PostScript or PDF file of your manuscript together with a cover letter to either of the two guest editors of this special issue: Remco Veltkamp Center for Geometry, Imaging, and Virtual Environments Institute of Information and Computing Sciences Padualaan 14 3584 CH Utrecht The Netherlands"
