["https://cgal.org/2024/12/01/mesh3-improvements"]
title = "Tetrahedral Mesh Generation Improvements"
description = "Tetrahedral Mesh Generation Improvements in CGAL 6"
full_description = "The CGAL component 3D Mesh Generation is the primary component to generate isotropic simplicial meshes discretizing 3D domains with CGAL. First introduced in CGAL-3.5 (2009!), this component has been constantly updated through the years to improve its performance, its versatility, and the quality of the meshes it produces. Recent releases of CGAL have once again introduced new enhancements that enable more accurate representations of input surfaces, for a wider range of input data types. It is now possible to: CGAL's tetrahedral mesh generation algorithm is able to generate tetrahedral meshes from 3D segmented images. Regardless of input type, one-dimensional feature detection and construction must be performed before the generation of the mesh. In 3D segmented images, these features correspond to the intersections of the bounding box of the image with the surfaces defined by the image, as well as polylines that lie at the intersection of three or more subdomains (including the outside). The article Hege, H. C., Seebass, M., Stalling, D., & Zöckler, M. (1997), A generalized marching cubes algorithm based on non-binary classifications provides a classification of possible voxel configurations. This description has been generalized for tetrahedral mesh generation needs, and implemented in CGAL. Following feature lines detection, polyline features are added to the feature graph of the domain for feature protection, similarly to what is done for polyhedral surfaces. When a segmented image is given as input for tetrahedral mesh generation, the generated mesh surface sometimes sticks too closely to the voxels surface, causing an aliasing effect. A solution to generate a smooth and accurate output surface was described by Stalling et al. in Stalling, D., Zöckler, M., Sander, O., & Hege, H. C. (1998), Weighted labels for 3D image segmentation. The approach consists in generating a second input image made of integer coefficients called weights, and to use those weights to define smoother domain boundaries. This addition has been added to CGAL, and the 3D image of weights can be generated using the new function CGAL::Mesh_3::generate_label_weights()."
author = "CGAL Editorial Board"
year_published = 2025
