title = "Download CGAL for Linux"
full_description = "Note that the package managers are not maintained by the CGAL project. Consequently, the latest stable release of CGAL might not be immediately available and you should check the version offered by your package manager. We recommend using a package manager as this will ensure that all essential third party dependencies are present, and with the correct versions. A step-by-step guide showing how to install and use CGAL with a package manager is available in the CGAL Documentation. You can also obtain the CGAL library sources directly from from the Releases page of the CGAL project. A step-by-step guide showing how to install and use CGAL with sources is available in the CGAL Documentation. Advanced users can clone the current development version of CGAL from GitHub to enjoy early access to new features. Please note that the directory layout and build process of the development version on GitHub are different from the release version. A basic usage guide is available on the CGAL project's Install.md."
