["https://cgal.org/opensource.html"]
title = "Getting Involved in the CGAL Project"
full_description = "Since release 3.0, CGAL is available under an Open Source License. More than a simple license switch, we opened up the project and invite you to join. The CGAL project was founded by seven research institutes in 1996, and since, people at other institutions started developing software based on the design ideas of CGAL. The first step in getting involved is probably to use CGAL. The project provides several mailing lists in order to support discussion within the community. There is also a CGAL Users group on the LinkedIn social network, which you may find useful. The next step is to develop patches or new packages for CGAL. In order to do so, you can take a look at the Developer Manual in order to familiarize yourself with the internal details. You are encouraged to contact us as early as possible when you envision to make a significant contribution to CGAL. Please read carefully the page Contributing to CGAL, which describes precisely the CGAL submission and review process. You can then become a CGAL developer, which grants you access to the internal ressources such as the developers wiki, the git repository, the cgal-develop mailing list, the internal test-suite, the bug-tracking system, the biannual CGAL developer meetings, etc. Many of the current developers work for the institutes who started the project, but others are welcome to join and participate. There is also a CGAL Contributors group on LinkedIn. The CGAL project participates in the Google Summer of Code since 2010. Have a look at the page Project Ideas to discover the topics that we have proposed each year since 2010 for the Google Summer of Code. The CGAL project can only consider the integration of the software you wrote if you accept that it is part of the distribution, and if it follows the license scheme chosen by the project. In fact, it is the owner of your code (your employer) who has to agree on this officially. Note that the CGAL project does not require any transfer of intellectual property rights for the contribution of new independant packages, although the situation may be different for a modification to existing code. Moreover, you may choose to have your code also available in the commercial offer of GeometryFactory, which offers various services to customers around CGAL."
