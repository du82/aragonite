["https://cgal.org/project_rules.html"]
title = "CGAL Open Source Project Rules and Procedures"
full_description = "With this document, the CGAL Open Source Project sets forth its own rules and procedures. The rules and procedures define the different groups of persons involved in CGAL, how to become one of them, and how decisions are made. This document regulates how important and final decisions are made by the editorial board. It does not cover the less formal way how many decisions are actually made among developers, and it is not the intention to regulate those. There is no precise definition, but some examples of decisions that should be handled by the editorial board are given throughout this document. The CGAL Open Source Project consists of four groups of people based on technical criteria and relation to CGAL. (Financing the people, the project, or other types of resources is not discussed in this document, but see here, and the current list of people can be found here.) A developer is a person that develops at least one CGAL package. He/she has access to the member resources of the CGAL project. He/she has write access on the CGAL SCM server for his/her package(s). A candidate becomes a developer after a proposal (short description of the project the candidate developer is working on) from an editorial board member and no objection by any editor within fifteen days. If an objection is raised, the matter is to be discussed in the editorial board and the decision is made by an anonymous vote; absolute majority is required for the candidate to become a developer. A person seizes to be a developer after either his/her personal request or upon proposal of an editorial board member and a subsequent anonymous vote with an absolute majority. A candidate is considered for becoming an editor upon recommendation by an existing editor. The criteria for selection are: The criteria described above are guidelines. The editorial board discusses the candidacy and makes the final decision by an anonymous vote; a two-thirds majority is needed for a candidate to become an editor An editor leaves the editorial board after either his/her personal request or upon proposal of an editorial board member and a subsequent anonymous vote with a two-thirds majority. Such a proposal may for example be motivated by the repeated failure of an editor to fill his duties."
author = "CGAL Editorial Board"
year_published = 2025
