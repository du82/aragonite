["https://cgal.org/2024/07/02/Basic_viewer"]
title = "New in CGAL: Basic Viewer"
full_description = "Visualizing the data structures used by CGAL's algorithms can help understand and analyze results. Since CGAL 4.13, the global function CGAL::draw(...) can be used to visualize (almost) all CGAL data structures including point sets, polygon meshes, cell complexes, and straight skeletons. Calling CGAL::draw(...) opens an interactive window displaying the data structure, enabling users to navigate the scene, show or hide specific elements, and even view the interior of the model, if applicable. The example below illustrates how we can use the function CGAL::draw() to visualize an OFF file loaded into a CGAL::Surface_mesh data structure. Unfortunately, this function had several limitations. Firstly, it was not easy to customize the drawing, for example changing the color or hiding of some elements. Secondly, it was not possible to draw different data structures simultaneously. Finally, it was not easy to add interaction with the drawing, or to use it in an higher level widget. All these limitations are solved with a new package: the CGAL Basic Viewer. This work was initiated by Mostafa Ashraf during his 2022 GSoC project. Guillaume Damiand, who mentored the GSoC project, reworked large parts of the package afterwards. As future work, a version based on GLFW is planned, avoiding the dependency to Qt. The Basic Viewer package is already integrated in CGAL's master branch on the CGAL GitHub repository, and will be officially released in the upcoming version of CGAL, CGAL 6.0."
