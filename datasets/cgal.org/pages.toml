["https://cgal.org/2024/05/29/Kinetic_surface_reconstruction"]
title = "New in CGAL: Kinetic Space Partition and Kinetic Surface Reconstruction"
full_description = 'Acquired point clouds suffer from various defects like noise, missing data and clutter. Reconstruction methods are required to fill in missing parts reasonably to provide a complete reconstruction. Common methods for reconstructing smooth surfaces, e.g., the Poisson Surface Reconstruction, fit an implicit function to the point cloud and extract the level set. However, those methods have difficulties in reconstructing sharp features and piecewise-planar objects. In addition, they often provide a large number of triangles. Keeping architecture and man-made objects with piecewise-linear geometries in mind, a popular approach to guarantee a watertight volume is to use space partitioning. An occupancy labeling then divides the cells of the partition into "empty" or "occupied" space, and thus generates a closed surface. A typical choice to fill in unobserved parts of the object is to use the extensions of detected shapes in the point cloud. Kinetic Surface Reconstruction (CGAL::Kinetic_surface_reconstruction_3) is a new package that implements a state-of-the-art 3D reconstruction pipeline based on another new package, Kinetic Space Partition(CGAL::Kinetic_shape_partition_3). While the Kinetic Space Partition is the core mechanism providing the geometry for the reconstruction (more on that later), other steps are necessary to extract the 3D surface from the partition. Our pipeline is based on Bauchet, J.-P., & Lafarge, F. (2020). Kinetic Shape Reconstruction. In ACM Transactions of Graphics, 39(5), 2020, and takes an oriented point cloud as input and generates a watertight 3D polygonal surface. While the reconstruction pipeline has several parameters, which are directly passed to methods from the Shape Detection package and Shape Regularization package, the Kinetic Space Partition and Kinetic Surface Reconstruction add a few parameters to give the user control over the reconstruction. The complexity of the surface can be adapted to favor simpler surfaces, i.e., with a lower polygon count.'
author = "CGAL Editorial Board"
year_published = 2025
clearnet = "https://cgal.org/2024/05/29/Kinetic_surface_reconstruction"
category = "SitesList"
