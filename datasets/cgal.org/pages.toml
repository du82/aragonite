["https://www.cgal.org/2023/05/09/improved_straight_skeleton"]
title = "New in CGAL: Weighted Straight Skeletons and Straight Skeleton Extrusion"
full_description = "Given a 2D polygon, an intuitive way to think of the construction of its straight skeleton is to imagine that wavefronts (or grassfires) are spawned at each edge of the polygon, and are moving inward. As the fronts progress, they either contract or expand depending on the angles formed between polygon edges, and sometimes disappear. Under this transformation, polygon vertices move along the angular bisector of the lines subtending the edges, tracing a tree-like structure: the straight skeleton. Straight Skeletons are a fundamental tool in geometric modeling and computational geometry. They are used in a variety of applications, such as architecture, animation, and manufacturing. Straight Skeletons are also used as a building block for other algorithms, such as the offsetting of polygons, which is a fundamental operation in geometric modeling and computational geometry. The straight skeleton of a polygon is similar to the medial axis and the Voronoi diagram of a polygon in the way it partitions it; however, unlike the medial axis and the Voronoi diagram, the bisectors are not equidistant to its defining edges but to the supporting lines of such edges. As a result, the bisectors of a straight skeleton might not be located in the center of the polygon and thus cannot be regarded as a proper medial axis in its geometrical meaning. Weighted straight skeletons are a generalization of straight skeletons: contour edges are assigned a weight, which can be understood as assigning a speed to the wavefront spawned from the contour edge. Vertices no longer move along the angular bisector between two contour edges, but along a *weighted* bisector, which changes its angle. The Straight Skeleton package of CGAL now supports the construction of weighted straight skeletons, with the restriction that all weights must be positive. For clarity, this functionality is implemented in a new set of functions: for existing functions such as CGAL::create_..._straight_skeleton_2(), there now exists a weighted equivalent: CGAL::create_*weighted*_..._straight_skeleton_2()."
author = "CGAL Editorial Board"
year_published = 2025
