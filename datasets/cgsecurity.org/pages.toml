["https://cgsecurity.org/wiki/TestDisk_DE"]
title = "TestDisk DE - CGSecurity"
description = "TestDisk ist Freie Software und lizensiert unter der GNU General Public License (GPL v2+). TestDisk ist ein leistungsstarkes freies Daten-Wiederherstellungs-Utility..."
full_description = '''TestDisk DE From CGSecurity Jump to navigation Jump to search English 中文 Deutsch Español Français Magyar فارسی Italiano Japanese 한국어 Nederlands Polski Português Русский Türkçe Aktuelle Version 7.2 February 22, 2024 TestDisk Datenrettung TestDisk ist Freie Software und lizensiert unter der GNU General Public License (GPL v2+). TestDisk ist ein leistungsstarkes freies Daten-Wiederherstellungs-Utility! Es wurde in erster Linie erstellt um verlorene Partitionen wiederherzustellen und/oder nicht bootende Festplatten wieder bootfähig zu machen, wenn das Problem durch fehlerhafte Software, bestimmte Arten von Viren oder menschliche Fehler (wie versehentliches Löschen der Partitionstabelle) verursacht wird. Partitionstabellen wiederherstellen mit TestDisk ist wirklich einfach. TestDisk kann Die Partitionstabelle reparieren, gelöschte Partitionen wiederherstellen Einen FAT32-Bootsektor von seinem Backup wiederherstellen Einen FAT12/FAT16/FAT32-Bootsektor wieder aufbauen (Rebuild) Bei FAT die Dateizuordnungstabelle reparieren Einen NTFS-Bootsektor wieder aufbauen (Rebuild) Einen NTFS-Bootsektor von sein Backup wiederherstellen Bei NTFS die MFT (MasterFileTable = Hauptdateitabelle) unter Verwendung des Spiegels (MFT mirror) wiederherstellen Einen ext2/ext3/ext4 Backup SuperBlock lokalisieren Gelöschte Dateien vom Fat, NTFS und ext2-Dateisystem wiederherstellen Dateien von gelöschten FAT, NTFS und ext2/ext3/ext4-Partitionen kopieren. TestDisk hat Charakteristiken für Anfänger und Fortgeschrittene. Für Anwender die nur wenig oder nichts über Datenwiederherstellungtechniken wissen, kann TestDisk eingesetzt werden, um ausführliche Informationen über eine nicht startende Festplatte zu sammeln, um diese an einen Techniker für weitere Analyse zu schicken. Diejenigen die sich mit diesen Prozeduren besser auskennen, werden in TestDisk ein praktisches Werkzeug für eine Vor-Ort-Wiederherstellung finden. Betriebssysteme TestDisk läuft unter DOS (entweder im realen DOS-Modus oder in einer Windows 9x-DOS-Box), Windows (NT4, 2000, XP, 2003, Vista, 2008, Windows 7 (x86 & x64), Linux, FreeBSD, NetBSD, OpenBSD, SunOS und MacOS X Quelldateien und vorkompilierte ausführbare Dateien sind verfügbar für DOS, Win32, MacOSX und Linux auf der Herunterladen-Seite Dokumentation Wie bekomme ich TestDisk Ausführbare Dateien und Quelldateien sind zum herunterladen verfügbar für DOS, Win32, Mac OS X und Linux. TestDisk kompilieren TestDisk und Live rescue CD Arbeiten mit speziellen Medien Beschädigte Festplatte (defekte Sektoren) Datenträger-Abbilder CD-R/CR-RW/DVD... Anwenden von TestDisk Spezifische Merkmale von Betriebssystemen Schritt für Schritt Wiederherstellungsbeispiel um verlorene Partitionen wiederherzustellen und einen beschädigten Bootsektor zu reparieren Ausführen von TestDisk Gelöschte Dateien von einer NTFS-Partition wiederherstellen Gelöschte Dateien und Ordner vom FAT12, FAT16 und FAT32-Dateisystem wiederherstellen FAT-Dateisysteme werden meist auf Flash-Speicherkarten, digitalen Kameras, und vielen anderen portierbaren Geräten benutzt. Gelöschte Dateien vom ext2-Dateisystem wiederherstellen, Wiederherstellungs-Beispiele Ausführen von Skript TestDisk FAQ Unterstützung Nach dem Gebrauch von TestDisk Hinweise und Tipps für den Umgang mit TestDisk Technische Merkmale Intel-Partitionstabelle Microsoft Fdisk Norton GoBack SMART monitoring Gegenwärtige Einschränkungen Wie kann ich helfen TestDisk & PhotoRec in den Nachrichten Das TestDisk-Team Um verlorene Bilder oder Dateien von einer digitalen Kamera oder Festplatte wiederherzustellen, führe PhotoRec aus. Dateisysteme Testdisk findet verlorene Partitionen für folgende Dateisysteme: BeFS (BeOS) BSD disklabel (FreeBSD/OpenBSD/NetBSD) CramFS, Compressed File System DOS/Windows FAT12, FAT16 und FAT32 Windows exFAT HFS, HFS+ und HFSX Hierarchical File System JFS, IBM's Journaled File System Linux btrfs Linux ext2, ext3 und ext4 Linux LUKS encrypted partition Linux RAID md 0.9/1.0/1.1/1.2 RAID 1: mirroring RAID 4: striped array with parity device RAID 5: striped array with distributed parity information RAID 6: striped array with distributed dual redundancy information Linux Swap (Versionen 1 und 2) LVM and LVM2, Linux Logical Volume Manager Mac partition map Novell Storage Services NSS NTFS (Windows NT/2K/XP/2003/Vista/2008/7) ReiserFS 3.5, 3.6 und 4 Sun Solaris i386 disklabel Unix File System UFS und UFS2 (Sun/BSD/...) XFS, SGI's Journaled File System TestDisk home: https://www.cgsecurity.org. Christophe GRENIER grenier@cgsecurity.org Retrieved from "https://www.cgsecurity.org/mw/index.php?title=TestDisk_DE&oldid=9182" Category: Data Recovery'''
