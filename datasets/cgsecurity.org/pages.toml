["https://www.cgsecurity.org/Articles/reverse/index.html"]
title = "Challenge Reverse"
full_description = "Depuis plus de deux ans, le projet Honeynet propose régulièrement d'étudier des outils, des tactiques utilisés par des pirates lors d'intrusion pour démontrer la réalité de ces attaques, pour apprendre comment un pirate agit pour s'en protéger et plus généralement pour améliorer les technologies et méthodes de collecte d'information. Chaque mois, le Scan of the Month challenge propose l'analyse de trames réseaux suspectes. Le mois de mai a vu un autre challenge: le Reverse Challenge. Il s'agissait d'analyser un binaire retrouvé sur une machine piratée du projet Honeynet. Trente-cinq personnes ou équipes ont soumis leurs analyses au jury du projet et je vais vous faire part de cette expérience ayant moi même participé à ce concours. La commande file permet d'identifier le binaire nommé the-binary. Le nom du binaire ne nous aide pas beaucoup. Ce programme fonctionne sur un Unix SYSV pour plate-forme compatible Intel. C'est à dire sous Linux (Consulter /usr/include/elf.h pour plus d'info sur les entêtes ELF). Malheureusement pour nous, l'analyse est compliquée par le fait que les symboles ont été supprimés et le programme a été compilé en statique: La commande strip retire les informations insérées par le compilateur pour faciliter le debugage. L'option --static du compilateur a été utilisé pour inclure les fonctions qui se trouveraient dans des librairies sinon. Le programme devient indépendant du type de Linux (RedHat, Debian...) sur lequel il est installé. Un examen des chaînes contenus dans le binaire, strings -a the-binary | less, révèle la version de la librairie @(#) The Linux C library 5.3.12 ainsi que celle du compilateur GCC: (GNU) 2.7.2.l.2. Attention, il est important d'utiliser l'option -a de strings pour parcourir l'intégralité du fichier. En l'oubliant, on rate la version de GCC qui se trouve dans la section .comment. On obtient une première indication sur le niveau technique du pirate: il sait supprimer les symboles mais n'a pas penser à supprimer les sections .note et .comment. Il semble ignorer que le programme peut être compressé (UPX) ou protégé (Burneye)."
year_published = 2025
clearnet = "https://www.cgsecurity.org/Articles/reverse/index.html"
