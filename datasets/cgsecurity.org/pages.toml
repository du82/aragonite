title = "Formatos De Archivos Recuperados Por PhotoRec - CGSecurity"
full_description = '''Formatos De Archivos Recuperados Por PhotoRec From CGSecurity Jump to navigation Jump to search English Deutsch Español Français Italiano Română PhotoRec es una utilidad de recuperación de archivos usando técnicas de socavado de datos, busca cabeceras de archivos conocidas y como no hay (usualmente) fragmentación de datos, puede recuperar el archivo completo. También puede manejar algunos casos de baja fragmentación de datos. Photorec reconoce varios formatos de archivo, incluyendo: Contents 1 Archivos Comprimidos 2 Multimedia 3 Office 4 Otros Archivos Comprimidos .7z 7-Zip archive file .a Unix/Linux archive .ace ACE Archive .apk Android Package Kit .arj Archive .bkf MS Backup file .bz2 bzip2 compressed data .cab MS cabinet archive .dar dar3 archive .deb Debian Archive (Same familly than .a Unix/Linux archive) .dump Dump/Restore Archive .ghx Grasshopper archive .gz gzip compressed data .lzh lzh/LArc archive .lzo LZO archive .par2 archive .rar Rar archive .rpm RPM package .stu StuffIt Archive .tar tar archive .tar.gz compressed tar archive .vbm Veeam Backup Metadata .wim Windows imaging (WIM) image .xar xar archive .xz xz Archive .zip zip archive Multimedia .3ds max .3dm Rhino / openNURBS .3g2 Video for 3G mobile phone (CDMA) .3gp Video for 3G mobile phone (GSM) .abr Adobe Brush .acb Adobe Color Book .ado Adobe Duotone Options .aep After Effects .afdesign afdesign .aif Apple Audio .albm HP Photosmart Photo Printing Album .all Cubase Song format .als Ableton Live Sets .ani Windows Animated Cursor .ape Monkey's Audio compressed format .ari ARRI Raw Video .arw Sony raw image (TIFF image) .asf, .wma, .wmv: Advanced Streaming Format used for Audio/Video .asl Adobe Layer Style .au Sun/NeXT audio data .avi RIFF video .axp Pinnacle Studio .binvox Binvox Voxel File .bdm AVHCD index .bld blender .blend Blender .bmp BMP bitmap image .bpg Better Portable Graphics image .bvr Blue Iris DVR .c4d Cinema 4d .caf Core Audio Format .cam Image .camrec Camtasia Camr