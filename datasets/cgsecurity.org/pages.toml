full_description = '''Récupération des Photos Numériques avec PhotoRec From CGSecurity Jump to navigation Jump to search English Deutsch Español Français Italiano PhotoRec fonctionne avec Compact Flash, Memory Stick, SecureDigital, SmartMedia, Microdrive, MMC, Lecteurs et clés usb, Disques durs, Cdrom... PhotoRec a été testé avec succès avec les appareils photo suivants : Canon EOS300D, 10D HP PhotoSmart 620, 850, 935 Nikon CoolPix 775, 950, 5700 Olympus C350N, C860L, Mju 400 Digital, Stylus 300 Sony DSC-P9 Praktica DCZ-3.4 Casio Exilim EX-Z 750 La plupart des appareils numériques n'effacent pas les photos de votre carte mémoire lorsque vous les supprimez ou que vous formatez la carte. PhotoRec peut restaurer les fichiers dans la majorité des cas. Même si votre carte d'appareil numérique est corrompue et que vous constatez un message d'erreur, il y a une assez bonne probabilité qu'il soit encore possible de restaurer vos photos. Photorec retrouve les JPEG, TIFF et de nombreux formats raw ou propriétaires comme : .cr2 Image Canon Raw2 .crw Image Canon Raw .dcr Image Raw Kodak .nef Image Raw Nikon .orf Image Olympus Raw Format .pef Image Raw Pentax .raf Image Raw Fujifilm .raw Image Contax, Image Panasonic/Leica .rdc Image Rollei .sit Mikron .sr2 Image Raw Sony .tif Tag Image File Format .x3f Image raw Sigma/Foveon X3 La liste complète des formats récupérés par PhotoRec contient plus de 180 extensions. Retrieved from "https://www.cgsecurity.org/mw/index.php?title=Récupération_des_Photos_Numériques_avec_PhotoRec&oldid=5879" Category: Data Recovery'''
