["https://www.cgsecurity.org/Articles/2-MISC/Protections-2/index.html"]
title = "Protections contre l'exploitation des débordements de buffer - Les patches kernel"
full_description = '''Cet article poursuit la série entamée dans MISC 1 sur les protections contre les débordements de buffer. Nous avions essentiellement introduit la structure d'un programme Elf et le mécanismes gérant la résolution de symboles (PLT/GOT). Dans celui-ci, nous présentons deux défenses agissant au niveau du noyau afin de rendre la pile non exécutable : les patches Openwall et PaX. Pour chacun d'eux, nous étudierons les choix techniques mis en oeuvre et les limites imposées par ces solutions. Enfin, dans une dernière partie, nous apporterons quelques précisions sur un article de Nergal [3] qui propose un moyen de contourner PaX qui fonctionne également contre Openwall. Le project Openwall (http://www.openwall.com) regroupe divers produits, comme le "craker de mot de passe" John the Ripper ou le serveur popa3d pour n'en citer que deux. Openwall fournit également un patch pour le noyau Linux, développé par Solar Designer, qui propose plusieurs protections supplémentaires comme : Les fichiers README et FAQ qui viennent avec l'archive vous décriront bien plus en détails tout ceci. Des versions de ce patch sont disponibles uniquement pour les noyaux 2.0.39 et 2.2.20. Le support des 2.4.x n'est pas prévu pour tout de suite, Solar Designer préférant attendre que cette version se stabilise avant de se lancer dans le portage de son patch. Dans cet article, nous nous intéressons uniquement à la protection contre les débordements de buffer. Le mécanisme employé repose sur les interruptions : lorsqu'une fonction se termine, la fonction do_general_protection() (linux/arch/i386/kernel/traps.c) est appelée si l'adresse de retour n'est pas située dans une région valide. Le patch redéfinit la région allouée au code utilisateur de manière à ce qu'elle ne comprenne pas la pile. Ainsi, lors d'un retour effectué directement dans la pile, une interruption est levée puis traitée. Dans le monde des microprocesseurs, une interruption est définie comme un événement qui modifie le cours normal de l'exécution d'un programme. Elles sont classées en deux catégories :'''
year_published = 2025
clearnet = "https://www.cgsecurity.org/Articles/2-MISC/Protections-2/index.html"
