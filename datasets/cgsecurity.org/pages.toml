full_description = 'Recuperación De Fotos Digitales Usando PhotoRec From CGSecurity Jump to navigation Jump to search English Deutsch Español Français Italiano PhotoRec funciona con Compact Flash, Memory Stick, SecureDigital, SmartMedia, Microdrive, MMC, USB Memory Drives, HardDisks, Cdrom, ... PhotoRec ha sido exitosamente probado con las siguientes cámaras digitales Canon EOS300D, 10D HP PhotoSmart 620, 850, 935 Nikon CoolPix 775, 950, 5700 Olympus C350N, C860L, Mju 400 Digital, Stylus 300 Sony DSC-P9 Praktica DCZ-3.4 Casio Exilim EX-Z 750 Casi todas las cámaras digitales mantienen la fotos en la memoria incluso después de que uno las borra o se reformatea la memoria. PhotoRec puede recuperar los archivos en casi todos los casos. Incluso si la memoria de su cámara digital está dañada y se obtiene un mensaje de error, hay un gran posibilidad de que sus fotos sigan siendo recuperables. PhotoRec recupera JPEG, TIFF y otros varios formatos (Crudos o Propietarios) incluyendo: .cr2 Canon Raw 2 picture .crw Canon Raw picture .dcr Kodak Raw picture .nef Nikon Raw picture .orf Olympus Raw Format picture .pef Pentax Raw picture .raf Raw Fujifilm picture .raw Contax picture, Panasonic/Leica picture .rdc Rollei picture .sit Mikron .sr2 Sony Raw picture .tif Tag Image File Format .x3f Sigma/Foveon X3 raw picture La lista completa de formatos de archivos recuperables por PhotoRec contiene más de 80 extensiones de archivos. Retrieved from "https://www.cgsecurity.org/mw/index.php?title=Recuperación_De_Fotos_Digitales_Usando_PhotoRec&oldid=5897" Category: Data Recovery'
