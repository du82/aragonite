title = "TestDisk KO - CGSecurity"
description = "TestDisk는 GNU General Public License (GPL v2+)을 적용받는 오픈소스 소프트웨어입니다. 테스트디스크(TestDisk)는 강력한 데이터 복구 소프트웨어입니다. 공짜!!! 소프트웨어 오동작, 바이러스, 사용자 실수(파티션을 삭제하는) 등으로 망가진 파티션이나..."
full_description = '''TestDisk KO From CGSecurity Jump to navigation Jump to search English 中文 Deutsch Español Français Magyar فارسی Italiano Japanese 한국어 Nederlands Polski Português Русский Türkçe Latest stable version 7.2 February 22, 2024 TestDisk, Data Recovery TestDisk는 GNU General Public License (GPL v2+)을 적용받는 오픈소스 소프트웨어입니다. 테스트디스크(TestDisk)는 강력한 데이터 복구 소프트웨어입니다. 공짜!!! 소프트웨어 오동작, 바이러스, 사용자 실수(파티션을 삭제하는) 등으로 망가진 파티션이나 부팅이 되지 않는 디스크를 복구하기 위해 만들어졌습니다. 정말 쉽습니다. 테스트디스크(TestDisk)는 아래와 같은 작업을 할 수 있습니다. 파티션 테이블 오류 수정, 삭제된 파티션 복구 백업으로부터 FAT32 / NTFS 부트 섹터 복구 FAT12 / FAT16 / FAT32 / NTFS 부트 섹터 재설정(rebuild) FAT 테이블 오류 수정 MFT 미러를 통한 MFT 오류 수정 ext2 / ext3 / ext4 백업 수퍼블럭(Backup SuperBlock) 설정(locate) FAT, NTFS / ext2 파티션의 삭제 파일 복구 삭제된 FAT, NTFS이나 ext2 / ext3 / ext4 파티션에서 파일 복사 TestDisk has features for both novices and experts. For those who know little or nothing about data recovery techniques, TestDisk can be used to collect detailed information about a non-booting drive which can then be sent to a tech for further analysis. Those more familiar with such procedures should find TestDisk a handy tool in performing onsite recovery. 운영체제(Operating systems) 테스트디스크(TestDisk)는 거의 모든 OS를 지원합니다. 도스(DOS) : 실제 도스나 윈도우 9x 도스, 윈도우(Windows) : NT4, 2000, XP, 2003, Vista, 2008, 7, 리눅스(Linux), 유닉스 : FreeBSD, NetBSD, OpenBSD, SunOS, 맥 : MacOS X Source files and precompiled binary executables are available for DOS, Win32, MacOSX and Linux from the download page Filesystems TestDisk can find lost partitions for all of these file systems: BeFS ( BeOS ) BSD disklabel ( FreeBSD/OpenBSD/NetBSD ) CramFS, Compressed File System DOS/Windows FAT12, FAT16 and FAT32 Windows exFAT HFS, HFS+ and HFSX, Hierarchical File System JFS, IBM's Journaled File System Linux ext2, ext3 and ext4 Linux LUKS encrypted partition Linux RAID md 0.9/1.0/1.1/1.2 RAID 1: mirroring RAID 4: striped array with parity device RAID 5: striped array with distributed parity information RAID 6: striped array with distributed dual redundancy information Linux Swap (versions 1 and 2) LVM and LVM2, Linux Logical Volume Manager Mac partition map Novell Storage Services NSS NTFS ( Windows NT/2000/XP/2003/Vista/2008/7 ) ReiserFS 3.5, 3.6 and 4 Sun Solaris i386 disklabel Unix File System UFS and UFS2 (Sun/BSD/...) XFS, SGI's Journaled File System Documentation How to get TestDisk Download - Binary executables and source files are available for DOS, Win32, MacOSX and Linux. TestDisk compilation TestDisk and Live rescue cd Working with special media Recover Damaged Hard Disks (bad sectors) Disk image CD-R/CR-RW/DVD... Using TestDisk OS specific notes TestDisk Step by Step to recover lost partitions and repair damaged FAT/NTFS boot sector Running the TestDisk Program Recover deleted files from NTFS partition Undelete files and directories from FAT12, FAT16 and FAT32 filesystem Undelete files from ext2 filesystem Recovery examples Scripted run Support After using TestDisk Technical Notes Developers How to contribute code to TestDisk & PhotoRec Intel Partition Table Microsoft Fdisk SMART monitoring Norton GoBack Current Limitations How to help TestDisk & PhotoRec In The News TestDisk Team To recover lost pictures or files from digital camera or harddisk, run the PhotoRec command. TestDisk home: https://www.cgsecurity.org. Christophe GRENIER grenier@cgsecurity.org Retrieved from "https://www.cgsecurity.org/mw/index.php?title=TestDisk_KO&oldid=8795" Category: Data Recovery'''
