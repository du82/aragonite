title = "Programmation d'un sniffer sous Unix"
full_description = "Sniffer consiste à espionner les communications circulant le réseau auquel on est connecté. Après de rapides révisions sur le fonctionnement en réseau, cet article présente trois méthodes pour programmer un sniffer : le device /dev/bpf sous BSD, les sockets systèmes sous Linux, la bibliothèque multi-plateforme libcap. Comme cet article fait référence à beaucoup de code, nous n'avons mis que les extraits utiles. L'intégralité des source est disponible sur www.cgsecurity.org ou http://www.security-labs.org Les différentes machines sont sur le même réseau Ethernet. Chaque interface réseau y est identifiée par son adresse MAC (Media Access Control), une adresse de 48 bits dont les 24 premiers ,Organizationally Unique Identifier, désignent le constructeur de la carte. A l'aide de la commande ifconfig, on obtient l'adresse MAC. Un hub (ou répéteur) renvoie sur chaque port la trame ethernet qu'il reçoit. Un switch dresse une table de correspondance port/adresse MAC (table statique et/ou dynamique) et dirige la trame uniquement vers le port du destinataire. Ainsi, les communications sont isolées et permettent de hauts débits en minimisant les collisions. Il suffit de passer l'interface réseau en mode promiscuous pour que la carte réseau laisse voir toutes les trames ethernet, y compris celles dont le destinataire est différent de l'adresse MAC de l'interface. On observe ainsi le trafic réseau de son segment mais l'utilisation de switch rend inefficace cette méthode. D'autres moyens, actifs, sont alors nécessaires pour contourner cette difficulté. De façon à recevoir les trames qui ne nous sont pas adressés, il faut détourner le trafic vers notre machine. Différentes techniques ont été présentées dans un numéro précédent autour du protocole ARP, mais il en existe encore d'autres, par exemple avec le protocole ICMP. Dans la suite de cet article, nous présentons trois techniques différentes. Néanmoins, il existe un schéma général, identique dans tous les cas :"
year_published = 2025
clearnet = "https://www.cgsecurity.org/Articles/sniffer/index.html"
