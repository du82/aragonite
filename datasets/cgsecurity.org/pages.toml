["https://www.cgsecurity.org/Articles/biospwd/index.html"]
title = "Protection du BIOS"
full_description = "L'accès au setup, le menu de configuration du BIOS, ou l'accès au système d'exploitation peut être protégé par mot de passe. Sur un desktop, un ordinateur de bureau, l'accès au setup est restreint généralement pour éviter qu'un utilisateur modifie les paramètres inconsidérément ou qu'il puisse démarrer sur une disquette. Dans le cas d'un laptop ou portable, le mot de passe a pour but d'interdire l'accès au système d'exploitation. Il est renforcé par un mot de passe protégeant l'accès aux données du disque dur. Le mot de passe est stocké dans une mémoire NVRAM, Non-Volatile Random Access Memory, de technologie Cmos, Complementary Metal Oxide Semiconductor. Il s'agit généralement d'une mémoire de petite taille, 128 octets, accessible octet par octet, alimenté par une pile au lithium pour maintenir la mémoire. Le composant électronique assurant cette fonction est aussi l'horloge temps réel, la RTC. Une rupture de l'alimentation de la Cmos et son contenu est effacé ainsi que le mot de passe s'y trouvant. Pour cette raison, le stockage du mot de passe dans la Cmos se fait principalement sur les desktops où la sécurité n'est pas primordiale. Voici quelques manipulations pour effacer la mémoire de ces composants, mélant l'horloge RTC et une batterie, devenus assez rares pour certains. Ce composant rectangulaire à 24 connecteurs ne possède pas de pile, il suffit de le retirer quelques secondes de son support pour effacer sa mémoire. Pour les portables, les constructeurs ont recherchés assez rapidement un moyen plus fiable de stocker le mot de passe. Ils l'ont trouvé avec les EEPROM, Electronically Erasable Programmable Read Only Memory. Il s'agit d'une mémoire reprogrammable non volatile, elle se programme octet par octet contrairement à une mémoire flash qui fonctionne par bloc. L'information peut se maintenir une dizaine d'année hors tension et supporter 100 000 ecritures. En pratique, vous aurez changer d'ordinateur bien avant. On retrouve plusieurs modèles d'EEPROM allant jusqu'à une capacité de quelques kilo-octets: 24c01 1ko, 24c02 2ko... Pour récupérer son contenu, ignorant le câblage réaliser par le constructeur, il faudrait dessouder l'EEPROM de la carte mère, la placer dans un lecteur d'eeprom et connecter celui-ci à un autre ordinateur. C'est le B.A.BA pour un électronicien mais c'est assez risqué pour un simple particulier ayant perdu son mot de passe... Cela en fait une protection assez efficace. Certains constructeurs vont jusqu'à recommander de changer la carte mère en cas de perte du mot de passe."
