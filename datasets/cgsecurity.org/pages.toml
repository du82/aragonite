["https://www.cgsecurity.org/Articles/proftpd.html"]
title = "Sécuriser un serveur FTP"
full_description = "WU-FTPD a mauvaise réputation : de nombreuses failles de sécurité jonchent son histoire. Il n'est pas aussi configurable que ProFTPD. Par exemple, pour masquer le fait que le serveur FTP est WU-FTPD, je peux utiliser le paramètre greeting terse qui permet d'avoir un banner réduit au minimum 220 FTP server ready. mais il se trahit facilement. La commande STAT révèle qu'il s'agit ici de wu-2.7.0(2). Je me suis définitivement faché avec WU-FTPD quand il a ignoré superbement la limitation en nombre de connexion que je venais de configurer. On peux placer dans global des options qui se répercuterons sur l'ensemble des serveurs ftp sauf mention contraire ultérieure. L'option AllowOverwrite permet d'écraser un fichier sans avoir à l'effacer préalablement. On demande au serveur à ce qu'il n'annonce pas qu'il est un ProFTPDServerIdent Off, on obtient un bref 220 [hostname] FTP server ready. Pour éviter d'oublier (sur WU-FTPD, c'est implicite), on peut créer un alias anonymous vers le compte ftp dans la section globale. Dans la section global, on a définit avec la commande ExtendedLog que les log liés à l'authentification AUTH serait enregistré selon le format standard dans le fichier /var/log/ftp.log et selon un format auth que l'on aura défini : Il est fortement conseillé de définir un nombre limite de connexions simultanées de façon à éviter les D.O.S., ceci ne fonctionne qu'en mode standalone, c'est à dire que les connexions ne sont pas transmises par l'intermédiaire d'inetd ou d'xinetd mais par ProFTPD directement, ProFTPD est en mode démon. Le compte ftp n'a pas de shell valide, on utilise RequireValidShell à no pour permettre la connexion. Ensuite, on utilise des LIMIT similaires à Apache pour interdire l'écriture sur la totalité avec une exception pour le répertoire uploads où les fichiers peuvent être ajouté mais pas lu et où aucun sous-répertoire ne peut créée. Ainsi, même si les permissions unix des fichiers sont laxistes, les LIMIT vont renforcer la sécurité."
year_published = 2025
clearnet = "https://www.cgsecurity.org/Articles/proftpd.html"
