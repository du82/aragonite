title = "TestDisk TR - CGSecurity"
description = "TestDisk özgür bir yazılımdır ve GNU Genel Kamu Lisansı (GPL v2+) ile lisanslanmıştır. TestDisk güçlü ve özgür bir veri kurtarma yazılımıdır! Öncelikli olarak, yazılım..."
full_description = '''TestDisk TR From CGSecurity Jump to navigation Jump to search English 中文 Deutsch Español Français Magyar فارسی Italiano Japanese 한국어 Nederlands Polski Português Русский Türkçe Latest stable version 7.2 February 22, 2024 TestDisk, Data Recovery TestDisk özgür bir yazılımdır ve GNU Genel Kamu Lisansı (GPL v2+) ile lisanslanmıştır. TestDisk güçlü ve özgür bir veri kurtarma yazılımıdır! Öncelikli olarak, yazılım hataları, çeşitli virüsler veya kullanıcı hataları (yanlışlıkla disk tablosunu silmek gibi) nedeniyle silinmiş disk bölümlerini kurtarmaya ve/veya önyüklenemez hale gelmiş diskleri tekrar önyüklenebilir hale getirmeye yardımcı olmak için tasarlanmıştır. TestDisk kullanarak disk tablosu kurtarmak gerçekten çok kolaydır. TestDisk şunları yapabilir: Disk tablosunu düzeltir, silinmiş disk bölümlerini kurtarır Yedeğini kullanarak FAT32 önyükleme sektörünü kurtarır FAT12/FAT16/FAT32 önyükleme sektörlerini tekrar oluşturur FAT tablolarını düzeltir NTFS önyükleme sektörünü yeniden oluşturur Yedeğini kullanarak NTFS önyükleme sekötrünü kurtarır MFT yansısını kullanarak MFT'yi düzeltir ext2/ext3 Yedek süperbloğunu bulur FAT, NTFS ve ext2 dosya sistemlerinde silinmiş dosyaları bulur Silinmiş FAT, NTFS ve ext2/ext3/ext4 bölümlerinden dosya kopyalar. TestDisk sadece ileri düzey kullanıcılar değil başlangıç seviyesindeki kullanıcılar tarafından da kolaylıkla kullanılabilir. Veri kurtarmak teknikleri hakkında az bilgisi olan veya hiç bilgisi olmayan kullanıcılar TesDisk yazılımını kullanarak önyükleme yapmayan bir sürücü hakkında detaylı bilgi alabilir, daha sonra bu bilgileri detaylı inceleme için ileri düzeydeki başka bir kullanıcıya gönderebilir. Veri kurtarma tekniklerine daha aşina olan kullanıcılar tarafından TestDisk yerinde kurtarma yönünden faydalı bir araç olarak görülmektedir. İşletim Sistemleri TestDisk aşağıdaki işletim sistemlerinde çalışır: DOS (gerçek veya bir Windows 9x DOS-box), Windows (NT4, 2000, XP, 2003, Vista), Linux, FreeBSD, NetBSD, OpenBSD, SunOS ve MacOS Kaynak kod dosyaları ve önderlemesi yapılmış ikili çalıştırılabilir dosyalar DOS, Win32, MacOSX ve Linux için indirme sayfasından indirilebilir. Dosya Sistemleri TestDisk aşağıdaki tüm dosya sistemlerinde silinmiş disk bölümlerini bulabilir: BeFS ( BeOS ) BSD disklabel ( FreeBSD/OpenBSD/NetBSD ) CramFS, Compressed File System DOS/Windows FAT12, FAT16 and FAT32 Windows exFAT HFS, HFS+ ve HFSX, Hierarchical File System JFS, IBM's Journaled File System Linux ext2, ext3 ve ext4 Linux LUKS encrypted partition Linux RAID md 0.9/1.0/1.1/1.2 RAID 1: mirroring RAID 4: striped array with parity device RAID 5: striped array with distributed parity information RAID 6: striped array with distributed dual redundancy information Linux Swap (1. ve 2. versiyonlar) LVM and LVM2, Linux Logical Volume Manager Mac partition map Novell Storage Services NSS NTFS ( Windows NT/2000/XP/2003/Vista/2008/7 ) ReiserFS 3.5, 3.6 and 4 Sun Solaris i386 disklabel Unix File System UFS ve UFS2 (Sun/BSD/...) XFS, SGI's Journaled File System Dökümantasyon TestDisk Nasıl Edinilir İndir - DOS, Win32, MacOSX ve Linux için çalıştırılabilir dosyalar ve kaynak kodlar. TestDisk derleme TestDisk ve Çalıştırılabilir kurtarma cdsi Özel medya işlemleri Zarar görmüş hard diskleri kurtarma (bad sectors) Disk görüntüsü CD-R/CR-RW/DVD... TestDisk Kullanımı İşletim sistemine özel notlar Adım adım TestDisk kayıp bölümleri kurtarma ve zarar görmüş FAT/NTFS önyükleme sektörünü onarma TestDisk Programını çalıştırma FAT12, FAT16, FAT32 dosya sistemlerinde dosya ve dizin silme işlemlerini geri almak ext2 dosya sisteminde dosya silme işlemlerini geri almak NTFS bölümünde dosya silme işlemlerini geri almak Kurtarma örnekleri Komut çalıştırma Destek TestDisk kullandıktan sonra Teknik Notlar Geliştiriciler TestDisk ve PhotoRec kodlamasına nasıl katkıda bulunulur? Intel Disk Tablosu Microsoft Fdisk SMART görüntüleme Norton GoBack Sınırlamalar Nasıl yardım edebilirsiniz? TestDisk & PhotoRec haberleri TestDisk ekibi Dijital kameranız veya harddiskinizdeki kayıp resimlerinizi veya dosyalarınızı kurtarmak için, PhotoRec komutunu çalıştırın. TestDisk anasayfa: https://www.cgsecurity.org. Christophe GRENIER grenier@cgsecurity.org Retrieved from "https://www.cgsecurity.org/mw/index.php?title=TestDisk_TR&oldid=8546" Category: Data Recovery'''
