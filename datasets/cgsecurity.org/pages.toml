description = "TestDisk is a powerful free data recovery software designed to help recover lost partitions and/or make non-booting disks bootable again. PhotoRec is file data recovery..."
full_description = '''TestDisk Team From CGSecurity Jump to navigation Jump to search English Deutsch Español Français Italiano TestDisk is a powerful free data recovery software designed to help recover lost partitions and/or make non-booting disks bootable again. PhotoRec is file data recovery software designed to recover lost files including video, documents and archives from Hard Disks and CDRom and lost pictures from digital camera memory. Many people have been helpful in making TestDisk & PhotoRec very useful (and free) programs! This page lists some of those who've helped us by the contributions they have made, or continue to make. New contributors are welcome, feel free to help! Contents 1 Main Contributors 1.1 Christophe Grenier 1.2 Juan Carniglia 1.3 Fiona Meg Riessler 1.4 Daniel B. Sedory 2 Past contributors 2.1 Gregory Blanc 2.2 Fabien Bouffard 2.3 Simone Brandt 2.4 Marcel Bruins 2.5 Karim El Filali 2.6 Igor Vallee 2.7 Dmitri Zdorov 3 Packagers 3.1 Franz Bakan 3.2 Daniel Black 3.3 Ladislav Hagara 3.4 Robin H. Johnson 3.5 Jean-Michel Kelbert 3.6 Vitaly Lipatov 3.7 Arkadiusz Patyk 3.8 Pascal Terjan 3.9 Florent Thoumie 3.10 Ali Erdinç Köroğlu 4 Past Packagers 4.1 Fabian Franz 5 PE System Plug-in 5.1 Xtreme Main Contributors Christophe Grenier Location: Paris, France URL: cgsecurity.org He started the project in 1998 and is still the main developer. He is also responsible for the packaging of TestDisk & PhotoRec for DOS, Windows(tm), Linux (generic version), MacOS X and Fedora distribution. Juan Carniglia Location: Buenos Aires - Argentina He is responsible for the maintaining of the Spanish version of the documentation. He is also constantly seeking for freelance jobs, on every area of expertice, making good use of over 15 years of experience. Fiona Meg Riessler Location: Germany She moderates TestDisk & PhotRec Forums where she helps users. She is responsible for the TestDisk & PhotoRec documentation in German. Daniel B. Sedory Location: USA He has worked on the English documentation since 2001 and suggested numerous improvements. Some of his work can be found at: The Starman's Realm. Past contributors Gregory Blanc Location: France During summer 2006, he worked on the French version of TestDisk's documentation and the 'Office' file format for PhotoRec. Fabien Bouffard Location: France During summer 2006, he worked on the French version of TestDisk's documentation and the 'Office' file format for PhotoRec. Simone Brandt Location: Germany She created this TestDisk-Logo in 2001 and also worked on the early documentation for TestDisk. Marcel Bruins Location: The Netherlands In 2006, Marcel won our PhotoRec Logo Contest with this design. Karim El Filali Location: France During summer 2006, he worked on the French version of TestDisk's documentation. Igor Vallee Location: France During summer 2006, he worked on the French version of TestDisk's documentation and the 'Office' file format for PhotoRec. Dmitri Zdorov Location: USA He created the first TestDisk logo in 2001. Packagers Franz Bakan Location: Hamburg, Germany URL: www.fbakan.de/photorec-os2.htm He packages PhotoRec for OS/2. Daniel Black Location: Australia He is responsible for forensics packages under Gentoo Linux and also works on the TestDisk ebuild script. If you have any trouble with the TestDisk package under Gentoo please search for existing bugs first. If none are found, you may fill out a new bug report. Ladislav Hagara Location: Czech Republic He is working on a script that will add TestDisk to 'Source Mage' GNU/Linux. Robin H. Johnson Primary Gentoo maintainer for the TestDisk ebuild script in Gentoo. Member of the Gentoo Council 2006-2007. (For more information regarding Gentoo Linux, see Daniel Black's entry above.) Jean-Michel Kelbert He is now responsible for TestDisk packaging under Debian. https://packages.qa.debian.org/t/testdisk.html Vitaly Lipatov He packages TestDisk & PhotoRec for the 'ALT Linux' distribution. Arkadiusz Patyk He packages TestDisk for 'PLD Linux' (since 2002). Location: Lodz, Poland URL: rescuecd.pld-linux.org/ Pascal Terjan Location: Paris, France He packages TestDisk for 'Mandriva Linux' (since 2003). Florent Thoumie Location: Dublin, Ireland URL: https://www.freshports.org/sysutils/testdisk Since 2004, he has added the latest version of TestDisk/PhotoRec to FreeBSD ports. Ali Erdinç Köroğlu He packages TestDisk for Pardus Linux. Location: Istanbul, Turkey Past Packagers Fabian Franz He was responsible for the Debian packaging of TestDisk during 2002 and 2003. PE System Plug-in Xtreme He is responsible for developing Plug-in for both BartPE and WinBuilder to let TestDisk work under Windows based Live CDs/DVDs/USBs. URL: http://xtreme.boot-land.net Retrieved from "https://www.cgsecurity.org/mw/index.php?title=TestDisk_Team&oldid=8971"'''
