description = "TestDisk é um software de Livre Distribuição e está licenciado sob os termos  GNU General Public License (GPL v2+). TestDisk é um poderoso software gratuíto de recuperação..."
full_description = '''TestDisk PT From CGSecurity Jump to navigation Jump to search English 中文 Deutsch Español Français Magyar فارسی Italiano Japanese 한국어 Nederlands Polski Português Русский Türkçe Latest stable version 7.2 February 22, 2024 TestDisk, Data Recovery TestDisk é um software de Livre Distribuição e está licenciado sob os termos GNU General Public License (GPL v2+). TestDisk é um poderoso software gratuíto de recuperação de dados! Foi inicialmente criado para recuperar partições perdidas e/ou tornar discos não-iniciáveis em iniciáveis quando estes síntomas são causados por software com falhas, determinados tipos de vírus ou erro humano (tais como acidentalmente deletar a tabela de partições). Recuperar a tabela de partições usando TestDisk é muito simples. TestDisk pode Corrigir a tabela de partições, recuperar partições deletadas Recuperar setores de ínicio FAT32 da sua cópia Reconstruir setores de ínicio FAT12/FAT16/FAT32 Corrigir tabelas FAT Reconstruir setores de íncio NTFS Recuperar setores de ínicio NTFS do seu backup Corrigir a MFT usando o espelho MFT Localizar o SuperBloco de backup ext2/ext3/ext4 TestDisk possui recursos para usuários iniciantes e avançados. Para aqueles que sabem pouco ou nada sobre técnicas de recuperação de dados, TestDisk pode ser usado para coletar informações detalhadas sobre um disco não-iniciável, o qual poderá ser enviado para um técnico realizar análises adicionais. Aqueles mais familiarizados com tais procedimentos podem achar TestDisk uma ferramenta útil para realizar a recuperação de dados no local. Sistemas Operativos TestDisk pode ser executado em DOS (ou puro ou em uma janela do Windows 9x), Windows (NT4, 2000, XP, 2003, Vista), Linux, FreeBSD, NetBSD, OpenBSD, SunOS e MacOS Os arquivos fonte e os binários executáveis estão disponíveis para DOS, Win32, MacOSX e Linux na página download Sistemas de arquivos TestDisk pode encontrar partições perdidas para os seguintes sistemas de arquivos: BeFS ( BeOS ) BSD disklabel ( FreeBSD/OpenBSD/NetBSD ) CramFS, Compressed File System DOS/Windows FAT12, FAT16 e FAT32 Windows exFAT HFS, HFS+ e HFSX, Hierarchical File System JFS, IBM's Journaled File System Linux ext2, ext3 e ext4 Linux LUKS encrypted partition Linux RAID md 0.9/1.0/1.1/1.2 RAID 1: mirroring RAID 4: striped array with parity device RAID 5: striped array with distributed parity information RAID 6: striped array with distributed dual redundancy information Linux Swap (versões 1 e 2) LVM e LVM2, Linux Logical Volume Manager Mac partition map Novell Storage Services NSS NTFS ( Windows NT/2000/XP/2003/Vista/2008 ) ReiserFS 3.5, 3.6 e 4 Sun Solaris i386 disklabel Unix File System UFS e UFS2 (Sun/BSD/...) XFS, SGI's Journaled File System Documentação Como obter TestDisk Download – Binários executáveis e arquivos fonte estão disponíveis para DOS, Win32, MacOSX e Linux. Compilando TestDisk TestDisk e Live rescue cd Trabalhando com mídias especiais Recuperação de discos rígidos danificados (setores defeituosos) Imagens de disco CD-R/CR-RW/DVD... Usando TestDisk Notas específicas de SO TestDisk Passo-a-passo Executando o programa TestDisk Recover deleted files from NTFS partition Undelete files and directories from FAT12, FAT16 and FAT32 filesystem Undelete files from ext2 filesystem Exemplos de Recuperação Execução com Scripts Suporte Após o uso do TestDisk Notas Técnicas Tabela de Partições Intel Microsoft Fdisk Monitoramento SMART Norton GoBack Limitações Atuais Como colaborar TestDisk & PhotoRec Equipe TestDisk Para recuperar fotos ou arquivos de uma camera digital ou disco rígido, execute o comando PhotoRec. TestDisk home: https://www.cgsecurity.org. Christophe GRENIER grenier@cgsecurity.org Retrieved from "https://www.cgsecurity.org/mw/index.php?title=TestDisk_PT&oldid=8544" Category: Data Recovery'''
