["https://cgsecurity.org/wiki/PhotoRec_CN"]
title = "PhotoRec CN - CGSecurity"
description = "PhotoRec 是一款用于恢复硬盘、光盘中丢失的视频、文档、压缩包等文件，或从数码相机存储卡中恢复丢失图片的数据恢复软件（因此，该软件命名为Photo Recovery这个名字)。 PhotoRec忽略文件系统，能直接从介质底层恢复数据，因此，在介质的文件系统严重破坏或被重新格式化后，它也能进行数据恢复。 PhotoRec是一款免费的开源..."
full_description = 'PhotoRec CN From CGSecurity Jump to navigation Jump to search English 中文 Deutsch Español Français Magyar Italiano Русский Türkçe 最新稳定版 7.2 February 22, 2024 PhotoRec,数码照片及文件恢复软件 PhotoRec 是一款用于恢复硬盘、光盘中丢失的视频、文档、压缩包等文件，或从数码相机存储卡中恢复丢失图片的数据恢复软件（因此，该软件命名为Photo Recovery这个名字)。 PhotoRec忽略文件系统，能直接从介质底层恢复数据，因此，在介质的文件系统严重破坏或被重新格式化后，它也能进行数据恢复。 PhotoRec是一款免费的开源、跨多平台的数据恢复软件，受GNU General Public License (GPLV v2+) 的保护. PhotoRec 是TestDisk的伴侣程序, Testdisk是一款支持多种文件系统的丢失分区恢复，并能修复不可启动的磁盘的数据恢复软件。 您可以从链接下载该程序. 出于安全考虑, PhotoRec以只读方式来访问您要恢复数据所在的磁盘或存储卡介质。 重要提示: 一旦发现丢失或意外删除了某个图片、文件， 请不要继续往该存储设备或磁盘保存新文件；否则您可能会覆盖原来的数据。 这意味着您在使用PhotoRec时，您千万不要将恢复的文件写入到原数据所存储的同一分区。 Contents 1 支持的操作系统平台 2 支持的文件系统 3 支持的介质 4 已知文件格式 5 其它 6 问题? 支持的操作系统平台 PhotoRec 可在以下平台下运行 DOS/Win9x Windows NT 4/2000/XP/2003/Vista Linux FreeBSD, NetBSD, OpenBSD Sun Solaris Mac OS X 且可以在大多数的Unix系统平台正常编译。 下载 TestDisk & PhotoRec 支持的文件系统 Photorec忽略文件系统，因此该方式可以在文件系统遭受严重破坏后正常工作。 至少可恢复以下文件系统中的丢失文件 FAT NTFS exFAT ext2/ext3/ext4 HFS+ ReiserFS 包含了某些特殊的优化。 为了提升性能，ReiserFS能将文件存储在b树自身节点中，而不是将数据存储在磁盘上某个地方，并将标志指向该位置。很遗憾的是，PhotoRec还不能处理这种情形，这就是为什么还不支持ReiserFS的原因。 支持的介质 PhotoRec支持大多数的硬盘，光盘，存储卡(CF卡, 记忆棒, SecureDigital/SD, SmartMedia, Microdrive, MMC等), 优盘, DD原始数据镜像, EnCase E01镜像等... PhotoRec已在各种各样的媒体播放器上成功测试，如iPod及以下设备数码相机: 佳能Canon EOS300D, 10D 惠普HP PhotoSmart 620, 850, 935 尼康Nikon CoolPix 775, 950, 5700 奥林巴斯Olympus C350N, C860L, Mju 400 Digital, Stylus 300 索尼Sony Alpha DSLR, DSC-P9 Praktica DCZ-3.4 卡西欧Casio Exilim EX-Z 750 已知文件格式 PhotoRec会搜索已知文件的文件头。如果不存在碎片，那么它可以恢复完整的文件。 Photorec可识别非常多的文件类型格式，包括ZIP, Office, PDF, HTML, JPEG 及各种图片文件格式。 完整的 PhotoRec文件类型支持列表 包含了超过180种文件扩展名（大约100多种文件类型)。 其它 支持大多数CD-R/CR-RW/DVD/软驱... PhotoRec 循序渐进 如何帮助改进 使用PhotoRec之后: 对恢复文件进行排序的一些想法 脚本方式运行: 自动运行PhotoRec，无需交互(脚本模式)。 Developers How to contribute code to TestDisk & PhotoRec 问题? 如果有任何问题，欢迎 联系 Christophe GRENIER PhotoRec使用方面的问题 改进该软件的建议或想法 希望增加的某个文件类型. 翻译及软件汉化：小黑子 (Henry Xu) xiaoheizi2000@gmail.com Retrieved from "https://www.cgsecurity.org/mw/index.php?title=PhotoRec_CN&oldid=8936" Category: Data Recovery'
year_published = 2019
year_updated = 2019
