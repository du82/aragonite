full_description = '''Download Your download should begin shortly. Please click the link in case it doesn't start. Step by step guide Documentation (PDF format): Partition recovery, file undelete, file recovery, filesystem repair... TestDisk: Partition recovery, file undelete PhotoRec: File recovery Donation From CGSecurity Jump to navigation Jump to search Christophe GRENIER TestDisk and the other utilities are, and will remain, free software. I am a strong believer in the free/GPL software concept. Any time spent on TestDisk and the other utilities is time I am not doing paid work for something else, and sometimes that's a lot of time! This includes continuing development as well as answering queries and providing support to current and prospective users. Therefore if you've used TestDisk, PhotoRec and the other utilities and have found them useful, and maybe feel like giving something back and contributing to the cause then please feel free to click on one of the links below. Feel free to donate an amount of your choice Donate EUR - € USD - $ Your credit card donation will be processed by PayPal. You can also donate by bitcoin 1ARSFLbrHdfLvqmkyQMJyvWWwBxcgM4gag My Amazon wish list can be found on Amazon (FR) web site. Usually there is no shipping cost, avoid Chronopost "éclair" shipping. Thank you very much for your support. Christophe Retrieved from "https://www.cgsecurity.org/mw/index.php?title=Donation&oldid=9071"'''
