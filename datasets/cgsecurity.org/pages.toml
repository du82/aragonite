["https://www.cgsecurity.org/Articles/sotm23/index.html"]
title = "Scan of the Month 23 Analysis by Christophe GRENIER"
full_description = "Depuis plus de deux ans, le projet Honeynet propose régulièrement d'étudier des outils, des tactiques utilisés par des pirates lors d'intrusion pour démontrer la réalité de ces attaques, pour apprendre comment un pirate agit pour s'en protéger et plus généralement pour améliorer les technologies et méthodes de collecte d'information. Chaque mois, le Scan of the Month challenge propose l'analyse de trames réseaux suspectes. Cet article est inspiré du Scan of the Month du mois de septembre Scan23. Il s'agit du premier challenge destiné aux débutants. Son but est d'analyser les captures réseaux produits par un scan de port afin de répondre aux questions suivantes Pour collecter les paquets circulant sur un réseau, un sniffer est utilisé. La programmation de ces utilitaires de capture a été présentée dans un article de LinuxMag de septembre. Parmi les différentes méthodes, l'une d'entre elles est multiplateforme, il s'agit d'utiliser les fonctions de la librairie libpcap. Pcap est utilisé par des sniffers comme tcpdump, ethereal mais aussi des sondes de détection d'intrusion comme snort ou prelude. Ils ont tous la possibilité d'enregistré les événements réseaux dans un fichier de capture binaire. Le fichier de capture de septembre est disponible à l'adresse http://old.honeynet.org/scans/scan23/. Afin de garantir l'intégrité de ce fichier, une signature éléctronique de ce fichier est aussi disponible sur le site. Cette signature a été effectuée avec l'algorithme MD5, Message Digest de la société RSA Data Security. Il ne reste plus qu'à comparer cette signature de référence à la signature que l'on calcule à partir du fichier récupéré avec la commande md5sum. Attention, la somme MD5 garantie uniquement contre les corruptions accidentelles (par exemple, fichier tronqué). Si le serveur est piraté, l'archive peut être modifiée et le pirate n'a plus qu'à remplacer l'empreinte MD5 par la nouvelle valeur. Un scan de port permet d'identifier les ports TCP ou UDP sur lesquelles une application réseau est à l'écoute. Un pirate utilise généralement un scanner de port dans la phase d'approche lorsqu'il prépare son attaque. C'est pourquoi les NIDS, sondes de détections d'intrusion réseau (cf dossier IDS: Détection d'intrusion de MISC 3), sont capables de les détecter. Soumettons la capture réseau au logiciel Snort http://www.snort.org, sans doute le NIDS le plus populaire, de plus sous licence GNU."
year_published = 2025
clearnet = "https://www.cgsecurity.org/Articles/sotm23/index.html"
