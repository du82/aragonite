["https://cgsecurity.org/wiki/TestDisk_6.11_Release"]
title = "TestDisk 6.11 Release - CGSecurity"
description = "TestDisk is a powerful free data recovery program! It was primarily designed to help recover lost partitions and/or make non-booting disks bootable again when these..."
full_description = '''TestDisk 6.11 Release From CGSecurity Jump to navigation Jump to search TestDisk is a powerful free data recovery program! It was primarily designed to help recover lost partitions and/or make non-booting disks bootable again when these symptoms are caused by faulty software, certain types of viruses or human error (such as accidentally deleting your Partition Table). PhotoRec is a File Recovery program designed to recover lost files; including video, documents and archives from Hard Disks, CDRom and lost pictures from digital camera memory (thus, its Photo Recovery name). PhotoRec ignores the filesystem and goes after the underlying data, so it can still find files even if your media's filesystem has been severely damaged or re-formatted (overwritten data, of course, can not be recovered). You can download the latest version from https://www.cgsecurity.org/wiki/TestDisk_Download. General Improvements TestDisk & PhotoRec 6.11 should use less CPU. TestDisk This new TestDisk version can undelete files for NTFS filesystem and recover deleted exFAT and ext4. PhotoRec Performance improvement when scanning for numerous file type Fix several bugs including an endless loop, several memory leaks and several out-of-bound memory access New file formats are supported: .abcdp Apple binary property list .ahn Ahnenblatt .amd AlphaCAM .amt AlphaCAM .apa APA Style Helper .ape Monkey's Audio compressed format .atd Agelong Tree Database/Abs0luteDatabase .att AlphaCAM .bld blender .class Java Class .cm Comic Life .compress MS compress file (SZDD) .csv Comma separated values .cue Cue sheet .dim SunPCI Disk Image .dxf Drawing Interchange File .edb Exchange Database .fbk Microsoft Dynamics NAV (MS Navision) .fdb Microsoft Dynamics NAV (MS Navision) .flp Fruity Loop .fob Microsoft Dynamics NAV (MS Navision) .hds Parallels disk image .ico Windows Icon .jp2 sample .kmy KMyMoney .logic Apple Logic Studio .lyx LyX .m3u Moving Picture Experts Group Audio Layer 3 Uniform Re