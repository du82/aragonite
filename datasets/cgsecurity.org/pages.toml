["https://www.cgsecurity.org/Articles/dns_bind.html"]
title = "Sécuriser un serveur de nom"
full_description = "Ces derniers temps, pas mal d'erreurs d'implémentation (tsig, infoleak,...) ont été découvertes dans BIND. Le détail de ces problèmes est disponible sur https://kb.isc.org/article/AA-00959/0. Ainsi à l'heure actuelle, il vous faut installer la version 8.2.3 ou la version 9.1. Bind 9 implémente DNSSEC pour les zones signés et TSIG pour signer les requêtes DNS, cela devrait permettre de résoudre à terme les différents problèmes liés au DNS spoofing. Une autre nouveauté de taille est le support d'IPV6 et de nouveaux protocoles (IXFR, DDNS, Notify, EDNSO). Le support TSIG est disponible à partir de Bind 8.2. Si vous vous demandez si BIND est capable de supporter de lourde charge, le serveur F.root-servers.net utilisant bind 8.2.3 répond à plus de 272 millions de requêtes DNS par jour. Vous pouvez aussi bien utiliser des packages pré-compilés que compiler bind vous-même à partir des sources. Celles-ci sont disponibles sur http://www.isc.org. Si vous utilisez des packages RedHat, il vous faut installer bind, bind-utils ainsi que bind-devel si vous programmez. Le fichier de configuration de bind est généralement le fichier /etc/named.conf. Quelques mots rapides sur la configuration : also-notify doit contenir les DNS secondaires non officiels, cela permet de les prévenir immédiatement si une mise à jour d'une zone est effectuée. allow-transfer indique quelles sont les machines autorisées à effectuer un transfert de zone, c'est à dire à récupérer toutes les informations d'une zone, les seuls DNS secondaires devraient être autorisés. allow-query indique qui peut interroger le serveur pour une zone donnée. Les ACL (access control lists) permettent de définir des ensembles de machines et/ou de réseaux. Quatre ACL sont pré-définies : any, none, localhost et localnets. Elles correspondent respectivement à tout le monde, personne, le serveur seulement et l'ensemble des réseaux définis par les adresses IP et netmasks de la machine. Par exemple, je peux définir l'acl dns_sec_non_officiel comportant deux adresses IP de la manière suivante :"
