title = "TestDisk and PhotoRec in various digital forensics testcase - CGSecurity"
full_description = '''TestDisk and PhotoRec in various digital forensics testcase From CGSecurity Jump to navigation Jump to search Contents 1 Test your knowledge 2 Digital Forensics Tool Testing Images 2.1 Extended DOS Partition Test 2.2 FAT Undelete Test #1 2.3 NTFS Undelete (and leap year) Test #1 2.4 Basic Data Carving Test #1 2.4.1 Repairing the damaged boot sector using TestDisk 2.4.2 Data carving using PhotoRec 2.5 Basic Data Carving Test #2 2.5.1 Superblock recovery using TestDisk 2.5.2 Copy files from the damaged ext2 filesystem using TestDisk 2.5.3 File carving using PhotoRec 3 DFRWS 3.1 DFRWS 2006 Forensics Challenge - Data carving 3.2 DFRWS 2008 Rodeo - Data carving or FAT unformat ? 4 ForensicKB 4.1 Simple Forensic Puzzle #1 4.2 NTFS Alternate Data Stream 5 LinuxLeo 5.1 Undelete file from a FAT12 filesystem 5.2 File carving using PhotoRec from a FAT12 5.3 Recover deleted files from an ext2 filesystem 5.4 Recover lost data from the free space of an ext2 filesystem 5.5 Recover deleted files from an NTFS partition 5.6 Recover lost data from the free space of a NTFS partition 5.7 Discover NTFS Alternate Data Stream (ADS) 6 Honeynet - Scan of the month 6.1 scan15: recover of delete files from an ext2 filesystem 6.2 scan24: recovery from a damaged FAT12 7 Others Test your knowledge Try the Data Recovery with PhotoRec quiz at https://moodle.cgsecurity.org Digital Forensics Tool Testing Images Digital Forensics Tool Testing Images (DFTT) can be downloaded at http://dftt.sourceforge.net Extended DOS Partition Test Test: Most DOS partition tools will not allow the user to create a third entry in an extended partition. A test image was created by modifying the partition table by hand with a hex editor and the system was booted. Both Windows and Linux read the third entry in the extended partition table and allowed the user to mount the partition. This test was to verify that forensic tools also allowed the investigator to view the partition in the third entry. Result: Passed, TestDisk shows all six FAT16 partitions. testdisk -lu 1-extend-part/ext-part-test-2.dd TestDisk 7.1-WIP, Data Recovery Utility, August 2016 Christophe GRENIER <grenier@cgsecurity.org> https://www.cgsecurity.org Please wait... Disk /home/kmaster/data/data_for_testdisk/1-extend-part/ext-part-test-2.dd - 159 MB / 152 MiB - CHS 20 255 63 (RO) Sector size:512 Disk /home/kmaster/data/data_for_testdisk/1-extend-part/ext-part-test-2.dd - 159 MB / 152 MiB - CHS 20 255 63 (RO) Partition Start End Size in sectors 1 P FAT16 <32M 63 52415 52353 [NO NAME] FAT16, blocksize=512 2 P FAT16 <32M 52416 104831 52416 [NO NAME] FAT16, blocksize=512 3 P FAT16 <32M 104832 157247 52416 [NO NAME] FAT16, blocksize=512 4 E extended 157248 312479 155232 5 L FAT16 <32M 157311 209663 52353 [NO NAME] FAT16, blocksize=512 6 L FAT16 <32M 209727 262079 52353 [NO NAME] FAT16, blocksize=512 X extended 262080 312479 50400 7 L FAT16 >32M 262143 312479 50337 FAT16, blocksize=2048 FAT Undelete Test #1 Test: This test image is a 6MB FAT file system with six deleted files and two deleted directories. The files range from single cluster files to multiple fragments. Procedure Run testdisk 6-fat-undel.dd, Partition type: None, Advanced, Undelete, for each file, select it and press c to copy it. TestDisk 6.12-WIP, Data Recovery Utility, October 2010 Christophe GRENIER <grenier@cgsecurity.org> https://www.cgsecurity.org P FAT16 0 0 1 5 30 62 12032 [NO NAME] Directory / >-rwxr-xr-x 0 0 1584 14-Feb-2004 12:51 _RAG1.DAT -rwxr-xr-x 0 0 3873 14-Feb-2004 12:52 _RAG2.DAT -rwxr-xr-x 0 0 780 14-Feb-2004 12:52 _ING.DAT -rwxr-xr-x 0 0 3801 14-Feb-2004 21:20 _ULT1.DAT drwxr-xr-x 0 0 1024 14-Feb-2004 12:53 _IR1 drwxr-xr-x 0 0 1024 14-Feb-2004 12:53 System Volume Information Use Right arrow to change directory, c to copy, h to hide deleted files, q to quit Results 1. Can you see the frag1.dat, frag2.dat, sing.dat, mult1.dat, and dir1 file and directory names in the root directory? Yes but the first char is missing as expected 2. Can you see the dir2 and mult2.dat names in the dir1 directory? Yes 3. Can you see the frag3.dat name in the dir1\dir2 directory? Yes 4. Can you recover the sing.dat file? Does it have the correct MD5? Yes 5. Can you recover the mult1.dat file? Does it have the correct MD5? Yes 6. Can you recover the dir1\mult2.dat file? Does it have the correct MD5? Yes 7. Can you recover the frag1.dat file? Does it have the correct MD5? Incorrect MD5 8. Can you recover the frag2.dat file? Does it have the correct MD5? Incorrect MD5 9. Can you recover the dir1\dir2\frag3.dat file? Does it have the correct MD5? Incorrect MD5 TestDisk has found all the deleted files but fragmented files aren't recovered correctly. NTFS Undelete (and leap year) Test #1 Test: This test image is a 6MB NTFS file system with eight deleted files, two deleted directories, and a deleted alternate data stream. The files range from resident files, single cluster files, and multiple fragments. Procedure: Run testdisk 7-ntfs-undel.dd, Partition type: None, Advanced, Undelete TestDisk 7.1-WIP, Data Recovery Utility, August 2016 Christophe GRENIER <grenier@cgsecurity.org> https://www.cgsecurity.org P NTFS 0 0 1 5 30 62 12032 [NTFS_DEL] Deleted files >./frag1.dat 29-Feb-2004 21:00 1584 ./frag2.dat 29-Feb-2004 21:02 3873 ./mult1.dat 29-Feb-2004 21:02 3801 ./mult1.dat:ADS 29-Feb-2004 21:02 1234 ./res1.dat 29-Feb-2004 21:05 101 ./sing1.dat 29-Feb-2004 21:01 780 /dir1/dir2/frag3.dat 29-Feb-2004 21:03 2027 /dir1/mult2.dat 29-Feb-2004 21:03 1715 sing2.dat 29-Feb-2004 21:04 1005 Use : to select the current file, a to select/deselect all files, C to copy the selected files, c to copy the current file, q to quit Results: 1. Can you see any of the deleted file names? Which ones? All the files are listed, the alternate datastream mult1.dat:ADS is listed since version 6.13. 2. Can you recover the res1.dat file? Does it have the correct MD5? Perfectly recovered. 3. Can you recover the sing1.dat file? Does it have the correct MD5? Perfectly recovered. 4. Can you recover the dir3\sing2.dat file? Does it have the correct MD5? The file is recovered with the name sing2.dat instead of dir3\sing2.dat. Checkum is ok. 5. Can you recover the mult1.dat file? Does it have the correct MD5? Perfectly recovered. 6. Can you recover the mult1.dat:ADS file? Does it have the correct MD5? Perfectly recovered. 7. Can you recover the dir1\mult2.dat file? Does it have the correct MD5? Perfectly recovered. 8. Can you recover the frag1.dat file? Does it have the correct MD5? Perfectly recovered. 9. Can you recover the frag2.dat file? Does it have the correct MD5? Perfectly recovered. 10. Can you recover the dir1\dir2\frag3.dat file? Does it have the correct MD5? Perfectly recovered. 11. Are the dates properly shown to be from Feb 29, 2004? (testing leap year support) Yes, no problem Basic Data Carving Test #1 Test: This test image is a FAT32 file system and is intended to test data carving tools and their ability to extract various file formats. The image contains several allocated and deleted files and the header one JPEG file was modified ( to show the importance of ignoring corrupted files). The FAT boot sector has been corrupted so that the image cannot be mounted and therefore data carving methods must be used to extract the files. Repairing the damaged boot sector using TestDisk Procedure: run testdisk 11-carve-fat.dd, Partition type: None, Advanced, change the type to FAT16, Boot, RebuildBS, List TestDisk 6.12-WIP, Data Recovery Utility, October 2010 Christophe GRENIER <grenier@cgsecurity.org> https://www.cgsecurity.org P FAT16 0 0 1 7 229 31 126913 Directory / >-rwxr-xr-x 0 0 19968 9-Mar-2005 13:25 2003_document.doc -rwxr-xr-x 0 0 8037267 9-Mar-2005 13:25 _OMOPERS.WMV -rwxr-xr-x 0 0 318895 9-Mar-2005 13:25 enterprise.wav -rwxr-xr-x 0 0 24367 9-Mar-2005 13:25 haxor2.jpg -rwxr-xr-x 0 0 23040 9-Mar-2005 13:25 holly.xls -rwxr-xr-x 0 0 1399508 9-Mar-2005 13:25 lin_1.2.pdf -rwxr-xr-x 0 0 122434 9-Mar-2005 13:25 nlin_14.pdf -rwxr-xr-x 0 0 29885 9-Mar-2005 13:25 paul.jpg -rwxr-xr-x 0 0 444314 9-Mar-2005 13:25 pumpkin.jpg -rwxr-xr-x 0 0 99298 9-Mar-2005 13:25 shark.jpg -rwxr-xr-x 0 0 5498 9-Mar-2005 13:25 sm1.gif -rwxr-xr-x 0 0 550653 9-Mar-2005 13:25 surf.mov -rwxr-xr-x 0 0 1036994 9-Mar-2005 13:25 surf.wmv -rwxr-xr-x 0 0 11264 9-Mar-2005 13:25 _EST.PPT -rwxr-xr-x 0 0 78899 9-Mar-2005 13:25 wword60t.zip Use Right arrow to change directory, c to copy, h to hide deleted files, q to quit Results: All the files are perfectly recovered Data carving using PhotoRec Run photorec 11-carve-fat.dd, Partition type: None, Search, Other, select where to store the files PhotoRec 6.12-WIP, Data Recovery Utility, October 2010 Christophe GRENIER <grenier@cgsecurity.org> https://www.cgsecurity.org Disk 11-carve-fat.dd - 64 MB / 61 MiB (RO) Partition Start End Size in sectors P Unknown 0 0 1 7 229 31 126913 14 files saved in /home2/kmaster//11-carve-fat/recup_dir directory. Recovery completed. [ Quit ] Results All the files are recovered. The damaged jpg (haxor2.jpg) is ignored as expected 13/14 files are perfectly recovered (Checkums match the original ones, note that with version older than 6.12, the score is 11/14) When the file enterprise.wav is recovered, it is one byte shorter. PhotoRec is correct, there is an extra/junk byte at the end of the original file. Basic Data Carving Test #2 This test image is an EXT2 file system and is intended to test data carving tools for indirect block detection and removal. With large files, EXT2 allocates blocks (called indirect blocks) to store file metadata and the blocks are frequently allocated in between blocks that contain file content. Therefore, the file becomes fragmented and a basic carving tool may include the indirect block in the carved file. This file system image contains several allocated and deleted files, none of which have been modified. The super block has been corrupted so that the image cannot be mounted and therefore data carving methods must be used to extract the files. Several possibilities exist using TestDisk & PhotoRec. Superblock recovery using TestDisk TestDisk can find the backup superblock location. Run testdisk 12-carve-ext2.dd, Partition type: None, Advanced, change the type to ext2, Superblock TestDisk 6.12-WIP, Data Recovery Utility, October 2010 Christophe GRENIER <grenier@cgsecurity.org> https://www.cgsecurity.org Disk 12-carve-ext2.dd - 129 MB / 123 MiB - CHS 16 255 63 (RO) Partition Start End Size in sectors ext2 0 0 1 15 185 18 252648 superblock 8193, blocksize=1024 [] superblock 24577, blocksize=1024 [] superblock 40961, blocksize=1024 [] superblock 57345, blocksize=1024 [] superblock 73729, blocksize=1024 [] To repair the filesystem using alternate superblock, run fsck.ext2 -p -b superblock -B blocksize device >[ Quit ] Return to Advanced menu Using the advice from TestDisk, it's possible to repair the filesystem $ fsck.ext2 -p -b 8193 -B 1024 12-carve-ext2.dd 12-carve-ext2.dd was not cleanly unmounted, check forced. 12-carve-ext2.dd: 19/31616 files (0.0% non-contiguous), 6521/126324 blocks This way, all non-deleted files are available. After recovering the two deleted files using PhotoRec, all the files are recovered. This solution is the cleanest. Copy files from the damaged ext2 filesystem using TestDisk Run testdisk 12-carve-ext2.dd, Partition type: None, Advanced, List For each file, press c to copy it. TestDisk 7.1-WIP, Data Recovery Utility, August 2016 Christophe GRENIER <grenier@cgsecurity.org> https://www.cgsecurity.org P ext2 0 0 1 15 185 20 252650 Directory / >drwxr-xr-x 0 0 1024 10-Mar-2005 19:04 . drwxr-xr-x 0 0 1024 10-Mar-2005 19:04 .. drwx------ 0 0 12288 10-Mar-2005 17:41 lost+found -rw-r--r-- 0 0 18663 10-Mar-2005 19:01 blogo.gif -rw-r--r-- 0 0 28949 10-Mar-2005 19:01 jn.jpg -rw-r--r-- 0 0 26618 10-Mar-2005 19:01 lin_test.pdf -rw-r--r-- 0 0 8463 10-Mar-2005 19:01 main_dive.jpg -rw-r--r-- 0 0 734652 10-Mar-2005 19:01 n_lin_ss.pdf -rw-r--r-- 0 0 133249 10-Mar-2005 19:01 sherry.jpg -rw-r--r-- 0 0 15360 10-Mar-2005 19:01 stats.xls -rw-r--r-- 0 0 17408 10-Mar-2005 19:01 test.ppt Next Use Right to change directory, h to hide deleted files q to quit, : to select the current file, a to select all files C to copy the selected files, c to copy the current file Unfortunately, the deleted files don't show up. File carving using PhotoRec PhotoRec is a signature-based file carver. Run photorec 12-carve-ext2.dd, Search, filesystem type: ext2/ext3, [Whole] PhotoRec 7.1-WIP, Data Recovery Utility, August 2016 Christophe GRENIER <grenier@cgsecurity.org> https://www.cgsecurity.org Disk /home/kmaster/data/data_for_testdisk/12-carve-ext2/12-carve-ext2.dd - 129 MB / 123 MiB (RO) Partition Start End Size in sectors P ext2 0 0 1 15 185 20 252650 10 files saved in /home/kmaster/recup_dir directory. Recovery completed. You are welcome to donate to support and encourage further development https://www.cgsecurity.org/wiki/Donation [ Quit ] All the files, deleted and non-deleted, are recovered. If only deleted files were wanted, choose [Free] instead of [Whole] DFRWS DFRWS 2006 Forensics Challenge - Data carving After downloading the challenge archive, it's possible to run PhotoRec in a fully automated way photorec /debug /log /d recup_dir /cmd dfrws-2006-challenge.raw options,paranoid_bf,keep_corrupted_file,search or in the interactive fashion photorec /debug /log dfrws-2006-challenge.raw in the options menu, enable the brute-force search mode and tell PhotoRec to keep corrupted files Results: Fragment of HTML and ascii files are recovered Microsoft Office documents: All files are recovered perfectly except one. The file 2c.xls is recovered as the broken file b0002051.doc. JPEG files: 3h1.jpg and 3h2.jpg aren't recovered successfully, we got two broken files instead b0031475.jpg and b0031533.jpg ZIP recovery: All files are recovered except the file 4c.zip, the ZIP file fragmented with random data in between. PhotoRec detects that the recovered zip is broken and recover it as b0045015.zip. DFRWS 2008 Rodeo - Data carving or FAT unformat ? Download the image file. We will analyze the thumbdrive image Run testdisk dfrws2008-rodeo-thumbdrive.img Partition type: Intel Advanced Undelete TestDisk 6.12-WIP, Data Recovery Utility, October 2010 Christophe GRENIER <grenier@cgsecurity.org> https://www.cgsecurity.org 1 P FAT32 LBA 0 0 2 15 186 19 252711 Directory / No file found, filesystem seems damaged. Use Right arrow to change directory, c to copy, h to hide deleted files, q to quit No file is listed! PhotoRec can recover most files using its signature-base recovery strategie Run testdisk dfrws2008-rodeo-thumbdrive.img Partition type: Intel Search Select Other as the filesystem was FAT [ Free ] Various files are recovered. For some, PhotoRec has been able to extract the filename from the files themself: f0002635.exe f0006563.exe f0011519_wget.exe f0012155_libeay32.dll f0015983_libintl3.dll f0006239.zip f0011349.zip f0011763_ssleay32.dll '''
