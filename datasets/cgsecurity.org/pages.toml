["https://cgsecurity.org/wiki/TestDisk_JP"]
title = "パーティションの修復と削除したファイルの復元"
description = "TestDiskは無料で利用できるオープンソースのデータ復元ソフトウェアツールで、壊れたパーティションの修復や削除したファイルの復元を行うことができます。"
full_description = 'TestDisk JP From CGSecurity Jump to navigation Jump to search English 中文 Deutsch Español Français Magyar فارسی Italiano Japanese 한국어 Nederlands Polski Português Русский Türkçe Latest stable version 7.2 February 22, 2024 TestDisk, Data Recovery TestDiskはオープンソースソフトウェアで、GNU General Public License (GPL v2+) の条件に基づいて利用することができます。 TestDiskは強力でかつ無料で利用できるデータ復元ソフトウェアです! ある種のコンピュータウイルスや人的ミス（例：過失によってパーティションテーブルを削除した）のようなソフトウェアの不具合によってパーティションが認識できなくなったりディスクが起動できなくなったりした時、 壊れたパーティションの復元やディスクを再び起動できるようにすることを支援するのがこのソフトの主目的です。TestDiskを使ってパーティションテーブルを復元するのは実に簡単です。 TestDiskを使って以下のようなことができます。 パーティションテーブルを復元し、削除されたパーティションを復元する バックアップからFAT32起動セクタを復元する FAT12/FAT16/FAT32起動セクタを再構築する FATテーブルを復元する NTFS起動セクタを再構築する バックアップからNTFS起動セクタを復元する MFTミラーを使ってMFTを修復する ext2/ext3/ext4のバックアップをスーパーブロックに配置する FAT、exFAT、NTFS、ext2のファイルシステムから削除されたファイルを復元する 削除されたFAT、exFAT、NTFS、ext2/ext3/ext4のパーティションからファイルをコピーする TestDiskは初心者向けと熟練者向けの両機能を兼ね備えています。データ復元技術についてほとんどあるいは全く知識がない人は、TestDiskを使って起動しなくなったドライブの詳細情報を収集し、それを技術者に送ってより詳しい分析を行ってもらうことができます。このような処理により長けている人にとっては、TestDiskが現場での復旧を行う上で役立つ道具となるでしょう。 オペレーティングシステム TestDiskは以下の環境で動作します DOS（DOSそのもの、Windows 9xのDOSプロンプトの両方を含む） Windows（NT4、2000、XP、2003、Vista、2008、Windows 7（x86 & x64）、Windows 10 Linux FreeBSD, NetBSD, OpenBSD SunOS MacOS X バイナリ実行ファイルやDOS、Win32、MacOSX、Linuxの各環境用ソースファイルのダウンロード ドキュメント TestDisk一歩ずつには、壊れたパーティションを復元し、壊れたFAT/NTFS起動セクタを修復する方法が記載されています。 TestDiskとライブ救済CD TestDiskを使った編集. 開発者がTestDiskとPhotoRecのコード改良に貢献することを歓迎しています。 削除したファイルを復元する NTFSパーティションから削除したファイルを復元する FAT12、FAT16、FAT32、exFATファイルシステムからファイルやディレクトリを復元する. FATファイルシステムはフラッシュメモリカード、デジタルカメラ、その他のポータブルデバイスでよく見られます。 ext2ファイルシステムからファイルを復元する 復元事例 TestDiskとPhotoRecを使ったコンピュータ解析の自習 TestDiskプログラムの実行、各メニューごとの説明 TestDiskに関するよくある質問 サポート TestDiskとPhotoRecに関するニュース TestDiskチーム デジタルカメラやハードディスクで失われた画像やファイルを復元するには、PhotoRecコマンドを実行してください。 ファイルシステム TestDiskは以下に示すすべてのファイルシステムで失われたパーティションを見つけ出すことができます。 BeFS ( BeOS ) BSD disklabel ( FreeBSD/OpenBSD/NetBSD ) CramFS, 圧縮済みファイルシステム DOS/Windows FAT12、FAT16、FAT32 XBox FATX Windows exFAT HFS、HFS+、HFSXの階層的ファイルシステム JFS、IBMの実行記録機能付きファイルシステム Linux btrfs Linux ext2、ext3、ext4 Linux GFS2 Linux LUKS 暗号化パーティション Linux RAID md 0.9/1.0/1.1/1.2 RAID 1: ミラーリング RAID 4: パリティデバイスを含むストライプアレイ RAID 5: パリティ情報を分散保存したストライプアレイ RAID 6: パリティ情報を二重に冗長化して分散保存したストライプアレイ Linux Swap（バージョン1、2） LVM and LVM2, Linux論理ボリュームマネージャ Macパーティションマップ Novellストレージサービス NSS NTFS ( Windows NT/2000/XP/2003/Vista/2008/7 ) ReiserFS 3.5、3.6、4 Sun Solaris i386 ディスクラベル Unix File System のUFSとUFS2 (Sun/BSD/...) XFS、SGIの実行記録機能付きファイルシステム Wii WBFS Sun ZFS TestDiskホーム: https://www.cgsecurity.org/wiki/TestDisk. TestDiskフォーラム: https://forum.cgsecurity.org Retrieved from "https://www.cgsecurity.org/mw/index.php?title=TestDisk_JP&oldid=8730" Category: Data Recovery'
