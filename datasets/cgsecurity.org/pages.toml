["https://www.cgsecurity.org/Articles/dns.html"]
title = "DNS: Pièce clé d'Internet"
full_description = "Un DNS désigne les serveurs de noms à la base des communications sur Internet. Le simple fait d'envoyer un mail ou de surfer sur un site utilise de manière sous jacente un ou plusieurs DNS. Pièce clé dans la toile internet, la sécurité des DNS est primordiale. Si un pirate controle votre DNS, il peut vous rediriger vers les sites de son choix. Voyons plus en détail de quoi il s'agit. Un DNS Domain Name Server est un serveur de nom, il est chargé de la correspondance entre un nom et une adresse IP. Par exemple, www.acbm.com a pour adresse IP 61.206.130.249. Un DNS fonctionne par zone, il y a deux types de zone: Chaque zone peut contenir différents champs d'informations (SOA, NS, MX,A, PTR, CNAME), les voici avec un exemple utilisant la commande dig. Pour la commande nslookup, seule commande disponible sous Windows, se référer à l'encadré. Lorsqu'un nom de domaine est déposé, un ou plusieurs DNS doivent gérer les noms associés (www par exemple) à celui-ci. A l'échelle mondiale, il faut enregistrer le fait que ces DNS gèrent ce domaine, cette information se retrouve alors dans de nombreuses bases. Regardons ce qu'il en est. Treize serveurs centralisent les informations à l'échelle mondiale. Il s'agit des serveurs A.ROOT-SERVERS.NET à M.ROOT-SERVERS.NET. Prenons comme exemple la résolution de l'adresse www.acbm.com en interrogeant le serveur A.ROOT-SERVERS.NET Remarque, nous utilisons la commande dig sous Linux, mais la même chose est réalisable sous Windows avec nslookup (installé par défaut sous W2K et NT, je ne sais plus pour Win9x). De manière pratique, un ordinateur utilise le DNS de son entreprise ou de son fournisseur d'accès qui effectuera automatiquement ces requêtes et stockera le résultat en prévision d'une prochaine résolution de ce nom. Le serveur DNS finira par oublier cette information si celle-ci est peu utilisée au profit de requêtes plus fréquentes ou lorsque l'information va être considérée comme périmé. Cette durée de vie est de 1D, soit 1 jour (1 Day), dans l'exemple précédent."
year_published = 2025
clearnet = "https://www.cgsecurity.org/Articles/dns.html"
