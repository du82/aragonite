title = "Recupero foto digitali con PhotoRec - CGSecurity"
description = "PhotoRec è in grado di lavorare con dispositivi di memorizzazione di vari tipi tra cui: Compact Flash, Memory Stick, SecureDigital, SmartMedia, Microdrive, MMC,..."
full_description = '''Recupero foto digitali con PhotoRec From CGSecurity Jump to navigation Jump to search English Deutsch Español Français Italiano PhotoRec è in grado di lavorare con dispositivi di memorizzazione di vari tipi tra cui: Compact Flash, Memory Stick, SecureDigital, SmartMedia, Microdrive, MMC, USB Memory Drives, HardDisks, Cdrom, ecc... PhotoRec è stato usato con successo con le seguenti macchine fotografiche digitali: Canon EOS300D, 10D HP PhotoSmart 620, 850, 935 Nikon CoolPix 775, 950, 5700 Olympus C350N, C860L, Mju 400 Digital, Stylus 300 Sony DSC-P9 Praktica DCZ-3.4 Casio Exilim EX-Z 750 Konica Minolta Dimage A200 Quasi tutte le macchine digitali non cancellano le foto dalla memoria quando si cancellano le foto o la si riformatta. Molto spesso PhotoRec può perciò recuperare i file cancellati. Anche se la memoria della telecamera o macchina fotografica è rovinata e si ottengono dei messaggi di errore se la si prova ad usare, se questa non è definitivamente "morta", ci possono essere buone probabilità che le foto siano ancora recuperabili. PhotoRec è in grado di recuperare: .jpg JPEG .tif Tag Image File Format (TIFF) e varie altre varianti proprietarie tra cui: .arw Sony Raw picture .cr2 Canon Raw 2 picture .dcr Kodak Raw picture .dng Adobe Digital Negative .nef Nikon Raw picture .pef Pentax Raw picture .sr2 Sony Raw picture .wdp JPEG XR diversi formati file raw proprietari come: .crw Canon Raw picture .orf Olympus Raw Format picture .raf Raw Fujifilm picture .raw Contax picture, Panasonic/Leica picture .rdc Rollei picture .sit Mikron .x3f Sigma/Foveon X3 raw picture L'elenco completo dei formati di file recuperabili da PhotoRec contiene più di 320 estensioni. Retrieved from "https://www.cgsecurity.org/mw/index.php?title=Recupero_foto_digitali_con_PhotoRec&oldid=6186" Category: Data Recovery'''
