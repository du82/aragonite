["https://cgsecurity.org/wiki/TestDisk_RU"]
title = "TestDisk RU - CGSecurity"
description = "TestDisk программа с открытым исходным кодом и лицензией GNU General Public License (GPL v2+). TestDisk это мощная бесплатная программа для восстановления данных..."
full_description = '''TestDisk RU From CGSecurity Jump to navigation Jump to search English 中文 Deutsch Español Français Magyar فارسی Italiano Japanese 한국어 Nederlands Polski Português Русский Türkçe Latest stable version 7.2 February 22, 2024 TestDisk, Data Recovery TestDisk программа с открытым исходным кодом и лицензией GNU General Public License (GPL v2+). TestDisk это мощная бесплатная программа для восстановления данных! Она была разработана в первую очередь, что бы помочь восстановить утраченные разделы и/или восстановить загрузочную способность дисков если эта проблема вызвана програмно, вирусами или ошибками человека (таких как случайное удаление Таблицы Разделов). Восстановить Таблицы Разделов TestDisk-ом очень легко. TestDisk может: Исправлять таблицу разделов, восстанавливать удаленные разделы; Восстанавливать загрузочный сектор FAT32 из резервной копии; Перестраивать (реконструировать) загрузочный сектор FAT12/FAT16/FAT32; Исправлять таблицу FAT; Перестраивать (реконструировать) загрузочный сектор NTFS; Восстанавливать загрузочный сектор NTFS из резервной копии; Восстанавливать MFT использую MFT зеркало; Определять резервный SuperBlock ext2/ext3/ext4; Восстанавливать удаленные файлы на файловых системах FAT, NTFS and ext2; Копировать файлы с удалённых FAT, NTFS and ext2/ext3/ext4 разделов. TestDisk подойдёт и для новичков, и для экспертов. Для тех, кто знает мало или вообще ничего не знает о методах восстановления данных, TestDisk может быть использован для сбора детальной информации о незагружающихся дисках которая затем может быть использована для дальнейшего анализа. Те, кто уже знаком с такими процедурами, должен найти TestDisk удобным инструментом при выполнении восстановления. Операционные системы TestDisk может работать под: DOS (real или в Windows 9x, DOS-box); Windows (NT4, 2000, XP, 2003, Vista); Linux; FreeBSD, NetBSD, OpenBSD; SunOS; MacOS. Файлы с исходными тестами и предварительно скомпилированные бинарные исполняемые файлы доступны для DOS, Win32, MacOSX и Linux на странице загрузки Файловые системы TestDisk может находить потеряные разделы для всех указанных файловых систем: BeFS ( BeOS ) BSD disklabel ( FreeBSD/OpenBSD/NetBSD ) CramFS, Compressed File System (сжатая файловая система) DOS/Windows FAT12, FAT16 and FAT32 Windows exFAT HFS, HFS+ and HFSX, Hierarchical File System (иерархическая файлова система) JFS, IBM's Journaled File System (журналируемая файлова система IBM) Linux ext2, ext3 and ext4 Linux LUKS encrypted partition (шифрованый раздел Linux) Linux RAID md 0.9/1.0/1.1/1.2 RAID 1: mirroring (зеркальный рейд) RAID 4: striped array with parity device RAID 5: striped array with distributed parity information RAID 6: striped array with distributed dual redundancy information Linux Swap (versions 1 and 2) LVM and LVM2, Linux Logical Volume Manager Mac partition map Novell Storage Services NSS NTFS ( Windows NT/2000/XP/2003/Vista/2008 ) ReiserFS 3.5, 3.6 and 4 Sun Solaris i386 disklabel Unix File System UFS and UFS2 (Sun/BSD/...) XFS, SGI's Journaled File System Документация Как получить TestDisk Загрузка - Бинарные исполняемые и файлы исходных текстов доступны под DOS, Win32, MacOSX и Linux. TestDisk компиляция - Инструкция по сборке TestDisk и PhotoRec. TestDisk and Live rescue cd - Перечень дистрибутивов, в которые включен TestDisk. Работа со специфическими носителями Восстановление с поврежденных жестких дисков. (с плохими секторами (блоками)) Работа с файлом-образом жесткого диска. Работа со сменными носителями (Floppy/CD/DVD) Использование TestDisk Специфика использования под разными операционными системами. TestDisk Шаг за шагом Запуск TestDisk Примеры восстановлений Пример работы под Ubuntu Запуск скриптов Поддержка После использования TestDisk Технические примечания Таблица разделов Intel Microsoft Fdisk SMART monitoring Norton GoBack Текущие ограничения Как помочь TestDisk & PhotoRec в новостях Команда Для восстановления потерянных картинок или файлов из цифровых камер или жестких дисков, используйте PhotoRec. Домашняя страница TestDisk: https://www.cgsecurity.org. Christophe GRENIER grenier@cgsecurity.org Retrieved from "https://www.cgsecurity.org/mw/index.php?title=TestDisk_RU&oldid=8999" Category: Data Recovery'''
