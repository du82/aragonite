["https://www.cgsecurity.org/Articles/sotm22/index.html"]
title = "Scan of the Month 22 Analyse par Christophe GRENIER"
full_description = "Cet article est issu de l'analyse réalisée pour le Scan of the Month du projet Honeynet du mois d'août Scan22. Après avoir pénétrer sur un système Linux sous RedHat 6.2 non patché via la vulnérabilité WU-FTPD, le pirate a installé une backdoor et l'a utilisée pour diverses activités. J'ai participé à l'analyse de ce binaire lors du reverse challenge pour comprendre son fonctionnement. Ce mois-ci le but est de déterminer ce qui a été réalisé par le pirate en utilisant un fichier binaire de capture produit par Snort. L'adresse IP de l'Honeypot est 172.16.183.2. En premier, il faut télécharger le fichier de log et calculer sa somme de contrôle MD5 pour vérifier son intégrité. En tant que simple utilisateur, exécutons ethereal et chargeons le fichier de log. D'après le menu Tools/Summary, le fichier est au format libpcap, le format utilisé par tcpdump, ethereal, snort... Nous pouvons constater que la première trame est arrivée le 12 avril 2002 à 15:45:02 et la dernière date du 13 avril à 02:23:05. Attention, mon ordinateur est à l'heure locale Europe/Paris, soit GMT+2. Il y a trois adresses MAC distinctes au niveau ethernet. Elles commencent toutes par 00:50:56, or d'après la liste des codes constructeurs venant avec Ethereal, fichier /etc/ethereal/manuf, ce code est attribué à VMWare. Le Honeypot fonctionne dans une machine virtuelle comme expliqué sur http://old.honeynet.org/reverse/results/project/index.html. L'adresse MAC 00:50:56:01:00:00 est utilisé pour les machines autres que 172.16.183.2 et 172.16.183.8 comme 94.0.146.98, elle correspond à l'adresse MAC de la passerelle Internet. Les paquets avec les adresses IP 10.10.10.10 et 11.11.11.11 portent des checksums incorrects au niveau des entêtes IP, des entêtes TCP... Les adresses ont été sommairement altérées au niveau IP du fichier de capture dans l'idée de protéger l'identité réelle des serveurs. Par la suite, la véritable adresse IP de l'un de ces serveurs sera retrouvée."
year_published = 2025
clearnet = "https://www.cgsecurity.org/Articles/sotm22/index.html"
