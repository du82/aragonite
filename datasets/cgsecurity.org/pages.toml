["https://www.cgsecurity.org/Articles/SecProg/Art4/index-fr.html"]
title = """
Éviter les failles de sécurité dès le développement d'une
application - 4 : les chaînes de format"""
full_description = '''La plupart des failles de sécurité ont souvent une même cause : la paresse. La règle n'est pas mises en défaut dans le cas des bogues de format. Très souvent, dans un programme, il est nécessaire d'écrire une chaîne de caractères (le "lieu" de l'écriture n'est pas important, il peut tout aussi bien s'agir d'un fichier que de la sortie standard). Une simple instruction suffit : Par ce souci d'économie, ce programmeur vient d'ouvrir une faille potentielle dans son oeuvre. Il s'est contenté de passer comme argument une chaîne de caractères, qu'il voulait de toute façon afficher sans aucune modification. Pourtant, cette chaîne sera balayée à la recherche de directives de formatage (%d, %g, ...). Lorsqu'un tel caractère de format est découvert, l'argument correspondant est recherché dans la pile. Nous commencerons par quelques rappels sur les fonctions de type printf(), mais nous aborderons également des aspects moins connus de ces routines. Ensuite, nous verrons comment obtenir les informations nécessaires à l'exploitation d'une telle faille. Enfin, nous rassemblerons tout ceci dans le cadre d'un exemple simple. Commençons par ce que nous avons tous appris dans nos manuels de programmation : la plupart des fonctions de lecture/écriture du langage C utilisent un mécanisme de formatage des données, c'est-à-dire qu'outre la valeur à lire ou écrire, il faut également préciser comment l'écrire. Le programme suivant illustre ceci simplement : Ceci ne constitue en rien une révolution et reste conforme avec de nombreuses fonctions qui utilisent un prototypage similaire à celui de la fonction printf() : La plupart de nos cours de programmation s'arrêtent ici, en précisant une liste non exhaustive de formatages possibles (%g, %h, %x, l'utilisation du caractère . pour indiquer la précision...) Mais il est un formatage souvent passer sous silence :%n. Voici ce qu'en dit la page man de la fonction printf() : Il faut bien comprendre ce que cela signifie : cet argument permet d'écrire dans une variable de type pointeur, même lorsqu'il est utilisé dans une fonction d'affichage !'''
year_published = 2025
clearnet = "https://www.cgsecurity.org/Articles/SecProg/Art4/index-fr.html"
tags = ["affichage", "application", "autre", "bogues", "chaînes", "comment", "compilateur", "conclusion", "d'où", "d'un"]
language = "en"
internal-references = ["none"]
external-references = ["almalinux.org", "chronodisk-recuperation-de-donnees.fr", "cleverfiles.com", "deadhardrive.com", "dell.com", "git.cgsecurity.org", "gnulinuxmag.com", "guardent.com", "honeynet.org", "lamagra.sekure.de", "mailman.global-sp.net", "miscmag.com", "ophcrack.sourceforge.net", "phrack.com", "policies.google.com", "repo.hackerzvoice.net", "s-data.fr", "securityfocus.com", "tuxera.com", "w00w00.org"]

