full_description = '''Formate fișiere recupereate PhotoRec From CGSecurity Jump to navigation Jump to search English Deutsch Español Français Italiano Română PhotoRec este un utlitar de recuperat fișiere șterse. Caută fișierele șterse în funcție de semnătura lor (header) și le recuperează pentru că de obicei acestea nu stunt șterse definitiv (suprascrise). Se pot recupera fișiere întregi, nefragmentate, sau fișiere care sunt foarte puțin fragmentate (lipsesc unele părți din ele pentru că sectoarele respective au fost suprascrise). PhotoRec recunoaște și poate recupera numeroase formate de fișiere, printre care (Nota traducătorului - În majoritatea cazurilor am păstrat denumirile originale ale tipurilor de fișiere pentru a nu crea confuzii; având în vedere că majoritatea sunt fișiere specifice aplicațiilor respective, am considerat că cititorul va ști ce tip de fișiere este fără o traducere amănunțită a lor/ În plus, denumirile în original stau și la baza extensiei fișierului respectiv.) Contents 1 Fișiere-arhivă 2 Multimedia 3 Suite de birou 4 Altele Fișiere-arhivă .7z 7-Zip archive file .a Unix/Linux archive .ace ACE Archive .apk Android Package Kit .arj Archive .bkf MS Backup file .bz2 bzip2 compressed data .cab MS cabinet archive .dar dar3 archive .deb Debian Archive (Same familly than .a Unix/Linux archive) .dump Dump/Restore Archive .ghx Grasshopper archive .gz gzip compressed data .lzh lzh/LArc archive .lzo LZO archive .par2 archive .rar Rar archive .rpm RPM package .stu StuffIt Archive .tar tar archive .tar.gz compressed tar archive .vbm Veeam Backup Metadata .wim Windows imaging (WIM) image .xar xar archive .xz xz Archive .zip zip archive Multimedia .3ds max .3dm Rhino / openNURBS .3g2 Video for 3G mobile phone (CDMA) .3gp Video for 3G mobile phone (GSM) .abr Adobe Brush .acb Adobe Color Book .ado Adobe Duotone Options .aep After Effects .afdesign afdesign .aif Apple Audio .albm HP Photosmart Photo Printing Album .all Cubase Song format .als Ableton Live Set