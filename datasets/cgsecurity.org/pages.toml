["https://www.cgsecurity.org/Articles/fingerprinting.html"]
title = "OS fingerprinting"
full_description = "L'OSfingerprinting est l'art d'identifier le système d'exploitation d'un serveur distant. En pratique, cette étape fait souvent suite à un scan de port. Bien que les communications TCP/IP fassent l'objet de normes, les implémentations de ces protocoles sont différentes selon les OS. Découvrons ces différentes techniques permettant de distinguer les différents systèmes d'exploitations. Quelqu'un interroge ma machine! De qui s'agit-il ? Les techniques passives d'OSfingerprinting sont là pour répondre à cette question. Il s'agit d'analyser les paquets reçus pour identifier le système à l'origine de la communication. Les techniques passives sont utilisées par les administrateurs pour glaner un maximum d'information sur les attaquants. Pour vérifier si une adresse IP est utilisée ou si le serveur fonctionne bien, il est courant d'utiliser la commande ping pour vérifier son état. Cette commande envoie un paquet ICMP echo-request et attend en réponse un ICMP echo-reply. La demande echo-request à la forme suivante: La partie Data peut contenir n'importe quelle donnée. Voici l'affichage d'un ping depuis un Linux avec en bleu la partie Data. Le contenu des paquets est différent, c'est un moyen facile pour distinguer les ping Unix des ping Windows. Le système de détection d'intrusion Snort, http://www.snort.org, disponible aussi bien sous Linux que sous Windows, est capable de distinguer les signatures des Ping produits par de nombreux OS. Une connexion TCP débute par l'envoi d'un paquet TCP avec l'indicateur SYN. p0f, http://www.stearns.org/p0f/, va étudier ces paquets pour déterminer le système d'exploitation. Etudions concrètement la capture d'un de ces paquets avec tcpdump, www.tcpdump.org, ou windump, http://windump.polito.it/, pour la version Windows. Dans la syntaxe p0f, ces données s'écrivent sous la forme win:TTL:MSS:DF:wscale:sackOK:nop:taille, soit dans notre cas 5840:64:1460:1:0:1:1:60. D'après la base de connaissance de p0f, cette signature correspond à un Linux 2.4. Heureusement pour nous, p0f fait ces rapprochements tout seul comme un grand:"
year_published = 2025
clearnet = "https://www.cgsecurity.org/Articles/fingerprinting.html"
tags = ["actives", "analyse", "checksum", "connexion", "d'id", "d'un", "d'une", "demande", "error", "icmp"]
