["https://www.cgsecurity.org/Articles/mysql.html"]
title = "Sécurisation d'un serveur Mysql"
full_description = '''Mysql est la base de données Open Source la plus répandue. Cet article vous présente les techniques de base pour sécuriser votre serveur Mysql. Au lieu du classique login/password, Mysql gère un triplet login/password/source pour authentifier les utilisateurs. Ainsi, un utilisateur peut posséder un mot de passe différent selon son adresse de connection. Lors de son installation, Mysql crée deux comptes administrateurs de login root qui peuvent se connecter depuis localhost ou depuis le nom renvoyé par hostname. Ces comptes sont sans mot de passe. On a donc : HostUserPassword localhostroot christophe.global-secure.frroot Un utilisateur peut avoir des privilèges s'appliquant à la totalité du système de base de données ou bien des privilèges sur certaines bases ou tables de la base. Seuls les comptes administrateurs doivent avoir des droits sur la totalité de la base. De manière générale, ces comptes doivent être réservés aux tâches d'administration :: création/suppression d'utilisateurs, de bases. Pour créer un compte utilisateur pipo, pouvant se connecter de n'importe où, avec le droit d'effectuer diverses commandes sur la base pipodb (Utiliser CREATE DATABASE pipo pour créer la base), il suffit d'utiliser la commande GRANT SELECT,INSERT,UPDATE,DELETE,CREATE,ALTER,DROP ON pipodb.* TO pipo@"%" IDENTIFIED BY "pwd"; Dans la mesure du possible, je conseille d'utiliser trois comptes par projet : un avec le droit SELECT pour les opérations de lecture, un autre avec les droits supplémentaires INSERT, UPDATE, DELETE pour réaliser les opérations d'écriture, et un dernier ayant aussi les privilèges CREATE, ALTER, DROP pour intervenir sur la structure des tables. A l'aide de la commande SHOW DATABASES, un utilisateur obtient la liste de toutes les bases de données du serveur. Si on est parano, il est possible de désactiver cette commande, mais il est plus raisonnable de n'autoriser à lister que les bases sur lequel l'utilisateur a des droits. Dans le fichier /etc/my.cnf, section mysqld, ajouter safe-show-database.'''
year_published = 2025
clearnet = "https://www.cgsecurity.org/Articles/mysql.html"
