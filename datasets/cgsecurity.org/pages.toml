["https://cgsecurity.org/wiki/TestDisk_IT"]
title = "TestDisk IT - CGSecurity"
description = "TestDisk e' un software OpenSource ed e' rilasciato sotto i termini della GNU General Public License (GPL v2+). TestDisk e' un poderoso software libero per il recupero..."
full_description = '''TestDisk IT From CGSecurity Jump to navigation Jump to search English 中文 Deutsch Español Français Magyar فارسی Italiano Japanese 한국어 Nederlands Polski Português Русский Türkçe Latest stable version 7.2 February 22, 2024 TestDisk, Data Recovery TestDisk e' un software OpenSource ed e' rilasciato sotto i termini della GNU General Public License (GPL v2+). TestDisk e' un poderoso software libero per il recupero dati! E' stato principalmente progettato per aiutare il recupero delle partizioni perse e/o rendere nuovamente avviabili i dischi quando questi sintomi sono causati da software malfunzionanti, alcuni tipi di virus o errori umani (come cancellare accidentalmente una Tavola di Partizione.) Recuperare una Tavola di partizione con TestDisk e' estremamente facile. TestDisk puo' Riparare la tavola di partizione, recuperando partizioni cancellate Recuperare il settore di avvio di una partizione FAT32 dal suo backup Ricostruire il settore di avvio di una partizione FAT12/FAT16/FAT32 Riparare la tabella FAT Ricostruire il settore di avvio di una partizione NTFS Recuperare il settore di avvio di una partizione NTFS dal suo backup Riparare l'MFT da una copia mirror MFT Localizzare la copia del SuperBlock di una partizione ext2/ext3/ext4 Recuperare file cancellati da un filesystem FAT, NTFS e ext2 Copiare file cancellati da una partizione FAT, NTFS e ext2/ext3/ext4. TestDisk ha caratteristiche sia per l'utente esperto, sia per quello alle prime armi. Per coloro che sanno poco o nulla delle tecniche di recupero dati, TestDisk puo' essere usato per raccogliere informazioni detttagliate circa un disco non di avvio, che possono essere inviate a un tecnico per una analisi piu' approfondita. Coloro con maggiore familiarita' con queste procedure, troveranno in TestDisk un valido strumento per il recupero dati. Sistemi operativi TestDisk puo' funzionare sotto DOS (sia in modalita' reale, sia in una finestra dos in Windows 9x), Windows (NT4, 2000, XP, 2003, Vista), Linux, FreeBSD, NetBSD, OpenBSD, SunOS e MacOS I file sorgenti e i binari eseguibili precompilati sono disponibili per DOS, Win32, MacOSX e Linux dalla pagina di download Filesystems TestDisk può trovare partizioni perse su ognuno di questi file systems: BeFS ( BeOS ) BSD disklabel ( FreeBSD/OpenBSD/NetBSD ) CramFS, Compressed File System DOS/Windows FAT12, FAT16 e FAT32 Windows exFAT HFS, HFS+ and HFSX, Hierarchical File System JFS, IBM's Journaled File System Linux ext2, ext3 e ext4 Linux LUKS (partizioni criptate) Linux RAID md 0.9/1.0/1.1/1.2 RAID 1: mirroring RAID 4: striped array with parity device RAID 5: striped array with distributed parity information RAID 6: striped array with distributed dual redundancy information Linux Swap (versions 1 and 2) LVM e LVM2, Linux Logical Volume Manager Mac partition map Novell Storage Services NSS NTFS ( Windows NT/2000/XP/2003/Vista/2008 ) ReiserFS 3.5, 3.6 e 4 Sun Solaris i386 disklabel Unix File System UFS e UFS2 (Sun/BSD/...) XFS, SGI's Journaled File System Documentazione Come ottenere TestDisk Download - Eseguibili e file sorgenti sono disponibili per DOS, Win32, MacOSX e Linux. TestDisk compilation TestDisk e Live rescue cd Lavorare con media particolari Recupero dischi rigidi cancellati (settori difettosi) Disk image CD-R/CR-RW/DVD... Uso di TestDisk Note specifiche circa il sistema operativo TestDisk Passo per passo Funzionamento di TestDisk Esempi di recupero Funzionamento in Script Supporto TestDisk dopo l'uso Note tecniche Intel Partition Table Microsoft Fdisk Monitoraggio SMART Norton GoBack Current Limitations How to Novita' TestDisk & PhotoRec TestDisk Team Per recuperare foto perse o file dalle fotocamere digitali o dai dischi rigidi, usare il comando PhotoRec. TestDisk home: https://www.cgsecurity.org. Christophe GRENIER grenier@cgsecurity.org Retrieved from "https://www.cgsecurity.org/mw/index.php?title=TestDisk_IT&oldid=8649" Category: Data Recovery'''
