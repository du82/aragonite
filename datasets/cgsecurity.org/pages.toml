["https://cgsecurity.org/wiki/TestDisk_ES"]
title = "TestDisk ES - CGSecurity"
description = "TestDisk es un software OpenSource y está bajo licencia Licencia Pública General GNU  (GPL v2+). ¡TestDisk es un poderoso software gratuito de recuperación de datos..."
full_description = '''TestDisk ES From CGSecurity Jump to navigation Jump to search English 中文 Deutsch Español Français Magyar فارسی Italiano Japanese 한국어 Nederlands Polski Português Русский Türkçe Latest stable version 7.2 February 22, 2024 TestDisk, Data Recovery TestDisk es un software OpenSource y está bajo licencia Licencia Pública General GNU (GPL v2+). ¡TestDisk es un poderoso software gratuito de recuperación de datos! Fue principalmente diseñado para ayudar a recuperar particiones perdidas y/o volver discos no booteables a booteables nuevamente cuando estos síntomas son causados por software con fallas, ciertos tipos de virus o error humano (como borrar accidentalmente su Tabla de Particiones). La recuperación de la Tabla de Particiones usando TestDisk es realmente fácil. TestDisk puede Arreglar la Tabla de Particiones, recuperar particiones eliminadas Recuperar sectores de arranque FAT32 de su copia de seguridad Reconstruir sectores de arranque FAT12/FAT16/FAT32 Arreglar tablas de arranque de tipo FAT Reconstruir sectores de arranque NTFS Recuperar sectores de arranque NTFS de su copia de seguridad Arreglas la MFT usando la MFT imagen Localizar el Superblock de copia de seguridad de ext2/ext3/ext4 Recuperar archivos del sistema de archivos FAT, NTFS y ext2 Copiar archivos de particiones FAT, NTFS y ext2/ext3/ext4 eliminadas TestDisk tiene características para expertos y principiantes. Para aquellos que saben poco o nada sobre técnicas de recuperación de datos, TestDisk puede ser usado para recolectar información detallada sobre un disco que no se inicia o arranca, la cual después puede ser enviada a un técnico para mayor análisis. Aquellos más familiarizados con dichos procedimientos pueden encontrar en TestDisk una herramienta útil para realizar recuperación de datos in situ. Sistemas Operativos TestDisk puede ejecutarse en: DOS (real o en una ventana de Windows 9x), Windows (NT4, 2000, XP, 2003, Vista), Linux, FreeBSD, NetBSD, OpenBSD, SunOS y MacOS Los archivos fuente y los ejecutables binarios precompilados están disponibles para DOS, Win32, Mac OS X y Linux desde la página Descargar Sistemas de Archivos TestDisk puede encontrar particiones perdidas para todos estos sistemas de archivos: BeFS (BeOS) BSD disklabel (FreeBSD/OpenBSD/NetBSD) CramFS, Sistema de Archivos Comprimidos DOS/Windows FAT12, FAT16 y FAT32 Windows exFAT HFS and HFS+, Sistema de Archivos Jerárquicos JFS, IBM's Sistema Diario de Archivos(Journaled File System) Linux ext2, ext3 y ext4 Linux Raid RAID 1: espejos RAID 4: arreglos con dispositivo de paridad rayados RAID 5: arregloscon información de paridad distribuida rayados RAID 6: arreglos con información de dúo redundancia distribuida rayados Linux Swap (versiones 1 y 2) LVM y LVM2, Administración de Volumen Lógico de Linux Mapa de particiones Mac NSS Servicio de Almacenamiento Novell NTFS ( Windows NT/2K/XP/2003/Vista ) ReiserFS 3.5, 3.6 y 4 Sun Solaris i386 disklabel UFS y UFS2, Sistema de Archivos Unix (Sun/BSD/...) XFS, SGI's Sistema Diario de Archivos(Journaled File System) Documentación Cómo obtener TestDisk Descargar - Los Ejecutables Binarios y el Código Fuente están disponibles para: DOS, Win32, MacOSX y Linux. Compilación de TestDisk TestDisk y CD Live rescue Trabajando con medios especiales Recuperación de Discos rígidos dañados (sectores dañados) Imagen de Disco CD-R/CR-RW/DVD... Usando TestDisk Notas específicas de Sistemas Operativos TestDisk Paso A Paso para recuperar particiones perdidas y reparar sectores de arranque FAT/NTFS Ejecutando el programa de TestDisk Recuperar archivos y directorios de sistemas de archivos NTFS Recuperar archivos y directorios de sistemas de archivos FAT12, FAT16 y FAT32 Recuperar archivos y directorios de sistemas de archivos ext2 Ejemplos de Recuperación Ejecución con Scripts Soporte Luego de usar TestDisk Notas Técnicas Desarrolladores Cómo contribuir código a TestDisk & PhotoRec Tabla de particiones de Intel FDisk de Microsoft Monitoreo SMART Aplicación Norton GoBack Limitaciones Actuales Cómo ayudar TestDisk & PhotoRec en las Noticias Equipo TestDisk Para recuperar imágenes perdidas de archivos de cámaras digitales o discos rígidos, ejecutar el comando PhotoRec. TestDisk home: https://www.cgsecurity.org/. Christophe GRENIER grenier@cgsecurity.org Retrieved from "https://www.cgsecurity.org/mw/index.php?title=TestDisk_ES&oldid=8662" Category: Data Recovery'''
