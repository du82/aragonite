["https://www.cgsecurity.org/Articles/netfilter.html"]
title = "Netfilter: firewalling sous Linux 2.4"
full_description = "Le noyau 2.4 de Linux vient avec un nouveau code de filtrage très puissant. Celui-ci apporte plusieurs nouveautés dont Le plus sûr lorsque l'on conçoit un firewall est de tout interdire par défaut et d'autoriser explicitement. On accepte les connexions venant de l'interface lo (loopback). Si l'état de la connexion est invalide INVALID, on ignore le paquet. Si la connexion est établie ESTABLISHED ou assimilable à une connexion établie RELATED (cas, par exemple, du canal de donnée dans une communication FTP). Toute communication TCP doit commencer par un paquet comportant le flag SYN et uniquement celui-ci, si ce n'est pas le cas, on rejette la connexion. Enfin, on trie les connexions entrantes selon les interfaces. Il peut être intéressant d'enregistrer les tentatives de connexion à votre machine, les scans de ports. Mais attention, si tous les ports scannés sont enregistrés, le serveur risque de saturer aussi bien en performance CPU aussi bien qu'en espace disque. Pour enregistrer les scans de ports TCP furtifs avec un maximum de trois par secondes, il suffit d'ajouter la ligne suivante avant la règle rejetant le paquet. Pour l'exemple, je vais considérer que la DMZ contient un relais de messagerie en 192.168.1.1, un serveur web 192.168.1.2 et un cache Internet 192.168.1.3 sur le port 3128. Le serveur de messagerie interne est en 10.0.0.1. Depuis Internet, seuls les serveurs de messagerie et le serveur web sont joignables. Votre réseau interne et la DMZ ne peuvent communiquer directement avec Internet. Les serveurs sur lesquels vous vous connectez ne pourront vous répondre que si la source des paquets est une adresse publique. C'est là que le masquerading intervient, chaque paquet émis vers Internet va utiliser l'adresse de votre interface de sortie. Il pourrait y avoir un hic. Vous n'avez qu'une seule adresse IP et deux serveurs doivent être accessible: le serveur web et la passerelle Internet. La translation d'adresse va venir à vous rescousse, on va rediriger les ports concernés vers les bonnes destinations."
year_published = 2025
clearnet = "https://www.cgsecurity.org/Articles/netfilter.html"
