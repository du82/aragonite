["https://cgsecurity.org/wiki/TestDisk_NL"]
title = "TestDisk NL - CGSecurity"
description = "TestDisk is Open-Source software en is gelicenseerd onder de voorwaarden van de GNU General Public License (GPL v2+). TestDisk is krachtige vrije data-recovery software..."
full_description = '''TestDisk NL From CGSecurity Jump to navigation Jump to search English 中文 Deutsch Español Français Magyar فارسی Italiano Japanese 한국어 Nederlands Polski Português Русский Türkçe Latest stable version 7.2 February 22, 2024 TestDisk, Data Recovery TestDisk is Open-Source software en is gelicenseerd onder de voorwaarden van de GNU General Public License (GPL v2+). TestDisk is krachtige vrije data-recovery software! Het is oorspronkelijk ontworpen om verloren gegane partities terug te halen en/of niet-bootende schijven weer bootend to maken indien deze symptomen door software-fouten, bepaalde soorten virussen of menselijke fouten (zoals per ongeluk een partitie-tabel te wissen) zijn ontstaan. Het terughalen van een partitie-tabel is heel gemakkelijk met TestDisk. TestDisk kan Partitie-tabellen repareren, gewiste partities terugbrengen een FAT32-bootsector vanuit zijn eigen backup terughalen een FAT12/FAT16/FAT32-bootsector herbouwen FAT-tabellen repareren een NTFS-bootsector herbouwen een NTFS-bootsector vanuit zijn eigen backup terughalen een MFT repareren door MFT mirror te gebruiken een ext2/ext3/ext4 Backup SuperBlock lokaliseren Gewiste bestanden op FAT, exFAT, NTFS en ext2 filesystem terughalen Bestanden van gewiste FAT, exFAT, NTFS en ext2/ext3/ext4 partities kopiëren TestDisk biedt opties voor zowel beginners als experts. Voor diegenen die weinig tot niets weten over datarecovery-technieken, kan TestDisk gebruikt worden om gedetailleerde informatie over een niet-bootende schijf te verzamelen, waarna deze vervolgens aan een specialist doorgestuurd kan worden, voor verdere analyse. Diegene die meer bekend is met de procedures, vindt in TestDisk uitstekend gereedschap voor het uitvoeren van on-site data-recovery. Besturingssystemen TestDisk werkt onder DOS (zowel echt, als in een Windows 9x DOS-box), Windows (NT4, 2000, XP, 2003, Vista, 2008, Windows 7 (x86 & x64), Linux, FreeBSD, NetBSD, OpenBSD, SunOS, Solaris, OpenSolaris, en MacOS X Download binair uitvoerbare versies voor DOS, Win32, MacOSX en Linux, en bronbestanden. Documentatie TestDisk Stap-voor-Stap om verloren gegane partities terug te halen, en beschadigde FAT/NTFS boot-sectoren te repareren. TestDisk en Live-rescue-cd TestDisk compilatie. Ontwikkelaars zijn welkom om aan TestDisk & PhotoRec te ontwikkelen. Het terughalen van gewiste bestanden Terughalen van gewiste bestanden vanaf NTFS partities Het terughalen van bestanden en mappen vanaf FAT12, FAT16, FAT32 en exFAT bestandssystemen. FAT-bestandssystemen worden vooral aangetroffen bij flash-geheugenkaaren, digitale camera's, en vele andere draagbare apparaten. Terughalen van gewiste bestanden vanaf ext2 bestandssystemen Voorbeelden terughalen data Forensische zelf-training met TestDisk & PhotoRec Het gebruik van het TestDisk-programma , een menu-voor-menu uitleg TestDisk FAQ Ondersteuning TestDisk & PhotoRec in het nieuws TestDisk Team Om verloren afbeeldingen of andere bestanden vanaf digitale camera of harde schijf terug te halen, gebruik het PhotoRec commando. Bestandssystemen TestDisk kan verloren gegane partities voor alle volgende bestandssystemen terughalen: BeFS ( BeOS ) BSD disklabel ( FreeBSD/OpenBSD/NetBSD ) CramFS, Compressed File System DOS/Windows FAT12, FAT16 eb FAT32 XBox FATX Windows exFAT HFS, HFS+ en HFSX, Hierarchical File System JFS, IBM's Journaled File System Linux btrfs Linux ext2, ext3 en ext4 Linux GFS2 Linux LUKS encrypted partition Linux RAID md 0.9/1.0/1.1/1.2 RAID 1: mirroring RAID 4: striped array met parity device RAID 5: striped array met distributed parity information RAID 6: striped array met distributed dual redundancy information Linux Swap (versions 1 en 2) LVM and LVM2, Linux Logical Volume Manager Mac partition map Novell Storage Services NSS NTFS ( Windows NT/2000/XP/2003/Vista/2008/7 ) ReiserFS 3.5, 3.6 en 4 Sun Solaris i386 disklabel Unix File System UFS en UFS2 (Sun/BSD/...) XFS, SGI's Journaled File System Wii WBFS Sun ZFS TestDisk home: https://www.cgsecurity.org/wiki/TestDisk. TestDisk forum: https://forum.cgsecurity.org Retrieved from "https://www.cgsecurity.org/mw/index.php?title=TestDisk_NL&oldid=8776" Category: Data Recovery'''
