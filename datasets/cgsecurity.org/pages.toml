["https://www.cgsecurity.org/Articles/nt_password.html"]
title = "Mots de passe locaux de Windows NT"
full_description = "Comment Windows stocke-t-il les mots de passe ? Vous avez peut-être déjà eu besoin de retrouver un mot de passe perdu, celui du compte Administrateur par exemple, ou bien un ami a utilisé votre PC pour apprendre comment changer un mot de passe et l'a oublié juste après. Pour être crypté, le mot de passe est mis en majuscules et complété par des zéros s'il faisait moins de quatorze caractères. Ensuite, la chaîne 0x4B,0x47,0x53,0x21,0x40,0x23,0x24,0x25 est cryptée avec les sept premiers caractères du mot de passe par du DES pour former la première partie du mot de passe crypté. De manière indépendante, cette même chaîne est chiffrée avec les sept caractères suivants pour former la seconde partie du mot de passe. Le DES, Data Encryption Standard, est un algorithme de chiffrage par bloc datant des années 70 fonctionnant avec une clé de 56 bits. Il a déjà fait l'objet d'une présentation dans un précédent Pirate Mag. Le mot de passe est convertit sous forme Unicode, représentation universelle des caractères. En fait, comme les caractères correspondent à de l'ASCII, cela revient à ajouter un caractère nul derrière chaque caractère. Puis, la forme Unicode est crypté avec l'algorithme MD4, Message Digest 4 de la société RSA. En fait, le DES fait pour crypter et décrypter des messages tandis que MD4 a été conçu pour produire des empreintes de messages. Si la forme LANMAN du mot de passe a été cassé, il ne reste plus qu'à découvrir la casse (majuscule/minuscule) du mot de passe d'origine. Ainsi en cryptant les différentes variations sur la casse du mot de passe LANMAN, le mot de passe original est rapidement retrouvé. Par exemple, si le mot de passe LANMAN est TOTO123, il suffit de tester les seize possibilités suivantes pour retrouver le mot de passe NTLM: toto123, totO123, toTo123, toTO123, tOto123, tOtO123, tOTo123, tOTO123 Toto123, TotO123, ToTo123, ToTO123, TOto123, TOtO123, TOTo123, TOTO123 Une attaque directe du mot de passe NTLM est difficilement réalisable en temps de calcul. Cependant, comme dans le cas du mot de passe LANMAN, s'attaquer à un millier de compte ou à un seul ne demande pas plus de ressource."
year_published = 2025
clearnet = "https://www.cgsecurity.org/Articles/nt_password.html"
