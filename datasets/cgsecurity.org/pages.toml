title = "In The News - CGSecurity"
description = "TestDisk and PhotoRec got some reviews on the Net. They are also cited in various data recovery stories.   2023 In the video J'ai été contacté par la DGSE, Micode..."
full_description = '''In The News From CGSecurity Jump to navigation Jump to search English Deutsch Español Français TestDisk and PhotoRec got some reviews on the Net. They are also cited in various data recovery stories. 2023 In the video J'ai été contacté par la DGSE, Micode interviews 2 DGSE agents. During a demonstration (~14:15), TestDisk is used to recover deleted files. 2016 TestDisk et PhotoRec pour la récupération de données By Laurent Delmas, Linux Pratique n°98, Nov/Dec 2016, ISSN 0183-0872 State of Tennessee v. Edythe Christie, W2015-02485-CCA-R3-CD (Tenn. Crim. App. 2016) "Officer Jay Stanfill processed the cell phone using Photorec recovery software, a computer program designed to recover deleted files, and discovered five photographs and a video that had been deleted from the phone." https://www.courtlistener.com/opinion/4335391/state-of-tennessee-v-edythe-christie/ 2015 How to Recover Deleted Files Using Testdisk by Jared Palmer, Apr 20, 2015 iX 03/2015 https://shop.heise.de/katalog/restaurator-e5e3d7 Restaurator - Partitionen retten mit TestDisk https://www.heise.de/ix/heft/Restaurator-2556789.html By Thomas Drilling, iX 3/2015 Forensic Corner: PhotoRec, Récupération de données By Christophe Grenier Misc n°78 mars-avril 2015, ISSN 1631-9036 Texts to Elaine O’Hara tell of sender getting ‘fit for murder’ By Fiona Gartland, Colin Gleeson, 19/2/2015 Det Sgt Browne said he used software Photorec to “carve out” the files he was looking for from the unallocated space. The files recovered were SqLite, a format used for text messages. 2014 PhotoRec: Undelete Mac Files for Free By Ben Lam, December 23, 2014 Cell Phone Investigations: Search Warrants, Cell Sites and Evidence Recovery By Aaron Edens, December 4, 2014 <amazon>163180006X</amazon> NIST CFTT - Forensic File Carving Graphic File Carving: PhotoRec 7.0-WIP and X-Ways Forensics v17.6 (July 2014) gives better results in L0_nopadding, L1_padded and L2_frag_in_order tests than all other tested tools: R-Studio v6.2, Recover My Files v5.2.1, EnCase Forensic v7.09.05, Adroit Photo Forensics 2013 v3.1d, FTK v4.1, EnCase Forensic v6.18.0.59 and Scalpel v2.0 If your goal is only to recover fragmented jpg, enable the option brute-force mode in PhotoRec, it hasn't been used during NIST tests. Adroit Photo Forensics also get some good results. Video File Carving: PhotoRec 7.0-WIP gives betters results than all other tested tools Defraser v1.3, Encase v7.09.05, iLook v.2.2.7, R-Studio v6.2, Recover My Files v5.2.1, Scalpel v2.0 and X-Ways v17.6 in the tests T1_no_padding, T2 cluster padded, T3 Frag in order, T4 Incomplete. All in one document to compare things. IMYO you should not add the results of each test when comparing tools: identify the expected data layout: padding was present or not, files were fragmented or not, fragments were in order or not... consider only this case: use the correct tools for the job 2013 Performance Analysis of File Carving Tools By Thomas Laurenson. Lech J. Janczewski; Henry B. Wolfe; Sujeet Shenoi.28th Security and Privacy Protection in Information Processing Systems (SEC), Jul 2013, Auckland, New Zealand. Springer, IFIP Advances in Information and Communication Technology, AICT-405, pp.419-433, 2013, Security and Privacy Protection in Information Processing Systems. <10.1007/978-3-642-39218-4_31>. <hal-01463843> Nosy Mom's Guide Recovering Deleted Files: Getting Your Important Pictures, Files, and Other Documents Back From Your Camera, Computer, and Phone By Elizabeth Peterson, 6 September 2013 <amazon>1492356379</amazon> How To Recover Video Footage That Was Deleted By The Police Posted by Sierra Adamson on May 1, 2013 Alex was arrested for merely filming the police in Miami, the police later illegally deleted the footage from Alex’s camera and charged him with resisting arrest. Alex recovered the video using PhotoRec. Protéger les données stockées sur votre Machine By Fred Scali-West Linux Essentiel n°23 juin-juillet 2013, ISSN 1969-2463 Effacer n'est pas jouer! Ce que vous supprimez ne disparaît pas! By C.G.B. Spender Linux Essentiel n°23 juin-juillet 2013, ISSN 1969-2463 2012 The best free data recovery tool: 14 undelete tools compared By Samer Kurdi on October 3, 2012 PhotoRec was the only program tested that was able to identify AND recover files from the corrupt hide drive we tested it with. It also recovered files from both FAT and NTFS with a very high recovery ratio, even if not the highest. Data Recovery: Finding VHD Files By Nathan Riley, 2012/05/16 6 data recovery tools for SD cards, USB drives and more By Serdar Yegulalp, 2012/03/06: As a result, I recommend PhotoRec for tech-savvy users. Data Recovery on the Arri Alexa By Alex Wagner, 2012/02/09 PhotoRec can recover lost data from the SxS Pro cards to which the Arri Alexa records after A Quick Format. 2011 A holiday miracle, thanks to PhotoRec By Andrew Currie, 2011/01/03 Digital Forensics with Open Source Tools. Syngress. ISBN: 978-159749-586-8. By Cory Altheide, Harlan Carvey (2011) <amazon>1597495867</amazon> 2010 Les cybercafés sont mal sécurisés selon des experts By Philippe Richard, 2010/11/29 - PhotoRec has been used to recover confidential data from Cybercafe DON’T PANIC–CGSecurity.org and TESTDISK save the day By Sean Kearney on 2010/11/21 PhotoRecで大切な写真が復活したお話 By Daisuke Tanaka, 2010/11/08 Recovering a lost partition table By Julie Pichon, 2010/10/30 Hay vida después de dar formato por error By Ariel Torres, 2010/08/20 PhotoRec && MPEG-2 TS(4GB over) 2010/02/08 Computer Forensics: A Pocket Guide, p. 67. IT Governance Publishing. ISBN 978-1-84928-039-6. Nathan Clarke (2010) <amazon>1849280398</amazon> 2009 A Linux Live CD to the Rescue! By Scott Nesbitt, 2009/08/02 Recover deleted files from a jailbroke iPhone (or *nix) By Troy Ingram, 2009/07/12 Gelöschte Fotos von einer Speicherkarte wiederherstellen By Janek Thomaschewski, 2009/03/28 Come usare PhotoRec per recuperare dati By Yuri Carlenzoli, 2009/03/22 Appunti raminghi Linux: Recuperare le foto cancellate da una memory card By eineki, 2009/03/05 Recuperar Archivos borrados de tu Computador,Camara Digital,Pen Drive,Telefonos y mas. By foxcarlos, 2009/03/01 PC ER: How-To Recover Photos/Videos/Data from a Damaged SD Card 2009/01/05 Computer Forensics: Investigating Hard Disks, File and Operating Systems. ISBN 978-1-43548-350-7. EC-Council (2009) <amazon>1435483502</amazon> 2008 Recovering Photos from a Corrupt Memory Card with PhotoRec By Jeffrey Friedl, 2008/12/03 Beratung: Datenrettung mit „TestDisk“ By Fiona Meg Riessler, 2008/12/01 Recuperare le foto cancellate dalla fotocamera By Salvatore Aranzulla, 2008/11/04 Daten retten mit Photo Rec By Stephan Wiesend, 2008/09/16 Recovering Data from a Hard Drive with Bad Sectors By Paul Salmon, 2008/09/03 Recovering files encrypted by Virus.Win32.Gpcode.ak using PhotoRec Kaspersky Lab, 2008/06/04: After encrypting files, the virus deletes the original but PhotoRec can recover it. TestDisk: recupera particiones, MFT, MBR, datos perdidos, … By Dale Al Teclado, 2008/02/11 Gelöschte Bilder retten - kostenlos By Carsten Knobloch, 2008/01/10 Malware Forensics: Investigating and Analyzing Malicious Code, p. xxviii. Syngress Publishing Inc. ISBN 978-1-59749-268-3. Cameron H. Malin, Eoghan Casey, James M. Aquilina (2008). <amazon>159749268X</amazon> Upgrading and Repairing Microsoft Windows, Second Edition, page 685. Pearson Education Inc. ISBN 978-0-7897-3695-6. Scott Mueller, Brian Knittel (2008). <amazon>0789736950</amazon> 2007 Easy Flash Drive Data Recovery with PhotoRec Author: Kent Brewster Data Recovery With TestDisk HowTo Author: Falko Timme Recover files from a flash memory card Source: Make Data Carving with PhotoRec to retrieve deleted files from formatted drives for forensics and disaster recovery. Author: Adrian Crenshaw This video introduces the concept of data carving/file carving for recovering deleted files, even after a drive has been formatted. How to f**k up your hard disk and how to recover it Source: n0id's blog How to non-destructively convert dynamic disks to basic disks Source: My PKB's blog Memories of a Media Card (Slashdot) Anyone who has upgraded their digital camera probably has a few older, incompatible media cards lying around — so why not post them on Ebay? Well, if you do, be sure to properly wipe them because the digital voyeurs are watching. Seth Fogie at InformIT.com purchased a bunch of used cards from Ebay and found recoverable data on most of them. Using the freely available PhotoRec application, he was able to extract pictures, movies, and more from apparently formatted cards. The picture is clear — wipe anything that can store digital data before getting rid of it. The best damn cybercrime and digital forensics book period, page 200 and page 373. Syngress. ISBN 978-1-59749-228-7. Jack Wiles, Kevin Cardwell, Anthony Reyes (2007). <amazon>1597492280</amazon> The Official CHFI Study Guide (Exam 312-49): for Computer Hacking Forensic Investigator. Syngress. ISBN 978-159749-197-6 By Dave Kleiman, Craig Wright, Jesse "James" Varsalone, Timothy Clinton, Michael Gregg (2007) <amazon>1597491977</amazon> 2006 Photorec - Ultimate file recovery tool Author: KaruppuSwamy Thangaraj TestDisk & PhotoRec (Japanese) How to recover lost files after you accidentally wipe your hard drive By: Shawn Hermans - Linux.com Recently I wanted to make sure I had enough space to back up my home digital videos and pictures, so I purchased a new hard drive to add to my home Linux server. I moved all the files I wanted to save onto a single hard drive and repartitioned the old hard drive so I could upgrade to a newer version of Linux. After going through the process of reinstalling the operating system, I mounted the backup hard drive and discovered that it was empty. I had some how mixed up the hard drive I used to back up all the data with a hard drive that I wanted to wipe. Because I had done such a poor job of retaining backups on external media, I did not have any backups of my pictures and videos. Your HDD Is Missing a Slice? Try TestDisk for a change Author: Ionut Ilascu, Softpedia Testdisk saved my Ubuntu bacon Author: Jeff Potts Recovering from file system corruption using TestDisk Authot: Ido Perelmutter Récupération de données: PhotoRec Author: Falkra - libellules.ch 2005 Beginners Guides: Flash Memory Data Recovery and Protection 2003 TESTDISK, The Holy Grail 2002 Scene of the cybercrime, page 328. Syngress. ISBN 978-1-931836-65-4. Debra Littlejohn Shinder, Michael Cross (2002). <amazon>1597492760</amazon> Retrieved from "https://www.cgsecurity.org/mw/index.php?title=In_The_News&oldid=7895" Category: Data Recovery'''
