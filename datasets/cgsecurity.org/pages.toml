["https://www.cgsecurity.org/Articles/php_limites_du_safemode/index.html"]
title = "Sécurité PHP"
full_description = "Dès qu'un site web est dynamique, des problèmes de sécurités inhérents au langage de programmation peuvent apparaître. PHP est sans doute le langage le plus proposé par les hébergeurs et le plus présent sur Internet. Cet article va aborder le problème de la sécurité posé par le langage PHP dans un site internet. Peut-on limiter les risques posés par d'éventuelles failles dans le code PHP ? Dans le cadre d'hébergements web mutualisés, quelles mesures un hébergeur peut-il prendre pour qu'un hébergement n'ait pas à pâtir du piètre développement d'un autre site ? Peut-il garantir un minimum de sécurité même en présence de code PHP hostile ? Certaines mesures pourront limiter les risques posés par des bugs de programmation dans le code d'un site web ou dans une application PHP. Elles peuvent être intéressantes à envisager dans le cadre de serveur dédié. PHP permet notamment de manipuler des fichiers, d'exécuter des commandes et d'ouvrir des connexions réseaux. Ces propriétés le rendent potentiellement dangereux. Cependant, il a été conçu comme une alternative plus sûr aux scripts CGI et au langage Perl. Quand PHP est utilisé comme module Apache, il s'exécute avec les droits de l'utilisateur sous lequel le serveur web fonctionne, généralement l'utilisateur apache. Si différents utilisateurs ont des scripts PHP, tout les scripts se retrouvent avec les mêmes droits! Le safe mode tente de résoudre les problèmes de sécurités des hébergements mutualisés. Faute d'alternatives réalistes au niveau du serveur web ou du système d'exploitation, le safe mode est la mesure principale de sécurité utilisée jusqu'ici. Pour activer le safe mode, il suffit de mettre safe_mode = On dans le fichier de configuration php.ini et de relancer Apache. Un système de wrapper sur l'ouverture des fichiers fopen va renforcer les permissions Unix, il vérifie si le propriétaire du script est aussi le propriétaire du fichier et ce n'est qu'à cette condition que le fichier pourra être accédé."
