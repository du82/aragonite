["https://cgsecurity.org/wiki/TestDisk_HU"]
title = "Partíciók és törölt fájlok visszanyerése"
description = "A TestDisk egy szabad és nyílt forráskódú szoftveres adatmentő eszköz, elveszett partíciók és törölt fájlok visszanyerésére tervezve."
full_description = '''TestDisk HU From CGSecurity Jump to navigation Jump to search English 中文 Deutsch Español Français Magyar فارسی Italiano Japanese 한국어 Nederlands Polski Português Русский Türkçe Latest stable version 7.2 February 22, 2024 TestDisk, Data Recovery A TestDisk nyílt forráskódú szoftver, mely a GNU General Public License (GPL v2+) szabályainak megfelelően használható. A TestDisk egy hatékony és szabad adatmentő szoftver! Elsődleges célja törölt partíciók visszanyerése és/vagy nem indítható meghajtók ismét indíthatóvá tétele amikor ilyen problémák szoftveres ok miatt jelentkeznek: egyes vírusok vagy emberi figyelmetlenség (például a partíciós tábla akaratlan törlése). A partíciós tábla helyreállítása a TestDisk használatával valóban könnyű. A TestDisk képességei: partíciós tábla javítása, törölt partíciók visszaállítása FAT32 indítószektor visszaállítása biztonsági másolatból FAT12/FAT16/FAT32 indítószektor újraépítése FAT táblák javítása NTFS indítószektor újraépítése NTFS indítószektor helyreállítása biztonsági másolatból MFT javítása MFT tükör használatával ext2/ext3/ext4 SuperBlock biztonsági másolat keresése fájlok visszanyerése FAT, exFAT, NTFS és ext2 fájlrendszereken fájlok másolása törölt FAT, exFAT, NTFS és ext2/ext3/ext4 partíciókról. A TestDisk kezdők és szakértők számára is tartalmaz lehetőségeket. Azok számára, akik keveset vagy semmit sem tudnak az adatmentési technikákról, a TestDisk részletes információkat tud gyűjteni egy nem indítható meghajtóról, mely aztán elküldhető egy szakértőnek további elemzésre. Azok, akik otthonosan mozognak a témában, az adatmentéshez jól használható eszköznek találják majd a TestDisk programot. Operációs rendszerek A TestDisk a következő rendszereken futtatható: DOS (igazi vagy Windows 9x DOS-ablak), Windows (NT4, 2000, XP, 2003, Vista, 2008, Windows 7 (x86 & x64), Linux, FreeBSD, NetBSD, OpenBSD, SunOS és MacOS X Bináris futtatható állományok és a forráskód letöltése DOS, Win32, MacOSX és Linux rendszerek