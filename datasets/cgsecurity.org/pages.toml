full_description = '''Chntpw for Dos IT From CGSecurity Jump to navigation Jump to search <google uid="C03_US"></google> English Italiano Accesso ai driver NTFS e cambia la password si sistema (March 25, 2002) Tu puoi accedere via Dos, sia in lettura che in scrittura, ai tuoi file su partizione NTFS , e cambiare la password di sistema. Funziona con NT 3.5 and NT 4. anche con HDD >8Gb . Download zip tgz Sorgente dei driver NTFS (GNU General Public License) Sorgente di chntpw Es. Per copiare un file da una partizione NTFS, cambiare la sua password e quella del sistema , devi scrivere: a:> ntcp ///winnt/system32/config/sam sam a:> chntpw -i sam a:> ntchange sam ///winnt/system32/config/sam Per Windows 2000, XP, 2003, Vista and 2008, usa NT Passwd bootdisk Oppure prova Ophcrack. E' un crivello , (che supporta perfino WinVista) e si basa sulle tabelle dei codici rainbow. Retrieved from "https://www.cgsecurity.org/mw/index.php?title=Chntpw_for_Dos_IT&oldid=8902"'''
