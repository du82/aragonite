description = "PhotoRec funktioniert mit Compact Flash, Speicher-Sticks, SecureDigital, SmartMedia, Microdrives, MMCs, USB-Laufwerken, Festplatten, CD-ROMs, ... PhotoRec wurde..."
full_description = 'Wiederherstellung digitaler Fotos mit PhotoRec From CGSecurity Jump to navigation Jump to search English Deutsch Español Français Italiano PhotoRec funktioniert mit Compact Flash, Speicher-Sticks, SecureDigital, SmartMedia, Microdrives, MMCs, USB-Laufwerken, Festplatten, CD-ROMs, ... PhotoRec wurde erfolgreich mit folgenden Digitalkameras getestet Canon EOS300D, 10D HP PhotoSmart 620, 850, 935 Nikon CoolPix 775, 950, 5700 Olympus C350N, C860L, Mju 400 Digital, Stylus 300 Sony DSC-P9 Praktica DCZ-3.4 Casio Exilim EX-Z 750 Fast keine digitale Kamera löscht Fotos unwiederbringlich von deiner Speicherkarte, auch nicht wenn Fotos gelöscht sind, oder die Karte neu formatiert wurde. PhotoRec kann diese Dateien in den meisten Fällen wiederherstellen. Auch wenn die digitale Speicherkarte deiner Kamera korrupt ist und du eine Fehlermeldung erhältst, hast du immer noch eine gute Chance, daß du deine Fotos wiederherstellen kannst. PhotoRec stellt JPEG, TIFF und verschiedene Raw- oder andere Marken-Formate wieder her, inklusive .cr2 Canon Raw 2 picture .crw Canon Raw picture .dcr Kodak Raw picture .nef Nikon Raw picture .orf Olympus Raw Format picture .pef Pentax Raw picture .raf Raw Fujifilm picture .raw Contax picture, Panasonic/Leica picture .rdc Rollei picture .sit Mikron .sr2 Sony Raw picture .tif Tag Image File Format .x3f Sigma/Foveon X3 raw picture Die gesamte Liste der wiederherstellbaren Dateiformate unter PhotoRec beinhaltet mehr als 80 Dateierweiterungen. Retrieved from "https://www.cgsecurity.org/mw/index.php?title=Wiederherstellung_digitaler_Fotos_mit_PhotoRec&oldid=5878" Category: Data Recovery'
