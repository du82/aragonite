["https://www.cgsecurity.org/Articles/acquisition_disque/index.html"]
title = "Image d'un disque"
full_description = '''Téléphones, ordinateurs, CD, DVD, disques durs, clés USB, baladeurs MP3, appareils photos numériques, nous sommes entourés de supports d'informations numériques. Confrontés à une perte de données, il peut être risqué de tenter une réparation sans avoir pris soin d'établir au préalable une copie. Cet article présente quelques utilisations de copies de support numériques et donnent quelques conseils pour les réaliser. Les outils de réparation de systèmes de fichiers ne sont pas capables de gérer efficacement tous les problèmes, cela ne va pas étonner grand monde. Pire, j'ai fait moi-même l'expérience de programmes de "réparation" supprimant tout élément considéré comme endommagé, à la fin de l'opération, le système de fichier était, il est vrai, consistant, mais désespérément vide. Il faut donc être en mesure de pouvoir tester plusieurs outils afin de trouver celui qui va permettre de récupérer enfin ses données sans risquer de tout perdre. La difficulté est de revenir à l'état initial. Certains outils disposent d'une fonction "Undo" pour annuler une réparation, mais celle-ci ne fonctionne pas si l'outil plante en plein milieu d'une opération ou si le système a été modifié depuis. Même en utilisant des techniques de récupération de données copiant les fichiers récupérés, nul n'est à l'abri d'erreurs de manipulation, il vaut mieux prendre des précautions pour ne pas risquer d'altérer le média et empêcher toute récupération ultérieure effective. Une erreur humaine est souvent à l'origine de la perte de donnée, en état de stress, une erreur supplémentaire de manipulation n'est pas exclue. En cas de panne matérielle légère, un disque dur peut rester malgré tout globalement accessible. Deux stratégies sont généralement à envisager: confier le disque à une société spécialisée ayant une expertise dans la récupération de données liées à des problèmes matériels ou bien prendre la situation en main: considérant que la panne risque de se généraliser et que l'on ne peut rien faire contre, copier les fichiers les plus importants en premier puis dupliquer le disque tant que cela est possible.'''
year_published = 2025
clearnet = "https://www.cgsecurity.org/Articles/acquisition_disque/index.html"
