["https://www.cgsecurity.org/Articles/firewall_netfilter.html"]
title = "Netfilter: firewalling sous Linux 2.4/2.6"
full_description = '''Qu'il s'agisse d'un poste directement connecté à Internet, équipé d'une carte WIFI ou connecté à un réseau d'entreprise, votre ordinateur est, disons le franchement, en milieu hostile. C'est pourquoi il convient de le protéger de connexions réseau indésirables. La table nat sera étudiée lors de la protection d'un réseau, la table mangle lors des applications avancées comme la gestion de bande passante ou de plusieurs FAI. Commençons donc avec la table filter responsable du filtrage de paquets. Les règles de filtrages sont organisées en trois chaînes: INPUT, OUTPUT et FORWARD. Comme le nom l'indique, ces règles régissent respectivement les filtrages des paquets émis, reçus ou en transits. Le cas du transit concerne les passerelles, cas que nous verrons dans "Protéger un réseau". La première commande fait table rase (F=Flush) des chaînes existantes de la table filter. Les trois suivantes définissent la politique (P=policy) par défaut pour les trois chaînes. La politique appliquée peut être ACCEPT, DROP ou REJECT pour respectivement autoriser, ignorer ou rejeter un paquet. Contrairement à DROP, REJECT va prévenir la machine distante que le paquet est refusé. Faisant confiance (pour le moment) au firewall, on l'autorise à émettre sans restriction. Sans la dernière ligne, la machine peut émettre des paquets mais ignore les réponses, elle est donc incapable de dialoguer. La dernière ligne indique d'accepter les paquets liés à un état Avec cette configuration, vous pouvez naviguer sur des sites web, envoyer des mails mais rapidement vous vous rendez compte que vous ne pouvez pas faire de FTP. Pour être plus précis, cela ne fonctionne pas toujours. Voila, le problème est clairement identifié. Le mode actif (mode par défaut du FTP de Windows) ne fonctionne pas! FTP utilise un protocole bi-canal, l'ouverture du second canal pour la transmission des données est effectuée par les commandes circulant dans le premier canal. La connexion au second canal s'effectue du client vers le serveur en mode passif et du serveur vers le client en mode actif. Pour avoir connaissance des ports utilisés, le firewall doit donc étudier la communication transitant sur le port TCP 21, le module ftp_conntrack_ftp est chargé de cette opération. Pour le charger, il suffit d'ajouter en début de script modprobe ip_conntrack_ftp. Par défaut, seules les connexions FTP sur le port classique (tcp/21) sont analysées. Si vous avez un proxy FTP sur le port 2121, vous devez charger le module ip_conntrack_ftp de la façon suivante modprobe ip_conntrack_ftp ports=21,2121.'''
year_published = 2025
clearnet = "https://www.cgsecurity.org/Articles/firewall_netfilter.html"
