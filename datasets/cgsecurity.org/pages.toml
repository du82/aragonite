["https://cgsecurity.org/wiki/PhotoRec_HU"]
title = "Digital Picture and File Recovery"
description = "A PhotoRec egy szabad és nyílt forráskódú szoftveres fájladat visszanyerő eszköz."
full_description = 'PhotoRec HU From CGSecurity Jump to navigation Jump to search English 中文 Deutsch Español Français Magyar Italiano Русский Türkçe Latest stable version 7.2 February 22, 2024 PhotoRec, Digital Picture and File Recovery A PhotoRec egy fájladat visszanyerő szoftver a merevlemezen vagy CD-ROM-on elveszett fájlok (videók, dokumentumok, archívumok) és digitális fényképezőgépek memóriájában elveszett képek (a neve ezért Photo Recovery) tartalmának visszanyerésére. A PhotoRec figyelmen kívül hagyja a fájlrendszert és egyenesen az azokban található adatokat ellenőrzi, így akkor is működik ha az adathordozó fájlrendszere súlyosan sérült vagy formázva lett. A PhotoRec szabad - ez a nyílt forráskódú multi-platformos alkalmazás a GNU General Public License (GPLV v2+) szabályainak megfelelően használható. A PhotoRec a TestDisk társprogramja, egy alkalmazásnak, mely képes visszaállítani több különböző típusú elveszett partíciót és újra indíthatóvá tenni nem indítható lemezeket. Mindkét eszköz letölthető innen. A nagyobb biztonság érdekében a PhotoRec csak olvasható módban kezeli a meghajtókat és memóriakártyákat, melyekről az adatok visszanyerése történik. Fontos: amikor egy kép vagy fájl akaratlanul törlésre kerül vagy a hiányát észleli NE mentsen több képet vagy fájlt az adott memória eszközre vagy merevlemezre, mert felülírhatja az elveszett adatokat! Ez egyben azt is jelenti, hogy amikor a PhotoRec dolgozik nem választhatja a visszanyert fájladatok tárolásának helyeként ugyanazt a partíciót, amelyen azok tárolva voltak. Contents 1 Operációs rendszerek 2 Fájlrendszerek 3 Adathordozók 4 Ismert fájlformátumok 5 A PhotoRec működése 6 Egyéb témák 7 Problémák? Operációs rendszerek A PhotoRec a következő rendszereken futtatható: DOS/Windows 9x Windows NT 4/2000/XP/2003/Vista/2008/7 Linux FreeBSD, NetBSD, OpenBSD Sun Solaris Mac OS X és lefordítható szinte minden Unix rendszerre. TestDisk és PhotoRec letöltése Fájlrendszerek A PhotoRec figyelmen kívül hagyja a fájlrendszert, így akkor is működik ha az adathordozó fájlrendszere súlyosan sérült Vissza tudja nyerni az elveszett adatokat a következőkön: FAT NTFS exFAT ext2/ext3/ext4 fájlrendszerek HFS+ A ReiserFS egyik különleges tulajdonsága, hogy ha egy fájl nevének hossza és az utolsó szakaszának mérete kisebb mint a fájlrendszer egy blokkja, akkor a fájl adatainak utolsó szakasza magában a b*tree ágban lesz tárolva. A helyett, hogy valahol az adatterületen tárolná és egy mutatóval hivatkozna rá. Ezzel növelve a sebességet. Ezzel a PhotoRec sajnos nem tud mit kezdeni és ez az oka, hogy ReiserFS esetén nem működik megfelelően. Adathordozók A PhotoRec egyebek mellett a következő adathordozókkal használható: merevlemezek, CD-ROM-ok, memóriakártyák (CompactFlash, Memory Stick, Secure Digital/SD, SmartMedia, Microdrive, MMC stb.), USB memória meghajtók, DD nyers lemezképek, EnCase E01 lemezképek stb. A PhotoRec sikeresen működött különböző hordozható médialejátszókkal, mint az iPod és a következő digitális fényképezőgépek esetén: Canon EOS 60D, 300D, 10D Casio Exilim EX-Z 750 Fujifilm X-T10 HP PhotoSmart 620, 850, 935 Nikon CoolPix 775, 950, 5700 Olympus C350N, C860L, Mju 400 Digital, Stylus 300 Sony Alpha DSLR, DSC-P9, NEX-6 Pentax K20D Praktica DCZ-3.4 Ismert fájlformátumok A PhotoRec az ismert fájltípusok fejléceit keresi. Ha az adatok nem töredezettek, ami gyakori, vissza tudja nyerni a teljes fájlt. A PhotoRec sok fájltípus felismerésére és visszanyerésére képes beleértve a ZIP, Office, PDF, HTML, JPEG és más grafikus formátumú fájlokat. A PhotoRec által visszanyerhető fájlok listája több mint 480 fájlkiterjesztést tartalmaz (nagyjából 300 fájlcsaládból). A PhotoRec működése A FAT, NTFS, ext2/ext3/ext4 fájlrendszerek a fájlokat adatblokkokban (Windows-on "cluster" vagyis adatfürt) tárolják. Az adatblokkok mérete állandó szektorszám marad a fájlrendszer formázással történő kialakításának folyamán. Az operációs rendszerek általában igyekeznek az adatokat egy folyamatos területre írni, hogy elkerüljék az adatok töredezését. A mechanikus meghajtók számára a merevlemezek írása és olvasása viszonylag időigényes feladat, ezért fontos a töredezettség szintjének lehető legalacsonyabban tartása. Amikor egy fájl törlésre kerül a hozzá tartozó adatok (fájlnév, dátum/idő, méret, az első adatblokk/cluster helye stb.) elvész. Például ext3/ext4 fájlrendszeren a törölt fájlok nevei még megtalálhatók, de az első adatblokkra mutató hivatkozás törlődik. Ez azt jeleni, hogy az adatok még léteznek a lemezen, de csak amíg egy része vagy az egész felül nem lesz írva újabb adatokkal. Az elveszett fájlok visszanyerése érdekében a PhotoRec először megpróbálja kideríteni az adatblokkok (vagy cluster-ek) méretét. Ha fájlrendszer nem sérült ez az érték kiolvasható a SuperBlock-ból (ext2/ext3/ext4) vagy a meghajtó adott kötetének indítószektorából (FAT, NTFS). Egyébként a PhotoRec szektorról szektorra olvassa az adathordozót, miközben megkeresi az első tíz fájlt, melyek elhelyezkedése alapján kiszámolja az adatblokkok/cluster-ek méretét. Amikor az adatblokkok mérete már ismert a PhotoRec adatblokkonként (vagy cluster-enként) olvassa az adathordozót. Minden blokk ellenőrzésre kerül egy, a programhoz tartozó adatbázis alapján, mely tartalmazza a visszaállítható fájltípusok felismeréséhez szükséges azonosítókat. Ez az adatbázis jelentősen megnőtt a PhotoRec első változatának megjelenése óta. Például, a PhotoRec JPEG képet feltételez ha az adatblokk a következők valamelyikével kezdődik: 0xff, 0xd8, 0xff, 0xe0 0xff, 0xd8, 0xff, 0xe1 0xff, 0xd8, 0xff, 0xfe If PhotoRec has already started to recover a file, it stops its recovery, checks the consistency of the file when possible and starts to save the new file (which it determined from the signature it found). Ha az adatok nem töredezettek a visszanyert fájl mérete egyenlő vagy nagyobb lesz mint az eredeti fájl mérete. Egyes esetekben a PhotoRec megtudhatja a fájl méretét annak fejlécéből, így a visszanyert fájl mérete egyezni fog az eredetivel. Ha azonban a visszanyert fájl végül kisebb, mint a fejléc alapján lennie kellene akkor el lesz dobva. Bizonyos fájlok, úgynevezett adatfolyamok, például az *.MP3 típusúak. Ilyen esetekben a PhotoRec a visszanyert adatot elemzi és befejezi az adatok másolását ha az adatfolyam véget ér. Amikor egy fájl sikeresen vissza lett állítva a PhotoRec ellenőrzi a megelőző adatblokkokat, hogy talál-e azonosítót, ami olyan fájlra utal, mely nem volt visszanyerhető (azaz a fájl túl kicsi) és újra próbálkozik. Így egyes töredezett fájlok is visszanyerhetők. Egyéb témák Munka CD-R/CR-RW/DVD/floppy lemezekkel... PhotoRec lépésről lépésre Adatmentés iPhone-ról Hogyan segíthetek A PhotoRec használatát követően: Néhány tipp a visszanyert fájlok rendezéséhez PhotoRec FAQ Futtatás parancsfájlban: A PhotoRec használata felhasználói beavatkozás nélkül (kötegelt műveletek). Fejlesztők: Hozzájárulás a TestDisk és a PhotoRec forráskódjához Problémák? Ne várjon! Keresse fel a PhotoRec fórumát amennyiben nehézségei támadtak a PhotoRec használatával, ötlete van a fejlesztéshez Ha van olyan fájlformátum, melyet szeretne ha a program kezelne, vegye fel a kapcsolatot a fejlesztővel: Christophe GRENIER. Retrieved from "https://www.cgsecurity.org/mw/index.php?title=PhotoRec_HU&oldid=8940" Category: Data Recovery'
