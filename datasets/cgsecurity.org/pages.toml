["https://cgsecurity.org/wiki/PhotoRec_RU"]
title = "PhotoRec RU - CGSecurity"
description = "PhotoRec - программа для восстановления утерянных (удаленных) файлов (видеофайлов, документов и архивов с жестких дисков, компакт-дисков и других носителей), а также..."
full_description = '''PhotoRec RU From CGSecurity Jump to navigation Jump to search English 中文 Deutsch Español Français Magyar Italiano Русский Türkçe Latest stable version 7.2 February 22, 2024 PhotoRec, Digital Picture and File Recovery PhotoRec - программа для восстановления утерянных (удаленных) файлов (видеофайлов, документов и архивов с жестких дисков, компакт-дисков и других носителей), а также для восстановления изображений (поэтому называется Photo Recovery) из памяти цифровых фотокамер. PhotoRec игнорирует файловые системы и "идет по следу данных", поэтому он будет работать, даже если файловая система носителя была серьезно повреждена или отформатирована. PhotoRec свободен - это многоплатформенная программа с открытым исходным кодом, которая распространяется по GNU General Public License (GPLV v2+). PhotoRec является спутником программы TestDisk, программы для восстановления потерянных (удаленных) разделов различных файловых систем и восстановления их загрузочной способности. Скачать можно здесь. Для большей безопасности, при работе с носителями с которых вы восстанавливаете потерянные данные PhotoRec использует доступ только для чтения. Важно: как только изображение или нужный файл случайно удален, или вы обнаружили потерю, прекратите записывать файлы на этот носитель (жесткий диск, флешку, дискету); потому что вы можете записать новые файлы на место удаленных и восстанавливать будет нечего. Ну и соответственно, при использовании PhotoRec, нельзя выбирать для записи восстановленных файлов тот же раздел, с которого производится восстановление. Contents 1 Операционные системы 2 Файловые системы 3 Носители 4 Известные форматы файлов 5 Как работает PhotoRec 6 Другие темы 7 Проблемы ? Операционные системы PhotoRec работает под: DOS/Win9x Windows NT 4/2000/XP/2003/Vista/2008/7 Linux FreeBSD, NetBSD, OpenBSD Sun Solaris Mac OS X и может быть скомпилен почти во всех системах Unix. Скачать TestDisk & PhotoRec Файловые системы Photorec игнорирует файловую систему, таким образом, она работает, даже если файловая система сильно повреждена. Он может восстановить потерянные файлы из: FAT, NTFS, EXT2/EXT3 filesystem HFS+ ReiserFS includes some special optimizations centered around tails, a name for files and end portions of files that are smaller than a filesystem block. In order to increase performance, ReiserFS is able to store files inside the b*tree leaf nodes themselves, rather than storing the data somewhere else on the disk and pointing to it. Unfortunately, PhotoRec isn't able to deal with this - that's why it doesn't work well with ReiserFS. Носители PhotoRec работает с жесткими дисками, компакт-дисками, картами памяти (Compact Flash, Memory Stick, SecureDigital/SD, SmartMedia, Microdrive, MMC, etc.), USB-флешками, DD-raw образами, EnCase E01 образами, и так далее. PhotoRec был удачно протестирован на плеерах, типа iPod и цифровых камерах. Известные форматы файлов PhotoRec ищет известные заголовки файлов. Если нет фрагментации, которая часто бывает, он может восстановить весь файл. Photorec распознает многочисленные форматы файлов, включая ZIP, Office, PDF, HTML, JPEG и разные другие форматы графических файлов. Полный список форматов файлов, поддерживаемых PhotoRec содержит более 390 расширений файлов (около 225 file families). Как работает PhotoRec FAT, NTFS, ext2/ext3/ext4 - файловые системы хранения файлов в блоках данных (под Windows называются "кластерами"). Количество кластеров и их размер остается постоянным числом после инициализации во время форматирования файловой системы. В целом, большинство операционных систем, пытаются сохранить данные непрерывно, чтобы минимизировать фрагментацию данных. Время поиска данных механическими приводами имеет ненулевое значение, потому важно держать фрагментацию на минимальном уровне. Когда удаляется файл, мета-информация об этом файле (имя файла, дата/время, размер, положение первого кластера (блока данных), и так далее) теряется. А например, в файловой системе ext3/ext4, имена удаленных файлов по-прежнему присутствуют, но удаляется положение первого блока данных. Это означает, что данные по-прежнему присутствует в файловой системе, но только до некоторых пор, пока все их не заменят новые файлы с новыми данными. Чтобы восстановить эти потерянные файлы, PhotoRec сначала пытается найти размер блока данных (кластера). Если файловая система не повреждена, это значение может быть прочитано из суперблока (ext2/ext3/ext4) или из загрузочной записи (FAT, NTFS). Иначе, PhotoRec читает носитель, сектор за сектором, ищет первые десять файлов, из которых рассчитывает размер блока/кластера по их расположению. После того как размер блока известен, PhotoRec читает носитель блок за блоком (или кластер за кластером). Сигнатура каждого блока проверяется в базе данных, которая поставляется вместе с программой. В нее занесены все типы файлов, которые можно восстановить с тех пор как вышла первая версия PhotoRec. Например, PhotoRec идентифицирует файл JPEG, когда блок начинается с: 0xff,0xd8,0xff,0xe0 0xff,0xd8,0xff,0xe1 or 0xff,0xd8,0xff,0xfe после чего PhotoRec начинает восстанавливать файл. Прекращает восстановление, когда проверяет целостность файла, если это возможно, сохраняет файл (который определяется по найденной сигнатуре). Если данные не фрагментированы, восстановленный файл должен быть идентичного размера или больше, чем исходный файл. В некоторых случаях, PhotoRec может узнать оригинальный размер файла из заголовка, так что восстановленный файл усекается до необходимого размера. Однако, если восстановленный файл заканчивается раньше, чем указывает его заголовок, он отбрасывается. Некоторые файлы, такие как *.MP3, являются потоком данных. В этом случае, PhotoRec анализирует полученные данные, а затем останавливает восстановление, когда поток завершается. Когда файл восстановлен, PhotoRec проверяет предыдущие блоки данных, смотрит там файловые сигнатуры, если находит, то считает что файл не был успешно восстановлен (например, файл был слишком мал), и пытается восстановить снова. Таким образом, могут быть успешно восстановлены некоторые фрагментированные файлы. Другие темы Работа со сменными носителями PhotoRec Шаг за шагом Восстановление данных из iPhone Как помочь После использования PhotoRec: Некоторые идеи по сортировке восстановленных файлов Часто задаваемые вопросы по PhotoRec Запуск скриптов: Запуск PhotoRec без взаимодействия с пользователем (пакетный режим). Разработчики Как внести свой вклад в код TestDisk и PhotoRec Проблемы ? Не стесняйтесь посетить форум если у вас есть: трудности при использовании PhotoRec; идеи по его улучшению. Примечание переводчика: вот только предварительно изучите хотя бы английский язык... ну, или немецкий-французский. Если есть формат файла, который вы хотели бы добавить, не стесняйтесь обратиться к разработчику Christophe GRENIER. Retrieved from "https://www.cgsecurity.org/mw/index.php?title=PhotoRec_RU&oldid=8943" Category: Data Recovery'''
year_published = 2019
year_updated = 2019
