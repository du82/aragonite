["https://cgsecurity.org/wiki/CGSecurity:About"]
title = "CGSecurity:About - CGSecurity"
full_description = 'CGSecurity:About From CGSecurity Jump to navigation Jump to search https://www.cgsecurity.org is a personal website created by Christophe GRENIER. Contents 1 Hosting 2 Content 3 Data Collection 3.1 How to delete Moodle account 3.2 How to delete Forum account 4 Cookies 4.1 what are cookies 4.2 COOKIE TYPES 4.3 THIRD-PARTY COOKIES 4.4 Google Adsense 4.5 Amazon EU Associates Programme 4.6 Cookies table Hosting www.cgsecurity.org forum.cgsecurity.org git.cgsecurity.org moodle.cgsecurity.org are hosted by GlobalSP, 78 rue la Condamine, 75017 PARIS, France. Content If something is inappropriate, please signal it by email. The content of the website can be modified by registered users. A valid email is required for registered users to limit spam. The IP addresses of users (derived either from those logs or from records in the database) may be used to identify the source(s) of the abusive behavior. Data Collection TestDisk, PhotoRec and CmosPwd do not connect to Internet, they do not send information about you/your computer/your data/... Some third-party cookies on cgsecurity.org serve for direct advertising (data collection for ads personalisation). How to delete Moodle account Sign in to the Moodle website and visit https://moodle.cgsecurity.org/admin/tool/dataprivacy/createdatarequest.php If you want to export your personal data, select “Export all of my personal data” and confirm. Your data will be prepared for download. Select “Delete all of my personal data” and confirm to delete your account. Your Moodle account will be deleted. Note: To prevent loosing students results, it may require a confirmation from a Moodle administrator. How to delete Forum account Sign in to the Forum website and visit User Control Panel Select "Delete My Account" Confirm the action Cookies This website uses cookies to ensure the correct operation of systems and improve the users’ experience of some applications. This document provides information on the use of cookies and similar technologies on this website, their purposes and the way users can control or disable cookies. what are cookies Cookies are small texts sent from a server to a user’s device (usually to the Internet browser) when they access a website page. Cookies enable the web server to save information that will be used during the same visit (session cookies) or during subsequent visits (persistent cookies). Cookies facilitate website navigation, enable storage of pages visited and other specific information, such as the most frequently visited pages, connection errors, etc. Cookies are stored, based on the user’s preferences, by the individual browser on the specific device used (computer, tablet, smartphone). Browsers (Internet Explorer, Mozilla Firefox, Google Chrome, Safari etc.) are often set to automatically accept cookies. However users can change the default setting in order to disable or delete cookies, with the result, however, that the optimal use of some areas of the website may be precluded. Therefore for optimal use of this website, users should set their browser to accept cookies. During navigation, users may also receive on their terminal cookies from other websites (so called “third party” cookies) directly set up by the controllers of such websites and used for the purposes and in the manner defined by them. COOKIE TYPES Based on the characteristics and use of cookies, we can define the following categories: Technical cookies: These cookies are required for navigation on a website and use of its functions, such as to enable correct display of pages or access to restricted areas. Therefore disabling this type of cookies does not allow such activities. These cookies are not used for other purposes and can be divided into: navigation or session cookies, which ensure normal navigation and use of the website function cookies, which enable user navigation according to a set of selected criteria (e.g. language) to improve the service provided to users Performance cookies: These cookies collect information on the efficiency of a website’s response to users’ requests in an anonymous form, with the only aim of improving the functionality of the website; for example, which pages are most frequently visited by users, whether there were errors or delays in the provision of web pages. This website does not use performance cookies. Profiling cookies: These cookies are designed to create user profiles and are used to send advertising messages in line with the preferences shown by users during web navigation. This website does not use profiling cookies. THIRD-PARTY COOKIES When visiting the website cgsecurity.org users could receive on their device cookies managed by other organizations (third-party cookies): this occurs because the site may contain elements such links to third-party web pages or web services. These cookies can be sent to the users’ browser by third companies directly from their websites, which can be accessed by navigating this website. For information transparency, we are listing below the third party services present on our website, the purpose and links to the information pages of the various services. You may visit those websites to opt out of the use of cookies for personalized advertising : Google Adsense Since this website uses adverts from Google Adsense a cookie from Google may be stored on your computer. Most web browsers automatically accept cookies, but you can usually modify your browser setting to decline cookies if you prefer. Amazon EU Associates Programme Christophe GRENIER is a participant in the Amazon EU Associates Programme, an affiliate advertising programme designed to provide a means for sites to earn advertising fees by advertising and linking to Amazon.fr. Cookies table The tables below list some of the internal and third-party cookies we use. As the names, numbers, and purposes of these cookies may change over time, this page may be updated to reflect those changes. Host Name Used by Purpose Expiration period .cgsecurity.org __gads Google ADS to provide ad delivery or retargeting 2 years forum.cgsecurity.org phpbb3_52ozf_u internal - phpBB3 software 1 year forum.cgsecurity.org phpbb3_52ozf_k internal - phpBB3 software 1 year forum.cgsecurity.org phpbb3_52ozf_sid internal - phpBB3 software Persistent session id 1 year moodle.cgsecurity.org MoodleSession internal - moodle software Session ID Session lifetime www.cgsecurity.org cgsecurity_mw__session internal - mediawiki software Session ID Session lifetime www.cgsecurity.org cgsecurity_mw_UserID internal - mediawiki software 180 days www.cgsecurity.org cgsecurity_mw_UserName internal - mediawiki software 180 days www.cgsecurity.org cgsecurity_mw_UserToken internal - mediawiki software 180 days www.cgsecurity.org cgsecurity_mw_cookiewarning_dismissed internal - mediawiki software Record when banner has been validated 30 days Retrieved from "https://www.cgsecurity.org/mw/index.php?title=CGSecurity:About&oldid=9203"'
