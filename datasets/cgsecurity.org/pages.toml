["https://www.cgsecurity.org/wiki/CV_Christophe_GRENIER"]
title = "CV Christophe GRENIER - CGSecurity"
description = "Christophe GRENIER  E-mail:  grenier@cgsecurity.org Web: https://www.cgsecurity.org Ingénieur diplômé de l'ESIEA (Promotion 2001)"
full_description = '''CV Christophe GRENIER From CGSecurity Jump to navigation Jump to search Christophe GRENIER E-mail: grenier@cgsecurity.org Web: https://www.cgsecurity.org Ingénieur diplômé de l'ESIEA (Promotion 2001) Expérience professionnelle Depuis juillet 2011, Directeur d'Exploitation chez Global SP, Paris Depuis juillet 2011, je suis Directeur d'exploitation et je remplis aussi les fonctions de Responsable de la Sécurité des Systèmes d'Information (RSSI) de Global Service Provider En tant que Directeur d'Exploitation, j'assure le management d'une équipe d'une dizaine de techniciens et ingénieurs, l'intégration, validation et supervision des évolutions d'architecture (systèmes et réseaux), maintien en condition opérationnelle (MCO), maintien en condition de sécurité (MCS), la gestion de la politique de sécurité (PSSI). Octobre 2010 - Juin 2011, Responsable d'exploitation & RSSI chez Global SP, Paris Sur cette période, j'ai rempli les fonctions de Responsable d'exploitation et de Responsable de la Sécurité des Systèmes d'Information (RSSI) de Global Service Provider A ce titre, j'ai assuré le management d’une équipe de 9 personnes, la validation technique des propositions commerciales, l'élaboration, validation et supervision des évolutions d'architecture (systèmes et réseaux), la gestion quotidienne de l'exploitation, la gestion technique du bâtiment (salles serveurs) la gestion de la politique de sécurité (PSSI), des audits de sécurité et des réquisitions judiciaires. Mars 2004 - Septembre 2010, RSSI de Global SP, Paris Responsable de la Sécurité des Systèmes d'Information de Global Service Provider Dans le cadre du management de la sécurité, mes fonctions comprenaient l'établissement de la politique de sécurité de nos systèmes d'information (PSSI), une assistance aux équipes commerciales et techniques dans la conception des offres puis leur mise en place, un rôle d'interface sur les questions de sécurité autour des besoins et contraintes de nos clients, les offres en place et les possibilités d'évolution ou d'adaptation. Au niveau opérationnel, direction du pôle Linux/Sécurité/Réseau. Depuis octobre 2004, Enseignant vacataire à l'ESIEA, Paris Intervenant au Mastère Spécialisé "Sécurité de l'Information et des Systèmes" (MS-SIS) de l'ESIEA (École Supérieure d'Informatique Électronique Automatique), formation ayant obtenue le label SecNumedu délivré par l’ANSSI (Agence Nationale de la Sécurité des Systèmes d’Information). Mes cours portent sur les thèmes suivants Linux: Utilisation et Administration Firewalling Netfilter sous Linux avec iptables Sécurité Internet, détection, exploitation et correction de failles web et Initiation aux techniques d'audit de sécurité/pentest. Sécurité, authentification et mots de passe dans la pratique Récupération de données et approche du forensic Mars 2001 - février 2004 Consultant Sécurité chez Global Secure (Groupe Orbytes), Paris Conduite de tests d'intrusion et d'audits de sécurité (réseaux, systèmes, applications web, code) Sécurisation de serveurs Linux Conception et validation d'architecture réseau sécurisée Sessions de sensibilisation à la sécurité et formations aux techniques d'intrusion informatique (ethical hacking) Août 2000 Sécurité informatique, Global Secure (Groupe Orbytes), Paris Mise en place d'une méthodologie de test d'intrusion réseau Conduite de tests d'intrusion Juillet 2000 Administration système et réseau ETHOS (Suisse) Administration système Linux et IBM Aix 1999-2000 Administration système et réseau occasionnel, PIER, Ivry-sur-Seine Au sein de la PIER, la junior entreprise de l'ESIEA et de PIER Formation, réalisation de prestations de Administration système Unix et Réseau Formation Linux et Cisco 1998-2001 Administrateur système Linux, ESIEA, Paris Membre puis responsable de la WebTeam (équipe d'étudiants): administration du serveur Internet Linux www.esiea.fr et d'un second serveur (FTP, newsgroups, mailing list...). Juillet - Août 1999 Administration réseau et système, ESIEA, Paris Mise en place de serveurs NFS, de serveurs FTP, d'un cache internet (squid) Création d'un sous-réseau pour la mise en place de nouvelles salles informatiques pour les TP étudiants Administration de serveurs HPUX, Alpha OSF1 et Linux Juillet - Août 1998 Support technique, Hewlett-Packard, Les Ulis Au sein du Product Support Center, Création d'un extracteur automatique de données HTML. Conception d'une interface Web d'accès à des documentations techniques Programmation d'outils de création/maintenance pour ce serveur Internet Mars - Juin 1998 Administrateur du serveur FTP, ESIEA, Paris Gestion de réplications (miroirs) de sites FTP à l'usage des étudiants (Distributions Linux, logiciels Opensource...) Juillet - Août 1997 Assistance technique, Hewlett-Packard, Les Ulis Assistance technique au sein du service HelpDesk, hotline interne de HP France. Mars 1997 Développement, Concours Prologin Réalisation d'un client en intelligence artificielle, 6ème prix. Cursus 1998-01 Cycle ingénieur à l'Ecole Supérieure d'Informatique Electronique Automatique (ESIEA), Paris Ingénieur ESIEA, mention Très Honorable + Master ESIEA Publications Linux Mag France Programmation sécurisée article 1 : Introduction, UID/EUID, exécution de commandes externes (n°23, Décembre 2000) article 2 : Organisation de la mémoire, pile et fonctions, shellcode (n°24, Janvier 2001) article 3 : Buffer overflows (n°25, Février 2001) article 4 : Format bug (n°26, Mars 2001) article 5 : Race conditions (n°27, Avril 2001) article 6 : Scripts CGI (n°28, Mai 2001) Netfilter: firewalling sous Linux 2.4 (n°39, Mai 2002) Programmation d'un sniffer, Sources (n°42, Septembre 2002) SOTM23: Analyse d'une capture réseau lors d'un scan de port (n°45, Décembre 2002) Reverse: Analyse d'un binaire (n°46, Janvier 2003) SOTM22: Analysez un fichier Snort (n°47, Février 2003) SOTM24: Les techniques d'analyse d'une disquette (n°47, Février 2003) SOTM25: Analyse du code source d'un Worm (n°49, Avril 2003) S