["https://www.cgsecurity.org/Articles/SecProg/Art5/index-fr.html"]
title = "Programmation sécurisée: Race conditions"
full_description = "Ce cinquième volet de notre série d'articles est consacré à des problèmes de sécurité apparaissant à cause de la nature même du fonctionnement multitâche du système d'exploitation. Les situations de concurrence (race condition) laissent plusieurs processus disposer simultanément d'une même ressource (fichier, périphérique, mémoire), alors que chacun d'eux pense en avoir l'usage exclusif. Cela conduit à l'existence de bogues intempestifs difficiles à déceler, mais également de véritables failles pouvant compromettre la sécurité globale du système. Le principe général des situations de concurrence est le suivant : un processus désire accéder de manière exclusive à une ressource du système. Il s'assure qu'elle ne soit déjà utilisée par un autre processus, puis se l'approprie, et l'emploie à sa guise. Le problème survient lorsqu'un autre processus profite du laps de temps s'écoulant entre la vérification et l'accès effectif pour s'attribuer la même ressource. Les conséquences peuvent être très variées. Dans certains cas classiques de la théorie des systèmes d'exploitation, on se retrouve dans des situations de blocages définitifs des deux processus. Dans les cas plus pratiques, ce comportement mène à des dysfonctionnements parfois graves de l'application, voire à de véritables failles de sécurité quand un des processus profite indûment des privilèges de l'autre. Ce que nous avons nommé ressource précédemment se présente sous diverses formes. La plupart des problèmes de race condition régulièrement découverts et corrigés dans le noyau lui-même, se rapportent à des accès concurrentiels à des zones-mémoire. Ici nous nous intéressons plutôt aux applications système, et nous considèrons que les ressources concernées sont des noeuds du système de fichiers. Cela recouvre non seulement les fichiers usuels mais également l'accès direct aux périphériques à travers les points d'entrée spéciaux du répertoire /dev/."
year_published = 2025
clearnet = "https://www.cgsecurity.org/Articles/SecProg/Art5/index-fr.html"
