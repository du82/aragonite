["https://www.cgsecurity.org/Articles/3-MISC/Protections-3/index.html"]
title = "Protections contre l'exploitation des débordements de buffer - Bibliothèques et compilateurs"
full_description = '''Une autre forme de protection est fourni au niveau utilisateur, soit par des modifications du compilateur (stackguard/stackshield), soit au niveau des bibliothèques dynamiques utilisées par les programmes (libsafe). Cet article présente ces protections. Dans ce type de configuration, l'attaquant est obligé d'écraser en premier le pointeur de la frame locale (%ebp) pour écraser l'adresse de retour de la fonction (%eip). C'est ici qu'intervient Stackguard. En effet, pour détecter la tentative de débordement de tampons, Stackguard place une valeur appelée "canary" entre le registre %ebp et le registre %eip. Dans ce cas, l'attaquant écrase le registre %ebp, puis en voulant écraser le registre %eip, il modifie le canary. La tentative de débordement de tampon est alors détectée. Par comparaison avec la figure 1, la figure 2 présente l'état de la pile lorsque le programme est compilé avec Stackguard. Pour éviter une usurpation du canary, Stackguard utilise les trois méthodes suivantes pour le générer : Cette protection n'est malheureusement pas infaillible. Il existe en effet plusieurs techniques permettant de la contourner dans certains conditions, comme nous le verrons par la suite. Stackshield (http://www.angelfire.com/sk/stackshield/) n'empêche pas la modification de l'adresse de retour présente dans la pile (%eip). Cependant, celle-ci est copiée dès le début de la fonction dans une région inaccessible en écriture (le segment DATA) puisque ce dernier se trouve loin en dessous de la pile. Au moment de quitter la fonction (i.e. juste avant le return), Stackshield récupère l'adresse sauvegardée et la compare à celle présente dans la pile. Si elle a été modifiée, StackShield arrête l'exécution du programme ou essaye de la continuer en ignorant l'attaque du programme vulnérable (risque de signal 11). Nous verrons par la suite comment, dans certains cas, il est possible de modifier cette adresse. LibSafe est une bibliothèque sous licence GNU Lesser General Public License qui redéfinit les fonctions sensibles de la librairie C standard. Elle a été développée par le laboratoire de recherche Avaya, issu des Bell Labs.'''
