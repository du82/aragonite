["https://cgsecurity.org/wiki/PhotoRec_Recup%C3%A9ration_de_donn%C3%A9es"]
title = "PhotoRec Recupération de données - CGSecurity"
description = "PhotoRec : Récupération de données  Développé depuis plus de dix ans, PhotoRec est, sans fausse modestie, un des logiciels de récupération de données par data-carving..."
full_description = '''PhotoRec Recupération de données From CGSecurity Jump to navigation Jump to search PhotoRec : Récupération de données Christophe GRENIER Développé depuis plus de dix ans, PhotoRec est, sans fausse modestie, un des logiciels de récupération de données par data-carving le plus performant. Rencontrez ce logiciel libre si ce n'est pas déjà le cas, dans tous les cas, découvrez son fonctionnement interne. Genèse du projet TestDisk est né en 1998, sa vocation première était de pouvoir reconstruire la table des partitions PC/Intel après la suppression accidentelle d'une partition. L'idée m'était venue de créer ce programme capable d'automatiser cette tache suite à la mésaventure d'un ami ayant décidé de repartitionner un de ses disques durs: sauvegarde des données, suppression des partitions, création des nouvelles partitions, formatage, restauration des données, "Tiens! Il semblerait que j'ai oublié de sauvegarder les données de l'une des partitions..." Retrouver les informations nécessaires à l'aide d'un éditeur hexadécimal nous avait pris la journée complète. Avec TestDisk ce même problème peut désormais être réglé en une dizaine de minutes. Dans le même esprit, peu après avoir acheté mon premier appareil photo numérique en 2002, je me suis demandé comment récupérer les photos si jamais je les effaçais par erreur ou si je reformatais la carte mémoire. Aussi ai je créé PhotoRec, un petit programme pour récupérer les photos jpg et les vidéos mov au cas où... Et dès le mois d'avril, je le distribuais sous licence GPL sur mon site web. J'ai commencé à réutiliser une partie du code correspondant à l'interface texte ncurses de TestDisk pour finir, fin 2004, par distribuer TestDisk et PhotoRec ensemble. PhotoRec a ainsi bénéficié de la popularité croissante de TestDisk. Et bien qu'il n'ai pas changé de nom, PhotoRec récupère bien plus que des photos, il récupère plusieurs centaines de formats de fichier. Contents 1 Stockage et effacement d'un fichier 2 Principe de la récupération: File undelete versus data carving 3 Data carving: identification d'un fichier 4 Data carving: limitations à la récupération des fichiers 5 Data carving: gestion de la fin de fichier 6 PhotoRec en pratique 6.1 Installation 6.2 Lancement de PhotoRec 6.3 HPA/DCO 6.4 Type de partitionnement 6.5 Sélection de la partition 6.6 Options 6.7 Familles de fichiers à récupérer 6.8 ext2/ext3/ext4 ? 6.9 Totalité de la partition ou espace libre uniquement 6.10 Destination des fichiers 6.11 C'est parti! 6.12 Vitesse de récupération 7 Ajout de signatures 8 Développement 9 Effet des mesures anti-forensics 10 Qui utilise PhotoRec ? 11 Anecdotes Stockage et effacement d'un fichier La plupart des systèmes d'exploitation essaient de stocker les données de manière contiguë de façon à minimiser la fragmentation. Le temps de recherche (en anglais seek time) des disques mécaniques est significatif lors des opérations de lecture/écriture, c'est pourquoi il est important de maintenir la fragmentation à un niveau faible. Cette contrainte disparaitra peut-être lorsque la capacité des SSD rivalisera pour un prix similaire à celui des disques mécaniques classiques. A chaque fichier est associé un ensemble de méta-informations: nom de fichier, date/heure, taille, emplacement du premier bloc de données... Selon le système de fichier ces informations sont plus ou moins riches: date/heure de création du fichier, de modification, d'accès, précision à 2 secondes près, à la seconde ou à la nano-seconde... Quand un fichier est effacé, la totalité ou une partie de ces méta-informations sont définitivement perdues. Par exemple, pour un fichier d'un système FAT, la première lettre du nom court (8 caractères pour le nom, 3 pour l'extension) est écrasée lorsque le fichier est effacé ainsi que la liste des blocs qui le composait; ces blocs deviennent libres, seul le numéro du premier bloc qui le composait reste connu. Si un nom long était présent, celui-ci reste récupérable. Sur un système de fichier ext3 ou ext4, le nom des fichiers effacés reste présent, mais l'emplacement des données, y compris du premier bloc, est perdu. Cela signifie donc que les données sont toujours présentes sur le système de fichier mais à un emplacement désormais inconnu. A noter, quelque soit le système de fichier, tout ou partie de ces données peuvent être écrasées par les données d'un nouveau fichier ou l'accroissement d'un fichier existant. Il convient donc de ne plus écrire de données sur le système de fichier. Dans la mesure du possible, démonter (umount) celui-ci pour plus de précaution. Principe de la récupération: File undelete versus data carving Pour récupérer des fichiers effacés, la première méthode consiste à analyser les structures du système de fichiers à la recherche des traces restantes après effacement. Cela permet de retrouver des fichiers effacés avec leur nom d'origine, les dates de création/modification/..., leur taille exacte mais l'implémentation est à chaque fois spécifique au système de fichier. Certains systèmes de fichiers rendent la tache difficile, voire quasi impossible. TestDisk permet la récupération de fichiers depuis les systèmes de fichier FAT, NTFS, exFAT et ext2. Depuis ext3, le pointeur indiquant le numéro de bloc est mis à zéro lorsqu'un fichier est effacé, c'est à dire que l'on a bien les noms des fichiers effacés, mais on ignore où étaient stockées les données. ext3 étant journalisé, les dernières opérations sont indiquées sous forme de transactions dans le journal. Des outils comme ext3grep vont analyser les différentes transactions du journal pour retrouver l'emplacement des données. Cependant l'efficacité de cette méthode est limitée par la taille du journal, les transactions les plus anciennes sont écrasées. La seconde méthode, le file carving, consiste à ignorer le système de fichier et à rechercher directement les données. Le début des fichiers est identifié à l'aide de caractéristiques du format de fichier utilisé: signature formée par un contenu invariant dans l'entête, ou bien pour des cas plus complexes par une propriété de l'entête de ces fichiers. Data carving: identification d'un fichier Il est possible d'utiliser les techniques de data-carving pour récupérer des fichiers ou bien des fichiers eux-même présents à l'intérieur d'autres, par exemple une image jpeg à l'intérieur d'un diaporama PowerPoint. Certains outils recherchent par défaut des fichiers à n'importe quel endroit du disque (précision d'un octet: foremost), d'autres à chaque secteur ou à chaque bloc/cluster comme PhotoRec. Pour récupérer ces fichiers perdus, PhotoRec commence par déterminer la taille des blocs de données. Si le système de fichier n'est pas corrompu, cette information peut être lue depuis le superblock (ext2/ext3/ext4) ou depuis le secteur de boot (FAT, NTFS, exFAT). Sinon, PhotoRec lit le support et utilisant sa base de signature, vérifie secteur par secteur si l'un d'eux correspond à un format de fichier connu. Une fois 10 débuts de fichier localisés ou la fin du support atteinte, PhotoRec déduit de leurs emplacements la taille des blocs. Une fois la taille des blocs connue, PhotoRec vérifie la présence de signatures connues bloc par bloc (ou cluster par cluster) au lieu de secteur par secteur, le nombre de comparaisons sera donc réduit, cela va augmenter les performances et réduire le nombre de faux-positifs (Le taux de faux-positifs n'est pas modifié). Cette base de signature native au produit n'a cessé de grossir avec chaque nouvelle version depuis la sortie du logiciel. Par exemple, PhotoRec identifie un fichier JPEG lorsqu'un bloc de données commence par : SOI (Start Of Image) + APP0: 0xff, 0xd8, 0xff, 0xe0 SOI + APP1: 0xff, 0xd8, 0xff, 0xe1 ou SOI + Comment (Commentaire): 0xff, 0xd8, 0xff, 0xfe Dans la mesure du possible, PhotoRec ne se contente pas de vérifier la présence de signature, il vérifie ensuite si certaines contraintes sur le format de fichier sont respectées. Prenons l'exemple du format de fichier image bmp. Ces fichiers commencent par les octets "BM". Cette signature est très courte et en pratique, si on l'utilise telle quelle, elle sera à l'origine de nombreux faux-positifs. Pour éviter ces faux positifs, PhotoRec va effectuer d'autres vérifications: que le champs réservé est à 0, que l'offset est inférieur à la taille totale du fichier spécifiée dans l'entête... Avec quelques autres vérifications, le problème de faux positifs sur ce format de fichier disparait. Data carving: limitations à la récupération des fichiers Le data carving permet donc la récupération de fichiers utilisant des formats de fichiers connus à partir de systèmes de fichiers, corrompus ou non, stockant les fichiers sous forme d'une suite de blocs de données (sous Windows en anglais cluster), la taille des blocs ayant été fixée lors du formatage du système de fichier. Ainsi PhotoRec va fonctionner avec la quasi totalité des systèmes de fichiers: une exception notable, ReiserFS, qui stocke les petits fichiers et la fin des fichiers (si elle est courte) dans sa structure (utiliser le paramètre notail pour désactiver ce comportement par défaut). Les données stockées dans les Alternate Data Stream (ADS) de fichiers NTFS n'étant pas des fichiers eux-mêmes ne sont pas récupérées par les méthodes de file carving. Data carving: gestion de la fin de fichier Nous venons de voir comment identifier le début d'un fichier, mais quels critères utiliser pour arrêter la sauvegarde du fichier récupéré ? Le premier critère est évident, on arrête lorsque l'on arrive à la fin du disque. Autre critère utilisé par PhotoRec: la détection d'un nouveau fichier. Ce critère n'est pas utilisable par les logiciels de data-carving travaillant octet par octet qui recherche des fichiers à l'intérieur de fichiers. Selon le format de fichier et la connaissance qu'a l'outil de celui-ci, PhotoRec définit une taille maximale du fichier, recherche une signature de fin de fichier (footer), détermine la taille du fichier à partir de son entête et récupère les données jusqu'à ce que cette taille soit atteinte, décode le fichier bloc par bloc jusqu'à rencontrer des données incompatibles avec le format de fichier... Si les données ne sont pas fragmentées, le fichier récupéré sera donc identique à l'original ou aura une taille plus grande que le fichier original, cela n’empêche généralement pas son utilisation. Dans certains cas, PhotoRec peut apprendre la taille d'origine du fichier à partir de l'entête de celui-ci; avec cette information, PhotoRec tronque le fichier à la bonne taille. Si jamais le fichier récupéré était plus petit que la taille déterminée à partir de l'entête, ce fichier est ignoré car invalide. Cependant la majorité des formats de fichier ne stocke pas la taille du fichier. Pour certains formats de fichier, il est possible de vérifier l'intégrité des données. C'est le cas par exemple des fichiers audios MP3, ils sont constitués de flux de données, chaque tronçon de données commence par une entête avec diverses informations comme la fréquence d'échantillonnage audio permettant la détermination de la taille du bloc de données. Lorsque PhotoRec analyse ces données, si l'entête ne correspond plus à celui d'un MP3, PhotoRec considère qu'il a identifié la fin du flux audio et arrête donc la récupération du fichier. Le fichier récupéré devrait donc être valide et avoir la bonne taille. Quand un fichier est récupéré avec succès, PhotoRec vérifie à nouveau les blocs de données précédents à la recherche de signature de fichier. Cela peut arriver si un fichier avait été rejeté parce qu'il était trop petit. PhotoRec essaie donc à nouveau de le récupérer. Avec un peu de chance, la suite du fichier se trouve juste après le fichier que l'on vient de récupérer. Avec cette méthode, certains fichiers fragmentés sont récupérés avec succès. PhotoRec en pratique Installation PhotoRec est multi-plateforme: sur https://www.cgsecurity.org/wiki/TestDisk_Download des versions Linux, Dos, Windows, Mac OS X sont disponibles, mais il peut aussi être compilé sous OS/2 et les différents BSD. Sous la majorité des distributions (Fedora, Debian, Ubuntu), si vous installez le package testdisk, celui-ci contiendra aussi photorec mais sous Mandriva, photorec a son propre package. Pour utiliser la version de développement, il suffit de récupérer la dernière archive, la décompresser et lancer le programme avec les droits root wget https://www.cgsecurity.org/testdisk-7.0-WIP.linux26.tar.bz2 tar xjf testdisk-7.0-WIP.linux26.tar.bz2 cd testdisk-7.0-WIP sudo ./photorec_static Lancement de PhotoRec Afin de pouvoir lire le contenu brut du disque dur ou de la carte mémoire, PhotoRec a besoin d'être exécuté avec les droits root, exemple [kmaster@adsl ~]$ cd testdisk-7.0-WIP [kmaster@adsl linux]$ sudo ./photorec_static PhotoRec présente une liste des périphériques identifiés, ici /dev/sda, /dev/sdb et /dev/sdc, trois disques SATA, /dev/sdf, une carte mémoire SD /dev/sdh, une clé USB /dev/md0, un RAID logiciel /dev/dm-0 /dev/mapper/perso, un volume chiffré (le mot de passe a été saisie, il est donc débloqué) /dev/sr0 un DVD endommagé Remarque, PhotoRec peut aussi travailler à partir d'une image disque, exemple photorec image.dd (Cf article sur l'acquisition de données) ou bien sur une image au format Expert Witness Format (EWF) utilisé par Encase Forensics, un logiciel commercial d'analyse informatique assez populaire. HPA/DCO Après avoir sélectionné mon deuxième disque SATA, PhotoRec affiche un avertissement comme quoi des zones HPA et DCO sont présentes. La zone HPA, Host Protected Area, peut être utilisée pour y placer divers utilitaires comme un utilitaire de restauration disque. Cette zone peut aussi avoir des utilisations illégitimes comme servir à dissimuler des données illégales ou y cacher un rootkit. Le Device Configuration Overlay (DCO) permet au constructeur de spécifier la taille du disque telle qu'elle sera retournée au BIOS. Ainsi le constructeur peut proposer des disques aux caractéristiques identiques au secteur prêt même s'il a modernisé sa chaine de production pour fabriquer des disques qui physiquement sont de plus grande capacité. Là encore, il y a moyen de dissimuler des informations par ce moyen. En général, il n'y a pas de raison de s'alarmer si vous avez ce message d'avertissement, vous pouvez donc passer à l'écran suivant. Évidement, si vous êtes en train d'analyser le disque à la recherche de preuves informatiques, il faudra vous pencher avec intérêt sur ces zones du disque. La détection des zones HPA/DCO est présente dans les versions Linux de PhotoRec depuis la version 6.11, mais des correctifs ont été faits dans la version 6.12 pour mieux gérer les disques faisant plus de 1 To. Type de partitionnement PhotoRec détecte automatiquement le format de la table des partitions. Il s'agit en générale de Intel/PC. Exceptions notables, les Mac Book, Mac Pro et autres produits Apple utilisent une table des partitions EFI GPT. Cette écran n'est af'''
year_published = 2019
