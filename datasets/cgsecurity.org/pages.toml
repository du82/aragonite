["https://cgsecurity.org/wiki/CmosPwd_IT"]
title = "CmosPwd IT - CGSecurity"
description = "CmosPwd decripta le password memorizzate in cmos e usate per accedere al BIOS SETUP. Funziona con i seguenti:  ACER/IBM BIOS AMI BIOS AMI WinBIOS 2.5 Award 4.5x/4..."
full_description = '''CmosPwd IT From CGSecurity Jump to navigation Jump to search English Italiano CmosPwd decripta le password memorizzate in cmos e usate per accedere al BIOS SETUP. Funziona con i seguenti: ACER/IBM BIOS AMI BIOS AMI WinBIOS 2.5 Award 4.5x/4.6x/6.0 Compaq (1992) Compaq (New version) IBM (PS/2, Activa, Thinkpad) Packard Bell Phoenix 1.00.09.AC0 (1994), a486 1.03, 1.04, 1.10 A03, 4.05 rev 1.02.943, 4.06 rev 1.13.1107 Phoenix 4 release 6 (User) Gateway Solo - Phoenix 4.0 release 6 Toshiba Zenith AMI Con CmosPwd, puoi fare il backup, restore e cancellazione del cmos. Contents 1 Download del CmosPwd 1.1 Cmos password recovery tools 5.0 2 Sviluppo CmosPwd 3 Consigli per varie marche di PC 3.1 EEPROM on laptops 3.2 Acer 3.3 Award BIOS 3.4 Dell 3.5 Fujitsu-Siemens 3.6 HP / Compaq 3.7 IBM 3.8 Sony 3.9 Toshiba 4 Links Download del CmosPwd CmosPwd è gratuito, ed è distribuito sotto licenza GPL Cmos password recovery tools 5.0 versioni DOS/Windows 9x e Windows NT/W2K/XP/2003/... , zip codice tar.bz2 CmosPwd funziona e si puo compilare sotto Dos-Win9x Windows NT/W2K/XP/2003/... Linux FreeBSD and NetBSD Sviluppo CmosPwd Per info sul nuovo CmosPwd (la release o il codice), inscriviti a cmospwd. Consigli per varie marche di PC EEPROM on laptops Sui laptop, la password si trova nella eeprom (sulla sceda madre e non sul cmos). Ti serve un programmatore e con esso recuperi la password. Se tu cancellassi per errore il cmos (ie. cmospwd /k) quando la password sta nella eeprom,, non riusciresti piu a riavviare. Puoi comprare un programmatore nei negozi di elettronica. Puoi prendere la eprom e dissaldarla o tagliarla via , e poi riprogrammarla con i comandi cmospwd /d /l eeprom_backup (oppure la riempi di zeri) . Non dimenticare di resettare il cmos. Acer Acer 630: eeprom 93c56 ? Acer Aspire 1522: Vicino alla zona tastiera, cerca il contatto SW1 (a sinistra dell'attacco della ventola), metti 1 a ON e poi accendi il netbook. Premi F2 e imposta la tua password new supervisor password, poi spegni tutto e resetta il pin 1 a OFF. Acer Travelmate 280: Vicino alla zona tastiera, cerca il contatto SW1 (a sinistra dell'attacco della ventola), metti 3 a ON, poi accendi il pc e entra senza password Acer Travelmate 6592g: Stacca la batteria gialla del cmos (vicino alla zoona DVD) e riposizionala dopo alcune ore, poi avvia tenendo premuto F2. Award BIOS AWARD 4.50 ha un trucco: esiste la super-password AWARD_SW SOYO motherboard ha la super-password "SY_MB" usabile con i PC Award 4.51. CmosPwd non recupera la password originale ma quelle equivalenti valide per Award BIOS. Dell Il metodo ufficiale è di contattare il supporto tecnico Dell che richiederà un numero d' etichetta e un codice del Pc. Se l'utente attuale non e' quello registrato , la Dell trasferirà la registrazione del pc basandosi solo su numero d'etichetta e codice. Dell Inspiron 5100: eeprom 93lc46, la password è all'indirizzo 0x310 Dell Inspiron 7500: eeprom 24c164 Dell Inspiron 8100: eeprom 24c02 Dell Latitude C600: eeprom 24c02, la password è all'indirizzo 0x00, 0x10 and 0x90 Dell Latitude C610: eeprom 24c02, la password è all'indirizzo 0x00, 0x10, 0x80 and 0x90 Dell Latitude C640: eeprom 24c04, la password è all'indirizzo 0x100 and 0x180 Dell Latitude CPI: eeprom 24c02, la password è all'indirizzo 0x00, 0x10, 0x80 Dell D600: eeprom 24c04, la password è all'indirizzo 0x110 Dell Optiplex: Togli PSWD jumper Per la maggiorparte dei PC Dell Dimension , i passi da seguire per il reset della pasword di BIOS sono: Cerca il ponte di reset della password relativo al CMOS a 3pin . Togli il ponte dai pin 1 e 2. Metti un ponte tra i pin 2 e 3 e attendi 5 seconds. Rimetti il ponte dai pin 1 e 2. Fujitsu-Siemens Vai al sito http://dogber1.blogspot.com/2009/05/table-of-reverse-engineered-bios.html HP / Compaq Compaq M700: eeprom 24C02 HP NX9010 24C02 HP Omnibook 900,2100,4150,7150: eeprom AT24c164, 0x6D-0x7F area, unknow algo put a 00 at 0x7F per cancellare la password d'amministratore HP Omnibook 6000: eeprom 24c08 or 24c164 0x50-0xBF area (maybe 0x50-0x6F only), unknow algo HP Omnibook 6100: eeprom 24c08 HP Omnibook XE3: eeprom 24c16 HP Omnibook 770x: eeprom 24c01 HP Pavilion ze4455ea: eeprom 24c08 IBM IBM Thinkpad X20: eeprom 24RFC08CN, la password è all'indirizzo 0x338 IBM TP 240: eeprom ?, la password è all'indirizzo 0x338. IBM TP 380Z: eeprom 24c01, la password è all'indirizzo 0x38 and 0x40 IBM TP 390: eeprom 24c03 (be carrefull, there are two eeprom) IBM TP 560X: eeprom 24c01, la password è all'indirizzo 0x38 and 0x40 IBM TP 570: eeprom ?, la password è all'indirizzo 0x338 and 0x3B8. IBM TP 750C,755CX,760C,765D: eeprom 93c46, la password è all'indirizzo 0x38 and 0x40 OKI M811b puo essere scritto sul chip: vicino allo slot pcmcia o al floppy IBM TP 770: eeprom 24c01 IBM TP 600E, T21, T23: 14 PIN 24RF08 IBM TP T20,X20,X30: 24RF08, la password è all'indirizzo 0x338 and 0x340 http://www.thinkwiki.org/wiki/Maintenance Sony Sony pcg-fx950: eeprom 93c46 ? VAIO 641: eeprom 24c02 mette 0 all'indirizzo 0x0 Attenzione: ci sono 2 eeprom da dissaldare (una è su controller PCI sulla scheda madre) VAIO 8851: eeprom 24c02 (ic 903) mette 0 all'indirizzo 0x0, in fondo alla scheda VAIO srx 87: eeprom 2408 mette 0 all'indirizzo 0x0 ( ic dietro il modem incima alla scheda) VAIO PCG-FX150, eeprom 24c04 al rif. IC1103 VAIO PCG-GRX560, eeprom 24c04 al rif. IC1001 VAIO PCG-FR415S, "cmospwd /k" toglie la password. Toshiba Per resettare la password di un vecchio PC Toshiba, vai a KeyDisk. Se il disco keydisk non va, prova a formare l'anello su parallela Toshiba , Attaccando alla parallela un semplice dispositivo e facendo il boot, molti PC Toshiba disabilitano la password. In dispositivo detto "ad anello" puo esser fatto con un cavo bus parallelo da 25pin (db25), che vanno così connessi: 1-5-10, 2-11, 3-17, 4-12, 6-16, 7-13, 8-14, 9-15, 18-25 Toshiba 74600C: eeprom 93c56 Links Toshiba Linux Utilities <adsense /> Retrieved from "https://www.cgsecurity.org/mw/index.php?title=CmosPwd_IT&oldid=9113"'''
year_published = 2022
year_updated = 2022
