full_description = "@chai-stuff/not-length-of Check that an object does not have a length or size property with the expected value. @chai-stuff/same-props Check that two objects have all the same properties (keys and values) but don't check that the objects' constructors are the same. @defi.org/chai-bignumber Chai assertions for comparing arbitrary-precision decimals using the bignumber.js library @jridgewell/chai-as-promised-es5 Extends Chai with assertions about promises, and ES5 (and IE11) compatible. chai-assertions-count Plugin for ChaiJS allows checking how many assertions, asserts or expects were run per each test chai-bignumber Chai assertions for comparing arbitrary-precision decimals using the bignumber.js library chai-decimaljs Chai assertions for comparing arbitrary-precision decimals using the decimal.js library chai-deep-equal-ignore-undefined Ignore keys which have undefined values to compare from a deep equal operation with chai expect chai-deep-equal-in-any-order chai plugin to match objects and arrays deep equality with arrays (including nested ones) being in any order chai-deep-match Extends Chai with an assertion for deeply matching objects (i.e. subset equality checking) chai-equal-ignore-undefined-properties Ignore keys which have undefined values to compare from a deep equal operation with chai expect chai-include-ordered-with-gaps A Chai plugin to check if an array contains some members, not necessarily successively. chai-screenshot This plugin was created to comparing two images using chai as an assertion library. It's inspired by the `haveScreenShot` method made by Playwright and [chai-image](https://github.com/mooyoul/chai-image), a repo that seems to be unmaintained. chai-sorted Chai JS Plugin for testing if an array has sorted values (strings, numbers, booleans). Very helpful when writing tests for features that implement Array.prototype.sort() chai-webdriver-promised Build more expressive integration tests with some webdriver sugar for chai.js chai-withintoleranceof A chai plugin to assert that a number is within tolerance of an expected value"
