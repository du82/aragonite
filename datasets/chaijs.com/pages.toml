ipts by @koddsson in https://github.com/chaijs/chai/pull/1424 Clean up README badges by @koddsson in https://github.com/chaijs/chai/pull/1422 fix: package.json - deprecation warning on exports field by @stevenjoezhang in https://github.com/chaijs/chai/pull/1400 fix: deep-eql bump package to support symbols by @snewcomer in https://github.com/chaijs/chai/pull/1458 ES module conversion PoC by @43081j in https://github.com/chaijs/chai/pull/1498 chore: drop commonjs support by @43081j in https://github.com/chaijs/chai/pull/1503 Update pathval by @koddsson in https://github.com/chaijs/chai/pull/1527 Update check-error by @koddsson in https://github.com/chaijs/chai/pull/1528 update deep-eql to latest version by @koddsson in https://github.com/chaijs/chai/pull/1542 Inline type-detect as a simple function by @koddsson in https://github.com/chaijs/chai/pull/1544 Update loupe by @koddsson in https://github.com/chaijs/chai/pull/1545 Typo ‘Test an object’ not ‘Test and object’ by @mavaddat in https://github.com/chaijs/chai/pull/1460 Update assertion-error to it’s latest major version! by @koddsson in https://github.com/chaijs/chai/pull/1543 Replacing Karma with Web Test Runner by @koddsson in https://github.com/chaijs/chai/pull/1546 remove codecov by @koddsson in https://github.com/chaijs/chai/pull/1548 remove chai version constant by @koddsson in https://github.com/chaijs/chai/pull/1550 Remove istanbul by @koddsson in https://github.com/chaijs/chai/pull/1549 New Contributors @Izzur made their first contribution in https://github.com/chaijs/chai/pull/1413 @koddsson made their first contribution in https://github.com/chaijs/chai/pull/1416 @stevenjoezhang made their first contribution in https://github.com/chaijs/chai/pull/1400 @43081j made their first contribution in https://github.com/chaijs/chai/pull/1498 Full Changelog: https://github.com/chaijs/chai/compare/v4.3.10…v5.0.0-rc.0 v5.0.0 Version v5.0.0 BREAKING CHANGES Chai now only supports EcmaScript Modules (ESM). This means your tests will need to either have import {...} from 'chai' or import('chai'). require('chai') will cause failures in nodejs. If you’re using ESM and seeing failures, it may be due to a bundler or transpiler which is incorrectly converting import statements into require calls. Dropped support for Internet Explorer. Dropped support for NodeJS < 18. Minimum supported browsers are now Firefox 100, Safari 14.1, Chrome 100, Edge 100. Support for browsers prior to these versions is “best effort” (bug reports on older browsers will be assessed individually and may be marked as wontfix). What’s Changed feat: use chaijs/loupe for inspection by @pcorpet in https://github.com/chaijs/chai/pull/1401 docs: fix URL in README by @Izzur in https://github.com/chaijs/chai/pull/1413 Remove get-func-name dependency by @koddsson in https://github.com/chaijs/chai/pull/1416 Convert Makefile script to npm scripts by @koddsson in https://github.com/chaijs/chai/pull/1424 Clean up README badges by @koddsson in https://github.com/chaijs/chai/pull/1422 fix: package.json - deprecation warning on exports field by @stevenjoezhang in https://github.com/chaijs/chai/pull/1400 fix: deep-eql bump package to support symbols by @snewcomer in https://github.com/chaijs/chai/pull/1458 ES module conversion PoC by @43081j in https://github.com/chaijs/chai/pull/1498 chore: drop commonjs support by @43081j in https://github.com/chaijs/chai/pull/1503 Update pathval by @koddsson in https://github.com/chaijs/chai/pull/1527 Update check-error by @koddsson in https://github.com/chaijs/chai/pull/1528 update deep-eql to latest version by @koddsson in https://github.com/chaijs/chai/pull/1542 Inline type-detect as a simple function by @koddsson in https://github.com/chaijs/chai/pull/1544 Update loupe by @koddsson in https://github.com/chaijs/chai/pull/1545 Typo ‘Test an object’ not ‘Test and object’ by @mavaddat in https://github.com/chaijs/chai/pull/1460 Update assertion-error to it’s latest major version! by @koddsson