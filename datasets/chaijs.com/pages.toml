full_description = "Online Test Suite This is the test suite that we use to test Chai during development. Use it to confirm that Chai will function correctly in your browser environment (should does not work in IE9). These tests are powered by the awesome Mocha test framework. Introduction Expect / Should Assert Plugin Utilities Online Test Suite Online Test Suite This is the test suite that we use to test Chai during development. Use it to confirm that Chai will function correctly in your browser environment (should does not work in IE9). These tests are powered by the awesome Mocha test framework. mocha.setup('bdd'); err = function (fn, msg) { try { fn(); throw new chai.AssertionError({ message: 'Expected an error' }); } catch (err) { if ('string' === typeof msg) { chai.expect(err.message).to.equal(msg); } else { chai.expect(err.message).to.match(msg); } } }; mocha.run();"
