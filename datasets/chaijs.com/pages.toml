title = "Expect / Should - Chai"
description = "Chai is a BDD / TDD assertion library for [node](http://nodejs.org) and the browser that can be delightfully paired with any javascript testing framework."
full_description = '''Introduction Expect / Should Assert Plugin Utilities Online Test Suite language chains not deep nested own ordered any all a include ok true false null undefined NaN exist empty arguments equal eql above least below most within instanceof property ownPropertyDescriptor lengthOf match string keys throw respondTo itself satisfy closeTo members oneOf change increase decrease by extensible sealed frozen finite fail fail BDD The BDD styles are expect and should. Both use the same chainable language to construct assertions, but they differ in the way an assertion is initially constructed. Check out the Style Guide for a comparison. API Reference Language Chains The following are provided as chainable getters to improve the readability of your assertions. Chains to be been is that which and has have with at of same but does still also .not Negates all assertions that follow in the chain. expect(function () {}).to.not.throw(); expect({a: 1}).to.not.have.property('b'); expect([1, 2]).to.be.an('array').that.does.not.include(3); Just because you can negate any assertion with .not doesn’t mean you should. With great power comes great responsibility. It’s often best to assert that the one expected output was produced, rather than asserting that one of countless unexpected outputs wasn’t produced. See individual assertions for specific guidance. expect(2).to.equal(2); // Recommended expect(2).to.not.equal(1); // Not recommended .deep Causes all .equal, .include, .members, .keys, and .property assertions that follow in the chain to use deep equality instead of strict (===) equality. See the deep-eql project page for info on the deep equality algorithm: https://github.com/chaijs/deep-eql. // Target object deeply (but not strictly) equals `{a: 1}` expect({a: 1}).to.deep.equal({a: 1}); expect({a: 1}).to.not.equal({a: 1}); // Target array deeply (but not strictly) includes `{a: 1}` expect([{a: 1}]).to.deep.include({a: 1}); expect([{a: 1}]).to.not.include({a: 1}); // Target object deeply (but not strictly) includes `x: {a: 1}` expect({x: {a: 1}}).to.deep.include({x: {a: 1}}); expect({x: {a: 1}}).to.not.include({x: {a: 1}}); // Target array deeply (but not strictly) has member `{a: 1}` expect([{a: 1}]).to.have.deep.members([{a: 1}]); expect([{a: 1}]).to.not.have.members([{a: 1}]); // Target set deeply (but not strictly) has key `{a: 1}` expect(new Set([{a: 1}])).to.have.deep.keys([{a: 1}]); expect(new Set([{a: 1}])).to.not.have.keys([{a: 1}]); // Target object deeply (but not strictly) has property `x: {a: 1}` expect({x: {a: 1}}).to.have.deep.property('x', {a: 1}); expect({x: {a: 1}}).to.not.have.property('x', {a: 1}); .nested Enables dot- and bracket-notation in all .property and .include assertions that follow in the chain. expect({a: {b: ['x', 'y']}}).to.have.nested.property('a.b[1]'); expect({a: {b: ['x', 'y']}}).to.nested.include({'a.b[1]': 'y'}); If . or [] are part of an actual property name, they can be escaped by adding two backslashes before them. expect({'.a': {'[b]': 'x'}}).to.have.nested.property('\\.a.\\[b\\]'); expect({'.a': {'[b]': 'x'}}).to.nested.include({'\\.a.\\[b\\]': 'x'}); .nested cannot be combined with .own. .own Causes all .property and .include assertions that follow in the chain to ignore inherited properties. Object.prototype.b = 2; expect({a: 1}).to.have.own.property('a'); expect({a: 1}).to.have.property('b'); expect({a: 1}).to.not.have.own.property('b'); expect({a: 1}).to.own.include({a: 1}); expect({a: 1}).to.include({b: 2}).but.not.own.include({b: 2}); .own cannot be combined with .nested. .ordered Causes all .members assertions that follow in the chain to require that members be in the same order. expect([1, 2]).to.have.ordered.members([1, 2]) .but.not.have.ordered.members([2, 1]); When .include and .ordered are combined, the ordering begins at the start of both arrays. expect([1, 2, 3]).to.include.ordered.members([1, 2]) .but.not.include.ordered.members([2, 3]); .any Causes all .keys assertions that follow in the chain to only require that the target have at least one of the given keys. This is the opposite of .all, which requires that the target have all of the given keys. expect({a: 1, b: 2}).to.not.have.any.keys('c', 'd'); See the .keys doc for guidance on when to use .any or .all. .all Causes all .keys assertions that follow in the chain to require that the target have all of the given keys. This is the opposite of .any, which only requires that the target have at least one of the given keys. expect({a: 1, b: 2}).to.have.all.keys('a', 'b'); Note that .all is used by default when neither .all nor .any are added earlier in the chain. However, it’s often best to add .all anyway because it improves readability. See the .keys doc for guidance on when to use .any or .all. .a(type[, msg]) @param { String } type @param { String } msg _optional_ Asserts that the target’s type is equal to the given string type. Types are case insensitive. See the type-detect project page for info on the type detection algorithm: https://github.com/chaijs/type-detect. expect('foo').to.be.a('string'); expect({a: 1}).to.be.an('object'); expect(null).to.be.a('null'); expect(undefined).to.be.an('undefined'); expect(new Error).to.be.an('error'); expect(Promise.resolve()).to.be.a('promise'); expect(new Float32Array).to.be.a('float32array'); expect(Symbol()).to.be.a('symbol'); .a supports objects that have a custom type set via Symbol.toStringTag. var myObj = { [Symbol.toStringTag]: 'myCustomType' }; expect(myObj).to.be.a('myCustomType').but.not.an('object'); It’s often best to use .a to check a target’s type before making more assertions on the same target. That way, you avoid unexpected behavior from any assertion that does different things based on the target’s type. expect([1, 2, 3]).to.be.an('array').that.includes(2); expect([]).to.be.an('array').that.is.empty; Add .not earlier in the chain to negate .a. However, it’s often best to assert that the target is the expected type, rather than asserting that it isn’t one of many unexpected types. expect('foo').to.be.a('string'); // Recommended expect('foo').to.not.be.an('array'); // Not recommended .a accepts an optional msg argument which is a custom error message to show when the assertion fails. The message can also be given as the second argument to expect. expect(1).to.be.a('string', 'nooo why fail??'); expect(1, 'nooo why fail??').to.be.a('string'); .a can also be used as a language chain to improve the readability of your assertions. expect({b: 2}).to.have.a.property('b'); The alias .an can be used interchangeably with .a. .include(val[, msg]) @param { Mixed } val @param { String } msg _optional_ When the target is a string, .include asserts that the given string val is a substring of the target. expect('foobar').to.include('foo'); When the target is an array, .include asserts that the given val is a member of the target. expect([1, 2, 3]).to.include(2); When the target is an object, .include asserts that the given object val’s properties are a subset of the target’s properties. expect({a: 1, b: 2, c: 3}).to.include({a: 1, b: 2}); When the target is a Set or WeakSet, .include asserts that the given val is a member of the target. SameValueZero equality algorithm is used. expect(new Set([1, 2])).to.include(2); When the target is a Map, .include asserts that the given val is one of the values of the target. SameValueZero equality algorithm is used. expect(new Map([['a', 1], ['b', 2]])).to.include(2); Because .include does different things based on the target’s type, it’s important to check the target’s type before using .include. See the .a doc for info on testing a target’s type. expect([1, 2, 3]).to.be.an('array').that.includes(2); By default, strict (===) equality is used to compare array members and object properties. Add .deep earlier in the chain to use deep equality instead (WeakSet targets are not supported). See the deep-eql project page for info on the deep equality algorithm: https://github.com/chaijs/deep-eql. // Target array deeply (but not strictly) includes `{a: 1}` expect([{a: 1}]).to.deep.include({a: 1}); expect([{a: 1}]).to.not.include({a: 1}); // Target object deeply (but not strictly) includes `x: {a: 1}` expect({x: {a: 1}}).to.deep.include({x: {a: 1}}); expect({x: {a: 1}}).to.not.include({x: {a: 1}}); By default, all of the target’s properties are searched when working with objects. This includes properties that are inherited and/or non-enumerable. Add .own earlier in the chain to exclude the target’s inherited properties from the search. Object.prototype.b = 2; expect({a: 1}).to.own.include({a: 1}); expect({a: 1}).to.include({b: 2}).but.not.own.include({b: 2}); Note that a target object is always only searched for val’s own enumerable properties. .deep and .own can be combined. expect({a: {b: 2}}).to.deep.own.include({a: {b: 2}}); Add .nested earlier in the chain to enable dot- and bracket-notation when referencing nested properties. expect({a: {b: ['x', 'y']}}).to.nested.include({'a.b[1]': 'y'}); If . or [] are part of an actual property name, they can be escaped by adding two backslashes before them. expect({'.a': {'[b]': 2}}).to.nested.include({'\\.a.\\[b\\]': 2}); .deep and .nested can be combined. expect({a: {b: [{c: 3}]}}).to.deep.nested.include({'a.b[0]': {c: 3}}); .own and .nested cannot be combined. Add .not earlier in the chain to negate .include. expect('foobar').to.not.include('taco'); expect([1, 2, 3]).to.not.include(4); However, it’s dangerous to negate .include when the target is an object. The problem is that it creates uncertain expectations by asserting that the target object doesn’t have all of val’s key/value pairs but may or may not have some of them. It’s often best to identify the exact output that’s expected, and then write an assertion that only accepts that exact output. When the target object isn’t even expected to have val’s keys, it’s often best to assert exactly that. expect({c: 3}).to.not.have.any.keys('a', 'b'); // Recommended expect({c: 3}).to.not.include({a: 1, b: 2}); // Not recommended When the target object is expected to have val’s keys, it’s often best to assert that each of the properties has its expected value, rather than asserting that each property doesn’t have one of many unexpected values. expect({a: 3, b: 4}).to.include({a: 3, b: 4}); // Recommended expect({a: 3, b: 4}).to.not.include({a: 1, b: 2}); // Not recommended .include accepts an optional msg argument which is a custom error message to show when the assertion fails. The message can also be given as the second argument to expect. expect([1, 2, 3]).to.include(4, 'nooo why fail??'); expect([1, 2, 3], 'nooo why fail??').to.include(4); .include can also be used as a language chain, causing all .members and .keys assertions that follow in the chain to require the target to be a superset of the expected set, rather than an identical set. Note that .members ignores duplicates in the subset when .include is added. // Target object's keys are a superset of ['a', 'b'] but not identical expect({a: 1, b: 2, c: 3}).to.include.all.keys('a', 'b'); expect({a: 1, b: 2, c: 3}).to.not.have.all.keys('a', 'b'); // Target array is a superset of [1, 2] but not identical expect([1, 2, 3]).to.include.members([1, 2]); expect([1, 2, 3]).to.not.have.members([1, 2]); // Duplicates in the subset are ignored expect([1, 2, 3]).to.include.members([1, 2, 2, 2]); Note that adding .any earlier in the chain causes the .keys assertion to ignore .include. // Both assertions are identical expect({a: 1}).to.include.any.keys('a', 'b'); expect({a: 1}).to.have.any.keys('a', 'b'); The aliases .includes, .contain, and .contains can be used interchangeably with .include. .ok Asserts that the target is a truthy value (considered true in boolean context). However, it’s often best to assert that the target is strictly (===) or deeply equal to its expected value. expect(1).to.equal(1); // Recommended expect(1).to.be.ok; // Not recommended expect(true).to.be.true; // Recommended expect(true).to.be.ok; // Not recommended Add .not earlier in the chain to negate .ok. expect(0).to.equal(0); // Recommended expect(0).to.not.be.ok; // Not recommended expect(false).to.be.false; // Recommended expect(false).to.not.be.ok; // Not recommended expect(null).to.be.null; // Recommended expect(null).to.not.be.ok; // Not recommended expect(undefined).to.be.undefined; // Recommended expect(undefined).to.not.be.ok; // Not recommended A custom error message can be given as the second argument to expect. expect(false, 'nooo why fail??').to.be.ok; .true Asserts that the target is strictly (===) equal to true. expect(true).to.be.true; Add .not earlier in the chain to negate .true. However, it’s often best to assert that the target is equal to its expected value, rather than not equal to true. expect(false).to.be.false; // Recommended expect(false).to.not.be.true; // Not recommended expect(1).to.equal(1); // Recommended expect(1).to.not.be.true; // Not recommended A custom error message can be given as the second argument to expect. expect(false, 'nooo why fail??').to.be.true; .false Asserts that the target is strictly (===) equal to false. expect(false).to.be.false; Add .not earlier in the chain to negate .false. However, it’s often best to assert that the target is equal to its expected value, rather than not equal to false. expect(true).to.be.true; // Recommended expect(true).to.not.be.false; // Not recommended expect(1).to.equal(1); // Recommended expect(1).to.not.be.false; // Not recommended A custom error message can be given as the second argument to expect. expect(true, 'nooo why fail??').to.be.false; .null Asserts that the target is strictly (===) equal to null. expect(null).to.be.null; Add .not earlier in the chain to negate .null. However, it’s often best to assert that the target is equal to its expected value, rather than not equal to null. expect(1).to.equal(1); // Recommended expect(1).to.not.be.null; // Not recommended A custom error message can be given as the second argument to expect. expect(42, 'nooo why fail??').to.be.null; .undefined Asserts that the target is strictly (===) equal to undefined. expect(undefined).to.be.undefined; Add .not earlier in the chain to negate .undefined. However, it’s often best to assert that the target is equal to its expected value, rather than not equal to undefined. expect(1).to.equal(1); // Recommended expect(1).to.not.be.undefined; // Not recommended A custom error message can be given as the second argument to expect. expect(42, 'nooo why fail??').to.be.undefined; .NaN Asserts that the target is exactly NaN. expect(NaN).to.be.NaN; Add .not earlier in the chain to negate .NaN. However, it’s often best to assert that the target is equal to its expected value, rather than not equal to NaN. expect('foo').to.equal('foo'); // Recommended expect('foo').to.not.be.NaN; // Not recommended A custom error message can be given as the second argument to expect. expect(42, 'nooo why fa'''
