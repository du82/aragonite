title = "Introduction - Chai"
description = "Chai is a BDD / TDD assertion library for [node](http://nodejs.org) and the browser that can be delightfully paired with any javascript testing framework."
full_description = "Introduction Expect / Should Assert Plugin Utilities Online Test Suite API Reference The Chai API is broken down by style or task. Assertion Styles The Expect / Should API covers the BDD assertion styles. The Assert API covers the TDD assertion style. Plugins The Plugin API will be of use to anyone interested in building plugins as helpers to DRY up your tests, or for release to the community. Tools The Online Test Suite is a live run of Chai’s test suite. Use it to ensure browser compatibility."
