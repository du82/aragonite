title = "Assert - Chai"
description = "Chai is a BDD / TDD assertion library for [node](http://nodejs.org) and the browser that can be delightfully paired with any javascript testing framework."
full_description = '''Introduction Expect / Should Assert Plugin Utilities Online Test Suite assert fail isOk isNotOk equal notEqual strictEqual notStrictEqual deepEqual notDeepEqual isAbove isAtLeast isBelow isAtMost isTrue isNotTrue isFalse isNotFalse isNull isNotNull isNaN isNotNaN exists notExists isUndefined isDefined isFunction isNotFunction isObject isNotObject isArray isNotArray isString isNotString isNumber isNotNumber isFinite isBoolean isNotBoolean typeOf notTypeOf instanceOf notInstanceOf include notInclude deepInclude notDeepInclude nestedInclude notNestedInclude deepNestedInclude notDeepNestedInclude ownInclude notOwnInclude deepOwnInclude notDeepOwnInclude match notMatch property notProperty propertyVal notPropertyVal deepPropertyVal notDeepPropertyVal nestedProperty notNestedProperty nestedPropertyVal notNestedPropertyVal deepNestedPropertyVal notDeepNestedPropertyVal lengthOf hasAnyKeys hasAllKeys containsAllKeys doesNotHaveAnyKeys doesNotHaveAllKeys hasAnyDeepKeys hasAllDeepKeys containsAllDeepKeys doesNotHaveAnyDeepKeys doesNotHaveAllDeepKeys throws doesNotThrow operator closeTo approximately sameMembers notSameMembers sameDeepMembers notSameDeepMembers sameOrderedMembers notSameOrderedMembers sameDeepOrderedMembers notSameDeepOrderedMembers includeMembers notIncludeMembers includeDeepMembers notIncludeDeepMembers includeOrderedMembers notIncludeOrderedMembers includeDeepOrderedMembers notIncludeDeepOrderedMembers oneOf changes changesBy doesNotChange changesButNotBy increases increasesBy doesNotIncrease increasesButNotBy decreases decreasesBy doesNotDecrease doesNotDecreaseBy decreasesButNotBy ifError isExtensible isNotExtensible isSealed isNotSealed isFrozen isNotFrozen isEmpty isNotEmpty Assert The assert style is very similar to node.js’ included assert module, with a bit of extra sugar. Of the three style options, assert is the only one that is not chainable. Check out the Style Guide for a comparison. API Reference assert(expression, message) @param { Mixed } expression to test for truthiness @param { String } message to display on error Write your own test expressions. assert('foo' !== 'bar', 'foo is not bar'); assert(Array.isArray([]), 'empty arrays are arrays'); .fail([message]) .fail(actual, expected, [message], [operator]) @param { Mixed } actual @param { Mixed } expected @param { String } message @param { String } operator Throw a failure. Node.js assert module-compatible. assert.fail(); assert.fail("custom error message"); assert.fail(1, 2); assert.fail(1, 2, "custom error message"); assert.fail(1, 2, "custom error message", ">"); assert.fail(1, 2, undefined, ">"); .isOk(object, [message]) @param { Mixed } object to test @param { String } message Asserts that object is truthy. assert.isOk('everything', 'everything is ok'); assert.isOk(false, 'this will fail'); .isNotOk(object, [message]) @param { Mixed } object to test @param { String } message Asserts that object is falsy. assert.isNotOk('everything', 'this will fail'); assert.isNotOk(false, 'this will pass'); .equal(actual, expected, [message]) @param { Mixed } actual @param { Mixed } expected @param { String } message Asserts non-strict equality (==) of actual and expected. assert.equal(3, '3', '== coerces values to strings'); .notEqual(actual, expected, [message]) @param { Mixed } actual @param { Mixed } expected @param { String } message Asserts non-strict inequality (!=) of actual and expected. assert.notEqual(3, 4, 'these numbers are not equal'); .strictEqual(actual, expected, [message]) @param { Mixed } actual @param { Mixed } expected @param { String } message Asserts strict equality (===) of actual and expected. assert.strictEqual(true, true, 'these booleans are strictly equal'); .notStrictEqual(actual, expected, [message]) @param { Mixed } actual @param { Mixed } expected @param { String } message Asserts strict inequality (!==) of actual and expected. assert.notStrictEqual(3, '3', 'no coercion for strict equality'); .deepEqual(actual, expected, [message]) @param { Mixed } actual @param { Mixed } expected @param { String } message Asserts that actual is deeply equal to expected. assert.deepEqual({ tea: 'green' }, { tea: 'green' }); .notDeepEqual(actual, expected, [message]) @param { Mixed } actual @param { Mixed } expected @param { String } message Assert that actual is not deeply equal to expected. assert.notDeepEqual({ tea: 'green' }, { tea: 'jasmine' }); .isAbove(valueToCheck, valueToBeAbove, [message]) @param { Mixed } valueToCheck @param { Mixed } valueToBeAbove @param { String } message Asserts valueToCheck is strictly greater than (>) valueToBeAbove. assert.isAbove(5, 2, '5 is strictly greater than 2'); .isAtLeast(valueToCheck, valueToBeAtLeast, [message]) @param { Mixed } valueToCheck @param { Mixed } valueToBeAtLeast @param { String } message Asserts valueToCheck is greater than or equal to (>=) valueToBeAtLeast. assert.isAtLeast(5, 2, '5 is greater or equal to 2'); assert.isAtLeast(3, 3, '3 is greater or equal to 3'); .isBelow(valueToCheck, valueToBeBelow, [message]) @param { Mixed } valueToCheck @param { Mixed } valueToBeBelow @param { String } message Asserts valueToCheck is strictly less than (<) valueToBeBelow. assert.isBelow(3, 6, '3 is strictly less than 6'); .isAtMost(valueToCheck, valueToBeAtMost, [message]) @param { Mixed } valueToCheck @param { Mixed } valueToBeAtMost @param { String } message Asserts valueToCheck is less than or equal to (<=) valueToBeAtMost. assert.isAtMost(3, 6, '3 is less than or equal to 6'); assert.isAtMost(4, 4, '4 is less than or equal to 4'); .isTrue(value, [message]) @param { Mixed } value @param { String } message Asserts that value is true. var teaServed = true; assert.isTrue(teaServed, 'the tea has been served'); .isNotTrue(value, [message]) @param { Mixed } value @param { String } message Asserts that value is not true. var tea = 'tasty chai'; assert.isNotTrue(tea, 'great, time for tea!'); .isFalse(value, [message]) @param { Mixed } value @param { String } message Asserts that value is false. var teaServed = false; assert.isFalse(teaServed, 'no tea yet? hmm...'); .isNotFalse(value, [message]) @param { Mixed } value @param { String } message Asserts that value is not false. var tea = 'tasty chai'; assert.isNotFalse(tea, 'great, time for tea!'); .isNull(value, [message]) @param { Mixed } value @param { String } message Asserts that value is null. assert.isNull(err, 'there was no error'); .isNotNull(value, [message]) @param { Mixed } value @param { String } message Asserts that value is not null. var tea = 'tasty chai'; assert.isNotNull(tea, 'great, time for tea!'); .isNaN @param { Mixed } value @param { String } message Asserts that value is NaN. assert.isNaN(NaN, 'NaN is NaN'); .isNotNaN @param { Mixed } value @param { String } message Asserts that value is not NaN. assert.isNotNaN(4, '4 is not NaN'); .exists @param { Mixed } value @param { String } message Asserts that the target is neither null nor undefined. var foo = 'hi'; assert.exists(foo, 'foo is neither `null` nor `undefined`'); .notExists @param { Mixed } value @param { String } message Asserts that the target is either null or undefined. var bar = null , baz; assert.notExists(bar); assert.notExists(baz, 'baz is either null or undefined'); .isUndefined(value, [message]) @param { Mixed } value @param { String } message Asserts that value is undefined. var tea; assert.isUndefined(tea, 'no tea defined'); .isDefined(value, [message]) @param { Mixed } value @param { String } message Asserts that value is not undefined. var tea = 'cup of chai'; assert.isDefined(tea, 'tea has been defined'); .isFunction(value, [message]) @param { Mixed } value @param { String } message Asserts that value is a function. function serveTea() { return 'cup of tea'; }; assert.isFunction(serveTea, 'great, we can have tea now'); .isNotFunction(value, [message]) @param { Mixed } value @param { String } message Asserts that value is not a function. var serveTea = [ 'heat', 'pour', 'sip' ]; assert.isNotFunction(serveTea, 'great, we have listed the steps'); .isObject(value, [message]) @param { Mixed } value @param { String } message Asserts that value is an object of type ‘Object’ (as revealed by Object.prototype.toString). The assertion does not match subclassed objects. var selection = { name: 'Chai', serve: 'with spices' }; assert.isObject(selection, 'tea selection is an object'); .isNotObject(value, [message]) @param { Mixed } value @param { String } message Asserts that value is not an object of type ‘Object’ (as revealed by Object.prototype.toString). var selection = 'chai' assert.isNotObject(selection, 'tea selection is not an object'); assert.isNotObject(null, 'null is not an object'); .isArray(value, [message]) @param { Mixed } value @param { String } message Asserts that value is an array. var menu = [ 'green', 'chai', 'oolong' ]; assert.isArray(menu, 'what kind of tea do we want?'); .isNotArray(value, [message]) @param { Mixed } value @param { String } message Asserts that value is not an array. var menu = 'green|chai|oolong'; assert.isNotArray(menu, 'what kind of tea do we want?'); .isString(value, [message]) @param { Mixed } value @param { String } message Asserts that value is a string. var teaOrder = 'chai'; assert.isString(teaOrder, 'order placed'); .isNotString(value, [message]) @param { Mixed } value @param { String } message Asserts that value is not a string. var teaOrder = 4; assert.isNotString(teaOrder, 'order placed'); .isNumber(value, [message]) @param { Number } value @param { String } message Asserts that value is a number. var cups = 2; assert.isNumber(cups, 'how many cups'); .isNotNumber(value, [message]) @param { Mixed } value @param { String } message Asserts that value is not a number. var cups = '2 cups please'; assert.isNotNumber(cups, 'how many cups'); .isFinite(value, [message]) @param { Number } value @param { String } message Asserts that value is a finite number. Unlike .isNumber, this will fail for NaN and Infinity. var cups = 2; assert.isFinite(cups, 'how many cups'); assert.isFinite(NaN); // throws .isBoolean(value, [message]) @param { Mixed } value @param { String } message Asserts that value is a boolean. var teaReady = true , teaServed = false; assert.isBoolean(teaReady, 'is the tea ready'); assert.isBoolean(teaServed, 'has tea been served'); .isNotBoolean(value, [message]) @param { Mixed } value @param { String } message Asserts that value is not a boolean. var teaReady = 'yep' , teaServed = 'nope'; assert.isNotBoolean(teaReady, 'is the tea ready'); assert.isNotBoolean(teaServed, 'has tea been served'); .typeOf(value, name, [message]) @param { Mixed } value @param { String } name @param { String } message Asserts that value’s type is name, as determined by Object.prototype.toString. assert.typeOf({ tea: 'chai' }, 'object', 'we have an object'); assert.typeOf(['chai', 'jasmine'], 'array', 'we have an array'); assert.typeOf('tea', 'string', 'we have a string'); assert.typeOf(/tea/, 'regexp', 'we have a regular expression'); assert.typeOf(null, 'null', 'we have a null'); assert.typeOf(undefined, 'undefined', 'we have an undefined'); .notTypeOf(value, name, [message]) @param { Mixed } value @param { String } typeof name @param { String } message Asserts that value’s type is not name, as determined by Object.prototype.toString. assert.notTypeOf('tea', 'number', 'strings are not numbers'); .instanceOf(object, constructor, [message]) @param { Object } object @param { Constructor } constructor @param { String } message Asserts that value is an instance of constructor. var Tea = function (name) { this.name = name; } , chai = new Tea('chai'); assert.instanceOf(chai, Tea, 'chai is an instance of tea'); .notInstanceOf(object, constructor, [message]) @param { Object } object @param { Constructor } constructor @param { String } message Asserts value is not an instance of constructor. var Tea = function (name) { this.name = name; } , chai = new String('chai'); assert.notInstanceOf(chai, Tea, 'chai is not an instance of tea'); .include(haystack, needle, [message]) @param { Array | String } haystack @param { Mixed } needle @param { String } message Asserts that haystack includes needle. Can be used to assert the inclusion of a value in an array, a substring in a string, or a subset of properties in an object. assert.include([1,2,3], 2, 'array contains value'); assert.include('foobar', 'foo', 'string contains substring'); assert.include({ foo: 'bar', hello: 'universe' }, { foo: 'bar' }, 'object contains property'); Strict equality (===) is used. When asserting the inclusion of a value in an array, the array is searched for an element that’s strictly equal to the given value. When asserting a subset of properties in an object, the object is searched for the given property keys, checking that each one is present and strictly equal to the given property value. For instance: var obj1 = {a: 1} , obj2 = {b: 2}; assert.include([obj1, obj2], obj1); assert.include({foo: obj1, bar: obj2}, {foo: obj1}); assert.include({foo: obj1, bar: obj2}, {foo: obj1, bar: obj2}); .notInclude(haystack, needle, [message]) @param { Array | String } haystack @param { Mixed } needle @param { String } message Asserts that haystack does not include needle. Can be used to assert the absence of a value in an array, a substring in a string, or a subset of properties in an object. assert.notInclude([1,2,3], 4, "array doesn't contain value"); assert.notInclude('foobar', 'baz', "string doesn't contain substring"); assert.notInclude({ foo: 'bar', hello: 'universe' }, { foo: 'baz' }, 'object doesn't contain property'); Strict equality (===) is used. When asserting the absence of a value in an array, the array is searched to confirm the absence of an element that’s strictly equal to the given value. When asserting a subset of properties in an object, the object is searched to confirm that at least one of the given property keys is either not present or not strictly equal to the given property value. For instance: var obj1 = {a: 1} , obj2 = {b: 2}; assert.notInclude([obj1, obj2], {a: 1}); assert.notInclude({foo: obj1, bar: obj2}, {foo: {a: 1}}); assert.notInclude({foo: obj1, bar: obj2}, {foo: obj1, bar: {b: 2}}); .deepInclude(haystack, needle, [message]) @param { Array | String } haystack @param { Mixed } needle @param { String } message Asserts that haystack includes needle. Can be used to assert the inclusion of a value in an array or a subset of properties in an object. Deep equality is used. var obj1 = {a: 1} , obj2 = {b: 2}; assert.deepInclude([obj1, obj2], {a: 1}); assert.deepInclude({foo: obj1, bar: obj2}, {foo: {a: 1}}); assert.deepInclude({foo: obj1, bar: obj2}, {foo: {a: 1}, bar: {b: 2}}); .notDeepInclude(haystack, needle, [message]) @param { Array | String } haystack @param { Mixed } needle @param { String } message Asserts that haystack does not include needle. Can be used to assert the absence of a value in an array or a subset of properties in an object. Deep equality'''
