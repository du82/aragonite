full_description = "Getting Started Guide + - Installation Node.js Browser Other Platforms + - Assertion Styles Assert Expect Should Differences Should Extras Configuration + - Using Chai with ESM and Plugins Importing Chai Using Plugins Exposing Globals in Plugins + - Core Plugin Concepts Accessing Utilities Using Flags Composing an Assertion + - Building a Helper Adding Language Chains Adding Properties Adding Methods Methods as Properties Overwriting Language Chains Overwriting Properties Overwriting Methods + - Resources Getting Help Contributing Resources If you have questions or issues, please use this projects GitHub Issues. You can also keep up to date on the Google Group or ping @jakeluer directly on Twitter. Chai developers can also be found on Freenode IRC in #letstest.js. Developing Please avoid making changes to the browser versions of chai if you are developing in the browser. All changes to the library are to be made to lib/* and then packaged for the browser using the make command. Testing Tests are written in exports style on mocha test framework. There is a test file for each of the interfaces. The tests for expect and assert must pass in node.js and in the browser, whereas the should tests only need to pass on node.js. Browsers tests are currently known to pass in Chrome 16 and Firefox 8. Please let me know if you can test in other browsers or other version. Server Side Testing It’s quite simple… make test Browser Side Testing It’s also quite simple. Open up test/browser/index.html in your nearest browser. Building If you have made changes to any of the components, you must rebuild the browser package. $ make Contributors repo age : 1 year, 5 months active : 123 days commits : 638 files : 55 authors : 476 Jake Luer 74.6% 66 Veselin Todorov 10.3% 42 Domenic Denicola 6.6% 6 Ruben Verborgh 0.9% 5 Juliusz Gonera 0.8% 5 Scott Nonnenberg 0.8% 5 Jo Liss 0.8% 4 josher19 0.6% 4 John Firebaugh 0.6% 4 Nick Heiner 0.6% 3 Jeff Barczewski 0.5% 2 Edwin Shao 0.3%