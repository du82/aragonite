Small typo in test.js by @mavaddat in https://github.com/chaijs/chai/pull/1459 docs: specify return type of objDisplay by @scarf005 in https://github.com/chaijs/chai/pull/1490 Update CONTRIBUTING.md by @matheus-rodrigues00 in https://github.com/chaijs/chai/pull/1521 Fix: update exports.version to current version by @peanutenthusiast in https://github.com/chaijs/chai/pull/1534 New Contributors @bugwelle made their first contribution in https://github.com/chaijs/chai/pull/1487 @mavaddat made their first contribution in https://github.com/chaijs/chai/pull/1459 @scarf005 made their first contribution in https://github.com/chaijs/chai/pull/1490 @matheus-rodrigues00 made their first contribution in https://github.com/chaijs/chai/pull/1521 @peanutenthusiast made their first contribution in https://github.com/chaijs/chai/pull/1534 Full Changelog: https://github.com/chaijs/chai/compare/v4.3.7…v4.3.8 v5.0.0-alpha.1 Version v5.0.0-alpha.1 What’s Changed chore: drop commonjs support by @43081j in https://github.com/chaijs/chai/pull/1503 Update pathval by @koddsson in https://github.com/chaijs/chai/pull/1527 Update check-error by @koddsson in https://github.com/chaijs/chai/pull/1528 Full Changelog: https://github.com/chaijs/chai/compare/v5.0.0-alpha.0…v5.0.0-alpha.1 v5.0.0-alpha.0 Version v5.0.0-alpha.0 This release is the first alpha release for Chai 5. The changes from v4.x: This package now uses ESM modules. CommonJS environments are no longer supported. If you wish to use a CommonJS environment, please continue to use Chai 4. Drop support for NodeJS versions less than 16. If you are using NodeJS v4-v15, please continue to use Chai 4. Drop support for Internet Explorer 10 & 11. If you wish to test against Internet Explorer 10 or 11 please continue to use Chai 4. Drop support for Safari versions less than 14. If you wish to test against Safari v10-v13 please continue to use Chai 4. Drop support for EdgeHTML. If you wish to test against Edges older than 18 (as in, not Chromium Edge) please continue to use Chai 4. Drop support for Firefox versions less than 102. If you wish to test against Firefox 60 through to 101 please continue to use Chai 4. Drop support for Chrome versions less than 108. If you wish to test against Chrome 68 through 107 please continue to use Chai 4. v4.3.7 Version v4.3.7 What’s Changed fix: deep-eql bump package to support symbols comparison by @snewcomer in https://github.com/chaijs/chai/pull/1483 Full Changelog: https://github.com/chaijs/chai/compare/v4.3.6…v4.3.7 Version v4.3.6 Update loupe to 2.3.1 Version v4.3.5 build chaijs fca5bb1 build(deps-dev): bump codecov from 3.1.0 to 3.7.1 (#1446) 747eb4e fix package.json exports 022c2fa fix: package.json - deprecation warning on exports field (#1400) 5276af6 feat: use chaijs/loupe for inspection (#1401) (#1407) c8a4e00 https://github.com/chaijs/chai/compare/v4.3.4…v4.3.5 Version v4.3.4 This fixes broken inspect behavior with bigints (#1321) (#1383) thanks @vapier 4.3.3 / 2021-03-03 Version 4.3.3 This reintroduces Assertion as an export in the mjs file. See https://github.com/chaijs/chai/pull/1378 & https://github.com/chaijs/chai/issues/1375 4.3.2 / 2021-03-03 Version 4.3.2 This fixes a regression in IE11. See https://github.com/chaijs/chai/pull/1380 & https://github.com/chaijs/chai/issues/1379 4.3.1 / 2021-03-02 Version 4.3.1 This releases fixed an engine incompatibility with 4.3.0 The 4.x.x series of releases will be compatible with Node 4.0. Please report any errors found in Node 4 as bugs, and they will be fixed. The 5.x.x series, when released, will drop support for Node 4.0 This fix also ensures pathval is updated to 1.1.1 to fix CVE-2020-7751 4.3.0 / 2021-02-04 Version 4.3.0 This is a minor release. Not many changes have got in since the last release but this one contains a very important change (#1257) which will allow jest users to get better diffs. From this release onwards, jest users will be able to see which operator was used in their diffs. The operator is a property of the AssertionError thrown when assertions fail. This flag indicates what kind of comparison was made. This is also an important change for plugin maintainers. Plugin maintainers will now have access to the operator flag, which they can have access to through an util method called getOperator`. Thanks to all the amazing people that contributed to this release. New Features Allow contain.oneOf to take an array of possible values (@voliva) Adding operator attribute to assertion error (#1257) (@rpgeeganage) The closeTo error message will now inform the user when a delta is required (@eouw0o83hf) Docs Add contains flag to oneOf documentation (@voliva) Tests Make sure that useProxy config is checked in overwriteProperty (@vieiralucas) Add tests for contain.oneOf (@voliva ) Chores Update mocha to version 6.1.4 Add node v10 and v12 to ci (@vieiralucas) Drop support for node v4, v6 and v9 (@vieiralucas) Fix sauce config for headless chrome (@meeber) Update dev dependencies (@meeber) Removed phantomj"
