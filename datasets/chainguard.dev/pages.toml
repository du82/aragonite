full_description = "HomeOpen SourceSecuring OSS Is Not OptionalWe are a team of founders, maintainers, and contributors to the ecosystem's largest projects.SigstoreSigstore is the new standard for signing, verifying and protecting open source software.sigstore.devKubernetesThe most widely used open source system to deploy, scale, and manage containerized applications.kubernetes.ioWolfiThe first community (un)distro built with default security measures for the software supply chain.wolfi.dev202Collective years of experience in open source100+Projects actively maintained by Chainguardians250+Hours a week spent contributing to OSS18Chainguardians who hold leadership positions in OSSCommunity LeadershipWe contribute, maintain, and help lead some of the most widely relied upon open source software projects.Kim LewandowskiChainguard CPO & Co-FounderDan LorencChainguard CEO & Co-FounderPriya WadhwaSigstore Technical Steering CommitteeJosh DolitskyOCI Technical Oversight BoardCarlos PanatoKubernetes Steering CommitteeOSS ProjectsContribute. Maintain. Secure.Our roots are in open source.WolfiCommunity (un)distro for supply chain.KubernetesContainer orchestration system.SigstoreSign, verify, and protect software.SLSASoftware supply chain framework.WolfiCommunity (un)distro for supply chain.KubernetesContainer orchestration system.SigstoreSign, verify, and protect software.SLSASoftware supply chain framework.TektonStandardized CI/CD tooling.OCIStandards for container formats.OpenVexSpecification and reference toolchain.KnativeServerless containers in Kubernetes.TektonStandardized CI/CD tooling.OCIStandards for container formats.OpenVexSpecification and reference toolchain.KnativeServerless containers in Kubernetes.CommunityOpen Source Projects Using Chainguard ImagesTimoniTimoni is a package manager for Kubernetes, powered by CUE and inspired by Helm. The Timoni project strives to improve the UX of authoring Kubernetes configs. Instead of mingling Go templates with YAML like Helm, or layering YAML on top of each-other like Kustomize, Timoni relies on cuelang's type safety, code generation and data validation features to offer a better experience of creating, packaging and delivering apps to Kubernetes.Read moreVisit projectInfracostInfracost shows cloud cost estimates and FinOps best practices for Terraform. It lets engineers see a cost breakdown and understand costs before making changes, either in the terminal, VS Code or pull requests.Read moreVisit projectkoko is a simple, fast container image builder for Go applications. It's ideal for use cases where your image contains a single Go application without any/many dependencies on the OS base image (e.g., no cgo, no OS package dependencies).Read moreVisit projectKubepugA Kubectl plugin that verifies the current Kubernetes cluster or input files, checking whether objects exist in deprecated API Versions.Read moreVisit projectTektonTekton is a powerful and flexible open-source framework for creating CI/CD systems, allowing developers to build, test, and deploy across cloud providers and on-premise systems.Read moreVisit projectOckamOckam empowers developers to build secure-by-design apps that can trust data-in-motion.Read moreVisit projectFollow Our OSS CommunityGithubFollow our work on GitHub and join in on the fun.WolfiWolfi is a community Linux OS designed for the container and cloud-native era.AcademyLearn how to make your software supply chain secure by default."
