full_description = "Chainguard PricingBuild Better Software with Threat-Resistant Chainguard ContainersHobbyistsStarter ImagesSelect set of unguarded containers with no SLA and only :latest versions of software. Free to test and deploy.Features:Pure distroless or minimal +extra variantsBuild-time SBOMsScanner support Security advisory feedsSLSA Level 2 build infrastructureGet Started for FreeEnterprisesProduction Images1,200+ Chainguard Containers with all versions of supported software and guarded protection under our CVE Remediation SLA.Application ImagesServers, Dev Tools, and DatabasesBase ImagesLanguages and FrameworksFIPS ImagesFIPS Validation and OS-Level STIGsAI ImagesGPU-Based ML WorkloadsEverything in Starter Images, plus:CVE Remediation SLA (7 Days for a Critical CVE, 14 Days for High / Medium / Low)All major and minor versions of software (i.e., Python 3.8-3.13)Available through Chainguard’s registry or your preferred registry of choiceChainguard Console to manage images, entitlements, pull tokens, and moreDedicated customer support and implementation services Talk to SalesStartup Pricing Available. Scale Containerization Safely and Securely from the Start.Get Startup PricingThe Safe Source for Open SourceThe world's leading companies trust ChainguardSee what our customers have to say“It’s a remarkable thing when you introduce Chainguard Images and see the vulnerability count plummet. Watching various applications go from hundreds or even thousands of vulnerabilities down to zero overnight is a really powerful testament to what Chainguard Images can do. And we would not have been able to get [to FedRAMP High] without their support.”Brandon StearneSenior Manager of Product Security, Snowflake“Anduril is redefining what defense contractors look like, in part by implementing commercial technology and moving at the pace of relevance. Doing so while remaining compliant in a highly regulated environment is extremely challenging. Chainguard Images help us deliver on this mission with hardened container images that lead the market in secure software development.”Joe McCaffreyCISO, Anduril“With Chainguard, we're able to meet and maintain stringent compliance requirements for software vulnerabilities, and their Images product seamlessly integrates within our developer workflows, delivering instant results, and secure outcomes.”Sandeep JohriCEO, Checkmarx“Our partnership with Chainguard enabled us to meet or exceed the rigorous standards required in highly regulated industries and government sectors where we serve our customers. By reducing the burden of patching and hardening associated with managing supply chain risks, we can increase our developers' focus on driving innovation in support of our customers' missions.”Andrew CunjeCISO, Appian“We have adopted Chainguard Images to reduce the burden of vulnerability triage on our developers so they can focus on building and establishing a secure avenue for the broad adoption of AI technologies. We are thrilled to see Chainguard expand its offering to include AI and ML workloads and look forward to working together to bring secure AI innovation to the forefront.”Jacob RideoutCTO, HiddenLayer“With Chainguard STIG-ready Images, our platform engineers are able to save months of engineering effort when it comes to audit and compliance readiness. A process that was once grueling and toilsome now just takes a couple of minutes.”Shaun McDonnellDirector of Platform Engineering, Shift5Frequently Asked QuestionsWhat is the difference between Starter and Production Images?How do you license Chainguard Images?What’s the difference between Chainguard base and application images?What is the difference between a pure distroless and +extra image variant?What is included with the purchase of a FIPS Image?Can you help me achieve FedRAMP Compliance?Do you offer discounts?We’re a small startup with limited resources. Can we afford Chainguard?How do we receive images from Chainguard?What scanners do you support? Do you offer your own scanner?Not sure which plan is right for you?Learn about customized pricing plans or request a demo tailored to your team's workflows.Let's Chat"
