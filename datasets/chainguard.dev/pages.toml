urce software licenses that govern the Software.1.4. Feedback. Customer may from time to time provide suggestions, comments, or other feedback to Chainguard with respect to the Software or Services (“Feedback”). Customer hereby grants to Chainguard a non-exclusive, worldwide, perpetual, irrevocable, transferable, sublicensable, royalty- free, fully paid up license to use and exploit the Feedback for any purpose.1.5. Free Trials. Chainguard may make Software and Services available to Customer on a no-fee basis for a 30 day period (“Free Trial”). Chainguard reserves the right to terminate Customer’s Free Trial, in Chainguard’s sole discretion, prior to the Free Trial expiration date. Upon the termination of the Free Trial, Customer will no longer have access to the Software and the Services unless Customer executes an Order with Chainguard. Free Trials are provided for Customer’s evaluation purposes only. Customer acknowledges and agrees that Free Trials are provided on an “as-is” basis, with no express or implied warranties, and Chainguard shall not have any indemnification or support obligations. Free Trials may be subject to additional terms and conditions that may be presented to Customer upon Free Trial registration. 1.6. Data Collected. Chainguard will process and store Customer personal information in accordance with its Privacy Notice (https://www.chainguard.dev/privacy-notice). Chainguard will only process data that is minimally necessary in order to provide the Services to you and authenticate your access to the Chainguard Registry.2.FEES AND PAYMENT2.1. Fees. Customer shall pay to Chainguard all fees as set forth in each applicable Order(s) (collectively, the “Fees”). Fees are non-refundable. 2.2. Payment Terms. Chainguard will invoice Customer in accordance to the billing frequency stated in the applicable Order. All amounts payable to Chainguard under this Agreement shall be paid in United States dollars and shall be due thirty (30) days from the date of 