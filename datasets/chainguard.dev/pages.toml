poses of this Agreement, “Customer Data” shall mean any data, information or other material provided, uploaded, or submitted by Customer to the Service in the course of using the Service. Customer shall retain all right, title and interest in and to the Customer Data, including all intellectual property rights therein.3.5 Aggregated de-identified dataNotwithstanding anything to the contrary, Chainguard may freely use Aggregated De-identified Data for Chainguard’s business purposes (including without limitation, for purposes of improving, testing, operating, promoting and marketing Chainguard’s current and future products and services). “Aggregated De-identified Data” means data submitted to, collected by, or generated by Chainguard in connection with Customer’s use of the Service, but only in aggregate, de-identified form which is not linked specifically to Customer or any individual.3.6 Personal dataCustomer acknowledges and agrees that it may use the Service or Software in connection with personal data subject to the EU General Data Protection Regulation (the “GDPR”) only if Customer first enters into the Chainguard Data Processing Agreement (the “Chainguard DPA”); in which case, the processing of personal data pursuant to this Agreement shall be subject to the Chainguard DPA.‍3.7 Service suspensionChainguard may suspend Customer’s access to or use of the Service as follows: (a) immediately if Chainguard reasonably believes Customer’s use of the Service may pose a security risk to or may adversely impact the Service; (b) immediately if Customer become insolvent, has ceased to operate in the ordinary course, made an assignment for the benefit of creditors, or becomes the subject of any bankruptcy, reorganization, liquidation, dissolution or similar proceeding; (c) following ten (10) days written notice if Customer is in breach of this Agreement.4. Terms applicable to the Chainguard software4.1 License grantSubject to the terms and conditions of this Agreement, Chainguard makes Chainguard proprietary software available to Customer, Chainguard hereby grants to Customer, and Customer hereby accepts from Chainguard, a term-limited, non-exclusive, non-transferable, non-assignable and non-sublicensable license to make use of the Chainguard software made available to Customer in connection with this Agreement (the “Software”) solely for the Authorized Use.4.2 License limitationsCustomer agrees that, it shall not: (a) exceed the scope of the licenses granted in Section 4.1; (b) make copies of the Software; (c) distribute, sublicense, assign, delegate, rent, lease, sell, time- share or otherwise transfer the benefits of, use under, or rights to, the license granted in Section 4.1; (d) reverse engineer, decompile, disassemble or otherwise attempt to learn the source code, structure or algorithms underlying the Software, except to the extent required to be permitted under applicable law; (e) modify, translate or create derivative works of the Software; (f) remove any copyright, trademark, patent or other proprietary notice that appears on the Software or copies thereof; or (g) combine or distribute any of the software with any third party software that is licensed under terms that seek to require that any of the Software (or any associated intellectual property rights) be provided in source code form (e.g., as “open source”), licensed to others to allow the creation or distribution of derivative works, or distributed without charge.5. Terms of termination5.1 TermThe term of this Agreement shall commence on the date You first download the Software or access the Service (the “Effective Date”), and unless terminated earlier according to this Section 5, will terminate at the end of the Authorized Use (the “Term”).5.2 TerminationThis Agreement may be terminated: (a) by either party if the other has materially breached this Agreement, within ten (10) calendar days after written notice of such breach to the other party if the breach is remediable or immediately upon notice if the breach is not remediable; or (b) by Chainguard at any time and for any reason upon notice to Customer, or by terminating access or use.5.3 Effect of terminationUpon any expiration or termination of this Agreement, Customer shall (i) immediately cease use of the Registry, Service, and Software, and (ii) return all Chainguard Confidential Information and other materials and information provided by Chainguard.5.4 SurvivalThe following provisions will survive termination of this Agreement: Sections 3.4 (Use of Customer Data), 3.5 (Aggregated De-Identified Data), 5.3 (Effect of Termination), Section 5.4 (Survival), Section 6 (Confidentiality), Section 9 (Limitation of Liability), Section 10 (Miscellaneous).6. Confidentiality and ownership6.1During the term of this Agreement, either party may provide the other party with confidential and/or proprietary materials and information (“Confidential Information”). All materials and information provided by the disclosing party and identified at the time of disclosure as “Confidential” or bearing a similar legend, and all other information that the receiving party reasonably should have known was the Confidential Information of the disclosing party, shall be considered Confidential Information. This Agreement is Confidential Information, and all pricing terms are Chainguard Confidential Information. The receiving party shall maintain the confidentiality of the Confidential Information and will not disclose such information to any third party without the prior written consent of the disclosing party. The receiving party will only use the Confidential Information internally for the purposes contemplated hereunder. The obligations in this Section shall not apply to any information that: (a) is made generally available to the public without breach of this Agreement, (b) is developed by the receiving party independently from and without reference to the Confidential Information, (c) is disclosed to