["https://chainguard.dev/legal/cookie-policy"]
title = "Cookie Policy"
description = "Chainguard’s commitment to transparency: Delve into our cookie policy for a clear understanding of data usage and privacy."
full_description = 'HomeLegalCookie PolicyTerms & PoliciesLearn more about Chainguard policies and our legal documents.Acceptable Use PolicyCookie PolicySupport PoliciesLimited Use AgreementPrivacy NoticeSoftware License AgreementTerms of UseInbound Vulnerability Disclosure PolicyOutbound Vulnerability Disclosure PolicyOpen Source FAQTrademark Use PolicySelect legal documentLast Updated: December 31, 2022This Cookie Policy explains how Chainguard Inc. ("Company", "we", "us", and "our") uses cookies and similar technologies to recognize you when you visit our websites at https://chainguard.dev, ("Websites"). It explains what these technologies are and why we use them, as well as your rights to control our use of them.In some cases we may use cookies to collect personal information, or that becomes personal information if we combine it with other information.What are cookies?Cookies are small data files that are placed on your computer or mobile device when you visit a website. Cookies are widely used by website owners in order to make their websites work, or to work more efficiently, as well as to provide reporting information.Cookies set by the website owner (in this case, Chainguard Inc.) are called "first party cookies". Cookies set by parties other than the website owner are called "third party cookies". Third party cookies enable third party features or functionality to be provided on or through the website (e.g. like advertising, interactive content and analytics). The parties that set these third party cookies can recognize your computer both when it visits the website in question and also when it visits certain other websites.Why do we use cookies?We use first and third party cookies for several reasons. Some cookies are required for technical reasons in order for our Websites to operate, and we refer to these as "essential" or "strictly necessary" cookies. Other cookies also enable us to track and target the interests of our users to enhance the experience on our Online Properties. Third parties serve cookies through our Websites for advertising, analytics and other purposes.What about other tracking technologies, like web beacons?Cookies are not the only way to recognize or track visitors to a website. We may use other, similar technologies from time to time, like web beacons (sometimes called "tracking pixels" or "clear gifs"). These are tiny graphics files that contain a unique identifier that enable us to recognize when someone has visited our Websites or opened an e-mail including them. This allows us, for example, to monitor the traffic patterns of users from one page within a website to another, to deliver or communicate with cookies, to understand whether you have come to the website from an online advertisement displayed on a third-party website, to improve site performance, and to measure the success of e-mail marketing campaigns. In many instances, these technologies are reliant on cookies to function properly, and so declining cookies will impair their functioning.Do you use Flash cookies or Local Shared Objects?Websites may also use so-called "Flash Cookies" (also known as Local Shared Objects or "LSOs") to, among other things, collect and store information about your use of our services, fraud prevention and for other site operations.If you do not want Flash Cookies stored on your computer, you can adjust the settings of your Flash player to block Flash Cookies storage using the tools contained in the Website Storage Settings Panel. You can also control Flash Cookies by going to the Global Storage Settings Panel and following the instructions (which may include instructions that explain, for example, how to delete existing Flash Cookies (referred to "information" on the Macromedia site), how to prevent Flash LSOs from being placed on your computer without your being asked, and (for Flash Player 8 and later) how to block Flash Cookies that are not being delivered by the operator of the page you are on at the time).Please note that setting the Flash Player to restrict or limit acceptance of Flash Cookies may reduce or impede the functionality of some Flash applications, including, potentially, Flash applications used in connection with our services or online content.Do you serve targeted advertising?Third parties may serve cookies on your computer or mobile device to serve advertising through our Websites. These companies may use information about your visits to this and other websites in order to provide relevant advertisements about goods and services that you may be interested in. They may also employ technology that is used to measure the effectiveness of advertisements. This can be accomplished by them using cookies or web beacons to collect information about your visits to this and other sites in order to provide relevant advertisements about goods and services of potential interest to you. The information collected through this process does not enable us or them to identify your name, contact details or other details that directly identify you unless you choose to provide these.How often will you update this Cookie Policy?We may update this Cookie Policy from time to time in order to reflect, for example, changes to the cookies we use or for other operational, legal or regulatory reasons. Please therefore re-visit this Cookie Policy regularly to stay informed about our use of cookies and related technologies. The date at the top of this Cookie Policy indicates when it was last updated.Security Disclosures or QuestionsPlease direct security disclosures or questions about our bug bounty program to security@chainguard.devWhere can I get further information?If you have any questions about our use of cookies or other technologies, please email us at terms@chainguard.dev or by post to: Chainguard, Inc. 810 7th St S Kirkland, WA 98033 United States Phone: (425) 242-4836 terms@chainguard.dev‍'
