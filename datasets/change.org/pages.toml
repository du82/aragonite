  Working Together





















  
  






  Life at Change





















  
  






  01





















  
  






  Embedding DEI





















  
  






  Change.org has a mission to cultivate a dynamic and inclusive workplace culture where every employee feels valued, connected, and inspired to contribute their best. We aim to enhance engagement through meaningful interactions, continuous development opportunities, and fostering a sense of community and belonging.





















  
  






  02





















  
  






  Bonding & Traveling





















  
  






  Connecting is a non-negotiable, and we invest in onboarding retreats called Ready for Change that bring us closer and help us better understand ourselves, the business, and others. We also love our EOY parties and departmental get-togethers throughout the year.





















  
  






  03





















  
  






  Building Community





















  
  






  There are four Community Resource Groups (CRGs)—API, Women/Nonbinary, Latinx, and LGBTQIA+—that hold regular meetings. Past CRG events have included panels, speaker series, cooking classes, happy hours, and all team call presentations.





















  
  






  04





















  
  






  Constantly Communicating





















  
  






  We hear from leadership through monthly C Team reports, departmental Town Halls, and transparency updates on our All Team Calls.





















  
  




  
  
  


  


  
  



    
  
                    

