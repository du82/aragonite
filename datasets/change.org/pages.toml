description = "Change.org, PBC (“Change.org”) is a public benefit corporation registered in the State of Delaware, United States. Change.org is fully owned by The Change.org Charitable Foundation, a 501c3 nonprofit organization. Change.org’s mission is to empower people everywhere to create the change they want to see. We want to build the best possible technology to show you […]"
full_description = "Privacy PolicyLast updated: January 14, 2025PoliciesTermsPrivacyCookiesCommunity Guidelines Change.org, PBC (“Change.org”) is a public benefit corporation registered in the State of Delaware, United States. Change.org is fully owned by The Change.org Charitable Foundation, a 501c3 nonprofit organization. Change.org’s mission is to empower people everywhere to create the change they want to see. We want to build the best possible technology to show you relevant petitions that you can help win, and also protect your privacy and security online. Our Privacy Policy outlines how we obtain information from you and what we do with it. It also explains the choices you can make to control your privacy when you use Change.org. Table of contents Key contacts Information we collect How we use your information Who may receive your information Your privacy choices Data retention and information security Cross-border transfers Links to other websites California Consumer Privacy Act CARU COPPA Safe Harbor Program (“CARU COPPA Safe Harbor”) Policy updates 1. Key contacts Here’s how to reach us for data privacy, security, and other topics listed below. For all other questions, the best way to get in touch with us is through our Help Center. Because email or postal communications are not always secure, please do not include credit card or other sensitive information in your emails or letters to us. 1. Your account, petitions, contributions: If you have any questions about managing your account, petitions, or contributions, please contact us through our Help Center. 2. Data privacy Data Controller: Change.org, PBC Post: 548 Market Street, #29993, San Francisco, CA 94104-5401, USA E-mail: Data Protection Officer, dpt@change.org For decision makers in the EU/UK: Our platform enables petition starters to designate specific people who they believe to be the “decision maker” empowered to act upon the subject of their petition. For decision makers located in the EU/UK, the petition starter’s inclusion of your data means that the petition starter is also a data controller. If you would like to make a data subject request, contact dpt@change.org with your contact details and the petition URL, and Change.org will process your request in compliance with applicable laws and our internal policies. Regional and National Representatives European Union: Change.org, Servicios Promocionales España, S.L. Post: Carrer de Santaló, 10, 1st Floor, 08021 Barcelona, Spain E-mail: dpt@change.org United Kingdom: Change.org Worldwide Limited E-mail: dpt@change.org India: Grievance/Nodal Officer E-mail: GrievanceOfficer.India@change.org Canada: Privacy Officer E-mail: dpt@change.org 3. Law enforcement: If you are a law enforcement officer with a legal inquiry, contact us at dpt@change.org. 4. Decision makers: If you are a decision maker and want to get in touch with the petition starter, you can post a public response on the petition page on our platform, or contact us through our Help Center and we will do our best to relay your message to the petition starter. 5. Account security: If you suspect someone else is using your account, or your account security has been compromised, contact us at dpt@change.org. 6. Platform security: If you believe you have discovered a vulnerability, bug, or other general security issue within the Change.org platform, contact the Change.org Information Security Team at security.help@change.org. 7. Other: For all other inquiries, please contact us through our Help Center and we will do our best to assist you. Messages sent to the contacts listed above that are outside the scope of the corresponding topics will be routed back to the Help Center for assistance; please refrain from sending repeated messages or emailing multiple contacts, as this may slow down our response time! 2. Information we collect For platform users, petition starters and petition signers To provide our services and show you relevant content we need to know a little about you and your interests. Here we outline what information Change.org collects, and how we collect it. When you sign or create a petition via our Change.org platform, an account is created for you; all of your activities on Change.org are then tied to this account. In the chart below, we’ve detailed the information we may collect about you, depending on your activities on the platform, and how we obtain this information. What we collectHow we collect itYour name.We require you to provide a chosen name when you create a Change.org account.Your email address.We require you to provide an email address when you create a Change.org account.Your password.We require you to enter a password when you create a Change.org account.Your IP address. Your “IP Address” is a designator that is automatically assigned to the computer that you are using by your Internet Service Provider (ISP).An IP Address may be identified and logged automatically in our server log files whenever you use our platform and services, along with the time of your visit and the specific page(s) that you visited. We may use your IP Address to derive geolocation data.Your postal address.You may choose to provide your postal address when you create a Change.org account. Providing this information is not required to use the service.Your telephone number.You may choose to provide your telephone number when you create a Change.org account. Providing this information is not required to use the service.Your city.We use the IP service Maxmind to suggest your city from your IP address, in order to show you local petitions that may be of interest. You can change this information if it is displayed incorrectly. We do not share your information with Maxmind. Providing a city is required to use the service.Your state/province.We use the IP service Maxmind to suggest your state/province from your IP address, in order to show you local petitions that may be of interest. You can change this information if it is displayed incorrectly. We do not share your information with Maxmind. Providing a state/province is required to use the service.Your country.As mentioned above, we use the IP service Maxmind to suggest your city from your IP address, in order to show you local petitions that may be of interest. This enables us to determine your country. We do not share your information with Maxmind. Providing a country is required to use the service.Your profile picture.You may choose to upload a profile picture when you create an account, or at any time. Providing this information is not required to use the service.Your specific activities on or connected to the Change.org platform. These might include petitions you have started or signed, shared, or promoted, or whether you decide to become a Change.org member.When you are signed in or identified as a particular Change.org user, your activities on or connected to the Change.org platform are automatically associated with your account.Any other information you voluntarily submit.You may be offered the choice to provide other information to us. For example, we may collect information when you respond to user surveys, or when you provide information when we assist you by telephone. Providing this information is not required to use the service.The name of the browser you use to access Change.org.Certain information is collected by most browsers or automatically through your device, such as your Media Access Control (MAC) address, computer type (Windows PC or Mac), screen resolution, operating system name and version, device manufacturer and model, language, Internet browser type and version, and the name and version of the Change.org platform you are using. Collecting this information helps us build and deliver the best possible version of Change.org to you.Your social media account ID, and information shared with us via your social media account.Linking a social media account is not required to access the service. You have the option to add social media handles to your Change.org profile. If you sign a petition by logging into a third-party account, we receive your name and email address from the third party.Information about the issues you care about based on your activities on the platform.As part of our efforts to connect people to causes that interest them, petitions you sign might be tagged by our users or by us as particular cause areas. For example, a petition may be tagged as “animal rights” or “women’s rights”. If you sign one petition tagged in a particular cause area, we may infer that you would be interested in other petitions tagged in the same way. We may also send you petitions that are relevant to your general geographic area.Currently in the United States only, we use information available in public records, or other publicly available databases, such as civic data APIs which help match citizens with the elected officials who represent them in all levels of the government.In the United States, we receive data from the “Google Civic Information API” that contains lists of federal office holders and legislators, state legislators, and governors. That data is integrated into our platform to enable users in the United States to accurately identify the correct decision maker for their petition. We also use this data to match petitions from a particular district to the right political representative. We do not share any user data via the “Google Civic Information API.” In the future, we may carry out similar activities in other countries, subject to applicable law.Information collected through cookies as disclosed in our Cookie PolicyWe, and/or our service providers, may use cookies, pixel tags (also known as web beacons and clear GIFs), and other similar technologies to understand user activities. Like other websites, Change.org will not function properly if cookies are not enabled. We use third-party analytics services like Google Analytics provided by Google Inc. (“Google”), the Amplitude service provided by Amplitude (“Amplitude”), the Optimizely service provided by Optimizely (“Optimizely”), and the Looker service provided by Looker Data Sciences, Inc. These analytics services may use cookies and similar technologies to analyze how people use our services and provide statistical reports about aggregated user behavior. Such services may also collect information about platform visitors’ use of other websites. Please review our Cookie Policy for detailed information on the cookies we use, and how you can manage these.The currency of any contributions made through Change.org.We infer your currency based on your country.The transaction amount you contributed or received through a refund or otherwise.Your payment information, including your credit card or bank number, expiration date, billing address and transaction amount is collected on our payment page by a third-party payment processor and will be subject to its privacy policy. We have no control over, and are not responsible for, the third-party’s collection, use, and disclosure of your personal information. We receive information on payment amount only; no other payment information is stored or saved within our systems. For decision makers Our platform enables petition starters to designate specific people who they believe to be the “decision maker” empowered to act upon the subject of their petition. If you are identified as a decision maker for a petition, we may process your personal information. In the chart below, we’ve detailed the information we may collect about you. Please note that if you create an account on our platform, the section above, “For platform users, petition starters and petition signers,” will also apply to you. What we collectHow we collect itYour name.If you are identified as a decision maker, your name may be provided to us.Your email address.If you are identified as a decision maker, your email address may be provided to us.Your office, title, and/or organizationIf you are identified as a decision maker, your office, title, and/or organization may be provided to us.Your profile picture.If you are identified as a decision maker, your public profile photo may be added.Any other information you voluntarily submit.You may decide to respond to a petition that identifies you as a decision maker. Your response will be published on the petition page.Currently in the United States only, we use information available in public records, or other publicly available databases, such as civic data APIs which help match citizens with the elected officials who represent them in all levels of the government.In the United States, we receive data from the “Google Civic Information API” that contains lists of federal office holders and legislators, state legislators, and governors. That data is integrated into our platform to enable users in the United States to accurately identify the correct decision maker for their petition. We also use this data to match petitions from a particular district to the right political representative. We do not share any user data via the “Google Civic Information API.” In the future, we may carry out similar activities in other countries, subject to applicable law. Please note that if you are a prominent public figure, we may use the above-mentioned information to create a decision maker profile page for you, in order to enable petition starters to more accurately direct their petitions towards the public figures best positioned to respond to their request. As a decision maker, you and/or your designee can reach out to us to update the information on your profile by contacting our support team through our Help Center. Some of the information above reveals your specific identity, or is directly tied to your specific identity, such as your name and email address. Some of this information does not reveal your specific identity, or does not directly relate to you, such as your browser and device information or information collected through cookies. If we ever combine non-personally identifiable information with personally identifiable information, the combined information will be treated by us as personally identifying information and protected accordingly. Our services are not directed to people under the age of thirteen (13) or under the legal age of consent in your country of residence (for example, in some countries, you must be age 16 years or older), and we do not knowingly collect personal information from them, unless otherwise permitted by law. 3. How we use your information For platform users, petition starters and petition signers Here are the ways we might use your information to run our platform, provide our services, and serve you better content. Where required by applicable law, we and our service providers will rely on your consent whether implied or express and may use your information for our legitimate business interests in providing a petition platform that enables people to connect with issue"
