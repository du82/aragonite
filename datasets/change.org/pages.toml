["https://www.change.org/p/stjohnscounty-release-virgilio-aguilar-mendez-immediately"]
title = "Petición · Liberen a Virgilio Aguilar Mendez inmediatamente! - Estados Unidos · Change.org"
description = """
ENGLISH
Virgilio Aguilar Méndez, un joven Indígena-Maya Mam de 18 años originario de Guatemala, cuyo idioma principal es el Mam se encuentra actualmente detenido sin fianza en el condado de St. John's por un delito que NO cometió.
El pasado 19 de mayo de 2023, cuando estaba parado afuera del motel en el que residía mientras hablaba por teléfono con su papá, Virgilio fue víctima de brutalidad polic"""
full_description = '''Detalles de la peticiónComentariosLiberen a Virgilio Aguilar Mendez inmediatamente!Liberen a Virgilio Aguilar Mendez inmediatamente!Inició4 de enero de 2024Petición paraWhy are we charging someone with manslaughter for the natural death of a police officer?Victoria¡Esta petición logró su objetivo con el apoyo de 610,960 personas!Difunde esta peticiónTop supporter voices¿Por qué es importante esta petición?Iniciada por Mariana BlancoENGLISH Virgilio Aguilar Méndez, un joven Indígena-Maya Mam de 18 años originario de Guatemala, cuyo idioma principal es el Mam se encuentra actualmente detenido sin fianza en el condado de St. John's por un delito que NO cometió. El pasado 19 de mayo de 2023, cuando estaba parado afuera del motel en el que residía mientras hablaba por teléfono con su papá, Virgilio fue víctima de brutalidad policial y violación de su cuarta enmienda, el derecho a estar libre de búsquedas e incautaciones irrazonables. El sargento Kunovich dijo que "parecía sospechoso" y comenzó a gritarle a Virgilio. Virgilio expresó en más de una ocasión que no hablaba inglés y que estaba residiendo en ese motel, esta interacción resultó en una lucha de 8 minutos en la que Virgilio fue físicamente maltratado y taseado múltiples veces por varios oficiales, a pesar de dejar claro a los oficiales involucrados que no entendía inglés, y a pesar de que Virgilio mide 5 pies 4 pulgadas y pesa 115 libras. El sargento Kunovich sufrió un ataque al corazón minutos después de la lucha y falleció en el hospital. Los forenses determinaron que el sargento Kunovich murió de causas naturales. A pesar de esta conclusión, la Oficina del Sheriff del Condado de St. John y la Fiscalía del Séptimo Circuito Judicial de Florida han acusado a Virgilio de homicidio involuntario agravado de un oficial de policía y están intentando condenar a Virgilio de por vida por presuntos delitos que no cometió. El sargento Kunovich murió a causa de un ataque al corazón como resultado de un incidente que él mismo inició innecesaria e inconstitucionalmente; no provocado por Virgilio, sino por una condición preexistente. Virgilio ha estado detenido desde mayo de 2023 sin fianza, completamente aislado debido a que su lengua materna es el MAM. Después de la muerte de Kunovich, el sheriff electo del condado de St. John, Robert Hardwick, mintió descaradamente al público en vivo durante una conferencia de prensa rodeado de otros funcionarios electos, anunciando que Virgilio Aguilar fue detenido porque estaba cometiendo un allanamiento y que sacó un cuchillo contra el sargento Kunovich, lo cual fue la razón por la que declararon a Kunovich y los demás oficiales comenzaron a arrestar y usar la fuerza contra Virgilio. Los videos de las cámaras corporales publicados después de esta conferencia de prensa revelan que nunca se sacó un cuchillo contra el sargento Kunovich y que no hubo ningún allanamiento en los videos o informes policiales; socavando así la credibilidad de la oficina que lidera el sheriff Hardwick y perpetuando la desconfianza de la gente hacia los funcionarios electos. Antes de que el sargento Michael Kunovich detuviera a Virgilio, no había delito posible. Exigimos la liberación inmediata de Virgilio Aguilar Méndez y que los cargos sean retirados de inmediato, ya que la Oficina del Sheriff del Condado de St. John violó sus derechos constitucionales y civiles. Estos derechos protegen a todas las personas dentro de este país, independientemente de su estatus migratorio. Si Virgilio es condenado y sentenciado a prisión por este incidente, sentará un precedente extremadamente peligroso en este país; porque si un oficial de policía muere a causa de un ataque al corazón durante un encuentro entre la policía y un ciudadano, cualquier persona en este país puede ser acusada, condenada y sentenciada a cadena perpetua por la muerte de ese oficial. Este precedente iría en contra de los principios fundamentales de libertad y justicia, que son sagrados en nuestro país. Virgilio Aguilar Méndez es un adolescente Indígena-Maya Mam, y enfatizamos que los migrantes Indígenas se ven afectados de manera desproporcionada por el racismo, la discriminación, la antiindigeneidad, siendo mal etiquetados como latinos y las barreras de idiomas Indígenas. No es un delito estar parado afuera de tu lugar de residencia. Exigimos que el gobernador Ron DeSantis y el fiscal del séptimo circuito, RJ Larizza, intervengan en la desestimación de este caso de inmediato, ya que los derechos de Virgilio están siendo violados y desatendidos por la Oficina del Sheriff del Condado de St. John. Virgilio ha estado en la cárcel durante 7 meses y seguirá allí por un período indefinido a menos que lo liberen.Difunde esta peticiónVictoria¡Esta petición logró su objetivo con el apoyo de 610,960 personas!Difunde esta peticiónComparte esta petición en persona o utiliza el código QR en tus diseños de promoción.Descargar código QRDenunciar una violación de las políticasTomador de decisionesWhy are we charging someone with manslaughter for the natural death of a police officer?Change.orgjusticiaLiberen a Virgilio Aguilar Mendez inmediatamente!'''
year_published = 2025
