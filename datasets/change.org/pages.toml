title = "Press · Change.org"
full_description = "Welcome to the US press office of Change.org, the world’s largest platform for social change. Our press team loves connecting journalists with the incredible people using Change.org to start, grow, and win campaigns on issues they care about. If you’re a journalist interested in speaking to a petition organizer or member of the Change.org staff team, please email press@change.org. Keep up to date with the latest campaigns by following @changedotorg on Instagram and TikTok, and @change on Twitter. Our team can Put you in touch with people who have started petitions on Change.org. Surface major national trends and fast-growing petitions. Provide data – like signer location, growth rate, etc. – on petitions. Offer expert comment and analysis from some of the world’s leading experts on people power, online campaigning, and digital politics and engagement. Coordinate with brands and influencers to help with petition creation for important causes. Provide speakers for conferences, seminars, and workshops. Please also get in touch if you are a Decision Maker (on the receiving end of a petition), and wish to respond. Your response will be published on the petition and emailed to the petition signers. Change by the numbers More than 115 million users in the US More than 450 million users in 196 countries More than 175 staff members in 25 countries What people are saying about Change.org “Change.org has emerged as one of the most influential channels for activism in the country.” – Washington Post “The go-to site for Web uprisings.” – New York Times “Change.org has long helped give voice to the voiceless.” – Essence Resources Blog Frequently Asked Questions FAQ Business Model About Promoted Promotions Logo Social Media Twitter Instagram TikTok Facebook LinkedIn"
