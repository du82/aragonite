title = "Cookie Policy · Change.org"
description = "Like all platforms, we use cookies and other similar technologies for the site to function, and to give you a better and more personalized experience of Change.org. This policy outlines which cookies we use and explains how you can manage them. Table of Contents What is a cookie? What cookies do we use? How do […]"
full_description = "Cookie PolicyLast updated: February 20, 2025PoliciesTermsPrivacyCookiesCommunity Guidelines Like all platforms, we use cookies and other similar technologies for the site to function, and to give you a better and more personalized experience of Change.org. This policy outlines which cookies we use and explains how you can manage them. Table of Contents What is a cookie? What cookies do we use? How do I manage cookies? Policy updates What is a cookie? Cookies are standard features of websites that allow us to store small amounts of data on your computer about your visit to the Change.org platform. They help us learn which areas of the platform are useful and which areas need improvement. On Change.org, we use cookies for many things, which we explain in detail below and which include: to remember your preferred language and country; to help you log in again when you revisit the platform; to connect your Change.org account to your social media account, if you choose to do so; and to help our engineers improve the platform, by understanding how people find us and what devices they’re using. The section below, titled “How do I manage cookies?”, outlines the choices you can make to control cookies. However, if you disable cookies and similar technologies, your experience on the platform may be diminished and some features may not work as intended. What cookies do we use? Below we list the different types of cookies that may be used by Change.org. Our Privacy Policy complements this Cookie Policy and outlines how any information that may be collected from cookies is used. Essential Cookies Essential cookies enable you to navigate our platform and to use our services and features. Without these cookies, our website and platform will not perform as smoothly for you as we would like, and we may not be able to provide certain core functions and features of our platform. CookieUse / categorization rationale__cf_bmUsed by Cloudflare to prevent certain attacks (DDoS) and other security risks.__cf_ob_info__cf_use_ob__cf*__cfduid__cfruid__cfuid__stripe_midUsed by Stripe to prevent fraud.__stripe_sid_change_idUsed by Change to track user state and login._change_lang_change_session_px3Used by Human Security (formerly PerimeterX) to detect fraud and bot activity._pxff_*_pxvidapp_meta_ppmu_ty_receiptUsed by Change to track various user preferences, such as banner dismissals, promotions, and unsubscriptions.app_meta_promoted_tyapp_meta_starter_dash_prompt_bannerapp_meta_unsubscribe_gtmcidUsed by Stripe to provide payment options and security.cookie_bannerUsed by Change to store cookie preferences.countryUsed by Change to show users content specific to the country set in their profile.docs.prefsUsed by Stripe to provide payment options and security.dont_auto_login_via_facebookUsed by Change to allow users to disconnect their Facebook account.enforce_policyUsed by Paypal to provide payment options and security.fbsr_*Used by Facebook to facilitate login and sharing on Change.org.G_AUTHUSER_HUsed by Google to facilitate login and sharing on Change.org.G_ENABLED_IDPSHSIDUsed by Google/YouTube to track Google account ID and the most recent sign-in time for security purposes.l7_azUsed by Paypal to provide payment options and security.LANGmachine_identifierUsed by Stripe to prevent fraud.membership_viewUsed by Change to personalize membership program signup options to be displayed.New Relic scriptUsed by New Relic to gather performance metrics (e.g., page load times, transaction traces, possibly IP addresses for geolocation).optimizelyEndUserIdUsed by Optimizely to include or exclude a user in experiments per their consent.optimizelyOptOutpending-signature-*Used by Change to keep track of signatures that require user authentication to be completed.private_machine_identifierUsed by Stripe to provide payment options and security.pxctsUsed by Human Security (formerly PerimeterX) to detect fraud and bot activity.recent-viewsUsed by Stripe to provide payment options and security.Sentry scriptUsed by Sentry to collect error logs, stack traces, device/browser info, IP addresses, and other details that help diagnose errors.SIDUsed by Google/YouTube to track Google account ID and the most recent sign-in time for security purposes.stripe.csrfUsed by Stripe to provide payment options and security.tsUsed by Paypal to provide payment options and security.ts_ctsrceuuidUsed by Change to track user state and login.VISITOR_INFO1_LIVEUsed by YouTube to measure internet bandwidth to determine if user gets new or old Youtube player interface.X-PP-SILOVERUsed by Paypal to provide payment options and security. Preference Cookies Preference cookies collect information about your choices and preferences, allow us to remember local settings, and customize your experience accordingly. CookieUse / categorization rationaleapp_download_banner_closed_countUsed by Change to track a user’s preference and times seen regarding banners, inclusive of policy update banners, GDPR compliance banners, and customer satisfaction survey banners.app_meta_membership_before_you_goUsed by Change to track users’ membership page visits.app_meta_membership_reminderapp_meta_public_signature_*Used by Change to track a user’s signature display preference.mem_banner_xUsed by Change to track user preferences for membership banner dismissal.mem_card_xOTZUsed by Google for preferences tracking.starter-banner-petition-[petitionID]Used by Change to track a user’s preference and times seen regarding banners, inclusive of policy update banners, GDPR compliance banners, and customer satisfaction survey banners.tos_banner_remaining_views_* Analytics Cookies Analytics cookies collect information about how you use Change.org, like which pages you visited and which links you click on. None of this information can be used to identify you. It is all aggregated and, therefore, anonymized. Their sole purpose is to improve website functions. CookieUse / categorization rationale__stripe_orig_propsUsed by Stripe to analyze and improve their payment services.__utm*Used by Google Analytics to distinguish users and sessions._airbrake_session_*Used by Change and Airbrake for error and performance monitoring._gaUsed by Google Analytics to distinguish users on multiple platforms (e.g. change.org, optimizely.com, paypal.com, twitter.com)._gid_gat*Used by Google Tag Manager to throttle request rates.Experiments_*Used by Change for experiments to evaluate our product.ga_first_visitUsed by Google Analytics to remember the traffic source and browser of users’ first visit to the site.NIDUsed by Google for preferences tracking.optimizelyRedirectDataUsed by Optimizely to run Change product-related experiments.YSCUsed by YouTube to track play counts. Marketing Cookies Marketing cookies track your activity to help deliver more relevant content or advertising or to limit how many times you see an ad. These cookies can share that information with other organizations or advertisers. CookieUse / categorization rationale__Secure-3PAPISIDUsed by YouTube for ads on Google/YouTube.__Secure-3PSID__Secure-3PSIDCC_gcl_auUsed by Google Tag Manager to store and track conversions._uetsidUsed by Microsoft Advertising for ads on Bing._uetvidAPISIDUsed for ads on Google.NIDUsed by Google for preferences tracking.PREFUsed for ads on Google.SAPISIDUsed by DoubleClick for ads on Google/YouTube.SIDCCUsed for ads on Google.SSIDUsed by YouTube for ads on Google/YouTube. How do I manage cookies? You can manage your cookie preferences and out-out of preference, analytics, and marketing cookies with the cookie manager. Policy updates This is a snapshot of how we use cookies today; we may change this Cookie Policy if we change our use of cookies over time. The “last updated” date at the top of this page indicates when this page was last changed. Please refer to our Privacy Policy for more information about Change.org’s data usage. If you have specific questions, please reach out to the appropriate contact listed in our Privacy Policy [1. Key contacts]. Thanks for supporting change in your community — we can’t wait to see what you’ll change next!"
