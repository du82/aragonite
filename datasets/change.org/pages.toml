["https://change.org/decision-makers/university-of-georgia"]
title = "University of Georgia - Petitions & Information - Change.org · Change.org"
full_description = "Stop University laboratories from testing on and euthanizing beagles!The University of Georgia has been experimenting vaccines on beagles in a study that involves the ultimate killing of the dogs. In fact, did to their docile, trusting nature, beagles are the breed most commonly tested on. The National Institute of Allergy and Infectious Diseases (NIAID), a division of the National Institutes of Health, run by Anthony Fauci is responsible for this. They directed $424,455 to the University of Georgia in September 2020 to infect 28 beagles with disease-causing parasites. This infection has no cure, so after three months of being infected, these dogs are then killed, and their blood examined. Beagles are sensitive, intelligent and loyal creatures, neither they nor any other dog breed should be subjected this is cruel and inhumane treatment. This experiment started in November of 2020 after being conducted on other animals. The study recorded pain responses from the beagles being tested in this needless, supplementary study. So many beagles have suffered as a result of this useless testing already, and we must stop further abuse of our loyal companions. The Environmental Protection Agency has already committed to stopping all testing on mammals by 2035, but means 14 more years of animals suffering in the name of science. According the the USDA, a 50,000 dogs were experimented on in US testing facilities in 2020! There are Universities all over the country conducting these same experiments on dogs- we must do something to protect our canine companions - so please join me in signing this petition to stop this torture on dogs immediately. 0 media mentions75,185 signatures Install Emergency Blue Lights on University of Georgia's CampusAs female student at the University of Georgia, I am deeply heartbroken and alarmed by the recent murder that occurred on our campus. This tragic event happened in a park where many women, including myself, used to feel safe. Many students this morning even spoke of plans to visit Lake Herrick to enjoytoday's beautiful weather. Lake Herrick is owned by UGA, a place we trusted. The lack of emergency blue lights has been an ongoing issue that can no longer be ignored. These lights can instantly contact the police and make them aware of a dangerous situation. They can also deter crimes. According to the National Institute of Justice, improved street lighting led to crime reduction in about half of the areas studied (Farrington & Welsh, 2002). By implementing enhanced lighting systems across campus and installing blue lights for emergency calls, we can significantly improve safety conditions for all students. Campuses across the United States are pleading for better lighting as a safety measure. Many students walk around campus at night to attend classes or study sessions. Our female students, when first visiting campus, notice UGA's roads and sidewalks are remarkably dark or dimly lit at night. The fear of being unsafe should not be an additional burden on their academic journey. The University of Georgia created UGASafe, an application that has abundant safety features, including a mobile blue light. We plead for additional safety measures. Students may be unfamiliar with the application, and a smartphone may offload the app after prolonged periods of no use. Blue lights would provide a guaranteed form of communication in times of danger. We are calling upon the University of Georgia administration in Athens, GA to take immediate action. We urge them to prioritize student safety by implementing these necessary changes swiftly and effectively.Please join us in this crucial effort by signing this petition today. Let's ensure our campus is a safe space for everyone who calls it home.18 media mentions25,969 signatures"
