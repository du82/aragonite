description = "Petition to Address the Workforce Housing Crisis in Miami-Dade County To the Members of the Board of County Commissioners for Miami-Dade County, We, the undersigned residents, students, voters, and advocates for a thriving Miami-Dade County, urge you to prioritize and address the critical shortage of workforce housing available for purchase in our community. The absence of affordable homeownership"
full_description = "Make Miami AffordableMake Miami AffordableRecent signersMiguel Rodriguez•31 seconds agoChen Nasr•38 seconds agoMaria Patel•1 minute agoRaj Chen•1 minute agoMaria Huang•2 minutes agoMei Jones•2 minutes agoAshley Rahman•2 minutes agoAarti Chowdhury•3 minutes agoHao Chowdhury•3 minutes agoValentina Reddy•3 minutes agoTao Malhotra•4 minutes agoJiang Torres•4 minutes agoValentina Diaz•5 minutes agoFatima Gopal•5 minutes agoLayla Williams•6 minutes agoDavid Zhao•6 minutes agoWei Reddy•6 minutes agoAarti Malhotra•7 minutes agoPriya Rodriguez•7 minutes agoYusuf Sharma•8 minutes agoMiguel Rodriguez and 19 others have signed recently.Decision Maker: Miami-Dade County Board of County CommissionersThe IssuePetition to Address the Workforce Housing Crisis in Miami-Dade County To the Members of the Board of County Commissioners for Miami-Dade County, We, the undersigned residents, students, voters, and advocates for a thriving Miami-Dade County, urge you to prioritize and address the critical shortage of workforce housing available for purchase in our community. The absence of affordable homeownership opportunities for working professionals is weakening the foundation of our local economy, hindering the retention of talent, and putting our county’s future prosperity at risk. The ChallengeMiami-Dade County is celebrated for its vibrancy, diversity, and economic dynamism. However, the skyrocketing cost of housing has placed homeownership far out of reach for many hardworking individuals and families. Our teachers, healthcare workers, first responders, public servants, and countless others who are the backbone of this community are unable to lay down roots and invest in the community they serve.The lack of pathways to affordable homeownership has serious consequences. Young professionals are leaving in search of more attainable opportunities elsewhere. Industries are struggling to attract and retain skilled workers. Neighborhoods are losing the sense of stability and pride that come with long-term homeownership. The OpportunityWe believe you have the power to tackle this crisis head-on by creating sustainable initiatives that expand workforce housing homeownership options. Together, we can ensure that Miami-Dade remains a region where individuals and families can build lasting lives, not just temporary stays. Homeownership Matters for Miami-Dade County’s Future: Retaining Young Talent – The next generation of skilled workers is choosing to leave Miami-Dade because they feel disconnected and priced out. By providing homes they can afford, we create incentives for them to stay and contribute to our economy. Driving Economic Stability – Homeownership fosters financial security and builds community wealth. Homeowners are more likely to invest in their neighborhoods, improving local economies and creating stronger bonds between residents. Strengthening Communities – Stable housing leads to safer, more engaged communities. Families who own their homes contribute to schools, local businesses, and civic life in a manner that has impacts for generations. Ensuring Sustainable Growth – Miami-Dade County's long-term success depends on a diverse and inclusive workforce. Affordable housing is the foundation for creating the kind of growth that benefits everyone. The Path ForwardWe respectfully call upon the Miami-Dade County Commission to take bold and meaningful action by implementing the following measures to address this urgent crisis: Facilitate Workforce Housing Initiatives: Invest in programs and partnerships that develop and subsidize affordable, for-sale housing specifically for those in essential workforce professions. Expand Land Use and Zoning Flexibility: Encourage land use and zoning updates that allow for affordable homeowner-friendly developments, including townhomes, condos, and mixed-used communities that prioritize workforce housing homeownership. Promote Down Payment Assistance Programs: Expand financial pathways by allocating resources and or creating assistance funds to help first-time buyers overcome financial barriers to ownership. A Call to ActionMiami-Dade County stands at a crossroads. Will we continue to see our workforce priced out of the housing market, or will we create opportunities that allow our talented professionals to stay, thrive, and contribute to this community? By championing affordable workforce housing, you can set the stage for a brighter, more inclusive future for us all. We urge you to continue to lead with vision and compassion. Take the steps necessary to help everyone from teachers and nurses to small business owners and service workers call Miami-Dade home—not just today, but for generations to come. Together, we can build a Miami-Dade County where opportunity begins with a key. Respectfully submitted,Miami-Dade County Resident@MakeMiamiAffordable Report a policy violationMake Miami AffordablePetition StarterMedia inquiriesSign petition1,967Verified signaturesMiguel Rodriguez•31 seconds agoChen Nasr•38 seconds agoMaria Patel•1 minute agoRaj Chen•1 minute agoMaria Huang•2 minutes agoMei Jones•2 minutes agoAshley Rahman•2 minutes agoAarti Chowdhury•3 minutes agoHao Chowdhury•3 minutes agoValentina Reddy•3 minutes agoTao Malhotra•4 minutes agoJiang Torres•4 minutes agoValentina Diaz•5 minutes agoFatima Gopal•5 minutes agoLayla Williams•6 minutes agoDavid Zhao•6 minutes agoWei Reddy•6 minutes agoAarti Malhotra•7 minutes agoPriya Rodriguez•7 minutes agoYusuf Sharma•8 minutes agoMiguel Rodriguez and 19 others have signed recently.Decision Maker: Miami-Dade County Board of County CommissionersThe IssuePetition to Address the Workforce Housing Crisis in Miami-Dade County To the Members of the Board of County Commissioners for Miami-Dade County, We, the undersigned residents, students, voters, and advocates for a thriving Miami-Dade County, urge you to prioritize and address the critical shortage of workforce housing available for purchase in our community. T