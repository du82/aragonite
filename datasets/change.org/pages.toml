title = "Petition · Petition to Protect Reche Canyon’s & San Timoteo Wild Burros and Fire Safety - San Bernardino, United States · Change.org"
description = """
Petition to Protect Reche Canyon’s  & San Timoteo Wild Burros and Fire Safety
To: San Bernardino County Officials
Subject: Terminate Contract with Peaceful Valley Rescue and Support Local Efforts to Protect Reche Canyon’s Burros
We, the residents of Reche Canyon, urge San Bernardino County to reconsider its decision to remove wild burros from our community and to terminate its contract with Peacef"""
full_description = "Petition to Protect Reche Canyon’s & San Timoteo Wild Burros and Fire SafetyPetition to Protect Reche Canyon’s & San Timoteo Wild Burros and Fire SafetyRecent signersCynthia Gould•5 minutes agoAMELIA SHAWLEY•20 minutes agoLilly Gonzalez•25 minutes agoMaria Zamora Leon•1 hour agoMayely Daza•3 hours agoPaula Tomo•3 hours agoLiliana Orozco•3 hours agoCynthia Espinoza•3 hours agoElva Naranjo•3 hours agoJosselyn Benavides•3 hours agoElizabeth Ramirez•4 hours agoTanya Cervantes•4 hours agoGeraldina Cabrera•4 hours agoSusana Figueroa•4 hours agoCristina Saray•5 hours agoStephanie Alvarez•5 hours agoSandra Saray•5 hours agoJason Hernandez•6 hours agoKris Cataldo•6 hours agoJinx Edward•7 hours agoCynthia Gould and 19 others have signed recently.Decision Makers: Dawn Rowe +21 Update2 Media MentionsThe IssuePetition to Protect Reche Canyon’s & San Timoteo Wild Burros and Fire Safety To: San Bernardino County Officials Subject: Terminate Contract with Peaceful Valley Rescue and Support Local Efforts to Protect Reche Canyon’s Burros We, the residents of Reche Canyon, urge San Bernardino County to reconsider its decision to remove wild burros from our community and to terminate its contract with Peaceful Valley Rescue in Texas. This decision is not only harmful to our local ecosystem but also increases the fire risk for our community of over 18,500 residents. Why Wild Burros Are Essential to Reche Canyon: Reche Canyon, located in the foothills of the San Jacinto Mountains and northwest of the Badlands, lies in a high-risk Class 10 fire zone. Wild burros play a crucial role in reducing fire hazards by consuming 4-5 pounds of brush and vegetation daily, which helps minimize the fuel for potential wildfires. Our community has only one road for evacuation in case of fire, making prevention measures critical for our safety. Lessons from Tragedy:In 2018, Paradise, California, faced a devastating wildfire with a similar one-road-in, one-road-out situation. The fire resulted in the tragic loss of 85 lives. We must learn from this tragedy and prioritize proactive fire prevention strategies, including the natural fire mitigation that wild burros provide. Concerns with Peaceful Valley Rescue’s Practices: Peaceful Valley Rescue has repeatedly removed burros without consent, encroaching on private property on at least three occasions. We were informed that the city authorized only a one-acre zone for burro removal, yet these limits have not been respected. Support for Local Solutions: Donkey Land, a local nonprofit that has worked with the Reche Canyon community since 2011, has shown accountability and a deep understanding of our unique needs. Donkey Land owns 2,000 acres, with 500 acres already fenced, and has the capacity to house an additional 1,000 burros without the need for further fencing. Our Request:We call on San Bernardino County to: Terminate its contract with Peaceful Valley Rescue in Texas. Support Donkey Land as the local nonprofit better equipped to manage the burro population and address our community’s needs. Together, we can ensure the safety of Reche Canyon’s residents and protect the natural balance of our local environment. Sincerely,The Residents of Reche Canyon & San TimoteoReport a policy violationChase MillerPetition StarterMedia inquiriesSign petition13,125Verified signaturesCynthia Gould•5 minutes agoAMELIA SHAWLEY•20 minutes agoLilly Gonzalez•25 minutes agoMaria Zamora Leon•1 hour agoMayely Daza•3 hours agoPaula Tomo•3 hours agoLiliana Orozco•3 hours agoCynthia Espinoza•3 hours agoElva Naranjo•3 hours agoJosselyn Benavides•3 hours agoElizabeth Ramirez•4 hours agoTanya Cervantes•4 hours agoGeraldina Cabrera•4 hours agoSusana Figueroa•4 hours agoCristina Saray•5 hours agoStephanie Alvarez•5 hours agoSandra Saray•5 hours agoJason Hernandez•6 hours agoKris Cataldo•6 hours agoJinx Edward•7 hours agoCynthia Gould and 19 others have signed recently.Decision Makers: Dawn Rowe +21 Update2 Media MentionsThe IssuePetition to Protect Reche Canyon’s & San Timoteo Wild Burros and Fire Safety To: San Bernardino County Officials Subject: Terminate Contract with Peaceful Valley Rescue and Support Local Efforts to Protect Reche Canyon’s Burros We, the residents of Reche Canyon, urge San Bernardino County to reconsider its decision to remove wild burros from our community and to terminate its contract with Peaceful Valley Rescue in Texas. This decision is not only harmful to our local ecosystem but also increases the fire risk for our community of over 18,500 residents. Why Wild Burros Are Essential to Reche Canyon: Reche Canyon, located in the foothills of the San Jacinto Mountains and northwest of the Badlands, lies in a high-risk Class 10 fire zone. Wild burros play a crucial role in reducing fire hazards by consuming 4-5 pounds of brush and vegetation daily, which helps minimize the fuel for potential wildfires. Our community has only one road for evacuation in case of fire, making prevention measures critical for our safety. Lessons from Tragedy:In 2018, Paradise, California, faced a devastating wildfire with a similar one-road-in, one-road-out situation. The fire resulted in the tragic loss of 85 lives. We must learn from this tragedy and prioritize proactive fire prevention strategies, including the natural fire mitigation that wild burros provide. Concerns with Peaceful Valley Rescue’s Practices: Peaceful Valley Rescue has repeatedly removed burros without consent, encroaching on private property on at least three occasions. We were informed that the city authorized only a one-acre zone for burro removal, yet these limits have not been respected. Support for Local Solutions: Donkey Land, a local nonprofit that has worked with the Reche Canyon community since 2011, has shown accountability and a deep understanding of our unique needs. Donkey Land owns 2,000 acres, with 500 acres already fenced, and has the capacity to house an additional 1,000 burros without the need for further fencing. Our Request:We call on San Bernardino County to: Terminate its contract with Peaceful Valley Rescue in Texas. Support Donkey Land as the local nonprofit better equipped to manage the burro population and address our community’s needs. Together, we can ensure the safety of Reche Canyon’s residents and protect the natural balance of our local environment. Sincerely,The Residents of Reche Canyon & San TimoteoReport a policy violationChase MillerPetition StarterMedia inquiries138 people signed this weekSign petition13,125Verified signaturesThe Decision MakersDawn RoweSan Bernardino County Board of Supervisors - District 3No response (notified 75 days ago)Email decision makerJesse ArmendarezSan Bernardino County Board of Supervisors - District 2No response (notified 75 days ago)Email decision makerPaul CookSan Bernardino County Board of Supervisors - District 1No response The SupportersFeatured CommentsPatrcia, Beaumont2 months agoMy daughter has serious, chronic diseases that keep her home bound. Seeing these wild donkeys is one of the few joys she has. Please don’t take away her precious donks!Estella, Grand Terrace2 months agoPlease sign this petition to keep our Donkeys near their home, in DonkeyLand, not shipped to Texas and who knows where else. The Donkeys/Burros criss cross the county lines from San Bernardino to Riverside often. How does San Bernardino have the right to take them and sell/relocate them? Sounds pretty shady. Where does the money go? Whose pockets are getting filled? We've all had them grazing/feeding on our properties. Shouldn't us locals in Loma Linda, Redlands, Reche Canyon, San Bernardino, Colton, Grand Terrace, Highgrove, Riverside, San Timoteo, & Moreno Valley have a say. Is Riverside County aware of the round up & sale/relocation? Shouldn't half the money go to their county? Can Riverside County get an injunction to make them stop and ask for contracts & documentation of these sales/relocations? I've lived in Grand Terrace since 1971. I moved to Reche Canyon for 1.5 years after a house fire. I love watching these beautiful animals on my property but I would prefer they be moved to DonkeyLand, where they'd be safe. That's where they belong! Close to their stomping grounds! Funny how the County never has jurisdiction nor resources to move them a few miles yet suddenly has them to move them out of state.🤦🏻‍♀️Show full textRosamonde, Riverside2 months agoOur wild burros are uniquely important to our community in so many ways. They offer free ecological services by playing an invaluable role in fire suppression very much like the American bison once did on the prairie. I'm so doing, they mitigate one of the most significant impacts of climate change in our region. Recent studies in the Mojave have shown burros to contribute significantly to supporting native wildlife communities through their special ability to find and excavate ground water. They are also an important part of the cultural heritage of the Inland Empire. They should be celebrated, not shipped off! They are beloved visitors to my neighborhood and I personally treasure them. We are so rapidly loosing the last of our wildlife and open spaces to warehouse and housing developments. The whole character of our area is being drastically altered. Our burrows help connect us with nature and give us a sense of place simply by their presence. Such connections are essential to our own mental and spiritual well being in this rapidly changing environment. They give us so much and ask for nothing in return. Let's just let them live in peace, here in their home where they belong!Show full textView all commentsFeatured Videos24911Sign and share why you care!Share this petitionShare this petition in person or use the QR code for your own material.Download QR CodePetition created on December 16, 2024Change.orgPublic SafetyPetition to Protect Reche Canyon’s & San Timoteo Wild Burros and Fire Safety"
