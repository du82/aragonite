description = "As a member of the Cumberland Valley School District community, I am deeply saddened by the Cumberland Valley School Board's decision to cancel an assembly scheduled at Mountain View Middle School. The assembly was set to feature accomplished actor and author Maulik Pancholy who would present on empathy, anti-bullying, and the books he authored. This decision was made solely because he is openly g"
full_description = '''Reinstate Empathy and Anti-Bullying Assembly at Mountain View Middle SchoolReinstate Empathy and Anti-Bullying Assembly at Mountain View Middle School2 Updates21 Media MentionsThe IssueAs a member of the Cumberland Valley School District community, I am deeply saddened by the Cumberland Valley School Board's decision to cancel an assembly scheduled at Mountain View Middle School. The assembly was set to feature accomplished actor and author Maulik Pancholy who would present on empathy, anti-bullying, and the books he authored. This decision was made solely because he is openly gay with one board member stating, "...he is proud of his lifestyle, and I don't think that should be imposed on our students." Being LGBTQ+ isn't a dirty little secret to protect our students from. To have someone with Maulik's life experiences would have been inspirational for our students. It is important that we teach our children about diversity and acceptance from an early age. According to a study by GLSEN (Gay, Lesbian & Straight Education Network), schools that promote LGBTQ+ inclusivity see better academic outcomes and lower rates of bullying.The cancellation of this assembly sends a harmful message to our students - that being different is something to be ashamed of or hidden away. We must challenge this narrative by reinstating the assembly with Maulik Pancholy.We call upon the Cumberland Valley School Board to reverse their decision and allow Mr. Pancholy’s presentation on empathy, anti-bullying, and his books at Mountain View Middle School. By doing so, we can show our students that everyone deserves respect regardless of their sexual orientation or identity.Please sign this petition if you believe in promoting acceptance rather than discrimination within our education system.Report a policy violationTrisha ComstockPetition StarterMedia inquiriesVictoryThis petition made change with 9,749 supporters!Share this petition2 Updates21 Media MentionsThe IssueAs a member of the Cumberland Valley School District community, I am deeply saddened by the Cumberland Valley School Board's decision to cancel an assembly scheduled at Mountain View Middle School. The assembly was set to feature accomplished actor and author Maulik Pancholy who would present on empathy, anti-bullying, and the books he authored. This decision was made solely because he is openly gay with one board member stating, "...he is proud of his lifestyle, and I don't think that should be imposed on our students." Being LGBTQ+ isn't a dirty little secret to protect our students from. To have someone with Maulik's life experiences would have been inspirational for our students. It is important that we teach our children about diversity and acceptance from an early age. According to a study by GLSEN (Gay, Lesbian & Straight Education Network), schools that promote LGBTQ+ inclusivity see better academic outcomes and lower rates of bullying.The cancellation of this assembly sends a harmful message to our students - that being different is something to be ashamed of or hidden away. We must challenge this narrative by reinstating the assembly with Maulik Pancholy.We call upon the Cumberland Valley School Board to reverse their decision and allow Mr. Pancholy’s presentation on empathy, anti-bullying, and his books at Mountain View Middle School. By doing so, we can show our students that everyone deserves respect regardless of their sexual orientation or identity.Please sign this petition if you believe in promoting acceptance rather than discrimination within our education system.Report a policy violationTrisha ComstockPetition StarterMedia inquiriesShare this petitionVictoryThis petition made change with 9,749 supporters!Share this petitionThe SupportersFeatured CommentsNoah, Camp Hill10 months agoAs an openly queer student at this school I am severely disgusted by the school board’s decisions, and hope that we can rectify their actions.Myra, Myrtle Beach10 months agoWe need to have people speak to our children about ant-bullying. Bullying is way to common not only in our schools but everywhere.Chloe, Camp hill10 months agoI’ve dealt with a lot of bullying, and I’d like to see it preventedView all commentsFeatured Videos66551811Sign and share why you care!Share this petitionShare this petition in person or use the QR code for your own material.Download QR CodePetition created on April 15, 2024Change.orgEducationReinstate Empathy and Anti-Bullying Assembly at Mountain View Middle School'''
