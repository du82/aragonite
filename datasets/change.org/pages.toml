title = "Petition · Help Secure Permanent Affordable Access to GLP-1 Medications - United States · Change.org"
description = """
The IssueAffordable access to essential medications like Tirzepatide and Semaglutide is at risk. Millions of Americans rely on these treatments for chronic diseases, but skyrocketing costs and regulatory restrictions are making them harder to obtain.
We are a 501(c)(3) tax-exempt nonprofit dedicated to ensuring affordable access for all. Learn more at GLP-1 Collective
We urge the FDA to implement"""
full_description = "Help Secure Permanent Affordable Access to GLP-1 MedicationsHelp Secure Permanent Affordable Access to GLP-1 MedicationsRecent signersbarbara bellovich•23 minutes agoNatasha Reiger•3 hours agoAmber Baird•11 hours agoEmily Thornton•12 hours agoMeghan Darnell•12 hours agoKade Debe•12 hours agoRobert Debes•12 hours agoDavid Eschenbrenner•13 hours agoStephanie Dimberg•13 hours agoAmanda Wilbur•14 hours agodanielle figirova•16 hours agoJasna Trevino•17 hours agoRITA MARTINEZ•19 hours agoKari Kane•23 hours agoJennifer Anderson•23 hours agoAngela Hensley•23 hours agoChristine Garvale•1 day agoJessica Abraham•1 day agoMarisa Ferrara•1 day agoChristy Tanner•1 day agobarbara bellovich and 19 others have signed recently.Decision Makers: Food and Drug Administration +19 Updates5 Media MentionsThe IssueThe IssueAffordable access to essential medications like Tirzepatide and Semaglutide is at risk. Millions of Americans rely on these treatments for chronic diseases, but skyrocketing costs and regulatory restrictions are making them harder to obtain. We are a 501(c)(3) tax-exempt nonprofit dedicated to ensuring affordable access for all. Learn more at GLP-1 Collective We urge the FDA to implement one of these four solutions to ensure permanent affordability and access for all: Compounding Pharmacies – Allow 503A and 503B pharmacies to continue producing safe, affordable alternatives, ensuring patients can access necessary medications without financial strain. FDA-Approved Generic Versions – Expedite the approval of generic alternatives to increase market competition and reduce prices for consumers. Lower Drug Prices – While the FDA does not directly regulate drug prices, it can promote policies that encourage competition and transparency, pressuring manufacturers to offer more affordable options. Mandatory Insurance Coverage – Work with federal agencies and stakeholders to ensure insurance plans cover these medications for all approved conditions, reducing out-of-pocket costs for patients. No one should have to live in fear of losing access to medications that improve their health and quality of life. But We Face an Urgent ChallengeThousands of patients currently rely on affordable GLP-1 medications through 503A and 503B pharmacies. However, recent FDA actions threaten to restrict or eliminate this crucial access altogether on these upcoming dates: Tirzepatide 503A: February 18, 2025 503B: March 19, 2025 Semaglutide 503A: April 22, 2025 503B: May 22, 2025 If we don’t act now, affordable access to these medications will disappear. What We’ve Accomplished So FarIn just three months, we’ve:✅ Gathered 22.6K signatures on our petition✅ Earned four media mentions, bringing national attention to this crisis✅ Launched a podcast, providing a platform for community voices to be heard✅ Incorporated as a nonprofit, strengthening our advocacy efforts 📅 See our full timeline here: GLP-1 Collective Timeline What Else Is Being Done? Outsourcing Facilities Association (OFA) – Pursuing legal action to challenge the FDA’s decision to remove Tirzepatide from the drug shortage list, which could help protect 503B pharmacies. Doctors for America – Advocating for systemic reforms to lower drug prices and preserve affordable access. Patients for Affordable Drugs – Pushing for policies that allow Medicare to negotiate directly with drug manufacturers. Congressional Efforts – Lawmakers are introducing bipartisan measures to combat price-gouging and protect patient access. Together, We Can Make a DifferenceWe are raising funds to cover essential upstart costs needed to build a strong, sustainable movement for affordable medications and community support and education. 💰 Donate to help us fight for access and build our movement: GOFUNDMEEvery dollar helps us advocate for affordable access to life-changing medications and ensures we have the resources to make a lasting impact. 📢 Sign and share the petition: PETITIONWe need as many signatures as possible to show lawmakers and regulators that patients will not be ignored.💪 Join the Movement: GLP-1 COLLECTIVEBe part of the change. Connect with others, stay informed, and take action.Report a policy violationAmanda BonelloPetition StarterMedia inquiriesSign petition22,816Verified signaturesbarbara bellovich•23 minutes agoNatasha Reiger•3 hours agoAmber Baird•11 hours agoEmily Thornton•12 hours agoMeghan Darnell•12 hours agoKade Debe•12 hours agoRobert Debes•12 hours agoDavid Eschenbrenner•13 hours agoStephanie Dimberg•13 hours agoAmanda Wilbur•14 hours agodanielle figirova•16 hours agoJasna Trevino•17 hours agoRITA MARTINEZ•19 hours agoKari Kane•23 hours agoJennifer Anderson•23 hours agoAngela Hensley•23 hours agoChristine Garvale•1 day agoJessica Abraham•1 day agoMarisa Ferrara•1 day agoChristy Tanner•1 day agobarbara bellovich and 19 others have signed recently.Decision Makers: Food and Drug Administration +19 Updates5 Media MentionsThe IssueThe IssueAffordable access to essential medications like Tirzepatide and Semaglutide is at risk. Millions of Americans rely on these treatments for chronic diseases, but skyrocketing costs and regulatory restrictions are making them harder to obtain. We are a 501(c)(3) tax-exempt nonprofit dedicated to ensuring affordable access for all. Learn more at GLP-1 Collective We urge the FDA to implement one of these four solutions to ensure permanent affordability and access for all: Compounding Pharmacies – Allow 503A and 503B pharmacies to continue producing safe, affordable alternatives, ensuring patients can access necessary medications without financial strain. FDA-Approved Generic Versions – Expedite the approval of generic alternatives to increase market competition and reduce prices for consumers. Lower Drug Prices – While the FDA does not directly regulate drug prices, it can promote policies that encourage competition and transparency, pressuring manufacturers to offer more affordable options. Mandatory Insurance Coverage – Work with federal agencies and stakeholders to ensure insurance plans cover these medications for all approved conditions, reducing out-of-pocket costs for patients. No one should have to live in fear of losing access to medications that improve their health and quality of life. But We Face an Urgent ChallengeThousands of patients currently rely on affordable GLP-1 medications through 503A and 503B pharmacies. However, recent FDA actions threaten to restrict or eliminate this crucial access altogether on these upcoming dates: Tirzepatide 503A: February 18, 2025 503B: March 19, 2025 Semaglutide 503A: April 22, 2025 503B: May 22, 2025 If we don’t act now, affordable access to these medications will disappear. What We’ve Accomplished So FarIn just three months, we’ve:✅ Gathered 22.6K signatures on our petition✅ Earned four media mentions, bringing national attention to this crisis✅ Launched a podcast, providing a platform for community voices to be heard✅ Incorporated as a nonprofit, strengthening our advocacy efforts 📅 See our full timeline here: GLP-1 Collective Timeline What Else Is Being Done? Outsourcing Facilities Association (OFA) – Pursuing legal action to challenge the FDA’s decision to remove Tirzepatide from the drug shortage list, which could help protect 503B pharmacies. Doctors for America – Advocating for systemic reforms to lower drug prices and preserve affordable access. Patients for Affordable Drugs – Pushing for policies that allow Medicare to negotiate directly with drug manufacturers. Congressional Efforts – Lawmakers are introducing bipartisan measures to combat price-gouging and protect patient access. Together, We Can Make a DifferenceWe are raising funds to cover essential upstart costs needed to build a strong, sustainable movement for affordable medications and community support and education. 💰 Donate to help us fight for access and build our movement: GOFUNDMEEvery dollar helps us advocate for affordable access to life-changing medications and ensures we have the resources to make a lasting impact. 📢 Sign and share the petition: PETITIONWe need as many signatures as possible to show lawmakers and regulators that patients will not be ignored.💪 Join the Movement: GLP-1 COLLECTIVEBe part of the change. Connect with others, stay informed, and take action.Report a policy violationAmanda BonelloPetition StarterMedia inquiries223 people signed this weekSign petition22,816Verified signaturesThe Decision MakersFood and Drug AdministrationNo response FDANo response The SupportersFeatured CommentsLinda, Conroe3 months agoMy primary doctor prescribed tirzepatide, but my insurance refused to cover it. If it weren't for compounding pharmacies, I would not be able to have this medication that my doctor wanted me to have. It not only is working for its intended purpose but it also is resolving other issues too such as my inflammation, fluid retention, and even my blood tests have improved. This medicine has given me hope. If you take away compound pharmacies being able to provide it, you take away hope from patients like me.Show full textDena, Boerne3 months agoMany people don’t have access to name brand. Compounded medication has given me my life back along with so many others. If big pharma can’t make their drugs affordable, we need to be able to access our medication to take control of our health.Andy, Kansas city3 months agoAs a disabled vet with blood sugar and overweight issues, these GLP-1 meds has vastly improved my quality of life when the VA has let me down.View all commentsFeatured Videos225117Sign and share why you care!Share this petitionShare this petition in person or use the QR code for your own material.Download QR CodePetition created on November 19, 2024Change.orgBusiness RegulationHelp Secure Permanent Affordable Access to GLP-1 Medications"
