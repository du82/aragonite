title = "Youth empowerment · Change.org"
full_description = '''Prevent Book Bans and Protect Educational Freedom: The Protect Florida Classrooms Act17,717 signatures Stand Up for Students! Stop Misleading Students & Toxic Bullying by Phi Theta Kappa HQ4,494 signatures TopicYouth Empowerment9,304,734 supporters taking action on this topic.21,886 petitions started in this community.Start a petitionLearn more about Youth Empowerment topic at Change.orgYouth empowerment is a critical topic that focuses on equipping young people with the tools and resources they need to create positive change in their communities. Recent trends show a growing interest in amplifying youth voices and addressing issues affecting young individuals, such as mental health, education, and social justice. Petitions within this topic often call for increased youth representation in decision-making processes, improved access to education and resources, and the protection of youth rights. Notable petitions include one advocating for comprehensive mental health support in schools, highlighting the importance of addressing the emotional well-being of students. Another petition pushing for youth inclusion in policy development underscores the need for young voices to be heard in shaping the future. Join the movement for youth empowerment by exploring and supporting the petitions on this topic. Your involvement can help empower the next generation to drive positive change and create a more inclusive society.Explore 21,886 petitions in Youth EmpowermentTrendingMost RecentImplement Liaison Based Suicide Prevention Programs in Boone County Schools6,280 signaturesPrevent Book Bans and Protect Educational Freedom: The Protect Florida Classrooms Act17,717 signaturesPanawagan sa BulSU Admin: Ideklarang walang pasok sa Feb. 25!4,433 signaturesHISD Removed Eid - Muslim Students Deserve Better4,373 signaturesStand Up for Students! Stop Misleading Students & Toxic Bullying by Phi Theta Kappa HQ4,494 signaturesRevoke the Ban on Phones in Howard County Schools4,061 signaturesGov. Janet Mills of Maine, keep standing up to Trump!3,971 signaturesSupport "Herberts Clause”3,014 signaturesShow moreStories and updates from petition startersPrevent Book Bans and Protect Educational Freedom: The Protect Florida Classrooms Act[ACTION NEEDED]: Our Movement Against Book Bans Continues📚📣To Our 12,000+ Petition Signers: THANK YOU! In just two weeks, over 12,000 of you have stood up against book bans by signing our petition in support of the Protect Florida Classrooms Act. Your voice is making an impact, and this fight is only just beginning. Right now, we have a critical opportunity to ensure that Florida classrooms—and classrooms across the country—remain spaces of curiosity, free-thinking, and diversity for all students, not just some. 🚨 Big News: Our Movement is Growing! 🚨Tomorrow (1/31), we are launching our social media campaign and officially opening our coalition to the public! Want to take an even bigger role? By following us, you'll get updates on in-person events, advocacy opportunities, and some exciting surprises we have in store across the state!👀 📲 Follow us on Instagram to stay connected and join the movement: @our.fl0rida This is your chance to get even more involved and stay informed about policy updates, action opportunities, and ways to continue advocating for educational freedom. The coming months are crucial. Florida needs each and every one of us to show up—on social media, in coalition meetings, and at events—to protect our students, their futures, and our democracy. As a state labeled as the nation’s “blueprint”, we have a responsibility not only to Floridians but our country to lead by example when it comes to protecting education. Without you, there is no movement. Are you ready to help us protect curiosity, free thinking, and diversity in our classrooms? We'll see you in class. 😉🏫🍊 Kindly and With Gratitude, Gabriela Diaz-Vendrell Our Florida, Executive Director January 30, 2025Prevent Book Bans and Protect Educational Freedom: The Protect Florida Classrooms Act☎️PHONE'S RINGING - IT'S A MOBILIZING CALL AGAINST CENSORSHIP☎️To our 16,000+ Petition Signers: Our schools, libraries, and teachers are under attack, but together, we're standing up and fighting back. Join Our Florida alongside The Golden State Readers, Students Engaged in Advancing Texas, and The Authors Roundtable of Florida for a nationwide mobilizing call on book bans, past victories against censorship, and the ongoing fight to protect access to books and public education. 📅 Date: Saturday, March 8th⏰ Time: 12:30 PM – 1:00 PM EST📍 Location: Zoom (Register here! ) We’re bringing the conversation back to the ground, hearing from the voices actively fighting censorship, and most importantly keeping the fire, the momentum, going–we have prevailed before and we will do it again. The fight against censorship continues. Will you be part of it?✊📚March 1, 2025Panawagan sa BulSU Admin: Ideklarang walang pasok sa Feb. 25!Higit 5,300 na BulSUAN na ang nakiisa sa panawagang kanselahin ang klase sa Feb. 25!Sumali sa DP Blast at sa mga susunod pang pagkilos! Hindi natatapos sa pagbasura ng BulSU Administration sa petisyon ng League of Governors at SG ang ating panawagan. Ang pagbasurang ito ay manipetasyon ng pagiging complicit ng administration sa tangka ni Marcos Jr. na i-distort ang kasaysayan at iwhitewash ang kasalanan ng kanyang pamilya. Ipagpatuloy ang ating paglaban. Lumahok sa DP Blast ng KASAMA BulSU!BulSUAN, ipakita ang iyong lakas. Papirmahin ang mga kakilala, kaklase, at kaibigan sa ating petisyon. #KASAMABulSU#CancelClassesOnFeb25#EDSAPeoplePower#NoToHistoricalRevisionism Para sa mga karagdagang updates, mangyaring bisitahin ang ating Facebook page. Kung ikaw ay nagnanais na maging bahagi pa ng mas maraming pagbabago, sumapi ka na sa KASAMA BulSU. February 23, 2025Show moreVictories in Youth EmpowermentVictoryKeep Elsie Allen Open1,467 signaturesVictoryProtect VUSD Libraries and Librarian Jobs1,207 sign