full_description = "Discover petitions to signFeaturedPopularRecentVictoriesBan Ashley Trevino from TikTok PermanentlyThis is a personal plea that stems from events occurring on the night of February 26, 2025 involving Ashley Trevino, a TikTok user who has overstepped boundaries and utilized the platform in the most reprehensible way. On this night, Trevino knowingly got into contact with the daughter of a murder victim, not only reopening old wounds but pouring salt on them with her actions. She boldly stated that the deceased deserved to die and even made multiple racist remarks, attributing responsibility for the tragedy of 9/11 to him as well.Moreover, Trevino has built a notorious reputation for her neglectful behavior towards her own children and an inappropriate relationship with minors. This is deeply concerning as it both goes against the Community Guidelines set by TikTok, which state that 'content that harms the online community or individual's experience are not allowed on the app (TikTok Community Guidelines)', and promotes harm and prejudice, endangering the wellbeing of many in the community she engages with.The platform has a responsibility to protect its users from harmful behavior and ensure a safe environment for all. This is why we urge TikTok to ban Ashley Trevino indefinitely and ensure she cannot create any more accounts. This action will stand against hate, racism, and abuse, and signal to the community that such behaviors will not be tolerated. Please, join us in voicing out and sign this petition.BAN ASHLEY (GARCIA) TREVINOTexas, TX, United States106,1952/25/25The immediate removal of Riot Games CEO Dylan JadejaSpanish Translation: https://pastebin.com/5bqwyqG2 Chinese Translation: https://pastebin.com/HuJa8LJP For years, League of Legends has been one of the biggest and most beloved games in the world. But under the leadership of Dylan Jadeja the game has been going downhill at an unprecedented rate. Riot Games has made decision after decision that prioritizes profits over player experience, and the community is tired of being ignored and treated like complete idiots who they only see as numbers to get money from. Yes a lot of what’s happening can be pinpointed to the previous CEO’s (Nicolo) mishandling of the company’s money, but that doesn’t excuse how they are proceeding from that situation. This doesn’t feel like it’s the way to handle a company that needs more money, especially if you want to keep a lot of your players happy and on the game for as long as possible. It’s a short term profit for a long term dig in the grave that only benefits its CEO. Here is a list of events that have happened underneath his leadership starting at September 22, 2023 Jan 22, 2024 — Eliminated about 530 roles globally, which represented around 11% of the workforce, with the biggest impact to teams outside of core development June 12, 2024 — (Up to $500) Immortalized Legend Ahri FOMO Skin Oct 15, 2024 — 27 more layoffs from its League team, and five further redundancies from its publishing side, totaling 32 employees. November 2024 — Arcane was forced into the League lore rather than be its own separate thing November 2024 — No free skins during the hight of Arcane Season 2, instead more gatchas December 11, 2024 — ($250 scam) Exalted Jinx Skin January 09, 2025 — ($250 scam) Exalted Sett Skin January 09, 2025 — Noxus Battle Pass (lackluster skins) Feb 07, 2025 — Removal of Hextech chests Feb 19, 2025 — Removal of Honor Capsules and Orbs Feb 19, 2025 — (soon to be $250 scam) Exaulted Morde lore skin (Lots of LCS changes that are better explained in this website https://estnn.com/how-the-lcs-is-changing-in-2025-americas-league-split-changes-rosters/ ) With these changes it clearly shows how the upper heads at Riot value squeezing money out of players instead of giving us content worth paying for. Its not an “oops this change wasn’t what we expected so lets learn from our mistake and do better next time” thing , this is a clear cut and dry change to force players who have mostly or always been free to play to cough up some cash to Riot. They’ve even upped the amount of outside contractors in order to save money. The skins they release dont even feel like they are worth the price they are sold at. They feel like they are given to us, and we are expected to like them because they are free and shouldn’t complain or have expectations. At some point, at this rate, we will be forced to pay in order to pay or not be able to play at all, who knows. This needs to change, we don’t want our game flooded with scummy predatory gatcha systems and systems that only value the whales of the industry and puts the casual players/payers out to dry. At this point, it’s clear that League of Legends needs new leadership. The game is losing the identity that made it special, and the CEO priorities do not align with the player base. If Riot truly cares about the future of League, then it’s time for a change at the top. By signing this petition, you’re standing with the community in demanding that Riot Games replace Dylan Jadeja with someone who actually understands what League of Legends should be, what it was before, what worked before all of this. Let’s save our game before it’s too late. This game deserves better, the players deserve better, and especially the hard working people at Riot deserve better. This petition isn’t just to get Hectech chests back or to get loot back for free, it’s about the integrity of the game and how it’s being abused. We aren’t some piggy bank, we are people who take the time out of our day to play this game and interact with its players. We don’t want to cough up money for minimal rewards. There’s barely an incentive to play instead of just playing and paying. Not saying everything should be free, but looking back on how nice everything was, really shows how much was gutted. Of course it would be nice to revert the chest and loot changes, but those are secondary to what really needs to happen. I understand the sheer magnitude of events that would have to happen in order for something this grand to come true. I guarantee that there are plenty of Riot employees who are fed up with how their game is being treated by corporate middlings. Imagine working years and years in order to get good enough to work at THE Riot Games and then years later (or for some, months later) tons of your fellow friends/co-workers are being fired so that the company could save money and continue to be greedy. Now obviously a couple thousand signatures is not going to do anything, that’s why I want to use this as a stepping stone to see how many people are on board who actually want change and then go from there, whatever that course of action may be (protesting (peacefully) in person but we’ll get there if/when we get there) I want this petition to show the Rioters that we are on their side and we want to empower them to do what they want/need to do in order to make things right. Even if it isnt directly the CEO making all of these decisions, he is still the one with the highest position and with this game having the lowest reputation in its entire existance as of right now, its on him to fix it. Unfortunately with the pattern of more and more free options being taken away, they clearly do not intend to stop, unless we stand together and fight back! PLEASE SIGN AND SHARE IF YOU AGREE!!!!!!!!!!!! Also do not feel pressured to support it financially unless you are 100% sure. Again, in understand how big this has to become in order for something to actually happen, but if everyone joins together and creates real action that shows how frustrated and tired we are, we can create the League of Legends we all deserve. One without all of the predatory monetization, a game where we don’t expect to be let down patch after patch, a game where we can just enjoy things again, a game we can share with others without having second thoughts or warnings. A game we can just love. Discord link for our petition community: https://discord.gg/uu3y4Ht2qj Please let me know if I missed any big change and I will make adjustments. Update (Dev Update February 27): This section is an update from when Riot Games released their dev update regarding the massive backlash about the removal of hextech chests as well as various other rewards. They backpedaled on chests not being “profitable” when previously they ensured us that people were abusing the system by waiting to get the skin they wanted rather than outright buying it. They mentioned during this update that the your shop was returning as well as the essence emporium, when previously they never even said that it was going away in the first place, keeping the fact that they were going away in the first place a secret. Riot Forge is still gone, prices for RP is still up, for mythic essence we still don’t get it every 50 levels but instead we get it through the paid battle pass, no more mastery chests because its t’s now through the battle pass, FOMO skins are still a thing, skin quality has never been lower overall, we still have gatcha, this was never a victory, this was only a compromise, one that they hope you’ll be satisfied with, think it’s a win, and forget what they did prior. Eventually they’ll manipulate us into believing that the next change is “for the better”, we’ll raise our voices, they’ll “listen” and retract it saying that they messed up, repeating the same pattern over and over when years ago they would never have even thought of doing that. The blue essence cost of champs being 50% off and the quality of the battle pass skins being upgraded and the exalted morde skin being delayed is nice and all but these are all in hopes that you will just accept their crumbs and not demand the whole buffet (which you so rightfully deserve). The Riot Games CEO is not a true leader for the gaming community, he needs to be replaced immediately. We don’t deserve to be milked by a greedy CEO. Sam GPA, United States47,8322/19/25Initiate the Recall of Governor Janet MillsI am standing among many Maine citizens who are deeply dissatisfied with the policies introduced by our Governor, Janet Mills. I believe strongly that her policies are not in alignment with the wishes and values of the majority of Mainers. The feeling of disconnect between the populace and leadership is palpable and widespread. Various statistics underline rural-urban divide that has been exacerbated by the Governor's decisions. Additionally, several of her policies contradict the economic growth and prosperity that should be our government's priority. I am yet another citizen calling for change and improvement for our beloved state of Maine. It is imperative that we hold our elected officials accountable. I implore you to sign this petition to voice our collective dissent and to initiate the recall of Governor Janet Mills. Together we can work to ensure our government truly represents us all. https://facebook.com/events/s/march-against-mills/644580324641604/Melissa MoultonRandolph, ME, United States24,2062/23/25In Solidarity: Demand Buddhist Control Over the Mahabodhi TempleIn Solidarity: Demand Buddhist Control Over the Mahabodhi Temple Dear Friends,Namo Buddhay We, the undersigned, stand in unwavering solidarity with the Buddhist monks and followers protesting in Bodh Gaya to demand the rightful transfer of the Mahabodhi Mahavihara Temple’s administration to the Buddhist community. This sacred site, where Gautama Buddha attained enlightenment, deserves to be managed by those who uphold its spiritual and historical significance. Under the Bodhgaya Temple Act of 1949, the temple’s governing body (BTMC) unfairly places non-Buddhists in the majority, including the chairman’s role. This discriminatory structure denies Buddhists the fundamental right to manage their holiest pilgrimage site—an autonomy granted to every other religious community in India. The current administration’s actions have led to repeated attempts to distort Buddhist history and diminish the temple’s sacred identity. Today, Buddhist monks and leaders have entered the tenth day of a hunger strike to bring attention to this injustice. Their demands are clear and just: 1. Full transfer of Mahabodhi Temple management to Buddhists.2. Repeal of the Bodhgaya Temple Act of 1949.3. An end to state interference in Buddhist religious affairs.Despite international support from Buddhist communities in Sri Lanka, Thailand, Laos, Cambodia, Korea, Japan, USA, Canada, and Mongolia, the Indian government remains silent. The Bihar administration has not only ignored peaceful protests but has also resorted to intimidation and suppression. We call on you to stand with us to demand justice and the rightful return of the Mahabodhi Temple to the Indian Buddhist community. Together, let’s preserve the enduring legacy of Buddha and Emperor Ashoka, and ensure that Bodh Gaya remains a sanctuary of pure Buddhist worship and pilgrimage for all faith. News Media Reference https://www.rediff.com/news/interview/why-are-hindus-controlling-the-mahabodhi-temple/20170725.htm https://en.themooknayak.com/india/bodh-gayas-burning-question-if-hindu-scriptures-denounced-buddha-why-do-brahmins-control-his-sacred-site https://www.ucanews.com/story-archive/?post_name=/1992/10/21/buddhist-monks-lead-temple-liberation-rally-in-indian-capital&post_id=42148 https://whc.unesco.org/en/list/1056/ https://youtu.be/QJ195fpUb5s?si=78-6qoIssnq2ZFgX In solidarity, Below undersigned Organization's Name: Buddhist Council of America Chetna Association of Canada Ambedkarite International Co-Ordination Society-AICS Ambedkarites International Mission Society-Canada (AIMS) International Bahujan Organization International Boddhisativa Guru Ravidass Organization Inc Friends For Education International All India Buddhist Forum Global Bahujan Group Global NRIs Forum Ambedkar Buddhist Association of Texas-ABAT The Federation of Ambedkarite and Buddhist Organisations UK Dhamma Waves Bodhimaggo Mahavihara Boston study group -BSG Women Empowerment Sangha Buddhist seminary hinayanabuddhism trust Sangha kaya foundation Chetna Association of Canada Desh Doaba Dharm Brotherhood USA Ambedkar International Mission, Europe Ambedkar King Study Circle Samata Sainik Dal-SSD Dharm Brotherhood USA Indian Buddhist center ( IBC) Great Lakes Buddhist Vihara Ambedkarite Buddhist Community of Canada (ABCC) Vipassana Educational & Social Trust Federation of Ambedkarite & Buddhist Organisations UK Dr Ambedkar Buddhist organisation Birmingham UK. Dr Babasaheb Ambedkar International Association for Education, Japan(BAIAE) Samaj Weekly UK Arya Nagarjuna Education Society Ambedkarite Buddhist Society of Ireland Bheem Patrika Aloka Trust Buddha Bhoomi Mahavihara ### **連帯声明：ブッダガヤのマハーボディ寺院を仏教徒の手へ** 親愛なる皆様、 仏陀に敬意を表し、**ナモ・ブッダヤ**。 私たち署名団体は、インド・ブッダガヤで現在行われている抗議活動を強く支持します。この活動は、仏教の最高聖地であるマハーボディ大寺院の管理権を仏教徒コミュニティに移すことを求めるものです。ゴータマ・ブッダが悟りを開いたこの場所は、その精神的・歴史的価値を理解する仏教徒によって管理されるべきです。しかし、1949年に制定"
