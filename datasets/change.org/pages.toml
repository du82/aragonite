full_description = '''Discover petitions to signFeaturedPopularRecentVictoriesPetition to Protect Topanga and LA County from Toxic Waste Sorting SiteThe community of Topanga, citizens of Los Angeles county strongly oppose the Environmental Protection Agency's proposed Palisades fire debris staging site located at the base of Highway 27 and the PCH (a California State Park) We understand the importance and urgency of this issue but ask the EPA to consider alternatives as it will very likely have detrimental effects on our environment, economy, cultural history and the health and safety of our community. The site is dangerously close to Topanga creek a vital watershed that is home to the federally endangered steelhead trout. The site is on land that is sacred to the Indigenous tribes of this region. We are deeply concerned that contaminants from the debris could leach into the soil and waterways. Not to mention the toxic particulates that could make their way into our air and carried by onshore winds directly to our town of Topanga where people live, work and play. The risk this poses to ocean water quality is also alarming. Local businesses are already struggling and this would deter visitors to our town that relies on tourism. These serious environmental, economic, and public safety risks cannot be overstated. I urge you to stand with us in opposing the proposed EPA fire debris staging site near Topanga lagoon and the PCH. Please sign this petition to protect our homes, preserve our environment, sustain our economy, and safeguard our families' health. FURTHER DETAILS 1. Environmental Threat to Waterways and the Ocean Toxic waste stored near water sources poses a severe contamination risk. Topanga Creek, which feeds directly into the ocean, is particularly vulnerable. Study: Surface Water Contamination from Hazardous Waste Storage Sites (EPA, 2005) found that hazardous waste leached into soil and waterways when stored on unprotected ground, leading to long-term pollution in local water sources.Example: The Superfund Research Program at UC Berkeley has documented severe groundwater contamination caused by improper hazardous waste storage, affecting communities for decades.California Coastal Commission Report (2022): Stresses that coastal areas should not be used for hazardous material storage due to high risks of leaching into marine ecosystems.Safer Alternatives Exist:Instead of placing toxic waste in a sensitive coastal watershed, safer options such as Will Rogers State Park’s parking lot (an impermeable surface) or Malibu’s Carnival Grounds (a designated event space) should be considered. 2. Fire Risk and Lack of Evacuation Routes Topanga residents remain barricaded inside the canyon while Malibu residents receive PCH access passes. This creates a serious safety risk—especially since the proposed toxic waste site is at the base of one of our only two emergency exits. California Department of Forestry & Fire Protection (CAL FIRE) Report (2023): Lists Topanga as a Very High Fire Hazard Severity Zone and emphasizes that limited evacuation routes increase wildfire casualties.Study: Wildfire Evacuation and Road Access (UC Davis, 2020) found that blocked exits during wildfires significantly increase loss of life.Case Study: The 2024 Topanga landslide already isolated the community and highlighted the dangers of limited evacuation options. A similar scenario during a wildfire could be catastrophic.Topanga residents need unrestricted access to PCH, just as Malibu residents do. Blocking one of only two escape routes for a toxic waste facility puts thousands of lives at risk. As such we are also working with the county, and pleading with the county, to provide PCH passes to the Topanga residents 3. Route Access and the Dangers of Using Highway 27 Using Highway 27 as a route for toxic waste transport is highly dangerous and irresponsible, yet we have no written confirmation that this route will not be used. Topanga Canyon Blvd (Hwy 27) is notoriously treacherous, with frequent mudslides, rockslides, and accidents—especially on the S-Curve, one of the most dangerous stretches of highway in Los Angeles County.Exiting the Topanga Ranch Motel site requires making a left turn onto a high-speed, high-traffic highway—an extremely dangerous maneuver for large hazardous waste trucks.In contrast, Will Rogers State Park offers a safer option: trucks would turn right at a signalized intersection, directly onto PCH, improving traffic flow and reducing accident risk.Population Density: Topanga is home to nearly 13,000 residents and active businesses, all of whom depend on Hwy 27 for daily life. In contrast, traffic at Temescal and Will Rogers has drastically decreased due to the fires, making those locations far less disruptive and much safer.Supporting Data on Road Safety: California Highway Patrol Accident Data (2023): Identifies the Hwy 27 S-Curve as a high-risk zone due to frequent accidents.Federal Highway Administration (FHWA) Study (2021): Shows that left-hand turns onto busy highways significantly increase accident risk—whereas right-hand turns at traffic signals reduce collisions by up to 60%. 4. Risk of Accidents Due to Hasty Cleanup & Dangerous Location Near a Gas Station The 30-day EPA deadline increases the likelihood of serious errors in handling toxic waste. U.S. Government Accountability Office (GAO) Report (GAO-20-73): Warns that rushed hazardous waste cleanup leads to mismanagement, accidental exposure, and contamination risks.Study: Hazardous Waste Management Under Time Constraints (Environmental Science & Technology, 2019) found that shortened deadlines increase human error in waste handling.Additionally, the proposed site is directly across from a gas station—a critical safety hazard. National Fire Protection Association (NFPA) Study (2022): Shows that toxic chemicals stored near fuel sources dramatically increase the risk of explosions.EPA Risk Management Plan (RMP) Rule (2019): Requires minimum buffer zones between hazardous waste sites and flammable fuel sources—this site fails to meet those safety requirements.Example: The West, Texas Fertilizer Plant Explosion (2013) was caused by improper storage of hazardous materials near combustible substances, leading to mass casualties.This combination of rushed cleanup, hazardous transport conditions, and dangerous proximity to fuel sources makes this site completely unsuitable for toxic waste storage. 5. Protection of Indigenous Cultural and Sacred Land The Topanga Ranch Motel site is sacred land to the local Indigenous Tongva and Gabrielino tribes. California Native American Heritage Commission (NAHC) Designation: Recognizes this area as culturally significant to Indigenous communities.Federal Cultural Protection Laws (e.g., National Historic Preservation Act, Native American Graves Protection and Repatriation Act): Typically forbid hazardous projects on sacred lands, yet this protection appears to have been waived due to emergency status.Community Responsibility: We must respect and protect these lands rather than desecrate them with toxic waste storage. Conclusion: Why This Matters Scientific research confirms that rushed hazardous waste removal increases risks.EPA and environmental studies warn against storing toxic materials near water sources or flammable sites.Fire and evacuation experts stress the importance of open access routes in high-risk fire zones like Topanga.Safer, more logical alternative locations exist that minimize environmental and public safety risks.The proposed site is culturally significant and should be protected, not contaminated.We demand that this site be removed from consideration immediately. Instead, hazardous waste storage must be placed in a safer, more appropriate location that does not endanger our homes, environment, and heritage. Please sign and share to protect Topanga and our community. Bonnie WrightUnited States14,4051/29/25Firefighters demand restored access to critical detox treatmentOn March 6, the California State Board of Pharmacy (BOP) is expected to pass a set of regulations that would make it virtually impossible for firefighters to access glutathione – a critical breathing treatment – just as many of us need it the most. "Glutathione has the potential to be an absolute game-changer for firefighters across the country. It's confusing to me to me that it's so difficult to access this. I hope we can find a solution where glutathione becomes as common as washing a firefighter's turnouts after a fire." - Fire Captain David Marquez, Pasadena Firefighters Local 809; first responder on the Jan. 2025 Eaton Fire; petition author Glutathione is an antioxidant made in the liver and lungs. Environmental medicine doctors who treat firefighters report that just one month of inhalable glutathione treatment can reduce or even eliminate respiratory symptoms associated with long-term occupational exposure to smoke. (Links to glutathione research and preliminary data from the glutathione-centric Firefighter Detox Pilot Program being conducted in Sonoma County can be found here.) Many of us who got sick from working the Eaton and Palisades Fires have had the opportunity to nebulize glutathione with environmental doctors who deployed to our base camps and fire stations. Firefighters nebulize glutathione at the Rose Bowl; Eaton Fire 2025 The treatment has helped with our acute exposures. Our coughs subsided. The pain in our chests lessened. It works and we're grateful for that. But intermittent treatment under doctor supervision does not address the deeper, chronic exposures we face in the course of a career. We need longer-term, at-home glutathione treatment, but we can’t get it in California. Doctors can legally write a prescription for nebulized glutathione, but no pharmacist in the U.S. will compound it for California patients because, since 2020, the California BOP has unfairly regulated and disciplined pharmacists who do so. The last batch of nebulized glutathione ever dispensed in California was in June 2023, for a Firefighter Lung Detox Clinic in Sonoma County. Those firefighters have been without treatment ever since. The BOP's behavior is baffling and unjust and, as a result, patients – firefighters – are needlessly suffering. Glutathione is safe, legal, and allowable by the FDA – and it’s available in 49 other states. California is the outlier."The breathing treatment I had today has really helped out within the first half hour after I had it. I've seen a lot of firefighters affected by cancer... I've seen the suffering they go through. This will prevent a lot of suffering."- Fire Capt. Eric Nakamaru, Member, United Firefighters of Los Angeles City, Local 112; first responder on the Palisades Fire The March 6 BOP meeting is our last chance to block new regulations that would make it even harder for us to regain access to this potentially life-saving treatment. WHAT CAN YOU DO? 1. Sign and share this petition. If you can, please add a comment with your department or union. If you’ve experienced glutathione treatment (or would like to), include that as well. This petition will be presented to Board Members on Feb. 5 and – if their harmful regulations pass – we’ll take it to legislators too. 2. Make a public comment at the Feb. 5 meeting. The only reason the BOP didn’t pass an outright ban on glutathione years ago is because of firefighter resistance. Your voice is powerful. Make it heard. Call-in details and talking points are here. 3. Contact your labor leaders ASAP and tell them to ask California Professional Firefighters to get involved. CPF staff members have been monitoring the situation with the BOP since last summer. They’ve told us that CPF is willing to get involved but not until they hear from more unions. This is the moment! We can regain and retain access to this incredibly promising treatment, but only if we work fast and work together. Gold Ridge Fire Chief Shepley Schroth-Cary receives a glutathione IV at his station in Sonoma County; 2020 “A number of Fire Chiefs in Sonoma County have recognized the benefit of glutathione to remove carcinogens from our members as well as ourselves. We have invested in the use of glutathione providing nebulized glutathione as well as IV glutathione for a more intense detoxification. The results of the use of both have included a reduction in respiratory congestion and stopping chronic coughs, generally feeling better, and a measurable reduction in toxins found in our bodies. We have also been provided hope that we can invest in our health and prevent cancer. Our job regardless of preventative measures will and does expose us to toxins. We need resources to remove toxins from our bodies. Taking access away from us is cruel and unacceptable. As fires rage in southern California thousands of firefighters and millions of citizens are being inundated with toxins that are carcinogenic, increasing risk of cancer and many other health issues. Your decision will take an important tool away from us and other Californians when they need it most. “ Jan. 8, 2025 - Fire Chief Shepley Schroth-Cary (Gold Ridge Fire Protection District; participant in round 1 of Firefighter Detox Pilot Program; petition co-author) For more information, please contact Jacqui Jorgeson, founder and Executive Director of the Sonoma County-based nonprofit, the Volunteer Fire Foundation: Email: jacqui@volunteerfire.org; Phone: 707-708-4780 Petition co-authors: Fire Capt. Eric Nakamaru, Member, (United Firefighters of Los Angeles City, Local 112); first responder on the Palisades FireFire Capt. David Marquez (member of Pasadena Firefighters Local 809); Fire Chief Shepley Schroth-Cary (Gold Ridge Fire Protection District); Fire Chief/Battalion Chief Jason Jenkins (Cloverdale Fire/Santa Rosa Fire); Engineer Amanda Newhall (President of Healdsburg Local 2604); Fire Capt. Jason Campbell (Vice-President, Sonoma Valley Firefighters Local 3593); Jacqui Jorgeson (Volunteer Fire Foundation)Jacqui JorgesonUnited States2,8541/31/25Mandatory Autism & Mental Health Training for First Responders, Educators & ResourcesMy Family and I are one of countless victims to police using excessive force due to a lack of understanding and empathy towards mental illnesses. A Disabled Veteran with PTSD traveling with his nonverbal autistic son should never result in civil rights violations and a wrongful arrest during a routine traffic stop. Especially when the exact same officer has repeatedly lied & harassed him & others before in the past with unlawful traffic stops with a prior stop being in the home driveway of my family member at night after cops follow them home for miles before executing stop at residence. These type of officers with repetitive actions against certain people needs their immunity revoked & terminated because training won't help those type with ego/character issues that are simply on the job to terrorize & harm innocent individuals. The training is fo'''
