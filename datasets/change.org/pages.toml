["https://change.org/p/implement-a-joshua-alert-for-missing-children-with-spectrum-disorders"]
title = 'Petition · Implement a "Joshua Alert" for Missing Children with Spectrum Disorders - United States · Change.org'
description = 'Our family experienced a devastating loss; our autistic son went missing and was tragically found dead in a pond behind our house 28 hours later. It is our heartfelt belief that if an alert system similar to "Amber Alert" but specified for missing children with spectrum disorders—the "Joshua Alert”—were instituted, we might have had a fair chance of finding our son in time. Children with Autism ar'
full_description = 'Implement a "Joshua Alert" for Missing Children with Spectrum DisordersImplement a "Joshua Alert" for Missing Children with Spectrum DisordersRecent signersRukiye Sen•31 minutes agoHa My Luu•5 hours agoHeidi Williams•8 hours agoSara Stockdale•8 hours agoRihanna Meux•9 hours agoMaggie Shin•9 hours agodasia phifer•10 hours agoJulie Ritenour•10 hours agoMisa .•10 hours agoAshley Martinez•12 hours agoJonathan Castillo•13 hours agoPranav Devabhaktuni•14 hours agoStacie Greer•22 hours agoLinda Kourtis•1 day agoAlexis Marquez•1 day agoCatherine Williams•1 day agoLizzy Juarez•1 day agoMegan Nelson•1 day agoLatonda Hinton•1 day agoRukiye Sen and 18 others have signed recently.Decision Makers: Maxine Waters +38 Media MentionsThe IssueOur family experienced a devastating loss; our autistic son went missing and was tragically found dead in a pond behind our house 28 hours later. It is our heartfelt belief that if an alert system similar to "Amber Alert" but specified for missing children with spectrum disorders—the "Joshua Alert”—were instituted, we might have had a fair chance of finding our son in time. Children with Autism are likely to wander off or bolt from safety—an event prompted by either a specific distraction, a desire to escape an overwhelming situation, or the simple curiosity to explore. According to the National Autism Association, nearly half of children with autism engage in wandering behavior. More alarming is that more than one third of these children are unable to communicate their name, address, or phone number (source: Interactive Autism Network Research Report: Elopement and Wandering, 2011). The reality of this vulnerability necessitates immediate responses when these children go missing. By implementing a "Joshua Alert," authorities will be signaled immediately when a 911 call is made, and the search for the missing child can commence without delay. In memory of our son and for the safety of all children with Autism Spectrum Disorder, we urge decision makers to require the implementation of "Joshua Alert" in our communities nationwide. Please sign this petition to support an immediate response mechanism for missing children with spectrum disorders.Report a policy violationJay HoganPetition StarterMedia inquiriesSign petition15,175Verified signaturesRukiye Sen•31 minutes agoHa My Luu•5 hours agoHeidi Williams•8 hours agoSara Stockdale•8 hours agoRihanna Meux•9 hours agoMaggie Shin•9 hours agodasia phifer•10 hours agoJulie Ritenour•10 hours agoMisa .•10 hours agoAshley Martinez•12 hours agoJonathan Castillo•13 hours agoPranav Devabhaktuni•14 hours agoStacie Greer•22 hours agoLinda Kourtis•1 day agoAlexis Marquez•1 day agoCatherine Williams•1 day agoLizzy Juarez•1 day agoMegan Nelson•1 day agoLatonda Hinton•1 day agoRukiye Sen and 18 others have signed recently.Decision Makers: Maxine Waters +38 Media MentionsThe IssueOur family experienced a devastating loss; our autistic son went missing and was tragically found dead in a pond behind our house 28 hours later. It is our heartfelt belief that if an alert system similar to "Amber Alert" but specified for missing children with spectrum disorders—the "Joshua Alert”—were instituted, we might have had a fair chance of finding our son in time. Children with Autism are likely to wander off or bolt from safety—an event prompted by either a specific distraction, a desire to escape an overwhelming situation, or the simple curiosity to explore. According to the National Autism Association, nearly half of children with autism engage in wandering behavior. More alarming is that more than one third of these children are unable to communicate their name, address, or phone number (source: Interactive Autism Network Research Report: Elopement and Wandering, 2011). The reality of this vulnerability necessitates immediate responses when these children go missing. By implementing a "Joshua Alert," authorities will be signaled immediately when a 911 call is made, and the search for the missing child can commence without delay. In memory of our son and for the safety of all children with Autism Spectrum Disorder, we urge decision makers to require the implementation of "Joshua Alert" in our communities nationwide. Please sign this petition to support an immediate response mechanism for missing children with spectrum disorders.Report a policy violationJay HoganPetition StarterMedia inquiries96 people signed this weekSign petition15,175Verified signaturesThe Decision MakersMaxine WatersU.S. House of Representatives - California 43rd Congressional DistrictNo response (notified 88 days ago)Email decision makerU.S. House of RepresentativesNo response Kamala HarrisFormer Vice President of the United StatesNo response View 1 moreThe SupportersFeatured CommentsDylan, West Chester Township3 months agoI live in the community where Joshua went missing. An alert wasn’t sent out until about 11:30 PM, Joshua was declared missing at 5:30 PM. Joshua was already dead by then. If there was an instant alert, he could’ve been saved. This alert would save countless lives of children on the spectrum. Rest in peace, Joshua.Whitney, Hamilton3 months agoAs someone who is on the spectrum, I know exactly how Joshua Jr. likely felt in the moments before this tragic incident. When I was his age, I got overwhelmed by things a lot easier, and was fixated on things a lot more easily. I’m an adult now, attending college, and while I’m still on the spectrum, I know my limits. However, 6 year olds cannot. I, in fact, didn’t get to know my limits and be able to express them for/by myself until shortly after I graduated high school. Furthermore, this happened a very short driving distance away from my hometown, so it hit close to home in more ways than one. Even though I never met him, Joshua Jr. will always have a special place in my heart.Show full textHazel, Winchester3 months agoIt’s hard to express my feelings about this case; devastation is the only word that comes to mind. There needs to be more done for children with special needs. The moment it was called in, there should have been an alert sent out if there wasn’t already. A child with special needs is also an endangered missing child and should be treated just as such. I pray a change happens to prevent this unspeakable incident from ever occurring to another family.Show full textView all commentsFeatured Videos32925109971Sign and share why you care!Share this petitionShare this petition in person or use the QR code for your own material.Download QR CodePetition created on November 24, 2024Change.orgMental HealthImplement a "Joshua Alert" for Missing Children with Spectrum Disorders'
