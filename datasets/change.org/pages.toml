title = "How to Write a Petition · Change.org"
description = "When writing a petition, consider the type or medium that best suits your goals. Petitions can be created in paper or online format or both. Platforms like Change.org can help movement leaders build successful internet petitions that can reach a broad audience and build momentum."
full_description = "NewsGuidesShare this postShare this postfacebooktwitteremailStart a petitionGuidesHow to Write a PetitionApr 26, 2023 Creating a successful petition involves clearly communicating your cause, knowing your audience, and persuasively presenting your case. In this comprehensive guide, we’ll share key components and tips on how to write a petition that can inspire change and make a difference. In this guide: Petition Type or medium Research petition topic and develop your argument Define and understand your audience and decision makers Define and state your goals Draft a brief summary of your cause Include accurate information and resources Figure out how many signatures you need Select your petition type or medium When writing a petition, consider the type or medium that best suits your goals. Petitions can be created in paper or online format or both. Platforms like Change.org can help movement leaders build successful internet petitions that can reach a broad audience and build momentum.Select your petition type or medium Paper Petitions Paper petitions have a traditional and personal feel, often used for local issues or smaller campaigns. These petitions are typically distributed and collected in person, making it essential to have a clear, concise, and visually appealing format. Ensure your petition contains all necessary information, such as the cause, the desired outcome, and a space for signatures and contact information. Online Petitions Online petitions offer a wider reach and the ability to gather support quickly. Platforms like Change.org make it easy to create, share, and manage your petition, reaching potential supporters through social media, email, and other online channels. Online petitions also allow for real-time tracking of signatures and easy communication with supporters. Start a petition Research your topic and develop your argument Conduct thorough research on the cause or issue for which you desire change. Understand the objections you may face, rules, regulations, and other relevant information. Use your research to develop a persuasive argument that will convince decision-makers to support your cause. Understand the legal and regulatory framework Become familiar with any laws, regulations, or policies relevant to your cause. This knowledge will help you craft a more compelling case and anticipate potential objections or challenges. It also demonstrates to decision-makers that you’ve taken the time to understand the issue thoroughly. Identify key stakeholders and supporters Reach out to experts, organizations, or individuals who may support your cause. These connections can provide valuable insights, resources, and credibility to your campaign. They can also help amplify your message and mobilize additional supporters. Define and understand your audience and decision makers Identify the decision-makers your petition needs to address and get in front of. Understand your audience and what motivates them. Is it a teacher, administrator of an organization, government official, board member, etc.? Tailor your message to your audience and their needs. Use persuasive language and storytelling Use compelling language and storytelling techniques to engage your audience emotionally. Share personal anecdotes, success stories, or case studies that illustrate the impact of the issue and the change you hope to achieve. By creating an emotional connection, you’ll be more likely to inspire action and support. Address potential objections Anticipate and address any potential objections or concerns your audience might have. Demonstrating that you’ve considered multiple perspectives and have thoughtful responses to their concerns will make your argument more credible and persuasive. Define and state your goals Draft a statement that frames the petition goals and how it should be presented. Make sure that your goals are precise and informative, using bullet points to emphasize key points. Clearly state what you hope to achieve with your petition and why it matters. Referring to a petition sample, such as the one included in this guide, can provide you with inspiration and help you better understand how to structure your goals effectively. Set realistic and achievable objectives While it’s essential to be ambitious, it’s also crucial to set realistic and achievable objectives. By setting attainable goals, you’ll be more likely to maintain momentum and keep supporters engaged throughout the campaign. Break down complex goals into smaller steps If your cause involves multiple goals or complex issues, break them down into smaller, more manageable steps. This approach makes it easier for supporters to understand the specific actions needed and the progress made towards achieving your goals. By presenting your objectives in a clear and organized manner, you’ll increase the likelihood of gaining support and achieving success.Draft a brief summary of your cause Include a brief statement (2-3 paragraph summary) of the cause and provide resources, context, and why it matters. Use a clear, concise tone to communicate the importance of your cause and why people should care about it. Focus on the most compelling aspects of your cause Highlight the most critical aspects of your cause that will resonate with your target audience. Emphasize the urgency, the potential impact, and the benefits of supporting your cause. By focusing on the most compelling aspects, you’ll create a stronger emotional connection with your audience. Use simple and clear language When drafting your summary, use simple and clear language to ensure that your message is easily understood by a broad audience. Avoid jargon, complex sentences, or technical terms that may confuse or alienate potential supporters. Include accurate information and resources Prepare references for any statements made, as well as any historical context that would support your argument. Include author names, books, websites, and other resources to back up your claims. Fact-check and verify your information Ensure that all facts, figures, and claims included in your petition are accurate and verifiable. Inaccurate or misleading information can damage your credibility and undermine your campaign. Take the time to fact-check and verify all data before publishing your petition. Use reputable sources Rely on reputable sources when gathering information and building your case. Using well-regarded sources adds credibility to your petition and demonstrates that you’ve conducted thorough research. Figure out how many signatures you need Determine the local government or organization requirements regarding the number of signatures required for a petition to be taken into consideration. Different locales or cases may have varying requirements for the number of signatures needed to achieve success. Understanding the number of signatures needed can help you set realistic goals and track your progress. Utilizing a petition template, like the one provided in this guide, can assist you in organizing your goals and gathering the required signatures efficiently. Set intermediate goals for signature milestones To maintain momentum and engagement, set intermediate goals for signature milestones throughout your campaign. Celebrate these achievements and update supporters on the progress made towards your ultimate goal. Regularly communicate with supporters Keep your supporters informed and engaged by regularly sharing updates, news, and developments related to your cause. This communication fosters a sense of community and encourages supporters to stay involved and continue promoting your petition. Start a petition Written byChange.orgFor more information about what is allowed (and what’s not allowed) on Change.org, please read our Community Guidelines. You May Also Like Petition Definition How to write a petition letter How to write a petition Petition Template What is the right to petition? How to start a petition How to start a school petition What happens when you sign a petition Do online petitions work? How to start an hoa petition How to Get a Law Changed"
