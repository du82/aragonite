full_description = '''Petition updatePass the United Nations Sexual Assault Survivors' Bill of Rights ResolutionVictory! UN adopts our resolution for survivor rights!Amanda NguyenWashington, DC, United StatesOct 3, 2022We did it!!! Because of you, 1.3 billion survivors of sexual violence worldwide have access to justice. WATCH OUR VIRAL VICTORY VIDEO: https://bit.ly/3ycNXWZ On September 2, 2022, the United Nations General Assembly unanimously adopted our resolution for survivor rights, condemning sexual violence and urging all countries to provide victims and survivors access to justice, reparations, and assistance. The resolution effort was led by the governments of Sierra Leone and Japan. A coalition of global survivors, spearheaded by Rise, has been fighting for survivors at the United Nations for more than six years. With your backing, we’ve pioneered Survivor Town Halls at UN HQ, held hundreds of meetings with UN diplomats, and displayed outfits from survivors worn at the time of their attack in a powerful art exhibit staged in the hallowed halls of the UN. We even delivered a huge thank-you card to the President of Sierra Leone with all your signatures! At Rise, we believe justice should not depend on geography. Basic protections against sexual violence and access to justice should be available to everyone, no matter their gender, age, nationality or citizenship. And finally, thanks to you, a new international standard has been set at the United Nations–the highest level of global governance. This is a huge milestone that should be celebrated, but the work does not stop here. Follow our work at @risenow.us to learn about ways to stay involved and continue fighting for survivor rights in your country. Thank you for your solidarity. You are not alone. I want you to know that no one is powerless when we come together. No one is invisible when we demand to be seen. Amanda Nguyen CEO and Founder, RiseSharePost on XEmailPreviousJoin United Nations Art Exhibit: "What Were You Wearing?"'''
