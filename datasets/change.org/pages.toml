title = "Environment · Change.org"
full_description = '''TopicEnvironment48,280,030 supporters taking action on this topic.30,918 petitions started in this community.Start a petitionLearn more about Environment topic at Change.orgThe environment is a critical topic that is gaining increasing attention globally due to the pressing issues of climate change, pollution, and biodiversity loss. Recent events, such as extreme weather patterns and the rise of youth-led environmental movements like Fridays for Future, have brought environmental concerns to the forefront of public awareness. Key issues and themes in environmental petitions include calls for stronger government action to combat climate change, protect endangered species and habitats, reduce plastic pollution, and promote sustainable practices. Notable petitions include campaigns to ban single-use plastics, halt deforestation in the Amazon rainforest, and divest from fossil fuels. Join the movement by exploring and supporting petitions that advocate for positive environmental change. Your involvement can help drive policy changes, protect ecosystems, and create a more sustainable future for generations to come.Explore 30,918 petitions in EnvironmentTrendingMost RecentProtect the Porkies, Protect Lake Superior— Stop the Copperwood Mine!457,469 signaturesSave Outdoor School11,115 signaturesReform the Florida Fish and Wildlife Conservation Commission5,195 signaturesSave The Animals Suffering at the Holtsville Ecology Site and Shut It Down2,550 signaturesAsk Meta(Facebook) to open up Portal to avoid over 1400,000 electronics waste2,101 signaturesHalt Harmful Development on Botmaskop Mountain3,390 signaturesUSDA: End Harmful Dairy Subsidies9,704 signaturesStop the willow project5,282,145 signaturesShow moreStories and updates from petition startersProtect the Porkies, Protect Lake Superior— Stop the Copperwood Mine!In case you missed it: the December 9th Townhall PresentationHi team, Our first Virtual Townhall was a great success! In case you weren't able to attend, here is the presentation, giving an overview of our arguments, as well as the current state of the Mine, of Highland Copper, and of our resistance campaign. If you were present, here is the video of tailings dam collapses with corrected audio. This is the video the mining industry doesn't want you to see! The Mount Polley Mine in British Columbia was designed and operated by Canadian experts at the top of their field, and it followed all environmental regulations— even so, the dam still burst, and when it did, it devastated an outdoor recreation economy much like our own. Thank God it wasn't the closest sulfide mine to Lake Superior in history... Do recall that, since Copperwood's ore grade is 1.5% (at best), nearly 99% of all extracted material will be heavy metal-laden, sulfide-bearing mine waste, to be stored on-site, forever, on topography sloping towards 10% of the world's surface freshwater. We have also updated our Take Action! page: when writing to politicians, please push for an official state petition for review of the Copperwood project, as is being conducted with Line 5. Until next time!December 11, 2023Protect the Porkies, Protect Lake Superior— Stop the Copperwood Mine!10,000 signatures and RISING— How will Michigan respond?What a way to start the New Year! Our petition calling for the halt of the atrocious Copperwood project has officially passed 10,000 signatures, with no signs of slowing down— that's more than the populations of Ironwood, Bessemer, and Wakefield combined! Those signatures come from folks just like you who recognize that Lake Superior, Porcupine Mountains Wilderness, and the North Country Trail hold tremendous collective value which transcends any individual interest or profit motive. First thing's first: we invite you to watch our new video, which elaborates many potential technical problems with Highland Copper's plans. Now, onto our next COLLECTIVE ACTION.. In celebration of this amazing milestone, we are organizing a mass outreach effort to Governor Whitmer. Contacted the Governor already? Let’s do it again! This is our most important action yet, and we are asking for 100% participation. Whether or not you are a Michigan resident, we all deserve to have our voices heard. Please express your thoughts in your own words, but to get you started, here‘s a reminder of our two main points: 1) Mining and Wilderness are simply not compatible. Porcupine Mountains State Park is the largest designated Wilderness Area in mainland Michigan— and in the 21st century, is there anything scarcer than access to pristine Wilderness? We come to the Porkies to hike and forage, to fish and hunt, to stargaze and sit in silence beneath old growth hemlocks, and so much more. But this list doesn't begin to capture the true importance of outdoor recreation in our lives: for many, finding a moment of peace in Nature is deeply meaningful experience, even spiritual. Unfortunately, although Copperwood would be on private property, so many of its influences would radiate beyond map lines: light pollution, noise pollution, air pollution, water pollution, subterranean blasting, and heavy industrial traffic. It is unthinkable that such a sensory onslaught would not greatly degrade the Wilderness experience of those at the Park, as well as the hikers of the North Country Trail. 2) Copperwood would be the closest sulfide mine to Lake Superior in history. Copper sulfide mines always contaminate, and though the ways are many, one of our chief concerns is the construction of a 323-acre mine waste containment facility, erected at the juncture of streams rerouted into unstable 90-degree angles, on topography sloping towards Lake Superior. Remember that at best only 1.5% of what comes out of the ground will be copper, and everything else will be heavy metal-laden, sulfide-bearing waste, comprising 50+ million tons in total, in unprecedented proximity to the largest freshwater lake on the planet. Tailings dams are far from invincible— the first dam in this video was classified as a "low-risk structure“; the second dam was designed and constructed by experts at the top of the field in Canada and complied with all environmental regulations. What do these two dams have in common? They both crumbled, releasing a flood of toxic tailings sludge many miles from the point of origin. The Governor says she‘s serious about climate change. Well, as we come to live on a hotter, drier planet, Lake Superior represents not just the most important resource in Michigan, but easily in the entire continent. How then can we allow such a threatening project to move forward, especially in the hands of a company which already has a history of violating permits? ________________________________________________________ For a full breakdown of our concerns regarding Highland Copper's plans, please see this new video, released just last week. The main point is this: sometimes, regulations are not enough. Sometimes, it’s sound judgment which is more important, and Copperwood is simply the wrong project at the wrong place in the wrong hands. Conclude your message by asking the Governor to file an official petition for review of the Copperwood project. More detailed strategies will be explored later— for now, our main goal is to make sure the Governor feels the force of our stomping boots and hears the solidarity behind this message: the true heritage of the Upper Peninsula is not mining, but the incredible gift of Wilderness and Lake Superior. The U.P. still has what the rest of the Midwest has lost— will she help us protect it, or won’t she? Reach out by phone, mail, online form, or all of the above! Phone: 517-335-7858 Mail: Governor Whitmer P.O. Box 30013 Lansing, Michigan 48909January 7, 2024Protect the Porkies, Protect Lake Superior— Stop the Copperwood Mine!9000 SIGNATURES! Time to write to Attorney General Nessel!Hi team, Our efforts are bearing fruit! Remember our media outreach action? Since then, we have appeared in both local ABC news and the Keweenaw Report, with upcoming stories in multiple other publications, including MLive! The reporter from MLive specifically mentioned that they had received a great many e-mails asking them to cover our campaign. The moral of the story? Your efforts are actually making an impact. Today, in celebration of this tremendous 9,000-signature milestone, we will be writing Attorney General Dana Nessel. Here is her contact info: E-mail: miag@michigan.gov Phone: 517-335-7622 Office: G. Mennen Williams Building525 W. Ottawa StreetP.O. Box 30212Lansing, MI 48909 Facebook Twitter (or X, or whatever it's called...) Try to write an e-mail, at the very least. But don't underestimate the impact of making a statement on social media: whereas e-mails, phone calls, and letters will be private, outreach on social media will be seen by a larger audience. Below is a sample letter which you can use as inspiration or forget about completely. Regardless of what you write or say, try to include some variation of this statement: "We request that you file an official petition for review of the Copperwood project." Please also suggest that the Attorney General visit our own petition for potential points of investigation, specifically the sections V, VI, and VII. ———————————————————— Sample message:"Dear Attorney General Nessel, I would like to call your attention to several concerns regarding the proposed Copperwood Mine in Gogebic County of the Upper Peninsula. Although billed as a "copper mine," the ore grade is only 1 to 1.5%, meaning that nearly 99% of extracted material will be heavy metal-laden, sulfide-bearing waste rock, comprising 50+ million tons in total, stored on site, on topography sloping towards Lake Superior. This is not just another mine: this would be the closest sulfide waste facility to Lake Superior in history. As the largest freshwater lake on Earth, Lake Superior is without a doubt the most important resource not just in Michigan, but arguably the entire continent, and I urge you to critically examine the unprecedented risks posed by the Copperwood project. You can find a full elaboration of the arguments against the Mine at this petition, which already has over 9,000 signatures, more than the population of the closest three towns to the mine site combined. Specifically, you might visit the sections V, VI, and VII, regarding impacts to outdoor recreation, the potential for a tailings dam rupture, and additional concerns. These are the points which resonate with me personally: The risk of a tailings dam rupture is real. Are you familiar with the Mount Polley Mine in British Columbia? It was designed and operated by experts at the top of the field in the Canadian mining industry, and it followed strict environmental regulations; all the same, the dam still ruptured, and when it did, it crippled a thriving outdoor recreation area. If it can happen there, it can happen here. There is a Michigan endangered species, the Redside Dace, in the very stream where the mining company is permitted to dump up to half a million gallons of wastewater per day. Although the water will undergo extensive treatment, it will be biologically dead water, deprived of minerals and microbes— flooding the stream with such water will be detrimental to the ecosystem. Furthermore, the water will undergo deionization. I urge you to look into the risks of deionized water, including this report from the World Health Organization. Deionized water is called aggressive because it is highly corrosive, leaching not just vitamins and minerals from the human body if it is consumed, but also heavy metals from stream sediment. There is the very real risk that flooding the stream with deionized water will result in the concentration of heavy metals in the habitat of the Redside Dace. Finally, this Mine endangers not just Lake Superior, but the experience of visitors at Porcupine Mountains State Park — the most beloved State Park in Michigan — as well as hikers on the North Country Trail, which was just recently declared part of the National Park system. Sound pollution, light pollution, air pollution, water pollution, subterranean blasts, and heavy industrial traffic— all of these influences will have an impact far outside the borders of the mine property. I guess in the end, it all boils down to this point: Is this really a good place for a sulfide mine? Really?I kindly request that you file a formal petition for review of the Copperwood Mine. Please act swiftly, for the project is advancing faster than anticipated: this summer, forest has been clearcut, wetlands destroyed, and streams rerouted. There may be a construction decision in 2024. There is no time to lose. Thank you for your consideration.Sincerely,Your Name Here" ———————————————————— Feel free to forward us your message: ProtectThePorkies@gmail.com Alright team, until next time! P.S. Remember there is a virtual meeting with EGLE, the agency responsible for permitting Copperwood, being held on Monday, December 18th. Please attend to make your voice heard!December 15, 2023Show moreVictories in EnvironmentVictoryGet Amazon to Offer Plastic-Free Packaging Options784,679 signaturesVictoryKeep Oil Exploration Out of Virunga National Park286,649 signaturesVictoryTell President Obama and the EPA to Stand Up to Big Oil196,410 signaturesVictoryGovernor Quinn: Don't Let Big Plastic Bully Me!172,198 signaturesShow more1. Start your petitionWe’ll help you build a campaign that gets noticed.2. Gather SupportEngage a large community of people who care about your cause.3. Reach those in powerInfluence decision-makers in government, companies, and other institutions to make real change.Don’t see your cause here yet? Make your voice heard!Start a petitionHomeTopicEnvironmentHomeTopicEnvironment'''
