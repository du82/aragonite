["https://change.org/l/us/policy-change-guide"]
title = "People-powered policy change: Adapt as we evolve through action · Change.org"
description = "One of the most far-reaching and impactful pieces of legislation in recent years is the Inflation Reduction Act addressing climate change, healthcare costs, and tax reform. It initiated one of the largest federal investments in clean energy to reduce carbon emissions, and enforced lower prescription drug prices and a minimum tax requirement for corporations. The […]"
full_description = "NewsGuidesShare this postShare this postfacebooktwitteremailCivic EngagementPeople-powered policy change: Adapt as we evolve through actionFeb 20, 2025President Joe Biden signs H.R. 5376, the “Inflation Reduction Act of 2022”, Tuesday, August 16, 2022, in the State Dining Room of the White House. (Official White House Photo by Cameron Smith) One of the most far-reaching and impactful pieces of legislation in recent years is the Inflation Reduction Act addressing climate change, healthcare costs, and tax reform. It initiated one of the largest federal investments in clean energy to reduce carbon emissions, and enforced lower prescription drug prices and a minimum tax requirement for corporations. The IRA represents a significant and complex shift in American policy which redirects government spending and regulatory authority. It reflects the evolving and changing needs of society and the planet. Previous policies were failing to effectively combat dangerous climate change and reduce financial healthcare burdens on citizens. Even though government, companies, and individual leaders hold the power to authorize and implement policy change, citizens can propose and influence it. The passing of the IRA was largely due to public pressure. Climate scientists and advocacy groups worked to determine goals and deadlines for reducing carbon emissions, while pushing legislators to institute policies supporting them. Ultimately, a coalition of grassroots advocates, organizations, political cosponsors, and the media putting consistent pressure on legislators resulted in reaching a deal and passing the bill. In an examination of how this highly debated landmark legislation got passed, Leah Stokes, Radcliffe Institute at Harvard Fellow said, “the role of activists cannot be understated.” Learn how the policy change process works and how you can be an important part of it. → Start your petition today on Change.org What is policy change? Policy change is when different levels of government, businesses, and organizations amend, eliminate, or create official policies. The top factors that prompt policy change include new or changing political leadership, economic shifts, public opinion and values, judicial decisions, and research and data. Types of policy change Policy change can include modifications to existing policies, repealing or replacing existing policies, reinstating previous policies, and creating entirely new policies. The major areas of policy change include: Legislation: Policy changes made by elected government representatives, including members of Congress, state-level officials, and city council. Regulation: Policy changes made by government agencies through rulemaking and specification of broad legislative policies, like the EPA setting new emissions standards for industries. Litigation: Court decisions that shape policy, such as Supreme Court rulings on healthcare or environmental laws that alter government actions. Budgetary: Policy shifts made through funding decisions, like increasing or cutting budgets for education, defense, or social programs. Non-governmental: Policies established by private companies, community or non-profit organizations, private schools, and other entities not controlled by the government. Why is policy change important? In a world where everything from communities, climate, and technology are ever-changing, the policies that shape, guide, and nurture them have to adapt accordingly. Tony Pipa who worked on international development at USAID and the State Department in the Obama administration shared his insights on the critical role of policy change. “My time in government taught me a lot about how reforming and updating policies could result in greater impact to catalyze economic growth, reduce poverty, and strengthen resilience in developing countries,” he said. The Los Angeles wildfires in January 2025 that destroyed homes, businesses, and communities are a tragic reminder of the dire need for policy change to help prevent and manage further devastation. The crisis is the result of decades of policy decisions that prioritized fire suppression rather than sustainable fire management. Previous policies allowed high-risk development with minimal protections. Climate change, worsened by unchecked carbon emissions, has amplified these risks. Long-term policy shifts are critical to mitigate these increasing threats. How does policy change happen? Policy change typically begins with identifying a problem, followed by proposing solutions, gaining support, passing new laws or regulations, and ensuring proper implementation. While governments play a central role, citizens, organizations, businesses, and advocacy groups all influence how policies take shape and evolve. Who drives policy change? Citizens and grassroots movements – Public demand can spark major policy shifts. For example, the Civil Rights Act of 1964 was driven by sustained activism. Government entities – Elected officials, agencies, and courts shape policies through legislation, regulation, and judicial rulings. NGOs & advocacy groups – Organizations like the American Lung Association push for laws to protect public health. Businesses and industry associations – Companies lobby for policies that align with economic interests, such as clean energy incentives. Academia and think tanks – Research influences decision-making, like climate studies leading to emission reduction policies. Media – Investigative journalism brings attention to pressing issues and builds public pressure. International bodies – Global agreements like the Paris Climate Accord influence national policies. Local leaders and community organizations – Cities and states often lead policy innovation, like minimum wage increases before federal action. Once a policy is passed, implementation is the process of putting it into action through government agencies, regulations, funding, and enforcement strategies. This typically involves: Rulemaking and regulation – Agencies like the EPA or IRS create specific rules to enforce new laws. Funding and budget allocation – Governments allocate resources to support implementation, such as grants for renewable energy under the Inflation Reduction Act. Compliance and enforcement – Authorities ensure adherence through inspections, penalties, or incentives, like tax credits for businesses adopting clean energy. Monitoring and evaluation – Policymakers assess effectiveness and adjust strategies based on data and public feedback, such as revising healthcare policies to improve accessibility. Advocacy strategies for driving policy change Citizens can actively participate in developing and reshaping policies through advocacy. If there are policies impacting issues like healthcare, the environment, immigration, transportation, and education that you want to see change, here’s what you can do to get involved. Research and collect data on the policy issue Before advocating for policy change, it’s essential to understand the issue inside and out. Research helps you build a strong, fact-based case for why change is needed. Gather background information – Review the details of existing policies related to the issue, their impact, and recent developments. Collect data and real-world examples – Use government reports, academic studies, and news articles to gather information and the latest data on who and where the issue impacts and how. Gather personal stories and examples of challenges the issue brings to communities. Study successful policy changes – Understanding what has worked before can strengthen your approach to how a proposed policy could be implemented and help predict challenges. Develop a messaging and communications plan A well-crafted message and plan for how you’ll share it ensures your policy campaign is clear, persuasive, and reaches the right people. Develop your core message – What problem does the policy address? Why does it matter? What’s the proposed solution? Include the data and personal stories you collected through your research. Choose your platforms – Plan where to distribute your message, which could include through a Change.org petition, your social media channels, emails to your network and potential supporters, or through building a website for your campaign. Reach the right audience – Engage the public, affected communities, policymakers, relevant influencers, and media to amplify awareness and support. Build a coalition Advocacy creates change through collective action. Bringing together supporters, experts, and organizations increases credibility and the chances that policymakers will consider and act on your proposal. Identify allies – Connect with community leaders, advocacy groups, researchers, and industry experts who share your goal and who can contribute their knowledge and recommendations to get results. Organize events and discussions – Host town halls, meet ups, and social media livestreams to educate and engage the public. Empower supporters – Educate supporters and provide them with data, key talking points, and ways to take action, such as signing petitions or contacting officials who can initiate policy change. Global climate change demonstration. Photo by Markus Spiske on Unsplash Outreach to policy makers Connecting with legislators and leaders is how you can share your message and pitch your policy initiative directly to those who are able to take action. Identify the right policymakers – Research which local, state, or federal officials have the authority to enact the policy change you’re advocating for. Look at their voting records, committee memberships, and public statements to understand their stance. Engage with lawmakers and officials – Request meetings, send emails, make phone calls, or attend public hearings to make your case. Mobilize collective action – Encourage supporters to sign petitions, share personal stories, attend rallies, and use social media to raise awareness and build pressure. Follow up and persist – Policy change takes time, so continue outreach, track progress, and adapt your strategy as needed. Real examples of policy change Collaboration among citizens, industry leaders, and government can drive large and small scale reforms, from transformative national policies to simple but important hyper-local changes. The following examples are real-world policy changes initiated by bipartisan legislation, emerging research, public demand, and grassroots movements. American Innovation and Manufacturing (AIM) Act The passing of the AIM Act represents a historic bipartisan climate policy change. The legislation requires phasing down the commercial production of potent greenhouse gases called hydrofluorocarbon (HFC) used in refrigeration and air conditioning systems. The AIM Act aligns the U.S. with the international Kigali Amendment, which aims to reduce HFC use worldwide. These key factors contributed to the bipartisan agreement to regulate HFCs: Industry consensus – Some companies backed the transition due to available alternatives, neutralizing opposition and bridging divides among different perspectives. State-level action – Many states had already implemented HFC policies, pressuring Congress to follow suit. International influence – Other nations had begun reducing HFCs, raising concerns about losing market access if the U.S. failed to act. The AIM Act’s success stands out in a divided Congress, but similar efforts to reduce greenhouse gases like methane and carbon dioxide face greater political resistance. The law is a rare bipartisan climate policy win and could serve as a model for future environmental legislation. Medical psychedelics policy Recent medical research and public demand for using psychedelics like psilocybin, MDMA, and LSD as mental health treatments are growing. In response, some states and cities including Oregon and Colorado are loosening restrictions—ranging from de-prioritizing possession enforcement to setting up licensed centers where adults can use these substances under supervision. These recent developments are raising a lot of questions and concerns about how the government will handle legislation and regulation regarding psychedelics which are illegal federally. Those include: How should federal agencies like the Veterans Affairs and Indian Health Service handle patient use? How will the Department of Justice treat state-sanctioned facilities that conflict with federal law? What role will Congress play in shaping future regulations? This is an example of recent policy developments that will likely ignite further changes on a state and national level. Restaurant Brands International cage-free egg policy Based on the collective effort of animal rights advocates and supporters, the parent company which owns Burger King, Popeyes, and Tim Horton’s adopted a global policy to end abusive farming practices. The policy change resulted from a petition that acquired over 270,000 signatures demanding the restaurant group stop confining chickens to harmful cages. The public amplified the pressure from the petition by emailing company executives and commenting on their social media posts demanding the change. The movement successfully replaced a cruel policy with a humane one, joining many other large, global brands in establishing cage-free policies. Campus LGBTQ+ violence and harassment reporting policy reform The Gender Sexuality Alliance (GSA) at Sacred Heart University started a petition calling for solutions to equity, inclusion, and safety problems on campus. Their pleas to the administration included strengthening policies for LGBTQ+-based violence reporting processes and management. The petition notes that members of the university LGBTQ+ community often don’t report “instances of homophobic and transphobic violence on campus because they have not been taken seriously in the past or were victim-blamed for coming forward.” The petition requests that the university update their policies to prioritize student safety and support. The petition successfully convinced the university administration to take action and implement the requested changes. Change policies with petitions A petition is a powerful tool for everyday citizens to use for facilitating meaningful policy change. By gathering signatures, petitions show decision makers significant demand for important changes, whether it’s improving environmental standards, reforming animal welfare practices, or addressing public health concerns. Petitions not only amplify public voices but also help bridge the gap between grassroots movements and legislative action. Every signature adds pressure on leaders to listen and act, proving that collective action can truly reshape policies for the better. → Start your petition today on Change.org"
