full_description = "Mandatory Autism & Mental Health Training for First Responders, Educators & Resources26,133 signatures Prevent Book Bans and Protect Educational Freedom: The Protect Florida Classrooms Act17,717 signatures TopicEducation Reform13,052,652 supporters taking action on this topic.27,375 petitions started in this community.Start a petitionLearn more about Education Reform topic at Change.orgEducation reform is a critical topic that seeks to address key issues within the educational system to ensure all students receive quality education. Recent trends in education reform focus on increasing access to resources, improving teacher-student ratios, and promoting inclusive learning environments free from discrimination. Petitions under this topic advocate for various reforms, including increased funding for schools in underserved communities, implementing comprehensive sex education programs, and holding educational institutions accountable for addressing systemic inequalities. One petition with thousands of signatures calls for standardized testing reform, arguing that these assessments do not accurately measure student success and put undue pressure on students and teachers. By exploring and supporting these petitions, individuals can contribute to the movement for educational equity and excellence. Take action today to help shape the future of education and ensure a brighter tomorrow for students worldwide.Explore 27,375 petitions in Education ReformTrendingMost RecentIgnored & Lost: Justice for Nepali Student Who Suffered & Died in India!28,955 signaturesCall for the Resignation of Oklahoma State Superintendent Ryan Walters32,043 signaturesMandatory Autism & Mental Health Training for First Responders, Educators & Resources26,133 signaturesImplement Liaison Based Suicide Prevention Programs in Boone County Schools6,280 signaturesPetition to Reverse the NIH Indirect Cost Cap (NOT-OD-25-068)6,263 signaturesIMPEACH RYAN WALTERS51,423 signaturesExpel Maxamillion Lopez from The School of Arts and Enterprise5,287 signaturesPrevent Book Bans and Protect Educational Freedom: The Protect Florida Classrooms Act17,717 signaturesShow moreStories and updates from petition startersCall for the Resignation of Oklahoma State Superintendent Ryan WaltersLet’s get more signatures for this petition🚨 We’re at 856 Signatures—Let’s Keep the Momentum Going! 🚨 Thank you so much for supporting this petition to remove Ryan Walters as Oklahoma’s State Superintendent. Your voices are making a difference, but we need to go further. 💡 Here’s how you can help: Share the petition with 10 people who care about the future of our schools.Post it on your Facebook groups, Twitter, or Instagram stories.Drop the link in your group chats or email threads.Every signature counts, and the more people who join us, the harder we are to ignore. Let’s stand together for better leadership and brighter futures for Oklahoma’s students and teachers. 👉 Sign and share now: https://www.change.org/RyanNeedsGone Thank you for your continued support. Together, we’re creating change!January 25, 2025Call for the Resignation of Oklahoma State Superintendent Ryan Walters🚨 UPDATE: Nearly 30,000 Signatures in Just 2 Weeks! 🚨The momentum to remove Ryan Walters is growing FAST! In just two weeks, almost 30,000 people have signed this petition, making it clear that Oklahomans are fed up with his incompetence, harmful rhetoric, and blatant disregard for our public education system. 🔹 New Developments: Walters blatantly ignored legal obligations to provide the education funding report to the State Board, leaving taxpayers completely in the dark about where their money is going and raising serious concerns about financial mismanagement. He continues to push political agendas in classrooms instead of focusing on real solutions for teacher shortages and declining test scores. His latest attack on Oklahoma teachers includes a push to revoke licenses based on personal beliefs rather than professional conduct, creating a climate of fear and censorship in our schools. Every signature sends a message: We will not stand by while our schools, teachers, and students suffer under his leadership. 🚨 CALL TO ACTION: 🚨If you haven’t already, SIGN & SHARE this petition! The more voices we gather, the harder it becomes for those in power to ignore us. Let's hit 50,000 signatures! https://www.change.org/RyanNeedsGoneANDhttps://chng.it/cW7gHcjRjX Together, we can demand accountability and real leadership for Oklahoma’s education system. Keep sharing, keep speaking out, and let’s make a difference! #RemoveRyanWalters #OklahomaEducation #AccountabilityNow #supportourteachers #Oklahoma #students #education #educationmatters #teachersFebruary 10, 2025Call for the Resignation of Oklahoma State Superintendent Ryan WaltersWe’ve Hit Over 10,000 Signatures in under 5 days—Let’s Keep Pushing for Change!Dear Oklahomans, Thank you for signing the petition to remove Ryan Walters as Oklahoma's State Superintendent! In just 5 days, we’ve reached over 10,000 signatures, and that’s a powerful statement about how many of us believe it’s time for a change in leadership. This is not my reach, this is yours! We’re not stopping here—we need to keep pushing for more signatures, and we need your help to make it happen. Why is this important? Ryan Walters’ decisions have been nothing short of harmful to Oklahoma’s K-12 education system. His policies, which directly affect students, teachers, and families, prioritize his personal political agenda over the needs of our children. Public officials are supposed to serve the people, but Walters has repeatedly shown he’s more interested in pushing extreme, divisive views that damage the very foundation of our education system. His actions—from undermining teachers’ rights to promoting dangerous ideologies in the classroom—put Oklahoma’s students at risk. Walters has continuously shown that he cares more about his personal political gain than about ensuring a safe, inclusive, and effective learning environment for every child in our state. His leadership is a direct threat to the well-being, education, and future of our children. We cannot allow this to continue. Every signature on this petition sends a clear message that we demand leadership that puts education, safety, and the needs of our students first—not an extremist agenda that harms them. Here’s why your continued support matters: Accountability for Leadership: Public officials must be accountable to the people they serve. Petitions like this one create the pressure necessary for action. Impact on Education: The State Superintendent holds the power to shape education in Oklahoma, and it’s essential to ensure that the leadership reflects the needs of students and educators. Public Opinion Matters: Petitions are a way for citizens to demand attention and action. The more signatures we collect, the more likely it is that policymakers will listen. Support for Educational Reform: This petition isn’t just about one person—it’s about advocating for the future of our education system and calling for equity, quality education, and fair treatment for all. Momentum Builds Influence: The more signatures we gather, the greater our collective influence. With each person who shares this petition, we get closer to real change. What Can You Do?Share the petition with your friends, family, and networks. Every new signature gets us closer to showing that this movement is strong and growing. Post on social media with a message about why this issue matters to you and how others can help by signing and sharing. Get the conversations going. Encourage others to take action by making the petition known in your communities—whether online, at work, or within local groups. We’ve proven that we have the power to make change. Let’s double down and push even harder for the future of our state’s education system. Thank you for your continued support! Together, I truly believe we can make a difference. Sincerely, McKenzie Clothier https://chng.it/VTQ9vfXB48 & https://chng.it/y7SgzRcBZtJanuary 29, 2025Show moreVictories in Education ReformVictoryReject Oklahoma's Bill SB1017 Authored By Dusty Deevers3,659 signaturesVictoryStop the Discontinuation of the Dual Language Program in Conroe ISD2,517 signaturesVictoryKeep Elsie Allen Open1,467 signaturesVictoryProtect VUSD Libraries and Librarian Jobs1,207 signaturesShow more1. Start your petitionWe’ll help you build a campaign that gets noticed.2. Gather SupportEngage a large community of people who care about your cause.3. Reach those in powerInfluence decision-makers in government, companies, and other institutions to make real change.Don’t see your cause here yet? Make your voice heard!Start a petitionHomeTopicEducation ReformHomeTopicEducation Reform"
