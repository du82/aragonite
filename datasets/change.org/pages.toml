full_description = '8902 Quail Rd Annexation - Stop this Development!8902 Quail Rd Annexation - Stop this Development!Recent signersApril Mestas•4 weeks agoJoe Mestas•4 weeks agoJennifer Drozd•4 weeks agoErika Hall•4 weeks agoMark Hutchinson•4 weeks agoBonnie Sweetwood•4 weeks agoSusan Horowitz•4 weeks agoBela Repay•4 weeks agoKRISTIN COOPER•4 weeks agoJasper Stewart•4 weeks agoWilliam Doyle•4 weeks agoJamie Ehr•4 weeks agokathleen Brown•4 weeks agoChata Roberts•4 weeks agoBill Stephens•4 weeks agoJeannine Corey•4 weeks agoMike Wooten•4 weeks agoNettie Penman•4 weeks agoBrenda Hughey•4 weeks agomichael langona•4 weeks agoApril Mestas and 19 others have signed recently.84% of supporters are registered votersDecision Makers: Shiquita Yarbrough +58 Updates1 Media MentionThe Issue For more information go to: https://apartmont.com/ Honorable Mayor Peck and City Council: We, the undersigned residents of the City of Longmont, express our strong opposition to the current concept plan associated with the annexation application for 8902 Quail Road, which proposes the development of 310 rental apartment units without any conditions. The developer- Atlanta-based Vista Residential Partners- is committed to building rental apartments exclusively. Southwest Longmont already has an abundance of rental apartments, and there is a pressing need for attainable homes available for purchase. While the developer has verbally stated that they are "in discussion with Habitat for Humanity" to fulfill the 12% affordable housing requirement, this is not a contractual commitment and does not address the broader issue of the majority of units being high market-rate rentals. Therefore, we oppose the annexation of 8902 Quail Road under the current concept plan. We will continue to oppose this annexation until it is linked to a development proposal that better meets the needs of our community and allows Longmont residents to establish long-term roots and thrive for generations to come. Report a policy violationKatie FilkinsPetition StarterMedia inquiriesVictoryThis petition made change with 666 supporters!Share this petitionApril Mestas•4 weeks agoJoe Mestas•4 weeks agoJennifer Drozd•4 weeks agoErika Hall•4 weeks agoMark Hutchinson•4 weeks agoBonnie Sweetwood•4 weeks agoSusan Horowitz•4 weeks agoBela Repay•4 weeks agoKRISTIN COOPER•4 weeks agoJasper Stewart•4 weeks agoWilliam Doyle•4 weeks agoJamie Ehr•4 weeks agokathleen Brown•4 weeks agoChata Roberts•4 weeks agoBill Stephens•4 weeks agoJeannine Corey•4 weeks agoMike Wooten•4 weeks agoNettie Penman•4 weeks agoBrenda Hughey•4 weeks agomichael langona•4 weeks agoApril Mestas and 19 others have signed recently.84% of supporters are registered votersDecision Makers: Shiquita Yarbrough +58 Updates1 Media MentionThe Issue For more information go to: https://apartmont.com/ Honorable Mayor Peck and City Council: We, the undersigned residents of the City of Longmont, express our strong opposition to the current concept plan associated with the annexation application for 8902 Quail Road, which proposes the development of 310 rental apartment units without any conditions. The developer- Atlanta-based Vista Residential Partners- is committed to building rental apartments exclusively. Southwest Longmont already has an abundance of rental apartments, and there is a pressing need for attainable homes available for purchase. While the developer has verbally stated that they are "in discussion with Habitat for Humanity" to fulfill the 12% affordable housing requirement, this is not a contractual commitment and does not address the broader issue of the majority of units being high market-rate rentals. Therefore, we oppose the annexation of 8902 Quail Road under the current concept plan. We will continue to oppose this annexation until it is linked to a development proposal that better meets the needs of our community and allows Longmont residents to establish long-term roots and thrive for generations to come. Report a policy violationKatie FilkinsPetition StarterMedia inquiriesShare this petitionVictoryThis petition made change with 666 supporters!Share this petitionThe Decision MakersShiquita YarbroughLongmont City Council - At LargeNo response Aren RodriguezLongmont City Council - At LargeNo response Sean McCoyLongmont City Council - At LargeNo response View 3 moreThe SupportersFeatured CommentsRaima, Longmont1 month agoWe live in Clover Creek directly across from the proposed development. The traffic is already at a high volume and I worry about the kids that have to navigate Clover Basin to attend school as well as the residents that use the local bus stops. We do not need more high density apartments - we need affordable housing!Mary, Los Angeles1 month agoI walk a lot in many, many cities and as I walk I see older era developments and think who in the world approved that type of development back in the day. As city government goes, it’s so important to have a consistent vision for what your town, city, community looks like in the moment…and work closely with the community to establish what it may look like going forward. It seems like every small and mid size town/city is trying to solve the homeless situation, which is very complex, but they won’t do it by building expensive mass apartments. If I was younger, I would definitely have to have several roommates to afford these apartments at the asking rate 😖. Young people need hope that they too can get a foothold into entry level homes which provide them stability, comfort, a chance for a peaceful surrounding…and the opportunity to upgrade if they’d like to. I don’t advocate for no apartments, but Longmont is saturating our city with apartments. I would ask the council to build them in places more accessible to public transportation and or build them with business infrastructure on the ground level so that they can have easier access to stores, restaurants, etc…by walking or biking. The Quail Road proposal needs further attention so that it becomes a win-win for the city and the residents of the community.Show full textWhitney, Longmont1 month agoWe moved to quiet and quaint SW Longmont 10.5 years ago in part to escape the hustle and sprawl of Highlands Ranch. Now we’re losing the small town charm that was Longmont. I’m not against new neighbors in affordable housing but high density apartments don’t attract families and long-term residents. We aren’t designed to be a suburban city!View all commentsShare this petitionShare this petition in person or use the QR code for your own material.Download QR CodePetition created on January 17, 2025Change.orgEconomic Justice8902 Quail Rd Annexation - Stop this Development!'
