title = "Empowering Student Voices: How to Start a School Petition on Change.org · Change.org"
description = "Every successful petition begins with identifying a clear issue. What needs to be changed or addressed in your school? Whether it’s promoting healthier cafeteria food, demanding changes to dress code policies, advocating for better learning resources…"
full_description = "NewsGuidesShare this postShare this postfacebooktwitteremailStart a petitionGuidesEmpowering Student Voices: How to Start a School Petition on Change.orgJun 27, 2023 At Change.org, we believe in the power of student voices to drive real change in schools and communities. Whether it’s advocating for fairer dress codes, fighting restrictive cell phone policies, pushing for days off on important holidays, or campaigning for changes in curriculum, students across the country are stepping up and making their voices heard. Why Students Should Use Change.org Every day, students face challenges in their schools that impact their education and well-being. From outdated dress codes that unfairly target certain groups to rigid phone policies that don’t reflect the realities of modern learning, these issues can make school life unnecessarily difficult. Change.org provides a platform where students can come together, rally support, and push for the changes they want to see. Starting a petition on Change.org is more than just posting a complaint online. It’s about organizing a movement, bringing together like-minded peers, and making a case to school administrators and decision-makers that students’ concerns deserve to be addressed. Examples of Common Issues Students Campaign For Students are using Change.org to tackle a wide range of issues, reflecting their diverse experiences and concerns: Phone Policies: Many students believe that current cell phone policies in schools are too restrictive. They argue that phones can be valuable tools for learning and that the policies should reflect this reality. Petitions on Change.org have successfully pushed schools to revise these policies, allowing for more balanced and fair regulations. Dress Codes: Dress codes can often be discriminatory or out of touch with current societal norms. Students have used Change.org to campaign for dress codes that are inclusive and respectful of all students, regardless of gender or cultural background. School Holidays: Recognizing the diversity of their student bodies, some students have started petitions to add school holidays for important cultural or religious events that are currently overlooked by school calendars. These petitions highlight the importance of inclusivity and respect for all students. Curriculum Changes: Whether it’s pushing for more inclusive history lessons or advocating for practical life skills to be taught in schools, students are using Change.org to call for curriculum changes that better reflect their needs and interests. How to Start a School Petition Identify the Issue: Start by pinpointing the specific issue you want to address. Take time to think about how this issue affects you and your peers. It’s important to be clear about the change you’re seeking. Consider gathering some preliminary feedback from classmates or teachers to better understand the broader impact of the issue. Research and Gather Support: Before launching your petition, do some research to strengthen your argument. Look for similar petitions on Change.org or other platforms to see how they framed their cases and what worked for them. If possible, gather data, such as statistics or studies, that support your position. For example, if you’re advocating for a more lenient phone policy, you might find studies showing how smartphones can enhance learning. Talk to classmates, teachers, and even parents to build a coalition of supporters. The more people who understand and agree with your cause, the stronger your petition will be. Craft Your Petition: When creating your petition on Change.org, clarity and persuasion are key. Start with a compelling title that grabs attention and clearly states your goal. In the petition description, outline the issue, explain why it matters, and propose a solution. Be concise but detailed—include personal stories, relevant data, or quotes that underscore the importance of the issue. Visuals can also be powerful, so consider adding photos, infographics, or videos that help convey your message. Promote Your Petition: Once your petition is live, it’s time to spread the word. Start by sharing it on social media platforms like Instagram, TikTok, and Twitter, where your peers are most active. Reach out to student clubs, school organizations, and local community groups to help amplify your message. You can also create posters or flyers to distribute around your school, encouraging others to sign and share the petition. Be persistent—regular updates and reminders can keep the momentum going and encourage more people to join your cause. Engage Decision-Makers: As your petition gains signatures, it’s important to take your case directly to those who have the power to make changes. This could be your school principal, the school board, or even local government officials. Draft a formal letter or email that includes a link to your petition, along with a summary of the issue and the support you’ve garnered. Request a meeting to discuss your concerns in person, or present your petition at a school board meeting. Be prepared to make your case with confidence and back it up with the support you’ve gathered. Keep the Momentum Going: After you’ve presented your petition, continue to keep your supporters updated on any developments. Whether the decision-makers have agreed to make the change or if further action is needed, staying engaged with your supporters is crucial. Consider organizing events, rallies, or follow-up campaigns to maintain pressure and visibility on the issue. Your persistence can make all the difference in turning your petition into real, lasting change. The Impact of Student-Led Petitions Change.org has seen countless examples of student-led petitions that have led to real change – students are proving that their voices matter. By starting a petition, you’re not just making a request; you’re starting a movement that can inspire others and bring about meaningful change. To use Change.org in the United States, you must be at least 13 years old. For those living outside of the United States, you must be 16 or older. If you do not meet the age requirement, your parent or guardian may start the petition on your behalf. For more info please read our Terms of Service or contact us at Help@change.org."
