ncing during a press conference surrounded by other elected officials that Virgilio Aguilar was stopped because he was trespassing and that he had a pulled a knife on Sergeant Kunovich, which was the reason they declared Sergeant Kunovich and the other officers began to apprehend and use force to arrest Virgilio. Bodycam videos released after this press conference reveal that there was never a knife pulled on Sergeant Kunovich at all and there was no mention of a trespass in the videos or police reports, thereby undermining the credibility of the office Sheriff Hardwick leads and perpetuating the mistrust of people towards elected officials. Before Sergeant Michael Kunovich stopped Virgilio, there was no possible crime. Virgilio Aguilar Mendez is an Indigenous Maya Mam teen, and we stress that indigenous migrants are disproportionately affected by racism, discrimination, anti-indigeneity, being mislabeled as Latino and Indigenous language barriers. We are demanding the immediate release of Virgilio Aguilar Mendez from custody and for the charges to be dropped immediately as his constitutional and civil rights were violated by the St. John’s County Sheriff’s Office. These rights protect all people within this country, regardless of immigration status. If Virgilio is convicted and sentenced to prison for this incident it will create an extremely dangerous precedent in this country; because if a police officer dies from a heart attack during a police-citizen encounter, anyone in this country can be charged, convicted and sentenced to life in prison for that officer’s death. This precedent would run contrary to the fundamental tenants of freedom and Liberty, which are scared in our country. It is not a crime to stand outside your place of residence at any given time. We are demanding that Governor Ron DeSantis and 7th circuit state attorney, RJ Larizza get involved in the dismissal of this case immediately as Virgilio's right are being violated and neglected by the St. 