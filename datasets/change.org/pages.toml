description = """
As a food allergy advocate and concerned parent of a child with severe food allergies, I am writing this petition to urge the Food and Drug Administration (FDA) to approve nasal epinephrine as an alternative delivery mode for emergency anaphylaxis treatment.
Anaphylaxis is a life-threatening reaction to a food, drug, insect venom, or environmental substance. Epinephrine is the only treatment that"""
full_description = "FDA, Approve Life-Saving Nasal Epinephrine for Anaphylactic EmergenciesFDA, Approve Life-Saving Nasal Epinephrine for Anaphylactic Emergencies2 UpdatesThe IssueAs a food allergy advocate and concerned parent of a child with severe food allergies, I am writing this petition to urge the Food and Drug Administration (FDA) to approve nasal epinephrine as an alternative delivery mode for emergency anaphylaxis treatment. Anaphylaxis is a life-threatening reaction to a food, drug, insect venom, or environmental substance. Epinephrine is the only treatment that can halt and reverse the progression of anaphylaxis, but it must be administered promptly following onset to have effect. The majority of anaphylactic deaths are due to delays in administering the drug, and one primary reason for that delay is fear of the needle that current emergency epinephrine devices employ. Today's standard — the epinephrine auto-injector — requires the patient or caregiver to stab the patient in the outer thigh, a daunting prospect, especially for children. I have heard stories of children hiding their reactions for fear of the subsequent jab, which has the potential to result in tragedy.Even as a food allergy advocate, I am embarrassed to say that we have delayed administering epinephrine, viewing the needle as a high bar to clear despite knowing the potential consequences. Nasal delivery of epinephrine eliminates this fear and would result in more prompt administration of the drug when anaphylaxis is first suspected. Furthermore, clinical studies have shown that nasal administration of epinephrine delivers the drug as effectively as auto-injectors and intramuscular injections. The FDA's own advisory panel voted 17-5 to approve a nasal epinephrine candidate for children and 16-6 for adults in May of 2023, but the agency changed direction and denied approval of the device in September. We, the allergic community, desperately need this mode of delivery, which will eliminate hesitation, lead to better outcomes, and save lives.I urge the FDA to consider the importance of this issue and take swift action. The agency must ensure that fear of the needle and the hesitation it causes do not put more lives in jeopardy.Thank you for your attention to this matter.Sincerely,Dave BloomCEO, SnackSafely.comReport a policy violationDave BloomPetition StarterMedia inquiriesVictoryThis petition made change with 40,561 supporters!Share this petition2 UpdatesThe IssueAs a food allergy advocate and concerned parent of a child with severe food allergies, I am writing this petition to urge the Food and Drug Administration (FDA) to approve nasal epinephrine as an alternative delivery mode for emergency anaphylaxis treatment. Anaphylaxis is a life-threatening reaction to a food, drug, insect venom, or environmental substance. Epinephrine is the only treatment that can halt and reverse the progression of anaphylaxis, but it must be administered promptly following onset to have effect. The majority of anaphylactic deaths are due to delays in administering the drug, and one primary reason for that delay is fear of the needle that current emergency epinephrine devices employ. Today's standard — the epinephrine auto-injector — requires the patient or caregiver to stab the patient in the outer thigh, a daunting prospect, especially for children. I have heard stories of children hiding their reactions for fear of the subsequent jab, which has the potential to result in tragedy.Even as a food allergy advocate, I am embarrassed to say that we have delayed administering epinephrine, viewing the needle as a high bar to clear despite knowing the potential consequences. Nasal delivery of epinephrine eliminates this fear and would result in more prompt administration of the drug when anaphylaxis is first suspected. Furthermore, clinical studies have shown that nasal administration of epinephrine delivers the drug as effectively as auto-injectors and intramuscular injections. The FDA's own advisory panel voted 17-5 to approve a nasal epinephrine candidate for children and 16-6 for adults in May of 2023, but the agency changed direction and denied approval of the device in September. We, the allergic community, desperately need this mode of delivery, which will eliminate hesitation, lead to better outcomes, and save lives.I urge the FDA to consider the importance of this issue and take swift action. The agency must ensure that fear of the needle and the hesitation it causes do not put more lives in jeopardy.Thank you for your attention to this matter.Sincerely,Dave BloomCEO, SnackSafely.comReport a policy violationDave BloomPetition StarterMedia inquiriesShare this petitionVictoryThis petition made change with 40,561 supporters!Share this petitionThe SupportersFeatured CommentsRobert, Shepherdstown8 months agoWe need this. It will eliminate the hesitation that most people feel about needles and, thus, save lives. There is no more reason to delay this approval. The science continues to support this life-saving drug.Danielle, Ripley8 months agoOne of my fears as a parent of a child with allergies that may result in anaphylaxis, is that they will have a need for Epinephrine while being around someone untrained or unconfident when it comes to the injection method of Epinephrine. This could mean life or death for my child and thousands in the same situation. What the neffy provides is something most everyone is familiar with and would likely not think twice about using it on someone else.Show full textTenda, Bellevue1 year agoMy twins both have multiple food allergies and having a non-needle option for their emergency medicine would greatly relieve the stress of potential reactions. Please follow the science and approve this medication.View all commentsShare this petitionShare this petition in person or use the QR code for your own material.Download QR CodePetition created on September 29, 2023Change.orgHealthFDA, Approve Life-Saving Nasal Epinephrine for Anaphylactic Emergencies"
