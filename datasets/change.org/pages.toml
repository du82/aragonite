title = "Amazon.com - Petitions & Information - Change.org · Change.org"
description = "Amazon.com strives to be Earth's most customer-centric company where people can find and discover virtually anything they want to buy online."
full_description = "Amazon Prime Discount for TeachersAmazon offers a Prime membership discount of half price fo students. While that is fabulous, I also think they should offer this incredible deal to teachers. Students must verify eligibility with their school email so it would not be hard for teachers to do the same. Teachers use Amazon in many different ways. It’s great to create wish lists to get out to parents, to order supplies and other things you need quickly without having to go out, and even on those days you watch a movie for whatever special reason, Prime Video is awesome. Amazon is a great company and since they offer students (who are usually on a budget) a great discount, why not offer it to teachers who are also usually on a budget as well. Especially since the membership price comes out of our pockets and not the schools. Of course not every item a teacher buys off of Amazon is for their class. Some teachers with Amazon Prime may not order anything for their students or classroom. I still think it would be great for Amazon to offer, as appreciation, a teacher discount equivalent to the discount they offer students. I think all businesses should offer a teacher discount, but I am starting with a company that could set a great example for others to follow. While this isn’t a pressing life or death matter, it’s important all the same. Please help me get Amazon’s Jeff Bezos attention. Back me up in trying to get Amazon to offer a teacher Prime Membership discount. 0 media mentions620,673 signatures Get Amazon to Offer Plastic-Free Packaging OptionsThousands of the products on Amazon are shipped with plastic wrapping and cushioning materials unnecessarily. We are petitioning for a ‘Plastic-free’ option at checkout and ‘Plastic-free’ labeling available for sellers who already choose eco alternatives. It’s unfair that so much plastic is being put into the world when it is avoidable and safe eco options to replace bubble wrap, shrink wrap and styrofoam are available. Much of the plastic included in e-commerce shipping is not recyclable at all or is very difficult to recycle given the lack of facilities. 91% of all plastic ends up as litter, in landfills or incinerated. Paper and other biodegradable materials are as effective and similar in price to plastic and bubble-wrap, which Amazon requires from it's marketplace sellers. It's time they updated both their checkout options and their marketplace requirements to remove the 'bubble-wrap non-compliance' penalties. Since Amazon ships over 50% of the packages in many countries, we are asking them to set an example and offer materials that are more easily recycled and reused so consumers can feel better about the need to shop online and gain more control over what arrives on their doorstep. According to scientists, about 17.6 billion pounds of plastic enter the ocean annually and there are more than 5 trillion pieces of plastic floating in our oceans. This plastic enters from all nations, including the US and European countries by way of waste export. Why add more? Please grant consumers the choice to go ‘Plastic-free’. It’s not acceptable for major businesses to leave consumers with so few choices and we are fed plastic we didn’t ask for that later ends up in landfills or in our rivers and oceans. Plastic-free choices should be accessible and plentiful if we want to see lasting change and a dramatic decrease in plastic waste. Let’s take a big step forward and make ‘Plastic-free’ a regular option on all checkout forms. Amazon has an opportunity to set a GREAT example. 0 media mentions784,679 signatures"
year_published = 2025
