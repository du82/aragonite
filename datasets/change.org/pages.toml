title = "Petition · Petition to Protect Topanga and LA County from Toxic Waste Sorting Site - United States · Change.org"
description = """
The community of Topanga, citizens of Los Angeles county strongly oppose the Environmental Protection Agency's proposed Palisades fire debris staging site located at the base of Highway 27 and the PCH (a California State Park) 
We understand the importance and urgency of this issue but ask the EPA to consider alternatives as it will very likely have detrimental effects on our environment, economy,"""
full_description = "Petition to Protect Topanga and LA County from Toxic Waste Sorting SitePetition to Protect Topanga and LA County from Toxic Waste Sorting SiteRecent signersRachel Doane•3 minutes agoRenee Auerbach•20 minutes agoRandi Woehrle•2 hours agoMayely Daza•3 hours agoCarolyn Clarke•3 hours agoMike Clair•6 hours agoKaren Clair•6 hours agoAurelia Solano•6 hours agoVictor Martinez•6 hours agoCameron Fox•7 hours agoGigi Montes•8 hours agokayla vicuna•8 hours agoJonathan Adam•9 hours agoAmelia Peabody•9 hours agoJanet Padilla•10 hours agoKai H•10 hours agoAnayeli Ruiz•10 hours agoMaria Orozco•10 hours agoMisa .•10 hours agoMikaela Falk•11 hours agoRachel Doane and 19 others have signed recently.Decision Makers: Gavin Newsom +21 Update1 Media MentionThe IssueThe community of Topanga, citizens of Los Angeles county strongly oppose the Environmental Protection Agency's proposed Palisades fire debris staging site located at the base of Highway 27 and the PCH (a California State Park) We understand the importance and urgency of this issue but ask the EPA to consider alternatives as it will very likely have detrimental effects on our environment, economy, cultural history and the health and safety of our community. The site is dangerously close to Topanga creek a vital watershed that is home to the federally endangered steelhead trout. The site is on land that is sacred to the Indigenous tribes of this region. We are deeply concerned that contaminants from the debris could leach into the soil and waterways. Not to mention the toxic particulates that could make their way into our air and carried by onshore winds directly to our town of Topanga where people live, work and play. The risk this poses to ocean water quality is also alarming. Local businesses are already struggling and this would deter visitors to our town that relies on tourism. These serious environmental, economic, and public safety risks cannot be overstated. I urge you to stand with us in opposing the proposed EPA fire debris staging site near Topanga lagoon and the PCH. Please sign this petition to protect our homes, preserve our environment, sustain our economy, and safeguard our families' health. FURTHER DETAILS 1. Environmental Threat to Waterways and the Ocean Toxic waste stored near water sources poses a severe contamination risk. Topanga Creek, which feeds directly into the ocean, is particularly vulnerable. Study: Surface Water Contamination from Hazardous Waste Storage Sites (EPA, 2005) found that hazardous waste leached into soil and waterways when stored on unprotected ground, leading to long-term pollution in local water sources.Example: The Superfund Research Program at UC Berkeley has documented severe groundwater contamination caused by improper hazardous waste storage, affecting communities for decades.California Coastal Commission Report (2022): Stresses that coastal areas should not be used for hazardous material storage due to high risks of leaching into marine ecosystems.Safer Alternatives Exist:Instead of placing toxic waste in a sensitive coastal watershed, safer options such as Will Rogers State Park’s parking lot (an impermeable surface) or Malibu’s Carnival Grounds (a designated event space) should be considered. 2. Fire Risk and Lack of Evacuation Routes Topanga residents remain barricaded inside the canyon while Malibu residents receive PCH access passes. This creates a serious safety risk—especially since the proposed toxic waste site is at the base of one of our only two emergency exits. California Department of Forestry & Fire Protection (CAL FIRE) Report (2023): Lists Topanga as a Very High Fire Hazard Severity Zone and emphasizes that limited evacuation routes increase wildfire casualties.Study: Wildfire Evacuation and Road Access (UC Davis, 2020) found that blocked exits during wildfires significantly increase loss of life.Case Study: The 2024 Topanga landslide already isolated the community and highlighted the dangers of limited evacuation options. A similar scenario during a wildfire could be catastrophic.Topanga residents need unrestricted access to PCH, just as Malibu residents do. Blocking one of only two escape routes for a toxic waste facility puts thousands of lives at risk. As such we are also working with the county, and pleading with the county, to provide PCH passes to the Topanga residents 3. Route Access and the Dangers of Using Highway 27 Using Highway 27 as a route for toxic waste transport is highly dangerous and irresponsible, yet we have no written confirmation that this route will not be used. Topanga Canyon Blvd (Hwy 27) is notoriously treacherous, with frequent mudslides, rockslides, and accidents—especially on the S-Curve, one of the most dangerous stretches of highway in Los Angeles County.Exiting the Topanga Ranch Motel site requires making a left turn onto a high-speed, high-traffic highway—an extremely dangerous maneuver for large hazardous waste trucks.In contrast, Will Rogers State Park offers a safer option: trucks would turn right at a signalized intersection, directly onto PCH, improving traffic flow and reducing accident risk.Population Density: Topanga is home to nearly 13,000 residents and active businesses, all of whom depend on Hwy 27 for daily life. In contrast, traffic at Temescal and Will Rogers has drastically decreased due to the fires, making those locations far less disruptive and much safer.Supporting Data on Road Safety: California Highway Patrol Accident Data (2023): Identifies the Hwy 27 S-Curve as a high-risk zone due to frequent accidents.Federal Highway Administration (FHWA) Study (2021): Shows that left-hand turns onto busy highways significantly increase accident risk—whereas right-hand turns at traffic signals reduce collisions by up to 60%. 4. Risk of Accidents Due to Hasty Cleanup & Dangerous Location Near a Gas Station The 30-day EPA deadline increases the likelihood of serious errors in handling toxic waste. U.S. Government Accountability Office (GAO) Report (GAO-20-73): Warns that rushed hazardous waste cleanup leads to mismanagement, accidental exposure, and contamination risks.Study: Hazardous Waste Management Under Time Constraints (Environmental Science & Technology, 2019) found that shortened deadlines increase human error in waste handling.Additionally, the proposed site is directly across from a gas station—a critical safety hazard. National Fire Protection Association (NFPA) Study (2022): Shows that toxic chemicals stored near fuel sources dramatically increase the risk of explosions.EPA Risk Management Plan (RMP) Rule (2019): Requires minimum buffer zones between hazardous waste sites and flammable fuel sources—this site fails to meet those safety requirements.Example: The West, Texas Fertilizer Plant Explosion (2013) was caused by improper storage of hazardous materials near combustible substances, leading to mass casualties.This combination of rushed cleanup, hazardous transport conditions, and dangerous proximity to fuel sources makes this site completely unsuitable for toxic waste storage. 5. Protection of Indigenous Cultural and Sacred Land The Topanga Ranch Motel site is sacred land to the local Indigenous Tongva and Gabrielino tribes. California Native American Heritage Commission (NAHC) Designation: Recognizes this area as culturally significant to Indigenous communities.Federal Cultural Protection Laws (e.g., National Historic Preservation Act, Native American Graves Protection and Repatriation Act): Typically forbid hazardous projects on sacred lands, yet this protection appears to have been waived due to emergency status.Community Responsibility: We must respect and protect these lands rather than desecrate them with toxic waste storage. Conclusion: Why This Matters Scientific research confirms that rushed hazardous waste removal increases risks.EPA and environmental studies warn against storing toxic materials near water sources or flammable sites.Fire and evacuation experts stress the importance of open access routes in high-risk fire zones like Topanga.Safer, more logical alternative locations exist that minimize environmental and public safety risks.The proposed site is culturally significant and should be protected, not contaminated.We demand that this site be removed from consideration immediately. Instead, hazardous waste storage must be placed in a safer, more appropriate location that does not endanger our homes, environment, and heritage. Please sign and share to protect Topanga and our community. Report a policy violationBonnie WrightPetition StarterMedia inquiriesSign petition14,405Verified signaturesRachel Doane•3 minutes agoRenee Auerbach•20 minutes agoRandi Woehrle•2 hours agoMayely Daza•3 hours agoCarolyn Clarke•3 hours agoMike Clair•6 hours agoKaren Clair•6 hours agoAurelia Solano•6 hours agoVictor Martinez•6 hours agoCameron Fox•7 hours agoGigi Montes•8 hours agokayla vicuna•8 hours agoJonathan Adam•9 hours agoAmelia Peabody•9 hours agoJanet Padilla•10 hours agoKai H•10 hours agoAnayeli Ruiz•10 hours agoMaria Orozco•10 hours agoMisa .•10 hours agoMikaela Falk•11 hours agoRachel Doane and 19 others have signed recently.Decision Makers: Gavin Newsom +21 Update1 Media MentionThe IssueThe community of Topanga, citizens of Los Angeles county strongly oppose the Environmental Protection Agency's proposed Palisades fire debris staging site located at the base of Highway 27 and the PCH (a California State Park) We understand the importance and urgency of this issue but ask the EPA to consider alternatives as it will very likely have detrimental effects on our environment, economy, cultural history and the health and safety of our community. The site is dangerously close to Topanga creek a vital watershed that is home to the federally endangered steelhead trout. The site is on land that is sacred to the Indigenous tribes of this region. We are deeply concerned that contaminants from the debris could leach into the soil and waterways. Not to mention the toxic particulates that could make their way into our air and carried by onshore winds directly to our town of Topanga where people live, work and play. The risk this poses to ocean water quality is also alarming. Local businesses are already struggling and this would deter visitors to our town that relies on tourism. These serious environmental, economic, and public safety risks cannot be overstated. I urge you to stand with us in opposing the proposed EPA fire debris staging site near Topanga lagoon and the PCH. Please sign this petition to protect our homes, preserve our environment, sustain our economy, and safeguard our families' health. FURTHER DETAILS 1. Environmental Threat to Waterways and the Ocean Toxic waste stored near water sources poses a severe contamination risk. Topanga Creek, which feeds directly into the ocean, is particularly vulnerable. Study: Surface Water Contamination from Hazardous Waste Storage Sites (EPA, 2005) found that hazardous waste leached into soil and waterways when stored on unprotected ground, leading to long-term pollution in local water sources.Example: The Superfund Research Program at UC Berkeley has documented severe groundwater contamination caused by improper hazardous waste storage, affecting communities for decades.California Coastal Commission Report (2022): Stresses that coastal areas should not be used for hazardous material storage due to high risks of leaching into marine ecosystems.Safer Alternatives Exist:Instead of placing toxic waste in a sensitive coastal watershed, safer options such as Will Rogers State Park’s parking lot (an impermeable surface) or Malibu’s Carnival Grounds (a designated event space) should be considered. 2. Fire Risk and Lack of Evacuation Routes Topanga residents remain barricaded inside the canyon while Malibu residents receive PCH access passes. This creates a serious safety risk—especially since the proposed toxic waste site is at the base of one of our only