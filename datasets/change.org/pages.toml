["https://change.org/l/us/womens-rights-movement"]
title = "The women’s rights movement: Past and present fight for change · Change.org"
description = "The struggle for women’s rights in the United States has been marked by courage and persistence. In 1848, activists gathered at the Seneca Falls Convention in New York to issue the Declaration of Sentiments — a powerful manifesto that condemned the oppression of women and called for equality.   “We hold these truths to be self-evident; […]"
full_description = "NewsGuidesShare this postShare this postfacebooktwitteremailWomen's RightsThe women’s rights movement: Past and present fight for changeNov 19, 2024A sign at the 2017 Women’s March in Washington D.C. Photo by Lindsey Jene Scalera on Flickr The struggle for women’s rights in the United States has been marked by courage and persistence. In 1848, activists gathered at the Seneca Falls Convention in New York to issue the Declaration of Sentiments — a powerful manifesto that condemned the oppression of women and called for equality. “We hold these truths to be self-evident; that all men and women are created equal,” it read. Since then, milestones like the right to vote, the right to education, and anti-discrimination protections have emerged as pillars of the movement. Learn about the history of women’s rights, the ongoing fight for gender equality, and how you can join the movement. Timeline of the women’s rights movement The feminist movement in the U.S. is often described in four “waves,” each addressing different issues. The first wave began in the mid-19th century, focusing primarily on women’s suffrage and legal rights. Key moments include the 1848 Seneca Falls Convention and the eventual success of the 19th Amendment in 1920, which granted women the right to vote. The second wave emerged in the 1960s and 1970s, targeting broader social inequalities, including workplace discrimination, reproductive rights, and legal protections against violence. Influential texts like Betty Friedan’s “The Feminine Mystique” helped fuel this wave, which ultimately led to important legislation such as the Equal Pay Act (1963) and Title IX (1972). The third wave, beginning in the 1990s, sought to expand feminist discourse to include issues of diversity and intersectionality, advocating for the rights of Black women, LGBTQ+ individuals, and marginalized groups. This wave emphasized personal empowerment and challenged rigid gender norms. The fourth wave began around 2012, driven by digital activism and movements like #MeToo. It addresses systemic sexism, sexual harassment, and gender-based violence, while prioritizing inclusivity, intersectionality, and the global fight for equality. This wave highlights the importance of social media in mobilizing support and amplifying diverse voices. Angela Davis, a prominent activist in both the racial and gender rights movement, during a protest in 2020. Photo by Peg Hunter on Flickr. Key milestones in women’s rights from suffrage to the present The organized women’s rights movement in the U.S. began in earnest in the mid-19th century, with pioneers rallying for suffrage — the right to vote in political elections — as a core issue. 1869-1920 The National Woman Suffrage Association (NWSA), founded by Elizabeth Cady Stanton and Susan B. Anthony in 1869, was pivotal in promoting women’s right to vote and advancing gender equality. Unlike some organizations at the time, the NWSA pursued a comprehensive agenda for women’s rights beyond suffrage, including women’s education, property rights, and divorce reform. In contrast, the American Woman Suffrage Association (AWSA), also founded in 1869, focused primarily on suffrage, aiming for state-by-state campaigns for the right to vote. Despite differing approaches, the NWSA and AWSA united in 1890 to form the National American Woman Suffrage Association (NAWSA), a strategic move that eventually led to the passage of the Nineteenth Amendment in 1920. With the ratification of the Nineteenth Amendment in 1920, women’s right to vote became constitutionally protected, marking a transformative victory. However, barriers persisted, especially for Black women who continued to face discriminatory voting practices. The Voting Rights Act of 1965 addressed some of these issues, bolstering voting rights protections nationwide. 1960s and 1970s In the 1960s and 1970s, the movement evolved to address issues beyond suffrage. Known as the second wave of feminism, this era focused on economic equality, reproductive rights, and combating sexual violence. Laws like Title IX of the Education Amendments of 1972 and the Equal Pay Act of 1963 emerged as landmark protections against discrimination. The push for the Equal Rights Amendment also gained traction, although it remains unratified today. The 1973 Supreme Court decision in Roe v. Wade was a milestone in reproductive rights, recognizing a woman’s constitutional right to make decisions regarding her body. This ruling allowed women to access safe and legal abortion across the U.S., reshaping reproductive healthcare. While Roe v. Wade was overturned by Dobbs v. Jackson Women’s Health Organization in 2022, this decision continues to hold historical significance as a marker of women’s autonomy over reproductive choices. 1990s-present day The third wave of feminism, emerging in the 1990s, expanded beyond the second wave’s focus by emphasizing intersectionality and diversity. This wave recognized that race, class, sexuality, and ethnicity intersect with gender, creating unique challenges for women from marginalized groups. Kimberlé Crenshaw’s concept of “intersectionality” became foundational, highlighting these overlapping identities. Third-wave feminists embraced a more inclusive approach to gender, rejecting binary views and acknowledging identity fluidity. Reclaiming symbols of femininity, they encouraged women to define empowerment on their own terms, challenging norms around beauty and sexuality. Figures like Rebecca Walker, who coined “third wave” in a 1992 essay, emphasized individual choice and agency. Judith Butler’s influential work on gender performativity in “Gender Trouble” argued that gender is a set of actions society interprets as masculine or feminine, rather than a fixed identity. Her theories challenged biological determinism, resonating with third-wave feminists who critiqued traditional gender norms and opened the movement to LGBTQ+ rights. Through intersectionality and global activism on issues like gender-based violence, the third wave laid the groundwork for modern feminist thought. In recent years, the #MeToo movement sparked a global conversation about sexual harassment and assault, encouraging millions of women to speak out and demand accountability from individuals and institutions. Initiated by activist Tarana Burke in 2006 and amplified on social media in 2017, #MeToo transformed cultural norms around consent and workplace harassment. This movement motivated significant policy changes, including new workplace protections, stronger harassment laws, and greater corporate accountability. As of 2024, the women’s rights movement continues to address issues like economic inequality, reproductive rights, and workplace discrimination. Landmark cases and policies aim to secure equal pay, healthcare access, and comprehensive protections for marginalized women. Protesters at the Bigger Than Roe – Women’s March, National Mobilization in Madison, Wisconsin in 2023. Photo by Risingthermals on Flickr. Why we still need the women’s rights movement Organizations like the UN continue to advocate for gender equality, acknowledging that it will still take around 300 years to achieve at the current rate of progress. Gender-based violence, the gender wage gap, limited reproductive rights, and underrepresentation in political and corporate leadership roles are just a few of the areas that highlight gender inequality. The following sections explore these persistent disparities, emphasizing why a dedicated movement is essential. Violence and sexual harassment One in three women globally experience physical or sexual violence, often at the hands of an intimate partner. In the workplace, sexual harassment remains a serious issue, affecting women’s safety and professional advancement. Movements like #MeToo have brought visibility to these issues, encouraging more robust protections in workplaces and public spaces. Pay equity and workplace disparities Although the Equal Pay Act of 1963 aimed to narrow the wage gap, women on average still earn less than men, with disparities particularly wide for Black and Hispanic women. Addressing pay equity is a core goal for many advocacy groups today. Reproductive rights and healthcare In recent years, reproductive rights have faced significant challenges in the U.S., particularly regarding access to safe and legal abortions. Restrictive policies disproportionately impact low-income women and those in rural areas, underscoring the need for continued advocacy in this area. These are just a few examples of the challenges that make the women’s rights movement as relevant today as it was in the 19th century. The fight for gender equality remains unfinished, and each of these areas requires ongoing activism and policy reform. Young women protesting at the Bigger Than Roe march in Madison, Wisconsin in 2023. Photo by Risingthermals on Flickr. Landmark policies from suffrage to anti-discrimination laws The women’s rights movement has inspired numerous policy changes to enhance equality and security for women. Here are a few significant laws: The Nineteenth Amendment: Ratified in 1920, this amendment secured women’s right to vote, establishing a critical foundation for gender equality in the political sphere. The Equal Pay Act of 1963: This law mandates equal pay for equal work, striving to close the wage gap between men and women. However, enforcement remains challenging, and wage disparities persist. Title IX of the Education Amendments of 1972: Title IX prohibits discrimination on the basis of sex in federally funded educational programs, which has opened doors for women in academia and sports. The Violence Against Women Act (VAWA): Enacted in 1994, VAWA has provided vital resources for survivors of domestic violence, sexual assault, and stalking. The act includes funding for victim services and efforts to improve law enforcement response to gender-based violence. While these laws signify progress, some protections are increasingly vulnerable due to political shifts and Supreme Court rulings that threaten to roll back gains, particularly in reproductive and workplace rights. Protesters at the Women’s March in Morris, Minnesota, 2017. Photo by Nic McPhee on Flickr. Key women’s rights activists: Then and now The women’s rights movement has been shaped by a diverse range of activists. Over time, they’ve advocated for gender equality while addressing the intersections of race, class, and other forms of marginalization. Prominent historical figures include: Susan B. Anthony and Elizabeth Cady Stanton: Founders of the National Woman Suffrage Association, who led early suffrage campaigns and advocated for broad social reforms for women. Mary Church Terrell: One of the first African American women to earn a college degree, Terrell was a pioneering advocate for both women’s and racial equality. She pushed for a movement that recognized the unique struggles of Black women, emphasizing the interconnectedness of race and gender in the fight for equality. Sojourner Truth: An abolitionist and women’s rights activist, Truth famously delivered her “Ain’t I a Woman?” speech in 1851, challenging both racial and gender inequality, and advocating for the rights of Black women in particular. Ida B. Wells: A journalist and anti-lynching campaigner, Wells was instrumental in bringing attention to the systemic violence faced by Black women in the U.S. She also fought for women’s suffrage and was a key figure in the early civil rights movement. Betty Friedan: Author of “The Feminine Mystique” and co-founder of the National Organization for Women, Friedan played a major role in the second wave of feminism, focusing on issues like workplace rights and reproductive choice. Wilma Mankiller: As the first female chief of the Cherokee Nation, Mankiller fought for Native American women’s rights, especially in terms of self-governance, social justice, and community development. Her leadership emphasized the importance of native women’s roles in cultural and political life. In the present day, activists continue to build on these legacies, including: Tarana Burke: Founder of the #MeToo movement, Burke’s work has spotlighted the widespread prevalence of sexual violence and harassment, especially among Black women. Angela Davis: A lifelong activist and scholar, Davis continues to champion racial and gender justice, with a focus on the prison-industrial complex, police brutality, and intersectional feminism. Brittany Packnett Cunningham: A leader in the Black Lives Matter movement, Cunningham advocates for racial and gender justice, focusing on police violence, reproductive rights, and empowering Black women in activism. Laverne Cox: As an openly transgender actress and activist, Cox is a leading voice in advocating for the rights and visibility of transgender individuals, particularly trans women of color, in both the feminist and LGBTQ+ movements. Dolores Huerta: A prominent Hispanic labor leader and civil rights activist, Huerta co-founded the United Farm Workers and fought for the rights of migrant workers, advocating for women’s rights and social justice within the Latino community. Santi Sojwal: An advocate for intersectional feminism, focusing on racial, gender, and socio-economic justice, amplifying marginalized voices in the fight for equality. She is a co-founder of the Asian American Feminist Collective. Today, platforms like Change.org allow everyday people to raise awareness and garner support for critical human rights issues, further empowering individuals to continue the fight for equality. These activists, along with countless others, carry forward the work of those who paved the way for women’s rights. Laverne Cox, during her “Ain’t I a Woman” tour, in Missouri. Photography by Taylor Pecko-Reid/ KOMU 8 on Flickr. How you can support the women’s rights movement From the American Woman Suffrage Association to the #MeToo movement, it’s clear that activism works. Supporting the women’s rights movement doesn’t require grand gestures — small actions can make a difference. Here are a few ways to advocate for gender equality and be part of the movement: Support and sign petitions: Platforms like Change.org allow individuals to start or sign petitions on issues they care about, such as workplace protections or reproductive rights. Educate yourself and others: Reading, joining discussions, and participating in events can help you stay informed on critical issues facing women today. Volunteer or donate: Consider supporting organizations like the National Organization for Women or Planned Parenthood, which work tirelessly to protect and advance women’s rights. Petitions to advance women’s rights These are some examples of petitions on Change.org that contributed to making the world a better place for women. End female genital mutilation in the U.S. This petition, with the support of over 218,500 people made historic change in "
