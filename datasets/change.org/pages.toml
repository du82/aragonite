title = "Popular Petitions to Sign · Change.org"
full_description = '''Discover petitions to signFeaturedPopularRecentVictoriesLeBron James for president in the 2028 electionLeBron James is often hailed as one of the greatest basketball players of all time, and for good reason. His combination of physical prowess, basketball IQ, and versatility on the court sets him apart from his peers. Standing at 6 feet 9 inches and weighing around 250 pounds, LeBron possesses the strength of a forward while maintaining the agility of a guard. This unique blend allows him to dominate in various positions, whether driving to the basket, shooting from the perimeter, or facilitating plays for his teammates. His ability to adapt his game over the years, transitioning from a high-flying scorer to a more strategic playmaker, showcases his dedication to improvement and understanding of the game. Beyond his physical attributes, LeBron's impact on the court is profound. He has consistently been a leader, both statistically and in terms of team dynamics. With numerous NBA championships and MVP awards to his name, he has proven time and again that he can elevate the performance of those around him. LeBron's court vision and passing ability are exceptional, often drawing comparisons to some of the best point guards in history. His commitment to teamwork and unselfish play has not only led to individual accolades but has also forged successful teams that have made deep playoff runs. Furthermore, LeBron's influence extends beyond basketball. He has used his platform to advocate for social justice, education, and community development. His initiatives, such as the LeBron James Family Foundation and the opening of the "I PROMISE School" in Akron, Ohio, demonstrate his commitment to making a positive impact off the court. This combination of athletic excellence and social responsibility solidifies his legacy, making a strong case for him being the greatest of all time (GOAT). LeBron James is not just a basketball player; he is a cultural icon whose greatness transcends the sport itself. And that’s why LeBron James should run for president.Ava StroudMiami, FL, United States203/1/25Constitutional Rights Implication and Impacts of Proposed Rezoning for LochurstFrom: Constituents living in Lochurst Neighborhood in Pfafftown To: The WSFCS School Board Members and Superintendent, with supportive footnotes and exhibits at this link. Alexandré Bohannon: abohannon2@wsfcs.k12.nc.us Robert Barr (District 2): rbarr@wsfcs.k12.nc.us Trevonia Brown-Gaither: tbrowngaither@wsfcs.k12.nc.us Sabrina Coone: scoone@wsfcs.k12.nc.usDeanna Kaplan: dkaplan@wsfcs.k12.nc.us Susan Miller: smiller3@wsfcs.k12.nc.us Richard Watts: rwatts@wsfcs.k12.nc.us Steve Wood: swood@wsfcs.k12.nc.us Leah Crowley: lcrowley@wsfcs.k12.nc.us Re: Petition Opposing School Rezoning of Lochurst Neighborhood To the WSFCS Board of Education: We are writing as residents of Lochurst, a diverse neighborhood in Pfafftown, to formally oppose the proposed school rezoning plan that would shift our students from Vienna Elementary and Lewisville Middle—both well-performing schools with socioeconomic diversity—to some of the lowest-performing schools in the district. We are petitioning for our neighborhood to remain zoned to Vienna Elementary School, Lewisville Middle School, and Reagan High School. In this letter, we will refer to creators and promulgators of the rezoning plan as “Rezoning Planners.” Since its inception in 1989, our neighborhood has been zoned for Vienna Elementary, which is a five-minute drive from our neighborhood. A key factor in many residents’ decisions to invest in this community is the high performance and historical community investment we made in the schools, which are an inseparable part of our community. This proposed rezoning is deeply flawed, both in its substance and in the manner by which it has been presented to the public. We urge you to reconsider this plan for the following reasons: 1. The Proposed Rezoning Arguably Constitutes an Unconstitutional Taking The forced rezoning of Lochurst to some of the lowest-performing schools will result in a significant decline in home values. (see link) Families intentionally choose our neighborhood based on school zoning, making this change a de facto regulatory taking—a government action that strips property owners of expected economic benefits. Courts have long recognized that when government regulations and enforcement significantly devalue private property without just compensation, they violate constitutional protections.(see link) This rezoning will cause precisely such harm. 2. The Rezoning Process Lacks Transparency and Fairness The manner by which this proposal with false choices has been made raises serious concerns, related to the Due Process Clause and related rights: False Claims of Input Awareness and Accessibility: The Rezoning Planners misleadingly claimed that parents were given a meaningful opportunity to participate in the rezoning process before releasing the proposed changes. However, households in our community were largely unaware of the lately disclosed specifics until after three maps were made. Manipulative Input Mechanisms: When finally asking for feedback, the Rezoning Planners structured the response options in a way that suppresses opposition. For the critical first two days after the proposed maps made local headline news, residents were forced to choose “no preference” if they oppose all rezoning proposals; this design distorts the actual sentiment in our community and for all dissenting constituents. All three maps result in the same poor results for nearly all of our neighborhood. While a comment box exists, such an approach suppresses clear, quantifiable opposition. (see link) Lack of Transparency in Data and Decision-Making: The Rezoning Planners have failed to effectively disclose what metrics and specific data were used to determine these zoning changes. Rather, we are presented with a summary of curated responses and told to review maps produced by an algorithm. An actual look at the raw responses shows much more opposition than the summaries indicate—for every comment that supports the proposed changes, there are at least the same that oppose. Without transparency, residents are left to question whether the decision-making process was influenced by factors that may not align with the best interests of students and families. We wonder, too, if some factors may be constitutionally suspect. 3. The Rezoning Raises Equal Protection Concerns The Rezoning Planners’ failure to provide clear, consistent criteria for school assignment implicates the non-classification principle under the Equal Protection Clause. When a governmental body enacts rules that arbitrarily group communities with a suppressive process, it risks violating constitutional protections. Given that better alternatives exist for creating diverse SES schools (such as the opt-in magnet model for The Downtown School), and considering the severe negative impact on families in Lochurst (as opposed to Greenbrier Farms, a community closer to these schools) this rezoning decision appears poorly reasoned, poorly planned, and discriminatory. It is clear from the maps that our neighborhood was prioritized for capture in rezoning. 4. The Consequences of This Forced Rezoning Will Be Detrimental to All The Board, legislatures, and courts must recognize that forcing families into underperforming schools will not achieve its intended goals. Instead, it will trigger the following likely outcomes: Families will relocate to areas where they can retain access to higher-performing schools, weakening the stability of our neighborhood. Parents will enroll their children in private schools, further reducing public school funding and undermining the very system the Board seeks to protect. Families will sacrifice to homeschool their children, further reducing student enrollment. Parents and community members will pursue legal action against the Board and any entities and persons responsible for these changes. Conclusion: This Rezoning Plan Must Be Reversed for Lochurst Neighborhood Constituents No benefit will come from forcing the Lochurst neighborhood into drastically underperforming schools. Instead of enhancing educational opportunities, this decision will drive families out, reduce school funding, and invite legal challenges. We urge the Board to maintain our current zoning to Vienna Elementary and Lewisville Middle and to adopt a zoning process that is transparent, fair, and constitutionally sound. We respectfully request that this matter be reconsidered in the interest of our children, our community, and the integrity of the school zoning process. Please confirm receipt of this letter and provide details on how the Board intends to address these concerns. Respectfully,Prof. HaqueUnited States213/1/25Prohibit Music Festivals and Large Events on Virginia Key to Combat Traffic CongestionAs a resident on Key Biscayne, I've experienced firsthand the extreme traffic congestion that occurs during music festivals and large events. A simple trip that normally takes 15 minutes can turn into a frustrating two-hour or more ordeal. This is not just inconvenient; it's disruptive to our lives and extremely detrimental to the flow of emergency services, which could have severe consequences.Key Biscayne is a small barrier island in Biscayne Bay, off the coast of Miami, Florida. In normal circumstances, the access to the Key is relatively fluid. However, when massive events take place, the created bottleneck can transform the area into a parking lot.According to a study conducted by the American Highway Users Alliance, Miami holds the 12th spot for America's Worst Urban Traffic Bottlenecks (AHUA, 2015). This is only exacerbated when large-scale events are held on Virginia Key.We all appreciate and value cultural and entertainment events, but the extensive gridlock and strain on local infrastructure caused regularly by these large events cannot be overlooked. Traffic congestion not only disrupts daily life, but also poses a public safety risk.By signing this petition, you are urging the city authorities to prevent music festivals and large events from taking place on Virginia Key, thereby, protecting its residents from excessive traffic and potential safety risks. Take a stand and help us carry out the necessary changes to maintain the tranquility of our beloved barrier island. Please, sign this petition now.Javier MarquinaKey Biscayne, FL, United States193/1/25GIVE US OUR SHREK BACK!the new trailer for shrek 5 is GARBAGE! WE NEED TO RISE UP AND GET THE ORIGINAL SHREK STYLE BACK!!!brinn murphyIndianapolis, KY, United States133/1/25Demand Respect and Fair Treatment for Teachers at My SchoolThis petition has been sparked by the unfortunate departure of Ms. L, a beloved dance coach and teacher at our school. Our community greatly values Ms. L, not only for her talent and dedication but for creating a safe space where all students felt embraced and loved. Her departure, due to unjust treatment from the school's administration, left a void in our hearts and a stain on our school's reputation. There is a dangerous precedent being set here, whereby dedicated teachers who significantly contribute to a school's ecosystem are not valued or treated with the respect they deserve. Teachers across the country are being subject to similar treatment, driving them away from their profession. According to a 2019 survey from the National Education Association, over half of teachers had considered leaving their profession due to feeling undervalued and disrespected.This petition not only stands for Ms. L but for all teachers at our school who feel unheard and undervalued. We must take a stand against the school's administration to demand fair treatment and respect for all staff members. The health of our educational environment is at stake and highly depends on how our teachers are treated. We urge you to sign this petition and raise your voices for those who educate us. Let's fight for a school where respect and fair treatment for teachers are the norm, and not the exception.Shavar ShepardUnited States713/1/25North Carolinians Demand AnswersPetition to North Carolina Senators and Representatives: A Call to Action Against the Trump Administration’s Illegal Actions and the Threat to Democracy To the Honorable Senators and Representatives of North Carolina, We, the undersigned residents of North Carolina, call upon you—our elected leaders—to take immediate action in response to the numerous illegal and unethical actions of the Trump administration, both past and present. As the global and domestic political landscape shifts, we must uphold the integrity of our democratic institutions and ensure accountability for any violations of law and public trust. The Urgency of ActionSince the Trump administration’s inception, we have witnessed repeated instances of misconduct, including but not limited to: Obstruction of justice and interference in investigations concerning election integrity.Incitement of violence against democratic institutions, culminating in the January 6th attack on the U.S. Capitol.Abuse of power in efforts to overturn legitimate election results.Corrupt financial dealings and conflicts of interest that have undermined public confidence in governance.Harmful foreign policy actions that have weakened global alliances and emboldened adversaries.As the world order evolves and new challenges emerge, failure to confront these past and ongoing threats will further endanger our democracy, economy, and national security. Our DemandWe urge you to: Publicly denounce any continued efforts to erode democratic norms and hold those responsible accountable.Support legislative action to strengthen election security, ethical governance, and protections against political corruption.Ensure legal consequences for individuals who engaged in or facilitated unlawful actions against the United States.Advocate for transparency in investigations surrounding the administration’s actions, ensuring that no individual is above the law.Hold a public town hall to address these concerns directly with your constituents, allowing us to voice our questions and expectations for how you plan to protect democracy.Why This MattersThis is not about partisan politics—it is about the rule of law, national security, and the fundamental rights of the American people. Silence in the face of corruption is complicity. We, as your constituents, demand that you stand on the side of justice, democracy, and accountability. We urge you to act now and meet with us in an open forum.Jason ThompsonDurham, NC, United States493/1/25PETITION FOR A RESIDENT-ONLY LANE FOR KEY BISCAYNE TAXPAYERSWe, the residents of Key Biscayne, demand immediate action from the City of Key Biscayne and the City of Miami to implement a dedicated resident-only lane for Key Biscayne taxpayers. This lane must be enforced at all time'''
