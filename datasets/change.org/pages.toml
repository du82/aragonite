["https://change.org/l/us/how-to-get-speed-humps-on-your-street"]
title = "How to get speed humps on your street: A resident’s guide · Change.org"
description = "On a busy residential street filled with families and children in Fair Lawn, New Jersey, a nine year old boy was hit by a speeding car trying to cross a street where speeding is frequent. As their neighbor said in a petition to the mayor and City Council, “His and his family’s lives will be […]"
full_description = "NewsGuidesShare this postShare this postfacebooktwitteremailCivic EngagementHow to get speed humps on your street: A resident’s guideFeb 27, 2025 On a busy residential street filled with families and children in Fair Lawn, New Jersey, a nine year old boy was hit by a speeding car trying to cross a street where speeding is frequent. As their neighbor said in a petition to the mayor and City Council, “His and his family’s lives will be forever impacted by a tragic accident that could have absolutely been avoided, if the appropriate safety precautions were in place.” At another dangerous intersection in a Queens, New York neighborhood, residents witnessed at least 10 “horrific” car accidents in the span of a year and a half, one involving a school bus of children. The residents’ petition to their elected officials called on them to install speed humps and stop signs to prevent “countless future accidents.” Unfortunately, getting a speed hump installed isn’t always easy. Many factors go into the process and the transportation department’s decision. Depending on the location, sometimes it can take multiple years. Some cities require a traffic study, which may result in denying the speed hump request or providing a potentially less effective alternative. However, you can take steps to strengthen your speed hump application, expediting the process and increasing your chances of approval. Use this guide to take action and learn how you can put pressure on your city officials when you need to. → Start a petition now on Change.org Why are speed humps important? Speed humps — also known as speed bumps — force drivers to slow down, reducing dangerous accidents and damage caused by speeding vehicles. The following data and key facts show how effective speed humps are on improving public safety: Speed humps reduce speeds to 10-15 miles per hour A study analyzing collision data from a statewide database compared incidents 2.5 years before and after a speed hump was installed. The results showed a 37.5% decrease in collisions involving vehicles and child/adolescent pedestrians. A study conducted over a five year period found that speed humps reduced the odds of children being injured or killed in their neighborhood from being hit by a car by 53% to 60% Photo by Richard Drdul on Flickr How to get a speed bump installed on your street The process for getting a speed hump can vary according to each area’s procedures, environment, and traffic activity. In any case, it’s a community effort that requires a group of concerned neighbors taking action to improve the safety and quality of life in their neighborhood. One resident shared on Quora how they successfully got six speed bumps and a couple of stop signs installed in their neighborhood within a year: Gathered all affected neighbors and elected a spokesperson to correspond with city officials Collected relevant facts, information, and pictures and videos of instances like cars speeding or running stop signs while kids are playing in the neighborhood Documented a basic daily count of cars driving on the street Attended a City Council meeting and presenting all the information and visual documentation Brought as many neighbors as possible to the City Council meeting to demonstrate collective concern and strength in numbers The following are a breakdown of the essential steps you need to consider when requesting speed humps. Research your city’s policies and procedures The first step is to find out the local procedures and policies for installing a speed hump. Each city has its own set of requirements to ensure that any traffic-calming measure is safe and effective. Here are the key points to consider: Location requirements: Find out if your area meets the specifications for placing a speed hump there, like the speed limit, a non-commercial road or emergency route, doesn’t exceed a certain incline. Also, check if there’s a need for traffic studies, speed assessments, or accident history documentation. Process requirements: Learn the steps for submitting a formal request, including Who to contact and submit the request to — usually your local public works or transportation department, What necessary forms to complete, including an application, a petition, and other documents What data or supporting information you need to include along with your request If you need to present your findings at a city council or public hearing Community support requirements: Many cities require a petition or evidence of community backing. Collect signatures and feedback from affected neighbors to strengthen your case. For example, in Chicago’s 49th Ward, 70% of affected units on a street must sign a petition and submit it to the Ward Service Office which will determine installation feasibility with the Department of Transportation. Organize a neighborhood meeting and action planning Once you understand if the location where you want a speed hump meets the city’s requirements and how to request one, you can gain support and coordinate with your neighbors. Organize a meeting to discuss and decide on: The agreed specific target location for the speed hump Who will be the neighborhood representative and point person for making the formal request, whether that’s submitting the application and paperwork, speaking at a City Council meeting, or meeting with the appropriate city officials If supporting data and evidence is required, and to strengthen your argument, make a plan to compile photos, videos, research, and testimonials to include in your request. Tip: Create a shared folder on Google, Dropbox, or other app of choice to store all documents. If there are costs associated with getting a speed hump installed, agree and determine how it should be paid for If a petition with signatures from residents is required, print a paper petition or create an online petition for everyone to sign Define, describe, and document the problem Next, compile all the info and data you have about the safety issues in your neighborhood into an organized document to include as an application cover letter. If your city doesn’t have a specific application process, an online petition is an effective tool. Here’s what to include: Traffic data: Record vehicle counts, speeds, and peak traffic hours to quantify the problem. Safety incidents: Document any collisions, near-misses, or dangerous encounters involving pedestrians, cyclists, or vehicles. Visual evidence: Include photos and videos that clearly show speeding, unsafe conditions, or children playing near traffic. Resident input: Collect testimonies, signatures, and comments from community members affected by the issue. Contextual information: Provide details about the street layout, proximity to schools or parks, and any existing traffic calming measures. This detailed documentation presents a clear narrative, supports your case with solid evidence and demonstrates the urgency of your request. Make the formal request Once you’ve gathered the necessary data and community support, it’s time to take action. Making the formal request can vary by location, but will likely include one or more of these steps: Submit your application: Complete the official forms provided by your local transportation department. Attach your cover letter, data, photos, videos, and community signatures to build a compelling case. Speak to City Council: Attend City Council meetings or arrange meetings with council members to present your issue. Provide your documented evidence and request that they advocate on your behalf to the transportation department. Leverage your homeowner’s association: If applicable, work with your HOA to facilitate the request. Their formal backing can add weight to your petition and help streamline the process. Follow-up: After submitting your request, stay engaged by regularly contacting the relevant departments. Be prepared to answer any questions and supply additional details if needed. If needed, put the pressure on with a petition Creating a Change.org petition can help you in different ways with getting a speed hump installed as quickly as possible. First, you can use the online petition platform as the tool to create the required petition and get the signatures needed to include in your request. But, it can also get the attention of the local government when you run into delays, unresponsiveness, or other bumps in the road (sorry, we had to). A public petition can attract wider attention, engage more community members, and even draw media interest. This will put additional pressure on decision makers to act. Speed humps improve cyclist safety. Photo by Richard Drdul on Flickr Successful speed bump petitions The following examples show how two communities used the power of public, online petitions to get their elected officials to take action. Oceanside, California petition A resident in Oceanside rallied their community by launching a petition after witnessing daily dangerous driving and collisions in their community. This petition detailed the risks and requested traffic calming measures such as speed bumps, speed radars, and increased police patrols. The petition achieved success with: Documenting key observations and data: After purchasing a home in 2020, the resident noted a range of hazards — from running stop signs and extensive speeding to collisions involving parked cars, pedestrians, and animals. Over 20 incidents dating back to 2010 were documented, supported by personal accounts from neighbors. Collaborative formal action: The petition was designed as part of a comprehensive application package to be presented to the Oceanside City Council. Neighbors were encouraged to contribute their experiences via email, bolstering the case with firsthand accounts. The petition resulted in a successful meeting with the city engineer which confirmed a proposed plan and funding for the speed calming measures. Stowe, Pennsylvania petition Residents of Benwood Avenue in Stowe Township created a petition calling for speed humps after experiencing dangerous speeding on a street with a posted 15 mph limit. They achieved success by: Documenting evidence: A motion-activated camera captured vehicles speeding dangerously and multiple accidents. One accident included a night-time T-bone crash causing about $7,000 in damage. Videos and firsthand accounts highlighted repeated near-misses and property damage. Urgent call for action with statistics: The petition emphasized the urgent need for speed humps to protect children walking to school and residents, citing data from the Pennsylvania DOT and NHTSA on speeding as a leading cause of crashes and fatalities. After presenting their case, the residents met with the township board, resulting in the approval of a speed hump on Benwood Avenue. Empower your community to create safer streets An organized, united community can overcome bureaucratic hurdles and transform public safety. When residents come together, armed with data, personal stories, and determination, they create a force that local officials can’t ignore. If your neighborhood needs safer streets, take action now. Launch a Change.org petition to rally support for a speed hump in your area. Every signature not only demonstrates the community’s commitment but also sends a clear message to decision-makers: safety is non-negotiable."
year_published = 2025
