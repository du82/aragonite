full_description = "VictoryOppose the Rezoning of Pullman, WA Property to Heavy Industrial for Biodiesel Plant7,427 signatures TopicAffordable Housing891,439 supporters taking action on this topic.2,348 petitions started in this community.Start a petitionLearn more about Affordable Housing topic at Change.orgAffordable housing is a pressing issue across the globe, as rising housing costs outpace income growth, leaving many individuals and families struggling to find a decent place to live. Petitions on Change.org addressing this topic focus on advocating for policies to increase affordable housing options, protect tenants rights, and combat homelessness. One notable petition with thousands of signatures calls for government intervention to regulate rent prices and prevent landlords from exploiting tenants. Another petition highlights the urgency of providing safe and affordable housing for marginalized communities, such as veterans and low-income families. By exploring and supporting these petitions, you can contribute to the fight for affordable housing and help create a more equitable society. Your involvement can make a significant impact in ensuring that everyone has access to a safe and affordable place to call home.Explore 2,348 petitions in Affordable HousingTrendingMost RecentCommunity Petition To Pause Development at Turtle Bay18,191 signaturesMake Miami Affordable1,950 signaturesSave Our Homes: Stop the Demolition of Our Santa Monica Community!1,617 signaturesRespect Urban Village Plans and Ensure Responsible Redevelopment in San Jose1,402 signaturesPROTECT open spaces for future generations1,455 signaturesProtect North Glendale from a Dangerous Development!3,155 signaturesHelp Save the Girouard Family Home at Rhus Ridge584 signaturesOpposition to Oldenburg Low-Income/Section 8 Housing Project582 signaturesShow moreStories and updates from petition startersCommunity Petition To Pause Development at Turtle BayProtect Turtle Bay! Important Updates and Call t