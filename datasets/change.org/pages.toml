full_description = "Mandate the Availability of EpiPens in All Public BuildingsMandate the Availability of EpiPens in All Public BuildingsRecent signersAMELIA SHAWLEY•19 minutes agoLora-Lee Reed•31 minutes agoAshley Flores•4 hours agoMichael Holland•5 hours agoSteven Alfonsus•11 hours agoKarla Holland•12 hours agoMarilee Schweizer•12 hours agoNicole Hutchko•13 hours agoDelta Kuhn•15 hours agoJanet Woods•17 hours agoLaura Woods•17 hours agoJason Eastman•19 hours agoAngela Hensley•24 hours agoAllierose Hussain-Wong•1 day agoKailey Salas•1 day agoHeather Blahous•1 day agoCatherine Boehmcke•1 day agoMegan Nelson•1 day agoAbundance Love•1 day agoBarbara Brown•1 day agoAMELIA SHAWLEY and 19 others have signed recently.Decision Makers: United States Department of Health and Human Services +2The IssueAs someone who has lived with severe anaphylaxis to both tree nuts and peanuts my entire life, I understand firsthand the fear and frustration that comes with food allergies. It's disheartening how often people make light of these serious conditions, and even more so when life-saving EpiPens are not readily accessible. Despite always carrying one with me, there's a lingering worry - what if one is not enough?Food allergies affect an estimated 32 million Americans including 5.6 million children under age 18. That’s one in 13 children, or roughly two in every classroom (FARE). Anaphylaxis can occur within seconds or minutes of exposure to an allergen, leading to potentially life-threatening reactions.This petition calls for a mandate requiring all public buildings - including privately-owned restaurants - and all commercial airline flights to carry EpiPens. These essential medical devices should be easily accessible for those living with food allergies.The presence of EpiPens in these locations could mean the difference between life and death during a severe allergic reaction. By signing this petition, you're advocating for increased awareness about the severity of food allergies and promoting accessibility to crucial medical resources.Please sign this petition today; let's work together towards creating safer environments for everyone living with food allergies.Report a policy violationKelsey WellsPetition StarterMedia inquiriesSign petition82,021Verified signaturesAMELIA SHAWLEY•19 minutes agoLora-Lee Reed•31 minutes agoAshley Flores•4 hours agoMichael Holland•5 hours agoSteven Alfonsus•11 hours agoKarla Holland•12 hours agoMarilee Schweizer•12 hours agoNicole Hutchko•13 hours agoDelta Kuhn•15 hours agoJanet Woods•17 hours agoLaura Woods•17 hours agoJason Eastman•19 hours agoAngela Hensley•24 hours agoAllierose Hussain-Wong•1 day agoKailey Salas•1 day agoHeather Blahous•1 day agoCatherine Boehmcke•1 day agoMegan Nelson•1 day agoAbundance Love•1 day agoBarbara Brown•1 day agoAMELIA SHAWLEY and 19 others have signed recently.Decision Makers: United States Department of Health and Human Services +2The IssueAs someone who has lived with severe anaphylaxis to both tree nuts and peanuts my entire life, I understand firsthand the fear and frustration that comes with food allergies. It's disheartening how often people make light of these serious conditions, and even more so when life-saving EpiPens are not readily accessible. Despite always carrying one with me, there's a lingering worry - what if one is not enough?Food allergies affect an estimated 32 million Americans including 5.6 million children under age 18. That’s one in 13 children, or roughly two in every classroom (FARE). Anaphylaxis can occur within seconds or minutes of exposure to an allergen, leading to potentially life-threatening reactions.This petition calls for a mandate requiring all public buildings - including privately-owned restaurants - and all commercial airline flights to carry EpiPens. These essential medical devices should be easily accessible for those living with food allergies.The presence of EpiPens in these locations could mean the difference between life and death during a severe allergic reaction. By signing this petition, you're advocating for increased awareness about the severity of food allergies and promoting accessibility to crucial medical resources.Please sign this petition today; let's work together towards creating safer environments for everyone living with food allergies.Report a policy violationKelsey WellsPetition StarterMedia inquiries104 people signed this weekSign petition82,021Verified signaturesThe Decision MakersUnited States Department of Health and Human ServicesNo response Food and Drug AdministrationNo response United States Department of TransportationNo response The SupportersFeatured CommentsPenny, Brooklyn3 weeks agoA ton of my friends have had their lives SAVED by a epi pen one of them almost didn't make it. Thankfully the building we were in had one on hand but I know that she got lucky. I will share this with all my friends with allergys and others without.Cheri, Newport News2 weeks agoI have severe allergies, including coconut, peanuts, and garlic and now that coconut is no longer listed as an allergy I’m ever my worried about having a reaction while out and not having one of my pens with me or having it happen to someone else and them not getting help.Monica, Laurel4 weeks agoEpi-pens can save lives!! It saved my son’s life from having desserts that contained diff types of nuts. If Epi-pen was not available at the time of his severe allergic reactions oh my…I can’t even imagine. Now that he is 17 & busy at school away from my supervision and not having Epi-pen with him always in public buildings, it could be fatal. Therefore, I support 100% for availability of Epinephrine in all public places for survival rate is higher incase one doesn’t have the Epi-pen. Thank you very much for this opportunity to add my voice.Show full textView all commentsFeatured Videos1615107200Sign and share why you care!Share this petitionShare this petition in person or use the QR code for your own material.Download QR CodePetition created on January 26, 2024Change.orgHealthMandate the Availability of EpiPens in All Public Buildings"
