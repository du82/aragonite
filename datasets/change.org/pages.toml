title = "Petition · Mandatory Autism & Mental Health Training for First Responders, Educators & Resources - United States · Change.org"
description = "My Family and I are one of countless victims to police using excessive force due to a lack of understanding and empathy towards mental illnesses. A Disabled Veteran with PTSD traveling with his nonverbal autistic son should never result in civil rights violations and a wrongful arrest during a routine traffic stop. Especially when the exact same officer has repeatedly lied & harassed him & others"
full_description = "Mandatory Autism & Mental Health Training for First Responders, Educators & ResourcesMandatory Autism & Mental Health Training for First Responders, Educators & ResourcesRecent signersAMELIA SHAWLEY•22 minutes agoRukiye Sen•33 minutes agoTiffany Urbay•39 minutes agoJuliana Johnston•43 minutes agoPaolina Aguilar•1 hour agoSydni Odeagrd•2 hours agoSusan GOLDMAN•2 hours agoRandi Woehrle•2 hours agoAmanda Burns•2 hours agoAmanda Hernandez•4 hours agoSamuel Figler•5 hours agoHa My Luu•5 hours agoKevin Hager•5 hours agoDiana Fath•5 hours agoRita Gomez•7 hours agoKaren Uher•8 hours agoRilee Morse•8 hours agoLorraine Childs•8 hours agoAxandria Olson•8 hours agoNatalie Ward•9 hours agoAMELIA SHAWLEY and 19 others have signed recently.Decision Makers: Kevin Lashley +271 UpdateThe IssueMy Family and I are one of countless victims to police using excessive force due to a lack of understanding and empathy towards mental illnesses. A Disabled Veteran with PTSD traveling with his nonverbal autistic son should never result in civil rights violations and a wrongful arrest during a routine traffic stop. Especially when the exact same officer has repeatedly lied & harassed him & others before in the past with unlawful traffic stops with a prior stop being in the home driveway of my family member at night after cops follow them home for miles before executing stop at residence. These type of officers with repetitive actions against certain people needs their immunity revoked & terminated because training won't help those type with ego/character issues that are simply on the job to terrorize & harm innocent individuals. The training is for Police ( First Responders) & Educators who are honest & there for the community not corrupt . Corruption is a pattern & learned behavior because a bad cop or teacher will assault/violate/harass individuals even without disabilities. Link to VIDEO FOOTAGE & Contact Methods will be below ⬇️. 📢This link is the video of the horrific experience my family encountered at the hands of untrained , unprofessional police https://youtu.be/1HKXbb-EptU?si=2_MncH5-zUnphvD6 📢This link is the Petition demanding resignation or Termination for the Officer my family encountered , we were also informed by the family of another victim that a child is now on a feeding tube as a result of his actions . https://chng.it/vB5k6H9rwJ We know firsthand the pain of officers who lack the training to recognize and effectively address conditions such as Autism and PTSD. No family should experience this. Our nation urgently needs a separate emergency hotline dedicated to mental health crises such as Autism, PTSD, Bipolar Disorder, etc.Caregivers need emergency Respite Care as they can often become burnt out due to the extreme waiting list for services. A specialized line that operates distinct from 911 would help ensure appropriate responses for those suffering from mental health issues. Moreover, all first responders, daycares, and schools across the country must undergo comprehensive training on Autism and other mental health conditions. It is crucial to teach proper restraint techniques and calming strategies that protect civil rights and negate the need for weapons or wrongful arrests. We also need to implement caregiver cards for each household expressing their loved ones needs. Reducing the cost of home security systems so families can monitor their Autistic Children who elope, affordable tracking devices, Nationwide cameras in schools and daycares. Free Parent trainings to assist caregivers in helping to resolve their loved one's mental crisis before First Responders is called. Mandating a changed with the Social Security system to help families get needed services without solely focusing on the parents' income. Families shouldn't have to wait years for needed early intervention services it's time for a change. We also need more ABA Centers who accept all forms of insurance, we need the school systems to allow aba in school globally. This link is the video of the horrific experience my family encountered at the hands of untrained , unprofessional police https://youtu.be/1HKXbb-EptU?si=2_MncH5-zUnphvD6 According to the U.S Department of Health and Human Services, there's an estimated 44 million adults with diagnosable mental health conditions in America, and 1 in every 54 children are diagnosed with Autism Spectrum Disorder (CDC, 2020). Despite these staggering statistics, our current system still falls short in its supports for those individuals.A change in emergency response protocol would mitigate unnecessary escalation and would eventually save countless lives. We propose new legislature to implement a nationwide mental health emergency hotline and require that all first responders receive appropriate training on managing mental health crises. Sign the petition today and help us better protect our citizens with mental health conditions. We can change the way we respond to mental health. We appreciate your time! Joycelynn.P (autismmom_joy)Report a policy violationAutismmom JoyPetition StarterMedia inquiriesSign petition26,133Verified signaturesAMELIA SHAWLEY•22 minutes agoRukiye Sen•33 minutes agoTiffany Urbay•39 minutes agoJuliana Johnston•43 minutes agoPaolina Aguilar•1 hour agoSydni Odeagrd•2 hours agoSusan GOLDMAN•2 hours agoRandi Woehrle•2 hours agoAmanda Burns•2 hours agoAmanda Hernandez•4 hours agoSamuel Figler•5 hours agoHa My Luu•5 hours agoKevin Hager•5 hours agoDiana Fath•5 hours agoRita Gomez•7 hours agoKaren Uher•8 hours agoRilee Morse•8 hours agoLorraine Childs•8 hours agoAxandria Olson•8 hours agoNatalie Ward•9 hours agoAMELIA SHAWLEY and 19 others have signed recently.Decision Makers: Kevin Lashley +271 UpdateThe IssueMy Family and I are one of countless victims to police using excessive force due to a lack of understanding and empathy towards mental illnesses. A Disabled Veteran with PTSD traveling with his nonverbal autistic son should never result in civil rights violations and a wrongful arrest during a routine traffic stop. Especially when the exact same officer has repeatedly lied & harassed him & others before in the past with unlawful traffic stops with a prior stop being in the home driveway of my family member at night after cops follow them home for miles before executing stop at residence. These type of officers with repetitive actions against certain people needs their immunity revoked & terminated because training won't help those type with ego/character issues that are simply on the job to terrorize & harm innocent individuals. The training is for Police ( First Responders) & Educators who are honest & there for the community not corrupt . Corruption is a pattern & learned behavior because a bad cop or teacher will assault/violate/harass individuals even without disabilities. Link to VIDEO FOOTAGE & Contact Methods will be below ⬇️. 📢This link is the video of the horrific experience my family encountered at the hands of untrained , unprofessional police https://youtu.be/1HKXbb-EptU?si=2_MncH5-zUnphvD6 📢This link is the Petition demanding resignation or Termination for the Officer my family encountered , we were also informed by the family of another victim that a child is now on a feeding tube as a result of his actions . https://chng.it/vB5k6H9rwJ We know firsthand the pain of officers who lack the training to recognize and effectively address conditions such as Autism and PTSD. No family should experience this. Our nation urgently needs a separate emergency hotline dedicated to mental health crises such as Autism, PTSD, Bipolar Disorder, etc.Caregivers need emergency Respite Care as they can often become burnt out due to the extreme waiting list for services. A specialized line that operates distinct from 911 would help ensure appropriate responses for those suffering from mental health issues. Moreover, all first responders, daycares, and schools across the country must undergo comprehensive training on Autism and other mental health conditions. It is crucial to teach proper restraint techniques and calming strategies that protect civil rights and negate the need for weapons or wrongful arrests. We also need to implement caregiver cards for each household expressing their loved ones needs. Reducing the cost of home security systems so families can monitor their Autistic Children who elope, affordable tracking devices, Nationwide cameras in schools and daycares. Free Parent trainings to assist caregivers in helping to resolve their loved one's mental crisis before First Responders is called. Mandating a changed with the Social Security system to help families get needed services without solely focusing on the parents' income. Families shouldn't have to wait years for needed early intervention services it's time for a change. We also need more ABA Centers who accept all forms of insurance, we need the school systems to allow aba in school globally. This link is the video of the horrific experience my family encountered at the hands of untrained , unprofessional police https://youtu.be/1HKXbb-EptU?si=2_MncH5-zUnphvD6 According to the U.S Department of Health and Human Services, there's an estimated 44 million adults with diagnosable mental health conditions in America, and 1 in every 54 children are diagnosed with Autism Spectrum Disorder (CDC, 2020). Despite these staggering statistics, our current system still falls short in its supports for those individuals.A change in emergency response protocol would mitigate unnecessary escalation and would eventually save countless lives. We propose new legislature to implement a nationwide mental health emergency hotline and require that all first responders receive appropriate training on managing mental health crises. Sign the petition today and help us better protect our citizens with mental health conditions. We can change the way we respond to mental health. We appreciate your time! Joycelynn.P (autismmom_joy)Report a policy violationAutismmom JoyPetition StarterMedia inquiries111 people signed todaySign petition26,133Verified signaturesThe Decision MakersKevin LashleyWarner Robins City Council - Post 4No response (notified 32 days ago)Email decision makerLarry CurtisWarner Robins City Council - Post 6No response (notified 32 days ago)Email decision makerLaRonda PatrickWarner Robins City MayorNo response (notified 32 days ago)Email decision makerView 25 moreThe SupportersFeatured CommentsKayla, Sandy Springs2 months agoI appreciate this type of petition speaking out against corruption, abuse of authority & injustice. I saw a video about this happening to my own family and it angers me especially when your reserve doesn't do anything to be in trouble. Dishonest and racist cops abusing authority putting people dads, brothers and more in danger because they can't control their ego or habit of harassing others. Don't touch people who are not committing crimes. Seeing the video, we definitely do not trust cops or judges anymore.Show full textMancala, Сан-Рамон1 month agoI was diagnosed with autism in my early childhood and sometimes have issues processing others’ thoughts and emotions. I also abhor indirectness and inconsistency, especially by those I’m supposed to trust or answer to. I openly refuse to accept a world where the corrupt get a free pass whilst the most vulnerable suffer.Jj, Pleasant view1 month agoAs an autistic person myself. I do struggle with understanding what people are saying. Also it can cause extra stress too. It would be awesome if law enforcement,emts and schools could be better equipped to handle those with mental health illnesses and disable,special needs people. It could also help grow the trust,the relationship between those in the community to the people who would be better educated to handle the situations better. It would be a win win for all involved if this passes and get enforcedShow full textView all commentsFeatured Videos61310Sign and share why you care!Share this petitionShare this petition in person or use the QR code for your own material.Download QR CodePetition created on January 7, 2025Change.orgMental HealthMandatory Autism & Mental Health Training for First Responders, Educators & Resources"
