title = "Proven petition templates and examples: Build a winning structure · Change.org"
description = "Petitions that succeed in achieving their goals and creating valuable change have certain traits in common. In addition to advocating for important causes that matter to groups of people, they’re designed and presented in a thoughtful, intentional way.  How your petition communicates your cause is critical to gaining support for it. This is why the […]"
full_description = "NewsGuidesShare this postShare this postfacebooktwitteremailStart a petitionGuidesProven petition templates and examples: Build a winning structureSep 12, 2024 Petitions that succeed in achieving their goals and creating valuable change have certain traits in common. In addition to advocating for important causes that matter to groups of people, they’re designed and presented in a thoughtful, intentional way. How your petition communicates your cause is critical to gaining support for it. This is why the structure, key details, and supporting information are so important. Present a strong, clear case that gets the attention of supporters and decision makers with these templates that will help you format and organize your petition. Draw inspiration from these examples to see how a successful structure comes together in practice. Petition templates The following are templates you can use to combine all of the essential elements of your petition in a neat and polished package. Refer to our how to write a petition guide for all the details on each component you need for a strong, thorough petition, including: A compelling headline Featured image Breaking down the issue Research or news coverage on the issue Personalization with stories or examples Clear and specific call(s) to action to the decision makers An easy to read and follow content structure Download or copy any of the following templates to customize for your audience and issue. General petition template This template works well for targeted, specific community causes or single, clear-cut calls to action. Follow the format below to create an actionable petition that motivates supporters to join your cause. [Petition headline] Craft a short, clear, and engaging headline that highlights the main goal of your petition. [Petition image] Include a high quality, relevant image that visually represents the issue or inspires action. [Introduce the issue + background] Begin by explaining the issue clearly and concisely. What is the problem, and why does it matter? Share your connection to the issue to make it personal and relatable. Example:“Our local park, which has been a cherished green space for our community for decades, is under threat of being replaced by a commercial development.” Provide context to help supporters understand the bigger picture. What led to this situation? Are there recent changes or events that have worsened the problem? Explain how the new or potential circumstances disrupt the present conditions, or how not changing the situation will continue to worsen the problem Example:“Until recently, our park hosted weekly community gatherings, children’s playdates, and outdoor exercise groups. However, a recent decision by the city council has prioritized commercial interests over community needs, leaving us with fewer green spaces and a loss of community resources.” [Who is affected and how] Explain who is impacted by the issue and the change you’re seeking. Use stories to personalize your petition and demonstrate the weight of the issue. Detail how this problem affects individuals or groups. Use specific examples or anecdotes to convey the real-world impact. If appropriate, share your personal experience, those of your community, or whoever you’re representing. Example:“Families, seniors, and children depend on the park for recreation and social interaction. Without it, many will lose a safe space for outdoor activities, which is especially critical for families who lack private yards or play areas.” [The solution: What you’re calling for] Clearly outline your proposed solution. Who has the power to address this issue? What specific action are you requesting from them? Example:“We are calling on the city council to halt the commercial development plans and instead allocate funds to preserve and improve the park for future generations.” [Calls to action: Encourage supporters to sign and decision makers to respond] End with a powerful call to action that inspires people to sign your petition and decision makers to accept and implement your request. Reinforce how signing the petition can lead to meaningful change. Urge supporters to sign the petition and reach out to decision makers themselves to advocate for your cause, providing them with the appropriate contact information. Demand the authorities you’re addressing take action. Example:“By signing this petition, you are standing up for our community’s future. Together, we can show the city council that protecting our green spaces is non-negotiable. Please sign and share to help us save our park! Help us amplify our petition by calling or emailing your council members [list contact info below] and attending the next meeting on [insert date] when we’ll be presenting our petition in-person. Members of city council: Please recognize the concerns of our community and stop the commercial construction in our community park.” Download the general petition template as a Google Document Change.org petition example This petition, which has accumulated significant support, urges San Bernardino County officials to keep the wild burros that help to prevent wildfires in their native environment. The petition successfully demonstrates how to present the most critical pieces of information and community requests in a thorough yet concise, direct way. Complex issue petition template This template is tailored for petitions addressing multi-faceted issues that require detailed explanations, structured arguments, and comprehensive calls to action. This detailed structure ensures your petition thoroughly addresses complex issues while remaining accessible and engaging to a wide audience. [Petition Headline] Create a compelling headline that succinctly captures the petition’s purpose and urgency. [Petition image] Include a high quality, relevant image that visually represents the issue or inspires action. I. Introduction: Why this matters Begin with a brief overview of the issue and why it’s important. State the petition’s purpose in a clear and engaging manner. Highlight the urgency or critical nature of addressing this topic now. Example:“Our city’s air quality has reached hazardous levels, affecting the health of thousands. This petition calls for immediate government intervention to implement cleaner energy initiatives and stricter pollution controls.” II. Background: Understanding the issue Provide detailed context and historical information about the issue. Include data, studies, or events that highlights its significance. Discuss how this problem impacts communities, the environment, or society as a whole. Example:“According to a recent study [link resource], air pollution in our city has increased by X% over the past decade [or other timeframe]. This spike is largely due to unchecked industrial emissions and insufficient clean energy policies. Without immediate action, the situation will worsen, further endangering public health and contributing to climate change.” III. Demonstrate the impact Clearly articulate the scope and consequences of the problem. Include specific examples and first-hand accounts of the effects on the community, environment, or individuals impacted. Emphasize the repercussions of not addressing the problem. Example:“The lack of effective regulation on industrial emissions has led to dangerous levels of pollutants in our air. This has resulted in rising cases of respiratory illnesses and increased healthcare costs for residents and environmental problems like increased severe weather in our area.” Include examples of recent extreme weather, like unusually high temperatures, fires, or dangerous storms Include specific examples or general data on how much respiratory illnesses have increased IV. Call to action: What needs to be done Formally request what the relevant authorities should prioritize and how they should take action to address the issues outlined. List specific, actionable steps for decision-makers and stakeholders. Example: Implement stricter air quality standards for industrial facilities, with regular inspections and penalties for non-compliance. Invest in renewable energy initiatives, such as solar and wind power, to reduce dependency on fossil fuels. Launch public awareness campaigns to educate citizens on reducing personal contributions to air pollution. V. Benefits of action: Why this is worth it Describe the positive outcomes of implementing the proposed solutions. Connect these benefits to the broader community, environment, or society. Example:“Taking these steps will result in cleaner air, healthier residents, and reduced healthcare costs. Investing in renewable energy will also create jobs, stimulate economic growth, and position our city as a leader in sustainable development.” VI. Ask for support: Join us in making a difference Reiterate the importance of addressing the issue. Encourage individuals and organizations to support the petition by signing and sharing it, and helping to put pressure on legislators by writing emails and making phone calls. End with a hopeful and motivational message to inspire action. Example:“We can’t afford to ignore this crisis any longer. Your support will help us win cleaner air and a brighter future. Please sign and share this petition, and raise your voice to legislators by emailing or calling them at the addresses and numbers listed below. Together, we can create lasting change.” Download the complex issue template as a Google Document Change.org petition example This petition to require the necessary number of healthcare staff per patient in medical organizations outlines all the details and data relevant to this far-reaching, complex issue. It lays out a multi-layered plan to address and resolve this critical problem. Printable Petition Template Copy this printable petition template and customize it to your issue to use it for local distribution. It is crucial to follow the correct petition format, which includes pre-numbering sections, providing designated representatives’ details, the language of the proposed measure, and signature lines, along with obtaining approval from the Secretary of State before circulation. Use the signature sheet to collect signatures in person. Add more signature pages if needed. Or, use our create an online petition to automatically keep track of your signatures digitally. Petition examples Petitions have many different applications to real-world problems, both large and small in scope. Check out the following examples to see ways advocates and concerned citizens can craft petitions to make positive change. Petition sample using a personal story Increase Accessibility for People with Disabilities We, the undersigned, kindly request that [Name of Public Institution/Organization] take immediate action to improve accessibility for people with disabilities within our community. As a person with a disability myself, I have personally experienced the challenges and barriers that arise due to limited accessibility. It is disheartening to be unable to fully participate in everyday activities that many take for granted. My own experience of trying to navigate [mention specific situations: public transportation, public facilities, educational institutions, etc.] has highlighted the urgent need for change. Different forms of accessibility improvements are needed, such as physical modifications and digital accessibility. These difficulties are not limited to me alone; countless members of our community face similar challenges daily. By improving accessibility, we are not only ensuring equal rights and opportunities for everyone but also fostering a more inclusive and diverse environment for all community members. We kindly request that [Name of Public Institution/Organization] takes the following steps: Conduct a thorough accessibility audit to identify areas that need improvement. Implement necessary physical modifications to public spaces, including ramps, handrails, and accessible restrooms. Provide disability awareness training to staff members to ensure respectful and helpful interactions. Ensure all digital platforms and information are accessible to people with various disabilities. Establish an ongoing dialogue with the disability community to address evolving accessibility needs. By undertaking these measures, [Name of Public Institution/Organization] will be demonstrating its commitment to creating an inclusive community where everyone can thrive regardless of their abilities. We, the undersigned, urge you to take prompt action in making these changes a reality. Together, we can build a more accessible and equitable future for all. Petition sample targeting local government about a neighborhood issue My neighbors and I are deeply concerned about the ongoing issue of speeding vehicles within [neighborhood name]. We believe that the installation of a speed bump on [Street Name] would greatly enhance the safety and well-being of our neighborhood. [Neighborhood name] is a family-oriented community with numerous children, pedestrians, and pets that frequently traverse the area. Unfortunately, the current speed limit is often exceeded by motorists, putting the lives of our residents at risk. [Include a recent stat about accidents and injuries caused by speeding vehicles in residential neighborhoods] We believe that a speed bump strategically placed on [street name] would serve as an effective traffic calming measure, encouraging drivers to slow down and adhere to the posted speed limit. By signing this petition, we, the undersigned residents of [neighborhood name], respectfully request the following actions: Conduct a comprehensive traffic study on [street name] to assess the extent of the speeding issue and its impact on safety. Based on the study’s findings, evaluate the feasibility of installing a speed bump at an appropriate location on [street name]. Collaborate with local law enforcement to monitor and enforce the speed limit once the speed bump is installed. Prioritize the safety and well-being of [neighborhood name] residents by taking prompt action to address this concern. We understand that any changes to road infrastructure require careful consideration and planning. However, we firmly believe that the installation of a speed bump aligns with the city’s commitment to promoting safe and livable communities. We are ready to cooperate, participate, and support the implementation process in any way possible. We kindly request the opportunity to meet with you to discuss this matter further and share additional insights from our community. Your expertise and guidance in this regard would be greatly appreciated. Thank you for your attention to this pressing matter. We look forward to your positive response and the potential improvement in the safety of our neighborhood. Use these tools to create your own petition Now that you have the resources to develop a petition to tackle whatever challenge you’re f"
