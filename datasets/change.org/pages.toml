full_description = '''Oppose the Rezoning of Pullman, WA Property to Heavy Industrial for Biodiesel PlantOppose the Rezoning of Pullman, WA Property to Heavy Industrial for Biodiesel Plant16 UpdatesThe IssuePRESS RELEASE from the PORT of WHITMAN - April 20, 2023: Port of Whitman County Commission votes to withdraw rezoning application, offer to purchase 184 acres for Agriculture Advancement Campus Pullman Radio News - April 20, 2023: Port Of Whitman County Commissioners End Controversial Plan For Industrial Research Park In Pullman Whitman County Gazette - April 13, 2023: Protests continue against Port of Whitman The Daily Evergreen (WSU Student newspaper) - April 13, 2023: Controversial Agricultural Advancement Campus is under review Lewiston Tribune Article - April 11, 2023: Residents protest Port of Whitman plan to rezone residential property for industrial use Moscow/Pullman Daily News Article - April 11, 2023: Pullman residents protest Port of Whitman County rezoning plan; Resistance builds to advancement campus request Moscow/Pullman Daily News Article - March 29, 2023: Pullman residents demand Port of Whitman County withdraw zoning application Pullman Radio News Article - March 28, 2023: Port Of Whitman County Commissioners Agree To See Rezone Process Through For Controversial Industrial Research Park In Pullman March 28, 2023, 4:30 PM - 5:30 PM; Special meeting called by the Port of Whitman! PORT ANNOUNCES SPECIAL MEETING! LOCATION: 302 N. MILL ST., COLFAX (we are encouraging all who can to attend in person!) ZOOM LINK: HTTPS://PORTWHITMAN.US19.LIST-MANAGE.COM/TRACK/CLICK?U=1FA9A9D4CF8BFA76A8947E10F&ID=A6CE19BD38&E=9C618DE6C UPDATE to the PRN (Pullman Radio News) article from March 22, 2023: Port of Whitman County officials have confirmed that the 5 million dollar state loan (CERB) to pay for the property is no longer available. The commissioners will discuss possible state funding options during a special meeting that’s expected by the end of the month. Port of Whitman Press Release - March 22, 2023: Port of Whitman County to continue with rezoning process for Agriculture Advancement Campus . Our fight to stop this rezone attempt CONTINUES! Please sign the petition. That land should be left as residential and small commercial. Pullman needs housing - not an Industrial Research Park! Press Release (March 21, 2023): AgTech OS Inc. Seeks Alternate Location for Palouse Region Operation Please Note: We are still being vigilant in this opposition of the Port of Whitman to rezone the proposed property to an Industrial Research Park! This land must remain residential and light commercial zoning! NEW website and gmail (email) account for our cause/group (launched March 20, 2023): Thanks to a very dedicated volunteer - we now have a web site! CLICK HERE to visit the site and the email for the group is savepullman@gmail.com Pullman Radio News Article: First Iteration Of Company Involved In Proposed Pullman Biodiesel Plant Being Sued In Florida Posted on 03/13/2023 Whitman County Gazette Article: Opposition to biodiesel plant in Pullman grows Posted on 03/09/2023 City of Pullman Press Release - March 09, 2023: CITY REQUESTS ADDITIONAL MATERIALS FOR PORT’S REZONE APPLICATION City of Pullman - Planning Department - 03/03/2023: City Receives Port's Rezoning Application Port of Whitman Press Release - 03/02/2023 (NOTE: The Port is taking a NEW rezoning request tactic by asking to rezone the land to an Industrial Research Park (versus Heavy Industrial) and then - if the rezoning to an IRP is approved - will ask for a Conditional Use Permit to request putting a Biodiesel refinery in the Industrial Research Park). Port Submits Rezoning Application for Agriculture Advancement Campus Pullman Chamber of Commerce Youtube Channel Link - An informational Session held at the SEL Event Center (on March 1, 2023) to give AgTech OS and the Port of Whitman a chance to present their proposal for the Ag Achievement Campus and the Biodiesel Refinery. If you could not attend in person - you can watch it on YouTube here. A SECOND PETITION has been started! Please SIGN BOTH! Your signature on THIS original petition is still valid, however we ask you also sign this newer one as well to make it abundantly clear to The City of Pullman you do not want an Industrial Research Park next to residential. Oppose Rezone of Pullman, WA Property to Industrial Research Park Pullman Radio News Article - Dated 03/01/2023: SEL Opposing Controversial Plan For Biodiesel Plant In Pullman-Informational Session Held-Port’s Rezone Strategy Changes Moscow-Pullman Daily News - Opinion Article - Dated 03/01/2023: His View: Proposed biodiesel plant location not right for Pullman Port of Whitman Press Release - Dated 02/21/2023: Gov. Inslee meets with Port, local partners: Meeting to learn about proposed Agriculture Advancement Campus and biofuels facility WSU Daily Evergreen (student newspaper) article (02/22/2023): Port of Whitman County moves forward with biodiesel plant plans Pullman Radio News radio podcast (02/22/2023) Part 2: LISTEN: Morning News Interview Part 2 With Port Of Whitman County & AgTech OS Officials About Their Proposal To Develop A Biodiesel Plant In Pullman KHQ Local News Broadcast - on TV the evening of 02/21/2023: Pullman residents frustrated over potential rezone of residential land, heavy industrial biodiesel site possible Pullman Radio News radio podcast (02/21/2023) Part 1 - LISTEN: Morning News Interview With Port Of Whitman County & AgTech OS Officials About Their Proposed Biodiesel Plant In Pullman Part 1 UPDATE regarding the rezoning application & SEPA checklist: I had reached out to the Port of Whitman yesterday (2/17/23) to ask if they had submitted the rezoning application and the SEPA paperwork to the City. Here is the reply I received: "The Port is in the process of completing the application and required paperwork and anticipates completion by the end of the month (February 2023)." So stay tuned... its not in the City's hands yet. Downtown Pullman Protest planned for Saturday - Feb 18th from 10 AM - 1 PM. We are gathering at the Cougar Plaza. Bring your signs, your voice, your enthusiasm and help raise awareness to the Pullman community that we don't want this biodiesel refinery in our city limits and next to family homes! Pullman Radio News Article (02/17/2023): Note - this meeting was CLOSED to the PUBLIC! Washington Governor Jay Inslee Meets With Local Officials Involved In Controversial Plan To Develop A Biodiesel Plant In Pullman And here is Big Country New's Version: Washington Governor Jay Inslee Meets with Local Officials Involved in Controversial Plan to Develop a Biodiesel Plant in Pullman Downtown Pullman, WA protest (02/17/2023): Pullman Radio News covered the Pullman downtown protest! Way to go team!! Thank you to all who made signs and took the time to raise awareness and send a message to the City that we don't want this plant within the City limits of Pullman! You can watch the video clip HERE. KXLY News Broadcast (02/16/2023):'That's three Walmarts right there;' Biodiesel plant proposed several hundred feet from Pullman neighborhood March 1, 2023. Port of Whitman Commissioner and AgTech OS team to present informational session to the Pullman Chamber of Commerce. See announcement and details here. UPDATE 2/17/2023: From the Chamber today: The informational Biodiesel Meeting scheduled for March 1st, 2023 is changing venue. The meeting will now be held at the SEL Event Center in order to accommodate the growing interest in the topic. Just a friendly reminder, this is an informational meeting and not a public hearing. Please come with the intention to learn more about the proposal from the Port of Whitman. If you wish to attend, reach out to the Pullman Chamber at chamber@pullmanchamber.com to request to be put on the guest list. Friday - February 17, 2023. Washington Governor Jay Inslee to visit Whitman County and possibly speaking to AgTech OS and Port of Whitman Commissioners regarding proposed Biodiesel Plant. See the podcast from Pullman Radio News here. UPDATED: here is a Pullman Radio News Article about his visit - closed to public. Washington Governor Jay Inslee In Town Friday Morning To Discuss Proposed Biodiesel Plant For Pullman-Meeting Closed To General Public Update - Big Country News Connection Article - contains Inslee's schedule for his Palouse visit on 2/17/23: Washington Governor Jay Inslee to Visit Whitman County on Friday NOTE: If you wish to voice your concerns about the placement of this biodiesel plant within the city limits of Pullman, Washington - you can emessage the Governor HERE. Lewiston Tribune Article (02/14/2023): Neighbors raise questions about proposed Pullman biodiesel plant; AgTech OS would create 44 new jobs in city, but some are worried about noise, pollution and water use Moscow/Pullman Daily News Article (02/14/2023): Questions arise on Pullman biodiesel proposal; Some neighbors are worried about noise, pollution and water use Pullman Radio News Article (02/13/2023): Port Of Whitman County Commissioners Continue To Move Forward With Proposal For Biodiesel Plant In Pullman Despite Growing Opposition Update 02-13-2023: I would like to sincerely thank everyone who attended today's (2/13/2023) Port of Whitman Commission meeting. There were some great comments and concerns voiced! As cliché as it sounds – this really will take a village! As predicted – it appears the Port of Whitman will move forward with submitting a rezoning application and SEPA (environmental checklist) to the City of Pullman Community Development Department. Community Development department will need to do their work to review all documents and ensure completeness. They are required to put out a public notice regarding this application and they will establish a web page dedicated to the Port of Whitman’s application. Stay tuned. The fight to oppose this isn't over. We will be talking to the City of Pullman next when the public comment period opens. Pullman Radio News Article (02/10/2023): Port Of Whitman County Commissioners To Consider Site Plan Monday Morning For Proposed Biodiesel Plant In Pullman Update 02-10-2023: The agenda packet for the Feb 13, 2023 Port Commission meeting has been posted HERE. Meeting starts at 9 AM (PST) on Feb. 13, 2023. The packet contains zoom connection information or you can attend in-person at 302 N. Mill Street, Colfax WA. There will be a public comment period at the beginning and end of the meeting and you are encouraged to participate. UPDATE 02-09-2023: The Port of Whitman put out a press release describing more details about their plans for their proposed purchase of land for the biodiesel plant. The application to apply for rezoning will be discussed at the February 13, 2023 Port Commissioner meeting. There is a link in this press release to the Post's web site where they post agendas and information on how to attend the meeting (in-person and on zoom). You can read the press release HERE. Background: The Port of Whitman has put in offer to purchase ~200 acres of land near the intersection of Highway 195 and Old Wawawai Road between the Whispering Hills Housing Subdivision and the Hinrichs/Ardent Mills Garbanzo facility. The purpose of this land purchase is to develop the property for a canola crushing and processing facility for the refinement & production of biodiesel. The start-up company who would build and manage this plant is called AgTech OS. It should be noted this is a newly formed company and little information can be found doing google searches to indicate this company has every built such a facility. Part of the 200 acres is currently annexed into the City of Pullman, Washington and is currently zoned R1, R2 and C1. The Port of Whitman is planning to put in an application with the City of Pullman Planning Committee to request that that property be rezoned to heavy industrial in order to build the biodiesel plant. It should be noted that this property is directly adjacent to a large residential area, assisted living facility, elementary school, walking paths, community food gardens, and parks. Concerns: Although the FAQ section of the AgTech OS web site states that there will be minimal impact to the area and community with the establishment of this plant, the community of Pullman should be concerned due to the issues listed below that have been documented concerns where biodiesel plants are built in close proximity to cities, towns and residential areas. Air Quality and Odor: The prevailing winds in the area where the proposed plant will be erected would blow any exhausted air, odors and pollutants over most of the City of Pullman. The processing of plant material to extract oil for biofuels/biodiesel involves the use of chemicals and there would be an exhaust system as part of the plant. Canola is a fragrant plant as noted by area producers. There is real concern that the air quality would be greatly reduced for residents and there would be a noxious odor that would permeate the City of Pullman. AgTech OS has stated this plant would run 24/7; 365 days a year. How would this affect people's health and quality of life? Water Usage: It is speculated by the AgTech OS company that the plant will use up to 10,000 gallons of water PER DAY - equivalent to the usage of 50 households. Again, speculation. They don't really know because this is their FIRST plant of this type. Will the Palouse aquifer be able to keep up with this demand? Pullman residents already have to limit water usage in the hot summer months. Imagine the water needs of a plant that will run non-stop, 24 hours per day, 365 days per year. Noise: The refinement of oil involves the use of machinery and the transport of product to/from the plant would involve large semi-trucks. Machinery and trucks make noise. The City of Pullman has a noise ordinance where the quiet hours are to be from 10 PM - 7 AM. How is a plant that runs 24/7; 365 days a year to be compliant with the the City's noise ordinance? Traffic: The Port of Whitman has stated that there will be around 15 semi trucks per day coming/going from the biodiesel plant. The area where this proposed plant will be located is close to other agricultural businesses and operations that already put many trucks traversing the area. There are trucks going in/out of the Hinrichs/Ardent Mills facility, container trucks going to/from the container lot on the corner of highway 195 & 194, trucks moving through the area during fall farm work, spring planting and harvest season. The addition of 15 more trucks per day to that area & intersection will make for many traffic challenges as well as increases in vehicular accidents. It will also increase the noise (jake brakes) and air pollutants from truck exhaust. Start-Up Company - AgTech OS: As stated above, many residents have concerns due to the lack of documented credibility, financial records, and history of this company in building bio'''
