ident of the United States.338 signaturesStop the 25% Tariff on Canadian Goods – Protect Small Businesses & Pet Food Choice!363 signaturesShow moreStories and updates from petition startersVisa and Mastercard, do not suspend transactions with Russian cards outside of Russia!Нам нужны ваши истории!Всем привет! Большое вам спасибо за то, что вы с нами. Меньше, чем за неделю при поддержке команды change.org петиция собрала почти 40К подписей. Это впечатляет! Но сейчас рост числа подписей замедлился. В данный момент мы работаем над тем, чтобы заинтересовать петицией российские и зарубежные СМИ, а также донести нашу позицию до представителей Visa и Mastercard. И здесь мы очень рассчитываем на вашу помощь. Прямо сейчас нам нужны ваши истории: лично ваши, ваших знакомых, друзей, родных, которые из-за приостановки транзакций оказались в сложной жизнненной ситуации без денег за пределами России или внутри неё. Мы знаем, что таких людей уже очень много и будет становиться больше. Пожалуйста, присылайте ваши истории на этот ящик visa.mc.petition@gmail.com Продолжайте распространять петицию, это очень важно! Мы уверены, что изменить ситуацию возможно. С уважением,ГеоргийMarch 12, 2022Musk Needs to go. He is Not the President of the United States.Going After the Judiciary NowHello, I’m not sure if you’ve heard, but Musk is now calling for the judge who stopped him from accessing the checkbook to our country to be impeached. When is Congress going to stand up for their power? They seem to just be giving it over to the executive branch and Musk. Thank you for signing this petition. Please share it with others. I don’t do TikTok or instagram, so feel free to share it that way if you do. It’s time to get this petition out there. sincerely, SarahFebruary 10, 2025Musk Needs to go. He is Not the President of the United States.Easier to remember URL to shareHi All, Thank you for signing. Please share this with others. We need to do everything we can, and this is one thing we can do, as 