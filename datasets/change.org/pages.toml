full_description = "TopicPolice Brutality66,504,633 supporters taking action on this topic.690 petitions started in this community.Start a petitionLearn more about Police Brutality topic at Change.orgPolice brutality is a pressing issue that has sparked global outrage and calls for reform. Recent events have highlighted the excessive use of force by law enforcement, particularly towards marginalized communities. Petitions under this topic focus on demanding accountability, racial justice, and systemic changes within police departments. Notable petitions include one urging for body cameras for all officers to increase transparency and accountability, and another advocating for the reallocation of police budgets towards community services and mental health resources. These petitions highlight the need for reform and address the disproportionate impact of police violence on Black, Indigenous, and people of color (BIPOC) communities. Join the movement to end police brutality by supporting these petitions and amplifying the voices of those affected. Together, we can drive meaningful change and create a more just and equitable society for all.Explore 690 petitions in Police BrutalityTrendingMost RecentPolice brutality justice for Omar66,847 signaturesDROP THE BOGUS CHARGES AGAINST LISA DAVIS -- HANDS OFF THE UHURU MOVEMENT!755 signaturesRequest Judge Leticia Marques to Recuse Herself from Markeith Lloyd's Cases105 signaturesFree LaKeith Smith!919,718 signaturesEnd the Genocide of Black and Indigenous People of Color1,664 signaturesPolice Brutality killed Sammy, We demand Justice because ALL Lives Matter....!10,797 signaturesJustice for Breonna Taylor11,437,726 signaturesGet Justice for Donnell Rochester3,533 signaturesShow moreStories and updates from petition startersFree LaKeith Smith!LINKTREEHello everyone! Since the last update, there’s been a lot of progress made on Lakeith’s behalf! This update asks you to please click on the link and use the provided links to stay updated on Lakeith and be provided resources on how to help! Thank you all for the continued support! #Justice4LakeithSmith #JusticeforLakeithSmithAugust 15, 2021Free LaKeith Smith!Thank you!We’ve reached half a million supporters! Thank you all for sharing his story and continued support! I’m forever grateful! #blacklivesmatter #justiceforlakeithsmith :)June 16, 2020Free LaKeith Smith!How You’ve Helped/Please Support These AccountsBy signing and sharing, Lakeith’s case has finally received new attention and new outcry! Thus, bringing more awareness to him and his unjust conviction! I wanted to say thank you to everyone! The petition does much more than you may believe so the continued support and sharing is so helpful. For more information, follow: @justice4lakeithsmith on Instagram @LakeithSmith on Twitter Both of these accounts were started by his family! Once again, thank you!! -AmaniaJune 18, 2020Show moreVictories in Police BrutalityVictoryJustice for George Floyd19,684,025 signaturesVictoryJUSTICE FOR GEORGE FLOYD3,414,844 signaturesVictoryRAISE THE DEGREE2,999,380 signaturesVictoryJustice for George Floyd634,932 signaturesShow more1. Start your petitionWe’ll help you build a campaign that gets noticed.2. Gather SupportEngage a large community of people who care about your cause.3. Reach those in powerInfluence decision-makers in government, companies, and other institutions to make real change.Don’t see your cause here yet? Make your voice heard!Start a petitionHomeTopicPolice BrutalityHomeTopicPolice Brutality"
