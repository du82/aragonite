title = "Petition · Community Petition To Pause Development at Turtle Bay - United States · Change.org"
description = """
Community Petition To Pause Development at Turtle Bay
We, the undersigned, stand in solidarity with Kūpaʻa Kuilima and strongly urge the Honolulu City Council, the Department of Planning and Permitting (DPP), the Mayor of Honolulu, Host Hotels & Resorts, and Areté Collective to pause the development at Turtle Bay and reopen transparent processes for public participation in the areas identified bel"""
full_description = "Community Petition To Pause Development at Turtle BayCommunity Petition To Pause Development at Turtle BayRecent signersPatricia Munoz•6 hours agoPaige Alms•22 hours agoKeoki Saguibo•1 day agosean cervone•1 day agoCorrie Gray•1 day agoTori Campbell•1 day agoMelissa Meek•1 day agoLouis Jeffers-fabro•1 day agoThom Carroll•1 day agoKristen Cooper•1 day agoJazzlyn Hagmoc garcia•1 day agoAndrea Lawler•1 day agoMandy Wheeler•1 day agoAleigha Cauley•1 day agoBarbara Brown•1 day agoMary Katherine Moran•1 day agoCorey Hall•1 day agoSean Sherwin•1 day agoCarol Miller•1 day agoLEIf Robinaon•2 days agoPatricia Munoz and 19 others have signed recently.Decision Makers: Val Okimoto +114 Updates1 Media MentionThe IssueCommunity Petition To Pause Development at Turtle Bay We, the undersigned, stand in solidarity with Kūpaʻa Kuilima and strongly urge the Honolulu City Council, the Department of Planning and Permitting (DPP), the Mayor of Honolulu, Host Hotels & Resorts, and Areté Collective to pause the development at Turtle Bay and reopen transparent processes for public participation in the areas identified below so that we the people have a meaningful voice in determining the future of our ʻāina and quality of life in our communities. We ask that : The Department of Planning and Permitting (DPP) withdraw the 2022 determination to waive the need for revising the Supplemental Environmental Impact Statement (SEIS) or Special Management Area (SMA) permit for the imminent Resort Residential (RR-3) project and instead initiate the process for an updated SEIS and SMA that cover RR-3 and the two proposed Areté and Host hotels (H1 & H2). The City Council, the DPP, and/or Arete and Host support the convening of a representative Ko’olauloa-North Shore group to renegotiate a community benefits package and update the 1986 Unilateral Agreement (UA) to ensure the community has a formal role in determining and receiving just, clarified, and relevant benefits that reflect current needs and priorities. All applicable government agencies and processes should ensure compliance with the Ka Paʻakai Framework Analysis as outlined in Article XII, Section 7 of the Hawai‘i State Constitution, to safeguard Native Hawaiian cultural and traditional practices likely to be impacted by this development. Any and/or all development activities and/or the issuance of permits at Turtle Bay Resort should be paused until the above processes are completed. Our Justifications: Community Voices Matter: Transparency and public involvement must be prioritized in decision-making. The lack of adequate community consultation in the face of imminent development and new ownership at Turtle Bay Resort has left residents without a voice in the future of their community. Outdated Agreements: The 1986 UA, the 1986 SMA, and the 2013 SEIS are inadequate and do not reflect modern realities, such as the impacts of rising sea levels, increased coastal erosion, and the need for endangered species habitat protection. These documents must be revisited to address these urgent issues and comply with current environmental law standards. Environmental and Cultural Protection: Kahuku Point is a vital coastal habitat home to numerous endangered species and sacred burial sites (iwi kūpuna) that a development of this magnitude will significantly impact. These sensitive areas should be respected and preserved. Traffic and Safety Concerns: Increased development without updated traffic mitigation strategies exacerbates already critical congestion and safety risks for residents and visitors alike. Affordable housing and Community Impacts: This development is predominantly designed for a wealthier clientele, promoting gentrification to our unique rural and cultural community. Moreover, it will place additional strain on our already overburdened emergency response, healthcare facilities, public education systems, and other essential community resources, further intensifying the challenges posed by a significant population increase. The cumulative impacts of adding 100 luxury resort residential units, 625 hotel and/or condotel units, over 500 employees, and the potential for approximately 3,000 people daily to the area must not be ignored. Sign to Protect Turtle Bay! For more information and to keep in touch, please visit https://bit.ly/3Z9aNN7 and https://linktr.ee/kupaakuilima Report a policy violationKūpaʻa KuilimaPetition StarterMedia inquiriesSign petition18,191Verified signaturesPatricia Munoz•6 hours agoPaige Alms•22 hours agoKeoki Saguibo•1 day agosean cervone•1 day agoCorrie Gray•1 day agoTori Campbell•1 day agoMelissa Meek•1 day agoLouis Jeffers-fabro•1 day agoThom Carroll•1 day agoKristen Cooper•1 day agoJazzlyn Hagmoc garcia•1 day agoAndrea Lawler•1 day agoMandy Wheeler•1 day agoAleigha Cauley•1 day agoBarbara Brown•1 day agoMary Katherine Moran•1 day agoCorey Hall•1 day agoSean Sherwin•1 day agoCarol Miller•1 day agoLEIf Robinaon•2 days agoPatricia Munoz and 19 others have signed recently.Decision Makers: Val Okimoto +114 Updates1 Media MentionThe IssueCommunity Petition To Pause Development at Turtle Bay We, the undersigned, stand in solidarity with Kūpaʻa Kuilima and strongly urge the Honolulu City Council, the Department of Planning and Permitting (DPP), the Mayor of Honolulu, Host Hotels & Resorts, and Areté Collective to pause the development at Turtle Bay and reopen transparent processes for public participation in the areas identified below so that we the people have a meaningful voice in determining the future of our ʻāina and quality of life in our communities. We ask that : The Department of Planning and Permitting (DPP) withdraw the 2022 determination to waive the need for revising the Supplemental Environmental Impact Statement (SEIS) or Special Management Area (SMA) permit for the imminent Resort Residential (RR-3) project and instead initiate the process for an updated SEIS and SMA that cover RR-3 and the two proposed Areté and Host hotels (H1 & H2). The City Council, the DPP, and/or Arete and Host support the convening of a representative Ko’olauloa-North Shore group to renegotiate a community benefits package and update the 1986 Unilateral Agreement (UA) to ensure the community has a formal role in determining and receiving just, clarified, and relevant benefits that reflect current needs and priorities. All applicable government agencies and processes should ensure compliance with the Ka Paʻakai Framework Analysis as outlined in Article XII, Section 7 of the Hawai‘i State Constitution, to safeguard Native Hawaiian cultural and traditional practices likely to be impacted by this development. Any and/or all development activities and/or the issuance of permits at Turtle Bay Resort should be paused until the above processes are completed. Our Justifications: Community Voices Matter: Transparency and public involvement must be prioritized in decision-making. The lack of adequate community consultation in the face of imminent development and new ownership at Turtle Bay Resort has left residents without a voice in the future of their community. Outdated Agreements: The 1986 UA, the 1986 SMA, and the 2013 SEIS are inadequate and do not reflect modern realities, such as the impacts of rising sea levels, increased coastal erosion, and the need for endangered species habitat protection. These documents must be revisited to address these urgent issues and comply with current environmental law standards. Environmental and Cultural Protection: Kahuku Point is a vital coastal habitat home to numerous endangered species and sacred burial sites (iwi kūpuna) that a development of this magnitude will significantly impact. These sensitive areas should be respected and preserved. Traffic and Safety Concerns: Increased development without updated traffic mitigation strategies exacerbates already critical congestion and safety risks for residents and visitors alike. Affordable housing and Community Impacts: This development is predominantly designed for a wealthier clientele, promoting gentrification to our unique rural and cultural community. Moreover, it will place additional strain on our already overburdened emergency response, healthcare facilities, public education systems, and other essential community resources, further intensifying the challenges posed by a significant population increase. The cumulative impacts of adding 100 luxury resort residential units, 625 hotel and/or condotel units, over 500 employees, and the potential for approximately 3,000 people daily to the area must not be ignored. Sign to Protect Turtle Bay! For more information and to keep in touch, please visit https://bit.ly/3Z9aNN7 and https://linktr.ee/kupaakuilima Report a policy violationKūpaʻa KuilimaPetition StarterMedia inquiries116 people signed this weekSign petition18,191Verified signaturesThe Decision MakersVal OkimotoHonolulu City/County Council - District 8No response (notified 96 days ago)Email decision makerTyler Dos Santos-TamHonolulu City/County Council - District 6No response (notified 96 days ago)Email decision makerTommy WatersHonolulu City/County Council - District 4No response (notified 96 days ago)Email decision makerView 9 moreThe SupportersFeatured CommentsMatthew, Honolulu3 months agoThis area is one of the last natural spaces in the moku. It is the aina that my daughter is named after, Kalaeokaunaoa. If this project moves forward she will never be able to experience the mana of her namesake. Stop selling our culturally important spaces. No matter how responsible the landowners claim they will be it will forever scar the unique environments and sacredness of this wahi pana. Families also rely on quiet access to practice their traditional fishing and to feed their families. Enough development.Show full textKamaluonalani, Kaneohe3 months agoI feel the need to protect the community voice by signing this petition. I hear my voice in this matter & it quivers for just resolution to the impact & damage this project can bring. Construction can bring forth damage by eradicating the natural home of animals/inscets & humans alike. The convenience of the community is totally ignored by wanting to solely invest & profit over said communities voice & feelings. I feel that restructure to the planning & development of this project with the community involved, is at utmost importance stepping forward.Show full textchris, Honolulu1 month agoThis is a sacred place that shouldn’t be destroyed to enrich people on the Mainland. There are traffic concerns, endangered species, and several other problems I have with this development. Anyone who has spent time in this special place knows that this area should be protected and cherished for future generations. I’m from Utah now living in Hawaii and it’s an embarrassment to see the lack of respect the developers have for the local people and plants/animals here. It’s important, now more than ever, to respect the land.Show full textView all commentsFeatured Videos23Sign and share why you care!Share this petitionShare this petition in person or use the QR code for your own material.Download QR CodePetition created on November 25, 2024Change.orgPublic SafetyCommunity Petition To Pause Development at Turtle Bay"
