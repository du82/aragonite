description = """
I am a resident of White City, living adjacent to Big Bear Park—a green space cherished by our community. However, our peace is being threatened by Mayor Paulina Flint and majority of the White City Council and their pursuit of building a Civic Center in the park. The proposed construction of a Civic Center threatens to destroy the tranquility and natural beauty of our park.
For many of us, Big Be"""
full_description = '''Stop the Construction of a Civic Center in Big Bear Park #SaveBigBearParkStop the Construction of a Civic Center in Big Bear Park #SaveBigBearParkRecent signersKrystyn Roper•11 hours agoDelta Kuhn•15 hours agoDestiny Mendoza•17 hours agoElijah Havens•21 hours agojeanet salazar•23 hours agoAllierose Hussain-Wong•1 day agoCourtney Orlich•1 day agoAshley Ayala•1 day agoEddie Ellis•2 days agoSophia Licea•2 days agoLisandra Andrade•2 days agoMichelle Crenshaw•2 days agoDaniel Love•2 days agoHanny Olmos•2 days agoRobin Flatt-Homa•2 days agoKeilly Reyes•2 days agoJuan Mendoza•2 days agokaleb williams•2 days agoJessica Deleon•2 days agoLogan Hancock•3 days agoKrystyn Roper and 19 others have signed recently.Decision Makers: Paulina Flint +2The IssueI am a resident of White City, living adjacent to Big Bear Park—a green space cherished by our community. However, our peace is being threatened by Mayor Paulina Flint and majority of the White City Council and their pursuit of building a Civic Center in the park. The proposed construction of a Civic Center threatens to destroy the tranquility and natural beauty of our park. For many of us, Big Bear Park is not just an open space. It's a sanctuary that allows us to escape from the urban chaos, a place for our kids to play freely, and a habitat for the local wildlife. Constructing a Civic Center, along with a parking lot, will cause irreversible damage to this cherished public space. A study by the National Recreation and Park Association affirms that parks contribute to a community’s health and wellbeing. To reiterate the importance of our parks, an important document to reference is the 2022 General Plan of White City. In this document, created just 2 years ago, the following insight is included and is still very relevant to today and shows how the councils idea of a Civic Center in Big Bear Park goes against recent community wants and needs. “In response to "How important are the following?" 61 respondents (83.6 percent of respondents) ranked "Protecting and valuing natural resources, such as the parks and trails" as "very important." - Area Needs and Priorities Survey, November 2020.” on page 44 “When asked, "Please describe places/features of White City that you like, and think should be preserved, the top theme in the written responses was parks, trails, and walking paths. 24 of the 53 responses mentioned this theme - Land and Character Survey, Summer 2020.” on page 42 Moreover, this project poses a financial burden on White City's residents. The city will likely need to increase taxes or redirect funds from other essential services, affecting current and future residents. Large public works projects tend to be fraught with unexpected costs, leaving taxpayers bearing the brunt of these extra expenses.This is not just a personal cause, it's a communal effort – because we love our park and our city. What we plead is simple: stop the construction of a Civic Center in Big Bear Park. Save our park, save our peace. We invite everyone who believes in preserving the character and natural beauty of our city to sign this petition. Together, let's remind our city officials that parks are for people, not buildings.In addition to stopping construction of any building or parking lot in the park, we also ask for the following: A Master Plan for Big Bear Park (10-30 years) to be created WITH community participation before suggesting any further changes or ideas to the park Re-zone Big Bear Park so that the park and its community purpose and integrity can be preserved from ideas such as this Civic Center that don't keep the true purpose of the park as a recreational area Prioritize better communication and community outreach with residents including emails, mail, and text notifications and quarterly postcards (info to be included would be council meeting dates, planning commission dates, community surveys, community events and other important information) Important note: after you sign the petition, the next page will give you the option to add a comment. Please add a comment with your White City address or the street you live on so we are aware of all signers who are residents of White City. You are also welcome to voice your thoughts in the comment section as well, since I know many residents want their voices to be heard by the mayor and council members. Report a policy violationClaire DawsonPetition StarterMedia inquiriesSign petition1,867Verified signaturesKrystyn Roper•11 hours agoDelta Kuhn•15 hours agoDestiny Mendoza•17 hours agoElijah Havens•21 hours agojeanet salazar•23 hours agoAllierose Hussain-Wong•1 day agoCourtney Orlich•1 day agoAshley Ayala•1 day agoEddie Ellis•2 days agoSophia Licea•2 days agoLisandra Andrade•2 days agoMichelle Crenshaw•2 days agoDaniel Love•2 days agoHanny Olmos•2 days agoRobin Flatt-Homa•2 days agoKeilly Reyes•2 days agoJuan Mendoza•2 days agokaleb williams•2 days agoJessica Deleon•2 days agoLogan Hancock•3 days agoKrystyn Roper and 19 others have signed recently.Decision Makers: Paulina Flint +2The IssueI am a resident of White City, living adjacent to Big Bear Park—a green space cherished by our community. However, our peace is being threatened by Mayor Paulina Flint and majority of the White City Council and their pursuit of building a Civic Center in the park. The proposed construction of a Civic Center threatens to destroy the tranquility and natural beauty of our park. For many of us, Big Bear Park is not just an open space. It's a sanctuary that allows us to escape from the urban chaos, a place for our kids to play freely, and a habitat for the local wildlife. Constructing a Civic Center, along with a parking lot, will cause irreversible damage to this cherished public space. A study by the National Recreation and Park Association affirms that parks contribute to a community’s health and wellbeing. To reiterate the importance of our parks, an important document to reference is the 2022 General Plan