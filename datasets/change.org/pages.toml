title = "Petition · Implement Mandatory Seasonal Slowdowns for Commercial Ships in Whale Zones - United States · Change.org"
description = "We, members of the Meadowcreek Cosmobots Robotics Team, who care deeply about the health of our marine environment, discovered the distressing fact that ocean noise is one of the largest threats to marine life, particularly to whales. What alarmed us most was knowing that commercial ships are the largest contributors to ocean noise. Motivated by our desire to make a difference, we decided to start"
full_description = "Implement Mandatory Seasonal Slowdowns for Commercial Ships in Whale ZonesImplement Mandatory Seasonal Slowdowns for Commercial Ships in Whale ZonesRecent signersAMELIA SHAWLEY•19 minutes agoRukiye Sen•30 minutes agoTara Boeck•32 minutes agoMayely Daza•3 hours agoalice rogers•5 hours agoHillary Bailey•7 hours agoClaudia Molina•8 hours agoObe Game•8 hours agoKaitlynn Smith•8 hours agoMaggie Shin•9 hours agoMaricela Olea•11 hours agoWendi Trainor•11 hours agoChristina Pulido•12 hours agoPauline Poquiz•12 hours agoCole Wester•12 hours agoryan huff•13 hours agoVeronica Rugullies•14 hours agoPeter Sukowski•14 hours agoKathy Bowman•16 hours agoDestiny Mendoza•17 hours agoAMELIA SHAWLEY and 19 others have signed recently.Decision Makers: Arsenio Dominguez +22 UpdatesThe IssueWe, members of the Meadowcreek Cosmobots Robotics Team, who care deeply about the health of our marine environment, discovered the distressing fact that ocean noise is one of the largest threats to marine life, particularly to whales. What alarmed us most was knowing that commercial ships are the largest contributors to ocean noise. Motivated by our desire to make a difference, we decided to start this petition.Human-generated ocean noise is a serious concern for marine life. According to a study by Clark et al., in 2009, this noise interferes with the ability of marine mammals like whales to communicate, find food, and navigate. Unabated, it may even lead to significant population decreases.Despite these grave consequences, there is a way to mitigate the impact. Reducing ship speeds in regions known to house whales have been shown to decrease noise levels significantly. Larson et al.'s (2016) study also found that such ship slow-downs have minimal impact on shipping profitability. Moreover, several companies have already participated in voluntary slow-downs, demonstrating the feasibility of this approach.Thus, our proposition is simple yet powerful: require mandatory seasonal slow-downs in regions inhabited by whales, reducing noise pollution and mitigating harm to the affected marine species. We believe it's a win-win situation! So, we call upon legislators and shipping companies to implement this rule. It’s time to strike a balance between marine life preservation and commercial activities. Please sign this petition and help us urge the decision-makers to make a positive change.Report a policy violationJane WysockiPetition StarterMedia inquiriesSign petition36,973Verified signaturesAMELIA SHAWLEY•19 minutes agoRukiye Sen•30 minutes agoTara Boeck•32 minutes agoMayely Daza•3 hours agoalice rogers•5 hours agoHillary Bailey•7 hours agoClaudia Molina•8 hours agoObe Game•8 hours agoKaitlynn Smith•8 hours agoMaggie Shin•9 hours agoMaricela Olea•11 hours agoWendi Trainor•11 hours agoChristina Pulido•12 hours agoPauline Poquiz•12 hours agoCole Wester•12 hours agoryan huff•13 hours agoVeronica Rugullies•14 hours agoPeter Sukowski•14 hours agoKathy Bowman•16 hours agoDestiny Mendoza•17 hours agoAMELIA SHAWLEY and 19 others have signed recently.Decision Makers: Arsenio Dominguez +22 UpdatesThe IssueWe, members of the Meadowcreek Cosmobots Robotics Team, who care deeply about the health of our marine environment, discovered the distressing fact that ocean noise is one of the largest threats to marine life, particularly to whales. What alarmed us most was knowing that commercial ships are the largest contributors to ocean noise. Motivated by our desire to make a difference, we decided to start this petition.Human-generated ocean noise is a serious concern for marine life. According to a study by Clark et al., in 2009, this noise interferes with the ability of marine mammals like whales to communicate, find food, and navigate. Unabated, it may even lead to significant population decreases.Despite these grave consequences, there is a way to mitigate the impact. Reducing ship speeds in regions known to house whales have been shown to decrease noise levels significantly. Larson et al.'s (2016) study also found that such ship slow-downs have minimal impact on shipping profitability. Moreover, several companies have already participated in voluntary slow-downs, demonstrating the feasibility of this approach.Thus, our proposition is simple yet powerful: require mandatory seasonal slow-downs in regions inhabited by whales, reducing noise pollution and mitigating harm to the affected marine species. We believe it's a win-win situation! So, we call upon legislators and shipping companies to implement this rule. It’s time to strike a balance between marine life preservation and commercial activities. Please sign this petition and help us urge the decision-makers to make a positive change.Report a policy violationJane WysockiPetition StarterMedia inquiries69 people signed todaySign petition36,973Verified signaturesThe Decision MakersArsenio DominguezSecretary-General, International Maritime Organization (IMO)No response Rachel AronsonQuiet Sound Program DirectorNo response Richard W. Spinrad, Ph.D.National Oceanic and Atmospheric AdministrationNo response The SupportersFeatured CommentsValmore, Springfield2 weeks agoI live on my sailboat in Puget Sound, WA, and it is noisy, even for a human. Although recreational boats are restricted from approaching Southern Resident Orca whales within 1000 feet by law, there is no such restriction for commercial traffic. It's time there was!Ranie, Boynton1 month agoThere is a biodiversity crisis in our world. The U.S. is the only country in the world that has not yet ratified the 1992 treaty that established the United Nations Convention on Biodiversity.dano, Los Angeles2 months agoWhales need protection from ships and discarded fishing nets!View all commentsFeatured Videos238741Sign and share why you care!Share this petitionShare this petition in person or use the QR code for your own material.Download QR CodePetition created on December 4, 2024Change.orgSave the whalesImplement Mandatory Seasonal Slowdowns for Commercial Ships in Whale Zones"
