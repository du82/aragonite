Bay #ProtectKahukuLewa November 26, 2024Community Petition To Pause Development at Turtle BayLetter Writing Toolkit is Live!To our supporters: Mahalo nui loa for signing and sharing our petition! If you love a place, you fight to protect it, and that's just what we are doing! Arete does not yet have their permits issued, so the time to act is now! 🚨 Make your voices heard! 📣 Access the KŪPA’A KUILIMA Letter Writing Toolkit ✉️ @ linktr.ee/kupaakuilima - The Toolkit Includes: Template for Organizations, Template for Individuals, Tips, Emails, Addresses 🌊🌊🌊 Remember to: ✅️ Share the petition: change.org/protectturtlebay ✅️ Send your letter of support and learn more: linktr.ee/kupaakuilima✅️ Follow Kūpa’a Kuilima: IG @kupaakuilima and FacebookDecember 4, 2024Show moreVictories in Affordable HousingVictoryProtect North Glendale from a Dangerous Development!3,155 signaturesVictory8902 Quail Rd Annexation - Stop this Development!666 signaturesVictoryOppose the Rezoning of Pullman, WA Property to Heavy Industrial for Biodiesel Plant7,427 signaturesVictoryProtect Sunshine Meadows at the Ag Reserve (Hyder-West Property)3,781 signaturesShow more1. Start your petitionWe’ll help you build a campaign that gets noticed.2. Gather SupportEngage a large community of people who care about your cause.3. Reach those in powerInfluence decision-makers in government, companies, and other institutions to make real change.Don’t see your cause here yet? Make your voice heard!Start a petitionHomeTopicAffordable HousingHomeTopicAffordable Housing"
