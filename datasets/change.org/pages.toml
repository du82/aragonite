full_description = "Fix the NYC Schools Calendar: No School on Monday Before Christmas!Fix the NYC Schools Calendar: No School on Monday Before Christmas!1 Update10 Media MentionsThe IssueMy name is Isaac and I'm a 7th grader in Brooklyn, New York. I love to think about calendars and I noticed a problem: Winter Break is scheduled to start on Tuesday, December 24, 2024, which means we will have a one-day week before the break. This doesn’t make sense. Attendance will be very low that day. Kids whose families have travel plans will have to change their plans or be marked absent. Kids and teachers will feel annoyed, and kids won’t get to learn anything or have a party with all of their friends (because of the low attendance).I know that if Chancellor David Banks drops a school day, he has to add one somewhere else. My suggestion is to move the last day of school from Thursday, June 26 to Friday, June 27. I know it’s not an easy job with so many holidays on the school calendar. (I have them memorized.) But I hope it’s not too late to avoid a silly one-day week.Chancellor Banks, please fix the calendar!Report a policy violationIsaac RegnierPetition StarterMedia inquiriesVictoryThis petition made change with 23,017 supporters!Share this petition1 Update10 Media MentionsThe IssueMy name is Isaac and I'm a 7th grader in Brooklyn, New York. I love to think about calendars and I noticed a problem: Winter Break is scheduled to start on Tuesday, December 24, 2024, which means we will have a one-day week before the break. This doesn’t make sense. Attendance will be very low that day. Kids whose families have travel plans will have to change their plans or be marked absent. Kids and teachers will feel annoyed, and kids won’t get to learn anything or have a party with all of their friends (because of the low attendance).I know that if Chancellor David Banks drops a school day, he has to add one somewhere else. My suggestion is to move the last day of school from Thursday, June 26 to Friday, June 27. I know it’s not an easy job with so many holidays on the school calendar. (I have them memorized.) But I hope it’s not too late to avoid a silly one-day week.Chancellor Banks, please fix the calendar!Report a policy violationIsaac RegnierPetition StarterMedia inquiriesShare this petitionVictoryThis petition made change with 23,017 supporters!Share this petitionThe SupportersFeatured CommentsShamika, Valley Stream6 months agoI am signing this petition because I believe that student learning not only takes place in the classroom, but also in their communities and with their families. The memories that children have around the holidays shape the people that they become. Let children enjoy family time and teachers as well.Amy, Brooklyn5 months agoWe have 181 teaching days. That is ONE TOO MANY!! Utilize remote if necessary. Save the city million of dollars, cut down pollution with thousands of less cars and buses on the roads. Help with grid lock at the end of the school day!Ava, Queens9 months agothis very sigma so i dont have to wait to open present on 24View all commentsFeatured Videos1310Sign and share why you care!Share this petitionShare this petition in person or use the QR code for your own material.Download QR CodePetition created on May 18, 2024Change.orgEducationFix the NYC Schools Calendar: No School on Monday Before Christmas!"
