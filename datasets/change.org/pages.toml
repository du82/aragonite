description = "Change.org gives a voice to people around the world seeking change. This support is possible thanks to people who power petitions and Change.org members."
full_description = "Business ModelAboutImpactCareersTeam Change.org is proudly people powered Change.org exists to empower people everywhere to create the change you want to see. In order for the platform to remain free, independent, and accessible to everyone, people like you power the petitions and the platform to help create change. There are two ways people like you support the work we do. Power specific petitions People use Change.org to campaign about the most pressing issues in their lives and communities. You can chip in to help petition starters find supporters, by paying to promote their petitions as advertisements to a wider audience on Change.org. Power the platform You can become a Member to help more people around the world win their campaigns, financially supporting the expert coaching, media support and free technology that sees ordinary people win their campaigns every day. Change.org is a Public Benefit Corporation overseen by a nonprofit governing board — The Change.org Foundation — which also oversees Change.org Programs, the charitable activities of the Foundation. This hybrid structure enables us to combine the ambition and growth trajectory of a tech company with the mission-focused stewardship of a nonprofit. This structure also makes Change.org the world’s largest nonprofit-owned tech platform for social change."
