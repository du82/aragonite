tize better communication and community outreach with residents including emails, mail, and text notifications and quarterly postcards (info to be included would be council meeting dates, planning commission dates, community surveys, community events and other important information) Important note: after you sign the petition, the next page will give you the option to add a comment. Please add a comment with your White City address or the street you live on so we are aware of all signers who are residents of White City. You are also welcome to voice your thoughts in the comment section as well, since I know many residents want their voices to be heard by the mayor and council members. Report a policy violationClaire DawsonPetition StarterMedia inquiries55 people signed this weekSign petition1,867Verified signaturesThe Decision MakersPaulina FlintWhite City CouncilNo response (notified 68 days ago)Email decision makerPhillip CardenazFormer White City CouncilNo response (notified 68 days ago)Email decision makerWhite City CouncilNo response The SupportersFeatured CommentsJohn, Sandy2 months agoMy Mom currently lives on Poppy Lane boarding the Northwest corner of the park It sounds like they are considering building the civic center right behind her house, yet she has never been spoken to about this proposal and how it would drastically affect her home and privacy. She is one of the original residents of White City and has seen the blessing Bear Park has been for her children, grandchildren and great grandchildren, not to mention all the countless families she has witnessed enjoying the park over the 60+ years she has lived there. There is nothing comparable to this park in the area for all the new young families that have moved in and it would be a tragedy to take this wonderful place away from them.Show full textStephen, Riverton2 months agoI am not a current resident of White City, but that is my childhood home. This park (the only one in White City) is a symbol of the community and to deface it in an attempt to "revitalize" White City or to bring in some amount of traffic to fight Sandy City is ridiculous. They just finished spending a ton of money on the new WCW building and it's just to make people feel important. Give the kids what they need, a playground and some grass to run on.Show full textDeborah, Salt Lake City2 months agoThe park should not be touched. My property boarders the park and I see it all day long. I see the kids playing sports, the families picnicking, and people walking their dogs. Nothing should be changed in the park. It is highly used as is and an anchor of this neighborhood.View all commentsFeatured Videos1Sign and share why you care!Share this petitionShare this petition in person or use the QR code for your own material.Download QR CodePetition created on December 19, 2024Change.orgAnimal WelfareStop the Construction of a Civic Center in Big Bear Park #SaveBigBearPark'''
