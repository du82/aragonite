title = "Popular Petitions to Sign · Change.org"
full_description = '''Discover petitions to signFeaturedPopularRecentVictoriesVictory!Fix the NYC Schools Calendar: No School on Monday Before Christmas!Thanks to Issac's petition and 23K signers, NYC students will not go to school for a one-day week on Monday, Dec. 23. Mayor Eric Adams delivered the news directly to Issac – on speaker phone in front of his entire class. Isaac RegnierUnited States23,0175/18/24Victory!FDA, Approve Life-Saving Nasal Epinephrine for Anaphylactic EmergenciesDave, the father of a child with severe food allergies, led a petition to introduce an alternative to the EpiPen – a device that can spark fear and cause hesitation. With a nasal spray now approved by the FDA, Dave hopes more lives will be saved. Dave BloomNew York, NY, United States40,5619/29/23Victory!Get Amazon to Offer Plastic-Free Packaging OptionsAmazon will stop using puffy plastic shipping pillows in North America, marking a huge victory for the nearly 800,000 people who supported a petition calling for this change.Nicole DelmaSag Harbor, NY, United States784,67910/20/19Victory!Reinstate Empathy and Anti-Bullying Assembly at Mountain View Middle SchoolAfter a PA school board canceled an assembly because of the presenter's "lifestyle," parents, students, and community members fought back. Thanks to their efforts, Pancholy's assembly is back on. Trisha ComstockCamp Hill, PA, United States9,7494/15/24Victory!Release Virgilio Aguilar Mendez immediately!Virgilio Aguilar Mendez was falsely charged with murder after a police officer died of a heart attack minutes after an unprompted, aggressive encounter. This petition helped drive viral attention to Virgilio's case, and all charges have been dropped. Mariana BlancoLake Worth, FL, United States610,9601/3/24Victory!Install Emergency Blue Lights on University of Georgia's CampusAfter the tragic death of a young woman on the University of Georgia's campus, nearly 26K students and supporters pushed for emergency blue lights. In just 5 days, they convinced UGA to overhaul campus security. UGA StudentAthens, GA, United States25,9692/22/24Victory!Have “Sweet Victory” Performed at the Super BowlAfter beloved Sponge Bob creator Stephen Hillenburg passed away, over 1.2 million fans signed a petition for a 'Sweet Victory' performance at the Super Bowl in his honor. Six years later, fans got their wish.Isreal ColungaPortland, OR, United States1,233,47711/27/18Victory!South Korean Government: Please stop the consumption of dogs and cats in South Korea!There have been over 4 million signatures across 50 Change.org petitions calling for an end to the dog meat trade in South Korea. After 12 years of campaigning, South Korea's parliament banned the practice.KoreanDogs​.​org TeamSunnyvale, CA, United States263,65911/6/11Victory!Demand UPS provide Air Conditioning to all driversFive years and 1.3 million signatures later, Theresa’s petition to get A/C in UPS delivery trucks won. The Teamsters officially ratified a contract with historic heat protections. Theresa's petition is now one of the biggest victories in Change.org's history.Theresa KlenkManahawkin, NJ, United States1,352,2497/10/18Victory!Remove Islamic Republic of Iran from the UN's Commission of Status on WomenThe UN voted to remove Iran from the commission because of their treatment of women in their country. The US ambassador said this sends "a strong message from the United Nations that we will support the women of Iran."Mahshid BozorgniaUnited States43,81610/4/22Load more'''
