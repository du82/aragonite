["https://change.org/l/us/how-to-write-a-petition-letter"]
title = "How to write a petition letter: A comprehensive guide · Change.org"
description = "A petition letter is used to make a request to an authority, such as a court or a university.  Sometimes the terms petition and petition letter are used interchangeably because…"
full_description = "NewsGuidesShare this postShare this postfacebooktwitteremailStart a petitionGuidesHow to write a petition letter: A comprehensive guideSep 12, 2024Photo by Luke Witter on Unsplash Let’s say you’ve put in the time and effort to craft a thoughtful petition to raise awareness and make change for an important cause. You’ve earned strong support from members of the community who’ve signed the petition. But, you still haven’t heard from anyone in a position to address your requests and concerns. This can be a sticking point for a variety of cases. For example, someone could start a petition because they’ve witnessed police brutality and corruption in their community. The petition might have thousands of signatures but hasn’t been recognized by any decision makers, like the police chief, mayor, or district attorney. Or, in an attempt to shut down a local gas plant that uses fracking, a community member could start a petition. It could have a ton of community support but no response from city officials. Or, maybe a group of employees team up to demand stronger DEI initiatives at the large corporation they work for, but they’re not able to connect with the executives in power. In these scenarios, many petitioners have raised their voices and are waiting for them to be heard and considered. The next step to making this happen is to write and send a petition letter. In this guide, learn how petition letters are a powerful tool to get meaningful results for social causes and how to write them. → Start your petition today on Change.org What is a petition letter? A petition letter is a formal written request to an official decision maker, such as a lawmaker, university president, or corporate leader. While petitions are designed to gather widespread public support for a specific cause, petition letters are a direct appeal to those in power. The letter is a way to put the petition on the decision maker’s radar, clearly communicating the requested action and the importance of the issue. The letter can be a traditional one sent through the mail or an email. What you need to prepare and confirm in advance For your best chances at getting decision makers to take action in a timely manner, make sure you have all the accurate information and supporting materials you need. Here’s what you should verify before reaching out about your petition: A credible, compelling, and thorough petition The purpose of the letter is to make decision makers aware of your petition and respond to its call to action, so it needs to have reliable information and supporting details. Make sure the petition is well researched and fact-checked with the most recent and relevant data. Include personal experiences and stories of how you or others in the community have been affected by the issue. These elements will demonstrate the impact of the issue and that your petition is trustworthy. Support for the petition Proving support for your petition is essential for influencing decision makers. The amount of signatures you need depends on factors like the purpose and location of the petition. So, the signatures needed to nominate a candidate for office or to add a ballot measure in an election would be a certain number of registered voters in that area or district. If the petition is to an employer, you would likely need a majority of employees to sign the petition. If the petition is to the leadership of a school, you would need a significant number of signatures from students, parents, or faculty, depending on who it concerns. If you need to grow support for your petition, here are some tactics to try: Unless a paper petition is required, create an online petition on Change.org to make your petition accessible to a wider audience. Use petition updates to ask your supporters to share the petition with potential supporters. Share your petition on your active social media channels, ask supporters to share on theirs, and partner with public figures or community members with large followings to post about your petition on their channels. Pitch yourself as a podcast guest on relevant podcasts to discuss the issue your petition addresses. Reach out to news and other media outlets to cover your petition and the overall movement behind it. Identify the relevant decision makers Determine the right person or people who have the authority to implement the change you’re seeking before you even start your petition. These will be the decision makers who you address in the petition itself and the letter about the petition. Align the decision maker with the specific action you’re requesting and find out which department or organization they work in. For example, regarding a criminal case or appeal in your county or state, the decision maker would be the district attorney. If you’re advocating for environmental policies, the relevant decision maker might be the head of your state’s environmental protection agency or a specific legislative committee. To push for improved working conditions in a private company, the decision maker could be the CEO or the head of human resources. A refugee advocacy group presenting their petition in Germany. Photo by Wir packen’s an e.V. on Flickr. Best practices for writing a successful petition letter Once you’ve launched your petition, gained signatures, and identified the appropriate decision makers, it’s time to write the outreach letter. By creating the petition, the legwork for the letter is already done and it’s just a matter of articulately summarizing it. Follow these steps to crafting a letter that communicates your cause and requests in a clear and persuasive way. 1. Address the decision maker: Confirm you have the decision maker’s right title, name, and contact information for the letter’s address and greeting. 2. Introduce yourself and the issue: Begin by introducing yourself, your role as the petition starter, and your relation to the issue. Provide background information and details about the issue, and explain why it’s important and pressing. Include any relevant data, examples, or news that supports your case. 3. Clearly state your request: Present the specific action you’re requesting from the decision maker. Explain how the action solves the problem, and provide a proposed plan for implementation based on your research. 4. Call out any striking stories or experiences from the petition: Add context, depth, and strengthen the impact of your letter by sharing the struggles, conflict, or injustices you or the community has directly experienced. 5. Anticipate and address potential challenges: Show that you’ve considered the decision maker’s perspective and potential objections. Acknowledge challenges or concerns they may have about taking the requested action, and present thoughtful, evidence-based responses to alleviate those concerns. 6. Use clear and concise language: Avoid any vague or unnecessary language in the letter. Include all the valuable details that support your case, but get to the point and be clear about what you’re asking so it’s not confusing or ambiguous. Petition letter examples Take a look at what petition letters look like in practice. These are successful examples because they have the following elements of communicating effectively and presenting a strong case: Demonstrated support for the petition Clear requests for proposed next steps or actions to be taken from the decision maker Examples or stories of how the issue has affected the petition organizer or their community to humanize and personalize it Addresses any potential challenges or objections to the petition’s request Clear, straightforward, and concise language School cell phone policy letter example Dear [Principal’s Name], My name is [Your Name], and I am reaching out as the organizer of a petition that has gathered [# of signatures] signatures from concerned students, parents, and community members regarding the new cell phone policy at [School Name]. As outlined in the petition, we respectfully request that the school administration revise the cell phone policy to permit students to use their phones during designated times, such as lunch breaks or in between classes, while ensuring strict guidelines are in place to prevent disruptions during instructional periods. We understand the intent of the current policy is to minimize distractions and foster a productive learning environment. But parents like myself and students fear it may inadvertently compromise student safety during emergencies when immediate communication with parents or authorities could be critical. To address this concern, we recommend developing a system where phones remain accessible but are used under controlled conditions, ensuring both safety and order. To address any concerns about a more flexible policy, we suggest incorporating teacher and student feedback in shaping clear, enforceable rules and providing training for staff on managing phone-related issues effectively. The petition’s overwhelming support reflects the community’s strong interest in finding a balanced solution that prioritizes both education and safety. I am available to discuss this matter further at your convenience and would welcome the opportunity to collaborate on potential revisions to the policy. Thank you for your time and consideration. Sincerely,[Your Full Name] Public housing accessibility letter example Dear [Director of Housing Authority], My name is [Your Name], and I am writing as the organizer of a petition that has gathered over [# of signatures] signatures from residents, advocates, and community members urging [City/County Name] Housing Authority to take immediate steps to improve accessibility in public housing units for people with disabilities. Many residents, including [specific example: myself/my family/a neighbor like Maria who uses a wheelchair], struggle to navigate their homes safely due to narrow doorways, lack of ramps, and inaccessible bathrooms. Maria, for example, has to rely on others to carry her up the steps to her apartment—a degrading and unsafe situation that highlights the urgent need for action. We respectfully request that the Housing Authority allocate a portion of its budget toward retrofitting existing units to meet ADA standards and prioritize accessibility in future developments. Additionally, we recommend conducting an accessibility audit in partnership with local disability advocacy groups to identify and address the most urgent needs. We understand that budget constraints may be cited as a challenge to implementing these changes. To address this, we suggest exploring federal grants and state funding programs specifically aimed at improving housing accessibility. Partnerships with nonprofit organizations could also help offset costs while ensuring community involvement in the process. The overwhelming support for this petition demonstrates our community’s desire to create equitable living conditions for all residents. I would greatly appreciate the opportunity to meet with you to discuss next steps and collaborate on actionable solutions. Thank you for your time and attention to this critical issue. Sincerely,[Your Full Name] Environmental policy letter example Dear [Mayor or City Council Member], My name is [Your Name], and I am reaching out as the organizer of a petition signed by over [# of signatures] community members calling for stronger measures to reduce single-use plastics in [City/County Name]. Plastic pollution has had a visible and devastating impact on our community. [Example: Local parks and waterways, such as [specific river or beach], are often littered with plastic waste, endangering wildlife and diminishing the natural beauty that so many residents cherish.] Personally, as someone who volunteers in cleanup efforts, I have seen firsthand how these plastics persist despite our best efforts. We respectfully request that the city adopt an ordinance banning single-use plastic bags and utensils, similar to successful policies in [example city/state]. We also recommend expanding access to recycling programs and providing incentives for businesses that transition to reusable or compostable alternatives. We understand that businesses may express concerns about the cost of transitioning away from single-use plastics. To address this, we suggest offering a grace period for compliance and introducing subsidies or tax incentives to support small businesses during the transition. Local environmental organizations could also assist by hosting workshops on sustainable practices. The strong support behind this petition reflects our community’s commitment to protecting our environment and future generations. I would welcome the chance to discuss these proposals further and collaborate with you on implementing meaningful change. Thank you for your time and consideration. Sincerely,[Your Full Name] Use Change.org as your petition hub Change.org is a platform where millions of people come together to create, support, and amplify petitions that drive real change. By using Change.org, petition starters can gather public support while also housing all their facts, updates, and data about the issue the petition focuses on. It’s also a place for supporters to share how they’ve been impacted by the issue, which can be used for letters to persuade decision makers. Start your petition today on Change.org"
