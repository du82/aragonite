full_description = '''Firefighters demand restored access to critical detox treatmentFirefighters demand restored access to critical detox treatmentRecent signersNona Reynolds•2 hours agoSpencer Andreis•2 hours agoBill Adams•4 hours agoStephen Cary•4 hours agoAdriana Harrison•4 hours agobeth wright•7 hours agoTerry Gragg•8 hours agoAmanda Boland•8 hours agoMaggie Shin•9 hours agoTalay Ratsythong•10 hours agoSharon McKinney•10 hours agoChris Johnson•11 hours agoChristina Pulido•12 hours agoHolly MSN RN•12 hours agoAna Garcia•13 hours agoShari Hickman•13 hours agoSharon Hancock•13 hours agoChris D’Andrea•13 hours agoJana Boccalon•13 hours agoemma petez•14 hours agoNona Reynolds and 19 others have signed recently.Decision Maker: California State Board of Pharmacy2 UpdatesThe IssueOn March 6, the California State Board of Pharmacy (BOP) is expected to pass a set of regulations that would make it virtually impossible for firefighters to access glutathione – a critical breathing treatment – just as many of us need it the most. "Glutathione has the potential to be an absolute game-changer for firefighters across the country. It's confusing to me to me that it's so difficult to access this. I hope we can find a solution where glutathione becomes as common as washing a firefighter's turnouts after a fire." - Fire Captain David Marquez, Pasadena Firefighters Local 809; first responder on the Jan. 2025 Eaton Fire; petition author Glutathione is an antioxidant made in the liver and lungs. Environmental medicine doctors who treat firefighters report that just one month of inhalable glutathione treatment can reduce or even eliminate respiratory symptoms associated with long-term occupational exposure to smoke. (Links to glutathione research and preliminary data from the glutathione-centric Firefighter Detox Pilot Program being conducted in Sonoma County can be found here.) Many of us who got sick from working the Eaton and Palisades Fires have had the opportunity to nebulize glutathione with environmental doctors who deployed to our base camps and fire stations. Firefighters nebulize glutathione at the Rose Bowl; Eaton Fire 2025 The treatment has helped with our acute exposures. Our coughs subsided. The pain in our chests lessened. It works and we're grateful for that. But intermittent treatment under doctor supervision does not address the deeper, chronic exposures we face in the course of a career. We need longer-term, at-home glutathione treatment, but we can’t get it in California. Doctors can legally write a prescription for nebulized glutathione, but no pharmacist in the U.S. will compound it for California patients because, since 2020, the California BOP has unfairly regulated and disciplined pharmacists who do so. The last batch of nebulized glutathione ever dispensed in California was in June 2023, for a Firefighter Lung Detox Clinic in Sonoma County. Those firefighters have been without treatment ever since. The BOP's behavior is baffling and unjust and, as a result, patients – firefighters – are needlessly suffering. Glutathione is safe, legal, and allowable by the FDA – and it’s available in 49 other states. California is the outlier."The breathing treatment I had today has really helped out within the first half hour after I had it. I've seen a lot of firefighters affected by cancer... I've seen the suffering they go through. This will prevent a lot of suffering."- Fire Capt. Eric Nakamaru, Member, United Firefighters of Los Angeles City, Local 112; first responder on the Palisades Fire The March 6 BOP meeting is our last chance to block new regulations that would make it even harder for us to regain access to this potentially life-saving treatment. WHAT CAN YOU DO? 1. Sign and share this petition. If you can, please add a comment with your department or union. If you’ve experienced glutathione treatment (or would like to), include that as well. This petition will be presented to Board Members on Feb. 5 and – if their harmful regulations pass – we’ll take it to legislators too. 2. Make a public comment at the Feb. 5 meeting. The only reason the BOP didn’t pass an outright ban on glutathione years ago is because of firefighter resistance. Your voice is powerful. Make it heard. Call-in details and talking points are here. 3. Contact your labor leaders ASAP and tell them to ask California Professional Firefighters to get involved. CPF staff members have been monitoring the situation with the BOP since last summer. They’ve told us that CPF is willing to get involved but not until they hear from more unions. This is the moment! We can regain and retain access to this incredibly promising treatment, but only if we work fast and work together. Gold Ridge Fire Chief Shepley Schroth-Cary receives a glutathione IV at his station in Sonoma County; 2020 “A number of Fire Chiefs in Sonoma County have recognized the benefit of glutathione to remove carcinogens from our members as well as ourselves. We have invested in the use of glutathione providing nebulized glutathione as well as IV glutathione for a more intense detoxification. The results of the use of both have included a reduction in respiratory congestion and stopping chronic coughs, generally feeling better, and a measurable reduction in toxins found in our bodies. We have also been provided hope that we can invest in our health and prevent cancer. Our job regardless of preventative measures will and does expose us to toxins. We need resources to remove toxins from our bodies. Taking access away from us is cruel and unacceptable. As fires rage in southern California thousands of firefighters and millions of citizens are being inundated with toxins that are carcinogenic, increasing risk of cancer and many other health issues. Your decision will take an important tool away from us and other Californians when they need it most. “ Jan. 8, 2025 - Fire Chief Shepley Schroth-Cary (Gold Ridge Fire Protection District; participant in round 1 of Firefighter Detox Pilot Program; petition co-author) For more information, please contact Jacqui Jorgeson, founder and Executive Director of the Sonoma County-based nonprofit, the Volunteer Fire Foundation: Email: jacqui@volunteerfire.org; Phone: 707-708-4780 Petition co-authors: Fire Capt. Eric Nakamaru, Member, (United Firefighters of Los Angeles City, Local 112); first responder on the Palisades FireFire Capt. David Marquez (member of Pasadena Firefighters Local 809); Fire Chief Shepley Schroth-Cary (Gold Ridge Fire Protection District); Fire Chief/Battalion Chief Jason Jenkins (Cloverdale Fire/Santa Rosa Fire); Engineer Amanda Newhall (President of Healdsburg Local 2604); Fire Capt. Jason Campbell (Vice-President, Sonoma Valley Firefighters Local 3593); Jacqui Jorgeson (Volunteer Fire Foundation)Report a policy violationJacqui JorgesonPetition StarterMedia inquiriesSign petition2,854Verified signaturesNona Reynolds•2 hours agoSpencer Andreis•2 hours agoBill Adams•4 hours agoStephen Cary•4 hours agoAdriana Harrison•4 hours agobeth wright•7 hours agoTerry Gragg•8 hours agoAmanda Boland•8 hours agoMaggie Shin•9 hours agoTalay Ratsythong•10 hours agoSharon McKinney•10 hours agoChris Johnson•11 hours agoChristina Pulido•12 hours agoHolly MSN RN•12 hours agoAna Garcia•13 hours agoShari Hickman•13 hours agoSharon Hancock•13 hours agoChris D’Andrea•13 hours agoJana Boccalon•13 hours agoemma petez•14 hours agoNona Reynolds and 19 others have signed recently.Decision Maker: California State Board of Pharmacy2 UpdatesThe IssueOn March 6, the California State Board of Pharmacy (BOP) is expected to pass a set of regulations that would make it virtually impossible for firefighters to access glutathione – a critical breathing treatment – just as many of us need it the most. "Glutathione has the potential to be an absolute game-changer for firefighters across the country. It's confusing to me to me that it's so difficult to access this. I hope we can find a solution where glutathione becomes as common as washing a firefighter's turnouts after a fire." - Fire Captain David Marquez, Pasadena Firefighters Local 809; first responder on the Jan. 2025 Eaton Fire; petition author Glutathione is an antioxidant made in the liver and lungs. Environmental medicine doctors who treat firefighters report that just one month of inhalable glutathione treatment can reduce or even eliminate respiratory symptoms associated with long-term occupational exposure to smoke. (Links to glutathione research and preliminary data from the glutathione-centric Firefighter Detox Pilot Program being conducted in Sonoma County can be found here.) Many of us who got sick from working the Eaton and Palisades Fires have had the opportunity to nebulize glutathione with environmental doctors who deployed to our base camps and fire stations. Firefighters nebulize glutathione at the Rose Bowl; Eaton Fire 2025 The treatment has helped with our acute exposures. Our coughs subsided. The pain in our chests lessened. It works and we're grateful for that. But intermittent treatment under doctor supervision does not address the deeper, chronic exposures we face in the course of a career. We need longer-term, at-home glutathione treatment, but we can’t get it in California. Doctors can legally write a prescription for nebulized glutathione, but no pharmacist in the U.S. will compound it for California patients because, since 2020, the California BOP has unfairly regulated and disciplined pharmacists who do so. The last batch of nebulized glutathione ever dispensed in California was in June 2023, for a Firefighter Lung Detox Clinic in Sonoma County. Those firefighters have been without treatment ever since. The BOP's behavior is baffling and unjust and, as a result, patients – firefighters – are needlessly suffering. Glutathione is safe, legal, and allowable by the FDA – and it’s available in 49 other states. California is the outlier."The breathing treatment I had today has really helped out within the first half hour after I had it. I've seen a lot of firefighters affected by cancer... I've seen the suffering they go through. This will prevent a lot of suffering."- Fire Capt. Eric Nakamaru, Member, United Firefighters of Los Angeles City, Local 112; first responder on the Palisades Fire The March 6 BOP meeting is our last chance to block new regulations that would make it even harder for us to regain access to this potentially life-saving treatment. WHAT CAN YOU DO? 1. Sign and share this petition. If you can, please add a comment with your department or union. If you’ve experienced glutathione treatment (or would like to), include that as well. This petition will be presented to Board Members on Feb. 5 and – if their harmful regulations pass – we’ll take it to legislators too. 2. Make a public comment at the Feb. 5 meeting. The only reason the BOP didn’t pass an outright ban on glutathione years ago is because of firefighter resistance. Your voice is powerful. Make it heard. Call-in details and talking points are here. 3. Contact your labor leaders ASAP and tell them to ask California Professional Firefighters to get involved. CPF staff members have been monitoring the situation with the BOP since last summer. They’ve told us that CPF is willing to get involved but not until they hear from more unions. This is the moment! We can regain and retain access to this incredibly promising treatment, but only if we work fast and work together. Gold Ridge Fire Chief Shepley Schroth-Cary receives a glutathione IV at his station in Sonoma County; 2020 “A number of Fire Chiefs in Sonoma County have recognized the benefit of glutathione to remove carcinogens from our members as well as ourselves. We have invested in the use of glutathione providing nebulized glutathione as well as IV glutathione for a more intense detoxification. The results of the use of both have included a reduction in respiratory congestion and stopping chronic coughs, generally feeling better, and a measurable reduction in toxins found in our bodies. We have also been provided hope that we can invest in our health and prevent cancer. Our job regardless of preventative measures will and does expose us to toxins. We need resources to remove toxins from our bodies. Taking access away from us is cruel and unacceptable. As fires rage in southern California thousands of firefighters and millions of citizens are being inundated with toxins that are carcinogenic, increasing risk of cancer and many other health issues. Your decision will take an important tool away from us and other Californians when they need it most. “ Jan. 8, 2025 - Fire Chief Shepley Schroth-Cary (Gold Ridge Fire Protection District; participant in round 1 of Firefighter Detox Pilot Program; petition co-author) For more information, please contact Jacqui Jorgeson, founder and Executive Director of the Sonoma County-based nonprofit, the Volunteer Fire Foundation: Email: jacqui@volunteerfire.org; Phone: 707-708-4780 Petition co-authors: Fire Capt. Eric Nakamaru, Member, (United Firefighters of Los Angeles City, Local 112); first responder on the Palisades FireFire Capt. David Marquez (member of Pasadena Firefighters Local 809); Fire Chief Shepley Schroth-Cary (Gold Ridge Fire Protection District); Fire Chief/Battalion Chief Jason Jenkins (Cloverdale Fire/Santa Rosa Fire); Engineer Amanda Newhall (President of Healdsburg Local 2604); Fire Capt. Jason Campbell (Vice-President, Sonoma Valley Firefighters Local 3593); Jacqui Jorgeson (Volunteer Fire Foundation)Report a policy violationJacqui JorgesonPetition StarterMedia inquiries246 people signed this weekSign petition2,854Verified signaturesThe Decision MakersCalifornia State Board of PharmacyBoard membersNo response The SupportersFeatured CommentsErin, Carlsbad4 weeks agoMy son is going into the fire service and I worry about him developing cancer because of exposure to so many toxins. Nebulized glutathione is a powerful and effective way to detox the body and our first responders deserve to have access. Our first responders shouldn’t spend their lives helping others only to have their lives cut short.Renee, Decatur3 weeks agoAs a person with COPD, I know the long term effects on the lungs, from repeated times of smoke inhalation. Can’t believe that the medicine is refused. It needs to be available and affordable thru insurance or workman’s comp- I don’t exactly understand if workman’s comp wud be of any value, with this situation. Medicine to help clear the lungs of toxin produced by various types of smoke from grass to plastics t toxin fumes is a necessity for this specific job type!Show full textKevin, Pasadena3 weeks agoI had severe smoke inhalation from the Eaton Fire. I believe that these treatments significantly help my recovery process. This treatment should be readily available for firefighters.View all commentsFeatured Videos6541Sign and share why you care!Share this petitionShare this petition in person or use the QR code for your own m'''
