title = "Petition · Help Save the Girouard Family Home at Rhus Ridge - Los Altos Hills, United States · Change.org"
description = """
Urgent! Help stop the eviction of the Girouard family from the community land where they have lived and served the public for more than five decades, spanning three generations.
*UPDATE: PLEASE DIRECT ALL DONATIONS TO GIROUARD GOFUNDME OR VENMO (@Jeremiah-Girouard), NOT CHANGE.ORG

Contributing to the GoFundMe or Venmo ensures the Girouard family receives funds directly. All donations made through"""
full_description = "Help Save the Girouard Family Home at Rhus RidgeHelp Save the Girouard Family Home at Rhus RidgeRecent signersElena Fowler•2 hours agoLori Roman•3 hours agoNatalie•5 hours agoMisty Masgula•5 hours agoPamela Loebner•8 hours agoAdam Hopkins•11 hours agoVarun Bhatt•12 hours agoMalika Kaul•13 hours agoRobert Lindey•15 hours agoAlex Kowtun•17 hours agoEdmund Correia•20 hours agoAmita Sachdeva•22 hours agoGRETCHEN DODSON•22 hours agoTroy Towner•24 hours agoCarol Ann Schaffner•1 day agoNancy Sugimoto•1 day agoDave Bruce•1 day agoKyle Ignaitis•1 day agoGulcin Caner•1 day agoSergio Esparza•1 day agoElena Fowler and 19 others have signed recently.Decision Maker: Jed Cyr4 UpdatesThe IssueUrgent! Help stop the eviction of the Girouard family from the community land where they have lived and served the public for more than five decades, spanning three generations. *UPDATE: PLEASE DIRECT ALL DONATIONS TO GIROUARD GOFUNDME OR VENMO (@Jeremiah-Girouard), NOT CHANGE.ORG Contributing to the GoFundMe or Venmo ensures the Girouard family receives funds directly. All donations made through Change.org go towards helping the petition reach more people by garnering more views, as well as keeping the platform free for the public, not the family. THANK YOU to all of those who have contributed both monetarily and with your signatures, letters to MidPen and your support thus far. *ATTN: MARK YOUR CALENDARS THE MIDPEN BOARD MEETING IS FEBRUARY 26 @ 7 PM PST. Details in the Feb 25 update! —————-Dear Neighbors of Rhus Ridge, Los Altos Hills, and friends of the Girouard family, For over 50 years, the Girouard family has lived on and cared for the land at Rhus Ridge, serving as dedicated stewards and protectors of this cherished open space. Now, they are facing eviction by Midpeninsula Regional Open Space District, threatening not only their home but also the invaluable service they provide to our community. A Legacy of Stewardship and Service Since 1972, the Girouard family has been an essential part of Los Altos Hills. Originally hired by the Duveneck family—who owned Hidden Villa Ranch and its 1800 surrounding acres—Raye Girouard patrolled the land on horseback, ensuring its safety, maintaining trails, and assisting neighbors. His work deterred vandalism, arson, and misuse of the open space, and he frequently cleared downed branches from roads and trails to keep the area accessible. Raye was also a beloved educator, sharing his knowledge with local children through summer programs at Hidden Villa. When the Duveneck family sold 18 acres to MidPen in 1987—including the sliver of land on which the Girouard-owned house trailer home sat— they did so with the understanding that the Girouards would remain as residents and caretakers. After Raye’s passing in 2018, his wife Susan and son Jeremiah continued his work. Their presence has provided security, maintenance, and stewardship to Rhus Ridge for generations. Why They Are Being Evicted In 1994 the Girouards bought and installed a modular home to replace their house trailer. MidPen has always recognized that the family owns that home, but for decades they have routinely obstructed the family’s efforts to make repairs. Recently, a severe winter storm caused significant damage to the Girouard family home, rendering it uninhabitable. The family is ready and willing to invest their own resources to restore it, but MidPen has refused to acknowledge their occupancy rights, without which they cannot justify investing in the repairs. Instead of working with the Girouards, MidPen issued an eviction notice on January 10, 2025, citing the home’s disrepair as justification for their removal. The family now faces a March 10 deadline to fight for their right to stay. Why This Matters If the Girouards are evicted, our community loses more than just a family—we lose the stewards who have safeguarded Rhus Ridge for over five decades. Furthermore, Raye’s young grandson, Raylen, will lose access to his special education program in the Los Altos Hills school district, which provides him with crucial one-on-one support. This is not just about one family. This is about preserving the integrity of our community and honoring the commitments made when the Duvenecks entrusted this land to MidPen. How You Can Help We have until March 10, 2025, to take action and show MidPen that our community stands with the Girouard family. Here’s how you can help: ✅ Sign and share this petition to show your support. 💰Donate to the Girouard family’s GoFundMe. Donations will go towards home restoration, legal fees, and family support to ensure Raylen can stay at his school. Venmo: @Jeremiah-Girouard. PLEASE DIRECT ALL DONATIONS TO GOFUNDME OR VENMO. Contributing to the GoFundMe or Venmo ensures the Girouard family receives funds directly. All donations made through Change.org go towards helping the petition reach more people by garnering more views, as well as keeping the platform free for the public, not the Girouard family. ✉️ Send a letter to MidPen urging them to resolve this matter by granting the Girouards a long-term lease. A letter template is available for you to personalize and send: Email MidPen Board Download and mail a letter Submit your thoughts on the Board Member Contact Form 📢 Let your voice be heard at the MidPen Board meetings on February 12 and February 26 both at 7 pm for the regular meeting. 📲 Amplify the Girouards’ GoFundMe and Change.org petition on your social media. #SaveTheGirouards #RhusRidgeCommunity The Girouard family has given so much to our community—now it’s time for us to give back. Let’s ensure they can continue their vital role in protecting and preserving Rhus Ridge. Thank you for your support. Sincerely, The Rees and Schroeder family on behalf of our good family friends, the Girouard familyReport a policy violationMarianne Rees SchroederPetition StarterMedia inquiriesSign petition584Verified signaturesElena Fowler•2 hours agoLori Roman•3 hours agoNatalie•5 hours agoMisty Masgula•5 hours agoPamela Loebner•8 hours agoAdam Hopkins•11 hours agoVarun Bhatt•12 hours agoMalika Kaul•13 hours agoRobert Lindey•15 hours agoAlex Kowtun•17 hours agoEdmund Correia•20 hours agoAmita Sachdeva•22 hours agoGRETCHEN DODSON•22 hours agoTroy Towner•24 hours agoCarol Ann Schaffner•1 day agoNancy Sugimoto•1 day agoDave Bruce•1 day agoKyle Ignaitis•1 day agoGulcin Caner•1 day agoSergio Esparza•1 day agoElena Fowler and 19 others have signed recently.Decision Maker: Jed Cyr4 UpdatesThe IssueUrgent! Help stop the eviction of the Girouard family from the community land where they have lived and served the public for more than five decades, spanning three generations. *UPDATE: PLEASE DIRECT ALL DONATIONS TO GIROUARD GOFUNDME OR VENMO (@Jeremiah-Girouard), NOT CHANGE.ORG Contributing to the GoFundMe or Venmo ensures the Girouard family receives funds directly. All donations made through Change.org go towards helping the petition reach more people by garnering more views, as well as keeping the platform free for the public, not the family. THANK YOU to all of those who have contributed both monetarily and with your signatures, letters to MidPen and your support thus far. *ATTN: MARK YOUR CALENDARS THE MIDPEN BOARD MEETING IS FEBRUARY 26 @ 7 PM PST. Details in the Feb 25 update! —————-Dear Neighbors of Rhus Ridge, Los Altos Hills, and friends of the Girouard family, For over 50 years, the Girouard family has lived on and cared for the land at Rhus Ridge, serving as dedicated stewards and protectors of this cherished open space. Now, they are facing eviction by Midpeninsula Regional Open Space District, threatening not only their home but also the invaluable service they provide to our community. A Legacy of Stewardship and Service Since 1972, the Girouard family has been an essential part of Los Altos Hills. Originally hired by the Duveneck family—who owned Hidden Villa Ranch and its 1800 surrounding acres—Raye Girouard patrolled the land on horseback, ensuring its safety, maintaining trails, and assisting neighbors. His work deterred vandalism, arson, and misuse of the open space, and he frequently cleared downed branches from roads and trails to keep the area accessible. Raye was also a beloved educator, sharing his knowledge with local children through summer programs at Hidden Villa. When the Duveneck family sold 18 acres to MidPen in 1987—including the sliver of land on which the Girouard-owned house trailer home sat— they did so with the understanding that the Girouards would remain as residents and caretakers. After Raye’s passing in 2018, his wife Susan and son Jeremiah continued his work. Their presence has provided security, maintenance, and stewardship to Rhus Ridge for generations. Why They Are Being Evicted In 1994 the Girouards bought and installed a modular home to replace their house trailer. MidPen has always recognized that the family owns that home, but for decades they have routinely obstructed the family’s efforts to make repairs. Recently, a severe winter storm caused significant damage to the Girouard family home, rendering it uninhabitable. The family is ready and willing to invest their own resources to restore it, but MidPen has refused to acknowledge their occupancy rights, without which they cannot justify investing in the repairs. Instead of working with the Girouards, MidPen issued an eviction notice on January 10, 2025, citing the home’s disrepair as justification for their removal. The family now faces a March 10 deadline to fight for their right to stay. Why This Matters If the Girouards are evicted, our community loses more than just a family—we lose the stewards who have safeguarded Rhus Ridge for over five decades. Furthermore, Raye’s young grandson, Raylen, will lose access to his special education program in the Los Altos Hills school district, which provides him with crucial one-on-one support. This is not just about one family. This is about preserving the integrity of our community and honoring the commitments made when the Duvenecks entrusted this land to MidPen. How You Can Help We have until March 10, 2025, to take action and show MidPen that our community stands with the Girouard family. Here’s how you can help: ✅ Sign and share this petition to show your support. 💰Donate to the Girouard family’s GoFundMe. Donations will go towards home restoration, legal fees, and family support to ensure Raylen can stay at his school. Venmo: @Jeremiah-Girouard. PLEASE DIRECT ALL DONATIONS TO GOFUNDME OR VENMO. Contributing to the GoFundMe or Venmo ensures the Girouard family receives funds directly. All donations made through Change.org go towards helping the petition reach more people by garnering more views, as well as keeping the platform free for the public, not the Girouard family. ✉️ Send a letter to MidPen urging them to resolve this matter by granting the Girouards a long-term lease. A letter template is available for you to personalize and send: Email MidPen Board Download and mail a letter Submit your thoughts on the Board Member Contact Form 📢 Let your voice be heard at the MidPen Board meetings on February 12 and February 26 both at 7 pm for the regular meeting. 📲 Amplify the Girouards’ GoFundMe and Change.org petition on your social media. #SaveTheGirouards #RhusRidgeCommunity The Girouard family has given so much to our community—now it’s time for us to give back. Let’s ensure they can continue their vital role in protecting and preserving Rhus Ridge. Thank you for your support. Sincerely, The Rees and Schroeder family on behalf of our good family friends, the Girouard familyReport a policy violationMarianne Rees SchroederPetition StarterMedia inquiries87 people signed this weekSign petition584Verified signaturesThe Decision MakersJed CyrMidpeninsula Regional Open Space District Board - Ward 3No response The SupportersFeatured CommentsAustin, Sacramento3 days agoI first met the late Raye Girouard about 15 years ago. I was struggling in life and hiking on Rhus Ridge to clear my head. I had seen Raye around town many times over the years but knew nothing about him. This particular day, he, a stranger, stopped me just to ask what was wrong. I explained that I was stuck in life and casually mentioned my interest in archery. He told me to wait a moment and returned with his longbow and newspaper clippings documenting his various world-records. We became good friends all the way until his passing and he taught me all he could about archery, nature, local history, animals, and shared philosophies of life. I came to know Raye's family over those years. And, as I told stories about the amazing Girouards, I quickly learned how he and his family had inspired and assissted so many other locals with a multitude of other needs. They are an integral part of Los Altos history and culture and a positive force in the community. They are among the, sadly, increasingly-few gems that can recall a Los Altos apart from big-tech. To displace the Girouards would very much be an undue shame and tragedy not just to the hearts of many, but to the town, and to the very land itself.Show full textAnnette, Glendale4 weeks agoThe Girourard family home and land have been cherished by this family for many decades. It would be profoundly un-American to forcibly displace those who have lovingly cared for and maintained such a beautiful area for generations. As a friend of the family, I strongly urge you to support the Girouard family’s right to remain on their ancestral land and their beloved home, as law- abiding citizens. Let us allow them to continue their legacy in this cherished community.Show full textMadison, St Louis3 weeks agoThese people have cared for this place for far too long to have received this dreadful treatment! It's common sense to allow them to stay in the home they've spent decades in. This disrespect is so profound, I'm not even a California resident and I'm outraged! All they needed was repairs and they received an eviction notice? After all they've done to protect the land? Disgraceful. Keep them comfortable and in their home. They deserve nothing less.Show full textView all commentsShare this petitionShare this petition in person or use the QR code for your own material.Download QR CodePetition created on February 3, 2025Change.orgLocal Government and AdvocacyHelp Save the Girouard Family Home at Rhus Ridge"
