description = "Like all platforms, we use cookies and other similar technologies for the site to function, and to give you a better and more personalized experience of Change.org. This policy outlines which cookies we use and explains how you can manage them. Table of Contents What is a cookie? What cookies do we use? How do […]"
full_description = "Cookie PolicyLast updated: February 20, 2025PoliciesTermsPrivacyCookiesCommunity Guidelines Like all platforms, we use cookies and other similar technologies for the site to function, and to give you a better and more personalized experience of Change.org. This policy outlines which cookies we use and explains how you can manage them. Table of Contents What is a cookie? What cookies do we use? How do I manage cookies? Policy updates What is a cookie? Cookies are standard features of websites that allow us to store small amounts of data on your computer about your visit to the Change.org platform. They help us learn which areas of the platform are useful and which areas need improvement. On Change.org, we use cookies for many things, which we explain in detail below and which include: to remember your preferred language and country; to help you log in again when you revisit the platform; to connect your Change.org account to your social media account, if you choose to do so; and to help our engineers improve the platform, by understanding how people find us and what devices they’re using. The section below, titled “How do I manage cookies?”, outlines the choices you can make to control cookies. However, if you disable cookies and similar technologies, your experience on the platform may be diminished and some features may not work as intended. What cookies do we use? Below we list the different types of cookies that may be used by Change.org. Our Privacy Policy complements this Cookie Policy and outlines how any information that may be collected from cookies is used. Essential Cookies Essential cookies enable you to navigate our platform and to use our services and features. Without these cookies, our website and platform will not perform as smoothly for you as we would like, and we may not be able to provide certain core functions and features of our platform. CookieUse / categorization rationale__cf_bmUsed by Cloudflare to prevent certain attacks (DDoS) and other security risks.__cf_ob_info__cf_use_ob__cf*__cfduid__cfruid__cfuid__stripe_midUsed by Stripe to prevent fraud.__stripe_sid_change_idUsed by Change to track user state and login._change_lang_change_session_px3Used by Human Security (formerly PerimeterX) to detect fraud and bot activity._pxff_*_pxvidapp_meta_ppmu_ty_receiptUsed by Change to track various user preferences, such as banner dismissals, promotions, and unsubscriptions.app_meta_promoted_tyapp_meta_starter_dash_prompt_bannerapp_meta_unsubscribe_gtmcidUsed by Stripe to provide payment options and security.cookie_bannerUsed by Change to store cookie preferences.countryUsed by Change to show users content specific to the country set in their profile.docs.prefsUsed by Stripe to provide payment options and security.dont_auto_login_via_facebookUsed by Change to allow users to disconnect their Facebook account.enforce_policyUsed by Paypal to provide payment options and security.fbsr_*Used by Facebook to facilitate login and sharing on Change.org.G_AUTHUSER_HUsed by Google to facilitate login and sharing on Change.org.G_ENABLED_IDPSHSIDUsed by Google/YouTube to track Google account ID and the most recent sign-in time for security purposes.l7_azUsed by Paypal to provide payment options and security.LANGmachine_identifierUsed by Stripe to prevent fraud.membership_viewUsed by Change to personalize membership program signup options to be displayed.New Relic scriptUsed by New Relic to gather performance metrics (e.g., page load times, transaction traces, possibly IP addresses for geolocation).optimizelyEndUserIdUsed by Optimizely to include or exclude a user in experiments per their consent.optimizelyOptOutpending-signature-*Used by Change to keep track of signatures that require user authentication to be completed.private_machine_identifierUsed by Stripe to provide payment options and security.pxctsUsed by Human Security (formerly PerimeterX) to detect fraud and bot activity.recent-viewsUsed by Stripe