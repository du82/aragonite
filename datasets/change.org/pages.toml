["https://change.org/policies/petitions"]
title = "Community Guidelines · Change.org"
description = "As an open platform, we’re committed to freedom of expression. You’ll see a range of perspectives here, as all of the petitions on Change.org have been created by people in the community. Anyone can use Change.org no matter who they are, where they live, and what they believe, as long as they follow simple guidelines […]"
full_description = "Community GuidelinesLast updated: February 15, 2024PoliciesTermsPrivacyCookiesCommunity Guidelines As an open platform, we’re committed to freedom of expression. You’ll see a range of perspectives here, as all of the petitions on Change.org have been created by people in the community. Anyone can use Change.org no matter who they are, where they live, and what they believe, as long as they follow simple guidelines to keep our platform safe and open. This applies to all content you post. “Content” includes, but is not limited to, petitions, updates, comments, photographs, and usernames. These Community Guidelines, along with our Terms of Service, lay out the rules for using Change.org. Do’s First, here are few things we love to see you do on Change.org: Speak out on any issue you want to change Tell your personal story when you start a petition — hearing how you are affected by a problem is powerful. Explain the problem, how it impacts you, your family, friends, or community. Then explain the solution and how others can be a part of it. We recognize the need for anonymity in some cases and allow aliases to be used. For example, if you are concerned that using your real name may put your safety, livelihood, or privacy at risk. Choose the right decision maker Choose the decision maker who can give you what you want. A decision maker may be a particular person, group, or company, who has the direct ability to fix your problem. Work with them constructively both on and off our platform to come up with solutions. Mobilize your friends, family, and community Mobilize your friends, family, and community by sharing your petition to raise awareness. Use the tools on the platform to show your cause to others through social media. Be open to disagreement Listen to other people’s opinions. You might disagree strongly with a petition’s content, but change happens when people with different backgrounds and perspectives can participate in a constructive conversation. As long as it complies with these Community Guidelines, all content, no matter how contentious, is allowed on our platform. We see petitions on opposing sides of one issue all the time. It’s one of the many great things about being an open platform. The most effective way to respond to content you disagree with is to start a counter-petition and mobilize others to see your perspective, rather than asking Change.org to remove content you don’t like. However, if you believe content you see is not following Community Guidelines, you should report it to us. Update your supporters with developments Keep them posted on the highs and lows of your campaign and suggest ways they can take further action online and offline to stay involved. Be kind In cases where a petition addresses sensitive themes, please do so in a manner that is compassionate and mindful of the impact on others. Sensitive themes may include mental health, abuse, trauma, and any other topics that could potentially cause distress or trigger adverse reactions in individuals. Content warnings should be used when discussing topics that may be triggering. In some cases, we will restrict or remove content that could cause harm to others. Don’ts Here are the things we don’t like to see on Change.org, which may force us to remove or restrict content and accounts in line with our policies. ILLEGAL OR HARMFUL SPEECH 1. Hate or Discrimination — On Change.org we consider hate and discriminatory speech to be any content that directly or indirectly attacks or seeks to disadvantage an entire class of people because of a characteristic they share. We include in this definition coded language that is used with the intent or impact of harming a class of people. Any content that attacks anyone based on the following qualities, characteristics or attributes will be removed: age, color, disability, ethnic origin, gender identity, medical condition, nationality, national origin, race, religion, sex, sexual orientation, or veteran status. A. Hate Groups — We don’t allow content (including symbols and logos) from organizations recognized as hate groups or individuals linked to them on Change.org. We will also consider content which supports those groups, individuals, or their aims to be in breach of the Community Guidelines, and it will be removed. 2. Don’t Break the Law — Make sure that your use of Change.org doesn’t violate applicable national laws, including laws protecting the rights of other people. SAFETY 3. Protection of Minors — Don’t cause harm to children. Violations of these guidelines related to the protection of minors may result in content removal, warnings, temporary or permanent suspension of user accounts, and, if necessary, reporting to appropriate authorities. A. Minor Privacy and Images – Only parents and legal guardians have the right to post content about their children online, including a minor’s name, image, or other personal identifiable information. If you do not have a legal right to post a minor’s personal information, it will be removed. B. Child Sexual Abuse Material (CSAM) – Don’t use Change.org to post content that violates laws on child protection, including child sexual exploitation and abusive content. Accounts that violate this guideline will be disabled, the content removed and we will report offenders to the authorities. C. Age-Specific Restrictions – In the United States, users must be at least 13 years of age to create an account or post content on Change.org. In most countries outside of the United States, users must be at least 16 years old to create an account, unless otherwise specified according to local law. If you have questions about this, please contact us at help@change.org. 4. Privacy Violations: Personally Identifiable Information (PII) — Most content on Change.org is public, so protect yourself and respect the privacy of anyone else you mention. Don’t post private, personal information, such as private email addresses, identification documents, credit card numbers, home addresses, bank details or private telephone numbers. Don’t post photographs of people in private settings without their consent. Noncompliant PII will be removed or redacted. Multiple violations may result in account disablement. 5. Online Intimidation — You can be influential and respectful at the same time. When working to persuade decision makers and other users, focus on people’s actions rather than their personal characteristics. We believe in the power of civil discourse to drive change. While we expect debate and disagreement, we don’t tolerate abuse, stalking, threats, trolling, any form of bullying, or harassment. A. Bullying and Harassment – Content that is intended to intimidate, degrade, or harm others emotionally or psychologically will be removed. Violations of this policy may result in account suspension or disablement. B. Vexatious Content and Behavior – We define “vexatious” as unsolicited, irrelevant, or excessive posting of content, often for disruptive purposes. This content may contain frivolous or false claims, deliberate attempts to provoke or incite conflict and/or trolling behavior. We will remove vexatious content. In severe cases, repeated violations may result in warnings, temporary suspension, or permanent disablement of user accounts. 6. Risk for Public Security — We encourage the sharing of content that contributes to informed and constructive discussions about public security and public safety However, users must strive for accuracy, relying on reputable sources and avoiding the spread of unfounded or debunked claims. A. Risk for Environmental Damage – Content that promotes, supports, or provides instructions for engaging in activities that could lead to significant harm to the environment may be restricted, or removed in severe cases. B. Terrorist Content – Material that supports, promotes, or glorifies terrorist organizations, acts of terrorism, or recruitment for terrorist activities is strictly prohibited. Violations will result in removal of content and may involve account disablement. 7. Self-Harm and Suicide — When sharing content that discusses self-harm or mental health challenges in a supportive or educational context, users are encouraged to use content warnings to alert others about the sensitive nature of the material. Content that promotes or glorifies self-injury or suicide is strictly prohibited and will be removed. This includes any form of encouragement, instructional material, or content that romanticizes or trivializes self-harm. In severe cases, we may also take account-level action including suspension or disablement. VIOLENCE 8. Violence — No matter how passionately you feel about an issue, be mindful of how you express it. Don’t use calls for violence to express your feelings or support the same behavior from others. Don’t post images, multimedia or words that are needlessly upsetting, gory or violent. A. Incitement to Violence or Hatred – We don’t allow content that incites, glorifies, supports, threatens or encourages violence and/or hatred against anyone — and this includes support for violent groups or individuals. Violations of this guideline will result in removal of offending content, and may also include account suspension or disablement. B. Gratuitous, Graphic Imagery and Language – Graphic content can be used to condemn behavior or show the seriousness of an issue. However, give other users a warning about such content, where possible. Don’t post gratuitously violent, gory or needlessly upsetting images, videos or words. We may restrict or remove content that violates this guideline. INTEGRITY & AUTHENTICITY 9. False or Misleading Information — Take the time to fact-check information before posting it on Change.org. Utilize reputable sources to verify the accuracy of claims. Do not use deceptive tactics, such as cherry-picking data or selectively omitting information, to mislead others in your advocacy or campaign efforts. Noncompliant content of this nature will be removed, and we may issue warnings to users when content is highly disputed. A. Misinformation or Disinformation – Misinformation is the sharing of information that is incorrect. Disinformation is the deliberate sharing of information that is incorrect and designed to distort facts and mislead others, often as part of a coordinated campaign. Where information is verified to be untrue, we will remove it. We may ask you to verify any claims you make if they are disputed. In some cases, we may add a banner to the top of a petition that instructs users to conduct their own additional research related to the issue. Do not engage in or support activities that undermine the integrity of elections, such as spreading false information about voting procedures, candidates, or election results. We will restrict or remove potentially harmful content that puts public health at risk if the content lacks appropriate substantiation. This may include misinformation and disinformation about diseases, vaccines and treatments. B. Misleading or Unsubstantiated Claims — Clearly label opinions and beliefs as such, and provide evidence or sources when making factual claims, especially when discussing civic issues or elections. We may ask you to substantiate any claims you make if they are disputed or distorted. Otherwise, we will restrict or remove content which is misleading or unverified and has the potential to cause harm to others. In some cases, we may add a banner to the top of a petition that instructs users to conduct their own additional research related to the issue. C. Defamation – Defamation refers to the act of damaging someone’s reputation by making false statements about them. Make sure you have evidence for claims you make, as content that is established to be defamatory is illegal. Defamatory content, libel and/or slander will be removed, and in some cases you may face legal consequences. 10. Material Petition Edits – Once your petition begins receiving signatures, the core ‘ask’ and rationale must remain true to its original intent throughout the lifetime of the petition. Modifications made to a petition should serve to refine, clarify, substantiate, or update the demands in a way that is consistent with the original intent of the petition. If we determine that you have edited your petition in a noncompliant manner, we may remove your petition. 11. Deception or Fraud — Change.org is designed to share the stories of real people, supporting real issues. We recognize the importance of safeguarding our community against scams, fraud, and the dangers of unsecure or fraudulent websites. Content that seeks to defraud is prohibited and will be removed. A. Inauthentic Accounts and Impersonation – Don’t use a username that is intentionally offensive or abusive. You need to use an email address that belongs to you to start or sign a petition, and we don’t allow multiple accounts. Don’t impersonate people, including public figures or organizations. We recognize the need for anonymity in some cases. For example, if you are concerned that using your real name may put your safety, livelihood, or privacy at risk, you may use an alias. Accounts that violate the spirit of this guideline will be disabled, and all associated content will be removed. B. Linking to Fraudulent Websites or Unverified Fundraisers – Sharing links to unsecure or fraudulent websites is strictly prohibited. Before sharing a link, users are responsible for verifying the security and legitimacy of the site. Linking to direct payment technology such as Venmo, PayPal, crypto addresses, or individual bank details is prohibited. Links to fraudulent or unverified fundraising websites, or direct payment details may be removed. In certain cases, we may also disable the user’s account. INTELLECTUAL PROPERTY 12. Intellectual Property Infringement — We are committed to upholding intellectual property rights and we expect all users to do the same. You should only share content and ideas that you have the right to share, respecting the rights of others. If we establish that the content you have posted violates this guideline, it will be removed. A. Copyright Infringement – Users must not upload, share, or promote any content that infringes upon the copyrights of others. This includes, but is not limited to, text, images, videos, music, and any other form of intellectual property. B. Trademark Infringement – Respect trademarks and branding when using our platform. Do not use the names, logos, or other intellectual property of organizations, companies, or individuals without their consent. C. Plagiarism – Don’t incorporate or repurpose the work of others without their consent or attribution. OTHER GUIDELINES 13. Scope of Platform Service — Through these additional guidelines, we aim to further delineate the services offered, the limitations of our platform and the responsibilities of both Change.org and its users. A. Petition Creator’s Request – In s"
