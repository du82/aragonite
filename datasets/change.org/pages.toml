description = "Change.org, PBC (“Change.org”) is a corporation registered in the state of Delaware, United States. Change.org, PBC is fully owned by The Change.org Charitable Foundation, a 501c3 nonprofit organization. Change.org’s mission is to empower people everywhere to create the change they want to see. We’re an open platform, because we believe more change happens when people […]"
full_description = "Terms of ServiceLast updated: February 15, 2024PoliciesTermsPrivacyCookiesCommunity Guidelines Change.org, PBC (“Change.org”) is a corporation registered in the state of Delaware, United States. Change.org, PBC is fully owned by The Change.org Charitable Foundation, a 501c3 nonprofit organization. Change.org’s mission is to empower people everywhere to create the change they want to see. We’re an open platform, because we believe more change happens when people with different backgrounds and perspectives can participate in the conversation. We need rules to keep our platforms safe for you, us, and the community, and these Terms of Service (“Terms”) outline your rights and responsibilities related to our platform and services to the extent permitted by applicable laws. Table of Contents User accounts User content rules Posting user content Open platform Our rights Purchases and donations Copyright infringement More legal stuff to protect us Dispute resolution Text messaging Updates to Terms How to contact us Privacy addendum for petition starters These Terms of Service cover your activities on Change.org, our platform that enables people to create the change they want to see. Our platform allows people to start and promote “campaigns,” which include petitions and related actions, like creating and sharing content via our platform and third-party sites and services. User accounts You need an account for most activities on our platform. Keep your password somewhere safe, because you’re responsible for all activity associated with your profile. If you suspect someone else is using your account, let us know. When you sign or create a petition via our platform, a Change.org account is created for you. All your campaign activities are then tied to this account. When setting up your account, you must provide accurate and complete information, including a valid email address. You have complete responsibility for your account and everything that happens on your account, including for any harm or damage (to us or anyone else) caused by someone using your account with or without your permission. This means you need to be careful with your password and any emails you receive from us. You may not transfer your account to someone else or use someone else’s account without their permission. Inform us immediately upon learning that someone else may be using your account without your permission, by contacting us through our Help Center. Our platform is for people who are at least 16 years of age except in the United States where you may use our platform if you are at least 13 years of age or older. If you are younger than 16 (or younger than 13 if you reside in the United States) you may not set up an account by yourself, but we encourage you to invite a parent or guardian to create a campaign about areas of interest to you. We do not knowingly collect any personal information from children under the age of 16 (or the age of 13 in the United States) without parental consent, unless permitted by applicable law. If we learn that a child under the age of 16 (or under the age of 13 in the United States) has provided us with personal information, we will delete it in accordance with applicable law. User content rules You’re responsible for what you post on our platform. You should keep your campaigns and other content you upload in line with our Community Guidelines and applicable laws, and respect the intellectual property rights of others. In rare circumstances, at our sole discretion, we may terminate your account for repeated or major offenses. Follow our Community Guidelines: When posting content or using our platform, you must follow the Community Guidelines. Abide by the law and respect rights of others: You cannot post any campaign or content that violates applicable local or national laws of your country, or international laws or regulations. You agree that any campaign or content you post will comply with applicable local and national laws, including data protection laws. Except as provided otherwise by applicable laws, you are solely responsible for any campaign, content, and actions you post or take via the platforms and their consequences. If you name a decision maker (a person or group with the power and authority to affect the issue of the petition) for your campaign, you entrust us to perform any and all data processing and protection activities for decision makers, as outlined in our Privacy Policy. Enforcement by Change.org: If we are put on notice that your campaign or content violates the law or the rights of others (for example, if it is established that it is defamatory; violates privacy, intellectual property or publicity rights of others; or is funding an illegal activity), or if we discover that your campaign or content violates our Community Guidelines, we may remove it from our platforms, or we may make edits to bring your content into compliance. In the vast majority of cases, we will do our best to notify and work with you to fix the issue before we take any of these actions (but we are not obligated to do so). Change.org has discretion in enforcing these Terms, and as part of such discretion, may treat different types of content (e.g. petitions, comments, etc.) under different standards. We will take into account your interest as a user and our commitments to our organizational mission when we enforce these Terms. We may terminate or suspend your account or your permission to use our platform and services at any time, with or without notice, for: any material or repeated violation of these Terms, your failure to pay any fees when due, upon the request of law enforcement or government agencies, or your engagement in fraudulent or illegal activities. Upon any such termination, we may delete your account, passwords, and content, and we may prevent you from further access to the platforms and use of our services. We may also terminate your account for unexpected technical issues or problems. Your content may still be available on the platforms even if your account is terminated or suspended. You agree that we will have no liability to you or any third party for termination of your account, removal of your content, or blocking of your access to our platforms and services. Posting user content You retain ownership of content you post to our platforms, but you should make sure you’re allowed to share it. We’re allowed to make versions of your content, including translated versions, publicly available to anyone through any media, and others can do the same. Be sure to make backups of your work, too. The content you submit on the platforms is not confidential: Any content you submit or post on the platforms is likely to be publicly available, including all petitions you create, your comments to any petitions you signed (on our websites, in apps and on social media pages). If you are concerned about other Change.org community members or people you don’t know seeing a particular message or other content of yours, please do not post it. If you do not wish to have your name publicly displayed in connection with a particular petition, you may select the option not to display your signature publicly. Please check out our Privacy Policy for more details on information we collect and share when you use the platforms. The content you post (including photos) remains yours, and you also allow us to reuse and share it: By submitting and posting content, you do not lose any ownership rights you may have over your content. However, you authorize us to share this content with anyone, distribute it on any platform and in any media, and to make modifications or edits to it as we see fit (e.g. for clarity or optimization purposes or to translate the content into different languages). For example, we may shorten a petition title for it to appear on our homepage, test alternative images to help your petition be seen by more people, reformat a petition for a video highlighting petition victories, or share the content with interested media. You also authorize us to allow others to do the same with your content. In legal language, by submitting or posting content on or through the platforms, you grant us a worldwide, perpetual, irrevocable, non-exclusive, royalty-free license (with the right to sublicense) to use, copy, reproduce, process, adapt, modify, publish, transmit, display, and distribute your content in any and all media or distribution methods (existing now or later developed). This includes making your content available to other companies, organizations, or individuals who partner with Change.org for the syndication, broadcast, distribution, or publication of content on other media. You represent and warrant that you have all the rights, power, and authority necessary to authorize us to use any content that you submit. You also agree to all such uses of your content with no compensation paid to you. Sharing campaigns and other actions: Except in very limited circumstances where we’ll expressly ask you not to, we encourage you to link to, post to social media and third-party services, such as Facebook or Twitter, share via email, or otherwise copy and share individual petitions and campaigns of interest to you, but only for informational, non-commercial purposes. If you share another user’s petitions, questions, or other content, you may not make any modifications, and you may not remove any attributions. When you post content to any third-party service through the features and functionalities of our platforms (such as our apps or API), you will be subject to the terms of that third-party service, and you understand that these Terms are not binding upon such third parties. If you want to remove any petition or content from a third-party service, you should contact that third-party service and request removal directly from them. No user content storage: We are not a content-archiving service. We do not promise to store or make available on our platforms any content that you or other users may post for any length of time. You are solely responsible for keeping backups of everything you post on the platforms. Open platform Campaigns on our platforms represent the many opinions of millions of people. We don’t take responsibility for their views, nor are we responsible for the legality or accuracy of the content. You’ll find links to other sites on our platforms — once you leave us, we’re not responsible for all the wild, wacky, and wonderful things that can happen out there. We are not responsible for the content or actions of our users: Campaigns or content posted by users come from people, organizations, and other various sources. We make no promises about the reliability of any source or the accuracy, usefulness, safety, or intellectual property rights of any user campaign or content, nor do we endorse any campaigns or petitions or support any views, opinions, recommendations, or advice that may be posted by users. You acknowledge that certain users may have commercial interests in their campaigns. You therefore use the Change.org services and rely on any content you find at your own risk. If you find any campaign or other user content that violates our Community Guidelines, please use the “Report a policy violation” function on each petition page or file a request through our Help Center. Links out: When you use our platforms, you will find links to other websites that we don’t own or control. We are not responsible for the content or any other aspect of these third-party sites, including their collection of information about you. You should also read their terms and conditions and privacy policies. Our rights We own the Change.org platforms, including the website, present or future apps and services, and things like our logos, API, code, and content created by our employees — don’t mess with those! All right, title, and interest in and to the Change.org platform and services including our website, our existing or future applications, our APIs, databases, and the content our employees or partners submit or provide through our services (but excluding content provided by users) are and will remain the exclusive property of Change.org and its licensors. Our platform and services are protected by copyright, trademark, and other laws of both the United States and foreign countries. Nothing gives you a right to use the Change.org name or any of the Change.org trademarks, logos, domain names, and other distinctive brand features. Any feedback, comments, or suggestions you may provide regarding Change.org or the services is entirely voluntary and we will be free to use such feedback, comments, or suggestions as we see fit and without any obligation to you. You may not do any of the following while accessing or using the platforms and services: access, tamper with, or use non-public areas of the platform, Change.org’s computer systems, or the technical delivery systems of Change.org’s service providers. disable, interfere with, or try to circumvent any of the features of the platforms related to security or probe, scan, or test the vulnerability of any of our systems. copy, modify, create a derivative work of, reverse engineer, reverse assemble, or otherwise attempt to discover any source code of the Change.org platforms or services. access or search or attempt to access or search our platforms by any means (automated or otherwise) other than through our currently and publicly available search functionalities that are provided via our website, mobile apps, or API (and only pursuant to those API terms and conditions). Crawling the Change.org site is permissible if done in accordance with the provisions of the robots.txt file; however, scraping the services, platforms, and databases is expressly prohibited unless authorized in a written agreement between you and Change.org. in any way use the Change.org services to send altered, deceptive, or false source-identifying information (such as sending email communications falsely appearing as Change.org); or interfere with, or disrupt, (or attempt to do so), the access of any user, host, or network, including, without limitation, sending a virus, overloading, flooding, spamming, mail-bombing the platforms or services, or in any other manner interfering with or creating an undue burden on the services. Purchases and donations We work with different companies to process payments, so we can stay focused on improving our platforms and empowering people to create change. We offer several ways you can financially contribute to help the petitions and issues you care about. When you make a payment, you agree to use a valid payment method. We may provide you the ability to purchase promotional items related to petitions and campaigns, contribute monthly to help cover the costs of the Change.org platform, or purchase other products or services. PROMOTED PETITIONS The ability to purchase promotional ite"
