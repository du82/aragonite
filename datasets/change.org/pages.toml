title = "Petition · Get Amazon to Offer Plastic-Free Packaging Options - Sag Harbor, United States · Change.org"
description = """
Thousands of the products on Amazon are shipped with plastic wrapping and cushioning materials unnecessarily. 
We are petitioning for a ‘Plastic-free’ option at checkout and ‘Plastic-free’ labeling available for sellers who already choose eco alternatives.
It’s unfair that so much plastic is being put into the world when it is avoidable and safe eco options to replace bubble wrap, shrink wrap and"""
full_description = "Get Amazon to Offer Plastic-Free Packaging OptionsGet Amazon to Offer Plastic-Free Packaging OptionsDecision Makers: Amazon.com +337 UpdatesThe IssueThousands of the products on Amazon are shipped with plastic wrapping and cushioning materials unnecessarily. We are petitioning for a ‘Plastic-free’ option at checkout and ‘Plastic-free’ labeling available for sellers who already choose eco alternatives. It’s unfair that so much plastic is being put into the world when it is avoidable and safe eco options to replace bubble wrap, shrink wrap and styrofoam are available. Much of the plastic included in e-commerce shipping is not recyclable at all or is very difficult to recycle given the lack of facilities. 91% of all plastic ends up as litter, in landfills or incinerated. Paper and other biodegradable materials are as effective and similar in price to plastic and bubble-wrap, which Amazon requires from it's marketplace sellers. It's time they updated both their checkout options and their marketplace requirements to remove the 'bubble-wrap non-compliance' penalties. Since Amazon ships over 50% of the packages in many countries, we are asking them to set an example and offer materials that are more easily recycled and reused so consumers can feel better about the need to shop online and gain more control over what arrives on their doorstep. According to scientists, about 17.6 billion pounds of plastic enter the ocean annually and there are more than 5 trillion pieces of plastic floating in our oceans. This plastic enters from all nations, including the US and European countries by way of waste export. Why add more? Please grant consumers the choice to go ‘Plastic-free’. It’s not acceptable for major businesses to leave consumers with so few choices and we are fed plastic we didn’t ask for that later ends up in landfills or in our rivers and oceans. Plastic-free choices should be accessible and plentiful if we want to see lasting change and a dramatic decrease in plastic waste. Let’s take a big step forward and make ‘Plastic-free’ a regular option on all checkout forms. Amazon has an opportunity to set a GREAT example. Report a policy violationNicole DelmaPetition StarterMedia inquiriesVictoryThis petition made change with 784,679 supporters!Share this petitionDecision Makers: Amazon.com +337 UpdatesThe IssueThousands of the products on Amazon are shipped with plastic wrapping and cushioning materials unnecessarily. We are petitioning for a ‘Plastic-free’ option at checkout and ‘Plastic-free’ labeling available for sellers who already choose eco alternatives. It’s unfair that so much plastic is being put into the world when it is avoidable and safe eco options to replace bubble wrap, shrink wrap and styrofoam are available. Much of the plastic included in e-commerce shipping is not recyclable at all or is very difficult to recycle given the lack of facilities. 91% of all plastic ends up as litter, in landfills or incinerated. Paper and other biodegradable materials are as effective and similar in price to plastic and bubble-wrap, which Amazon requires from it's marketplace sellers. It's time they updated both their checkout options and their marketplace requirements to remove the 'bubble-wrap non-compliance' penalties. Since Amazon ships over 50% of the packages in many countries, we are asking them to set an example and offer materials that are more easily recycled and reused so consumers can feel better about the need to shop online and gain more control over what arrives on their doorstep. According to scientists, about 17.6 billion pounds of plastic enter the ocean annually and there are more than 5 trillion pieces of plastic floating in our oceans. This plastic enters from all nations, including the US and European countries by way of waste export. Why add more? Please grant consumers the choice to go ‘Plastic-free’. It’s not acceptable for major businesses to leave consumers with so few choices and we are fed plastic we didn’t ask for that later ends up in landfills or in our rivers and oceans. Plastic-free choices should be accessible and plentiful if we want to see lasting change and a dramatic decrease in plastic waste. Let’s take a big step forward and make ‘Plastic-free’ a regular option on all checkout forms. Amazon has an opportunity to set a GREAT example. Report a policy violationNicole DelmaPetition StarterMedia inquiriesShare this petitionVictoryThis petition made change with 784,679 supporters!Share this petitionThe Decision MakersAmazon.comNo response AmazonNo response Jeff BezosCEO, Amazon.comNo response View 1 moreThe SupportersFeatured CommentsKatherine, Greenville1 year agoAmazon is one of the largest online stores in the world and ships over 700 million pounds a year. Most of that ends up polluting our ecosystems. With this option, we could make a large dent in plastic pollution and protect our wildlife.View all commentsShare this petitionShare this petition in person or use the QR code for your own material.Download QR CodePetition created on October 20, 2019Change.orgEnvironmentGet Amazon to Offer Plastic-Free Packaging Options"
