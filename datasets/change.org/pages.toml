["https://change.org/p/opposition-to-oldenburg-low-income-section-8-housing-project"]
title = "Petition · Opposition to Oldenburg Low-Income/Section 8 Housing Project - Oldenburg, United States · Change.org"
description = """
PETITION AGAINST THE REDEVELOPMENT OF OLIVIA HALL AND THERESA HALL INTO LOW-INCOME/SECTION 8 ELDERLY HOUSING
We, the residents, business owners, and visitors of Oldenburg, Indiana, strongly oppose the proposed redevelopment of Olivia and Theresa Halls into low income elderly housing by RDOOR. While the town values responsible growth, this project raises grave concerns that threaten the integrity,"""
full_description = "Opposition to Oldenburg Low-Income/Section 8 Housing ProjectOpposition to Oldenburg Low-Income/Section 8 Housing ProjectRecent signersIrene Fullenkamp•1 day agorandy fullenkamp•2 days agoSteven Zigan•2 days agoDaniel Bryan•2 days agoBailey Fasbinder•2 days agoKim Abraham•2 days agoPat Weiler•3 days agoEvan Blanken•3 days agoGary Heun•3 days agokris rosenberger•3 days agoKathie Flannery•3 days agoSusan Meyer•4 days agoMeridy McLane•4 days agoSamantha Caplinger•4 days agoMegan Fitzsimmons•4 days agoLuke Roesener•4 days agoJeromy Johnson•4 days agoPeggy L Stortz•4 days agoMary Bedan•4 days agoLisa Kawaguchi•4 days agoIrene Fullenkamp and 19 others have signed recently.Decision Makers: Mike Braun +22 UpdatesThe IssuePETITION AGAINST THE REDEVELOPMENT OF OLIVIA HALL AND THERESA HALL INTO LOW-INCOME/SECTION 8 ELDERLY HOUSING We, the residents, business owners, and visitors of Oldenburg, Indiana, strongly oppose the proposed redevelopment of Olivia and Theresa Halls into low income elderly housing by RDOOR. While the town values responsible growth, this project raises grave concerns that threaten the integrity, infrastructure, and financial well-being of our beloved community. This development would significantly increase the demand on Oldenburg’s already strained emergency services, including fire, EMS, and law enforcement. Recent break-in and vandalism incidents have already demonstrated the difficulty in obtaining timely law enforcement response in Franklin County (over an hour). Additional strain on these resources, especially from a population with higher emergency medical needs, could jeopardize the health and safety of both current and future residents.RDOOR’s Cedar Glen Apartment Shooting/Homicide Furthermore, an impact study has been conducted to assess how this project would affect Oldenburg’s aging sewer and stormwater drainage systems, which are already facing challenges. Without proper planning, the consequences could be costly and disruptive. The project may require modifications to the historic landscape of Oldenburg, including the destruction of part of the town’s famous wall to accommodate parking and emergency vehicle maneuvers. This alteration would permanently impact the town’s character, diminishing one of its most recognizable and cherished landmarks. Concerns regarding RDOOR’s track record further highlight the risks of this development. The company has a lengthy history of failing to maintain its properties, with documented cases of tenants left without basic necessities such as hot water and heat. Despite years of litigation, these issues remain unresolved, demonstrating a troubling pattern of neglect. A company that repeatedly fails to meet its obligations elsewhere should not be entrusted with a project that could profoundly impact Oldenburg’s future. Zoning variances exist to ensure that any new development aligns with the wellbeing and interests of a community. This project fails to meet those standards. The approval of such a variance should not be permitted if it is injurious to the health, safety, morals, and welfare of the community. The strain on emergency services, unresolved infrastructure concerns, and the track record of the developer all indicate that this project poses such risks. Additionally, any variance granted must ensure that the use and value of surrounding properties will not be adversely affected, yet the introduction of low income housing in a town with a distinct historical and economic identity could have lasting repercussions on property values and the overall landscape of the community. Finally, the financial burden of this project cannot be ignored. Taxpayer funds should not be directed toward a development that brings more strain than benefit to an already thriving community. Instead, resources should be invested in revitalizing communities that genuinely need support, rather than forcing unnecessary change upon one that is already self-sustaining. We also recognize and respect that the Sisters of Saint Francis wish to sell these properties and understand their mission has always been rooted in service and support for those in need. Their desire to see this property transition into a space that provides housing for individuals who require this assistance is not lost on our community. However, it is critical to ensure that any development aligns with both the wellbeing of the individuals it aims to serve as well as the citizens of Oldenburg. If the proposed project commences without addressing fundamental concerns—including emergency response times, infrastructure strain, and the well-documented history of RDOOR’s failure to provide basic necessities such as heat and running water—it risks not only damaging the fabric of Oldenburg but also creates a living situation that does not truly support the intent of the housing project. Providing housing is not enough if the conditions within it fail to meet essential standards for a safe and stable life. This is not about opposition to change or about denying housing to those in need. It is about ensuring that development is done responsibly, thoughtfully, and in a way that uplifts all involved—without compromising the integrity of Oldenburg or the quality of life for its current and future residents. For these reasons, we, the undersigned, strongly oppose this project and call for its rejection in order to protect Oldenburg’s future. UPDATE: Senator Leising and Representative Patterson have both responded and are actively working the issue. Report a policy violationSeth ShieldsPetition StarterMedia inquiriesSign petition582Verified signaturesIrene Fullenkamp•1 day agorandy fullenkamp•2 days agoSteven Zigan•2 days agoDaniel Bryan•2 days agoBailey Fasbinder•2 days agoKim Abraham•2 days agoPat Weiler•3 days agoEvan Blanken•3 days agoGary Heun•3 days agokris rosenberger•3 days agoKathie Flannery•3 days agoSusan Meyer•4 days agoMeridy McLane•4 days agoSamantha Caplinger•4 days agoMegan Fitzsimmons•4 days agoLuke Roesener•4 days agoJeromy Johnson•4 days agoPeggy L Stortz•4 days agoMary Bedan•4 days agoLisa Kawaguchi•4 days agoIrene Fullenkamp and 19 others have signed recently.Decision Makers: Mike Braun +22 UpdatesThe IssuePETITION AGAINST THE REDEVELOPMENT OF OLIVIA HALL AND THERESA HALL INTO LOW-INCOME/SECTION 8 ELDERLY HOUSING We, the residents, business owners, and visitors of Oldenburg, Indiana, strongly oppose the proposed redevelopment of Olivia and Theresa Halls into low income elderly housing by RDOOR. While the town values responsible growth, this project raises grave concerns that threaten the integrity, infrastructure, and financial well-being of our beloved community. This development would significantly increase the demand on Oldenburg’s already strained emergency services, including fire, EMS, and law enforcement. Recent break-in and vandalism incidents have already demonstrated the difficulty in obtaining timely law enforcement response in Franklin County (over an hour). Additional strain on these resources, especially from a population with higher emergency medical needs, could jeopardize the health and safety of both current and future residents.RDOOR’s Cedar Glen Apartment Shooting/Homicide Furthermore, an impact study has been conducted to assess how this project would affect Oldenburg’s aging sewer and stormwater drainage systems, which are already facing challenges. Without proper planning, the consequences could be costly and disruptive. The project may require modifications to the historic landscape of Oldenburg, including the destruction of part of the town’s famous wall to accommodate parking and emergency vehicle maneuvers. This alteration would permanently impact the town’s character, diminishing one of its most recognizable and cherished landmarks. Concerns regarding RDOOR’s track record further highlight the risks of this development. The company has a lengthy history of failing to maintain its properties, with documented cases of tenants left without basic necessities such as hot water and heat. Despite years of litigation, these issues remain unresolved, demonstrating a troubling pattern of neglect. A company that repeatedly fails to meet its obligations elsewhere should not be entrusted with a project that could profoundly impact Oldenburg’s future. Zoning variances exist to ensure that any new development aligns with the wellbeing and interests of a community. This project fails to meet those standards. The approval of such a variance should not be permitted if it is injurious to the health, safety, morals, and welfare of the community. The strain on emergency services, unresolved infrastructure concerns, and the track record of the developer all indicate that this project poses such risks. Additionally, any variance granted must ensure that the use and value of surrounding properties will not be adversely affected, yet the introduction of low income housing in a town with a distinct historical and economic identity could have lasting repercussions on property values and the overall landscape of the community. Finally, the financial burden of this project cannot be ignored. Taxpayer funds should not be directed toward a development that brings more strain than benefit to an already thriving community. Instead, resources should be invested in revitalizing communities that genuinely need support, rather than forcing unnecessary change upon one that is already self-sustaining. We also recognize and respect that the Sisters of Saint Francis wish to sell these properties and understand their mission has always been rooted in service and support for those in need. Their desire to see this property transition into a space that provides housing for individuals who require this assistance is not lost on our community. However, it is critical to ensure that any development aligns with both the wellbeing of the individuals it aims to serve as well as the citizens of Oldenburg. If the proposed project commences without addressing fundamental concerns—including emergency response times, infrastructure strain, and the well-documented history of RDOOR’s failure to provide basic necessities such as heat and running water—it risks not only damaging the fabric of Oldenburg but also creates a living situation that does not truly support the intent of the housing project. Providing housing is not enough if the conditions within it fail to meet essential standards for a safe and stable life. This is not about opposition to change or about denying housing to those in need. It is about ensuring that development is done responsibly, thoughtfully, and in a way that uplifts all involved—without compromising the integrity of Oldenburg or the quality of life for its current and future residents. For these reasons, we, the undersigned, strongly oppose this project and call for its rejection in order to protect Oldenburg’s future. UPDATE: Senator Leising and Representative Patterson have both responded and are actively working the issue. Report a policy violationSeth ShieldsPetition StarterMedia inquiries181 people signed this weekSign petition582Verified signaturesThe Decision MakersMike BraunFormer U.S. Senate - IndianaNo response (notified 10 days ago)Email decision makerUnited States Department of Housing and Urban DevelopmentNo response Franklin County Zoning BoardNo response The SupportersFeatured CommentsJanet, Batesville1 week agoOldenburg is a beautiful, safe, historic town. It is so small that “hamlet” would be a better description for it. People come from far and wide to experience this small place that is a close replica of something you might see in Germany. To be so small, there are several restaurants in Oldenburg, and one of the things that tourists might do while there, would be to have a nice meal and then take a walk through this picturesque little burg. With so many new people being placed in Oldenburg, there would be no guarantees of safety if you wanted to stroll the streets. A town the size of Oldenburg cannot withstand the influx of mass amounts of new residents. It does not have the necessary qualifications (one example: fire department) to meet the demands that would without a doubt accompany this mass addition. If this proposal is such a boon to town of Oldenburg, then why aren’t other places clamoring to enjoy this? Listen to the voices of those people who love Oldenburg, who understand the town’s limitations, and who have nothing to gain financially by protesting this proposal.Show full textEmily1 week agoI’m not sure why my address came up where it did but I live just outside of Oldenburg and visit Oldenburg weekly, my children are there and it’s a safe place for many.. this housing will make it busier and could be unsafe ! This is our holy town let’s keep it that wayHilary, Oldenburg6 days agoKeep Oldenburg German!View all commentsShare this petitionShare this petition in person or use the QR code for your own material.Download QR CodePetition created on February 19, 2025Change.orgPublic SafetyOpposition to Oldenburg Low-Income/Section 8 Housing Project"
