["https://changelog.com/brainscience"]
title = "The Brain Science podcast"
description = "For the curious! We're exploring the inner-workings of the human brain to understand behavior change, habit formation, mental health, and being human."
full_description = "Brain Science #34 Develop a high-performance mindset Play 2023-03-24T17:00:00Z #brain-science +2 #performance #culture 🎧 47,863 In this episode Adam and Mireille discuss what it takes to develop a high performance mindset. Your mindset is the mental framework that influences your actions, your decisions, and your overall approach to life. Discover how to nurture a growth-oriented and positive mindset, fostering resilience, adaptability, and a commitment to self-improvement. This episode is a must-listen for anyone looking to optimize their mental framework and cultivate a growth-oriented mindset to achieve success in their personal and professional lives. • Share Brain Science #33 Your brain on burnout Play 2022-12-20T21:00:00Z #brain-science +1 #culture 🎧 31,640 We’re back! This is from our “lost episodes” — This is your brain…and this is your brain on burnout, any questions? OK, but seriously, burnout effects everyone, even if they/you don’t admit it. Burnout is a state of physical, emotional, and mental exhaustion caused by prolonged stress. It can affect ANYONE, but it is especially common among high-performers who push themselves to the limit. In this episode, we dive into the latest research on burnout and its effects on the brain, as well as offer practical advice for preventing and managing burnout. If you’re heading into 2023 feeling overwhelmed and drained, this episode is for you. • Share Brain Science #32 The practice of being present Play 2020-10-28T18:30:00Z #brain-science +1 #culture 🎧 44,926 We’re joined by Elisha Goldstein, PhD - one of the world’s preeminent mindfulness teachers, a clinical psychologist, founder of the Mindful Living Collective and, creator of the six-month breakthrough program - A Course in Mindful Living. If you’ve ever used the Calm app, you might be familiar with his voice as he walks you through mindfulness practices to help calm negative emotions and anxious thoughts. He has extensive expertise in mindfulness based stress reduction (MBSR) and today he’s sharing his wealth of knowledge using mindfulness to naturally reduce anxiety and be more present and aware in our lives. • Share"
