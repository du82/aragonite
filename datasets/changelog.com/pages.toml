["https://changelog.com/gotime"]
title = "The Go Time podcast"
description = "Your source for wide-ranging discussions from all around the Go community"
full_description = "Go Time #340 That's Go Time! Play Jerod Santo 2024-12-18T16:15:00Z #go 🎧 18,540 Mat gathers the entire cast (sans Natalie, sadly) alongside our producer, Jerod Santo, for one last Go Time. That’s right, this is Go Time’s finale episode. After eight years and 340 episodes, we are going out on top. Join us one last time, you won’t regret it! We share our feelings, reminisce on the good times, list some of our favorite moments & share a few opinions, which may (or may not) be unpopular. 😉 Discuss • Share Go Time #339 Pitching Go in 2025 Play 2024-12-10T21:45:00Z #go 🎧 16,068 With so many great programming languages having emerged in the last decade, many of them purpose-built, when and where does Go still make sense and how do you make the case for it at work? Discuss • Share Go Time #338 Unpop roundup! 2023 Play Natalie Pistunovich Ian Lopshire Andy Walker Juan Andrés Guerrero-Saade Kaylyn Gibilterra Joe Davidson Matthew Boyle David Wickes Jerod Santo 2024-11-21T22:00:00Z #go 🎧 15,005 Go Time producer, Jerod Santo, ranks & reviews the most (un)popular opinions of 2023. Discuss • Share Go Time #337 Crawl, walk & run your way to usable CLIs in Go Play 2024-11-12T21:30:00Z #go +1 #cli 🎧 15,797 With the number of libraries available to Go developers these days, you’d think building a CLI app was now a trivial matter. But like many things in software development, it depends. In this episode, we explore the challenges that arose during one team’s journey towards a production-ready CLI. Discuss • Share Go Time #336 Writing a shell in Go Play 2024-11-06T21:00:00Z #go +1 #shell 🎧 15,445 Writing a shell is rarely the kind of project you take on lightly. In this episode, Johnny is joined by Qi Xiao to explore how to go about such a feat in Go. Discuss • Share Go Time #335 AI for Observability Play 2024-10-23T14:00:00Z #go +1 #ai 🎧 15,303 Yasir Ekinci joins Johnny & Mat to talk about how virtually every Observability vendor is rushing to add Generative AI capabilities to their products and what that entails from both a development and usability perspective. Discuss • Share"
