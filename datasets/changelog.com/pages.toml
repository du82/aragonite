["https://changelog.com/backstage"]
title = "Changelog's Backstage podcast"
description = "Your backstage pass to the people behind Changelog and the things that interest them"
full_description = "Backstage #25 Should we get down with OP3? Play 2022-10-18T17:10:00Z #oss +1 #content 🎧 2,891 The Open Podcast Prefix Project is a free and open source podcast prefix analytics service committed to open data and listener privacy. This hits close to home for us in a couple ways, so we invited the project’s creator, John Spurlock, Backstage to learn more about it. • Share Backstage #24 Reflecting on 500 episodes Play 2022-08-05T16:00:00Z 🎧 3,091 This is Adam and Jerod’s pre-show call before hooking up with Chris Coyier to record episode 500 of The Changelog. We’ve been doing these off and on for awhile now. We hang out for 30ish minutes before the show begins and ship that conversation as a bonus for our Changelog++ members. We’re doing this one different. You don’t hit a round number like this very often. So, here it is. A standalone Backstage episode. Thanks for listening and here’s to the next 500! 🥂 • Share Backstage #23 The Oban Pro Play 2022-04-19T14:30:00Z #elixir +2 #oss #sustainability 🎧 3,306 We’ve been using Parker Selbert’s Oban library for years and he even helped us hold it right by improving our open source implementation! So, Jerod invited him Backstage to discuss the library, how we’re using it, Parker’s plan to make it financially sustainable, his “freedom number” of Oban Pro subscribers, and a bunch of other random stuff along the way. Let’s go! • Share Backstage #22 Helping Grafana set up their Big Tent Play 2022-04-04T14:00:00Z #observability +2 #updates #go 🎧 3,524 For the first time ever, we’re producing somebody else’s podcast! Our friends at Grafana asked us to help them launch a show for the observability community. It’s called Big Tent and on this episode we are backstage with Tom Wilkie, Mat Ryer, & Matt Toback talking through what they’re up to and why we’re helping out. • Share Backstage #21 Long-time listener, first-time code contributor Play 2022-02-11T20:00:00Z #automation +2 #github #node 🎧 3,038 Simey de Klerk recenty dove head-first into our transcripts repo and coded up a super-cool feature that’s been on Jerod’s wishlist for awhile now. So, of course, we invited him Backstage to tell the tale! • Share"
