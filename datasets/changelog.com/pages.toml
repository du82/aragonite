title = "Changelog Interviews podcast"
description = "Conversations with the hackers, leaders, and innovators of the software world"
full_description = "Changelog Interviews #630 Building for application developers Play Watch 2025-02-27T18:00:00Z #cloud +1 #dx 🎧 14,749 Anurag Goel, Founder/CEO of Render, joins Adam to discuss what they’re doing to solve cloud problems for application developers. They just raised $80M they don’t even need and they’re poised to solve boring problems like object storage, and less boring things like building for the AI era. Discuss • Share Changelog Interviews #629 Programming with LLMs Play Watch 2025-02-19T19:00:00Z 🎧 20,608 For the past year, David Crawshaw has intentionally sought ways to use LLMs while programming, in order to learn about them. He now regularly use LLMs while working and considers their benefits a net-positive on his productivity. David wrote down his experience, which we found both practical and insightful. Hopefully you will too! Discuss • Share Changelog Interviews #628 Fostering open source culture Play Watch 2025-02-13T13:00:00Z #oss +1 #culture 🎧 18,519 Arun Gupta is back, this time with his latest book in hand titled “Fostering Open Source Culture” to share his wisdom and experiences of fostering open source culture. BTW you can use the code OSCULTURE20 to get 20% off (both print and e-book). Use this link and enjoy. Discuss • Share Changelog Interviews #627 Build software that lasts! Play Watch 2025-02-05T20:15:00Z 🎧 21,243 After 30+ years in the software industry, Bert Hubert has experienced a lot. He founded PowerDNS, published articles for places like IETF / IEEE, and built his own parliament monitoring system. That just scratches the surface. Recently, Bert wrote about what it takes to build software for the long term. Let’s dig in. Discuss • Share Changelog Interviews #626 Turso is rewriting SQLite in Rust Play Watch 2025-01-30T13:00:00Z #sqlite +1 #oss 🎧 20,820 Glauber Costa, co-founder and CEO of Turso, joins us to discuss libSQL, Limbo, and how they’re rewriting SQLite in Rust. We discuss their efforts with libSQL, the challenge of SQLite being in the public domain but not being open for contribution, their choice to rewrite everything with Limbo, how this all plays into the future of the Turso platform, how they test Limbo with Deterministic Simulation Testing (DST), and their plan to replace SQLite. Discuss • Share"
