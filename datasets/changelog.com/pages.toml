["https://changelog.com/friends/80"]
title = "Discovering discovery coding with Jimmy Miller (Changelog & Friends #80)"
description = "Fire up a REPL, grab your favorite Stephen King novel, and hold on to the seat of your pants! Jimmy Miller returns to reveal why, at least for some of us, discovery coding is where it’s at."
full_description = "Changelog & Friends – Episode #80 Discovering discovery coding with Jimmy Miller Featuring Jimmy Jerod Adam Play Watch Discuss Subscribe Subscribe Direct (RSS) Email Apple Spotify Android YouTube Overcast Pocket Casts Mastodon TwiX Request Episode Share All Episodes Brought to you by Fire up a REPL, grab your favorite Stephen King novel, and hold on to the seat of your pants! Jimmy Miller returns to reveal why, at least for some of us, discovery coding is where it’s at. Changelog++ members save 9 minutes on this episode because they made the ads disappear. Join! 114 minutes Recorded Feb 11, 2025 Published Feb 14, 2025 Download (110MB) Transcript 🎧 20,433 Featuring Jimmy Miller – Website, GitHub, X Jerod Santo – GitHub, LinkedIn, Mastodon, X Adam Stacoviak – Website, GitHub, LinkedIn, Mastodon, X Sponsors Temporal – Build invincible applications. Manage failures, network outages, flaky endpoints, long-running processes and more, ensuring your workflows never fail. Register for Replay in London, March 3-5 to break free from the status quo. Augment Code – Developer AI that uses deep understanding of your large codebase and how you build software to deliver personalized code suggestions and insights. Augment provides relevant, contextualized code right in your IDE or Slack. It transforms scattered knowledge into code or answers, eliminating time spent searching docs or interrupting teammates. Notion – Notion is a place where any team can write, plan, organize, and rediscover the joy of play. It’s a workspace designed not just for making progress, but getting inspired. Notion is for everyone — whether you’re a Fortune 500 company or freelance designer, starting a new startup or a student juggling classes and clubs. Notes & Links 📝 Edit Notes That time Secret Service busted in Jimmy Miller’s door for hacking Blinkist Amazon.com: Tools Of Titans The best, worst codebase (Changelog Interviews #609) Discovery Coding Thinking outside the box of code (Changelog Interviews #552) Chapters Chapter Number Chapter Start Time Chapter Title Chapter Duration 1 00:00 Let's talk! 00:38 2 00:38 Sponsor: Temporal 02:03 3 02:41 ISPs & Friends 07:31 4 10:12 Jimmy is back! 03:29 5 13:41 Blinkist (not a sponsor) 02:41 6 16:22 Packaging matters 01:59 7 18:21 Jimmy's bangers 02:02 8 20:23 Discovery Coding 03:04 9 23:27 Sponsor: Augment Code 03:30 10 26:57 The four designs story 04:01 11 30:58 Pantsing 01:00 12 31:58 The rubber hits the road 03:04 13 35:02 Not much tooling 06:36 14 41:38 Stephen King's method 03:39 15 45:17 Applying King's method 00:50 16 46:07 Flow state debate 05:18 17 51:25 Discovery coding != flow 00:43 18 52:08 Discovery coding != bottom up 03:38 19 55:47 Sponsor: Notion 02:48 20 58:34 How to get started 08:02 21 1:06:37 Discovery code every time? 02:13 22 1:08:50 The 2-year debug story 02:30 23 1:11:20 The bad open source story 02:17 24 1:13:37 The group project plagiarism story 01:12 25 1:14:49 Restoring your session 04:17 26 1:19:06 Personal comments 04:23 27 1:23:29 Implementation details 08:20 28 1:31:49 Do you like this idea? 00:53 29 1:32:42 Comment pack rat 01:45 30 1:34:27 Commit message confessions 01:19 31 1:35:46 The Field Notes friend 00:34 32 1:36:20 Dog visitation 01:20 33 1:37:39 Beyond the blog post 03:48 34 1:41:28 Wheel reinvention 01:26 35 1:42:54 Back to personal notes 02:09 36 1:45:03 Does Evernote still exist? 01:00 37 1:46:03 Modern OCR tools 01:15 38 1:47:18 Discovery coding first steps 04:33 39 1:51:51 Bye, friends 00:49 40 1:52:40 Coming up next 01:15 Transcript 📝 Edit Transcript Changelog Play the audio to listen along while you enjoy the transcript. 🎧 Jerod Santo So always convincing the customer support representative that you know probably more than they do about what we’re talking about is always an awkward thing… Because you don’t want to be a jerk about it, but it’s like, “No, I’ve already rebooted things. I’ve already done whatever’s on your checklist there, before you pass me on to the next person… Like, I’ve been there, done that, so please, let’s just dismiss with the pleasantries, and can you please upgrade me to somebody technical?” Jimmy Miller [laughs] The number of times they’ve been like “Can you please restart your computer?” “Okay, I’ve restarted it.” Jerod Santo Yeah. You pause for half a beat… Jimmy Miller Yeah, you just pretend you’re doing all of the things that they’re telling you to do, so that way you get through their checklist… And I totally get it, they’ve got to follow a procedure. But yeah, when you’ve done it like a few times, and you’re like… What I ended up doing for this dropping packets constantly is making a program that just ran, and like had a graph of the percent of packet drop I was having all the time… Jerod Santo There you go. Jimmy Miller And once I could show them “Here’s a chart…”, that seemed to be convincing enough to send it to somebody else. Jerod Santo Right. Adam Stacoviak Thankfully, the Unifi gateway does that, the UDM Pro. Jimmy Miller Oh, yeah? Adam Stacoviak It does versions of that for you. Jerod Santo No coding necessary. Jimmy Miller Oh, nice. Adam Stacoviak Yeah. So like “Here you go. Here’s my dashboard to my enterprise-level home network.” Jimmy Miller Yeah, this was sadly a – the way this apartment was set up, we didn’t even have a in unit router. It was all like at the the apartment level. So I had access to nothing, and that made it much trickier. Because like if things went down, you couldn’t just like unplug something either… It was just – I understand they wanted to be all fancy. It ended up being way worse having wired Ethernet throughout and all of that, with a centralized router set up. It was just likee, come on… They at least actually did it secure. I was surprised with that. It was network network-isolated properly. But… Jerod Santo My ISP is actually awesome… I’m out here in the sticks, and there’s only one company that would run fiber to where we are, and they were a small business provider… So it’s like residential fiber, but on a small business providers network. And so it’s kind of the best of both worlds, because it’s kind of retail pricing, so it’s all – it’s not like business pricing, which is always, I think, overly priced… But I’m one person away from like a highly technical person who remembers me, or has my case files available… And so I can just get past the first person whose job is just to answer the phone and basically route. The next person up is very good, and knows what’s going on, and has my history… And so it’s been pretty awesome. The hard part with the residential and retail ISPs is like getting through the many layers of people they’re going to redirect you to before you actually are talking to somebody who can solve your problem, and knows how to. It’s nice to have a graph when you do find that person. Adam Stacoviak I think it’s pretty – it’s like basically a miracle that you have amazing internet in the sticks. Jerod Santo It is. And not a miracle as much as it is persistence of me demanding it… Adam Stacoviak For years. Jerod Santo It’s like the only time I’ve been political in my life. It took a couple of years, I think; maybe 19 months… Because I was actually promised by the person that sold me this land that Cox cable internet was run to the property. And I bought the property under that assumption. I did not do my due diligence… I did double-check. I told them to double-check to make sure it was true. And I thought that was due diligence. But apparently, they can just double down on the lie… So I bought it under that assumption, and built a house, three years later moved out here, and I’m like calling the Cox to set up our cable internet and they’re like “We don’t have service to your area.” Like, “Oh, you do. The person that sold me this land says you do.” Jimmy Miller [laughs] Jerod Santo And they’re like “No. No, we do not.” And so I got a price on what it would cost to actually run Cox cable internet out to me, and it was like sixty five thousand dollars, or something like this. Jimmy Miller Wow… Yeah. Jerod Santo So I tried to force them to pay that amount, the person that sold the land, and that didn’t really work… And so then I decided, “Well, I’m going to organize…” We have about 10 acreages in the area, all on like three circles, and I found this Great Plains - shout-out to Great Plains in Nebraska - a great ISP… And they’re like “Yeah, it makes sense for us to run fiber. We had fiber around you, but not directly where you are. If we can get 10 households to sign a contract that they will buy it for four years or something, we’ll go ahead and trench out to you guys.” And so I went around to my neighbors and got people to sign papers… And everyone was very happy, because all we had was DSL that was oversubscribed. And they wouldn’t even let me on it, that’s how oversubscribed it was. So I was using - no, not Starlink. Starlink didn’t exist. This is from 2016, 2017. I was using a Verizon wireless hotspot, 5G… And I would tether to that, even to record the Changelog. And it was dicey, wasn’t it, Adam? I mean, there was times where it was so bad. Adam Stacoviak We could have never done this video-first then. Never. Jerod Santo No. Never. Jimmy Miller No. That would have been that – that is one of the big things that is awful, is trying to do video on bad connections. Jerod Santo So I went knocking on doors and I’m like “Please vote yes on this initiative.” And they’re all like “Of course. Who doesn’t want fiber to their house?” They’re like “Of course.” It was the easiest sell of all time. And so that’s how it happened. Adam Stacoviak [00:08:10.24] So 10 houses for your contract. Jerod Santo Yup. I only got one no out of all the houses that I went to. Adam Stacoviak “We don’t use the internet around here…” Jerod Santo They were – they’re kind of isolationists. They’re just like “Leave us alone. We don’t want to talk to anybody, about anything.” I’m like “This is just fast internet.” They’re like “No, we’re good.” “Okay… Sorry for asking.” Adam Stacoviak Send them a letter. Jimmy Miller My wife’s grandma lives out in the middle of nowhere, and got a smartphone for the first time just a few years ago. And she was like – she was telling Janice, my wife, “I’ve found this thing on my phone and I don’t know what it is, but it starts with the W… And everything on there – just like, anything I look up, it just tells me everything about it.” And Janice is like “Do you mean Wikipedia?” Jerod Santo I was gonna say, Wikipedia, my guess… Jimmy Miller Yeah, yeah, yeah. Wikipedia. Jerod Santo [laughs] Adam Stacoviak The original ChatGPT. Jerod Santo Yes, exactly. Jimmy Miller Gan-Gan is what she goes by. She’s like “Gan-Gan, do you know what Wikipedia is?” “No.” “It’s the internet.” And she was like blown away that she had used the internet. Jerod Santo That’s awesome. Jimmy Miller This was the first time in her life that she knew she had used the Internet on her own, and like discovered it… Which I just thought was – it’s really funny now, because she she always got mad at people fact-checking her, but now she fact-checks everybody on Wikipedia. Jerod Santo There you go. Jimmy Miller Remember that website “Let me google that for you”? Did you guys ever use that one? Adam Stacoviak Oh, yeah… Jerod Santo …very snarky with people, because they’d ask you a question that was just easily googleable… I feel like that’s what the current crop of LLMs are. They’re like “Let me wikipedia that for you.” Like, instead of going to Wikipedia, you just ask them, and they’re basically just reading it to you, aren’t they? They’re like “Here’s what Wikipedia says. I’ve consumed it, and I will now act like it’s my information.” Jimmy Miller Yeah, I absolutely hate the search feature in ChatGPT. I have to constantly ask it “Please stop searching. I don’t care what you’re searching. I just want what’s in the memory here, because it’s going to be higher quality than what you’re searching.” But yeah. Jerod Santo Yeah. It’s too slow, too. Like, I can search the web faster than you can search the web. Jimmy Miller Yeah, exactly. Adam Stacoviak Fun times. Fun times in the internet lands, you know…? Jerod Santo Well, we brought you back, Jimmy. We had so much fun talking to you last time, hearing your stories of Secret Service folk knocking your door down… Jimmy Miller Yeah, it was really great. I’m glad that I got to come back on Friends. I will say, Friends are definitely my favorite episodes. I like the kind of free form content of Friends. Jerod Santo We appreciate that. Jimmy Miller Yeah, super-excited to be back. Jerod Santo It took us a long time to do Friends, because we didn’t think anybody wanted to hear just us chitchatting with people as much as they wanted to hear the classic Changelog interview, you know? But apparently… What do we know…? [laughter] Jimmy Miller I think interviews, they can be really good. Like, there are great interviews. I’ve listened to a lot of them on here that are great. But I don’t know, after you hear enough interviews, sometimes it just does kind of get a little formulaic. I’m one of those people who just listens to a ton of different podcasts, but I’m also not like a completionist about them. I don’t listen to every single episode of every podcast that I listen to. And so I don’t know, it can break up that monotony; if you have a bunch of different interviews, and then you just get some like people hanging out, chatting… It’s just kind of nice, especially in like the background. Jerod Santo Totally. Jimmy Miller Because people are hanging out, chatting, and you’re just kind of listening in the background; if you miss something, it doesn’t really matter. Jerod Santo Yeah, it’s lower stakes. That’s why I call it like a weekend talk show, because it’s like, listen on the weekend. If you miss a part, no big deal. It’s just another one of our stories that don’t matter so much. Adam Stacoviak I disagree. Jerod Santo But I’m happy to hear that you like that. Do you now actually listen to podcasts while working or while coding? Because I can’t do that. But a lot of people do. Jimmy Miller [00:11:47.16] It depends. If it’s actually something where I have to focus, no. If it’s like I’m having at work to do some really tedious, boring, repetitive tasks that I don’t want to do, and I’m fine with getting distracted and it taking 12 times longer, then absolutely. But yeah, if I’m trying to like really code, I cannot – I’ve found myself like accidentally listening to a podcast and coding… I was just doing something else, and then I’d start coding something… And I’m like “Why am I so frustrated right now?” And it’s because those two parts of my brain – the linguistic part of my brain is like overloaded right now, it feels like. And so I have to have to turn off the podcast. Jerod Santo It’s kind of like when you’re reading a book and then you realize you haven’t been paying attention for the last fi"
