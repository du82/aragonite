full_description = "Changelog & Friends – Episode #81 Change my mind with Adam & Jerod Featuring Jerod Adam Play Watch Discuss Subscribe Subscribe Direct (RSS) Email Apple Spotify Android YouTube Overcast Pocket Casts Mastodon TwiX Request Episode Share All Episodes Brought to you by Jerod and Adam use Chris Kiehl’s post on development topics he’s changed his mind on (over the last 10 years) as a proxy for discussion on dev things they HAVE and HAVE NOT changed their minds on. Changelog++ members save 9 minutes on this episode because they made the ads disappear. Join! 117 minutes Recorded Feb 18, 2025 Published Feb 21, 2025 Download (168MB) Transcript 🎧 19,609 Culture Featuring Jerod Santo – GitHub, LinkedIn, Mastodon, X Adam Stacoviak – Website, GitHub, LinkedIn, Mastodon, X Sponsors Retool – The low-code platform for developers to build internal tools — Some of the best teams out there trust Retool…Brex, Coinbase, Plaid, Doordash, LegalGenius, Amazon, Allbirds, Peloton, and so many more – the developers at these teams trust Retool as the platform to build their internal tools. Try it free at retool.com/changelog Augment Code – Developer AI that uses deep understanding of your large codebase and how you build software to deliver personalized code suggestions and insights. Augment provides relevant, contextualized code right in your IDE or Slack. It transforms scattered knowledge into code or answers, eliminating time spent searching docs or interrupting teammates. Temporal – Build invincible applications. Manage failures, network outages, flaky endpoints, long-running processes and more, ensuring your workflows never fail. Register for Replay in London, March 3-5 to break free from the status quo. Fly.io – The home of Changelog.com — Deploy your apps close to your users — global Anycast load-balancing, zero-configuration private networking, hardware isolation, and instant WireGuard VPN connections. Push-button deployments that scale to thousands of instances. Check out the speedrun to get started in minutes. Notes & Links 📝 Edit Notes Software development topics I’ve changed my mind on after 10 years in the industry File over app — Steph Ango ssh - How can I set customise settings for htop? - Unix & Linux Stack Exchange Amy Hoy Chapters Chapter Number Chapter Start Time Chapter Title Chapter Duration 1 00:00 Let's talk! 00:38 2 00:38 Sponsor: Retool 02:45 3 03:23 Start the show! 00:30 4 03:53 Wordsmithing blog titles 04:49 5 08:43 REPLs are not useful design tools 04:19 6 13:02 Most programing should be done long before code is written 08:23 7 21:25 Take no pride in understanding complexity 00:45 8 22:11 Adam hasn't changed his mind on...? 07:43 9 29:53 Jerod hasn't changed his mind on...? 09:14 10 39:07 Sponsor: Augment Code 03:30 11 42:37 Colaboration is still hard (if not harder) 03:21 12 45:58 Software can't solve people problems 07:42 13 53:40 Let's talk to Steph Ango (Obsidian) 02:08 14 55:48 Don't obsessively tweak your environment 02:22 15 58:10 Tweaking htop 14:09 16 1:12:19 My tools can't help you do what I do (at the level I do it) 06:36 17 1:18:55 Sponsor: Temporal 02:04 18 1:20:59 Every dev should learn SQL 10:34 19 1:31:33 Just in time learning 13:30 20 1:45:03 Adam's AI Homelab is runnning on Windows 11 Pro 03:04 21 1:48:07 Should we be running AI services locally? 04:46 22 1:52:53 Bye friends 00:04 23 1:52:59 Closing thoughts and stuff 03:32 Transcript ⏰ Coming Soon Changelog We're hard at work on the transcript for this episode! Sign in / up to access transcript notifications. 💪 View all episodes"
