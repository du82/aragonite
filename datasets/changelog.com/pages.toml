full_description = "The Changelog Subscribe Subscribe Direct (RSS) Email Apple Spotify Android YouTube Overcast Pocket Casts Mastodon Bluesky TwiX Request Episode Software’s best weekly news brief, deep technical interviews & talk show. Hosted by: Adam Stacoviak Jerod Santo Practical AI Subscribe Subscribe Direct (RSS) Email Apple Spotify Android YouTube Overcast Pocket Casts Mastodon TwiX Request Episode Making artificial intelligence practical, productive & accessible to everyone. Hosted by: Chris Benson Daniel Whitenack JS Party Subscribe Subscribe Direct (RSS) Email Apple Spotify Android YouTube Overcast Pocket Casts Mastodon TwiX Request Episode Your weekly celebration of JavaScript and the web. Hosted by: Kevin Ball Nick Nisi Amy Dutton and more... Changelog Master Feed Subscribe Subscribe Direct (RSS) Email Apple Spotify Android YouTube Overcast Pocket Casts Mastodon Bluesky TwiX Request Episode Your one-stop shop for all Changelog podcasts. Changelog & Friends #82 Kaizen! Pipely goes BAM Play Watch 2025-02-28T23:15:00Z #kaizen 🎧 1,667 It’s Kaizen 18! Can you believe it? We discuss the recent Fly.io outage, some little features we’ve added since our last Kaizen, our new video-first production, and of course, catch up on all things Pipely! Oh, and Gerhard surprises us (once again). BAM! Discuss • Share Changelog Interviews #630 Building for application developers Play Watch 2025-02-27T18:00:00Z #cloud +1 #dx 🎧 14,749 Anurag Goel, Founder/CEO of Render, joins Adam to discuss what they’re doing to solve cloud problems for application developers. They just raised $80M they don’t even need and they’re poised to solve boring problems like object storage, and less boring things like building for the AI era. Discuss • Share Changelog News #133 AI killed the tech interview. Now what? Play Watch 2025-02-24T22:20:00Z 🎧 17,139 Kane Narraway thinks through the radical change AI tools have brought to the technical interview process, Rhys Kentish built an app that makes him