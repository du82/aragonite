["https://changelog.com/afk"]
title = "The Away from Keyboard podcast"
description = "Exploring the human side of creative work (retired)."
full_description = "Away from Keyboard #12 Laura Gaetano doesn't want to be a manager Play 2019-01-31T00:52:19Z #culture 🎧 7,253 Laura Gaetano was born in Italy, and by my count has lived in at least four different countries. Her multicultural upbringing has had a huge impact on her life. In fact, she currently works at the Travis Foundation with a focus on diversity and inclusion. We talk about her upbringing, her troubles with art school, the work she’s doing now, and changes that may be on the horizon. • Share Away from Keyboard #11 Adam Clark wants to be independently wealthy Play 2019-01-17T04:13:57Z #culture +1 #startups 🎧 3,467 Adam Clark and I met back in 2013. We started a podcasting company together (which we both left), he shut down his consulting business to move to California and work for Apple, and now he’s back in Tennessee. Last year he launched a new business, Podcast Royale, a company he says will afford him more freedom to do whatever he wants to do. He talks to me about growing up in a cult, losing his father, marriage, and how being a parent gives him a purpose in life. • Share Away from Keyboard #10 Maria Boland Ploessl found her home in technology Play 2018-12-20T18:08:25Z #sustainability +1 #culture 🎧 3,049 In our last episode of the year, I talk with Maria Boland Ploessl. Maria’s path to technology has been interesting to say the least. A Saint Paul native, she studied Spanish and Latin American studies in college. In 2016, after living in a few different cities (even a year-long stint in Brazil), she moved back to Minnesota. Now, she’s the Executive Director of Minnestar, a non-profit organization with the aim of supporting and growing Minnesota’s tech community. Maria talks to me about what Minnestar does, the work they’re doing to bring more people of underrepresented groups into tech, married life and how she’s grown from it, and parenthood. • Share Away from Keyboard #9 Jeremy Fuksa is a unicorn Play 2018-12-05T22:22:58Z #sustainability +1 #culture 🎧 2,790 Jeremy Fuksa has had a rough few years. After deciding to go out on his own, his third year in business was filled with anxiety. Going back to working a full-time job may sound like a failure to some, but Jeremy doesn’t look at it that way. He talks to me about his unique skill set, dealing with anxiety and depression, and how his recent experience has taught him some great lessons. • Share"
year_published = 2019
