title = "The Founders Talk podcast"
description = "In-depth, one-on-one conversations with founders, CEOs, and makers. The journey, lessons learned, and the struggles. Let's do this!"
full_description = "Founders Talk #97 Refocusing Docker on developer-first and growth Play 2023-06-02T20:00:00Z #startups 🎧 16,904 This week Adam is joined by Scott Johnston, CEO of Docker. Scott shares his journey to the CEO role, how he’s leading the company to not only grow revenue, but to also invest in developer facing features, their shift from a enterprise sales focus to a PLG driven model, and we even talk about Docker Desktop, the competition it faces, and the struggle they face when considering making it open source. • Share Founders Talk #96 Selling to Enterprise Play 2023-05-05T20:00:00Z #startups 🎧 10,614 This week Adam is joined by Michael Grinich, Founder & CEO at WorkOS. Michael shares his journey to build WorkOS, what it takes to cross the Enterprise Chasm, and how he’s building his sales organization for growth. • Share Founders Talk #95 Builder journey to streaming data platform Play 2023-04-20T21:30:00Z #startups 🎧 10,018 This week Adam is joined by Alex Gallego, Founder & CEO at Redpanda Data, to share his builder journey to create the Redpanda streaming data platform. • Share Founders Talk #94 Creating magical software Play 2023-03-10T21:00:00Z #startups 🎧 10,577 This week Adam is joined by Jori Lallo, Co-founder of Linear, to talk about creating magical software and building high-quality software teams. • Share Founders Talk #93 Building the best mountain bikes in the world Play 2022-07-19T20:00:00Z #startups 🎧 13,642 This week Adam is taking the show off the beaten path to speak with Adam Miller, the founder and CEO of Revel Bikes. Yes that’s right, this episode features a founder of a bike brand, not a tech brand. Adam Miller’s journey to create Revel Bikes is paved with many ups and many downs, a failed partnership, super scrappy weeks and months traveling the world to find the best manufacturing partners, the latest innovations in suspension tech and modern geometry to hit the mountain biking scene, a strong team that’s been with him every step of the way (many of which are as close as family), and truly some of the best premium bikes available on the market today. BTW, Adam (host) is an owner of a Revel bike — he has a T1000 colorway Rascal that he’s ridden on downhill trails, all-day epics, and everything in-between. If you enjoy this episode, please us know in the comments. • Share"
