["https://changelog.com/jsparty"]
title = "The JS Party podcast"
description = """
Welcome to JS Party, a weekly celebration of JavaScript and the web
New episodes drop on Thursdays!"""
full_description = "JS Party #350 One last party Play 2025-02-13T20:20:00Z #javascript 🎧 11,309 Jerod is joined by KBall, Nick & Amy to throw one last JS Party! We review last year’s predictions, discuss the state of the web dev world, opine on coding AIs (of course) & divulge what comes next for the JS Party crew. Thank you for partying with us all these years! 💚 Discuss • Share JS Party #349 React: then & now Play 2024-12-05T17:45:00Z #javascript +1 #react 🎧 18,626 Back at React Summit in New York, KBall & Nick sat down with Tom Occhino & Shruti Kapoor for more fascinating conversations. Tom Occhino, a key figure in React’s history at Facebook (now Meta), reveals the origin story of React, which began when an ads engineer presented a revolutionary approach to web UI rendering. The discussion extends to React’s evolution through Next.js. Then, Shruti Kapoor breaks down React 19’s major features, including React Server Components (RSC), the new compiler implementation, and enhanced APIs that promise to streamline development workflows. Discuss • Share JS Party #348 WYSIWYG Play 2024-11-29T17:20:00Z #javascript 🎧 13,981 At React Summit in New York, KBall & Nick sat down with Kent C. Dodds & Theo Browne for two fascinating conversations. Both of them showed us the whole gamut of their personalities! Kent shared his insights on effective teaching methodologies and the future of developer education, while diving deep into React and the Remix/React Router ecosystem, and closing on an appeal for kindness int he world. Then Theo took us behind the scenes of his developer-focused content creation, from streaming to the origins of the T3 stack, and how his online persona (including T3!) is “just him”. Discuss • Share JS Party #347 Nine pillars of great Node apps Play 2024-11-21T19:00:00Z #node +1 #javascript 🎧 14,481 Recently, four pillars of the JavaScript community (James Snell, Natalia Venditto, Michael Dawson & Matteo Collina) teamed up to create a resource that lays out nine principles for doing Node.js right in enterprise environments. On this episode, Natalia & Matteo join Jerod to discuss all nine. Discuss • Share"
