["https://changelog.com/about"]
title = "About"
description = "News and podcasts for developers"
full_description = "About Changelog is an indie media company covering every facet of a software developer's journey -- inventing, making, building, shipping, leading, founding, thinking. We produce some of the best and most influential podcasts for developers and we cover the news that matters daily in our newsfeed. We have a thriving weekly and nighly newsletter. Our platform is fully open source and our community is free to join. There are no imposters here. Everyone is welcome. Adam Stacoviak — Adam is the host of Founders Talk, and Founder & Editor-in-chief of Changelog Media. Prior to Changelog (and during, depending on the year) he lead product development for a non-profit called Pure Charity. — @adamstac Jerod Santo — Jerod is Managing Editor & Partner of Changelog Media. he helps lead and co-host our flagship podcast, The Changelog, and builds all the cool stuff that makes Changelog awesome. He also runs his custom software company, Object Lateral. — @jerodsanto Special thanks to... Fastly for helping us ships our podcast super fast, globally. Thanks Fastly! Fly.io for helping ship our Elixir app and Postgres database close to our users, all over the world, with no ops. Typesense for giving us lightning-fast, open source search to power changelog.com. Breakmaster Cylinder for working with us to create our awesome beets."
