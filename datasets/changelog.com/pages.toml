full_description = "Changelog Developer Community 41,777 developers from all over the world get a backstage pass to everything we do: including access to our Zulip chat, exclusive community member only features & more. Join the Community View our Zulip By joining you agree to this community's Code of Conduct. Meet your hosts! The faces behind the voices 🎙️ From data science to software engineering to product management, Changelog podcast hosts have wide-ranging backgrounds & a shared love of deep conversation. Jerod Santo Adam Stacoviak Daniel Whitenack Nick Nisi Chris Benson Christopher Hiller Kevin Ball Amal Hussein Amy Dutton Former hosts, forever community members 🫡 When you podcast as long as we have (since '09), you make a lot of friends along the way. You'll hear these amazing folks in our back catalog & every so often as return guests. Carlisia Thompson Erik St. Martin Brian Ketelsen Nadia Eghbal Mikeal Rogers Gerhard Lazu Tim Smith Jaana Dogan Feross Aboukhadijeh Rachel White Mark Bates Johnny Boursiquot Mat Ryer Alex Sexton Ashley Willis Suz Hinton Safia Abdalla Carmen Andoh Jon Calhoun Amelia Wattenberger Mireille Reece, PsyD Ali Spittel Divya Emma Bostian Natalie Pistunovich Kris Brandow Angelica Hill Ian Lopshire Jessica Sachs Justin Garrison Autumn Nash There are no imposters here 💚 Everyone is welcome. You are not an imposter. No matter who you are or where you are on your developer journey — this community is a safe place for you to hang your hat & call home. All you have to do is take the first step. Chat every day with friends Connect with like-minded developers from all over the world. Hang with us & discuss past/future episodes. Be the first to hear about upcoming projects. This is the community you've been looking for. Join the community 🔥🔥🔥 There's no way to truely say how much value I get from being a part of Changelog's developer community. I'm there everyday, and there's always something interesting being discussed. It's awesome. Justin Dorfman Open Source Program/Community Manager at Sourcegraph"
