title = "Code of conduct"
description = "News and podcasts for developers"
full_description = '''Code of Conduct Our Pledge In the interest of fostering an open and welcoming environment, we as leaders of the Changelog.com community pledge to make participation in our community a harassment-free experience for everyone, regardless of age, body size, disability, ethnicity, gender identity and expression, level of experience, nationality, personal appearance, race, religion, or sexual identity and orientation. Our Standards Examples of behavior that contributes to creating a positive environment include: Using welcoming and inclusive language Being respectful of differing viewpoints and experiences Gracefully accepting constructive criticism Focusing on what is best for the community Showing empathy towards other community members Examples of unacceptable behavior by participants include: The use of sexualized language or imagery and unwelcome sexual attention or advances Trolling, insulting/derogatory comments, and personal or political attacks Public or private harassment Publishing others' private information, such as a physical or electronic address, without explicit permission Other conduct which could reasonably be considered inappropriate in a professional setting Our Responsibilities Changelog leadership is responsible for clarifying the standards of acceptable behavior and are expected to take appropriate and fair corrective action in response to any instances of unacceptable behavior. Changelog leadership has the right and responsibility to remove, edit, or reject comments, commits, code, wiki edits, issues, and other contributions that are not aligned to this Code of Conduct, or to ban temporarily or permanently any contributor for other behaviors that they deem inappropriate, threatening, offensive, or harmful. Member Responsibilities All participants in this community are expected to abide by "Our Standards" (defined above). As a member of this community, you have a responsibility in helping us uphold this community's values. Any violations of our Code of Conduct are grounds for removal from membership. Scope This Code of Conduct applies both within project spaces and in public spaces when an individual is representing Changelog or its community. Examples of representing Changelog or community include using an official Changelog email address, posting via an official social media account, or acting as an appointed representative at an online or offline event. Representation of the community may be further defined and clarified by Changelog leadership. Enforcement Instances of abusive, harassing, or otherwise unacceptable behavior may be reported by contacting Changelog leadership at editors@changelog.com. All complaints will be reviewed and investigated and will result in a response that is deemed necessary and appropriate to the circumstances. Changelog leadership is obligated to maintain confidentiality with regard to the reporter of an incident. Further details of specific enforcement policies may be posted separately. Changelog leadership who do not follow or enforce the Code of Conduct in good faith may face temporary or permanent repercussions as determined by other members of Changelog's leadership. Attribution This Code of Conduct is adapted from the Contributor Covenant, version 1.4, available at https://www.contributor-covenant.org/version/1/4/code-of-conduct.html.'''
