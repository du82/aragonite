description = "Browse thousands of hours of video content from Microsoft. On-demand video, certification prep, past Microsoft events, and recurring series."
full_description = "Sip and Sync with Azure Grab your favorite beverage and join Priyanka Vergadia and Govind Kamtamneni as they sync up on the latest topics on Azure and AI. Mr. Maeda's Cozy AI Kitchen AI is suddenly everywhere. Do you need to go and get a shiny machine learning degree to remain competitive? John Maeda says not to worry. He'll show you how to cook delicious dishes into your coding repertoire with his new show - Mr. Maeda's Cozy AI Kitchen. Visual Studio tay up to date with Visual Studio, the most comprehensive IDE for .NET and C++ developers on Windows. Fully packed with a sweet array of tools and features to elevate and enhance every stage of software development. Here you will learn all about how the Visual Studio IDE is a creative launching pad that you can use to edit, debug, and build code, and then publish an app. Visual Studio Code Microsoft Visual Studio Code is a free, powerful, lightweight code editor for Windows, macOS and Linux. Based on open source, it is highly customizable with over 25,000 extensions, for every developer and every programming language. Data Exposed Data Exposed is all about data; relational and non-relational, on-premises and in the cloud, big and small. Get the inside scoop and join us as we demonstrate features, discuss the latest news and share our love for data technology including SQL Server, Azure SQL Database, Cosmos DB, open-source databases, Azure Arc Data Services, Azure Data Factory, Azure Synapse and more! Azure Developers Azure Developers is your one stop for all things development-related on Azure. Join community standups each week to engage with the folks creating the products including Azure Functions, Container Apps, App Service, Dev CLI, and so much more. Keep up-to-date with regular videos from the product teams to find out what is new, tips and tricks, and full beginner series. Generative AI with JavaScript Learn how to integrate generative AI into your JavaScript projects! Each short, focused episode walks you through key concepts, from connecting to AI APIs to building interactive applications using tools like LangChain.js and Azure. Whether you're new to AI or an experienced developer, the series provides hands-on demos, code samples, and project starters. Check out the playlist and build smarter, AI-powered apps today!"
author = "markdefalco"
year_published = 2025
