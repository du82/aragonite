title = "All Steamed Up"
description = "A look into the multilayered dynamics, between creators and users, regulators and gamers, and the “local” and “foreign” on Steam."
full_description = "S02 Episode 2 All Steamed Up A look into the multilayered dynamics, between creators and users, regulators and gamers, and the “local” and “foreign” on Steam. Aaron Fox-Lerner Read more posts by this author. Aaron Fox-Lerner 12 Oct 2021 • 23 min read This dispatch is the entirety of S02 Episode 2. Illustration by Jason Li. Tianyu: China’s relationship with video games is complex. On the regulatory side, there are strict restrictions on what games are released domestically and who gets to publish them; authorities have also enforced real-name policies in online games and prevented minors from gaming on weekdays. Yet it’s also home to the world’s largest gaming market and major game publishers. Beneath the headlines, gaming and indie game development is...thriving.Krish: Like elsewhere, video games are frequent targets of societal moral panics here, but these come with teeth. Recent waves of regulatory tut-tutting and “guidance” towards the games industry suggest a strong desire to reign in the wilder side of Chinese games culture—controlling not just what games are available, but what these games say.Yuxin: As an indie developer myself, these new restrictions really hurt. To call out a few: 1/ Requiring all in-game text and voice-overs to be localized: sure, that’s fine. 2/ No skeletons, no blood: goes too far but grudgingly work-aroundable, maybe. 3/ Foreign games must work with a Chinese publishing partner: that just means an even smaller slice of the cake, but 4/ recommending “no moral choices” and “no ambiguity about gender” would invalidate and force out so many indie games and developer visions.Tianyu: Which brings us to Steam, the dominant PC games platform where you can still download (and not pirate) video games without the restrictions of Chinese censors, and within the Great Firewall. I’m not a gamer these days, but as a clueless 13-year-old in Beijing I spent hundreds of hours in Grand Theft Auto, which, for better or worse, would never have been permitted to enter China through proper channels.Steam operates in a rare in-between space, both in terms of legality and community, offering a relative enclave of freedom for gamers and indie developers from China.It’s also one of the few social platforms where Chinese players would run into unmediated political confrontations with Hong Kongers or Taiwanese (the discourse is less civil than Clubhouse). It’s no surprise, then, that Chinese gamers have always wondered why the platform has yet to be fully blocked by the Great Firewall, praying that the day never comes.One of those “days'' was the announcement of an officially sanctioned Chinese version of Steam in 2018. The prevailing sentiment (poop emojis + “it’s all over”) is captured here via Bilili bullet comments. Image from Magpie Kingdom.Krish: In the first season of Chaoyang Trap, we’ve covered corners of China’s creator economy, from podcasters to WeChat stickers, to wanghong-driven urbanization. In this episode, Aaron Fox-Lerner looks into the multilayered dynamics, between creators and users, regulators and gamers, and the “local” and “foreign” on Steam.Seen another way, here’s 5000 words on games writer Sisi Jiang’s tweet last month:“Huge if true: maybe Chinese gamers are just like you.”Illustration by Jason Li.Aaron: Chen Guanpeng was studying for a degree in Japan when he played the game that would change his life. In Lucas Pope’s Papers, Please, you play a border guard checking documents in a fictional Eastern European communist state. It’s not a game many would describe as fun, but fun’s not the point: instead the purpose is to force you as a player into a system of complicity, making tough moral decisions as the system you work for crumbles around you.When Papers, Please came out in 2013, it became a standard bearer for the concept of “indie games” as akin to indie music or arthouse film, so much so that it’s become a cliche to cite it as an example of games as art. As a small project that placed meaning above immediate gratification, it was a key example of how games from small studios or solo developers could experiment and focus on artistic expression in ways that were impossible for more mainstream or “AAA” games. Buoyed by digital marketplaces like Steam that enabled direct downloads instead of pricey physical copies, it was one of a new generation of indie games that began to explode in visibility and popularity.“I played [Papers, Please] and I found out that the game was made just by one person. I’d never known that such a thing was possible,” Chen told me one evening this summer, after he’d finished work at his day job for a Japanese media company making mobile games. Originally from Guangdong, Chen used his newly gained access to YouTube outside China to watch tutorials on game-making, and inspired by Papers, Please, set out to make his own game.When his game Booth came out last summer, it was one in a wave of Chinese games, both indie and otherwise, available on Steam, now the preeminent digital games marketplace. When Papers, Please was released eight years ago, it still had to go through a gatekeeping process on Steam called Greenlight. Since then, it’s opened up its process for developer submissions, and tens of thousands of games are listed, with hundreds added weekly.It also has a lot of Chinese players. It’s hard to pin down exact numbers, but different surveys have estimated the number of Chinese players as ranging from 30 to 37.8 percent of Steam’s 120 million users, which means Chinese might have overtaken English to become the most popular language on the platform. So far, so obvious: there’s a lot of people in China, a lot of them play games, it’s a giant market worth a lot of money, yadda yadda yadda.Steam’s large enough to matter, but what’s notable about it isn’t its size. Far, far more people play games on their phones in China than on computers or consoles, and even the Tencent-owned computer games platform WeGame has more Chinese users than Steam. Chinese indie games are also regularly published on domestic platforms like WeGame or TapTap.Instead, what makes Steam crucial for Chinese players is that the majority of its games are as easily accessible in China as they are outside of it. For now, the platform exists in a gray zone: not blocked in China, but not officially allowed either. Anyone can hop on Steam without a VPN, choose from thousands of uncensored games, and pay for them using UnionPay, WeChat, or Alipay.Henry: In fact, you can also VPN into the Great Firewall and buy Steam games at a fraction of the price they’d go for in the West—something I, now a Chaoyang exile, will probably avail myself of.Krish: Steam has been in the crosshairs since roughly 2017, when it started adding fairly powerful community features—user-organized groups, social forums—and centering community content. Sure enough, Chinese developers were early adopters in creating political games on a briefly-free platform. All community pages were swiftly blocked in China right after but, to widespread surprise, the rest of Steam remains operational to this day.Aaron: Steam’s liminal status has benefited Chinese developers too, allowing them to bypass absurdly strict censorship and the laborious, expensive process of getting officially approved for release in China, while still reaching players both at home and abroad. The platform’s now full of all kinds of games from China: passion projects sweated over by hobbyists, schlocky meme games pumped out by obscure developers, polished projects backed by Chinese tech behemoths, anime-style visual novels made by Chinese otaku, and an (un)surprising amount of porn.This has turned Steam into a major part of the Chinese gaming world, a conduit allowing foreign games to find audiences in China and Chinese games to reach audiences globally. An entire Steam-focused ecosystem has sprouted across Chinese social media in response to the platform’s new prominence: Official Accounts (公众号) reposting Western game news on WeChat, users spouting off about over- or underrated games on Zhihu, hours-long game critiques on Bilibili, guides to female friendly games on Xiaohongshu.In a Chaoyang Trap universe crossover, Fuyan-kuma creator Zhishu plays House Flipper.Aaron: The rise of Steam in China has also coincided with a wave of commercial and critical success for Chinese games overseas—and for many of those games, the platform’s been a critical part of their success. In fall last year, the free-to-play anime style RPG Genshin Impact, from mid-sized Shanghai studio Mihoyo, was released simultaneously on mobile and PC (although notably not on Steam) and quickly became one of the most popular games in the world. In January this year, Dyson Sphere Program, a sci-fi strategy sim from a six-person studio in Chongqing, was released on Steam and went on to sell over a million and a half copies. Most recently, Shanghai-based indie studio Pixpil’s gorgeous pixel-art RPG Eastward rocketed up both the Steam and Switch sales charts upon its release last month. And these are only the most prominent of the Chinese hits to have garnered global attention. Others like My Time at Portia and Bright Memory have also earned strong sales, while upcoming games like Black Myth: Wukong and ANNO: Mutationem have successfully generated a lot of hype among both Chinese and global players.Krish: Special shout-outs to the incredible upcoming 躺平 simulator Exhausted Man by Beijing indie studio Candleman. It’s already my game of the year:Yuxin: Great for these devs! It’s interesting that although funding and revenues for indie games in the US now increasingly involve platform deals with storefronts like the Epic Store, Apple Arcade, Oculus Store, Playdate, or Humble Bundle, Chinese indie devs are, so far, still largely committed solely to Steam.Eastward, developed in Shanghai, headlined one of Nintendo’s indie games spotlight presentations in summer 2021.Dyson Sphere Program, by a small studio in Chongqing, briefly topped Steam’s sales charts in January 2021.Aaron: Unlike seemingly any other kind of art or culture from China, Chinese video games have been given the space to be video games first and Chinese second. While it feels like every Chinese movie or novel is forced into a dichotomy of being either a brave dissident statement or symbol of China’s unstoppable rise, both players and games media have mostly reacted to Chinese games on their own terms. Part of this may simply be that there’s nothing distinctively Chinese about the planet-devouring automation of Dyson Sphere Program or the cute, colorful apocalyptic fantasy world of Eastward. Still, it’s not as if any of these recent hits are hiding their country of origin, and other relatively successful games like The Rewinder boast ancient Chinese settings.Christina: I spent a bit of time talking to Chinese indie devs in 2015 or so, and one thing that really struck me was how the Chinese game industry—even the indies!—saw itself then as much more closely aligned to the tech industry than to other forms of media. In the U.S., game developers tend to look to Hollywood studios and filmmakers as their closest peers, and games are clearly positioned as a media product like films, whether blockbuster or indie. In China, probably due to the explosive prominence of the mobile games industry or to the inescapable presence of Tencent (which is arguably as much a games company as it is a tech company), game studios felt and acted much more like startups—corporate slides, rags-to-riches overnight stories, way too much investment funding and all. I suspect the thematic freedom games enjoy is related: tech companies aren’t media, and just get to convert users and make money however they see fit.Krish: Could there be anything more Chinese than this bit of lore from Tale of Immortal, though?Life Goals: disposition like the luster of jade, liked by righteous sects, hated by demonic ones.Aaron: These “international” hits have been matched by a series of games made for Chinese audiences that have mainly gained international attention due to their visibility on the Steam sales charts. Games like Scroll of Taiwu, Chinese Parents, Sands of Salzaar, GuJian 3, Amazing Cultivation Simulator, and Tale of Immortal are hugely popular on the platform with Chinese players while largely baffling or simply going ignored by international games media. Many are RPGs or management sims based in xianxia, the uniquely Chinese fantasy genre, and centered around the idea of “cultivation” (修仙, xiu xian. Put very simply, raising yourself from a mortal into an immortal).Cultivation games tend to have interfaces that can only be described as “Chinese mega app”-esque.Krish: Put not so simply, “cultivation” is sort-of the culmination of a very particular videogame pleasure called “Number Go Up.” You introduce many numbers, within interlocking systems, that can go up, and modifiers to those numbers that can make them go up faster (spoiler: some numbers may go down). Cultivation games require mastery of steep learning curves, with the promise of an immensely satisfying gameplay experience for the patient.Aaron: “Cultivation and some of the wuxia themes seem way too niche for the Western market, and not just niche, but really, really complicated,” Zhu Jingtong, a producer at a major Chinese games publisher and tireless booster of Chinese indies on Twitter, told me. “Even as a Chinese person, I don't fully understand what it means. I was always explaining what cultivation is to non-Chinese people, but I always failed, which means that the cultural barrier is way too high for this particular genre to be popular outside of China.”As a story-heavy RPG with a decent English translation, GuJian 3 has proven slightly easier for the media to cover than hyper-complex sims like Amazing Cultivation Simulator, garnering comparisons to The Witcher and Final Fantasy. But as a fan of classic wuxia who’s often annoyed by the genre’s higher fantasy offshoot, the game’s overly complicated, melodramatic story embodied much of what irks me about xianxia.Yuxin: xianxia is awesome 🥺.Aaron: Right, it doesn’t really matter if I liked it: the game has its own intended audience, and I’m simply not part of it. “I do think that these games are made for Chinese people by Chinese people, so I don't think it's a problem or anything,” Zhu said. “Games that are not xianxia, wuxia, or games that are not too Chinese can find a bigger audience, especially more modern ones like Dyson Sphere Program.”The Rewinder’s gorgeous pixel-art “World of the Living” (i.e. Chaoyang district).Krish: It’s interesting to think of Chinese indies as a retelling of the last decade of global games discourse. Game Studies as an academic discipline is dire here, and concepts like “ludonarrative dissonance” never made it into mainstream game or meme discourse. Chinese indies, in contrast to their global peers, are less afraid of maximalist interfaces a"
