full_description = "Season 2 Episode 9 China Dreams of Electric Words The curious case of the “Electronic Dictionary”: BBK master race + dither punk sinofuturism + playdating for two decades + homebrew tamagotchi Jesse Young Jesse Young 6 Apr 2022 • 18 min read S02 Episode 7 *NSFW* S02 Episode 7: Horny on Mainland Pornography in China: desiring the potato queens + erotic-cultural imperialism + porn stars as teachers + smut hooliganism Chong Liu & Runze Ding Chong Liu & Runze Ding 10 Mar 2022 • 22 min read S02 Episode 6 Shaxian Can't Be Fucked With We investigate the Shen Yun of fast food joints, the dollar pizza of urban China, the country's favorite drunk carb fix: Shaxian Delicacies. Zoe Mou Zoe Mou 22 Feb 2022 • 7 min read S02 Episode 6 Putting the Hack in Hakka Noodles Pizza dough radicals + The secret history of Shaxian Foods + “a very sad flowchart” + the Chongqing noodle gentrification theory Yan Cong Yan Cong 22 Feb 2022 • 10 min read Rewilding Rewilding #3: Rear Waves An evolving dictionary of the Chinese web: Receding dreams + cut chives + positive energy orgies + Chinese youth react to daddy vibes Yi-Ling Liu Yi-Ling Liu 25 Jan 2022 • 7 min read S02 Episode 5 Assassin’s Screed “No hookups, yes Jubensha” + more Sleep No More + a history of escape rooms in China + the revolutionary potential of bad endings Henry Zhang Henry Zhang 11 Jan 2022 • 13 min read S02 Episode 4 The Cloud in Sally Rooney's Room Is Sally Rooney the undeniably universal millennial experience as the rest of the world claims? Jaime interviews Na Zhong, the Simplified Chinese translator of Sally Rooney’s three novels to date, to find out Jaime Jaime 9 Dec 2021 • 9 min read S02 Episode 4 The Zine and the Unseen Why China’s fashion magazines are losing their edge + class over sass + “Capitalism sucks for everyone” Denni Hu Denni Hu 9 Dec 2021 • 17 min read Rewilding Rewilding #2: Wind Vents & Flying Pigs In Part 2 of a new series, we discuss Flying Pigs and 风口-pop philosophy. Yi-Ling Liu Yi