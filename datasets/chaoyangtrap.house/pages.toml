full_description = '''S02 Episode 7 *NSFW* S02 Episode 7: Horny on Mainland Pornography in China: desiring the potato queens + erotic-cultural imperialism + porn stars as teachers + smut hooliganism Chong Liu & Runze Ding Read more posts by this author. Chong Liu & Runze Ding 10 Mar 2022 • 22 min read In the house this week: Chong, Runze, Jen, Simon, Yi-Ling, Krish, Tianyu, Jaime, and 咸湿佬.Krish: Hello. Just a heads up before we um get into it: 🔞 everything that follows is NSFW.In this episode, we’re talking about pornography and desire in China. We discuss why porn matters, how sexualities are constructed, and where these conversations unfold. We try to delineate between porn culture and actual porn, to look at what that tells us about everyday life on the Chinese web.Tianyu: As Jiang Zemin told Mike Wallace in his famous 60 Minutes interview, the Chinese government’s initial justification of internet censorship was that they needed to ban pornography (“sometimes there is also unhealthy material [on the internet]—especially pornography on the Internet—which does great harm to our youngsters," he said).But ironically I’ve heard many anecdotes of people having learned about censorship circumvention tools not because they were interested in dissident politics, but that they had to use a VPN to watch porn.Yi-Ling: The cute cat theory, except the cute cat is porn.Tianyu: This had the adverse effect of, well, people curiously tiptoeing around political boundaries after being introduced to the uncensored internet originally for the purpose of porn consumption.Krish: Porn is, to quote Richard Dyer, “too important to be ignored, or to be left to the pornographers.”The heart of this episode is a conversation between two incredible researchers—Chong and Runze—swapping field notes, thoughts, and theories with the rest of the group. We cover everything from powerful yearning to whatever stage of horny this tweet represents:We’re so excited that Chong and Runze agreed to talk about their work here. Chong Liu is a sociologist who researches youth experiences with sexuality education and social stratification in China, and is also a teacher and consultant on sexuality education. She's done fieldwork among high school students around Tianjin. Runze Ding is a post-doctoral researcher whose work spans porn studies, new media, and online queer experience in China. He has done fieldwork with local gay communities in Beijing and Guangzhou, interviewing over 80 demographically diverse gay men about their lives and sexuality.Over to you both and, again, a reminder:This episode is 100% NSFW.[DOC/36K] 【CYT0207】ChaoyangTrap.aviIllustration by Jen RaoChong: Let’s start with some fundamental premises.1: Porn is a cultural product in China.We can see it as the output of overlapping social, cultural, and political contexts, a means to help unpack the youth experience.Runze: This is so true. Porn matters as a cultural phenomenon, and it especially matters to gay men. Richard Dyer defines gay porn as “a form of representation that can be the site and occasion for the production of bodily knowledge of the body.”There is high demand for locally-produced (both amateur or semi-professional) porn videos within the Chinese gay community, which suggests that the reason for this “popularity” is not just novelty but also the big gap they fill in the market. The visibility of sexualized Chinese gay male bodies, per se, has cultural and political significance. A means of showing gay men’s “ability to do sex.”Chong: This leads to our next premise.2: Porn has a long history in China, and that history informs the present.It’s notable that the oppressed social and political circumstances of the last half century did not reduce, well, horniness, even if porn could lead to arrests and punishment. The popularity of so-called hand-copied literature (手抄本) during and after the Cultural Revolution is revealing about how youth at the time experienced their sexuality. They would reinterpret the literature they were exposed to while copying, adding descriptions about lesbian sex, exotic places and so on. These risky reinterpretations show how the youth, subjectively, wanted to access sexuality-related information and challenge the mainstream discourse about sexuality even during peak Maoism.Cultural Revolution-era memoirs like Anchee Min’s Red Azalea describe, in vivid detail, erotic yearning and sexual frankness among Red Guards and sent-down youth.About half a century later, when I conduct my fieldwork and interview my student participants, almost every single one of them can talk about porn. Some of them even share the names and features of their favorite porn stars with me without feeling timid. These include Chinese stars (from unlicensed porn-centric apps and websites), some Japanese ones (e.g. Sola Aoi, Yui Hatano, and Erika Momotani), and some white actors (they did not remember their names but did remember their faces).Runze: Yes, Chinese gay men are also certainly not shy or reticent in talking about their porn consumption. Some of them are even willing to share their experiences of producing pornographic content. In a recent co-authored study, which explores Chinese gay men's self-made sex videos on Twitter, I also found that many Chinese gay men are more open about this subject than I would have expected. Reflecting upon my experience, I believe pornography is not a taboo topic for many young Chinese (gay) individuals who were willing and happy to share their stories about this.Spread from MISSIONARY, a LGBTQ magazine in China whose third issue (2021) explored queer porn: “The lack of sex education in China has burdened sex with unnecessary stigmas. But has the relatively open Western society really liberated sex?”Chong: That said, there is a paradox here: this “openness” is set against a reluctance, a suspicion, a kind of moral judgment, whenever porn is mentioned. This is our third premise.3: Porn is illegal in China, and this illegality colors the manner and texture of its consumption.This dynamic within the porn ecology in China is quite note-worthy. Referring to the policies and laws, such as the Criminal Law of The People’s Republic of China (1997) and the Law of the People’s Republic of China on Penalties for Administration of Public Security (2006), nobody can access porn legally as it is against the law to manufacture and disseminate porn. Watching porn, although not technically illegal, still could carry risks since “producing, transporting, duplicating, selling, and renting out” porn could be seen as breaking the law. Moreover, the definition of each is not usually clear.The CEO of QVOD, which ran the streaming app Kuaibo (快播) that became a “must-have” sex-streaming software in the mid 2010s, was arrested and sentenced to 42 months in prison. Hand-in-hand with this “transgressive” reality is porn’s connection with aspiration. One of my fieldwork participants, a boy, told me he thought watching porn was like a habit to him, and it maybe even had nothing to do with his sexual desire. He had two elder sisters, and he was the little son in his family. His parents, therefore, had set a “high standard” for him and wished for him to go to one of China’s top universities. Referring to a study focusing on youth porn watching in Taiwan, the motivation behind habitual porn watching is linked to high expectations from parents and society. Porn thus becomes a shelter to youth to help them escape the pressure, frustration and boredom in the competitive circumstances brought on by the implementation of the One-Child Policy and neo-liberal demands.A short Arrow Factory documentary about the market for high-end sex doll manufacturing in China.Runze: The anthropologist Lisa Rofel writes in her book Desiring China that “the specificity of neoliberalism in China lies in the production of desire”. I am in total agreement—the idea of “desire” is the key to understanding China's social transformation over the past several decades. What is more related to the idea of “desire” than porn? By understanding how porn is produced and consumed in China, the complexity of the construction of sexualities in China can be unpacked.Books like James Farrer's Opening Up stress that commercialisation and neoliberalism aren't the only factors influencing changes in China's youth sexuality - "the transition to a liberal market society highlights individual motives as a source of moral crisis," usually involving complex social issues like dignity.Chong: In the late 80s, and especially after the student movement in 1989, porn was assumed to be the result of bourgeois liberalization, a symbol of a “decadent capitalist way of life.” It was common to link porn watching to criminal activities, and to link “deviancy” in sexuality to crime. The specter of hooliganism (流氓罪), raised in the 1970s, and although retired in 1997, still has a deterrent impact on society. The word “hooligan (流氓)” is still frequently used in a school setting, and in my research amongst youth, the ones who talked about sexuality-related topics, even if just to express their confusion, told me that they would be gossiped about or publicly shamed.That reminds me of a very interesting thing that happened recently. I went to the pub near my university in the UK with a group of Chinese PhD students. After I introduced myself, a female PhD student slut-shamed me and asked, “how many men have you ever touched?” I was (and still am) not even close to her!A still from photographer Li Yushi’s ‘Your Reservation is Confirmed’ project, which subverts common erotic imagery by centering male rather than female bodies. Featured on the Far & Near newsletter.Runze: I think there are also political and technological dimensions in reading, watching (or producing) porn. We need to stress that the making and distribution of sexually explicit materials (homosexual or heterosexual) is illegal in China, and the government has increasingly tightened its control and censorship of pornography on the internet. Despite these efforts, it is not difficult for the public to access porn, particularly for those who live in more economically developed areas.Results from the 2006 Sexuality Survey of China showed that 51.1% of participants had seen sexually explicit media content (such as images and videos) in the year before the survey was conducted. By 2010, this percentage had risen to 65.8%, of which 25.9% had actively searched for sexually explicit content, including texts, pictures and videos. VPN use is common since the Great Firewall actively blocks most porn sites or platforms where porn might be hosted.91porm, likely a shanzhai/backup version of the popular 91porn. Twitter is a (surprisingly) important hub for Chinese pornography.Tianyu: The most popular board on Caoliu (草榴社区), China’s most famous porn BBS, is a current affairs forum known as “technical discussion area” (技术讨论区). In between NSFW posts are, in fact, uncensored discussions about international politics and domestic policy, as well as reposts of censored WeChat articles.But I think this porn-to-politics, nudes-to-news pipeline has also shifted to Twitter, where a lot of Chinese people came for the porn and stayed for the minyun keyboard warriors (mostly men) of Sinophone Twitter.In most of these circles misinformation is rampant, and most are bad takes; still, I’d love to read a paper on this if anyone is interested in an investigation.Chong: Despite the hard censorship, Chinese people can and always find ways to access pornography. I remember during the first day at the vocational school which was my research site, a few boys approached me during their lunch break in the playground with my research information sheets in their hands. They asked me the reason why I wanted to carry out this research. ‘You research sexuality, right? Is it not about porn and all that mature stuff?’ they giggled, and then one of the boys continued to ask, 'would you not feel shame when you talk about them?' I soon identified it as an opportunity to build rapport with them by saying that there was nothing right or wrong in talking about sexuality, and it was all about personal choice to watch and read porn. After hearing my response, these boys were no longer confrontational and showed their strong interest in my research, then asked me how they could participate in my project.Runze: I also experienced a similar thing in my fieldwork. When I asked my participants how they “realised” their same-sex desires, many of them answered “porn”. Some individuals found that when they were watching straight porn with their mates, they were less attracted by the female actor, but rather stimulated by the male ones. Some participants also told me that it was watching gay porn that let them “confirm” their sexuality.A screenshot from Mirror, China’s most popular hentai porn game with close to 5 million players. It’s the first among many, many hentai porn games on Steam. We wrote about this in Episode 2 of Season 2. Chaoyang TrapS02 Episode 2: Press F to Review BombIn the house this week: Aaron, Yuxin, Jason, Christina, Simon, Krish, Tianyu, and Henry. Krish: Welcome to Episode 2. This is the first in a two-part series about video games in China…Read more5 months ago · 8 likes · Tianyu M. FangYi-Ling: I wonder how porn is defined and categorized, and how that definition has perhaps shifted over the last three decades (especially, when it comes to defining legality of content.) Is content that contains same-sex desire more likely to be labelled as “porn” than heterosexual content that is not? (i.e. Danmei literature?) I also wonder how porn fits in the discourse of the “vulgar,” as labeled by various state censorship organs. Is there an overlap between pornography and the “vulgar?” Or are they now kind of siloed into two wholly separate categories, in the eyes of content consumers and content regulators?Krish: Just from my specific niche as a former social media manager for Chinese brands, most platforms just use crude, sometimes hilariously excessive, filtering for “黄” content that they see as pornographic. Images I've had to delete after being labeled porn have included, over the years, photos of crowd surfers, an illustration of a baby in a onesie, a punk band singer screaming into a mic, and a beer poster that was vaguely flesh colored.This was a really bad day at work for me lol.咸湿佬: We talk about this a little later on, but I think it’s worth emphasizing that (although I guess maybe Chong or Runze would have some actual data on this) the heavy regulation of porn in China seems like it has actually resulted in a lot more amateur porn in China than other markets. That heavy reliance on amateur porn to fill the ‘gap’ has also created huge online communities that I don’t feel like exist at the same scale elsewhere—I don’t know if there are really any sites in other places that have the level of activity or influence that Caoliu or 91porn seem t'''
