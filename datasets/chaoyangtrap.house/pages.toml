full_description = "S01 Episode 1 China’s First Listeners Podcasting is having a moment in China. “Podcast lover” has now entered the hallowed lexicon of China Tinder Guys, joining such legends as “travel enthusiast,” “gym fanatic,” “crypto nerd,” and “cat owner.” Caiwei Chen Caiwei Chen 9 Mar 2021 • 6 min read S01 Episode 1 Rich Kids English Police, and IG’s Chinese Meme Boom @richkids_english_police started as a private meme stash in late 2016. It’s led the recent rise of Chinese-language meme pages on Instagram. Tianyu M. Fang Tianyu M. Fang 9 Mar 2021 • 7 min read"
