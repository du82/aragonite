full_description = '''S01 Episode 8 (Chinese) Dudes Rock Nihilistic self-improvement + Tinder guy reacts to Feminism + The Virgin/Chad/Speedrunner spectrum Caiwei Chen Caiwei Chen is a writer, journalist, and podcaster. She cooks with boxed ingredients but tries to finish all her dishes with a gourmet touch. More posts by Caiwei Chen. Caiwei Chen 15 Jun 2021 • 25 min read This dispatch is the entirety of S01 Episode 8. Cover illustration by Lisha Jiang.In the house this week: Caiwei, Lisha, Diaodiao, Yi-Ling, Tianyu, Yan, Jaime, Ting, Krish, Simon, and Henry.Jaime: Welcome to Episode 8.A friend shared a meme recently that goes “Chinese parents wait their whole lives for their children to be grateful; Chinese children wait their whole lives for their parents to apologize.”Growing up with a younger brother, I have been cursed to witness all the ways men have failed their sons. Gender essentialism notwithstanding, it is natural for us to want to learn from people who look like us.So while structural inequalities, misogyny, and the patriarchy still make it hard and annoying to be a woman in Chinese society, on a personal empowerment (or even representational) level, it is not hard to notice signs of change. All around us—pop culture, media, social media, fashion, advertising, “content,” literature—there are so many more ways for women to see and hear how they ought to be. (Whether or not these products or ideas are capitalizing on the “feminist” zeitgeist, at least the possibilities are expanding.) Similar cultural education simply isn’t as ubiquitous for guys.If I were a 22-year-old boy who just graduated from college, applying for my first job, want a girlfriend but don’t know how, and I don’t really have anyone in the family to look up to, where do I look instead? What can I do so that I don’t end up like my shitty dad? How do I know who I want to be?Krish: This episode came out of the realization that we knew very little about these “playbooks” for how to be a dude.Our understanding of the global “manosphere” (everything from incels and GamerGate to soyboy discourse and red-pilling) felt inadequate when considering the state of Chinese masculinity. So Caiwei had to heroically stumble down some cursed rabbit holes to bring you this deep-dive.We profiled three influential men of the Chinese manosphere, rough equivalents to Joe Rogan, Tim Ferriss, and Naval Ravikant. While they are not considered mainstream figures, their stories and courtship of an urban middle-class audience form one chunk of the millennial masculinity iceberg. One that illustrates some of the larger stakes of what this generation of men are facing.Read till the end. Our outro song this week tells a story of what happens when fragile masculinity turns dark, and how a resilient feminism responds.The Dusk of Chinese MasculinityBy Caiwei ChenCaiwei: Is masculinity at its breaking point? Outside China, the question has dominated public discourse for years, as waves of crises and feminist critique unravel patriarchy’s pervasive toxicity. Traditional masculinity, an ideal characterized by athleticism, stoicism, aggression, and dominance, seems to be waning as the sole ideal for what men should be. At least in popular culture, a more androgynous, gender-fluid vision of masculinity, represented by men like Timothée Chalamet, is going mainstream.Something similar is taking place online in China. In the past year, feminist icons have sprung up from different social classes and backgrounds, without corresponding male equivalents. Recently, China's Education Ministry even published plans to counter the so-called "feminization" of young men, calling for a return of “the spirit of yang” (“masculine energy”) in younger generations. Underlying the state’s anxiety is a deeper crisis: Men are confused and lost. Who are their new icons if traditional male idols like “Wolf Warrior” Wu Jing 吴京, and figures like TV host Zhu Jun 朱军 or author Xiong Peiyun 熊培云 (both accused of harassment in #MeToo cases) have become out-of-date and cannot stand up to scrutiny?I started to look into the question, and discovered three interesting examples from urban China—taking baby steps towards a more expansive idea of masculinity. Steve Shi, Derek Huang, and Zhang Xiaoyu are three figures on the Chinese self-help scene, who each appeal to different groups of modern Chinese men. But they share one thing in common: they all tap into a certain core anxiety men are experiencing, be it spiritual, interpersonal, or moral.Let’s start with the spiritual.12 Rules for Steve Shi’s LifeSteve Shi (史秀雄), 35, has had a surreal character arc as a thought leader—a former Jordan Peterson disciple who reinvented himself as a liberal icon.Based in Shanghai, Shi is a psychotherapist, podcaster, and writer. On social media, he is also a charismatic self-help guru, a feminist ally, a queer ally, and a promoter of “healthy masculinity” to China’s lost young men.The bulk of Shi’s online presence is in two podcasts: Steve Says (Steve说), which features longform conversations with friends, and Man Li (Man立), a podcast on modern masculinity in China that he co-hosts with dating coach Wu Guangmin (仵广敏). Steve Says, in particular, is his calling card—started six years ago and now a magnet for China’s social media royalty. It’s directly inspired by The Joe Rogan Experience.Shi arrived on the podcasting scene in 2015, much before the medium’s popularity took off around 2018. He started off either monologuing or interviewing his friends (episode 2 of Steve Shuo features his college classmate), gradually expanding his roster to fellow creators (episode 4 features a friend who blogged about “getting a boyfriend in 30 days”), and eventually to a popular show for prominent online figures. The show is currently at 238 episodes.There’s quite a range: in episode 172, Steve talked about how he wants to hug all his fans in Wuhan after the pandemic, while episode 208 features Liu Min of popular indie band Re-Tros shooting the breeze about her love of pop psychology. Long-term listeners could really feel invested in Shi’s trajectory of change—from a clueless straight bro to an empathetic husband. He’s opened up about overcoming stereotypes, acknowledged that crying doesn’t make him less of a man, had his thinking overturned by guests on the show, and encouraged men to practice compassion towards their female partners and friends.The default thumbnail for early episodes of Shi’s podcastWith 6 million podcast listens on the Ximalaya platform and over 200,000 Weibo followers, Shi had already built a sizable audience before his big break: Jordan Peterson. In January 2018, Peterson trended on Chinese social media after his interview with Channel 4’s Cathy Newman. “Confrontation between white-left feminist host and the hardcore reasoning of Jordan Peterson” (白左女权主持人与硬核理性乔丹·彼得森巅峰对决) read the title of a widely circulated video on Weibo with Chinese subtitles. This was around the time when Weibo’s feminist discourse was making its way into the mainstream, still largely uncensored—a time when the #MeToo movement began to spread across China, and a time when the now-prolonged war between progressive feminists and nationalist misogynists broke out.Shi, who’d taken two classes with Peterson as a student at the University of Toronto, played a key role in China’s Peterson craze alongside Ma Mengjie, known as Big Heart Paipai (大心脏排排) on Weibo, around this time. A study-abroad student based in Germany at the time, Ma made it her personal mission to introduce Peterson’s philosophy to a Chinese audience. The Chinese title was catnip to Chinese conservatives: a hatred of political correctness, disillusionment with western progressives, and a fixation on “hardcore” rationality. Ma’s translation also boosted the popularity of the word “baizuo,” which directly translates into “white left,” and has since been appropriated as a reactionary weapon, even making it into the global alt-right’s lexicon.Shi presented himself as a moderate voice in the feminist-Jordan Peterson debate, pointing out where he agreed and disagreed with his professor. As he wrote in a Weibo post (translation by me), “Cathy Newman is a terrible interviewer and she misrepresented Peterson's opinion. Peterson is not against transgender people or gender pronouns, but the governmental enforcement of them. Social justice warriors in the west have seriously damaged North America's freedom of speech, and that's a context a lot of Chinese netizens are not familiar with.” Shi also pointed out Peterson's limitation: “Evolution and biology are indeed not Peterson's expertise, so some of his remarks might seem immature.”Shi on the promotional tour for his translation of Peterson’s book, posted on his public Facebook page in 2019To Steve, Peterson’s social critique was specific to the West’s problems, but his self-help content was far more universal. Shi actively reached out to publishers to translate Peterson’s 12 Rules for Life into Chinese, which eventually landed him a translation deal with Cheers Publishing in Beijing. The book sent Shi on a speaking tour all across China, where he met Wu Guangmin, his future co-host on Man Li.Another Peterson stan, Wu resonated with Shi almost immediately. To the (then) young and puzzled Wu, discovering Peterson was like getting a daddy he never had—a strict yet forgiving figure, and a role model for masculinity. Wu’s fixation on Peterson led him to write a master’s thesis on the Peterson fandom, in which Wu confronted the absence of a similar figure for most male Chinese youth.The idea of starting Man Li came naturally for the two—a conversation about what masculinity really means in China today. “Traditional masculinity places little emphasis on individuality and independent thinking, that is something I am extremely critical of,” Shi wrote in an email. “I’m also very critical of men’s lack of knowledge of intimacy and sexuality, which seems to me a key factor in men’s health as well as gender equality.” Shi believes that masculinity is, like “femininity,” not a monolithic experience, and Man Li’s content and guest list tries to reflect that belief.The header image for Shi and Wu’s Man立 podcast.In Man Li, Steve and Wu discussed every item their female counterparts would discuss in an edgy feminist social critique podcast, from representation in pop culture, to queer awakenings, to a playbook on modern dating. They have invited guests such as Zhu Junyi 朱浚溢, a visually impaired mental counselor; Wei Wei 魏伟, a professor of queer theory; and Harry, a gay illustrator who mostly paints male genitals. “Masculinity (n.), plural.”How does Shi square these circles? How can someone who built his influence backing Peterson, then rode a wave of feminist backlash on the Chinese web, now be an ally to the marginalized? Is he a rare voice capable of straddling China internet’s ideological divides, or another opportunist that tries to ingratiate himself to both sides of the conversation?Shi positions himself as a neutral, “rational” voice. This means that on Weibo posts and podcast episodes, he can back his senpai Peterson’s refusal to use gender-neutral pronouns, while showing allyship to feminists and the queer community. He can criticize social justice warriors in the west for “suffocating freedom of speech,” but also use his platform to amplify the voice of Xianzi, a survivor and plaintiff of a landmark #Metoo case in China against Zhu Jun. He advocates for self-discipline, speaks against plus-size trans model Jari Jones’ appearance in CK campaign, and encourages men to embrace their vulnerability—all seemingly in the same breath.Tianyu: It's particularly interesting how social conservatives in China (and elsewhere) often pose themselves as a centrist voice. They aren’t keen to defend social injustices; rather, they acknowledge the problems and then move on to say the solutions are too radical, that they’d rather sweep the issues under the rug.Caiwei: As host and podcaster, Shi is a natural—he’s sincere, eloquent, engaging, respectful, clever, yet approachable. In episode 207, while discussing takeaways from past relationships with fellow podcaster Meng Chang, Shi admitted to his own shallowness when replying to Meng’s arguments. “Men are dumb,” he said. “I’m so lucky that my partner is a resilient woman who would challenge my macho views.” Above all, his humility and willingness to change his mind lets his guests’ points of view shine. He is the nice person among the smart people, and the smart person among the average people.“My position is more dialectical,” Shi wrote in emailed replies to my questions. “I do not take sides. I perhaps can be said to be a centrist or moderate, because I know from my psychological counseling work that most issues are very complex. Taking sides and harsh criticism can not change anything.”But can’t they? Shi’s own evolution bears this out. “At first [in 2018] I found my perspectives more conservative, including being more critical of political correctness, but I am slowly reconciling the balance of conservative and progressive,” he said. Shi is still pessimistic about the dynamic of gender discourse on social media today, believing more substantial change in gender equality should come from the policy level.Diaodiao: This is intriguing. Is he going for a “armchair online critics can’t create real change” position, a “women’s rights needs to enter the chat'' hot take, or a “we need to actively participate in shaping policy” pivot? This could be interpreted as radical or conservative, and knowing Steve, the ambiguity is probably the point.Caiwei: Speaking to Shi, you can tell he’s still thinking things through, willing to change, to reconcile the contradictions of the personal and the political. Self-awareness is the thing he thinks Chinese men lack the most, and his solution feels both important and a bit of a cop-out: “start a conversation.”But is that conversation merely running in circles? My last question for Shi was one he asks his guests on Man Li all the time: “Who’s your role model as a man?” For Shi, that used to be Peterson, but now he hopes that he, himself, could be that role model for younger boys. He recognizes that the journey of becoming this ideal could be a long ride. “I know it doesn’t happen overnight, and I am ready to take time to accumulate and prepare,” Shi said. “In that sense, I’m trying to be a role model for masculinity at large”.——Jaime: What if this "neutral and rational referee" is Shi’s ideal of masculinity? Someone who can "moderate" his way through difficult conversations, putting controversial ideas on the table without offending any sides, a benevolent authority figure?Krish: Shi sounds like he’s one personal crisis away from selling protein supplements. I’m reminded of Hussein Kesvani’s analysis of male Youtubers, where he points out that their disparate (“moderate”) politics are often by design, because despite all the'''
