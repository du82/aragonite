description = "Why China’s fashion magazines are losing their edge + class over sass + “Capitalism sucks for everyone”"
full_description = "S02 Episode 4 The Zine and the Unseen Why China’s fashion magazines are losing their edge + class over sass + “Capitalism sucks for everyone” Denni Hu Read more posts by this author. Denni Hu 9 Dec 2021 • 17 min read In the house this week: Denni, Jaime, Lisha, Na, Yan, Krish, and Simon.This dispatch appeared in S02 Episode 4, along with The Cloud in Sally Rooney's Room by Jaime. Cover illustration by Lisha Jiang. Jaime: Hello friends. Our two stories this week are about creative agency (or the lack thereof), translation, and why people get mad about Ideas without looking at the structures in which they’re produced.Last month, at the Art'n’Dior exhibition unveiled during Shanghai Art Week, photographer Chen Man's magazine work from nine years ago dredged up controversy and an onslaught of hate posts on Chinese social media.i-D magazine covers by Chen Man in 2012.Photograph by Chen Man at the Art’n’Dior exhibition in Shanghai in November 2021.Netizens and state media accused her of perpetuating Western stereotypes of the “Asian small eye” look in the “gloomy” portraits of Chinese women of minority ethnic groups, for which both she and the luxury brand apologized a week later. The photo was removed from the exhibition. The anti-intellectualism of this strain of nationalistic cancel culture aside, to what extent are fashion editors and artists responsible for decisions that are the results of more fundamentally problematic ways modern fashion media has been set up in China, especially in relation to the luxury and fashion industry?Cover of Harper’s Bazaar China featuring Rihanna by Chen Man, August 2019.Legacy print publications everywhere in the world are haunted by the failure of the advertising business model to adapt to the compromises between capital and editorial integrity, resulting in the common scenario where if the brand asks for certain editorial content from a title and the editorial team fails to comply, the sales team would apologize to the brand and offer to compensate with even more editorial content. Coupled with the burden of representation and struggle to shape and assert some form of “Chinese” identity through beauty and style on this misappropriated stage, no wonder everyone is mad, someone is always apologizing, and no one is having fun.Who are fashion magazines even for anymore? What gets lost when media serves brands and advertisers rather than readers? Who will decolonize fashion magazines? (Not a 27-year-old Australian-Chinese fashion blogger.)From one media industry worker and insider’s perspective, there are more frustrations and questions than solutions in what might be the first op-ed in Chaoyang Trap. We hope that this open letter of sorts will provide some context to how we think about the conflicting interests of globalized capital, beauty’s potential, representation, and creative agency. What if more money does not translate to more power for the individual?What if capitalism sucks for everyone?The Beautiful, Glossy Lies of China’s Fashion MagazinesDenni: China’s fashion magazines are not thriving.They’ve ceded their power to brands and celebrities, and their sense of style is increasingly disconnected from reality.Fashion and power are, of course, eternal topics in this industry defined by beauty and creative forces. Yet the rise of Chinese consumer power didn't help propel established Chinese fashion media forward—their insignificance only accelerated by the increasing demands of the brands that support them and an over-reliance on the advertisement business model after the internet’s disruption. Chinese fashion magazines have peddled a narrative of a westernized ideal of womanhood—the “fiction” of an independent woman who can become a western ideal through her purchasing power.Only until the rise of China as a global power did magazines seek to catch up, stressing a need to express Chinese femininity and modernity. Yet, most portrayals, as in Chen Man’s case, tended to look at the Chinese woman as a symbol instead of a real person—a warrior-like figure, a guardian of Chinese heritage and culture. Coupled with blatant branded content, they created an easy target for online criticism. At the root of such misunderstandings was the clash between the westernization of the Chinese woman and real Chinese women.Jaime: #weareallmulanA meme of actress Vicky Zhao Wei on the cover of Vogue China in August 2021, who was briefly scrubbed from the Chinese internet and is now apparently reappearing again.Actual spread from Vicky Zhao Wei’s cover story in Vogue China, August 2021.For fashion magazines, creative freedom is often not free but handicapped by the bottom line. Before the recent crackdown on celebrity culture, fashion publications had seemingly found a way to balance monetization and localization: the “ageless cuteness” of Chinese celebrities like Angelababy, Yang Mi, Xiao Zhan, and Jing Boran drove traffic and created immediate hype, which easily converted to magazine sales. An issue of Harper’s Bazaar e-magazine featuring Xiao Zhan and Wang Yibo sold over 1.26 million copies at 6 RMB per copy. You can see why magazines became so keen on chasing after celebrity culture, right up until the party came to an abrupt end.But this is only one of the many paradoxes in the contemporary fashion media landscape.Covers of two state-run magazines, China Pictorial from 1976 and Women of China from 2012, exemplifies the changing image of ideal women in the official narrative. Courtesy of Dr. Yige Dong from her recent presentation.Short Colonial History of Chinese Fashion MagazinesThe first modern day fashion magazine was《时装》(Fashion), founded in 1980 and coinciding with the era of Reform and Opening Up. Almost a decade later, Elle China became the first syndicated fashion title in China. In 1992, Louis Vuitton opened its first shop at Beijing’s Imperial Palace Hotel, followed by Hermès in 1997 and Chanel in 1999. Brands entering the market further propelled the growth of magazines, since they needed a local voice to spread their savoir-faire gospel. Harper's Bazaar, Elle China, and Vogue China soon became the holy trinity of fashion magazines in China in the aughts, whilst establishing the three Devils that Wear Prada—Angelica Cheung, Xiao Xue, and Su Mang—who almost collectively came from business, rather than editorial, backgrounds.Vogue China founding editor-in-chief Angelica Cheung in her iconic asymmetrical bob; former editor-in-chief and CEO of Elle China Xiao Xue always holding a book; former editor-in-chief of Harper’s Bazaar China Su Mang hosting a Cartier bracelet party on her right arm.In theory, magazines could pick their own editor-in-chief, but technically they never had true editorial power since all magazines and their ISSN numbers were owned by the Chinese government. Local fashion glossies existed as syndications, with censors having final say on all editorial content. Homegrown publications such as iLOOK, launched in 1998 by culture personality Huang Hung and dubbed “a magazine for women with brains,” also garnered attention, but major fashion advertisers still favored Western glossies in general. 《明日风尚》(Ming), launched in 2007 by Hong Kong’s Ming Pao Weekly’s EIC Jessica Wong (黄宝玉), provided “a window, a mirror” to the global cosmopolitan class, but folded in 2015.Magazines became a fashion education for many and saving up for the latest issue of Vogue was my monthly ritual. Before the internet, magazines could afford insane ideas with overflowing budgets. Often shot by globally renowned photographers like Mario Testino, Tim Walker, with international top models on the cover, these glossies provided joyous beauty and surprise: fashion was a key source of entertainment, fashion was “literature”, fashion was digestible art. It made 10-year-old me feel alive, and for a while, I was certain that becoming a magazine editor was my true calling. I still remember marveling at a 2008 Maggie Cheung cover, where she was covered in a badminton ball dress designed by Martin Margiela, to celebrate the Beijing Olympics. Other fashion magazines fought for prime spots on the newsstand, Modern Weekly's Fashion section introduced the avant-garde to the mass, Men's Uno emerged with its ratchet sexual energy, every other cover with Zhang Ziyi or Fan Bingbing would be an event in itself.Cover and interior page of the debut issue of Fashion, China’s first fashion magazine, published quarterly by Foreign Trade Publishing House and “ready to make contributions to the promotion of trade between China and other countries.”Modern Weekly‘s Style and Fresh section, published weekly by Modern Media.Yan: Denni’s personal story with fashion magazines resonates with me so much. When I was a 6th grader, I’d save up pocket money to buy 瑞丽 The Ray, a Japanese syndication, which had three different magazines (服饰美容，伊人风尚，可爱先锋) targeting young women of all age groups, from office white collars to teenagers. It sounds funny to say this now, but at the time it gave me the idea that my sense of self can be constructed by how I look—even though I could not afford any fashion items recommended by the magazines (and I had to wear school uniforms everyday).The very act of reading them helped construct my identity, in a weird way.There were also other Japanese syndicates such as 昕薇 (Vivi) and 米娜 (Mina) that were well-received in 2000s China. These catered more towards a so-called “East Asian aesthetic,” making them popular among Chinese readers. Maybe this was why I was drawn to them in the first place—being able to see someone who looked like me on the cover when I passed by newsstands. The Ray also cultivated a group of models who went on to become full-blown celebrities in China, like Yang Mi and Gao Yuanyuan.Vivi from 2004 (left), and The Ray from 2020 (right).Denni: Fast forward to 2020: The old guard that had crafted the fashion magazine landscape left the scene almost simultaneously. These ambitious women more or less found traditional media limiting and left at a time when ad sales numbers in the reds made exiting seem like a natural decision. (According to Statistica, annual magazine ad revenue is expected to drop almost 18% from 2020 to 2023.) They found their second life scattered across industries, be it investing, e-commerce (微商), or sustainability marketing. They also left behind a legacy and a mess.Short Neo-colonial History of Chinese Fashion MagazinesQuickly, new syndicated titles burst onto the scene. If the established fashion publications showed us what it's like to be rich and famous, the new media company Xuxu Huasheng (栩栩华生) saw a business opportunity to fill “niche” needs of both brands and audiences, built on the nuances of local cultures instead of in-your-face glitz and glamour. Backed by CMC Capital Group, the new Devil Wears Prada is Chuxuan Feng. He knew the market wanted something new, but Western brands were hard pressed to accept anything too new, so by buying up Chinese licensing rights to maturing niche publications like T Magazine, The New York Times Travel Magazine, Wallpaper, Nylon, and WSJ Magazine, he quickly gained acceptance (and ad money) from Western brands.The Xuxu Huasheng business model was not that different from traditional fashion publications, but being new is certainly a virtue. T Magazine created a Chinese identity for the middle-class intellectual, whose thirst for sophistication and taste may be quenched by minimalist, moody editorials of celebrities like Li Jiaqi talking about their philosophy on life; niche young creatives, artists, and DJs belonging to the sorority of ya-subculture (the phenomenon of the lifestyle and consumption of subculture as subculture) also made their way into the magazine, signifying free spirit and alternative sass; models like Liu Wen and Ju Xiaowen often came aglazed by neo-Oriental filters, wearing Balenciaga or niche avant-garde fashion, performing Shang Chi-like feminist ideals as an otherworldly heroine.For the August 2021 cover of Marie Claire featuring actress Li Bingbing, photographer Zhang Jiacheng was targeted online for using the image of a dragon that misappropriates Hollywood stereotypes of Chinese culture a la Anna May Wong’s Daughter of the Dragon (1931).While it might sound like a good thing that makes room for creativity (and jobs) when smart brands actually want their paid content to look editorial, the illusion of freedom just complicates the power struggle between capital and creativity. The progressiveness of Chinese fashion magazines might have appeared like a gesture of zeitgeisty know-how, but even with a more humanistic take on the message, it still fundamentally operates from a capitalistic point of view. They still cater to the same advertisers, producing what the brands deem high-brow and artsy. It doesn’t help that the same strategy also caters to monied local brands looking for an identity revamp, propelling a certain brand of westernization. Chineseness became a “style” and a moodboard.Editorial in March 2019 Wallpaper* China Edition.Editorial in October 2021 Marie Claire China inspired by Chinese painter Sanyu (left). Editorial in October 2021 Marie Claire China titled “Oriental Beauty.”The Paradox of Fashion Journalism in ChinaMarkets and aesthetics may evolve, but the inherent issues that have overshadowed the industry from its very start remain unresolved. There's no true diversity, not enough real estate for editorial integrity, let alone freedom to create beauty that reflects how we live or what we aspire to—real culture creation. As a photographer friend once put it, the industry is so colonized that the only viable ideas are what sells to advertisers rather than how fashion reflects our reality, and so without being able to create fresh feelings and showing contemporary China through a fashion lens, all participants become complicit fashion victims of sorts.Prada galore in the March 2021 issue of Vogue China.What a time to be alive pic.twitter.com/es1qjrxXIn— N95-masked RF Parsley (@sanverde) November 10, 2017 Variety magazine opened a hair salon in Beijing’s Gongti club district last year.A colonized industry to begin with, efforts to explore a version of Chineseness for Chinese readers seems lacking from the media. In turn, this void has been filled by fashion boutiques, most notably Dongliang in Beijing and Labelhood in Shanghai. During Shanghai Fashion Week every six months, Labelhood showcases the best in class of emerging Chinese designers, and crowds from their constellation, fashion hipsters, and, most importantly, the ya sorority members all gather to cheer for them as they feel seen. A new class of internationally recognized brands such as Shushu/Tong, Samuel Guì Yang, and Rui all found their footing in fashion at Labelhood. What started as a small boutique has come to function as both a showcase and an incubator—some might even call it a community.Dongliang focused more on promoting Chinesenes"
