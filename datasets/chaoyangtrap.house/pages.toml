full_description = "About Hello!Chaoyang Trap is a newsletter about everyday life on the Chinese internet. It’s a regular, usually fortnightly, exploration of contemporary China, one important niche at a time. We’re interested in marginal subcultures, tiny obsessions, and unexpected connections. We want to feel like the best group chat you’ve ever been in.We accept pitches, and offer micro-grants. You can also subscribe with Wechat / Alipay or Paypal. Get in touch at hello AT chaoya.ng. Contributors and RoommatesTianyu FangKrish RaghavJaime ChuYan CongCaiwei ChenTing LinSimon FrankSasha FominskayaYi-Ling LiuXuandi WangJosh Feola████ ███ █████ █████THIS COULD BE YOU"
