full_description = "S01 Episode 9 Wanghong Vibe Check Wanghong city starter pack inside Chaoyang Trap House Chaoyang Trap House is a regular exploration of contemporary China, one important niche at a time. We're interested in marginal subcultures, tiny obsessions, and unexpected connections. More posts by Chaoyang Trap House. Chaoyang Trap House 6 Jul 2021 • 25 min read This dispatch is the entirety of S01 Episode 9. Cover illustration by FATFISHBOY.Krish: Welcome to our season finale.The word “wanghong” (网红) is inescapable in China. It’s everywhere as a descriptor, online and offline. There is no precise translation. At the simplest level, it means “internet famous,” referring in its earliest iterations to viral personalities or social media influencers. The word has since mutated, expanding and venn-diagramming with a particular hipster aesthetic, strands of urban design and kinds of tech platform architecture. It can refer to people, places, cities, entire counties. Reliance on wanghong status can drive local economies, even a large coastal archipelago of villages, beaches and hills.Depending on who’s using it, wanghong can be an aspiration, a warning (“you’ll have to queue at that bar, it’s wanghong”), or a judgement (“this art show’s vibe is a bit wanghong”). In almost all contexts, though, it suggests a certain shallowness. A hollow facade.Tianyu: The most wanghong architecture I can think of is the Binhai New Area Library in Tianjin, first opened in 2017. With bookshelves on the ceiling shaped like an eye, the library is wanghong in every aspect: the spot is popular among social media influencers because of its interior design. If you look at the pictures, you’d wonder how readers are able to get the books so high up on the shelves—but don’t worry, the books are fake anyway. It was never designed to be a space where one reads, but rather where one poses for photos.Krish: Here’s another, personal, example: I work for a wanghong brewpub in Beijing. It “became” wanghong in October 2020 due to this backdrop, first shot by a wanghong, an influencer, on Xiaohongshu. Here it is poorly reproduced by me, in a faux-wanghong style:This table at our bar always has a queue. Everyone wants to “check in” (打卡) at this spot. Endless variations of this shot are uploaded hourly on every social media platform. It’s been the setting for elaborate short videos on Douyin, magazine fashion shoots with stylists and light rigs, and at least one wedding proposal. All because it’s “wanghong.”We’ve used wanghong in the last few paragraphs to refer to a brand, a place, a building, an architecture, an aesthetic, a person, a phenomenon, and a process. Like a recent piece on the word “influencer,” in this issue we try to answer the writer Sara Ahmed’s call to “follow language around to see what it can and does do.”Here’s why this is important. Wanghong is a concrete product of a specific tech-enabled historic moment in China. What we need is a theory for it. What does wanghong obscure, and what does it reveal? Can we ask who wanghong serves? What does itdo to our online lives, our neighborhoods, and even our entire city?TL;DR: wanghong wanghong wanghong...wanghong?Staring into the wanghong abyss for us are Drs. Amy, Asa, and Carwyn, three academics based at the University of Manchester (Amy, Carwyn) and the University of Leeds (Asa) who hosted a panel in May on wanghong culture, the aesthetics of Chinese cities, and the possible futures of wanghong urbanism.Illustration by FATFISHBOYAsa: My entry point to wanghong came from doing fieldwork in Chongqing between 2015 and 2017, and witnessing how certain sites in the city that I passed through gradually took on new significance as the background to a thousand selfies and short videos: most infamously, the Liziba subway station, where a light rail line passes through the side of a residential block. I didn’t realise it, but I was witnessing the start of a wanghong takeover of urban spaces.Carwyn: Lockdown boredom in 2020 took me to Zhihu posts about Changsha, and I kept seeing Changsha being described as a wanghong city (网红城市). This is the first time I remember seeing the term scaled up to an entire city and became interested in what was being described. As a serious scholar sitting in bed, I was soon obsessed with the Changsha wanghong food-experience, Wenheyou Superb (超级文和友, now just Wenheyou, with branches in Changsha, Shenzhen and Guangzhou).Changsha Wenheyou is the recreation of a 1980s-style Changsha neighbourhood, set in Changsha’s high rise central business district and started by a young Changsha restaurateur. It's a seven-storey high nostalgia trip housing some of Changsha’s most well known food and drink spots with entry limited through a lottery system.A “street scene” inside the Changsha Wenheyou. Photo from Red Dot Design Award.Amy: I started doing research on arts districts in Chinese cities 8 [😱] years ago, because I found it interesting how these places essentially function like a kind of theme park to many people. So, when wanghong attractions (网红景点) and wanghong cities started emerging, I saw them as an extension of those arts districts—may I even suggest arts districts were predecessors of wanghong attractions before this term came to existence?—but on a much larger scale.798 arts district in Beijing. Photos by Amy Zhang.What is wanghong urbanism?Asa: For me as an urban geographer, the interesting thing here is how talking about these practices as a form of “urbanism” means thinking about how they intervene in the politics of daily life, place and space which make up the urban. I think Amy can explain this better than me…Amy: Obviously, sharing photos of and experiences of visiting particular places online is not a new thing (I’m thinking of Douban, Mafengwo, and even the old Xiaonei/Renren and BBS), and it has helped make some places popular. But, the rise of app-based sharing platforms greatly increases the speed and scale of the circulation of these images and texts. In a way, the replacement of words that were used for describing certain places as being popular (for example, remen, 热门) with the term wanghong is an indication that we are now seeing a qualitatively (and quantitatively) different kind of intersection between online platforms and urban spaces.Carwyn: One of the most interesting things is the move from wangluo hongren (网络红人, internet celebrities) to wanghong. Search analytics data suggests that wanghong gained dominance in 2015, meaning that non-humans accounts or figures could become celebrities, opening up new possibilities and forms of celebrity and celebrity interaction. Perhaps there is an ease of access to wanghong places that is not possible with human celebrities, and then one can filter that out to one’s own networks to become a bit more hong in one’s own social circles.Asa: “Checking in” (daka, 打卡) is pre-existing terminology that takes on new significance in the wanghong city context.Amy: The production and consumption of wanghong places seem to be very much about the imageries, whereas the experiences of these places are often secondary and are not necessarily the focus when people share about these places online.Carwyn: Yes, my friend has been to Wenheyou in Shenzhen several times and, due to the lottery system, failed to get in. Nevertheless, she has taken pictures of the visits; daka-ing and showing off.Shot:Chasers:A daka check-in spot created in Beijing for the 100th anniversary of the Party. These buildings do not normally have synchronized light displays. Photos by Yan Cong.Jaime: Wanghong now has way less to do with experience than “aesthetic proof,” to the point where buildings or restaurants or infrastructures are now being built and marketed for the sake of wanghong-ness, at the expense of prioritizing public or social functions or purposes. These are not spaces that facilitate interactions between their users, counter to what we usually think of urban social dynamics, but rather as more like a monologue between the users and the space. How did wanghong architectural design come to be valued this way? Tianyu: In bringing oneself into the interactions between the user and the space, as Jaime noted, what role does the individual play? The OG wanghong—the internet celebrity on Xiaohongshu, Weibo, or Instagram—seems to imagine themselves as the visual protagonist of said location, as their presence and media influence make the space trendy or avant-garde. Do others who visit locations for their wanghong-ness, however, imagine themselves to be in that same social influencer position? We might think that those who patronize wanghong restaurants aspire to be wanghong themselves, but anecdotally I don’t think that’s the case.Yi-Ling: I am going to make a big leap here: if fandoms are a form of worship, wanghong celebrities deities reincarnated in contemporary form, aren’t wanghong locations, in some ways, temples to pay homage to? The God of tech-driven capitalism—in this case, the Dianping/Meituan algorithm—has deemed this particular glitzy bookstore significant, meaningful, worthy of your attention, and so, you must go and pay homage. Because chances are, if you are a young Chinese person living in a city, you don’t have shrines, anymore, to imbue meaning on. All you have is a wanghong restaurant. And I guess, if you still remember the revolutionary days, Yan’an.Henry: To add to all three points: if loving wanghong is worship, then it seems to be a form of idolatry—the images of these places and people are much more powerful than the real McCoy (or 真佛); architecturally, I’m reminding of Don Delillo’s “world’s most photographed barn,” whose physical existence is dwarfed by its digital presence. Human-wise, I think of the “wanghong face,” an almost baroque set of features (straight nose bridge, Disney-princess eyes, sharp, conical chin) achievable only through plastic surgery, and which seems to be made-for-camera. In this sense, I wonder if the OG wanghong don’t gain their power by becoming secondary to their online representations.Krish: We’ve gone this far, so:If wanghong is an idolatrous religion, can we expect an imminent rise in iconoclasts?A walk-through of Wenheyou, from their official Wechat account. Even this editing style could be called wanghong.What is wanghong aesthetics?Amy: One of the things that first interests me about this phenomenon is: Why this particular aesthetic??? [Cue wanghong city starter pack] What does this tell us in terms of young urban professionals’ “deep desire”?? (lol)Carwyn: Looking at premier wanghong site, Changsha Wenheyou, we can see a mixture of desires. I mentioned that Wenheyou is built around 1980s nostalgia, and one of the central Changsha born co-creators is a collector of objects discarded during the demolition of Changsha’s old neighborhoods. Coupled with these aesthetics, the experience of being in Wenheyou suggests turning back the clocks, including modes of eating and group socialising more associated with pre-highrise urban China, or at least, an urban China where food culture is more organic and not policed into the ground by urban law enforcement and erased through demolition and eviction. Wenheyou looks unlicensed, it gives the sense of a street stall, it may even feel like one is eating on a street corner, but it is actually a controlled, scripted, and formalized environment.Jaime: A real street cart food experience would include chengguan showing up to disperse the show at any moment. Krish: An “Escape (the chengguan) Room.”Carwyn: A place like Wenheyou only becomes possible because of the demolition and erasure of the places it mimics and sanitizes. If small restaurants and food stalls could function in a regulated, not revanchist, system, then Wenheyou would not need to exist. That is a lot of ifs and butts, and the reality is that Wenheyou does exist, and it stands in stark contrast to central Changsha’s other buildings, including the Changsha IFS Tower, China’s ninth largest building and only a ten-minute walk away.An official “concept drawing” for Changsha Wenheyou, featuring a sprawling “old-style” neighborhood superimposed on a line drawing of the Changsha TFS tower. From Wenheyou's official Wechat account.The landscape around Wenheyou is that of high-rise urban modernity, built through top-down urban planning. This urbanism represents demolition, homogenization of the urban experience, the triumph of verticality, and the end of locality. This story is common throughout China’s large urban centres, it has taken place over the past 30-years and is still ongoing. Importantly for this discussion, this urbanism is repetitive, it does not create the eye catching difference that wanghong seeks. That is not to say this way of creating an urban fabric or being urban is bad, but its ubiquity creates blandness, and within homogenous landscapes created through top-down urban planning, sites of alterity may become fetishized.While Wenheyou is commodifying some slowly disappearing forms of urban life, its popularity in Changsha, Guangzhou, Shenzhen and across numerous digital sites makes a clear statement: “MANY OF US STILL LIKE THIS WAY OF BEING URBAN!” In my opinion, wanghong-ness is not necessarily about nostalgia—although in this case, nostalgia plays an important role—rather, wanghong urbanism is about highlighting other ways of being. It is about multiplicity. When everything looks like a bigger or smaller version of the IFS Tower, and everyone must act in the same way regardless of which version of that tower they are in, then places like Wenheyou become sites of consumerist-alterity that highlight some of what is missing from people’s daily urban lives.I might be pushing this too far, and this definitely isn’t the case for every urban resident, but wanghong urbanism might enable (or capture, in the camera lens) a slight democratisation of urban space and lifestyle. This democratisation has been relatively absent in the top-down “government x real estate company” vision of urban China that has dominated during Reform and Opening Up, and despite the many problems that might arise I see this as beneficial and refreshing.Aranya, the wanghong beach resort in Qinhuangdao, near Beijing. Photo from Dianping.Simon: The idea of wanghong-ism representing a slight democratization of urban space is an interesting one, but isn’t this often imitative behavior within different tiers of wanghong-dom? The true influencers, with corporate or tech support, help define standard behaviors and tropes, and then people with fewer followers aspirationally copy them. In a different context, there’s the example of Hong Kong’s Choi Hung Estate, where public housing became an Instagram influencer spot—a vestige of welfare state “democratization” mutating into something pretty strange. Perhaps a wanghong-led approach to gentrification crowdsources the initial impetus towards urban transformation, which is then pounced on by brands "
