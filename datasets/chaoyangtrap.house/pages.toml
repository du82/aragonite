full_description = "S01 Episode 5 King of Fairy Tales, King of Posts China’s “king of fairy tales” doesn’t write much about unicorns and mermaids—rather, most of his writings are interspersed with social commentary and political critique, cleverly veiled for a young audience. Tianyu M. Fang Tianyu M. Fang 4 May 2021 • 8 min read S01 Episode 5 Two-Way Mirror After Chinese TV drama The Untamed (陈情令, “CQL”) took the world by storm in 2019, international fans clamored for all kinds of adjacent media: the original novel and all its adaptations, endless thirst-feeding interviews, and reality show appearances by actors promoting a drama. Sridala Swami Sridala Swami 4 May 2021 • 4 min read S01 Episode 5 “ZQSG for YYDS”: How Idol Fans are Made From “international idol group” to Big Yoghurt democracy. Yan Cong Yan Cong 4 May 2021 • 12 min read"
