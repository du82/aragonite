title = "Between ROC and a Hard Place"
description = "This episode is about Taiwan’s influence on Chinese music. How it’s shaped Chinese pop culture even as its origins are deliberately obscured or denied."
full_description = "S02 Episode 1 Between ROC and a Hard Place This episode is about Taiwan’s influence on Chinese music. How it’s shaped Chinese pop culture even as its origins are deliberately obscured or denied. Chaoyang Trap House Chaoyang Trap House is a regular exploration of contemporary China, one important niche at a time. We're interested in marginal subcultures, tiny obsessions, and unexpected connections. More posts by Chaoyang Trap House. Chaoyang Trap House 28 Sep 2021 • 36 min read This dispatch is the entirety of S02 Episode 1. Cover illustration by AU Chang.In the house this week: Brian, Chen-Yu, Miaoju, Lev, Nathanel, AU, Simon, Krish, Tianyu, Yan, and Ting.Krish: This episode is about Taiwan.Specifically, Taiwan’s influence on Chinese music. How it’s shaped Chinese pop culture even as its origins are deliberately obscured or denied.For decades, Taiwan⇔China has been one of the oddest musical circuits in the world. In the 1970s, there was the “ethereal presence” of singer Teresa Teng (鄧麗君), whose songs singularly captured the transformation of everyday life in post-Mao China. She is an enduring icon, her presence and influence so ubiquitous that the writer Andrew F. Jones argues Teng was “not so much a historical personage [but a] particular acoustic effect...and even a kind of domestic appliance.”The facade of the “Teresa Teng Theme Restaurant” in Beijing. Photo by Yan Cong.Throughout the 1980s, 90s, and 2000s, Taiwanese pop dominated airwaves and TV screens, blasted everywhere from taxi radios to college dorms. They constitute much of karaoke canon. In the last half-decade, Taiwanese indie bands like No Party for Cao Dong (草東沒有派對), deca joins, or Sunset Rollercoaster (落日飛車) seem to take turns to headline every Chinese music festival.Their dominance has not, however, insulated Taiwanese culture from the...rollercoaster of broader political headwinds. Especially now, when China’s idols and films are the top show in town and a poisoned online environment is deployed as a paranoid border guard.This big question we’re asking is, “how is Taiwanese music thought about (and encountered) in China today?”Simon: Keeping our focus mostly on music more in the realm of Chaoyang Trap’s interests, “indie rock” and “underground club music” (with an awareness that both genres are sometimes big business), how are Taiwanese artists perceived in China, and how do they think about working in China?Unexpectedly, the Covid-19 pandemic hasn’t caused cross-straits touring to totally peter out: bands have put themselves through quarantine to participate in reality shows like The Big Band (乐队的夏天), or embark on their own headline tours.On the one hand, we could say this is great. People are overcoming would-be political barriers to share music.On the other hand, if non-mainstream music is meant to carry some sort of alternative message, and if by entering the Chinese market Taiwanese artists who tilt “Green” (i.e., generally supporting a DPP-abetted status quo or independence) must remain silent, is meaningful exchange or communication still happening here? Is this a soft power win for hipster Taiwan? Or does the fact that this music is allowed into China normalize for fans here that the place it comes from is part of a cultural-political space that they can claim ownership of?Krish: There is a kernel of truth to every part of this either/or question, and our one weird trick here is to treat choice as polarity—reject “either/or”, embrace “yes/no.”Is this meaningful exchange that takes us forward, or normalization of a cursed status quo? Yes.Simon: As Krish pitched the idea of Chaoyang Trap amongst friends last year, one thing that made it appeal to me was noticing the disconnect between cultural products in China that certain media outlets tell you to care about (i.e., rappers that support the police), and things that are actually worth caring about. There’s a wealth of interesting cultural activity (i.e. the subject of this episode) that still feels like it hasn’t been properly examined or critiqued in English.If you were introduced for the first time to the “Chinese music scene” in 2021 without much context, you might be surprised to discover that many of the bands that seem to have something to say, or simply are operating at a slightly more professional level…are actually Taiwanese. How come? In my opinion this question alone makes our topic for this episode worth discussing.Krish: We invited a dream team of contributors to take us through this. Brian Hioe is a writer, DJ, and music journalist in Taipei. Dr. Chen-Yu Lin is an academic and music industry professional who studies the Chinese audience. Miaoju Jian has been researching the cross-straits circulation of underground music for more than a decade. Lev Nachman, now at Harvard, has run @taiwansongaday for many years, and Nathanel Amar keeps the internet’s best archive of sinophone punk rock history.A note on terminology:For the purposes of this discussion, we use “Taiwan” to refer to the island of Taiwan (plus some other islands) and the Republic of China. We use “China” or “PRC” to refer to the People’s Republic of China or mainland China. Names of bands and musicians from Taiwan are rendered in traditional Chinese characters, while those from China are in simplified.Between ROC and a Hard PlaceBy Brian Hioe, Chen-Yu Lin, Lev Nachman, Miaoju Jian, Nathanel Amar, and Simon FrankIllustration by AU Chang.Simon: I got the idea for this episode singing karaoke with my colleagues in the spring of 2018. I’m not exactly joking: after a couple of months working a new job in Beijing, I went to a KTV parlor with my co-workers, and was a little shocked to see people who I knew from an environment where emotional vulnerability was generally frowned upon belting out tear-jerking ballads. And if they weren’t singing something by Faye Wong, it was probably an old Taiwanese song. While these musical choices might have reflected more about the group of people I was with than wider trends, the way these songs were being used as a conduit for hidden feelings did bring to mind something that I embarrassingly hadn’t given much thought to before—namely, how is Taiwan thought about in China, not as a big political topic, but in all the ways that don’t look political but which are in fact deeply ideological.As a music video flashed across the screen, showing a small bar-cafe café that I could have sworn was somewhere in an alley near Shida Night Market, I wondered if Taiwan was perceived as a utopian “island of affect”—a kind of hyper-California that provides pop songs, actors, and models to the mainland, idyllically preserved from the hassles of daily life.Left: Teresa Teng’s iconic ad spot for the Yamaha Passola; Right: Kaohsiung dream-pop band The Fur; Bottom: still from a music video by Fuzhou indie band The 尺口MP.Nathanel: I think the first time I realized the importance of Taiwan music in China was 2012, when I was drinking in a Wuhan punk bar. I went outside for a smoke and there were 4 older guys sitting down, around 40-50 years old, with a lot of beers and whisky bottles on the table. Their presence was quite unusual—not the typical demographic of a punk bar. They were in fact the 老大 (lǎodà) of the neighborhood, the guys you have to pay respect to and give free alcohol if you don’t want any problems with your business. Some of them were ex-policemen. They were really nice and invited me to drink with them. As we were beginning to get drunk, they decided that we had to sing a song together, and immediately began to sing Teresa Teng’s “月亮代表我的心” (“The Moon Represents My Heart”). Why would these guys instinctively choose to sing this song, even though we were just talking about their life during Maoism?A Teresa Teng cover band at the Teresa Teng Restaurant in T̶e̶r̶e̶s̶a̶ ̶T̶e̶n̶g̶ ̶C̶i̶t̶y̶ Beijing. Photo by Yan Cong.Miaoju: I went to China for the first time in 2008 to research the reality show Super Girl (超级女声). Since 2012, I have traveled to Beijing, Guangzhou, Shanghai, and other cities to conduct my long-term research on the indie music scene. What impressed me at the time was always hearing familiar Taiwanese pop songs on taxi radios, whether it was Sarah Chen (陳淑樺), Wakin Chau (周華健), or Jay Chou (周杰倫). Be it the host of a talk show or the driver who sang along, they were all intensely familiar with these singers, almost like they were close friends. But to me, these were old songs. Some were from the 1980s, and others the early 2000s, yet they were mashed together into a single soundscape for people’s daily life. Being loved and cherished but through a kind of bizarre feeling.At the same time, Mayday’s (五月天, “The Beatles of the Chinese World'') first concert in Beijing’s Bird’s Nest stadium sold out in seconds, and some young urban professionals did follow popular rock and alternative performers like Cheer Chen (陳綺貞), Deserts Chang (張懸), and Sodagreen (蘇打綠). But Taiwanese indie bands were then barely known to the public, except maybe for Skip Skip Ben Ben, who lived and played music in Beijing, and Hakka singer-songwriter Lin Shengxiang (林生祥) who had been touring China within the folk scene since 2008.Lin Shengxiang at the 2017 Concrete & Grass Festival in Shanghai. Photo by Li Lewei.When I returned to Beijing in 2015, the situation was different. All my musician friends were very interested in indie bands from Taiwan. Besides Skip Skip Ben Ben, who had drummed for Carsick Cars in the early 2010s, Forests (森林) came to Beijing to play at XP in 2014. When I visited again in 2018, friends in Beijing were already discussing why so many Taiwanese bands had been touring there.Three names in particular, big in Taiwan already, were huge in China: No Party for Cao Dong (草東沒有派對), deca joins, and Sunset Rollercoaster (落日飛車).For me, there are three types of musical exchange: 1) Mainstream Taiwanese pop music which is listened to by the public; 2) Taiwanese indie music mainly listened to by students and urban young adults; 3) Avant-garde, noise, and experimental music listened to by niche, underground music fans. My study mainly focuses on the second category.I. History/PrecedentsSimon: So… how did we get here? What created the demand for Taiwanese bands in China? Krish and I have joked that bands in Taiwan are generally better than those in China at a similar career level because they actually have a chance to develop—there’s less hype from the get-go, a slower pace of life even in big cities (which leaves time to practice and write songs), and a music scene with low stakes but decent infrastructure. So might it actually have something to do with Taiwan being more “Californian”?Brian: I wonder if that’s precisely it—the demand for Taiwanese bands in China is rooted in Taiwan as thought of as signifying a sort of more laid-back pace or life or a different set of values.Nathanel: I think Brian is right, there is something like an unheimliche feeling—a strange familiarity—in the demand of Taiwanese bands in China. We should also historicize this particular demand, from Teresa Teng to COM’Z. Someone like Hou Dejian (侯德健) was the symbol of a pan-Chinese identity, something that was later reappropriated by Wang Leehom with his own reinterpretation of the song 龍的傳人 (Descendents of the Dragon).(Editor’s note: Hou Dejian’s version of ‘Descendents of the Dragon.’ Written as an anthem for Taiwan, then popularized as a pan-Chinese call for unification, then recast (by the lyricist) as an anthem in support of the students at Tiananmen Square, and then subsequently used by both mainland and Taiwan broadcasters as a ‘patriotic’ song.)Chen-yu: I agree—I think it is helpful for us not to see Taiwanese bands touring in China as a series of specific, stand-alone events, but rather an extension of the long history of Taiwanese acts being heard in the China market.In many ways, Taiwanese pop and indie soundtracked the drastic changes in Chinese society for the post-1990s generation. Many of my interviewees told me they had to “adapt” to pop music from Taiwan—namely S.H.E., Jay Chou and Mayday—when they were first exposed to it, as they were too different from the music their parents listened to.Taiwanese indie music, I think, exemplifies the construction of “cultural imaginations” among music audiences. There have been many discussions about how the twee xiao qingxin (小清新) aesthetics left a strong impression on the PRC’s music audience; labels such as ‘bourgeoisie’ (小資) and ‘cynical’ (厭世), used to describe quite a few Taiwanese acts, are descriptors of lifestyles too. For a China audience, Taiwanese music provides a kind of “organizing material” of subjectivity (as DeNora puts it), and I think the demand for Taiwanese music— past and present—is driven by it.I also agree with Krish and Simon that there has been an advantage for Taiwanese musicians as the infrastructure here has been developed earlier and better. Even today, bands can apply with the Ministry of Culture for governmental subsidies to record their albums (something unthinkable on the Chinese side). These schemes specifically encouraged bands, not DJs or Hip-Hop artists.Miaoju: I think the development of China's huge music festival market, especially the “fountain explosion” (井噴) era since 2010, was a major reason. Taiwanese bands gave capable live performances with good energy, and appealed to the core youth demographic. Not only did international acts increase the attractiveness and diversity of a lineup, the ambiguous identity of Taiwan artists (simultaneously local and foreign) gave festivals the best of both worlds. In addition to well-known female artists such as Joanna Wang (王若琳) and Waa Wei (魏如萱), the performance opportunities and demand for Taiwan indie bands greatly increased as well.The artwork for Joanna Wang’s 2016 H.A.M EP was a brief viral sensation in China.Krish: I worked for a Shanghai music festival from 2015-19, and can second this strongly. Taiwanese bands were easier to process visas for, and sold more tickets than, their indie counterparts from Europe or the US. They were also, on balance, better headliners, more used to playing on big festival stages. They were, in most cases, used to dealing with non-standard equipment or improvised technical set-ups. The ambiguity of their identity (“Chinese-ish”) also smoothed over concerns of “excessive foreignness” with local police and culture bureaus.Miaoju: The diversity of music festivals, from independent and underground to mainstream and genre-focused, dovetailed with the rise of talent shows, where Taiwan bands found opportunities too. The two seasons of “The Big Band” (乐队的夏天) in 2019 and 2020 were key for participating Taiwanese bands, with all of them now in high demand for bookings, tours, and festival slots.COM’Z (left) and The Chairs, two Taiwanese bands currently making it big in China after participating in The Big Band.Nathanel: Now with The Chairs (椅子樂團) and COM’Z (康姆士)—two of the Taiw"
