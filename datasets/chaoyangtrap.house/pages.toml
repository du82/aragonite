title = "China Dreams of Electric Words"
description = "The curious case of the “Electronic Dictionary”: BBK master race + dither punk sinofuturism + playdating for two decades + homebrew tamagotchi"
full_description = "Season 2 Episode 9 China Dreams of Electric Words The curious case of the “Electronic Dictionary”: BBK master race + dither punk sinofuturism + playdating for two decades + homebrew tamagotchi Jesse Young Read more posts by this author. Jesse Young 6 Apr 2022 • 18 min read In the house this week: Jesse, Emily, Tianyu, Yan, Yi-Ling, and Krish.Krish: Hello. Chinese videogames are having a global moment, and we’ve written two episodes trying to figure out where their quirky sensibilities might come from.Our answers: Flash games, emulation, console meal replacements, and the liminal space offered by Steam, are all key pieces, but it’s the subject of this episode that really completes the picture.In the 90s and 2000s, English language learning was a huge fengkou, the site of an insane commercial and VC scramble. At the heart of it were electronic dictionaries (电子词典), singularly Chinese computing devices ostensibly meant for language acquisition. In reality, they became so much more: the repository for a whole generation’s private world of notes, virtual pets, sprawling RPGs and coding experiments. Somewhere between a Nintendo DS, Chromebook, Ti-83 Calculator, and a Tamagotchi, electronic dictionaries were wildly popular, extremely customizable, and gleefully modded to support dizzying possibilities.Their interlaced worlds were foundational to many strands of gaming and game development in China, prefiguring the global rise of smartphones.GIF adapted from this Bilibili look back at the Electronic Dictionary era. Emily: Also, games on electronic dictionaries, which were sold to parents as purely educational devices, represented a really important lure to kids beyond the promise of private worlds: that of transgression, trespass, secrets and provocations.Krish: Our guide through these nested menus is Jesse Young, a writer and translator in Beijing who has been obsessed with the devices for years. With his sprawling collection assembled through second hand resellers on Taobao, he takes us on a deep-dive through dither-punk RPGs for a look at the legacy and influence of the electronic dictionary in China.As always, we want to show that the history of games in China is not “partial, belated, or emerging,” but rather a specific result of complex technological trajectories. These trajectories, as Jesse shows below, aren’t just nostalgia fodder but signposts to what a better, more open, and punk af tech future might look like.The Decade of the Electronic DictionaryWords and Illustration by Jesse YoungJesse: Recent pieces in Polygon and Chaoyang Trap both explicated what I’d long intuited: the quiet soft power victory of Chinese video games. This got me into some speculative anthropology around the framing of gaming here—the console ban (2000-2015), games as “spiritual opium,” the current crackdown and video game licensing woes.Wind back now to the 1980s and the homegrown NES-clone Little Tyrant (小霸王). China’s only big console success story had to position itself as educational hardware. It was a design choice with implications, arguably the start of a new, distinctly Chinese technological idiom. I’d seen a variant of this in Tom Mullaney’s work on The Chinese Typewriter (newly published in Chinese) and early personal computing, and there is a direct line here about how culture informs technology which informs design which informs aesthetics.In China’s case I think this interplay of technology and aesthetics, responsive to culture, is best exemplified in what I am calling “The Decade of the Electronic Dictionary: 1995-2005.” During these ten years, for a tech savvy cohort of high school and college students, “electronic dictionaries” (电子词典) were the ascendant hardware. Instead of PCs, PDAs or the like, which took off belatedly in a still-developing China, electronic dictionaries were de-facto mini-notebook computers.Here, electronic dictionaries developed into impressive multifunction devices, sporting their own striking design sensibility and serving as a bridge to smartphones much as PDAs did in the West.The two leading brands Bubugao (步步高, BBK) and Wenquxing (文曲星) generate the same nostalgic fondness as Palm Pilots and Apple Newtons do (just check Bilibili or second hand platforms like Xianyu 闲鱼). Returning to video games, the most interesting facet may be the largely unexplored legacy of Chinese electronic dictionaries as gaming devices, and their influence on a whole generation of programmers and developers in China.Most of the 80s/90s generation's first experiences with gaming/home computers were Famicom clones such as Little Tyrant (小霸王) or Benli (奔利). These devices, used mainly for video games, were marketed as “study machines” (学习机), ushering in China's uniquely large and varied educational hardware market. Electronic dictionaries went on to be the next 'stealth' gaming device in this lineage. All images by Jesse except where indicated.A Wenquxing 文曲星 NC3000 with stylish leather case.Bubugao/BBK 2005 词典王A5, Dictionary King A5.Electronic dictionaries reigned supreme especially after the millenium, as network capabilities were added and technological convergence elevated the devices into capable MP3 players, e-book readers, handheld gaming machines, graphic calculators, notebooks, programming tools, virtual pets, personal organisers and more, complete with SD card support, USB connectivity and infrared data transfer. To echo educational industry analysis firm Blackboard Insight's (黑板洞察) conclusion on their significance:“It belonged to a wave. That wave has retreated but its ripples still reverberate...it carries the special complex memories of a whole generation of students.”The original Wenquxing 文曲星 CC-100 (1995) shares a lot in common with a standard pocket calculator. Source: Baidu.Yan: I’d like to add a bit of context here: one of the biggest anxieties over learning English in China in the late 90s and early 2000s was “Mute English,” or at least that’s what my parents projected on me. This was before pirated and subtitled American TV shows like Friends were widely available for people to watch, and you rarely had access to audio materials of conversations between native English speakers other than textbook recordings. So an electronic device that could read out all the English words for students to check their pronunciation was essential for people who wanted to be able to converse in English rather than just pass English exams, most of which didn’t have a speaking component.That’s how revolutionary the device wanted to be for English pedagogy in China during that specific period. I had a Wenquxing but I sadly don’t have any memory of learning English with it. All I remember is a cat I raised in the Tamagotchi game that came with the device. In the game, in order to “make money” to buy cat food there’s a simple word game, where you fill in the blanks to complete words. The twist: they were Chinese 成语 (idioms), not English words!Emily: One of my most prized possessions growing up was this - The 2006 Barbie B-Book. It was marketed as a “learning laptop” for kids to learn 1st/2nd grade English vocabulary through a series of educational games.A few things to pick apart here: first, the pinkness overload. The target audience was obviously little girls who were already in the Barbie craze phase. I wonder, then, the possibly gendered nature of electronic dictionaries and these B-Book type devices. I, for one, never had any of the aforementioned devices back then. I knew of their existence but I never wanted one, nor have my parents offered to purchase one for me. I’m throwing an idea out there: since our society is inherently gendered, educational hardware is no exception.Other notable features include the fact that the B-Book is not internet-enabled, even though it is marketed and aesthetically designed to resemble a laptop. It is much less user-driven since the “vocabulary learning” aspect is not actualized through a dictionary function where the user looks up words, but through program-led games. As far as I remember, the B-Book did not have a calculator function, but it does have math-related games. I’m hesitant to definitively argue that these features are sexist and am well aware that previous examples of hardware might be innately different to B-Book (the latter is completely in English). But, it's worth raising here and opening it up for debate. :)Leave a commentJesse: Okay, back to the beginning. Electronic versions of text dictionaries have existed since the early 1960s, but the proximate ancestor to the electronic dictionary, a dedicated pocket computer with word search functions, is the “enhanced” electronic calculator. Their invention is often credited to SoftBank founder Masayoshi Son, who made his early fortune by selling designs for an electronic translation device to Sharp (dictionary and translation functions being porous from the outset). This was in 1978, the same year top US calculator maker Texas Instruments’ Speak&Spell signaled an embryonic step into more lexicographic as opposed to numeric territory. Their ‘Language Translator/Tutor’ followed in 1979. Japan would prove the true template for subsequent Chinese forays though, sharing the same computational challenge of handling a character-based writing system and sizable segment of (mostly English) language learners. Sharp’s IQ-3000 debuted in 1979 and was soon met by Casio’s TR-2000 in 1981, coming in at a lightweight 53 grams.A 3D render of Sharp’s IQ 3000 (1979) - credited as the first electronic dictionary. Its form is remarkably similar to Wenquxing’s breakthrough CC-100, showing a clear continuity over a 15 year span. Image source: Comugi at 3dwarehouse.sketchup.com.1989 is the watershed year for the Chinese electronic dictionary. Quanzhi International launches the first Chinese electronic dictionary, the EC-1000, under the name Kuaiyitong (快译通), positioning it as a Chinese-English translation tool. They began in Taiwan but by 1990 had started production in Shenzhen for the mainland market. At roughly the same time, a Taiwanese and Hong Kong technology firm joined forces to establish BESTA (好易通) and launched their own electronic dictionary.These were bougie gadgets costing several thousand kuai, generally out of reach of the laobaixing. An entrepreneur from Taiwan, Zhou Zhiyuan, would be instrumental in changing this. He founded Golden Vision in 1993 with a view to making an affordable, truly mass-market product.1995’s Wenquxing (文曲星) CC-100, named for a star in the big dipper constellation associated with literary success, debuted at 330 RMB cutting the price of an electronic dictionary by 80% overnight.The first multi-function electronic dictionary would arrive shortly after in 1997 with Wenquxing’s PC-220. By 2000 Wenquxing dictionaries had accumulated sales of 20 million units and occupied a 70% market share.Screencaps from classic ads for electronic dictionaries.It was around this time Duan Yongping, who had invented the educational hardware market with Subor Electronics and the Little Tyrant (小霸王) left to found Bubugao/BBK (步步高) and a second era was born. Network features were added. Backgammon, Snake and Tetris gave way to sprawling RPG games. Programming and game development tools were made available. Intense competition led to a war over games, price and features. Online forums like WQXNET sprang up. Wenquxing fans began calling themselves 星迷 (star fans). And electronic dictionaries became a ubiquitous fact of campus life. By the early 2000s Noah (诺亚舟) had also entered the fray and soon found themselves second only to Wenquxing, with BBK settling into third place. Industry sales peaked at 10 million a year in 2004.China's educational hardware market has spawned several unique device types. Here's a simple breakdown. Image adapted from Tencent News.In 2005, an abrupt industry-wide restructure shrank the sector by half. Nokia phones were IN, and the writing was on the wall. Innovation stagnated and a prolonged period of decline had begun. Companies pivoted to hardware based around replicating the classroom experience, like point readers (点读机, basically interactive textbooks) incorporating new video and online capabilities. Bubugao was successful in navigating these winds and remained a market leader, while Wenquxing and Noah floundered and ceded their dominance to new players like Shulang (读书郎) and Best Under Heaven Studying (优学天下), which along with BBK currently control 60% of the educational hardware market.Electronic dictionaries shed their distinctive character and increasingly came to mimic smartphones and tablets. This culminated in the study tablet (学生平板), a learning-focused ‘distraction-free’ (no games, no browsing the internet) alternative to iPads. Unable to compete with modern multifunction devices, the “superfluous” was pared away. The electronic dictionary became an actual electronic dictionary, exemplified by the no-frills dictionary pen (词典笔). In a complete inversion, classic-style electronic dictionaries are still marketed, but this time the selling point is the lack of games.Much of what made the electronic dictionary special has been lost, so let’s take a moment to celebrate their manifold delights.Texas Instruments/TI was early to the education hardware market in China in 1989 with their little-known Speak&Spell 'English Professor' range, confirmed here as an official product.Long before the gamification of learning became the standard with apps such as Duolingo even the Tamagotchi craze was co-opted for study purposes in China. Both Bubugao and Wenquxing came with virtual pets that required the completion of various study tasks to care for.The design of these devices deserves appreciation. They are beautiful, and as the old heuristic goes, what is beautiful is usable. You can witness the evolution of form-factor in the image below. From a flat credit-card shape with a calculator-like display to a more rounded clamshell flip-design not dissimilar to a Nintendo DS. Other models and brands experimented with a diversity of novel features including touch-screens, a second-screen on the case with music controls, handwriting input, insertable cartridge support and more.Evolution of Wenquxing's form-factor. The screen separates and gets larger as the design becomes more sleek and streamlined. Images adapted from Baidu.Their beauty lies in a delicate dance. To be easy to carry, access quickly, to hold and to use all at once. It's fascinating how, at a UX level, these devices pull off these little clues or 'signifiers' that guide user experience. Even in 2022, cycling through nested menus and functions was immediately legible to me, articularly with my BBK Dictionary King A5—considered the pinnacle of e-dictionary design.Electronic dictionary keypads are informational dense sites and smart design choices around user input often pay aesthetic dividends. Below you can see the elegant combination of mathematical symbols, Korean"
