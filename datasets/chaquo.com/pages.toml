title = "Change log - Chaquopy 16.0"
full_description = "Change log# 16.0.0 (2024-10-15)# Features# Update CA bundle to certifi 2024.8.30. (#1169) Python version 3.13 is now supported. (#1210, #1212) Update runtime Python versions to 3.8.20, 3.9.20, 3.10.15, 3.11.10, 3.12.7 and 3.13.0. (#1211) Android Gradle plugin versions 8.6 to 8.8 are now supported. (#1224, #1245) Deprecations and Removals# minSdk must now be at least API level 24. This still covers 97% of active devices. (#718) buildPython must now be at least Python 3.8. (#1027) Bugfixes# When exceptions are thrown during an import, the traceback now contains only a single copy of import_override, rather than one for every import level. (#889) sys.stdin is no longer overridden, so it has all the standard attributes including buffer. (#1083) 15.0.1 (2023-12-24)# Features# Kotlin build.gradle.kts files are now supported. (#231) A new Gradle DSL has been added, with a top-level chaquopy block. Kotlin build.gradle.kts files must use the new DSL; Groovy build.gradle files may use either the new or the old one. (#231) All Android wheels are now downloaded from https://chaquo.com/pypi-13.1/ – the old pypi-7.0 URL is no longer used. (#808) os.get_terminal_size now returns ENOTTY rather than EPERM, which was causing avc log spam when stdio is redirected. (#886) Update CA bundle to certifi 2023.11.17. (#893) Android Gradle plugin versions 8.1 to 8.5 are now supported. (#908, #1003, #1091, #1140, #1172) Python version 3.12 is now supported. (#931, #967) Update runtime Python versions to 3.8.18, 3.9.18, 3.10.13, 3.11.6, and 3.12.1. (#932) The importlib.resources.files API is now supported in Python 3.9 and later. (#977) Update pkg_resources from setuptools version 68.2.2. Deprecations and Removals# The 32-bit ABIs armeabi-v7a and x86 will no longer be supported on Python 3.12 and later. (#709) Android Gradle plugin versions 4.1 and 4.2 are no longer supported. (#787, #840) Bugfixes# Fix “AttributeError: “‘AssetFinder’ object has no attribute ‘extract_packages’” when AssetFinder subdirectories are on sys.path. (#820) Unsupported socket functions such as if_nametoindex now throw OSError as documented, rather than AttributeError. (#870) Fix FileNotFoundError when pkgutil.iter_modules is called with a nonexistent path. (#917) ZIP files using BZ2 or LZMA compression are now supported. (#953) 14.0.2 (2023-01-29)# Features# sys.stdout and sys.stderr are now line-buffered by default. (#654, #746, #757) Add option to redirect native stdout and stderr to Logcat. (#725) Update to Python version 3.8.16 and OpenSSL version 1.1.1s. This fixes the Google Play warning “Your app uses a defective version of the OpenSSL library”. (#727) Update CA bundle to certifi 2022.12.7. (#747) Add python executable as a final fallback when searching for buildPython. (#752) Restore the extractPackages setting, for code that requires its modules to exist as separate .py files. (#754) Android Gradle plugin version 7.4 is now supported. (#756) Android Gradle plugin version 8.0 is now supported, though projects which use minifyEnabled true will need a workaround. (#842) Update to pip version 20.1. Deprecations and Removals# buildPython must now be at least Python 3.7. (#713) Bugfixes# Enable PEP 517 builds in pip. (#715) Show correct error message when buildPython autodetection fails. (#733) Fix error when calling entry_points with an unreadable directory on sys.path. (#755) Fix “Could not find an activated virtualenv” error when PIP_REQUIRE_VIRTUALENV environment variable is set. (#777) 13.0.0 (2022-11-06)# Android Gradle plugin version 7.3 is now supported (#663). [BACKWARD INCOMPATIBLE] minSdkVersion must now be at least API level 21. This still covers 98% of active devices. Python versions 3.9, 3.10 and 3.11 are now supported (#661). Detect changes to files or directories listed in requirements files (#660). Projects are no longer required to have a local.properties file, as long as the ANDROID_HOME or ANDROID_SDK_ROOT environment variable is set (#672). Enable all warnings, including DeprecationWarning, PendingDeprecationWarning, ImportWarning and ResourceWarning. Update pkg_resources from setuptools version 56.2.0. Update to SQLite version 3.39.2. Update Python 3.9 and later to OpenSSL version 3.0.5. 12.0.1 (2022-07-24)# First open-source release. Apart from removing the license restrictions, this is identical to version 12.0.0. 12.0.0 (2022-05-12)# Android Gradle plugin version 7.2 is now supported (#613). [BACKWARD INCOMPATIBLE] Android Gradle plugin version 4.0 is no longer supported. Update to Python version 3.8.13 (see its changelog for details). Update CA bundle to certifi 2021.10.8. Fix signal.valid_signals on 32-bit ABIs (#600). Allow buildscript configuration to be in a subproject (#615). 11.0.0 (2022-02-01)# Android Gradle plugin version 7.1 is now supported. [BACKWARD INCOMPATIBLE] Android Gradle plugin version 3.6 is no longer supported. Remove warning about untested Android Gradle plugin versions, as they are usually backward compatible. Gradle pluginManagement and plugins syntax is now supported. Java arrays now support the copy.copy function in Python. Passing an unsupported Java object to copy.copy, copy.deepcopy or pickle now fails with a clearer error message. 10.0.1 (2021-09-22)# Android Gradle plugin versions 4.2 and 7.0 are now supported. [BACKWARD INCOMPATIBLE] Android Gradle plugin versions 3.4 and 3.5 are no longer supported. [BACKWARD INCOMPATIBLE] The version setting is no longer supported. Simply remove it to use the current version of Python. Update to Python version 3.8.11 (see its changelog for details). Update to pip version 19.2.3 (see its changelog for details). Update CA bundle to certifi 2021.5.30. Add a buffer attribute to stdout and stderr for bytes output (#464, #516). Java arrays now support the index and count methods in Python. In order to support code with hasattr checks, they also now implement the methods __contains__, __iter__ and __reversed__, rather than relying on the fallback to __getitem__ (#306). Fix “truth value of an array with more than one element is ambiguous” error when passing a NumPy array to a method which takes a Java array (#526). NumPy integer scalars, and anything else which implements the __index__ method, can now be used as a Java array index (#495). Add workaround to help conda Python on Windows find its SSL libraries (#450). Fix “invalid literal for int” error in pip_install when project path includes a symlink (#468). Fix crash caused by empty files in the APK on Android 7 (Electron Cash #2136). importlib.util.spec_from_file_location now works for paths loaded from the APK. 9.1.0 (2021-01-02)# Fix error “‘HTMLParser’ object has no attribute ‘unescape’” on Python 3.9 (#416). Fix error “must supply either home or prefix/exec-prefix – not both” on Homebrew for Mac (#405). buildPython path can now contain spaces. Java API is now annotated with @NotNull where appropriate. Java arrays now support the copy method in Python. Fix bug when using cast to call a functional interface which extends another functional interface. Update CA bundle to certifi 2020.12.5. json module performance improvements. Java API performance improvements. 9.0.0 (2020-11-06)# Android Gradle plugin version 4.1 is now supported. [BACKWARD INCOMPATIBLE] Android Gradle plugin version 3.3 is no longer supported. Update to Python version 3.8.6 (see its changelog for details). Java/Kotlin objects implementing functional interfaces can now be called from Python using () syntax. This includes lambdas, method references, and any interface with a single abstract method, such as java.lang.Runnable. Java arrays can now be accessed from Python using negative indices and slice syntax. Fix conversion of non-contiguous NumPy arrays to Java arrays. Remove inaccessible directories from os.get_exec_path (#346). Make zipimport implement the new loader API. This affected the package dateparser. If bdist_wheel fails for an unknown reason, fall back on setup.py install. This affected the packages acoustics and kiteconnect (#338). Fix ClassNotFoundException when minifyEnabled is in use (#261). 8.0.1 (2020-07-28)# Make missing multiprocessing primitives throw an exception on use rather than on import. This affected the packages joblib and librosa (#21). Make ctypes.util.find_library search libraries installed with pip. This affected the package soundfile (#201). Fix “invalid constraint” error affecting the packages openpyxl and webcolors. 8.0.0 (2020-06-15)# Android Gradle plugin version 4.0 is now supported. [BACKWARD INCOMPATIBLE] Android Gradle plugin version 3.2 is no longer supported. Update to Python version 3.8.3 (see its changelog for details). Using Chaquopy in an Android library module (AAR) is now supported (#94). Java primitive arrays now support the Python buffer protocol, allowing high-performance data transfer between the two languages. Data files in top-level non-package directories are now extracted from the APK the first time the app is started, so they can be accessed using a path relative to __file__. 7.0.3 (2020-05-11)# Fix “This platform lacks a functioning sem_open implementation” error when using multiprocessing.dummy.Pool (aka multiprocessing.pool.ThreadPool). This affected many common uses of TensorFlow. Work around dynamic linker bug on 64-bit ABIs before API level 23 (#228). Fix out of memory error when running Gradle with a small heap size. Fix incompatibility with external package importlib_metadata (#276). Fix NoClassDefFoundError when using Python to access certain androidx classes, including AppCompatTextView. Fix conversion of Java byte[] array to Python bytearray. Improve startup speed by deferring pkg_resources initialization until the module is first imported. Update CA bundle to certifi 2020.4.5.1. 7.0.2 (2020-03-05)# [BACKWARD INCOMPATIBLE] Update to Python version 3.8.1 (see the 3.7 and 3.8 release notes for details). All Python standard library modules are now supported except those in this list. In particular, support has been added for bz2, importlib.metadata, importlib.resources and lzma. Most native packages have been upgraded to a more recent version. If you’ve used specific version numbers in a build.gradle or requirements.txt file, you may need to update them. See the repository index for a complete list. Android Gradle plugin version 3.6 is now supported. [BACKWARD INCOMPATIBLE] Android Gradle plugin version 3.1 is no longer supported. [BACKWARD INCOMPATIBLE] buildPython must now be at least Python 3.5. Expose Java API using api configuration so it’s available to dynamic feature modules. Update CA bundle to certifi 2019.9.11. Fix “cannot create a consistent method resolution order” error when using androidx. Fix a deadlock involving the Java API. Improve local caching of packages which aren’t available as wheels. Reduce some temporary filename lengths to avoid the Windows 260-character limit. Improve startup speed. 6.3.0 (2019-08-25)# Android Gradle plugin version 3.5 is now supported. Pre-compile Python code to .pyc format by default, so it doesn’t have to be compiled on the device. This significantly improves app startup speed and storage usage. Remove the extractPackages setting, as data files are now extracted automatically. See the documentation for details. Change data file location from cache to files directory, to prevent the user from clearing it while the app is running. Hide importer frames in stack traces, unless the exception originated from the importer itself. Fix another metadata parsing issue, this one affecting the package astroid. Fix “has no DT_SONAME” warning (#112). 6.2.1 (2019-04-19)# Android Gradle plugin version 3.4 is now supported. Update to OpenSSL 1.1.1b. This enables the BLAKE2 and SHA-3 algorithms in hashlib. Update CA bundle to certifi 2019.3.9. Implement pkgutil.iter_modules. Build pkg_resources into all apps. Many packages require this but don’t declare a dependency on setuptools. 6.0.0 (2019-03-08)# Android Gradle plugin version 3.3 is now supported. [BACKWARD INCOMPATIBLE] Android Gradle plugin version 3.0 is no longer supported. The ABI x86_64 is now supported. 5.1.2 (2019-01-19)# Add PyObject primitive conversion methods (toBoolean, toInt, etc.). Add PyObject container view methods (asList, asMap and asSet). If pkg_resources is installed in your app, its “basic resource access” functions will now work. Remove directory names when converting exception stack traces from Python to Java. This works around a bug in Google Play which was causing crash reports to be incomplete. Change default character encoding from ASCII to UTF-8. Make APK build more reproducible. 5.0.0 (2018-11-05)# The ABI arm64-v8a is now supported. [BACKWARD INCOMPATIBLE] Each Chaquopy version will now include only one Python version, so the version setting is no longer required. Simply remove it to use the current version, 3.6.5. Python 2 is no longer included. However, for existing Python 2 users, Chaquopy 4.x will continue to be maintained until the end of 2019 (#39). [BACKWARD INCOMPATIBLE] buildPython must now be at least Python 3.4. [BACKWARD INCOMPATIBLE] minSdkVersion must now be at least API level 16. This still covers 99% of active devices. Runtime components are now distributed as separate Maven artifacts. This fixes various intermittent build errors involving chaquopy_java.jar (#62). If pkg_resources is installed in your app, it will now detect all pip-installed packages. 4.0.0 (2018-08-22)# Android Gradle plugin version 3.2 is now supported. [BACKWARD INCOMPATIBLE] Android Gradle plugin version 2.3 is no longer supported. Add resource module. Remove broken select.kevent/select.kqueue API. This affected PyZMQ, which should now work (Crystax issue #1433). Set HOME environment variable if the system hasn’t already done so, so os.path.expanduser can return a usable location. Implement importlib.abc.InspectLoader.get_code: this allows runpy.run_module to be used. 3.3.2 (2018-08-01)# Fix pip issues involving packages with optional native components (e.g. websockets). Work around inability of Android dynamic linker on API level 22 and older to load multiple modules with the same basename (details here). Fix ctypes.pythonapi and sys.abiflags, and provide partial implementation of sysconfig.get_config_vars. Fix native crash in lrintf / feholdexcept / fegetenv (Crystax issue #1369). Fix pkgutil.get_data when used with extractPackages, and improve extractPackages performance. 3.3.0 (2018-06-20)# Add fast conversions between Python bytes/bytearray and Java byte[] (#41). Make pip evaluate environment markers (PEP 508) and data-requires-python attributes (PEP 503) against the target platform rather than the build platform. Make pip only prioritize native wheels (not pure-Python wheels) over sdists of a newer version. Fix pip issues when multiple packages provide the same directory or filename. Improve pip error messages when packages attempt to build native code. 3.2.0 (2018-06-06)# Add Python"
