["https://charingcrosstheatre.co.uk/about-us/theatre-history"]
title = "Charing Cross Theatre"
description = "The Charing Cross Theatre and Players Bar, London. A 263 seat Theatre and late night bar near Charing Cross Station  Charing Cross Theatre"
full_description = "Since 1864, there has been a theatre under the arches at Charing Cross Station. Known throughout the years by several names (Gattis-in-The-Arches, The Players Theatre and the New Players Theatre), the theatre was rechristened the Charing Cross Theatre in January, 2011 to mark the change in its ownership and the new era on which it was embarking. Although the Music Hall tradition is still honoured with periodic Sunday performances, the Charing Cross Theatre has operated as a legitimate commercial venue since 2002. The current management is committed to presenting affordable theatrical productions of the highest standards, while maintaining a collaborative atmosphere where seasoned professionals can work with emerging young talent. Recent productions include the UK premiere of Violet; Harold and Maude starring Sheila Hancock; the first London revival of The Woman in White; the stage premiere of The Knowledge directed by Maureen Lipman; The Braille Legacy; the UK premiere of Maury Yeston's Death Takes A Holiday; and the critically acclaimed revivals of Ragtime and Titanic. Past productions include The Exonerated; Thrill Me; the transfer from Broadway of Ghetto Klown, starring John Leguizamo; Fascinating Aida: Cheap Flights; Facing The Music starring Patricia Routledge; the world premiere of 6 Actors in Search of a Director, written and directed by Steven Berkoff; the critically acclaimed production of Tennessee Williams’ Vieux Carre; the Olivier Award-winning production of La Bohème; the UK Premier of Jerry Herman’s Dear World starring Betty Buckley; Jacques Brel is Alive and Well and Living in Paris; The Mikado; a six month run of Dusty; Piaf and Tennessee Williams’ In The Bar Of A Tokyo Hotel. Welcome to the Charing Cross Theatre and the Players Bar and Kitchen. This 'hidden gem' venue has everything you will need for an unforgettable experience under one roof. Our theatre, a former Victorian music hall, offers an eclectic mix of drama, musicals, comedy, cabaret and even some late night shows. Our diverse programme has something to suit every theatrical taste."
year_published = 2025
