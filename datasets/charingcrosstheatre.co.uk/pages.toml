full_description = "The Charing Cross Theatre and Players Bar and Kitchen have unimpeded access from the Strand or Embankment into the foyer of the venue. From here there is level access to Balcony One for the Theatre, box office, disabled toilet facilities, the bars and restaurant. The main stalls level is 16 steps down from the main entrance, with handrails on either side. The toilets for the main stalls are a further 8 steps down from the doors to the Theatre. Seating within the theatre is gently raked from row C onwards. Row K on the central aisle is on the same level as the doors to the theatre and has the most leg room of all rows. Please call the Box Office on 0207 925 8040 to discuss seating options. We offer a complimentary ticket for a carer attending a performance. For access patrons arriving by car or taxi to Villiers Street, please call us the day before the performance and we will be able to supply an access code for Villiers Street. Welcome to the Charing Cross Theatre and the Players Bar and Kitchen. This 'hidden gem' venue has everything you will need for an unforgettable experience under one roof. Our theatre, a former Victorian music hall, offers an eclectic mix of drama, musicals, comedy, cabaret and even some late night shows. Our diverse programme has something to suit every theatrical taste."
