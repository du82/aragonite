full_description = "This privacy policy sets out how the Charing Cross Theatre uses and protects any information that you give us when you use this website. Charing Cross Theatre is committed to ensuring that your privacy is protected. Should we ask you to provide certain information by which you can be identified when using this website, then you can be assured that it will only be used in accordance with this privacy statement. Charing Cross Theatre may change this policy from time to time by updating this page. You should check this page from time to time to ensure that you are happy with any changes. This policy is effective from 21/05/18. name and job title contact information including email address demographic information such as postcode, preferences and interests other information relevant to customer surveys and/or offers We require this information to understand your needs and provide you with a better service, and in particular for the following reasons: Internal record keeping. We may use the information to improve our products and services. We may periodically send promotional emails about new products, special offers or other information which we think you may find interesting using the email address which you have provided. We are committed to ensuring that your information is secure. In order to prevent unauthorised access or disclosure, we have put in place suitable physical, electronic and managerial procedures to safeguard and secure the information we collect online. The Charing Cross Theatre reserves the right to access and disclose Personal Data to comply with applicable laws and lawful government requests or requests by the police investigating suspected illegal activities, to operate our systems properly or to protect ourselves or other Charing Cross Theatre patrons. We also reserve the right to disclose Personal Data to third parties if a complaint arises concerning your use of tickets to the Charing Cross Theatre, and that use is deemed by us to be inconsistent with the Conditions."
