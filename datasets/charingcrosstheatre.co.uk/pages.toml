["https://charingcrosstheatre.co.uk/theatre/mrs-president"]
title = "Charing Cross Theatre"
description = "Art Pond Foundation presentsMRS PRESIDENTWritten by John Ransom PhillipsDirected by Bronagh LaganIn Mrs President, Mary Lincoln is a woman at war—with her grief, her detractors, and herself. Vilified by an envious elite and accused of treason, she strives to rebuild her public image to win the hearts of the American people. She turns to the world’s first celebrity photographer, Matthew Brady, who helped her husband, Abraham Lincoln, win the presidency. But their partnership unravels into a tense battle for creative control. As Mary fights to tell her story, the play delves into themes of power, identity, female agency, and the cost of representation.With a richly textured script by acclaimed artist, playwright, and historian John Ransom Phillips, Mrs President invites audiences into a gripping examination of history’s biases and the human need to define ourselves. Described as “evocative” and “unmissable,” this brand new London production brings to life an intimate and politically charged portrait of America’s most misunderstood First Lady.⭐⭐⭐⭐⭐"
