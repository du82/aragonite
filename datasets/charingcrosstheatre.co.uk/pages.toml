["https://charingcrosstheatre.co.uk/about-us/meet-the-team"]
title = "Charing Cross Theatre"
description = "The Charing Cross Theatre and Players Bar, London. A 263 seat Theatre and late night bar near Charing Cross Station  Charing Cross Theatre"
full_description = "Welcome to the Charing Cross Theatre and the Players Bar and Kitchen. This 'hidden gem' venue has everything you will need for an unforgettable experience under one roof. Our theatre, a former Victorian music hall, offers an eclectic mix of drama, musicals, comedy, cabaret and even some late night shows. Our diverse programme has something to suit every theatrical taste. Vaughan was a founder shareholder in and is Chairman of the Charing Cross Theatre, where he has been a regular producer. Following an English Literature degree at London University, Vaughan enjoyed a long career in the City of London. Initially qualifying as a Chartered Accountant with Deloitte, he then joined merchant bankers Morgan Grenfell & Co., where he was appointed to the main Board in 1993. Following the merger with Deutsche Bank, he was appointed a Managing Director in Deutsche's Investment Bank, where he managed UK Debt Capital Markets. Vaughan later specialised in Structured Finance, where he held a variety of positions in Asset and Project Finance, including Head of the London Office and Global Head of Risk. Since retiring from banking in 2012, Vaughan divides his time between the theatre and property industries. His theatre productions include: 6 Actors In Search Of A Director, written and directed by Steven Berkoff; the UK première of Jerry Herman’s Dear World, starring Betty Buckley and written and directed by Gillian Lynne; the Olivier Award-winning production of La Bohème; In The Bar Of A Tokyo Hotel, by Tennessee Williams, starring Linda Marlowe; a number of shows currently in production/development. Vaughan has also fulfilled a longheld ambition to appear on stage as lead guitarist in a rock and roll band. Steven has spent the past 30 years as a theatrical producer, general manager and theatre owner in both New York and London. Broadway includes: Whoopi - The 20th Anniversary Show (Lyceum, starring Whoopi Goldberg); Oldest Living Confederate Widow Tells All (Longacre, starring Ellen Burstyn); Our Town (Booth, starring Paul Newman); I’m Not Rappaport (Booth, starring Judd Hirsch and Ben Vereen); Dame Edna: The Royal Tour (Booth); The Beauty Queen Of Leenane (Water Kerr); The Lonesome West (Lyceum); Waiting In The Wings (Walter Kerr, starring Lauren Bacall). West End includes: In The Bar Of A Tokyo Hotel, Piaf, The Mikado, Jacques Brel Is Alive And Well And Living In Paris, Long Story Short, Finian’s Rainbow, Ushers: The Front Of House Musical, Jerry Herman’s Dear World, the Olivier Award-winning La Bohème, 6 Actors In Search Of A Director (written and directed by Steven Berkoff), Fascinating Aïda – Cheap Flights, The Man On Her Mind, John Leguizamo - Ghetto Klown, Patricia Routledge – Facing The Music, Thrill Me (Charing Cross); Singular Sensations, Tom Stoppard’s The Invention Of Love (Theatre Royal, Haymarket); Nixon’s Nixon (Comedy); Gross Indecency (Gielgud); The Boys In The Band (Aldwych)."
