full_description = "Guidelines for editorials An editorial is an article written by one or more members of the editorial staff of the Charlatan. Editorials are a position the newspaper takes on a given topic. They are opinion pieces, and do not affect the paper’s coverage. Editorials at the Charlatan are chosen by a majority vote of the staff, based on the paper’s coverage that week. It may or may not represent the views of the entire staff. The purpose of an editorial is to give a publication the opportunity to provide an informed opinion on the stories they cover. Any specific person or organization mentioned in an editorial are not affiliated with the opinions that are expressed. These are the opinions of the Charlatan."
