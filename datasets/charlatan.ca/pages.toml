["https://charlatan.ca/carleton-ukrainian-conflict-three-years"]
title = "Carleton Ukrainian group rallies support for frontline civilians"
description = "Carleton Ukrainian group rallied support for frontline civilians as Russia's full-scale invasion of Ukraine hits three years."
full_description = '''Home Culture & Community Carleton Ukrainian student group rallies support for frontline civilians as conflict surpasses... Carleton Ukrainian student group rallies support for frontline civilians as conflict surpasses 3 years By Abyssinia Abebe - March 1, 2025 45 [Left to right] Mikhail Shastko, Julia Oleksiw and Anastasiia Kostianets, members of the Carleton Ukrainian Students’ Club, at the club’s fundraiser event on Feb. 14, 2025. [Photo by Abyssinia Abebe/the Charlatan] As the Ukrainian community marks the third year of Russia’s full-scale invasion of Ukraine on Feb. 24, Ukrainian student groups are rallying support through fundraisers to aid those on the front lines. The Carleton Ukrainian Students’ Club (CUSC) was among many student groups across Canada to organize a fundraiser event, in collaboration with the Ukrainian Canadian Student’s Union (SUSK). “A lot of Ukrainian clubs at different universities are organizing the fundraiser around Canada almost at the same time before the anniversary,” said Anastasiia Kostianets, a third-year Carleton health science student and co-president of the Carleton student club. The club organized the event at the Nideyinan Galleria on Feb. 14. Featured at the event was On the Ruins with Hope, a photo exhibit by Kostyantyn Liberovy and Vlada Liberovy, a Ukrainian couple capturing the war’s frontlines through photography. Along with the photo exhibit, the club also sold traditional Ukrainian pastries and baked goods, including honey and chocolate cakes usually made during Christmas celebrations, which Kostianets said were made by a local Ukrainian family. “They were also doing a fundraiser for those cakes, so they were helping us and we were helping them,” she said. Kostianets said bake sale proceeds will be donated to MBF Support Service, a charity foundation established by Ukrainian veterans providing assistance to military personnel, civilians and animals affected by the war. Kostianets said the Ukrainian students’ club worked in collaboration with SUSK to choose the organization receiving the donations. “We decided to choose [MBF Support Service] because it’s a small organization,” Kostianets said. “Donations matter more to smaller organizations.” #tdi_2_39e .td-doubleSlider-2 .td-item1 { background: url(https://charlatan.ca/wp-content/uploads/2025/02/ukrainephoto1-80x60.jpg) 0 0 no-repeat; } #tdi_2_39e .td-doubleSlider-2 .td-item2 { background: url(https://charlatan.ca/wp-content/uploads/2025/02/ukrainephoto3-80x60.jpg) 0 0 no-repeat; } #tdi_2_39e .td-doubleSlider-2 .td-item3 { background: url(https://charlatan.ca/wp-content/uploads/2025/02/ukrainefood-80x60.jpg) 0 0 no-repeat; } 1 of 3 A series of pictures from On the Ruins with Hope, a photo exhibit displayed at the Feb. 14 fundraiser event. Taken on Feb. 14, 2025. [Photo provided by Carleton Ukrainian Students’ Club.] A series of pictures from On the Ruins with Hope, a photo exhibit displayed at the Feb. 14 fundraiser event. Taken on Feb. 14, 2025. [Photo provided by Carleton Ukrainian Students’ Club.] The Ukrainian traditional cakes sold at the fundraiser were locally made by a Ukrainian family. The honey and chocolate cakes are usually made during christmas or other major Ukrainian celebrations. [Photo provided by Carleton Ukrainian Students’ Club.] Mikhail Shastko, a second-year Carleton music student and club member, said supporting Ukraine, even in the smallest of ways, is important. “Every little thing is proof that [the war] is not going to be forgotten,” he said. Amid the devastation of the war, Shastko said the photo exhibit is a call for resilience and hope for the Ukrainian community. Looking at one photo from On the Ruins with Hope, he said Ukrainian traditional clothes – usually worn during celebrations and holidays – contrast with the machinery, ruins and Russian weaponry depicted in the background. For Kostianets, this artistic choice “hits close to home.” She pointed to one displayed photo of Ukrainian model Kateryna, standing in front of a monument covered with hundreds of sand bags. Kostianets said when the war started in Ukraine, people stacked the bags on historically significant buildings to protect them from destruction. “It gives me a lot of flashbacks,” she said. “It’s such a weird photo for me because when I see Ukrainia n traditional clothes, it reflects celebration and happiness, and then I see something behind her which is war-related and it gives a sense of anti-utopia of the two distinct realities.” In Ukrainian literature, Kateryna is a symbol for blameless sacrifice, suffering and unbreakable strength of spirit amid destruction, according to the photo’s description. On the Ruins with Hope captures the “invincible” spirit of Ukraine, depicted through Kateryna, who stands in the ruins of Russian military weaponry. Commonly referred to as the Ukrainian Mona Lisa, Kateryna, a famous character in Ukrainian literature, is depicted by a Ukrainian model. Kateryna represents Ukrainian purity and resilience amidst war debris and weaponry on Feb. 14, 2025. [Photo provided by Carleton Ukrainian Students’ Club]Shastko said he appreciated the intentionality of the photos. “Weapons are ugly, war is ugly but if we can just get to the end and preserve ourselves, whatever happens, we will be there at the end,” he said. Along with the photo exhibit and baked goods, students could sign postcards, which will be delivered to Ukrainian soldiers at the frontlines, according to Valeriia Gusieva, a fourth-year Carleton social work student and the club’s events co-ordinator. A first round of postcards were sent in November “A lot of soldiers at the frontlines are super young and they could have been [students] at universities before the full-scale invasion,” Gusieva said. “Even though we’re going through a tremendous loss, people continue to fight.” Gusieva said the second round of postcards will be delivered after SUSK finishes collecting the postcards from Ukrainian student groups across Canada. “We got messages back from [soldiers] saying a huge thank you because they feel that they have not been forgotten,” she said. “They feel loved.” Gusiea said their response was proof that although Ukraine is not always making headlines in major newspapers, the war is ongoing. “Real people are still there on the battlefield and they do need our support,” she said. Gusieva said she appreciates the photographers’ trauma-informed approach. “People are so used to just seeing traumatic photos from the battlefield, and I feel like the photographers did such a nice job sending a [strong] message without triggering anyone,” Gusieva said. “[The photographers] are sort of switching the narrative. Ukraine is no longer the victim but actually taking that power back.” Shastko said the blue and yellow on the Ukrainian flag give her a sense of hope everytime she sees them. He said the colours represent “the golden wheat fields and blue skies of Ukraine.” Even during challenging times, he said looking at the flag reminds him what Ukraine was. “Even if you’re in a bunker hiding, or it’s cold and dark outside … you’ll look at the flag and you see Ukraine,” he said. “You see home.” Featured Image by Abyssinia Abebe/the Charlatan. Previous article2025 Academy Awards predictions: ‘Conclave’ and ‘Anora’ to win big in a competitive yearNext article2025-26 Editor-in-Chief Elections Abyssinia Abebe var block_tdi_4_377 = new tdBlock(); block_tdi_4_377.id = "tdi_4_377"; block_tdi_4_377.atts = '{"limit":3,"ajax_pagination":"next_prev","live_filter":"cur_post_same_categories","td_ajax_filter_type":"td_custom_related","class":"tdi_4_377","td_column_number":3,"live_filter_cur_post_id":117557,"live_filter_cur_post_author":"1744","block_template_id":"","header_color":"","ajax_pagination_infinite_stop":"","offset":"","td_ajax_preloading":"","td_filter_default_txt":"","td_ajax_filter_ids":"","el_class":"","color_preset":"","border_top":"","css":"","tdc_css":"","tdc_css_class":"tdi_4_377","tdc_css_class_style":"tdi_4_377_rand_style"}'; block_tdi_4_377.td_column_number = "3"; block_tdi_4_377.block_type = "td_block_related_posts"; block_tdi_4_377.post_count = "3"; block_tdi_4_377.found_posts = "1814"; block_tdi_4_377.header_color = ""; block_tdi_4_377.ajax_pagination_infinite_stop = ""; block_tdi_4_377.max_num_pages = "605"; tdBlocksArray.push(block_tdi_4_377); RELATED ARTICLESMORE FROM AUTHOR Basketball Ravens women’s basketball clinch finals meeting with uOttawa, nationals berth Jobs 2025-26 Section Editor Elections Jobs 2025-26 Editor-in-Chief Elections Support Student Journalism! Polls What’s your chosen alternative to salting the sidewalk? Sanding the sidewalk #earthy Gummy bearing the sidewalk #squishy Slip n sliding the sidewalk #weeeeee Abolish roads #everythingisasidewalk View Results Loading ... Gee Gee: “Can we pretend that airplanes in the night sky are like shooting stars…” Rodney Raven: “I could really use a wish right now, wish right now, wish right now…” Results U Sports Final 8 women's basketball Finals Saskatchewan Huskies WBAL 67 Ravens WBAL 70 March 10, 2024 - 9:30 pm U Sports Final 8 women's basketball Semifinals Ravens WBAL 74 Queen’s Gaels WBAL 40 March 9, 2024 - 10:00 pm U Sports Final 8 women's basketball Quarter Finals Ravens WBAL 75 UFV Cascades WBAL 58 March 7, 2024 - 2:30 pm Newsletter(function() { window.mc4wp = window.mc4wp || { listeners: [], forms: { on: function(evt, cb) { window.mc4wp.listeners.push( { event : evt, callback: cb } ); } } } })(); First Name Last Name Email address Sign Up Leave this field empty if you're human: 3,000FansLike1,100FollowersFollow4,000FollowersFollow1,500SubscribersSubscribe Ottawa broken clouds enter location -13.5 ° C -12.8 ° -14.6 ° 69 % 5.1kmh 75 % Sun -12 ° Mon -4 ° Tue 0 ° Wed 2 ° Thu 3 °'''
