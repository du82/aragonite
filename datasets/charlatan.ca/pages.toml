description = "Interested in running for the position of section editor at the Charlatan? Here’s a cheat sheet of everything you need to know about our upcoming elections and their procedures. Important Dates: Applications due on March 16th @ 11:59 p.m. EST. Speeches will take place from March 17th, March 18th and March 20th (between 10 a.m. and […]"
full_description = '''Home Jobs 2025-26 Section Editor Elections 2025-26 Section Editor Elections By The Charlatan - March 1, 2025 31 Interested in running for the position of section editor at the Charlatan? Here’s a cheat sheet of everything you need to know about our upcoming elections and their procedures. Important Dates: Applications due on March 16th @ 11:59 p.m. EST. Speeches will take place from March 17th, March 18th and March 20th (between 10 a.m. and 5 p.m. on those days) via Zoom. Voting will take place from March 20th and March 21st, 2025. Eligible voters will receive an email from the Chair of the Charlatan Board of Directors. Results will be announced latest by March 25th. To Apply: Those interested in running for a section editor position must submit a cover letter (containing the candidate’s full name, mailing address, telephone number, email address, and valid student number) expressing their interest and qualifications for the position, a one-page (double-sided) CV, and a platform paper introducing the candidate to voters and expressing any ideas they have for the paper. Candidates may not run for more than one position. Applications should be submitted to the Chief Editorial Returning Officer (Jayden Dill) at chair.charlatan@gmail.com. During the speech period, candidates will give a speech of no more than three (3) minutes. A question period will follow and last fifteen (15) minutes, not including the three (3) questions from the current editor. Questions during the question period may be posed by current editors, candidates for other positions, and eligible voters. Each person is eligible to ask up to two questions, and candidates have one (1) minute to respond to each. Interested candidates must have contributed to the section they are running for at least four (4) times between May 2024 and the deadline for applications, with exception of those running for the features section, who must only have contributed once. Eligible sections include news, features, op-ed, arts and culture, sports, and culture & community. Campaign Procedures: No candidate may actively solicit votes by using the Charlatan contact lists to phone or email volunteers. This does not mean candidates cannot attempt to garner votes; however, they must do it on their own time and with their own resources. Any current editor running for another position cannot solicit votes using any official communication or in any working capacity. A candidate found to be using the Charlatan resources to do so will be disqualified at the discretion of the Chief Electoral Officer. To Be an Eligible Voter: One must have contributed once to the section they are voting for between May 2024 and the application deadline. If you have contributed to the Charlatan a minimum of four (4) times, you may vote for any position. A list of eligible voters will be posted to the Charlatan website no later than three days before speeches. Additional Information: Examples of previous position papers can be found at the following here. Any questions should be directed to Jayden Dill, Chief Editorial Returning Officer, at chair.charlatan@gmail.com. Previous article2025-26 Editor-in-Chief ElectionsNext articleRavens women’s basketball clinch finals meeting with uOttawa, nationals berth The Charlatan var block_tdi_3_1cd = new tdBlock(); block_tdi_3_1cd.id = "tdi_3_1cd"; block_tdi_3_1cd.atts = '{"limit":3,"ajax_pagination":"next_prev","live_filter":"cur_post_same_categories","td_ajax_filter_type":"td_custom_related","class":"tdi_3_1cd","td_column_number":3,"live_filter_cur_post_id":117573,"live_filter_cur_post_author":"19","block_template_id":"","header_color":"","ajax_pagination_infinite_stop":"","offset":"","td_ajax_preloading":"","td_filter_default_txt":"","td_ajax_filter_ids":"","el_class":"","color_preset":"","border_top":"","css":"","tdc_css":"","tdc_css_class":"tdi_3_1cd","tdc_css_class_style":"tdi_3_1cd_rand_style"}'; block_tdi_3_1cd.td_column_number = "3"; block_tdi_3_