title = "2025-26 Editor-in-Chief Elections - The Charlatan, Carleton's independent newspaper"
description = "Interested in running for the position of editor-in-chief at the Charlatan? Here’s everything you need to know about our upcoming elections and their procedures. Important Dates: Applications due on Tuesday March 12th @ 11:59 p.m. EST. Speeches will take place on March 13th (between 11 a.m. and 5 p.m. on those days) via Zoom. Voting […]"
full_description = '''Home Jobs 2025-26 Editor-in-Chief Elections 2025-26 Editor-in-Chief Elections By The Charlatan - March 1, 2025 23 Interested in running for the position of editor-in-chief at the Charlatan? Here’s everything you need to know about our upcoming elections and their procedures. Important Dates: Applications due on Tuesday March 12th @ 11:59 p.m. EST. Speeches will take place on March 13th (between 11 a.m. and 5 p.m. on those days) via Zoom. Voting will take place on March 14th to 15th. Eligible voters will receive an email from the Chair of the Charlatan Board of Directors. Results will be announced by March 18th. To Apply: Those interested in running for the position of editor-in-chief must submit a cover letter (containing the candidate’s full name, mailing address, telephone number, email address, and valid student number) expressing their interest and qualifications for the position, a one-page (double-sided) CV, and a platform paper introducing the candidate to voters and expressing any ideas they have for the paper. Applications should be submitted to the Chief Editorial Returning Officer (Jayden Dill) at chair.charlatan@gmail.com. During the speech period, candidates will give a speech of no more than ten (10) minutes. A question period will follow and last sixty (60) minutes, not including the three (3) questions from the current editor-in-chief. Questions during the question period may be posed by current editors, candidates for other positions, and eligible voters. Each person is eligible to ask up to two questions, and candidates have three (3) minutes to respond to each. Interested candidates are strongly encouraged to have contributed to the Charlatan at least four (4) times between May 2023 and the deadline for applications. Campaign Procedures: No candidate may actively solicit votes by using the Charlatan contact lists to phone or email volunteers. This does not mean candidates cannot attempt to garner votes; however, they must do it on their own time and with their own resources. Any current editor running for another position cannot solicit votes using any official communication or in any working capacity. A candidate found to be using the Charlatan resources to do so will be disqualified at the discretion of the Chief Electoral Officer. To Be an Eligible Voter: One must be a regular contributor, meaning you have contributed four (4) times to any Charlatan section(s) from May 2024 to the application deadline. A list of eligible voters will be posted to the Charlatan website no later than three days before speeches. Additional Information: Examples of previous position papers can be found in the following here. Any questions should be directed to Jayden Dill, Chief Editorial Returning Officer, at chair.charlatan@gmail.com. Official electoral procedures can be found here. Zoom links to elections speeches will be made available via the Charlatan’s website/social media the week of. Official schedules will be available at least one day before the speeches. Featured graphic from file. Previous articleCarleton Ukrainian student group rallies support for frontline civilians as conflict surpasses 3 yearsNext article2025-26 Section Editor Elections The Charlatan var block_tdi_3_d33 = new tdBlock(); block_tdi_3_d33.id = "tdi_3_d33"; block_tdi_3_d33.atts = '{"limit":3,"ajax_pagination":"next_prev","live_filter":"cur_post_same_categories","td_ajax_filter_type":"td_custom_related","class":"tdi_3_d33","td_column_number":3,"live_filter_cur_post_id":117570,"live_filter_cur_post_author":"19","block_template_id":"","header_color":"","ajax_pagination_infinite_stop":"","offset":"","td_ajax_preloading":"","td_filter_default_txt":"","td_ajax_filter_ids":"","el_class":"","color_preset":"","border_top":"","css":"","tdc_css":"","tdc_css_class":"tdi_3_d33","tdc_css_class_style":"tdi_3_d33_rand_style"}'; block_tdi_3_d33.td_column_number = "3"; block_tdi_3_d33.block_type = "td_block_related_posts"; block_tdi_3_d33.post