iews Complete Citation: Agawu, Kofi. Review of Classical Music and Postmodern Knowledge, by Lawrence Kramer. Music & Letters (1997) 78/1: 127-129.Source: JournalIII. Book-Length StudiesC. Book Reviews Ahlstrom, David Year: 1991Complete Citation: Ahlstrom, David. “The Problem of the Unfinished: A Cart, a Deity, and Ives's Universe Symphony.” Sonus 11/2 (Spring 1991): 65-76.Source: JournalIV. Individual Studies by GenreA. Orchestral and Band Works Ahn, Eun G. [안은지] Complete Citation: Ahn, Eun G. “논문 : 아이브스의 바이올린 소나타 2번과 4번에 나타난 음악적 특징.” 음악과 민족, vol. 49 (2015): 201.Notes: Translates to “Thesis: Musical Characteristics of Ives’ Violin Sonata Nos. 2 and 4”<br> IV. Individual Studies by GenreB. Chamber Works Pagination Current page 1 Page 2 Page 3 Page 4 Page 5 Page 6 Page 7 Page 8 Page 9 … Next page Next › Last page Last »'''
