["https://charlesives.org/ives-studio"]
title = "From the Ives Studio | Charles Ives Society"
full_description = "Below you will find a release schedule of 12 videos we have produced for a new commentary series, From the Ives Studio, to celebrate Ives' 150th anniversary! In every month of 2024 the Society will post a new commentary by a scholar, writer or performer offering a very personal perspective on Ives. You can find them on this page and on our YouTube channel! The videos are shot at the American Academy of Arts and Letters, which transferred Mr. Ives' studio from his summer home in West Redding CT to the Academy's headquarters in Manhattan in 2012. The entire studio has been painstakingly re-created at the Academy - all the bookshelves, desks, bulletin board, Ives' piano, all the photos, everything is placed at the Academy in the precise location it occupied in the Ives home in West Redding. January / Eve Beglarian (Composer; Performer) February / Jan Swafford (Composer; Author: Charles Ives: A Life with Music) with James Sinclair (Music Director, Orchestra New England; Executive Editor, Charles Ives Society) March / J. Peter Burkholder (Professor Emeritus, Indiana University School of Music; Author: Listening to Charles Ives) April / Denise Von Glahn (Professor of Musicology, Florida State University) May / Cody Upton (Executive Director, American Academy of Arts and Letters) June / Eric Hofbauer (Jazz and Contemporary Music - Department Chair, Guitar: Longy School of Music of Bard College; Prehistoric Jazz volume 3: Three Places in New England / Eric Hofbauer Quintet) July / Suzanne Lovejoy (Music Librarian for Access & Research Services, Yale University Music Library) August / Joel Sachs (Conductor; Pianist; Author; Co-Director, Continuum; Professor Emeritus, The Juilliard School) September / James Sinclair (Music Director, Orchestra New England; Executive Editor, Charles Ives Society) October / Kyle Gann (Composer; Author: Charles Ives's Concord: Essays After a Sonata; Professor of Music: Bard College) November / Carol Oja (William Powell Mason Professor, Department of Music and Graduate Program in American Studies; Faculty Director of the Humanities Program, Radcliffe Institute for Advanced Studies / Harvard University) December / Jan Swafford (Composer; Author: Charles Ives: A Life with Music) Performances Charles Ives Society President Donald Berman performs The Alcotts from the Concord Sonata"
year_published = 2025
