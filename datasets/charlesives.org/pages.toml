title = "Recommended Reading | Charles Ives Society"
full_description = "Below you'll find a list of recommended books relating to Charles Ives, containing summaries, publishing information, and relevant links, listed in chronological order. Charles Ives and His MusicHenry Cowell and Sidney CowellNew York: Oxford University Press, 1955Find This Book at Yale In Charles Ives and His Music (1955), Henry and Sidney Cowell write a compelling account of Charles Ives’s life and creative ideals. Overall, the Cowells illustrate the principles underlying Ives’s music, and its progress toward public and critical acceptance. The second half of the book offers detailed discussions of Ives’s compositional style, examining his approach to musical elements such as polyphony, harmony, melody, and rhythm.This was the first biography written about Charles Ives, published one year after his death. The book draws on Ives’s autobiographical manuscripts, as well as his published essays. The authors’ perspective reflects their friendship with Ives, presenting a personal understanding of his family life, career as an insurance executive, and pursuits as a composer.Cowell refers to Ives as the “father of American music”1 because he was the first composer who questioned the value of European culture for American composition. In this way, Ives set the precedent for “the grammar of a new symphonic speech.”2 By the 1950s, the influence of his musical style could be heard not only in the concert hall, but also in music for film and Broadway.Ives’s musical innovations were rooted in both the popular folk music of his youth and the high-minded ideals of Transcendentalist thinkers such as Emerson and Thoreau. While Ives’s influences, ideas, and musical language may at first seem contradictory, Cowell explains the meaning of such paradoxes: “he believes that full expression of the opposing aspects of any idea whatever is a necessary step on the way to perfect truth.”3The composer carried his philosophical ideals over into the business of life insurance. In Ives’s manual The Amount to Carry — Measuring the Prospect, Cowell includes quotations that encourage salesman to appeal to the “strength of the average mind”4 and contribute to the “progress of the greater life values.”5 Such passages parallel Ives’s exploration of new musical possibilities in his composition.The biography covers in detail the musical influence of his father, George, Ives’s studies at Yale, and the challenges he faced because of his experimental and highly original compositions. Later on in his life, Ives’s declining health led him to retire from the insurance business and stop composing. Cowell also highlights fascinating early performances that initiated the success of Ives’s music. These include the 1920 premiere of the Concord Sonata in New Orleans, the first European performances of Three Places in New England in the early 1930s, for which Anton Webern conducted the Vienna premiere, and the 1951 performance of the Second Symphony with Leonard Bernstein and the New York Philharmonic.Charles Ives did not attend the performance of his Second Symphony in 1951, for fear that he would be upset by the way it would be performed. He did, however, listen to the radio broadcast, and Cowell describes that “Ives did venture downstairs to listen to it on the maid’s little radio in the kitchen… he emerged from the kitchen doing an awkward little jig of pleasure and vindication.”6Charles Ives was an early visionary of American music. The Cowell biography not only demonstrates the thoughtful individual behind this vision, but also the journey of these compositions into the world.1 p. 42 p. 53 p. 1424 p. 565 p. 566 p. 136 more Charles E. Ives: MemosJohn KirkpatrickNew York: W.W. Norton, 1972Find This Book at Yale The Memos are a collection of Ives’s previously unpublished writings from the early 1930s onward, compiled and annotated by John Kirkpatrick. Published in 1972, the compilation is organized into three parts: “Pretext,” “Scrapbook,” and “Memories.” Kirkpatrick also includes twenty-one appendices, which range in content from Ives’s responses to Kirkpatrick’s questions on the Concord Sonata, to plans for an operatic libretto in collaboration with his wife, Harmony.Initially, Charles Ives did not intend these writings for publication, but rather as a way “to answer questions from people who were curious about his music.”1 Kirkpatrick also describes that the Memos were a way for the composer “to get things off his chest in a private way.”2The Memos began with an imaginary open letter in response to critics’ reviews of the 1931 European performances of his orchestral work, Three Places in New England. The critics commented that Ives’s music was influenced by composers such as Schoenberg and Hindemith. Primarily, Ives wanted to clarify that he had never heard the music of Schoenberg, and that all of his music was written before Hindemith started composing.The Scrapbook section contains specific information pertaining to dozens of his compositions, including the violin sonatas, symphonies, and works for solo piano. Ives also describes his experience studying music with Horatio Parker at Yale, and his views on the flexible nature of the “fundamental laws”3 of composition that were prescribed in his college courses. With regard to his professor, Ives says, “I had and have great respect and admiration for Parker and most of his music. (It was seldom trivial—his choral works have a dignity and depth that many of [his] contemporaries… did not have).”4Throughout the Memos, Ives offers invaluable accounts of his father as musical mentor, describing that “what my father did for me was not only in his teaching, on the technical side, etc., but in his influence, his personality, character, open-mindedness, and his remarkable understanding of the ways of a boy’s heart and mind.”5 In particular, he describes the importance of his father’s musical exercises given when he was a boy. One such example: playing and singing folk songs in two different keys at once. In addition, Ives describes his forthright views on musical aesthetics, claiming that it would have been impossible for him to write music for money and maintain his artistic ideals of innovation.In collecting Ives’s Memos and related writings, Kirkpatrick also included Ives’s own lists of his works, the first of which he wrote on the back of an Ives & Myrick life insurance calendar. These lists are annotated, include various alternate titles, and reveal that many of his church anthems have been lost. As well, the chapter “Chronological Index of Dates” serves as a significant resource for Ives’s positions as a church organist and the performances of his compositions. These examples represent just a few of the wide-ranging primary source materials offered in this book, providing insights into the first-hand perspectives of Charles Ives.1 p. 52 p. 213 p. 504 p. 495 p. 114-115 more Charles Ives Remembered: An Oral HistoryVivian PerlisNew Haven: Yale University Press, 1974Find This Book at Yale Vivian Perlis’s Charles Ives Remembered: An Oral History offers first-hand accounts of the composer through interviews with his family, friends, and musical collaborators. Published in 1974, this primary source book was the first oral history of an American composer. These interviews present insights into topics including Ives’s childhood, musical attitudes, personality, and early performances of his music.Perlis relates how “the way a composer translates his experience into the work created is elusive, and the relationships between Ives’s life and his music are intricate, subtle, and complex. The interviews exhibited in this book, with those who knew and worked with Charles Ives, cannot explain his music. They can, however, give a clearer picture of this extraordinary man and bring into focus the place and time in which he lived.”1Ives’s extensive correspondences, friendships, and relations to family members throughout his lifetime provide rich material for Perlis’s oral history. The book is divided into four sections that cover the arc of his life: “Youth and Yale Years,” “Insurance,” “Family, Friends, and Neighbors,” and “Music.”There are countless musical perspectives that are meaningful for the Ives performer, scholar, and listener. Ives’s nephew, Bigelow, recollects that his uncle wrote the song He Is There! in response to World War I: “He tried to get me to sing it, and if I didn’t sing with enough spirit or gusto, he would land both fists on the piano… There was one little passage which called for a real shout, but I shouted very timidly and he nearly hit the roof. ‘Can’t you shout better than that? That’s the trouble with his country—people are afraid to shout!’”2The discussions of Ives’s work as an insurance executive reveal a great deal about his role as a mentor to employees. George Hoffman was interviewed in 1969, and discusses how Ives set up educational classes for insurance agents in the 1910s. Hoffman, a supervisor for these classes, described that “Charlie was a humanitarian from the bottom of his heart to his head, and I came away from the first meeting feeling that he was a great philosopher and moralist.”3 Other interviews demonstrate Ives’s generosity to those who worked for him, as well as to his musical collaborators, family members, and charities.In the early 1940s Charles Ives made several private recordings in New York because he would get letters from performers asking how they should interpret his music. The recording engineer was Mary Howard, and in her interview, she describes these memorable recording sessions. Howard comments that “he knew exactly what he wanted and he got it.”4There are also interviews with many of the most significant early Ives performers, including conductors Nicolas Slominsky and Bernard Herrmann, pianist John Kirkpatrick, and soprano Mary Bell. Given Ives’s friendships with numerous composers, the book also includes notable interviews with Elliot Carter, Carl Ruggles, and Darius Milhaud, among others.In addition to the interviews, Vivian Perlis includes countless pictures, ranging from photos of Ives’s birthplace to advertisements from Ives’s insurance company to copies of concert programs and reviews. Through the variety of stories, accounts, and recollections, Charles Ives Remembered gives the reader access to the full scope of the composer’s life.1 (xix)2 p. 823 p. 564 p. 211 more Charles Ives: The Ideas Behind the MusicJ. Peter BurkholderNew Haven and London: Yale University Press, 1985Find This Book at Yale In Charles Ives: The Ideas Behind the Music, J. Peter Burkholder presents a detailed overview of the philosophical concepts underlying Ives’s compositions. The author demonstrates how Ives’s artistic purposes evolved over the course of his lifetime, culminating in his mature period of work. Furthermore, the book examines Ives’s prose work Essays Before a Sonata as a way of charting the development of the composer’s ideas throughout his career. Through this approach, Burkholder explains that “the diversity between and within Ives’s compositions and the radical changes in style and method at different stages of his career suddenly begin to make sense.”1The author provides an aesthetic analysis of Ives’s Essays Before a Sonata, outlining its ideas into three major foundations: “(1) a dualistic approach to issues, (2) a personal and social idealism, and (3) a reliance on personal intuition and experience rather than external authority.”2 Ives presents these ideas mainly in the context of 19th century Transcendentalist thinkers, such as Emerson, Thoreau, and Hawthorne. At the same time, however, Burkholder shows how many of these ideas were supported by other influences in his life, such as his family and education at Yale.Ives’s father, George, played an important role in shaping the composer’s musical experimentalism and philosophy. As Charles’s music teacher, George combined disciplined compositional technique with new explorations of musical sounds. Here, the young composer learned to rely on his own intuition, which “contributed immeasurably to his later self-reliance”3 as a musician. In addition, Burkholder describes how the Ives family had a generations-long tradition of social justice and religious ethics, which likely shaped Charles’s sense of philosophical idealism. With these notions, the young Ives wrote pieces with a direct purpose for the community, whether they were songs and choral works for church, or marches for the Danbury town band.The composer’s studies at Yale served as a major turning point in his artistic life. Through formal studies with Horatio Parker, Ives was able to distance himself from the musical traditions of his upbringing. Yale provided greater contact with the European tradition of classical music, allowing the composer to cultivate an individualistic identity that combined various musical styles. After college, Ives turned away from writing music for the public, enabling the artistic freedom to explore new compositional ideas without the scrutiny of an audience. Ives began to write new kinds of “concert pieces that are “about” vernacular styles and vernacular performance, quoting tunes, using familiar ragtime rhythms, and evoking the spirit and atmosphere of performances by amateur musicians.”4Ives continued to forge an original musical vision through his marriage to Harmony Twitchell. Through Harmony’s complete belief in his musical work, along with his separation from the professional music world, Ives could be confident in the importance of his unorthodox ideas. Burkholder describes that Harmony’s artistic inspiration led to a number of foundational ideas that would influence Charles Ives’s “largest, greatest, and most characteristic compositions.”5 These ideas included: the musical representation of emotional experiences, the expression of nostalgia, the inclusion of literary subjects in compositions, the development of an American musical identity, and a bolstering of Charles’s philosophical idealism.Over the course of the book, Burkholder explains the evolution of Ives’s ideas across his lifetime, and how the ideas were realized in his compositions. The author also demonstrates how these musical and philosophical concepts came about from the many influences in Ives’s life. Such an examination presents the music in its full context, allowing listeners, scholars, and performers to further engage with the numerous expressive aims of Charles Ives.1 p. 72 p. 83 p. 484 p. 855 p. 96 more Charles Ives: “My Father’s Song”Stuart FederNew Haven: Yale University Press, 1992Find This Book at Yale Charles Ives: “My Father’s Song” is a psychoanalytic biography by Stuart Feder, who was a psychiatrist and music scholar. Feder first encountered the music of Charles Ives in 1950 through Ives collaborator Henry Cowell, who was Feder’s professor at the Peabody Conservatory of Music. The author probes the mental life of Charles Ives to understand the "
