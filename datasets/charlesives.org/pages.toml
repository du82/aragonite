["https://charlesives.org/index.php/about-society"]
title = "About the Society | Charles Ives Society"
full_description = '''The Charles Ives Society is a not-for-profit organization that was formed to stimulate public interest in the music of Charles Ives (1874-1954) and to include and encourage the performance, recording, and study of his work, and the publication of definitive editions. The Society's revenues come from contributions, grants, and investment income.Since 1973, the Ives Society has been generously supported by grants from the American Academy of Arts and Letters, out of a fund established by the will of Harmony Twichell Ives (the composer's widow) "for furtherance of the publication and performance of the music and other works of . . . Charles E. Ives." Private individuals have also contributed to the work of the Society, and in 1983 it received a substantial bequest according to the wills of Rhoda and Vladimir Lakond. Mr. Lakond was a pioneer publisher of Ives's music as an executive of the Peer–Southern Organization.The Society is a 501c3 nonprofit organization but it is not a membership organization. We share information on performances, publications, recordings, awards and other news concerning Ives and his music through our Facebook page and Twitter feed.The Ives Society works in close cooperation with the Music Library of Yale University, which houses the Charles Ives Papers, and the publishers of Ives's music: Associated Music Publishers, C. F. Peters Corporation, Helicon Music Corporation, MJQ Music, Mobart Music Publications, Peer International Corporation, and Theodore Presser Company. General InquiriesDonald Berman, President and Treasurer Email Contact Information on Critical EditionsJames B. Sinclair, Executive Editor Email Contact Donationsc/o Donald Berman, President and Treasurer Granoff Music Center Tufts University 20 Talbot Avenue Medford, MA 02155 Board of Directors John AdamsDonald Berman, President & TreasurerWilliam BolcomLydia BrownNeely Bruce, Chair Artistic Advisory BoardJ. Peter Burkholder, Past PresidentDeirdre ChadwickDaniel DorffJonathan ElkusSusan FederKyle Gann, Senior Vice PresidentChelsey HammKaren HeymannRobert HurwitzJames M. Kendrick, Secretary Suzanne Eggleston LovejoyDrew MasseyRuthann McTyreTom C. OwensJoel SachsDavid SanfordWayne D. ShirleyDaniel StepnerJan SwaffordDavid Thurmaier, Vice PresidentJudith TickMichael Tilson Thomas, Director EmeritusH. Wiley Hitchcock, President 1973 - 1993Vivian Perlis, Vice President 1973 - 2019'''
year_published = 2025
