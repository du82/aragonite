["https://charlesives.org/all-way-around-and-back"]
title = "All the Way Around and Back | Charles Ives Society"
full_description = '''Ives and Living ComposersJoin us for the third installment of our series of discussion panels, All the Way Around and Back, in which we gather notable thinkers in the world of music to discuss the life and work of Charles Ives from their informed perspective. For this installment, we have a venerable collection of composers who discuss how they take the legacy of Ives and bring it into their lives. Moderated by Robert Carl, with panelists Martin Bresnick, Jason Eckardt, David Lang, Tania León, and Lei Liang. Improvisation and IvesThe second installment of the Society's popular series of panels about Charles Ives, All the Way Around and Back, has just been posted! Titled "Improvisation and Ives", this very entertaining conversation features an in-depth look at the fascinating and even surprising convergences between the music and influence of Charles Ives and the history and current practice of jazz, big band, blues, rock, film music, and pop. Moderated by Judith Tick, the panel includes Jack Cooper, Bill Frisell, Eric Hofbauer, Ethan Iverson, Phil Lesh and David Sanford. An Introduction to Charles IvesDistinguished author J. Peter Burkholder is joined by fellow Ives experts pianist Jeremy Denk, conductor Leonard Slatkin, soprano Susan Narucki, and pianist and Charles Ives Society President Donald Berman for a discussion on / introduction to Charles Ives, moderated by BMI Foundation President Deirdre Chadwick. J. Peter Burkholder recently released his new book, Listening to Charles Ives: Variations on His America, a listening guide and invitation into the music of Ives. The panelists discuss a range of topics both from the book and from their personal niches of expertise. To accompany the book, we've created a series of Spotify playlists with suggested recordings related to each chapter. Spotify page Purchase the book'''
year_published = 2025
clearnet = "https://charlesives.org/all-way-around-and-back"
