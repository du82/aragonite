ionships with Other Composers, Artists, and Writers Abott, Reverend Jacob Year: 1834-1858Complete Citation: Reverend Abbott, Jacob. Rollo at Play, Rollo at School; Rollo at Work', Rollo Learning to Read; Rollo Learning to Talk; Rollo's Correspondence; Rollo's Experiments', Rollo's Museums', Rollo's Philosophy, Rollo's Vacations', and Rollo's Travels. Another group was devoted to Rollo's tours of Europe: Rollo on the Atlantic, Rollo in Holland', Rollo in London', Rollo in Naples; Rollo in Paris', Rollo in Scot-land', Rollo in Switzerland', Rollo on the Rhine', and Rollo in Genoa.Source: Literary ReferencesReprints: "Rollo," the name Ives called musicians unwilling to listen to advanced dissonances and other techniques found in modern music, was derived from a character in books (1834--1858) by Reverend Jacob Abbott. Rollo could understand only the simplest of situations that had been taught or had been explained to him in great detail. Original publishers include Boston, MA: Weeks, Jordan, and Company; Philadelphia, PA: Hogan & Thompson; Boston, MA: Gould, Kendall & Lincoln. XIII. Ives in LiteratureB. Fiction Abraham, Gerald Year: 1979Complete Citation: Abraham, Gerald. The Concise Oxford History of Music, 824. London, United Kingdom: Oxford University Press, 1979.Source: BookVII. Entries in Larger VolumesA. Textbook Accounts Acker, Emma Year: 2009Complete Citation: Acker, Emma. “Artistic Identity in a Transatlantic Age Patrick Heron, Peter Lanyon, and the New American Painting.” The British Art Journal, vol. 10, no. 3 (2009): 158-170.Source: JournalVI. Topical StudiesE. Comparisons and Relationships with Other Composers, Artists, and Writers Acton, Charles Year: 1968Complete Citation: Acton, Charles. “The Charles Ives Enigma.” The Irish Times, 1968.Source: NewspaperVI. Topical StudiesS. Reception Studies and Related Scholarship Adams, John Year: 1976Complete Citation: Adams, John. Review of Charles Ives and His America, Frank R. Rossiter. The New England Quarterly (