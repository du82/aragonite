["https://charlesives.org/ives-man-his-life"]
title = "Ives The Man: His Life | Charles Ives Society"
full_description = '''(1874-1954)For all his singularity, the Yankee maverick Charles Ives is among the most representative of American artists. Optimistic, idealistic, fiercely democratic, he unified the voice of the American people with the forms and traditions of European classical music. The result, in his most far-reaching work, is like nothing ever imagined before him: music at once unique and as familiar as a tune whistled in childhood, music that can conjure up the pandemonium of a small-town Fourth of July or the quiet of a New England church, music of visionary spirituality built from the humblest materials--an old gospel hymn, a patriotic tune, a sentimental parlor song. The way in which Ives pursued his goal of a democratic art, and his career of creating at the highest level of ambition while making a fortune in the life insurance business, perhaps could only have happened in the United States. And perhaps only there could such an isolated, paradoxical figure make himself into a major artist. Image Charles Ives was born in the small manufacturing town of Danbury, Connecticut, on October 20, 1874, two years before Brahms finished his First Symphony. During the Civil War his father George Ives had been the Union's youngest bandmaster, his band called the best in the army. When the war ended George had returned to Danbury to take up the unusual trade, in that business-oriented town, of musician.As a cornet player, band director, theater orchestra leader, choir director, and teacher, George Ives became the most influential musician in the region. Yet while Danbury prided itself during the 1880s in being called "the most musical town in Connecticut" (that in large part due to George Ives's labors), people still viewed the profession with little understanding or respect. That situation, which would have been the same in most American towns in the 19th century, had its impact on Charles Ives. Still, his family was prominent, noted for extravagant personalities and (except for George) a gift for business.like father, like son Ives told the story of his introduction to music: his father came home one day to find the five-year old banging out the Ives Band's drum parts on the piano, using his fists. George Ives's response gave the first impetus to his son's career as a musical innovator. Rather than saying, as would most parents, That's not how to play the piano, George observed instead, "It's all right to do that, Charles, if you know what you're doing," and sent the boy down the street for drum lessons. Charlie never did stop using his fists on the piano, and was eventually notorious for requiring a board to play the Concord Sonata. Thus the invention of what a later age would call "tone clusters."After receiving his first instruction in piano and other instruments from his father, Charlie was turned over to more advanced keyboard teachers. For some years George hoped his son would find a career as a concert pianist. Instead, Charlie specialized in the organ, and by age fourteen he had become the youngest salaried church organist in Connecticut. Though he worked at music with remarkable discipline for his age, he also resented the demands of his training: "As a boy I was partially ashamed of it. When other boys were out driving grocery carts, or doing chores, or playing ball, I felt all wrong to stay in and play piano." Needing an antidote to the isolation and social anomaly of an intense education in music, Charlie threw himself into sports. One summer day at age fifteen, he played outfield for his baseball team in the afternoon and that night played a full organ recital. In short, Ives was something of a prodigy, and reached adulthood as one of the finest American organists of his generation.He began composing at around age thirteen, his first pieces little marches, fiddle tunes, songs for church, and the like--the kind of thing he heard and played around Danbury all the time. Early works include the precocious Variations on "America" for organ, written at seventeen; it would find considerable popularity after Ives died. The charming March No. 2 shows the teenager's grasp of traditional popular genres and his lifelong propensity for weaving familiar tunes into his work: it quotes "A Song of a Gambolier."The Circus Band, from the 1890s, rivals some of Sousa's as a classic march of the era, enlivened with Ives's characteristic rhythmic quirks. A great deal of Ives's later and more innovative music also echoes his childhood. The Gong on the Hook and Ladder is a rhythmic study built from an image of the gala Firemen's Parades of his youth; the ecstatic From the Steeples and the Mountains, for brass and bells, rings with memories of Danbury church bells.The story of Charles Ives's mature music has to do with the intersection of a great inborn gift for music, a thriving musical atmosphere in Danbury--largely in vernacular forms, but including classical music from local players and visiting ensembles--and a father who raised his son with the same inquiring, iconoclastic approach to music as his own. George Ives would have his boys sing in one key while he accompanied in another; he built instruments to play quarter-tones; he played his cornet over a pond so Charlie could gauge the effect of space; he set two bands marching around a park blaring different tunes, to see what it sounded like when they approached and passed.from the ordinary, the profound Just as importantly, George Ives taught his son to respect the power of vernacular music. As a Civil War band leader he understood how sentimental tunes such as "Tenting Tonight on the Old Camp Ground," "Aura Lee," Stephen Foster songs, and marches and bugle calls were woven into the experience of war and the memories of soldiers. Much as did Gustav Mahler a continent away, Charles Ives came to associate everyday music with profound emotions and spiritual aspirations. One of his father's most resonant pieces of wisdom came when he said of a stonemason's off-key hymn singing: "Look into his face and hear the music of the ages. Don't pay too much attention to the sounds--for if you do, you may miss the music. You won't get a wild, heroic ride to heaven on pretty little sounds."Charles Ives grew up determined to find that wild, heroic ride, that music of the ages--the spiritual power he felt in the singing at outdoor camp meetings and in bands marching during holidays. It would take many years of struggle and experiment, however, before he fully possessed the musical language to transform that spirit into orchestral and chamber music. Yet the road to his maturity would be marked by a number of remarkable works, including three symphonies and dozens of songs, chamber and piano pieces.Many of Ives's innovations developed directly from ideas of his father's, though George was no composer but rather something like a Yankee tinker in music. It remained for the son to make artistic use of the father's musical experiments. By his late teens, besides the practical music he was composing for use in church and for his father's ensembles, Charles Ives had written studies in polychords and polytonality (including the bitonal "London Bridge is Fallen Down!" studies) and band variations on the hymn "Jerusalem, the Golden" that had contingents of his father's band spread around the town square, sometimes playing theme and variations at the same time.to the ivy When Charles Ives left Danbury for New Haven in 1893 to prepare for Yale at the Hopkins Grammar School, he was already an expert composer of conventional short works, a few of which would be published in the next years. At the same time, with his own experiments taking his father's ideas to new levels of sophistication, some of the musical consciousness that would create the mature work was already in place. What he required now was greater control of the orchestra and of musical structure--things his father could not teach him. Fortunately, after extra tutoring had allowed Charlie to squeak through the Yale entrance exam, he ended up studying with the chairman of the college's new Music Department, who may well have been the finest composition teacher in the United States at the time.This professor was Horatio Parker, a German-trained American who had recently come to fame with his high-Victorian oratorio Hora Novissima. As a teacher Parker was distant, demanding, and conservative. He and his student got off to a shaky start when Ives showed Parker a Fugue in Four Keys, the keys being simultaneous. Ives was curtly asked not to bring in any more such manifestations. Dutifully but resentfully, Charlie settled into the classroom routine of counterpoint, harmony, history, orchestration, and form. He would never admit it, but in his four years with Parker he learned a great deal about the shaping forces of music. Meanwhile, as a freshman Ives became organist of Center Church in New Haven, the most prestigious keyboard position in town.Soon after he began at Yale came the greatest blow of Charles Ives's life: his father died suddenly of a stroke. Charlie never got over it; he spoke of his father constantly to the end of his life, and seemed to feel that he was writing George Ives's music. Despite lingering depression over his loss, Ives had a spectacularly successful career at Yale, in every way but academically. His average in musical courses was a respectable B, in everything else D+.Vivacious, funny, talented, indefatigable, "Dasher" Ives became one of the best-liked figures on campus. He spent his four years enjoying himself in various clubs, playing intramural sports, frequenting vaudeville theaters and sitting in for the pianists, playing ragtime and his own pieces at parties, and composing--light pieces for bands and glee clubs and church services, assigned works for his classes, and experiments. Smaller works from his college years include the scintillating March No. 6, with "Here's to Good Old Yale" and his sentimental tune for the Glee Club, quite a hit at the time, The Bells of Yale.His large-scale works of the Yale years reveal a developing control of form, instrumentation, and thematic development, all of it reflecting Parker's training. TheFirst Symphony is essentially a brilliant and precocious homework assignment, a massive work in European style with echoes of Brahms, Tchaikovsky, and Dvoák. As he worked on the symphony, Ives also produced the First String Quartet, which he later subtitled, half jokingly, "From the Salvation Army." It integrates gospel hymns, of the kind Ives grew up hearing in camp meetings, with the forms, textures, and thematic manipulation of European-Romantic music. Here Ives first suggests the direction of his maturity: a mediation between American and European elements, and between "high" and "low" art.a choice Ives also wrote a good deal of choral and organ music in connection with his organist job at Center Church. Most of these works, which Ives recalled as routine, were lost, but a few also showed his experimental side. More informally in his undergraduate years, in theaters and at parties Ives tried out rough superimpositions of tunes in different meters and keys. These included "stunts" such as Yale-Princeton Football Game that uproariously portray familiar events--something Ives would eventually do more seriously in works including Decoration Day. If he had continued on the career path of an organist/choirmaster/ composer/teacher like Horatio Parker, Ives would have gone from Yale to complete his studies in a European, probably German, conservatory. Instead, he took a path that led him into one of the most difficult and unconventional lifestyles of any major composer: acting on some of his father's last words of advice, Ives decided to forego a musical career and go into business. When he left Yale in 1898, he headed for New York to begin as a $15-a-week clerk with the Mutual Life Insurance Company.The point of this career choice, for a young man clearly talented and ambitious as an organist as well as composer, was to leave himself room to create as he wanted, without the impediment of a relentlessly conservative musical establishment. As Ives put it, if a composer "has a nice wife and some nice children, how can he let them starve on his dissonances?"During his first four years in the New York City of the "Gay Nineties," Ives held organist/choirmaster posts in two prominent churches, played recitals, and composed the church cantata The Celestial Country, tuneful and respectably Victorian (though the cantata also includes organ interludes with exploratory harmonies). Though most of the more conventional works of this period are lost, from his church music Ives continued to develop new pieces, notably the four Violin Sonatas that together make up the most important American contribution to that genre. All the Sonatas are suffused with memories of Danbury church services and square-dance fiddle playing. Another surviving choral work from that time, Processional: Let There Be Light, in which the divine radiance is expressed by pealing dissonances, shows that even in a church setting Ives could not entirely suppress his adventurous side.Ives's more radical new works from the first decade of the century, none of them performed or performable at that time, reveal for all their fascination no overall direction. Ives's dilemma was how to unify the separate streams of his music: the traditional European genres of symphony, string quartet, sonata, and the like, which his expressive ambitions drove him to take up; but also his love of American vernacular music, his passion for experiment, his interest in realistic and chance musical effects. His struggle toward maturity is shown in works written around the turn of the century such as the Second Symphony, which begins with a fugue of Brahmsian cast and includes snippets of Tchaikovsky, but also includes a great deal of American vernacular music, climaxing with the Stephen-Fosterish tunes of the last movement. A beautiful and compelling work, the Second was prophetic of the "Americana" style of Copland and others thirty years later.beyond the new Weary of the creative constraints of being a church organist and choirmaster, in 1902 Ives "quit music," as he put it; he resigned his organ job, the last formal connection with the musical profession he ever had. From that point his experimental side deepened, in the next years producing the transitional Third Symphony (subtitled "The Camp Meeting"), the wild, almost cubistic Four Ragtime Dances for theater orchestra, and two small but far-reaching works of 1906: Central Park in the Dark and The Unanswered Question, both of which use loose but carefully notated superimpositions of stylistically distinct material in different meters and keys. African-American vernacular music also contributed to Ives's mature work: the Ragtime Dances demonstrate a fresh rhythmic style derived from the dancing syncopations of ragtime.The ulti'''
