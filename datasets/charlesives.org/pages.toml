["https://charlesives.org/discography"]
title = "Discography Portal | Charles Ives Society"
description = "Search pieces, artists, dates, locations, record label, release number/format/year, text by, and additional notes"
full_description = '''AboutThe first comprehensive Charles Ives discography, compiled by Richard Warren, was published in 1972. In the decades following, Warren, along with staff of the Yale Collection of Historical Sound Recordings, continued documenting newly released recordings of Ives’ music. With support from the Charles Ives Society, Kevin Sherwin completed compiling the discography to include recordings until 2019, and Nicholas Brewer edited and facilitated its online publication and search functions.This online discography is a comprehensive and searchable list, presented in order of the table of contents listed below. For each composition, recordings are listed in chronological order. The table of contents is based on the structure of James Sinclair’s A Descriptive Catalogue of the Music of Charles Ives, which reflects the current catalogue of recordings of Charles Ives’ music. For more detailed explanations of the discography’s compilation and use of this website, please see the above links to the Preface and Usage Guide. Table of Contents I. Orchestra Music i. Symphonies ii. Other music for symphony orchestra iii. Music for chamber or theatre orchestra iv. Music for band II. Chamber Music i. String quartets ii. Music for various combinations iii. Sonatas for violin and piano III. Keyboard Music i. Piano sonatas ii. Other music for piano iii. Piano duets iv. Organ music IV. Choral Music i. Cantata ii. Other music for chorus and orchestra iii. Sacred choral music iv. Secular partsongs V. Songs i. A-E ii. F-L iii. M-R iv. S-V v. W-Y Featured Recordings - World Premieres, First Recordings, and First Broadcasts A SET OF THREE SHORT PIECES; i.LARGO CANTABILE; ii. SCHERZO; iii. ADAGIO CANTABILE A SET OF THREE SHORT PIECES; i.LARGO CANTABILE; ii. SCHERZO; iii. ADAGIO CANTABILE (II-B-16) (84) Recorded from broadcast of WABC, New York i. See also HYMN; (i. only) Notes on the Recording: Announced as the first broadcast of any Ives composition (March 14, 1938), Ives’ Largo for Strings is performed by the Columbia Chamber Orchestra, conducted by early Ives champion Bernard Herrmann. The orchestra plays the lyrical lines of the composition with noticeable intensity, especially at moments of harmonic dissonance. As well, the ensemble occasionally speeds up and slows down the tempo to heighten the expressive effects of the music. External Links: Streaming access to sound recordings in this collection is available when connected to the Yale University network, or otherwise by request. To request access to this recording, email musicspecialcollections@yale.edu. Link 1 Recording Date/Location: March 14, 1938 (broadcast date) , New York City, NY Performing Artists: Columbia Chamber Orchestra; Bernard Herrmann, conductor Record Label, Release Number, Format, Release Year: Yale Charles Ives Non-Commercial Sound Recordings 39002038371200, 78 RPM Test Pressing. Close A SYMPHONY: "NEW ENGLAND HOLIDAYS": i. WASHINGTON'S BIRTHDAY; ii. DECORATION DAY;… A SYMPHONY: "NEW ENGLAND HOLIDAYS": i. WASHINGTON'S BIRTHDAY; ii. DECORATION DAY; iii. THE FOURTH OF JULY; iv. THANKSGIVING (Text: O God! beneath Thy guiding hand . . .) (I-A-4) (5 (5i., 5ii., 5iii, 5iv.)) Text by Leonard Bacon Recorded during a performance of the work in Washington, CT; (i., only) Notes on the Recording: This early Ives recording includes an excerpt from Washington’s Birthday, which begins at the Allegro at measure 56. Jo Hawthorne conducts the Cape Cod Symphony Society in an interpretation that highlights the folk-like atmosphere of the music. The orchestra plays with a graceful sense of rhythmic drive, frequently bringing out the quoted traditional melodies over the surrounding dissonant textures. External Links: Streaming access to sound recordings in this collection is available when connected to the Yale University network, or otherwise by request. To request access to this recording, email musicspecialcollections@yale.edu. Link 1 Recording Date/Location: August 22, 1941 Performing Artists: Cape Cod Symphony Society; Jo Hawthorne, conductor Record Label, Release Number, Format, Release Year: Yale Charles Ives Non-Commercial Sound Recordings 39002038370806, 1/4 inch sound tape reel. Close BERCEUSE (O'er the mountain toward the West . . .) BERCEUSE (O'er the mountain toward the West . . .) (VI-B-41-d) (220) Text by the composer Recorded from WNYC broadcast Notes on the Recording: The Works Progress Administration sponsored numerous radio broadcasts featuring American music, describing Charles Ives as “among the most original and extraordinary composers of America.” This program includes a live recital featuring Gretchen Gantvoort, soprano and Thomas Weil, piano, performing Ives’ “Berceuse.” In this early Ives recording, the listener can hear slight pauses in Gantvoort’s singing, which create moments of suspense and emphasis within her delivery of the text. As well, she sings with a notably wide dynamic range, as well as a quick, narrow vibrato throughout the piece. External Links: Streaming access to sound recordings in this collection is available when connected to the Yale University network, or otherwise by request. To request access to this recording, email musicspecialcollections@yale.edu. Link 1 Recording Date/Location: September 28, 1939, WPA Community Building, The World's Fair, NYC. Performing Artists: Gretchen Gantvoort, soprano; Thomas Weil, piano Record Label, Release Number, Format, Release Year: Yale Charles Ives Non-Commercial Sound Recordings 39002038371572, 78 RPM Test Pressing. Close QUARTET, STRINGS, NO. 1: FROM THE SALVATION ARMY; i. CHORALE (later this movement was included in… QUARTET, STRINGS, NO. 1: FROM THE SALVATION ARMY; i. CHORALE (later this movement was included in SYMPHONY NO. 4 and the other movements were renumbered); ii. PRELUDE; iii. OFFERTORY; iv. POSTLUDE (II-A-1) (57) Recorded from WABC broadcast; (I & ii, arranged for string orchestra by Bernard Herrmann). Recorded from WABC broadcast. (ii & iii, arranged for string orchestra by Bernard Herrmann) Notes on the Recording: The String Quartet No. 1 is included in this radio broadcast from the 1940s, performed by members of the Columbia Concert Orchestra, conducted by early Ives champion, Bernard Herrmann. This performance of the quartet was also arranged for string orchestra by Herrmann. The recording displays spirited, rhythmical, and expressive playing throughout the movements. To match the musical contrasts over the course of the piece, the orchestra alternates between lyrical and articulate phrasing styles. External Links: Streaming access to sound recordings in this collection is available when connected to the Yale University network, or otherwise by request. To request access to this recording, email musicspecialcollections@yale.edu. Link 1 Link 2 Recording Date/Location: March 16, 1943, New York City, NY. Performing Artists: Columbia Concert Orchestra; Bernard Herrmann, conductor Record Label, Release Number, Format, Release Year: Yale Charles Ives Non-Commercial Sound Recordings 39002038370814, 1/4 inch sound tape reel. Yale Charles Ives Non-Commercial Sound Recordings 39002038370822, 1/4 inch sound tape reel. Close SET FOR THEATRE ORCHESTRA; i. IN THE CAGE; ii. IN THE INN; iii. IN THE NIGHT SET FOR THEATRE ORCHESTRA; i. IN THE CAGE; ii. IN THE INN; iii. IN THE NIGHT (I-C-28) (20) Recorded from broadcast of WABC, New York. (i. & iii. only) i. see also THE CAGE; ii. see also SONATA, PIANO, NO. 1: ii/b Notes on the Recording: “In the Cage” and “In the Night” are included in this radio broadcast from the 1940s, performed by the Eastman Symphony, with Frederick Fennell conducting. To introduce Ives, the broadcaster says, “one is often startled to observe that the spirit of modernity is not necessarily the exclusive property of the young. The desire to break from tradition is a personal rather than a temporal characteristic… It is only at the present time that his [Ives’] compositions are meeting with general understanding.” In this early recording of Ives’ music, the orchestra plays with dark timbres along with a winding sense of pulse. Notably, the orchestra does not emphasize the complexity of the rhythms and metric changes. Rather, they create a continuous sound and blended rhythmic texture to evoke a haunting musical atmosphere. External Links: Streaming access to sound recordings in this collection is available when connected to the Yale University network, or otherwise by request. To request access to this recording, email musicspecialcollections@yale.edu. Link 1 Recording Date/Location: November 11, 1941, New York City, NY Performing Artists: Eastman School of Music Orchestra; Frederick Fennell, conductor Record Label, Release Number, Format, Release Year: Yale Charles Ives Non-Commercial Sound Recordings 39002038370814, 1/4 inch sound tape reel. Close SONATA, VIOLIN & PIANO, NO. 3 SONATA, VIOLIN & PIANO, NO. 3 (II-C-6) (62) Recorded from broadcast of WOR, New York (these artists performed the work in recitals in New York City November 11, 1946 & April 29, 1948). Notes on the Recording: The three movements of Ives’ Third Sonata for Violin & Piano are included on this ca. 1948 radio program of the Mutual Broadcasting System. Violinist Madeleine Carabo and pianist Carol Robinson offer a virtuosic interpretation, with detailed attention to Ives’ expressive indications in the score. Their playing ranges from lyrical to forceful, shifting with the numerous moods of the sonata. External Links: Streaming access to sound recordings in this collection is available when connected to the Yale University network, or otherwise by request. To request access to this recording, email musicspecialcollections@yale.edu. Link 1 Recording Date/Location: ca. 1948, New York City, NY. Performing Artists: Madeleine Carabo, violin; Carol Robinson, piano Record Label, Release Number, Format, Release Year: Yale Charles Ives Non-Commercial Sound Recordings 39002038370871, 1/4 inch sound tape reel. Close THE SIDE SHOW (Is that Mr. Reilly . . .) THE SIDE SHOW (Is that Mr. Reilly . . .) (VI-B-66) (348) Text by the composer, quoting Pat Rooney Recorded from broadcast of WNYC of recital. Notes on the Recording: The Works Progress Administration sponsored numerous radio broadcasts featuring American music, describing Charles Ives as “among the most original and extraordinary composers of America.” This program includes a live recital featuring Gretchen Gantvoort, soprano and Thomas Weil, piano, performing Ives’ “The Side Show.” In this early Ives recording, Gantvoort sings with frequently short, speech-like articulations and a very free sense of pulse. The pianist, Thomas Weil, matches Gantvoort, which articulate and rhythmical playing. Together, these expressive aspects create a feeling of spontaneity and story-telling, complementing the nature of the song’s text. External Links: Streaming access to sound recordings in this collection is available when connected to the Yale University network, or otherwise by request. To request access to this recording, email musicspecialcollections@yale.edu. Link 1 Recording Date/Location: September 28, 1939, WPA Community Building Theatre, The World's Fair, New York City, NY Performing Artists: Gretchen Gantvoort, soprano; Thomas Weil, piano Record Label, Release Number, Format, Release Year: Yale Charles Ives Non-Commercial Sound Recordings 39002038371572, 78 RPM Test Pressing. Close THE WORLD'S HIGHWAY (For long I wander'd happily . . .) THE WORLD'S HIGHWAY (For long I wander'd happily . . .) (VI-B-42-c) (397) Text by Harmony Twichell Ives Broadcast of WNYC Notes on the Recording: The Works Progress Administration sponsored numerous radio broadcasts featuring American music, describing Charles Ives as “among the most original and extraordinary composers of America.” This program includes a live recital featuring Gretchen Gantvoort, soprano and Thomas Weil, piano, performing Ives’ “The World’s Highway.” In this early Ives recording, Gantvoort sings with nuanced vocal phrasings that include a flexibility of pulse to complement the musical gestures of the composition. Strikingly, both Gantvoort and pianist Thomas Weil coordinate various immediate fluctuations in dynamics, which highlight the corresponding moments of the text. External Links: Streaming access to sound recordings in this collection is available when connected to the Yale University network, or otherwise by request. To request access to this recording, email musicspecialcollections@yale.edu. Link 1 Recording Date/Location: September 28, 1939, WPA Community Building Theatre, The World's Fair, New York City, NY. Performing Artists: Gretchen Gantvoort, soprano; Thomas Weil, piano Record Label, Release Number, Format, Release Year: Yale Charles Ives Non-Commercial Sound Recordings 39002038371572, 78 RPM Test Pressing. Close All Recordings Search Text Search pieces, artists, dates, locations, record label, release number/format/year, text by, and additional notes Filter by Genre - Any -I. Orchestra Music-i. Symphonies-ii. Other music for symphony orchestra-iii. Music for chamber or theatre orchestra-iv. Music for bandII. Chamber Music-i. String quartets-ii. Music for various combinations-iii. Sonatas for violin and pianoIII. Keyboard Music-i. Piano sonatas-ii. Other music for piano-iii. Piano duets-iv. Organ musicIV. Choral Music-i. Cantata-ii. Other music for chorus and orchestra-iii. Sacred choral music-iv. Secular partsongsV. Songs-i. A-E-ii. F-L-iii. M-R-iv. S-V-v. W-YX. Music for the Stage-i. Music for fraternity shows-ii. Music for the theatreX. Exercises, Other Music, Etc.-i. Music and writings of George E. Ives-ii. Exercises, etc.-iii. Polytonal and burlesque exercises, etc.-iv. Arrangements from other composers-v. What? (unidentified fragments) Record Label, Release Number, Format, Release Year Yale Charles Ives Non-Commercial Sound Recordings 39002038373214, 1/4 inch sound tape reel. I. Orchestra Music i. Symphonies A NEW ENGLAND SYMPHONY see ORCHESTRAL SET NO. 1 A SYMPHONY: "NEW ENGLAND HOLIDAYS": i. WASHINGTON'S BIRTHDAY; ii. DECORATION DAY; iii. THE FOURTH OF JULY; iv. THANKSGIVING (Text: O God! beneath Thy guiding hand . . .) (I-A-4) (5 (5i., 5ii., 5iii, 5iv.)) Text by Leonard Bacon Recording Date/Location Performing Artists Record Label, Release Number, Format, Release Year Album Names Additional Recording Notes May 15 or 16, 1934, Capitol Sound Studios, NYC The Pan American Chamber Orchestra; Nicoias Slonimsky, conductor New Music Quarterly Recordings Vol. I No. 5 (Matrix: CSS429; record later renumbered: 1013), 78rpm (1934). Orion ORD7 150, 33.3 RPM (1971). New Music Quarterly Recordings, Vol. 1/5 (1934) (i. selection: "Barn Dance," only) May 15 or 16, 1934, Capitol Sound Studios, NYC The Pan American Chamber Orchestra; Nicoias Slonimsky, conductor New Music Quarterly Recordings Vol. I No. 5 (Matrix: CSS429; record later renumbered: 1013), 78rpm (1934). Orion ORD7 150, 33.3 RPM (1971). New Music Quarterly R'''
