["https://charlespetzold.com/blog/2025/02/Password-Math.html"]
title = "Charles Petzold: Password Math"
description = "A friend from my PC Magazine days recently posted on Facebook a little mathematics anomaly that he encountered while trying to figure out the number of possible passwords under certain conditions. He began with the stipulation that a four-character password had to be constructed from characters from each of four groups: 26 uppercase letters (which I’ll abbreviate as U), 26 lowercase letters (L), 10 numeric digits (N), and 18 special characters (S), for a total of 80."
full_description = "Password Math February 8, 2025New York, N.Y. A friend from my PC Magazine days recently posted on Facebook a little mathematics anomaly that he encountered while trying to figure out the number of possible passwords under certain conditions. He began with the stipulation that a four-character password had to be constructed from characters from each of four groups: 26 uppercase letters (which I’ll abbreviate as U), 26 lowercase letters (L), 10 numeric digits (N), and 18 special characters (S), for a total of 80. He began thinking about choosing a character from these 80, which happened to be uppercase. That left 54 characters to choose from. He picked another, which happened to be lowercase. That left 28. He chose another, which happened to be a numeric digit, leaving the remaining 18. Hence he calculated the number of possibilities as: number of passwords in the order ULNS ?=80×54 ×28×18 =2,177,280 But then he wondered: What if the first character he chose from the 80 possibles was a special character, leaving 62 possibles, and the next was a numeric digit, leaving 52 possibles, and the next was a lowercase letter, leaving 26 possibles, and then an uppercase letter. By the same logic, the combinations would be: number of passwords in the order SNLU ?=80×62 ×52×26 =6,705,920 Clearly something is wrong. But that’s one of the wonderful characteristics of math: If you don’t get the same answer regardless how you do it, you know you’ve messed up somewhere. Here’s the fallacy: If the first character picked is an uppercase letter, then that either happens randomly or deliberately. Two cases: (1) If it happens randomly, then the calculation has to include a probability of that happening, which is 2680. And if the second character picked from the remaining 54 happens to be a lowercase letter, then the probability of that happening is 2654. The probability of the third character being a numeric digit is similarly 1018. The actual number of combinations of ULNS passwords is therefore: number of passwords in the order ULNS= 80×2680× 54×2654× 28×1028× 18 Notice that numbers start canceling out like crazy, and you’re left with: number of passwords in the order ULNS= 26× 26× 10× 18=121,680 (2) If you’re deliberately choosing the first character from uppercase letters, then it’s not 80 possibilities but 26 possibilies. The total possibilities are the same whether you choose the characters in the order ULNS or SNLU or anything else. It’s also the total when the order of the characters in the password doesn’t matter: number of passwords when order doesn't matter= 26× 26× 10× 18=121,680 Of course, order does matter with passwords, so this must be multiplied by the number of different orderings of U, L, N, and S. which is 4 possibilities for the first character, times 3 for the second, times 2 for the third, and 1 for the last, or 4×3×2×1=24, which is conveniently abbreviated as 4! and called 4 factorial: number of passwords when order matters= 26× 26× 10× 18× 4!=2,920,320 That is the total number of four-character passwords where all four character groups are included and order matters. If you increase the length of the password beyond four characters but still require that it contain characters from the four character groups, the number of possible passwords increases (of course) but the math gets more complicated. Let’s begin with five characters but with the additional requirement that all five characters must be unique. The total is: number of five-character passwords= 26× 26× 10× 18× 76× 5!=1,109,721,600 You’ve already chosen four of the possible 80 characters so if all the characters must be unique, the fifth character is from a pool of 76, and then the product is multiplied by 5! (or 120) to account for all the different orderings. Similarly, for six-character passwords with all unique characters: number of six-character passwords= 26× 26× 10× 18× 76× 75× 6!=499,374,720,000 In general, for N-character passwords where all the characters are unique, the number of possibilities is: number of N-character passwords= 26× 26× 10× 18× 76!(80–N)!×N! When duplicate characters are allowed (as is usually the case with passwords), the math starts getting messy. There are more characters to choose from for additional characters, but you’re also generating duplicate passwords that you don’t want to count in the total. Maybe some other time."
author = "Charles Petzold"
year_published = 2025
