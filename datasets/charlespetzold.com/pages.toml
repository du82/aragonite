full_description = "CodeThe Hidden Language of Computer Hardware and Software2nd Edition ISBN: 978-0-13-790910-0Microsoft Press, 2022, 480 pages The classic guide to how computers work, updated with new chapters and interactive graphics Computers are everywhere — most obviously in our laptops and smartphones, but also our cars, televisions, microwave ovens, alarm clocks, robot vacuum cleaners, and other smart appliances. Have you ever wondered what goes on inside these devices to make our lives easier but occasionally more infuriating? For more than 20 years, readers have delighted in Charles Petzold's illuminating story of the secret inner life of computers, and now he has revised it for this new age of computing. Cleverly illustrated and easy to understand, this is the book that cracks the mystery. You'll discover what flashlights, black cats, seesaws, and the ride of Paul Revere can teach you about computing — and how human ingenuity and our compulsion to communicate have shaped every electronic device we use. This new expanded edition explores more deeply the bit-by-bit, gate-by-gate construction of the heart of every smart device: the central processing unit that combines the simplest of basic operations to perform the most complex of feats. Along with new chapters, Petzold created a new website, CodeHiddenLanguage.com, that uses animated interactive graphics to make computers even easier to comprehend. From the simple ticking of clocks to the worldwide hum of the internet, Code reveals the essence of the digital revolution. The book has been reviewed online by Patricia E. Moody on Blue Heron Journal and on Instagram by @booksthatstay. Buy at: Microsoft Press Inform IT Bookshop.org Barnes & Noble Amazon US Amazon Canada Amazon UK Amazon Deutsch Amazon Français Amazon Japan Blackwell's IndieBound An errata list is available on the Microsoft Press site. The Annotated TuringA Guided Tour through Alan Turing's Historic Paper on Computability and the Turing Machine ISBN: 978-0-470-22905-7Wiley, June 2008, 384 pages The Turing Machine is an imaginary — not even quite hypothetical — computer invented in 1936 by English mathematician Alan Turing (1912–1954) to help solve a question in mathematical logic. As a byproduct, Turing also founded the field of computability theory: the study of the abilities and limitations of digital computers. This book presents Turing’s original 36-page paper (and a follow-up 3-page correction) with background chapters and extensive annotations, explaining many of Turing’s statements, clarifying his discussions, and providing numerous examples. Interwoven into the narrative are the highlights of Turing’s own fascinating life. Mathematician and author Martin Davis has written “Petzold will be a stalwart companion to any reader who undertakes to read Turing's classic with his aid. The Annotated Turing will also be quite enjoyable to a more casual reader who chooses to dip into various parts of the text.” Buy at: Wiley Barnes & Noble Amazon US Amazon Canada Amazon UK Amazon Deutsch Amazon Français Amazon Japan Blackwell's"
