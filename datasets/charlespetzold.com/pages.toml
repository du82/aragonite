full_description = '''The Complete Beethoven (2020) As discussed in the blog entry Celebrating Beethoven 250 All Year Long and the postmortem 366 Deadlines: My Year with Beethoven, during the year 2020 I used the Twitter feed @beethoven250 to post daily YouTube videos and discussions of all of Beethoven's music. That Twitter feed was then transferred in its entirety to the website The Complete Beethoven. William Cowper and the Age of the Earth (June 2019) In 1785, English poet William Cowper sounded a poetical alarm about people digging into the earth and concluding that it was older than the 6,000 years indicated in scripture. If 1785 seems a little early in the history of geology for such concern, then the question arises: How did Cowper know? Turns out — he read a lot of magazines. Adventures in Electronic Music: Beeps, Bloops, and Klangs: 1974–1982 (September 2011) This rambling narrative describes how I spent the late 1970s and early 1980s building electronic music instruments, including a computer-controlled digital synthesizer capable of generating 40 simultaneous voices. Included are photographs, other documents, and over 4 hours of virtually unlistenable "music." Sesquicentenniality: 1859 When work was sparse in 2009, I wrote a series of blog entries on the 150th anniversary of some notable events, mostly book publications. While 1859 is most famous for the November publication of Charles Darwin's Origin of Species, perhaps the times were changing in other ways as well. 1859 Books: “Rubáiyát of Omar Khayyám” (1/15/2009) 1859 Books: George Eliot’s “Adam Bede” (2/1/2009) 1859 Books: John Stuart Mill’s “On Liberty” (2/26/2009) 1859 Books: Anthony Trollope’s “The Bertrams” (3/29/2009) 1859 Art: Frederic Church’s “The Heart of the Andes” (4/27/2009) 1859 Journalism: Harriet Martineau’s “Female Industry” (5/30/2009) 1859 Science: John Tyndall and the Greenhouse Effect (6/10/2009) 1859 Books: George Meredith’s “The Ordeal of Richard Feverel” (6/20/09) 1859 Books: Tennyson’s “Idylls of the King” (7/17/09) 1859 Music: Richard Wagner’s “Tristan und Isolde” (8/30/2009) 1859 Books: Harriet Wilson’s “Our Nig” (9/5/2009) 1859 Speeches: Prince Albert’s Address to the BAAS (9/14/09) 1859 Books: Samuel Smiles’ “Self-Help” (9/29/09) 1859 Crusades: John Brown’s Raid on Harpers Ferry (10/16/09) 1859 Books: Charles Dickens’ “A Tale of Two Cities” (11/21/09) 1859 Books: Charles Darwin’s “On the Origin of Species” (11/24/09) 1859 Books: Harriet Beecher Stowe’s “The Minister’s Wooing” (12/31/09)'''
