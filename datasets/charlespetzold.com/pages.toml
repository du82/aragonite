full_description = "Does the Moon Make Flower-Like Loops Around the Sun? February 25, 2025New York, N.Y. I recently saw an animation on Facebook that purported to show the “hidden beauty of the Moon’s orbit as it creates a flower-like pattern while revolving around Earth and Sun,” further referring to this motion as “celestial choreography” and an “intricate dance” (Brain Maze post from February 20, 2025). ... read more ... Password Math February 8, 2025New York, N.Y. A friend from my PC Magazine days recently posted on Facebook a little mathematics anomaly that he encountered while trying to figure out the number of possible passwords under certain conditions. He began with the stipulation that a four-character password had to be constructed from characters from each of four groups: 26 uppercase letters (which I’ll abbreviate as U), 26 lowercase letters (L), 10 numeric digits (N), and 18 special characters (S), for a total of 80. ... read more ... Reading Jack Smith’s “Final Report” Inauguration Day, 2025New York, NY This is a good-news-bad-news kind of day. ... read more ... A Conversation on the DEX Show January 18, 2025New York, N.Y. I recently had a delightful remote chat with Tom McGrath of the DEX Show podcast (a presentation of the nexthink software company) about the 2nd edition of my book Code: The Hidden Language of Computer Hardware and Software and some other issues. Here it is: ... read more ... Very Wrong Math January 10, 2025New York, N.Y. The difference between misinformation and disinformation is the difference between ignorance and malice. Trolling is somewhat different, incorporating an element of provocation and narcissism. But what the hell is this? ... read more ... 2025 Project: “The Lost Art of Logarithms” January 1, 2025Roscoe, N.Y. I don’t make New Year’s resolutions, but I do have New Year’s projects, and for 2025 I hope to spend as much time as possible working on my book The Lost Art of Logarithms. ... read more ... The Best Decade in Music December 14, 2024New York, N.Y. Like many people who turned 11 years old in 1964, the first record album I bought “on my own” — in other words by pleading “Mom, can you get this album for me?” — was Meet the Beatles!, their first release in the United States. But so what? I have about as much inclination to listen to that album now as to watch episodes of My Favorite Martian, which was my favorite television series at the time. ... read more ..."
