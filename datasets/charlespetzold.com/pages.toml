full_description = "2025 Project: “The Lost Art of Logarithms” January 1, 2025Roscoe, N.Y. I don’t make New Year’s resolutions, but I do have New Year’s projects, and for 2025 I hope to spend as much time as possible working on my book The Lost Art of Logarithms. I had originally intended for this to be a conventional printed book, but then I started thinking about the companion website that would include interactive slide rules and such, and I had the brilliant idea that it would make more sense for the whole book to be a website, so here it is so far: The Lost Art of Logarithms The first two chapters are readable; the third chapter is still ragged around the edges. A couple other chapters contain a few paragraphs, orphaned phrases, clutter, experimental code, and two blog entries (one published, one abandoned) that I’ll be folding into the text. Many other chapters exist only in my mind. I hope I’m not being too optimistic to anticipate finishing the book by year end 2026."
