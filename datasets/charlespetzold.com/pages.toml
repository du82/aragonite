title = "Charles Petzold"
description = "Charles Petzold is the author of the books Code and The Annotated Turing"
full_description = '''I am the author of more than a dozen books, most notably two unique explorations of digital computing: I grew up in New Jersey and attended Stevens Institute of Technology. After graduating in 1975 with a BS and MS in mathematics, I moved to New York City and worked 10 years for a major insurance company. Although not an actuary, I did actuarial work and PL/I programming for individual health insurance product development. In 1977 I began exploring how I could build electronic music instruments. This led to a self-taught education in digital electronics, and (within a couple years) to designing and building a digital electronic music synthesizer controlled by a homebrew computer based around the Zilog Z80 microprocessor. This project is documented in "Adventures in Electronic Music: Beeps, Bloops, and Klangs: 1974–1982". I later used much of the knowledge and experience I gained from this project to write my book Code. I acquired my first IBM PC in early 1984 and began writing for PC Magazine that same year. This led to a full-time freelance career that included writing for Microsoft Systems Journal and MSDN magazines. My book Programming Windows was published in six editions between 1988 and 2012, and I also wrote books on OS/2, Windows Forms, the Windows Presentation Foundation, the C# programming language, and Windows Phone. In 2014 I began working as a full-time employee for Xamarin (which was acquired in 2016 by Microsoft), where I wrote a book and documentation about Xamarin.Forms. In 2018 I retired from my 34-year-career of writing, speaking, and thinking about programming and APIs. Most of my old books are accessible from the Books page of this website. If you're looking for links to some of my old MSDN articles or other stuff, you might find them on my old website. Throughout the year 2020 I celebrated the 250th anniversary of the birth of Beethoven with daily tweets of YouTube videos of all of Beethoven's music in chronological order. These tweets have been collected and organized in the website The Complete Beethoven.'''
