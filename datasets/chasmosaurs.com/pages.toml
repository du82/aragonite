full_description = "Podcast Show Notes: Episode 37 – Farewell TetZooCon Conference Podcast Show Notes October 30, 2024 As every year, Marc, Natee and Gemma visited TetZooCon, Darren Naish’ big annual London event about animals, palaeontology, palaeoart and all things tetrapod. And this was a special edition indeed. Not only has this been the last ever edition of the Tetrapod Zoology Conference in its current form (more on which on the show) but we actually gave a talk this time! And what’s more, the talk has been recorded and is included in full on this very special, extra… Continue Reading 3 Comments By Gemma Hazeborg Podcast Show Notes: Episode 25 – Prehistoric Planet Special II Podcast Show Notes June 30, 2023 We’re back! After a few months’ break, the podcast resumes with a Prehistoric Planet 2 special and welcomes the return of palaeoartist, Gabriel Ugueto, who can finally tell us more about his role as concept artist on the series. We can wax lyrical forever about the show, and nary a soul can stop us. In the News The coming of ‘Philosoraptor’ was foretold. ‘Skull of a dromaeosaurid dinosaur Shri devi from the Upper Cretaceous of the Gobi Desert suggests convergence… Continue Reading 0 Comments By Natee Prehistoric Planet 2: Giant Paperclip TV review May 26, 2023 Whereas the first two episodes of Prehistoric Planet 2 took us to the Islands and Badlands, the final three transport the viewer to Swamps, Oceans and, er, North America. Why the sudden change of theme, to a continental locale rather than a type of habitat, in the final episode? It hardly matters, I suppose, if it means we get to see more of Prehistoric Planet‘s utterly fantastic T. rex. What’s more, in this series, I finally got what I really wanted… …That is, a… Continue Reading 0 Comments By Marc Vincent Prehistoric Planet 2: Snack Babies TV review May 23, 2023 It’s back! Already! This year, I don’t quite have the time to squeeze out a blog post after the release of every episode, but I’m still determined to mark the occasion in suitable fashion. So, I’ll post once today, having seen the first two episodes, and again on Friday. Can you believe that another season is already upon us? I guess that’s what Apple’s endless pit of money will buy you. That, and Darren Naish’s increasingly snazzy shirts. I’ll admit… Continue Reading 0 Comments By Marc Vincent"
