full_description = "Vintage Dinosaur Art: The Magic School Bus in the Time of the Dinosaurs Vintage Dinosaur Art October 22, 2024 The Magic School Bus franchise was a big deal at exactly the right sort of time for it to have impacted my childhood, but it completely passed me by – probably because I’m British, and it wasn’t quite as well known here. I do have vague memories of a fantastical yellow bus (which was a bit of an alien concept – the yellow school bus, that is) that could fly through space and whatnot, but that’s about it. A shame,… Continue Reading 1 Comment By Marc Vincent Vintage Dinosaur Art: Záhada Dinosaurů – Part 3 Vintage Dinosaur Art June 22, 2024 Oops, I guess it’s been a while. I promised you part three of that big Czech book from 1993, and here it is. If you need a refresher, and I imagine you do, here’s part one and part two again. So far, we’ve seen sauropods with trunks, theropods with fish heads, more sauropods with trunks, attempts at feathering and lots of mood and atmosphere. Also sauropods with trunks. Let’s see what other strange wonders Barbora Kyšková has in store for… Continue Reading 0 Comments By Gemma Hazeborg Vintage Dinosaur Art: Extinct Monsters and Creatures of Other Days – Part 2 Vintage Dinosaur Art August 29, 2023 A while ago we had a look at Extinct Monsters, a book from 1892 by H. N. Hutchinson and illustrated by Joseph Smit. Now, we’re going all the way to 1910 for the the new, revised, expanded edition of Extinct Monsters by the same author, that reflects almost two decades of scientific discovery. This new version of the book is the one that has the awesome extended title “…and Creatures of Other Days“. The ageing Joseph Smit, Dutchman in England,… Continue Reading 6 Comments By Gemma Hazeborg Vintage Dinosaur Art: Fortidsdyr i farver Vintage Dinosaur Art April 16, 2023 Hej allesammen! It’s hard to find proper illustrated mass-appeal dinosaur books from before the 1970s, when Zdeněk Burian brought Life Before Man into every European home. It’s always cause for minor celebration whenever something older than that shows up that isn’t Knight or Zallinger. So imagine my delight when I rediscovered this book in my very own archives when I moved house last year. Oh yes, I remember this one. This very, very old one. How old? It dates from… Continue Reading 7 Comments By Gemma Hazeborg"
