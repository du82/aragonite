full_description = "Vintage Dinosaur Art: Dinosaurs (Ladybird Square books) Vintage Dinosaur Art January 28, 2025 Say “Ladybird dinosaur book” to someone, and they’ll very likely think of the book illustrated by Bernard Robinson that was reprinted a number of times and spanned the childhoods of multiple generations. (Well, at least two.) I reviewed it all the way back in 2011, so perhaps my review is now as nostalgic for some people as Ladybird books are for others. (Nah, just kidding. I’m not so deluded.) Robinson’s illustrations, while technically superb and highly memorable, were looking rather… Continue Reading 4 Comments By Marc Vincent Vintage Dinosaur Art: Dinosaurs and Other Archosaurs – Part 1 Vintage Dinosaur Art July 13, 2020 Following on from Ranger Rick’s, here’s another more detailed look at a book that received some very brief attention long, long ago (2010). Why, it’s Dinosaurs and Other Archosaurs, written and illustrated by Peter Zallinger and published by Random House in 1986 (the year before I was born, incidentally). Once again, you can thank/blame Herman Diaz, who sent this book all the way over from the US. Cheers, Herman! Ten years ago, David noted that Zallinger’s work here “reflect[s] the… Continue Reading 5 Comments By Marc Vincent Paradise Park Revisited Attraction Review January 7, 2020 Many years ago, Marc introduced you all to the marvellous wonder that is Paradise Park. Early in 2019, he also introduced me to the place. Now I will re-introduce you to it, because I am on a mission to bring back Ugly Ugly Dinosaurs to LITC (or, as those savvy to today’s Internet lingo call them, Cursed Dinosaurs), and there is simply no place quite like Paradise Park. Enjoy! Although there’s plenty of tourism in the greater Brighton area, there… Continue Reading 5 Comments By Gemma Hazeborg Vintage Dinosaur Art: A natural history of Dinosaurs – Part 1 Vintage Dinosaur Art April 2, 2019 Although it was during the early 1990s when I first became interested in dinosaurs and dinosaur art, much of what was floating around back then had been produced decades prior. This only intensified when A Certain Movie came along, and everyone rushed out whatever dinosaur-festooned tat and half-hearted books they could to cash in. If a publisher happened to have the rights to some old dinosaur paintings from back in the ’70s then, well, that was easy money. As such,… Continue Reading 4 Comments By Marc Vincent"
