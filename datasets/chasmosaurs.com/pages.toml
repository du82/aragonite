full_description = "Vintage Dinosaur Art: Hubrecht at the Lyceum – Part 1 Vintage Dinosaur Art December 11, 2024 Once again: Marie Hubrecht. Are you tired of me talking about Marie Hubrecht yet? Because I’m not done. If you want more Hubrecht, check out my reviews of Verdwenen Werelden here, here and here, and our Verdwenen Werelden podcast episode here! This post is a direct companion to my last one, in which I detail the time I went to see the spectacular murals she made in the 1920s at the former Girls’ Lyceum in Amsterdam. These paintings have been… Continue Reading 5 Comments By Gemma Hazeborg Vintage Dinosaur Art: The Corridor of Life Vintage Dinosaur Art August 28, 2024 The palaeontologist Dr William Elgin Swinton (W E Swinton to you) is perhaps best known, in the context of popular books about dinosaurs at least, for works published by the Natural History Museum (or the British Museum (Natural History) as it then properly was) that featured artwork by Neave Parker. I reviewed such a book back in 2011, a rather dry affair filled with strange ideas that must have seemed a little outdated even at the time. However, it’d be… Continue Reading 2 Comments By Marc Vincent Vintage Dinosaur Art: The World’s Wonderful Creatures Vintage Dinosaur Art February 12, 2024 When looking at books from the years BT (Before T’internet), we must of course always bear in mind that decent reference material was rather difficult to come by, especially for your average jobbing illustrator without privileged access to museums and/or scientists. (And even then, the scientists sometimes just didn’t give a toss.) This explains the proliferation of Knight, Burian, and Zallinger clones – what else were the poor artists supposed to do, if not take inspiration from the greats? Nevertheless,… Continue Reading 13 Comments By Marc Vincent Vintage Dinosaur Art: Tiere der Urwelt (Reichardt) – Part 3 Vintage Dinosaur Art February 4, 2024 We’re back with more German dinosaur cards from the Reichardt cocoa company! In parts one and two, we discussed two series of 1900s illustrations by one F. John. In the late 1910s, Reichardt once again hit the market with collectible cards themed to extinct animals. Incidentally, after Series 1 and Series 2, the third series was numbered Series 1a, because that’s what makes the most sense. The original featured artist, F. John, was, not to put too fine a point… Continue Reading 4 Comments By Gemma Hazeborg"
