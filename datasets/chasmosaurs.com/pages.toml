full_description = "Vintage Dinosaur Art: Dinosaurs (Home Reference Library) Vintage Dinosaur Art February 18, 2025 In my further quest to avoid the DK Encyclopedia of Dinosaurs & Prehistoric Life from 2001 (which I do now own, at least), here’s another book from around that time – Dinosaurs, published in 2002 by Fog City Press. It’s a rather generic affair all told, but I’m sure there’s someone out there for whom this is an important childhood memory. Besides which, it features illustrations by Steve Kirk and Luis Rey (among others), not to mention an interesting mix of… Continue Reading 2 Comments By Marc Vincent Vintage Dinosaur Art: Dinosaur Encyclopaedia for Children (Gollancz) Vintage Dinosaur Art September 9, 2020 Who doesn’t love a bit of Steve Kirk? I’ve featured his work numerous times on LITC over the years – both here and over on version 1.0 – and I simply can’t get enough. Imagine my delight, then, when I found hitherto unseen Kirkwork in a book for sale in an Oxfam bookshop on Blatchington Road, Hove, just a short walk from where I live. And priced at just 49 pence! Not even this book’s clear designation as being For… Continue Reading 6 Comments By Marc Vincent"
