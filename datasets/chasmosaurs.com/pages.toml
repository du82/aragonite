full_description = "Vintage Dinosaur Telly: The Magic School Bus TV review November 12, 2024 Seatbelts, everyone! A few weeks ago I reviewed The Magic School Bus in the Time of the Dinosaurs, and mused at the end that I might have to seek out the TV episode on the same theme…which was in no way an appeal for commenters to do the work for me and provide a link, oh no. (As if I’d be so lazy.) Nevertheless, Zain Ahmed obligingly provided a link to a YouTube video. Thanks, Zain! (Admittedly, it’s not exactly… Continue Reading 8 Comments By Marc Vincent Vintage Dinosaur Art: The Magic School Bus in the Time of the Dinosaurs Vintage Dinosaur Art October 22, 2024 The Magic School Bus franchise was a big deal at exactly the right sort of time for it to have impacted my childhood, but it completely passed me by – probably because I’m British, and it wasn’t quite as well known here. I do have vague memories of a fantastical yellow bus (which was a bit of an alien concept – the yellow school bus, that is) that could fly through space and whatnot, but that’s about it. A shame,… Continue Reading 1 Comment By Marc Vincent Vintage Dinosaur Art: Dinosaur For A Day Vintage Dinosaur Art February 22, 2024 A couple of years ago, we looked at the book The Last Dinosaur by Jim Murphy and illustrated by Mark Alan Weatherby. It was a piece of naturalist fiction from the late 80s that followed the adventures of a female Triceratops as the world around her was dying. It was a beautiful and odd little book, one that I remembered reading when I was young. Less famously, in 1992, Murphy and Weatherby reunited for another dinosaur adventure, this one not… Continue Reading 5 Comments By Gemma Hazeborg Vintage Dinosaur Art: Dinosaurs (St. Martin’s Press) – Part 2 Vintage Dinosaur Art November 14, 2023 Ahoy-hoy, whippersnappers! I guess it’s been a while since we did part one of the 1990 Golden Guide to Dinosaurs, illustrated by John D. Dawson. The “D” stands for “Dinosaur”, one imagines. It’s time for some more early nineties Sibbicksaurs from this tiny spotter’s guide. Deinonychus is at least partially based on the somewhat notoriously freaky creature from the Normanpedia. Dawson manages to tone down its creep factor a little bit. All the wrinkles that carried over from Bakker have… Continue Reading 1 Comment By Gemma Hazeborg"
