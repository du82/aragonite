full_description = "Vintage Dinosaur Art: Hubrecht at the Lyceum – Part 1 Vintage Dinosaur Art December 11, 2024 Once again: Marie Hubrecht. Are you tired of me talking about Marie Hubrecht yet? Because I’m not done. If you want more Hubrecht, check out my reviews of Verdwenen Werelden here, here and here, and our Verdwenen Werelden podcast episode here! This post is a direct companion to my last one, in which I detail the time I went to see the spectacular murals she made in the 1920s at the former Girls’ Lyceum in Amsterdam. These paintings have been… Continue Reading 5 Comments By Gemma Hazeborg Vintage Dinosaur Art: The World of Dinosaurs – Part 2 Vintage Dinosaur Art August 18, 2022 My first post on this book was almost entirely dedicated to theropods (the best dinosaurs) – so we’d best now turn our attention to Everything Else. As discussed last time, the artwork here (credited to Wilcock Riley Graphic Art) is mostly fairly typical, and often even quite good, for the time in which was produced (i.e. 1977). But the artists do manage to make the odd strange turn here and there… Behold: Styracosaurus, but it’s a rhino now. As in,… Continue Reading 4 Comments By Marc Vincent Vintage Dinosaur Art: Creatures of the Past – Part 1 Vintage Dinosaur Art April 7, 2022 Here’s an unoffical followup to this post. As I explained there, my work as a science educator takes me to a large number of primary schools across the country, and whenever I can I sneak around the school library to see if I can find some palaeo-related content that I didn’t know yet. This one time, I found one of Jean M. Auel’s Clan of the Cave Bear books, most definitely not for children! I wonder how that got there?… Continue Reading 2 Comments By Gemma Hazeborg Vintage Dinosaur Art: The Prehistoric World Vintage Dinosaur Art September 13, 2021 While I’ve found a great deal of blog fodder on eBay, it’s always immeasurably more pleasurable to spot a book in person, out there in the wild. As it happens, my friend Huseyin actually found this one, amid the glorious chaos of the aptly-named Raining Books shop here in Brighton. Originally published in 1982 in Italian, with this English translation arriving in 1987, The Prehistoric World was written by Giorgio P Panini and illustrated by a variety of artists, most… Continue Reading 11 Comments By Marc Vincent"
