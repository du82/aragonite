full_description = "Vintage Dinosaur Art: Dinosaurs (Home Reference Library) Vintage Dinosaur Art February 18, 2025 In my further quest to avoid the DK Encyclopedia of Dinosaurs & Prehistoric Life from 2001 (which I do now own, at least), here’s another book from around that time – Dinosaurs, published in 2002 by Fog City Press. It’s a rather generic affair all told, but I’m sure there’s someone out there for whom this is an important childhood memory. Besides which, it features illustrations by Steve Kirk and Luis Rey (among others), not to mention an interesting mix of… Continue Reading 2 Comments By Marc Vincent The Dinosaurs of Silesia Attraction Review Vintage Dinosaur Art June 20, 2022 Zoo Chorzów, or the Silesian Zoological Park, is located a stone’s throw from the centre of Katowice in the Upper Silesia region of southern Poland. The zoo was founded on its current location in 1954, as part of the Socialist-era post-mining development of a big city park also including an amusement park, a planetarium, a sports centre and an art gallery. And there’s dinosaurs. The Dinosaur Valley section of the zoo, or the Kotlina Dinozaurów, was finished in 1974. Originally,… Continue Reading 9 Comments By Gemma Hazeborg Vintage Dinosaur Art: Zoobooks Dinosaurs – Part 1 Vintage Dinosaur Art May 6, 2022 Who remembers Zoobooks? Beginning in 1980, the richly illustrated and highly authoritative Zoobooks series made a name for itself as some of the very best educational books in the world of children’s publishing. Zoobooks were primarily distributed as mail-in magazines and hardback library copies, though I’ve also seen hardbacks sold at zoo gift shops. Most issues, as you’d expect, covered modern animals in great detail and the one devoted to dinosaurs is no different. Originally published in 1985, it was… Continue Reading 2 Comments By Sophie Vintage Dinosaur Art: Prehistoric World (Richard Moody) – Part 1 Vintage Dinosaur Art December 22, 2021 Here’s another book found through sheer serendipity while browsing charity shops with a friend – Prehistoric World, written by Richard Moody and published by Hamlyn in 1980. That means it was published a few years after another Moody-authored book that I reviewed in 2019 – A natural history of Dinosaurs – and it recycles a fair few illustrations from said earlier tome. No matter – there’s plenty of unique material here to make it worthy blog fodder, not least because… Continue Reading 3 Comments By Marc Vincent"
