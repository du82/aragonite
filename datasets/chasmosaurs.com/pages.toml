full_description = "Vintage Dinosaur Art: Dinosaurs (Home Reference Library) Vintage Dinosaur Art February 18, 2025 In my further quest to avoid the DK Encyclopedia of Dinosaurs & Prehistoric Life from 2001 (which I do now own, at least), here’s another book from around that time – Dinosaurs, published in 2002 by Fog City Press. It’s a rather generic affair all told, but I’m sure there’s someone out there for whom this is an important childhood memory. Besides which, it features illustrations by Steve Kirk and Luis Rey (among others), not to mention an interesting mix of… Continue Reading 2 Comments By Marc Vincent Vintage Dinosaur Art: Dinosaurs (Ladybird Square books) Vintage Dinosaur Art January 28, 2025 Say “Ladybird dinosaur book” to someone, and they’ll very likely think of the book illustrated by Bernard Robinson that was reprinted a number of times and spanned the childhoods of multiple generations. (Well, at least two.) I reviewed it all the way back in 2011, so perhaps my review is now as nostalgic for some people as Ladybird books are for others. (Nah, just kidding. I’m not so deluded.) Robinson’s illustrations, while technically superb and highly memorable, were looking rather… Continue Reading 4 Comments By Marc Vincent Vintage Dinosaur Art: Oxford First Book of Dinosaurs Vintage Dinosaur Art January 17, 2025 As the sort of unremarkable kids’ book that you might find buried in a stack at a charity shop, looking a little forlorn (but I found on eBay, of course), you might not expect too much from the Oxford First Book of Dinosaurs (part of a series that included further volumes on animals, art, maths, science, and space). As you’ve no doubt guessed, it uses a lot of art recycled from earlier books. Ah, but in this case, it’s a… Continue Reading 4 Comments By Marc Vincent All aboard for 2025 Attraction Review Personal reflection December 30, 2024 Not wanting the last post of the year to be a vanilla Vintage Dinosaur Art post featuring some filler art from 20 years ago presented a conundrum. What else am I supposed to do these days? A few different ideas came to mind – a bit of personal reflection, a review of a museum or other attraction that I’d failed to post about, or a humorous comparison of ‘expert reacts’ videos regarding dinosaur media. In the end, I decided to… Continue Reading 4 Comments By Marc Vincent"
