full_description = "Podcast Show Notes: Episode 37 – Farewell TetZooCon Conference Podcast Show Notes October 30, 2024 As every year, Marc, Natee and Gemma visited TetZooCon, Darren Naish’ big annual London event about animals, palaeontology, palaeoart and all things tetrapod. And this was a special edition indeed. Not only has this been the last ever edition of the Tetrapod Zoology Conference in its current form (more on which on the show) but we actually gave a talk this time! And what’s more, the talk has been recorded and is included in full on this very special, extra… Continue Reading 3 Comments By Gemma Hazeborg Titanosaur at the NHM Museums January 5, 2024 ‘Twas the night before TetZooCon, and London was full of palaeo enthusiasts. Many of them took the opportunity to visit the Natural History Museum before the introduction event on Friday night, and indeed, so did I. I was in London accompanied by our Marc and our Agata, knowing that I wanted to see the temporary exhibition called Titanosaur: Life As The Biggest Dinosaur. The main attraction was of course a full sized mount of Patagotitan, one of the best known… Continue Reading 8 Comments By Gemma Hazeborg Podcast Show Notes: Episode 29 – Life On Our Planet and Emily Stepp Podcast Show Notes November 29, 2023 Niels, Natee and Marc look forward to TetZooCon, chat about recent museum visits, and continue to shamelessly plug the new merchandise designed by The Founder, David Orr. Then, in lieu of Vintage Dinosaur Art, they – and special guest Agata Stachowiak – discuss the Netflix series Life On Our Planet, in which Morgan Freeman gravels his way through an intriguing mix of modern-day wildlife footage and CGI recreations of creatures from Deep Time. Finally, Niels and Marc discuss unlikely hybrids,… Continue Reading 0 Comments By Marc Vincent Vintage Dinosaur VHS: Dinosaurs (the Official Natural History Museum video) Film review May 9, 2022 Some years back – well, in 2019, but 2019 feels like a very long time ago now – I reviewed the Eyewitness Dinosaur video, released on VHS in 1994. While I happened to own that one back in the day, Dave Hone (for it was he) recently drew my attention to another early ’90s dinosaur-related video that had, somehow, escaped my childhood gaze. (My parents probably didn’t let me hang around for long enough in the Natural History Museum gift… Continue Reading 4 Comments By Marc Vincent"
