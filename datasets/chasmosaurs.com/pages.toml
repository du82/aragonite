full_description = "Podcast Show Notes: Episode 38 – Thomas Thiemeyer and the Triceratops Herd Podcast Show Notes February 26, 2025 After months of technical mishaps, we finally managed to get the podcast back up and running! Marc, Gemma and Natee start off by having a little moan about terrible dinosaur movies before moving into a fun German book Gemma found at a school! We got some typical late 80s fare, with some very unusual depictions of dinosaurs… Then, Gemma and Marc interview Yasmin Grooters, head of the dinosaur lab at Naturalis Leiden, who recently finished work on a whole herd… Continue Reading 2 Comments By Gemma Hazeborg Vintage Dinosaur Art: Das Grosse Buch der Saurier Vintage Dinosaur Art June 21, 2021 Funny story, this one. As a science educator, I visit primary schools all over the country, and I often can’t resist scanning their school libraries for dinosaur books. Most of the time, I run into these awful late-2000’s stock-CGI schlockfests, but last week, I hit paydirt. A beautifully illustrated German-made children’s book from the late 80s, well-worn by the tough love of so many children’s hands. As one of the teachers saw me gushing, she actually offered to give the… Continue Reading 9 Comments By Gemma Hazeborg"
