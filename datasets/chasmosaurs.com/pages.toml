title = "Podcast Show Notes: Episode 38 – Thomas Thiemeyer and the Triceratops Herd – Love in the Time of Chasmosaurs"
description = "After months of technical mishaps, we finally managed to get the podcast back up and running! Marc, Gemma and Natee start off by having a little moan about terrible dinosaur movies before moving in…"
full_description = "Podcast Show Notes: Episode 38 – Thomas Thiemeyer and the Triceratops Herd Podcast Show Notes February 26, 2025 After months of technical mishaps, we finally managed to get the podcast back up and running! Marc, Gemma and Natee start off by having a little moan about terrible dinosaur movies before moving into a fun German book Gemma found at a school! We got some typical late 80s fare, with some very unusual depictions of dinosaurs… Then, Gemma and Marc interview Yasmin Grooters, head of the dinosaur lab at Naturalis Leiden, who recently finished work on a whole herd of Triceratops! Will Natee narrate the next Walking With Dinosaurs special? How is a Quetzalcoatlus like a pair of embroidery scissors? How do you put a museum exhibition together? How many cute nicknames can you give to a giant dinosaur? When are the Hadrosaur Gang going to drop their ballin’ hip hop album? And what in the name of all that is holy is wrong with that Deinocheirus? We’re back! In the News The first still images of the Walking With Dinosaurs reboot, expected later this year, have been officially released. Some of our friends are involved with the production of this series, so congratulations! We’re looking forward to it immensely. Credit: BBC/PBS/ZDF/France Télévisions Related but less excting are stills (and now a full on trailer) for the new Jurassic World movie. Does anyone still care about this francise? Credit: Who cares. Universal I suppose? A new paper in Geoconservation Research, by the dearly missed Qi Wang, Yuan Wang and our friend Adam Smith, examines the palaeoart murals found on the walls of Paleozoological Museum of China in Beijing. The paper is open access and can be found here! Vintage Dinosaur Art Das Grosse Buch der Saurier was published in 1989. It was written by Peter Klepsch and illustrated by Thomas Thiemeyer. We’ve got some very typical 80s dinosaur fare here, but also some very atypical stuff! Gemma’s original review of the book is here! This is relevant to the episode, I promise – GH Interview Yasmin Grooters is the head of the dino lab at Naturalis, the natural history museum in Leiden. She worked on a herd of five Triceratops, now on display at the museum. The current exhibition runs until the end of August 2025, after which it will tour the world. Information can be found on the official website here! Five Triceratops in a conga line. Image: Gemma Hazeborg Thank you for listening to the podcast! Our music was generously provided by Rohan Long. You can purchase his music at Bandcamp, and follow him at Twitter. By becoming a patron on Patreon, you can help us continue creating podcasts and writing this blog. You can also follow us on Facebook and Twitter. See you next time! You know you want to share this post.FacebookTwitterRedditEmail Related Jurassic WorldnaturalispodcastPodcast Show NotesThomas ThiemeyerTriceratopsWalking With DinosaursYasmin Grooters 2 Comments By Gemma Hazeborg Gemma Hazeborg You Might Also Like Podcast Show Notes: Episode 18 – Prehistoric Planet Special July 12, 2022 Podcast Show Notes: Episode 22 – Postcards from TetZooCon 2022 December 24, 2022 Podcast Show Notes: Episode 35 – Snowball and the Raptor Boys June 30, 2024 2 Comments Reply Dino Dad Reviews February 26, 2025 at 5:31 pm I grew up with a memory game that used illustrations from that book! Reply T. K. Sivgin February 27, 2025 at 5:27 am I had this book as a kid! Leave a ReplyCancel reply document.addEventListener('DOMContentLoaded', function () { var commentForms = document.getElementsByClassName('jetpack_remote_comment'); for (var i = 0; i < commentForms.length; i++) { commentForms[i].allowTransparency = false; commentForms[i].scrolling = 'no'; } }); This site uses Akismet to reduce spam. Learn how your comment data is processed."
