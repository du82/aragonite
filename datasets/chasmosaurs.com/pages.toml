full_description = "All aboard for 2025 Attraction Review Personal reflection December 30, 2024 Not wanting the last post of the year to be a vanilla Vintage Dinosaur Art post featuring some filler art from 20 years ago presented a conundrum. What else am I supposed to do these days? A few different ideas came to mind – a bit of personal reflection, a review of a museum or other attraction that I’d failed to post about, or a humorous comparison of ‘expert reacts’ videos regarding dinosaur media. In the end, I decided to… Continue Reading 4 Comments By Marc Vincent Podcast Show Notes: Episode 37 – Farewell TetZooCon Conference Podcast Show Notes October 30, 2024 As every year, Marc, Natee and Gemma visited TetZooCon, Darren Naish’ big annual London event about animals, palaeontology, palaeoart and all things tetrapod. And this was a special edition indeed. Not only has this been the last ever edition of the Tetrapod Zoology Conference in its current form (more on which on the show) but we actually gave a talk this time! And what’s more, the talk has been recorded and is included in full on this very special, extra… Continue Reading 3 Comments By Gemma Hazeborg Vintage Dinosaur Art, maybe: De dinosauriërs (Kennis Compact) Vintage Dinosaur Art July 13, 2024 The concept of “bad art” has been occupying my mind lately, for reasons that will hopefully become clear in due course. Bad palaeoart, especially. It is my firmly-held belief that even the shoddiest work made by human hand has infinitely more value than any image artificially created by a learning, plagiarizing algorithm. No matter how many works by Tony Gibbons and F. John we have to plough through on these pages, this will still be essentially true. All contributions to… Continue Reading 9 Comments By Gemma Hazeborg Vintage Dinosaur Art: Dinosaurus – Part 1 Vintage Dinosaur Art March 5, 2024 When I first started writing for this blog – many, many years ago now, possibly even as long ago as 2009 – I was accused of being overly-critical. “Who cares if a dinosaur’s gross anatomy shifts considerably from one illustration to the next?” “You’re pissing all over a classic!” You know, that sort of thing. And the accusers had a point, at least some of the time. As I’ve got older I’ve certainly mellowed – not to mention got to… Continue Reading 5 Comments By Marc Vincent"
