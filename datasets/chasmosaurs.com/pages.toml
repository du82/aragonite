full_description = "Vintage Dinosaur Art: Dinosaur (DK Revealed) Vintage Dinosaur Art November 28, 2024 Regular readers (we have some, right?) will be aware that our sole criterion for a book’s inclusion in Vintage (=Old) Dinosaur Art is that it be 20 years old. Consequently, books from the early 2000s have now entered our purview. It was a time when, in the wake of Walking With Dinosaurs, publishers demanded increasing numbers of CG creations in lieu of more traditional illustrations and model photography. Dorling Kindersley (aka DK) very much followed this trend, inserting very dodgy… Continue Reading 1 Comment By Marc Vincent Podcast Show Notes: Episode 29 – Life On Our Planet and Emily Stepp Podcast Show Notes November 29, 2023 Niels, Natee and Marc look forward to TetZooCon, chat about recent museum visits, and continue to shamelessly plug the new merchandise designed by The Founder, David Orr. Then, in lieu of Vintage Dinosaur Art, they – and special guest Agata Stachowiak – discuss the Netflix series Life On Our Planet, in which Morgan Freeman gravels his way through an intriguing mix of modern-day wildlife footage and CGI recreations of creatures from Deep Time. Finally, Niels and Marc discuss unlikely hybrids,… Continue Reading 0 Comments By Marc Vincent Vintage Dinosaur Art: World Atlas of Dinosaurs – Part 1 Vintage Dinosaur Art January 25, 2023 It’s 2023, and we have a rule here. It’s an arbitrary rule, but here we are: We count everything as “vintage” that is 20 years old or older. That means, try not to die of shock here, that everything up to 2003 is now eligible for a Vintage Dinosaur Art review. Them’s the breaks. A whole new millennium is opening up for us! Now, when I think of what dinosaur books look like in the 21st century, I mostly think… Continue Reading 8 Comments By Gemma Hazeborg Podcast Show Notes: Episode 6 – Luis Rey special Podcast Show Notes May 29, 2021 Our sixth episode is all about legendary palaeoartist Luis V. Rey! We discuss some of his most eye-catching artwork, as it appears in his art compendium Extreme Dinosaurs (2001). Then, Marc and Niels speak to Luis himself, as he shares many of his trade secrets, anecdotes, his surprising inspirations, his artistic philosophies, his future projects and much more. A must-listen for all Rey fans! In the News A new open-access paper by Novas et al compares the shoulder girdles of… Continue Reading 1 Comment By Gemma Hazeborg"
