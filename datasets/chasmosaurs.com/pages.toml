full_description = "Vintage Dinosaur Art: Triceratops (Dinosaur books from The Child’s World) Vintage Dinosaur Art August 5, 2024 It’s been a bit quiet around here lately, hasn’t it? Personally, the first half of this year felt like a good 2 years in itself, such were the Life Events that happened. Things have settled down now, though, so I’m hoping to get back to more frequent posting. Why not start with another in The Child’s World dinosaur series (because I have it handy)? Triceratops was published in 1988, written by Janet Riehecky (of course) and illustrated by Diana Magnuson… Continue Reading 3 Comments By Marc Vincent The Iguanodon’s Horn – review Book Review July 15, 2024 As children, we’re all told the same story about the scientific evolution of Iguanodon, one of the earliest-named dinosaurs – how it went from a whale-sized lizard (some kind of ‘cetiosaur’, if you will. OK, not that), to a mono-horned quadruped, to a tail-dragging thumbs-upping tripod, to the mean and muscular, mostly quadrupedal but facultatively bipedal, intimidatingly brutish beast we know today. Along the way, we’re typically encouraged to have a good old chuckle at just how wrong people got… Continue Reading 2 Comments By Marc Vincent Vintage Dinosaur Art: Oviraptor (Dinosaur books from The Child’s World) Vintage Dinosaur Art June 6, 2024 One month on from the last entry, here’s another slice of the early ’90s dinosaur book series from The Child’s World, this time featuring everyone’s favourite misunderstood, misnamed, cassowary-casqued* weirdo, Oviraptor. Diana Magnuson, who illustrated the Megalosaurus book, also provided the artwork here. In the main, it’s a considerable improvement over her work on Megalosaurus, although that might have been because up-to-the-minute reference material and illustrations of Megalosaurus were hard to come by at the time, while Oviraptor was enjoying… Continue Reading 0 Comments By Marc Vincent Vintage Dinosaur Art: Ornithomimus (Dinosaur books from The Child’s World) Vintage Dinosaur Art May 8, 2024 Ornithomimosaurs: they almost always get a mention, but are hardly ever in the spotlight (except for that crazy giant one). How fortunate, then, that The Child’s World saw fit to dedicate an entire volume in their series of dinosaur books to Ornithomimus, a pretty vanilla ornithomimosaur if ever I did see one. (It’s a good thing that there’s no such thing as a specialist ornithomimosaur researcher, so no one can take me up on that.) What’s more, it has some… Continue Reading 7 Comments By Marc Vincent"
