full_description = "Vintage Dinosaur Art: Hubrecht at the Lyceum – Part 1 Vintage Dinosaur Art December 11, 2024 Once again: Marie Hubrecht. Are you tired of me talking about Marie Hubrecht yet? Because I’m not done. If you want more Hubrecht, check out my reviews of Verdwenen Werelden here, here and here, and our Verdwenen Werelden podcast episode here! This post is a direct companion to my last one, in which I detail the time I went to see the spectacular murals she made in the 1920s at the former Girls’ Lyceum in Amsterdam. These paintings have been… Continue Reading 5 Comments By Gemma Hazeborg Vintage Dinosaur Art: The Dinosaur Action Set (Book One!) Vintage Dinosaur Art September 17, 2024 Today’s entry is rather similar in concept to the later Dinosaur Park, which I reviewed back in 2020, but quite unlike the DK ACTION PACK (in spite of the rather similar title). It would appear to be a straightforward book at first glance, but upon opening an instruction is immediately given to prise out the staples and then remove all the pages. What’s this, a book that wants you to destroy it?! Of course not – well, sort of, actually,… Continue Reading 3 Comments By Marc Vincent Vintage Dinosaur Art: Triceratops (Dinosaur books from The Child’s World) Vintage Dinosaur Art August 5, 2024 It’s been a bit quiet around here lately, hasn’t it? Personally, the first half of this year felt like a good 2 years in itself, such were the Life Events that happened. Things have settled down now, though, so I’m hoping to get back to more frequent posting. Why not start with another in The Child’s World dinosaur series (because I have it handy)? Triceratops was published in 1988, written by Janet Riehecky (of course) and illustrated by Diana Magnuson… Continue Reading 3 Comments By Marc Vincent Vintage Dinosaur Art: Záhada Dinosaurů – Part 2 Vintage Dinosaur Art April 30, 2024 No doubt you’ve seen part one of our deep dive into Záhada Dinosaurů, this obscure gem from Czechia, written by Jaroslav Mareš and illustrated by Barbora Kyšková. Obscure unless you’re Czech, that is, in which case you will probably know this book very well. The comments on this and other platforms tell me it’s a divisive book, with divisive artwork, and Jaroslav Mareš a divisive character. We’ve already seen most of the theropods, but a big aspect of the book’s… Continue Reading 8 Comments By Gemma Hazeborg"
