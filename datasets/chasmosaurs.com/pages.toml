full_description = "Vintage Dinosaur Art: Dinosaurs (Home Reference Library) Vintage Dinosaur Art February 18, 2025 In my further quest to avoid the DK Encyclopedia of Dinosaurs & Prehistoric Life from 2001 (which I do now own, at least), here’s another book from around that time – Dinosaurs, published in 2002 by Fog City Press. It’s a rather generic affair all told, but I’m sure there’s someone out there for whom this is an important childhood memory. Besides which, it features illustrations by Steve Kirk and Luis Rey (among others), not to mention an interesting mix of… Continue Reading 2 Comments By Marc Vincent Vintage Dinosaur Art: Oxford First Book of Dinosaurs Vintage Dinosaur Art January 17, 2025 As the sort of unremarkable kids’ book that you might find buried in a stack at a charity shop, looking a little forlorn (but I found on eBay, of course), you might not expect too much from the Oxford First Book of Dinosaurs (part of a series that included further volumes on animals, art, maths, science, and space). As you’ve no doubt guessed, it uses a lot of art recycled from earlier books. Ah, but in this case, it’s a… Continue Reading 4 Comments By Marc Vincent Introducing Sophie! Announcements Uncategorized April 11, 2022 There’s a new face on the blog! Sophie has been getting some attention on Twitter with, among other things, her threads on vintage dinosaur books. Of course, it was a matter of time before she found her way here. Please welcome Sophie and come say hi in the comments! – Niels Hi there, everyone! I’m Sophie, you might know me from my Twitter where I’ve made a name for myself with my enormous threads on old dinosaur art, regular commentary… Continue Reading 5 Comments By Sophie Podcast Show Notes: Episode 5 – Jane Burton and Rebecca Groom Podcast Show Notes April 24, 2021 The fifth episode of the LITC podcast is here, in which the team ventures off the beaten path into more unusual forms of palaeoart. We discuss a volume of vintage dinosaur art that was ahead of its time in its blending of photography and illustration. For our interview, Natee talks to Rebecca Groom, whose hand-crafted soft toys of underrepresented animals, both living and extinct, have won her many admirers. Featuring rainbows and unicorns and an exclusive poetry reading by Natee.… Continue Reading 2 Comments By Gemma Hazeborg"
