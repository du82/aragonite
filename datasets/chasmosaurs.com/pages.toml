full_description = "Podcast Show Notes: Episode 37 – Farewell TetZooCon Conference Podcast Show Notes October 30, 2024 As every year, Marc, Natee and Gemma visited TetZooCon, Darren Naish’ big annual London event about animals, palaeontology, palaeoart and all things tetrapod. And this was a special edition indeed. Not only has this been the last ever edition of the Tetrapod Zoology Conference in its current form (more on which on the show) but we actually gave a talk this time! And what’s more, the talk has been recorded and is included in full on this very special, extra long episode. So indulge yourself, park somewhere if you’re in your car, and enjoy our very final thoughts on a wonderful, bittersweet edition of our favourite event, followed by our live celebration of Fifteen Years of Love in the time of Chasmosaurs: An Ode To Bad Palaeoart. In the News Ardetosaurus viator is the name given to the new sauropod currently mounted at Oertijdmuseum Boxtel. We interviewed the main author Tom van der Linden back in episode 14, so we felt some followup was due here. The paper is open access and can be read here. During our TetZooCon weekend, all three of us found the time to take a look at Fern, the bronze Diplodocus mount at the new gardens at London’s Natural History Museum. Photo by Gemma Hazeborg TetZooCon 2024 Some snapshots from TetZooCon! The View. Photo by Gemma Hazeborg Matt Dempsey and Andrew Stück. Photo by Gemma Hazeborg Jed Taylor and Ruadhrí Brennan. Photo by Agata Stachowiak Darren Naish and John Conway. Photo by Gemma Hazeborg Jonathan Meiburg. Photo by Agata Stachowiak The LITC crew presenting. Photo by Agata Stachowiak The LITC crew presenting. Photo by Agata Stachowiak The LITC crew presenting. Photo by Agata Stachowiak The LITC crew presenting. Photo by Agata Stachowiak The LITC crew presenting. Photo by Agata Stachowiak The LITC crew presenting. Photo by Agata Stachowiak Natee, Gemma, Marc. Photo by Agata Stachowiak Dave Hone’s palaeoart collection (note the Ouranosaurus piece). Photo by Gemma Hazeborg Dave Hone’s palaeoart collection. Photo by Gemma Hazeborg Marc and Agata buy tat from Darren. Photo by Gemma Hazeborg Kai Caspar. Photo by Gemma Hazeborg Dave Hone. Photo by Gemma Hazeborg Katrina van Grouw. Notice all the 3D models she is still in need of. Photo by Gemma Hazeborg Some terrible palaeoart. Photo by Gemma Hazeborg More attempts at bad paleoart. Photo by Gemma Hazeborg Stavros Svensson Kundromichalis at the palaeoart workshop. Photo by Gemma Hazeborg Chris Packham. Photo by Agata Stachowiak Introducing DinoCon. Photo by Gemma Hazeborg An Ode To Bad Palaeoart Here’s the slides to our Bad Palaeoart presentation so you can follow along! Thank you for listening to the podcast! Our music was generously provided by Rohan Long. You can purchase his music at Bandcamp, and follow him at Twitter. By becoming a patron on Patreon, you can help us continue creating podcasts and writing this blog. You can also follow us on Facebook and Twitter. See you next time! You know you want to share this post.FacebookTwitterRedditEmail Related ArdetosaurusBrian J FordDarren NaishDave HoneKai CasparNatural History Museum (London)OertijdmuseumpodcastPodcast Show NotesPrehistoric PlanetTetZooConTom van der Lindenugly ugly dinosaursWhy Dinosaurs 3 Comments By Gemma Hazeborg Gemma Hazeborg You Might Also Like TetZooMCon 2021 September 15, 2021 TetZooCon 2018 – Day 2 October 17, 2018 Podcast Show Notes: Episode 28 – Prehistoric Animals and Asher Elbein October 31, 2023 3 Comments Reply Grant Harding October 31, 2024 at 3:54 pm Wonderful talk! And what a thrill to see one of the Pangaea scans I sent to you! Reply Gemma Hazeborg November 2, 2024 at 6:19 pm Thanks again for those scans! How do you feel about their placement on the scale of Bad Palaeoart? Reply Grant Harding January 8, 2025 at 3:00 pm They fit right in next to Hubrecht! Leave a ReplyCancel reply document.addEventListener('DOMContentLoaded', function () { var commentForms = document.getElementsByClassName('jetpack_remote_comment'); for (var i = 0; i < commentForms.length; i++) { commentForms[i].allowTransparency = false; commentForms[i].scrolling = 'no'; } }); This site uses Akismet to reduce spam. Learn how your comment data is processed."
