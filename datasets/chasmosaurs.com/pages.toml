full_description = "Vintage Dinosaur Art: Oxford First Book of Dinosaurs Vintage Dinosaur Art January 17, 2025 As the sort of unremarkable kids’ book that you might find buried in a stack at a charity shop, looking a little forlorn (but I found on eBay, of course), you might not expect too much from the Oxford First Book of Dinosaurs (part of a series that included further volumes on animals, art, maths, science, and space). As you’ve no doubt guessed, it uses a lot of art recycled from earlier books. Ah, but in this case, it’s a… Continue Reading 4 Comments By Marc Vincent Podcast Show Notes: Episode 7 – John McLoughlin and Cameron Clow Podcast Show Notes June 30, 2021 In LITC’s latest podcast release, Natee, Marc and Niels tackle one of the most often ridiculed works in palaeoart history: the famously idiosyncratic Archosauria by John McLoughlin. Of course, we need to talk about that Triceratops… but there is so much more to this book, some of it crazy, some of it beautiful, much of it downright visionary. Natee interviews palaeoartist Cameron Clow, and things quickly devolve into a horse girl geekout. In the news, there’s baby theropods nomming on… Continue Reading 0 Comments By Gemma Hazeborg Podcast Show Notes: Episode 2 – John Sibbick and Natalia Jagielska Podcast Show Notes January 25, 2021 Episode 2 of the Love in the Time of Chasmosaurs Podcast is here! This month, Natee, Marc and Niels talk about dinosaur butts! We also discuss some legendary paleoart by John Sibbick that is tattooed on every dinosaur fan’s DNA, and interview the talented Natalia Jagielska. On this page, you can see the images we discuss and follow links to relevant pages. In the News A remarkably well-preserved Psittacosaurus, earlier responsible for telling us about its colouration, has yielded secrets… Continue Reading 2 Comments By Gemma Hazeborg Vintage Dinosaur Art: The Great Dinosaurs – Part 4 Vintage Dinosaur Art November 9, 2020 Hello again! It’s been a while, but our deep submersion into Jan Sovák’s artwork as it appears in The Great Dinosaurs continues today! For those who missed it, we’ve already looked at the theropods, sauropods and ornithopods featured in this massive book. That beings us to the ceratopsians! This isn’t the first time we’re doing a ceratopsian-centered article at LITC, so I’m sure we’re all comfortable with them. Let’s pick up where we left off! Here’s a herd of Pachyrhinosaurus… Continue Reading 15 Comments By Gemma Hazeborg"
