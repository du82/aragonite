title = "Podcast Show Notes: Episode 28 – Prehistoric Animals and Asher Elbein – Love in the Time of Chasmosaurs"
description = "Marc, Niels and Natee essay a new and improved, that is, much more informal, news section, as we follow up on previous items and comment on two new palaeo media releases. This month’s Vintage…"
full_description = "Podcast Show Notes: Episode 28 – Prehistoric Animals and Asher Elbein Podcast Show Notes October 31, 2023 Marc, Niels and Natee essay a new and improved, that is, much more informal, news section, as we follow up on previous items and comment on two new palaeo media releases. This month’s Vintage Dinosaur Art is illustrated with the sculptures of Arthur Hayward and others and is an approach that we at least would very much enjoy seeing a return of in newer publications. Finally, our Lord and Blogmaster, David Orr, makes another very welcome appearance and joins Niels in interviewing writer, Asher Elbein, about his new book, co-written with Cindi Sirois Collins, Dinosaurs and Other Ancient Animals of Big Bend. In the News Episode 27 Show notes, with Donna Braginetz’s response in the comments. Niels’s posts on Donna’s work for a series of Don Lessem’s books. Paleo Pines game. Palaeontologist and artist, Natalia Jagielska, who consulted on the game, was interviewed in Episode 2. Mary Anning statue, sculpted by Denise Dutton, unveiled in Lyme Regis on what would have been Anning’s 222nd birthday on 21st May, 2022. The Hatchling short film, from director Tim Cianfano, producers Max Bellomio, Anthony Feliciano, Luke Lotardo, and Chris Pugh, and writers Bri Bollmann, Tim Cianfano, and Chris Pugh. Life on Our Planet, available to stream from Netflix. The Guardian review by Jack Seale. Vintage Dinosaur Art Prehistoric Animals: the Extraordinary Story of Life Before Man, written by Ellis Owen, published by Octopus in 1975. The book focuses on sculpture photography rather than traditional illustration. Many, though not all, of the featured sculptures come courtesy of Arthur Hayward, who also sculpted the earlier Invicta dinosaur toys, discussed in epsidoe 23. We unerthed a YouTube video of him at work at stop-motion animation, which we mention in the show and which can be seen here. Tyrannosaurus Triceratops Styracosaurus Apatosaurus Ceratosaurus Coccosteus Pristigenys Allosaurus Smilodon Deinotherium Megaloceros (Slight erratum: Natee of course means Sir Edwin Landseer, not ‘Edward’, as the painter of The Monarch of the Glen.) Stegosaurus Archaeopteryx Protoceratops Interview Asher Elbein is a freelance journalist, writer, and artist based in Austin, Texas. His work has appeared in the New York Times, Texas Monthly, and Audubon Magazine, among others. His fiction work includes the Anna O’Brien books and Tales from the Blended Earth. His latest title, Dinosaurs and Other Ancient Animals of Big Bend, is co-authored with Cindi Sirois Collins, and is published by Texas University Press. Asher is also a Chasmosaurs contributor-emeritus. You can revisit some of his posts on our old blog, namely, Dinosaur Art: The Agony and The Ecstacy, Archosaurs of Alabama and All Yesterdays: Some Thoughts. He can also be found on Twitter, Instagram, and Tumblr. ______________________________________________________________________________________________________ Thank you for listening to the podcast! Our music was generously provided by Rohan Long. You can purchase his music at Bandcamp, and follow him at Twitter. By becoming a patron on Patreon, you can help us continue creating podcasts and writing this blog. You can also follow us on Facebook and Twitter. See you next time! You know you want to share this post.FacebookTwitterRedditEmail Related Arthur HaywardAsher ElbeinDonna BraginetzLife On Our Planetmary anningMax BellomioNatalia JagielskapodcastPodcast Show NotesThe Hatchling 3 Comments By Natee Natee You Might Also Like Podcast Show Notes: Episode 29 – Life On Our Planet and Emily Stepp November 29, 2023 Podcast Show Notes: Episode 7 – John McLoughlin and Cameron Clow June 30, 2021 Podcast Show Notes: Episode 4 – Wayne Barlowe and Chris DiPiazza March 18, 2021 3 Comments Reply Ant ???? (@antallan) ???????????????? November 2, 2023 at 12:38 pm Nice. Does anyone else think that the Trike and Styracosaurus models from the book are very reminiscent of the old Aurora kits? ???? Reply Lu November 3, 2023 at 12:51 am There doesn’t seem to be any content on the Patreon. Have you anything in mind? Happy to pledge more. Reply llewelly November 5, 2023 at 4:37 pm Great episode. I am glad you decided to make a statement about machine learning and the awful uses to which it is being put. (I took some machine learning courses back in the 1990s, and I’ve always felt the term “AI” was terribly misleading.) Leave a ReplyCancel reply document.addEventListener('DOMContentLoaded', function () { var commentForms = document.getElementsByClassName('jetpack_remote_comment'); for (var i = 0; i < commentForms.length; i++) { commentForms[i].allowTransparency = false; commentForms[i].scrolling = 'no'; } }); This site uses Akismet to reduce spam. Learn how your comment data is processed."
