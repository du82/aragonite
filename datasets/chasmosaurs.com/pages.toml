full_description = "Vintage Dinosaur Art: Hubrecht at the Lyceum – Part 1 Vintage Dinosaur Art December 11, 2024 Once again: Marie Hubrecht. Are you tired of me talking about Marie Hubrecht yet? Because I’m not done. If you want more Hubrecht, check out my reviews of Verdwenen Werelden here, here and here, and our Verdwenen Werelden podcast episode here! This post is a direct companion to my last one, in which I detail the time I went to see the spectacular murals she made in the 1920s at the former Girls’ Lyceum in Amsterdam. These paintings have been… Continue Reading 5 Comments By Gemma Hazeborg Vintage Dinosaur Art: The Corridor of Life Vintage Dinosaur Art August 28, 2024 The palaeontologist Dr William Elgin Swinton (W E Swinton to you) is perhaps best known, in the context of popular books about dinosaurs at least, for works published by the Natural History Museum (or the British Museum (Natural History) as it then properly was) that featured artwork by Neave Parker. I reviewed such a book back in 2011, a rather dry affair filled with strange ideas that must have seemed a little outdated even at the time. However, it’d be… Continue Reading 2 Comments By Marc Vincent Vintage Dinosaur Art: Dinosaurs (A Golden World Explorer Book) Vintage Dinosaur Art January 8, 2024 The most well-known Golden Book to feature dinosaurs is undoubtedly The Big Golden Book of Dinosaurs, also released in the guise of Dinosaurs and Other Prehistoric Animals (which was the edition I happened to review on this blog, back before some of you were born, probably). So memorable was that Zallinger-illustrated classic that Robert Bakker and Luis Rey deemed it worthy of a remake, published in 2013. Besides that, there was of course the very memorable Little Golden Book, packed… Continue Reading 4 Comments By Marc Vincent Vintage Dinosaur Art: Prehistoric Animals (Purnell Library of Knowledge) Vintage Dinosaur Art October 16, 2023 Purnell’s prehistoric animal books of the 1970s – of which there were several, of varying quality (as mostly featured on LITC Mk 1) – attract a great deal of nostalgic fondness from people, uh, a little older than me. The fact that their output seemed to dry up from the 1980s onwards becomes a lot more explicable when one learns of how the company fell into the hands of notorious crook and amateur yachtsman Robert ‘Cap’n Bob’ Maxwell, and consequently… Continue Reading 1 Comment By Marc Vincent"
