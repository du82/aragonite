full_description = "Vintage Dinosaur Art: Dinosaurs (Home Reference Library) Vintage Dinosaur Art February 18, 2025 In my further quest to avoid the DK Encyclopedia of Dinosaurs & Prehistoric Life from 2001 (which I do now own, at least), here’s another book from around that time – Dinosaurs, published in 2002 by Fog City Press. It’s a rather generic affair all told, but I’m sure there’s someone out there for whom this is an important childhood memory. Besides which, it features illustrations by Steve Kirk and Luis Rey (among others), not to mention an interesting mix of… Continue Reading 2 Comments By Marc Vincent Vintage Dinosaur Art: Dinosaurus – Part 2 Vintage Dinosaur Art March 26, 2024 In my previous post we took a look at Dinosaurus, a 1998 volume that I now know is essentially a compendium of the Looking At…Dinosaurs series, featuring much of the same dreadful artwork. (Thank you commenters!) For reasons best known to the publishers, artist Tony Gibbons – who was responsible for some of the weirder illustrations that appeared in the early issues of Dinosaurs! magazine in 1993 – was here let loose on dozens of pretty painful illustrations of dinosaurs,… Continue Reading 2 Comments By Marc Vincent Prehistoric Planet – A Modern Vision of the Past TV review Uncategorized June 5, 2022 I was only a year old when BBC’s landmark series Walking with Dinosaurs first aired, but I have to imagine watching it in 1999 must have felt similar to the way I felt watching Prehistoric Planet this week. Not since then has the age of dinosaurs ever been portrayed so believably. For the first time in a big-budget media project we’re getting depictions of Mesozoic life that isn’t plagued by concessions and strange design choices. Feathers are commonplace. Multi-ton behemoths… Continue Reading 4 Comments By Sophie Prehistoric Planet: I Bless The Rains Down In Mongolia TV review May 24, 2022 Our second trip to the Prehistoric Planet takes us to a series of desert landscapes, including the Gobi, North Africa and South America (twice). And in contrast with the first episode, it’s rather heavy on dinosaurs – as one might expect, given that a marine reptile flopping around in the sands wouldn’t look very dignified. Other creatures do significantly feature – pterosaurs, of course, and a little anonymous lizard chasing flies around the faces of sleeping Tarbosaurus. However, the dinosaurs… Continue Reading 3 Comments By Marc Vincent"
