full_description = "Vintage Dinosaur Art: Dinosaurs (Ladybird Square books) Vintage Dinosaur Art January 28, 2025 Say “Ladybird dinosaur book” to someone, and they’ll very likely think of the book illustrated by Bernard Robinson that was reprinted a number of times and spanned the childhoods of multiple generations. (Well, at least two.) I reviewed it all the way back in 2011, so perhaps my review is now as nostalgic for some people as Ladybird books are for others. (Nah, just kidding. I’m not so deluded.) Robinson’s illustrations, while technically superb and highly memorable, were looking rather… Continue Reading 4 Comments By Marc Vincent Vintage Dinosaur Art: Tiere der Urwelt (Reichardt) – Part 2 Vintage Dinosaur Art December 19, 2023 Have you seen our last post about these cards? Blog statistics tell me you mostly haven’t, so make sure to read it here. Today, I want to take you again to the wonderful, whimsical, slightly puzzling, occasionally grotesque prehistoric world of the enigmatic F. John, who exists only as a signature on sixty collectable cards from the Reichardt cocoa company. Quick recap: in the early 1900s, Reichardt released two series of thirty collectable cards with illustrations of prehistoric animals. All… Continue Reading 8 Comments By Gemma Hazeborg Vintage Dinosaur Art: Speaking of Dinosaurs Vintage Dinosaur Art July 11, 2023 Dinosaurs have encouraged a great many kids to improve their reading skills – best way to find out all about ’em, after all – so it’s only natural that books of a saurian bent have appeared in a number of reading schemes through the years. (I’ve certainly covered a few before – just don’t ask me to find them in the haystack.) Speaking of Dinosaurs was first published in 1979 (with this edition arriving in 1983) as part of the… Continue Reading 4 Comments By Marc Vincent Vintage Dinosaur Art: Discovering Dinosaurs Vintage Dinosaur Art April 12, 2023 Remember the St Michael dinosaur book, published in 1978 and notably featuring quite handsomely painted illustrations by Bernard Robinson? Discovering Dinosaurs, published a decade later by Cliveden Press, was illustrated by someone who evidently had a very well-thumbed copy of the earlier tome. I say ‘someone’, because neither the illustrator nor author here are credited, which is rather surprising. Then again, given the levels of Utter Shamelessness on show here, perhaps it’s because they’d rather their names weren’t attached to this… Continue Reading 3 Comments By Marc Vincent"
