title = "Uncovering Dinosaur Behaviour – review – Love in the Time of Chasmosaurs"
description = "While at TetZooCon 2024 (the last one ever! Sort of), I took the opportunity to pick up the latest book from Dave Hone (for it is he) – Uncovering Dinosaur Behaviour: What They Did and How We Know,…"
full_description = "Uncovering Dinosaur Behaviour – review Book Review October 10, 2024 While at TetZooCon 2024 (the last one ever! Sort of), I took the opportunity to pick up the latest book from Dave Hone (for it is he) – Uncovering Dinosaur Behaviour: What They Did and How We Know, published by Princeton University Press (in early November for the non-TZC-going public). Dave’s previous book, The Future of Dinosaurs (known as How Fast Could T. rex Run? in the US for reasons best understood by the publishers) was certainly a decent read, but seemed to lack some of the confidence of The Tyrannosaur Chronicles; perhaps, as a concept, it wasn’t quite as obviously solid. Happily, Uncovering Dinosaur Behaviour is Dave at his best – it’s an excellent summation of what we know, suitably caveated and yet never weighed down by that, and a surprisingly brisk read. And there’s artwork by Gabriel Ugueto, too, which is always nice. As the title suggests, Uncovering Dinosaur Behaviour is about…the behaviour of dinosaurs, as can be inferred primarily from the fossil record, but also from phylogenetic bracketing and observations of living animals. It’s a book aimed at “palaeontologists who want to know about behaviour, and…ethologists who want to know something about dinosaurs,” as well as “hopefully…of interest to biologists in general”. Dave describes his tone as “more conversational”, although I think here that translates more as ‘accessible’. This isn’t a dry textbook, but nor did I feel as if Dave was in the room with me, which is probably a good thing as he’s quite loud and I wouldn’t want to upset the neighbours. Rather, the writing here, while not necessarily being ‘chatty’ in tone, is highly succinct and moves everything along at a decent pace. There’s a skill evident here in assiduously noting where scientists might be prone to mis- or over-interpretation of evidence while not getting bogged down in that. Although already familiar with quite a lot of the material, I didn’t once feel the urge to skip anything. It gives lay people a decent impression of what the scientific process is all about in a way that’s rarer than we’d like in science writing. It’s short on bombastic claims and personal anecdotes about the Awesome Life of Dave, but very heavy on The Evidence and how we might interpret it, and I really appreciated that. Sciurumimus and Dakosaurus by Gabriel Ugueto, as featured previously on the blog. But never mind all that – what exactly is on offer here? The book’s chapters are mostly dedicated to some aspect of the lives of dinosaurs, covering Group Living, Signaling, Reproduction, Combat, and Feeding, with further chapters providing critical background information. In each case, Dave reviews what evidence has been uncovered, arguments and counter-arguments for specific interpretations, and provides a useful case study. One of the most intriguing chapters is on signaling between dinosaurs, examining the ontogeny of ceratopsians and how that supports the use of frills and horns as sociosexual signals while not necessarily supporting the ‘species recognition’ hypothesis (with Protoceratops as a special case study), the evidence for auditory signals in hadrosaurs and other dinosaurs, and how they might have used colour – including the use of colour as an anti-signal to provide camouflage (in the case of Psittacosaurus and Borealopelta). The chapter on feeding is also particularly interesting, covering the obvious wealth of research into theropod habits, but also featuring a case study on sauropods that succinctly summarises the back-and-forth debates on their feeding habits – whether certain animals were high grazers, low grazers, browsers, or some combination. Everything from their skulls and teeth, to their cervical vertebrae, to their forelimbs, to the types of environments they lived in, to possible extant analogues (and their validity) is discussed and, as throughout, heavily referenced. As is so often the case in this book, it provides a really useful summation of the debate for an interested lay person. One couldn’t call Dave unbiased (because it’s essentially impossible to be unbiased, no matter how hard you try), but Uncovering Dinosaur Behaviour really excels at presenting the current scientific state of play. Majungasaurus and Simosuchus by Gabriel Ugeuto, as also featured previously on the blog. Hey, he’s been interviewed twice for our podcast, you know. Go and check it out! Another, perhaps surprising but very welcome aspect of this book is how much it can teach the unsuspecting reader about extant animal behaviour and the evolutionary mechanisms that might be behind it. This is very far from the sort of book that says ‘dinosaurs found in mass bonebed, therefore group living animals’ (something that Dave naturally addresses directly), but discusses the often surprising and seemingly contradictory behaviours of living animals and considers how they might apply to dinosaurs, based on the direct evidence we have about them. Again, that’s something I really appreciated. Uncovering Dinosaur Behaviour, much as it’s a serious work, is still a great read and something I really think you’d all enjoy. It’s so comprehensive that I can’t help but feel that I’m underselling it here, and always remains compelling. Unrelated as it is to the quality of this book, it does make me wonder what a less serious, more autobiographical Dave Hone book might look like. Maybe we’ll see it one of these days – here’s hoping (it could be entitled The Awesome Life of Dave). For now, I’m quite content to enjoy books like this one. You know you want to share this post.FacebookTwitterRedditEmail Related Dave HoneGabriel Ugueto 1 Comment By Marc Vincent Marc Vincent You Might Also Like Boy, Were We Wrong About Dinosaurs! – review November 28, 2018 A Disarray of Palaeoart: Marc’s review July 25, 2018 The Palaeoartist’s Handbook – Marc’s review February 27, 2019 1 Comment Reply Uncovering Dinosaur Behaviour | Dave Hone's Archosaur Musings November 5, 2024 at 3:02 am […] healthy discount code which at the time of writing I think is still good to use. I’ve already had one glowing review from Marc Vincent of Love in the Time of Chasmosaurus so check that out if you need […] Leave a ReplyCancel reply document.addEventListener('DOMContentLoaded', function () { var commentForms = document.getElementsByClassName('jetpack_remote_comment'); for (var i = 0; i < commentForms.length; i++) { commentForms[i].allowTransparency = false; commentForms[i].scrolling = 'no'; } }); This site uses Akismet to reduce spam. Learn how your comment data is processed."
