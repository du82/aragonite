full_description = "Vintage Dinosaur Art: Dinosaurs (Ladybird Square books) Vintage Dinosaur Art January 28, 2025 Say “Ladybird dinosaur book” to someone, and they’ll very likely think of the book illustrated by Bernard Robinson that was reprinted a number of times and spanned the childhoods of multiple generations. (Well, at least two.) I reviewed it all the way back in 2011, so perhaps my review is now as nostalgic for some people as Ladybird books are for others. (Nah, just kidding. I’m not so deluded.) Robinson’s illustrations, while technically superb and highly memorable, were looking rather… Continue Reading 4 Comments By Marc Vincent Vintage Dinosaur Art: Hubrecht at the Lyceum – Part 1 Vintage Dinosaur Art December 11, 2024 Once again: Marie Hubrecht. Are you tired of me talking about Marie Hubrecht yet? Because I’m not done. If you want more Hubrecht, check out my reviews of Verdwenen Werelden here, here and here, and our Verdwenen Werelden podcast episode here! This post is a direct companion to my last one, in which I detail the time I went to see the spectacular murals she made in the 1920s at the former Girls’ Lyceum in Amsterdam. These paintings have been… Continue Reading 5 Comments By Gemma Hazeborg Vintage Dinosaur Art: The Corridor of Life Vintage Dinosaur Art August 28, 2024 The palaeontologist Dr William Elgin Swinton (W E Swinton to you) is perhaps best known, in the context of popular books about dinosaurs at least, for works published by the Natural History Museum (or the British Museum (Natural History) as it then properly was) that featured artwork by Neave Parker. I reviewed such a book back in 2011, a rather dry affair filled with strange ideas that must have seemed a little outdated even at the time. However, it’d be… Continue Reading 2 Comments By Marc Vincent Vintage Dinosaur Art: How to Keep Dinosaurs – Part 2 Vintage Dinosaur Art June 8, 2023 Time for another round of How to Keep Dinosaurs, a book written by Robert Mash in 1983 that would prove very handy for anyone who might find themselves stuck in a James Gurney-esque fantasy world. For those who missed the first post, the 1983 edition features a series of really quite charming colour illustrations by Diz Wallis and Philip Hood, with monochrome cartoons provided by William Rushton. This is in contrast with the more common 2003 version, which just featured… Continue Reading 1 Comment By Marc Vincent"
