full_description = "Vintage Dinosaur Art: Dinosaurs (Ladybird Square books) Vintage Dinosaur Art January 28, 2025 Say “Ladybird dinosaur book” to someone, and they’ll very likely think of the book illustrated by Bernard Robinson that was reprinted a number of times and spanned the childhoods of multiple generations. (Well, at least two.) I reviewed it all the way back in 2011, so perhaps my review is now as nostalgic for some people as Ladybird books are for others. (Nah, just kidding. I’m not so deluded.) Robinson’s illustrations, while technically superb and highly memorable, were looking rather… Continue Reading 4 Comments By Marc Vincent Vintage Dinosaur Art: Dinosaur (DK Revealed) Vintage Dinosaur Art November 28, 2024 Regular readers (we have some, right?) will be aware that our sole criterion for a book’s inclusion in Vintage (=Old) Dinosaur Art is that it be 20 years old. Consequently, books from the early 2000s have now entered our purview. It was a time when, in the wake of Walking With Dinosaurs, publishers demanded increasing numbers of CG creations in lieu of more traditional illustrations and model photography. Dorling Kindersley (aka DK) very much followed this trend, inserting very dodgy… Continue Reading 1 Comment By Marc Vincent Podcast Show Notes: Episode 35 – Snowball and the Raptor Boys Podcast Show Notes June 30, 2024 We’ve had a month off, but the famous LITC podcast is back in full strength with more fresh news, nostalgic art reviews and exciting interviews! After discussing the new films and documentaries that are coming our way, we review some very English palaeoart from the late 1970s by the unsung Peter Snowball. After that, Natee and Marc interview the Golden Boys of Dromaeosaurs, 3D sculptor Ruadhrí Brennan and returning LITC interviewee Jed Taylor, whose incredible Velociraptor sculpts have set last… Continue Reading 2 Comments By Gemma Hazeborg Vintage Dinosaur Art: The World’s Wonderful Creatures Vintage Dinosaur Art February 12, 2024 When looking at books from the years BT (Before T’internet), we must of course always bear in mind that decent reference material was rather difficult to come by, especially for your average jobbing illustrator without privileged access to museums and/or scientists. (And even then, the scientists sometimes just didn’t give a toss.) This explains the proliferation of Knight, Burian, and Zallinger clones – what else were the poor artists supposed to do, if not take inspiration from the greats? Nevertheless,… Continue Reading 13 Comments By Marc Vincent"
