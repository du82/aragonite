full_description = "Vintage Dinosaur Art: Dinosaurs (Ladybird Square books) Vintage Dinosaur Art January 28, 2025 Say “Ladybird dinosaur book” to someone, and they’ll very likely think of the book illustrated by Bernard Robinson that was reprinted a number of times and spanned the childhoods of multiple generations. (Well, at least two.) I reviewed it all the way back in 2011, so perhaps my review is now as nostalgic for some people as Ladybird books are for others. (Nah, just kidding. I’m not so deluded.) Robinson’s illustrations, while technically superb and highly memorable, were looking rather… Continue Reading 4 Comments By Marc Vincent Vintage Dinosaur Art: Dinosaur Lives Uncategorized Vintage Dinosaur Art December 10, 2020 While old dinosaur books are a finite resource, as this blog grinds inexorably on – as years become decades, as countless sentient beings live, die and are consigned to oblivion by the unfeeling laws of an immeasurably vast universe, as my bones weary and ache and my teeth develop irritating, expensive faults – so we are able to increase the scope of our Vintage Dinosaur Art posts. Our sole criterion has always been that the books we cover should be… Continue Reading 3 Comments By Marc Vincent"
