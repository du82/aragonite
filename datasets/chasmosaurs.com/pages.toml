full_description = "Podcast Show Notes: Episode 38 – Thomas Thiemeyer and the Triceratops Herd Podcast Show Notes February 26, 2025 After months of technical mishaps, we finally managed to get the podcast back up and running! Marc, Gemma and Natee start off by having a little moan about terrible dinosaur movies before moving into a fun German book Gemma found at a school! We got some typical late 80s fare, with some very unusual depictions of dinosaurs… Then, Gemma and Marc interview Yasmin Grooters, head of the dinosaur lab at Naturalis Leiden, who recently finished work on a whole herd… Continue Reading 2 Comments By Gemma Hazeborg Podcast Show Notes: Episode 37 – Farewell TetZooCon Conference Podcast Show Notes October 30, 2024 As every year, Marc, Natee and Gemma visited TetZooCon, Darren Naish’ big annual London event about animals, palaeontology, palaeoart and all things tetrapod. And this was a special edition indeed. Not only has this been the last ever edition of the Tetrapod Zoology Conference in its current form (more on which on the show) but we actually gave a talk this time! And what’s more, the talk has been recorded and is included in full on this very special, extra… Continue Reading 3 Comments By Gemma Hazeborg Podcast Show Notes: Episode 36 – Sean Rubin and Tudor Humphries Podcast Show Notes August 31, 2024 Rise and shine, the LITC podcast is here again! We have some colourful and pretty gnarly palaeoart to show you from the spectacularly-named Tudor Humphries. For the interview, Marc and Natee discuss the lovely – and somewhat controversial – book The Iguanodon’s Horn, with its author and illustrator, the award-winning Sean Rubin. Is making fun of outdated palaeoart tropes fair game? Will we keep comparing dinosaurs to fish? Why is there a tiger in Africa? Will Natee finally admit that… Continue Reading 3 Comments By Gemma Hazeborg Podcast Show Notes: Episode 35 – Snowball and the Raptor Boys Podcast Show Notes June 30, 2024 We’ve had a month off, but the famous LITC podcast is back in full strength with more fresh news, nostalgic art reviews and exciting interviews! After discussing the new films and documentaries that are coming our way, we review some very English palaeoart from the late 1970s by the unsung Peter Snowball. After that, Natee and Marc interview the Golden Boys of Dromaeosaurs, 3D sculptor Ruadhrí Brennan and returning LITC interviewee Jed Taylor, whose incredible Velociraptor sculpts have set last… Continue Reading 2 Comments By Gemma Hazeborg"
