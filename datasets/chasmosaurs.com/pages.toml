eviews of Verdwenen Werelden here, here and here, and our Verdwenen Werelden podcast episode here! This post is a direct companion to my last one, in which I detail the time I went to see the spectacular murals she made in the 1920s at the former Girls’ Lyceum in Amsterdam. These paintings have been… Continue Reading 5 Comments By Gemma Hazeborg"
