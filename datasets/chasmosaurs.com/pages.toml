full_description = "Podcast Show Notes: Episode 37 – Farewell TetZooCon Conference Podcast Show Notes October 30, 2024 As every year, Marc, Natee and Gemma visited TetZooCon, Darren Naish’ big annual London event about animals, palaeontology, palaeoart and all things tetrapod. And this was a special edition indeed. Not only has this been the last ever edition of the Tetrapod Zoology Conference in its current form (more on which on the show) but we actually gave a talk this time! And what’s more, the talk has been recorded and is included in full on this very special, extra… Continue Reading 3 Comments By Gemma Hazeborg Podcast Show Notes: Episode 30 – TetZooCon On Ice Conference Podcast Show Notes December 30, 2023 TetZooCon 2023 is in the bag, and of course, we were there. Join Marc, Natee and Niels as they relay their adventures, the talks, the vendors, the people, the experiences and the catastrophes of the legendary London extravaganza of zoology, palaeontology and palaeoart as it grows ever bigger. Did we all make it to the end? Who was our favourite cosplayer? Have all the Crystal Palace dinosaurs been scanned? Are we finally going to talk video games on here? Are… Continue Reading 1 Comment By Gemma Hazeborg Podcast Show Notes: Episode 29 – Life On Our Planet and Emily Stepp Podcast Show Notes November 29, 2023 Niels, Natee and Marc look forward to TetZooCon, chat about recent museum visits, and continue to shamelessly plug the new merchandise designed by The Founder, David Orr. Then, in lieu of Vintage Dinosaur Art, they – and special guest Agata Stachowiak – discuss the Netflix series Life On Our Planet, in which Morgan Freeman gravels his way through an intriguing mix of modern-day wildlife footage and CGI recreations of creatures from Deep Time. Finally, Niels and Marc discuss unlikely hybrids,… Continue Reading 0 Comments By Marc Vincent Podcast Show Notes: Episode 22 – Postcards from TetZooCon 2022 Conference Podcast Show Notes December 24, 2022 Episode 22 closes off the year 2022. Here is the yearly postcard from TetZooCon, in podcast form! The UK’s biggest event of Our People, organized by that man Naish and presumably other people, was held early December at the Bush House in London. It was a palaeo-heavy conference, with lots of dinosaur and especially pterosaur talks, the yearly palaeoart workshop, lots of attention for the Crystal Palace Dinosaurs and the launches (or re-launches) of some significant books. And this time,… Continue Reading 0 Comments By Gemma Hazeborg"
