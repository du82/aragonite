full_description = "Podcast Show Notes: Episode 38 – Thomas Thiemeyer and the Triceratops Herd Podcast Show Notes February 26, 2025 After months of technical mishaps, we finally managed to get the podcast back up and running! Marc, Gemma and Natee start off by having a little moan about terrible dinosaur movies before moving into a fun German book Gemma found at a school! We got some typical late 80s fare, with some very unusual depictions of dinosaurs… Then, Gemma and Marc interview Yasmin Grooters, head of the dinosaur lab at Naturalis Leiden, who recently finished work on a whole herd… Continue Reading 2 Comments By Gemma Hazeborg Return to Naturalis Museums January 4, 2022 It’s been over two years since I shared with you my first experience of the renovated Naturalis, the Netherlands’ premier museum of nature and natural history. My review, found here and here, was somewhat mixed, and for whatever reason (I forget the reason but I’m fairly sure there was a reason) we missed the Live Science Hall. An egregious oversight on my part, it’s true. It was for this reason that Martijn “Dinosaurus” Guliker reached out to me. He is… Continue Reading 2 Comments By Gemma Hazeborg Naturalis – Part 2 Museums December 4, 2019 Here’s part two of my big review of Naturalis Biodivesity Center, the new natural history museum in Leiden! Part one is here. Last time, we visited the stuffed animals of the Life hall and admired the mounted skeleton of Trix and other dinosaurs. I promised you I’d give you a rundown of the rest of the museum as well. This will be a dinosaur-light post, but there’s still a good few palaeontological subjects to cover. EARTH “Earth” is a deceptively… Continue Reading 2 Comments By Gemma Hazeborg Naturalis – Part 1 Museums November 25, 2019 It’s finally done: The new buildings for Naturalis Biodiversity Center, the Netherlands’ national natural history museum. Based in the city of Leiden, the museum had been under construction since 2017. The previous incarnation of Naturalis hailed from 1998, after the fusion of some older museums. It was never that heavy on dinosaurs, focusing more on living animals and plants, as well as the rather more recent history of Europe during the last ice age. Dinosaurs made some token appearances, with… Continue Reading 0 Comments By Gemma Hazeborg"
