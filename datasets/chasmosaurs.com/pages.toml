full_description = "Vintage Dinosaur Art: Dinosaurs (Home Reference Library) Vintage Dinosaur Art February 18, 2025 In my further quest to avoid the DK Encyclopedia of Dinosaurs & Prehistoric Life from 2001 (which I do now own, at least), here’s another book from around that time – Dinosaurs, published in 2002 by Fog City Press. It’s a rather generic affair all told, but I’m sure there’s someone out there for whom this is an important childhood memory. Besides which, it features illustrations by Steve Kirk and Luis Rey (among others), not to mention an interesting mix of… Continue Reading 2 Comments By Marc Vincent Vintage Dinosaur Art: Dinosaur (DK Revealed) Vintage Dinosaur Art November 28, 2024 Regular readers (we have some, right?) will be aware that our sole criterion for a book’s inclusion in Vintage (=Old) Dinosaur Art is that it be 20 years old. Consequently, books from the early 2000s have now entered our purview. It was a time when, in the wake of Walking With Dinosaurs, publishers demanded increasing numbers of CG creations in lieu of more traditional illustrations and model photography. Dorling Kindersley (aka DK) very much followed this trend, inserting very dodgy… Continue Reading 1 Comment By Marc Vincent Podcast Show Notes: Episode 34 – Maurice Wilson and Johan Egerkrans Podcast Show Notes May 3, 2024 Happy days, all! Even moreso than usual, our newest podcast episode dives into the phenomenon of stylized dinosaurs, as we discuss whimsical works from the early 70s by Maurice Wilson, whose work is all but forgotten but holds up a treat, and talk to the esteemed Johan Egerkrans whose angular, dynamic dinosaur art has captured the hearts of the palaeo world. Featuring forgotten Disney movies, exciting board games, pleasing shapes and lots of tea. How do you strike the balance… Continue Reading 0 Comments By Gemma Hazeborg Vintage Dinosaur Art: World Atlas of Dinosaurs – Part 2 Vintage Dinosaur Art February 17, 2023 Here’s part two of our tentative exploration into the early 2000s with the World Atlas of Dinosaurs. Lots of Todd Marshall and Luis Rey to discover, but also I will tell you the real reason I couldn’t resist this book when I found it. Without further ado: Here’s one half of a Tendaguru spread by Todd Marshall. It depicts ceratosaurs in a bout of speculative intraspecific combat. The animals themselves are entirely speculative; the only ceratosaur material from Tanzania is… Continue Reading 2 Comments By Gemma Hazeborg"
