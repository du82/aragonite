full_description = "Vintage Dinosaur Art: Dinosaur (DK Revealed) Vintage Dinosaur Art November 28, 2024 Regular readers (we have some, right?) will be aware that our sole criterion for a book’s inclusion in Vintage (=Old) Dinosaur Art is that it be 20 years old. Consequently, books from the early 2000s have now entered our purview. It was a time when, in the wake of Walking With Dinosaurs, publishers demanded increasing numbers of CG creations in lieu of more traditional illustrations and model photography. Dorling Kindersley (aka DK) very much followed this trend, inserting very dodgy… Continue Reading 1 Comment By Marc Vincent Vintage Dinosaur Art: The Great Dinosaur Atlas – Part 1 Vintage Dinosaur Art April 21, 2020 Back in the early 1990s, John Sibbick’s artwork for the Normanpedia (that is, 1985’s The Illustrated Encyclopedia of Dinosaurs, authored by David Norman) was simply everywhere. There was no escaping it. Pick up a magazine – Sibbick. Box of chocolate-coated biscuits – Sibbick. Breakfast cereal – Sibbick. Naturally, the ubiquity of Sibbick’s gorgeously painted, but rather idiosyncratic, illustrations from the mid-’80s resulted in a huge number of imitators and outright copycats – there was even a mysterious company apparently named… Continue Reading 5 Comments By Marc Vincent Vintage Dinosaur Art: books from the DK Action Pack Vintage Dinosaur Art August 27, 2019 Following a perusal of the ACTION PACK as a whole in my previous post, let’s now have a closer look at the two books included within. The first of these, like the pack itself (and the somewhat related Eyewitness book), is simply entitled Dinosaur, and serves as a basic primer as to what dinosaurs are all about. It also features a lot of classic model photography, which makes me Very Happy Indeed. Many of the models featured in Dinosaur (the… Continue Reading 2 Comments By Marc Vincent Vintage Dinosaur Activity Pack: Dinosaur (DK Action Pack) Book Review Illustration Vintage Dinosaur Art August 13, 2019 What began with an examination of 1994’s Eyewitness Dinosaur video has lead me to this – purchasing a children’s activity pack from eBay. Ah, but not any children’s activity pack, for this one includes warm 1990s nostalgia alongside a pop-out card model, board game and (gasp!) “five facsimile documents”. Yes, it’s the DK ACTION PACK that, in true Eyewitness style, is simply entitled Dinosaur – even if it isn’t branded up with the monochromatic all-seeing eye. My copy may have… Continue Reading 4 Comments By Marc Vincent"
