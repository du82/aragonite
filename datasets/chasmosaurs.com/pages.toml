full_description = "All aboard for 2025 Attraction Review Personal reflection December 30, 2024 Not wanting the last post of the year to be a vanilla Vintage Dinosaur Art post featuring some filler art from 20 years ago presented a conundrum. What else am I supposed to do these days? A few different ideas came to mind – a bit of personal reflection, a review of a museum or other attraction that I’d failed to post about, or a humorous comparison of ‘expert reacts’ videos regarding dinosaur media. In the end, I decided to… Continue Reading 4 Comments By Marc Vincent Vintage Dinosaur Art: The Magic School Bus in the Time of the Dinosaurs Vintage Dinosaur Art October 22, 2024 The Magic School Bus franchise was a big deal at exactly the right sort of time for it to have impacted my childhood, but it completely passed me by – probably because I’m British, and it wasn’t quite as well known here. I do have vague memories of a fantastical yellow bus (which was a bit of an alien concept – the yellow school bus, that is) that could fly through space and whatnot, but that’s about it. A shame,… Continue Reading 1 Comment By Marc Vincent Prehistoric Planet 2: Giant Paperclip TV review May 26, 2023 Whereas the first two episodes of Prehistoric Planet 2 took us to the Islands and Badlands, the final three transport the viewer to Swamps, Oceans and, er, North America. Why the sudden change of theme, to a continental locale rather than a type of habitat, in the final episode? It hardly matters, I suppose, if it means we get to see more of Prehistoric Planet‘s utterly fantastic T. rex. What’s more, in this series, I finally got what I really wanted… …That is, a… Continue Reading 0 Comments By Marc Vincent Vintage Dinosaur Art: Discovering Dinosaurs Vintage Dinosaur Art April 12, 2023 Remember the St Michael dinosaur book, published in 1978 and notably featuring quite handsomely painted illustrations by Bernard Robinson? Discovering Dinosaurs, published a decade later by Cliveden Press, was illustrated by someone who evidently had a very well-thumbed copy of the earlier tome. I say ‘someone’, because neither the illustrator nor author here are credited, which is rather surprising. Then again, given the levels of Utter Shamelessness on show here, perhaps it’s because they’d rather their names weren’t attached to this… Continue Reading 3 Comments By Marc Vincent"
