full_description = "Vintage Dinosaur Art: Hubrecht at the Lyceum – Part 1 Vintage Dinosaur Art December 11, 2024 Once again: Marie Hubrecht. Are you tired of me talking about Marie Hubrecht yet? Because I’m not done. If you want more Hubrecht, check out my reviews of Verdwenen Werelden here, here and here, and our Verdwenen Werelden podcast episode here! This post is a direct companion to my last one, in which I detail the time I went to see the spectacular murals she made in the 1920s at the former Girls’ Lyceum in Amsterdam. These paintings have been… Continue Reading 5 Comments By Gemma Hazeborg Vintage Dinosaur Art: Tiere der Urwelt (Reichardt) – Part 3 Vintage Dinosaur Art February 4, 2024 We’re back with more German dinosaur cards from the Reichardt cocoa company! In parts one and two, we discussed two series of 1900s illustrations by one F. John. In the late 1910s, Reichardt once again hit the market with collectible cards themed to extinct animals. Incidentally, after Series 1 and Series 2, the third series was numbered Series 1a, because that’s what makes the most sense. The original featured artist, F. John, was, not to put too fine a point… Continue Reading 4 Comments By Gemma Hazeborg Vintage Dinosaur Art: Extinct Monsters and Creatures of Other Days – Part 2 Vintage Dinosaur Art August 29, 2023 A while ago we had a look at Extinct Monsters, a book from 1892 by H. N. Hutchinson and illustrated by Joseph Smit. Now, we’re going all the way to 1910 for the the new, revised, expanded edition of Extinct Monsters by the same author, that reflects almost two decades of scientific discovery. This new version of the book is the one that has the awesome extended title “…and Creatures of Other Days“. The ageing Joseph Smit, Dutchman in England,… Continue Reading 6 Comments By Gemma Hazeborg Vintage Dinosaur Art: In The Presence of Dinosaurs – Part 2 Vintage Dinosaur Art July 21, 2023 So here I am once more, in the playground of the finer arts. This is the 21st century, and we’re looking at one of the definitive dinosaur books of the year 2000, illustrated or rather painted by the talented Larry Felder. If you’ve seen part one, you’ll know Larry’s depictions of Triassic and Jurassic creatures was, gorgeous though they may have been, somewhat indebted to Walking With Dinosaurs. In the Cretaceous chapters of In The Presence of Dinosaurs, his work… Continue Reading 8 Comments By Gemma Hazeborg"
