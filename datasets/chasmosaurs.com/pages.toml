title = "Vintage Dinosaur Art: The Dinosaur Action Set (Book One!) – Love in the Time of Chasmosaurs"
description = "Today’s entry is rather similar in concept to the later Dinosaur Park, which I reviewed back in 2020, but quite unlike the DK ACTION PACK (in spite of the rather similar title). It would appe…"
full_description = "Vintage Dinosaur Art: The Dinosaur Action Set (Book One!) Vintage Dinosaur Art September 17, 2024 Today’s entry is rather similar in concept to the later Dinosaur Park, which I reviewed back in 2020, but quite unlike the DK ACTION PACK (in spite of the rather similar title). It would appear to be a straightforward book at first glance, but upon opening an instruction is immediately given to prise out the staples and then remove all the pages. What’s this, a book that wants you to destroy it?! Of course not – well, sort of, actually, but the idea is that we end up with an adorable card diorama into which we can insert assorted pop-out prehistoric beasties. It’s hours of fiddly fun! The Dinosaur Action Set (Book One! Of one, seemingly) was published in 1987 (the year I was born!) by Price Stern Sloan Ltd, written by Malcolm Whyte, and designed and illustrated by Daniel Smith. Smith’s rather ubiquitous name makes finding anything about him online a right pain in the arse, so I’d welcome any and all information our readers are able to provide about him. He’s an excellent artist, even if the reconstructions here are notably retro-looking for 1987, drawing variously on Burian, Zallinger and Neave Parker. I do love that cover, though, combining a classic face-off between Tyrannosaurus and Triceratops with bold rockface lettering that evokes pulpy cavemen movies (and a bit of Indiana Jones on the side). The pose of the T. rex here is somewhat reminiscent of the animatronics featured on the Disneyland railroad and (defunct) Universe of Energy ride at Epcot. Pulling out all the pages reveals parts of the diorama scene (which have to be stitched together with tape) alongside sheets of card with pop-out dinosaurs. These are a little bit flimsier than they perhaps should have been – the tabs on the more 3D creatures (like Allosaurus, seen above) are difficult to insert as they bend easily, and it’s easy to tear the more delicate parts, like Stegosaurus‘ tail spines. On the other hand, it might just be me – I did manage to decapitate the ornithomimosaur, after all. The above photo also shows the booklet filled with FASCINATING DINOSAUR FACTS. These are mostly accurate. Mostly. The diorama consists of four parts, which I had great fun haphazardly sticking together (Christmas presents from me are never particularly aesthetically pleasing). It’s seemingly a journey through time akin to the Age of Reptiles mural or the Invicta posters, with Triassic animals giving way to a Parker-alike Megalosaurus and wallowing brachiosaur, then a Pteranodon and (also Parker-alike) Iguanodon in the wrong order. If you’re wondering about the big orange disc atop the volcano, it’s something that one is instructed to stick there and then spin around as an action feature. We didn’t have all your modern technology back then, you know, we had to make our own fun. One can certainly attempt an Age of Reptiles-style March Through The Mesozoic, but there isn’t a great deal of room for the pop-up dinosaurs within the diorama. (Also, the background creatures spoil it a bit.) In the above photo, a very Zallingeresque Plateosaurus gives way to a classic super-hump-backed Stegosaurus, Bakkerian Deinonychus and a Triceratops that looks a bit like a mutant toad, as it frequently did in mid-20th-century art. You’ll note that only one half of the pop-out dinosaurs has been printed in colour – the book suggests that we colour in the other side ourselves, but I really can’t imagine that many people being bothered. I’m happy to make do with Triceratops having half-white horns, myself. Although some of the dinosaurs are nice and muscular and none are excessively ‘reptilian’ in appearance, these are still rather dated reconstructions for the time, even when compared with quite widely-known 1970s palaeoart by the likes of Peter Snowball. Still, I can imagine plenty of kids still lapping this up, even if the art might have bothered them a little bit (I might have noticed how old-school it was had it landed on my lap in, say, 1993). Edmontosaurus (here going by “Anatosaurus“, as it was wont to do) might as well have walked out of a Charles Knight painting, but at least T. rex looks reasonably dynamic, and it even comes with a hinged jaw…that’s really awkward to insert properly. Even Agata had trouble with it, and she’s really good at all this fiddly crafty stuff. Perhaps the most retro of all the reconstructions is the above Brontosaurus, which is a pop-out consisting of just a neck and shoulders. Even in 1987, and in spite of being referred to as “Apatosaurus, also known as Brontosaurus” by Whyte, it’s a swamp-dwelling dullard slurping mushy plants into its big, square, camarasaur-looking head. Stick it in front of the wallowing brachiosaur and Neave Parker-style skulking theropod, and you’ve got a palaeoart scene straight out of the 1960s, or even earlier. Still, you’ve got to appreciate the sheer number and variety of creatures on offer here, which even include pre-dinosaur beasts like Dimetrodon, Edaphosaurus and Cynognathus, alongside dinosaurs you might not necessarily expect, like Heterodontosaurus. Not that it’s particularly obvious that it’s Heterodontosaurus – it’s the pin-headed, gangly little fellow in the bottom right of the above photo, if you were wondering. Still, the variety is to be commended, as is the inclusion of pop-out plants (authentically prehistoric!) to stick in between the animals in your diorama. There’s even a wee Archaeopteryx in a bush! I know that our very own Natee has fond memories of this, er, book, and I can see why – although the reconstructions are rather dated, assembling the diorama and populating it with card creatures is still quite good fun, and allows for a degree of creativity that simply isn’t present in straightforward illustrated dinosaur books. It’s one step removed from arranging dinosaur toys in the garden (which is something that I definitely did as a child, oh yes). It’s sweetly nostalgic and very endearing, even if the end result is a messy pile of paper dinosaurs that I really don’t want to throw away… You know you want to share this post.FacebookTwitterRedditEmail Related 1980sallosaurusAnachronism stewAnkylosaurusBrachiosaurusBrontosauruscoelophysisCynognathusDaniel SmithDeinonychusDimetrodonEdaphosaurusedmontosaurusHeterodontosaurusIguanodonMegalosaurusPlateosaurusPop-upStegosaurusTriceratopstyrannosaurus 3 Comments By Marc Vincent Marc Vincent You Might Also Like Vintage Dinosaur Art: Dinosaur Lives December 10, 2020 Vintage Dinosaur Art: The World of Dinosaurs – Part 1 August 1, 2022 Vintage Dinosaur Art: Giant Dinosaurs August 23, 2023 3 Comments Reply CityRaptor October 4, 2024 at 1:20 pm There is indeed a second Dinosaur Action Set which is called, duh, “The Second Dinosaur Action Set”. It can connect with the first one to form a larger Diorama. There is also an “Undersea Dinosaur Action Set” ( it’s really more of a preshistoric sea creatured action set, with animals from the whole Phanerozoic ) and a “Prehistoric Mammals Action Set” You also assembled the volcano wrong. The wheel goes behind. Reply Grant Harding October 17, 2024 at 8:09 pm This would make a nice backdrop for taking photos of your dinosaur toys. Reply Dino Dad Reviews January 16, 2025 at 8:18 pm Oh my goodness, I had this one when I was little! If I remember right, I think it was a German couple (or maybe they were Swiss?) that lived down the street from us gave it to me as a present. Wow, seeing these really takes me back! Growing up with Disneyland nearby, I had always assumed the Brontosaurus was a reference to the ones that can be seen on the Disneyland Railroad, but I don’t know how likely that is, however similar they may appear. (See here: https://www.disneyphotoblography.com/2017/09/dinosaur-railroad.html ) Leave a ReplyCancel reply document.addEventListener('DOMContentLoaded', function () { var commentForms = document.getElementsByClassName('jetpack_remote_comment'); for (var i = 0; i < commentForms.length; i++) { commentForms[i].allowTransparency = false; commentForms[i].scrolling = 'no'; } }); This site uses Akismet to reduce spam. Learn how your comment data is processed."
