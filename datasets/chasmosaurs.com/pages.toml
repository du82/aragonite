full_description = "Vintage Dinosaur Art: Oxford First Book of Dinosaurs Vintage Dinosaur Art January 17, 2025 As the sort of unremarkable kids’ book that you might find buried in a stack at a charity shop, looking a little forlorn (but I found on eBay, of course), you might not expect too much from the Oxford First Book of Dinosaurs (part of a series that included further volumes on animals, art, maths, science, and space). As you’ve no doubt guessed, it uses a lot of art recycled from earlier books. Ah, but in this case, it’s a… Continue Reading 4 Comments By Marc Vincent Vintage Dinosaur Art: Utahraptor: The Deadliest Dinosaur Vintage Dinosaur Art December 13, 2022 As Don and Donna Month draws to a close, what better way to end this series of reviews than with the meanest, baddest, freshest dinosaur of the mid-to-late-nineties? It’s easy to take for granted these days, but back then, the newly-described Utahraptor was a pretty big deal. It was a case of life imitating art. Here we had what was, seemingly, a dead ringer for those oversized movie raptors, except released into the world only months after that movie came… Continue Reading 2 Comments By Gemma Hazeborg This Mesozoic Month: June 2020 This Mesozoic Month June 30, 2020 Halfway through 2020, and it’s time for another This Mesozoic Month roundup of news, writing, art, and merch. I’d like to take a moment to express my gratitude to all of the museum workers who have been so hard hit as this pandemic and its attendant financial crisis continue. Museums are basically a house of worship for me, and the work you all do matters so much. My deepest hope is that the pandemic will be brought to an end… Continue Reading 2 Comments By David Orr This Mesozoic Month: March 2020 This Mesozoic Month March 31, 2020 Stay safe. Stay at home, as best you can. Look out for each other. Flatten the curve. With that said, let’s look back at March 2020 in Mesozoic paleontology. In the News The world lost a paleontology giant this month as Dr. Jenny Clack, master of early tetrapods, passed away. Read Darren Naish’s wonderful tribute. Did non-avian dinosaurs glow? Spurred by a twitter conversation, Darren Naish, Cary Woodruff, and Jamie Dunning explore the possibility in Historical Biology [PDF link]. Read… Continue Reading 6 Comments By David Orr"
