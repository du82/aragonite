full_description = "Vintage Dinosaur Art: Dinosaurs (Home Reference Library) Vintage Dinosaur Art February 18, 2025 In my further quest to avoid the DK Encyclopedia of Dinosaurs & Prehistoric Life from 2001 (which I do now own, at least), here’s another book from around that time – Dinosaurs, published in 2002 by Fog City Press. It’s a rather generic affair all told, but I’m sure there’s someone out there for whom this is an important childhood memory. Besides which, it features illustrations by Steve Kirk and Luis Rey (among others), not to mention an interesting mix of… Continue Reading 2 Comments By Marc Vincent Vintage Dinosaur Art: The Giant Book of Dinosaurs – Part 1 Vintage Dinosaur Art February 3, 2021 Given that dinosaurs are so notorious in the popular imagination for having grown Very Large far more often than they had any right to, it’s only fitting that so many dinosaur books – especially those aimed at children – have adopted a correspondingly chunky, oversized format. The appeal is obvious, even if it means that the bloody things simply refuse to squeeze under my scanner. The Giant Book of Dinosaurs is around 24.5cm wide and 34.5cm tall – big enough… Continue Reading 0 Comments By Marc Vincent Vintage Dinosaur Media: Dinosaurs! The Multimedia Encyclopedia – Part 2 Vintage Dinosaur Art July 18, 2020 I’m going to show you some more of Dinosaurs! The Multimedia Encyclopedia. Since I shared the first part last week, there has been no shortage of you guys telling me about the dinosaur computer progams and games you used to have back when CD-Rom was a thing. Unsurpisingly, there were far more dinosaur-centered computer programs and video games around at that time (1993 – the year of Jurassic Park), many of which might be worth looking into someday… if any… Continue Reading 7 Comments By Gemma Hazeborg Vintage Dinosaur Art: A Field Guide to Dinosaurs – Part 1 Vintage Dinosaur Art November 5, 2019 As someone who reads this blog (hopefully on a regular basis), you’re no doubt familiar with Greg Paul’s Princeton Field Guide to Dinosaurs (aka Dinosaurs: a Field Guide), first published in 2010 with a second edition arriving in 2016. It’s arguably one of the most significant popular books about dinosaurs written this century, an attempt to catalogue dinosaur diversity in (almost) its entirety, complete with copious illustrations. Such a feat hasn’t been attempted too many times in the past (because… Continue Reading 9 Comments By Marc Vincent"
