full_description = "Vintage Dinosaur Art: Oxford First Book of Dinosaurs Vintage Dinosaur Art January 17, 2025 As the sort of unremarkable kids’ book that you might find buried in a stack at a charity shop, looking a little forlorn (but I found on eBay, of course), you might not expect too much from the Oxford First Book of Dinosaurs (part of a series that included further volumes on animals, art, maths, science, and space). As you’ve no doubt guessed, it uses a lot of art recycled from earlier books. Ah, but in this case, it’s a lot of Steve Kirk art, and we do like a bit of Kirk around here, having featured his work numerous times before. Indeed, some of the illustrations in this book have featured on the blog before, but, happily, not all of them. Best get on with it, then! As a book first published in 2001 (with this edition arriving in 2003), there’s plenty of ’90s goodness to discover. I should probably mention at this point that the cover is, er, not by Kirk. In fact, this extremely snazzily spotted Styracosaurus is the work of illustrator Chris Brown, although it is somewhat reminiscent of Kirk’s cover art for Dinosaurs – Giants of the Earth, with a bit of Sibbickian chunkiness mixed in. It could well be a complete coincidence, of course; a confrontational Styracosaurus is a pretty obvious choice for a suitably striking cover. (Incidentally, Kirk’s version appears as a small illustration inside.) It’s of its time in many respects, although I do really appreciate the vibrant patterning, an aspect of this illustration that does greatly depart from the otherwise vintage-Sibbick-like reconstruction of the animal. It’s not quite the first dinosaur to appear in the book, but Kirk’s Allosaurus is an excellent choice for grabbing the reader’s attention alongside the introductory text. What is a dinosaur? The answer: this is one, and it’s pretty bloody impressive, even if it looks a little like it’s merrily prancing along, possibly while singing a jaunty music hall number. It’s clearly based on the Allosaurus mount that menaces Barosaurus in the AMNH’s entrance hall, as photographed from a slightly obscure angle. Kirk’s execution of the reconstruction from said angle is really very good; clearly he was well used to painting these things by this time. I also really like the subtle, but intriguing and very believable skin colouration and countershading, not to mention that extremely dashing racing stripe down the animal’s flank (and face). When Allosaurus pops up in a book like this, you just know that T. rex will be lurking just over the page and, indeed, here he is. There’s something awfully familiar-looking about this reconstruction – it might be based on another skeletal mount, although I can’t place it just now. The arms are somewhat reminiscent of the original mount of AMNH 5027 (at least, after it was given actual tyrannosaur arms), as well as certain models of Tyrannosaurus. Regardless, this illustration holds up pretty well even now, with the exception of the arms and a few other small details (perhaps the tail should be beefier); the impression is effectively given of a massive, bulky creature that’s nevertheless taking a birdlike step forward, the right leg swinging in towards the midline of the body. It even appears to have lips. Everyone likes lips on tyrannosaurs, right? The dead edmontosaur on the ground is a nice touch (and both animals have, once again, quite beautiful colour schemes that I hope someone pinches for a scale model), but more intriguing is the creature in the background, which appears to be a juvenile Tyrannosaurus. If anyone has the book that this originally appeared in, I’d love to know if it’s mentioned as such, or gets labelled Nanotyrannus instead. Tyrannosaurus pops up again in this book (of course), but rather strangely the second illustration isn’t a Kirk piece – instead, it’s a rather retro reconstruction by Terry Riley. We’ve featured a single Riley-illustrated book here before (The Amazing World of Dinosaurs from 1981), and while the tyrannosaur here is an improvement over the one in that book, it still appears to be straight from the early 1980s at the latest. Its upright posture and skull that eschews certain details of the real thing make it stand out among the horde of very carefully observed Kirk pieces; one has to wonder why the publisher included it. Cool-looking feet, though. I’m all about those tyrannosaur feet. Back to Kirk’s work, and here’s an Acrocanthosaurus that follows in the ’90s tradition of making carcharodontosaurs look rather daintier than they perhaps should be, likely because they simply weren’t as well known at the time. In fact, this reconstruction almost looks like it could be a juvenile, with lankier limbs and neural spines that aren’t as pronounced as an adult’s. At least the head’s pretty decent, by no means a given for ’90s reconstructions – who remembers that Carnegie Collection model? That was actually from 2001… Of course, we’re really all here for curly-armed, scaly ’90s dromaeosaurs in all their nostalgia-tastic glory, and this book doesn’t disappoint. Kirk’s Utahraptor has evolved beyond its earlier, more stubby-headed incarnation, looking far more refined but still sporting absolutely honkin’ massive claws on all of its limbs, a natty red-and-black colour scheme, and a highly disdainful expression. Meanwhile, the wonderfully spotty Velociraptor is utterly adorable and I just want to scoop it up and give it a big wet slobbery kiss, while Deinonychus is obviously based on that AMNH mount that only looks good from certain angles. All or Kirk’s dromaeosaurs have a decent amount of flesh on their fingers, in addition to, er, carpal scutes that make them look a little like feet; a very popular trope in the ’80s and ’90s. Greg Paul might be responsible for popularising the finger-scute look, but you’ll note that he was already feathering his dromaeosaurs in the 1980s. This ‘dromeosaur family portrait’ piece is a little like the famous Sibbick piece that appeared in the Normanpedia, except Utahraptor is in (hadn’t been discovered in 1985) and Dromaeosaurus is out. And Deinonychus doesn’t have a disturbing, probing aye-aye finger of saggy Bakker-inspired neck. And Baryonyx is mentioned, for some reason, even though it had been well established by this point that it had nothing to do with dromaeosaurs, and its large claw was on its hand rather than its foot. But I digress. Those of you missing Dromaeosaurus needn’t look far… …for here it is, as scaly and stripy as all the rest. I love it. Again, you’ll note Kirk’s careful attention to detail in giving it a boxy skull. It’s wonderful to see a Dromaeosaurus illustration from this era that isn’t just a Sibbick clone. Deinonychus pops up again in a scene depicting it attacking Tenontosaurus (of course), and it’s in that AMNH-like leaping pose once more. A well-executed piece, even if that leg looks a little uncomfortably straight to me, and the fingers seem to have better padding than the toes. Never mind – I mostly wanted to include this page to point out that they used a photo of Jurassic Park Velociraptor puppets to illustrate the actual Velociraptor, with absolutely no mention of the film or how Velociraptor didn’t actually look like that. Steve Kirk’s Velociraptor appeared a couple of pages prior, for crying out loud! (Cool photo, mind you. Give me those over a rubbish CG ‘Blue’ any day.) Dromaeosaurs aren’t the only maniraptorans to appear in this book in a scaly ’90s stylee, for Oviraptor is here too. Or rather, it isn’t, for you see the animal on the left appears to be based on a specimen that’s now regarded as being closer to Citipati (if not belonging in Citipati), while the one on the right has been split from Oviraptor and goes by the name Rinchenia mongoliensis these days. Still, at the time, these were both Oviraptor – and now neither of them is! That’s part of what makes this such a wonderful period piece, along with the scaliness of the animals, of course. As with Wayne Barlowe’s Oviraptor, the authentically birdlike reconstruction of these animals (complete with arms folded rather like wings) makes them appear disconcertingly ‘plucked’, a testament to the skill of the artist. Love the keratin layers on the animals’ crests, too (especially Rinchenia). And finally…because I’ve just been featuring theropods (hey, it’s not my fault that they’re the best dinosaurs, and also that pieces featuring other animals have appeared on the blog before), here’s a lovely little illustration depicting Orodromeus and its young. A beautifully painted, peaceful scene, without a bug-eyed bastard Stenonychosaurus in sight. I do really appreciate that the baby Orodromeus are coloured differently to the adult, along with the low-down perspective that gives us an Orodromeus‘ eye view of the scene, making it that bit more immersive. It all makes me wish that more companies made wee scale model thescelosaurs… You know you want to share this post.FacebookTwitterRedditEmail Related 2000sacrocanthosaurusallosaurusChris BrownDeinonychusDromaeosaurusOrodromeusoviraptorSteve KirkStyracosaurusTerry Rileytyrannosaurusutahraptorvelociraptor 4 Comments By Marc Vincent Marc Vincent You Might Also Like Vintage Dinosaur Art: The Giant Book of Dinosaurs – Part 1 February 3, 2021 Vintage Dinosaur Art: George Solonevich May 2, 2022 Vintage Dinosaur Art: The World’s Wonderful Creatures February 12, 2024 4 Comments Reply Grant Harding January 18, 2025 at 12:46 pm Man, I love Steve Kirk’s work. Is he still extant? You should try to interview him for the podcast! I’m pretty sure that the leaping Deinonychus is based on a mount at YPM, not at AMNH. Reply Marc Vincent January 19, 2025 at 11:00 am Yes, you’re right. Duh. In my defence I’ve only been to the AMNH out of the two, so it’s obviously more prominent in my mind. Reply Brad Ocharuk January 18, 2025 at 9:24 pm The Kirk T. rex reminds me of the Dinamation animatronic. Reply paleocharley February 20, 2025 at 5:03 am Thanks for the usual great review, Marc! Yet another book that I just HAD to order based on your recommendation. I just received my copy the other day, and I’m pleased with the book itself. It’s the 2001 edition, with Rexy on the cover. There are some cosmetic problems- the plastic cover that the dust jacket has a HUGE chuck torn off from the cover and the binding used way too much glue for several pages, but the worse is that it’s an ex-library book. Now, I don’t mind library books, in fact, I sort of like them, especially when they are from Somewhere that I will never visit. But this one commits TWO cardinal sins in my book: the library stamps have been removed or marked out causing damage to the book at a couple of spots. and the security strip was pasted in the middle of one of double-page spreads. Sorry for the rant. Hope you will post a second part. – CFL Leave a ReplyCancel reply document.addEventListener('DOMContentLoaded', function () { var commentForms = document.getElementsByClassName('jetpack_remote_comment'); for (var i = 0; i < commentForms.length; i++) { commentForms[i].allowTransparency = false; commentForms[i].scrolling = 'no'; } }); This site uses Akismet to reduce spam. Learn how your comment data is processed."
