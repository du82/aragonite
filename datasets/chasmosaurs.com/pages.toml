full_description = "Vintage Dinosaur Art: Oxford First Book of Dinosaurs Vintage Dinosaur Art January 17, 2025 As the sort of unremarkable kids’ book that you might find buried in a stack at a charity shop, looking a little forlorn (but I found on eBay, of course), you might not expect too much from the Oxford First Book of Dinosaurs (part of a series that included further volumes on animals, art, maths, science, and space). As you’ve no doubt guessed, it uses a lot of art recycled from earlier books. Ah, but in this case, it’s a… Continue Reading 4 Comments By Marc Vincent Vintage Dinosaur Art: Oviraptor (Dinosaur books from The Child’s World) Vintage Dinosaur Art June 6, 2024 One month on from the last entry, here’s another slice of the early ’90s dinosaur book series from The Child’s World, this time featuring everyone’s favourite misunderstood, misnamed, cassowary-casqued* weirdo, Oviraptor. Diana Magnuson, who illustrated the Megalosaurus book, also provided the artwork here. In the main, it’s a considerable improvement over her work on Megalosaurus, although that might have been because up-to-the-minute reference material and illustrations of Megalosaurus were hard to come by at the time, while Oviraptor was enjoying… Continue Reading 0 Comments By Marc Vincent Vintage Dinosaur Art: On the Trail of the Dinosaurs – Part 2 Vintage Dinosaur Art August 21, 2022 We’re back on the trail of the dinosaurs with Mike Benton and Graham Rosewarne, two giants of the extremely niche genre of Popular British Dino Rennaissance Books (always well-represented on these pages). Last time, we looked mostly at Rosewarne’s panoramic compositions and found ourselves maybe a bit less than extremely impressed. But Rosewarne is at his best when drawing dinosaur profiles, and fortunately, this book allows him to do plenty of that. One of Rosewarne’s most famous and well-remembered creations… Continue Reading 1 Comment By Gemma Hazeborg Vintage Dinosaur Art – Graveyards of the Dinosaurs Vintage Dinosaur Art March 10, 2022 I always enjoy receiving books from overseas that date to my childhood, but were never released in the UK (or if they were, were really well hidden) – there’s a special fascination in seeing what contemporary, for example, American kids were reading while I was devouring The Ultimate Dinosaur Book and Dinosaurs! magazine (er, the UK version). Graveyards of the Dinosaurs was (very kindly) sent to me from the US by Herman Diaz – thanks once again, Herman. It features a… Continue Reading 4 Comments By Marc Vincent"
