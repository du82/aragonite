full_description = "All aboard for 2025 Attraction Review Personal reflection December 30, 2024 Not wanting the last post of the year to be a vanilla Vintage Dinosaur Art post featuring some filler art from 20 years ago presented a conundrum. What else am I supposed to do these days? A few different ideas came to mind – a bit of personal reflection, a review of a museum or other attraction that I’d failed to post about, or a humorous comparison of ‘expert reacts’ videos regarding dinosaur media. In the end, I decided to… Continue Reading 4 Comments By Marc Vincent Dinosaurs in the Dark at Ouwehands Zoo Attraction Review January 23, 2024 That time again: Another zoo in the Netherlands has been dinosaurified! Previously I showed you the dinosaurs that came to ZooParc Overloon, Dierenrijk and GaiaZoo. This time, it’s Ouwehands Dierenpark in the town of Rhenen that has been visited by creatures from millions of years ago. There’s a twist, though; whereas the previous attractions centered around the usual models and animatronics, this attraction is a dinosaur-themed edition of Ouwehands’ yearly Light Nights winter event. That means these dinosaurs are light… Continue Reading 6 Comments By Gemma Hazeborg ROARR! Attraction Review March 28, 2023 Given Sam Bright’s excellent recent guest post on the Crystal Palace dinosaurs, it only seems fitting that we turn to another, more modern park full of full-scale life reconstructions of prehistoric beasts. Except, of course, this is firmly on the kitsch-o-saurus end of the scale, and there certainly won’t be a reference section at the end. Leave it to me to the lower the tone. What’s more, this is yet another example of me wallowing in childhood nostalgia. For I… Continue Reading 2 Comments By Marc Vincent The Dinosaur Kitsch Parade Attraction Review December 30, 2022 I wanted to do something quirky to close off the year. I like to think we are all dinosaur kitsch connaisseurs here. As the blog’s resident European mainlander, I have made it my mission to visit lots of dinosaur-related attractions, expositions and museums around the continent. I will then write whatever there is to write, whether it’s about priceless, unique vintage models in Poland or rubbish animatronics at some zoo. I’ve found that in this time of plenty there is… Continue Reading 3 Comments By Gemma Hazeborg"
