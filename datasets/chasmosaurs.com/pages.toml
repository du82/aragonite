full_description = "Vintage Dinosaur Art: Hubrecht at the Lyceum – Part 1 Vintage Dinosaur Art December 11, 2024 Once again: Marie Hubrecht. Are you tired of me talking about Marie Hubrecht yet? Because I’m not done. If you want more Hubrecht, check out my reviews of Verdwenen Werelden here, here and here, and our Verdwenen Werelden podcast episode here! This post is a direct companion to my last one, in which I detail the time I went to see the spectacular murals she made in the 1920s at the former Girls’ Lyceum in Amsterdam. These paintings have been… Continue Reading 5 Comments By Gemma Hazeborg Vintage Dinosaur Art: Tiere der Urwelt (Reichardt) – Part 3 Vintage Dinosaur Art February 4, 2024 We’re back with more German dinosaur cards from the Reichardt cocoa company! In parts one and two, we discussed two series of 1900s illustrations by one F. John. In the late 1910s, Reichardt once again hit the market with collectible cards themed to extinct animals. Incidentally, after Series 1 and Series 2, the third series was numbered Series 1a, because that’s what makes the most sense. The original featured artist, F. John, was, not to put too fine a point… Continue Reading 4 Comments By Gemma Hazeborg Vintage Dinosaur Art: Tiere der Urwelt (Reichardt) – Part 2 Vintage Dinosaur Art December 19, 2023 Have you seen our last post about these cards? Blog statistics tell me you mostly haven’t, so make sure to read it here. Today, I want to take you again to the wonderful, whimsical, slightly puzzling, occasionally grotesque prehistoric world of the enigmatic F. John, who exists only as a signature on sixty collectable cards from the Reichardt cocoa company. Quick recap: in the early 1900s, Reichardt released two series of thirty collectable cards with illustrations of prehistoric animals. All… Continue Reading 8 Comments By Gemma Hazeborg Vintage Dinosaur Art: Tiere der Urwelt (Reichardt) – Part 1 Vintage Dinosaur Art November 28, 2023 And it’s a proper Vintage Dinosaur Art as today, we’re looking at a rather obscure collection of paleoart from the very beginning of the 20th century. Let’s lay down some groundwork. Collectable cards are of all ages. In my youth, in the schoolyard we would have traded, and beat each other senseless over, Pokémon cards (a fine tradition that continues to this day), or football cards (maybe baseball cards if you’re in the US?). Sometimes, there’s a fad around dinosaur… Continue Reading 2 Comments By Gemma Hazeborg"
