full_description = "Vintage Dinosaur Art: Oxford First Book of Dinosaurs Vintage Dinosaur Art January 17, 2025 As the sort of unremarkable kids’ book that you might find buried in a stack at a charity shop, looking a little forlorn (but I found on eBay, of course), you might not expect too much from the Oxford First Book of Dinosaurs (part of a series that included further volumes on animals, art, maths, science, and space). As you’ve no doubt guessed, it uses a lot of art recycled from earlier books. Ah, but in this case, it’s a… Continue Reading 4 Comments By Marc Vincent Vintage Dinosaur Art: The Strange World of Dinosaurs – Part 1 Vintage Dinosaur Art April 14, 2021 The year is 1964 and, although he doesn’t know it yet, Yale palaeontologist John H. Ostrom is about to make history. In the summer of that year, he will embark on an expedition to Montana where he will make some remarkable discoveries. Five years later, he will be publishing one of the most game-changing papers in the history of dinosaur palaeontology: the scientific description of Deinonychus antirrhopus. It will mark the beginning of a complete revolution in how we see… Continue Reading 1 Comment By Gemma Hazeborg Vintage Dinosaur Art: Dinosaur Encyclopaedia for Children (Gollancz) – Part 2 – The Catalogue Vintage Dinosaur Art September 28, 2020 By popular demand (a whole two comments – hey, that’s good going these days!), here’s a small selection of Steve Kirk’s ‘catalogue’ illustrations, as featured in the Dinosaur Encyclopaedia for Children from Gollancz. As I mentioned previously, most of these are rather bland by Kirk’s standards, and it wouldn’t surprise me if a lot of them were rather older than the typically lively panoramas featured last time. Still, for connoisseurs of 1980s and ’90s ‘spotters guide’-type dinosaur books, I’m sure… Continue Reading 7 Comments By Marc Vincent Interview: Designing Mesozoic Beasts with David Silva Interview June 23, 2020 Ever bought a dinosaur toy but were super bummed it looked nothing like the scientific reconstructions? Are you done with pronated hands on commercial theropod figures? Have you had it with that Papo T. rex plastered everywhere on the Internet? Well, have we got a toy designer for you. Based in New Jersey, David Silva is a toy designer and founder of Creative Beast Studio. A graduate of Savannah College of Art and Design, he has spent almost two decades… Continue Reading 2 Comments By Nick Schofield"
