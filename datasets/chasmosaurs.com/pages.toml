title = "Podcast Show Notes: Episode 21 – The Alice Woodward Episode – Love in the Time of Chasmosaurs"
description = "It’s time for episode 21, and it’s a special one. Instead of our usual format, we’ve skipped the interview this week to take our time to talk about one of our oldest, most special…"
full_description = "Podcast Show Notes: Episode 21 – The Alice Woodward Episode Podcast Show Notes November 30, 2022 It’s time for episode 21, and it’s a special one. Instead of our usual format, we’ve skipped the interview this week to take our time to talk about one of our oldest, most special and most cherished palaeoart books yet. After all, what Vintage Dinosaur Art is more worthy of an in-depth look than Alice B. Woodward’s Golden Age illustrations in Henry Knipe’s Evolution in the Past, all the way from 1912? The fact that two-thirds of us have come down with a brutal cold has nothing to do with it, I promise. What’s all this talk about a Golden Age of illustration? What, if anything, is a rhabodontid? Is Natee secretly a total T. rex stan? Are we all going to break into a Gilbert & Sullivan song and dance number? (No.) And what did the scientists of the 1910s make of the infamous butt-brain hypothesis? Find out in this riveting episode. In the News Transylvanosaurus platycephalus is a new rhabodontid from Romania’s Hateg Basin, with some unexpected affiliations. The paper is here. A new dromaeosaur from the Jehol biota, Daurlong wangi, preserves some of its internal digestive tract, suggesting that these birdlike dinosaurs were not quite birdlike on the inside. The paper is here. A newly described species of Daspletosaurus, D. wilsoni, seems to be an intermediate form between D. torosus and D. horneri, and seems to suggest Daspletosaurus was a direct ancestor to another famous theropod… The paper is here. We are again three for three with open access papers this month. Vintage Dinosaur Art Evolution in the Past is our oldest work yet, a 110-year old look into the Mesozoic by way of the Edwardian age. Is Alice B. Woodward an unfrarly forgotten genius of paleoart? Ernest Bucknall is also there. Here’s a link to the PDF file of the entire book, which is in the public domain! It’s a signed copy, too. You know you want to share this post.FacebookTwitterRedditEmail Related Alice WoodwardDaspletosaurusDaurlongErnest BucknallHenry KnipePocast show notespodcastTransylvanosaurus 1 Comment By Gemma Hazeborg Gemma Hazeborg You Might Also Like Podcast Show Notes: Episode 15 – Flyorov and Levi Hastings March 5, 2022 Podcast Show Notes: Episode 17 – Crystal Palace and Russell Peterson May 31, 2022 Podcast Show Notes: Episode 1 – Giovanni Caselli and Joschua Knüppe December 22, 2020 1 Comment Reply llewelly December 2, 2022 at 4:48 pm Thank you for another wonderful episode. Leave a ReplyCancel reply document.addEventListener('DOMContentLoaded', function () { var commentForms = document.getElementsByClassName('jetpack_remote_comment'); for (var i = 0; i < commentForms.length; i++) { commentForms[i].allowTransparency = false; commentForms[i].scrolling = 'no'; } }); This site uses Akismet to reduce spam. Learn how your comment data is processed."
