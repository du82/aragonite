full_description = "All aboard for 2025 Attraction Review Personal reflection December 30, 2024 Not wanting the last post of the year to be a vanilla Vintage Dinosaur Art post featuring some filler art from 20 years ago presented a conundrum. What else am I supposed to do these days? A few different ideas came to mind – a bit of personal reflection, a review of a museum or other attraction that I’d failed to post about, or a humorous comparison of ‘expert reacts’ videos regarding dinosaur media. In the end, I decided to… Continue Reading 4 Comments By Marc Vincent Podcast Show Notes: Episode 37 – Farewell TetZooCon Conference Podcast Show Notes October 30, 2024 As every year, Marc, Natee and Gemma visited TetZooCon, Darren Naish’ big annual London event about animals, palaeontology, palaeoart and all things tetrapod. And this was a special edition indeed. Not only has this been the last ever edition of the Tetrapod Zoology Conference in its current form (more on which on the show) but we actually gave a talk this time! And what’s more, the talk has been recorded and is included in full on this very special, extra… Continue Reading 3 Comments By Gemma Hazeborg Uncovering Dinosaur Behaviour – review Book Review October 10, 2024 While at TetZooCon 2024 (the last one ever! Sort of), I took the opportunity to pick up the latest book from Dave Hone (for it is he) – Uncovering Dinosaur Behaviour: What They Did and How We Know, published by Princeton University Press (in early November for the non-TZC-going public). Dave’s previous book, The Future of Dinosaurs (known as How Fast Could T. rex Run? in the US for reasons best understood by the publishers) was certainly a decent read,… Continue Reading 1 Comment By Marc Vincent The Future of Dinosaurs – review Book Review March 29, 2022 Palaeontologist Dr David Hone (for it is he) has been extremely busy since the release of his previous book, The Tyrannosaur Chronicles, back in 2016 – not content with involving himself in copious amounts of research and numerous scientific papers, he also lectures at Queen Mary University of London by day and co-hosts the Terrible Lizards podcast with Iszi Lawrence by night. (Or something like that.) In between all this, Dr Dave somehow found time to write a follow-up book… Continue Reading 3 Comments By Marc Vincent"
