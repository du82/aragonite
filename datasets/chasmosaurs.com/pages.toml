full_description = "Uncovering Dinosaur Behaviour – review Book Review October 10, 2024 While at TetZooCon 2024 (the last one ever! Sort of), I took the opportunity to pick up the latest book from Dave Hone (for it is he) – Uncovering Dinosaur Behaviour: What They Did and How We Know, published by Princeton University Press (in early November for the non-TZC-going public). Dave’s previous book, The Future of Dinosaurs (known as How Fast Could T. rex Run? in the US for reasons best understood by the publishers) was certainly a decent read,… Continue Reading 1 Comment By Marc Vincent Meeting Marie’s Murals Paleoart Gallery September 20, 2024 Have I told you about Marie Hubrecht? Wasn’t she the Dutch aristocratic lady turned suffragette turned idiosyncratic palaeoartist? After first finding out about her through the palaeoart exhibition at Teylers Museum, I fell in love with Marie’s work, initially just for its novelty. There’s simply no vintage palaeoart that looks like this. In the time of semi-realists like Knight, Harder and Zallinger, you just don’t get palaeoart that is stylized like this. Plus, how many palaeoartists are eccentric old lesbians?… Continue Reading 2 Comments By Gemma Hazeborg Vintage Dinosaur Art: The Dinosaur Action Set (Book One!) Vintage Dinosaur Art September 17, 2024 Today’s entry is rather similar in concept to the later Dinosaur Park, which I reviewed back in 2020, but quite unlike the DK ACTION PACK (in spite of the rather similar title). It would appear to be a straightforward book at first glance, but upon opening an instruction is immediately given to prise out the staples and then remove all the pages. What’s this, a book that wants you to destroy it?! Of course not – well, sort of, actually,… Continue Reading 3 Comments By Marc Vincent Dino Dubbelgangers at Natuurmuseum Fryslân Museums September 9, 2024 As the train rushes trough the flat landscape, as the towns and villages become fewer and farther between and as the forests of the Veluwe give way to the lakes and fields of the North, I feel strengthened. I’ve lived centrally in the Netherlands for years, but my inner compass still points due North. It’s always worth coming out all this way. There’s always some dinosaur exhibition going on somewhere. Three years ago, it was Denekamp; last year, it was… Continue Reading 1 Comment By Gemma Hazeborg"
