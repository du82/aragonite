full_description = "Vintage Dinosaur Art: Oxford First Book of Dinosaurs Vintage Dinosaur Art January 17, 2025 As the sort of unremarkable kids’ book that you might find buried in a stack at a charity shop, looking a little forlorn (but I found on eBay, of course), you might not expect too much from the Oxford First Book of Dinosaurs (part of a series that included further volumes on animals, art, maths, science, and space). As you’ve no doubt guessed, it uses a lot of art recycled from earlier books. Ah, but in this case, it’s a… Continue Reading 4 Comments By Marc Vincent Vintage Dinosaur Art: Dinosaur (DK Revealed) Vintage Dinosaur Art November 28, 2024 Regular readers (we have some, right?) will be aware that our sole criterion for a book’s inclusion in Vintage (=Old) Dinosaur Art is that it be 20 years old. Consequently, books from the early 2000s have now entered our purview. It was a time when, in the wake of Walking With Dinosaurs, publishers demanded increasing numbers of CG creations in lieu of more traditional illustrations and model photography. Dorling Kindersley (aka DK) very much followed this trend, inserting very dodgy… Continue Reading 1 Comment By Marc Vincent Vintage Dinosaur Art, maybe: De dinosauriërs (Kennis Compact) Vintage Dinosaur Art July 13, 2024 The concept of “bad art” has been occupying my mind lately, for reasons that will hopefully become clear in due course. Bad palaeoart, especially. It is my firmly-held belief that even the shoddiest work made by human hand has infinitely more value than any image artificially created by a learning, plagiarizing algorithm. No matter how many works by Tony Gibbons and F. John we have to plough through on these pages, this will still be essentially true. All contributions to… Continue Reading 9 Comments By Gemma Hazeborg Vintage Jurassic Park Covers! Vintage Dinosaur Art September 22, 2023 It all started a week or two ago, when my partner Maartje found a Dutch translation of Michael Crichton’s Jurassic Park somewhere. It is an original 1991 edition. This means the cover image had been produced before the movie was made. It is necessarily completely free of the iconography of the film that would come to overshadow the novel, and indeed overshadow all other dinosaur media. That logo, that skeleton, that font, the designs of those dinosaurs and those characters… Continue Reading 28 Comments By Gemma Hazeborg"
