rs and Other Prehistoric Animals (which was the edition I happened to review on this blog, back before some of you were born, probably). So memorable was that Zallinger-illustrated classic that Robert Bakker and Luis Rey deemed it worthy of a remake, published in 2013. Besides that, there was of course the very memorable Little Golden Book, packed… Continue Reading 4 Comments By Marc Vincent"
