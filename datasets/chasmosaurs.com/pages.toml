full_description = "Vintage Dinosaur Art: Hubrecht at the Lyceum – Part 1 Vintage Dinosaur Art December 11, 2024 Once again: Marie Hubrecht. Are you tired of me talking about Marie Hubrecht yet? Because I’m not done. If you want more Hubrecht, check out my reviews of Verdwenen Werelden here, here and here, and our Verdwenen Werelden podcast episode here! This post is a direct companion to my last one, in which I detail the time I went to see the spectacular murals she made in the 1920s at the former Girls’ Lyceum in Amsterdam. These paintings have been… Continue Reading 5 Comments By Gemma Hazeborg Vintage Dinosaur Art: Dinosaur (DK Revealed) Vintage Dinosaur Art November 28, 2024 Regular readers (we have some, right?) will be aware that our sole criterion for a book’s inclusion in Vintage (=Old) Dinosaur Art is that it be 20 years old. Consequently, books from the early 2000s have now entered our purview. It was a time when, in the wake of Walking With Dinosaurs, publishers demanded increasing numbers of CG creations in lieu of more traditional illustrations and model photography. Dorling Kindersley (aka DK) very much followed this trend, inserting very dodgy… Continue Reading 1 Comment By Marc Vincent Vintage Dinosaur Art: Learn About Dinosaurs Vintage Dinosaur Art November 12, 2023 As I’ve mentioned before, the promise of learning more about dinosaurs is an excellent way to compel young children to learn how to read, and so it’s unsurprising that so many books aimed at beginner readers feature them. Learn About Dinosaurs, published in 1990 by New Seasons as part of their Leap Frog series, is a very typical example. Not terribly remarkable, perhaps, but I’m sure it’ll be sweetly nostalgic for a few of our millennial readers and, hey, those… Continue Reading 0 Comments By Marc Vincent LWL-Museum für Naturkunde, Münster Museums October 24, 2023 Westfalen in October can mean only one thing: rain, rain and more rain. But nothing is to spoil my mood today: I’ve come to Münster, more or less on a whim, for this lovely natural history museum (as well as the zoo next door). The museum is currently undergoing partial renovations, but no matter; I’ll come back again next year to see what they made of it. A planetarium is also housed in the building at an upcharge. It’s worth… Continue Reading 2 Comments By Gemma Hazeborg"
