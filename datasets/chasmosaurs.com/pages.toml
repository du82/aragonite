full_description = "Vintage Dinosaur Art: Hubrecht at the Lyceum – Part 1 Vintage Dinosaur Art December 11, 2024 Once again: Marie Hubrecht. Are you tired of me talking about Marie Hubrecht yet? Because I’m not done. If you want more Hubrecht, check out my reviews of Verdwenen Werelden here, here and here, and our Verdwenen Werelden podcast episode here! This post is a direct companion to my last one, in which I detail the time I went to see the spectacular murals she made in the 1920s at the former Girls’ Lyceum in Amsterdam. These paintings have been… Continue Reading 5 Comments By Gemma Hazeborg Vintage Dinosaur Art: Discovering Dinosaurs Vintage Dinosaur Art April 12, 2023 Remember the St Michael dinosaur book, published in 1978 and notably featuring quite handsomely painted illustrations by Bernard Robinson? Discovering Dinosaurs, published a decade later by Cliveden Press, was illustrated by someone who evidently had a very well-thumbed copy of the earlier tome. I say ‘someone’, because neither the illustrator nor author here are credited, which is rather surprising. Then again, given the levels of Utter Shamelessness on show here, perhaps it’s because they’d rather their names weren’t attached to this… Continue Reading 3 Comments By Marc Vincent Vintage Dinosaur Art: Ornithomimids: The Fastest Dinosaurs Vintage Dinosaur Art October 11, 2022 It’s Don and Donna month here at LITC! I will be reviewing a few volumes in a series of books written by superstar dinosaur author, robot builder, TV presenter and firebrand “Dino” Don Lessem and illustrated by superstar palaeoartist Donna Braginetz. Published by Carolrhoda Books, each of these books is a small but in-depth entry level look at one species (or in this case family) of dinosaur, well researched and richly illustrated. Lessem worked with a few different palaeoartists in… Continue Reading 2 Comments By Gemma Hazeborg Vintage Dinosaur Art: The World of Dinosaurs – Part 1 Vintage Dinosaur Art August 1, 2022 This must be one of those ‘how in the Jack Horner haven’t we covered it yet?’ books – The World of Dinosaurs, published in 1977 by Book Club Associates (“by arrangement with Weidenfeld and Nicholson”) and written by Michael Tweedie. Just when you think you’ve exhausted every post-1970, chunky, full-colour illustrated dinosaur encyclopedia, up pops another one. And it’s quite something, boasting artwork featuring a wide range of prehistoric animals – although predominantly dinosaurs, of course – mostly provided by… Continue Reading 8 Comments By Marc Vincent"
