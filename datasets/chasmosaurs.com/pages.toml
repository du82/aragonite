["https://chasmosaurs.com/2022/12/24/podcast-show-notes-episode-22-postcards-from-tetzoocon-2022"]
title = "Podcast Show Notes: Episode 22 – Postcards from TetZooCon 2022 – Love in the Time of Chasmosaurs"
description = "Episode 22 closes off the year 2022. Here is the yearly postcard from TetZooCon, in podcast form! The UK’s biggest event of Our People, organized by that man Naish and presumably other people…"
full_description = "Podcast Show Notes: Episode 22 – Postcards from TetZooCon 2022 Conference Podcast Show Notes December 24, 2022 Episode 22 closes off the year 2022. Here is the yearly postcard from TetZooCon, in podcast form! The UK’s biggest event of Our People, organized by that man Naish and presumably other people, was held early December at the Bush House in London. It was a palaeo-heavy conference, with lots of dinosaur and especially pterosaur talks, the yearly palaeoart workshop, lots of attention for the Crystal Palace Dinosaurs and the launches (or re-launches) of some significant books. And this time, you can hear all about it! Niels, Marc and Natee did not only attend the event, but took the time to interview a whole bunch of people there, from speakers, familiar names, palaeoartists, authors and regular – as well as not irregular – attendees. So enjoy this lavish episode full of news and reminiscence, featuring Darren Naish, Victoria Arbour, Dougal Dixon, Natalia Jagielska, C. M. Kosemen and a whole bunch of others. In the News Some news concerning a certain contested, long-snouted, possibly aquatic theropod. Nateevenator, I mean Natovenator is here! What else did you think it was? The paper is here. Evidence of some early dinosaurs, two sauropodomorphs and a herrerasaur, suggests that the intense skeletal pneumaticity that theropods and sauropods are known for wasn’t present in the common ancestors of these clades, and therefore must have evolved separately. Here’s the paper! Pathologies on the type specimen of Zuul crurivastator the ankylosaurid suggest that the animal used its famed tail club primarily for intraspecific combat rather than defence. Zuul‘s co-describer, LITC alumnus and lead author of the paper, Dr. Victoria Arbour, tells us more. And here is the paper. TetZooCon We had a great time at TetZooCon! Rather than re-iterate all we said in the podcast, here’s a bunch of photographs. Marc’s review of Mesozoic Art is here. Natee’s review of A Hisory of Painting (With Dinosaurs) is definitely also coming. Our interview with Steve White, discussing the making of Mesozoic Art Our interview with Darren Naish, on Mesozoic Art and some other things Our interview with Mark Witton about the Crystal Palace Dinosaurs Our interview with John Conway on 10 years of All Yesterdays The LITC team. Photo by Georgia Witton-Maclean. Niels with Sarah of the Friends of the Crystal Palace Dinosaurs. Photo by Marc Vincent. Marc in conversation with Dougal Dixon. Photo by Niels Hazeborg. C. M. Kosemen and Abigail. Photo by Niels Hazeborg. Matt Dempsey shows his stuff. Photo by Niels Hazeborg. Darren Naish gets ambushed. Photo by Niels Hazeborg. Natee in conversation with Chris Manias. Photo by Niels Hazeborg. Natee in conversation with Natalia Jagielska. Photo by Niels Hazeborg. Natee and Albert and a fabulous prize. Photo by Niels Hazeborg. Thank you for listening to the podcast! Our music was generously provided by Rohan Long. You can purchase his music at Bandcamp, and follow him at Twitter. By becoming a patron on Patreon, you can help us continue creating podcasts and writing this blog. You can also follow us on Facebook and Twitter. See you next time! You know you want to share this post.FacebookTwitterRedditEmail Related Benjamin Waterhouse HawkinsC. M. KosemenChris ManiasCrystal PalaceDarren NaishDougal DixonMatt DempseyNatalia JagielskaNatovenatorpodcastPodcast Show NotesTetZooConVictoria Arbourzuul 0 Comments By Gemma Hazeborg Gemma Hazeborg You Might Also Like Podcast Show Notes: Episode 33 – Inside Dinosaurs and Return to Crystal Palace March 29, 2024 Podcast Show Notes: Episode 24 – DK Sculpts and Emiliano Troco March 5, 2023 Podcast Show Notes: Episode 36 – Sean Rubin and Tudor Humphries August 31, 2024 No Comments Leave a ReplyCancel reply document.addEventListener('DOMContentLoaded', function () { var commentForms = document.getElementsByClassName('jetpack_remote_comment'); for (var i = 0; i < commentForms.le