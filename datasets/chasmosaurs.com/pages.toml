full_description = "Vintage Dinosaur Art: Hubrecht at the Lyceum – Part 1 Vintage Dinosaur Art December 11, 2024 Once again: Marie Hubrecht. Are you tired of me talking about Marie Hubrecht yet? Because I’m not done. If you want more Hubrecht, check out my reviews of Verdwenen Werelden here, here and here, and our Verdwenen Werelden podcast episode here! This post is a direct companion to my last one, in which I detail the time I went to see the spectacular murals she made in the 1920s at the former Girls’ Lyceum in Amsterdam. These paintings have been… Continue Reading 5 Comments By Gemma Hazeborg Vintage Dinosaur Art: Vasily Vatagin (Part 2) Vintage Dinosaur Art October 7, 2021 It’s time for more Vatagin! Last time I showed you some of the dinosaur-centric works of the old Russian master. There are still some dinosaurs left, but today I will cover mostly the otherprehistoricanimals in his portfolio. As I don’t have a way to date his works except very broadly, I will simply do so in the chronological order of the Earth itself. Vatagin’s most famous and prominent palaeontological works are those in the “History of Life on Earth” series… Continue Reading 3 Comments By Gemma Hazeborg Vintage Dinosaur Art: Verdwenen Werelden – Part 3 Vintage Dinosaur Art March 22, 2020 Here we are again with Verdwenen Werelden, Marie Hubrecht’s masterpiece and the gift that keeps on giving. As we always do, we’ve started off by showing you all the dinosaur stuff. Then, we went to the more recent past to look at some mammals. That leaves us with the many depictions of marine life Hubrecht put onto canvas with gouache, panache and all the homebrew passion of a determined amateur. Let’s, ahem, dive in. This is actually the very first… Continue Reading 7 Comments By Gemma Hazeborg Vintage Dinosaur Art: Verdwenen Werelden – Part 2 Vintage Dinosaur Art March 16, 2020 Welcome back to Verdwenen Werelden, an eccentric old book by an eccentric old lady! Last time, we looked at some of the fantastic dinosaur scenes from our unlikely heroine Maria Hubrecht. Today, I want to focus on the many Cenozoic paintings she made for the book. Unlike the Palaeozoic and Mesozoic paintings, none of these have any equivalent in the murals of the current Joke Smit college. These are all original works produced for the book only. Maria Hubrecht very… Continue Reading 2 Comments By Gemma Hazeborg"
