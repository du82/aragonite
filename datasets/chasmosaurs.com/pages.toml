full_description = "Vintage Dinosaur Art: Hubrecht at the Lyceum – Part 1 Vintage Dinosaur Art December 11, 2024 Once again: Marie Hubrecht. Are you tired of me talking about Marie Hubrecht yet? Because I’m not done. If you want more Hubrecht, check out my reviews of Verdwenen Werelden here, here and here, and our Verdwenen Werelden podcast episode here! This post is a direct companion to my last one, in which I detail the time I went to see the spectacular murals she made in the 1920s at the former Girls’ Lyceum in Amsterdam. These paintings have been… Continue Reading 5 Comments By Gemma Hazeborg Vintage Dinosaur Art: The Corridor of Life Vintage Dinosaur Art August 28, 2024 The palaeontologist Dr William Elgin Swinton (W E Swinton to you) is perhaps best known, in the context of popular books about dinosaurs at least, for works published by the Natural History Museum (or the British Museum (Natural History) as it then properly was) that featured artwork by Neave Parker. I reviewed such a book back in 2011, a rather dry affair filled with strange ideas that must have seemed a little outdated even at the time. However, it’d be… Continue Reading 2 Comments By Marc Vincent Vintage Dinosaur Art, maybe: De dinosauriërs (Kennis Compact) Vintage Dinosaur Art July 13, 2024 The concept of “bad art” has been occupying my mind lately, for reasons that will hopefully become clear in due course. Bad palaeoart, especially. It is my firmly-held belief that even the shoddiest work made by human hand has infinitely more value than any image artificially created by a learning, plagiarizing algorithm. No matter how many works by Tony Gibbons and F. John we have to plough through on these pages, this will still be essentially true. All contributions to… Continue Reading 9 Comments By Gemma Hazeborg Podcast Show Notes: Episode 35 – Snowball and the Raptor Boys Podcast Show Notes June 30, 2024 We’ve had a month off, but the famous LITC podcast is back in full strength with more fresh news, nostalgic art reviews and exciting interviews! After discussing the new films and documentaries that are coming our way, we review some very English palaeoart from the late 1970s by the unsung Peter Snowball. After that, Natee and Marc interview the Golden Boys of Dromaeosaurs, 3D sculptor Ruadhrí Brennan and returning LITC interviewee Jed Taylor, whose incredible Velociraptor sculpts have set last… Continue Reading 2 Comments By Gemma Hazeborg"
