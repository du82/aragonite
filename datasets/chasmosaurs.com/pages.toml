title = "Podcast Show Notes: Episode 35 – Snowball and the Raptor Boys – Love in the Time of Chasmosaurs"
description = "We’ve had a month off, but the famous LITC podcast is back in full strength with more fresh news, nostalgic art reviews and exciting interviews! After discussing the new films and documentari…"
full_description = "Podcast Show Notes: Episode 35 – Snowball and the Raptor Boys Podcast Show Notes June 30, 2024 We’ve had a month off, but the famous LITC podcast is back in full strength with more fresh news, nostalgic art reviews and exciting interviews! After discussing the new films and documentaries that are coming our way, we review some very English palaeoart from the late 1970s by the unsung Peter Snowball. After that, Natee and Marc interview the Golden Boys of Dromaeosaurs, 3D sculptor Ruadhrí Brennan and returning LITC interviewee Jed Taylor, whose incredible Velociraptor sculpts have set last year’s TetZooCon on fire, and are poised to do the same this year. What new shenanigans are these two up to next? Who illustrated the first Pachyrhinosaurus? Do we actually have listeners in Japan? Which Disney villain does Natee resemble most? Will we turn into a gaming podcast? Find all of this out in episode 35! In the News Why Dinosaurs? is a documentary movie by James and Tony Pinto about dinosaurs and the people who love them, starring a who’s who of filmmakers, artists and scientists… but not us. Nevertheless, here is the website, where you can see if there’s any showings near you. Walking with Dinosaurs is finally returning! A new series by the BBC and PBS is in production right now. At this point, we at LITC can tell you… not very much at all. But some cool people are involved. And Spinosaurus is in it, so nobody will be angry. Here’s a website. Vintage Dinosaur Art Peter Snowball was one of the featured illustrators on 1979s A New Look At The Dinosaurs. Written by Alan Charig, the top British palaeontologist at the time, the book featured artworks by several hired illustrators, of which Snowball’s work has held up the best. Marc’s initial review is here. Hell Creek: Pachycephalosaurus, Edmontosaurus, Ornithomimus, Ankylosaurus, Triceratops, Tyrannosaurus Wealden: Iguanodon, Altispinax, Polacanthus, Hypsilophodon Megalosaurus and Scelidosaurus Morrison: Ceratosaurus, Camptosaurus, Stegosaurus, Brachiosaurus, Apatosaurus Lesothosaurus and Dilophosaurus Triassic: Plateosaurus and Procompsognathus Deinonychus Protoceratops and Pachyrhinosaurus Corythosaurus Interview We’ve interviewed Jed Taylor before. Twice. This time, the Nottingham-based palaeoartist is joined by Irish 3D artist Ruadhrí Brennan, friend of the show, who is well known for sculpting scientifically accurate 3D printed dinosaur skulls and skeletons in all sizes. Last year, they joined forces to create some extraordinary dromaeosaur sculpts. Today, they reveal how they did it, and what is next on the horizon… You can find Jed’s Instagram here and his Patreon here, while Ruadhrí’s Instagram is right over here. A sneak peak at the new Deinonychus design… Thank you for listening to the podcast! Our music was generously provided by Rohan Long. You can purchase his music at Bandcamp, and follow him at Twitter. By becoming a patron on Patreon, you can help us continue creating podcasts and writing this blog. You can also follow us on Facebook and Twitter. See you next time! You know you want to share this post.FacebookTwitterRedditEmail Related 1970sAltispinaxAnkylosaurusapatosaurusCeratosauruscorythosaurusDeinonychusDilophosaurushypsilophodonIguanodonJed TaylorLesothosaurusMegalosaurusOrnithomimusPachychephalosaurusPachyrhinosaurusPeter SnowballPlateosauruspodcastPodcast Show NotesProcompsognathusProtoceratopsRuadhrí BrennanScelidosaurusTriceratopstyrannosaurusvelociraptor 2 Comments By Gemma Hazeborg Gemma Hazeborg You Might Also Like Podcast Show Notes: Episode 2 – John Sibbick and Natalia Jagielska January 25, 2021 Podcast Show Notes: Episode 34 – Maurice Wilson and Johan Egerkrans May 3, 2024 Podcast Show Notes: Episode 9 – Great Aunt Marie and David Armsby August 29, 2021 2 Comments Reply Masao OKazaki July 4, 2024 at 5:20 am Hey, I’m listening to you guys from Japan! Reply Gemma Hazeborg July 6, 2024 at 5:51 pm See! I knew we had at least one! 🙂 And we are most grateful! Leave a ReplyCancel reply document.addEventListener('DOMContentLoaded', function () { var commentForms = document.getElementsByClassName('jetpack_remote_comment'); for (var i = 0; i < commentForms.length; i++) { commentForms[i].allowTransparency = false; commentForms[i].scrolling = 'no'; } }); This site uses Akismet to reduce spam. Learn how your comment data is processed."
