full_description = "Vintage Dinosaur Art: Dinosaurs (Home Reference Library) Vintage Dinosaur Art February 18, 2025 In my further quest to avoid the DK Encyclopedia of Dinosaurs & Prehistoric Life from 2001 (which I do now own, at least), here’s another book from around that time – Dinosaurs, published in 2002 by Fog City Press. It’s a rather generic affair all told, but I’m sure there’s someone out there for whom this is an important childhood memory. Besides which, it features illustrations by Steve Kirk and Luis Rey (among others), not to mention an interesting mix of… Continue Reading 2 Comments By Marc Vincent Vintage Dinosaur Art: Dinosaur (DK Revealed) Vintage Dinosaur Art November 28, 2024 Regular readers (we have some, right?) will be aware that our sole criterion for a book’s inclusion in Vintage (=Old) Dinosaur Art is that it be 20 years old. Consequently, books from the early 2000s have now entered our purview. It was a time when, in the wake of Walking With Dinosaurs, publishers demanded increasing numbers of CG creations in lieu of more traditional illustrations and model photography. Dorling Kindersley (aka DK) very much followed this trend, inserting very dodgy… Continue Reading 1 Comment By Marc Vincent"
