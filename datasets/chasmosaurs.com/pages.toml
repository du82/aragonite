full_description = "All aboard for 2025 Attraction Review Personal reflection December 30, 2024 Not wanting the last post of the year to be a vanilla Vintage Dinosaur Art post featuring some filler art from 20 years ago presented a conundrum. What else am I supposed to do these days? A few different ideas came to mind – a bit of personal reflection, a review of a museum or other attraction that I’d failed to post about, or a humorous comparison of ‘expert reacts’ videos regarding dinosaur media. In the end, I decided to… Continue Reading 4 Comments By Marc Vincent Vintage Dinosaur Art, maybe: De dinosauriërs (Kennis Compact) Vintage Dinosaur Art July 13, 2024 The concept of “bad art” has been occupying my mind lately, for reasons that will hopefully become clear in due course. Bad palaeoart, especially. It is my firmly-held belief that even the shoddiest work made by human hand has infinitely more value than any image artificially created by a learning, plagiarizing algorithm. No matter how many works by Tony Gibbons and F. John we have to plough through on these pages, this will still be essentially true. All contributions to… Continue Reading 9 Comments By Gemma Hazeborg Podcast Show Notes: Episode 35 – Snowball and the Raptor Boys Podcast Show Notes June 30, 2024 We’ve had a month off, but the famous LITC podcast is back in full strength with more fresh news, nostalgic art reviews and exciting interviews! After discussing the new films and documentaries that are coming our way, we review some very English palaeoart from the late 1970s by the unsung Peter Snowball. After that, Natee and Marc interview the Golden Boys of Dromaeosaurs, 3D sculptor Ruadhrí Brennan and returning LITC interviewee Jed Taylor, whose incredible Velociraptor sculpts have set last… Continue Reading 2 Comments By Gemma Hazeborg Vintage Dinosaur Art: Záhada Dinosaurů – Part 1 Vintage Dinosaur Art April 16, 2024 Today’s book has gotten some attention recently on some of the palaeoart-centered Facebook groups we frequent. It features little-seen but high quality art from the nineties. Once I saw it, I knew I had to track this book down. This was not straightforward. Not only is this book only available in Czech, it is only available from Czech booksellers that only ship to Czechia. I managed to nab a copy off Rostislav Walica, so kudos to him. I now (maybe?)… Continue Reading 8 Comments By Gemma Hazeborg"
