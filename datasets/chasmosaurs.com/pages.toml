full_description = "Podcast Show Notes: Episode 37 – Farewell TetZooCon Conference Podcast Show Notes October 30, 2024 As every year, Marc, Natee and Gemma visited TetZooCon, Darren Naish’ big annual London event about animals, palaeontology, palaeoart and all things tetrapod. And this was a special edition indeed. Not only has this been the last ever edition of the Tetrapod Zoology Conference in its current form (more on which on the show) but we actually gave a talk this time! And what’s more, the talk has been recorded and is included in full on this very special, extra… Continue Reading 3 Comments By Gemma Hazeborg Podcast Show Notes: Episode 30 – TetZooCon On Ice Conference Podcast Show Notes December 30, 2023 TetZooCon 2023 is in the bag, and of course, we were there. Join Marc, Natee and Niels as they relay their adventures, the talks, the vendors, the people, the experiences and the catastrophes of the legendary London extravaganza of zoology, palaeontology and palaeoart as it grows ever bigger. Did we all make it to the end? Who was our favourite cosplayer? Have all the Crystal Palace dinosaurs been scanned? Are we finally going to talk video games on here? Are… Continue Reading 1 Comment By Gemma Hazeborg Podcast Show Notes: Episode 22 – Postcards from TetZooCon 2022 Conference Podcast Show Notes December 24, 2022 Episode 22 closes off the year 2022. Here is the yearly postcard from TetZooCon, in podcast form! The UK’s biggest event of Our People, organized by that man Naish and presumably other people, was held early December at the Bush House in London. It was a palaeo-heavy conference, with lots of dinosaur and especially pterosaur talks, the yearly palaeoart workshop, lots of attention for the Crystal Palace Dinosaurs and the launches (or re-launches) of some significant books. And this time,… Continue Reading 0 Comments By Gemma Hazeborg Mesozoic Art – Marc’s review Book Review November 7, 2022 Who doesn’t want another coffee table book filled with very pretty palaeoart printed on good quality paper? Mesozoic Art is the spiritual successor to Dinosaur Art and Dinosaur Art II, both published by Titan Books in 2012 and 2017, respectively. As Bloomsbury has published this one, it can’t be a sequel in the literal sense, even if the front cover is very, very strongly suggestive of it being so. It also (in spite of the cover design) departs from its… Continue Reading 2 Comments By Marc Vincent"
