full_description = "Vintage Dinosaur Art: Hubrecht at the Lyceum – Part 1 Vintage Dinosaur Art December 11, 2024 Once again: Marie Hubrecht. Are you tired of me talking about Marie Hubrecht yet? Because I’m not done. If you want more Hubrecht, check out my reviews of Verdwenen Werelden here, here and here, and our Verdwenen Werelden podcast episode here! This post is a direct companion to my last one, in which I detail the time I went to see the spectacular murals she made in the 1920s at the former Girls’ Lyceum in Amsterdam. These paintings have been… Continue Reading 5 Comments By Gemma Hazeborg Vintage Dinosaur Art: Dinosaur For A Day Vintage Dinosaur Art February 22, 2024 A couple of years ago, we looked at the book The Last Dinosaur by Jim Murphy and illustrated by Mark Alan Weatherby. It was a piece of naturalist fiction from the late 80s that followed the adventures of a female Triceratops as the world around her was dying. It was a beautiful and odd little book, one that I remembered reading when I was young. Less famously, in 1992, Murphy and Weatherby reunited for another dinosaur adventure, this one not… Continue Reading 5 Comments By Gemma Hazeborg Vintage Dinosaur Art: The World’s Wonderful Creatures Vintage Dinosaur Art February 12, 2024 When looking at books from the years BT (Before T’internet), we must of course always bear in mind that decent reference material was rather difficult to come by, especially for your average jobbing illustrator without privileged access to museums and/or scientists. (And even then, the scientists sometimes just didn’t give a toss.) This explains the proliferation of Knight, Burian, and Zallinger clones – what else were the poor artists supposed to do, if not take inspiration from the greats? Nevertheless,… Continue Reading 13 Comments By Marc Vincent Vintage Dinosaur Art: Tiere der Urwelt (Reichardt) – Part 3 Vintage Dinosaur Art February 4, 2024 We’re back with more German dinosaur cards from the Reichardt cocoa company! In parts one and two, we discussed two series of 1900s illustrations by one F. John. In the late 1910s, Reichardt once again hit the market with collectible cards themed to extinct animals. Incidentally, after Series 1 and Series 2, the third series was numbered Series 1a, because that’s what makes the most sense. The original featured artist, F. John, was, not to put too fine a point… Continue Reading 4 Comments By Gemma Hazeborg"
