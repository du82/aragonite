full_description = "Vintage Dinosaur Art: The Magic School Bus in the Time of the Dinosaurs Vintage Dinosaur Art October 22, 2024 The Magic School Bus franchise was a big deal at exactly the right sort of time for it to have impacted my childhood, but it completely passed me by – probably because I’m British, and it wasn’t quite as well known here. I do have vague memories of a fantastical yellow bus (which was a bit of an alien concept – the yellow school bus, that is) that could fly through space and whatnot, but that’s about it. A shame,… Continue Reading 1 Comment By Marc Vincent Vintage Dinosaur Art: The Dinosaur Action Set (Book One!) Vintage Dinosaur Art September 17, 2024 Today’s entry is rather similar in concept to the later Dinosaur Park, which I reviewed back in 2020, but quite unlike the DK ACTION PACK (in spite of the rather similar title). It would appear to be a straightforward book at first glance, but upon opening an instruction is immediately given to prise out the staples and then remove all the pages. What’s this, a book that wants you to destroy it?! Of course not – well, sort of, actually,… Continue Reading 3 Comments By Marc Vincent Podcast Show Notes: Episode 35 – Snowball and the Raptor Boys Podcast Show Notes June 30, 2024 We’ve had a month off, but the famous LITC podcast is back in full strength with more fresh news, nostalgic art reviews and exciting interviews! After discussing the new films and documentaries that are coming our way, we review some very English palaeoart from the late 1970s by the unsung Peter Snowball. After that, Natee and Marc interview the Golden Boys of Dromaeosaurs, 3D sculptor Ruadhrí Brennan and returning LITC interviewee Jed Taylor, whose incredible Velociraptor sculpts have set last… Continue Reading 2 Comments By Gemma Hazeborg Vintage Dinosaur Art: Prehistoric Animals (Purnell Library of Knowledge) Vintage Dinosaur Art October 16, 2023 Purnell’s prehistoric animal books of the 1970s – of which there were several, of varying quality (as mostly featured on LITC Mk 1) – attract a great deal of nostalgic fondness from people, uh, a little older than me. The fact that their output seemed to dry up from the 1980s onwards becomes a lot more explicable when one learns of how the company fell into the hands of notorious crook and amateur yachtsman Robert ‘Cap’n Bob’ Maxwell, and consequently… Continue Reading 1 Comment By Marc Vincent"
