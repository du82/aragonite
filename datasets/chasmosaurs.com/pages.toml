full_description = "Vintage Dinosaur Art: Dinosaurs (Ladybird Square books) Vintage Dinosaur Art January 28, 2025 Say “Ladybird dinosaur book” to someone, and they’ll very likely think of the book illustrated by Bernard Robinson that was reprinted a number of times and spanned the childhoods of multiple generations. (Well, at least two.) I reviewed it all the way back in 2011, so perhaps my review is now as nostalgic for some people as Ladybird books are for others. (Nah, just kidding. I’m not so deluded.) Robinson’s illustrations, while technically superb and highly memorable, were looking rather… Continue Reading 4 Comments By Marc Vincent Podcast Show Notes: Episode 35 – Snowball and the Raptor Boys Podcast Show Notes June 30, 2024 We’ve had a month off, but the famous LITC podcast is back in full strength with more fresh news, nostalgic art reviews and exciting interviews! After discussing the new films and documentaries that are coming our way, we review some very English palaeoart from the late 1970s by the unsung Peter Snowball. After that, Natee and Marc interview the Golden Boys of Dromaeosaurs, 3D sculptor Ruadhrí Brennan and returning LITC interviewee Jed Taylor, whose incredible Velociraptor sculpts have set last… Continue Reading 2 Comments By Gemma Hazeborg Vintage Dinosaur Art: Dinosaur For A Day Vintage Dinosaur Art February 22, 2024 A couple of years ago, we looked at the book The Last Dinosaur by Jim Murphy and illustrated by Mark Alan Weatherby. It was a piece of naturalist fiction from the late 80s that followed the adventures of a female Triceratops as the world around her was dying. It was a beautiful and odd little book, one that I remembered reading when I was young. Less famously, in 1992, Murphy and Weatherby reunited for another dinosaur adventure, this one not… Continue Reading 5 Comments By Gemma Hazeborg Vintage Dinosaur Art: Extinct Monsters and Creatures of Other Days – Part 2 Vintage Dinosaur Art August 29, 2023 A while ago we had a look at Extinct Monsters, a book from 1892 by H. N. Hutchinson and illustrated by Joseph Smit. Now, we’re going all the way to 1910 for the the new, revised, expanded edition of Extinct Monsters by the same author, that reflects almost two decades of scientific discovery. This new version of the book is the one that has the awesome extended title “…and Creatures of Other Days“. The ageing Joseph Smit, Dutchman in England,… Continue Reading 6 Comments By Gemma Hazeborg"
