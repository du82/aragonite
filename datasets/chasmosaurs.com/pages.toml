full_description = "Podcast Show Notes: Episode 38 – Thomas Thiemeyer and the Triceratops Herd Podcast Show Notes February 26, 2025 After months of technical mishaps, we finally managed to get the podcast back up and running! Marc, Gemma and Natee start off by having a little moan about terrible dinosaur movies before moving into a fun German book Gemma found at a school! We got some typical late 80s fare, with some very unusual depictions of dinosaurs… Then, Gemma and Marc interview Yasmin Grooters, head of the dinosaur lab at Naturalis Leiden, who recently finished work on a whole herd… Continue Reading 2 Comments By Gemma Hazeborg Vintage Dinosaur Art: Hubrecht at the Lyceum – Part 1 Vintage Dinosaur Art December 11, 2024 Once again: Marie Hubrecht. Are you tired of me talking about Marie Hubrecht yet? Because I’m not done. If you want more Hubrecht, check out my reviews of Verdwenen Werelden here, here and here, and our Verdwenen Werelden podcast episode here! This post is a direct companion to my last one, in which I detail the time I went to see the spectacular murals she made in the 1920s at the former Girls’ Lyceum in Amsterdam. These paintings have been… Continue Reading 5 Comments By Gemma Hazeborg Podcast Show Notes: Episode 37 – Farewell TetZooCon Conference Podcast Show Notes October 30, 2024 As every year, Marc, Natee and Gemma visited TetZooCon, Darren Naish’ big annual London event about animals, palaeontology, palaeoart and all things tetrapod. And this was a special edition indeed. Not only has this been the last ever edition of the Tetrapod Zoology Conference in its current form (more on which on the show) but we actually gave a talk this time! And what’s more, the talk has been recorded and is included in full on this very special, extra… Continue Reading 3 Comments By Gemma Hazeborg Meeting Marie’s Murals Paleoart Gallery September 20, 2024 Have I told you about Marie Hubrecht? Wasn’t she the Dutch aristocratic lady turned suffragette turned idiosyncratic palaeoartist? After first finding out about her through the palaeoart exhibition at Teylers Museum, I fell in love with Marie’s work, initially just for its novelty. There’s simply no vintage palaeoart that looks like this. In the time of semi-realists like Knight, Harder and Zallinger, you just don’t get palaeoart that is stylized like this. Plus, how many palaeoartists are eccentric old lesbians?… Continue Reading 2 Comments By Gemma Hazeborg"
