full_description = "Paleoart Community Resources In addition to our blogging and podcasting, the Love in the Time of Chasmosaurs team is dedicated to creating resources that help the paleoart community. The Survey of Paleoartists Created to shed light on professional practice and career prospects of paleoartists, we’ve run two editions of our survey, in 2017 and 2019. Read the latest report here. LITC Palaeoartist Index We’ve been at this whole paleo-blogging thing for over a decade now, so you can imagine that we’ve featured a lot of artists here – from illustrators to sculptors and animators. To help make it easier to peruse all of this art, we’ve created an alphabetical index. Paleoart Shop Index People love paleoart. Paleoartists love selling paleoart. To help the two come together, we have created a crowdsourced index of paleoartists selling their art."
