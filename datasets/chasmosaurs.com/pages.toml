full_description = "Vintage Dinosaur Art: Dinosaur (DK Revealed) Vintage Dinosaur Art November 28, 2024 Regular readers (we have some, right?) will be aware that our sole criterion for a book’s inclusion in Vintage (=Old) Dinosaur Art is that it be 20 years old. Consequently, books from the early 2000s have now entered our purview. It was a time when, in the wake of Walking With Dinosaurs, publishers demanded increasing numbers of CG creations in lieu of more traditional illustrations and model photography. Dorling Kindersley (aka DK) very much followed this trend, inserting very dodgy… Continue Reading 1 Comment By Marc Vincent Vintage Dinosaur Art: Záhada Dinosaurů – Part 1 Vintage Dinosaur Art April 16, 2024 Today’s book has gotten some attention recently on some of the palaeoart-centered Facebook groups we frequent. It features little-seen but high quality art from the nineties. Once I saw it, I knew I had to track this book down. This was not straightforward. Not only is this book only available in Czech, it is only available from Czech booksellers that only ship to Czechia. I managed to nab a copy off Rostislav Walica, so kudos to him. I now (maybe?)… Continue Reading 8 Comments By Gemma Hazeborg Vintage Dinosaur Art: Dinosaurus – Part 1 Vintage Dinosaur Art March 5, 2024 When I first started writing for this blog – many, many years ago now, possibly even as long ago as 2009 – I was accused of being overly-critical. “Who cares if a dinosaur’s gross anatomy shifts considerably from one illustration to the next?” “You’re pissing all over a classic!” You know, that sort of thing. And the accusers had a point, at least some of the time. As I’ve got older I’ve certainly mellowed – not to mention got to… Continue Reading 5 Comments By Marc Vincent Vintage Dinosaur Art: In The Presence of Dinosaurs – Part 2 Vintage Dinosaur Art July 21, 2023 So here I am once more, in the playground of the finer arts. This is the 21st century, and we’re looking at one of the definitive dinosaur books of the year 2000, illustrated or rather painted by the talented Larry Felder. If you’ve seen part one, you’ll know Larry’s depictions of Triassic and Jurassic creatures was, gorgeous though they may have been, somewhat indebted to Walking With Dinosaurs. In the Cretaceous chapters of In The Presence of Dinosaurs, his work… Continue Reading 8 Comments By Gemma Hazeborg"
