nd proper illustrated mass-appeal dinosaur books from before the 1970s, when Zdeněk Burian brought Life Before Man into every European home. It’s always cause for minor celebration whenever something older than that shows up that isn’t Knight or Zallinger. So imagine my delight when I rediscovered this book in my very own archives when I moved house last year. Oh yes, I remember this one. This very, very old one. How old? It dates from… Continue Reading 7 Comments By Gemma Hazeborg"
