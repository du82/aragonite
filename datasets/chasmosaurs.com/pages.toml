full_description = "Vintage Dinosaur Telly: The Magic School Bus TV review November 12, 2024 Seatbelts, everyone! A few weeks ago I reviewed The Magic School Bus in the Time of the Dinosaurs, and mused at the end that I might have to seek out the TV episode on the same theme…which was in no way an appeal for commenters to do the work for me and provide a link, oh no. (As if I’d be so lazy.) Nevertheless, Zain Ahmed obligingly provided a link to a YouTube video. Thanks, Zain! (Admittedly, it’s not exactly… Continue Reading 8 Comments By Marc Vincent Prehistoric Planet 2: Giant Paperclip TV review May 26, 2023 Whereas the first two episodes of Prehistoric Planet 2 took us to the Islands and Badlands, the final three transport the viewer to Swamps, Oceans and, er, North America. Why the sudden change of theme, to a continental locale rather than a type of habitat, in the final episode? It hardly matters, I suppose, if it means we get to see more of Prehistoric Planet‘s utterly fantastic T. rex. What’s more, in this series, I finally got what I really wanted… …That is, a… Continue Reading 0 Comments By Marc Vincent Prehistoric Planet 2: Snack Babies TV review May 23, 2023 It’s back! Already! This year, I don’t quite have the time to squeeze out a blog post after the release of every episode, but I’m still determined to mark the occasion in suitable fashion. So, I’ll post once today, having seen the first two episodes, and again on Friday. Can you believe that another season is already upon us? I guess that’s what Apple’s endless pit of money will buy you. That, and Darren Naish’s increasingly snazzy shirts. I’ll admit… Continue Reading 0 Comments By Marc Vincent Prehistoric Planet – A Modern Vision of the Past TV review Uncategorized June 5, 2022 I was only a year old when BBC’s landmark series Walking with Dinosaurs first aired, but I have to imagine watching it in 1999 must have felt similar to the way I felt watching Prehistoric Planet this week. Not since then has the age of dinosaurs ever been portrayed so believably. For the first time in a big-budget media project we’re getting depictions of Mesozoic life that isn’t plagued by concessions and strange design choices. Feathers are commonplace. Multi-ton behemoths… Continue Reading 4 Comments By Sophie"
