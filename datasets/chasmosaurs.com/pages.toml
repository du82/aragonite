full_description = "Vintage Dinosaur Art: Dinosaurs (Home Reference Library) Vintage Dinosaur Art February 18, 2025 In my further quest to avoid the DK Encyclopedia of Dinosaurs & Prehistoric Life from 2001 (which I do now own, at least), here’s another book from around that time – Dinosaurs, published in 2002 by Fog City Press. It’s a rather generic affair all told, but I’m sure there’s someone out there for whom this is an important childhood memory. Besides which, it features illustrations by Steve Kirk and Luis Rey (among others), not to mention an interesting mix of… Continue Reading 2 Comments By Marc Vincent Vintage Dinosaur Art: The Prehistoric World of the Dinosaur Vintage Dinosaur Art August 10, 2021 Or Norman: Into the Normanverse What book casts a longer shadow than David Norman’s 1985 The Illustrated Encyclopedia of Dinosaurs? Which dinosaur reconstructions are more iconic, more widely seen and more frequently copied than John Sibbick’s? What book has been referenced more frequently on these pages than the one we still affectionately call the Normanpedia? Will this whole review consist of rhetorical questions? Today, I want to talk about a book by David Norman that came out a mere three… Continue Reading 14 Comments By Gemma Hazeborg Vintage Dinosaur Art: Dinosaurium Vintage Dinosaur Art July 15, 2021 I check the copyright page, and I check it again. 1993? Really? Surely that can’t be true. Surely this book is at least fifteen years newer than that. But no. The proof is right there, undeniable, clear as day. What sorcery is this? Who stole a time machine? How is this book so good? That year again, that fateful year. 1993. The Year of the Dinosaur, according to ancient astrology that I made up. The deluge of dino books from… Continue Reading 11 Comments By Gemma Hazeborg Vintage Dinosaur Art: Life Before Man (The Emergence of Man) Vintage Dinosaur Art June 8, 2021 As you can well imagine, I’ve read a fair few dinosaur books from the latter half of the twentieth century, and while they are almost always dated in just about every respect, there are very few that stun me with their sheer strangeness. One can well understand outdated views on dinosaur evolutionary history, anatomy and biology, but it’s quite something else to encounter a book that’s such a culture shock that it might as well have emerged from a completely… Continue Reading 6 Comments By Marc Vincent"
