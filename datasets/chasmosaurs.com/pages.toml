full_description = "Vintage Dinosaur Art: Hubrecht at the Lyceum – Part 1 Vintage Dinosaur Art December 11, 2024 Once again: Marie Hubrecht. Are you tired of me talking about Marie Hubrecht yet? Because I’m not done. If you want more Hubrecht, check out my reviews of Verdwenen Werelden here, here and here, and our Verdwenen Werelden podcast episode here! This post is a direct companion to my last one, in which I detail the time I went to see the spectacular murals she made in the 1920s at the former Girls’ Lyceum in Amsterdam. These paintings have been… Continue Reading 5 Comments By Gemma Hazeborg Meeting Marie’s Murals Paleoart Gallery September 20, 2024 Have I told you about Marie Hubrecht? Wasn’t she the Dutch aristocratic lady turned suffragette turned idiosyncratic palaeoartist? After first finding out about her through the palaeoart exhibition at Teylers Museum, I fell in love with Marie’s work, initially just for its novelty. There’s simply no vintage palaeoart that looks like this. In the time of semi-realists like Knight, Harder and Zallinger, you just don’t get palaeoart that is stylized like this. Plus, how many palaeoartists are eccentric old lesbians?… Continue Reading 2 Comments By Gemma Hazeborg Podcast Show Notes: Episode 9 – Great Aunt Marie and David Armsby Podcast Show Notes August 29, 2021 In this long-awaited episode, we cross a big one from our wishlist as Natee, Niels and Marc tackle Verdwenen Werelden, the monumentally ambitious and even more monumentally strange masterpiece of the indomitable Maria Hubrecht. Natee gets a chance to put their art historian hat on once more. The journey off the beaten path continues as Niels interviews Scottish filmmaker and animator David Armsby about his upcoming Dinosauria series, an anthology of short animated films about dinosaurs. Is there a little… Continue Reading 1 Comment By Gemma Hazeborg Vintage Dinosaur Art: Verdwenen Werelden – Part 3 Vintage Dinosaur Art March 22, 2020 Here we are again with Verdwenen Werelden, Marie Hubrecht’s masterpiece and the gift that keeps on giving. As we always do, we’ve started off by showing you all the dinosaur stuff. Then, we went to the more recent past to look at some mammals. That leaves us with the many depictions of marine life Hubrecht put onto canvas with gouache, panache and all the homebrew passion of a determined amateur. Let’s, ahem, dive in. This is actually the very first… Continue Reading 7 Comments By Gemma Hazeborg"
