full_description = "Vintage Dinosaur Telly: The Magic School Bus TV review November 12, 2024 Seatbelts, everyone! A few weeks ago I reviewed The Magic School Bus in the Time of the Dinosaurs, and mused at the end that I might have to seek out the TV episode on the same theme…which was in no way an appeal for commenters to do the work for me and provide a link, oh no. (As if I’d be so lazy.) Nevertheless, Zain Ahmed obligingly provided a link to a YouTube video. Thanks, Zain! (Admittedly, it’s not exactly… Continue Reading 8 Comments By Marc Vincent Vintage Dinosaur Art: The Magic School Bus in the Time of the Dinosaurs Vintage Dinosaur Art October 22, 2024 The Magic School Bus franchise was a big deal at exactly the right sort of time for it to have impacted my childhood, but it completely passed me by – probably because I’m British, and it wasn’t quite as well known here. I do have vague memories of a fantastical yellow bus (which was a bit of an alien concept – the yellow school bus, that is) that could fly through space and whatnot, but that’s about it. A shame,… Continue Reading 1 Comment By Marc Vincent"
