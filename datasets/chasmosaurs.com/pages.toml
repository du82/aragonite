mberers of the forgotten, the detectives of dinosaurs. As the palaeontologist diligently searches the rocks and sediments, looking for traces of ancient life, so it is our calling to unearth the most dusty and ponderous tomes of outdated palaeontology, looking for ancient life reconstructions. And thus we come once more to the Victorians. Not the pioneers of palaeontology like Anning, Mantell, Buckland and the wretched Owen, but the second generation. Those… Continue Reading 4 Comments By Gemma Hazeborg"
