full_description = "All aboard for 2025 Attraction Review Personal reflection December 30, 2024 Not wanting the last post of the year to be a vanilla Vintage Dinosaur Art post featuring some filler art from 20 years ago presented a conundrum. What else am I supposed to do these days? A few different ideas came to mind – a bit of personal reflection, a review of a museum or other attraction that I’d failed to post about, or a humorous comparison of ‘expert reacts’ videos regarding dinosaur media. In the end, I decided to… Continue Reading 4 Comments By Marc Vincent Dinosaurs in the Dark at Ouwehands Zoo Attraction Review January 23, 2024 That time again: Another zoo in the Netherlands has been dinosaurified! Previously I showed you the dinosaurs that came to ZooParc Overloon, Dierenrijk and GaiaZoo. This time, it’s Ouwehands Dierenpark in the town of Rhenen that has been visited by creatures from millions of years ago. There’s a twist, though; whereas the previous attractions centered around the usual models and animatronics, this attraction is a dinosaur-themed edition of Ouwehands’ yearly Light Nights winter event. That means these dinosaurs are light… Continue Reading 6 Comments By Gemma Hazeborg Dino Weeks at Dierenrijk Attraction Review May 28, 2022 So, you might imagine we’ve all been spoiled a bit lately, what with Prehistoric Planet and all. It’s easy to develop high expectations, and to expect everything to be subject to the same sublime standards of visual quality and scientific accuracy. Lest we get too comfortable, I think it prudent to take a stroll among some good old fashioned ugly Chinese dinosaur animatronics. It’s good to be reminded that dinosaurs in public spaces can still be rubbish, too. Take it… Continue Reading 2 Comments By Gemma Hazeborg Dino Weeks at ZooParc Attraction Review October 29, 2020 Dinosaurs and zoos, they go together like peanut butter and jelly. A lot of the major zoos in the Netherlands have some sort of dinosaur presence, from the beautiful sculputures at Artis Amsterdam to the Dinobos at Amersfoort (remind me to talk about GaiaZoo’s Dino Dome someday). Not to be outdone, the small, regional zoo known as ZooParc Overloon has been taken over by animatronic dinosaurs for the autumn of 2020. The dinosaurs are some of the ones also found… Continue Reading 3 Comments By Gemma Hazeborg"
