full_description = "Podcast Show Notes: Episode 37 – Farewell TetZooCon Conference Podcast Show Notes October 30, 2024 As every year, Marc, Natee and Gemma visited TetZooCon, Darren Naish’ big annual London event about animals, palaeontology, palaeoart and all things tetrapod. And this was a special edition indeed. Not only has this been the last ever edition of the Tetrapod Zoology Conference in its current form (more on which on the show) but we actually gave a talk this time! And what’s more, the talk has been recorded and is included in full on this very special, extra… Continue Reading 3 Comments By Gemma Hazeborg Podcast Show Notes: Episode 23 – Invicta Toys and Rebecca Dart Podcast Show Notes January 31, 2023 Our first episode of 2023 celebrates classics of two different kinds: the masterly palaeoart of the Queen of #DrawDinovember, Rebecca Dart, which surely merits the stamp of ‘modern classic’; and, in what Niels has determined is a one-off for us and not the beginning of a foray into collectibles, the enduring charm of the Invicta dinosaur toys commissioned by London’s Natural History Museum, beginning in 1974. How does Rebecca work her timeless magic on her snapshots of deep time, and… Continue Reading 0 Comments By Natee Podcast Show Notes: Episode 14 – Zallinger Jr. and Greer Stothers Podcast Show Notes February 4, 2022 Slightly late but sure as rain comes the fourteenth episode of the world-famous Chasmosaurs Podcast! Natee, Marc and Niels dive into the Zallinger dynasty, as after covering Rudolph’s famous mural, this time we shine a light on his son Peter Zallinger. Natee interviews Greer Stothers, who has a book coming out called Kaleidoscope of Dinosaurs, a great title for a book. We also have a brief interview with Tom van der Linden, who may just have discovered a new dinosaur!… Continue Reading 2 Comments By Gemma Hazeborg René Fraaije: How to Build a Museum Interview Museums February 18, 2020 Just outside the small town of Boxtel, close to the city of Eindhoven in the South of the Netherlands, lies the Oertijdmuseum, or the Museum of Ancient Time. It’s been on my radar for some time as a destination for all things palaeontological. In 2018, the Oertijdmuseum received national media attention thanks to their acquisition of a Diplodocus skeleton. It is actually a composite of three subadult individuals, collectively named “Kirby”, after their discoverer, Hans-Jakob “Kirby” Siber. The associated information… Continue Reading 7 Comments By Gemma Hazeborg"
