full_description = "Vintage Dinosaur Art: Oxford First Book of Dinosaurs Vintage Dinosaur Art January 17, 2025 As the sort of unremarkable kids’ book that you might find buried in a stack at a charity shop, looking a little forlorn (but I found on eBay, of course), you might not expect too much from the Oxford First Book of Dinosaurs (part of a series that included further volumes on animals, art, maths, science, and space). As you’ve no doubt guessed, it uses a lot of art recycled from earlier books. Ah, but in this case, it’s a… Continue Reading 4 Comments By Marc Vincent Vintage Dinosaur Art: The Dinosaur Action Set (Book One!) Vintage Dinosaur Art September 17, 2024 Today’s entry is rather similar in concept to the later Dinosaur Park, which I reviewed back in 2020, but quite unlike the DK ACTION PACK (in spite of the rather similar title). It would appear to be a straightforward book at first glance, but upon opening an instruction is immediately given to prise out the staples and then remove all the pages. What’s this, a book that wants you to destroy it?! Of course not – well, sort of, actually,… Continue Reading 3 Comments By Marc Vincent Vintage Dinosaur Art, maybe: De dinosauriërs (Kennis Compact) Vintage Dinosaur Art July 13, 2024 The concept of “bad art” has been occupying my mind lately, for reasons that will hopefully become clear in due course. Bad palaeoart, especially. It is my firmly-held belief that even the shoddiest work made by human hand has infinitely more value than any image artificially created by a learning, plagiarizing algorithm. No matter how many works by Tony Gibbons and F. John we have to plough through on these pages, this will still be essentially true. All contributions to… Continue Reading 9 Comments By Gemma Hazeborg Podcast Show Notes: Episode 35 – Snowball and the Raptor Boys Podcast Show Notes June 30, 2024 We’ve had a month off, but the famous LITC podcast is back in full strength with more fresh news, nostalgic art reviews and exciting interviews! After discussing the new films and documentaries that are coming our way, we review some very English palaeoart from the late 1970s by the unsung Peter Snowball. After that, Natee and Marc interview the Golden Boys of Dromaeosaurs, 3D sculptor Ruadhrí Brennan and returning LITC interviewee Jed Taylor, whose incredible Velociraptor sculpts have set last… Continue Reading 2 Comments By Gemma Hazeborg"
