full_description = "Yearly Archives: 2010 Hello, This is Charley Posted on December 29, 2010 by Charley ᐃ ᐁ Hello, this is Charley. I am filling in for the host of this blog while he is on vacation. Isn’t that the way it always works. You have to wait for the man to give you some crumb of a chance, and when you do get it, no one is looking. Everyone is out having a party, or returning clothes at Land’s End, but sure-as-shooting not reading this. So I may as well say what I want. He doesn’t control me. And probably won’t be reading this either. So I want to talk about cowboys. That’s right, cowboys. The kind that live on the range and boil coffee over a fire and cuss and punch guys who get out of line with the ladies. Oops, someone just texted me, I gotta go. Later. Be the first to comment | Read other posts in Creativity Penumbra This Posted on December 21, 2010 by CHC ᐃ ᐁ Apparently there was a total lunar eclipse last night that was visible just about everywhere in North America if your conditions were right. I thought it was pretty hard to see it here in North Carolina at 3:17 am, from my bed, with my eyelids closed. Read 3 comments and add yours | Read other posts in News and Comment Little Place I Used to Work In Posted on December 20, 2010 by CHC ᐃ ᐁ This was the East Wing of my office. The West Wing was another foot to the right. Be the first to comment | Read other posts in Life The 100 Billionth Person Content © Craig H Collins 2025 ᐃ ᐁ"
