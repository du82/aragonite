title = "2013 | The 100 Billionth Person"
full_description = "Yearly Archives: 2013 Another Charley Christmas Posted on December 24, 2013 by CHC ᐃ ᐁ Hey, this is Charley again. Maybe you remember me. The de-ranged cattle baron that runs this blog sometimes asks me to take over during the holidays. “Have fun,” he says. Awesome, man. It’s as much fun as building a mud fence, sitting in this cubicle trying to come up with Christmas-time entertainment for the three or four coffee-boilers who read this blog. Sorry if my enthusiasm is making your acid reflux flare up. Eat a peach. So here we go. I thought I would share some of the Christmas songs I sing on the range as I wait for an increase in the cowboy minimum wage. I call them I Don’t Carols. Silver Hell Silver Bells, Silver Bells It’s Christmas time in the city Ring-a-ling, hear them ring. Soon they will be drowned out by street preachers with bullhorns. Jingle Hell Jingle Bells, Jingle Bells Jingle all the way Oh, what fun it is No, it’s not, it’s really cold out and it sucks. Hey hey hey hey hey. Rudolph the Brown-Nose Reindeer Rudolph the Red-Nosed Reindeer had a very shiny nose And if you ever saw it, you would even say it glows All of the other reindeer used to laugh and call him names They never let poor Rudolph join in any reindeer games. Then one foggy Christmas Eve, Santa came to say: “Rudolph, with your nose so bright, won’t you guide my sleigh tonight?” Then how the reindeer stomped their hooves and shouted, “Santa’s favorite, eh?” Rudolph the Red-Nosed Reindeer wouldn’t live to see another day. Frosty the Snowman Frosty the Snowman was a hoppy amped-up soul With an old crack pipe, a stuffy nose and two lines made out of blow Down to the village, with some crystal in his hands Running here and there, all around the square, Saying, “Man, these bugs are crawling all over me!” Little Gunner Boy Hear my guns speak loud Rat-tat-a-tat-tat Second Amendment proud Rat-tat-a-tat-tat My guns defend this land Rat-tat-a-tat-tat Not from my cold, dead hand Rat-tat-a-tat-tat Tat-a-tat-tat Tat-a-tat-tat Now your Christmas can be just like mine. Until next time – Charley Be the first to comment | Read other posts in Humour Bon Voyage Posted on December 22, 2013 by CHC ᐃ ᐁ My wife and I are finally making a return visit to France next spring, our 40th anniversary follow-up to the “trip of a lifetime” our family enjoyed in 1995. I am the designated travel planner. Of the two of us, I am the spouse more willing to put time and energy into reducing the chance of disappointment and increasing the likelihood of satisfaction, so I pretty much take over the planning process. I do touch base with her on the major points. I am guessing that many, if not most, couples have a similar dynamic regarding travel. This trait of mine is a blessing and a curse. I enjoy surprise but hate unpleasant surprises. It is next to impossible, however, for one to grant admission to the element of surprise without allowing the unexpected or unsavory to slip through the door. One’s tolerance for the unexpected negative experience is called resilience. I do not want to overestimate my resilience when I am an ocean away from home and a language away from the only one I can understand. And so I plan — and I enjoy it. We intend to spend two weeks in France: one week in Paris to explore its museums in a way we could not with our children (we lost Peter, or actually he lost us, in the Louvre!) and another week in the Dordogne region of central France, where hills, caves, castles and duck have established a dynasty. The first draft of my plan had us spending the first week in Paris and the second in the Dordogne — until I realized we would have to waste an entire day at the end of our trip, just to grab the late-morning flight from Paris to the USA. It dawned on me that it would be smarter to start our trip in the Dordogne (by taking the four-hour high-speed-train from the Paris airport to Bordeaux) and end our trip in Paris, with only a short train ride from our hotel to the airport the morning of our departure. So, I have booked the flights, reserved the hotels and rented the car we will use to explore the Dordogne. I have scouted out restaurants that TripAdvisor users recommend. I have looked at train schedules, car rental agency hours (this is important — they tend to close in the afternoon) and market days in the villages of the Dordogne. I am looking at handheld translation devices, but I don’t hold out much hope for their utility. I am now trying to figure out how I can make restaurant reservations and phone calls while we are overseas.* I run the risk here of destroying all sense of anticipation and replacing it with unrealistic expectations of a trip (dare I call it an adventure?) unfolding according to plan. So I must (must!) leave some hours unscheduled, some paths unexplored (in spite of the temptation to visit via Google StreetView) and some restaurants unreviewed, to allow for the pleasant surprise and, yes, the possibility of disappointment and stress. ______________________ In my later years as a research engineer for Eastman Kodak, my supervisor (who gave me unprecedented latitude and trust I will always be grateful for) approached me about taking a new position in a different department, to broaden my horizons so to speak. I was pretty burned out at the time, having recently dealt with a heart attack scare (which turned out to be a stress-related issue) so I was resistant to the idea. I recall that our talk about this turned to sailing metaphors, as he was a sailor — and I was not — and it struck me at that time just how different we were. My supervisor embraced life as a sailor, anticipating and handling whatever the next wave or wind had in store. But my thinking was, what’s the point of venturing into dangerous waters? I had my health to protect and nothing that important to prove. [I didn’t take the position in the other department at that time but did so a few years later when I felt more resilient. It would be my next-to-last assignment before I signed up for the latest Kodak separation package and left the company. Broad horizons, indeed.] That same supervisor had been responsible for my first trip to France, my first anywhere overseas. He was trying to build bridges between Kodak’s talented enclaves in the USA, France, England and Australia, and so he arranged a couple of conferences for us to share ideas and other ways of doing things that we might apply in our own workplaces. This not only opened my eyes but made me feel in some small way a citizen of the world, not just another Suburban-American. He was and is a sailor, a seat-of-the-pants adventurer. I am a course-charter, a navigator. He may not agree but I think such people need each other. Happy Christmas, Guy. __________________________________________________ * It has been 18 years since we visited France. A nice dinner for two with wine cost us about 500 francs then. The last time someone used francs to pay for dinner in France was 2002. Read 3 comments and add yours | Read other posts in France A Passing Thought Posted on December 20, 2013 by CHC ᐃ ᐁ I would like to live in a world where we bestow tributes, remembrances and adulations for a person well before he or she dies, rather than on the day following his or her passing. Tens of thousands gathered to mourn the loss of Nelson Mandela and celebrate his being, when he could no longer appreciate such a gesture. Peter O'Toole in 2003, receiving his honorary Oscar (AP) The Kennedy Center Honors and the Lifetime Achievement Award presented by the Academy of Motion Pictures are rare examples of organized public tribute to fellow humans while they are still alive. We need more celebrations of this kind. I think Peter O’Toole and Johnny Cash would have agreed, as would our own friends and loved ones. Be the first to comment | Read other posts in One-Foot Putts The 100 Billionth Person Content © Craig H Collins 2025 ᐃ ᐁ"
