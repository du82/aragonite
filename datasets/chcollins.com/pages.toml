title = "2017 | The 100 Billionth Person"
full_description = "Yearly Archives: 2017 2018 Reading List Posted on December 31, 2017 by CHC ᐃ ᐁ The new calendar year means that it is time for me to update my reading list. There is some irony in my writing about or even maintaining a reading list, when the number of books I actually finish each year is pretty low. (According to Pew Research, the typical American reads four books a year. That makes me sub-typical.) Nonetheless, I do consume page-based material now and again and, as has been my habit, I will share a few thoughts about what I have read since my last update, and what I intend to read in the coming year. Let’s start with… The Books I Abandoned These forsaken texts included The Best Writing on Mathematics 2013, edited by Micrea Pitici, and Everybody Lies by Seth Stephens-Davidowitz. With respect to the former title, the innocent preposition on threw me off: I was expecting to read a book of mathematics but instead discovered that it was about mathematics, especially its teaching and practice. That’s different. And not very interesting. Conversely, everything you need to know about Everybody Lies is contained in its title. One-third of the way through, I decided that there was enough meat here for perhaps a long essay in The Atlantic, but not a book. I become impatient with high-filler writings and I feel no guilt when I quit them. One item of interest: “More than half of citizens who don’t vote tell surveys immediately before an election that they intend to, skewing our estimation of turnout.” (Stephens-Davidowitz) The Books I Finished I finished Giant of The Senate (2017) by Al Franken. Now, Al Franken himself is finished. That said, his book was amusing. He discussed some of the poor-taste comedy writing he did before he became a Senator. He expressed his admiration for the late Paul Wellstone. He had little to say on the topic of being a jerk. I also finished Gaming the Vote by William Poundstone (2008). He devoted most of the book to illustrating flaws in voting systems, after which he asserted that no voting system is perfect. But Poundstone could not hold himself back from proposing his own imperfect system, one which will never see the light of day. Way back when, I read another of his books, Prisoner’s Dilemma (1992). His earlier work was far more coherent, content-rich and informative than Gaming the Vote. After a long and arduous battle, I finished Sleepwalkers (2012), a dense account of the causes for World War I by Christopher Clark. This book first appeared on my reading list in 2015. It was an exhaustive (and often exhausting) narrative. Spoiler alert: the cause for war was equal parts Russian paranoia, French insecurity, Austria-Hungary disintegration, and ineffective signaling of intentions among pompous European leaders. I finished Arguably by Christopher Hitchens. Readers of this blog know that Hitchens is one of my favorite writers. I admire his vocabulary, his literary background, his incisive remarks, and many of his arguments and viewpoints. One of the most compelling stories was of Hitchens subjecting himself (voluntarily) to waterboarding by U.S. Special Forces. I had thought Arguably (2011) was his final book, but no, that would be Mortality (2012), which I have yet to read. Being that Mortality comprises essays that Hitchens wrote of his own fatal illness, I think I will wait a while to take on that volume. I finished The Visual Display of Quantitative Information (1983) by Edward Tufte, a work I first learned of decades ago via a full-page advertisement in Scientific American. It was too expensive for me at the time, else I would have ordered it. I forgot all about this book until last year, when I was helping my friend Eric clean out his office and we found a copy. Eric generously regifted it to me instead of tossing it in the dumpster. I enjoyed reading it, but this edition seemed dated in terms of how charts are prepared in the digital age. And I would have appreciated more guidance from Tufte on ways to present multi-dimensional data. However, as others have noted, this work was intended to be more of a style manual than an idea book, and I will have to be satisfied with that. Finally, I finished (in two days, no less) Between the World and Me by Ta-Nehisi Coates. This 2015 work was written as a letter to his 15-year-old son in the wake of the shootings of Trayvon Martin and Michael Brown and the choking death of Eric Garner. To say it is powerful is cliché — it is Coates’ unfiltered view of the stark realities that non-white people face as they navigate the streets of America. His work brought the ongoing oppression of non-whites into sharper focus for me, but it left me wanting (or despairing) for ways we might effectively address it. Here are a few highlight-worthy excerpts from the books I finished: “Most principles of design should be greeted with some skepticism, for word authority can dominate our vision, and we may come to see only through the lenses of word authority rather than with our own eyes.” (Tufte) “In Vietnam, [Roy] Moore … was so unpopular that he slept with sandbags around his bunk to protect him from fragmentation grenades. At the University of Alabama law school, a professor tagged him ‘Fruit Salad’ because he was always coming up with crazy ideas. One of his crazier ideas was to become a professional karate fighter. He tried this in the early 1980s, after he resigned an assistant D.A. post and before he moved to Australia to become an outback cowboy.” (Poundstone) ‘“Pretty soon, we should be able to get electoral politics down to a basic newspeak that contains perhaps ten keywords: Dream, Fear, Hope, New, People, We, Change, America, Future, Together. Fishing exclusively from this tiny and stagnant pool of stock expressions, it ought to be possible to drive all thinking people away from the arena and leave matters in the gnarled but capable hands of the professional wordsmiths and manipulators.” (Hitchens) “The streets transform every ordinary day into a series of trick questions, and every incorrect answer risks a beatdown, a shooting, or a pregnancy.” (Coates) The Books I’m Reading (or Intend to Read) I am two-thirds of the way through my re-reading of Labyrinths, the collection of short stories and essays by the Argentine fantastist-absurdist Jorge Luis Borges. My second reading has made a difference in how I interpreted and appreciated several of the stories, but for others it was like watching reruns of The Twilight Zone when you know the ending. If I don’t finish re-reading the entire collection, that will be okay. And I am still reading New and Collected Poems: 1934-84 by Roy Fuller, a British writer admired by Christopher Hitchens. Fuller is not a light read. I pick up the book when I am on the elliptical — it keeps me from glancing at my workout time every three minutes. On the bottom shelf of my end table, waiting their turn, are the titles The Elegance of the Hedgehog by Muriel Barbery, Freedom by Jonathan Franzen, Horizon’s Lens by Elizabeth Dodd, Racisms by Francisco Bethencourt, The People Yes by Carl Sandburg, Them Birds Are in Your Garden and Other Vignettes by John Bush (my seventh-grade history teacher) and three issues of Topics in Recreational Mathematics edited by Charles Ashbacher. Most of these works are fiction, which I rarely read, so it should be an interesting year. Standing upright on the bottom shelf of our bedroom bookcase is The Autobiography of Mark Twain. I embarked on this read many years ago but set it aside when the ponderous volume began to feel more scholarly than fun. I doubt that Clemens himself would have cared for such a heavy (and heavily-annotated) book, but I have not quite given up on it. This brings to mind a line from The Shape of the Sword by Jorge Luis Borges: “…For a gentleman, only lost causes are attractive.” (Borges) Happy New Year to all. Read 5 comments and add yours | Read other posts in Life Vibes are Real, New Research Shows Posted on December 26, 2017 by CHC ᐃ ᐁ I bring to your attention recently-published findings from the Center for Higher Learning at the University of Newer New Mexico. A team of UNNM researchers believe they have discovered the basis of the phenomenon that most of us call “vibes” — the human ability to transmit positive (and often negative) thoughts in order to influence another’s emotions and/or behavior and/or the outcome of an upcoming event. Vibes are most likely to be detected in sports bars and hospital waiting rooms, said UNNM neurophysicist Lionel Trane. “Wherever there are strong emotions or intense longing is a good place to find vibes,” Dr. Trane explained between his studied sips of white zinfandel. “Take singles bars. Our team observed that people who frequent singles bars are finely attuned to good and bad vibes given off from other patrons. We ventured that the transmission, reception and interpretation of vibes leads to fewer false moves and rejections and more satisfying encounters. We thought that some interesting physics might be behind this.” So Dr. Trane and a cooperative cadre of graduate students dedicated themselves (thanks to a grant from the Templeton Foundation) to attend singles bars three nights a week for an entire semester in order to better study this phenomenon. To detect vibes, the students used a device designed by Dr. Trane and his fellow research associate Wes Crusher. The detector is essentially a small parabolic dish that fits on top of a Pittsburgh Pirates baseball cap worn by the student. When the student entered a venue, signals from the dish would be transmitted to a van parked outside, where Dr. Trane and Mr. Crusher recorded and monitored the data stream while fending off the suspicions of the bouncer. Performing a study in this setting was not without its difficulties, according to Dr. Trane. As he explained, many of the vibes they picked up were of the variety, “Who is that guy with the dish on his head?” Trane and Crusher spent an entire hunker-down weekend filtering out such spurious signals, along with the static generated whenever the receiver was splashed with beer or was jostled by angry subjects who discovered their vibes were being intercepted. After the research team eliminated the bad data — along with all the other data that did not support their hypothesis — they submitted the remaining signals to spectrum analysis. “It was full spectrum,” said Mr. Crusher. “None of that phasers-on-stun stuff — this was serious business.” Crusher shared with us their analysis of the vibe diagrams (below): “Vibes have chracteristic colors. Green means hope,” Crusher said. “Red means red. This is the most convincing evidence of vibes ever.” But Trane objected. “Sorry, Mr. Crusher. Red means wolf. We discussed this at the campfire last night and you agreed with me.” We watched as Trane and Crusher then grappled with each other on the dirt floor. On an impulse, I asked Trane whether Carlos Castaneda’s experiences were real or imagined. Trane looked at me with hardened eyes and then suddenly grasped Crusher’s midsection, entwining himself into its glowing emanations and hurling himself into the nether. I asked Crusher one last question. “It’s the thought that counts,” he answered cryptically, then he turned and walked into the desert night, leaving us with only the vibe diagrams and our fragile memories. Be the first to comment | Read other posts in Creativity Thoughts at Large: 51 Posted on December 21, 2017 by CHC ᐃ ᐁ • There are cruise people and will-never-do-a-cruise people. I’m in the second category. The idea of being confined to a ship for seven days with periodic disembarkments does not appeal to me in the least, no matter what amenities are offered. But as I have learned, will-never-do-a-cruise people will never convince cruise people of our essential nature. Cruise people say, “You don’t know what you are talking about — you have never been on a cruise! You would love it if you tried it!” My reply is, neither of us have climbed Everest, but that does not preclude us from dreading the ordeals of the attempt. • Water is often described as a tasteless, odorless liquid. But my friend Luxa from Orak disagrees: she tells me that water tastes like cwonri and smells like futi and she hates it. Luxa also says that, on her planet, water would have to be heated in order to liquefy it and make it drinkable. But she doesn’t understand why anyone would want to do that. • One sure way to identify a racist: he or she mentions green, orange and purple people while claiming to be free of prejudices. • Some American citizens seem to think that the First Amendment guarantees their right to remain ignorant and uninformed. Freedom From Information, if you will. • I often ask myself why I still have so much bitterness-combined-with-nostalgia about my career at Kodak. It was like a painting I worked on for thirty years that only I appreciated and then it got thrown into a dumpster after I left. I’ll get over it, eventually. • I know a woman who used to be a dietician. But she was bothered by the fact that her occupation started with the letters die. So she decided to call herself a nutritionist. • In 2018 and every year after that, I pledge to myself to do something creative every day. I am not going to be famous. I may or may not ever hang one of my paintings in a gallery (as if that is the hallmark of artistry) or sell one from a 10×10 tent at a craft fair. But I do need to create. The idea of devoting the last quarter of my life to doing something creative every day appeals to me. And it seems to be attainable, if health circumstances allow. So, in 2018, I intend to keep a daily record of my creative output, so that no day goes by. • In 2018, I will also keep a daily record of well-intentioned things I do for other people, again so that no day goes by. • Americans chronically overestimate the altruism and goodwill of other Americans. Asserting America’s essential decency is a national religion, with Norman Rockwell its honorary bishop. But I am as skeptical of this religion as I am of any other. I would say 20% to 25% of Americans from all walks of life and political persuasions are self-absorbed schmucks who don’t give two damns about the fellow Americans beyond their own circle. Indeed, one’s very concept of fellow American dissipates rapidly upon reading the comment section of any local newspaper article. • People who buy their wine-drinking friends wine aerators for Christmas have no clue what to give them but do remember that they drink wine. Read 3 comments and add yours | Read other posts in Thoughts @ Large The 100 Billionth Person Content © Craig H Collins 2025 ᐃ ᐁ"
