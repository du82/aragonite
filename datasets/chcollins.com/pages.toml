title = "The 100 Billionth Person | Commentary, Creativity, Curiosity by Craig H Collins"
full_description = "Point/Counterpoint 2025 Posted on February 28, 2025 by CHC ᐃ ᐁ “Volodymyr, you ignorant slut!” Read 6 comments and add yours | Read other posts in News and Comment Trump Hits Humor Industry with Tariffs, Citing Insecurity Posted on February 12, 2025 by CHC ᐃ ᐁ In a move certain to be challenged in a real court (unlike a Florida court or a tennis court), President/Ex-President/President-Redux Trump today announced sweeping tariffs on any humor that makes fun of him or those whom he claims to represent. So, with a heavy heart, I have made the decision to no longer say anything that is remotely sarcastic or satirical about the Trump administration, Elon Musk, the hair-and-makeup artists for Pam Bondi, Tulsi Gabbard and Kristi Noem, or Pete Hesgeth’s public-relations team, which must now out-number the remaining staff at USAID. The sad fact is, I can’t afford to pay tariffs on something that makes no money for me but only a laugh. President Trump, I bow to your superiority in navigating and exploiting American culture. You are not funny and I will not make fun of you or your cadre ever again. Read 8 comments and add yours | Read other posts in News and Comment Why I Don’t Go to Your Restaurant Posted on February 7, 2025 by CHC ᐃ ᐁ Living in an Appalachian-chic tourist town (I’m talking about you, sweet home Asheville) is a lot different than living in a Northern white-collar manufacturing hub like Rochester, New York, once was. And for present purposes, by living I mean eating. When we lived “up north” (as we now say) during Rochester’s big-corporation heyday, nearly every restaurant was an American restaurant, whether Italian-American, Greek-American, Asian-American or Urban-American. You had all kinds of bar-and-grills, mom-and-pop’s, family-style restaurants and special-occasion places to choose from based on your mood and budget. And you would usually be handed an American menu, in that most of the classic categories (meat, poultry, seafood, pasta, vegetarian) were represented. But that’s a rarity here in tourist-centric* Asheville. Don’t get me wrong, I’m not all Mr. Freedom Fries when it comes to restaurant offerings. But it does disappoint that my fair city has so few American options (as defined above) but instead is dominated by niche dining. Every new or newly-owned purveyor of comestibles in this area seems obliged to make the equivalent of an artist’s statement which invariably speaks less about their food than about their concept: the supposedly unique way that the establishment intends to serve its community through its culinary creations. Here are just a few easily-retrieved excerpts from popular local restaurant sites: (A) We believe in the importance of working locally, not just using ingredients from our surrounding area, but also in our contribution to the community. The success of our restaurant has always been closely entwined with the health and progress of our community. For over 40 years we have supported the arts, local-needs and education programs. Menu entrees: 5. Entree prices: $22 (burger) to $48 (ribeye). (B) We believe in spending our money in the local community of farmers, makers, artists, and other business ventures. We know that energy and capital infused in the local community creates a healthy economy. Menu entrees: 8. Entree prices: $29 (mushroom ramen) to $58 (8 oz filet). (C) Founders [redacted] are avid travelers. When landing in a new city or town, they always seek out the restaurants loved most by locals. They have learned that locally-owned restaurants are the best way to experience good food and authentic connection between customers and staff. Quality cuisine and authentic connection are woven into the ethos of these local gems. … Our commitment to offering a thoughtful menu made with locally sourced seasonal ingredients, coupled with the care we’ve taken to establish meaningful connections with Appalachia’s growers and purveyors, has been the foundation of [our restaurant’s] standards since opening in 2009. Menu entrees: 8. Entree prices: $30 (lumache pasta) to $55 (beef tenderloin). (D) When it comes to our sourcing, we set ourselves to a higher standard. We are proud to use all-natural anti-biotic free chicken. Feeding someone is always an act of love, and that starts with the chickens. Menu entrees: 6. Entree prices: $8 (chicken tenders) to $12 (chicken club sandwich). (E) [Our restaurant] is a guided journey into the culinary treasure troves of Spain. Our collection of restaurants, online marketplace, wine club, and culinary journeys create a portal to Spanish culture. [Our founders] built [this business] on its Spanish meaning, “heal yourself.” They believe that discovering new flavors can unite people in a delicious moment of wonder and joy that cures the soul. Menu entrees: 6. Entree prices: $22 (lamb skewers) to $37 (grilled trout). (F) [Our restaurant’s] HVAC system features a Reme-Halo IAG hydro-peroxide/zinc ionizing blue light installed inline with its filter. Allergens, bacteria, viruses, and pollutants filtered from the air all meet their demise before air is recirculated in the restaurant. We will not tolerate fur from animals as attire. If we encounter it in the restaurant, we’ll ask (maybe politely) that it be removed from the building. Menu entrees: 6 or 7. Entree prices: $19 (masala uttapam) to $26 (seitan piccata). (G) I believe in the power of the table, the value of passing food, and of sharing stories and listening. These moments around a shared table deepen the ties between people we care about, in turn strengthening the web of our families, friendships and communities. … As a chef, I have witnessed how sharing a meal can reveal insights and discovery – often unexpected – about who we are and why we do what we do. These experiences deepen the connections between us, connections that ultimately elevate our lives. Menu entrees: 5. Entree prices: $24 (carrot-parsnip farrotto) to $35 (beef short rib). These blurbs merely scrape the surfaces of the dishes soaking in our local kitchens’ sinks. I could serve up plenty more of this chow, but I suspect you and I have been given enough advice already on how we might elevate our lives in such fastidious fashion. Me, I’d prefer less pretension and more menu choices. __________ * Note to Our Fair Visitors: First, bless you for your contributions to our economy and I hope you enjoyed your meals here. But please keep in mind that all too many Asheville restaurateurs design their menus to appeal to your loosened wallets as opposed to serving the tastes and budgets of the local populace. Read 2 comments and add yours | Read other posts in Life The 100 Billionth Person Content © Craig H Collins 2025 ᐃ ᐁ"
