full_description = '''Interact! I value readers, subscribers, and interactions with you. I hope you will be a regular reader and a when-inspired commenter. Aside from my enjoyment of writing, comments are my only compensation. If you would rather write a note instead of a comment, please send it to the100billionthperson at your friendly online post-office gmail.com. My policy on comments is to allow readers to make the points they wish to make without tiresome counter-argument from me, as long as the tone is cordial and constructive. I am happy to provide a forum for other points of view. The fact that I may not respond to a reader’s comment does not mean I did not value it — rather it reflects my willingness to step aside and let people speak for themselves. For further info, see my Terms of Service. ° ° ° ° ° How to Subscribe Subscribers receive an ad-free email notice from the MailPoet service the morning after a new post appears, which is usually 3 to 5 times a month. To subscribe, enter your name and email below, check the not-a-robot-box (only if you are truly not a robot), then click the sign-up button. You will receive a confirmation email at the address you provided. Click the confirm link in that email and you will be good to go. #mailpoet_form_1 .mailpoet_form { } #mailpoet_form_1 form { margin-bottom: 0; } #mailpoet_form_1 p.mailpoet_form_paragraph { margin-bottom: 10px; } #mailpoet_form_1 .mailpoet_column_with_background { padding: 10px; } #mailpoet_form_1 .mailpoet_form_column:not(:first-child) { margin-left: 20px; } #mailpoet_form_1 .mailpoet_paragraph { line-height: 20px; margin-bottom: 20px; } #mailpoet_form_1 .mailpoet_segment_label, #mailpoet_form_1 .mailpoet_text_label, #mailpoet_form_1 .mailpoet_textarea_label, #mailpoet_form_1 .mailpoet_select_label, #mailpoet_form_1 .mailpoet_radio_label, #mailpoet_form_1 .mailpoet_checkbox_label, #mailpoet_form_1 .mailpoet_list_label, #mailpoet_form_1 .mailpoet_date_label { display: block; font-weight: normal