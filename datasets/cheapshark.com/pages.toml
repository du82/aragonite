["https://cheapshark.com/about"]
title = "About | CheapShark"
description = "We're all about tracking PC game sales. We let you easily compare prices on stores such as Steam, GOG, and GreenManGaming."
full_description = '''CheapShark was created in March 2012 with a very simple goal in mind: make finding the best game prices easy! Since then, we've made it our mission to bring you the best game deals, non-stop. We collect pricing data from digital game stores like Steam, GreenManGaming, GOG and GamersGate to make it easy to find exactly what you're looking for. To achieve this, we categorize our listings by store, let you browse and filter every deal, and provide an easy-to-use search tool when looking for specific games. We also host frequent game giveaways. When CheapShark started off, we initially tracked just 6 stores. Since then we've expanded quite a bit! One of the most important criteria for stores we choose to list is that they must have a direct relationship with the publishers and developers whose games they sell. You will never see any shady key resellers on the site, only official distributors. You can feel safe shopping at any of the stores we list! Hopefully this little bit of background info was helpful! As always, feel free to get in touch anytime. You can setup an email alert by clicking the info icon () next to a game's name on the homepage. On the browse page, you can click the mail icon (). On the search page you'll see a "Sign up for a Price Notification" button when you open any result. Yes! You can view the cheapest a game has ever been by clicking the info icon () next to any title on the home or browse pages. We rate deals on a number of factors. A few of these include how new the game is, what size discount is offered, the metacritic rating, and how fresh the deal is. Sure! Anytime you make a change to the filters, the URL is updated to reflect this. So, you can easily save your favorite settings just by bookmarking the page. Some stores pay us a percentage of the sale when you buy a game through one of our links. Purchasing games through CheapShark helps directly support the site! We're always looking for opportunities to expand. If you run a Youtube channel, Twitch stream, or gaming blog, and would like to work with us, get in touch!'''
