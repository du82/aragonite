itoring, CTI... External Resources var baseurl = "\/"; Information Gathering Company Informations General # Find informations about a company https://opencorporates.com # Giant database projects containing many informations # Can be about leaks, offshore companies leaks etc https://aleph.occrp.org/ https://offshoreleaks.icij.org/ # Notices / Gazettes for EU companies http://opengazettes.com/ # Societe.ninja can give great informations about a company https://societe.ninja/ # Pappers.com is dedicated to French companies https://www.pappers.fr/ # OSINT World Map with dedicated services per countries # Really usefull resource https://cipher387.github.io/osintmap/ Financial & Administrative # Legal and Financial informations (might not be free for full informations) https://www.societe.com/ https://www.infogreffe.fr/ https://www.crunchbase.com https://fr.kompass.com/ # European Justice Portal # Informations are not free https://e-justice.europa.eu # French justice https://jurisprudence.ninja/ Technical & Hosted # Find multiples sites owned by the same individual/company http://www.spyonweb.com # Look for reported vulnerabilities https://www.openbugbounty.org/ Jobs # Jobs https://www.glassdoor.fr/index.htm # Find people based on several websites https://recruitin.net/ Business # Call for tender → BOAMP https://www.boamp.fr/ # Brands https://www.inpi.fr/fr # Patents https://patentscope.wipo.int/search/en/search.jsf # Trading/Shipping overviews # Researching companies https://www.importgenius.com Geography # Cadastre FR https://cadastre.gouv.fr UK # Company Register # Very well documented https://beta.companieshouse.gov.uk/ China # OSINT on Chinese companies https://www.octocheck.com/ Switzerland https://gijn.org/2020/02/21/ou-trouver-des-donnees-en-suisse/ Federal Stats # Office Fédéral de la Statistique https://www.bfs.admin.ch/bfs/fr/home.html # STAT-TAB is another database where you can go further http://www.pxweb.bfs.admin.ch/ # Financial Stats https://www.efv.admin.ch/efv/fr/home/themen/finanzstatistik/uebersicht-staatsfinanzen.html # Taxation Stats https://www.estv.admin.ch/estv/fr/home/allgemein/steuerstatistiken/fachinformationen/steuerstatistiken.html # Unemployment Stats https://www.amstat.ch/v2/index.html # Import / Export https://www.gate.ezv.admin.ch/swissimpex/public/bereiche/waren/query.xhtml Companies # Central Commercial Index # You can get general informations about a company https://www.zefix.ch/ # Feuille Officielle Suisse du Commerce # More informations https://shab.ch/#!/gazette # FINMA (Autorité Fédérale de Surveillance des Marchés Financiers) # Blacklist for companies suspected of having an activity without autorisation https://www.finma.ch/fr/finma-public/liste-noire/ # In case of right violation, FINMA can publish it's final decision # Containing potential personnal data of concerned people https://www.finma.ch/fr/mise-en-oeuvre/instruments-d-enforcement/publication-de-la-decision-finale/ # There is also a register containing ongoing decisions https://www.sesam.search.admin.ch/sesam-search-web/pages/search.xhtml # National Whois is still up to date for the moment and can give some informations https://www.nic.ch/ # National Archives have a lot a documents https://www.swiss-archives.ch/ Judiciary # Federal Court is publishing laws https://www.bger.ch/fr/index/juridiction/jurisdiction-inherit-template/jurisdiction-recht.htm # Same for Penal Court https://bstger.weblaw.ch/index.php Others # Getting press article archive https://www.e-newspaperarchives.ch/ # Projet "LoiTransparence" https://www.oeffentlichkeitsgesetz.ch/francais/ # LobbyWatch # Each member of parliament is reviewed for transparendy https://lobbywatch.ch/fr Company Investigations Wayback Web Archive'''
