ormations about cybersecurity techniques and payloads. 2/ Content, commands and tools provided on this website can cause damages to websites and systems you might want to use them against. Remember that is is illegal to scan or attack a resource that does not belong to you. 3/ Content is taken from my personnal experience but also from several online resources and cheatsheets. I also made a resources sections, linking to several resources I found or used. This section has been made lately, so all informations might not be sourced (but well, I try to)! 4/ This website is for educationnal and "memo" purpose only. It does not aim to weaponize anyone. 5/ If you have any request (Something that is wrong, removing informations...) please do not hesitate to contact me on Twitter (@Haax9_). 6/ If this place have been useful to you, leave a star on the github project, or retweet/follow through Twitter (@Haax9_). Don't mind sharing it, as it could help others too =). 7/ I'm also posting some writeups (HackTheBox, CTF..) and other cybersecurity stuff on a blog, available in French and English ! --> https://haax.fr Updates 11/09/2022 (Yeah, it’s been a while!) - Web : - Tool : Bypass-URL-parser (Bypass 403) - Resource : Subdomains Tools Review: a full and detailed comparison of subdomain enumeration tools - Windows : - Resource : Azure Red Team Repo - Resource/Tool : Introduction to Azure Penetration Testing - Resource : I’m bringing relaying back: A comprehensive guide on relaying anno 2022 - Tips : BloodHound usage and tips for when builtin doesn't give results - Tools/Tips : Dumping SAM from Kali in 2022 (On recent Windows 10) - pypykatz - Tools/Tips : From Backup Operator To Domain Admin / SeBackUpPrivilege - OSINT : - Tool : F4Map (Geolocation/3D Vizualisation) - Resource : Le monde entier est un qactus (OpenFacto) - Phishing/CTI/OSINT : - Tools : The Spamhaus Project - Tools/Resource : Steal Credentials & Bypass 2FA Using noVNC - CTI : - Resource : Analyzing Network Infra