full_description = 'Open Source Intelligence (OSINT) Tools & Methodology Methodology OPSEC Firefox addons Buscador Frameworks Recon-ng Gasmak Omnibus Spiderfoot Datasploit Danger Zone ReconDog OSINT-SPY Belati sn0int Photon Dorks Google Dorks Twitter Dorks Github Dorks Technical Investigation IP Address Domain & URLs Subdomain Discovery MISC URL Shortener & Redirect Darkweb Investigation Cryptocurrency Investigation Others Company Investigations Information Gathering Wayback Web Archive Public Documents and Metadata Human Investigation Searching Someone E-mails Credentials Leaks Usernames Picture Investigation Phone Geolocation & GEOINT MISC - Tips & Tricks Platforms Hunting Google LinkedIn Twitter Facebook Instagram Snapchat TikTok Tinder Github Reddit Tumblr Amazon & Digital Ocean Buckets Parler Web Pentest Resources Discovery Content Discovery Parameters Sensitive Endpoints IDOR HTTP Request Smuggling Applicative Scans Web Application Scans Aquatone VHOST Scanning Web Application Firewall (WAF) Content Management Systems (CMS) Wordpress Drupal Joomla! Magento CMSMap MISC & Others Injections Server Side Injections SQL Injections NoSQL Injections LDAP Injections XPath Injections Server Side Request Forgery (SSRF) OS Command Injections SSTI Client Side Injections XSS Injections CSRF Injections MISC & Others Headers Injections File & File Inclusions File Upload Directory & File Discovery XML External Entity (XXE) and XSLT PHP Vulnerabilities PHP Filters PHP Functions PHP Serialization PHP Type Juggling Tricks & Others Tools BurpSuite Postman ffuf nuclei Attacking APIs CVE & Vulns exploits Bug Bounty Tips MISC Network Pivot Techniques LDAP & DNS Ports Scanning Masscan Cheatsheet Nmap Cheatsheet MAC & ARP Services Enumeration 21 - FTP 22 - SSH 25 - SMTP 53 - DNS 80/443 - HTTP/HTTPS 110 - POP3 119 - NTP 135 - RPC 139/445 - SMB 143 - IMAP 161/162 - SNMP 389/636/3269 - LDAP 995 - POP3S 1025 - NFS/IIS 1433 - MSSQL 1721/500 - VPN 3306 - MySQL 3389 - RDP 4555 - RSIP ICMP Tricks Shells methods Methodology Fully Interactive TTY Shell Webshell Reverse Shell Bind Shell Windows Systems Network and Domain Recon Out of Domain (No credentials) Domain Recon Domain Mapping Local and Physical Local Recon and Enumeration Physical Access Exploitation Exploitation Tricks Remote Execution Techniques CrackMapExec Impacket Kerberos RDP Exploitation File Transfer IIS IPv6 Privilege Escalation Automated Recon Tricks Services & Scheduled Tasks LSASS, Mimikatz, SAM Admin and Processes DNSadmins group Active Directory Delegations PrivExchange Windows Defender Azure AD AMSI Bypass and Evasion Spooler Service Specific Domain Groups Post Exploitation Techniques NTDS Database Silver and Golden Tickets DC Shadow Searching Informations Persistence Linux Systems Global Tricks (sysadmin) Recon and Enumeration File Transfer Privilege Escalation System Tricks Abusing Sudo Rights SUID Files Services Crontab Programing Languages Bash Python Perl Other Systems IPBX FREEIPA MISC Docker Stuff Amazon Web Services (AWS) Kubernetes Passcracking Hash & Files Hashcat Cheatsheet John Cheatsheet Cracking files Wordlists & Co MISC & Others Phishing, RedTeam and SE Phishing Infrastructure (Gophish+Vultr) Lockpicking and Keys stuff Wireless WiFi Cracking Rogue AP Attack Cryptography RSA Encryption AES Encryption MISC SSL Keys extraction Pwn Buffer Overflow (BoF) Easy - No Protections General Informations Defensive, Monitoring, CTI... Defensive OSINT and CTI Defensive Active Directory External Resources General Infosec OSINT Systems Web / Bug Bounty Cyber Threat Intel Navigation : Open Source Intelligence (OSINT) Web Pentest Network - Pivot Techniques - LDAP & DNS - Ports Scanning -- Masscan Cheatsheet -- Nmap Cheatsheet - MAC & ARP - Services Enumeration - ICMP Tricks Shells methods Windows Systems Linux Systems Other Systems Passcracking Hash & Files Phishing, RedTeam and SE Wireless Cryptography Pwn Defensive, Monitoring, CTI... External Resources var baseurl = "\/"; Nmap Cheatsheet https://github.com/Tib3rius/AutoRecon Full commands examples # Ping scan nmap -sP 192.168.0.0/24 # Quick scan nmap -T4 -F 192.168.1.1 -vvv # Quick scan plus (more info but more aggressive) nmap -sV -T4 -O -F –version-light 192.168.1.1 -vvv # TCP Syn and UDP Scan (requires root) nmap -sS -sU -PN -p T:80,T:445,U:161 192.168.1.1 # Soft nmap nmap -v -Pn -n -T4 -sT -sV --version-intensity=5 --reason 192.168.1.1 # Full nmap nmap -v -Pn -n -T4 -sT -p- --reason 192.168.1.1 # Dedicated nmap nmap -v -Pn -n -T4 -sV --version-intensity=5 -sT -p T:ports_found --reason <IP> Target specification nmap 192.168.1.1 nmap 192.168.1.1-10 nmap 192.168.1.0/24 nmap google.com nmap 192.168.1.0/24 --exclude192.168.1.1 nmap -iL targets.txt Scan techniques # TCP SYN port scan (default, root needed) nmap -sS 192.168.1.1 # TCP CONNECT port scan (default without root privilege) # Require full connection so it is slower nmap -sT 192.168.1.1 # UDP port scan nmap -sU 192.168.1.1 nmap -sA 192.168.1.1 nmap -sW 192.168.1.1 nmap -sN 192.168.1.1 # Ping scan nmap -sP 192.168.0.0/24 Host discovery # No scan, only list targets (get hostnames) nmap -sL 192.168.1.1 # Disable port scanning, only host discovery nmap -sn 192.168.1.1 # Disable host discovery, only port scanning, can be usefull if firewall deny PING nmap -Pn 192.168.1.1 # Disable DNS resolution nmap 192.168.1.1 -n Services, ports and OS (fingerprinting nmap -p 20 192.168.1.1 nmap -p 20-100 192.168.1.1 nmap -p U:53,T:25-100 192.168.1.1 nmap -p http,https 192.168.1.1 # All ports nmap -p- 192.168.1.1 # Fast port scan (100 more common ports) nmap 192.168.1.1 -F # Top X ports nmap 192.168.1.1 --top-ports 2000 # Try to get service version nmap 192.168.1.1 -sV # 0-9 nmap 192.168.1.1 -sV --version-intensity 3 # Light mode but faster nmap 192.168.1.1 -sV --version-light # Equivalent to version-intensity 9. Harder nmap 192.168.1.1 -sV --version-all # Aggressive mode (OS Detection, version, script, traceroute) nmap 192.168.1.1 -A # OS Detection using TCP/IP nmap 192.168.1.1 -O # Disable OS dection if at least one open and one closed port are not found nmap 192.168.1.1 -O --osscan-limit # OS Scan guess more aggressive nmap 192.168.1.1 -O --osscan-guess # Set the maximum number x of OS detection tries against a target nmap 192.168.1.1 -O --max-os-tries 2 NSE Scripts # Default script scanning, considered safe nmap 192.168.1.1 -sC nmap 192.168.1.1 --script default nmap 192.168.1.1 --script=xxx nmap 192.168.1.1 --script=xxx --script-args xx=xx # Scan default, but remove intrusive scripts nmap 192.168.1.1 --script “not intrusive" MISC # Scan speed # T0-T1 : Slow (useful for Intrusion Detection Systems evasion) # T2-T3 : Normal # T4-T5 : Agressive (Need a realiable and strong network) nmap 192.168.1.1 -T0 nmap 192.168.1.1 --host-timeout 10s # Delay between probes nmap 192.168.1.1 --scan-delay 1s nmap 192.168.1.1 --max-scan-delay 2s nmap 192.168.1.1 --max-retries 3 # No faster or no slower than 100 packets/second nmap 192.168.1.1 --min-rate 100 nmap 192.168.1.1 --max-rate 100 # If you need to scan a large network in a short period of time # You can set up a timeout value for connection attemps https://nmap.org/book/ncat-man-timing-options.html nmap 192.168.0.0/16 --host-timeout <msec> Evading IDS # Tiny fragmented packets nmap 192.168.1.1 -f # Set your own offset size nmap 192.168.1.1 -mtu 32 # Scan from spoofed IP nmap 192.168.1.1 -D 192.168.1.2 # Scan Facebook from Microsoft nmap -S www.microsoft.com www.facebook.com # Use a specific source port nmap 192.168.1.1 -g 53 # Proxy nmap 192.168.1.1 --proxies http://X.X.X.X:8080 # Append random data to sent packets nmap 192.168.1.1 --data-length 200 Output # Save result (oN=normal oX=xml oG=grepable oA=all) nmap 192.168.1.1 -oN scanResult.file # Verbosity level (one v or more) and debugging level nmap 192.168.1.1 -vvvvvv nmap 192.168.1.1 -ddd # Reason for the port state (equivalent to -vv) nmap 192.168.1.1 --reason # Show only open ports nmap 192.168.1.1 --open # Show all packets sent and received nmap 192.168.1.1 --packets-trace # Show the host interface and routes nmap 192.168.1.1 --iflist # Resume a scan nmap --resume scan.file nmap 192.168.1.1 -vvvvvv nmap 192.168.1.1 -vvvvvv Masscan Cheatsheet MAC & ARP'
