["https://cheatsheetseries.owasp.org/cheatsheets/Django_Security_Cheat_Sheet.html"]
title = "Django Security - OWASP Cheat Sheet Series"
description = "Website with the collection of all the cheat sheets of the project."
full_description = '''Django Security Cheat Sheet¶ Introduction¶ The Django framework is a powerful Python web framework, and it comes with built-in security features that can be used out-of-the-box to prevent common web vulnerabilities. This cheat sheet lists actions and security tips developers can take to develop secure Django applications. It aims to cover common vulnerabilities to increase the security posture of your Django application. Each item has a brief explanation and relevant code samples that are specific to the Django environment. The Django framework provides some built-in security features that aim to be secure-by-default. These features are also flexible to empower a developer to re-use components for complex use-cases. This opens up scenarios where developers unfamiliar with the inner workings of the components can configure them in an insecure way. This cheat sheet aims to enumerate some such use cases. General Recommendations¶ Always keep Django and your application's dependencies up-to-date to keep up with security vulnerabilities. Ensure that the application is never in DEBUG mode in a production environment. Never run DEBUG = True in production. Use packages like django_ratelimit or django-axes to prevent brute-force attacks. Authentication¶ Use django.contrib.auth app for views and forms for user authentication operations such as login, logout, password change, etc. Include the module and its dependencies django.contrib.contenttypes and django.contrib.sessions in the INSTALLED_APPS setting in the settings.py file. INSTALLED_APPS = [ # ... 'django.contrib.auth', 'django.contrib.contenttypes', 'django.contrib.sessions', # ... ] Use the @login_required decorator to ensure that only authenticated users can access a view. The sample code below illustrates usage of @login_required. from django.contrib.auth.decorators import login_required # User is redirected to default login page if not authenticated. @login_required def my_view(request): # Your view logic # User is redirected to custom '/login-page/' if not authenticated. @login_required(login_url='/login-page/') def my_view(request): # Your view logic Use password validators for enforcing password policies. Add or update the AUTH_PASSWORD_VALIDATORS setting in the settings.py file to include specific validators required by your application. AUTH_PASSWORD_VALIDATORS = [ { # Checks the similarity between the password and a set of attributes of the user. 'NAME': 'django.contrib.auth.password_validation.UserAttributeSimilarityValidator', 'OPTIONS': { 'user_attributes': ('username', 'email', 'first_name', 'last_name'), 'max_similarity': 0.7, } }, { # Checks whether the password meets a minimum length. 'NAME': 'django.contrib.auth.password_validation.MinimumLengthValidator', 'OPTIONS': { 'min_length': 8, } }, { # Checks whether the password occurs in a list of common passwords 'NAME': 'django.contrib.auth.password_validation.CommonPasswordValidator', }, { # Checks whether the password isn’t entirely numeric 'NAME': 'django.contrib.auth.password_validation.NumericPasswordValidator', } ] Store passwords using make-password utility function to hash a plain-text password. from django.contrib.auth.hashers import make_password #... hashed_pwd = make_password('plaintext_password') Check a plaintext password against a hashed password by using the check-password utility function. from django.contrib.auth.hashers import check_password #... plain_pwd = 'plaintext_password' hashed_pwd = 'hashed_password_from_database' if check_password(plain_pwd, hashed_pwd): print("The password is correct.") else: print("The password is incorrect.") Key Management¶ The SECRET_KEY parameter in settings.py is used for cryptographic signing and should be kept confidential. Consider the following recommendations: Generate a key at least 50 characters or more, containing a mix of letters, digits, and symbols. Ensure that the SECRET_KEY is generated using a strong random generator, such as get_random_secret_key() function in Django. Avoid hard coding the SECRET_KEY value in settings.py or any other location. Consider storing the key-value in environment variables or secrets managers. import os SECRET_KEY = os.environ.get('DJANGO_SECRET_KEY') Regularly rotate the key, keeping in mind that this action can invalidate sessions, password reset tokens, etc. Rotate the key immediately it if it ever gets exposed. Headers¶ Include the django.middleware.security.SecurityMiddleware module in the MIDDLEWARE setting in your project's settings.py to add security-related headers to your responses. This module is used to set the following parameters: SECURE_CONTENT_TYPE_NOSNIFF: Set this key to True. Protects against MIME type sniffing attacks by enabling the header X-Content-Type-Options: nosniff. SECURE_BROWSER_XSS_FILTER: Set this key to True. Enables the browser’s XSS filter by setting the header X-XSS-Protection: 1; mode=block. SECURE_HSTS_SECONDS: Ensures the site is only accessible via HTTPS. Include the django.middleware.clickjacking.XFrameOptionsMiddleware module in the MIDDLEWARE setting in your project's settings.py (This module should be listed after the django.middleware.security.SecurityMiddleware module as ordering is important). This module is used to set the following parameters: X_FRAME_OPTIONS: Set this key to to 'DENY' or 'SAMEORIGIN'. This setting adds the X-Frame-Options header to all HTTP responses. This protects against clickjacking attacks. Cookies¶ SESSION_COOKIE_SECURE: Set this key to True in the settings.py file. This will send the session cookie over secure (HTTPS) connections only. CSRF_COOKIE_SECURE: Set this key to True in the settings.py file. This will ensure that the CSRF cookie is sent over secure connections only. Whenever you set a custom cookie in a view using the HttpResponse.set_cookie() method, make sure to set its secure parameter to True. response = HttpResponse("Some response") response.set_cookie('my_cookie', 'cookie_value', secure=True) Cross Site Request Forgery (CSRF)¶ Include the django.middleware.csrf.CsrfViewMiddleware module in the MIDDLEWARE setting in your project's settings.py to add CSRF related headers to your responses. In forms use the {% csrf_token %} template tag to include the CSRF token. A sample is shown below. <form method="post"> {% csrf_token %} <!-- Your form fields here --> </form> For AJAX calls, the CSRF token for the request has to be extracted prior to being used in the the AJAX call. Additional recommendations and controls can be found at Django's Cross Site Request Forgery protection documentation. Cross Site Scripting (XSS)¶ The recommendations in this section are in addition to XSS recommendations already mentioned previously. Use the built-in template system to render templates in Django. Refer to Django's Automatic HTML escaping documentation to learn more. Avoid using safe, mark_safe, or json_script filters for disabling Django's automatic template escaping. The equivalent function in Python is the make_safe() function. Refer to the json_script template filter documentation to learn more. Refer to Django's Cross Site Scripting (XSS) protection documentation to learn more. HTTPS¶ Include the django.middleware.security.SecurityMiddleware module in the MIDDLEWARE setting in your project's settings.py if not already added. Set the SECURE_SSL_REDIRECT = True in the settings.py file to ensure that all communication is over HTTPS. This will redirect any HTTP requests automatically to HTTPS. This is also a 301 (permanent) redirect, so your browser will remember the redirect for subsequent requests. If your Django application is behind a proxy or load balancer, set the SECURE_PROXY_SSL_HEADER setting to TRUE so that Django can detect the original request's protocol. For further details refer to SECURE_PROXY_SSL_HEADER documentation. Admin panel URL¶ It is advisable to modify the default URL leading to the admin panel (example.com/admin/), in order to slightly increase the difficulty for automated attacks. Here’s how to do it: In the default app folder within your project, locate the urls.py file managing the top-level URLs. Within the file, modify the urlpatterns variable, a list, so that the URL leading to admin.site.urls is different from "admin/". This approach adds an extra layer of security by obscuring the common endpoint used for administrative access. References¶ Additional documentation - Clickjacking Protection Security Middleware'''
