title = "DotNet Security - OWASP Cheat Sheet Series"
description = "Website with the collection of all the cheat sheets of the project."
full_description = '''DotNet Security Cheat Sheet¶ Introduction¶ This page intends to provide quick basic .NET security tips for developers. The .NET Framework¶ The .NET Framework is Microsoft's principal platform for enterprise development. It is the supporting API for ASP.NET, Windows Desktop applications, Windows Communication Foundation services, SharePoint, Visual Studio Tools for Office and other technologies. The .NET Framework constitutes a collection of APIs that facilitate the usage of an advanced type system, managing data, graphics, networking, file operations, and more - essentially covering the vast majority of requirements for developing enterprise applications within the Microsoft ecosystem. It is a nearly ubiquitous library that is strongly named and versioned at the assembly level. Updating the Framework¶ The .NET Framework is kept up-to-date by Microsoft with the Windows Update service. Developers do not normally need to run separate updates to the Framework. Windows Update can be accessed at Windows Update or from the Windows Update program on a Windows computer. Individual frameworks can be kept up to date using NuGet. As Visual Studio prompts for updates, build it into your lifecycle. Remember that third-party libraries have to be updated separately and not all of them use NuGet. ELMAH for instance, requires a separate update effort. Security Announcements¶ Receive security notifications by selecting the "Watch" button at the following repositories: .NET Core Security Announcements ASP.NET Core & Entity Framework Core Security Announcements .NET General Guidance¶ This section contains general guidance for .NET applications. This applies to all .NET applications, including ASP.NET, WPF, WinForms, and others. The OWASP Top 10 lists the most prevalent and dangerous threats to web security in the world today and is reviewed every few years and updated with the latest threat data. This section of the cheat sheet is based on this list. Your approach to securing your web application should be to start at the top threat A1 below and work down; this will ensure that any time spent on security will be spent most effectively and cover the top threats first and lesser threats afterwards. After covering the Top 10 it is generally advisable to assess for other threats or get a professionally completed Penetration Test. A01 Broken Access Control¶ Weak Account management¶ Ensure cookies are sent with the HttpOnly flag set to prevent client side scripts from accessing the cookie: CookieHttpOnly = true, Reduce the time period a session can be stolen in by reducing session timeout and removing sliding expiration: ExpireTimeSpan = TimeSpan.FromMinutes(60), SlidingExpiration = false See here for an example of a full startup code snippet. Ensure cookies are sent over HTTPS in production. This should be enforced in the config transforms: <httpCookies requireSSL="true" /> <authentication> <forms requireSSL="true" /> </authentication> Protect LogOn, Registration and password reset methods against brute force attacks by throttling requests (see code below). Consider also using ReCaptcha. [HttpPost] [AllowAnonymous] [ValidateAntiForgeryToken] [AllowXRequestsEveryXSecondsAttribute(Name = "LogOn", Message = "You have performed this action more than {x} times in the last {n} seconds.", Requests = 3, Seconds = 60)] public async Task<ActionResult> LogOn(LogOnViewModel model, string returnUrl) DO NOT: Roll your own authentication or session management. Use the one provided by .NET. DO NOT: Tell someone if the account exists on LogOn, Registration or Password reset. Say something like 'Either the username or password was incorrect', or 'If this account exists then a reset token will be sent to the registered email address'. This protects against account enumeration. The feedback to the user should be identical whether or not the account exists, both in terms of content and behavior. E.g., if the response takes 50% longer when the account is real then membership information can be guessed and tested. Missing function-level access control¶ DO: Authorize users on all externally facing endpoints. The .NET framework has many ways to authorize a user, use them at method level: [Authorize(Roles = "Admin")] [HttpGet] public ActionResult Index(int page = 1) or better yet, at controller level: [Authorize] public class UserController You can also check roles in code using identity features in .net: System.Web.Security.Roles.IsUserInRole(userName, roleName) You can find more information in the Authorization Cheat Sheet and Authorization Testing Automation Cheat Sheet. Insecure Direct object references¶ When you have a resource (object) which can be accessed by a reference (in the sample below this is the id), you need to ensure that the user is intended to have access to that resource. // Insecure public ActionResult Edit(int id) { var user = _context.Users.FirstOrDefault(e => e.Id == id); return View("Details", new UserViewModel(user); } // Secure public ActionResult Edit(int id) { var user = _context.Users.FirstOrDefault(e => e.Id == id); // Establish user has right to edit the details if (user.Id != _userIdentity.GetUserId()) { HandleErrorInfo error = new HandleErrorInfo( new Exception("INFO: You do not have permission to edit these details")); return View("Error", error); } return View("Edit", new UserViewModel(user); } More information can be found in the Insecure Direct Object Reference Prevention Cheat Sheet. A02 Cryptographic Failures¶ General cryptography guidance¶ Never, ever write your own cryptographic functions. Wherever possible, try and avoid writing any cryptographic code at all. Instead try and either use pre-existing secrets management solutions or the secret management solution provided by your cloud provider. For more information, see the OWASP Secrets Management Cheat Sheet. If you cannot use a pre-existing secrets management solution, try and use a trusted and well known implementation library rather than using the libraries built into .NET as it is far too easy to make cryptographic errors with them. Make sure your application or protocol can easily support a future change of cryptographic algorithms. Hashing¶ DO: Use a strong hashing algorithm. In .NET (both Framework and Core), the strongest hashing algorithm for general hashing requirements is System.Security.Cryptography.SHA512. In .NET Framework 4.6 and earlier, the strongest algorithm for password hashing is PBKDF2, implemented as System.Security.Cryptography.Rfc2898DeriveBytes. In .NET Framework 4.6.1 and later and .NET Core, the strongest algorithm for password hashing is PBKDF2, implemented as Microsoft.AspNetCore.Cryptography.KeyDerivation.Pbkdf2 which has several significant advantages over Rfc2898DeriveBytes. When using a hashing function to hash non-unique inputs such as passwords, use a salt value added to the original value before hashing. Refer to the Password Storage Cheat Sheet for more information. Passwords¶ DO: Enforce passwords with a minimum complexity that will survive a dictionary attack; i.e. longer passwords that use the full character set (numbers, symbols and letters) to increase entropy. Encryption¶ DO: Use a strong encryption algorithm such as AES-512 where personally identifiable data needs to be restored to it's original format. DO: Protect encryption keys more than any other asset. Find more information about storing encryption keys at rest in the Key Management Cheat Sheet. DO: Use TLS 1.2+ for your entire site. Get a free certificate LetsEncrypt.org and automate renewals. DO NOT: Allow SSL, this is now obsolete. DO: Have a strong TLS policy (see SSL Best Practices), use TLS 1.2+ wherever possible. Then check the configuration using SSL Test or TestSSL. More information on Transport Layer Protection can be found in the Transport Layer Security Cheat Sheet. DO: Ensure headers are not disclosing information about your application. See HttpHeaders.cs, Dionach StripHeaders, disable via web.config or Startup.cs. e.g Web.config <system.web> <httpRuntime enableVersionHeader="false"/> </system.web> <system.webServer> <security> <requestFiltering removeServerHeader="true" /> </security> <httpProtocol> <customHeaders> <add name="X-Content-Type-Options" value="nosniff" /> <add name="X-Frame-Options" value="DENY" /> <add name="X-Permitted-Cross-Domain-Policies" value="master-only"/> <add name="X-XSS-Protection" value="0"/> <remove name="X-Powered-By"/> </customHeaders> </httpProtocol> </system.webServer> e.g Startup.cs app.UseHsts(hsts => hsts.MaxAge(365).IncludeSubdomains()); app.UseXContentTypeOptions(); app.UseReferrerPolicy(opts => opts.NoReferrer()); app.UseXXssProtection(options => options.FilterDisabled()); app.UseXfo(options => options.Deny()); app.UseCsp(opts => opts .BlockAllMixedContent() .StyleSources(s => s.Self()) .StyleSources(s => s.UnsafeInline()) .FontSources(s => s.Self()) .FormActions(s => s.Self()) .FrameAncestors(s => s.Self()) .ImageSources(s => s.Self()) .ScriptSources(s => s.Self()) ); More information about headers can be found at the OWASP Secure Headers Project. Encryption for storage¶ Use the Windows Data Protection API (DPAPI) for secure local storage of sensitive data. Where DPAPI cannot be used, follow the algorithm guidance in the OWASP Cryptographic Storage Cheat Sheet. The following code snippet shows an example of using AES-GCM to perform encryption/decryption of data. It is strongly recommended to have a cryptography expert review your final design and code, as even the most trivial error can severely weaken your encryption. The code is based on example from here: https://www.scottbrady91.com/c-sharp/aes-gcm-dotnet A few constraints/pitfalls with this code: It does not take into account key rotation or management which is a whole topic in itself. It is important to use a different nonce for every encryption operation, even if the same key is used. The key will need to be stored securely. Click here to view the "AES-GCM symmetric encryption" code snippet. // Code based on example from here: // https://www.scottbrady91.com/c-sharp/aes-gcm-dotnet public class AesGcmSimpleTest { public static void Main() { // Key of 32 bytes / 256 bits for AES var key = new byte[32]; RandomNumberGenerator.Fill(key); // MaxSize = 12 bytes / 96 bits and this size should always be used. var nonce = new byte[AesGcm.NonceByteSizes.MaxSize]; RandomNumberGenerator.Fill(nonce); // Tag for authenticated encryption var tag = new byte[AesGcm.TagByteSizes.MaxSize]; var message = "This message to be encrypted"; Console.WriteLine(message); // Encrypt the message var cipherText = AesGcmSimple.Encrypt(message, nonce, out tag, key); Console.WriteLine(Convert.ToBase64String(cipherText)); // Decrypt the message var message2 = AesGcmSimple.Decrypt(cipherText, nonce, tag, key); Console.WriteLine(message2); } } public static class AesGcmSimple { public static byte[] Encrypt(string plaintext, byte[] nonce, out byte[] tag, byte[] key) { using(var aes = new AesGcm(key)) { // Tag for authenticated encryption tag = new byte[AesGcm.TagByteSizes.MaxSize]; // Create a byte array from the message to encrypt var plaintextBytes = Encoding.UTF8.GetBytes(plaintext); // Ciphertext will be same length in bytes as plaintext var ciphertext = new byte[plaintextBytes.Length]; // perform the actual encryption aes.Encrypt(nonce, plaintextBytes, ciphertext, tag); return ciphertext; } } public static string Decrypt(byte[] ciphertext, byte[] nonce, byte[] tag, byte[] key) { using(var aes = new AesGcm(key)) { // Plaintext will be same length in bytes as Ciphertext var plaintextBytes = new byte[ciphertext.Length]; // perform the actual decryption aes.Decrypt(nonce, ciphertext, tag, plaintextBytes); return Encoding.UTF8.GetString(plaintextBytes); } } } Encryption for transmission¶ Again, follow the algorithm guidance in the OWASP Cryptographic Storage Cheat Sheet. The following code snippet shows an example of using Eliptic Curve/Diffie Helman (ECDH) together with AES-GCM to perform encryption/decryption of data between two different sides without the need the transfer the symmetric key between the two sides. Instead, the sides exchange public keys and can then use ECDH to generate a shared secret which can be used for the symmetric encryption. Again, it is strongly recommended to have a cryptography expert review your final design and code, as even the most trivial error can severely weaken your encryption. Note that this code sample relies on the AesGcmSimple class from the previous section. A few constraints/pitfalls with this code: It does not take into account key rotation or management which is a whole topic in itself. The code deliberately enforces a new nonce for every encryption operation but this must be managed as a separate data item alongside the ciphertext. The private keys will need to be stored securely. The code does not consider the validation of public keys before use. Overall, there is no verification of authenticity between the two sides. Click here to view the "ECDH asymmetric encryption" code snippet. public class ECDHSimpleTest { public static void Main() { // Generate ECC key pair for Alice var alice = new ECDHSimple(); byte[] alicePublicKey = alice.PublicKey; // Generate ECC key pair for Bob var bob = new ECDHSimple(); byte[] bobPublicKey = bob.PublicKey; string plaintext = "Hello, Bob! How are you?"; Console.WriteLine("Secret being sent from Alice to Bob: " + plaintext); // Note that a new nonce is generated with every encryption operation in line with // in line with the AES GCM security byte[] tag; byte[] nonce; var cipherText = alice.Encrypt(bobPublicKey, plaintext, out nonce, out tag); Console.WriteLine("Ciphertext, nonce, and tag being sent from Alice to Bob: " + Convert.ToBase64String(cipherText) + " " + Convert.ToBase64String(nonce) + " " + Convert.ToBase64String(tag)); var decrypted = bob.Decrypt(alicePublicKey, cipherText, nonce, tag); Console.WriteLine("Secret received by Bob from Alice: " + decrypted); Console.WriteLine(); string plaintext2 = "Hello, Alice! I'm good, how are you?"; Console.WriteLine("Secret being sent from Bob to Alice: " + plaintext2); byte[] tag2; byte[] nonce2; var cipherText2 = bob.Encrypt(alicePublicKey, plaintext2, out nonce2, out tag2); Console.WriteLine("Ciphertext, nonce, and tag being sent from Bob to Alice: " + Convert.ToBase64String(cipherText2) + " " + Convert.ToBase64String(nonce2) + " " + Convert.ToBase64String(tag2)); var decrypted2 = alice.Decrypt(bobPublicKey, cipherText2, nonce2, tag2); Console.WriteLine("Secret received by Alice from Bob: " + decrypted2); } } public class ECDHSimple { private ECDiffieHellmanCng ecdh = new ECDiffieHellmanCng(); public byte[] PublicKey { get { return ecdh.PublicKey.ToByteArray(); } } public byte[] Encrypt(byte[] partnerPublicKey, string message, out byte[] nonce, out byte[] tag) { // Generate the AES Key and Nonce var aesKey = GenerateAESKey(partnerPublicKey); // Tag for authenticated enc'''
