["https://cheatsheetseries.owasp.org/cheatsheets/JSON_Web_Token_for_Java_Cheat_Sheet.html"]
title = "JSON Web Token for Java - OWASP Cheat Sheet Series"
description = "Website with the collection of all the cheat sheets of the project."
full_description = '''JSON Web Token Cheat Sheet for Java¶ Introduction¶ Many applications use JSON Web Tokens (JWT) to allow the client to indicate its identity for further exchange after authentication. From JWT.IO: JSON Web Token (JWT) is an open standard (RFC 7519) that defines a compact and self-contained way for securely transmitting information between parties as a JSON object. This information can be verified and trusted because it is digitally signed. JWTs can be signed using a secret (with the HMAC algorithm) or a public/private key pair using RSA. JSON Web Token is used to carry information related to the identity and characteristics (claims) of a client. This information is signed by the server in order for it to detect whether it was tampered with after sending it to the client. This will prevent an attacker from changing the identity or any characteristics (for example, changing the role from simple user to admin or change the client login). This token is created during authentication (is provided in case of successful authentication) and is verified by the server before any processing. It is used by an application to allow a client to present a token representing the user's "identity card" to the server and allow the server to verify the validity and integrity of the token in a secure way, all of this in a stateless and portable approach (portable in the way that client and server technologies can be different including also the transport channel even if HTTP is the most often used). Token Structure¶ Token structure example taken from JWT.IO: [Base64(HEADER)].[Base64(PAYLOAD)].[Base64(SIGNATURE)] eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9. eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiYWRtaW4iOnRydWV9. TJVA95OrM7E2cBab30RMHrHDcEfxjoYZgeFONFh7HgQ Chunk 1: Header { "alg": "HS256", "typ": "JWT" } Chunk 2: Payload { "sub": "1234567890", "name": "John Doe", "admin": true } Chunk 3: Signature HMACSHA256( base64UrlEncode(header) + "." + base64UrlEncode(payload), KEY ) Objective¶ This cheatsheet provides tips to prevent common security issues when using JSON Web Tokens (JWT) with Java. The tips presented in this article are part of a Java project that was created to show the correct way to handle creation and validation of JSON Web Tokens. You can find the Java project here, it uses the official JWT library. In the rest of the article, the term token refers to the JSON Web Tokens (JWT). Consideration about Using JWT¶ Even if a JWT is "easy" to use and allow to expose services (mostly REST style) in a stateless way, it's not the solution that fits for all applications because it comes with some caveats, like for example the question of the storage of the token (tackled in this cheatsheet) and others... If your application does not need to be fully stateless, you can consider using traditional session system provided by all web frameworks and follow the advice from the dedicated session management cheat sheet. However, for stateless applications, when well implemented, it's a good candidate. Issues¶ None Hashing Algorithm¶ Symptom¶ This attack, described here, occurs when an attacker alters the token and changes the hashing algorithm to indicate, through the none keyword, that the integrity of the token has already been verified. As explained in the link above some libraries treated tokens signed with the none algorithm as a valid token with a verified signature, so an attacker can alter the token claims and the modified token will still be trusted by the application. How to Prevent¶ First, use a JWT library that is not exposed to this vulnerability. Last, during token validation, explicitly request that the expected algorithm was used. Implementation Example¶ // HMAC key - Block serialization and storage as String in JVM memory private transient byte[] keyHMAC = ...; ... //Create a verification context for the token requesting //explicitly the use of the HMAC-256 hashing algorithm JWTVerifier verifier = JWT.require(Algorithm.HMAC256(keyHMAC)).build(); //Verify the token, if the verification fail then a exception is thrown DecodedJWT decodedToken = verifier.verify(token); Token Sidejacking¶ Symptom¶ This attack occurs when a token has been intercepted/stolen by an attacker and they use it to gain access to the system using targeted user identity. How to Prevent¶ A way to prevent it is to add a "user context" in the token. A user context will be composed of the following information: A random string that will be generated during the authentication phase. It will be sent to the client as an hardened cookie (flags: HttpOnly + Secure + SameSite + Max-Age + cookie prefixes). Avoid setting expires header so that the cookie is cleared when the browser is closed. Set Max-Age to a value smaller or equal to the value of JWT expiry, but never more. A SHA256 hash of the random string will be stored in the token (instead of the raw value) in order to prevent any XSS issues allowing the attacker to read the random string value and setting the expected cookie. IP addresses should not be used because there are some legitimate situations in which the IP address can change during the same session. For example, when an user accesses an application through their mobile device and the mobile operator changes during the exchange, then the IP address may (often) change. Moreover, using the IP address can potentially cause issues with European GDPR compliance. During token validation, if the received token does not contain the right context (for example, if it has been replayed), then it must be rejected. Implementation example¶ Code to create the token after successful authentication. // HMAC key - Block serialization and storage as String in JVM memory private transient byte[] keyHMAC = ...; // Random data generator private SecureRandom secureRandom = new SecureRandom(); ... //Generate a random string that will constitute the fingerprint for this user byte[] randomFgp = new byte[50]; secureRandom.nextBytes(randomFgp); String userFingerprint = DatatypeConverter.printHexBinary(randomFgp); //Add the fingerprint in a hardened cookie - Add cookie manually because //SameSite attribute is not supported by javax.servlet.http.Cookie class String fingerprintCookie = "__Secure-Fgp=" + userFingerprint + "; SameSite=Strict; HttpOnly; Secure"; response.addHeader("Set-Cookie", fingerprintCookie); //Compute a SHA256 hash of the fingerprint in order to store the //fingerprint hash (instead of the raw value) in the token //to prevent an XSS to be able to read the fingerprint and //set the expected cookie itself MessageDigest digest = MessageDigest.getInstance("SHA-256"); byte[] userFingerprintDigest = digest.digest(userFingerprint.getBytes("utf-8")); String userFingerprintHash = DatatypeConverter.printHexBinary(userFingerprintDigest); //Create the token with a validity of 15 minutes and client context (fingerprint) information Calendar c = Calendar.getInstance(); Date now = c.getTime(); c.add(Calendar.MINUTE, 15); Date expirationDate = c.getTime(); Map<String, Object> headerClaims = new HashMap<>(); headerClaims.put("typ", "JWT"); String token = JWT.create().withSubject(login) .withExpiresAt(expirationDate) .withIssuer(this.issuerID) .withIssuedAt(now) .withNotBefore(now) .withClaim("userFingerprint", userFingerprintHash) .withHeader(headerClaims) .sign(Algorithm.HMAC256(this.keyHMAC)); Code to validate the token. // HMAC key - Block serialization and storage as String in JVM memory private transient byte[] keyHMAC = ...; ... //Retrieve the user fingerprint from the dedicated cookie String userFingerprint = null; if (request.getCookies() != null && request.getCookies().length > 0) { List<Cookie> cookies = Arrays.stream(request.getCookies()).collect(Collectors.toList()); Optional<Cookie> cookie = cookies.stream().filter(c -> "__Secure-Fgp" .equals(c.getName())).findFirst(); if (cookie.isPresent()) { userFingerprint = cookie.get().getValue(); } } //Compute a SHA256 hash of the received fingerprint in cookie in order to compare //it to the fingerprint hash stored in the token MessageDigest digest = MessageDigest.getInstance("SHA-256"); byte[] userFingerprintDigest = digest.digest(userFingerprint.getBytes("utf-8")); String userFingerprintHash = DatatypeConverter.printHexBinary(userFingerprintDigest); //Create a verification context for the token JWTVerifier verifier = JWT.require(Algorithm.HMAC256(keyHMAC)) .withIssuer(issuerID) .withClaim("userFingerprint", userFingerprintHash) .build(); //Verify the token, if the verification fail then an exception is thrown DecodedJWT decodedToken = verifier.verify(token); No Built-In Token Revocation by the User¶ Symptom¶ This problem is inherent to JWT because a token only becomes invalid when it expires. The user has no built-in feature to explicitly revoke the validity of a token. This means that if it is stolen, a user cannot revoke the token itself thereby blocking the attacker. How to Prevent¶ Since JWTs are stateless, There is no session maintained on the server(s) serving client requests. As such, there is no session to invalidate on the server side. A well implemented Token Sidejacking solution (as explained above) should alleviate the need for maintaining denylist on server side. This is because a hardened cookie used in the Token Sidejacking can be considered as secure as a session ID used in the traditional session system, and unless both the cookie and the JWT are intercepted/stolen, the JWT is unusable. A logout can thus be 'simulated' by clearing the JWT from session storage. If the user chooses to close the browser instead, then both the cookie and sessionStorage are cleared automatically. Another way to protect against this is to implement a token denylist that will be used to mimic the "logout" feature that exists with traditional session management system. The denylist will keep a digest (SHA-256 encoded in HEX) of the token with a revocation date. This entry must endure at least until the expiration of the token. When the user wants to "logout" then it call a dedicated service that will add the provided user token to the denylist resulting in an immediate invalidation of the token for further usage in the application. Implementation Example¶ Block List Storage¶ A database table with the following structure will be used as the central denylist storage. create table if not exists revoked_token(jwt_token_digest varchar(255) primary key, revocation_date timestamp default now()); Token Revocation Management¶ Code in charge of adding a token to the denylist and checking if a token is revoked. /** * Handle the revocation of the token (logout). * Use a DB in order to allow multiple instances to check for revoked token * and allow cleanup at centralized DB level. */ public class TokenRevoker { /** DB Connection */ @Resource("jdbc/storeDS") private DataSource storeDS; /** * Verify if a digest encoded in HEX of the ciphered token is present * in the revocation table * * @param jwtInHex Token encoded in HEX * @return Presence flag * @throws Exception If any issue occur during communication with DB */ public boolean isTokenRevoked(String jwtInHex) throws Exception { boolean tokenIsPresent = false; if (jwtInHex != null && !jwtInHex.trim().isEmpty()) { //Decode the ciphered token byte[] cipheredToken = DatatypeConverter.parseHexBinary(jwtInHex); //Compute a SHA256 of the ciphered token MessageDigest digest = MessageDigest.getInstance("SHA-256"); byte[] cipheredTokenDigest = digest.digest(cipheredToken); String jwtTokenDigestInHex = DatatypeConverter.printHexBinary(cipheredTokenDigest); //Search token digest in HEX in DB try (Connection con = this.storeDS.getConnection()) { String query = "select jwt_token_digest from revoked_token where jwt_token_digest = ?"; try (PreparedStatement pStatement = con.prepareStatement(query)) { pStatement.setString(1, jwtTokenDigestInHex); try (ResultSet rSet = pStatement.executeQuery()) { tokenIsPresent = rSet.next(); } } } } return tokenIsPresent; } /** * Add a digest encoded in HEX of the ciphered token to the revocation token table * * @param jwtInHex Token encoded in HEX * @throws Exception If any issue occur during communication with DB */ public void revokeToken(String jwtInHex) throws Exception { if (jwtInHex != null && !jwtInHex.trim().isEmpty()) { //Decode the ciphered token byte[] cipheredToken = DatatypeConverter.parseHexBinary(jwtInHex); //Compute a SHA256 of the ciphered token MessageDigest digest = MessageDigest.getInstance("SHA-256"); byte[] cipheredTokenDigest = digest.digest(cipheredToken); String jwtTokenDigestInHex = DatatypeConverter.printHexBinary(cipheredTokenDigest); //Check if the token digest in HEX is already in the DB and add it if it is absent if (!this.isTokenRevoked(jwtInHex)) { try (Connection con = this.storeDS.getConnection()) { String query = "insert into revoked_token(jwt_token_digest) values(?)"; int insertedRecordCount; try (PreparedStatement pStatement = con.prepareStatement(query)) { pStatement.setString(1, jwtTokenDigestInHex); insertedRecordCount = pStatement.executeUpdate(); } if (insertedRecordCount != 1) { throw new IllegalStateException("Number of inserted record is invalid," + " 1 expected but is " + insertedRecordCount); } } } } } Token Information Disclosure¶ Symptom¶ This attack occurs when an attacker has access to a token (or a set of tokens) and extracts information stored in it (the contents of JWTs are base64 encoded, but is not encrypted by default) in order to obtain information about the system. Information can be for example the security roles, login format... How to Prevent¶ A way to protect against this attack is to cipher the token using, for example, a symmetric algorithm. It's also important to protect the ciphered data against attack like Padding Oracle or any other attack using cryptanalysis. In order to achieve all these goals, the AES-GCM algorithm is used which provides Authenticated Encryption with Associated Data. More details from here: AEAD primitive (Authenticated Encryption with Associated Data) provides functionality of symmetric authenticated encryption. Implementations of this primitive are secure against adaptive chosen ciphertext attacks. When encrypting a plaintext one can optionally provide associated data that should be authenticated but not encrypted. That is, the encryption with associated data ensures authenticity (ie. who the sender is) and integrity (ie. data has not been tampered with) of that data, but not its secrecy. See RFC5116: https://tools.ietf.org/html/rfc5116 Note: Here ciphering is added mainly to hide internal information but it's very important to remember that the first protection against tampering of the JWT is the signature. So, the token signature and its verification must be always in place. Implementation Example¶ Token Ciphering¶ Code in charge of managing the ciphering. Google Tink dedicated crypto library is used to handle ciphering operations in order to use built-in best practices provide'''
