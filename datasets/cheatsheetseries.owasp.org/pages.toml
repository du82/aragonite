["https://cheatsheetseries.owasp.org/cheatsheets/Java_Security_Cheat_Sheet.html"]
title = "Java Security - OWASP Cheat Sheet Series"
description = "Website with the collection of all the cheat sheets of the project."
full_description = '''Java Security Cheat Sheet¶ Injection Prevention in Java¶ This section aims to provide tips to handle Injection in Java application code. Sample code used in tips is located here. What is Injection¶ Injection in OWASP Top 10 is defined as following: Consider anyone who can send untrusted data to the system, including external users, internal users, and administrators. General advice to prevent Injection¶ The following point can be applied, in a general way, to prevent Injection issue: Apply Input Validation (using allowlist approach) combined with Output Sanitizing+Escaping on user input/output. If you need to interact with system, try to use API features provided by your technology stack (Java / .Net / PHP...) instead of building command. Additional advice is provided on this cheatsheet. Specific Injection types¶ Examples in this section will be provided in Java technology (see Maven project associated) but advice is applicable to others technologies like .Net / PHP / Ruby / Python... SQL¶ Symptom¶ Injection of this type occur when the application uses untrusted user input to build an SQL query using a String and execute it. How to prevent¶ Use Query Parameterization in order to prevent injection. Example¶ /*No DB framework used here in order to show the real use of Prepared Statement from Java API*/ /*Open connection with H2 database and use it*/ Class.forName("org.h2.Driver"); String jdbcUrl = "jdbc:h2:file:" + new File(".").getAbsolutePath() + "/target/db"; try (Connection con = DriverManager.getConnection(jdbcUrl)) { /* Sample A: Select data using Prepared Statement*/ String query = "select * from color where friendly_name = ?"; List<String> colors = new ArrayList<>(); try (PreparedStatement pStatement = con.prepareStatement(query)) { pStatement.setString(1, "yellow"); try (ResultSet rSet = pStatement.executeQuery()) { while (rSet.next()) { colors.add(rSet.getString(1)); } } } /* Sample B: Insert data using Prepared Statement*/ query = "insert into color(friendly_name, red, green, blue) values(?, ?, ?, ?)"; int insertedRecordCount; try (PreparedStatement pStatement = con.prepareStatement(query)) { pStatement.setString(1, "orange"); pStatement.setInt(2, 239); pStatement.setInt(3, 125); pStatement.setInt(4, 11); insertedRecordCount = pStatement.executeUpdate(); } /* Sample C: Update data using Prepared Statement*/ query = "update color set blue = ? where friendly_name = ?"; int updatedRecordCount; try (PreparedStatement pStatement = con.prepareStatement(query)) { pStatement.setInt(1, 10); pStatement.setString(2, "orange"); updatedRecordCount = pStatement.executeUpdate(); } /* Sample D: Delete data using Prepared Statement*/ query = "delete from color where friendly_name = ?"; int deletedRecordCount; try (PreparedStatement pStatement = con.prepareStatement(query)) { pStatement.setString(1, "orange"); deletedRecordCount = pStatement.executeUpdate(); } } References¶ SQL Injection Prevention Cheat Sheet JPA¶ Symptom¶ Injection of this type occur when the application uses untrusted user input to build a JPA query using a String and execute it. It's quite similar to SQL injection but here the altered language is not SQL but JPA QL. How to prevent¶ Use Java Persistence Query Language Query Parameterization in order to prevent injection. Example¶ EntityManager entityManager = null; try { /* Get a ref on EntityManager to access DB */ entityManager = Persistence.createEntityManagerFactory("testJPA").createEntityManager(); /* Define parameterized query prototype using named parameter to enhance readability */ String queryPrototype = "select c from Color c where c.friendlyName = :colorName"; /* Create the query, set the named parameter and execute the query */ Query queryObject = entityManager.createQuery(queryPrototype); Color c = (Color) queryObject.setParameter("colorName", "yellow").getSingleResult(); } finally { if (entityManager != null && entityManager.isOpen()) { entityManager.close(); } } References¶ SQLi and JPA Operating System¶ Symptom¶ Injection of this type occur when the application uses untrusted user input to build an Operating System command using a String and execute it. How to prevent¶ Use technology stack API in order to prevent injection. Example¶ /* The context taken is, for example, to perform a PING against a computer. * The prevention is to use the feature provided by the Java API instead of building * a system command as String and execute it */ InetAddress host = InetAddress.getByName("localhost"); var reachable = host.isReachable(5000); References¶ Command Injection XML: XPath Injection¶ Symptom¶ Injection of this type occur when the application uses untrusted user input to build a XPath query using a String and execute it. How to prevent¶ Use XPath Variable Resolver in order to prevent injection. Example¶ Variable Resolver implementation. /** * Resolver in order to define parameter for XPATH expression. * */ public class SimpleVariableResolver implements XPathVariableResolver { private final Map<QName, Object> vars = new HashMap<QName, Object>(); /** * External methods to add parameter * * @param name Parameter name * @param value Parameter value */ public void addVariable(QName name, Object value) { vars.put(name, value); } /** * {@inheritDoc} * * @see javax.xml.xpath.XPathVariableResolver#resolveVariable(javax.xml.namespace.QName) */ public Object resolveVariable(QName variableName) { return vars.get(variableName); } } Code using it to perform XPath query. /*Create a XML document builder factory*/ DocumentBuilderFactory dbf = DocumentBuilderFactory.newInstance(); /*Disable External Entity resolution for different cases*/ //Do not performed here in order to focus on variable resolver code //but do it for production code ! /*Load XML file*/ DocumentBuilder builder = dbf.newDocumentBuilder(); Document doc = builder.parse(new File("src/test/resources/SampleXPath.xml")); /* Create and configure parameter resolver */ String bid = "bk102"; SimpleVariableResolver variableResolver = new SimpleVariableResolver(); variableResolver.addVariable(new QName("bookId"), bid); /*Create and configure XPATH expression*/ XPath xpath = XPathFactory.newInstance().newXPath(); xpath.setXPathVariableResolver(variableResolver); XPathExpression xPathExpression = xpath.compile("//book[@id=$bookId]"); /* Apply expression on XML document */ Object nodes = xPathExpression.evaluate(doc, XPathConstants.NODESET); NodeList nodesList = (NodeList) nodes; Element book = (Element)nodesList.item(0); var containsRalls = book.getTextContent().contains("Ralls, Kim"); References¶ XPATH Injection HTML/JavaScript/CSS¶ Symptom¶ Injection of this type occur when the application uses untrusted user input to build an HTTP response and sent it to browser. How to prevent¶ Either apply strict input validation (allowlist approach) or use output sanitizing+escaping if input validation is not possible (combine both every time is possible). Example¶ /* INPUT WAY: Receive data from user Here it's recommended to use strict input validation using allowlist approach. In fact, you ensure that only allowed characters are part of the input received. */ String userInput = "You user login is owasp-user01"; /* First we check that the value contains only expected character*/ if (!Pattern.matches("[a-zA-Z0-9\\s\\-]{1,50}", userInput)) { return false; } /* If the first check pass then ensure that potential dangerous character that we have allowed for business requirement are not used in a dangerous way. For example here we have allowed the character '-', and, this can be used in SQL injection so, we ensure that this character is not used is a continuous form. Use the API COMMONS LANG v3 to help in String analysis... */ If (0 != StringUtils.countMatches(userInput.replace(" ", ""), "--")) { return false; } /* OUTPUT WAY: Send data to user Here we escape + sanitize any data sent to user Use the OWASP Java HTML Sanitizer API to handle sanitizing Use the OWASP Java Encoder API to handle HTML tag encoding (escaping) */ String outputToUser = "You <p>user login</p> is <strong>owasp-user01</strong>"; outputToUser += "<script>alert(22);</script><img src='#' onload='javascript:alert(23);'>"; /* Create a sanitizing policy that only allow tag '<p>' and '<strong>'*/ PolicyFactory policy = new HtmlPolicyBuilder().allowElements("p", "strong").toFactory(); /* Sanitize the output that will be sent to user*/ String safeOutput = policy.sanitize(outputToUser); /* Encode HTML Tag*/ safeOutput = Encode.forHtml(safeOutput); String finalSafeOutputExpected = "You <p>user login</p> is <strong>owasp-user01</strong>"; if (!finalSafeOutputExpected.equals(safeOutput)) { return false; } References¶ XSS OWASP Java HTML Sanitizer OWASP Java Encoder Java RegEx LDAP¶ A dedicated cheatsheet has been created. NoSQL¶ Symptom¶ Injection of this type occur when the application uses untrusted user input to build a NoSQL API call expression. How to prevent¶ As there many NoSQL database system and each one use an API for call, it's important to ensure that user input received and used to build the API call expression does not contain any character that have a special meaning in the target API syntax. This in order to avoid that it will be used to escape the initial call expression in order to create another one based on crafted user input. It's also important to not use string concatenation to build API call expression but use the API to create the expression. Example - MongoDB¶ /* Here use MongoDB as target NoSQL DB */ String userInput = "Brooklyn"; /* First ensure that the input do no contains any special characters for the current NoSQL DB call API, here they are: ' " \ ; { } $ */ //Avoid regexp this time in order to made validation code //more easy to read and understand... ArrayList < String > specialCharsList = new ArrayList < String > () { { add("'"); add("\""); add("\\"); add(";"); add("{"); add("}"); add("$"); } }; for (String specChar: specialCharsList) { if (userInput.contains(specChar)) { return false; } } //Add also a check on input max size if (!userInput.length() <= 50) { return false; } /* Then perform query on database using API to build expression */ //Connect to the local MongoDB instance try(MongoClient mongoClient = new MongoClient()){ MongoDatabase db = mongoClient.getDatabase("test"); //Use API query builder to create call expression //Create expression Bson expression = eq("borough", userInput); //Perform call FindIterable<org.bson.Document> restaurants = db.getCollection("restaurants").find(expression); //Verify result consistency restaurants.forEach(new Block<org.bson.Document>() { @Override public void apply(final org.bson.Document doc) { String restBorough = (String)doc.get("borough"); if (!"Brooklyn".equals(restBorough)) { return false; } } }); } References¶ Testing for NoSQL injection SQL and NoSQL Injection No SQL, No Injection? Log Injection¶ Symptom¶ Log Injection occurs when an application includes untrusted data in an application log message (e.g., an attacker can cause an additional log entry that looks like it came from a completely different user, if they can inject CRLF characters in the untrusted data). More information about this attack is available on the OWASP Log Injection page. How to prevent¶ To prevent an attacker from writing malicious content into the application log, apply defenses such as: Use structured log formats, such as JSON, instead of unstructured text formats. Unstructured formats are susceptible to Carriage Return (CR) and Line Feed (LF) injection (see CWE-93). Limit the size of the user input value used to create the log message. Make sure all XSS defenses are applied when viewing log files in a web browser. Example using Log4j Core 2¶ The recommended logging policy for a production environment is sending logs to a network socket using the structured JSON Template Layout introduced in Log4j 2.14.0 and limit the size of strings to 500 bytes using the maxStringLength configuration attribute: <?xml version="1.0" encoding="UTF-8"?> <Configuration xmlns="https://logging.apache.org/xml/ns" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation=" https://logging.apache.org/xml/ns https://logging.apache.org/xml/ns/log4j-config-2.xsd"> <Appenders> <Socket name="SOCKET" host="localhost" port="12345"> <!-- Limit the size of any string field in the produced JSON document to 500 bytes --> <JsonTemplateLayout maxStringLength="500" nullEventDelimiterEnabled="true"/> </Socket> </Appenders> <Loggers> <Root level="DEBUG"> <AppenderRef ref="SOCKET"/> </Root> </Loggers> </Configuration> See Integration with service-oriented architectures on Log4j website for more tips. Usage of the logger at code level: import org.apache.logging.log4j.LogManager; import org.apache.logging.log4j.Logger; ... // Most common way to declare a logger private static final LOGGER = LogManager.getLogger(); // GOOD! // // Use parameterized logging to add user data to a message // The pattern should be a compile-time constant logger.warn("Login failed for user {}.", username); // BAD! // // Don't mix string concatenation and parameters // If `username` contains `{}`, the exception will leak into the message logger.warn("Failure for user " + username + " and role {}.", role, ex); ... See Log4j API Best Practices for more information. Example using Logback¶ The recommended logging policy for a production environment is using the structured JsonEncoder introduced in Logback 1.3.8. In the example below, Logback is configured to roll on 10 log files of 5 MiB each: <?xml version="1.0" encoding="UTF-8" ?> <!DOCTYPE configuration> <configuration> <import class="ch.qos.logback.classic.encoder.JsonEncoder"/> <import class="ch.qos.logback.core.rolling.FixedWindowRollingPolicy"/> <import class="ch.qos.logback.core.rolling.RollingFileAppender"/> <import class="ch.qos.logback.core.rolling.SizeBasedTriggeringPolicy"/> <appender name="RollingFile" class="RollingFileAppender"> <file>app.log</file> <rollingPolicy class="FixedWindowRollingPolicy"> <fileNamePattern>app-%i.log</fileNamePattern> <minIndex>1</minIndex> <maxIndex>10</maxIndex> </rollingPolicy> <triggeringPolicy class="SizeBasedTriggeringPolicy"> <maxFileSize>5MB</maxFileSize> </triggeringPolicy> <encoder class="JsonEncoder"/> </appender> <root level="DEBUG"> <appender-ref ref="SOCKET"/> </root> </configuration> Usage of the logger at code level: import org.slf4j.Logger; import org.slf4j.LoggerFactory; ... // Most common way to declare a logger Logger logger = LoggerFactory.getLogger(MyClass.class); // GOOD! // // Use parameterized logging to add user data to a message // The pattern should be a compile-time constant logger.warn("Login failed for user {}.", username); // BAD! // // Don't mix string concatenation and parameters // If `username` contains `{}`, the exception will leak into the message logger.warn("Failure for user " + username + " and role {}.", role, ex); ... References¶ Log4j Core Configuration File Log4j JSON Temp'''
