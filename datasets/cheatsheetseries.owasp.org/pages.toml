["https://cheatsheetseries.owasp.org/cheatsheets/Abuse_Case_Cheat_Sheet.html"]
title = "Abuse Case - OWASP Cheat Sheet Series"
description = "Website with the collection of all the cheat sheets of the project."
full_description = '''Abuse Case Cheat Sheet¶ Introduction¶ Often when the security level of an application is mentioned in requirements, the following expressions are met: The application must be secure. The application must defend against all attacks targeting this category of application. The application must defend against attacks from the OWASP TOP 10 ... These security requirements are too generic, and thus useless for a development team... In order to build a secure application, from a pragmatic point of view, it is important to identify the attacks which the application must defend against, according to its business and technical context. Abuse cases are a frequently recommended threat modeling tool, and reviewing the threat modeling cheat sheet may be helpful. Objective¶ The objective of this cheat sheet is to provide an explanation of what an Abuse Case is, how abuse cases can be important when considering the security of an application, and finally to provide a proposal for a pragmatic approach to building a list of abuse cases and tracking them for every feature planned for implementation as part of an application. The cheat sheet may be used for this purpose regardless of the project methodology used (waterfall or agile). Important note about this Cheat Sheet: The main objective is to provide a pragmatic approach in order to allow a company or a project team to start building and handling the list of abuse cases and then customize the elements proposed to its context/culture in order to, finally, build its own method. This cheat sheet can be seen as a getting-started tutorial. Context & approach¶ Why clearly identify the attacks¶ Clearly identifying the attacks against which the application must defend is essential in order to enable the following steps in a project or sprint: Evaluate the business risk for each of the identified attacks in order to perform a selection according to the business risk and the project/sprint budget. Derive security requirements and add them into the project specification or sprint's user stories and acceptance criteria. Estimate the overhead of provision in the initial project/sprint charge that will be necessary to implement the countermeasures. About countermeasures: Allow the project team to define them, and to determine in which location (network, infrastructure, code...) they should be located. Notion of Abuse Cases¶ You can think of Abuse cases in two ways. The first is to discover attacks (answer the question "what can go wrong"), and the second is to help record those attacks (informally, this includes threats, issues, risks) in a form that may be less intimidating to developers. An Abuse Case can be defined as: A way to use a feature that was not expected by the implementer, allowing an attacker to influence the feature or outcome of use of the feature based on the attacker action (or input). Synopsis defines an Abuse Case like this: Misuse and abuse cases describe how users misuse or exploit the weaknesses of controls in software features to attack an application. This can lead to tangible business impact when a direct attack against business functionalities, which may bring in revenue or provide positive user experience, are attacked. Abuse cases can also be an effective way to drive security requirements that lead to proper protection of these critical business use cases. Synopsis source How to define the list of Abuse Cases¶ There are many different ways to define the list of abuse cases for a feature (that can be mapped to a user story in agile projects). Threat Modeling is a set of techniques for anticipating what can go wrong, and ensuring we do something about each identified possible scenario. Taking each item on the list of "what are we going to do about it" and writing an abuse case may help your engineering teams process the output. The project OWASP Open SAMM proposes the following approach in the Stream B of the Security Practice Requirements Driven Testing for the Maturity level 2: Misuse and abuse cases describe unintended and malicious use scenarios of the application, describing how an attacker could do this. Create misuse and abuse cases to misuse or exploit the weaknesses of controls in software features to attack an application. Use abuse-case models for an application to serve as fuel for identification of concrete security tests that directly or indirectly exploit the abuse scenarios. Abuse of functionality, sometimes referred to as a “business logic attack”, depends on the design and implementation of application functions and features. An example is using a password reset flow to enumerate accounts. As part of business logic testing, identify the business rules that are important for the application and turn them into experiments to verify whether the application properly enforces the business rule. For example, on a stock trading application, is the attacker allowed to start a trade at the beginning of the day and lock in a price, hold the transaction open until the end of the day, then complete the sale if the stock price has risen or cancel if the price dropped? Open SAMM source: Verification Requirement Driven Testing Stream B Another way to achieve the building of the list can be the following (more bottom-up and collaboratively oriented): Make a workshop that includes people with the following profiles: Business analyst: Will be the business key people that will describe each feature from a business point of view. Risk analyst: Will be the company's risk personnel that will evaluate the business risk from a proposed attack (sometimes it is the Business analyst depending on the company). Penetration tester: Will be the attacker that will propose attacks that they can perform on the business feature(s) in question. If the company does not have a person with this profile then it is possible to request the service of an external specialist. If possible, include 2 penetration testers with different backgrounds in order to increase the number of possible attacks that will be identified and considered. Technical leaders of the projects: Will be the project technical people and will allow technical exchange about attacks and countermeasures identified during the workshop. Quality assurance analyst or functional tester: Personnel that may have a good sense of how the application/functionality is intended to work (positive testing), not work (negative testing), and what things cause it to fail (failure cases). During this workshop (duration will depend on the size of the feature list, but 4 hours is a good start) all business features that will be part of the project or the sprint will be processed. The output of the workshop will be a list of attacks (abuse cases) for all business features. All abuse cases will have a risk rating that allows for filtering and prioritization. It is important to take into account Technical and Business kind of abuse cases and mark them accordingly. Example: Technical flagged abuse case: Add Cross Site Scripting injection into a comment input field. Business flagged abuse case: Ability to arbitrarily modify the price of an article in an online shop prior to passing an order causing the user to pay a lower amount for the wanted article. When to define the list of Abuse Cases¶ In agile projects, the definition workshop must be made after the meeting in which User Stories are included in a Sprint. In waterfall projects, the definition workshop must be made when the business features to implement are identified and known by the business. Whatever the mode of the project used (agile or waterfall), the abuse cases selected to be addressed must become security requirements in each feature specification section (waterfall) or User Story acceptance criteria (agile) in order to allow additional cost/effort evaluation, identification and implementation of the countermeasures. Each abuse case must have a unique identifier in order to allow tracking throughout the whole project/sprint (details about this point will be given in the proposal section). An example of unique ID format can be ABUSE_CASE_001. The following figure provides an overview of the chaining of the different steps involved (from left to right): Proposal¶ The proposal will focus on the output of the workshop explained in the previous section. Step 1: Preparation of the workshop¶ First, even if it seems obvious, the key business people must be sure to know, understand and be able to explain the business features that will be processed during the workshop. Secondly, create a new Microsoft Excel file (you can also use Google Sheets or any other similar software) with the following sheets (or tabs): FEATURES Will contain a table with the list of business features planned for the workshop. ABUSE CASES Will contain a table with all abuse cases identified during the workshop. COUNTERMEASURES Will contain a table with the list of possible countermeasures (light description) imagined for the abuse cases identified. This sheet is not mandatory, but it can be useful (for an abuse case to know), if a fix is easy to implement and then can impact the risk rating. Countermeasures can be identified by the AppSec profile during the workshop, because an AppSec person must be able to perform attacks but also to build or identify defenses (it is not always the case for the Pentester profile because this person's focus is generally on the attack side only, so, the combination Pentester + AppSec is very efficient to have a 360 degree view). This is the representation of each sheet along with an example of content that will be filled during the workshop: FEATURES sheet: Feature unique ID Feature name Feature short description FEATURE_001 DocumentUploadFeature Allow user to upload document along a message COUNTERMEASURES sheet: Countermeasure unique ID Countermeasure short description Countermeasure help/hint DEFENSE_001 Validate the uploaded file by loading it into a parser Use advice from the OWASP Cheat Sheet about file upload ABUSE CASES sheet: Abuse case unique ID Feature ID impacted Abuse case's attack description Attack referential ID (if applicable) CVSS V3 risk rating (score) CVSS V3 string Kind of abuse case Countermeasure ID applicable Handling decision (To Address or Risk Accepted) ABUSE_CASE_001 FEATURE_001 Upload Office file with malicious macro in charge of dropping a malware CAPEC-17 HIGH (7.7) CVSS:3.0/AV:N/AC:H/PR:L/UI:R/S:C/C:N/I:H/A:H Technical DEFENSE_001 To Address Step 2: During the workshop¶ Use the spreadsheet to review all the features. For each feature, follow this flow: Key business people explain the current feature from a business point of view. Penetration testers propose and explain a set of attacks that they can perform against the feature. For each attack proposed: Appsec proposes a countermeasure and a preferred set up location (infrastructure, network, code, design...). Technical people give feedback about the feasibility of the proposed countermeasure. Penetration testers use the CVSS v3 (or other standard) calculator to determine a risk rating. (ex: CVSS V3 calculator) Risk leaders should accept or modify the risk rating to determine the final risk score which accurately reflects the real business impact for the company. Business, Risk, and Technical leaders should find a consensus and filter the list of abuses for the current feature to keep the ones that must be addressed, and then flag them accordingly in the ABUSE CASES sheet (if risk is accepted then add a comment to explain why). Pass to next feature... If the presence of penetration testers is not possible then you can use the following references to identify the applicable attacks on your features: OWASP Automated Threats to Web Applications OWASP Testing Guide OWASP Mobile Testing Guide Common Attack Pattern Enumeration and Classification (CAPEC) Important note on attacks and countermeasure knowledge base(s): With time and experience across projects, you will obtain your own dictionary of attacks and countermeasures that are applicable to the kind of application in your business domain. This dictionary will speed up the future workshops in a significant way. To promote the creation of this dictionary, you can, at the end of the project/sprint, gather the list of attacks and countermeasures identified in a central location (wiki, database, file...) that will be used during the next workshop in combination with input from penetration testers. Step 3: After the workshop¶ The spreadsheet contains (at this stage) the list of all abuse cases that must be handled and, potentially (depending on the capacity) corresponding countermeasures. Now, there are two remaining task: Key business people must update the specification of each feature (waterfall) or the User Story of each feature (agile) to include the associated abuse cases as Security Requirements (waterfall) or Acceptance Criteria (agile). Key technical people must evaluate the overhead in terms of expense/effort to take into account the countermeasure. Step 4: During implementation - Abuse cases handling tracking¶ In order to track the handling of all the abuse cases, the following approach can be used: If one or several abuse cases are handled at: Design, Infrastructure or Network level Make a note in the documentation or schema to indicate that This design/network/infrastructure takes into account the abuse cases ABUSE_CASE_001, ABUSE_CASE_002, ABUSE_CASE_xxx. Code level Put a special comment in the classes/scripts/modules to indicate that This class/module/script takes into account the abuse cases ABUSE_CASE_001, ABUSE_CASE_002, ABUSE_CASE_xxx. Dedicated annotation like @AbuseCase(ids={"ABUSE_CASE_001","ABUSE_CASE_002"}) can be used to facilitate tracking and allow identification into integrated development environment. Using this way, it becomes possible (via some minor scripting) to identify where abuse cases are addressed. Step 5: During implementation - Abuse cases handling validation¶ As abuse cases are defined, it is possible to put in place automated or manual validations to ensure that: All the selected abuse cases are handled. An abuse case is correctly/completely handled. Validations can be of the following varieties: Automated (run regularly at commit, daily or weekly in the Continuous Integration Jobs of the project): Custom audit rules in Static Application Security Testing (SAST) or Dynamic Application Security Testing (DAST) tools. Dedicated unit, integration or functional security oriented tests. ... Manual: Security code review between project's peers during the design or implementation. Provide the list of all abuse cases addressed to pentesters so that they may validate the protection efficiency for each abuse case during an intrusion test against the application (the pentester will validate that the attacks identified are no longer effective and will also try to find other possible attacks). ... Adding automated tests also allow t'''
