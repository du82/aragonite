full_description = '''GraphQL Cheat Sheet¶ Introduction¶ GraphQL is an open source query language originally developed by Facebook that can be used to build APIs as an alternative to REST and SOAP. It has gained popularity since its inception in 2012 because of the native flexibility it offers to those building and calling the API. There are GraphQL servers and clients implemented in various languages. Many companies use GraphQL including GitHub, Credit Karma, Intuit, and PayPal. This Cheat Sheet provides guidance on the various areas that need to be considered when working with GraphQL: Apply proper input validation checks on all incoming data. Expensive queries will lead to Denial of Service (DoS), so add checks to limit or prevent queries that are too expensive. Ensure that the API has proper access control checks. Disable insecure default configurations (e.g. excessive errors, introspection, GraphiQL, etc.). Common Attacks¶ Injection - this usually includes but is not limited to: SQL and NoSQL injection OS Command injection SSRF and CRLF injection/Request Smuggling DoS (Denial of Service) Abuse of broken authorization: either improper or excessive access, including IDOR Batching Attacks, a GraphQL-specific method of brute force attack Abuse of insecure default configurations Best Practices and Recommendations¶ Input Validation¶ Adding strict input validation can help prevent against injection and DoS. The main design for GraphQL is that the user supplies one or more identifiers and the backend has a number of data fetchers making HTTP, DB, or other calls using the given identifiers. This means that user input will be included in HTTP requests, DB queries, or other requests/calls which provides opportunity for injection that could lead to various injection attacks or DoS. See the OWASP Cheat Sheets on Input Validation and general injection prevention for full details to best perform input validation and prevent injection. General Practices¶ Validate all incoming data to only allow valid values (i.e. allowlist). Use specific GraphQL data types such as scalars or enums. Write custom GraphQL validators for more complex validations. Custom scalars may also come in handy. Define schemas for mutations input. List allowed characters - don't use a denylist The stricter the list of allowed characters the better. A lot of times a good starting point is only allowing alphanumeric, non-unicode characters because it will disallow many attacks. To properly handle unicode input, use a single internal character encoding Gracefully reject invalid input, being careful not to reveal excessive information about how the API and its validation works. Injection Prevention¶ When handling input meant to be passed to another interpreter (e.g. SQL/NoSQL/ORM, OS, LDAP, XML): Always choose libraries/modules/packages offering safe APIs, such as parameterized statements. Ensure that you follow the documentation so you are properly using the tool Using ORMs and ODMs are a good option but they must be used properly to avoid flaws such as ORM injection. If such tools are not available, always escape/encode input data according to best practices of the target interpreter Choose a well-documented and actively maintained escaping/encoding library. Many languages and frameworks have this functionality built-in. For more information see the below pages: SQL Injection Prevention NoSQL Injection Prevention LDAP Injection Prevention OS Command Injection Prevention XML Security and XXE Injection Prevention Process Validation¶ When using user input, even if sanitized and/or validated, it should not be used for certain purposes that would give a user control over data flow. For example, do not make an HTTP/resource request to a host that the user supplies (unless there is an absolute business need). DoS Prevention¶ DoS is an attack against the availability and stability of the API that can make it slow, unresponsive, or completely unavailable. This CS details several methods to limit the possibility of a DoS attack at the application level and other layers of the tech stack. There is also a CS dedicated to the topic of DoS. Here are recommendations specific to GraphQL to limit the potential for DoS: Add depth limiting to incoming queries Add amount limiting to incoming queries Add pagination to limit the amount of data that can be returned in a single response Add reasonable timeouts at the application layer, infrastructure layer, or both Consider performing query cost analysis and enforcing a maximum allowed cost per query Enforce rate limiting on incoming requests per IP or user (or both) to prevent basic DoS attacks Implement the batching and caching technique on the server-side (Facebook's DataLoader can be used for this) Query Limiting (Depth & Amount)¶ In GraphQL each query has a depth (e.g. nested objects) and each object requested in a query can have an amount specified (e.g. 99999999 of an object). By default these can both be unlimited which may lead to a DoS. You should set limits on depth and amount to prevent DoS, but this usually requires a small custom implementation as it is not natively supported by GraphQL. See this and this page for more information about these attacks and how to add depth and amount limiting. Adding pagination can also help performance. APIs using graphql-java can utilize the built-in MaxQueryDepthInstrumentation for depth limiting. APIs using JavaScript can use graphql-depth-limit to implement depth limiting and graphql-input-number to implement amount limiting. Here is an example of a GraphQL query with depth N: query evil { # Depth: 0 album(id: 42) { # Depth: 1 songs { # Depth: 2 album { # Depth: 3 ... # Depth: ... album {id: N} # Depth: N } } } } Here is an example of a GraphQL query requesting 99999999 of an object: query { author(id: "abc") { posts(first: 99999999) { title } } } Timeouts¶ Adding timeouts can be a simple way to limit how many resources any single request can consume. But timeouts are not always effective since they may not activate until a malicious query has already consumed excessive resources. Timeout requirements will differ by API and data fetching mechanism; there isn't one timeout value that will work across the board. At the application level, timeouts can be added for queries and resolver functions. This option is usually more effective since the query/resolution can be stopped once the timeout is reached. GraphQL does not natively support query timeouts so custom code is required. See this blog post for more about using timeouts with GraphQL or the two examples below. JavaScript Timeout Example Code snippet from this SO answer: request.incrementResolverCount = function () { var runTime = Date.now() - startTime; if (runTime > 10000) { // a timeout of 10 seconds if (request.logTimeoutError) { logger('ERROR', `Request ${request.uuid} query execution timeout`); } request.logTimeoutError = false; throw 'Query execution has timeout. Field resolution aborted'; } this.resolverCount++; }; Java Timeout Example using Instrumentation public class TimeoutInstrumentation extends SimpleInstrumentation { @Override public DataFetcher<?> instrumentDataFetcher( DataFetcher<?> dataFetcher, InstrumentationFieldFetchParameters parameters ) { return environment -> Observable.fromCallable(() -> dataFetcher.get(environment)) .subscribeOn(Schedulers.computation()) .timeout(10, TimeUnit.SECONDS) // timeout of 10 seconds .blockingFirst(); } } Infrastructure Timeout Another option to add a timeout that is usually easier is adding a timeout on an HTTP server (Apache/httpd, nginx), reverse proxy, or load balancer. However, infrastructure timeouts are often inaccurate and can be bypassed more easily than application-level ones. Query Cost Analysis¶ Query cost analysis involves assigning costs to the resolution of fields or types in incoming queries so that the server can reject queries that cost too much to run or will consume too many resources. This is not easy to implement and may not always be necessary but it is the most thorough approach to preventing DoS. See "Query Cost Analysis" in this blog post for more details on implementing this control. Apollo recommends: Before you go ahead and spend a ton of time implementing query cost analysis be certain you need it. Try to crash or slow down your staging API with a nasty query and see how far you get — maybe your API doesn’t have these kinds of nested relationships, or maybe it can handle fetching thousands of records at a time perfectly fine and doesn’t need query cost analysis! APIs using graphql-java can utilize the built-in MaxQueryComplexityInstrumentationto to enforce max query complexity. APIs using JavaScript can utilize graphql-cost-analysis or graphql-validation-complexity to enforce max query cost. Rate Limiting¶ Enforcing rate limiting on a per IP or user (for anonymous and unauthorized access) basis can help limit a single user's ability to spam requests to the service and impact performance. Ideally this can be done with a WAF, API gateway, or web server (Nginx, Apache/HTTPD) to reduce the effort of adding rate limiting. Or you could get somewhat complex with throttling and implement it in your code (non-trivial). See "Throttling" here for more about GraphQL-specific rate limiting. Server-side Batching and Caching¶ To increase efficiency of a GraphQL API and reduce its resource consumption, the batching and caching technique can be used to prevent making duplicate requests for pieces of data within a small time frame. Facebook's DataLoader tool is one way to implement this. System Resource Management¶ Not properly limiting the amount of resources your API can use (e.g. CPU or memory), may compromise your API responsiveness and availability, leaving it vulnerable to DoS attacks. Some limiting can be done at the operating system level. On Linux, a combination of Control Groups(cgroups), User Limits (ulimits), and Linux Containers (LXC) can be used. However, containerization platforms tend to make this task much easier. See the resource limiting section in the Docker Security Cheat Sheet for how to prevent DoS when using containers. Access Control¶ To ensure that a GraphQL API has proper access control, do the following: Always validate that the requester is authorized to view or mutate/modify the data they are requesting. This can be done with RBAC or other access control mechanisms. This will prevent IDOR issues, including both BOLA and BFLA. Enforce authorization checks on both edges and nodes (see example bug report where nodes did not have authorization checks but edges did). Use Interfaces and Unions to create structured, hierarchical data types which can be used to return more or fewer object properties, according to requester permissions. Query and Mutation Resolvers can be used to perform access control validation, possibly using some RBAC middleware. Disable introspection queries system-wide in any production or publicly accessible environments. Disable GraphiQL and other similar schema exploration tools in production or publicly accessible environments. General Data Access¶ It's commonplace for GraphQL requests to include one or more direct IDs of objects in order to fetch or modify them. For example, a request for a certain picture may include the ID that is actually the primary key in the database for that picture. As with any request, the server must verify that the caller has access to the object they are requesting. But sometimes developers make the mistake of assuming that possession of the object's ID means the caller should have access. Failure to verify the requester's access in this case is called Broken Object Level Authentication, also known as IDOR. It's possible for a GraphQL API to support access to objects using their ID even if that is not intended. Sometimes there are node or nodes or both fields in a query object, and these can be used to access objects directly by ID. You can check whether your schema has these fields by running this on the command-line (assuming that schema.json contains your GraphQL schema): cat schema.json | jq ".data.__schema.types[] | select(.name==\"Query\") | .fields[] | .name" | grep node. Removing these fields from the schema should disable the functionality, but you should always apply proper authorization checks to verify the caller has access to the object they are requesting. Query Access (Data Fetching)¶ As part of a GraphQL API there will be various data fields that can be returned. One thing to consider is if you want different levels of access around these fields. For example, you may only want certain consumers to be able to fetch certain data fields rather than allowing all consumers to be able to retrieve all available fields. This can be done by adding a check in the code to ensure that the requester should be able to read a field they are trying to fetch. Mutation Access (Data Manipulation)¶ GraphQL supports mutation, or manipulation of data, in addition to its most common use case of data fetching. If an API implements/allows mutation then there may need to be access controls put in place to restrict which consumers, if any, can modify data through the API. Setups that require mutation access control would include APIs where only read access is intended for requesters or where only certain parties should be able to modify certain fields. Batching Attacks¶ GraphQL supports batching requests, also known as query batching. This lets callers to either batch multiple queries or batch requests for multiple object instances in a single network call, which allows for what is called a batching attack. This is a form of brute force attack, specific to GraphQL, that usually allows for faster and less detectable exploits. Here is the most common way to do query batching: [ { query: < query 0 >, variables: < variables for query 0 >, }, { query: < query 1 >, variables: < variables for query 1 >, }, { query: < query n > variables: < variables for query n >, } ] And here is an example query of a single batched GraphQL call requesting multiple different instances of the droid object: query { droid(id: "2000") { name } second:droid(id: "2001") { name } third:droid(id: "2002") { name } } In this case it could be used to enumerate every possible droid object that is stored on the server in very few network requests as opposed to a standard REST API where the requester would need to submit a different network request for every different droid ID they want to request. This type of attack can lead to the following issues: Application-level DoS attacks - A high number of queries or object requests in a single network call could cause a database to hang or exhaust other available resources (e.g. memory, CPU, downstream services). Enumeration of objects on the server, such as users, emails, and user IDs. Brute forcing passwords, 2 factor authentication codes (OTPs), session tokens, or other sensitive values. WAFs, RASPs, IDS/IPS,'''
