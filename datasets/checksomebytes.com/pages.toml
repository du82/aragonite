full_description = "What Certification should you pursue next? 2020-10-22Career Development People often ask me for advice on what certification they should be pursuing. As with most questions in IT, the answer is, “It depends…” The “right” certification for any given individual will vary greatly depending on where they are in their career and where they want to go. Here are a handful of things to consider while deciding what to study for next. INITIAL CONSIDERATIONS JOB POSTINGS/REQUIREMENTS If your next career move involves applying for external positions, take the time to research the certifications listed for the type of role you are pursuing. SANS FOR508/GCFA Review 2020-08-27Career Development PLEASE DO NOT ASK FOR MATERIALS FROM THE COURSE OR INSIGHT INTO THE QUESTIONS ON THE EXAM. TLDR This course was an incredible dive into host based forensics and I would highly recommend it for anyone interested in expanding their understanding of the incident response process with host artifacts. I walked away from this course with a much better grasp on how attackers move through an environment and where to find the evidence of their activities."
