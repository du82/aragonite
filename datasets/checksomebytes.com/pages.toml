title = "Career Development - Check Some Bytes"
description = "Unsolicited Advice and Infosec Research Findings"
full_description = "SANS FOR509 Review 2022-12-24Career Development TLDR This course focuses on the information that we can leverage from cloud logs and highlights the “gotchas” of when and how they are generated/collected. Compared to traditional forensics, cloud does not offer the same depth of artifacts due to it’s abstracted nature. As a threat hunter, I walked away with a better understanding of where to find various types of activity within the different cloud providers. Overall Thoughts Content FOR509 was a well-paced course without much fluff that dives deep into the content right out the gate on day one. Resume Tips and Tricks 2022-03-31Career Development Resume Mindset Resumes ARE not intended to be an archaeological record of everything you did in every role in your career. If you build it that way it’s going to be a swamp of bullet points that will take a recruiter a ton of time to sift value from. The purpose of a resume is to communicate relevant experience as succinctly as possible to prove that you can do a certain role at a certain company. Prepping for a GIAC Exam 2021-11-18Career Development TLDR I use a method to prepare for GIAC certifications that isn’t the quickest or the easiest but it builds reference material that’s useful during and after the exam. The two outputs of this method are a binder of your notes boiled down from the full course content and a set of GIAC course books that have been carefully tabbed for quick reference. This is not the ONLY method, but it has worked well for me. SANS SEC542/GWAPT Review 2021-06-06Career Development PLEASE DO NOT ASK FOR MATERIALS FROM THE COURSE OR INSIGHT INTO THE QUESTIONS ON THE EXAM. TLDR This course did an excellent job of building a solid foundation around how protocols/services are intended to work before showing how to exploit them manually. While this course is not designed to produce world-class, cutting-edge red-teamers, it does lay the groundwork to begin that journey if you want to pursue it further. Many of the techniques used are great for illustrating exploits/methodologies but require additional strategies to bypass modern defenses."
