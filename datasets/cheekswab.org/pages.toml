["https://cheekswab.org/need-for-donors"]
title = "Need « Join the National Bone Marrow Registry Today || cheekswab.org"
description = "Registering to be a bone marrow donor is simple and painless and is a potentially life saving act for a patient in need."
full_description = "Skip to Content Search cheekswab.org: Search Twitter Facebook YouTube Blog RSS Home About Founder's Story Cheekswab Q&A Need Causes Ethnic Minorities Awareness Financial Support Join Commitment Medical Guidelines Registration Process Order a Swab Kit Online Donating Marrow PBSC and Marrow Donation Logistics and Time Commitment Does it Hurt? and FAQs Donation Stories Get Involved Host a Drive Links and Organizations Partner with Cheekswab Calendar Contact Select a page Home About Founder's Story Cheekswab Q&A » Need Causes Ethnic Minorities Awareness Financial Support Join Commitment Medical Guidelines Registration Process Order a Swab Kit Online Donating Marrow PBSC and Marrow Donation Logistics and Time Commitment Does it Hurt? and FAQs Donation Stories Get Involved Host a Drive Links and Organizations Partner with Cheekswab Calendar Contact Need » Home » Need A Need for Donors Matching bone marrow donors to patients requires matching 12 specific DNA markers that are highly ethnicity-specific. 7 out of 10 patients who need a transplant do not have a suitable donor in their family and must look to public registries for a life-saving marrow donation. Why should bone marrow registration matter to me? What is bone marrow and what are bone marrow transplants? Why is there a need for bone marrow donors? People get blood transfusions all the time and it sounds simple enough. People get blood transfusions all the time and it sounds simple enough. Need Sections Need Causes Ethnic Minorities Awareness Financial Support Why should bone marrow registration matter to me? There are several reasons: They are life or death procedures. Due to the risks involved for the patient, bone marrow transplants are usually the final life-saving procedure suggested for patients in need. By registering to be a donor, you open yourself up to the possibility of literally saving someone's life one day. Registering to be a donor is simple and painless. Fill out medical/contact details on one form, take DNA samples by rubbing four cotton swabs on the inside of your mouth for 20 seconds each, and send the form off to the Be The Match Registry for processing. No blood draws, no lengthy interviews. It's that easy. The patient needing the transplant is the most important person in the world to somebody. All patients searching the Be The Match Registry are a parent, a sibling, a spouse, a child or a best friend. I believe that everyone who has someone in their life that they love more than themselves can empathize with what it must be like to be powerless to help that person in their time of greatest need. The ability to offer the gift of life to another in such a circumstance is a tremendous opportunity, not only for the recipient but for the donor as well. As the registry grows, everyone's chance of survival increases. In some instances cancer and disease are a result of patient choices -- excessive smoking, drinking, or unhealthy habits. However, cancer is so devastating because it often seems random in those it afflicts. From healthy adults, active 20-somethings to newborns, it's impossible to know who in life will need a life-saving transplant. As a donor, the marrow you choose to donate may one day save the life of a friend, a neighbor, or even someone in your own family. This is why both registering and spreading awareness is so important -- the more people who join, the better off everyone is. [top] What is bone marrow and what are bone marrow transplants? Bone marrow is the part of the body which produces the blood. Blood is made up of four main components: red blood cells, white blood cells, platelets and plasma. Each of these components serve an important function in the operation of the human body: Red blood cells carry oxygen to and from organs; White blood cells act as carriers of the body's immune system, which allows the body to fight sickness and infection; Platelets aid in clotting, like when a cut stops bleeding; Plasma is the liquid in which all the other blood cells move. When someone’s bone marrow becomes defective in some way, the body is unable to create normal blood cells. Based on the roles of the various blood components above, this poses very severe health risks, including an inability to transport oxygen, an inability to stop bleeding, and an inability to fight infection. Depending on the specifics of the diagnosis, patients undergo a variety of procedures, which can include chemotherapy. When a patient’s bone marrow is unresponsive to alternative measures, that means the bone marrow must be replaced. Humans are capable of receiving and growing bone marrow from others via transplant, which opens the door for the Be the Match Registry and bone marrow donors. [top] Why is there a need for bone marrow donors? People get blood transfusions all the time and it sounds simple enough. The matching required for a bone marrow transplant is much more specific than the matching required between blood transfusion recipients. In order to receive a bone marrow transplant from another individual, a donor and recipient must have matching human leukocyte antigen (HLA) tissue types. HLAs are protein markers that the immune system uses to recognize which cells belong in the body and which do not. To minimize the chances of a transplant rejection, these HLA tissue types must match as closely as possible. (Source: bethematch.org) [top] Pages About Cheekswab Ethnic Minorities Registration Process Does it Hurt? Don't Be Shy If you're from an ethnic minority group, please use the Contact Form to ask questions, provide feedback or coordinate a drive! Parties of all sizes are welcome and needed. Disclaimer The goal of this site is to present as much information about bone marrow donation as honestly and clearly as possible. Please remember, Cheekswab is NOT a medical or legal entity. Please consult a doctor before making any decisions regarding your health. Links BeTheMatch.org SAMARinfo.org AADP.org BlackBoneMarrow.com Copyright © Cheekswab 2012. All rights reserved. (function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){ (i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o), m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m) })(window,document,'script','//www.google-analytics.com/analytics.js','ga'); ga('create', 'UA-25803035-2', 'auto'); ga('send', 'pageview');"
