title = "Links and Organizations « Join the National Bone Marrow Registry Today || cheekswab.org"
description = "Thankfully we are but one of a number of organizations and websites that seek to increase membership into the national bone marrow registry. Please contact the organization in your geographic area to learn more about programs, volunteer opportunities, and local drives."
full_description = "Skip to Content Search cheekswab.org: Search Twitter Facebook YouTube Blog RSS Home About Founder's Story Cheekswab Q&A Need Causes Ethnic Minorities Awareness Financial Support Join Commitment Medical Guidelines Registration Process Order a Swab Kit Online Donating Marrow PBSC and Marrow Donation Logistics and Time Commitment Does it Hurt? and FAQs Donation Stories Get Involved Host a Drive Links and Organizations Partner with Cheekswab Calendar Contact Select a page Home About Founder's Story Cheekswab Q&A Need Causes Ethnic Minorities Awareness Financial Support Join Commitment Medical Guidelines Registration Process Order a Swab Kit Online Donating Marrow PBSC and Marrow Donation Logistics and Time Commitment Does it Hurt? and FAQs Donation Stories Get Involved Host a Drive » Links and Organizations Partner with Cheekswab Calendar Contact Links and Organizations » Home » Get Involved » Links and Organizations Online Resources Thankfully we are but one of a number of organizations and websites that seek to increase membership into the national bone marrow registry. Please contact the organization in your geographic area to learn more about programs, volunteer opportunities, and local drives. Please let us know if you’d like to see another organization/site on this list! Organizations by Location National: Be the Match, the facilitator of the world’s largest and most diverse registry in the world with 10 million potential donors. Visit the Be The Match website at http://www.bethematch.org. National: DKMS, a worldwide bone marrow donor center that has registered over 2 million donors into the Be The Match Registry. Visit DKMS at http://www.deletebloodcancer.org/en. East Coast: Swab a Cheek -- Increasing Racial and Ethnic Diversity in the Bone Marrow Registry at http://www.swabacheek.org. West Coast (CA): Asian American Donor Program -- Multi-ethnic donor program at http://www.aadp.org. West Coast (CA): A3M -- Asians for Miracle Marrow Matches at http://www.a3mhope.org/. Africa (Nigeria): Bone Marrow Nigeria, an African registry championed by leukemia survivor, Olympic hopeful and friend Seun Adebiyi at http://www.bonemarrownigeria.org. Read more about his remarkable and inspiring story via The New York Times. Public Initiatives Helping Janet: Website created to find a match for Janet Liang, an acute lymphoblastic leukemia patient in California. http://www.helpingjanet.com. Helping Tami: Website created to find a match for Tami, an MDS (myelodysplasia) patient. She received a stem cell transplant in June 2009 from an anonymous donor and has been in remission since. http://www.helpingtami.org. MarrowDrives.org: A fantastic resource to learn more about the process of conducting marrow drives, including tutorials and a wealth of resources/background information. Affiliated with helpingtami.org. http://www.marrowdrives.org. Ethnicity-Specific ABMDR: The Armenian Bone Marrow Donor Registry website at http://www.abmdr.am/. SAMAR: South Asian Marrow Association of Recruiters website at http://www.samarinfo.org/. Related Causes StupidCancer.com: a non-profit organization that empowers young adults affected by cancer through innovative and award-winning programs and services. Learn more at http://stupidcancer.com/. Life with Cancer: Life with Cancer, a part of Northern Virginia’s Inova Health System, offers support and education for anyone affected by cancer to help people cope with their individual cancer and its treatments in the best way possible. Learn more at http://www.lifewithcancer.org/. Save the Cord Foundation: New parents can choose to donate cord blood to treat over 80 diseases, including blood cancers. Learn more at http://www.savethecordfoundation.org/. Benjamin Rubenstein, Superman Cancer Slayer: I met Ben at a Life with Cancer young adult event. He beat cancer twice before the age of 21, went on to publish a book about his experiences, and speaks about his sickness and book to groups around the country. Learn more at http://www.cancerslayerblog.com/. Get Involved Sections Get Involved Host a Drive Links and Organizations Partner with Cheekswab Pages About Cheekswab Ethnic Minorities Registration Process Does it Hurt? Don't Be Shy If you're from an ethnic minority group, please use the Contact Form to ask questions, provide feedback or coordinate a drive! Parties of all sizes are welcome and needed. Disclaimer The goal of this site is to present as much information about bone marrow donation as honestly and clearly as possible. Please remember, Cheekswab is NOT a medical or legal entity. Please consult a doctor before making any decisions regarding your health. Links BeTheMatch.org SAMARinfo.org AADP.org BlackBoneMarrow.com Copyright © Cheekswab 2012. All rights reserved. (function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){ (i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o), m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m) })(window,document,'script','//www.google-analytics.com/analytics.js','ga'); ga('create', 'UA-25803035-2', 'auto'); ga('send', 'pageview');"
