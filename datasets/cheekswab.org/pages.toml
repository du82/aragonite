title = "Host a Drive « Join the National Bone Marrow Registry Today || cheekswab.org"
description = "Hosting a drive at your workplace, social gathering, or place of worship is the single most effective way to increase registry enrollment."
full_description = "Skip to Content Search cheekswab.org: Search Twitter Facebook YouTube Blog RSS Home About Founder's Story Cheekswab Q&A Need Causes Ethnic Minorities Awareness Financial Support Join Commitment Medical Guidelines Registration Process Order a Swab Kit Online Donating Marrow PBSC and Marrow Donation Logistics and Time Commitment Does it Hurt? and FAQs Donation Stories Get Involved Host a Drive Links and Organizations Partner with Cheekswab Calendar Contact Select a page Home About Founder's Story Cheekswab Q&A Need Causes Ethnic Minorities Awareness Financial Support Join Commitment Medical Guidelines Registration Process Order a Swab Kit Online Donating Marrow PBSC and Marrow Donation Logistics and Time Commitment Does it Hurt? and FAQs Donation Stories Get Involved » Host a Drive Links and Organizations Partner with Cheekswab Calendar Contact Host a Drive » Home » Get Involved » Host a Drive Host a Drive Hosting a drive at your workplace, social gathering, or place of worship is the single most effective way to increase registry enrollment. If you feel convicted about the need for bone marrow donors and want to share that conviction with others, a great way to do so is to host a drive. Drives can be accommodated for any size of group, from close friends/family to gatherings of over 100 people. As a volunteer for the Be The Match, all of our drive supplies and promotional material comes directly from the organization. Drives handled by Cheekswab are preferably located within or around NYC and either in the evenings during weekdays or on the weekends. However, special distances/times can always be accommodated, so please make sure to contact us before assuming that we’d refuse a drive request. If we can’t handle a drive for you we’ll do our best to find someone else who can. The need for donors is simply too important to allow drives to slip through our fingers due to circumstance. Sign me up for a drive! Get Involved Sections Get Involved Host a Drive Links and Organizations Partner with Cheekswab What we can provide All drive materials, including registration forms, swab kits, instructional material, etc. A presentation introducing the bone marrow registry and the need for donors, which can vary in length depending on your needs. At a minimum we ask for at least 5 minutes. Longer times can also be accommodated (like for a church service), but please contact us to discuss the details of this type of request. Volunteers, depending on the scale, distance and timing of a drive. What you must provide Drive details (who / what / when / where / why), including the demographics of the group in question, the purpose/inspiration for the drive, the location, and the desired date/time. This information allows us to prepare/obtain enough materials from Be The Match, in addition to appropriately cater the drive presentation to your group. Reminders and notifications to drive attendees, to ensure a strong level of attendance and awareness for drive day. A quiet area and designated time allotment for the drive process, which includes a walkthrough of the commitment, medical guidelines, completion of the registration form and swab kit. This also varies based on the scale of the drive, but typically involves a room or hallway where 3-4 stations can be set up. In rare circumstances for very large drives we may request that you provide a few additional volunteers. The time commitment would be minimal and all instruction would be provided by us on drive day. Pages About Cheekswab Ethnic Minorities Registration Process Does it Hurt? Don't Be Shy If you're from an ethnic minority group, please use the Contact Form to ask questions, provide feedback or coordinate a drive! Parties of all sizes are welcome and needed. Disclaimer The goal of this site is to present as much information about bone marrow donation as honestly and clearly as possible. Please remember, Cheekswab is NOT a medical or legal entity. Please consult a doctor before making any decisions regarding your health. Links BeTheMatch.org SAMARinfo.org AADP.org BlackBoneMarrow.com Copyright © Cheekswab 2012. All rights reserved. (function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){ (i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o), m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m) })(window,document,'script','//www.google-analytics.com/analytics.js','ga'); ga('create', 'UA-25803035-2', 'auto'); ga('send', 'pageview');"
