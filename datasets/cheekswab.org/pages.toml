full_description = "Skip to Content Search cheekswab.org: Search Twitter Facebook YouTube Blog RSS Home About Founder's Story Cheekswab Q&A Need Causes Ethnic Minorities Awareness Financial Support Join Commitment Medical Guidelines Registration Process Order a Swab Kit Online Donating Marrow PBSC and Marrow Donation Logistics and Time Commitment Does it Hurt? and FAQs Donation Stories Get Involved Host a Drive Links and Organizations Partner with Cheekswab Calendar Contact Select a page Home About Founder's Story Cheekswab Q&A Need Causes Ethnic Minorities Awareness Financial Support » Join Commitment Medical Guidelines Registration Process Order a Swab Kit Online Donating Marrow PBSC and Marrow Donation Logistics and Time Commitment Does it Hurt? and FAQs Donation Stories Get Involved Host a Drive Links and Organizations Partner with Cheekswab Calendar Contact Join » Home » Join Joining the Registry Joining the Be The Match Registry is simple and painless. All it takes is 1 registration form and 4 cheek swabs. The steps for joining the bone marrow registry were crafted in the best interests of both the potential donor and recipient. Being on the marrow registry is accompanied by the commitment and responsibility that Be The Match requires all donors to agree to before joining. Also, because at the core donating marrow is a medical procedure, Be The Match requires that potential donors pass preliminary medical guidelines for both their safety and the safety of the patient. These guidelines are determined federally by organizations such as the FDA. Once the potential donor is ready to join, the registration process is very simple and completely painless. There is a somewhat lengthy registration form (for good reason) and a swab kit with four cheek swabs that are used to acquire cheek cells for HLA-typing. We walk you through what information you’ll need to complete that form and the swabbing process. If you’re unable to attend a drive in person, you can still order a swab kit to your home via the Be The Match website. Join Sections Join Commitment Medical Guidelines Registration Process Order a Swab Kit Online Pages About Cheekswab Ethnic Minorities Registration Process Does it Hurt? Don't Be Shy If you're from an ethnic minority group, please use the Contact Form to ask questions, provide feedback or coordinate a drive! Parties of all sizes are welcome and needed. Disclaimer The goal of this site is to present as much information about bone marrow donation as honestly and clearly as possible. Please remember, Cheekswab is NOT a medical or legal entity. Please consult a doctor before making any decisions regarding your health. Links BeTheMatch.org SAMARinfo.org AADP.org BlackBoneMarrow.com Copyright © Cheekswab 2012. All rights reserved. (function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){ (i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o), m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m) })(window,document,'script','//www.google-analytics.com/analytics.js','ga'); ga('create', 'UA-25803035-2', 'auto'); ga('send', 'pageview');"
