full_description = "Cheekswab is an independent initiative to spread awareness of the need for bone marrow donors within ethnic minority groups. Joining the marrow registry is simple and painless. Understand your commitment and rights as a donor. Are you attending a drive soon? Find out what to expect, information you need for forms, and other details. We understand that many people have fears or worries about becoming a marrow donor. Let's address some concerns. Hosting a drive at your workplace, social gathering, or place of worship is the single most effective way to increase registry enrollment. If you're from an ethnic minority group, please use the Contact Form to ask questions, provide feedback or coordinate a drive! Parties of all sizes are welcome and needed. The goal of this site is to present as much information about bone marrow donation as honestly and clearly as possible. Please remember, Cheekswab is NOT a medical or legal entity. Please consult a doctor before making any decisions regarding your health."
