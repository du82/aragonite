title = "Awareness « Join the National Bone Marrow Registry Today || cheekswab.org"
description = "Statistics indicate that ethnic minorities as a whole comprise roughly 25% of the marrow registry. Due to the specificity of the HLA-type markers that are required to match patients and donors, it's overwhelmingly likely that the match for a minority patient will be from a donor of the same ethnicity."
full_description = "Skip to Content Search cheekswab.org: Search Twitter Facebook YouTube Blog RSS Home About Founder's Story Cheekswab Q&A Need Causes Ethnic Minorities Awareness Financial Support Join Commitment Medical Guidelines Registration Process Order a Swab Kit Online Donating Marrow PBSC and Marrow Donation Logistics and Time Commitment Does it Hurt? and FAQs Donation Stories Get Involved Host a Drive Links and Organizations Partner with Cheekswab Calendar Contact Select a page Home About Founder's Story Cheekswab Q&A Need Causes Ethnic Minorities » Awareness Financial Support Join Commitment Medical Guidelines Registration Process Order a Swab Kit Online Donating Marrow PBSC and Marrow Donation Logistics and Time Commitment Does it Hurt? and FAQs Donation Stories Get Involved Host a Drive Links and Organizations Partner with Cheekswab Calendar Contact Awareness » Home » Need » Awareness The Need to Spread Awareness Statistics indicate that ethnic minorities as a whole comprise roughly 25% of the marrow registry. Due to the specificity of the HLA-type markers that are required to match patients and donors, it’s overwhelmingly likely that the match for a minority patient will be from a donor of the same ethnicity. With a lack of minority donors from all ethnic groups, this poses a significant and deadly problem for minority patients. Need Sections Need Causes Ethnic Minorities Awareness Financial Support Why aren’t there more minority donors in the registry? While not definitive, we believe that the lack of minority donors is a result of several factors: A lack of awareness. The need for bone marrow donors is often not as well publicized as other causes. While drives occur on a daily basis throughout the United States, they are not necessarily targeted towards minority groups. Without experiencing a drive at a workplace, place of worship or cultural center, many people go their entire lives without ever hearing about bone marrow donation. Misconceptions about donating. As recently as a decade ago, joining the marrow registry required a blood draw and the donation procedures themselves were likely to be more invasive. With the evolution of medical technology over the past decade donors can join the registry with a procedure as simple as rubbing four cotton swabs on the inside of their cheek. Donation procedures remain misunderstood, particularly with respect to the process of donating and how much it hurts. Differing cultural norms. Many cultures throughout the world do not exercise public acts of charity, not because they're unkind or unsympathetic, but rather because acts of empathy and service are centered more strongly around families or tight-knit communities. As a result, western ideals and the actions of public charitable organizations may seem foreign or untrustworthy to American immigrants. Furthermore, language barriers and an unfamiliarity with the American health system may make minority groups especially wary of initiatives like bone marrow donation. What can I do to help? It’s super easy to help spreading awareness about the registry. For starters, you can: Talk to your friends and loved ones in person about what you've read here, because a personal plea will go much farther to engage others than the text of any website; Give them the link to cheekswab.org so they can learn more about bone marrow donation for themselves; Post the link to cheekswab.org on social media sites like Facebook and Twitter to spread awareness to people you know but may not see in person; and Host a drive or speaking session with someone from Cheekswab for your group of friends, office, place of worship, or other student/social group. For more details on any of the above items, visit our Get Involved page or Contact Us. Pages About Cheekswab Ethnic Minorities Registration Process Does it Hurt? Don't Be Shy If you're from an ethnic minority group, please use the Contact Form to ask questions, provide feedback or coordinate a drive! Parties of all sizes are welcome and needed. Disclaimer The goal of this site is to present as much information about bone marrow donation as honestly and clearly as possible. Please remember, Cheekswab is NOT a medical or legal entity. Please consult a doctor before making any decisions regarding your health. Links BeTheMatch.org SAMARinfo.org AADP.org BlackBoneMarrow.com Copyright © Cheekswab 2012. All rights reserved. (function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){ (i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o), m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m) })(window,document,'script','//www.google-analytics.com/analytics.js','ga'); ga('create', 'UA-25803035-2', 'auto'); ga('send', 'pageview');"
