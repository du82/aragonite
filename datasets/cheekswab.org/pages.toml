["https://cheekswab.org/need-for-donors/ethnic-minorities"]
title = "Ethnic Minorities « Join the National Bone Marrow Registry Today || cheekswab.org"
description = "Not only are minority patients less likely to find a match on the registry, but 50% of minority donors, when contacted to donate, don't go through with the donation."
full_description = "Skip to Content Search cheekswab.org: Search Twitter Facebook YouTube Blog RSS Home About Founder's Story Cheekswab Q&A Need Causes Ethnic Minorities Awareness Financial Support Join Commitment Medical Guidelines Registration Process Order a Swab Kit Online Donating Marrow PBSC and Marrow Donation Logistics and Time Commitment Does it Hurt? and FAQs Donation Stories Get Involved Host a Drive Links and Organizations Partner with Cheekswab Calendar Contact Select a page Home About Founder's Story Cheekswab Q&A Need Causes » Ethnic Minorities Awareness Financial Support Join Commitment Medical Guidelines Registration Process Order a Swab Kit Online Donating Marrow PBSC and Marrow Donation Logistics and Time Commitment Does it Hurt? and FAQs Donation Stories Get Involved Host a Drive Links and Organizations Partner with Cheekswab Calendar Contact Ethnic Minorities » Home » Need » Ethnic Minorities Ethnic Minorities Face Unique Challenges to Find a Match The likelihood of a caucasian patient finding a suitable donor in the bone marrow registry is 97%. The likelihood of a minority patient finding a suitable donor in the bone marrow registry may be as low as 76%, depending on the specific ethnicity.2 Unfortunately statistics indicate that 50% of minority donors, when contacted to donate, do not go through with the donation. This further decreases the likelihood of a marrow match for ethnic minorities. Bone marrow donations must be matched to very specific genetic markers which are overwhelmingly more likely to appear in donors of the same race/ethnicity1. Due to the low numbers of minorities registered as donors, patients from ethnic minority groups have a harder time locating a suitable donor. While it’s difficult to know exactly what causes this disparity, we have some guesses. Footnotes “Matching Patients with Donors” Why Race and Ethnicity Matter Need Sections Need Causes Ethnic Minorities Awareness Financial Support Pages About Cheekswab Ethnic Minorities Registration Process Does it Hurt? Don't Be Shy If you're from an ethnic minority group, please use the Contact Form to ask questions, provide feedback or coordinate a drive! Parties of all sizes are welcome and needed. Disclaimer The goal of this site is to present as much information about bone marrow donation as honestly and clearly as possible. Please remember, Cheekswab is NOT a medical or legal entity. Please consult a doctor before making any decisions regarding your health. Links BeTheMatch.org SAMARinfo.org AADP.org BlackBoneMarrow.com Copyright © Cheekswab 2012. All rights reserved. (function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){ (i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o), m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m) })(window,document,'script','//www.google-analytics.com/analytics.js','ga'); ga('create', 'UA-25803035-2', 'auto'); ga('send', 'pageview');"
