description = "Cheekswab is an independent initiative to spread awareness of the need for bone marrow donors within ethnic minority groups."
full_description = "Skip to Content Search cheekswab.org: Search Twitter Facebook YouTube Blog RSS Home About Founder's Story Cheekswab Q&A Need Causes Ethnic Minorities Awareness Financial Support Join Commitment Medical Guidelines Registration Process Order a Swab Kit Online Donating Marrow PBSC and Marrow Donation Logistics and Time Commitment Does it Hurt? and FAQs Donation Stories Get Involved Host a Drive Links and Organizations Partner with Cheekswab Calendar Contact Select a page Home » About Founder's Story Cheekswab Q&A Need Causes Ethnic Minorities Awareness Financial Support Join Commitment Medical Guidelines Registration Process Order a Swab Kit Online Donating Marrow PBSC and Marrow Donation Logistics and Time Commitment Does it Hurt? and FAQs Donation Stories Get Involved Host a Drive Links and Organizations Partner with Cheekswab Calendar Contact About » Home » About What is Cheekswab? Cheekswab is an independent initiative to spread awareness of the need for bone marrow donors within ethnic minority groups. Cheekswab hopes to accomplish this by both presenting and contextualizing the need for donors through the content of this website, in addition to actively engaging individuals by organizing bone marrow drives within communities. Drives are organized in conjunction with the Be The Match Registry and SAMAR (South Asian Marrow Association of Recruiters), an official Recruitment Center of BeTheMatch based in New York. However, Cheekswab is not officially affiliated with either organization. Cheekswab is currently centered in New York City. The name “Cheekswab” is derived from the cotton swabs that registrants use to join the bone marrow registry. Click here to learn more about the registration process. Cheekswab is NOT a medical entity. Please make sure to consult a medical professional before making decisions regarding your health. About Sections About Founder's Story Cheekswab Q&A Mission and Purpose Our mission is to spread awareness of the need for bone marrow donors to as many people as possible and to increase the number of minority donors within the Be The Match Registry as much as we can. Cheekswab wants to identify and eliminate the barriers that inhibit potential donors from joining the registry. These barriers include a lack of awareness and information about the need for bone marrow donors, fear and confusion about the process, and not knowing how to physically join the registry once a person is willing. We believe that… The facts that show the urgent need for minority bone marrow donors speak for themselves. People by nature are loving, empathetic, and willing to help others. As long as you treat others with respect and have the intent to inform honestly and not deceive, they are capable of making their own personal decisions about whether or not a cause is worth supporting. That decision deserves to be respected. The current reality where minorities remain under-represented in the Be The Match Registry is not a product of apathy or selfishness, but a lack of awareness. There can and will be a day when minorities will have just as strong a likelihood of finding a bone marrow donor as non-minorities. Lives are at stake and lives can and will be saved by the recruitment of more donors. The decision to donate bone marrow to another person means lives will be changed forever, for both the recipient and donor alike. Pages About Cheekswab Ethnic Minorities Registration Process Does it Hurt? Don't Be Shy If you're from an ethnic minority group, please use the Contact Form to ask questions, provide feedback or coordinate a drive! Parties of all sizes are welcome and needed. Disclaimer The goal of this site is to present as much information about bone marrow donation as honestly and clearly as possible. Please remember, Cheekswab is NOT a medical or legal entity. Please consult a doctor before making any decisions regarding your health. Links BeTheMatch.org SAMARinfo.org AADP.org BlackBoneMarrow.com Copyright © Cheekswab 2012. All rights reserved. (function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){ (i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o), m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m) })(window,document,'script','//www.google-analytics.com/analytics.js','ga'); ga('create', 'UA-25803035-2', 'auto'); ga('send', 'pageview');"
