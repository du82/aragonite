title = "Registration Process « Join the National Bone Marrow Registry Today || cheekswab.org"
description = "Once a prospective donor is confident that they understand and agree to the donor commitment and meet the necessary medical guidelines, there are only two remaining steps before joining the registry - Completing the registration form and providing skin samples via four cheek swabs."
full_description = '''Skip to Content Search cheekswab.org: Search Twitter Facebook YouTube Blog RSS Home About Founder's Story Cheekswab Q&A Need Causes Ethnic Minorities Awareness Financial Support Join Commitment Medical Guidelines Registration Process Order a Swab Kit Online Donating Marrow PBSC and Marrow Donation Logistics and Time Commitment Does it Hurt? and FAQs Donation Stories Get Involved Host a Drive Links and Organizations Partner with Cheekswab Calendar Contact Select a page Home About Founder's Story Cheekswab Q&A Need Causes Ethnic Minorities Awareness Financial Support Join Commitment Medical Guidelines » Registration Process Order a Swab Kit Online Donating Marrow PBSC and Marrow Donation Logistics and Time Commitment Does it Hurt? and FAQs Donation Stories Get Involved Host a Drive Links and Organizations Partner with Cheekswab Calendar Contact Registration Process » Home » Join » Registration Process Registering to be a Marrow Donor Registering to be a marrow donor is an extremely simple and completely painless process. Once a prospective donor is confident that they understand and agree to the donor commitment and meet the necessary medical guidelines, there are only two remaining steps before joining the registry: Completing the registration form Providing skin samples via four cheek swabs. This page covers an in-person registration process that you’d likely encounter at a registry drive. You can also order a swab kit online to register from your home. Join Sections Join Commitment Medical Guidelines Registration Process Order a Swab Kit Online Completing the Registration Form The registration form is admittedly lengthy, but breaking the form down into sections will help show why it asks for each type of information. There are also several absolutely-must-have fields on the form that must be completed for processing, and we’ll highlight those here. Click on the image of each form to see a larger version. Required items are highlighted in yellow. Your contact information Must-have fields Full name Full address -- street, city, state, zip Telephone number (Home # can be a cell phone #) Email address The first information used to contact you if you are indeed discovered to be a match. Race/Ethnicity Information Must-have fields Are you Hispanic and/or Latino? Specified ethnic origin Due to the significant need for minority donors, the specification of the donor’s ethnic origin is extremely important. Employer/Spouse information Must-have fields These fields are considered optional. The employer and spouse information (if applicable) are recorded solely to contact you if you are a match. Contact information for two people who do not live with you Must-have fields Full name Telephone number Email address Be The Match requests that you provide the contact information for two people who do not live with you. People move, change phone numbers, and change email addresses, and as a result your own contact information may not be enough to reach you when you’re found to be a match. Those who live with you are more likely to move with you than those who do not. Many people hesitate to include the contact information of others for fear of their contacts being solicited. Be The Match understands that this is a valid concern and as a result takes privacy very seriously. Because it’s so hard to recruit donors in the first place, BTM wants to make absolutely sure that they do nothing to break the trust between the organization, its patients and its donors. A very common mistake is that duplicate addresses or phone numbers are added in this section. Please make sure that the two contacts you provide do not cohabitate. Medical Questionnaire Must-have fields Height and weight All yes/no answers Additional details for any answers marked "yes", or other medical conditions not included on the form To assure the safety of both the donor and the patient, Be The Match requires the completion of a brief medical questionnaire which is composed of yes/no questions. If any of the questions are answered “yes” BTM provides a lined area for further comments. Also, if donors have a medical condition or take medication that they think may exclude them from the registry, BTM asks that they share that information in the lines provided. Agreement and signature Must-have fields Printed name Signature Date of signature The last step of the registration form is to read and understand the donor agreement. This section outlines the donor’s rights and responsibilities and must be completed to register the cheek sample. A missing signature on the back page of the registration form is the number one error on all registration forms, and will block your ability to be registered. After the form is completed, donors move onto the cheek swabs! [top] Providing cheek swabs Here’s the fun part. Upon successful completion of the form, prospective donors are asked to complete four cheek swabs in order to finish the registration process. The swab kits come with four barcoded, long cotton swabs. The swabs are used to collect cheek cells from donors, which are then sent off to be typed for Human Leukocyte Antigen (HLA) markers and entered into the bone marrow donor database. Swabbing for 10-15 seconds per swab Swabbing Instructions Swallow. With each provided cotton swab, swab the inside of your mouth for 10-15 seconds. It's okay to switch sides or stay on the same side of your mouth. Put the swab in the slits of the foam provided. When all four swabs are completed, seal the kit. Once all forms and swab kits are collected they are sent off to the National Marrow Donor Program for processing. Registered donors can expect an official donor registration card to be mailed to their current address in six to eight weeks! Gallery Swab kit, ready to be completed Open swab kit, revealing four barcoded cheek swabs Completed swabs, placed in the foam slits provided Sealed swab kit, ready to be sent off with the completed form [top] Pages About Cheekswab Ethnic Minorities Registration Process Does it Hurt? Don't Be Shy If you're from an ethnic minority group, please use the Contact Form to ask questions, provide feedback or coordinate a drive! Parties of all sizes are welcome and needed. Disclaimer The goal of this site is to present as much information about bone marrow donation as honestly and clearly as possible. Please remember, Cheekswab is NOT a medical or legal entity. Please consult a doctor before making any decisions regarding your health. Links BeTheMatch.org SAMARinfo.org AADP.org BlackBoneMarrow.com Copyright © Cheekswab 2012. All rights reserved. (function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){ (i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o), m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m) })(window,document,'script','//www.google-analytics.com/analytics.js','ga'); ga('create', 'UA-25803035-2', 'auto'); ga('send', 'pageview');'''
