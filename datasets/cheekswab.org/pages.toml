["https://cheekswab.org/need-for-donors/financial-support"]
title = "Financial Support « Join the National Bone Marrow Registry Today || cheekswab.org"
description = "Learn how you can support the cause of bone marrow donation financially."
full_description = "Skip to Content Search cheekswab.org: Search Twitter Facebook YouTube Blog RSS Home About Founder's Story Cheekswab Q&A Need Causes Ethnic Minorities Awareness Financial Support Join Commitment Medical Guidelines Registration Process Order a Swab Kit Online Donating Marrow PBSC and Marrow Donation Logistics and Time Commitment Does it Hurt? and FAQs Donation Stories Get Involved Host a Drive Links and Organizations Partner with Cheekswab Calendar Contact Select a page Home About Founder's Story Cheekswab Q&A Need Causes Ethnic Minorities Awareness » Financial Support Join Commitment Medical Guidelines Registration Process Order a Swab Kit Online Donating Marrow PBSC and Marrow Donation Logistics and Time Commitment Does it Hurt? and FAQs Donation Stories Get Involved Host a Drive Links and Organizations Partner with Cheekswab Calendar Contact Financial Support » Home » Need » Financial Support How to Donate To make a one-time or recurring financial donation to Be The Match, please click here. All donations to this page will be used exclusively to cover costs for Be The Match as a whole. While we’re evaluating several options for the future, Cheekswab is not currently a non-profit organization and as a result does not accept tax-deductible donations directly. Our expenses are currently covered out of pocket. If our status changes we will let you know. If you’d like to donate to Cheekswab anyway, please contact us. For those who would like to contribute financial to bone marrow efforts at large, we encourage you to donate directly to BeTheMatch. Need Sections Need Causes Ethnic Minorities Awareness Financial Support The challenge of asking for money The drive is going great; people are coming to the table, asking questions, and willing to take the time to complete the forms for joining the registry. I know that I have to ask the question eventually, but I try to put it off as long as possible because everything is going smoothly. I don’t want to ask it as much as the other person doesn’t want to hear it, but there’s no real alternative. So finally, because I know it’s necessary, I go ahead and ask: “Are you able to donate financially to the registry today?” People don’t like to talk about this, but asking for money is awkward. And on the flip-side, being asked for a donation is awkward. It’s almost as if an act of goodwill and sacrifice becomes suddenly tainted with ulterior motives, even though that is by no means the case. The request for financial donations on our part is a response to the financial reality of the administrative and operational expenses of registering donors. From kits, drive materials, HLA-typing and even the salaries of those working full-time for BTM, there are a number of costs that go into addressing the need of bone marrow donors. Financial donations from outside parties are one of the main means by which those costs are met. Everything will be running smoothly at a drive until the moment you ask for money. We understand completely and believe this is for a couple of reasons: People are skeptical that the money they donate is going to be used to make a real difference.There are a ton of stories out there about the misallocation of financial donations within both private and public organizations. It's important for organizations that expect outside financial support to be intentional, transparent and diligent about what initiatives those finances will go towards so as to not violate the public's trust. People work hard for their money and don't want to throw it away.This ties very closely to the first reason above. Especially in today's economy, donating to a cause you believe in is more of a practical sacrifice than ever before. Given these reasons, we want you to know exactly what your financial donation is going towards and why ask for financial donations is so important. There are two avenues by which interested parties can donate: to the Cheekswab BeTheMatch Foundation page for local drive costs and to BTM as a whole. How your financial donation is used (Locally) One option for making a financial contribution is to donate money directly to Cheekswab. Please contact us directly for more details. All financial donations made through this page will go exclusively towards costs associated with organizing and coordinating bone marrow drives in the greater NYC area, as well as bone marrow registration costs. How your financial donation is used (Nationally) On a larger scale, funds provided to Be The Match go towards three main causes: Providing financial assistance to those needing a transplantMany patients discover that their insurance does not cover the full cost of receiving a transplant, including the costs necessary to cover the procedures undertaken by their donor. If you are ever matched on the registry, BTM pays in full for all the medical and travel expenses that are necessary to complete your donation. Adding new members to the registry by processing swab kitsThe DNA-typing process that is used to process every single donor into the bone marrow registry costs about $100 per donor. While there is an amount of funds set aside every year to cover these processing costs, they are exhausted very quickly. While we don't expect to receive full $100 coverage donations at drives, we accept donations of any size in hopes of offsetting some of these costs. When the pre-allocated funds are depleted new donors can no longer be entered into the registry without outside financial assistance. Funding transplant research Progress in transplant research has led to developments like the ability to type donors with swab kits (versus blood draws) and the growing utilization of PBSC donations over marrow donations. Research funded by Be The Match is continually looking for more efficient and effective means of matching patients to donors. It costs roughly $100 to add a single donor into the Be The Match registry. While there are organizational funds set aside to cover registrations, these funds are an exhaustible resource and donations are requested at drives to help offset these costs. For a more in-depth presentation about the barriers removed by financial donations, please view this slideshow. Pages About Cheekswab Ethnic Minorities Registration Process Does it Hurt? Don't Be Shy If you're from an ethnic minority group, please use the Contact Form to ask questions, provide feedback or coordinate a drive! Parties of all sizes are welcome and needed. Disclaimer The goal of this site is to present as much information about bone marrow donation as honestly and clearly as possible. Please remember, Cheekswab is NOT a medical or legal entity. Please consult a doctor before making any decisions regarding your health. Links BeTheMatch.org SAMARinfo.org AADP.org BlackBoneMarrow.com Copyright © Cheekswab 2012. All rights reserved. (function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){ (i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o), m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m) })(window,document,'script','//www.google-analytics.com/analytics.js','ga'); ga('create', 'UA-25803035-2', 'auto'); ga('send', 'pageview');"
