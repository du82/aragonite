title = "Order a Swab Kit Online « Join the National Bone Marrow Registry Today || cheekswab.org"
description = "For those that are unable to attend bone marrow registration drives locally, the National Marrow Donor Program provides an online process that ships a marrow processing kit to your home."
full_description = "Skip to Content Search cheekswab.org: Search Twitter Facebook YouTube Blog RSS Home About Founder's Story Cheekswab Q&A Need Causes Ethnic Minorities Awareness Financial Support Join Commitment Medical Guidelines Registration Process Order a Swab Kit Online Donating Marrow PBSC and Marrow Donation Logistics and Time Commitment Does it Hurt? and FAQs Donation Stories Get Involved Host a Drive Links and Organizations Partner with Cheekswab Calendar Contact Select a page Home About Founder's Story Cheekswab Q&A Need Causes Ethnic Minorities Awareness Financial Support Join Commitment Medical Guidelines Registration Process » Order a Swab Kit Online Donating Marrow PBSC and Marrow Donation Logistics and Time Commitment Does it Hurt? and FAQs Donation Stories Get Involved Host a Drive Links and Organizations Partner with Cheekswab Calendar Contact Order a Swab Kit Online » Home » Join » Order a Swab Kit Online Join the Registry from Home For those that are unable to attend bone marrow registration drives locally, the National Marrow Donor Program provides an online process that ships a marrow processing kit to your home. To learn more, please visit the “Online Registration” page at bethematch.org. Be The Match requests that prospective donors who choose to order kits follow the following three steps: Confirm that you meet the basic registry guidelines. Complete the online form and registration kit. This will require registering an account at join.bethematch.org. Please also consider making a financial donation to help offset some of the costs associated with kit processing. After obtaining the swab kit in the mail, follow the instructions in your kit to collect a swab of cheek cells and return the kit. When ordering a swab kit from Be The Match, it will come automatically barcoded to comply with your online registration form. Please complete and return the kits in a timely manner. Many people who order kits through the mail never complete them, resulting in unnecessary supply, administrative, and logistics costs for BTM. Join Sections Join Commitment Medical Guidelines Registration Process Order a Swab Kit Online Pages About Cheekswab Ethnic Minorities Registration Process Does it Hurt? Don't Be Shy If you're from an ethnic minority group, please use the Contact Form to ask questions, provide feedback or coordinate a drive! Parties of all sizes are welcome and needed. Disclaimer The goal of this site is to present as much information about bone marrow donation as honestly and clearly as possible. Please remember, Cheekswab is NOT a medical or legal entity. Please consult a doctor before making any decisions regarding your health. Links BeTheMatch.org SAMARinfo.org AADP.org BlackBoneMarrow.com Copyright © Cheekswab 2012. All rights reserved. (function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){ (i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o), m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m) })(window,document,'script','//www.google-analytics.com/analytics.js','ga'); ga('create', 'UA-25803035-2', 'auto'); ga('send', 'pageview');"
