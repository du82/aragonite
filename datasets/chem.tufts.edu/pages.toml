["https://chem.tufts.edu/academics/graduate-programs"]
title = "Graduate Programs | Department of Chemistry"
description = "The course requirements of the master's program at Tufts University are flexible since each student entering the program has individual goals."
full_description = "Graduate Programs The graduate program in Chemistry at Tufts University is large enough to foster stimulating interaction among colleagues and provide research opportunities at the frontiers of science, but small enough to have a very favorable student/faculty ratio. Doctoral students become well acquainted with the faculty and, based on mutual interests, select a research supervisor during their first semester. Formal requirements are minimized to allow students the flexibility to tailor their PhD or MS program to meet their individual needs. A more detailed description of the program requirements can be found in the Handbook of Academic Requirements & Procedure for the Chemistry Graduate Program.You can apply to our programs through the Tufts Graduate School of Arts and Sciences. The admissions deadline for Fall enrollment is December 1 for PhD programs and January 15 for MS programs. The admissions deadline for Spring enrollment is October 15 for all programs.No GRE scores are required for Chemistry applications. International applicants may require a test of English proficiency, as required by guidelines set by the Tufts Graduate School of Arts and Sciences. Tufts Chemistry is committed to a review process that evaluates the whole applicant, recognizing that individuals can show readiness for independent study in diverse ways.For information about tuition, stipends, and benefits for Tufts doctoral (PhD) students, please visit GSAS Doctoral Students' Collective Bargaining Agreement.Tufts Masters (MS) students typically receive some amount of financial aid, which is calculated during the admissions process. Tufts Chemistry does not typically offer full tuition scholarships for MS students.Please visit the admissions website for comprehensive information on admissions requirements, deadlines, financial and merit aid options, forms, and instructions. Programs MS in Chemistry The course requirements of the master's program at Tufts University are flexible since each student entering the program has individual goals. MS in Chemistry/Biotechnology The Department of Chemistry, jointly with the Biotechnology Center, offers a Master of Science (MS) in Chemistry/Biotechnology. PhD in Chemistry Tufts University has a unique system through which students develop and demonstrate a thorough knowledge of their field of specialization. PhD in Chemistry/Biotechnology The Department of Chemistry, jointly with the Biotechnology Center, offers a Doctor of Philosophy (PhD) in Chemistry/Biotechnology. PhD in Chemical Physics The Department of Chemistry jointly with the Department of Physics & Astronomy, offer a program leading to a PhD in Chemical Physics. Joint PhD in Chemistry and Materials Science and Engineering The Department of Chemistry has partnered with the Tufts Interdisciplinary Advanced Materials Center to offer a joint PhD in Chemistry and Materials Science and Engineering. Travel Fellowships The Tufts University Chemistry Department is proud to support PhD student travel to national and international conferences, made possible through the generous support of the Ronald J. Poole Chemistry Fellowship Fund. Learn more about Travel Fellowships Introduction to Graduate Programs in Chemistry at Tufts University Learn more about the unique strengths of the graduate programs at Tufts Chemistry. Graduate Programs Please visit our admissions website for comprehensive information on our admissions processes and requirements, deadlines, financial and merit aid options, forms and instructions. Graduate Admissions Tuition and Aid Request Information Departmental Admissions Info Director of Graduate Studies Joshua Kritzer Professor Bioorganic, Biophysical, & Chemical Biology. Peptides and their mimetics can target protein surfaces in ways small molecules rarely do, making peptide libraries attractive for screening for nontraditional modes of action. The Kritzer research group takes advantage of peptide and peptidomimetic libraries to bypass many of the disadvantages of small molecule screening. They also explore how modifications such as substitution of peptide bonds with isosteres, amide N-methylation, and head-to-tail cyclization affect the activities, specificities, and bioavailabilities of functional peptides. By combining powerful techniques from organic synthesis, biophysical chemistry, molecular biology and genetics, they are developing new molecules and new strategies to attack cancer, inflammation, and autoimmune diseases. Director of Masters Studies Charlie Mace Associate Professor Bioanalytical and Materials Chemistry. To solve outstanding problems in global health, the Mace Lab applies a multidisciplinary approach combining aspects of analytical chemistry, materials science, and engineering. The primary goal of the Mace lab is to develop low cost, patient-centric technologies that can improve access to healthcare. To achieve this, the Mace Lab designs devices that improve the self-collection of blood and enable the diagnosis of diseases in resource-limited settings, and they are exploring ways the methods that are developed in the lab can used by others. Their main techniques leverage the properties of paper and other porous materials to integrate function into simple, affordable devices. Unique to laboratories in Chemistry departments, his group specializes in handling human blood and saliva. Technologies developed in the Mace lab have made the leap to clinical sites in Africa, South America, and the US, owing to their network of clinical, academic, and industry collaborators. The Mace Lab has broad expertise in assay development and device prototyping, which they apply to evaluating the efficacy of candidate therapeutics, performing separations that lead to new measurements, and making field-deployable kits for point-of-care testing. They have additional expertise in instrument development, phase separation in systems of polymers, and microfluidics."
