["https://chem.tufts.edu/academics/graduate-programs/joint-phd-chemistry-and-materials-science-and-engineering"]
title = "Joint PhD in Chemistry and Materials Science and Engineering | Department of Chemistry"
full_description = '''Joint PhD in Chemistry and Materials Science and Engineering The Department of Chemistry has partnered with the Tufts Interdisciplinary Advanced Materials Center to offer a joint PhD in Chemistry and Materials Science and Engineering. Students interested in this program should apply to the PhD in Chemistry: Material Science and Engineering. Applications are reviewed by the Department of Chemistry, and the Materials Science and Engineering Steering Committee. After a student is admitted to the program, Chemistry remains the student's "home" department. To complete this program of study, students must complete all requirements of both the PhD in Chemistry and the PhD in Materials Science and Engineering. Course Information Department Faculty'''
