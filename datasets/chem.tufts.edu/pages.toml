title = "Yu-Shan Lin | Department of Chemistry"
full_description = "Research Website Full Profile Career Highlights / Publications Research Professional Activities Courses / Teaching Activities Yu-Shan Lin Professor, Chemistry Chair, Chemistry (617) 627-3689 yu-shan.lin@tufts.edu 62 Talbot Avenue Full Profile (facultyprofiles.tufts.edu) Research Website Full Profile Career Highlights / Publications Research Professional Activities Courses / Teaching Activities Research/Areas of Interest Theoretical and Computational Biophysical Chemistry. The YSL Group aims to elucidate the structures and functions of biomolecules by integrating the power of advanced computations with the elegance of chemical theory. Our focus is to develop and apply computational methodology to significant biological problems that are difficult to address experimentally. Two major research projects in the YSL Group are (1) to understand and design cyclic peptides with desired conformations to modulate protein–protein interactions and (2) to elucidate the structural and functional roles of post-translational modifications and non-natural amino acids on protein folding. Education PhD Chemistry, University of Wisconsin–Madison, Madison, United States, 2009MS Chemistry, University of Wisconsin–Madison, Madison, United States, 2007BS Chemistry, National Taiwan University, Taipei, Taiwan, 2004"
