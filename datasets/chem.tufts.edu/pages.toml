["https://chem.tufts.edu/sykes-lab/news"]
title = "News | Department of Chemistry"
full_description = '''News 2024 Congratulations to Avery for getting the Technology Transfer and Industry Collaboration Internship at Tufts, where he will be learning about intellectual property management and applying this knowledge to Tufts inventions! - October 2024Charlie has been named the 2025 Ipatieff Lecturer at Northwestern, where he will participate in extended visits to their Center for Catalysis and Surface Science. - October 2024The group welcomes Dr. Dennis Meier as a postdoc! - September 2024Congratulations to Dr. Audrey Dannar for defending her thesis! - July 2024Sykes group research featured as Result of the Month By Scienta Omicron for their STM images of acetylene on Ag(111) with the new Infinity STM - July 2024Elizabeth wins Best Poster Prize at the Catalysis GRC! - June 2024Cole, Vinita, Allison and Nipun travel to Brookhaven National Lab to study NiAg alloys! - June 2024Congratulations to Allison Zupan on the successful completion of her Master's degree! - May 2024Sykes group takes a group outing to the Boda Borg! - May 2024 Cole, Vinita, Allison and Nipun at Brookhaven National Lab 2023 Charlie wins International Precious Metals Institute, Henry J. Albert Award - 2023Charlie's invited talk about Single-Atoms Alloys at @CAT viewable online.Audrey wins the Morton M. Traum Award at AVS 2023! - November 2023Sykes Group UG researcher Nick McQuillan starts MD-PhD at the University of Colorado - September 2023Sykes group takes a group outing to an escape room! - August 2023Elizabeth wins Best Poster Prize at the Dynamics at Surfaces GRC - July 2023Audrey and Elizabeth travel to Newport, RI for Dynamics at Surfaces GRC 2023. - July 2023Congratulations to Dr. Yicheng Wang and Dr. Volkan Cinar for successfully defending their theses! - July 2023Avery, Cole, and Elizabeth travel to BNL to continue researching Ag alloys alloys with AP-XPS - February 2023The Sykes lab and their collaborators at University College London, the University of Cambridge, University of California Santa Barbara, and Argonne National Laboratory are honored with the prestigious 2022 Faraday Division Horizon Prize. Watch the Royal Society of Chemistry video about Horizon Prize winners. - January 2022 Professor Charles Sykes delivering speech at the IPMI award ceremony Sykes group outing to the escape room 2022 Congratulations to Volkan for winning the 2022 Morton M. Traum Award! - November 2022Nima and Nipun are welcomed to the group as first year graduate students! - November 2022Audrey, Volkan, and Yicheng travel to Pittsburg for AVS 68th International Symposium and Exhibition - November 2022Volkan and Yicheng travel to Chicago for ACS Fall 2022 - August 2022Yicheng selected as a finalist for the Nottingham Prize at the 82nd Physical Electronics Conference - June 2022Tufts hosts NECS conference in memory of Maria Flytzani-Stephanopoulos' life and ground breaking work - June 2022Charlie receives International Catalysis Award: 2022 CATSA Eminent Visitor Award to recognize excellence in catalysis research by overseas scientists - March 2022Avery, Cole, and Elizabeth travel to Brookhaven National Lab to study Ag alloys - March 2022Charlie is named a fellow of the American Association for the Advancement of Science! - January 2022Sykes Group work on RhCu single atom alloy selectivity is featured on the cover of Surface Science - January 2022 Volkan Cinar accepting the 2022 Morton M. Traum Award Attendees at the NECS Conference hosted at Tufts University Avery Daniels, Cole Easton, and Elizabeth Happel at Brookhaven National Lab 2021 The Sykes group welcomes Allison and Vinita as first year graduate students! - November 2021Ryan Hannagan receives the AVS Platinum Award! - November 2021Congratulations to Dr. Paul Kress for defending his thesis! - November 2021Ryan Hannagan wins the Morton M. Traum Surface Science Student Award at the AVS International Symposium - October 2021Congratulations to Dr. Ryan Hannagan for defending his thesis! - October 2021Paul and Elizabeth travel to Brookhaven National Laboratory to continue studying Ag alloys - October 2021Congratulations to Dr. Laura Cramer for defending her thesis! - August 2021Tufts Now article features Sykes group research and newest paper which uses first principles to design catalysts! - June 2021Laura and Elizabeth travel to Brookhaven National Laboratory to study Ag alloys - June 2021Audrey Dannar awarded a Tufts University GIFT Fellowship to co-teach Chem32 in Spring 2022 - June 2021George Giannakakis and Mengyao Ouyang walk in their Chemical and Biological Engineering PhD hooding ceremony - May 2021Ryan's research is featured in Tufts' Spotlight on the Class of 2021! - May 2021Sykes group gets a new Infinity Scanning Tunneling Microscope! - January 2021 George Giannakakis and Mengyao Ouyang at their PhD hooding ceremony 2020 Congratulations Dr. Alex Schilling and Dr. Dipna Patel for defending their theses! - November 2020The Sykes group welcomes Elizabeth, Avery, Helen, and Cole as first year graduate students! - November 2020George receives a Gerondelis Foundation grant for his PhD studies! - November 2020Congratulations to Ryan for winning the Russell and Sigurd Varian National Award! - September 2020Congratulations to Ryan for being selected as one of four finalists for the Morton M. Traum Award! - September 2020Congratulations to George for receiving the Johnson Matthey Student Award from the International Precious Metals Institute for his work on single-atom alloys! - April 2020Congratulations to Ryan for taking 2nd place in the Tufts Graduate Student Research Symposium for his talk on RhCu Single-Atom Alloys! - March 2020Ryan Hannagan and Paul Kress travels to Brookhaven National Laboratory to study Cu based alloy surfaces - March 2020 2019 Congratulations to Ben for defending his thesis! - December 2019 Paul Kress travels to Brookhaven National Laboratory to study novel alloy surfaces - December 2019 The Sykes Group welcomes Audrey Dannar as a first year PhD Student! - November 2019 Chemistry World article features Charlie and Maria's work on Single-Atom Alloys - October 2019 Dipna Patel is awarded the 2019 Russell and Sigurd Varian National Award by AVS - October 2019 Dipna and Charlie travel to AVS 2019 in Columbus Ohio - October 2019 Charlie and Maria are interviewed by ACS Catalysis about their award winning work on Single-Atom Alloys - August 2019 Charlie, Paul, Dipna, and Laura travel to ACS San Diego 2019 - August 2019 Alex Schilling travels to Newport Rhode Island to chair GRS Dynamics and Surfaces - July 2019 Amanda's ACS Nano paper on 1:1 chiral interactions covered by WSU Insider - May 2019 Ryan Hannagan and Paul Ryan travel to Diamond Light Source in the UK to study RhCu(111) SAAs - April 2019 Dipna Patel and Paul Kress travel to Brookhaven National Lab to study PdAg(111) Oxides - March 2019 Laura Cramer travels to Germany to partake in an exchange program through Northeastern section of the ACS - March 2019 The Sykes group welcomes Paul Ryan as a visiting PhD student from Imperial College London and Diamond Light Source Beamline I09 - March 2019 Ryan Hannagan and Paul Kress travel to the GRS and GRC in Ventura Beach California to present their work on RhCu and PdAu Single Atom Alloys - February 2019 Charlie Sykes and Maria Flytzani-Stephanopoulos are awarded the 2019 ACS Catalysis Lectureship for the Advancement of Catalytic Sciences for their pioneering work in developing single-atom alloy materials as catalysts - February 2019 Dipna Patel accepting the 2019 Russell and Sigurd Varian National Award by AVS Dipna Patel and Charlie Sykes at AVS 2019 2018 The Sykes group welcomes Yicheng Wang and Volkan Cinar as 1st year graduate students! - November 2018 Sykes Group perspective on single-atom alloys is featured on the cover of JPC Letters - September 2018 Laura Cramer's talk titled "An Atomc-Scale Study of Oxygen Dissocation on Ag on Cu(111)" awarded best presentation of the CATL session at ACS Boston 2018 - August 2018 Sykes lab Single-Atom Alloy work featured in Chemistry World - June 2018 Ben chosen as a speaker in the Young Investigator Session of the 2018 International conference on Ionizing Processes Charlie named a 2018 AVS Fellow for pioneering developments in the field of single-atom alloy catalysis and for advancing the fields of molecular motors, molecular self-assembly, and chiral surface chemistry Sykes Group work on isolated platinum atoms supported on a well defined copper oxide film is featured on the cover of Nature Catalysis and in Nature Reviews Chemistry - March 2018 Sykes Group research on PtCu Single Atom Alloys receives media attention in Chemical and Engineering News (Volume 96 Issue 3 p. 8) and is featured on the Department of Energy's homepage - March 2018 Andy's paper picked as JCP editor's choice - January 2018 2017 Dipna Patel wins "Best Young Scientist Presentation" award from HC Focus Topic at AVS 64 - November 2017 Congratulations to Dr. Andrew Therrien for defending his thesis titled "Using Model Systems to Understand Catalysis on Thin Film Oxides, Supported Single Atoms, and Naturally Chiral Surfaces"!! - September 2017 Natalie's Nature Communications paper is highlighted in Nature Nanotechnology - August 2017 Alex Schilling elected co-chair of Dynamics and Surfaces GRS 2019. - August 2017 The Reverse Science Fair with Medford High School, summarized by a Sykes group publication in J. Chem. Ed., is published on the Tufts news page. - April 2017 Physicsworld.com covers recent Sykes group research on hexagonal boron-carbon-nitrogen. - February 2017 Sykes group research is published on the Argonne National Laboratory website. - February 2017 Andy is awarded to the Graduate Student Travel Fund from the Office of the Dean of the Graduate School of Arts and Sciences. - January 2017 2016 Sykes group research published in ChemComm elucidating tartaric acid assembly and decomposition on Cu(111) receives media attention from ChemistryViews. - December 2016 The Sykes group welcomes Paul Kress, Ryan Hannagan, Laura Cramer, and Tedros Balema as 1st year graduate students! - November 2016 Andy wins the Morton Traum Student Award at the AVS 63rd International Symposium & Exhibition. - November 2016 Sykes group single atom alloy work is featured in C&EN. - October 2016 Congratulations to Dr. Matthew Marcinkowski for defending his thesis titled "Single Atom Alloys for Efficient and Selective Bond Activations: A Model Surface Chemistry Approach"!! - October 2016 Andy's reflection statement from the annual GDCh-NESACS German Exchange Program is highlighted in the NESACS publication "The Nucleus". - October 2016 Chris and Chloe present at the Department of Chemistry Undergraduate Poster Symposium detailing their summer research on self-assembled molecular rotor arrays. - September 2016 Felcia is awarded a Science & Technology Policy Congressional Fellowship through the Materials Research Society to work in policy in Washington D.C. - August 2016 Northeastern Section of the American Chemical Society Younger Chemists Committee chaired by Felicia wins Outstanding Local Section Younger Chemists Committee at the National ACS meeting. - August 2016. Andy competes in the 2016 TUNECC life sciences consulting case competition. - August 2016 Congratulations to Dr. Felicia Lucci for defending her thesis titled "Surface Reactivity of Single Atom Alloys: Model Studies Guiding the Design of Atom Efficient Nanoparticle Catalysts"!! - July 2016 Felicia meets Professor George Whitesides [Harvard University] and is featured on the NEACS "The Nucleus" May 2016 Edition. - May 2016 Chris is awarded the Robert Dewald Summer Scholarship. - April 2016 Natalie runs in the 120th Boston Marathon with the Tufts Marathon Team. - April 2016 Andy wins the Outstanding Oral Presentation Award at the 18th Annual Northeast Student Chemistry Research Conference. - April 2016 Andy and Felicia participate in the GDCh/NESACS Germany exchange program, a one week all-inclusive trip to Kiel, Germany centered around an international research conference. - March 2016 Natalie uses the LT-STM to spell "Tufts" with Br atoms and is featured on Tufts Now. - January 2016 Ben is named a spring 2016 GAANN fellow. - January 2016 Attendees at the 2016 TUNECC life sciences consulting case competition 120th Boston Marathon with the Tufts Marathon Team Andy accepting the Outstanding Oral Presentation Award "Tufts" spelled with Br atoms 2015 The Sykes group welcomes Alex Schilling, Dipna Patel, and Matthew Uhlman as 1st year graduate students! - November 2015 Tufts features the 2015 Reverse Science Fair. - October 2015 Felicia's Nature Communications paper on the selective hydrogenation of 1,3-butadiene is featured on the National Science Foundation's News website, Space Daily, phys.org, and AZoM. - October 2015 Charlie's talk at Boston ACS on Nano Cancer is recorded. - October 2015 Charlie becomes a Fellow of the Royal Society of Chemistry. - October 2015 Sykes Group research is featured on the Discovery Channel Canada television program Daily Planet. - September 2015 The Sykes group welcomes Dr. Zhitao Wang to Tufts as a post-doctoral fellow. - August 2015 Sykes Group research on 2D radioactive films receives media attention including a publication by Leon Sanche in Nature Material News and Views, IFL Science, Nanowerk, phys.org, and an article in Chemical Engineering News (Volume 93, Issue 25, p. 33). The research was also featured on the featured on the Department of Energy's homepage. - June 2015 Melissa receives the Excellent Oral Presentation Award at the 17th Annual Northeast Student Chemistry Research Conference (NSCRC). - April 2015 Congratulations to Dr. Colin Murphy for defending his thesis titled "Beginning to Bridge the Gap Between Work and Usefulness: Driving Molecular Devices and Intermolecular Coupling"!! - March 2015 Felicia is selected as a NSF sponsored US delegate to the 65th Lindau Nobel Laureate Meeting. - March 2015 Matthew named one of the first two Illumina Fellows in the Tufts Chemistry department. - January 2015 2014 Felicia receives the Leadership Development Award from the Younger Chemists Committee (YCC) of the American Chemical Society (ACS) to support attendance at the ACS Annual Leaders' Conference. - December 2014 The Sykes Group welcomes Ben Coughlin and Mostafa El Soda as 1st year graduate students! - November 2014 Emily appears in Chemical & Engineering News for her ACS public policy fellowship. - October 2014 The Sykes group welcomes Dr. Natalie Wasio to Tufts as a post-doctoral fellow. Dr. Wasio received her PhD in chemistry from the University of Notre Dame under Prof. Alex Kandel. - October 2014 Melissa receives the Carl Storm Underrepresented Minority (CSURM) Fellowship for the Gordon Research Conference. - October 2014 Felicia receives the AVS 61 Dorothy M. and Earl S. Hoffman Travel Grant. - September 2014 Sykes group work highlighted in the Association Affairs section of Scienc'''
