full_description = "Department Highlights Faculty HighlightsCongratulations to affiliate Prof. David Walt, who has been awarded the National Medal of Technology and Innovation.Congratulations to Prof. Kevin Clark, who has been recognized by the Arnold and Mabel Beckman Foundation as a 2024 Beckman Young Investigator Awardee.Congratulations to Dr. Tim Brunker, on winning a 2024 Teaching with Technology Award.Congratulations to Prof. Rebecca Scheck on her GSAS Faculty Teaching and Mentoring Award.Congratulations to Profs. Joshua Kritzer and Charlie Mace, who were named senior members of the National Academy of Inventors. Congratulations to Prof. Yu-Shan Lin on her promotion to the rank of full Professor.Congratulations to Prof. Charlie Sykes on winning the International Precious Metals Institute, Henry J. Albert Award.Congratulations to Dr. Diren Turner was awarded a Tufts Springboard Educational and Curricular Grant with Prof. David Hammer. Welcome to Dr. Xinqiang Ding, who will be starting as an Assistant Professor in 2023.Congratulations to Prof. Krishna Kumar, who was named a senior member of the National Academy of Inventors. Welcome to Dr. Yu Zhang, who will be starting as an Assistant Professor in 2022.Congratulations to Prof. Rebecca Scheck on her promotion to the rank of Associate Professor. Welcome to Dr. Kevin Clark, who will be starting as an Assistant Professor in 2022 with research focused on analytical chemistry.Congratulations to Profs. Clay Bennett and Joshua Kritzer on their promotion to the rank of full Professor.Welcome to Dr. Ira Caspari who joined us in the Fall 2020 as an Assistant Professor with research focused on education.Prof. Rebecca Scheck has received an NIH-R01 award to develop a chemical strategy to unravel tumor suppression and identify new targets for cancer therapy.Congratulations to Prof. Rebecca Scheck on her recognition with a Tufts Collaborates Seed Grant, one of only two A&S faculty selected.Congratulations to Profs. Charlie Mace and Krishna Kumar on their selection for the Tufts Launchpad Acceleration Program.Dr. Diren Pamuk is the recipient of this year's Tufts AS&E Lerman-Neubauer Prize for Outstanding Teaching & Advising.Prof. Charlie Mace has received a prestigious NSF CAREER award for outstanding research and education.Student HighlightsBernadette Dineen, from the Kounaves Lab, is a TedxTufts Speaker.Nefeli Batistatou, from the Kritzer Lab, was awarded the GSAS Award for Outstanding Academic Scholarship.Bernadette Dineen, from the Kounaves Group, was featured by the Museum of Science on International Women's Day.Tristan Dinsmore, from the Kumar Group, was awarded the first place poster award at the Gordon Research Conference on Chemistry and Biology of Peptides.Jing Wang, from the Kritzer Group, was awarded a poster prize at the Northeast Regional Meeting of the American Chemical Society.Vanessa Jones, from the Bennett Group, won second place overall in the poster session at the annual University at Buffalo Graduate Student symposium.Katie Maiello, from the Bennett Group, was recognized at the Spring ACS Conference for an outstanding poster presentation among graduates and postdocs in the CARB division.Marc Descoteaux, from the Lin Group and a Tufts 2022 Chemical Physics graduate, received the 2022 ACS Undergraduate Award in Physical Chemistry in recognition of outstanding achievements in the field of Physical Chemistry. Jennifer Pierre-Louis, an undergraduate researcher in the Caspari lab, has won a Grant-in-Aid from the Northeastern Section of the ACS. She will present a poster on her research at the American Chemical Society meeting in San Diego, in March 2022.Jovan Damjanovic from the Lin Group won the ACS COMP Excellence Award for Graduate Students, and will present a poster at the American Chemical Society meeting in San Diego, in March 2022.Qing Gao, an undergraduate researcher in the Scheck lab, has won a Grant-in-Aid from the Northeastern Section of the ACS. He will present a poster on his research at the American Chemical Society meeting in San Diego, in March 2022.Kathleen (Katie) Sicinski in the Kumar group is the recipient of the 2021 Tufts GSAS Outstanding Academic Achievement award.Congratulations to Jonathan Rodríguez and Cassandra Cancemi for being selected for one of the most prestigious awards in the U.S. for undergraduate students in STEM fields.Alumni HighlightsFanny Frausto, PhD, was a featured expert in an ACS Webinar about the art of self-reinvention.Felicia Lucci, PhD, was featured on the cover on The Nucleus NESACS. Felicia is giving a featured address on NESACS Education Night. Todd Pagano, PhD, was featured in Chemistry World in April 2022 for helping make research environments more inclusive to deaf and hard of hearing students. Congratulations to Jane Frommer, PhD, for receiving the prestigious 2020 Perkin Medal."
