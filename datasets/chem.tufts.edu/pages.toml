["https://chem.tufts.edu/node/1556"]
title = "Samuel Thomas | Department of Chemistry"
full_description = "Research Website Full Profile Career Highlights / Publications Research Professional Activities Courses / Teaching Activities Samuel Thomas Professor and Senior Dean of Academic Affairs, The School of Arts and Sciences Professor, Chemistry (617) 627-3771 sam.thomas@tufts.edu Ballou Hall Full Profile (facultyprofiles.tufts.edu) Research Website Full Profile Career Highlights / Publications Research Professional Activities Courses / Teaching Activities Research/Areas of Interest Organic Materials Chemistry Our group applies the philosophy of physical organic chemistry to organic materials, in the forms of polymers, crystals and surfaces. Specifically, we investigate new materials that show macroscopic changes in properties upon exposure to external stimuli. Our main focus has been new materials that respond to light, which has a unique combination of characteristics: i) easy control over where light goes and when it goes there (spatiotemporal control), ii) easy control over intensity and energy, and iii) the ability to pass through many solid materials that traditional chemical reagents cannot. Our research has focused in three separate areas. 1. Photochemical control of charge. As interactions between charges dictate much of molecular behavior, controlling charge can yield control over matter. We have developed a series of materials in which light switches the charge-based interactions between polymer chains from attractive. By combining this top-down fabrication approach of with the bottom-up fabrication method of layer-by-layer assembly, we have developed thin films in which photochemical lability is confined to individual nanoscale compartments, yielding photo-delaminated free-standing films and multi-height photolithography. 2. Using functional side chains to control conjugated materials. Conjugated materials hold great promise for applications including solar cells and displays. We have focused on expanding the role of the side-chains of these materials, which occupy up to half of their mass but are typically reserved only for solubility. Early work in our group focused on integrating photolabile side chains for negative conjugated photoresists. This has evolved to using the non-covalent interactions of aromatic side-chains for controlling interactions between molecules, and therefore their material properties, including the use of mechanical force to control luminescence—mechanofluorochromism. 3. Singlet-oxygen responsive materials. Singlet oxygen (1O2) is a critical reactive oxygen species in photodynamic therapy for cancer as well as in damage to plants upon overexposure to light. Its photochemical production is also chemically amplified through a photochemical reaction, which is the lynchpin of several commercial bioanalytical technologies. Through a combination of fundamental physical organic chemistry and materials chemistry, we have luminescent conjugated polymer nanoparticles as probes for 1O2 in water that shows improved limit of detection over the commercially available luminescent probe for 1O2. Education PhD Chemistry, Massachusetts Institute of Technology, Cambridge, United States, 2006BS Chemistry, University of Rochester, Rochester, United States, 2000"
