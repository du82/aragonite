["https://chem.tufts.edu/people/faculty/luke-davis"]
title = "Luke Davis | Department of Chemistry"
full_description = "Research Website Materials at Tufts Tufts CREATE Solutions Full Profile Career Highlights / Publications Research Professional Activities Courses / Teaching Activities Luke Davis Assistant Professor, Chemistry luke.davis@tufts.edu 62 Talbot Avenue Full Profile (facultyprofiles.tufts.edu) Research Website Materials at Tufts Tufts CREATE Solutions Full Profile Career Highlights / Publications Research Professional Activities Courses / Teaching Activities Research/Areas of Interest I am interested in synthesis and characterization in inorganic and materials chemistry. I am especially interested in fundamental chemistry that has important societal implications. My research laboratory currently works in several areas: Earth-abundant molecular light absorbers and emitters. Molecular light absorbers and emitters are used in photoredox catalysis, dye-sensitized solar cells, and organic light-emitting diodes (OLEDs). We are exploring high-spin complexes of iron and manganese to prepare new molecules that absorb and emit light. Volatile molecules carrying metal-atom equivalents for superconducting wires. Cryogenic superconducting wires enable quantum bits based on Josephson junctions. We are developing new molecules and methods to deposit the electropositive metals that make up these wires from chemical vapors. Thin-film photovoltaics with earth-abundant, sulfide-based absorber layers. Thin-film photovoltaics (solar cells) provide electricity from sunlight with just a few hundred nm of light-absorbing material. We are exploring binary and ternary sulfides as new sources of earth-abundant photovoltaics. I am developing new research programs in several areas: Zero-emissions ironmaking. The synthesis of iron metal from iron ore contributes ca. 4% of global carbon dioxide emissions. I am interested in alternative thermochemical methods of making iron from iron oxides. New superconducting materials. Near-room-temperature superconductors have recently been realized in compressed hydrides. I am interested in new hydride compounds that are stable at ambient pressure and might serve as ambient-pressure, ambient-temperature superconductors. Education PhD Chemistry, University of Illinois at Urbana Champaign, Urbana, United States, 2014MS Chemistry, College of William & Mary, Williamsburg, United States, 2008BS Chemistry, College of William & Mary, Williamsburg, United States, 2007"
year_published = 2025
