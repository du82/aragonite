["https://chem.tufts.edu/academics/undergraduate-programs/bs-chemistry"]
title = "BS in Chemistry | Department of Chemistry"
full_description = "BS in Chemistry Chemistry majors can choose between completing the requirements for the BS in Chemistry or the American Chemical Society (ACS) certified major in Chemistry. Chemistry MajorThe BS in Chemistry is intended for those with an interest in chemistry whose career aspirations lie outside the realm of professional chemistry. This Chemistry major, though not certified by the American Chemical Society, gives the student a good preparation in chemistry while allowing for greater flexibility in choosing additional electives.Program Requirements and PoliciesThirteen courses and accompanying labs are required to complete the major.Note that Bio 13 and 14 may not be counted as related field courses for the Chemistry major.In addition to the course requirements below, chemistry majors with a pre-medical focus should also take Biology 13 and 14 with labs in their second or third year. Course RequirementsThe following two Foundation courses and accompanying labs:Chem 1: Chemical Fundamentals w/ Lab (or Chem 11: General Chemistry or Chem 16: Chemistry of Materials)Chem 2: Chemical Principles w/ Lab (or Chem 12: General Chemistry) The following four Core courses and accompanying labs: 1. Chem 31: Physical Chemistry I and Chem 33: Physical Chemistry Lab 2. Chem 42: Quantitative Analysis or Chem 43: Bioanalytical Chemistry and Chem 45: Bioanalytical Chemistry Lab 3. Chem 51: Organic Chemistry I and Chem 53: Organic Chemistry I Lab 4. Chem 52: Organic Chemistry II and Chem 54: Organic Chemistry II Lab Four additional courses in intermediate or advanced chemistry, excluding Chemistry 34.* The following four courses and accompanying labs outside of the department:Mathematics 32: Calculus IMathematics 34: Calculus IIPhysics 1: Introduction to Physics I w/Lab or Physics 11: General Physics I w/LabPhysics 2: Introduction to Physics II w/Lab or Physics 12: General Physics II w/Lab*Note: Two of the four additional chemistry courses may be substituted with intermediate or advanced related field courses. Only one course of undergraduate research, either Chem 82 (Research II) or Chem 199 (the second semester of Senior Thesis), may be counted toward the four additional courses in intermediate or advanced chemistry.Approved Courses in Related FieldsSuggested Course Sequence for Chemistry MajorsChem UL = intermediate or upper-level chemistry courseYearFallSpring1Chem 1 or 11Math 32Chem 2 or 12Math 342Chem 51/53Phys 1 or 11Chem 52/54Phys 2 or 123Chem 31/33ChemULChem 42ChemUL4ChemULChemULAlternate Course Sequence for Chemistry MajorsChem UL = intermediate or upper-level chemistry courseYearFallSpring1Math 32Chem 1 or 16Math 342Chem 2Phys 1 or 11Chem 42Phys 2 or 123Chem 51/53ChemULChem 52/54ChemUL4Chem 31/33ChemULChemULACS-Certified Chemistry MajorThe American Chemical Society (ACS) certified major is a research-focused major certified by the American Chemical Society, recommended for those whose career goals include employment as a professional chemist or graduate school in chemistry. Students earning this degree will receive certification from the ACS which, for those students proceeding directly from college to employment, often results in higher salaries than those for non-certified majors. In addition, graduate schools and fellowship selection committees may view certified majors more favorably than non-certified ones. Course requirements leading to a certified major include research experience, which offers the student an opportunity to work closely with members of the department's research faculty.Program Requirements and PoliciesSixteen courses and accompanying labs are required to complete the major.In addition to the below required courses, ACS-Certified Chemistry Majors with a premedical focus should also take Biology 13 and 14 with labs.Course RequirementsThe following six Foundation courses and accompanying labs:Chem 1: Chemical Fundamentals w/Lab (or Chem 11: General Chemistry or Chem 16: Chemistry of Materials)Chem 2: Chemical Principles w/Lab (or Chem 12: General Chemistry)Physics 1: Introduction to Physics I w/Lab or Physics 11: General Physics I w/LabPhysics 2: Introduction to Physics II w/Lab or Physics 12: General Physics II w/LabMathematics 32: Calculus IMathematics 34: Calculus II The following seven Core courses and accompanying labs:Chem 31: Physical Chemistry I/Chem 33: Physical Chemistry LabChem 32: Physical Chemistry II/Chem 34: Physical Chemistry LabChem 42: Quantitative AnalysisChem 51: Organic Chemistry I/Chem 53: Organic Chemistry I LabChem 52: Organic Chemistry II/Chem 54: Organic Chemistry II LabChem 61: Inorganic Chemistry/Chem 63: Inorganic and Synthetic Chemistry LabChem 171: Biochemistry IOne additional course in intermediate or advanced chemistry that has one of the following courses as a prerequisite: Chemistry 32, 42, 52, 61, or 171. One of the following sets of Research courses:Chem 81: Research I and Chem 82: Research IIChem 195: Senior Thesis I and Chem 199: Senior Thesis IIRecommended Course Sequence for ACS-Certified Chemistry MajorsChem UL = intermediate or upper-level chemistry courseYearFallSpring1Chem 1 or 11Math 32Chem 2 or 12Math 34Phys 112Chem 51/53Phys 12Chem 52/54Chem 423Chem 31/33Chem 61/63Chem 32/34Chem 1714Chem 81*Chem ULChem 82** Undergraduates are encouraged to pursue research (Chem 81/82) earlier if possible. These course sequences are intended to illustrate only one of the possible course sequences involving undergraduate research (Chem 81/82).Degree Sheet Submission InstructionsFor seniors who plan to graduate in May, follow the instructions below to apply for graduation, complete a Chemistry Major or ACS-Certified Chemistry Major Degree Sheet, and submit Graduation Materials.Login to your SIS account and go to your “academics” tab, and choose the last menu item, which is “apply for graduation”. Choose your “time/term of graduation” as May (August for those who are completing the requirements after summer school). For the distribution requirements, follow the instructions in the above link to see if they are satisfied. For the Chemistry Major or ACS-Certified Chemistry Major requirements, please find the form from our department website and fill it out: https://chem.tufts.edu/resources/forms-and-guidesOnce you fill out your degree sheet and SIGN, please email the pdf of the completed form to your advisor no later than Wednesday, November 20*. Please use Lastname_Firstname_DegreeSheet as your file name. Your advisor will go over the courses, check the grades, then send it to Department Chair via Box to sign it. When the form is complete you will be notified by a member of Chemistry staff and you will add the signed form to your package and send to registrar via SIS upload.Instructions from the registrar to upload Graduation Materials.*If you submit your signed form to your advisor after 11/20, we cannot guarantee that your signed degree sheet will be back in time for you to submit your graduation packet by the 11/30 deadline. Course Information Department Faculty Student Resources Declaration of Primary Major Form Chemistry Major Concentration Checklist ACS-Certified Chemistry Major Concentration Checklist All Resources"
