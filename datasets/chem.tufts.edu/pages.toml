["https://chem.tufts.edu/academics/graduate-programs/ms-chemistry"]
title = "MS in Chemistry | Department of Chemistry"
full_description = "MS in Chemistry The MS in Chemistry's flexible course requirements allow students to customize the program to fit the needs of their individual academic and career goals. Briefly, each student must pass ten graduate-level courses, six of which must be in chemistry with formal classroom instruction. With the approval of the student's adviser, four of the courses may be taken in related fields outside the department of chemistry. Course Requirements and Policies MS candidates must complete at least 10 graduate level courses totaling at least 30 credits (courses numbered between 100 and 294, inclusive, including 0191, 0192, and 0291) with a grade of B- or better. Six of these courses must be in Chemistry. A student may elect to earn a minimum of 24 credits from classroom courses and six credits from research (Chem 295, Chem 0296). The courses must be chosen in consultation with the graduate committee. For the purposes of counting courses, the sequence Chem 0291/0292 counts as one course, as does the sequence Chem 0191/0192. Students may also elect to prepare a master’s thesis, which they must then present and defend before their research committee. In lieu of research courses, two courses totaling no more than six credits may be approved for independent study, with permission of the graduate committee. MS students are encouraged to take course Chem 0291: Professional Skills in Chemical Research. This course does not count toward the six required classroom courses in chemistry, but does count toward the overall requirement for 30 credits. MS students are encouraged to register for Chem 0191 and 0192, Seminars in Chemistry. These courses do not count toward the six required classroom courses in chemistry, but do count toward the overall requirement for 30 credits. Course Information Department Faculty Admissions Information Graduate Student Handbooks View All Handbooks"
year_published = 2025
