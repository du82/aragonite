["https://chem.tufts.edu/node/1451"]
title = "Clay Bennett | Department of Chemistry"
full_description = "Research Website Full Profile Career Highlights / Publications Research Professional Activities Courses / Teaching Activities Clay Bennett Professor, Chemistry (617) 627-0621 clay.bennett@tufts.edu 62 Talbot Avenue Full Profile (facultyprofiles.tufts.edu) Research Website Full Profile Career Highlights / Publications Research Professional Activities Courses / Teaching Activities Research/Areas of Interest Organic Synthesis, Carbohydrate Chemistry, Synthetic Methodology, Bioorganic Chemistry. Complex carbohydrates play critical roles in a number of biological processes including, protein folding, cellular adhesion and signaling. Despite their importance, very little is understood about the molecular basis of their activity. This is largely due to the fact that the only source of pure oligosaccharides is tedious multi-step synthesis, which can take months or even years to compete. Our research is focused on developing methodologies, based on asymmetric catalysis, to streamline complex oligosaccharide synthesis. Ultimately such methods will aid in the rapid and routine preparation of oligosaccharides for biophysical studies and drug discovery. Education PhD Organic Chemistry, University of Pennsylvania, Philadelphia, United States, 2005BA (cum laude) ACS Chemistry, Connecticut College, New London, United States, 1999"
