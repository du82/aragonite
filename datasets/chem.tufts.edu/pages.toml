["https://chem.tufts.edu/research/undergraduate-scholarship-research-opportunities/research-lab-profiles"]
title = "Research Lab Profiles | Department of Chemistry"
full_description = '''Research Lab Profiles The Department of Chemistry has 16 unique research labs that provide opportunities to undergraduate students. Bennett LabResearch in the Bennett lab uses a combination of organic synthesis, physical organic chemistry, and automation to address longstanding problems in carbohydrate chemistry. One area of interest has been to develop new stereoselective reactions for assembling carbohydrate monomers into larger oligosaccharides (glycosylation reactions). These studies have led to some of the most selective glycosylation reactions reported to date. Through a combination of physical organic and computational chemistry, we have been able to demonstrate that selectivity is the result of SN2-like processes. This is in contrast to the unselective SN1-like mechanism that is frequently attributed to these reactions. To expand the scope of this chemistry, we have developed automated continuous flow-based processes for the construction of monosaccharide precursors. Through these latter studies, we have been able to reduce the time of these multi-step syntheses from days to minutes. We are currently exploring the utility of these processes with other chemistry. We also use our chemistries to carry out a process called natural product glycodiversification. This process relies on changing the carbohydrates on a natural product in order to improve its therapeutic properties. Current targets include anti-cancer and antimicrobial compounds. A two-semester research commitment is required. Summer research is encouraged.Prerequisites: Chem 51/52 is strongly encouraged and may be taken concurrently. Deadlines: Rolling deadline. Process: After reviewing applications, Prof. Bennett will meet with potential candidates to discuss their interests. Positions available: 0 (new positions are anticipated beginning in Spring 2024, at the earliest).Learn more about the Bennett Lab Caspari LabIn order to understand how and why successful teaching and learning of chemistry at the university level works, the Caspari group focuses on analyzing students', teaching assistants' (TA), learning assistants' (LA), and instructors' reasoning, interactions, and culture. The group collects video data of classroom practices and conducts qualitative research interviews with instructors, TAs, LAs, and students to better understand how certain interactions and ways of reasoning lead to student sense making and learning. While zooming in and investigating how students connect aspects of chemistry, the group also zooms out and investigates classroom culture and how individual interactions and personal experiences integrate into larger systems of teaching and learning. The group uses this fundamental research as a theoretical basis for implementing teaching innovations and designing training opportunities to promote supportive learning environments for students that value and encourage their unique ways of being, knowing and doing.Prerequisites: None. Deadlines: Nov. 15th for positions beginning in January; April 15th for positions beginning in September. Process: After application review, Prof. Caspari and Caspari lab members will interview potential candidates to learn more about their interests. Positions available: 1Learn more about the Caspari Lab Clark LabResearch in the Clark Group seeks to develop new materials and analytical methods to identify, quantify, and understand the function of RNA modifications in biological systems. Our long-term goals are to advance sample preparation, chromatographic separation, and mass spectrometry approaches to facilitate the characterization of nucleic acid modifications in the central nervous system, single cells, and subcellular structures. In combination with a powerful neurobiological model, the marine mollusk Aplysia californica, we leverage techniques in analytical chemistry, molecular biology, and neuroscience to investigate mechanisms of post-transcriptional regulation in normal and abnormal function of the central nervous system. Undergraduates in the laboratory contribute substantially to several research projects including liquid chromatography-mass spectrometry measurements of RNA modifications, design and synthesis of ionic liquid solvents for biomolecule extraction, and the development of new analytical workflows for selective profiling of modified RNAs in single cells. Undergraduates in the Clark Group will develop scientific communication skills and proficiency in lab techniques that are highly desired in biotechnology and pharmaceutical industries, government labs, academic research labs, and beyond.Prerequisites: An enthusiasm for analytical chemistry, RNA, and how chemical modifications of the fundamental building blocks of life affect cell function. Preferred: student is enrolled or plans to enroll is Chem42/43, Chem 171, and/or Chem 141.Deadlines: The following application due dates will be observed; November 15th for positions beginning in January; April 15th for positions beginning in September. Process: After application review, top candidates will be selected based on interests and fit within the group to meet with the PI and other members of the research group to further discuss research interests. The applicant will be informed of a decision after all meetings are complete. Positions available: 1Learn more about the Clark Lab Davis LabResearch in the Davis lab focuses on sustainability in inorganic materials. Example topic areas include: making new molecules and materials that absorb or emit light for solar cells and LEDs; producing new volatile molecules that can deposit metals or superconductors for improved microelectronics; and developing chemistry that can enable decarbonization of hard-to-abate industrial sectors, such as ironmaking and cement production.Prerequisites: None. Deadlines: Dec. 5th for positions beginning in January; April 3rd for positions beginning in May; July 31st for positions beginning in September. Process: After application review, Prof. Davis and Davis lab members will interview potential candidates to learn more about their interests and fit for available research positions. Positions available: 2Learn more about the Davis Lab Ding LabThe Ding Lab develops advanced computational methods for drug design and understanding complex biophysical processes. The main computational tools used in the lab include molecular simulations and machine learning. Using these two techniques, we currently focus on (1) developing highly efficient methods for computing protein-drug binding affinities, which could significantly accelerate drug discovery, and (2) building computational models for biomolecules, which enables accurate simulation of complex biophysical systems. Undergraduate students are expected to learn basic programming, running simulations of biomolecules, and analyzing simulation data.Prerequisites: None. Deadlines: Rolling deadline. Process: After application review, Prof. Ding will interview with potential candidates to learn more about their interests. Positions available: 0Learn more about the Ding Lab Kounaves LabOur research is aimed at understanding how biologically-produced molecules (biomarkers) on Mars are altered when exposed to UV radiation in the presence of oxidants and/or their intermediate products. To help answer this question we are investigating the “fragmentation” patterns of such altered biogenic compounds which could then be used to identify the original biomarker and thus provide evidence for life on Mars. Our group has also been collaborating with NASA to develop in-situ analytical instrumentation designed to unambiguously detect microbial life and determine the habitability of planetary environments that may be present at the surface and subsurface of Mars, and the oceans of Saturn's moon Enceladus. Students can expect to gain experience with a variety of analytical techniques and instruments such as GCMS, HPLC/LCMS, IC, ICP, NMR, and electroanalysis.Prerequisites: Quantitative Analysis (Chem 42), and preferably junior/senior class standing. A two-semester commitment is required. Summer research positions may also be available. Deadlines: Rolling deadline. Process: After application review, Prof. Kounaves will meet with potential candidates to learn more about their interests. Positions available: One for Fall 2024 and three for Fall 2025Learn more about the Kounaves Lab Kritzer LabThe Kritzer lab uses new molecules to solve vital chemical and biomedical problems. We discover new molecules and apply them by combining approaches from organic synthesis, biochemistry, biophysics, computational design, genetics, and cell biology -- and by inventing new approaches as we go along! In one series of projects, we design innovative molecules to block disease-associated proteins, often in ways traditional "drug-like" molecules cannot. In another project, we are also exploring new chemistries that increase the potency and usefulness of bioactive peptides. Additional projects focus on inventing new methods for measuring cell penetration, which is the most difficult roadblock for many emerging therapeutics including peptide therapeutics, protein therapeutics, RNA therapeutics, and gene editing.Prerequisites: None. Deadlines: Nov. 15th for positions beginning in January; March 15th for positions beginning in May. Process: After application review, Prof. Kritzer and Kritzer lab members will interview potential candidates to learn more about their interests. Positions available: 1 (Spring 2025) and 2 (Summer 2025)Learn more about the Kritzer Lab Kumar LabOur research program has broad, expansive interests at the intersection of chemistry, biology, and medicine. Current problems of interest to the laboratory range from understanding the origin of life to the design of therapeutics for a wide range of indications. Undergraduate (UG) students in the group work closely with Prof. Kumar, senior UG and graduate students, postdoctoral researchers, and staff scientists. UG researchers are expected to spend ~15 hrs/week in the lab and should have contiguous blocks of time available (5+ hrs twice a week). Our program uses tools of molecular design; organic synthesis including peptides; pharmacology; enzymology; bacterial and mammalian cell culture/biology; biophysical and bioanalytical methods, and materials science. UG researchers should commit to at least two semesters of research for it to be a meaningful experience; most join in their sophomore year and stay for the duration of their time at Tufts. Prerequisites: Chem 51 (waived if you have computational interests only). Deadlines: Rolling deadline. Process: Apply as early as you can, even as you are enrolled in Chem 51. After application review, Prof. Kumar and members of the lab will meet with you to discuss mutual research interests. We welcome everyone including pre-health science students! Positions available: Up to 2Learn more about the Kumar Lab Lin LabThe YSL lab uses computational chemistry to study and predict the structures and functions of biomolecules. Current projects include using molecular dynamics simulation and machine learning to predict structures and other properties of peptides, designing cyclic peptides that can target specific protein surfaces, designing cyclic peptides with high membrane permeability and other desired properties, and developing automated analysis to process simulation data.Prerequisites: No formal courses are required, but students should be interested in chemistry, physics, biology, and computer science. Additionally, students must attend our group meetings at least three times before applying to the YSL Lab (please email Prof. Lin to find out the time and location). Deadlines: February 15th for positions beginning in June (summer) or September (fall semester); October 15th for positions beginning in January (spring semester). Process: After application review, Prof. Lin and the YSL Lab members will interview potential candidates to learn more about their interests. Positions available: 0Learn more about the Lin Lab Mace LabResearch in the Mace lab targets many aspects of measurement science: process improvement, assay development, device design and prototyping, usability and user experience, and testing using real sample matrices. With a focus on global health and diagnostics, members of the Mace lab are introduced to projects spanning infectious disease diagnostics, patient-centric microsampling, and laboratory medicine. While the primary method we use to approach challenges is paper-based microfluidics, we use our creativity, multidisciplinary backgrounds, and team of industry, clinical, and international collaborators to get the job done. Undergraduate researchers will work closely with a senior member of the lab and are expected to coordinate their schedules with their mentor. Students are expected to work roughly 10–15 hours per week. Prerequisites: None. Deadlines: Nov. 15th for positions beginning in January; April 15th for positions beginning in September. Paid summer opportunities are generally available only to those students who already have experience in the group. Process: After application review, Prof. Mace and members of the Mace Lab will interview potential candidates to learn more about their interests and fit for available projects. Positions available: 0 (2 new positions are anticipated beginning in Spring 2024)Learn more about the Mace Lab Scheck LabResearch in the Scheck lab uses chemistry to learn more about biological systems. We focus on developing new chemical methods that can be used to study protein post-translational modifications, especially those that have been difficult to study using traditional tools. Undergraduate students in my group work closely with me, along with my graduate students and/or post-doctoral researchers. Undergraduate researchers are expected to work roughly 10-15 hours per week, and must be available to come into lab on at least two consecutive days per week. Projects in the lab vary, but in general students can expect to gain experience in several of the following areas: chemical synthesis, peptide synthesis, protein expression and purification, bacterial and mammalian cell culture, protein analysis methods, on-bead peptide libraries, and mass spectrometry and proteomic analysis. Prerequisites: Chem 51 (completed) and Chem 171 (completed or concurrent with the first semester of research). Deadlines: Nov. 15th for positions beginning in January; April 15th for positions beginning in September. Process: After application review, Prof. Scheck and her lab members will interview potential candidates to learn more about their interests. Positions available: 1-2 Learn more about the Scheck Lab Shultz LabResearch in the Shultz lab focuses on the development of catalysts for various energy applications. The fundamental catalyst is ultranano titania: (TiO2)<200. With these few formula units, the particles self as'''
year_published = 2025
