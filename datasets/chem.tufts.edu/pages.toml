full_description = "Full Profile Research Professional Activities Courses / Teaching Activities Diren Pamuk Turner Senior Lecturer, Chemistry Academic Leave (617) 627-2627 diren.pamuk@tufts.edu 62 Talbot Avenue Full Profile (facultyprofiles.tufts.edu) Full Profile Research Professional Activities Courses / Teaching Activities Education PhD, Tufts University, Medford, United States, 2010BS, Bo�aziçi University, Istanbul, Turkey, 2002 Biography Dr. Pamuk-Turner teaches Biochemistry and Introductory Chemistry courses. She joined the Tufts faculty following an appointment as a preceptor in the Department of Molecular and Cellular Biology at Harvard University, working on the courses of cell biology of human life, biochemistry and molecular medicine. She has also held positions as a lecturer at both Tufts and Regis College, teaching Biochemistry General Chemistry and Organic Chemistry. During her Ph.D. work at Tufts University, she received the Tufts Graduate Institute for Teaching Fellowship in 2007 and the Outstanding Teaching Assistant Award from the Department of Chemistry in 2003."
