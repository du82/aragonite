["https://chem.tufts.edu/academics/undergraduate-programs/fifth-year-masters-degree-program-bsms-chemistry"]
title = "Fifth-Year Master’s Degree Program: BS/MS in Chemistry | Department of Chemistry"
full_description = "Fifth-Year Master’s Degree Program: BS/MS in Chemistry The Chemistry Department offers exceptional Tufts undergraduate Chemistry majors the option of earning a Fifth-Year Master’s Degree: BS/MS in Chemistry. This program allows students to finish the undergraduate degree and the master's degree in five years. Graduates of the Fifth-Year Master’s Degree Program receive both a bachelor's degree and a master’s degree from Tufts, and each degree is awarded upon completion of requirements for each portion. Students will graduate with an undergraduate degree with their undergraduate class, and graduate with a master's degree with their master’s cohort, after the graduate requirements are met. Students seeking admission to the program in Chemistry should consult their undergraduate major advisers and also the Chemistry Graduate Program Director before applying to the graduate school. Program Requirements and Policies Graduates of the Fifth-Year Master’s Degree Program must complete all requirements for both the BS in Chemistry and the MS in Chemistry. Tufts undergraduate students have the option of double-counting up to two graduate-level courses (100-level or higher) toward both their Bachelor's and Master's degree requirements. Learn more information on the Fifth-Year Master's Program. Admissions Students must apply for this program before they complete their undergraduate studies, typically in their junior or early in their senior year. The deadline to apply is December 15 for seniors and March 15 for juniors. Therefore, students interested in the program should contact their advisers early in their academic career to facilitate program planning. A student may elect to withdraw from the program at any time by filing the appropriate petition. Seniors or recent undergraduate alumni who have graduated within the past three years are also eligible for the Tufts Plus Program, which simplifies the application process for master's programs. Admitted applicants are also eligible for generous tuition scholarships. Course Information Department Faculty Student Resources Declaration of Primary Major Form Chemistry Major Concentration Checklist ACS-Certified Chemistry Major Concentration Checklist All Resources"
