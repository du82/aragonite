title = "BS in Chemical Physics | Department of Chemistry"
full_description = "BS in Chemical Physics The BS in Chemical Physics is intended for those students who desire a more theoretical physics-oriented education. Program Requirements and PoliciesSeventeen courses and accompanying labs are required to complete the major. Faculty advisers in the chemistry and physics departments are available for consultation about the chemical physics program.Course RequirementsThe following Foundation courses:Chem 1: Chemical Fundamentals w/ Lab (or Chem 11: General Chemistry or Chem 16: Chemistry of Materials)Chem 2: Chemical Principles w/ Lab (or Chem 12: General Chemistry)Physics 1: Introduction to Physics I w/Lab or Physics 11: General Physics I w/LabPhysics 2: Introduction to Physics II w/Lab or Physics 12: General Physics II w/LabMathematics 32: Calculus IMathematics 34: Calculus IIMathematics 42: Calculus III (or Mathematics 39: Honors Calculus I-ii and Mathematics 44: Honors Calculus III) Ten more advanced Concentration courses with the following distributions:Four courses in Chemistry that have a prerequisite of Chem 2 or Chem 12. Four courses in Physics that have a prerequisite of Phys 2 or Phys 12Two courses in Mathematics (Math 70 or courses with a prerequisite of Math 42, Math 44, or Math 70)The Concentration courses must include the following: Physics 13: Introduction to Modern PhysicsEither Physics 64: Advanced Experimental Physics (counts as one advanced Physics course) or both Chemistry 33: Physical Chemistry Lab and Chemistry 34: Physical Chemistry LabEither Chemistry 31: Physical Chemistry I or Physics 52: Thermal PhysicsEither Chemistry 32: Physical Chemistry II or Physics 61: Quantum TheoryEither Chemistry 51: Organic Chemistry I or Chemistry 61: Inorganic Chemistry Recommend Course Sequence for Chemical Physics MajorsUL = intermediate or upper-level courseYearFallSpring1Chem 1 or 11Math 32Chem 2 or 12Math 34Phys 11 (or 1)2Phys 12Math 42Chem ULMath ULChem UL3Phys 13Math ULChem ULChem ULPhys UL4Phys ULPhys ULAlternate Course Sequence for Chemical Physics MajorsUL = intermediate or upper-level courseYearFallSpring1Phys 1 or 11Math 32Phys 2 or 12Chem 1 or 16Math 342Chem 2Phys 13Math 42Phys ULChem ULMath UL3Chem ULMath ULChem ULPhys UL4Chem ULPhys ULDegree Sheet Submission InstructionsFor seniors who plan to graduate in May, follow the instructions below to apply for graduation, complete a Chemical Physics Major Degree Sheet, and submit Graduation Materials.Login to your SIS account and go to your “academics” tab, and choose the last menu item, which is “apply for graduation”. Choose your “time/term of graduation” as May (August for those who are completing the requirements after summer school). For the distribution requirements, follow the instructions in the above link to see if they are satisfied. For the Chemical Physics requirements, please find the form from our department website and fill it out: https://chem.tufts.edu/resources/forms-and-guidesOnce you fill out your degree sheet and SIGN, please email the pdf of the completed form to your advisor no later than Wednesday, November 20*. Please use Lastname_Firstname_DegreeSheet as your file name. Your advisor will go over the courses, check the grades, then send it to Department Chair via Box to sign it. When the form is complete you will be notified by a member of Chemistry staff and you will add the signed form to your package and send to registrar via SIS upload.Instructions from the registrar to upload Graduation Materials.*If you submit your signed form to your advisor after 11/20, we cannot guarantee that your signed degree sheet will be back in time for you to submit your graduation packet by the 11/30 deadline. Course Information Department Faculty Student Resources Declaration of Primary Major Form Chemical Physics Major Concentration Checklist All Resources"
