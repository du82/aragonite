["https://chem.tufts.edu/current-students/courses"]
title = "Courses | Department of Chemistry"
full_description = "Courses Spring 2025 Offerings Course Info on SISThe list below includes descriptions of all undergraduate and graduate courses offered by the Department of Chemistry, though some courses may be taught more often than others.Visit the undergraduate and graduate pages for course requirements for specific programs. For up-to-date information on course offerings, schedules, room locations and registration, please visit the Student Information System (SIS).Undergraduate Only (CHEM 0001-0092)0001 General Chemistry I with Lab. Atomic and molecular structure, chemical nomenclature, intermolecular forces and states of matter, the relation of structure and bonding to physical and chemical properties of matter, patterns of chemical reactions, stoichiometry, thermochemistry, and properties of solutions. Three lectures, one laboratory, one recitation. Only one of Chemistry 1, 11, or 16, may be counted for credit.0002 General Chemistry II with Lab. Chemical kinetics and thermodynamics, physical and chemical equilibria, aqueous equilibria (acid-base, precipitation, and complex formation), electrochemistry, introduction to organic chemistry (families of organic compounds, basic stereochemistry and nomenclature). Additional topics may include environmental, nuclear, coordination chemistry; chemistry of selected elements; and introduction to biological chemistry. Three lectures, one laboratory, one recitation. Prerequisite: Chemistry 1, 11, 16, or consent. Only one of Chemistry 2 or 12 may be counted for credit.0003 Frontiers in Chemistry. Introduction to chemical research. Discussion of current research in chemistry and related fields; suited for introductory chemistry students. Weekly presentations by different Tufts faculty members and guests. Pass-Fail grading. Prerequisite: concurrent or prior enrollment in Chemistry 1 or 11.0004 Frontiers in Chemistry. Introduction to chemical research. Discussion of current research in chemistry and related fields; suited for introductory chemistry students. Weekly presentations by different Tufts faculty members and guests. Pass-Fail grading. Prerequisite: concurrent or prior enrollment in Chemistry 2 or 12.0006 From the Big Bang to Humankind. Course will explore the origins of the Universe, the formation of Earth and its structure, the chemistry of life, the development of complex organisms, and the development of modern humans. Students will learn the evidence for the various ideas presented, the scientific method used by scientists, and how the community of scientists evaluates the evidence. This course does not fulfill pre-medical requirements for a lab-based chemistry course.0008 Environmental Chemistry. An introductory course designed primarily to give non-science majors an appreciation of basic chemical principles underlying the causes of and possible solutions to current environmental problems. The concept of equilibrium in complex systems; thermodynamic limits and kinetic realities. Case studies from current literature. Prerequisite: High-school chemistry. Spring 2000 and alternate years.0011, Expanded General Chemistry I with Lab. Topics are the same as in Chemistry 1, but some concepts are covered in greater detail and mathematical depth, while other topics (including stoichiometry, unit conversion, elemental analysis, and simple combustion and precipitation reactions) are only briefly reviewed. For interested students who seek to engage deeply with chemical thinking. Three 75 min lectures; required co-enrollment in Chemistry 3 (Frontiers in Chemistry), one laboratory, one recitation. Recommendations: familiarity with solving problems on the following topics: stoichiometry, periodic trends and fundamental properties of elements, simple acid-base chemistry. A self-assessment for determining readiness for Chemistry 11 can be found on the Chemistry Department website; Prerequisite: Mathematics 32 (may be taken concurrently). Only one of Chemistry 1, 11, or 16 may be counted for credit.0012 Expanded General Chemistry II with Lab. Topics covered are the same as in Chemistry 2, but are discussed in greater detail and mathematical depth. For interested students who seek to engage deeply with chemical thinking. Three 75 min lectures; required co-enrollment in Chemistry 4 (Frontiers in Chemistry), one laboratory, one recitation. Prerequisites: Chemistry 1 or Chemistry 11. Only one of Chemistry 2 or 12 may be counted for credit.0016 Chemistry of Materials. An introductory course investigating the fundamentals and principles of chemistry through exploration of modern materials, e.g., thin films, superconductors, ultrasmall structures, modern electronics and photonics. Topics include atomic and molecular structure, intermolecular forces, ionic and covalent bonding. This one-semester course may be used in conjunction with Chemistry 2 to fulfill the basic chemistry requirement for a chemistry major. Three lectures, one recitation, one laboratory. Prerequisite: Good background in mathematics. Only one of Chemistry 1, 11, or 16 may be counted for credit. 0031 Physical Chemistry I. Introduction to principles of modern physical chemistry. Topics include the laws of thermodynamics with an emphasis on enthalpy, entropy, and Gibbs free energy to build a macroscopic understanding of molecular behavior, the quantum mechanics of atomic and molecular structure for molecular-level insights into the energetics governing molecular behavior, and statistical mechanics to connect the microscopic properties of atoms and molecules to macroscopic phenomena, including heat, work, and energy. Prerequisites: CHEM 2 or 12; MATH 34; and PHYS 2 or 12; or instructor permission. Physics may be taken concurrently. 0032 Physical Chemistry II. Advanced concepts in physical chemistry. Topics include reaction kinetics, with a focus on rates, mechanisms, and transition state theory and an in-depth study of quantum mechanics and its applications to spectroscopy and the determination of atomic and molecular structures. Prerequisites: CHEM 2 or 12; MATH 34; and PHYS 2 or 12; or instructor permission. Physics may be taken concurrently.0033 Physical Chemistry I Lab. Laboratory-based course introducing quantitative measurements and experimental techniques in physical chemistry. Experiments reinforce concepts from CHEM 31, with a focus on thermodynamics and quantum mechanics. Prerequisite: CHEM 31 or concurrent registration0034 Physical Chemistry Lab II. Advanced course providing opportunities for guided original research. Small group work to propose, develop, and perform research related to one of the four core areas of physical chemistry: quantum mechanics, thermodynamics, statistical mechanics, or kinetics and dynamics. Prerequisite: CHEM 31, CHEM 32 or concurrent registration in CHEM 32, or instructor permission.0042 Quantitative Analysis. Introduction to the methods and scientific basis of quantitative analysis including, sampling, error & statistical analyses, data treatment & presentation, basic concepts and operation of chromatographic, electroanalytical, and spectroscopic instrumentation. For chemistry majors, as well as students enrolled in Earth sciences, environmental studies, or engineering. The course will provide students in chemistry or any related discipline with the necessary foundation, understanding, and basic tools for doing good science and operating common analytical instrumentation. Two lectures, two laboratories. One and one-half courses. Prerequisites: Chemistry 2 or 12. Spring. 0043 Bioanalytical Chemistry. Introduction to the fundamental concepts of characterization, separation, detection, identification, and quantification of analytes in complex biological samples with an emphasis on experimental design and methods in data interpretation and error analysis. Alternative to CHEM 0042 (Quantitative Analysis) designed for students majoring in biochemistry or with interests in biotechnology, chemical biology, and biomedical engineering. Prerequisites: CHEM 2 or CHEM 12, Concurrent registration with CHEM 45 required. Three lectures, one recitation.0045 Bioanalytical Chemistry Lab. Hands-on laboratory experiments emphasizing the use of modern instrumentation, experimental methodology, and data analysis to investigate the concepts in Chemistry 43. One laboratory, one lecture. Requires same term enrollment in Chem 43.0050 Survey of Organic Chemistry. One semester survey of organic chemistry. Topics include structure and bonding in organic molecules, spectroscopy, stereochemistry, reactivity, synthesis, polymer chemistry, and bioorganic chemistry. Will not fulfill the organic chemistry requirement for chemistry majors, premedical, pre-dental, or pre-veterinary students. May not be taken for credit in conjunction with Chemistry 51 or 52. Students needing a laboratory should register for Chemistry 53. Three lectures. Prerequisite: Chemistry 2 or 12.0051 Organic Chemistry I. Structure, bonding, conformational analysis, functional groups, and stereochemistry. Organic reactions, synthesis, and mechanisms including acid/base reactions, nucleophilic substitutions and eliminations, reactions of alcohols, aldehydes, ketones, carboxylic acids and their derivatives, and amines. Additional topics may include tools for structure determination: nuclear magnetic resonance and infrared spectroscopy. (Note: The laboratory course, CHEM 53, is normally taken concurrently with CHEM 51.) Prerequisites: CHEM 2 or 120052 Organic Chemistry II. Continuation of CHEM 51. Structure, properties, and reactions of alkenes, alkynes, ethers, epoxides, conjugated unsaturated systems, and aromatic compounds. Radical reactions. Mechanisms, retrosynthetic analysis, and synthetic strategy. Tools for structure determination: nuclear magnetic resonance and infrared spectroscopy. Additional topics may include the chemistry of carbohydrates, lipids, amino acids, nucleic acids, and organometallic reactions. (Note: The laboratory course, CHEM 54, is usually normally taken concurrently with CHEM 52.) Prerequisites: CHEM 510053 Organic Chemistry Laboratory I. Experiments based on topics in Chemistry 51. One laboratory, one lecture. One-half course. Co-requisite or prerequisite: Chemistry 50 or 51. Fall.0054 Organic Chemistry Laboratory II. Experiments based on topics in Chemistry 52. One laboratory, one lecture. One-half course. Prerequisite: Chemistry 53. Co-requisite or prerequisite: Chemistry 52. Spring.0055 Advanced Synthesis Laboratory. Introduction to advanced laboratory techniques in synthetic organic and inorganic chemistry. Emphasis on synthetic methods that involve organometallics, catalysts, and enzymes. Techniques include inert atmosphere manipulations, chromatography, and spectroscopic analysis. Nine hours of laboratory. Prerequisites: Chemistry 52 and 54.0061 Inorganic Chemistry. Chemistry illustrative of the kinds of bonding in inorganic compounds, including discussions of ionic, covalent, electron-deficient, and coordination compounds. Three lectures. Prerequisites: Chemistry 31 and 52. Only one of Chemistry 61 or 161 may be taken for credit. Fall.0063 Inorganic and Synthetic Chemistry Laboratory. Experiments include those based on topics in Chemistry 61. Techniques in synthesis, spectroscopy, and reactivity studies. Applications of inorganic compounds in synthesis, catalysis, materials sciences, and biology. One laboratory, one lecture, one-half course. Prerequisites Chemistry 61 or 161. Fall0081 Research I. (Previously CHEM 91) Training in the methods of chemical research. Frequent conferences and library assignments. Open to qualified advanced students. Requires at least fifteen hours per week of laboratory and/or other research work in chemistry during the fall or spring semesters, or 35-40 hours per week during the summer sessions. Pass-fail grading. You will need to be given permission from your research advisor and the Chemistry department to register for Chem0081. Please email megan.guldenzoph@tufts.edu, and cc your research advisor, with your name, student ID, and the Chemistry Research Course you want to enroll in.0082 Research II. (Previously CHEM 92) Continued training in the methods of research. Requires at least fifteen hours per week of laboratory and/or other research work in chemistry during the fall or spring semesters, or 35-40 hours per week during the summer sessions. Students write a report of research accomplished. Recommendations: CHEM 81 and permission of instructor.You will need to be given permission from your research advisor and the Chemistry department to register for Chem0082. Please email megan.guldenzoph@tufts.edu, and cc your research advisor, with your name, student ID, and the Chemistry Research Course you want to enroll in.0083-0088 Research III-VIII. Continued training in the methods of research. Requires at least fifteen hours per week of laboratory and/or other research work in chemistry during the fall or spring semesters, or 35-40 hours per week during the summer sessions. Students write a report of research accomplished. Recommendations: permission of instructor. Courses must be taken in numerical order, starting with CHEM 81. One-credit courses.You will need to be given permission from your research advisor and the Chemistry department to register for Chem008x. Please email megan.guldenzoph@tufts.edu, and cc your research advisor, with your name, student ID, and the Chemistry Research Course you want to enroll in.0094 Science & the Human Experience. For non-chemistry majors - does not count towards the chemistry undergraduate major.Undergraduate & Graduate (CHEM 0131-0199)0131 Chemical Thermodynamics. A detailed application of the laws of thermodynamics to chemical and phase equilibria. Thermodynamics of solutions and solids. Introductory statistical thermodynamics. Three lectures. Prerequisites: Chemistry 31 and Mathematics 42, or consent. Spring 2021 and alternate years.0132 Chemical Kinetics and Dynamics. Study of chemical reaction rates in the gas phase and solution. Topics include kinetic models, experimental methods, molecular reaction dynamics, kinetic theory of gases, potential energy surfaces, and transition state theory. Prerequisite: Chemistry 32 or consent. Fall 2021 and alternate years. 0133 Quantum Mechanics. Covers Schrödinger equation and basic quantized systems, statistical interpretation and uncertainty, perturbation theory, scattering, symmetries and invariance, approximation methods, energy calculations. Prerequisite: Chemistry 32; Mathematics 51 recommended. Fall.0134 Statistical Mechanics. Fermi-Dirac, Bose-Einstein, and Maxwell-Boltzmann statistics. Ensembles, most probable distribution, and fluctuations. Calculation of chemical potential from molecular constants; determination of equilibrium in gas-phase reaction systems; transport properties; simple theories of solids, liquids, and solution. Prerequisite: Chemistry 32; Mathematics 51 recommended. 0135 Biophysical Chemistry."
