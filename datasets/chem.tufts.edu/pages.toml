["https://chem.tufts.edu/davis-lab/about/join-our-lab"]
title = "Join Our Lab | Department of Chemistry"
full_description = "Join Our Lab We are currently searching for a Postdoctoral Teaching Scholar! Research Opportunities The COVID-19 pandemic caused by SARS-CoV-2 continues to restrict somewhat the research opportunities available in the U.S.; please stay safe! If you are interested in research in the Davis Lab, please email Professor Davis, and see the relevant section below. Postdoctoral Teaching Scholar The Davis Laboratory at Tufts is currently accepting applications for a Postdoctoral Teaching Scholar. This position will be an especially good fit for a person interested in pursuing an academic career at a research-active but primarily undergraduate institution. The Postdoctoral Teaching Scholar position combines opportunities to perform laboratory research, supervise undergraduate researchers, and teach in the inorganic and general chemistry sequences at Tufts. Research: In addition to the projects described on the home page, our lab is broadly interested in inorganic and materials chemistry. We are just beginning new projects in the synthesis of superconducting materials and in carbon-free reduction of iron ore. Candidates should be interested in synthesis and characterization of inorganic molecules or materials. Teaching: Candidates should be interested in and have adequate background for teaching inorganic and general chemistry courses. Examples of courses include, but are not limited to, Chem 1 (Chemical Fundamentals), 2 (Chemical principles), 61 (Inorganic Chemistry), and 63 (Inorganic and Synthetic Chemistry Laboratory). Syllabi and course notes from previous versions of these courses are available. To apply: Please email Professor Davis; include a CV/resume and a cover letter speaking to (a) which project(s) you are interested in; (b) your relevant prior research experience; (c) your interest, ability, and experience in teaching inorganic and general chemistry; (d) your interest, ability, and experience in mentoring undergraduate researchers; (e) your motivation for writing to us in particular; (f) your availability to start; and (g) a description of your career goals. It is understood that candidates may not yet have experience in all categories; applications will be reviewed holistically. Applications are being accepted now and reviewed on a rolling basis, continuing until posted otherwise. Interested and motivated candidates are encouraged to apply! Postdoctoral Scholars Please include a CV or resume, and speak to (a) which project(s) you are interested in, (b) your relevant prior experience, (c) any sources of funding available to you, (d) your motivation for writing to us in particular, (e) your availability to start, and (f) a description of your career goals. Prospective Graduate Students I am happy to speak by phone or Zoom to discuss Tufts Chemistry or the Davis Laboratory! All graduate admissions proceed through our admissions committee, after application to the Graduate School of Arts and Sciences. More information can be found here. Undergraduate Researchers The Davis Laboratory typically has vigorous participation from undergraduate researchers! We currently have some availability for undergraduate researchers. Please include a CV or resume, and speak to (a) which project(s) you are interested in, (b) any relevant prior experience or coursework, and (c) your motivation for writing to us in particular. Pre-College Researchers The Davis Laboratory has hosted high-school students through the Tufts Summer Research Experience. We hope to host students again when this program returns to an in-person format. Visiting Scholars The Davis Laboratory welcomes visiting scholars. Please write to Prof. Davis to describe your interest in visiting. Committee Requests Professor Davis enjoys serving on graduate student committees. Please see below for some details I appreciate seeing in your request. Tufts Chemistry PhD Students Please include a CV or resume, provide a short description of your research, highlight how you think I might be helpful on your committee, and include some times you are available in the next two weeks to meet by Zoom. Tufts PhD Students outside of Chemistry Please include a CV or resume, provide a short description of your research, link to your advisor's website, highlight how you think I might be helpful on your committee, and include some times you are available in the next two weeks to meet by Zoom. PhD Students outside of Tufts Please include a CV or resume, provide a short description of your research, link to your advisor's website, highlight how you think I might be helpful on your committee, describe why an external committee member is required or important, and include some times you are available in the next two weeks to meet by Zoom. Recommendation Letters Professor Davis is happy to write letters supporting student applications for research and career opportunities. If Professor Davis serves on your committee Please provide a short description of the opportunity for which you are applying, clearly indicate the due date for the letter, include your latest CV or resume, send a copy of your application materials when they are complete, and indicate whether you think a short meeting to discuss might be helpful. If Professor Davis taught you in a course Please provide a short description of the opportunity for which you are applying, clearly indicate the due date for the letter, explain why Professor Davis might be well suited to write on your behalf, include your latest CV or resume, send a copy of your application materials when they are complete, provide any other details that you think might be important, and indicate whether you think a short meeting to discuss might be helpful. For all other requests Please provide a short description of the opportunity for which you are applying, clearly indicate the due date for the letter, explain why Prof. Davis might be well suited to write on your behalf, include your latest CV or resume, send a copy of your application materials when they are complete, provide any other details that you think might be important, and indicate whether you think a short meeting to discuss might be helpful."
