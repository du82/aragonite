title = "BS in Biochemistry, Effective Fall 2025 | Department of Chemistry"
full_description = "BS in Biochemistry, Effective Fall 2025 The BS in Biochemistry is intended for those with an interest in the chemistry of living systems. It is an interdepartmental major for students interested in topics that intersect both chemistry and biology and is offered jointly by the Department of Chemistry and the Department of Biology.Program Requirements and PoliciesSeventeen courses and their accompanying labs are required to complete the major. No major course may be taken Pass/Fail.If you have more than one major, please see Bulletin for rules on double-counting courses across majors.A student majoring in Biochemistry may not declare any minor in Chemistry. Note: A student majoring in Biochemistry no longer needs to complete Biology or Chemistry research to be eligible for a summa cum laude degree. Course RequirementsChemistry CoursesChemistry 1: Chemical Fundamentals w/lab OR Chemistry 11: General Chemistry Chemistry 2: Chemical Principles w/lab OR Chemistry 12: General Chemistry Chemistry 35: Biophysical Chemistry (Recommended) OR Chemistry 31: Physical Chemistry I*Chemistry 43 & 45: Bioanalytical Chemistry w/ lab (Recommended) OR Chemistry 42: Quantitative Analysis)*** Chemistry 51: Organic Chemistry I Chemistry 53: Organic Chemistry I Lab Chemistry 52: Organic Chemistry II Chemistry 54: Organic Chemistry II Lab Chemistry 171: Biochemistry I Chemistry 172: Biochemistry II Biology CoursesBiology 13 & 15: Cells and Organisms** Biology 41: General Genetics Biology 105: Molecular Biology Other Required CoursesExperiential Laboratory Research, selected from:*** Biology 50: Experiments in Molecular Biology Biology 52: Experiments in Cell Biology Biology 54: Molecular Genetics Project Lab Biology 193 & 194: Independent Research in Biology Biology 199: Senior Honors Thesis Chemical & Biological Engineering 163: Recombinant DNA Technology Chemistry 82 or higher: Research II–VIII Chemistry 195 & 199: Senior Thesis I & II 1 Elective Course, selected from the approved Biochemistry electives list:Chem 157Chem 176Bio 156Math 34Please note that the approved list of electives is updated regularly. Please check this page frequently for a current list of approved electives. Math 32: Calculus I Physics 1: Introduction to Physics I w/ Lab or Physics 11: General Physics I w/ Lab * Effective Fall 2025, the Biochemistry major requires either Chem31: Physical Chemistry OR Chem 35: Biophysical Chemistry (Recommended). Please note that Chem 31 has Math 34 and Phys 2 as prerequisites. Math 34 may be used as an elective course. Chem 35 requires only Math 32 and Phys 1 or 11 as prerequisites. ** Starting with the incoming class of 2027, please note that Bio 13 and 15 are linked and must be taken concurrently for Biochemistry majors. If you are an A&S student, both courses must be added to your SIS cart when enrolling in Bio 13 & 15. Engineering students should be aware that there are restrictions on which majors and years are permitted to enroll in this course. BME students should enroll in BME 33 instead; some SoE majors may take Bio 13 without Bio 15. *** Effective for classes graduating after May 2024, the Biochemistry major will require at least one semester of a graded, experiential laboratory course. This laboratory requirement can be fulfilled in one of two ways: 1. Students complete Chem 43 & 45 and any of the experiential laboratory research requirements. 2. Students complete Chem 42 and one of the following laboratory courses that include molecular biology techniques: Bio 50, Bio 52, Bio 54, ChBE 163, or a graded independent research course in Biology (Bio 193, 194, 199) or petition to count graded research done in the Chemistry Department (Chem 82 or higher) that includes a biological component. Course Planning for Biochemistry MajorsThe Biochemistry Major is flexible and can be completed following many possible tracks. Still, care must be taken when planning schedules to ensure that certain course sequences are taken in the correct order. For example, in the Biology Department, Bio13 & 15 is a required prerequisite for Bio41, and Bio41 is a required prerequisite for Bio105. On the Chemistry side, Chem 1/11 must be taken before Chem 2/12; Chem 2/12 is a required prerequisite for Chem 51 and Chem 43 & 45 (or 42); and Chem 51 is a required prerequisite for Chem 171, which must be taken before Chem 172. Please note that Chem 35 requires Chem 2/12, Math 32, and Phys1/11 as prerequisites, while Chem 31 requires Chem 2/12, Math 34, and Phys1/11 as prerequisites with Phys2 as a pre/co-requisite. This list is not comprehensive, so please be sure to review the prerequisites for any courses you are considering when planning your schedule. You will also want to carefully check the times these courses are offered. For example, Bio 41 and Chem 12 are generally offered during the same class block during the Spring semester, these classes cannot be taken in the same semesterTo assist in your planning process, the tracks below represent a few options that would allow students to complete a Biochemistry major within 8 semesters. Please note that there are many other possible paths one could take through the Biochemistry major. In particular, the timing of the courses listed under “Other Required Courses” is particularly flexible. A listing of courses typically offered in Fall, Spring, and Summer can be found below the sample pathways:Example “Chem First” SequenceYearFallSpringFirst YearChem 1/11Math 32Chem 2/12Phys 1/11SophomoreChem 51 & 53Bio13 & 15 Chem 52 & 54Chem 171Bio 41JuniorChem 172Chem 43 & 45Chem 35Bio 105SeniorBio 50ElectiveExample “Bio First” Sequence YearFallSpringFirst YearBio 13 & 15Math 32Bio 41Phys 1/11SophomoreBio 105Chem 1/11Bio 50 or Bio 54Chem 2/12JuniorChem 51 & 53Chem 171Chem 35SeniorChem 172Chem 43 & 45Chem 52 & 54Elective Example “Alternative” SequenceYearFallSpringFirst YearBio 13 & 15Chem 1Math 32SophomoreChem 2Phys 1/11Chem 51 & 53Bio 41JuniorChem 43 & 45Bio 105Chem 171 Chem 52 & 54SeniorChem 172 Elective Chem 35Bio 50Courses typically offered in Fall semesters: Bio 13 & 15, Bio 50, Bio 105, Chem 1/11, Chem 2, Chem 51 & 53, Chem 172, Chem 31, Chem 43 & 45, Chem 157, Math 32, Math 34, Phys 1/11, Phys 2/12Courses typically offered in Spring semesters: Bio 41, Bio 50, Bio 54, Bio 105, Bio 156, Chem 1, Chem 2/12, Chem 51 & 53, Chem 52 & 54, Chem 35, Chem 42, Chem 171, Chem 176, Math 32, Math 34, Phys 1/11, Phys 2/12Courses typically offered over Summer sessions: Bio 13 & 15, Bio 41, Bio 105, Chem 1, Chem 2, Chem 51 & 53, Chem 52 & 54, BME/ChBE/Bio 163, Chem 171, Math 32, Math 34, Phys 1/11, Phys 2/12Degree Sheet Submission InstructionsFor seniors who plan to graduate in May and whose major advisors are Chemistry faculty, follow the instructions below to apply for graduation, complete a Biochemistry Major Degree Sheet, and submit Graduation Materials. If your major advisor is a Biology faculty member, please reach out to your major advisor and the associate chair of Biology and follow the instructions provided by the Biology Department. Login to your SIS account and go to your “academics” tab, and choose the last menu item, which is “apply for graduation”. Choose your “time/term of graduation” as May (August for those who are completing the requirements after summer school). For the distribution requirements, follow the instructions in the above link to see if they are satisfied. For the Biochemistry requirements, please find the form from our department website and fill it out: https://chem.tufts.edu/resources/forms-and-guidesOnce you fill out your degree sheet and SIGN, please email the pdf of the completed form to your advisor no later than Wednesday, November 20*. Please use Lastname_Firstname_DegreeSheet as your file name. Your advisor will go over the courses, check the grades, then send it to Department Chair via Box to sign it. When the form is complete you will be notified by a member of Chemistry staff and you will add the signed form to your package and send to registrar via SIS upload.Instructions from the registrar to upload Graduation Materials.*If you submit your signed form to your advisor after 11/20, we cannot guarantee that your signed degree sheet will be back in time for you to submit your graduation packet by the 11/30 deadline. Course Information Department Faculty Student Resources Declaration of Primary Major Form Biochemistry Major Concentration Checklist Student Resources"
