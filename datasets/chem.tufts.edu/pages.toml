["https://chem.tufts.edu/people/faculty/mary-shultz"]
title = "Mary Shultz | Department of Chemistry"
full_description = "Research Website Full Profile Career Highlights / Publications Research Professional Activities Courses / Teaching Activities Mary Shultz Professor, Chemistry (617) 627-3477 mary.shultz@tufts.edu 62 Talbot Avenue Full Profile (facultyprofiles.tufts.edu) Research Website Full Profile Career Highlights / Publications Research Professional Activities Courses / Teaching Activities Research/Areas of Interest Physical Chemistry and Surface Science. The Shultz group applies physics and chemistry to understand the inner workings of hydrogen bonding. Hydrogen bonding plays key roles in environmental, biological, and atmospheric chemistry. Our program has research thrusts in all three directions. We specialize both in devising environments that clearly reveal key interactions and in developing new instrumentation. The most recent focus is on icy surfaces and on clathrate formation. Probing the ice surface begins with a well-prepared single-crystal surface. We have unique capabilities for growing single-crystal ice from the melt and for and preparing any desired ice face. Our clean water efforts are aimed at developing new materials to fill the significant need for safe drinking water. According to the World Health Organization, over one billion people lack safe drinking water. Our program is based on using photo catalysts to capture readily available sunlight to turn pollutants into benign CO2 and water. We developed methods to grow ultra-nano (~2 nm) particles that have well-controlled surface structures and chemistry. Education BS, University of Wisconsin–Madison, Madison, United States, 1970PhD, Massachusetts Institute of Technology, Cambridge, United States, 1975"
