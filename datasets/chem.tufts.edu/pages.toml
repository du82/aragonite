["https://chem.tufts.edu/current-students/undergraduate-programs/minors-chemistry-fall-2022"]
title = "Minors in Chemistry | Department of Chemistry"
full_description = 'Minors in Chemistry Beginning in Fall 2022, undergraduate students will be able to declare Minors in Chemistry. Minors in Chemistry are designed for students who have done substantial coursework in Chemistry but who may choose not to complete all the requirements for a Chemistry Major. Minors in Chemistry are designed as cohesive tracks that allow students to gain expertise in a specific sub-discipline within the broad field of chemistry, while still allowing for significant flexibility. A&S students should consult the Tufts Bulletin for rules on double-counting courses toward foundation, distribution, major, or other requirements. SOE students should see the SOE undergraduate section of the Bulletin corresponding to their matriculation year for rules related to double counting courses applied toward the minor.Please reach out to our minor advisor, Eric High, with any questions.Program Requirements and PoliciesEach minor requires a total of six courses, made up of two foundation courses, two core courses, and two elective courses. In general, the hierarchy of courses will address the pillars of foundation, breadth, and depth in a given area of Chemistry.All courses used in fulfillment of the minor must be taken for a grade of C- or better.For A&S students, a maximum of two courses used in the fulfillment of a foundation, distribution, or major requirement can be used for fulfillment of requirements for a minor.Relevant special topics courses (Chem 0193 or 0194) can fulfill elective course requirements in any Chemistry Minor with Department or relevant Division approval. Petitions may be made to Eric High.Unless explicitly listed, laboratory courses are not required to complete a minor in chemistry. For example, the Chemistry of Life minor lists Chem 43 as an elective, but not the corresponding lab course Chem 45. This means that the lecture course alone fulfills one of the two elective requirements.Degree Sheet Submission InstructionsFor seniors who plan to graduate in May, follow the instructions below to apply for graduation, complete a Chemistry Minor Degree Sheet, and submit Graduation Materials.Login to your SIS account and go to your “academics” tab, and choose the last menu item, which is “apply for graduation”. Choose your “time/term of graduation” as May (August for those who are completing the requirements after summer school). For the distribution requirements, follow the instructions in the above link to see if they are satisfied. For the Chemistry Minor requirements, please find the form from our department website and fill it out: https://chem.tufts.edu/resources/forms-and-guidesOnce you fill out your degree sheet and SIGN, please email the pdf of the completed form along with your unofficial transcript and major checklist to Eric High no later than Wednesday, November 20*. Please use Lastname_Firstname_DegreeSheet as your file name. Eric will go over the courses, check the grades, then send it to Department Chair via Box to sign it. *If you submit your signed form to your advisor after 11/20, we cannot guarantee that your signed degree sheet will be back in time for you to submit your graduation packet by the 11/30 deadline. When the form is complete you will be notified by a member of Chemistry staff and you will add the signed form to your package and send to registrar via SIS upload.Instructions from the registrar to upload Graduation Materials.Available Minors in Chemistry (beginning in Fall 2022)1. Chemistry of LifeFor students with an interest in the health sciences and bioorganic chemistry, the “Chemistry of Life” track offers an opportunity to delve deeper into the Chemistry that underpins the processes of life.Foundation: Chem 1/11 and 2/12 or equiv.Core: Chem 51 (Organic Chemistry I) & Chem 171 (Biochemistry I)Elective: Select any two of the following – Chem 52 (Organic II), Chem 172 (Biochemistry II), Chem 43 (Bioanalytical Chemistry), Chem 176 (Chemical Biology), ChBE 165 (Biomolecular Engineering and Design), ChBE 159 (Synthetic Biology), Chem 164* (Bioinorganic Chemistry), Chem 157* (Molecular Medicine)*please note that Chem 164 and Chem 157 may require additional prerequisites.Chemistry of Life Minor Concentration Checklist2. Chemical Mechanism & StructureFor students with an interest in mechanistic organic chemistry, pharmaceutical & process chemistry, and synthetic chemistry, the “Chemical Mechanism & Structure” track offers a focus on molecular structure, organic synthesis, and organic reaction mechanism.Foundation: Chem 1/11 and 2/12 or equiv.Core: Chem 51 (Organic Chemistry I) & Chem 52 (Organic Chemistry II)Elective: Select any two of the following – Chem 150 (Mechanistic Reasoning in Organic Chemistry), Chem 152 (Advanced Organic Synthesis), Chem 151 (Physical Organic Chemistry), Chem 155 (Organic Spectroscopy), Chem 157 (Molecular Medicine), or either Chem 61 (Inorganic Chemistry) or Chem 161 (Advanced Inorganic).Chemical Mechanism & Structure Minor Concentration Checklist3. Materials & Surface ChemistryFor students with an interest in catalysis, nanoscience, and materials chemistry, the "Materials & Surface Chemistry" track offers an opportunity to study principles of the physical and structural basis of modern industrial processes and materials science.Foundation: Chem 1/11 and 2/12 or equiv.Core: Chem 31 (Physical Chemistry I) & Chem 32 (Physical Chemistry II)Elective: Select any two of the following – either Chem 61 (Inorganic Chemistry) or Chem 161 (Advanced Inorganic), Chem 136 (Spectroscopy and Molecular Structure), 138 (Atomic Scale Structure & Properties of Surfaces), Chem 139 (Chemistry of Complex Interfaces, Catalysts, and Devices), ChBE 121 (Principles of Polymerization), ChBE 122 (Physical Chemistry of Polymers)Materials & Surface Chemistry Minor Concentration Checklist4. Computational ChemistryFor students with a dual interest in physical chemistry and computer science, the "Computational Chemistry" track offers an opportunity to delve deeper into the state-of-the-art computational methods for the study of molecular and materials structure, properties, and reactivity.Foundation: Chem 1/11 and 2/12 or equiv.Core: Chem 31 (Physical Chemistry I) & Chem 32 (Physical Chemistry II)Elective: Select any two of the following, at least one of which must be a computer or data science course* – Chem 131 (Chemical Thermodynamics), Chem 133 (Quantum Mechanics), Chem 132 (Chemical Kinetics and Dynamics), Chem 134 (Statistical Mechanics), CS 10 (Computer Science for All), CS 11 (Introduction to Computer Science), CS 30 (Programming for Data Science), CS 135 (Introduction to Machine Learning).*please note that CS 30 and CS 135 may require additional prerequisites.Computational Chemistry Minor Concentration Checklist5. Biophysical ChemistryFor students with a dual interest in physical chemistry and biology, the "Biophysical Chemistry" track offers a focus on the physical properties of biomolecules at a molecular and structural level.Foundation: Chem 1/11 and 2/12 or equiv.Core: Chem 31 (Physical Chemistry I) & Chem 51 (Organic Chemistry I)Elective: Select any two of the following – Chem 131 (Chemical Thermodynamics), Chem 135 (Biophysical Chemistry), Chem 171 (Biochemistry I)Biophysical Chemistry Minor Concentration Checklist6. Chemical PhysicsFor students with an interest in physics and chemistry, the "Chemical Physics" track combines coursework in Chemistry with a theoretical physics-oriented focus.Foundation: Chem 1/11 and 2/12 or equiv.Core: Chem 31 (Physical Chemistry I) & Phys 13 (Introduction to Modern Physics)Elective: Select two of the following – either Chem 32 (Physical Chemistry II) or Phys 61 (Quantum Theory), and either Chem 51 (Organic Chemistry I) or either Chem 61 (Inorganic Chemistry) or Chem 161 (Advanced Inorganic)Chemical Physics Minor Concentration Checklist7. Analytical ChemistryFor students with an interest in instrumentation and analysis, the "Analytical Chemistry" track provides a focus on the separation, identification, and quantification of molecules.Foundation: Chem 1/11 and 2/12 or equiv.Core: Chem 42 or 43; Chem 141 (Instrumental Analysis),Elective: Select any two of the following – Chem 142 (Advanced Analytical Methods), Chem 144 (Spectroscopic Methods of Analysis), Chem 145 (Separation Science), Bio 132 (Biostatistics) or Math 21 (Statistics).Analytical Chemistry Minor Concentration Checklist8. General ChemistryFor students seeking broad training in chemistry, the "General Chemistry" track offers an opportunity to survey coursework across all sub-disciplines and does not require upper-level courses.Foundation: Chem 1/11 and 2/12 or equiv.Core + Elective: Select any four of the following – Chem 51 (Organic Chemistry I), Chem 52 (Organic Chemistry II), Chem 31 (Physical Chemistry I), Chem 32 (Physical Chemistry II), Chem 42 (Analytical Chemistry) or Chem 43 (Bioanalytical Chemistry), either Chem 61 (Inorganic Chemistry) or Chem 161 (Advanced Inorganic), Chem 171 (Biochemistry 1).General Chemistry Minor Concentration Checklist'
