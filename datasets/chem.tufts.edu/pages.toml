["https://chem.tufts.edu/people/undergraduate-student-ambassadors"]
title = "Undergraduate Student Ambassadors | Department of Chemistry"
full_description = "Undergraduate Student Ambassadors Introductory coursework in Chemistry typically involves large lecture courses where students can feel disconnected from each other, their instructors, and the Chemistry department at large. To foster a spirit of community and collaboration, the Chemistry Ambassadors program seeks to encourage connections between undergraduates (especially those in our large introductory courses) by engaging our current Majors and Minors as a centerpiece of a supportive and inclusive department culture. Our Chemistry Ambassadors are a dedicated group of students—all with declared Majors or Minors in the Chemistry Department—who are eager to help their peers navigate the Chemistry program, including course selection, choice of Major or Minor, and opportunities for independent research.The Chemistry Ambassadors program is meant to supplement, not replace, the formal advising system for Tufts undergraduates. So, to make the most of your Chemistry-related Major or Minor, and your experience at Tufts, we hope you’ll use this program to establish connections with students in department of Chemistry in addition to your Faculty Academic Advisor.In Fall 2024, our Chemistry Ambassadors will be available to meet with you during open office hours on Mondays from 12:00 – 1:00 PM (Nikita and Tea) in Pearson 112, Tuesdays from 5:00 – 6:00 PM (Carly and James) in Pearson 307, and Thursdays from 9:00 - 10:00 AM in Pearson 304 (Rebecca and Jonathan).If you prefer to reach the ambassadors by email for any questions about Chemistry Majors or Minors, please contact us at chemambassadors@tufts.edu. Nikita BhatHi! My name is Nikita! I am a junior from Bedford, New Hampshire majoring in ACS-certified chemistry and biotechnology. On campus, I stay busy with the club gymnastics team (go TGT!), writing for the Undergraduate Breakthrough Journal, and being part of the Kumar research group. I also like hiking, crocheting, and watching my favorite shows on repeat. I am really interested in organic and medicinal chemistry, and I hope to work in the pharmaceutical industry in the future! Carly GrossmanHi! I’m Carly, and I’m a Tufts junior from Brookline, MA. I started at Tufts as a chemical engineering major but eventually switched to chemistry, math, and physics. I realized I was more excited about exploring the fundamental principles of the sciences before expanding to their applications. I’m not sure yet what I want to do after Tufts, but I’m considering grad programs focusing on Chemistry and Physics. I’ve found it really helpful to chat with other students about questions I’ve had as I’ve sorted out my personal path at Tufts and beyond. I’d love to help anyone else who’s looking to connect. James KimHello! My name is James Kim, and I am a senior majoring in Biology with minors in Chemistry and Entrepreneurship. After graduation, I hope to attend medical school. I am originally from Los Angeles, CA but I currently live in Lexington, MA. I chose to minor in Chemistry because I enjoy the challenge of problem-solving. It's a discipline that requires not just knowing equations and mechanisms but also understanding when and how to apply them. Feel free to reach out if you want to learn more! I’m excited to connect with you all. Chamomile KovacikHi Everyone! My name is Chamomile, or Tea if you're in a rush, and I use they/them pronouns. I'm a Boston native and a senior majoring in ACS Chemistry. I've been in the chem department since my first year, working for Professor Luke Davis as a research assistant. I've taken Gen Chem, Orgo, Pchem, and a whole bunch of other courses and am planning to get a PhD in Pchem. I'd be more than happy to answer any questions you have about the ACS major, doing research at Tufts, or even just to give you a hand with homework! Rebecca Rios-LazoHi! My name is Rebecca Rios-Lazo, I'm a Junior majoring in Chemistry here at Tufts originally from Los Angeles, CA! I have a huge passion for science and chemistry, and I plan to look into grad schools after I graduate. When I'm not studying for exams or working on assignments, I'm usually binging my favorite tv shows, reading books, or listening to music. I’m very excited to be a Chemistry Ambassador, and I look forward to meeting potential new Chemistry students and discussing any questions about the major/minor with those interested! Jonathan SamuelHi, I’m Jonathan Samuel. I'm in my third year at Tufts, as a biochemistry major. I was born and raised in Cambridge, Massachusetts. I participate in the Tufts chapter of ACS, and our Ethiopian and Eritrean Student Association (EESA). I enjoyed organic chemistry due to its ability to synthesize compounds and factors that affect various industries. Learning laboratory techniques to solve complex questions drives me to explore chemistry. Although I’m not fully decided, I plan to continue my education after graduation. I’m willing to assist with any questions about the biochemistry major or academic questions in general."
