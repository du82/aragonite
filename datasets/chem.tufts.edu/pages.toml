title = "Research | Department of Chemistry"
full_description = "Research Molecular Light Absorbers and Emitters We explore high-spin complexes of first-row transition metals, metal-metal bonded dimers and clusters, and ligand-to-ligand or ligand-to-metal charge transfer complexes as more sustainable molecules for light absorption and emission. Materials for Thin-Film Photovoltaics We search for earth-abundant materials for thin-film photovoltaics, including light-absorbers, electron-transport layers, and hole-transport layers. We study film formation, band alignment, and defect tolerance in metal oxides and sulfides. Volatile Molecular Reducing Agents We develop new volatile molecules enabling chemical vapor deposition of metals important in conventional and quantum circuits, such as Co, Ni, Ti, Al, and Nb."
