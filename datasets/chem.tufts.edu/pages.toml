title = "About the Thomas Lab | Department of Chemistry"
full_description = "About the Thomas Lab Our group applies the philosophy of physical organic chemistry to organic materials, in the forms of polymers, crystals and surfaces. Specifically, we investigate new materials that show macroscopic changes in properties upon exposure to external stimuli. Our main focus has been new materials that respond to light, which has a unique combination of characteristics: i) easy control over where light goes and when it goes there (spatiotemporal control), ii) easy control over intensity and energy, and iii) the ability to pass through many solid materials that traditional chemical reagents cannot."
