analysis.Prerequisites: Quantitative Analysis (Chem 42), and preferably junior/senior class standing. A two-semester commitment is required. Summer research positions may also be available. Deadlines: Rolling deadline. Process: After application review, Prof. Kounaves will meet with potential candidates to learn more about their interests. Positions available: One for Fall 2024 and three for Fall 2025Learn more about the Kounaves Lab Kritzer LabThe Kritzer lab uses new molecules to solve vital chemical and biomedical problems. We discover new molecules and apply them by combining approaches from organic synthesis, biochemistry, biophysics, computational design, genetics, and cell biology -- and by inventing new approaches as we go along! In one series of projects, we design innovative molecules to block disease-associated proteins, often in ways traditional "drug-like" molecules cannot. In another project, we are also exploring new chemistries that increase the potency and usefulness of bioactive peptides. Additional projects focus on inventing new methods for measuring cell penetration, which is the most difficult roadblock for many emerging therapeutics including peptide therapeutics, protein therapeutics, RNA therapeutics, and gene editing.Prerequisites: None. Deadlines: Nov. 15th for positions beginning in January; March 15th for positions beginning in May. Process: After application review, Prof. Kritzer and Kritzer lab members will interview potential candidates to learn more about their interests. Positions available: 1 (Spring 2025) and 2 (Summer 2025)Learn more about the Kritzer Lab Kumar LabOur research program has broad, expansive interests at the intersection of chemistry, biology, and medicine. Current problems of interest to the laboratory range from understanding the origin of life to the design of therapeutics for a wide range of indications. Undergraduate (UG) students in the group work closely with Prof. Kumar, senior UG and graduate students, postdoctoral researchers, and staff scientists. UG researchers are expected to spend ~15 hrs/week in the lab and should have contiguous blocks of time available (5+ hrs twice a week). Our program uses tools of molecular design; organic synthesis including peptides; pharmacology; enzymology; bacterial and mammalian cell culture/biology; biophysical and bioanalytical methods, and materials science. UG researchers should commit to at least two semesters of research for it to be a meaningful experience; most join in their sophomore year and stay for the duration of their time at Tufts. Prerequisites: Chem 51 (waived if you have computational interests only). Deadlines: Rolling deadline. Process: Apply as early as you can, even as you are enrolled in Chem 51. After application review, Prof. Kumar and members of the lab will meet with you to discuss mutual research interests. We welcome everyone including pre-health science students! Positions available: Up to 2Learn more about the Kumar Lab Lin LabThe YSL lab uses computational chemistry to study and predict the structures and functions of biomolecules. Current projects include using molecular dynamics simulation and machine learning to predict structures and other properties of peptides, designing cyclic peptides that can target specific protein surfaces, designing cyclic peptides with high membrane permeability and other desired properties, and developing automated analysis to process simulation data.Prerequisites: No formal courses are required, but students should be interested in chemistry, physics, biology, and computer science. Additionally, students must attend our group meetings at least three times before applying to the YSL Lab (please email Prof. Lin to find out the time and location). Deadlines: February 15th for positions beginning in June (summer) or September (fall semester); October 15th for positions beginning in January (spring semester). Process: After application review, Prof. Lin and the YSL Lab members will interview potential candidates to learn more about their interests. Positions available: 0Learn more about the Lin Lab Mace LabResearch in the Mace lab targets many aspects of measurement science: process improvement, assay development, device design and prototyping, usability and user experience, and testing using real sample matrices. With a focus on global health and diagnostics, members of the Mace lab are introduced to projects spanning infectious disease diagnostics, patient-centric microsampling, and laboratory medicine. While the primary method we use to approach challenges is paper-based microfluidics, we use our creativity, multidisciplinary backgrounds, and team of industry, clinical, and international collaborators to get the job done. Undergraduate researchers will work closely with a senior member of the lab and are expected to coordinate their schedules with their mentor. Students are expected to work roughly 10–15 hours per week. Prerequisites: None. Deadlines: Nov. 15th for positions beginning in January; April 15th for positions beginning in September. Paid summer opportunities are generally available only to those students who already have experience in the group. Process: After application review, Prof. Mace and members of the Mace Lab will interview potential candidates to learn more about their interests and fit for available projects. Positions available: 0 (2 new positions are anticipated beginning in Spring 2024)Learn more about the Mace Lab Scheck LabResearch in the Scheck lab uses chemistry to learn more about biological systems. We focus on developing new chemical methods that can be used to study protein post-translational modifications, especially those that have been difficult to study using traditional tools. Undergraduate students in my group work closely with me, along with my graduate students and/or post-doctoral researchers. Undergraduate researchers are expected to work roughly 10-15 hours per week, and must be available to come into lab on at least two consecutive days per week. Projects in the lab vary, but in general students can expect to gain experience in several of the following areas: chemical synthesis, peptide synthesis, protein expression and purification, bacterial and mammalian cell culture, protein analysis methods, on-bead peptide libraries, and mass spectrometry and proteomic analysis. Prerequisites: Chem 51 (completed) and Chem 171 (completed or concurrent with the first semester of research). Deadlines: Nov. 15th for positions beginning in January; April 15th for positions beginning in September. Process: After application review, Prof. Scheck and her lab members will interview potential candidates to learn more about their interests. Positions available: 1-2 Learn more about the Scheck Lab Shultz LabResearch in the Shultz lab focuses on the development of catalysts for various energy applications. The fundamental catalyst is ultranano titania: (TiO2)<200. With these few formula units, the particles self as'''
