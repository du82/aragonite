full_description = "Transfer of Credit All transfer of credit petitions should be submitted via the online web portal. Please contact Dr. Sergiy Kryatov to determine acceptability of the course content for the Chemistry Department. The Registrar's office will determine the amount of credit you will receive. The Department of Chemistry strongly recommends that students obtain prior approval before taking courses for transfer of credit. Lab courses must be taken in person (online chemistry lab course are not eligible for transfer of credit). Also, we recommend that lecture courses are taken in person, since online teaching and learning are generally less effective. Please do not email the Department Chair with transfer of credit requests."
