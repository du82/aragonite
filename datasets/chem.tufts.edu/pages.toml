["https://chem.tufts.edu/node/1491"]
title = "Joshua Kritzer | Department of Chemistry"
full_description = "Research Website Full Profile Career Highlights / Publications Research Professional Activities Courses / Teaching Activities Joshua Kritzer Professor, Chemistry Graduate Biomedical Sciences Member, Molecular Microbiology Program Graduate Biomedical Sciences Member, Genetics, Molecular and Cellular Biology (617) 627-0451 joshua.kritzer@tufts.edu 62 Talbot Avenue Full Profile (facultyprofiles.tufts.edu) Research Website Full Profile Career Highlights / Publications Research Professional Activities Courses / Teaching Activities Research/Areas of Interest Bioorganic, Biophysical, & Chemical Biology. Peptides and their mimetics can target protein surfaces in ways small molecules rarely do, making peptide libraries attractive for screening for nontraditional modes of action. The Kritzer research group takes advantage of peptide and peptidomimetic libraries to bypass many of the disadvantages of small molecule screening. They also explore how modifications such as substitution of peptide bonds with isosteres, amide N-methylation, and head-to-tail cyclization affect the activities, specificities, and bioavailabilities of functional peptides. By combining powerful techniques from organic synthesis, biophysical chemistry, molecular biology and genetics, they are developing new molecules and new strategies to attack cancer, inflammation, and autoimmune diseases. Education BE Chemical Engineering, Cooper Union, New York, United States, 2000PhD Biophysical Chemistry, Yale University, New Haven, United States, 2005"
