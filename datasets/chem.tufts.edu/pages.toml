title = "People | Department of Chemistry"
full_description = "People Principal Investigator Charles Sykes Sykes Lab Tufts University 62 Talbot Avenue Medford, MA 02155 Office: 617-627-3773 Faculty Profile Email Dr. Sykes Postdoctoral Researchers Dr. Dennis Meier Dennis completed his Bachelor's degree at the University of Ulm (Germany) and his Master's degree and PhD at the Technical University of Munich (Germany). His PhD thesis focused on molecular self-assembly in ultra-high vacuum. He has now begun a postdoctoral research position in the Sykes group, concentrating on single- and dual-atom catalysis. Graduate Students Cole Easton, 5th YearCole graduated from Middlebury College with a BA in Chemistry. He is investigating silver based trimetallic alloys.Email Avery Daniels, 5th YearAvery received a double major in Chemistry and Physics from Belmont University in Nashville, TN. He is currently working on the curved crystal and radiation projects!Email Elizabeth Happel, 5th YearElizabeth graduated from Salve Regina University with a BS in Chemistry. She is working with the Infinity STM to study NiAg alloys.Email Vinita Lal, 4th YearVinita received her MS in Atmospheric Sciences from Texas A&M University. She is currently studying Cu based SAAs using TPD.Email Nipun Senevirathna, 3rd YearNipun graduated from University of Kelaniya, Sri Lanka with a BSc (Hons) in Chemistry. He is currently studying Ag based trimetallic systems with TPD.Email Nima Rajabi, 3rd YearNima received his BA in chemistry from the University of Qom in Iran. He is currently using the LT STM to spectroscopically investigate Ag based SAA systems.Email Undergraduate Students Max Penzer Omar Bou Aram"
