["https://chem.tufts.edu/kritzer-lab/news"]
title = "News | Department of Chemistry"
full_description = "News January 2025The Kritzer Lab welcomes new undergraduate researcher Ava!Congrats to Allie, Tom, Hawley, Bennett, and Joanet on their publication “Exploring Arylidene-Indolinone Ligands of Autophagy Proteins LC3B and GABARAP” in ACS Medicinal Chemistry Letters! This was a team effort focused on some extremely tricky compounds, but the end result really moved the field forward. A collaboration with the Weiergraber group! December 2024The Kritzer Lab celebrated a year of accomplishments and growth at our holiday party! November 2024Welcome to postdoctoral researcher Dr. Aritra Nath Chattopadhyay!The Kritzer Lab was awarded a Tufts Launchpad Accelerator grant to support their work on turn-on fluorescence systems for biology and drug development. October 2024Congrats to Bryan and Ben on their article in Chemical Science describing the new BenzoTag system for no-wash, turn-on fluorescence in live cells! Imani McDonald gave a talk on Development of GABARAP-specific stapled and N-methylated peptide modulators of autophagy at the 13th annual Boston Symposium on Organic and Bioorganic Chemistry. Imani McDonald and Amarachi Osuji presented their research at NOBCChE’s 51st annual meeting in Orlando! Joshua started a 3-year tenure as chair of the Chemical Biology and Probes study section at National Institutes of Health. For more about the NIH review process, including the new simplified peer review framework, visit the Center for Scientific Review website. September 2024It takes a village to figure out the molecular mechanisms of cancer. In highly collaborative work, we supplied Hawley Brown’s selective GABARAP-inhibiting stapled peptides to help Daniel Krummel, Soma Sengupta, and their team at UNC Chapel Hill decipher how activation of the GABA(A) receptor can promote radiosensitivity in lung cancer. The Kritzer Lab celebrated its now-annual AppleFest! We picked apples, played games, and laughed together on a beautiful fall day.Welcome to new graduate student Megan, new undergraduate researcher Anna, and visiting student Haruki! August 2024Congrats to Nefeli for her review article “Recent advances in methods for quantifying the cell penetration of macromolecules” published in Current Opinion in Chemical Biology! It covers advances made in the last few years in methods for measuring delivery of peptide, protein, and oligonucleotide drugs. July 2024The Kritzer Lab celebrated its annual Lake Day on a beautiful summer day. It is exciting to work with such an amazing group of scientists, and it is wonderful to relax and have fun with an equally amazing group of humans! June 2024Welcome to new undergraduate researcher Nick! May 2024Congrats to Nefeli for her paper “Comparing cell penetration of biotherapeutics across human cell lines” in ACS Chemical Biology! Dr. Batistatou applied CAPA to measure cell penetration for a panel of peptide and oligonucleotide therapeutics in seven cultured cell lines, and in primary cells. That’s a cartoon of Nefeli on the cover! The Kritzer Lab was awarded a Sanofi iAward grant to fund Amarachi’s project designing peptide drugs for Alzheimer’s disease and other tauopathies. Congrats to Kritzer Lab doctoral graduates Jing, Nefeli, and Francini (now Dr. Wang, Dr. Batistatou, and Dr. Fonseca-Lopez, respectively) and bachelor’s graduates Clara and Joanet! We are very proud of you and we are excited to watch you grow into new endeavors. Congrats to Francini for being selected as the Student Speaker at the doctoral hooding ceremony, and congrats to Nefeli for winning the Tufts Graduate School of Arts and Sciences Outstanding Academic Scholarship Award for her academic and research achievements! April 2024The Kritzer Lab held its annual retreat! We described our lives and careers 20 years from now, and we talked about how to live our lives today to stay true to those goals, dreams, and values. We brought favorite quotes to enlighten and amuse each other. And we enjoyed amazing food, ice cream, and games at Kimball Farm! Congratulations to Nefeli for defending her PhD thesis! March 2024Maria was awarded the Carl Storm Underrepresented Minority Fellowship to attend the 2023 Gordon Research Conference on Autophagy in Stress, Development and Disease. Congrats Maria! February 2024The Kritzer lab is on a roll, with over 10 manuscripts published or in submission in the last year. Go Team Kritzer! January 2024Congrats to Nefeli for her paper “Cell penetration of oxadiazole-containing macrocycles” just published in RSC Chemical Biology! The paper describes an exciting collaboration with the Yudin Lab at University of Toronto examining how oxadiazole groups within small cyclic peptides affect cell penetration. December 2023The Kritzer lab celebrated an amazing year with food, laughter, and holiday cheer! Congratulations to Dr. Jing Wang for defending her PhD thesis! Congrats to Bryan for his paper in ChemComm “Engineered fluorogenic HaloTag ligands for turn-on labelling in live cells”! The paper describes Bryan’s dye engineering campaign to produce turn-on fluorescent dyes with improved properties for labeling live mammalian cells. November 2023Welcome to new graduate student Madison!Congrats to Francini for her new paper in the Journal of Chemical Information & Modeling describing the computational design and real-world evaluation of cyclic peptides that bind Keap1! This was a collaboration with Francini’s co-PI Prof. Yu-Shan Lin and crystallographer Dr. Marcus Hartmann. October 2023Congrats to Maria for winning a poster prize at the Charlton Poster Competition! September 2023 The Kritzer Lab had its first-ever AppleFest! We picked apples, played games, and enjoyed the beautiful sights and tastes of fall in New England. Welcome to new undergraduate researcher Estafania Morales! June 2023 Congrats to Jing Wang for being awarded a Poster Prize at the 2023 Northeast Regional Meeting of the American Chemical Society! Welcome to new undergraduate researchers Bennett and Tom! And, congratulations to Bennett for being named a 2023 Laidlaw Scholar! Congrats to Dr. Francini Fonseca-Lopez for defending her PhD thesis! Congrats to Kirsten for her new paper in ChemComm describing artificial nucleotides with boronic acids that enhance cytosolic penetration for antisense oligonucleotides! A collaboration with the Islam group at University of Pittsburgh. May 2023Congrats to Amarachi, Imani, and Maria for passing their second-year Research Topics and Qualifying Exams!March 2023Welcome to new undergraduate researcher Clara! February 2023 Congrats to Nefeli for her new paper in ChemBioChem describing how length, base composition, and secondary structure affect cell penetration for drug-like oligonucleotides! The Kritzer Lab has been awarded a Maximizing Investigator's Research Award from the NIH! This 5-year, $3M award will fund all of the basic drug discovery science in the lab. January 2023 Watch Nefeli explain one of her research projects, part of the Oligonucleotide Therapeutics Society's Spotlight Series! December 2022 The Kritzer Lab holiday party was full of laughter and light. We are so lucky to have such a great community of scientists (and kiddos and doggos)! November 2022 The Kritzer Lab celebrates new members and November birthdays with Brazilian food! Welcome to new graduate student Ben! Congrats to Francini and Bryan! They both won poster awards at the Chemistry and Biology of Peptides GRC! October 2022 Congrats to Nefeli for her poster award at the 2022 Oligonucleotide Therapeutics Society meeting! Welcome to new MD/PhD student Maria! September 2022 Welcome to new undergraduate researcher Joanet! August 2022 Congrats to Hawley, Mia, Nefeli, and Tiffany for their new paper in JACS describing stapled peptides that inhibit the autophagy protein GABARAP! A collaboration with the Weiergräber group at Forschungszentrum Jülich and Zhen Lu in the Bast Laboratory at MD Anderson Cancer Center! Congrats to undergraduate researcher Mia Chung for her invited talk at the Beckman Symposium! July 2022 The Kritzer Lab held our annual summer Lake Day. We have an incredible group of people who love to work, learn, grow, and play together! June 2022 Welcome to new Kritzer Lab postdoctoral researcher Allie! May 2022 Congrats to undergraduate researcher and Beckman Scholar Mia for her undergraduate thesis defense! February 2022 The Kritzer Lab held a belated but very happy holiday party! With lots of gifts, games, and laughter, it felt amazing to spend some social time together! January 2022 Congrats to Kirsten, Nefeli, Livia, and Jiaxing on their new paper in ACS Chemical Biology describing how to measure cytosolic and nuclear penetration for oligonucleotide therapeutics! A collaboration with industrial groups at Eli Lilly and Co. and Wave Life Sciences! November 2021 Welcome to new Kritzer Lab graduate students Amarachi and Imani! The Kritzer Lab focusing on three important S's: Sushi, Science, and Soba noodles! October 2021 Joshua was quoted in a Tufts Now article on the Tufts CELT Equity and Inclusion Fellows workshop, which pushed professors to find ways to combat systemic racism in undergraduate classrooms. September 2021 The Kritzer Lab held our annual Retreat! The focus of the day was why we do what we do. We built a map of all the projects in the lab and then brainstormed new directions. We each brought meaningful quotes and we used them to discuss our motivations in science and in life. We ate. We drank. We bowled. We laughed. Congrats to Jen, Bryan, Charles, Kirsten, and Rob on their new paper in JACS describing novel staples and the unusual beta-hairpins they can help stabilize! Brief intro here. Welcome to new undergraduate researcher Emma! August 2021 Congrats to Dr. Kirsten Deprey for defending her thesis! July 2021 Kritzer Lab Lake day is back! Kayaks were paddled, games were played, and laughs were shared. Congrats to Kaley on her new paper in ACS Chemical Biology describing a method for measuring and comparing cell penetration for large combinatorial libraries! June 2021 Welcome to new undergraduate researcher Adam! May 2021 Congrats to Dr. Kaley Mientkiewicz for defending her thesis! Congrats to Tiffany Tsang for completing her Master's degree! Congrats to undergraduate researchers Cassie Cancemi, Ravi Bajpai, and Cameron Cummings for completing their Senior Honors Theses! April 2021 Congrats to Kirsten for her paper describing the solution to a mystery: HaloTag forms an intramolecular disulfide, now online at Bioconjuate Chemistry! March 2021 Congrats to undergrad Mia for being named a 2021-2022 Beckman Scholar! Congrats to postdoc Bryan for earning an F32 postdoctoral fellowship! February 2021 Congrats to Nefeli and Jing for their contributions to a collaborative paper led by the Millward Lab on autophagy-inhibiting peptides! November 2020 Welcome to new Kritzer lab graduate students Maple, Tien and Zhengwen! October 2020 Congrats to Rob, Livia, Hawley, Jen, and Yang! Their article was selected for the cover of the October 1 issue of ChemBioChem! August 2020 Congrats to Kirsten on her collaborative project with the Garner lab, just published in European Journal of Medicinal Chemistry. One of many collaborations with academic scientists and drug developers!! Congrats to Kirsten and Nefeli on their critical review on assays for measuring cell penetration of RNA therapeutics , just published in Nucleic Acids Research! The Kritzer lab receives an NSF grant to explore Peptide Stapling with Conformationally Constrained Building Blocks! June 2020 The Kritzer lab hires Hawley Brown as a Research Technician! May 2020 Congrats to Rob, Livia, Hawley, Jen, and Yang for their new paper describing stapled peptide LC3 inhibitors, now out in ChemBioChem! Congrats to Rob, Livia, Jing, and our collaborators in the Frank Group at Dana-Farber for their paper on STAT3 inhibitors in Bioorganic and Medicinal Chemistry! April 2020 Congrats to Kirsten, whose collaborative effort with the Craik Group and Dr. Conan Wang was just published in ACS Chemical Biology. The first of many collaborative CAPA papers in the works! March 2020 Congrats to Kritzer lab undergraduate researcher Cassandra Cancemi, who was just awarded a 2020 Goldwater Scholarship! Go Cassie!!! Congrats to MD/PhD student Dr. Robert Cerulli, on completing your thesis work and on becoming a new father!! Rob's unique online thesis defense was profiled by Tufts Now, and the after-party had a few surprises! January 2020 Rob's review article on phosphotyrosine isosteres made the front cover of the January 28 issue of Organic and Biomolecular Chemistry! Our Chloroalkane Penetration Assay (CAPA), which helps measure how much of a drug molecule gets into the cytoplasm of living cells, continues to find applications in industry and academia! See recent work by Stephen Frye at UNC using CAPA to profile cell penetration of degrader molecules, and a recent profile of this CAPA application at In the Pipeline! December 2019 K-lab holiday party celebrates all our accomplishments in 2019, and our exciting plans for 2020! Here are most of us, assembled for mandatory merriment: And here we are with lab alumni!!! Kritzer Lab members during a 2019 holiday event November 2019 Congrats to Rob for his review article Phosphotyrosine Isosteres: Past, Present and Future, just published in Organic and Biomolecular Chemistry. Welcome to new Kritzer lab graduate students Nefeli and Tiffany! September 2019 Welcome to new postdoctoral researcher Dr. Poulami Majumder!! August 2019 End-of-summer lab outing to celebrate our accomplishments, and to wish Jen, Ashleigh, Livia, Lauren, and Eriko the best of luck as they continue their amazing careers! July 2019 Our annual K-Lab Lake Day was a great success! May 2019 Congrats to Livia, Santosh and Kamlesh for their new paper in ACS Infectious Diseases on the discovery of small-molecule inhibitors of a bacterial virulence factor! A collaboration with the Murphy Lab at U. Buffalo Jacobs School of Medicine. April 2019 Congrats to Hawley for being named a Tufts Summer Scholar! And Congrats to Cassie and Ravi for both being named Laidlaw Scholars!! Congrats to Kirsten for her excellent review on methods for measuring cytosolic localization of biotherapeutics. A collaboration with the Pluckthun group! And congrats to Rob for a thoughtful Viewpoint article on the engineering of multidomain antibodies against flu! March 2019 The Kritzer lab has their first-ever retreat! We talked about our current and future projects, what makes us passionate about science, and what is important to us outside of lab. And we had a blast questing together at Boda Borg! January 2019 Congrats to Ashleigh and co-first author from the Lin Lab, Jiayuan, for their just-accepted paper in Biophysical Journal. The latest in our ongoing collaboration with the Lin Lab! Welcome to new undergraduate researcher Cameron! December 2018 The K-lab celebrates the holidays. 2018 was awesome and 2019 will be e"
