["https://chem.tufts.edu/prospective-students/applying-graduate-program"]
title = "Applying to the Graduate Program | Department of Chemistry"
full_description = "Applying to the Graduate Program Tufts Chemistry offers MS and PhD degree programs in Chemistry, Chemistry-Biotechnology, and Chemical Physics. Successful applicants will have an undergraduate degree in chemistry, or in a related subject with appropriate chemistry courses. There are no specific requirements for grade point average, and no GRE or other test scores are currently required. Please refer to the Graduate Admissions website for details about the application, including deadlines. Applications require: Transcripts from all undergraduate and graduate schools attended. Three letters of recommendation. For international students who did not earn an undergraduate degree at an English-speaking institution, a score for the written Test of English as a Foreign Language TOEFL or similar English language exam. Requirements and minimum scores can be found at the Graduate School website. No general GRE or subject GRE scores are required. All applications for admissions to the Chemistry Graduate program must use the Office of Graduate Admissions online application. The Department of Chemistry cannot review any application materials sent directly to the department. For more information on applying to Tufts’ Graduate School, including information on financial aid, please consult the Graduate Admissions website. Director of Graduate Studies Joshua Kritzer Professor Bioorganic, Biophysical, & Chemical Biology. Peptides and their mimetics can target protein surfaces in ways small molecules rarely do, making peptide libraries attractive for screening for nontraditional modes of action. The Kritzer research group takes advantage of peptide and peptidomimetic libraries to bypass many of the disadvantages of small molecule screening. They also explore how modifications such as substitution of peptide bonds with isosteres, amide N-methylation, and head-to-tail cyclization affect the activities, specificities, and bioavailabilities of functional peptides. By combining powerful techniques from organic synthesis, biophysical chemistry, molecular biology and genetics, they are developing new molecules and new strategies to attack cancer, inflammation, and autoimmune diseases. Director of Masters Studies Charlie Mace Associate Professor Bioanalytical and Materials Chemistry. To solve outstanding problems in global health, the Mace Lab applies a multidisciplinary approach combining aspects of analytical chemistry, materials science, and engineering. The primary goal of the Mace lab is to develop low cost, patient-centric technologies that can improve access to healthcare. To achieve this, the Mace Lab designs devices that improve the self-collection of blood and enable the diagnosis of diseases in resource-limited settings, and they are exploring ways the methods that are developed in the lab can used by others. Their main techniques leverage the properties of paper and other porous materials to integrate function into simple, affordable devices. Unique to laboratories in Chemistry departments, his group specializes in handling human blood and saliva. Technologies developed in the Mace lab have made the leap to clinical sites in Africa, South America, and the US, owing to their network of clinical, academic, and industry collaborators. The Mace Lab has broad expertise in assay development and device prototyping, which they apply to evaluating the efficacy of candidate therapeutics, performing separations that lead to new measurements, and making field-deployable kits for point-of-care testing. They have additional expertise in instrument development, phase separation in systems of polymers, and microfluidics. Office of Graduate Admissions Request Information Apply Now Application Deadlines"
year_published = 2025
clearnet = "https://chem.tufts.edu/prospective-students/applying-graduate-program"
