["https://chem.tufts.edu/thomas-lab/news"]
title = "News | Department of Chemistry"
full_description = 'News July 2022: Our paper "Tuning stiffness of free-standing hydrogen-bonded LbL films with Fe3+ coordination” has been accepted for publication in ACS Applied Polymer Materials. Check back soon for a link! June 2022: Congratulations to our PhD student Elisa Guzman, for winning an Outstanding Poster at the 2022 Crystal Engineering GRC! June 2022: Our paper "Crystal Engineering of Heterocyclic Arylene(ethynylene) Oligomers through Programmed Aromatic Stacking” has been published in Journal of Materials Chemistry C. January 2022: Our invited Highlight "Substituent Effect in Pyridiunium Alkynylanthracenes on their Performance as Photosensitizers for Photodynamic Therapy” has been published in Photochemistry and Photobiology. November 2021: Welcome to our new PhD student, Manny Pina! October 2021: Congratulations to Dr. Will Mullin, who successfully defended his PhD thesis! Good luck in your new position at Jordi Labs! July 2021: Our review article “Bridging the Void: Halogen Bonding and Aromatic Interactions to Program Luminescence and Electronic Properties of Conjugated Materials in the Solid State” is accepted for publication in Chemistry of Materials. May 2021: Our invited review article "Optimizing the Self-Assembly of Conjugated Polymers and Small Molecules Through Structurally Programmed Non-Covalent Control” was accepted for publication in Journal of Polymer Science. March 2021: Congratulations to Elisa Guzman, who was awarded an NSF Graduate Research Fellowship! February 2021: Our paper titled “Red-Emitting, Acene-Doped Conjugated Polymer Nanoparticles That Respond Ratiometrically to Photogenerated 1O2” is published in ACS Applied Materials and Interfaces. November 2020: Our review titled “Acenes Beyond Organic Electronics: Sensing of Singlet Oxygen and Stimuli-Responsive Materials” is published in Organic & Biomolecular Chemistry. September 2020: Our paper titled "Resistance to Unwanted Photooxidation of Multi-Acene Molecules” has been accepted for publication in The Journal of Organic Chemistry. June 2020: We have been granted a US Patent (US 10,675,262) for Photoluminescent Nanoparticles and Their Uses in Detection or Quantification of Singlet Oxygen. May 2020: Our paper titled "Side Chain Regioisomers That Dictate Optical Propeties and Mechanofluorochromism Through Crystal Packing” is accepted for publication in Chemistry of Materials. May 2020: Thank you to the Biomaterials Program of the National Science Foundation for funding our collaborative project with the Rotello Group at UMass on photolabile polymer nanoassemblies! May 2020: Our paper titled "Turning on Solid-State Phosphorescence of Platinum Acetylides With Aromatic Stacking” is accepted for publication in ChemComm. December 2019: Congratulations to Dr. Matt Feeney, who defended his PhD thesis. Matt has started a position at Akita Innovations. December 2019: Thank you to the Materials Chemistry program of Basic Energy Sciences in the Department of Energy for renewing their support of our work on controlling conjugated materials with programmed non-covalent interactions. Thank you to our collaborators on this project, Prof. Mu-Ping Nieh at UConn, Prof. Matt Panzer at Tufts, and Prof. Steven Wheeler at the University of Georgia. November 2019: Welcome to our new group members: PhD students Nigel Kidder-Wolff and Elisa Guzman! September 2019: Our Invited Feature Article “Combining Top-Down and Bottom-Up with Photodegradable Layer-by-Layer Films” is published in Langmuir. July 2019: SWT appointed Dean of Academic Affairs in the School of Arts and Sciences. June 2019: Welcome to VERSE student Leanne Collymore, and Tufts Summer Scholar Carolyn Hitelman. June 2019: Our paper titled "Directed Polymorphism and Mechanofluorochromism of Conjugated Materials through Weak Non-Covalent Control” is accepted for publication in Journal of Materials Chemistry C. May 2019: Our paper titled “Spectroscopy and Reactivity of Dialkoxy Acenes” is accepted for publication in Chemistry - A European Journal. May 2019: Congratulations to undergraduate researchers Jen, Gianna, and Taylor, who are all graduating with the BS degrees. Jen Sohn completed a Senior Thesis with Highest Honors.'
