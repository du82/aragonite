title = "Undergraduate Programs | Department of Chemistry"
description = "The (general) BS in Chemistry is intended for those with an interest in chemistry whose career aspirations lie outside the realm of professional chemistry."
full_description = "Undergraduate Programs The Department of Chemistry at Tufts University provides both basic and advanced chemistry education with all the benefits of a major research university but with the environment of a small liberal arts college. We offer a variety of courses, newly expanded and improved facilities, an active teaching and research faculty, and a favorable faculty to student ratio.Our undergraduate alumni go on to careers in a wide variety of fields including, medicine, law, physical and social sciences, engineering, and public policy. Programs BS in Chemistry The (general) BS in Chemistry is intended for those with an interest in chemistry whose career aspirations lie outside the realm of professional chemistry. BS in Biochemistry This interdepartmental major is intended for students interests in the chemistry of living systems, and is offered jointly by the Department of Chemistry and the Department of Biology. BS in Chemical Physics This major is appropriate for a wide variety of careers including, medicine, law, physical and social sciences, engineering, and public policy. Fifth-Year Master’s Degree Program: BS/MS in Chemistry Exceptional students may combine undergraduate and graduate courses and are simultaneously enrolled in bachelor's and master's degrees programs. Minors in Chemistry (Fall 2022) Beginning in Fall 2022, undergraduate students will be able to declare Minors in Chemistry. Minors in Chemistry are designed for students who have done substantial coursework in Chemistry but who may choose not to complete all the requirements for a Chemistry Major. Introductory ChemistryOur department offers two flavors of first-semester General Chemistry: Chem 1 (General Chemistry) and Chem 11 (Expanded General Chemistry). Both classes provide excellent preparation for upper-level coursework. To help determine which class is best for each student, we have designed a self-assessment and an FAQ.Learn more about Introductory ChemistrySenior ThesisThe Undergraduate Senior Thesis is a two-semester program culminating in a written research thesis, public thesis defense seminar, and private oral examination.Learn more about Senior ThesisAdvising FacultyThrough your major advisor, you can participate in a wide variety of research opportunities in the department. Email a faculty member whose research suits your interests to ask whether they are willing to be your advisor. Once you have their agreement, complete the Advisor Change Form.Ravichandra Bachu Clay S. Bennett - Bioorganic, Chemical Biology, and Organic SynthesisTimothy Brunker Ira Caspari - Chemistry & STEM EducationKevin Clark - Analytical Chemistry and NeurochemistryLuke M. Davis - Inorganic and Materials ChemistryXinqiang Ding - Theoretical and Computational ChemistryEric High - Physical and Analytical ChemistrySamuel P. Kounaves - Analytical, Planetary Science, and GeochemistryJoshua A. Kritzer - Bioorganic, Biophysical, and Chemical Biology (not accepting new advisees)Sergiy KryatovKrishna Kumar - Bioorganic and Chemical Biology (not accepting new advisees)Yu-Shan Lin - Theoretical and Biophysical ChemistryCharles Mace - Bioanalytical and Materials ChemistryDiren Pamuk-Turner - (not accepting new advisees)Rebecca A. Scheck - Bioorganic Chemistry and Chemical BiologyMary Jane Shultz - Physical, Environmental, Excited State, and SurfaceE. Charles Sykes - Physical & Surface ChemistrySamuel W. Thomas III - Organic, Surface Chemistry, and Materials ScienceArthur L. Utz - Physical and Materials ChemistryYu Zhang - Inorganic and Organometallic ChemistryLearning ObjectivesUndergraduate Majors Educational Goals and Required Knowledge and SkillsGeneral education goals in chemistry: 1. Communication. The ability to write, display information, and orally communicate in a scientific format. 2. Primary literature. The ability to search for, read and understand primary sources of scientific literature. 3. Understanding data. The ability to understand chemistry data, how it is produced, and how it is applied. 4. Quantitative analysis. The ability to apply quantitative measurement and analytical laboratory techniques to scientific problems. 5. Mathematical tools. The ability to apply mathematical tools to chemistry problems that often involve multiple variables, statistics, and symmetry. 6. Scientific method. The ability to develop a hypothesis, design experiments to test that hypothesis, execute experiments, interpret data, and refine a hypothesis in light of new data. 7. Chemistry as the central and molecular science. Understanding how chemists solve problems across disciplines by designing, synthesizing, and analyzing molecules with defined structure and function. 8. Critical evaluation. The ability to critique scientific claims in the technical and popular press with respect to accuracy, interpretation, and application. 9. Integrity. The development of honesty, responsibility, and integrity with respect to the generation and interpretation of data as a scientist and as a citizen. 10. Science and society. The development of a sense of responsibility for promoting education, diversity and functional literacy in science within the larger community.Knowledge and skills requirements:(these are designed to be cross-major, with each major able to define sub-topics that address the knowledge/skills) 1. Problem-solving skills, including logical reasoning, diligence, and attention to quality, consistency, and thoughtfulness in one's work 2. Structure. Three-dimensional molecular structure and chemical bonding and their origins in the electronic structure of matter 3. Properties and reactivities of important chemical classes, and their uses and preparation 4. Energy and thermodynamics 5. Chemical equilibria including acids, bases and solubility 6. Chemical reactions, stoichiometry and mechanisms 7. Reaction kinetics 8. Oxidation, reduction, and electron transport 9. Chemical basis of biological function 10. Experimental techniques. Knowledge of, and safe practices in, analytical and preparatory laboratory techniques, including synthesis of molecules and/or materials 11. Hands-on laboratory experience Learn more about Arts and Sciences Learning Objectives Admissions Please visit our admissions website for comprehensive information on our admissions processes and requirements, deadlines, financial aid options, forms and instructions. Request Information Undergraduate Admissions Director of Undergraduate Studies Rebecca Scheck Associate Professor Chemical Biology and Bioorganic Chemistry. The post-translational modification (PTM) of proteins is an essential cellular vocabulary that allows critical information to be communicated within and between cells. The Scheck lab pioneers new chemical biology tools that enable the decoding of PTM networks. We use these methods to unlock previously unattainable information about how PTMs are integrated into signaling networks in living cells. Our focus is on PTMs with unusual mechanisms that make them particularly complicated to study using traditional tools, which typically inhibit or profile specific enzyme activities. We use an integrated mass spectrometry and chemical biology approach to develop new, selective chemistries and chemical methods that can predictably modulate, track, or capture specific PTMs, like glycation, ubiquitination, or phosphate B-elimination. Learning how these signals are interpreted or degraded will provide access to new therapeutic targets for preventing or treating neurodegenerative diseases, bacterial infection, autoimmune disease, cancer, diabetes, and age-related diseases."
year_published = 2025
