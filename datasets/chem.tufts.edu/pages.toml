["https://chem.tufts.edu/academics/graduate-programs/phd-chemistry"]
title = "PhD in Chemistry | Department of Chemistry"
full_description = "PhD in Chemistry The PhD in chemistry is primarily a research degree. It is awarded to students who have displayed competence in planning and conducting original research in the field of chemistry, demonstrated a broad familiarity with the science of chemistry, understanding in the application of the scientific method, and gained a thorough knowledge of their field of specialization. Students build a solid foundation in all four core areas of chemistry (analytical, inorganic, organic, and physical), and a thorough knowledge of their chosen field of specialization. In the first part of the PhD program, students take at least one formal classroom course in each the core areas of chemistry as outlined in the course requirements below. The courses must be completed successfully (B- or better) by the end of the third semester. Since original research is the primary requirement for the PhD degree, a student selects a research supervisor and begins research before the end the first year. The student and research supervisor then select two faculty members to serve as the student's Doctoral Research Committee. The Committee, in conjunction with the student's research adviser, take over the advisory function from the graduate committee and guides the student's work to promote development as an independent investigator. Thus, in addition to research each student must complete the following requirements: Service as a teaching assistant Regular progress updates with a faculty Research Committee A departmental seminar Defense of an original research proposal. Completion of a dissertation reporting significant work of publishable quality Course Requirements At least one of the following analytical chemistry courses: Chem 141: Instrumental Analysis Chem 142: Advanced Analytical Methods Chem 144: Spectroscopic Methods of Analysis Chem 145: Separation Science Chem 146: Electroanalytical Chemistry At least one of the following inorganic chemistry courses: Chem 161: Advanced Inorganic Chemistry Chem 162: Chemistry of Transition Elements Chem 164: Bioinorganic Chemistry Chem 165: Physical Methods In Inorganic Chemistry At least one of the following organic chemistry courses: Chem 150: Intermediate Organic Chemistry Chem 151: Physical Organic Chemistry Chem 152: Advanced Organic Synthesis At least one of the following physical chemistry courses: Chem 131: Statistical Thermodynamics Chem 132: Chemical Kinetics and Dynamics Chem 133: Quantum Mechanics Chem 134: Biophysical Chemistry Chem 136: Spectroscopy and Molecular Structure Chem 138: Atomic Scale Structure and Properties of Surfaces Two additional classroom courses, exclusive of research, must be completed satisfactorily by the end of the fourth semester Course Information Department Faculty Admissions Information Graduate Student Handbooks View All Handbooks"
year_published = 2025
