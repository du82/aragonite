["https://chem.tufts.edu/people/faculty"]
title = "Faculty | Department of Chemistry"
full_description = '''Faculty Faculty Core Faculty Yu-Shan Lin Professor and Department Chair of Chemistry Theoretical and Computational Biophysical Chemistry. The YSL Group aims to elucidate the structures and functions of biomolecules by integrating the power of advanced computations with the elegance of chemical theory. Our focus is to develop and apply computational methodology to significant biological problems that are difficult to address experimentally. Two major research projects in the YSL Group are (1) to understand and design cyclic peptides with desired conformations to modulate protein–protein interactions and (2) to elucidate the structural and functional roles of post-translational modifications and non-natural amino acids on protein folding. Ravichandra Bachu Lecturer Clay Bennett Professor Organic Synthesis, Carbohydrate Chemistry, Synthetic Methodology, Bioorganic Chemistry. Complex carbohydrates play critical roles in a number of biological processes including, protein folding, cellular adhesion and signaling. Despite their importance, very little is understood about the molecular basis of their activity. This is largely due to the fact that the only source of pure oligosaccharides is tedious multi-step synthesis, which can take months or even years to compete. Our research is focused on developing methodologies, based on asymmetric catalysis, to streamline complex oligosaccharide synthesis. Ultimately such methods will aid in the rapid and routine preparation of oligosaccharides for biophysical studies and drug discovery. Tim Brunker Lecturer Ira Caspari-Gnann Assistant Professor Chemistry and STEM Education. In order to understand how and why successful teaching and learning of chemistry at the university level works, the Caspari research group focuses on analyzing students', teaching assistants' (TA), learning assistants' (LA), and instructors' reasoning, interactions, and culture. The group collects video data of classroom practices and conducts qualitative research interviews with instructors, TAs, LAs, and students to better understand how certain interactions and ways of reasoning lead to student sense making and learning. While zooming in and investigating how students connect aspects of chemistry, the group also zooms out and investigates classroom culture and how individual interactions and personal experiences integrate into larger systems of teaching and learning. The group uses this fundamental research as a theoretical basis for implementing teaching innovations and designing training opportunities in order to promote supportive learning environments for students that value and encourage their unique ways of being, knowing and doing. Kevin Clark Assistant Professor Analytical Chemistry, Separations, Mass Spectrometry, RNA Modifications, Neuro-analytical Chemistry. Our group is interested in the characterization of RNA modifications in the central nervous system and single cells. These naturally occurring modifications to RNA biopolymers play important roles in regulating protein translation, but little is known about their functions in the brain. We are focused on developing new approaches for chromatographic separations and mass spectrometry measurements of in small-volume samples such that they can be applied for the simultaneous profiling of multiple RNA modifications in single neurons. The Clark Lab is particularly interested in ionic liquid solvents and ion-tagged oligonucleotides as customizable materials for nucleic acid sample preparation that can be leveraged to improve the performance of downstream analysis methods. We combine our analytical methodologies with a powerful neurobiological model, the marine mollusk Aplysia californica, to investigate relationships between the dynamic landscape of RNA modifications and animal behavior, learning and memory, and function of the central nervous system in health and disease. Luke Davis Assistant Professor I am interested in synthesis and characterization in inorganic and materials chemistry. I am especially interested in fundamental chemistry that has important societal implications. My research laboratory currently works in several areas: Earth-abundant molecular light absorbers and emitters. Molecular light absorbers and emitters are used in photoredox catalysis, dye-sensitized solar cells, and organic light-emitting diodes (OLEDs). We are exploring high-spin complexes of iron and manganese to prepare new molecules that absorb and emit light. Volatile molecules carrying metal-atom equivalents for superconducting wires. Cryogenic superconducting wires enable quantum bits based on Josephson junctions. We are developing new molecules and methods to deposit the electropositive metals that make up these wires from chemical vapors. Thin-film photovoltaics with earth-abundant, sulfide-based absorber layers. Thin-film photovoltaics (solar cells) provide electricity from sunlight with just a few hundred nm of light-absorbing material. We are exploring binary and ternary sulfides as new sources of earth-abundant photovoltaics. I am developing new research programs in several areas: Zero-emissions ironmaking. The synthesis of iron metal from iron ore contributes ca. 4% of global carbon dioxide emissions. I am interested in alternative thermochemical methods of making iron from iron oxides. New superconducting materials. Near-room-temperature superconductors have recently been realized in compressed hydrides. I am interested in new hydride compounds that are stable at ambient pressure and might serve as ambient-pressure, ambient-temperature superconductors. Xinqiang Ding Dr. Charles W. Fotis A37, AG39 Assistant Professor The Ding Group develops and uses computational approaches to solve problems in chemistry and biophysics. We currently focus on the following two areas. 1. Computational drug design. We aim to accelerate drug design by developing fast and accurate methods for computing protein-ligand binding free energy. To do that, we combine ideas and methods from molecular simulations, statistical mechanics and machine learning. 2. Force field development. We aim to develop a transferable and accurate coarse-grained force field for simulating large biophysical systems. Eric High Lecturer Samuel Kounaves Professor Planetary Chemical Analysis & Astrobiology - In the search for life in our solar system over the past several decades, it has become increasingly clear that there may be multiple worlds besides Earth that either once had or may still have environments capable of supporting microbial life as we know it. Our current research is focused on two aspects of this search: (1) In the search for life on Mars, one key question is; how are biologically-produced molecules (biomarkers) altered when exposed to solar ultraviolet radiation in the presence of oxychlorines and their intermediate formation products? To help answer this question we are investigating the "fragmentation" patterns of such altered biogenic compounds which could then be used to identify the original biomarker and thus provide evidence for life on Mars. (2) We are developing in-situ analytical instrumentation that is designed to unambiguously detect microbial life and determine the habitability of planetary environments that may be present at the surface or subsurface of Mars, and the oceans of icy-worlds such as Saturn's moon Enceladus or Jupiter's moon Europa. Joshua Kritzer Professor Bioorganic, Biophysical, & Chemical Biology. Peptides and their mimetics can target protein surfaces in ways small molecules rarely do, making peptide libraries attractive for screening for nontraditional modes of action. The Kritzer research group takes advantage of peptide and peptidomimetic libraries to bypass many of the disadvantages of small molecule screening. They also explore how modifications such as substitution of peptide bonds with isosteres, amide N-methylation, and head-to-tail cyclization affect the activities, specificities, and bioavailabilities of functional peptides. By combining powerful techniques from organic synthesis, biophysical chemistry, molecular biology and genetics, they are developing new molecules and new strategies to attack cancer, inflammation, and autoimmune diseases. Sergiy Kryatov Distinguished Senior Lecturer Inorganic Chemistry. Kinetics and mechanism of oxygen and hydrogen peroxide activation by metal complexes. Krishna Kumar Robinson Professor of Chemistry Bioorganic Chemistry and Chemical Biology The research interests of the Kumar laboratory are centered on the (1) use of chemistry to design molecules to interrogate and illuminate fundamental mechanisms in biology, or be used as therapeutics; and (2) use of biology to "evolve" and "select" molecules that can perform chemistry in non-biological and medicinal settings. These are some questions we are trying to answer: (i) Is it possible to design and mimic natural proteins and other biological macromolecules by use of building blocks that nature does not use – and whether such constructs can be endowed with properties that are not found in biology?; (ii) How did the first enzymes arise in the imagined Darwin's pond – is there a way to recreate this scenario and in the process develop a fundamentally new method to create enzymes?; (iii) Biology uses phase separation, that is, clustering of different compounds in confined locations – a process that is key in orchestrating the daily activities of a cell – can we find methods that can predictably dictate where molecules are located in a given environment and thereby direct the phenotype that is generated?; (iv) Can we rationally design small molecules and peptides that can function against antibiotic resistant bacteria that are threatening the most basic tenet of modern medicine? Charlie Mace Associate Professor Bioanalytical and Materials Chemistry. To solve outstanding problems in global health, the Mace Lab applies a multidisciplinary approach combining aspects of analytical chemistry, materials science, and engineering. The primary goal of the Mace lab is to develop low cost, patient-centric technologies that can improve access to healthcare. To achieve this, the Mace Lab designs devices that improve the self-collection of blood and enable the diagnosis of diseases in resource-limited settings, and they are exploring ways the methods that are developed in the lab can used by others. Their main techniques leverage the properties of paper and other porous materials to integrate function into simple, affordable devices. Unique to laboratories in Chemistry departments, his group specializes in handling human blood and saliva. Technologies developed in the Mace lab have made the leap to clinical sites in Africa, South America, and the US, owing to their network of clinical, academic, and industry collaborators. The Mace Lab has broad expertise in assay development and device prototyping, which they apply to evaluating the efficacy of candidate therapeutics, performing separations that lead to new measurements, and making field-deployable kits for point-of-care testing. They have additional expertise in instrument development, phase separation in systems of polymers, and microfluidics. Diren Pamuk Turner Senior Lecturer Rebecca Scheck Associate Professor Chemical Biology and Bioorganic Chemistry. The post-translational modification (PTM) of proteins is an essential cellular vocabulary that allows critical information to be communicated within and between cells. The Scheck lab pioneers new chemical biology tools that enable the decoding of PTM networks. We use these methods to unlock previously unattainable information about how PTMs are integrated into signaling networks in living cells. Our focus is on PTMs with unusual mechanisms that make them particularly complicated to study using traditional tools, which typically inhibit or profile specific enzyme activities. We use an integrated mass spectrometry and chemical biology approach to develop new, selective chemistries and chemical methods that can predictably modulate, track, or capture specific PTMs, like glycation, ubiquitination, or phosphate B-elimination. Learning how these signals are interpreted or degraded will provide access to new therapeutic targets for preventing or treating neurodegenerative diseases, bacterial infection, autoimmune disease, cancer, diabetes, and age-related diseases. Mary Shultz Professor Physical Chemistry and Surface Science. The Shultz group applies physics and chemistry to understand the inner workings of hydrogen bonding. Hydrogen bonding plays key roles in environmental, biological, and atmospheric chemistry. Our program has research thrusts in all three directions. We specialize both in devising environments that clearly reveal key interactions and in developing new instrumentation. The most recent focus is on icy surfaces and on clathrate formation. Probing the ice surface begins with a well-prepared single-crystal surface. We have unique capabilities for growing single-crystal ice from the melt and for and preparing any desired ice face. Our clean water efforts are aimed at developing new materials to fill the significant need for safe drinking water. According to the World Health Organization, over one billion people lack safe drinking water. Our program is based on using photo catalysts to capture readily available sunlight to turn pollutants into benign CO2 and water. We developed methods to grow ultra-nano (~2 nm) particles that have well-controlled surface structures and chemistry. E. Charles Sykes John Wade Professor Physical Chemistry, Surface Science, and Nanoscience. The Sykes group utilizes state of the art scanning probes and surface science instrumentation to study technologically important systems. For example, scanning tunneling microscopy enables visualization of geometric and electronic properties of catalytically relevant metal alloy surfaces at the nanoscale. Using temperature programmed reaction studies of well defined model catalyst surfaces structure-property-activity relationships are drawn. Of particular interest is the addition of individual atoms of a reactive metal to a relatively inert host. In this way reactivity can be tuned, and provided the energetic landscapes are understood, novel bifunctional catalytic systems can be designed with unique properties that include low temperature activation and highly selective chemistry. Newly developed curved single crystal surface are also being used to open up previously inaccessible areas of structure sensitive surface chemistry and chiral surface geometries. In a different thrust, the group has developed various molecular motor systems that are enabling us to study many important fundamental aspects of molecular rotation and translation with unprecedented resolution. Samuel Thomas Professor and Senior Dean of Academic Affairs Organic Materials Chemistry Our group applies the philosophy of physical organic che'''
