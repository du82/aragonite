["https://chetapp.io/faq.html"]
title = "Chet"
description = "Chet is an ear-training app that helps you improve your musical ear with fun and engaging games"
full_description = "Chet is an ear training and music theory app for musicians of all levels. You can compete with other musicians to achieve high scores or play at your own pace in a wide variety of games. Ear training is the practice of identifying musical concepts, like melodies, scales, and chords, solely through listening. Musicians train their ears because it strengthens the connection they have with their instruments. A musician with a trained ear can easily play back a melody that they hear. They can also improvise over a chord progression they've never heard before, or imagine a melody inside their head and play it on their instrument. By working on ear training, you will vastly improve your skills not only on your instrument, but also in music theory, composition, and improvisation. In the Path, Chet will guide you through a learning path called Foundations. To move ahead in the path you will need to earn at least one star per game. If any part of the path feels too easy, you can skip units by passing one of the 'Jump Ahead' tests. In the Library you can work independently on a variety of topics like intervals, scales, and tunes. You will have around 60 or 90 seconds to answer as many questions as you can. In Challenges, you can test your overall fluency in timed competitions. Each time you make a mistake, you will get a strike. If you get three strikes or the timer runs out, the game will end. We recommend starting with the 'All-Around' challenge. Challenges are not available to complete beginner users. If you are a beginner, or someone with little or no experience with ear training and music theory, we recommend starting in the Path. Once you’ve made some progress, try some beginner games in the Library. For intermediate users, or users with a substantial amount of experience with ear training and music theory, we recommend starting in the Collections. If you prefer guided practice, try starting on Units 3 or 4 in the Path by passing one of the 'Jump Ahead' tests. If you want to compete in more difficult competitions or test your overall fluency, try some of the Challenges."
author = "Hirsh Group"
year_published = 2025
clearnet = "https://chetapp.io/faq.html"
