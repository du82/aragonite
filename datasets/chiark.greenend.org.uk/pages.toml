["https://www.chiark.greenend.org.uk/urcm"]
title = "uk.rec.cycling.moderated"
full_description = "This webpage explains the operation of uk.rec.cycling.moderated, a newsgroup within the UK hierarchy. uk.rec.cycling.moderated is, as its name suggests, a moderated newsgroup. Postings made to the group are reviewed against the moderation policy before they appear on the newsgroup. This is to ensure that discussions stay within the charter and moderation policy, creating a newsgroup which is civil, pleasant and of interest to cyclists. Some of the moderation mechanisms are automated, others require human intervention. Details of how to contact the moderation team, and the list of messages pending, accepted and rejected are shown below. ( This is a copy of the official charter published at http://www.usenet.org.uk/uk.rec.cycling.moderated.html#uk.rec.cycling.moderated ) This group is for the discussion of all matters relating to cycling and the UK. Recreational cycling, cycling for transport, racing, and other forms of cycling are all on-topic. Moderation will be used to ensure that the group remains civil, pleasant, and of interest to cyclists. The moderators may use whatever tools and processes they collectively feel appropriate to ensure the smooth running of the group. Encoded binaries (eg pictures, compressed files, etc.) are forbidden. Such material belongs on a web or FTP site to which a pointer may be posted. Cryptographic signatures (eg PGP) may be used where authentication is important and should be as short as possible. Posts must be readable as plain text. HTML, RTF and similarly formatted messages are prohibited. To see how to make some common news readers comply with this, read http://www.usenet.org.uk/ukpost.html Crossposting is at present generally not permitted. Brief and constructive discussion of the moderation policy is permitted in the newsgroup itself. In controversial threads, particularly relating to borderline off-topic areas, postings which (in the moderators' opinion) fail to constructively advance the discussion may be rejected. The moderators operate a passlist system, so that messages from regular on-topic posters can be posted promptly and automatically. Threads which have descended into repetition or abuse may be closed by the moderators."
