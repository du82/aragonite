["http://www.chiark.greenend.org.uk/~sgtatham/putty"]
title = "PuTTY: a free SSH and Telnet client"
full_description = "Home | FAQ | Feedback | Licence | Updates | Mirrors | Keys | Links | Team Download: Stable · Snapshot | Docs | Privacy | Changes | Wishlist PuTTY is a free implementation of SSH and Telnet for Windows and Unix platforms, along with an xterm terminal emulator. It is written and maintained primarily by Simon Tatham. LEGAL WARNING: Use of PuTTY, PSCP, PSFTP and Plink is illegal in countries where encryption is outlawed. We believe it is legal to use PuTTY, PSCP, PSFTP and Plink in England and Wales and in many other countries, but we are not lawyers, and so if in doubt you should seek legal advice before downloading it. You may find useful information at cryptolaw.org, which collects information on cryptography laws in many countries, but we can't vouch for its correctness. PuTTY 0.83, released today, adds support for a second post-quantum key exchange algorithm (ML-KEM), and has many fixes for bugs in 0.82. PuTTY 0.82, released today, improves Unicode support. Usernames and passwords read from the terminal or the Windows console now support full Unicode, so that you can use characters outside the Windows system code page, or the character set configured in PuTTY. The same is true for usernames and file names provided via the PuTTY tools' command line and via the GUI. (However, unfortunately not yet if you save and reload a session.) PuTTY 0.81, released today, fixes a critical vulnerability CVE-2024-31497 in the use of 521-bit ECDSA keys (ecdsa-sha2-nistp521). If you have used a 521-bit ECDSA private key with any previous version of PuTTY, consider the private key compromised: remove the public key from authorized_keys files, and generate a new key pair. However, this only affects that one algorithm and key size. No other size of ECDSA key is affected, and no other key type is affected. PuTTY 0.80, released today, includes a fix for the Terrapin vulnerability in some SSH protocol extensions (aka CVE-2023-48795). The issue also needs patching in the server. PuTTY 0.79, released today, is mostly a bug fix release, with only minor new features in SSH and terminal mouse handling."
