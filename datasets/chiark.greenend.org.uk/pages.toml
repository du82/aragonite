["http://www.chiark.greenend.org.uk/~ian/software"]
title = "Ian Jackson's software page"
full_description = "This page is ordered not by quality or importance. Rather, at the top you will find things which are you less likely to find elsewhere. It also provides a convenient shell utility for querying the DNS and getting directly useable answers. (Tools like dig and host are less useful for scripting DNS clients, but much better for debugging the DNS itself.) In lieu of anyone else, I now appear to be the only person maintaining the X11 window manager I use, vtwm. My current main project in Debian is dgit (source), which is part of various plans to try to make git workflows in and around Debian more official, more useful and more automatic. I'm a founder member of the Debian Ecosystem Init Diversity Team, a joint venture between Debian contributors, folks from Devuan, and upstream developers, working to maintain and improve support in Debian and its derivatives for running with a variety of non-systemd init systems. I'm the current maintainer of a number of packages, including a few of my own, and quite a number on a caretaker basis. As a Xen committer and maintainer, I was a key contributor to of libxl, the main Xen toolstack library. I helped the Xen Project draft and adopt its Security Policy and I am member of the Security Team. I also try to help maintain the Xen packages in Debian."
year_published = 2025
