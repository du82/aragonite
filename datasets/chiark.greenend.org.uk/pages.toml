["https://www.chiark.greenend.org.uk/~news/ucam.html"]
title = "University of Cambridge users - chiark news server"
full_description = "If you have problems or questions, please contact newsmaster@chiark. You may also post to ucam.comp.misc, which we read. We are unsure about the future of the ucam.* hierarchy. Since the UCS server has shut down, only people using chiark or the SRCF can see these groups. The University Computing Service know about our service, although it is not an official replacement of nntp-serv. The Student-Run Computing Facility also have a news server, which peers with us. Please contact the SRCF for information about their server. Then when you type L (folder list) you'll see separate folder collections for your Hermes mail folders and for news groups on chiark. If you have previously set up Alpine or Pine to read news using nntp-serv.cam.ac.uk, you may also need to remove it from your list of folder collections. To do this: type M (main menu) S (setup) L (collection lists), move to the nntp-serv collection and type D (delete) then E (exit) and confirm as necessary. We also (with help from Chris Webb) run the ucam.org domain registry, from which the SRCF domain is delegated. At the time of writing Ian is one of the moderators for uk.rec.cycling.moderated and Matthew is a member of the UK Usenet Committee. Ian is the owner and administrator of chiark."
