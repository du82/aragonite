title = "Schedule"
full_description = '''October 17-18, 2024Conference ScheduleJoin us for six exciting conference tracks, with full agenda, session times, topics, and speakers coming soon. Don't miss out on these dynamic sessions! (More sessions continuously added)Rust Programming LanguageApp DevelopmentAI Models & InfraEmbodied AINext Generation InternetNext Generation Media & DeviceRust Language Track: Driving the Future of Safe and Performant Development‍The Rust Language Track brings together key contributors from the Rust ecosystem, including experts in the language itself, compiler, developer tools, and members of the technical leadership council. This track offers an in-depth look at Rust from both a technical and community perspective, featuring insights from:Major Rust project contributors, sharing the latest advancements and improvements in the Rust ecosystemReal-world Rust application developers, who will discuss their experiences building performant and safe applications with RustAcademic research, highlighting Rust’s safety guarantees and innovative language features that set it apart in modern programmingProject leaders, who will outline Rust’s future roadmap and vision, sharing what’s next for this rapidly growing languageWhether you're a seasoned Rust developer or new to the language, this track provides a unique opportunity to engage with the people driving Rust’s continued success and innovation.‍Don’t miss out on this chance to explore the future of Rust and its impact on software development!October 17Rust Programming LanguageRust Programming LanguageApp Development SummitAI Models & InfaEmbodied AINext Generation InternetNext Generation Media & DeviceRust Programming LanguageTimeSession8:30RegistrationTime8:30SpeakersSlidesScribdVideoYoutubeTime8:309:30GOSIM Keynote: Open Source Ecosystem in the Era of AGITime9:30SpeakersTao JiangSlidesScribdVideoYoutubeOpen Source Ecosystem in the era of AGI... More Details SoonTime9:309:45Opening Keynote: Mobile Solution by OpenHarmonyTime9:45SpeakersYan ZhouSlidesScribdVideoYoutubeHuawei promotes the openness, concurrency, and security of mobile devices operating systems based on OpenHarmony, and combines the lightweight characteristics of devices to provide the industry with more effective parallel and concurrency solutions.Time9:4510:05GOSIM Hackathon Awards CeremonyTime10:05SpeakersSlidesScribdVideoYoutubeWinner of the GOSIM Hackathon will be announced.Time10:0510:10Morning BreakTime10:10SpeakersSlidesScribdVideoYoutube20 Minutes BreakTime10:1010:30Register Allocation in CraneliftTime10:30SpeakersAmanieu d'AntrasSlidesScribdVideoYoutubeRegister allocation is one of the most important stages in an optimizing compiler and is often responsible for a large fraction of the compilation time. This talk presents the register allocator used by Cranelift, a fast compiler backend written in Rust and used by the Rust compiler, with a focus on regalloc3, its newest iteration that is currently being developed.Time10:3011:10Through the Eyes of a Maintainer: How to Make Your Contribution More SuccessfulTime11:10SpeakersEd PageSlidesScribdVideoYoutubeWhether its to the Rust Project, your favorite Rust tool, or a library you use, your first contribution can be intimidating. You are stepping into an area where you don't know the social dynamics or technical expectations. I'll be stepping you through the process of contributing from the maintainer's perspective so you can better understand how this works and how to make it more likely your contribution is both accepted and quickly.Time11:1011:50Rust Compiler OverviewTime11:50SpeakersNicholas NethercoteSlidesScribdVideoYoutubeThis talk will provide an overview of the Rust compiler: what it looks like, how it works, how its internals are structured, and how it is developed.Time11:5012:30Lunch BreakTime12:30SpeakersSlidesScribdVideoYoutubeTime12:3014:00Writing Your Own Rust LinterTime14:00SpeakersGuillaume GomezSlidesScribdVideoYoutubeThis talk will show you how to write your own rust linter using the rustc_tools crate which allows you to have access to the rust compiler API. It can be quite useful if you need specific lints for a project and cannot add them to clippy. It will also explain how the compiler API works and give a small example at the end showing it in action.Time14:0014:40Life as a Rust Project ContributorTime14:40SpeakersJane Losare-LusbySlidesScribdVideoYoutubeJoin Jane Losare-Lusby as she takes you on a journey through her experiences as a contributor to the Rust project. Starting with her early work on Clippy, Jane has navigated various roles, including error-handling project group lead, member of the Library and Style teams, and as a board member of the Rust Foundation. After a brief hiatus to work on Truffle and June, she returned to contribute to the Rust Compiler team, where she is now focused on the development of locally stored metrics. In this talk, Jane will share personal insights on navigating challenges such as impostor syndrome, conflict resolution, burnout, and isolation. Jane will offer practical advice for newcomers looking to contribute to Rust, highlighting the importance of mentorship and connection, the dynamics of various Rust teams, and how to turn an idea—like her current metrics initiative—into a meaningful contribution. Whether you're a seasoned developer or just getting started, this talk will provide valuable perspectives on how to find your place and make an impact in the Rust community.Time14:4015:20Afternoon BreakTime15:20SpeakersSlidesScribdVideoYoutube30 Minutes BreakTime15:2015:50Fireside ChatTime15:50SpeakersJosh TriplettSlidesScribdVideoYoutubeA cozy interview and Q&A with Dr. Josh Triplett, from the Rust Project language, library, and Cargo teams.Time15:5016:30Low-Level: Rust Education's "Next Big Thing"Time16:30SpeakersBart MasseySlidesScribdVideoYoutubeThe Rust community has made a good start at teaching tools for introductory Rust. I will review the state of Rust education, especially in Universities, and talk about ways in which Rust-Edu and other groups hope to fill new needs in the low-level space.Time16:3017:10Typical Use of Rust Programs in Different Linking Ways in Trading SystemsTime17:10SpeakersQiao DanSlidesScribdVideoYoutubeThis talk will delve into the fundamental concepts of workspace, target, and crate-type. It will explore three cases within a trading system, highlighting code dependencies and static links using -crate-type=lib, dynamic link with -crate-type=cdylib, and static link using -crate-type=rlib. Furthermore, the talk will expand on important aspects such as the performance differences between dynamic and static links and the trade-offs in terms of toolchain version flexibility when using rlib. Time17:10October 18Rust Programming LanguageTimeSession9:30Ferrocene - The present and future of Rust in SafetyTime9:30SpeakersFlorian GilcherSlidesScribdVideoYoutubeRust is a relative new language - released in 2015, it has taken the software programming word surprisingly swiftly. It is surprising that - not even 10 years later - we have ongoing projects and initiatives in the Functional Safety/SDV space. Rust is even seen as a front runner of open source safety initiatives. How did that happen? This talk provides an overview of currently ongoing initiatives, an assessment of challenges and an outlook into the future.Time9:3010:10How Different is Rust Code in the Linux Kernel?Time10:10SpeakersGary GuoSlidesScribdVideoYoutubeThe Linux kernel is very different from ordinary software projects, and therefore you shouldn't expect kernel Rust code to be similar to the Rust code that you're familiar with! In this talk I'll go through the basic primitives in Rust for Linux, compare them with userspace Rust, and dive into rationales that lead to their design.Time10:1010:50Morning BreakTime10:50SpeakersSlidesScribdVideoYoutube20 Minutes BreakTime10:5011:10An Outsider's Guide to the Rust ProjectTime11:10SpeakersJack HueySlidesScribdVideoYoutubeThe Rust project has grown both in members and in structure over the past years. This talk aims to give a bird's eye view of the teams and structure of the people that make up the Rust Project today, how the teams communicate and make collaborative decisions, and how new people and groups can get involved.Time11:1011:50Building Efficient and Scalable Distributed Systems: Implementing Zenoh with Rust for V2V, Autonomous Systems, and RoboticsTime11:50SpeakersYuyuan YuanSlidesScribdVideoYoutubeThe need for efficient and scalable distributed systems is critical in the rapidly advancing fields of Vehicle-to-Vehicle (V2V) communication, autonomous systems, and robotics. Zenoh, an innovative protocol that integrates data in motion and data at rest, paired with the power of Rust, offers a compelling solution to these challenges. This talk will explore how to effectively implement Zenoh using Rust, unlocking new possibilities in edge computing, IoT, and real-time applications.Time11:5012:30Lunch BreakTime12:30SpeakersSlidesScribdVideoYoutubeTime12:3014:00Current Status, Challenges and Key Technologies on Rust OSesTime14:00SpeakersYu ChenSlidesScribdVideoYoutubeWe Analyze the current development status and challenges faced by operating system kernels based on the Rust language. We also introduce the development history of an operating system designed and implemented in Rust by the Operating System Laboratory at Tsinghua University, as well as the current work on a component-based operating system kernel. The discussion also covers the difficulties encountered in designing and implementing a componentized operating system kernel, along with the technical attempts we are making. Additionally, we present our efforts in organizing operating system kernel competitions within Chinese universities and conducting open-source operating system bootcamps.Time14:0014:40Development Practice of Rust Language in vivo BlueOSTime14:40SpeakersShuang ChenSlidesScribdVideoYoutubeVivo BlueOS is developed using Rust, a memory-safe systems programming language renowned for its high concurrency, strong security, and high efficiency. Rust provides a more stable and efficient runtime environment for operating systems. By leveraging Rust, BlueOS achieves smoother performance when handling complex tasks. This presentation will demonstrate how BlueOS implements core system services, such as graphics and multimedia, using the Rust language.Time14:4015:20Afternoon BreakTime15:20SpeakersSlidesScribdVideoYoutube30 Minutes BreakTime15:2015:50How Rust Makes Open Source Embedded Drivers EasyTime15:50SpeakersWouter GeraedtsSlidesScribdVideoYoutubeAdding an existing open source driver for your embedded peripheral is pretty awful in C. Rust makes open source embedded drivers easy thanks to the language itself, and the Rust Embedded ecosystem.Time15:5016:30Leveraging Rust's Strengths in WasmTimeTime16:30SpeakersAlex CrichtonSlidesScribdVideoYoutubeThe Rust programming language is well known for its safety guarantees, and even when a project is forced to use `unsafe` code it has many benefits to offer. This talk will dive into the Wasmtime project, a standalone WebAssembly engine, and how it leverages Rust's strengths to provide critical safety guarantees.Time16:30App Development Track: The Future of Cross-Platform Innovation‍Discover the most popular open-source frameworks and dive into the latest technological advancements and trends in app development! In the App Development Track, we’ll focus on: Flutter, React Native, Kotlin Multiplatform, Cangjie, and OpenHarmony, exploring innovative practices for building cross-platform applicationsThe latest progress of WebAssembly, offering unprecedented performance and flexibility in application developmentFull-stack frameworks based on the Rust language, such as Makepad and Robius, revealing the opportunities and challenges of using Rust as a development languageHow Generative AI is revolutionizing development workflows, enhancing creativity and efficiencyValuable insights from super app developers, unlocking key strategies for building the future of applications‍Whether you're an experienced developer or just starting, this track will provide in-depth analysis of cutting-edge technologies and practical insights to help you stay ahead in the fast-evolving world of app development!‍Don’t miss the opportunity to explore the future of app development with industry leaders and innovators!October 17App DevelopmentTimeSession8:30RegistrationTime8:30SpeakersSlidesScribdVideoYoutubeTime8:309:30GOSIM Keynote: Open Source Ecosystem in the Era of AGITime9:30SpeakersTao JiangSlidesScribdVideoYoutubeOpen Source Ecosystem in the era of AGI... More Details SoonTime9:309:45Opening Keynote: Mobile Solution by OpenHarmonyTime9:45SpeakersYan ZhouSlidesScribdVideoYoutubeHuawei promotes the openness, concurrency, and security of mobile devices operating systems based on OpenHarmony, and combines the lightweight characteristics of devices to provide the industry with more effective parallel and concurrency solutions.Time9:4510:05GOSIM Hackathon Awards CeremonyTime10:05SpeakersSlidesScribdVideoYoutubeWinner of the GOSIM Hackathon will be announced.Time10:0510:10Morning BreakTime10:10SpeakersSlidesScribdVideoYoutube20 Minutes BreakTime10:1010:30Next Generation App Development with Dioxus: Fullstack, Cross-Platform, Strongly Typed, and Blazingly FastTime10:30SpeakersJonathan KelleySlidesScribdVideoYoutubeDioxus is a Rust framework that makes it makes it easy for developers to ship web, desktop, and mobile apps with a single unified codebase. In this talk, we’ll be unveiling features like native mobile support, live hot-reloading, and a custom AI model.Time10:3011:10Flutter: Google’s UI toolkit for Mobile, Web, & Desktop Apps from a Single CodebaseTime11:10SpeakersKevin MooreSlidesScribdVideoYoutubeFlutter is an open source framework for building beautiful, natively compiled, multi-platform applications from a single codebase.Time11:1011:50Blitz: Blurring the Lines Between Web and NativeTime11:50SpeakersNico BurnsSlidesScribdVideoYoutubeIntroducing Blitz, a new cross-platform application runtime which combines web-compatible "write-once, run-everywhere " UI code with a small footprint and powerful system integrations when deploying to native (non-web) platforms.Time11:5012:30Lunch BreakTime12:30SpeakersSlidesScribdVideoYoutubeTime12:3014:00uni-app x: The next generation, pure native cross-platform frameworkTime14:00SpeakersHongbao CuiSlidesScribdVideoYoutubeIn recent years, cross-platform development has long been a familiar development paradigm, but cross-platform development is still often criticized by developers? Why? How to improve the solution? In this speech, I will share the thinking and exploration of uni-app team on this problem, and expound their performance bottlenecks and optimization practices for the three platforms of native, H5 and mini program, and introduce uni-app x, a new cro'''
