title = "The GOSIM Conference | October 17-18 - Beijing, China"
description = "The GOSIM Conference, October 17-18 - Beijing, China. A confluence of minds from various spheres of the open-source domain, offering a deep dive into the world of open source technology trends, strategies, governance, and best practices."
full_description = '''October 17-18, 2024GOSIM CHINA 2024A confluence of minds from various spheres of the open-source domain, offering a deep dive into the world of open source technology trends, strategies, governance, and best practices.ScheduleOctober 17-18, 2024Call For ProposalsSubmit your proposal now!Location DetailsRooms reservations + moreChina VisaEverything you need to knowOur SponsorsWorldclass OrganizationsProudly supported byGOSIM China 2024Why You NeedTo AttendOctober 17 to October 18, coinciding with CSDN's 1024 Programmer Fest Week. This annual event is expected to attract a large number of industry professionals, developers, and enthusiasts to discuss and share their expertise in various aspects of computer science and artificial intelligence.‍The two-day conference will feature a series of keynote speeches, panel discussions, and technical sessions. Topics covered will range from the latest advancements in the Rust programming language, multi-platform app development, open-source generative AI, emobided AI, robotics, to emerging trends in the next generation internet, and XR technologies. Additionally, there will be hands-on workshops and coding competitions for attendees to demonstrate their skills and learn from others. The CSDN 1024 Programmer Fest Week is an annual celebration of programming, programming culture, and the open source community. It includes a series of events and activities aimed at promoting knowledge sharing, collaboration, and innovation among programmers, developers, and students. GOSIM China 2024 and the CSDN 1024 Programmer Fest Week promise to be an exciting and informative event for anyone interested in the latest innovations in the open-source projects and communities.ScheduleLocationThe Palace Garden Hotel BeijingThe Palace Garden Hotel Beijing is located approximately 38 km (24 mi) from Beijing Capital International Airport.Diners enjoy Chinese food at the hotel restaurant. In their spare time, guests can unwind with a drink in the bar. Recreational facilities include a gym and an indoor swimming pool. Those wanting to relax can make use of the hot spring. Palace Garden Hotel Beijing provides Wi-Fi in public areas as well as parking on site. Website: http://en.palacegardenhotel.cnLocation: Road East, 800 Meters Southward from the Intersection of Yongfeng Road and,Haidian District,Beijing,BeijingMore InformationDiscoverGOSIM ScheduleJoin us for six exciting conference tracks, with full agenda, session times, topics, and speakers coming soon. Don't miss out on these dynamic sessions!Rust Programming LanguageApp Development SummitAI Models & InfraEmbodied AINext Generation InternetNext Generation MediaXR Summit 8:00 amClosing RemarksIn-personOnlineJessica JohnsonMain HallView details9:00 amNetworking SessionOnlineMichael DavisConference Room AView details10:00 amWorkshop SessionOnlineEmily JohnsonConference Room BView detailsInspiringKeynote Speakers Who Will Ignite Your PassionGet ready to be inspired by our incredible lineup of keynote speakers. These industry leaders will share their expertise and insights, leaving you motivated and ready to take on new challenges.Meet the ExpertsLearn from the best in the industry and gain valuable insights.Discover OpportunitiesExplore new business prospects and connect with potential partners.See SpeakersCall For ProposalsShare Your Ideas and Inspire OthersWe invite you to submit your proposals for talks and workshops at GOSIM. This is your chance to share your expertise and contribute to the conference program.Become a Sponsor and Showcase Your BrandUnlock unique marketing opportunities and gain exposure by sponsoring GOSIM. As a sponsor, you'll reach a diverse audience of industry professionals and position your brand as a leader in the field.BenefitsIncreased brand visibility through logo placement and recognitionPerksExclusive access to networking events and VIP sessionsContact UsSee SponsorsJoinParticipate in the Hackathon and Showcase 