title = "Workshops"
full_description = "october 17-18日, 2024WorkshopsWorkshop covering Makepad, Cangjie, Rust Compiler, Software-Defined Vehicles, Embedded Rust, Triton Language and vLLM, and W3C DID ForumMakepad App Dev LabCangjie Programming LanguageRust Compiler LabSoftware Defined Vehicle SummitEmbedded Rust Workshop/LabTriton Language & vLLMW3C DID ForumOpen Source Education ForumFlutter Hands-OnDateOctober 17, 2024LengthHalf DayMakepad App Dev Lab: Building Cross-Platform Apps From Scratch‍In the Makepad App Dev Lab, you’ll have the opportunity to take a deep dive into how to build a cross-platform application from scratch. This workshop features a hands-on lab where you will:Explore the architecture and design principles behind Makepad’s GUI Framework.Participate in a hands-on lab to build a GUI application from simple widgets and turn it into a full featured application.Requirements:Intermediate-level Rust language experienceRust Development EnvironmentText editor or IDE (VSCode: https://code.visualstudio.com/docs/languages/rust or similar)This is an introduction the Makepad UI framework, therefore no Makepad knowledge is needed.‍This workshop is perfect for developers looking to learn Makepad and enhance their skills by creating custom applications through practical experience.‍Join us to experience the power of Makepad development first hand!TimeSession10:10Morning BreakTime10:10TrackMakepad App Dev WorkshopSpeakers20 Minutes BreakTime10:1010:30Makepad in Action: Building your First ApplicationTime10:30TrackMakepad App Dev WorkshopSpeakersJulian Montes de OcaThis hands-on workshop introduces the power and flexibility of Makepad, a cutting-edge UI rust framework for cross-platform development. Participants will: Learn the core concepts of Makepad's GUI Framework Build a functional application from simple widgets to advanced features Implement modern UI elements and interactions Gain practical experience applicable to both mobile and desktop platforms Suitable for developers of all levels, from beginners to experienced programmers. By the end of the workshop, you'll have created your own cross-platform application and acquired the skills to continue developing with Makepad.Time10:3012:30Lunch BreakTime12:30TrackMakepad App Dev WorkshopSpeakersTime12:30DateOctober 17, 2024LengthHalf Day‍Details coming soon...Timesession12:30Lunch BreakTime12:30TrackCangjie LanguageSpeakersTime12:3014:00A New Generation of Programming Language for All-Scenario Applications - CangjieTime14:00TrackCangjie LanguageSpeakersXin DongAn overall introduction to Cangjie, a new generation of programming language for all-scenario applicationsTime14:0014:25Introduction of Key Technology of Cangjie Assisting in Efficient Hongmeng Native Application DevelopmentTime14:25TrackCangjie LanguageSpeakersXiao XuIntroducing the key technologies involved in Cangjie Hongmeng application developmentTime14:2514:50Cangjie's Development Practice in Native Applications for HongmengTime14:50TrackCangjie LanguageSpeakersJialiang TanThis article introduces how to use Cangjie to develop Hongmeng native applications, and provides a reference for developers to develop Cangjie version of Hongmeng applications.Time14:5015:15Cangjie Language Open Source Microservice Framework Development Practice SharingTime15:15TrackCangjie LanguageSpeakersGang ZhaoCangjie language, with its unique syntax and powerful functions, has brought new vitality to the field of programming. Combining the flexibility and scalability of microservice architecture, while exploring the boundaries of modern software development, an open source microservice framework based on Cangjie language was open sourced. This project aims to combine the characteristics of Cangjie language with the advantages of microservice architecture to provide developers with an efficient, reliable and easy-to-maintain solution, whether it is a highly customizable Internet application or an enterprise-level solution that requires stable operation, hoping to create a development environment that can adapt to rapidly changing needs.Time15:1515:50ICBC Hongmeng Native Application Cangjie Development PracticeTime15:50TrackCangjie LanguageSpeakersJian ZhangShare ICBC's practical experience in developing Cangjie, the native application of Hongmeng, from the aspects of pilot scenarios and implementation plans.Time15:5016:10Cangjie Development Practice for Leetcode Hongmeng Native Application Time16:10TrackCangjie LanguageSpeakersYuxin EShare the practice of developing Leetcode applications on Hongmeng using the Cangjie language.Time16:1016:30Sharing Development of Enhanced Multi-Factor Identity Authentication Components in Hongmeng TEE Environment PKI ArchitectureTime16:30TrackCangjie LanguageSpeakersYanying LiCangjie Programming Language + Hongmeng Operating System Case SharingTime16:3016:50Cangjie Development Practice of Weaver Software's Hongmeng Native Application: EMobile10Time16:50TrackCangjie LanguageSpeakersZeyu HanIntroducing the development of the Weaver Software's Hongmeng native application EMobile10 Cangjie and sharing the experience of using CangjieTime16:5017:10Cangjie for InfoQTime17:10TrackCangjie LanguageSpeakersYunbo ZhangInfoQ Cangjie PracticeTime17:10DateOctober 18, 2024LengthHalf DayLab: Contributing to the Rust Compiler Workshop‍Contributing to a project like the Rust compiler can be very challenging. Come and join us, as we try to motivate and guide you through the resources, processes, documentation and issues/code to help you start contributing to the compiler. Requirements:Intermediate-level Rust language experience (we're not going to teach Rust - we will guide you on compiler internals)Laptop capable of building a compilerRust Development EnvironmentText editor or IDE (VSCode: https://code.visualstudio.com/docs/languages/rust or similar)Git (and basic Git knowledge)(Optional) clone the Rust compiler (https://github.com/rust-lang/rust.git) and build/testUseful guide: https://rustc-dev-guide.rust-lang.org/building/how-to-build-and-run.html (1.1, 1.2, 1.3)‍This workshop is ideal for developers interested in contributing to Rust’s evolution and expanding their expertise in compiler design.‍Join us to uncover the inner workings of the Rust compiler and start your journey as a contributor!TimeSession12:30Lunch BreakTime12:30TrackRust Compiler WorkshopSpeakersTime12:3014:00Contributing to the Rust Compiler WorkshopTime14:00TrackRust Compiler WorkshopSpeakersSantiago PastorinoJack HueyContributing to a project like the Rust compiler can be very challenging. Come and join us, as we try to motivate and guide you through the resources, processes, documentation and issues/code to help you start contributing to the compiler.Time14:00DateOctober 17-18 2024Length10/17 (Half Day), 10/18 (Full Day)SDV Workshop: Building the Next Generation of Software-Defined Vehicles‍The SDV Workshop offers a deep dive into the essential open-source technologies driving the future of software-defined vehicles (SDVs). Key topics include:The certified Rust language, capable of handling the most critical and innovative automotive applications.Scalable messaging solutions that range from intra-vehicle communication to V2X (vehicle-to-everything) applications.Dataflow computing frameworks integrated with a full-stack autonomous driving solution, enabling advanced perception, planning, and control systems.Simulation solutions with software-in-the-loop (SIL) and hardware-in-the-loop (HIL) capabilities, covering validation for autonomous driving systems.The workshop will also feature a real-world digital twin demo, showcasing the power of open-source technologies in creating a full-stack SDV solution.‍Join us to explore how these innovations are transforming the future of mobility!October 17TimeSession12:30Lunch BreakTime12:30TrackSDV Summit WorkshopSpeakersTime12:3014:00Simulation, testing, verification, and validation of autonomous drivingTime14:00TrackSDV Summit WorkshopSpeakersZijiang YangSIMULATION, TESTING, VERIFICATION, AND VALIDATION(STV2) is a set of processes that support the development, validation, and operation of autonomous driving systems from the perspectives of safety and cost. The scope, architecture, and critical components of STV2, as well as how the full lifecycle of autonomous driving systems is covered in this talk. STV2 is part of the infrastructure and tooling layer of autonomous driving architecture.Time14:0014:30Introduction to ChinaEV100Time14:30TrackSDV Summit WorkshopSpeakersJason ZhangChinaEV100 is a conference platform for interdisciplinary, cross industry, cross departmental, cross ownership, unofficial, and non-profit policy and academic research in the field of electric and intelligent vehicles in China; A high-end exchange platform voluntarily participated by government officials, experts, scholars, and industry professionals; It is a third-party think tank of the country in the field of automobiles.Time14:3015:00Afternoon BreakTime15:00TrackSDV Summit WorkshopSpeakers30 Minutes Break (SDV Workshop only)Time15:0015:30Scenario Representations for Autonomous Driving Simulation and the Oasis Simulation SystemTime15:30TrackSDV Summit WorkshopSpeakersYuxi PanThe standardization effort on scenario representations for autonomous driving simulation will be introduced. Various elements pertaining to a simulation system will be discussed, e.g., sensor models, vehicle dynamics models and agent behavior models, etc., while taking as example the Oasis Simulation System.Time15:3016:00The Open and Collaborative Innovation in automotive operating system empowers the innovation and development of the automotive industryTime16:00TrackSDV Summit WorkshopSpeakersHao LiangAmid the wave of technological innovation in the automotive industry, the secure and controllable automotive operating systems has become central. Yet, the complexity of the technology, coupled with substantial investments and lengthy development cycles, has created a rift between skilled personnel and technological advancements. Addressing industry issues, new OEM requirements, and international trends and policies, an open-source development path is a reasonable approach. This presentation will concentrate on open-source empowerment for automotive OS, the iSOFT open-source projects, and the collaborative development plans.Time16:0016:30CARLA Open Source Project UpdatesTime16:30TrackSDV Summit WorkshopSpeakersGerman Ros SanchezZijiang YangCARLA New Release & Features. CARLA is an open-source simulator for autonomous driving research. CARLA has been developed from the ground up to support development, training, and validation of autonomous driving systems. Time16:30October 18TimeSession9:30Eclipse SDV - Open Collaboration in the Automotive IndustryTime9:30TrackSDV Summit WorkshopSpeakersMichael PlaggeMore and more relevant players see an open collaboration as the way to success to tackle the challenges of the increasing complexity of the software in modern cars. By jointly developing the non-differentiating parts of the automotive software stack the complexity and number of variants the automotive ecosystem needs to deal with can be significantly reduced. The Eclipse SDV Working Group develops a huge momentum at the moment and after 2,5 years down the road this presentation will give an overview on the current status quo of the activities.Time9:3010:00Introduction to Autoware Open AD KitTime10:00TrackSDV Summit WorkshopSpeakersRyohsuke MitsudomeOpen AD Kit is an autonomous driving development starter kit that aims to democratize autonomous drive systems by bringing the cloud and edge closer together. The presenter will describe the architecture and the current status of the Open AD Kit.Time10:0010:30Morning BreakTime10:30TrackSDV Summit WorkshopSpeakers30 Minutes Break (Workshop only)Time10:3011:00Leveraging CARLA to create End-to-End Autonomous Driving SolutionsTime11:00TrackSDV Summit WorkshopSpeakersGerman Ros SanchezEnd-to-end solutions are increasingly becoming the standard in autonomous driving, surpassing traditional modular approaches. In this talk, we demonstrate how the CARLA open-source simulator can be employed to train and validate end-to-end autonomous driving solutions. CARLA provides a versatile platform for simulating diverse scenarios, allowing researchers and engineers to develop and test AI models in a safe, controlled environment. Additionally, we discuss the critical process of transferring these solutions from simulation to real-world vehicles, exploring the challenges and successes encountered in bridging the gap between virtual and physical autonomy. Attendees will gain insights into how CARLA accelerates the development cycle for autonomous driving and facilitates the deployment of robust, real-world applications.Time11:0011:30The Open Source Challenge of Intelligent Driving Operating SystemTime11:30TrackSDV Summit WorkshopSpeakersZhaozhi TengOpenSDV intelligent driving operating system distribution, is a project to solve the basic system needs of the automotive industry, is a general intelligent driving system jointly developed by automobile enterprises, developers and universities.Time11:3012:00Tackling Vehicle to Anything Communication (V2X) Challenges with Eclipse ZenohTime12:00TrackSDV Summit WorkshopSpeakersJulien LoudetEclipse Zenoh has been identified as a key protocol in automotive, from in-vehicle communication to Vehicle-to-Everything applications. This talk will highlight the features that made it reach this forefront position.Time12:0012:30Lunch BreakTime12:30TrackSDV Summit WorkshopSpeakersTime12:3014:00Eclipse uProtocol: An Open Source Software Defined Vehicle FrameworkTime14:00TrackSDV Summit WorkshopSpeakersPete LeVasseurSoftware Defined Vehicle (SDV) can be a bit ambiguous as a term. In this talk we'll go over how we implemented an open source framework to enable software to be written against a single set of APIs and be portable to other in-vehicle, cloud, and mobile devices. We designed a set of basic APIs which can be written over top of almost any protocol to make the design flexible to future automotive and other industry needs, with built-in idioms for RPC, PubSub, and notifications.Time14:0014:30Dora: Zero-copy Message Passing Across Languages using Apache ArrowTime14:30TrackSDV Summit WorkshopSpeakersPhilipp OppermannDora is a framework for developing dataflow-based robotic applications. In this talk, we explain how Dora implements zero-copy message passing between different programming languages using shared memory and the Apache Arrow data format.Time14:3015:00Afternoon BreakTime15:00TrackSDV Summit WorkshopSpeakers30 Minutes Break (SDV Workshop only)Time15:0015:30The Application of Dora in the Autonomous DrivingTime15:30TrackSDV Summit WorkshopSpeakersRuping CenThis presentation mainly reports on the process of porting the autonomous driving framework Autoware in the Dora environment and implementing autonomous driving on a real vehicle"
