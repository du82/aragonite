title = "Code of Conduct"
full_description = 'Last Updated 07/08/2024行为准则预期的行为以真实而积极的方式参与。这样做可以为会议创造一个积极的环境。在言论和行动中保持体贴和尊重。在冲突之前尝试协作。避免贬低、歧视或骚扰行为和言论。注意周围环境和其他参与者。如果您发现危险情况、有人处于困境或违反本行为准则的行为，即使这些行为似乎无关紧要，也要提醒社区领袖。不可接受的行为不可接受的行为包括：我们社区的任何参与者在网上、所有相关活动中以及在社区业务背景下进行的一对一沟通中进行的恐吓、骚扰、虐待、歧视、贬损或贬损性言论或行为。社区活动场地可以与公众共用；请尊重这些地点的所有顾客。骚扰包括：与性别、性取向、种族、宗教、残疾相关的有害或偏见的口头或书面评论；不当使用裸体和/或性图片（包括演示幻灯片）；不当的暴力描述（包括演示幻灯片）；故意恐吓、跟踪或关注；骚扰性摄影或录音；持续干扰谈话或其他活动；不当的身体接触和不受欢迎的性关注。信息共享所有会谈都将录音。不可接受行为的后果任何社区成员（包括赞助商和拥有决策权的人）的不可接受的行为都是不可容忍的。任何被要求停止不可接受行为的人都应立即遵守规定。如果社区成员从事不可接受的行为，社区组织者可以采取他们认为适当的任何行动，包括临时禁止或永久驱逐出社区，恕不另行通知（如果是付费活动，则不予退款）。如果您目睹或遭受不可接受的行为如果您遭受或目睹不可接受的行为，或者有任何其他疑虑，请尽快通知社区组织者。您可以在本页底部找到本行为准则的每位支持者的联系组织者名单。此外，社区组织者可以帮助社区成员与当地执法部门互动，或以其他方式帮助那些遭受不可接受行为的人感到安全。在面对面活动的背景下，组织者还将根据遇险者的需要提供护送人员。处理申诉如果您认为自己因违反本行为准则而受到虚假或不公平的指控，则应将您的申诉简要说明通知活动组织者。您的申诉将根据我们现有的管理政策进行处理。范围我们希望所有社区参与者（付费或其他贡献者、赞助商和其他嘉宾）在所有社区场所（在线和面对面）以及与社区业务有关的一对一交流中遵守本行为准则。图片库不管怎么样，我们都很友善，祝你好运。{ "items": [], "group": "" }回顾按照以下说明确保兼容性：为上面的部分 div 设置背景颜色以隐藏进度线溢出。将 z-index-2 类添加到上面的分区 div 中，以隐藏下方时间轴部分中溢出的进度线。'
year_published = 2025
