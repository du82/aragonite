title = "Code of Conduct"
full_description = 'Last Updated 07/08/2024Code of ConductEXPECTED BEHAVIORParticipate in an authentic and active way. In doing so, you create a positive environment for the conference.Exercise consideration and respect in your speech and actions.Attempt collaboration before conflict.Refrain from demeaning, discriminatory, or harassing behavior and speech.Be mindful of your surroundings and of your fellow participants. Alert community leaders if you notice a dangerous situation, someone in distress, or violations of this Code of Conduct, even if they seem inconsequential.UNACCEPTABLE BEHAVIORUnacceptable behaviors include: intimidating, harassing, abusive, discriminatory, derogatory or demeaning speech or actions by any participant in our community online, at all related events and in one-on-one communications carried out in the context of community business. Community event venues may be shared with members of the public; please be respectful to all patrons of these locations.Harassment includes: harmful or prejudicial verbal or written comments related to gender, sexual orientation, race, religion, disability; inappropriate use of nudity and/or sexual images (including presentation slides); inappropriate depictions of violence (including presentation slides); deliberate intimidation, stalking or following; harassing photography or recording; sustained disruption of talks or other events; inappropriate physical contact, and unwelcome sexual attention.INFORMATION SHARINGAll the talks will be recorded.CONSEQUENCES OF UNACCEPTABLE BEHAVIORUnacceptable behavior from any community member, including sponsors and those with decision-making authority, will not be tolerated. Anyone asked to stop unacceptable behavior is expected to comply immediately.If a community member engages in unacceptable behavior, the community organizers may take any action they deem appropriate, up to and including a temporary ban or permanent expulsion from the community without warning (and without refund in the case of a paid event). If You Witness or Are Subject to Unacceptable BehaviorIf you are subject to or witness unacceptable behavior, or have any other concerns, please notify a community organizer as soon as possible. You can find a list of organizers to contact for each of the supporters of this code of conduct at the bottom of this page. Additionally, community organizers are available to help community members engage with local law enforcement or to otherwise help those experiencing unacceptable behavior feel safe. In the context of in-person events, organizers will also provide escorts as desired by the person experiencing distress.ADDRESSING GRIEVANCESIf you feel you have been falsely or unfairly accused of violating this Code of Conduct, you should notify one of the event organizers with a concise description of your grievance. Your grievance will be handled in accordance with our existing governing policies. ScopeWe expect all community participants (contributors, paid or otherwise; sponsors; and other guests) to abide by this Code of Conduct in all community venues—online and in-person—as well as in all one-on-one communications pertaining to community business.Image GalleryLorem ipsum dolor sit amet, consectetur adipiscing elit.{ "items": [], "group": "" }RecapEnsure compatibility by following these instructions:Set a background color for the section div above to hide the progress line overflow.Add the z-index-2 class to the section div above to hide the overflowing progress line from the Timeline section below.'
