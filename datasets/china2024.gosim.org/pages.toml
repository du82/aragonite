title = "Speakers"
full_description = "October 17-18, 2024Speakers Who Will Ignite Your PassionGet ready to be inspired by our incredible lineup of great speakers. These industry leaders will share their expertise and insights, leaving you motivated and ready to take on new challenges.All SpeakersRust Programming LanguageApp Development SummitAI Models & InfraEmbodied AINext Generation InternetNext Generation Media & DeviceEvan AlmloffSoftware DeveloperShow MoreCompanyDioxusLabsBioEvan Almloff is a software engineer at DioxusLabs. In his current role, he is working on making fullstack UI in Rust easy through ergonomic design and tooling while maintaining type safety throughout the application. He has created several key libraries in the Rust web development ecosystem including Manganis, a library for asset collection and optimization, and sledgehammer-bindgen, the fastest Javascript binding library for Rust. He is also the creator of Kalosm, an open-source framework for controllable language, audio, and image models in Rust.Evan AlmloffSoftware DeveloperOrganizationDioxusLabsBioEvan Almloff is a software engineer at DioxusLabs. In his current role, he is working on making fullstack UI in Rust easy through ergonomic design and tooling while maintaining type safety throughout the application. He has created several key libraries in the Rust web development ecosystem including Manganis, a library for asset collection and optimization, and sledgehammer-bindgen, the fastest Javascript binding library for Rust. He is also the creator of Kalosm, an open-source framework for controllable language, audio, and image models in Rust.Session(s)Structured Text Generation with Incremental Parsers in RustAmanieu d'AntrasRust Library Team Co-leadShow MoreCompanyRust Library TeamBioAmanieu is a developer on the Rust project who co-leads the library team and leads the inline assembly project group. His specialty is binary translation, on which he wrote his PhD dissertation and subsequently founded a startup to continue working on the technology.Amanieu d'AntrasRust Library Team Co-leadOrganizationRust Library TeamBioAmanieu is a developer on the Rust project who co-leads the library team and leads the inline assembly project group. His specialty is binary translation, on which he wrote his PhD dissertation and subsequently founded a startup to continue working on the technology.Session(s)Register Allocation in CraneliftRik ArendsFounder of MakepadShow MoreCompanyMakepadBioWith 20+ years’ experience as a C/C++, JavaScript and more recently Rust developer, I've always been excited by using computation for visuals and audio. For this to work you need performance, and a smooth workflow enabled by the right tooling. After having everything I wanted with C except stable code I moved to JavaScript and web technologies. However, this never got to the point of being able to make fast applications that use modern CPU and GPU power. Now with Rust we have a new chance. I've been an entrepreneur my entire life building VJ software in the 00's, then web UI technology and web IDEs with Cloud9, and am now reimagining the developer workflow in Rust with Makepad.Rik ArendsFounder of MakepadOrganizationMakepadBioWith 20+ years’ experience as a C/C++, JavaScript and more recently Rust developer, I've always been excited by using computation for visuals and audio. For this to work you need performance, and a smooth workflow enabled by the right tooling. After having everything I wanted with C except stable code I moved to JavaScript and web technologies. However, this never got to the point of being able to make fast applications that use modern CPU and GPU power. Now with Rust we have a new chance. I've been an entrepreneur my entire life building VJ software in the 00's, then web UI technology and web IDEs with Cloud9, and am now reimagining the developer workflow in Rust with Makepad.Session(s)Makepad: Visual Application Design in RustYanxing BaGeneral Manager of Open Source Community Development DepartmentShow MoreCompanyShenzhen KaihongBioGeneral Manager of Shenzhen Kaihong Open Source Community Development Department, operating system expert, with many years of rich experience in embedded/mobile system software development and technical team management. Member of OpenHarmony Project Management Committee (PMC), head of Robot TSG of OpenHarmony Technical Steering Committee, winner of OpenHarmony Community Active Star, core code contributor, and outstanding contributor, etc.Yanxing BaGeneral Manager of Open Source Community Development DepartmentOrganizationShenzhen KaihongBioGeneral Manager of Shenzhen Kaihong Open Source Community Development Department, operating system expert, with many years of rich experience in embedded/mobile system software development and technical team management. Member of OpenHarmony Project Management Committee (PMC), head of Robot TSG of OpenHarmony Technical Steering Committee, winner of OpenHarmony Community Active Star, core code contributor, and outstanding contributor, etc.Session(s)Build an Open Source Operating System for Robots Based on OpenHarmony.Jim BlandyAuthor of Programming RustShow MoreCompanyMozillaBioJim Blandy has been writing Free software since 1990. He has been a maintainer of GNU Emacs and GDB, and is one of the original designers of the Subversion version control system. With Jason Orendorff and Nora Tindall, he is a co-author of Programming Rust, published by O'Reilly. He joined Mozilla in 2008, and is currently technical lead of the Firefox WebGPU team, a member of the W3C WebGPU Working Group, and a leading contributor to the WGPU Rust crates. He lives in Portland, Oregon.Jim BlandyAuthor of Programming RustOrganizationMozillaBioJim Blandy has been writing Free software since 1990. He has been a maintainer of GNU Emacs and GDB, and is one of the original designers of the Subversion version control system. With Jason Orendorff and Nora Tindall, he is a co-author of Programming Rust, published by O'Reilly. He joined Mozilla in 2008, and is currently technical lead of the Firefox WebGPU team, a member of the W3C WebGPU Working Group, and a leading contributor to the WGPU Rust crates. He lives in Portland, Oregon.Session(s)WGPU: Modern GPU Programming In RustKevin BoosPrincipal Architect at FutureweiShow MoreCompanyFuturewei TechnologiesBioKevin Boos is currently a software architect at Futurewei and the tech lead of Project Robius, an open-source Rust framework for developing immersive, fully-featured applications in Rust that run seamlessly across multiple platforms, including mobile. Previously, he created Theseus OS, an open-source OS written from scratch in Rust that rethinks the structure and implementation strategy of OSes, with an emphasis on maximizing language mechanisms for compile-time safety and verifiable correctness. Kevin obtained his PhD from Rice University with a focus on OS design, with other interests spanning the domains of I/O virtualization, device drivers, mobile VR, static analysis, and safe languages.Kevin BoosPrincipal Architect at FutureweiOrganizationFuturewei TechnologiesBioKevin Boos is currently a software architect at Futurewei and the tech lead of Project Robius, an open-source Rust framework for developing immersive, fully-featured applications in Rust that run seamlessly across multiple platforms, including mobile. Previously, he created Theseus OS, an open-source OS written from scratch in Rust that rethinks the structure and implementation strategy of OSes, with an emphasis on maximizing language mechanisms for compile-time safety and verifiable correctness. Kevin obtained his PhD from Rice University with a focus on OS design, with other interests spanning the domains of I/O virtualization, device drivers, mobile VR, static analysis, and safe languages.Session(s)Robrix: a Pure Rust Multi-Platform Matrix Client and MoreGary BradskiFounder of OpenCVShow MoreCompanyOpenCVBioGary is founder & chairman of OpenCV.org (400M downloads in 2023). He was a professor at Stanford CS (2006-2012). Gary also ran the computer vision team for Stanley, the robot that won the DARPA Grand Challenge, now in the Smithsonian Museum in D.C which started the modern autonomous driving industry. Gary has founded 5 Startups and a nonprofit: OpenCV.org and currently sits on several boards and advisorships. He is an active angel investor, his most recent exit was Lambda Labs 2024 2nd market in $1.5B C round where he was the first investor. Gary has about 100 patents and papers including several best papers. He won the 2014 IEEE PAMI prize for contributions to the field of computer vision and won the 2021 CCV Helmholtz Prize Test of Time Award for his “ORB” paper.Gary BradskiFounder of OpenCVOrganizationOpenCVBioGary is founder & chairman of OpenCV.org (400M downloads in 2023). He was a professor at Stanford CS (2006-2012). Gary also ran the computer vision team for Stanley, the robot that won the DARPA Grand Challenge, now in the Smithsonian Museum in D.C which started the modern autonomous driving industry. Gary has founded 5 Startups and a nonprofit: OpenCV.org and currently sits on several boards and advisorships. He is an active angel investor, his most recent exit was Lambda Labs 2024 2nd market in $1.5B C round where he was the first investor. Gary has about 100 patents and papers including several best papers. He won the 2014 IEEE PAMI prize for contributions to the field of computer vision and won the 2021 CCV Helmholtz Prize Test of Time Award for his “ORB” paper.Session(s)OpenCV and Spatial IntelligenceNico BurnsCore Contributor of Taffy & BlitzShow MoreCompanyProject Taffy & BlitzBioNico is currently working on creating an ecosystem of crates for building UI frameworks and web engines in Rust through his work on the Taffy, Blitz and Servo projects (building on his previous experience with UI as a full-stack web developer). His work has a focus on modularity and fostering collaboration/coordination between projects wherever possible.Nico BurnsCore Contributor of Taffy & BlitzOrganizationProject Taffy & BlitzBioNico is currently working on creating an ecosystem of crates for building UI frameworks and web engines in Rust through his work on the Taffy, Blitz and Servo projects (building on his previous experience with UI as a full-stack web developer). His work has a focus on modularity and fostering collaboration/coordination between projects wherever possible.Session(s)Blitz: Blurring the Lines Between Web and NativeShu CaiFlomesh Co-FounderShow MoreCompanyFlomesh.ioBioOpen Source Geek, Flomesh Co-FounderShu CaiFlomesh Co-FounderOrganizationFlomesh.ioBioOpen Source Geek, Flomesh Co-FounderSession(s)Moxin: Enhancing the Decentralized Distribution Capabilities of Large ModelsKangying CaiSenior Researcher in Graphics Standards at HuaweiShow MoreCompanyHuawei TechnologiesBioKangying Cai, a PhD graduate from the Institute of Software, Chinese Academy of Sciences, has many years of experience in graphics technology research and standardization. She joined Huawei in 2018 and is currently a senior researcher in graphics standards. She is mainly responsible for the research and standardization of graphics standard technologies including graphics APIs, 3D asset data formats, and encoding and decoding technologies. She currently leads a team to participate in the Khronos Vulkan standardization work.Kangying CaiSenior Researcher in Graphics Standards at HuaweiOrganizationHuawei TechnologiesBioKangying Cai, a PhD graduate from the Institute of Software, Chinese Academy of Sciences, has many years of experience in graphics technology research and standardization. She joined Huawei in 2018 and is currently a senior researcher in graphics standards. She is mainly responsible for the research and standardization of graphics standard technologies including graphics APIs, 3D asset data formats, and encoding and decoding technologies. She currently leads a team to participate in the Khronos Vulkan standardization work.Session(s)No items found.Dong CaoDean of the Cognitive Intelligence Research Institute at Deepblue Technology (Shanghai) Co., Ltd.Show MoreCompanyOpenCSGBioDong CAO, Ph.D. from Nanjing University of Science and Technology, Post-doctoral (Research direction: Artificial Intelligence and Cognitive Reasoning). Senior Engineer (specialized in Artificial Intelligence). Senior Member of the Chinese Institute of Electronics, IEEE Membership, ACM Membership, Senior Member of the Chinese Computer Society. Member of the Expert Group for the Trustworthy Indicator System of Large Models in Shanghai, Member of the Expert Committee of the Shanghai Industrial Internet Industry Promotion Center. With over 10 years of research and development experience in the artificial intelligence industry, he has published more than 30 papers as the first author in the fields of cognitive intelligence, embodied intelligence, and multimodal research, including 21 indexed by SCI and EI. He has served as a senior algorithm expert at Wind Information Technology Co., Ltd., responsible for the research and development of cognitive reasoning and question-answering systems, and as the dean of the Cognitive Intelligence Research Institute at Deepblue Technology (Shanghai) Co., Ltd., leading the research and development of visual reasoning and cognitive intelligence algorithms.Dong CaoDean of the Cognitive Intelligence Research Institute at Deepblue Technology (Shanghai) Co., Ltd.OrganizationOpenCSGBioDong CAO, Ph.D. from Nanjing University of Science and Technology, Post-doctoral (Research direction: Artificial Intelligence and Cognitive Reasoning). Senior Engineer (specialized in Artificial Intelligence). Senior Member of the Chinese Institute of Electronics, IEEE Membership, ACM Membership, Senior Member of the Chinese Computer Society. Member of the Expert Group for the Trustworthy Indicator System of Large Models in Shanghai, Member of the Expert Committe