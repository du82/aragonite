["https://china2024.gosim.org/schedule-october-18"]
title = "Schedule - October 18"
full_description = '''Schedule by dateOctober 18 ScheduleJoin us for six exciting conference tracks, with full agenda, session times, topics, and speakers coming soon. Don't miss out on these dynamic sessions! (More sessions continuously added)October 18TimeSession189:30AIRSHIP: Empowering Intelligent Robots through Embodied AI, Stronger United, Yet Distinct.Time9:30TrackEmbodied AISpeakersShaoshan LiuSlidesScribdVideoYoutubeAIRSHIP has been developed to tackle the problem of software complexity in embodied AI. Its mission is to provide an easy-to-deploy software stack that empowers a wide variety of intelligent robots, thereby facilitating scalability and accelerating the commercialization of the embodied AI sector. AIRSHIP takes inspiration from Android, which played a crucial role in the mobile computing revolution by offering an open-source, flexible platform. Android enabled a wide range of device manufacturers to create smartphones and tablets at different price points, sparking rapid innovation and competition. This led to the widespread availability of affordable and powerful mobile devices. Android's robust ecosystem, supported by a vast library of apps through the Google Play Store, allowed developers to reach a global audience, significantly advancing mobile technology adoption. Similar to Android, AIRSHIP offers both software and hardware specifications, enabling robotic builders to develop complete embodied AI systems for a range of scenarios, including home, retail, and warehouse environments.Time9:30189:30vLLM: Easy, Fast, and Cheap LLM Serving for EveryoneTime9:30TrackAI Models & InfraSpeakersKaichao YouSlidesScribdVideoYoutubevLLM is a fast and easy-to-use library for LLM inference and serving. In this talk, I will briefly introduce the evolution of the vLLM project, the open-source community behind it, and highlight some features that are interesting to many users.Time9:30189:30Eclipse SDV - Open Collaboration in the Automotive IndustryTime9:30TrackWorkshop: SDV SummitSpeakersMichael PlaggeSlidesScribdVideoYoutubeMore and more relevant players see an open collaboration as the way to success to tackle the challenges of the increasing complexity of the software in modern cars. By jointly developing the non-differentiating parts of the automotive software stack the complexity and number of variants the automotive ecosystem needs to deal with can be significantly reduced. The Eclipse SDV Working Group develops a huge momentum at the moment and after 2,5 years down the road this presentation will give an overview on the current status quo of the activities.Time9:30189:30Rust in Embedded Critical Systems: The Journey from Innovation to Production.Time9:30TrackWorkshop: Embedded RustSpeakersTiago ManczakSlidesScribdVideoYoutubeThe technical aspects of adopting a new technology on critical systems are just one consideration in moving from feasibility to production. Rust has a clear technology advantage, but applying it to critical systems requires a structured plan covering tooling, verification, traceability, and certification. This talk will present the steps that led Infineon to adopt Rust in production, as well as the gaps that still need to be addressed by the industry and the Rust project.Time9:30189:30Metaverse Standards Forum OverviewTime9:30TrackNext Generation Media & DeviceSpeakersDennis FuSlidesScribdVideoYoutubeMetaverse Standards Forum is one of the most important and also largest global industry consortium focusing on Metaverse standards development. The organization is dedicated to an open metaverse development. This overview will give audiences information regarding its history and vision, as well as a snapshot of its current activities, and progress.Time9:30189:30Makepad: Visual Application Design in RustTime9:30TrackApp DevelopmentSpeakersRik ArendsSlidesScribdVideoYoutubeIn this talk I will show the new MIT licensed visual application IDE and design tool Makepad Studio. We will go through local-model AI assisted programming and an early peek at our visual UI designer. Makepad is a UI framework and IDE/designtool combination for Rust. Makepad runs natively on Web, Android, iOS, macOS, Linux and Windows using a GPU accelerated stack. With a focus on staying light-weight a complete application still compiles in 10 seconds with all dependencies on a modern computer.Time9:30189:30Ferrocene - The present and future of Rust in SafetyTime9:30TrackRust Programming LanguageSpeakersFlorian GilcherSlidesScribdVideoYoutubeRust is a relative new language - released in 2015, it has taken the software programming word surprisingly swiftly. It is surprising that - not even 10 years later - we have ongoing projects and initiatives in the Functional Safety/SDV space. Rust is even seen as a front runner of open source safety initiatives. How did that happen? This talk provides an overview of currently ongoing initiatives, an assessment of challenges and an outlook into the future.Time9:30189:30Wasm as the Universal Runtime for the API-First and Agentic InternetTime9:30TrackNext Generation InternetSpeakersMichael YuanSlidesScribdVideoYoutubeWasm as emerged as a universal runtime environment that is cross-platform, hardware portable and language agnostic. It can be embedded into many different types of applications or SaaS as widgets or extensions. In this talk, we will discuss popular use cases of Wasm in programming the next-gen Internet from serverless functions, workflow automation, web3 smart contracts to AI agents.Time9:301810:00Introduction to Autoware Open AD KitTime10:00TrackWorkshop: SDV SummitSpeakersRyohsuke MitsudomeSlidesScribdVideoYoutubeOpen AD Kit is an autonomous driving development starter kit that aims to democratize autonomous drive systems by bringing the cloud and edge closer together. The presenter will describe the architecture and the current status of the Open AD Kit.Time10:001810:00busd: There is a New D-Bus Broker in TownTime10:00TrackWorkshop: Embedded RustSpeakersZeeshan Ali KhanSlidesScribdVideoYoutubeD-Bus is an IPC mechanism that is very ubiquitous on Linux systems everywhere (desktop, cloud and embedded). It is the mechanism you'd use to communicate with many of the core Linux userspace subsystems, such as systemd, NetworkManager etc. Traditionally, most of these services have been written in C, a language known for its lack of safety and expressiveness. In the past years, Zeeshan has developed a library, called zbus for enabling implementation of D-Bus services and clients in a programming language designed for safety: Rust. zbus has become the go-to library for writing D-Bus code in Rust. While that is major step forward, the communication typically still happens through a broker and the two major broker implementation are both are written in C and have been stagnating for years. This is why Zeeshan has recently started working on writing a D-Bus broker based on zbus, called busd, which not only aims provide a drop-in replacement for existing brokers, but also modernize the D-Bus space by providing new features needed by apps and services, such as systemd. In this talk, Zeeshan will walk us through a summary of his journey so far, the current state of busd and his plans and dreams for the future of D-Bus.Time10:001810:10A Mocap-based Data Factory for Embodied AITime10:10TrackEmbodied AISpeakersDr.Tristan DaiSlidesScribdVideoYoutubeThe presentation will begin by discussing the relationship between motion capture (human motion) and the field of embodied AI, introducing the workflow of Noitom’s motion capture solutions applied in the embodied AI robotics sector. It will emphasize the importance and challenges of mapping of human body to the robot body within the overall workflow. Additionally, it will explain the differences between four main approaches to generating robot datasets, and finally, by showcasing success story of the industry partners of Noitom, it will once again highlight the importance and feasibility of establishing large-scale embodied AI data factories (DataFactory).Time10:101810:10How Different is Rust Code in the Linux Kernel?Time10:10TrackRust Programming LanguageSpeakersGary GuoSlidesScribdVideoYoutubeThe Linux kernel is very different from ordinary software projects, and therefore you shouldn't expect kernel Rust code to be similar to the Rust code that you're familiar with! In this talk I'll go through the basic primitives in Rust for Linux, compare them with userspace Rust, and dive into rationales that lead to their design.Time10:101810:10The Trust Spanning Protocol and Its Role for Authentic AITime10:10TrackNext Generation InternetSpeakersWenjing ChuSlidesScribdVideoYoutubeThe lack of authenticity plagues today's Internet. Imagine a world overrun with AGI agents that we can not trust, let alone control! Time is now when we must lay a solid foundation of trust for the future of AI and Internet. The success of AI adoption is not possible without the framework with which people, organizations and society can establish technical and human level trust and control. In this talk, Wenjing will introduce the cutting edge information authenticity technology around the Trust Spanning Protocol (TSP) and how it plays a pivotal role in enabling authentic AI in content generation, reasoning, and autonomous agents.Time10:101810:10The openMind application enablement kit brings a new training and inference experience for Ascend developmentTime10:10TrackAI Models & InfraSpeakersYongqiang MaSlidesScribdVideoYoutubeThe continuous development of Ascend cannot be separated from the cooperation of the open source community. As the ecological window of Ascend, the openMind tool suite focuses on providing developers with lightweight capabilities from model distribution to integrated model training and inference, reducing the development threshold of NPUs. This sharing will provide the audience with exclusive features related to openMind including the improvement of the efficiency of fusion operators and the adaptive version management of containers, the adaptation capabilities of third-party libraries in the open source community including LLaMA-Factory, and the progress of cooperation with the Magic Leap community.Time10:101810:10Kotlin Multiplatform: A Flexible Way for Cross-Platform DevelopmentTime10:10TrackApp DevelopmentSpeakersShengyou FanSlidesScribdVideoYoutubeKotlin Multiplatform has become a robust tool for cross-platform development, enabling developers to use a single programming language to build applications across mobile, desktop, web, and server platforms. In this talk, I will introduce the key concepts of Kotlin Multiplatform, demonstrate the project architecture and development workflow, and showcase the toolchain and ecosystem that support it. Additionally, we will explore learning resources and the Kotlin community. By the end of the session, you'll see why Kotlin Multiplatform is an excellent choice for cross-platform development and understand its potential.Time10:101810:10OminiX: Towards Unified Library and Acceleration Framework for Generative AI Models on Different Hardware PlatformsTime10:10TrackNext Generation Media & DeviceSpeakersYanzhi WangSlidesScribdVideoYoutubeIn the generative AI era, general users need to apply different base models, finetuned checkpoints, and LoRAs. Also the data privacy and real-time requirement will favor on-device, local deployment of large-scale generative AI models. It is desirable to develop a "plug-and-play" framework such that users can download any generative AI model, click and run on their own device. This poses significant challenge to the current AI deployment frameworks, which are typically time-consuming and requires human expertise of hardware and code generation. We present our effort of OminiX, which is a first step towards unified library and acceleartion of generative AI models across various hardware platforms. Integrating our unique front-end library and back-end instantaneous acceleration techniques, which will be open-source soon, we show capability of plug-and-play deployment and state-of-the-art acceleration of various generative AI models, starting from image generation, large language models, multi-model language models, speech generation and voice cloning, real-time chatting engine, real-time translation, video generation, real-time avatar, to name a few. This can be achieved without server, just on everyone's own platform.Time10:101810:30Morning BreakTime10:30TrackWorkshop: SDV SummitWorkshop: Embedded RustSpeakersSlidesScribdVideoYoutube30 Minutes Break (Workshop only)Time10:301810:30Flutter Handson WorkshopTime10:30TrackWorkshop: Flutter Hands-OnSpeakersKevin MooreSlidesScribdVideoYoutubeThis event is jointly held with the Beijing Google Developer Community and is suitable for Flutter beginners. Participants will complete their learning and understanding of Flutter through Google Codelabs on site. Note: To participate in this workshop, please bring a personal computer and power cord to ensure that you can access Google Codelabs.Time10:301810:50Morning BreakTime10:50TrackAI Models & InfraApp DevelopmentEmbodied AINext Generation InternetNext Generation Media & DeviceSpeakersSlidesScribdVideoYoutube20 Minutes BreakTime10:501811:00Experience Sharing on Embedded Rust Product DevelopmentTime11:00TrackWorkshop: Embedded RustSpeakersChang XuSlidesScribdVideoYoutubeFor two types of mainstream development platforms, share the experience of embedded Rust product development, and compare the differences and similarities between the programming paradigms used in traditional C/C++ embedded development.Time11:001811:00Leveraging CARLA to create End-to-End Autonomous Driving SolutionsTime11:00TrackWorkshop: SDV SummitSpeakersGerman Ros SanchezSlidesScribdVideoYoutubeEnd-to-end solutions are increasingly becoming the standard in autonomous driving, surpassing traditional modular approaches. In this talk, we demonstrate how the CARLA open-source simulator can be employed to train and validate end-to-end autonomous driving solutions. CARLA provides a versatile platform for simulating diverse scenarios, allowing researchers and engineers to develop and test AI models in a safe, controlled environment. Additionally, we discuss the critical process of transferring these solutions from simulation to real-world vehicles, exploring the challenges and successes encountered in bridging the gap between virtual and physical autonomy. Attendees will gain insights into how CARLA accelerates the development cycle for autonomous driving and facilitates the deployment of robust, real-world applications.Time11:001811:10Super Easy Fine-Tuning of Robotic Arm AI Model with dora-rsTime11:10TrackEmbodied AISpeakersXavier TaoSlidesScribdVideoYoutubeMaking robot autonomous is getting easier and easier. In today's talk, we're going to see how in couple of steps we can get started with training a model that automate our task. This is thanks to dora'''
