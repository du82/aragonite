full_description = '''Last Updated 07/08/2024Visa InformationGeneralAs of July, 2024, there's no need for a China visa for visitors from most countries. Please check your country of nationality, and your planned duration of stay to determine whether you should apply for one.‍Visa ExemptionThe government of the People's Republic of China allows holders of ordinary passports issued by some countries to travel to mainland China for business and tourist trips for up to 15, 30, 60 or 90 days without having to obtain a visa. ‍Comment Holders of ordinary passports issued of the following countries may enter China without a visa as long as their visit does not last longer than the visa-free period listed below, unless if they are allowed to extend their stay:‍Source: Wikipedia: Visa policy of mainland China‍72/144-Hour Visa-Free TransitCurrently, 38 exit-entry ports in 18 provinces, autonomous regions and municipalities directly under the Central Government of China have implemented the 72-hour or 144-hour visa-free transit policy for foreign nationals from 54 countries. ‍Comment These countries are Albania, Argentina, Australia, Austria, Belarus, Belgium, Bosnia and Herzegovina, Brazil, Brunei, Bulgaria, Canada, Chile, Croatia, Cyprus, Czech Republic, Denmark, Estonia, Finland, France, Germany, Greece, Hungary, Iceland, Ireland, Italy, Japan, Latvia, Lithuania, Luxembourg, Malta, Mexico, Monaco, Montenegro, the Netherlands, New Zealand, North Macedonia, Norway, Poland, Portugal, Qatar, the Republic of Korea, Romania, Russia, Serbia, Singapore, Slovakia, Slovenia, Spain, Sweden, Switzerland, Ukraine, the United Arab Emirates, the United Kingdom, and the United States. ‍Sources: Visa-Free Transit Policies for Foreign Nationals, 2024-07-03Announcement: China's 72/144-Hour Visa-Free Transit Policies Now Cover 54 Countries, 2023-12-07Please check to make sure your flight arrives in China at one of the main ports listed on the website above to get the 144-hour entry. (Beijing, Shanghai included)‍Longer Stays30/90 Day Mutual Visa Exemption Agreements For longer than 144-hour stays, some countries have agreements with PRC to allow up to 30 day or longer statys. Please check with your local travel agency for confirmation. List of Agreements on Mutual Visa Exemption Between the People’s Republic of China and Foreign Countries FAQs About Visa-free Entry to China Under Mutual Visa Exemption AgreementsInvitation LetterYou may still wish to apply for a regular visa if you'd like to stay for a longer period of time. For a copy of the official GOSIM invitation letter from CSDN, please send email to: help@gosim.org‍October 17 to October 18, coinciding with CSDN's 1024 Programmer Fest Week. This annual event is expected to attract a large number of industry professionals, developers, and enthusiasts to discuss and share their expertise in various aspects of computer science and artificial intelligence.‍The two-day conference will feature a series of keynote speeches, panel discussions, and technical sessions. Topics covered will range from the latest advancements in the Rust programming language, multi-platform app development, open-source generative AI, emobided AI, robotics, to emerging trends in the next generation internet, and XR technologies. Additionally, there will be hands-on workshops and coding competitions for attendees to demonstrate their skills and learn from others. The CSDN 1024 Programmer Fest Week is an annual celebration of programming, programming culture, and the open source community. It includes a series of events and activities aimed at promoting knowledge sharing, collaboration, and innovation among programmers, developers, and students. GOSIM China 2024 and the CSDN 1024 Programmer Fest Week promise to be an exciting and informative event for anyone interested in the latest innovations in the open-source projects and communities.Image GalleryLorem ipsum dolor sit amet, consectetur adipiscing elit.{ "items": [], "group": "" }