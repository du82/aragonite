["https://china2024.gosim.org/schedule-october-17"]
title = "Schedule - October 17"
full_description = '''Schedule by dateOctober 17 ScheduleJoin us for six exciting conference tracks, with full agenda, session times, topics, and speakers coming soon. Don't miss out on these dynamic sessions! (More sessions continuously added)October 17TimeSession178:30RegistrationTime8:30TrackAI Models & InfraApp DevelopmentEmbodied AINext Generation InternetNext Generation Media & DeviceSpeakersSlidesScribdVideoYoutubeTime8:30179:30GOSIM Keynote: Open Source Ecosystem in the Era of AGITime9:30TrackAI Models & InfraApp DevelopmentEmbodied AINext Generation InternetNext Generation Media & DeviceSpeakersTao JiangSlidesScribdVideoYoutubeOpen Source Ecosystem in the era of AGI... More Details SoonTime9:30179:45Opening Keynote: Mobile Solution by OpenHarmonyTime9:45TrackAI Models & InfraApp DevelopmentEmbodied AINext Generation InternetNext Generation Media & DeviceSpeakersYan ZhouSlidesScribdVideoYoutubeHuawei promotes the openness, concurrency, and security of mobile devices operating systems based on OpenHarmony, and combines the lightweight characteristics of devices to provide the industry with more effective parallel and concurrency solutions.Time9:451710:05GOSIM Hackathon Awards CeremonyTime10:05TrackAI Models & InfraApp DevelopmentEmbodied AINext Generation InternetNext Generation Media & DeviceSpeakersSlidesScribdVideoYoutubeWinner of the GOSIM Hackathon will be announced.Time10:051710:10Morning BreakTime10:10TrackAI Models & InfraApp DevelopmentEmbodied AINext Generation InternetNext Generation Media & DeviceSpeakersSlidesScribdVideoYoutube20 Minutes BreakTime10:101710:30Decentralized Technologies and Next-Generation PlatformsTime10:30TrackNext Generation InternetSpeakersAlan MajerSlidesScribdVideoYoutubeDigital experiences are heavily mediated by centralized platforms. These dominant platforms face disruption by decentralized building blocks, AI, and algorithms - affording new opportunities to rebuild our platforms on open foundation, and reclaim control of our data and experiences. This presentation shares insights gleaned from research interviews with 23 people working toward that open future.Time10:301710:30OpenCV and Spatial IntelligenceTime10:30TrackEmbodied AISpeakersGary BradskiSlidesScribdVideoYoutubeI will describe the upcoming OpenCV release and current initiatives into "spatial intelligence" (AI + 3D pose in a space)Time10:301710:30OPEN-SORA: Democratizing Efficient Video Production for AllTime10:30TrackAI Models & InfraSpeakersYang YouSlidesScribdVideoYoutubeThe Open-Sora project is the world's first open-source reproduction solution similar to Sora, creating an efficient and low-cost video generation model. This presentation will begin by introducing the core concepts of Open-Sora, providing an in-depth analysis of its unique model architecture, and demonstrating how this architecture optimizes video generation efficiency while significantly reducing costs. The presentation will also discuss how Open-Sora adapts to different video resolutions and lengths while maintaining high-quality output, and how it addresses common data storage challenges in large model training. Additionally, it will cover optimizations in inference cost and memory usage. Open-Sora has received enthusiastic responses in the open-source community due to its fun and high-quality results. In this presentation, we will also showcase creative works from the open-source community and explore cutting-edge video generation technologies with you.Time10:301710:30WGPU: Modern GPU Programming In RustTime10:30TrackNext Generation Media & DeviceSpeakersJim BlandySlidesScribdVideoYoutubeGPUs have great performance—if you can make your problem fit their computational model. Hyperthreading, local memory spaces, mandatory vectorization, and other quirks all affect how GPU code should be written. WGPU is a cross-platform API for GPU coding.Time10:301710:30Next Generation App Development with Dioxus: Fullstack, Cross-Platform, Strongly Typed, and Blazingly FastTime10:30TrackApp DevelopmentSpeakersJonathan KelleySlidesScribdVideoYoutubeDioxus is a Rust framework that makes it makes it easy for developers to ship web, desktop, and mobile apps with a single unified codebase. In this talk, we’ll be unveiling features like native mobile support, live hot-reloading, and a custom AI model.Time10:301710:30Register Allocation in CraneliftTime10:30TrackRust Programming LanguageSpeakersAmanieu d'AntrasSlidesScribdVideoYoutubeRegister allocation is one of the most important stages in an optimizing compiler and is often responsible for a large fraction of the compilation time. This talk presents the register allocator used by Cranelift, a fast compiler backend written in Rust and used by the Rust compiler, with a focus on regalloc3, its newest iteration that is currently being developed.Time10:301710:30Makepad in Action: Building your First ApplicationTime10:30TrackWorkshop: Makepad App DevSpeakersJulian Montes de OcaSlidesScribdVideoYoutubeThis hands-on workshop introduces the power and flexibility of Makepad, a cutting-edge UI rust framework for cross-platform development. Participants will: Learn the core concepts of Makepad's GUI Framework Build a functional application from simple widgets to advanced features Implement modern UI elements and interactions Gain practical experience applicable to both mobile and desktop platforms Suitable for developers of all levels, from beginners to experienced programmers. By the end of the workshop, you'll have created your own cross-platform application and acquired the skills to continue developing with Makepad.Time10:301710:30Workshop: W3C DID ForumTime10:30TrackWorkshop: W3C DID ForumSpeakersSlidesScribdVideoYoutubeW3C's Decentralized Identity specification is designed to enable individuals and organizations to have greater control over their personal data and online identities. By using decentralized identifiers (DIDs), users can create and manage their identities independent of centralized authorities, offering a more secure and privacy-enhanced approach to digital interactions. DID has been one of the milestone technologies for the Next Generation Internet. W3C DID Forum is proud to feature Mr. Drummond Reed, the co-editor of the W3C DID 1.0 specification talking to us the initiation, progress and implementation story of DID, with his vision how DID will reshape the digital world. Welcome to register and join us on the journey. Drummond has spent over a quarter-century in Internet identity, security, privacy, and trust infrastructure. He is Director of Trust Services at Gen (formerly Avast) after their acquisition of Evernym, where he was Chief Trust Officer. He is co-author of the book, Self-Sovereign Identity (Manning Publications, 2021). He is founding board member of the OpenWallet Foundation and the Trust Over IP (ToIP) Foundation, where he serves as co-chair of the Technology Stack Working Group and the Concepts and Terminology Working Group. In 2002 he received the Digital Identity Pioneer Award from Digital ID World, and in 2013 he was cited as an OASIS Distinguished Contributor.Time10:301710:30Contribution-Oriented Open Source Talent Evaluation System and Its ApplicationTime10:30TrackWorkshop: Open Source Education ForumSpeakersWei WangSlidesScribdVideoYoutubeThe contribution-based open source talent evaluation system provides a fair and transparent incentive mechanism for open source communities while helping companies identify and cultivate open source talent. This presentation introduces the open source governance standard released by the Ministry of Industry and Information Technology, which defines the measurement of open source contributions. Through specific case studies, the application of this evaluation system in practice is demonstrated. By co-creating the OpenTalent open source talent evaluation platform, we aim to assist enterprises, educational institutions, and governments in accurately identifying and cultivating open source talent, thereby promoting the healthy and sustainable development of the global open source ecosystem.Time10:301710:45How Universities Can Participate in Open Source ContributionsTime10:45TrackWorkshop: Open Source Education ForumSpeakersMeng LiSlidesScribdVideoYoutubeHow Universities Can Participate in Open Source Contributions in OSPPTime10:451711:10Eclipse Zenoh: the Communication Backbone for Ubiquitous and Heterogeneous AI Use-CasesTime11:10TrackEmbodied AISpeakersJulien LoudetSlidesScribdVideoYoutubeAI has become ubiquitous, enhancing many of our interactions with new technology. This omnipresence requires a powerful communication backbone allowing data to flow seamlessly. This presentation details Eclipse Zenoh, a next-gen communication middleware.Time11:101711:10Building for a User-Centered InternetTime11:10TrackNext Generation InternetSpeakersRui ZhaoSlidesScribdVideoYoutubeThe Internet is increasingly centralised around a few big platforms, leading to numerous problems ignoring or harming users' benefits. In recent years, more attention is paid on decentralised architectures with more user focus. In this talk, I will briefly revisit the different lines of thinking, and focus on one promising approach, Solid (Social Linked Data), proposed by Web's inventor, Tim Berners-Lee, to re-decentralised the Web. I will cover its key principles, what it offers right now, and (our team's) explorations to expand its boarder. The talk will close with visions upon Solid and corresponding open questions to incentivise future evolution.Time11:101711:10Through the Eyes of a Maintainer: How to Make Your Contribution More SuccessfulTime11:10TrackRust Programming LanguageSpeakersEd PageSlidesScribdVideoYoutubeWhether its to the Rust Project, your favorite Rust tool, or a library you use, your first contribution can be intimidating. You are stepping into an area where you don't know the social dynamics or technical expectations. I'll be stepping you through the process of contributing from the maintainer's perspective so you can better understand how this works and how to make it more likely your contribution is both accepted and quickly.Time11:101711:10Construction and Open-Sourcing of the Bilingual Large Models in the Aquila Series within the FlagOpenTime11:10TrackAI Models & InfraSpeakersLiangdong WangSlidesScribdVideoYoutubeThis presentation primarily introduces the construction and open-sourcing of the bilingual large models in the Aquila series, specifically including model pretraining, open-sourcing of the training framework, and open-sourcing of the datasets.Time11:101711:10Flutter: Google’s UI toolkit for Mobile, Web, & Desktop Apps from a Single CodebaseTime11:10TrackApp DevelopmentSpeakersKevin MooreSlidesScribdVideoYoutubeFlutter is an open source framework for building beautiful, natively compiled, multi-platform applications from a single codebase.Time11:101711:10Introduction to the Latest Progress of the Khronos Vulkan StandardTime11:10TrackNext Generation Media & DeviceSpeakersKangying CaiSlidesScribdVideoYoutubeIntroduces the Khronos Vulkan standard, the latest progress of the standard, and some new Vulkan features.Time11:101711:50On the Role of Open-Source Simulation in the Era of Embodied AITime11:50TrackEmbodied AISpeakersGerman Ros SanchezSlidesScribdVideoYoutubeIn the era of Embodied AI, open-source simulation platforms play a pivotal role in driving innovation and collaboration. This talk explores the balance between openness and closed software/APIs, emphasizing the need for flexibility and extensibility in developing robust simulation tools for Embodied AI. By examining CARLA as a case study, I highlight how open-source initiatives can foster community engagement, accelerate research, and provide adaptable tools that meet diverse research needs.Time11:501711:50WGMath: Reusable WebGPU Shaders for Cross-Platform GPU Scientific ComputingTime11:50TrackNext Generation Media & DeviceSpeakersSébastien CrozetSlidesScribdVideoYoutubeUsing WebGpu, WGMath aims to bring GPU scientific computing to all platforms by empowering all scientific communities with reusable WGSL shaders. We discuss the fundamentals of this ecosystem, current and future features for LLM, geometry, and physics.Time11:501711:50Rust Compiler OverviewTime11:50TrackRust Programming LanguageSpeakersNicholas NethercoteSlidesScribdVideoYoutubeThis talk will provide an overview of the Rust compiler: what it looks like, how it works, how its internals are structured, and how it is developed.Time11:501711:50Blitz: Blurring the Lines Between Web and NativeTime11:50TrackApp DevelopmentSpeakersNico BurnsSlidesScribdVideoYoutubeIntroducing Blitz, a new cross-platform application runtime which combines web-compatible "write-once, run-everywhere " UI code with a small footprint and powerful system integrations when deploying to native (non-web) platforms.Time11:501711:50Palpo Social Server: A self-hosted social server supporting Matrix protocolTime11:50TrackNext Generation InternetSpeakersXuecheng YangSlidesScribdVideoYoutubeA Rust based self-hosted, open-source Matrix server for personal cloud deployment. Time11:501711:50InternLM: An Open-Source LLM with Full-Stack ToolchainTime11:50TrackAI Models & InfraSpeakersJianfei GaoSlidesScribdVideoYoutubeInternLM is developed by Shanghai AI Laboratory. We keep open-sourcing high quality LLMs as well as a full-stack toolchain for development and application. In this talk, we will share the latest developments of InternLM and its related toolchain, covering areas such as Agents, Evaluation, and AI-Infra.Time11:501712:30Lunch BreakTime12:30TrackAI Models & InfraApp DevelopmentEmbodied AINext Generation InternetNext Generation Media & DeviceSpeakersSlidesScribdVideoYoutubeTime12:301714:00Writing Your Own Rust LinterTime14:00TrackRust Programming LanguageSpeakersGuillaume GomezSlidesScribdVideoYoutubeThis talk will show you how to write your own rust linter using the rustc_tools crate which allows you to have access to the rust compiler API. It can be quite useful if you need specific lints for a project and cannot add them to clippy. It will also explain how the compiler API works and give a small example at the end showing it in action.Time14:001714:00Open-Sourced Text-to-Video Model: CogVideoXTime14:00TrackNext Generation Media & DeviceSpeakersYuxuan ZhangSlidesScribdVideoYoutubeWe introduce CogVideoX, a large-scale diffusion transformer model designed for generating videos based on text prompts. Results show that CogVideoX demonstrates state-of-the-art performance across both multiple machine metrics and human evaluations. The model weight of CogVideoX is publicly available at https://github.com/THUDM/CogVideo.Time14:001714:00Build an Open Source Operating System for Robots Based on OpenHarmony.Time14:00TrackEmbodied AISpeakersYanxing BaSlidesScribdVideoYoutubeTechnological progress, an aging population and many other factors are driving the booming development of the robotics ind'''
