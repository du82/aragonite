["http://chipmunk-physics.net/documentation.php"]
title = "Chipmunk2D Physics  - Documentation"
full_description = "Chipmunk2D Documentation: Chipmunk2D Manual The manual goes over all of the different parts of Chipmunk2D, explaining how they they work and how to generally use Chipmunk2D. The manual is C-centric, though nearly all of the information is applicable Objective-Chipmunk2D. Because the C API is written in an object oriented style already, there is generally a pretty close 1:1 relationship making it very easy to find the corresponding method in Objective-Chipmunk2D. Chipmunk2D API Reference The Doxygen generated API reference covers everything in Chipmunk2D and Chipmunk2D Pro (Objective-Chipmunk2D, Autogeometry, etc). Chipmunk2D For Unity All documentation for the Unity3D bindings are located in this manual. Tutorials Simple Objective Chipmunk2D Tutorial: (Objective-Chipmunk2D/UIKit) Creating a Chipmunk2D space to simulate objects Creating a bouncing box with friction Controlling gravity using the device's tilt Using collision callbacks to make impact sounds based on how hard objects collide Using collision callbacks to track if an object is sitting on the ground or in the air Using the ChipmunkObject protocol to easily add complex objects to a space Using a CADisplayLink for smooth animation Integrating Chipmunk2D into a Cocoa Touch UI Chipmunk2D Color Match: Tutorial available for: Chipmunk2D Pro and Cocos2D Four separate examples so you can use any libraries you want. Example code for Chipmunk2D Pro and UIKit, Chipmunk2D Pro and Cocos2D, Chipmunk2D and UIKit, and Chipmunk2D and Cocos2D. A full game tutorial - a simple color matching game Collision callbacks Use of CCPhysicsSprite and CCDebugNode Top-Down, Tile-Based Game Tutorial: (Objective-Chipmunk2D/Cocos2D) Using Cocos2D and Chipmunk2D Pro together Simulating top-down friction Controlling a top-down player with joints Using Chipmunk2D Pro's autogeometry to create collision geometry for a tilemap This tutorial extends Ray Wenderlich's tile-based game tutorial Other Tutorials: Ray Wenderlich's excellent Simple iPhone Game with Chipmunk2D is probably the best place to start for someone who is new to programming with a physics engine. Ray covers the basics of what Chipmunk2D does and how to use it with Cocos2D. Heyalda's Getting started with Chipmunk2D and Cocos2d - A nice guide for complete beginners, as it covers how to download and setup Cocos2D, use XCode a bit, and it covers basic terminology and concepts you'll need while working with Chipmunk2D and Cocos2d. Heyalda is back with a Ragdoll Tutorial - Covers the Chipmunk2D joints for a ragdoll, Cocos2D retina display issues, and it uses CCSpriteBatchNode to draw the character. Dirk Johnson has a Guide to Ruby and Chipmunk2D - Although it's from early 2012, it covers using Chipmunk2D from Ruby."
