title = "Chipmunk2D for Unity"
full_description = "The Chipmunk2D Unity Asset Bundle contains several example scenes, each of which covers several topics. Walkthroughs of specific features are available below, or jump right in to the API documents or manual using the left sidebar. Get started with the instructional guide on Double Jumping, which covers best practices using Chipmunk2D for character motion. One-way platforms are all but essential in a platforming game. This instructional guide covers basic use of Chipmunk2D collision handlers and easily accomplishes what can be very tricky in engines like PhysX. A slightly more complicated use of collision handlers is trampolines. Learn how to manipulate objects in response to collision events. Clicking, tapping, and dragging is an important way to interact with with physics bodies. Do it simply and accurately!"
