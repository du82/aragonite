bout US Excelling in client care and management, with specialist knowledge of theatre and the arts and bases in London and Edinburgh, we are experienced in PR, comms, and events organisation. Founded in 2010 to meet the demand for a multi-faceted agency, CNC offers a bespoke and committed service to clients in London, Edinburgh, and around the UK. With a passion for the arts we believe in communicating the importance of culture to today’s society. Our specialist knowledge ensures we provide a fantastic high-end service. Chloé Nelkin Consulting is a dynamic company that always delivers with style and sophistication to achieve results beyond your expectations. Explore our areas of expertise across public relations: #row-142412306 > .col > .col-inner { padding: 30px 0px 0px 0px; } THEATRE & IMMERSIVE Art & Heritage OPERA & CLASSICAL MUSIC CIRCUS DANCE DIGITAL PRODUCTIONS Learn more about all the facets of our work? See What We Do'''
