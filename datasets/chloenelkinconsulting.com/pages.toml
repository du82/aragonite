["https://chloenelkinconsulting.com/edinburgh"]
title = "Edinburgh Fringe PR & Marketing | Chloé Nelkin Consulting"
full_description = "Edinburgh Fringe Chloé Nelkin Consulting can be found at the Edinburgh Fringe every summer taking a hands-on approach to looking after the PR for a range of brilliant shows from theatre and circus to immersive site-specific masterpieces. CNC are also based in Edinburgh year-round supporting the amazing Scottish arts scene with our extensive PR knowledge. Read More We’ve always loved the Edinburgh Festival Fringe and that passion prompted us to work there. We have worked with a number of award-winning knock-outs over the years! During the Fringe, we open our Edinburgh office in the heart of the city so that our experts are right there, in the action. The personal touch is very important to CNC. The Fringe is an amazing 24/7 beast and CNC are always on-call for any queries. From breakfast meetings to late night drinks, we spend all day every day with journalists and clients. We don our tartan and embrace the Edinburgh Fringe in every way possible. We confirm our Edinburgh shows by the end of February each year, ready to launch our Edinburgh Fringe PR campaigns in late-April. You can download press releases and images and watch trailers on these pages but press releases are also available to journalists as hard copy press packs, by email and on memory sticks. #row-1782115737 > .col > .col-inner { padding: 30px 0px 0px 0px; } 2024 2023 2022 2021 2019 2018 2017 2016 2015 2014 2013 2012 If you’d like to be a part of our Edinburgh roster then please get in touch. We’d love to hear more about your show and see how we can collaborate. Get In Touch Oskar Proctor Courtesy of Sam Roberts Courtesy of Pamela Raith Courtesy of James O Jenkins Nicholas Fiddian Green Courtesy of Sam Roberts Courtesy of Omer Tiroche #row-1049338755 > .col > .col-inner { padding: 45px 0px 0px 0px; }"
