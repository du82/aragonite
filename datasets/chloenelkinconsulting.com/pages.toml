title = "Personal PR - Chloé Nelkin Consulting"
full_description = "Personal PR CNC launched our personal PR department in 2023, marking 13 years in the business. From award-winning stage and screen treasures to emerging talent, the CNC team excels at developing our clients’ profiles to help advance their careers. We offer bespoke packages to fit their demanding and varied lifestyles and roles, ensuring comms messaging is cohesive across all upcoming projects. BBA #text-1513164214 { font-size: 1.6rem; } Ben Wiggins #text-3956428744 { font-size: 1.6rem; } Chris Cuming #text-677051366 { font-size: 1.6rem; } Chris Poon #text-2335055057 { font-size: 1.6rem; } Gary Lloyd #text-2794042991 { font-size: 1.6rem; } Jake Smith #text-534122786 { font-size: 1.6rem; } Jenna Lee-James #text-3461518262 { font-size: 1.6rem; } Katy Richardson #text-4038284141 { font-size: 1.6rem; } Joaquin Pedro Valdes #text-2568900144 { font-size: 1.6rem; } LJ Parkinson #text-1686539178 { font-size: 1.6rem; } Nicholas Chalmers #text-143743457 { font-size: 1.6rem; } Nick Butcher #text-3164287732 { font-size: 1.6rem; } Priyasasha Kumari #text-2816498786 { font-size: 1.6rem; } Su Pollard #text-3078780331 { font-size: 1.6rem; } Tarik Frimpong #text-2542603440 { font-size: 1.6rem; } #col-176970113 > .col-inner { margin: 0px 0px -30px 0px; } Tom Scanlon #text-3282608370 { font-size: 1.6rem; } #col-760289196 > .col-inner { margin: 0px 0px -30px 0px; } Tobias Turley #text-4151643588 { font-size: 1.6rem; } #col-963618021 > .col-inner { margin: 0px 0px -30px 0px; } Zachkiel Smith #text-2092555585 { font-size: 1.6rem; } #col-1016145210 > .col-inner { margin: 0px 0px -30px 0px; } #section_915460977 { padding-top: 30px; padding-bottom: 30px; } Using our press contacts from over a decade of working in the entertainment and performing arts industries, we are able to deliver the very best support to our clients and build their profiles in the press. We personalise our approaches to create opportunities for our clients. Honesty sits at the heart of all we do and we communicate clearly with clients throughout our campaigns. We ensure that our clients are kept regularly updated, making each step as straightforward as possible to remove the complicated language around PR and profile building. When required, we offer media training as well as social media 101 to help prepare our clients for all eventualities. We work with selected and trusted contacts in the industry including stylists, photographers, hair and make up artists and fashion brands. We’re on hand to support our clients at junkets and red carpets and make sure they’re attending the right events. We help with schedule management on busy press days and ensure our clients are fully briefed and comfortable. Our personal PR team are here to support, protect and help our clients and this is carried out with the usual CNC flare, dedication and professionalism. #text-2450320459 { font-size: 1rem; } #col-1764704210 > .col-inner { margin: -35px 0px 0px 0px; } If you would like to work with us please get in contact us GET in touch Courtesy of Oliver Curtis #row-778117534 > .col > .col-inner { padding: 10px 0px 0px 0px; }"
