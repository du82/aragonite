full_description = '''Videos Featured Series Success Stories Case Studies Testimonials Chocolatey Resource Library 12 Days of Chocolatey Feature Video Series 12 Days of Chocolatey Feature Video Series Follow along with this video series to relive the 12 Days of Chocolatey livestream event (aka Chocolatey Fest 2020)! You'll learn about the Quick Deployment Environment (QDE), the Choco CCM Module, Self-Service Anywhere, and hear many other exciting new announcements from the Chocolatey team! Chocolatey for Business Feature Video Series Chocolatey for Business Feature Video Series In this video series, come take a tour of the many features available in our Chocolatey for Business offering. Many organizations choose Chocolatey for Business when they want to scale out their solution across thousands of nodes, deploy rapidly and reliably every time, mitigate risks with a greatly-simplified patching workflow, and access a Support Team that will guide you on your automation journey. Getting Started Follow this step-by-step guide to get up and running with Chocolatey fast. Docs Read the docs to discover in depth articles on everything Chocolatey. Case Studies Get detailed information on how Chocolatey is utilized throughout the community. Videos Chocolatey talks, success stories, case studies, demo videos, and more. Success Stories Watch numerous success story videos on how Chocolatey has impacted business you trust. Blog Read the latest news about Chocolatey through our official blog. 12 Days of Chocolatey Feature Video Series 12 Days of Chocolatey Keynote - "The Power of Simple" 12 Days of Chocolatey Redefining Chocolatey 12 Days of Chocolatey Chocolatey in the Organization 12 Days of Chocolatey Building Packages (Open Source and C4B) 12 Days of Chocolatey Exploring Quick Deployment Environment (QDE) & Offline / Internal Environments 12 Days of Chocolatey Choco CCM Module (Deployments / Integrations / Reporting) 12 Days of Chocolatey Chocolatey Integrations Discussion (including SCCM & Intune) 12 Days of Chocolatey Exploring Self-Service Anywhere 12 Days of Chocolatey R&D Show and Tell 12 Days of Chocolatey Q&A Panel Session, Roadmap & Wrap See More of This Series Chocolatey for Business Feature Video Series C4B Feature Chocolatey for Business Introduction C4B Feature Chocolatey for Business - Why Chocolatey C4B Feature Chocolatey for Business Package Builder - Part 1 C4B Feature Chocolatey for Business Package Builder - Part 2 C4B Feature Chocolatey for Business Package Internalizer - Part 1 C4B Feature Chocolatey for Business Package Internalizer - Part 2 C4B Feature Chocolatey for Business Self-Service and Chocolatey GUI - Part 1 C4B Feature Chocolatey for Business Self-Service and Chocolatey GUI - Part 2 C4B Feature Chocolatey for Business - Package Synchronizer C4B Feature Chocolatey for Business - Chocolatey Central Management See More of This Series Success Stories Customer Success Story CME Group Tony Cheng, Technical Specialist Customer Success Story Puppet Mike Lombardi, Software Engineer Customer Success Story Qualcomm Dwight Bragdon, Senior Staff IT Engineer Customer Success Story TD Security Michel Buczynsky, DevOps Coach Customer Success Story Yelp Ryan de Temple, Client Platform Manager See More Success Stories Case Studies Case Study A Tale of Two Hierarchies - Group Policy & Puppet - Matt Stone at PuppetConf 2016 Case Study WinOps 2017 Connon MacRae - Evolution of Ticketmaster's Journey to DevOps Case Study WinOps 2017 Dan Sedlacek - Managing Windows @ Facebook Case Study PSDay.UK - Welcome, Sponsors Introductions and Steven Murawski's Keynote Case Study How I Completely Automated Managing Windows Desktop Software...Forever See More Case Studies Testimonials The I.T. department staff at P.R.I.D.E., Inc. were early adopters of Chocolatey and the product had become an integral part of processes. Chocolatey improves our efficiency, increases consistency across workstations, and provides easy access to software that is vital to our engineers daily workflow. Truly a revolutionary solution to a problem that has plagued Windows since inception. Keith Davis IT Director at P.R.I.D.E Chocolatey has gone from a convenience to a necessity. It has helped us automate third party software updates, which has improved end user experiences and our on-site security. It has saved time by reducing the volume of calls to our help desk for simple issues like Flash Player updates, so we can focus on other issues. It’s integration with Chef has allowed us to automate software installation and deployment. Gone are the days when we would provision and deploy a PC with an outdated version of Chrome. With Chef and Chocolatey we deploy updated software every time a PC is provisioned. Chocolatey has helped us wrangle all of the applications we use into one manageable and automation friendly interface. Alex Markessinis Senior Network Administrator at The Sage Colleges We were looking for an efficient and seamless way to deploy software on servers and workstations without hindering user experience. Chocolatey has definitely helped us a great deal with automated deployments. The package builder is also a great way of creating custom install packages for business-specific software. Overall it has saved us a lot of time and hassle. The Tricore Team Tricore At MPAC, we needed to implement a new, configurable package management solution to satisfy our complex requirements. Choosing Chocolatey turned out to be an excellent decision – the solution gave us everything we needed to accelerate deployments, improve security and endpoint visibility. In addition, by streamlining application packaging and deployment with Chocolatey, we’ve significantly reduced application management costs and improved service delivery. Gopi Balasingam Director, IT Operations at Municipal Property Assessment Corporation (MPAC) In the SMB market we just don't have the resources to dedicate an entire FTE to managing a complex configuration management tool. As a result, these types of monumental products tend to fail monumentally. Chocolatey is allowing us to leverage modular DevOps practices in a much more economical way. It’s well worth investing in Chocolatey for Business, which provides the extra tooling we need to realize our DevOps goals faster. Dave Negrotto Senior Manager, IT at The J. Craig Venter Institute We manage a broad range of application requirements across academic disciplines summarised by approximately 500 applications on 7000 managed endpoints. Chocolatey is quickly becoming an indispensable piece of our configuration management toolset for end-user devices. We have reduced our packaging overheads and complexity for many applications through the internalisation of community packages. This has also allowed us to update third party apps more rapidly to improve levels of security and compliance. Chocolatey has also been instrumental in our focus on increased automation/orchestration and is a key tool used in our containerisation journey with Docker. Luke Williams Senior Engineer IT Services at the University of Derby Chocolatey has greatly simplified our deployment operations and software management with its ease of implementation and usability. We were able to use chocolatey in many different ways, saving time and providing consistency in daily operations. Andrew Chitwood Network and Systems Technician at East Central College Chocolatey has been a great addition to our IT toolset. It has streamlined our workstation deployment down to a fraction of the time it used to take. We’ve also leveraged the tools to create our own custom packages for in house software. Keeping our workstations up to date is also automated and working smoothly. We have visibility into what products are installed and updated very easily. This greatly enhances our security by not having outdated software packages on the network. I highly recommend Chocolatey to my colleagues when they ask how we are accomplishing these tasks. Rob Weber Technology Manager at Eau Claire Energy Cooperative Chocolatey has greatly simplified package management on Windows computers via its integration with Puppet configuration management software. This configuration has allowed us to leverage similar skillsets in configuration management across Windows and Linux. The command line interface to package management also makes it easy to use several remote tools to check on, install, and uninstall packages in an ad hoc manner on Windows. The Chocolatey business version helps us by making it dead simple to import packages for use from the gallery to our internal secure repository. James Pulver CLASSE Computer Group of Cornell University We need to rapidly deploy new testing and user environments, and Chocolatey makes that a seamless and easy process! Eric Rothenberger Fortego, LLC As we are still kind of small startup, we don’t have a lot of resources to package, install and maintain our internal applications. The combination of Chocolatey and MyGet has given us an easy way to package and distribute our applications in a controlled way without having any infrastructure to maintain. The C4B features have made it even easier for us which gives us more time to focus on the core of our own service. Jere Vekka System Manager at Digital Workforce See More Testimonials Recently Updated Resources Q&A Panel Session, Roadmap & Wrap Wednesday, December 16, 2020 R&D Show and Tell Tuesday, December 15, 2020 Exploring Self-Service Anywhere Monday, December 14, 2020 Chocolatey Integrations Discussion (including SCCM & Intune) Friday, December 11, 2020 Choco CCM Module (Deployments / Integrations / Reporting) Wednesday, December 9, 2020 Exploring Quick Deployment Environment (QDE) & Offline / Internal Environments Tuesday, December 8, 2020 Helpful Resources Customer Success Story - Puppet Mike Lombardi at Puppet speaks on Chocolatey What is Chocolatey? Chocolatey Software CEO Rob Reynolds and COO Mukesh Sharma talk about Windows automation with Chocol... How I Completely Automated Managing Windows Desktop Software...Forever Dan Franciscus talks about how he found Chocolatey and built the processes using just PowerShell to ...'''
