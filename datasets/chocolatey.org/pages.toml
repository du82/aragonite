["https://chocolatey.org/how-chocolatey-works"]
title = "Chocolatey Software | How Chocolatey Works"
description = "Chocolatey is software management automation for Windows that wraps installers, executables, zips, and scripts into compiled packages. Chocolatey integrates w/SCCM, Puppet, Chef, etc. Chocolatey is trusted by businesses to manage software deployments."
full_description = "How Chocolatey Works Simplify Windows Software Management with Chocolatey Chocolatey is a software management solution that gives you the freedom to create a simple software package and then deploy it anywhere you have Windows using any of your familiar configuration or system management tools. If you ever used yum, apt, pacman or indeed any package managers on Linux, or Homebrew on a Mac, you already know what Chocolatey is. Chocolatey is the Windows package manager, in the same way that RPM is a package manager for Linux. Designed to be simple to use, it provides a suite of powerful features that scale for your existing, and your future infrastructure. Power and flexibility in one simple product, that's Chocolatey. So whether you are an individual, a small organization, or a large enterprise, Chocolatey provides you with the features to be able to manage your Windows software simply, saving you time and resources. Getting started with Chocolatey is quick and easy - you can start using Open Source for free or contact us for a trial of our commercial edition. The biggest challenge is reducing duplication of effort, so users turn to Chocolatey for simplicity. Rob Reynolds, Founder of Chocolatey Software Deploy Anywhere You Have Windows We designed Chocolatey to work with the widest range of Windows operating systems all the way back to Windows 7 and Windows Server 2003. We also support cloud environments such as Microsoft Azure, Amazon AWS and any others where Windows platforms are available. Chocolatey runs on Windows Server.Core and Docker Windows container as well. One product to manage all the software on your entire Windows estate cuts training costs for staff saving both money and time that could be better spent elsewhere within your organization. Complete Software Coverage The software environment on Windows is much more than what is shown in Programs and Features. Which is why Chocolatey manages all software on Windows including software installers, scripts, zip files and internal software. Check out our Architecture Diagram for a better understanding of organizational requirements. Reliable and Secure Chocolatey requires no internet access whatsoever. You can build and host packages internally all for free, which gives you complete control over your environment. Additionally, leverage over 7,000 community packages - internalizing them for use in your environment. This allows you to reuse existing logic that has been tested across multiple environments. Add in automatic internalization using Package Internalizer to take advantage of a hands off approach updating packages within moments of when they are updated in the community! Use Familiar Tools Chocolatey packages use PowerShell to drive them so no need to learn another language to deploy software which cuts down the time from installation to package deployment. You can use Chocolatey to deploy software using the tools you already know. Many configuration management tools such as Ansible, Chef, Puppet, PowerShell DSC, Salt and others have specific support for Chocolatey. Any end point management solution such as SCCM, Altiris, Connectwise Automate or others that allow you to manage remote deployment can use Chocolatey to manage software as well."
year_published = 2025
