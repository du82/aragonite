["https://chocolatey.org/support"]
title = "Chocolatey Software | Support"
description = "Chocolatey is software management automation for Windows that wraps installers, executables, zips, and scripts into compiled packages. Chocolatey integrates w/SCCM, Puppet, Chef, etc. Chocolatey is trusted by businesses to manage software deployments."
full_description = '''Package Support Open Source Support Compare Support Schedules Company Office Closures Chocolatey Pro Support MSP Support (for existing MSP edition customers only) Business Support Business Support - Terms Business - Legal Chocolatey Support Support for a Package We do not have support for packages found on Chocolatey.org - those are considered community packages and should not be used for commercial purposes. Package issues should follow the package triage process. Read more... Open Source WARNING For open source users, please remember the etiquette guidelines when requesting support. If we've broken something and have acknowledged that we will fix it immediately, that is one thing. However "urgent" situations only apply to commercial editions (that include support). If you find yourself in an "urgent" situation, it may be time to look at our commercial options. Unfortunately we are unable to provide private support for open source users. However there are a lot of avenues that open source users can work within the community to get the help they need. If you are an open-source user, you have the following channels for support: Documentation Found an issue? Mailing List Twitter Community Chat NOTE Commercial customers (Pro, MSP, Business, Architect) are welcome to use these forms of support as well, but you have an additional, private line directly back to Chocolatey Software for support that has a much higher priority over open source support routes. Compare Support Schedules Pro/MSP Business Edition (C4B) Standard Plan Standard + Plan Premium Plan Licenses n/a 100-299 Licenses * Notice: If you have less than 100 licenses you have the option to purchase Support. Contact Sales for more information. 300 + 1,500 Licenses or, $30,000 minimum purchase if multi-year, required before Premium Support can be purchased. Included Automatically? Premium is available for an additional cost Support Hours Monday – Friday 8AM – 5PM Central Std Time* Monday – Friday 8AM – 5PM Central Std Time* Monday – Friday 7AM – 6PM Central Std Time* 24 /7* Response Times(P = Priority level, as defined in support terms below) Pro: 2 Business Days MSP: P1: 6 Business Hours P2: 10 Business Hours P3: 2 Business Days P1: 4 Business Hours P2: 8 Business Hours P3: 12 Business Hours P1: 3 Business Hours P2: 6 Business Hours P3: 12 Business Hours P1: 2 Hours P2: 4 Hours P3: 6 Hours Phone Support n/a n/a n/a Available Add On Online Support Number of Cases 8 per Year 4 per Month 8 per Month 20 per Month Status Meetings n/a n/a Every 2 Months by Customer Request Bi-weekly by Customer Request Number of Technical Contacts 1 1 2 (Negotiable) 6 (Negotiable) Access to All Updates & Upgrades Support System Email Addresses Provided in Licensing Email Email Addresses Provided in Licensing Email Email Addresses Provided in Licensing Email Email Addresses Provided in Licensing Email * Notice: Company holidays are observed and local offices are closed. During closures, C4B Premium Plan customers have the following support response times - within 3, 6, and 12 hours, respectively based on priority. Company Office Closures Chocolatey Software observes United States Bank holidays. As dates are not always the same every year, the following list should help you calculate our closures. If you need exact dates and are a customer, please note our support team will only be able to provide the current year. January 1* - New Years Day 3rd Monday in January - Martin Luther King Day 3rd Monday in February - Presidents Day Last Monday in May - Memorial Day July 4* - Independence Day First Monday in September - Labor Day Second Monday in October - Columbus Day November 11* - Veterans Day Fourth Thursday in November & the Friday following - Thanksgiving Holiday December 24* - first weekday after January 1 holiday - Christmas Holiday * Notice: If day falls on a weekend, it is observed either the Friday before (Saturday) or Monday (Sunday or another holiday already observed on the Friday). Notice: Chocolatey Software reserves the right to close the offices on other days, with or without notice. Chocolatey will make attempts to provide notice, but is not able to guarantee you will receive the notice. Chocolatey Professional Chocolatey Pro is a personal license for individuals. We are happy to extend support to help out our community users. Above is a support schedule for our Pro users. Chocolatey for Managed Service Providers (MSP) NOTE: MSP edition is no longer offered - support information is for reference for existing MSP customers. Chocolatey MSP edition is similar to features found in Pro, but offered for managed service providers at a much more competitive cost than Chocolatey for Business (and less features than C4B). MSP edition also has a slightly reduced support matrix as part of that competitive pricing. Above is a support schedule for our MSP users. Chocolatey for Business (C4B) The business edition has 3 levels of support - Standard, Standard+, and Premium. Standard and Standard+ are based on the number of licenses you purchase. Premium is an additional cost, but also requires a minimum number of licenses (details are listed in schedule above). You can also log issues at Licensed Issues and we will route the requests to the proper repositories. Chocolatey for Business - Support Terms Chocolatey Software, Inc. – Chocolatey for Business Support and Maintenance Services Terms These Support Services Terms describe the Support Services which current, compliant subscribers of Support Services are entitled to receive pursuant to the License Agreement between Chocolatey Software, Inc. ("Chocolatey") and Customer. These Support Services Terms form an integral part of, and are incorporated by reference into, the License Agreement. Definitions. "Software" means any of the following: Chocolatey for Business, Chocolatey for Architect, Chocolatey for MSP, or any other offerings as defined in a License agreement between Chocolatey and Customer. "Error" means a malfunction in Software that can be duplicated by Chocolatey that materially degrades the use or performance of the Customer business system the Software manages ("Business System"). "Fix" means the repair or replacement of object code versions of Software to remedy an Error. "Priority 1 Error" means an Error that renders Software inoperative or materially degraded with respect to the Business System, such that: (i) the Business System's production system is severely impacted or completely shut down, or (ii) the Business System's system operations or mission-critical applications are down. "Priority 2 Error" means an Error that degrades Software performance with respect to the Business System. "Priority 3 Error" means an Error that affects Company's use of Software, but does not materially degrade Software performance with respect to the Business System or has a workaround that could include installing a previous version of Software. "Ticket" means the tracking of a Fix for an Error or requested feature in the Software has been noted by Customer, that is typically tracked in an issue tracking system. "Technical Contact" means an employee or authorized representative of Customer that is technically familiar and competent with Customer's systems (including the Business System), infrastructure and use of the Software, who: (i) has "read, write, and execute" access to the necessary files, English language communication skills and relevant technical knowledge; and (ii) is a designated Customer contact to receive Support Services, and to resolve Customer technical issues related to the Software. The permitted number of Technical Contacts is based on the level of Support Services purchased by Company, and is set forth in the tables above. Technical Contacts may be changed by the Customer upon five (5) business days prior written notice to Chocolatey, which can be executed electronically by email whereas the 5 days is the date of confirmation of receipt from Chocolatey. "Update" means subsequent releases of the Software that are generally made available by Chocolatey to customers using the Software as part of Support Services at no additional charge, other than any applicable media and handling charges. Updates may include updated code to accommodate changes in applicable industry standards. Updates shall not include any releases, enhancements, functionality or products which Chocolatey licenses separately or provides at a fee separate from the Support Services fee. Updates are delivered only on an as if and when available basis. Support Services Coverage. Subject to the terms of these Support Services Terms, including the support schedule table(s) set forth above, and the other terms of the License Agreement (including, without limitation, Customer's payment of the applicable Support Services fees to Chocolatey), Chocolatey will provide Customer with the Support Services described herein for the Software, exclusive of any integration issues between the Software and applicable Third Party Software. Customer shall designate the permitted number of Technical Contacts who are responsible for resolving user issues, and only such Technical Contacts may contact Chocolatey for the provision of Support Services. Support Services do not include anything not set forth in these Support Services Terms, and specifically excludes support of any hardware or any software other than the Software, including and without limitation, any integration with Third Party Software (other than the Third Party Software (as defined in the License Agreement) to the extent of its function within the Software). The Support Services telephone numbers, email address and Chocolatey Support Portal are located in the tables above as applicable. Chocolatey Software Maintenance. Chocolatey will periodically, and at its sole discretion, provide Customer with Fixes to Errors and Updates to the Software. Customer Obligations. Customer and its Technical Contacts shall: (i) make reasonable efforts to resolve Customer issues or identify issues as relating to the Software prior to contacting Chocolatey for Support Services; and (ii) provide Chocolatey with sufficient information and resources to address the Error, and access to the personnel, hardware, and any additional software as reasonably necessary to enable Chocolatey to reproduce, analyze and address the Error. Process. Customer will contact Chocolatey Support by email or phone number, as noted in Support Services contract. Customer may also follow up on interested Ticket, if pre-existing or after creation, but for Support Services, Customer must contact Support through Support channels. If Ticket is public, Chocolatey Support will adjust the priority and identified release to resolve Ticket. Chocolatey Support will work to resolve Ticket. Ticket is closed when Fix is complete in code. For Priority 1, Fix will be provided out of band and Chocolatey Support will move up release schedule to provide a wider release quickly. On Priority 2, Customer and Chocolatey Support will determine if out of band Fix is provided and whether release schedule is moved up to support Customer necessity. For Priority 3, Fixes will normally wait until next release on normal release schedule. Chocolatey may provide Customer with Fix at Customer discretion. Status Updates. Customer may have certain Tickets for Software that they are interested in seeing resolved. These could be bugs or features that Chocolatey has noted and has plans to resolve. On Customer request based on Support Schedule, Chocolatey will provide updates on prioritization and status for Tickets. Exclusions. Chocolatey is not obligated to provide Support Services when: (i) the Software has been changed, modified, or damaged; (ii) the issue is caused by Customer's negligence, misuse of software or hardware, hardware malfunction, or other causes other than the Software; (iii) the issue is caused by hardware, third party software or infrastructure; (iv) the Customer is using packages from the community package repository source, located at https://chocolatey.org/packages (through https://chocolatey.org/api/v2) or any repositories that are not controlled exclusively by Customer; or (v) the version of the Software is not a currently supported version, as determined by Chocolatey's announced policies regarding the support of such versions. Changes. Chocolatey reserves the right to change these Support Services at any time; provided however, that any such changes which occur during the then current Support Services term for which Customer has paid fees to Chocolatey, will not materially diminish the Support Services to be provided during the remainder of such Support Services term. Please check the Support Services Terms periodically for changes. While Chocolatey will provide written notice electronically (via the customer mailing list) for significant changes to the Support Terms, Chocolatey is not obligated to ensure confirmation of receipt and acceptance by Customer. By continuing to use Support Services, Customer indicates acceptance of such changes to Support Terms. Chocolatey for Business - Legal Chocolatey Software is a US-based Delaware Corporation founded in 2016 as a spin off of RealDimensions Software, LLC. RealDimensions Software, LLC was founded in 2012 for managing and funding open source initiatives. As of January 1, 2017, Chocolatey Software manages all aspects of Chocolatey and will continue to see its growth with both open source and business initiatives. Master Software License Agreement - PDF (redline signature format available on request) Third Party Licenses - PDF Support and Maintenance terms PDF available on request D-U-N-S (DUNS) number available on request W9 available on request Liability Insurance (Acord) available on request Liability limited in license agreement to cost of licenses - if you need higher, the price of licensing will increase based on added risk exposure We can amend the license agreement for transferability of licensing - please contact "Sales" to address your need'''
