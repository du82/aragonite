["https://chocolatey.org/use-cases"]
title = "Chocolatey Software | Use Cases"
description = "Chocolatey is software management automation for Windows that wraps installers, executables, zips, and scripts into compiled packages. Chocolatey integrates w/SCCM, Puppet, Chef, etc. Chocolatey is trusted by businesses to manage software deployments."
full_description = '''Use Cases Server Many IT teams still rely on manual configurations, custom scripts, golden images or outdated tools to manage Windows infrastructure. This results in errors and slow deployments, or worse - unpatched environments that leave you susceptible to security incidents. From a server point of view you need to ensure a consistent, reliable approach without having manual intervention, and allowing you to run the businesses on the software and having to care, water, and feed the servers. When you get to the world of cloud and containers this is only amplified as you are managing the unknown. Chocolatey provides a standardized, scalable approach to server management. From setting up a new server, to ensuring critical updates are in place, or supporting a migration project. Learn More Desktops & Endpoints Deploying software to desktop and endpoint devices is not always easy, especially in a highly regulated and locked down environments. How do you ensure your teams have the most up to date software deployed to their desktops? For endpoint users you need to ensure they are productive, efficient, and have no vulnerabilities. So how can you ensure they have the latest software, but at the same time ensure user experience is not compromised? Chocolatey provides a unique and very cost effective approach to managing your desktop software and can be combined with your existing solutions. Chocolatey for Business (C4B) enables better security and visibility, centralized reporting, and a self-service GUI to allow non-administrators to manage optional software you've approved! Soon C4B will also have endpoint management as part of its Central Management offering. Cloud / Containers Deploying to new environments, whether a cloud instance or using containers comes down to eliminating complexity, and making it easier to deliver quality software faster. When speed is of the essence, how can you begin to easily manage the entire software lifecycle? You need to find solutions that work at the pace of newer technologies, treating your deployments and dependencies as independent building blocks that can be combined in numerous ways. Chocolatey offers developers a standardized and repeatable approach to deploying Windows software, in both development and production environments. Organizations use Chocolatey in Docker, AWS, and Azure when they need simple, powerful, and flexible solutions to meet the needs of those environments. Chocolatey "packages" are those building blocks, forming the foundation for your deployments. Integrations Most organizations have already invested in tools and solutions across their IT environment. Before adding more tools, IT teams may need to ensure that their existing investments are maximized. Teams also need to ensure they don't get locked in proprietary technologies that don't integrate well in their environments. Chocolatey maximizes existing knowledge by bringing PowerShell to the forefront and allowing you to leverage existing tools you are already using. Chocolatey has integrations and is used in conjunction with leading and emerging technologies: Configuration Management tools like Puppet, Chef, Ansible, and Powershell DSC Repository solutions such as JFrog Artifactory, Sonatype Nexus, and Inedo ProGet Continuous Integration Servers such as Jenkins, Circle CI, AppVeyor, and TeamCity Source Control providers like GitHub and GitLab Microsoft tools like SCCM and Intune and third party endpoint management solutions like Connectwise Automate, Ivanti, and Altiris Chocolatey's unique ability to work with any Windows machine, anywhere, allows you to deploy packages easily and efficiently in every environment, from on-premises, to the cloud (Azure, AWS, etc), to Docker containers, through many different tools and technologies.'''
