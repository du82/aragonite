full_description = 'Working at Chocolatey Software Search All Open Positions Be at Your Best If you are looking for the next move, or just want to be part of an exciting and fun business where you can be challenged, accepted, and supported then Chocolatey is a place where you can make your mark. We are growing fast and encourage everyone at Chocolatey Software to have a real impact on the company and our customers every day. We are driven, focused, and encourage creativity and collaboration. Work local and think global. We have created a remote friendly working culture. With the latest technology we allow our team to work anywhere in the world, still feel connected, and get their work done. We have developed our culture to offer a real work and life balance. Offering a comprehensive benefits package and option to work where you can be at your best. Learn and Grow with Chocolatey Bring New Ideas Forward Interact with Customers Help Customers and Community Chocolatey Software is leading the way in how organizations can successfully automate their Windows environments. Chocolatey is a proven software management solution for Windows - hundreds of thousands of users and thousands of organizations, including Microsoft, look at Chocolatey as a solution for rapid deployment and management of software on all supported Windows platforms, including Docker containers and cloud environments. If you like to help customers, bring new ideas forward, and want to learn and grow then Chocolatey offers you an excellent platform. Be Part of The Change We often hear how system engineers can spend hours deploying and configuring Windows software manually. Traditional tools are not built for modern automation and gaining insights and consistency across IT environments is not always easy. Chocolatey for Business (C4B) has helped hundreds of system admins save time, reduce downtime, and accelerate deployments. Chocolatey helps organizations bridge the gap from current approaches to proven DevOps approaches. If you are excited about how automation and software is changing the world then Chocolatey could be the right place for you to drive that change, develop new skills, and make great connections. Search All Open Positions "The Future of Windows Automation" with Rob Reynolds, Founder of Chocolatey Software'
