full_description = "Past Event from Wednesday, 17 January 2024 Watch On-Demand We are delighted to announce the release of Chocolatey Central Management v0.12.0, featuring seamless Deployment Plan creation, time-saving duplications, insightful Group Details, an upgraded Dashboard, bug fixes, user interface polishing, and refined documentation. As an added bonus we'll have members of our Solutions Engineering team on-hand to dive into some interesting ways you can leverage the new features available! Speakers: Gary Ewan Park Principal Software Engineer at Chocolatey Software Twitter GitHub Website Gary is a Microsoft MVP in Developer Technologies and also GitHub Star. Throughout his career, Gary has always looked to see how things can be automated, using the mantra that if you do the same thing more than twice, it is time for automation. James Ruskin Senior Solutions Engineer at Chocolatey Software Twitter GitHub LinkedIn Website James is a Senior Solutions Engineer with a passion for automation. Over the last decade, he has gathered experience and enthusiasm as a DevOps Engineer, SysAdmin, and general PowerShell dev. Paul Broadwith Technical Engineering Manager at Chocolatey Software Twitter GitHub Website Paul is an MVP in Cloud and Datacenter for his work in PowerShell and a Microsoft Certified Trainer (MCT). His career has seen him work in many sectors for over 30 years. As somebody kindly put it, he's been about a bit. Stephen Valdinger Customer Solutions Manager at Chocolatey Software Twitter GitHub Website Stephen is the Customer Solutions Manager who focuses on customer success, experience, and usage of Chocolatey Software products. He enjoys teaching people how to use Chocolatey to improve end user experience for their organizations. Watch On-Demand"
