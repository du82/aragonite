["https://chocolatey.org/privacy"]
title = "Chocolatey Software | Privacy"
description = "Chocolatey is software management automation for Windows that wraps installers, executables, zips, and scripts into compiled packages. Chocolatey integrates w/SCCM, Puppet, Chef, etc. Chocolatey is trusted by businesses to manage software deployments."
full_description = 'Chocolatey® Software Privacy Policy Last updated January 01, 2019 In Short: Chocolatey® Software is the sole owner of the information collected. We only have access to/collect information that you voluntarily give us via email or other direct contact from you. We do not share or rent your information with anyone. Your information is strictly used for the purposes of following up with you and offering products from Chocolatey Software. We will use your information to respond to you. We will not share your information with any third party outside of our organization, other than as necessary to fulfill your request, e.g. to ship an order. Unless you ask us not to (see "What Are Your Privacy Rights?" below), we may contact you via email in the future to tell you about specials, new products or services, or changes to this privacy policy. Summary Thank you for choosing to be part of our community at Chocolatey Software, Inc ("Company", "we", "us", or "our"). We are committed to protecting your personal information and your right to privacy. If you have any questions or concerns about our policy, or our practices with regards to your personal information, please contact us at legal at chocolatey dot io. If you wish to update/remove your data in accordance with GDPR or other reasons, please see "How Can You Review, Update, or Delete the Data We Collect from You?" below. When you visit our website https://chocolatey.org, and use our services, you trust us with your personal information. We take your privacy very seriously. In this privacy policy, we seek to explain to you in the clearest way possible what information we collect, how we use it and what rights you have in relation to it. We hope you take some time to read through it carefully, as it is important. If there are any terms in this privacy policy that you do not agree with, please discontinue use of our Sites and our services. This privacy policy applies to all information collected through our website (such as https://chocolatey.org), and/or any related services, sales, marketing or events (we refer to them collectively in this privacy policy as the "Services"). Please read this privacy policy carefully as it will help you make informed decisions about sharing your personal information with us. Table of Contents "What Information Do We Collect?" "How Do We Use Your Information?" "Will Your Information Be Shared with Anyone?" "Who Will Your Information Be Shared With?" "Do We Use Cookies and Other Tracking Technologies?" "How Long Do We Keep Your Information?" "How Do We keep Your Information Safe?" "Do We Collect Information from Minors?" "What Are Your Privacy Rights?" "Data Breach?" "Controls for Do-Not-Track Features?" "Do California Residents Have Specific Privacy Rights?" "Do We Make Updates to This Policy?" "How Can You Contact Us About This Policy?" "How Can You Review, Update, or Delete the Data We Collect from You?" #1. What Information Do We Collect? Personal information you disclose to us In Short: We collect personal information that you provide to us such as name, address, contact information, passwords and security data, and payment information. We collect personal information that you voluntarily provide to us when registering at the Services expressing an interest in obtaining information about us or our products and services, when participating in activities on the Services (such as posting messages in our online forums or entering competitions, contests or giveaways) or otherwise contacting us. The personal information that we collect depends on the context of your interactions with us and the Services, the choices you make and the products and features you use. The personal information we collect can include the following: Publicly Available Personal Information. We collect email addresses, business email, business phone number, first name, maiden name, last name, nickname, social media, and other similar data. Personal Information Provided by You. We collect data collected from surveys, and other similar data. Credentials. We collect passwords, password hints, and similar security information used for authentication and account access. Payment Data. We collect data necessary to process your payment if you make purchases, such as your payment instrument number (such as a credit card number), and the security code associated with your payment instrument. All payment data is stored by BlueSnap. You may find their privacy policy link(s) here. All personal information that you provide to us must be true, complete and accurate, and you must notify us of any changes to such personal information. Information automatically collected In Short: Some information – such as IP address and/or browser and device characteristics – is collected automatically when you visit our Services. We automatically collect certain information when you visit, use or navigate the Services. This information does not reveal your specific identity (like your name or contact information) but may include device and usage information, such as your IP address, browser and device characteristics, operating system, language preferences, referring URLs, device name, country, location, information about how and when you use our Services and other technical information. This information is primarily needed to maintain the security and operation of our Services, and for our internal analytics and reporting purposes. Like many businesses, we also collect information through cookies and similar technologies. #2. How Do We Use Your Information? In Short: We process your information for purposes based on legitimate business interests, the fulfillment of our contract with you, compliance with our legal obligations, and/or your consent. We use personal information collected via our Services for a variety of business purposes described below. We process your personal information for these purposes in reliance on our legitimate business interests, in order to enter into or perform a contract with you, with your consent, and/or for compliance with our legal obligations. We indicate the specific processing grounds we rely on next to each purpose listed below. We use the information we collect or receive: To facilitate account creation and logon process. If you choose to link your account with us to a third party account (such as your Google or Facebook account), we use the information you allowed us to collect from those third parties to facilitate account creation and logon process for the performance of the contract. To send you marketing and promotional communications. We and/or our third party marketing partners may use the personal information you send to us for our marketing purposes, if this is in accordance with your marketing preferences. You can opt-out of our marketing emails at any time (see the "WHAT ARE YOUR PRIVACY RIGHTS" below). To send administrative information to you. We may use your personal information to send you product, service and new feature information and/or information about changes to our terms, conditions, and policies. Fulfill and manage your orders. We may use your information to fulfill and manage your orders, payments, returns, and exchanges made through the Services. To post testimonials. We post testimonials on our Services that may contain personal information. Prior to posting a testimonial, we will obtain your consent to use your name and testimonial. If you wish to update, or delete your testimonial, please see "How Can You Review, Update, or Delete the Data We Collect from You?" below. and be sure to include your name, testimonial location, and contact information. Administer prize draws and competitions. We may use your information to administer prize draws and competitions when you elect to participate in competitions. Request Feedback. We may use your information to request feedback and to contact you about your use of our Services. To protect our Services. We may use your information as part of our efforts to keep our Services safe and secure (for example, for fraud monitoring and prevention). To enforce our terms, conditions and policies for Business Purposes, Legal Reasons and Contractual. To respond to legal requests and prevent harm. If we receive a subpoena or other legal request, we may need to inspect the data we hold to determine how to respond. To manage user accounts. We may use your information for the purposes of managing our account and keeping it in working order. To respond to user inquiries/offer support to users. We may use your information to respond to your inquiries and solve any potential issues you might have with the use of our Services. #3. Will Your Information Be Shared with Anyone? In Short: We only share information with your consent, to comply with laws, to provide you with services, to protect your rights, or to fulfill business obligations. We may process or share data based on the following legal basis: Consent: We may process your data if you have given us specific consent to use your personal information in a specific purpose. Legitimate Interests: We may process your data when it is reasonably necessary to achieve our legitimate business interests. Performance of a Contract: Where we have entered into a contract with you, we may process your personal information to fulfill the terms of our contract. Legal Obligations: We may disclose your information where we are legally required to do so in order to comply with applicable law, governmental requests, a judicial proceeding, court order, or legal process, such as in response to a court order or a subpoena (including in response to public authorities to meet national security or law enforcement requirements). Vital Interests: We may disclose your information where we believe it is necessary to investigate, prevent, or take action regarding potential violations of our policies, suspected fraud, situations involving potential threats to the safety of any person and illegal activities, or as evidence in litigation in which we are involved. More specifically, we may need to process your data or share your personal information in the following situations: Vendors, Consultants and Other Third-Party Service Providers. We may share your data with third party vendors, service providers, contractors or agents who perform services for us or on our behalf and require access to such information to do that work. Examples include: payment processing, data analysis, email delivery, hosting services, customer service and marketing efforts. We may allow selected third parties to use tracking technology on the Services, which will enable them to collect data about how you interact with the Services over time. This information may be used to, among other things, analyze and track data, determine the popularity of certain content and better understand online activity. Unless described in this Policy, we do not share, sell, rent or trade any of your information with third parties for their promotional purposes. Business Transfers. We may share or transfer your information in connection with, or during negotiations of, any merger, sale of company assets, financing, or acquisition of all or a portion of our business to another company. Business Partners. We may share your information with our business partners to offer you certain products, services or promotions. This is done strictly with your consent and in only limited situations where you are purchasing one of our commercial products, such as would need to be done with a reseller like SHI or Insight. #4. Who Will Your Information Be Shared With? In Short: We only share information with the following third parties. Our Services make use of the following third parties. Some of them you will have shared information with as part of providing Services to you. We only share and disclose your information with the following third parties. We have categorized each party so that you may be easily understand the purpose of our data collection and processing practices. If we have processed your data based on your consent and you wish to revoke your consent, please see "How Can You Review, Update, or Delete the Data We Collect from You?" below.. User Commenting and Forums Disqus Web and Mobile Analytics Google Analytics Payment Processing BlueSnap Marketing MailChimp Customer Relationship Manager Salesforce (Organizational prospects and customers only) #5. Do We Use Cookies and Other Tracking Technologies? In Short: We may use cookies and other tracking technologies to collect and store your information. We may use cookies and similar tracking technologies (like web beacons and pixels) to access or store information. Specific information about how we use such technologies and how you can refuse certain cookies is set out in our Cookie Policy. #6. How Long Do We Keep Your Information? In Short: We keep your information for as long as necessary to fulfill the purposes outlined in this privacy policy unless otherwise required by law. We will only keep your personal information for as long as it is necessary for the purposes set out in this privacy policy, unless a longer retention period is required or permitted by law (such as tax, accounting or other legal requirements). No purpose in this policy will require us keeping your personal information for longer than the period of time in which users have an account with us. When we have no ongoing legitimate business need to process your personal information, we will either delete or anonymize it, or, if this is not possible (for example, because your personal information has been stored in backup archives), then we will securely store your personal information and isolate it from any further processing until deletion is possible. #7. How Do We keep Your Information Safe? In Short: We aim to protect your personal information through a system of organizational and technical security measures. We have implemented appropriate technical and organizational security measures designed to protect the security of any personal information we process. However, please also remember that we cannot guarantee that the internet itself is 100% secure. Although we will do our best to protect your personal information, transmission of personal information to and from our Services is at your own risk. You should only access the services within a secure environment. #8. Do We Collect Information from Minors? In Short: We do not knowingly collect data from or market to children under 18 years of age. We do not knowingly solicit data from or market to children under 18 years of age. By using the Services, you represent that you are at least 18 or that you are the parent or guardian of such a minor and consent to such minor dependent’s use of the Services. If we learn that personal information from users less than 18 years of age has been collected, we will deactivate the account and take reasonable measures to promptly delet'
