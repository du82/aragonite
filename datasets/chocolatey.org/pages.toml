full_description = "Found An Issue? Was it with a package on this site? If you are having issue with a package, please see Request Package Fixes or Updates / Become a maintainer of an existing package. Packages provided on this site are community packages, as such they are unsupported. If you are looking for package support, and you are a business customer, please contact us about custom packaging for your needs. Security Issue? Stop here. If you found a security issue, please see Security and the report issues at the bottom. Are you a licensed customer / do you have a support contract? Please see our support page for details. Please use the support email. Optionally, if your support contract includes phone support, call the support line. You can also log issues at Licensed Issues and we will route the requests to the proper repositories. Are you an open source user? Please see open source support for details. Was it with this site? Please report the issue to the home repository. Was it with the choco.exe client? If you have found an issue with the CLI (choco.exe), please see the choco repository. Was it with the Chocolatey GUI? If you have found an issue with the GUI (Chocolatey GUI), please see the Chocolatey GUI repository."
