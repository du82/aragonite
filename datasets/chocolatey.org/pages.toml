title = "Chocolatey Software | Products"
description = "Chocolatey is software management automation for Windows that wraps installers, executables, zips, and scripts into compiled packages. Chocolatey integrates w/SCCM, Puppet, Chef, etc. Chocolatey is trusted by businesses to manage software deployments."
full_description = "A Sweet Collection of Chocolatey Products Chocolatey for Business (C4B) Chocolatey for Business is the enterprise offering that enables companies to adopt a DevOps approach to managing their Windows environment, allowing you to deliver applications to your users more reliably and faster. Chocolatey Open Source is great for individuals to get started on automating their Windows management, but when you have complex, critical infrastructure managed by teams, Chocolatey for Business offers more. With our business edition you get all of the benefits of open source Chocolatey together with enhanced capabilities, integrations, and the peace of mind of having a supported platform. Chocolatey for Business is Complete Software Management focused on three value-added areas - improved security, enhanced productivity features, and enabling more visibility. C4B is also backed with dedicated support, services, and roadmap. Getting started with C4B is easy and we are on hand to support you throughout your evaluation. Learn More Pro Edition (Individual) Individuals using the community repository can opt for Chocolatey Professional Edition to enhance their experience, giving them additional features such as more reliability and runtime malware protection. So whether you are looking to better manage your own PC or support your home network, Pro is designed to help you save time and effort. When you purchase a Pro license, your support goes towards infrastructure costs/improvements surrounding the community. Note: Pro is not allowed for organizational use. Open Source Chocolatey Chocolatey has the largest online registry of Windows packages. Chocolatey packages encapsulate everything required to manage a particular piece of software into one deployment artifact by wrapping installers, executables, zips, and/or scripts into a compiled package file. Package submissions go through a rigorous moderation review process, including automatic virus scanning. The community repository has a strict policy on malicious and pirated software. Search Chocolatey Packages > choco install docker-desktop"
