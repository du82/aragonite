["https://chollinger.com/blog/2023/01/qgis-is-the-mapping-software-you-didnt-know-you-needed"]
title = "QGIS is the mapping software you didn't know you needed - Christian Hollinger"
description = "QGIS is incredible: You can build maps that make use of the absolute wealth of public data out there and put Google Maps to absolute shame. This article is doing just that."
full_description = "Sometimes, I come across software that makes me wonder: “How didn’t I know about this before‽”. QGIS is such software. As a bit of background - I’ve always been a fan of playing with geospatial data, as evidenced most recently in my Tiny Telematics project series or how I built a Data Lake with geospatial data when we bought our house. [1] It’s an awesome field, because it not only maps (heh) the real world around you onto something quantifiable, it also enables you to tap into the absolute wealth of public data that is available at your fingertips. Census data, demographics, structure polygons of your neighbors houses, barns, and sheds, NASAs elevation data project, flood plains, soil data, light pollution, zoning codes - you name it. It’s out there. And it is genuinely useful. A note for my European friends - some of these links might not work from outside the US, as some .gov links tend not to. I don’t generally work with geospatial data in my day job (and I’m too dense for any of the advanced trigonometry that these jobs tend to entail), which makes the field even more appealing for playing around with on my own. My use case was not purely academic, though. I’ve recently purchased a “recreational property”, which is a loaded term, but allow me to quote: Recreational land can be defined as any piece of property with land used for purposes of recreation. This specific use can be anything from hunting, fishing, ATV-ing, camping, or any combination of the like. The main difference between this type of property and any other rural property can be profit, as many other rural properties like this are purchased for reasons such as farming, ranching, or timber harvesting. This is a pretty common thing in the US South, since we have a big lack of public land and the availability of the public land that is leased by the state and made available for use (mostly Wildlife Management Areas, which are crucial for the wildlife ecosystem of the state!) is under constant threat - and the land that is available usually comes with restrictions. Truly unrestricted land is mostly managed by the Bureau of Land Management and generally unrestricted, but we (the fine state of Georgia) only have a tiny amount of that."
year_published = 2023
year_updated = 2023
