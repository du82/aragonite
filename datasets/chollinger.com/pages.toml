["https://chollinger.com/blog/2023/10/moving-a-proxmox-host-with-a-sas-hba-as-pci-passthrough-for-zfs--truenas"]
title = "Moving a Proxmox host with a SAS HBA as PCI passthrough for zfs + TrueNAS - Christian Hollinger"
description = "How to move a Proxmox host to a new m.2 SSD when using a LSI SAS HBA card to realize PCI passthrough for HDDs for zfs + TrueNAS."
full_description = "My home server is a Proxmox cluster. Recently, one of the host’s SSDs indicated it needed a replacement. I run TrueNas SCALE on it by passing through all my hard drives via LSI HBA so that zfs has access to the raw hardware, which makes the migration to a new SSD a bit tricker. For added difficulty, this process assumes the SSD is a NVMe drive on a system with a single m.2 slot. This article just outlines the steps on how to do it, since it’s not super obvious. Please do not blindly copy paste commands, otherwise you will loose your data. You have been warned. Note: If you’ve been here before, you might know that I normally don’t write “tutorial” style articles, but I found this obscure and somewhat interesting enough a case study to make an exception. No, I’m not procrastinating on part 2 of bridgefour, you are. I added docker support! Start by taking snapshots of your VMs and ensure you have backups and send them to your standby/backup server. Since the TrueNAS VM doesn’t store any data itself, ensure its replica has a copy of your zfs snapshots, too: Next, turn off all existing VMs on the host. If any of the VMs runs critical services, migrate them onto a different host (if they’re not HA in the first place). Lastly, prepare the network for the loss of node in the cluster, e.g. if you run a DNS resolver or any other network software that is not redundant on it. This process is almost instant, since it only tracks metadata and doesn’t actually copy any of your data. Next, send it to a suitable backup location. This can be an external hard drive or your backup server. If you get an instant result here, though, maybe consider being skeptical on how your computer actually copied (presumably) hundreds of GiB within seconds. zfs will not warn you that it just copied only the 104K root without -v. Note: This process will remove the old node and re-add it, since the documentation warns against doing it differently. On paper, you are be able to skip this and restore the entire rpool later. That didn’t work too well for me. See the notes."
