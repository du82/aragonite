["https://choongsoo.info/interests"]
title = "Interests – Choong-Soo Lee @ SLU"
description = "Games It is probably an understatement to say that this is my favorite hobby. I've always been fascinated by computer games. I don't really have a favorite genre of computer games that I play. It's probably because I like all of them. I do not have as much time to play so Heroes of the…"
full_description = "Interests Games It is probably an understatement to say that this is my favorite hobby. I’ve always been fascinated by computer games. I don’t really have a favorite genre of computer games that I play. It’s probably because I like all of them. I do not have as much time to play so Heroes of the Storm is the only game I play regularly. I share this interest with many students who are also passionate about video games such as StarCraft II, Super Smash Bros. Brawl and Call of Duty. At Gustavus Adolphus College, I held a viewing for BlizzCon (Blizzard Entertainment Convention) for students in October 2011 and 2012, and hosted StarCraft II Tournaments in January 2011-2013. At St. Lawrence University, students and I started a student organization called SLU E-Sports Club. The SLU E-Sports Club hosted a League of Legends tournament for students as well as an event where faculty and students played League of Legends together. You can find the relevant news articles at: Starcraft tournament tests tactics at GAC (The Free Press) Starcraft Frenzy (Gustavus Weekly) My Heroes of the Storm gameplay has been on Twitch streams. Here are a few appearances @ https://www.youtube.com/playlist?list=PLfKjXENHdJuLZGN1in9OxApVBoTTopAYZ. Sports I have to admit that I like watching sports more than playing it. I enjoy watching soccer, tennis, baseball and football (recently started to understand the game). I can play squash and tennis although I have to learn to play both of them better. I also like hiking, and used to go to mountains near Worcester, MA from time to time. I’ve enjoyed hiking the Wachusett Mountains as well as Monadnock Mountains in New Hampshire. Music I listen to all kinds of music, but especially enjoy classical music. It’s probably due to my long-term exposure to classical music that I like the genre the most. My favorite composers include Wolfgang A. Mozart, Ludwig V. Beethoven and Piotr Tchaikovsky. As for the instrument, I love the sound of a violin. In addition to classical music, I listen to musicals, rock (Guns and Roses, Metallica, Rolling Stone, etc), Korean/Japanese/Chinese pop music and some jazz. The first musical performance I watched was Les Miserables in Seoul Arts Center (Seoul, Korea). I believe it was the Australian production. That experience sparked my interest in musicals and I’ve been to many musical performances since then. I’ve seen Les Miserables, Phantom of the Opera, Jekyll and Hyde, and Scarlet Pimpernel in Broadway theaters. I viewed Civil War at the Bushnell (Hartford, CT) and Evita at the Wang Theater (Boston, MA). The last musical I watched is Chorus Line in Seoul, Korea."
