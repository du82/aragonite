description = "Current Projects E-Sports Analytics The research involves capturing and analyzing online game data to discover and reveal different characteristics of competitive online games such as League of Legends and StarCraft II. Online Game Traffic Analysis and Modeling The research involves capturing network traffic of online games, developing traffic models and their validation, and implementing simulation…"
full_description = "Research Overview Current Projects E-Sports Analytics The research involves capturing and analyzing online game data to discover and reveal different characteristics of competitive online games such as League of Legends and StarCraft II. Online Game Traffic Analysis and Modeling The research involves capturing network traffic of online games, developing traffic models and their validation, and implementing simulation modules and applications. Quality of Experience of Watching Video Game Streams The research involves analyzing video game streams to discover ways to improve the viwers’ quality of experience. We are investigating ways to encode the videos using different sets of regions of interest. Cone Assisted Pointing System Ongoing research project with Dr. Guarionex Salivia at Minnesota State University. The research involves implementing relevant algorithms to assisting users’ movements using input devices such as mice, Wiimote and Kinect, collecting data on their performance with and without assistance, and analyzing the data to demonstrate statistically significant benefits. Facilitating the Use of Tablets in Classrooms The research involves identifying current difficulties in using a tablet in classrooms, devising new ideas on how tablets can be used as a tool to promote student learning, implementing an application for the iPad to overcome these obstacles and incorporate the new ideas, and finally, testing the application in real classroom settings. Credit-based Queue Management for Home Wireless Access Point Developed a credit-based queue management scheme for wireless access points to improve overall application quality in home networks. The proposed scheme assists delay sensitive flows based on characteristics of different applications without any prior configuration. Characterized general flow characteristics of common network activities at home, measuring and analyzing traffic in various home networks, developed analytical model of the proposed scheme and its validation, and finally, implemented the proposed scheme in a network simulator (NS-2) and evaluated its performance. Publications Ivan Ramler, Choong-Soo Lee, and Sarah Strong. Investigating Match Performance Differences between Genders of League of Legends Champions. In Proceedings of the Foundations of Digital Games 2021, Montreal, Canada, August, 2021. Ivan Ramler, Choong-Soo Lee, and Michael Schuckers. Identifying Symbiotic Relationships between Champions in League of Legends. In Proceedings for the 2019 Joint Statistical Meetings, Sports Statistics Section, Alexandria, VA, USA, July, 2019. Choong-Soo Lee and Ivan Ramler. A Data Science Approach to Exploring Hero Roles in Multiplayer Online Battle Arena Games, (Invited Chapter), in submission to Data Analytics Applications in Gaming and Entertainment, Günter Wallner (Ed.). July, 2019. CRC Press. Choong-Soo Lee and Ivan Ramler. Identifying and Evaluating Successful Non-meta Strategies in League of Legends. In Proceedings of the Foundations of Digital Games 2017, Hyannis, Massachusetts, USA, August, 2017. (Best paper award) (Acceptance rate: 40%) Choong-Soo Lee and Ivan Ramler. Rise of the Bots: Bot Prevalence and Its Impact on Match Outcomes in League of Legends. In Proceedings of the 14th International Workshop on Network and Systems Support for Games (NetGames), Zagreb, Croatia, December, 2015. (Acceptance rate: 35%) Choong-Soo Lee and Ivan Ramler. Investigating the Impact of Game Features and Content on Champion Usage in League of Legends. In Proceedings of the Foundation of Digital Games 2015, Pacific Grove, CA, USA, June, 2015. (Acceptance rate: 43%) Choong-Soo Lee. The Revolution of StarCraft Network Traffic. In Proceedings of the 11th Annual Workshop on Network and Systems Support for Games, Venice, Italy, November, 2012. (Acceptance rate: 43%) Choong-Soo Lee, Mark Claypool, and Robert Kinicki. Implementation and Demonstration of a Credit-based Home Access Point. In Proceedings of the ACM Multimedia 2010, Firenze, Italy, October 2010. (Acceptance rate: 32%) Choong-Soo Lee, Mark Claypool, and Robert Kinicki. A Credit-based Home Access Point (CHAP) to Improve Application Performance on IEEE 802.11 Networks. In Proceedings of the Multimedia Systems (MMSys), Scottsdale, Arizona, February 2010. (Acceptance rate: 43%) Choong-Soo Lee. CHAP – Credit-based Home Access Point for Overall Application QoS Improvement. In Proceedings of the Passive and Active Measurement Conference, Seoul, South Korea, April 2009. (Poster) Mingzhe Li, Choong-Soo Lee, Emmanuel Agu, Mark Claypool, and Robert Kinicki. Performance Enhancement of TFRC in Wireless Ad Hoc Networks. In Proceedings of the 10th International Conference on Distributed Multimedia Systems (DMS), San Francisco, California, September 2004. (Acceptance rate: 46%) Choong-Soo Lee, Emmanuel Agu, Mark Claypool, Robert Kinicki and Mingzhe Li. Low Delay Marking for TCP in Wireless Ad Hoc Networks. In Proceedings of IEEE Workshop on Multihop Wireless Networks (MWN), Phoenix, Arizona, USA, April 2004. (Acceptance rate: 28%) Technical Reports Choong-Soo Lee, Emmanuel Agu, Mark Claypool and Robert Kinicki. Low Delay Marking for TCP in Wireless Ad Hoc Networks, Technical Report WPI-CS-TR-03-34, Computer Science Department, Worcester Polytechnic Institute, December, 2003. Choong-Soo Lee, Mark Claypool, and Robert Kinicki. Enhancing Active Queue Management with Round-trip Time Awareness, Technical Report WPI-CS-TR-03-28, Computer Science Department, Worcester Polytechnic Institute, July 2003. Choong-Soo Lee, Mark Claypool, and Robert Kinicki. Chablis – Achieving Fair Bandwidth Allocation with Priority Dropping Based on Round Trip Time, Technical Report WPI-CS-TR-02-19, Computer Science Department, Worcester Polytechnic Institute, May 2002. Mark Claypool, Bob Kinicki, and Choong-Soo Lee. , Technical Report WPI-CS-TR-02-06, Computer Science Department, Worcester Polytechnic Institute, February 2002."
