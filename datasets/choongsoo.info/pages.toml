["https://choongsoo.info/research/software-development"]
title = "Software Development – Choong-Soo Lee @ SLU"
description = "Get Your Own Dataset Robin H. Lock, Ivan Ramler, and Choong-Soo Lee. DYOD (Download Your Own Data), Poster Session, USCOTS 2017 Show Me the Data State College, PA, USA, May, 2017. [PDF] Robin H. Lock, Ivan Ramler, and Choong-Soo Lee. Web Tools to Help Students Get Individualized Datasets on a Common Theme, MAA Session on…"
full_description = "Software Development Get Your Own Dataset Robin H. Lock, Ivan Ramler, and Choong-Soo Lee. DYOD (Download Your Own Data), Poster Session, USCOTS 2017 Show Me the Data State College, PA, USA, May, 2017. [PDF] Robin H. Lock, Ivan Ramler, and Choong-Soo Lee. Web Tools to Help Students Get Individualized Datasets on a Common Theme, MAA Session on Modern Data Sets for the Intro Statistics Classroom and Beyond, 2017 Joint Mathematics Meetings, Atlanta, GA, USA, January, 2017. Get your own dataset! Pebble Smartwatch Technology evolves at a fast pace, introducing new devices and programming languages. Smartphones and smartwatches are examples of popular new devices. These new devices often introduce a new set of challenges for computer scientists. Due to their compact size, smartphones and smartwatches are relatively small, and force us to consider different requirements. Smartphones and smartwatches have a smaller processor, less memory, and a limited power supply (battery). These characteristics force programmers to write more optimized codes in order to take most out of the limited hardware and to conserve energy. In order to keep up with the fast-paced technological trend, I often purchase these devices and learn how to program for them. In 2014, the estimate sales of smartwatches reach 6.8 million units*, and I bought myself a Pebble Time smartwatch to experiment. Pebble is one of the leaders in the smartwatch market, and has sold over one million smartwatches as of early 2015*. I developed a watch face called iClone for Pebble watches, which received over 400 hearts (likes) from users all around the world. As of mid-August 2016, it is ranked in the top 300 out of over 11,000 watch faces available in the Pebble App Store. The watch face has been downloaded over 4,000 times, and is accessed from over 50 countries around the world. On October 8, 2016, Pebble Style posted a tweet about the watch face. For our local community, I developed a smart watch app called Saints Athletics to facilitate following the schedule and results of our sports teams on Pebble watches. Correctional Facility Cell Search Scheduler One of the biggest news stories for the North Country in 2015 was the escape of David Sweat and Richard Matt from Clinton Correctional Facility. The New York state launched an extensive investigation and published the findings in the report titled Investigation of the June 5, 2015 Escape of Inmates David Sweat and Richard Matt from Clinton Correctional Facility). The report reveals that “Indeed, within the year preceding the escape, multiple cells were never searched, including Sweat’s cell.” “The Inspector General’s investigation revealed that Clinton practice does not ensure that all cells are regularly searched, and that cell searches, when conducted, are hasty and inadequate.” “The schedule should ‘ensure that each inmate’s cell, cube, or room is randomly searched within a specific timeframe.'” Although Clinton Correctional Facility used a computer software to generate search schedules, the officers failed to reinforce them. However, not all correctional facilities utilize computer software for random searches. I collaborated with an officer at Gouverneur Correctional Facility to develop a computer software that generates a random search schedule. The Gouverneur Correctional Facility started using the software in November 2016, and is now able to generate a random schedule much more quickly and minimize human error. The software is also expected to be deployed at Attica Correctional Facility in the near future."
