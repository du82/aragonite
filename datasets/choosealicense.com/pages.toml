full_description = "Primarily used for software libraries, the GNU LGPL requires that derived works be licensed under the same license, but works that only link to it do not fall under this restriction. There are two commonly used versions of the GNU LGPL. Make a pull request to suggest this license for a project that is not licensed. Please be polite: see if a license has already been suggested, try to suggest a license fitting for the project’s community, and keep your communication with project maintainers friendly. Create a text file (typically named LICENSE or LICENSE.txt) in the root of your source code and copy the text of the license into the file. The Free Software Foundation recommends taking the additional step of adding a boilerplate notice to the top of each file. The boilerplate can be found at the end of the license. Add LGPL-2.1-or-later (or LGPL-2.1-only to disallow future versions) to your project’s package description, if applicable (e.g., Node.js, Ruby, and Rust). This will ensure the license is displayed in package directories. If you would like your project to adopt the GPL-3.0’s cure provision, add the text of the GPL Cooperation Commitment to a file named COMMITMENT in the same directory as your LGPL-2.1 license file."
