["https://chris-lamb.co.uk/posts/2014-selected-highlights"]
title = "2014: Selected highlights - Chris Lamb"
full_description = "Previously: 2012 & 2013. January Was lent a 15-course baroque lute. February Grandpa's funeral. In December he was posthumously awarded the Ushakov Medal (pictured) for his service in the Royal Navy's Arctic Convoys during the Second World War. March A lot of triathlon training but also got back into cooking. April Returned to the Cambridge Duathlon. May Raced 50 and 100 mile cycling time trials & visited the Stratford Olympic pool (pictured). June Ironman Austria. July Paced my sister at the Downtow-Upflow Half-marathon. Also released the first version of the Strava Enhancement Suite. August Visited Cornwall for my cousin's wedding (pictured). Another month for sport including my first ultramarathon and my first sub-20 minute 5k. September Entered a London—Oxford—London cycling brevet, my longest single-ride to date (269 km). Also visited the Tour of Britain and the Sri Chomnoy 24-hour endurance race. October London—Paris—London cycling tour (588 km). November Performed Handel's Messiah in Kettering. December Left Thread.com. You can subscribe to new posts via email or RSS."
