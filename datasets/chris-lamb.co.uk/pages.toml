["https://chris-lamb.co.uk/posts/bts-bot-improvements"]
title = "BTS bot improvements - Chris Lamb"
full_description = '''A little while ago I completely rewrote the #debian-devel-changes IRC bot so it was actually maintainable. At the same time I added some commands suitable for developers, but I didn't really advertise them anywhere. Here goes. !bug <bug-number> Print a one-line synopsis of the specified bug. The parser is fuzzy and will find the bug number embedded in URLs, etc. !madison <source-package> Print a colourful rmadison output for the specified package. !qa <source-package> / !overview <source-package> Prints the URL of the Debian PTS entry for the specified package. !changelog <source-package> Prints a URL containing the most recent debian/changelog file for the specified package. !copyright <source-package> Prints a URL containing the most recent debian/copyright file for the specified package. !bug_graph <source-package> / !buggraph <source-package> Prints the URL of the bug graph for the specified package. !buildd <source-package> Prints the URL of the non-experimental buildd status of the specified package. !popcon <source-package> Prints the URL which contains the popularity-contest data for the specified package. !dehs <source-package> Prints the URL which contains the Debian External Health Status of the specified package. Some notes: Using these commands is easy: "/msg BTS <command>" on irc.debian.org or simply "[command]" on a channel that the bot is lurking on. Please don't spam channels with data from the bot - use a private message. This particularly applies to #debian-devel-changes. If you are communicating with the bot in a private message, the leading exclamation mark is optional. If you would like the bot to lurk on other channels, please ping me on IRC after gaining a consensus on the channel in question. As always, patches and suggestions welcome. (Source). You can subscribe to new posts via email or RSS.'''
