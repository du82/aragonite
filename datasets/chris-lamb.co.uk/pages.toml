["https://chris-lamb.co.uk/posts/awarded-core-infrastructure-initiative-grant-reproducible-builds"]
title = "Awarded Core Infrastructure Initiative grant for Reproducible Builds - Chris Lamb"
full_description = "I'm delighted to announce that I have been awarded a grant from the Core Infrastructure Initiative (CII) to fund my previously-voluntary work on Reproducible Builds. Whilst anyone can inspect the source code of free software for malicious flaws, most software is distributed pre-compiled to end users. The motivation behind the Reproducible Builds effort is to permit verification that no flaws have been introduced — either maliciously or accidentally — during this compilation process by promising identical results are always generated from a given source, thus allowing multiple third-parties to come to a consensus on whether a build was compromised. I'd like to sincerely thank the CII, not only for their material support but also for their recognition of my existing contributions. I am looking forward to working with my co-grantees towards fulfilling our shared goal. You can read the CII's press release here. You can subscribe to new posts via email or RSS."
