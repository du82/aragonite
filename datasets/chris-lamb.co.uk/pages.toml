["https://chris-lamb.co.uk/posts/claws-mail-transparent-subject-rewriting"]
title = "Claws Mail transparent subject rewriting - Chris Lamb"
full_description = "I use Claws-Mail (née Sylpheed-Claws) for my email. One nice feature I found a couple of months ago was subject-line rewriting: A number of mailing lists I subscribe to add a totally obnoxious prefix on each outgoing message. I've yet to think of a good reason to do this - I can only assume it's for far less capable mail clients. Or something. This results in much cleaner message list. You can probably do this in procmail, but having it in the presentation layer has the advantage that the rewrite is non-destructive - pressing Reply constructs a subject line from the original. You can subscribe to new posts via email or RSS."
