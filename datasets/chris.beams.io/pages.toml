title = "Phase Zero: A Plan for Bootstrapping the Bisq DAO"
description = "A whitepaper detailing the design and rollout of the Bisq DAO and BSQ colored coin."
full_description = "bisq Phase Zero: A Plan for Bootstrapping the Bisq DAO A whitepaper detailing the design and rollout of the Bisq DAO and BSQ colored coin. cbeams Read more posts by this author. cbeams 19 Oct 2017 • 2 min read Abstract. We present an overview of Bisq, a peer-to-peer exchange network designed for secure, private and censorship-resistant trading of bitcoin for national currencies and other cryptocurrencies. We demonstrate that while Bisq already provides users with a high degree of security and privacy through decentralized architecture and other protections, the project cannot achieve the degree of censorship resistance it requires without first decentralizing its funding and governance. We review the Bisq DAO and BSQ token that have been designed to achieve this goal and we analyze the risks inherent to rolling them out. We conclude by presenting the Phase Zero plan for a pre-release period in which each aspect of the Bisq DAO is operationalized in an incremental and risk-mitigating fashion. Compensation, voting, bonding and other DAO use cases commence immediately as high-trust operations in a testing environment and iterate toward trust-minimized operations in production. BSQ stake is tracked on Bitcoin testnet during Phase Zero such that BSQ may be earned but not traded or spent. Completion of Phase Zero is marked by a BSQ genesis distribution on Bitcoin mainnet and a Bisq application release supporting BSQ trading and other key DAO use cases.Phase Zero: A Plan for Bootstrapping the Bisq DAObisq-docs/phase-zero.adoc at master · bisq-network/bisq-docsBisq Network documentation formerly at docs.bisq.network (still available at bisq-network-docs.netlify.com for posterity), now decommissioned in favor of https;//bisq.wiki. - bisq-docs/phase-zero.a...GitHubbisq-network More in bisq How to Use a Decentralized Exchange 2 Oct 2020 – 1 min read Bisq Q1 2020 Update 30 Jan 2020 – 1 min read Coin Pod #6: Decentralized Exchanges and Bisq 13 Mar 2018 – 1 min read See all 9 posts →"
