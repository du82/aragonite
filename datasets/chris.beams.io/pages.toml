full_description = '''bisq Changelog #269: Bisq, the decentralized Bitcoin exchange A 110-minute interview with the Changelog podcast cbeams Read more posts by this author. cbeams 6 Sep 2017 • 59 min read AbstractChris Beams joins the show to talk about Bisq, the P2P decentralized Bitcoin exchange and open-source desktop application that allows you to buy and sell bitcoins in exchange for national currencies, or alternative crypto currencies. We get some background on the issues faced by crypto exchanges like Coinbase, and the now defunkt Mt. Gox. We discuss whether or not Bitcoin is a censorship resistant payment system and what it means to have anonymous transaction currency options. Bisq also has an interesting white paper about its own DAO (Decentralized Autonomous Organization) to support its contributors and we discuss that in detail at the end of the episode.Episode pageBisq, the decentralized Bitcoin exchange featuring Chris Beams (The Changelog #269)Chris Beams joins the show to talk about Bisq, the P2P decentralized Bitcoin exchange and open-source desktop application that allows you to buy and sell bitcoins in exchange for national currencies, or alternative crypto currencies. We get some background on the issues faced by crypto exchanges lik…ChangelogAudio Download podcast mp3 Note: interview begins at 2:18TranscriptSourceJerod Santo: Chris, we're talking about Bisq, previously Bitsquare. Why don't you tell us about the naming and why you all decided to change it? Chris Beams: Yeah, so the project has been around now for about three and a half years, and most of that time it had been under the name Bitsquare, which people may have heard of if they've been around the Bitcoin space at all. And the reason that it was called Bitsquare in the beginning is because it was kind of a play on the idea of what's come to be known as Satoshi squares in the Bitcoin world. What Satoshi squares were... People might know the name - Satoshi, like Satoshi Nakamoto, the creator of Bitcoin, and people would form Satoshi squares, which were in-person opportunities to exchange Bitcoin for whatever their local currency was - dollars, or euros, or what have you, and they were just informal things. So that's where the name came from - Bitsquare, a way of having Satoshi Square-like interactions, peer-to-peer exchange of Bitcoin for national or fiat currency, but not having to do it in an actual physical meet space; doing it online, doing it on a proper peer-to-peer network. [00:04:26.13] Then earlier this year we changed the name, because Bitsquare was a potential overlap with a certain trademark holding financial services company that people might be able to guess the name of, because Bitsquare's name kind of intersects with it, and they asked us nicely if we might change the name. So we did, and we just shortened it down to Bisq, which was kind of an abbreviation of the original Bitsquare, and it's a relatively unusual and sort of Google-friendly name. That's how we got there. Adam Stacoviak: When you rename something like that, you often lose some people in that; how long ago was this renaming and what is the downfall of a rename? Chris Beams: Of course, the process itself takes a while; it was happening starting around April of this year. I'm not sure that we've lost so many people per se, but there's just a cost to it because you have to continually repeat the fact that it's been changed, and you're always in the business of saying "Bisq (formerly known as Bitsquare)", so just the introduction of the project... Much like the conversation we're having right now, it takes a while, right? Because you wanna make sure to bring people into the fold that had heard of the project before, under its previous name, and so on. But in general, it's been okay. One thing that helped there is that while the project has been around under development for three and a half years roughly as we speak, it's been live in production for about 16, 17 months now, so people who had actually been using the application to do live trading had only known it as Bitsquare for just a handful of months at that point. Adam Stacoviak: So Bisq is an open source desktop app. Not only that, but it's also an exchange network, but it's the formation around it, at least based on your white paper, the motivation around it is essentially around the censorship, the different things around the current ways in which you trade Bitcoin, right? Can you kind of give us the background, to some degree, of the problem with crypto exchanges like Coinbase etc, different places where you can actually go and do these original squares, which is kind of interesting how that came about? Chris Beams: Yeah, so I'll talk about "centralized" exchanges in just a second, like you talk about, but just to get first to principles - you're asking "Why did we create it the way that we did?" and it's because it's really modeled after Bitcoin itself. We wanted to build the exchange that the Bitcoin network needed in our minds. What does that mean? Well, Bitcoin itself is this remarkably censorship-resistant network; it's really designed as such. It's global, it's at this point by all accounts unstoppable, right? It's definitely powered through different governments and different agencies, considering ways to take it down or attack it, and so on. We'll probably see lots and lots more of that over the years to come, but for essentially zero downtime on the networks, and January 2009 the Bitcoin blockchain has just been running along more or less smoothly, right? [00:08:08.19] We thought that that's exactly the kind of exchange that we wanted to build - something that's just as permissionless, privacy-respecting, and indeed censorship-resistant as Bitcoin itself. What we've seen emerge since Bitcoin essentially first got a price, around 2010 -- the network was running for many months before anybody ever actually exchanged Bitcoin for value, and pretty much the moment that began, the first exchanges started popping up, and if people know anything about this space, they probably know at least the headlines that they read in 2013 about the Mt. Gox exchange, which was responsible for something on the order of 700 million dollars worth of Bitcoin being stolen. Of course, the reason that that was possible, for Bitcoin to be stolen, is because when you're dealing with a centralized exchange - meaning, by the way, a website, right? Fundamentally a web app, where three parties are involved - the person who wants to sell, the person who wants to buy, and the exchange itself. When things are designed that way, the exchange has to have custodial control over the user's Bitcoin for at least some period of time. And typically, just for reasons of convenience, people would keep their Bitcoin on the exchange for much longer than just the moment that was necessary to match a trade and then cash out. When Mt. Gox was hacked back then in 2013, something like the tune of 700 million dollars worth of Bitcoin were under the control of Mt. Gox, and that fundamentally means the private keys that were capable of spending that Bitcoin were in the control of Mt. Gox. That's basically a great, big honey pot. It's like, there's 700 million reasons that an exchange like Mt. Gox would get hacked, and it's utterly predictable that the beatings will continue if this sort of architecture doesn't change. And of course, that's exactly what happened. Over the years, there's been an almost predictable pace of exchanged getting hacked, and various amounts getting stolen and so on. It's just the nature of the beast. When there's enough value in a given system or location that can be hacked, it probably will be hacked. So that's always been our motivation - that's the security side of Bisq, it's the security of users' funds; we wanna make sure that people can actually fulfill the promise of Bitcoin, which is... You know, people sometimes say "Be your own bank", that you can actually keep custodial control of your own private keys, your own Bitcoin, and you can have as much security as you can manage. Assuming you have well put-together operational security practices, you're using things like hardware wallets, or air gapped computers, or whatever it is that you deem appropriate to secure however many Bitcoin it is that you have, you have that full control, you have that full capability. The Bisq application never maintains control, it never has the opportunity to steal your funds, because it never holds your funds; it's just between you and your counterparty, essentially. Jerod Santo: [00:11:54.03] Yeah, I have a couple of questions breaking off of this. The first one is perhaps speculative a little bit, with regards to exchanges being hacked and the analogy between a cryptocurrency exchange having custodial control over your wallet, or really your keys at that point, in order to have access to trade that coin, is very similar to banks... Like you said, "Be your own bank"; well, with a Coinbase or a Bitstamp or a Mt. Gox or whatever, you're allowing them to be your bank, to a certain degree, and that's problematic. And like you said, the more honey that's in the pot, the more attackers are gonna come after those things. I guess my question would be why don't we have more historical banks being hacked? Our Bank of America, our First National... Now I'm of course putting this in an American context, but they are very literally banks and they have online presences and they have web apps, so why is everybody going after Bitcoin exchanges and not after places where you can get cold, hard cash? Chris Beams: Yeah, I'm certainly not an expert in the space of traditional physical banks getting robbed, but just to hazard an answer to this... I think to some degree banks do still get robbed, like literally people coming in and saying "Put all the money in the bag..." Adam Stacoviak: This sounds like a physical hack. Jerod Santo: Sure. Chris Beams: Yeah, I don't think that's a done deal, and I think the reason that that still happens, however high risk that may be - I don't know how many people successfully get away with it, but of course, the reason... One famous bank robber was asked "Why do you rob banks?" "That's where the money is" was his answer. [laughter] And it is still where the money is, at least to the extent of cash bills in a cashier's drawer, so you actually can get the honey out of the pot. But I think when we -- and this is where I'll quickly get out of my depth, so anybody who actually is working for a bank, my apologies ahead of time... But I imagine the reason that we don't see people hacking into Bank of America's servers and so on and "stealing all the money" is because what they're stealing would be entries in a database representing... Jerod Santo: Transactions. Chris Beams: Yeah, representing transactions, representing ultimately their kind of fractional reserves and so on. The money itself is not a digital thing, a digital asset that can be taken away in a digital bag, if you will, when what's there is actually private keys, like files; it also may be entries in a database, but strings of numbers and letters representing a private key. You can actually take those and run away and spend the Bitcoin that they have access to. There's no correlate I think in the traditional banking, because it's not fundamentally digital. Adam Stacoviak: On that note though, I think that in today's world it's so hard to see what you're saying there about traditional banking, and that you're not actually stealing funds because so much of what we do is removed from actual cash... You know, we don't often -- there's some people out there who live by cash and spend only cash, but the large majority of the world relies on some sort of market like Visa, MasterCard, American Express, some sort of credit card type system that ensures secure payments, or some sort of digital way to do a transaction. So we're so used to not actually spending real cash hand-to-hand, so it's hard to see that, that it's not digital. Chris Beams: Yeah, it sure feels digital, right? When you log into your online banking or swipe your card here, or what have you. But in the end, it's not a natively digital money, which is the big difference. Jerod Santo: [00:16:01.03] So let's get back to the point about being your own bank, and we'll branch off in here; this is where I think Bisq is interesting to me as a thing that you guys are doing, and hopefully it's successful in what I think is providing the power to decide to more people. Because if you look at the tradeoffs between centralized exchange and you say "Why are people using these?" and you even said it yourself, it's because of the convenience, it's because of the access, and a lot of times that convenience isn't "This is simply easier for me to do", but it's actually accessible, in terms of "I don't know how to do it on my own. It's too difficult. So this is not just convenient for me, it's actually enabling me to do something that I couldn't do on my own." We've seen a lot of hacks and we've seen a lot of -- even recently Ethereum, I think somebody drained 31 million from some Ethereum wallets, you mentioned the big one with Mt. Gox with Bitcoin... The other thing we see a lot is people losing their own coins, right? They lose their private keys; they've got them in three places and in a safety deposit box... I just saw a Reddit thread the other day where a guy still managed to basically lose his entire Bitcoin wallet - which I think was sizeable, by the way - even despite all of these different steps that you take, and by doing something that I don't recall the details... But it's really hard, even for technical people. It's hard to get it right and to keep it right and not lose your stuff because you're personally a really bad bank, you know? So is Bisq trying to make that easier for regular Joes? Chris Beams: Yeah, I think it's only gonna get harder, by the way, especially for people who have growing amounts of value. It's actually a real challenge to fully, properly secure Bitcoin in any case. Jerod Santo: Real quick, Chris, can you break that down for us and just explain? I've assumed our listeners all understand the problem with the keys. Can you just lay it out, like what would happen...? How can I go about just losing the Bitcoin that I have in a personal wallet? Can you just explain that for the listeners? Chris Beams: Yeah, sure. So let's just assume the simple scenario of you've gotten your first Bitcoin wallet - it's a desktop application - and I've sent you some Bitcoin just to get you started, so now you have 0.1 Bitcoin or something like that sitting in that wallet, and five minutes later your machine melts down. It's just an unrecoverable disk failure, and your time machine hasn't had time to back it up, or whatever; you don't have any backup of it. That wallet on that computer was the only home of the private keys that can spen'''
