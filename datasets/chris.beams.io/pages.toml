full_description = '''bisq Crypto Voices #26: Chris Beams - Bisq DAO & Crypto Exchange A two-part, two-hour interview with the Crypto Voices podcast cbeams Read more posts by this author. cbeams 8 Dec 2017 • 1 min read Part IMatthew interviews Chris Beams from Bisq, the decentralized crypto asset exchange. This is part one in a two-part episode!We discuss a variety of interesting topics covering the Bisq platform, including how "decentralized" it actually is, the current (and planned) governance among its founders and stakeholders, the role and creation of the BSQ colored coin on Bitcoin's blockchain (including its distribution via testnet), the key features of the Bisq trading platform (security, privacy and censorship resistance), how one actually trades on the Bisq exchange, and more, such as the key features of decentralized systems, DAOs, and the technological adoption of Bitcoin during these days of heady prices.Links for more info:- bisq.network/- github.com/bisq-network/docs/b…dao/phase-zero.adoc- twitter.com/cbeams- medium.com/@mcasey0827/specula…theory-2eed48ecf7daPart IIMatthew interviews Chris Beams from Bisq, the decentralized crypto asset exchange. This is part two in a two-part episode!We discuss a variety of interesting topics covering the Bisq platform, including how "decentralized" it actually is, the current (and planned) governance among its founders and stakeholders, the role and creation of the BSQ colored coin on Bitcoin's blockchain (including its distribution via testnet), the key features of the Bisq trading platform (security, privacy and censorship resistance), how one actually trades on the Bisq exchange, and more, such as the key features of decentralized systems, DAOs, and the technological adoption of Bitcoin during these days of heady prices. More in bisq How to Use a Decentralized Exchange 2 Oct 2020 – 1 min read Bisq Q1 2020 Update 30 Jan 2020 – 1 min read Coin Pod #6: Decentralized Exchanges and Bisq 13 Mar 2018 – 1 min read See all 9 posts →'''
