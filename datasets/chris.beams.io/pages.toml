full_description = "bisq Coin Pod #6: Decentralized Exchanges and Bisq A 40-minute interview with the Coin Pod podcast cbeams Read more posts by this author. cbeams 13 Mar 2018 • 1 min read AbstractThe security vulnerabilities of centralized cryptocurrency exchanges are attributes very much inherent to centralized exchange. Andreas Antonopoulos frequently comments that there are only two types of centralized exchanges: the ones that have been hacked and the ones that have yet to be hacked. And the long and continually-growing list of hacks demonstrates that he's probably right.An alternative to centralized exchanges comes in the form of decentralized exchanges, of which one of the most promising is Bisq. Today, Chris Beams, co-founder of Bisq, joins me to chat about decentralized exchanges categorically and, more specifically, the Bisq project.Bisq is one of the leading decentralized exchanges in the Bitcoin space due in no small way to their uncompromising stance on pure decentralization, Chris explains. The strategy, challenges, progress, and on-going work at Bisq shows the immense potential of decentralized exchange in a space currently clogged with vulnerable centralized exchanges.Follow @bisq_network on Twitter for more information about the awesome work Chris and the whole Bisq team is doing and visit their website for all the resources you need to start using Bisq today.Audio Download podcast mp3 Episode pageDecentralized Exchanges and Bisq with Chris Beams – The Coin Pod, Ep. 6 - You, Me, and BTCDownload Podcast | Subscribe The security vulnerabilities of centralized cryptocurrency exchanges are attributes very much inherent to centralized exchange. Andreas Antonopoulos frequently comments that there are only two types of centralized exchanges: the ones that have been hacked and ...You, Me, and BTCZack Voell More in bisq How to Use a Decentralized Exchange 2 Oct 2020 – 1 min read Bisq Q1 2020 Update 30 Jan 2020 – 1 min read Bisq: a Decentralized Bitcoin Exch