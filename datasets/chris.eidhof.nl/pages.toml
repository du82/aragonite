["https://chris.eidhof.nl/post/2023-14"]
title = "Weeknotes № 14 — Chris Eidhof"
full_description = "Weeknotes № 14 Random Things I worked a bit on porting some “older” features we had in our test implementation of attributed string builder, and added them to our public repository. We’re planning to use that for publishing our book. We want back and forth a lot, but we believe it’s easier to work with our own implementation based off of attributed strings than trying to wrangle LaTeX or desktop programs such as InDesign into the layout we want. By using attributed strings, we can write our book while automatically having our code checked, syntax highlighted and have proper previews. I wrote a small library that helps me to record a SwiftUI view as an mp4 video. I always find it annoying to precisely record a video of an interaction, transition or animation, and this should hopefully make it a little bit easier, as it records exactly the bounds of a view: I don’t have to fiddle with positioning QuickTime or hope I get the timing right. I also wrote up a quick blog post about matched geometry effect. I was really tired from the move last week, and this week went pretty slow because of that. I didn’t even have the energy for my daily run, but instead of fighting that I just rested. I started preparing an upcoming workshop, working a bit on the book (we forgot to write about EnviromentObject). While I did feel very tired, I am also way less stressed now that it’s only the final bits of the house. We spent a few days in and around our new house, cleaning things, building more raised beds, and so on. It feels pretty great to do that now that spring is really starting. Posted on Apr 9, 2023 by Chris Eidhof (Mastodon, BSky)."
