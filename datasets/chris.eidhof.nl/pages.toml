["https://chris.eidhof.nl/post/selecting-which-apps-to-build"]
title = "Selecting which apps to build — Chris Eidhof"
full_description = "Selecting which apps to build I have a huge list of ideas for iPhone apps (and lots of other ideas). When I last counted, there were over a hundred items on my list. How do I select which apps to build? Marketing First of all, I need a way to do marketing. It helps a lot if it is a niche product. For example, I have an idea for a very cool iOS marketplace site, but it will be nearly impossible for me to do the marketing, as it is targeted at everybody with an iPhone. Instead, TrackMe (my location tracking app) is a lot easier to market: I want to be noticed by travelers, digital nomads and people interested in quantified self. Ease of building I look at how hard it is to build the product. Can I manage with only an app, or do I need a server as well? Do I master all the necessary technology? Is it very design-intensive? Can I quickly hack together a prototype and test it? For TrackMe, I was able to build a prototype in less than an hour and improved upon that. A web app I once thought of (a Project Euler for web programming) takes a few months to build, which is currently too long for me. Potential audience How big is the potential audience? Are they willing to pay? Am I part of it or do I know people in the audience? Do people own iPhones? Would I use it? For me, it really helps if I use the app all the time. This forces me to make it very good and keep improving it as I think of simpler or better ways to do things. For example, I once thought of an app to track your client visits (in the Netherlands, people with a company car need to track this). However, I don’t own a car and am thus not going to use the app, so I wont’t be motivated to keep improving it. Instead, anything to do with productivity, life hacks or travel I find extremely compelling. If you use your own app all the time it can really help you to stay motivated. Can I easily charge for it? As an indie developer, it is vital to make money with the things you build. I once had the idea for a site with only Arthouse movie torrents. Aside from not wanting to be involved in illegal or something in the gray area around that, I think it would be virtually impossible to charge people for it. Most iPhone apps are easier: you just put a price on it or charge a monthly subscription. Which methods do you use to select the ideas you will work on? Please discuss at Hacker News. Posted on Aug 26, 2011 by Chris Eidhof (Mastodon, BSky)."
