["https://chris.eidhof.nl/post/2023-06"]
title = "Weeknotes № 6 — Chris Eidhof"
full_description = "Weeknotes № 6 Workshops and Environment We got our internet access working at the new house. We also won’t move before the end of March, probably later, but at least that part is working. We had a bit of a setback this week, as we found out that the plastering will take quite a bit longer than calculated. It’s a big chain of dependencies: we can’t paint before we’ve plastered, we can’t lay the floor before we’ve painted, and we can’t start plastering before the new window frames are installed (which should happen next week!). My best friend from The Netherlands came over, we just hung out, did a little bit of work on the house together (we put up a new bathroom ceiling). I made bagels, which turned out much tastier than last week, and they looked good, too! As I’m quite pressed for time these days, I need to be a bit creative about combining activities. I ran with the youngest in the running stroller (she gets to sleep, the rest of the family gets a break, and I get to do some exercise). Also, we bought a cargo bike last year, and it arrived last fall. Every time I cycle go to our new house I bring a few boxes. I’ve been using our cargo bike to transport kids (it fits a baby car seat and two small kids), transport building materials (although 6 bags of cement was pushing it), and I’ve already filled it up many times to move stuff over to the new house. It’s been a game-changer for me. I think I would’ve still done most of the trips by bike if it wasn’t for the cargo bike, but this way I can avoid virtually all our car usage within the city limits. I ordered “Airlineschienen” (I think it’s called lashing rail in English?) for the inside of the bike’s cargo box. This will let me flexibly attach a bunch of stuff, and should help me strap down the load. I’ll also use them to attach hooks for shopping bags (they tend to fall over when small), kids backpacks, etc. (I did “upgrade” our car recently, adding a hitch and an external AirPlay screen. Of course, this was much simpler/cheaper/more sustainable than buying a new (used) car.) We ran a two-day workshop, this time in CEST. It was really nice to have people in the workshop that already had a bunch of SwiftUI experience, we could go much deeper into the material and answer a lot of questions. We improved some minor things in our interactive workshop explanation app, in the workshop itself and recorded a few episodes around our new backend library (which we plan to use to modernize/rewrite the Swift Talk backend with). I published two blog posts this week that both came directly from questions in the workshop. The first post contains tips about the SwiftUI Environment and the second post is about semantic colors and styles. The second post includes some nice graphics that are automatically generated when building this site — they should look good with both the dark theme and the light theme. Posted on Feb 10, 2023 by Chris Eidhof (Mastodon, BSky)."
