["https://chris.eidhof.nl/post/2023-32"]
title = "Weeknotes № 29-32 — Chris Eidhof"
full_description = "Weeknotes № 29-32 SwiftUI Presentations The last weeks we’ve mostly enjoyed our holiday (visiting the Baltic sea), spent time in the garden, and generally took it easy. I finished the keyframe implementation, I think it’s almost the same as the native implementation but it works on older platforms. It’s not efficient and the code isn’t very pretty yet. While I don’t worry too much about efficiency, I would like to clean up the code before putting it out. I’ve worked pretty hard on preparing the presentation that I gave last week at Swift TO and will give this week at iOSoho. There are almost 150 slides (build steps) for 30 minutes of talking (not including some of the hand-controlled animations). I don’t think I’ve ever had that many slides, and I don’t think it was too much. I created the presentation using SwiftUI. This was both scary (what if it breaks on stage?) as well as really fun and productive. I was able to use all the builtin views and drawing, and a lot more nerdy stuff: The presentation is a custom Mac app with two windows: one presenter window that I control and see, and a second presentation window that displays full-screen on the projector. Almost everything in the presentation is fake, to make things controllable and reliable. The simulator, the animated mouse clicks, the buttons, and the network loading. I reused our (internal) diagrams library to draw and animate all kinds of tree diagrams. I used Pow for some of the animated effects. Not just transitions, but also shimmer effects in the tree diagrams to highlight specific features. I used the iPhone simulator chrome to draw my views as if they were running in the simulator. I dug up my old Logitech clicker, which works as if it were an external keyboard. I handled the keyboard events in SwiftUI, not only to move between slides but also to toggle specific features and trigger some animations. I couldn’t get all the animations to work exactly the way I wanted to. Specifically the tree diagrams have some broken animations. I think this is due to the vertices being rendered through preferences. Likewise, I wanted to add a few more custom animations that I just didn’t have the time to implement. However, for upcoming presentations I should be able to take what I have and improve upon this, slowly working my way towards the perfect presentation. Because anything can go wrong, I also spent a day implementing PDF export. This gave me a backup for when things fail as well as readable slides for other people. On recent versions of macOS, it’s now very easy to export SwiftUI views as vector PDFs. Some native views (e.g. ProgressView) render as red circles with a line through them, but I could quickly work my way around that. Of course, I did all of this work after I had the story and outline for my presentation done. I knew what I wanted to say, how much time I had left to prepare and made the decision to bite the bullet and use SwiftUI. It was way more work than doing a live-coding presentation or creating slides in Keynote, but I did enjoy it. I’ve gotten some great feedback on the presentation. There were even people fixing bugs in their codebase the same day, which is always very rewarding. My goal was to help people understand my mental model of SwiftUI, and from talking to the attendees, I think I have achieved that. I’m not sure whether the presentation video will be available publicly, but I’ll post the annotated slides here soon. Posted on Aug 14, 2023 by Chris Eidhof (Mastodon, BSky)."
