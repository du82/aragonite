["https://chris.eidhof.nl/post/2023-38"]
title = "Weeknotes № 38 — Chris Eidhof"
full_description = "Weeknotes № 38 Recording and Experimenting Last week we recorded a bunch of episodes around building a small marquee component. We wanted to make it interactive (similar to a scroll view) which makes the underlying implementation a bit different from how you would normally write SwiftUI components. The animations are driven by a TimelineView so we can also easily do some math around the gesture velocity. We also got our proof copy of the print book, so close to release now. We made a few final adjustments to this as well. In the evenings I spent some more time on my recording app. I hope to use it for a presentation next week (not sure yet if the presentation will happen). My goal is to make it very easy for me to make these kind of interactive text animations so that I can easily prototype and ship high-quality code animations. I’m currently mostly just trying to get that recording workflow perfect. I swam a bunch more, also with a wetsuit (it’s not necessary yet, just to try what it’s like). I feel like my fear of open-water swimming is definitely getting a lot less. As always, one of the best ways to deal with fear is confronting it, which is definitely working in this case. Posted on Sep 25, 2023 by Chris Eidhof (Mastodon, BSky)."
