["https://chrisbrejon.com/articles/guerilla-render-in-production"]
title = "Guerilla Render in production - Chris Brejon"
description = "Guerilla Render in production is about the amazing render engine that was used on Playmobil. Cutting-edge technology, Sequence lighting... Brute force !"
full_description = "Guerilla Render in production Post author:chrisbrejon Post published:March 23, 2020 Post category:Articles Table Of Contents IntroductionProduction examplesWhat is Guerilla ?Shot exampleShot descriptionLighting and CompositingRender timesHuman time VS Machine timeModern pipelineDigital Set on PlaymobilCoherence and flexibilityWorkflow aspects of PlaymobilConcrete solutionsSequence LightingThe secret life of petsLego BatmanPlaymobil the movieThe Sequence lighting debateOther cool featuresReal-time ViewportOne button renderPlaymobil fun factsMy interviewMeeting with AnyaMaster class with André TurpinBreakfast with LinoGuerilla, the future is hereDenoisingBrute-Force HairVolumetric SSSConclusionSources Introduction If you have read my book, you may have noticed that I am a Guerilla Render fan. I have only used this wonderful piece of software on one show, Playmobil the movie (Director: Lino Di Salvo), but I almost instantly felt in love with it. Before we go deep into the description of Guerilla, I would like to state that I do not work for Mercenaries Engineering. I am doing this post because I have been annoying many many colleagues with the cool features used on Playmobil… And thanks to my website I can even bug more people now. 😉 Joke aside I think there were some really powerful ideas on this show that are worth mentioning and sharing. Lighting workflows are currently such a hot topic in the industry that I thought it would be interesting to write a post about it. I also want to state that all the features presented here have been used in production. No bullshit ! Production examples Furthermore I totally acknowledge the fact that Playmobil was not a commercial success. There is no point in hiding it neither the harsh YouTube videos. I also agree that there was room for improvement on this project in terms of lighting. Nonetheless we did our best and I am very proud of the work achieved by our lighting team. And I believe that Playmobil did not get the success it deserved. Sometimes it’s just bad luck… I would like to thank my former colleagues from On Animation for letting me write this post and their support. I will also show some very cools renders from this wonderful movie called Minuscule 2 to illustrate some of my ideas. Visual effects were done by a small but very talented studio called The Yard VFX. I believe Guerilla was used in the most efficient way on this movie. Thanks to Laurens Ehrmann for his support on this post. Let’s start ! What is Guerilla ? Guerilla Render is an assembly software and a bi-directional path tracing render engine. This wonderful piece of code is exactly what I expect from a modern render engine. It uses a nodal, procedural and non-destructive workflow with cutting-edge technology. How can I quickly describe Guerilla ? Maybe the best way to start would be to actually present a shot using some of the best features of Guerilla. Let the software speak for itself ! What is the difference between unidirectional (Uni) and bidirectional (VCM) ? Bidirectional shoot rays from the lights and from the camera. And then connect them together. By the way Arnold is unidirectional Path Tracing, like Glimpse (Animal Logic). Shot example I still remember clearly the moment I felt in love with Guerilla. The shot below made me realize how powerful Guerilla is. Everything that is normally forbidden to do in CG is available in this shot : The final shot from the movie. 3D Motion-Blur : checked !3D Depth-Of-Field (DOF) : checked !Volumetrics GI Rendering (super heavy VDB) : checked !Bi-Directional Path Tracing : checked !Russian Roulette and Adaptive Sampling : checked !16 bounces everywhere : checked !One Beauty Pass : checked !Deep Id : checked !Mesh Lights : checked !Displacement, SSS and Procedural fur : checked !2048 AA samples : checked !Light Path Expression : checked !Rendering the whole background through a Refracting Glass : checked ! I personally know only two render engines that can handle this amount of features : Guerilla and Glimpse. They were strangely very similar in their behavior.I guess great minds think alike. Shot description This shot is part of a night sequence which is around two minutes long and about 40 shots. Under Rémi’s supervision, we did a day for night lighting to get this soft blue illumination which is so popular in animated features. On this particular shot, we wanted the volcano to be the center of interest. So we turned off the moon and sky to enhance the volcano’s dramatic effect. We were not afraid to break continuity to serve the story’s purpose. There were more than forty lights in total. Not an issue for Guerilla ! Natural lights : the volcano lights.Practical lights : the garlands, headlights, windows and windshield.Dramatic lights : some bounces, top lights with blockers and rims… The whole thing ! 120_guerillaRender_020_screenshot_411000007_FHD120_guerillaRender_030_screenshot_411000007_FHD The UI and RenderGraphs in Guerilla Render. If you are wondering how many bounces we use in production, here are some examples : Animal Logic uses 12 bounces, Disney 10, On Animation 16 and Cinesite FA 1. From the tests I have seen, do not go below 6 bounces ! It is also pretty important to keep the same number of bounces for diffuse, reflection and refraction in my opinion. Lighting and Compositing We did output some AOVs as a safety net in case we wanted to tweak some renders in compositing. It did not happen on this sequence. We were pretty much happy with the CG result and as you can see there is not much difference between the Guerilla Render View and the final output from Nuke. They are pretty much similar. 120_guerillaRender_010_playmo_sht_410000007_cmpren_FHD120_guerillaRender_040_playmo_sht_410000007_ren_FHD120_guerillaRender_050_playmo_sht_410000007_spec_FHD120_guerillaRender_060_playmo_sht_410000007_refl_FHD120_guerillaRender_070_playmo_sht_410000007_refr_FHD120_guerillaRender_080_playmo_sht_410000007_albedo_FHD120_guerillaRender_090_playmo_sht_410000007_sub_FHD The final renders and AOVs of this shot. Could we have added some details ? Some scratches on the window and the door would have helped. Details in CG are expensive but it really makes the image richer.I agree some fine tuning compositing would have been a plus. There is a debate on how close a CG render should be to the final output. Many lighters argue that we should light in “Raw” (like a flat lighting) and then do the final look in compositing. I used to think that as well. Until I went to Animal Logic and that was actually the same thing on Playmobil. On both shows, we were able to light and render as close as we could to the final result. Which was really awesome. Here is a quick list of arguments in favor of this method : I personally want to light as close as the final result, not to go through a detour. Go straight to the final image.Guerilla and Glimpse handle sampling greatly, it was not a issue to get some contrast in our renders.In the end, what really matters, is to get enough range for DI in your final output. I still remember Craig playing with exposure and gamma during Quality Check before final approval. Anyway, back to the shot above… Can you imagine how many layers would have been necessary without 3D DOF ? And how would we have even composed them afterwards ? A real brain teaser ! It would not only have been very long and painful but also more expensive. Here is the reason why. Render times After reading the paragraph on layering, many readers have asked me about render times when it comes to rendering only one beauty pass. I really want to state clearly that our render times were not an issue on Playmobil. They actually were similar to the render times we had on Lego. Funnily enough Lego and Playmobil were the only movies where I was able to render everything in one beauty pass. And it is no coincidence that Glimpse and Guerilla have a lot of common in terms of sampling. They are proper modern path tracers. Anyway, even with all these crazy features, the average render time of this sequence was around 6 hours per frame for final quality, this shot being the most expensive with 11 hours per frame. I actually did a mistake on this sequence. I should have turned off the bi-directional. With so many lights in the scene, bi-directional does not bring much visually. Render times would have certainly been even lower.Oops… We updated the Render Settings template right after this sequence without any bi-directional and 8 bounces for the whole film. It was more than enough. Human time VS Machine time I would also like to point out a very important thing : what is expensive on a show ? Salaries. It is not the electricity nor the render farm. So if we take the example above, yes we could have saved some render time by doing many optimizations such as : Remove displacement and SSS by layer (for non-visible elements).Remove any useless geometry.Reduce the number of bounces or even lights.Split into many layers to save some memory. But how much time will you spend to achieve that ? And how much time will you need to compose the shot correctly in Nuke ? Optimization is not that cost efficient. And all of this brings us to our first principle on Playmobil : Human time is much more expensive than machine time. A couple of interesting videos to prove it : one in French by Jean-Marc Jancovici at the Senate and one with an Olympic cyclist.Thanks Philippe for the links ! I am not saying you should not care about render times on a feature film. Not at all ! But from recent studies, the render farm is only 3% of the budget on a movie. There is not much to save there. At least in a modern pipeline, which brings me to my next point. Modern pipeline It seems to me that currently a hot topic in animation is about pipelines and how to increase quality and efficiency. It is certain that animation pipelines need to evolve. Which is actually something very difficult to achieve for many reasons : If the studio is in production, you may have to wait for a gap between movies.People’s culture. Why would we change something that works and that we are used to ?I have even heard some supervisors tell me : it is sometimes easier to throw everything at the trash and start from scratch rather than trying to fix a defective pipeline. So what is this big evolution everyone is talking about ? Which direction should we be heading ? The following screenshots have been extracted from the Pixar presentation at Siggraph 2019. I think they show quite well the direction to follow. 120_guerillaRender_100_old_pipeline_FHD120_guerillaRender_110_new_pipeline_FHD What we should eventually try to achieve… Looks promising ! I have never worked with USD but the closest workflow I have seen to a digital live set was on Playmobil. Let me give you a couple of examples. Digital Set on Playmobil What do these images tell us ? How can we apply this concretely ? A pretty good solution has been given to me by Pascal Bertrand and Rachid Chikh on Playmobil. I still remember clearly the moment they shared with me their vision. It was during my interview that they nonchalantly announced me : Why should lighting only be done during the final stage of production ? Why couldn’t it be done before animation for example ? Like in a live-action movie ? There is a couple of moments in your career that one may define as game changing. When Pascal and Rachid shared with me this idea during my interview, I was shocked : Wait ? What ? Lighting before animation ? It can’t be ! And then I realized (like a month later) that it made complete sense : one should light Rough Layout. Same shot as above in its Rough Layout version. We actually did some adjustments when final assets came in. Great thinking out of the box ! Just brilliant ! This may not be the ultimate solution but it is definitely a big step in the right direction. Lighting during Rough Layout is key in a Digital Live Action Set. What advantages does it bring ? Coherence and flexibility Having lighting intentions during Rough Layout bring the director’s vision to life much earlier in the process.3D Motion-Blur and Depth-Of-Field are set during this stage and maintained until final render with a few adjustments due to performance and set updates.Gain of time in our production. With Depth-of-field set that early in our process, it is much easier to put our money where it is worth it.The Animation Department can use our light rig to position their characters precisely and anticipate any staging or blend shape issue.One render engine in the whole pipeline. To maintain coherence through departments, every movie presented to the director would have to be rendered with Guerilla Render. Lighting Rough Layout also makes other departments work in a cleaner way : assets cannot be moved arbitrarily in the scene. It helps to maintain coherence and logic between departments. I don’ t know if I was lucky or not but this lighting process on Playmobil helped me to anticipate lots of issues like naming, constraints, split of geometries. It was also very interesting to play with the 3D DOF. Moving to final assets and shot lighting was pretty straight-forward in most cases. Workflow aspects of Playmobil Lighting Rough Layout is not the only aspect worth mentioning of Playmo. I would also like to describe some philosophy aspects of this production. I had the chance to share 100% of Pascal‘s vision in that matter. Pascal Bertrand is CTO of On Animation and a great guy to work with. We want to maintain as little code as possible. Guerilla works natively and integrates most of the needed features. No need for an army of TDs !We don’t care about render times aka human time is much more expensive that machine time.Brute force rendering. We avoid cheap tricks and rely mostly on Path Tracing and PBR for our renders.Every process has to be replicable. No manual hack, it’s all about building and publishing our work. Especially for rendering !No comp. Yeah that’s a bit extreme but it forced us to push the assets and their look in Guerilla. ‘Build’ and ‘Publish’ are the two main processes for any department. ‘Fire and Forget’ was our publishing policy on Playmobil. So efficient ! Concrete solutions These concepts may seem basic to you but I believe they are at the core of a modern workflow. What do they mean concretely ? One layering template for the WHOLE movie. Yes, you have read well. No more layering issues ! The whole movie has been rendered in one Beauty Pass and if needed one Volumetric Pass. One rendering template for the WHOLE movie. Same thing here, we used the same sampling values for the whole movie. No more testing or second-guessing. Same thing for bounces : 16 bounces everywhere. Yes !One lighting scene per sequence. You may be already used to a Sequence Lighting workflow but this has been a revelation to me. Guerilla and its Render Graph are a perfect fit for this.We don’t need to open every shot of the movie in Guer"
