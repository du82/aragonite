title = "OCIO, Display Transforms and Misconceptions - Chris Brejon"
description = "This article is mostly about OCIO configs and Display Transforms, which is a crtical part of the Image Formation Chain."
full_description = 'OCIO, Display Transforms and Misconceptions Post author:chrisbrejon Post published:September 29, 2021 Post category:Articles Table Of Contents IntroductionA great communityThe importance of terminologyOCIO Configs examplesnuke-defaultnuke-default descriptionBT.709 and BT.1886Old-school VS new-schoolnuke-default visual examplesspi-anim / spi-vfxspi-anim descriptionspi-anim visual examplesspi-vfx descriptionspi-vfx visual examplesEdge cases ?Filmic BlenderFilmic Blender descriptionFilmic Blender Displays and ViewsOCIO Viewing experience and RolesOCIO implementation and UXEditing an OCIO ConfigFilmic Blender visual examplesACESACES Displays and ViewsACES visual examplesComparison and SummaryLost in misconceptionA bit of HistoryThe per-channel approachPlots and Chromaticity DiagramsValues for the plotsMore about per-channelRendering exr filesTwo types of renderingCustom Display Rendering Primaries experimentARRI ALF-2Mea CulpaACES HistoryLego movies and ACESList of ACES movies and Output TransformsVFX workflows and studio requirementsACES looking betterCompensating the behaviour ?Rendering in ACEScgGround TruthChromaticity linear approachChromaticity linear definitionAchromatic imagesWhat is tone ?An historic postAbout toneAbout Jones DiagramAbout BrightnessAbout ReproductionAbout "Film"S-curves and Path-to-whiteChromaticity linear looks weirdColor Appearance ModelsTCAMv2TCAMv2 descriptionTCAMv2 settingsTCAMv2 terminologyTCAMv2 visual examplesDifferent colorspaces"Native" primaries sweepsTCAMv2 philosophyTCAMv2 looksLooks and StudiosC-105 Vision LookQuality and IdentityConclusionThe journeySummarySources Introduction I often think about this great question asked by Doug Walker at one of our OpenColorIO (OCIO) meetings : what are you trying to solve ? So in our case, what is this post about ? In the past year (2021), I have given several talks online about OCIO and the Academy Color Encoding System (ACES). I thought it would be useful to put those slides online for two reasons : If there is any inaccurracy, anyone can correct me and I’ll be more than happy to update this page. With these slides online, I hope I can reach more people and raise awareness about certain topics. I do not consider myself an expert. I do not believe in this word anymore. We are only human beings, doing our best to understand things. We make mistakes, hopefully learn from them and keep going. So no, I’m not an expert on anything ! The only thing I can offer is an artist’s point of view on Color Management. Quite often, I have been lost on where to begin when it comes to OCIO and ACES. So by writing this post, I hope I can share with you some useful information. There is a reason my book starts with two chapters about Color Management. It will give you the fundation to create beautiful images. So I thought it would be interesting to compare various OCIO configs, with a series of visual examples in order to study their strength and flaws. Really the idea is to look back but NOT judge these historical OCIO configs. Not at all ! Huge respect to all the persons who more than ten years ago developed and shared these configs with the community. A great community Some people may find this post too obvious, boring or outdated. Probably ! But I was really interested to go back in time and write this historical analysis on OCIO and Display Transforms. This is post is primarly about my own misconceptions, but hopefully it will help others too ! Please note that I will only talk about OCIOv1 configs here. First of all, I would like to thank the Academy of Motion Picture Arts and Sciences (AMPAS) because without them, I would have probably never discovered this crazy wonderful world of Color Management. ACES has been my entry point to Color Management and I will never be thankful enough for that. Thanks to them, I have discovered this amazing community of colour nerds and colour scientists, and I would like to personnally thank the following persons for their generosity, sharing and patience with my questions : Troy Sobotka Jed Smith Daniele Siragusano Zach Lewis Sean Cooper Nick Shaw Alex Fry Kevin Wheatley Thomas Mansencal Shane Smith It is really heart-warming to have this group of people passionate about colour and display transforms who are able to debate online at midnight over sRGB or scene-referred grading. It is a welcoming community, who does not agree on everything and who has still a lot to figure out… Which is really exciting ! Okay, enough with the name dropping, let’s start ! Yay ! The importance of terminology I’m writing these lines with great humility because I have been dead wrong in the past and I’m probably still inacurrate about many things… But I’m learning and I think my only vantage is to explain things simply enough so hopefully fellow CG artists can understand me. I’ll start here with a bit of OCIO vocabulary, so we’re all on the same page : Display : monitor with its characteristics (primaries, white point, EOTF, nits…). View : the way we see the images (ACES, Raw, Log, Un-tone-mapped…). Look : creative preference or grading (LMT in the ACES terminology). These three terms may sound really basic but they are out of the utmost importance for what comes next. As you probably know, I’m quite a practical person. I like to have visual and concrete examples to support my explanations. So we’ll start by having a look at these two OCIO Config repositories and study our different options : nuke-default spi-anim / spi-vfx Filmic Blender ACES OCIO Configs examples nuke-default nuke-default description Why should we start with an OCIO config that was shipped with Nuke 6.3 in 2011 ? First of all, because I believe it is still used in some schools and small shops. Second of all, because it contains an option that has misled me for ages. displays: default: - !<View> {name: None, colorspace: raw} - !<View> {name: sRGB, colorspace: sRGB} - !<View> {name: rec709, colorspace: rec709} - !<View> {name: rec1886, colorspace: Gamma2.4} active_displays: [default] active_views: [sRGB, rec709, rec1886, None] I won’t mention here that the “Display” is default (what ?) and that the “Views” are actually Transfer Functions… Let’s focus on something else instead ! Revelation #1 : In this config it is important to notice that the Rec.709 Transfer Function is a camera encoding OETF ! It is NOT a display standard ! It took me a while to figure that one out ! So what everybody calls a “Rec.709 display” is actually a “BT.1886 EOTF with BT.709 primaries” display. This camera encoding was designed to direct drive output on a CRT broadcast display, with an EOTF of approximately 2.4. It was designed to look appropriate on both what later became BT.1886 and sRGB 2.2. From a fellow color nerd. BT.709 and BT.1886 This was one of my first interrogations when I discovered ACES. Because the Rec.709 (ACES) Output Transform is “less contrasted” (for lack of a better words) than the sRGB (ACES) one, contrary to the nuke-default. Here are the approximative Gamma values : BT.709 is a camera encoding OETF (~Gamma 1.95). BT.1886 is an EOTF output display (~Gamma 2.4) and is used in the Rec.709 (ACES) Output Transform. […] using a tilde has become commonly used shorthand for differentiating between pure power functions and piecewise functions, when referring to display CCTFs, and is sometimes the only way to differentiate between the two, if the author isn’t explicitly using “power” or “piecewise”. For example, Baselight differentiates between “sRGB Display (2.2)” and “sRGB (~2.2)”. […] In the context of transfer function LUTs used for OCIO, BT.1886 is exactly Gamma 2.4. Thanks Zach Lewis for the precision. Old-school VS new-school There is a couple of things to know about this : Using “rec709” in your viewer (“old school” intention), you’ll never get 1:1 for all the values. Because the general power function difference is loosely a “surround/flare compensation” ! If you use “rec1886” on a pure BT.1886 display (“new school” intention), it is an idealized inverse for the EOTF. What we call a no-operation. And it is the exact same issue with BT.709/sRGB piecewise encoding dumped through the proper 2.2 power function. There is a very interesting talk about this precise issue by Daniele Siragusano. It is a bit technical but definitely worth watching ! In 2020, flare compensation is part of the Display Rendering Transform and should not live in the distribution pipeline. Daniele Siragusano. We may add a couple of things : we should never ever use “Rec.709” nor “BT.709” without a further qualifier. Because “Rec.709” can either mean a transfer function or a set of primaries. For clarity, we need to separate the transfer function from the primaries. I will also quickly mention that the use of the term “Gamma” is ambiguous : it’s a greek letter ! It has been used in so many different contexts. I now try to use the term “Power Function/Law” or “Transfer Functions” when appropriate. nuke-default visual examples We are now going to look at a sweep of sRGB/BT.709 primaries with this config. It will show an interesting phenomenon known as the “Notorious 6“. The setup is super simple : in Nuke, I have set a range of sRGB/BT.709 primaries vertically and I increase by 1 stop for each column (horizontally). Let’s have a look ! 140_misconceptions_0010_srgb_sweep_FHD140_misconceptions_0020_srgb_sweep_FHD140_misconceptions_0030_srgb_sweep_FHD140_misconceptions_0040_srgb_sweep_FHD140_misconceptions_0050_light_sabers_FHD Revelation #2 : With this config, no matter how many values you use, you will ALWAYS end up on these six values at display : Red, Green, Blue, Cyan, Magenta and Yellow. Pay attention to this behaviour since we will observe it with several Color Management Workflows. This config should be avoided at all cost for CGI work. It may be useful in some edge cases such as albedo textures. But that’s about it ! A friendly reminder… spi-anim / spi-vfx spi-anim description There is a very complete description of the spi-vfx config in the OCIO docs (which is like a “sister” config of spi-anim). For the record, both configs are from Sony Picture Imageworks (spi). Since we focus on Display Transforms in this post, we will have a look at the “Film (sRGB)” View from the spi-anim OCIO Config. Here is a quick quote : The vd spaces are mappings of linear image data into display space. The main part of the transformation is defined as a single curve that is conceptually two parts. The first is a ln to lg (linear to logarithmic) conversion. The second is lg to sRGB conversion. This is based off the neutral channel response of the sRGB film emulation lut used in the profile. The spi-anim OCIO config uses a 1D LUT for its “Film” View. For sRGB Displays, the LUT file used is called “vd16.spi1d“. Here is an example from the config which I believe uses the correct OCIO terminology : displays: DCIP3: - !<View> {name: Film, colorspace: p3dci8} - !<View> {name: Log, colorspace: lm10} - !<View> {name: Raw, colorspace: nc10} sRGB: - !<View> {name: Film, colorspace: vd16} - !<View> {name: Log, colorspace: lm10} - !<View> {name: Raw, colorspace: nc10} We do have access to two displays : “sRGB” and “DCIP3“. And three different ways of “viewing” our renders : “Film“, “Log” and “Raw“. This is a simple and correct OCIO setup, very clear and easy to understand. spi-anim visual examples Let’s now have a look at some renders ! 140_misconceptions_0060_srgb_sweep_FHD140_misconceptions_0070_srgb_sweep_FHD140_misconceptions_0080_srgb_sweep_FHD140_misconceptions_0090_srgb_sweep_FHD140_misconceptions_0100_light_sabers_FHD spi-vfx description For completeness, I have also used the same renders through the “srgb8” View from the spi-vfx OCIO config. Here its description from the OCIO docs : srgb8 bakes in the film3d emulation lut. This table can be used for either QuickTime generation or output to the sRGB display. The transformation is a 3d film emulation table with gray balance compensation, so a value of 445,445,445 in lg10 space is modified to become equal RGB values in sRGB. Additionally the lut is scaled so that at least one of the color channels on maximum white uses the display max. The transformation takes place in three parts. First the linear data is converted to the show log space. Then a film emulation table is applied. Then the grey balance and white scaling compensation are applied. This table is designed to be evaluated in a dimly lit office environment on a sRGB display. spi-vfx visual examples And here are our usual renders for comparison : 140_misconceptions_0110_srgb_sweep_FHD140_misconceptions_0120_srgb_sweep_FHD140_misconceptions_0130_srgb_sweep_FHD140_misconceptions_0140_srgb_sweep_FHD140_misconceptions_0150_light_sabers_FHD For your information, I haven’t used any compositing trick for my render. The “glow” around the light sabers is actually a volumetrics shader, affected by the Mesh Light. Straight from Guerilla Render. I got really really really surprised when I looked at these images… I did not expect a Display Transform called “Film” to behave like that ! My two main surprises were : sRGB/BT.709 primaries do not go to white ! We end up on the “Notorious 6” values, just like a simple sRGB EOTF ! Which made me arrive at this earth-shaking conclusion… Revelation #3 : an s-curve has nothing to do with the “Filmic” behaviour. Certainly, it will add a nice “contrast” to the image and perform some kind of luminance lookup. But does this really qualify as “Filmic” ? I’m not sure… To me, “filmic tone-mapping” means that there is a visual “path-to-white” (some people calls it “desaturated highlights“). The fact that sRGB/BT.709 primaries light sabers do not go to white with a “film3d emulation lut” looks wrong to me. It tells me that maybe something else is at play here ! So, yeah, s-curves have nothing to do with the “path-to-white“. I did look for a “filmic” reference to illustrate my thoughts. And “Star Wars” was the best example I could come with. This is the “Look” I would expect for my light sabers : a white “core” with a colored glow. 140_misconceptions_0160_light_sabers_FHD Agreed, these OCIO configs are a bit old but they’re still used by some small studios. And I love doing this OCIO archeology because we learn so much on the way. Edge cases ? One may argue that my examples are edge cases : “hey Chris, stupid you, just use 0.001 instead of 0 and you’re good to go !” And this is true. It is a common and known practice to limit the range of input colors to get some kind of “path-to-white“. But doesn’t it reveal something ? 140_misconceptions_0170_srgb_sweep_FHD140_misconceptions_0180_srgb_sweep_FHD140_misconceptions_0190_srgb_sweep_FHD140_misconceptions_0200_srgb_sweep_FHD140_misconceptions_0210_light_sabers_FHD To be clear, I am not even using any wide gamut rendering in these examples. But rather the lowest common denominator : sRGB/BT.709 primaries through several Display Transforms. Since lasers are BT.2'
