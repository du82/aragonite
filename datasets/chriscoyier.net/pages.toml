title = "Timeline – Chris Coyier"
full_description = "Timeline Of my life Life Aug 1980 Born in Madison, WI at St. Mary’s Hospital School Sep 1985 First day of Kindergarten at Huegel Elementary Life Jun 1989 Moved to Verona, WI (start of 5th grade) School Jun 1998 Graduated Verona Area High School Work Jul 1998 Start work at American Family Insurance (software testing) School Aug 1998 Started at University of Wisconsin-Whitewater Life May 2002 Attended my first Graves Mountain Bluegrass Festival Life May 2002 Help found Whitewater United for Peace Work Sep 2003 Started work at The Brass Rail Saloon (after going to court to get them to approve a bartending license after being initially denied for possession of marijuana prior) Life Oct 2003 Bought my first car, 2002 Saturn L200 (mostly so I’d have a reliable car for delivering pizzas, miraculously found a company to let me finance it myself: $10,000) School May 2004 Graduated University of Wisconsin-Whitewater Work Jun 2004 Started work at American (prepress & print design) (American, or “American TV” as it was originally, closed all 11 locations permanently in 2014 after 60 years) School Jul 2005 Peak summer of The Missing String Band (My bluegrass/Americana band. Regular gig at The Grumpy Troll in Mt. Horeb among many others) Work Dec 2006 Started work at Suttle-Strauss (prepress) Life Mar 2007 Released album with side project band The Groggers Life May 2007 Started work at Chatman Design (web design) Work Jun 2007 CSS-Tricks launched Life Dec 2007 Moved to Portland, OR Life Jul 2008 Moved to Chicago, IL Project Feb 2009 Launched Are My Sites Up Project May 2009 Launched Digging Into WordPress (the blog) Project Nov 2009 Initial publishing of Digging Into WordPress (the book) Project May 2010 Digging Into WordPress (the book) v2 Work Jun 2010 Start working at Wufoo (web design) Project Jul 2010 Digging Into WordPress (the book) v3 Life Aug 2010 Moved to Tampa, FL Life Sep 2010 Got my first dog: Digby! Work Apr 2011 SurveyMonkey acquired Wufoo Life Aug 2011 Moved to Palo Alto, CA / Sold Saturn / Bought 2011 Toyota Tacoma Project Jan 2012 Launched ShopTalk Show Life Mar 2012 Sold Volkswagon Westfalia / Bought Jayco camper trailer Life May 2012 Last day at Wufoo/SurveyMonkey – Trip around the U.S. Project Jun 2012 Launched CodePen Project Sep 2012 Launched v10 of CSS-Tricks after a successful Kickstarter Project Dec 2012 Launched CodePen PRO Life Apr 2013 Moved to Milwaukee, WI Work Apr 2013 Went full-time on CodePen with Tim Sabat and Alex Vazquez Life Oct 2013 Sold Jayco Camper / Entered Land Contract to buy house in Milwaukee Life Apr 2014 Bought SylvanSport GO Camper Trailer right before first MerleFest (where we made the front page of the paper pickin’ in the campground) Work Feb 2015 Staffed up a bit at CSS-Tricks hiring part time writers/editors/developers/etc. Life Jun 2015 Completed land contract / Bought same house in Milwaukee Work Aug 2015 CodePen receives seed funding from Chris Campbell, Ryan Campbell, and Chris Sabat Work Sep 2015 CodePen hires first employee (Marie Mosley) Life Feb 2016 Miranda moves in with me Life Jun 2016 Completed first major home renovation project: front and backyard landscaping Project Jul 2016 Published Practical SVG (a book) Life Nov 2016 Moved to Miami with Miranda “for the winter” Life May 2017 We moved back to Milwaukee Life Jul 2017 Gettin’ married! Life Sep 2017 Moved to Bend, Oregon Work Oct 2017 CodePen gets new office in downtown Bend, sharing with CraftCMS Life Nov 2017 Me and Miranda’s daughter Ruby is born! (Also bought a 2018 Chevy Tahoe so we had a safe 4WD winter car for Ruby) Life Aug 2018 Bought a house in Bend Project Feb 2019 Launched microsites. One for listing conferences. One for serverless. Life Jul 2019 RIP Digby. Had to put the ol’ girl down. She got bitey even with children. Life Jul 2019 Broke both arms mountain biking Life Nov 2019 Traded in the Toyota Tacoma for a three-year lease on a Toyota Tundra. Life Mar 2020 COVID ruins life (for everyone, for years) Life Sep 2020 Hit by a van (turned in front of me) while riding my bike. Broke foot and got pretty banged up. Work Nov 2020 Moved to a new office (St. Claire Building) Project Dec 2020 Built microsite showcasing coding fonts. Life Apr 2021 Vaccinated! Project Nov 2021 Half a million followers on CSS-Tricks Work Mar 2022 Sold CSS-Tricks to DigitalOcean Life Sep 2022 Sold Chevy Tahoe / Bought Tesla X Life Oct 2022 The three-year lease on my Toyota Tundra was up, so traded it in and purchased the new version: 2022 Toyota Tundra Platinum. Life Oct 2062 Probable death due to meteor apocalypse"
