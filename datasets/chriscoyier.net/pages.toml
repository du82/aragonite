description = "I like the John Warner thing where the problem with outsourcing writing to AI is that the computers aren’t doing a process that is aligned with how humans would do it. On an episode of Search…"
full_description = "February 18, 2025 Calculators & Writing I like the John Warner thing where the problem with outsourcing writing to AI is that the computers aren’t doing a process that is aligned with how humans would do it. On an episode of Search Engine, he said that using a calculator for long division, a tool that some compare to AI generated writing, is different. The calculator is doing what a human would do, just faster. Whereas with writing, humans are thinking, feeling, and communicating. Computers do not do these things. Using AI to write means you’re robbed of the thinking and feeling it takes to write, which is (most?) of the value. Communicating, I suppose, you’re doing either way, you’re just communicating something you didn’t think about or feel if your writing is generated, which is fucked. Related Thoughts? Email me or comment below. Also CodePen PRO is quite a deal. 🙏"
