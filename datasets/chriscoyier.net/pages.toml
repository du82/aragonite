title = "January 2006 – Chris Coyier"
full_description = "This appears to be some kind of blog post. January 31, 2006 My literary pet peeve lately has been the use of “some kind of”. Here is an example from the X-Files: “What is that?” “It appears to be some kind of storage facility.” The reason its annoying is because it pompously suggests that the speaker is very knowledgeable when it comes to storage facilities. So knowledgeable […] adventures – alice – anxiously – asleep January 30, 2006 I love me some cool T-Shirts. Maybe if you are lucky and real good little blog readers I’ll post a list of some very cool places to get T-Shirts online. But for now, here is a new company that will analyze a blog for you, create a word-cloud (like del.icio.us), and put it on a […] I wish I was a catfish January 27, 2006 One of my favorite bands was in town last night: Foghorn String Band. They are originally from Portland, Oregon which is cool because I have several friends living out there now, so I can plan a visit around a show. Closing up was the Wilders, who another one of those ruckus-raising power country bands. The […] We’re here today to talk about printing costs January 26, 2006 One hour of my workday yesterday was spent NOT in a meeting. I thought I was going crazy. I even went to the exact same meeting twice in a row. When you are trapped in a boring meeting, you can always space out, but it’s nicer to get a good daydream going. Here is some […]"
