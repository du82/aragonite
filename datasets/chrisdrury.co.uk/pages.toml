["https://chrisdrury.co.uk/project/albatross-print"]
title = "Albatross Print - Chris Drury"
full_description = "Albatross Print Digital print on archival rag paper, with a hand drawn blue crayon line. The image is of one day of wind over Antarctica, with the line of the flight of a tagged Albatross over 18 months, drawn in blue crayon around the central circle. This bird lives on the wing, often just 2 metres above the waves of the southern oceans. The line of its flight circumnavigates the globe in a clockwise direction, which is also the direction of the winds and the circumpolar current. Where the cold waters of Antarctica meet the warmer currents – this is where all the krill is in the seas, and so this is where most of the life is, from fish to birds to mammals. The circumpolar current is also driving the climate of the planet. PortfolioMapping Commissions Works Outside Cloud Chambers Exhibitions Antarctica Videos Year of Project 2007"
