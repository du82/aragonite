["https://chrisdrury.co.uk/project/adharc-1"]
title = "Adharc 1 - Chris Drury"
full_description = "Adharc 1 Ireland 1992, two bronze and 56 peat & PVA cast rams horns, dimensions vary – Collection artist Adharc is Irish for horn. Bronze horns were found in Irish peat bogs and are thought to be from 2000 BC and were maybe played like a didgeridoo. I head one played at a Bogland symposium. That same year I found a dead ram at the bottom of a cliff in West Cork. I took the horns and cast them into peat and PVA and two into bronze. The work is arranged like a grid on the wall. It isn’t a gene sequence but its grid like form and earth, allies it to these works. PortfolioMapping Commissions Works Outside Cloud Chambers Exhibitions Antarctica Videos Year of Project 1992"
