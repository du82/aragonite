["https://chrisdrury.co.uk/project/earth"]
title = "Earth - Chris Drury"
full_description = "Earth NEW EXHIBITION BY CHRIS DRURY Opening this March, ONCA is delighted to host EARTH, a new commission plus selected artworks by internationally acclaimed land artist and ONCA patron Chris Drury. Renowned for his site-specific, natural world sculpture – including patterns cut into fields, stone cairns on hill tops, raked designs in dried-out lakes and giant whirlpools made of slate – Drury’s work makes connections between nature and culture, microcosm and macrocosm. His EARTH works explore themes such as the endurance and survival of organisms in hostile environments, and mushrooms as a metaphor for life, death and regeneration. In recent years, Drury has experimented with soil as a pigment for his paper-based works and EARTH includes examples of this such as Rhone Carmargue and Mani/Ouse. A new work commissioned for ONCA’s window features soils collected over 30 years of travelling the world, displayed in labelled jars and arranged in colours. The jars include rock from the lava fields of Iceland, schist from Antarctica, red ochres from Central Australia and the white chalk of Drury’s Sussex. One of the artworks is interactive – a whirlpool on the wall created by each gallery visitor adding a single muddy fingerprint to the evolving spiral. The exhibition also features installations including Destroying Angel Nevada (pictured above) – made from desert plants collected from Nevada’s nuclear testing site; Cloud 9, a sculpture comprising 1,760 mushrooms suspended on nylon thread and gene sequence works such as the Life in The Field of Death series. Complementing the themes and tone of EARTH is RANE-CHAR, a project by Falmouth-based environmental artist Daro Montag. In RANE-CHAR, biochar (charcoal) is produced and distributed to raise awareness of, and to mitigate, climate change. Inspired by Montag’s participation in the 2009 Cape Farewell expedition to the Peruvian Andes and Amazon, the project has since evolved to consider species extinction and carbon’s life force PortfolioMapping Commissions Works Outside Cloud Chambers Exhibitions Antarctica Videos Year of Project 2016 EXHIBITION DETAILS EARTH | Chris Drury 11th March – 3rd April 2016 Free admission. Gallery opening times: Wednesday – Friday 12pm – 7pm / Weekends 11am – 6pm ONCA Gallery, 14 St. George’s Place, Brighton BN1 4GB. www.onca.org.uk / 01273 607101 / info@onca.org.uk EVENTS Thursday March 10th, 6pm. Special preview tour of the show with Chris Drury. Tickets: http://bit.ly/1ZYlWI7. (Limited availability.) Friday 11th March, 6.30 – 9pm: Private View by invitation."
