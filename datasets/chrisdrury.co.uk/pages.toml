["https://chrisdrury.co.uk/project/both-nam-faileas"]
title = "Both Nam Faileas - Chris Drury"
full_description = "Both Nam Faileas Hut Of The Shadow Lochmaddy, North Uist, Western Isles. 1997 Winner of the Natures Prize, Scottish Environmental Award & 1998 commendation from The Association for the protection of Rural Scotland. Commissioners: Taigh Chearsabhagh arts Centre with the Scottish Arts Council. Located on the end of a spit of land and surrounded by sea, islands and sky, the work is a grass-roofed, stone tumulus which mirrors the shapes of the surrounding islands. It has a curved passageway leading into a small chamber which, by means of a lens and three mirrors built into a wall, projects on to the opposite wall, the landscape around it, like an old slightly blurred movie. Directions: located at Sponish, twenty minutes walk north of Lochmaddy. Go past Youth Hostel, past Outdoor Activity Centre, over footbridge, from which you’ll see the work on the first headland. OS Landranger Map 18. 92.4 longitude, 69.5 latitude. Contact: Andy Mackinnon arts@taigh-chearsabhagh.org Tel: +44 1876 500293 PortfolioMapping Commissions Works Outside Cloud Chambers Exhibitions Antarctica Videos Year of Project 1997"
