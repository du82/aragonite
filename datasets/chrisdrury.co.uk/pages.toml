["https://chrisdrury.co.uk/project/above-and-below-cararra-nunatac"]
title = "Above and Below Cararra Nunatac - Chris Drury"
full_description = "Above and Below Cararra Nunatac Sky Blu, Antarctica, Inkjet prints, one is a layered echogram from under the ice at Sky Blu. 888 x 733 mm Collection artist An echogram is a radar image of the ice and the underlying land formations. The equipment is attached to the underside of the wings of a Twin Otter, which will fly close to the surface of the ice on a plotted course for around 4 hours. The resulting image, captured in a computer, shows the formation and movement of ice, which is 4 km. deep and 900,000 years old. I have taken this 20 m. long drawing, put it into Photoshop and cut, pasted and layered the areas under Sky Blu. PortfolioMapping Commissions Works Outside Cloud Chambers Exhibitions Antarctica Videos Year of Project 2007"
