["https://chrisdrury.co.uk/portfolio/mapping/mushrooms"]
title = "Mushrooms - Chris Drury"
full_description = "Mushrooms I have a continuing fascination with mushrooms and their spore prints, and this interest has informed much of my work over the last few decades. Mushrooms can feed you, kill you or cure you. They are nature’s great recyclers, breaking down dead, organic matter back into the soil in which plants grow, and thus metaphorically they represent the ongoing cycle of life, death and renewal A spore print is made by cutting off the stem of a mushroom and placing it on a piece of paper overnight. The fungi will drop its spores in the pattern of the gills and the resulting image can be fixed with fixative spray and scanned into a computer. Spore Print at The End of LandSeptember 12, 2023 Poison Pie IIDecember 15, 2022 Art in the Time of CoronavirusMarch 13, 2021 Five Kanji CollaborationsMarch 13, 2021 Nature’s Mysterious NetworksMarch 13, 2021 Cloud Of ThornsMarch 13, 2019 CEYLON IIMay 31, 2015 Dust to DustMay 31, 2014 Drawing on IdeasMarch 27, 2012 Invisible TracesMarch 27, 2012 Destroying Angel NevadaMay 31, 2011 Cloud 9May 31, 2010 Arte Sella, Mushroom CloudMarch 27, 2010 Dust to Dust Ashes to AshesMay 31, 2008 Amanita PhalloidesMay 31, 2006 Boletus Circle and Howling at The UniverseMay 31, 2004 Destroying Angel TrinityMay 31, 2003 Spore GridMarch 29, 2002 Rhythms of The HeartMay 31, 2001 Mushroom WheelMay 31, 2001 Poison PieMay 31, 2000 Ceylon 1- 3May 31, 1999 Nature CultureMay 31, 1998 Coprinus 1September 10, 1995 Ink CapsMay 31, 1995 Mushroom CircleJune 1, 1993 Medicine WheelJune 1, 1982"
