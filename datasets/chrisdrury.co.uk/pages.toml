["https://chrisdrury.co.uk/project/art-barns-wool-chamber"]
title = "Art Barns - Wool Chamber - Chris Drury"
description = "Drawing for Wool Chamber, an installation in a barn on the Forest of Bowland for a project called Art Barns after Kurt Schwitters - curated by Litoral. The work was made during shearing time - a wall was built into the barn, a structure installed with netting and wool laid onto the netting so that it appeared as if the barn was filled with wool."
full_description = "Art Barns – Wool Chamber Commissions, Exhibitions, installation inside Drawing for Wool Chamber, an installation in a barn on the Forest of Bowland for a project called Art Barns after Kurt Schwitters – curated by Litoral. The work was made during shearing time – a walled pathway was built into the barn, and a structure installed with netting stretched across it. Wool was laid onto the netting so that it appeared as if the barn was filled with wool. The only lighting was from the gable end door. The smell of lanolin was overpowering. Spring 2001 Skills Posted on April 4, 2001 ← Rockies Karakoram Mushroom Wheel →"
