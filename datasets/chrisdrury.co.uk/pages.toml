["https://chrisdrury.co.uk/portfolio/works-outside"]
title = "Works Outside - Chris Drury"
full_description = "Works Outside During any year I will do between one and three major projects. Most of these will be commissions for works outside, either as a temporary installation for an event, or as a permanent work. There is usually a site and a context. First I will first make a site visit, which will include researching the context, talking to relevant people, finding a site, getting an instinct for what would work in terms of form and architecture, researching local materials and finally making plans and drawings and an estimate of costs. Often these works will involve collaborations between the local community, academics, scientists, planners, architects and landscape architects. Once work gets under way, I will use local expertise and labour to help build and install the works. All these projects will spawn works on paper, drawings, map works, books and other related works which may then be shown in a museum or gallery space. Pulse Of The River, Heartbeat Of The EarthAugust 9, 2024 Spore Print at The End of LandSeptember 12, 2023 PassageOctober 1, 2021 Linden Cloud ChamberMarch 13, 2019 Sri Lanka 2018September 19, 2018 Horizon Line ChamberMarch 13, 2018 The WanderingMarch 20, 2016 Ponderosa WhirlpoolMarch 20, 2016 Jiri Mountain Tea LineMarch 20, 2016 Carbon PoolMarch 20, 2014 Log WaveMarch 20, 2014 The Birth of EnergyMarch 20, 2014 Window on Blood and WaterMarch 28, 2013 Invisible TracesMarch 20, 2012 Waves and TimeMarch 20, 2011 Carbon SinkMarch 20, 2011 Sky Mountain ChamberMarch 20, 2010 Rhine Mosel Slate WhirlpoolMarch 20, 2010 Equinox LineMarch 20, 2008 Winnemucca WhirlwindMarch 20, 2008 Echoes of the HeartMarch 20, 2007 Star ChamberMarch 20, 2006 FingermazeMarch 20, 2006 Heart of ReedsMarch 20, 2005 Redwood VortexMarch 20, 2005 TurningMarch 20, 2005 Rivers of Stone and FingerprintMarch 20, 2004 Cloud Chamber for the Trees and SkyMarch 20, 2003 Eden Cloud ChamberMarch 20, 2002 Reed ChamberMarch 20, 2002 Willow Domes on the EsteMarch 20, 2002 Time Ca