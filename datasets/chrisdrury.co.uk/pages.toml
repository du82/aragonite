title = "About - Chris Drury"
full_description = "About Chris Drury Chris Drury (born 1948, Sri Lanka) as been described as a Land Artist but he himself says that he seeks to make connections between: Nature and Culture; Inner and Outer; Microcosm and Macrocosm. To this end he collaborates with scientists and technicians from a broad spectrum of disciplines and technology and uses whatever visual means and materials that best suit the situation. Bibliography Biography Photo Nicholas Sinclair 2000 An Interview with Chris About Chris Drury Chris Drury (born 1948, Sri Lanka) as been described as a Land Artist but he himself says that he seeks to make connections between: Nature and Culture; Inner and Outer; Microcosm and Macrocosm. To this end he collaborates with scientists and technicians from a broad spectrum of disciplines and technology and uses whatever visual means and materials that best suit the situation. Bibliography Biography Photo Nicholas Sinclair 2000 An Interview with Chris"
