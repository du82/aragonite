["https://chrisdrury.co.uk/project/seeing-past-the-future"]
title = "Seeing Past the Future - Chris Drury"
full_description = "Seeing Past the Future Seeing Past the Future, an online exhibition of works by 2019-2020 Pollock-Krasner Foundation grant recipients, will open on June 10. The project was conceived by Shimon Attie, the inaugural Charles C. Bergman Endowed Visiting Professor of Studio Art at Stony Brook University’s College of Arts and Sciences, in conjunction with the Pollock-Krasner House and Study Center. The digital exhibition will be hosted on the Pollock-Krasner House and Study Center and Pollock-Krasner Foundation websites: pkhouse.org and pkf.org. In consultation with Norman L. Kleeblatt, a former curator at the Jewish Museum in New York, and with curatorial assistance from Talya Feldman, Mr. Attie has chosen a group of 29 artists who received Pollock-Krasner Foundation grants since the onset of the COVID-19 pandemic. Knowing first hand the vulnerabilities and needs of living artists, Lee Krasner established the foundation to offer them vital assistance. Through the presentation of contemporary works by grant recipients, Mr. Attie hopes to underscore how Pollock and Krasner’s legacy remains vibrant and relevant and continues through the practice of numerous working artists today. PortfolioMapping Commissions Works Outside Cloud Chambers Exhibitions Antarctica Videos Year of Project 2021"
