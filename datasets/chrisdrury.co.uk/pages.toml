["https://chrisdrury.co.uk/portfolio/works-outside/cloud-chambers"]
title = "Cloud Chambers - Chris Drury"
full_description = "Cloud Chambers These circular chambers made outside, work on the principle of a camera obscura. The interiors are dark, the entrance being from a door or curved passageway, the floor or viewing surface is white, and there is a small aperture or lens in the ceiling or wall. Images of clouds, branches, waves, landscape, are thus projected inside. A large preoccupation in my work has been the exploration of what inner and outer nature mean. These cloud chambers are still, silent, meditative and mysterious spaces. Outside, they are discreet objects which sit unobtrusively within the landscape; are in fact made of the material of the landscape. They are often built partially underground, so that in these dark spaces what is outside is brought in and reversed. Clouds drift silently across the floor. Linden Cloud ChamberMarch 13, 2019 Horizon Line ChamberMarch 13, 2018 Sky Mountain ChamberMarch 20, 2010 Star ChamberMarch 20, 2006 Cloud Chamber for the Trees and SkyMarch 20, 2003 Eden Cloud ChamberMarch 20, 2002 Reed ChamberMarch 20, 2002 Coppice Cloud ChamberMarch 20, 1998 Both Nam FaileasMarch 20, 1997 Cedar Log Sky ChamberMarch 20, 1996 Wave ChamberMarch 20, 1995 Tyrebagger Cloud ChamberMarch 20, 1994 St James Cloud ChamberMarch 20, 1993 Clohan Cloud ChamberMarch 20, 1992 Cloud ChamberMarch 20, 1990 Wicklow Cloud ChamberMarch 20, 1990"
