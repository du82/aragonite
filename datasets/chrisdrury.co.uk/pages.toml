["https://chrisdrury.co.uk/project/cloud-chamber-for-the-trees-and-sky"]
title = "Cloud Chamber for the Trees and Sky - Chris Drury"
full_description = "Cloud Chamber for the Trees and Sky North Caroline Museum Of Art, USA Partly built under ground, beneath some large trees on a wooded slope in the grounds of the North Carolina Museum Of Art, the work is the first in a series commissioned for the Museums outdoor sculpture trail. The piece was also commissioned to coincide with the opening of their exhibition ‘Defying Gravity’, a show commemorating The Centenary Wright brothers first flight. The work has a 14’ interior diameter and is built of dry stone with a notched octagon domed log roof which is turfed on the outside. Inside the walls and floor are rendered in white cement and via an aperture in the ceiling the image of the surrounding trees are projected across the walls and floor upside down. The trees have the look of roots hanging down inside the dark underground chamber. PortfolioMapping Commissions Works Outside Cloud Chambers Exhibitions Antarctica Videos Year of Project 2003"
