["https://chrishecker.com/Good_Enough"]
title = "Good Enough - Chris Hecker's Website"
full_description = '''Good Enough Voltaire said, "The best is the enemy of the good." John Miles rephrased it for the Direct3D/OpenGL battles back in 1996 or so, and I like his version even better: The good-enough is the enemy of the excellent. I'm an idealist at heart and a perfectionist in practice, and every time I watch something that's merely good enough destroy something that's excellent, I die a little inside. Here is a related opinion about two different ways to judge the goodness of things, which I call Absolute vs Relative Scale. Category: Opinions'''
