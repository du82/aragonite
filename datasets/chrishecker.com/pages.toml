["https://chrishecker.com"]
title = "Chris Hecker's Website"
full_description = '''Chris Hecker's Homepage "The good-enough is the enemy of the excellent." - John Miles Recent Changes Sep 21, 2021 17:40 - No One Knows About Your Game (edit) Sep 13, 2021 01:28 - Sandbox/Test3 (new) Mar 29, 2013 19:39 - Fair Use (edit) Jun 19, 2012 21:50 - The Real Problem With E3 2012 (edit) May 24, 2012 17:47 - The Depth Jam (edit) (more...) Welcome to my website. Here you'll find my writing, programming, design, art, and other miscellanea usually, but not always, relating to game development. I made my original website in 1997, and then proceeded to not update it for 9 years. I finally got around to making this new one, and I'm really happy with the way it's turning out. I use MediaWiki as the engine for the site, and I'm excited to use tons of amazing Web 2.0 technology to create a website that looks exactly like my old hand-coded site, made with emacs and raw html, 10 years ago! Now that is progress! If you're interested in the gory details, you can read more about it. I hope you enjoy my work. Most of the material on this site is from my lectures at the Game Developers Conference and other conferences, my articles in Game Developer Magazine, and my exploration of game technology and design. I went to the trouble to set up this fancy database-driven website so I could put original material up more frequently, so we'll see how that goes. I believe it's incredibly important for game developers—and everybody, really—to openly share information about their craft, whether you're an artist, programmer, designer, musician, business person, or whatever. I've always had an amazing return on investment from sharing information...the more I share, the more I get back in terms of goodwill, learning new information from others, and meeting interesting people. But, more importantly, sharing information moves our art form and industry forward faster, which benefits us all. Navigating If you're new here, you can start by... looking at the Recent Changes page, or checking out the various categories I use for the pages on this site. If you're curious, you can find out more about me or this site. You could also read my opinions if you are into that sort of thing. You can search the site, subscribe to changes by email or rss/atom, or just browse all the pages on the site. If you find any bugs in my pages, erroneous information, or if you have suggestions or feedback in general, please contact me. Thanks for stopping by!'''
