["https://chrishecker.com/A_Dialogue_On_Depth"]
title = "A Dialogue On Depth - Chris Hecker's Website"
full_description = "A Dialogue On Depth At IndieCade 2011 this year, I led a discussion on the idea of depth in games with my friend Paul Sottosanti, who is not only a great designer, but he is also one of the two elite SpyParty playtesters. We decided we don't really know what depth in games actually is, so instead of trying to give a lecture about it and flail around, we simply asked the audience what they thought. Paul and I gave quick intro talks about our thoughts on the topic to get things started, and then we opened it up to questions and comments. I put a slide up at the end of my short talk to try to tease apart some of the things people often conflate with depth, and it had this taxonomy of ideas: Depth Topics deep vs. hard mentalhard physicalcomplicatedmeaningfulemergentwide single-player vs. multi-player player-skill vs. avatar-skill I gave a short list of games I think are work thinking about when pondering these ideas: Go, Poker, Counter-Strike, The Sims, Super Meat Boy, Shiren The Wanderer, Dwarf Fortress, Braid, Thief, Little Big Planet, and Spore. Magic: The Gathering got mentioned a lot as well. I also think this is all loosely tied to ideas from philosophy about the difference between the Beautiful and the Sublime, some discussion of which you can find here. We talk a bit about 500 Hour Games, games you can play for 500+ hours. These are deep games like Counter-Strike, Go, Starcraft, and League of Legends. It also includes games that aren't necessarily deep, like Bejeweled, Solitaire, and Angry Birds, which we categorized as Past-times. You should also go watch Frank Lantz's excellent GDC 2011 talk, Life and Death and Middle Pair: Go, Poker and the Sublime. Welp, the web service I was using for the slide syncing died, so I'll have to redo it on youtube I guess. Here is the raw ppt and mp3. Categories: LecturesDesign"
