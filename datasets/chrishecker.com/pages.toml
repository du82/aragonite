["https://chrishecker.com/Potential_Unreached"]
title = "Potential Unreached - Chris Hecker's Website"
full_description = '''Potential Unreached My GDC 2011 rant was titled Potential Unreached, and here's a video[1] from the session: We awarded the 2011 Duct Tape Award to "rants against myself", and Justin Hall accepted the award on behalf of the auto-rants from last year, and then proceeded to blow out the room's audio system.[2] Potential Unreached was about how we need to start dealing with human scale interactions in games, and how this isn't a technical problem, it's just that we don't try to do it enough. I related my dismay at walking around E3 last year trying to find any games that allowed the player to even pick objects up with their hands. I was working on the technology for picking up and holding drinks in SpyParty, and I simply couldn't find any other games except for the Sims that even had objects in them at this human scale that the player could interact with. Here's the example clip I used from Ico. I asked people to watch this through the eyes of a programmer: After this played, I said: That's the buggiest, piece-of-shit two-link IK solver I've ever seen in my entire life.But, that mechanic is beautiful! It's one of the most powerful mechanics in the history of games, in my opinion. The point of this hyperbole: you don't need to solve the Hard AI Problem to have humans interact in your games. My experience with SpyParty reinforces this. Every single time I add something simple at the human scale, like people having drinks, or somebody carrying around a briefcase, or whatver, I find interesting gameplay laying all over the floor! I wish more games explored this area, rather than making the gunswords even bigger. The other example I used was some of the fan forum posts about how people felt about their horse in Red Dead Redemption. I ranted more about how we don't need more aliens and orcs in games, and tried to address the two common retorts to this (completely obvious and true) statement. People who are putting aliens and orcs into their games right now are not Philip K. Dick, Gene Roddenberry, nor Rod Serling, and do not need to resort to sci-fi and fantasy to deal with important social issues lest they be censored and not allowed to work in their chosen form. People who are putting aliens and orcs into their games right now just like aliens and orcs. The aesthetics of a game are simply not separable from the gameplay. The idea of reskinning a game in different content and not deeply affecting the play experience is simply false. There are tight and subtle feedback loops between them that are poorly understood. Both Clint Hocking and Frank Lantz talked about this to varying degrees this year. I have more to write about this later. You can't put aliens and orcs in your game without affecting the game. In a related vein, I also mentioned that if you could remove the controversial and offensive content in your game by doing a search-and-replace on the strings file, you weren't doing a very sophisticated job of being controversial and offensive. Real controversy in games should come from the gameplay, not the little name hovering over somebody's head, and should be impossible to remove without rewriting a bunch of the game. I talked about the difference between the TV shows Seinfeld and Friends, and how the difference between those shows is simply not expressible in games right now. Both of those shows are completely different to their fans, but converge to a single point in games[3] right now, because the things that make them different are outside the gamut of interactivity. Finally, I put forth the amazingly terrible phrase: Lifification of Games This is my reaction to the call for the Gamification of Life. I don't care about adding points so people buy more shoes, even if it ruins a consumer's deep love of shoes, I care about adding real life experiences to games. Here are the slides if you can't view the video above: ppt. ↑ Huge thanks to SpyParty fan Alexander Baard for recording the rant! ↑ I hope you weren't wearing headphones when you watched that video, or you saw this warning first! ↑ Well, "in game", since the only game that can even represent this "point" is the Sims, let alone representing the real differences between these shows. Categories: LecturesOpinions'''
