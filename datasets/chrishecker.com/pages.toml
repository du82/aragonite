["https://chrishecker.com/API_Design"]
title = "API Design - Chris Hecker's Website"
full_description = "API Design This is really just a miscellaneous collection of thoughts and links right now, not a full fledged article on API design. Casey Muratori gave a good talk at Game|Tech on Designing and Evaluating Reusable Components, which was really a talk on API design. Here's the executive summary: Granularity - A or BCFlexibility vs. simplicity Redundancy - A or BConvenience vs. orthgonality Coupling - A implies BLess is always better Retention - A equals BSynchronization vs. automation Flow Control - A invokes BMore game control is always better A great insight on API and language design comes from Larry Wall, the designer of Perl, but I first heard about it from Jon Blow in this article. You want your language or API to be diagonal, not orthogonal as conventional programming wisdom states. If you want to go from one place to another, you want to travel the shortest distance, not have to take the Manhattan path. It's a great point (and is Casey's Redundancy point above). Category: Programming"
year_published = 2025
