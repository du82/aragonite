["https://chrishecker.com/Braid_on_Xbox_Live_Arcade"]
title = "Braid on Xbox Live Arcade - Chris Hecker's Website"
full_description = "Braid on Xbox Live Arcade My friend Jonathan Blow's game, Braid, is now out on XBox Live Arcade. Braid is exactly the kind of high-quality, thought-provoking, artful, and entertaining indie game we all want to see succeed. It is a game about time and consequence, with a painterly art style, beautifully executed by David Hellman. Please check out the demo version, and if you like it—which you will—buy the game, post about it on your blog, and tell your friends. Microsoft has proven itself completely incompetent at marketing XBLA games, so Braid's well-being rests on good word-of-mouth and personal recommendations. Please do your part to ensure Braid succeeds so we can get more games like this in the future. Categories: GamesDesign"
