title = "Fix apt-get update “the following signatures couldn’t be verified because the public key is not available” :: Chris Jean"
full_description = "Meir Shani says: April 23, 2015 at 3:49 pm I’m sorry, did not work for me: … W: GPG error: http://download.opensuse.org Release: The following signatures couldn’t be verified because the public key is not available: NO_PUBKEY 0429ACCAF7AA50B3 ~/ # I tried the solution and it failed: ~/ # sudo apt-key adv –keyserver keyserver.ubuntu.com –recv-keys 0429ACCAF7AA50B3 Executing: gpg –ignore-time-conflict –no-options –no-default-keyring –secret-keyring /tmp/tmp.Nd5sw1reOg –trustdb-name /etc/apt/trustdb.gpg –keyring /etc/apt/trusted.gpg –primary-keyring /etc/apt/trusted.gpg –keyserver keyserver.ubuntu.com –recv-keys 0429ACCAF7AA50B3 gpg: requesting key F7AA50B3 from hkp server keyserver.ubuntu.com gpgkeys: key 0429ACCAF7AA50B3 not found on keyserver gpg: no valid OpenPGP data found. gpg: Total number processed: 0 ~/ # Reply Chris Jean says: April 23, 2015 at 5:36 pm It looks like openSUSE doesn’t maintain keys on the Ubuntu keyserver. You’ll have to manually download the appropriate key and add it to your system using add-key. You can find an example here. Reply William says: December 13, 2015 at 3:51 pm Thank you for this info. Could not find the proper command to install the missing public key until this website. Reply MohamedRamadan says: January 26, 2016 at 8:17 am This is awesome … thank you NOTE : Every one change the key with the key the error carry .. GOOD LUCK 🙂 Reply krst0 says: March 3, 2016 at 7:44 am As others said – awesome! So easy, just need to replace keys. I´ll bookmark this page. 😉 Thank you very much. Regards, krst0 Reply Freddy says: March 18, 2016 at 2:25 am Thank you for your helpful post. It solved my problem. Really. Reply Linux Mint: Moving the /home Folder to a Separate /home Partition | Ray Woodcock's Latest says: April 25, 2016 at 9:24 pm […] couldn’t be verified because the public key is not available.” A search led to instructions to run this […] Reply Dockerizing WordPress in a multi-container architecture | Knowledge Base says: June 20, 2016 at 9:25 am […] Apt-key commands https://chrisjean.com/fix-apt-get-update-the-following-signatures-couldnt-be-verified-because-the-pu&#8230; […] Reply"
