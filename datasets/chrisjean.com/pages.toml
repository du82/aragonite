["https://chrisjean.com/fix-dig-command-not-found-in-ubuntu"]
title = "Fix “dig: command not found” in Ubuntu :: Chris Jean"
full_description = "Jörg Malek says: June 2, 2015 at 7:31 am Cool. Thanks for the quick & clean info – now I can dig it 😀 ‘dig’ isn’t included in ‘Ubuntu 14.04 LTS minimal’ but in the full server installation ISO. Reply Chris Jean says: June 2, 2015 at 8:47 am You are quite correct. I was using a minimal install. Good catch. Reply Chris Jean says: July 19, 2016 at 2:16 pm There are various ways to know what package provides a command. If you are on Ubuntu or another distro that comes with the command-not-found package installed, attempting to run a command that isn’t available can provide you with package names that could provide the command you want. For example: [chris@test ~]$ dig The program 'dig' can be found in the following packages: * dnsutils * knot-dnsutils Try: apt-get install [chris@test ~]$ If you have access to another system that has the command that you want, you can typically query that system to find out. For instance, the following works on Debian-based systems such as Ubuntu: [chris@test ~]$ dpkg -S `which dig` dnsutils: /usr/bin/dig [chris@test ~]$ If those fail, I resort to using Google. Reply"
