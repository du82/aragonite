["https://chrisjean.com/category/random-ramblings"]
title = "Random Ramblings :: Chris Jean"
full_description = "Did you just receive some mail notifications saying that mail could not be delivered to some.address.it.wont.ever.reach@lookup.and.try.to.find.this.host.name? Fear not. This isn’t some kind of weird hack or compromise of your system. In all likelihood, someone just compiled PHP on the server. PHP’s unit test to confirm that bug 72463 remains fixed makes two mail() calls that try to send mail to that address. The email address was specifically chosen to ensure that it would not refer to a real email address while still remaining a valid email address, thus the reason for the mail handler on the server sending the error stating that the mail could not be sent. So, there’s no problem. It’s just PHP’s unit tests doing their job when someone runs make test. I’ve been overweight most of my life. I experienced many years of depression that started in elementary school. From that moment until early 2012, I have consistently gained weight. In January, I decided that I had to get serious about weight loss, so I did. While driving to work one morning, I decided that if I didn’t do something to change my life at that exact moment, that I never would. I made a contract with myself that I would immediately go and sign up at a gym and get a personal trainer, that I would do everything that trainer told me to do, and that I wouldn’t look back or second guess myself. I had thirty years of being irresponsible, now it was time for some personal responsibility. So, that’s what I did. I messaged the office to say that I would be late. I drove to Results Fitness, a gym near my office and home. I met Jeff Miller, a trainer at Results. I signed up for the gym and to meet Jeff every Tuesday and Thursday. I committed to eat a specific meal plan every meal of every day. I do what my trainer tells me. I haven’t looked back. I haven’t second guessed my decision. I haven’t regretted anything. Read More→ Ubuntu 9.10, Karmic Kaola, launched earlier this week. One of the key new features in this release is Ubuntu One. Unfortunately, from what I’ve seen, this new feature/product launch has been anything but smooth. Ubuntu One is one of the new ways that Canonical, the creators of Ubuntu, is trying to generate some revenue based on their distro. Ubuntu One is a hosted file storage solution that allows users to keep a folder and all of its content synced between multiple computers. All users get 2GB of storage for free with the option of increasing the store to 50GB for $10/month. Since this new offering has many Ubuntu users very excited, I thought I’d give it a try as soon as I installed the new release. However, I was instantly met with a very big message telling me that something was wrong. Read More→"
