["https://chrisjean.com/what-is-some-address-it-wont-ever-reachlookup-and-try-to-find-this-host-name"]
title = "What is some.address.it.wont.ever.reach@lookup.and.try.to.find.this.host.name :: Chris Jean"
full_description = "Did you just receive some mail notifications saying that mail could not be delivered to some.address.it.wont.ever.reach@lookup.and.try.to.find.this.host.name? Fear not. This isn’t some kind of weird hack or compromise of your system. In all likelihood, someone just compiled PHP on the server. PHP’s unit test to confirm that bug 72463 remains fixed makes two mail() calls that try to send mail to that address. The email address was specifically chosen to ensure that it would not refer to a real email address while still remaining a valid email address, thus the reason for the mail handler on the server sending the error stating that the mail could not be sent. So, there’s no problem. It’s just PHP’s unit tests doing their job when someone runs make test. Related Did I help you? Send me a tip via Paypal. Help with this site's hosting with my Linode referral code."
