["https://chrisjean.com/fix-for-usb-audio-is-too-loud-and-mutes-at-low-volume-in-ubuntu"]
title = "Fix for USB Audio is Too Loud and Mutes at Low Volume in Ubuntu :: Chris Jean"
full_description = "NlL5 says: April 30, 2015 at 9:36 am Thanks so much!! I’ve just bought an USB sound stick “Creative Sound Blaster Play!”. At the Raspberry Pi it works just fine, but on my laptop it was waaayyy too loud. Your guide was very easy and helped me a lot. I use OpenSUSE and it worked there as well. Reply Chris Jean says: April 30, 2015 at 9:43 am Glad that I could help. Thanks for the details about it working on OpenSUSE. Reply M. says: June 11, 2015 at 8:21 am My device “ID 041e:30d3 Creative Technology, Ltd Sound Blaster Play!” suffered the same problem. I’ve been searching for the solution for almost 2 years. And now it’s completely solved, all thanks to you! Reply jimbo1qaz says: September 4, 2015 at 1:13 am I was trying to get this setup on my laptop. It just wouldn’t work, even though the configuration files were almost identical to my perfectly functioning desktop. Solution? Even if you include “volume = ignore”, you ABSOLUTELY MUST include “volume-limit = 1.0”. Otherwise, PulseAudio will still merge the volume controls, even though you explicitly told it not to! Reply N. says: October 22, 2020 at 3:37 am Putting volume-limit to 1.0 in conjunction with “volume = ignore” somehow made the slider function normally (the other values of volume-limit just made it not produce any sound at all and leaving it out was super loud). So thank you! Reply Bob Monkhouse says: December 4, 2015 at 3:48 am Thank you! This had been driving my crazy for months. Reply Artrande says: April 13, 2016 at 4:53 pm Dude, you just saved my ears… Can’t count the time I spent trying to fix this, thank you really ! Reply Carl Thomé says: April 17, 2016 at 4:17 pm Thanks! Had the same issue with an E-MU Tracker Pre on Debian 8. Reply William Eggington says: April 21, 2016 at 11:48 pm Thank you very very much for posting this. I can now sanely adjust my audio levels in my Debian Linux system with my USB sound card without fear of bursting my ear drums. You are a life saver. Reply"
