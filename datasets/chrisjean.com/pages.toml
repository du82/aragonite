["https://chrisjean.com/ssh-into-ubiquiti-access-point"]
title = "SSH Into Ubiquiti Access Point :: Chris Jean"
full_description = "Paul Odum says: June 16, 2020 at 12:23 pm I read your article on using SSH to log into a Ubiquiti AP under 2 conditions stated 1. If AP has Not been Adopted yet and 2. If AP has been Adopted by you before. My question is what if they were installed/Adopted by someone else not in your organization, can you SSH into and change the Password and or reconfigure? Reply Chris Jean says: June 23, 2020 at 9:53 am In that case, you will need to manually reset the AP first. If you look at the underside of the AP, you will notice a small hole labeled “RESET” by the network jack. With the AP powered, push a small pin or paper clip into the hole, depress the button, and hold the button down for 10 seconds. You should see the light turn off after a few seconds and then turn back on a few seconds later. You can then release the button. Wait for the AP to finish rebooting, and proceed to configure the AP. Reply"
