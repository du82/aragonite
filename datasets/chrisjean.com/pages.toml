["https://chrisjean.com/fix-system-program-problem-detected-messages-from-ubuntu"]
title = "Remove “System Program Problem Detected” Messages From Ubuntu :: Chris Jean"
full_description = "Zepp says: September 18, 2014 at 5:11 pm Just did all of this, hopefully it works out. Thanks for the write up! Reply Acacio da Rosa Florentino says: September 20, 2014 at 9:58 am I was having the same issue. Thank you very much for explaining how to fix it! And I agree to you about being useless (well… At least for me, because I`m a newbie and I really don`t see a reason to care all that much, since it does not seem to really matter – my Ubuntu distros work as if I hadn`t any problem at all). I`m getting this problem only when I use my Ubuntu from pendrive – no problem report is shown when I boot my Ubuntu from HD. Reply Sequim says: October 15, 2014 at 2:41 pm I saw it for the first time today, quite unexpected. I just dismissed it, and fretted for a while that it might be malware fishing for my credentials. Thanks for the explanation. I feel much better now. I’d say a more detailed message should be provided, and should include at least a summary to put the user at ease. And why should a password be needed? Reply Chris Jean says: October 16, 2014 at 4:20 pm I’m not sure when you were prompted for a password. If it was while generating the details, it would be because it needed to access files that your user didn’t have access to read, such as log files with root-only access. Reply YoukeWu says: November 23, 2014 at 4:00 am thanks for your help ! This problem is puzzled me a long time. Reply Carsten says: March 26, 2015 at 3:13 am Thanks, man. Greatly appreciated, as I force kill applications every now and then and forget to clean /var/crash. This service should be disabled by default. Reply Jeremy says: December 17, 2015 at 3:17 pm Thanks a ton. I got those errors after I changed my Linux Virtual Box’s processor to ICH9, but clearing /var/crash fixed them right away. Without your post I would have probably lost hours trying to find the cause of those messages. You rock! Reply"
