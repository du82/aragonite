title = "Chris Jean"
full_description = '''In an earlier article, I talked about how I recently set up a Ubiquiti access point (model UAP-AC-PRO-US). There are a variety of commands you can run directly on the access point by logging in via SSH. In order to do this, you may need to modify the login credentials. This article will show you how to make these changes. Note that the access point must be adopted and provisioned by the UniFi controller before you can manage the SSH authentication credentials. The username, password, and SSH keys can all be managed from the same place. To modify the credentials, do the following: Log into the UniFi controller.Go to Settings (the gear icon in the bottom-left of the page).Go to the Site section (this is the default section you go to when going to the Settings page).Make the desired changes in the “DEVICE AUTHENTICATION” section at the bottom of the page.Click the “APPLY CHANGES” button. After applying the changes, the adopted access points should automatically update with these new credentials. If you wait a minute or so and the new credentials do not work yet, you can force the changes onto an access point by doing the following: Log into the UniFi controller.Go to Devices (the nested circles icon towards the top-left of the page).Click on the access point that needs updating. This will pop open a panel on the right side of the page.Click the Config icon (it looks like a gear) at the top middle of the device’s panel.Click “MANAGE DEVICE” in the device’s panel. Note: You may need to scroll to see this section.Click the “Provision” button under the “Force provision” section. After following these steps, the access point’s status will change to “PROVISIONING”. The changes should only take a few seconds to finish. Once the access point’s status changes back to “CONNECTED”, you should be able to SSH into the access point using the updated credentials. I recently set up a Ubiquiti access point (model UAP-AC-PRO-US). Part of the process required me to log into the access point, but I could not find any connection details such as the port, username, or password. After a bit of digging, I figured it out. Logging into AP before it is adopted When your access point is new and hasn’t been connected to your UniFi controller yet, the default SSH credentials are: Port: 22 Username: ubnt Password: ubnt You can find the IP address for the access point listed in the UniFi controller’s Devices page. In my case, the IP address was 10.0.0.103. To log in, I ran the following command from my terminal: [chris@home ~]$ ssh ubnt@10.0.0.103 ubnt@10.0.0.103's password: ubnt BusyBox v1.25.1 () built-in shell (ash) ___ ___ .__________.__ | | |____ |__\_ ____/__| | | / \| || __) | | (c) 2010-2019 | | | | \ || \ | | Ubiquiti Networks, Inc. |______|___| /__||__/ |__| |_/ https://www.ui.com/ Welcome to UniFi UAP-AC-Pro-Gen2! UBNT-BZ.v4.0.21# Logging into AP after it is adopted If the access point is already adopted and provisioned, the UniFi controller changed the SSH login credentials for it. If your UniFi controller already manages other access points, the new access point’s SSH credentials are changed to the same credentials. If this is the first access point added to the UniFi controller, the new username is admin and the password was randomized. If you need to change the SSH login credentials for the access point, please read this article. To find the IP address for your access point, log into your UniFi controller and go to the Devices page. Assuming that the access point’s IP is 192.168.1.5, the username is admin, and the password is password (please do not use this as your password), you can SSH into the access point with a command such as the following: [chris@home ~]$ ssh admin@192.168.1.5 ubnt@192.168.1.5's password: password BusyBox v1.25.1 () built-in shell (ash) ___ ___ .__________.__ | | |____ |__\_ ____/__| | | / \| || __) | | (c) 2010-2019 | | | | \ || \ | | Ubiquiti Networks, Inc. |______|___| /__||__/ |__| |_/ https://www.ui.com/ Welcome to UniFi UAP-AC-Pro-Gen2! UBNT-BZ.v4.0.21# Fix “no matching MAC found” Your system’s SSH client might have restrictions that prevent the commands above from working properly. For example, you might run into the following issue: [chris@home ~]$ ssh ubnt@10.0.0.103 Unable to negotiate with 10.0.0.103 port 22: no matching MAC found. Their offer: hmac-sha1,hmac-md5 [chris@home ~]$ This can be fixed by supplying an additional option to the ssh command as shown below. [chris@home ~]$ ssh -o MACs=hmac-sha1,hmac-md5 ubnt@10.0.0.103 ubnt@10.0.0.103's password: ubnt BusyBox v1.25.1 () built-in shell (ash) ___ ___ .__________.__ | | |____ |__\_ ____/__| | | / \| || __) | | (c) 2010-2019 | | | | \ || \ | | Ubiquiti Networks, Inc. |______|___| /__||__/ |__| |_/ https://www.ui.com/ Welcome to UniFi UAP-AC-Pro-Gen2! UBNT-BZ.v4.0.21#'''
