["https://chrisjean.com/change-ubiquiti-access-point-ssh-username-password-and-keys"]
title = "Change Ubiquiti Access Point SSH Username, Password, and Keys :: Chris Jean"
full_description = "Pedro Salomao says: July 16, 2020 at 11:39 pm Hi Chris, Very nice! It was simple and way better than vendor’s documentation. Only note to add here – I had to enable “try new settings (beta)” in order to eventually find device authentication. From there onwards, exactly as you described – controller set new username and random password though I could easily change that. Now troubleshooting problem where every time I upgrade the AP, controller can not ‘adopt it’ back, therefore need to reboot controller and AP – what a pain. Have a support case opened with vendor. (same problem with RF scan as well) Cheer s/Pedro Reply Tobi says: December 28, 2020 at 9:47 am Hi Chris, many thanks for your post. I have a UDM-Pro with a UAP-nanoHD attached to it. For the UDM-Pro, no prob. I can login to it via SSH. For the UAP-nanoHD I cannot. So I followed the instructions you provided and updated the site config to use SSH authentication. At first I thought it might be a good idea to name the user “root” but then (after it did not work) decided to go for “tobi”. Forcing the UAP to reprovision worked. Just, I still get a connection refused when trying to connected via SSH to the UAP. Any ideas? Best, Tobi Reply Tobi says: December 28, 2020 at 12:05 pm Hey Chris, finally I figured out why I could not connect. Reprovisioning the UAP was not enough. Even though the user was created on the UAP, the SSH daemon was not started. You can see that when logging in via the WebUI and running a netstat (port 22 was not open) I had to disconnect the UAP from power and have it start again. After that, the SSH daemon was up and running and I could finally connect via SSH. Best, Tobi Reply"
year_published = 2020
year_updated = 2020
