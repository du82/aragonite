["https://chrismcleod.dev/bookmarks"]
title = "Bookmarks — Chris McLeod"
description = "A collection of bookmarks I've saved"
full_description = '''This page collects bookmarks of pages from around the web that I want to save for later. Atom RSS JSON Atkinson Hyperlegible Font by The Braille Institute I’ve been having on-off minor vision issues for the last year, with today being a “soft-focus day”. Even at tiny sizes these fonts are exactly as their name implies. I’m tempted to switch to using them. February 11, 2025 Building personal software with Claude February 9, 2025 The Counterforce Guide to Mastodon and The Fediverse (for punks!) In this guide, I will try to explain what the Fediverse is, why it’s cool for punks, give a practical how-to on getting started with Mastodon, and lay out some dreams for the future. February 7, 2025 UK confronts Apple with demand for cloud backdoor to users’ encrypted data Politicians wanting to break encryption, despite the risks to everyone… a tale as old as time. February 7, 2025 o3-mini is really good at writing internal documentation I want to try to recreate this. I know of several code bases which could benefit from using automated documentation generation just to have any documentation. February 5, 2025 The Fantastic Four Teaser Trailer February 4, 2025 Good Internet Magazine January 29, 2025 Relatively New Things You Should Know about HTML Heading Into 2025 January 24, 2025 Learning HTML is the best investment I ever did HTML is – dare I say it – fun to me. The reason is that I started a long time ago. January 24, 2025 Is Microsoft Excel the Next Big E-Sport? “You’d never see this with Google Sheets,” he said. “You’d never get this level of passion.” January 20, 2025 Oh Shit, Git!?! A plain English guide to getting yourself unstuck when you screw up with Git. January 16, 2025 How not to learn Rust Here are the mistakes I’ve seen which may make you fail at learning Rust. I hope this list will help you avoid them. January 15, 2025 Why some DVLA digital services don't work at night Transforming government services isn’t as easy as the tech bros and billionaires make it out to be. January 15, 2025 The ″I'm Not a Computer Person‶ People January 15, 2025 What the Zuck? I was considering Pika for creating a side blog, and now they’re offering 15% off 🥳 January 14, 2025 Faking William Morris, Generative Forgery, and the Erosion of Art History Buying fake William Morris prints on Etsy and other early signs of epistemological collapse January 13, 2025 Note to No 10: one speed doesn’t fit all when it comes to online safety Legislation to protect children in the digital realm is essential. But if it results in the loss of small cycling and cancer-care forums, something’s gone wrong January 12, 2025 Falsehoods programmers believe about names January 11, 2025 Falsehoods programmers believe about time January 11, 2025 Falsehoods programmers believe about addresses January 11, 2025 The Useless Web Press the button, get a “useless” website. Just like the old days. January 11, 2025 Grifters, believers, grinders, and coasters Why do engineers get mad at each other so often? January 9, 2025 The future of htmx We hope to see htmx, in its own small way, join the likes of giants like jQuery as a sturdy and reliable tool for building your 100 year web services. January 7, 2025 The day I taught AI to read code like a Senior Developer Making code suggestions without deep context is like having a brilliant junior dev who just joined yesterday - they’ll write clean code that subtly breaks everything. January 6, 2025 Principles of Web Accessibility Bookmarking for later January 6, 2025 Never Forgive Them Using the computer in the modern age is so inherently hostile that it pushes us towards corporate authoritarians like Apple, Microsoft, Google and Meta December 18, 2024 You Ain’t Seen All of These… Right? I love this… a meticulous breakdown of different releases of previously-unseen footage from 90’s BBC comedy The Fast Show, along with a love letter to why this is important. More series are covered on the site, including faves like Red Dwarf. November 20, 2024 Don't call it a Substack. Links are powerful — that’s why Instagram and Twitter and Threads punish and limit them, and why Substack tries to take credit for them. Quit Substack while you can. Molly White has a great post about her experience doing so: https://www.citationneeded.news/substack-to-self-hosted-ghost/ November 20, 2024 HTML is for people HTML isn’t only for people working in the tech field. It’s for anybody, the way documents are for anybody. HTML is just another type of document. A very special one—the one the web is built on. November 15, 2024 The Static Site Paradox only few professional software engineers can “afford” to have the second option as their personal website, and almost all normal users are stuck with overcomplicated solutions. November 11, 2024 Oh, you make websites? The elevator doors scud open and the bullpen is a hive of activity. A pause. This is, as they say, “where the magic happens”. I make finger-quotes as I say it, but I do it ironically so that everyone laughs at my supreme wit. November 11, 2024 Migrating PDS Account with `goat` If hosting a PDS for a secondary/test account goes OK, I guess the next step would be to migrate my “main” Bluesky account to that PDS. November 3, 2024 Self-hosting a Bluesky PDS and using your domain as your handle I think I’m going to try out setting up my own ATproto PDS, and hosting my own Bluesky data. November 3, 2024 The Cult of Microsoft The “growth mindset” is Microsoft’s cult — a vaguely-defined, scientifically-questionable, abusively-wielded workplace culture monstrosity, peddled by a Chief Executive obsessed with framing himself as a messianic figure with divine knowledge of how businesses should work. November 2, 2024 Come to the light-dark() Side Lots of useful stuff here for implementing dark + light modes for websites. October 25, 2024 Record labels forgot these songs existed. One man rescued them In fact, one survey by the US Library of Congress suggested that less than 20% of all recorded music was available on the internet. August 25, 2024 A24’s Y2K looks like an apocalyptic rager in first trailer We watched the trailer for Y2K last night, and it looks ridiculously fun. August 21, 2024 The Hollow Outrage of the Moral Panic Influencers Society doesn’t fucking need more loud, pearl clutching, rabid moralists. We need individuals who embody values in their daily lives, who lead by example rather than by volume. We need real moral heroes who aren’t screaming on street corners or denouncing people on social media for not fitting into a rigid morality box. August 13, 2024 "The War Within" Music Wowhead have compiled a playlist of the in-game soundtrack for World of Warcraft’s upcoming “The War Within” expansion. First impressions: it’s a banger. If it’s anything like the last 2 expansions, this is going to end up dominating my “Most Listened to” this year August 12, 2024 Sproket's Small World: Aeldari Voidscarred Corsairs. Part 1. David Soper continues to be a miniature painting legend. August 9, 2024 Bookmarks — Chris McLeod Cheekily bookmarking my own /bookmarks page because I’ve turned it into more of a “link blog”, and changed how it’s shared out to social media. August 9, 2024 Kagi Small Web It’s a bit like StumbleUpon, for a curated list of blogs and other “small web” sites, and powered by RSS feeds. I’ve spent a chunk of my morning reading posts I’d probably never have found otherwise and then hitting “next post” to get another. It’s open-source too! August 7, 2024 Where Facebook's AI Slop Comes From Part of me does wonder if these loopholes and techniques could be exploited for good somehow, rather than selfish gain - and what that might look like. August 7, 2024 CSS One-Liners to Improve (Almost) Every Project August 5, 2024 Building the Micro Journal I absolutely do not have the time to recreate this, but I still kinda want to. July 29, 2024 NeoDB is a Review System for Culture I’m going to have to investigate this more at a later time. It sounds like it could be great to power a “media” section of my site. July 25, 2024 Filling in the gaps - The case for public backlogs, roadmaps July 19, 2024 Server Side Includes, the hottest of the web in 1995 July 17, 2024 Could You Give Up Social Media? Honestly, I’ve been tempted of late. I’ve noticed my overall usage dropping pretty low, though I do have bursts of activity. I think I could, but I wouldn’t delete my accounts; I’d leave them up for syndication (POSSE) and discovery through tools like Murmel. July 17, 2024 Everybody's Free (To Write Websites) Maybe you’ll blog, maybe you won’t. Maybe you’ll have users, maybe you won’t. Maybe you’ll give up that cool domain. Maybe you’ll sell that little project and hate what the buyers do with it. July 17, 2024 Updating my Obsidian setup | LewisDale.dev July 16, 2024 The pit it's so easy to fall into July 15, 2024 Morioka Shoten, the Bookshop with Only One Book July 15, 2024 Building a Custom Filter for Eleventy Collections July 1, 2024 Hammer and Bolter – Undercity June 26, 2024 Microfeatures I Love in Blogs and Personal Websites June 25, 2024 Adding Github-Style Markdown Alerts to Eleventy June 21, 2024 The Canva-ification of everything. June 17, 2024 The Worst Dads in All of Literature June 17, 2024 Bumblebee joins Optimus Prime as the next Transformers Lego set June 14, 2024 Whimsica11y June 13, 2024 The Basics (.dev) June 11, 2024 Human-Generated Content #2 June 9, 2024 C*** June 8, 2024 Three Reasons Why I Subscribe to My Own RSS Feeds June 8, 2024 Linux May Be the Best Way to Avoid the AI Nightmare June 8, 2024 The InclusiveWeb June 8, 2024 OMAKUB — An Omakase Developer Setup for Ubuntu June 8, 2024 Old Dogs, new CSS Tricks Truth be told, I’ve fallen waaaayy behind on my CSS knowledge. May 28, 2024 RSS is Good, Isn’t It?! May 27, 2024 She Is the Icon of All That Is Joyful in the World’ May 27, 2024 omg.lol’s People Principles May 27, 2024 ICQ is shutting down after almost 28 years I’m pretty sure ICQ was the first chat app I used regularly, back in 2000/2001. I was honestly surprised to find out it was still in operation. May 27, 2024 Microsoft Bing issue takes down Copilot, DuckDuckGo, and ChatGPT search features May 23, 2024 RSS blogrolls are a federated social network May 23, 2024 The Phones of Normal People May 16, 2024 Create a function triggered by Azure Cosmos DB April 29, 2024 How to Trigger GitHub Actions Remotely Using Webhooks April 29, 2024 The Laravel Ecosystem - Herd I’m going to give this a try soon. Setting up a PHP environment natively on Windows has always been a pain, and this looks like it might solve it. April 26, 2024 Creating an Activity Feed with Jekyll April 26, 2024 'No Effort' Movement Frames April 26, 2024 ActivityPub on a (mostly) static website April 26, 2024 Open Sourcing DOS 4 April 26, 2024 BlizzCon 2024 has been canceled April 25, 2024 Interaction on the Web - My Addition to the Great Posts by Alex, Tracy, Jo, and bacardi55 April 23, 2024 NASA’s Voyager 1 Resumes Sending Engineering Updates to Earth For the first time since November, NASA’s Voyager 1 spacecraft is returning usable data about the health and status of its onboard engineering systems. The next step is to enable the spacecraft to begin returning science data again. The probe and its twin, Voyager 2, are the only spacecraft to ever fly in interstellar space (the space between stars). April 22, 2024 On Returning to Childhood Hobbies April 22, 2024 MIT License text becomes viral “sad girl” piano ballad generated by AI April 9, 2024 Pagefind UI and URL Parameters April 8, 2024 Apple’s calculator apps considered harmful April 2, 2024 Usborne 1980s Computer Books April 1, 2024 What we know about the xz Utils backdoor that almost infected the world April 1, 2024 Celebrating Six Years of Sister Augusta Danie Ware’s Sister Superior Augusta stories are some of my favourites in all Warhammer fiction. Despite having (I think) all of the printed stories, I’d actually missed Mercy - an oversight I’ve just corrected and downloaded to my Kindle! I keep meaning to do a small project based on Augusta and her squad; maybe this year is when I finally get around to it? March 19, 2024 the environmental benefits of privacy-focussed web design March 19, 2024 Npm Install Everything, and the Complete and Utter Chaos That Follows March 17, 2024 The end of the MrBeast era March 15, 2024 Facing reality, whether it’s about Apple or the EU, is a core requirement for good management March 13, 2024 Recommendations and blogrolls on Micro.blog This is one of those things that I always thought was weirdly missing from Micro.blog, so I’m glad to see it’s here! March 12, 2024 Careful What You Upload March 5, 2024 RsS iS dEaD LOL March 2, 2024 webmentions make me sad March 1, 2024 Textpattern turns twenty I loved Textpattern. There’s an alternative universe where I’m still using it, having not been seduced by the idea of needing more features. Once upon a time I wrote what I believed to be the first XML-RPC interface for Textpattern, before it became a core feature. To this day, I use some Textile syntax when writing Markdown because I still have the muscle memory. “Bon Anniversaire”, Textpattern! 💛 February 29, 2024 The Automattic ‘AI’ thing February 28, 2024 Tumblr and WordPress to Sell Users’ Data to Train AI Tools February 28, 2024 About HTML semantics and front-end architecture February 28, 2024 List of humorous units of measurement February 26, 2024 The Subversive Hyperlink February 26, 2024 Ditching YouTube (Kind Of) February 25, 2024 Things to read instead of Harry Potter February 24, 2024 Taking a risk February 23, 2024 Green Software Patterns February 23, 2024 Windows-as-a-nuisance: How I clean up a “clean install” of Windows 11 and Edge February 23, 2024 Have we forgotten how to build ethical things for the web? February 23, 2024 Early Access Federation for Self-Hosters February 23, 2024 JavaScript Bloat in 2024 February 23, 2024 Death, Lonely Death We thought we knew how Voyager would end. The power would gradually, inevitably, run down. The instruments would shut off, one by one. The signal would get fainter. Eventually either the last instrument would fail for lack of power, or the signal would be lost. We didn’t expect that it would go mad. February 23, 2024 I Was a Teenage Webmaster I started a few years earlier than Mike, but a lot of this struck a chord with me February 21, 2024 A tale of three architectures February 21, 2024 Let's Talk About Stochastic Terrorism I kept seeing the term “stochastic terrorism” thrown around on social media over the last few months, but didn’t really understand what it meant. This lays it out quite clearly. February 21, 2024 Full Tilt Light February 21, 2024 Previous 1 2 Next'''
