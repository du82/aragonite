title = "New Paint, Same Blog — Chris McLeod"
description = "Chris McLeod is a software developer with over 20 years of experience. Sometimes he writes about it."
full_description = 'New Paint, Same Blog 🔗 February 4, 2025 | by Chris McLeod I’ve been wanting to redo the theme of this site for a while. I had some specific ideas in mind, but no cohesive vision. Then I thought to myself - “why don’t I base it on the editor theme I enjoy using so much and spend most of my day looking at?” Or something like that. And so, after a couple of evenings hacking away at the CSS, https://chrismcleod.dev has a new, fresh coat of paint. The colour pallete is Catppuccin. In light mode, the Latté style is used, and in dark mode, Machiatto. You can use the theme switcher in the footer to try them out, if you want. It’s all made possible with CSS variables. I knew I wanted to inject more colour across the site than I used previously, so I’ve made use of several in the predefined sets. Where there are UI items which repeat several times - the navbar link, tags in the archive, etc. - I cycle through the colours to approximate a rainbow. The code for this was surprisingly concise, using the :nth-of-type() selector: .button:nth-of-type(7n+1) { /* set red properties */ --button-border: var(--color-red); } .button:nth-of-type(7n+2) { /* set orange properties. "peach" is the closest in Catppuccin */ --button-border: var(--color-peach); } /* repeat for the rest… */ .button:nth-of-type(7n+7) { /* set violet properties. "mauve" is the closest in Catppuccin */ --button-border: var(--color-mauve); } This will start with red, cycle to “violet” (classic ROY G BIV), then start repeating the pattern infinitely. Fonts were another thing I had an idea for coming in. I was pretty sure I wanted to use a monospace font. I view myself as my blog’s primary audience, so it made sense to optimise for my own reading preferences. Hopefully it works as well for others. The main body font is iA Writer Duo, which is the editor font I use for writing Markdown files, while iA Writer Quattro is used for headings. To provide some visual variation, code samples use Cascadia Code, which is the main font I use in my editor. Under the hood everything is still Eleventy, and the Eleventy Excellent starter (it’s still my lightly hacked v1 for now, rather than the latest v4). I enjoyed the layout and typography of Eleventy Excellent, and Lene has built a great foundation to work off of, so I didn’t feel the need to rip up the foundations. Pretty much all I’ve done is apply some new colours and move things around without changing much of anything in the HTML - which feels very much like how HTML and CSS should work. Filed under: posts, timeline, site-meta This author runs on caffeine (I’m not convinced the servers don’t, either). If you’ve found any of my posts useful or informative, maybe you’d consider buying me a coffee?'
