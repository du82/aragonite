["https://chrismcleod.dev/privacy"]
title = "Privacy Policy"
description = "I respect the EU General Data Protection Regulation (GDPR). This policy document explains how I collect and handle any information you provide to me."
full_description = "Privacy Policy I respect the EU General Data Protection Regulation (GDPR) and this policy document explains how I collect and handle any information you provide to me. What background data is collected? This site does not use any third party tracking scripts. Recently I added self-hosted Umami stats to the site, so I can have a rough understanding of reader numbers and where traffic is being referred from. You can read the Umami FAQ here. In terms of what this actually means: when you visit a page on this site, I see a number linked to that page increase by 1. I do not see who you are or any personally identifiable information about you, though I can see: what country + city your IP is associated with. This is linked more to your ISP (which I cannot see details of) than to you. what browser/OS/class of device you used. e.g., Chrome on an Android mobile device. when you visited (date and time) Cookies are not used, and I absolutely cannot track you across the internet. How do I use the data you provide? This website does not collect any data. How secure is your data? Very secure, as this website does not collect any information. How secure is this website? This website transmits itself using HTTPS, encrypting all data between the browser and the server. Your network provider can still see that you are downloading assets from this site, but not its content. This also protects you from third parties intercepting data, for example, while browsing on public WiFi, or from network providers injecting advertisements on this site. All relevant response HTTP headers are set for your protection and the Content Security Policy is adjusted to this websites requirements. Data controller , Tel: Mail: If you have any questions or doubts, please contact me: Changes to the policy If I change the content of this policy, those changes will be effective at the time I post them here. Complaints If you have any reason to complain about the way I handle your privacy, please contact me by email: ."
