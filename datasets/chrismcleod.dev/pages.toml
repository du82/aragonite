full_description = 'Visual Studio Code Snippet for Markdown Frontmatter 🔗 January 27, 2025 | by Chris McLeod I can’t believe it’s taken me this long to setup, but I finally added a snippet to VSCode for inserting Frontmatter into a Markdown file - handy for e.g, adding a new post to an Eleventy-powered blog. To add a snippet, press Ctrl-Shift-P or F1, then select “Configure Snippetts”. Decide where you want to create the snippit - it can be at the project-level, language-level, or global. I chose language, so selected Markdown. Next, define your snippet in the JSON file. For me, this was: { "post frontmatter": { "prefix": "fm", "body": [ "---", "title: $1", "date: $CURRENT_YEAR-$CURRENT_MONTH-${CURRENT_DATE}T$CURRENT_HOUR:$CURRENT_MINUTE:$CURRENT_SECOND$CURRENT_TIMEZONE_OFFSET", "id: $UUID", "tags:", " - $2", "---", "$0" ], "description": "Post frontmatter" } } What this does, is generate some frontmatter data whenever I type fm in a markdown document and then tab to insert the snippet. It automatically adds the current date and time, and puts the cursor at the first tab-stop, ready to type my title. Pressing tab again puts the cursor to the tags field, and a final tab puts the cursor into the document body, ready to write. To use this post as an example, the output will be something like: --- title: Visual Studio Code Snippet for Markdown Frontmatter date: 2025-01-27T14:40:16+00:00 id: dd31b3bf-93c8-4d91-85f3-0f59dce4466f tags: - markdown - vscode - eleventy --- You can read more about VSCode snippets and what you can do with them in the official docs. There were a lot more built-in variables than I realised, which has let me uninstall 2 extensions already. If you’re wondering what the id field in the frontmatter is for: I’ve been loosely tracking the conversation around what makes a good identifier in a feed. Evan kicked it off, then Bob continued it on. Even though I haven’t made any changes to my feeds yet, I didn’t see any harm in pre-emptively adding the data, in case I do. However, Evan noted this: … the ID does have to be a URI, so you can’t — as I initially planned to do — just chuck a UUID in there and call it a day … Not to get all “well, ackchyually…”, but you kinda can. It just needs to use the urn:uuid URI scheme like so: urn:uuid:dd31b3bf-93c8-4d91-85f3-0f59dce4466f. This is something I learned about on The Underground[1], when several people helpfully reached out to tell me about it. You can see it in the validator. Evan has decided to use the tag scheme for his blog, so it’s maybe a moot point, but I wanted to mention it in case it helps others. Yes, I am painfully aware I haven’t written there in a very long time. No, I don’t know when that might change. ↩︎ Filed under: posts, timeline, markdown, vscode, eleventy This author runs on caffeine (I’m not convinced the servers don’t, either). If you’ve found any of my posts useful or informative, maybe you’d consider buying me a coffee?'
