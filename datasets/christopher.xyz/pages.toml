["https://christopher.xyz/2020/11/25/mailchimp-rss.html"]
title = "Mailchimp RSS | Belated Blog"
description = "RSS is a great way to hear about new blog posts, but some blogs only provide email newsletters. Thankfully Mailchimp supports RSS!"
full_description = "Mailchimp RSS Nov 25, 2020 RSS is a great way to hear about new blog posts, but some blogs only provide email newsletters. Thankfully Mailchimp supports RSS! Cracking the code Provide your email to the newsletter signup form. Record the URL of the subscription confirmation page. It will be something like the following. https://theglowmgmt.us17.list-manage.com/subscribe/post?u=1143ef2ae4c2f267d492eb9cc&id=3184b747b9 ──── ───────────────────────────────────────── routing code list identifier Note the following attributes from the URL. routing_code: us17 list_identifier: u=1143ef2ae4c2f267d492eb9cc&id=3184b747b9 use the routing_code and list_identifier to fill out the “Campaign Archive” or “RSS Feed” links below. Campaign Archive Link The campaign archive page shows old posts, so you can view any you may have missed. format: https://<routing_code>.campaign-archive.com/home/?u=<list_identifier> example: https://us17.campaign-archive.com/home/?u=1143ef2ae4c2f267d492eb9cc&id=3184b747b9 RSS Feed Link You can subscribe to the RSS feed link with any feed reader. format: https://<routing_code>.campaign-archive.com/feed?<list_identifier> example: https://us17.campaign-archive.com/feed?u=1143ef2ae4c2f267d492eb9cc&id=3184b747b9"
