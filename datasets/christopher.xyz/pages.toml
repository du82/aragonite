["https://christopher.xyz/2018/12/12/what-are-class-descriptors.html"]
title = "What Are Class Descriptors? | Belated Blog"
description = "Why does the following snippet not work?"
full_description = '''What Are Class Descriptors? Dec 12, 2018 Why does the following snippet not work? class Document: @classmethod def noop(cls): pass @staticmethod def hello(): pass def foo(self): pass assert Document.foo == Document.__dict__.get('foo'), "this works" assert Document.noop == Document.__dict__.get('noop'), "this fails" assert Document.hello == Document.__dict__.get('hello'), "this fails" The problem is that classmethod and staticmethod are class descriptors. When we call __getattribute__ via Document.noop, the classmethod decorator transforms the noop function to be bound to Document. However, Document.__dict__.get('foo') doesn’t evaluate classmethod and simply returns the wrapped function.'''
author = "Christopher Dignam"
year_published = 2018
