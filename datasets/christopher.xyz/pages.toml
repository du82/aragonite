["https://christopher.xyz/2020/06/28/small-changes.html"]
title = "Make small changes | Belated Blog"
description = "A one line change is easier to review than a 1,000 line change."
full_description = "Make small changes Jun 28, 2020 updated Oct 26, 2021 A one line change is easier to review than a 1,000 line change. Break down large changes into smaller logical units. Feature flags are helpful in introducing incremental changes. Bug fixes and code refactors should be made separately from feature work; they’re easier to review in isolation. Reviewing a 1,000 line change is tiring and time consuming. Smaller changes get more timely and detailed feedback because they’re easier to review. Please see “Writing Reviewable Code” for a detailed discussion on making better code changes. Check out “Ship Small Diffs” for a discussion about shipping small changes, often. Update 2021-10-26, a similiar sentiment is described in this “Small CLs” document from Google."
