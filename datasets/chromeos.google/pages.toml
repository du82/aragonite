 Windows or Mac operating system, provided free of charge. There are a few differences, however. ChromeOS devices include Google-designed security chips and hardware that allow verified boot and firmware integrations, while ChromeOS Flex does not. In addition, if you need managed Google Play and Android Apps, that functionality is only available on ChromeOS devices. Learn more about all the differences here. How do I manage devices with ChromeOS Flex installed? You’ll need to purchase Chrome Enterprise Upgrade (or Chrome Education Upgrade) for each ChromeOS Flex device you want to manage before you can enroll them in your organization. Once enrolled, you can use your Google Admin console to manage those devices, apply policies, and get support. Why do I need ChromeOS device management? If you are an administrator who is managing ChromeOS devices for a business, you can use ChromeOS device management to enforce policies, set up Chrome features for users, provide access to your internal VPNs and Wi-Fi networks, force install apps and extensions, and more. How do I install ChromeOS Flex onto my PCs and Macs? You can use this ChromeOS Flex installation guide. Which devices are supported to run on ChromeOS Flex? ChromeOS Flex is designed to support the most common PCs and Macs over the last 10+ years, but it is only officially supported on certified models. You can visit our ChromeOS Flex certified models list to see which devices are supported. How often are ChromeOS Flex updates released? ChromeOS Flex follows the same release cycle as ChromeOS. For details, see Manage updates on ChromeOS devices. Can I mass deploy ChromeOS Flex to devices? You can use Microsoft System Center Configuration Manager (SCCM) or Windows Deployment Services (WDS) to mass deploy ChromeOS Flex to devices in your organization. For details, see Mass deploy ChromeOS Flex. Questions about ChromeOS Flex for business? Get in touch ¹Accenture: ChromeOS Flex Shared Value Model, 2023'''
