["https://chromium.googlesource.com/aosp/platform/packages/modules/Bluetooth"]
title = "aosp/platform/packages/modules/Bluetooth - Git at Google"
full_description = "You‘ll want to download some pre-requisite packages as well. If you’re currently configured for AOSP development, you should have most required packages. Otherwise, you can use the following apt-get list or use the --run-bootstrap option on build.py (see below) to get a list of packages missing on your system: You will also need a recent-ish version of Rust and Cargo. Please follow the instructions on Rustup to install a recent version. build.py is the helper script used to build Fluoride for Linux (i.e. Floss). It accepts a --run-bootstrap option that will set up your build staging directory and also make sure you have all required system packages to build (should work on Debian and Ubuntu). You will still need to build some unpackaged dependencies (like libchrome, modp_b64, googletest, etc). This will install your bootstrapped build environment to ~/.floss. If you want to change this, just pass in --bootstrap-dir to the script. The following third-party dependencies are necessary but currently unavailable via a package manager. You may have to build these from source and install them to your local environment. We provide a script to produce debian packages for those components. Please see the instructions in build/dpkg/README.txt for more details. We provide a build script to automate building assuming you've staged your build environment already as above. At this point, make sure you have all the pre-requisites installed (i.e. bootstrap option and other dependencies above) or you will see failures. In addition, you may need to set a --libdir= if your libraries are not stored in /usr/lib by default. This will build all targets to the output directory at --bootstrap-dir (which defaults to ~/.floss). You can also build each stage separately (if you want to iterate on something specific): Currently, Rust builds are a separate stage that uses Cargo to build. See gd/rust/README.md for more information. If you are iterating on Rust code and want to add new crates, you may also want to use the --no-vendored-rust option (which will let you use crates.io instead of using a pre-populated vendored crates repo)."
