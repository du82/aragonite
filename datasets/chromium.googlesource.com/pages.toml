full_description = 'chromeos-dbus-bindings was created to supplement libbrillo and simplify the implementation of D-Bus daemons and proxies. It generates C++ classes from the XML specifications of the D-Bus interface. Instead of dealing directly with MethodCall objects and unpacking the arguments manually, the generated bindings take care of marshalling and unmarshalling D-Bus method call arguments for you. The XML format defining objects and interfaces is the same format used in the introspection API. Method and signal handlers are generated from this XML file. If you were using dbus-c++ before, you are probably using xml2cpp to generate C++ bindings from the XML specification. If not, you may need to write an XML specification. After that, you will need to set up some actions in the gyp file for your service and its users. That will look something like this in your service: Then, in your service, you can #include "frobinator/dbus_adaptors/service.name.of.Frobinator.h" to get the interface and adaptor classes for Frobinator, and users can #include <frobinator/dbus-proxies.h> to get the proxy classes. Try to follow the best practices doc and only export one object for your service. D-Bus methods, signals and properties have type signatures. When generating bindings, chromeos-dbus-bindings will map D-Bus types to C++ types like so: This type mapping is also recursive, i.e. an argument of type a{s(io)} will be mapped to std::map<std::string, std::tuple<int32_t, dbus::ObjectPath>>. The generator will generate a class org::chromium::FrobinatorInterface with the following C++ method signature: This method can be implemented by inheriting org::chromium::FrobinatorInterface and can be called on proxy objects of type org::chromium::FrobinatorProxy. If the method fails, it should set the error to something descriptive and return false. If an arg has direction “in” and is not a simple numeric type, it will be passed in as const &. The bindings generator also supports several method annotations. Marking your methods with these will change the generated bindings.'
year_published = 2025
clearnet = "https://chromium.googlesource.com/aosp/platform/external/dbus-binding-generator"
