["https://chromium.googlesource.com/aosp/platform/system/core/liblog"]
title = "aosp/platform/system/core/liblog - Git at Google"
full_description = "liblog represents an interface to the volatile Android Logging system for NDK (Native) applications and libraries. Interfaces for either writing or reading logs. The log buffers are divided up in Main, System, Radio and Events sub-logs. The logging interfaces are a series of macros, all of which can be overridden individually in order to control the verbosity of the application or library. [ASR]LOG[VDIWE] calls are used to log to BAsic, System or Radio sub-logs in either the Verbose, Debug, Info, Warning or Error priorities. [ASR]LOG[VDIWE]_IF calls are used to perform thus based on a condition being true. IF_ALOG[VDIWE] calls are true if the current LOG_TAG is enabled at the specified priority. LOG_ALWAYS_FATAL is used to ALOG a message, then kill the process. LOG_FATAL call is a variant of LOG_ALWAYS_FATAL, only enabled in engineering, and not release builds. ALOG_ASSERT is used to ALOG a message if the condition is false; the condition is part of the logged message. LOG_EVENT_(INT|LONG) is used to drop binary content into the Events sub-log. The log reading interfaces permit opening the logs either singly or multiply, retrieving a log entry at a time in time sorted order, optionally limited to a specific pid and tail of the log(s) and finally a call closing the logs. A single log can be opened with android_logger_list_open(); or multiple logs can be opened with android_logger_list_alloc(), calling in turn the android_logger_open() for each log id. Each entry can be retrieved with android_logger_list_read(). The log(s) can be closed with android_logger_list_free(). ANDROID_LOG_NONBLOCK mode will report when the log reading is done with an EAGAIN error return code, otherwise the android_logger_list_read() call will block for new entries. The ANDROID_LOG_WRAP mode flag to the android_logger_list_alloc_time() signals logd to quiesce the reader until the buffer is about to prune at the start time then proceed to dumping content. The ANDROID_LOG_PSTORE mode flag to the android_logger_open() is used to switch from the active logs to the persistent logs from before the last reboot."
year_published = 2025
