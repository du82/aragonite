["https://chromium.googlesource.com/aosp/platform/frameworks/ml"]
title = "aosp/platform/frameworks/ml - Git at Google"
full_description = "This repository contains a port of the Android Neural Networks API for use on Chrome OS. On Chrome OS NNAPI is used as an abstraction layer for hardware acceleration of AI workloads, allowing vendors to develop a specific Neural Networks HAL driver using a framework that is shared with Android. The required Android system libraries have also either been ported to, or re-implemented, on Chrome OS. This list includes: This functionality is implemented in the shared library nnapi-support.so. Vendor HALS should link in this library (you can follow this example). If you build a test image, you can use a the sample executable ml_cmdline to verify that everything was built and deployed correctly. The aosp-frameworks-ml-nn will install libvendor-nn-hal.so and it will load the HAL provided by the vendor. The libvendor-nn-hal.so is the entry for loading different drivers in system, default implementation will try to require libfull-driver.so; Other drivers like libxnn-driver.so and libminimal-driver.so are available when passing USE=xnnpack and USE=minimal while building; The NNAPI implementation libneuralnetworks.so is configured to load a shared library with this name. The entry point for the vendor NN HAL will be the symbol android::hardware::neuralnetworks::V1_0::IDevice::getService, which will be called to register the HAL. For each driver's implementation, you need to inherit from hal::IDevice and implemente a class that contains the driver logic (See SampleDriverFull.cpp for a better understanding), and export a function named [get_driver](https://chromium.googlesource.com/aosp/platform/frameworks/ml/+/refs/heads/main/driver/sample/SampleDriverFull.cpp#28) that will handle the logic of initialization of a driver and return a void *; This function will be used in getService that will handle the register driver logic. The default NN HAL provides a set of drivers (full driver, minimal driver and xnnpack driver) and the availability depends on the host. By default, the system will only enable full driver and if you want to specify any other drivers, you can set an environmental variable DRIVERS to change this behavior (Seperated by “:”):"
year_published = 2025
