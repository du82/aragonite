["https://chroniclingamerica.loc.gov/help"]
title = "Help « Chronicling America « Library of Congress"
description = "Search America's historic newspaper pages from 1756-1963 or use the U.S. Newspaper Directory to find information about American newspapers published between 1690-present."
full_description = '''Search America's historic newspaper pages from 1756-1963 or use the U.S. Newspaper Directory to find information about American newspapers published between 1690-present. Chronicling America is sponsored jointly by the National Endowment for the Humanities external link and the Library of Congress. Learn more Pages Available: { title: 'Help', download_links: [ { link: 'https://www.loc.gov/rss/ndnp/ndnp.xml', label: 'application/rss+xml', meta: 'News about Chronicling America - RSS Feed', }, ] } Chronicling America About Chronicling America About the Site and API Recommended Topics Maps and Visualizations Help More Resources National Digital Newspaper Program NDNP Award Recipients Newspaper and Current Periodicals Reading Room Ask LC Newspaper & Current Periodicals Librarian Historic Newspapers on Flickr external link(part of the LC Flickr Commons photostream) Help FAQs How to View Basic Searching in Chronicling America Advanced Searching in Chronicling America Search and Browsing Tips Searching by Language in Chronicling America Searching the U.S. Newspaper Directory 1690-Present Frequently Asked Questions (FAQs) What is the U.S. Newspaper Directory? The U.S. Newspaper Directory is derived from the library catalog records created by state institutions during the NEH-sponsored United States Newspaper Program, 1980-2011. This program funded state-level projects to locate, describe (catalog), and selectively preserve (via treatment and microfilm) historic newspaper collections in that state, published from 1690 to the present. Under this program, each institution created machine-readable cataloging (MARC) records via the Cooperative ONline SERials Program (CONSER) for its state collections, contributing bibliographic descriptions and library holdings information to the Newspaper Union List, now included in WorldCat and hosted by the Online Computer Library Center (OCLC). This data, approximately 150,000 bibliographic title entries and hundreds of thousands of library holdings records, was acquired and converted to MARCXML format for use in the Chronicling America U.S. Newspaper Directory. Why are there pages from only certain states? Chronicling America is sponsored by the National Digital Newspaper Program (NDNP). This program, funded by the National Endowment for the Humanities (NEH), awards money to public newspaper archives in each state to digitize and deliver historic newspaper content to the Library of Congress for inclusion in Chronicling America. Cultural heritage institutions within the states apply for the NEH grants. For information on what states are contributing digitized newspapers to the program, see the NDNP Award Recipients*. Eventually, the NEH will fund awards in every state and territory. ** The Library of Congress contributes digitized content from Washington, DC and other significant material. Note: Awardees may select papers to digitize within the time period eligibility of their award. All periods may not be selected or available at this time, but content representing these states and time periods may be scheduled to be added in future updates. When will more pages be available? Chronicling America is updated regularly with additional content received from awardees. NEH hosts an NDNP annual award competition, gradually increasing the content time period and the geographic representation through additional awards. Why does the View Text link on the full Page screen show misspellings and badly-formed words? The View Text option in Chronicling America displays machine-generated text that is produced by Optical Character Recognition (OCR) software. OCR is a fully automated process that converts the visual image of numbers and letters into computer-readable numbers and letters. Computer software can then search the OCR-generated text for words, phrases, numbers, or other characters. However, OCR is not 100 percent accurate, and, particularly if the original item has extraneous markings on the page, unusual text styles, or very small fonts, the searchable text OCR generates will contain errors that cannot be corrected by automated means. Digitization of microfilmed newspapers inherently includes a wide range of image quality in the content (quality derived from the original newspaper, the original newspaper when it was microfilmed and associated deterioration, or the film itself.) Although errors in the process are unavoidable, OCR is still a powerful tool for making text-based items accessible to searching. For example, important concept words often appear more than once within an article. Therefore, if OCR misreads one instance of a key word in a passage, but correctly reads the second instance, the passage will still be found in a full-text search. Why are there variant spellings of counties and cities in the Newspaper Directory Search? The Newspaper Directory data is loaded dynamically from the Chronicling America directory records. Misspellings in place names are the result of typographical errors in the CONSER records and can only be corrected in the original CONSER records hosted by OCLC WorldCat. Please contact a CONSER member (https://www.loc.gov/acq/conser/conmembs.html) with library holdings of that title to request cataloging improvements to these records. Why do diacritics and non-English language characters sometimes appear "Romanized" or not in their original alphabets? The Newspaper Directory provides access to newspaper title records cataloged according to standard bibliographic rules. Until recently, most non-English language characters were difficult to represent in library records and so Romanization - or standard rules for transliterating other alphabets to the Roman alphabet - was used to convey phonetic pronunciations of non-English words. I've discovered a Directory newspaper title record in need of updating or editing, what should I do? Newspaper title information included in Chronicling America is downloaded at regular intervals from the CONSER (Cooperative Online Serials Cataloging) database, made available through OCLC WorldCat. In order to update or edit these records in Chronicling America, please contact a CONSER member (https://www.loc.gov/acq/conser/conmembs.html) with library holdings of that title to request cataloging improvements to the original CONSER/WorldCat records. How do I cite or reference newspaper Directory records and pages for re-use (e.g., in a Web site or other electronic display) or reference (e.g., in a bibliography or journal article) external to Chronicling America? Chronicling America supports persistent links to newspaper Directory records and pages by providing a predictable URL, displayed in the descriptive information for that object. Using the URI Template syntax described in RFC 6570 the links will use the pattern: https://chroniclingamerica.loc.gov/lccn/{lccn}/{date}/ed-{edition}/seq-{image sequence} Where: lccn is the # Library of Congress Control Number for the newspaper date is the date of the issue, specified as yyyy-mm-dd (e.g. 1902-01-30) edition is the edition number for that date (e.g. 1) seq is the image sequence number (e.g. 23) for that issue. For example: https://chroniclingamerica.loc.gov/lccn/sn84026749/1903-01-08/ed-1/seq-2 When describing Chronicling America as the source of content, please use the URL and a Web site citation, such as "from the Library of Congress, Chronicling America: Historic American Newspapers site". How to View Images of historic newspaper pages, as well as uncorrected page text, are displayed through your web browser. However, Chronicling America also contains high-resolution images (JPEG2000) and enhanced text (PDF) that may require special viewers. Most viewers can be downloaded free from vendor sites. The links below explain the various formats used and how to access them. Download and View Pages Offline PDF (Portable Document Format, .pdf) Used for page images Adobe Acrobat Reader Adobe text-only download page - Sample PDF- About this sample JPEG2000(.jp2) - Wavelet compression technology - Tiling supports decompression of only that portion of the image requested by the user - Compression ratio is approximately 20:1, depending on image content and color depth Windows: - ERDAS ER Viewer - Kdu_show - IrfanView with JPEG2000 plug-inOS X:Preview supports baseline JP2 only; commercial software may be needed to view tiled JP2 files, such as those in Chronicling America. - Sample JPEG2000 page - About this sample Some Web browsers incorrectly assume that QuickTime (automatically included with the browser software) can display a JPEG2000 image (JPEG2000, or .jp2, is not a "native" Web format.) To counteract this effect, download the JPEG2000 (JP2) image by "right-click*quot;-ing with the mouse on the image link --e.g., "JP2 (4.0 Mb)". In the dialog box that appears, you will see "Save Link As..." or "Save Target As..." (depending on the Web browser used). Selecting this option will result in downloading the image to your desktop for further review. To view the JPEG2000 (.jp2) file you will need a JPEG2000-friendly software, such as those listed above. Basic Searching in Chronicling America Chronicling America provides access to historic newspaper pages digitized under the NEH/LC National Digital Newspaper Program (NDNP). For more information on the scope and content of the program, click here (https://www.neh.gov/projects/ndnp.html). Search Chronicling America to find information on persons, places, or events; specific topics or news of the day; concepts or ideas; unique passages of text, such as the source of a frequently-quoted phrase. Users of Chronicling America have the option of performing basic or advanced searches. The basic search box is designated as the blue Search Pages tab and is found on many of the pages of the site. Basic search options are limited to state, time period, and key words located near each other. The basic search returns all supported languages. For basic searches, results listed first are most likely to be relevant to your search. Results will appear higher in the list when they contain exact matches of your search terms; more of your search terms; repeated search terms; search terms that occur near each other. Your searches will yield better results if you keep the following points in mind: Common words such as and, not, and the are ignored by the search engine. Case of letters is ignored. For example, Civil and civil are treated the same. Diacritic characters (accent marks, in non-English text) and other special characters produce inaccurate results, so plain (unaccented) letters should be substituted for letters with diacritics. Chronicling America's search engine utilizes language-specific dictionaries to include word variants for your search terms. This is often called stemming. For example, the search term house, when stemmed in English, would also return words like houses and housing. For more search options, see Advanced Searching in Chronicling America below. For information about language support in Chronicling America, see Searching by Language in Chronicling America. Advanced Searching in Chronicling America To make the most of searching this text, take advantage of the search options provided on the Search page. To limit your search to particular geographic area, select one or more States. Or, you can limit your search to a particular newspaper, or select several newspapers, picked from the list of titles currently available in Chronicling America. In addition or alternatively, you can search the entire date range available (default), or select a specific date and limit your search to a specific year, month, or even day, using the begin date and end date lists provided. (Note: selecting the same begin month/day/year and end month/day/year will provide links to every page available for that specific date.) In addition or alternatively, enter a specific search term or terms in the Keyword boxes provided. The operators provided will influence the results of your search significantly and can be used in separate searches or in conjunction within a single search. Search for a Phrase Select the Advanced Search tab and enter your phrase in the appropriate "...with the phrase" search box. When searching for a phrase, enter the words in the order they are most likely to occur. The order of search words does not affect the scope of the search results, but it will affect the order of their display. Search for Words Near Each Other Select the Advanced Search tab and enter your keywords into the "...with the words" search box. Select a numeric value for how close the words should be to each other (proximity). This type of search can be helpful in narrowing results on a given person, place or event to a specific aspect of that person, place or event. For example: "Roosevelt conservation" within 10 words will result mostly in articles about President Theodore Roosevelt's Conservation policies during his administration. Too Many Results - If a search generates too many results, try using more specific terms and/or limiting to a specific State of publication or a particular newspaper title. Use the search box options in combination to narrow your results. For example, use "President Roosevelt" as phrase and "Roosevelt conservation" within 10 words to narrow results to text about only President Roosevelt's conservation policies. Too Few Results - If a search generates too few results, try alternate terms or broader subjects and relax any limiting criteria (date ranges, state limitations, etc.). Because language changes, be sure to use search terms used at the time the materials were created, even if those terms are now obsolete. For example, the following historic terms will produce more results than their modern-day counterparts: Modern Usage vs. Historic Usage comparison table Modern Usage Historic Usage gas, service station filling station African American Afro American, Negro voting rights suffrage Use the names of towns, landmarks, bridges, buildings, and other geographic features that were current when the materials you are searching were created. For instance, the state of Oklahoma was referred to as both "Indian Territory" and "Oklahoma Territory" prior to its admission as a state, so searching for "Indian Territory" may produce more search results if searching on topics related to Oklahoma. Matching a phrase can be useful for searching place names or when common words have a particular sense used in combination. For example, the term "normal school" was used in the early twentieth century to describe schools for training teachers. Searching for the phrase may eliminate results containing the words "normal" and "school" in unrelated ways. Note: Some very common words, such as and, of, the, a, and to, are ignored even when matching exact phrases. Search and Browsing Tips Many browsers have the capability of tabbed browsing, which opens a new pane in the current window, '''
