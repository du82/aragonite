title = "About Chronicling America « Chronicling America « Library of Congress"
description = "Search America's historic newspaper pages from 1756-1963 or use the U.S. Newspaper Directory to find information about American newspapers published between 1690-present."
full_description = '''Search America's historic newspaper pages from 1756-1963 or use the U.S. Newspaper Directory to find information about American newspapers published between 1690-present. Chronicling America is sponsored jointly by the National Endowment for the Humanities external link and the Library of Congress. Learn more Pages Available: { title: 'About Chronicling America', download_links: [ { link: 'https://www.loc.gov/rss/ndnp/ndnp.xml', label: 'application/rss+xml', meta: 'News about Chronicling America - RSS Feed', }, ] } Chronicling America About Chronicling America About the Site and API Recommended Topics Maps and Visualizations Help More Resources National Digital Newspaper Program NDNP Award Recipients Newspaper and Current Periodicals Reading Room Ask LC Newspaper & Current Periodicals Librarian Historic Newspapers on Flickr external link(part of the LC Flickr Commons photostream) About Chronicling America Introduction Chronicling America (ISSN 2475-2703) is a Website providing access to information about historic newspapers and select digitized newspaper pages, and is produced by the National Digital Newspaper Program (NDNP). NDNP, a partnership between the National Endowment for the Humanities (NEH) and the Library of Congress (LC), is a long-term effort to develop an Internet-based, searchable database of U.S. newspapers with descriptive information and select digitization of historic pages. Supported by NEH, this rich digital resource will be developed and permanently maintained at the Library of Congress. An NEH award program will fund the contribution of content from, eventually, all U.S. states and territories. More information on program guidelines, participation, and technical information can be found at https://www.neh.gov/projects/ndnp.html or https://www.loc.gov/ndnp/. Building the Digital Collection Jump to: U.S. Newspaper Directory Supplemental Description Selected Digitized Newspaper Pages Preservation Data Repository and Dissemination Application Related Resources Rights and Reproductions U.S. Newspaper Directory The U.S. Newspaper Directory records are derived from the library catalog records created by state institutions during the NEH-sponsored United States Newspaper Program (https://www.neh.gov/projects/usnp.html), 1982-2011. This program funded state-level projects to locate, describe (catalog), and selectively preserve (via treatment and microfilm) historic newspaper collections in that state, published from 1690 to the present. Under this program, each institution created machine-readable cataloging (MARC) via the Cooperative ONline SERials Program (CONSER) for its state collections, contributing bibliographic descriptions and library holdings information to the Newspaper Union List, hosted by the Online Computer Library Center (OCLC). This data, approximately 150,000 bibliographic title entries as well as library holdings records created under USNP, was acquired and converted to MARCXML format for use in the U.S. Newspaper Directory. Contact a CONSER member for updates and corrections to bibliographic records (see https://www.loc.gov/acq/conser/conmembs.html ) through CONSER. The U.S. Newspaper Directory bibliographic records are updated annually from the CONSER dataset hosted by OCLC. Top Supplemental Description In addition to standardized description based on existing cataloging records, newspapers that have been selected for digitization by NDNP state partners are accompanied by supplementary description (also known as “title essays”). These essays contain basic information about the paper, including: place of publication (if not already evident); dates and schedule of publication (e.g., weekly, daily, morning, or evening); geographic area covered and circulation statistics; political, religious, or other affiliation and reason for publication; specialized audiences; physical attributes; changes in name, format, and ownership. In addition, title essays usually discuss: editors, publishers, or reporters of note; significant events covered by the paper in the relevant time period (a short quote from the paper itself can help provide a sense of the paper's voice); special features such as poetry or fiction, women’s section, sports, society, etc.; relationships with other area newspapers; innovations or advances in newspaper production and technology. These brief essays appear as part of the descriptive title information, NDNP state partners research and write these essays specifically for Chronicling America. The Division of Preservation and Access of the National Endowment of the Humanities review the essays as part of the NDNP partnership. The essays are intended as starting points for additional research and understanding of the historical role of each newspaper. Newspapers that have title essays are identified in the All Digitized Newspapers list where the “More Info” value is “Yes.” The content of the essays can be searched through the U.S. Newspaper Directory search form, using the “keyword” search. Results will link to records that include those keywords. Historical newspapers reflect the language and attitudes of their time, and may contain biased, offensive, and outdated words and images that may be hurtful to particular groups or people. In the title essays, writers strive to avoid this language in supplemental text and only include these terms where it is deemed necessary to understanding the context in which the newspaper was produced. Title essay authors only use such language in the title of the newspaper, the name of an affiliated organization, part of the self-identification of a person or group, or if we are directly quoting from the newspaper. Even then, the title essays only include these terms if the author deems it necessary to understanding the context in which the newspaper was produced. Top Selected Digitized Newspaper Pages The Library of Congress presents the cultural output of the United States in all its diversity. Our collections and the materials we present online speak for their creators, not for the Library or the United States government. In particular, historical materials should be understood in the context of their particular time and place. Each NDNP participant receives an award to select and digitize approximately 100,000 newspaper pages representing that state's regional history, geographic coverage, and events of note. Participants are expected to digitize primarily from microfilm holdings for reasons of efficiency and cost, encouraging selection of technically-suitable film, bibliographic completeness, diversity and "orphaned" newspapers (newspapers that have ceased publication and lack active ownership) in order to decrease the likelihood of duplicative digitization by other organizations. These newspaper materials were digitized to technical specifications designed by the Library of Congress. These specifications include the following basic elements (profiles describing the full set of specifications can be found at https://www.loc.gov/ndnp/guidelines/) : TIFF 6.0, 8-bit grayscale, 400 dpi, uncompressed, with specified tag values JPEG2000, Part 1; 8-bit component; 6 decomposition layers; 25 quality layers; 8:1 compression; with XML Box with specified RDF metadata Single page PDF with hidden text; downsampled to 150 dpi, using JPEG compression; with XMP containing specified RDF metadata. Single page machine-readable text encoded in ALTO, v. 2.0 XML; in column-reading order (created with Optical Character Recognition). METS XML data objects describing newspaper issues, pages, and microfilm reels; incorporating elements in MODS, PREMIS, and MIX formats. Chronicling America provides access to these digitized historic materials primarily through a Web interface enhanced with dynamic HTML interactivity for magnification and navigation. Searches are available for both full-text newspaper pages and bibliographic newspaper records (the Newspaper Directory). Pages are displayed in JPEG format, dynamically-created from source files on user request and presented through the browser interface using a combination of Javascript, DHTML and AJAX Web programming. Top Preservation Data Repository and Dissemination Application The NDNP repository developed for Chronicling America is based on the Open Archive Information System (OAIS) Reference Model for preservation repository architecture and supported by a variety of modular components to enable long-term sustainability of data ingestion, archival management and data dissemination. The public website is built using the Python programming language, Django Web framework, RDFLib, Apache Solr search server, Apache Web server, and MySQL database engine. For more information, see https://www.loc.gov/ndnp/ or contact [email protected]. Top Related Resources National Endowment for the Humanities - https://www.neh.gov Newspaper and Periodicals Reading Room (Serial and Government Publication Division), Library of Congress - https://www.loc.gov/rr/news/ Collections with Newspapers at the Library of Congress - https://www.loc.gov/newspapers/collections/?st=gallery&sb=title_s List of Awardee Institutions and Web sites https://www.loc.gov/ndnp/listawardees.html Top Rights and Reproductions The Library of Congress believes that the newspapers in Chronicling America are in the public domain or have no known copyright restrictions. Newspapers published in the United States more than 95 years ago are in the public domain in their entirety. Any newspapers in Chronicling America that were published less than 95 years ago are also believed to be in the public domain, but may contain some copyrighted third party materials. Researchers using newspapers published less than 95 years ago should be alert for modern content (for example, registered and renewed for copyright and published with notice) that may be copyrighted. Responsibility for making an independent legal assessment of an item and securing any necessary permissions ultimately rests with persons desiring to use the item. The NEH awardee responsible for producing each digital object is presented in the Chronicling America page display, above the page image – e.g. Image produced by the Library of Congress. For more information on current NDNP awardees, see https://www.loc.gov/ndnp/listawardees.html. For more information on Library of Congress policies and disclaimers regarding rights and reproductions, see https://www.loc.gov/homepage/legal.html Top'''
