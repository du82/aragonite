["https://chrony.tuxfamily.org/news.html"]
title = "chrony – News"
full_description = '8 Oct 2024: chrony-4.6.1 released Enhancements Add ntsaeads directive to enable only selected AEAD algorithms for NTS Workarounds Negotiate use of compliant NTS keys with AES-128-GCM-SIV AEAD algorithm (by default the keys are generated differently than in RFC 8915 for compatibility with chrony server and client versions 4.4, 4.5, and 4.6) Switch to compliant NTS keys if first response from server is NTS NAK 2 Sep 2024: chrony-4.6 released Enhancements Add activate option to local directive to set activation threshold Add ipv4 and ipv6 options to server/pool/peer directive Add kod option to ratelimit directive for server KoD RATE support Add leapseclist directive to read NIST/IERS leap-seconds.list file Add ptpdomain directive to set PTP domain for NTP over PTP Allow disabling pidfile Improve copy server option to accept unsynchronised status instantly Log one selection failure on start Add offset command to modify source offset correction Add timestamp sources to ntpdata report Bug fixes Fix crash on sources reload during initstepslew or RTC initialisation Fix source refreshment to not repeat failed name resolving attempts 5 Dec 2023: chrony-4.5 released Enhancements Add support for AES-GCM-SIV in GnuTLS Add support for corrections from PTP transparent clocks Add support for systemd socket activation Bug fixes Fix presend in interleaved mode Fix reloading of modified sources from sourcedir 9 Aug 2023: chrony-4.4 released Enhancements Add support for AES-GCM-SIV with Nettle >= 3.9 to shorten NTS cookies to avoid some length-specific blocking of NTP on Internet Add support for multiple refclocks using extpps option on one PHC Add maxpoll option to hwtimestamp directive to improve PHC tracking with low packet rates Add hwtstimeout directive to configure timeout for late timestamps Handle late hardware transmit timestamps of NTP requests on all sockets Handle mismatched 32/64-bit time_t in SOCK refclock samples Improve source replacement Log important changes made by command requests (chronyc) Refresh address of NTP sources periodically Request nanosecond kernel RX timestamping on FreeBSD Set DSCP for IPv6 packets Shorten NTS-KE retry interval when network is down Update seccomp filter for musl Warn if loading keys from file with unexpected permissions Warn if source selection fails or falseticker is detected Add selectopts command to modify source-specific selection options Add timestamp sources to serverstats report and make its fields 64-bit Add -e option to chronyc to indicate end of response 31 Aug 2022: chrony-4.3 released Enhancements Add local option to refclock directive to stabilise system clock with more stable free-running clock (e.g. TCXO, OCXO) Add maxdelayquant option to server/pool/peer directive to replace maxdelaydevratio filter with long-term quantile-based filtering Add selection option to log directive Allow external PPS in PHC refclock without configurable pin Don’t accept first interleaved response to minimise error in delay Don’t use arc4random on Linux to avoid server performance loss Improve filter option to better handle missing NTP samples Improve stability with hardware timestamping and PHC refclock Update seccomp filter Bug fixes Fix waitsync command to reconnect when not getting response 16 Dec 2021: chrony-4.2 released Enhancements Add support for NTPv4 extension field improving synchronisation stability and resolution of root delay and dispersion (experimental) Add support for NTP over PTP (experimental) Add support for AES-CMAC and hash functions in GnuTLS Improve server interleaved mode to be more reliable and support multiple clients behind NAT Update seccomp filter Add statistics about interleaved mode to serverstats report Bug fixes Fix RTC support with 64-bit time_t on 32-bit Linux Fix seccomp filter to work correctly with bind*device directives Suppress kernel adjustments of system clock (dosynctodr) on illumos Other changes Switch Solaris support to illumos 13 May 2021: chrony-4.1 released Enhancements Add support for NTS servers specified by IP address (matching Subject Alternative Name in server certificate) Add source-specific configuration of trusted certificates Allow multiple files and directories with trusted certificates Allow multiple pairs of server keys and certificates Add copy option to server/pool directive Increase PPS lock limit to 40% of pulse interval Perform source selection immediately after loading dump files Reload dump files for addresses negotiated by NTS-KE server Update seccomp filter and add less restrictive level Restart ongoing name resolution on online command Bug fixes Fix responding to IPv4 command requests on FreeBSD Fix dump files to not include uncorrected offset Fix initstepslew to accept time from own NTP clients Reset NTP address and port when no longer negotiated by NTS-KE server 7 Oct 2020: chrony-4.0 released Enhancements Add support for Network Time Security (NTS) authentication Add support for AES-CMAC keys (AES128, AES256) with Nettle Add authselectmode directive to control selection of unauthenticated sources Add binddevice, bindacqdevice, bindcmddevice directives Add confdir directive to better support fragmented configuration Add sourcedir directive and "reload sources" command to support dynamic NTP sources specified in files Add clockprecision directive Add dscp directive to set Differentiated Services Code Point (DSCP) Add -L option to limit log messages by severity Add -p option to print whole configuration with included files Add -U option to allow start under non-root user Allow maxsamples to be set to 1 for faster update with -q/-Q option Avoid replacing NTP sources with sources that have unreachable address Improve pools to repeat name resolution to get "maxsources" sources Improve source selection with trusted sources Improve NTP loop test to prevent synchronisation to itself Repeat iburst when NTP source is switched from offline state to online Update clock synchronisation status and leap status more frequently Update seccomp filter Add "add pool" command Add "reset sources" command to drop all measurements Add authdata command to print details about NTP authentication Add selectdata command to print details about source selection Add -N option and sourcename command to print original names of sources Add -a option to some commands to print also unresolved sources Add -k, -p, -r options to clients command to select, limit, reset data Bug fixes Don’t set interface for NTP responses to allow asymmetric routing Handle RTCs that don’t support interrupts Respond to command requests with correct address on multihomed hosts Removed features Drop support for RIPEMD keys (RMD128, RMD160, RMD256, RMD320) Drop support for long (non-standard) MACs in NTPv4 packets (chrony 2.x clients using non-MD5/SHA1 keys need to use option "version 3") Drop support for line editing with GNU Readline 20 Aug 2020: chrony-3.5.1 released Security fixes Create new file when writing pidfile (CVE-2020-14367) CVE-2020-14367: Insecure writing of pidfile When chronyd is configured to save the pidfile in a directory where the chrony user has write permissions (e.g. /var/run/chrony - the default since chrony-3.4), an attacker that compromised the chrony user account could create a symbolic link at the location of the pidfile to make chronyd starting with root privileges follow the symlink and write its process ID to a file for which the chrony user doesn’t have write permissions, causing a denial of service, or data loss. This issue was reported by Matthias Gerstner of SUSE. 14 May 2019: chrony-3.5 released Enhancements Add support for more accurate reading of PHC on Linux 5.0 Add support for hardware timestamping on interfaces with read-only timestamping configuration Add support for memory locking and real-time priority on FreeBSD, NetBSD, Solaris Update seccomp filter to work on more architectures Validate refclock driver options Bug fixes Fix bindaddress directive on FreeBSD Fix transposition of hardware RX timestamp on Linux 4.13 and later Fix building on non-glibc systems 19 Sep 2018: chrony-3.4 released Enhancements Add filter option to server/pool/peer directive Add minsamples and maxsamples options to hwtimestamp directive Add support for faster frequency adjustments in Linux 4.19 Change default pidfile to /var/run/chrony/chronyd.pid to allow chronyd without root privileges to remove it on exit Disable sub-second polling intervals for distant NTP sources Extend range of supported sub-second polling intervals Get/set IPv4 destination/source address of NTP packets on FreeBSD Make burst options and command useful with short polling intervals Modify auto_offline option to activate when sending request failed Respond from interface that received NTP request if possible Add onoffline command to switch between online and offline state according to current system network configuration Improve example NetworkManager dispatcher script Bug fixes Avoid waiting in Linux getrandom system call Fix PPS support on FreeBSD and NetBSD 4 Apr 2018: chrony-3.3 released Enhancements Add burst option to server/pool directive Add stratum and tai options to refclock directive Add support for Nettle crypto library Add workaround for missing kernel receive timestamps on Linux Wait for late hardware transmit timestamps Improve source selection with unreachable sources Improve protection against replay attacks on symmetric mode Allow PHC refclock to use socket in /var/run/chrony Add shutdown command to stop chronyd Simplify format of response to manual list command Improve handling of unknown responses in chronyc Bug fixes Respond to NTPv1 client requests with zero mode Fix -x option to not require CAP_SYS_TIME under non-root user Fix acquisitionport directive to work with privilege separation Fix handling of socket errors on Linux to avoid high CPU usage Fix chronyc to not get stuck in infinite loop after clock step 15 Sep 2017: chrony-3.2 released Enhancements Improve stability with NTP sources and reference clocks Improve stability with hardware timestamping Improve support for NTP interleaved modes Control frequency of system clock on macOS 10.13 and later Set TAI-UTC offset of system clock with leapsectz directive Minimise data in client requests to improve privacy Allow transmit-only hardware timestamping Add support for new timestamping options introduced in Linux 4.13 Add root delay, root dispersion and maximum error to tracking log Add mindelay and asymmetry options to server/peer/pool directive Add extpps option to PHC refclock to timestamp external PPS signal Add pps option to refclock directive to treat any refclock as PPS Add width option to refclock directive to filter wrong pulse edges Add rxfilter option to hwtimestamp directive Add -x option to disable control of system clock Add -l option to log to specified file instead of syslog Allow multiple command-line options to be specified together Allow starting without root privileges with -Q option Update seccomp filter for new glibc versions Dump history on exit by default with dumpdir directive Use hardening compiler options by default Bug fixes Don’t drop PHC samples with low-resolution system clock Ignore outliers in PHC tracking, RTC tracking, manual input Increase polling interval when peer is not responding Exit with error message when include directive fails Don’t allow slash after hostname in allow/deny directive/command Try to connect to all addresses in chronyc before giving up 31 Jan 2017: chrony-3.1 released Enhancements Add support for precise cross timestamping of PHC on Linux Add minpoll, precision, nocrossts options to hwtimestamp directive Add rawmeasurements option to log directive and modify measurements option to log only valid measurements from synchronised sources Allow sub-second polling interval with NTP sources Bug fixes Fix time smoothing in interleaved mode 16 Jan 2017: chrony-3.0 released Enhancements Add support for software and hardware timestamping on Linux Add support for client/server and symmetric interleaved modes Add support for MS-SNTP authentication in Samba Add support for truncated MACs in NTPv4 packets Estimate and correct for asymmetric network jitter Increase default minsamples and polltarget to improve stability with very low jitter Add maxjitter directive to limit source selection by jitter Add offset option to server/pool/peer directive Add maxlockage option to refclock directive Add -t option to chronyd to exit after specified time Add partial protection against replay attacks on symmetric mode Don’t reset polling interval when switching sources to online state Allow rate limiting with very short intervals Improve maximum server throughput on Linux and NetBSD Remove dump files after start Add tab-completion to chronyc with libedit/readline Add ntpdata command to print details about NTP measurements Allow all source options to be set in add server/peer command Indicate truncated addresses/hostnames in chronyc output Print reference IDs as hexadecimal numbers to avoid confusion with IPv4 addresses Bug fixes Fix crash with disabled asynchronous name resolving 21 Nov 2016: chrony-2.4.1 released Bug fixes Fix processing of kernel timestamps on non-Linux systems Fix crash with smoothtime directive Fix validation of refclock sample times Fix parsing of refclock directive 7 Jun 2016: chrony-2.4 released Enhancements Add orphan option to local directive for orphan mode compatible with ntpd Add distance option to local directive to set activation threshold (1 second by default) Add maxdrift directive to set maximum allowed drift of system clock Try to replace NTP sources exceeding maximum distance Randomise source replacement to avoid getting stuck with bad sources Randomise selection of sources from pools on start Ignore reference timestamp as ntpd doesn’t always set it correctly Modify tracking report to use same values as seen by NTP clients Add -c option to chronyc to write reports in CSV format Provide detailed manual pages Bug fixes Fix SOCK refclock to work correctly when not specified as last refclock Fix initstepslew and -q/-Q options to accept time from own NTP clients Fix authentication with keys using 512-bit hash functions Fix crash on exit when multiple signals are received Fix conversion of very small floating-point numbers in command packets Removed features Drop documentation in Texinfo format 16 Feb 2016: chrony-2.3 released Enhancements Add support for NTP and command response rate limiting Add support for dropping root privileges on Mac OS X, FreeBSD, Solaris Add require and trust options for source selection Enable logchange by default (1 second threshold) Set RTC on Mac OS X with rtcsync directive Allow binding to NTP port after dropping root privileges on NetBSD Drop CAP_NET_BIND_SERVICE capability on Linux when NTP port is disabled Resolve names in separate process when seccomp filter is enabled Replace old records in client log when memory limit is re'
