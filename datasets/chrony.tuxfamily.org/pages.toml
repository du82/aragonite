title = "chrony – Mailing lists"
full_description = "There are three mailing lists relating to chrony: chrony-announce is a low-volume list, intended for announcements about new versions and other important news. All messages sent to the chrony-announce list are sent also to the chrony-users and chrony-dev lists. chrony-users is for general user discussions, questions, reporting bugs and so on. chrony-dev is for discussion about development, testing, new features, submitting patches, and so on. Only subscribers can post to the lists. To subscribe to a list, send an email with subscribe as the subject to the corresponding request address listed below. To unsubscribe, send an email with unsubscribe as the subject to the same address. In both cases you will need to reply to a confirmation email that will be sent to you shortly after receiving the request. The reply needs to be sent to the same request address (not the list address!). Hitting reply in your email client should set the address and subject correctly. If you did not get the confirmation email, please check your spam folder. If you have troubles with subscribing or unsubscribing, send an email to listmaster@chrony.tuxfamily.org. List Subscribe/unsubscribe address List address chrony-announce chrony-announce-request@chrony.tuxfamily.org chrony-announce@chrony.tuxfamily.org chrony-users chrony-users-request@chrony.tuxfamily.org chrony-users@chrony.tuxfamily.org chrony-dev chrony-dev-request@chrony.tuxfamily.org chrony-dev@chrony.tuxfamily.org The mailing lists are archived by TuxFamily (updated daily) and The Mail Archive: chrony-announce TuxFamily N/A chrony-users TuxFamily The Mail Archive chrony-dev TuxFamily The Mail Archive"
