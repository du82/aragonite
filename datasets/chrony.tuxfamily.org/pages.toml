 NetBSD and Solaris chronyd forks into two processes. The child process retains root privileges, but can only perform a very limited range of privileged system calls on behalf of the parent. -F level This option configures a system call filter when chronyd is compiled with support for the Linux secure computing (seccomp) facility. In level 1 the process is killed when a forbidden system call is made, in level -1 the SYSSIG signal is thrown instead and in level 0 the filter is disabled (default 0). It’s recommended to enable the filter only when it’s known to work on the version of the system where chrony is installed as the filter needs to allow also system calls made from libraries that chronyd is using (e.g. libc) and different versions or implementations of the libraries may make different system calls. If the filter is missing some system call, chronyd could be killed even in normal operation. -P priority On Linux, this option will select the SCHED_FIFO real-time scheduler at the specified priority (which must be between 0 and 100). On macOS, this option must have either a value of 0 (the default) to disable the thread time constraint policy or 1 for the policy to be enabled. Other systems do not support this option. -m This option will lock chronyd into RAM so that it will never be paged out. This mode is only supported on Linux. -v With this option chronyd will print version number to the terminal and exit. FILES /etc/chrony.conf SEE ALSO chronyc(1), chrony.conf(5) BUGS For instructions on how to report bugs, please visit https://chrony.tuxfamily.org/. AUTHORS chrony was written by Richard Curnow, Miroslav Lichvar, and others."
