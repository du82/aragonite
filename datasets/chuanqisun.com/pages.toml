title = "Sun Chuánqí"
description = "Sun Chuánqí’s home page"
full_description = "The most up-to-date information about me is available at https://chuanqisun.com > Hello world! >My name is Sun. >I create tools for the curious mind. WORK People know me by many roles: developer, designer, artist, and mad scientist. I attempt to bring my sense of business, the pursuit of craftsmanship, and a healthy dose of contrarian thinking to all of my work projects. I put user agency above user experience, advocate for system design over design systems, and thrive in teams that defy boundaries. I currently prototype AI-driven experiences and products at Microsoft. AI Foundry Designing and building computational tools for Human and AI. Details I’ve joined hands with John Maeda to explore, design, prototype, and realize the next generation AI tools. You can read about why I am doing this. LLM HCI Computational Designer 2024+ HITS Microsoft’s knowledge base for product decision makers. Details HITS is a two-sided network for creators and consumers. I draw inspiration from behavioral economics to design mechanisms that bootstrap the ecosystem. The project also honed my skills on creating and maintaining an enterprise-scale design system that balances internal vs. external consistencies and reconciles historical conventions vs. newly formed interaction patterns. HITS taught me invaluable lessons in working with legacy systems: how to prevent the dev team from drowning in technical debt and how to re-platform without disrupting the business. HITS also gave birth to several successful spin-off projects, including a query expression builder, a React and Storybook based email REPL, and a visual programming tool inside FigJam! Read the story about HITS React GraphQL TypeScript JAMStack Knockout Serverless Docker .NET LLM Python Design lead Frontend lead 2020-2024 Dynamics 365 Microsoft’s business application platform. Details Dynamics 365 introduced me to system thinking. Every problem must be solved at the interconnect between the platform team, internal solution teams, partner solution teams, business organization, and business’ customers. I learned valuable lessons in balancing the interests from all of the stakeholders above and designing systems that outlasts the change of people and processes. I used in-browser rapid prototyping to communicate and inform design decisions. I co-authored three design systems that empowered an entire team of frontend engineers. I pioneered an algorithmic color contrasting system and invented an iframe based technique for documenting React components. React TypeScript Angular RxJS Designer Prototyper Frontend engineer 2017-2020 Power BI Microsoft’s Business intelligence solution. Details I was not on the Power BI design team, but through collaboration and mentorship I was introduced to data visualization and infographic design. I devoured the classic designer books by Edward Tufte, Don Norman, Steve Krug, Alan Cooper, and took online courses on typography, color theory, information architecture, and interaction design. This period of learning paved the foundation for my later work as a designer. I learned my first lesson in MV* frameworks. Many great developers selflessly coached me on design patterns, unit and e2e testing, and the cryptic art of debugging CSS when IE support was still a must. I picked up D3.js as my go-to tool for data visualization and pushed the adoption of design systems before Brad Frost popularized the practice. AngularJS D3.js .NET C# Full-stack engineer 2014-2017 Commvault Enable file backup and restore in macOS Finder. Details Commvault is an enterprise-facing data storage service. My internship project aimed to allow file-related operations directly from the OS native menus, similar to what Dropbox offers. Since macOS is known to be strictly locked down, I had to come up with creative ways to “hack” together a solution. Objective-C Intern engineer 2014 Lenovo Stress testing the original ThinkPad X1. Details As a huge fan of the ThinkPad product line, I joined Lenovo when it was preparing to integrate its latest ThinkPad with the upcoming Windows 8. I learned about UEFI, SMBus, and Windows Management Instrumentation. I stress-tested the BIOS module and learned about the error margin the hardware must operate within. C Language Windows 8 ADK Intern engineer 2013 PROJECTS I’m a Human-Computer Interaction nerd. I go to great lengths to create systems, tools, and experiences that are functionally powerful and visually delightful. For these projects I would happily trade in my sleep. osmos::craft Push people to discover, ingest, organize, connect, generate, and share knowledge. Details The project includes a set of apps that share similar goals. A web-based RSS reader running entirely from a GitHub repo. A browser bookmark manager optimized for capture and retrieval speed. A web-based text editor for networked note-taking, self-hostable on any Git repository. (In progress) An all-in-one learning environment that brings together all of the above. The project helped me grow from a consumer of libraries to a creator of them. For this project, I’ve designed a concurrent task scheduler, a WYSIWYG text editor, an HTML templating engine, a DOM diffing and rendering algorithm, an RSS/Atom feed parser, and a unit test framework, all from scratch. I’m currently designing an operation-based conflict-free replicated data type for the TODO app. TypeScript Node.js Docker Author 2018+ View source Poemoji Poetry meets emoji Details Deployed just in time for Halloween, this collaborative game uses QR code to help players build and relay a story in emojis and texts. In the end, LLM interprets the emojis into a spooky poem, and recites it in an eerie voice. I originally implemented the relay mechanism with p2p networking, powered by WebTorrent, but observed issues caused by firewall. The good old URL was after all the most resilient tool for state transfer. LLM Speech synthesis QR code P2P Author 2024 View source Tab Dance Delightful tab management Details In my attempt to make browser tabs easier to manage, I added keyboard affordance to the browser’s built-in tab system, allowing users to select, move, and close tabs without touching the mouse. The design was inspired by my code editor keybindings optimized for VIM. TypeScript Author 2024+ View source Torex Generate types for JSON Details Typed Object Reflection (Torex) is a mini compiler that generates a TypeScript interface for any JSON object. The functionality comes in handy when you need to manipulate arbitrarily large JSON data with LLM generated code. Instead of prompting LLM with the full data that often exceeds the model’s token limit, Torex compresses the data to its schema. I brushed up compiler design skills and practiced test-driven development for Torex. TypeScript Compiler Author 2023+ View source Plexchat High throughput Azure OpenAI Chat Client Details Azure OpenAI API poses complex rate limits for chat completion requests. I built Plexchat to handle bursts of request by saturating the network without exceeding the limits on context window, tokens per minute, and request frequency. It also handles errors and timeout in a sensible way. Plexchat allowed me to gain 10X productivity in prompt engineering where batch processing is often needed. It also equipped me with new knowledge for designing and implementing robust concurrent systems. TypeScript LLM Author 2023+ View source Iter A frontend for Azure OpenAI Chat models. Details I built Iter because Azure’s OpenAI Playground was not conducive to experimentation. Specifically, I wanted an editable and branchable chat history tree and hot-swappable models so I can rapidly explore, iterate, and compare prompts. Since I knew exactly what I needed, I was able to hack the app together in just two days. During this project, the Redux state management concept finally clicked when I was working on the chat history tree. I also learned a great deal about the Streams API and successfully wrapped it in the JavaScript Async Generator to decode and render the chat messages as the server streams them to the client. The scope of the project is quite small, though a little extra work in the future could turn this into a compelling alternative to ChatGPT for prompt engineers. HTML CSS TypeScript React LLM Author 2023+ View source Pixel Pusher Online An MMORPG running inside Figma Details The project exploited the multiplayer API and conflict-free data structure from the popular design tool Figma. The outcome is a pixel-art styled game, with real-time and multiplayer capabilities, running on the canvas inside any Figma file. Figma is not a real game engine. The avatar walk animation is built from scratch using a DIY spritesheets engine, optimized for framerate. The UI is rapidly prototyped as an embedded web app that communicates with the main thread using messages. The project helped me pick up some linear algebra and pixel art design skills. HTML CSS TypeScript Preact Author 2022+ View source Turbo Query for Azure DevOps Instantly search and filter up to 20,000 work items from Azure DevOps. Details My work project, hosted on Azure DevOps, suffered performance issues as it got too large. So I built this browser extension to help my team stay productive at work. The extension stores the entire project into the browser Indexed DB using Dexie.js and provides an instant search experience using an in-memory full-text search engine powered by flexsearch. The biggest technical challenge is to strike the balance between data freshness, search and index performance, network consumption, and offline capability. It took me a while to implement the client/service architecture using the Web Workers API and an IPC abstraction layer, but the 60 FPS search UX in the final product was worth the effort. Web Worker React Indexed DB Author 2022+ View source SpaceMouse Anywhere Use 3Dconnexion SpaceMouse in your favorite design apps. Details This project is my HCI treasure trove. It was challenging to identify the most intuitive direct manipulation model. Based on experiments and user feedback, I built dozens of prototypes with different sensitivity curves and activation thresholds, and evaluated their effectiveness on realistic tasks. The final solution allows simple preference for manipulation target (canvas vs. camera) and offers customization for the power user. Performance is at the center of this driver. The Figma plugin was written with no dependency to reduce CPU and memory load. A “game loop” was implemented from scratch to achieve the bare-metal speed. Smooth interaction was ensured with the requestAnimationFrame API. The SketchUp web extension reverse-engineered a wasm API to simulate mouse and keyboard events. A concurrent buffer algorithm was used to allow mismatched input/output rate. HTML CSS TypeScript Author 2019+ View source Accessifiers A non-profit service to help people discover accessible apps. Details The project is constrained by engineering resource and requires high standards on accessibility. I emphasized reducing complexity of the tech stack so volunteers from diverse backgrounds can feel comfortable when contributing. I promoted plain CSS over CSS-in-JS, semantic HTML with BEM over third party UI toolkits so the app will be, and will remain, accessible despite the ever-changing landscape of frontend frameworks. To facilitate asynchronous collaboration, I improvised a preview system based on GitHub actions so each PR has an immutable URL for sharing. React Storybook HTML CSS JavaScript Volunteer frontend lead 2021+ Clicademy A sandbox for digital marketing students. Details It’s difficult to become a market analyst without real data. It’s difficult to get real data without becoming a market analyst. Clicademy solves this chicken-and-egg problem by creating a self-sustained ecosystem that allows user to generate data while learning analytics. I produced branding assets and led frontend engineering for this project. The constraints posed by the WordPress platform required careful tradeoff between cost of maintenance and brand expression. My rapid prototyping process allowed us to validate the solution against real customers on every step we took. WordPress CTO 2020-2022 OData Filter Builder A library that programmatically builds the OData filter expression for the Azure Cognitive Search API. Details A spin-off project from the HITS product. I enjoyed the challenge in the nitty-gritty of compiler design. The project allowed me to practice test-driven development and architect the system with Object-Oriented design. It was rewarding to see multiple layers of abstraction working in unison to serialize the syntax tree into the correct expression. The library currently powers the search experience in the HITS product. TypeScript Author 2021 View source Switchboard Instant access to Dynamics 365 demo environments. Details Dynamics 365 is a B2B platform that creates apps on-demand for each customer, causing difficulty when designers and PMs need to view their own work. The tool provides a one-click solution to allow instant access to demo environments. The app repurposed browser automation testing tool to co-pilot with human users, eliminating repetitive and error-prone steps. The tool was written from scratch three times, with each iteration learning from its predecessor while exploring new opportunities. Initial version was a CLI. It was fast and nerdy, but became difficult for non-technical users. The second version was a GUI app based on electron. It was intuitive to use but app installation became the bottleneck for adoption. The current version is a cloud service that requires no installation. It has the lowest barrier to entry at the cost of limited integration with the native OS. Node.js Electron Puppeteer Svelte Lit Author 2019+ View source cursors A podcast about culture, design, and business at Microsoft. Details The project considers the producers’ experience as important as the listeners’. I adopted WordPress as a headless CMS for its simple admin experience. The frontend was intentionally decoupled from WordPress to realize a highly custom brutalist design by Jeremy Barnes. I also learned a great deal building an audio player from scratch, and publishing the podcast on iTunes. Headless WordPress HTML CSS JavaScript Web Audio Full-stack engineer 2017-2018 529 Legion Web and print resume for a bike racing team. Details 529 Legion is a mountain bike racing team and community event organizer. Every year 529 Legion presents its achievements and calls for continued support as it renews its sponsorship. I worked with the team manager to design and produce the print resume and the team website for three years in a row. Read the resume (2019) Adobe Illustrator Figma Squarespace HTML CSS Designer 2015-2019 Power Loops The next gen dev experience for Microsoft Power Apps Control Framework. Details The project was a concept demo, inspired by the hot module reloading from webpack."
