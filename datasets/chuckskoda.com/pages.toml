["https://chuckskoda.com/entry/crowdsourced-best-marvel-movie-list"]
title = "technochocolate: crowdsourced best marvel movie list"
full_description = "crowdsourced best marvel movie list After launching a little side project earlier this week to help people determine their list of favorite MCU movies, I realized that the Google Analytics data gave me plenty to analyze, and I started looking it over. To my surprise (though in hindsight, it shouldn’t have been) almost every response was different, like, practically no overlap among the results. This comes down to the fact that there are over 121 quadrillion ways to rank 19 movies. That’s certainly more than I would have guessed off the top of my head, and it definitely went against my expectation that I’d see a strong set of popular rankings. How I formatted the list after each quiz made it easy to isolate when a visitor had actually taken the quiz versus being linked to a shared result. I was able to get a set of every solution after both four thousand and five thousand completed responses. After four thousand results there were still a few movies that were somewhat close after averaging the rankings. By five thousand, the order had stayed the same, but the gaps were only widening between all the movies. It looks like a pretty solid statistical point to call this a crowdsourced result. Infinity War Thor: Ragnarok Captain America: Civil War The Avengers Guardians of the Galaxy Captain America: The Winter Soldier Spider-Man: Homecoming Black Panther Guardians of the Galaxy Vol. 2 Doctor Strange Iron Man Avengers: Age of Ultron Captain America: The First Avenger Ant-Man Iron Man 3 Thor Iron Man 2 Thor: The Dark World The Incredible Hulk I’ve seen a few other ranked lists, but none of them quite jibe with the impressions I’ve been seeing from people online as well as this list. I’m going to go ahead and count this as a successful test, and the idea of turning this into a more generic product for ranking lists of all types is that much more interesting of a prospect. Update: With quizzes taken now 15,000 strong, we have seen a bit of a shift in the results. Notably, Black Panther moved up a few places, which seems to make sense based on the response to that movie. Here’s the latest ranking of the people: Infinity War Thor: Ragnarok Captain America: Civil War The Avengers Black Panther Guardians of the Galaxy Captain America: The Winter Soldier Spider-Man: Homecoming Doctor Strange Guardians of the Galaxy Vol. 2 Avengers: Age of Ultron Iron Man Captain America: The First Avenger Ant-Man Iron Man 3 Thor Iron Man 2 Thor: The Dark World The Incredible Hulk May 10, 2018 at 9:48 pm"
