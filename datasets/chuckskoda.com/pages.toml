title = "technochocolate: crew members sample leafy greens grown on space station"
full_description = "crew members sample leafy greens grown on space station [permalink] Fresh food grown in the microgravity environment of space officially is on the menu for the first time for NASA astronauts on the International Space Station. Expedition 44 crew members, including NASA’s one-year astronaut Scott Kelly, are ready to sample the fruits of their labor after harvesting a crop of “Outredgeous” red romaine lettuce Monday, Aug. 10, from the Veggie plant growth system on the nation’s orbiting laboratory. August 10, 2015 at 11:04 am"
