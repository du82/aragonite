["https://chuckskoda.com/entry/a-thought-on-our-nation"]
title = "technochocolate: a thought on our nation"
full_description = "a thought on our nation Our national crisis isn’t just about people who are overtly involved in hatred and violence. We can be passively involved in other peoples’ suffering. The number of people who feel hated is dwarfed by the number of people who feel forgotten or marginalized. But we can be a part of the solution by reaching out to people who might feel cast aside. Say hello to that friend you haven’t seen in a while. Take a coworker you don’t speak with very often out for lunch. This is what love looks like. It isn’t about chocolate hearts and roses. It’s engaging with other people, and making them know they’re important. I’ll part with a quote from one of my personal heroes, you know him as Mr. Rogers: Knowing that we can be loved exactly as we are gives us all the best opportunity for growing into the healthiest of people. July 8, 2016 at 3:20 pm"
