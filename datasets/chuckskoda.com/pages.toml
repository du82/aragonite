full_description = "ahsoka digital drawing Been spending some time drawing lately. Procreate with an Apple Pencil is just so much fun to work with. Mostly working on Disney characters, but just jumped into Star Wars. Here is an abbreviated process (if you can even call what I did a process) of my latest. It took 26 hours and 20 minutes and 11,202 pencil strokes. February 9, 2021 at 10:56 am Been spending some time drawing lately. Procreate with an Apple Pencil is just so much fun to work with. Mostly working on Disney characters, but just jumped into Star Wars. Here is an abbreviated process (if you can even call what I did a process) of my latest. It took 26 hours and 20 minutes and 11,202 pencil strokes."
