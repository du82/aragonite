title = "About Terry Hodgkinson - Chung Fu Martial Arts"
description = "Terry Hodgkinson with Zhang Fan Shifu on Wudang Mountain"
full_description = "About Terry J. Hodgkinson Sifu Terry J. Hodgkinson is the published author of the book Memoirs of a Wandering Ninja – Walking the Path of Enlightenment. and 43 guided audio meditations. He’s been teaching martial arts and meditation for over 35 years and has owned and operated professional schools for 23 years. As well he has branched out into other helping disciplines and owns Positive Changes Coaching and Hypnotherapy Centre in Toronto for 20 years and is co-founder of Beyond Kung Fu Studios and founder and master educator of Chung Fu Martial Arts & Meditation School. Terry holds a diploma as a Certified Professional Counsellor and is an accredited member of the Complimentary Therapists Accredited Association. He is also is a Certified Master Life Coach and has earned additional certification in the following areas: NLP, Hypnotherapy, Time Line Therapy, Emotional Smarts (intelligence) Coach, Professional Life Coach, Goal Setting Success Coach, CBT (cognitive Behavioural Therapy) Coach, REBT (Rational Emotive Behavioural Therapy) Coach, Mindfulness Life Coach, Happiness Coach, Life Purpose Coach, Health and Nutrition Coach, Chakras and Energy Body Coach and Reiki Master & Teacher Accredited member of the International Reiki Organization. Terry leads group and personal instruction in Toronto, Ontario as well as international retreats. At a reasonable rate, Terry will travel and teach at your event should you require his seminar/workshop expertise or one-on-one coaching. See Terry’s Hodgkinson’s Martial Arts, Yogic & Meditation Experience Terry Hodgkinson with Zhang Fan Shifu on Wudang Mountain Terry Teaching at the World Quantum Energy Medicine Conference Bangalore, India Terry Teaching Student Medical Doctors at Gautam Buddha University in India Terry Hodgkinson Receiving Award for Teaching Qigong at Gautum Buddha University, India Plaque Awarded to at Gautam Buddha University, India Terry J. Hodgkinson teaching at World Quantum Energy Medicine Conference Bengaluru, India Terry recognized for teaching at the World Quantum Energy Medicine Conference Bengaluru, India Plaque awarded to Terry for teaching at World Quantum Energy Medicine Conference Bengaluru, India Terry Hodgkinson Teaches at Corporate Event, North Carolina, USA Terry Teaching at Private School in Bangalore, India Terry Wudangshan (Wudang Mountain), China Terry Hodgkinson Meditation Resort Pune, India Energy Lake Kung Fu Days From left to right: Majid Varasteh, Manny Cunanan, Julio Costa, Terry Hodgkinson, Bayani Pastrana, Danny Occhito, Bernard Vidad. Energy Lake Kung Fu Days In my early twenties, instructor and the assistant manager of the Royal York Road School. Behind me you see candle racks with the 64 Chinese symbols from the I – Ching or Book of Changes. The symbol that has the lit candle is number 52, Ken / Keeping Still, Mountain. Beyond Kung Fu Studios Training with the Broadsword at my school in Meadowvale Qiongzhu or Bamboo Temple in Kunming, China Training at this beautiful temple in China made me feel that I had at some other time been here before Qiongzhu or Bamboo Temple in Kunming, China Training at this beautiful temple in China Qiongzhu or Bamboo Temple in Kunming, China Training at this beautiful temple in China Shaolin Temple, China One of my dreams come true was spending time and demonstrating at the legendary Shaolin Temple Some Great Students at my Beyond Kung Fu Martial Arts School It’s always a pleasure training kids and helping them acquire valuable life skills Meditation Meditation is equally as important as the physical training in martial arts. Without control over the mind the body will manifest a sloppy performance. Stretch It Out Just For Kicks Women’s Assault Prevention Introductory Seminar Teaching ladies how to use some basic but effective self defence techniques Thien Mu Pagoda Temple, Vietnam Training at this temple during my month long motorcycle ride excursion from one end of Vietnam to the other. The only time in my history where I grew a beard. Quan Cong Chinese Temple, Hoi An, Vietnam Another beautiful temple to train at in Vietnam Sifu Jerry Boxer’s School in Ko Chang, Thailand I trained with Sifu Jerry for quite a few years before he passed away from an unsuspecting illness in November of 2014 Painting by Sensei Ed Parker Jr. Thanks to my friend Ed Parker Jr. Sensei for this wonderful painting of me Bodh Gaya, India – Where the Buddha Achieved Enlightenment While one does not have to go to India, the exact place the Buddha got enlightened, it sure was special to be there. Escrima Training Started this in my 20’s with JKD Society then went to the Philippines and studied Nunchaku Rank Testing Student passes her grading test Bo Staff Training The tool/weapon I have studied the longest my martial journey Take Down Demonstrating how to take the roots out from an opponent Wrist Lock Arm Bar Sufi Sam Okonski My Sufi Whirling Meditation teacher and longtime friend in India, affectionally known as Sufi Sam. Student Passes her Rank Test Women’s Assault Prevention Training How to use the palm strike properly Dynamic Simulation Training AKA Pressure Testing With this protective suit ladies are encouraged to hit me as hard as they can testing out their skills for effectiveness Dynamic Simulation Training Young girl hits for real in this simulation. Good thing I have protection. Corporate Seminars With my martial arts, meditation and NLP training I’m often asked to lead seminars for various companies. Here I demonstrate the mindset needed to break through solid concrete. Sensei Bodhi Hanna Kistner My Zen archery teacher who is 87 years young – lives and teaches in India and Hawaii The Top of Angkor Wat in Cambodia Training in Cambodia Qiongzhu or Bamboo Temple in Kunming, China Training at this beautiful temple in China Energy Lake Kung Fu Days Energy Lake Kung Fu Days From left to right: Julio Costa, Satyen Raja, Terry Hodgkinson, Manny Cunanan and Bayani Pastrana That Look After a Great Training Session Training at Sifu Gerry Boxer’s school in Thailand Sifu Jerry Boxer in Thailand I trained with Sifu Jerry whenever I was in Thailand, before he passed away from an unsuspecting illness. Sifu Raj Anand Training with my Tai Chi and Chi Kung teacher in Pune, India Terry Hodgkinson’s Published Book 2009 Memoirs of a Wandering Ninja – Walking the Path of Enlightenment 24 Hour Martial Arts Endurathon Once a year for a number of years we would have any student who wanted to help us raise money for charity take part in a 24 hour training session. Yes there were breaks. Sifu Jerry Boxer in, Thailand Sifu Jerry demonstrating the skills he learned while living in China for many years Guru Makoto Kabayama Makoto is an dedicated long time teacher in Jeet Kun Do – I’ve enjoyed his instruction over the years Sifu Brian Leishman Brian was the founder and head teacher at Energy Lake Kung Fu Studios Grandmaster Olaf Simon Brian Leishman (my combatives teacher at Energy Lake Kung fu) was trained in Grand Master Olaf Simon’s Kung Fu schools. At one time Grand Master Simon held the world record for breaking the most ice. In the second picture you see Chuck Norris, Grandmaster Ed Parker Sr. and (Women unknown) Grandmaster Olaf Simon. Olaf Simon crossed trained in Grandmaster Ed Parker’s Kenpo system and ended up calling his style Moh Kempo. Brian Leishman decided not to use the same name but his teachings are strongly attributed to the Moh Kempo lineage. Chi Zhang one of my Sifus’ on Wudang Mountain China Chi or Andy as he likes to be called excels at a number of Taoist Kung Fu styles. he is also the 26th Generation Master of Dragon Gate Taoism Wudang Kung Fu. Training Dr. Patrick Porter to Defend the Great Wall On a trip where I took 12 students to train in the Taoist Wudang mountains, here is my friend Patrick Porter showing off some of his moves on the Great Wall of China. Soaking in the Energy – Wudang Mountain Purple Cloud Temple Wudangshan, China Zen Archery with Sensei Bodhihanna in India So thankful for having many great teachers around the world. Here I am with my friend Paul Condinho Shifu (at the back) and in the middle our Zen archery Sensei Bodhihanna, who is 87 years young. My Zen Archery Article Published in Italy An article I wrote on my Zen archery sensei was first published in India and then Italy Having Fun on the Great Wall A long time student and Shifu at my martial arts school Paul Condinho and me on in China Taoist Hermit Master Jia Master Jia is a Taoist Hermit sage who live in a cave on Wudang Mountain. Here me and the students I brought to Wudang mountain are lucky to chat with him. Taoist Hermit Master Jia & Terry Hodgkinson Ever since I was a young boy I wanted spend time with a Taoist master hermit who lived in a cave in China. I was lucky enough to do that on my last trip to Wudang mountain. Epic Dual at the Top of Wudang Mountain Ever As I climbed to the top of Wudang mountain where the famous Golden Peak temple is, I was challenged to a dual of epic proportions. The little boy won! 🙂 The Group with Our Kung Fu Sifus’ on Wudangshan Students I took to Wudang Mountain for training with our Gungfu teachers. Check out future retreats on www.TaoJourneys.com With my Teachers in Wudang With Zhang, Chi 张弛 and ZHANG, Fan 张帆 our teachers at the oldest and most respected school on Wudang Mountain in China. Zhang Chi (to my left) is the 26 Generation Master of Dragon Gate Taoist Gungfu. The Great Wall Teaching at Quantum Energy Medicine Conference Bangalore, India Chung Fu Martial Arts Meditation School Logo The traditional Taoist Yin Yang symbol with the Yijing (I Ching) symbol #61, Inner Truth, in the center. This logo conveys the idea that while the world around you is in constant change, you can remain grounded through a deep connection to Inner Truth. “When there is no more separation between this and that, it is called the still point of the Tao. At the still point in the center of the circle, one can see the infinite in all things.” ~ Chuang Tzu . Awarded this Certificate by Brian Leishman After many years of service and dedication helping build out the Energy Lake Kung Fu System into 10 schools and 2 national training centres, before I left. . Terry Hodgkinson Wudang Mountain . See Terry's Martial, Yogic and Meditation Experience"
