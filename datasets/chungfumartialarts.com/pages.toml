["https://chungfumartialarts.com/reviews"]
title = "Reviews - Chung Fu Martial Arts"
description = """
Terry, I just started reading “Think Like a Monk” by Jay Shetty and decided to actually engage in the activities/self-reflections in the book. One of the first is to list some values, their origins, and to evaluate if/how true they are to you. I’m both surprised and not surprised that a lot of my values come from your training when I was a child. I know I was introduced to most of them before, but I strongly remember the lessons as a student of yours. So it’s interesting to me that the actual origins of those values I can’t remember, but I remember learning about them in those Saturday Black Sash classes.
\t\t\t\t\tMonica Blanchette
\t\t\t\t\tLicensed Mental Health Counselor, Registered Drama Therapist, and Certified Prevention Specialist."""
full_description = "Reviews <~ What others are saying Terry, I just started reading “Think Like a Monk” by Jay Shetty and decided to actually engage in the activities/self-reflections in the book. One of the first is to list some values, their origins, and to evaluate if/how true they are to you. I’m both surprised and not surprised that a lot of my values come from your training when I was a child. I know I was introduced to most of them before, but I strongly remember the lessons as a student of yours. So it’s interesting to me that the actual origins of those values I can’t remember, but I remember learning about them in those Saturday Black Sash classes. Monica Blanchette Licensed Mental Health Counselor, Registered Drama Therapist, and Certified Prevention Specialist. As younger men Terry and I met at a Shaolin Kung Fu school. Then Terry taught me Kung Fu. It was a great experience from which I gained many skills and tools that ever since I’ve applied to my life. The physical forms opened a deep appreciation of experiencing controlled body movement. What I learned physically transferred smoothly to other aspects of my life. Meeting and facing my self chief among these. Now, some decades later, I met Terry again to learn Qigong. I find Terry an intuitive and thorough teacher. He carries the lessons of a lifetime of study in martial arts and I respect that he has travelled the world learning. This experience has again touched the wider aspects of my life. Through Qigong I am bringing conscious attention to my inner awareness. I am learning to find quiet within, to open myself and allow ease of flow and creativity to my career and creative pursuits. George O'Neil Ship Skipper, BC Ferries Terry I believe I have already mentioned that meeting you and working with you has been one of the most enriching experiences in my life. Not only was I able to support and maintain my family, but I also received wisdom, advice and tools to apply to my life. Just as meditation when one is new to the practice, learning to be to be my best self, controlling my emotions, being grateful and aware, forgiving and letting go, and consciously set myself free from negativity has been a complex process with ups and downs, but now I know for sure I’m on track to living the life I really want and deserve. I don’t know if you use testimonials, but you can count me in saying, you really have helped me to improve myself and be a better and healthier version of me, and for that, you will forever hold a space in my heart. Jessica Di Eugenio Creative Project Manager, Self Employed Sifu Terry and I go way back … over thirty years. And over the years from my youth until now he has been very poignant in his delivering of empowering and enlightening principals and character – not only in the martial arts but also in how to face the many challenges in life. How often do you meet a martial arts master and medical professional in hypnotherapy and Qigong? … probably once in in a lifetime…at most! Because of Sifu Terry’s unique skillset he is able to penetrate the mind in relation to worldly truths and able to best counsel people well beyond martial defense but yet also in wellness defense… what I would call holistic optimization. Over my youthful years training under Sifu Terry, I was blessed with growth and development through his coaching & training. When reaching young adulthood, I then lived in China where I could experience firsthand the culture and origins of Sifu Terry’s teaching. While in China I kept in touch with him. My 7.5 years living in China maintained if not strengthened my resolve to return to training with Terry when returning to Canada. … And here I am, writing about it as I still benefit from my training with him now! Paul Kearns Corporate Trainer , ClarkMorgan Ltd Terry Hodgkinson’s motivational inspiration comes from abundant experience in overcoming the odds. His exceptional insights on creating a meaningful life are communicated clearly with love and honesty. Terry’s message is both moving and encouraging. Our time together speaking on stage is priceless. Thanks, Terry, you are the best! Anthony Simms NBA player (New York Knicks), and former Captain of the Canadian Olympic Basketball Team., Ambassador Mind Set Coach When I met Terry Hodgkinson in the mid 90’s, I knew there was something special about him. At first I couldn’t put my finger on it. I had met superb martial artists before and encountered dozens of talented therapists, but with Terry there was something more. As we became close business associates and friends, I realized what it was; Terry is authentic. In the world of self-help, there seems to be a new guru or an acclaimed breakthrough every week, but most of these fall short in substance and method. In Terry I found the real deal. He had walked the walk. Terry did his time to earn his illumination. He was not seeking fame. Rather, he was seeking what every one of us is seeking—even if we don’t know it—enlightenment. In recent years, Terry and I spent a lot of time traveling together. Every night he would share story after story and each conversation would end with the same statement from me: “Terry you have to write a book and share these stories with the world.” Terry isn’t the typical martial arts master. He stands well over six feet tall. And if you are ever blessed to attend one of Terry’s seminars, you will feel the confidence that flows from that silent place of power. During my tenure running the world’s largest self-improvement franchise, I would hire Terry three to four times a year to share his experiences with my therapists and owners. I was always pleased with the feedback I received on how Terry could take complex concepts and simplify them into usable pieces of information. When Terry started writing his book, I felt honored that he chose me to review each chapter as it was completed. Having earned a black belt in Taekwondo, I am no stranger to the martial arts. Although I loved my teachers, and they taught me amazing physical and mental skills, what I have read in “Memoirs of a Wandering Ninja” has illuminated my understanding of the deeper concepts of the martial arts. Although many of Terry’s experiences deal in the realm of martial arts, he has put together a philosophical guide that can be appreciated by neophytes and masters alike. Patrick K. Porter, Ph.D. Award-winning author, consultant, successful entrepreneur, and experienced speaker, BrainTap Terry said it best; “You get into martial arts training for one reason, and you stay for another.” I should know, Terry Hodgkinson and I lived at the instructor’s training residence over 35 years ago, and were trained and taught under the same fist art (combatives) and philosophy masters. Long gone are those days when that tall, gangly kid was struggling to get that technique right. Challenged by his developing adolescent body, he kept at those techniques with an unparalleled tenacity. At other times you could see him practicing his seated meditation, day in and day out at his favourite place at the studio. What was most impressive about Terry (at that age) was the way in which he taught and conducted his classes with command and full presence. Terry had that intangible quality destined towards excellence. Historically, the ancient martial artists, ninjas, samurai and Shaolin monks, traditionally were also renowned for their diverse talents. Many were sought out for their expertise in the healing sciences of their day. Terry has kept on with this tradition, forged and developed his career from managing and operating a successful chain of martial arts studios right up to the Positive Changes Wellness Coaching, Meditation and Hypnotherapy Centre he owns and has operated for 21 years now. His attention to detail and quality instruction reveals his mastery. With Terry, you’re getting the real deal. For the past few years I experienced several life challenges that needed attention and insight. Terry has been instrumental in helping me tap into inner resources and assist me at realizing things in greater depth, at times from a different perspective. I am benefiting greatly from his coaching sessions and looking forward to the next level of training in meditation and the internal martial arts. Terry has successfully merged ancient wisdom with today’s self-help sciences and technology. Be sure to read his book “Memoirs of a Wandering Ninja” if you’re considering training martial arts, or listen to his guided meditation audio sessions. I highly recommend these for anyone who is on the path of personal growth and development. Ed Morte Former instructor at Energy Lake Studios, Corporate Chauffeured Service at Liberty Limousine Services Sifu Hodgkinson, I do not know if you remember me, I am Juan Delgado, I received my Black Sash at your school, Beyond Kung Fu Studios Meadowvale, in the year 2002. I do not think I ever got the chance to thank you for that wonderful experience at your school which has helped me thus far, especially in focusing on becoming the best I can be. After that year, I moved to Ottawa, where I finished high school and graduated with High Honours in Architecture at Carleton University in 2010, as well as becoming a top tennis player in Ontario and Canada. At a young age, I also worked extensively in art, and I have been living back home in San José, Costa Rica where I am now dedicating my time to my artistic career. I invite you to see some of my recent paintings on facebook, as well as I am currently ranked one of the top tennis players in my country. I greatly congratulate you on everything you have done, the books, the traveling and great knowledge you have obtained, you have always been a great mentor and leader for me when I started Kung Fu and I will always appreciate that. (I still have that one photo of us when I broke my first wood board – picture below) I am sure you are still dedicating your time to Martial Arts, and if you would like to add me as a friend on facebook to stay in contact that would be great. Many thanks for your time. Juan Manuel Delgado Artist , Juan Manuel Delgado Artistry I first met Sifu Terry over twenty years ago when I joined Energy Lake Kung Fu Studios. I was 8 years old and still remember Terry’s strong presence and energy that he carried with him. I can also remember my little eight year old eyes looking up at Terry who seemed as tall as the CN Tower at the time. After training for 4 years, I later reunited with Terry at his new company and martial arts school “Beyond Kung Fu Studios” in Mississauga. As a struggling teenager going through the trials of adolescence, Terry’s guidance to me at this time helped me get through many obstacles no matter how big or great. Terry’s knowledge and wisdom from his world travels, meditations and martial arts inspire those around him. Although I had a hard time in school Terry helped me succeed in Kung Fu helping me see that successes and breakthroughs in class could also be used as metaphors for life. After completing school and entering my 1st career, I went through a very tough and stressful situation where I lost my confidence. At this time I got in touch with Terry who owned and operated Positive Changes Hypnotherapy and Coaching Centre, where he worked with me through several sessions to retrain my perspectives and confidence. After these sessions, I was more focused and aware of the direction I was heading. I then traveled, met my wife and re-launched my career and now have been running a successful business for over seven years. I am also happy to say that I have been training under Sifu Terry (3rd times a charm!) at Chung Fu Martial Arts and Meditation School for the past seven years. Terry’s guidance and support over the many years I have known him are a true testament to the great person and friend he is. Jamie Wilson Entrepreneur , Body Buster Master Terry Hodgkinson had a profound impact on both my Martial Arts training and my life. His guidance along with teaching methods stressed the importance of having a balanced life, one that combined both physical and spiritual growth. Terry also emphasized how our direct actions influenced our surroundings, and our environment. Coming from a home that was full of perpetual turmoil, Terry provided a positive role model for me. He was someone that practiced restraint, respect, and peace. My training with Terry Hodgkinson taught me not only about Kung Fu, it provided valuable lessons about myself, and insight into my own life. Through Terry I was able to see the value in mastering something and having faith in myself and in the unknown. Learning to question things that we may or may not understand, and seeing things from other points of view, I learned to trust my senses and intuition. Although it has been a few years since I have trained with Terry, I have continued to value the life lessons I learned from him. I also continue to train in Martial Arts and continue to incorporate many of the spiritual practices learned through our meditation sessions. I am indebted to Terry for all he has taught me. Jamie Bradbury Artist , Jamie Bradbury Artistry Terry Hodgkinson has a health centre in Toronto, Canada where he sees clients but he also has clients from all over the world that he coaches from the phone and I am one of them. He is also well traveled and cultured, which I appreciate. Because of Terry’s long time coaching practice as well as being a meditation teacher, hypnotherapist, inspirational speaker and martial arts guru, he is a unique person indeed. I have been receiving coaching and hypnotherapy from Terry for a while now, every week. In my time with Terry, I have come to know him as an intensely intelligent and self aware individual. Always thought I had this great perception being a coach and a leader but Terry helps me to even see further, which I honestly thought impossible. Working with Terry just reiterates HOW important and valuable having a personal coach is! I’ve talked about everything from physical fitness, relationships, business, sex and past pains with Terry, KNOWING it’s safe! When I bring these things to Terry in our sessions, I know I always leave as a better coach myself, a better tool for my own clients. Since I started working with Terry, my intuitive capability has been better tuned when working with clients and team members in my business. I would highly recommend Terry; he’s an amazing individual who is very humble and such a pleasure to work with. Dr. ZoeLena Shuster Shires, USA President and Founder , Katapult Enterprises Last Saturday, I spent the morning meditating under Terry’s guidance. My experience was illuminating. Terry provided an introduction to meditation – he is pure in his word(s) and teaching(s) and this type of teaching can only come from lived experience and wisdom. I will be returning and will learn more. Thanks again Terry. Nita Dayal-Nicholson Clinical Case Manager - Mental Health , Credit "
