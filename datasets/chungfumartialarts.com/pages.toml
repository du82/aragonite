title = "Terry Hodgkinson's Martial, Yogic, Meditation and Coaching Experience - Chung Fu Martial Arts"
description = "Terry Hodgkinson with Zhang Fan Shifu on Wudang Mountain"
full_description = "Terry J. Hodgkinson’s Training Education Terry Hodgkinson’s Evolution in Martial, Yogic, Meditation and Coaching. Terry started training at the age of 12 under Sensei Toky Kamino in Judo. After two years of Judo at age 14, Hodgkinson officially began the second phase of his martial arts development and joined Energy Lake Kung Fu Studios. He began teaching martial arts and meditation at the age of 16. He continued to make steady progress and became a school owner and master instructor over 12 years of uninterrupted, dedicated full-time training. (See certificates). Early on Energy Lake Studios provided two streams of study: combatives and philosophy and later on business development. Terry studied combatives and business development under Brian K. Leishman whose lineage and formal training is attributed to Grand Master Olaf Simon and his Moh Pai Kempo Kung Fu System. (Click to view the Kempo/Kenpo lineage) Brian studied under Phil McAndrews Sifu in Edmonton, Alberta. Formal philosophical training began under Arnold (Bud) Ihlen, who at the time was the philosophy teacher at Energy Lake Studios and introduced Terry to the Yijing (I – Ching Book of Changes) as well as various therapeutic models of healing. To this day, Terry is very appreciative of Mr. Ihlen’s early teachings and continues to remain in contact with him. After leaving Brian Leishman’s Energy Lake Kung Fu Studios, Terry co-founded and opened Beyond Kung Fu Studios (and later founded Chung Fu Martial Arts Meditation School and Tao Journeys). From this time onward he has trained and collaborated with the following teachers: Machado Brothers ( Brazilian Jiu Jitsu) Gokor Chivichyan ( Russian Sambo, Judo) Tony Blauer (Blauer Tactical Systems) Guru Larry Hartsell (Jeet Kun Do) Guru Makoto Kabayama (Jeet Kun Do) Guru Dan Inosanto (Jeet Kun Do) Grandmaster Li from China, Chi Kung, via the Chung Wah Kung Fu System and Master Lee Sensei Brad Jones, Shotokan Karate Master Sensei John Perdikaris, Defendo Course (Bill Underwood) Use of Force Trainers Conference of North America hosted by Peel Regional Police Phil Messina, Modern Warrior Training (Time Framing & Combat Stress Conditioning) Bruce Siddle Founder PPCT Management Systems Roy Bedard’s Close Quarter Defense (Rapid Rotation Baton) Sensei Bill “Superfoot” Wallace Prof. Sylvain Moroney (Grappling Arts Academy Woodbridge) Coach Ron Beer, Shoot Wrestling Canada Sifu Gerry Boxer (RIP) Eagle Wind School Zen Tai Ji, Thailand Sifu Hing Chow, Wudang Gung Fu – Kunming, China Sensei Bodhi Hanna Kistner, Zen Archery – OIMR – Pune, India Sifu Raj Anand, Qigong & Yang-Style Tai Chi – OIMR -Pune, India Sifu Zhang Fan, Turtle Style Kung Fu – Taoist Kung Fu Temple, Wudang Mountain, China Sifu Zhang Chi, Crane Style Kung Fu – 26th Generation Master Dragon Gate Taoist Wudang Kung Fu – Wudang, China Sifu Sat Chuen Hon, Medical Qigong, Dan Tao Center & Institute of Traditional Medicine Sifu Lay Zhang, Dragon, Tiger & Snake Style Tai Chi/Qigong – Dragon Gate Taoist Wudang Kung Fu – Wudang, China Sifu Venerable Seol Jeog Un – Grandmaster Sunmudo – Golgulsa (Zen) Temple, South Korea Mike Garner Sifu – Escrima – Jaguar School – Sabang, Palawan, Philippines ♦ See Terry Sifu’s Kempo/Kenpo lineage Yogic, Meditative and Coaching Experience Terry started training with Lawrence Noyes aka Skanda in 1995, he also trained with Anjali Hill and Russell Scott. Terry’s main practice was Kundalini/Surrender Meditation/Jnana yoga. Jnuna when translated means “Union Due to Pure Knowledge”. ”Lawrence Noyes’ teacher was Charles Burner aka Yogeshwar Muni. Charles Burner’s teacher was Swami Shri Kripalvanandaji, affectionately known to his disciples as Kripalu, “Giver of Grace.” and was of the Pashupata Yoga Lineage . Through this lineage Terry gained extensive experience in: Clearing Obstructions in Mind Sahaja Yoga – Natural Meditation Enlightenment Intensives – Master of Enlightenment Intensive Designation Other experience and accreditations by Terry Hodgkinson Yoga Nidra training with Guru Akhilesh Pandey in Rishikesh, India. Terry also studied Nidra with Nina Saacks from Yoga Awakening Africa. Master Hypnotherapist, Time Line Therapy and NLP Practitioner (See various certificates here). Certified Master Life Coach Diploma in professional counselling and an accredited member of the Complimentary Therapists Accredited Association Professional certification in the following disciplines: Mindfulness Coach Professional Life Coaching Emotional Smarts (intelligence) Coach CBT (cognitive Behavioural Therapy) Coach REBT (Rational Emotive Behavioural Therapy) Coach Time Line Therapy Happiness Coaching Life Purpose Coaching Health and Nutrition Coach Goal Setting Success Coach Chakras and Energy Body Coaching Reiki Master and Teacher and accredited member of Reiki International Organization Terry has spent a significant amount of time studying with Thunder Bear and Red Cloud of the Ojibway (also Ojibwe) First Nations People, who are cherished elders of Sacred Sweat Lodge and Healing Circle Ceremonies. Terry has a deep respect for all of his teachers, especially the ones who walk the path… not just talk the path. While many of the martial art styles Hodgkinson Sifu has trained (and teaches) are very powerful, emphasizing strongly “intention”, Sahaja Yoga, Tao meditation and Mindfulness has its power in the opposite polarity of “yielding”. These two paradoxical disciplines, “intent and yield” ultimately compliment each other and harmonize with the ebb and flow of nature itself. This is known in Taoism as non-action or Wu wei. Terry sifu offers over three decades of wisdom as curriculum for students. His current institute is called Chung Fu Martial Arts & Meditation School and he leads international retreats for anyone who wishes short term immersion into his teachings as well as visiting exotic countries. ♦ What does “Chung Fu” mean? Swami Kripalu aka Giver of Grace with his disciple Charles Burner who created the Enlightenment Intensive Work. Terry Hodgkinson & Lawrence Noyes. Lawrence was the number one disciple and lineage holder under Charles Burner and continues training people to become Masters in the Enlightenment Intensive Work. Terry Hodgkinson received his Masters designation under Lawrence Noyes in 1995. Terry Hodgkinson & Anjali Hill. Terry Sifu took his first Enlightenment Intensive and studied Clearing Obstructions from Mind, Advanced Communication and Relating Skills training with Angali. Grandmaster Olaf Simon held the world record for breaking the most ice. In the second picture: Chuck Norris, Grandmaster Ed Parker Sr., (Women unknown) & Grandmaster Olaf Simon. Olaf Simon crossed trained in Grandmaster Ed Parker’s Kenpo system and ended up calling his style Moh Pai Kempo Kung Fu. Master Brian Leishman of Energy Lake Kung Fu Studios and Terry Hodgkinson Sifu. Leishman trained in Edmonton under Phil McAndrews Sifu in Grandmaster Olaf Simon’s Moh Pai Kempo Kung Fu System. Terry Hodgkinson blessed by Buddhist Monk Tenzing Choerab at Dip Tse-Chok Ling Gompa Monastery located in McLeod Ganj, Dharamsala, India where Terry was honoured in having personal audience with the Dalai Lama. Jerry Boxer Sifu and Terry Hodgkinson Sifu on Koh Chang, Thailand. Terry Hodgkinson Sifu with Zhang Fan & Zhang Chi (Andy Zhang) Sifus at Wudang Tao Kung Fu Academy on Wudang Mountain, China. Zhang Chi aka Andy is the 26th generation Master of the Dragon Gate Taoism Wudang Kung Fu. Terry Hodgkinson Sifu & Bodhihanna Kistner Zen Archery Sensei at OIMR in Pune, India. Read Terry Sifu’s article about Sensei Bodhihanna. Terry Hodgkinson Sifu with Makoto Kabayama Jeet Kun Do Guru. Watch a video interview with Terry and Makoto here. Terry Hodgkinson & Master Hu. Master Hu is a professor of the Yijing (I Ching) and resides on Wudang Mountain (Wudangshan), China. Terry Hodgkinson has studied with Master Hu for multiple years. Terry Hodgkinson Sifu trains with Raj Anand Sifu every year in India Raj Anand Sifu has been living in India for the last 3 decades mostly staying in the Osho International Meditation Resort in Pune. His martial arts training started in the early 70s with Master Raymond Chung who is credited with bringing Tai Chi to the Vancouver, Canada. Raj has also traveled to Taiwan and Mainland China where he trained with various masters furthering a deeper understanding of Tai Chi. He has been practicing martial arts for 40 years but his main focus has always been and continues to be on Tai Chi and Qigong (Chi Gong). Terry Hodgkinson sifu with Taoist hermit Master Jai, who lives in a cave on Wudang Mountain in China.Terry has been fortunate to learn from Master Jai each year over the last 6 years on Wudang Mountain. Terry Hodgkinson learning from Master Zhang Lei, Lay, Wudangshan. Venerable Seol Jeog Un Sunim of the Golgulsa (Zen) Temple in South Korea and Terry Hodgkinson Sifu. Seol Jeog Un Sunim is a Grandmaster in Sunmudo as well as Teakwondo. ‘Sun’, is the way to attain an intuitive illumination of mind and spirit through meditation. ‘Mu’ means “martial” and ‘Do’ means”way”. Mike Garner Sifu and Terry Hodgkinson Sifu at Mike’s school in Sabing Palawan, Philippines. Mike is an expert teacher with escrima sticks. Watch my video interview with Mike Garner in the Philippines. Terry Hodgkinson with Zhang Fan Shifu on Wudang Mountain Terry Teaching at the World Quantum Energy Medicine Conference Bangalore, India Terry Teaching Student Medical Doctors at Gautam Buddha University in India Terry Hodgkinson Receiving Award for Teaching Qigong at Gautum Buddha University, India Plaque Awarded to at Gautam Buddha University, India Terry J. Hodgkinson teaching at World Quantum Energy Medicine Conference Bengaluru, India Terry recognized for teaching at the World Quantum Energy Medicine Conference Bengaluru, India Plaque awarded to Terry for teaching at World Quantum Energy Medicine Conference Bengaluru, India Terry Hodgkinson Teaches at Corporate Event, North Carolina, USA Terry Teaching at Private School in Bangalore, India Terry Wudangshan (Wudang Mountain), China Terry Hodgkinson Meditation Resort Pune, India Energy Lake Kung Fu Days From left to right: Majid Varasteh, Manny Cunanan, Julio Costa, Terry Hodgkinson, Bayani Pastrana, Danny Occhito, Bernard Vidad. Energy Lake Kung Fu Days In my early twenties, instructor and the assistant manager of the Royal York Road School. Behind me you see candle racks with the 64 Chinese symbols from the I – Ching or Book of Changes. The symbol that has the lit candle is number 52, Ken / Keeping Still, Mountain. Beyond Kung Fu Studios Training with the Broadsword at my school in Meadowvale Qiongzhu or Bamboo Temple in Kunming, China Training at this beautiful temple in China made me feel that I had at some other time been here before Qiongzhu or Bamboo Temple in Kunming, China Training at this beautiful temple in China Qiongzhu or Bamboo Temple in Kunming, China Training at this beautiful temple in China Shaolin Temple, China One of my dreams come true was spending time and demonstrating at the legendary Shaolin Temple Some Great Students at my Beyond Kung Fu Martial Arts School It’s always a pleasure training kids and helping them acquire valuable life skills Meditation Meditation is equally as important as the physical training in martial arts. Without control over the mind the body will manifest a sloppy performance. Stretch It Out Just For Kicks Women’s Assault Prevention Introductory Seminar Teaching ladies how to use some basic but effective self defence techniques Thien Mu Pagoda Temple, Vietnam Training at this temple during my month long motorcycle ride excursion from one end of Vietnam to the other. The only time in my history where I grew a beard. Quan Cong Chinese Temple, Hoi An, Vietnam Another beautiful temple to train at in Vietnam Sifu Jerry Boxer’s School in Ko Chang, Thailand I trained with Sifu Jerry for quite a few years before he passed away from an unsuspecting illness in November of 2014 Painting by Sensei Ed Parker Jr. Thanks to my friend Ed Parker Jr. Sensei for this wonderful painting of me Bodh Gaya, India – Where the Buddha Achieved Enlightenment While one does not have to go to India, the exact place the Buddha got enlightened, it sure was special to be there. Escrima Training Started this in my 20’s with JKD Society then went to the Philippines and studied Nunchaku Rank Testing Student passes her grading test Bo Staff Training The tool/weapon I have studied the longest my martial journey Take Down Demonstrating how to take the roots out from an opponent Wrist Lock Arm Bar Sufi Sam Okonski My Sufi Whirling Meditation teacher and longtime friend in India, affectionally known as Sufi Sam. Student Passes her Rank Test Women’s Assault Prevention Training How to use the palm strike properly Dynamic Simulation Training AKA Pressure Testing With this protective suit ladies are encouraged to hit me as hard as they can testing out their skills for effectiveness Dynamic Simulation Training Young girl hits for real in this simulation. Good thing I have protection. Corporate Seminars With my martial arts, meditation and NLP training I’m often asked to lead seminars for various companies. Here I demonstrate the mindset needed to break through solid concrete. Sensei Bodhi Hanna Kistner My Zen archery teacher who is 87 years young – lives and teaches in India and Hawaii The Top of Angkor Wat in Cambodia Training in Cambodia Qiongzhu or Bamboo Temple in Kunming, China Training at this beautiful temple in China Energy Lake Kung Fu Days Energy Lake Kung Fu Days From left to right: Julio Costa, Satyen Raja, Terry Hodgkinson, Manny Cunanan and Bayani Pastrana That Look After a Great Training Session Training at Sifu Gerry Boxer’s school in Thailand Sifu Jerry Boxer in Thailand I trained with Sifu Jerry whenever I was in Thailand, before he passed away from an unsuspecting illness. Sifu Raj Anand Training with my Tai Chi and Ch