title = "Chung Fu? - Chung Fu Martial Arts"
full_description = "Chung Fu 中孚 (zhōng fú) is the english translation from old Chinese meaning “Inner Truth”, written in the ancient Chinese classic book called the I Ching (Yijing), or Book of Changes. The Wilhelm and Baynes addition is a comprehensive and complicated rendering of the old Chinese original classic. There are three sections to the book and 64 hexagrams or wisdom changes. Hexagram #61 is called Chung Fu / Inner Truth. Each hexagram consists of 6 lines that can be solid or broken. Inner Truth Hexagram lines appear like this: As one of the last principles in the Book of Changes, the development of Inner Truth is perhaps the core message of this entire book. Like Kung Fu which carefully develops the physical and mental in harmony, Chung Fu has a similar message about how the inner and outer worlds align. In life there is a great opportunity to peel away the layers of conformity that keep us from being who we are meant to be or who we truly are before all conditioning. Inner Truth is a perspective where we stand upon the firm soil of our true nature and observe events for how they are coaxing our inner nature forward. The Yin Yang ( 陰陽 yīnyáng “dark–bright”) meaning in ancient Chinese philosophy, describe how everything in the universe consists of two forces that are opposing but complementary, interconnected, and interdependent in the natural world. According to yin yang philosophy the universe, and everything in it, is both constant and cyclical. One force dominates and then it is replaced by the opposing force. This activity continues constantly and repeats itself over time. Examples illustrating the philosophy of yin yang include: ♦ Life and death ♦ Heaven and earth ♦ Night and day ♦ Dark and light ♦ Health and sickness ♦ Expansion and contraction ♦ Cycle of the seasons – cold to hot or rain to dry Etc. These are all thought of as physical manifestations of the duality symbolized by yin and yang. This duality lies at the origins of many branches of classical Chinese science and philosophy, as well as being a primary guideline of traditional Chinese medicine, and a central principle of different forms of Chinese martial arts and exercise, such as baguazhang, taiji (t’ai chi), and qigong (Chi Kung), as well as appearing in the pages of the ancient Book of Changes called I Ching (Yijing). Duality is found in many belief systems, but Yin and Yang are parts of a Oneness that is also equated with the Tao or the Way. This inseparable and interpenetrating relationship is reflected in the form of the Yin-Yang symbol. The small dots within each of the two energies (represented by black and white) symbolize that there is always some Yin (black) within Yang (white) and vice versa. No matter where you bisect the diameter of the whole circle, each half will always contain some Yin and some Yang. Nothing is absolute with Yin and Yang. The designation of something as Yin or Yang is always relative to some other thing. For example, day is Yang, yet within every day is a Yang part—the early morning, and a Yin part—late day, as it begins to turn to night, which is Yin. Everything has both yin and yang aspects, for instance, shadow cannot exist without light. The Yin Yang ( 陰陽 yīnyáng “dark–bright”) meaning in ancient Chinese philosophy, describe how everything in the universe consists of two forces that are opposing but complementary, interconnected, and interdependent in the natural world. According to yin yang philosophy the universe, and everything in it, is both constant and cyclical. One force dominates and then it is replaced by the opposing force. This activity continues constantly and repeats itself over time. Examples illustrating the philosophy of yin yang include: ♦ Life and death ♦ Heaven and earth ♦ Night and day ♦ Dark and light ♦ Health and sickness ♦ Expansion and contraction ♦ Cycle of the seasons – cold to hot or rain to dry Etc. These are all thought of as physical manifestations of the duality symbolized by yin and yang. This duality lies at the origins of many branches of classical Chinese science and philosophy, as well as being a primary guideline of traditional Chinese medicine, and a central principle of different forms of Chinese martial arts and exercise, such as baguazhang, taiji (t’ai chi), and qigong (Chi Kung), as well as appearing in the pages of the ancient Book of Changes called I Ching (Yijing). Duality is found in many belief systems, but Yin and Yang are parts of a Oneness that is also equated with the Tao or the Way. This inseparable and interpenetrating relationship is reflected in the form of the Yin-Yang symbol. The small dots within each of the two energies (represented by black and white) symbolize that there is always some Yin (black) within Yang (white) and vice versa. No matter where you bisect the diameter of the whole circle, each half will always contain some Yin and some Yang. Nothing is absolute with Yin and Yang. The designation of something as Yin or Yang is always relative to some other thing. For example, day is Yang, yet within every day is a Yang part—the early morning, and a Yin part—late day, as it begins to turn to night, which is Yin. Everything has both yin and yang aspects, for instance, shadow cannot exist without light. When there is no more separation between this and that, it is called the still point of the Tao. At the still point in the centre of the circle, one can see the infinite in all things. When there is no more separation between this and that, it is called the still point of the Tao. At the still point in the centre of the circle, one can see the infinite in all things. I Ching, DNA Binary & Fractals"
