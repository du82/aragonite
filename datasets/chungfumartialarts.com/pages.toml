["https://chungfumartialarts.com/energy-lake-studios-certificates"]
title = "Energy Lake Studios Certificates - Chung Fu Martial Arts"
full_description = "Energy Lake Kung Fu Training Certificates Terry Hodgkinson is the published author of the book Memoirs of a Wandering Ninja – Walking the Path of Enlightenment. He’s been teaching martial arts and meditation for over 40 years and has owned and operated professional schools for 23 years. Sifu also owns Positive Changes Coaching and Hypnotherapy Centre in Toronto for 25 years and is the co-founder of Beyond Kung Fu Studios and founder of Chung Fu Martial Arts & Meditation School. Hodgkinson is a corporate trainer and is often called on to be a keynote speaker and an expert for TV programs. While living in Toronto, Canada Terry took many sabbaticals to the Far East where he developed an in-depth understanding of East-West training and philosophy. Terry leads group and personal instruction in Toronto, Ontario as well as international training retreats. Starting Certificates These three certificates are from when I was a student, starting the training at age 14 and before entering the Instructor’s Training Program. The green certificate overlaps however. Notice the time difference between obtaining each rank. Yellow belt rank secured on October 10th, 1981. It took over a year to achieve my yellow belt and I failed two tests before my successful third testing. I never said I was the fastest but I did demonstrate perseverance. Orange was the next rank obtained on August 5th. 1982. Almost another year after obtaining my yellow rank. Green rank, (all three levels) was achieved on December, 18th, 1986, that’s 4 years after my orange rank achievement. The purpose of me pointing this out is to show how important it is to train for the right reasons. It’s not just the rank I wanted to accomplish it was the perfection of the art, skill and philosophy. Specialty Skill Certificates These certificates are for skills perfected in a specialized areas. They display that I am trained and certified in said areas to utilize my skills for group instruction, private instruction, seminars, workshops and public demonstrations. Instructors Art of Form – The art and skill of precision and finesse as related to the principle of form, or what I call biomechanics. Instructors Art of Breaking – The art and skill of breaking boards or cement patio stones. Instructors Self-Defence Level One – The application of effective self-defence theory and techniques Instructors Self-Defence Level Two – The application of advanced self-defence theory and techniques Instructors Art of Meditation – Breathing awareness – later in my own studies I would find out it’s traditionally called Samatha Yellow Belt to Black Stage One These certificates were awarded in the achievement of each belt to black belt. In essence at “stage one” you would still be considered a novice, but one who has attained great knowledge. Stage One is the first time being tested for each of these belts and so it’s considered a solid step and the completion to the beginning of your martial arts journey. Now the student has the proper base that enables him/her to train towards mastery. All certificates are dated October 1st, 1991 as this was the final date of testing, passing and being recognized at the highest rank in accomplishing all “Three Stages”. Yellow Belt 2. Orange Belt 3. Green Level One Belt 4. Green Level Two Belt 5. Green Level Three Belt 6. Blue Level One Belt 7. Blue Level Two Belt 8. Blue Level Three Belt 9. Brown Level One Belt 10. Brown Level Two Belt 11. Brown Level Three Belt 12. Black Belt Yellow Belt to Black Stage Two These certificates were awarded in the achievement of each belt to black belt in the testing and consistent demonstration to a higher level of quality. In essence, you would be considered a disciple (one who demonstrates expert level of knowledge and has practiced greatly) at “stage two“. All certificates are dated October 1st, 1991 as this was the final date of testing, passing and being recognized at the highest rank in accomplishing all “Three Stages”. Yellow Belt 2. Orange Belt 3. Green Level One Belt 4. Green Level Two Belt 5. Green Level Three Belt 6. Blue Level One Belt 7. Blue Level Two Belt 8. Blue Level Three Belt 9. Brown Level One Belt 10. Brown Level Two Belt 11. Brown Level Three Belt 12. Black Belt Yellow Belt to Black Stage Three These certificates were awarded in the achievement of each belt to black belt in the demonstration of the highest level of quality. In essence, you would be considered a master (one who has comprehensive knowledge, immense practiced and the ability to apply skills at the highest level) at “stage three“. All certificates are dated October 1st, 1991 as this was the final date of testing, passing and being recognized at the highest rank in accomplishing all “Three Stages”. Yellow Belt 2. Orange Belt 3. Green Level One Belt 4. Green Level Two Belt 5. Green Level Three Belt 6. Blue Level One Belt 7. Blue Level Two Belt 8. Blue Level Three Belt 9. Brown Level One Belt 10. Brown Level Two Belt 11. Brown Level Three Belt 12. Black Belt Other Links See Terry Hodgkinson Sifu’s other certificates See Terry Hodgkinson Sifu’s Kempo/Kenpo lineage A list of teachers Terry Hodgkinson Sifu has trained with"
