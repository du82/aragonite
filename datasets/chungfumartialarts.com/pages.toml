full_description = "Dr. Patrick Porter of BrainTap Fitness podcast interviews Terry Hodgkinson Topics covered include the benefits of mindfulness, the positive changes in brain structure and function brought about by meditation, and Terry’s past meditation series, including: Wandering Ninja Nature Meditations Meditation for the Inner and Outer You Also talked about Terry’s newly released series, Sacred Journeys Meditations, as well as his upcoming series and online course, the 21-Day Mindfulness for Life Program. Swami Krishna Prem introduces Terry at his full day meditation workshop in Toronto. Dr. Patrick Porter of BrainTap Fitness podcast interviews Terry Hodgkinson Topics covered include the benefits of mindfulness, the positive changes in brain structure and function brought about by meditation, and Terry’s past meditation series, including: Wandering Ninja Nature Meditations Meditation for the Inner and Outer You Also talked about Terry’s newly released series, Sacred Journeys Meditations, as well as his upcoming series and online course, the 21-Day Mindfulness for Life Program. Swami Krishna Prem introduces Terry at his full day meditation workshop in Toronto. Terry Hodgkinson receives plaque for teaching Qigong / Tai Chi at Gautam Buddha University in India Terry Hodgkinson receiving plaque for teaching Qigong / Tai Chi at World Quantum Energy Medicine Conference in Bengaluru, India Short Videos of Terry’s Retreats and Teaching More About Terry J. Hodgkinson Interviews with Terry Exercise and your Brain Health Dr. Eckel interviews Terry Hodgkinson picking his brain regarding the correlation between exercise, neurogenesis and neuroplasticity. Click “What the Health” to listen. Sign up to receive our newsletter with helpful hints, useful resources, upcoming events and a free gift. Upon joining you will receive a FREE CHAPTER DOWNLOAD from Terry Hodgkinson’s book, Memoirs of a Wandering Ninja – Walking the Path of Enlightenment. Your email is SAFE. We respect your privacy & would never share your email address. Thank you! Please check you email inbox for the free gift Name Email SUBSCRIBE Sign up to receive our newsletter with helpful hints, useful resources, upcoming events and a free gift. Upon joining you will receive a FREE CHAPTER DOWNLOAD from Terry Hodgkinson’s book, Memoirs of a Wandering Ninja – Walking the Path of Enlightenment. Your email is SAFE. We respect your privacy & would never share your email address. Thank you! Please check you email inbox for the free gift Name Email SUBSCRIBE Personal coaching with Terry Hodgkinson in person or wherever you are via online Feeling stressed out? Experiencing a lack of focus, drive and energy? There are methods available that can help you feel, look and perform so much better. Nature’s wisdom (the Way) has provided us with amazing tools that people all too often don’t know about or make use of. Chung Fu translated into english means “Inner Truth”. Connecting with a deeper wisdom inside can help you solidify your purpose in life and enhance your focus! Terry’s approach, Mind-Body-Spirit Solutions is very unique, he offers personal and group coaching to become the best version you can be. For over 30 years Terry’s students and clients have been making significant and wholesome changes in their lives through his organic, intuitive coaching process. Terry also has a diploma in professional counselling. If you have wanted to enhance the quality of your life but haven’t taken action to do so, there is no time like the present moment! Reach out and contact Terry and through a free 30 minute consultation he will discuss which of the highly effective modalities would be best for you. Terry is a certified Professional Master Life Coach and holds specialty coaching certificates in the following areas: ♦ Mindfulness ♦ Emotional Intelligence ♦ Life Purpose ♦ Goal Setting Success ♦ Health & Nutrition ♦ CBT (cognitive behavioural therapy) ♦ REBT (rational emotive behavioural therapy) ♦ Life Happiness ♦ Chakra and Body Energy Healing Terry is also a certified ♦ Hypnotherapist ♦ NLP ♦ Reiki Master & Teacher ♦ BrainTap Master Trainer He is an accredited member with the International Reiki Organization and a member of the CTAA (complimentary Therapists Accredited Association). Additionally Terry has been teaching Qigong, Tai Chi, self defence, traditional martial arts and Yijing (I Ching) wisdom consulting for over 3 decades. Terry will also travel to your event as a guest teacher or for one-on-one coaching. Contact him for details. Terry J. Hodgkinson C.H. PNLP. C.R.M.T. Certified Master Life Coach Founder and Master Educator, Chung Fu Martial Arts Meditation and Tao Journeys International Retreats Contact Terry to schedule your Free consultation When I met Terry in the mid 90’s, I knew there was something special about him. At first I couldn’t put my finger on it. I had met superb martial artists before and encountered dozens of talented therapists, but with Terry there was something more. As we became close business associates and friends, I realized what it was; Terry is authentic. In the world of self-help, there seems to be a new guru or an acclaimed breakthrough every week, but most of these fall short in substance and method. In Terry I found the real deal. He had walked the walk. Dr. Patrick Porter Therapist / Professor / Business Owner, BrainTap Technologies Click to See What Others Are Saying About Terry Sifu? Discover Harmony Within, Ontario Retreat A 3 Day Forest Bathing Experience at the Stonewoods Sanctuary, Grafton Canada www.TaoJourneys.com Discover Harmony Within Immerse yourself in the ancient practice of Daoist Qigong, mindfulness and forest bathing amidst the serene beauty of Stonewoods, a sprawling 22.5-acre haven of mostly old-growth forest, interlaced with guided footpaths. Whether you are a seasoned practitioner of Inner Arts (yoga, tai chi, meditation) or a newbie, you will gain new inspiration, new insights and simple to implement methods to enhance your life. Guided by – Cindy Stone, M.A., Reg Psychotherapist and Terry Hodgkinson, Master Educator & Coach. They embody over 80 years of combined experience in mindfulness, meditation, and martial arts. As you practice these new skills, you’ll experience a quiet awakening arise, feeling more alive than ever before. Rejuvenate Your Mind, Body, and Spirit – enjoy dips in the saltwater pool, relaxing moments in the hot tub. Or just be in one of the many places perfect for quiet contemplation. Learn more Wudang, China Retreat A Two Week Training Adventure in the Clouds of Sacred, Taoist Wudang Mountains www.TaoJourneys.com Date to be announced: Each year Terry Hodgkinson Sifu leads a two week retreat to the amazing Taoist Wudang Mountains in China. We will also be accompanied by Fan Yang – Chinese Liaison & Retreat Coordinator. Zhang Chi – Sifu at Wudang (China) Tao Gung Fu Academy Zhang Fan – Sifu at Wudang (China) Tao Gung Fu Academy. See the short video to the right for amazing scenery and people we met on last years Wudang adventure trip. For complete details of this amazing retreat please visit: www.taojourneys.com/journey-to-china Rishikesh, India Retreat A Two Week Meditation Journey by the Holy Ganges River & Himalaya Mountains www.TaoJourneys.com Date to be announced: Each year Terry Hodgkinson Sifu leads a trip through India where you will get visit many spiritual places and spend a week in the spiritual city of Rishikdesh. Here by the shore of the Ganga (Ganges) River at the foothills of the mighty Himalayan mountains, you will discover your inner peace and strengthen your life purpose. For details of this amazing retreat visit: www.taojourneys.com/journey-to-india"
