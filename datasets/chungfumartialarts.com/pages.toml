full_description = "Instructors & Associations Terry J. Hodgkinson Founder and Master Educator / Chung Fu Martial Arts Meditation Terry J. Hodgkinson has trained in martial arts for over 4 decades, having extensive experience in multiple martial and healing arts. He started professionally teaching at age 16, has owned and operated schools for most his adult life and offers international retreats as well as training and health coaching online. For a full list of Terry’s martial arts training history, experience and meditation background, click on Learn More. Learn more about Terry Associations Chung Fu Martial Arts School Etobicoke The following is a list of martial arts schools and organizations who choose to promote martial arts in a traditional holistic manner and that we feel are professional and genuine. While Chung Fu Martial Arts School recognizes and has enjoyed a relationship with the following schools, it is up to you the student to do your research and determine if any particular school/style/teacher is the right fit for you. Canada Kabayama Bushidokan Toronto, Ontario Canada Etobicoke Judo Club Etobicoke, Ontario Canada Wilson Martial Arts Streetsville, Ontario Canada Brad Jones Karate Do Newmarket, Ontario Canada Progressive Martial Arts Thunder Bay, Ontario Canada Circle Kung Fu Tai Chi Peterborough, Ontario Canada Zen Tiger Martial Arts Burnaby, British Colombia USA Blue Siytangco Taiji Kung Fu Academy Houston, Texas USA Wilderness Martial Arts Virginia Beach, Virginia USA Inosanto Academy of Martial Arts Marina Del Rey, California USA Gokar Chivichyan North Hollywood, California Costa Rica Kristina Sunmudo – Zen & Martial Arts School – Jacó , Playa Hermosa South Korea Golgulsa Zen Temple – Sunmudo Martial Arts Yangbuk-myeon Gyeongju, Gyeongsang India Osho School for Centering and Zen Martial Arts – Tai Chi, Qi Gong & Zen Archery Pune, Maharashtra Thailand Tiger Muay Thai & MMA Training Camp Muang, Phuket China Wudang Taoist Kung Fu Academy Wudangshan,