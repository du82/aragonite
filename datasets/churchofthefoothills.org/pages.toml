["https://churchofthefoothills.org/what-we-believe"]
title = "What We Believe – Church of the Foothills"
description = "Love Grows Here"
full_description = "What We Believe As a progressive Christian community rooted in the United Church of Christ and Christian Church (Disciples of Christ), we affirm broad theological statements of belief. These statements or affirmations of faith are not tests for being a part of our church. We recognize that faithful people can read scripture and disagree. We value the freedom to ask questions. Doubt is an important part of our faith journey. We believe God is still speaking, and God calls us to work for justice and wholeness in our world. That is the lens through which we challenge one another to keep growing and responding. The statements below are important and beautiful. Our traditions empower each congregation and each individual to do their own thinking, exploration, and dialogue. Thus, we welcome and share our vision of community with people all across the spectrum of faith – or even no faith at all. All are welcome here. United Church of Christ Statement of Faith We believe in God, the Eternal Spirit, Father of our Lord Jesus Christ and our Father, and to his deeds we testify:He calls the worlds into being, creates man in his own image and sets before him the ways of life and death.He seeks in holy love to save all people from aimlessness and sin.He judges men and nations by his righteous will declared through prophets and apostles.In Jesus Christ, the man of Nazareth, our crucified and risen Lord, he has come to us and shared our common lot, conquering sin and death and reconciling the world to himself.He bestows upon us his Holy Spirit, creating and renewing the church of Jesus Christ, binding in covenant faithful people of all ages, tongues, and races.He calls us into his church to accept the cost and joy of discipleship, to be his servants in the service of men, to proclaim the gospel to all the world and resist the powers of evil, to share in Christ’s baptism and eat at his table, to join him in his passion and victory.He promises to all who trust him forgiveness of sins and fullness of grace, courage in the struggle for justice and peace, his presence in trial and rejoicing, and eternal life in his kingdom which has no end.Blessing and honor, glory and power be unto him.Amen.Read more here. Christian Church (Disciples of Christ) Affirmation of Faith We believe in God, the Eternal Spirit, Father of our Lord Jesus Christ and our Father, and to his deeds we testify:He calls the worlds into being, creates man in his own image and sets before him the ways of life and death.He seeks in holy love to save all people from aimlessness and sin.He judges men and nations by his righteous will declared through prophets and apostles.In Jesus Christ, the man of Nazareth, our crucified and risen Lord, he has come to us and shared our common lot, conquering sin and death and reconciling the world to himself.He bestows upon us his Holy Spirit, creating and renewing the church of Jesus Christ, binding in covenant faithful people of all ages, tongues, and races.He calls us into his church to accept the cost and joy of discipleship, to be his servants in the service of men, to proclaim the gospel to all the world and resist the powers of evil, to share in Christ’s baptism and eat at his table, to join him in his passion and victory.He promises to all who trust him forgiveness of sins and fullness of grace, courage in the struggle for justice and peace, his presence in trial and rejoicing, and eternal life in his kingdom which has no end.Blessing and honor, glory and power be unto him.Amen.Read more here."
year_published = 2025
