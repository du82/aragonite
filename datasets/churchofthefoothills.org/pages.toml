["https://churchofthefoothills.org/worship-wonder"]
title = "Children & Youth – Church of the Foothills"
description = "Love Grows Here"
full_description = 'Children & Youth Ministry "Let the little children come to me. Don’t stop them, because God’s kindom belongs to people who are like these little children." - Matthew 19:14 (NRSV) Jesus welcomed children to him (Mark 10:13-16), and in our church, we love and welcome our young ones of all ages, seeking to nurture them and provide an opportunity to grow in faith. We provide engaging activities, camp scholarships, and grant support for leadership development.And we commit ourselves to the safety of young people through child safety protections and policies. Worship & Wonder (during Sunday worship)On Sunday mornings, our children are engaged through Worship & Wonder, a model of Christian education designed to provide a loving, caring setting to hear the ancient stories of our faith and deepen their relationship with God.After a brief blessing during worship, our children are led out by trained staff and volunteers to the Worship & Wonder room in Davis Hall. Visitors will be asked to register contact information on your first visit, so our teachers can reach out if there are any needs.Worship & Wonder is interactive. During a session, your child will be greeted, sing a song, hear a story, respond to that story, and share in a feast. All stories are rooted in scripture. Your child will be encouraged to walk and talk softly in case someone is talking with God.ReForm (during Sunday worship)Older elementary youth, from grades 5th to 8th, are invited to a conversation and interactive learning experience around big questions of faith. They will work with incredible mentors who guide them in exploring what it means to be a disciple, who Jesus is, and how we are to live and grow.Other Children’s ActivitiesWe offer other ways for young people to engage beyond worship, including an annual Pumpkin Patch event in October, leadership in worship, Youth Sunday, an Easter Egg hunt, summer camps, and many more opportunities. Youth GroupOur middle school and high school youth meet each Sunday at 9:15 AM for reflection, discussion, and other activities. Each student is invited to create a journal and respond to God’s prompting in their lives.Additional youth activities are planned on Saturdays that help us grow our sense of community… and have a lot of fun together.We also offer winter, fall, and summer camp opportunities that surround young leaders in an amazing, loving environment. All campers receive a scholarship from our church if they attend a camp. <img fetchpriority="high" decoding="async" width="800" height="313" src="https://churchofthefoothills.org/wp-content/uploads/2024/12/CampPageBanner-1024x400.jpg" class="attachment-large size-large wp-image-3464" alt="The Pacific Southwest offers camp opportunities for all young people." srcset="https://churchofthefoothills.org/wp-content/uploads/2024/12/CampPageBanner-1024x400.jpg 1024w, https://churchofthefoothills.org/wp-content/uploads/2024/12/CampPageBanner-300x117.jpg 300w, https://churchofthefoothills.org/wp-content/uploads/2024/12/CampPageBanner-768x300.jpg 768w, https://churchofthefoothills.org/wp-content/uploads/2024/12/CampPageBanner-1536x600.jpg 1536w, https://churchofthefoothills.org/wp-content/uploads/2024/12/CampPageBanner-2048x800.jpg 2048w" sizes="(max-width: 800px) 100vw, 800px" data-eio="l" /> <img decoding="async" width="768" height="1024" src="https://churchofthefoothills.org/wp-content/uploads/2024/09/IMG_4445-768x1024.jpeg" class="attachment-large size-large wp-image-3195" alt="" srcset="https://churchofthefoothills.org/wp-content/uploads/2024/09/IMG_4445-768x1024.jpeg 768w, https://churchofthefoothills.org/wp-content/uploads/2024/09/IMG_4445-225x300.jpeg 225w, https://churchofthefoothills.org/wp-content/uploads/2024/09/IMG_4445-1152x1536.jpeg 1152w, https://churchofthefoothills.org/wp-content/uploads/2024/09/IMG_4445-1536x2048.jpeg 1536w, https://churchofthefoothills.org/wp-content/uploads/2024/09/IMG_4445-scaled.jpeg 1920w" sizes="(max-width: 768px) 100vw, 768px" data-eio="l" /> Church SafetyProviding a safe environment for our children, through our preschool and Worship & Wonder, is a priority of our congregation.Some things to expect on a Sunday morning:You and your child will be greeted and invited to provide contact information.During worship, children will be led by at least two adult volunteers to a special space set aside for their worship experience.A nursery is also available and staffed by a paid nursery attendant.A Pray-Ground is also available for families to sit and enjoy worship with their little ones.All volunteers working children will be have background checks and take mandated reporting training, designed to help us identify and report children and youth in potential abusive situations.The rule of three is always in effect – children will never be alone with a single adult.Children must be picked up by their parents or guardians at the end of worship. Read our Church Safety Policy for more information (PDF).'
year_published = 2025
