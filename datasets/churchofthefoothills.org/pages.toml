title = "Church of the Foothills – Love Grows Here"
description = "As we prepare for Easter, expand your understanding of God's love by exploring the parables of Jesus with us and turn the world upside down. Our new series launches on March 9."
full_description = "Love Grows Here Church of the Foothills is a progressive Christian community in North Tustin/Santa Ana, CA, welcoming to all, embracing questions, and committed to work for justice, wholeness, and peace in our community. Worship: Sundays, 10 AM, in-person and onlineWhere we are: 19211 Dodge Ave, Santa Ana, CAAre you new? Read what to expectLearn more about Who We Are and What We Believe New Worship Series As we prepare for Easter, expand your understanding of God's love by exploring the parables of Jesus with us and turn the world upside down. Our new series launches on March 9. Learn More Children & Youth Activities Young people are engaged through prayerful, imaginative, and fun experiences that deepens their connection with God and each other. Learn More Build Relationships Our small group opportunities cultivate deep conversations about scripture, spirituality, and justice. We take action to support neighbors in need. Connect With Us Other Upcoming Events What people say... “All are welcome, regardless of ethnicity, race, sexual orientation, or gender identity,” the pastor said, my first Sunday at CHOTF, 13 years ago. I am blessed to be a part of this inclusive, warmly welcoming, and activist community of faith. Keni Church of the Foothills fills my need for progressive morality. As a Christian, this church community fills what I feel is the justice, love and care presented in the words of Jesus Christ. Sunny We have fun as we do good stuff in the world to care for people and the planet. I see we joyfully worship but take care of each other too when the need arises. I call that walking our talk. David Location 19211 Dodge Ave,Santa Ana, CA 92705 OFFICE HOURS Contact Us Phone : (714) 544-1319 SEND US A NOTE MON -FRI: 9:00 am- 2:00 pm Sunday Service HOURSService time: 10:00 am- 11:15 am Follow Us Facebook-f Instagram"
