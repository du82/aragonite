["https://churchofthefoothills.org/2023/03/31/what-to-expect"]
title = "What to expect at Worship – Church of the Foothills"
description = "Love Grows Here"
full_description = "We welcome all who are curious about Jesus’ vision of abundant life through scripture, study, service, and compassion. Questions are welcome. The communion table welcomes all. In fact, we say that every time we gather. If you are considering visiting us on Christmas Eve, Easter, or a future Sunday, you are welcome. We would love to meet you. Here are some helpful tips about our gathering, our space, and our community. Many churches proclaim a broad welcome, but when you read the fine print, you find that some people are not welcome because of who they love, who they are, or what they believe. We are a church with diverse views on spirituality, faith, and the Bible. It’s a gift to be in conversation and community with people from different backgrounds and places of their spiritual journey (just like Jesus did). Church of the Foothills is an open and affirming church, making an intentional welcome to our LGBTQ+ neighbors and family members who other churches often turn away. Here all really means all, to the best of our ability (since we are always growing and learning). No. We know many in our community have been hurt and harmed by other congregations in the past with pressure tactics. We want you to worship as you feel comfortable. You should not even feel pressure to donate if it is your first time with us. While we practice membership as a spiritual sign (our commitment to care for each other) and for practical purposes (voting on congregational decisions), we typically recognize new members who have already had a private conversation with the pastor at a later time. We have wheelchair ramps, accessible parking spaces, accessible restrooms, and extra room in our sanctuary for those who need it. We encourage everyone to get vaccinated and stay home if you are experiencing COVID-19 symptoms. Mask use is encouraged but not required. Our livestream makes it easy to join us from afar. There is enough space to spread out on some Sundays in our well-ventilated sanctuary."
year_published = 2025
