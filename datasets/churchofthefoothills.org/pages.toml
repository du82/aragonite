["https://churchofthefoothills.org/smallgroups"]
title = "Get Involved – Church of the Foothills"
description = "Love Grows Here"
full_description = '''SMALL GROUPS We have many groups and ministries as we learn and serve together. Click on the titles for more information. Bible 101: Parables of Jesus Our Thursday evening discussion group opens an invitation to explore scripture from many different perspectives. This is not a lecture series but an open-ended time for conversation, questions, and prayer together. Each session begins at 7 PM on Zoom.This group returns on March 6, 2025. Coffee Hours On Thursdays, Rev. Nathan gathers at the Lost Bean in Tustin, CA for open conversation time about anything going on in the life of the church. Each sessions begins at 9 AM and ends around 11 AM. Bring your questions, prayers, and stories. Share a cup of coffee with us. mixed media ministry Mixed Media meets the second Saturday of the month, September through June, except for December, when we don’t meet. It is a fellowship group, where most months we meet for a potluck supper followed by a movie at the Dunlap home at 5 p.m. We also have attended plays and musicals and have gone to exhibits and artistic presentations- a poetry reading, Dead Sea Scrolls, barbershop quartets, etc.Please click on the link to contact Kathy Dunlap to be added to the announcement list. Older Caregiver's Support Group Meeting with a group of peers who are experiencing similar experiences provides an opportunity to share feelings, frustrations and joys in a safe and supportive environment. We learn from each other and support each other. No one has the same experience but everyone needs support!The group meets monthly, the next scheduled gathering is August 9th at 10 am in the Fireside Room at Church of the Foothills (need address).The group is led by a retired Geriatric Social Worker. Please call the church office and the group leader will contact you. Caregivers need support and you are welcome! Anti-Racism Book Club Our Anti-Racism Book Club began a few years ago with a commitment to continue to learn and understanding the impact of racism. Each year, we try to read two books. We just finished “Hidden Conversations” by Michelle Norris. A new book will be selected in September. Each session happens, generally on Zoom, every two weeks, closing out each book reading with an in-person party with lots of discussions and opinions.Click on the link above to sign up for more information. Women's Fellowship On the first Friday of each month, women and guests gather for a time of conversation, lunch, and connection in the Fireside room on campus. Bring your own lunch or something to share. The group is exploring projects to impact our community and grow together. Faith in Action Faith In Action meets at 7 – 8 pm, the first Tuesday of each month via Zoom, (except July). This group celebrates and activates the joy and satisfaction of being involved with issues of Justice in our community and world. We address the needs of the homeless and refugees, the rights of Native Americans, local LGBTQ+ students, lives effected by environmental disasters and more.For more information about current projects and partner organizations, or to be on the email invitation Zoom list, please click on our title above. Choir Praise God with us <img fetchpriority="high" decoding="async" width="800" height="531" src="https://churchofthefoothills.org/wp-content/uploads/2024/05/DSC_2874-1024x680.jpg" class="attachment-large size-large wp-image-2880" alt="" srcset="https://churchofthefoothills.org/wp-content/uploads/2024/05/DSC_2874-1024x680.jpg 1024w, https://churchofthefoothills.org/wp-content/uploads/2024/05/DSC_2874-300x199.jpg 300w, https://churchofthefoothills.org/wp-content/uploads/2024/05/DSC_2874-768x510.jpg 768w, https://churchofthefoothills.org/wp-content/uploads/2024/05/DSC_2874-1536x1020.jpg 1536w, https://churchofthefoothills.org/wp-content/uploads/2024/05/DSC_2874-2048x1360.jpg 2048w" sizes="(max-width: 800px) 100vw, 800px" data-eio="l" /> The Church of the Foothills choir is a dynamic group of singers of all skill levels who lead worship and praise God through music from a variety of different traditions, eras, and styles. We perform special concerts at least twice a year. Soloists are welcome.Rehearsals are on Wednesday evenings in the Fall, Winter, and Spring.The choir is always looking for singers, regardless of your ability, to share in this life-giving and joyful ministry. Meet Our Director of Music Ministries <img decoding="async" width="225" height="300" src="https://churchofthefoothills.org/wp-content/uploads/2023/09/Sammy-225x300.jpg" class="attachment-medium size-medium wp-image-2230" alt="" srcset="https://churchofthefoothills.org/wp-content/uploads/2023/09/Sammy-225x300.jpg 225w, https://churchofthefoothills.org/wp-content/uploads/2023/09/Sammy-768x1024.jpg 768w, https://churchofthefoothills.org/wp-content/uploads/2023/09/Sammy-1152x1536.jpg 1152w, https://churchofthefoothills.org/wp-content/uploads/2023/09/Sammy.jpg 1200w" sizes="(max-width: 225px) 100vw, 225px" data-eio="l" /> Director Sammy Salvador is no stranger to our community as an educator, vocalist, and conductor. He spent time substituting for our previous director in the past. He values our commitment to inclusivity and progressive theology. Click on the title above to learn more about him. Sharing our campus AA meetings We host AA meetings on our campus. AA meetings are if you think you may be an alcoholic or you have a desire to stop drinking. They vary in format, size, and are anonymous. You are not obligated to give any information at an A.A. meeting. Men Alive: OC Men's Chorus Through music, men’s voices unite to entertain, inform, bring healing, joy, friendship and build bridges to the public at large. TG Rainbow TG Rainbow is a gender identity support group meeting on campus. Holy Angels Church An independent Catholic Church, we invite all to experience and share God’s unconditional love. Contact the church office if you are interested in using the campus for an event. Contact us!'''
year_published = 2025
