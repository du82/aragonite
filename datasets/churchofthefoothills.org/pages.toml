["https://churchofthefoothills.org/about"]
title = "About – Church of the Foothills"
description = "We are a movement for wholeness in a fragmented world. Learn more about the Disciples and how we are welcoming all as Christ first welcomed us."
full_description = "Grounded in the love of God, Church of the Foothills welcome all as Christ welcomes us. We are intentionally an Open & Affirming congregation, naming our LGBTQ+ neighbors as fully included at Christ’s table. We especially welcome those who are questioning their faith or deconstructing from toxic faith communities. There is room at the table for you, wherever you and your family are in your journey of faith. Scripture proclaims that God is love (1 John 4:7). We believe that being church is following the way of Jesus, good news that really is GOOD for our neighbors. Every week, we choose to celebrate and live our love, through worship, small groups, good food, and acts of kindness and compassion. The purpose of this Church is to provide an environment open for all to worship God, develop Christian values, share life’s experiences, strive for truth, justice and peace, and respond with compassion to the needs of others. With God’s help, we seek to keep this a Christ-centered Church with a warm and friendly heart, an open mind, and an adventurous spirit. The Bible is an ancient and complex book, rooted in cultures different than our own. It is our guide of faith. We wrestle seriously with scripture but refuse to use the Bible as a weapon to harm others and exclude them from God’s table. We love to listen to many perspectives and voices as we read together. Justice is a way for us to name and participate in a reality where God is fully present. We long for a world free from the sins of violence, racism, hunger, homophobia, and inequality – with God’s help. Do you desire that kind of world too? Church of the Foothills is an intentional merger of two congregations – Church of the Foothills (UCC) and Camille Christian Church (DoC). Each congregation prayerfully discerned a path to join together for a shared purpose – to witness and work for God’s love. This vision is rooted in ancient call of unity that we find in Jesus’ prayer in the Gospel of John that his disciples “may be one” (John 17:21)."
year_published = 2025
