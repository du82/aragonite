["https://chzc.org/five-skandhas-dharma-talk-by-zenki-kathleen-batson.htm"]
title = "The Five Skandhas, a Dharma Talk by Zenki Kathleen Batson"
description = "The Five Skandhas, a Dharma Talk by Zenki Kathleen Batson"
full_description = '''Today I would like to share my recent thoughts about the five skandhas and how, with these five skandhas, a sense of self is constructed. I am not a scholar, just a practitioner. You should always check what I say in relation to your own experiences and understanding. I imagine most of you, like me, first heard of the five skandhas through the Heart Sutra which begins, "Avalokiteshvara Bodhisattva, when practicing deeply the prajna paramita, perceived that all five skandhas in their own being are empty and was saved from all suffering." The Heart Sutra then enumerates the five skandhas. In our translation, we use the five words form, feelings, perceptions, formations, and consciousness. The Heart Sutra teaches that they are all empty. I confess that for a really long time, the skandhas and what they refer to, were pretty impenetrable for me. They just kept glomming all together as an important list of things I was supposed to understand but really didn't. Part of what I appreciated about Zen was the lack of lists. Only recently have I been able to reach into these concepts and tease them apart in a meaningful way. The first place where this teasing apart had an impactful meaning for me was when trying to sit zazen recently with really intense emotion. I found it helpful to stop trying to sit in non-discursive awareness, and I instead used the list of the five skandhas to label what I experienced arising. This created a spaciousness within my mental constructions. The Buddha taught that the five skandhas when clung to are dukkha, suffering. When we experience them without craving and clinging these are moments of awareness, and awareness transforms the experience of the skandhas. With intense emotion, it was easier to notice how it was all arising, what physical sensations and past experiences were contributing, and how the emotions evolved, etc., when I engaged with them in this way. It was possible to look at the process, and notice how without awareness these things would all come together to create a strong sense of self. Watching without clinging allowed a logical compassion to arise. It was an experience of, "Ah, no wonder these emotions and thoughts are arising. No wonder these feelings exist."'''
year_published = 2025
