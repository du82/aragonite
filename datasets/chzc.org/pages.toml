["https://chzc.org/boyle1.htm"]
title = "Rakusu and the Precepts"
description = "Kuden Boyle's talk on the Buddhist Precepts and sewing the Rakusu"
full_description = '''One of the more visible aspects of this receiving the precepts process is the sewing and wearing a rakusu. For those of us, like myself, who suffered from "male sewing anxiety syndrome", sewing a rakusu can become an odyssey in itself. When I was sewing my first rakusu, I could see quite clearly how the stitching changed over the course of the project. It took me about a year to sew my first rakusu, and it occurred to me during that time that creating a rakusu could be viewed as a metaphor for our lives as a spiritual journey. At first, I felt befuddled � how was I ever going to make all these little pieces of cloth into something which looked even remotely like a rakusu? My first stitches were irregular and nervous looking, then as I became more comfortable with sewing, they became overly relaxed and slack looking. Eventually, they became more even and balanced. The rakusu is Buddha's robe, and it is how we manifest visibly or wear Buddha's teaching. The precepts are Buddha's robe too, and wearing the precepts is how we manifest them in the world. A Buddhist friend of mine once joked about sewing a rakusu or an okesa as taking a big piece of cloth, cutting it up into little pieces, and then sewing it back together. This fit pretty well with how I was thinking of rakusu sewing as a spiritual metaphor. When we are first born, we are like a sheet of uncut fabric. At birth, it seems that our psyches' have a minimum of features and we are in some sense undifferentiated. When my daughter was born, I was struck by realizing that how I was with her would have a great impact on how she would shape, cut, and sew the fabric of her own life. So, we start as this big uncut piece of fabric. However, as we begin to grow up, we try to figure out how to fit in with others and into our society. In many cases we try to fit it by disowning part of our self. It is like we begin cutting our (life) cloth into little pieces. We cut off this piece so we fit better with another person, or hope they like us better with certain pieces cut out. Or, we cut out pieces, so that we fit better for a certain job, or to have a more respectable place in society. We might feel ashamed of certain parts of our cloth, so we cut those off, and hide those shameful pieces in our pockets. Then we think that some people will notice that some of pieces are gone, so we develop various bad habits or addictions which cut more pieces off, trying to obscure the cuts we have already made. After awhile, it seems like all our original cloth has been cut up into little pieces. Some pieces we hide, other pieces, like peacock feathers, we display proudly.'''
year_published = 2025
clearnet = "https://chzc.org/boyle1.htm"
