["http://chzc.org/Nonin2.htm"]
title = "Ryokan (1758?-1831)"
description = "A talk by Rev. Nonin Chowaney, Abbot of the Nebraska Zen Center/Heartland Temple on the poet Ryokan"
full_description = '"Ryokan represents something very special in the Japanese character...all who wish truly to understand Japan should study the life and poetry of this eighteenth-century hermit-monk. From a religious standpoint also, Ryokan is exceptional, exemplifying as he does the Zen Buddhist idea of attaining enlightenment and then returning to the world with "a serene face and gentle words." In his life he was indeed Daigu, the �Great Fool� (the literary name he gave himself), one who had gone beyond the limitations of all artificial man-made restraints." In this article, I intend to look at some of Ryokan�s poems and see why he is regarded so highly, but first, a bit of biography. Ryokan practiced with Kokusen for twelve years, until the Master died. Then, he went on a pilgrimage, and after almost five years, he decided to return to his home area. He found an empty hut halfway up Mount Kugami and began living there, supporting himself by begging in the villages below. Ryokan lived the hermit�s life from the age of forty to his death thirty-four years later in 1831. He became a masterful poet whose work has been translated into many languages and a master calligrapher whose work is now considered priceless. If someone asks My abode I reply: "The east edge of The Milky Way." Like a drifting cloud, Bound by nothing: I just let go Giving myself up To the whim of the wind What an expansive view of one�s environment! I�ve always admired, and sometimes envied those who could be at home anywhere, and in this poem Ryokan presents himself as one of those people. Like a drifting cloud, he has no preconceived notion of where he�s supposed to be or go. Because he has no preconceived notion, his mind does not limit him, and he can be or go anywhere, with equanimity. This is complete liberation, freedom from all restraint. Wherever life takes him, he will go. How wonderful! Ryokan�s poem reminds me of the following koan: A monk asked the master Sengcan: "Master, show me the way to liberation." Sengcan replied: "Who binds you?" The monk replied: "No one binds me." Sengcan said: "Then why do you seek liberation?"'
