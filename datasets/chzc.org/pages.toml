["https://chzc.org/SR6.htm"]
title = "Right Effort in Practice"
description = "Suzuki Roshi on Right Effort in Practice"
full_description = 'Most of you are beginners, so it may be rather difficult for you to understand why we practice zazen or meditation in this way. We always say "just-to-sit." And if you do, you will find out that Zen practice, or just-to-sit, is not easy. Just-to-sit may be the most difficult thing. To work on something is not difficult; how to not work on anything is rather difficult. When we have the idea of "self," we want some reason why we work on something. But if you do not have the idea of self, you can remain silent and calm whether or not you work on something. You will not lose your composure. So to remain silent and calm is a kind of test we receive. If you can do it, it means you have no idea of self. If your life is based on the usual idea of self, what you will do will not be successful in its true sense. There will be success in one way, but in another you are digging your own grave. So to work without the idea of self, is a very, very important point. It is much more important than making a good decision. Even a good decision based on a one-sided idea of self will create difficulties for yourself and others. When you practice zazen, you will of course have physical pain in your legs and mentally you will have some difficulty. You will find it difficult to be concentrated on your breathing. One after another images will come into your mind. Or your mind will go out for a walk and wander about. I have many difficulties in my practice, so I think you, too, will find it very difficult to sit in good zazen. All the difficulties you have in zazen should not take place outside your mind. Your efforts should be kept within your mind. In other words you have to accept the difficulty as not being other than what you are. You should not try to make some tentative particular effort based on your small mind like, "my practice should be better." "My practice" you say, but zazen is not your practice, it is buddha�s practice. Your effort is based on Big Mind which cannot get out of. If your small self begins to act without the care of Big Mind, that is not Zen. What you do should be well taken care of by Big Mind. Our practice should be based on mind or original way-seeking mind which works on and on continuously.'
year_published = 2025
