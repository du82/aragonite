["http://chzc.org/hartman3.htm"]
title = "Lecture by Zenkei Blanche Hartman, Abbess of the S.F. Zen Center"
description = "Zen practice talk on impermanence"
full_description = '''You know, if you just think about it a moment, it's simply awesomely, amazingly wonderful just to be alive! Just to be alive is awesome. It's a wonderful gift, and especially on a beautiful spring day like this. But you know, it took me a lot of years of meditation practice, and a heart attack, before I really got it that just to be alive is awesome. As I was walking out of the hospital having survived a heart attack about eleven years ago now, I had this thought: "Wow! I could be dead. The rest of my life is just a gift." And then I thought: "Well, it always has been a gift from the very beginning and I never noticed it until it was almost gone." I think that is true of many of us, that we don't notice what a gift it is just to be alive. How could we not notice? Well, we sort of take it for granted. But this gift is not without its problems, as you may have noticed. One of these problems is actually the thing that made me realize how awesome it was, and what a gift it was, and how much I appreciated it, and that was the fact that it is evanescent, it's impermanent. It's precious because you can't just take it for granted. We have this gift for some time, and so the question comes up for us: "Well, that being the case, how shall I use it, or how shall I give it back, or how shall I express my appreciation for it, or how shall I live this life which is wonderful and evanescent?" Suzuki Roshi talks about the story of the four horses. One of the horses starts to run just seeing the shadow of the whip, before it even touches him. The next one starts to run just having the whip touch the hair of its skin. And the third horse starts to run when it really feels the pain of the whip on its skin. And the fourth horse doesn't really get going until it feels the whip in the marrow of its bones. And what is this whip? This whip is just that evanescence of life�just that teaching of impermanence. It's not a teaching really, it's just what is. One of the Buddha's most significant teachings is to hold impermanence up for us to see, but, actually, it is just how things are, if you look at anything, anytime, anywhere. All things are impermanent. There is a Pali chant that goes, �All things are impermanent/ They arise and they pass away./ To live in harmony with this truth/ Brings great happiness.� This is the thing�if you see how things are, "things-as-it-is," as Suzuki Roshi used to say, you see that they arise and they pass away. The trick is to live in harmony with the way things actually are. Our suffering comes from wanting things to be different than they are. You know, like trying to push the river uphill.'''
year_published = 2025
