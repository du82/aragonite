["http://chzc.org/Nonin3.htm"]
title = "Putting Down Our Burden"
description = "A talk by Rev. Nonin Chowaney, Abbot of the Nebraska Zen Center/Heartland Temple"
full_description = 'I experienced this during our last one-day sitting. After lunch, I sat down on the recliner in my room with a cup of coffee. I didn�t want to be anywhere else. The coffee, the softness of the chair�s cushions, the dog hair on the rug, the sunlight streaming in the window�it was enough. I felt complete. Like a mountain climber taking off his pack at the top of the mountain and plopping down in the snow, I felt so relieved to sit down unencumbered, and I felt grateful just to be here, in this small temple in Omaha, in sesshin, sitting zazen, eating simple food with good dharma friends, all in silence. Gratitude welled up and included all my teachers, my parents, all the buddhas and ancestors, all bodhisattvas, all beings who support our lives and make it possible for us to live, to be here, to bloom in this moment. What more is needed? The poet Charles Bukowski wrote, "I�ve learned to feel good when I feel good." Sitting on the couch, I felt good. And it felt good to feel good. There is enough dissatisfaction and pain in life; we should allow ourselves to feel good whenever possible! Our teaching is that there is nothing to seek. Zazen is an opportunity to enter the present moment in its completeness and simplicity. In a life that has become increasingly complicated, busy, and fragmented, zazen retreats (sesshin) are a great gift, an opportunity to concentrate the mind on the present moment over long periods of time, to engage fully in the practice/realization of awareness, or enlightenment. I have come to treasure sesshin, to treasure the opportunity to "just sit" and put everything else aside for as long as sesshin lasts�a day, two days, or seven days. This practice gives us an opportunity to experience the infinite possibilities of our life right in the middle of it. How often have we heard people say that they have trouble finding the time to sit quietly? What a shame. To people whose hectic lives and large burdens made the practice of zazen difficult and sometimes impossible, my master, Dainin Katagiri, would say, "I feel sorry for you." When I felt complete the other day in my room, I thought of the many people having difficulty in their lives who don�t have the opportunity to experience sesshin, and I felt so grateful for this practice, for the opportunity to see, with the inner eye of wisdom, that this moment is perfect exactly as it is, full a complete, beyond positive or negative, beyond good or bad. It just is.'
year_published = 2025
clearnet = "http://chzc.org/Nonin3.htm"
tags = ["burden", "down", "putting"]
language = "en"
