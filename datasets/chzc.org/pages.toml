["https://chzc.org/Mel6.htm"]
title = "The Heart Sutra, Part 5"
description = "Zen practice talk on the Heart Sutra by Sojun Mel Weitsman, Abbot of the Berkeley, CA, Zen Center, Part 5"
full_description = 'I may never finish with the Heart Sutra but I think you should continue to study it on your own. I recommend the Tiger’s Cave (ed. Trevor Leggett) which has a commentary by Abbot Obora who takes the Heart Sutra phrase by phrase, not as a technical commentary, but based on life itself so it’s talking about how to live Praj�a Paramita from a point of view of a Soto Zen abbot. "...no ignorance and also no extinction of it, until no age and death and also no extinction of it." Within that sentence lies the twelve-fold chain of causation which is a cycle, a circle, called the circle of conditioned co-production or conditioned arising. It means that one thing gives rise to another, which is Buddhist philosophy in a nut shell. Because everything is dependent on something for its existence, and nothing exists independently, there is no magical or sudden appearance of things without a cause. There are no miracles in Buddhism. Life itself is miraculous, but there is nothing that happens out of the realm of causes and conditions. For whatever happens, there’s got to be a cause and it’s cause sets up other conditions, and it’s also a condition for something else. So each thing, being the result of causes and conditions, is, itself, another cause or another condition for something else. Everything is bound together through causes and conditions, and everything is always affecting everything else. Whatever we do has both close effects and far reaching effects. We say that, in some way, the energy of an action continues endlessly. Energy is intercepted by causes and conditions and takes various forms. The phrase quoted above describes the cycle of the twelve conditions leading to rebirth. On this cycle you can pick out a beginning anywhere, but the beginning here is ignorance. The twelve-fold chain starts out with ignorance, ignorance being the cause of our karmic life. Birth in the womb begins with ignorance, but ignorance has two meanings depending on how you look at it. Next is the formation of the embryo; and then there is feeling or awareness; and then there is individuation; and then there are the six sense fields; and from all this comes contact with the world; and from contact with the world sensation arises; and from sensation comes the thirst for life...thirst, desire, lust, and craving. Then from that comes clinging or attachment, hanging on to what our desires focuses on. Desire is called the basis of suffering because it leads to clinging to that which cannot be clung to. Then comes the growth and continuation of what we call a self or an ego. Through desire, clinging, craving, an ego is formed, and this individuation (actually, individuation is a separate issue which we call the ego and a false sense of self.) All of these lead to another birth, old age and death, and then the cycle continues over and over again. So this is a short, very succinct explication of the twelve-fold chain.'
year_published = 2025
clearnet = "https://chzc.org/Mel6.htm"
