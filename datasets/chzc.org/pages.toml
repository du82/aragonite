["http://chzc.org/LindaC.htm"]
title = "Face to Face: the Meaning Comes Alive"
description = "Practice talk on Dharma Transmission"
full_description = '''So Dharma Transmission is about two people using the form of the ceremony as a vehicle, bringing forth their effort, and equal to the effort that is made, the meaning comes forth. That's always true, that whatever you bring to your activity, equal to your effort and sincerity the meaning will be revealed. Even now in this dharma talk you can relate to my words in various ways. You can sit back and keep them at bay, or you can be upright and receptive, and things will be alive for you in a different way. So this is everyone's practice, not just dharma transmission ceremony. It's the ceremony of life. I could not do this ceremony by myself. Reb could not do this ceremony by himself. No one person can make the ceremony happen. It took everybody. It took many, many people to have this ceremony. At Tassajara there is the kitchen crew and I received my meals along with the other practice period students. The food was very tasty, and I did not have to worry about cooking or shopping. I was just totally taken care of in that realm and in many other ways. It was very cold, and I was fortunate to have a wood-burning stove in my cabin. When I used up the wood, the wood pile outside my door would be replenished. People were taking care of that. I would go out the next day and more wood was stacked, waiting. All of Tassajara helps all of Tassajara really, but I felt it very strongly during the ceremony how I was taken care of, how everybody was coming forward to make the ceremony happen. Sometimes I felt like I was living in a Buddhist fairy tale with certain tasks and ceremonies to complete. One thing I did was to offer incense at various altars before the kerosene lanterns were lit in the early morning. As I came back into the main part of the grounds from the round of altars, many of the lamps would have been lit, so the pathways were now illuminated. Someone's lighting the lamps was a simple kindness which I received straight into my heart. I also had six jishas or attendants who volunteered to help me. Jisha means "one who carries" and they were ready to carry everything which was needed: incense, matches, a flashlight, an umbrella, a bowing mat. It was like having guardian angels or guardian bodhisattvas who were there to protect me while I went through the ceremony.'''
