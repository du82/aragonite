title = "The Manifested Three Treasures, part 1"
description = "Suzuki Roshi on the Three Treasures"
full_description = 'People who join the practice with harmony and unity are called Sangha. The meaning of Sangha is not only this group of people, but also the state of harmony or unity. Truth itself is Dharma, and the truth which is not divided into various forms is called Buddha, which is another interpretation of the Three Treasures. This understanding is called "one body/three treasures." Although there are three treasures, they are an interpretation of the one reality. So we call this kind of interpretation, "one body/three treasures" or ittai sambo. Ittai: ichi is one and itai is body; sambo is three treasures. Ittai sambo. The cultural Three Treasures are closely related to society. The Buddhist organization is also Sangha. So there are three ways of understanding the Three Treasures, but actually the three are not different. It is one and it is three. This is a very old way of oriental thinking, even before Buddha. Buddha applied this interpretation to our framework of teaching. I think Christianity has the idea of Trinity. This is the universal framework of religion. But in Buddhism there are many sects, so Buddhism does not combine many ways of understanding in one school. Each school is based on some particular understanding or standpoint. We do not take many standpoints in one school. We especially emphasize this in Japan, but this is not sectarianism. Once we take a standpoint, we should develop that standpoint through and through until we can understand various standpoints. At first, each way of understanding has its own insight. But if your understanding becomes deeper and deeper, you can understand other viewpoints at the same time. This is how we establish various schools in Buddhism. The Nichiren school takes the standpoint of Dharma. Dharma includes the other two, Buddha and Sangha. Their object of worship is the Lotus Sutra, and they repeat, nam myo ho renge kyo. "Myo ho ren ge kyo" is the title of the Lotus Sutra in Japanese. The Shin School repeats Amida Buddha�s name, Namu Amida Butsu. The Zen school repeats Buddha�s name, but the emphasis is on Sangha. The Zen school is not so concerned about the intellectual viewpoint or understanding. So we just repeat the founder�s name and say, Namu Shakyamuni Butsu. When we say Namu Shakyamuni Butsu, his scripture is included and his Sangha is also included; and we are a part of the Sangha. Even though we members of the Sangha are not direct disciples of Buddha, we are the descendants of Buddha. We are successors of Buddha; and because we emphasize the practice of attaining enlightenment as Buddha did, we naturally put emphasis also on Sangha. Through practice we build our character as Buddha did and that�s why we repeat Shakyamuni Buddha�s name. For us it is natural to repeat Shakyamuni Buddha�s name rather than Amida Buddha�s name or the name of a scripture. If you repeat the name of some scripture, you are liable to be bound by some teaching which was told by Buddha. Actually, it�s impossible to authorize some teaching as the absolute teaching because something which is told by some particular person could not be absolute, even though it was told by Buddha. It may be impossible to authorize the teaching for human beings.'
