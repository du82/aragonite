["http://chzc.org/finding-the-compassion-in-zen-by-zenki-kathleen-batson.htm"]
title = "Finding the Compassion in Zen by Zenki Kathleen Batson"
description = "Finding the Compassion in Zen by Zenki Kathleen Batson"
full_description = "Today I want to explore a line of questioning that keeps coming up. The questions revolve around what people perceive as coldness and lack of compassion in Zen. People ask, where is the kindness, the tenderness, and warmth? I am always slightly surprised that people see these elements as missing. At the same time, I know that sometimes our practice can seem odd and cold to a newcomer. I think it is helpful to remember that Zen operates in a completely different paradigm from the one most of us grew up within. Zen is not focused on dividing our activity into right and wrong, then working to fight for what we have labeled right, and against what we have labeled wrong. Zen is focused on seeing the true nature of our lives beyond this simplistic view of right and wrong. It asks us to de-center our personal judgments about the world; physically settle into the rootedness of this experience that works to see all perspectives, then respond appropriately and without harm to benefit the most beings. In our practice, we work to stay present for what is arising without turning away. In our environment here, we create order and subtle beauty that quietly calls us to look more carefully and in fuller detail. It beckons us to stay present with what is. Sometimes people can misinterpret this idea of staying present to what is as not doing anything, or not caring for the big picture. In practice, Zen teaches us that we are in, as well as affecting, the big picture in every moment. Every choice we make matters. The first Dogen writings I read were the “Genjokoan” and the “San Sui Kyo.” I cried because I found them so beautiful and moving. They expressed a truth I had up to that point not seen expressed in words anywhere else. Words like kindness and compassion are not in either of those fascicles, but they aroused in me a deep feeling for all beings. Zen is like artwork. Its teachings meet us directly. They strike us at our core and open our hearts and minds to take in more of the endless universe. When we first begin studying or practicing Zen we may not know that Zen is a Mahayana tradition. Mahayana is the name for all the Buddhist schools that have the Bodhisattva Vow at their foundation. A bodhisattva is motivated by bodhicitta, the inspiration and aspiration to awaken to the truth to help all beings realize their true nature and end suffering. Bodhisattvas vow to remain in the world of suffering to respond to the suffering of all beings. Specifically, the suffering brought about by not understanding the truth of impermanence, interconnectedness, and the signless nature of all phenomena. By signless, I am referring to the ultimate inability to name the phenomenon of the world truthfully. Any definition we create does not properly label the subtle profound reality that is happening. And yet we must use words. We must communicate and live our lives in the world together. Prajna is the wisdom of these truths. Awakening to these truths relieves suffering. Sometimes it can seem that the focus in Zen is only on this wisdom element of Buddhist teachings. If we explore the teachings of Buddha’s wisdom without the lens of compassion however, they become useless and potentially harmful. Nagarjuna warns that a misunderstanding of emptiness is a dangerous thing. Compassion is wisdom’s partner in all sects of Buddhism."
year_published = 2025
