["https://chzc.org/zenfaq.htm"]
title = "Frequently Asked Questions"
full_description = '''A more sophisticated reading of this question requires knowing that Western interest in Eastern religions, and in Buddhism in particular, started out with the researches of 19th century Protestant scholars who were looking for a way to have a faith without a God and the "unscientific" aspects of Biblical religion. Theravada Buddhism fit the bill nicely. Zen, however, was Mahayana, which the early pioneers disdained as superstitious, and the Zen texts were written, not in Sanskrit, but in Chinese, with which they were less familiar. The Japanese scholar D.T. Suzuki spent the better part of his very long life trying to convince several generations of American scholars that Zen was probably what they were looking for, and, in the end, he succeeded. Alan Watts brought Suzuki’s work to the attention of a more popular audience. Both Suzuki and Watts were at great pains to present Zen in a non-religious, often psychological, context. For younger readers, it should be noted that the 1950's, the heyday of Watts and Suzuki, were the absolute peak of skeptical, rationalist, scientistic rejection of religion in the intellectual community. But, because of Suzuki’s work, Zen was embraced by the Beatniks, by artists, by free thinkers–Zen was hip, Daddyo! Many writers on Zen in this era declared that it was not a religion, that it was beyond religion, etc. So the question of whether Zen is a religion or not often arises out of this context. Zen can be turned into a philosophy of sorts if you cut it off from the religious practices, primarily meditation, which are its roots. Suzuki and Watts were not interested in meditation and often left it out of their presentations of Zen, even though the word "Zen" means "meditation." As soon as the question arises of how we, ourselves, can become Zen Masters and get enlightened, we are immediately thrust back into the religious practice of Zen, complete with the bowing, chanting, meditating, reading Buddhist religious treatises, and the taking of vows to follow the precepts.'''
year_published = 2025
clearnet = "https://chzc.org/zenfaq.htm"
