["https://chzc.org/hartman.htm"]
title = "Lecture by Shunbo Sensei"
description = "Zen practice talk on pain"
full_description = '''My mind was this big mess, and then the soup wasn't hot and the servers were slow. That was breakfast this morning for me. I got back to my cabin and, of course, I don't have any chairs in there. I sit and study in seiza, so it was more of the same. Jack Kornfield has really worked out a very, very well presented discussion of meditation on mindfulness of the body and pain, and a meditation on pain which I would like us to do together today. Don't change your posture, perhaps you've already gotten into a little of your painful areas by now. I hope so, this will help you with this mediation. "Because our acculturation teaches us to avoid, or run, from pain, we don't know much about it. To heal the body, we must study pain. When we bring close attention to our physical pains, we will notice several kinds. We see that sometimes pain arises as we adjust to an unaccustomed sitting posture." (For those of us who are fairly new to sitting, we, in fact, do have to help our bodies become flexible enough to sit in a stable sitting posture. During that time, we may have to make a lot of adjustments in posture, and we may have to change from one posture to another. We may sometimes have to sit in a chair to help ourselves become accustomed to a stable sitting posture. There's nothing in this meditation, and there's nothing that I'm suggesting, to indicate that you should ignore the difficulties that arise from becoming familiar with an unaccustomed posture.) If something arises that's too intense, or too painful, or too difficult to stay with, our mind will wander away. We needn't be worried that somehow we're going to get locked in a room with this thing and we can't get away from it. Our mind will wander away or we will fall asleep. But each time it arises, just stay with it for as long as you can. Little by little, it will lose its potency to frighten us or upset us. Sometimes, very slowly, there are aspects of who I am that are very difficult for me to accept. But just to give careful and kind attention to whatever arises is what our practice is. Sitting facing the wall in sesshin, most of what arises is just our own body, mind, and feelings. We're not interacting with one another so much just now, though we bow with careful and kind attention to each other as we pass, and as we serve and are served. But mostly what we are giving attention to during sesshin is our own stuff. So I want to read you this meditation on healing the body that Jack has in his book.'''
