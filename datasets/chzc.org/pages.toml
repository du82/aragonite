["https://chzc.org/SR1.htm"]
title = "Real Precepts are Beyond Words"
description = "Suzuki Roshi on Zen Precepts"
full_description = 'Given July 2, 1971, City Center and published in the Fall, 1990, issue of the Wind Bell (San Francisco Zen Center) The foundation or true meaning of the precepts is based on the various ways of understanding the one reality which is always with you, the reality which is not divisible into three, or sixteen, or ten. Tentatively, we divide. We explain from various angles. But that is just words. Real precepts are beyond words. We cannot talk about it. If we talk about it, already it is no longer the precepts. So if you think the meaning of the precepts is just to observe various rules, your understanding is very far away from the true understanding of the real precepts. The first of the sixteen precepts we observe is the one reality which cannot be divided into three or sixteen. It is the precept of one reality. You may call it emptiness or you may call it the absolute. That is the first precept we receive and observe. All the precepts start from this precept. Without understanding this precept, our sixteen precepts don�t make any sense. It looks like I am talking about something like heaven, but it is not so. I am talking about each one of you, and myself, and about water, and about stuff. When stuff is really stuff, stuff includes everything. When you just practice zazen on your black cushion, your practice includes everything and you practice zazen with Buddha, with the patriarchs, and with all sentient beings. That is what I repeat, over and over. Whether your practice is good or bad, it doesn�t matter. If you accept your practice as your own, then that practice includes everything. At that time, you have the precepts which include everything, as absolute being includes everything. We say that something which includes everything is the absolute. But, actually, it is more than that. It is beyond our understanding. You may think that if you add up all the beings which exist in this universe that that is the absolute. But it is not so because the absolute cannot be understood by your mind. Something which you understand is already not absolute, because your mind limits the real understanding of the absolute. When you don�t understand and just sit, when you become just a stone, or stuff, then you include everything. That is our zazen practice. This is such an important point for us. If you lose this point, you will easily be caught by some idea, or some experience, in your practice. "My practice is good, very good. Recently I saw Buddha in zazen. [laughs] All the Buddhas came to me and admired my practice." We are laughing, but that kind of practice exists and some people practice this kind of practice very sincerely. It is good practice, but even so, the practice of just sitting is beyond comparison. Just to sit is much better than to see all the Buddhas in the world. Do you understand why? That is the point, to know what an important practice it is just to be yourself.'
year_published = 2025
clearnet = "https://chzc.org/SR1.htm"
tags = ["beyond", "precepts", "real", "words"]
language = "en"
