["http://chzc.org/boyle5.htm"]
title = "Spirituality and the Dharma by Kuden Paul Boyle"
description = "Kuden Boyle's talk on Spirituality and the Dharma"
full_description = '''I would like to talk about my sense of spirituality in general, how it developed, and how it fits into the Dharma. In my experience, when someone finds out I practise Zen, they often start talking about what "spiritual" beliefs they have. I assume they are trying to find some common ground with me. More often than not, however, when these people talk about "spirituality" they are really talking about their metaphysical beliefs. For example, someone may believe in a deity, or angels, or other spiritual helpers. Such beliefs can encompass believing that certain inanimate objects (e.g. crystals) have various powers. Others might believe that performing certain rituals will have specific intended effects. For me, my spirituality doesn't involve metaphysics. Rather, it is more about what I do than what I believe. I see spirituality in terms of relationships, and these relationships are framed by posing various questions to myself. The questions that I use are: 1) What is my relationship with myself?, 2) What is my relationship with other people and other beings?, 3) What is my relationship with the environment and the world around me? It's not so important to come up with answers as to hold open the questions. This is a moment by moment practice. It's about self-awareness and what I do to show up for my life. Am I feeling hateful, or open hearted in the moment? Do I feel an impulse to act on that emotional state? I find these questions useful because for me, personally, they help me orient toward certain elements of the Eight-fold Path, like Right View, Right Intention, and Right Action. At the same time, these questions are general enough to clarify to non-Buddhists how I see spirituality, and that spirituality is not necessarily coupled to metaphysical beliefs or faith in supernatural beings. The way that my spirituality evolved seems similar to what are called the Five Characteristics of Dharma, which I will talk about a little later. First, however, I would like to talk about how my sense of spirituality developed.'''
year_published = 2025
