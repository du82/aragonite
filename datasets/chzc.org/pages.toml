["http://chzc.org/dharma-transmission-talk-by-zenki-kathleen-batson.htm"]
title = "Dharma Trasmission, a Talk by Zenki Kathleen Batson"
description = "Dharma Trasmission, a Talk by Zenki Kathleen Batson"
full_description = 'Josho [Pat Phelan] Sensei shared that it is tradition to give a talk after Dharma Transmission to share our experience of it. As most of you know Jakuko [Mo Ferrell], Kuden [Paul Boyle] and I received Dharma Transmission from Josho Sensei over the Winter Break. Dharma Transmission has a mysterious quality to it. We don’t generally discuss it in detail, so I didn’t know exactly what I would be doing from December 26 [2022] through Jan 2 [2023]. I only knew it would involve writing carefully on silk with a paintbrush and a lot of bowing. Dharma Transmission is known as Shihō (嗣法). Literally, to "succeed to" or "inherit" (shi 嗣) the "Dharma" (hō 法). It is also referred to as Denbō (傳法). Den is "passing on" or "transmitting" (den 傳) the "Dharma" (hō 法) We as receivers were deshi. Sensei as the giver was the Honshi or Primary master who gives the transmission. In our school of Soto Zen Buddhism, you can only receive transmission once and only from one person. You are connected to this person for life. When we receive Dharma Transmission we are being entrusted by our teacher to teach, to stand upright, and share the Dharma on our own. Although we will, in reality, always be guided by our elders and teachers. The Dharma that is transmitted is our understanding, and it is our teacher’s understanding. It is also Shakyamuni Buddha’s all at the same time. Because all things co-arise and each individual is different and behaves differently in different relationships, my Dharma siblings and I each received different Dharma from Sensei. The Dharma each individual carries is their own. It is a co-arising of the way their own understanding and life force meets their teacher’s understanding and life force. Each person expresses the Dharma in a unique way as a unique being, but it is also all the same Dharma, an expression of the truth and the Buddha’s teachings. Each transmission of the Dharma is simultaneously unique and universal. It is also constantly evolving and changing, while also being continuous and consistent. What is transmitted, the Buddha’s teaching, is to be conveyed in the receiver’s body, speech, and mind. It is to be embodied in how we live our lives. Since the Truth of how things actually are is always available to all people it is not an actual thing, it is nowhere and it is everywhere. This is my sense of it.'
year_published = 2025
