h another person, or hope they like us better with certain pieces cut out. Or, we cut out pieces, so that we fit better for a certain job, or to have a more respectable place in society. We might feel ashamed of certain parts of our cloth, so we cut those off, and hide those shameful pieces in our pockets. Then we think that some people will notice that some of pieces are gone, so we develop various bad habits or addictions which cut more pieces off, trying to obscure the cuts we have already made. After awhile, it seems like all our original cloth has been cut up into little pieces. Some pieces we hide, other pieces, like peacock feathers, we display proudly.'''
