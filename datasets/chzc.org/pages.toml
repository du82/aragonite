["https://chzc.org/hartman4.htm"]
title = "Lecture on Beginner's Mind"
description = "Zen practice talk on beginner's mind"
full_description = '''I want to talk today about beginner's mind. The first book of Suzuki Roshi's teaching was named Zen Mind, Beginners' Mind. He founded two temples. One of them is named "Zen Mind Temple" (Zen Shin Ji, Tassajara) and the other is named "Beginner's Mind Temple" (Ho Shin Ji, the City Center in San Francisco). In that presentation, Zen mind and beginner's mind seem to be equated. Suzuki Roshi highly esteemed beginner's mind. What is it? A few years ago, I went with a group of people to Eiheiji monastery in Japan. We were sitting in the guest meditation hall, and Matsunaga Roshi came in and sat with us. He's head of the international department at Eiheiji now, but he was in Los Angeles for a number of years. We sat together for a while, and then he started to talk. He said, "When I visited San Francisco thirty years ago," (that was at the very beginning, over at Sokoji temple) "I could not understand Suzuki Roshi's meaning. But now, sitting in this zendo with you, I can feel beginner's mind. Now I understand his meaning." What is this beginner's mind? Earlier this week I was having lunch with Indigo, our small child at City Center. He saw an object on the table and got very interested in it. He picked it up and started fooling with it: looking at it, putting it in his mouth, and banging on the table with it�just engaging with it without any previous idea of what it was. For Indigo, it was just an interesting thing, and it was a delight to him to see what he could do with this thing. You and I would see it and say, "It's a spoon. It sits there and you use it for soup." It doesn't have all the possibilities that he finds in it. Can we look at our lives in such a way? Can we look at all of the aspects of our lives with this mind, just open to see what there is to see? I don't know about you, but I have a hard time doing that. I have a lot of habits of mind�I think most of us do. Children begin to lose that innocent quality after a while, and soon they want to be "the one who knows." We all want to be the one who knows. But if we decide we "know" something, we are not open to other possibilities anymore. And that's a shame. We lose something very vital in our life when it's more important to us to be "one who knows" than it is to be awake to what's happening. We get disappointed because we expect one thing, and it doesn't happen quite like that. Or we think something ought to be like this, and it turns out different. Instead of saying, "Oh, isn't that interesting," we say, "Yuck, not what I thought it would be." Pity. The very nature of beginner's mind is not knowing in a certain way, not being an expert. As Suzuki Roshi said in the prologue to Zen Mind Beginner's Mind, "In the beginner's mind there are many possibilities, in the expert's there are few." As an expert, you've already got it figured out, so you don't need to pay attention to what's happening. Pity.'''
