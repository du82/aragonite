["https://chzc.org/Mel5.htm"]
title = "The Heart Sutra Part 4"
description = "Zen practice talk on the Heart Sutra by Sojun Mel Weitsman, Abbot of the Berkeley, CA, Zen Center, Part 4"
full_description = 'Well, this is the third day of sesshin. Sesshin has a way of taking care of us in that something will drop away by itself and clarity will come by itself; and even though there may be some confusion in our mind, there is also clarity. So I am going to go on talking about the Heart Sutra. "Oh Shariputra, all dharmas are marked with emptiness." Before the first century, we count eighteen schools of Buddhism, and there were probably more; the eighteen are what is recorded. These eighteen schools each took a different position on various issues of doctrine, and there were controversies between them as to what was the correct attitude toward life, and other matters. One of the arguments was about dharmas. It was pretty much the case that all of the schools agreed that there was no "self" (that what we call a self was not a self). There was a school of so-called Pudgalavadins who leaned toward believing that there actually was some permanent soul-like substance, or spirit, which actually transmigrated from life to life, but that was the only school of Buddhism which had that idea. All the other schools of Buddhism said there was no self. There were just form, feelings, perceptions, mental formations, and consciousness [the five skandhas], and those didn’t constitute a soul. Then there was a controversy over dharmas. Some schools thought that there may be no soul, but that dharmas actually did exist. Dharmas are like the elements that make up everything, but here we are speaking of them as making up a person. They thought that, even though there is no substantial person, at least the elements, the dharmas, exist. Then the Mahayana school came along and said that even the dharmas are empty, so, there is no self, and there are also no dharmas that have their own substantial existence. Anyway, in the Sutra Avalokitesvara says, "Oh Shariputra, all dharmas are marked with emptiness," and the skandhas are as well. "They do not appear nor disappear." Now, this is a strange statement! Things "appear" and "disappear." But here we are talking about the phrase "in emptiness." In the sutra everything is referred to as being "in emptiness." So, in emptiness things do not appear nor disappear: although something comes along, its true nature doesn’t come or go. There is only transformation, and, in the realm of transformation, things appear and disappear, but the true form of things doesn’t appear or disappear. True form is no form, no special form, and, out of this "no special form," all of the special forms take shape.'
year_published = 2025
