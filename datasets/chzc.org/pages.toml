["https://chzc.org/boyle3.htm"]
title = "The Han"
description = "Kuden Boyle's talk on the Han, a monastic time marking device"
full_description = 'The Tenzo Kyokun, or "Instructions for the Cook" describes how the tenzo, the head of kitchen practice in a monastery, should go about their duties. However, the Tenzo Kyokun is a lot more than that. It describes the attitude with which one should practice. It is a great guide not only for those doing kitchen practice in a monastery, but for any Zen practitioner. The attitude with which we practice determines the quality of our practice both individually and as a sangha. To understand the context of the Tenzo Kyokun, it might help to say a few words about how Zen monasteries and temples are organized. Every monk in the monastery has a position. These positions entail different responsibilities. The positions are such that each position depends on the other positions. Everyone needs to fulfill their responsibilities so that monastic life functions smoothly and supports the practice of the monks. In this way, the sangha or group of practitioners embody our interdependence. The role of a temple position places us in the position of simultaneously practicing for ourselves and for the benefit of others. This is an important point in Zen practice. On one hand, no one can do our practice for us, and, on other hand, our practice is utterly dependent on other people. In the Tenzo Kyokun, Dogen puts it like this, "The three aspects of this attitude are to see that working for the benefit of others benefits oneself; to understand that through making every effort for the prosperity of the community one revitalizes one�s own character ..." In the Tenzo Kyokun, Dogen emphasizes that the tenzo and the other temple officers should practice in their positions with three attitudes, or "minds" as Dogen calls them. These are, joyful mind (kishin), nurturing mind (roshin), and magnanimous mind (daishin). However, this isn�t just good advice for temple officers, it is good advice for anyone who is engaging in the practice of Zen. Joyful mind is one of gratefulness and buoyancy. When we consider all of the myriad circumstances which brought us to Zen practice, such an opportunity is a rare gift. Our practice today is due to every moment we have lived, and every choice we have made up until this moment. If one decision had changed, we cannot say our path would be the same. When we keep this perspective, an attitude of joy and gratitude can naturally arise in the course of our activities. With joyful mind we put our entire being in our activity.'
