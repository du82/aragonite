["http://chzc.org/Shosan2.htm"]
title = "One-day Sitting Guidelines and the Precepts"
full_description = '''Another thing we're trying to do is to maintain silence. Do you notice how in a day such as today, where we're sitting zazen, everybody shares this tendency to internally comment, or even to externally comment, on what's going on? Like to bump into someone and say, "Oh, excuse me"? Those are habits. So we're trying to let go of some of the habits of speech that we have and to maintain silence. Also we�re maintaining a silence of the eyes, to let the eyes settle instead of looking at people, and we�re trying to avoid social gestures so that we can really focus on what's going on. To acknowledge people, instead of saying, "Hi, how are you doing?" we're using this gesture [puts palms together in gesture of gassho]. This gesture is not a social gesture. It's a gesture that's been used for thousands of years, not just since Buddha, but way before that. This gesture is called gassho in Japanese, and namaskar or anjali in Sanskrit in India. It basically is bowing to the awake nature of some one or some thing, and it's a way to remember to take refuge. As we pass someone in the hall, that's what we do. We just bow. We're acknowledging them on the deepest possible level. It's as if we're not damning the people we meet with faint praise. Do you know what we mean by not talking to them socially and saying, "Hi, how are you?" We're letting them be exactly who they are and meeting them in the deepest and most fundamental way. To let go of some of the habits of discursive thought that often lead to speech or to looking around, and so on, we're also taking a day not to do things that promote discursive thought, like reading or writing or speaking, but also checking the watch a lot. We're turning off cell phones today, and any kind of explaining, comparing, or counting, if you notice that in yourself when you're doing the sitting today. If you're not doing the sitting, you might try this for five minutes. Anytime you notice yourself checking the clock, or going out after a sense impression, or comparing something with something else, you might notice, �oh, discursive thought, discursive thought,� and let go of it.'''
year_published = 2025
clearnet = "http://chzc.org/Shosan2.htm"
