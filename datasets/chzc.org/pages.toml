["http://chzc.org/comments-on-the-repentance-verse-by-kuden-paul-boyle.htm"]
title = "On the Repentance Verse by Kuden Paul Boyle"
description = "Comments on the Repentance Verse by Kuden Paul Boyle"
full_description = '''We all start our spiritual journey with the aspiration to somehow live our lives differently from how we have been living them. For many people some personal crisis may be the catalyst for arousing this aspiration. While the specifics differ from person to person, it comes down to something like, "there has to be something better" or "I have to live my life differently." For some people, the aspiration to sit zazen is the start of the journey. For others, it may be entering psychotherapy or a 12-step program, or some other personal growth effort. No matter how it began, the people in this room have all found sitting zazen appealing and have decided to have Zen practice as a part their personal spiritual journey. So we start sitting zazen. Maybe a little bit at first, but then as our capacity to sit increases, we often begin to participate in all day sittings and then 5 or 7-day sesshins. As our practice matures we become more aware of our mind's internal dynamics and habituated patterns. We learn what kind of thoughts or imagery are seductive and distracting us. We become aware of our own mental barriers or hindrances in our practice. We develop a desire to live our lives both on and off the cushion with a greater sense of congruence. We may begin to see the sense of refraining from activities which undermine our intention and resolve to practice. It's also about this time that someone's practice shifts from being strictly a means of personal development to something broader — a practice which is oriented toward the well-being of all beings. For many practitioners, this leads to a desire to receive the Sixteen Bodhisattva Precepts. This is the process I have noticed in myself and I have seen this same process happen in others. Wanting to receive the precepts is a natural development in one's Zen practice. For me, wanting to receive the precepts is an expression of bodhicitta which is the arousing of the "aspiration to enlightenment" and the intention to reach complete, perfect enlightenment (anuttara samyak sambodhi) in order to liberate all beings.'''
year_published = 2025
