["http://chzc.org/Kohn.htm"]
title = "Master Ma Was Not Well"
description = "Lecture on the Koan Master Ma was not well"
full_description = 'Thank you, to all who have come before. Specifically to the teachers in Suzuki Roshi�s lineage, a wonderful group of teachers who extend back in time all the way to Shakyamuni Buddha. But this doesn�t include all to whom I offer homage. Still not included are those who branch off of this line, and then there are the many unknown sisters back through time. And what about all the ones from the western religious traditions, those who have affected how it is that we westerners have responded to those eastern teachers who brought us the Buddha way? Ancestors all, thank you. One of the wonderful old stories from ancient Chinese koans is about a great master who is in one of those branching streams, Master Ma, "the horse,"[one of the meanings of the Chinese word �ma� is "horse"], who had innumerable enlightened disciples, all of whom taught the true Dharma and spread it throughout China and the ancient world. Well the story, as I tell it, (and please forgive the liberties I have taken) is this: Master Ma was not well. The "old horse" was banging around in his stable (room), crashing, letting out loud neighs and whickers, his skin rippling on his ribs, his distress heard by all who came near the monastery. A disciple knocks on the door and enters. ( I sometimes think of the disciple as Master Ma�s anja (personal attendant), the one who makes his bed, gives him tea, screens those who would see him, keeps the home fires burning. At other times, it pleases me to think of the director, or governor, of the monastery knocking: the one who protects the public face, and insures that things run smoothly so that the Master is free to be himself. One way or another, the disciple enters the room and says, "How is the venerable master today?" Master Ma answers, "Sun face Buddha, moon face Buddha." Now this is a strange answer. Has the master completely lost it, or is an explanation in order? A great teacher wouldn�t be didactic, but I will work on explaining, and I apologize for imposing my vision on your mind. First, let us consider that the "dark" (moon) is the absolute, the one. In the dark we cannot differentiate. All is as one. Sunlight, then, is the relative, the ordinary, the realm where detail, specificity, differentiation takes place. Both "is" one. Both "is" many [This is a play on Suzuki Roshi�s phrase, "things as it is"]. Can we hold the absolute and the relative in our hands at the same time? Not opposed, but there all the time, together? This is our work; it can be done. Later the following poem was written:'
