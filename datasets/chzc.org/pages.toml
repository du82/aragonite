["https://chzc.org/hartman5.htm"]
title = "Birth and Death"
description = "Zen practice talk on Birth and Death and Impermanence"
full_description = "There is a verse that�s on the han--the wooden block that calls us to the zendo. It�s also sometimes chanted just before bedtime in many Zen monasteries. It is an exhortation to practice and goes something like this: �May I respectfully remind you: Great is the matter of birth and death. All is impermanent, quickly passing. Be awake each moment. Don�t waste this life.� There is a departing phrase that is very common in Japanese which is �O dai ji ni� which means literally, �Take care of the great matter.� The great ancestor Nagarjuna said, �In this world of birth and death, seeing impermanence is bodhicitta; is the mind of awakening.� This was very true for me. This is what turned me toward practice. I was going along, living my life, when one day my best friend had a really bad headache. She went to the doctor the next day, was diagnosed with an inoperable brain tumor, went into a coma and died. Whoosh! Just like that. I was stunned. Often we don�t think so much about birth and death until someone close to us � particularly a contemporary � or even someone younger than us, is suddenly dying, and then we get it that we are also impermanent. In that great Indian classic, the Mahabarata, there�s a passage where a great sage is asked: �Sir, of all of the things you�ve observed in life, what is the most amazing?� And he responds: �That a man seeing all around him die, never thinks that he will die.� That�s certainly the way I was until my friend Pat died. I was in a really agitated frame of mind. And in all of my agitation and searching around what I wanted to know was �Well, if you know you�re going to die, how do you live?� This is the important point of knowing that all of us die. It�s not just, �Oh sure, everybody dies; I�ll die someday.� It�s that � we never know. We never know. The important part of that is that it encourages us to really pay attention to how we live now. Because how we live is the most important thing. It may feel like we�ve got plenty of time to figure that out later. �Later. I�ll get around to that later. Right now, I�m going to do this.� But the very encouraging part about noticing that everything changes and this also changes is the reminder in the �Gakudo yojin shu� where Dogen-zenji says, �Ancestor Nagarjuna said:"
