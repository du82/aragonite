["https://chzc.org/Thanas3.htm"]
title = "The Oneness of Two - Talk by Katherine Thanas"
full_description = '''When we look at the surface of our lives, we make judgments such as "I'm a failure," or "I'm pretty good." "That was a great period of zazen or a terrible period." Although such views often alternate with each other, they can obscure the deeper truth that the alternation is the reality, and that "failure" can lead to a deep healing, "success" to suffering, or a "negative" experience to an opening of wholeness in our lives. Our discriminating minds surf ordinary consciousness in familiar patterns. To journey below the surface usually requires something unusual, a traumatic event. Sometimes this happens spontaneously and sometimes it happens through intention, through the will to face the circulating mind until deeper layers are reached. The imperative of dropping from the surface to the center arises when life brings us a situation we cannot resolve with our ordinary mind. We can call this situation a koan, something which appears as a paradox. A koan may also be a traditional case from the historical Buddhist record. Resolution of a koan can give us a direct experience of the oneness of life. Blue Cliff Record Case #2: "The Ultimate Path is Without Difficulty, Only Avoid Picking and Choosing" is a traditional koan which we studied recently to explore the basis of our decision making. In order to experience not picking and choosing, each student selected a situation in his or her life and took on the practice of being choiceless in that situation for one week in order to experience freedom from choice, the very point the koan is addressing. Practicing with the precepts invariably leads us into the realm of picking and choosing. Most precepts address areas of our lives where self-interest conflicts directly with the interests of others. Precepts provide endless opportunity to catch the wriggling of the body-mind. One of the three pure precepts is "Embracing and Sustaining all Beings." In the Lotus Sutra, there is a story of a monk who went around bowing to everyone and saying "I would never disparage you, because you will become Buddha some day." He relinquished study, incense offering and other practices, and simply bowed deeply to everyone. That was his sole practice.'''
