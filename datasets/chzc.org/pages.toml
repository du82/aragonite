["http://chzc.org/dharma-talk-on-intimacy-by-choro-carla-antonaccio.htm"]
title = "Dharma Talk on Intimacy by Choro Carla Antonaccio"
description = "Dharma Talk on Intimacy by Choro Carla Antonaccio"
full_description = '''I want to talk about intimacy. The word crops up in Zen stories; and, like the word "love", has a lot of baggage in English. Let me start with the baggage. Intimacy is something many of us both long for and fear. As a young person I myself longed, I yearned, for closeness with someone or something, a closeness that in my hopes and dreams included a meeting of the minds, of words and ideas, but also that transcended words. Understanding without words. As I felt that my real self was a secret self that I dared not fully disclose, to anyone, I thought that the intimacy I craved would be a kind of secret sharing — a knowing, in a way that needed no explanation. I carried all of this right into practice, of course. So, I was intrigued when I encountered the use of the term 'intimacy' in Zen, because it is a critical aspect of our practice. Indeed, it is our practice. Now, the roots of our word intimacy are Latin, intimatus, as in "my intimate friend", and the verb intimare, which means to make known, to announce, to impress. The prefix "-in" is in this case an intensifier. When I first said the word intimacy a moment ago, you might also have been thinking of its use as a kind of polite, oblique or even sweet way of talking about sex. We talk about sexual intimacy because of intimacy's associations or synonyms: closeness, togetherness, affinity, rapport, attachment, familiarity, friendliness, friendship, amity, affection, warmth, confidence. Those are the things I wanted in my life — affinity, closeness, confidence. And I think these are the resonances that we may carry into our reception of the word in Zen. So, just what is intimacy in Zen? My point of departure for the Zen of intimacy are stories from the koan collections. The first is Case 20 from the Book of Serenity: Dizang asked Fayan, "Where have you come from?"Fayan said, "I am going around on pilgrimage." "What is the purpose of your pilgrimage?" asked Dizang. "I don't know," said Fayan. "Not knowing is most intimate" said Dizang. Fayan was suddenly awakened.'''
year_published = 2025
