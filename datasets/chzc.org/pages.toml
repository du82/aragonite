["https://chzc.org/Thanas4.htm"]
title = "We Live in the Lives of Others - Talk by Katherine Thanas"
full_description = "In a recent essay poet Jane Hirshfield writes: At Ryoan-ji in Kyoto there is a famous rock garden; wherever in it a person stands, one of the fifteen rocks cannot be seen. The garden reminds that always something unknowable is present, just beyond what can be perceived or comprehended�and that something is as much part of the real as any other stone amid the raked gravel. Her beautiful essay reminded me of what one reviewer said about the late poet Philip Whalen: he was not the best known of the Beat poets, but his experiments and writing allowed them to write the work they wrote. You might say Philip's contribution is hidden in the work of others. We live in the lives of others, sometimes acknowledged, sometimes not. These unrecognized connections among us are included in what we call our interdependent existence. In our last newsletter, Kobun Chino-Roshi said: how to know your true self is something we cannot do alone. We have to do it with someone who is able to accept our vow. We have to practice with someone who is big enough to receive our deepest self, our deepest intention, and turn us to it again and again. Our true nature, our true self, is hidden in our consciousness, hidden from ourselves. A true teacher like Kobun-Roshi or Suzuki-Roshi sees our true nature. In seeing and speaking to it, they allow us to also believe in it, in our openness, receptivity, generosity, non-resistance, loving kindness. What is known and not known by us about our inner motivations and intentions is the investigation of practice. We know on one level, we don't know on another. In her essay, Jane quotes Michael Dickinson on our contradictions: We are most comfortable being hidden, but we yearn to be seen. I would add, we are quite fearful to see our inner mind, we fear what demons might lurk there. But the gift of practice is to allow us to gradually be drawn into the realm of the unknown, and, accompanied by a trustworthy friend, to enter there. In Christianity, the self measures or experiences itself by its receptivity to God or the Unknown. In Buddhism there is no permanent identifiable self. The reality we call self, which seems to do the work of liberation, is a continuously changing continuum, changing on each breath. Within the self there is an Unchanging Self which journeys through these changes and knows itself only as this endless transformation. Not hidden, but also not seen."
year_published = 2025
clearnet = "https://chzc.org/Thanas4.htm"
