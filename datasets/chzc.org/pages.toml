["http://chzc.org/Thanas.htm"]
title = "The Bodhisattva's Life"
description = "Zen practice talk on driving a car"
full_description = 'Some time ago, as I was driving in town, doing my usual driving practice of skimming and snaking in and out of the flow of traffic, taking advantage of every opportunity so as not to have to slow down for traffic signals, the following thought arose, "The Bodhisattva doesn’t try to get ahead of anybody, even on the freeway." Insights, when they arise, are so obvious. Our practice seems to be always to arrive at the obvious. When Master Dogen (founder of the Soto tradition in Japan) returned from his pilgrimage to China, he described his realization as: "My eyes are horizontal, my nose is vertical." Pretty obvious maybe, but the depth of his realization was bottomless. I don’t claim to have realized this traffic practice as deeply as Dogen, but it was clear to me that this insight about driving arrived with a great force because I needed to learn how to co-exist with every other driver on the road. The Bodhisattva is willing to be stuck in traffic, is willing not to get the advantage in traffic. The Bodhisattva is willing to be in situations without an advantage. That was a big realization for me. The Bodhisattva’s way is to realize we are one body – to deeply realize that condition. The elbow cannot get ahead of the stomach; the hand cannot go ahead of the foot. If a wart develops under the big toe, the whole body limps. The idea that I can get ahead of anybody is a perverted view. Each of us exists absolutely, on our own absolute unconditioned nature. There is no comparison between being in my dharma position – exactly where I am in my life – and everyone also being in their dharma position, exactly where they are in their lives. There is nothing to compare. You are you, yourself. I am exactly me, myself. You and I are not in competition for insight and wisdom. We complete each other. If I have any understanding that you don’t resonate with, it’s of little use to me. Notions of "ahead" and "behind" are simply relative to our point of view. The foot behind is relative to the foot in front.'
year_published = 2025
