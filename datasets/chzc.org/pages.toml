["https://chzc.org/a-talk-by-nyugen-liz-moore.htm"]
title = "A Talk by Nyugen Liz Moore (1943-2018)"
description = "Josho Pat Phelan's Dharma Talk on The Nature of Vows and Precepts"
full_description = "Though the circumstances leading to this occasions are unclear, one night an extremely wealthy man and a very poor one found themselves sharing a room in a small village inn. In exchanging stories of their lives, the rich man was filled with compassion for this destitute fellow. In the middle of the night, the rich man decided to give this poor fellow a gift, one of great value. He took the man's jacket, ripped a small tear in the lining, and dropped a breathtakingly beautiful pearl into the dark space. After carefully sewing the lining back into place, he stretched out on his pallet. Then, thinking about the coming dawn and the joyful surprise his new acquaintance would feel when told about the gift, the wealthy man fell soundly asleep. Waking with the sun in his eyes, he quickly realized he was alone. His fellow traveler had vanished. Neither the innkeeper, nor anyone in the street could help. No one had witnessed his departure. Eventually giving up the search, the rich man continued on his way. Over time, the poor man found himself in even more dire straits, often going to sleep hungry and cold, often wishing for stale bread to eat, always wishing for something more. Many years later, the two men met again. The rich man was filled with joy at finding his lost friend and told him what he had done that long ago night. Aghast, the poor man tore off his tattered coat, shook it inside out, ripped open the lining and there it was — the precious pearl, his during all those years of poverty and despair. This is, in many ways, a very sad story, a being somehow managing to exist, but barely so, and all the while, practically next to his skin, lay great wealth. Even as my heart goes out to him, my mind begins to churn. Could he not remember the weight of his jacket, the way it hung on his shoulders? Why in all that time had he not sensed the presence of this jewel, a jewel who's creation could be traced to a small bit of grit that over years of being covered with layer upon later of still hidden luminosity, had grown incredibly large by the time it was harvested? This magnificent jewel must have rolled under his fingers. Must have announced its presence every time it came into contact with the nerve in his elbow, or pained his bony skull as the thin material hiding the pearl served as his pillow. Couldn't he sense that there was something between the lining and the coat itself?"
