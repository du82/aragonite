["https://chzc.org/SR2.htm"]
title = "How to Observe the Precepts"
description = "Suzuki Roshi on Zen Precepts"
full_description = 'Given on May 17, 1970, published in the Winter, 1983 issue of the Wind Bell (San Francisco Zen Center) As a Zen student we put emphasis on our everyday practice, including zazen practice. And when you think about how to cope with the problems you have in your everyday life, you will realize how important it is to practice zazen. Only the power of practice will help you in a true sense. For instance, when you hit the mokugyo, or wooden drum, if you try to control the chanting, if you think, "This is too fast, so I must make the chanting slower," or "Oh, this is too slow, I must make it a little bit faster," if you try to do it by way of your hand or your mind, it doesn�t work. Only when you do it from your hara* by the feeling you have in your zazen practice, can you do it. Just by your mind or your hand, you cannot do anything. It does not work. The students will not follow your mokugyo. Only when you do it with your zazen power can you control it. When you can control yourself very well without having any idea of controlling anything; when you set the right pace, then you can control yourself. And when you can control yourself just as you sit in zazen posture, then you can control the chanting perfectly. This is also true with your everyday practice. In your zazen practice you just sit. You have no idea of attaining anything. You just sit. What do we mean by just sit? When we just sit we already include everything and we are not simply a part of this cosmic being � we are one with everything. This is just an explanation, but the feeling is that you include everything, and actually this is not true just for zazen. When you drink a cup of tea, that activity includes everything. Actually it is so. When you say this is tea, and this is me, it does not include everything � you are here and tea is there. This is just tea and it does not include everything. But when you drink it without any idea of tasting what it is, being completely one with the tea, then you have no idea of tea and no idea of you. This activity includes everything. So, as Dogen Zenji said, if your everyday activity does not include everything, it is not Buddhist activity. It seems almost impossible to feel that way, but actually if you realize, if you experience what is zazen practice, then you will understand what is our everyday life and how everyday life should be for yourself, for others, and for each activity. You will realize that each activity should be zazen.'
year_published = 2025
clearnet = "https://chzc.org/SR2.htm"
