["http://chzc.org/Thanas2.htm"]
title = "Just Sitting, Just Meeting - Talk by Katherine Thanas"
full_description = '''Words cannot explain, because this method is unfabricated. The practice of "just sitting" doesn�t interfere with the mind and body�s own course, rhythm, timing. It simply brings attention. There is no technique by which to rush this process. And yet, within this unfabricated practice of just sitting, we fabricate endless expectations, assumptions, hopes, dreams, terrors. It has taken me years to begin to understand the depths of zazen. Buddha sat in meditation until he saw through his conditioned mind, and what he transmitted was the inspiration to follow his example, to sit until we understand the patterns and distortions of our own consciousness. Like Buddha's successor Mahakashyapa who "pounded his bones and crushed his body thousands of times" until "his face was no longer his own" we sit until our face is no longer our own. As it is said, "Thus he received (Buddha's) face by means of face-to-face transmission." True intimacy occurs when we directly experience reality for ourselves. Transmission, or true understanding, does not come from someone else, nor can we transmit to someone. We transmit to ourselves. Each one must find intimacy directly. Not through our thinking mind, but from immediate direct experience prior to the mind�s mediation. True intimacy, unmediated experience, can be practiced anywhere, but in the zendo or in the dokusan room, where our activities are limited to "just meeting," opportunities for being intimate are increased. During a recent sesshin, while I was offering a stick of incense at the altar, the incense met the ash in the incensor intimately. The ash was thoroughly sifted and totally received the stick�there was no resistance, nothing to push against. The experience left no trace. In our usual morning service, the attendant offers me the incense and we bow together. That moment of the stick being passed from hand to hand is most intimate. Because we are in the zendo we can notice such intimate moments. Each morning the meeting happens for the first time. We notice when attention wanders. This moment is especially profound in the stillness of the zendo.'''
