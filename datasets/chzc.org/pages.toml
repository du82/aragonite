["http://chzc.org/Precepts2.htm"]
title = "Receiving the Precepts, Part 2"
description = "Receiving the Precepts and Taking Refuge in the Three Treasures"
full_description = 'The repentance verse is, "All my ancient, twisted karma, from beginningless greed, hate, and delusion, born through body, speech, and mind, I now fully avow." Repentance is a kind of purification which is done before receiving precepts. In repentance, we acknowledge our endless and beginningless, our inexhaustible delusion which propels us into birth and death. In the Indian, or Indian Buddhist, world view, there is no beginning or first cause the way we think of it in the West, where time, or the origination of the universe, is considered to have a definite beginning and end, with a long middle in between, which progresses from the past to present to future. The early Buddhist world view considered existence or reality to be more like a spiral without any beginning or end. In Returning to Silence, Katagiri Roshi said that repentance in Buddhism means perfect openness of heart. If we open ourselves completely, we are ready to listen to the voiceless voice of the universe. He explained that, "The ritual of repentance is not to ask forgiveness from someone for what one has done. Repentance is not a preliminary stage to enter Buddha�s world or to become a good person." He said, " If repentance is understood in this way, we fall...into the trap of dualism, a big gap is created between us and whatever object we try to make repentance to.... Real repentance cannot be found in dualism....[Repentance in Buddhism] is the perfect openness of our hearts that allows us to hear the voice of the universe beyond the irritation of our consciousness." When he said, "The ritual of repentance is not to ask forgiveness from someone..." and so on, sometimes I think he was referring to formless repentance and other times I think he meant formal repentance. In either case, in Zen we don�t come together as a community to confess and repent as was done on the full moon and new moon in early Buddhist monastic communities. But this doesn�t mean that when you do something hurtful, you don�t need to apologize. Since the realm of our human relationships is the realm of the conventional world of duality, I recommend apologizing to the person involved in whatever happened. But in Zen we don�t have a ritual of apologizing in front of a third party. In Buddhism, feeling regret or remorse is considered an important dharma, or factor of mind, but this shouldn�t be confused with the added burden of guilt. When you cause harm, knowingly or unknowingly, as we all do, and when you realize it, I think it is healthy to feel regret and to express that by apologizing.'
year_published = 2025
