title = "Zen Buddhism Events in Chapel Hill, North Carolina"
description = "Zen Buddhism Calendar of Events, Meditation Retreats,  Ceremonies, and Notifications in Chapel Hill, North Carolina"
full_description = "View the CHZC Google Calendar of Events. Download the March-April 2025 CHZC Newsletter in PDF format. Sign up for email updates via the Chapel Hill Zen Center Email Announcement List. Please read our Adverse Weather Policy. Jump directly to a section: Programs & Events • Meditation Schedule & Instruction • Study Groups • Peer-Led Groups Looking Ahead • Volunteering & Support • Resources & Announcements Sunday mornings at 10:30 AM, following two periods of zazen at 9 and 9:50 AM. Everyone is warmly welcome to all or any part of Sunday morning's program. Josho Pat Phelan Roshi on March 2 Jakuko Mo Ferrell on March 16 Lance Ashdown will give a Talk on Practice on April 27 This class will introduce participants to meditation and give them support as they develop a daily sitting practice. It will also introduce them to other aspects of practice at the Chapel Hill Zen Center. Beginning Zen Practice will meet at the Chapel Hill Zen Center on Monday nights, and the cost is $60, payable the first night, and will be contributed to the Zen Center. Partial scholarships are available. For more information, or to sign up, please contact David Guy at (919) 641-9277 or davidguy@mindspring.com. The sitting begins with orientation on Saturday night at 7:30 PM which includes instruction in and review of the meal form. Since the form has many steps we encourage people to attend oryoki orientation more than once. The regular Sunday morning schedule, with zazen at 9 and 9:50, and Dharma talk at 10:30, will be open to everyone. All-day Sittings include zazen, a Dharma Talk, Dokusan, and a work period, as well as breakfast and lunch. It is alright to sit half of the day, but please sign up in advance, and please speak to Josho Roshi or Zenki Sensei if this is your first all-day sitting. The suggested donation is $15 for members, and $25 for others; however, if you are inclined to offer more, that would be very helpful in maintaining the Zen Center. Oryoki sets are available for use by those who do not have their own, and a $5 donation is appreciated. Please sign up by Wednesday, March 12 at info@chzc.org."
