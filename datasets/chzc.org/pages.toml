["http://chzc.org/David1.htm"]
title = "Lecture on Teaching Meditation"
description = "Lecture on Teaching Meditation"
full_description = "The fact that I don�t know how to meditate should probably be disturbing to this group, because I�m a meditation instructor here. Actually, I can give the instructions. One of the things I think about meditation�it�s like writing in this way�is that the longer you do it, the less you think you know about it. I used to know how to meditate. I don�t anymore. When I do give instructions, I always talk about the three major Buddhist meditative traditions in this country, Theravada Buddhism, Tibetan Buddhism, and the Chan/Zen tradition. I do that because I think it�s helpful, and because I was quite confused about those traditions when I began. Part of the reason was that my first teacher, Larry Rosenberg, was in the Theravada tradition, but really taught from all three traditions. He was just as likely to quote a Chinese master or the Dalai Lama as a Vipassana teacher, maybe more so. I�m going to be talking about Larry a lot, so maybe I should tell a little about him and about our relationship. I began studying meditation with him at the Cambridge Insight Meditation Center in 1991. I took a number of classes, and also did some all-day sittings and other retreats. Even after I returned to North Carolina in 1993, I continued to do retreats with him, at least one and sometimes two per year, until this year, when our schedules didn�t mesh. In 1995 or so, I interviewed him for a magazine, and we decided at that time to do some writing together. We have published two books, Breath by Breath: The Liberating Practice of Insight Meditation, and Living in the Light of Death: On the Art of Being Truly Alive. Writing the books has deepened our relationship, and I�ve learned a lot from the process. Larry has bounced around in different spiritual traditions. He started off as a student of the Indian teacher J. Krishnamurti. Krishnamurti famously taught that truth is a pathless land, but Larry felt he needed a path and some structure, so he studied in the Hindu Vedantic tradition for five years. After that he began studying Buddhism, for five years with the eccentric and colorful Korean Zen teacher Soen Sunim, then for a while in the Soto Zen tradition with Katagiri Roshi and others. Finally he discovered the Theravada tradition, and has taught Vipassana meditation since that time. He teaches both in Cambridge and at the Insight Meditation Society in Barre, Massachusetts."
year_published = 2025
