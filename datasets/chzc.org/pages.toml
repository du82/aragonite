["http://chzc.org/canton1.htm"]
title = "Returning to the Source"
description = "Travel diary of a visit in Fall 2011 to Japanese Soto Zen temples"
full_description = 'I was truly elated to realize that Suzuki Roshi�s son, Hoitsu Suzuki Roshi, had come to Tokyo for the event. He was sitting in the lobby and bowed to us as we entered; I recognized him from pictures. I asked Rev. Fujita to introduce me and Roshi warmly grasped my hand while repeating, "North Carolina!" His humor and playfulness reminded me of his father�s presence as recorded on video, and the photo here does not do him justice. Meeting him was one of the two real highlights of the trip. The next day, morning service was held at the hotel, we took a tour of the Soto Zen organization�s offices adjacent to the hotel, and then set out by bus to visit Chokoku-ji, the official branch temple in Tokyo of Eihei-ji monastery, founded by Dogen in the mountains near the eastern coast of Japan. There we observed a service in honor of Bodhidharma, the Indian monk who brought Zen to China. A major attraction of this temple is the huge statue of Kannon (Kwan-yin in Chinese, and Avalokitesvara in Sanskrit), the bodhisattva of compassion, which was carved from a single enormous cedar. Next was a second symposium arranged for us at a branch campus of Komazawa University, a Soto Zen university where many priests are schooled. This second symposium focused on Soto Zen history where I learned that at one time there had been an intense rivalry between Eihei-ji and Soji-ji, the two head training temples of Soto Zen, and that Eihei-ji sought to prevent Soji-ji from relocating after its destruction by fire in 1898. Soji-ji is near Yokohama, south of Tokyo on the coast. Originally founded by Keizan Jokin, who is therefore honored as the second founder of Soto Zen in Japan, it was originally located on the Noto peninsula in Ishikawa prefecture. After its destruction by fire in 1898, the location was moved closer to Tokyo. Though the buildings are only 100 years old, you are transported back to the medieval period as soon as you enter the gate. We arrived in time to have a beautifully prepared bento box dinner, hear a dharma talk by the head of training, take a Japanese style bath and collapse into bed. In groups we shared very nice guest rooms with tatami mats and futon on the floor; my companions were the Rev. Dai-En, her students and another American practitioner from Great Vow monastery in Oregon. On our trip down two floors to the communal bath, we discovered many, many lay people from Japan getting ready for a veritable slumber party in all the large spaces throughout the temple. It was clear that the event the next day was going to be a large one.'
