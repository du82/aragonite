["https://chzc.org/genjokoan-talk-by-sojun-mel-weitsman-roshi-part-1.htm"]
title = "Genjokoan Dharma Talk by Sojun Roshi, Mel Weitsman, Part 1"
description = "Genjokoan Dharma Talk by Sojun Roshi, Mel Weitsman, Part 1"
full_description = '''I think it's important for everyone to have some understanding of "Genjokoan" since our practice comes from Dogen as well as our understanding. When you study his Shobogenzo you can see how each fascicle relates in some way to this one fascicle. Since "Genjokoan" is the touchstone for the whole Shobogenzo, Dogen's most well-known collection of writings, it's important to have some feeling for it. First, I'll talk about the title "Genjokoan." Genjo means something like "manifesting in the present" or "the immediacy of the present." There are various ways that we can look at the term, koan, but I think that in the case of "Genjokoan" what follows is the best explanation. Ko means "equality" and an is "difference," or "momentary." Ko is like "even" or "still": that with which everything can identify. An is particular, vertical, active, something individual. Where the vertical and horizontal meet is genjo—this, right now, all inclusive moment. Translators have different interpretations for the title. Kim says, "The Realization Koan." Cleary says, "The Issue at Hand." Maezumi says, "The Issue of Life." Kaz Tanahashi uses, "Actualizing the Fundamental Point." So there are these various ways people translate the title, all of which have validity. Where the vertical and the horizontal meet is called the Dhama Position for each thing. Everything has its Dharma Position on each moment, and the Dharma Position of each individual existence is absolute as well as relative. An is an expression of ko, and ko is the essence of an. An is ko and ko is an and ko is ko and an is an. Dogen's first paragraph presents four propositions. These four propositions form the cornerstone of the whole fascicle. The rest is elucidation. Although there are several ways to look at these four propositions, I will present the one most people agree is Dogen's. He begins by saying, "When all dharmas are buddha-dharma there are enlightenment and delusion, practice, birth and death, Buddhas, and creatures." Then, the second one, "When the ten thousand dharmas are without self, there are no delusion, no enlightenment, no Buddhas, no creatures, no birth and no death." The third one, "The Buddha Way transcends being and non-being; therefore there are birth and death, delusion and enlightenment, creatures and Buddhas." The fourth one is, "Nevertheless, flowers fall with our attachment and weeds spring upwith our aversion." These are four ways of looking at reality from the point of view of enlightenment.'''
