["http://chzc.org/edbrown.htm"]
title = "Sesshin Lecture by Ed Brown"
description = "Zen practice talk during sesshin"
full_description = '''Here we are again, sitting together...breathing. How is it for you? How is your breath? Relaxed? Tight? Smooth? Jerky? Shallow? Deep? How is the body and mind of the present? The breath of the present? Welcome home. Here we are. Welcome to the indescribable present. An old Zen teacher once said, "Just to take this posture is to have the right state of mind." Funny business, this "right" state of mind, because it is not right compared to something wrong. This "right mind" is not determined by comparing, judging, evaluating, or measuring, so you cannot say, "Ah ha, now I've got it!" Right mind is exactly here. How is it for you? And exactly here is not something special--it's just not "somewhere else." So this week, during meditation, we practice being here, exactly here: walking, sitting, standing, lying, breathing, eating, or working. Don't go off somewhere else, and, if you do, come back. That's a joke, you know, because where else could you be but here! Yet we need to do it, to practice being here. We think that, "if I do what I am supposed to do, everything will work out just the way "It" is supposed to work out." Of course this is ridiculous but we still believe it. I mean, really? Starting when? How could you decide, how would you ever know that you were doing what you were supposed to be doing? When everything works out the way it is supposed to work out right? And since that never happens, you know you must have done something wrong. "But I just did what I was supposed to do." Fine, but does the universe actually work that way? What a bind to put yourself in. So, instead of asking what you are supposed to do, try asking, "What do I really want...what do I really want right now, exactly here?" Asking this question may seem quite formidable, it may seem difficult. Just doing what you should was so simple and now you have to figure it out: "Oh me, oh my, it would be up to me! I'd have to decide. I could be blamed. What am I to do?" So what do I really want? Do I really think it is possible to make everything work out just the way it is supposed to work out, if only I behaved properly, correctly, or perfectly? No? Then what do I really want? This is something to work on, something that may require some digging. Do I want to control things better? Or, realizing that I cannot control things, do I want to find composure right on this spot? Do I want to be the slave of every whim that comes along? Or do I want to be free and unmoved? Do I want to be stonelike and unmoved, removed? Or in intimate contact, touching and touched by others? To find out what I want I have to dig and I have to sift, to sort through a lot of earth. Hard work, heavy work, a coming down to earth, but how else will I be able to take root, moment after moment, exactly where I am?'''
year_published = 2025
