["https://chzc.org/habits-and-hindrance-by-jakuko-mo-ferrell.htm"]
title = "Finding the Compassion in Zen by Zenki Kathleen Batson"
description = "Finding the Compassion in Zen by Zenki Kathleen Batson"
full_description = "Our sangha has four members sewing rakusu preparing for lay ordination next spring. In the ceremony they will vow to uphold the precepts. Starting last February, we and other community members began studying the precepts together by reading and discussing the book, Waking Up to What You Do by Diane Eshin Rizzetto. I think we all found her book to be a refreshing examination of all the nuances that practicing the precepts contain. One of the things she emphasizes throughout the book is to meet every situation with intelligence and compassion. To do this by recognizing we usually have automatic reactions to situations. She recommends that we try to notice and explore our underlying feelings in each situation that might cause a reaction out of habit instead of finding a new compassionate way to respond. What helps this process of awareness, I think, is that she presents the precepts not as a list of do not and should not, but as a list of aspirations, so that instead of tending to judge yourself every time you break a precept, you can meet each moment and situation with fresh clarity and compassion for yourself and others. Looking deeply at the precepts, we discovered that each one is like a multifaceted gem. If you just think of them as a list of “do not’s” it can limit your response. You might not know what to do. You might even do more harm than good. This is why Diane and her teacher Joko Beck began to teach precepts as aspirations to protect life, and be present. Then in the moment act in accord with supporting life. As she says,” this approach more accurately expresses the spirit of the precepts as pointers, directing us toward our natural propensity to take action out of love and concern for one another. Secondly, when voiced in the prohibitive form, it seems more likely that we will rely on them as an outer authority that judges and keeps score.” It seemed to those of us in class that the simplest precept has many layers and complexities. You really can’t rely on just “don’t do it.” If you do, the precepts are impossible not to break. When we take up just ‘do not kill or do not speak falsely’, that is not always the best action to take. We must be aware of the situation we are in at this moment, if we truly want to practice ‘do no harm but support life.’ The best thing to do or say is not necessarily simple or the same in one time as another. Getting through an hour or day without breaking one precept is challenging, maybe it’s impossible. It helps if you take a breath and a pause before speaking or acting. Then you have a better chance to respond considering this moment, and refrain from reacting in your habitual way."
