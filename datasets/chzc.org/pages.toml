["http://chzc.org/SR7.htm"]
title = "Zazen, Rituals & Precepts Cannot Be Separated"
description = "Suzuki Roshi on Zazen, Rituals & Precepts Cannot Be Separated"
full_description = 'First, I do it because I have been doing it for a long time so there is no problem. I tend to think that because I have no problem in observing my way, then you must not have a problem [laughs]. But you are Americans, and I am Japanese, and you have not been practicing the Buddhist way for so long, therefore there must be various problems [laughs]. These problems are almost impossible to solve. But if you actually follow our way I think you will have some understanding of our rituals. What I want to talk about is the precepts. Precepts for me includes rituals. And when we say "precepts," it is another name for our zazen practice. For us, zazen practice and observation of rituals are not two different things. How to observe the rituals is how to observe the precepts. Our practice, especially in the Soto school, puts emphasis on everyday life, including rituals, eating, and going to the restroom. All those things are included in our practice. As you have some way of sitting on a black cushion, we have some way of observing our rituals or ceremony in the Buddha Hall. The point of our zazen practice is to be free from thinking mind and from emotional activity. In short, that is the practice of selflessness. In our observation of rituals, the point is to be free from selfish ideas. The practice of rituals is the practice of selflessness. First you enter the room and you bow. In Japanese we say gotai tochi. Gotai is "our body." Tochi is "to throw away." It means to throw away our physical and mental being�in short, to practice selflessness. We offer ourselves to Buddha. That is the practice of bowing. When you bow [to the floor], you lift your hands. We lift Buddha�s feet, which are on your palms and you feel Buddha on your palms. So when you practice bowing, you have no idea of self. You give up everything. When Buddha was begging, his follower spread his hair on the muddy ground and let Buddha walk over it. That is supposed to be the origin of why we bow. In ritual, you bow and work. You begin everything by some signal. That kind of thing you may not like so much [laughs]. It looks very formal, to begin everything by the sound of a bell. Whether you want to do it or not, you must do it. It looks very formal. As long as you are in the Buddha Hall, you should observe our way according to the rules we have there. We do it to forget ourselves and to become one. To be a Zen student in this Buddha Hall is why we observe our rituals.'
year_published = 2025
clearnet = "http://chzc.org/SR7.htm"
