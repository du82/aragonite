["https://chzc.org/genjokoan-talk-by-sojun-mel-weitsman-roshi-part-2.htm"]
title = "Genjokoan Dharma Talk by Sojun Roshi, Mel Weitsman, Part 2"
description = "Genjokoan Dharma Talk by Sojun Roshi, Mel Weitsman, Part 2"
full_description = '''To study the Buddha way is to study the self. To study the self is to forget the self. To forget the self is to be enlightened by the ten thousand dharmas. To be enlightened by the ten thousand dharmas is to free one's body and mind and those of others. No trace of enlightenment remains, and this traceless enlightenment is continued forever." Next we come to this part, which is really the heart of the Genjokoan. It's where Dogen expresses or delineates the path of practice: "To study the Buddha Way is to study the self." But this word "study" is not quite the right translation. I don't know what the right translation is, exactly. Maezumi Roshi said, when he translated this word as study, that it means more like "practice." It means when you do something over and over, day in and day out it saturates our body and mind. It's not like studying a book. It may be like playing the piano over and over, or like sitting zazen, day after day. It's the self becoming the self. Then, "To study the self is to forget the self." This is what Dogen calls, "To drop body and mind." According to Buddha Dharma there is no inherent or substantial, independent self. So how can you study something that's not there? Of course, there is a self but its's a self that is not a self. So, we practice dropping small self, allowing big self to emerge. Then, "To forget the self is to be enlightened by the ten thousand dharmas." This is to merge with things; to see the universe as our own true self. He then says, "To be enlightened by the ten thousand dharmas is to free one's body and mind and those of others." As Shakymuni said when he was enlightened, "All beings in the universe have the same nature as myself." To free one's body and mind and those of others; no trace of enlightenment remains, and this traceless enlightenment is continued forever. He doesn't say that enlightenment doesn't remain, but that we should be careful not to get stuck there. These five sentences reflect Master Tozan's Five Ranks. You may be familiar with Master Tozan's five positions depicting the relationship of oneness and diversity. Tozan also presented the Five Ranks as stages of practice. Dogen discouraged using the Five Ranks as a system, but absorbed and presented them in his own way. These five sentences are what we believe is Dogen's presentation of Tozan's five ranks, presented as a kind of progression for practice.'''
