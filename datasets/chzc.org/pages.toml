["http://chzc.org/dharma-talk-by-daigaku-rumme.htm"]
title = "Dharma Talk by Daigaku Rumme"
description = "Dharma Talk by Daigaku Rumme"
full_description = '''It is a great pleasure to be back at the Chapel Hill Zen Center and an honor to give the Dharma Talk. This morning, I am going to talk about two stories from China. These stories provide a structure for me to speak about the question: what is it that must be done in Zen practice? One of the great things about these stories is that if we put ourselves in the shoes of the person asking the questions, it's possible to really make these stories our own. The first story has to do with a monk named Hyakujo who was one of the great Zen masters in Chinese history and is well-known because he was the first person said to have formulated the standards for monastic life in China. At a certain time in Chinese history, the monks at Zen temples had to work to provide their food. They had to grow their own food, and consequently, work became an important part of their practice. This story about Hyakujo contains a well-known teaching attributed to him, "A day without working is a day without eating." Our meal chant includes, "We reflect on the effort that brought us this food and consider how it comes to us. We reflect on our virtue and practice and whether we are worthy of this offering." Through the words in this chant, we are being asked to consider how the food we eat comes to us. Are we worthy to receive the offering of food we are going to eat? The Chinese character for rice can be read as "eight ten eight," in other words, the number "88." This is said to mean that it takes eighty-eight steps to bring rice to the table so we can eat it, and it indicates that it takes a lot of work to grow and produce rice. In the monastic standards, it specifically mentions that physical work was an important element of practice; that all people in the monastic community were expected to come out and work, even the abbot of the monastery. However, as Hyakujo got older — maybe around eighty years old, his disciples became concerned about him. They thought, "He's coming out every day with his hoe to work in the fields, weeding the vegetables and so on. So, why don't we hide his hoe? That way, he won't be able to work." The monks' plan sounded like a good idea but when Hyakujo came out the next morning and couldn't find his hoe, he said, "If I can't find my hoe, I'm not going to eat." His disciples then thought maybe that wasn't such a good idea. They explained to him that they thought he was getting too old to work. But Hyakujo said, "No. If I'm going to continue living and practicing here, I'm going to work in the garden." So, they returned his hoe to him and he continued working in the vegetable fields. This was the origin of his teaching, "A day without working is a day without eating."'''
year_published = 2018
