["http://chzc.org/giving-thanks-dharma-talk-by-zenki-kathleen-batson.htm"]
title = "Giving Thanks, a Dharma Talk by Zenki Kathleen Batson"
description = "Giving Thanks, a Dharma Talk by Zenki Kathleen Batson"
full_description = '''This coming Thursday many of us will celebrate Thanksgiving. I have always associated this day with the 3 F's, family, food, and football. It is an opportunity to reflect on the bounty of my life, and to give thanks for my incredibly good fortune. However, this doesn't seem like the main theme of this holiday to me any more than other holidays. I grew up as many American children did, with a pretty inaccurate understanding of Thanksgiving as also being the celebration of a historical event. As a child, I remember wondering how Squanto learned English, and think I was told that English fishermen taught him. It wasn't until I was much older that I learned that Squanto was abducted by an Englishman and sold into slavery in Spain. And, that he made a pretty epic journey to return to his home, what he knew as the village of Patuxet. As a child, I also learned that the Pilgrims found what they believed to be a God-given land. It was beautiful and ready for them to settle and farm, complete with cleared fields. I learned much later that the reason the land was so ready to settle was because only a few years prior to their arrival, it had been the flourishing village of Wampanoag people called Patuxet, Squanto's home. The reason it was available to them was because pretty much every inhabitant of the village had died from a plague brought by foreigners. Plagues were decimating what was originally a large and flourishing population of people on the continent. (Lies My Teacher Told Me — J. Loewen) Over the years I have learned many more details about the complex and often unpleasant history of the events I was originally taught to label the first Thanksgiving. Similarly, as I have matured and studied Buddhism, I have learned more details and some uncomfortable realities about how I have viewed gratitude itself and the act of experiencing thankfulness. When I think of the prayers I heard my father or grandparents say before meals, I remember always hearing a list of things for which they felt gratitude. This gratitude was very real and very heart-felt. When I think of Thanksgiving as a bountiful feast, I naturally think of meal time and the meal time prayer and how we approach meal time here at the temple. At the beginning of our meal chant, we say "Now we open Buddha Tathagatha's eating bowls, may all be free from self-clinging." But in a different version I learned of the meal chant this is worded:'''
year_published = 2019
