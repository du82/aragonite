["http://chzc.org/Nonin.htm"]
title = "Santoka Taneda (1882-1940)"
description = "Lecture by Rev. Nonin Chowaney on Japanese haiku poet Santoka Taneda"
full_description = 'My favorite collection of Santoka�s poetry translated into English is Mountain Tasting, translated by John Stevens. In his introduction to the book, Stevens recalls the circumstances by which Santoka became a monk, "Near the end of December 1924, Santoka, drunk and apparently intent on committing suicide, stood in the middle of some railroad tracks facing an oncoming train. The train screeched to a halt just in time, and Santoka was pulled out of the way. He was taken to a nearby Zen temple call Ho-on-ji. The head priest there, Gian Mochizuki Osho, did not reprimand or question Santoka; he didn�t even ask his name. The monk fed Santoka and told him he could stay at the temple as long as he wished." Mountain Tasting is one of my favorite books of poetry and, I�d like to introduce Santoka to those of you who don�t know his work and comment on some of his poems and the dharma contained in them. All of the poems we�ll look at are from Mountain Tasting and were translated by John Stevens. One of my favorite Zen Buddhist phrases, one that I�ve written in calligraphy many times is nyoze in Japanese. I translate this into English as "just this." The phrase represents our primary concern, what�s right in front of us � things as they are. In Santoka�s first poem, he faces "just this" squarely and walks on through the rain, getting wet. In the second, he�s begging and accepts what he�s given, "just this," the blazing sun. There is no complaining and no wishing for things to be different in either of these poems. I find this refreshing. All we can do is live what�s in front of us, whether we like it or not. What we think of it is really of no consequence, for thinking doesn�t change anything, nor do our likes and dislikes. When we lose a loved one, we grieve and walk on. When we get sick, we live it through till the end. Sometimes we get better; sometimes we don�t. What we think of any of this is beside the point. Last January, I had three emergency surgeries and almost died from complications afterwards. During the surgeries, my colon was removed, and I have an ileostomy. In other words, the end of my small intestine, the ileum, was routed up through my skin, and I poop into a bag attached to my lower abdomen. Periodically, I have to empty the bag into the toilet and change the bag itself every few days. Whether I like this or not is beside the point. This is my life: things are as they are. My poem about this would be:'
