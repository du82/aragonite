["https://chzc.org/genjokoan-talk-by-sojun-mel-weitsman-roshi-part-3.htm"]
title = "Genjokoan Dharma Talk by Sojun Roshi, Mel Weitsman, Part 3"
description = "Genjokoan Dharma Talk by Sojun Roshi, Mel Weitsman, Part 3"
full_description = '''Firewood turns into ash and does not turn into firewood again. But do not suppose that the ash is after and the firewood before. We must realize thatfirewood is in the state of being firewood and has its before and after.. Yet having this before and after, it is independent of them. Ash is in the state of being ash and has its before and after. Just as firewood does not become firewood again after it is ash, so after ones death, one does not return to life again. Thus, that life does not become death is a confirmed teaching of the buddha dharma. For this reason, life is called the non-born. That death does not become life is a confirmed teaching of the buddha dharma. Therefore death is called the non-extinguished. Life is a period of itself. Death is a period of itself. For example, they are like winter and spring. We do not think that winter becomes spring, nor do we say that spring becomes summer. This may be the most difficult to understand part of the Genjokoan fascicle. Here Dogen talks about firewood and ash, and uses this simile of firewood and ash to talk about birth and death. Suzuki Roshi says that you can explain it, but your explanation can't be perfect. In this world of constant transformations, we have the idea of continuity; of one thing following something else. We think of a progression from birth to childhood, youth, maturity, middle age, old age, and death. That is our experience. We are born, and we die, and then what? So, what is birth and what is death? That is the great matter, the great question. Dogen is not denying the progression of birth to death, but is emphasizing the immutable position of each moment's existence. It is usual to think in terms of discontinuous or segmented periods of time, like 9:00 o'clock or half past 10:00, or before and after. Something is happening now, something happened in the past, and something will happen in the future. That, of course, is a valid, usual way of thinking, but it's only one perspective on "Being/time."'''
year_published = 2025
