["http://chzc.org/patsbio.htm"]
title = "Josho Pat Phelan Roshi"
description = "Zen Teacher, Roshi, Abbess, Sensei, woman teacher, Buddhist woman"
full_description = "In the Spring of 1991, the Chapel Hill Zen Group asked the Abbots of the San Francisco Zen Center to send Taitaku Josho Patricia Phelan to lead the group. Pat was ordained in 1977 by the former Abbot of the San Francisco Zen Center, Zentatsu Richard Baker, who was Suzuki Roshi's successor. She has also studied with two of Suzuki Roshi's other disciples, Sojun Mel Weitsman and Tenshin Reb Anderson. Pat began sitting zazen in Oregon in 1969. She moved into the San Francisco Zen Center in 1971, and from 1972-1975 practiced at Tassajara Zen Mountain Center. Prior to her arrival in Chapel Hill in 1991, she was a Practice Leader and Director of Zen Center's residence facility in San Francisco. In the Fall of 1995, she returned to Tassajara and completed her training by receiving Dharma Transmission from Sojun Weitsman Roshi. In October, 2000, Josho Sensei was officially installed as Abbess of the Chapel Hill Zen Center. In December, 2008, Josho Sensei traveled to Japan to participate in Zuise ceremonies at Eihei-ji and Soji-ji temples. She is married and has a daughter. Zenki Kathleen Batson Ordained 2015, Shuso for a Kessei Ango in 2019, and received Dharma Transmission in 2023. She was installed as Vice Abbess in September, 2023. Zenki's Talks on Zen Practice. Kuden Paul Boyle Ordained 2003, Shuso (Head Monk) 2009, received Dharma Transmission in 2023, and leads the Forest City Zen Group in London, Ontario. Kuden's Talks on Zen Practice. Jakuko Mo Ferrell Ordained 2008, Shuso 2014, and received Dharma Transmission in 2023. Jakuko's Talks on Zen Practice. Choro Carla Antonaccio Ordained 2010, Shuso 2016. Choro received Dharma Transmission from Rev. Konjin Gaelyn Godwin in 2021 and is now Abiding Teacher at the Austin Zen Center. Choro's Talks on Zen Practice. Senmyo Jeff Sherman Ordained 2018. Previously, Senmyo practiced with Suzuki Roshi in San Francisco and Tassajara, and with Sobun Katherine Thanas at the Santa Cruz Zen Center. Eden Kevin Heffernan Ordained 2018, Shuso for a Kessei Ango in 2023, leads Richmond ZenRichmond Zen and is the Buddhist campus minister at the University of Richmond"
