["https://chzc.org/Hartman2.htm"]
title = "Right There Where You're Standing"
description = "Zen talk on Buddhist practice"
full_description = '''There's an old story about a sailing vessel off the coast of Brazil. The crew had run out of fresh water and when they spotted another vessel they signaled to them to please come and meet them, that they were out of fresh water, which is a very dangerous thing on the ocean. They were out of sight of land. And so they signaled, "We need water. We'll send some boats over." And they got back the signal, "Put down your buckets where you are." Although they were out of sight of land, they were where the Amazon River empties into the ocean. It's such a massive river that even out of sight of land, there is still fresh water. So, "put down your buckets where you are." Our practice and our realization is right where we are. There is nothing missing right here. In one of the enlightenment stories in the Dentoroku (Transmission of Light), the stories that Keizan Zenji compiled of the enlightenment experiences or koans related to each of the ancestors of the Soto lineage, there is one I want to share with you from Lex Hixon's translation in Living Buddha Zen (Transmission #40), Tao Ying to Tao P'i: This is like Suzuki Roshi's teaching, "You're perfect just as you are" or Matsu's "This very mind is Buddha." So, "since you already are such a limitless being, why be anxious about such a result?" So are we practicing just to express this limitless being, or because we think we're not a limitless being? And once we discover we are a limitless being, will we continue practicing? Well, of course. That's what limitless beings do. This is Dogen Zenji's practice-enlightenment, practice-realization. This practice itself expresses the limitlessness which is our essential being. Another one of the stories in this collection is (Transmission #37) Yao-shan to Yun-yen: This question comes up again and again throughout Zen history. This is what Seppo (Hsueh-Feng) asked the monks who came to his gate, "What is it?" And what Yun-men said, "What's the matter with you?" What is the business that brings us here? Please investigate this: "What is it?" "What is it you're doing here?" I don't ask you to look for the words for it. Words are secondary. I want you to find the feel of it. I want you to find the fire of it. I want you to touch the source of your life force, to feel the joy and the love that can come from living from the source of your being. This is taking refuge: to throw yourself completely into the aliveness of your life. It's pretty risky. You could lose yourself. There's nothing to hold onto.'''
