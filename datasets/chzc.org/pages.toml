["https://chzc.org/Wenger1.htm"]
title = "An Open Tradition"
description = "Lecture on the Idea of Tradition in American Soto Zen"
full_description = '''Reprinted by permission of the author from Issanji, newsletter of the Hartford Street Zen Center Fall, 1998 When I first came to Zen Center in the late 60's, there was a great rush to Americanize the Dharma. For example, there was an idea that we shouldn�t wear robes, we should wear denim fat pants, as if that was a freedom from a tradition. But could you imagine the tradition now if we had done that? Not that it was a bad idea, but we shouldn�t jump over our understanding of modern, American, Asian, Zen, and what all those categories are. We have come a long way since then into looking at that and incorporating cultural forms. We have a great opportunity now because many forms of Buddhism are coming at once. Traditionally, when you lived in a country, you came into contact with only one or two strains of Buddhism, or some alternate schools. But the whole brush of the tradition, as it comes through many different countries, lineages, and cultural adaptations, is now in front of us. Buddhism always adapts and infects the culture that it is involved in, because it�s just what you do, it�s how you live your life. So having an open tradition, a tradition that is open to the moment and doesn�t deny the past, is very important... Is tradition a set of understandings or behaviors, or does tradition put you on the stage where your life comes forth? It�s a bit mysterious. Buddhism is a very sophisticated set of teachings and practices that can help us experience "things as it is," but the danger is that we begin to think that the fingers themselves are what is important. Then we either want to eliminate the fingers of tradition or enshrine the tradition. We still had to find our own way. Any tradition may get you in the doorway, out of the sidelines and marginalization in your own life, but it takes our participation and humbleness about what the tradition is. The tradition may be wider or narrower than what we think, it may be longer or shorter, but we should know how it comes to us and how useful it has been.'''
year_published = 2025
clearnet = "https://chzc.org/Wenger1.htm"
