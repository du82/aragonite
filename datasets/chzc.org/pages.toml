["http://chzc.org/boyle2.htm"]
title = "The Han"
description = "Kuden Boyle's talk on the Han, a monastic time marking device"
full_description = '''"Clouds" symbolizes Zen monks, and the mountain refers to the monastery. So, we are the clouds gathering around Red Cedar Mountain Zen temple. I like this image very much. In our everyday lives, we are clouds following the currents of our own lives. But, during practice period we make that special effort to gather around the mountain. Great is the matter of Birth and death Quickly passing, gone, gone Awake each one, awaken Don't waste this life This verse, I think, offers excellent guidance regarding the attitude we should cultivate toward practice. It cuts directly to the point � we will die some day. Every one of us will die. There is no escape. Our mortality is an important backdrop which can help us frame our practice. The more we hesitate and procrastinate, the closer death comes and the less time to practice, less time to live our lives vividly. This verse can also be used to guide our attitude and effort during practice period. We can re-evaluate our priorities, and bring formal practice into focus and make it more vivid. The han is one of the ways we mark the sitting schedule at monasteries and Zen centers. The schedule in Zen practice isn�t about rigidity, but is a way to encourage selfless practice. Tenshin Reb Anderson, a teacher at the San Francisco Zen Center, relates a story in his book, Being Upright. He talks about practicing at a monastery where the practice period was headed by a frail and elderly Japanese monk named Narasaki Ikko Roshi.. Tenshin noticed that even though they lived equal distances from the meditation hall, the elderly monk always seemed to beat the relatively youthful and spry Tenshin in getting to the zendo first. He observed that when the han started the elderly monk started directly to the meditation hall, while Tenshin observed himself enmeshed in some activity which he was unwilling to let go of. This behavior contrasted poignantly with the practice of giving himself over to the schedule of the elderly monk. Before I started a practice period at Green Gulch Farm, I asked Sojun Roshi if he had any advice about how practice in a residential practice period. He said, "Follow the schedule completely." This turned out to be great advice. When I was a Tassajara I tried to follow the schedule wholeheartedly, noticing whenever my mind asserted a notion of "my time." Eventually, it became easier and easier to give up that notion of "my time." It turns out that what we take as "our time" is really only an idea that we superimpose on any moment. Monastic practice is an excellent way to bring clarity to this process of dividing up the moments in a day. When we follow the schedule completely, we don�t need to bother ourselves with these conceptions. For me, there is a sense of relief at letting go of these conceptions.'''
