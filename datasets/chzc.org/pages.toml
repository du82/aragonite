["http://chzc.org/boyle4.htm"]
title = "What Can We Learn From Painful Zazen?"
description = "Kuden Boyle's talk on practicing with painful zazen"
full_description = "When I give zazen instruction, I often mention that there are two major categories of pain when sitting zazen. The first type is characterized by sharp pains in the joints, electrical sensations in the legs, numbness or a deadness in the legs. This type of pain is our body telling us that our body is in a physically comprising position, and that we should change our position to alleviate the pain. The other type of pain possible in zazen is the achy muscle burn pain. I would also include having a tingling sensation when one's legs fall asleep under this category as well. As unpleasant and intense as this pain may be, it is not normally harmful to our bodies. In fact, experiencing such discomfort can be quite insightful. In 2016, I sat a 5-day sesshin, or meditation intensive, at the Chapel Hill Zen Center. I hadn't sat a 5- or 7-day sesshin since moving to Canada in 2012. I was a little nervous because I recalled when I first began sitting sesshins in the 1990s, I experienced some pretty intense leg pain while sitting zazen. I was afraid that my body had �back slid� to my1990s level of ability. As it turned out, sitting the 5-day sesshin wasn't that difficult for me, and, afterward it gave me an opportunity to reflect on how my practice has changed over the years. Before I first began sitting sesshins, I had considerable fear and anxiety about sitting for several days at a time. However, my desire to sit zazen was great enough for me to want to try to sit a sesshin. My first sesshin was a 3-day �Zen weekend�. Wow, my legs were screaming. Actually, it wasn't my legs screaming, it was my mind which was doing the screaming. The pain was very intense. I talked to my teacher about my fear of leg pain. She encouraged me to sit more sesshins. One year, I sat six 5-day sesshins. The pain was intense. During this time in my practice, I began to notice that it was my narrative about my physical discomfort which intensified the pain. I talked to my teacher and my teacher's teacher about this. They both said to be present with the pain. I couldn't understand what they were talking about. Staying present seemed impossible. After some time, I began to notice the compulsiveness of the narration. It was very interesting. On one hand, I knew intellectually that talking to myself about my leg pain was making it worse. On the other hand, I was observing that my mind's habituated tendency to make narratives or comments about my experience was beyond my conscious control. No matter how much I tried to suppress my narrative, I couldn't get myself to shut up."
