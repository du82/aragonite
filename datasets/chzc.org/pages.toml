["http://chzc.org/Mel4.htm"]
title = "The Heart Sutra Part 3"
description = "Zen practice talk on the Heart Sutra by Sojun Mel Weitsman, Abbot of the Berkeley, CA, Zen Center, Part 3"
full_description = 'Some people think this is what Buddhism is. There are a lot of monks who practice this way, cultivating a kind of cult to purity. After four or five hundred years, Buddhists realized that this is not the right way and that, actually, purity is also to be found in the impure, they are not two separate things. In Hinayana Buddhism, there is an attempt to cultivate nirvana by denying samara. Samara is the undulation of life, the way it moves, the ephemeral present. Hinayanists try to cultivate the eternal present by cutting off the ephemeral present. Then Mahayana Buddhism came along and said the ephemeral present is the eternal present, and the eternal present is the ephemeral present. We cannot separate them. The Heart Sutra says, Oh Shariputra, form does not differ from emptiness, emptiness does not differ from form, that which is form is emptiness and that which is emptiness form. In other words, the eternal present does not differ from the ephemeral present. Emptiness, which is the basis of life, does not differ from form, which is its manifestation. So all forms are the form of emptiness. If you want to know what emptiness is you cannot take away the form in order to see it. It does not work that way. If you want to know what emptiness is, just take care of the form. Look for emptiness in its manifestation rather than by looking for something called emptiness. You will find an emptiness. Sometimes Buddhism uses the sky or space as a metaphor for emptiness. Space is like that in which everything can move—things move in space; without space, nothing can move. Space is like a matrix, a metaphor for the matrix of life from which everything can rise. People always look for the essence of life. What is the essence of life? Some people call it God, some people call it Buddha Nature, we have various names and various ways of looking at it. Buddhists say "emptiness," but it doesn’t mean that it doesn’t need or want something. Emptiness is form, form is emptiness. The sutra goes on to say that the same is true of our feelings, our feelings are empty. The same for perceptions. Perceptions are empty. Mental formations are empty. Consciousness is empty; because of emptiness it can exist. Things cannot exist without emptiness, without being empty. It is unfortunate that people sometimes say, "Well, everything is changing and that is unfortunate because I am alive now and I will die sometime. Isn’t that terrible?" Actually, it is quite wonderful. We have this kind of feeling that we don’t want to die and we don’t want to get any older. But it happens. Without having to do anything, it happens. Is that bad? Is that good? We can figure it as bad; we can figure it as good. Maybe it is neither good or bad, maybe it is just the way it is. If it is just the way it is, there must be something going on. One thing stops and another thing begins.'
year_published = 2025
