["https://chzc.org/SR5.htm"]
title = "Sincere Practice and Way Seeking Mind, Part 2"
description = "Suzuki Roshi on sincere practice and Way Seeking Mind"
full_description = 'In Japanese it is simpler: namu kie Butsu, namu kie Ho, namu kie So. Kie Butsu myo sam, kie Ho rijin sam, kie So wago som; kie bu kyo, kie Ho kyo, kie So kyo. But if we translate it into English, we cannot arrange the words in this way. Whether in English or Japanese, we have to repeat those precepts. Buddha is said to be the supreme world honored one. There are many names for him. We have ten names for Buddha. By Buddha we do not mean just Shakyamuni Buddha. At the same time we mean various Buddhas. So sometimes we say the Buddhas in the three periods of time: past, future and pres-ent. Namu sanze sho Butsu, we say: I take refuge in all Buddhas in the three worlds, Namu is to take refuge. Sanze means the three worlds. Shobutsu means all the Buddhas, or we say, "Ji ho san shi i shi hu." Ji ho means ten directions. San shi means three worlds. I shi means all. Hu means Buddha. Ji ho san shi i shi hu, shi son bu sa mo ko sa means: Shi san is the supreme one, bu sa is Bosatsu, that�s bodhisattva. Mo ko sa is great Bodhisattvas. That is actually Buddha, Dharma, and Sangha. Dharma is mo ko ho ja ho ro mi. Moko is maha or moka: great. Ho ja ho ro mi is Prajna Paramita. That is the teaching. So when we say ji ho san shi i shi hu, shi son bu sa mo ko sa, mo ko ho ja ho ro mi, that means that we are taking refuge in Buddha, Dharma, and Sangha. That is why we say: Ji ho san shi i shi hu. That is the old Chinese pronunciation, but the meaning is the same. You know, we human beings should be always harmonious and we should work in unity. So we call a Buddhist group "harmonious Sangha." Sangha means Sang or so gya in Japanese. So means priest and ga is plural; so sangha means priest group, or group of followers. Here he says, "We take refuge in the Buddha because he is the great teacher." "We take refuge in the Law because it is our medicine and points the way." It is law or rule. "We take refuge in the priesthood because its members are our wise friends." It is through this triple adoration that we become disciples of Buddha. We should respect the Three Treasures before we receive any further precepts. This is the fundamental precept, since it is on the basis of this devotion that all the moral precepts of Buddhism rest, from beginning to end. Buddhism starts from these three refuges and ends with these three refuges.'
