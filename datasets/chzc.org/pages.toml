["https://chzc.org/Zoketsu.htm"]
title = "On Zen Work"
description = "Talk on Zen work practice"
full_description = '''[The following article is reprinted from the Winter, 1997, Turning Wheel, the journal of the Buddhist Peace Fellowship, and is based on a dharma talk delivered at Green Gulch Farm on May 5, 1996.] Once Yun Yen asked Pai Chang, "Every day there's hard work to do. Who do you do it for?" Pai Chang said, "There is someone who requires it." Yun Yen said, "Why not have him do it himself?" Pai Chang said, "He has no tools." If you really think about what work is you see that everything is work—being alive and in a body is already work. Every day there is eating and shitting and cleaning up. There is brushing and bathing and flossing. Every day there is thinking and caring and creating. So there's no escape from work—it's everywhere. For Zen students there's no work time and leisure time; there's just lifetime, daytime and nighttime. Work is something deep and dignified—it's what we are born to do and what we feel most fulfilled in doing. I am a little embarrassed to be speaking about physical work because I don't do that much of it these days and haven't done that much of it throughout my life. When I was young I used to have very little use for it. But probably the most important thing I have learned in my years of Zen practice is to appreciate physical work and to honor it as a special practice. So even though I do not have great skills as a worker I hope I have a good spirit for work. Most of the physical work I do nowadays is housework—dishes and bed-making and taking out the garbage and compost and recycling. And I always enjoy our temple communal work times, hoeing together in the early mornings, or digging, or planting potatoes, or the long soji [temple cleaning] periods every month. I think we are lucky at Green Gulch to have as much work as we do. Work brings us together and makes us into a real community. There are many places to do sesshins and retreats, but it's not the same when the members of a community don't have real work they need to accomplish together. When there's real physical work we struggle together and create a place together, and that place then inspires our practice on a daily basis because we know we have worked to make it.'''
