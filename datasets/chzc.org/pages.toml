["http://chzc.org/heart.htm"]
title = "The Heart Sutra and the Mantra of Our Life"
description = "Zen talk on the Heart Sutra"
full_description = 'I used to think of Suzuki Roshi’s life as a mantra. We tend to think of a mantra as a phrase which we repeat over and over again. Sometimes people ask, "Can you give me a mantra?" — something to repeat over and over in order to evoke or to maintain a certain concentrated or pure state. But when I observed Suzuki Roshi it seemed to me that the way he lived his life as a mantra. His life had a very obvious form. Every day at the old Sokoji Temple at Bush Street (in San Francisco), I would see him enter the zendo from his office and light the incense, sit zazen and do service. Every day he did the same thing, which was amazing to me. I had never seen anyone do that kind of activity before. His life was devoted to sitting zazen, bowing, lighting incense, and the various other things that he did. When there were so many other things to do in the world, here was this person simply doing these things over and over again every day. And he had been doing them over and over every day for most of his life. I never thought of myself doing anything like that in what seemed like such a narrowly disciplined way of life. So I was impressed by it. After a while, it occurred to me that his life was a mantra. Everyday he had these tasks that he would do. He was always concentrated and went about his activity in a light and easy manner. Somehow, it was not just repetitive. It was a dynamic that was always producing light. One way to produce energy is to have something going around in a circular path. If you hook up a conductor to that energy producer, the energy flows from it as a dynamo. That’s why he had so much spiritual power. The form that he gave to Zen Center is what made Zen Center work so well. The schedule is also like a mantra. The mantra is a powerful basis. There also has to be sincerity and some incorruptible leadership. With good leadership and the strong, powerful, dynamic mantra of form, the Prajna Paramita reveals itself and is lived through the form. Thich Nhat Hanh talked about the Heart Sutra when he was here. He said that you shouldn’t just revere the Heart Sutra as some ancient Buddhist document. He said that you should use it. You should know how to use it. And he kept saying that every day. We should think about how to use the sutra. The sutra is intellectual—it tells us something and prepares our mind; but the dynamics of the mantra expresses the actual use of the mantra.'
