title = "Director of the CIA - CIA"
full_description = '''About CIADirector of the CIAThe Director of the CIA oversees intelligence collection, analysis, and covert action to advance U.S. national security.Role of the DirectorThe role of the Director of the CIA (D/CIA) is to manage the Agency’s intelligence collection, analysis, covert action, counterintelligence, and liaison relationships with foreign services. The D/CIA also oversees the management of foreign intelligence acquired by human sources, what we call HUMINT.The CIA Director is nominated by the President with the advice, consent, and confirmation of the Senate. The D/CIA reports to the Director of National Intelligence.<picture><source type="image/webp" srcSet="/static/d520eef6b0e6819142de7d9a12757787/97a95/DCIA_Ratcliffe769x1000.webp 192w,/static/d520eef6b0e6819142de7d9a12757787/262c3/DCIA_Ratcliffe769x1000.webp 385w,/static/d520eef6b0e6819142de7d9a12757787/82a27/DCIA_Ratcliffe769x1000.webp 769w" sizes="(min-width: 769px) 769px, 100vw"/><img data-gatsby-image-ssr="" data-main-image="" style="opacity:0" sizes="(min-width: 769px) 769px, 100vw" decoding="async" loading="lazy" src="/static/d520eef6b0e6819142de7d9a12757787/eddee/DCIA_Ratcliffe769x1000.png" srcSet="/static/d520eef6b0e6819142de7d9a12757787/6b1e8/DCIA_Ratcliffe769x1000.png 192w,/static/d520eef6b0e6819142de7d9a12757787/d0026/DCIA_Ratcliffe769x1000.png 385w,/static/d520eef6b0e6819142de7d9a12757787/eddee/DCIA_Ratcliffe769x1000.png 769w" alt="DCIA John Ratcliffe Official Portrait"/></picture>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}CIA Director John L. RatcliffeJohn Ratcliffe was officially sworn in as Director of the Central Intelligence Agency on January 23, 2025. Director Ratcliffe comes to the Agency having served previously in the U.S. Intelligence Community as the sixth Director of National Intelligence, from May 2020 to January 2021, making him the first person ever to serve as both Director of National Intelligence and as Director of the Central Intelligence Agency.As the Director of National Intelligence, Director Ratcliffe led a shift in the U.S. Intelligence Community’s priorities to increase the U.S. intelligence advantage over the People’s Republic of China and exercised strategic oversight over intelligence operations and capabilities that removed designated terrorist leaders from the battlefield. As a member of the National Space Council, Director Ratcliffe elevated space to a priority intelligence domain and added the U.S. Space Force as the 18th member of the U.S. Intelligence Community.Prior to his tenure as the Director of National Intelligence, Director Ratcliffe served for more than five years as the U.S. Representative for the 4th Congressional District of Texas, where he was a leading policymaker on national security issues as a member of the House Intelligence, Homeland Security, and Judiciary committees. His Congressional career followed one of public service as, first, the Chief of Anti-Terrorism and National Security and then as the U.S. Attorney, both for the Eastern District of Texas. Director Ratcliffe was also a founding partner, with former U.S. Attorney General John Ashcroft, of the law firm Ashcroft Sutton Ratcliffe.Director Ratcliffe received the National Security Medal, the nation’s highest honor for distinguished achievement in the field of intelligence and national security, and the Department of Defense Distinguished Public Service Medal. He earned a bachelor’s degree in government and international studies from the University of Notre Dame and his doctoral degree in law from Southern Methodist University School of Law.Deputy Director of the CIARole of the Deputy DirectorThe CIA Deputy Director (DD/CIA) supports the Director in managing the Agency’s intelligence collection, analysis, covert action, counterintelligence, and liaison relationships with foreign services. The DD/CIA also exercises the Director’s powers in his or her absence or if the Director position becomes vacant.<picture><source type="image/webp" srcSet="/static/31fb5ce995ac4ccff2c5d8fdf0d053af/ddf96/DDCIA_Michael_J_-Ellis800x1000.webp 200w,/static/31fb5ce995ac4ccff2c5d8fdf0d053af/ef396/DDCIA_Michael_J_-Ellis800x1000.webp 400w,/static/31fb5ce995ac4ccff2c5d8fdf0d053af/1b4c1/DDCIA_Michael_J_-Ellis800x1000.webp 800w" sizes="(min-width: 800px) 800px, 100vw"/><img data-gatsby-image-ssr="" data-main-image="" style="opacity:0" sizes="(min-width: 800px) 800px, 100vw" decoding="async" loading="lazy" src="/static/31fb5ce995ac4ccff2c5d8fdf0d053af/e6860/DDCIA_Michael_J_-Ellis800x1000.png" srcSet="/static/31fb5ce995ac4ccff2c5d8fdf0d053af/bbf65/DDCIA_Michael_J_-Ellis800x1000.png 200w,/static/31fb5ce995ac4ccff2c5d8fdf0d053af/cd6a3/DDCIA_Michael_J_-Ellis800x1000.png 400w,/static/31fb5ce995ac4ccff2c5d8fdf0d053af/e6860/DDCIA_Michael_J_-Ellis800x1000.png 800w" alt="DDCIA Ellis official portrait"/></picture>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}Deputy Director Michael EllisMichael Ellis was sworn in as Deputy Director of the Central Intelligence Agency on February 10, 2025. Deputy Director Ellis has held a variety of senior national security positions, including General Counsel of the National Security Agency and Senior Director for Intelligence Programs at the National Security Council.Deputy Director Ellis previously served in the White House Counsel's Office, providing legal advice on national security and foreign relations. Prior to the White House, he was General Counsel of the U.S. House of Representatives Permanent Select Committee on Intelligence and served as an intelligence officer in the U.S. Navy Reserve.Before returning to government, Deputy Director Ellis was the General Counsel of Rumble, a publicly traded video sharing platform and cloud services provider.Deputy Director Ellis is a graduate of Yale Law School and Dartmouth College. Following law school, he served as a clerk to two federal judges. He is a "Jeopardy!" champion.Chief Operating OfficerRole of the Chief Operating OfficerThe Chief Operating Officer (COO) manages CIA on a day-to-day basis, formulating and implementing policies and programs that affect the corporate interests of the Agency and its personnel on behalf of the Director of the CIA. Enterprise-level functions under the COO’s purview include budget and resources, strategic planning, and senior personnel assignments.<picture><source type="image/webp" srcSet="/static/25dfbd80cf2b03947d0e7dfb06d377ef/ddf96/coo_maura_burns_official_potrait.webp 200w,/static/25dfbd80cf2b03947d0e7dfb06d377ef/ef396/coo_maura_burns_official_potrait.webp 400w,/static/25dfbd80cf2b03947d0e7dfb06d377ef/1b4c1/coo_maura_burns_official_potrait.webp 800w" sizes="(min-width: 800px) 800px, 100vw"/><img data-gatsby-image-ssr="" data-main-image="" style="opacity:0" sizes="(min-width: 800px) 800px, 100vw" decoding="async" loading="lazy" src="/static/25dfbd80cf2b03947d0e7dfb06d377ef/e6860/coo_maura_burns_official_potrait.png" srcSet="/static/25dfbd80cf2b03947d0e7dfb06d377ef/bbf65/coo_maura_burns_official_potrait.png 200w,/static/25dfbd80cf2b03947d0e7dfb06d377ef/cd6a3/coo_maura_burns_official_potrait.png 400w,/static/25dfbd80cf2b03947d0e7dfb06d377ef/e6860/coo_maura_burns_official_potrait.png 800w" alt="Chief Operating Officer Maura Burns"/></picture>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}Chief Operating Officer Maura BurnsMaura Burns was selected as CIA’s Chief Operating Officer in May 2022. She most recently served as CIA’s Deputy Chief Operating Officer and brought a wide range of leadership and expertise to the position. She advanced through multiple analytic and managerial roles during her long career within the Directorate of Analysis, where she specialized in weapons, counterproliferation, and counterterrorism.Over the years, Ms. Burns earned many prestigious honors. In 2024, she received the Wash100 Award that recognizes the most influential federal government executives; in 2016, she received a Presidential Rank Award; in 2010, she was inducted into the Senior Intelligence Service for exceptional executive experts and managers who advance the Agency’s mission; and in 2000, she was among the first group inducted into the Senior Analytic Service – a cadre of the Intelligence Community’s leading subject matter experts.A native of Pittsburgh and a diehard Steelers, Penguins, and Pirates fan, Ms. Burns joined the Agency in 1988 after working for Westinghouse. She graduated from the University of Kentucky in 1985 and volunteers her time as a docent at the National Air and Space Museum.'''
