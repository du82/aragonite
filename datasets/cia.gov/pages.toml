["https://cia.gov/about/mission-vision"]
title = "Mission and Vision - CIA"
full_description = 'About CIAMission and VisionAt its core, our mission is to gather and share intelligence to protect our Nation from threats. Our highest principles guide our vision and all that we do: integrity; service; excellence; courage; teamwork; and stewardship. Our MissionAt the CIA, our mission is to preempt threats and further U.S. national security objectives by:Collecting foreign intelligence that matters;Producing objective all-source analysis;Conducting effective covert action as directed by the president; andSafeguarding the secrets that help keep our Nation safe.<picture><source type="image/webp" srcSet="/static/14e601462866427b5696dac034c7ebc1/31ae2/ABO-MIS-Feature-1-c%402x.webp 223w,/static/14e601462866427b5696dac034c7ebc1/e1121/ABO-MIS-Feature-1-c%402x.webp 445w,/static/14e601462866427b5696dac034c7ebc1/b7cad/ABO-MIS-Feature-1-c%402x.webp 890w" sizes="(min-width: 890px) 890px, 100vw"/><img data-gatsby-image-ssr="" data-main-image="" style="opacity:0" sizes="(min-width: 890px) 890px, 100vw" decoding="async" loading="lazy" src="/static/14e601462866427b5696dac034c7ebc1/1fc33/ABO-MIS-Feature-1-c%402x.jpg" srcSet="/static/14e601462866427b5696dac034c7ebc1/b1867/ABO-MIS-Feature-1-c%402x.jpg 223w,/static/14e601462866427b5696dac034c7ebc1/08956/ABO-MIS-Feature-1-c%402x.jpg 445w,/static/14e601462866427b5696dac034c7ebc1/1fc33/ABO-MIS-Feature-1-c%402x.jpg 890w" alt="Two men sitting across from each other examining documents."/></picture>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}Our VisionOur vision is for CIA’s information, insights, and actions to consistently provide tactical and strategic advantage for the United States.<picture><source type="image/webp" srcSet="/static/b3823f7c382e38dbcf5d310d4fca479c/31ae2/ABO-MIS-Feature-2-c%402x.webp 223w,/static/b3823f7c382e38dbcf5d310d4fca479c/e1121/ABO-MIS-Feature-2-c%402x.webp 445w,/static/b3823f7c382e38dbcf5d310d4fca479c/b7cad/ABO-MIS-Feature-2-c%402x.webp 890w" sizes="(min-width: 890px) 890px, 100vw"/><img data-gatsby-image-ssr="" data-main-image="" style="opacity:0" sizes="(min-width: 890px) 890px, 100vw" decoding="async" loading="lazy" src="/static/b3823f7c382e38dbcf5d310d4fca479c/1fc33/ABO-MIS-Feature-2-c%402x.jpg" srcSet="/static/b3823f7c382e38dbcf5d310d4fca479c/b1867/ABO-MIS-Feature-2-c%402x.jpg 223w,/static/b3823f7c382e38dbcf5d310d4fca479c/08956/ABO-MIS-Feature-2-c%402x.jpg 445w,/static/b3823f7c382e38dbcf5d310d4fca479c/1fc33/ABO-MIS-Feature-2-c%402x.jpg 890w" alt="Black and white photo of a group in the boardroom each holding papers."/></picture>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}Our Guiding PrinciplesCIA OverviewWarning: This video below may contain flickering or flashing scenes.TranscriptPoint Down IconOur mission is straightforward but critical, leverage the power of information to keep our nation safe. Our problem set is complex and cannot be solved by one person alone.Our officers have a wide range of expertise. Together, we work tirelessly day in and day out, to ensure the continued safety of our nation. We rely on diverse ideas, experiences, and skills.We are Analysts, Graphic Designers, Operations Officers, Engineers, Librarians, Computer Scientists, Accountants, Doctors, and Linguists, from all walks of life. Working together to protect the values we cherish as Americans.We collect and analyze foreign intelligence, conduct covert action, and develop innovative technology. US policymakers including the President of the United States, make decisions informed by the information we provide. We do work with our partners in the Intelligence Community, Department of Defense, and law enforcement agencies on many complex issues, ranging from counter intelligence to counter terrorism.We are the nation’s first line of defense. We accomplish what others cannot accomplish and go where others cannot go. We are, the Central Intelligence Agency.<picture><source type="image/webp" srcSet="/static/3f76fcaab32f33a941dbdb1a544e3f7a/38a7b/Mission-GuidingPrinciples3up.webp 270w,/static/3f76fcaab32f33a941dbdb1a544e3f7a/41eff/Mission-GuidingPrinciples3up.webp 540w,/static/3f76fcaab32f33a941dbdb1a544e3f7a/73638/Mission-GuidingPrinciples3up.webp 1080w" sizes="(min-width: 1080px) 1080px, 100vw"/><img data-gatsby-image-ssr="" data-main-image="" style="opacity:0" sizes="(min-width: 1080px) 1080px, 100vw" decoding="async" loading="lazy" src="/static/3f76fcaab32f33a941dbdb1a544e3f7a/39fa0/Mission-GuidingPrinciples3up.jpg" srcSet="/static/3f76fcaab32f33a941dbdb1a544e3f7a/65f50/Mission-GuidingPrinciples3up.jpg 270w,/static/3f76fcaab32f33a941dbdb1a544e3f7a/9fe82/Mission-GuidingPrinciples3up.jpg 540w,/static/3f76fcaab32f33a941dbdb1a544e3f7a/39fa0/Mission-GuidingPrinciples3up.jpg 1080w" alt="A diverse group of three professionals in front of a tan background."/></picture>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}Our employees are guided by our key principles, core values, and highest aspirations. These standards keep us on course as we work to protect our Nation and advance its interests.ServiceWe put our Nation first, Agency before unit, and mission before self. We take pride in being agile, responsive, and consequential.IntegrityWe uphold the highest standards of conduct. We provide information and analysis without personal bias. We maintain the Nation’s trust through accountability and oversight.ExcellenceWe bring the best of our backgrounds and expertise to everything we do. We are self-aware, reflecting on our performance and learning from it. We strive to give all officers the tools, experiences, and leadership they need to excel.CourageWe execute difficult, high-stakes, and often dangerous tasks. We carefully manage risk, but we do not shy away from it. We value sacrifice and honor our fallen. Explore our legacy.TeamworkWe stand by one another. Collaboration, both internal and external, underpins our success. Learn more about working at CIA.StewardshipWe protect our sources and methods from the moment our service begins until our last breath. Discover the CIA: Your Nation is Counting on YouWarning: This video below may contain flickering or flashing scenes.TranscriptPoint Down Iconit only takes one new piece of forward 00:04 intelligence and everything can changein an instanthey I think I found something most 00:10 people will never see your work onlythree people in the world have access tothe information we need to notify thefield your greatest strength will be thepeople around you’re gonna be able tosee the whole thing yep gonna be in theroof right here let’s see the house yourgreatest reward is knowing your effortswill help keep every American’s safeyour achievements while unknown to thepublic are critical to our nationalsecurity this translation is technicallyaccurate but in this context it reallymeans this the nation we got itis counting on you to discover the truthI’ll call the White House ladies andgentlemen welcome to the CIA you canplay a role protecting our nation starta career at the CIA and do more for yourcountry than you ever dreamed possible.Your Talent. Your Diverse Skills. Our Mission.Make a difference in your career. We’re looking for students, recent graduates, and professionals to join our team. Explore our world and imagine yourself working at the Nation’s premier intelligence agency.Browse Jobs<picture><source type="image/webp" srcSet="/static/44e41f96a6ec828d79b6beddff9683e9/71d4d/Tech-Dev_1104131693-1.webp 1280w,/static/44e41f96a6ec828d79b6beddff9683e9/c87c1/Tech-Dev_1104131693-1.webp 2560w,/static/44e41f96a6ec828d79b6beddff9683e9/d2440/Tech-Dev_1104131693-1.webp 5120w" sizes="(min-width: 5120px) 5120px, 100vw"/><img data-gatsby-image-ssr="" data-main-image="" style="opacity:0" sizes="(min-width: 5120px) 5120px, 100vw" decoding="async" loading="lazy" src="/static/44e41f96a6ec828d79b6beddff9683e9/9c72d/Tech-Dev_1104131693-1.jpg" srcSet="/static/44e41f96a6ec828d79b6beddff9683e9/4a49b/Tech-Dev_1104131693-1.jpg 1280w,/static/44e41f96a6ec828d79b6beddff9683e9/f1e8a/Tech-Dev_1104131693-1.jpg 2560w,/static/44e41f96a6ec828d79b6beddff9683e9/9c72d/Tech-Dev_1104131693-1.jpg 5120w" alt=""/></picture>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}'
