title = "Physician - CIA"
full_description = "SaveBookmark IconSave jobBrowse CIA JobsPhysicianPhysicians provide medical care and advice to CIA employees and dependents and other Agency sponsored people.Full timeSalary: $306,600Active, unrestricted licensure as a physician in one or more statesExpress InterestArrow Right IconAgency-wide RequirementsAll applicants must be:U.S. citizens (dual U.S. citizens also eligible)At least 18 years of ageWilling to move to the Washington, DC areaAble to complete security and medical evaluationsRegistered for the Selective ServiceAbout the JobAs a Physician for CIA, you will provide medical care and advice to Agency employees and dependents and other Agency sponsored people. Utilizing your clinical expertise in a medical consultation model, you will help advance the CIA mission where it intersects with medical issues. Variability of medical resources around the world, access to care in different regions, and mission requirements are all at play in your efforts as an Agency Physician to deliver the best medical opinions possible. You'll work and coordinate with a global set of USG medical colleagues while delivering care in various countries and under a multiplicity of clinical scenarios.The capacity and commitment to serve globally is essential. Physicians spend most of their careers serving in multi-year assignments in a variety of overseas locations, but some opportunities exist to serve in the Washington, DC area.As part of our team you will receive excellent benefits and a variety of medical and non-medical training will be provided. Sign on incentives and moving expenses are reimbursed.What You’ll GetOur benefits support every aspect of a working professional’s life, including health and wellness, time off, family, finances, and continuing education. Our programs include highly sought-after government health benefits, flexible schedules, sick leave, and childcare. In some cases, we also offer sign-on incentives and cover moving expenses if you relocate.As a CIA employee, you’ll also get the satisfaction of knowing your work is part of something bigger than yourself. Our work is driven by one mission: to keep our Nation safe. Every day is an opportunity to enhance U.S. national security.Learn more about working at CIA.Minimum QualificationsActive, unrestricted licensure as a physician in one or more statesActive board certification in an American Board of Medicine Specialties (ABMS) direct care clinical specialtyAbility to maintain continued clinical practice in the area of specialty for at least 96 hours per yearAbility to meet the minimum requirements for joining CIA, including U.S. citizenship and a background investigationDesired QualificationsWillingness to travel overseas, including for prolonged deploymentsMilitary, Foreign Service, or other international backgroundForeign language proficiencyDemonstrated superior decision-making skills and judgment"
