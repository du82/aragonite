full_description = '''The World FactbookThe World Factbook provides basic intelligence on the history, people, government, economy, energy, geography, environment, communications, transportation, military, terrorism, and transnational issues for 265 world entities.<picture><source type="image/webp" srcSet="/the-world-factbook/static/ef99b7d527692f420f3c659163744a4b/a1f2d/WFB-Logo-With-White-Transparent.webp 200w,/the-world-factbook/static/ef99b7d527692f420f3c659163744a4b/8fdce/WFB-Logo-With-White-Transparent.webp 400w,/the-world-factbook/static/ef99b7d527692f420f3c659163744a4b/f4558/WFB-Logo-With-White-Transparent.webp 800w" sizes="(min-width: 800px) 800px, 100vw"/><img data-gatsby-image-ssr="" data-main-image="" style="opacity:0" sizes="(min-width: 800px) 800px, 100vw" decoding="async" loading="lazy" src="/the-world-factbook/static/ef99b7d527692f420f3c659163744a4b/d4b47/WFB-Logo-With-White-Transparent.png" srcSet="/the-world-factbook/static/ef99b7d527692f420f3c659163744a4b/dc366/WFB-Logo-With-White-Transparent.png 200w,/the-world-factbook/static/ef99b7d527692f420f3c659163744a4b/74bfd/WFB-Logo-With-White-Transparent.png 400w,/the-world-factbook/static/ef99b7d527692f420f3c659163744a4b/d4b47/WFB-Logo-With-White-Transparent.png 800w" alt=""/></picture>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}Travel the globe with CIA’s World Factbook.<picture><source type="image/webp" srcSet="/the-world-factbook/static/f234daba3