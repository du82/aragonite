r analysis expressed in Studies in Intelligence and publications are those of the authors. They do not necessarily reflect official positions or views of CIA or any other U.S. government entity, past or present. Nothing in the contents should be construed as asserting or implying U.S. government endorsement of an article’s factual statements and interpretations.How to Request CSI PublicationsCSI’s documents are prepared for U.S. government officials. Publications are not generally available to the public directly from CIA.Selected documents are available for purchase at:U.S Government Bookstore | (gpo.gov)<picture><source type="image/webp" srcSet="/resources/csi/static/b700491948dd67cd5f3ed5fef8ac28c9/31ae2/CSI-LAN-Feature-4-c%402x.webp 223w,/resources/csi/static/b700491948dd67cd5f3ed5fef8ac28c9/e1121/CSI-LAN-Feature-4-c%402x.webp 445w,/resources/csi/static/b700491948dd67cd5f3ed5fef8ac28c9/b7cad/CSI-LAN-Feature-4-c%402x.webp 890w" sizes="(min-width: 890px) 890px, 100vw"/><img data-gatsby-image-ssr="" data'
