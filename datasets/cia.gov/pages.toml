["https://cia.gov/about/organization/directorate-of-digital-innovation"]
title = "Directorate of Digital Innovation - CIA"
full_description = '''OrganizationDirectorate of Digital InnovationContentsPoint Down IconOur Mission and PrioritiesWhat We DoHistoryCareers<picture><source type="image/webp" srcSet="/static/10d4873422b2e07b2fda867bc3f1fc36/8c64a/OrganizationPage-DDI.webp 320w,/static/10d4873422b2e07b2fda867bc3f1fc36/ffef7/OrganizationPage-DDI.webp 640w,/static/10d4873422b2e07b2fda867bc3f1fc36/9ba0b/OrganizationPage-DDI.webp 1280w" sizes="(min-width: 1280px) 1280px, 100vw"/><img data-gatsby-image-ssr="" data-main-image="" style="opacity:0" sizes="(min-width: 1280px) 1280px, 100vw" decoding="async" loading="lazy" src="/static/10d4873422b2e07b2fda867bc3f1fc36/68d0b/OrganizationPage-DDI.jpg" srcSet="/static/10d4873422b2e07b2fda867bc3f1fc36/fc269/OrganizationPage-DDI.jpg 320w,/static/10d4873422b2e07b2fda867bc3f1fc36/4d5c4/OrganizationPage-DDI.jpg 640w,/static/10d4873422b2e07b2fda867bc3f1fc36/68d0b/OrganizationPage-DDI.jpg 1280w" alt="Directorate of Digital Innovation"/></picture>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}The Directorate of Digital Innovation (DDI), the Agency’s newest directorate, accelerates innovation across the Agency's mission activities with cutting-edge digital and cyber tradecraft—essentially the 1s and 0s of the CIA. DDI ensures that teams have the tools, techniques, and infrastructure they need to operate in a modern, connected world and still be clandestine. From cybersecurity to IT infrastructure, DDI officers are armed with the tools and techniques to maintain CIA’s digital supremacy.We are the Directorate of Digital InnovationWarning: This video below may contain flickering or flashing scenes.TranscriptPoint Down IconWe are the Directorate of Digital Innovation.We are transforming America’s intelligence capabilities for the digital age.We discover cutting-edge solutions to cyber threats and vulnerabilities.We are the explorers and experimenters who never accept the status quo.From Data Scientists, Project Managers, IT Engineers, and everything in between, we push boundaries and shape tomorrow’s digital solutions.We are revolutionizing digital technology throughout the entire Agency, to help keep our nation safe.We are the Directorate of Digital Innovation.Our Mission and PrioritiesTo maintain our strategic advantage across all domains, CIA must win in the digital domain against our most capable adversaries. DDI’s Digital Strategy emphasizes integration, agility, and innovation to accelerate the development and deployment of digital capabilities across all aspects of CIA’s mission, to ensure CIA remains the forerunner in the global struggle for digital intelligence supremacy. Our strategy focuses on five key pillars.Master the Offensive and Defensive Cyber DomainHarness the Power of Data and Artificial IntelligenceFoster and Deepen PartnershipsMaximize Open SourceStrengthen the Capacity to InnovateWhat We DoOfficers within the Directorate of Digital Innovation (DDI) are at the forefront of the complex and continuously evolving technological landscape. Officers must be experts in the digital environment of today as well as change agents for the CIA, anticipating and preparing for over-the-horizon digital trends of the future. DDI brings together the expertise and functions of IT, data, artificial intelligence, cyber collection, cyber defense, and open-source intelligence. The alignment and integration of these elements allows the Agency to remain on the cutting edge of digital capabilities to stay out in front of our adversaries.Through their daily work and continuous training, DDI officers and our partners bring and continue to develop the expertise needed to keep pace with the rapid advancements in technology. The DDI does everything from enterprise IT to cyber collection and artificial intelligence, and supports teams and groups both local and all over the world. Though we are one directorate, we are part of a broader team of officers and individuals across the CIA, the Intelligence Community, industry, and academia focused on delivering the best in digital capabilities and tradecraft.HistoryYears ago, the national security landscape had begun to change significantly, driven by advancements in technology and the emergence of new digital and cyber threats. The Agency recognized that with this rapid evolution of the digital landscape, technological advancements had made its intelligence mission exponentially more complex. The Directorate of Digital Innovation (DDI) was created in October of 2015 to effectively optimize and leverage the power of digital technologies in furtherance of mission.DDI brings together IT, data, artificial intelligence, cyber collection, cyber defense, and open-source intelligence to harness their power for the Agency in a way that was never possible before they were aligned as elements of an integrated team. The standup of this new Directorate was designed to calibrate the intelligence enterprise to the emerging threats in the digital domain. As such, a key function of the DDI is to connect the right subject matter, technical, and digital experts so that this Agency can collaboratively and effectively counter threats. As part of the DDI’s stand-up, the Agency Data Office (ADO) and the Chief Data Officer (CDO) roles were established.Although DDI was officially established in 2015, several groups within DDI pre-date the directorate. The earliest predecessor to the DDI’s Open Source Enterprise (OSE), the Foreign Broadcast Monitoring Service (FBMS), predates the CIA, as it was created in February 1941 to focus on foreign print and radio, such as monitoring Nazi Germany radio broadcasts. By 1946, the FBMS became the Federal Broadcast Intelligence Service (FBIS) and transferred to the new Central Intelligence Agency (CIA). As technology advanced throughout the decades, offices dedicated to digital technology formed under various directorates. Elements of the DS&T and DO, which over the years were focused on the use of computers in support of operations, eventually formed the basis of today’s CCI.Today’s DDI houses the most current iteration of many former offices that separately focused on technology, HUMINT, or clandestine operations with the intent of fusing these once disparate disciplines into a single Agency approach towards today’s digital landscape. Throughout CIA’s history, our predecessors were confronted with unprecedented challenges that compelled them to invent new solutions. While the current digital landscape is uniquely complex and ever-changing, our officers take pride in knowing that we inherit a great tradition of agility, creativity, and commitment to mission.CareersThe Directorate of Digital Innovation (DDI) serves as the engine of creativity, integration, and rigor needed in the digital age, ensuring that our culture, tradecraft, and knowledge management across the board are prepared to meet the challenges and opportunities of a rapidly changing world. DDI officers arm the Agency with forward-thinking tools and techniques to compete in the cyber arena. They also work with other directorates to identify opportunities for innovation. Depending on their skill sets, officers can take part in anything from software development to open-source collection.The Directorate of Digital Innovation also has a strong team of data scientists and engineers to support analysis in the world of big data. With such a wide range of needs across CIA, officers must stay agile and adaptive throughout their careers. DDI prioritizes consistent learning and growth throughout officers’ entire careers.Featured JobsApplications DeveloperSaveBookmark Icon the Applications Developer position.Save jobApplications Developers use their creativity and technical skills to design, develop and deploy software systems to enhance CIA’s capabilities to collect, produce, and disseminate intelligence.Full timeStarting salary: $72,965 - $181,216Bachelor's degreeLearn MoreArrow Right IconCyber Operations OfficerSaveBookmark Icon the Cyber Operations Officer position.Save jobCyber Operations Officers gather intelligence from adversary systems and networks using advanced tools, techniques, and tradecraft.Full timeStarting salary: $72,965 - $181,216Bachelor's degreeLearn MoreArrow Right IconData EngineerSaveBookmark Icon the Data Engineer position.Save jobDDI Data Engineers solve critical data challenges by building optimal data pipelines, analyzing and transforming data, and delivering data to systems to advance CIA’s intelligence mission.Full timeStarting salary: $72,965 - $153,354Bachelor's Learn MoreArrow Right IconIT EngineerSaveBookmark Icon the IT Engineer position.Save jobIT Engineers design and deploy a secure, global communications infrastructure that allows CIA officers to collaborate with each other and Intelligence Community and federal government partners.Full timeStarting salary: $72.965 - $181,216**Higher starting salary possible depending on experience levelBachelor's degree Learn MoreArrow Right IconContentsPoint Down IconOur Mission and PrioritiesWhat We DoHistoryCareers'''
