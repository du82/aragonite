["https://cia.gov/legacy/cia-history/cia-trailblazers"]
title = "CIA Trailblazers - CIA"
full_description = 'History of CIACIA TrailblazersCIA Trailblazers are officers throughout CIA’s history who have distinguished themselves as leaders, made a real difference in pursuit of our mission, and who served as a standard of excellence for others to follow. By their actions, example, innovations, or initiative these talented officers have taken CIA in important new directions and helped shape the Agency.ContentsPoint Down IconThe Trailblazer AwardThe First Trailblazers2007200820092010201120122013201420172022The CIA Trailblazer award was established in 1997 when CIA celebrated its 50th anniversary.Nominations were open to officers of any grade, in any field, at any point in CIA’s history, who distinguished themselves as leaders, made a real difference in pursuit of our mission, and who served as a standard of excellence for others to follow.A special steering committee selected 50 individuals from over 300 nominations. These trailblazers received medallions from then-Director of Central Intelligence George J. Tenet.Over the years, several additional CIA officers have been identified as CIA Trailblazers: Currently, 83 officers or teams have received the coveted award. We’ve publicly released the names of 73 Trailblazers.We invite you to read about our Trailblazers’ achievements below.The following individuals are a sampling of the many talented CIA officers who have received this prestigious award.<picture><source type="image/webp" srcSet="/static/c70c7a10cbe31e42ff06947176482de5/822bf/trailblazer.webp 496w,/static/c70c7a10cbe31e42ff06947176482de5/96e4a/trailblazer.webp 992w,/static/c70c7a10cbe31e42ff06947176482de5/d454e/trailblazer.webp 1984w" sizes="(min-width: 1984px) 1984px, 100vw"/><img data-gatsby-image-ssr="" data-main-image="" style="opacity:0" sizes="(min-width: 1984px) 1984px, 100vw" decoding="async" loading="lazy" src="/static/c70c7a10cbe31e42ff06947176482de5/4e7ae/trailblazer.jpg" srcSet="/static/c70c7a10cbe31e42ff06947176482de5/b6d81/trailblazer.jpg 496w,/static/c70c7a10cbe31e42ff06947176482de5/81076/trailblazer.jpg 992w,/static/c70c7a10cbe31e42ff06947176482de5/4e7ae/trailblazer.jpg 1984w" alt="gold medallion"/></picture>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}The CIA Trailblazer Award gold medallion The First Trailblazers:Robert C. AmesMr. Ames, an outstanding Arabist, inspired subordinates and sensitized new officers to the need to learn and appreciate the foreign cultures in which they work. He served with distinction as National Intelligence Officer for the Near East and South Asia and as Director of the Office of Near Eastern and South Asian Analysis. Tragically, Robert Ames was killed in the bombing of the U.S. Embassy in Beirut in 1983.Joseph A. BaclawskiDr. Baclawski was a pioneer in providing U.S. political and military leaders with accurate, reliable mapping information on the Soviet Union. He was the principal adviser to the Chairman of the Committee on Imagery Requirements and Exploitation for all mapping issues relating to satellite photographic sources.Matthew BairdU.S. Air Force Col. Matt Baird came to CIA to develop an officer training cadre and a career development program. Under his leadership, the Junior Officer Training (JOT) Program was born and became the prototype for career training at CIA.Richard M. BissellMr. Bissell was responsible for developing the U-2, the highly capable reconnaissance aircraft that has served the US for more than 60 years. He developed the first photo- reconnaissance satellite program by pushing state-of-the-art technology.David H. BleeMr. Blee held several senior positions in the Directorate of Operations and is recognized for creating a professional counterintelligence discipline. He emphasized and implemented a spectrum of counterintelligence measures inherent to successful Agency operations.Paul A. BorelAs Director of the Foreign Broadcast Information Service Mr. Borel was responsible for merging foreign broadcast monitoring with foreign press scrutiny to provide the first combined open source media collection in CIA. He also led the Intelligence Community’s pioneer work in computer-supported information handling.Patricia L. BrannenMs. Brannen was a role model for all executive secretaries. Her industry, leadership, and commitment to professional standards of performance encouraged the development of an expert group of CIA secretaries.Archie R. BurksAs Director of the Office of SIGINT Operations, Mr. Burks developed technical intelligence programs which gave the nation new capabilities in signals and imagery Intelligence.Joseph B. CastilloDr. Castillo is recognized for his outstanding performance in analyzing foreign weapons systems, support to senior policymakers on arms control issues, leadership of major offices in three CIA directorates, and support to the recruitment and mentoring of minority employees.David E. CoffeyMr. Coffey’s exceptional ability to solve operational problems with technology culminated in his successful creation and maintenance of an extremely sensitive covert communications capability. His leadership significantly enhanced the integration of technical support into espionage operations.John E. CravenA Senior Scientist, Dr. Craven’s contributions range across a broad spectrum of advanced computer and communications technologies. He provided new and practical solutions in high speed computing logic, signal processing, and communications systems.James H. CritchfieldMr. Critchfield established relations with counterparts in the West German intelligence services when that country emerged from the status of an occupied nation to become a sovereign power. He was an expert on central European matters and later distinguished himself on Middle East issues.Benedetto DeFeliceMr. DeFelice developed the original, forward-leaning benefits and services programs for Agency personnel. His personal help to employee families with medical, financial, or day-to-day living problems is legendary.Leslie C. DirksMr. Dirks provided the inspiration, visionary zeal, and technical expertise to create a new class of overhead imagery systems that revolutionized intelligence collection. Those systems represented a major breakthrough in CIA’s ability to achieve intelligence dominance during the Cold War. Mr. Dirks was the founder and first director of the Office of Development and Engineering and later served as the Deputy Director for Science and Technology.William F. DonnellyMr. Donnelly set a powerful example across the Agency of enlightened leadership, executive accountability, sound intelligence tradecraft, and personal and professional integrity. His assignments ranged from case officer and Chief of Station to Deputy Director for Administration and Inspector General.Janet V. DoriganDr. Dorigan is the primary force in the Intelligence Community in developing new and innovative approaches to identify biological materials of high intelligence interest. She is an expert in genetics and molecular biology and has made significant scientific contributions to her field and to the Intelligence Community.Carl E. DuckettMr. Duckett was the founding father and visionary leader of the Foreign Missile and Space Analysis Center, which was the vanguard for the Intelligence Community’s ability to understand threats posed by missiles and space-based weapons systems. He later served as Deputy Director for Science and Technology.Allen W. DullesAs the first Deputy Director for Plans, Mr. Dulles set the standards for clandestine tradecraft and asset handling and built the covert infrastructure of CIA. Named Director of Central Intelligence in 1953, he created the architecture of the modern CIA and led the organization from its tentative beginnings to a position as preeminent provider of intelligence to the President and the National Security Council.Agnes D. GreeneMs. Greene’s pioneering efforts as a reports officer and later a senior manager set the highest standards of integrity, credibility, and efficiency in processing intelligence information. She later served as the Directorate of Operations Chief, Reports and Requirements for the Far East Division.Howard P. HartMr. Hart was the driving force in leading a successful paramilitary covert action program. He distinguished himself with his inspiring and effective leadership while serving as the first director of the DCI’s Counternarcotics Center.Earl M. HarterMr. Harter is recognized for his outstanding leadership as the founder of one of the most sensitive and productive technical operations in CIA’s history. He led dozens of sensitive and dangerous overseas operations and was awarded the Presidential Medal of Freedom.Richard M. HelmsThe consummate operations officer and first careerist to head the Agency, Ambassador Helm’s service epitomizes the integrity, courage, and quiet competence that mark the intelligence professional and has made him a uniquely eloquent advocate of CIA and its proper national security role. After an unparalleled career that culminated as DCI during the height of the Cold War, he has continued to serve both his country and the Agency by sharing the wisdom and experience gained over a lifetime of dedication and leadership in the intelligence profession.Evan HinemanMr. Hineman was one of the Agency’s most distinguished engineers, analysts, and weapons technologists. He demonstrated that technically complex clandestine collection could be partnered successfully with rapid processing and sophisticated research and analysis to produce world-class scientific and weapons intelligence.Lawrence R. HoustonMr. Houston was the principal drafter of the National Security Act of 1947, which created the CIA. He served as the Agency’s first General Counsel, an assignment that lasted for 26 years. During this time he was a key adviser to nine Directors of Central Intelligence.Paul L. HoweMr. Howe engineered the Agency’s single greatest advance in operational photography—the ultraminiature camera. His work enabled us to photograph materials under the most difficult operational circumstances. The value of the intelligence collected solely as a consequence of this capability is beyond calculation.Sherman T. KentMr. Kent is recognized for his distinguished 15 year chairmanship of the Board of National Estimates and his contributions to the craft of intelligence analysis. He promoted the concept of strategic intelligence that goes beyond daily events and helps policymakers deal with fundamental challenges to national security.Lyman B. KirkpatrickAn administrator and adviser to early DCIs, Mr. Kirkpatrick was instrumental in helping design and implement much of the original organizational structure of the Central Intelligence Agency. CIA’s first Executive Director-Comptroller, he served with distinction in a variety of other leadership roles, including Inspector General.George KisevalterA superior case officer, Mr. Kisevalter’s exacting standards of tradecraft, operational security and asset motivation were instrumental in inspiring at least two major foreign assets to provide intelligence critical to the national security of the United States. Kisevalter was the first case officer to be promoted to the senior executive level based solely on his operational accomplishments rather than on management assignments.Lloyd LauderdaleMr. Lauderdale developed an innovative solution to one of the Intelligence Community’s most critical technical collection problems. His proposal was risky and was one of the most ambitious space initiatives undertaken by CIA. The program was successful and greatly enhanced the nation’s national technical means.Richard T. LehmanMr. Lehman developed the President’s Intelligence Checklist (now the President’s Daily Brief), a daily publication that won the approval of President Kennedy. This publication has kept presidents and other senior policymakers informed about worldwide developments for the past 36 years. Lehman served later as Chairman of the National Intelligence Council.Henry S. LowenhauptDr. Lowenhaupt is recognized for his innovative and visionary work in developing indicators for the recognition of foreign nuclear facilities and activities. His leadership in the field of nuclear intelligence — over a government career spanning 50 years — provided the US with intelligence critical to judgments on Soviet and Chinese nuclear weapons developments.Arthur C. LundahlMr. Lundahl is recognized as the father of imagery analysis and the creator of a world-class national center for producing intelligence from overhead imagery. This thorough and highly technical intelligence enabled Lundahl to gain the confidence of four US presidents.Harold M. McClellandUS Air Force Maj. Gen. McClelland was the principal architect of the Office of Communications and served as its director for 14 years. His innovative vision led to the in-house development and manufacturing of communications equipment, and provided the Agency with secure communications around the world.John N. McMahonStarting at the bottom rung of the Agency career ladder, Mr. McMahon had the distinct honor of holding leadership positions in all four Directorates, on the Intelligence Community staff, and as Deputy Director of Central Intelligence. His deep understanding of the people and substance of the intelligence profession shaped the morale of CIA’s workforce, and the high standards of achievement to which they aspire.Antonio J. MendezMr. Mendez is recognized for founding the development and engineering capability in the Agency’s operational disguise program. His ideas led to the design and deployment of a series of increasingly sophisticated tools that enabled operations officers to change their appearance convincingly.Cord MeyerMr. Meyer defined the concept, doctrine and implementation of covert action. He was especially effective in using foreign media publications in support of US foreign policy objectives. At the height of the Cold War, he orchestrated much of the free world’s effort to counter the Soviet-dominated Communist Front organizations.Eloise R. PageMs. Page served as a role model for many at CIA. She became the first female Chief of Station, the first female senior executive, and the first woman to head a major Intelligence Community committee. She was recognized for her operational skills and exceptional management capability.John ParangoskyA pioneer in marshaling the technical capabili'
