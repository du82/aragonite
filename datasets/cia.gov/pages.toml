["https://cia.gov/about/organization/equal-employment-opportunity"]
title = "Office of Equal Employment Opportunity - CIA"
full_description = "OrganizationOffice of Equal Employment OpportunityThe Office of Equal Employment Opportunity (OEEO) helps maintain a workplace free of harassment and discrimination at the CIA.ContentsPoint Down IconWho We AreWhat We DoNo FEAR ActElijah Cummings ActWho We AreEqual Employment Opportunity (EEO) is a principle that asserts all people should have the right to work and advance on the basis of merit and ability.CIA’s Office of Equal Employment Opportunity (OEEO) serves as an Enterprise Function responsible for enforcing Federal Laws and Regulations that prohibit discrimination and harassment in the workplace. This is accomplished through the Federal EEO Complaint Process and is executed by certified EEO Counselors and Investigators.A federal employee, former employee or job applicant who believes they were discriminated against on the bases of age (40 and over), color, disability, national origin, race, religion, sex (including pregnancy), sexual orientation, genetic information (including family medical history), status as a parent, or reprisal (for having engaged in prior protected EEO activity) has the right to file a complaint with the Agency’s office responsible for its EEO programs.What We DoThe OEEO staff ensures Agency officers have access to an effective EEO complaint system that conducts fair, impartial, and thorough investigations in compliance with Federal law. To preserve their full rights under the law, Complainants must report allegations of discrimination and/or harassment to OEEO within 45 days of the alleged behavior or from when you knew or reasonably should have known of the action(s):Age (40 and over)ColorDisabilityNational originRaceReligionSex (including pregnancy)Sexual orientationGenetic information (including family medical history)Status as a parentReprisal/ retaliation for protected EEO activity (such as prior participation in the EEO process or opposing discrimination in the workplace)OEEO offers non-legal guidance to managers, supervisors, and employees through the Advice Only Program and a pre-complaint counseling process that includes focus on resolving EEO-related matters at the earliest possible stage.OEEO identifies potential workforce barriers and collects and disseminates workforce data, conducts analysis of workforce trends, and issues reports on workforce data, complaint trends and other types of EEO-related information.How to File an EEO ComplaintPoint Down IconApplicants or employees who believe they have been discriminated against on the bases of race, color, religion, sex (sexual orientation), national origin, age, disability, genetic information (including family medical history), and/or reprisal for prior participation in the EEO process can raise their concerns through CIA’s Office of Equal Employment Opportunity (OEEO).Please use the contact form, include your contact information, and request contact with the OEEO. To preserve the full range of your rights under federal law in the Federal EEO Complaint Process, you MUST contact an EEO counselor and express intent to enter the process within 45 calendar days of the date the alleged discriminatory action(s) occurred, or when you knew or reasonably should have known of the discriminatory action(s).For more information about the Federal EEO Complaint Process, please visit www.eeoc.gov.No FEAR ActOn May 15, 2002, President Bush signed the Notification and Federal Employee Anti-discrimination and Retaliation Act of 2002 (No FEAR Act) into law. This Act holds federal agencies accountable for violations of anti-discrimination laws.As required by the No FEAR Act and U.S. Equal Employment Opportunity Commission (EEOC) rules, CIA posts quarterly data related to equal employment opportunity complaints. To review this data, download CIA’s below.No FEAR Act Q1 2025For more on the No FEAR Act, visit EEOC’s website.Elijah Cummings Act NoticesThe Elijah E. Cummings Federal Employee Antidiscrimination Act of 2020 amended the No FEAR Act and requires Federal agencies to post findings of discrimination (including retaliation) from any final action of the Agency, the EEOC, or a court of jurisdiction, after all appeals are exhausted. Agencies must publish such notices for one year. To review the recent Notices, please click the link below.The Elijah E. Cummings Federal Employee Antidiscrimination Act of 2020Affirmative Action Plan for the Recruitment, Hiring, Advancement, and Retention of Persons with DisabilitiesContentsPoint Down IconWho We AreWhat We DoNo FEAR ActElijah Cummings Act"
