["https://cia.gov/careers/language-opportunities/foreign-language-incentive-program"]
title = "Foreign Language Incentive Program - CIA"
full_description = "Language OpportunitiesForeign Language Incentive ProgramThe CIA values all foreign language skills, and many of our positions allow you the opportunity to apply your language skills to help keep our country safe.Our Foreign Language Incentive Program provides monetary bonuses to new and current employees with foreign language skills who meet proficiency requirements. Explore the drop down menu below to learn more about our various incentives, as well as to see a full list of languages that qualify for a foreign language incentive.In order to rate a candidate or employee’s proficiency, we use the Interagency Language Roundtable (ILR). Learn more about the ILR scale on our Foreign Language Proficiency Scale page, where you can accurately determine your language proficiency before you submit your resume via MyLINK.View our foreign language career opportunities and submit your resume today.Language Proficiency Hiring BonusPoint Down IconThis bonus is paid to new employees who meet the minimum proficiency requirements from a qualifying list of languages, work in a language-designated occupation and sign a continued service agreement with the CIA. New employees can qualify for this hiring bonus in more than one language.Language Maintenance ProgramPoint Down IconThis program is for Agency employees who possess and maintain language proficiency from a qualifying list of languages, regardless of their position. By sustaining qualifying proficiency levels, you can receive maintenance bonus pay in each biweekly paycheck – ranging from $75 to $250.Language Use ProgramPoint Down IconThis program offers additional bonus compensation for employees who meet the Language Maintenance Program requirements and work in certain qualifying positions where it is necessary for you to regularly use your language skills. This biweekly bonus pay ranges from $75 to $400.Qualifying LanguagesPoint Down IconAfrikaansAlbanianAmharicArabicArmenianAzerbaijaniBaluchiBengaliBosnian