title = "Graphics and Videography Specialist – Engineer - CIA"
full_description = "SaveBookmark IconSave jobBrowse CIA JobsGraphics and Videography Specialist – EngineerGraphics and Videography Specialists working in Engineering apply hands-on expertise to design and build tailored solutions to meet Agency-wide mission imperatives.Full-TimeStarting Salary: $68,405 -$181,216**Higher starting salary possible depending on experience levelAnimation, Graphics, Special EffectsForeign Language Bonus EligibleOpportunities for domestic and foreign travel are possibleExpress InterestArrow Right IconAgency-wide RequirementsAll applicants must be:U.S. citizens (dual U.S. citizens also eligible)At least 18 years of ageWilling to move to the Washington, DC areaAble to complete security and medical evaluationsRegistered for the Selective ServiceAbout the JobAs a Graphics and Videography Specialist – Engineer, you will play an integral part in synthesizing your graphics-related skillset with in-house technical capabilities to produce highly specialized solutions. You will have the opportunity to work directly with mission partners to translate their needs into technical requirements to fulfill their objectives. You will collaborate with multidisciplinary, deep subject matter experts to participate on and lead teams that develop new and innovative solutions in support of CIA’s mission to collect foreign intelligence.What You’ll GetOur benefits support every aspect of a working professional’s life, including health and wellness, time off, family, finances, and continuing education. Our programs include highly sought-after government health benefits, flexible schedules, sick leave, and childcare. In some cases, we also offer sign-on incentives and cover moving expenses if you relocate.As a CIA employee, you’ll also get the satisfaction of knowing your work is part of something bigger than yourself. Our work is driven by one mission: to keep our Nation safe. Every day is an opportunity to enhance U.S. national security.Learn more about working at CIAMinimum QualificationsBachelor’s degree, master’s degree, or equivalent work experience in at least one of the following: AnimationVideo graphics and/or special effectsGraphic designVideography At least a 3.0 GPA on a 4-point scaleAbility to meet the minimum requirements for joining CIA, including U.S. citizenship and a background investigationDesired QualificationsDemonstrated proficiency in: Interpersonal skills Verbal and written communication skills Customer service Critical thinking and problem-solving skills Strong team and independent work ethic Ability to build or enhance unique technical solutions and toolsCreative problem-solving and critical thinking skillsAbility to work effectively in a fast-paced, mission-focused environment, with multiple competing prioritiesHands-on design and fabrication experience of graphics-based substrates (labels, signs, etc.)Interpersonal, organizational, and planning skillsMulti-disciplinary teamwork experienceParticipation in design competitionsSelf-starter with strong initiativeTeambuilding skillsAbility to translate customer needs into successful prioritized deliveries"
