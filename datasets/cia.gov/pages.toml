["https://cia.gov/careers/accommodations"]
title = "Accommodations - CIA"
full_description = "CareersAccommodationsEveryone deserves to have what they need to complete the hiring process and do their job. We are committed to providing reasonable accommodations to all qualified individuals who request them.Requesting AccommodationsTo request accommodations at any time, you can either:Call our Ability Talent Broker at 866-237-7221.Or, work with your Recruitment Center Point of Contact to make your request. Then, a professional from our Agency’s Reasonable Accommodations Staff will contact you.Our Ability Talent Broker and Reasonable Accommodations Staff are happy to work with you to discuss your needs. They can also answer questions or address any concerns you may have.Types of AccommodationsA reasonable accommodation is a modification to a job-related process, recruitment-related process, the work environment, or the manner or circumstances under which the job is customarily performed that enables a qualified individual with a disability to perform the essential job functions, or to enjoy benefits and privileges of employment.Accommodations vary depending on the nature of the job and each individual’s unique needs. That’s why we handle accommodation requests on a case-by-case basis. We are an inclusive organization and it is our goal to ensure everyone can enjoy equal employment opportunities.Examples of Accommodations and Services We ProvideSign language interpretersModifications to hiring process testingModifications to a facility, office, or conference room for accessibility purposesAssistive technology software—such as Text to Speech, Screen Readers, ZoomText, Video Relay System, and othersFlexible work schedule optionsHuman readersPersonal care assistantsDisclosing a DisabilityWhether you choose to disclose your disability at any point is entirely up to you. Legally, you are not obligated to disclose this information. However, choosing to disclose will allow a professional from our Reasonable Accommodations Staff to assist with the specified accommodation throughout all phases of the hiring process.Please note we keep all information pertaining to your disability confidential. The information is not released to the public or selection officials. Equal Employment OpportunityWe are proud to be an Equal Opportunity Employer. We don’t discriminate on the basis of race, color, religion, sex, national origin, disability, age, or sexual orientation.Learn moreAligned IconCIA's Hiring ProcessGiven the nature of our mission, our application process can be lengthy. Get a high-level overview of our hiring process so you can know what to expect before you submit your resume via MyLINK.Learn moreAligned IconWorking at CIA In addition to a comprehensive benefits package, we offer exciting career opportunities in a dynamic environment. Explore our world and imagine yourself working at CIA.Learn moreAligned Icon"
year_published = 2025
clearnet = "https://cia.gov/careers/accommodations"
