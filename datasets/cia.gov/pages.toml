title = "Organization - CIA"
full_description = 'About CIAOrganizationOur Agency is made up of five broad disciplines, known as directorates, which join forces under the umbrella of Mission Centers. Each team brings a unique set of capabilities that, when combined, support our vital mission.ContentsPoint Down IconDirectoratesMission CentersExecutive OfficesCIA is an independent agency responsible for providing national security intelligence to senior US policymakers. The Director of the Central Intelligence Agency (D/CIA) is nominated by the president with the advice and consent of the Senate. The Director manages the operations, personnel, and budget of the Central Intelligence Agency.The CIA is separated into five basic components that carry out “the intelligence cycle,” the process of collecting, analyzing, and disseminating intelligence information to top US government officials. In addition, the D/CIA has several offices of staff that manage specific Agency executive functions and liaison to other external government entities.<picture><source type="image/webp" srcSet="/static/7dbfd255ebc5d698a594080bca0939c1/d5f48/offices_of_cia.webp 269w,/static/7dbfd255ebc5d698a594080bca0939c1/bd203/offices_of_cia.webp 539w,/static/7dbfd255ebc5d698a594080bca0939c1/74301/offices_of_cia.webp 1077w" sizes="(min-width: 1077px) 1077px, 100vw"/><img data-gatsby-image-ssr="" data-main-image="" style="opacity:0" sizes="(min-width: 1077px) 1077px, 100vw" decoding="async" loading="lazy" src="/static/7dbfd255ebc5d698a594080bca0939c1/6ee6f/offices_of_cia.png" srcSet="/static/7dbfd255ebc5d698a594080bca0939c1/90652/offices_of_cia.png 269w,/static/7dbfd255ebc5d698a594080bca0939c1/0cc19/offices_of_cia.png 539w,/static/7dbfd255ebc5d698a594080bca0939c1/6ee6f/offices_of_cia.png 1077w" alt="Offices of CIA"/></picture>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}*For a printable version of the graphic, click hereDirectoratesDirectorate of AnalysisDirectorate of OperationsDirectorate of Science and TechnologyDirectorate of Digital InnovationDirectorate of SupportMission CentersMission Centers work closely with all Agency elements to meet national security challenges. Mission Centers bring together a full range of operational, analytic, support, technical, and digital capabilities.Officers from each directorate work together as one to address present and future threats. Today, there are eleven Mission Centers that specialize in key regional and high-priority issues:Africa Mission CenterChina Mission CenterCounterintelligence Mission CenterCounterterrorism Mission CenterEast Asia & Pacific Mission CenterEurope & Eurasia Mission CenterNear East Mission CenterSouth & Central Asia Mission CenterTransnational & Technology Mission CenterWeapons & Counterproliferation Mission CenterWestern Hemisphere Mission CenterExecutive OfficesThe Director of the CIA maintains a diverse executive staff to oversee key Agency functions. These offices include, but are not limited to:Human Resources, which builds and shapes CIA’s workforce around our Nation’s intelligence needsCongressional Affairs, which serves as liaison between CIA and Congress while ensuring Congress is fully informed of intelligence activitiesGeneral Counsel, which is responsible for the sound and efficient management of all CIA legal affairs, including providing legal advice and guidanceMilitary Affairs, which coordinates, plans, executes, and sustains activities that support CIA and Department of Defense interactions worldwideThe Agency also has several offices that focus on public affairs, talent, internal oversight, and more.ContentsPoint Down IconDirectoratesMission CentersExecutive OfficesOffice of Equal Employment OpportunityThe Office of Equal Employment Opportunity serves as an Enterprise Function responsible for enforcing Federal Laws and Regulations that prohibit discrimination and harassment in the workplace.Learn moreAligned IconOffice of Privacy and Civil LibertiesThe Office of Privacy and Civil Liberties helps to ensure that privacy and civil liberties are integrated into the day-to-day conduct of the Agency’s intelligence mission.Learn moreAligned IconOffice of Inspector GeneralThe Office of Inspector General performs audits, inspections, and investigations of Agency activities and programs.Learn moreAligned IconOffice of Public AffairsThe Office of Public Affairs leads all media, public relations, and communications matters, including press and entertainment inquiries. OPA also manages this website and all of CIA’s official social media accounts.Learn moreAligned IconPrepublication Classification Review BoardInterested in publishing your work? If you’re a current or former CIA employee or contractor, you’ll need to submit your publication to the Prepublication Classification Review Board (formerly called the Publication Review Board). The Prepublication Classification Review Board reviews all publications prior to public release to protect classified information and U.S. national security.Learn About the Review Process<picture><source type="image/webp" srcSet="/static/5286527ce942105a2bf9221d116c2325/1a9ba/PUBS-Feature-2-f.webp 972w,/static/5286527ce942105a2bf9221d116c2325/16b05/PUBS-Feature-2-f.webp 1944w,/static/5286527ce942105a2bf9221d116c2325/515ba/PUBS-Feature-2-f.webp 3888w" sizes="(min-width: 3888px) 3888px, 100vw"/><img data-gatsby-image-ssr="" data-main-image="" style="opacity:0" sizes="(min-width: 3888px) 3888px, 100vw" decoding="async" loading="lazy" src="/static/5286527ce942105a2bf9221d116c2325/1c5bd/PUBS-Feature-2-f.jpg" srcSet="/static/5286527ce942105a2bf9221d116c2325/cb6be/PUBS-Feature-2-f.jpg 972w,/static/5286527ce942105a2bf9221d116c2325/be7f7/PUBS-Feature-2-f.jpg 1944w,/static/5286527ce942105a2bf9221d116c2325/1c5bd/PUBS-Feature-2-f.jpg 3888w" alt="Close-up of hands flipping through large binders of documents with two other binders in the background."/></picture>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}'
