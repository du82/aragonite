["https://cia.gov/careers/cias-hiring-process"]
title = "CIA's Hiring Process - CIA"
full_description = "CareersCIA's Hiring ProcessKnow What to Expect Before You ApplyWe protect the Nation and save lives. Our hiring process, from submitting your resume via MyLINK to the day you walk across the seal for the first time, may be lengthy. However, it could lead to an exciting career where you can truly make a difference.More ConsiderationsOverseas TravelPoint Down IconThroughout the hiring process, you may travel abroad for durations of 90 days or less. But, for your safety and security, do not contact CIA while you are physically outside of the United States or its territories. This includes hard copy mail, telephone, email, or Internet.DiscretionPoint Down IconAt CIA, protecting our employees’ identities and security is a top priority. For this reason, use discretion when discussing your interest in CIA employment with close friends and family. Do not mention on social media that you have submitted your resume and/or have been invited to apply for employment with CIA.Resubmitting your resume to CIAPoint Down IconIf you are not accepted to CIA after submitting your resume and/or application, please wait 12 months and resubmit your resume via MyLINK. Your submission should include an updated resume that details how you have developed additional skills and experience that may align with employment at CIA.Consent to a Background InvestigationPoint Down IconIf invited to apply to a position CIA, you will be consenting to a background investigation by the U.S. Government and its agents, and to the use of any information you provide to CIA for any of its authorized activities.Reading ListPoint Down IconFor those interested in exploring careers at CIA, we encourage you to review the below reading list offering several stories and perspectives of U.S. intelligence activities.Agency Reading ListCIA RequirementsTo help us carry out our mission, we have certain requirements that all candidates must meet to be considered for employment.Learn moreAligned IconEqual Employment OpportunityAs an Equal Opportunity Employer, we do not discriminate on the basis of race, color, religion, sex, national origin, disability, age, or sexual orientation.Learn moreAligned IconAccommodationsIf you need accommodations at any point in the hiring process, contact our Reasonable Accommodations Staff.Learn moreAligned IconExplore Our HeadquartersTake a unique look inside CIA. You’ll see sights like our Memorial Wall, Museum, U.S. Presidents’ and CIA Directors’ galleries, and more.Learn moreAligned Icon"
year_published = 2025
clearnet = "https://cia.gov/careers/cias-hiring-process"
