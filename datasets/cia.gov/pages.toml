full_description = '''ResourcesWorld LeadersThe CIA publishes and updates the online directory of World Leaders and Cabinet Members of Foreign Governments weekly.Explore Foreign GovernmentsSearch over 195 governments throughout the world.Try Albania, Colombia, or a specific leader's name.Button to search CIA content.Explore All Foreign Governments<picture><source type="image/webp" srcSet="/resources/world-leaders/static/575dffa14db79ec61eb86e85fcc22628/31ae2/WL-LAN-feature-c%402x.webp 223w,/resources/world-leaders/static/575dffa14db79ec61eb86e85fcc22628/e1121/WL-LAN-feature-c%402x.webp 445w,/resources/world-leaders/static/575dffa14db79ec61eb86e85fcc22628/b7cad/WL-LAN-feature-c%402x.webp 890w" sizes="(min-width: 890px) 890px, 100vw"/><img data-gatsby-image-ssr="" data-main-image="" style="opacity:0" sizes="(min-width: 890px) 890px, 100vw" decoding="async" loading="lazy" src="/resources/world-leaders/static/575dffa14db79ec61eb86e85fcc22628/1fc33/WL-LAN-feature-c%402x.jpg" srcSet="/resources/world-leaders/static/575dffa14db79ec61eb86e85fcc22628/b1867/WL-LAN-feature-c%402x.jpg 223w,/resources/world-leaders/static/575dffa14db79ec61eb86e85fcc22628/08956/WL-LAN-feature-c%402x.jpg 445w,/resources/world-leaders/static/575dffa14db79ec61eb86e85fcc22628/1fc33/WL-LAN-feature-c%402x.jpg 890w" alt=""/></picture>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}Additional ResourcesKey to AbbreviationsHistorical Data<picture><source type="image/webp" srcSet="/resources/world-leaders/static/9ff42ea035bb1e7aba9591db8beeaefb/0b0be/kryptos_sculpture_2_lg.webp 245w,/resources/world-leaders/static/9ff42ea035bb1e7aba9591db8beeaefb/46441/kryptos_sculpture_2_lg.webp 490w,/resources/world-leaders/static/9ff42ea035bb1e7aba9591db8beeaefb/fa94f/kryptos_sculpture_2_lg.webp 980w" sizes="(min-width: 980px) 980px, 100vw"/><img data-gatsby-image-ssr="" data-main-image="" style="opacity:0" sizes="(min-width: 980px) 980px, 100vw" decoding="async" loading="lazy" src="/resources/world-leaders/static/9ff42ea035bb1e7aba9591db8beeaefb/63012/kryptos_sculpture_2_lg.jpg" srcSet="/resources/world-leaders/static/9ff42ea035bb1e7aba9591db8beeaefb/e4026/kryptos_sculpture_2_lg.jpg 245w,/resources/world-leaders/static/9ff42ea035bb1e7aba9591db8beeaefb/dba99/kryptos_sculpture_2_lg.jpg 490w,/resources/world-leaders/static/9ff42ea035bb1e7aba9591db8beeaefb/63012/kryptos_sculpture_2_lg.jpg 980w" alt=""/></picture>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}<picture><source type="image/webp" srcSet="/resources/world-leaders/static/0ef0a966e11a55263b452c725f2fec78/5d191/Glyphs_Resources_Positive.webp 90w,/resources/world-leaders/static/0ef0a966e11a55263b452c725f2fec78/52f83/Glyphs_Resources_Positive.webp 180w,/resources/world-leaders/static/0ef0a966e11a55263b452c725f2fec78/27ab5/Glyphs_Resources_Positive.webp 360w" sizes="(min-width: 360px) 360px, 100vw"/><img data-gatsby-image-ssr="" data-main-image="" style="opacity:0" sizes="(min-width: 360px) 360px, 100vw" decoding="async" loading="lazy" src="/resources/world-leaders/static/0ef0a966e11a55263b452c725f2fec78/257af/Glyphs_Resources_Positive.png" srcSet="/resources/world-leaders/static/0ef0a966e11a55263b452c725f2fec78/25ed1/Glyphs_Resources_Positive.png 90w,/resources/world-leaders/static/0ef0a966e11a55263b452c725f2fec78/a2c25/Glyphs_Resources_Positive.png 180w,/resources/world-leaders/static/0ef0a966e11a55263b452c725f2fec78/257af/Glyphs_Resources_Positive.png 360w" alt=""/></picture>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}About World LeadersThe CIA publishes and updates the online directory of World Leaders and Cabinet Members of Foreign Governments weekly. The directory is intended to be used primarily as a reference aid and includes as many governments of the world as is considered practical, some of them not officially recognized by the United States. Regimes with which the United States has no diplomatic exchanges are indicated by the initials NDE. Governments are listed according to the most commonly used version of each country's name. The spelling of the personal names in this directory follows transliteration systems generally agreed upon by US Government agencies, except in the cases in which officials have stated a preference for alternate spellings of their names. NOTE: Although the head of the central bank is listed for each country, in most cases he or she is not a Cabinet member. Ambassadors to the United States and Permanent Representatives to the UN, New York, have also been included.'''
