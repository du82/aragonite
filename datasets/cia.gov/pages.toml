title = "Working at CIA - CIA"
full_description = 'CareersWorking at CIAWhy CIA?The work here is more than just a job—it’s a career and a lifestyle. Our teams serve at the forefront of an ever-changing global landscape with one common goal: to keep our country safe. When you are part of the Nation’s premier intelligence agency, your opportunities for growth are boundless. Our legacy is your legacy.Explore our world and imagine yourself working toward a mission that matters while advancing your career.<picture><source type="image/webp" srcSet="/careers/static/5901befc872f0918f2c5fdd27aa88964/62859/Protection_1383681281-1-scaled.webp 640w,/careers/static/5901befc872f0918f2c5fdd27aa88964/828a3/Protection_1383681281-1-scaled.webp 1280w,/careers/static/5901befc872f0918f2c5fdd27aa88964/bbd9a/Protection_1383681281-1-scaled.webp 2560w" sizes="(min-width: 2560px) 2560px, 100vw"/><img data-gatsby-image-ssr="" data-main-image="" style="opacity:0" sizes="(min-width: 2560px) 2560px, 100vw" decoding="async" loading="lazy" src="/careers/static/5901befc872f0918f2c5fdd27aa88964/9466f/Protection_1383681281-1-scaled.jpg" srcSet="/careers/static/5901befc872f0918f2c5fdd27aa88964/e70fc/Protection_1383681281-1-scaled.jpg 640w,/careers/static/5901befc872f0918f2c5fdd27aa88964/af556/Protection_1383681281-1-scaled.jpg 1280w,/careers/static/5901befc872f0918f2c5fdd27aa88964/9466f/Protection_1383681281-1-scaled.jpg 2560w" alt="A mother and her young daughter sitting on a sofa looking at a computer."/></picture>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}Make a World of DifferenceAt CIA, you’ll be a part of the Nation’s first line of defense. Our success isn’t driven by bottom lines or client demands, but instead by service to United States and safeguarding our Nation’s people. Our professionals play critical roles in preempting threats and furthering national security objectives—from working against terrorism and cyber-attacks to preventing the spread of biological weapons and more. No matter the position, when you are working at CIA you are contributing to the work of a nation at the center of intelligence.Learn About Our MissionMy clients are all over the world, literally. I get people in here back from warzone assignments. I can tell they’ve been overseas because the water changes their hair. I’ve cut hair for Directors, analysts, ops officers, and everyone in between.<picture><source type="image/webp" srcSet="/careers/static/fbe73ca3cb62c62781a438e381ddc12c/410d2/Humans_CIA_Quote3-sm.webp 64w,/careers/static/fbe73ca3cb62c62781a438e381ddc12c/141f9/Humans_CIA_Quote3-sm.webp 128w,/careers/static/fbe73ca3cb62c62781a438e381ddc12c/a5d60/Humans_CIA_Quote3-sm.webp 255w" sizes="(min-width: 255px) 255px, 100vw"/><img data-gatsby-image-ssr="" data-main-image="" style="opacity:0" sizes="(min-width: 255px) 255px, 100vw" decoding="async" loading="lazy" src="/careers/static/fbe73ca3cb62c62781a438e381ddc12c/171c6/Humans_CIA_Quote3-sm.jpg" srcSet="/careers/static/fbe73ca3cb62c62781a438e381ddc12c/d306e/Humans_CIA_Quote3-sm.jpg 64w,/careers/static/fbe73ca3cb62c62781a438e381ddc12c/8f42e/Humans_CIA_Quote3-sm.jpg 128w,/careers/static/fbe73ca3cb62c62781a438e381ddc12c/171c6/Humans_CIA_Quote3-sm.jpg 255w" alt="A bearded man staring directly into camera."/></picture>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}Agency BarberTake Advantage of Competitive Benefits Programs We offer a wide variety of federal benefits that are hard to match. From flexible work schedules and generous time off to competitive health care plans and retirement programs, you’ll be rewarded with a benefits package that reflects your dedication and contributions to our mission. We are committed to the health, wellbeing, and advancement of our employees. We show our commitment by providing fitness facilities, Agency Resource Groups, and opportunities to continue your education.Review Our BenefitsWe’re all here for the mission, and so we find ways to collaborate and work with one another. We know that a team is always going to be better than the individual.<picture><source type="image/webp" srcSet="/careers/static/07175c246b695ba30cb0e927d9a9b939/410d2/Humans_CIA_Quote2-sm.webp 64w,/careers/static/07175c246b695ba30cb0e927d9a9b939/141f9/Humans_CIA_Quote2-sm.webp 128w,/careers/static/07175c246b695ba30cb0e927d9a9b939/a5d60/Humans_CIA_Quote2-sm.webp 255w" sizes="(min-width: 255px) 255px, 100vw"/><img data-gatsby-image-ssr="" data-main-image="" style="opacity:0" sizes="(min-width: 255px) 255px, 100vw" decoding="async" loading="lazy" src="/careers/static/07175c246b695ba30cb0e927d9a9b939/171c6/Humans_CIA_Quote2-sm.jpg" srcSet="/careers/static/07175c246b695ba30cb0e927d9a9b939/d306e/Humans_CIA_Quote2-sm.jpg 64w,/careers/static/07175c246b695ba30cb0e927d9a9b939/8f42e/Humans_CIA_Quote2-sm.jpg 128w,/careers/static/07175c246b695ba30cb0e927d9a9b939/171c6/Humans_CIA_Quote2-sm.jpg 255w" alt="A pair of cleated shoes held over the shoulder of a woman in front of an American flag."/></picture>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}Political AnalystHave a Dynamic Career Without Switching EmployersIn the private sector, if you want to shift from one field to another or move to another work location, you’d likely have to change companies. That’s not the case at CIA. We give our employees opportunities for personal and professional growth. You’ll feel challenged to be your absolute best with competitive compensation and the opportunity for financial rewards. Many of our employees stay for an entire career because of the opportunities for challenging, rewarding work.Browse Jobs at CIACIA is a place that values people with different backgrounds and perspectives. The goal being to create a community that fosters a sense of belonging in a way that enriches officers and empowers them to advance CIA’s mission.<picture><source type="image/webp" srcSet="/careers/static/82e6d45a73bc417b232fc336ecab6e4c/410d2/Humans_CIA_Quote4-sm.webp 64w,/careers/static/82e6d45a73bc417b232fc336ecab6e4c/141f9/Humans_CIA_Quote4-sm.webp 128w,/careers/static/82e6d45a73bc417b232fc336ecab6e4c/a5d60/Humans_CIA_Quote4-sm.webp 255w" sizes="(min-width: 255px) 255px, 100vw"/><img data-gatsby-image-ssr="" data-main-image="" style="opacity:0" sizes="(min-width: 255px) 255px, 100vw" decoding="async" loading="lazy" src="/careers/static/82e6d45a73bc417b232fc336ecab6e4c/171c6/Humans_CIA_Quote4-sm.jpg" srcSet="/careers/static/82e6d45a73bc417b232fc336ecab6e4c/d306e/Humans_CIA_Quote4-sm.jpg 64w,/careers/static/82e6d45a73bc417b232fc336ecab6e4c/8f42e/Humans_CIA_Quote4-sm.jpg 128w,/careers/static/82e6d45a73bc417b232fc336ecab6e4c/171c6/Humans_CIA_Quote4-sm.jpg 255w" alt="A woman in an orange coat walking up the steps outside CIA Headquarters"/></picture>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}Data ScientistBe at the Leading Edge of Your Career Specialty Our world is changing every day, making each day at CIA an exciting adventure. You will apply your unique expertise, skills, and personal initiative to help us achieve our mission and continue our legacy. No matter your role or expertise, you’ll be at the forefront of your specialty on a global scale. Whether you’re on the front line of human intelligence as a Case Officer or using your talents in science and engineering or anything in between, you’ll have the rare chance to grow your career and foster your skills while making a difference for your country.Discover Our LegacyI started at CIA more than 40 years ago working as a security monitor. I worked five nights a week while I was in school. When CIA stood up its new protective program they asked me if I wanted in. I couldn’t say no.<picture><source type="image/webp" srcSet="/careers/static/f3d01a566a16b9dbf09f4536bfac2387/410d2/Humans_CIA_Quote5-sm.webp 64w,/careers/static/f3d01a566a16b9dbf09f4536bfac2387/141f9/Humans_CIA_Quote5-sm.webp 128w,/careers/static/f3d01a566a16b9dbf09f4536bfac2387/a5d60/Humans_CIA_Quote5-sm.webp 255w" sizes="(min-width: 255px) 255px, 100vw"/><img data-gatsby-image-ssr="" data-main-image="" style="opacity:0" sizes="(min-width: 255px) 255px, 100vw" decoding="async" loading="lazy" src="/careers/static/f3d01a566a16b9dbf09f4536bfac2387/171c6/Humans_CIA_Quote5-sm.jpg" srcSet="/careers/static/f3d01a566a16b9dbf09f4536bfac2387/d306e/Humans_CIA_Quote5-sm.jpg 64w,/careers/static/f3d01a566a16b9dbf09f4536bfac2387/8f42e/Humans_CIA_Quote5-sm.jpg 128w,/careers/static/f3d01a566a16b9dbf09f4536bfac2387/171c6/Humans_CIA_Quote5-sm.jpg 255w" alt="A woman in a dark colored police jacket."/></picture>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}Security Protective ServiceWork on a Team that Values Mentorship and IntegrityAt CIA, we know the best work comes from people who feel fulfilled and supported in their roles. No matter your assignment, you can feel the energy, intensity, and passion of our work. You’ll see teamwork, collaboration, and our values at the core of everything we do. We are a family that supports, relies on, and learns from one another to accomplish our shared mission.Learn About Our OrganizationIf you do it right, there are people who can go home one day who might not have otherwise gone home. And they don’t know it, but you know it. That type of reward supersedes what you can do anywhere else – that you can truly make the world a better, safer place.<picture><source type="image/webp" srcSet="/careers/static/a0badde6d2aeddb5c5ffb12933e072dd/410d2/Humans_CIA_Quote1-sm.webp 64w,/careers/static/a0badde6d2aeddb5c5ffb12933e072dd/141f9/Humans_CIA_Quote1-sm.webp 128w,/careers/static/a0badde6d2aeddb5c5ffb12933e072dd/a5d60/Humans_CIA_Quote1-sm.webp 255w" sizes="(min-width: 255px) 255px, 100vw"/><img data-gatsby-image-ssr="" data-main-image="" style="opacity:0" sizes="(min-width: 255px) 255px, 100vw" decoding="async" loading="lazy" src="/careers/static/a0badde6d2aeddb5c5ffb12933e072dd/171c6/Humans_CIA_Quote1-sm.jpg" srcSet="/careers/static/a0badde6d2aeddb5c5ffb12933e072dd/d306e/Humans_CIA_Quote1-sm.jpg 64w,/careers/static/a0badde6d2aeddb5c5ffb12933e072dd/8f42e/Humans_CIA_Quote1-sm.jpg 128w,/careers/static/a0badde6d2aeddb5c5ffb12933e072dd/171c6/Humans_CIA_Quote1-sm.jpg 255w" alt="A man in a suit standing with his arms crossed."/></picture>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}Targeting AnalystStudent Programs Protect our nation and gain on-the-job experience with our paid internship, scholarship, and co-op opportunities.Learn moreAligned IconMilitary Transition We recognize those who have served in the military by providing additional benefits to veterans.Learn moreAligned IconMyths vs. RealityFrom the lives of spies to government secrets, we’re debunking the 10 most