title = "Language Opportunities - CIA"
full_description = 'CareersLanguage OpportunitiesYour Language Skills Count Most When Everything Is on the Line.In our rapidly changing world, intelligence priorities can shift as countries and languages increase in importance. To stay ahead of these critical changes, it’s important that our employees have the language abilities and cultural expertise necessary to handle both emerging and current national security challenges.Whether your background is in cyber security, economics, logistics, or something else entirely, there is a place to use your language skills here to help keep our country safe.The CIA offers monetary bonuses for those who meet proficiency requirements in one or more of our mission critical languages. Visit the Foreign Language Incentive Program page to see a full list of languages that qualify for our incentives, and see our Foreign Language Proficiency Scale page to learn more about how we gauge a candidate or employee’s proficiency.Foreign Language Incentive ProgramForeign language skills are critical to much of the work we do across the CIA. Our Foreign Language Incentive Program provides monetary bonuses to new and current employees with excellent foreign language skills who meet proficiency requirements.Learn More<picture><source type="image/webp" srcSet="/careers/static/8499a07ccd2bbdca69b0e1fcfbd5573f/0def7/language-incentive-program.webp 203w,/careers/static/8499a07ccd2bbdca69b0e1fcfbd5573f/78b33/language-incentive-program.webp 406w,/careers/static/8499a07ccd2bbdca69b0e1fcfbd5573f/e366c/language-incentive-program.webp 811w" sizes="(min-width: 811px) 811px, 100vw"/><img data-gatsby-image-ssr="" data-main-image="" style="opacity:0" sizes="(min-width: 811px) 811px, 100vw" decoding="async" loading="lazy" src="/careers/static/8499a07ccd2bbdca69b0e1fcfbd5573f/1f32a/language-incentive-program.jpg" srcSet="/careers/static/8499a07ccd2bbdca69b0e1fcfbd5573f/c4e42/language-incentive-program.jpg 203w,/careers/static/8499a07ccd2bbdca69b0e1fcfbd5573f/cd2e0/language-incentive-program.jpg 406w,/careers/static/8499a07ccd2bbdca69b0e1fcfbd5573f/1f32a/language-incentive-program.jpg 811w" alt="Man sitting with dark jacket and purple tie."/></picture>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}Foreign Language Proficiency ScaleWe need professionals with language abilities in a wide variety of positions across the CIA. In order to properly gauge a candidate or employee’s proficiency in a foreign language, we use the Interagency Language Roundtable (ILR) scale.Learn More<picture><source type="image/webp" srcSet="/careers/static/9a458b992b35205cee8ba7283d7cdf80/8e8f4/foreign-language-proficiency.webp 145w,/careers/static/9a458b992b35205cee8ba7283d7cdf80/1b091/foreign-language-proficiency.webp 289w,/careers/static/9a458b992b35205cee8ba7283d7cdf80/fa6d8/foreign-language-proficiency.webp 578w" sizes="(min-width: 578px) 578px, 100vw"/><img data-gatsby-image-ssr="" data-main-image="" style="opacity:0" sizes="(min-width: 578px) 578px, 100vw" decoding="async" loading="lazy" src="/careers/static/9a458b992b35205cee8ba7283d7cdf80/32a9d/foreign-language-proficiency.jpg" srcSet="/careers/static/9a458b992b35205cee8ba7283d7cdf80/50147/foreign-language-proficiency.jpg 145w,/careers/static/9a458b992b35205cee8ba7283d7cdf80/4e907/foreign-language-proficiency.jpg 289w,/careers/static/9a458b992b35205cee8ba7283d7cdf80/32a9d/foreign-language-proficiency.jpg 578w" alt="Woman facing camera wit