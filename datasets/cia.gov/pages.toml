full_description = "Language OpportunitiesIntelligence Language InstituteThe Intelligence Language Institute (ILI) is the premier language school in the Intelligence Community.The ILI supports CIA’s intelligence mission by enabling and enhancing foreign language skills anytime, anywhere. By creating an ideal teaching environment, the ILI prepares our employees to fully utilize their foreign language skills to help keep our nation safe.The ILI hires Foreign Language Instructors with proficiency in the following languages:ArabicBurmeseBosnian/Croatian/SerbianChineseDariFrenchGermanGreekIndonesianItalianJapaneseKoreanPashtoPersian (Farsi)PortugueseRussianSpanishThaiTurkishVietnamese"
