["https://cia.gov/stories/story/presidential-reflections-on-us-intelligence-jimmy-carter"]
title = "Presidential Reflections on U.S. Intelligence: Jimmy Carter - CIA"
full_description = '''StoriesPresidential Reflections on U.S. Intelligence: Jimmy CarterJanuary 08, 2025<picture><source type="image/webp" srcSet="/static/f4b745b170a403f4660ee33008018f91/ff6b4/president-carter-library-of-congress.webp 1104w,/static/f4b745b170a403f4660ee33008018f91/3f467/president-carter-library-of-congress.webp 2208w,/static/f4b745b170a403f4660ee33008018f91/371e6/president-carter-library-of-congress.webp 4416w" sizes="(min-width: 4416px) 4416px, 100vw"/><img data-gatsby-image-ssr="" data-main-image="" style="opacity:0" sizes="(min-width: 4416px) 4416px, 100vw" decoding="async" loading="lazy" src="/static/f4b745b170a403f4660ee33008018f91/8f4da/president-carter-library-of-congress.jpg" srcSet="/static/f4b745b170a403f4660ee33008018f91/79d67/president-carter-library-of-congress.jpg 1104w,/static/f4b745b170a403f4660ee33008018f91/64561/president-carter-library-of-congress.jpg 2208w,/static/f4b745b170a403f4660ee33008018f91/8f4da/president-carter-library-of-congress.jpg 4416w" alt=""/></picture>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}Jimmy Carter was the 39th President of the United States and a fervent champion of human rights around the globe. Despite significant foreign policy achievements, his presidential term coincided with a turbulent period in world affairs, especially from 1979-80. Through it all, Carter received dedicated intelligence support from the Central Intelligence Agency.In memory of Carter, CIA historians are honored to highlight some background on Carter’s relationship with the Agency in the lead-up to and during his presidency, as well as share a recently declassified copy of the first President’s Daily Brief (PDB) that Carter received after taking office.Carter and Intelligence BriefingsIn the summer of 1976, then-Georgia Governor and presidential hopeful Jimmy Carter took the unprecedented initiative of asking for intelligence briefings before he was officially nominated as his party’s candidate for U.S. President. President Gerald Ford, Director of Central Intelligence (DCI) George H.W. Bush, and National Security Adviser Brent Scowcroft agreed to Carter’s request.At first, Carter was somewhat skeptical of the Agency. His skepticism was largely shaped by the times. The 1970s were difficult for the Intelligence Community (IC), as the nation’s distrust for the government came to a head in the wake of the Vietnam War and the Watergate scandal. Then, the IC was suddenly drawn into the spotlight after media revelations of a series of constitutionally questionable activities beginning in the 1950s that were directed by the Executive Branch but unknown to Congress and the American public. CIA found itself under intense congressional scrutiny amid calls for U.S. intelligence agencies to reveal all of their activities and subject themselves to more oversight.Carter’s early experiences with CIA briefings and finished intelligence products eased some of his concerns. During his initial briefings, Carter was inquisitive and eager to learn about intelligence activities. The CIA briefings were aimed at helping Carter understand the workings of the IC, as well as how to process the classified information he was being given. CIA briefers were impressed not only by Carter’s interest in their briefing, but by the hospitality shown to them by the aspiring President and Mrs. Carter.After Carter was officially nominated as the Democratic presidential candidate, DCI Bush presided over more detailed briefings. Bush brought several CIA officers with him to every briefing to ensure every question asked could be answered. The intelligence professionals met with Carter periodically during the campaign to bring him up to speed on the latest information.Prior to being sworn in as President, Carter began to receive daily copies of the PDB—a rigorous compilation of the IC’s analysis on key foreign developments affecting U.S. national security that is passed to the President and a select group of senior cabinet officials each day. The PDB is tailored to every President’s decision-making needs and formatting preferences. On January 20, 1977, Carter received his first PDB from CIA as President of the United States.Turner at the Helm of CIAAfter taking office, President Carter chose a new DCI, Admiral Stansfield Turner, to lead CIA. Turner had attended the Naval Academy with Carter, graduated at the top of his class, and had a very successful Navy career.Together, Carter and Turner redefined the relationship between Congress and the IC. In addition, Carter signed Executive Order 12036, which gave the DCI increased authority to manage the IC.<picture><source type="image/webp" srcSet="/static/990a94da206e0f77f4e69fee77f850c7/fd099/carter-speaking-to-cia-personnel-at-hq.webp 750w,/static/990a94da206e0f77f4e69fee77f850c7/a6dbc/carter-speaking-to-cia-personnel-at-hq.webp 1500w,/static/990a94da206e0f77f4e69fee77f850c7/5a933/carter-speaking-to-cia-personnel-at-hq.webp 3000w" sizes="(min-width: 3000px) 3000px, 100vw"/><img data-gatsby-image-ssr="" data-main-image="" style="opacity:0" sizes="(min-width: 3000px) 3000px, 100vw" decoding="async" loading="lazy" src="/static/990a94da206e0f77f4e69fee77f850c7/9c859/carter-speaking-to-cia-personnel-at-hq.jpg" srcSet="/static/990a94da206e0f77f4e69fee77f850c7/7d1de/carter-speaking-to-cia-personnel-at-hq.jpg 750w,/static/990a94da206e0f77f4e69fee77f850c7/adfe1/carter-speaking-to-cia-personnel-at-hq.jpg 1500w,/static/990a94da206e0f77f4e69fee77f850c7/9c859/carter-speaking-to-cia-personnel-at-hq.jpg 3000w" alt=""/></picture>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}Photo of then-President Carter speaking to CIA personnel at Headquarters, August 16, 1978, with Director of Central Intelligence Turner standing to his left. In a speech delivered during a visit to the Agency on August 16, 1978, Carter recognized the dedication of the men and women of CIA:“I appreciate what you are, what you do, the high professionalism, training, education, experience that you bring to your job and which you demonstrate every day with your good work, the honesty and integrity that you present to me and to your other superiors, to the Congress, to the public for critical examination.”<picture><source type="image/webp" srcSet="/static/179909eed5c4ed86363562fa6ec50d1d/3c2a7/carter-film.webp 227w,/static/179909eed5c4ed86363562fa6ec50d1d/dbc3a/carter-film.webp 455w,/static/179909eed5c4ed86363562fa6ec50d1d/9e523/carter-film.webp 909w" sizes="(min-width: 909px) 909px, 100vw"/><img data-gatsby-image-ssr="" data-main-image="" style="opacity:0" sizes="(min-width: 909px) 909px, 100vw" decoding="async" loading="lazy" src="/static/179909eed5c4ed86363562fa6ec50d1d/80acc/carter-film.jpg" srcSet="/static/179909eed5c4ed86363562fa6ec50d1d/ee699/carter-film.jpg 227w,/static/179909eed5c4ed86363562fa6ec50d1d/55d68/carter-film.jpg 455w,/static/179909eed5c4ed86363562fa6ec50d1d/80acc/carter-film.jpg 909w" alt=""/></picture>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}Photo series of Carter greeting CIA personnel at Headquarters, August 16, 1978. [Karl H. Schumacher; National Archives] Turning to CIA for Intelligence SupportTwo highlights of the vital role intelligence played during the Carter Administration are Carter’s brokering of the Camp David Accords and his approval of CIA’s operation to rescue the “Canadian Six” American diplomats after a hostile takeover of the U.S. Embassy in Tehran.Carter was determined to pursue peace between Israel and its Arab neighbors. Behind-the-scenes, CIA supported Carter’s diplomatic efforts leading up to his summit with Egyptian President Anwar Sadat and Israeli Prime Minister Menachem Begin at Camp David in September 1978. Intelligence documents provided to the Carter Administration included context on regional dynamics in the Middle East and leadership profiles on Sadat and Begin. After nearly two weeks of difficult negotiations, the Camp David Accords were signed, providing a framework for peace.<picture><source type="image/webp" srcSet="/static/e6e1fe7fe9b8d6280f99111c182adaaf/6adf3/carter-begin-sadat-and-their-delegations-at-camp-david.webp 1000w,/static/e6e1fe7fe9b8d6280f99111c182adaaf/71391/carter-begin-sadat-and-their-delegations-at-camp-david.webp 2000w,/static/e6e1fe7fe9b8d6280f99111c182adaaf/d6b06/carter-begin-sadat-and-their-delegations-at-camp-david.webp 4000w" sizes="(min-width: 4000px) 4000px, 100vw"/><img data-gatsby-image-ssr="" data-main-image="" style="opacity:0" sizes="(min-width: 4000px) 4000px, 100vw" decoding="async" loading="lazy" src="/static/e6e1fe7fe9b8d6280f99111c182adaaf/568a4/carter-begin-sadat-and-their-delegations-at-camp-david.jpg" srcSet="/static/e6e1fe7fe9b8d6280f99111c182adaaf/12432/carter-begin-sadat-and-their-delegations-at-camp-david.jpg 1000w,/static/e6e1fe7fe9b8d6280f99111c182adaaf/15859/carter-begin-sadat-and-their-delegations-at-camp-david.jpg 2000w,/static/e6e1fe7fe9b8d6280f99111c182adaaf/568a4/carter-begin-sadat-and-their-delegations-at-camp-david.jpg 4000w" alt=""/></picture>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}Photo Egyptian President Anwar Sadat (left), U.S. President Jimmy Carter (center), and Israeli Prime Minister Menachem Begin (right) making strides on a Middle East peace agreement in 1978. The end of Carter’s tenure, however, was a tumultuous time. In November 1979, Iranian militants seized control of the U.S. Embassy in Tehran and held 52 U.S. citizens hostage for more than a year. Throughout the crisis, Carter received extensive support from the Agency in the form of daily briefings, finished intelligence, and even a daring rescue operation that successfully freed six American diplomats—Argo.<picture><source type="image/webp" srcSet="/static/3b84029c77f55810b89a9572fa1ff58e/2b3fa/tony-mendez-and-president-carter.webp 164w,/static/3b84029c77f55810b89a9572fa1ff58e/7d9e8/tony-mendez-and-president-carter.webp 328w,/static/3b84029c77f55810b89a9572fa1ff58e/dce5f/tony-mendez-and-president-carter.webp 656w" sizes="(min-width: 656px) 656px, 100vw"/><img data-gatsby-image-ssr="" data-main-image="" style="opacity:0" sizes="(min-width: 656px) 656px, 100vw" decoding="async" loading="lazy" src="/static/3b84029c77f55810b89a9572fa1ff58e/aa531/tony-mendez-and-president-carter.jpg" srcSet="/static/3b84029c77f55810b89a9572fa1ff58e/19ba4/tony-mendez-and-president-carter.jpg 164w,/static/3b84029c77f55810b89a9572fa1ff58e/23769/tony-mendez-and-president-carter.jpg 328w,/static/3b84029c77f55810b89a9572fa1ff58e/aa531/tony-mendez-and-president-carter.jpg 656w" alt=""/></picture>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}Photo of Carter congratulating CIA officer Tony Mendez (left) on his successful Argo operation, 1980. Click on The Langley Files podcast thumbnails to hear the side of the Argo mission that hasn't been shared beforeA Presidential Farewell TraditionFrom President Truman on, each president has written a note of thanks to the men and women of the CIA. These notes are displayed with the president’s official photograph in the Presidential Gallery near the lobby of CIA Headquarters.<picture><source type="image/webp" srcSet="/static/a985491f70bf1f7f2b729a495601d9c2/ee017/carter-portrait-with-n