["https://cia.gov/contact-cia"]
title = "Contact CIA - CIA"
full_description = 'CIAContact CIAThere are a number of ways to contact CIA. Please read these instructions to make sure your message gets to the right office.<a href="/contact-cia" class="button button-default button-stack" target="_self" rel="noopener noreferrer">Contact</a>Contact CIAArrow Right IconContentsPoint Down IconGeneral Questions and CommentsInformation or ThreatsPrivacy and Civil LibertiesInspector GeneralEmployment VerificationPrepublication Classification Review BoardEqual Employment Opportunity ComplaintsCareers and EmploymentGeneral Questions and CommentsThe Office of Public Affairs (OPA) handles all questions about the Agency. We read every letter and online message, directing comments to CIA officials and responding as appropriate. Before contacting CIA, be sure to check CIA.gov for the information you’re looking for.Contact CIA by Postal MailYou can send questions and comments to:Central Intelligence AgencyOffice of Public AffairsWashington, D.C. 20505Information or ThreatsIf you have information you think might help CIA and our foreign intelligence collection mission, there are more ways to reach us. Follow the instructions on the Report Information page.Privacy and Civil LibertiesMembers of the public may contact the CIA Privacy and Civil Liberties Office to make a complaint regarding possible violations of privacy protections or civil liberties in the administration of CIA programs and operations. Contact the Office of Privacy and Civil Liberties.Inspector GeneralQuestions or comments about oversight of our Agency? Contact the Office of Inspector General. Employment VerificationNeed to verify an employee’s employment? Contact the Employment Verification Office.Prepublication Classification Review BoardIntending to share intelligence-related materials you’ve created, like blog posts or books, with the public? If you have worked for CIA in a staff or contract capacity, you’ll need to submit these products for approval. For guidance and instructions, visit the Prepublication Classification Review Board page.Equal Employment Opportunity ComplaintsApplicants or employees who believe they have been discriminated against on the bases of race, color, religion, Sex/gender (sexual orientation and gender identity), national origin, age, disability, genetic information (including family medical history), and/or reprisal for prior participation in the EEO process can raise their concerns through CIA’s Office of Equal Employment Opportunity (OEEO).Please use the contact form, include your contact information, and request contact with the OEEO. To preserve the full range of your rights under federal law in the Federal EEO Complaint Process, you MUST contact an EEO counselor and express intent to enter the process within 45 calendar days of the date the alleged discriminatory action(s) occurred, or when you knew or reasonably should have known of the discriminatory action(s).Careers and EmploymentInterested in working at CIA? Visit the Careers page to browse jobs and apply online. You can also learn about CIA’s hiring process, what it’s like to work at CIA, and requirements for joining CIA. CIA does not answer questions about employment beyond the information on CIA.gov. For safety and security reasons, CIA only accepts online applications and does not accept resumes. CIA does not answer questions about the status of job applications.CIA cannot return phone calls, emails, or other forms of communication from U.S. citizens living outside of the United States. If you are interested in applying for a job with CIA, you can apply online when you return permanently to the United States.ContentsPoint Down IconGeneral Questions and CommentsInformation or ThreatsPrivacy and Civil LibertiesInspector GeneralEmployment VerificationPrepublication Classification Review BoardEqual Employment Opportunity ComplaintsCareers and Employment'
