r and the date that status was acquired. - Please sign and date your request, and have it notarized or state, "I declare under penalty of perjury under the laws of the United States of America that the foregoing is true and correct, and that I am the person named above and requesting access to my records [, or records that I am entitled to request as the parent of a minor, or as the duly-appointed attorney-in-fact for the individual, or the legal guardian of the individual], and I understand that any falsification of this statement is punishable under the provisions of 18 U.S.C. § 1001 by a fine, imprisonment of not more than five years, or both, and that requesting or obtaining any record(s) under false pretenses is punishable under the provisions of 5 U.S.C. § 552a(i)(3) by a fine of not more than $5,000." - Mail this letter to the address above. Printer-friendly version'
