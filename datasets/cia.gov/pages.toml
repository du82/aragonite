["https://cia.gov/careers/cia-requirements"]
title = "CIA Requirements - CIA"
full_description = '''CareersCIA RequirementsThinking about joining CIA? You are making an important decision. Because of our critical mission, we require several important items from all candidates. Review the following requirements that you must meet to qualify for employment at CIA.Careers OverviewWarning: This video below may contain flickering or flashing scenes.TranscriptPoint Down IconWe are the Central Intelligence Agency.The nation’s first line of defense.We are the Central Intelligence Agency.Across the directorates, around the globe and here at home.We are the National Clandestine Service.Discovering the truth to protect our nation.We are the Directorate of Science and Technology.Creating, adapting and developing technology so advanced it’s classified.We are the Directorate of Intelligence.Analyzing, gathering and disseminating critical intelligence from many sources.We are the Directorate of Support and the Director’s Staff.Fulfilling the Agency mission with expertise from many fields.We are the Central Intelligence Agency.One team, supporting one mission.Intelligence officers, scientists and engineers.Analysts, economists and attorneys.Physicians, accountants, linguists and interns.We are the Central Intelligence Agency.The Work of a Nation. The Center of Intelligence.www.cia.govEqual Opportunity Employer.You Must Submit Online via MyLINK, While in the United StatesYou must be physically within the United States or one of its territories when you submit your resume via MyLINK. This is for your safety and security.While you may travel abroad for a short duration during the hiring process, do not contact us while you are physically outside of the United States or its territories. This includes by hard copy mail, telephone, email, or internet.You Must Be a U.S. Citizen and at Least 18 Years of AgeYou must be a U.S. citizen or a dual-national U.S. citizen to work at CIA. If you are in the process of becoming a U.S. citizen, you can submit your resume as soon as you are awarded citizenship, but not before. We do not help individuals apply for U.S. citizenship.Also, you must be at least 18 years of age to qualify for a job at CIA.You Must Be Willing to Move to the Washington, DC AreaOur officers are from all over the country and around the world. But keep in mind that all positions are in the Washington, DC area and some require overseas travel. You must be willing to move if you don’t already live in the Washington metropolitan area. For questions about relocation, please speak to your recruiter.You Must Complete Security and Medical EvaluationsBecause of the classified nature of our work, all CIA applicants must go through a comprehensive security clearance process.Background InvestigationPoint Down IconDuring the background investigation, we interview neighbors, friends, supervisors, and co-workers to evaluate your character, trustworthiness, and loyalty to the United States. We also look into any conflicts of interest or potential for coercion, as well as your ability to protect sensitive information.Polygraph InterviewPoint Down IconPolygraph interviews are mandatory, with no exceptions. Our polygraph examiners are highly trained security professionals. We keep all answers confidential.Physical and Psychological ExaminationPoint Down IconDuring the clearance process, you also need to complete a medical exam to assess your physical and mental health as it relates to essential job duties. We take the protection, release, and use of health information very seriously and follow strict privacy standards as stated in the Health Insurance Portability and Accountability Act of 1996 (HIPAA).You Must Be Registered for the Selective ServiceIf you are required to register for the Selective Service, you must do so before we consider you for employment.Security Concerns and Potential DisqualifiersConsiderations in our selection process that could impact eligibility to classified information.Lack of CandorPoint Down IconLack of candor, or dishonesty, which includes omitting, underreporting, or inconsistently reporting information at any time during the hiring process is contrary to what we value. Candor is something we carefully consider during our review process for clearance determination and is the top reason we withdraw an offer of employment.Drug UsePoint Down IconAlthough some states have legalized marijuana use, to include for medical purposes, it remains illegal under federal law and state laws do not supersede those of the federal government.It is critical that an applicant has not used marijuana or products containing THC within 90 days prior to applying or anytime thereafter. This includes prescription medical marijuana.In addition, an applicant cannot have used any other illegal drugs or misused prescription drugs within one year prior to applying, or anytime thereafter.Excessive Alcohol UsePoint Down IconOur concern with alcohol is with its abuse, to include recent and recurring excessive use or alcohol-related incidents.Criminal and Dishonest ConductPoint Down IconOur concern is with the nature of the criminal or dishonest conduct, which may or may not have resulted in a conviction.Once an applicant has entered our hiring process, there must be no continued involvement in illegal activities.Lack of ResponsivenessPoint Down IconApplicants are expected to respond promptly to inquiries and keep their appointments to the best of their abilities. Please commence (or continue) with the application process when the timing is right, bet from the standpoint of past conduct that requires further time to mitigate, or on an account of personal or professional responsibilities that could interfere with the hiring process.LoyaltyPoint Down IconApplicants must be of unquestionable allegiance to the United States.Personal IntegrityPoint Down IconWorking for our Agency requires trust and high standards of integrity and conduct, especially in the face of adversity.Social MediaPoint Down IconFor your safety and security, we ask that you not follow us on social media or post any content pertaining to your processing. This includes "friending" or "following" the organization, and/or "liking" or sharing content or commentary on Agency social media applications and/or feeds.Guidelines for Use of Artificial Intelligence in the Applicant ProcessCIA recognizes the current widespread use of generative Artificial Intelligence (AI) and acknowledges the many benefits of this technology. However, it is important that an individual's knowledge, skills, and abilities are accurately assessed when being considered for Agency employment. The use of AI should not be used in submitted writing or portfolio samples, when completing on-line assessments, and in support of screenings and/or interviews. Integrity in one of CIA's core values and all applicants must demonstrate alignment to this value while seeking potential employment with the Agency. Unauthorized use of AI during the application process may impact an individual's consideration for Agency employment.If AI is used in the development of a resume, applicants should note the use of AI and explain how it was leveraged (i.e. for review of grammar).Our Hiring ProcessReady to submit your resume via MyLINK? Get helpful information about the steps and estimated timelines related to our hiring process.Learn moreAligned IconEqual Employment OpportunityAs an Equal Opportunity Employer, we do not discriminate in hiring or granting, denying, or revoking security clearances.Learn moreAligned IconAccommodationsIf you need accommodations at any point in the hiring process, our Reasonable Accommodations Staff can help.Learn moreAligned IconJob Opportunities Review our position descriptions for information about career paths, qualifications, salary levels, and more.Learn moreAligned Icon'''
year_published = 2025
clearnet = "https://cia.gov/careers/cia-requirements"
