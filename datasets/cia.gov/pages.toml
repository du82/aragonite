title = "Undergraduate Internship Program - Directorate of Operations - CIA"
full_description = "Student ProgramsUndergraduate Internship Program - Directorate of OperationsInternshipStarting salary: $58,714Full-time student with one completed semester/quarter of an undergraduate degree and who will not be graduating before December 2027.As a Directorate of Operations Undergraduate Intern for CIA, you will support the CIA mission of collecting human intelligence on critical international developments.Agency-wide RequirementsAll applicants must be:U.S. citizens (dual U.S. citizens also eligible)At least 18 years of ageWilling to move to the Washington, DC areaAble to complete security and medical evaluationsRegistered for the Selective Service,if applicableAbout the JobThe 2025 Submission window for this undergraduate internship is now closed.As a Directorate of Operations (DO) Student Intern (DOSI), you will have the opportunity to work in two of three potential DO positions that drive intelligence collection and provide the vital investigative research and strategic oversight to operations that are run around the world. DOSIs are most likely to spend their summer internships serving as a Staff Operations Officer (SOO), Collection Management Officer (CMO), or Targeting Officer (TO) to be determined based on program availability during each summer. DOSIs will be working alongside DO officers to provide the seamless integration between CIA Headquarters and DO offices overseas. Your critical-thinking, advanced analytic, strong communication and creative problem-solving skills will all figure prominently as you drive clandestine operations to success. DOSIs will have the opportunity to work on current challenges and are expected to participate in crafting recommendations and solutions; you will have the opportunity to learn the work of the DO and your work will make a difference to national security!SOOs apply advanced knowledge and expertise of clandestine operations, operational trade craft, and intelligence priorities when providing strategic guidance and operational case management. SOOs are often asked to find solutions to complex operational problems, identifying new technical tools and capabilities to advance operations, and tapping the resources of DO, CIA and U.S. Government to ensure operational requirements are met. CMOs use area expertise to understand intelligence needs and identify opportunities to collect foreign intelligence to fulfill those needs. CMOs also help evaluate collected intelligence to determine its quality and timeliness while maintaining its secret nature. TOs are integral to the planning and implementation of DO foreign intelligence collection, counterintelligence, and covert action operations. You will combine specialized training, utilize advanced analytic skills and tools to identify new opportunities for DO activities and enhance ongoing operations.After successful completion of internships in each of these positions and depending on hiring needs of the mission at that time, DOSI may be offered the opportunity to convert into being hired into the Professional Trainee (PT) program. What You Will GetThe CIA offers various benefits to students, including:Paid time offFederal health and life insuranceRetirementEducation and trainingHealth servicesChild care centerCredit unionAs a CIA employee, you’ll also get the satisfaction of knowing your work is part of something bigger than yourself. Our work is driven by one mission: to keep our Nation safe. Every day is an opportunity to enhance U.S. national security.Learn more about working at CIAMinimum QualificationsMust be a full-time student in their first year of study pursuing an undergraduate degree in a 4-year academic institution with only one semester/quarter completed at the time of expressing interest. Competitive candidates enrolled in a 2-year degree program that feeds into an accredited 4-year program will be considered. Please address your plans to acquire a Bachelor’s degree in your Cover Letter. Proof of acceptance into a 4-year program will be required prior to the start of your first internship.At least a 3.0 GPA on a 4-point scale preferred (NOTE: In order to remain in the DOSI program, you must provide proof of maintaining this GPA throughout your undergraduate college experience.)The availability to interview the summer of 2025 and to attend two sets of follow-on appointments in the Washington DC area in the late summer and early winterThe ability to intern in person in the Washington DC area for a 90-day duration during both the summer of 2026 and 2027and return to their academic institution to complete at least one semester/quarter prior to graduation. As such, this internship is open to Freshman only. Note that while these internships are paid, you will be responsible for covering the cost of housing.Personal integrity with impeccable discretionStrong writing, briefing and organizational skillsAction and results orientedStrong interpersonal and communication skillsAbility to work independently and in teamFlexibility, adaptability, and commitment to CIAAbility to meet the minimum requirements for CIA, including U.S. citizenship and background investigationPlease include the following in your interest form submission:An unofficial transcript for the first semester/quarter in an accredited undergraduate program that shows your program of study and current GPAA completed and uploaded qualification statement and cover letter.Given the nature of the DO's work and this internship, please note that you will not be able to receive college credit for this internship or list a CIA internship on your resume*NOTE: Resumes without accompanying transcripts and all supplemental attachments will not be considered.Desired QualificationsExperience or familiarization in STEM fields, to include academic, professional, or personal interestsForeign cultural or language ability (academic or personal)The ability to quickly apply learning to new situations and complex, international issuesInquisitive and investigative to push for creative recommendations to evolving challengesDetermined, collaborative and mission driven team playersAbility to shift focus quickly, work on multiple tasks concurrently, and excel in high-pressure/high-impact situationsBroad knowledge of CIA's mission and values"
year_published = 2025
clearnet = "https://cia.gov/careers/student-programs/undergraduate-internship-program-directorate-of-operations"
