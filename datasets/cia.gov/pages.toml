title = "History of CIA - CIA"
full_description = 'LegacyHistory of CIAAmerica’s renowned World War II intelligence agency, the Office of Strategic Services, is our most famous predecessor. But did you know that America had other versions of intelligence agencies before CIA was formed? Explore our rich history.BeforeWorld War IIA Siloed Approach to Foreign IntelligenceThe history of America’s foreign intelligence gathering reaches back to the Revolutionary war. But it wasn’t until World War II that our country’s foreign intelligence activities were coordinated government-wide.Before the war, the Department of State, the Federal Bureau of Investigation (FBI), and the U.S. Armed Services were collecting intelligence with no direction or coordination.<picture><source type="image/webp" srcSet="/static/e675f41c1c4bbd64fc1c00d6184d9965/96238/CIA_Family_Tree_revised.webp 305w,/static/e675f41c1c4bbd64fc1c00d6184d9965/a3d9f/CIA_Family_Tree_revised.webp 610w,/static/e675f41c1c4bbd64fc1c00d6184d9965/5ed44/CIA_Family_Tree_revised.webp 1220w" sizes="(min-width: 1220px) 1220px, 100vw"/><img data-gatsby-image-ssr="" data-main-image="" style="opacity:0" sizes="(min-width: 1220px) 1220px, 100vw" decoding="async" loading="lazy" src="/static/e675f41c1c4bbd64fc1c00d6184d9965/a4a78/CIA_Family_Tree_revised.jpg" srcSet="/static/e675f41c1c4bbd64fc1c00d6184d9965/0f952/CIA_Family_Tree_revised.jpg 305w,/static/e675f41c1c4bbd64fc1c00d6184d9965/58f2a/CIA_Family_Tree_revised.jpg 610w,/static/e675f41c1c4bbd64fc1c00d6184d9965/a4a78/CIA_Family_Tree_revised.jpg 1220w" alt="black and white graphic showing different branches of intelligence agencies before CIA, that look like a tree shape"/></picture>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}1941July 11The Office of the Coordinator of InformationFrustrated by the piecemeal, stove-piped information he was receiving, President Franklin D. Roosevelt created the Office of the Coordinator of Information (COI). Led by World War I hero General William “Wild Bill” Donovan, COI’s main goal was to gather foreign intelligence related to the War.As World War II progressed, Donovan and President Roosevelt reevaluated COI’s size, organization, and mission. At Donovan’s suggestion, President Roosevelt transformed COI into a new office with a title that reflected the importance of strategy in intelligence gathering and clandestine operations.<picture><source type="image/webp" srcSet="/static/a7527bccab04635b90298c78ebb39844/80826/image-1.webp 163w,/static/a7527bccab04635b90298c78ebb39844/313e7/image-1.webp 325w,/static/a7527bccab04635b90298c78ebb39844/b9f48/image-1.webp 650w" sizes="(min-width: 650px) 650px, 100vw"/><img data-gatsby-image-ssr="" data-main-image="" style="opacity:0" sizes="(min-width: 650px) 650px, 100vw" decoding="async" loading="lazy" src="/static/a7527bccab04635b90298c78ebb39844/4512b/image-1.jpg" srcSet="/static/a7527bccab04635b90298c78ebb39844/c7dc9/image-1.jpg 163w,/static/a7527bccab04635b90298c78ebb39844/e95c8/image-1.jpg 325w,/static/a7527bccab04635b90298c78ebb39844/4512b/image-1.jpg 650w" alt="A closeup of a man in uniform at a desk with his arms folded."/></picture>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}General William “Wild Bill” Donovan, the “father of American intelligence” and head of the Office of Strategic Services. 1942June 13The Office of Strategic ServicesOften referred to as our Agency’s forerunner, the Office of Strategic Services (OSS) became the first centralized intelligence agency in American history.Wild Bill Donovan led the women and men of OSS to collect and analyze strategic information and conduct unconventional and paramilitary operations.Though the new office met some resistance from other U.S. agencies, OSS continued to grow its world-wide intelligence capabilities through military, diplomatic, and non-official cover. At its peak, OSS employed over 13,000 military personnel and civilians—35% of whom were women.OSS existed for just over three years, but in this time it made a lasting contribution to our country, the world, and the future of American intelligence.<picture><source type="image/webp" srcSet="/static/0427d6a47ffa3b243ad85617103f3178/6ea4e/image-1-1.webp 160w,/static/0427d6a47ffa3b243ad85617103f3178/b81d8/image-1-1.webp 320w,/static/0427d6a47ffa3b243ad85617103f3178/269dd/image-1-1.webp 640w" sizes="(min-width: 640px) 640px, 100vw"/><img data-gatsby-image-ssr="" data-main-image="" style="opacity:0" sizes="(min-width: 640px) 640px, 100vw" decoding="async" loading="lazy" src="/static/0427d6a47ffa3b243ad85617103f3178/bd400/image-1-1.jpg" srcSet="/static/0427d6a47ffa3b243ad85617103f3178/2083e/image-1-1.jpg 160w,/static/0427d6a47ffa3b243ad85617103f3178/09687/image-1-1.jpg 320w,/static/0427d6a47ffa3b243ad85617103f3178/bd400/image-1-1.jpg 640w" alt="Organization chart of the OSS."/></picture>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}1945October 1The Strategic Services UnitAt the end of World War II, President Harry S. Truman abolished OSS along with many other war agencies. This left the Nation without a non-departmental, strategically oriented intelligence service.On President Truman’s order, branches of OSS merged into a new office, the Strategic Services Unit (SSU). SSU took a temporary role filling former OSS posts across the globe until the United States could put a more permanent solution into place.1946January 22The Central Intelligence GroupEarly in the new year, Administration officials decided to move SSU’s duties and responsibilities to the newly created Central Intelligence Group (CIG). Unlike previous organizations of its kind, CIG was granted the authority to conduct independent research and analysis. This meant CIG could move beyond simply coordinating intelligence to producing intelligence.President Truman chose Rear Admiral Sidney Souers, the deputy chief of Naval Intelligence at the end of World War II, to lead the CIG, making Souers the first person to hold the title of Director of Central Intelligence (DCI).Within months of its creation, CIG became the nation’s primary agency for strategic warning and management of clandestine activities abroad. However, it was constrained by the Department of State and the armed services. President Truman soon recognized the need for a new, fully-functional post-war intelligence organization. So, in 1947 he signed the National Security Act, establishing the Central Intelligence Agency (CIA).<picture><source type="image/webp" srcSet="/static/7af83ddb3c50fe7336bd2ede3c56b69c/a30d6/souers.webp 248w,/static/7af83ddb3c50fe7336bd2ede3c56b69c/d2d12/souers.webp 496w,/static/7af83ddb3c50fe7336bd2ede3c56b69c/a00cc/souers.webp 992w" sizes="(min-width: 992px) 992px, 100vw"/><img data-gatsby-image-ssr="" data-main-image="" style="opacity:0" sizes="(min-width: 992px) 992px, 100vw" decoding="async" loading="lazy" src="/static/7af83ddb3c50fe7336bd2ede3c56b69c/5f4e3/souers.jpg" srcSet="/static/7af83ddb3c50fe7336bd2ede3c56b69c/dbce5/souers.jpg 248w,/static/7af83ddb3c50fe7336bd2ede3c56b69c/fe876/souers.jpg 496w,/static/7af83ddb3c50fe7336bd2ede3c56b69c/5f4e3/souers.jpg 992w" alt="A painted portrait of a man in uniform"/></picture>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}Rear Admiral Sidney Souers, head of CIG and the first person to officially hold the title Director of Central Intelligence. 1947September 18The Central Intelligence AgencyThe National Security Act of 1947 established CIA as an independent, civilian intelligence agency within the executive branch. The Act charged CIA with coordinating the Nation’s intelligence activities and, among other duties, collecting, evaluating, and disseminating intelligence affecting national security.The Act also created a Director of Central Intelligence, or DCI, to lead both CIA and the U.S. Intelligence Community. The DCI also served as the president’s main adviser on all intelligence matters. President Truman appointed former CIG Deputy Director, Roscoe H. Hillenkoetter, to be the first to lead the new Agency. One third of the CIA’s personnel were OSS veterans.Two years later, President Truman signed the Central Intelligence Agency Act. This legislation allowed CIA to secretly fund intelligence operations and develop personnel procedures outside standard U.S. government practices.By 1953, the Agency was an established element of the U.S. government. Its contributions in the areas of political action and paramilitary warfare were recognized and respected. CIA had grown six times in these six years, and set up three of the five directorates we have today.As the Agency continued to grow, employees moved from offices in Washington, DC, to a new headquarters in Langley, Virginia. The Original Headquarters Building was the first home designed specifically for Agency officers. Today, CIA Headquarters still serves as an iconic symbol of our Agency and our mission.<picture><source type="image/webp" srcSet="/static/15fccae0c8461eacc0b72340c692ce94/7bf95/image-2-1.webp 170w,/static/15fccae0c8461eacc0b72340c692ce94/38982/image-2-1.webp 339w,/static/15fccae0c8461eacc0b72340c692ce94/e1d71/image-2-1.webp 678w" sizes="(min-width: 678px) 678px, 100vw"/><img data-gatsby-image-ssr="" data-main-image="" style="opacity:0" sizes="(min-width: 678px) 678px, 100vw" decoding="async" loading="lazy" src="/static/15fccae0c8461eacc0b72340c692ce94/bca92/image-2-1.jpg" srcSet="/static/15fccae0c8461eacc0b72340c692ce94/b4ad7/image-2-1.jpg 170w,/static/15fccae0c8461eacc0b72340c692ce94/d0ef3/image-2-1.jpg 339w,/static/15fccae0c8461eacc0b72340c692ce94/bca92/image-2-1.jpg 678w" alt="Black and white headshot of a man in uniform."/></picture>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}Roscoe Hillenkoetter, the first Director of the newly created Central Intelligence Agency. 2004December 17The Intelligence Community RestructuresThe role of the DCI changed in 2004, when President George W. Bush signed the Intelligence Reform and Terrorism Prevention Act. This new act restructured the Intelligence Community and created the Director of National Intelligence (DNI). DNI oversees the 17 intelligence agencies, including CIA, while serving as the president’s principal intelligence adviser. The Director of the CIA continues to oversee the CIA’s intelligence collection, analysis, and covert action to advance U.S. national security.In 2015, DCIA John Brennan ordered the modernization of the Agency into “mission centers” to improve integration and cooperation among the five directorates to better address the most pressing intelligence concerns facing our nation.PresentCIA Continues to Adapt and LeadOur history has shaped us into who we are today. As the world shifts around us, we continue to adapt and lead in an ever-changing global landscape. With the same spirit and dedication of those who came before us, our world-class workforce is prepared to accomplish what others cannot accomplish and go where others cannot go.Every U.S. President since Truman has relied on CIA to deliver intelligence in ways no other organization can. Every day we rely on our workforce to carry out the very same mission that we started with: collect, analyze, evaluate, and disseminate intelligence to the president and U.S. policymakers.We are the Nation’s eyes, ears, and sometimes, its hidden hand. Reflecting on our role in American history, we are proud to serve and keep our country safe.Explore MoreCIA MuseumFrom disappearing ink to stealth aircraft, experience our collection to better understand CIA and our contributions. Learn MoreArrow Right IconCIA TrailblazersLearn about many of the talented and dedicated CIA officers who have helped shape the Agency from our founding through today. Learn MoreArrow Right IconPublicationsFrom leadership profiles to founding documents, our publications let you take a deeper look into CIA history. Learn MoreArrow Right Icon'
