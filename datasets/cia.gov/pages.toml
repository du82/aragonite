title = "How We Hire - CIA"
full_description = 'CareersHow We HireThe More Prepared You Are, the BetterTo carry out our mission and our work, all CIA professionals must live up to the highest standards of integrity. With this in mind, we carefully vet every candidate who hopes to join CIA.Our hiring process may be lengthy, but it could lead to an exciting career where you can make a difference for our country.We want all our candidates to move through the hiring process with confidence and ease.Minimum Requirements For us to consider you for a job at CIA, you must be:Physically in the United States or one of its territories when you submit your resume via MyLINK.A U.S. citizen (dual U.S. citizens also eligible)At least 18 years of ageWilling to move to the Washington, DC areaAble to successfully complete security and medical evaluations, including a background investigation, a polygraph interview, and a physical and psychological examinationRegistered for the Selective ServiceView Requirements<picture><source type="image/webp" srcSet="/careers/static/41c7188831b8c33051966bb18df2a9ef/62859/IT-Admin-1-scaled.webp 640w,/careers/static/41c7188831b8c33051966bb18df2a9ef/828a3/IT-Admin-1-scaled.webp 1280w,/careers/static/41c7188831b8c33051966bb18df2a9ef/bbd9a/IT-Admin-1-scaled.webp 2560w" sizes="(min-width: 2560px) 2560px, 100vw"/><img data-gatsby-image-ssr="" data-main-image="" style="opacity:0" sizes="(min-width: 2560px) 2560px, 100vw" decoding="async" loading="lazy" src="/careers/static/41c7188831b8c33051966bb18df2a9ef/9466f/IT-Admin-1-scaled.jpg" srcSet="/careers/static/41c7188831b8c33051966bb18df2a9ef/e70fc/IT-Admin-1-scaled.jpg 640w,/careers/static/41c7188831b8c33051966bb18df2a9ef/af556/IT-Admin-1-scaled.jpg 1280w,/careers/static/41c7188831b8c33051966bb18df2a9ef/9466f/IT-Admin-1-scaled.jpg 2560w" alt="An IT professional working on cords connected to a server."/></picture>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll(