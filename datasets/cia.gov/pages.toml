["https://cia.gov/about/organization/directorate-of-operations"]
title = "Directorate of Operations - CIA"
full_description = '''OrganizationDirectorate of OperationsContentsPoint Down IconCareers<picture><source type="image/webp" srcSet="/static/28b6400ffd50b0b0d6c0814db0e9d39e/8c64a/OrganizationPage-DO.webp 320w,/static/28b6400ffd50b0b0d6c0814db0e9d39e/ffef7/OrganizationPage-DO.webp 640w,/static/28b6400ffd50b0b0d6c0814db0e9d39e/9ba0b/OrganizationPage-DO.webp 1280w" sizes="(min-width: 1280px) 1280px, 100vw"/><img data-gatsby-image-ssr="" data-main-image="" style="opacity:0" sizes="(min-width: 1280px) 1280px, 100vw" decoding="async" loading="lazy" src="/static/28b6400ffd50b0b0d6c0814db0e9d39e/68d0b/OrganizationPage-DO.jpg" srcSet="/static/28b6400ffd50b0b0d6c0814db0e9d39e/fc269/OrganizationPage-DO.jpg 320w,/static/28b6400ffd50b0b0d6c0814db0e9d39e/4d5c4/OrganizationPage-DO.jpg 640w,/static/28b6400ffd50b0b0d6c0814db0e9d39e/68d0b/OrganizationPage-DO.jpg 1280w" alt="Directorate of Operations"/></picture>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}The Directorate of Operations handles the collection of intelligence acquired by human sources (human intelligence or HUMINT). When necessary, and under unique circumstances, they conduct covert action as directed by the president.We are the Directorate of OperationsWarning: This video below may contain flickering or flashing scenes.TranscriptPoint Down IconWe are the Directorate of Operations.We discover the truth to protect our nation.We are working together - at headquarters and overseas.We work as one team with one mission - identifying new sources and gaps in intelligence.We’re building human intelligence networks and acquiring protected information.We are the Directorate of Operations.The work of a nation. The center of intelligence.CareersThe Directorate of Operations offers a range of job opportunities for qualified candidates interested in spending a significant part of their professional careers and personal lives living and working overseas, and also for those who prefer to be based in the Washington, DC area. Case officers in the Directorate of Operations may serve tours of duty abroad to collect foreign intelligence. These brave officers work to discover secrets vital to protecting U.S. national security.Due to the nature of their work, officers in the Directorate of Operations often live and work undercover. This means being discreet and selective about who they talk to when it comes to their career. Since covert assignments demand certain skills, all officers in the Directorate of Operations go through specialized training when they join the Agency.The Collection Management Officer, Case Officer, Paramilitary Officer, Specialized Skills Officer, Staff Operations Officer, and Targeting Officer tracks require successful completion of intensive Directorate of Operations foundational training that runs for extended periods. As part of the program, some trainees are expected to:Operate a motor vehicle without second-party assistance in daytime and nighttime conditions;Traverse uneven terrain, to include climbing and descending staircases, over fixed minimum distances and in varying weather conditions;Work non-traditional or erratic schedules;Make reasoned decisions under time constraints.Some training occurs outside the Washington Metropolitan Area. Additional details on Directorate of Operations training requirements are provided in the advanced stages of the hiring process.Featured JobsCollection Management OfficerSaveBookmark Icon the Collection Management Officer position.Save jobCollection Management Officers drive the collection of foreign intelligence and manage the dialogue between U.S. intelligence consumers and the Directorate of Operations.Full timeStarting salary: $70,685 - $107,590**Higher starting salary possible depending on experience levelBachelor’s degree; no preferred major or program of study Foreign language bonus eligibleLearn MoreArrow Right IconTargeting OfficerSaveBookmark Icon the Targeting Officer position.Save jobTargeting Officers identify the people, relationships, and organizations with access to information needed to find opportunities to disrupt threats to U.S. interests.Full timeStarting salary: $70,685 - $107,590**Higher starting salary possible depending on experience levelBachelor's degreeForeign language bonus eligibleOpportunities for foreign travel are possibleLearn MoreArrow Right IconStaff Operations OfficerSaveBookmark Icon the Staff Operations Officer position.Save jobStaff Operations Officers provide integration between CIA Headquarters and Directorate of Operations field offices, program management, and operational case management to drive clandestine operationsFull timeStarting salary: $70,685 - $107,590**Higher starting salary possible depending on experience levelBachelor's degreeForeign language bonus eligibleLearn MoreArrow Right IconParamilitary Operations OfficerSaveBookmark Icon the Paramilitary Operations Officer position.Save jobParamilitary Operations Officers lead and manage Covert Action programs and collect foreign intelligence vital to national security policymakers.Full timeStarting salary: $77,840 - $128,956* *Higher starting salary possible depending on experience levelBachelor's degreeForeign language bonus eligibleLearn MoreArrow Right IconContentsPoint Down IconCareers'''
