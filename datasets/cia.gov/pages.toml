title = "Explore CIA Headquarters - CIA"
full_description = 'LegacyExplore CIA HeadquartersEver wish you could visit the CIA? Take the virtual tour for an inside look at our campus, galleries, memorials, secret statues, and more.32 ResultsFilter CategoriesAllPoint Down IconCategoriesAllOutsideInsidePer Page:1224AllA-12 OxcartAllen Dulles Bas-ReliefAtrium Sculpture HallBerlin Wall MonumentBible Quote CarvingCIA Book of HonorCIA LibraryCIA Memorial WallCIA MuseumCIA SealCourtyardDCI William J. Casey Commemorative PlaquePrevious PagePage 01 of 03Next Page<picture><source type="image/webp" srcSet="/static/67fe433c81f0d062088d76d5bc811428/5d191/Glyph_Legacy_Positve.webp 90w,/static/67fe433c81f0d062088d76d5bc811428/52f83/Glyph_Legacy_Positve.webp 180w,/static/67fe433c81f0d062088d76d5bc811428/27ab5/Glyph_Legacy_Positve.webp 360w" sizes="(min-width: 360px) 360px, 100vw"/><img data-gatsby-image-ssr="" data-main-image="" style="opacity:0" sizes="(min-width: 360px) 360px, 100vw" decoding="async" loading="lazy" src="/static/67fe433c81f0d062088d76d5bc811428/257af/Glyph_Legacy_Positve.png" srcSet="/static/67fe433c81f0d062088d76d5bc811428/25ed1/Glyph_Legacy_Positve.png 90w,/static/67fe433c81f0d062088d76d5bc811428/a2c25/Glyph_Legacy_Positve.png 180w,/static/67fe433c81f0d062088d76d5bc811428/257af/Glyph_Legacy_Positve.png 360w" alt="Decorative glyph for Legacy."/></picture>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}About the George Bush Center for IntelligenceOur campus is more than just a place to work—it’s a physical space that represents CIA’s rich history and our commitment to the art of intelligence. Located in Langley, Virginia, CIA Headquarters includes the Original Headquarters Building, the New Headquarters Building, and the Grounds.Since 1961, this secure campus has been considered “home” to thousands of dedicated women and men who work at CIA. In 1999, the compound was renamed the George Bush Center for Intelligence. The name honors President George H.W. Bush and his unique role in Agency history.Today, you’ll find more than just offices here. CIA Headquarters features sites like the famous Kryptos sculpture, memorials, art and museum galleries, and so much more. For security reasons, we do not offer tours to the public. However, our virtual Headquarters tour gives you the ability to wander through our campus and explore its unique sites.'
