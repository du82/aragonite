full_description = 'ResourcesPublicationsThe CIA publications library houses material on intelligence history, international relations, the Cold War, and more.Featured PublicationsPresident’s Daily Brief: Delivering Intelligence to Kennedy and JohnsonLearn MoreArrow Right IconSoviet Navy: Intelligence and Analysis During the Cold WarLearn MoreArrow Right IconIntelligence and the Camp David AccordsLearn MoreArrow Right IconView All PublicationsPrepublication Classification Review BoardInterested in publishing your work? If you’re a current or former CIA employee or contractor, you’ll need to submit your publication to the Prepublication Classification Review Board (formerly called the Publication Review Board). The Prepublication Classification Review Board reviews all publications prior to public release to protect classified information and U.S. national security.Learn About the Review Process<picture><source type="image/webp" srcSet="/static/5286527ce942105a2bf9221d116c2325/1a9ba/PUBS-Feature-2-f.webp 972w,/static/5286527ce942105a2bf9221d116c2325/16b05/PUBS-Feature-2-f.webp 1944w,/static/5286527ce942105a2bf9221d116c2325/515ba/PUBS-Feature-2-f.webp 3888w" sizes="(min-width: 3888px) 3888px, 100vw"/><img data-gatsby-image-ssr="" data-main-image="" style="opacity:0" sizes="(min-width: 3888px) 3888px, 100vw" decoding="async" loading="lazy" src="/static/5286527ce942105a2bf9221d116c2325/1c5bd/PUBS-Feature-2-f.jpg" srcSet="/static/5286527ce942105a2bf9221d116c2325/cb6be/PUBS-Feature-2-f.jpg 972w,/static/5286527ce942105a2bf9221d116c2325/be7f7/PUBS-Feature-2-f.jpg 1944w,/static/5286527ce942105a2bf9221d116c2325/1c5bd/PUBS-Feature-2-f.jpg 3888w" alt="Close-up of hands flipping through large binders of documents with two other binders in the background."/></picture>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src)