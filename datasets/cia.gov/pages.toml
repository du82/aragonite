full_description = "Office of Equal Employment OpportunityElijah Cummings ActElijah Cummings Act NoticesThe Elijah E. Cummings Federal Employee Antidiscrimination Act of 2020 amended the No FEAR Act and requires Federal agencies to post findings of discrimination (including retaliation) from any final action of the Agency, the EEOC, or a court of jurisdiction, after all appeals are exhausted. Agencies must publish such notices for one year. To review the recent Notices, please click here.For information on our EEO program, including EEO rights and protections, please visit our Office of Equal Employment Opportunity page."
