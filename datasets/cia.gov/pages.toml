title = "About CIA - CIA"
full_description = 'About CIAOur mission is straightforward but critical: leverage the power of information to keep our Nation safe.<picture><source type="image/webp" srcSet="/static/e1bd45c1dd5242dc39d4d1c01ecc4323/e8222/cia_seal_full_color_hi-res_1080x1350.webp 270w,/static/e1bd45c1dd5242dc39d4d1c01ecc4323/7928f/cia_seal_full_color_hi-res_1080x1350.webp 540w,/static/e1bd45c1dd5242dc39d4d1c01ecc4323/017df/cia_seal_full_color_hi-res_1080x1350.webp 1080w" sizes="(min-width: 1080px) 1080px, 100vw"/><img data-gatsby-image-ssr="" data-main-image="" style="opacity:0" sizes="(min-width: 1080px) 1080px, 100vw" decoding="async" loading="lazy" src="/static/e1bd45c1dd5242dc39d4d1c01ecc4323/6ea44/cia_seal_full_color_hi-res_1080x1350.png" srcSet="/static/e1bd45c1dd5242dc39d4d1c01ecc4323/c0b7e/cia_seal_full_color_hi-res_1080x1350.png 270w,/static/e1bd45c1dd5242dc39d4d1c01ecc4323/7ef5d/cia_seal_full_color_hi-res_1080x1350.png 540w,/static/e1bd45c1dd5242dc39d4d1c01ecc4323/6ea44/cia_seal_full_color_hi-res_1080x1350.png 1080w" alt="full color CIA seal"/></picture>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}The CIA seal features several symbols: an eagle for alertness, a shield for defense, and a compass rose for global intelligence collection.We are the Nation’s first line of defense. We accomplish what others cannot accomplish and go where others cannot go.<picture><source type="image/webp" srcSet="/static/cef0bf6bbf4826dc5e9aaddbbff9d990/fabbe/Glyphs_Mission_Positive.webp 126w,/static/cef0bf6bbf4826dc5e9aaddbbff9d990/d8fa5/Glyphs_Mission_Positive.webp 252w,/static/cef0bf6bbf4826dc5e9aaddbbff9d990/2ad07/Glyphs_Mission_Positive.webp 504w" sizes="(min-width: 504px) 504px, 100vw"/><img data-gatsby-image-ssr="" data-main-image="" style="opacity:0" sizes="(min-width: 504px) 504px, 100vw" decoding="async" loading="lazy" src="/static/cef0bf6bbf4826dc5e9aaddbbff9d990/4a72a/Glyphs_Mission_Positive.png" srcSet="/static/cef0bf6bbf4826dc5e9aaddbbff9d990/bb5d0/Glyphs_Mission_Positive.png 126w,/static/cef0bf6bbf4826dc5e9aaddbbff9d990/1b6e1/Glyphs_Mission_Positive.png 252w,/static/cef0bf6bbf4826dc5e9aaddbbff9d990/4a72a/Glyphs_Mission_Positive.png 504w" alt="The About glyph"/></picture>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}Established in 1947What is CIA?The CIA is a U.S. government agency that provides objective intelligence on foreign countries and global issues to the president, the National Security Council, and other policymakers to help them make national security decisions.<picture><source type="image/webp" srcSet="/static/86713c6a25f4e7f1ca3f878818c3c05a/31ae2/ABO-LAN-Feature-1-c%402x.webp 223w,/static/86713c6a25f4e7f1ca3f878818c3c05a/e1121/ABO-LAN-Feature-1-c%402x.webp 445w,/static/86713c6a25f4e7f1ca3f878818c3c05a/b7cad/ABO-LAN-Feature-1-c%402x.webp 890w" sizes="(min-width: 890px) 890px, 100vw"/><img data-gatsby-image-ssr="" data-main-image="" style="opacity:0" sizes="(min-width: 890px) 890px, 100vw" decoding="async" loading="lazy" src="/static/86713c6a25f4e7f1ca3f878818c3c05a/1fc33/ABO-LAN-Feature-1-c%402x.jpg" srcSet="/static/86713c6a25f4e7f1ca3f878818c3c05a/b1867/ABO-LAN-Feature-1-c%402x.jpg 223w,/static/86713c6a25f4e7f1ca3f878818c3c05a/08956/ABO-LAN-Feature-1-c%402x.jpg 445w,/static/86713c6a25f4e7f1ca3f878818c3c05a/1fc33/ABO-LAN-Feature-1-c%402x.jpg 890w" alt="U.S. flag hanging in front of large windows in the CIA headquarters"/></picture>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}What We DoTo stop threats before they happen and further U.S. national security objectives, we:Collect foreign intelligence;Produce objective analysis; andConduct covert action, as directed by the president.We do not make policy or policy recommendations. Instead, our Agency serves as an independent source of information for people who do.We are not a law enforcement organization. However, we do work with the Intelligence Community, Department of Defense, and law enforcement agencies on many complex issues ranging from counterintelligence to counterterrorism.<picture><source type="image/webp" srcSet="/static/d27d64e05ee563ad621ab2de166de159/31706/Software-Engineer_1036178113-1.webp 1440w,/static/d27d64e05ee563ad621ab2de166de159/ff008/Software-Engineer_1036178113-1.webp 2880w,/static/d27d64e05ee563ad621ab2de166de159/f835f/Software-Engineer_1036178113-1.webp 5760w" sizes="(min-width: 5760px) 5760px, 100vw"/><img data-gatsby-image-ssr="" data-main-image="" style="opacity:0" sizes="(min-width: 5760px) 5760px, 100vw" decoding="async" loading="lazy" src="/static/d27d64e05ee563ad621ab2de166de159/5fccc/Software-Engineer_1036178113-1.jpg" srcSet="/static/d27d64e05ee563ad621ab2de166de159/69eac/Software-Engineer_1036178113-1.jpg 1440w,/static/d27d64e05ee563ad621ab2de166de159/8da6a/Software-Engineer_1036178113-1.jpg 2880w,/static/d27d64e05ee563ad621ab2de166de159/5fccc/Software-Engineer_1036178113-1.jpg 5760w" alt="A group of young professionals in business casual clothes working on several computers."/></picture>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}How We Do ItTo meet the intelligence needs of today and tomorrow, we:Lead specialized, multidisciplinary Mission Centers to address high-priority issues including nonproliferation, counterterrorism, counterintelligence, organized crime, narcotics trafficking, and arms control, to name a few;Build strong partnerships between intelligence collection disciplines;Produce all-source analysis on a range of topics and participate in Intelligence Community-wide efforts; andContribute to the greater Intelligence Community by managing services of common concern, like imagery analysis and open-source collection, while partnering on technical research and development.<picture><source type="image/webp" srcSet="/static/7f4c538d9e4b13baff6399f0759c34b7/71d4d/Tech-Dev-NRO_1104131690-1.webp 1280w,/static/7f4c538d9e4b13baff6399f0759c34b7/c87c1/Tech-Dev-NRO_1104131690-1.webp 2560w,/static/7f4c538d9e4b13baff6399f0759c34b7/d2440/Tech-Dev-NRO_1104131690-1.webp 5120w" sizes="(min-width: 5120px) 5120px, 100vw"/><img data-gatsby-image-ssr="" data-main-image="" style="opacity:0" sizes="(min-width: 5120px) 5120px, 100vw" decoding="async" loading="lazy" src="/static/7f4c538d9e4b13baff6399f0759c34b7/9c72d/Tech-Dev-NRO_1104131690-1.jpg" srcSet="/static/7f4c538d9e4b13baff6399f0759c34b7/4a49b/Tech-Dev-NRO_1104131690-1.jpg 1280w,/static/7f4c538d9e4b13baff6399f0759c34b7/f1e8a/Tech-Dev-NRO_1104131690-1.jpg 2560w,/static/7f4c538d9e4b13baff6399f0759c34b7/9c72d/Tech-Dev-NRO_1104131690-1.jpg 5120w" alt="Three professionals standing around a complex mechanical device on a table."/></picture>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}Our Mission and VisionAs our world rapidly changes, so does our national security agenda. Through it all, our mission stays the same: to protect the Nation and advance its national security interests. Our guiding principles, aspirations, and core values keep us on course as we take on this extraordinary task.Learn More<picture><source type="image/webp" srcSet="/static/05842aa2728b2a4f11e00001ff8bacab/4061d/MissionVisionTeaser.webp 1368w,/static/05842aa2728b2a4f11e00001ff8bacab/0fe32/MissionVisionTeaser.webp 2736w,/static/05842aa2728b2a4f11e00001f