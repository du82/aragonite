["https://cia.gov/careers/student-programs"]
title = "Student Programs - CIA"
full_description = 'CareersStudent ProgramsOur student (internship and co-operative education) programs offer highly unique and rewarding student experiences as you help keep our Nation safe. Work alongside experts in your field of study as you gain real-world experience within the Intelligence Community.Stokes Scholarship ProgramsFor students with demonstrated financial needThe Stokes Scholarship Program is a financial needs-based scholarship providing university tuition assistance. Participants will acquire mission-critical skills (interning in the WMA each summer) while completing their degree.RequirementsExhibit financial need as demonstrated by the adjusted gross annual household income (AGI) ceiling up to $120,000; if the scholar has not been listed as a dependent for the previous tax year, the AGI ceiling is up to $50,000Accept Stokes scholarship funds and sign a Continued Service Agreement that obligates you to work at the CIA 1.5 years for every year that you are in the Stokes Scholarship ProgramWork a full-time schedule (40 hours/week) for a minimum of 12 weeks each summer in the WMA until graduation and onboard as full-time officer (there is no break in service post-graduation; non-local scholars receive relocation entitlements)Maintain competitive GPA (minimum 3.0 on a 4.0 scale)Remain in full-time status as a student while in the program (min. 12 credit hours for undergraduate programs and 9 credit hours for graduate programs)Continue to major in the degree that aligns with the occupation for which you were admitted into the programProvide transcripts within 30 days of each semester completionMaintain a high standard of work performance, attendance, and conduct at both school and workAbility to meet the minimum requirements for joining CIA, including U.S. citizenship and a background investigationNote: Failure to comply with any of the requirements may affect continued participation in the program.DeadlinesAugust 1 through September 1, 11:59PM Eastern Daylight Time.Due to the length of our security and medical processes, this application will be for the summer of the following year. Stokes scholarship funding is not provided until after the start of your work tour and all updated documentation has been received.Learn MoreStokes Undergraduate Scholarship ProgramStokes Graduate Scholarship ProgramDesired MajorsScience and TechnologyPoint Down IconElectrical EngineeringComputer EngineeringComputer ScienceSoftware EngineeringMaterial ScienceAcoustic EngineeringMechanical EngineeringAerospace EngineeringDigital InnovationPoint Down IconMathematicsComputer ScienceComputer EngineeringComputer ForensicsCyber SecurityElectrical EngineeringEngineering (general)Computer NetworkingManagement Information SystemsData AnalyticsEconomicsSupportPoint Down IconBusiness-Administration and ManagementFinanceAccountingSupply Chain ManagementHuman Resource ManagementContracts/Acquisition/ProcurementOS/Cyber SecurityCommunicationsSecurity Engineering and Cyber DefenseGraduate Student in MBA programAnalyticalPoint Down IconEngineering Electrical Chemical/Biological Mechanical Aerospace Materials Science/Engineering PhysicsEconomicsHistory (Military History)International Affairs/Relations Government/Political Science Any Regional Studies MathematicsForeign Languages (Chinese, Korean, Farsi, Urdu, Arabic, Russian)Computer ScienceGlobal AffairsSociology/AnthropologyPsychology with International AffairsIntelligence/Security StudiesData Analysis/ScienceStatistics w/Regional StudiesUndergraduate ProgramsOur year-round internship programs allow undergraduate students to work in several areas before they graduate. These paid opportunities span a range of studies, including, but not limited to:FinanceEconomicsForeign languageEngineeringInformation technologySchools with co-operative programs typically have specific requirements to receive co-op credit. So, we designed our co-op program at the CIA to help students meet those requirements. As part of our program, students work on an alternating semester basis for at least three semesters before they graduate. This can include a summer work session as well. Since our Agency does not work with an established list of co-op programs, students will need to work with their schools to receive academic credit.DeadlinesStudents have to go through our medical and security process. Interested in our internship or co-op programs? For most of these opportunities, please submit your expression of interest at least 6-12 months before your desired start date. If you are applying for the Directorate of Operations Internship or our Scholarship Programs, you will need to submit your expression of interest during the timetable listed on the program’s page.Undergraduate Internship/Co-op opportunities<picture><source type="image/webp" srcSet="/careers/static/b70bebca898675fbb8080e350d1b9214/62859/GettyImages-947895250-1-scaled.webp 640w,/careers/static/b70bebca898675fbb8080e350d1b9214/67bed/GettyImages-947895250-1-scaled.webp 1280w,/careers/static/b70bebca898675fbb8080e350d1b9214/0ebd0/GettyImages-947895250-1-scaled.webp 2560w" sizes="(min-width: 2560px) 2560px, 100vw"/><img data-gatsby-image-ssr="" data-main-image="" style="opacity:0" sizes="(min-width: 2560px) 2560px, 100vw" decoding="async" loading="lazy" src="/careers/static/b70bebca898675fbb8080e350d1b9214/91a41/GettyImages-947895250-1-scaled.jpg" srcSet="/careers/static/b70bebca898675fbb8080e350d1b9214/e70fc/GettyImages-947895250-1-scaled.jpg 640w,/careers/static/b70bebca898675fbb8080e350d1b9214/5ba32/GettyImages-947895250-1-scaled.jpg 1280w,/careers/static/b70bebca898675fbb8080e350d1b9214/91a41/GettyImages-947895250-1-scaled.jpg 2560w" alt="A man dark skin and short, curly hair rests his hands on a pile of books in a library."/></picture>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}Graduate ProgramsOur Graduate Studies Program is available to full-time students in accredited graduate or doctoral programs. As part of our program, students complete at least one 90-day tour before graduating. This program is an exciting opportunity for graduate students to gain real-world work experience. It is also an excellent opportunity for graduates to transition from academic life to a career in national service.DeadlinesStudents have to go through our medical and security process. Interested in our Graduate Studies Program? Please submit your expression of interest at least 6-12 months before your desired start date.Graduate Studies Program opportunities<picture><source type="image/webp" srcSet="/careers/static/d8ab7ecf788523313a8e6d5371ec5827/62859/GettyImages-468656666-1-scaled.webp 640w,/careers/static/d8ab7ecf788523313a8e6d5371ec5827/828a3/GettyImages-468656666-1-scaled.webp 1280w,/careers/static/d8ab7ecf788523313a8e6d5371ec5827/aefa9/GettyImages-468656666-1-scaled.webp 2560w" sizes="(min-width: 2560px) 2560px, 100vw"/><img data-gatsby-image-ssr="" data-main-image="" style="opacity:0" sizes="(min-width: 2560px) 2560px, 100vw" decoding="async" loading="lazy" src="/careers/static/d8ab7ecf788523313a8e6d5371ec5827/1abb7/GettyImages-468656666-1-scaled.jpg" srcSet="/careers/static/d8ab7ecf788523313a8e6d5371ec5827/e70fc/GettyImages-468656666-1-scaled.jpg 640w,/careers/static/d8ab7ecf788523313a8e6d5371ec5827/af556/GettyImages-468656666-1-scaled.jpg 1280w,/careers/static/d8ab7ecf788523313a8e6d5371ec5827/1abb7/GettyImages-468656666-1-scaled.jpg 2560w" alt="A woman with medium-light skin wearing a head scarf holding a stack of books in a library."/></picture>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}We are the Students of CIAWarning: This video below may contain flickering or flashing scenes.TranscriptPoint Down IconWe are the student employees of the Central Intelligence Agency.We’re contributing to the work of a nation before we graduate.We learn from incredible colleagues how to apply our skills to protect our nation.We gain real, practical experience working on meaningful assignments.We are the student employees of the Central Intelligence Agency.The work of a nation. The center of Intelligence.More InformationQualifications and Hiring ProcessDue to the nature of our work, all applicants must meet specific criteria to qualify for employment. If eligible, you will go through our hiring process, including medical and security evaluations. Learn more about how we hire before you apply.BenefitsIf accepted to an internship or co-op program, you will be eligible for CIA employee benefits. These include health insurance, paid time off, and more.Browse Opportunities<picture><source type="image/webp" srcSet="/careers/static/e0a9c8f10f4049532b4178561a8ce45e/7dad0/CAR-INT-Feature-3-f.webp 375w,/careers/static/e0a9c8f10f4049532b4178561a8ce45e/57584/CAR-INT-Feature-3-f.webp 750w,/careers/static/e0a9c8f10f4049532b4178561a8ce45e/2b8d7/CAR-INT-Feature-3-f.webp 1500w" sizes="(min-width: 1500px) 1500px, 100vw"/><img data-gatsby-image-ssr="" data-main-image="" style="opacity:0" sizes="(min-width: 1500px) 1500px, 100vw" decoding="async" loading="lazy" src="/careers/static/e0a9c8f10f4049532b4178561a8ce45e/3564b/CAR-INT-Feature-3-f.jpg" srcSet="/careers/static/e0a9c8f10f4049532b4178561a8ce45e/e4b93/CAR-INT-Feature-3-f.jpg 375w,/careers/static/e0a9c8f10f4049532b4178561a8ce45e/7284f/CAR-INT-Feature-3-f.jpg 750w,/careers/static/e0a9c8f10f4049532b4178561a8ce45e/3564b/CAR-INT-Feature-3-f.jpg 1500w" alt=""/></picture>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}'
