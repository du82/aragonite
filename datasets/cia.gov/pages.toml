full_description = '''Think you know the real CIA?Secret gadgets? Sneaking around in trench coats? Danger around every corner? There’s a little of that, but the real CIA is more complex and interesting than you can imagine.Calling all Spy KidsMy name is Bill Burns, Director of the Central Intelligence Agency (CIA), and I am excited to welcome you to the Spy Kids website!Here at CIA, we are on the frontlines of keeping our country safe. What exactly does that mean? It means hiring our country’s smartest people from all walks of life. It means using technology to develop some of the coolest gadgets. It means traveling the world and building relationships to find information and uncover secrets. We bring all of that together to make sure the President of the United States and other senior leaders have the information they need to make tough decisions.It’s a difficult job, but it is one that the CIA can handle. Like you, our officers are curious about the world around them and excited by new challenges. They are also deeply committed to keeping you and our country safe.If you want to learn more about our work, I’d like to invite you to explore the Spy Kids website. Visit the “Stories” section for some inside information about CIA or, for a real treat, head over to the “Spy Dogs” section to meet some of the CIA K9s.To those parents and teachers out there, we haven’t forgotten about you. Head to the “Parents and Teachers” section of the site to find a few handy lesson plans that can be used in the home or in the classroom.Finally, I wouldn’t be a very good Director if I didn’t send you on a mission, would I? Check out the “Games” section to put your spy skills to the test and get a taste of what it’s like to serve at CIA.All the Best,Bill Burns<picture><source type="image/webp" srcSet="/spy-kids/static/ed1f71f0bf3c9f4b2c7e1dcbbe06bde9/bf3c2/burns-letter.webp 100w,/spy-kids/static/ed1f71f0bf3c9f4b2c7e1dcbbe06bde9/d0ba8/burns-letter.webp 200w,/spy-kids/static/ed1f71f0bf3c9f4b2c7e1dcbbe06bde9/711b0/burns-letter.webp 400w" sizes="(min-width: 400px) 400px, 100vw"/><img data-gatsby-image-ssr="" data-main-image="" style="opacity:0" sizes="(min-width: 400px) 400px, 100vw" decoding="async" loading="lazy" src="/spy-kids/static/ed1f71f0bf3c9f4b2c7e1dcbbe06bde9/629a3/burns-letter.png" srcSet="/spy-kids/static/ed1f71f0bf3c9f4b2c7e1dcbbe06bde9/f2bca/burns-letter.png 100w,/spy-kids/static/ed1f71f0bf3c9f4b2c7e1dcbbe06bde9/a149b/burns-letter.png 200w,/spy-kids/static/ed1f71f0bf3c9f4b2c7e1dcbbe06bde9/629a3/burns-letter.png 400w" alt=""/></picture>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}A Message from the DirectorCIA Director Burns took some time out of his busy schedule to write a letter to everyone here at Spy Kids. Check it out!<picture><source type="image/webp" srcSet="/spy-kids/static/9bedf89c783b9d5a65bc978727a65b0f/7224a/pigeon.webp 100w,/spy-kids/static/9bedf89c783b9d5a65bc978727a65b0f/7721b/pigeon.webp 200w,/spy-kids/static/9bedf89c783b9d5a65bc978727a65b0f/29da4/pigeon.webp 400w" sizes="(min-width: 400px) 400px, 100vw"/><img data-gatsby-image-ssr="" data-main-image="" style="opacity:0" sizes="(min-width: 400px) 400px, 100vw" decoding="async" loading="lazy" src="/spy-kids/static/9bedf89c783b9d5a65bc978727a65b0f/8f549/pigeon.png" srcSet="/spy-kids/static/9bedf89c783b9d5a65bc978727a65b0f/10fc2/pigeon.png 100w,/spy-kids/static/9bedf89c783b9d5a65bc978727a65b0f/c6d4a/pigeon.png 200w,/spy-kids/static/9bedf89c783b9d5a65bc978727a65b0f/8f549/pigeon.png 400w" alt=""/></picture>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}Pigeons as… spies?!Yes we did! In one of our more “feather-brained” schemes, we sent pigeons out with secret cameras to gather intel during the Cold War. Learn more about these birds here.Who are we?A lot of people think that CIA employees lurk around in trench coats, send coded messages, and use exotic equipment like hidden cameras and secret phones to do their job. (You know, all those things you see in movies or read about in spy novels.)There’s a little of that, but that’s only part of the story. The CIA is a US government agency that provides information (what we call “intelligence”) on foreign countries to the President, the National Security Council, and other US government officials to help them make good decisions about national security issues.We were created by President Harry S. Truman and the National Security Act of 1947. He wanted to create a central hub to coordinate all of America’s intelligence activities. That’s why we’re called the Central Intelligence Agency.We are the Nation's first line of defense. We accomplish what others cannot accomplish and go where others cannot go.Where do we get our intelligence?We collect intelligence from all kinds of places! Once we figure out an issue of national security concern to our government, we look for ways to collect information about that problem. We have tons of different methods for collecting intelligence, but a few big ones are: recruiting people in foreign countries to provide us with information; translating foreign newspapers, magazine articles, radio shows and TV programs; studying images taken by satellites; and cracking codes and secret messages sent by other countries.After we collect the information, we have experts (called intelligence analysts) who try to figure out what is really happening, why it’s happening, what might happen next, and what it means for our country.It’s like solving a giant jigsaw puzzle—except with a bunch of missing pieces, a bunch of extra pieces, and not knowing what the final image will be before you solve it.Once our analysts have solved enough of the puzzle and have good answers to those questions, they provide their assessments to US government officials, sometimes even the President! It’s kind of like turning in a big research project or book report to your teacher at the end of the semester.The government officials then use the information we provide to help them make policy toward other countries.<picture><source type="image/webp" srcSet="/spy-kids/static/60f02823490f20c07b2642f2ed1fba40/bf3c2/night-vision.webp 100w,/spy-kids/static/60f02823490f20c07b2642f2ed1fba40/d0ba8/night-vision.webp 200w,/spy-kids/static/60f02823490f20c07b2642f2ed1fba40/711b0/night-vision.webp 400w" sizes="(min-width: 400px) 400px, 100vw"/><img data-gatsby-image-ssr="" data-main-image="" style="opacity:0" sizes="(min-width: 400px) 400px, 100vw" decoding="async" loading="lazy" src="/spy-kids/static/60f02823490f20c07b2642f2ed1fba40/629a3/night-vision.png" srcSet="/spy-kids/static/60f02823490f20c07b2642f2ed1fba40/f2bca/night-vision.png 100w,/spy-kids/static/60f02823490f20c07b2642f2ed1fba40/a149b/night-vision.png 200w,/spy-kids/static/60f02823490f20c07b2642f2ed1fba40/629a3/night-vision.png 400w" alt=""/></picture>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}We can see in the darkNight vision goggles are just one of the many cool inventions CIA uses on missions. In fact, we have secret gadgets so advanced, they’re classified.<picture><source type="image/webp" srcSet="/spy-kids/static/e530ce900c98395d8b264c3de827ceb7/f61e1/virginia-hall.webp 100w,/spy-kids/static/e530ce900c98395d8b264c3de827ceb7/29a65/virginia-hall.webp 200w,/spy-kids/static/e530ce900c98395d8b264c3de827ceb7/66d1a/virginia-hall.webp 400w" sizes="(min-width: 400px) 400px, 100vw"/><img data-gatsby-image-ssr="" data-main-image="" style="opacity:0" sizes="(min-width: 400px) 400px, 100vw" decoding="async" loading="lazy" src="/spy-kids/static/e530ce900c98395d8b264c3de827ceb7/0d16b/virginia-hall.png" srcSet="/spy-kids/static/e530ce900c98395d8b264c3de827ceb7/f00da/virginia-hall.png 100w,/spy-kids/static/e530ce900c98395d8b264c3de827ceb7/19f8f/virginia-hall.png 200w,/spy-kids/static/e530ce900c98395d8b264c3de827ceb7/0d16b/virginia-hall.png 400w" alt=""/></picture>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}Meet VirginiaShe snuck behind enemy lines during WWII. She ran secret missions and was hunted by the Nazis. And she did it all with a wooden leg. Meet a true American hero, Virginia Hall.We don’t make policyOne very important thing to remember is that we do not make policy or even make policy recommendations. That’s the job of the US executive branch, such as the State Department and the Defense Department. We provide these leaders with the best information possible to help them make policy involving other countries.And although we have a lot of missions, we’re not a law enforcement organization. That’s the job of the FBI (Federal Bureau of Investigation) or your local police. But the CIA and the FBI do cooperate on many issues, such as counterintelligence (preventing our enemies from obtaining our secret information).Something else that might surprise you about the CIA is that we are just regular people like you. Our work may be secret, but our lives are pretty normal. We have kids and pets, we exercise, watch movies, eat out, spend time with friends, and do volunteer work.Want to learn some CIA secrets?Explore our site and read the latest exciting stories at CIA and meet our cuddliest four-legged spies. When you’re ready for a secret mission of your own, check out our games section. Help us crack codes, solve puzzles, and find secret clues to solve intelligence mysteries.<picture><source type="image/webp" srcSet="/spy-kids/static/f26e0d6e174d478450bf10c117b4804d/14fbb/bradley-video.webp 100w,/spy-kids/static/f26e0d6e174d478450bf10c117b4804d/f2c70/bradley-video.webp 200w,/spy-kids/static/f26e0d6e174d478450bf10c117b4804d/491a8/bradley-video.webp 400w" sizes="(min-width: 400px) 400px, 100vw"/><img data-gatsby-image-ssr="" data-main-image="" style="opacity:0" sizes="(min-width: 400px) 400px, 100vw" decoding="async" loading="lazy" src="/spy-kids/static/f26e0d6e174d478450bf10c117b4804d/18d30/bradley-video.png" srcSet="/spy-kids/static/f26e0d6e174d478450bf10c117b4804d/47aae/bradley-video.png 100w,/spy-kids/static/f26e0d6e174d478450bf10c117b4804d/b55e6/bradley-video.png 200w,/spy-kids/static/f26e0d6e174d478450bf10c117b4804d/18d30/bradley-video.png 400w" alt=""/></picture>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}Title with link not displayed'''
