["https://cia.gov/careers/working-at-cia/accessibility"]
title = "Accessibility and Accommodations - CIA"
full_description = "Working at CIAAccessibility and AccommodationsCIA Website AccessibilityThe Central Intelligence Agency is committed to providing access to our enterprise electronic and information technology for all employees and applicants with disabilities. To meet this commitment, we comply with the requirements of Section 508 of the Rehabilitation Act of 1973, 29 U.S.C. § 794d. Section 508 requires that we provide individuals with disabilities who are authorized access to our systems with access to and use of information and data that is comparable to individuals without disabilities, unless an “undue burden” would be imposed on the Agency.If the format of any material on our website interferes with your ability to access the information, due to an issue with accessibility caused by a disability as defined in the Rehabilitation Act, please access our contact page for assistance. To enable us to respond in a manner most helpful to you, please indicate the nature of your accessibility problem, the preferred format in which to receive the material, the web address (URL) of the material with which you are having difficulty, and your contact information.Architectural Barriers Act of 1968 (42 U.S.C. §§ 4151–57)The Architectural Barriers Act (ABA) requires access to facilities that are designed, built, altered, or leased with Federal funds. The Access Board is the federal agency responsible for enforcing the ABA. The Access Board’s accessibility standards are available on the US Access Board website.Reasonable AccommodationsIt is the policy of the CIA to comply fully with the requirements of the Rehabilitation Act of 1973, as amended, 29 U.S.C. § 791 et seq The Equal Employment Opportunity Commission (EEOC) has issued regulations at 29 C.F.R. Part 1630 implementing the provisions of the law for federal agencies.How to Apply for Reasonable AccommodationsIf you require a reasonable accommodation as an applicant with a disability or as a qualified applicant with a disability during the application process, please contact the Ability Talent Broker on 866-237-7221 for assistance. There are five possible phases of the RA interactive process: initiation of request, consideration of request, decision, post-decision implementation and evaluation, and reconsideration.Initiation of Request – Can be made to the applicant’s Agency point of contact or to the Ability Talent Broker via a toll-free number [1- (866) 237-7221]. The requestor may make this request directly, or through a representative, including but not limited to a family member, health professional, or fellow employee.Consideration of Request – The Ability Talent Broker/Reasonable Accommodations will collaborate with appropriate stakeholders to determine whether the requested accommodation is necessary to perform the essential functions of the job whether additional documentation is necessary, or whether to present an alternate effective accommodation.Decision – ATB/RA notifies the applicant of the decision to provide the requested accommodation, not to provide an accommodation, or to present an alternative accommodation. If the disability is obvious, written decisions shall be documented in an internal RA database and presented to the individual within 15 business days of the request when no medical documentation is required. If medical documentation is required by the RAPM, the decision will be issued within 15 business days from the date that sufficient medical documentation is received.Post-Decision Implementation and Evaluation – Once a reasonable accommodation request has been approved, in light of unique Agency equities, consultation with additional Agency stakeholders may be necessary in some cases, in order to ensure that implementation of the accommodation is done in a manner consistent with applicable Agency regulations and policies. Every effort should be taken to implement the accommodation promptly.Reconsideration – If the applicant disagrees with the decision reached by RA, the applicant may via the Ability Talent Broker ask RA to reconsider the decision. The applicant must provide new information/documents in support of the request for reconsideration. Response to a request for reconsideration should be provided no more than 15 business days from receipt of the request or receipt of additional information, if provided. If an alternate accommodation is offered, the applicant must try the offered accommodation before requesting reconsideration. If the applicant has tried the alternate accommodation and decided it is ineffective and the RA agrees, the interactive process will continue until either an effective accommodation is identified or the determination is made that there is no effective accommodation available because of an undue hardship to the Agency.Process for Requesting Personal Care AssistantsApplicants for employment may advise their hiring POC or the Ability Talent Broker of their request for personal assistance service (PAS), in addition to any request for reasonable accommodation. The process for requesting PAS, the process for determining whether such services are required, and the CIA’s right to deny such requests when provision of the services would pose an undue hardship, are the same as for reasonable accommodations.Central Intelligence Agency Reasonable Accommodation Policy and Procedures"
year_published = 2025
clearnet = "https://cia.gov/careers/working-at-cia/accessibility"
