["https://cia.gov/about/organization/privacy-and-civil-liberties"]
title = "Office of Privacy and Civil Liberties - CIA"
full_description = "OrganizationOffice of Privacy and Civil LibertiesThe Office of Privacy and Civil Liberties (OPCL) ensures that the CIA integrates privacy and civil liberties into the day-to-day conduct of its intelligence mission.ContentsPoint Down IconCollecting IntelligenceAbout OPCLComplaints Concerning Privacy and Civil LibertiesPrivacy Act and Freedom of Information Act RequestsMore ResourcesCollecting IntelligenceThe United States Government, including the CIA, has a solemn obligation to protect fully the legal rights of all Americans, including freedoms, civil liberties, and privacy rights guaranteed by federal law. The CIA collects, analyzes, and disseminates critical foreign intelligence information to national security policymakers in a manner consistent with this obligation.All of CIA’s intelligence activities must be properly authorized, and the collection, retention, or dissemination of information considering United States persons may only be conducted pursuant to specific procedures approved by the Director of the CIA and the Attorney General. While the protection of national security requires that many of the CIA’s intelligence activities remain secret, in order to improve public understanding and trust and to allow the public to hold CIA accountable, CIA has released its procedures for protecting Americans’ personal information and has provided an extensive explanation of the authorizations and limitations regarding such information.CIA's Executive Order 14086, Signals Intelligence Activities ProceduresCIA’s Executive Order 12333, Attorney General ProceduresStatement on the Release of the Central Intelligence Agency’s Updated Executive Order 12333 ProceduresDetailed Description of the Attorney General ProceduresAbout OPCLThe Privacy and Civil Liberties Officer serves as the principal advisor to the Director of the CIA and the Agency regarding privacy and civil liberties matters and is the CIA Transparency Officer, ensuring that the public is provided information on CIA activities as required by law. The Office of Privacy and Civil Liberties (OPCL) provides privacy and civil liberties guidance regarding the collection and handling of sensitive information across the Agency, trains Agency personnel regarding privacy and civil liberties protections, and reports on CIA privacy and civil liberties matters to oversight bodies and to the public.OPCL ReportsPrivacy and Civil Liberties Report: January 2023 - December 2023Data Mining Report: January - December 2022Privacy and Civil Liberties Report: July 2019 – December 2022Potential QAs for Deep Dives – February 2022PCLOB Report on CIA Activities – February 2022CIA Public Release Statement Deep Dives – February 2022CIA Public Release Statement Deep Dives – February 2022Recommendations from PCLOB Staff Report – February 2022Director Haines and Director Burns OPCL Memo Report – April 2021Privacy and Civil Liberties Report: January – June 2019Privacy and Civil Liberties Report: July – December 2018Privacy and Civil Liberties Report: January – June 2018Data Mining Report: January – December 2017FISA Dissemination Report – August 2017Privacy and Civil Liberties Report: July – December 2017Privacy and Civil Liberties Report: January – June 2017Data Mining Report: January – December 2016Data Mining Report: January – December 2016Privacy and Civil Liberties Report: January – June 2016Complaints Concerning Privacy and Civil LibertiesMembers of the public may contact the CIA Privacy and Civil Liberties Officer to make a complaint regarding possible violations of privacy protections or civil liberties in the administration of CIA programs and operations. A complaint may be sent via postal mail to the following address:Central Intelligence AgencyPrivacy and Civil Liberties OfficerWashington, D.C. 20505Members of the public may also submit a complaint using the web form. To ensure proper routing, please address your complaint to the Privacy and Civil Liberties Officer.OPCL will review all complaints directed to the PCLO. A complaint must state the possible violation of privacy protections or civil liberties with sufficient detail to allow the PCLO to assess the nature of the complaint and whether a remedy may be appropriate. Due to limited resources, OPCL will not be able to respond to complaints that do not provide sufficiently detailed information. A response by the PCLO will neither confirm nor deny the accuracy of the complaint and/or whether the individual has been subject to CIA action, but will confirm that the complaint has been properly investigated and indicate, when appropriate, that the matter has been remedied or found to be in compliance with applicable law or policy. A complaint also may be referred to the CIA Office of Inspector General or to another federal government agency, as appropriate.Privacy Act and FOIA RequestsIf you are seeking to request records related to yourself or another individual, pursuant to the Privacy Act or Freedom of Information Act, please follow the instructions found here:How to File a Freedom of Information Act (FOIA) RequestHow to File a Privacy Act RequestBefore submitting your request, check to see if the document is available in the CIA FOIA Electronic Reading Room.More ResourcesThe Privacy Act of 1974, 5 U.S.C. § 552a, as amendedSystem of Records Notice (SORN) - Vol. 87, No. 227Privacy Act Exemptions - Part 1901Executive Order 12333: United States Intelligence Activities, as amended42 U.S.C. § 2000ee-1: privacy and civil liberties officersPresidential Policy Directive (PPD-28): signals intelligence activitiesMinimization Procedures Used by the Central Intelligence Agency in Connection with Acquisitions of Foreign Intelligence Information Pursuant to Section 702 of the Foreign Intelligence Surveillance Act of 1978, as AmendedIC on the record: Office of the Director of National Intelligence – 702 Minimization ProceduresPrivacy and Civil Liberties Oversight BoardFederal Privacy CouncilContentsPoint Down IconCollecting IntelligenceAbout OPCLComplaints Concerning Privacy and Civil LibertiesPrivacy Act and Freedom of Information Act RequestsMore Resources"
