["https://cia.gov/careers/working-at-cia/veterans"]
title = "Veterans - CIA"
full_description = 'Working at CIAVeteransWe value the skills, dedication, and unique perspectives military veterans bring to the Agency. As part of our diverse workforce, veterans play a vital role in our mission.Veteran’s BenefitsIf employed by CIA, your veteran status may influence what benefits you receive. For a list of Agency benefits, visit the Benefits page.Annual LeaveMilitary personnel who separate from uniformed service, but are not retired, receive full annual leave credit for service performed under honorable conditions. The annual leave you earn each pay period is based on the years of uniformed service you performed:Years of Military ServiceHours/Pay PeriodDays/YearLess than 34133 but less than 1562015 or more826Military personnel who retire from uniformed service are generally not eligible for annual leave accrual credit.Service Credit for RetirementSeparated, but not retired, military personnel can use their uniformed service for credit toward civilian retirement by making a 3% deposit to the Federal Employees Retirement System (FERS).Retired military personnel can use their uniformed service toward civilian retirement by making a deposit to the retirement fund and waiving their military retirement pay at their civilian retirement. If a military retiree wants to keep their military retirement pay, they can’t use the military service toward civilian retirement.Military Leave Accrual for National Guard or Reserves DutyFull-time employees serving in the National Guard or the Reserves for Active Duty or Training accrue 15 days (120 hours) of military leave each fiscal year. Accrual rates for part-time employees are prorated. Employees can carry up to 120 unused military leave hours into the new fiscal year. Employees on military leave receive civilian and military pay.Military Leave PolicyEmployees required for emergency duty (for law enforcement or the protection of life and property) as ordered by the president or a state governor, or in support of contingency operations as defined in 10 U.S.C. 101(A)(13), receive the following military leave benefits:Employees earn up to 22 days of leave per calendar yearLeave cannot be carried over into the next calendar yearCivilian salary is reduced by the amount of pay for the days of military leave; An employee may choose to take annual instead of military leave and receive both military and civilian payCareer Opportunities through Operation WarfighterWe are a proud participant of Operation Warfighter. Operation Warfighter supports recovering service members convalescing at military centers by identifying temporary internship assignments and career opportunities—benefiting both the service member and CIA.Participants in Operation Warfighter work outside of the medical center environment and gain career experience using their military and non-military skills. Work schedules are flexible to accommodate medical treatment and recuperation. Generally, participants work about 20 hours each week and are paid by their respective armed service organization.Eligible participants are:Wounded, ill, or injured Active Duty Service Members, Mobilized Reservists, and National GuardsmenAssigned to a Warrior Transition UnitLocated in the Washington, DC areaAll internship opportunities require a Top Secret security clearance.There is no promise of permanent employment with the Agency upon completion of a military assignment. However, we encourage participants with appropriate education, training, and experience separating from the military to consider a full-time position at CIA.For more information about the Operation Warfighter Program, contact the Operation Warfighter Regional Coordinator at your local medical center.Operation Warfighter is operated in conjunction with the Department of Defense and overseen administratively by the Defense Intelligence Agency.Advance Your Career. Protect the Nation.When you work at CIA, you are part of a family of service—a diverse, equitable, and inclusive group of professionals who are proud to be the Nation’s first line of defense. Apply now and continue to do more for your country than you ever dreamed possible.Browse Jobs at CIA<picture><source type="image/webp" srcSet="/careers/static/c5fcabe3f6f08439e1031b9ba79b7f1c/a659d/placeholder-campus.webp 360w,/careers/static/c5fcabe3f6f08439e1031b9ba79b7f1c/dd138/placeholder-campus.webp 720w,/careers/static/c5fcabe3f6f08439e1031b9ba79b7f1c/a8843/placeholder-campus.webp 1440w" sizes="(min-width: 1440px) 1440px, 100vw"/><img data-gatsby-image-ssr="" data-main-image="" style="opacity:0" sizes="(min-width: 1440px) 1440px, 100vw" decoding="async" loading="lazy" src="/careers/static/c5fcabe3f6f08439e1031b9ba79b7f1c/145c1/placeholder-campus.png" srcSet="/careers/static/c5fcabe3f6f08439e1031b9ba79b7f1c/255e9/placeholder-campus.png 360w,/careers/static/c5fcabe3f6f08439e1031b9ba79b7f1c/77f66/placeholder-campus.png 720w,/careers/static/c5fcabe3f6f08439e1031b9ba79b7f1c/145c1/placeholder-campus.png 1440w" alt="An image of the outdoors of the old CIA Building."/></picture>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}'
