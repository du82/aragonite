cset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}Accommodations and AccessibilityWe are proud to be an Equal Opportunity Employer. If you need accommodations for any reason during the hiring process, our Reasonable Accommodations Staff can help.Get Guidance<picture><source type="image/webp" srcSet="/careers/static/93c98cbf1687dd43d517677dd7a20cf1/62859/accommodations_promo-scaled.webp 640w,/careers/static/93c98cbf1687dd43d517677dd7a20cf1/828a3/accommodations_promo-scaled.webp 1280w,/careers/static/93c98cbf1687dd43d517677dd7a20cf1/bbd9a/accommodations_promo-scaled.webp 2560w" sizes="(min-width: 2560px) 2560px, 100vw"/><img data-gatsby-image-ssr="" data-main-image="" style="opacity:0" sizes="(min-width: 2560px) 2560px, 100vw" decoding="async" loading="lazy" src="/careers/static/93c98cbf1687dd43d517677dd7a20cf1/9466f/accommodations_promo-scaled.jpg" srcSet="/careers/static/93c98cbf1687dd43d517677dd7a20cf1/e70fc/accommodations_promo-scaled.jpg 640w,/careers/static/93c98cbf1687dd43d517677dd7a20cf1/af556/accommodations_promo-scaled.jpg 1280w,/careers/static/93c98cbf1687dd43d517677dd7a20cf1/9466f/accommodations_promo-scaled.jpg 2560w" alt="A sunny path outside CIA headquarters in fall."/></picture>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcse