title = "Office of Inspector General - CIA"
full_description = "OrganizationOffice of Inspector GeneralThe Office of Inspector General (OIG) is responsible for independent oversight of the CIA.ContentsPoint Down IconWhat OIG DoesWho OIG Works WithContact OIGWhat OIG DoesComprised of the Office of Audits, Office of Inspections, and Office of Investigations, OIG promotes careful management of available resources, efficiency, effectiveness, and accountability across CIA programs. The staff works to uncover and stop fraud, waste, abuse, and mismanagement.As head of OIG, the Inspector General (IG) oversees the offices of Audits, Inspections, and Investigations. Nominated by the president and confirmed by the Senate, only the president can remove the IG from office. The IG’s authorities and responsibilities are provided in 50 U.S.C. §3517.AuditsThe Office of Audits conducts two types of audits:Performance audits, which review issues related to efficiency, effectiveness, and compliance with laws and regulationsFinancial audits, which review the integrity of financial transactions and statementsInspectionsThe Office of Inspections conducts two types of inspections:Component inspections, which address topics like mission accomplishment, management performance, and use of resourcesIssue inspections, which address topics that span directorate lines and affect broad segments of CIAInvestigationsThe Office of Investigations conducts investigations related to:Alleged fraudWasteAbuseMismanagementViolations of laws, rules, or regulationsOther wrongdoing brought to the attention of OIGWho OIG Works WithOIG advances CIA’s mission by offering findings and recommendations to the Agency, the Director of the CIA, and Congressional Intelligence Committees. When investigating alleged violations of law, OIG also works directly with CIA leadership, the Department of Justice, and other federal agencies.Contact OIGTo contact OIG, please send mail to the following address:Office of Inspector GeneralCentral Intelligence AgencyWashington, D.C. 20505ContentsPoint Down IconWhat OIG DoesWho OIG Works WithContact OIG"
