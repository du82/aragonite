title = "Benefits - CIA"
full_description = '''Working at CIABenefitsOur benefits support every aspect of a working professional’s life, including health and wellness, time off, family, finances, and continuing education.ContentsPoint Down IconHealth and WellnessTime OffFamilyFinancesContinuing EducationVeteran's BenefitsHealth and WellnessFitness and RecreationWe have on-site walking paths and fitness facilities open to all employees. Our employees can take up to three hours per week of excused absence to focus on physical fitness.Health InsuranceLike most government agencies, CIA employees get coverage through the Federal Employees Health Benefits Program. Employees can choose from a variety of plans and select one that works best for them. Dental, vision, and long-term care plans are also available.Time OffPaid Time OffAt CIA, annual leave is separate from sick leave, so when you take time off, you’re able to really enjoy your time away from work. Our culture strongly supports employees using the time off they’ve earned.Employees accrue annual leave on a biweekly basis. Total years of federal service determine annual leave accrual rates.Years of ServiceHours/Pay PeriodDays/YearLess than 34133 but less than 1562015 or more826Besides annual leave, CIA employees also get at least 10 paid federal holidays per year.Sick LeaveFull-time employees receive up to 13 days of sick leave each year to use for illness, medical appointments, and family care. These days never expire and roll over year-to-year.Employees can also take part in the Medical Leave Bank (MLB) membership program. MLB provides employees with leave for personal or family medical emergencies after they have used the rest of their leave. Employees can use MLB leave for medical treatment, surgery and recovery, childbirth, and caring for a sick family member.Enhanced Annual Leave Benefit (EALB)Newly appointed employees* and retired members of the uniformed services may be eligible to receive an increase in annual leave accrual if they have at least three years of qualified non-federal work experience within the past five years in a position with duties that are essential to and directly relate to the position to which they are hired at CIA. All EALB decisions are made in accordance with CIA policy after an employee enters on duty.*Employees are newly appointed if they have never served in Federal service, or are reappointed following a break in Federal service of at least 90 calendar days.FamilyChildcareWe sponsor a daycare facility that accepts children three months old through pre-kindergarten. Employees can also take part in the childcare subsidy program or enroll in a Dependent Care Flexible Spending Account.Flexible SchedulingWe allow for flexibility in scheduling working hours for our employees. Options like flexible start and end times, compressed weeks, part-time schedules, and more allow our employees to lead active lives outside of work.FinancesCompensationIn addition to base pay, employees may receive overtime, holiday, night differential, and premium pay.RetirementThe Federal Employees Retirement System (FERS) automatically covers all new employees who have not worked in federal government before. FERS is a three-tier system made up of the government’s 401K plan (Thrift Savings Plan, TSP), Social Security, and the FERS Basic Benefit Plan. The minimum retirement age under FERS depends on an employee’s date of birth, but ranges from age 55 to 57.Student Loan RepaymentTo help ease the burden of student loans, we can provide loan repayment assistance during the first six years of employment. Paired with salary and benefits, our student loan repayment benefits help you pay off your loans while you start your career.Continuing EducationGeneral Training and EducationEducation and training are a critical part of every CIA employee’s career development. Employees have access to a basic orientation, and most receive on-the-job and formal classroom training as well. Sponsorships are available for university and professional training in relevant programs.Foreign LanguageWe have a state-of-the-art language program that provides an immersive experience to master a new language. Both new and current employees with foreign language skills are eligible for financial compensation. Learn more about the program on the language opportunities page.How Does My Foreign Language Background Fit at CIA?Warning: This video below may contain flickering or flashing scenes.TranscriptPoint Down IconIf you’re like me, you want to use your foreign language skills for something meaningful — something bigger than yourself. The CIA is the perfect place to make this happen. Here, your talents make it possible for us to safeguard the national security of America through the collection and production of critical foreign intelligence for the President and senior policymakers. When I come to work each day, I know that I am contributing to a mission greater than myself.I speak Russian [spoken in Russian]I speak Korean [spoken in Korean]I speak Arabic [spoken in Arabic]So, if you have a strong foreign language fluency, you might be wondering where you could fit in at the CIA.You could systematically collect and evaluate foreign media and publications for open source intelligence as an Open Source Collection Officer.Another great fit would be a Foreign Language Instructor, where you would help CIA officers learn the foreign language skills and cross-cultural awareness they need to effectively conduct clandestine operations while living abroad.You could also be a Targeting Analyst. In this role, you would be producing a range of sophisticated targeting intelligence products, as well as analytic support for US policymakers, senior military officials and law enforcement agencies, for various threats to US national security.Or, you could serve in the Directorate of Operations, where you would help with the clandestine collection and dissemination of intelligence from human sources. This means you would be directly involved with some of the most sensitive work this nation performs. DO Language Officers produce high-quality, accurate and timely translations, interpretations and other language-related support, as well as cultural expertise, to DO clandestine operations.No matter what professional path you choose, a career in the CIA will give you a unique role in keeping not only the United States, but the world, safer.You have a lot of career choices in the CIA. Now, the only question is:Where do you want to serve?For more information on available opportunities, please visit cia.gov/careers.We are the Linguists of CIAWarning: This video below may contain flickering or flashing scenes.TranscriptPoint Down IconWe are the linguists of the Central Intelligence Agency.We work throughout the Agency, bringing cultural insight to critical missions.We are critical to global intelligence-gathering efforts.We teach, we research, we analyze, we examine.We leverage unique skills for the good of our nation.We are the linguists of the Central Intelligence Agency.The work of a nation. The center of intelligence.Veteran’s BenefitsIf you are a military veteran, your veteran status may influence the type of benefits you receive. To learn more about benefits and military transition, visit the Veterans page.ContentsPoint Down IconHealth and WellnessTime OffFamilyFinancesContinuing EducationVeteran's BenefitsFind Your CallingSearch over 100 jobs essential to our mission.Browse Jobs at CIA<picture><source type="image/webp" srcSet="/careers/static/b1b87f4db24bb3819eca99b4ff7e0cb7/f96c1/TTSS-Hero-06A.webp 285w,/careers/static/b1b87f4db24bb3819eca99b4ff7e0cb7/2153f/TTSS-Hero-06A.webp 570w,/careers/static/b1b87f4db24bb3819eca99b4ff7e0cb7/81471/TTSS-Hero-06A.webp 1140w" sizes="(min-width: 1140px) 1140px, 100vw"/><img data-gatsby-image-ssr="" data-main-image="" style="opacity:0" sizes="(min-width: 1140px) 1140px, 100vw" decoding="async" loading="lazy" src="/careers/static/b1b87f4db24bb3819eca99b4ff7e0cb7/9f417/TTSS-Hero-06A.png" srcSet="/careers/static/b1b87f4db24bb3819eca99b4ff7e0cb7/e6272/TTSS-Hero-06A.png 285w,/careers/static/b1b87f4db24bb3819eca99b4ff7e0cb7/8e13c/TTSS-Hero-06A.png 570w,/careers/static/b1b87f4db24bb3819eca99b4ff7e0cb7/9f417/TTSS-Hero-06A.png 1140w" alt="Hero"/></picture>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}'''
