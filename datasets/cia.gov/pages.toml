["https://cia.gov/privacy_policy"]
title = "Privacy - CIA"
full_description = "CIAPrivacyAt the Central Intelligence Agency (CIA), we’re committed to protecting your privacy and will not collect personal information about you unless you choose to provide that information to us.To learn more about our procedures for protecting Americans’ personal information, including an explanation of the authorizations and limitations regarding such information, visit the Office of Privacy and Civil Liberties page.If You Simply Browse Our Website:When you visit our website to browse information, you do so anonymously unless you choose to provide us information about yourself. If you do nothing during your visit but browse through the website—like reading pages or downloading information—we will automatically gather and store certain limited information about your visit. This information does not identify you personally.This gathering and storing of information is separate from the activity described as monitoring in our Security Notice.Information gathered automatically is used for, among other things, site management, compiling reports of usage statistics, and, in the case of suspected unauthorized activity, for law enforcement and possible criminal prosecution.Information about your visit that is automatically collected and stored may include:The Internet domain and Internet Protocol (IP) address from which you access our websiteThe type of internet browser and the operating system of the computer you use to access our siteThe date and time you visit our siteThe pages you visit on our siteIf you linked to our website from another website, the address of that websiteIf you linked to our website from a search website, the address of that website and the search term you usedIf You Apply for a Job Online:The resume and application data you submit will be used for employment consideration only and will be stored in an internal application tracking system for one year. Your data is only available internally to a limited number of hiring officials and, unless you authorize us to share it with other federal hiring officials by answering ‘yes’ to the relevant question on the resume form, it will not be shared with any other people or organizations internally or externally. The only exception to this policy is described in our Security Notice.The authority for soliciting your Social Security Number (SSN) is Executive Order 9397. Since other people may have the same name and birth date, your SSN will be used to identify you precisely. Although disclosure of your SSN is not mandatory, your failure to do so will impede completion of your application.If You Send Us an Email Using Our Online Form:Except as otherwise indicated, if you choose to submit a question or comment using our Online Form and provide us your name and email or postal address, we will use that information only to respond to your question or comment.We will not share your name, email, or postal address with any third party, other than as described below in our Security Notice.We will not create individual profiles with the information that you have provided. Under no circumstances will we give your name, email, or postal address to any private organization—commercial or otherwise.If you choose to offer information or assistance to our Agency in the pursuit of our mission by using our Online Form, we will make appropriate inquiries to determine the accuracy of your information. In addition, we may share the information you provide with other appropriate entities to enable us to carry out our legally authorized responsibilities. By providing information or assistance to us through our Online Form, you expressly consent to our use of whatever information you provide via our website.Privacy Act StatementAuthorities: 50 U.S.C. 403-4; 50 U.S.C. 403-4a(d); 50 U.S.C. 403a-g.Principal UsesInformation collected via our website is used to: 1) process employment applications from individuals who choose to submit their resumes through our online resume form; 2) provide information in response to comments or questions when a response is requested by the person submitting the comment or question; 3) assist us in the fulfillment of our foreign intelligence mission.Routine UsesInformation collected via our website may be provided to law enforcement agencies as described in our Security Notice and may be disclosed pursuant to our “Statement of General Routine Uses” published in the Federal Register."
year_published = 2025
