vide tailored products and services, taking projects from conception to occupancy. You may support procurement activities and building support services.Full timeStarting salary: $72,965 - $149,422Bachelor's degree Learn MoreArrow Right IconArtificial Intelligence SpecialistSaveBookmark Icon the Artificial Intelligence Specialist position.Save jobArtificial Intelligence Specialists apply their expertise to collection platforms, including edge processing and autonomous systems, in the exploitation of data from sophisticated collection systems.Full timeStarting Salary: $68,405 - $181,216**Higher starting salary possible depending on experience levelBachelor’s preferably in a quantitative science, engineering, or STEM fieldForeign Language Bonus EligibleOpportunities for travel are possibleLearn MoreArrow Right IconAttorney (Tech and Cyber)SaveBookmark Icon the Attorney (Tech and Cyber) position.Save jobAttorneys practice at the intersection of law and advanced technology.Full-Time $82,764 - $191,900Juris Doctor (JD) from an ABA-accredited law schoolActive bar membership (any US jurisdiction)Learn MoreArrow Right IconAutomotive MechanicSaveBookmark Icon the Automotive Mechanic position.Save jobAutomotive Mechanics provide a full range of corrective repairs and preventative maintenance on a variety of different vehicle types across the country and around the world.Full timeStarting salary: $35.17 - $41.06 per hourHigh school diploma or GED Learn MoreArrow Right IconAutonomous Systems and Robotics SpecialistSaveBookmark Icon the Autonomous Systems and Robotics Specialist position.Save jobAutonomous Systems and Robotics Specialist apply their expertise to research and design autonomous robotic capabilities to collect data.Full timeStarting salary: $68,405 - $181,216**Higher starting salary possible depending on experience levelBachelor’s in a quantitative science, engineering, or other STEM fieldForeign Language Bonus eligibleOpportunities for travel are possibleLearn More