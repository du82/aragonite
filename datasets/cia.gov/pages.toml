eStarting Salary: $68,405 -$181,216**Higher starting salary possible depending on experience levelAnimation, Graphics, Special EffectsForeign Language Bonus EligibleOpportunities for domestic and foreign travel are possibleLearn MoreArrow Right IconPhysicianSaveBookmark Icon the Physician position.Save jobPhysicians provide medical care and advice to CIA employees and dependents and other Agency sponsored people.Full timeSalary: $306,600Active, unrestricted licensure as a physician in one or more statesLearn MoreArrow Right IconParamilitary Operations OfficerSaveBookmark Icon the Paramilitary Operations Officer position.Save jobParamilitary Operations Officers lead and manage Covert Action programs and collect foreign intelligence vital to national security policymakers.Full timeStarting salary: $77,840 - $128,956* *Higher starting salary possible depending on experience levelBachelor's degreeForeign language bonus eligibleLearn MoreArrow Right IconWhy Work at CIA?We are an Agency defined by our mission, values, and people. Together, we accomplish what others cannot accomplish and go where others cannot go. When you’re a part of the Nation’s premier intelligence agency, your opportunities for personal and professional growth are boundless.Get Details<picture><source type="image/webp" srcSet="/careers/static/f54f0a4c5b0c19ce58749888a25f140b/b6c82/preview-1.webp 125w,/careers/static/f54f0a4c5b0c19ce58749888a25f140b/48571/preview-1.webp 250w,/careers/static/f54f0a4c5b0c19ce58749888a25f140b/921bf/preview-1.webp 500w" sizes="(min-width: 500px) 500px, 100vw"/><img data-gatsby-image-ssr="" data-main-image="" style="opacity:0" sizes="(min-width: 500px) 500px, 100vw" decoding="async" loading="lazy" src="/careers/static/f54f0a4c5b0c19ce58749888a25f140b/e5d44/preview-1.png" srcSet="/careers/static/f54f0a4c5b0c19ce58749888a25f140b/c42d0/preview-1.png 125w,/careers/static/f54f0a4c5b0c19ce58749888a25f140b/6b1e7/preview-1.png 250w,/careers/static/f54f0a4c5b0c19ce58749888a25f140b/e