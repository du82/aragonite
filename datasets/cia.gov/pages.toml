["https://cia.gov/careers/jobs/paramilitary-operations-officer"]
title = "Paramilitary Operations Officer - CIA"
full_description = "SaveBookmark IconSave jobBrowse CIA JobsParamilitary Operations OfficerParamilitary Operations Officers lead and manage Covert Action programs and collect foreign intelligence vital to national security policymakers.Full timeStarting salary: $77,840 - $128,956* *Higher starting salary possible depending on experience levelBachelor's degreeForeign language bonus eligibleExpress InterestArrow Right IconAgency-wide RequirementsAll applicants must be:U.S. citizens (dual U.S. citizens also eligible)At least 18 years of ageWilling to move to the Washington, DC areaAble to complete security and medical evaluationsRegistered for the Selective ServiceAbout the Job*Successful candidates for this position may be eligible for a one-time hiring bonus of up to 25% of their base payAs a Paramilitary Operations Officer (PMOO) for the CIA, you will join a select cadre that is motivated by camaraderie and selfless service. PMOOs lead and manage Covert Action programs, at the direction of President of the United States, and collect Foreign Intelligence vital to national security policymakers. As an action and results oriented professional, you will take on demanding responsibility, accept significant personal risk, and maintain accountability for results. PMOOs serve as a distinct occupation in the Directorate of Operations (DO), using their military experience to conduct air, ground and maritime paramilitary operations, covert action as well as intelligence collection in austere and dangerous environments. You are expected to be leaders and program managers, running paramilitary and intelligence operations in the field.All DO officers are hired at an entry level and train as they are expected to work – as one team. DO officers begin their careers spending one to two years learning the foundations of clandestine operational tradecraft via classroom training, practical exercise, and on-the-job experience. As equal parts Paramilitary and Operations Officers, PMOOs must successfully complete foundational training as a DO Operations Officer.Additionally, you are required to successfully complete specialized paramilitary training and demonstrate a high level of physical readiness in order to prepare for service in hazardous and austere environments overseas.PMOOs spend the majority of their careers serving out numerous short-term deployments or multi-year assignments in a variety of overseas locations.As part of the program, some DO officers will be expected to:Operate a motor vehicle without second-party assistance in daytime and nighttime conditions;Traverse uneven terrain, to include climbing and descending­­­ staircases, over fixed minimum distances and in varying weather conditions;Work non-traditional or erratic schedules;Make reasoned decisions under time constraints.This position requires a 5-year Contract Term AgreementWhat You’ll GetOur benefits support every aspect of a working professional’s life, including health and wellness, time off, family, finances, and continuing education. Our programs include highly sought-after government health benefits, flexible schedules, sick leave, and childcare. In some cases, we also offer sign-on incentives and cover moving expenses if you relocate.As a CIA employee, you’ll also get the satisfaction of knowing your work is part of something bigger than yourself. Our work is driven by one mission: to keep our Nation safe. Every day is an opportunity to enhance U.S. national security.Learn more about working at CIAMinimum QualificationsBachelor’s degree from an accredited institution (applicants within one year of earning a four year degree will be considered); there is no preferred major or program of study (degrees from foreign academic institutions are accepted, but you are responsible for obtaining and providing CIA with a credential evaluation from an accredited firm confirming that the foreign degree is the equivalent of a BA/BS and/or MA/MS degree conferred by a U.S. college or university)At least a 3.0 GPA on a 4-point scale is preferredServed on active duty with the US Armed Forces in either of the following Military Occupations/Career Fields:Special Operations or Combat ArmsAviation or Aviation related specialtiesSuccessful completion of specialized paramilitary training and demonstrates a high level of physical readinessWillingness to serve in hazardous and austere environments overseasPersonal integrity and the ability to operate with minimal supervisionStrong interpersonal and communications skills (verbal and written)Ability to work effectively as part of a team as well as work independentlyFlexibility, adaptability, and commitment to the mission of the CIA and the Directorate of OperationsAbility to meet the minimum requirements for joining CIA, including U.S. citizenship and a background investigationDesired QualificationsCompetitive Paramilitary Operations Officer applicants have:Minimum of 8 years of active duty experienceServed in multiple leadership positions generating a proven record of responsibility and critical decision-making in stressful situationsExperience serving in combat and conducting combat operations; multiple tours, particularly in leadership positions, are highly desiredCurrently on active duty or within three years following departure from active dutyApplicants on Reserve or National Guard status, more than three years from active duty, are more competitive if they have completed overseas deployments in that timeframeQualifications also considered:Non-combat overseas deployments with real world impactForeign language, foreign travel, and area knowledgeExperience in advanced combat skillsExperience conducting military/combat diving and underwater operations"
