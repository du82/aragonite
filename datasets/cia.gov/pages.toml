title = "Directorate of Support - CIA"
full_description = '''OrganizationDirectorate of SupportContentsPoint Down IconOur Mission and PrioritiesWhat We DoSupport Organization and Occupational GroupsCareers<picture><source type="image/webp" srcSet="/static/cbc46b2777c017739d365a5bf8bd0791/8c64a/OrganizationPage-DS.webp 320w,/static/cbc46b2777c017739d365a5bf8bd0791/ffef7/OrganizationPage-DS.webp 640w,/static/cbc46b2777c017739d365a5bf8bd0791/9ba0b/OrganizationPage-DS.webp 1280w" sizes="(min-width: 1280px) 1280px, 100vw"/><img data-gatsby-image-ssr="" data-main-image="" style="opacity:0" sizes="(min-width: 1280px) 1280px, 100vw" decoding="async" loading="lazy" src="/static/cbc46b2777c017739d365a5bf8bd0791/68d0b/OrganizationPage-DS.jpg" srcSet="/static/cbc46b2777c017739d365a5bf8bd0791/fc269/OrganizationPage-DS.jpg 320w,/static/cbc46b2777c017739d365a5bf8bd0791/4d5c4/OrganizationPage-DS.jpg 640w,/static/cbc46b2777c017739d365a5bf8bd0791/68d0b/OrganizationPage-DS.jpg 1280w" alt="Directorate of Support"/></picture>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}The Directorate of Support (DS) is the backbone of CIA’s mission. In the Agency’s unique environment, support to our intelligence collectors and analysts must be focused, agile, integrated, and reliable. The Directorate of Support serves side-by-side with our mission colleagues from all directorates to ensure all our mission elements have everything they need for success.DS officers are responsible for key support functions, including security, supply chains, facilities, financial and medical services, business systems, human resources, and logistics. They are often among the first CIA officers into difficult operational areas and are responsible for getting key support functions — to include security, supply chains, facilities, financial and medical services, business systems, human resources, logistics and others — up and running. They remain present throughout operations, providing ongoing support for each mission component. And, at the end of the operation, they ensure that people and equipment get out safely.For tasks and assignments all over the world, DS officers are first in, last out.We are the Directorate of SupportWarning: This video below may contain flickering or flashing scenes.TranscriptPoint Down IconWe are the skilled professionals of the Central Intelligence Agency.We run the business of intelligence.We provide critical tools and resources for CIA operations.From facilities to security, human resources to medical support and much more.We keep the CIA working.We are the skilled professionals of the Central Intelligence Agency.The work of a nation. The center of intelligence.Our Mission and PrioritiesMissionWe enable the Agency's Global Mission to ensure the nation's security with speed, reach, and scale. Our interconnected support network delivers trusted and authoritative services across all support business disciplines globally.VisionOne global support enterprise that delivers assured, high-value support solutions to our mission partners.ValuesWe are guided by a professional ethos that is the sum of our core values, highest aspirations, and commitment to mission. This ethos holds us on course as we exercise the extraordinary influence and authorities with which we have been entrusted to protect the Nation and advance its interests. Our values are those of the Agency that we serve.ServiceIntegrityExcellenceCourageTeamworkStewardshipWhat We DoFirst and foremost, the Directorate of Support (DS) enables the intelligence mission. The "mission first" approach ensures that each CIA directorate, partners across the Intelligence Community, and various other government agencies always have the support they need to meet whatever challenge they face.Every day, the DS works with analysts, scientists and operations officers around the globe providing the full range of both technical and non-technical support services, to include security, finance, logistics, business systems, and much more. DS officers work within local support teams or on their own as a single point of coordination on all DS matters. The collective expertise and creativity of DS officers enable the CIA's collection, analysis and technology missions to advance with precision, focus and efficiency.The work is both interesting and challenging. DS officers:Build and operate facilities, often in very challenging areasAcquire and ship critical equipmentSecure buildings, people, data and networksHelp hire, train and assign CIA officers for every directorateManage the "businesses" within CIAFrom the frontlines to the back office, the support we provide touches all facets of intelligence operations. These services, along with the passion and commitment of DS officers, make the intelligence mission possible, anytime, anywhere.The strength of the DS lies in the expertise, ingenuity, focus, and passion of their officers. DS officers bring a wide variety of skills, including medical, logistics, security, business systems, engineering, finance, education, facilities management, and human resources. No other Agency component has as many professionals with such a range of skills.The DS includes officers with advanced skills, such as doctors, finance officers, information security specialists, and graphic artists, as well as support generalists who can demonstrate a wide array of talents and acumen. All of our officers are constantly challenged to learn, adapt and contribute to a variety of mission-critical situations. Our unique tradecraft enables us to meet the challenges of supporting an intelligence mission that is critical to our nation’s defense. At home and abroad, our dedicated professionals play a vital role in the national security of our country every day.Support Organization and Occupational GroupsThe DS offices represent the diverse skills necessary to ensure mission success. Facilities officers create and maintain safe, secure, functional work environments.Finance officers handle the full range of financial services and resource management for the Agency. They establish Agency contracts and focus on employee compensation, budgets and auditing.Human Resources and training officers hire and train employees who can meet the demands of the mission. They deliver the full range of employee compensation and benefits. On a daily basis, HR officers strive to enhance employee work life, to ensure fairness, and to support the needs of our employees and their familiesLogistics officers manage day-to-day logistical support; acquisitions; construction projects; and the coordination of the expeditious movement of people and equipment.Medical professionals assist and administer to CIA employees, ensuring that the Agency maintains healthy employees, both mentally and physically. These officers plan, develop, implement and direct the CIA's medical programs on a worldwide basis. In addition, they further protect employees from environmental hazards.Security officers protect Agency personnel, facilities, information, and operations. Security officers protect our workforce, while managing risk and supporting the mission and operations of the Agency, both domestically and overseas.CareersYou might be surprised by who works at the CIA. The strength of the Directorate of Support (DS) lies in the expertise, ingenuity, focus and passion of their officers, who play a vital role in enabling CIA’s mission. Behind every intelligence effort are the extraordinary skilled professionals working in the DS. They get key functions up and running at the start of a mission, and get everyone and everything out safely at the end. From medical services and logistics to the human resources, security, finance, and trade occupations, these officers provide the infrastructure and expertise necessary to keep key CIA functions up and running at Headquarters and in locations worldwide.A Career of Global ImportanceIn response to the wide-ranging needs of the intelligence mission, the DS recruits, hires, and trains a broad spectrum of applicants whom they train and deploy in unique ways, providing an extraordinary mix of talent and skills. The DS hires for more than 30 different career disciplines to share the CIA’s mission of keeping the nation safe. Support officers generally serve alongside their customers and rotate to new assignments every few years according to their interests and experience.Is This the Job for You?The range and variety of positions within the DS is extensive. We generally look for individuals who see their career as more than a job and will take on our mission in a personal way, applying their skills and talents for the good of the country.Training and continuing educational opportunities are part of our culture. Because of our national security role, all applicants must be US citizens and successfully complete thorough background and medical examinations, including a polygraph interview.If you choose to build your career with the CIA supporting our critical mission, you will have the opportunity to serve in a variety of locations and positions. You will enhance your skills by progressively tackling more challenging duties within a specialized area or by building on your experience and contacts to coordinate support activities.Featured JobsAccountantSaveBookmark Icon the Accountant position.Save jobAccountants use their skills in challenging and rewarding areas such as: financial statement compilation and analysis; general ledger review and analysis; and payroll and tax accounting.Full timeStarting salary: $74,318- $129,759**Higher starting salary possible depending on experience levelBachelor's DegreeLearn MoreArrow Right IconPhysicianSaveBookmark Icon the Physician position.Save jobPhysicians provide medical care and advice to CIA employees and dependents and other Agency sponsored people.Full timeSalary: $306,600Active, unrestricted licensure as a physician in one or more statesLearn MoreArrow Right IconPhysical and Technical Security OfficerSaveBookmark Icon the Physical and Technical Security Officer position.Save jobPhysical and Technical Security Officers secure CIA facilities by analyzing risks, constructing facilities, accrediting secure work environments, and installing and maintaining security systems.Full timeStarting salary: $68,405 - $128,956Associate's degreeDomestic and foreign travel is requiredLearn MoreArrow Right IconAutomotive MechanicSaveBookmark Icon the Automotive Mechanic position.Save jobAutomotive Mechanics provide a full range of corrective repairs and preventative maintenance on a variety of different vehicle types across the country and around the world.Full timeStarting salary: $35.17 - $41.06 per hourHigh school diploma or GED Learn MoreArrow Right IconContentsPoint Down IconOur Mission and PrioritiesWhat We DoSupport Organization and Occupational GroupsCareers'''
