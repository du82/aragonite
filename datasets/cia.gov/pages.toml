["https://cia.gov/podcast/the-langley-files"]
title = "The Langley Files - Podcast"
full_description = '''The Langley FilesYou might have heard a thing or two about the CIA, but have you ever heard from the CIA? In the Central Intelligence Agency's first public podcast, you will. Let us be your guides around the corridors of CIA Headquarters in Langley, as you step beyond the Hollywood scripts and shadowed whispers to hear directly from the people serving each day as America's first line of defense. These are their stories. This is The Langley Files.<picture><source type="image/webp" srcSet="/podcast/static/e2b8526ef14221da7c5f8e8d74dc5fdc/f0e08/podcast_banner_transparent.webp 200w,/podcast/static/e2b8526ef14221da7c5f8e8d74dc5fdc/0ef62/podcast_banner_transparent.webp 400w,/podcast/static/e2b8526ef14221da7c5f8e8d74dc5fdc/2f0e4/podcast_banner_transparent.webp 800w" sizes="(min-width: 800px) 800px, 100vw"/><img data-gatsby-image-ssr="" aria-hidden="true" data-main-image="" style="opacity:0" sizes="(min-width: 800px) 800px, 100vw" decoding="async" loading="lazy" src="/podcast/static/e2b8526ef14221da7c5f8e8d74dc5fdc/25578/podcast_banner_transparent.png" srcSet="/podcast/static/e2b8526ef14221da7c5f8e8d74dc5fdc/3ca65/podcast_banner_transparent.png 200w,/podcast/static/e2b8526ef14221da7c5f8e8d74dc5fdc/e4061/podcast_banner_transparent.png 400w,/podcast/static/e2b8526ef14221da7c5f8e8d74dc5fdc/25578/podcast_banner_transparent.png 800w" alt=""/></picture>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}Subscrib