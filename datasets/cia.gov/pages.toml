full_description = 'LegacyCIA MuseumFrom the highest heights to the deepest depths, explore the CIA Museum and the hidden world of American intelligence.Featured ArtifactsRadio Receiver ConcealmentLearn MoreArrow Right IconA-12 Full Pressure SuitLearn MoreArrow Right IconConcealed CompassLearn MoreArrow Right IconEloise Page IDLearn MoreArrow Right IconExplore All ArtifactsFeatured ExhibitsThe Final Chapter in the Hunt for Bin LadinExploreArrow Right IconThe Berlin TunnelExploreArrow Right IconProject AZORIANExploreArrow Right IconExplore All Exhibits<picture><source type="image/webp" srcSet="/static/67fe433c81f0d062088d76d5bc811428/5d191/Glyph_Legacy_Positve.webp 90w,/static/67fe433c81f0d062088d76d5bc811428/52f83/Glyph_Legacy_Positve.webp 180w,/static/67fe433c81f0d062088d76d5bc811428/27ab5/Glyph_Legacy_Positve.webp 360w" sizes="(min-width: 360px) 360px, 100vw"/><img data-gatsby-image-ssr="" data-main-image="" style="opacity:0" sizes="(min-width: 360px) 360px, 100vw" decoding="async" loading="lazy" src="/static/67fe433c81f0d062088d76d5bc811428/257af/Glyph_Legacy_Positve.png" srcSet="/static/67fe433c81f0d062088d76d5bc811428/25ed1/Glyph_Legacy_Positve.png 90w,/static/67fe433c81f0d062088d76d5bc811428/a2c25/Glyph_Legacy_Positve.png 180w,/static/67fe433c81f0d062088d76d5bc811428/257af/Glyph_Legacy_Positve.png 360w" alt="Decorative glyph for Legacy."/></picture>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}About the MuseumA robotic bug that’s actually a bug. A makeup compact that hides a secret message. An A-12 OXCART reconnaissance aircraft—one of only nine in existence. These are just a few of the unique artifacts the CIA Museum has collected over the years to help bring our Agency’s history to life.In 1972, former CIA Executive Director, William E. Colby, had the idea for an Agency museum filled with artifacts of historical significance to create “a very selective accumulation of truly unique items.” Our collection now includes spy gadgets, specialized weaponry, and espionage memorabilia that spans our pre-WWII origins through today. Many of our artifacts were created for intelligence operations and cannot be found anywhere else. Although the CIA Museum is not open to the public because of its location at CIA Headquarters in Langley, Virginia, we can do the next best thing and open our virtual doors to you. Browse our one-of-a-kind collection, explore our exhibits, and learn declassified stories behind some of our most daring missions.'
