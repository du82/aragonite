title = "Legacy - CIA"
full_description = '''LegacyOur Agency’s history is filled with captivating stories of past missions and heroes. From intelligence successes to lessons learned, we continue to adapt to meet the world’s challenges.<picture><source type="image/webp" srcSet="/static/de00f5af91170874c94d1f6b6152a400/e8222/Legacy_Star_2.webp 270w,/static/de00f5af91170874c94d1f6b6152a400/7928f/Legacy_Star_2.webp 540w,/static/de00f5af91170874c94d1f6b6152a400/017df/Legacy_Star_2.webp 1080w" sizes="(min-width: 1080px) 1080px, 100vw"/><img data-gatsby-image-ssr="" data-main-image="" style="opacity:0" sizes="(min-width: 1080px) 1080px, 100vw" decoding="async" loading="lazy" src="/static/de00f5af91170874c94d1f6b6152a400/6ea44/Legacy_Star_2.png" srcSet="/static/de00f5af91170874c94d1f6b6152a400/c0b7e/Legacy_Star_2.png 270w,/static/de00f5af91170874c94d1f6b6152a400/7ef5d/Legacy_Star_2.png 540w,/static/de00f5af91170874c94d1f6b6152a400/6ea44/Legacy_Star_2.png 1080w" alt=""/></picture>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}A star carved into the marble of CIA’s Memorial Wall, commemorating a fallen officer.Our people’s ingenuity, grit, and determination define our legacy.<picture><source type="image/webp" srcSet="/static/67fe433c81f0d062088d76d5bc811428/5d191/Glyph_Legacy_Positve.webp 90w,/static/67fe433c81f0d062088d76d5bc811428/52f83/Glyph_Legacy_Positve.webp 180w,/static/67fe433c81f0d062088d76d5bc811428/27ab5/Glyph_Legacy_Positve.webp 360w" sizes="(min-width: 360px) 360px, 100vw"/><img data-gatsby-image-ssr="" data-main-image="" style="opacity:0" sizes="(min-width: 360px) 360px, 100vw" decoding="async" loading="lazy" src="/static/67fe433c81f0d062088d76d5bc811428/257af/Glyph_Legacy_Positve.png" srcSet="/static/67fe433c81f0d062088d76d5bc811428/25ed1/Glyph_Legacy_Positve.png 90w,/static/67fe433c81f0d062088d76d5bc811428/a2c25/Glyph_Legacy_Positve.png 180w,/static/67fe433c81f0d062088d76d5bc811428/257af/Glyph_Legacy_Positve.png 360w" alt="Decorative glyph for Legacy."/></picture>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}Established in 1947History of CIAOur Agency is built on the creativity and agility of intelligence officers dedicated to safeguarding our Nation. The Office of Strategic Services (OSS), our Agency’s forerunner, was created during World War II and was America’s first global intelligence organization. OSS was capable of coordinated espionage, covert action, and counterintelligence—all of which are pieces of today’s CIA.As the war ended, OSS’s success proved that strategic intelligence had its place in times of both war and peace. A few years later, President Truman signed the National Security Act of 1947. This established the CIA. Take a closer look at how American intelligence evolved to form the basis of today’s Intelligence Community.See Our Evolution<picture><source type="image/webp" srcSet="/static/24cea683d35bbf32f7efc9699d493f46/31ae2/LEG-LAN-Feature-1-c%402x.webp 223w,/static/24cea683d35bbf32f7efc9699d493f46/e1121/LEG-LAN-Feature-1-c%402x.webp 445w,/static/24cea683d35bbf32f7efc9699d493f46/b7cad/LEG-LAN-Feature-1-c%402x.webp 890w" sizes="(min-width: 890px) 890px, 100vw"/><img data-gatsby-image-ssr="" data-main-image="" style="opacity:0" sizes="(min-width: 890px) 890px, 100vw" decoding="async" loading="lazy" src="/static/24cea683d35bbf32f7efc9699d493f46/1fc33/LEG-LAN-Feature-1-c%402x.jpg" srcSet="/static/24cea683d35bbf32f7efc9699d493f46/b1867/LEG-LAN-Feature-1-c%402x.jpg 223w,/static/24cea683d35bbf32f7efc9699d493f46/08956/LEG-LAN-Feature-1-c%402x.jpg 445w,/static/24cea683d35bbf32f7efc9699d493f46/1fc33/LEG-LAN-Feature-1-c%402x.jpg 890w" alt="Men discussing around a table pointing to a piece of paper on the table between them."/></picture>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}CIA MuseumExperience history on display, at your fingertips. Our virtual museum details our Agency’s past and its contributions to U.S. national security. Browse over 200 artifacts ranging from robotic catfish and pigeon cameras to invisible ink and mission memorabilia. We’ve thoughtfully curated each exhibit to bring CIA moments to life.View Our Collection<picture><source type="image/webp" srcSet="/static/4e7d2083969373879c2d3640b523c028/e0e76/Museum-Entrance-Origins.webp 512w,/static/4e7d2083969373879c2d3640b523c028/16474/Museum-Entrance-Origins.webp 1024w,/static/4e7d2083969373879c2d3640b523c028/3efec/Museum-Entrance-Origins.webp 2048w" sizes="(min-width: 2048px) 2048px, 100vw"/><img data-gatsby-image-ssr="" data-main-image="" style="opacity:0" sizes="(min-width: 2048px) 2048px, 100vw" decoding="async" loading="lazy" src="/static/4e7d2083969373879c2d3640b523c028/77619/Museum-Entrance-Origins.png" srcSet="/static/4e7d2083969373879c2d3640b523c028/90381/Museum-Entrance-Origins.png 512w,/static/4e7d2083969373879c2d3640b523c028/32a26/Museum-Entrance-Origins.png 1024w,/static/4e7d2083969373879c2d3640b523c028/77619/Museum-Entrance-Origins.png 2048w" alt="Museum Entrance"/></picture>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}CIA HeadquartersOfficially opening its doors in 1961, CIA Headquarters isn’t just our home for global operations. It’s also full of stories from past missions and heroes. Fascinated by stealth aircraft like the A-12? Curious what former presidents wrote in our President’s Gallery? Our virtual Headquarters photo tour opens the gates to our campus in Langley, Virginia. Browse the gallery for a unique chance to learn more about us.Explore Our Campus<picture><source type="image/webp" srcSet="/static/c5fcabe3f6f08439e1031b9ba79b7f1c/a659d/placeholder-campus.webp 360w,/static/c5fcabe3f6f08439e1031b9ba79b7f1c/dd138/placeholder-campus.webp 720w,/static/c5fcabe3f6f08439e1031b9ba79b7f1c/a8843/placeholder-campus.webp 1440w" sizes="(min-width: 1440px) 1440px, 100vw"/><img data-gatsby-image-ssr="" data-main-image="" style="opacity:0" sizes="(min-width: 1440px) 1440px, 100vw" decoding="async" loading="lazy" src="/static/c5fcabe3f6f08439e1031b9ba79b7f1c/145c1/placeholder-campus.png" srcSet="/static/c5fcabe3f6f08439e1031b9ba79b7f1c/255e9/placeholder-campus.png 360w,/static/c5fcabe3f6f08439e1031b9ba79b7f1c/77f66/placeholder-campus.png 720w,/static/c5fcabe3f6f08439e1031b9ba79b7f1c/145c1/placeholder-campus.png 1440w" alt="An image of the outdoors of the old CIA Building."/></picture>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}Honoring CIA's FallenThe men and women of CIA are united by a mission essential to our country. Our officers are frequently first on the ground in areas of unrest, often without the benefit of additional support, always in harm’s way. Today, and every day, we honor and remember the brave CIA officers who gave their lives in the service of their country.Learn About Our Fallen<picture><source type="image/webp" srcSet="/static/b128b59539ed37796289a7c5ed7ba5a2/8392d/Memorial_Wall_140.webp 512w,/static/b128b59539ed37796289a7c5ed7ba5a2/149f6/Memorial_Wall_140.webp 1024w,/static/b128b59539ed37796289a7c5ed7ba5a2/2f967/Memorial_Wall_140.webp 2048w" sizes="(min-width: 2048px) 2048px, 100vw"/><img data-gatsby-image-ssr="" data-main-image="" style="opacity:0" sizes="(min-width: 2048px) 2048px, 100vw" decoding="async" loading="lazy" src="/static/b128b59539ed37796289a7c5ed7ba5a2/bd1e0/Memorial_Wall_140.jpg" srcSet="/static/b128b59539ed37796289a7c5ed7ba5a2/4cd08/Memorial_Wall_140.jpg 512w,/static/b128b59539ed37796289a7c5ed7ba5a2/862e9/Memorial_Wall_140.jpg 1024w,/static/b128b59539ed37796289a7c5ed7ba5a2/bd1e0/Memorial_Wall_140.jpg 2048w" alt="The American flag and the CIA flag on either side of an inscription with 140 stars engraved."/></picture>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}Stories of Our PastChallenging the Status Quo: Elizabeth Sudmeier’s Historic LegacyRead MoreArrow Right IconSurprise, Kill, Vanish: The Legend of the JedburghsRead MoreArrow Right IconVirginia Hall: The Courage and Daring of “The Limping Lady”Read MoreArrow Right IconMake Our Legacy Your Legacy. Find Your Calling With a Career at CIA.At CIA, your work is more than a job—it’s a mindset and a lifestyle. When you are part of the Nation’s premier intelligence agency, you are on the front lines of history, with boundless opportunities to grow and contribute to our mission.Browse Jobs<picture><source type="image/webp" srcSet="/static/b1b87f4db24bb3819eca99b4ff7e0cb7/f96c1/TTSS-Hero-06A.webp 285w,/static/b1b87f4db24bb3819eca99b4ff7e0cb7/2153f/TTSS-Hero-06A.webp 570w,/static/b1b87f4db24bb3819eca99b4ff7e0cb7/81471/TTSS-Hero-06A.webp 1140w" sizes="(min-width: 1140px) 1140px, 100vw"/><img data-gatsby-image-ssr="" data-main-image="" style="opacity:0" sizes="(min-width: 1140px) 1140px, 100vw" decoding="asyn