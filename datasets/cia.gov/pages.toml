["https://cia.gov/careers/jobs/administrative-professional"]
title = "Administrative Professional - CIA"
full_description = "SaveBookmark IconSave jobBrowse CIA JobsAdministrative ProfessionalAdministrative Professionals perform internal and external customer service duties ranging from routine to complex clerical, secretarial, enterprise, and administrative work.Full timeStarting salary: $55,924 - $93,798**Higher starting salary possible depending on experience levelHigh School Diploma or GEDExpress InterestArrow Right IconAgency-wide RequirementsAll applicants must be:U.S. citizens (dual U.S. citizens also eligible)At least 18 years of ageWilling to move to the Washington, DC areaAble to complete security and medical evaluationsRegistered for the Selective ServiceAbout the JobAs an Administrative Professional for CIA, you will fill critical positions, performing a variety of skilled and semi-skilled duties related to internal and external customer service ranging from routine to complex clerical, secretarial, enterprise, and administrative work. You will work in a fast-paced, challenging environment where your organizational skills and attention to details will help you handle a wide array of tasks.To perform this job successfully, you must be able to perform each essential job function as listed below:Business skills – display a working knowledge of office practices and proceduresProblem solving – gather and analyze information to identify and resolve problems in a timely mannerCustomer service – satisfy customer needs by providing and delivering professional, helpful high-quality service and assistancePlanning/Organizing – prioritize and plan work activities using realistic action plansAdministrative support – directly support senior Agency leadership and other assigned management positions, including calendar management/scheduling of appointmentsVerbal/written communication skills – proofread/review correspondence for accuracy and completenessTechnical skills – knowledge of technology/office equipment and willingness to learn new information systems and software; proficiency in the use of computer applications and MS Office Suite (e.g., Excel, PowerPoint, Word)Accounting – expense tracking, billing/invoicing, tracking division requisitions, purchase ordersWhat You’ll GetOur benefits support every aspect of a working professional’s life, including health and wellness, time off, family, finances, and continuing education. Our programs include highly sought-after government health benefits, flexible schedules, sick leave, and childcare. In some cases, we also offer sign-on incentives and cover moving expenses if you relocate.As a CIA employee, you’ll also get the satisfaction of knowing your work is part of something bigger than yourself. Our work is driven by one mission: to keep our Nation safe. Every day is an opportunity to enhance U.S. national security.Learn more about working at CIAMinimum QualificationsHigh School diploma or GEDAt least a 3.0 GPA on a 4.0 scalePrior experience in a customer service or administrative professional position or equivalent military experienceAbility to maintain a professional demeanor, practicing strict confidentiality for all sensitive informationPromotes and practices the highest standards of personal and professional conductInitiative and flexibilityAbility to work in a team environment and independentlyAbility to perform multiple tasks simultaneously, at times working under pressure with competing prioritiesAbility to devise and implement improved office procedures as needed, while delivering outstanding customer serviceAbility to meet the minimum requirements for joining CIA, including U.S. citizenship and a background investigationDesired QualificationsAssociates or Bachelor’s degreeFour (4) or more years of administrative/office experienceEquivalent federal government or military experience"
