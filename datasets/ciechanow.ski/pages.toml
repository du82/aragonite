title = "Earth and Sun – Bartosz Ciechanowski"
description = "Interactive article about Earth and Sun."
full_description = "October 16, 2019 Earth and SunThe day-night cycle and the cycle of the seasons have been an important part of human civilization for millennia. Today the discoveries from centuries ago are well known, but despite the superficial simplicity of Earth revolving around its axis and orbiting the Sun, the interaction between those two actually forms a fairly complex system. This blog post will talk about space and how our planet moves through it, so it’s only fitting if we embed ourselves in the cosmos itself. Over the course of this article I’ll try to explain how the Sun and the various motions of the Earth end up making our planet look like in the demonstration below. You can drag the globe around to see it from different perspectives and use the sliders to change the date and time: It’s hard to talk about Earth and Sun without referencing a few dimensions and dates. They’ll be shown in imperialmetric units (e.g. 1 mi1 km) and an Americanan international date format (mm/dd/yyyydd/mm/yyyy), but you can switch to the more universalAmerican units if you prefer. The time of day will be presented in Coordinated Universal Time, or UTC for short, which is roughly a local time in Greenwich in London, UK. This time standard is not adjusted for daylight saving time which is very convenient as it will let us look at the sunlight for the same time of day at different dates. Size Let’s start by visualizing how enormous the Sun is. In the picture below you’ll find the Earth and the Sun placed next to each other. The Earth is the tiny blue dot on the right side of the Sun: The Sun is almost a perfect sphere with a radius of 432,170 mi695,700 km. The Earth’s shape resembles an ellipsoid with an average radius of 3958.8 mi6371 km. As such, the radius of the Sun is 109 times larger than that of the Earth. Naturally, the Sun doesn’t look that large in the sky, but that’s because the Sun is quite far away from the Earth. Before we see how far away the Sun is we first have to discuss a simple shape that is the base of all planetary orbits – an ellipse. Ellipse There are multiple ways to define an ellipse, but in the context of space it’s most convenient to speak of it in terms of focal points. An ellipse is a figure consisting of points for which the sum of distances to its two focal points is constant. That’s certainly a mouthful, so an interactive diagram will paint a better picture: The small cross represents the center of an ellipse while the two white disks show its focal points. The total length of blue and red segments is the same for every point on the ellipse. The dashed line is called the semi-major axis of the ellipse while the dotted line is the semi-minor axis. The defining property of an ellipse is the ratio between a distance c from the center to a focal point known as linear eccentricity, and a distance a from the center to the “far point” of the ellipse i.e. the length of its semi-major axis. In the demonstration below you can adjust that ratio with a slider: This ratio is known as eccentricity. When an eccentricity is equal to 0 an ellipse becomes a perfect circle, for eccentricity of 1 an ellipse with a fixed major axis length degenerates into a linear segment. Orbit You may have already heard that the orbit of the Earth is an ellipse and that the Sun is located in one of the focal points of that ellipse. This situation is often visualized like this: The small cross in the middle shows the center of the ellipse while the small rings, one of which is directly in the center of the Sun, symbolize the focal points. There are two important points on the orbit: the perihelion is the point at which Earth is closest to the Sun, while at the aphelion Earth is the furthest away from the Sun. Technically, the Sun is not in one of the focal points of the ellipse, but instead the objects in the Solar System revolve around its center of mass. However, the Sun’s mass is so dominant that the actual focal point is fairly close to the Sun’s center. What we’ve seen above paints a convenient picture, but the actual relative sizes are very different. Below you’ll find a visualization of the Earth’s orbit around the Sun with proper scales. The tiny yellow dot in the middle depicts the Sun. At your current viewing scale the Earth is pretty much invisible, it has a diameter of pixels, so instead its location is shown by an arrow. You may also be barely able to tell that the orbit is elliptical. Its eccentricity is equal to 0.0167 and the Sun is very close to the center: If you pay a close attention to the position of the Earth at the beginning of a calendar year and compare it with the beginning of the next year you’ll notice that the Earth hasn’t returned to the exact same position – during 365 days the Earth falls a little short of the full orbit. We’ll soon see that there are multiple ways to define “a day”, but unless stated otherwise we’ll assume that it lasts 24 hours, that is 24 × 60 × 60 = 86400 seconds. The time it takes Earth to get back to the same point on the orbit is called a sidereal year where sidereal means “with respect to stars”. A sidereal year lasts roughly 365.256 days. A sidereal year is actually not the basis of year tracking in civilian time, but we’ll have to wait until the later parts of this article to discuss the period of Earth’s journey around the Sun that defines how we count years. The eccentricity of the Earth’s orbit is fairly small so the distance between the center of the Sun at aphelion (94,509,460 mi152,098,233 km) is not that much larger than that at perihelion (91,402,640 mi147,098,291 km). As such, the apparent Sun size is only 3.3% smaller when the Sun is the farthest from Earth compared to when it’s closest: Given the enormous size differences we’re dealing with from this point on I’ll abandon the exact relative dimensions and instead use whatever size is convenient to demonstrate the discussed subject. Second Law of Kepler An important aspect of planetary motion are Kepler’s laws of which the second one describes the planet’s speed at different points on the orbit. In the demonstration below you can make the planet orbit the Sun. As Kepler has discovered, traversal of each of the arc of the pie-slice sections of the orbit takes the same amount of time: At the bottom part of the simulation you can see the flattened length of the arc the planet sweeps within the same amount of time. When the planet is closer to the Sun it travels a much longer path, that is it moves much faster than when it’s away from the Sun. Kepler’s second law says that the areas of the triangular pieces are the same, so naturally if the height of the triangle is made longer due to a larger distance to the Sun, the base, i.e. the arc swept, has to get shorter to maintain the same area. For the actual shape of Earth’s orbit the arc length differences are much smaller, but as we’ll discuss, they still impact some aspects of time tracking on Earth. Orbital Plane So far we’ve been looking at the orbit from above, but a tilted perspective shows that the orbit defines an infinite flat sheet known as the orbital plane. You may drag over the demonstration up and down to change the viewing angle: In fact, all planets in the Solar System have very similar orbital planes which is a consequence of formation of the planets from a protoplanetary disk. It’s worth pointing out that the plane represents a mean – Earth wobbles slightly up and down due to changes in position of the Moon, and, to a smaller extent, of other planets. At this point we’re still not ready to discuss how a year is measured, but understanding the Earth’s revolution around the Sun will actually help us describe the duration of a day, so let’s discuss the most tangible motion of our planet. Axial Rotation The Earth rotates around its axis from west to east, or, when seen from above, counter-clockwise. In the simulation below you can change the time of day by dragging the slider. The first important thing to observe is that the axis of rotation is not perpendicular to the orbital plane shown as a horizontal line. Currently the axis is tilted at roughly 23.437° away from the vertical: If you compare the position of the Earth at the beginning and at the end of a 24 hour cycle you may notice something surprising – the Earth has completed slightly more than one full rotation around its axis. In fact, a full 360° rotation takes 23 hours, 56 minutes, and little over 4 seconds, a period known as sidereal day. Notice that while the Earth is rotating around its axis, it’s also traveling along its orbit. In the demonstration below, which is very much not to scale, you can see how after one full rotation the point on the Earth that was pointing at the Sun no longer does so and it requires some more time for that location to face the Sun again: Out of all the stars in the sky the Sun is the one of paramount importance to our lives so the base measure of a day is the period after which the same point on Earth points at Sun again. To be more precise, we’re interested in the duration after which the Sun comes around to be directly above the same meridian – a half a circle on the surface of the Earth connecting the poles. This also brings us to the concept of solar noon, a time of day at which the Sun is located directly over some point at the local meridian. In the demonstration below that meridian is shown with a yellow color while the red dot shows the subsolar point – a location on Earth that points directly towards the Sun: Depending on one’s position on the Earth, during a local solar noon the subsolar point is either directly north, directly south, or directly at the current location. This is also where the terms AM and PM come from. In Latin ante meridiem means before midday, while post meridiem is after midday. Noon is the time of day at which the Sun is at the highest point in the sky which also means that the shadows cast by the sunlight are the shortest. Naturally, we don’t set our clocks to solar time. Instead, time zones are used to provide a more uniform timing within different regions of the world. Despite heavily irregular shapes the centers of the time zones correspond to roughly noon of local solar time. The duration between two solar noons is known as a solar day which lasts the familiar 24 hours. However, that’s not completely accurate. If you look closely at the simulation of the sidereal and solar day you’ll notice that we didn’t account for two important factors – eccentricity of the orbit and the axial tilt of the Earth. In fact, 24 hours is the duration of a mean solar day. The actual duration of each individual day varies, but before we witness that variation we have to discuss the most important consequence of the axial tilt. Axial Tilt If you were to look at the orbital plane from above you’d notice that the axial tilt of the Earth isn’t aligned to either the major or the minor axis of the orbit’s ellipse. In the simulation below you can observe the position of the Earth and its axis of rotation at different points of the year: The four colored line segments mark four important points on that path: during March equinox and September equinox in the top-down view the axis of rotation is perpendicular to the direction towards the Sun during June solstice and December solstice in the top-down view the axis of rotation is parallel to the direction towards the Sun Moreover, at different times of year either the Northern or the Southern Hemisphere is tilted towards the Sun which is clearly visible when we look at the orbital plane from a side with the point of September equinox pointing directly at us: The change in tilt relative to the Sun causes the familiar cycle of seasons. June solstice marks the time at which the Northern Hemisphere is maximally exposed to the Sun and the summer begins, however, at the same time the Southern Hemisphere is facing away from the Sun and in that part of the world the winter begins. The situation flips during December solstice. During equinoxes both hemispheres are equally exposed, the day and night last roughly 12 hours which gives the event its name – in Latin aequus nox means equal night. To see the seasons in practice, let’s look at the Earth from the Sun’s perspective. The horizontal line shows the orbital plane: Notice, that during summer on the Northern Hemisphere no matter what time of day it is the Sun never “sees” Antarctica – the Sun never rises there. Conversely, during winter on the Northern Hemisphere the Sun always sees that continent and so the Sun doesn’t set during the day. Being directly exposed to sunlight is only a part of the seasonal picture. Despite constant exposure to Sun during summer on the Southern Hemisphere Antarctica is still a very cold place. It’s the direction at which the sunrays hit the ground that determines the amount of power the surface is exposed to. In the demonstration below I marked three bands on the surface of the Earth – each one occupies 36° of latitude. The thin lines symbolize sunrays hitting the Earth. By changing the date you can observe how the percentage of all the rays approaching the planet is distributed among those bands: The more perpendicular to the rays the surface is, the more energy it receives – the factor scales with a cosine of the angle between the surface normal and the direction of the incoming light. During summer months the Northern Hemisphere receives a much higher percentage of incoming rays compared to winter months which explains the average temperature difference between the two seasons. Finally, it’s also interesting to see the sunlight from a reference frame fixed onto Earth. You can drag around to spin the globe freely in space. Yet again the red dot shows a location of the subsolar point: What may be a little surprising is that at a fixed time of day the point on Earth that points directly towards the Sun is quite wobbly when the date changes – it not only moves in north-south direction, but also in east-west direction. This effect is visible more clearly on a world map with an equirectangular projection: When seen from Earth this figure 8 shape is known as analemma. In the following demonstration you can see the position of the Sun in the sky as seen at 12:00 PM12:00 UTC from the Greenwich area in London. I chose this location since its mean solar time is pretty much the same as UTC time. The vertical lines represent angle of azimuth. The one corresponding to 180° is located directly south of the observer. The horizontal lines show angles of altitude – the angle above the horizon. In the bottom right corner you can see which part of the sky is the observer located at the black dot looking at: The Sun may seem tiny, but its angular diameter is only 0.53°, while the entire analemma spans 2 × 23.437° = 46.874° in the vertical direction. The Sun isn’t always at its highest point in the sky at 12:00 PM12:00 local mean solar time, sometimes it’s a bit ahead "
