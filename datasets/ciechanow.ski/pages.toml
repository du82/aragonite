title = "Curves and Surfaces – Bartosz Ciechanowski"
description = "Interactive article explaining how curves and surfaces are modeled."
full_description = "November 2, 2021 Curves and Surfaces From fonts to animated movies, curves and surfaces constitute fundamental building blocks of many geometrical designs. Over the course of this blog post I’ll explain how this model of a mask can be very smooth despite being described by a limited number of small points that you can drag around to change the mask’s shape: Moreover, we’ll see how surfaces like that are a natural extension of plain two dimensional curves like the one below: Throughout this article I’ll keep jumping back and forth between curves and surfaces to highlight how the ideas we develop for wiggly lines can be expanded onto three dimensional shells that we can shape. Defining the Shape Before we build complicated curves and surfaces we first have to decide how we’d like to control their shape. There are many ways to describe and mold these objects, but some of those ways are better than others. In the demonstration below I built a system that lets you change the shape of a curve by controlling its spiral‑ness and size: While fun to play with, this system is quite impractical. We can’t control where exactly the curve ends and we also have a very limited influence on how it twists. For instance, it’s impossible to create an S‑shaped curve using these controls. Ideally, we’d deal with a system that would let us directly affect where the curve is placed, while also providing a convenient control over its entire shape. These are the features that control points provide. Their visual placement makes it very easy to define the shape of a curve. In the demonstration below you can drag each control point shown as to change the curve’s form: Control points are often visualized with connecting lines that join them to their neighbors. This helps to avoid ambiguities when two different points swap their positions which can make the curve look quite different. Notice that all control points seem to affect the shape of the curve in the point’s vicinity. We can visualize the impact of a given point using red color. In the demonstration below you can tapclick a control point to see how it affects the local shape – the redder the section of the curve the more influenced it is by that control point. Gray sections don’t move at all when the selected point is dragged: With control points we can easily change where the curve starts, ends, and how it flows in the middle. Moreover, the shape of the lines connecting the control points roughly resembles the shape of the resulting curve. This system of control points is simple, yet very powerful. So far I’ve been quite vague about the rules driving the shape of the resulting curve and the extent to which the control points affect it. I’ll try to explain those underlying principles by building this system from a ground up. We’ll also see how those ideas extend to surfaces, but before we construct these more complex elements we’ll start with the simplest curve – a linear segment. Linear Segment In the demonstration below you can drag the control points A and B around to change their position. The slider controls a virtual red pen that is used to draw a segment between those two points: While this demo is the world’s most primitive drawing application, there are some important observations we can make here already. The slider controls the progress of our drawing – the more advanced the slider is the further into drawing we are. For the progress of 0.5 we’re halfway through a drawing, and at the progress of 0.9 we’re mostly done. Additionally, a point on the segment very close to point B, as shown by the tip of the pen, moves very little when point A is dragged, but it moves a lot when point B is dragged. We can visualize the “weight” of a given control point on the curve using the red tinting we’ve seen before. You can tapclick the control points to change which one is selected: For a linear segment like that, weighting function is quite straightforward. The closer to the control point we are the more impactful it is. Let’s try to put some numbers behind these dependencies. There are many ways to specify the impact of a control point at a distance, but the simplest approach is to assume that those weights are changing proportionally with that distance. As we progress through the curve using the slider we decrease the weight of the point A and increase the weight of the point B: This hopefully makes intuitive sense. When we’re all the way through the curve the weight of the point A is 0 and we can move it around all we want without affecting the position of the end of the curve. We can describe those little plots using some equations. A word “progress” would make the formulas very long so I’ll replace it with the traditionally used letter t: t = progress The position of any point P on the linear segment for given progress t is: P = A × (1 − t) + B × t We’ll see those (1 − t) and t terms a lot, so to make them easier to distinguish I’ll mark them and I’ll put little triangles on their right sides to quickly visualize if that section goes up or down with the progress – those triangles match the shapes of the plots we’ve just seen: P = A × + B × This equation describes linear interpolation and it will be very important in our further discussions. We can indeed verify that e.g. plugging progress t equal to 1 simply returns the point B. It may not be immediately clear what it means to multiply a point by a number so let’s explore that a little. Ultimately, each point has x and y coordinates that define its position relative to some origin: When we multiply a point by some number we’re actually individually multiplying its x and y coordinates: Px = Ax×+Bx× Py = Ay×+By× We can see that process in a visual form by tracking the coordinates of all three points as the progress changes: Px = Ax × (1.00 − t )+ Bx × t = Py = Ay × (1.00 − t )+ By × t = The entire linear segment itself is ultimately created by infinitely many points constructed from all possible values of t between 0 and 1. A Step Further So far we’ve been dealing with flat 2D segments, but nothing prevents us from doing the same operations in a three dimensional space. In the demonstration below you can control the position of points A and B in a 3D space by dragging them around. You can also change the viewing angle by dragging anywhere else. The slider controls a virtual pen that paints a linear segment: By dragging that point through space we’ve created a simple linear segment placed in three dimensions. However, now we can go a step further by dragging that segment through space to create a red surface: The surface we’ve just made is fairly arbitrary and not very well defined, but the concept is very promising, so let’s try to create a simple surface that we can easily control. The idea is simple – we can place two linear segments in space that will form rails on which another dragged segment slides: Notice that in many configurations the dragged segment will change its length as it goes, but that is actually beneficial – it lets us create more varied shapes. It’s important to note that we move along the side segments proportionally – when we’re halfway through dragging we’re also halfway through the lengths of the rails, even if the rails themselves have different lengths. You can think of the blue rails as a sort of interconnected sliders. Let’s not forget that the segment we’re dragging is itself made by dragging a point between the segment’s endpoints, so the entire surface consists of points made from all possible values of two different progresses, one along the rails and another along the dragged segment: The sliders, and thus the progresses, are independent of each other, so we can think of the choice they offer as a 1×1 square: One slider controls the progress t of the dragged segment and the other slider controls the progress s within that segment. That arrangement of sliders is a bit cumbersome, so I’ll just keep both of them in a horizontal orientation. I’ll occasionally put a smaller version of this square in the bottom left corner of a demonstration – it will make it easier to analyze how the sliders control the placement of a point on the surface: It may also be useful to see how different arrangements of the control points deform that input square in the 3D space. As you deform the surface the lines remain straight, but the distances between them may change: Let’s try to express what we’ve built so far in a mathematical manner. Let me show the initial demonstration with different points labeled to makes things easier to reference: The end points P0 and P1 of the dragged segment are just interpolated end points of the rails AC and BD: P0 = A × + C × P1 = B × + D × Then the position of the point within the segment is just another linear interpolation: P = P0 × + P1 × After plugging the values we can indeed confirm that the final position of a point P on this surface depends on two parameters s and t: P = (A×+C×)×+ (B×+D×)× Which we can expand to see the functions driving each point: P = A××+ B××+ C××+ D×× The terms next to the control points may seem a little complicated, but in fact they’re fairly simple once represented visually. They are the 2D equivalents of the 1D weighting functions we’ve already seen. I’m once again using redness and height to visualize how impactful that control point is on different areas of the surface: Notice that the weighting functions are symmetrical to each other. As a result, we can create the very same surface by choosing to drag either the yellow or the blue segment through space – they both end up tracing the same surface: While we’re effectively just dragging a straight stick through the air, the surface it creates, known as a hyperbolic paraboloid, at some viewing angles doesn’t look straight at all – there are some curvy shapes to be found on this surface. In general case any point sliding on the surface traces some sort of curve through space. However, a particularly interesting curve appears when a point moves across the diagonal of the input square region – we can easily show the trajectory of that point by locking the two sliders together: Notice that while the point always follows the same straight linear path on the input square, for many configurations the path traced on the surface forms a non‑straight curve. Let’s try to write the equation of that curve. To recap, any point on the surface we’ve looked at can be described using the following equations: P = A××+ B××+ C××+ D×× However, because the sliders are locked together, s and t are the same so we obtain: P = A××+ B××+ C××+ D×× Notice that both B and C points have the same weights so we can tie them together: P = A××+ (B + C)××+ D×× We can simplify things even further if we make points B and C overlap each other. Observe that this makes the entire surface flat and the curve gets nicely isolated: Since points B and C are the same, this gives us the final simplified form: P = 1×A××+ 2×B××+ 1×D×× Note that we’re dealing with just three points so from now on I’ll call the third point C instead of D. The curve we’ve built is known as a quadratic Bézier curve. Here it is being drawn in just two dimensions: I think it’s very gratifying that we’ve found this smooth curve hiding on the surface obtained by dragging a straight segment through space. Let’s look at how much each point affects the shape of the curve as we advance through it. You can tapclick a control point to select it: There are a few interesting observations to be made here: When the progress is equal to 0 the weight function of control point A reaches 1 and all the other disappear, so the curve is guaranteed to start at point A Similarly, when the progress is equal to 1 the weight function of control point C reaches 1 and all the other disappear, so the curve is guaranteed to end at point C When progress is between those two extrema the position of the points on the curve is affected by all 3 control points It’s also worth pointing out that the “speed” of travel along the curve is no longer constant like it was for a linear segment. We can visualize how uniform steps of progress map to the curve points: For some configurations when the slider is halfway along the progress, the curve is definitely not halfway drawn. In some applications, e.g. when an object is expected to move along a curve with constant velocity, that discrepancy between the “input” progress and actual progress of distance along the curve may be very important, but for our visual use cases it won’t matter. Quadratic Bézier curves are unfortunately fairly limited. For instance, it’s impossible to express any sort of loop with a plain curve like that. To get better control over the shape of the curve we need to somehow introduce additional control points that would give us finer tunability of the curve’s form. Looking at the equations and weighting functions it may be a bit hard to figure out how we could generalize the curve to introduce more points. Let’s look the at that equation again: P = 1×A××+ 2×B××+ 1×C×× We can split the doubled B part and rearrange things a little to get: P = (A×+B×)×+ (B×+C×)× It may seem that we only made things worse, but in fact we simplified things greatly. Notice that the values in the parentheses are just linear interpolations between points A and B as well as B and C. We can call these new points AB and BC: AB = A×+B× BC = B×+C× And then the final point P is just a linear interpolation of the two: P = AB×+BC× Let’s look at what we’ve derived using some visuals: We essentially interpolate points on the edges that we have, to create a new edge on which we then interpolate again to get the point on the curve. Now, if we introduce another control point we can just repeat this idea by doing repeated interpolations. Notice that at every step we have one fewer point and one fewer edge: This curve is known as a cubic Bézier curve. If we tally up all the interpolations we do we end up with the following compact form: P = 1×A×××+ 3×B×××+ 3×C×××+ 1×D××× Observe how (1 − t) sections convert to t sections for the subsequent points. All those multiplications of triangular functions end up creating the following set of weights for the control points: The ideas behind two dimensional cubic Bézier curves naturally extend to the third dimension – the curve can twist and turn as it goes through space: We’re not just here to talk about curves, so let’s try to see how we can extend Bézier curves into surfaces. Bézier Patches When we were creating a simple surface we were sliding a straight segment along some other two linear segments. We can expand this idea to slide a straight segment along two cubic Bézier curves: While the surface itself is now more varied on the purple edges, it’s hard to hide the straightness of the yellow segment. To make things more varied we could replace that segment with a single cubic Bézier curve that we would stretch as we go, but by building up on t"
