title = "Naval Architecture – Bartosz Ciechanowski"
description = "Interactive article explaining how ships float and maintain their stability."
full_description = "July 27, 2021 Naval ArchitectureWhen I first heard the term naval architecture I thought it was the artistic practice of designing beautiful boats. It turns out it’s a proper scientific discipline dedicated to the engineering of ships. Over the course of this article we’ll go over different aspects of naval architecture. I’ll explain how ships are propelled, what makes them stay afloat, and how they’re carefully designed to not tip over even in dynamic conditions: To understand why a ship rocks side-to-side in the wavy ocean waters, we first have to understand that it’s water itself that’s responsible for all of the ship’s behaviors. We’ll start with a simple device – a water-filled syringe. Pressure You’ve probably seen a syringe before. When its plunger is pressed, the contents of the syringe come out on the other end. In the demonstration below we have a syringe connected through a thin hose to another container that has a spring in it. The entire system is filled with water. As you increase the force on the plunger observe the little spring being compressed at the other end of the hose: By applying force on the plunger we increase the pressure in the fluid, which in turn pushes the little piston and compresses the spring. We can measure that pressure using a pressure gauge. In the demonstration below the sliders allow you to control the applied force and the area of the plunger: Observe that the pressure P on the gauge is proportional to the perpendicular input force F, but it’s inversely proportional to the area A. We can tie these three values using the following equation: P = F / A In metric system pressure is expressed in pascals (Pa) named after Blaise Pascal, while in the imperial system pounds per square inch (psi) are commonly used. Notice that we no longer have any spring to compress. Even though we’re applying a force the plunger doesn’t move since water, unlike air, is minimally compressible. It’s easy to squeeze an empty, tightly screwed plastic bottle, but when filled to the brim with water the bottle won’t budge much. At the pressures we’re applying here, water practically doesn’t change its volume. With a syringe, we’ve directly applied a force by pushing on the plunger, however, we could recreate that experiment by putting a heavy, tightly fitting weight on top of water in a container. In the demonstration below you can control how heavy the weight is to see how it affects the pressure read by the gauge: Note that even when we remove the weight the pressure meter shows a non-zero read. The water itself also has weight so its mass above the point of measurement contributes to the readout as well. Let’s try to quantify the force exerted by the water. Firstly, notice that the shape of the water above the measurement forms a cylinder with height h and a base surface area A: The mass m of that cylinder of water is just its volume V times the density ρ of the contained water: m = ρ × V That highlighted volume V, however, can also be expressed as the area of the base A times the height h which we can plug into the equation for mass m: m = ρ × A × h The force of gravity F acting on that water is equal to its mass m times the gravitational acceleration g: F = m × g If we now plug all these values to the equation for pressure P = F / A we get: P = ρ × A × h × g / A Which we can simplify by reducing the area A to obtain the final equation for pressure P of liquid with density ρ at a depth h under surface: P = ρ × h × g Note that the resulting pressure P is independent of the base area, it’s only affected by the height h and density ρ of the water above: In general the density ρ of water is not constant and depends on temperature and salinity, but at the scales we’re interested in we can assume its value doesn’t change. If you recall our first demonstration of a loaded syringe, you may remember that the pressure applied to the plunger “travelled” through the hose to act on a spring, which was quite distant from the syringe itself. The very same rules apply here. Observe the pressure shown by the gauge two different spots of this L-shaped container: The right gauge always shows the same pressure even though in some cases there is less water “directly” above it. This may seem a little surprising, but you’d probably agree that if we removed the green plug from the filled container, the water would come out of the opening because of non-zero pressure in that area. That behavior of pressure in incompressible fluids is known as Pascal’s law. It states that pressure applied to any part of the liquid will be transmitted in all directions. As a result, the pressure in a connected body of water is the same at every level under the free surface. It’s worth stressing that in these static cases the pressure at a given level depends purely on the height of the body of water. This may have some unexpected consequences. For example, pressure at the bottom of these two containers is exactly the same: Note how much less water there is in a thin straw compared to the wide container. This scenario is known as Pascal’s barrel. By making the straw longer and filling it with water we can make the pressure inside the barrel arbitrarily large, causing it to explode. While Pascal himself possibly never performed that experiment, some modern recreations have been successful. Buoyancy On its own pressure doesn’t have any direction – it’s a scalar value, just like temperature is. However, the force exerted by pressure acts in the normal, that is locally perpendicular, direction to the surface of the object. We can visualize the local forces created by the pressure with small arrows: In fact, these forces act not only on the container itself, but also on any object placed in the water as well. In the demonstration below a red brick is hanging on a string. You can dunk it into water using the slider: From this point on I’ll remove the constraints of containers and we’ll instead move outdoors where we’ll submerge things into vast, peaceful ocean waters. In this new environment the rules of pressure remain the same – after all, we’re still dealing with water. The brick is now hanging on a string that is attached to a scale, which we’ll lower. Notice that as a larger part of the brick gets underwater, the weight shown by the scale decreases: While the horizontal arrows of water pressure forces balance each other, the vertical ones don’t, and the pressure exerts a net positive force that pushes up on the brick. All the small arrows add up to the cumulative force known as buoyancy. In this example buoyancy is not strong enough to completely overcome the force of gravity acting on the brick, but it manages to diminish it to some extent, which reduces the weight as measured by the scale: Note that for the sake of clarity, I shifted the arrows apart a little, but in this simple scenario buoyancy and gravity are actually positioned on the same vertical line. If we use a wooden block instead of a brick, the situation changes a bit. As the block gets gently lowered, it will reach a point where the water is capable of keeping it on the surface and the string gets some slack: If we remove the string and manually push a wooden block underwater, the force of buoyancy will become higher than the block’s weight. When we let go of the block, the water will push it up: Once the block gains some speed it may even overshoot its steady position, only to get pulled down by gravity again. After a while the water resistance slows the oscillating movement enough for the block to find its steady balance. Let’s try to quantify the force of buoyancy as created by the pressure. Naturally, the forces here are three dimensional, however, observe that all the horizontal components are matched on the opposite side and they cancel each other out. Only the pressure forces on top and bottom are unbalanced. You can drag the block around to see all the pressure forces acting on it: The pressure PT on top of the brick acting on the top surface area A exerts the force FT equal to: FT = PT × A = ρ × g × hT × A Similarly, the resulting force FB acting from the bottom is: FB = PB × A = ρ × g × hB × A And the net force of buoyancy F in the upwards direction is the difference of the two: F = FB − FT = ρ × g × (hB − hT) × A Notice however, that the highlighted difference is just the height of the submerged part: F = ρ × g × h × A And the product of height h and the base area A is volume V of the submerged object, which gives us the equation that ties the force of buoyancy to the displaced volume V of fluid with density ρ: F = ρ × g × V Displaced volume is the volume of fluid that would normally occupy a space that is now filled by the object. We can also observe that density ρ times volume V is just mass m: F = m × g This is force is just the weight of the displaced fluid. This general rule, known as Archimedes' principle, states that the force of buoyancy is equal to the weight of the fluid that the object has displaced. Note that buoyancy does not depend on the weight of the object itself, it’s only affected by the submerged volume of that object. You may wonder if the same rule holds for an arbitrary shape. After all, I’ve conveniently used a plain wooden block to simplify the volume and force calculations. However, we can use the same method even for smooth shapes by subdividing them into arbitrarily small rectangular prisms. In the following demonstration you can use smaller and smaller prisms to approximate the shape of a sphere. For the sake of clarity, I’m only coloring the top and bottom surfaces. You can drag the simulation around to see it from different angles: Notice how quickly a group of blocks starts to resemble the smooth shape of the sphere. Now that we know that the force of buoyancy depends on the submerged volume we can also analyze what happens when the wooden block is forcefully tilted: The local forces exerted by pressure are no longer symmetrical so they end up having an uneven effect on the body. At a first glance it may be hard to figure out what the cumulative effect of all those small arrows is. However, just like we can simplify the weight of all particles constituting an object to a single gravity force acting on its center of gravity, we can also simplify the local forces of pressure acting on the surface of an object to a single buoyancy force acting through a center of buoyancy, which I’ve visualized using a small blue circle: As it turns out, the center of buoyancy is just the center of gravity of the displaced water. Note that the force of buoyancy may not be aligned with the force of gravity of the object. That misalignment of forces will create torque causing the object to rotate until it finds its equilibrium, which happens when the forces of gravity and buoyancy are aligned. Hull In some sense, the floating block of wood we’ve seen so far forms a very simple ship – a raft. It’s not a very practical vessel, as it has small cargo carrying capacity. We also want to make sure that a ship can withhold the elements, so ideally we’d use more robust materials. A solid block of steel won’t float on its own because its weight is much larger than the force of buoyancy acting in it. However, if we hollow out the inside of the block we’ll significantly reduce its mass while maintaining the volume: What we see here is a very simple hull – the main body of a ship. This tub-like body is now capable of floating, despite being made from steel. Note that this ship behaves very similarly to the wooden block: This is ultimately how a ship floats. The weight of water it can displace is larger than the weight of the ship itself causing gravity and buoyancy to balance each other. While this hull shape is used on barges, the hull of a typical modern ship looks more like the one in demonstration below. You can drag it around to change the point of view: This hull is covered with a deck, but some smaller boats may have an open top. The front part of the ship is called a bow. This hull has a bulbous bow which is the “nose” in the front bottom part – for larger ships it improves the flow around the ship, reducing drag. The back of the ship is called a stern. The left and right side of a ship are respectively called port and starboard. The fin-like object in the back called a rudder is used to steer the ship. The fan-like device next to it is a screw propeller, which, when rotated by an engine, pushes the ship forward. Most ships have a streamlined shape, which reduces the resistance of motion when sailing as the bow can part water more easily. Other than drag considerations, it may seem that the shape of the hull can be more or less arbitrary. However, naval architects have to consider another very important factor – the stability of the ship. Stability So far all of the bricks and wooden blocks have been floating in pristine conditions, but in practice open waters are very rarely perfectly calm. Disturbances caused by waves and wind will usually rock the hull from side to side a little: If you look at the ship from the front, you can see the so called angle of heel, which defines how far a vessel is tilted away from vertical. This front view will be very important for our considerations. Firstly, let’s see how the proportions of the hull affect the behavior of the ship when external forces are applied. In the demonstration below, the first slider controls the wind, which will tilt the ship one way or another. The second slider changes the proportions of the hull: For relatively wider shapes the ship tilts a little due to wind, but it finds its stable position and will return back to vertical when the wind stops. For more vertical shapes, however, the ship will tilt and capsize even when the wind stops. For most ships this is a catastrophic condition. To understand what’s going on, we need to look how the force of gravity and buoyancy act on a tilted hull. As we’ve seen before, when the ship is tilted the two forces are separated by a certain distance shown below in white: That white line is the righting arm, which is the horizontal distance between the two forces. The force of buoyancy acting through this arm exerts a rotating torque on the ship. The curly arrow at the top shows the direction of the turn. For a short and wide cross section of the hull, the force of buoyancy acts against the tilt of the ship, helping to straighten it up. For a more vertical shape, however, the buoyancy acts with the tilt of the ship, causing it to rotate even further! We can visualize the length of the righting arm for different heel angles of the hull using the following plot. When the angle of heel is in the green zone, buoyancy helps the straighten the ship. However, if the ship’s angle is in the red zone, buoyancy tries to heel the ship even more: Some hull shapes are inherently unstable. The slightest deviation from pristine vertical balance will make the ship flip. However, even "
