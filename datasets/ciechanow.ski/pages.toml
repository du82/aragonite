ontents of _list ivar (0x1d1038) into x9 register: 0xc320 adrp x9, #0x1d1000 0xc324 ldrsw x9, [x9, #0x38] 0xc328 ldr x9, [x0, x9] At this moment the x9 points to the beginning of memory segment containing the data. Finally, shift the value of fetch index stored in x8 to the left by 3 bits, add it to the x9 and put the contents of memory at that location into x0: 0xc32c ldr x0, [x9, x8, lsl #3] Two things are important here. First of all, every data offset is in bytes. Shifting a value to the left by 3 is equivalent to multiplying it by 8, which is the size of a pointer on a 64-bit architecture. Secondly, the results goes into x0 which is the register which stores the return value of a function returning NSUInteger. At this point we are done. We have fetched the correct value stored in array. Function Epilog There rest are some boilerplate operations that restore the state of registers and stack pointer before the call. We’re reversing the function’s prologue and returning: 0xc330 mov sp, x29 0xc334 ldp x29, x30, [sp], #0x10 0xc338 ret Putting it all together I explained what the code does, but the question we will now answer is why? The Meaning of ivars Let’s do a quick summary of what each ivar means: _used is count _list is a pointer to the buffer _size is size of the buffer _offset is an index of the first element of the array stored in the buffer The C code With ivars in mind and the disassembly analyzed we now can write an equivalent Objective-C code that performs the very same actions: - (id)objectAtIndex:(NSUInteger)index { if (_used <= index) { goto ThrowException; } NSUInteger fetchOffset = _offset + index; NSUInteger realOffset = fetchOffset - (_size > fetchOffset ? 0 : _size); return _list[realOffset]; ThrowException: // exception throwing code } Assembly was definitely much more long-winded. Memory Layout The most crucial part is deciding whether the realOffset should be equal to fetchOffset (subtracting zero) or fetchOffset minus _size. Since staring at dry code doesn’t necessarily paint the perfect picture, let’s consider two examples of how object fetching works. _size > fetchOffset In this example, the offset is relatively low: A simple example To fetch object at index 0 we calculate the fetchOffset as 3 + 0. Since _size is larger than fetchOffset the realOffset is equal to 3 as well. The code returns value of _list[3]. Fetching object at index 4 makes fetchOffset equal to 3 + 4 and the code returns _list[7]. _size <= fetchOffset What happens when offset is large? A more difficult example Fetching object at index 0 makes fetchOffset equal to 7 + 0 and the call returns _list[7] as expected. However, fetching object at index 4 makes fetchOffset equal to 7 + 4 = 11, which is larger than _size. Obtaining realOffset requires subtracting _size value from fetchOffset which makes it 11 - 10 = 1 and the method returns _list[1]. We’re essentially doing modulo arithmetic, circling back to the other end of the buffer when crossing the buffer boundary. Data Structu'''
