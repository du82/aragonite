title = "Gears – Bartosz Ciechanowski"
description = "Interactive article explaining how mechanical gears work."
full_description = "February 12, 2020 Gears I’ve always been fascinated by mechanical gears. There is something captivating about the way their teeth come together to create a fluid, unified motion: In this blog post I’d like to look at these simple machines up close. I’ll explain how gears affect the properties of rotational motion and how the shape of their teeth is way more sophisticated than it may initially seem. Movement is important in this article so most of the visualizations are animated – you can play and pause them by clickingtapping on the button in their bottom left corner. By default the animations are enabled, but if you find them distracting, or you want to save power, you can globally pause all animations, just make sure to unpause them as needed.disabled, but if you’d prefer to have things moving as you read you can globally unpause them and see all the objects in their rotating glory. Spinning On a hot summer day you might have enjoyed a cool breeze from a desk fan. Let’s take a closer look at this device. In the demonstration below you can control the fan’s speed using a slider: The speed of a rotating fan is a different kind of speed than that of a car – it describes how quickly a fan rotates. To distinguish that rotating movement from a simple linear motion we use the term angular velocity. Angular velocity describes how quickly an object rotates relative to some point. For mechanical devices like fans that point often corresponds to the center of a shaft on which the spinning part is mounted. Angular velocity can be expressed in many units. In physics and math the most popular ones are degrees per second (°/s) and radians per second (rad/s) – they express the change in object’s angle of rotation per unit of time: In engineering it’s more common to use the unit of revolutions per minute or rpm for short. Older spinning hard drives rotated at 5,400 rpm while an internal combustion engine of an idling car may keep running at around 800 rpm. Almost by definition, the second hand of a clock rotates at 1 rpm. All of °/s, rad/s, and rpm are equivalent – they’re just one multiplication by a constant factor away from each other. Given the engineering nature of this article I’ll stick to rpm, but I’ll often skip the units completely since they won’t be essential. Disc Propeller-like shapes are exciting to look at, but they obscure some basic features of the rotational motion that we’ll explore. Over the next few paragraphs we’ll look at a more basic shape – a disc attached to a shaft. In the demonstration below you can control its angular velocity with a slider: The small triangular indicator is there to help visualize the current orientation of the disc. I’ve also painted six points on its surface. You may have already noticed that some of those points move more than the others even though the entire disc has the same angular velocity. Let’s investigate what’s going on by controlling the time back and forth with a slider. As the disc rotates the points leave a trace of the path they followed: At the bottom part of the simulation you can see the flattened arcs of the paths traced by the six points. Notably, as the disc rotates the distances traveled by the points further away from the center are larger than those of the points closer to the center. Coincidentally, the triangular pattern of the flattened out arcs is also a simple way to derive the area of a circle. All paths are traversed in the same amount of time, but their lengths differ signaling that the points have different velocity. Notice that we’re talking about a different kind of velocity now. The disc and all the points on it have the same angular velocity, but different points at different radii have different linear velocities. In the demonstration below you can observe how the arrows, which represent the linear velocities of the six points, change depending on the disc’s angular velocity and the points' distances from the center: The instantaneous linear velocity v of a point on a rotating object depends on the distance r to the center of rotation and the angular velocity ω: v = ω · r A linear velocity of a point rotating around the center of rotation is perpendicular to the direction towards the center. As a side note, observe that while the linear velocity vector constantly changes its direction due to centripetal acceleration, its magnitude remains the same. Transmission So far we’ve been looking at just a single rotating disc, but let’s try to complicate things a little by adding a second disc to our setup. I’ll place it so that the side surfaces of the discs are pressing against each other. In the demonstration below the driving yellow disc is powered by some engine, which I’ve indicated using a rotating arrow near the shaft. You can observe what happens to the green disc that isn’t powered by anything: The two discs aren’t perfectly slick, their surfaces have some roughness to them which creates friction when the sides touch. That friction at the contact point between two discs is making them temporarily stick to each other. This causes the right circle to be “dragged” along for the ride. At some point the curvature of the discs pulls the connection apart, but as that happens new points on the surfaces of the discs are coming into contact again. Observe how the two discs rotate in different directions – as one turns clockwise the other one rotates counterclockwise. Moreover, due to sticking at the point of contact the velocities of the side surfaces of both discs are the same. All the points on those sides trace the same arcs in the same period of time. In that simple scenario as the driving disc completed a full turn, so did the driven disc. Things become more interesting when the discs have different radii. Let’s look at the paths that two points on the surfaces of these discs trace: Since the linear velocities of the points are the same, the paths end up having the same length. However, this causes the bigger disc to rotate by fewer degrees since its circumference is larger. In this configuration, when a small disc does a full turn the big one does half a turn. The angular velocity of the right disc is smaller. We can reach the same conclusion by looking at the velocity of the “sticking” point. The linear velocity vin as seen by the input disc is: vin = ωin · rin While the linear velocity vout of the output disc is: vout = ωout · rout Since these velocities are the same we can simply equate them: ωin · rin = ωout · rout To finally derive that the angular velocity of the output disc is proportional to the angular velocity of the input disc: ωout = ωin · rin / rout The smaller the input disc, the smaller the output angular velocity, and the smaller the output disc, the larger its angular velocity. In the demonstration below the left driving disc always rotates with the same angular velocity, but the angular velocity of the right disc is affected by the ratio of radii of the two wheels: The speed of the driven green disc can change quite drastically depending on the ratio of the radii. We’ve devised a very simple mechanism that allows us to modify the angular velocity from one shaft to another. However, it’s not all this contraption is doing. Torque The next time you tighten a nut with a wrench try to see how the force needed to move it depends on the point at which you apply the force. The demonstration below shows roughly how big of a force would be needed: The further away from the nut you press the lesser the force needed and the easier it becomes to tighten the nut. If you don’t have a wrench and a nut handy, you can try to open a door by pressing it very close to the hinge. It’s much harder to do compared to pushing the door near the handle – the capability to turn is much smaller. This turning effect of a force is called torque and it depends on both the applied force F and the length of the lever arm r: T = r · Ft Notice the little t subscript next to the force – it represents the tangential component of the force. In the demonstration below you can control the angle of the applied gray force, however, only the red tangential component that is perpendicular to the arm ends up counting towards the torque: Notice how the magnitude of torque increases and decreases as the force rotates. When the force starts pushing the wrench in the opposite direction the torque changes sign because it also changes the clockwiseness of the rotation of the wrench. The alternative way to look at the tangential component is to find a circle that is tangent to the line of force and use its radius rt as the basis for the torque calculation: As such, torque can also be expressed using this form: T = rt · F Both approaches to look at this problem are equivalent as they ultimately end up being described by the same equation in which α represents the angle between the force and the arm: T = r · F · sin(α) So far we’ve discussed how a force acting on a perpendicular arm creates a torque. However, if a torque is already present on a shaft, e.g. exerted by an engine or a crank, then that torque will apply a force at a distance. In the demonstration below a disc has a spool attached to it on which a rope is wound. The disc has a constant input torque, but as the radius of the spool changes so does the force with which the rope is pulled: When two friction discs are working together the driving one drags the driven one with some force, so let’s see how the torque is affected by the interaction between two discs. A torque Tin on an input shaft causes the disc to exert force F at a distance rin: F = Tin / rin That very same force acts on the output disc at a distance rout: F = Tout / rout We can equate the two: Tin / rin = Tout / rout To finally derive that the output torque is proportional to the input torque: Tout = Tin · rout / rin Let’s compare the equation for the output torque with the equation for the output angular velocity: ωout = ωin · rin / rout Notice that the ratios of the radii are inverted. We can now see how the torque and angular velocity are affected in an actual disc setup. In the simulation below you can control the ratio of radii of the two discs. The right disc has a spool with a rope attached to it. Since the spool is attached to the disc the torque and the angular velocity are transferred directly to it: Notice that when the yellow driving gear gets smaller the torque on the output disc increases and as a result so does the force with which the rope is pulled. On the other hand, as the driven gear gets smaller its angular velocity increases and so does the linear velocity of the rope. By using two discs of different radii we can use a single engine to drive the input and have vastly different outcomes at the output. Depending on the use case we may want to sacrifice some speed to be able to pull the rope with a lot of force, or prioritize the output velocity at the cost of a weaker pulling capability. Gears The friction discs systems we played with so far work perfectly in idealized scenarios, but in practice they’re quite flawed. As soon as the two discs are not in a close contact due to vibration, wear on the touching surfaces, or even manufacturing imprecision, they’ll start slipping. The assumption about the sticking contact point breaks and the mechanism no longer transfers angular velocity and torque as needed: This problem can be solved by ensuring that the driving wheel physically pushes the driven wheel. This is where gears come in. Because the teeth of two meshed gears are interlocked with each other, the driving gear ends up pressing directly against the driven gear: Let’s look at an example of two gears of different sizes meshing with each other. Naturally, for two gears to be compatible their teeth have to be of the same size – the distance between two subsequent teeth known as circular pitch has to be the same. In the demonstration below each gear has its circular pitches marked with short arc segments. Notice down below that those arcs flattened out have the same length: A full circular set of colorful segments forms a so-called pitch circle. A pitch circle represents an idealized circle that is in contact with the other gear’s pitch circle. They both correspond to the simple friction-based disc systems we’ve already discussed. Pitch circles let us look past the complexity of the interlocking gears by reducing their form to the familiar teethless discs on which we can used the radius-based equations. However, using the size of gear’s radii or diameter is cumbersome, especially since the pitch circle isn’t visible. In practice, it’s more common to refer to gears by using their number of teeth N and the size of those teeth. In the United States the term diametral pitch is used to define the teeth size, it is obtained by dividing the number of teeth N by the diameter d of the pitch circle. diametral pitch = N / d In other countries a similar, but inverted ratio called module is used instead: module = d / N Both diametral pitch and module effectively define the size of the teeth. Since those parameters in the two matching gears have to be the same we can equate them: Nin / din = Nout / dout With just a simple transformation we can derive that the ratio of the number of teeth is equivalent to the ratio of the diameters, or the radii, of the pitch circles: Nin / Nout = din / dout = rin / rout As a result we can talk about a transmission system using number of teeth on the meshing gears instead of specifying their diameters or radii: Tout = Tin · Nout / Nin ωout = ωin · Nin / Nout In the demonstration below you can adjust the diametral pitch, i.e. the size of the teeth of the two meshed gears to see that the constant ratio of the numbers of teeth indeed maintains the constant ratio of angular velocity: Tangent & Normal So far I’ve conveniently avoided describing the details of the shape of the teeth of a gear, but it’s actually one of the most important aspects of a gear system. Before we take a closer look at the profile of a tooth we have to discuss the concept of a tangent to a curve. A tangent can be described in a few different ways, but one of the most intuitive ones is to imagine three beads sliding on said curve. The red bead symbolizes a point on the curve at which we want to find the tangency. The two blue beads neighbor the red bead at its sides: As the blue beads get closer and closer to the red bead, the line spanned through their centers approaches the line of tangency at that red point. The tangent line shows the local “straight ahead” direction on the curve. In the limit, the imaginary beads completely overlap and the tangent locally touches the curve at just a single point which explains the origin of the word – in Latin tangere means “to touch”. A closely related concept to a tangent line is a normal line which is perpendicular to the tangent at that point. In the demonstration below you can see the dotted normal and the so"
