title = "Lights and Shadows – Bartosz Ciechanowski"
description = "Interactive article explaining how lights and shadows behave."
full_description = "July 1, 2020 Lights and ShadowsIt’s hard to describe how paramount light is. Ultimately, it is the only thing we see. But just as important the presence of light is, so is its absence. To talk about light we have to start in darkness so let’s jump straight into it. Light is a visible portion of electromagnetic radiation, but in this article I’m not going to discuss any of the underlying details like wave-particle duality. Instead, I’ll try to explain how light creates so many beautiful effects seen in everyday life. In the demonstration below you can use the sliders to control the position and size of a rectangular light source. You can also drag around the scene to see it from different angles: By the end of this article the effects of light in this demonstration should become more clear, but before we get there we have to take a few steps back and start with a much simpler setup. Power Let’s begin by introducing a single spherical light source. While this ball of light is not very exciting, you can at least control its brightness with the slider below: What this slider actually regulates is the power of the light source – the amount of energy emitted from it per second. That energy comes out in a form of photons which we can crudely represent with rays of light coming out of the source. The higher the power the more rays emitted from the source in a unit of time: Unfortunately, this demonstration is quite limited. The number of photons per second emitted by even a simple light bulb is absolutely enormous and there is no fixed set of directions in which they travel. Having said that, the ray analogy will be useful for explaining quite a few phenomena, so despite its flaws, it will serve us as a valuable tool. The power of a light source is measured using the unit of watts W. Let’s see how we perceive the brightness of some source depending on its power: Notice that relative change in the perceived brightness strongly depends on the position of the slider. A change from 5 W to 10 W is much more perceptible than a change from 85 W to 90 W. The human visual system has a non-linear response to the power of the incoming light, so a fixed increase in power will not have a fixed increase in perceived brightness. Additionally, the brightness of the light itself quickly saturates to pure white. We hit the limit of what’s easily presentable with web technologies. There are ways to mitigate that problem, but in this article I want to present unmodified levels of brightness as this makes relative comparisons possible. Despite the white saturation, once we put a matte surface next to a bright light we can easily observe the effects of the increased power. You can drag around the demo to see the scene from a different point of view: While on its own the surface doesn’t emit any light, it reflects the light emitted from the source. Some part of that reflected light goes straight to our eyes allowing us to see the object. Naturally, the other side of the surface is pitch black – no light gets to it since it’s blocked by the front side. It may seem trivial to mention these concepts, but reflected and blocked light will end up defining almost everything I’ll discuss in this article. Position If you looked closely at the previous simulation you may have noticed that the surface wasn’t uniformly lit. Let’s investigate that variation in shading by moving the light around. In the demonstration below you can control its altitude angle and distance: Even with this simple example we can observe that both the angle at which the light is positioned and its distance to the lit object have an impact on the way that matte surface looks. We can try to understand what’s going on by visualizing the rays emitted by the source. To make things easier to see, only the rays that hit the surface are drawn with full length: Changing the position of the light changes the numbers of rays hitting the surface which affects how the surface looks. Notice that different parts of the surface get different number of rays, so let’s isolate a small area and look at it up close. First, let’s analyze the impact of altitude angle. In the simulation below a red dot terminates a ray that used to hit the tiny patch in the perpendicular case, but it no longer does so after tilting: As soon as the light source slants away from the perpendicular direction some of the rays that used to hit the patch no longer do. We can see this situation even better from a side view. The blue arrow shows the surface normal. Similarly to the two dimensional case, a normal direction in three dimensions is locally perpendicular to the surface. The yellow arrow points towards the light source: As the angle increases, a smaller portion of the original stream of light hits the surface. With the power of the source P, the received power per unit area E known as irradiance that hits the tiny patch of the surface with area A is proportional to the cosine of the angle of incidence α between the to-light direction and the patch’s normal vector: E = P · cos(α) / A For a flat matte surface with small but distant light source the shading results from this cosine factor aren’t particularly exciting, because every point of the surface looks almost the same. However, when every element of the surface has a different angle of incidence, like in the case of a sphere, the shading of a matte surface can look quite pretty. In the example below the yellow arrow shows the direction towards a distant light source: With the cosine factor covered we can now analyze how the distance to the light source affects the distribution of rays. Yet again, red dots show the intersections of rays that used to hit the patch, but due to increased distance of the light they no longer do so: The further away the light the fewer photons hit the patch of the surface. For a tiny light source like that we can quantify this relation using geometrical reasoning. In the demonstration below you can witness the rays of light emitted from a small light source in all directions. That source is surrounded by a sphere – you can control its radius with a slider: Notice, that when the radius of the sphere increases, the density of the yellow intersection points decreases. While the number of rays is constant, the total area of the surface increases and the local intensity of light is more diluted. The area of a sphere is proportional to the square of its radius r: A = 4πr2 As such, received power per unit area E, is, with fixed power, proportional to the inverse of the square of the distance r: E = P / A ~ 1 / r2 This rule is known as the inverse square law and it holds accurately only for infinitely small light sources, which don’t exist in the physical world. As a result, that simplifying assumption won’t let us explain the variety of shading obtained by even a simple rectangular light source: To understand what’s going on here we need to change pace a little and discuss angles and fields of views. Angles If you’ve ever looked at a car that was driving away you’ve likely noticed that it seemed smaller as it moved away. In the demonstration below we can recreate this situation by controlling the car’s position. The upper part shows the top-down view of that scene, while the lower part shows how it would appear to your eyes if you were standing on the red dot: The gray circle around the red dot symbolizes a full surrounding field of view. As the car moves away the angle it subtends in that field of view, as shown by the yellow arc, gets smaller and for this reason the car appears smaller. Radians The car simulation displayed the angle using the unit of degrees, but observe that the length of the yellow arc also gets smaller as the angle gets smaller. In math it’s very common to measure angles as the ratio of the arc’s length to the radius of the circle on which that arc is spanned: angle = arc length / radius That measure of an angle is expressed in radians. You can see how degrees and radians relate to each other in the demonstration below: When an angle measures 1 radian, the length of the yellow arc is equal to the length of the blue radius. A circle’s circumference is equal to 2π times the radius so half a full turn measures just π radians. Similarly to degrees, the measure of angles in radians is completely agnostic to the circle’s radius. The ratio of a circle’s circumference to its radius is always equal to 2π and the ratio of arc’s length to the arc’s radius is just some fraction of that 2π. As a final consideration in this section let’s investigate what happens to the subtended angle, and thus the arc length, when the object is already small in the field of view and it moves away from the observer: Notice that the yellow arc is very flat and in this scenario when the object moves twice as far, the angle it subtends gets pretty much twice as small. This follows from a basic proportion of similar triangles when we think of the arc as a straight segment. That approximation becomes more accurate as the arc gets shorter since the curvature becomes even more negligible. Solid Angles In the car example I’ve conveniently focused only on the perceived width of the car, but you’ve probably noticed that the distant vehicle seems to get shorter too. Human vision isn’t just limited to horizontal direction, so let’s try to model our field of view by extending the example into the third dimension. This time, to spare myself a 3D modeling exercise, I’ll use a simple rectangle: Notice that as the rectangle moves away, the projected area on the sphere gets smaller. This completes the explanation of why objects seem smaller when they are distant – they simply occupy a smaller part of our visual field. In two dimensions we defined an angle as a ratio of the length of an arc of a circle to that circle’s radius. In three dimensions we similarly define a solid angle to be the ratio of the area of a subtended patch on a sphere to that sphere’s radius squared: solid angle = patch area / radius2 The shape of the patch can be completely arbitrary, all that matters is its area. In the demonstration below you can see some solid angles which are measured in steradians. I highlighted the cone reaching the patch to make things more visible, but ultimately it’s just the yellow area that defines the solid angle: Since the area of the sphere is 4π times the radius squared the maximum solid angle is 4π steradians. Note that both radian and steradian are dimensionless, we just give them convenient names to recognize that we are talking about angles. On a final note, let’s look what happens to a small solid angle as the object moves away: When the projection of the rectangle is small enough the curved patch on the hemisphere can be approximated with a flat piece. Since both the projected width and height are inversely proportional to the distance, the area of the patch shrinks with a square of the distance, in some sense recreating the inverse square law from the point of view of the observer. Surface Vision Let’s try to map the concepts of fields of views and solid angles to the surface from the previous scene. Here it is again: Every point of the surface is exposed to its environment, but a point can only see its surroundings through a hemisphere centered around it. The other half of the sphere is just blocked by the surface itself – no light can arrive from under it. If we now put the light in the scene and try to project it onto the hemisphere we can observe what’s going on with the projected area. I made the backside of the floor look transparent to let you see the hemisphere from the inside: The smaller the area, the smaller the solid angle of the light source and thus the smaller amount of light getting to the surface. However, we’re still not accounting for the cosine factor – the solid angles closer to the horizon should be less influential. It turns out we can fix this problem by employing a simple trick of projecting the outline of the subtended angle from the hemisphere onto the base: This process automatically accounts for the cosine factor – notice that the projected yellow area on the surface gets smaller when the light source is close to the horizon. This method of a projected solid angle explains how bright a point on a matte surface will appear when lit by a uniform light source. Radiance What I’ve shown you so far may seem reasonable, but you may wonder about some inconsistencies. As we’ve seen, a matte surface gets dimmer as it moves away from the light and it also gets dimmer as the light’s altitude angle tilts away from the perpendicular direction. However, the light source itself doesn’t seem to undergo the same effects – it remains consistently bright even as we look at it from an oblique angle or move away from it with a slider: A matte surface seems to collect the surrounding light from every direction. The human eye and digital cameras work quite differently. Through the optical system, each of the receptors in a retina, or each of the pixels in a camera, collects light only from a very small solid angle. In the demonstration below a tiny blue receptor on the left is exposed only to the light “seen” by the yellow cone: As the light source moves away, the power reaching the receptor is reduced by the inverse of the square of a distance. However, at the same time the amount of light’s surface visible to the solid angle increases by a square of distance – you can observe the circle of the cone’s base in the bottom right corner. These two effects cancel each other out and the perceived brightness remains constant. Receptors like these measure radiance which is power per unit area and per unit solid angle. Both the size of the receptor and the solid angle from which it receives the light contribute to the amount of collected energy. When the light is seen by a person we often use the term luminance, which is just radiance weighted by wavelength sensitivity function of the human visual system. Luminance defines how bright an object appears to our eyes and it’s expressed in nits – you may have heard that term referring to a display’s brightness. The viewing angle independence of light sources applies only to so called Lambertian emitters, however, many of the typical light sources like frosted light bulbs and the Sun are a close approximation of these idealized generators. Every point of a Lambertian emitter emits light in the following spherical pattern, the length of an arrow corresponds to relative number of photons per second emitted in the arrow’s direction: The lengths of the vectors are proportional to the cosine of the angle away from the normal which ends up forming a perfect sphere. To see how this distribution affects the total brightness let’s look at how an observer perceives the light’s surface as seen from a side view: The yellow shape represents a solid angle from which the receptor receives the light, only the photons emitted directly"
