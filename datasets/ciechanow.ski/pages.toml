title = "Exposing NSMutableArray – Bartosz Ciechanowski"
full_description = '''March 5, 2014 Exposing NSMutableArray I’ve always wondered how NSMutableArray works internally. Don’t get me wrong, immutable arrays certainly provide enormous benefits: not only are they thread safe but also copying them is essentially free. It doesn’t change the fact that they’re quite dull – their contents can’t be modified. I find the actual memory manipulation details fascinating and this is why this article focuses on mutable arrays. Since I more or less describe the complete process I used to investigate NSMutableArray, this post is fairly technical. There is an entire section discussing the ARM64 assembly, so if you find that boring then do not hesitate to skip it. Once we’re through the low level details, I present the non obvious characteristics of the class. Implementation details of NSMutableArray are private for a reason. They’re subject to change at any time, both in terms of underlying subclasses and their ivar layouts, as well as underpinning algorithms and data structures. Regardless of those caveats, it’s worth peeking under the hood of NSMutableArray and figuring out how it works and what can be expected of it. The following study is based on iOS 7.0 SDK. As usual, you can find the accompanying Xcode project on my GitHub. The Problem of Plain Old C Arrays Every self-respecting programmer knows how C arrays work. It boils down to a continuous segment of memory that can be easily read from and written into. While arrays and pointers are not the same (see “Expert C Programming” or this article), it’s not much of an abuse to consider “malloc-ed block of memory” as an array. One of the most obvious drawbacks of using linear memory is that inserting an element at index 0 requires shifting all the other elements via means of memmove: Inserting to C array at index 0 Similarly, removing the first element requires shifting action as well, assuming one wants to keep the same memory pointer as an address of the first element: Removing from C array at index 0 For very large arrays this quickly becomes a problem. Obviously, direct pointer access is not necessarily the highest level of abstraction in the world of arrays. While C-style arrays are often useful, the daily bread and butter of Obj-C programmers wanting a mutable, indexed container is NSMutableArray. NSMutableArray Diving in Even though Apple publishes source code for many libraries, Foundation and its NSMutableArray is not open sourced. However, there are some tools that make unrevealing its mysteries a little bit easier. We begin our journey at the highest possible level, reaching into the lower layers to get otherwise inaccessible details. Getting & Dumping Class NSMutableArray is a class cluster – its concrete implementations are actually subclasses of NSMutableArray itself. Instances of which class does actually +[NSMutableArray new] return? With LLDB we don’t even have to write any code to figure that out: (lldb) po [[NSMutableArray new] class] __NSArrayM With class name in hand we reach for class-dump. This handy utility forges the class headers obtained by analyzing provided binaries. Using the following one-liner we can extract the ivar layout we’re interested in: ./class-dump --arch arm64 /Applications/Xcode.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS7.0.sdk/System/Library/Frameworks/CoreFoundation.framework/CoreFoundation | pcregrep -M "^[@\w\s]*__NSArrayM[\s\w:{;*]*}" I suck at regular expressions so the one used above is probably not a masterpiece, but it provides fruitful results: @interface __NSArrayM : NSMutableArray { unsigned long long _used; unsigned long long _doHardRetain:1; unsigned long long _doWeakAccess:1; unsigned long long _size:62; unsigned long long _hasObjects:1; unsigned long long _hasStrongReferences:1; unsigned long long _offset:62; unsigned long long _mutations; id *_list; } The bitfields in the original output are typed with unsigned int, but obviously you can’t fit 62 bits into a 32-bit integer – class-dump hasn’t been patched yet to parse ARM64 libraries correctly. Despite those minor flaws, one can tell quite a lot about the class just by looking at its ivars. Disassembling Class The most important tool in my investigation was Hopper. I’m in love with this disassembler. It’s an essential tool for curious souls who have to know how everything works. One of the best features of Hopper is that it generates C-like pseudocode that very often is clear enough to grasp the gist of the implementation. The crucial method for understanding __NSArrayM is - objectAtIndex:. While Hopper does great job providing pseudocode for ARMv7, the feature doesn’t work for ARM64 yet. I figured it would be an excellent exercise to do this manually, with some hints from its ARMv7 counterpart. Dissecting the Method With ARMv8 Instruction Set Overview (registration required) in one hand and a bunch of educated guesses in another I think I’ve deciphered the assembly correctly. However, you should not treat the following analysis as an ultimate source of wisdom. I’m new at this. Passing Arguments As a start point let’s note that every Obj-C method is actually a C function with two additional parameters. The first one is self which is a pointer to the object being receiver of the method call. The second one is _cmd which represents the current selector. One might say that the equivalent C-style declaration of the - objectAtIndex: function is: id objectAtIndex(NSArray *self, SEL _cmd, NSUInteger index); Since on ARM64 these types of parameters are passed in the consecutive registers, we can expect the self pointer to be in x0 register, the _cmd in x1 register and the index of object in x2 register. For details of parameter passing please reference the ARM Procedure Call Standard, noting that Apple’s iOS version has some divergences. Analyzing Assembly This will look scary. Since analyzing a large chunk of assembly at once is not sane, we’re going to walk through the following code step by step, figuring out what each line does. 0xc2d4 stp x29, x30, [sp, #0xfffffff0]! 0xc2d8 mov x29, sp 0xc2dc sub sp, sp, #0x20 0xc2e0 adrp x8, #0x1d1000 0xc2e4 ldrsw x8, [x8, #0x2c] 0xc2e8 ldr x8, [x0, x8] 0xc2ec cmp x8, x2 0xc2f0 b.ls 0xc33c 0xc2f4 adrp x8, #0x1d1000 0xc2f8 ldrsw x8, [x8, #0x30] 0xc2fc ldr x8, [x0, x8] 0xc300 lsr x8, x8, #0x2 0xc304 adrp x9, #0x1d1000 0xc308 ldrsw x9, [x9, #0x34] 0xc30c ldr x9, [x0, x9] 0xc310 add x9, x2, x9, lsr #2 0xc314 cmp x8, x9 0xc318 csel x8, xzr, x8, hi 0xc31c sub x8, x9, x8 0xc320 adrp x9, #0x1d1000 0xc324 ldrsw x9, [x9, #0x38] 0xc328 ldr x9, [x0, x9] 0xc32c ldr x0, [x9, x8, lsl #3] 0xc330 mov sp, x29 0xc334 ldp x29, x30, [sp], #0x10 0xc338 ret The Setup We begin with what seems to be an ARM64 function prologue. We’re saving x29 and x30 registers on the stack then we move the current stack pointer sp to x29 register: 0xc2d4 stp x29, x30, [sp, #0xfffffff0]! 0xc2d8 mov x29, sp We make some room on the stack (subtracting, since stack grows downwards): 0xc2dc sub sp, sp, #0x20 The path code we’re interested in doesn’t seem to be using this space. However, the “out of bounds” exception throwing code does call some other functions thus the prologue has to facilitate both options. Fetching Count The next two lines perform program counter relative addressing. The specifics of addresses encoding are quite complicated and the literature is scarce, however, Hopper automatically calculates more sane offsets: 0xc2e0 adrp x8, #0x1d1000 0xc2e4 ldrsw x8, [x8, #0x2c] The two lines will fetch contents of memory located at 0x1d102c and store it into x8 register. What’s over there? Hopper is kind enough to help us: _OBJC_IVAR_$___NSArrayM._used: 0x1d102c dd 0x00000008 This is the offset of _used ivar inside the __NSArrayM class. Why go through the trouble of additional fetch, instead of simply putting the value 8 into the assembly? It’s because of fragile base class problem. The modern Objective-C runtime handles this by giving itself an option to overwrite the value at 0x1d102c (and all the other ivar offsets for that matter). If either NSObject, or NSArray, or NSMutableArray adds new ivars, the old binaries will still work. The runtime can modify the ivars' offsets dynamically without breaking compatibility While the CPU has to do an additional memory fetch, this is a beautiful solution as explained in more details on Hamster Emporium and Cocoa with Love. At this point we know the offset of _used within the class. And since the Obj-C objects are nothing more than structs, and we’ve got pointer to this struct in x0, all we have to do is fetch the value: 0xc2e8 ldr x8, [x0, x8] The C equivalent of the above code would be: unsigned long long newX8 = *(unsigned long long *)((char *)(__bridge void *)self + x8); I think I prefer the assembly version. Quick analysis of disassembled - count method of __NSArrayM reveals that the _used ivar contains the number of elements in __NSArrayM, and as of this moment we have this value in x8 register. Checking Bounds Having requested index in x2 and count in x8 the code compares the two: 0xc2ec cmp x8, x2 0xc2f0 b.ls 0xc33c When the value of x8 is lower or same as x2 then we jump to the code at 0xc33c, which handles the exception throwing. This is essentially the bounds checking. If we fail the test (count is lower or equal to index), we throw exception. I’m not going to discuss those parts of disassembly since they don’t really introduce anything new. If we pass the test (count is greater than index) then we simply keep executing instructions in order. Calculating Memory Offset We’ve seen this before, this time we fetch the offset of _size ivar located at 0x1d1030: 0xc2f4 adrp x8, #0x1d1000 0xc2f8 ldrsw x8, [x8, #0x30] Then we retrieve its contents and shift it to the right by two bits: 0xc2fc ldr x8, [x0, x8] 0xc300 lsr x8, x8, #0x2 What’s the shift for? Let’s take a look at the dumped header: unsigned long long _doHardRetain:1; unsigned long long _doWeakAccess:1; unsigned long long _size:62; It turns out, all three bitfields share the same storage, so to get the actual value of _size, we have to shift value to the right, discarding the bits for _doHardRetain and _doWeakAccess. Ivar offsets for _doHardRetain and _doWeakAccess are exactly the same, but their bit accessing code is obviously different. Going further it’s the same drill, we get the contents of _offset ivar (at 0x1d1034) into x9 register: 0xc304 adrp x9, #0x1d1000 0xc308 ldrsw x9, [x9, #0x34] 0xc30c ldr x9, [x0, x9] In the next line we add the requested index stored in x2 to the 2-bits-right-shifted _offset (it’s also a 62 bits-wide bitfield) and then we store it all back in x9. Isn’t assembly just amazing? 0xc310 add x9, x2, x9, lsr #2 The next three lines are the most important ones. First of all, we compare the _size (in x8) with _offset + index (in x9): 0xc314 cmp x8, x9 Then we conditionally select value of one register based on the result of previous comparison: 0xc318 csel x8, xzr, x8, hi This is more or less equal to ?: operator in C: x8 = hi ? xzr : x8; /* csel x8, xzr, x8, hi */ The xzr register is a zero register which contains value 0, and the hi is the name of condition code the csel instruction should inspect. In this case we’re checking whether the result of comparison was higher (if value of x8 was greater than that of x9). Finally we subtract the new value of x8 from the _offset + index (in x9) and we store it in x8 again: 0xc31c sub x8, x9, x8 So what just happened? First of all let’s look into equivalent C code: int tempIndex = _offset + index; /* add x9, x2, x9, lsr #2 */ BOOL isInRange = _size > tempIndex; /* cmp x8, x9 */ int diff = isInRange ? 0 : _size; /* csel x8, xzr, x8, hi */ int fetchIndex = tempIndex - diff; /* sub x8, x9, x8 */ In the C code we don’t have to shift neither _size nor _offset to the right, since compiler does this automatically for bitfields access. Getting the Data We’re almost there. Let’s fetch the contents of _list ivar (0x1d1038) into x9 register: 0xc320 adrp x9, #0x1d1000 0xc324 ldrsw x9, [x9, #0x38] 0xc328 ldr x9, [x0, x9] At this moment the x9 points to the beginning of memory segment containing the data. Finally, shift the value of fetch index stored in x8 to the left by 3 bits, add it to the x9 and put the contents of memory at that location into x0: 0xc32c ldr x0, [x9, x8, lsl #3] Two things are important here. First of all, every data offset is in bytes. Shifting a value to the left by 3 is equivalent to multiplying it by 8, which is the size of a pointer on a 64-bit architecture. Secondly, the results goes into x0 which is the register which stores the return value of a function returning NSUInteger. At this point we are done. We have fetched the correct value stored in array. Function Epilog There rest are some boilerplate operations that restore the state of registers and stack pointer before the call. We’re reversing the function’s prologue and returning: 0xc330 mov sp, x29 0xc334 ldp x29, x30, [sp], #0x10 0xc338 ret Putting it all together I explained what the code does, but the question we will now answer is why? The Meaning of ivars Let’s do a quick summary of what each ivar means: _used is count _list is a pointer to the buffer _size is size of the buffer _offset is an index of the first element of the array stored in the buffer The C code With ivars in mind and the disassembly analyzed we now can write an equivalent Objective-C code that performs the very same actions: - (id)objectAtIndex:(NSUInteger)index { if (_used <= index) { goto ThrowException; } NSUInteger fetchOffset = _offset + index; NSUInteger realOffset = fetchOffset - (_size > fetchOffset ? 0 : _size); return _list[realOffset]; ThrowException: // exception throwing code } Assembly was definitely much more long-winded. Memory Layout The most crucial part is deciding whether the realOffset should be equal to fetchOffset (subtracting zero) or fetchOffset minus _size. Since staring at dry code doesn’t necessarily paint the perfect picture, let’s consider two examples of how object fetching works. _size > fetchOffset In this example, the offset is relatively low: A simple example To fetch object at index 0 we calculate the fetchOffset as 3 + 0. Since _size is larger than fetchOffset the realOffset is equal to 3 as well. The code returns value of _list[3]. Fetching object at index 4 makes fetchOffset equal to 3 + 4 and the code returns _list[7]. _size <= fetchOffset What happens when offset is large? A more difficult example Fetching object at index 0 makes fetchOffset equal to 7 + 0 and the call returns _list[7] as expected. However, fetching object at index 4 makes fetchOffset equal to 7 + 4 = 11, which is larger than _size. Obtaining realOffset requires subtracting _size value from fetchOffset which makes it 11 - 10 = 1 and the method returns _list[1]. We’re essentially doing modulo arithmetic, circling back to the other end of the buffer when crossing the buffer boundary. Data Structu'''
