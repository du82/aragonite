title = "Bartosz Ciechanowski"
description = "Interactive articles about science and engineering."
full_description = "December 17, 2024 MoonIn the vastness of empty space surrounding Earth, the Moon is our closest celestial neighbor. Its face, periodically filled with light and devoured by darkness, has an ever-changing, but dependable presence in our skies. In this article, we’ll learn about the Moon and its path around our planet, but to experience that journey first-hand, we have to enter the cosmos itself. Let’s take a look at the Moon as seen from space in all its sunlit glory. You can drag it around to change your point of view, and you can also use the slider to control the date and time: In this convenient view, we can freely pan the camera around to see the Moon and its marvelous craters and mountains from various angles. Unfortunately, we don’t have that freedom of motion in our daily experience – the Moon wanders on its own path across the daily and nightly skies. We can simulate these travels below, where you can see the current position of the Moon in the sky. You can drag that panorama around to adjust your viewing direction – this lets you see the breadth of the sky both above and below the horizon. By dragging the sliders you can witness how the position of the Moon changes in the sky across days and hours of your local time. As the Moon’s placement in the sky shifts, the little arrow will guide you to its position. You can also drag the little figurine on the globe in the bottom-right corner to see how the sky looks at that location on Earth. If your browser allows it, clickingtapping the button will automatically put the figurine at your current location. This may all feel quite overwhelming at the moment, but we’ll eventually see how all these pieces fit together: Over the course of one day, the Moon travels on an arc in the sky almost completing a loop around the Earth. As the days pass, the Moon’s illumination also visibly changes. You’ll probably admit that it’s a little hard to focus on the tiny Moon as it shifts its position in the sky. To make things easier to see, I’ll zoom in the camera and lock its position on the Moon: Notice that across a single day the Moon seems to rotate, and over many days it quite visibly wobbles. These wobbly variations let us occasionally see some hidden parts on the “edges” of the Moon, but our neighbor ultimately shows us only one of its sides. In our space-floating demo we could easily see the Moon from all sides, but on Earth we can never see most of the far side of the Moon. Over the course of days, the lighting on the Moon also changes dramatically. The line between the lit and unlit parts of the Moon, known as the terminator, sweeps across the Moon, revealing the details of its surface. Although the Moon has a spherical shape, the fully lit Moon looks more like a flat disk. In this article I’ll explain all the effects we’ve just seen, and we’ll also learn about gravity, ocean tides, and eclipses. Let’s begin by exploring how celestial bodies move through space and how their mere presence influences the motion of their neighbors. Motion in Space Let me introduce a little cosmic playground in which we’ll do our experiments. Inside it, I put a little planet that floats freely in space. You can drag the planet around to change its position. The arrow symbolizes the initial velocity of this body – you can tweak this velocity by dragging the dashed outline at the end of the arrow. To get things going, you can press the button in the bottom-left corner: Notice that I’m drawing a ghost trail behind the moving planet, making it easier to track its motion. As you can see, once you let the planet go, it travels through space in a straight line, only to eventually get out of visible bounds. Let’s complicate things a little by adding another body to this sandbox. You can tweak the positions and velocities of both bodies to see how their mutual presence impacts one another. I’m also marking the thin lines of trajectories that the bodies will take even before you let things go, making it easier to plan their motion: The motion we see now isn’t as straightforward as before. In some scenarios, the two bodies travel past each other after tweaking their initial trajectories. In other configurations, both objects roam through space together, permanently locked in a swinging dance. You may have also managed to make the two bodies run into each other. We’ll eventually see a more realistic visualization of that scenario, but in this simplified simulation when two objects collide, they just stick together and continue their coupled journey. What’s responsible for all these effects is the force of gravity acting on the objects. Let’s explore that interaction up close. As before, you can drag the two bodies around, and you can also change their masses using the sliders below: The arrows represent the force of gravity acting on the two bodies – the longer the arrow, the larger the force. For completeness, I’m displaying the values and units of masses and distances, but the numbers aren’t particularly important here. What matters is that when we increase either the mass of the first body m1 or the mass of the second body m2, the force of gravity grows too. Moreover, the magnitude of gravity also depends on the distance r between the objects. As bodies move farther apart, the gravity weakens. Notice how the forces acting on each body have the same magnitude, but they point towards the other body, which indicates an attractive force. If you paid close attention to the lengths of the arrows, you might have noticed that the force decreases quite rapidly with distance. We can visualize this with a plot, in which the white line shows the magnitude of gravity as a function of distance. More precisely, it shows that gravity is inversely proportional to the square of that distance: Let’s take a very brief mathematical interlude to describe what we’ve seen in more detail. All these dependencies are captured in the following equation for the force of gravity F, between two objects with masses m1 and m2 separated by distance r: F = G × m1 × m2 / r2 The gravitational constant G seen in front of the right-hand side of the equation is incredibly small, making gravity a very weak force. We have no issues lifting everyday objects despite the might of the mass of the entire Earth pulling them down. While the strength of gravity between any two bodies is equal, the resulting change in motion is not. You may recall from elementary physics classes that force F is equal to mass m times acceleration a. We can encapsulate this idea in a pair of simple formulas that tie these values for the first and second body: F = m1 × a1 F = m2 × a2 By plugging in the equation for the force of gravity F and reducing the masses, we end up with a set of two equations for accelerations of the bodies: a1 = G × m2 / r2 a2 = G × m1 / r2 Notice that the acceleration of the first body a1 depends on the mass of the second body m2. Similarly, the acceleration of the second body a2 depends on the mass of the first body m1. Let’s see this in practice in the demonstration below, where I’m temporarily making the big body twenty times more massive than the small body: Notice that the body with smaller mass drastically changes its course, while the motion of the larger body is only marginally affected. This tracks with our day-to-day experience, where every item left hanging in the air very visibly accelerates towards the staggeringly massive Earth, but our planet doesn’t jump out of its way to meet the falling object. Now that we understand that it’s the force of gravity that makes the bodies move towards each other, let’s do a better job of tracking the motions of these objects over time. Right now our camera is fixed in space, so the two bodies often fly out of visible bounds. Thankfully, we can easily fix this by moving the camera with the bodies. In the demonstration below, I’m presenting the same scenario from two different vantage points. On the left, I’m showing the scene from the familiar point of view that’s fixed in space – you can plan the trajectories of the two bodies on that side. On the right, you can see this simulation from the point of view of the camera that’s tied to the motion of the these objects. I’m marking the position of that camera with a white dot on the thin line joining the bodies. By dragging the slider you can move the camera between them: With the camera following the bodies we can now track their motion forever. More importantly, we can also see the relative motion of the two objects. When you make the bodies move together, you can witness how from the perspective of the teal body, it’s the yellow body that orbits around the teal body, but from the perspective of the yellow body, it’s the other way around. Better yet, if we position the camera halfway, or even anywhere else between the two bodies, both objects seem to orbit the camera. The perception of relative motion depends on the point of view, but there is one point that’s particularly useful for observation. In this next demonstration, I’ve added a little white trail to the camera itself. Watch how the path of the camera in space changes as you reposition it with the slider: In general, the camera traverses some squiggly path in space. However, there is one special position between the two bodies for which the camera travels in a perfectly straight line. This point is known as the barycenter, and it’s located at the center of mass of these objects. Let’s explore the concept of the barycenter a little closer. In the demonstration below, you can once again drag the bodies around to change the distance between them, and you can also use the sliders to tweak their masses. The center of mass of these two bodies is marked with a black and white symbol: The equation in the bottom part explains the placement of the center of mass of these two objects – it is located at a point where its distance from the first body r1 multiplied by that body’s mass m1, equals that point’s distance from the second body r2 multiplied by its mass m2. This simple rule becomes slightly more complicated when more than two bodies are involved. In those scenarios, the position of the center of mass is the weighted average of the positions of all the bodies, where the masses of these bodies serve, very appropriately, as weights. We’ll only be interested in the center of mass of two bodies, so the demonstration we’ve just seen fits our needs well. Notice that as the bodies move farther away, the barycenter also migrates to stay in the constant proportion of the distance separating the objects. Moreover, if one of the bodies is much more massive than the other, the center of mass could lie inside that larger body. In our space simulator, the mass of the teal body is three times the mass of the yellow body, so the barycenter of this system lies three-quarters of the way between the yellow and teal objects: The motion of the barycenter shows us that the tangled dance of two celestial bodies hides a much simpler linear motion through space and some additional motion of the two bodies around that barycenter . Let’s try to see that other motion more clearly by making one more modification to the right side of the demonstrations we’ve seen. Notice that the trails left by the bodies linger in space, but ideally, we’d also want to see the paths taken by the bodies relative to the moving camera. To make this work we can attach a little drawing plane to the camera itself – I’m outlining that plane below with a thin rectangle. Then, as the bodies move around, they can trace their trails on that plane as well: With this new method we can see the paths the bodies took relative to the moving camera . When seen from this perspective, we can finally reveal that, in most practical scenarios, the two orbiting bodies trace ellipses relative to each other. Depending on the initial conditions, some of those ellipses are larger, and some are smaller. Some are almost circular, and some are quite elongated. Changing the position of the camera with the slider changes the relative sizes of these two ellipses, but they maintain their overall proportions. The ellipse of motion of one body seen from the perspective of the other is the same for both bodies, it just shifts in space. As you may have seen on this blog before, an ellipse can be more formally characterized by its eccentricity and the size of its semi-major axis, which you can control using the sliders below: Eccentricity specifies how elongated an ellipse is. It can be defined as the ratio of the length of the dark pink segment to the length of the semi-major axis. That segment spans the distance between the center of the ellipse and one of the two focus points, which are also jointly known as foci. When we watch orbital motion from the perspective of the orbited body, that body is always in one of the focus points of the orbital ellipse of the orbiting body. I’ve also marked two special points on the orbital ellipse. At apoapsis, the orbiting body is at its farthest distance from the orbited body, and at periapsis the orbiting body is closest to that body. These two points are collectively known as apsides, and the line joining them is known as the line of apsides. The simple rule for remembering which apsis is which is that apoapsis is the one that’s farther away from the orbited body. We’ve just described the orbital ellipse and its apsides as seen from the point of view of the larger body, but in our cosmic playground we’ve seen how moving the camera around with a slider can change the perception of motion: With a two-body system like this one we actually have some flexibility in describing which body orbits which. We typically say that it’s the less massive object that orbits the more massive one, but the observer on the smaller body would just see the motion of the larger neighbor around it. For us, it will be often useful to describe things from the point of view of the barycenter – we’ve seen earlier how that special point lets us decompose the motion of two solitary bodies into the movement on a straight line and the orbiting motion around that barycenter. That particular viewpoint also lets us explain another irregular motion we can see in these elliptical orbits. Notice that as the two bodies are close to each other, they swing across their trajectories much faster. You can see it best when looking at the dashed segments I’ve drawn on the elliptical orbits – traversal of each brighter or darker section takes the same amount of time. These lines are visibly longer when the bodies are close, which reflects their faster motion as they travel longer distance over the same period. This non-uniform motion can also be seen in the angular velocity of the orbital motion, which describes how many degrees per second an orbiting body sweeps through. In this next demonstration the blue line rotates with constant angular velocity, so in every second it goes acros"
