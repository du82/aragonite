["https://circular.berlin/de/education"]
title = "Education | Circular Berlin"
full_description = "Unsere Berliner Expert*innen für Kreislaufwirtschaft, Zirkulärität und Zero Waste bieten erstklassige Workshops an, in denen sie theoretisches Wissen mit praktischer Anwendung und Beispielen aus der echten Welt verknüpfen. Was unsere Partner über uns sagen Circular Berlins’ training session was incredibly impactful on a group of already established designers, not an easy group to win over. We worked on real-world challenges, using tools that we then have continued to use in our projects with clients. We would love to partner again!Fjord Berlin Training ParticipantThe Circular Berlin team facilitated two sets of intriguing workshops at our student-run conference about the circular economy. Particularly in face of the uncertainty associated with the COVID-19 pandemic, they were a reliable partner who we can recommend to anyone in need for expertise on the topic.European Public Policy Conference organiserThe workshop provided a systematic overview of what circularity means and what role different organisations play in this respect. Students loved the hands-on nature of the workshop and a multitude of local and global examples helped to translate conceptual thinking into day-to-day applications and practice. Highly recommended.Vlerick Business SchoolÜber 2 Tage haben wir spannende Einblicke in die Zirkuläre Wirtschaft und Berlins Anstrengungen auf diesem Gebiet gewonnen. Im Workshop mit Circular Berlin wurden uns die Grundlagen einer Zirkulären Wirtschaft kompakt und praxisnah vermittelt und zu noch mehr zirkulärem Handel motiviert. Besonders die Kombination mit der Circular City Tour hat den Praxisbezug nochmal unterstrichen. Der Besuch verschiedener Standorte an denen zirkuläre Wirtschaft in Berlin in Bereichen wie Bauen, Abfall und Beschaffung bereits gelebt wird, hat uns wertvolle Erfahrungen für unserer eigenen Arbeit geliefert, vielfältige Inspiration gegebene und zu spannenden Diskussionen angeregt.Neue Effizienz gemeinnützige GmbH Mit wem wir arbeiteten Einführungs-Workshop Ein kurzweiliger, interaktiver Workshop, in dem die Prinzipien der Circular Economy vorgestellt und in praktischen Übung und Beispielen angewendet werden. Mehr Maßgeschneiderte auf einen spezifischen Sektor fokussierte Workshop-Inhalte können ohne zusätzliche Kosten für Circular Berlins Fokusthemen gebucht werden: Lebensmittel und Biomasse, Textil und Mode, Bauwesen, Produkt- und Materialdesign. Wir führen diesen Workshop in unregelmäßigen Abständen durch. Anstehende Veranstaltungen findest du hier. Nach diesem Workshop… Verstehst du die Theorie hinter dem Schlagwort „Circular Economy“/ „Kreislaufwirtschaft“. Begreifst du, wie Unternehmen und Städte dieses Konzept sofort anwenden können. Hast du geübt, traditionelle Produkte, Geschäftsmodelle und Dienstleistungen gemäß den Prinzipien der Kreislaufwirtschaft zu transformieren. Dieser Workshop ist geeignet für alle, denen das Thema Kreislaufwirtschaft neu ist oder die sich eine Wiederholung dazu wünschen. Für Unternehmen, Vereine und Gruppen, gemeinnützige Organisationen, Verwaltung und Regierung, Industrieverbände, Universitäten, Fachleute, Designer, kleine Unternehmen. Sprache: Deutsch, Englisch Dauer:4 Stunden Toolbox-Workshop Diese weiterführende Workshop-Einheiten vermitteln Fachleuten praktische Werkzeuge und Methoden, um Circular Economy Praktiken in ihre Arbeit zu integrieren. Mehr Diese Workshops können entsprechend der Bedürfnisse der Teilnehmenden zusammen mit einem Einführungs-Workshop oder alleinstehend gebucht werden. Wir bieten folgende Toolbox-Workshops an: Lebenszyklusanalyse (LCA) leicht gemacht: Das „Eco-Value-Ratio“-Tool Businessmodelle kreislauffähig machen So funktioniert eine Zero Waste-Audit (Status Quo-Analyse und Handlungsfelder aufzeigen) So veranstaltest du eine Zero Waste-Veranstaltung Weniger Schlechtes vs. mehr Gutes: Eine neue Vision der Wertschöpfung Nachhaltige Designstrategien Biomicry in der Praxis Industriesymbiosen kreieren mit dem Circularity Compass. Diese Workshops sind geeignet für Unternehmen, gemeinnützige und Regierungsorganisationen mit einem grundlegenden Verständnis für das Thema Kreislaufwirtschaft, die dieses Konzept nun in ihrer praktischen Arbeit umsetzen möchten. Sprache:Englisch, andere Sprachen auf Anfrage Dauer: 4 Stunden Herausforderungs-Workshop Fällt es euch schwer, eine Recycling- oder Wiederverwendungsmöglichkeit für bestimmte Abfälle zu finden? Möchtet ihr eurem Geschäftsmodell Miet- oder Reparaturdienstleistungen hinzufügen? Diese Workshops werden passgenau auf eine konkrete Herausforderung in eurem Industriesektor oder eurer Organisation entwickelt. Ihr erhaltet ausreichend Zeit für Brainstorming und zur Problemlösung gemeinsam mit Expert*innen von Circular Berlin und führenden Circularity Praxisexpert*innen aus unserem Netzwerk. Mehr Workshops sind Verfügbar für die Themen: Textil und Mode Bauwesen Lebensmittel und Restaurants Konsumgüter und Verpackung Gastgewerbe und Tourismus Eventmanagement Bildung und Schule Diese Workshops sind ideal für: Unternehmen, Teams aus Unternehmen, Industrieverbände mit einer spezifischen Herausforderung zum Thema Kreislaufwirtschaft, die sie lösen möchten. Sprache: Englisch, andere Sprachen auf Anfrage Dauer: Variabel Circular Experiences A great addition to any classroom training is the visits to Berlin companies and projects putting circularity into practice. We offer offer customised visits for your group. Mehr Sprache: Deutsch, Englisch Dauer: 2-4 Stunden Buche deinen Workshop Brauchst du etwas spezielles, das du hier nicht findest? Melde dich bei uns! Wir freuen uns, einen individuellen Workshop für dich zu gestalten. LEARN FROM OTHERS Intensive Kurse Freie Circular Economy Tools NEWSLETTER Bleibe auf dem Laufenden mit allem, was die Kreislaufwirtschaft in Berlin betrifft."
