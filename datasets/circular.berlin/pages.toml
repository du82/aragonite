title = "Mission | Circular Berlin"
description = "We are a network of professionals and organizations, working together to accelerate Berlin’s transition to a circular city."
full_description = "We envision Berlin as a resilient, citizen-oriented region. Resources are sourced locally if possible, used only if truly needed, and their value is maintained as part of a continuous loop ー within the limits of our planet. Waste and pollution are non-existent. People’s lives and jobs positively affect their neighbourhoods and communities. Organised as a non-profit, we accelerate Berlin’s transition towards a circular city. Organised as a non-profit, we accelerate Berlin’s transition towards a circular city. We are reshaping Berlin’s metabolism by developing the local circular economy agenda and its implementation, through research, community-building and practical programmes. Our work spans the fields of built environment & urban strategy, product & material design, food & biomass and textile & fashion. OUR IMPACT Explain and implement Understand the city material flows and required infrastructure for the key sectors relevant for Berlin / Brandenburg, to steer the circular economy strategy for Berlin, close that gaps by enabling continuous resource loops and implementations of 10Rs strategies, by initiating pilot projects and case-studies. Activate and empower Provide opportunities and practical experience for community members to empower them being actively involved as future expert into local operation in Berlin / Brandenburg in the area of circular economy. Raise awareness and inform Build a network of circular organisations, civil society initiatives, academics and practitioners in Berlin in order to raise awareness of the issues at hand, and provide resources and knowledge to initiate more circular economy activities. We aim to develop a decentralised approach for scaling up local Circular Economy City solutions, through well-documented, open-source and transparent approaches, which could be easily adopted by other locations. OUR VALUES Open We believe a circular economy can only happen when information is openly shared – all our work is publicly available and open source. Systemic Some problems can only be solved by looking at the system as a whole. Collaborative We are interdisciplinary, knowing that big challenges cannot be solved in isolation. Enabled by technology We see technology as a key enabler for a circular economy, but not a cure-for-all. Local The best way to make a change is in our immediate surroundings, directly benefiting Berliners and their environment. Open We believe a circular economy can only happen when information is openly shared – all our work is publicly available and open source. Systemic Some problems can only be solved by looking at the system as a whole. Collaborative We bring together interdisciplinary skills, knowing that big challenges cannot be solved in isolation. Enabled by technology We see technology as a key enabler for a circular economy, but not a cure-for-all. Local The best way to make a change is in our immediate surroundings, directly benefiting Berliners and their environment. As a non-profit, we rely on financial contributions from people and organisations who believe our work is valuable and helpful. We appreciate your support. Support Circular Berlin NEWSLETTER Stay up to date with all things circular economy in Berlin."
