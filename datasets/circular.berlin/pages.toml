full_description = '''Join our growing community! We are building a community to foster the Circular Economy in our city and beyond. Join us and connect with entrepreneurs, intrapreneurs, industry experts, academia and city representatives to learn from each other, collaborate and kickstart the transformation for circularity in Berlin. Join now Join our growing community! We are building a community to foster Circular Economy in our city and beyond. Join us and connect with entrepreneurs, intrapreneurs, industry experts, academia and city representatives to learn from each other, collaborate and kickstart the transformation for circularity in Berlin. Join now YOUR BENEFITS Learn about the latest insights on circular economy, jobs and funding opportunities, international and local events, through our team Slack. Develop your skills through knowledge sessions and workshops for members and ask questions to your circular economy peers. Support our work on education, community-building, and hands-on projects. Collaborate with the Circular Berlin community and share your own network with us. Share your projects with Circular Berlin’s community and start new projects with like-minded people. Learn about the latest insights on circular economy, jobs and funding opportunities, international and local events, through our team Slack.Develop your skills through knowledge sessions and workshops for members and ask questions to your circular economy peers.Support our work on education, community-building, and hands-on projects.Collaborate with the Circular Berlin community and share your own network with us.Share your projects with Circular Berlin’s community and start new projects with like-minded people. Individual Member You will have direct access to our team, experts and mentors who can help guide you on your journey in the circular economy. As a community member you receive discounts and free access to different learning sessions and events.We’re proud of each of our community members and would be happy to list your name on our website and social media. (If you are representing an organisation than you need to sign up as an organisational member). Starts at 60€/year Join now (function() { var qs,js,q,s,d=document, gi=d.getElementById, ce=d.createElement, gt=d.getElementsByTagName, id="typef_orm_share", b="https://embed.typeform.com/"; if(!gi.call(d,id)){ js=ce.call(d,"script"); js.id=id; js.src=b+"embed.js"; q=gt.call(d,"script")[0]; q.parentNode.insertBefore(js,q) } })() Organisational Member Within our diverse network, you can easily find experts and facilitators to address business challenges. We look forward to a 1:1 member consultation with you to figure out how to best support your organisation on the circular path. As an organisational member you will be able to cooperate with us on projects and other activities. To make this commitment visible we will share your logo on our partners page. Starts at 180€/year. (Detailed fee) Apply now (function() { var qs,js,q,s,d=document, gi=d.getElementById, ce=d.createElement, gt=d.getElementsByTagName, id="typef_orm_share", b="https://embed.typeform.com/"; if(!gi.call(d,id)){ js=ce.call(d,"script"); js.id=id; js.src=b+"embed.js"; q=gt.call(d,"script")[0]; q.parentNode.insertBefore(js,q) } })() Individual Member You will have direct access to our team, experts and mentors who can help guide you on your journey in the circular economy. As a community member you also receive discounts and even free access to different learning sessions and events. We’re proud of each of our community members and would be happy to list your name on our website and on our social media. (If you are representing an organisation than you need to sign up as an organisational member). Starts at 60€/year Join now (function() { var qs,js,q,s,d=document, gi=d.getElementById, ce=d.createElement, gt=d.getElementsByTagName, id="typef_orm_share", b="https://embed.typeform.com/"; if(!gi.call(d,id)){ js=ce.call(d,"script"); 