["https://circular.berlin/portfolio-item/solstice-5r-solutions-for-a-circular-textile-economy"]
title = "SOLSTICE: Rs Strategies for a Circular Textiles Economy | Circular Berlin"
full_description = "The SOLSTICE project is funded by the EU’s Horizon Europe framework program and aims to promote climate-neutral practices and the transition to a circular economy in the textile industry. The project follows a systemic and holistic approach that considers all phases of waste prevention and is guided by the 5R strategies: Refuse / Reduce, Reuse, Repair, Repurpose, and Recycling.These solutions will be tested and refined in demonstrations conducted in four European cities and regions: Grenoble (France), Prato (Italy), Catalonia (Spain) and here in Berlin (Germany). FUNDERS European Union PARTNERS 23 partners as Axel`Òne, Circle Economy Foundation, Grenoble-Alpes Métropole, Municipality of Prato, Departament d’Acció Climàtica, Alimentació i Agenda Rurtal, a.o. DATE May 2024 – November 2027 Website The challenge The textile industry is one of the world’s biggest contributors to water and environmental pollution as well as high greenhouse gas emissions. As the industry is growing rapidly, we are facing significant environmental and social challenges. On average, Europeans buy almost 26 kg of textiles per year and throw away 11 kg of it. Less than 1% of this textile waste is recycled, while over 70 % is incinerated or sent to landfill. Both the production and disposal of textiles are harmful to the environment. Our consumer behavior is unsustainable, the collection of textiles is inefficient and recycling using existing technologies is too complex. We face social and technical challenges that urgently need to be addressed. Our approach SOLSTICE aims to develop methods and strategies to implement the 5R strategies, focussing on the first 4 R’s “Refuse/Reduce, Reuse, Repair, Repurpose,” to engage citizens in waste prevention and support the private and public sector in integrating circular business models and promote the development of industry standards and policies. Fields of action will be identified in four cities and regions to test and evaluate concepts in Refuse/Reduce, Reuse, Repair, and Repurpose. The goal is to develop strategies for raising awareness across Europe and create action plans for infrastructure and communication measures to boost collection rates, waste prevention, reuse, and repair. If the 4 R’s can’t be applied, the 5th strategy is Recycling. The SOLSTICE project will develop and demonstrate four chemical recycling technologies to support the circular economy. The consortium will foster cooperation between research, companies, public authorities, and citizens. As part of a 24-partner consortium, Circular Berlin will pilot circular solutions, analyze textile flows, and study the entrepreneurial environment and consumption behavior in Berlin. We will test various solutions and evaluate their socio-economic impact to create replicable blueprints. The outcomes The SOLSTICE project supports sustainable growth in the textiles sector by raising customer awareness, enhancing recycling with new sorting methods, ensuring feedstock traceability using the Digital Product Passport, and providing data and guidelines to decision-makers. By fostering knowledge transfer and collaboration, we aim to create a rich ecosystem of expertise and resources that will maximize the impact and replicability of our initiatives. SOLSTICE seeks to unlock concrete business opportunities to accelerate the adoption of innovative solutions that align with the circular economy. Project contact person Sarah Keller Project Lead SOLSTICE Email | LinkedIn"
year_published = 2025
year_updated = 2024
