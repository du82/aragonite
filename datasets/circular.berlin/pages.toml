full_description = "Circular Economy: An Introduction Learn how to contribute to a sustainable economic system by implementing novel business and design approaches. Organizer: TU Delft Circular Economy: An Interdisciplinary Approach Join the transition towards a circular economy considering economic, supply chain, social, technical, managerial and environmental aspects. Organizer: Wageningen University & Research Circular Economy for a Sustainable Built Environment Learn how the principles of the Circular Economy can be applied to the built environment ranging from products and buildings to metropolitan and regional development strategies. Organizer: TU Delft Business and Economics for a Circular Economy Learn more about the business and economic aspects of a circular economy, and gain the skills to make the switch to biobased resources and build a sustainable business. Organizer: Wageningen University & Research Capstone Business and Economics for a Circular Economy This Capstone project is the final part of the MicroMasters program Business and Economics for a Circular Economy. Interdisciplinarity is central in this part, linking the various sections in this Micromaster. Organizer: Wageningen University & Research Engineering Design for a Circular Economy Discover and develop sustainable design and engineering methods to improve the reuse, repair, remanufacturing, and recycling of products for a circular economy. Organizer: TU Delft Waste Management and Critical Raw Materials Learn about waste management and its key role in saving critical raw materials. Gain practical knowledge of the circular economy, recycling, refurbishment, and remanufacturing as a means of identifying new business opportunities. Organizer: TU Delft Sustainable Packaging in a Circular Economy Learn how to apply the principles of the circular economy to sustainable packaging systems. Organizer: TU Delft Circular Economy – Sustainable Materials Management This course looks at where important materials in products we use every day come from and how these materials can be used more efficiently, longer, and in closed loops. Organizer: Lund University, EIT RawMaterials, VITO, Geological Survey of Denmark and Greenland, National Technical University of Athens, Ghent University, Delft University of Technology Business and Operations for a Circular Bio-Economy In this course you will understand and evaluate strategic, technological, and operational aspects of running a biobased business, understand the basics of biobased materials and their conversion to useful products and services, identify factors that affect biobased investments and innovations and design and evaluate biobased supply chains using quantitative methods Circular Product Design Assessment This course is aimed at helping design professionals such as product architects and industrial design engineers to make their products more circular. By learning how to use unique methods and tools, you will be able to assess the circularity of your product, and to make informed decisions – from minor tweaks to a complete redesign. This course addresses emerging standards for circularity (such as prEN45554) and will be of value both to those working on improving existing products and those creating new ones. Sustainable Food Security: The value of systems thinking This course is for anyone who is interested in learning why food is essential in your daily life. Your daily food choices do not only affect your health, but also have an impact on our planet. For example, how much land, energy and nutrients are needed to produce various foods? And which pollutants are emitted to the air and water while producing these foods? To address such issues, you need to understand the complexity of food production systems and to be able to critically evaluate their environmental sustainability. In this course you will learn to apply the principles of systems thinking to food production systems, particularly in relation to their environmental impact. This knowledge is essential if you wish to engage yourself in developing environmental friendly food production. You may also like… Case studies: Berlin Other circular cities Stay up to date with all things circular economy in Berlin."
