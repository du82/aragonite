title = "Who | Circular Berlin"
description = "We are a network of professionals and organizations, working together to accelerate Berlin’s transition to a circular city."
full_description = "OUR TEAM Dina Padalkina Founder & CEO, City & Built Environment Lead LinkedIn Arianna Nicoletti Textiles & Fashion Lead LinkedIn Tobias Jänecke Education team & Circular Design Expert LinkedIn Julius Schäufele Built Environment team: circular construction processes | Founder of Concular LinkedIn Ronja Scholz Education team & Service Design Expert | Fraunhofer IZM LinkedIn Maximilian Mauracher Circular Consumption team LinkedIn Patrick Teuffel Built Environment team: Circular engineering and materials LinkedIn Cherelle Escaffre Textile team: research and materials LinkedIn Inga Mücke Communications & PR Lead | team: food & hospitality LinkedIn Rémi Laoubi Head of Electronics Sector LinkedIn Anna Reiners Education team LinkedIn Laura Llonch Textile team: proposal development and research LinkedIn Sarah Keller Textile team: proposal development and research LinkedIn Davit Markosyan Food and Hospitality: project support LinkedIn Josi Quitzke Textile team: Proposal and content development LinkedIn Cristina Orizzonte Built environment: interior design and architecture LinkedIn Daniela Raffo Built environment: project support and education LinkedIn Valeria Ossio Food and Hospitality: project support LinkedIn Arno Bouma Community & Operations Management LinkedIn Stefan Aufrichter Project Management Tech & Spaces LinkedIn Irali Rodarte Events Lead LinkedIn Meg Koch Education Lead LinkedIn Omar Mohammed Community building team LinkedIn Laura Grotenrath Education Team & Zero Waste Expert LinkedIn You Project management in Construction and Education (read the profile) You Administrative Assistant / Verwaltungsassistent*in (read the profile) OUR FURTHER SUPPORTERS Friends of Circular Berlin Cooperation partners and funding institutions Our journey Finding the local actors Our story started when 4 volunteers joined forces to organize the Circular Economy Mapping event in February 2018. Together we discovered more than 120 initiatives in Berlin which are involved in the circular economy. Along with the impressive results, it marked the beginning of a fruitful collaboration with EIT Climate-KIC and Berlin Partner. Identifying industries with circular potential The collaboration with Climate-KIC continued, supporting an in-depth research study on what approach should be taken to “anchor” the circular economy topic in Berlin. This gave the first impulse for developing Circular Berlin as a platform. The research identified 4 industries with great circular development potential in Berlin: the built environment, food & biomass, textile & fashion, and materials & products. Mapping industry hurdles and opportunities In a next step, we brought together the local actors through the dedicated industry events. We aimed to find the main hurdles standing in the way of developing more circular practices, as well as defining tangible solutions to overcome them. Photo credit: Ian Delu / sinnwerkstatt.com Expanding our reach We are currently focusing on expanding our reach through community-building, education, project development, research as well as developing a local circular economy agenda. As a non-profit, we rely on financial contributions from people and organisations who believe our work is valuable and helpful. We appreciate your support. Support Circular Berlin NEWSLETTER Stay up to date with all things circular economy in Berlin."
