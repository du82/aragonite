metimes free!) where you can meet other members or even be a speaker at the event itself! WHAT OUR MEMBERS SAY I joined Circular Berlin at the end of 2020 and my focus in the community is to support the construction team and projects. It is a very interesting mix of people: on the one hand it is a local organisation with emphasis on Berlin, and on the other hand many members have an international background with a huge variety of expertise. Within the first months of joining quite a few initiatives and projects have already kicked off. I’m looking forward to seeing how they develop in the near future.Patrick TeuffelFounder of Teuffel Engineering ConsultantsBefore joining Circular Berlin, I found the resources out there to learn about the circular economy were quite limiting. Thanks to this engaging network, I quickly expanded my knowledge on topics such as circular food and textiles, all while meeting local like-minded people. Being part of this community has been an enriching experience, personally and professionally!Sofia Elisabeth RatzingerGraphic designerCircular Berlin is a place for meeting fascinating people who have lots of cool ideas and valuable experiences in making the Circular Economy happen. I found our project partners for an innovative circular economy training program in the Circular Berlin community, as well as our graphic designer for the final project report. Looking forward to the next collaboration to make cities more circular.Martin StavenhagenCo-founder of Get Circular with SD Consulting DISCOVER OUR MEMBERS From fashion to electronics, our community members cover a wide range of fields and backgrounds. Not only that, we have members coming from different areas of involvement; from community members to team members, to organisations. What's our commonality? Our passion and enthusiasm for driving the Circular Economy forward! ALL Textiles 11 Marketing 2 Strategy 17 Healthcare 1 Communications 7 LCA 2 Circular Berlin Team 14 Education 12 Project Management 10 Carbon Footprint 1 Built Environment 7 Business Development 6 Food 6 Waste Management 2 Design 6 Industrial Design 2 supply chain 1 Facilitation 4 Engineering 1 IT 1 Electronics 1 <img loading="lazy" decoding="async" width="600" height="878" data-skip-lazy src="https://circular.berlin/wp-content/uploads/2021/05/Individual-Members-1.jpg" class="wp-image-10428" alt="" srcset="https://circular.berlin/wp-content/uploads/2021/05/Individual-Members-1.jpg 600w, https://circular.berlin/wp-content/uploads/2021/05/Individual-Members-1-205x300.jpg 205w, https://circular.berlin/wp-content/uploads/2021/05/Individual-Members-1-8x12.jpg 8w, https://circular.berlin/wp-content/uploads/2021/05/Individual-Members-1-500x732.jpg 500w" sizes="auto, (max-width: 600px) 100vw, 600px" /> Andreia Ferreira Ruivo Marketing & product marketing leader working for high-profile startups and scale ups in London, Rome and Berlin <img loading="lazy" decoding="async" width="600" height="878" data-skip-lazy src="https://circular.berlin/wp-content/uploads/2021/05/Angie-Aguirre.jpg" class="wp-image-10629" alt="" srcset="https://circular.berlin/wp-content/uploads/2021/05/Angie-Aguirre.jpg 600w, https://circular.berlin/wp-content/uploads/2021/05/Angie-Aguirre-205x300.jpg 205w, https://circular.berlin/wp-content/uploads/2021/05/Angie-Aguirre-8x12.jpg 8w, https://circular.berlin/wp-content/uploads/2021/05/Angie-Aguirre-500x732.jpg 500w" sizes="auto, (max-width: 600px) 100vw, 600px" /> Angie Aguirre Migrant Female Entrepreneur. Small Business & Circular Fashion Activist. Upcycling Designer and founder of THERAPY RECYCLE & EXORCISE. <img loading="lazy" decoding="async" width="497" height="463" data-skip-lazy src="https://circular.berlin/wp-content/uploads/2021/05/Anita-Moller.jpg" class="wp-image-8390" alt="" srcset="https://circular.berlin/wp-content/uploads/2021/05/Anita-Moller.jpg 497w, https://circular.berlin/wp-content/uploads/2021/05/Anita-Moller-300x279.jpg 300w, https://circular.berlin/w