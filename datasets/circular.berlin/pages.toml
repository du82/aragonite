metimes free!) where you can meet other members or even be a speaker at the event itself! WHAT OUR MEMBERS SAY Before joining Circular Berlin, I found the resources out there to learn about the circular economy were quite limiting. Thanks to this engaging network, I quickly expanded my knowledge on topics such as circular food and textiles, all while meeting local like-minded people. Being part of this community has been an enriching experience, personally and professionally!Sofia Elisabeth RatzingerGraphic designerI joined Circular Berlin at the end of 2020 and my focus in the community is to support the construction team and projects. It is a very interesting mix of people: on the one hand it is a local organisation with emphasis on Berlin, and on the other hand many members have an international background with a huge variety of expertise. Within the first months of joining quite a few initiatives and projects have already kicked off. I’m looking forward to seeing how they develop in the near future.Patrick TeuffelFounder of Teuffel Engineering ConsultantsCircular Berlin is a place for meeting fascinating people who have lots of cool ideas and valuable experiences in making the Circular Economy happen. I found our project partners for an innovative circular economy training program in the Circular Berlin community, as well as our graphic designer for the final project report. Looking forward to the next collaboration to make cities more circular.Martin StavenhagenCo-founder of Get Circular with SD Consulting DISCOVER OUR MEMBERS From fashion to electronics, our community members cover a wide range of fields and backgrounds. Not only that, we have members coming from different areas of involvement; from community members to team members, to organisations. What's our commonality? Our passion and enthusiasm for driving the Circular Economy forward! ALL Textiles 11 Marketing 2 Strategy 17 Healthcare 1 Communications 7 LCA 2 Circular Berlin Team 14 Education 12 Projec