title = "Datenschutzerklärung | Circular Berlin"
full_description = "Datenschutzerklärung und Cookie-Regelungen Haben wir etwas nicht umfasst? Schreibe uns und wir melden uns bald zurück. Mit der folgenden Datenschutzerklärung möchten wir Sie darüber aufklären, welche Arten Ihrer personenbezogenen Daten (nachfolgend auch kurz als “Daten“ bezeichnet) wir zu welchen Zwecken und in welchem Umfang verarbeiten. Die Datenschutzerklärung gilt für alle von uns durchgeführten Verarbeitungen personenbezogener Daten, sowohl im Rahmen der Erbringung unserer Leistungen als auch insbesondere auf unseren Webseiten, in mobilen Applikationen sowie innerhalb externer Onlinepräsenzen, wie z.B. unserer Social-Media-Profile (nachfolgend zusammenfassend bezeichnet als “Onlineangebot“). Die verwendeten Begriffe sind nicht geschlechtsspezifisch. Stand: 13. Februar 2025 Verantwortlicher Circular City – Zirkuläre Stadt e.V. Rheinsberger Straße 34 10435 Berlin, Deutschland Vertretungsberechtigte Personen: Dina Padalkina, Arianna Nicoletti E-Mail-Adresse: team@circular.berlin Impressum: circular.berlin/imprint Diese Datenschutzerklärung beschreibt die Richtlinien von Circular City – Zirkuläre Stadt e.V., hinsichtlich der Erhebung, Nutzung und Offenlegung Ihrer Informationen, die wir erfassen, wenn Sie unsere Website (https://circular.berlin) nutzen (der „Dienst“). Durch den Zugriff auf oder die Nutzung des Dienstes stimmen Sie der Erhebung, Nutzung und Offenlegung Ihrer Informationen gemäß dieser Datenschutzerklärung zu. Wenn Sie dem nicht zustimmen, greifen Sie bitte nicht auf den Dienst zu oder nutzen Sie ihn nicht. Wir können diese Datenschutzerklärung jederzeit ohne vorherige Ankündigung ändern und die überarbeitete Datenschutzerklärung im Dienst veröffentlichen. Die überarbeitete Richtlinie tritt 180 Tage nach ihrer Veröffentlichung in Kraft, und Ihre fortgesetzte Nutzung des Dienstes nach diesem Zeitraum stellt Ihre Zustimmung zur überarbeiteten Datenschutzerklärung dar. Daher empfehlen wir Ihnen, diese Seite regelmäßig zu überprüfen. Wie wir Ihre Informationen nutzen: Wir verwenden die Informationen, die wir über Sie erfassen, für die folgenden Zwecke: Zahlungsabwicklung Verwaltungsinformationen Schutz der Website Falls wir Ihre Informationen für andere Zwecke verwenden möchten, werden wir Ihre Zustimmung einholen und Ihre Informationen nur mit Ihrer Zustimmung und ausschließlich für die Zwecke nutzen, für die Sie Ihre Zustimmung erteilt haben, es sei denn, wir sind gesetzlich dazu verpflichtet, anderweitig zu handeln. Wie wir Ihre Informationen weitergeben: Wir werden Ihre personenbezogenen Daten ohne Ihre Zustimmung nicht an Dritte weitergeben, außer in den folgenden begrenzten Fällen: Analysen Datenerhebung & -verarbeitung Wir verlangen von solchen Dritten, dass sie die übertragenen personenbezogenen Daten nur für den Zweck verwenden, für den sie übermittelt wurden, und sie nicht länger aufbewahren, als es für die Erfüllung dieses Zwecks erforderlich ist. Darüber hinaus können wir Ihre personenbezogenen Daten offenlegen, um: (1) geltendem Recht, Vorschriften, Gerichtsbeschlüssen oder anderen rechtlichen Verfahren nachzukommen; (2) unsere Vereinbarungen mit Ihnen durchzusetzen, einschließlich dieser Datenschutzerklärung; oder (3) auf Ansprüche zu reagieren, dass Ihre Nutzung des Dienstes die Rechte Dritter verletzt. Falls der Dienst oder unser Unternehmen mit einem anderen Unternehmen fusioniert oder übernommen wird, werden Ihre Informationen als Teil der übertragenen Vermögenswerte weitergegeben. Ihre Rechte: Abhängig von den geltenden Gesetzen haben Sie möglicherweise das Recht, auf Ihre personenbezogenen Daten zuzugreifen, diese zu korrigieren oder zu löschen, eine Kopie Ihrer Daten zu erhalten, die Verarbeitung Ihrer Daten einzuschränken oder ihr zu widersprechen, uns aufzufordern, Ihre personenbezogenen Daten an eine andere Stelle zu übertragen, eine erteilte Einwilligung zur Datenverarbeitung zu widerrufen oder eine Beschwerde bei einer Aufsichtsbehörde einzureichen. Zur Ausübung dieser Rechte können Sie uns unter dina(a)circular.berlin kontaktieren. Wir werden auf Ihre Anfrage gemäß den geltenden Gesetzen reagieren. Sie können sich von Direktmarketing-Kommunikationen oder der von uns zu Marketingzwecken durchgeführten Profilerstellung abmelden, indem Sie uns unter inga(a)circular.berlin kontaktieren. Bitte beachten Sie, dass, falls Sie uns nicht gestatten, die erforderlichen personenbezogenen Daten zu erfassen oder zu verarbeiten, oder falls Sie Ihre Zustimmung zur Verarbeitung widerrufen, Sie möglicherweise nicht auf bestimmte Dienste zugreifen oder diese nutzen können. Cookies usw.: Weitere Informationen zur Nutzung dieser Technologien und zu Ihren Wahlmöglichkeiten in Bezug auf diese Tracking-Technologien finden Sie in unserer Cookie Policy.. Sicherheit: Die Sicherheit Ihrer Informationen ist uns wichtig, und wir ergreifen angemessene Sicherheitsmaßnahmen, um Verlust, Missbrauch oder unbefugte Änderung Ihrer Informationen zu verhindern. Aufgrund der inhärenten Risiken des Internets können wir jedoch keine absolute Sicherheit garantieren und übernehmen daher keine Haftung für eine unbefugte Offenlegung von Informationen, die Sie uns übermitteln. Links zu Drittanbietern & Nutzung Ihrer Informationen: Unser Dienst kann Links zu anderen Websites enthalten, die nicht von uns betrieben werden. Diese Datenschutzerklärung gilt nicht für die Datenschutzrichtlinien oder sonstigen Praktiken Dritter, einschließlich Dritter, die eine Website oder einen Dienst betreiben, der über einen Link im Dienst zugänglich ist. Wir empfehlen Ihnen dringend, die Datenschutzerklärung jeder Website, die Sie besuchen, zu überprüfen. Wir haben keine Kontrolle über und übernehmen keine Verantwortung für den Inhalt, die Datenschutzrichtlinien oder -praktiken von Websites oder Diensten Dritter. Auf bestimmten Seiten unserer Website werden externe Dienste geladen: Auf der Kalender-Seite wird ein Skript vom Kalenderanbieter (Teamup) geladen. Auf der Ökosystem-Seite wird eine Ressource von „kumu.io“ geladen. Auf der Mitgliedschaftsseite wird ein Dienst von typeform.com verwendet. Auf der Spendenseite wird ein Widget von Twingle eingebunden. Beschwerde / Datenschutzbeauftragter: Falls Sie Fragen oder Bedenken hinsichtlich der Verarbeitung Ihrer Daten haben, können Sie unseren Datenschutzbeauftragten unter Circular City – Zirkuläre Stadt e.V., Rheinsberger Str. 34, E-Mail: arno(a)circular.berlin kontaktieren. Wir werden Ihre Bedenken gemäß den geltenden Gesetzen bearbeiten. Datenschutzerklärung erstellt mit CookieYes."
