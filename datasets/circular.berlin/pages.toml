["https://circular.berlin/de/an-exchange-program-with-the-or-foundation-from-ghana"]
title = "An exchange program with the Or Foundation from Ghana | Circular Berlin"
full_description = "Unsere Neuigkeiten Ein Austauschprogramm mit der Or Foundation aus Ghana Vom 29. Juni bis zum 5. Juli 2024 führten wir in Zusammenarbeit mit unserem Partner, der Or Foundationein einwöchiges Austauschprogramm durch, zu dem eine Delegation aus Ghana nach Berlin kam. Die Delegation bestand aus Designer:innen, Einzelhändler:innen, Spezialist:innen für Wiederaufbereitung, Forscher:innen, Unternehmer:innen und Abfallmanagement-Expert:innen aus der Kantamanto-Gemeinschaft. Das sechstägige Programm bestand aus einer Reihe ausgewählter Aktivitäten, die strategisch mit der gleichzeitig stattfindenden Berlin Fashion Week (BFW) abgestimmt wurden mit dem Ziel, den Dialog und die Zusammenarbeit zwischen verschiedenen Akteur:innen zu fördern und das Bewusstsein für die erweiterte Herstellerverantwortung (EPR) zu schärfen. fostering dialogue and collaboration among different stakeholders and raising awareness of Extended Producer Responsibility (EPR). Begleitet vom Textil-Team hatten die acht Delegiert:innen die Möglichkeit, Einrichtungen für das Abfallmanagement wie die Nochmall und Textilhafenzu besichtigen, bei den 202030 summit Vorträgen und BFW-Veranstaltungen dabei zu sein, sich mit lokalen Innovator:innen im Bereich Kreislaufwirtschaft wie Open Funk, Berlin Textile Coop, und Natascha Von Hirschhausensowie an praktischen Workshops teilzunehmen, die von Upcycling-Designer:innen aus Berlin und Ghana geleitet wurden. Darüber hinaus nahmen sie an einer Diskussionsrunde im Bundestag mit deutschen Entscheidungsträger:innen teil und bereicherten mit ihrer Expertise einen Multi-Stakeholder-Workshop, der sich der Erforschung, Gestaltung und Harmonisierung von EPR-Textilrichtlinien aus einer dekolonialen Perspektive widmete. Diese Aktivitäten wurden unterstützt von der Bundeskanzler-Helmut-Schmidt-Stiftung, Engagement Global (FEB-Programm) und der Nord-Süd-Brücken Stiftung durch den Service für Entwicklungsinitiativen, Landesstelle für Entwicklungszusammenarbeit (LEZ) Programm. (Oben links beginnend: Rebecca, Laura, Sarah, Josi, Latifah, Liz, Branson, Paul, Solomon, Lavinia, Arianna, Nabi, Cherelle, Olivia und Mawuli) Hier ist eine kurze Zusammenfassung unseres Austauschprogramms: Tag 1: Verbunden durch Textilien Zum Projekt Kick-Off unseres Austauschprogramms starteten wir mit der Delegation aus Ghana mit einer Einführungsveranstaltung in unserem Co-Working Space im St. Oberholz. Dabei hatten wir die Gelegenheit, mehr über unsere jeweiligen Hintergründe sowie die Arbeit und Initiativen, die wir in unseren Organisationen leiten, zu erfahren. Bei diesem ersten Treffen konnten wir nicht nur eine persönliche Verbindung zueinander aufbauen, sondern haben auch unsere Erwartungen für die Woche festgelegt. Nach dem Mittagessen veranstalteten wir eine besondere Ausgabe einer Textile Journey, die sich auf 'Remake' konzentrierte. Dabei schloss sich uns eine Gruppe von Textilbegeisterten an und wir begaben uns auf eine Entdeckungsreise durch die Straßen von Friedrichshain, um weggeworfene Kleidung zu finden. In nur einer Stunde sammelten wir dabei 26 kg Kleidung. Während des zweiten Teils der Veranstaltung konnten die Teilnehmenden die Auswirkungen der Mode und der globalen Bekleidungsindustrie auf das individuelle Leben und die Umwelt analysieren, reflektieren und diskutieren. Unter dem Thema 'Remake' war der letzte Teil des Events dem Erlernen von Upcycling-Techniken gewidmet. Die Gruppe wurde in zwei verschiedene Workshop-Stationen aufgeteilt: Bei der einen Station konnten die Teilnehmenden mit einer Zero-Waste-Technik experimentieren, die von Nabi Yankey, dem Spezialisten der Or Foundation für Wiederaufbereitungen, gelehrt wurde. An der anderen Station, angeleitet von dem Upcycling-Designer Philip Wehahn von TingDing, lernte die Gruppe, wie man aus Herrenhemden tragbare Kleider macht. Kurz gesagt, der Samstag war eine vielfältige Mischung aus praktischen Aktivitäten, tiefgehenden Diskussionen und aufschlussreichen Erkenntnissen über den Zustand von Textilabfällen und den Herausforderungen für die Förderung einer Kreislaufwirtschaft. Eine wichtige Erkenntnis war, dass Missverständnisse derzeit ein effektives Abfallmanagement behindern. Es ist daher notwendig, dass die Modeindustrie Begriffe im Zusammenhang mit Textilabfällen standardisiert. Tag 2: Lernen, mit Abfall umzugehen: vom Design bis zur Textilsammlung Am Montag besuchten wir die Nochmall, den Textilhafen und Natascha Von Hirschhausen und erhielten wertvolle Einblicke in verschiedene Aspekte nachhaltigerer Mode und des Abfallmanagements. Im Textilhafen erfuhren wir von Beatrix Landsbek von der Berliner Stadtmission mehr über deren inklusives Sozialunternehmensmodell, die bedeutenden Auswirkungen auf die Gemeinschaft und die Herausforderungen, denen sie sich bei der Entsorgung von Abfällen und der Qualität der Spenden stellen müssen. Wir diskutierten über die Bedeutung umfassender Daten der Textilzusammensetzung sowie über das Potenzial von einer Erhöhung der Materialpreise, der Erweiterung der Lagerkapazitäten und zur Verbesserung der Unterstützung für Upcycling- und Recycling-Initiativen. Beatrix Landsbek from Berliner Stadtmission, we learned about their inclusive social enterprise model, significant community impact, and the challenges they face with waste disposal and donation quality. We discussed the importance of comprehensive data on textile composition, and the potential for raising prices for materials, expanding storage, and enhancing support for upcycling and recycling initiatives. Später am Tag fuhren wir zur Nochmall, um Jens, den Leiter für Logistik und Kulturveranstaltungen, zu treffen. Er gab uns einen Einblick in das schnelle Wachstum seit der Eröffnung vor vier Jahren, den Fokus auf die Gemeinschaftsarbeit durch kulturelle Events wie Repair Cafés, Kinderworkshops, Auktionen und Modenschauen sowie die Herausforderungen bei der Verwaltung von Kleiderspenden und der Förderung nachhaltiger Marken. Zuletzt besuchten wir Modedesignerin Natascha Von Hirschhausen, deren Designs einer Zero-Waste-Philosophie folgen. Sie produziert lokal und verwendet biologisch abbaubare Materialien. Sie bildet auch aktiv andere in der Branche durch Workshops und Beratung zum Thema nachhaltige Mode aus. Da sie gerade eine besondere Ausstellung für die BFW vorbereitete, hatten wir die Gelegenheit, einen ersten Blick darauf zu werfen. Es war sehr inspirierend, über ihr Engagement zur Minimierung von Abfall und die Einbeziehung der Träger:innen in den Prozess zu erfahren. Tag 3: Begegnung mit Innovationsschaffenden aus dem Ökosystem der Kreislaufwirtschaft Der Dienstag stand im Zeichen lokaler, Graswurzel-Innovationen zur Bekämpfung globaler Textil- und Elektronikabfälle. Zunächst trafen wir uns mit Sara Diaz Rodriguez, Mitbegründerin von Studio HILO, im Textile Co-op, einem Zentrum für Dialog und Innovation in der Textilbranche in Friedrichshain. Dort erfuhren wir von HILOs bahnbrechenden Open-Source-Werkzeugen für die Textilproduktion, einschließlich des E-Spinners, Recyclingmaschinen und Entwurf-Maschinen – alle aus modularen und kompatiblen Komponenten gebaut, die breiteren Zugang und Kooperation fördern. Wir waren begeistert, mögliche Synergien für eine Zusammenarbeit mit der Or Foundation zu entdecken und eine aus dem Laser geschnittene Holz- Spinnmaschine auszuprobieren. Wie Sara betonte, sollte der Fokus auf der Skalierung von Lösungen liegen, das heißt, sie für andere zugänglich zu machen, anstatt sie nur für unseren eigenen Nutzen zu vergrößern. Als Nächstes besuchten wir die Gründer von Open Funk, Paul Anca und Ken Rostand, im Makerspace MotionLab.Berlin. Sie berichteten von ihrem Weg, angefangen bei den Herausforderungen, die bei der Reparatur defekter Geräte auftreten – wie zum Beispiel bei Mixern, die oft günstiger zu ersetzen als zu reparieren sind – bis hin zur Entwicklung ihres eigenen Ansatzes zur Kreislaufwirtschaft. Das Engagement von Open Funk für Langlebigkeit spiegelt sich in ihren Mixern wider, die über einfache, leicht reparierbare Motoren verfügen und darauf ausgelegt sind, die typische Lebensdauer von sechs Jahren weit zu überschreiten. Bei diesem Besuch kamen viele interessante Gespräche zustande, von den fehlenden Makerspaces in Accra bis hin zu ihrem Interesse, lokale Elektronikabfälle für die Herstellung zu nutzen und ihre Lösungen in umfassendere Bemühungen für ein Abfallmanagement zu integrieren. Der Tag endete schließlich mit zwei separaten Veranstaltungen. Zunächst fand eine Community-Class auf der Bühne des 202030 Summit statt, bei der Nabi Yankey, Paul DuFour, Liz Ricketts, Latifa Bukari und Solomon Noi von der Or Foundation sowie unsere zweite Vorsitzende und Leiterin des Textil-Teams, Arianna Nicoletti, teilnahmen. In der Diskussion ging es um das Fehlen einer universellen Definition von Qualität und die Risiken für Händler mit unverkäuflichen Textil-Ballen sowie die Notwendigkeit systemischer Veränderungen, besseres Abfallmanagement und die Stärkung lokaler Gemeinschaften durch praktische Maßnahmen statt durch Strafmaßnahmen. Arianna Nicoletti. The discussion touched on the lack of a universal definition of quality and the risks faced by traders with unsellable bales, as well as the need for systemic change, better waste management and empowering local communities through practical actions rather than punitive measures. Zum Abschluss des Tages wurden wir zum „Black in Fashion“-Pop-up auf der Berlin Fashion Week eingeladen, das im gemeinsamen Studio von Buki Akomolafe und Emeka stattfand. Die Veranstaltung war sehr lebhaft, voller wunderbarer Designs und inspirierender Gespräche darüber, wie man die Modewelt gestalten kann, um Verbindungen zu fördern und vielfältigen kreativen Stimmen mehr Sichtbarkeit zu geben. Tag 4: Zeit für Erkundungen Am Mittwoch teilte sich die Delegation in zwei Gruppen. Während einige Tau Pibernat, den Mitbegründer des Urban Fibres , trafen, um mehr über deren Arbeit in der Umwandlung weggeworfener Kleidungsstücken in recyceltes Garn zu erfahren, gingen andere zum 202030 Summit. Während der Podiumsdiskussion, die von von Lavinia Muth, moderiert wurde, mit Liz Ricketts von der Or Foundation und Solomon Noi von der Accra Metropolitan Assembly als Gastredner:innen, wurde den Teilnehmenden die Komplexität und das Ausmaß des Abfalls Kolonialismus nahe gebracht. Liz erinnerte uns daran, dass wir es mit einem Erbe von Abfall zu tun haben, das vor 10/20 Jahren auf den Markt gebracht wurde, und dass wir jetzt Regulierungen und Maßnahmen brauchen, um diese Krise bewältigen zu können. Tag 5: Textilabfälle angehen: von der Politik bis zum Design Der Tag begann im Deutschen Bundestag, wo wir die Gelegenheit hatten, mit mehreren Abgeordneten wie Michael Thews, Jürgen Kretz und Judith Skudelny zu sprechen und die bevorstehende Überarbeitung der EU-Abfallrahmenrichtlinie zu diskutieren. An diesem Tag war auch Elisabeth Winter von der Bundeskanzler-Helmut-Schmidt-Stiftung dabei, die uns mit einer Rede in die Thematik einführte. Elisabeth Winter from Bundeskanzler-Helmut-Schmidt-Stiftung, who also gave an introductory speech. Insgesamt war es eine sehr positive Podiumsdiskussion, bei der wir uns gehört und ermutigt fühlten, weitere Gespräche darüber zu führen, was eine effektive EPR-Politik für Textilien beinhalten muss, um Fortschritte zu ermöglichen. Zu den besprochenen Themen gehörten die Notwendigkeit, ein EPR-Rahmenwerk unter Berücksichtigung der Abfallhierarchie zu entwickeln, die Bedeutung der Unterstützung von Wiederverkauf und Wiederverwendung von Textilien anstelle eines Exportverbots sowie die Notwendigkeit, Textilien anders zu bewerten als andere Produkte. Nach einer Mittagspause mit der Delegation begaben wir uns in das gemeinsame Studio von Buki Akomolafe und Emeka, um uns auf die zweite praktische Workshop-Erfahrung der Woche einzulassen. Während dieser vierstündigen Veranstaltung genossen wir eine informelle Diskussion über Textilien und das Upcycling aus Notwendigkeit in Ghana. Anschließend folgte eine sehr inspirierende Co-Creation-Session, die von den talentierten Designern Emeka, Buki und Nabi geleitet wurde. Das Ergebnis war ein gemeinsames Kunstwerk aus Textilresten. Ich bin zutiefst stolz auf das Ergebnis dieser Sitzung, da es ein wunderschönes Zusammenspiel verschiedener leidenschaftlicher kreativer Köpfe zeigte, die neue Wege fanden, Textilabfälle durch Handwerk neu zu denken. Um unseren letzten Abend gemeinsam zu feiern, gingen wir in ein pan-afrikanisches Restaurant. Dort verbrachten wir ein paar entspannte Stunden, um uns zu erholen und über unsere gemeinsamen Erfahrungen zu sprechen. Tag 6: Ein Multi-Stakeholder-Workshop, der Deutschland und Ghana verbindet Am letzten Tag organisierten wir einen Multi-Stakeholder-Workshop zum Thema dekolonialer Diskurs und kollaborative Zusammenarbeit im Kontext der erweiterten Herstellerverantwortung (EPR). Die Veranstaltung, die bei Zalandostattfand und von Lavinia Muth moderiert wurde, versammelte eine inspirierende Gruppe von 30 Personen mit unterschiedlicher und höchst relevanter Expertise, darunter Abfallmanagement-Spezialist:innen, Forscher:innen, Unternehmer:innen, NGOs, Entscheidungsträger:innen und Schlüsselakteur:innen im Bereich Mode und Nachhaltigkeit. An diesem Tag hatten wir auch das Vergnügen, das köstliche vegane Catering von Kernvoll zu genießen, das eine großartige Auswahl an lokal hergestellten Produkten bot. Mit dem Ziel, den Dialog und die kollaborative Problemlösung zwischen Stakeholder:innen aus Deutschland und Ghana zu fördern, wurde ein großer Teil der Zeit den Gruppendiskussionen und der Entwicklung von Szenarien gewidmet, wie EPR-Politik gestaltet werden kann, um sicherzustellen, dass sie gerecht und nachhaltig ist sowie vielfältige Perspektiven, insbesondere aus dem Globalen Süden, widerspiegelt. Die Erkenntnisse aus den Gruppendiskussionen haben unser Verständnis erheblich erweitert und werden uns helfen, ein Positionspapier zu erstellen, das an deutsche und europäische Politiker:innen sowie parlamentarische Vertreter:innen weitergegeben wird, um die Entwicklung zukünftiger Textil-EPR-Politik mit zu gestalten. Am Ende der Veranstaltung trafen sich das Circular Berlin-Team und die Delegation zu einem Abschlussgespräch, um die Erfahrungen zu reflektieren, zu hinterfragen, ob die Erwartungen erfüllt wurden, und um die nächsten Schritte zu besprechen. Für mich persönlich war die Organisation und Teilnahme an diesem dynamischen Mix von Veranstaltungen, das Initiieren bedeutungsvoller Verbindungen und Gespräche sowie das umfassende Genießen jedes Moments eine außergewöhnlich spannende und bereichernde Erfahrung auf vielen Ebenen. Ich bin immens stolz auf unser Textil-Team, das eine treibende Kraft war, und der Or Foundation dankbar für das in uns gesetzte Vertrauen. In diesen Tagen fühlte ich mich tief inspiriert von dem gemeinsamen Engagement für Veränderung und dem Einsatz dafür, dass alle Stimmen und Geschichten gehört werden. Ich habe viel über das Erbe de"
