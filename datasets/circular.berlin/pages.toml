full_description = "Diese Satzung wurden am 29.04.2022 aktualisiert. Präambel Der Verein verfolgt ausschließlich und unmittelbar gemeinnützige Zwecke im Sinne des Abschnitts „steuerbegünstigte Zwecke“ der Abgabenordnung. Die Zwecke des Vereins unterstützen die Entwicklung des Themas „Kreislaufwirtschaft“, ein regeneratives System, in dem Ressourceneinsatz und Abfallproduktion, Emissionen und Energieverschwendung durch das Verlangsamen, Verringern und Schließen von Energie- und Materialkreisläufen minimiert werden. Dies kann durch langlebige Konstruktion, Instandhaltung, Reparatur, Wiederverwendung, Remanufacturing, Refurbishing und Recycling erzielt werden. § 1 Name, Sitz und Geschäftsjahr des Vereins Der Verein führt den Namen „Circular City – Zirkuläre Stadt e.V”. Der Verein hat seinen Sitz Berlin. Der Verein ist beim Amtsgericht Berlin im Vereinsregister eingetragen. § 2 Zweck des Vereins (1) Förderung des Umweltschutzes und der Umweltbildung. Zahlreiche Produkte sind aufgrund ihrer chemischen Zusammensetzung, der Art der Rohstoffgewinnung und Verarbeitung sowohl als umwelt- als auch gesundheitsschädlich anzusehen. Für Verbraucher, Unternehmen und Verbände sollen daher die Umwelt- und Gesundheitseigenschaften von Produkten, Produktionsweisen und Verwertungsprozessen transparent gemacht werden. Es soll auf die Umstellung auf eine Produktionsweise hingewirkt werden, bei der bereits in der Produktentwicklung das Ziel der Wiedergewinnung und -verwertung von Rohstoffen in technischen und biologischen Kreisläufen, sowie der Verwendung ausschließlich nicht-toxischer Inhaltsstoffe verfolgt wird. (2) Förderung von Verbraucherberatung und Verbraucherschutz. Das Ziel ist die Information und Aufklärung von Verbrauchern über Nachhaltigkeitsaspekte, wie soziale und umweltbezogene Faktoren, in den unterschiedlichen Gewerben, die lokale Kreislaufwirtschaft in den Städten beeinflussen können. Dadurch soll das Vertrauen von Verbrauchern gestärkt und die Bewältigung des Übergangs zu einer nachhaltigen Wirtschaft, indem langfristige Rentabilität mit sozialer Gerechtigkeit und Umweltschutz verbunden wird, gefördert werden, um dem steigenden Verbraucherinteresse in diesen Belangen nachzukommen. § 3 Tätigkeiten und Maßnahmen des Vereins Der Satzungszweck wird, entsprechend § 60 AO, national und international insbesondere durch folgende Maßnahmen ausschließlich und unmittelbar verwirklicht: 3.1. Initiierung, Unterstützung und Durchführung von Maßnahmen zur Wiedergewinnung der Rohstoffe, wie zum Beispiel der Rückgabe von gebrauchten Produkten an den Hersteller, als auch innovative umweltgerechte (Produkt-)Ideen. 3.2. Vertretung der Interessen der Verbraucher an umwelt- und gesundheitsgerechten Produkten und Prozessen in Wirtschaft und Politik. 3.3. Bewertung und Empfehlung von Umwelt- und Wirtschaftsprozessen zur Erleichterung von Verbraucherentscheidungen. Diese Dienste werden unentgeltlich zur Verfügung gestellt. 3.4. Die Vereinszwecke werden u.a. in Zusammenarbeit mit steuerbegünstigten Körperschaften und Körperschaften des öffentlichen Rechts umgesetzt. 3.5. Die Organisation und Durchführung regelmäßiger öffentlicher Veranstaltungen zum Austausch zwischen Verbrauchern, Praktikern und Fachexperten und der Vermittlung von Fachwissen an Verbraucher. 3.6. Die Organisation und Durchführung regelmäßiger Treffen zur Bündelung und Aufarbeitung von anerkanntem Expertenwissen und bewusstseinsbildender Maßnahmen für die Bildung im Thema Kreislaufwirtschaft. § 4 Finanzierung Die erforderlichen Geldmittel werden durch Mitgliedsbeiträge, Akquisition von Spenden, Bußgeldern, Erbschaften, anderen privaten und öffentlichen Zuwendungen sowie Einnahmen durch Merchandising Produkten und der Organisation von Veranstaltungen aufgebracht. Die Methoden zur Akquisition von Geldern sind z.B. Fundraising, Direktmarketing, Crowdfunding, Spendenaufrufe, Sponsorengelder und Einnahmen aus Veranstaltungen. Die Einnahmen aus wirtschaftlichem Geschäftsbetrieb dürfen den gesetzlich erlaubten Rahmen, Bestimmungen und aktuellen Gerichtsentscheidungen nicht überschreiten. § 5 Gemeinnützigkeit 5.1. Der Verein verfolgt ausschließlich und unmittelbar gemein­nützige Zwecke im Sinne des Abschnitts “Steuer­begünstigte Zwecke” der Abgabenordnung (§§ 56 und 57 AO). 5.2. Der Verein ist unabhängig, politisch, parteipolitisch und konfes­sionell neutral. Er ist selbstlos tätig. Sein Zweck ist nicht auf einen wirtschaftlichen Geschäftsbetrieb gerichtet. Demgemäß dürfen Mittel des Vereins nur für satzungsgemäße Zwecke verwendet werden. Die Mitglieder erhalten keine Zuwendungen aus Mitteln der Körperschaft. 5.3 Der Verein darf keine Personen durch Ausgaben, die dem Vereinszweck fremd sind, oder durch unverhältnis­mäßig hohe Vergütungen begünstigen. 5.4. Die Mitglieder haben bei ihrem Ausscheiden oder bei der Auflösung oder Aufhebung des Vereins keine Ansprüche auf sein Vermögen. § 6 Mitgliedschaft 6.1. Eintritt 6.1.1. Mitglied des Vereins kann jede natürliche Person oder jede juristische Person sein, die sich zum Vereinszweck bekennt. Die Mitgliedschaft ist nicht übertragbar und unteilbar. Voraussetzung für den Erwerb der Mitgliedschaft ist ein Aufnahmeantrag in schriftlicher oder digitaler Form, der an den Vorstand zu richten ist. 6.1.2. Der Verein hat folgende Arten von Mitgliedern: Ordentliche Mitglieder Fördermitglieder Aktive ehrenamtliche Mitglieder Ordentliche Mitglieder haben ein Stimmrecht und leisten einen regelmäßigen Mitgliedsbeitrag an den Verein. Ordentliche Mitglieder, insbesondere Vorstandsmitglieder, sind angehalten, die Ziele des Vereins nach Möglichkeit aktiv zu unterstützen. Fördermitglieder haben kein Stimmrecht, jedoch die Möglichkeit, Vorschläge zu Aktivitäten des Vereins hervorzubringen und Informationen zu erhalten. Fördermitglieder dürfen nicht im öffentlichen Interesse des Vereins agieren ohne Abstimmung mit den ordentlichen Mitgliedern. Fördermitglieder leisten einen regelmäßigen Mitgliedsbeitrag an den Verein. Aktive ehrenamtliche Mitglieder haben kein Stimmrecht. Aktives ehrenamtliches Mitglied kann werden, wer sich durch aktive Mitarbeit und auf eine gewisse Dauer angelegt in einer der Initiativen des Vereins einbringt. 6.1.3. Der Vorstand entscheidet über den Aufnahmeantrag nach freiem Ermessen. Bei Ablehnung des Antrags ist er nicht verpflichtet, dem Antragsteller die Gründe für die Ablehnung mitzuteilen. Die Mitgliederversammlung kann eine Ablehnung mit Mehrheitsbeschluss revidieren. 6.1.4. Die Beitragshöhe wird vom Vorstand festgesetzt und in einer Beitragsordnung festgelegt. 6.1.5. Die im Mitgliedsantrag erfassten persönlichen Daten werden elektronisch erfasst und können gegebenenfalls durch Beauftragte des Vereins, auch für Kontakt-, Informations- und Werbezwecke des Vereins genutzt werden. 6.2. Austritt 6.2.1. Die Mitgliedschaft als Mitglied endet (a) mit dem Tode des Mitglieds. (b) durch Austrittserklärung. (c) durch Ausschluss aus dem Verein. Bei juristischen Personen endet die Mitgliedschaft durch ihre Auflösung, ihre Liquidation, die Eröffnung des Insolvenzverfahrens über ihr Vermögen oder durch Abweisung der Eröffnung des Insolvenzverfahrens über ihr Vermögen mangels Masse. 6.2.2. Der dem Vorstand gegenüber schriftlich zu erklärende Austritt ist jederzeit zum Ende des Geschäftsjahres möglich. 6.2.3. Die Fördermitgliedschaft und aktive ehrenamtliche Mitgliedschaft kann jederzeit fristlos gegenüber dem Verein gekündigt werden. 6.2.4. Eine Rückvergütung von bezahlten Vereinsbeiträgen findet nicht statt. 6.3. Ausschluss 6.3.1. Ein Mitglied kann aus dem Verein ausgeschlossen werden, wenn es in erheblicher Weise gegen den Vereinszweck verstößt, in sonstiger Weise sich grober und wiederholter Verstöße gegen die Vereinssatzung schuldig gemacht hat oder wenn für mindestens zwei Jahre die Beiträge des Mitglieds nicht entrichtet worden sind. 6.3.2. Über den Ausschluss entscheidet der Vorstand mit 2/3 Mehrheit. Dem Mitglied ist vorher Gelegenheit zur Äußerung zu geben. 6.3.3. Die Wiederaufnahme eines ausgeschlossenen Mitgliedes ist frühestens nach Ablauf eines Jahres möglich. Über den Antrag entscheidet der Vorstand mit 2/3 Mehrheit. 6.4. Ehrenmitgliedschaft: 6.4.1. Zu Ehrenmitgliedern des Vereins sollen nur solche Personen ernannt werden, die sich um die satzungsgemäßen Ziele innerhalb oder außerhalb des Vereins besonders verdient gemacht haben. 6.4.2. Über die Ernennung von Ehrenmitgliedern entscheidet der Vorstand. Beitragszahlungen von Ehrenmitgliedern sind freiwillige Leistungen. 6.4.3. Ehrenmitglieder sind nicht stimmberechtigt. § 7 Organe des Vereins Organe des Vereins sind: 7.1. die Mitgliederversammlung 7.2. der Vorstand 7.3. der Beirat (geplant) 7.4. das Präsidium (geplant) 7.5. der Kassenwart § 8 Die Mitgliederversammlung 8.1. Die Mitgliederversammlung ist das oberste Vereinsorgan. Es ist die höchste und letzte Entscheidungs-, Aufsichts- und Beschwerdeinstanz. 8.2. Die Mitgliederversammlung findet einmal im Kalenderjahr, in der Regel im ersten Kalenderquartal, statt. 8.3. Die Einberufung zur Mitgliederversammlung an alle Mitglieder erfolgt schriftlich mindestens vier Wochen vor dem Versammlungstermin durch den Vorstand. Die Tagesordnungspunkte sind in der Einladung bekannt zu geben. Außerordentliche Mitgliederversammlungen können mit einer Frist von 7 Tagen einberufen werden, wenn dies durch Bescheide des Finanzamts für Körperschaften oder des Amtsgerichts Charlottenburg kurzfristig notwendig erscheint. 8.4. Jedes ordentliche Mitglied hat das Recht, Anträge und Vorschläge einzubringen, über die in der Versammlung beraten und abgestimmt wird. Anträge und Vorschläge der ordentlichen Mitglieder müssen dem Vorstand mindestens vier Wochen vor der Versammlung mit entsprechender Begründung bekannt gegeben werden. 8.5. Versammlungsleiter ist der 1. Vorsitzende des Vorstands, bei dessen Verhinderung sein Stellvertreter, der 2. Vorsitzende. § 9 Beschlussfähigkeit der Mitgliederversammlung 9.1. Die Mitgliederversammlung ist ohne Rücksicht auf die Zahl der erschienenen Mitglieder beschlussfähig. 9.2. Die Mitgliederversammlung entscheidet bei Beschlüssen und Wahlen mit einfacher Stimmenmehrheit. Stimmengleichheit bedeutet Ablehnung. Enthaltungen bleiben unberücksichtigt. 9.3. Über Angelegenheiten, die nicht auf der Tagesordnung stehen, ist eine Beschlussfassung nur zulässig, wenn aus der Versammlung kein Widerspruch erhoben wird. Juristische Personen können ihr Stimmrecht durch einen Bevollmächtigten ausüben. 9.4. Beschlüsse über Satzungsänderungen erfordern eine Mehrheit von min. 51% der anwesenden und stimmberechtigten Mitglieder. 9.5. Beschlüsse über eine Änderung des Vereinszwecks oder die Auflösung des Vereins setzen einen schriftlichen Antrag von 1/10 der zu Beginn des Geschäftsjahres festgestellten Mitgliederzahl oder einen vom Vorstand gestellten Antrag voraus. Diese Beschlüsse bedürfen einer Abstimmung in zwei in einem Abstand von frühestens 3 und längstens 6 Monaten aufeinanderfolgenden Mitgliederversammlungen. § 10 Aufgaben der Mitgliederversammlung Die Mitgliederversammlung hat insbesondere folgende Aufgaben zu erfüllen: Entlastung: 10.1. Die Entgegennahme des Berichts des Vorstands und des Kassenwarts. 10.2. Die Entgegennahme der Entlastung des Vorstands durch den Kassenwart. Die Vorlage eines unterschriebenen schriftlichen Berichts ist ausreichend. 10.3. Die Entlastung des Vorstands durch die Mitglieder. Wahlen: 10.4. Die Wahl eines Wahlausschusses, bestehend aus einem Wahlleiter und zwei Wahlhelfern. 10.5. Die Wahl des 1. und 2. geschäftsführenden Vorstands, der nach Ablauf der Amtszeit für 4 Jahre gewählt wird. Wiederwahl ist zulässig. 10.6. Die Wahl des erweiterten Vorstands, der nach Ablauf der Amtszeit für 2 Jahre gewählt wird. Wiederwahl ist zulässig. 10.7. Die Wahl des Schriftführers aus dem Kreis der Mitglieder des erweiterten Vorstands. Wiederwahl ist zulässig. 10.8. Die Wahl des Kassenwarts. Die Wahl kann per Handzeichen erfolgen. Wiederwahl ist zulässig. 10.9. Wahlen in der Mitgliederversammlung finden grundsätzlich schriftlich und geheim statt, es sei denn, dass die Satzung andere Regelungen vorsieht. Nicht geheime Wahlen müssen geheim durchgeführt werden, wenn dies von einem der Mitglieder gewünscht wird. 10.10. Vorgeschlagene Kandidaten dürfen auch in Abwesenheit gewählt werden. Als gewählt gelten sie erst, wenn sie die Wahl durch eine schriftliche Bestätigung angenommen haben. Satzungsänderung, Auflösung, Niederschrift: 10.11. Satzungsänderungen können nur mit einer Mehrheit von min. 51% der anwesenden und stimmberechtigten Mitglieder beschlossen werden. 10.12. Die Auflösung des Vereins kann nur mit einer Mehrheit von min. 51% der anwesenden und stimmberechtigten Mitglieder beschlossen werden. 10.13. Über die Mitgliederversammlung ist vom Schriftführer eine Niederschrift zu fertigen, die von ihm und dem Versammlungsleiter zu unterzeichnen ist. § 11 Der Vorstand 11.1. Der Gesamtvorstand besteht aus dem geschäftsführenden Vorstand, bestehend aus dem 1. Vorsitzenden und seinem Stellvertreter, dem 2. Vorsitzenden, sowie bis zu vier weiteren erweiterten Vorstandsmitgliedern. 11.2. Der Vorstand wählt einen Kassenwart. 11.3. Der geschäftsführende Vorstand vertritt den Verein nach innen und außen. Der geschäftsführende Vorstand – erster und zweiter Vorsitzender – sind jeweils berechtigt, den Verein einzeln und eigenverantwortlich zu vertreten. Der 1. und 2. Vorsitzende vertreten den Verein im Sinne des § 26 BGB. 11.4. Der Vorstand bleibt bis zur satzungsgemäßen Bestellung des nächsten Vorstands im Amt. 11.5. Scheidet ein geschäftsführendes Vorstandsmitglied vor Ablauf der Amtsperiode aus, ist vom Gesamtvorstand für den Rest der Amtszeit aus dem Kreis des erweiterten Vorstands kommissarisch ein neues geschäftsführendes Vorstandsmitglied zu wählen. 11.6. Ein Vorstandsmitglied kann nur aus wichtigem Grund (grobe Pflichtverletzung oder Unfähigkeit zur ordnungsgemäßen Geschäftsführung) abberufen werden. 11.7. Der Vorstand hat das Recht, sich eine Geschäftsordnung zu geben. 11.8. Der Vorstand hat das Recht, zur Erfüllung seiner Aufgaben einen Geschäftsführer sowie Mitarbeiter stundenweise oder Vollzeit einzustellen. Diese können auch Mitglieder aus dem Kreis des Vorstands sein. 11.9. Der Vorstand hat das Recht, sich eine Beitragsordnung zu geben. 11.10. Der Vorstand hat das Recht, eine bekannte Persönlichkeit aus dem öffentlichen Leben die Übernahme der Schirmherrschaft für den Verein anzutragen. Die Aufgaben des Schirmherrn sind vom Vorstand in Abstimmung mit dem Schirmherrn festzulegen. 11.11. Der Vorstand hat das Recht, einen Vorstandsbeauftragten zur Erfüllung gewisser Geschäfte und besonderer Aufgaben zu bestellen und einzustellen. Der “Besondere Vertreter” vertritt den Verein im Sinne des § 30 BGB. 11.12. Der Vorstand hat das Recht, zur Erfüllung umfangreicher Verwaltungsaufgaben, Fundraising und Öffentlichkeitsarbeit gegen angemessenes Entgelt externe Dienstleister zu beauftragen. 11.13. Der Kassenwart prüft den Jahresbericht und den Abschluss des "
