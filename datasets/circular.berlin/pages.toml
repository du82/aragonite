title = "Education | Circular Berlin"
full_description = "Our Berlin-based circular economy, circularity, and zero waste experts offer best-in-class training workshops that combine theoretical understanding with practical applications, hands-on activities, and real-world insights. What our partners tell about us Circular Berlins’ training session was incredibly impactful on a group of already established designers, not an easy group to win over. We worked on real-world challenges, using tools that we then have continued to use in our projects with clients. We would love to partner again!Fjord Berlin Training ParticipantThe Circular Berlin team facilitated two sets of intriguing workshops at our student-run conference about the circular economy. Particularly in face of the uncertainty associated with the COVID-19 pandemic, they were a reliable partner who we can recommend to anyone in need for expertise on the topic.European Public Policy Conference organiserThe workshop provided a systematic overview of what circularity means and what role different organisations play in this respect. Students loved the hands-on nature of the workshop and a multitude of local and global examples helped to translate conceptual thinking into day-to-day applications and practice. Highly recommended.Vlerick Business SchoolÜber 2 Tage haben wir spannende Einblicke in die Zirkuläre Wirtschaft und Berlins Anstrengungen auf diesem Gebiet gewonnen. Im Workshop mit Circular Berlin wurden uns die Grundlagen einer Zirkulären Wirtschaft kompakt und praxisnah vermittelt und zu noch mehr zirkulärem Handel motiviert. Besonders die Kombination mit der Circular City Tour hat den Praxisbezug nochmal unterstrichen. Der Besuch verschiedener Standorte an denen zirkuläre Wirtschaft in Berlin in Bereichen wie Bauen, Abfall und Beschaffung bereits gelebt wird, hat uns wertvolle Erfahrungen für unserer eigenen Arbeit geliefert, vielfältige Inspiration gegebene und zu spannenden Diskussionen angeregt.Neue Effizienz gemeinnützige GmbH With whom we worked Introduction Workshop A fun, engaging class to introduce circular principles using hands-on exercises and real world examples. MoreTailored sector-focused curriculum available at no additional cost for Circular Berlin’s priority industries: food & biomass, materials & products, built environment and textiles & fashion. We offer this class for the public from time to time. If we have any upcoming open classes, you can find them here. After this class, you will… Be able to articulate the theories behind this “circular economy” buzzword Understand how companies and cities are putting this concept into practice right now Have practiced transforming traditional products, business models, and services into circular ones This class is great for: Everyone who is new to circular economy or needs a refresher! Companies, community groups, non-profit organizations, governments, industry associations, academia, professionals, designers, small businesses. Language: English, German Course Length: 4 Hours Toolbox Workshops These in-depth workshop sessions teach professionals about actionable tools and methods that you can start using immediately to bring circular economy practices into your work. MoreOffered in combination with an introductory workshop or as a stand-alone session, depending on the audiences’ needs. Available toolbox workshops include: LCAs Made Simple: The EVR Tool Business Models, But Make Them Circular How-To: Zero Waste Audit How To: Host a Zero Waste Event Less Bad vs. More Good: A New Vision of Value Creation Sustainable Design Strategies Biomimicry in Practice Create an industry symbiosis with the Circularity Compass These classes are great for: Business, nonprofit, and government professionals with a basic foundation in circular economy theory, who want to apply the concepts in their work. Language: English, other languages may be available upon request Course Length: 4 Hours Industry Challenge Workshop Struggling with finding a recycling or reuse option for a waste material? Want to add a rental or repair service to your business model? Have another you have a circularity challenge you’re trying to solve? These sessions are designed around specific cases within your sector or organization. You’ll get dedicated time to brainstorm and problem-solve with experts from both Circular Berlin and leading circularity practitioners from our industry network. MoreAvailable for: Textile and Fashion Construction Food & Restaurants Consumer Goods & Packaging Hospitality & Tourism Events Management Education & Schools These classes are great for: Companies, company teams, or industry associations with a specific circular challenge they want to solve. Language: English, other languages may be available upon request Course Length: Variable Circular Experiences A great addition to any classroom training is the visits to Berlin companies and projects putting circularity into practice. We offer offer customised visits for your group. MoreLanguage: English, German Tour Duration: 2-4 hours Book your workshop Need something specific you don’t see outlined here? Get in touch! We’d be happy to design a training just for you. LEARN FROM OTHERS Deep-dive courses Free circular economy tools NEWSLETTER Stay up to date with all things circular economy in Berlin."
