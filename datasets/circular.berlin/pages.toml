title = "Takeaways from the AGYLE Live Week - Circular Economy Edition | Circular Berlin"
description = "More than 120 submissions were reviewed in a multi-stage matchmaking process with municipalities and institutions."
full_description = "Unsere Neuigkeiten Eindrücke von der AGYLE Live-Woche - Edition Kreislaufwirtschaft Als Teil der AGYLE – African German Young Leaders in Business Kohorte hatte ich die einmalige Gelegenheit, an der Live-Woche des Programms in Berlin vom 16. bis 20. September teilzunehmen. Das AGYLE-Programm ist ein Projekt von Deutschland Land der Ideen das darauf abzielt, junge afrikanische und deutsche Führungskräfte aus Wirtschaft, Politik und Medien zusammenzubringen, um den deutsch-afrikanischen Dialog zu stärken und ein langfristiges Geschäftsnetzwerk aufzubauen, das die Entwicklung innovativer Geschäftsmodelle unterstützt. Das diesjährige Schwerpunktthema des AGYLE-Programms lauteteCircular Economy – How young leaders are shaping the transformationund eine Gruppe von 40 außergewöhnlichen Fachleuten auf dem Gebiet der Circular Economy aus Ghana, Ruanda, Senegal, Tunesien, Äthiopien und Deutschland wurde ausgewählt und nach Berlin eingeladen. Während dieser Woche haben wir uns auf unterschiedliche Weise kennengelernt und wurden mit außergewöhnlichen Rednern, Impact-Investoren, Coaches und Denkerinnen und Denkern zusammengebracht. Es war eine Woche des beruflichen und persönlichen Wandels, des gegenseitigen Zuhörens und der Inspiration, des Voneinander-Lernens und des gemeinsamen Innovierens. Das Programm der Live-Woche wurde vom AGYLE-Team sehr gut zusammengestellt, und ich freue mich, einige Highlights und Erkenntnisse zu teilen. TAG 1 - GEGENSEITIGES KENNENLERNEN & TIEFES EINTAUCHEN IN DIE KREISLAUFWIRTSCHAFT Der erste Tag begann im Impact Hub Berlin mit einer längeren Impro-Theater-Session von Die Gorillas , die sehr dazu beitrug, das Eis zwischen den Teilnehmenden zu brechen und zu lernen, wie wichtig es in der Führungsrolle ist, sich immer aller anderen an einem Projekt Beteiligten bewusst zu sein, zuzuhören und emotional mit seinem Team in Kontakt zu sein. Wir haben während dieser Sitzung unglaublich viel gelacht, und die ersten Verbindungen in der Gruppe haben sich entwickelt. An impro-theater scene during the first day workshop Am Nachmittag erlebten wir eine inspirierende Grundsatzrede von Ramona Liberoff, einer der weltweit bekanntesten Fachleute für Kreislaufwirtschaft. Die wichtigsten Erkenntnisse aus ihrer Rede sind: → Innovation erfordert eine vollständige Neukonzeption der Welt, wie sie ist, und aller Produktionsbereiche. Deshalb brauchen wir die richtigen politischen Führenden, die in der Lage sind, mit langfristigen Visionen zu inspirieren. Ohne eine Diversifizierung der politischen Pipeline können wir dies nicht erreichen. → Anstatt die Verbrauchenden aufzufordern, die Welt zu verändern, sollten wir die Menschen als Wählende auffordern, ihre Führungspersönlichkeiten aufgrund ihrer Meinung zu Klimathemen zu wählen und nicht aufgrund ihrer Persönlichkeit. → Wenn wir die Innovation vorantreiben, sollten wir einen Schritt zurücktreten und das Gesamtbild betrachten: Wer kann noch einbezogen werden? Welches andere Problem könnte in unsere Lösung einbezogen werden? → Strategische Innovation bedeutet, dass manche Dinge gar nicht produziert oder verwendet werden sollten. → Keine Region der Welt ist in der Kreislaufwirtschaft weiter, denn wir sind nirgendwo gemeinsam. Die USA können die Dinge sehr schnell vorantreiben, und die EU kann sehr ehrgeizig vorgehen. Afrika hat ein größeres Verständnis von Kreislaufwirtschaft und Ressourceneffizienz. Wir haben also viel voneinander zu lernen. → Einige der erfolgreichsten und tiefgreifendsten Innovationen bei CE-Projekten sind lokale Projekte. Ramona Liberoff speaking to the AGYLE participants Am Abend trafen wir uns zur Sitzung „Meeting the Circular Champions“ und zum Abendessen mit Peter Schrum (SUNfarming GmbH), Evoléna de Wilde d‘Estmael (Co-Founder und CEO Faircado), Frieder Söling (CEO NochMall), Luise Billen Advisor bei ReTech Germany) und Justus Susewind (Head of Business Development bei ecopals). Sie bestand aus kurzen Einführungen und einer Podiumsdiskussion mit den Unternehmern und ihren konkreten Beispielen für Geschäftsmodelle und Produkte der Kreislaufwirtschaft. Wichtigste Erkenntnisse: → Der Marktzugang für diese innovativen Unternehmen ist immer noch äußerst schwierig, da sowohl B2C-Kunden schwer zu erreichen sind als auch B2B-Partner oft zu konservativ sind, um neue Lösungen auszuprobieren. → Solar-Farming (einschließlich Weidehaltung) ist eine bereits etablierte Praxis, die auch in den Ländern des globalen Südens mehr Gerechtigkeit bringen kann. A picture from the panel. From the left: Peter Schrum, Frieder Söling, the moderator Fatou Ellika Muloshi TAG 2 - VERBINDUNG VON VC UND INDUSTRIE MIT JUNGEN FÜHRUNGSKRÄFTEN Der zweite Tag begann mit einer Sitzung zum Wissensaustausch mit Fachleuten für Risikokapital und Impact Investment. Einige der jungen Führungskräfte hatten auch die Gelegenheit, ihre Vorhaben und Projekte vorzustellen und wertvolles Feedback von den Experten zu erhalten. Das Expertengremium umfasste: Mr. Siegfried Russwurm (President, BDI), Morgan Sheil (Head of Impact bei World Fund), Pauline Koelbl (Founder & Managing Partner bei ShEquity), Niclas-Alexander Mauss (Co-Founder Circular Republic) und Natascha Zeljko (Co-Founder & Executive Partner bei CIRCULAZE). Die wichtigsten Erkenntnisse aus der Podiumsdiskussion: → Junge Unternehmen mit innovativen Ideen müssen extrem strategisch vorgehen, denn sie werden bald mit großen Unternehmen konkurrieren. → Die Skalierbarkeit der Idee und ein klarer Wachstumspfad sind entscheidend, um eine Finanzierung zu erhalten. → Die Zivilgesellschaft und Stiftungen können bei der Risikominderung für Gründende und Start-ups eine Schlüsselrolle spielen. Sie können in der Anfangsphase helfen und ihnen Glaubwürdigkeit verleihen. A pic of the panel discussion including all speakers and the moderator Fatou Ellika Muloshi Am Abend organisierte das AGYLE-Team einen einzigartigen Bootstalk mit dem Unternehmer und Denker Thomas SchindlerAuf seine Grundsatzrede über den Wandel, den unsere Gesellschaft vollziehen muss, um einen neuen nachhaltigen Rahmen für das Leben innerhalb der planetarischen Grenzen zu schaffen, folgte eine Fragerunde im Fishbowl. Die meisten der diskutierten Konzepte können nachgelesen werden in seinem TedTalk mit dem TitelThe Heliogenic civilization”. Was ich persönlich aus den Diskussionen mit den führenden Persönlichkeiten mitnehmen konnte: → Als Teil des Globalen Nordens fällt es den deutschen Führungskräften in CE leichter, an disruptive Szenarien zu glauben, die das LEBEN und menschliche Verbindungen in den Mittelpunkt stellen und sich vom kapitalistischen Wirtschaftssystem wegbewegen, während es für unsere Kollegen aus dem Globalen Süden schwierig war, sich diese Disruption in möglichen realen Szenarien für ihre Länder vorzustellen. Wir brauchen mehr Austausch zu diesem Thema, um eine globalere langfristige Vision für ein blühendes Leben auf dem Planeten zu schaffen. Thomas Schindler talking to the AGYLE participants TAG 3 - BEFÄHIGUNG DER AKTIVEN VON MORGEN Der dritte Tag stand ganz im Zeichen der Kreislaufwirtschaft und der Verbindungen. Dank eines dynamischen, von Thinking Circularhaben die jungen Führungskräfte Modelle und Szenarien für innovative Lieferketten entwickelt und erkundet. In der letzten Sitzung des Workshops ging es um persönliche und geschäftliche Beziehungen: Ich beobachtete fasziniert, wie Eveline Lemke (Gründerin von Thinking Circular) Verbindungen und Kooperationsideen zwischen den Teilnehmenden mit unterschiedlichem Hintergrund und an verschiedenen Orten finden konnte. Nach einem Tag intensiven Austauschs brauchte Eveline nur unseren Herausforderungen zuzuhören, um genau zu wissen, wer von den Teilnehmenden helfen oder ein Team bilden könnte, um diese Hindernisse zu überwinden. Am Ende des Workshops fühlten wir uns alle extrem gestärkt und miteinander verbunden. Meine wichtigste Erkenntnis hier: → Manchmal vergessen wir, dass die Herausforderungen im Zusammenhang mit CE nicht nur systemisch, sondern auch individuell sind. Andererseits kann die Lösung individueller Herausforderungen auch systemische Veränderungen freisetzen. Wir als Einzelpersonen, die in der CE arbeiten, können mit unserem Wissen und unseren Netzwerken andere bei der Überwindung dieser Hindernisse meist leicht unterstützen. Dennoch erfordert der Aufbau dieser Verbindungen und unterstützenden Verbindungen lange, tiefgehende Dialoge. Es braucht Raum und Zeit, um gemeinsam zu forschen. Und manchmal braucht es eine vermittelnde Position, die die Menschen durch den Prozess der gegenseitigen Hilfe führt. Dieser Prozess darf nicht unterschätzt werden. Führungskräfte in der CE sollten mehr Gelegenheiten zum Austausch mit ihren Kollegen aus der ganzen Welt erhalten, aber sie sollten sich auch mehr Zeit dafür nehmen.. Eveline Lemke leading the workshop with the AGYLE participants TAG 4 - STÄRKUNG DER FÜHRUNGSKOMPETENZEN Am Donnerstag tauchten wir tief in das Thema RESILIENCE ein mit Evelyn Kaulartz und Anne Augenvoort von Rethink WorkGemeinsam erforschten wir unsere Schutzfaktoren für Motivation und Resilienz bei der Arbeit und lernten die Grundlagen von Stress und Resilienz kennen. Wir diskutierten auch darüber, was die Konzepte „Gemeinschaft“, „Individualität“ und „Spiritualität“ in unterschiedlichen gesellschaftlichen Kontexten für uns bedeuten und was sie mit unserer persönlichen Resilienz zu tun haben. Durch eine angeleitete Achtsamkeitsübung haben wir ausprobiert, was es bedeutet, im „Hier und Jetzt“ zu sein, und am Ende der Sitzung haben wir in Gruppen daran gearbeitet, unsere „persönlichen Überzeugungen“ zu verstehen und zu überwinden, die die Hauptantriebskräfte sind, denen wir in Stresssituationen folgen. Der ganze Tag war eine intensive persönliche Erfahrung. Wir öffneten uns den anderen Führungskräften auf einer persönlicheren Ebene mit echter Ehrlichkeit. Meine wichtigsten Learnings: → Für die meisten der jungen Führungskräfte im Raum ist der größte Faktor, der sie stark und widerstandsfähig macht, ihre VISION. → Gemeinschaft kann eine Last sein. Für viele der afrikanischen Teilnehmenden bedeutet Erfolg zu haben, ihren Gemeinschaften etwas zurückzugeben (Geld oder andere Hilfe), ohne die Möglichkeit zu haben, selbst darüber zu entscheiden. Oft sind ihre Gemeinschaften in ihrem Alltag zu präsent, was es sogar schwierig macht, ihre Arbeit zu erledigen, da sie ständig unterbrochen werden. Infolgedessen haben die Menschen oft keine Zeit für sich selbst. → Es ist sehr faszinierend, dass Spiritualität und Religion diesen individuellen, sicheren und ruhigen Raum für die meisten der afrikanischen Teilnehmenden schaffen können. Die institutionalisierte Religion am Arbeitsplatz schließt jedoch meist Minderheiten aus anderen Religionen aus, was für einige der Arbeitnehmenden problematisch sein kann und manchmal auch zu Rassismus bei der Einstellung neuer Mitarbeitenden führt. → Spiritualität ist für die afrikanischen Führungskräfte eine große Quelle des Glaubens und der Kraft. → Der Versuch, es allen recht zu machen, ist eine sehr häufige Stressreaktion. Aber anstatt sich durch diese Reaktion ermutigt zu fühlen, entwickeln sich die Situationen in den meisten Fällen so, dass wir uns minderwertig, weniger selbstbewusst und frustriert fühlen. Die Botschaft, die Menschen mit dieser inneren Überzeugung an sich selbst senden sollten, lautet: Es ist mir erlaubt, Nein zu sagen und Grenzen zu setzen. One of the plenary discussions during the day at Launchlabs Am Abend wurden wir mit einer Runde von Reden und Kamingesprächen mit drei unglaublichen Gründenden und Persönlichkeiten verwöhnt, die uns motivierten, indem sie uns die Geschichten ihrer holprigen Karrieren erzählten. Es war ermutigend und anregend, Ratschläge und Inspiration von Alina Bassi (Investment Manager, Ananda Impact Ventures und Co-Founder bei Founderland), Julie Chrysler (Social Business Strategist bei Yunus Environmental Hub), und Till Wahnbaeck (Founder von Impacc). Eine wichtige Erkenntnis hier: → Der Weg zu einer einflussreichen (glücklichen) Karriere ist nicht immer geradlinig und manchmal braucht es Mut, um wichtige Sprünge und Veränderungen zu machen. Dennoch liegt die Lösung darin, unseren inneren Werten zu folgen.. Till Wahnbaeck´s fireside chat with a group of AGYLE participants TAG 5 - REFLEXIONEN UND ABSCHLÜSSE An unserem letzten gemeinsamen Tag wurden wir von Simon Springman, Managing Director von Launchlabszu einer Reflexionsrunde angeleitet. Es war bereichernd, von den Teilnehmenden zu hören, was diese Woche für sie bedeutet hat, was die Höhepunkte waren und was sie sich für diese Gruppe in der Zukunft wünschen. Was für eine Freude zu verstehen, dass sich alle als Teil einer neuen afrikanisch-deutschen Gemeinschaft von Gleichgesinnten fühlten, die mit sehr ähnlichen wertorientierten Visionen arbeiten! Am Ende der Woche spürten alle jungen Führungskräfte des Programms die außergewöhnliche Kraft der beruflichen und persönlichen Verbundenheit mit den anderen und konnten nicht glauben, dass diese Zeit zu Ende geht. Der größte Wunsch für die Zukunft, der in der Feedbackrunde geäußert wurde, war, diese Gemeinschaft am Leben zu erhalten und nach Afrika zu bringen. Am Abend hatten wir dann die einmalige Gelegenheit, einen Vortrag über die Bedeutung des Geschichtenerzählens von Enuma Okorozu hören, einer nigerianisch-amerikanischen Autorin, Schriftstellerin und Kunst- und Kulturkritikerin. In ihrem Vortrag ging es darum, wie wichtig es ist, nach den Geschichten der anderen zu fragen, ihnen zuzuhören und die Hinterlassenschaften dieser Geschichten zu verstehen. Durch ihre Linse und ihre Welten konnten wir all die Geschichten, die wir während der Woche gehört hatten, gedanklich durchgehen und sie in unsere individuellen Erinnerungen einprägen. Es war der perfekte Abschluss für diese unglaubliche Woche der Begegnungen, des Lernens, der Erkundungen und Entdeckungen. Vielen Dank noch einmal an das Team von AGYLE - Land der Ideen für diese außergewöhnliche Chance. Ich bin mir sicher, dass nicht nur die Beteiligten, sondern auch ihre Initiativen, Unternehmen und Organisationen schon jetzt von den Synergien und Kooperationen profitieren, die durch die Live-Woche entstanden sind. Einige konkrete Kooperationsprojekte sind bereits angelaufen. Bleibt dran für mehr! Arianna The AGYLE Young Leaders cohort 2024 saying goodbye from the Rooftop Berlin Text von Arianna Nicoletti Foto Credits: ©AGYLE/Bernd Brundert tags widget:AGYLE Live-Week 2024AGYLE Young Leaderscircular berlincircular economy Share this:"
