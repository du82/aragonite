["https://circular.berlin/de/circular-transformation-does-not-work-alone-it-needs-partnerships"]
title = "Circular transformation does not work alone, it needs partnerships | Circular Berlin"
description = "More than 120 submissions were reviewed in a multi-stage matchmaking process with municipalities and institutions."
full_description = 'Unsere Neuigkeiten Zirkuläre Transformation gelingt nicht allein, sondern braucht Partnerschaften Städte stehen im Zentrum des notwendigen Wandels hin zu mehr Nachhaltigkeit und Klimaschutz. Studien zeigen, dass die Circular Economy ein großer Hebel ist, um die Klimawirkungen unseres Handelns zu reduzieren. Je nach Studie beeinflussen die Art der Produktherstellung und -nutzung 40 % bis gar 80 % der Treibhausgasemissionen. Als Akteure, die wirtschaftliche Stabilität, sichere Arbeitsplätze, günstige Standortbedingungen und vor allem urbane Lebensqualität schaffen müssen, haben Städte eine Schlüsselrolle bei der Gestaltung und Förderung nachhaltiger Produktionsweisen und Konsummuster. Durch die Zusammenarbeit mit Unternehmen und der Bevölkerung können Städte maßgeblich dazu beitragen, die Auswirkungen von Produktherstellung und -nutzung auf das Klima zu reduzieren und so die Lebensqualität in den urbanen Räumen langfristig zu sichern. Wie kann Circular Economy die Kommunen bei der Erreichung der Klimaschutzziele unterstützen? Diesem Potenzial ist die Circular City Challenge auf die Spur gegangen. Vor zweieinhalb Jahren, als die Circular City Challenge ins Leben gerufen wurde, war das Bewusstsein für die Verknüpfung von Kreislaufwirtschaft und Klimaschutz noch nicht weit verbreitet. Im Rahmen dieser Initiative wurden die teilnehmenden Städte und Kommunen eingeladen, ihre spezifischen Herausforderungen im Bereich des Klimaschutzes zu formulieren. Gleichzeitig erhielten Unternehmen die Möglichkeit, ihre Lösungen aus dem Bereich der Kreislaufwirtschaft einzureichen, um einen fruchtbaren Austausch zwischen den verschiedenen Akteuren zu fördern. Um die Lösungsanbieter gezielt anzusprechen, initiierte die Circular City Challenge eine umfassende Kampagne und begann, ein weitreichendes Netzwerk an Multiplikatoren aufzubauen. Unterstützung erhielt die Initiative sowohl auf nationaler als auch auf internationaler Ebene durch Impact Hubs, Business- und Innovation Hubs sowie die Ellen MacArthur Foundation. Parallel dazu wurde eine Kommunikationskampagne gestartet, die mit zahlreichen Informationen und einem öffentlichen Aufruf aufwartete. Die Rückmeldungen kamen aus aller Welt, mit insgesamt etwa 120 eingereichten Lösungen aus Europa, den USA und Asien. Die Ansprechpersonen aus den beteiligten Partnerstädten und Kommunen stammten aus unterschiedlichen Verwaltungsebenen, wobei einige aus den Bezirken agierten, während andere die gesamte Stadt im Blick hatten. “Es gab drei wesentliche Schritte in dieser Challenge. Zunächst haben wir in Zusammenarbeit mit den Städten die Herausforderungen identifiziert. Im diesjährigen Format haben wir gemeinsam mit den kommunalen Partnern in Workshops acht Fokusthemen – darunter die gebaute Umwelt, Mobilität, Industrie und Abfallwirtschaft – erarbeitet, die für die Städte von Bedeutung sind. Im zweiten Schritt folgte der Aufruf an die Lösungsanbieter, während sich der dritte Schritt auf die Datenaufbereitung fokussierte. Hierbei galt es, in den einzelnen Bereichen durch einen Jury-Prozess die Favoriten zu ermitteln. Mit etwa 40 dieser Unternehmen organisierten wir einen digitalen Pitch-Tag, als dessen Ergebnis die 23 vielversprechendsten Lösungen herausgearbeitet wurden“, erläutert Dina Padalkina von Circular Berlin. Die Umsetzung von Kreislaufwirtschaft erfordert partnerschaftliche Zusammenarbeit, da sie sich nicht isoliert realisieren lässt. In vielen Städten und Kommunen stellt die Verfügbarkeit von Ressourcen, insbesondere von Personal, eine Herausforderung dar. Daher ist es umso wichtiger, bestehende Formate und Synergien zu nutzen und entsprechend anzupassen. Um die Kreislaufwirtschaft auf lokaler Ebene erfolgreich zu implementieren, benötigt jede Kommune eine zentrale Anlaufstelle oder ein strategisches Bündnis, das sich mit der Umsetzung dieses Konzepts befasst. Es ist unerlässlich, ein Verständnis dafür zu entwickeln, wie und an welchen Stellen die Circular Economy tatsächlich umgesetzt werden kann. Dabei ist es wichtig, abteilungsübergreifend zu denken und zu arbeiten, insbesondere da Kreislaufwirtschaft oft als Nischenthema wahrgenommen wird, das hauptsächlich von Klimabeauftragten behandelt wird. Ein Beispiel dafür ist das Thema Nachhaltigkeit, das ebenfalls ein Querschnittsthema darstellt und eine enge Zusammenarbeit zwischen verschiedenen Abteilungen erfordert. Viele Kommunen sehen sich zudem einer begrenzten finanziellen Ausstattung gegenüber, die die Umsetzung innovativer Projekte erschwert. Knappe Budgets und fehlende Mittel für zukunftsorientierte Vorhaben verlangen daher kreative Finanzierungsmodelle und eine sorgfältige Priorisierung der Projekte. Magdalena Schmittlein (Gemeinde Zeuthen) betonte die Bedeutung von Mut und finanzieller Flexibilität: „Wir wünschen uns in erster Linie Mut und einen langen Atem. Es braucht freie Mittel, die nicht an den Alltagszweck gebunden sind.“ Auch die personelle Situation stellt ein Problem dar: Zu wenig Personal führt zu Überlastung und verzögert die effiziente Implementierung. Hier sind geschickte Ressourcenallokation und innovative Ansätze zur Effizienzsteigerung gefragt. Ebenso die begrenzte Handlungsbefugnis der kommunalen Partner, die oft lediglich als Vermittler agieren können. Dies erfordert ein hohes Maß an Diplomatie und Überzeugungskraft, um die notwendigen Entscheidungsträger für die Realisierung der Projekte zu gewinnen. Zudem ist die interdepartmentale Abhängigkeit ein komplexer Faktor, da verschiedene Abteilungen mit möglicherweise unterschiedlichen Interessen koordiniert werden müssen. Florian Sorg, der Koordinator für Kreislaufwirtschaft in Stuttgart, sieht seine Rolle vor allem in der Vernetzung und Koordination. Er erkennt die Notwendigkeit, andere Akteure für die Umsetzung zu aktivieren – eine Herausforderung, die sowohl intern als auch extern besteht. Für die Zukunft hält er die Circular City Challenge für ein wertvolles Format, um in den Austausch zu kommen und aktuelle Themen zu diskutieren. Die Circular City Challenge verdeutlicht, dass der Weg zur urbanen Klimaneutralität durch innovative, zirkuläre Ansätze geebnet wird und dass interkommunale Kooperationen dabei eine entscheidende Rolle einnehmen. Der Transformationsprozess bringt vielschichtige Herausforderungen mit sich, die es zu meistern gilt. Die Circular City Challenge hatte sich zum Ziel gesetzt, den städtischen Akteuren die Bedeutung der Kreislaufwirtschaft näherzubringen und ihnen gleichzeitig konkrete, marktreife Lösungsansätze an die Hand zu geben, die bei der Bewältigung aktueller Herausforderungen hilfreich sein können. Ein besonderer Fokus lag dabei auf der Frage, wie die städtische Entwicklung vorangetrieben werden kann. Die Verantwortlichen der Initiative erkannten, dass es nicht ausreicht, die 23 vielversprechendsten Lösungen an die kommunalen Partner weiterzugeben. Vielmehr ist es entscheidend, die Hürden zu identifizieren, die einer Umsetzung im Wege stehen. Diese Erkenntnis stellt eine wichtige Lehre für zukünftige Projekte dar. Ein Teilnehmer der Challenge brachte es auf den Punkt: „Kreislaufwirtschaft ist kein Thema, das sich allein gut stemmen lässt - dafür braucht man Partner.“ Die Circular City Challenge hat gezeigt, dass der Weg zur urbanen Kreislaufwirtschaft bei aller Komplexität auch großes Potential birgt. Es ist entscheidend, flexibel und anpassungsfähig zu bleiben, um die identifizierten Lösungen trotz aller Hürden erfolgreich umzusetzen. Nur so kann der Kreislauf geschlossen und das Ziel der Klimaneutralität erreicht werden. Die Herausforderungen liegen aber nicht nur auf Seiten der Städte. So sollten die Lösungsanbieter ein tieferes Verständnis für die spezifischen Bedürfnisse der Städte entwickeln und die Kommunikation verbessern, um die Rolle der kommunalen Partner zu verdeutlichen. Wichtig ist auch, dass Unternehmen nicht nur Konzepte entwickeln, sondern auch mindestens ein minimal funktionsfähiges Produkt (MVP) präsentieren, um ihre Vision und die Umsetzbarkeit der Lösung zu transportieren. Lokale Kreisläufe sind wertvoll, auch für die lokale Wirtschaft Die Initiative hat wichtige Verbindungen zwischen Kommunen, Lösungsanbietern und anderen Stakeholdern geschaffen und den Grundstein für zukünftige Kooperationen gelegt. Im Rahmen der Circular City Challenge wurde in Stuttgart ein lokales "Re:ssourcenzentrum" ins Leben gerufen, das Produkte und Bauteile, die am Ende ihrer ersten Nutzungsphase angekommen sind, für den Wiedereinsatz im Kreislauf vorbereitet. Ein weiteres spannendes Projekt betrifft den Abbau einer Stadiontribüne aus Betonfertigteilen. Die Vision ist, diese Elemente als Treppe am Neckarufer zu integrieren, wo die Bürger später verweilen können. Allerdings befindet sich dieses Vorhaben noch in der Anbahnung, da noch geklärt werden muss, welche Akteure und Ressourcen dafür benötigt werden. In Zeuthen (Brandenburg) wurde eine Pilotphase zur Analyse von Gebäudeenergiedaten durchgeführt, während in Berlin-Neukölln die Zusammenarbeit mit der Global Goals Directive angestoßen wurde. In Wien fand ein Workshop zur Implementierung eines lokalen Mehrwegsystems für die Gastronomie statt. Wie sieht die Zukunft aus? Die wertvollen Erkenntnisse aus der Circular Economy Challenge werden nun genutzt, um neue Wege der Wissensvermittlung zu erkunden. Die bisherigen Erfahrungen waren äußerst bereichernd, und jetzt sind wir in einer spannenden Phase, in der wir darüber nachdenken, wie wir unser Wissen auch in den kommenden Jahren effektiv weitergeben können. Statt einer weiteren Challenge konzentrieren wir uns auf aufbauende Formate wie Schulungen, Informationsveranstaltungen und Vernetzungsmöglichkeiten für die Städte. Ein zentraler Aspekt dabei ist, wie kommunale Partner als Netzwerk oder Multiplikatoren für die Lösungsanbieter agieren können. Mehr Informationen auf circular-city-challenge.com Download das Circular City Challenge Guide Book hier zur Umsetzung einer eigenen Challenge. tags widget:circular berlincircular city neu gestalten.Circular City Challenge Share this:'
