full_description = "Expert's view CB team 10/10/2022 A NEW BROWSER EXTENSION TO CHANGE ONLINE CUSTOMER BEHAVIOUR Faircado, the Berlin-based startup in sustainable technology, has launched a new, cross-browser extension that would change the consumer experience and online buying behaviour for the benefit of our planet. On the 22nd of September, in the heart of the German capital, the company celebrated the new technology becoming available to... Continue reading Share this: Expert's view CB team 30/08/2021 GreenCircle: eine neue Plattform für den zirkulären Konsum in Berlin. Berliner Startup und ein Teil der Community von Circular Berlin GreenCircle will die Circular Economy an jede Berliner Haustür bringen. Auf der digitalen Plattform kann man gebrauchte Waren kaufen und verkaufen – und ganz ohne Verpackungsmüll. Gleichzeitig mit der Lieferung sammelt GreenCircle auch nicht mehr benötigte Dinge ein und verkauft... Continue reading Share this: Expert's view CB team 19/08/2021 Freiraum in der Box – neuer Hotspot für Circular Economy in Berlin – Friedrichshain. Der Freiraum in der Box ist ein Teil der Community von Circular Berlin. Wir haben mit Carolina Mojto, der Architektin, Gründerin und Leiterin über Circular Economy im Freiraum gesprochen. Sie revitalisiert Häuser in Berlin und schafft nachhaltige, mit dem lokalen Umfeld verbundene und weltoffene Communities, wie z.B. im Freiraum, in... Continue reading Share this: Expert's view Dina Padalkina 22/06/2021 Sekundärrohstoffe im Lebensmittelbereich als Essenz für die urbane Circular Economy. Städte spielen eine zentrale Rolle in der globalen Wirtschaft und sind Impulsgeber für ein kreatives und innovatives Wachstum. Gleichwohl unterliegen sie aufgrund ihrer Größe einer gewissen Komplexität und verbrauchen immense Ressourcen, was sich zum Beispiel auch in der Lebensmittelherstellung und -versorgung niederschlägt. Eine isolierte Ansicht ist dabei nicht möglich, denn... Continue reading Share this: Expert's view Dina Padalkina 08/01/2021 Kompostieren in der Stadt, kein Problem! In Berlin mit über 3,7 Millionen Menschen gehen pro Jahr und Einwohner*in 85-89 kg Bioabfall verloren (Selbstkalkulation: Abfallbilanz 2017, Stand vor der Einführung der Bioabfall-Sammlung als Pflichttonne). Damit wird der natürliche Stoffkreislauf unterbrochen. Eigentlich könnte aus dem Abfall fruchtbarer Wurmhumus werden. Durch Kompostierung. Und das geht auch in der Stadt.... Continue reading Share this:"
