["https://www.cis.upenn.edu/graduate/how-to-apply"]
title = "How to Apply"
description = "How to Apply"
full_description = "All applications for engineering graduate programs are submitted online. Penn Engineering Graduate Admissions provides links to create an application or log in to view an existing application here. Information about our Doctoral (Ph.D.), Master of Science in Engineering in Computer and Information Science (MSE), and the Master of Computer and Information Technology (MCIT) graduate programs can be found here. You can also access information about our faculty, research and courses. Applicants to the CIS Doctoral and CIS/MSE graduate programs are expected to have a strong academic background in computer science; the core courses for Doctoral students are the same core courses taken by CIS/MSE students. The MCIT graduate program is designed for candidates with a strong academic background in an area other than computer science; i.e., candidates with a strong academic background in computer science should NOT apply to the MCIT graduate program. Admission statistics – number of applicants/admits, average GRE scores, etc. – for our graduate programs for the past several years are available here. This will give you an idea of what is expected of applicants. Departmental financial aid is available only for doctoral students. Applicants to the CIS Doctoral Program are considered for available funding; it is not necessary to submit extra material to be considered for funding. There is no departmental funding available for master’s students. There are no RA positions available in the department; only research fellow positions for doctoral candidates. Teaching Assistant (TA) duties are generally met by Ph.D. candidates participating in a Teaching Practicum. Information about other funding resources can be found here. The University of Pennsylvania participates in the Yellow Ribbon Program; information can be found here. Submatriculation/Accelerated Master’s: Undergraduate students applying for Submatriculation/Accelerated Master’s status must have completed the courses listed below at the time of application:"
