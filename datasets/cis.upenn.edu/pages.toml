["https://www.cis.upenn.edu/graduate/program-offerings/mse-in-cis/requirements"]
title = "Requirements"
description = "Requirements"
full_description = "The MSE degree requires completion of ten course units that satisfies all of the following requirements: Advanced study in a specific area of computer science is encouraged. Besides coursework, students may pursue Independent Studies to increase their depth of knowledge in a specific area – a maximum of two independent study credits can be used as electives for the CIS/MSE degree. Students are also encouraged to submit a master’s thesis (see below) which may count as two course units of Masters Student Thesis Research, CIS 5970. FORMS: Click here to access Penn Engineering graduate forms, including the Graduate Petition for Action; click here to access CIS graduate forms. Concentrations for CIS/MSE are available in the following areas – Computer Vision, Systems, Artificial Intelligence, Software Foundations, and Theoretical Foundations. A student wishing to complete a master’s thesis may enroll in two course units of CIS 5970/Masters Thesis Research, which count as electives towards the ten credits needed for the CIS/MSE degree. The student first chooses a thesis advisor, who must belong to the CIS Graduate Group, proposing a suitable thesis topic. The thesis advisor and student discuss and determine the topic, scope, etc. of the thesis. The advisor and student also determine one other faculty member to be a reader for the thesis. The advisor and reader will evaluate the thesis and make the determination of its suitability as a research document. An oral presentation of the thesis is required. This can take the form of a public presentation open to all CIS faculty and students to attend, or in lieu of that, a conference presentation or poster presentation (decided by the thesis adviser). Once the final thesis document is approved, it is signed by the advisor, reader, and CIS/MSE Program Chair, Dr. Swapneel Sheth. Information re: thesis formatting and submission of the thesis to the Penn Engineering Research and Academic Services Office can be accessed here. A copy of the approved version of the thesis should be emailed to the CIS Master’s chair."
