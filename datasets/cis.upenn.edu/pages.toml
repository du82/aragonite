["http://www.cis.upenn.edu/prospective-students/graduate/index.php"]
title = "Program Offerings"
description = "Program Offerings"
full_description = "The Doctoral Program in Computer and Information Science welcomes candidates with strong training in any of the disciplines related to modern information processing, with an emphasis on computer science and mathematics. Research and teaching form the essence of our doctoral program. Our curriculum is designed to develop the intellectual skills essential for the rapidly changing character of research and to meet the demands of academe and industry. Students develop their own advanced study focus, working with faculty mentors on topics ranging from the core computer science discipline to diverse scholarly interactions within Penn Engineering and the University. The Master of Science in Engineering in Computer and Information Science degree program is designed to allow flexible planning of advanced study. The MSE student develops their own advanced study focus, and can arrange interdisciplinary programs in such areas as CIS and Telecommunications, CIS and Computational Linguistics, CIS and Biomedical Computation, etc. Graduate studies in the Department offer the possibility for rewarding exploration and research. This is a uniquely exciting place to be. The Master of Computer and Information Technology (MCIT) program is for applicants whose undergraduate degree is not in computer science. Candidates with an undergraduate major in computer science should consider applying instead to the Master of Science in Engineering (MSE) program. The MCIT program stems from a belief that advanced computer science coursework for people with degrees in other fields leads to highly successful career paths. This innovative program allows those with no computing experience to begin an IT career, those who are experienced in IT to advance, and it prepares students for future advanced study in computer science. Students can enroll either full- or part-time. Note: Information on this site is for the on-campus program. Students interested in the online MCIT program should visit this site. Penn’s Master of Science in Engineering (MSE) in Data Science prepares students for a wide range of data-centric careers, whether in technology and engineering, consulting, science, policy-making, or understanding patterns in literature, art or communications."
