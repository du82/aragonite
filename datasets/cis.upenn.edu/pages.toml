title = "Awards Archive"
description = "Awards Archive"
full_description = "December 6, 2018: André DeHon, Professor of ESE and CIS, and Sanjeev Khanna, Henry Salvatori Professor of CIS, have been named to the 2018 Association for Computing Machinery Fellowship class. Read more. October 19, 2018: Sampath Kannan is one of the winners of the inaugural Penn India Research and Engagement Fund (Penn IREF) awards for his project on “The Safe Internet of Things.” Read more. April 18, 2018: Arvind Bhusnurmath, Lecturer in Computer and Information Science, has been awarded the Hatfield Award for Excellence in Teaching in the Lecturer and Practice Professor Track. April 17, 2018: Charles Yang, Professor of Computer Science and Linguistics, has been awarded a 2018 John Simon Guggenheim Memorial Fellowship. Read more. March 26, 2018: Steve Zdancewic received the Lindback Award for Distinguished Teaching, the highest teaching award at the University level. February 7, 2018: Researchers in Penn Engineering’s PRECISE Center have received a $6.1 million, five-year grant from the Office of Naval Research for their ASPIRE project. The team of CIS researchers includes Associate Professor Mayur Naik, Zisman Family Professor Rajeev Alur, Professor Boon Thau Loo, Research Associate Professor Oleg Sokolsky, and Cecilia Fitler Moore Professor Insup Lee. Read more. May 12, 2017: Sanjeev Khanna received the Lindback Award for Distinguished Teaching, the highest teaching award at the University level. March 27, 2017: Nadia Heninger, Magerman Term Assistant Professor, was awarded an NSF CAREER Award for research on “Cryptographic Security at Internet Scale”. Read more. June 25, 2013: Benjamin Pierce received the 20-year Test of Time award from the IEEE Logic in Computer Science conference for his paper “Typing and Subtyping for Mobile Processes,” with Davide Sangiorgi. January 14, 2013: Aaron Roth, CIS Assistant Professor, was awarded an NSF CAREER Award, “The Algotithmic Foundations of Data Privacy”. 2013: “A Guide to the Classification Theorem for Compact Surfaces” coauthored by Dr. Jean Gallier, CIS Professor, and Dianna Xu, former CIS Ph.D and presently Chair of CS at Bryn Mawr, has been published by Springer-Verlag."
