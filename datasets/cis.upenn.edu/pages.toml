title = "Doctoral"
full_description = "Welcome to the Graduate Program of the Department of Computer and Information Science. We look forward to working with you and hope that your graduate career here will be productive and enjoyable. To obtain the proper forms needed to get on the payroll so you can get your stipend, have your tuition/fees and student health insurance paid, etc., new students should email Penn Engineering Financial Services (PEFS). Once finished, bring the completed forms and needed documents, ID, etc. with you to PEFS to submit them. The fellowship for funded Ph.D. students includes payment of tuition and fee, an annual 12-month stipend for the academic year and single health insurance coverage through Penn’s Student Health Insurance Plan. You have to sign up for the Student Health Insurance Plan and then the department will pay it. The stipend is paid monthly, usually at the end of the month. The Business Office generally pays tuition, fees, etc. after the semester has started. First year doctoral students can use the shared workspace, workstations with terminals, conference area, lockers and lounge area in Levine 057; click here to view photos of the workspace. Levine 057 is on the basement level and is accessible via the staircase between Levine Hall and the Moore Buildings. For access to Levine 057 contact Cheryl Hickey at cherylh@seas.upenn.edu. Redian Furxhiu Program Manager for on-campus Graduate MCIT, CIS/MSE and CGGT programs Office: 308 Levine Phone: 215-898-1668 Email: redian@seas.upenn.edu Staci Kaplan Program Manager for DATS (Data Science MSE) Office: 308 Levine Phone: 215-573-2431 Email: stacilk@seas.upenn.edu Britton Carnevali Doctoral Program Manager Office: 310 Levine Phone: 215-898-5515 Email: brittonc@cis.upenn.edu Mariel Celentano Graduate Coordinator for ROBO Office: 459 Levine Phone: 215-573-4907 Email: robo-coord@seas.upenn.edu Julia Esposito PICS Program Coordinator, SCMP Academic Coordinator Office: 3401 Walnut, 5th Fl. Phone: 215-573-6037 Email: jnespos@seas.upenn.edu"
