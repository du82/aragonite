title = "Grace Hopper Lecture Series"
description = "Grace Hopper Lecture Series"
full_description = "In support of Penn Engineering’s educational mission of promoting the role of all engineers in society, this series is intended to serve the dual purpose of recognizing successful women in engineering and of inspiring students to achieve at the highest level. Grace Hopper is a wonderful example of a visionary in her field who exhibited the type of pioneering spirit that is an inspiration to all of us. This series provides another avenue for recognition of distinguished leaders in engineering and presents role models that help remind all of us why we chose this profession. “AGI is Coming… Is HCI Ready?” We are at a transformational junction in computing, in the midst of an explosion in capabilities of foundational AI models that may soon match or exceed typical human abilities for a wide variety of cognitive tasks, a milestone often termed Artificial General Intelligence (AGI). Achieving AGI (or even closely approaching it) will transform computing, with ramifications permeating through all aspects of society. This is a critical moment not only for Machine Learning research, but also for the field of Human-Computer Interaction (HCI). In this talk, I will define what I mean (and what I do NOT mean) by “AGI” (and related concepts, like superintelligence), and my journey from AGI skeptic to believing we are within five years of reaching this milestone. I will then discuss how this new era of computing necessitates a new sociotechnical research agenda on methods and interfaces for studying and interacting with AGI. For instance, how can we extend status quo design and prototyping methods for envisioning novel experiences at the limits of our current imaginations? What novel interaction modalities might AGI (or superintelligence) enable (e.g., “ESP”)? How do we create interfaces for computing systems that may intentionally or unintentionally deceive an end-user? How do we bridge the “gulf of evaluation” when a system may arrive at an answer through methods that fundamentally differ from human mental models, or that may be too complex for an individual user to grasp? How do we evaluate technologies that may have unanticipated systemic side-effects on society when released into the wild?"
year_published = 2025
clearnet = "https://www.cis.upenn.edu/events/grace-hopper-lecture"
