title = "Chair’s Letter"
description = "Chair’s Letter"
full_description = "We’ve come a long way since the world’s first Turing-complete electronic computer, the ENIAC, was completed here at Penn in 1946, weighing in at 30 tons. Now there aren’t many days that go by when we don’t interact with a computer in some (albeit more slender) form. From phones and laptops to refrigerators and cars, many everyday devices now contain computational capacity. With all this computing surrounding us, who wouldn’t want to be the computer scientist who helps design, understand and build these amazing devices? Computing has revolutionized countless industries and academic fields, from entertainment to physics. No matter the career path you choose, chances are you’ll value the ability to program and think computationally. Computer science has had an impressive string of results over the past few decades, from microprocessors to the Internet and virtual assistants. With such rapid progress, you might expect that the barriers to entry in this field would have risen, as projects require more and more expertise to build. What I find continually surprising about our field is that, in so many ways, the barriers to entry have instead lowered dramatically. Computer science from the very beginning was imbued with a culture of sharing, embodied by the open source software movement, which has resulted in a massive flood of code, tools and tutorials, almost all of it freely available. Collectively, these resources make it possible for a small team of computer scientists to build amazing things. The impressive projects completed over a single weekend at the PennApps hackathon are an annual testament to this. There has never been a better time to become a computer scientist! Here at Penn, you have a range of opportunities to pursue degrees in computer science that match your interests, from the Digital Media Design program which blends computer science with fine arts, to Computer Engineering which focuses on the design of hardware devices, to Networked and Social Systems which incorporates work from economics and public policy, and the Management & Technology program which combines computer science with business and entrepreneurship."
year_published = 2025
