description = "Max Mintz Undergraduate TA Hall of Fame"
full_description = "Every May, the CIS faculty nominates from among the graduating class a few students that have made extraordinary contributions to our teaching mission. Working as TA (and often as a head TA) they have gone far beyond the call of duty in raising the quality of our classes. In November 2022, by popular acclaim the CIS Undergraduate TA Hall of Fame was named in honor of Professor Max Mintz (1948-2022), who was legendary for his commitment to teaching Penn students and for his advocacy of students. It was through his advocacy that Penn Engineering first allowed undergraduate students to serve as TAs. Kisha Yan, BSE in Digital Media Design, MSE in Comp Graphics and Game Tech Semesters as a TA: Spring 2022 – Spring 2024: NETS 1500 Kevin Zhou, BSE in Computer Science, MSE in Computer Science Semesters as a TA: Spring 2023: NETS 4120, CIS 2330 Spring 2024: NETS 4120, Head TA Andrew Antenberg, BAS in Computer Science Semesters as a TA: Fall 2021 – Spring 2022: CIS 1200 Fall 2022 – Spring 2024: CIS 1020, Head TA Aarushi Singh, BSE in Computer Science, BS in Entrepreneurship & Innovation Semesters as a TA: Spring 2021 – Spring 2023: CIS 1200 Fall 2023 – Spring 2024: CIS 1200, Head TA Eduardo Gonzalez Zetina, BSE in Computer Science Semesters as a TA: Spring 2022 – Spring 2023: CIS 1200 TA Spring 2023: CIS 1880 TA Fall 2023 – Spring 2024: CIS 1200, Head TA Luis Sangueado, BS in Finance, MSE in Computer Science Semesters as a TA: Spring 2021 – Spring 2024: CIS 1200 Spring 2024: CIS 5590 Ishaan Lal, BSE in Computer Science, MSE in Computer Science Semesters as a TA: Fall 2021 – Spring 2023 CIS 1600 Fall 2023 – Spring 2024: CIS 1600, Head TA Keshav Ramji, BSE in Computer Science, BS in Statistics and Finance, MSE in Computer Science Semesters as a TA: Fall 2022: CIS 5200 Spring 2023 – Fall 2023: CIS 5200, Head TA Spring 2023: CIS 3200 Fall 2023: CIS 6250 Sumukh (Sumi) Govindaraju, BSE in Computer Science, MSE in Robotics Semesters as a TA: Fall 2021, Spring 2022, Spring 2024: CIS 2620 Fall 2022, Spring 2023, Fall 2023: CIS 2620, Head TA"
