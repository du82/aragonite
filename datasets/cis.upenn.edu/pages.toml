full_description = "The master’s degree requirements consist of completing 9 courses and a one semester design project over a one year period for a total of 10 courses. A graduate-level technical or creative course in the area of graphics or animation. Approval of the CGGT program director is required. Courses that can be selected as the Graphics Elective include: Any graduate level course in Penn Engineering. Approval of the CGGT program director is required. Recommended choices include: Any graduate level course at the University that relates in some way to graphics, animation and/or games. Approval of the CGGT program director is required. Recommended choices include any of the Graphics Elective, Technical Elective or Business and Entrepreneurship courses listed above as well as: Students enrolled in the program from outside the University who have taken substantially similar coursework at their undergraduate institutions also can petition the program for approval of appropriate course substitutions. Granting of such approvals will be at the Program Director’s discretion, and will be made on a case-by-case basis. Redian Furxhiu Program Manager for on-campus Graduate MCIT, CIS/MSE and CGGT programs Office: 308 Levine Phone: 215-898-1668 Email: redian@seas.upenn.edu Staci Kaplan Program Manager for DATS (Data Science MSE) Office: 308 Levine Phone: 215-573-2431 Email: stacilk@seas.upenn.edu Britton Carnevali Doctoral Program Manager Office: 310 Levine Phone: 215-898-5515 Email: brittonc@cis.upenn.edu Mariel Celentano Graduate Coordinator for ROBO Office: 459 Levine Phone: 215-573-4907 Email: robo-coord@seas.upenn.edu Julia Esposito PICS Program Coordinator, SCMP Academic Coordinator Office: 3401 Walnut, 5th Fl. Phone: 215-573-6037 Email: jnespos@seas.upenn.edu PENN ENGINEERING©2017 |UNIVERSITY OF PENNSYLVANIA|SCHOOL OF ENGINEERING AND APPLIED SCIENCE | DEPARTMENT OF COMPUTER AND INFORMATION SCIENCE 3330 Walnut Street | Levine Hall | Philadelphia, PA 19104-6309 | 215