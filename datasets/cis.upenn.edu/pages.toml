["https://www.cis.upenn.edu/open-faculty-positions"]
title = "Open Faculty Positions"
description = "Open Faculty Positions"
full_description = "The School of Engineering and Applied Science at the University of Pennsylvania continues to expand rapidly. As a key pillar of these investments, the Department of Computer and Information Science is engaged in an ambitious, multi-year hiring effort for tenure-track positions at the Assistant, Associate, and Full Professor levels. We have hired over 25 new faculty, spanning all ranks, over the past 6 years. We seek individuals with stellar research achievement and potential, who will excel in teaching undergraduate and graduate courses and take a position of international leadership in defining their field of study. Leadership in cross-disciplinary collaborations is of particular interest. Successful applicants will find Penn to be a stimulating environment conducive to professional growth. This position will start July 1, 2025. Our faculty participate in departmental and schoolwide efforts to promote and welcome wide-ranging viewpoints and experiences, and they work closely with students of all backgrounds. We request a discussion of candidates’ experiences in establishing and maintaining supportive environments for multifaceted student communities, as well as how they envision participating in efforts to ensure Penn students with different backgrounds have strong mentoring and a supportive environment. Applicants must have a PhD in Computer Science or a relevant discipline. We seek exceptional candidates in all areas of computer science, with a special interest in computer security, data science and artificial intelligence, machine learning systems, bioinformatics and computational biology, computer systems, quantum computing, and information visualization. We especially invite applications from candidates whose interests are aligned with the school’s strategic plan: https://www.seas.upenn.edu/about/strategic-plan/. Application Instructions: To ensure full consideration, applicants are highly encouraged to apply by November 30th, 2024. However, applications will be accepted until positions are filled. Please submit a cover letter, curriculum vitae, research statement, teaching statement, and names of 4 references. Other supporting documents are optional. Applications must be submitted online through Interfolio here."
