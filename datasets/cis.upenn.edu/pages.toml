\tcomputational finance and related fields"""
full_description = '''MICHAEL KEARNS Professor and National Center Chair Department of Computer and Information Science at the University of Pennsylvania Founding Director, Warren Center for Network and Data Sciences Founder and former Director, Penn program in Networked and Social Systems Engineering Secondary Appointments in Economics, Statistics and Data Science (Wharton) and Operations, Information and Decisions (Wharton) Mailing Address: 509 Amy Gutmann Hall, 3317 Chestnut Street, Philadelphia, PA 19104 Phone: 215.898.7888 (rarely answered, prefer email) Email: mkearns@cis.upenn.edu Amazon Email: kearmic@amazon.com Twitter: @mkearnsupenn Admin Support, Warren Center and NETS Program Manager and Social Media Outreach: Lily Hoot Phone: 215.573.0861 Email: lhoot@seas.upenn.edu My research interests include topics in machine learning, artificial intelligence, algorithmic game theory and microeconomics, computational social science, and quantitative finance and algorithmic trading. I often examine problems in these areas using methods and models from theoretical computer science and related disciplines. While much of my work is mathematical in nature, I also often participate in empirical and experimental projects, including applications of machine learning to problems in algorithmic trading and quantitative finance, and human-subject experiments on strategic and economic interaction in social networks. For (in)convenience, most of this site is organized as a single flat html file. The links below let you navigate directly to the various subsections. Publications Research Group Members Teaching and Tutorial Material Professional Bio Educational Background Editorial and Professional Service Press Aaron Roth and I have written a general-audience book about the science of designing algorithms that embed social values like privacy and fairness; here is the publisher's description: Over the course of a generation, algorithms have gone from mathematical abstractions to powerful mediators of daily life. Algorithms have made our lives more efficient, more entertaining, and, sometimes, better informed. At the same time, complex algorithms are increasingly violating the basic rights of individual citizens. Allegedly anonymized datasets routinely leak our most sensitive personal information; statistical models for everything from mortgages to college admissions reflect racial and gender bias. Meanwhile, users manipulate algorithms to "game" search engines, spam filters, online reviewing services, and navigation apps.'''
