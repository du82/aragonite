["https://www.cis.upenn.edu/graduate/program-offerings/doctoral-program/requirements"]
title = "Requirements"
description = "Requirements"
full_description = "The ultimate goal of Penn’s PhD program in CIS is research excellence. This can be broken down into several intermediate goals: All doctoral work, including the dissertation, must be completed within ten years of matriculation as a graduate student at Penn. To be in good standing the student is required to maintain satisfactory progress and to achieve the CIS PhD benchmarks in a timely manner. Doctoral students have a worksheet which they can use to monitor enrollment and completion of milestones. On the worksheet, Qualifications Evaluation records completion of the Breadth requirement; Candidacy Examination is completion of the thesis proposal; Dissertation Defense is the successful completions of the dissertation defense. (The worksheet does not currently show completion of the Research Qualifier.) Students can access the worksheet through PATH. For the first two years of their doctoral career, Ph.D. students enroll in four courses (including independent studies) in the Fall and Spring semesters; billing is at the full-time rate. After the second year of study, in order to meet University and fiscal constraints, full-time enrollment in the Fall and Spring is three courses, Thesis Research, etc.; billing is at the full-time rate. Once a student has been in the doctoral program for five years, they are billed at a reduced rate. Once a doctoral student has made the dissertation proposal, they should register for CIS 9950/Dissertation. The first milestone is intended to expose students to multiple subject areas within computer science. Students are required to take and receive a grade of B or above in two courses spanning two of the five buckets. Both of these buckets should be different from the student’s “home bucket” (i.e., the bucket into which their own PhD work is most likely to fall). The breadth requirement is waived for PhD students who enter the program with a Master’s degree in computer science (or a related field, subject to review by the advisor and graduate chair)."
year_published = 2025
