["https://www.cis.upenn.edu/graduate/program-offerings/mse-in-computer-graphics-and-game-technology"]
title = "MSE in Computer Graphics and Game Technology"
description = "MSE in Computer Graphics and Game Technology"
full_description = "Interactive entertainment and computer-animated visual effects are now part of our mainstream culture. Creating such computer-generated imagery, however, is no trivial task. It requires a delicate blending of art with science by teams of highly skilled professionals, including artists, animators, writers, designers, engineers and software developers working long hours with cutting-edge technology and tools. Currently there are very few interdisciplinary academic programs at four-year research universities adequately preparing students for such positions. The Master of Science in Engineering in Computer Graphics and Game Technology (CGGT) was created specifically to address this need. The CGGT program was established in 2004. The goal of the program is to expose recent graduates, as well as individuals returning from industry, to state-of-the-art graphics and animation technologies, as well as interactive media design principles, product development methodologies and engineering entrepreneurship. The CGGT program prepares students for positions requiring multidisciplinary skills such as designers, technical animators, technical directors and game programmers. Students in the CGGT program use the equipment and resources available through the SIG Center for Computer Graphics. Opportunities for specialization are provided in such core areas as art and animation, creative design, animation and simulation technology, human/computer interfaces and production management. Students seeking admission to the program are assumed to have a bachelor’s degree in either Computer Science or Engineering. Students seeking admission with non-computer science and/or engineering undergraduate backgrounds will require a minimum of two years to complete the program. The first year will be spent in the Department’s Master of Computer and Information Technology (MCIT) program; upon satisfactory completion of the MCIT program, the student may pursue the Computer Graphics and Game Technology degree. Such students, having taken a total of 16 courses, will receive two degrees: a Master of Computer and Information Technology and a Master of Science and Engineering in Computer Graphics and Game Technology."
