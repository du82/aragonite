description = "Concentrations"
full_description = "A concentration is a set of (typically four) related courses that you can use to specialize in a particular area and is only for students pursuing a CSCI degree. It is somewhat similar to a minor, except that the topic of a concentration is a particular subarea of the discipline in which you are already pursuing a degree, whereas the topic of a minor is usually from a different discipline. For instance, a Computer Science student might pursue a minor in Mathematics, or a concentration in Software Foundations or Computer Vision. For the CSCI program, concentrations are optional; you can declare one if you wish, but you can also graduate without one, there is a limit of one concentration per degree. If you are in the CSCI program, you can declare a concentration using the university declare/update field of study form. PENN ENGINEERING©2017 |UNIVERSITY OF PENNSYLVANIA|SCHOOL OF ENGINEERING AND APPLIED SCIENCE | DEPARTMENT OF COMPUTER AND INFORMATION SCIENCE 3330 Walnut Street | Levine Hall | Philadelphia, PA 19104-6309 | 215-898-8560 Contact us with questions about the academic programs |Graduate Admissions information contact SEAS Graduate Admissions |For website issues, email the webmaster Report accessibility issues and get help Contact us with questions about admissions or academic programs | For website issues, email the webmaster"
