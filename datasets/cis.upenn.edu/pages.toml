["https://www.cis.upenn.edu/news/awards"]
title = "Student Awards"
description = "Student Awards"
full_description = "Annual awards are given to undergraduate and graduate students in the Department of Computer and Information Science in recognition of outstanding scholarly achievements and service to the School of Engineering and Applied Science and University community. Departments select each recipient and students are recognized at the Annual Awards Recognition Dinner held during the spring semester. Students also select faculty recipients of the annual Penn Engineering Teaching and Advising Awards each year. The E. Stuart Eichert, Jr. Memorial Prize, established by Technitrol, Incorporated, in memory of Mr. Eichert, a company co-founder and distinguished alumnus of the Moore School’s Class of 1942, is awarded each year to students at the end of their junior year in the Moore School who, in the judgment of the School’s faculty, best demonstrate initiative, intellectual attainment, and commitment to the professional practice of engineering. The Walter Korn Award is awarded annually to an outstanding senior in the Moore School who will be continuing on at the Moore School for a graduate degree. Selection of the recipient is made by the Moore School chairs and faculty, in conjunction with the Associate Dean for Undergraduate Education. Anshul Tripathi is a senior from Mumbai, India double majoring in Computer Science and Philosophy with a Mathematics minor, and submatriculating in Data Science. At Penn, Anshul has taught 1600+ students as a TA for CIT 593, CIS 550, ESE 530, CIS 520, ENM 503, ESE 301 and ESE 190, and has served as Head TA for 3 of these classes. He has been involved in applied ML research projects, including an investigation into the performance of semi-supervised learning algorithms and exploring new methods to predict student performance & optimize Penn Engineering’s graduate admissions pipeline. He has spent 2 summers interning at Barclays as a software developer. Outside school, he enjoys longboarding and trying out new types of gnocchi. After graduation, Anshul will begin work at Palantir Technologies in New York City as a Forward Deployed Engineer."
year_published = 2025
