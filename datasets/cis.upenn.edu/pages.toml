["https://www.cis.upenn.edu/undergraduate/advising"]
title = "Advising"
full_description = "The CIS Advising office will be available for advising appointments and drop ins beginning the week of August 26th for the Fall semester. Please use the below appointment links to schedule a time to connect with one of our undergraduate advisors or UG Chair. In Person Drop-In Advising for longer (non-degree audit) discussions will be held Monday through Thursday from 1-4pm in the CIS Advising Office, Levine 308. We also offer appointments for longer discussions (30 mins) at this time and you can find a time that works for you using the links below with the Advising Staff or the UG Chair: Emily is the CIS Wellness Liaison for the CIS students and can provide resources around wellness and academic advising, and help students navigate resources on campus. OAS has walk in hours M-Th 2-4PM located in Towne 109. If you wish to join the CIS Waitlist for our courses you should request permission to take the course in Path@Penn first, then when the waitlist opens up or is already open you will be added to it. It could be up until the first week of courses before you get admitted into a course. If you have any questions about the waitlist process then please let us know at ciswait@seas.upenn.edu. Please see the updated changes to SEAS procedures such as petition for action forms, declaring a minor, course substitution forms, etc. by visiting the OAS website. Upon entering the program, each student is given a faculty advisor who can answer questions you have about your program and who is responsible for monitoring your course selections and performance. The best way to get in touch with your advisor is via email or attend their office hours. Your CIS advisor is listed on Path@Penn. If you find that you are having problems with any course, please talk to the professor of the course as early as possible to see if there is some way to improve your performance. If this fails, talk to your academic adviser who may be able to point you to useful resources. Please feel free to email the CIS advising staff with questions: cis-undergrad-advising@seas.upenn.edu."
