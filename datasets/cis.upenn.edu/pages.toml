["https://www.cis.upenn.edu/centers-institutes"]
title = "Centers + Institutes"
description = "Centers + Institutes"
full_description = "CPE4H is focused on how advances in molecular medicine, such as sequencing and the genome, might give way to personalized treatments. Its efforts will catalyze the ability to move healthcare from providing one-size-fits-all solutions to a system that can recognize the unique state of each individual to provide the best care. The ASSET Center will act as a catalyst for new collaborations among groups researching machine learning, programming languages, natural language processing, robotics, and human-computer interaction within Penn Engineering. It will also connect them with researchers throughout the University, starting with a series of workshops held at Penn’s Perelman School of Medicine that explore the opportunities and challenges for AI systems in healthcare settings. The Linguistic Data Consortium supports language-related education, research and technology development by creating and sharing linguistic resources, such as data, tools and standards. The General Robotics, Automation, Sensing and Perception (GRASP) Lab is a truly inter-disciplinary research center at the University of Pennsylvania. Founded in 1979, the lab has grown today to be one of the premier research centers focusing on fundamental research in robotics, vision, perception, control, automation and learning. The formation of the Penn Institute for Computational Science derives from the observation that computing is an important tool for research in essentially every field of study today; from the physical and biological sciences to every part of engineering to linguistics to medicine to psychology. Computing’s rapidly changing landscape, while presenting immense opportunities, makes it a challenge for researchers to stay at the state-of-the-art. PICS is formed to address these challenges and opportunities across the University of Pennsylvania. PRECISE is the point of convergence for several related research efforts by the affiliated faculty in the areas of cyber-physical systems, distributed, real-time, and embedded systems, formal specification and verification, control theory, and trust management. Comprised of researchers from the departments of Computer and Information Science and Electrical and Systems Engineering, the center also collaborates closely with researchers in Robotics, Bioengineering, the School of Medicine, and Wharton. PRECISE research is being applied to several application domains, including embedded software-intensive medical devices, embedded software design and verification, wireless sensors, and robotics."
