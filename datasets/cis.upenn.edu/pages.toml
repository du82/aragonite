title = "Caroline Okun"
description = "Caroline Okun"
full_description = "When Caroline Okun arrived on the Penn campus 4 years ago, she knew that she wanted to major in a discipline that tapped into her quantitative skills. Although Math had been her favorite subject in high school, she was open to exploring new subjects. In fall of her freshman year, Caroline enrolled in math, physics and introduction to computer programming, CIS 110. Although Caroline had never programmed before, she found that she loved CIS 110, and was drawn more to her programming assignments than any other subject. She also enrolled in the Penn Emerging Scholars Program (PESP), a non-credit workshop in which students solve logical, algorithmic problems in small groups under the guidance of peer leaders. Caroline found that she liked the computational thinking involved in PESP and she became a peer leader in her sophomore year. Because computer science was a fit for both her programming and her quantitative interests, Caroline declared the computer science major and minors in data science and math. In junior year, she enrolled in Acquicum Institute of Technology (AIT), a North American computer science study-abroad program, and took 5 computer science and technical elective courses in a spring semester in Budapest. In addition to her coursework, Caroline jumped into extracurricular activities, internships and undergraduate research. She joined the board of the Women in Computer Science (WiCS) because she liked the club’s mission to foster a community for women in tech at Penn. She especially enjoyed her two independent study courses, which gave her an opportunity to do undergraduate research. She built a chatbot with PhD student Joao Sedoc, who is now an Assistant Research Professor at Johns Hopkins University. She also did a research project in discrete math with Computer and Information Science Professor Anindya De. Summers after sophomore and junior years she interned, first for Google, working on Google’s payment fraud team, then for Palantir in software engineering and development. She committed to working for Five Rings Capital developing trading algorithms after graduation because the small size of this firm and the quantitative nature of the job appealed to her."
year_published = 2025
