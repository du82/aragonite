["https://www.cis.upenn.edu/events/speaker-archive/joshifest"]
title = "JoshiFest"
full_description = "On October 22, 2012, the Department of Computer and Information Science hosted JoshiFest, a celebration and symposium to honor the work of Dr. Aravind K. Joshi, Henry Salvatori Professor Emeritus of Computer and Cognitive Science. Fall 2012 marked Dr. Joshi’s fifty-second year on the faculty at the University of Pennsylvania. His extraordinary service to the University includes being a founding member of the graduate group in Computer and Information Science in the 1960s; co-founder of the Computer and Information Science (CIS) Department with Saul Gorn in 1972; and expanding the cognitive science research group into the Institute of Research in Cognitive Science (IRCS) with faculty from computer science, linguistics, psychology and philosophy in 1991. Additional honors and awards received by Dr. Joshi include the Benjamin Franklin Medal in Computer and Cognitive Science of the Franklin Institute in 2005; Cognitive Science Society David Rumelhart Prize in 2003; the ACL Lifetime Achievement Award in 2002; election to the National Academy of Engineering (NAE) in 1999; election to Fellow of the ACM in 1998; Founding Fellow of AAAI in 1990; and election to IEEE Fellow in 1976. 9:55 – 10:20 “Aravind Joshi as Advisor” Kathleen McKeown, Columbia University Video | Lecture Materials 10:20 – 10:45 “John seems to be intelligent” OR “How I met Aravind Joshi” Tony Kroch, University of Pennsylvania Video | Lecture Materials 11:15 – 11:40 “Complex Lexical Descriptions and Curriculum Learning: Some new opportunities” Srinivas Bangalore, ATT Research Video 11:40 – 12:05 “As simple as possible, but not simpler” Robert Frank, Yale University Video | Lecture Materials 12:05 – 12:30 “Mild Context-Sensitivity and Near Context-Freedom” Mark Steedman, University of Edinburgh Video 1:45 – 2:10 “Did you feed the animals?” Julia Hirshberg, Columbia University Video | Lecture Materials 2:10 – 2:35 “Girl Meets Boy: Generating Language with Adjoining” Kevin Knight, ISI Video | Lecture Materials"
year_published = 2025
