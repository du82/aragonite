["https://www.cis.upenn.edu/graduate/program-offerings/doctoral-program/regulations"]
title = "Regulations"
description = "Regulations"
full_description = "Doctoral students are required to pass the Written Preliminary Examination, which consists of two parts: The purpose of the WPE-I is to ensure that students pursuing the Ph.D. degree have a graduate level of competence in the fundamentals of computer science. We call this level of competence a doctoral foundation. The doctoral foundation is defined by the syllabi in the following eight graduate courses: A student passes the WPE I by passing four of the eight WPE I exams. Two exams must be passed in the first year; four must be passed by the end of the second year. The four exams must include at least one each from the following two buckets: Foundations (500, 502, 511, 520), and Systems (505, 548, 555, 571). The passing grade for a WPE I course will be determined by the course instructor based on the coursework (homeworks, projects, exams, etc) during the entire semester. The weights assigned to different components will be the same as the ones used for determining the letter grades of all the students. The exact cut-off for passing WPE I score will be determined by the instructor, but a suggested guideline is the cut-off score between the grades of B+ and B. The instructor should review the scores and cut-off with the Graduate Group Chair before announcing the results. A student should declare in advance that she/he intends to take the course for WPE I. For such students, when the coursework is graded by teaching assistants, the instructor should review the scores. When a group project contributes to the cumulative score, the instructor should take extra precaution to ensure individual evaluations (for example, based on meeting with students for project presentations, or peer feedback). Foundations courses (CIS 500, 502, 511, and 520) also offer an alternative option to pass WPE I exam based solely on the performance in the final exam (exception: to accommodate current students, CIS 501 and 505 will offer this option during the academic year 2019-20). The exact set of topics covered by the final exam will be announced at the beginning of the course to allow students to prepare for the exam. In this option, students submit the WPE I exams anonymously. The identity of the students will not be known to the faculty until after decisions are made about the pass-fail cut-off. In this case also, the instructor should review the scores and cut-off with the Graduate Group Chair before announcing the results."
