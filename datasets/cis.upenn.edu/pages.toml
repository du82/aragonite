["https://www.cis.upenn.edu/undergraduate/program-offerings/computational-biology"]
title = "Computational Biology"
description = "Computational Biology"
full_description = "This degree has been archived and is no longer an option for new students. New students are encouraged to consider the BAS or BSE in Computer and Information Science, which, starting in Fall 2020, will offer multiple opportunities to blend computer science, data science, and biomedicine through concentrations. In the future we expect these tracks to offer more flexibility and depth. The recent explosion of new knowledge about the essential properties of life, as gleaned from high-throughput experimental techniques such as sequencing, micro-arrays, and proteomics, along with rapid advances in computer technology have laid the foundation for the development of the fields of bioinformatics and computational biology. The departments of Biology, Computer and Information Science (CIS), and Mathematics have each devised undergraduate programs to train students in this important field. The undergraduate program within SEAS, the Bachelor of Applied Science in Computational Biology (ASCB), is administered through the CIS department. The curriculum consists of a blend of courses from biology, statistics and computer science to give students the skills they will need to work in this exciting inter-disciplinary area. The BAS Degrees require students to combine knowledge of technology with an understanding of human and social values. They are designed for students who do not plan to work as professional engineers, and want a customized education which combines the liberal arts and technology in a manner unique to their career goals. PENN ENGINEERING©2017 |UNIVERSITY OF PENNSYLVANIA|SCHOOL OF ENGINEERING AND APPLIED SCIENCE | DEPARTMENT OF COMPUTER AND INFORMATION SCIENCE 3330 Walnut Street | Levine Hall | Philadelphia, PA 19104-6309 | 215-898-8560 Contact us with questions about the academic programs |Graduate Admissions information contact SEAS Graduate Admissions |For website issues, email the webmaster Report accessibility issues and get help Contact us with questions about admissions or academic programs | For website issues, email the webmaster"
