["https://www.cis.upenn.edu/events/speaker-archive/life-after-phd-2019"]
title = "Life After Ph.D. 2019"
description = "Life After Ph.D. 2019"
full_description = "The Department of Computer and Information Science is hosting a panel by our PhD alumni so that students can learn about diverse career options that are available upon graduating with a PhD. These include research and teaching faculty, industrial research organizations, financial and technology industries, and Government organizations. Our panelists this year reflect this diversity of career paths. All students are welcome to attend, learn about the careers of our panelists, and ask them questions. There will be a reception at the conclusion of the panel. To help us estimate the number of attendees, please RSVP by email to brittonc@seas.upenn.edu Diane Chi is an Associate Director at Susquehanna International Group, LLP (SIG), a global quantitative trading firm in Bala Cynwyd and a key sponsor of the SIG Center for Computer Graphics. She currently co-heads the retail international equity desk and focuses on algorithmic equity trading. She received her PhD in Computer and Information Science from the University of Pennsylvania, where she worked in the Center for Human Modeling and Simulation with Dr. Norm Badler. Richard Eisenberg is an Assistant Professor of Computer Science at Bryn Mawr College. He started at Bryn Mawr, an all-women undergraduate liberal arts college, in 2016 after graduating from Penn with his PhD. His advisor at Penn was Stephanie Weirich. Richard’s research area is in functional programming languages and dependent type systems; he is a core designer and implementor of the programming language Haskell. Before starting his PhD, Richard taught high school computer science in Massachusetts and London. Franjo Ivančić is a Staff Software Engineer at Google in New York focusing on application security, program analysis and software development productivity tools. I am also an Adjunct Assistant Professor in Computer Science at Columbia University in New York. Prior to joining Google, I was a Senior Researcher at NEC Labs in the Systems Analysis and Verification group in Princeton, NJ. At NEC, I developed a number of static and dynamic program analysis tools based on model checking, abstract interpretation and symbolic execution. Before that, I received a Ph.D. in Computer and Information Science from the University of Pennsylvania in Philadelphia, PA. My dissertation research focused on the modeling and verification of embedded and hybrid systems. Earlier, I received a diploma (Dipl.-Inform.) degree from the Rheinische Friedrich-Wilhelms-University in Bonn, Germany, for my research performed at the Fraunhofer Institute in St. Augustin, Germany. My research there focused on Fuzzy Pattern Recognition, Handwriting Recognition and Machine Learning. Before coming to Bonn I went to high school at Quirinus-Gymnasiumin my hometown of Neuss, Germany, although I am of Croatian descent."
