title = "Undergraduate"
description = "Undergraduate"
full_description = "The Department of Computer and Information Science offers two types of undergraduate degrees, the Bachelor of Science in Engineering (BSE) and the Bachelor of Applied Science (BAS). The program also offers several options for students to customize their degrees. The BSE is a traditional engineering degree that prepares students for careers in professional engineering, computer science, or digital media design. BSE programs offered by the Department include Computer Science (CSCI), Computer Engineering (CMPE), Digital Media Design (DMD), Networked & Social Systems Engineering (NETS) and Artificial Intelligence (ARIN). The BAS in Computer Science (ASCS) is a degree option that offers students breadth and allows them to combine a technology-based degree with considerable course work in the liberal arts, communications, or fine arts. This degree is designed primarily for students whose interests are not oriented toward a professional engineering career. PENN ENGINEERING©2017 |UNIVERSITY OF PENNSYLVANIA|SCHOOL OF ENGINEERING AND APPLIED SCIENCE | DEPARTMENT OF COMPUTER AND INFORMATION SCIENCE 3330 Walnut Street | Levine Hall | Philadelphia, PA 19104-6309 | 215-898-8560 Contact us with questions about the academic programs |Graduate Admissions information contact SEAS Graduate Admissions |For website issues, email the webmaster Report accessibility issues and get help Contact us with questions about admissions or academic programs | For website issues, email the webmaster"
