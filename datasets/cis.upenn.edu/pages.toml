["https://www.cis.upenn.edu/history"]
title = "History"
full_description = "1740: Recognized as the founding date for the University of Pennsylvania. In this year, the Trust for the Charity School of Philadelphia was established. 1850: Generally looked upon as the date to which Engineering at the University of Pennsylvania can be traced. In this year the Trustees adopted a resolution providing for a School of Arts with one Chair, a Professorship of “Chemistry as Applied to the Arts” with familiar lectures in Mineralogy, Geology, Theoretic and Applied Chemistry to be given by the professor. 1852: The School of Mines, Arts and Manufactures was established by the Trustees as one of the Departments of the University. A “Scientific Course” was also established. The first Professor of Civil and Mining Engineering was appointed. 1875: The Department of Science was renamed the Towne Scientific School in memory of John Henry Towne, Esq, a University Trustee. 1893: The Department of Mechanical and Electrical Engineering was established. The term “Dynamical Engineering” was no longer used to cover both Mechanical and Electrical Engineering. Courses of Study in Chemical Engineering were offered, and are the oldest of such courses in continuous existence in the country. 1923: The bequest of Alfred Fitler Moore endowed the Department of Electrical Engineering in the Towne Building as The Moore School of Electrical Engineering. 1935:The Differential Analyzer completed, which was the world’s largest mechanical computing machine. 1946: ENIAC, the world’s first electronic large-scale, general-purpose digital computer was dedicated. The first computer course is also offered (graduate-level, through Electrical Engineering). 1954: The four departments of the Towne Scientific School became, with the Moore School of Electrical Engineering, the five Engineering Schools (School of Chemical Engineering, School of Civil Engineering, School of Mechanical Engineering and the School of Metallurgical Engineering). In February, the University announced that in the fall semester, for the first time, women would be admitted to the undergraduate programs of the School of Engineering and the Wharton School."
year_published = 2025
