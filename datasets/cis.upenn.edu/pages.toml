full_description = "The Computer Science (BSE) program is accredited by the Computing Accreditation Commission of ABET, https://www.abet.org, under the commission’s General Criteria and Program Criteria for Computer Science and Similarly Named Programs. The Computer Science (BSE) program provides students with an in-depth education in the conceptual foundations of computer science and in complex software and hardware systems. It allows them to explore the connections between computer science and a variety of other disciplines in engineering and outside. Combined with a strong education in mathematics, sciences, and the liberal arts it prepares students to be leaders in computer science practice, applications to other disciplines, and research. PENN ENGINEERING©2017 |UNIVERSITY OF PENNSYLVANIA|SCHOOL OF ENGINEERING AND APPLIED SCIENCE | DEPARTMENT OF COMPUTER AND INFORMATION SCIENCE 3330 Walnut Street | Levine Hall | Philadelphia, PA 19104-6309 | 215-898-8560 Contact us with questions about the academic programs |Graduate Admissions information contact SEAS Graduate Admissions |For website issues, email the webmaster Report accessibility issues and get help Contact us with questions about admissions or academic programs | For website issues, email the webmaster"
