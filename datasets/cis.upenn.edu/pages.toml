["https://www.cis.upenn.edu/undergraduate/program-offerings"]
title = "Program Offerings"
description = "Program Offerings"
full_description = "The Bachelor of Science in Engineering (BSE) is a traditional engineering degree that prepares students for careers in professional engineering, computer science or digital media design. A Penn Engineering degree in Computer Science provides students with an in-depth education in the conceptual foundations of computer science and in complex software and hardware systems. It allows them to explore the connections between computer science and a variety of other disciplines in engineering and outside. Combined with a strong education in mathematics, sciences and the liberal arts, it prepares students to be leaders in computer science practice, to create applications for other disciplines or research and to pursue an array of careers, advanced degrees or personal interests at the vanguard of technological innovation. Penn’s Computer Engineering (CMPE) major is an innovative and timely degree program, preparing students for a wide range of career opportunities and the kind of intellectual entrepreneurship that is fast shaping the future. In classes led by Penn Engineering’s renowned faculty from the Departments of Computer and Information Science and Electrical and Systems Engineering, students combine study of the fundamentals of automated information processing and control with rigorous engineering design and optimization, link theory with practice through hands-on experiments and design a new approach to a real-world problem in a yearlong senior design project. Learn more or contact Amy Calhoun, Program Coordinator, or Andre DeHon, Curriculum Chair. Computer-generated imagery is transforming communication, from educational software and motion picture special effects to architectural simulations and medical visualizations. Penn Engineering, in collaboration with the University’s Annenberg School for Communication and the School of Design, created the Digital Media Design (DMD) program, an elite Bachelor of Science in Engineering (BSE) degree program for a small number of students. The program is designed to educate a new generation of experts in computer graphics: people who, through their combined education in engineering, design, and communications, are prepared to be and to collaborate effectively with technologists and artists. Students in the program participate in one or two summers of real-world experience in a major multimedia industry. Learn more or contact Amy Calhoun, Program Coordinator."
