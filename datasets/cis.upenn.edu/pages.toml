["https://www.cis.upenn.edu/graduate/program-offerings/mse-in-cis"]
title = "MSE in CIS"
full_description = "The CIS/ MSE program offers scholars the opportunity for advanced study in the scientific foundations of the rapidly growing field of computer science. Applicants to the MSE program should have strong undergraduate training in mathematics and computer science; prior coursework should include such areas as operating systems, programming languages, data structures, discrete mathematics, linear algebra, algorithms and theory; coursework should be similar to the courses taken by computer science undergraduates at the University of Pennsylvania. Candidates who do not have an undergraduate major in computer science should consider applying to the Master of Computer and Information Technology program (MCIT). Dual degree/transfer information for current students can be accessed here. Submatriculation information for current students can be accessed here. CIS/MSE students can pursue many areas within their curriculum, including AI, databases, security, programming languages, etc. The CIS Graduate Program prepares our students to be tomorrow’s innovators, leaders, and visionaries. Our MSE graduates have obtained a wide range of positions in industry and continued in doctoral studies. Here’s a sample: Redian Furxhiu Program Manager for on-campus Graduate MCIT, CIS/MSE and CGGT programs Office: 308 Levine Phone: 215-898-1668 Email: redian@seas.upenn.edu Staci Kaplan Program Manager for DATS (Data Science MSE) Office: 308 Levine Phone: 215-573-2431 Email: stacilk@seas.upenn.edu Britton Carnevali Doctoral Program Manager Office: 310 Levine Phone: 215-898-5515 Email: brittonc@cis.upenn.edu Mariel Celentano Graduate Coordinator for ROBO Office: 459 Levine Phone: 215-573-4907 Email: robo-coord@seas.upenn.edu Julia Esposito PICS Program Coordinator, SCMP Academic Coordinator Office: 3401 Walnut, 5th Fl. Phone: 215-573-6037 Email: jnespos@seas.upenn.edu PENN ENGINEERING©2017 |UNIVERSITY OF PENNSYLVANIA|SCHOOL OF ENGINEERING AND APPLIED SCIENCE | DEPARTMENT OF COMPU