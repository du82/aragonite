title = "MSE in Robotics"
description = "MSE in Robotics"
full_description = "The University of Pennsylvania’s School of Engineering and Applied Science offers a unique master’s degree in Robotics (ROBO). This multi-disciplinary program is jointly sponsored by the Departments of Computer and Information Science, Electrical and Systems Engineering, and Mechanical Engineering and Applied Mechanics. Housed in and administered by the GRASP Lab, one of the top robotics research centers in the world, Penn Engineering’s ROBO master’s program educates students in the science and technology of robotics, vision, perception, control, automation, and machine learning. Our students hail from a variety of engineering, scientific, and mathematical backgrounds, united by a passion for robots and a desire to advance robotic technologies to benefit humanity. Our program provides an ideal foundation for jobs in a variety of industries including robotics, aerospace, automotive, industrial automation and defense; it also provides a solid basis for further graduate studies. The modern expert in robotics and intelligent systems must be proficient in artificial intelligence, machine learning, computer vision, control systems, kinematics, and dynamics, as well as the design, programming, and prototyping of robotic systems. Our flexible program offers the breadth and depth needed for this type of interdisciplinary training. Features of the program include: Redian Furxhiu Program Manager for on-campus Graduate MCIT, CIS/MSE and CGGT programs Office: 308 Levine Phone: 215-898-1668 Email: redian@seas.upenn.edu Staci Kaplan Program Manager for DATS (Data Science MSE) Office: 308 Levine Phone: 215-573-2431 Email: stacilk@seas.upenn.edu Britton Carnevali Doctoral Program Manager Office: 310 Levine Phone: 215-898-5515 Email: brittonc@cis.upenn.edu Mariel Celentano Graduate Coordinator for ROBO Office: 459 Levine Phone: 215-573-4907 Email: robo-coord@seas.upenn.edu Julia Esposito PICS Program Coordinator, SCMP Academic Coordinator Office: 3401 Walnut, 5th 