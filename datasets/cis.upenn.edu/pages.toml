["https://www.cis.upenn.edu/graduate/advising/handbook"]
title = "Handbook"
full_description = "The CIS graduate programs are governed by the Departmental policies and procedures described below, as well as the common rules of the School of Engineering and Applied Science described in the Penn Engineering Graduate Student Handbook. Directions and procedures for registering using the Penn InTouch registration system are available here. During the advance registration period each semester, CIS graduate students are placed on an administrative “hold.” This is to ensure that students should consult with their advisors before registering for classes. Before you can register using Penn InTouch, the hold must be cleared, either by submitting a paper permission form signed by both student and advisor, or by an e-mail from the advisor to Redian Furxhiu. Once the hold is released, students can register, add/drop classes, etc. using Penn InTouch. A minimum GPA of 2.7 for master’s students must be maintained in order to be considered in good academic standing. If this minimum is not maintained, academic probation or dismissal from the program will be invoked. A 2.7 final GPA must be achieved to graduate in all situations. (Effective Fall 2007 class) Failure to maintain the minimum GPA requirement will result in placement on academic probation, prevent graduation, and may result in dismissal from the School. Doctoral students: Funded Ph.D. students must maintain full-time status by taking four courses in the Fall and Spring semesters respectively. Students participating in the teaching practicum are considered full-time while taking only three course units. Master’s students: Three courses in the Fall and Spring semesters respectively constitutes full-time enrollment for master’s students. Summer enrollment is not required. Part-time master’s students: Part-time students must take one or two course units each semester during both Fall and Spring (not Summer) semesters in order to remain continuously enrolled. Failure to maintain continuous enrollment will result in the student being dropped from the School’s rolls. Students are required to be continuously enrolled while in graduate school, unless an official leave of absence is requested by the student and granted by the Graduate Group chair. One exception is that students who have completed all their degree requirements before the beginning of a given semester and are to graduate in that semester may petition the Associate Dean to be exempted from registration."
year_published = 2025
