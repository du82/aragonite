full_description = "(New students are encouraged to consider the ASCS or BSE in Computer Science degrees, which, starting in 2020, offer a concentration in Cognitive Science. In the future we expect these tracks to offer more flexibility and opportunities.) This program combines studies in computer science and engineering with linguistics, mathematics, philosophy or psychology, and receive a BSE or BAS degree from Penn Engineering and Bachelor of Arts from the College of Arts and Sciences. Requirements for the program are guided by the degree sought (BAS or BSE), and include 12-16 course units in Linguistics, Mathematics, Philosophy or Psychology and 4 course units in a Foreign Language. All Dual Degree Programs (for example, combining Computer Science with a different degree from another School at Penn) are administered through Penn Engineering Research and Academic Services. For rules and regulations and how to apply, click here. PENN ENGINEERING©2017 |UNIVERSITY OF PENNSYLVANIA|SCHOOL OF ENGINEERING AND APPLIED SCIENCE | DEPARTMENT OF COMPUTER AND INFORMATION SCIENCE 3330 Walnut Street | Levine Hall | Philadelphia, PA 19104-6309 | 215-898-8560 Contact us with questions about the academic programs |Graduate Admissions information contact SEAS Graduate Admissions |For website issues, email the webmaster Report accessibility issues and get help Contact us with questions about admissions or academic programs | For website issues, email the webmaster"
