["https://www.cis.upenn.edu/events/reflections-by-50-years-of-women-cis-faculty"]
title = "Reflections by 50 Years of Women CIS Faculty"
description = "Reflections by 50 Years of Women CIS Faculty"
full_description = "Tuesday, March 28, 2023 5:00 to 6:00 PM Glandt Forum | Singh Center for Nanotechnology | 3205 Walnut Street Reception to follow for attendees | RSVP Here This event will be recorded and posted here at a later date Abstract: Women have always been part of computing at Penn, from the women who programmed the ENIAC, to the first woman faculty member, Ruzena Bajcsy, who arrived in 1972 as the CIS department was being formed, to new faculty members joining this year. This panel, consisting of women CIS faculty members from different decades over the past fifty years, will discuss what their experiences have been like, addressing the department and research environment, teaching, and climate for women. Professor Emeritus Electrical Engineering and Computer Sciences, University of California, Berkeley; Computer and Information Science, Penn Engineering Ruzena Bajcsy obtained the Master’s and Ph.D. degrees in electrical engineering from Slovak Technical University in 1957 and 1967, and the Ph.D. in computer science in 1972 from Stanford University. She joined the faculty of Penn’s CIS department as it was founded in 1972, and was the first woman to hold an administrative position in SEAS when she became the CIS department chair in 1985. While at Penn, Ruzena founded the General Robotics and Active Sensory Perception Laboratory (GRASP), where she introduced the idea of active perception in robotics. In 1998, Ruzena became the first woman to head the Computer and Information Science and Engineering Directorate of the National Science Foundation, where she had authority over a $500 million budget and helped establish the foundation’s Information Technology Research program. In 2001, she retired from Penn and left NSF to become the NEC professor of electrical engineering and computer science and Director Emeritus of CITRIS (the Center for Information Technology Research in the Interest of Society) at the University of California, Berkeley. Since 2021 she has been an emeritus professor at UC Berkeley as well as at Penn.."
