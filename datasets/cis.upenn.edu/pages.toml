["https://www.cis.upenn.edu/graduate/program-offerings/mse-in-embedded-systems"]
title = "MSE in Embedded Systems (EMBS)"
description = "MSE in Embedded Systems (EMBS)"
full_description = "The Embedded Systems (EMBS) Master’s program will no longer be accepting applications, effective Fall 2020 Academic Term. This program will be phased out as our current students complete their degrees in 2021. Potential applicants interested in EMBS should instead apply to related programs in Computer and Information Science (CIS), Data Science (DATS), Computer and Information Technology (CIT), Electrical Engineering (ESE), or Robotics (ROBO). The newly emerging discipline of embedded systems lies at the intersection of Computer Science and Electrical Engineering. The Master of Science in Engineering in Embedded Systems (EMBS) is offered jointly by the Departments of Computer and Information Science and Electrical and Systems Engineering within the School of Engineering and Applied Science. Directed by Rahul Mangharam, Ph.D., this innovative and unique degree program will train students in the fundamentals of embedded systems design and implementation. The EMBS degree program is integrated with the Penn Research in Embedded Computing and Integrated Systems Engineering (PRECISE) Center. This program is ideally suited for students with either computer science or electrical engineering academic backgrounds who wish to pursue industrial jobs in automotive, aerospace, defense, and consumer electronics, as well as for practicing engineers in the embedded systems industry who want to gain knowledge in state-of-the-art tools and theories. The core topics span embedded control, real-time operating systems, model-based design and verification, and implementation of embedded systems. Students enroll in a total of ten courses to complete the EMBS program, four core courses and six electives. We would like to emphasize that EMBS program is suitable for students who are interested in technical careers in embedded systems industry (automotive, avionics, consumer electronics, medical devices, defense, as the list above suggests). Students interested in more general computer science education should consider our CIS MSE program (suitable for students with an undergraduate degree in computer science) or MCIT program (suitable for students without a degree in computer science)."
