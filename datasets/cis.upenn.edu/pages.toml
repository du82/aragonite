title = "Program Options"
description = "Program Options"
full_description = "In all programs, the opportunity exists for the study of a diversity of subjects which satisfy personal desires, the development of a broad foundation for adapting to new societal demands, and the flexibility for moving into new areas of interest if a change in personal career direction develops. Several options exist for students to customize their undergraduate experience. A student who is interested in two of the Engineering and Applied Science majors may be permitted to expand his/her program in order to earn a degree in both majors. In such cases, the student must satisfy the degree requirements for both BSE curricula. (BAS students are not permitted to dual major within engineering.) A dual major earns a student a single degree from Penn Engineering with two majors listed. Students may combine a BAS or BSE degree with a second degree in one of Penn’s other undergraduate schools. A Dual Degree is not to be confused with options that result in a single degree, such as a “Dual Major,” (see above) where a student earns two majors within Penn Engineering, or with a “Second Major” (see below) where an engineering major also earns a major within the College. A graduate of a dual degree program graduates with degrees from two schools at Penn. Some engineering students may wish to consider a second major in the College of Arts and Sciences as an alternative to a dual degree. All College majors are open to engineering students (both BSE and BAS) as a second major. It is important to note that this program results in a single degree (from SEAS) with two majors, one in SEAS and one in SAS. Students interested in pursuing a second major in the College should contact directly the Department that offers the major. Students enrolled in the College of Arts and Sciences can apply for a second major in Computer Science. This will result in a single degree from the College with two majors. This option is not available for students enrolled in Penn Engineering. For information about a minor in Computer Science, click here. For information about a minor in Data Science, click here."
