title = "Cora Ingrum Center | for Community and Outreach"
description = "Cora Ingrum Center | for Community and Outreach"
full_description = "@media(max-width: 767px){ #home_content{ background-image: url('https://community.seas.upenn.edu/wp-content/uploads/2018/07/background-mobile.jpg')!important; } } Spotlight: Rivers in a changing world In West Philadelphia, an uncovered stream remains: Cobbs Creek, where 11 Penn students and 14 high school students from William L. Sayre High School gather on a mild morning for Rivers in a Changing World, an Academically Based Community Service (ABCS) class coordinated by the Netter Center for Community Partnerships. It is taught by Douglas J. Jerolmack, of the School of Arts & Sciences and the School of Engineering and Applied Science, in collaboration with LaRon Smith, a ninth-grade science teacher at Sayre. Read More Events + Programming Call for Spring 2025 Fife-Penn STEM & CS Academy Instructors The Fife-Penn STEM & CS Academy is an outreach program at Penn Engineering . They host STEM, coding, and robotics clubs for students in kindergarten to 8th grade. The clubs are in person (a few virtual) and after school. Instructors are paid $16 per hour, placed at a school site with another Penn student, and work approximately 3 hours per week for each club meeting. This is considered an on-campus job, and international students are welcome to apply! Apply Here Spring 2025 Walk-In Advising The Cora Ingrum Center hosts walk-in advising. Emily Delany from the Office of Academic Services (OAS) would be delighted to meet with you! Wednesdays through Feb. 26th | 10:00am - 12:00pm | Enter through Towne 211 View Flyer Penn Engineering Reflection Room Penn Engineering students are encouraged to take advantage of the recently established Reflection Room for prayer and meditation located in Hayden Hall. Hayden Hall | Room 120C | The door to the Reflection Room is usually unlocked Available 7am-5pm, Monday through Friday! Read More About the Cora Ingrum Center The Cora Ingrum Center for Community and Outreach leads and champions programming to support the Penn Engineering student body and positively impact the Philadelphia community. Through educational outreach and expanded opportunities for all students, the Center is the cornerstone of Penn Engineering’s activities that foster meaningful connections within the School and beyond. Learn More"
