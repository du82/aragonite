["https://www.cis.upenn.edu/graduate/program-offerings/mse-in-computer-graphics-and-game-technology/core-areas"]
title = "Core Areas"
full_description = "In order to adequately prepare students for work in computer graphics-related industries, the proposed master’s program curriculum will be composed of coursework distributed across the following core areas: This core area is intended to address issues related to designing, creating and analyzing the visual, auditory, psychological and entertainment aspects of interactive media and visual effects. Topics include creation of 3D models and animation, visual communication, film studies, storytelling and narrative, user interface design and human/computer interaction. This core area will cover topics in the areas of mathematics, physics, artificial intelligence, programming, algorithm design, computer graphics and animation technology, and game design and development. This core area covers topics associated with designing, developing and managing the production of computer graphics and game technology systems, content and authoring tools. This core area will cover topics in the areas of engineering entrepreneurship, intellectual property rights and management, media marketing, and the economics of the entertainment industry, including the ways games, movies and other digital content are funded, marketed and sold. Redian Furxhiu Program Manager for on-campus Graduate MCIT, CIS/MSE and CGGT programs Office: 308 Levine Phone: 215-898-1668 Email: redian@seas.upenn.edu Staci Kaplan Program Manager for DATS (Data Science MSE) Office: 308 Levine Phone: 215-573-2431 Email: stacilk@seas.upenn.edu Britton Carnevali Doctoral Program Manager Office: 310 Levine Phone: 215-898-5515 Email: brittonc@cis.upenn.edu Mariel Celentano Graduate Coordinator for ROBO Office: 459 Levine Phone: 215-573-4907 Email: robo-coord@seas.upenn.edu Julia Esposito PICS Program Coordinator, SCMP Academic Coordinator Office: 3401 Walnut, 5th Fl. Phone: 215-573-6037 Email: jnespos@seas.upenn.edu PENN ENGINEERING©2017 |UNIVERSITY OF PENNSYLVANIA|SCHOOL OF ENGINEERING AND APPLIED SCIENCE | D