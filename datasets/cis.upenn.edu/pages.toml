title = "Elior Sulem's Homepage"
full_description = "I am a Lecturer at the Department of Software and Information Systems Engineering at Ben-Gurion University of the Negev. My research fields are Computational Linguistics and Natural Language Processing (NLP). I am particularly interested in Computational Semantics studying (i) the ways semantic and cognitive information can be used to improve the performance of text generation tasks; (ii) the construction of systems that provide an understanding of a written text and of the events described in it; (iii) the capture of meaning beyond what is explicitly written in the text. I am also very interested in Computational Psycholinguistics, using NLP methods in order to model Child Language Acquisition and Human Language Processing. I previously was a Postdoctoral Researcher at the Cognitive Computation Group at the Department of Computer and Information Science, University of Pennsylvania with Prof. Dan Roth. I completed my Ph.D.at the Computational Linguistics and Natural Language Processing Lab at the School of Computer Science and Engineering of The Hebrew University of Jerusalem, under the supervision of Prof. Ari Rappoport where I worked on the integration of semantic and cognitive information into Text Simplification and Machine Translation. Previously, I graduated my master's degree (magna cum laude) in Cognitive Science, under the supervision of Prof. Ari Rappoport [dissertation] (Cognitive Sciences Department's prize for outstanding thesis). I previously completed a B.Sc. degree in Mathematics (extended program) and Cognitive Sciences at the Hebrew University. I was a fellow of the Language, Logic and Cognition Center (LLCC) from 2012 to 2016. Capturing the Content of a Document through Complex Event Identification Zheng Qi , Elior Sulem, Haoyu Wang, Xiaodong Yu and Dan Roth, *SEM 2022 [Paper: pdf][Code: github][Slides: pdf][Video: link] Yes, No or IDK: The Challenge of Unanswerable Yes/No Questions. Elior Sulem, Jamaal Hay and Dan Roth, NAACL 2022 [Paper: pdf][Data & Code: github][Slides: pdf][Poster: pdf][Video: link]"
