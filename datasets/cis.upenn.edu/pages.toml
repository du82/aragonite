title = "Second Major in CS"
description = "Second Major in CS"
full_description = "Students in the College of Arts and Sciences can add Computer Science as a second major. College students will receive one degree from the College of Arts and Sciences. This major will appear as second major on your college transcript. To major in Computer Science, College students must take the following 12 required courses (All courses must be taken for a letter grade): Requirements: Students who wish to apply must have a cumulative GPA of 3.0 or above and a B in CIS 1200 (formerly CIS 120). In addition, students must apply before the fall semester of junior year. Applications will not be processed unless the above requirements are met. *Project electives include: CIS 3410, CIS 3500, CIS 3710, CIS 3800, CIS 4120/5120, CIS 4410/5410, CIS 4480/5480, CIS 4500/5500, CIS 4550/5550, CIS 4600/5600, CIS 4710/5710, CIS 5050, CIS 5530, ESE 3500 and NETS 2120. **A CIS Elective is any CIS or NETS engineering course except the courses listed HERE under CIS. Additionally, the following course may be used to satisfy a CIS Elective requirement: ESE 3500. For further clarification, see the Undergraduate Student Handbook. Double Counts: CIS Second Major students can double-count courses toward their second major requirements and their primary major. However, students should always confirm with their primary/home major whether there are any limitations as to which or how many courses can double-count. PENN ENGINEERING©2017 |UNIVERSITY OF PENNSYLVANIA|SCHOOL OF ENGINEERING AND APPLIED SCIENCE | DEPARTMENT OF COMPUTER AND INFORMATION SCIENCE 3330 Walnut Street | Levine Hall | Philadelphia, PA 19104-6309 | 215-898-8560 Contact us with questions about the academic programs |Graduate Admissions information contact SEAS Graduate Admissions |For website issues, email the webmaster Report accessibility issues and get help Contact us with questions about admissions or academic programs | For website issues, email the webmaster"
