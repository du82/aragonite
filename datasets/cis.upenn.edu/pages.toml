["https://www.cis.upenn.edu/graduate/program-offerings/master-of-computer-and-information-technology/requirements"]
title = "Requirements"
description = "Requirements"
full_description = "It is expected that full-time MCIT students will take the six required courses during the first two semesters of enrollment and four electives during their second year. CIT 5910, 5920, and 5930 are offered in the Fall semester only. They are the prerequisites for CIT 5940, 5950, and 5960, respectively, which are offered in the Spring semester only. Courses can be waived or replaced only with the permission of the instructor. As of Fall 2016, students must pass a proficiency exam in order to waive a course. All MCIT courses must be completed (or waivers obtained) during the first semester that the course is offered during the student’s time in the program. Students may not waive or replace more than two required MCIT courses. Courses that are waived need to be replaced with a suitable alternative. While students are allowed to waive at most 2 courses a semester, no student can take a course and then waive the course that this course is a prereq for. Therefore, if you take 5910, you will take 5940. If you take 5920, you will take 5960. If you take 5930, you are expected to take 5950. One course from the list of pre-approved non CIS graduate courses, found here, may be used as an elective. Graduate courses offered in other departments may count as an elective with the prior approval of the MCIT program director; in general, such courses must have a strong technical component in order to be approved. A minimum GPA of 2.7 for master’s students must be maintained in order to be considered in good academic standing. If this minimum is not maintained, academic probation or dismissal from the program will be invoked. A 2.7 final GPA must be achieved to graduate in all situations. MCIT students may apply to continue in the Master of Science in Engineering in Computer and Information (CIS/MSE) program. Students pursuing this dual degree route need to satisfy a minimum GPA requirement, have earned a high grade in at least one CIS elective, and have completed the majority of the MCIT requirements at the time of applying. In addition to the ten courses required for the MCIT program, students continuing in the CIS/MSE program need to take six additional CIS graduate courses for a total of sixteen credits; satisfactory completion results in the awarding of the MCIT and CIS/ MSE degrees. Click here to access the CIS/MSE degree requirements. Click here to access the MCIT-CIS/MSE dual degree application."
