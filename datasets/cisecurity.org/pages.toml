["https://cisecurity.org/communities/benchmarks"]
title = "CIS Benchmarks Community"
description = "CIS Benchmarks are consensus-developed security configuration recommendations both created and trusted by a global community of IT security professionals."
full_description = '''HomeCIS CommunitiesCIS Benchmarks CommunityCIS Benchmarks CommunityCIS Benchmarks™ are the only consensus-developed secure configuration recommendations both created and trusted by a global community of IT security professionals from academia, government, and industry.Access CIS WorkBench to join the CommunityJoin Now Help Develop and Maintain the CIS Benchmarks There are more than 12,000 professionals in the CIS Benchmarks Communities. Creating CIS Benchmarks recommendations requires a wide variety of skills. If you have expertise in risk, security, compliance, or technology and a collaborative spirit, you’re just the kind of person we’re looking for. Watch video to learn more Multiple Volunteering Roles and Ways you can help and be a part of the community. Technical and Security Subject Matter Expert (SME) Share expertise in a given technology family and/or in broad security issues and system interactions to devise the recommendations for a CIS Benchmark. Editor Make changes directly to the CIS Benchmarks themselves. (Note: This position requires a higher level of commitment and responsibility than some of the other volunteer roles. As such, it requires a signed agreement between you and the CIS.) Technical Writer Use strong writing and proofreading skills to clearly articulate CIS Benchmarks recommendations. Tester Review and comment on technical details of the open discussions or tickets on a particular CIS Benchmark. Contributor Use a ticketing system to propose changes to the content of a CIS Benchmark. Alternatively, they can get help and/or answer other people's questions within a community Q&A discussion forum. Read More Perks of Volunteering All volunteers have the benefit of working together with like-minded individuals who are committed to creating confidence in the connected world. Expert volunteers contributing to CIS Benchmarks guidance ensure more accurate recommendations from the people who know the technologies best. Editors enjoy the added benefit of earning CPEs through (ISC)² for their work. How to Get Started Sign in to your CIS WorkBench account. Don't have one yet? It's free to join. Download and review our CIS Benchmarks Development Guide. Look up a particular technology, system, or area of expertise related to the CIS Benchmarks in the "Communities" tab. Become a part of a CIS Benchmarks community by clicking here. At that point, you can begin posting questions, submitting tickets, and exploring other ways you can help the community you've joined. Need further assistance? Please email your questions to [email protected]Meet Our VolunteersSean McCownUSAJamie ScottUSATouhid ShaikhUSAPhil ChathamUSADaniel JasiakUSAMartin WhiteInternationalBruce BadingUSAPaul CampbellUSANancy Hidy WilsonUSAWhat Our Volunteers Are SayingThe greatest strength in 'Security' is 'Community.' Participation in the communities that create the CIS Benchmarks not only makes for better Benchmarks, as we all bring our unique perspectives and knowledge to the group, but it also strengthens us as individuals. Old ideas are challenged, new ideas are introduced, and the merits of several perspectives come together to help define 'what is security?”Linux CIS Benchmarks Community ParticipantAccess CIS WorkBench to join the Community Join Now Access CIS WorkBench Access CIS WorkBench Communities in need of volunteers API Security Guide: email [email protected] Azure DevOps: email [email protected] Check Point Firewall Cisco (preferred focus on NX-OS, ACI, ASA, iOS, Meraki, Firepower) F5 Networks GitHub GitLab Google Android Juniper Networks (preferred focus on Junos OS) MariaDB Microsoft SQL Server Palo Alto Networks PostgreSQL VMware (preferred with EXSi expertise) We value your questions and feedback At CIS, we are committed to serving the greater IT security community. Contact Us TodayRelated ResourcesApache CassandraAmazon Web ServicesCiscoF5JuniperMicrosoft Exchange ServerMicrosoft SQL ServerPalo Alto NetworksPostgreSQLInformation HubCIS BenchmarksWhite Paper02.13.2025CIS Year in Review 2024Read MoreBlog Post02.05.2025CIS Benchmarks February 2025 UpdateRead MoreBlog Post01.14.2025CIS Benchmarks January 2025 UpdateRead MoreWebinar01.10.2025Effective Implementation of the CIS Benchmarks and CIS ControlsRead More'''
