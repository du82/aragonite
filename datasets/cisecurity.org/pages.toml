title = "CIS-CAT® Pro"
description = "Review some of the common questions about CIS-CAT Pro, the Center for Internet Security's configuration assessment tool."
full_description = "HomeCybersecurity ToolsCIS-CAT® ProCIS-CAT® ProA powerful tool for automating CIS Benchmark assessment and reportingThe CIS Benchmarks are a powerful set of best practices to help your organization ensure its IT systems, software, networks, and cloud infrastructure are securely configured. Testing those configurations can be a labor-intensive process – and that can be a challenge for many organizations. As a CIS SecureSuite Member, you gain access to tools that help make assessing and reporting significantly easier and more effective. Our configuration assessment tool, CIS-CAT Pro, turns the best practices of the CIS Benchmarks and CIS Controls into actionable insights by scanning systems and reporting on their levels of compliance. Get Access CIS-CAT Pro OverviewFeatures Compatible with tailored CIS Benchmarks Customize CIS Benchmarks utilizing CIS WorkBench, export them into automated content, and use them to assess your compliance with key security requirements. Reports mapped to the CIS Critical Security Controls (CIS Controls) Evaluate your target system security with reports that map your systems' results to the CIS Controls. Prioritize issue response based on where results fall in the three Implementation Groups. Part of CIS SecureSuite Gain access to scalable, customizable tools and resources to evaluate your organization's unique security needs. Dedicated CIS SecureSuite Member Success Managers and enhanced technical support are available to help. Free assessment tool available Use the unlimited scans available to you with CIS-CAT Lite, a free assessment tool, to evaluate the configurations of select technologies. Start assessing your configuration to CIS Benchmarks today! Get access to CIS-CAT Pro through CIS SecureSuite Membership to start scanning systems and view reporting. Apply for membershipCIS-CAT Pro Overview Compatible with tailored CIS Benchmarks Customize CIS Benchmarks utilizing CIS WorkBench, export them into automated content, and use them to assess your compliance with key security requirements. Reports mapped to the CIS Critical Security Controls (CIS Controls) Evaluate your target system security with reports that map your systems' results to the CIS Controls. Prioritize issue response based on where results fall in the three Implementation Groups. Part of CIS SecureSuite Gain access to scalable, customizable tools and resources to evaluate your organization's unique security needs. Dedicated CIS SecureSuite Member Success Managers and enhanced technical support are available to help. Free assessment tool available Use the unlimited scans available to you with CIS-CAT Lite, a free assessment tool, to evaluate the configurations of select technologies. Start assessing your configuration to CIS Benchmarks today! Get access to CIS-CAT Pro through CIS SecureSuite Membership to start scanning systems and view reporting. Apply for membershipFeaturesLearn what is included in the CIS-CAT Pro Think of CIS-CAT Pro as a trusty tool that can assist you on your journey to creating a more secure technology environment. Evaluate your configuration settings against the recommendations in the CIS Benchmarks with CIS-CAT Pro Assessor. View your results and track configuration drift with CIS-CAT Pro Dashboard - a user-friendly interface that is designed to ingest CIS-CAT Pro Assessor results. The Dashboard also coordinates with the CIS-CAT Pro Assessor to perform single, remote configuration settings. For additional protection use the CIS Controls Assessment Model (CIS Controls v7.1) to achieve essential cyber hygiene by evaluating your configurations against Implementation Group 1 (IG1) of the CIS Critical Security Controls v7.1 CIS-CAT Pro Assessor CIS-CAT Pro Assessor evaluates the cybersecurity posture of a system against recommended policy settings. The tool helps organizations save time and resources by employing automated content with policy setting recommendations based on 100+ globally recognized CIS Benchmarks. The tool is maintained at a location under each Member’s control. Whether your organization’s use is virtual, cloud, in-network, or on a local machine, CIS-CAT Pro helps ensure compliance to policies. CIS-CAT Pro Assessor v4 includes functions to assess remote or local target systems whether they reside in the cloud or on-premises.CIS-CAT Pro Dashboard CIS-CAT Pro Dashboard is a web-based application that provides a graphical interface for viewing assessment results generated by CIS-CAT Pro Assessor. View overall or Benchmark-specific average configuration scores in CIS-CAT Pro Dashboard. View configuration scores by each individual CIS Benchmark, with options to view by CIS Critical Security Controls for annotated Benchmark content. It is also possible to view the configuration results by user-defined tags that help with grouping target systems and applying exceptions.CIS-CAT Pro Dashboard – Remote Assessment CIS-CAT Pro Dashboard allows for single, on-demand configuration assessments against a single, remote target system. The remote assessment feature within CIS-CAT Pro dashboard supports assessments of operating systems and some applications.CIS Controls Assessment Module With the CIS Controls Assessment Module, assess target machines against the CIS Controls v7.1 Implementation Group 1 (IG1) using CIS-CAT Pro. The CIS Controls Assessment Module offers automated endpoint assessment against Microsoft Windows 10 and server environments. It consists of a scanning component as well as manual questions to assess compliance. To learn more about this CIS-CAT Pro feature, please view our webinar recording: Introducing the CIS Controls Assessment Module.Start assessing your configuration to CIS Benchmarks today! Get access to CIS-CAT Pro through CIS SecureSuite Membership to start scanning systems and view reporting. Apply for membershipWant to try CIS-CAT before purchasing CIS SecureSuite? With CIS-CAT Lite you get access to unlimited scans, enabling you to instantly check your systems against select CIS Benchmarks, receive a compliance score, and more! Learn more about CIS-CAT LiteWebinarsJoin our next webinar to learn more about CIS-CAT Pro.Review NowBlogs Read featured blog post Remote Assessment comes to CIS-CAT Pro Assessor v4View all blog postsFAQsWe've answered some common questions about CIS-CAT Pro Assessor and CIS-CAT Pro Dashboard.Read On Already a SecureSuite Member? Sign in to your account. Login Portal Ready to Try CIS-CAT? Sign up Today Questions? Still have questions or need more information? You can contact us directly. Get in TouchInformation HubCIS BenchmarksWhite Paper02.13.2025CIS Year in Review 2024Read MoreBlog Post02.05.2025CIS Benchmarks February 2025 UpdateRead MoreBlog Post01.14.2025CIS Benchmarks January 2025 UpdateRead MoreWebinar01.10.2025Effective Implementation of the CIS Benchmarks and CIS ControlsRead More"
