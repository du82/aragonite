["https://cisecurity.org/communities/controls"]
title = "CIS Critical Security Controls Communities"
description = "The CIS Controls communities include IT security professions who help to create and update the guidance and security best practices of the CIS Controls."
full_description = '''HomeCIS CommunitiesCIS Critical Security Controls CommunitiesCIS Critical Controls CommunitiesThe CIS Critical Security Controls (CIS Controls) are a prescriptive, prioritized, and simplified set of cybersecurity best practices that, when implemented, provide an effective cybersecurity program.Access CIS WorkBench to join the CommunitiesJoin Now Get Help with and Give Help To the CIS Controls Are you new to the CIS Controls and have a question? Are you an expert wanting to share ideas for improvement? The CIS Controls Communities were created for everyone to share and learn from each other. All you need to do is join a community and create a discussion with your question. A community volunteer will be happy to help you. There are hundreds of IT security professionals in the CIS Controls Communities. If you have expertise in risk, security, compliance, or technology and a collaborative spirit, you’re just the kind of person we’re looking for to help contribute to the CIS Controls Communities! Play a Part in Developing Security Best Practices We are always looking for community volunteers. Here are some ways you can volunteer: Review and/or update new versions of the CIS Controls Review and/or develop companion guides Review and/or create mappings to security compliance frameworks Assist in the development of other resources relevant to the CIS Controls Partake in peer-to-peer assistance like translation work, helping others, and posting questions Perks of Volunteering All volunteers have the benefit of working with like-minded individuals who are committed to creating confidence in the connected world. The more you participate, the more exposure you get in the community/communities you've joined. Participating in CIS WorkBench collaborations and attending working group meetings, for instance, can result in your name being listed as a "contributor" in the respective guide, mapping, or paper. How to Get Started We recommend creating a free CIS WorkBench account to see the available communities. View all communitiesMeet Our VolunteersRick DotenUSAJames and Kelli TaralaUSAGiacomo LunardonInternationalDavid TchozewskiUSAPhil LangloisUSAStaffan HuslidInternationalGreg CarpenterUSATyler DesjardinisInternationalKen MuirInternationalKeala AsatoUSAMeet Our AmbassadorsMeet all Ambassadors Alan WatkinsUSATony KrzyzewskiInternationalVilius BenetisInternationalChirag AroraUSAWhat Our Volunteers Are SayingThe CIS Controls Community is a great place to share and learn from others who have a real desire to help organizations reduce their level of risk. Every single one of the Controls is discussed, debated, (and even) argued at times. This level of interaction is really stimulating.”Access CIS WorkBench to join the Community Join Now .right-rail {display: none} Access CIS WorkBench Access CIS WorkBench Communities in need of volunteers View All Additional Resources CIS Controls CIS Controls Navigator We value your questions and feedback At CIS, we are committed to serving the greater IT security community. Contact Us TodayRelated ResourcesCiscoMicrosoft AzureOracle MySQLZoom Video CommunicationInformation HubCIS ControlsWhite Paper02.13.2025CIS Year in Review 2024Read MoreWhite Paper02.07.2025CIS Controls v8.1 Mapping to MCSB v1Read MoreWhite Paper02.05.2025CIS Controls v8.1 Mapping to NERC-CIP StandardsRead MoreWhite Paper02.05.2025CIS Controls v8.1 Mapping to SOC2Read More'''
