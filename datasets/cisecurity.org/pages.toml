full_description = "HomeCybersecurity ServicesCybersecurity ServicesCIS Services® provides specialized expertise to support U.S. State, Local, Tribal, and Territorial (SLTT) entities to augment a defense-in-depth approach for cybersecurity. Many of these cost-effective solutions include 24x7x365 monitoring and management through CIS's Security Operations Center (SOC) as well as incident response support.Download more informationCIS ServicesCIS CyberMarketRecognition + Testimonials .tippy-content .c-cta--secondary { margin-bottom: 0; border-left: .4rem solid #fff; font-weight: 400; padding-top: .5rem; padding-bottom: .5rem; } .tippy-content .c-cta--secondary:after { background-image: url(/dist/cisecurity/img/icon-arrow-right-white-mobile.d5ac13ba.svg); background-repeat: no-repeat; background-size: contain; width: 1.7rem; min-width: 1.7rem; height: 1.3rem; min-height: 1.3rem; } Intrusion Detection Albert Network Monitoring and Management is an Intrusion Detection System (IDS) to monitor for suspicious activity. Receive actionable alerts within minutes of threat detection. This solution includes 24x7x365 Security Operations Center (SOC), which functions as an extension of your security team by filtering out false positives, eliminating alert fatigue by only notifying when there's an actionable alert, and enhancing your security posture with threat intelligence, custom analytics, and response support. For SLTTs only. Endpoint Protection CIS Endpoint Security Services (ESS) deploys directly on workstations, servers, and other endpoints, delivering device-level protection against both signature-based and behavior-based malicious activity, exclusively for SLTTs. This solution includes the 24x7x365 CIS Security Operations Center (SOC), which functions as an extension of your security team by filtering out false positives, eliminating alert fatigue by only notifying when there's an actionable alert, and enhancing your security posture with threat intelligence, custom analytics, and response support. Mobile Protection available as a stand-alone feature or as an optional add-on Multi-Tenancy available as an optional add-on Spotlight Vulnerability Module available as an optional add-on Malicious Domain Blocking and Reporting Plus MDBR+ proactively identifies and blocks malware, ransomware, and phishing attacks while providing security teams with real-time reports, custom configurations, and off-network device protection to reduce risk and increase cybersecurity defenses. For SLTTs and private hospitals only. Log Analysis and Event Reporting CIS's Managed Security Services (MSS) provides log and security event monitoring of existing devices, filtering out false positives so that your team receives alerts only of impactful events. This solution includes 24x7x365 Security Operations Center (SOC), which functions as an extension of your security team by filtering out false positives, eliminating alert fatigue by only notifying when there's an actionable alert, and enhancing your security posture with threat intelligence, custom analytics, and response support. For SLTTs only. Penetration Testing Leverage network and web application penetration testing services that enable you to safely assess your security posture. For everyone. LEARN MORE Vulnerability Assessments Cost-effectively identify vulnerabilities in your networks and web applications so that you can take remediation steps to improve your security posture. For everyone. LEARN MORECIS Services .tippy-content .c-cta--secondary { margin-bottom: 0; border-left: .4rem solid #fff; font-weight: 400; padding-top: .5rem; padding-bottom: .5rem; } .tippy-content .c-cta--secondary:after { background-image: url(/dist/cisecurity/img/icon-arrow-right-white-mobile.d5ac13ba.svg); background-repeat: no-repeat; background-size: contain; width: 1.7rem; min-width: 1.7rem; height: 1.3rem; min-height: 1.3rem; } Intrusion Detection Albert Network Monitoring and Management is an Intrusion Detection System (