["https://cisecurity.org/insights/blog/cis-benchmarks-february-2025-update"]
title = "CIS Benchmarks February 2025 Update"
description = "Here is an overview of the CIS Benchmarks that the Center for Internet Security (CIS) updated or released for February 2025."
full_description = "HomeInsightsBlog PostsCIS Benchmarks February 2025 UpdateCIS Benchmarks February 2025 Update The following CIS Benchmarks™ have been updated or recently released. We've highlighted the major updates below. Each Benchmark includes a full changelog that references all changes. CIS Benchmarks Updated Last Month CIS Apache Cassandra 4.0 Benchmark v1.2.0 CIS Apache Cassandra 4.1 Benchmark v1.1.0 CIS AWS Compute Services Benchmark v1.1.0 CIS Oracle MySQL Community Server 8.0 Benchmark v1.1.0 CIS Oracle MySQL Enterprise Edition 8.0 Benchmark v1.4.0 CIS Apache Cassandra 4.0 Benchmark v1.2.0 This Benchmark includes support for Apache Cassandra 4.0.15. All recommendations have been reviewed, tested, and validated to support version 4.0.15. This Benchmark exemplifies the great things a community of users, vendors, and subject matter experts can accomplish through consensus collaboration. The CIS community thanks the entire consensus team. Special thanks go to Joeseph Testa, Tony Wilwerding, and Matthew Reagan. Download the CIS Apache Cassandra Benchmark in PDF. CIS SecureSuite® Members can visit CIS WorkBench here to download other formats and related resources. CIS Apache Cassandra 4.1 Benchmark v1.1.0 This Benchmark includes support for Apache Cassandra 4.1.7. All recommendations have been reviewed, tested, and validated to support version 4.1.7. This Benchmark exemplifies the great things a community of users, vendors, and subject matter experts can accomplish through consensus collaboration. The CIS community thanks the entire consensus team. Special thanks go to Joeseph Testa, Tony Wilwerding, and Matthew Reagan. Download the CIS Apache Cassandra Benchmark in PDF. CIS SecureSuite Members can visit CIS WorkBench here to download other formats and related resources. CIS AWS Compute Services Benchmark v1.1.0 Some items of note for this update: Added multiple new sections to cover newly added services Added 14 new recommendations for added services Mapped and updated mapping to CIS Safeguards Thank you to all in the community who contributed to the development of this release. Huge thanks go to Rachel Rice. Download the CIS Amazon Web Services Benchmark in PDF. CIS SecureSuite Members can visit CIS WorkBench here to download other formats and related resources. CIS Oracle MySQL Community Server 8.0 Benchmark v1.1.0 Some items of note for this update: Added four new recommendations in MySQL Permissions section Addressed 10 tickets Updated Remediation procedures for one recommendation A huge thank you to the CIS Oracle MySQL Community for making this happen. Special thanks go to Michael Frank. Download the CIS Oracle MySQL Benchmark in PDF. CIS SecureSuite Members can visit CIS WorkBench here to download other formats and related resources. CIS Oracle MySQL Enterprise Edition 8.0 Benchmark v1.4.0 Some items of note for this update: Added four new recommendations in MySQL Permissions section Addressed 10 tickets Updated Remediation procedures for one recommendation A huge thank you to the CIS Oracle MySQL Community for making this happen. Special thanks go to Michael Frank. Download the CIS Oracle MySQL Benchmark in PDF. CIS SecureSuite Members can visit CIS WorkBench here to download other formats and related resources. New CIS Benchmarks Released Last Month CIS Apache Cassandra 5.0 Benchmark v1.0.0 CIS Oracle MySQL Community Server 8.4 Benchmark v1.0.0 CIS Oracle MySQL Enterprise Edition 8.4 Benchmark v1.0.0 CIS PostgreSQL 17 Benchmark v1.0.0 CIS Apache Cassandra 5.0 Benchmark v1.0.0 This Benchmark is a new technology version that provides support for the latest GA version of Apache Cassandra. It includes support for Apache Cassandra 5.0.2. All recommendations have been reviewed, tested, and validated to support version 5.0.2. This Benchmark exemplifies the great things a community of users, vendors, and subject matter experts can accomplish through consensus collaboration. The CIS community thanks the entire consensus team. Special thanks go to Joeseph Testa, Tony Wilwerding, and Matthew Reagan. Download the CIS Apache Cassandra Benchmark in PDF. CIS SecureSuite Members can visit CIS WorkBench here to download other formats and related resources. CIS Oracle MySQL Community Server 8.4 Benchmark v1.0.0 Some items of note for this release: Added six new recommendations in Encryption and MySQL Permissions sections Addressed eight tickets Updated Remediation procedures for one recommendation A huge thank you to the CIS Oracle MySQL Community for making this happen. Special thanks go to Michael Frank. Download the CIS Oracle MySQL Benchmark in PDF. CIS SecureSuite Members can visit CIS WorkBench here to download other formats and related resources. CIS Oracle MySQL Enterprise Edition 8.4 Benchmark v1.0.0 Some items of note for this release: Added six new recommendations in Encryption and MySQL Permissions sections Addressed eight tickets Updated Remediation procedures for one recommendation A huge thank you to the CIS Oracle MySQL Community for making this happen. Special thanks go to Michael Frank. Download the CIS Oracle MySQL Benchmark in PDF. CIS SecureSuite Members can visit CIS WorkBench here to download other formats and related resources. CIS PostgreSQL 17 Benchmark v1.0.0 Some items of note for this release: Added a recommendation for passwordcheck Added a recommendation for password complexity Revised the Logging, Monitoring, and Auditing section A huge thank you to entire CIS PostgreSQL Community for making this happen. Special thanks go to Doug Hunley and Crunchy Data. Download the CIS PostgreSQL Benchmark in PDF. CIS SecureSuite Members can visit CIS WorkBench here to download other formats and related resources. Get involved by helping us develop content, review recommendations, and test CIS Benchmarks. Join a community today! If you're interested, please reach out to us at [email protected]. You can also learn more on the CIS Benchmarks Community page."
