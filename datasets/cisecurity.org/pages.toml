["https://cisecurity.org/isac"]
title = "ISAC Info"
description = "What is an ISAC? CIS is home to the MS-ISAC® and the EI-ISAC®, which work together to provide a variety of services, including monitoring by a 24/7 Security Operations Center (SOC). ISACs collect, analyze and disseminate actionable threat information to their members and provide members with tools to mitigate risks and enhance resiliency. Join MS-ISAC […]"
full_description = "HomeISAC InfoWhat is an ISAC?An Information Sharing and Analysis Center (ISAC) collects, analyzes, and disseminates actionable threat information to members and provides them with tools to mitigate risks and improve resiliency.Join MS-ISACJoin EI-ISACCIS is home to the MS-ISAC and the EI-ISAC The scale and impact of cyber-attacks continue to escalate. While many public sector organizations are challenged to keep pace, there is help available. The Center for Internet Security® (CIS®) is home to the Multi-State Information Sharing and Analysis Center® (MS-ISAC®) and the Elections Infrastructure Information Sharing and Analysis Center® (EI- ISAC®). They provide a variety of services that augment and enhance members' cybersecurity teams. As a member you'll get access to a community that will help you stay up to date on cyber threats facing your industry. You will also receive tools, tips, and tricks for defending against these cyber threats. Here are just some of the benefits of joining: A 24x7x365 Security Operations Center (SOC) that offers threat intelligence, detection, and response assistance Education and training opportunities through tabletop exercises, regular webinars, and more Access to the Nationwide Cybersecurity Review (NCSR) to review your cybersecurity maturity No cost integrated cybersecurity tools and resources from CIS SecureSuite View the full list of membership benefits MS-ISAC The mission of the Multi-State Information Sharing & Analysis Center (MS-ISAC) is to improve the overall cybersecurity posture of U.S. State, Local, Tribal, and Territorial (SLTT) government organizations through coordination, collaboration, cooperation, and increased communication. There is no cost to join the MS-ISAC, and membership is open to all U.S. SLTT government organizations. Explore MS-ISAC Join MS-ISAC EI-ISAC The Elections Infrastructure Information Sharing and Analysis Center (EI-ISAC) supports the rapidly changing cybersecurity needs of U.S. election offices. Membership in EI-ISAC is available at no cost to all SLTT governments that support U.S. election offices and related associations. Every U.S. election office that joins EI-ISAC automatically becomes a member of the MS-ISAC. Explore EI-ISAC Join EI-ISAC Join MS-ISAC Join EI-ISAC We value your questions and feedback At CIS, we are committed to serving the greater IT security community. Contact us todayInformation HubWhite Paper02.13.2025CIS Year in Review 2024Read MoreWhite Paper02.07.2025CIS Controls v8.1 Mapping to MCSB v1Read MoreMedia Mention02.06.20252025 Homeland Security Threat Forecast: Multidimensional- Physical, Cyber, Information Operations- ThreatsRead MoreMedia Mention02.06.20252025 Homeland Security Threat Forecast Parts II and IIIRead More"
