description = "Opportunity Process Get an inside look at how the CIS CyberMarket identifies products and services that help meet the needs of MS-ISAC members and other organizations participating in our purchasing program. CyberMarket Opportunity Process Vendor Selection CyberMarket uses this model selection criterion to select proposals for opportunity buys. All vendor proposals are scored and rated […]"
full_description = "HomeCybersecurity ServicesCIS CyberMarketVendor InformationVendor InformationOverview & BenefitsQualification ProcessSelection CriteriaWhy join CIS CyberMarket? CIS CyberMarket is a marketplace that offers cybersecurity vendors exclusive access and marketing to a well-established, ready-made customer base of 17,000+ U.S. public sector organizations, for an affordable annual membership fee. CIS CyberMarket is continually looking for companies interested in building their credibility and market share among this hard-to-reach sector by providing industry-leading cybersecurity resources and solutions at negotiated price points. Exclusive Marketing & Lead Generation BenefitsAdvertising OpportunitiesConference SponsorshipsEmail CampaignsHosted Pre-recorded Webinars & VideosLIVE Member WebinarsMonthly Membership PresentationsThought Leadership ArticlesVendor PartnersMFAEdge DNSSecure Internet AccessPhish ProtectionDMARC ReportPassword AuditorPassword Policy ComplianceRuntime Integrity ServiceCyber Risk Consulting ServicesEdge Network Vulnerability ScannersSecurity Awareness TrainingNetWarsProfessional Certification CoursesCompliance Automation & RemediationVulnerability Risk ManagementZero Trust ExchangeReferrals If you have a product or service that would benefit MS-ISAC and EI-ISAC members, please emails us at [email protected]. Our dedicated staff will review your submission and reach out within a few days.Overview & BenefitsWhy join CIS CyberMarket? CIS CyberMarket is a marketplace that offers cybersecurity vendors exclusive access and marketing to a well-established, ready-made customer base of 17,000+ U.S. public sector organizations, for an affordable annual membership fee. CIS CyberMarket is continually looking for companies interested in building their credibility and market share among this hard-to-reach sector by providing industry-leading cybersecurity resources and solutions at negotiated price points. Exclusive Marketing & Lead Generation BenefitsAdvertising OpportunitiesConference SponsorshipsEmail CampaignsHosted Pre-recorded Webinars & VideosLIVE Member WebinarsMonthly Membership PresentationsThought Leadership ArticlesVendor PartnersMFAEdge DNSSecure Internet AccessPhish ProtectionDMARC ReportPassword AuditorPassword Policy ComplianceRuntime Integrity ServiceCyber Risk Consulting ServicesEdge Network Vulnerability ScannersSecurity Awareness TrainingNetWarsProfessional Certification CoursesCompliance Automation & RemediationVulnerability Risk ManagementZero Trust ExchangeReferrals If you have a product or service that would benefit MS-ISAC and EI-ISAC members, please emails us at [email protected]. Our dedicated staff will review your submission and reach out within a few days.Qualification ProcessActivities that occur during this process may include, but are not limited to: Product Identification Different methods are available for groups to reach out to the CyberMarket team to refer vendors and products:CyberMarket InboxCIS Stakeholder ReferralsSLTT Member RecommendationsAnnual MS-ISAC & EI-ISAC meetingVendor Outreach The CyberMarket team uses varies tools to understand the SLTT needs and requirements. Based on this analysis, vendors may be contacted and invited to our vetting process:Product assortment gapsNCSR reportAssessment reportsMember feedbackVendor Evaluation Process The steps below outline our vetting process for vendors and products: Vendor Selection and Negotiation Chosen vendors are contacted. Terms and conditions are clarified with chosen vendors. Contracts are drawn with chosen vendors. Website and marketing strategy are developed for purchasing opportunity. Contract approval process is performed. The CIS CyberMarket team reserves the right to choose vendors offering the best opportunity for our customers.Selection CriteriaThis is an example of potential vendor selection criteria. Many items listed under “Business Requirements” and “Vendor Requirements” will be incorporated into most selection criteria, however, the CIS CyberMarket team reserves the right to modify requirements for each potential opportunity. Business Requirements Ordering and delivery process is uncomplicated for end user Price affords a significant savings for customer and is competitive with lowest known price formally offered Senior-level point of contact is provided to work with the CIS CyberMarket team Product Requirements Has proven ability to improve cyber-security posture Product specification requirements will be added as necessary by internal/external SMEs (ex. size, capacity, ability to work with multiple systems, etc.) Vendor Requirements Company is recognized by leading industry analysts as having proven expertise for current product Has existing government, education, and non-profit customer experience Is a manufacturer of the product The CIS CyberMarket team reserves the right to choose products and vendors based on customer need, ability to improve national cyber posture, and cost-savings.Want to learn more about our exclusive benefits? If you are curious about the unique advantages we offer, reach out to us today to discover how you can join our network as a CyberMarket partner. Contact Us Questions? Still have questions or need more information? You can contact us directly. Get in TouchInformation HubWhite Paper02.13.2025CIS Year in Review 2024Read MoreWhite Paper02.07.2025CIS Controls v8.1 Mapping to MCSB v1Read MoreMedia Mention02.06.20252025 Homeland Security Threat Forecast: Multidimensional- Physical, Cyber, Information Operations- ThreatsRead MoreMedia Mention02.06.20252025 Homeland Security Threat Forecast Parts II and IIIRead More"
