["https://cisecurity.org/advisory/multiple-vulnerabilities-in-fortinet-products-could-allow-for-remote-code-execution_2025-017"]
title = "Multiple Vulnerabilities in Fortinet Products Could Allow for Remote Code Execution"
description = "<p>Multiple vulnerabilities have been discovered Fortinet Products, the most severe of which could allow for remote code execution. </p><p> </p><ul><li>FortiManager is a network and security management tool that provides centralized management of Fortinet devices from a single console. </li><li>FortiOS is the Fortinet’s proprietary Operation System which is utilized across multiple product lines. </li><li>FortiProxy is a secure web gateway that attempts to protects users against internet-borne attacks, and provides protection and visibility to the network against unauthorized access and threats. </li><li>FortiAnalyzer is a log management, analytics, and reporting platform that provides organizations with a single console to manage, automate, orchestrate, and respond, enabling simplified security operations, proactive identification and remediation of risks, and complete visibility of the entire attack landscape.</li><li>FortiSandbox 5.0 is a security solution that utilizes a combination of AI/ML, static, and dynamic analysis, inline blocking, and scalable virtual environments to identify, analyze, contextualize, prioritize, and protect against advanced threats in real-time.</li><li>FortiAnalyzer Big Data delivers big data network analytics for large and complex networks.</li><li>FortiSwitch Manager enables network administrators to cut through the complexities of non-FortiGate-managed FortiSwitch deployments.</li><li>FortiPAM provides privileged account management, session monitoring and management, and role-based access control to secure access to sensitive assets and mitigate data breaches.</li></ul><p> </p><p>Successful exploitation of this vulnerability could allow for remote code execution in the context of the affected service account. Depending on the privileges associated with the service account an attacker could then install programs; view, change, or delete data; or create new accounts with full user rights. Service accounts that are configured to have fewer user rights on the system could be less impacted than those who operate with administrative user rights.</p>"
full_description = "HomeCIS AdvisoriesMultiple Vulnerabilities in Fortinet Products Could Allow for Remote Code ExecutionMultiple Vulnerabilities in Fortinet Products Could Allow for Remote Code ExecutionMS-ISAC ADVISORY NUMBER:2025-017DATE(S) ISSUED:02/11/2025OVERVIEW:Multiple vulnerabilities have been discovered Fortinet Products, the most severe of which could allow for remote code execution. FortiManager is a network and security management tool that provides centralized management of Fortinet devices from a single console. FortiOS is the Fortinet’s proprietary Operation System which is utilized across multiple product lines. FortiProxy is a secure web gateway that attempts to protects users against internet-borne attacks, and provides protection and visibility to the network against unauthorized access and threats. FortiAnalyzer is a log management, analytics, and reporting platform that provides organizations with a single console to manage, automate, orchestrate, and respond, enabling simplified security operations, proactive identification and remediation of risks, and complete visibility of the entire attack landscape.FortiSandbox 5.0 is a security solution that utilizes a combination of AI/ML, static, and dynamic analysis, inline blocking, and scalable virtual environments to identify, analyze, contextualize, prioritize, and protect against advanced threats in real-time.FortiAnalyzer Big Data delivers big data network analytics for large and complex networks.FortiSwitch Manager enables network administrators to cut through the complexities of non-FortiGate-managed FortiSwitch deployments.FortiPAM provides privileged account management, session monitoring and management, and role-based access control to secure access to sensitive assets and mitigate data breaches. Successful exploitation of this vulnerability could allow for remote code execution in the context of the affected service account. Depending on the privileges associated with the service account an attacker could then install programs; view, change, or delete data; or create new accounts with full user rights. Service accounts that are configured to have fewer user rights on the system could be less impacted than those who operate with administrative user rights.THREAT INTELLIGENCE:Fortinet is aware that CVE-2024-55591 has been exploited in the wild.February 12 – UPDATED THREAT INTELLIGENCEFortinet is aware that CVE-2024-55591 was exploited in the wild in January 2025, but is no longer being exploited.SYSTEMS AFFECTED:FortiManager 7.6.0 through 7.6.1FortiManager 7.4.0 through 7.4.5FortiManager 7.2.0 through 7.2.9FortiManager 7.0 all versionsFortiManager 6.4 all versionsFortiManager Cloud 7.4.1 through 7.4.5FortiManager Cloud 7.2.1 through 7.2.8FortiManager Cloud 7.0 all versionsFortiManager Cloud 6.4 all versionsFortiManager 6.2 all versionsFortiManager 6.2.2 through 6.2.13FortiAnalyzer 7.4.0 through 7.4.4FortiAnalyzer 7.2.0 through 7.2.7FortiAnalyzer 7.0 all versionsFortiAnalyzer 6.4 all versionsFortiAnalyzer 6.2.0 through 6.2.11FortiSandbox 4.4.0 through 4.4.4FortiSandbox 4.2.0 through 4.2.6FortiSandbox 4.0.0 through 4.0.4FortiSandbox 3.2 all versionsFortiSandbox 3.1 all versionsFortiSandbox 3.0 all versionsFortiManager Cloud 7.4.1 through 7.4.3FortiManager Cloud 7.2.1 through 7.2.5FortiManager Cloud 7.0 all versionsFortiManager Cloud 6.4 all versionsFortiAnalyzer Cloud 7.4.1 through 7.4.3FortiAnalyzer Cloud 7.2.1 through 7.2.5FortiAnalyzer Cloud 7.0 all versionsFortiAnalyzer Cloud 6.4 all versionsFortiAnalyzer-BigData 7.4.0FortiAnalyzer-BigData 7.2.0 through 7.2.7FortiAnalyzer-BigData 7.0 all versionsFortiAnalyzer-BigData 6.4 all versionsFortiAnalyzer-BigData 6.2 all versionsFortiOS 7.6.0FortiOS version 7.4.0 through 7.4.4FortiOS version 7.2.0 through 7.2.9FortiOS version 7.0.0 through 7.0.16FortiOS 6.4 all versionsFortiOS 6.2 all versionsFortiSwitchManager version 7.2.0 through 7.2.2FortiSwitchManager version 7.0.0 through 7.0.2FortiProxy version 7.4.0FortiProxy version 7.2.0 through 7.2.12FortiProxy version 7.0.0 through 7.0.19FortiProxy 2.0 all versionsFortiProxy 1.2 all versionsFortiPAM version 1.1.0 through 1.1.2FortiPAM 1.0 all versionsRISK:Government:Large and medium government entitiesHIGHSmall governmentMEDIUMBusinesses:Large and medium business entitiesHIGHSmall business entitiesMEDIUMHome Users:LOWTECHNICAL SUMMARY:Multiple vulnerabilities have been discovered in Fortinet products, the most severe of which could allow for remote code execution. Details of the vulnerabilities are as follows: Tactic: Initial Access (TA0001):Technique: Exploit Public-Facing Application (T1190): An Authentication Bypass Using an Alternate Path or Channel vulnerability [CWE-288] affecting FortiOS and FortiProxy may allow a remote attacker to gain super-admin privileges via crafted requests to Node. (CVE-2025-24472, CVE-2024-55591)A stack-based buffer overflow [CWE-121] vulnerability in FortiOS CAPWAP control may allow a remote unauthenticated attacker to execute arbitrary code or commands via crafted UDP packets, provided the attacker were able to evade FortiOS stack protections and provided the fabric service is running on the exposed interface. (CVE-2024-35279) Details of lower severity vulnerabilities: An Exposure of Sensitive Information to an Unauthorized Actor [CWE-200] in the Log View component of FortiAnalyzer may allow a local authenticated user with admin privileges to view logs of devices not belonging to the current ADOM (CVE-2024-52966)A use of externally-controlled format string vulnerability [CWE-134] in FortiOS, FortiProxy, FortiPAM & FortiSwitchManager CLI may allow a privileged attacker to execute arbitrary code or commands via specially crafted requests. (CVE-2023-40721)An insertion of sensitive information into log file vulnerabilities [CWE-532] in FortiAnalyzer and FortiManager eventlog may allow any low privileged user with access to event log section to retrieve certificate private key and encrypted password logged as system log. (CVE-2024-40585)Multiple Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting') vulnerabilities [CWE-79] in FortiSandbox may allow an authenticated attacker to perform cross-site scripting attack via crafted HTTP requests. (CVE-2024-27781)An improper limitation of a pathname to a restricted directory ('Path Traversal') vulnerability [CWE-22] in FortiManager and FortiAnalyzer CLI may allow any authenticated admin user with diagnose privileges to delete any file on the system. (CVE-2024-36508)An improper neutralization of special elements used in an OS command ('OS Command Injection') vulnerability [CWE-78] in FortiAnalyzer, FortiManager, FortiAnalyzer BigData, FortiAnalyzer Cloud and FortiManager Cloud GUI may allow an authenticated privileged attacker to execute unauthorized code or commands via crafted HTTPS or HTTP requests. (CVE-2024-40584)A use of hard-coded cryptographic key to encrypt sensitive data vulnerability [CWE-321] in FortiManager may allow an attacker with JSON API access permissions to decrypt some secrets even if the 'private-data-encryption' setting is enabled. (CVE-2024-33504)An incorrect privilege assignment vulnerability [CWE-266] in the FortiOS security fabric may allow an authenticated admin whose access profile has the Security Fabric permission to escalate their privileges to super-admin by connecting the targetted FortiGate to a malicious upstream FortiGate they control. (CVE-2024-40591) Successful exploitation of these vulnerabilities could allow an attacker to execute remote code in the context of the system. Depending on the privileges associated with the system, an attacker could then install programs; view, change, or delete data.RECOMMENDATIONS:We recommend the following actions be taken: Apply appropriate updates provided by Fortinet to vulnerable systems immediately after appropriate testing. (M1051: Update Software) Safeguard 7.1 : Establish and Maintain a Vulnerability Management Process: Establish and maintain a documented vulnerability management process for enterprise assets. Review and update documentation annually, or when significant enterprise changes occur that could impact this Safeguard.Safeguard 7.2: Establish and Maintain a Remediation Process: Establish and maintain a risk-based remediation strategy documented in a remediation process, with monthly, or more frequent, reviews.Safeguard 7.4: Perform Automated Application Patch Management: Perform application updates on enterprise assets through automated patch management on a monthly, or more frequent, basis.Safeguard 7.5 : Perform Automated Vulnerability Scans of Internal Enterprise Assets: Perform automated vulnerability scans of internal enterprise assets on a quarterly, or more frequent, basis. Conduct both authenticated and unauthenticated scans, using a SCAP-compliant vulnerability scanning tool.Safeguard 7.7: Remediate Detected Vulnerabilities: Remediate detected vulnerabilities in software through processes and tooling on a monthly, or more frequent, basis, based on the remediation process.Safeguard 12.1: Ensure Network Infrastructure is Up-to-Date: Ensure network infrastructure is kept up-to-date. Example implementations include running the latest stable release of software and/or using currently supported network-as-a-service (NaaS) offerings. Review software versions monthly, or more frequently, to verify software support.Safeguard 18.1: Establish and Maintain a Penetration Testing Program: Establish and maintain a penetration testing program appropriate to the size, complexity, and maturity of the enterprise. Penetration testing program characteristics include scope, such as network, web application, Application Programming Interface (API), hosted services, and physical premise controls; frequency; limitations, such as acceptable hours, and excluded attack types; point of contact information; remediation, such as how findings will be routed internally; and retrospective requirements.Safeguard 18.2: Perform Periodic External Penetration Tests: Perform periodic external penetration tests based on program requirements, no less than annually. External penetration testing must include enterprise and environmental reconnaissance to detect exploitable information. Penetration testing requires specialized skills and experience and must be conducted through a qualified party. The testing may be clear box or opaque box.Safeguard 18.3: Remediate Penetration Test Findings: Remediate penetration test findings based on the enterprise’s policy for remediation scope and prioritization. Apply the Principle of Least Privilege to all systems and services. Run all software as a non-privileged user (one without administrative privileges) to diminish the effects of a successful attack. (M1026: Privileged Account Management) Safeguard 4.7: Manage Default Accounts on Enterprise Assets and Software: Manage default accounts on enterprise assets and software, such as root, administrator, and other pre-configured vendor accounts. Example implementations can include: disabling default accounts or making them unusable.Safeguard 5.5: Establish and Maintain an Inventory of Service Accounts: Establish and maintain an inventory of service accounts. The inventory, at a minimum, must contain department owner, review date, and purpose. Perform service account reviews to validate that all active accounts are authorized, on a recurring schedule at a minimum quarterly, or more frequently. Vulnerability scanning is used to find potentially exploitable software vulnerabilities to remediate them. (M1016: Vulnerability Scanning)Safeguard 16.13: Conduct Application Penetration Testing: Conduct application penetration testing. For critical applications, authenticated penetration testing is better suited to finding business logic vulnerabilities than code scanning and automated security testing. Penetration testing relies on the skill of the tester to manually manipulate an application as an authenticated and unauthenticated user. Architect sections of the network to isolate critical systems, functions, or resources. Use physical and logical segmentation to prevent access to potentially sensitive systems and information. Use a DMZ to contain any internet-facing services that should not be exposed from the internal network. Configure separate virtual private cloud (VPC) instances to isolate critical cloud systems. (M1030: Network Segmentation)Safeguard 12.2: Establish and Maintain a Secure Network Architecture: Establish and maintain a secure network architecture. A secure network architecture must address segmentation, least privilege, and availability, at a minimum. Use capabilities to detect and block conditions that may lead to or be indicative of a software exploit occurring. (M1050: Exploit Protection) Safeguard 10.5: Enable Anti-Exploitation Features: Enable anti-exploitation features on enterprise assets and software, where possible, such as Microsoft® Data Execution Prevention (DEP), Windows® Defender Exploit Guard (WDEG), or Apple® System Integrity Protection (SIP) and Gatekeeper™.REFERENCES:CVEhttps://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2023-40721https://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2024-27781https://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2024-33504https://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2024-35279https://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2024-36508https://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2024-40584https://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2024-40585https://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2024-40591https://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2024-52966https://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2024-55591https://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2025-24472Fortinethttps://www.fortiguard.com/psirt/FG-IR-24-063https://www.fortiguard.com/psirt/FG-IR-24-094https://www.fortiguard.com/psirt/FG-IR-24-147https://www.fortiguard.com/p