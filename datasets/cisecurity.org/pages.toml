["https://cisecurity.org/privacy-notice"]
title = "CIS Website Privacy Notice"
description = "Current version published date: 4/1/2023 Website Privacy Notice. CIS knows that you care how information about you is used and shared, and we appreciate your trust that we will do so carefully and sensibly. This notice describes our website privacy notice, including what data we collect, how we use it and for what purpose."
full_description = "HomeCIS Website Privacy NoticeCIS Website Privacy NoticePrivacy Notice Introduction Your privacy is important to CIS. CIS knows that you care how information about you is used and shared, and we appreciate your trust that we will do so carefully and sensibly. This Privacy Notice describes our privacy practices, including what data we collect, how we use data and for what purpose. Given the importance we place on privacy, it is important that you read this notice carefully. The Privacy Notice may be updated at the discretion of CIS periodically and without prior notice to you to reflect changes in our information practices or relevant laws. In the event of material changes to the Privacy Notice, CIS shall provide appropriate notification to applicable parties through various mechanisms such as but not limited to email or pop-up notifications on the website. To view previous versions, visit the Privacy Notice version history. Any question or comments with respect to the Privacy Notice should be directed to [email protected] . The CIS website (www.cisecurity.org) is intended to make it easy and efficient to learn about ad interact with CIS and its various program areas such as CIS Controls™, CIS Benchmarks®, CIS CyberMarket, and MS-ISAC®. The mission of CIS is to improve and enhance cybersecurity, so we are sensitive to privacy issues on the Internet and recognize that visitors to this website and those who use our products and services are concerned about the type of information we collect and how we use it. CIS is committed to preserving your privacy and this Privacy Notice outlines our practices. For definitions of key terms used in this Privacy Notice, click here. CIS Website Privacy Notice Current version v7.0 published date: 09/29/2023 Privacy Notice version history. Table of Contents Information we collect How to access and control your personal data Data transfer Reasons we share your personal data Cookies Web beacons and analytics services Security of your information Data storage and retention Purposes of collection and use Children’s privacy Other websites Links to CIS website Terminology Who can I contact with questions or concerns Information we collect CIS hosts and processes “Customer Data,” including “Personal Data” therein at the direction of and pursuant to the instructions of our “Customers.” CIS serves as a Data Processor for the following products and services: SecureSuite membership including CIS Workbench, CSAT, and CIS-CAT CIS serves as a Data Controller for the following products and services: MS/EI-ISAC memberships, monitoring of SLTT systems and SLTT partner paid services. Downloadable content from the CIS Website: CIS Benchmarks, CIS Controls, Cybermarket, and White papers/downloadable guides/best practices. “Information” is defined as: (1) personal information, which is information that can be identified to a particular individual because of a name, number, symbol, mark or other indicator; and (2) non-personal information that does not identify a particular individual. CIS receives and stores certain types of information whenever you interact with us. Any personal information you provide is voluntarily gathered by initiating an online transaction, such as a survey, registration or order form, or establishing a login for access and use of certain tools or SecureSuite member areas of our website. Back to top How to access and control your personal data You can control the personal data that is collected with opt-in choices on the CIS services website. Not all personal data can be controlled in this manner; you can exercise your data protection rights by contacting [email protected]. In some cases, your access or control over personal data may be limited as required or permitted by applicable law. Depending upon the services that you use, the method of control will vary. For example: CIS downloads can be controlled with the opt-in section of the page, thus controlling the interest-based advertising from CIS. CIS Workbench controls are made either through the portal to modify your personal data or via a request to [email protected] for removal. A request for removal of information gathered via the CIS website can be made via a request to [email protected]. If you do voluntarily provide personal information, your email address and the entire contents of your email message and other information you provide are retained. If you do not wish to have identifying information disclosed, we honor all requests to omit individual or organization names from website listings. If such a request is made, identifying information will not be disclosed by CIS unless we are legally required to do so. CIS collects general information about the “Customer,” including the customer company name and address, credit card information, and the “Customer” representative’s contact information for billing and contracting purposes. As a service provider, we aim to provide you the necessary access to update the personal information that is within our records. If that information is incorrect, we give you ways to update it quickly. If you request to delete the data that is present within our systems, we will do so with a validated request, unless we have to keep that information for legitimate business or legal purposes. The maintenance of service is required to protect all information from accidental or malicious destruction. If your request to delete is completed, we may not immediately delete this data from residual copies and we may not remove it from archived or backed up systems. All requests shall be processed within thirty (30) business days, when feasible and appropriate. Back to top Data transfer CIS has its headquarters in the United States. Information we collect about you will be processed in the United States. By using CIS services and products, you acknowledge that your personal information will be processed in the United States. The United States has not sought nor received a finding of “adequacy” from the European Union under Article 45 of the GDPR. Depending on the circumstance, CIS also collects and transfers to the U.S. personal data with consent or to perform a contract with you. CIS endeavors to apply suitable safeguards to protect the privacy and security of your personal data and to use it only consistent with your relationship with CIS and the practices described in this Privacy Notice. CIS also enters into data processing agreements and model clauses with its vendors and/or service providers whenever feasible and appropriate. Back to top Reasons we share your personal data CIS may be required to disclose personal information in response to lawful requests by public authorities, including disclosures to meet national security or law enforcement requirements. At your request, where you have affirmatively provided consent to CIS to share your personal information with a third party in order for CIS or the third party to provide services to you. Back to top Cookies Cookies are text files stored by your web browser in order to record information about you or your activities on a website. Using cookies for this purpose is a common, generally accepted practice on the Internet. We may use temporary cookies to enhance, customize, or enable your visit to this website. Temporary cookies do not contain personal information that can be used to identify you, do not compromise your privacy or security, and are erased when you close your browser. Certain features on this website may require you to fill in a registration form used to personalize your user experience. Such features may store a persistent cookie on your computer's hard drive that is not deleted when you close your browser. A persistent cookie allows us to recognize you on your next visit and tailor your user experience to your needs and interests. If the program you use to access this site is set to refuse new cookies or delete existing cookies, your ability to use some of the features on this website may be limited. Types of cookies used by CIS Category What do they do? Necessary These cookies are essential to make the CIS website functional and work. The enablement of these cookies is to enable specific feature, without which the user experience would be null. Analytics/Performance Cookies are used to determine performance; we use these cookies to understand and improve our products and services. Targeting/Marketing CIS uses these cookies to show you relevant advertising and targeted ads. We may also use them to learn about ad utilization and the action taken with a specific marketing cookie, e.g., to visit and download a Benchmark, join a webcast or download a whitepaper. Similarly, partnersmay use the same process to determine ad performance, and the use of ads both on and off the CIS website. Preferences/ Functional These cookies define your preferred setting and communication preferences. In order to utilize the functionality and provide the required information CIS needs to process and manage products and services, some cookies are deemed Necessary. These are required to maintain the functionality of the CIS products and services offered. If your preference is to not accept these cookies, your actions and access to specific products and services will be severely limited and in some cases restricted. Please refer to the specific cookies used by CIS page. Unclassified cookies are cookies that we are in the process of classifying, together with the providers of individual cookies. Managing Cookies in Your Browser, Opt Out Options for Cookies Depending on personal preference, you may want to limit or delete cookies. This preference can be implemented within your web browsers and gives you the ability to manage cookies to suit your requirements. Depending on the browser, it may limit or delete cookies, so you may want to review your cookie settings and advertisement or marketing settings. In some browsers, you can set up rules to manage cookies on a site-by-site basis, giving you more fine-grained control over your opt-out needs. This means that you can disallow cookies from all sites based on your privacy preference. Back to top Web beacons and analytics services CIS websites and emails may contain an electronic image known as a web beacon (or single-pixel gifs). We use these to help deliver cookies on our websites, analyze promotional email messages, count users who have visited our websites, deliver CIS content and to determine whether users open emails and act on them. The actions and data that CIS captures includes: When an email is opened When a link is clicked Date/time email was delivered, opened, clicked Time spent viewing email (in seconds) Email client (Gmail, Outlook, Apple Mail iOS, etc.) Browser (Chrome, IE, Firefox, etc.) Information obtained by Google Analytics This website uses the Google Analytics web analysis service and enters into an agreement with Google as the data processor. Google Analytics stores a persistent cookie on your hard drive. The information in this cookie (including your IP address) is transmitted to Google and stored on Google servers. Google uses this information to anonymously analyze your use of the website, compile reports on your website activity for site operators, and provide other services related to your website activity and Internet usage. Google may transfer this information to third parties where required to do so by law or where those third parties process the information on Google's behalf. Google will not associate your IP address with any other data held by Google. By using this website, you consent to Google's processing of data about you. For a review of Google Privacy Policy please see https://policies.google.com/privacy. Information obtained by Sitecore This website uses a cookie to track anonymous contacts - specifically the SC_ANALYTICS_GLOBAL_COOKIE cookie. When an anonymous visitor goes to www.cisecurity.org – a device GUID is generated and saved. If the visitor returns to www.cisecurity.org the tracker has enough information to identify the contact as an existing anonymous contact and a new interaction is saved on session end. If the visitor returns to www.cisecurity.org and returns to the website on the same device, after clearing their cookies a new device GUID is generated and saved. CIS uses this information for the following purposes: Personalization of content based on behavior during the current session. Historic personalization of content-based behavior during previous sessions. Reacting to activities such as goals triggered during the current interaction. Cookies capture this information and securely transmit and store such information on Sitecore servers. The use of such cookies can be disabled in your web browser, as set forth in the section entitled, “Managing Cookies in Your Browser, Opt Out Options for Cookies.” By using this website, you consent to Sitecore’s processing of data about you. For a review of the Sitecore Privacy Policy, please see https://www.sitecore.com/trust/privacy-policy. Back to top Security of your information To help protect the privacy of data and personally identifiable information you transmit through use of this Site, we maintain physical, technical and administrative safeguards. We update and test our security technology on an ongoing basis. We restrict access to your personal data to those employees who need to know that information to provide benefits or services to you. In addition, we train our employees about the importance of confidentiality and maintaining the privacy and security of your information. CIS employs procedural and technological security measures that are reasonably designed to help protect your personal information from loss, unauthorized access, disclosure, alteration, or destruction. CIS uses password protection, encryption, and other security measures to help prevent unauthorized access to your personal information. However, no security measure can guarantee against compromise. You also have an important role in protecting personal information. You should not share your usernames/email addresses and passwords with anyone, and you should not re-use passwords across more than one web site. Back to top Data storage and retention Your personal data is stored by CIS on its servers, and on the servers of the cloud-based database management services CIS engages, located in the United States. CIS retains data for the duration of the customer’s or member’s business relationship with CIS and for a period of time thereafter to allow customersto recover accounts if they decide to renew, to analyze the data for CIS’s own operations, and for historical and archiving purposes. For more information on where and how long your personal data is stored, and for more information on your rights of erasure and portability, please contact [email protected]. Back to top Purposes of collection and use In order to use CIS services and products, CIS"
year_published = 2025
