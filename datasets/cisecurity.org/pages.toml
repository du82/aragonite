["https://cisecurity.org/insights/white-papers/cis-year-in-review-2024"]
title = "CIS Year in Review 2024"
description = "CIS continued its important role as a global thought leader in security in 2024. Learn more by downloading our full Year in Review 2024 today."
full_description = "HomeInsightsWhite PapersCIS Center for Internet SecurityCIS Year in Review 2024 The Center for Internet Security® (CIS®) continued its important role as a global thought leader in security in 2024. As an example, we published two seminal reports. One documents the evolving internet-based threat environment and the increasing linkages between cyber, physical, and information operations threats, while the other provides organizations a measurable basis for determining whether their actions to protect their systems and data can be judged as reasonable. We also continued to play a pivotal role in supporting the cybersecurity posture of the U.S. State, Local, Tribal, and Territorial (SLTT) community in 2024, which included helping the nation as a whole to address increased threats during the 2024 General Election. Finally, we built an effective intelligence clearinghouse with law enforcement agencies across the country that became the basis for informing the election and law enforcement communities. We did all this and more while working with our employees, always at the heart of everything we do, to continue to advance the winning culture we have built on the CIS Leadership Principles. Read our CIS Year in Review 2024 to get the full story. DownloadDownload"
