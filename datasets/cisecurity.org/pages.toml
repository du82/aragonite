description = "CIS is a forward-thinking nonprofit that harnesses the power of a global IT community to safeguard public and private organizations against cyber threats."
full_description = "Creating Confidence in the Connected World™At CIS®, we’re harnessing the power of the global IT community to safeguard public and private organizations against cyber threats. Join us.FEATURED[Webinar] CIS SecureSuite MembershipImprove your cybersecurity with CIS Controls and CIS Benchmarks tools and resources. Join us Feb. 25 to learn more! RegisterOur IndustriesCybersecurity threats and solutions by industryView Industry ListFrom The Blog 02.05.2025CIS Benchmarks February 2025 UpdateRead MoreWorld-Renowned Best Practices and Expert CommunitiesProtect your organization from cyber-attacks with globally recognized CIS Controls®, companion guides, and mappings.Download & ExploreSafeguard IT systems against cyber threats with more than 100 configuration guidelines across more than 25 vendor product families.Download LatestSecure your organization with resources and tools designed to harness the power of CIS Benchmarks and CIS Controls.Learn MoreAccess resources for threat prevention, protection, response, and recovery for U.S. State, Local, Tribal, and Territorial (SLTT) government entities.Learn MoreWhat The Experts Are SayingThe CIS Controls® take the background and knowledge of cybersecurity experts literally around the world and help focus efforts on things that are of most value. Directly impacting the adversaries and challenges we face today on our networks.Harley ParkesDirector, ACD (Integrated Adaptive Cyber Defense)Without this resource, the hardening of our devices would have taken a lot longer and required many meetings between IT and Security to debate which configuration settings to change and the impact they could have. The CIS Benchmarks™ provided the necessary information to alleviate many of the fears IT may have had with changing specific settings.AdamBanking Information Security EngineerWe work with sensitive information on a daily basis. The CIS Controls® along with CIS-CAT® Pro, a proven and indispensable tool, helps us to evaluate and maintain a security baseline for our IT infrastructure.Sasawat MalaivongsBusiness Director, ACinfotecTogether, We Can Make a DifferenceOur CIS Controls and CIS Benchmarks communities connect IT security practitioners from around the globe to help secure our ever-changing world. Our Ambassadors champion the CIS best practices, making it easier for enterprises everywhere to strengthen their cyber defenses and streamline their compliance efforts. We hope you’ll add your voice.Learn More Our Commitment CIS operates as a mission driven, nonprofit organization dedicated to making the connected world a safer place. Our employees adhere to our Code of Ethics, Leadership Principles, and Code of Conduct, consistent with our collaborative, nonpartisan, vendor-agnostic operating model. These values guide our decisions and actions and build trust in our capabilities, enabling us to achieve our mission. About Us"
