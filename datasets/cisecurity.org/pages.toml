full_description = "HomeCybersecurity ServicesMalicious Domain Blocking and Reporting PlusMalicious Domain Blocking and Reporting Plus Malicious Domain Blocking and Reporting Plus (MDBR+) is a quick-to-configure and easy-to-deploy cloud-based protective domain name system (PDNS) service available to U.S. State, Local, Tribal, and Territorial (SLTT) government organizations and private hospitals. MDBR+ is offered by the Center for Internet Security (CIS) in partnership with industry leader Akamai. GET STARTED OverviewMDBR vs. MDBR+Pricing Protects from harmful or malicious domains: Leverages a list of known or suspected bad domains to prevent your organization's computers from connecting to potential sources of malware, ransomware, phishing, and other cyber threats. Provides real-time reporting: Provides a dashboard for with real-time reporting that includes log information for all blocked requests, enabling you to quickly identify and mitigate emerging threats. Customizable for your needs: Delivers capability to build and enforce organization-specific acceptable use policies (AUPs), allow/deny lists, customizable error pages, and more. Enables off-network device protection: Offers off-network protection for your organization’s devices through easy-to-deploy lightweight agent. In addition to these key benefits, MDBR+ also offers a number of other features, such as: Scalability: Can scale to meet the needs of organizations of all sizes. Reliability: Always on, providing your organization with around-the-clock protection, 24x7x365. Time-saving: Helps your security team save time by reducing false-positive security alerts and administering security policies and updates from anywhere in seconds. Overview Protects from harmful or malicious domains: Leverages a list of known or suspected bad domains to prevent your organization's computers from connecting to potential sources of malware, ransomware, phishing, and other cyber threats. Provides real-time reporting: Provides 