title = "Election Security Tools & Resources"
description = "Elections Security Tools & Resources CIS and the Elections Infrastructure Information Sharing and Analysis Center (EI-ISAC) provide many resources to support the cybersecurity needs of the election community. The resources below include guidance on security best practices developed by a global community of cybersecurity experts, that are tailored for the unique nature of election security."
full_description = "HomeElection Security Tools & ResourcesElection Security Tools & ResourcesThe Center for Internet Security (CIS) and the Elections Infrastructure Information Sharing and Analysis Center® (EI-ISAC®) provide many resources to support the cybersecurity needs of the election community. Heard a rumor about CIS's support to election offices? Learn and share important facts about CIS and our cybersecurity efforts and help stop inaccurate information from spreading. Rumor ControlSecuring Non-Voting SystemsElection Security GuidanceFostering CommunityCIS supports election offices by providing cybersecurity services to secure non-voting systems and data. These cybersecurity services operate only on the day-to-day administrative networks and systems of election offices and in no way interact with the technology used to collect and count votes. Cybersecurity and Elections Election offices use a significant amount of technology that has nothing to do with the actual casting or counting of ballots. Election officials depend on cybersecurity services to protect these non-voting systems. Learn about how this all works together in this resource. Read More​Albert Network Monitoring and Management Albert Network Monitoring is a network security solution provided to election offices to help secure non-voting technology, the computers and servers related to day-to-day administrative functions of the election office. Click for sound @keyframes VOLUME_SMALL_WAVE_FLASH { 0% { opacity: 0; } 33% { opacity: 1; } 66% { opacity: 1; } 100% { opacity: 0; } } @keyframes VOLUME_LARGE_WAVE_FLASH { 0% { opacity: 0; } 33% { opacity: 1; } 66% { opacity: 1; } 100% { opacity: 0; } } .volume__small-wave { animation: VOLUME_SMALL_WAVE_FLASH 2s infinite; opacity: 0; } .volume__large-wave { animation: VOLUME_LARGE_WAVE_FLASH 2s infinite .3s; opacity: 0; } 1:53 1:17 @media (prefers-reduced-motion: no-preference) { @keyframes w-control-bar-fade-in { 0% { opacity: 0; transform: translateX(50