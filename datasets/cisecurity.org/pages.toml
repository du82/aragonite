title = "EI-ISAC"
description = "The EI-ISAC™ is open to U.S. SLTT government organizations that support the elections officials of the United States, and associations thereof."
full_description = "HomeEI-ISACElections Infrastructure Information Sharing & Analysis Center®The EI-ISAC® is a community of dedicated election officials and cybersecurity professionals working side-by-side to ensure the integrity of elections among U.S. State, Local, Tribal, and Territorial (SLTT) governments.Join the EI-ISACEI-ISAC OverviewMembership BenefitsMember Resources Who we serve We are a trusted cybersecurity partner for election offices and associations, providing EI-ISAC membership to these organizations at no cost. Election vendors who support an EI-ISAC member may also be eligible to join as a supporting member. What we offer The EI-ISAC works closely with election officials and security and technology personnel to provide the highest standards of election security, including incident response and remediation through our team of cyber experts. Our 24x7x365 Security Operations Center (SOC) monitors, analyzes, and responds to cyber incidents targeting election offices and government entities. We develop and share best practices for securing election infrastructure, incorporating security into election technology procurements, and helping manage election supply chain risks. How we do business We cultivate a collaborative environment in which members and the EI-ISAC can securely exchange information and security best practices. We strengthen cybersecurity awareness among our members to build resilience and defenses as election-specific and other threats continue to evolve. We offer no-cost tools, trainings, and other services to bolster security defenses. We provide quick and effective remediation and response when incidents arise to ensure as little impact on election operations as possible. We strive for excellence in our efforts to develop industry-leading, cost-effective cybersecurity resources for election-related entities. Not a member yet? Joining is easy, the EI-ISAC Membership is available at no cost and is open to all U.S. SLTT election offices. Join the EI-ISAC What is an ISAC Membership FAQs What is an ISAC Membership FAQs Members list EI-ISAC Overview Who we serve We are a trusted cybersecurity partner for election offices and associations, providing EI-ISAC membership to these organizations at no cost. Election vendors who support an EI-ISAC member may also be eligible to join as a supporting member. What we offer The EI-ISAC works closely with election officials and security and technology personnel to provide the highest standards of election security, including incident response and remediation through our team of cyber experts. Our 24x7x365 Security Operations Center (SOC) monitors, analyzes, and responds to cyber incidents targeting election offices and government entities. We develop and share best practices for securing election infrastructure, incorporating security into election technology procurements, and helping manage election supply chain risks. How we do business We cultivate a collaborative environment in which members and the EI-ISAC can securely exchange information and security best practices. We strengthen cybersecurity awareness among our members to build resilience and defenses as election-specific and other threats continue to evolve. We offer no-cost tools, trainings, and other services to bolster security defenses. We provide quick and effective remediation and response when incidents arise to ensure as little impact on election operations as possible. We strive for excellence in our efforts to develop industry-leading, cost-effective cybersecurity resources for election-related entities. Not a member yet? Joining is easy, the EI-ISAC Membership is available at no cost and is open to all U.S. SLTT election offices. Join the EI-ISAC What is an ISAC Membership FAQs What is an ISAC Membership FAQs Members list Membership Benefits 24x7x365 Security Operations Center (SOC) offering threat intelligence, detection, and response assistance Election-specific threat reports Discounted and no-cost cybersecurity tools and resources Access to an annual self-assessment survey to evaluate cybersecurity maturity See all membership benefits No-Cost Layered Defense for Election Security Device-level protection and response Endpoint Detection and Response (EDR) strengthens your organization’s cybersecurity program by blocking malicious activity and stopping an attack in its tracks at the endpoint level. Active Defense Against Malicious Domains Malicious Domain Blocking and Reporting (MDBR) prevents IT systems from connecting to harmful web domains, helping limit infections related to known malware, ransomware, phishing, and other cyber threats From our membersLearn how organizations and IT experts are harnessing the power of the CIS EI-ISAC Membership to start secure and stay secure.Watch Testimonial VideoThe EI-ISAC has made a complex topic much easier to navigate. Resources such as Cybersecurity Advisories, Cyber Alerts, Election Security Spotlights, and quarterly meetings improve election security at the state and local level by relaying information in plain language. It is imperative that election officials – from the biggest states and counties down to the smallest jurisdictions – sign up for EI-ISAC resources.” EI-ISAC MemberNot a member yet? Joining is easy, the EI-ISAC Membership is available at no cost and is open to all U.S. SLTT election offices. Join the EI-ISAC What is an ISAC Membership FAQs What is an ISAC Membership FAQs Members list Member ResourcesAre you ready for your next election? Election offices are responsible for taking the right steps to protect critical election infrastructure against cyber threats. Learn about the world-class security tools and services from the EI-ISAC that can help you address your toughest security challenges. Learn More Ensuring Security in Election Technology Procurements The Center for Internet Security® (CIS®) developed this guide benefiting from input and feedback from state and local government, federal government, academic, and commercial stakeholders. Learn More Latest Cybersecurity SpotlightElection Security Spotlight — What Is an ISAC? Published 01.28.2025Read ArticleView All SpotlightsEssential Guide to Election SecurityThis guide was written with election officials in mind to provide guidance on the most recent threats and technologies impacting the elections community.Read the GuideCyber AlertActionable and timely alerts about cybersecurity vulnerabilities that may affect elections agencies.Learn MoreContact us for more informationEI-ISAC Mission and CharterThe mission of the EI-ISAC is to improve the overall cybersecurity posture of SLTT election offices.Read MoreNot a member yet? Joining is easy, the EI-ISAC Membership is available at no cost and is open to all U.S. SLTT election offices. Join the EI-ISAC What is an ISAC Membership FAQs What is an ISAC Membership FAQs Members list Incident Response and Advisories The EI-ISAC community is committed to keeping members informed of – and protected against – threats to democracy through election-specific threat intelligence and no-cost cybersecurity solutions. Our 24x7x365 Security Operations Center (SOC) is staffed by experts experienced in threat analysis, digital forensics, and incident response to assist your team. Additionally, we provide members with key support and best practices for securing their election-related systems. Report an incident Incident Response ChecklistLearn how to identify, respond to, and communicate information about a breach.Download ChecklistEI-ISAC SubscriptionsFor election-specific information contact [email protected] Sign up to receive cybersecurity newsletters and advisories.SUBSCRIBE NOW FOR FREELatest UpdateCIS and the EI-ISAC offer practical guidance to manage cyber threats Log4j Zero-Day Vulnerability ResponseSee all important Updates CIS is home to the EI-ISAC The EI-ISAC is federally funded by CISA and a division of the Center for Internet Security (CIS). The EI-ISAC is autonomously guided by the Executive Committee and member organizations. MS-ISAC The mission of the Multi-State Information Sharing and Analysis Center® (MS-ISAC®) is to improve the overall cybersecurity posture of SLTT government organizations through coordination, collaboration, cooperation, and increased communication. Every U.S. election office that joins EI-ISAC automatically becomes a member of MS-ISAC. Learn more about MS-ISAC View full list of MS-ISAC Services Already a member? Learn more about next steps and services Explore EI-ISAC Services See Election Security Tools and Resources Report a Cybersecurity Incident U.S. election offices can report an incident 24x7x365. Report an Incident We value your questions and feedback At CIS, we are committed to serving the greater IT security community. Contact Us TodayInformation HubEI-ISACWhite Paper02.13.2025CIS Year in Review 2024Read MoreAdvisory02.12.2025Multiple Vulnerabilities in Google Chrome Could Allow for Arbitrary Code ExecutionRead MoreAdvisory02.12.2025Multiple Vulnerabilities in Fortinet Products Could Allow for Remote Code ExecutionRead MoreSpotlight01.28.2025Election Security Spotlight — What Is an ISAC?Read More"
