full_description = '<img src="https://www.citizen.org/wp-content/uploads/insurance-938958-e1557159894355.jpg" alt=""> Share Facebook Twitter Email Life Insurance Donations Share Facebook Twitter Email .box1-header {margin-bottom: 0px !important;}.wrap1 {padding-bottom: 30px !important;} blockquote cite {font-size: 18px !important;} Legacy Gifts to Public Citizen You can name Public Citizen as a beneficiary of your IRA, 401(k), or other qualified plan and designate Public Citizen to receive all or a portion of the balance of your plan through your plan administrator. The balance in your plan passes to Public Citizen after your death. In order to name Public Citizen Inc. or Public Citizen Foundation the beneficiary of a Life Insurance Policy or Retirement Plan, you will need to contact your plan administrator to obtain a change of beneficiary form and complete it with the following information. Public Citizen Foundation 1600 20th Street, NW Washington, DC 20009 Federal tax identification number: 52-1263996 Public Citizen Inc. 1600 20th Street, NW Washington, DC 20009 Federal tax identification number: 23-7104508 .box1-header {margin-bottom: 0px !important;}.wrap1 {padding-bottom: 30px !important;} blockquote cite {font-size: 18px !important;} #subnav_image_grid *{box-sizing: border-box;}#subnav_image_grid {margin-bottom: 0px;}#subnav_image_grid .button2 {font-size: 20px;width: 100%; text-align: center;}.card1-image:before{background: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,0)) !important;}#subnav_image_grid{width:90%; max-width: 1300px; margin: 2em auto; overflow:hidden; padding:0;}#subnav_image_grid .tape1 br{display: none;}#subnav_image_grid .card_container{width:20%; max-width: 20%; float:left; padding:0;margin-bottom: 0px;}.card1-image{max-height: 340px;}.subnav_image_grid_mobile{display: none;}@media only screen and (max-width:1000px){#subnav_image_grid .card_container{width:33.3%;}}@media only screen and (max-width:800px){#subnav_image_grid{display: none;}#sub