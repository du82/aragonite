full_description = "Comments on the FDA’s Draft Guidance for Industry Entitled “Opioid Analgesic Drugs: Considerations for Benefit-Risk Assessment Framework” August 20, 2019 Viewpoint Article Published in JAMA Internal Medicine: The Public Health Urgency of a Temporary FDA Moratorium on New Opioid Approvals September 3, 2019 Letter to Congress Offering Health Care-Related Reforms for Possible Inclusion in Future Cures 2.0 Legislation December 16, 2019 Share Facebook Twitter Email May 21, 2024 Report: Thirty-One Years of Pharmaceutical Industry Criminal and Civil Penalties: 1991-2021 Share Facebook Twitter Email View report View press release The report summarizes 31-years (1991-2021) of successful legal settlements or judgments won by U.S. federal or state governments against pharmaceutical manufacturers. The report is the fifth such study by Public Citizen’s Health Research Group since 2010. The 65-page document details (with graphs, tables and text) the number and monetary size of essentially all cases that U.S. governments settled against pharmaceutical makers and stratifies those cases into analytic categories including: state vs. federal, criminal vs. civil and various violation types (e.g., overcharging government programs, unlawful promotion). In total over $62 billion in financial penalties assessed against the pharmaceutical industry are described. In recent years opioid-related settlements have been especially prominent. Topics Safe & Affordable Drugs & Devices: Drugs, Opioid Addiction Crisis You might be interested in Comments on the FDA’s Draft Guidance for Industry Entitled “Opioid Analgesic Drugs: Considerations for Benefit-Risk Assessment Framework” August 20, 2019 Viewpoint Article Published in JAMA Internal Medicine: The Public Health Urgency of a Temporary FDA Moratorium on New Opioid Approvals September 3, 2019 Tramadol November 6, 2019 Letter to Congress Offering Health Care-Related Reforms for Possible Inclusion in Future Cures 2.0 Legislation D