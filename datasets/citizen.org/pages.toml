["https://www.citizen.org/about/careers"]
title = "Careers - Public Citizen"
description = "Join us at Public Citizen, and help us represent the public interest in the halls of power. We champion good…"
full_description = '<img src="https://www.citizen.org/wp-content/uploads/careers-page-graphic-1-pdf.jpg" alt=""> Share Facebook Twitter Email Careers Join us and help make a difference. Share Facebook Twitter Email Join us at Public Citizen, and help us represent the public interest in the halls of power. We champion good government, a strong regulatory system, a clean and sustainable environment, affordable and safe health care, citizen access to the courts, corporate accountability in the trade arena, and more. We know that to perform at our best, you need to be at your best. Here at Public Citizen, we offer a competitive benefits package. Below is a sample of some of our benefits (please note that some benefits have eligibility and requirements, such as years of employment): • Vacation • Sick leave • Holidays and personal days • Paid parental leave • Employer-paid medical and dental • Long-term disability • Flexible workplace/time • Flexible spending accounts for dependent care, transportation, and health • Cellphone reimbursement • Sabbaticals • 401(K) retirement plan (employer contribution 5%) • Student loan reimbursement program Public Citizen is an Equal Opportunity Employer and promotes a smoke-free and green environment. We do not discriminate on the basis of race, color, religion, national origin, sex, gender identity or expression, sexual orientation, age, marital status, personal appearance, or disability. Women, people of color, and LBGTQ+ candidates are encouraged to apply. Public Citizen is a 501(c)(3) and (c)(4) non-profit organization. Public Citizen employees who work for the 501 (c)(4) are not eligible to participate in the Federal Public Service Loan Forgiveness (PSLF) Program. Open Positions function resizeResumatorIframe(height,nojump){if(nojump== 0){window.scrollTo(0,0);}document.getElementById("resumator-job-frame").height = parseInt(height)+20;} Internships Public Citizen is at the forefront of fighting corporate power and defending our democracy. We organize, lobby, litigate, conduct research, and communicate with the press and public in a variety of ways. We offer both paid and unpaid internships for people who are passionate about our issues and who want to learn and contribute in a fun and rewarding environment. Our interns work with Public Citizen staff including researchers, organizers, program directors, campaign directors, press officers, lobbyists, fundraisers and more. Summer interns will have the opportunity to participate in luncheons with senior staff, networking events, and other activities. To learn more about internship opportunities please click here. Stay Updated on Public Citizen Follow Public Citizen Facebook Facebook Facebook Facebook Facebook Facebook Support Our Work Donate Donate Donate Join/Renew Giving Through Your Will Gift of Stocks or Mutual Funds Tax-Deductible Giving Charitable Gift Annuities Gifts From Your Retirement Account Life Insurance Donations'
