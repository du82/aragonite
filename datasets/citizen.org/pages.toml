["https://www.citizen.org/news/climate-polluters-to-receive-handout-from-oil-allies-in-congress"]
title = "Climate Polluters Set To Receive Handout from Oil Allies in Congress as Senate May Vote to Roll Back Vital Climate Protections - Public Citizen"
description = "It’s a testament to the influence of Big Oil that one of the top priorities of Congress is a blatant handout to the worst actors in the fossil fuel industry."
full_description = "Top D.C. Prosecutor Resigns After Pressure to Investigate Greenhouse Gas Reduction Fund Grants February 19, 2025 Zeldin Seeks to Dismiss Scientific Consensus On Public Health Harm of Greenhouse Gas Emissions By Eliminating the EPA’s Endangerment Finding February 26, 2025 Mr. Trump’s Unsafe Neighborhood: 33 Ways Trump’s Cruel Policies Are Bad for America’s Kids November 28, 2018 Share Facebook Twitter Email February 27, 2025 Climate Polluters Set To Receive Handout from Oil Allies in Congress as Senate May Vote to Roll Back Vital Climate Protections Repeal of methane waste emissions charge would curtail vital tool to hold drillers and frackers accountable for polluting air Share Facebook Twitter Email WASHINGTON—The U.S. Senate could soon vote to repeal the EPA’s Waste Emissions Charge final rule, also known as the methane fee. The rule, required by the 2022 Inflation Reduction Act, directed the EPA to collect a charge on waste methane emissions from fossil fuel facilities in an effort to reduce methane vented into the air. The U.S. House of Representatives on Wednesday voted to use the Congressional Review Act to repeal the rule. In response, Tyson Slocum, director of Public Citizen’s Energy Program, issued the following statement: “It’s a sorry testament to the influence of Big Oil on Capitol Hill that one of the top priorities of Congress is a blatant handout to the worst actors in the fossil fuel industry. Congress is showing its hypocrisy by claiming to seek to rein in government spending, while voting to repeal a revenue-raising fee that only applies to wasteful oil and gas companies. The methane fee was paired with a $1.5 billion government spending program to help oil and gas companies reduce harmful emissions. Voting to repeal the fee while allowing profitable corporations to pocket hundreds of millions of taxpayer dollars is an affront to the millions of working Americans disrupted by indiscriminate DOGE cost-cutting. “It should not be too much to ask fossil fuel producers to do the bare minimum to capture leaking methane. Any child knows that when you make a mess, you should clean it up. The fee was intended to be a key part of enforcing standards on an industry that has repeatedly cut corners in its endless drive to extract more fossil fuels.” # # # Topics Climate & Energy: Fighting Climate Change, Promoting Clean & Affordable Energy, Protecting Health & the Environment Cover Climate Taking on Trump Relevant News Billionaire Burgum Is Wrong Choice For Interior Department January 16, 2025 Top D.C. Prosecutor Resigns After Pressure to Investigate Greenhouse Gas Reduction Fund Grants February 19, 2025 Zeldin Seeks to Dismiss Scientific Consensus On Public Health Harm of Greenhouse Gas Emissions By Eliminating the EPA’s Endangerment Finding February 26, 2025 Mr. Trump’s Unsafe Neighborhood: 33 Ways Trump’s Cruel Policies Are Bad for America’s Kids November 28, 2018 Stay Updated on Public Citizen Follow Public Citizen Facebook Facebook Facebook Facebook Facebook Facebook Support Our Work Donate Donate Donate Join/Renew Giving Through Your Will Gift of Stocks or Mutual Funds Tax-Deductible Giving Charitable Gift Annuities Gifts From Your Retirement Account Life Insurance Donations"
