title = "Ensuring Public Money Does Not Go To Private Equity - Public Citizen"
full_description = 'Caught in the Crosshairs of Corporate Power: How Americans are Harmed When They Lack a Voice in Washington March 5, 2019 Share Facebook Twitter Email September 15, 2021 Ensuring Public Money Does Not Go To Private Equity Report: "Public Money for Private Equity"-- At Least $5.3 Billion in Pandemic Relief Went to Companies Backed by Private Equity Titans By Americans for Financial Reform Education Fund, Anti-Corruption Data Collective and Public Citizen Download the full report 3.4 MB Share Facebook Twitter Email Jump to section Key Findings Executive Summary Key Findings After extensive lobbying by the private equity industry in 2020, federal pandemic relief legislation imposed few conditions on recipients and failed to prohibit them from using public money to enrich investors. With improved balance sheets shored up by government money, private equity firms were able to finance a buyout spree during the pandemic-driven economic downturn as well as to extract dividends and fees from their portfolio companies. The private equity industry captured funds that should have supported small, independent businesses, especially those owned by women and people of color. $5.3 billion in CARES Act loans or grants went to 611 portfolio companies owned or backed by 113 private equity firms that each had more than $5 billion in assets. 143 private equity-backed healthcare companies received $3.9 billion but continued many practices that undermine patient health and finances. Private equity-backed companies secured $1.2 billion in pandemic relief that was intended for small businesses. Of that, $224 million went to private equity-backed fast-food and other restaurant chains that prospered during the pandemic while thousands of independent restaurants closed forever. The largest private equity firms held $908 billion in cash reserves and were well positioned to thrive without public support. 18 large private equity firms and the industry’s primary trade association spent $32 million on lobbying during 2020, including on pandemic related issues. Some private equity-backed companies that received public support shed workers during the pandemic. The 10 private equity firms whose portfolio companies received the most public support executed 230 leveraged buyouts during the height of the pandemic, with a disclosed value of more than $45.1 billion. At least five private equity firms extracted dividends from companies that received pandemic relief. Four publicly traded private equity firms disclosed a combined $5.4 billion in management fees in 2020 even as their portfolio companies received $1.8 billion in public aid. Several private equity firms got more in pandemic aid to their portfolio companies than they pay in taxes. Executive Summary This study estimates that at least $5.3 billion in CARES Act money went to 611 portfolio companies owned or backed by private equity firms that held $908 billion in cash reserves. Hundreds of companies owned or backed by some of the largest, best financed private equity firms secured an estimated $5.3 billion in public funding under the Coronavirus Aid, Relief, and Economic Security (CARES) Act. Federal pandemic relief efforts provided trillions of dollars in response to the twin public health and economic crisis. Yet the legislation imposed few conditions on recipients — such as requirements to support workers and maintain business operations — and failed to prohibit recipients from using public money to enrich investors. This lack of binding statutory requirements has enabled the private equity industry to continue its typical extractive and predatory practices. Private equity firms take over companies as investment vehicles, and then use aggressive tactics and financial engineering that often undermine the portfolio companies’ financial viability. They frequently extract substantial value from their takeover targets through debt-financed leveraged buyouts, excessive fees, dividends, and stripping out valuable assets such as real estate. Workers, consumers, and patients pay the price for the aggressive cost-cutting strategies that private equity firms use to siphon revenues from the companies they own. Public money for private equity-backed companies not only went to companies that already had deep-pocketed backers, but also effectively allowed private equity owners to continue and even expand their predatory tactics during an economic and public health emergency. With improved balance sheets shored up by government money, private equity firms were able to finance a buyout spree during the pandemic-driven economic downturn as well as to extract dividends and fees from their portfolio companies. The private equity industry captured funds that should have supported small, independent businesses, especially those owned by women and people of color. Private equity firms could have tapped their own cash reserves (known as dry powder) to help their portfolio companies, which would have left more public resources available to help other struggling companies, especially smaller businesses owned by women and people of color. This study estimates that at least $5.3 billion in CARES Act loans or grants went to 611 portfolio companies owned or backed by 113 private equity firms that collectively held $908 billion in cash reserves. It is a conservative estimate, because this analysis looked only at private equity firms with more than $5 billion in assets under management and because the opacity of the private equity industry makes it impossible to make a comprehensive list of private equity-backed companies that may have received pandemic relief. Private equity firms buy and sell assets — including entire companies or single facilities — constantly and it is not possible to have a perfect list of portfolio firms based on publicly available information at any one point in time. Our calculations rely on information on specific recipients of CARES Act funding through December 2020 from the Project on Government Oversight (POGO), which graciously shared the data collected through its COVID-19 Relief Spending Tracker. (The data sources and analytical approach are fully described in the Methodology appendix.) Nearly all of the funding for private equity-backed companies came through the CARES Act programs operated by the Department of Health and Human Services ($3.7 billion or 69 percent), the Small Business Administration ($1.2 billion or 23 percent), or the airline payroll protection program ($341 million or 6 percent). Even within the private equity industry, a small number of large investors dominated access to CARES Act funds. Over $4 billion (76 percent of the total pandemic relief to the industry) went to portfolio companies owned by just 10 private equity firms. Leading the way, companies backed by the private equity firm Apollo Global Management (Apollo) received $1.4 billion. The portfolios of Cerberus Capital Management (Cerberus) received $883 million and Welsh, Carson, Anderson & Stowe received $436 million. In total, these top ten private equity firms reported $245 billion in dry powder cash reserves during 2020 that could have shored up their own portfolio companies, meaning they did not need to take public funding. This report identifies some of the more troubling and problematic practices which were essentially tolerated or facilitated with public support. Key findings include: This report first describes the main findings on the volume of pandemic relief money going to private equity backed portfolio companies, with detailed explanations of assistance given to healthcare companies and small businesses. A short history of the private equity industry on the eve of the pandemic then lays out the strong financial position that many private equity firms were in prior to receiving public money. The report then outlines five predatory practices that the private equity industry uses to enrich investors, all of which continued after CARES Act money was distributed to their portfolio companies. The report concludes with a list of recommendations to strengthen the guardrails on accessing public money from future relief efforts. Read the full report here. Topics Consumer & Worker Safeguards Health Care Making Government Work: Corporate Influence in Government Protecting Democracy: Money in Politics You might be interested in A Key Cog in Charles Koch’s Master Plan June 3, 2019 Caught in the Crosshairs of Corporate Power: How Americans are Harmed When They Lack a Voice in Washington March 5, 2019 33 Groups Urge Biden to Reject Big Tech Appointments to His Cabinet November 30, 2020 Complaints Against Facebook May 18, 2021 Stay Updated on Public Citizen Follow Public Citizen Facebook Facebook Facebook Facebook Facebook Facebook Support Our Work Donate Donate Donate Join/Renew Giving Through Your Will Gift of Stocks or Mutual Funds Tax-Deductible Giving Charitable Gift Annuities Gifts From Your Retirement Account Life Insurance Donations'
