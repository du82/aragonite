full_description = "Petition for Rulemaking to Clarify that the Law Against ‘Fraudulent Misrepresentation’ Applies to Deceptive AI Campaign Ads May 16, 2023 The Two Major Parties Should Reject A.I.-Generated Deepfakes in the Presidential Campaign May 16, 2023 Presidents Biden and Trump Should Reject A.I.-Generated Deepfakes in the Presidential Campaign May 16, 2023 Share Facebook Twitter Email September 21, 2023 Generative Artificial Intelligence and Threats to Democracy Share Facebook Twitter Email Download Weissman's Slides Download Skibinski's Slides Public Citizen, Issue One, and a bipartisan group of congressional leaders and election officials gathered on Sept. 21, to discuss the threats posed by generative artificial intelligence (A.I.) to our democracy. From deceptive AI-generated content in election ads to threats to election administration, A.I. is already having a vast impact – and the potential harms are only going to increase. Public Citizen is already urging the Federal Election Commission to create a rule banning this deceptive AI-generated content and has called on both major parties and their presidential candidates to pledge not to use generative AI to mislead and defraud the electorate. Similarly, Issue One’s bipartisan National Council on Election Integrity has called on Congress to address the threat of generative A.I. and prioritize election security. Topics Consumer & Worker Safeguards: Artificial Intelligence, Big Tech Accountability Protecting Democracy: Securing Our Elections & Democracy You might be interested in Petition for Rulemaking to Clarify that the Law Against ‘Fraudulent Misrepresentation’ Applies to Deceptive AI Campaign Ads May 16, 2023 The Two Major Parties Should Reject A.I.-Generated Deepfakes in the Presidential Campaign May 16, 2023 Presidents Biden and Trump Should Reject A.I.-Generated Deepfakes in the Presidential Campaign May 16, 2023 U.S. Government Should Reject Deepfakes in Foreign Affairs May 18, 2023 Stay Updated o