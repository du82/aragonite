title = "Administration’s Non-Compliance with Court Order Causes Irreparable Global Harm - Public Citizen"
description = "WASHINGTON, D.C. —Tonight, the administration filed an emergency motion in the U.S. Supreme Court asking the court to excuse its…"
full_description = "Doctors for America Sues Over Removal of Health Information From HHS, CDC, FDA Websites February 4, 2025 Arbitration Rule Rollback Is a Giveaway to Corporate Nursing Homes, Puts Seniors at Greater Risk July 16, 2019 Share Facebook Twitter Email February 26, 2025 Administration’s Non-Compliance with Court Order Causes Irreparable Global Harm Share Facebook Twitter Email WASHINGTON, D.C. —Tonight, the administration filed an emergency motion in the U.S. Supreme Court asking the court to excuse its non-compliance with the Feb. 13 order and three subsequent district court orders, all of which required that the funding freeze and stop-work orders be lifted, at least on a temporary basis. In response to the filing in the Supreme Court, Lauren Bateman, a Public Citizen attorney and lead counsel on the case, stated: “While the administration refuses to comply with the district court’s order, the irreparable harm to our clients increases each day, as does the suffering of millions of people across the world who depend on the work performed with these grants.” Allison Zieve, director of Public Citizen Litigation Group, added: “The lengths to which the government is going to flout a court order, all for the goal of ending life-saving humanitarian assistance, is staggering.” Additional background: On Jan. 20, 2025, President Trump issued an executive order directing agencies to freeze almost all foreign assistance, including to U.S.-led programs that support democracy and that provide critical food and medical aid to the poorest people in the world. Secretary of State Rubio followed up by ordering a halt on payments to those programs directing them to stop work. On behalf of two non-profit organizations who receive foreign assistance funding to support their work combating HIV/AIDS and supporting anti-corruption journalism — AIDS Vaccine Advocacy Coalition and Journalism Development Network — Public Citizen Litigation Group filed suit. Two days later, on February 13, the district court issued a temporary restraining order directing the administration to restart funding and to allow organizations impacted by the freeze to resume their life-saving work while the lawsuit proceeded. Topics Consumer & Worker Safeguards Health Care Justice & the Courts Making Government Work Protecting Democracy Safe & Affordable Drugs & Devices: Global Access to Medicines Taking on Trump Relevant News New Rule Protects Civil Servants, Keeps Federal Workforce Independent April 4, 2024 Doctors for America Sues Over Removal of Health Information From HHS, CDC, FDA Websites February 4, 2025 Motion for Civil Contempt Filed in Foreign Aid Freeze Lawsuit February 19, 2025 Arbitration Rule Rollback Is a Giveaway to Corporate Nursing Homes, Puts Seniors at Greater Risk July 16, 2019 Stay Updated on Public Citizen Follow Public Citizen Facebook Facebook Facebook Facebook Facebook Facebook Support Our Work Donate Donate Donate Join/Renew Giving Through Your Will Gift of Stocks or Mutual Funds Tax-Deductible Giving Charitable Gift Annuities Gifts From Your Retirement Account Life Insurance Donations"
