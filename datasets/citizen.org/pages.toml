full_description = '<img src="https://www.citizen.org/wp-content/uploads/helloquence-61189-unsplash-e1556199904212.jpg" alt=""> Share Facebook Twitter Email Charitable Gift Annuities Share Facebook Twitter Email Establish a Charitable Gift Annuity If you would like to make a gift to the Public Citizen Foundation, and receive guaranteed income for life, you may be interested in establishing a charitable gift annuity. The minimum gift required to open an annuity is $10,000 and you must be 65 years or older. Sample Interest Rates (Based on a $10,000 gift) Age Single Life Rate Single Life Annual Payment Two Lives Rate Two Lives Annual Payment 65 5.7% $570 5.0% $500 70 6.3% $630 5.5% $550 75 7.0% $700 6.2% $620 80 8.1% $810 6.9% $690 85 9.1% $910 8.1% $810 90 10.1+% $1,010 9.8+% $980 For a confidential sample annuity illustration, please contact Genevieve Chase at 202-588-7712 or gchase@citizen.org. .box1-header {margin-bottom: 0px !important;}.wrap1 {padding-bottom: 30px !important;} blockquote cite {font-size: 18px !important;} #subnav_image_grid *{box-sizing: border-box;}#subnav_image_grid {margin-bottom: 0px;}#subnav_image_grid .button2 {font-size: 20px;width: 100%; text-align: center;}.card1-image:before{background: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,0)) !important;}#subnav_image_grid{width:90%; max-width: 1300px; margin: 2em auto; overflow:hidden; padding:0;}#subnav_image_grid .tape1 br{display: none;}#subnav_image_grid .card_container{width:20%; max-width: 20%; float:left; padding:0;margin-bottom: 0px;}.card1-image{max-height: 340px;}.subnav_image_grid_mobile{display: none;}@media only screen and (max-width:1000px){#subnav_image_grid .card_container{width:33.3%;}}@media only screen and (max-width:800px){#subnav_image_grid{display: none;}#subnav_image_grid_mobile{display: block;}#subnav_image_grid .card_container{width:50%;}} <img src="/wp-content/uploads/luis-quintero-1209369-unsplash-2000-1-e1556726047987.jpg" alt=""> Legacy Create a Legacy with One Sentence <img src="/wp-content/uploads/helloquence-61189-unsplash-1-e1556201062182.jpg" alt=""> Annuities Charitable Gift Annuities <img src="/wp-content/uploads/bright-chart-data-210607-1-e1556216984688.jpg" alt=""> Stocks Gifts of Appreciated Securities <img src="/wp-content/uploads/fancycrave-239747-unsplash-1-e1556139797863.jpg" alt=""> Retirement Beneficiaries of your Retirement Plan <img src="/wp-content/uploads/desk-document-hand-938958.jpg" alt=""> Insurance Donate from your Retirement Account Legacy Create a Legacy with One Sentence Annuities Charitable Gift Annuities Stocks Gifts of Appreciated Securities Retirement Beneficiaries of your Retirement Plan Insurance Donate from your Retirement Account #subnav_image_grid .button2 span { padding-top:1rem; padding-bottom:1rem; } #subnav_image_grid .img1 img { object-position: var(--x, 50%) var(--y, 0%) !important; } Purchasing charitable gift annuities is one of the best decisions we have ever made. We get an excellent guaranteed rate of return for life (partially tax free) and an immediate tax deduction. Not only do we help sustain Public Citizen for decades to come, we appropriately diversity our investment portfolio and fulfill our charitable intent. It is a win in so many ways that it is practically a no-brainer. Robert Spiegelman, Member, Concord, New Hampshire Stay Updated on Public Citizen Follow Public Citizen Facebook Facebook Facebook Facebook Facebook Facebook Support Our Work Donate Donate Donate Join/Renew Giving Through Your Will Gift of Stocks or Mutual Funds Tax-Deductible Giving Charitable Gift Annuities Gifts From Your Retirement Account Life Insurance Donations'
