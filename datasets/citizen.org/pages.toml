full_description = '<img src="https://www.citizen.org/wp-content/uploads/fancycrave-239747-unsplash-e1556139746115.jpg" alt=""> Share Facebook Twitter Email Gifts From Your Retirement Account Share Facebook Twitter Email .box1-header {margin-bottom: 0px !important;}.wrap1 {padding-bottom: 30px !important;} blockquote cite {font-size: 18px !important;} Qualified Charitable Distributions Public Citizen Foundation is a 501(c)(3) nonprofit and can receive Qualified Charitable Distribution Gifts rolled over from your retirement account. If you over the age of 70 and a half, you can give up to $100,000 from your Traditional or Roth IRA and each dollar will count toward your required minimum IRA distribution. Giving from your retirement account reduces your required minimum distribution and your taxable income so that you save on taxes even if you don’t itemize. You can instruct your IRA custodian to send a specific dollar amount directly to the Public Citizen Foundation. Please also ask them to list your name and address in their communication to us so that we can issue you the appropriate letter for your taxes. Public Citizen Foundation Attention: Qualified Charitable Contribution 1600 20th Street, NW Washington, DC 20009 Federal tax identification number: 52-1263996 .box1-header {margin-bottom: 0px !important;}.wrap1 {padding-bottom: 30px !important;} blockquote cite {font-size: 18px !important;} #subnav_image_grid *{box-sizing: border-box;}#subnav_image_grid {margin-bottom: 0px;}#subnav_image_grid .button2 {font-size: 20px;width: 100%; text-align: center;}.card1-image:before{background: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,0)) !important;}#subnav_image_grid{width:90%; max-width: 1300px; margin: 2em auto; overflow:hidden; padding:0;}#subnav_image_grid .tape1 br{display: none;}#subnav_image_grid .card_container{width:20%; max-width: 20%; float:left; padding:0;margin-bottom: 0px;}.card1-image{max-height: 340px;}.subnav_image_grid_mobile{display: none;}@media only scr