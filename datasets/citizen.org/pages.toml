["https://www.citizen.org/giving-through-your-will"]
title = "Giving Through Your Will - Public Citizen"
description = "Legacy Gifts to Public Citizen   Public Citizen is a nonprofit consumer advocacy organization that champions the public interest –…"
full_description = '<img src="https://www.citizen.org/wp-content/uploads/luis-quintero-1209369-unsplash-2000-e1556745881433-1.jpg" alt=""> Share Facebook Twitter Email Giving Through Your Will Share Facebook Twitter Email .box1-header {margin-bottom: 0px !important;}.wrap1 {padding-bottom: 30px !important;} blockquote cite {font-size: 18px !important;} Legacy Gifts to Public Citizen Public Citizen is a nonprofit consumer advocacy organization that champions the public interest – your interests – in the halls of power. You can make a plan to amplify your impact for justice and democracy by including Public Citizen in your Will or Trust. As a supporter, you can choose which entity to support. The Public Citizen Foundation 501(c)(3) focuses on research, public education, and litigation in support of our mission. Contributions to Public Citizen Foundation are tax-deductible. The Public Citizen Inc. 501(c)(4) lobbies Congress and federal agencies to advance Public Citizen’s mission. Contributions to Public Citizen, Inc. are not tax-deductible. Recommended Language Public Citizen Foundation, a 501(c)(3) organization “I hereby give and bequeath _____($_____, or_____percent of the rest, remainder and residue of my estate, or the proceeds from the sale of real estate by my estate that I own located at_____) to Public Citizen Foundation, a nonprofit District of Columbia corporation exempt from Federal taxation under Section 501(c)(3) of the Internal Revenue Code, located at 1600 20th Street, NW, Washington, DC 20009, Federal tax ID #52-1263996.” Public Citizen Inc., a 501(c)(4) organization “I hereby give and bequeath _____($_____, or_____percent of the rest, remainder and residue of my estate, or the proceeds from the sale of real estate by my estate that I own located at_____) to Public Citizen Inc., a nonprofit District of Columbia corporation exempt from Federal taxation under Section 501(c)(4) of the Internal Revenue Code, located at 1600 20th Street, NW, Washington, DC 20009, Federal tax ID #23-7104508.” One easy way to get started. We’ve partnered with FreeWill to give our supporters the opportunity to write a legally valid will, for free. Take 20 minutes to protect the things you love and create a lasting legacy that supports Public Citizen and defends democracy for generations to come. Get started on your free will here. .box1-header {margin-bottom: 0px !important;}.wrap1 {padding-bottom: 30px !important;} blockquote cite {font-size: 18px !important;} #subnav_image_grid *{box-sizing: border-box;}#subnav_image_grid {margin-bottom: 0px;}#subnav_image_grid .button2 {font-size: 20px;width: 100%; text-align: center;}.card1-image:before{background: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,0)) !important;}#subnav_image_grid{width:90%; max-width: 1300px; margin: 2em auto; overflow:hidden; padding:0;}#subnav_image_grid .tape1 br{display: none;}#subnav_image_grid .card_container{width:20%; max-width: 20%; float:left; padding:0;margin-bottom: 0px;}.card1-image{max-height: 340px;}.subnav_image_grid_mobile{display: none;}@media only screen and (max-width:1000px){#subnav_image_grid .card_container{width:33.3%;}}@media only screen and (max-width:800px){#subnav_image_grid{display: none;}#subnav_image_grid_mobile{display: block;}#subnav_image_grid .card_container{width:50%;}} <img src="/wp-content/uploads/luis-quintero-1209369-unsplash-2000-1-e1556726047987.jpg" alt=""> Legacy Create a Legacy with One Sentence <img src="/wp-content/uploads/helloquence-61189-unsplash-1-e1556201062182.jpg" alt=""> Annuities Charitable Gift Annuities <img src="/wp-content/uploads/bright-chart-data-210607-1-e1556216984688.jpg" alt=""> Stocks Gifts of Appreciated Securities <img src="/wp-content/uploads/fancycrave-239747-unsplash-1-e1556139797863.jpg" alt=""> Retirement Beneficiaries of your Retirement Plan <img src="/wp-content/uploads/desk-document-hand-938958.jpg" alt=""> Insurance Donate from your Retirement Account Legacy Create a Legacy with One Sentence Annu