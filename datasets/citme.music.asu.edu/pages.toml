["http://citme.music.asu.edu/soundexplorations3/about-sound-explorations"]
title = "About Sound Explorations - Consortium for Innovation and Transformation in Music Education (CITME)"
description = "About Sound Explorations Sound Explorations: Creating, Expressing, and Improving Communities was a Playlists for Learning grant project awarded by the Digital Media and Learning Competition 6 to develop connected learning playlists.  Our project, Sound Explorations: Creating, Expressing, and Improving Communities, connected pre-service and in-service music educators, teaching artists, community youth organizations, and youth to create a […]"
full_description = "About Sound Explorations Sound Explorations: Creating, Expressing, and Improving Communities was a Playlists for Learning grant project awarded by the Digital Media and Learning Competition 6 to develop connected learning playlists. Our project, Sound Explorations: Creating, Expressing, and Improving Communities, connected pre-service and in-service music educators, teaching artists, community youth organizations, and youth to create a set of six interconnected learning playlists with multiple learning pathways around the following themes: Building instruments and interfaces Coding and programming music Connecting music and culture Jamming: Solo and Groups Making beats Producing music Learning experiences emphasize creativity and self-expression while fostering musical inquiry, deepening musical skills and understandings, and strengthening participants’ sense of selves as musical people who make a difference in their communities and society. The Consortium for Innovation and Transformation in Music Education worked with a number of partners including NYU’s MusEdLab, Today’s Future Sound, AZ Beat Lab and other partners and consultants to develop connected learning playlists that merge: Robust foundations of pedagogy and curriculum supporting musicianship and musical inquiry developed in K-12 music programs Diverse interest-based aspects of after school programs Support for personal and social growth in community youth programs Get Involved We are continuing our work on creating music learning playlists and have many opportunities for additional collaboration and partnerships. Contact Dr. Evan Tobias with any questions or to find out how you might be a part of this initiative. Play Test Parts of the Music Learning Playlists! We are currently going through another round of play testing the music learning playlists so we can further develop them to address people’s needs and suggestions. Consider testing the music learning playlists in your own setting or providing us with your own feedback by filling out the form below: Loading&#8230; Contribute to the Design and Development of Music Learning Playlists! If you would like to play a role helping us design and develop music learning playlists, fill out the following form: Loading&#8230; Sound Explorations Latest News Discussion of music education and connected learning with EdTechTalk CITME director, Evan Tobias recently joined Paul Allison and Christina Cantrill from the National Writing Project on EdTechTalk’s Teachers Teaching Teachers to discuss issues around music education, connected learning, and the Sound Explorations project for the 6th Digital Media and Learning Competition. Paul and Allison are fellow grant awardees for the NWP’s Sandboxes for Learning […] Posted in connected learning | Tagged Sound Explorations | Leave a comment Arizona State Music Education Initiative to Develop Music Connected Learning Playlists Posted in connected learning, contemporary musicianship | Tagged Sound Explorations | Leave a comment Sound Explorations: Developing Connected Music Learning Playlists The Sound Explorations project, led by the Consortium for Innovation and Transformation in Music Education at Arizona State University, is in the process of developing six connected music learning playlists organized around the following themes: Building instruments and interfaces: Coding and programming music Connecting music and culture Jamming: Solo and Groups Making beats Producing original […] Posted in connected learning | Tagged Sound Explorations | Leave a comment View All Sound Explorations News"
