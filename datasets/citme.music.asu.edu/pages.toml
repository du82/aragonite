description = "Congratulations to ASU Music Education Alumn, Abbie Van Klompenberg (MM ’11) on being awarded the “Growing in SC: The Future of STEAM is Here” Grant from South Carolina’s Coalition for Mathematics & Science/STEM Centers SC. The Future of STEAM is Here grant provides $2,500 worth of classroom materials and $1,500 in professional development. Abbie’s fourth […]"
full_description = "Congratulations to ASU Music Education Alumn, Abbie Van Klompenberg (MM ’11) on being awarded the “Growing in SC: The Future of STEAM is Here” Grant from South Carolina’s Coalition for Mathematics & Science/STEM Centers SC. The Future of STEAM is Here grant provides $2,500 worth of classroom materials and $1,500 in professional development. Abbie’s fourth and fifth-grade students will learn about sound engineering and work with professional music producer mentors. Abbie is not only a graduate of the ASU Music Education program but a long-time CITME partner with experience supporting students’ music learning and engagement with technology. Learn more about one of our prior collaborations addressing digital and participatory cultures in Abbie’s music program. This entry was posted in music science and society. Bookmark the permalink."
