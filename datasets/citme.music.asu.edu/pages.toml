["http://citme.music.asu.edu/2016/05/10/connected-learning-at-the-center"]
title = "Connected Learning at The Center - Consortium for Innovation and Transformation in Music Education (CITME)"
description = "During Fall 2016 CITME will partner with the ASU Music Education Department, ASU School of Community Resources and Development, and Phoenix Center for the Arts to launch a number of music programs ranging from coached chamber groups to digital music creation labs.Under the leadership of Dr. Roger Mantie, HIDA at the Center will support creative […]"
full_description = "During Fall 2016 CITME will partner with the ASU Music Education Department, ASU School of Community Resources and Development, and Phoenix Center for the Arts to launch a number of music programs ranging from coached chamber groups to digital music creation labs.Photo by sergio rossiUnder the leadership of Dr. Roger Mantie, HIDA at the Center will support creative musical engagement, music teaching and learning, community engagement, and leisure to impact downtown Phoenix positively. This initiative is supported by a Herberger Institute for Design and the Arts Research Council grant.CITME will help connect learning across school and community contexts and link pre-service music educators with the program through community leadership, service learning, and socially engaged practice initiatives. We look forward to launching this program this coming Fall! This entry was posted in connected learning. Bookmark the permalink."
