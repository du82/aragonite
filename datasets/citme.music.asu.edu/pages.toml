title = "Transforming Society - Consortium for Innovation and Transformation in Music Education (CITME)"
description = "We research and advance the role of musical engagement and learning to build and improve communities and impact society positively. Sustainability The Weight of Light: Reasoning and Imagining with Present and Possible Energy Systems This current research project explores the possibilities of young people combining arts, futures thinking, and engineering to create and imagine possible […]"
full_description = "We research and advance the role of musical engagement and learning to build and improve communities and impact society positively. Sustainability The Weight of Light: Reasoning and Imagining with Present and Possible Energy Systems This current research project explores the possibilities of young people combining arts, futures thinking, and engineering to create and imagine possible solar futures. Sustainability and Music Resources Solarpunk Resources Socially Engaged Practice and Inclusion In partnership with the ASU Music Learning and Teaching and Music Therapy Departments, CITME works with current music students, alumni, local music educators, music therapists, and community musicians to facilitate participatory musical experiences that build and contribute to communities. A key aspect of this work is ensuring that all people can participate. To this end, the ASU music therapy department under the leadership of Dr. Melita Belgrave is developing resources for people facilitating events to accommodate and support people of all ages and all functioning levels. Facilitator Resources (This set of resources is currently private for use by CITME partners working on community projects)"
