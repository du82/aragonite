["http://citme.music.asu.edu/2016/04/18/az-beat-lab-in-the-community"]
title = "AZ Beat Lab in the Community - Consortium for Innovation and Transformation in Music Education (CITME)"
description = "CITME partner and ASU Music Education Masters student Samuel Pena has been hard at work developing the AZ Beat Lab. Over the past school year Samuel and the AZ Beat Lab have provided programming to the Music Instrument Museum, Mesa SparkFest, and Art Detour at Palabras Libreria. The Beat Lab facilitates beat making with technology […]"
full_description = "CITME partner and ASU Music Education Masters student Samuel Pena has been hard at work developing the AZ Beat Lab. Over the past school year Samuel and the AZ Beat Lab have provided programming to the Music Instrument Museum, Mesa SparkFest, and Art Detour at Palabras Libreria. The Beat Lab facilitates beat making with technology such as launchpads, laptops, iPads, and even the Makey Makey! Samuel applies pedagogy, curriculum design, program development, and community engagement developed over several ASU Music Education courses and initiatives with his rich experience with community music making and facilitation to engage people in musical experiences and learning. CITME is proud to partner with AZ Beat Lab and looks forward to the organization growing over time and future collaborations in schools, after-school programs, and community events. This entry was posted in connected learning, contemporary musicianship. Bookmark the permalink."
