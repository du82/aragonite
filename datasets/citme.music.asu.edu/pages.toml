["http://citme.music.asu.edu/initiatives/contemporary-musicianship/games-gaming-and-music-education"]
title = "Games, Gaming, Game-Based Learning, and Music Education - Consortium for Innovation and Transformation in Music Education (CITME)"
description = "CITME is currently researching the affordances, constraints, and implications of integrating games (on computers, console systems, and mobile devices) in music education. We are looking at music-focused games and the music in games that are not music-specific. We are also looking at a range of interfaces used in conjunction with video games systems and how […]"
full_description = "CITME is currently researching the affordances, constraints, and implications of integrating games (on computers, console systems, and mobile devices) in music education. We are looking at music-focused games and the music in games that are not music-specific. We are also looking at a range of interfaces used in conjunction with video games systems and how people interact with the games and music. Feel free to contact us if you are interested in collaborating on related initiatives. Current Initiatives Games and Game-Based Learning in Music Education CITME is addressing varied ways that music educators might include video games and game-based learning in music programs. We are researching the potential of video games in music courses and ensembles. Contact CITME if you are interested in piloting projects related to games and game-based learning in relation to music engagement, teaching, or learning. Our latest project and research relates to creating and performing music to live videogame play. See our A Night in The Fields project for an example of this type of engagement in a public space Games and Music Education Database CITME is in the process of developing a database of games with information related to music teaching and learning to assist music educators in determining what games they might integrate into their classrooms along with curricular and pedagogical information. Those interested in helping to develop this project should contact CITME. Past Projects Game Play/Study Group Formed during the 2011-2012 school year, the game play/study group consisted of music education students and practicing music educators who met twice a month to play and discuss games, gaming, and related issues in reference to music education curriculum and pedagogy, and professional development. Games played during the 2011-2012 year included: DJ Hero 2, Rock Band 3, Rocksmith, Flower, Little Big Planet 2, and Dr. Seuss Band. The game play/study group might occur in the future. If you are interested in related engagement, contact CITME about more current Games and Game-Based learning initiatives. A Night in the Fields On July 20th 2013 CITME participated in A Night in the Fields, a project in collaboration with the Center for Games and Impact and Phoenix Art Museum. During A Night in the Fields, a group of musicians collaborated with attendees to create music that interacted with the way that people played the videogame Flower. Related Music Education Courses MUE598 Video Games and Contemporary Technology in Music Education (offered occasionally during the ASU Summer Music Institute). For information on potential related independent study projects contact Dr. Tobias. Related Publications by CITME Affiliates O’Leary, J. & Tobias, E. S. (Forthcoming). Sonic participation within, through, and around video games. In R. Mantie & G. D. Smith (Eds.) The Oxford Handbook of Music and Leisure. Oxford University Press. Tobias, E. S. & O’Leary, J. (Forthcoming) Video Games. In A. King, E. Himonides, & A. Ruthmann (Eds.) The Routledge Companion to Music, Technology & Education. Routledge. Tobias, E. S. (2012). Let’s play!: Learning music through video games and virtual worlds. In G. McPherson, & G. Welch (Ed.), Oxford handbook of music education. (pp. 531-548). Oxford: Oxford University Press"
year_published = 2025
year_updated = 2023
