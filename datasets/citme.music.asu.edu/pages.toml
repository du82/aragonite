title = "Creativity and Artistic Inquiry - Consortium for Innovation and Transformation in Music Education (CITME)"
description = "We research and support how musical engagement and learning can foster and catalyze creativity and artistic inquiry. Extending Concerts Through Transmedia A partnership between CITME, ASU Music Education Department, ASU School of Music faculty and students, and community to design and facilitate participatory music engagement and learning opportunities connected to concerts and events. These projects […]"
full_description = "We research and support how musical engagement and learning can foster and catalyze creativity and artistic inquiry. Extending Concerts Through Transmedia A partnership between CITME, ASU Music Education Department, ASU School of Music faculty and students, and community to design and facilitate participatory music engagement and learning opportunities connected to concerts and events. These projects seek to spark creativity, curiosity, and interest in the music and ideas related to each concert or event. Interested in having us design and develop a transmedia campaign around your concert or music event? Contact Dr. Tobias #StCeciliasDay Fall 2016 #WhenIsMusic Spring 2012 Participatory Music Pop Ups Learn more about our Participatory Music Pop Ups Being Creative through Music and Maker Culture CITME researches and supports people being creative by engaging in maker culture through music. By working with communities, youth, educators, community musicians, and adult mentors, CITME is curating and developing resources to help people realize their creativity in ways ranging from making music with fruit connected to microcontrollers to designing their own instruments and interfaces. Learn more about CITME’s Music and Maker Culture initiatives. Past Initiatives School-University Partnerships Songs of the Heart A partnership between CITME, ASU Music Education Dept., ASU Gammage, and Mountain Sky Junior High involving original songwriting around the theme “Songs of the Heart” in connection with the musical, Once. Creativity and Artistic Inquiry News Songs of the Heart: School University Partnership Throughout 2014, a team of music education students including undergraduates Tyler Cano and Nicole Sanchez and doctoral students Isaac Bickmore and Jesse Rathgeber facilitated a songwriting project with students at Mountain Sky Junior High in partnership with ASU Gammage. In connection with the musical Once, Mountain Sky students created seven original songs that addressed the theme […] Posted in creativity and artistic inquiry | Leave a comment View All Creativity and Artistic Inquiry News"
