["http://citme.music.asu.edu/smil/smil-mlt"]
title = "SMIL Music Learning and Teaching - Consortium for Innovation and Transformation in Music Education (CITME)"
description = "The Sound and Music Innovation Lab explores how technology and instruments relate to music teaching and learning in varied naturalistic settings ranging from music education courses to K-12 and community spaces. This ranges from developing and testing new technologies in music education settings to developing curriculum and pedagogy around commercially available instruments and technology. Contact […]"
full_description = "The Sound and Music Innovation Lab explores how technology and instruments relate to music teaching and learning in varied naturalistic settings ranging from music education courses to K-12 and community spaces. This ranges from developing and testing new technologies in music education settings to developing curriculum and pedagogy around commercially available instruments and technology. Contact Dr. Tobias, if you are interested in having your product(s) included in SMIL research or projects. Current Initiatives Makey Makey and Music Learning and Teaching We are currently exploring the potential of the Makey Makey for music teaching and learning along with STEAM education. Music education students are developing instruments and interfaces with Makey Makey kits while considering what young people might learn through engage with this technology. We are also collaborating with local schools and community programs to facilitate young people’s engagement and learning with Makey Makey kits. Find out more about our exploration of Make Makey, music, learning and teaching. Little Bits and Music Learning and Teaching We are currently exploring the potential of Little Bits for music teaching and learning along with STEAM education. Music education students are developing instruments and interfaces with Little Bits Synth Kits while considering what young people might learn through engaging with this technology. We are also collaborating with local schools and community programs to facilitate young people’s engagement and learning with Little Bits Synth kits. Find out more about our exploration of littleBits for music learning and teaching. Ableton and Music Learning and Teaching We are currently exploring how technology and instruments from Ableton can facilitate creative music engagement and learning. This ranges from incorporating Ableton in hybrid music settings to updating K-12 ensembles. We are collaborating with music education students, local schools, and community music organizations to develop related pedagogy, curricula, and resources. Find out more about our exploration of Ableton for Music Learning and Teaching. Maker Culture The Sound and Music Innovation Lab is exploring the possibilities around maker culture for musical engagement, creativity, learning, and teaching. We are also exploring the intersections of Science, Technology, Engineering, and Math (STEM), STEAM (STEM + Arts), and music. We are in the process of developing curriculum and pedagogical support for educators and community mentors interested in facilitating maker culture in relation to music and media arts in their own communities. Find out more about our work and play with Maker Culture and Music Education. Music Apps Database SMIL is working with ASU pre-service music educators to analyze existing music apps in relation to music engagement, teaching, and learning and develop a database that will provide music educators and others with valuable information regarding apps and their potential use in school and out-of-school settings. We will soon be extending this work to include contributions from K-12 music educators and students. This database is not yet public. Resources and Tutorials We develop and curate resources and tutorials that can be helpful to people who facilitate musical engagement and learning with technology. Explore some of our resources and tutorials in the following areas: Creating music with technology We also collaborate with music educators and community music programs to develop and curate resources and tutorials specific to their programs and the young people with whom they engage. Contact Dr. Tobias for additional information on working with SMIL in this way. Past Initiatives Research and development with integrating Kaossilators and Kaoss pads in an elementary after-school program. Research and development of integrating Audio Cubes in elementary classrooms."
year_published = 2025
year_updated = 2018
