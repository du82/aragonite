["https://citme.music.asu.edu/smil"]
title = "Sound and Music Innovation Lab (SMIL) - Consortium for Innovation and Transformation in Music Education (CITME)"
description = "The Sound and Music Innovation Lab (SMIL) is an interdisciplinary innovation incubator for researching and developing instruments and technologies to support musical engagement, teaching, and learning. SMIL addresses the development of instruments and technologies through the Sound and Music Technologies R&D group and focuses on musical engagement, music teaching and learning, and health and wellness. Contact […]"
full_description = "The Sound and Music Innovation Lab (SMIL) is an interdisciplinary innovation incubator for researching and developing instruments and technologies to support musical engagement, teaching, and learning. SMIL addresses the development of instruments and technologies through the Sound and Music Technologies R&D group and focuses on musical engagement, music teaching and learning, and health and wellness. Contact us to learn more about collaborating or sponsoring research. Sound and Music Technologies The Sound and Music Technologies R&D group researches and develops instruments, interfaces, and technologies to support and advance musical engagement and learning. The Sound and Music Technologies group focuses on human-centered design solutions that contribute to sustainability and improve people’s lives. Students can earn credit for taking part in the Sound and Music Technologies group as part of the Arizona State University Vertically Integrated Projects initiative. Don’t miss out on the opportunity to apply your interests and expertise in music-focused projects for credit. Find out more about the Sound and Music Technologies group. Music Learning and Teaching The Sound and Music Innovation Lab explores how technology and instruments relate to music learning and teaching in varied naturalistic settings ranging from music education courses to K-12 and community spaces. This ranges from developing and testing new technologies in music education settings to developing curriculum and pedagogy around commercially available instruments and technology. Contact Dr. Tobias, if you are interested in having your product(s) included in SMIL research or projects. Find out more about how SMIL is addressing music learning and teaching. Health and Wellness The Sound and Music Innovation Lab is beginning to explore how innovative technology can support health and wellness throughout people’s lives. Lab Member Resources Resources for SMIL and VIP Sound and Music Technology Group members. Sound and Music Innovation Lab News Tutorials for Developing Music Performing and Creating Systems with Lemur Sander DeVries, a masters student in music education at Arizona State, engaged in a project where he learned how to use the iPad app Lemur to design music performing and creating systems by programming graphical user interfaces. Sander developed related projects involving creating and performing music in Garageband with Lemur that he pilot tested with […] Posted in music science and society, Sound and Music Innovation Lab | Leave a comment Audiocubes and 6th Grade Music Students Consortium member and doctoral student in music education, Ryan Bledsoe has been using AudioCubes with her sixth graders. She designed a lesson in which students play the role of researchers as they interact with the AudioCubes. Her project led to a deeper understanding of how young people interact with new technologies and offered a fascinating […] Posted in music science and society, Sound and Music Innovation Lab | Leave a comment Katie Paetz’s Article on Using Kaossilators in the Music Clasroom Consortium member Katie Paetz’s article entitled Ready, Set, Kaoss! was featured in the Fall 2011 issue of The TI:MES: A Publication of Technology for Music Education. Her article describes a grant-funded project in which she used technology including a kaossilator, kaoss pad, and other music technology with kindergarten students. More information, including full text of […] Posted in music science and society, Sound and Music Innovation Lab | Leave a comment View All Sound and Music Innovation Lab News"
year_published = 2025
year_updated = 2017
