["http://citme.music.asu.edu/category/leisure-lifelong-engagement-and-wellness"]
title = "leisure lifelong engagement and wellness Archives - Consortium for Innovation and Transformation in Music Education (CITME)"
full_description = "CITME Supports the We Are All Musical project at Spark! Mesa’s Festival of Creativity Posted on March 23, 2017 by admin CITME recently played a role in supporting the We Are All Musical project at Spark! Mesa’s Festival of Creativity. We Are All Musical, a project curated by Evan Tobias, aimed to provide Spark! festival attendees with numerous opportunities to realize their musical potential. We Are All Musical included the following opportunities: Drum Village – People engaged in drum circles of varied musical styles throughout Spark! Digital Music and Push Playground – People used Ableton Live, Ableton Push units, a Novation Circuit and other instruments to create, perform, and share music in a supportive environment STEAM Space – People designed and played music with instruments, created music by coding and programming, and engaged with interactive musical art by combining science, technology, arts, and math. Musical Garden – Young children and their family members played and expressed themselves through music Make Mobile Music – People explored how they could be musical with mobile devices and music apps The Jam Lounge – People jammed with others using electronic instruments and iPad apps Make Hip Hop – People learned how to make beats, write rhymes and MC, and DJ with local Hip Hop group, Shining Soul CITME supported several of these aspects of We Are All Musical by facilitating people’s engagement and developing or sharing resources for people to learn more and extend their engagement after the Spark! festival. Learn more about We Are All Musical @ Spark! 2017 Learn more about Spark! Mesa’s Festival of Creativity 2017 Explore CITME’s initiatives around STEAM, Maker Culture, and music Explore some of CITME’s resources for connecting STEAM, music, engagement, and learning Posted in leisure lifelong engagement and wellness, music science and society Leave a comment OME Marathon Concert & Meet the Audience Posted on January 15, 2017 by admin CITME partner and local new music presenter, Oh My Ears (OME), will be hosting the 4th Annual Oh My Ears (OME) Marathon Concert this January 28th from 12:00 pm – 1o:00 pm. This is no ordinary concert. OME is fantastic at integrating aspects of participatory culture as part of its concert ethic, including it’s unique Meet the Audience component, including an opportunity to submit audio recordings and sound samples that can be used to create music at the event itself. The OME Marathon will include 10 hours of new music performances and musically engaging experiences. WHEN: Jan 28th, 2017, 12:00 pm-10:00pm WHERE: Mesa Arts Center, Nesbitt-Elliott Playhouse 1 E Main St, Mesa, AZ 85201 TICKETS: $20 regular, $15 student (bring ID), Ages 15 and under FREE Local raffle by Tuft and Needle The 2017 OME Marathon Concert, featuring local and national ensembles, composers and performers, to be held at the Mesa Arts Center on January 28th, 2017. OME is thrilled to be bringing some of the most interesting and talented musicians from Phoenix and around the country to share with our hometown audiences. 2017 will be our most ambitious concert yet and will also feature engaging opportunities such as Musical Maps and Meet the Audience. OME is a non-profit organization born out of a love for new music and a desire to create community connection through musically engaging experiences since the spring of 2014. Their annual OME Marathon concert has been called “nothing short of extraordinary,” and is a cornerstone event for the city’s burgeoning new music community CONTACT INFO: Check out the Oh My Ears website Michael Ferraro and Elizabeth Kennedy Bayer admin@ohmyears.com Elizabeth Kennedy Bayer, founder/co-director 979-236-7589 SOCIAL MEDIA: Facebook event Facebook page Twitter & Instagram: @ohmyearsmusic Posted in leisure lifelong engagement and wellness Tagged events Leave a comment"
