["http://citme.music.asu.edu/about"]
title = "About CITME - Consortium for Innovation and Transformation in Music Education (CITME)"
description = "OverviewThe Consortium for Innovation and Transformation in Music Education (CITME) creates and expands opportunities for people to learn and engage with music in our rapidly changing society.Mission StatementThe Consortium for Innovation and Transformation in Music Education conducts use-inspired research and collaborative initiatives to help music educators and those involved in arts, cultural, non-profit, and corporate […]"
full_description = "OverviewThe Consortium for Innovation and Transformation in Music Education (CITME) creates and expands opportunities for people to learn and engage with music in our rapidly changing society.Mission StatementThe Consortium for Innovation and Transformation in Music Education conducts use-inspired research and collaborative initiatives to help music educators and those involved in arts, cultural, non-profit, and corporate sectors imagine and enact new possibilities for music teaching, learning, and engagement. We collaborate with those interested in advancing music education to develop music teaching, learning, and engagement in relation to contemporary society and the future. CITME looks to broaden and deepen how music teaching and learning can impact society and contribute to positive social transformation. Research and Project InitiativesOur work centers around the following foci:Connected LearningContemporary MusicianshipCreativity and Artistic InquiryCreative Music Enterprise & EntrepreneurshipLeisure, Lifelong Engagement, and WellnessMusic, Science, and SocietyMusic Teaching and Learning Transforming SocietySound and Music Innovation Lab (SMIL)The Sound and Music Innovation Lab (SMIL) is an interdisciplinary innovation incubator for researching and developing instruments and technologies to support musical engagement, teaching, and learning. SMIL consists of the following foci: Sound and Music Technologies Musical EngagementMusic Teaching and LearningHealth and WellnessSMIL also provides individuals and companies with a working lab environment in natural settings to provide feedback regarding real-world use and pedagogical or curricular implications for contemporary technologies, instruments, and software in the context of musical engagement, teaching, and learning."
