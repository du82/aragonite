title = "Sun Devil Stadium Reinvention Through Music - Consortium for Innovation and Transformation in Music Education (CITME)"
description = "As part of our ongoing efforts to explore the role of music in community engagement and socially engaged practice, CITME supported the Sun Devil Stadium 365 Reinvention #SDS365 initiative this November. Music education students facilitated participatory music making in the entrance to Sun Devil Stadium.We invited the public to jam with us using acoustic and electric […]"
full_description = "As part of our ongoing efforts to explore the role of music in community engagement and socially engaged practice, CITME supported the Sun Devil Stadium 365 Reinvention #SDS365 initiative this November. Music education students facilitated participatory music making in the entrance to Sun Devil Stadium.We invited the public to jam with us using acoustic and electric percussion equipment along with interactive media and musical interfaces such as a controller developed with a Makey Makey. We invited event attendees to create and perform music with an Akai APC 40 by triggering samples of sounds from across the ASU Tempe campus as imagery from campus was projected on a stadium wall in an interactive audio- visual installation designed by students. In addition to taking part in the event, students developed their skills in facilitating participatory music events with people in school or community contexts.Find out more about the #SDS365 event and see a very short clip of students performing in the video below: This entry was posted in contemporary musicianship, leisure lifelong engagement and wellness. Bookmark the permalink."
