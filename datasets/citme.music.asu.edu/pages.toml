["http://citme.music.asu.edu/stceciliasdayproject"]
title = "#StCeciliasDay Project - Consortium for Innovation and Transformation in Music Education (CITME)"
description = "Welcome to the St. Cecilia’s Day Project, a collaboration between the Consortium for Innovation and Transformation in Music Education, ASU Music Education Department, ASU Chamber Singers and ASU Chamber Orchestra. We invite you to explore a set of participatory music and arts engagement opportunities around the music that will be performed during the St. Cecilia’s […]"
full_description = "Welcome to the St. Cecilia’s Day Project, a collaboration between the Consortium for Innovation and Transformation in Music Education, ASU Music Education Department, ASU Chamber Singers and ASU Chamber Orchestra. We invite you to explore a set of participatory music and arts engagement opportunities around the music that will be performed during the St. Cecilia’s Day Concert: Appear! Inspire! A Celebration of Music conducted by David Schildkret with special guests OME (Oh My Ears) and Rosie’s House. Learn more about the St. Cecilia’s Day Project and visit the Appear! Inspire A Celebration of Music Facebook Page. Attend the Concert on November, 22 at Central United Methodist Church (Doors open 6:30). Arrive early to see an exhibit of poetry broadsides written for the event by ASU faculty poets—including Arizona State Poet Laureate Alberto Ríos, and Griffin Prize winner Norman Dubie, and Dine-Navajo poet and librettist Laura Tohe—and student poets from ASU and around the valley. Explore some participatory opportunities below: Get a taste of what’s in store at the concert and through this project with our interactive trailer! Learn more about the St. Cecilia’s Day Concert Appear! Inspire! A Celebration of Music Visit the Appear! Inspire A Celebration of Music Facebook Page Stay up to date with @CITME_ASU and #StCeciliasDay Consider. . . Where do we listen to music? #wherewelisten Why do we do music? #whywedomusic What are the ways music inspires us? #musicinspires Engage with the Music and Related Context of Appear! Inspire! A Celebration of Music #StCeciliasDayChallenge We challenge you to listen and respond to music from Appear! Inspire! A Celebration of Music Remix Britten’s Hymn to St. Cecilia! Remix parts of Britten’s Hymn to St. Cecilia, Music from Appear! Inspire! A Celebration of Music Annotate Auden! Read and learn more about “Anthem for St. Cecilia’s Day” by W. H. Auden Read Related Poetry Read original poetry created for St. Cecilia’s Day Appear! Inspire! A Celebration of Music Go Behind the Scenes Go behind the scenes and learn more about the perspectives of the people involved in the St. Cecilia’s Day Concert: Appear! Inspire! A Celebration of Music. Learn Something Check out some of the content featured in our augmented concert programs to learn more about the music and ideas of the Appear! Inspire! A Celebration of Music concert. Witness our Participatory Music Pop Up We hosted a Participatory Music Pop Up featuring some of the music from the #StCeciliasDay Project ! Attend the St. Cecilia’s Day Concert Attend Appear! Inspire! A Celebration of Music and experience even more participatory engagement opportunities and wonderful music! Arrive early to see an exhibit of poetry broadsides written for the event by ASU faculty poets—including Arizona State Poet Laureate Alberto Ríos, and Griffin Prize winner Norman Dubie, and Dine-Navajo poet and librettist Laura Tohe—and student poets from ASU and around the valley. Participate in the Social Media Zone at the Concert We will host a dedicated Social Media Zone at the concert. Participate while there or follow along with #StCeciliasDay."
