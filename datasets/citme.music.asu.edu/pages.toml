title = "Leisure, Lifelong Engagement, and Wellness - Consortium for Innovation and Transformation in Music Education (CITME)"
description = "We research how musical engagement and learning can contribute to people’s wellbeing and sense of fulfillment. Current Initiatives Participatory Music Pop Ups We combine opportunities for ASU music education students to develop their skills in facilitating musical engagement and learning with opportunities for Arizona Communities to make music in low-risk participatory settings. Learn more about […]"
full_description = "We research how musical engagement and learning can contribute to people’s wellbeing and sense of fulfillment. Current Initiatives Participatory Music Pop Ups We combine opportunities for ASU music education students to develop their skills in facilitating musical engagement and learning with opportunities for Arizona Communities to make music in low-risk participatory settings. Learn more about our Participatory Music Pop Ups. Musical Playgrounds CITME collaborates with others to help develop musical playgrounds or support interactive musical engagement in existing places where play occurs. Learn more about our Musical Playgrounds initiative. Past Projects Collaboration on Spark! Mesa’s Festival of Creativity CITME played a role in facilitating participatory music engagement at the 2017 Spark! Mesa’s Festival of Creativity for the We Are All Musical project, curated by Evan Tobias. We are developing related resources and applying students’ and alumni’s deep understanding and skill with facilitating musical engagement. Leisure, Lifelong Engagement, and Wellness News CITME Supports the We Are All Musical project at Spark! Mesa’s Festival of Creativity CITME recently played a role in supporting the We Are All Musical project at Spark! Mesa’s Festival of Creativity. We Are All Musical, a project curated by Evan Tobias, aimed to provide Spark! festival attendees with numerous opportunities to realize their musical potential. We Are All Musical included the following opportunities: Drum Village – People engaged […] Posted in leisure lifelong engagement and wellness, music science and society | Leave a comment OME Marathon Concert & Meet the Audience CITME partner and local new music presenter, Oh My Ears (OME), will be hosting the 4th Annual Oh My Ears (OME) Marathon Concert this January 28th from 12:00 pm – 1o:00 pm. This is no ordinary concert. OME is fantastic at integrating aspects of participatory culture as part of its concert ethic, including it’s unique […] Posted in leisure lifelong engagement and wellness | Tagged events | Leave a comment Community Music Engagement Course Collaboration Dr. Roger Mantie’s Community Music Engagement course collaborated with Dr. Kevin Wilson’s Leisure and Quality of Life course to explore the possibilities of leisure, music, and community engagement through an innovative opportunity for student projects. Take a look at this write up on the initiative and the fabulous projects that emerged from this work and impacted […] Posted in leisure lifelong engagement and wellness | Leave a comment Sun Devil Stadium Reinvention Through Music As part of our ongoing efforts to explore the role of music in community engagement and socially engaged practice, CITME supported the Sun Devil Stadium 365 Reinvention #SDS365 initiative this November. Music education students facilitated participatory music making in the entrance to Sun Devil Stadium.We invited the public to jam with us using acoustic and electric […] Posted in contemporary musicianship, leisure lifelong engagement and wellness | Leave a comment View All Leisure, Lifelong Engagement, and Wellness News Credits: Photo: Drum Circle Feb09 by Marvin Lee"
