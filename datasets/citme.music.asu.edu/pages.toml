["http://citme.music.asu.edu/2017/01/15/ome-marathon-concert-meet-audience"]
title = "OME Marathon Concert & Meet the Audience - Consortium for Innovation and Transformation in Music Education (CITME)"
description = "CITME partner and local new music presenter, Oh My Ears (OME), will be hosting the 4th Annual Oh My Ears (OME) Marathon Concert this January 28th from 12:00 pm – 1o:00 pm. This is no ordinary concert. OME is fantastic at integrating aspects of participatory culture as part of its concert ethic, including it’s unique […]"
full_description = "CITME partner and local new music presenter, Oh My Ears (OME), will be hosting the 4th Annual Oh My Ears (OME) Marathon Concert this January 28th from 12:00 pm – 1o:00 pm. This is no ordinary concert. OME is fantastic at integrating aspects of participatory culture as part of its concert ethic, including it’s unique Meet the Audience component, including an opportunity to submit audio recordings and sound samples that can be used to create music at the event itself. The OME Marathon will include 10 hours of new music performances and musically engaging experiences. WHEN: Jan 28th, 2017, 12:00 pm-10:00pm WHERE: Mesa Arts Center, Nesbitt-Elliott Playhouse 1 E Main St, Mesa, AZ 85201 TICKETS: $20 regular, $15 student (bring ID), Ages 15 and under FREE Local raffle by Tuft and Needle The 2017 OME Marathon Concert, featuring local and national ensembles, composers and performers, to be held at the Mesa Arts Center on January 28th, 2017. OME is thrilled to be bringing some of the most interesting and talented musicians from Phoenix and around the country to share with our hometown audiences. 2017 will be our most ambitious concert yet and will also feature engaging opportunities such as Musical Maps and Meet the Audience. OME is a non-profit organization born out of a love for new music and a desire to create community connection through musically engaging experiences since the spring of 2014. Their annual OME Marathon concert has been called “nothing short of extraordinary,” and is a cornerstone event for the city’s burgeoning new music community CONTACT INFO: Check out the Oh My Ears website Michael Ferraro and Elizabeth Kennedy Bayer admin@ohmyears.com Elizabeth Kennedy Bayer, founder/co-director 979-236-7589 SOCIAL MEDIA: Facebook event Facebook page Twitter & Instagram: @ohmyearsmusic This entry was posted in leisure lifelong engagement and wellness and tagged events. Bookmark the permalink."
