title = "Katie Paetz's Article on Using Kaossilators in the Music Clasroom - Consortium for Innovation and Transformation in Music Education (CITME)"
description = "Consortium member Katie Paetz’s article entitled Ready, Set, Kaoss! was featured in the Fall 2011 issue of The TI:MES: A Publication of Technology for Music Education. Her article describes a grant-funded project in which she used technology including a kaossilator, kaoss pad, and other music technology with kindergarten students. More information, including full text of […]"
full_description = "Consortium member Katie Paetz’s article entitled Ready, Set, Kaoss! was featured in the Fall 2011 issue of The TI:MES: A Publication of Technology for Music Education. Her article describes a grant-funded project in which she used technology including a kaossilator, kaoss pad, and other music technology with kindergarten students. More information, including full text of Katie’s article is available to TI:ME members at the Technology for Music Education website.Katie found that young people treat the kaossilator as if it were any other type of classroom instrument! For more information about Koassilators visit the Korg home page.Congratulations Katie! This entry was posted in music science and society, Sound and Music Innovation Lab. Bookmark the permalink."
