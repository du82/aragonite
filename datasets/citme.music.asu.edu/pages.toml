["https://citme.music.asu.edu/opportunities"]
title = "Opportunities - Consortium for Innovation and Transformation in Music Education (CITME)"
description = "Partner with CITME Interested in partnering with CITME? Whether sponsoring research, collaborating on the development of new curricula or technologies, or seeking creative ways to communicate science or engage the public in pressing issues through the arts, we are always interested in starting a conversation about possibilities. Get in touch. We are currently working with a […]"
full_description = "Partner with CITME Interested in partnering with CITME? Whether sponsoring research, collaborating on the development of new curricula or technologies, or seeking creative ways to communicate science or engage the public in pressing issues through the arts, we are always interested in starting a conversation about possibilities. Get in touch. We are currently working with a number of music educators integrating Ableton Push and Live in their Programs. Let us know if you would like to collaborate on this initiative. Join the CITME Team Are you a faculty member or student interested in one or more of our initiatives? Join our team. Students from across campus can link with research or projects through independent studies (undergraduate or graduate), Barrett Honors Contracts or Theses, capstone projects, or earn credit through our Sound and Music Innovations Lab (SMIL) Teachers and Teaching Artists can join projects and earn professional development clock hours or (CEUs) [NOTE: CEUs and Professional Development hours are clock hours. CEUs and Professional Development hours are not graduate credit and may not be converted to graduate credit at later date. Check with your school district to determine whether CEUs may be used for salary or career advancement.] Community members can share expertise and volunteer on initiatives of interest. Contact us. Join the Arizona State University Learning Community Thinking about enrolling in a course, degree, or certificate? Our music education graduate program offers countless opportunities for work, study, and research related to digital, popular, and participatory culture. Degree candidates have a range of choices to design an individualized program of study in consultation with a faculty advisor. The post-baccalaureate degree in music education is perfect for those who majored in music or have musical experience and are interested in developing expertise in teaching and learning for varied contexts ranging from teaching in studios or facilitating community music programs to teaching in pk-12 music programs or starting a trajectory to teaching in university settings. Get in touch to find out if this is a good fit for you. The master’s degree program in music education provides professional education for music educators and community musicians. Flexible study options are available for individuals who are teaching full-time or part-time, and for those who wish to enroll as full-time graduates. Ask us about our online learning options! The Doctor of Philosophy in Music degree with a concentration in music education is comprised of a highly select community of national and international students engaged in an intensive program of study that includes research opportunities, teaching internships, and publication and presentation experiences. The Ph.D. in music education qualifies graduates for faculty positions at colleges or universities in the United States or abroad, and for leadership and administrative positions in the arts and arts education. Learn more about the Arizona State University School of Music Education program. For further information contact Evan Tobias [Evan dot Tobias at ASU dot edu]"
