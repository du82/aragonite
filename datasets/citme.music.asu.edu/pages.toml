["http://citme.music.asu.edu/research-and-project-initiatives/contemporary-musicianship/popular-music-and-culture"]
title = "Popular Music and Culture - Consortium for Innovation and Transformation in Music Education (CITME)"
description = "CITME assists pre-service and in-service music educators address popular music and culture in varied settings. Current Initiatives Developing Curricular Resources for Contemporary Musicianship in K-12 with Principled Innovation We are currently applying the design aspiration of Principled Innovation to collaborate with artists/producers and music educators to develop educative curricular resources to support contemporary musicianship in […]"
full_description = "CITME assists pre-service and in-service music educators address popular music and culture in varied settings. Current Initiatives Developing Curricular Resources for Contemporary Musicianship in K-12 with Principled Innovation We are currently applying the design aspiration of Principled Innovation to collaborate with artists/producers and music educators to develop educative curricular resources to support contemporary musicianship in K-12 and community youth music programs. Urban Arts and Culture Our Urban Arts and Culture initiatives currently focus primarily on Hip Hop culture and related music as well as electronic dance music and related culture. J Dilla Music Tech Grant Initiative We partnered with Save the Music Foundation on the J Dilla Music Tech Grant. The J Dilla Music Tech grant provides select schools and highly qualified music educators with equipment, instruments, resources, and professional development to facilitate contemporary music programs. Find out more. Courses and Professional Development Opportunities We offer a popular music lab that addresses issues of performing popular music with related instruments during our ASU Summer Music Institute. MUE598 Popular Music and Culture in Music Education is offered on a rotating basis during spring semesters. We also promote the Urban Dance Music Ensemble (a collaboration between the school of Film, Dance, and Theater and School of Music) to students and community members during fall and spring semesters. Undergraduate students also have access to courses in Hip Hop and Dance Music production and Rock Band."
