description = "Robert Freeman, a masters degree student in music education at Arizona State, engaged in a project where he learned how to use the application Max and developed a related series of tutorials on using Max. Max is an innovative programming language that has many potential uses for the music educator. These tutorials provide an introduction […]"
full_description = "Robert Freeman, a masters degree student in music education at Arizona State, engaged in a project where he learned how to use the application Max and developed a related series of tutorials on using Max. Max is an innovative programming language that has many potential uses for the music educator. These tutorials provide an introduction to the software for the novice programmer and computer user. As part of developing his understanding of MAX and ability to program patches, Robert referenced V.J. Manzo’s book Max/MSP/Jitter for Music: A practical guide to developing interactive systems for education and more. ASU students have many opportunities to engage in similar independent studies. You can watch some of Robert’s tutorial videos below:Max Tutorial – Episode 1Max Tutorial – Episode 2Max Tutorial – Episode 3 Pt. 1Max Tutorial – Episode 3 Pt. 2 This entry was posted in music science and society. Bookmark the permalink."
