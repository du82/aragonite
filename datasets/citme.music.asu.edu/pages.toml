["http://citme.music.asu.edu/research-and-project-initiatives/connected-learning"]
title = "Connected Learning - Consortium for Innovation and Transformation in Music Education (CITME)"
description = "CITME is involved in researching and developing strategies to support connected learning across formal, nonformal, and informal settings through music teaching and learning and creative youth development. Our connected learning initiatives involve stakeholders in school music programs, after-school and community music programs, private music teachers, and  other settings outside of formal contexts.  Current Initiatives Sound […]"
full_description = "CITME is involved in researching and developing strategies to support connected learning across formal, nonformal, and informal settings through music teaching and learning and creative youth development. Our connected learning initiatives involve stakeholders in school music programs, after-school and community music programs, private music teachers, and other settings outside of formal contexts. Current Initiatives Sound Explorations: Creating, Expressing, and Improving Communities CITME was recently awarded a Playlists for Learning grant from the Digital Media and Learning Competition 6 to develop connected learning playlists. Our project, Sound Explorations: Creating, Expressing, and Improving Communities, connects pre-service and in-service music educators, teaching artists, community youth organizations, and youth to create a set of six interconnected learning playlists with multiple learning pathways around the themes: Coding and programming music; Making beats; Building instruments and interfaces; Producing music, Connecting music and culture; and Jamming: Solo and Groups. Learning experiences will emphasize creativity and self-expression while fostering musical inquiry, deepening musical skills and understandings, and strengthening participants’ sense of selves as musical people who make a difference in their communities and society. Community Engagement and Socially Engaged Practice CITME works with the music education department and other departments in the school of music to send School of Music students throughout the Phoenix metro area to facilitate community music engagement and learning opportunities for the general public. Projects range from interactive STEAM projects and songwriting sessions at the Musical Instrument Museum to participatory music making at campus and community events. We are in the process of developing long-term partnerships with local community music organizations to support young persons’ musical interests, engagement, and learning in ways that build and expand upon school music experiences. We are also working to provide opportunities for young people who are not part of school music programs to engage with and learn music in community settings. Learn more about how CITME supported community engagement at Spark! Mesa’s Festival of Creativity 2017. Connected Learning News Discussion of music education and connected learning with EdTechTalk CITME director, Evan Tobias recently joined Paul Allison and Christina Cantrill from the National Writing Project on EdTechTalk’s Teachers Teaching Teachers to discuss issues around music education, connected learning, and the Sound Explorations project for the 6th Digital Media and Learning Competition. Paul and Allison are fellow grant awardees for the NWP’s Sandboxes for Learning […] Posted in connected learning | Tagged Sound Explorations | Leave a comment Arizona State Music Education Initiative to Develop Music Connected Learning Playlists Posted in connected learning, contemporary musicianship | Tagged Sound Explorations | Leave a comment Sound Explorations: Developing Connected Music Learning Playlists The Sound Explorations project, led by the Consortium for Innovation and Transformation in Music Education at Arizona State University, is in the process of developing six connected music learning playlists organized around the following themes: Building instruments and interfaces: Coding and programming music Connecting music and culture Jamming: Solo and Groups Making beats Producing original […] Posted in connected learning | Tagged Sound Explorations | Leave a comment Connected Learning at The Center During Fall 2016 CITME will partner with the ASU Music Education Department, ASU School of Community Resources and Development, and Phoenix Center for the Arts to launch a number of music programs ranging from coached chamber groups to digital music creation labs.Under the leadership of Dr. Roger Mantie, HIDA at the Center will support creative […] Posted in connected learning | Leave a comment View All Connected Learning News Credits: Globe Image by Mark Doliner"
