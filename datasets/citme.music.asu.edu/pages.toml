description = "CITME Curated Resources Thank you to CITME partner Michael Ferraro and ASU Music Education students for helping to curate these resources. You can find out more about CITME partners are using Ableton Live for music learning and teaching. What is Ableton Live? Ableton Live is a digital audio workstation (DAW) that supports music creation and […]"
full_description = "CITME Curated Resources Thank you to CITME partner Michael Ferraro and ASU Music Education students for helping to curate these resources. You can find out more about CITME partners are using Ableton Live for music learning and teaching. What is Ableton Live? Ableton Live is a digital audio workstation (DAW) that supports music creation and production. It can be used in conjunction with MIDI controllers such as the Ableton Push among other MIDI devices as well as any audio sources ranging from electric guitars to microphones. What is the Ableton Push? The Ableton Push is a MIDI controller designed to work specifically with Ableton Live. The Push can do anything from trigger samples to perform melodic and harmonic content. What do I need to use Ableton Live for musical engagement? Ableton Live requires a desktop or laptop. Unfortunately, Ableton does not work with a Chromebook. It works well with MIDI controllers such as the Ableton Push among other devices that have pads and knobs and other types of controllers. Getting Started Working with Audio in Ableton Working with MIDI and Push Controller with Ableton Next Steps Sampling with Ableton Live Building Drum Racks in Ableton Live"
