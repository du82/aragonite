title = "Sound and Music Innovation Lab Archives - Consortium for Innovation and Transformation in Music Education (CITME)"
full_description = "Tutorials for Developing Music Performing and Creating Systems with Lemur Posted on March 10, 2013 by admin Sander DeVries, a masters student in music education at Arizona State, engaged in a project where he learned how to use the iPad app Lemur to design music performing and creating systems by programming graphical user interfaces. Sander developed related projects involving creating and performing music in Garageband with Lemur that he pilot tested with middle school students.Here are some of Sander’s video tutorials with connections to music teaching and learning:Using the iPhone/iPad app Lemur to wirelessly control Ableton on a computer Scripting and Expressions in the Lemur Editor Creating a simple keyboard interface in the Lemur Editor Posted in music science and society, Sound and Music Innovation Lab Leave a comment Audiocubes and 6th Grade Music Students Posted on May 3, 2012 by admin Consortium member and doctoral student in music education, Ryan Bledsoe has been using AudioCubes with her sixth graders. She designed a lesson in which students play the role of researchers as they interact with the AudioCubes. Her project led to a deeper understanding of how young people interact with new technologies and offered a fascinating look into young people’s attitudes on research and music.You can read all about the project on Ryan’s blog: Musical Adventures. Posted in music science and society, Sound and Music Innovation Lab Leave a comment Katie Paetz’s Article on Using Kaossilators in the Music Clasroom Posted on February 14, 2012 by admin Consortium member Katie Paetz’s article entitled Ready, Set, Kaoss! was featured in the Fall 2011 issue of The TI:MES: A Publication of Technology for Music Education. Her article describes a grant-funded project in which she used technology including a kaossilator, kaoss pad, and other music technology with kindergarten students. More information, including full text of Katie’s article is available to TI:ME members at the Technology for Music Education website.Katie found that young people treat the kaossilator as if it were any other type of classroom instrument! For more information about Koassilators visit the Korg home page.Congratulations Katie! Posted in music science and society, Sound and Music Innovation Lab Leave a comment"
