full_description = "The owner. ‘Utomhusverket 2021’ installation, by Studio Ossidiana for ArkDes Utomhusverket 2021 by Studio Ossidiana for ArkDes; a conference centre for the birds, ‘al masha’, and the beauty, dignity and utility of shared things in everyday life ArkDes are quietly building one of the Sweden’s more interesting spaces out of one of Sweden’s least interesting spaces Sitting outside one of Stockholm’s primary cultural complexes, the space known as Exercisplan has previous lives that would have been defined by display, ritual and ceremony. It was once a parade ground, when the island of Skeppsholmen was largely allocated to military use. But now it is an entirely blank space, an unlovely, unloved square of asphalt, essentially as if car park, yet awkwardly acting as the entrance to the Swedish National Centre for Architecture and Design (ArkDes) and one of the country’s preeminent galleries (Moderna Museet). The vagaries of public administration mean that, as far as anyone can tell, it is destined to be left empty, presumably waiting for the fire engines that will hopefully never come, vacant just in case, deliberately under-using what is otherwise a prime morsel of public space in a jewel of an island in the centre of Stockholm, a few steps from the archipelago’s rich and complex terrain. I wouldn’t want to overplay it. It’s no more than a small urban space—but we know the importance of the social life of small urban spaces. It’s a small urban space — yet fronted by at least two major cultural institutions, and surrounded by trees and gardens, sitting on a jewel of an island in the middle of the Swedish capital Yet here nature and culture is reduced to a void, a slab of nothing, a blasted concrete heath and a biodiversity desert, its hardscape terrain currently amplifying the Swedish summer’s increasingly fierce sun. Such is the way that public spaces are (mis)managed in the early 21st century, and not just in Sweden. In that context, where natural life and cultural life is seen as a cost, a maintenance headache, a safety and security liability, it is preferable to leave it as asphalt. This is a system working as precisely as it is intended to, because “every system is perfectly designed to get the results it gets”. Yet happily, for the last few years ArkDes have been quietly and artfully subverting this intent, filling this small space with questions in the form of commissioned installations over the summer months. Public Luxury (2018) placed Dansbana! here, a lovely reworking of the open stages for dancing that traditionally peppered most Swedish towns and villages. And last year, the Melbourne-based artist Linda Tegg created a modular meadow environment, Infield, of which more later. And this year, Studio Ossidiana—an Italian, though Rotterdam-based, architecture, design and research practice led by Alessandra Covini and Giovanni Bellotti —have produced a beautiful installation, Utomhusverket 2021, which pushes even further into this questioning of public space and how it might be articulated, of “platforms for outdoor gathering”, of convivial urban spaces, including conviviality between and within nature. (And also, quite simply, the numerous variations of transition ‘from car park to park’ that many of us are engaged in.) ‘Utomhusverket 2021’ installation, by Studio Ossidiana for ArkDes I visited on a very sunny Sunday June 6th, perhaps a few days after it opened. I got there early in the morning, around 7am. I’m aware of the irony in writing an article about people and public space, based on visiting the place without people. If you do want to see people occupy the space—and you should—then watch this excellent explanatory film by Performing Pictures, featuring Studio Ossidiana (see more at the ArkDes site): Living. Stills from Performing Pictures film about Utomhusverket 2021 But I specifically wanted to see the space before people arrived. Aware that this space is usually bereft of people anyway, I wanted to see the structures that had been added, and to dwell in the space with other, non-human forms of nature inhabiting it, for reasons I’ll outline later. The urban sociology researcher in me—Reader, I was one, once—usually wants to explore people, their relationships and networks, places and histories, patterns of living, ownership and organising structures. The designer that I then became wants to understand that too, but also the creation and maintenance of affordances, hooks, invitations, atmospheres, codes, materials, physical and digital structures, the built and natural environment (or livsmiljö, as we say in Swedish, a hybrid of both, translating handily as ‘living environment’). All these aspects and more are relevant, ultimately, and I’ll return to see how they’ve entwined over time. Entities like ArkDes, and their many equivalents and variations, know how to both curate and commission those affordances, and prime the space with cultural activity, through ongoing engagement. This is why such social infrastructures—libraries and laundrettes, plazas and playgrounds, pools and pavements, parks and pubs, schools and streets, museums and markets, cafes and churches etc—are so important, as I unpack in this piece. The ability for ArkDes—or equivalent—to generate life, and living environments, is not in question here. Rather, the issue is the invisible cultures of decision making that actually prevent such living environments happening in places such as these. And then, to zoom in to the design of affordances that can suggest and stimulate living environments once they are unlocked. That’s what this piece is about. There are many small gems in that documentary film, circling not only around the duo’s interest in public spaces, but in making, materials, minerals and ground—and, as Studio Ossidiana say, luring people over into small moments and patterns, which reveal that “not all ground is the same”. It also reveals, in loving detail, the processes of making behind all these elements, a precious celebration of craft, necessary in such a public luxury. Making. Stills from Performing Pictures film about Utomhusverket 2021 Here’s the project description: Conceived as an “archipelago” of activities and encounters between people, plants, birds, and minerals, Utomhusverket 2021 celebrates the potential of public space. A planted pond offers relief from the summer heat for both birds and people. Tall perches, designed for migratory birds, cast shadows across a ground of shells, loam, and gravels. The ground elements combine to create new soils that can be shaped by digging, walking, lying, playing, and more. A sundial marks the passing of time, while radiating the captured heat of the sun. An enclosed garden offers shade, shelter, and berries to birdlife. Handcrafted terrazzo ‘rocks’ afford opportunities for play, display, and gathering.—ArkDes The description of “an archipelago of activities and encounters” captures the installation perfectly (and perhaps knowingly, as this island connects city to archipelago.) It’s a playful space, for us and the birds, as well as a reflective space. And therefore, in this context, it is also profoundly transformational. “From play and meditation to open-air community meetings and demonstrations, (Studio Ossidiana’s) design sets a stage for new ways of being together. It highlights the symbolic action of shared experiences — with others, with nature, and with our surroundings.”—ArkDes The installation shifts the space, moving from the mode of a car park that doesn’t even have parking in it to a genuinely inviting public space, programmed to draw you in and gently subvert ideas of what public space is, never mind question why the space exists as an empty car park. There are several moments worth dwelling on, little patterns of activity. In the film, Ossidiana describe these moments as “embassies”, and it’s easy to imagine how, in plan, it might appear like a layout for a diplomatic quarter, simple geometries of circle, square and triangle to house a few opposing nation states. Yet as they also point out, they are interested in playing this urban scale off against a “sentimental scale”, a scale which suggests and rewards interaction. At the centre, a pool creates a cooling space—a giant bird bath—and a beautiful reflective space, bouncing the light from building, sky and trees. Perhaps the greenery will tumble over the edge by the end of summer. Some of the stones are beautifully polished terrazzo and concrete—again, watch the film, just shy of 15 minutes in—whilst others feel rougher, telling an oblique story of the formwork, and hands, that produced it. The colours feel Italian—well, at least one reading of northern Italian municipal hues—but also nod to the pastels that cloak 20th century Stockholm buildings: soft greens and pinks, set against the yellow ArkDes building behind, counterpointed by the gleaming white stones. The setting for the pool and the stones is a crunchy gravel, carefully formed into loose sections, with a definition that initially reminds me of formal Italian or French gardens. Yet look closer and we see seashells in the mix, and the intense, sunglasses-inducing white light white heat bouncing back not only suggests the reflective roofs and other urban surfaces we may need to counter climate change — at least those roofs that aren’t green — but the vast stretches of white sand along the beaches of the Mediterranean and southern oceans. Over one edge, a square of pink block—which feels like sandstone, but is presumably a soft concrete—is ornamented with geometric patterns, and decidely non-geometric spindly flowers. These almost-dried stems are carefully arranged into the base, as though they are stuck in those foam blocks you find in florists. A checkerboard-like pattern suggests social games. Yet those pools to capture rain water, and present scoops of sunflower seeds, indicate this is a small block loosely allocated for other wildlife, of the non-chess-playing variety, and sure enough, after a family of ducks parades past, a lone mallard circles back to hang out for a bit, endlessly chuntering on at me, as males do, ducksplaining away. In the video below we see the duck exploring the terrain, easing from an impressive neck-stretch into a quick high jump, no doubt drawn to those small pools of sunflower seeds. The duck and I had reached an understanding by this point, in which he was entirely not bothered by my presence, and was happy to broadcast this fact to me. There are poles for birds to perch on spaced across the gravel, describing a curved chord drawn across the circle. Some of the poles have a dish on top, filled with bird seed. They are standing in for trees here, clearly, and might we imagine these dotted across city streets and parks, perhaps alongside traffic lights or signs where trees cannot grow. Along with bees for streets, what can we do—alongside planting many more trees—to encourage bird life in streets, given the numerous benefits of birdsong in an urban environment? This gull prefers the certainty of the street light to the new poles behind. Can they sense it’s a pop-up, and so it may pop-down at any moment? Nearby, the green perforated metal cylinder on another point of the circumference is crowned by a ring of mock ornamental gables. But the interior is where the interest lies, with a series of artfully-placed viewing portholes revealing a terrarium-like miniature ecosystem open to the sky, a replica of a beautiful mossy Swedish forest floor. Sunlight dapples in through the grid of holes, and through the tree. It’s a little jewel-box. As Ossidiana says, this is somehow both “constructed and manicured” and the wildest of the “embassies” they’re making here. It has “something of the forest”, and speaks of a certain form of preservation of nature, where we are not allowed in. This is opposed to other spaces, which you are very much invited to occupy. The neo-conservationist debates are being subtly played out here. I’m particularly interested to see how this part has grown, and I’ll revisit before the exhibit closes in October. The ivy was already working its way out through the openings after only a few days, as it tends to. Again, it’s easy to imagine small structures like these on street corners, soaking up rain and the curiosity of passers-by, small outcrops of forest-like terrain snuck into hardscape, not just Tiny Forests, but micro-forests. They’re not really forest-like, of course, any more than the tip of an iceberg is the whole iceberg. I read Suzanne Simard’s extraordinary Finding the Mother Tree a few weeks after visiting Utomhusverket. As Simard says in this great interview, her work “turned upside down our understanding of forests from just a collection of individuals competing with each other to this entwined, interactive suite of species that actually collaborated and competed”. It’s clear that these confected ecosystems are missing entire substrates; that they are artificial facsimiles of a forest; again, no more than a living diorama. Of course, there is still more life in this circular wedge of surface terrain than in the rest of Exercisplan put together, perhaps excepting the pool. And Studio Ossidiana are clear about the intent here—as explained in the film, it is a deliberately contained confection of nature, both the wildest and most constructed ‘embassy’ in the neighbourhood. But it does make you wonder what the next step is, where we might puncture through the concrete of Exercisplan into a subterranean social life of small urban spaces, where the socialising is largely done by mycorrhizal fungi, root networks and bugs. That is precisely the kind of engaging design research that current planning strictures for this space prohibit, however. The perceptible action in this video of the interior is largely in the soundtrack, from creatures off-camera outside of the tiny world in front of me, the persistently beautiful blackbird not deterred by the bullying gulls circling around. On a quiet Sunday morning, birds do actually own the place. ArkDes is on an island, Skeppsholmen (which translates to ‘The islet of ships’, perhaps), a small mound cast off from the city centre, a formerly military gateway into the archipelago and out of the city, the island’s old naval buildings now occupied by cultural institutions. But during early summer, it’s clear that birds will eternally see it as giant nest. In fact, at moments, with the birds clearly emboldened as they realised they heavily outnumbered me, the general vibe got a little too Tippi Hedren to be comfortable. But I was visiting during the prime nesting and nurturing weeks, after all. It’s their space rather than mine, their infants learning how to waddle across the tarmac, not mine. I can’t sketch out the routes, but I’m suddenly very aware that this island’s position must sit within broader patterns of habitation. For the Canada Geese, it’s a port in journeys I can ba"
