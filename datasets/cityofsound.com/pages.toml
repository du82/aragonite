description = "The ‘one-minute city’ idea I’ve been developing, as part of the backdrop to our Streets mission here in Sweden, is featured in Bloomberg CityLab. Zooming into the currently en vogue (though ancient, timeless) 15-minute city idea, the one-minute city focuses on the immediate streetscape, exploring models for co-designing, caring and maintaining the street together, and…"
full_description = "The ‘one-minute city’ idea I’ve been developing, as part of the backdrop to our Streets mission here in Sweden, is featured in Bloomberg CityLab. Zooming into the currently en vogue (though ancient, timeless) 15-minute city idea, the one-minute city focuses on the immediate streetscape, exploring models for co-designing, caring and maintaining the street together, and thus shifting systems and cultures around mobility, biodiversity, culture, conviviality, and so on. It draws inspiration from numerous sources, as Feargus O’Sullivan notes, which I unpack a little across various Slowdown Papers — such as Ron Finley’s gardens with LA parking lots, Linda Tegg’s Infield meadow at ArkDes, Michael Sorkin’s ‘Sidewalks of New York’ model, Nordic cooperatives and public luxury, Arup’s ‘Daylighting Melbourne’ adaptive strategy approach, and ultimately Small pieces, loosely joined, post-traumatic urbanism patterns. More to follow: I’ve been documenting all this for sharing soon. Make way for the one-minute city (Bloomberg CityLab) Share this:TwitterFacebookLike Loading…"
