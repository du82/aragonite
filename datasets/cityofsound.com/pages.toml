ularly with cities under the onslaught of e-commerce, adding to the enormous quantities of goods moving through shops, offices, bars and restaurants in the city. Although these mobility technologies wax and wane, compared to the waves of FedEx, UPS, Amazon etc. trucks now occupying North American and European cities, the last-kilometres of delivery in Tokyo are often handled with simple trolleys, pushed—sometimes with a little tiny-motorised help—by people. The vehicles effectively follow a swarm model, which I often describe as akin to ‘packet-switched logistics networks’, as large volumes are broken down into smaller units as they approach their destination. The presence of these vehicles—entirely humble, practical and of course highly sustainable, yet unobtrusive, with little or no ornamentation or expression (save the iconic and ubiquitous Yamato logo)—leaves the street open in a way that trucks simply cannot. In that, it’s a remarkably generous way to get things done. In comparison to the large footprint of deploying a truck-based system at street level, this is an approach to logistics which produces space, almost standing for an absence of matter. I’d be interested in understanding more about the regulatory or commercial ‘dark matter’ involved in ensuring this system, but at the same time, suspect that it could equally be an implicit outcome of a culture subtly attuned to qualities of hierarchy, politeness, transience, and communality. Cart pushed in front of Kengo Kuma’s SunnyHills Cake Shop, featuring the jigoku-gumi (‘interlocking hell’) wooden joint technique The yellow and black Yamato logo must be one of the more ubiquitous symbols across Japanese streets This guy was jogging the trolley through Kamata backstreets, near Moriyama House Sometimes the ‘driver’ is hidden behind boxes, and you just see the trolley trundling up the street. A precursor to automated trolleys? I hope not. A very different delivery, in a very different delivery trolley Imagine th