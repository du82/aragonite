["https://cityofsound.com/2022/01/27/strategic-design-for-society-making-the-oslo-futures-catalogue"]
title = "Strategic design for society: Making the Oslo Futures Catalogue – City of Sound"
description = "The Oslo Forest creeps back into the city, in Sofie Finnøy Vestøl and Tina Mee Johnsen’s proposalMaking the ‘Oslo Futures Catalogue’, on the first ‘Strategic design for society’ course running at Oslo School of Architecture and Design (AHO), 2021Einar Sneve Martinussen, Ted Matthews, Aleksandra Zamarajeva Fischer and I just wrapped the first version of the Strategic…"
full_description = "The Oslo Forest creeps back into the city, in Sofie Finnøy Vestøl and Tina Mee Johnsen’s proposal Making the ‘Oslo Futures Catalogue’, on the first ‘Strategic design for society’ course running at Oslo School of Architecture and Design (AHO), 2021 Einar Sneve Martinussen, Ted Matthews, Aleksandra Zamarajeva Fischer and I just wrapped the first version of the Strategic Design for Society course that we’ve been running for Masters design students at Oslo School of Architecture and Design (AHO). Across a 14-week course, the students had two main assignments, each with an external partner. First up, a six-week sprint to develop a portfolio of possible futures for Oslo neighbourhoods, expressed in terms of tangible social infrastructures, which is intended to contribute to, and counterpoint, the process of developing the city’s innovation strategy. The second project, which we’ll describe soon, took a similar approach, but addressed gender equity in societal planning for Karmøy municipality in western Norway, and has a longer timeframe to embed ideas into prototypes. It’s the first time we’ve run the course. The following text outlines the lectures that helped frame some the methods used by students, as well as considerations on the finished work, which we ended up calling the Oslo Futures Catalogue. Download the catalogue hereYou can download a copy of the Oslo Futures Catalogue v1 (PDF) here. We have also reproduced the opening essay from the Catalogue separately, which delves a little deeper into the thinking behind the course. View at Medium.com The students collectively created the Catalogue, with us as editors, and the credit for individual contributions can be found on each spread of the document. The students where Pernille Hartvigsen, Cornelia Schmitt, Kamilla Bedin, Herman Freng Billett, Kristin Mar!e Brudeseth, Johanna Sofie Brämersson, Tina Mee Johnsen, Sigrid Løvlie, Nikolai Sabel, Åse Lilly Salamonsen, Lisa Siegel, Elizabeth Bjelke Stein, Glenn Sæstad, Mats Georg Syvertsen Søfting, Sofie Finnøy Vestøl and Anna Malene Vik. Preparing the ground Our lectures, which we would start each week with, covered aspects of strategic design theory and practice—Trojan Horses and Macguffins, Maginot Lines and Levers, Probes and Place-types, Half-Steps and Kits-of-Parts, Nolli Flips and Value Models, Snowploughs and Snowballs (and perhaps I’ll write about all that separately, part of a sequel to this.) We also worked thoroughly worked-through the concept of social infrastructures as the keystone in our imagination of the Scandinavian neighbourhood, extending Klinenberg’s powerful, if US-oriented, work in multiple directions—including nature-based infrastructures, distributed ‘non-grid’ technologies, Nordic civic architectures and ‘public luxury’. See the accompanying post for a little more on this thinking, as well as this backdrop in the Slowdown Papers. We also contextualised the questions of innovation—again, as described in the sister article—within those of a Nordic ‘digital shift’, and Nordic public sector innovation, drawing from several years of research, practice and teaching by Einar and crew at AHO, as well as my own work at SITRA, Vinnova, and others, over the years. But to set up the practical aspects of the project, Einar, Ted, and I described observation techniques, and different ways of seeing, sensing and describing, often via narrative formats. These approaches were not simply about observing and understanding, but also about conveying and describing. Taking this cultural approach, as subjective as it is objective, meant that we could also foreground critical perspectives of observer and representative, local and non-local, participant and designer. This was not about using data to represent a place, but culture, narrative, identity. This was another subtle ‘pulling of the rug’ from underneath the typical approaches to innovation strategies. Ways of seeing Einar started this aspect with great talk covering the branching narratives of Loki to the poetic evocation of place in Will Eisner; the embedded activism of Jane Jacobs to the oblique insights possible via street photography; the composed pacing of a Chris Ware page to the diagramming of food moving through domestic spaces (from Quaderns 271 About Buildings and Food), and the intriguingly evocative and ‘off’ drawings in Anno’s Journey by Mitsumasa Anno, all via the backdrop of Henri Lefebvre, and an investigation of ‘everyday life’ (discussed a little more in this adjacent piece). Einar also included necessary critiques of typical tech-led design fiction, such as the many research—cough—actually promotional films made in the last 15 years by tech companies, placed in the context of earlier tech-led visions of the future. Grabs from Einar’s scene-setting presentation on narrative formats and research activities In my counterpointing talk, I shared my own enthusiasm for Eisner’s Dropsie Avenue and The Big City, as well as Chris Ware’s Building Stories, but also the neighbourhood amenities, media landscapes and tortured infrastructures of Judge Dredd, and the closer-to-home-in-Oslo Soft City by Pushwagner. Slides from my presentation on observing and representing We also looked at other narrative forms for conveying relationships with places, and with the interactions, infrastructures, and technologies of everyday life, from a design perspective. These example from film are well-known in these circles, almost clichés—as well as Her, Children of Men, and Mon Oncle, I mentioned La Jetée, and the breakthrough of the adaptive, hackable and contigent ‘used universe’ approach in Star Wars. A well-worn path, this, but it still tends to trigger useful discussion. Yet production designer Hannah Beachler’s work on Black Panther is particularly interesting. It conveys a place that obviously has a clear sense of advanced technology, yet positions that merely as notes within a broader palette of ideas about what future cities might be—vibrant, sustainable, regenerative, equitable, meaningful. As Allison Arieff noted, there are no cars in Wakanda, and the street life is clearly for culture, first and foremost. The highest of hi-tech sits within a diversity of technologies that includes advanced Lo-TEK infrastructures as well, all framed by ‘used universe’ sensibilities. And so tech and innovation is, appropriately, placed in a subservient position to the primacy of vibrant, meaningful, sustainable and equitable urban cultures. Slides from the presentation on observatoins and narrative formats Video games also provide rich material. Here, I mentioned the variety of ways that Sega’s Yakuza series develops a sense of place, culture and environment, through its sharp and considered interplay between everyday contexts and extraordinary narrative. Grand Theft Auto 3’s use of threaded narratives, and embedded media and soundworlds, was immediately pored over upon its release, but outside of video game circles, Yakuza is perhaps not as well-known for the endlessly inventive ways it unpicks the fictional Tokyo district of Kamurochō. The ‘open world exploring’ in the game is not so far from the ‘open world exploring’ we wanted the students to perform in the Oslo neighbourhoods around them. Yakuza’s game-world is also heavily predicated on core social infrastructures—like karaoke bars, schools, cafés, and baseball batting centre—as well as a detective’s focus on the details of mundane urban environments. Both of these aspects—the supports of social infrastructures; the beauty and utility of everyday environments—were key to the design research. As a sensibility, it recalls Walter Hood and Grace Mitchell Tada’s writing in Black Landscapes Matter (2020), which I dwell on a little more in the accompanying piece: “Activating the mundane is an opportunity to see and experience the beauty and utility of the things in our life.” Video games like Yakuza (or Breath of the Wild, for that matter) are predicated on these relationships between mundane things, infrastructures, people, place, and wider meaning, just as cities are. Perhaps they provide an interesting analogue for the practices of design research. Slides from presentation on narrative formats We also alighted on TV shows briefly, on those with an emphasis on neighbourhoods, and with culture and identity rooted in place, whilst also being fictional and evocative rather than overly literal (I mentioned Eastenders briefly, of course, as well as the following set): Neighbourhoods: Mister Rogers’ Neighborhood, Sesame Street, Pippi Långstrump, Mare of Easttown And then written narrative, whether science fiction, like The Last Children of Tokyo or The Ministry for the Future, or documentary, commentary, and non-fiction such as Michael Sorkin’s Twenty Minutes in Manhattan or Jonathan Raban’s Soft City. (Raban’s Soft City—from 1974 but still the best piece written under that now over-used title—hovers halfway between non-fiction and fiction, in a similar space to this kind of design work.) I counterpointed these with speculative narratives from strategic design projects, such as these super-short stories about Helsinki street food, or writing elsewhere, such as the Street as Platform I and II. Aside: I’d usually throw literary fiction, music, visual art and other narrative forms in there if this was an Imagining the Modern City course, from Virginia Woolf’s Mrs Dalloway to Colson Whitehead’s The Intuitionist to Cyprian Ekwensi’s Glittering City to Christos Tsiolkas’s The Slap ... (indeed, 20 years ago I curated an exhibition on just this topic.) But this was a short project within a design degree, and the focus was on observation and representation within that frame. Yet the art of 'world-building' in a film like, for example, In the Mood for Love, reveals a lot about urbanism, domestic architectures, infrastructures, communications technologies, food cultures—everything we're working with on this course. Slides from presentation on narrative fiction and non-fiction examples We would also touch on both design fiction, in various formats, such as work by Superflux and others, as well as speculative or ‘paper’ architecture, such as the old guard of Archigram, Superstudio, and Cedric Price but also contemporary practitioners like the extraordinary visions of a reimagined Brooklyn or Lagos by Olelakan Jeyifous (as discussed here). As Einar points out, however, using work of Superflux’s quality, for instance, is always a little dangerous as students are immediately and deeply drawn into it. It is often so compelling, sharp, and well-produced—yet this is not the course for that work. So we used some insights drawn from these approaches as a kind of ‘seasoning’ on the dish, rather than the dish itself. Slides from presentation on speculative design, design fiction, and ‘paper architecture’ And as well as this ‘paper architecture’ and speculative design, we also covered ‘propositional urbanism’. I described Space10’s work, particularly their neighbourhood-scale Urban Village, we paused on Rory Hyde’s retrofitted Melbourne suburbs and Framlab’s Open House proposal: Slides from presentation on narrative formats We also gave a talk on observation techniques, covering some core techniques of user research and field study and some classics of urban and architectural observation, alongside ways of seeing neighbourhoods through different lenses (physicality, multi-sensory, feminist, political, ecological, food, digital etc etc.). I also described the ‘soft eyes’ approach that frequently unlocks fruitful trajectories in strategic design practice. Below, the set of texts outlined to dip into, which is in no way an attempt at a definitive set; simply, a hopefully stimulating selection. How to study public life, Jan Gehl and Birgitte Svarre; The Social Life of Small Urban Spaces, William H. Whyte; The Death and Life of Great American Cities, Jane Jacobs; Soft City, Jonathan Raban; Soft City, David Sim; Sitopia, Carolyn Steel; Networks of New York, Ingrid Burrington; The Field Study Handbook, Jan Chipchase; Finding the Mother Tree, Suzanne Simard; The Eyes of the Skin, Juhani Pallasmaa; In Praise of Shadows, Jun’ichirō Tanizaki; What Can a Body Do?, Sara Hendren; Making Space, Matrix; Redesigning the American Dream, Dolores Hayden; Feminist City, Leslie Kern Finally, despite the name, this is not really an Oslo Futures Catalogue; it is simply an exploration of possible-future ‘everyday social infrastructures’ in some Oslo-like neighbourhoods. But in our talks and reading lists we referenced some more formal approaches to futures work—such as Scott Smith’s and Madeline Ashby’s How to Future—as good guides to broader futures work. Closer to home, I’d add in the Living Futures scenarios by Danish Design Centre; being largely text-based, they share the generative openness of that format, leaving us to figure out the material and spatial realities around their stories. In this light, Einar and I came back to the immense value in Kim Stanley Robinson’s recent novel Ministry for the Future, in that it describes what’s on the table, in terms of the visceral enormity of our challenges, but also diversity of opportunities and possible scale of societal, political and economic transformation. What it does not do is convey in tangible terms what his ultimately hopeful world vision might be like. Robinson spends time listing community organisations and meeting notes, but very rarely the qualities of urbanism, of architecture, of services or interactions, that this very different ‘living environment’ must surely entail. Unusually for a novelist, he does not dwell on what it feels like to live in these new ways, how things might actually work. He does not really dig into ways that societal values might be embodied in tangible realities: the affordances, interactions, materials, capabilities, spaces, systems, settings, architectures, and relationships of everyday life. That is arguably not the book’s ‘job’. But it is ours, as both designers and active citizens. Once again, I quoted Kieran Long’s introduction to the Public Luxury exhibition (which has become an important reference point for Einar and I, in terms of a Nordic design agenda.): “It is architecture and design’s task to give form to a societal idea (like justice) through the creation of a setting for people to encounter that idea (like a courthouse.)”—Kieran Long, introduction to Public Luxury (2018–19) As Gerry Canavan says in his review of the book, “You are the Ministry for the Future. Get back to work.” To work So with all that and more in their heads, the students were also out in the streets—walking around, taking photos, talking to locals—as well as doing documentary research, from the city’s official strategies to some historical documents. Photos by students from the course The students found a guided walk through several Oslo neighbourhoods led by Speed Architects particularly valuable. We were posi"
