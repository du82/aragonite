full_description = '''This site is archived. My latest writing, and selected cuts from the archive below, is available at Medium. — This is the personal site of Dan Hill [fuller biography below] The views expressed here are my own, and not necessarily those of my employer. Please ask if you need clarification. Some relevant starting points Below, some popular or defining posts at cityofsound. They all tend to gravitate towards recurring themes of cities, architecture, design, media and culture—often colliding in the same post, say on the imagined connections between travel writing and design, or football and architecture—but here's an attempt at filing some starters discretely nonetheless. Design practice Architecture and interaction design, via adaptation and hackability Adaptation, personalisation and self-centred design How can the design of digital surfaces help engender trust? "How the computer can help the designer", New Scientist, 1964 The New Rationalism Design. Architecture. Football Starflyer (and service), Schiphol (and soccer), Stansted (and signage) Trenitalia, travel writing and total design Insanely great, or just good enough? Towards a new architect: an interview with Carlo Ratti Soft Infrastructure Superpowers: Lift09 presentation Wi-fi structures and people shapes Post-occupancy evaluations of public wi-fi The Adaptive City The new engineering: A discussion with Arup's Tristram Carfrae Two or three recent diagrams Teaching and drawing urban sensing Sensing the immaterial city The CLOUD Sketchbook: Melbourne Smart City, for City of Melbourne/C40 Cities (incl. a note on why it's easier to crowdsource a revolution than a light-rail system) Essay: Interfaces for the unlimited dream of flying (Domus) Essay: The Garage of Small Things: nanotechnology, biomimicry and design practice (Annex) Essay: Foreword to Rory Hyde's "Future Practice: Conversations from the Edge of Architecture" Essay: Introducing SuperNormal Essay: Maginot Line, from "Dark Matter & Trojan Horses" (Strelka Press) Sketchbook: Print-on-demand work-in-progress Sketchbook: Dark Matter Essay: Dark Matter & Trojan Horses: A Strategic Design Vocabulary (Strelka Press) Essay: 21st Century Gestures Clip Art Collection Sketchbook: Domus magazine on iPad Essay: On the smart city; or, a manifesto for smart citizens instead Sketchbook: Cities Unlocked Sketchbook: Connected Streets Essay: 'Designing Finnishness', for 'Out of the Blue: the Essence and Ambition of Finnish Design' Architecture The Smithsons and adaptive architecture Daily Express building, Fleet Street Swiss Cottage Library, London Frank Gehry's MIT Stata Center, Cambridge Mass. Senate House, University of London Two possible Google Earth extensions: time and sound Flora, fauna, pixels and paper Tales of two cities imagined in music: Metropolis Shanghai and Chavez Ravine Brunswick Centre, London La Tonnara and the Chamber of Death; Arabian floating architecture in Sicily The Anti-Fun Palace: APEC Fence, Sydney lockdown Staircase, University of Technology Sydney In Every Dream Home A Heartache: The Great Australian Dream and its architecture Indiscreet music Façades: expressive, responsive, interactive The Personal Well-Tempered Environment Density, via the Weaire-Phelan structure, Holbæk Kasba and the Monaco House Joost Greenhouse, Melbourne A collaborative map of modernism in Australia 'Placemakers', and architectural scenes Barangaroo Tomason Sketchbook: Drawing The Shard's parking Essay: Foreword to Rory Hyde's "Future Practice: Conversations from the Edge of Architecture" Cities, Places and buildings New York: Seoul Survivor? Brief Notes on Seattle The Shock of the New World, with respect to the flora and fauna of Australia Punching holes in Ciutat Vella; adaptive urban form in Barcelona Urbis: Imagining The Modern City – And A New Kind Of Museum The theft of Bedford Square Close to the madding crowd (on St. Giles, London) Savile Row and tailoring urban fabric New Islington, New Hope (Manchester) Koolhaas/Balmond/Arup Serpentine Pavilion, 2006 Boston/Cambridge Diary Shanghai Diary (Please note: the Shanghai diaries were written for this blog by Justin O'Connor.) Best-laid plans for Australian garden cities and reflections on the Southern Cross Suspended at a junction in time: Australia, Silent Running, The Drowned World and the University of Queensland The View Apocalypse Sydney The city as destructive system: wildfires, Dresden and the case against urban sprawl Father of modern Brisbane The city is conceived of radial opposites Best Urban Spaces and Places Lyons House, Robin Boyd, Sydney State Library of Queensland, Brisbane, Donovan Hill Peddle Thorp, and some notes on libraries in general Sheffield and The North Writing, about Sydney In denial, on the beach, the drowned world Aerial music over Beijing Notes on Geneva. A Walk Life on Mars; #duststorm Emergent Urbanism, or 'bottom-up planning' Flood Same Old New World Cities; or, the missing vision for Australian cities; or, asking the right questions in the first place On retail Journal: 'Bullitt', 'Drive' and Walking the LA River Journal: A walk in Schöneberg, Berlin: energy policy, gentrification, protest, and the humble joys of communal flower bed Journal: Of brains and cities; neuroscience and cultures of decision-making Journal: Passport Control to Pimlico Essay: Happy Feelings at the Awakening of Finnish Spring*, Summer, Autumn / Helsinki, Spirit Level Cities, Scarry Cities and Opaque Cities Journal: Ravintolapäivä, Restaurant Day, edible urbanism and civic opportunism Essay: An edible urbanism Essay: Helsinki Street Eats (Sitra) Journal: Old and New Finnish Grammar Essay: On the smart city; or, a manifesto for smart citizens instead Essay: Ego: On masterplanning and London Essay: Clockwork City, Responsive City, Predictive City and Adjacent Incumbents Postopolis! Postopolis! LA, April 2009, days one, two, three, four and five Postopolis! NYC, June 2007, days one, two, three, four and five Policy Design Thinkbelt Industrial Policy for Creativity Hear that rain Flat rates, Flat whites "The Shinkansen to Melbourne is now boarding at Central Station, platform 27 …": A new high-speed rail network for Australia Røde, and the new manufacturing Essay: On the smart city; or, a manifesto for smart citizens instead Media Binge Watching contemporary TV Calling All Nations Movements in Modern Media Why 'Lost' is genuinely new media Ripples, or "The Social Life of a Broadcast" Assessing the new Guardian, with brief nod to the avant-garde [aka Grazia, Heat and The Sun] Work: quick review of 2005 at the BBC On podcasting itself The Fall and Rise of the Magazine Cover? iPods and the wireless Cables Games Los Angeles: Grand Theft Reality Modeling urban behaviour amidst networked ultraviolence Gangs Of New York, World-Building Journal: Watch Dogs and world creation Music Music for Films: Top 12 Appearances by Bands in Films New Musical Experiences Designing for shuffling How Devices Learn Music's Rich Facets Reviews Alan Fletcher, Design Museum Defab Stephen Gill and photographing the everyday invisible New York Changing: Revisiting Berenice Abbott's New York But Beautiful, by Geoff Dyer Jonathan Raban at London Review Bookshop Archigram, Design Museum, London "China: The Three Emperors, 1662-1795", Royal Academy, London Modernism is abroad, generally The city as exhibition HyperCard RIP 'Future City: Experiment and Utopia in Architecture 1956-2006' exhibition Barbican: This Was Tomorrow 'Zidane: A 21st Century Portrait', by Douglas Gordon and Philippe Parreno Luigi Colani exhibition, Design Museum, London +&-=X 20 years of typo-graphics from the Tokyo Type Directors Club. UTS Gallery, Sydney Houses. Kazuyo Sejima + Ryue Nishizawa. SANAA (Actar 2007) Habitus magazine The Black Swan, Nicholas Nassim Taleb "Modern Times: The untold story of modernism in Australia", Powerhouse Museum, Sydney; plus some notes on architectural exhibitions 'Network + network + network = network'. Lift09 conference, and Geneva Work and the City, Frank Duffy (2008) The Murder of Crows, Janet Cardiff and Georges Bures Miller, Biennale of Sydney 2008 'Towards the Sentient City' exhibition, New York A machine for the life between buildings: some notes on the iPad Notes on the 'next generation check-in experience' from Qantas Linked Hybrid by Steven Holl Architects, and designing for the occupation of space in contemporary Beijing Tetsuo Kondo's Suspended Ramp, Tallinn Biography for Dan Hill British. Born Zürich, 1970. Based in Stockholm. Dan Hill is Director of Strategic Design at Vinnova, the Swedish government's innovation agency. Previously, Dan was an Associate Director at Arup, the global design and engineering firm. He founded Arup Digital Studio, a multidisciplinary design team that helps clients and collaborators create great user experiences for buildings, places, infrastructure and cities, making innovative ideas tangible, and grounding them in research and prototyping. His previous leadership positions have produced innovative, influential teams and projects, ranging across built environment (Arup, Future Cities Catapult), education and research (Fabrica), government (Sitra), and media (BBC iPlayer, Monocle), each one transformed positively via new digital technology and a holistic approach to design. He has lived and worked in UK, Australia, Finland and Italy. He started his career working on the urban regeneration of Manchester, and has subsequently worked on city strategy and urban development projects worldwide, including Barangaroo in Sydney, Masdar in Abu Dhabi, Low2No in Helsinki, Melbourne’s smart city strategy, and the design strategy for the State Library of Queensland and Alphabet's Sidewalk Labs, amongst many others. Outside of built environment work, he was one of the design leads for the BBC's groundbreaking iPlayer service, and his team introduced podcasting to the BBC, amongst numerous other innovative services. Dan is an adjunct professor at RMIT University (Melbourne) in Design and Communication, and at the Faculty of Architecture at UTS (Sydney), and is the Sir Banister Fletcher Visiting Professor at the Bartlett School of Architecture for 2016, with Joseph Grima. He has taught at the Architectural Association, London, University of Sydney, Politecnico di Milano, Karlsruhe Institute of Technology, KU Leuven, and many others schools. Dan was one of the organisers of the acclaimed architecture and urbanism event Postopolis!, running in New York and Los Angeles so far, and he also writes City of Sound, generally thought of as one of the leading architecture and urbanism websites, running since 2001, as well as regularly writing for architecture and design press worldwide. Books and essays include "Dark Matter & Trojan Horses: A Strategic Design Vocabulary" (Strelka Press, 2012), "Sentient City: Ubiquitous Computing, Architecture, and the Future of Urban Space", Mark Shepard (ed.) (2011), "Best of Technology Writing 2009", Steven Berlin Johnson (ed.) (Yale University Press, 2010), and "Actions", Mirko Zardini (ed., 2008), amongst others. His writing also appears regularly in Domus' magazine, amongst others, where he curated the SuperNormal series, as well as a regular column at Dezeen. Dan is also a member of the International Academy of Digital Arts and Sciences, which selects nominees and winners for the Webby Awards, the leading honour for websites, as well as being a jury member for both Core77 and IxDA interaction awards. He was included in the inaugural list of Sydney’s ‘Creative Catalysts’ for the Vivid Sydney arts festival 2009. His design work has featured in the Istanbul Design Biennal (2012), the AAA exhibition 'Remodelling Architecture: Architectural Places – Digital Spaces' (Sydney, 2009) and 'Habitar: Bending the urban frame' (Gijon, 2010), as well as being regularly featured in global media. Work 2019—: Vinnova, Director of Strategic Design, Stockholm 2015—2018: Arup, Associate Director, London [related post] 2014—2015 Future Cities Catapult, Executive Director/Chief Design Officer, London [related post] 2012—2013: Fabrica, Chief Executive Officer, Treviso [related post] 2011—2012: Sitra, Strategic Design Lead, Helsinki. [related post] 2008—2011: Arup, Associate, Sydney. [related post] 2008: Consultant (clients included Channel 4, Lonely Planet, BBC) 2007-2008: Monocle, Director of Web and Broadcast, London/Sydney. [related post | related post] 2001-2006: BBC, Head of Interactive Technology & Design, London. [related post] 2001: Urbis Museum, Manchester. Curator/Producer (freelance) [related post] 2001: Playlouder.com, London. Design Director (freelance) 1997-2001: state51, London. Designer 1994-1997: Manchester Metropolitan University, Manchester. Researcher/Designer 1992-1994: Manchester City Council, Manchester. Senior Officer, Chief Executive's Department Education MA by research: 'Cultural Industries in the digital city', Manchester Metropolitan University (1995-1997)The research provided a snapshot of contemporary cultural change in Manchester's Northern Quarter, addressing the nascent new media design industry and other design-oriented cultural industries, urban cultures, urban regeneration models, and theoretical writing on the city. It provided practical recommendations for regeneration and intervention in this area, tied to active engagement and support for cultural businesses in the Northern Quarter. [published article | related post] BSc: Computer Science (2:1), University of Hertfordshire, (1988-1992) [related post] Presentations and events Melbourne Knowledge Week, opening speech, May 2016 Design and the City, Amsterdam, closing speech, April 2016 Architecture of Information, Leuven, April 2016 FutureEverything Singapore, May 2015 Dubai Smart City, Dubai, keynote speech, November 2013 Smart Citizens speech to Netherlands government environment ministry, November 2013 Future of design and design education public lecture, RMIT Design Hub, Melbourne, September 2013 Public sector innovation working group, speech, European Commission, Brussels, June 2013 Wired Next Fest, speech, Milan, June 2013 Digital Byliv, closing speech, Oslo, May 2013 Design spectrum series public lecture, Nelson-Atkins Museum of Art, Kansas City, May 2013 New Babylon: Architecture & Urbanism after the Crisis, Karlsruhe, speech, January 2013 Electric City, London School of Economics, speech, December 2012 SmartCityExpo, Barcelona, panel, November 2012 International New Towns conference, Rotterdam, moderator, September 2012 Trust Us, V&A conference, lecture and panel, September 2012 Public talks for Integrated Design Commission, Adelaide & Melbourne, March 2012 Social Cities of Tomorrow, Amsterdam, keynote, February 2012 Design of Understanding, London, keynote, January 2012 Cisco Public Services Summit, Oslo, workshop, December 2011 Integrated Design Commission/TACSI public lecture, Adelaide, November 2011 Creative Entrepreneurship for a Competitive Economy, Tall'''
