["https://cityofsound.com/2022/01/27/strategic-design-for-society-the-oslo-futures-catalogue-as-a-garden-of-ideas"]
title = "Strategic design for Society: the Oslo Futures Catalogue as a garden of ideas – City of Sound"
description = "Front cover and intro page to the Oslo Futures Catalogue v1, 2021The opening text from the ‘Oslo Futures Catalogue’, produced on the first ‘Strategic design for society’ course running at Oslo School of Architecture and Design (AHO), 2021Einar Sneve Martinussen and I just posted about the Strategic Design for Society course that we’ve been running at Oslo…"
full_description = "Front cover and intro page to the Oslo Futures Catalogue v1, 2021 The opening text from the ‘Oslo Futures Catalogue’, produced on the first ‘Strategic design for society’ course running at Oslo School of Architecture and Design (AHO), 2021 Einar Sneve Martinussen and I just posted about the Strategic Design for Society course that we’ve been running at Oslo School of Architecture and Design (AHO) for Masters design students. We focused on the students’ first assignment: producing an Oslo Futures Catalogue, a portfolio of ideas intended to contribute to, and counterpoint, the ongoing process of developing the city’s strategy for research, development and innovation. Download the catalogue hereYou can download a copy of the Oslo Futures Catalogue v1 (PDF) here. You can also read an accompanying ‘making of’ article on which goes into the methods taught and practices on the course, with some reflections on the students’ work. View at Medium.com It’s the first time we’ve run the course, which Einar and I taught with Ted Matthews and Aleksandra Zamarajeva Fischer, and this Oslo work was the first project on the course (the second addressed gender equity in societal planning for Karmøy municipality in western Norway—more on that later.) We wrote an introduction to the Catalogue, framing the approach to the course, and its relationship to the city’s innovation strategy. That text follows, and works not only as a primer for the Catalogue but also for the course itself. As such, you can also take it as our initial, open contribution to the emerging set of academic courses beginning to coherently address strategic design theory and practice. This course continues the work started a few years ago, with events like Digital Skølråderett and the student-produced book TRUST IS WORK, coming from Einar’s teaching and research exploring design for a digital Nordic welfare society. We also wanted to directly address ‘innovation’, an awkward and unhelpful word that is often used lazily, sometimes duplicitously, and generally narrowly. By pulling the question of innovation into the richness of everyday life, drawing from a sociological perspective as well as urbanistic, the students could explore perspectives that were both open and grounded, placing technology and economy into the broader context of urban culture. This project was designed as a contribution to Oslo’s official innovation strategy, which was being developed in parallel by the city with assistance from D-Box, AHO, Rambøll and Halogen. The students explored and challenged the municipality’s existing societal plans and strategies through design, and presented their portfolios of ideas to senior municipal staff leading strategy, but we kept the work at arm’s length on purpose, building a creative buffer from the formal process. Yet—spoiler alert—it is fair to say that the students’ insights and contributions have been hugely appreciated by the municipality, and it will hopefully contribute to reframing aspects of the policy’s development. Getting that relationship right is important: close, but also at a distance. Einar and I both believe that learning concerns practice, and that practice requires the constraints and possibilities of working with a ‘real world’ context, like a municipality and the work done in policy development. Being able to position the university close to the city in this way can be hugely beneficial all round. Amongst other things, universities are places that can both hold the public discussion about the future, and help shape it. “Architects and planners, whether they design buildings, or recommend policy, are involved in doing. Therefore architectural and planning education requires training for doing.” — Denise Scott-Brown We also try to be clear about what we talk about when we talk about infrastructure, building on some of the thinking I was outlining in my Slowdown Papers, positioned squarely in the context of social infrastructure, following Eric Klinenberg, Debbie Chachra, and many others. (There’s an emerging list of social infrastructures in the text below, co-produced with the students, which we’ll update, refine, and illustrate over time.) Example spreads from the ‘What is?’ glimpses in the Catalogue In all this, we were drawn to Welsh sociologist Raymond William’s Keywords (1978) as a way of pacing out a wider territory, immediately looking to diversify the terrain that innovation strategies tend to reside in. Rather than sitting in the box that ‘technology’ is generally stuffed into, or myopically pursuing the last century’s economic growth logics, or being constrained by a disciplinary logic, this meant we could put urban culture to the fore. We could imagine an array of words, laid out over the eight weeks, and serving as prompts for a variety of questions. This allows a kind of kaleidoscopic interpretation of the subject, whilst nurturing a critical sensibility for everyday words about everyday life. So these ‘keywords’ might include themes like innovation, infrastructure, technology, and some strategic design principles, like prototyping or Trojan Horses. But they would also include spatial organising principles like garden, block, city, or political structures or social concepts like municipality, community, rights, as well as cultural patterns, rituals or perspectives, like care, participation, celebration, hopes. This melange of keywords enabled us to explore many different angles on the patches of ground and clusters of community that we call ‘neighbourhoods’. We chose neighbourhood precisely to be able to bring these questions to ground. This would give the students a scale they could engage with directly, whilst remaining ‘complex enough’, hovering in the space between buildings and city. It also links neatly to the Oslo Architecture Triennial 2022 and its Mission Neighbourhood, with which we are also happily implicated. (We could also elide some of Williams other works with Lefebvre, who will be referenced below. As I’ve written elsewhere, Williams’s sense that ‘the everyday’ is constructed just as art is conjured is a powerful idea to work through with architecture and design students. In The Long Revolution (1961), Williams writes: “Everything we see and do, the whole structure of our relationships and institutions, depends, finally, on an effort of learning, description and communication. We create our human world as we have thought of art being created.”) Example spreads from the ‘What is?’ glimpses in the Catalogue The course format was, loosely, a day of lecture, seminar and discussion oriented around one of these ‘keywords’. More details below, and in this accompanying post which covers the framing that the lectures and discussions lent to the practical studio work. The rest of the week was studio time in which students could develop ideas for the Oslo project, with an emphasis on the generation of diverse array of ideas, seeding ‘a garden of possibilities’ rather than focusing in on one or two interventions. (Covid-19 hit the possibility of true studio time, unfortunately, but the students worked hard to overcome this.) Students work in pairs or small groups as design is a team sport, an intrinsically collaborative discipline. We had several external contributors in addition to the teaching team of Einar, Aleksandra, Ted and me, as the accompanying ‘making of’ post describes, including guided walks and field research. In all of this, as Master of Design students, the teams were able to move from analysis to synthesis, from keywords to imagery, from insights to concepts—in the language of the Catalogue: from What is? to What if? Given the short time frame, the range of ideas and the verve and richness with which they are produced is a delight to see—again, as the ‘seeds’ of ideas, to be developed. Some examples of ‘What if?’ from the Oslo Futures Catalogue As with any first run of a course, one discovers numerous things to do differently next time. More to follow on that. We want to lift questions of urban technology more, for instance. We put this on the table at the start, but it was not really picked up—which is not a criticism of the students, to be clear. To see, as the text states below, that a shared autonomous ferry, for example, can now be understand as social infrastructure just as a shared garden or community library might be, with the dynamics of distributed technologies unlocking entirely new modes of ownership and operations requires a reframing of infrastructure just as much as a more nuanced understanding of technology than is commonly used in this context. We will also want to dig further into questions of value—particularly with municipalities like Oslo Kommune in mind, who will need different models, outside of traditional Nordic procurement cultures, for undertanding value in a more holistic sense: flipping maintenance into care, for instance, or liability becoming learning. As well as Mariana Mazzucato’s rethinking of value at the macro scale, the recent work of my long-time colleague Justin O’Connor at the University of South Australia, looking at the entanglement of culture and economy, culture and everyday life, and the new possibilities in ‘foundational economies’, maps onto the interests outlined here, concerning the social and cultural infrastructures of everyday life in the city.) But equally, AHO is the Oslo School of Architecture and Design, and when the course runs next time we want to dig further into the productive, contested space of that ‘and’ between architecture and design. There is another version of the following text, which begins to more thoroughly explore what’s happening in this third space between architecture and design (a perhaps distracting enquiry that few outside of these fields may care about, to the extent that it sometimes has me recalling the lovely put-down: “Like two bald men fighting over a comb.”) We realise that taking final year students from a degree based in service design, interaction design, industrial design, and systems-oriented design, and then setting the controls for the heart of The City, without moving through several years of architecture and planning, would have both advantages and disadvantages. In a sense, we are working with urbanism as a perspective and practice, recalling Keller Easterling’s apt description of the urbanist as having almost a ‘canine mind’ or sensibility, concerned with observing and addressing the relationships between things in the city, their very disposition. You’ll see the reference below. This relational approach maps onto our understanding of infrastructures, as the connective tissues beneath and between other structures, and of neighbourhoods themselves, as assemblages of relationships; fixed and dynamic, material and ephemeral, social and political. It also places everyday life squarely in the frame. Design’s facility with field research, user research, prototyping, and everyday touchpoints, as well as being attuned to social relationships, organisational contexts, and political and economic structures, has much to offer architecture. But equally, there are, of course, significant issues that emerge if architecture’s depth and breadth, as well as aesthetic and spatial sensibilities, are not present and active. Above all, it is architecture’s ethical responsibility for the city that the public context of strategic design must bring to the fore. We see these futures catalogues as ‘gardens of ideas’, as they are more akin to seed banks than design specifications. They require, or even demand, tilling the soil, cultivating, companion planting, nurturing, harvesting, propagating, using. As we discussed with the students, the idea of the shared garden, whether in the city or elsewhere, is both everyday and radical, literal and metaphorical, formal and informal, as we can see in the thoughts and practice of Rebecca Solnit, Jamaica Kincaid, Ron Finley, Leon van Schaik, Masanobu Fukuoka, Walter Hood and Grace Mitchell Tada, Linda Tegg, Emma Marriss, Julian Raxworthy, Dan Pearson, Derek Jarman, Robin Wall Kimmerer, and indeed Solnit’s recent book on George Orwell’s gardening. This was a quick attempt at a first planting, by a talented group of students. Let’s see what sprouts, and what new gardens to plot out next. Teachers: Einar Sneve Martinussen, Dan Hill, Ted Matthews and Aleksandra Zamarajeva Fischer. Students: Pernille Hartvigsen, Cornelia Schmitt, Kamilla Bedin, Herman Freng Billett, Kristin Mar!e Brudeseth, Johanna Sofie Brämersson, Tina Mee Johnsen, Sigrid Løvlie, Nikolai Sabel, Åse Lilly Salamonsen, Lisa Siegel, Elizabeth Bjelke Stein, Glenn Sæstad, Mats Georg Syvertsen Søfting, Sofie Finnøy Vestøl & Anna Malene Vik. Download: Oslo Futures Catalogue v1 (PDF) (the text in the Catalogue is an instinctive mix of English and Norwegian! But translate tools work quite well.) What follows is the essay that opens the Catalogue, and frames the approach to the course and the work within: Exploring Oslo’s innovation strategy through design The Oslo Futures Catalogue is a collection of observations and propositions describing possible futures for neighbourhood life in a more innovative Oslo, created by design students on the Strategic Design for Society course at the Oslo School of Architecture and Design (AHO). The Catalogue comprises a collection of ‘What is?’ observations drawn from explorations of everyday life in some of today’s Oslo neighbourhoods, from which a set of ‘What if?’ propositions have been invented or uncovered. These are imagined as possible urban futures, and articulated as a portfolio of new or alternative social infrastructures at the neighbourhood scale. The Catalogue dwells on ‘the everyday’ in these neighbourhoods, both real and imagined, in order to help ground Oslo’s strategy for innovation in the soft city we all inhabit and co-create. This helps place innovation, whether technical or social, in the context of the lived city, its nature and human nature, its politics and places, its constraints and possibilities, its histories and futures. Although no more than a start, we hope that it complements, enriches, and extends how Oslo can think about innovation in meaningful and actionable ways.— Dan Hill and Einar Sneve Martinussen In the Autumn of 2021 AHO and D-Box — the National Centre for Transforming Public Services, together with Rambøll and Halogen, ran a project for the Oslo municipality about developing a strategy for research, development and innovation. To complement this project, AHO ran an experimental, practice-based design research process, which produced both insights and propositions exploring the idea of the innovative Oslo neighbourhood. The outcome of this process is the Oslo Futures Catalogue (PDF), which can be understood as a creative, explorative complement to the work being conducted by the city, and its consultants Rambøll, Halogen and D-Box. It looks to offer up different thought"
