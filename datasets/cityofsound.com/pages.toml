description = "More incredible 'bootlegs' emerge (confusing name for those of us 25+, where 'bootleg' = illegally recording a gig). This meta-genre arguably includes The Avalanches' Ibiza mix but definitely two great Osymyso mixes doing the rounds - one makes the best pub quiz question ever; the other more dance-oriented (findable via AudioGalaxy). Best of all are…"
full_description = "More incredible 'bootlegs' emerge (confusing name for those of us 25+, where 'bootleg' = illegally recording a gig). This meta-genre arguably includes The Avalanches' Ibiza mix but definitely two great Osymyso mixes doing the rounds – one makes the best pub quiz question ever; the other more dance-oriented (findable via AudioGalaxy). Best of all are the Strokes/Aquilera hybrid and Destiny's Child vs. Nirvana (conjuring a mental image of a supergroup way harder than Blind Faith – bootylicious grunge). <pseud's corner> I really think this could develop into a genuinely 21stC artform … going way beyond the DJ mix and creating entirely new metamusic out of fragments isolated and recombined through software … a parasite music, preying on the feast of sounds colliding in the infosphere. It's more than just an audacious mixup; you'd need 8+ decks to realise what, say, Osymyso does (more DJ Octopus than Dr. Octogan?). But it's beyond that – it's studio-based editing, timestretching and pitchshifting through software, having stripped out vocal and backing tracks. New music, not new performance. Truly recombinant sound architecture. (That's enough recombining. Ed.) </pseud's corner> Share this:TwitterFacebookLike Loading…"
