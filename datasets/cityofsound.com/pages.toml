title = "Small vehicles of Tokyo – City of Sound"
description = "A slim cataloguing of the rich diversity of small vehicles that help shape street life in the world’s largest city Unusually for me, this is a post with little in the way of context. Rather, it is simple, recorded observation. As part of an endless enquiry into what makes good streets tick, over four short visits…"
full_description = "A slim cataloguing of the rich diversity of small vehicles that help shape street life in the world’s largest city Unusually for me, this is a post with little in the way of context. Rather, it is simple, recorded observation. As part of an endless enquiry into what makes good streets tick, over four short visits to Tokyo in 2018 and 2019—during The Days In Which We Flew—I started cataloguing ‘the small vehicles of Tokyo’, recognising them as an ingredient of the city’s beguiling street condition. The kind of Tokyo neighbourhood street I’m talking about. What you see is partly unlocked by what you can barely see. I’ve written enough about walking around the city’s neighbourhoods (Ed. Really?) What follows is a quick sampling of a hugely diverse range of small vehicles—the tip of the tip of the iceberg—that also contribute to the quality of the city’s streets. I’ll no doubt update it with each subsequent trip I take. It’s like a version of Richard Scarry’s Cars and Trucks and Things That Go, but with an emphasis on the Things That Go rather than the Cars and Trucks. And set in Tokyo. Imagine the drivers as tanuki rather than cats and dogs. When visiting Tokyo, if you are attuned to eating the world with your eyes and particularly the layers of urban life bigger than a cellphone and smaller than a building, one of the first things you’ll notice is how comparatively small the vehicles seem to be. Then, the sheer variety of these small vehicles. And then, how these vehicles, by virtue of their humble and appropriate scale and speed, help produce the city’s often delightfully humane streets. And then finally, that these small vehicles are scurrying around the world’s largest city. By way of comparison, the municipal and commercial vehicles blasting around Manhattan, for example, are more like hulking tanks, built for battle, apparently ready to face off against the army of gargantuan SUVs contesting the same spaces. But in Tokyo, a city three times larger, the small scale of the vehicles makes instinctive sense. I’ve written before about how Tokyo is actually defined by smallness and slowness, drawing from the great work of Keio University’s Darko Radovic and Davisi Boontharm, amongst others. View at Medium.com A touch of dark matter before the matter I’ve also written about the interplay between Tokyo’s mobility and urban form, generally, as well as touching on the social and cultural overlay that further supports the street as a public space — whether relating to shared privacy, or communal understanding. Helped by the fact that on-street parking in Japan has essentially been outlawed since 1963, Tokyo’s neighbourhood streets tend to be narrow and slow, and distinctly humane as a result. These on-street parking restrictions are accompanied by proof-of-parking laws, in which prospective car owners have to prove to the police they have off-street parking sorted before purchase: “It is almost unique to Japan, although a few other limited trials have been made in other countries. In order to register a car, you now needed to provide proof to the local police that you had somewhere to park it. If you had a garage at your home, the police would come to inspect it: the other main option was leasing a parking space from a private off-street parking lot in the neighbourhood around your home, and you could provide a copy of the lease agreement as proof. Only once this was done and you had your shako shōmeisho (literally, “garage certificate”) would you be allowed to take possession of the car.” —What would a free market for parking look like? It’d look a lot like Japan, Stephen Davis (2018) Finally, Tokyo benefits from extensive and reliable public transport by train, subway and bus. All of these aspects combine to produce living streets, as a kind of see-saw counterpoint, as well as an endlessly inventive approach to off-street parking, with vehicles of all sizes slid into spaces of all sizes. As well as a helpful scale, there’s a slow-ness to these vehicles, obviously, which keeps the streets slow in turn. It’s quite separated from the cars and trucks overhead on the elevated freeways, as if the upper plane is all Akira and the ground plane is all Kiki’s Delivery Service. Many cities have tried this separation, but in Tokyo it works, as the separation is enforced by keeping the streets defined around people—a condition that both law and the presence of people themselves seem to reinforce—and the fact that these are human-scale vehicles moving at human speeds. Caveats Here’s a current set, more or less in XS-S-M-L-XL order. Note, I’m not capturing e-scooters (they were not really around en masse when I last visited Tokyo in 2018 and 2019, though I briefly discuss them below), nor niche products like hoverboards, Segways etc. I’m more interested in the humble everyday workhorses that characterise the streets. We will no doubt need to start cataloguing other small autonomous vehicles as they emerge into the streets, as per my colleague Bryan Boyer’s urban robot survey from his courses at UMich. But the framing of these existing ‘things’ below may help position those new ‘things’, such that the quality of the street itself continues to be the guiding outcome. And in comparison to a survey or catalogue, which would look to examine and compare these typologies via technical details, this is purely photographic exploration, drawn from direct observation. Unlike true field research, including participant observation where one would work as a courier or taxi driver for a while, this is simply observations of things in places at face value. But cultivating a practice of everyday noticing and thinking is equally important, I would argue, as it triggers a constant, ongoing reflection about things and places that can be practiced everyday, and by most people. Here we go… Logistics trolleys Immediately, the Tokyo difference is clear when we compare how on-street deliveries are handled, particularly with cities under the onslaught of e-commerce, adding to the enormous quantities of goods moving through shops, offices, bars and restaurants in the city. Although these mobility technologies wax and wane, compared to the waves of FedEx, UPS, Amazon etc. trucks now occupying North American and European cities, the last-kilometres of delivery in Tokyo are often handled with simple trolleys, pushed—sometimes with a little tiny-motorised help—by people. The vehicles effectively follow a swarm model, which I often describe as akin to ‘packet-switched logistics networks’, as large volumes are broken down into smaller units as they approach their destination. The presence of these vehicles—entirely humble, practical and of course highly sustainable, yet unobtrusive, with little or no ornamentation or expression (save the iconic and ubiquitous Yamato logo)—leaves the street open in a way that trucks simply cannot. In that, it’s a remarkably generous way to get things done. In comparison to the large footprint of deploying a truck-based system at street level, this is an approach to logistics which produces space, almost standing for an absence of matter. I’d be interested in understanding more about the regulatory or commercial ‘dark matter’ involved in ensuring this system, but at the same time, suspect that it could equally be an implicit outcome of a culture subtly attuned to qualities of hierarchy, politeness, transience, and communality. Cart pushed in front of Kengo Kuma’s SunnyHills Cake Shop, featuring the jigoku-gumi (‘interlocking hell’) wooden joint technique The yellow and black Yamato logo must be one of the more ubiquitous symbols across Japanese streets This guy was jogging the trolley through Kamata backstreets, near Moriyama House Sometimes the ‘driver’ is hidden behind boxes, and you just see the trolley trundling up the street. A precursor to automated trolleys? I hope not. A very different delivery, in a very different delivery trolley Imagine this scene with a FedEx truck in it instead. How much of the building, street and plant-life would be covered? Bikes Bikes feel like they’re actually everywhere, despite Tokyo hardly being set up for cycling like an Amsterdam or Copenhagen. In fact, as the excellent Tokyo by Bike site makes abundantly clear, there is a deeply problematic “lack of commitment to providing the quality cycling infrastructure that Japanese cities deserve.” The author, Byron Kidd, repeatedly skewers the city government for making little or no effort to support cycling—and yet Tokyo often rides relatively high in the Copenhagenize ‘bicycle-friendly cities’ ranking, and cycling is relatively safe, accessible, and highly popular. “How did Tokyo, a city making little, if any, progress towards becoming bicycle friendly, without leaders who acknowledge cycling’s unique place in the cities transportation network and seemingly without a comprehensive infrastructure plan that would bring safe, continuous and consistent cycling infrastructure to the Greater Tokyo Metropolitan Area achieve such a high ranking against literally hundreds of cities where cycling is being actively supported?” —Tokyo Ranked 16th Bicycle-friendly City in 2019, Byron Kidd, Tokyo By Bike To some extent, this institutional negligence is in line with Tokyo being effectively an unplanned, even un-plannable, city—as described in Koh Kitayama’s wonderful Tokyo Metabolizing, which I unpack a little here. That does not mean that the bike should not be planned for; just that it requires a particular approach, quite different to building Copenhagen bike lanes or Oslo bike-share. Kitayama describes the metabolism guiding Tokyo’s development, rather than a plan. “On a macroscopic level, there seems to be an invisible system, which, while incorporating numerous distinct concepts, provides an optimal solution.” —Koh Kitayama, Tokyo Metabolizing (2010) A small thing like a bike will thrive in a metabolism, yet could be suffocated by a plan. As Kidd notes, Tokyo’s relative ‘success’ in those Copenhagenize rankings is nothing to do with far-sighted government support and everything to do with people, and the bike as near-perfect everyday infrastructure. Building a supporting infrastructure of everyday dignity for bikes would not be hard; in fact, it would be working with the grain of the city. Some of the conditions that would favour bikes—for instance, the lack of on-street parking noted above—inadvertently produces positive effects within this metabolism. As a result, the warrens of small streets that define Tokyo neighbourhoods, clear of parking and often bereft of significant car traffic, turn out to be near-perfect conditions for cycling. Given the size of the city, with a mode-share for cycling of around 14% (noting that Tokyo’s incredibly effective public transport will always take the lion’s share of all mobility in the city) that means the numbers of cyclists are extraordinary. And if you walk these side-streets, bikes feel the dominant mode, outside of walking. There’s such a pleasingly diverse array of bikes around nonetheless. Perhaps it’s so appealing due to the counterpoint between the often humble, small yet well-maintained bikes and the scale of the city around. And perhaps implicitly, this suggests another counterpoint: the broader everyday resilience and inventiveness that Kidd points to, in the face of little or no coherent government guidance and support. Cycling here works because of the city of Tokyo, meaning its people and its sense of place, rather than the city of Tokyo as an administrative unit and a jurisdiction. Bikes, Tokyo — OK, one or two of those are Kyoto, where many of the conditions are similar (2018–19) Mamachari There is a particularly distinctive type of bike you see in Japanese cities, and all over Tokyo: the mamachari. Byron Kidd again: “The mamachari is a cultural icon, it’s the Japanese equivalent of the family station wagon. Its the family workhorse used on shopping runs, for riding to the local station, taking the kids to school or picking them up from sports practice. Without it families around the country would be in a right pickle. The defining features include, a top tube bent low that is easy to step over, a shopping basket on the front, a luggage rack on the back, mudguards, chain guards, dynamo lights, an integrated lock, a bell and a hefty rear stand that keeps the bike stable and upright when parked.” —Introducing the Mamachari, Byron Kidd, Tokyo By Bike The gendered language in the name might need a bit of work, translating more or less as “Mum’s bike” — though as this articles, they are heavily used by everyone. Either way, it’s a wonderfully practical, humble everyday bike, for carrying shopping, kids, or pretty much anything else. The lower centre-of-gravity and long frame is quite different to the archetypal European ‘sit-up’ city bikes. It is no low-rider, but it has a gawky charm, as well as the practicality of loading up the front and back, and incredibly easy access. A few examples of ‘mamachari’, Tokyo 2018–19 As with cars—see below—bikes are parked in every possible nook, slid into gaps and sidling up alongside façades, again ensuring the street, or passageway, is left clear and open. They often become part of the informal assemblages of objects—plants, storage boxes, chairs, signs, stools, air conditioning units—that line the property boundaries of buildings. Being Japan, there are of course hi-tech commercial services for bike parking, like these well-publicised underground bike parking ‘robots’, but I’m more interested in the informal adaptive design of the following approaches. Bike parking, Tokyo (last one actually Kyoto, outside a really excellent ‘better than France’ French-style café) 2018–19 Aside: It’ll be interesting to see what happens with scooters here, once they are added to the mix, given the travails elsewhere about their parking in public life. The lack of a meaningful culture of care for the street — civic or collective — has meant that the public parking of shared scooters in North America and Europe has caused chaos, frustration and anger in roughly equal measure to joy, vitality and freedom of movement. I would argue that this is partly because most city authorities have shown little initiative in terms of creating parking infrastructure, or even having constructive discussions with scooter services (which is quite different to their response to a much greater nuisance, that of privately-owned cars.) And it is partly due to the scooter startups following the wrong technology models i.e. blitzscaling (though in my experience, having spent days and weeks working with some of them, many want to solve the problem rather progressively, and would loved to have done so before it became a problem!) And it is partly due to highly individualised social and political norms playing out on pavements (Or, the 'why we can't have nice things' argument.) In Tokyo, one can imagine scooters being "
