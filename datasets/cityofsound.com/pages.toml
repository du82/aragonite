["https://cityofsound.com/2021/09/01/working-with-brian-eno-on-design-principles-for-streets"]
title = "Working with Brian Eno on design principles for streets – City of Sound"
description = "Brian Eno’s principles for the One-Minute City projects initiated by Vinnova, laid out as an A5 double-page spread in the playbook ‘Designing Missions’ (Hill, 2021)Bringing a cultural voice into an urban planning conversation that has become narrowly technical, and diversifying the thinking around what streets are about, and what cities are forPlanning, designing, and managing cities in…"
full_description = "Brian Eno’s principles for the One-Minute City projects initiated by Vinnova, laid out as an A5 double-page spread in the playbook ‘Designing Missions’ (Hill, 2021) Bringing a cultural voice into an urban planning conversation that has become narrowly technical, and diversifying the thinking around what streets are about, and what cities are for Planning, designing, and managing cities in Sweden can be a largely joyless, technocratic affair, dominated by efficiency-oriented engineering, economic and managerial sensibilities. Although the Swedish state continues to fund arts and culture at a level that would make many other countries green with envy, it tends to keep those practices and perspectives quite separate from questions of city planning, governance, and even design. This is far from unusual, of course, but it is perhaps heightened in the highly pragmatic Nordic countries, their governance cultures reconstituted for New Public Management. So one of the many ideas I wanted to test within the One-Minute City street retrofit projects I’ve been leading in Sweden was how we might deliberately counterpoint those sensibilities, enriching the mental models that shape how cities are handled with other thoughts, other questions, other positions, offering a richer diversity of outcomes. If we were to do so, perhaps we might be able to explicitly recognise that, essentially, the whole point of cities is culture, not efficiency—at least ‘culture’ in the multiple senses that Raymond Williams described: processes of intellectual, spiritual and aesthetic development; particular ways of life, or patterns of living; and practices of cultural production, embodying and articulating what we stand for as society. And if we recognise that streets are the basic unit of cities, then they must be about culture too; they convey what we stand for. This simple repositioning means that engineering and traffic planning sensibilities are recognised as being necessary enablers—but they are clearly not the point. This means decision-making around streets can be realigned around more meaningful questions: such as What is a good street? And who for?, rather than the crudely damaging How might this thoroughfare best accommodate 1000 vehicles per day? In other words, strategic design involves changing the mental models that are used to frame the question of the street, redesigning the conditions that produce the street. There are numerous good technical guides to designing streets (my colleagues here in Sweden, Spacescape, do great work in this respect, including a ‘Street Functionality Index’ we’re working with; NACTO’s work internationally, albeit showing its roots in transport rather than public space or culture, is generally moving in good directions.) There are many brilliant landscape designers out there who could handle such an environment—and incidentally, it feels like landscape architecture, having been unfairly downplayed for decades, perhaps for obvious if unfortunate reasons, may increasingly be the most important strand of architecture moving forward, for those same reasons, reversed (maybe another post for another day). And there are many shining examples, like the well-known Dutch woonerfs, or learning from informal urban environments, or indeed the hundreds of programmes moved into place under Covid-19, which I partly collated here. Any decent urban designer and landscape architect could do the technical work of transforming a street into something more like a garden, or truly diverse yet shared urban space. The challenge is that they are rarely given the chance, as the way that city governments imagine streets has become stunted, blinkered by narrow sets of vested powers. So it is a problem of cultural imagination—it is that kind of design problem. So as well as drawing from the work of Michael Sorkin, Saskia Sassen, Jay Pitter, Richard Sennett, Jane Jacobs, Liza Fior and many others, as well as my own observations and experience, I wanted to introduce an entirely different kind of voice into discussion of the street—someone whose cultural standing couldn’t be ignored, but who wouldn’t usually be considered at all in this context. So I asked the artist and musician Brian Eno if he could kindly contribute some design principles for us. (For those that don’t know Eno’s work, he is one of the most important and influential artists, musicians and thinkers of the last half-century. And regarding my opening paragraphs and this desire to pull in culture, it’s worth noting that Brian has also—perhaps implicitly— pursued a sharper, more inventive and informed approach to tech than most, as music often describes the potential of an interplay of technology and culture, just as cities are the product of culture, nature and tech.) I’d got to know Brian a little in recent years, via my UCL work and at conferences, and I felt that I could ask him for a favour. He’s been a guiding light in my thinking and work for decades, and I knew he would have an angle or two. We’d previously joined forces briefly to add some richness to the thinking around mobility in the UK’s industrial strategy, and we’d also chatted a little about cities, and particularly London mews houses, communal waste collection and shared gardens, at the DECODE conference in Turin in 2019 (back in The Days of Flying). After I’d explained the project a little, Brian very kindly sent back the following list of lovely, useful, thought-provoking and insightful principles, along with some typically humble and graceful comments. Several of the principles were immediately useful, and put straight into practice; they either reinforced an earlier thought or opened up entirely new vistas. Several others are unfurling as we go. A few more are more broadly relevant, well beyond our street-oriented agenda. Here they are: Brian Eno’s design principles for the streets mission Think like a gardener, not an architect:design beginnings, not endings Unfinished = fertile Artists are to cities what worms are to soil. A city’s waste should be on public display. Make places that are easy for people to change and adapt(wood and plaster, as opposed to steel and concrete.) Places which accommodate the very young and the very oldare loved by everybody else too. Low rent = high life Make places for people to look at each other, to show off to each other. Shared public space is the crucible of community. A really smart city is the one that harnessesthe intelligence and creativity of its inhabitants. Principles, in principle The best design principles should have a sense of direction, accumulating to a clear sensibility and ethos—they must stand for something, greater than the sum of their parts—yet they should also be open, diverse and with more than a little wiggle room. They are supposed to be generative rather than constraining. They ought to immediately suggest patterns of thought and action, ways of being, even priorities. They should conjure images or environments as you reflect on them—yet also be a little oblique, capable of working as intuition pumps. They should reward close attention, interrogation and reinterpretation. We have official sets of technical street design guidelines in Sweden, of course, but they are mainly used to preserve in asphalt yesterday’s idea of what a street is. They do not help understanding of what streets really are, and what they can be. In contrast, and to their great merit, Eno’s principles are not technocratic in the slightest, even if they address questions of technology. As we move into phase two of Street Moves, learning from the successes and failures of the first phase, I thought I’d share how I interpreted, and continue to interpret, Eno’s suggested principles. Yet the way they’re written allows for ongoing adaptation, like an endlessly tasty smörgåsbord one constantly wants to return to. Think like a gardener, not an architect:design beginnings, not endings As I suggested in my Slowdown Papers last year, referring to work by Linda Tegg, Derek Jarman, Ron Finley, Emma Marriss, and others, the practices of gardening provide our most fruitful metaphorical terrain: the slower dynamic of organic growth; the sensibility of care, attention and cultivation; its regenerative potential; embodying systems and ecosystems, as well as cultural expression and social justice; the understanding that a garden can be planned, yet not controlled, and a thousand other things. I’m currently reading Leon Van Schaik’s new book Doing, Seeing; Seeing, Doing, describing a lifetime of gardening and learning, architecture and urbanism, which only reaffirms my thoughts, as does Nadine Olonetzky’s Inspirations: Time travel through garden history. The great Spanish garden designer Fernando Caruncho, subject of a new Rizzoli monograph, says “For me, plotting gardens is an ancestral rite that man (sic) repeats over and over … It’s an intimate and secret desire to give meaning to his own life. By transforming ‘place’ he seeks to understand that he is part of the cosmos and not alone before either history or the mystery of creation … A garden is where man recovers his whole being,” Caruncho, Olonetzky, Van Schaik So this first principle suggests an entire body of practice—in fact a way of being—in those first four words: “Think like a gardener”. Regarding the next three words, there are of course many architects who think precisely like this, and would like to act like it, too. Yet there are arguably many more architects who do not, in addition to a business model that traps much architectural practice. So, fair cop. As with a garden, the principle of setting off in a clear direction or set of ideas, spatial, material and otherwise, yet not being overly concerned with the idea of An Ending, seems entirely right. A street cannot be finished, any more than a garden can be. Both require initiation, and then ongoing engagement, “repeating over and over”, as Caruncho says. This thinking also informed my contribution to NESTA’s Rethinking Parks programme last year, in which I called for the end of parks—by beginning parks everywhere, turning streets into parks into gardens. The suggestion to ‘end parks’ is only half-serious—a good urban park is a thing to behold, and I do not really want to lose our grand botanic gardens or our small pockets of recreation ground. But it is half-serious. The grand civic park as lung of the city actually allows the rest of the place off the hook, whilst simultaneously outsourcing nature to a parks department, rather than a shared activity. Yet by turning every street into a park-like condition, but crucially as a shared garden, we unlock a different kind of city, a different relationship with biodiversity that must be direct, communal and shared—not ‘managed’, as with an outsourced process, but collectively designed and tended, as with a community garden. Shared gardening in shared streets also implies engagement, participation, negotiation, and responsible shared ownership, which is core to the One-Minute City idea: that the space outside your front door is yours, as a citizen—even if it is not exclusively yours. It is the space you and your neighbours have an intimate relationship with, and can reasonably take ownership of, as long as this is not the exclusion of other uses, and ideally supports a diversity of other uses in the street. Hence the allusion to gardening, with its sense of contingency, interaction, negotiation, complexity, shared responsibility, companion planting by companions, and ongoing engagement. This begins to suggest a garden-centred design of the city. Ed. See also this follow-up, suggesting a ‘find-and-replace’ of streets for gardens across our cities, inspired by Holger Blom’s 1946 principles for Stockholm. As Jamaica Kincaid puts it, describing her own early epiphany, ‘thinking like a gardener’ means thinking about shared ownership of the city, about shared food, about shared identity, in shared spaces: “Wherever I lived in my young years, in New York City in particular, I planted: marigolds, portulaca, herbs for cooking, petunias, and other things that were familiar to me, all reminding me of my mother, the place I came from. Those first plants were in pots and lived on the roof of a diner that served only breakfast and lunch, in a dilapidated building at 284 Hudson Street, whose ownership was uncertain, which is the fate of us all. Ownership of ourselves and of the ground on which we walk, ownership of the other beings with whom we share this and see that it is good, and ownership of the vegetable kingdom are all uncertain, too. Nevertheless, in the garden, we perform the act of possessing.” This ‘gardener, not architect’ principle is actually one of Eno’s longer-standing ideas. I believe it even features in his Oblique Strategies cards from 1975, simply as ‘Gardening, not Architecture’, and a couple of decades later, he described the possibility of generative music using the metaphor of gardens. “Thinking about gardens, and about why we like gardens, has been a fruitful tangent for me. People tend to imagine that making art is like making architecture — that you have a ‘plan’ or a ‘vision’ in mind before you start and then you set about making it. But my feeling is that making art can be more usefully thought of as being like gardening: you plant a few seeds and then start watching what happens between them, how they come to life and how they interact. It doesn’t mean there’s no plan at all, but that the process of making is a process of you interacting with the object, and letting it set the pace. This approach is sometimes called ‘procedural’. I call it ‘generative’. Just as a garden is different every year, a piece of generative art might also be different each time you see or hear it. The implication of this is that such a work is never really finished — there is never a final state.”—From Brian Eno’s notes on his Sonic Garden installation for Serpentine Gallery Perhaps like Brian, I see that cities are analogous to music in many ways, making sense on their own terms rather than being reducible. Just as gardening is both literal suggestion and metaphorical allusion. This imperative—beginnings, not endings—led to another core design principle in my Designing Missions playbook: the Half-Step. With transformation of streets in mind, the Street Moves kit is no more than a half-step—perhaps even a quarter-step—towards the true transformation required. It is a kind of benevolent insurgency force, moving into streets, parking space by parking space, enabling residents and users of the street to explore what they want to do with it. It is not the end, but the start. At some point, ideally soon, trees will need to put roots in the ground, not live in a box. We’ll need to devote the central road space to micromobility and other needs and desires, rather than mutually-excluding cars. But it’s too hard to jump to that in one go. Given their rela"
