title = "Thoughts on a New European Bauhaus – City of Sound"
description = "Image made for the front cover, based on a photo of ‘Infield’, an installation by Linda Tegg at ArkDes, comprising a biodiverse meadowland planted in the asphalt car park by the entrance to the museum and accumulating life throughout 2020, and framed by geometrical shapes drawn from a Herbert Bayer postcard for the original Bauhaus…"
full_description = "Image made for the front cover, based on a photo of ‘Infield’, an installation by Linda Tegg at ArkDes, comprising a biodiverse meadowland planted in the asphalt car park by the entrance to the museum and accumulating life throughout 2020, and framed by geometrical shapes drawn from a Herbert Bayer postcard for the original Bauhaus in 1923. Typeface is Untitled Sans by Klim. An offering to frame the design process for this new European Union proposition; plotting a course through a minefield, planting seeds for a meadow Ever since the President of the European Union, Ursula von der Leyen, dropped the idea of a New European Bauhaus into her State of the Union speech on 16th September 2020, I’ve been discussing it with members of the European Commission team working on the proposal. Given how open the proposition was, I immediately started jotting down a few thoughts about the possibility, whilst a conversation opened up with my colleagues Christian Bason (CEO of the Danish Design Centre), Rowan Conway (Head of Institute for Innovation and Public Purpose’s Mission-Oriented Innovation Network and an experienced design professional with whom I lead the Transformation by Design module on IIPP Masters of Public Administration degree) and Mariana Mazzucato (Director of UCL IIPP, and who increasingly requires no introduction.) From those conversations, I sketched out a document that could be picked up and read by European Commission policymakers and practitioners, few of whom have deep experience of arts and design, yet which would also make sense to experienced artists, designers, educators, curators … It was not easy to write something pitched right down the middle of that broad fairway. The document is intended to be an offering to the Commission: a set of constructive emphases, but also helpful warnings given the context of the Bauhaus. As I had heard that the starting point for the New Bauhaus conversations were relatively limited to new construction technologies, I felt it should reorientate and open up around some key dynamics: retrofit rather than new-build; care and maintenance; more-than-human-centred design; governance reform; transdisciplinary approaches; participative collaboration; a social and cultural agenda rather than narrow economic or technological one, and so on. Each outlines some notes to hit regarding Europe’s past, present and future possibilities. Respecting the need for a coherent design process, and from a position of necessary humility given the sheer weight of baggage associated with the name Bauhaus, I didn’t want to make concrete suggestions. I could do so, having worked intensively on many adjacent or relevant projects in the past (innovation campuses and districts for cities, universities, Google etc., as well as running schools like Fabrica, whilst spending many years in and around the orbit of the European Commission’s innovation agenda). But to do so—to make those concrete suggestions—would negate the heavily participative, inquisitive and open approach I was suggesting. It is not the time. So I hinted at a few directions, and outlined an approach predicated on participation and prototyping, suggesting both a quick start and a long haul. I was also drawing on Ines Weizman’s excellent collection Dust & Data: Traces of the Bauhaus across 100 Years, as well as reflecting on the equally formative, related, but quite different Ulm School of Design and Black Mountain College, and others. The images I selected reflect voices disenfranchised by the original Bauhaus. My work at Vinnova, with mission-oriented innovation around streets and school food, is drawn in. Other aspects—future architectural practice; strategic design; the role of tech; slowdown themes of care, retrofit, maintenance, biodiversity, politics—are frequent topics here. Rowan added some brilliantly choice phrases in key places, and underscored the need for a critical edge regarding the latent power of design (themes she’s also bringing powerfully into the MPA.) In conversation and correspondence, Christian and Mariana provided key direction for the piece (the former on the Green Deal being seen as a social and cultural movement as much as an economic or technological agenda, whilst emphasising the progressive nature of many startups; the latter reinforcing mission-oriented innovation, public value economics, and the need for art, design and culture to help powerfully imagine and articulate questions of diversity and conflict.) A lunch with Kieran Long also helped, as usual. By late-October, we had a briefing paper. I sent it to some key contacts at the Commission, and we’ve had regular discussions since. Subsequently, the Commission has created a site for the New European Bauhaus. As usual for a project at this point, I’m trying to design beginnings rather than endings. I’m posting the text below to mark it here, but also so I can add links and quotes for further reference. You can find the PDF version I created at the UCL site, but for the link-y version, read on below. To help frame the briefing After the EC published more information about the New European Bauhaus in January 2021, Rowan took the lead on writing a post for UCL IIPP framing the briefing, which I contributed to in return, rallying back and forth. We’re extremely interested in any responses—notes, prompts, iterations—given the crucial point in the project’s design process. https://www.ucl.ac.uk/bartlett/public-purpose/publications/2021/jan/new-bauhaus-green-deal A New European Bauhaus for a Green Deal Christian Bason, Rowan Conway, Dan Hill, Mariana MazzucatoNovember 2020 We are thrilled by the idea of a New European Bauhaus, as a school of thought and practice for the European Green Deal. We believe that a New Bauhaus can be the generator for a New Europe’s imagination. But the details of which version of the Bauhaus — and how it addresses the missions a New Bauhaus pursues — are crucial. Getting the scope of the New Bauhaus right is a necessary precondition for retooling Europe’s design capabilities for a mission-oriented Green Deal. We offer the following thoughts to help guide the development of the idea. They deliberately steer clear of suggesting solutions, as we believe that a project as complex as this requires a coherent design process, starting with a clean canvas. Instead, they describe some of the principles and perspectives that could aid the design process, as a kind of background to help inform a brief, form a team. However, prototyping the New Bauhaus itself, as a project, would enable ideas to emerge in reality very soon, immediately creating waves within months. We need to address the core ideas implicit within the Bauhaus, retrofitting them for our age and its challenges. For example, we have almost all the technology we need for many versions of a Green Deal, if we see that our core challenges are behavioural, cultural, political, and economic. The most urgent concern our European identities: how we make shared decisions about shared futures, how we use public space to understand public purpose, how we contest and co-create. This focus on the craft of participation and creative contestation, on purposefully holding uncertainty and ambiguity, fundamentally shakes the idea of a New Bauhaus, as well as the broader context it will sit within. Yet it does so usefully. If we address these challenges with courage and imagination, with both transdisciplinary expertise and an open participative spirit, then the New Bauhaus is indeed an opportunity for the reinvention of our design, art and architecture practices, capable of driving Europe forward, learning from its past in order to produce for today and tomorrow. Such an approach would explicitly reveal that questions of technology, built environment, product, material and service are not unrelated to those of culture, identity, governance, but rather they are symbiotically linked: each unlocks the other. Design and architecture, as they concern culture and identity as much as technology and materiality, can play a fundamentally powerful role here, helping transform an avant-garde into a ‘new wave’ of systemic change. Below, three key angles for a New Bauhaus, each summarising ideas which are expanded upon variously below. Imagination of the Green Deal—The New Bauhaus can be the primary European platform for stimulating and sharing our collective imagination, as an endlessly renewable energy to power the European Green Deal. As with the original, the New Bauhaus must be brave and bold, and devised by Europe’s best talent across design, art, architecture, craft and making. These practices work in transdisciplinary modes with other skillsets and perspectives, to ensure that the Green Deal is exerted by missions that engage with social, cultural and political transformation, creatively contesting and constructing shared identities in order to better build shared infrastructures, public spaces for public discourse. Delivery of the Green Deal — Create a mission-oriented strategic design agenda in order to articulate new systems, cultures, behaviours, markets and governance models for delivering the European Green Deal. This means inventively framing questions and decisively shaping conditions to ensure that avant-garde can be translated into systemic change. In particular, the New Bauhaus can devise the ‘ground game’ for design-led mission-oriented innovation, oriented around building and maintaining diverse new capabilities and dynamics of repair and retrofit, regenerate and restore, care and culture. This must reinvent and reinvigorate visionary planning as well as super-local engagement. Participation in the Green Deal—Reverse the logic of previous eras by ensuring that visionary planning is counterpointed and informed by taking meaningful first steps from ground-up, embracing contextual complexity and uncertainty as well as longer-term strategic arcs. Missions can dynamically build engaged and participative cultures in order to articulate and build the Green Deal. The New Bauhaus can actively prototype complex cultures of public discourse and decision-making. It should engage with existing institutions and places to create a diverse network of centres and shared activities, thus avoiding inadvertent competition in an age that requires deep collaboration. Creating fertile ground for the Green Deal We need design, architecture and artful experimentation to help create the conditions necessary for the European Green Deal, including the design and delivery of our institutions, cultures, social infrastructures and natural environments, as much as our technologies, materials and built infrastructures. Design-led approaches to mission-oriented innovation can be the vehicle for this work, shaping finance, governance and social innovation oriented around public purpose, but this will require a much deeper exchange between the fields of the design and economics. Understanding how to design an economy to be more inclusive and sustainable begins with an understanding of markets as outcomes of design decisions. Mission-oriented innovation therefore needs a new ‘ground game’ in place across Europe that can extend its knowledge to institutional and systemic change. The New Bauhaus can be this intellectual, cultural and practical snowplough, clearing the way for these missions and their rich array of outcomes. Art is ratified, in the end, by the fact of creativity in all our living. Everything we see and do, the whole structure of our relationships and institutions, depends, finally, on an effort of learning, description and communication … We cannot set ‘art’ on one side of a line and ‘work’ on the other; we cannot submit to be divided into ‘Aesthetic Man’ and ‘Economic Man’.— Raymond Williams It can do this in at least three ways. First of all, and most obviously, the imaginative capacity of design, art, and architecture actively creates possible futures. making tangible and motivating the numerous diverse and complex scenarios implicit in the Green Deal. Europe’s skillset here is unparalleled, yet the New Bauhaus can be a new field of lightning rods across Europe, lifting the positioning of the imagination in both decision-making and everyday life. Secondly, the New Bauhaus can help develop a widespread literacy and toolkit for design, architecture, technology and culture at all levels, creating better clients and collaborators as well as better designers. Design has a responsibility for the conditions it produces within, the ‘dark matter’ of organisational culture, policy and regulation, procurement logics, evaluation models, societal value and values. This is a challenge requiring an almost avant-garde spirit vis-à-vis bureaucracy itself. Thirdly, the New Bauhaus can help re-work the cultures that shape public life, such that our public and civic institutions are capable of equitably delivering resilient, healthy, vibrant and culturally rich technologies, infrastructures, cultures and places. Accessing art and design’s capacity for purposefully holding ambiguity and uncertainty will be key to ensuring that we do not shirk from complexity and contestation, but that we embrace it. Design, art and architecture have fundamental roles to play here. They produce new ways of seeing and doing, which in turn inform and invent new cultural and political practices. A new emphasis on deep collaboration and dynamic evaluation, necessary at the core of these new practices, can draw deeply from architecture and design expertise in this regard. The act of prototyping — of creating tangible experiences within everyday life, in order to simultaneously provoke discussion, derive insights, and shape the directions of possible futures — is fundamental to design and architecture practice, yet still rarely used more broadly in public life. The New Bauhaus can be the prototyping engine for almost any aspect of the Green Deal, enabling participation in far richer and more inventive subsequent outcomes from this ‘New Wave’. Do not define today. Define backward and forward, spatial and many-sided. A defined today is over and done for.— Paul Klee These forms of strategic design and architecture focused on systemic change for ‘big picture’ challenges, aligned around public purpose and societal value, are immersed within the richer palettes of related artistic and cultural practices. Any such new design education and research needs to capture this diversity and range — just as it needs to have ready access to forward-thinking forms of economics, public policy, organisational change theory and practice, psychology and sociology, science and engineering, history and humanities. With these participative and transdisciplinary approaches as a keystone, aimed at and articulated by new missions for Europe, a New Bauhaus can not only provoke the imagination, but help design and deliver the pathways for equitable, ethical and effective transformat"
