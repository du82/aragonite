. As Kidd notes, Tokyo’s relative ‘success’ in those Copenhagenize rankings is nothing to do with far-sighted government support and everything to do with people, and the bike as near-perfect everyday infrastructure. Building a supporting infrastructure of everyday dignity for bikes would not be hard; in fact, it would be working with the grain of the city. Some of the conditions that would favour bikes—for instance, the lack of on-street parking noted above—inadvertently produces positive effects within this metabolism. As a result, the warrens of small streets that define Tokyo neighbourhoods, clear of parking and often bereft of significant car traffic, turn out to be near-perfect conditions for cycling. Given the size of the city, with a mode-share for cycling of around 14% (noting that Tokyo’s incredibly effective public transport will always take the lion’s share of all mobility in the city) that means the numbers of cyclists are extraordinary. And if you walk these side-streets, bikes feel the dominant mode, outside of walking. There’s such a pleasingly diverse array of bikes around nonetheless. Perhaps it’s so appealing due to the counterpoint between the often humble, small yet well-maintained bikes and the scale of the city around. And perhaps implicitly, this suggests another counterpoint: the broader everyday resilience and inventiveness that Kidd points to, in the face of little or no coherent government guidance and support. Cycling here works because of the city of Tokyo, meaning its people and its sense of place, rather than the city of Tokyo as an administrative unit and a jurisdiction. Bikes, Tokyo — OK, one or two of those are Kyoto, where many of the conditions are similar (2018–19) Mamachari There is a particularly distinctive type of bike you see in Japanese cities, and all over Tokyo: the mamachari. Byron Kidd again: “The mamachari is a cultural icon, it’s the Japanese equivalent of the family station wagon. Its the family workhorse used on shopping runs, for riding to the local station, taking the kids to school or picking them up from sports practice. Without it families around the country would be in a right pickle. The defining features include, a top tube bent low that is easy to step over, a shopping basket on the front, a luggage rack on the back, mudguards, chain guards, dynamo lights, an integrated lock, a bell and a hefty rear stand that keeps the bike stable and upright when parked.” —Introducing the Mamachari, Byron Kidd, Tokyo By Bike The gendered language in the name might need a bit of work, translating more or less as “Mum’s bike” — though as this articles, they are heavily used by everyone. Either way, it’s a wonderfully practical, humble everyday bike, for carrying shopping, kids, or pretty much anything else. The lower centre-of-gravity and long frame is quite different to the archetypal European ‘sit-up’ city bikes. It is no low-rider, but it has a gawky charm, as well as the practicality of loading up the front and back, and incredibly easy access. A few examples of ‘mamachari’, Tokyo 2018–19 As with cars—see below—bikes are parked in every possible nook, slid into gaps and sidling up alongside façades, again ensuring the street, or passageway, is left clear and open. They often become part of the informal assemblages of objects—plants, storage boxes, chairs, signs, stools, air conditioning units—that line the property boundaries of buildings. Being Japan, there are of course hi-tech commercial services for bike parking, like these well-publicised underground bike parking ‘robots’, but I’m more interested in the informal adaptive design of the following approaches. Bike parking, Tokyo (last one actually Kyoto, outside a really excellent ‘better than France’ French-style café) 2018–19 Aside: It’ll be interesting to see what happens with scooters here, once they are added to the mix, given the travails elsewhere about their parking in public life. The lack of a meaningful culture of care for the street — civic or collective — has meant that the public parking of shared scooters in North America and Europe has caused chaos, frustration and anger in roughly equal measure to joy, vitality and freedom of movement. I would argue that this is partly because most city authorities have shown little initiative in terms of creating parking infrastructure, or even having constructive discussions with scooter services (which is quite different to their response to a much greater nuisance, that of privately-owned cars.) And it is partly due to the scooter startups following the wrong technology models i.e. blitzscaling (though in my experience, having spent days and weeks working with some of them, many want to solve the problem rather progressively, and would loved to have done so before it became a problem!) And it is partly due to highly individualised social and political norms playing out on pavements (Or, the 'why we can't have nice things' argument.) In Tokyo, one can imagine scooters being "
