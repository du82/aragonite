description = "News from across the five boroughs of New York City by the Times metro staff, including politics, schools, transportation, crime and city life and reader discussions. This blog has been archived."
full_description = "From the City Room Oct 27, 2015 Oct 27, 2015 Please Note: The N.Y. Today and Metropolitan Diary Columns Are Not Going Away By The New York Times Our announcement yesterday that City Room is retiring may have confused some readers. Many of you seem to think that New York Today, the morning roundup column, is going away. It is not. As it has since its inception, New York Today appears every weekday morning in Top Stories on the app, on the nytimes.com home page, and at nytoday.com. You can read this morning’s column here. The only regular features that were still running on City Room, Metropolitan Diary and Big City Book Club, are not going away either. They are continuing on the main nytimes.com site. Metropolitan Diary can be read here each weekday, with a week’s worth running in print, as usual, every Monday. And the next Big City Book Club is Nov. 10 — watch this space for details. Thank you all for your kind words about City Room, and for joining us over the years. From the City Room Oct 26, 2015 Oct 26, 2015 City Room, a Blog With a Broad Mandate, Is RetiringBy Andy Newman Photo We shall spend the rest of our days lounging and cracking open mollusks.Credit Julie Larsen Maher/Wildlife Conservation Society In the distant clamor of another decade, a group of wise men and women put their heads together and decided that what the New York Times website needed was a blog about New York City. Focus groups were convened. Committees were formed. “We need a tone and mindset that are hip but NOT trendy,” one memo read. The result was City Room. It debuted on June 14, 2007, “a news blog of live reporting, features and reader conversations about New York City.” Now, eight years, 20,000 posts, 425,000 reader comments and perhaps 100 million clicks later, City Room has an announcement to make: Read more… Metropolitan Diary Oct 25, 2015 Oct 25, 2015 No Cheating at Zabar’sBy Heidi Olson Metropolitan Diary More Reader Tales From the City » Dear Diary: Zabar’s deli counter has its rules: Get your number by the roasting chickens and take your turn. Last night there were no tickets. Fearing a pending crisis, I opened the number machine and refed the pink numbers into the tongue groove. That solved, I went back to the counter with No. 19 in hand. There stood a tall man in an Army green jacket with a prominent mole on his cheek. He had arrived after me but before I fixed the machine. Then he turned and said, “Where are we with these numbers?” showing me No. 17. Did he think I wouldn’t notice that he picked No. 17 off the counter after another customer had finished? Really! Every New Yorker knows there are some things you just don’t do. Read all recent entries and our updated submissions guidelines. Reach us via email diary@nytimes.com or follow @NYTMetro on Twitter using the hashtag #MetDiary."
