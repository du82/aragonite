["https://cknv.dk/blog/2014/9/writing-your-own-blog-software"]
title = "cknv > Writing your own blog software"
full_description = "Writing your own blog software If anybody is actually reading this, then perhaps they have noticed that my writing output tend to be spiky. And there is a good reason for that, that I will hightlight here. The reason is that I have written my own blogging software. Of course that should not make it harder for me to write, but it does. Specifically, it is because Beetle is somewhat still in a state of flux, there are some ugly corners that I am still dealing with. Now what happens is that I sit down to write something, and then grow unhappy with the state of Beetle and try to fix it, when I try to fix it, it either works or not. In either way my writing is delayed, and in the worst case I am not done with fixing the actual issue. Which leads me to the next time I want to write, I try to address the same issue again, rinse and repeat. So it does come with some challenges, and more than just making the actual code work. Other than that, I still think it is fun, but I doubt that Beetle is anything revolutionary or new, so by most definitions it is a complete waste of time. Although it is my waste of time, and my little piece of open source code. I would not have it any other way. So following that, in an attempt to avoid hubris: I doubt Beetle is the best choice for you, if you want to write. But neither might any of the others choices out there be, so the only recommendation I can make is to shop around and try them all, to learn what you actually want, and then perhaps write your own. It is only as difficult as you make it. Project: beetle Tags: meta Posted Sep 17 2014 by Esben Sonne"
