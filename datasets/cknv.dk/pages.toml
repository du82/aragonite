["https://cknv.dk/blog/2015/12/blog-rewrite"]
title = "cknv > Blog Rewrite"
full_description = "Blog Rewrite So it has been a while since I last wrote. I have been lazy. Well, more or less. Just being lazy is not entirely true, I have been writing, but I have not been publishing anything (weird, right?), the reason for this is that I have been unhappy with how the blog was made. Something I have finally gotten around to address now. I had originally written a quite/somewhat flexible blog engine, that more or less allowed you to do what you wanted to do, or at least what I wanted to do, but as time went I found out that it was not actually an engine I had wanted to write. So I have thrown out beetle, and I have instead of it, a script and a small utils library called scarab. The plan is that scarab will slowly grow whenever whenever there is something that you need to do over and over, or if there is something everyone needs to do. Project: beetle Tags: scarab Posted Dec 20 2015 by Esben Sonne"
