full_description = "table.docutils { width: 1px; } table.docutils td { border: none; padding: 0 0 0 0.2em; vertical-align: middle; white-space: nowrap; width: 1px; font-family: monospace; } table.docutils tr + tr { border-top: 0.2em solid #aaa; } .error { font-family: monospace; font-weight: bold; color: #c00; } .warning { font-family: monospace; font-weight: bold; color: #80a; } .remark { font-family: monospace; font-weight: bold; color: #00c; } .diagtext { font-family: monospace; font-weight: bold; } Diagnostic flags in Clang¶ Introduction Diagnostic flags -W -W#pragma-messages -W#warnings -WCFString-literal -WCL4 -WIndependentClass-attribute -WNSObject-attribute -Waarch64-sme-attributes -Wabi -Wabsolute-value -Wabstract-final-class -Wabstract-vbase-init -Waddress -Waddress-of-packed-member -Waddress-of-temporary -Waggregate-return -Waix-compat -Walias-template-in-declaration-name -Walign-mismatch -Wall -Walloca -Walloca-with-align-alignof -Walways-inline-coroutine -Wambiguous-delete -Wambiguous-ellipsis -Wambiguous-macro -Wambiguous-member-template -Wambiguous-reversed-operator -Wanalyzer-incompatible-plugin -Wandroid-unversioned-fallback -Wanon-enum-enum-conversion -Wanonymous-pack-parens -Wapinotes -Warc -Warc-bridge-casts-disallowed-in-nonarc -Warc-maybe-repeated-use-of-weak -Warc-non-pod-memaccess -Warc-performSelector-leaks -Warc-repeated-use-of-weak -Warc-retain-cycles -Warc-unsafe-retained-assign -Wargument-outside-range -Wargument-undefined-behaviour -Warm-interrupt-vfp-clobber -Warray-bounds -Warray-bounds-pointer-arithmetic -Warray-compare -Warray-compare-cxx26 -Warray-parameter -Wasm -Wasm-operand-widths -Wassign-enum -Wassume -Wat-protocol -Watimport-in-framework-header -Watomic-access -Watomic-alignment -Watomic-implicit-seq-cst -Watomic-memory-ordering -Watomic-properties -Watomic-property-with-user-defined-accessor -Wattribute-packed-for-bitfield -Wattribute-statement -Wattribute-warning -Wattributes -Wauto-decl-extensions -Wauto-disable-vptr-sanit