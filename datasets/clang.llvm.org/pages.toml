title = "Clang Compiler User’s Manual — Clang 21.0.0git documentation"
full_description = "Clang Compiler User’s Manual¶ Introduction Terminology Basic Usage Command Line Options Options to Control Error and Warning Messages Formatting of Diagnostics Individual Warning Groups Options to Control Clang Crash Diagnostics Options to Emit Optimization Reports Current limitations Options to Emit Resource Consumption Reports Other Options Configuration files Language and Target-Independent Features Controlling Errors and Warnings Controlling How Clang Displays Diagnostics Diagnostic Mappings Diagnostic Categories Controlling Diagnostics via Command Line Flags Controlling Diagnostics via Pragmas Controlling Diagnostics in System Headers Controlling Deprecation Diagnostics in Clang-Provided C Runtime Headers Enabling All Diagnostics Controlling Diagnostics via Suppression Mappings Controlling Static Analyzer Diagnostics Precompiled Headers Generating a PCH File Using a PCH File Relocatable PCH Files Controlling Floating Point Behavior Accessing the floating point environment A note about crtfastmath.o A note about __FLT_EVAL_METHOD__ A note about Floating Point Constant Evaluation Controlling Code Generation Strict Aliasing Profile Guided Optimization Differences Between Sampling and Instrumentation Using Sampling Profilers Sample Profile Formats Sample Profile Text Format Profiling with Instrumentation Fine Tuning Profile Collection Disabling Instrumentation Instrumenting only selected files or functions Older Prefixes Instrument function groups Profile remapping GCOV-based Profiling Controlling Debug Information Controlling Size of Debug Information Controlling Macro Debug Info Generation Controlling Debugger “Tuning” Controlling LLVM IR Output Controlling Value Names in LLVM IR Comment Parsing Options C Language Features Extensions supported by clang Differences between various standard modes GCC extensions not implemented yet Intentionally unsupported GCC extensions Microsoft extensions C++ Language Features Controlling implementation limits Objective-C Language Features Objective-C++ Language Features OpenMP Features Controlling implementation limits OpenCL Features OpenCL Specific Options OpenCL Targets Specific Targets Generic Targets OpenCL Header OpenCL Extensions OpenCL-Specific Attributes nosvm opencl_unroll_hint convergent noduplicate C++ for OpenCL Constructing and destroying global objects Libraries Target-Specific Features and Limitations CPU Architectures Features and Limitations X86 ARM PowerPC Other platforms Operating System Features and Limitations Windows Cygwin MinGW32 MinGW-w64 AIX TOC Data Transformation Default Visibility Export Mapping SPIR-V support clang-cl Command-Line Options The /clang: Option The /Zc:dllexportInlines- Option Finding Clang runtime libraries Windows System Headers and Library Lookup Restrictions and Limitations compared to Clang Introduction¶ The Clang Compiler is an open-source compiler for the C family of programming languages, aiming to be the best in class implementation of these languages. Clang builds on the LLVM optimizer and code generator, allowing it to provide high-quality optimization and code generation support for many targets. For more general information, please see the Clang Web Site or the LLVM Web Site. This document describes important notes about using Clang as a compiler for an end-user, documenting the supported features, command line options, etc. If you are interested in using Clang to build a tool that processes code, please see “Clang” CFE Internals Manual. If you are interested in the Clang Static Analyzer, please see its web page. Clang is one component in a complete toolchain for C family languages. A separate document describes the other pieces necessary to assemble a complete toolchain. Clang is designed to support the C family of programming languages, which includes C, Objective-C, C++, and Objective-C++ as well as many dialects of those. For language-specific information, please see the corresponding language specific section: C Language: K&R C, ANSI C89, ISO C90, ISO C94 (C89+AMD1), ISO C99 (+TC1, TC2, TC3). Objective-C Language: ObjC 1, ObjC 2, ObjC 2.1, plus variants depending on base language. C++ Language Objective C++ Language OpenCL Kernel Language: OpenCL C 1.0, 1.1, 1.2, 2.0, 3.0, and C++ for OpenCL 1.0 and 2021. In addition to these base languages and their dialects, Clang supports a broad variety of language extensions, which are documented in the corresponding language section. These extensions are provided to be compatible with the GCC, Microsoft, and other popular compilers as well as to improve functionality through Clang-specific features. The Clang driver and language features are intentionally designed to be as compatible with the GNU GCC compiler as reasonably possible, easing migration from GCC to Clang. In most cases, code “just works”. Clang also provides an alternative driver, clang-cl, that is designed to be compatible with the Visual C++ compiler, cl.exe. In addition to language specific features, Clang has a variety of features that depend on what CPU architecture or operating system is being compiled for. Please see the Target-Specific Features and Limitations section for more details. The rest of the introduction introduces some basic compiler terminology that is used throughout this manual and contains a basic introduction to using Clang as a command line compiler. Terminology¶ Front end, parser, backend, preprocessor, undefined behavior, diagnostic, optimizer Basic Usage¶ Intro to how to use a C compiler for newbies. compile + link compile then link debug info enabling optimizations picking a language to use, defaults to C17 by default. Autosenses based on extension. using a makefile Command Line Options¶ This section is generally an index into other sections. It does not go into depth on the ones that are covered by other sections. However, the first part introduces the language selection and other high level options like -c, -g, etc. Options to Control Error and Warning Messages¶ -Werror¶ Turn warnings into errors. -Werror=foo Turn warning “foo” into an error. -Wno-error=foo¶ Turn warning “foo” into a warning even if -Werror is specified. -Wfoo¶ Enable warning “foo”. See the diagnostics reference for a complete list of the warning flags that can be specified in this way. -Wno-foo¶ Disable warning “foo”. -w¶ Disable all diagnostics. -Weverything¶ Enable all diagnostics. -pedantic¶ Warn on language extensions. -pedantic-errors¶ Error on language extensions. -Wsystem-headers¶ Enable warnings from system headers. -ferror-limit=123¶ Stop emitting diagnostics after 123 errors have been produced. The default is 20, and the error limit can be disabled with -ferror-limit=0. -ftemplate-backtrace-limit=123¶ Only emit up to 123 template instantiation notes within the template instantiation backtrace for a single warning or error. The default is 10, and the limit can be disabled with -ftemplate-backtrace-limit=0. --warning-suppression-mappings=foo.txt¶ Suppress certain diagnostics for certain files. Formatting of Diagnostics¶ Clang aims to produce beautiful diagnostics by default, particularly for new users that first come to Clang. However, different people have different preferences, and sometimes Clang is driven not by a human, but by a program that wants consistent and easily parsable output. For these cases, Clang provides a wide range of options to control the exact output format of the diagnostics that it generates. -f[no-]show-column¶ Print column number in diagnostic. This option, which defaults to on, controls whether or not Clang prints the column number of a diagnostic. For example, when this is enabled, Clang will print something like: test.c:28:8: warning: extra tokens at end of #endif directive [-Wextra-tokens] #endif bad ^ // When this is disabled, Clang will print “test.c:28: warning…” with no column number. The printed column numbers count bytes from the beginning of the line; take care if your source contains multibyte characters. -f[no-]show-source-location¶ Print source file/line/column information in diagnostic. This option, which defaults to on, controls whether or not Clang prints the filename, line number and column number of a diagnostic. For example, when this is enabled, Clang will print something like: test.c:28:8: warning: extra tokens at end of #endif directive [-Wextra-tokens] #endif bad ^ // When this is disabled, Clang will not print the “test.c:28:8: ” part. -f[no-]caret-diagnostics¶ Print source line and ranges from source code in diagnostic. This option, which defaults to on, controls whether or not Clang prints the source line, source ranges, and caret when emitting a diagnostic. For example, when this is enabled, Clang will print something like: test.c:28:8: warning: extra tokens at end of #endif directive [-Wextra-tokens] #endif bad ^ // -f[no-]color-diagnostics¶ This option, which defaults to on when a color-capable terminal is detected, controls whether or not Clang prints diagnostics in color. When this option is enabled, Clang will use colors to highlight specific parts of the diagnostic, e.g., test.c:28:8: warning: extra tokens at end of #endif directive [-Wextra-tokens] #endif bad ^ // When this is disabled, Clang will just print: test.c:2:8: warning: extra tokens at end of #endif directive [-Wextra-tokens] #endif bad ^ // If the NO_COLOR environment variable is defined and not empty (regardless of value), color diagnostics are disabled. If NO_COLOR is defined and -fcolor-diagnostics is passed on the command line, Clang will honor the command line argument. -fansi-escape-codes¶ Controls whether ANSI escape codes are used instead of the Windows Console API to output colored diagnostics. This option is only used on Windows and defaults to off. -fdiagnostics-format=clang/msvc/vi¶ Changes diagnostic output format to better match IDEs and command line tools. This option controls the output format of the filename, line number, and column printed in diagnostic messages. The options, and their affect on formatting a simple conversion diagnostic, follow: clang (default)t.c:3:11: warning: conversion specifies type 'char *' but the argument has type 'int' msvct.c(3,11) : warning: conversion specifies type 'char *' but the argument has type 'int' vit.c +3:11: warning: conversion specifies type 'char *' but the argument has type 'int' -f[no-]diagnostics-show-option¶ Enable [-Woption] information in diagnostic line. This option, which defaults to on, controls whether or not Clang prints the associated warning group option name when outputting a warning diagnostic. For example, in this output: test.c:28:8: warning: extra tokens at end of #endif directive [-Wextra-tokens] #endif bad ^ // Passing -fno-diagnostics-show-option will prevent Clang from printing the [-Wextra-tokens] information in the diagnostic. This information tells you the flag needed to enable or disable the diagnostic, either from the command line or through #pragma GCC diagnostic. -fdiagnostics-show-category=none/id/name¶ Enable printing category information in diagnostic line. This option, which defaults to “none”, controls whether or not Clang prints the category associated with a diagnostic when emitting it. Each diagnostic may or many not have an associated category, if it has one, it is listed in the diagnostic categorization field of the diagnostic line (in the []’s). For example, a format string warning will produce these three renditions based on the setting of this option: t.c:3:11: warning: conversion specifies type 'char *' but the argument has type 'int' [-Wformat] t.c:3:11: warning: conversion specifies type 'char *' but the argument has type 'int' [-Wformat,1] t.c:3:11: warning: conversion specifies type 'char *' but the argument has type 'int' [-Wformat,Format String] This category can be used by clients that want to group diagnostics by category, so it should be a high level category. We want dozens of these, not hundreds or thousands of them. -f[no-]save-optimization-record[=<format>]¶ Enable optimization remarks during compilation and write them to a separate file. This option, which defaults to off, controls whether Clang writes optimization reports to a separate file. By recording diagnostics in a file, users can parse or sort the remarks in a convenient way. By default, the serialization format is YAML. The supported serialization formats are: -fsave-optimization-record=yaml: A structured YAML format. -fsave-optimization-record=bitstream: A binary format based on LLVM Bitstream. The output file is controlled by -foptimization-record-file. In the absence of an explicit output file, the file is chosen using the following scheme: <base>.opt.<format> where <base> is based on the output file of the compilation (whether it’s explicitly specified through -o or not) when used with -c or -S. For example: clang -fsave-optimization-record -c in.c -o out.o will generate out.opt.yaml clang -fsave-optimization-record -c in.c will generate in.opt.yaml When targeting (Thin)LTO, the base is derived from the output filename, and the extension is not dropped. When targeting ThinLTO, the following scheme is used: <base>.opt.<format>.thin.<num>.<format> Darwin-only: when used for generating a linked binary from a source file (through an intermediate object file), the driver will invoke cc1 to generate a temporary object file. The temporary remark file will be emitted next to the object file, which will then be picked up by dsymutil and emitted in the .dSYM bundle. This is available for all formats except YAML. For example: clang -fsave-optimization-record=bitstream in.c -o out will generate /var/folders/43/9y164hh52tv_2nrdxrj31nyw0000gn/T/a-9be59b.o /var/folders/43/9y164hh52tv_2nrdxrj31nyw0000gn/T/a-9be59b.opt.bitstream out out.dSYM/Contents/Resources/Remarks/out Darwin-only: compiling for multiple architectures will use the following scheme: <base>-<arch>.opt.<format> Note that this is incompatible with passing the -foptimization-record-file option. -foptimization-record-file¶ Control the file to which optimization reports are written. This implies -fsave-optimization-record. On Darwin platforms, this is incompatible with passing multiple -arch <arch> options. -foptimization-record-passes¶ Only include passes which match a specified regular expression. When optimization reports are being output (see -fsave-optimization-record), this option controls the passes that will be included in the final report. If this option is not used, all the passes are included in the optimization record. -f[no-]diagnostics-show-hotness¶ Enable profile hotness information in diagnostic line. This option controls whether Clang prints the profile hotness associated with diagnostics in the presence of profile-guided optimization information. This is currently supported with optimization remarks (see Options to Emit Optimization Reports). The hotness information allows users to focus on the hot optimization remarks that are likely to be "
