title = "Block Implementation Specification — Clang 21.0.0git documentation"
full_description = 'Block Implementation Specification¶ History High Level Imported Variables Imported const copy variables Imported const copy of Block reference Importing __attribute__((NSObject)) variables Imported __block marked variables Layout of __block marked variables Access to __block variables from within its lexical scope Importing __block variables into Blocks Importing __attribute__((NSObject)) __block variables __block escapes Nesting Objective C Extensions to Blocks Importing Objects Blocks as Objects __weak __block Support C++ Support Runtime Helper Functions Copyright History¶ 2008/7/14 - created. 2008/8/21 - revised, C++. 2008/9/24 - add NULL isa field to __block storage. 2008/10/1 - revise block layout to use a static descriptor structure. 2008/10/6 - revise block layout to use an unsigned long int flags. 2008/10/28 - specify use of _Block_object_assign and _Block_object_dispose for all “Object” types in helper functions. 2008/10/30 - revise new layout to have invoke function in same place. 2008/10/30 - add __weak support. 2010/3/16 - rev for stret return, signature field. 2010/4/6 - improved wording. 2013/1/6 - improved wording and converted to rst. This document describes the Apple ABI implementation specification of Blocks. The first shipping version of this ABI is found in Mac OS X 10.6, and shall be referred to as 10.6.ABI. As of 2010/3/16, the following describes the ABI contract with the runtime and the compiler, and, as necessary, will be referred to as ABI.2010.3.16. Since the Apple ABI references symbols from other elements of the system, any attempt to use this ABI on systems prior to SnowLeopard is undefined. High Level¶ The ABI of Blocks consist of their layout and the runtime functions required by the compiler. A Block of type R (^)(P...) consists of a structure of the following form: struct Block_literal_1 { void *isa; // initialized to &_NSConcreteStackBlock or &_NSConcreteGlobalBlock int flags; int reserved; R (*invoke)(struct Block_literal_1 *, P...); struct Block_descriptor_1 { unsigned long int reserved; // NULL unsigned long int size; // sizeof(struct Block_literal_1) // optional helper functions void (*copy_helper)(void *dst, void *src); // IFF (1<<25) void (*dispose_helper)(void *src); // IFF (1<<25) // required ABI.2010.3.16 const char *signature; // IFF (1<<30) } *descriptor; // imported variables }; The following flags bits are in use thusly for a possible ABI.2010.3.16: enum { // Set to true on blocks that have captures (and thus are not true // global blocks) but are known not to escape for various other // reasons. For backward compatibility with old runtimes, whenever // BLOCK_IS_NOESCAPE is set, BLOCK_IS_GLOBAL is set too. Copying a // non-escaping block returns the original block and releasing such a // block is a no-op, which is exactly how global blocks are handled. BLOCK_IS_NOESCAPE = (1 << 23), BLOCK_HAS_COPY_DISPOSE = (1 << 25), BLOCK_HAS_CTOR = (1 << 26), // helpers have C++ code BLOCK_IS_GLOBAL = (1 << 28), BLOCK_HAS_STRET = (1 << 29), // IFF BLOCK_HAS_SIGNATURE BLOCK_HAS_SIGNATURE = (1 << 30), }; In 10.6.ABI the (1<<29) was usually set and was always ignored by the runtime - it had been a transitional marker that did not get deleted after the transition. This bit is now paired with (1<<30), and represented as the pair (3<<29), for the following combinations of valid bit settings, and their meanings: switch (flags & (3<<29)) { case (0<<29): 10.6.ABI, no signature field available case (1<<29): 10.6.ABI, no signature field available case (2<<29): ABI.2010.3.16, regular calling convention, presence of signature field case (3<<29): ABI.2010.3.16, stret calling convention, presence of signature field, } The signature field is not always populated. The following discussions are presented as 10.6.ABI otherwise. Block literals may occur within functions where the structure is created in stack local memory. They may also appear as initialization expressions for Block variables of global or static local variables. When a Block literal expression is evaluated the stack based structure is initialized as follows: A static descriptor structure is declared and initialized as follows: a. The invoke function pointer is set to a function that takes the Block structure as its first argument and the rest of the arguments (if any) to the Block and executes the Block compound statement. b. The size field is set to the size of the following Block literal structure. c. The copy_helper and dispose_helper function pointers are set to respective helper functions if they are required by the Block literal. A stack (or global) Block literal data structure is created and initialized as follows: a. The isa field is set to the address of the external _NSConcreteStackBlock, which is a block of uninitialized memory supplied in libSystem, or _NSConcreteGlobalBlock if this is a static or file level Block literal. b. The flags field is set to zero unless there are variables imported into the Block that need helper functions for program level Block_copy() and Block_release() operations, in which case the (1<<25) flags bit is set. As an example, the Block literal expression: ^ { printf("hello world\n"); } would cause the following to be created on a 32-bit system: struct __block_literal_1 { void *isa; int flags; int reserved; void (*invoke)(struct __block_literal_1 *); struct __block_descriptor_1 *descriptor; }; void __block_invoke_1(struct __block_literal_1 *_block) { printf("hello world\n"); } static struct __block_descriptor_1 { unsigned long int reserved; unsigned long int Block_size; } __block_descriptor_1 = { 0, sizeof(struct __block_literal_1) }; and where the Block literal itself appears: struct __block_literal_1 _block_literal = { &_NSConcreteStackBlock, (1<<29), <uninitialized>, __block_invoke_1, &__block_descriptor_1 }; A Block imports other Block references, const copies of other variables, and variables marked __block. In Objective-C, variables may additionally be objects. When a Block literal expression is used as the initial value of a global or static local variable, it is initialized as follows: struct __block_literal_1 __block_literal_1 = { &_NSConcreteGlobalBlock, (1<<28)|(1<<29), <uninitialized>, __block_invoke_1, &__block_descriptor_1 }; that is, a different address is provided as the first value and a particular (1<<28) bit is set in the flags field, and otherwise it is the same as for stack based Block literals. This is an optimization that can be used for any Block literal that imports no const or __block storage variables. Imported Variables¶ Variables of auto storage class are imported as const copies. Variables of __block storage class are imported as a pointer to an enclosing data structure. Global variables are simply referenced and not considered as imported. Imported const copy variables¶ Automatic storage variables not marked with __block are imported as const copies. The simplest example is that of importing a variable of type int: int x = 10; void (^vv)(void) = ^{ printf("x is %d\n", x); } x = 11; vv(); which would be compiled to: struct __block_literal_2 { void *isa; int flags; int reserved; void (*invoke)(struct __block_literal_2 *); struct __block_descriptor_2 *descriptor; const int x; }; void __block_invoke_2(struct __block_literal_2 *_block) { printf("x is %d\n", _block->x); } static struct __block_descriptor_2 { unsigned long int reserved; unsigned long int Block_size; } __block_descriptor_2 = { 0, sizeof(struct __block_literal_2) }; and: struct __block_literal_2 __block_literal_2 = { &_NSConcreteStackBlock, (1<<29), <uninitialized>, __block_invoke_2, &__block_descriptor_2, x }; In summary, scalars, structures, unions, and function pointers are generally imported as const copies with no need for helper functions. Imported const copy of Block reference¶ The first case where copy and dispose helper functions are required is for the case of when a Block itself is imported. In this case both a copy_helper function and a dispose_helper function are needed. The copy_helper function is passed both the existing stack based pointer and the pointer to the new heap version and should call back into the runtime to actually do the copy operation on the imported fields within the Block. The runtime functions are all described in Runtime Helper Functions. A quick example: void (^existingBlock)(void) = ...; void (^vv)(void) = ^{ existingBlock(); } vv(); struct __block_literal_3 { ...; // existing block }; struct __block_literal_4 { void *isa; int flags; int reserved; void (*invoke)(struct __block_literal_4 *); struct __block_literal_3 *const existingBlock; }; void __block_invoke_4(struct __block_literal_2 *_block) { __block->existingBlock->invoke(__block->existingBlock); } void __block_copy_4(struct __block_literal_4 *dst, struct __block_literal_4 *src) { //_Block_copy_assign(&dst->existingBlock, src->existingBlock, 0); _Block_object_assign(&dst->existingBlock, src->existingBlock, BLOCK_FIELD_IS_BLOCK); } void __block_dispose_4(struct __block_literal_4 *src) { // was _Block_destroy _Block_object_dispose(src->existingBlock, BLOCK_FIELD_IS_BLOCK); } static struct __block_descriptor_4 { unsigned long int reserved; unsigned long int Block_size; void (*copy_helper)(struct __block_literal_4 *dst, struct __block_literal_4 *src); void (*dispose_helper)(struct __block_literal_4 *); } __block_descriptor_4 = { 0, sizeof(struct __block_literal_4), __block_copy_4, __block_dispose_4, }; and where said Block is used: struct __block_literal_4 _block_literal = { &_NSConcreteStackBlock, (1<<25)|(1<<29), <uninitialized> __block_invoke_4, & __block_descriptor_4 existingBlock, }; Importing __attribute__((NSObject)) variables¶ GCC introduces __attribute__((NSObject)) on structure pointers to mean “this is an object”. This is useful because many low level data structures are declared as opaque structure pointers, e.g. CFStringRef, CFArrayRef, etc. When used from C, however, these are still really objects and are the second case where that requires copy and dispose helper functions to be generated. The copy helper functions generated by the compiler should use the _Block_object_assign runtime helper function and in the dispose helper the _Block_object_dispose runtime helper function should be called. For example, Block foo in the following: struct Opaque *__attribute__((NSObject)) objectPointer = ...; ... void (^foo)(void) = ^{ CFPrint(objectPointer); }; would have the following helper functions generated: void __block_copy_foo(struct __block_literal_5 *dst, struct __block_literal_5 *src) { _Block_object_assign(&dst->objectPointer, src-> objectPointer, BLOCK_FIELD_IS_OBJECT); } void __block_dispose_foo(struct __block_literal_5 *src) { _Block_object_dispose(src->objectPointer, BLOCK_FIELD_IS_OBJECT); } Imported __block marked variables¶ Layout of __block marked variables¶ The compiler must embed variables that are marked __block in a specialized structure of the form: struct _block_byref_foo { void *isa; struct Block_byref *forwarding; int flags; //refcount; int size; typeof(marked_variable) marked_variable; }; Variables of certain types require helper functions for when Block_copy() and Block_release() are performed upon a referencing Block. At the “C” level only variables that are of type Block or ones that have __attribute__((NSObject)) marked require helper functions. In Objective-C objects require helper functions and in C++ stack based objects require helper functions. Variables that require helper functions use the form: struct _block_byref_foo { void *isa; struct _block_byref_foo *forwarding; int flags; //refcount; int size; // helper functions called via Block_copy() and Block_release() void (*byref_keep)(void *dst, void *src); void (*byref_dispose)(void *); typeof(marked_variable) marked_variable; }; The structure is initialized such that: a. The forwarding pointer is set to the beginning of its enclosing structure. b. The size field is initialized to the total size of the enclosing structure. c. The flags field is set to either 0 if no helper functions are needed or (1<<25) if they are. The helper functions are initialized (if present). The variable itself is set to its initial value. The isa field is set to NULL. Access to __block variables from within its lexical scope¶ In order to “move” the variable to the heap upon a copy_helper operation the compiler must rewrite access to such a variable to be indirect through the structures forwarding pointer. For example: int __block i = 10; i = 11; would be rewritten to be: struct _block_byref_i { void *isa; struct _block_byref_i *forwarding; int flags; //refcount; int size; int captured_i; } i = { NULL, &i, 0, sizeof(struct _block_byref_i), 10 }; i.forwarding->captured_i = 11; In the case of a Block reference variable being marked __block the helper code generated must use the _Block_object_assign and _Block_object_dispose routines supplied by the runtime to make the copies. For example: __block void (voidBlock)(void) = blockA; voidBlock = blockB; would translate into: struct _block_byref_voidBlock { void *isa; struct _block_byref_voidBlock *forwarding; int flags; //refcount; int size; void (*byref_keep)(struct _block_byref_voidBlock *dst, struct _block_byref_voidBlock *src); void (*byref_dispose)(struct _block_byref_voidBlock *); void (^captured_voidBlock)(void); }; void _block_byref_keep_helper(struct _block_byref_voidBlock *dst, struct _block_byref_voidBlock *src) { //_Block_copy_assign(&dst->captured_voidBlock, src->captured_voidBlock, 0); _Block_object_assign(&dst->captured_voidBlock, src->captured_voidBlock, BLOCK_FIELD_IS_BLOCK | BLOCK_BYREF_CALLER); } void _block_byref_dispose_helper(struct _block_byref_voidBlock *param) { //_Block_destroy(param->captured_voidBlock, 0); _Block_object_dispose(param->captured_voidBlock, BLOCK_FIELD_IS_BLOCK | BLOCK_BYREF_CALLER)} and: struct _block_byref_voidBlock voidBlock = {( .forwarding=&voidBlock, .flags=(1<<25), .size=sizeof(struct _block_byref_voidBlock *), .byref_keep=_block_byref_keep_helper, .byref_dispose=_block_byref_dispose_helper, .captured_voidBlock=blockA )}; voidBlock.forwarding->captured_voidBlock = blockB; Importing __block variables into Blocks¶ A Block that uses a __block variable in its compound statement body must import the variable and emit copy_helper and dispose_helper helper functions that, in turn, call back into the runtime to actually copy or release the byref data block using the functions _Block_object_assign and _Block_object_dispose. For example: int __block i = 2; functioncall(^{ i = 10; }); would translate to: struct _block_byref_i { void *isa; // set to NULL struct _block_byref_voidBlock *forwarding; int flags; //refcount; int size; void (*byref_keep)(struct _block_byref_i *dst, struct _block_byref_i *src); void (*byref_dispose)(struct _block_byref_i *); int captured_i; }; struct __block_literal_5 { void *isa; int flags; int reserved; void (*invoke)(struct __block_literal_5 *); str'
