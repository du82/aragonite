title = "Clang Language Extensions — Clang 21.0.0git documentation"
full_description = 'Clang Language Extensions¶ Introduction Feature Checking Macros Include File Checking Macros Builtin Macros Implementation-defined keywords Vectors and Extended Vectors Matrix Types Half-Precision Floating Point Messages on deprecated and unavailable Attributes Attributes on Enumerators C++11 Attributes on using-declarations ‘User-Specified’ System Frameworks Checks for Standard Language Features Language Extensions Back-ported to Previous Standards Builtin type aliases Type Trait Primitives Blocks ASM Goto with Output Constraints Objective-C Features Initializer lists for complex numbers in C OpenCL Features WebAssembly Features Builtin Functions Non-standard C++11 Attributes Target-Specific Extensions Extensions for Static Analysis Extensions for Dynamic Analysis Extensions for selectively disabling optimization Extensions for loop hint optimizations Extensions to specify floating-point flags Extensions for controlling atomic code generation Specifying an attribute for multiple declarations (#pragma clang attribute) Specifying section names for global objects (#pragma clang section) Specifying Linker Options on ELF Targets Evaluating Object Size Deprecating Macros Restricted Expansion Macros Final Macros Line Control Intrinsics Support within Constant Expressions Debugging the Compiler Predefined Macros #embed Parameters Union and aggregate initialization in C Empty Objects in C Qualified function types in C Introduction¶ This document describes the language extensions provided by Clang. In addition to the language extensions listed here, Clang aims to support a broad range of GCC extensions. Please see the GCC manual for more information on these extensions. Feature Checking Macros¶ Language extensions can be very useful, but only if you know you can depend on them. In order to allow fine-grain features checks, we support three builtin function-like macros. This allows you to directly test for a feature in your code without having to resort to something like autoconf or fragile “compiler version checks”. __has_builtin¶ This function-like macro takes a single identifier argument that is the name of a builtin function, a builtin pseudo-function (taking one or more type arguments), or a builtin template. It evaluates to 1 if the builtin is supported or 0 if not. It can be used like this: #ifndef __has_builtin // Optional of course. #define __has_builtin(x) 0 // Compatibility with non-clang compilers. #endif ... #if __has_builtin(__builtin_trap) __builtin_trap(); #else abort(); #endif ... Note Prior to Clang 10, __has_builtin could not be used to detect most builtin pseudo-functions. __has_builtin should not be used to detect support for a builtin macro; use #ifdef instead. __has_constexpr_builtin¶ This function-like macro takes a single identifier argument that is the name of a builtin function, a builtin pseudo-function (taking one or more type arguments), or a builtin template. It evaluates to 1 if the builtin is supported and can be constant evaluated or 0 if not. It can be used for writing conditionally constexpr code like this: #ifndef __has_constexpr_builtin // Optional of course. #define __has_constexpr_builtin(x) 0 // Compatibility with non-clang compilers. #endif ... #if __has_constexpr_builtin(__builtin_fmax) constexpr #endif double money_fee(double amount) { return __builtin_fmax(amount * 0.03, 10.0); } ... For example, __has_constexpr_builtin is used in libcxx’s implementation of the <cmath> header file to conditionally make a function constexpr whenever the constant evaluation of the corresponding builtin (for example, std::fmax calls __builtin_fmax) is supported in Clang. __has_feature and __has_extension¶ These function-like macros take a single identifier argument that is the name of a feature. __has_feature evaluates to 1 if the feature is both supported by Clang and standardized in the current language standard or 0 if not (but see below), while __has_extension evaluates to 1 if the feature is supported by Clang in the current language (either as a language extension or a standard language feature) or 0 if not. They can be used like this: #ifndef __has_feature // Optional of course. #define __has_feature(x) 0 // Compatibility with non-clang compilers. #endif #ifndef __has_extension #define __has_extension __has_feature // Compatibility with pre-3.0 compilers. #endif ... #if __has_feature(cxx_rvalue_references) // This code will only be compiled with the -std=c++11 and -std=gnu++11 // options, because rvalue references are only standardized in C++11. #endif #if __has_extension(cxx_rvalue_references) // This code will be compiled with the -std=c++11, -std=gnu++11, -std=c++98 // and -std=gnu++98 options, because rvalue references are supported as a // language extension in C++98. #endif For backward compatibility, __has_feature can also be used to test for support for non-standardized features, i.e. features not prefixed c_, cxx_ or objc_. Another use of __has_feature is to check for compiler features not related to the language standard, such as e.g. AddressSanitizer. If the -pedantic-errors option is given, __has_extension is equivalent to __has_feature. The feature tag is described along with the language feature below. The feature name or extension name can also be specified with a preceding and following __ (double underscore) to avoid interference from a macro with the same name. For instance, __cxx_rvalue_references__ can be used instead of cxx_rvalue_references. __has_cpp_attribute¶ This function-like macro is available in C++20 by default, and is provided as an extension in earlier language standards. It takes a single argument that is the name of a double-square-bracket-style attribute. The argument can either be a single identifier or a scoped identifier. If the attribute is supported, a nonzero value is returned. If the attribute is a standards-based attribute, this macro returns a nonzero value based on the year and month in which the attribute was voted into the working draft. See WG21 SD-6 for the list of values returned for standards-based attributes. If the attribute is not supported by the current compilation target, this macro evaluates to 0. It can be used like this: #ifndef __has_cpp_attribute // For backwards compatibility #define __has_cpp_attribute(x) 0 #endif ... #if __has_cpp_attribute(clang::fallthrough) #define FALLTHROUGH [[clang::fallthrough]] #else #define FALLTHROUGH #endif ... The attribute scope tokens clang and _Clang are interchangeable, as are the attribute scope tokens gnu and __gnu__. Attribute tokens in either of these namespaces can be specified with a preceding and following __ (double underscore) to avoid interference from a macro with the same name. For instance, gnu::__const__ can be used instead of gnu::const. __has_c_attribute¶ This function-like macro takes a single argument that is the name of an attribute exposed with the double square-bracket syntax in C mode. The argument can either be a single identifier or a scoped identifier. If the attribute is supported, a nonzero value is returned. If the attribute is not supported by the current compilation target, this macro evaluates to 0. It can be used like this: #ifndef __has_c_attribute // Optional of course. #define __has_c_attribute(x) 0 // Compatibility with non-clang compilers. #endif ... #if __has_c_attribute(fallthrough) #define FALLTHROUGH [[fallthrough]] #else #define FALLTHROUGH #endif ... The attribute scope tokens clang and _Clang are interchangeable, as are the attribute scope tokens gnu and __gnu__. Attribute tokens in either of these namespaces can be specified with a preceding and following __ (double underscore) to avoid interference from a macro with the same name. For instance, gnu::__const__ can be used instead of gnu::const. __has_attribute¶ This function-like macro takes a single identifier argument that is the name of a GNU-style attribute. It evaluates to 1 if the attribute is supported by the current compilation target, or 0 if not. It can be used like this: #ifndef __has_attribute // Optional of course. #define __has_attribute(x) 0 // Compatibility with non-clang compilers. #endif ... #if __has_attribute(always_inline) #define ALWAYS_INLINE __attribute__((always_inline)) #else #define ALWAYS_INLINE #endif ... The attribute name can also be specified with a preceding and following __ (double underscore) to avoid interference from a macro with the same name. For instance, __always_inline__ can be used instead of always_inline. __has_declspec_attribute¶ This function-like macro takes a single identifier argument that is the name of an attribute implemented as a Microsoft-style __declspec attribute. It evaluates to 1 if the attribute is supported by the current compilation target, or 0 if not. It can be used like this: #ifndef __has_declspec_attribute // Optional of course. #define __has_declspec_attribute(x) 0 // Compatibility with non-clang compilers. #endif ... #if __has_declspec_attribute(dllexport) #define DLLEXPORT __declspec(dllexport) #else #define DLLEXPORT #endif ... The attribute name can also be specified with a preceding and following __ (double underscore) to avoid interference from a macro with the same name. For instance, __dllexport__ can be used instead of dllexport. __is_identifier¶ This function-like macro takes a single identifier argument that might be either a reserved word or a regular identifier. It evaluates to 1 if the argument is just a regular identifier and not a reserved word, in the sense that it can then be used as the name of a user-defined function or variable. Otherwise it evaluates to 0. It can be used like this: ... #ifdef __is_identifier // Compatibility with non-clang compilers. #if __is_identifier(__wchar_t) typedef wchar_t __wchar_t; #endif #endif __wchar_t WideCharacter; ... Include File Checking Macros¶ Not all developments systems have the same include files. The __has_include and __has_include_next macros allow you to check for the existence of an include file before doing a possibly failing #include directive. Include file checking macros must be used as expressions in #if or #elif preprocessing directives. __has_include¶ This function-like macro takes a single file name string argument that is the name of an include file. It evaluates to 1 if the file can be found using the include paths, or 0 otherwise: // Note the two possible file name string formats. #if __has_include("myinclude.h") && __has_include(<stdint.h>) # include "myinclude.h" #endif To test for this feature, use #if defined(__has_include): // To avoid problem with non-clang compilers not having this macro. #if defined(__has_include) #if __has_include("myinclude.h") # include "myinclude.h" #endif #endif __has_include_next¶ This function-like macro takes a single file name string argument that is the name of an include file. It is like __has_include except that it looks for the second instance of the given file found in the include paths. It evaluates to 1 if the second instance of the file can be found using the include paths, or 0 otherwise: // Note the two possible file name string formats. #if __has_include_next("myinclude.h") && __has_include_next(<stdint.h>) # include_next "myinclude.h" #endif // To avoid problem with non-clang compilers not having this macro. #if defined(__has_include_next) #if __has_include_next("myinclude.h") # include_next "myinclude.h" #endif #endif Note that __has_include_next, like the GNU extension #include_next directive, is intended for use in headers only, and will issue a warning if used in the top-level compilation file. A warning will also be issued if an absolute path is used in the file argument. __has_warning¶ This function-like macro takes a string literal that represents a command line option for a warning and returns true if that is a valid warning option. #if __has_warning("-Wformat") ... #endif Builtin Macros¶ __BASE_FILE__Defined to a string that contains the name of the main input file passed to Clang. __FILE_NAME__Clang-specific extension that functions similar to __FILE__ but only renders the last path component (the filename) instead of an invocation dependent full path to that file. __COUNTER__Defined to an integer value that starts at zero and is incremented each time the __COUNTER__ macro is expanded. __INCLUDE_LEVEL__Defined to an integral value that is the include depth of the file currently being translated. For the main file, this value is zero. __TIMESTAMP__Defined to the date and time of the last modification of the current source file. __clang__Defined when compiling with Clang __clang_major__Defined to the major marketing version number of Clang (e.g., the 2 in 2.0.1). Note that marketing version numbers should not be used to check for language features, as different vendors use different numbering schemes. Instead, use the Feature Checking Macros. __clang_minor__Defined to the minor version number of Clang (e.g., the 0 in 2.0.1). Note that marketing version numbers should not be used to check for language features, as different vendors use different numbering schemes. Instead, use the Feature Checking Macros. __clang_patchlevel__Defined to the marketing patch level of Clang (e.g., the 1 in 2.0.1). __clang_version__Defined to a string that captures the Clang marketing version, including the Subversion tag or revision number, e.g., “1.5 (trunk 102332)”. __clang_literal_encoding__Defined to a narrow string literal that represents the current encoding of narrow string literals, e.g., "hello". This macro typically expands to “UTF-8” (but may change in the future if the -fexec-charset="Encoding-Name" option is implemented.) __clang_wide_literal_encoding__Defined to a narrow string literal that represents the current encoding of wide string literals, e.g., L"hello". This macro typically expands to “UTF-16” or “UTF-32” (but may change in the future if the -fwide-exec-charset="Encoding-Name" option is implemented.) Implementation-defined keywords¶ __datasizeof¶ __datasizeof behaves like sizeof, except that it returns the size of the type ignoring tail padding. _BitInt, _ExtInt¶ Clang supports the C23 _BitInt(N) feature as an extension in older C modes and in C++. This type was previously implemented in Clang with the same semantics, but spelled _ExtInt(N). This spelling has been deprecated in favor of the standard type. Note: the ABI for _BitInt(N) is still in the process of being stabilized, so this type should not yet be used in interfaces that require ABI stability. C keywords supported in all language modes¶ Clang supports _Alignas, _Alignof, _Atomic, _Complex, _Generic, _Imaginary, _Noreturn, _Static_assert, _Thread_local, and _Float16 in all language modes with the C semantics. __alignof, __alignof__¶ __alignof and __alignof__ return, in contrast to _Alignof and alignof, the preferred alignment of a type. This may be larger than the required alignment for improved performance. __extension__¶ __extension__ suppres'
