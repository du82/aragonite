st constant consumable_auto_cast_state consumable_set_state_on_read device exclusive_locks_required, requires_capability, requires_shared_capability, shared_locks_required exclusive_trylock_function ext_vector_type format_arg global guarded_by guarded_var host ibaction iboutlet iboutletcollection intel_ocl_bicc interrupt interrupt kernel launch_bounds lock_returned lockable locks_excluded matrix_type may_alias mips16 mode ms_struct naked neon_polyvector_type neon_vector_type no_instrument_function no_thread_safety_analysis nocommon nomips16 noreturn nvptx_kernel objc_arc_weak_reference_unavailable objc_bridge objc_bridge_mutable objc_bridge_related objc_designated_initializer objc_exception objc_gc objc_independent_class objc_ownership objc_precise_lifetime objc_protocol_requires_explicit_implementation objc_requires_property_definitions objc_returns_inner_pointer objc_root_class packed pascal pt_guarded_by pt_guarded_var ptrauth_vtable_pointer pure reqd_work_group_size returns_twice scoped_lockable sentinel shared shared_trylock_function unavailable uuid vec_type_hint vecreturn vector_size visibility warn_unused weak_import weakref work_group_size_hint Variable Attributes HLSL Parameter Modifiers always_destroy called_once clang::code_align cleanup dllexport dllimport groupshared init_priority init_seg leaf loader_uninitialized maybe_undef maybe_unused, unused model no_destroy nodebug noescape nosvm objc_externally_retained pass_object_size, pass_dynamic_object_size require_constant_initialization, constinit (C++20) section, __declspec(allocate) standalone_debug swift_async_context swift_context swift_error_result swift_indirect_result swiftasynccall swiftcall thread tls_model uninitialized Introduction¶ This page lists the attributes currently supported by Clang. AArch64 SME Attributes¶ Clang supports a number of AArch64-specific attributes to manage state added by the Scalable Matrix Extension (SME). This state includes the runtime mode that the processor is in (e.g. non-streaming or streaming) as well as the state of the ZA Matrix Storage. The attributes come in the form of type- and declaration attributes: The SME declaration attributes can appear anywhere that a standard [[...]] declaration attribute can appear. The SME type attributes apply only to prototyped functions and can appear anywhere that a standard [[...]] type attribute can appear. The SME type attributes do not apply to functions having a K&R-style unprototyped function type. See Arm C Language Extensions for more details about the features related to the SME extension. See Procedure Call Standard for the Arm® 64-bit Architecture (AArch64) for more details about streaming-interface functions and shared/private-ZA interface functions. __arm_agnostic¶ Supported Syntaxes¶ GNU C++11 C23 __declspec Keyword #pragma HLSL Annotation #pragma clang attribute __arm_agnostic The __arm_agnostic keyword applies to prototyped function types and affects the function’s calling convention for a given state S. This attribute allows the user to describe a function that preserves S, without requiring the function to share S with its callers and without making the assumption that S exists. If a function has the __arm_agnostic(S) attribute and calls a function without this attribute, then the function’s object code will contain code to preserve state S. Otherwise, the function’s object code will be the same as if it did not have the attribute. The attribute takes string arguments to describe state S. The supported states are: "sme_za_state" for state enabled by PSTATE.ZA, such as ZA and ZT0. The attribute __arm_agnostic("sme_za_state") cannot be used in conjunction with __arm_in(S), __arm_out(S), __arm_inout(S) or __arm_preserves(S) where state S describes state enabled by PSTATE.ZA, such as “za” or “zt0”. __arm_in¶ Supported Syntaxes¶ GNU C++11 C23 __declspec Keyword #pragma HLSL Annotation #pragma clang attribute __arm_in The __arm_in keyword applies to prototyped function types and specifies that the function shares a given state S with its caller. For __arm_in, the function takes the state S as input and returns with the state S unchanged. The attribute takes string arguments to instruct the compiler which state is shared. The supported states for S are: "za" for Matrix Storage (requires SME) The attributes __arm_in(S), __arm_out(S), __arm_inout(S) and __arm_preserves(S) are all mutually exclusive for the same state S. __arm_inout¶ Supported Syntaxes¶ GNU C++11 C23 __declspec Keyword #pragma HLSL Annotation #pragma clang attribute __arm_inout The __arm_inout keyword applies to prototyped function types and specifies that the function shares a given state S with its caller. For __arm_inout, the function takes the state S as input and returns new state for S. The attribute takes string arguments to instruct the compiler which state is shared. The supported states for S are: "za" for Matrix Storage (requires SME) The attributes __arm_in(S), __arm_out(S), __arm_inout(S) and __arm_preserves(S) are all mutually exclusive for the same state S. __arm_locally_streaming¶ Supported Syntaxes¶ GNU C++11 C23 __declspec Keyword #pragma HLSL Annotation #pragma clang attribute __arm_locally_streaming The __arm_locally_streaming keyword applies to function declarations and specifies that all the statements in the function are executed in streaming mode. This means that: the function requires that the target processor implements the Scalable Matrix Extension (SME). the program automatically puts the machine into streaming mode before executing the statements and automatically restores the previous mode afterwards. Clang manages PSTATE.SM automatically; it is not the source code’s responsibility to do this. For example, Clang will emit code to enable streaming mode at the start of the function, and disable streaming mode at the end of the function. __arm_new¶ Supported Syntaxes¶ GNU C++11 C23 __declspec Keyword #pragma HLSL Annotation #pragma clang attribute __arm_new The __arm_new keyword applies to function declarations and specifies that the function will create a new scope for state S. The attribute takes string arguments to instruct the compiler for which state to create new scope. The supported states for S are: "za" for Matrix Storage (requires SME) For state "za", this means that: the function requires that the target processor implements the Scalable Matrix Extension (SME). the function will commit any lazily saved ZA data. the function will create a new ZA context and enable PSTATE.ZA. the function will disable PSTATE.ZA (by setting it to 0) before returning. For __arm_new("za") functions Clang will set up the ZA context automatically on entry to the function and disable it before returning. For example, if ZA is in a dormant state Clang will generate the code to commit a lazy-save and set up a new ZA state before executing user code. __arm_out¶ Supported Syntaxes¶ GNU C++11 C23 __declspec Keyword #pragma HLSL Annotation #pragma clang attribute __arm_out The __arm_out keyword applies to prototyped function types and specifies that the function shares a given state S with its caller. For __arm_out, the function ignores the incoming state for S and returns new state for S. The attribute takes string arguments to instruct the compiler which state is shared. The supported states for S are: "za" for Matrix Storage (requires SME) The attributes __arm_in(S), __arm_out(S), __arm_inout(S) and __arm_preserves(S) are all mutually exclusive for the same state S. __arm_preserves¶ Supported Syntaxes¶ GNU C++11 C23 __declspec Keyword #pragma HLSL Annotation #pragma clang attribute __arm_preserves The __arm_preserves keyword applies to prototyped function types and specifies that the function does not read a given state S and returns with state S unchanged. The attribute takes string arguments to instruct the compiler which state is shared. The supported states for S are: "za" for Matrix Storage (requires SME) The attributes __arm_in(S), __arm_out(S), __arm_inout(S) and __arm_preserves(S) are all mutually exclusive for the same state S. __arm_streaming¶ Supported Syntaxes¶ GNU C++11 C23 __declspec Keyword #pragma HLSL Annotation #pragma clang attribute __arm_streaming The __arm_streaming keyword applies to prototyped function types and specifies that the function has a “streaming interface”. This means that: the function requires that the processor implements the Scalable Matrix Extension (SME). the function must be entered in streaming mode (that is, with PSTATE.SM set to 1) the function must return in streaming mode Clang manages PSTATE.SM automatically; it is not the source code’s responsibility to do this. For example, if a non-streaming function calls an __arm_streaming function, Clang generates code that switches into streaming mode before calling the function and switches back to non-streaming mode on return. __arm_streaming_compatible¶ Supported Syntaxes¶ GNU C++11 C23 __declspec Keyword #pragma HLSL Annotation #pra'
