full_description = '''C Defect Report Support in Clang C defect report implementation status This page tracks which C defect reports are implemented within Clang. The implementation status for defect reports against the C Standard are currently under investigation. Any defect report whose status in Clang is currently unknown will be marked in purple. The LLVM bug tracker uses the "c", "c99", "c11", "c17", and "c23" labels to track known bugs with Clang's language conformance. Number Status Issue title Available in Clang? 1 C89 Do functions return values by copying? Yes 2 NAD Subclause 6.8.3.2: Semantics of # Unknown 3 NAD Subclause 6.1.8: Preprocessing numbers Unknown 4 NAD Are multiple definitions of unused identifiers with external linkage permitted? Yes 5 NAD May a conforming implementation define and recognize a pragma which would change the semantics of the language? Yes 6 C89 It is unclear how the strtoul function behaves when presented with a subject sequence that begins with a minus sign N/A 7 NAD Are declarations of the form struct-or-union identifier ; permitted after the identifier tag has already been declared? Yes 8 NAD Can a conforming C compiler to perform dead-store elimination? Yes 9 C89 Use of typedef names in parameter declarations No 10 NAD Is a typedef to an incomplete type legal? Yes 11 C89 Merging of declarations for linked identifier Yes 12 NAD Is it valid to take the address of a dereferenced void pointer? Yes 13 C89 Compatible and composite function types Yes 14 C89 Issues with setjmp and fscanf descriptions N/A 15 NAD What is the promoted type of a plain int bit-field? Yes 16 C89 What does static storage duration do when zero for the type is not all zero bits? Unknown 17 C89 39 unrelated questions about C89 Unknown 18 NAD How does fscanf behave in the presence of multibyte characters? N/A 19 NAD Definition of the term "printing character" and isgraph() N/A 20 NAD Is a compiler which allows the Relaxed Ref/Def linkage model to be considered