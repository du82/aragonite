ions about declaration conformance Yes 48 NAD Clarifications on the abort() function N/A 49 C89 Can strxfrm() output more characters than were input? N/A 50 NAD Do wide string literals implicitly include <stddef.h>? Yes 51 NAD Question on pointer arithmetic Yes 52 C89 Editorial corrections Yes 53 C89 Accessing a pointer to a function with a prototype through a pointer to pointer to function without a prototype Yes 54 C89 Can the string handling functions have a length of 0? N/A 55 C89 Signal handler macros should have distinct values N/A 56 NAD Floating-point representation precision requirements Yes 57 NAD Is there an integral type for every pointer? Yes 58 NAD Is there a limit on the number of digits processed by scanf and strtdo? N/A 59 NAD Do types have to be completed? Yes 60 C89 Array initialization from a string literal Yes 61 NAD Whitespace in scanf format string N/A 62 NAD Can the rename function be defined to fail? N/A 63 Dup Floating-point representation precision requirements Duplicate of 56 64 NAD Null pointer constants Yes 65 C89 Questions on locales N/A 66 NAD Another question on locales N/A 67 NAD Integer and integral type confusion Yes 68 NAD 'char' and signed vs unsigned integer types Yes 69 NAD Questions about the representation of integer types Yes 70 NAD Interchangeability of function arguments Yes 71 C89 Enumerated types Yes 72 NAD Definition of object and pointer arithmetic Unknown 73 NAD Definition of object and array access Unknown 74 NAD Alignment and structure padding Unknown 75 NAD Alignment of allocated memory N/A 76 Open Pointers to the end of arrays Not resolved 77 NAD Stability of addresses Yes 78 NAD Uniqueness of addresses Unknown 79 NAD Constancy of system library function addresses N/A 80 C89 Merging of string constants Yes 81 NAD Left shift operator Yes 82 C89 Multiple varargs Unknown 83 C89 Use of library functions N/A 84 NAD Incomplete type in function declaration Yes 85 C89 Returning from main Yes 86 NAD Object-like macros in system headers Yes 87 NAD Order of evaluation Yes 88 NAD Compatibility of incomplete types Yes 89 C89 Multiple definitions of macros Yes 90 NAD Multibyte characters in formats N/A 91 NAD Multibyte encodings Yes 92 Dup Partial initialization of strings Duplicate of 60 93 C89 Reservation of identifiers Yes 94 NAD Are constraints on function return the same as assignment? Yes 95 NAD Is initialization as constrained as assignment? Yes 96 NAD Arrays of incomplete types Yes 97 Dup Use of offsetof with an incomplete type Duplicate of 40 98 NAD Pre/post increment/decrement of function or incomplete types Yes 99 NAD ANSI/ISO C Defect report #rfg6 Unknown 100 Dup Defect with the return statement Duplicate of 1 101 C89 Type qualifiers and "as if by assignment" Yes 102 NAD Tag redeclaration constraints Yes 103 NAD Formal parameters of incomplete type Yes 104 Dup Incomplete tag types in a parameter list Duplicate of 84 105 Dup Precedence of requirements on compatible types Duplicate of 17 106 NAD When can you dereference a void pointer? Yes 107 NAD Type requirements of the assert macro parameter N/A 108 NAD Can a macro identifier hide a keyword? Yes 109 NAD Are undefined values and undefined behavior the same? Yes 110 Dup Formal parameters having array-of-non-object types Duplicate of 47 111 NAD Conversion of pointer-to-qualified type values to type (void*) values Yes 112 NAD Null pointer constants and relational comparisons Yes 113 NAD Return expressions in functions declared to return qualified void Yes 114 NAD Initialization of multi-dimensional char array objects Yes 115 NAD Member declarators as declarators Yes 116 NAD Implicit unary & applied to register arrays Yes 117 NAD Abstract semantics, sequence points, and expression evaluation Yes 118 C89 Completion point for enumerated types Yes 119 NAD Initialization of multi-dimensional array objects Yes 120 NAD Semantics of assignment to (and initialization of) bit-fields Yes 121 NAD Conversions of pointer values to integral types Yes 122 Dup Conversion/widening of bit-fields Duplicate of 15 123 NAD 'Type categories' and qualified types Yes 124 C89 Casts to 'a void type' versus casts to 'the void type' Yes 125 NAD Using things declared as 'extern (qualified) void' Yes 126 NAD What does 'synonym' mean with respect to typedef names? Yes 127 Dup Composite type of an enumerated type and an integral type Duplicate of 13 128 NAD Editorial issue relating to tag declarations in type specifiers Yes 129 NAD Tags and name spaces Yes 130 NAD Guarantees when writing text to a stream N/A 131 C89 const member qualification and assignment Yes 132 Dup Can undefined behavior occur at translation time, or only at run time? Duplicate of 109 133 NAD Undefined behavior not previously listed in subclause G2 Yes 134 NAD What is an 'error number' for strerror? N/A 135 NAD Can the size argument to 'fwrite' be zero? N/A 136 NAD 'mktime' and time gaps N/A 137 NAD 'printf' and negative floating point values N/A 138 C89 Is there an allocated storage duration? Yes 139 C89 Compatibility of complete and incomplete types Yes 140 NAD Behavior of 'setvbuf' N/A 141 NAD What is the meaning of EOF? N/A 142 C89 Reservation of macro names Yes 143 C89 'fopen' modes N/A 144 C89 Preprocessing of preprocessing directives Yes 145 C89 Constant expressions Unknown 146 C89 Nugatory constraint Yes 147 C89 Sequence points in library functions Yes 148 NAD Defining library functions Yes 149 C89 The term "variable" Yes 150 C89 Initialization of a char array from a string literal Yes 151 C89 Behavior of 'printf' and flags N/A 152 NAD Can you 'longjmp' out of a signal handler? N/A 153 Dup Can 'f()' be considered a call to a function-like macro with one empty argument? Duplicate of 3 154 NAD Consistency of implementation-defined values Yes 155 C89 Zero-sized allocations N/A 156 C89 Closed streams N/A 157 C89 Legitimacy of type synonyms Yes 158 C89 Null pointer conversions Yes 159 C89 Consistency of the C Standard Defects exist in the way the St