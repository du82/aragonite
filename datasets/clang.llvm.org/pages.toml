title = "Objective-C Automatic Reference Counting (ARC) — Clang 21.0.0git documentation"
full_description = '.arc-term { font-style: italic; font-weight: bold; } .revision { font-style: italic; } .when-revised { font-weight: bold; font-style: normal; } /* * Automatic numbering is described in this article: * https://dev.opera.com/articles/view/automatic-numbering-with-css-counters/ */ /* * Automatic numbering for the TOC. * This is wrong from the semantics point of view, since it is an ordered * list, but uses "ul" tag. */ div#contents.contents.local ul { counter-reset: toc-section; list-style-type: none; } div#contents.contents.local ul li { counter-increment: toc-section; background: none; // Remove bullets } div#contents.contents.local ul li a.reference:before { content: counters(toc-section, ".") " "; } /* Automatic numbering for the body. */ body { counter-reset: section subsection subsubsection; } .section h2 { counter-reset: subsection subsubsection; counter-increment: section; } .section h2 a.toc-backref:before { content: counter(section) " "; } .section h3 { counter-reset: subsubsection; counter-increment: subsection; } .section h3 a.toc-backref:before { content: counter(section) "." counter(subsection) " "; } .section h4 { counter-increment: subsubsection; } .section h4 a.toc-backref:before { content: counter(section) "." counter(subsection) "." counter(subsubsection) " "; } Objective-C Automatic Reference Counting (ARC)¶ About this document Purpose Background Evolution General Retainable object pointers Retain count semantics Retainable object pointers as operands and arguments Consumed parameters Retained return values Unretained return values Bridged casts Restrictions Conversion of retainable object pointers Conversion to retainable object pointer type of expressions with known semantics Conversion from retainable object pointer type in certain contexts Ownership qualification Spelling Property declarations Semantics Restrictions Weak-unavailable types Storage duration of __autoreleasing objects Conversion of pointers to ownership-qualified types Passing to an out parameter by writeback Ownership-qualified fields of structs and unions Formal rules for non-trivial types in C Application of the formal C rules to nontrivial ownership qualifiers C/C++ compatibility for structs and unions with non-trivial members Ownership inference Objects Indirect parameters Template arguments Method families Explicit method family control Semantics of method families Semantics of init Related result types Optimization Object liveness No object lifetime extension Precise lifetime semantics Miscellaneous Special methods Memory management methods dealloc @autoreleasepool Externally-Retained Variables self Fast enumeration iteration variables Blocks Exceptions Interior pointers C retainable pointer types Auditing of C retainable pointer interfaces Runtime support id objc_autorelease(id value); void objc_autoreleasePoolPop(void *pool); void *objc_autoreleasePoolPush(void); id objc_autoreleaseReturnValue(id value); void objc_copyWeak(id *dest, id *src); void objc_destroyWeak(id *object); id objc_initWeak(id *object, id value); id objc_loadWeak(id *object); id objc_loadWeakRetained(id *object); void objc_moveWeak(id *dest, id *src); void objc_release(id value); id objc_retain(id value); id objc_retainAutorelease(id value); id objc_retainAutoreleaseReturnValue(id value); id objc_retainAutoreleasedReturnValue(id value); id objc_retainBlock(id value); void objc_storeStrong(id *object, id value); id objc_storeWeak(id *object, id value); id objc_unsafeClaimAutoreleasedReturnValue(id value); About this document¶ Purpose¶ The first and primary purpose of this document is to serve as a complete technical specification of Automatic Reference Counting. Given a core Objective-C compiler and runtime, it should be possible to write a compiler and runtime which implements these new semantics. The secondary purpose is to act as a rationale for why ARC was designed in this way. This should remain tightly focused on the technical design and should not stray into marketing speculation. Background¶ This document assumes a basic familiarity with C. Blocks are a C language extension for creating anonymous functions. Users interact with and transfer block objects using block pointers, which are represented like a normal pointer. A block may capture values from local variables; when this occurs, memory must be dynamically allocated. The initial allocation is done on the stack, but the runtime provides a Block_copy function which, given a block pointer, either copies the underlying block object to the heap, setting its reference count to 1 and returning the new block pointer, or (if the block object is already on the heap) increases its reference count by 1. The paired function is Block_release, which decreases the reference count by 1 and destroys the object if the count reaches zero and is on the heap. Objective-C is a set of language extensions, significant enough to be considered a different language. It is a strict superset of C. The extensions can also be imposed on C++, producing a language called Objective-C++. The primary feature is a single-inheritance object system; we briefly describe the modern dialect. Objective-C defines a new type kind, collectively called the object pointer types. This kind has two notable builtin members, id and Class; id is the final supertype of all object pointers. The validity of conversions between object pointer types is not checked at runtime. Users may define classes; each class is a type, and the pointer to that type is an object pointer type. A class may have a superclass; its pointer type is a subtype of its superclass’s pointer type. A class has a set of ivars, fields which appear on all instances of that class. For every class T there’s an associated metaclass; it has no fields, its superclass is the metaclass of T’s superclass, and its metaclass is a global class. Every class has a global object whose class is the class’s metaclass; metaclasses have no associated type, so pointers to this object have type Class. A class declaration (@interface) declares a set of methods. A method has a return type, a list of argument types, and a selector: a name like foo:bar:baz:, where the number of colons corresponds to the number of formal arguments. A method may be an instance method, in which case it can be invoked on objects of the class, or a class method, in which case it can be invoked on objects of the metaclass. A method may be invoked by providing an object (called the receiver) and a list of formal arguments interspersed with the selector, like so: [receiver foo: fooArg bar: barArg baz: bazArg] This looks in the dynamic class of the receiver for a method with this name, then in that class’s superclass, etc., until it finds something it can execute. The receiver “expression” may also be the name of a class, in which case the actual receiver is the class object for that class, or (within method definitions) it may be super, in which case the lookup algorithm starts with the static superclass instead of the dynamic class. The actual methods dynamically found in a class are not those declared in the @interface, but those defined in a separate @implementation declaration; however, when compiling a call, typechecking is done based on the methods declared in the @interface. Method declarations may also be grouped into protocols, which are not inherently associated with any class, but which classes may claim to follow. Object pointer types may be qualified with additional protocols that the object is known to support. Class extensions are collections of ivars and methods, designed to allow a class’s @interface to be split across multiple files; however, there is still a primary implementation file which must see the @interfaces of all class extensions. Categories allow methods (but not ivars) to be declared post hoc on an arbitrary class; the methods in the category’s @implementation will be dynamically added to that class’s method tables which the category is loaded at runtime, replacing those methods in case of a collision. In the standard environment, objects are allocated on the heap, and their lifetime is manually managed using a reference count. This is done using two instance methods which all classes are expected to implement: retain increases the object’s reference count by 1, whereas release decreases it by 1 and calls the instance method dealloc if the count reaches 0. To simplify certain operations, there is also an autorelease pool, a thread-local list of objects to call release on later; an object can be added to this pool by calling autorelease on it. Block pointers may be converted to type id; block objects are laid out in a way that makes them compatible with Objective-C objects. There is a builtin class that all block objects are considered to be objects of; this class implements retain by adjusting the reference count, not by calling Block_copy. Evolution¶ ARC is under continual evolution, and this document must be updated as the language progresses. If a change increases the expressiveness of the language, for example by lifting a restriction or by adding new syntax, the change will be annotated with a revision marker, like so: ARC applies to Objective-C pointer types, block pointer types, and [beginning Apple 8.0, LLVM 3.8] BPTRs declared within extern "BCPL" blocks. For now, it is sensible to version this document by the releases of its sole implementation (and its host project), clang. “LLVM X.Y” refers to an open-source release of clang from the LLVM project. “Apple X.Y” refers to an Apple-provided release of the Apple LLVM Compiler. Other organizations that prepare their own, separately-versioned clang releases and wish to maintain similar information in this document should send requests to cfe-dev. If a change decreases the expressiveness of the language, for example by imposing a new restriction, this should be taken as an oversight in the original specification and something to be avoided in all versions. Such changes are generally to be avoided. General¶ Automatic Reference Counting implements automatic memory management for Objective-C objects and blocks, freeing the programmer from the need to explicitly insert retains and releases. It does not provide a cycle collector; users must explicitly manage the lifetime of their objects, breaking cycles manually or with weak or unsafe references. ARC may be explicitly enabled with the compiler flag -fobjc-arc. It may also be explicitly disabled with the compiler flag -fno-objc-arc. The last of these two flags appearing on the compile line “wins”. If ARC is enabled, __has_feature(objc_arc) will expand to 1 in the preprocessor. For more information about __has_feature, see the language extensions document. Retainable object pointers¶ This section describes retainable object pointers, their basic operations, and the restrictions imposed on their use under ARC. Note in particular that it covers the rules for pointer values (patterns of bits indicating the location of a pointed-to object), not pointer objects (locations in memory which store pointer values). The rules for objects are covered in the next section. A retainable object pointer (or “retainable pointer”) is a value of a retainable object pointer type (“retainable type”). There are three kinds of retainable object pointer types: block pointers (formed by applying the caret (^) declarator sigil to a function type) Objective-C object pointers (id, Class, NSFoo*, etc.) typedefs marked with __attribute__((NSObject)) Other pointer types, such as int* and CFStringRef, are not subject to ARC’s semantics and restrictions. Rationale We are not at liberty to require all code to be recompiled with ARC; therefore, ARC must interoperate with Objective-C code which manages retains and releases manually. In general, there are three requirements in order for a compiler-supported reference-count system to provide reliable interoperation: The type system must reliably identify which objects are to be managed. An int* might be a pointer to a malloc’ed array, or it might be an interior pointer to such an array, or it might point to some field or local variable. In contrast, values of the retainable object pointer types are never interior. The type system must reliably indicate how to manage objects of a type. This usually means that the type must imply a procedure for incrementing and decrementing retain counts. Supporting single-ownership objects requires a lot more explicit mediation in the language. There must be reliable conventions for whether and when “ownership” is passed between caller and callee, for both arguments and return values. Objective-C methods follow such a convention very reliably, at least for system libraries on macOS, and functions always pass objects at +0. The C-based APIs for Core Foundation objects, on the other hand, have much more varied transfer semantics. The use of __attribute__((NSObject)) typedefs is not recommended. If it’s absolutely necessary to use this attribute, be very explicit about using the typedef, and do not assume that it will be preserved by language features like __typeof and C++ template argument substitution. Rationale Any compiler operation which incidentally strips type “sugar” from a type will yield a type without the attribute, which may result in unexpected behavior. Retain count semantics¶ A retainable object pointer is either a null pointer or a pointer to a valid object. Furthermore, if it has block pointer type and is not null then it must actually be a pointer to a block object, and if it has Class type (possibly protocol-qualified) then it must actually be a pointer to a class object. Otherwise ARC does not enforce the Objective-C type system as long as the implementing methods follow the signature of the static type. It is undefined behavior if ARC is exposed to an invalid pointer. For ARC’s purposes, a valid object is one with “well-behaved” retaining operations. Specifically, the object must be laid out such that the Objective-C message send machinery can successfully send it the following messages: retain, taking no arguments and returning a pointer to the object. release, taking no arguments and returning void. autorelease, taking no arguments and returning a pointer to the object. The behavior of these methods is constrained in the following ways. The term high-level semantics is an intentionally vague term; the intent is that programmers must implement these methods in a way such that the compiler, modifying code in ways it deems safe according to these constraints, will not violate their requirements. For example, if the user puts logging statements in retain, they should not be surprised if those statements are executed more or less often depending on optimization settings. These constraints are not exhaustive of the optimization opportunities: values held in local variables are subject to additional restrictions, described later in this'
