title = "Clang - C++ Programming Language Status"
full_description = '''C++ Support in Clang Clang implements the following published and upcoming ISO C++ standards: Language Standard Flag Available in Clang? C++2c -std=c++2c Partial C++23 -std=c++23 Partial C++20 -std=c++20 Partial C++17 -std=c++17 Clang 5 C++14 -std=c++14 Clang 3.4 C++11 -std=c++11 Clang 3.3 C++98 / C++03 -std=c++98 Yes (other than export) The Clang community is continually striving to improve C++ standards compliance between releases by submitting and tracking C++ Defect Reports and implementing resolutions as they become available. Experimental work is also under way to implement C++ Technical Specifications that will help drive the future of the C++ programming language. The LLVM bug tracker uses the "c++" label, as well as mode-specific labels such as "c++11", "c++14", and so on, to track known bugs with Clang's language conformance. C++2c implementation status Clang has support for some of the features of the C++ standard following C++23, informally referred to as C++26. You can use Clang in C++2c mode with the -std=c++2c option. List of features and minimum Clang version with support Language Feature C++26 Proposal Available in Clang? Remove undefined behavior from lexing P2621R2 (DR) Clang 3.3 Making non-encodable string literals ill-formed P1854R4 (DR) Clang 14 Unevaluated strings P2361R6 Clang 18 Add @, $, and ` to the basic character set P2558R2 Yes constexpr cast from void* P2738R1 Clang 17 On the ignorability of standard attributes P2552R3 (DR) Yes Static storage for braced initializers P2752R3 (DR) No User-generated static_assert messages P2741R3 Clang 17 Placeholder variables with no name P2169R4 Clang 18 Template parameter initialization P2308R1 (DR) Clang 18 Pack Indexing P2662R3 Clang 19 Remove Deprecated Arithmetic Conversion on Enumerations P2864R2 Clang 18 Disallow Binding a Returned Glvalue to a Temporary P2748R5 Clang 19 Clarifying rules for brace elision in aggregate initialization P3106R1 (DR) Clang 17 Attributes for Structured Bindings P0609R3 Clang 19 Module Declarations Shouldn’t be Macros P3034R1 (DR) No Trivial infinite loops are not Undefined Behavior P2809R3 (DR) Clang 19 Erroneous behaviour for uninitialized reads P2795R5 No = delete("should have a reason"); P2573R2 Clang 19 Variadic friends P2893R3 Clang 20 constexpr placement new P2747R2 Clang 20 Deleting a Pointer to an Incomplete Type Should be Ill-formed P3144R2 Clang 19 Ordering of constraints involving fold expressions P2963R3 Clang 19 Structured binding declaration as a condition P0963R3 No constexpr structured bindings P2686R5 No Allowing exception throwing in constant-evaluation P3068R6 No Remove Deprecated Array Comparisons from C++26 P2865R6 Clang 20 Structured Bindings can introduce a Pack P1061R10 Clang 21 The Oxford variadic comma P3176R1 Clang 20 Trivial unions P3074R7 No Partial program correctness P1494R5 No Contracts P2900R14 No Defang and deprecate memory_order::consume P3475R2 No Concept and variable-template template-parameters P2841R7 No Trivial Relocatability P2786R13 No #embed P1967R14 No C++23 implementation status Clang has support for some of the features of the ISO C++ 2023 standard. You can use Clang in C++23 mode with the -std=c++23 option. List of features and minimum Clang version with support Language Feature C++23 Proposal Available in Clang? Literal suffix uz, z for size_t, ssize_t P0330R8 Clang 13 Make () in lambdas optional in all cases P1102R2 Clang 13 Simpler implicit move P2266R3 Clang 13 if consteval P1938R3 Clang 14 Allow duplicate attributes P2156R1 (DR) Clang 13 Narrowing contextual conversions to bool P1401R5 Clang 14 Trimming whitespaces before line splicing P2223R2 Yes Make declaration order layout mandated P1874R4 Yes C++ identifier syntax using UAX 31 P1949R7 (DR) Clang 14 Mixed string literal concatenation P2201R1 Yes Deducing this P0847R7 Clang 18 P2797R0 Clang 19 Change scope of lambda trailing-return-type P2036R3 (DR) Clang 17 P2579R0 (DR) Multidimensional subscript operator P2128R6 Clang 15 Non-literal variables (and labels and gotos) in constexpr functions P2242R3 Clang 15 Character encoding of diagnostic text P2246R1 Yes Character sets and encodings P2314R4 Yes Consistent character literal encoding P2316R2 Yes Add support for preprocessing directives elifdef and elifndef P2334R1 Clang 13 Extend init-statement to allow alias-declaration P2360R0 Clang 14 auto(x): decay-copy in the language P0849R8 Clang 15 Attributes on Lambda-Expressions P2173R1 Clang 13 constexpr for <cmath> and <cstdlib> P0533R9 No Type trait to determine if a reference binds to a temporary P2255R2 Clang 19 The Equality Operator You Are Looking For P2468R2 (DR) Clang 16 De-deprecating volatile compound operations P2327R1 (DR) Clang 15 Support for #warning P2437R1 Yes Remove non-encodable wide character literals and multicharacter wide character literals P2362R3 Clang 14 Labels at the end of compound statements P2324R2 Clang 16 Delimited escape sequences P2290R3 Clang 15 Named universal character escapes P2071R2 Clang 15 Relaxing some constexpr restrictions P2448R2 Clang 19 Using unknown pointers and references in constant expressions P2280R4 Clang 20 static operator() P1169R4 Clang 16 Extended floating-point types and standard names P1467R9 No Class template argument deduction from inherited constructors P2582R1 No Portable assumptions P1774R8 Clang 19 Support for UTF-8 as a portable source file encoding P2295R6 Clang 15 char8_t Compatibility and Portability Fix P2513R3 (DR) Clang 16 Relax requirements on wchar_t to match existing practices P2460R2 (DR) Yes Explicit lifetime management P2590R2 No static operator[] P2589R1 Clang 16 Permitting static constexpr variables in constexpr functions P2647R1 Clang 16 consteval needs to propagate up P2564R3 (DR) Clang 17 Lifetime extension in range-based for loops P2718R0 Clang 20 Referencing The Unicode Standard P2736R2 Yes C++20 implementation status Clang has support for some of the features of the ISO C++ 2020 standard. You can use Clang in C++20 mode with the -std=c++20 option (use -std=c++2a in Clang 9 and earlier). List of features and minimum Clang version with support Language Feature C++20 Proposal Available in Clang? Default member initializers for bit-fields P0683R1 Clang 6 const&-qualified pointers to members P0704R1 Clang 6 Allow lambda-capture [=, this] P0409R2 Clang 6 __VA_OPT__ for preprocessor comma elision P0306R4 Clang 6 P1042R1 Clang 9 Designated initializers P0329R4 Clang 10 template-parameter-list for generic lambdas P0428R2 Clang 9 Concepts P0734R0 Clang 10 P0857R0 Clang 16 P1084R2 Clang 10 P1141R2 P0848R3 Clang 19 P1616R1 Clang 10 P1452R2 P1972R0 Clang 10 P1980R0 P2103R0 P2493R0 (DR) P2092R0 Clang 16 P2113R0 Clang 16 Range-based for statements with initializer P0614R1 Clang 8 ADL and function templates that are not visible P0846R0 Clang 9 const mismatch with defaulted copy constructor P0641R2 Clang 8 Consistent comparison (operator<=>) P0515R3 Clang 10 P0905R1 P1120R0 P1185R2 P1186R3 P1630R1 P1946R0 P1959R0 P2002R1 Clang 17 P2085R0 Clang 14 Access checking on specializations P0692R1 Clang 14 Default constructible and assignable stateless lambdas P0624R2 Clang 8 Lambdas in unevaluated contexts P0315R4 Clang 17 [[no_unique_address]] attribute P0840R2 Clang 9 [[likely]] and [[unlikely]] attributes P0479R5 Clang 12 typename optional in more contexts P0634R3 Clang 16 Pack expansion in lambda init-capture P0780R2 Clang 9 Class types as non-type template parameters P0732R2 Clang 12 Generalized non-type template parameters of scalar type P1907R1 Clang 18 (Partial) Reference type template arguments referring to instantiation-dependent objects and subobjects (i.e. declared inside a template but neither type- nor value-dependent) aren't fully supported. Destroying operator delete P0722R3 Clang 6 Relaxations of constexpr restrictions P1064R0 Clang 9 P1002R1 Clang 8 P1327R1 Clang 9 P1330R0 P1331R2 Clang 10 P1668R1 P0784R7 Prohibit aggregates with user-declared constructors P1008R1 Clang 8 Feature test macros P0941R2 (see below) explicit(bool) P0892R2 Clang 9 Signed integers are two's complement P1236R1 Clang 9 char8_t P0482R6 Clang 7 (11) Immediate functions (consteval) P1073R3 Clang 17 P1937R2 Clang 14 std::is_constant_evaluated P0595R2 Clang 9 Nested inline namespaces P1094R2 Clang 8 Structured binding extensions P1091R3 Clang 16 P1381R1 Stronger Unicode requirements P1041R4 Yes P1139R2 Parenthesized initialization of aggregates P0960R3 Clang 16 P1975R0 Modules P1103R3 Clang 15 P1766R1 (DR) Clang 11 P1811R0 No P1703R1 Subsumed by P1857 P1874R1 Clang 15 P1979R0 No P1779R3 Clang 15 P1857R3 No P2115R0 Partial P1815R2 Partial P2615R1 (DR) No P2788R0 (DR) No Coroutines P0912R5 Partial Fully supported on all targets except Windows, which still has some stability and ABI issues. Deprecate a[b,c] P1161R3 Clang 9 Deprecate some problematic uses of volatile P1152R4 Clang 10 [[nodiscard("with reason")]] P1301R4 Clang 9 using enum P1099R5 Clang 13 Class template argument deduction for aggregates P1816R0 Clang 17 P2082R1 Class template argument deduction for alias templates P1814R0 Clang 19 (Partial) This feature has been initially completed, but the feature macro __cpp_deduction_guides has not been updated. Permit conversions to arrays of unknown bound P0388R4 Clang 14 constinit P1143R2 Clang 10 Pseudo-destructors end object lifetimes P0593R6 (DR) Clang 11 More implicit moves P1825R0 (DR) Clang 13 (11): Prior to Clang 8, this feature is not enabled by -std=c++20, but can be enabled with -fchar8_t. C++17 implementation status Clang 5 and later implement all the features of the ISO C++ 2017 standard. By default, Clang 16 or later builds C++ code according to the C++17 standard. You can use Clang in C++17 mode with the -std=c++17 option (use -std=c++1z in Clang 4 and earlier). List of features and minimum Clang version with support Language Feature C++17 Proposal Available in Clang? static_assert with no message N3928 Clang 3.5 Disabling trigraph