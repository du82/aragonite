["https://claremontreviewofbooks.com/author/peter-w-schramm"]
title = "Peter W. Schramm - Claremont Review of Books"
description = "Peter W. Schramm is a senior fellow and former president of the Claremont Institute."
full_description = '''The Heroic Effort of Booker T. Washington Peter W. Schramm reviews "Up from History: The Life of Booker T. Washington", by Robert J. Norrell One Last Card to Play A review of Lincoln's Emancipation Proclamation: The End of Slavery in America, by Allen C. Guelzo Born American, But in the Wrong Place A personal reflection on the 50th anniversary of the Hungarian Revolution. Author Peter W. Schramm Peter W. Schramm is a senior fellow and former president of the Claremont Institute. He is Executive Director of the John M. Ashbrook Center for Public Affairs and a professor of political science at Ashland University. He served in the Reagan Administration as the Director of the Center for International Education in the United States Department of Education. Dr. Schramm earned his Ph.D. in government from the Claremont Graduate School in 1981. He holds two Master of Arts degrees, one from the Claremont Graduate School in Government and the other in International History from the University of London. Dr. Schramm has also been a part of numerous literary and academic endeavors. In 1996, he wrote the introduction of Lord Charnwood's biography of Abraham Lincoln. He has also edited several books, including Lessons of the Bush Defeat, Consequences of the Clinton Victory, and has co-edited Separation of Powers and Good Government (Rowman and Littlefield, 1994). Dr. Schramm has given a variety of academic and political lectures, including to the Heritage Foundation, Stanford University, and the International Conservative Congress in Washington, D.C. Go to: The Writings of Peter Schramm on Ashbrook.org Articles by Peter W. Schramm Reviving the “Moral Sciences”: A Conversation with Peter F. Drucker Reviving the moral sciences The Heroic Effort of Booker T. Washington Peter W. Schramm reviews "Up from History: The Life of Booker T. Washington", by Robert J. Norrell Douglass and Lincoln The parallel lives of Frederick Douglas and Abraham Lincoln. One Last Card to Play A review of Lincoln's Emancipation Proclamation: The End of Slavery in America, by Allen C. Guelzo Born American, But in the Wrong Place A personal reflection on the 50th anniversary of the Hungarian Revolution. In Memoriam: Thomas B. Silver, 1947-2001 In memory of Thomas B. Silver'''
