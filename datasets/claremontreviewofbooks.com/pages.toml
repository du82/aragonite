description = "Christopher Flannery is a senior fellow of the Claremont Institute, contributing editor of the Claremont Review of Books, and professor of political science"
full_description = 'His Spirit Abides In today’s divided America, when questions of American purpose and identity are increasingly contested, Lincoln’s wisdom is still speaking. Patrick J. Garrity (1955–2021) Patrick J. Garrity, a long-time friend and contributor to the Claremont Review of Books, is remembered by Larry P. Arnn and Christopher Flannery. Self-Driving, Not Self-Governing What part of our humanity is lost when we think of our world and our place in it as governed by "progress?" In the Beginning Was the Word America is founded on principles deeply indebted to ancient Christian and natural law traditions. Land of the Free The story of America is precisely the heroic story of pioneers who bring the American ideal again and again to the West. Peter William Schramm December 23,1946 – August 16, 2015 Peter William Schramm December 23,1946 - August 16, 2015 America Defendenda Est? A review of Promise or Peril: The Strategic Defense Initiative, edited by Zbigniew Brzezinski et al. Poet of the New World No other poet has so deeply penetrated and thoroughly inhabited the souls of the American people The Common Sense of the Subject A review of We Still Hold These Truths: Rediscovering Our Principles, Reclaiming Our Future, by Matthew Spalding Nothing to Declare Dershowitz would reclaim the Declaration of Independence from Thomas Jefferson and the revolutionaries of 1776. The Home Front: Left, Right, and (Elusive) Center In an America that is asking serious questions with an urgency not felt in years, conventional liberalism has nothing serious to say. Steinbeck In Good Conscience Shillinglaw and Benson are respectful of Steinbeck the way a good friend is respectful and they are grateful for his gifts and fondly aware of his limits and his foibles. American Meditations Christopher Flannery discusses American attitude and what it takes to be "distinctively American." Henry Adams Adams found it impossible to be an American in the most decisive sense, in the way exemplified by his great-grandfather, a way available to "good and wise men of all ages".'
