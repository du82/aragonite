full_description = '''hbspt.cta._relativeUrls=true;hbspt.cta.load(4505120, '101a3501-fa9c-44d7-9792-c559a67789c1', {"useNewLoader":"true","region":"na1"}); Use your AWS, Google or Azure cloud. Reduce cloud compute costs with bare metal and air-gapped deployments. hbspt.cta._relativeUrls=true;hbspt.cta.load(4505120, '36056548-e979-45d6-a10e-594cd40ab5d0', {"useNewLoader":"true","region":"na1"}); Outsource your data labeling tasks to a team of specialized data annotators and researchers. We combine cutting-edge AI automation on a secure AI platform to deliver you the highest quality training datasets you need for the most complex use cases. Contact us to learn about additional volume discounts.Learn more about our data labeling services. The Essential plan includes a monthly credit of $30 worth of inputs and operations, and the Professional plan includes a monthly credit of $300 worth of inputs and operations. Since there are different prices for ops and inputs, there are additional charges for any inputs or operations beyond the package price.To help illustrate this, assume you need to do 100,000 pre-trained model classifications, where each operation costs $0.0012. The total price for these operations is $0.0012 x 100,000 = $120. If you are on the Essential Plan, you would be billed for the base price of $30, and an additional $90 for a total of $120. If you are on the professional plan, you would be billed $300, and you would have additional credit to perform more operations. The Essential plan lets users do a max of 300k operations each month. The Professional plan lets users do a max of 1M operations each month. Similarly, the Essential plan lets users store a max of 300k inputs, and the Professional plan lets users store a max of 1M inputs. Since there are different prices for ops and inputs, there are additional charges for any inputs or operations beyond the package price. You can cancel your subscription any time by downgrading to the community plan. Once you downgrade, you are allowed inputs and operations will be bound by our community plan. Contact support@clarifai.com.'''
