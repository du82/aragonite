description = "Start your Clarifai career today! We're looking for talented individuals to join our team and help in expanding the power of AI."
full_description = "Start a Career with Clarifai Join us on our mission to empower developers everywhere to create, share, and use The World's AI™ View open positions 2013 Established in 1M+ AI Models 250k+ Users 170+ Countries Awards & Recognition Award winning technology in AI, Machine Learning & Computer Vision We empower businesses with AI so they can build better experiences for their customers. Our greatest responsibility is ensuring we teach AI in a diverse and global way. When faced with a challenge, we pass it through the most durable filter we have: how are we changing the world for the better? Matt Zeiler, Ph.D. CEO & Founder Why join our team Career growth We believe fostering an individual’s talents, skills and potential is key to a happy and healthy working relationship as part of the Clarifai family. AI tech leader and visionary Forrester named Clarifai a Computer Vision leader alongside Google, Amazon and Microsoft; some of the most significant players in the industry. Flexible work environment We believe our employees should have balance between family obligations and their work duties. We encourage that they do. Purpose Clarifai is committed to creating a culture that fosters diversity, equity and inclusion, not only for their own sake, but because they are essential to our core values of community, learning, responsibility and impact. Diversity The presence and celebration of differences among individuals, including, but not limited to, race, ethnicity, gender identity, gender expression, sexual orientation, age, socioeconomic status, (dis)ability, nationality, values, experiences and perspectives. Equity Understanding that people come from different circumstances and have unique needs. Striving to identify and eliminate barriers that prevent the full participation of certain groups or individuals and providing support and accommodations to ensure that each person is set up for success. Inclusion Developing programs as a company and taking actions individually to make a space for each person, by inviting them to participate, sharing access to opportunities and information. Treating each other with integrity and respect so each person feels safe and accepted to bring their TRUE selves to work. Our core values Whether we’re building technology, hiring employees or marketing and selling our products, we aspire to live up to our core values in everything we do. Community Be open. Collaborate internally and externally. Empower each other to empower others. Learning No one knows everything. Learn how to learn. Change is information to learn from. Astonishment Set ambitious expectations–then exceed them. Make each interaction positive and memorable. Responsibility Take initiative. Inaction yields no results. Challenge ideas and commit fully to decisions. Innovation Extrapolate customer requests to create value. Imagine the future and then build it. Fire Lead by example with a passion for excellence. Embrace both challenges and failures. Appreciation Be humble in the face of opportunity. No nonsense. Impact Leverage resources to maximize lasting value. Always iterate. Benefits Continuous learning Once a month Hackdays and a yearly training stipend. Insurance Medical, dental, vision, and life insurance. 401K contribution Quarterly contributions with no matching required. Unlimited paid time off Stay fresh with unlimited paid vacation. Work from home stipend Receive a monthly stipend for your home office expenses. Maternity & Paternity Generous maternity, paternity and adoption leaves, as well as family medical care leave. Equity Equity-based compensation to create long-term alignment. Cell phone reimbursement Receive a monthly stipend towards your cell phone bill. Open Positions"
