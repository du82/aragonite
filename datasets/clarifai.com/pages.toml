["https://www.clarifai.com/blog/nextgen-gpt-ai-hackathon-with-clarifai-winners-announcement"]
title = "NextGen GPT AI Hackathon with Clarifai - Winners Announcement"
description = "Meet the Winners of the NextGen GPT AI Hackathon"
full_description = "To kick off 2024, we have partnered with Lablab.ai to host the NextGen GPT AI Hackathon with Clarifai. The purpose of the Hackathon is to nurture creativity in the development of AI-first products utilizing powerful models, including GPT-4 (Vision), Text to Speech, GPT-4 Turbo, and the Image Generation DALL·E 3 from the Clarifai community. A total of 1,491 enthusiasts, forming 207 teams, have registered, resulting in an impressive 47 project submissions. The challenge required participants to create a Generative AI project and showcase an innovative application using the GPT-4 Vision, GPT-4 Turbo, DALL.E 3, Text-to-Speech, and other diverse ranges of text, audio, and vision models from the Clarifai community. 47 impressive projects were created and submitted for judging. Here are some of the standout projects. Story Prep won the top prize. It is an app that helps you learn a language by reading your favourite author. You don't need a dictionary at hand to read the entire story. All you need to do is upload your story, and the application will convert the story into lessons that teach just what is necessary for you to enjoy that particular story. It also allows you to generate vocabulary sheets and downloadable listening exercises based on any work of fiction. This material will teach you all the necessary words and grammar to jump into an uninterrupted reading experience. AI Project Manager Assistant won second place with its aim to save time by keeping track of meeting notes. The team created a Slack bot that automatically records meeting transcripts and sends the summary in a specified Slack channel. The assistant has a /dailysummary command to get the summaries of all meetings during the day. 1. Record a Meeting: As a first step, the assistant uses Fathom to record a Zoom meeting and sends the transcript as JSON to Zapier. 3. Summarize the transcript: The server calls the GPT-4-turbo model from Clarifai to summarize the .txt file. 5. Slackbot returns the summary: Finally, Slackbot returns the summarized meeting transcript upon typing /dailysummary."
author = "Sumanth P"
