["https://www.clarifai.com/blog/streamlit-llm-hackathon-best-projects-built-with-clarifai"]
title = "Meet the Clarifai Champs of the Streamlit LLM Hackathon"
description = "Announcing the winners who built the most interesting Clarifai projects during Streamlit's LLM Hackathon"
full_description = "In September, Clarifai was excited to be part of an LLM Hackathon hosted by Streamlit. The Hackathon was intended to nurture creativity in the development of AI-first products using powerful LLMs. The challenge required participants to create a Streamlit app by utilizing technology from Clarifai and four other partners: LangChain, AssemblyAI, Weaviate, and LlamaIndex. A total of 36 impressive projects were built using Clarifai and submitted for judging. With so many great entries, selecting two Clarifai winners proved challenging! Here are the projects that stood out the most! GPT Research Buddy, one of the winners, is a Q&A and summarization bot leveraging the Nougat Transformer to read research papers from sources like Arxiv and the ACL Anthology. It uses LLamaIndex to create a vector-based index for Q&A discussions and also leverages GPT 3.5 Turbo, Open AI's Text Embedding, and Text Moderation models from the Clarifai Community, along with the Nougat Transformer. Persona Simulator features five different personas, each with their own personalities, recent actions, goals, and a set of available tools to determine their actions. These personas can create artwork, compose blog posts, and share social media updates. The project utilizes the Stable Diffusion XL 1.0 and GPT-4 models from the Clarifai Community. The app contains several distinct personas, each represented by a paragraph of text, a list of interests, a physical description, and a writing style description. It also has access to a variety of tools for internal reflection and external expression. Additionally, a workflow has been established in which each persona is guided independently to select a task based on the tools they can access. Subsequently, they plan how to execute the task and then proceed to do it. To get started, you select a persona of your choice and give them their next thought. As it progresses, you'll be able to see their thought process as they gather research, journal about their emotional response, create art and make various types of postings."
author = "Sumanth P"
year_published = 2025
