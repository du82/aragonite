["https://www.clarifai.com/customers/social-media-site"]
title = "Protecting User Communities Using Visual Search and Content Moderation"
description = "See how Clarifai helped an international social media site protect their users with visual search and auto-annotation to speed content moderation. Read how!"
full_description = "An interactive media and entertainment company based in Europe came to Clarifai to seek help with content moderation. The company offers a social media site for pre-teen children that is immensely popular among children throughout Europe—with as much as 20% market penetration in some countries.The company’s users interact with their friends in a variety of ways; including posting updates on their wall, sending messages to friends and groups, and inviting other users into their personally decorated ‘rooms’. The platform is designed to offer a playful, safe environment, where children can develop valuable social media competences that prepare them for interacting on other sites as they get older. Although most of the children ‘play nice’, some try to push their boundaries by posting inappropriate images. Given the young age of the users, it is crucial that photographs containing adult, harmful, scary stuff or spam are excluded from the community.The company already had a number of successful safety measures in place, enforced by their team of Community Managers. However, policing a platform that hosts such a large volume of user-generated content is no simple feat. The company’s platform is used to send 1 billion messages and post 30 million images per year. With safety as their priority, the team started exploring AI technology to support their visual moderation needs. Although most of the children ‘play nice’, some try to push their boundaries by posting inappropriate images. Given the young age of the users, it is crucial that the community content be moderated and photographs containing adult, harmful, scary stuff or spam are excluded from the community.The company already had a number of successful safety measures in place, enforced by their team of community managers. However, policing a platform that hosts such a large volume of user-generated content is no simple feat. The company’s platform is used to send 1 billion messages and post 30 million images per year. With safety as their priority, the team started exploring AI technology to support their visual moderation needs."
