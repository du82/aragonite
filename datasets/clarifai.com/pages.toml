["https://www.clarifai.com/blog/clarifai-11.1-control-center-public-preview-one-dashboard-total-control-over-your-ai-operations"]
title = "Clarifai 11.1: Control Center (Public Preview): One Dashboard, Total Control Over Your AI Operations"
description = "Clarifai’s Control Center, GCP support for Compute Orchestration, DeepSeek-R1 distilled models, and the open-source Data Utils library."
full_description = "This blog post focuses on new features and improvements. For a comprehensive list, including bug fixes, please see the release notes. We are excited to announce the Public Preview of Clarifai’s Control Center, a unified dashboard and a single pane of glass to monitor AI operations within your Clarifai account. It serves as the ultimate source of truth, aggregating data from multiple dimensions so you can make informed decisions with confidence. With the Control Center, you can transform raw data such as model predictions, search operations, stored inputs, and model training hours into actionable insights. You can track team activities, analyze operational impact and spending, and audit any user-initiated event to trace its origin. Key functionalities include interactive charts, tables, flexible date ranges, and powerful filtering and sorting options to help you uncover meaningful patterns in your data. Ready to gain deeper insights and streamline your account management? Explore more about the Control Center here. DeepSeek-R1 sets a new standard for open-source reasoning, rivaling OpenAI-o1 in performance while being faster and more cost-effective. We’re excited to share that the DeepSeek-R1 Distilled Models are now available on Clarifai, and you can try them out for free! Derived from DeepSeek-R1 and based on Qwen, these distilled models deliver top-tier results in math, coding, and reasoning tasks, all while being optimized for efficiency. We have made Data Utils library open-source, designed to streamline multimedia data management and processing. This powerful toolset is now available for the community, providing a range of utilities to simplify data ingestion, transformation, and annotation, whether you're working with images, text, or multimodal datasets. Explore our Quickstart guide to learn more about Control Center. Check out the Press Release for more details. Sign up here to get started!"
