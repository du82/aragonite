["https://www.clarifai.com/products/spacetime-ai-search-engine"]
title = "Spacetime | AI-Powered Search Engine for Unstructured Data"
description = "Clarifai's AI search engine scans your unstructured data for people, objects, places, and topics using AI technology. Get a free demo today."
full_description = '''Clarifai's patented technology uses AI to automatically index your unstructured data for deep search. Concepts identified by our Armada Predict technology can be used as search terms. Even search with images to find similar images. Order your search results with the intuitive insights of AI. Your model can identify concepts in your data and rank your search results by how confident it is that a given concept is present. You can even rank search results by how similar one input is to another input. Trim down the amount of data returned in search. For example, you may only want to see inputs that one of your collaborators has labeled with the word “dog”. Or perhaps you want only those inputs that were captured in a certain geographical region. Combine multiple search parameters. For example, you can find all the inputs within a geographical region with a "weapon" in them, or all annotations assigned to user "Joe", or visually similar product images that are assigned the word "XL" in metadata. Understand the common challenges and value drivers of deep learning platforms for unstructured data before you invest. hbspt.cta._relativeUrls=true;hbspt.cta.load(4505120, 'eb9c33a0-69de-4d16-b5c5-84d4805db8d5', {"useNewLoader":"true","region":"na1"}); Discover and retrieve the most relevant images from your dataset by searching for the concepts identified by your AI models. Patented technology developed by Clarifai gives you the ability to search for predictions immediately after training—no waiting on re-indexing. Build recommendation systems with rapid retraining cycles for active learning on the fly. Go beyond simple keyword searches. Draw a direct line from the source of an idea (an image, video, or block of text), to the information you need. No guessing keywords required. Similarly Spacetime Search can be combined with detection models so that you can search for a specific thing a region of an image. You can even use an image to find a specific frame within a video clip.'''
