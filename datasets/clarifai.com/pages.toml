full_description = "Clarifai Brand We've developed guidelines to assist you in utilizing our brand and assets, such as our logo, content, and trademarks, without the need for individual legal agreements for every instance. If you require usage of our marks in ways not specified by these guidelines, get in touch with us and provide a visual mockup of the proposed use. Download Brand Kit Download Brand Guide Need help? Contact our design team now Clarifai Guidelines Downloads Tone of Voice Clarifai's tone of voice is visionary, casual, simple, informative, optimistic, and to the point. What would someone outside Clarifai do with this information? We can use the page to describe Clarifai so they can pick that description when they talk about it. Like - Clarifai is the leading independent provider of artificial intelligence for unstructured data including texts, images and video. Its end-to-end AI platform covers the entire AI Lifecycle from data labeling and training all the way through deployment. Logo The logo celebrates the brand’s clever name and friendly nature through its symmetrical structure, soft edges, and balanced weight. The symbol is the visual hero and is inspired by a “neural network”. It tells the story of connecting one idea to another to reveal the “big picture”. To ensure readability, there should always be as much clear space around our logo as possible. To give it the space it deserves, all other graphic elements must remain a minimum distance away from it. Download Logo assets Primary Logo for most applications - Horizontal Vertical Logo: alternate square layout Clarifais Stand alone Icon Spacing Considerations To ensure readability, there should always be as much clear space around our logo as possible. To give it the space it deserves, all other graphic elements must remain a minimum distance away, as illustrated below. Using the height of the logo [X] is an easy guide to determine the necessary minimum clear space on all sides. The Clarifai logo consists of two elements: the icon, the logotype The Tagline should be strategically used to communicate our brand value Colors Our brand colors are the three colors acceptable for expressing our brand marks and logo. Bold and distinctive, this palette is restrained and must always remain consistent. These colors can be used across all branded materials and assets. As the foundation of our brand color palette, these colors should be partner with light backgrounds. Clarifai Main blue color, brand usage Complementary color fro gradients, highlight or links Mostly used in fonts and backgrounds Gradients Gradients can be used as additional color options as a background element, always talking into consideration the contrast and the readability. Resources Brand logos Logos, March 7, 2024 Brand logos Logos, March 20, 2024 Brand logos - Google Slides Logos, March 20, 2023 Brand Logos - Adobe CC Logos, March 20, 2024 Brand Template - Google Slides Template, January 10, 2024 Built with Clarifai Badge Badge, April 1 , 2024 Built with Clarifai Badge Badge, April 1, 2024 Built with Clarifai Badge - Adobe CC Badge, April 1 , 2024 Clarifai Diagrams - Infrastructure Diagrams, April 1, 2024 Clarifai Diagrams Diagrams, April 1, 2024 Clarifai Colors - Adobe CC Colors, April 1 , 2024 Clarifai Colors - Google Slides Colors, January 10, 2024 Build your first Generative app in under five minutes with Clarifai. Start for free Generative AI Developer Platform Documentation Pricing"
