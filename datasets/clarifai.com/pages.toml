title = "Increasing Product Discoverability with Computer Vision | Clarifai"
description = "Read how a leading online fashion reseller increased product discoverability to drive revenue and customer loyalty and engagement with improved visual search."
full_description = "An online peer-to-peer marketplace for buying and selling women’s designer fashion items, serves millions of customers who are looking to share their closets. Over the last five years, they have grown to a $74.5 million company. They've been able to stand out among other clothing resellers in the growing reselling industry by offering a wider range of product styles and sizes as well as improving the user experience. With user-generated content playing a significant role in selling their products, the company needed a solution that would provide a highly scalable system for exploring user-generated content and images. In order to increase user engagement and boost conversions in their online marketplace, they needed to improve product search recommendations and the user experience. They also needed to ensure the quality of their moderation of user-generated images. Often times, the images provided were low quality and sometimes contained inappropriate content. The company used Clarifai’s AI platform and automated data labeling to categorize and tag images in order to surface better product recommendations. They also used Clarifai’s moderation models to ensure the quality and find and eliminate inappropriate content that may have been uploaded by users. The company enhanced product SEO and onsite search capabilities, resulting in increased conversions from more relevant search and product recommendations. High-end handbag brands like Louis Vuitton, Chanel, and Gucci were tagged with a 98% accuracy, providing greater consistency in listings and resulting in increased conversions from more relevant search results. If you are encountering a technical or payment issue, the customer support team will be happy to assist you."
