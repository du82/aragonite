full_description = "We are happy to announce our second annual AI conference, Perceive 2021. This year our event will be bigger than ever and will be broadcasted globally in three different time zones. Catch up on the latest advancements in computer vision, NLP and machine learning. Join business leaders and practitioners in discussions how they are deploying AI at the world's largest organizations. Attend workshop sessions designed to empower you with state-of-the-art AI tools. Join the community of makers helping computers see, read and hear. See how AI is unlocking a fundamentally new paradigm for writing software. Release 7.8 includes cutting edge models for AI on edge devices, plus we've now made our organization and team features public."
