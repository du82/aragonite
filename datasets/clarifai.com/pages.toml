["https://www.clarifai.com/blog/introducing-deep-training"]
title = "Introducing Clarifai Deep Training"
description = "Build a custom neural network for your application from the ground-up. Become an expert in recognizing the unique set of visual features that is important in your data set."
full_description = '''Since 2013 Clarifai has offered dozens of pre-trained models that make it easy to get started in AI. Plus, we offer award winning technology for custom training, which lets people build their own custom models on top of pre-trained Clarifai base models. Our custom training technology helps companies of all sizes build high performing AI models quickly, with less training data. Today, we are announcing Deep Training. With Deep Training data scientists and engineers can build their own "base models" that work just like Clarifai Models in our platform. Deep training is a process that builds a custom neural network for your application from the ground-up. This means that your model can become an expert in recognizing the unique set of visual features that is important in your data set. There are a couple cases when deep training is preferable to custom training on top of Clarifai Models. There are times when your dataset and use case are unique and require your model to recognize a different set of visual features than the ones recognized by pre-trained models. This is common in scenarios when you're working with visual data of a highly technical or specialized nature, or when the distribution of data the base model was trained on is materially different than the data you expect to infer on. For many users—especially those who use AI models to drive some form of automation—model accuracy can be critical. Deep trained models can help you push the accuracy of your models to the limits. Even images of everyday events and objects can vary a lot when you really need to pay attention to the details. We've built proprietary technology that allow our users to transfer the feature-recognizing power of Clarifai Models to new custom models. This technique has proven incredibly effective across a wide variety of use cases, and is the starting point for most users on the Clarifai platform. Clarifai Models are designed to be general purpose feature identifiers that give you a head start with the most common visual classification and detection tasks. They work best on "everyday" photos and videos, taken with similar cameras, at a similar scale, with a similar set of subjects. With Deep Training, you can custom tailor the feature recognition characteristics of your model to your unique data set and use case.'''
author = "Jeff Toffoli"
year_published = 2025
clearnet = "https://www.clarifai.com/blog/introducing-deep-training"
