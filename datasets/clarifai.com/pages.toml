full_description = "We’re excited to announce our new Python SDK, launching as a developer preview! Access the platform's functionality in just a few lines of Python code. 🚀 AI-assisted labeling is also back in our new platform. More powerful and easy to use than ever before! Speed through labeling tasks quickly. 👌 We’ve continued to expand our generative AI offerings as well! We’ve now added OpenAI’s Whisper, Google Cloud’s Chirp, and AssemblyAI’s audio transcription models, and most excitingly, ElevenLab’s phenomenal speech synthesis model. You can easily create workflows to transcribe, transform, and create new voices! 📣 🙌 Wrapping this up, we’ve got several new models into our platform, including several LLMS like Claude Instant LLM, Llama 2, and more! Simplify your data import, create apps, inputs, and datasets, consume models and workflows, and more with our new Python SDK. This blog is a fun read! It showcases how to build an engaging and versatile chatbot using the Clarifai API and Streamlit. Code included. So many great entries from the talented hackers of the Llama 2 Hackathon with Clarifai! Find out who won and get inspired! Share your experience with us on the Gartner Peer Insights portal before 30th September and get a $25 gift card!"
