["https://www.clarifai.com/blog/clarifai-10.3-template-wizardry-craft-apps-with-a-click"]
title = "Clarifai 10.3: Template Wizardry: Build Apps with a Click"
description = "Explore the latest updates on App templates, Node SDK, new models (Mistral Large, Deepgram Aura-TTS, Genstruct-7B, etc.), and many more."
full_description = "This blog post focuses on new features and improvements. For a comprehensive list, including bug fixes, please see the release notes. We now provide pre-built, ready-to-use templates that expedite the app creation process. Each template comes with a range of resources, such as datasets, models, workflows, and modules, allowing you to quickly hit the ground running with your app creation process. It is designed to offer a simple, fast, and efficient way to experience the power of Clarifai’s AI platform — all with just a few lines of code. Clarifai-hosted Genstruct 7B, an instruction-generation LLM, designed to create valid instructions given a raw text corpus. It enables the creation of new, partially synthetic instruction fine-tuning datasets from any raw-text corpus. Wrapped Deepgram’s Aura Text-to-Speech model, which offers rapid, high-quality, and efficient speech synthesis, enabling lifelike voices for AI agents across various applications. Wrapped Mistral-Large, a flagship LLM developed by Mistral AI, and renowned for its robust multilingual capabilities, advanced reasoning skills, mathematical prowess, and proficient code generation abilities. Wrapped Mistral-Medium, Mistral AI's medium-sized model. It supports a context window of 32k tokens (around 24000 words) and outperforms Mixtral 8x7B and Mistral-7b on benchmarks across the board. Wrapped Mistral-Small, a balanced, efficient large language model offering high performance across various tasks with lower latency and broad application potential. Wrapped DBRX-Instruct, a state-of-the-art, efficient, open LLM by Databricks. It’s capable of handling input length of up to 32K tokens. The model excels at a broad set of natural language tasks, such as text summarization, question-answering, extraction, and coding. Within the Input Manager, users can now seamlessly upload archive or zipped files containing diverse data types such as texts, images, and more. The unstructured library provides open-source components for ingesting and pre-processing images and text documents. We’ve integrated it with Clarifai to allow our users to streamline and optimize the data processing pipelines for LLMs."
author = "Sumanth P"
