["https://www.clarifai.com/blog/the-landscape-of-multimodal-evaluation-benchmarks"]
title = "The Landscape of Multimodal Evaluation Benchmarks"
description = "Explore the key features of ten multimodal datasets and benchmarks to assess the performance of multimodal models."
full_description = "With the huge advancements happening in the field of large language models (LLMs), models that can process multimodal inputs have recently been coming to the forefront of the field. These models can take both text and images as input, and sometimes other modalities as well, such as video or speech. Multimodal models present unique challenges in evaluation. In this blog post, we will take a look at a few multimodal datasets which can be used to assess the performance of such models, mostly ones focused on visual question answering (VQA), where a question needs to be answered using information from an image. The landscape of multimodal datasets is large and ever growing, with benchmarks focusing on different perception and reasoning capabilities, data sources, and applications. The list of datasets here is by no means exhaustive. We will briefly describe the key features of ten multimodal datasets and benchmarks and outline a few key trends in the space. There are different types of vision-language tasks that a generalist multimodal language model could be evaluated on. One such task is optical character recognition (OCR) and answering questions based on text present in an image. One dataset evaluating this type of abilities is TextVQA, a dataset released in 2019 by Singh et al. As the dataset is focused on text present in images, a lot of images are of things like billboards, whiteboards, or traffic signs. In total, there are 28,408 images from the OpenImages dataset and 45,336 questions associated with them, which require reading and reasoning about text in the images. For each question, there are 10 ground truth answers provided by annotators. Similarly to TextVQA, DocVQA deals with reasoning based on text in an image, but it is more specialized: in DocVQA, the images are of documents, which contain things such as tables, forms, and lists, and come from sources in e.g. chemical or fossil fuel industry. There are 12,767 images from 6,071 documents and 50,000 questions associated with these images. The authors also provide a random split of the data into train (80%), validation (10%), and test (10%) sets."
author = "Elizaveta Korotkova and Isaac Chung"
year_published = 2025
clearnet = "https://www.clarifai.com/blog/the-landscape-of-multimodal-evaluation-benchmarks"
