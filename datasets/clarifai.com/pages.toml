["https://www.clarifai.com/customers/opentable"]
title = "Build a Scalable Content Moderation Strategy using Clarifai"
description = "Learn how OpenTable used Clarifai’s AI platform and computer vision models to build a content moderation strategy to improve moderator productivity 16x."
full_description = '''OpenTable, a restaurant reservation company, offers user generated images and reviews of restaurants on their website. They offer a look into what a dining experience is like at user reviewed restaurants. They expect all of the content to be relevant and appealing in order to entice future diners to book a reservation. This supports an authentic experience that consumers have come to expect. Before using Clarifai, OpenTable could moderate only 300 images per day because they had one person manually reviewing user generated content. The moderator's job was to make sure there wasn't anything inappropriate in the photos. After reviewing, the images were organized into categories like "pictures of the restaurant itself," "pictures of the food," "pictures of the wait-staff," "pictures of the guests," etc.Because of the sheer volume of images posted, many images could not be reviewed and inappropriate images were inadvertently posted which negatively impacted the company’s reputation and brand. The lack of a scalable content moderation strategy prevented them from pursuing their goal of ingesting photos from Instagram onto their website to increase the amount of user generated reviews. Before spending money on hiring additional human moderators, OpenTable turned to Clarifai to leverage the capabilities of its AI lifecycle platform, content moderation, and custom models in order to curate their restaurant photos appropriately. Clarifai helped them build custom trained models with concepts that encompassed all of the types of pictures users could submit from their restaurant experience. After the models were trained, OpenTable was able to plug into a Clarifai API, so their moderation team could use the Clarifai platform to review predictions. OpenTable was able to train its models in about 14 days before using the Clarifai platform for its predictive capabilities. If you are encountering a technical or payment issue, the customer support team will be happy to assist you.'''
