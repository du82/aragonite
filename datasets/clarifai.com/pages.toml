title = "Managing Media Libraries at Scale Using Computer Vision | Clarifai"
description = "Learn how a leading DAM company used computer vision to manage their media library and improve assets search-ability and find-ability. Read their story!"
full_description = "A leading Digital Asset Management Company used by 20 of the FTSE 100 companies and over 500 organizations around the world wanted to improve their metadata tagging accuracy. The company's platform provides their enterprise customers with the ability to manage their media libraries at scale. As one of the industry’s innovators, the company needed to find a faster way to make it easier for their customers to search content and related assets. They understood that building artificial intelligence into their DAM platform and leveraging image auto-tagging would create a better product and user experience. The company launched two pilot apps incorporating Clarifai’s computer vision platform to auto-tag images. The first app was built into the company’s interactive’s flagship product, so tags could be added automatically to assets as they are uploaded to the platform. The second app was a standalone product with its own user interface which was designed to be used with any DAM solution. It allowed clients to change, accept, or reject automatically suggested tags. With these two pilots in place, the company could deliver added value to their clients and save time traditionally spent manually adding keywords to images. Clarifai’s General Model helped the company recognize over 11,000 general concepts, which far exceed the amount needed by the company’s clients to extract value from their results. In their platform, these general tags were automatically added via the Clarifai API as users upload images. For example, the general tags for “outdoors” and “indoors” were very meaningful for a travel and tourism client. If you are encountering a technical or payment issue, the customer support team will be happy to assist you."
