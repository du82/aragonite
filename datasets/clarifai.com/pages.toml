full_description = "The Enterprise AI Platform Clarifai simplifies how developers and teams create, share, and run enterprise AI at scale Start for free 170+ Countries 2013 Founded 400K+ Users Billions Of predictions served 1M+ AI Models Clarifai is changing how organizations build, share, and run enterprise AI at scale Founded in 2013 by Matthew Zeiler, Ph.D., a foremost expert in machine learning, Clarifai has been a market leader since winning the top five places in image classification at the ImageNet 2013 competition. In 2019, Clarifai was named a leader in Forrester’s New Wave Computer Vision Platforms report, the only startup to receive a differentiated rating. Clarifai offers a leading platform for building AI-powered software solutions and in 2022 IDC MarketScape named Clarifai a leader in Computer Vision AI Platforms. Clarifai's platform supports the full AI development lifecycle; including dataset preparation, model training and deployment. Awards & Recognition Award winning technology in AI, Machine Learning & Computer Vision Meet our leadership team Matt Zeiler, Ph.D. Founder & CEO Alfredo Ramos SVP, Platform Jonathan Padgett VP, Federal Sales Doug Shapiro Chief of Staff Matt Metzger Head of People Alicia Rigdon General Counsel Our Investors Build your first Generative app in under five minutes with Clarifai. Start for free Generative AI Developer Platform Documentation Pricing"
