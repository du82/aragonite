["https://www.clarifai.com/clarifai-vision-august-2023"]
title = "Clarifai Vision August 2023 - New releases and an exciting Hackathon!"
full_description = "We have published several new, ground-breaking models from Meta, Google, Anthropic, DeiT, TII, Salesforce, and MosaicML in our community. The models cover a wide range of tasks, such as image-to-text generation, image and text classification, code completion, code generation, text embedding, etc. This means more advanced AI capabilities for you. 🎉 We’re also excited to introduce the smart image search by caption functionality on the Input-Manager. You can rank, sort, and retrieve images based on a predicted match to a query caption. All you have to do is provide a text caption that best describes the images you want to search for! 🔍 Clarifai with Llama 2 makes building AI easier than ever read our blog to find out how to use Llama 2 in Clarifai portal. A step-by-step guide to fine-tuning GPT-Neo model from Aleuther AI, a text-to-text generative model for a classification task. Find out in this blog! And while you're at it, feel free to try out one of the NER models on the Clarifai platform. You can now access the MPT-Instruct-7B, a short-form instruction following model with the Clarifai API."
