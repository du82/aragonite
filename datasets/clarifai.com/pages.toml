title = "Clarifai Vision: Happy New Year 2023 Edition"
full_description = "Happy New Year from everyone at Clarifai! We’re starting 2023 with a gorgeous redesign of the model and workflow pages from Clarifai Community, which you can check out in this week’s release blog or try it out yourself. This month we’ll be at the NRF Big Show in the Innovation Lab showing how AI can enhance the retail experience, and we have a number of blog articles to include this month to explain much of this. The number of models on Clarifai Community continues to grow, with a new spoof detector model and templates you can use to train custom text classifiers. Generative AI has now become highly popular in the public consciousness, and we'll be adding Stable Diffusion image generation shortly as well. Stay tuned for more and be sure to check out the growing zoo of models on Clarifai Community! Our Slack community is here to support you on your AI journey. Post questions, talk to our engineers, and share your knowledge with other AI builders. As part of our ongoing efforts to make using Clarifai easier to learn, we've begun preparing Jupyter Notebooks which can be downloaded or run in Google Colab online. Predictive pricing is a pricing strategy that uses artificial intelligence (AI) to optimize product pricing based on market demand and competition. AI technology is being used to improve many aspects of retail shopping, from product recommendation engines to personalized customer service."
