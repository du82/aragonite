["https://www.clarifai.com/blog/introducing-our-game-changing-modules-feature"]
title = "Introducing Our Game-Changing Modules Feature"
description = "Introducing modules, a new way to extend Clarifai’s UIs and perform customized backend processing."
full_description = "Welcome to a new era of Clarifai development as we proudly introduce the 9.6 release, featuring our game-changing Modules. Clarifai is privileged to sit on the cutting edge in a technological world constantly thirsting for progress, helping developers' and data scientists' create powerful, efficient AI-building tools. As AI developers, you know the pain tips — complexities in integrating UI elements into your applications or coupling together multiple toolchains for backend processing. You know the effort it takes to streamline your AI-building workflow and increase productivity amidst a flurry of evolving trends. The Modules feature was conceived as a solution to your AI development challenges, and we couldn't be more excited to share it with you. But first, let's whet your appetite by delving back into an inspiring day of creative and innovative brainstorming at Clarifai — our monthly Hackday. A few months ago, I spent hours exploring the capabilities of Streamlit — a tool admired by the developer community — for rapidly creating user interfaces in Python, my preferred language. In a matter of minutes, I was not only able to understand Streamlit's functionalities but also build an engaging user interface. The revelation was universal — Streamlit could fundamentally change how developers and data scientists built AI applications. My intense Hackday session resulted in the creation of six game-changing experiences for Clarifai. Four hours of investment yielded a wealth of opportunities to upgrade our platform. The potential was so comprehensive and impactful that we felt the urge to bring this functionality to our customers. There was a gap between getting a tool like Streamlit running and truly leveraging it to streamline AI workflows seamlessly. We wanted to bridge this gap and alleviate recurring issues with other popular developer tools. In doing so, we envisioned a future where Clarifai users could rapidly develop and apply robust UI elements in production, benefitting both experienced developers and non-developer domain experts."
author = "Matthew Zeiler"
