["https://www.clarifai.com/blog/clarifai-10.8-supercharge-ai-models-with-clarifais-advanced-concept-mapping"]
title = "Clarifai 10.8: Supercharge AI Models with Advanced Concept Mapping"
description = "Advanced Concept Management, Prompt-Guard-86M, updates to the Input Viewer screen, and more."
full_description = 'This blog post focuses on new features and improvements. For a comprehensive list, including bug fixes, please see the release notes. A concept represents an entity, similar to a "tag" or "keyword," and is also referred to as a "class" in machine learning. Concepts can be used to annotate inputs that contain the associated entity or added to a model for entity recognition. The data tied to these concepts helps the model learn and understand the entity. On the Clarifai Platform, you can upload your inputs, create concepts, and manage various tasks within your app. We’ve now introduced a new way to define concept relations in Clarifai, allowing you to define hierarchical and semantic links between concepts. This helps build robust knowledge graphs and enabling more advanced computer vision and natural language processing capabilities. By mapping concepts as synonyms, hyponyms, or hypernyms, you can create context-aware models that deliver more accurate results. This is especially useful for managing data, building search engines, and organizing large datasets, ultimately improving the effectiveness of AI applications. Hyponym (Subtype Relation):Represents a "kind of" relationship, like "Dog" being a kind of "Animal". This hierarchy helps models generalize or specialize in identifying concepts.Usage: Hyponyms refine search results; a search for "Animal" might return "Dog", "Cat", and other animals. Hypernym (Supertype Relation):The opposite of a hyponym, it indicates a broader category or parent concept such as "Animal" being a hypernym for "Dog" or "Animal" is a parent of "Dog".Usage: Hypernyms group specific entities under broader categories, helping in data organization. Synonym (Equivalent Relation):Links concepts with the same or similar meanings, like "Puppy" and "Pup".Usage: Synonyms ensure that different terms for the same concept are treated as equivalent, improving search accuracy. Below is an example of how to add and manage concept relations in the Clarifai app using the Python SDK.'
author = "Sumanth P"
year_published = 2025
