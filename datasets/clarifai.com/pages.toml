["https://www.clarifai.com/clarifai-vision-february-2023-edition"]
title = "Clarifai Vision: February 2023 Edition"
full_description = "As February continues winter's slow march towards spring, we've got some new features to break through the slushiness! First off we're releasing Organizations in Clarifai Community, which allows for easy collaboration and sharing of resources on the platform. We've also got a new Resnet template to make your visual classifiers easier to train, a new and improved moderation model with 48 concepts adhering to GARM standards, Japanese and Korean text moderation models, and a slew of bug fixes. Stay tuned for more and be sure to check out the growing zoo of models on Clarifai Community! We're also implementing a major change to authentication for our API, which will become active on March 30. Please be sure to check the below link to our upcoming API changes to ensure that you have made the appropriate adjustments to your code. We've added Organizations, some new models, a bunch of bug fixes, and a number of quality-of-life improvements. Our Slack community is here to support you on your AI journey. Post questions, talk to our engineers, and share your knowledge with other AI builders. An upcoming version of Clarifai’s API, 9.3, will significantly change how personal access tokens (PATs) and API keys work. As part of our ongoing efforts to make using Clarifai easier to learn, we have a new walkthrough and accompanying Jupyter notebook that shows step by step how to run an image prediction. Going to Shoptalk 2023 Las Vegas? We'll be there March 27-28 with our award-winning visual search-powered product discovery and recommendation application, content moderation models, demographic analysis, and more. One of the most important step in developing ML is proper evaluation. Clarifai offers the ability to analyze and improve your models directly on the platform."
