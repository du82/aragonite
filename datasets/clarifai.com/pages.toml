full_description = '''Explore App Resources...App InformationOverviewAI LakeModelsWorkflowsModulesmclarifaimainUse ModelDelete Modelner-englishModel that processes and understands unstructured human language, which is a useful process for answering questions, retrieving information, and topic modeling.a813ff5b362c41f790c506b871e7dea4a813ff5b362c41f790c506b871e7dea4OverviewVersions Concepts (9).css-1d3bbye{box-sizing:border-box;display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-box-flex-wrap:wrap;-webkit-flex-wrap:wrap;-ms-flex-wrap:wrap;flex-wrap:wrap;width:100%;-webkit-flex-direction:row;-ms-flex-direction:row;flex-direction:row;}.css-g0s3ch{box-sizing:border-box;margin:0;-webkit-flex-direction:row;-ms-flex-direction:row;flex-direction:row;-webkit-flex-basis:100%;-ms-flex-preferred-size:100%;flex-basis:100%;-webkit-box-flex:0;-webkit-flex-grow:0;-ms-flex-positive:0;flex-grow:0;max-width:100%;}@media (min-width:600px){.css-g0s3ch{-webkit-flex-basis:58.333333%;-ms-flex-preferred-size:58.333333%;flex-basis:58.333333%;-webkit-box-flex:0;-webkit-flex-grow:0;-ms-flex-positive:0;flex-grow:0;max-width:58.333333%;}}@media (min-width:900px){.css-g0s3ch{-webkit-flex-basis:75%;-ms-flex-preferred-size:75%;flex-basis:75%;-webkit-box-flex:0;-webkit-flex-grow:0;-ms-flex-positive:0;flex-grow:0;max-width:75%;}}NotesNamed Entity Recognition (NER) Model – EnglishIntroductionThis large BERT model identifies cased English. This model is large as it was pretrained on a large corpus of English data, i.e., it has been finetuned on CoNLL-2003, a dataset focused on named entity recognition (NER). The model is also cased, meaning that it is capable of recognizing capitalization differences, e.g., english vs. English. This model is ready to use and achieves state-of-the-art performance is NER tasks.NER is an application of Natural Language Processing (NLP) that processes and understands unstructured human language. It is also known as entity identification, entity chunking, and entity extraction. NER extraction is a powerful process for answering questions, retrieving information, and topic modeling.The original German language BERT-NER model was released on Oct. 2020, and it consists of a German BERT language model trained collaboratively by the makers of the original German BERT (aka. "bert-base-german-cased") and the dbmdz BERT (aka. bert-base-german-dbmdz-cased). Since this release, other BERT models using other languages have been based on this process, and they have been used extensively in research.LimitationsNote that this model is limited by its training dataset of entity-annotated news articles from a specific span of time. This may not generalize well for all use cases in different domains. Furthermore, the model occasionally tags sub-word tokens as entities and post-processing of results may be necessary to handle those cases.More InfoThis BERT NER model was developed by the MDZ Digital Library team (dbmdz) at the Bayerische Staatsbibliothek (Bavarian State Library):MDZ Digital Library team repository: GitHubDBMDZ BERT models repository: GitHubThe original Hugging Face model page is lacking information, but it has been included for reference purposes: dbmdz/bert-large-cased-finetuned-conll03-englishSince there is great overlap with other BERT-based NER models, we recommend relying in similar models for additional information:dslim/bert-base-NERdslim/bert-large-NERDatasetThe data used to train this model is the CoNLL-2003 (Conference on Computational Natual Language Learning 2003) shared task dataset.This dataset concerns language-independent NER. It focus on four types of named entities:PeopleLocationsOrganizationOther miscellaneous entities that do not belong in the previous three groups.The contents of the dataset are four columns separated by a single space. Each word is in a separate line and there is an empty line after each sentence. Each line contains four items, (1) words or tokens, (2) part-of-speech (POS) tag, (3) syntactic chunk tag, and (4) the named entity tag.The chunk tags and the named entity tags have the format I-TYPE which means that the word is inside a phrase of type TYPE. Only if two phrases of the same type immediately follow each other, the first word of the second phrase will have tag B-TYPE to show that it starts a new phrase. A word with tag O is not part of a phrase. Note the dataset uses IOB2 tagging scheme, whereas the original dataset uses IOB1.The training dataset distinguishes between the beginning and continuation of an entity so that if there are back-to-back entities of the same type, the model can output where the second entity begins. As in the dataset, each token will be classified as one of the following classes:AbbreviationDescriptionOOutside of a named entityB-MISBeginning of a miscellaneous entity right after another miscellaneous entityI-MISMiscellaneous entityB-PERBeginning of a person’s name right after another person’s nameI-PERPerson’s nameB-ORGBeginning of an organization right after another organizationI-ORGorganizationB-LOCBeginning of a location right after another locationI-LOCLocationThe CoNLL-2003 English dataset was derived from the Reuters corpus which consists of Reuters news stories.# of training examples per entity typeDatasetLOCMISCORGPERTrain7140343863216600Dev183792213411842Test166870216611617# of articles/sentences/tokens per datasetDatasetArticlesSentencesTokensTrain94614,987203,621Dev2163,46651,362Test2313,68446,435PaperIntroduction to the CoNLL-2003 Shared Task: Language-Independent Named Entity RecognitionAuthors: Erik F. Tjong Kim Sang, Fien De MeulderAbstractWe describe the CoNLL-2003 shared task: language-independent named entity recognition. We give background information on the data sets (English and German) and the evaluation method, present a general overview of the systems that have taken part in the task and discuss their performance.Dataset Instancesconll2003Size of downloaded dataset files: 4.63