["https://www.clarifai.com/customers/9gag"]
title = "Improving 9GAG's Content Moderation through AI | Clarifai"
description = "With Clarifai’s image recognition technology, 9GAG uses content moderation models to protect its user community from unwanted content. Read more here!"
full_description = '''9GAG is a Hong Kong-based entertainment platform and social media website, which allows its users to upload and share "user-generated content" or other content from external social media websites. It is the 6th most-followed brand on Instagram worldwide and has a total audience of 150 million people. As one of the top 300 global websites, 9GAG is constantly being updated with thousands of new user-generated media on a daily basis. Co-Founder and VP of Product, Chris Chan, knew that moderation was a foundation of a successful community. Although most people shared interesting and funny posts on 9GAG, some would try to post spam, inappropriate, or sexually explicit content. In order to protect users, the team of four moderators would manually review every post that was uploaded to the platform; a task which Chris admits was “a routine and often unpleasant job.”However, the platform was experiencing exponential growth and the sheer volume of content to be reviewed was becoming unmanageable. Chris and the team were keen to find a way to automate community moderation and thought that AI might provide them with a scalable, efficient solution that would support them as they continued to grow. The 9GAG team searched Hacker News and asked their network to recommend computer vision and AI solution platform providers. They created a shortlist and proceeded to compare and test the tools offered by these providers. During the testing phase, it became clear that Clarifai offered the best content moderation solution. Chris was particularly impressed by Clarifai’s ability to separate NSFW “explicit nudity” from “suggestive nudity” with a level of accuracy unmatched by Amazon and Google. Thanks to Clarifai's pre-trained moderation models, it took one developer just four weeks to integrate AI to the 9GAG content moderation process (a feat which Chris says “is pretty impressive”). Now, Clarifai’s intelligent moderation model checks over 20,000 pieces of user-generated content on 9GAG for gore, drugs, explicit, and suggestive nudity every day at a level of 95% accuracy compared to human review. Since implementing Clarifai's computer vision platform, 9GAG has reduced the hours spent moderating the platform for inappropriate content by over 90%. This has enabled the team to reinvest time in more impactful work, such as supporting the growing community.'''
