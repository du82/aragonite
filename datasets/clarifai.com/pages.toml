["https://www.clarifai.com/blog/clarifai-10.9-control-center"]
title = "Clarifai 10.9: Control Center: Your Unified AI Dashboard"
description = "Introducing Control Center, the Llama 3.2, o1-preview, and o1-mini models, along with new upload capabilities and more."
full_description = "This blog post focuses on new features and improvements. For a comprehensive list, including bug fixes, please see the release notes. We are excited to introduce the new Clarifai Control Center, the unified dashboard, a single pane of glass to monitor everything happening within your account on the platform. It serves as the sole source of truth for various information dimensions, enabling you to make informed decisions based on data from multiple sources. Control Center helps streamline the management of your Clarifai operations by consolidating all activities into a single interface, minimizing the need to switch between different tools or windows. It enables you to track your utilization of Clarifai's resources using charts, graphs, tables, and other tools, and centralizes financial data and resource usage into one interface. Additionally, it offers the ability to transform raw data such as model predictions, search operations, stored inputs, and model training hours into actionable insights. You can observe how your teams function and how it impacts operations and spend, and also audit any user-initiated event to trace its origin. Check out the quick tutorial below to learn more about Control Center. You can also find the detailed info on our docs here. Learn more about it here. This feature is currently in Private Preview. We'd love for you to try it out and provide your feedback. To do so feel free to sign up for the Private Preview here. We've expanded our model upload functionality to improve integration with HuggingFace and enhance concept handling: We've also published a public roadmap to give you a view of our upcoming plans and to gather your valuable feedback. You can explore the features we're considering, vote for the ones you want most, or submit new ideas. Check out the roadmap here."
