["https://www.clarifai.com/products/mesh-workflows"]
title = "Mesh Workflows | Machine Learning for Advanced Modeling"
description = "Connect AI machine learning mesh workflows to perform complex data operations and build AI solutions that target your specific business use cases."
full_description = "With Mesh Workflows, you can work with your machine learning models like they are nodes in a graph. Clarifai makes it easy to connect together models of different kinds so that you can perform complex operations on your data, and build solutions that target your specific business needs. The nodes in your Mesh Workflows can accept data from your database or other models. Just select a model that accepts the type of input that you would like to work with. The concepts detected by your model can be used as inputs. This can help you to label and structure your data. The abstract mathematical representation generated by your machine learning model can be used to power new custom models. Many models can accept specific regions of an image as an input, helping you understand the specific objects in your visual data. Models can accept specific regions of an image as an input along with any detected concepts that your model has identified. Detect text in images and then prepare this data for analysis by natural language processing (NLP) models. The abstract mathematical representation generated by your machine learning model can be used to power new custom models or search. Models can provide embedding representations of specific regions of your images and videos so that you can learn more about specific objects in your data. Detect text in images and then prepare this data for analysis by natural language processing (NLP) models. Text is a common output for many object character recognition (OCR) and natural language processing (NLP) models. Clusters are groups of semantically similar images and video frames. Clusters help you to search your data based on visual similarity. Learn about some of the ways that you can use machine learning models and Mesh Workflows to power your business with the fastest time-to-accuracy in AI. React to the real-world faster that ever was possible before with the power of AI. Mesh Workflows can turn the predictions made by your AI models into action. Send alerts, trigger external systems, or even route data for further processing."
