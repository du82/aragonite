["https://www.clarifai.com/blog/llama-2-hackathon-with-clarifai-winners-announcement"]
title = "Llama 2 Hackathon with Clarifai: Full List of Winners"
description = "Explore the winners of the Llama 2 Hackathon. Discover their innovative AI solutions and how they leveraged Clarifai's platform to succeed."
full_description = "Last month, we partnered with Lablab.ai to host the Llama 2 Hackathon with Clarifai. The Hackathon aimed to nurture creativity in the development of AI-first products using the powerful Llama 2 LLM from Meta, with any one of the 7B, 13B, and 70B parameter variants. A total of 1,765 enthusiasts comprising 227 teams registered, resulting in an impressive 51 project submissions. With so many great entries, the task of selecting the winners proved to be a challenging one! Here are some of the standout projects. The challenge required participants to make Llama 2 the core component of their projects while also leveraging other groundbreaking models like Stable Diffusion XL, Code Llama, GPT-4, and more. SightCom, won the top prize with a mobile app designed for visually impaired individuals using the Flutter framework. It uses Blip 2, Color Recognition model, Optical Character Recognition model, Llama 2 7B and BARCODE-QRCODE-Reader workflow in the backend. It offers five unique accessibility features, all seamlessly activated through voice commands:1. Scene Description: Using Blip 2, an image captioning model, the app narrates the objects it identifies through the camera, helping users understand their surroundings.2. Color Recognition: It identifies the colors of objects, enhancing their awareness of the visual world using Clarifai's Color Recognition Model3. Text Recognition: Using an Optical Character Recognition model, text within the camera's view is converted into spoken words.4. Product Reader: By scanning barcodes with the BARCODE-QRCODE-Reader Workflow, the app provides detailed information about products, empowering users to make informed choices while shopping.5. QnA Chatbot: Powered by Llama 2 7B model, the app also offers a virtual assistant that responds to users questions. FINGU won second place with its solution aimed at handling personal finances. Imagine FINGU as a financial expert that constantly learns from your financial interactions, behaviors, and market trends."
