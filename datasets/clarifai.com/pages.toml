["https://clarifai.com/privacy-policy"]
title = "Clarifai Privacy Policy"
description = "Clarifai takes data privacy and security very seriously. Learn how we treat Personal Data we get when you access or interact with our services or business."
full_description = '''Terms of Service Data Privacy Addendum Privacy Policy Cookie Policy Copyright Complaint Form Clarifai Data Privacy Policy EFFECTIVE DATE: December 22, 2022 to go into effect January 1, 2023 Clarifai is committed to your privacy. This privacy policy (“Privacy Policy”) is intended to help you understand the data we collect about you, how we use it and who we share it with so you can make informed decisions about your Personal Data (defined below) when using Clarifai’s Services. To make it easier to navigate this Privacy Policy, we have divided it into the sections detailed below. About This Privacy Policy We start by telling you more about who we are and give a general overview of the information this Privacy Policy is intended to cover. Personal Data We Collect Via Our Services Next, we go into detail about the Personal Data we collect and how we use this data. For example, we are always striving to improve our services and your experience, and we collect certain Personal Data for these purposes. We may also sometimes use this data to comply with our legal obligations or to prevent violations of our contractual terms and policies. Personal Data We Collect About Candidates This section expands on the Personal Data we collect about Clarifai employment candidates, which we use in connection with our recruitment efforts. How We Share and Transfer Personal Data We Collect Here, we describe our practices regarding how Personal Data we collect is shared with our service providers and other third parties. For example, we may share your Personal Data with our payment processors as necessary to process your payment. This section also explains how we use information collected about you, through the use of cookies, to improve and customize your Clarifai experience. Finally, we address our age requirements for use of our Services. Your Privacy Rights Your privacy rights may differ based on where you are located. In this section, we set out in detail special rights you may have in your jurisdiction and how to exercise those rights. We also describe the measures we take to ensure that transfers of Personal Data from Europe to the United States comply with applicable laws and regulatory frameworks (such as the GDPR).Other Information The final section of this Privacy Policy includes important information about controlling your Personal Data and notifications, updates to this Privacy Policy, and our contact information. If you have any questions or comments regarding this Privacy Policy or its substance, you can contact our privacy team at privacy@clarifai.com. By using or accessing the Services in any manner you acknowledge that you have read and understand the practices and policies outlined in this Privacy Policy, including our collection, use and sharing of your Personal Data in the following ways. If you do not agree with this Privacy Policy, please do not access and use the Services. Your use of Clarifai’s Services is subject to the Terms of Service and this Privacy Policy. Any terms we use in this Privacy Policy without defining them have the definitions given to them in the Terms of Service. If you have any questions, feel free to contact us at privacy@clarifai.com. About This Privacy Policy Who We Are Clarifai, Inc. (“Clarifai,” “we,” or “us”) offers a full-lifecycle deep learning artificial intelligence platform for computer vision, natural language processing and more. We help organizations transform unstructured images, video, text and other electronic data into structured data at a significantly faster and more accurate rate than humans would be able to do on their own. You can find out more about us here.If you are located in the European Economic Area ("EEA"), United Kingdom or Switzerland, the data controller of your Personal Data is Clarifai, Inc. What This Privacy Policy Covers This Privacy Policy describes how we collect, use and share your Personal Data for our business purposes, including: when you visit, use or interact with any of our websites (including https://www.clarifai.com/), social media pages or public forums (such as our blogs), eBooks or other publications, or when you receive marketing or sales communications from us or attend one of our webinars, conferences or other events (collectively referred to as our "Marketing Activities") when you access or use our Services as an authorized user ("Service User"), for example as an individual customer or an employee of a customer that has provided you with access to our Services when your Personal Data is included in the content that we process in connection with the Services ("Content") when you apply for a job or other role with us as an applicant or candidate ("Candidate") “Personal Data” means any information that identifies or relates to a particular individual and also includes information referred to as “personally identifiable information” or “personal information” under applicable data privacy laws, rules, or regulations. This Privacy Policy does not cover the practices of companies we don’t own or control or people we don’t manage. Similarly, this Privacy Policy may not apply to the Personal Data that we process as a data processor or service provider on behalf of our customers in the course of providing our Services. We are not responsible for the privacy practices of our customers or other third parties, which may differ from those described in this Privacy Policy. Personal Data We Collect Via Our Services This Section applies to the Personal Data that we collect and process in connection with our Marketing Activities and to the Personal Data of Service Users and individuals whose Personal Data may be included in Content. Sources of Personal Data We collect Personal Data about you from: You when you provide such information directly to us, such as: when you create an account and use our Services when you send us Personal Data (including images, videos and text, and geolocation or other metadata attached to such Personal Data) when you send us an email, ask for help from support, or otherwise contact us when Personal Data is automatically collected when you use the Services, such as: through Cookies (defined below) if you use certain applications and software we make available (such as our SDKs and APIs), we may receive and collect information transmitted from your computing device for the purpose of providing you the relevant Services when you add annotations that include Personal Data about you to the data you send to us by using our models and algorithms Third parties, when they provide us with Personal Data about you (“Third Parties”). Third Parties that share your Personal Data with us include: Service Users. Service Users may provide Personal Data about you when they use our Services: when Service Users send Content to us when they use our Services and send us Personal Data about you, including, for example, images, videos, audio and text, and geolocation or other metadata attached to such Personal Data if Service Users use certain applications and software we make available (such as our SDKs and APIs), we may receive and collect information transmitted from their computing device for the purpose of providing them the relevant Services, and the information may include Personal Data about you when Service Users add annotations that include Personal Data to the Content they send to us when they use our Services by using our models Service providers. For example, we may use analytics of service providers to analyze how Service Users interact and engage with the Services, or third parties this may help us provide Service Users with customer support. We may also receive your Personal Data from third parties that provide us with sales leads. Social networks and other platforms connected to the Services. If you are a Service User and provide your social network account credentials to us or otherwise sign in to the Services through a third-party site or service (e.g., Github or Google), you understand some content and/or information in those accounts may be transmitted into your account with us. We utilize datasets from third party data providers and publicly available sources to provide and improve our Services, some of which may contain your Personal Data (such as images or videos of individuals). Us, when we add annotations that include Personal Data to the Content that Service Users send to us when they use our Services, by using our models and algorithms to make predictions about, or by adding tags that describe that Content. Categories of Personal Data We Collect The following table details the categories of Personal Data that we collect and have collected via our Services. For each category of Personal Data, the table also sets out the categories of sources and the third parties with whom we share that Personal Data. Category of Personal Data Examples of Personal Data Collected Source Third Parties With Whom We Share Data for Business Purposes Contact Data/Identifiers First and last name Email Company name Job title and function Phone number Location Password You Third parties Service providers Parties you or a Service User sharing your Personal Data with us authorizes, accesses or authenticates Social Network and other Connected Platform Data URLs of publicly available accounts on social networks such as LinkedIn Online Identifiers Social media profile IDs Credentials from other online services you use to access the Services, such as email address, full name and profile image from when you sign into our Service using Google Sign-In You Third parties Service providers Parties you or a Service User sharing your Personal Data with us authorizes, accesses or authenticates Payment Information Credit card number Debit card number Billing address You Service providers Device/IP Information IP address Browser You Third parties Service providers Web Analytics Browsing history Search history Geographic information Length of