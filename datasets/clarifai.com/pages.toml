["https://www.clarifai.com/blog/supercharge-your-llm-via-retrieval-augmented-fine-tuning"]
title = "Supercharge your LLM via Retrieval Augmented Fine-tuning"
description = "Learn about Retrieval Augmented Fine-Tuning (RAFT), a method that combines the benefits of Retrieval-Augmented Generation (RAG) with the power of Fine-Tuning."
full_description = '''Large Language Models (LLMs) have become increasingly valuable for answering questions in specialized domains, such as medical or legal documents. To enhance their performance, it’s common to inject domain-specific knowledge into LLMs through techniques like Retrieval-Augmented Generation (RAG) or fine-tuning. In this blog post, we explore a fine-tuning technique known as Retrieval Augmented Fine-Tuning (RAFT) and evaluate its effectiveness in adapting pre-trained LLMs for RAG in specialized domains. RAG is a method to enhance LLMs when dealing with knowledge that is not “baked-in” during the pretraining stage. This often involves specific domains or more up-to-date information. A common way to build a RAG system is to retrieve chunked documents from a vector store and directly inject them into the LLM prompt. For example, a common prompt for the LLM would look like this: "Context information is below:\n{contexts}\nGiven the context information and not prior knowledge, answer the query.\nQuery: {question}\nAnswer: " While these systems are easy to build, there may still be room for extra performance to be squeezed out. The debate moves to whether RAG or fine-tuning is more preferable for a given use case. A recent paper called RAFT studies this problem and proposes a novel method to adapt a pre-trained LLM using fine-tuning with retrieval-augmented question answering (QA) data. Retrieval Augmented Fine-Tuning (RAFT), introduced by Zhang et al, is a method designed to enhance the performance of LLMs in specific domains. RAFT enhances the quality of answers by leveraging generated Chain of Thought (CoT) responses from the provided data. Essentially, RAFT refines a model's reasoning and answer-generation capabilities by utilizing large pre-trained models. The process involves generating answers with a large model and then fine-tuning these answers on a smaller, more specialized model. This approach helps create high-quality CoT answers, significantly boosting the model's performance. In doing so, RAFT bridges the gap between general-purpose LLMs and the specialized knowledge required for specific domains.'''
author = "Phat Vo and Isaac Chung"
year_published = 2025
clearnet = "https://www.clarifai.com/blog/supercharge-your-llm-via-retrieval-augmented-fine-tuning"
