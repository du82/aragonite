["https://www.clarifai.com/customers/film-media-company"]
title = "Improving the Speed of Metadata Generation with CV | Clarifai"
description = "Learn how a leader in film digitization technology improved the speed of metadata generation by utilizing computer vision. Read their story!"
full_description = "A world leader in file digitization and restoration of valuable archives came to Clarifai to improve the metadata tagging. The company specializes in transferring old film archives into digital files. The company’s software for “smart indexing” wanted to use AI and machine learning to dramatically increase the speed and precision with which metadata can be included within the film asset. A period of investigating the possible alternative approaches led the company to Clarifai's AI driven computer vision platform and its ability to automate the tagging process. Using Clarifai, the company was able to automatically detect objects that appeared in the archived material with the highest accuracy and faster than a human eye could ever achieve. This meant that the creation of easily searchable metadata was transformed as was the value of the archived asset. A period of investigating the possible alternative approaches led the company to Clarifai. Clarifai's AI driven computer vision platform could take the place of a human viewing all the footage in its entirety while frantically taking notes. Using Clarifai, the company was able to automatically detect objects that appeared in the archived material with the highest accuracy and faster than a human eye could ever achieve. This meant that the creation of easily searchable metadata was transformed as was the value of the archived asset. With a team of two talented developers, the company built a platform that automatically created a keyframe every third second, while digitizing old film content. After which it sent the image to the Clarifai API – returning it, fully indexed, in real time. If you are encountering a technical or payment issue, the customer support team will be happy to assist you."
