["https://www.clarifai.com/customers/home-improvement-retailer"]
title = "How Retailers Are Improving Product Recommendations With AI"
description = "See how a leading home improvement retailer used visual search technology to improve product recommendation search results to increase conversions and revenue."
full_description = "In this age of instant gratification, consumers expect to be able to purchase on the go. However, thanks to widespread adoption, mobile apps are no longer differentiators for retailers. It’s all about improving the customer experience. A $70 Billion retailer with 2000 store locations and over 200,000 employees wanted to do just that by helping connect customers with precisely what they were looking for at the moment of inspiration. To remain competitive against the market leader in their space, the retailer needed to improve the customer experience by providing visual search in a mobile application across their product catalog. Their expected outcome was to lower shopper bounce rates by offering more engaging search and recommendation features, and improving the customer experience by reducing the time and effort spent on product searches—which would lead to more revenue by increasing the number of conversion opportunities. With over 2 million products and 8 million images across 20-30 categories and over 5,000 taxonomies, helping customers search and find what they were looking for based on words alone and the way they thought of things was certainly a challenge. The challenge was compounded by the fact that the retailer had a shifting base of 1 million product catalog changes a year. The retailer turned to Clarifai to help them build a Snap and Search mobile application. Snap & Search offered their shoppers the ability to use their mobile phones to take pictures of items they like, so they could find what they were looking for or find similar products in the retailer’s catalog faster and more easily than a word search. Snap and search also provided the retailer with the ability to offer their shoppers product recommendations based on their search. They chose Clarifai because of our platform ease-of-use and because the accuracy metrics achieved in a proof of concept were 3X greater than what their data scientists had previously achieved. Clarifai’s exponential improvement in accuracy was driven by the platform’s AI-assisted data labeling capabilities to deliver more accurate training data than the internal had produced."
