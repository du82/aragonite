full_description = '''Terms of Service Data Privacy Addendum Privacy Policy Cookie Policy Copyright Complaint Form Cookie Notice EFFECTIVE DATE: July 12, 2022 This cookie notice ("Cookie Notice") explains how Clarifai, Inc. ("Clarifai", "we", or "us") uses cookies and similar technologies to recognize you when visiting our website at www.clarifai.com and when using Clarifai's services (together, the "Services"). It explains what these technologies are and why we use them, as well as your rights to control our use of them. Any terms we use in this Cookie Notice without defining them have the definitions given to them in the Terms of Service. If you have any questions, feel free to contact us at privacy@clarifai.com. What Are Cookies The Services use cookies and similar technologies such as pixel tags, web beacons, clear GIFs, mobile identifiers, and JavaScript (collectively, "Cookies") to enable our servers to recognize your web browser and tell us how and when you visit and use our Services. Cookies are small data files that are placed on your computer or mobile device when you visit a website. Cookies set by the website owner (in this case, Clarifai) are called "First Party Cookies". Only the website owner can access the First Party Cookies it sets. Cookies set by parties other than the website owner are called "Third Party Cookies". Third Party Cookies enable third party features or functionality to be provided on or through the website (e.g., like advertising, interactive content and social sharing). The parties that set these Third Party Cookies can recognize your device both when it visits the website in question and also when it visits other websites that have partnered with them. How We Use Cookies And Similar Technologies The Services use Cookies to enable our servers to recognize your web browser and tell us how and when you visit and use our Services, to analyze trends, learn about our user base, and operate and improve our Services. For example, we use Cookies to tailor the Services by tracking navigation habits, measuring performance, customizing user experiences with the Services and for analytics and fraud prevention. We may also supplement the information we collect from you with information received from third parties, including information collected using Third Party Cookies. We use the following types of Cookies: Essential Cookies. Essential Cookies are required for providing you with features or services that you have requested. For example, certain Cookies enable you to log into secure areas of our Services. Disabling these Cookies may make certain features and services unavailable. Functional Cookies. Functional Cookies are used to record your choices and settings regarding our Services, maintain your preferences over time and recognize you when you return to our Services. These Cookies help us to personalize our content for you and remember your preferences. Performance/Analytical Cookies. Performance/Analytical Cookies allow us to understand how visitors use our Services such as by collecting information about the number of visitors to the Services, what pages visitors view on our Services, how long visitors are viewing pages on the Services, mouse clicks, mouse movements, scrolling activity, and text typed into the Services. Performance/Analytical Cookies also help us measure the performance of our advertising campaigns in order to help us improve our campaigns and the Services’ content for those who engage with our advertising. For example, Google Inc. ("Google") uses cookies in connection with its Google Analytics services. Google’s ability to use and share information collected by Google Analytics about your visits to the Services is subject to the Google Analytics Terms of Use and the Google Privacy Policy. You have the option to opt-out of Google’s use of cookies by visiting the Google advertising opt-out page at https://policies.google.com/technologies/ads or the Google Analytics Opt-out Browser Add-on at https://tools.google.com/dlpage/gaoptout/. We also use analytics services provided by Hotjar and HubSpot Retargeting/Advertising Cookies. Retargeting/Advertising Cookies collect data about your online activity and identify your interests so that we can score leads and provide you with web and email content that we believe is relevant to you. In some cases, we may use Cookies to collect Personal Data or to collect information that becomes Personal Data if we combine it with other information. For more information about how we process your Personal Data, please read our Privacy Policy. Cookies We Serve Through Our Technologies The specific Cookies served through our Services, and the purposes they perform, are described below: Essential Cookies Cookie name Who serves this Cookie Description Duration __cf_bm Hubspot This cookie is used to distinguish between humans and bots. This is beneficial for the website, in order to make valid reports on the use of their website. 1 Day __cfruid Cloudflare This cookie is a part of the services provided by Cloudflare, including load-balancing, deliverance of website content and serving DNS connection for website operators. Session _GRECAPTCHA Google This cookie is used to distinguish between humans and bots. This is beneficial for the website, in order to make valid reports on the use of their website. 179 Days embed/v3/counters.gif Clarifai This cookie is used to implement forms on the website. Session embed/v3/counters.gif Clarifai This cookie is used to implement forms on the website. Session intercom.played-notifications Clarifai This cookie is used by the website to determine which support notifications the user has been shown. Session li_gc LinkedIn This cookie stores the user's cookie consent state for the current domain 2 Years rc::a Google This cookie is used to distinguish between humans and bots. This is beneficial for the website, in order to make valid reports on the use of their website. Persistent rc::b Google This cookie is used to distinguish between humans and bots. Session rc::c Google This cookie is used to distinguish between humans and bots. Session test_cookie Doubleclick.net This cookie is used to check if the user's browser supports cookies 1 Day visitorId Zoominfo.com This cookie preserves user states across page requests 1 Year Functional Cookies Cookie name Who serves this Cookie Description Duration intercom-id-# Clarifai This cookie allows the website to recognize the visitor, in order to optimize the chat-box functionality. 270 Days intercom-session-# Clarifai This cookie sets a specific ID for the user which ensures the integrity of the website’s chat function. 6 Days intercom.intercom-state-# Intercom This cookie allows the website to recognize the visitor, in order to optimize the chat-box functionality. Persistent lang LinkedIn This cookie remembers the user's selected language version of a website Session Performance/Analytical Cookies Cookie name Who serves this Cookie Description Duration _ga Google This cookie registers a unique ID that is used to generate statistical data on how the visitor uses the website. 2 Years _gat Google This cookie is used by Google Analytics to throttle request rate. 1 Day _gid Google This cookie registers a unique ID that is used to generate statistical data on how the visitor uses the website. 1 Day _hjAbsoluteSessionInProgress Hotjar This cookie is used to count how many times a website has been visited by different visitors - this is done by assigning the visitor an ID, so the visitor does not get registered twice. 1 Day _hjFirstSeen Hotjar This cookie is used to determine if the visitor has visited the website before, or if it is a new visitor on the website. 1 Day _hjIncludedInPageviewSample Hotjar This cookie is used to detect whether the user navigation and interactions are included in the website’s data analytics. 1 Day _hjIncludedInSessionSample Hotjar This cookie registers data on visitors' website-behavior.