["https://www.clarifai.com/blog/meet-the-winners-of-the-ai-devworld-hackathon"]
title = "Meet the Clarifai Winners of the AI DevWorld Hackathon"
description = "Meet the Winners of the the AI DevWorld Hackathon"
full_description = "In October 2023, Clarifai was excited to participate in the API + AI DevWorld Hackathon, which was in-person in San Francisco and virtual. The hackathon aimed to bring creativity to building AI-first products using powerful language models. The challenge required participants to create a groundbreaking Generative AI project and showcase an innovative application using Clarifai’s diverse range of models and leveraging workflows that help chain together multiple models with a single API. 20 impressive projects were created using Clarifai and submitted for judging. Here are the projects that stood out the most! The Hello Sign & Clarifai Legal Contract Documents Analyzer won the top prize! It is an AI tool that analyzes, summarizes, and translates legal contract documents before sending them to the clients/customers for document signing. It leverages Clarifai and Dropbox/Hellosign API. Clarifai Document Analyzer solves all the above problems by breaking down contract documents into simple and easily understandable structures. Once the user uploads a contract document PDF file, the application extracts the text from the document and stores the details in the database using a PDF parser library. Next, the app leverages Clarifai's Sentiment API to run sentimental analysis on the extracted text documents to break down the document contents. It analyzes each document for sentiments such as positivity, negativity, or neutral statements. The app also uses the GPT-3.5 Model from Clarifai to detect, analyze, and list all the people, persons, organizations, companies, and entities involved in the contract signing documents, as well as to pinpoint all the keywords and keyphrases involved in the contract signing documents. It now summarizes the contract documents and generates relevant insights, making document comprehension easier. The application also allows users to ask questions about signing documents and provides an option to translate extracted text documents from one language to another."
author = "Sumanth P"
year_published = 2025
