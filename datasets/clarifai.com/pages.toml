full_description = "Terms of Service Data Privacy Addendum Privacy Policy Cookie Policy Copyright Complaint Form Clarifai Data Processing Addendum EFFECTIVE DATE: December 22, 2022 to go into effect January 1, 2023 This Data Processing Agreement only applies to Customers if Customer has a Clarifai Account located in the United States, the United Kingdom, the European Economic Area and Switzerland. 1. This Data Processing Addendum (“Addendum”) supplements and forms a part of the Clarifai Terms of Services available at https://www.clarifai.com/company/terms as updated from time to time between Customer (defined below) and Clarifai, Inc. (“Clarifai”), or other agreement between Customer and Clarifai governing Customer’s use of the Services (defined below) (the “Agreement”), when Applicable Privacy Laws (defined below) apply to Customer’s use of the Services to process Customer Personal Data (defined below). This Addendum is incorporated into, and forms part of the Agreement entered into by and between Clarifai and Customer (each a “Party” and collectively the “Parties”). Any terms not defined in this Addendum shall have the meanings set forth in the Agreement. In the event of a conflict between the terms and conditions of this Addendum and the Agreement, the terms and conditions of this Addendum shall supersede and control. 2. Definitions. Capitalized terms not defined in this DPA have the meanings given to them in the Clarifai Terms of Services. “Approved Data Transfer Mechanism” means, as applicable, the EEA SCCs, the UK Data Transfer Addendum or any data transfer mechanism a supervisory authority approves under DP Law that is incorporated into this DPA. “Authorized Services” means Services that a Governmental Authority licenses, authorizes or regulates. “CCPA” means the California Consumer Privacy Act of 2018, Cal. Civ. Code Sections 1798.100-1798.199. “DP Law” means all Law that applies to Personal Data Processing under the Clarifai Terms of Services and this DPA, including international, federal, state, provincial and local Law relating to privacy, data protection or data security. “Data Controller” means the entity which, alone or jointly with others, determines the purposes and means of Processing Personal Data, which may include, as applicable, a “Business” as defined under the CCPA. “Data Processor” means the entity that Processes Personal Data on behalf of the Data Controller, which may include, as applicable, a “Service Provider” as defined under the CCPA. “Data Security Measures” means technical and organizational measures that are intended to secure Personal Data to a level of security appropriate for the risk of the Processing. “Data Subject” means an identified or identifiable natural person to which Personal Data relates. “EEA” means the European Economic Area. “EEA SCCs” mean Module 2 (Transfer: Controller to Processor) of the standard contractual clauses set out in the European Commission Implementing Decision (EU) 2021/914 on standard contractual clauses for the transfer of personal data to third countries according to the GDPR. “Europe” means, for the purposes of this Addendum, the Member States of the European Union, Iceland, Liechtenstein, Norway (together, the “EEA”) plus Switzerland and the United Kingdom. “GDPR” means the General Data Protection Regulation (EU) 2016/679. “Instructions” means this DPA and any further written agreement or documentation under which the Data Controller instructs a Data Processor to perform specific Processing of Personal Data for that Data Controller. “Joint Controller” means a Data Controller that jointly determines the purposes and means of Processing Personal Data with one or more Data Controllers. “Personal Data” means any information relating to an identified or identifiable natural person that is Processed in connection with the Services, and includes “personal data” as defined under the GDPR and “personal information” as defined under the CCPA “Process” means to perform any operation or set of operations on Personal Data or sets of Personal Data, such as collecting, recording, organizing, structuring, storing, adapting or altering, retrieving, consulting, using, disclosing by transmission, disseminating or otherwise making available, aligning or combining, restricting, erasing or destroying, as described under DP Law. “Sensitive Data” means (a) Personal Data that is genetic data, biometric data, data concerning health, a natural person's sex life or sexual orientation; or (b) data about racial or ethnic origin, political opinions, religious or philosophical beliefs, or trade union membership, to the extent this data is treated distinctly as a special category of Personal Data under DP Law. “Sub-processor” means an entity a Data Processor engages to Process Personal Data on that Data Processor’s behalf in connection with the Services. “UK Data Transfer Addendum” means the international data transfer addendum to the EEA SCCs issued by the United Kingdom’s Information Commissioner’s Office. “UK GDPR” means the GDPR, as transposed into United Kingdom national law by operation of section 3 of the European Union (Withdrawal) Act 2018 and as amended by the Data Protection, Privacy and Electronic Communications (Amendments etc.) (EU Exit) Regulations 2019. The terms “Controller”, “Processor”, “Data Subject”, “Supervisory Authority” and “Process” shall have the meanings given to them under Applicable Privacy Laws and “Processes”, “Processing” and “Processed” shall be interpreted accordingly, and the terms “Business” and “Service Provider” shall have the meanings given to them under the CCPA. 3. Clarifai as Data Processor and Data Controller. 3.1. Data Processing Roles. To the extent Clarifai Processes Personal Data as a: (a) Data Processor, it is acting as a Data Processor on behalf of you, the Data Controller; and (b) Data Controller, it has the sole and exclusive authority to determine the purposes and means of Processing Personal Data it receives from or through you. 3.2. Categories of Data Subjects and Personal Data. (a) Data Subjects. Clarifai may Process the Personal Data of your Customers, representatives and any natural persons who access or use your Clarifai Account. (b) Personal Data. Where applicable, Clarifai may Process Payment Account Details,bank account details, billing/shipping address, name, date/time/amount of transaction, device ID, email address, IP address/location, order ID, payment card details, tax ID/status, unique customer identifier, identity information including government issued documents (e.g., national IDs, driver’s licenses and passports). (c) Sensitive Data. Where applicable, Clarifai may Process text, audio, video, facial recognition data or other information that can be considered sensitive personal information. 3.3. Data Processing Purposes. (a) The purposes of Clarifai’s Processing of Personal Data are when Clarifai is operating in its capacity as a Data Processor for a Service, including: (i) servicing the Clarifai platform; and (ii) facilitating payment transactions on behalf of Clarifai users. (b) The purposes of Clarifai’s Processing of Personal Data in its capacity as a Data Controller are: (i) determining the Processing of Personal Data when providing Clarifai products and services (ii)monitoring, preventing and detecting fraudulent activity on the Clarifai platform; (iii) complying with Law, including applicable know-your-customer obligations; and (iv) analyzing and developing Clarifai’s services. 4. Clarifai Obligations when Acting as a Data Processor. 4.1. Obligations. To the extent that Clarifai is acting as a Data Processor for you, Clarifai will: (a) Process Personal Data on behalf of and according to your Instructions. Clarifai will not sell, retain, use or disclose Personal Data for any purpose other than for the specific purposes of performing the Services and to comply with Law, unless otherwise permitted by the Clarifai Terms of Services (including this DPA) or DP Law. Clarifai will inform Customer if, in its opinion, Instructions violate or infringe DP Law; (b) ensure that all persons Clarifai authorizes to Process Personal Data in the context of the Services are granted access to Personal Data on a need-to-know basis and are committed to respecting the confidentiality of Personal Data; (c) to the extent required by DP Law, inform Customer of requests Clarifai receives from Data Subjects (including “verifiable consumer requests” as defined under the CCPA) exercising their applicable rights under DP Law to (i) access (e.g., right to know under the CCPA) their Personal Data; (ii) have their Personal Data corrected or erased; (iii) restrict or object to Clarifai’s Processing; or (iv) data portability. Other than to request further information, identify the Data Subject, and, if applicable, direct the Data Subject to Customer as Data Controller, Clarifai will not respond to these requests unless Customer instructs Clarifai in writing to do so; (d) to the extent required by DP Law, inform Customer of each law enforcement request Clarifai receives from a Governmental Authority requiring Clarifai to disclose Personal Data or participate in an investigation involving Personal Data; (e) to the extent required by DP Law, provide Customer with reasonable assistance through appropriate technical and organizational measures, at your expense, to assist Customer in complying with your obligations under DP Law, which assistance may include conducting data protection impact assessments and consulting with a supervisory authority, considering the nature of the Processing and the information available to Clarifai; (f) implement and maintain a written information security program with the Data Security Measures stated in Exhibit 1 of this DPA. In addition, Clarifai will implement a data security incident management program that addresses how Clarifai will manage a data security incident involving the accidental or unlawful destruction, loss, alteration or unauthorized disclosure of, or access to, Personal Data (“Incident”). If Clarifai is required by DP Law to notify Customer of an Incident, then Clarifai will notify Customer without unreasonable delay, but in no event later than any time period required by DP Law. In addition, for Incidents affecting Personal Data subject to GDPR or UK GDPR, Clarifai will notify Customer no later than 48 hours after Clarifai becomes aware of the Incident. Clarifai will partner with Customer to respond to the Incident. The response may include identifying key partners, investigating the Incident, providing regular updates, and discussing notice obligations. Except as required by DP Law, Clarifai will not notify your affected Data Subjects about an Incident without first consulting you. (g) engage Sub-processors as necessary to perform the Services based on the general written authorization Customer give to Clarifai under Section 4.2 of this DPA; (h) to the extent required by DP Law and upon your written request, contribute to audits or inspections by making audit reports available to you, which reports are Clarifai’s confidential information. Upon your written request, and no more frequently than once annually, Clarifai will promptly provide documentation or complete a written data security questionnaire of reasonable scope and duration regarding Clarifai and its Affiliates’ Processing of Personal Data. All documentation provided, including any response to a security questionnaire, is Clarifai’s confidential information; and (i) at your choice, and subject to Clarifai’s rights and obligations under the Clarifai Terms of Services (including this DPA), delete or return all Personal Data to Customer after the Term, and delete existing copies held by Stripe, unless Clarifai is required or authorized by DP Law to store Personal Data for a longer period. 4.2 Sub-processors. (a) Customer hereby provide Clarifai an upfront general authorization to engage Sub-processors and may ask for a list of Clarifai's current Sub-processors upon written request. Customer acknowledges that certain Sub-processors are essential to providing the Services and that objecting to the use of a Sub-processor may prevent Clarifai from offering the Services to Customer. If Customer reasonably objects to an engagement in accordance with this Section 4.2, the Parties shall discuss Customer's concerns in good faith with a view to achieving a commercially reasonable resolution. If the Parties cannot reach such a resolution, Customer may terminate the affected part of the Services within a reasonable period of time. Termination shall not relieve Customer of any fees owed to Clarifai under the Agreement. If Customer does not object to the engagement in accordance with this Section 4.2, Customer shall be deemed to have granted authorization to the Sub-processor for the purposes of this Addendum. In all cases, Clarifai will enter into a written agreement with each Sub-processor imposing on the Sub-processor data protection obligations equivalent to those imposed on Clarifai under this Addendum with respect to the protection of Customer Personal Data. Clarifai will remain liable to Customer for the performance of each Sub-processor’s obligations. Pursuant to the Standard Contractual Clauses entered into between the Parties under this Addendum (i) the above authorizations constitute Customer's authorization to Sub-processors for the purposes of the Standard Contractual Clauses, and (ii) Clarifai may be prevented from providing Customer with copies of its agreements with Sub-processors due to confidential information but Clarifai will endeavor to provide all information reasonably requested by Customer with respect to Sub-processor agreements. (b) Clarifai will enter into a written agreement with each Sub-processor that imposes on that Sub-processor obligations comparable to those imposed on Clarifai under this DPA, including implementing appropriate Data Security Measures. If a Sub-processor fails to fulfill its data protection obligations under that agreement, Clarifai will remain liable to Customer for the acts and omissions of its Sub-processor to the same extent Clarifai would be liable if performing the relevant Services directly under this DPA. 4.3 CCPA Certification. To the extent applicable to the Services, Clarifai certifies that it understands and will comply with the requirements in this DPA relating to the CCPA. 4.4 Disclaimer of Liability. Notwithstanding anything to the contrary in your or this DPA, Clarifai and its Affiliates will not be liable for any claim made by a Data Subject arising from or related to Clarifai or any of its Affiliates’ acts or omissions, to the extent that Clarifai was acting in accordance with your Instructions. 5. Your obligations when acting as a Data Controller. Customer must: 5.1 only provide Instructions to Clarifai that are lawful; 5.2 comply with and perform your obligations under DP Law, including Data Subje"
