["https://www.clarifai.com/customers/acquia-dam"]
title = "Acquia DAM's Digital Asset Management Platform Incorporates AI | Clarifai"
description = "Acquia DAM incorporate AI automation into their digital asset management platform in order to improve metadata generation and searchability of their assets."
full_description = "Acquia DAM is a marketing technology company that manages content for over 700 customers. Its cloud-based software, the Acquia DAM, aggregates and automates content distribution. With over a 73-year track record of innovation and customer success, Acquia DAM services enterprise organizations with customers who include Dyson, New Balance, Crayola and Hootsuite. Metadata is the lifeblood of a digital asset management system. Tagging assets with keywords is critical to search-ability. However, it’s the most labor-intensive part of being a DAM administrator. As the volume of content scales, it becomes increasingly difficult to find the exact content that you are looking for. In order to scale their platform to manage the amounts of content being generated, Acquia DAM needed to explore ways to automate the metadata generation process. After considering other solutions such as Amazon Rek, Imagga and Cloudsight, Acquia DAM chose Clarifai. Clarifai’s platform offered AI automated metadata generation that sped the tagging process by 100x. To further support that Clarifai was the right choice was the fact that Forrester ranked Clarifai a leading computer vision platform alongside the biggest players in the industry. Acquia DAM was also impressed with Clarifai’s customer service reputation and quick response times. They believed that Clarifai’s versatile AI platform could scale in order to meet their future use case needs. Acquia DAM worked with Clarifai to train and build a custom AI model for metadata generation in order to improve their asset searchability for its large number of customers. By using Clarifai’s automated metadata generation capabilities, Acquia DAM customers have saved a significant amount of time tagging assets. In addition, Acquia DAM customers can now easily find their assets based on visual attributes that could not previously be done via text searches. Untagged stock images were also made searchable with descriptive keywords. With the help of Clarifai, Acquia DAM can reduce the burden of manually tagging assets off of its administrators. Today, Acquia DAM's customers devote more time to focusing on enriching content for its customer channels."
