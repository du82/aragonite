title = "Use Computer Vision AI To Drive Data Driven Decisions | Clarifai"
description = "See how an advertising analytics company uses image recognition to help their customers mine data to gather customer insights faster."
full_description = "A research and consulting company that applies a unique behavioral framework and decades of category expertise to define and diagnose factors that influence consumer brands. They help companies make better and smarter marketing decisions by defining and diagnosing shopper behaviors that drive growth and brand loyalty. Their customers' corporate brand and design teams had to spend a number of hours going through design sprints where they draft and refine package designs. There are numerous iterations. When a finished prototype is ready for the corporate insights teams to review, it sometimes fails validation testing because there is no time to include a consumer review of the project. As a result, the company wanted a quick, cost-effective method to include consumer input into the design process. The company chose Clarifai's AI platform because of their AI visual search and image recognition technology capabilities. This allowed their brand and design teams to mine their extensive behavioral database of over 10,000 package and shelf designs to determine their best route for success. With AI image recognition, they were able to replicate the consumer decision making process based on their behavioral framework. Clarifai’s consistent communication throughout the implementation resulted in a smooth deployment that was completed in two weeks. As a result, the company was able to develop and launch an innovative, digital-first tool that quickly impressed their key clients. If you are encountering a technical or payment issue, the customer support team will be happy to assist you."
