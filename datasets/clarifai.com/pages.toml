full_description = "We are continuing to wrap more generative models and LLMs from various vendors into our platform. We intend to provide you with more generative options so that you can choose the best one for the task at hand. We performed inferencing on the following open source LLMs: hkunlp_instructor-xl and tiiuae-falcon-7b-instruct. We exposed the trained models to novel data and got predictions (inferences), which allowed us to optimize their performance. If you now hover over a tool icon, you'll reveal a helpful tooltip, including an illustrative animation, a description, and a hotkey. The enhanced tooltips significantly improve the accessibility and usability of the Input-Viewer. You can now use the toggle button on an App Settings page to update its visibility to either private or public."
