 Our business or commercial purposes for collecting this Personal Data include: To provide the Services to customers and Service Users to perform our contract with you or where we don't have a contract with you, in reliance on our legitimate interests, for example: to operate and provide our Services and to tailor our Services to your needs and preferences, to provide you with the content, products or services you access and request, and to register, administer and maintain your account. To secure the Services in reliance on our legitimate interests, for example: to track use of our Services (including our websites) for the purposes of maintaining the safety and security of our Services, including verifying accounts and activity, and investigating suspicious activity, and to enforce our terms and policies, in reliance on our legitimate interest in promoting the safety and security of our Services, systems and applications and in protecting our rights and the rights of others. To improve and develop the Services in reliance on our legitimate interests, for example: to analyze trends to identify opportunities for the development and promotion of the Services and to improve our Services, to use data, often in a de-identified form, to develop new features, capabilities or products, improve the experience for Service Users, assess capability requirements and identify customer opportunities, to train and improve our machine learning models and algorithms, and to improve our internal operations and systems and for staff training purposes. For our marketing purposes, for example: to conduct marketing research to improve the effectiveness of our marketing campaigns, to send you marketing communications in accordance with your preferences, including product recommendations and other non-transactional communications (e.g. marketing newsletters, telemarketing calls, SMS, or push notifications), and to display advertising and relevant offers to you on our website and third-party