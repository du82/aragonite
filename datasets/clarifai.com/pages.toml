["https://www.clarifai.com/customers/mobile-phone-app-company"]
title = "AI Automated Metadata Creation | Classify Content Faster | Clarifai"
description = "See how a mobile phone app company used automated metadata generation and computer vision to compare and rank assets faster and more accurately. Learn how!"
full_description = "A global photo app company that allows photographers to upload their photos came to Clarifai looking for a way to keep up with the demand for accurately tagging and rating an ever increasing volume of visual assets that was now averaging 5,000 photo uploads a day. The company wanted to find a way to showcase their large volumes of user-uploaded images by rating each image on a scale of 1-10 and then promote their best assets on their website and through social media to boost sales. The company started out by using a team of five moderators to do this, but quickly found out that they couldn’t keep up with the workflow. They needed an automated solution that was highly-scalable, and quick-to-implement to categorize and rank the images that they received daily. Their outcome was to enhance user “findability” and make it convenient for customers to choose content based on image rankings. As a part of the process for tagging and ranking large asset volumes, they also needed a way to remove any ranking biases, such as removing the photo “popularity contest” element, e.g., neutralizing celebrity photos from getting the most “likes” even though their photos may not be great. Before choosing Clarifai, the CEO and Co-Founder tested computer vision point solutions from Imagga, Microsoft and Google. The company selected Clarifai based on its superior accuracy, customer support, easy-to-follow documentation, intuitive platform tools, and multi-language support.Clarifai’s deep learning AI and visual similarity search capabilities was used to first group similar photos by content and then directly compare a series of similar photos side-by-side to surface the best one by visual quality. The Clarifai pre-trained, out of the box celebrity model identified famous people in photos and was used to adjust the ranking algorithm in the company’s photo app. The Clarifai AI lifecycle platform was then used to automate the metadata generation process to accurately tag the large volume of images with the appropriate ranking."
