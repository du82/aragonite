["https://www.clarifai.com/blog/clarifai-10.10-compute-orchestration-private-preview"]
title = "Clarifai 10.10: Compute Orchestration [Private-Preview]"
description = "Introducing new Compute Orchestration, Pixtral 12B, Granite-3.0 models, enhanced data pre-processing pipelines, and more!"
full_description = "This blog post focuses on new features and improvements. For a comprehensive list, including bug fixes, please see the release notes. Clarifai’s new Compute Orchestration system provides you with an efficient way to deploy inference workloads on any compute, in any bare metal, or cloud environment. This feature is currently in Private Preview. To request access, please contact us or sign up here. In the recent release, we have introduced the new Clarifai Control Center, the unified dashboard, a single pane of glass to monitor everything happening within your account on the platform. It serves as the sole source of truth for various information dimensions, enabling you to make informed decisions based on data from multiple sources. We have now added a new tab to display users financial data. It displays the costs of your billed operations, making it easier to track and manage expenses on the platform. Read more about Control Center here. The Clarifai Data Utils library provides a variety of tools for handling multimedia data. With the Data Utils library and Python SDK, you can load text files (PDF, DOC, etc.), transform, chunk, and upload them directly to the Clarifai Platform. The new Data Ingestion Pipeline provides easy-to-use pipelines to load data from files and ingest it into the Clarifai platform. These new pipelines streamline data ingestion into the platform. Check out this example repository to learn how to use the pre-built foundational pipelines and to create custom pipelines for file partitioning, chunk cleaning, and metadata extraction. The OCR (Optical Character Recognition) Evaluation Module is a powerful tool designed to assess the performance of OCR workflows in Clarifai. It enables users to measure the accuracy and effectiveness of their OCR workflows by comparing model outputs against known ground truth data. Explore our Quickstart guide to learn more about Compute Orchestration. Register here to get started!"
author = "Sumanth P"
