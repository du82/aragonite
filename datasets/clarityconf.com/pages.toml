["https://clarityconf.com/speaking"]
title = "Speaking · Clarity"
description = "Learn about our speaker selection process and suggest a speaker for a future event."
full_description = "All speakers are personally invited by the event founder, Jina Anne. Speakers are selected based on what they find interesting for the design systems community during that time. There is not a CFP (Call for Proposals) process. There are also no sponsored presentations. However, you may suggest a speaker for a future event. Note that this does not guarantee a speaking engagement. It just puts people on our radar for consideration for future events. Before suggesting a speaker, please check out our Diversity, Equity, & Inclusion page to learn more about our selections. We love our speakers and do our best within our means to take care of them. Here are some of the things we offer to all of our speakers: We used to give special gifts (the first few years we gave reprints of iconic and vintage graphic standards manuals from the midcentury area, as well as an exclusive garment (scarves, socks, hats, shirts, etc). However, in favor of a more meaningful gift that won't go in the trash, we now offer a self-care reimbursement for spas, yoga, salons, therapy, etc. Treat yourself! For in-person events, a speaker reception the night before the conference with tasty food and beverages. This lets the speakers all get to know each other and get their badges and swag bags in advance. For online-only events, we try to keep things fun during an online event, though we know it's not quite the same as an in-person reception. All speakers can attend future Clarity events at a discounted price. We will mail out a discount code to everyone we are still in touch with, but if you missed the email and previously spoke, reach out to get your discount. If speakers need childcare, accessibility-related accommodations, or any other reasonable special requests, they can be provided."
