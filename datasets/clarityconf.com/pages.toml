["https://clarityconf.com/terms"]
title = "Terms of Service · Clarity"
description = "Our agreement with ticket holders for our events."
full_description = "Tickets can be transferred up to 30 days before the event. Contact hi@clarityconf.com with the name and email for both you and the person you are transferring your ticket to. We will send a confirmation to the new attendee. If there is a wait list activated, we would be happy to contact folks to help you find someone to buy the ticket from you. The original ticket purchaser is responsible for facilitating any exchange of funds from the new ticket holder. This year we will have 2 versions of the event: Clarity in person and Clarity online. In the event we need to cancel the in person edition of Clarity 2020 due to unforeseen circumstances and events out of our control, we will refund the difference between the in person ticket price and the virtual ticket price and you will receive the full access to the virtual event. We does not assume responsibility for any additional costs, charges, or expenses; to include, charges made for travel and lodging. In the event Clarity must be postponed due to unforeseen circumstances and events out of our control, conference registration will be credited for the future date of the event. In the event Clarity must cancel the entire conference or workshops due to unforeseen circumstances and events out of our control, we will fully refund your registration to the event or workshop you are registered for, without penalties or fees. We does not assume responsibility for any additional costs, charges, or expenses; to include, charges made for travel and lodging. Any international refunds will be made based on the current exchange rate at the time of refund, and not at the time of purchase. Clarity requires all speakers, attendees, volunteers, sponsors, and staff to follow our code of conduct. Failure to comply will result in being expelled from the event without refund. Speakers and schedule may change due to circumstances. We will try to alert attendees of changes as soon as humanly possible."
