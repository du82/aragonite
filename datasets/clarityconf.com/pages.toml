title = "2022 · Events · Clarity"
description = "The event page for Clarity 2022 New Orleans, Louisiana."
full_description = "Clarity is a design systems conference focused on how we work together. We provide tools and standards to scale across an increasing number of devices, platforms, and products. But real success comes when people align around a shared vision and language. Diverse perspectives for design, development, and product unite so more people can be a part of the conversation. At Clarity, we elevate our skills through multi-faceted inclusion, empathy, technology, creativity, and collaboration. We have partnered with Conffab to use their cool video platform to share videos, transcripts, notes, etc. If you buy a ticket, you are opting into us sharing your name and email with Conffab, the video platform we are using. This information will only be used one time, to send out the account sign-up information to access the Clarity videos. If you select a conference ticket, you will have access to Clarity videos in perpetuity. If you sign up for a premium upgrade, you will also have access to other design and development event videos on the platform during the duration of your membership. You must purchase a separate workshop ticket to attend. They are not included with conference or video-only passes. If you are a student or work at a nonprofit, send a message from your school or nonprofit email to receive a discount code. Please note, we do not sell single conference day passes. For scholarships, we have an application and deadline which we announce on the scholarship page. If the scholarship application window is closed, we are unable to accept new entries."
