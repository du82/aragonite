["https://clarityconf.com/session/communicating-animation"]
title = "Communicating Animation · Sessions · Clarity"
full_description = "Animation is key component of beautiful and useful product design. Salesforce, Google, and IBM all feature motion design in their design systems, and there’s every reason you should, too. When designers and developers agree upon constraints, they can create UI components faster and present a unified, polished look and feel users appreciate. Communicating animation is all about identifying patterns and setting boundaries and behavior expectations. This means: Whether your project is big or small, if it has a style guide, you will want to include motion design. In this talk, you will learn how to bring animation to heel."
year_published = 2025
