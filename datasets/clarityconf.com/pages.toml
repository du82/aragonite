["https://clarityconf.com/person/jina-anne"]
title = "Jina Anne · People · Clarity"
description = "Microsoft Principal Product Designer"
full_description = "Jina (they/she) is a design systems advocate. They founded Clarity, a design systems community conference, and they manage the Design Systems Slack. Jina co-chairs the Design Tokens Community Group. And on the Sass core team, they lead the brand and website design and development. Jina is also recognized as a Google Developers Expert (in Web Technologies [UI and Tooling]). Jina has been making websites as a hobby for about 30 years. They’ve worked professionally in the industry for 22 years (19 of those years working with design systems). Earlier in their career, Jina led the CSS architecture and style guide for the Apple Online Store remodel in 2007, which included launching the first iPhone. As a frontend UX engineer, they led the online store’s CSS architecture and documentation towards web standards globally across all store instances for locales, education and business-to-business, and more. They also supported the marketing and communication teams to build out components for time-sensitive product launches. Then, as a visual interaction designer, Jina worked on overall UI chrome for the store, sign in/account creation flows, shopping cart and check out flows, as well as product configurations for purchasing Macs, iPhones, iPods, and more. At Salesforce, Jina was the founding designer on the Salesforce Lightning Design System and helped create design tokens (which has become an industry standard methodology for scaling design decisions across multiple platforms and products). They also led the Salesforce UX community and evangelism efforts, by acting as Editor-in-Chief for the Salesforce UX blog, managing the social media channels, hosting and organizing sponsorships for meet-ups and conferences, and coordinating speakers. Afterwards, Jina led design systems and operations for Amazon’s no-code app builder, Honeycode. They supported the team with visual systems direction, accessibility, frontend development best practices, managing and rolling out design tool access, setting up workshops, and more."
