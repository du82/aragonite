["https://clarityconf.com/about"]
title = "About · Clarity"
description = "Learn more about the event"
full_description = "Jina Anne, a design systems advocate, founded Clarity in 2014 and hosted the first Clarity in 2016 in San Francisco. Over the years, the event has been held in San Francisco, New York, New Orleans, and online. Clarity is a design systems conference focused on how we work together. We provide tools and standards to scale across an increasing number of devices, platforms, and products. But real success comes when people align around a shared vision and language. Diverse perspectives for design, development, and product unite so more people can be a part of the conversation. At Clarity, we elevate our skills through multi-faceted inclusion, empathy, technology, creativity, and collaboration. People who attend have been design systems practitioners (designers, developers, product managers, leadership, etc) from around the world at companies including start ups, enterprise corporations, non-profits, government agencies, design studios, and more."
