["https://clarityconf.com/session/building-empowering-style-guides-with-practical-research"]
title = "Building Empowering Style Guides with Practical Research · Sessions · Clarity"
full_description = "As builders and makers in tech, we strive to create useful, empowering products for our users. A style guide is no different. Done well, it’s a product that all of its users — e.g. developers, designers, customers, partners, and more — find useful and empowering to use. Where should a team start? It begins with understanding your users and the different things they need from style guides. Whether your team is small or large, we’ll share practical research methods for gathering and translating these different needs into building useful and empowering style guides."
