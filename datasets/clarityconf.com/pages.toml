["https://clarityconf.com/code-of-conduct"]
title = "Code of Conduct · Clarity"
description = "Our policy applies to all events, both online and in-person."
full_description = "By attending Clarity, you agree to abide by this code of conduct to attend any place (conference, workshop, party, hotels, Slack, social media, etc.) that is associated with Clarity online or in person. ‘Everyone’ includes but is not limited to: attendees, speakers, sponsors/Partner, volunteers, sketchnote artists, videographers, photographers, venue staff, Clarity staff, etc. This code of conduct will be strictly enforced. Everyone is expected to cooperate so we can have a safe and inclusive event. If you have any questions or need to report a violation or concern, you can contact us using the contact form, approach anyone designated as ‘Staff’ at the event either in person or via direct message in the Design Systems Slack. You can also message Jina Anne privately in the Design Systems Slack. When reporting an incident, please be as specific as possible with your contact info so we can reach you. It also helps to be detailed with as much information as possible, if you have it: names, witnesses, what happened, and any other context that can help. If you need an escort or any other accommodations to feel safe or comfortable, please let any staff member know so we can provide assistance. When we receive a report, we will review what happened and document the resolution. Depending on the severity of the offense, anyone violating these rules will receive either a warning, expulsion from the event without a refund, a ban from attending future events, or legal action (with the consent of the victim). If you receive a warning to stop harassing behavior, you are expected to comply immediately."
