["https://clarityconf.com/inclusion"]
title = "Inclusion · Clarity"
description = "Our stance on making our event inclusive and diverse since the beginning."
full_description = "We try our best to make sure Clarity is accessible to as many people as possible. We want as many people to have the full Clarity experience as possible. If there are additional ways we can provide a more inclusive event, please share! And as always, let us know what you need to have a full experience and we’ll do everything in our power to provide it. Students or people who work at non-profits can request a discount by contacting from their organization’s or school’s email. There can be other factors in requesting a refund; these are given out on a case-by-case basis if the reason makes sense. As of 2018, we began having gender-neutral bathrooms. We will try our best to make this happen going forward, wherever possible, depending on the event and venue location. A ton of folks reach out about speaking at Clarity. However, I noticed a trend. About 90% of the people who reach out are cisgender straight white men. If I only relied on these requests, this would not make for a very diverse or inclusive event. Also, many people who reach out want to talk about why and how they built a design system at their company. I think it’s safe to say that most people attending this event (especially those who have attended previously) are looking for something more than a show and tell. I made the decision at the very beginning that I will personally curate a diverse range of perspectives — not just for race and gender — but also in subject matter expertise, experience levels (I love inviting people who are brand new to speaking), healthy differences in opinions, and many other factors. My ideal line up mixes all the things I love about design systems. I want to create an experience that covers a wide range of topics like accessibility, branding, design best practices and operations, engineering, and more — all within the context of design systems, of course. So it’s very likely I will select someone you’ve never heard of, or who works on a design system that isn’t publicly shared, but they bring a really unique perspective to the event. That is what excites me about curation."
year_published = 2025
clearnet = "https://clarityconf.com/inclusion"
