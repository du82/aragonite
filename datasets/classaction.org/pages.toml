title = "Mattel Facing Class Action Lawsuit Over Porn Site Misprint on Recalled ‘Wicked’ Doll Packaging"
description = "Mattel has been hit with a proposed class action lawsuit after its “Wicked” movie-themed dolls were pulled from shelves on November 11 because their packaging displayed the URL of a pornographic website."
full_description = "in Newly Filed / Newly Settled Published on December 3, 2024 Mattel Facing Class Action Lawsuit Over Porn Site Misprint on Recalled ‘Wicked’ Doll Packaging by Kelly Mehorter Last Updated on December 5, 2024 Share View Comments Mattel has been hit with a proposed class action lawsuit after its “Wicked” movie-themed dolls were pulled from shelves on November 11 because their packaging displayed the URL of a pornographic website. Don’t miss the next class action settlement deadline. Sign up for ClassAction.org’s free weekly newsletter here. The 22-page Mattel lawsuit says the packaging for the recalled 11-inch fashion dolls—which depict Cynthia Erivo’s Elphaba, Ariana Grande’s Glinda and Jonathan Bailey’s Fiyero from the newly released movie adaptation of “Wicked”—directed consumers to Wicked.com, the website for porn film studio Wicked Pictures. The case was filed on December 3 by a South Carolina resident who says she bought a Wicked doll for her minor daughter. The plaintiff claims her daughter visited the website address printed on the back of the toy box and was “horrified” to see advertisements with “hardcore, full on nude pornographic images depicting actual intercourse.” According to a statement from Mattel, the toy giant intended for product packaging to feature the official URL for Universal Picture film, WickedMovie.com. The company said it “deeply” regrets the “unfortunate error” and has since removed the items from Target, Walmart, Amazon, Best Buy, Barnes & Noble and Macy’s, CNBC reports. The class action lawsuit calls Mattel’s misprint “demonstrably avoidable,” claiming that the defendant was negligent in its labeling. “[The plaintiff] and consumers did not know, and did not have a reason to know, that the products purchased would contain access to such an inappropriate web link given that product was advertised for ages 4 years and above,” the case contends. “Parents and consumers expect the products they purchase to coincide with the age appropriateness labeled on them.” The class action suit looks to help customers recoup some of the money they spent on the Wicked dolls, which reportedly retailed for between $20 and $40. Per the case, Mattel’s recall does not offer refunds to consumers. “[The plaintiff] seeks to recover damages because the products are adulterated, worthless, and unfit for its intended and advertised age-appropriate audience,” the suit says, alleging that consumers would not have bought the dolls had they been aware of the defendant’s “improper oversight.” No one mourns the Wicked dolls, it seems. Except for maybe eBay sellers, who have apparently listed dolls with misprinted labels for as much as $800. Who does the Wicked doll lawsuit cover? The Wicked doll lawsuit looks to represent anyone in the United States who purchased Mattel’s Wicked doll with the pornographic website printed on the product packaging. How do I join the Wicked doll lawsuit? There’s usually nothing you need to do to join a class action lawsuit when the case is first filed. It’s usually only in the event of a class action settlement that those affected by the lawsuit—i.e., class members—need to take action. This typically involves filling out and filing a claim form online or by mail. ClassAction.org will update this page with any developments on the Wicked doll lawsuit. Are you owed unclaimed settlement money? Check out our class action rebates page full of open class action settlements. This browser does not support PDFs. Please download the PDF to view it: Download PDF. Open Document Case Spotlight Video Game Addiction Lawsuits If your child suffers from video game addiction — including Fortnite addiction or Roblox addiction — you may be able to take legal action. Gamers 18 to 22 may also qualify. Learn more:Video Game Addiction Lawsuit Depo-Provera Lawsuits Anyone who received Depo-Provera or Depo-Provera SubQ injections and has been diagnosed with meningioma, a type of brain tumor, may be able to take legal action. Read more: Depo-Provera Lawsuit How Do I Join a Class Action Lawsuit? Did you know there's usually nothing you need to do to join, sign up for, or add your name to new class action lawsuits when they're initially filed? Read more here: How Do I Join a Class Action Lawsuit? Stay Current Sign Up For Our Newsletter New cases and investigations, settlement deadlines, and news straight to your inbox. Subscribe Retail Entertainment Share Last Updated on December 5, 2024 — 9:42 AM Kelly Mehorter kelly@classaction.org Kelly works primarily on ClassAction.org’s newswire, reporting on cases as they happen. About ClassAction.org ClassAction.org is a group of online professionals (designers, developers and writers) with years of experience in the legal industry. Learn More Before commenting, please review our comment policy. Load Comments Please enable JavaScript to view the comments."
