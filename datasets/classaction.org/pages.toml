full_description = "Writing Kelsey McCroskey kelsey@classaction.org Bio Kelsey is a junior content writer for ClassAction.org. Originally from Nashville, Tennessee, she has recently adopted New Jersey as her new home. Before working for ClassAction.org, she taught high school English literature and journalism in St. Louis. She now enjoys the peace and quiet of writing her own pieces instead of editing thousands of awful student papers that made her eyes bleed. Kelsey has a Master’s in education and studied English and history in college. Outside of work, Kelsey likes to explore her new town, dabble in art, and worry if she’ll survive the East Coast winters. Recent Posts January 8, 2025 DraftKings Lawsuit Alleges Sportsbook’s ‘Risk-Free’ Betting, Cash Bonus Promotions Are Bogus by Kelsey McCroskey on Newly Filed / Newly Settled DraftKings has been hit with a proposed class action lawsuit that accuses the sports betting platform of luring consumers with deliberately misleading promotions and false promises of “risk-free” first bets, leading many gamblers to develop addictions. Read More Share October 30, 2024 McDonald’s Lawsuit Filed Over October 2024 Quarter Pounder E. Coli Outbreak by Kelsey McCroskey on Newly Filed / Newly Settled McDonald’s has been hit with a proposed class action lawsuit that claims the fast-food giant marketed and sold Quarter Pounders without warning consumers that the burgers may be contaminated with E. coli. Read More Share August 26, 2024 Delta Class Action Claims Airline ‘Outright Refused’ to Refund Passengers After July Software Outage by Kelsey McCroskey on Newly Filed / Newly Settled Delta Air Lines faces a proposed class action lawsuit over its alleged refusal to fully refund consumers after thousands of flights were canceled or significantly impacted as a result of last month’s technology outage. Read More Share July 23, 2024 Cocoa Puffs Lawsuit Claims Breakfast Cereal Contains ‘Dangerous’ Levels of Lead by Kelsey McCroskey on Newly Filed / Newly Settled A proposed class action out of California claims General Mills Sales, Inc. has failed to warn consumers that Cocoa Puffs breakfast cereal contains a “dangerous” amount of lead. Read More Share June 25, 2024 Rachael Ray Nutrish Pet Foods Not as ‘Natural’ as Advertised, Class Action Lawsuit Says by Kelsey McCroskey on Newly Filed / Newly Settled A new proposed class action lawsuit claims Rachael Ray Nutrish pet foods are deceptively advertised and marketed as “natural” given that many of the products contain a litany of synthetic substances. Read More Share"
