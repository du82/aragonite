["https://classaction.org/about-us/erin-gilmore"]
title = "Erin Shaak | ClassAction.org"
full_description = "Writing Erin Shaak erin@classaction.org Bio Erin had been working in a large corporation for several years, quite content to ignore and be ignored by the world of corporate politics. She found, however, that she could no longer ignore her growing frustration with the vast distance between her work and the consumers she desired to help. She had, after all, acquired a degree in English from Rutgers University and longed to apply her education in a way that could change the lives of people around her. Now, as a writer for ClassAction.org, she is blessed to spend her days interpreting the mysterious secrets of legal writings and empowering her fellow humans with the knowledge they need to fight for their rights. Erin must seem of little importance, being neither renowned as a great warrior, nor counted amongst the very wise. In fact, it has been remarked by some that her only real passion is for writing poetry – a rather unfair observation, as she has also developed a keen interest in hiking unexplored wilderness and fighting for justice in the world around her. But where her heart truly lies is in peace and quiet, and good tilled earth. Today of all days, it is no bad thing to celebrate a simple life. Recent Posts January 24, 2025 CFPB Zelle Lawsuit: Payment Platform Sued Over ‘Widespread Fraud’ by Erin Shaak on Newly Filed / Newly Settled The Consumer Financial Protection Bureau has hit the operator of Zelle and three of its owner banks with a lawsuit claiming they let down customers and violated federal law by allowing fraud to run rampant on the popular payment platform. Read More Share September 13, 2024 Navient Lawsuit Update: Borrowers to Receive Payout in $120M CFPB Settlement by Erin Shaak on Newly Filed / Newly Settled The years-long Navient saga may be coming to a close with a proposed order filed by the Consumer Financial Protection Bureau (CFPB) on September 12 that would ban the notorious student loan servicer from servicing federal loans. Read More Share October 10, 2023 Class Action Filed in Wake of ‘Inadequate’ Shimano Hollowtech Crankset Recall by Erin Shaak on Newly Filed / Newly Settled A proposed class action filed last week contends that a September recall of roughly 680,000 “Hollowtech” 11-speed cranksets made by Japanese bicycle part manufacturer Shimano was “inadequate” and has put cyclists nationwide at risk of injury. Read More Share August 3, 2023 Class Action Claims Tesla Falsely Advertised Electric Vehicles’ Range ‘At Every Turn’ by Erin Shaak on Newly Filed / Newly Settled Tesla, Inc. was hit with a proposed class action lawsuit on Wednesday over allegations that the automaker has “grossly overestimated” the range of its electric vehicles. Read More Share July 27, 2023 Google Hit with Class Action Following Bombshell Report Alleging Widespread Ad Fraud by Erin Shaak on Newly Filed / Newly Settled Google, LLC has been hit with a proposed class action lawsuit this week alleging the tech behemoth has essentially bilked advertisers out of billions of dollars by misrepresenting the quality and placement of their video ads. Read More Share"
