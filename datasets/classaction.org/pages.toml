title = "Nuna Baby Recall Lawsuit Filed Over ‘Dangerously Defective’ RAVA Car Seats"
description = "Nuna Baby Essentials faces a proposed class action lawsuit after it recalled more than 600,000 Nuna RAVA convertible car seats in December 2024 due to a harness system defect that can put children at risk in the event of a crash."
full_description = "in Newly Filed / Newly Settled Published on February 7, 2025 Nuna Baby Recall Lawsuit Filed Over ‘Dangerously Defective’ RAVA Car Seats by Kelly Mehorter Last Updated on February 10, 2025 Share View Comments Nuna Baby Essentials faces a proposed class action lawsuit after it recalled more than 600,000 Nuna RAVA convertible car seats in December 2024 due to a harness system defect that can put children at risk in the event of a crash. Want to stay in the loop on class actions that matter to you? Sign up for ClassAction.org’s free weekly newsletter here. The 56-page lawsuit claims that Nuna Baby Essentials’ voluntary recall is “wholly inadequate” as it fails to provide consumers with repairs, replacements or reimbursement for the “dangerously defective” car seats. According to the case, the recalled RAVA car seats have harnesses that can fail to securely tighten (or remain tight) and restrain the occupant. Nuna said in its recall notice that the issue arises when debris—such as dirt, crumbs or sand—gets lodged in the car seat’s front harness adjuster button and prevents the locking mechanism from working properly. The lawsuit argues that Nuna, as a reputable and experienced manufacturer of purportedly high-end car seats, should have anticipated the need for its products to be durable enough to withstand the typical messes that come with car seat use by young children. “The Products fail their core mission under this common set of circumstances, as when light debris falls into the area around the adjuster strap, the Defect manifests and the harness cannot clamp securely onto the adjuster strap,” the complaint says. “And in the event of a crash, the infant or child would not be securely fastened in the seat, significantly increasing the risk of injury.” Rather than recall the entire car seat, Nuna merely instructed consumers to request a free “remedy kit” so owners can attempt to fix the defect themselves, the filing asserts. “Nuna uses this Recall as a way to shirk its responsibilities of actually remediating the Defect, potentially as a cost-saving measure, while claiming that the Car Seats—which contained a Defect so serious it required a safety recall—can be made safe by mere cleaning and slight modification,” the suit alleges. Which Nuna car seats are included in the recall? The Nuna RAVA car seat recall includes the following models manufactured between July 16, 2016 and October 25, 2023: CS-50-001 Caviar; CS-50-002 Indigo; CS-50-003 Berry; CS-50-004 Blackberry; CS-50-005 Slate; CS05101CHC Charcoal; CS05103CVR Caviar; CS05103FRT Frost; CS05103GRN Granite; CS05103LAK Lake; CS05103OXF Oxford; CS05103ROS ROSE; CS05115DDC Droplet Dot Collection; CS05105BAC Broken Arrow Caviar; CS05106BRS Brushstroke; CS05107RFD Refined; CS05109RVT Riveted; CS05110LGN Lagoon; CS05110EDG Edgehill; CS05111OCN Ocean; CS05114CRD Curated; CS05104THR Threaded; and CS05101HCV Verona. Model numbers can be found on the label on the underside of the car seat, Nuna’s online recall notice says. Per the filing, the affected products come equipped with uncovered, plastic harness adjuster buttons that are prone to collecting debris. The recall does not cover car seats manufactured after October 25, 2023, which were redesigned to include a fabric cover over the front harness adjuster, the case notes. Inadequate recall process? The class action suit alleges that Nuna’s recall is poorly designed, ineffective, and inadequate in offering covered individuals a meaningful remedy. For one, Nuna’s only solution to the defect requires parents and caregivers to slightly modify parts of the car seat themselves, the case says. According to Nuna’s website, consumers must request to receive a new seat pad, cleaning kit and care instructions. “By failing to recall the entire Product, the Recall Notice allows and encourages consumers to continue to use a product with the risk of severe injury,” the suit contends. “Indeed, the Recall puts the burden of remediation on consumers—as laypersons with no knowledge of the design of car seats—to alter the Product in a manner to make it safe, if that is even possible.” Further, Nuna admitted in its National Highway Traffic Safety Administration notice that it was still developing the remedy kits, and that they were not yet available to consumers, the filing relays. This is especially burdensome to consumers, the lawsuit claims, given that the company has instructed owners to immediately stop using the product when the defect becomes apparent. “Thus, consumers are forced to—based on Nuna’s own warning—obtain another car seat that will (unlike Nuna) provide safe restraint for their children in the vehicle, thereby incurring further monetary damages for which Nuna is responsible,” the case asserts. Nuna states on its website that a car seat is safe to continue to use if it passes the harness function test, the filing notes. “Finally, and perhaps worst,” the lawsuit claims, Nuna requires consumers to provide proof that the harness on their car seat unintentionally loosens due to the defect, reserving the right to determine whether it will offer further repair or replacement of the car seat. The case contends that “many (if not most)” RAVA car seat owners have not yet received official notice of the recall and that it is unclear whether Nuna can even ensure all purchasers get a notice. The plaintiffs, five California residents who say they would not have bought their Nuna RAVA car seats had they been aware of the product’s inherent dangers, seek compensation from the defendant and demand that an accurate recall notice be widely distributed to consumers. Who does the Nuna RAVA car seat lawsuit look to cover? The Nuna RAVA car seat lawsuit seeks to cover anyone who purchased any of the products listed on this page in California for personal use and not resale. How do I join the lawsuit? If you bought one of the RAVA car seats listed above, there’s nothing you need to do right now to join or sign up for the class action lawsuit. It’s usually only in the event of a class action lawsuit settlement that the people covered by the case, known as class members, need to act. More often than not, this involves filling out and filing a claim form online or by mail for settlement benefits. For now, you can stay in the loop about class action and settlement news by signing up for ClassAction.org’s free weekly newsletter. Are you owed unclaimed settlement money? Check out our class action rebates page full of open class action settlements. This browser does not support PDFs. Please download the PDF to view it: Download PDF. Open Document Case Spotlight Video Game Addiction Lawsuits If your child suffers from video game addiction — including Fortnite addiction or Roblox addiction — you may be able to take legal action. Gamers 18 to 22 may also qualify. Learn more:Video Game Addiction Lawsuit Depo-Provera Lawsuits Anyone who received Depo-Provera or Depo-Provera SubQ injections and has been diagnosed with meningioma, a type of brain tumor, may be able to take legal action. Read more: Depo-Provera Lawsuit How Do I Join a Class Action Lawsuit? Did you know there's usually nothing you need to do to join, sign up for, or add your name to new class action lawsuits when they're initially filed? Read more here: How Do I Join a Class Action Lawsuit? Stay Current Sign Up For Our Newsletter New cases and investigations, settlement deadlines, and news straight to your inbox. Subscribe Defective Products Parenting False Advertising Fraud Share Last Updated on February 10, 2025 — 3:24 PM Kelly Mehorter kelly@classaction.org Kelly works primarily on ClassAction.org’s newswire, reporting on cases as they happen. About ClassAction.org ClassAction.org is a group of online professionals (designers, developers and writers) with years of experience in the legal industry. Learn More Before commenting, please review our comment policy. Load Comments Please enable JavaScript to view 