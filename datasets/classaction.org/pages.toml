full_description = "Editorial – News Corrado Rizzi corrado@classaction.org Bio Corrado is the Senior Managing Editor of ClassAction.org. Prior to working at ClassAction.org, Corrado managed sponsored advertorial content for a Conde Naste-owned online advertising corporation that services many news affiliates scattered across the country. Prior to that role, after earning his bachelor's degree in Journalism and Public Relations from The William Paterson University of New Jersey in 2010, Corrado spent years working in all areas of marketing for a prominent national law firm that specialized in personal injury and consumer protection litigation. When not at his desk, Corrado focuses his energy on playing drums in a few bands in the New Jersey/New York City area. Outside of music, Corrado enjoys boring lunches, fantasy baseball, A Song of Ice and Fire, barbecue, running and spending time with his wife and daughter. Recent Posts November 5, 2024 Apple AirPods Lawsuit Filed Over Pro Gen 1 Headphones Plagued by Sound Issues by Corrado Rizzi on Newly Filed / Newly Settled A proposed class action lawsuit alleges Apple has falsely advertised the supposedly superior-sounding AirPods Pro Gen 1, which suffer from known audio defects that can cause the headphones to exhibit crackling or static sounds. Read More Share October 22, 2024 Do They Really Work? NuFACE Lawsuit Says Red-Light Therapy Devices Do Not Provide the Advertised Skincare Benefits by Corrado Rizzi on Newly Filed / Newly Settled A proposed class action lawsuit alleges the NuFACE Trinity+ and Trinity Classic facial toning devices and wrinkle reducer attachments do not work as advertised. Read More Share September 30, 2024 Hisense 4K Android TV Problems Spark Class Action Lawsuit by Corrado Rizzi on Product Liability A class action lawsuit alleges Hisense 4K Android smart TVs sold since 2019 are equipped with a defective main board. Read More Share September 16, 2024 23andMe Data Breach Settlement: $30M Deal Covers Millions Whose Info Was Stolen by Corrado Rizzi on Newly Filed / Newly Settled 23andMe has agreed to pay a “carefully tailored” $30 million settlement to resolve more than 40 class action lawsuits filed in the wake of a massive data breach last year. Read More Share September 4, 2024 PFAS Lawsuit Says Rugs, Carpets Nationwide Loaded with Toxic Forever Chemicals Made by 3M, Chemours Company by Corrado Rizzi on Newly Filed / Newly Settled A new proposed class action lawsuit aims to hold 3M and other chemical makers responsible for their manufacture and sale of highly toxic per- and polyfluoroalkyl substances—PFAS—that were used in rugs, carpets and other in-home textiles for decades. Read More Share"
