title = "Advanced Bionics Cochlear Implant Failure Lawsuits"
description = "If you or your child experienced failure of a HiRes Ultra or Ultra 3D cochlear implant, you may be able to file a lawsuit for medical bills, mental suffering and lost wages. Find out more."
full_description = '''Advanced Bionics Lawsuits for Cochlear Implant Failures Last Updated on September 20, 2024 Contact Us Comments | Share At A Glance This Alert Affects: Anyone who experienced failure of Advanced Bionics’ HiRes Ultra or Ultra 3D cochlear implant, including those who’ve had the device replaced. What’s Going On? Attorneys working with ClassAction.org are investigating whether lawsuits can be filed against Advanced Bionics over its HiRes Ultra and Ultra 3D cochlear implants in light of a 2020 recall and a growing number of reported failures. What You Can Do If you or your child experienced cochlear implant failure, fill out the form on this page today. You may be able to file a lawsuit against Advanced Bionics for medical bills and more. Does This Cost Anything? It costs nothing to contact us or to speak with an attorney, and you’re not obligated to take legal action after talking to someone. Plus, attorneys working with ClassAction.org are handling these cases on a contingency-fee basis, meaning you only pay if they win. Attorneys working with ClassAction.org are investigating whether lawsuits can be filed against Advanced Bionics over its HiRes Ultra and Ultra 3D cochlear implants. Reports have surfaced that certain versions of the devices may be failing at alarming rates, requiring revision surgery to remove and replace the implant. Now, attorneys are looking into whether a defect is to blame and, if so, whether patients can file lawsuits against the manufacturer for medical bills, psychological injuries and more. If you or your child experienced failure with a cochlear implant, fill out the form on this page today to speak with someone about filing a lawsuit. After you get in touch, an attorney or legal representative may reach out to you directly to ask you a few questions and address any concerns you may have. Advanced Bionics 2020 Cochlear Implant Recall: What Happened? In early 2020, Advanced Bionics announced that it would be initiating a field corrective action for its HiRes Ultra and Ultra 3D cochlear implants due to an increasing number of reports of hearing degradation and revision surgeries. Specifically, the company stated that some patients had experienced performance issues stemming from body fluid entering the electrode, which could hamper the functionality of the device. As part of the recall, Advanced Bionics pulled all unimplanted initial versions of the HiRes Ultra and Ultra 3D from the market and warned that those experiencing problems with the devices could require revision surgery to remove the old implant and replace it with an updated version. While the company maintained at the time that less than 0.5% of recipients needed the implant removed, one study performed by world-renowned Swiss otolaryngologist Thomas Lenarz found a shocking failure rate with the devices. Of the 349 patients who had been implanted with the HiRes Ultra and Ultra 3D cochlear implants at his institution in Germany, more than 50% had experienced problems as described by Advanced Bionics’ recall. Around 35% of these patients had already had their devices removed, with the study finding that the median time between implantation and the development of potential failure-related performance issues was less than three years. Cochlear Implant Failure: What Are the Symptoms? According to a letter reportedly sent to Advanced Bionics patients, the following symptoms may indicate a problem with the HiRes Ultra and Ultra 3D cochlear implants: Quality of hearing getting worse over time Reduced ability to hear high-pitched noises, such as “F” or “S” sounds Inconsistent responses to high-pitched noises in young children and non-verbal patients The letter stated that patients experiencing these symptoms should see their audiologist for a hearing assessment and reprogramming of the device, noting that those who cannot have the issue resolved may require revision surgery. It’s believed that adult patients who suffer gradual hearing loss may get used to an inferior level of performance and wrongly assume that their hearing isn’t going to get any better, accepting impaired function as the new normal. Other individuals may make frequent visits to the audiologist for testing and reprogramming of the implant only to later find that it has failed and will need to be replaced. Attorneys suspect that, in children, problems with the device may be especially difficult to detect as the brain is still developing and inferior performance could become normalized. Should the implant fail in a pediatric patient, immediate revision surgery may be necessary to reduce any damage to the language development process. What’s Involved in Filing a Lawsuit? Before filing a lawsuit, your attorney will need to gather information from you, along with relevant medical records, to help build your case. They may ask when and how you discovered a problem with the implant, the steps needed to determine the device had failed, details regarding the revision surgery, and how failure of the implant affected the recipient’s life. Once the appropriate information has been gathered, your attorney will draft what’s known as a complaint, a document outlining the damages you are seeking and the allegations you are making against the defendant – that is, the company being sued. For instance, your lawsuit could allege that Advanced Bionics allowed a defective product into the marketplace, knew or should have known about the risks associated with its implants, delayed in warning both patients and doctors, and is now responsible for the harm caused to you or your child. Once your complaint is filed with the court, your lawsuit has officially begun. From there, your attorney will engage with the defendant’s representation, as well as the court, in an attempt to resolve the matter. The attorneys may exchange documents, file motions with the court, take depositions, consult with medical experts and more. If the lawsuit is not dismissed or settled, it may proceed to a jury trial, though those are becoming increasingly rare in civil cases. Even if you are unsure which implant was used, if you or your child experienced failure with a cochlear implant, an attorney can help confirm the medical device used in the procedure. What Could I Get From a Lawsuit? With a lawsuit, you could potentially recover money from Advanced Bionics for: Medical bills, including those related to revision surgery, audiologist appointments, specialist visits and more Lost wages Emotional suffering and psychological injuries Is This a Class Action? No. Attorneys working with ClassAction.org have decided to handle this matter on an individual basis – and not as a class action lawsuit. This is because they believe Advanced Bionics patients have suffered injuries serious enough to warrant individual cases, whereas class action lawsuits typically seek relief for less severe harm. Click here for more information on why cases involving medical devices are not typically handled as class action lawsuits. Has Advanced Bionics Been Sued Before for its Cochlear Implants? Advanced Bionics has recently been the center of a lawsuit brought on behalf of the U.S. government by a whistleblower who alleged the company misled Medicare, Medicaid and other government health programs about the radio-frequency emissions of some of its cochlear implant processors. Specifically, the case claimed Advanced Bionics represented to the FDA that its cochlear implants met an internationally recognized emissions standard when they didn’t and then sought reimbursement from the government for these devices. In December 2022, the Department of Justice (DOJ) announced that it had reached a more than $12 million settlement with Advanced Bionics to put an end to the case. The company has also reportedly faced personal injury lawsuits over its HiRes 90K cochlear implant – a device that was also recalled due to a moisture problem and reportedly caused some patients to suffer “painful shocks to the head.” In one case, a Kentucky jury reportedly handed down a more than $7 million award for an eight-year-old girl who allegedly developed “severe electric shocks” in her head from the device. How Much Will a Lawyer Cost? Attorneys working with ClassAction.org are handling these cases on a contingency-fee basis – which means you only pay if they win. Their payment will come as part of your jury award or settlement. If you or your child experienced failure of a HiRes Ultra or Ultra 3D cochlear implant and you’re interested in filing a lawsuit, fill out the form on this page today. After you get in touch, an attorney or legal representative may reach out to you directly. It doesn’t cost anything to get in touch or to speak to someone about your rights.Before commenting, please review our comment policy. Load Comments Please enable JavaScript to view the comments. ClassAction.org Get in Touch First Name Last Name Email Phone Number Zip Code Case Details By submitting this form, you agree to our Terms, Disclaimer and Privacy Notice and you are providing express consent to receive communications via calls, emails, and/or text messages <div class="measure-narrow pa3 tl"> <p class="f4 mt0 lh-title">What Happens When I Fill Out This Form?</p> <strong class="lh-copy">Your inquiry will be forwarded to one of the attorneys we work with.</strong> <p class="lh-copy">Someone at the firm may then reach out to you. If a law firm contacts you, they may need more information. You should receive an e-mail within 24-48 hours with an update on your inquiry. You're not going to be charged anything, and you have no legal obligation after you've filled out this form.</p> </div> What happens when I fill out this form? Submit Featured In: About Us ClassAction.org is a group of online professionals (designers, programmers and writers) with years of experience in the legal industry. We work closely with class action and mass tort attorneys across the country and help with investigations into corporate wrongdoing. More → Stay Current Sign Up For Our Newsletter New cases and investigations, settlement deadlines, and news straight to your inbox. Subscribe'''
