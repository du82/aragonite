title = "Creatine Gummies Lawsuit | Third-Party Lab Tests Reveal Fraud?"
description = "Did you buy creatine gummies from Beast Bites, Njord or Create? Attorneys believe the supplements may contain less creatine than stated on their product labels. Find out how a lawsuit could help."
full_description = '''Lawsuit Investigation: Is There Less Creatine in Your Gummies Than Advertised? Last Updated on September 25, 2024 Contact Us Comments | Share At A Glance This Alert Affects: Anyone in California, Illinois or New York who bought Beast Bites Creatine Infused Gummies, Astro Labs Creatine Gummies, Njord Creatine Monohydrate Gummies or Create Creatine Monohydrate Gummies within the past three years. What’s Going On? Third-party lab test results published earlier this year have revealed that the gummies mentioned above may contain significantly less creatine than indicated on their product labels—or even none at all. Attorneys working with ClassAction.org are now looking into whether class action lawsuits can be filed against the gummy manufacturers. How Could a Lawsuit Help? If filed and successful, a class action lawsuit could help people get back some of the money they spent on the creatine gummies. It could also force the companies to remove any misleading statements from their product packaging. What You Can Do If you’re a California, Illinois or New York resident who has bought Beast Bites Creatine Infused Gummies, Astro Labs Creatine Gummies, Njord Creatine Monohydrate Gummies or Create Creatine Monohydrate Gummies within the past three years, fill out the form on this page to help the investigation. Attorneys working with ClassAction.org are investigating whether customers may have been misled about how much creatine is in the following gummy products: Beast Bites Creatine Infused Gummies; Njord Creatine Monohydrate Gummies;Astro Labs Creatine Gummies; and Create Creatine Monohydrate Gummies. In March 2024, supplement company Now Foods released lab results showing that the creatine content in several popular gummy brands, including those listed above, may fall short of the amounts advertised on their labels. The attorneys believe that some consumers would not have purchased the gummies at issue (or would not have been willing to pay as much) had they known the items may not provide as much creatine as represented. Now, they’re looking into whether class action lawsuits can be filed on behalf of buyers. Have you bought any of the creatine gummies listed on this page within the past three years? Fill out the form on this page if you’re also in California, Illinois or New York. You may be able to help get a class action lawsuit started. What Do the Creatine Test Results Say? Creatine is a naturally occurring compound found in animal products such as red meat and seafood. It is also synthesized by the human body to help supply energy to muscles. As a dietary supplement, creatine is popular because it can increase muscle mass and enhance athletic performance, especially during high-intensity, short-duration activities like weightlifting. Although the labels on Beast Bites and Njord Creatine Gummies claim to provide “5G of creatine per serving,” Now Foods testing found that the supplements contain 0.0087 grams and zero grams of creatine per gummy, respectively. Similarly, packaging for Create Creatine Gummies states the supplement contains “1.5G creatine monohydrate per gummy,” but test results showed that each gummy had roughly 1.27 grams of creatine. The report also found no creatine per gummy for the Astro Labs product. Now Foods also tested the gummies for creatinine, a waste product of creatine. Varying levels of creatinine were detected in all four gummies under investigation, suggesting that the creatine originally added to the products degraded during the manufacturing process. How Could a Lawsuit Help? Class action lawsuits could help consumers get back some of the money they spent on gummies that may have been improperly labeled and potentially force the manufacturers to change their products’ labels. Have you bought creatine gummies from Beast Bites, Astro Labs, Njord Supplements or Create Wellness within the past three years? If you’re also in California, Illinois or New York, fill out the form on this page. After you get in touch, an attorney or legal representative may reach out to you directly to ask you some questions and tell you more about how you may be able to help file a class action lawsuit. It costs nothing to fill out the form or speak with someone, and you’re not obligated to take legal action if you don’t want to. Before commenting, please review our comment policy. Load Comments Please enable JavaScript to view the comments. ClassAction.org Get in Touch First Name Last Name Email Phone Number Zip Code What brand of gummies did purchase? Please select... Astro Labs Beast Bites Create Njord Additional Details By submitting this form, I agree to the Terms, Disclaimer and Privacy Notice and to receiving calls and emails from the law firm handling this investigation <div class="measure-narrow pa3 tl"> <p class="f4 mt0 lh-title">What Happens When I Fill Out This Form?</p> <strong class="lh-copy">Your inquiry will be forwarded to one of the attorneys we work with.</strong> <p class="lh-copy">Someone at the firm may then reach out to you. If a law firm contacts you, they may need more information. You should receive an e-mail within 24-48 hours with an update on your inquiry. You're not going to be charged anything, and you have no legal obligation after you've filled out this form.</p> </div> What happens when I fill out this form? Submit Featured In: About Us ClassAction.org is a group of online professionals (designers, programmers and writers) with years of experience in the legal industry. We work closely with class action and mass tort attorneys across the country and help with investigations into corporate wrongdoing. More → Stay Current Sign Up For Our Newsletter New cases and investigations, settlement deadlines, and news straight to your inbox. Subscribe'''
