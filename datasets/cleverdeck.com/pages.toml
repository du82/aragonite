["https://cleverdeck.com/manual/spaced-repetition"]
title = "CleverDeck Manual - Spaced Repetition"
description = "CleverDeck is a spaced repetition system that uses learning algorithms to make studying more efficient and effective."
full_description = "Spaced repetition is a technique for reviewing information at increasingly longer intervals. It's currently our best answer to how can I spend the least amount of time studying and get the maximum benefit? The greatest thing about spaced repetition is that it let's you have your cake and eat it, too - you can spend less time studying and achieve greater memory retention. So what's the catch? Spaced repetition is the anti-cramming solution. It requires steady commitment over time. It won't help you prepare for a test the night before. The good news is that only a very small time commitment each day can yield results far superior to cramming information over one or two sessions. The idea behind spaced repetition is incredibly simple. For explanation's sake, imagine that you are learning the Spanish word for dog. A bad way to learn dog would be to review it three times today, three times tomorrow, and then look it up again when we eventually forget it. A better approach would be to review dog today, then again tomorrow, then three days after that, then one week after that, then one month after that. Every time we review dog, we wait longer until we review it again. Whenever we are on the verge of forgetting it, we refresh our memory with a quick review. A spaced repetition system, then, is a program that predicts when you will forget information and plans review intervals for you. Now imagine that we don't remember dog every time we see it. What if, on our third review, we've completely forgotten it? By telling a spaced repetition system whether or not you remember things, it can be smarter about scheduling those review intervals. If you forgot something, you should see it again soon. If you remember it, you're safe to wait longer. And by tracking and evaluating your entire history of forgetting and remembering something, the system can be even smarter about deciding when you should review it again. Do this for lots of pieces of information (like Spanish vocabulary), and you now have a very powerful way of learning that results in spending more time with those things you already know and very little time with things you remember easily."
year_published = 2025
clearnet = "https://cleverdeck.com/manual/spaced-repetition"
