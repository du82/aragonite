["https://cleverdeck.com/manual/decks"]
title = "CleverDeck Manual - Working with Decks"
description = "CleverDeck is a spaced repetition system that uses learning algorithms to make studying more efficient and effective."
full_description = '''You can access a deck's settings by swiping a deck row left on the main screen. Tap the settings icon to access settings, or tap the plus icon to add a card. At the top of the deck settings screen, you'll find a collection of stats about your activity on this deck. "Mastered" cards are defined in Algorithm settings. By default, a card is "mastered" if you remember it for more than 21 days. The colored line at the very top displays your progress on this deck. New cards are blue, with increasingly advanced cards represented by warmer colors. One of the best ways to use CleverDeck is to create your own cards. Especially if you're learning a language, finding and making cards for information you find yourself greatly benefits contextual understanding and memory retention. After tapping the plus icon for a deck, you will be presented with a blank card that you can fill in with the relevant fields. If a deck has a third field (e.g. transliteration) or fourth field (e.g. sentences), there will be space for those as well. All fields are optional - though, depending on your card display settings, you may need some fields for cards to make sense when you are actually reviewing them. You can also add an image or audio to your own cards. Images can be selected via web search, from an album, taken with your phone's camera, or pasted from the clipboard (this final option only appearing if there is currently copied onto the clipboard). To add audio, you can either record your own voice or, for language decks, generate a text-to-speech recording for your inputted text. Text-to-speech synthesis requires an internet connection and that the target language field be filled (so the system knows what text to synthesize). For optimal results, the TTS system uses voice synthesizers trained and unique to each target language. Once you're done creating a card, press save to add it to the front of the deck. User-created cards take priority and will appear before other new cards. Keep in mind that cards you create are categorized as new - if you don't immediately see them in a deck, it's probably because you have review cards you need to swipe first or because you've already gone through your new cards for that day.'''
year_published = 2025
