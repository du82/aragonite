["https://cleverdeck.com/manual/algorithm"]
title = "CleverDeck Manual - Algorithm"
description = "CleverDeck is a spaced repetition system that uses learning algorithms to make studying more efficient and effective."
full_description = "CleverDeck uses the SM-2 algorithm. This is the same algorithm used by other popular spaced repetition systems such as Anki and SuperMemo. Several of the algorithm's parameters can be customized inside the app. The SM-2 algorithm relies primarily on two variables to calculate new review intervals: the previous interval and the ease factor. The ease factor is simply a number that represents how easy CleverDeck thinks you can remember a card. The easier you have remembered a card in the past, the longer the next interval will be and vice versa. The ease factor is initially the same for all cards. Remembering a card will increase the ease factor, while forgetting or struggling with a card will penalize the ease factor. This results in the SM-2 demanding more reviews for cards you have trouble remembering. To avoid a situation in which reviews become irritatingly frequent, the ease factor can't fall below a reasonable minimum value When you forget a card and swipe it left, it is immediately put into the back of the card stack. If a card stack is particularly large, the card will be placed at a consistent distance from the front to avoid having to wait too long to review it again. You should keep swiping a card left until you can finally recall it. When a card is remembered after being forgotten (i.e. is swiped right after being swiped left previously), it is scheduled into the future by a constant value called the Learning Interval. The Learning Interval is 30 minutes by default, but can be configured in settings. In effect, the learning interval asks you to review cards again shortly after failing to remember them. Following a Learning Interval, you'll either remember the card or continue to fail. When you fail, the process repeats: the card is first put in the back of the stack until you recall it and is then scheduled forward by the Learning Interval. However, if you successfully recall a card following a Learning Interval, it graduates and is scheduled into the future by the Graduating Interval. The Graduating Inteval is 24 hours by default, but can be configured in settings."
year_published = 2025
clearnet = "https://cleverdeck.com/manual/algorithm"
