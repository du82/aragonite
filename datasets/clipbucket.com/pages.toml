title = "ClipBucket v2.0.4 Beta 2 – Still Under Development – ClipBucket"
full_description = "ClipBucket v2.0.4 Beta 2 – Still Under Development Home / ClipBucket v2 / ClipBucket v2.0.4 Beta 2 – Still Under Development Well, after struggling hard, we have changed our database structure and added “prefix” on each database table so that we can make upgrade and migration possible and more easy. Though it was one of the tough thing to do when you have a big application running on a very strong structure but we are hoping that it will give good results because this step was very important in order to make migration possible. Well in v2.0.4 many bugs are already fixed, few features are added, hoping to release it before Wednesday night 10 Feb, 2010. We still need your support, sponsors, more developers and off course more users. stay tuned for our next update, it will surely have “Migrator” from other scripts and “Upgrader” from previous version. Arslan By admin Comments off arslan hassan , ClipBucket , v2.0.4 February 7, 2010 Search Categories blog ClipBucket ClipBucket v2 ClipBucket v3 Developers Guide DRM Events Getting Started News News & Updates OTT Tips and DYK Uncategorized"
