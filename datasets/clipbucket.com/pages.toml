title = "ClipBucket and New Ideas – ClipBucket"
full_description = "ClipBucket and New Ideas Home / ClipBucket v2 / ClipBucket and New Ideas Hi we have been working hard on our project and still awaiting for developers to join us and help us achieve the goals that we have set. there are other scripts and it looks like they have more features than ClipBucket but if you go into deep, you can easily find the difference between the core coding of the ClipBucket and other scripts. ClipBucket’s code is easy to edit and creating new plugins is also not difficult. I dont know how to write documentation on scripts, so i would let you guys to ask me questions about ClipBucket development, i will gladly help you. I am trying my best and struggling to add as much features as i can but user contribution is too much low and unexpected that definitely low down our morals, i request you to please support our community by creating new themes or any changes or hacks you make, please do share them on our forums. ClipBucket Rc2 has been released and we are almost reaching at a stable stage. But, complete list of features that ClipBucket has is too much long that if you compare with our existing features, none script can match us. and we are still willing to go on and on. Click here to Download Latest version of ClipBucket We want someone to work on Pictures sections, he just need to have good knowledge of Image and file manipulation with basic skills of MySql, everything else ie Category, Commenting, Sharing, Flagging, Rating are easy to extend and integrate with any Section of ClipBucket. We also need someone to code Music section for us so ClipBucket can achieve the title of Multimedia Sharing Script. Believe me , we are struggling hard, you people appreciate us alot, but this time, please do contribute what you can and i don’t mean a MONEY. Please support ClipBucket community. Your ClipBucket Developer Arslan 🙂 By admin Comments off arslan hassan , ClipBucket v2 , features , ideas , pictures March 27, 2010 Search Categories blog 