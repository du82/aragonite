["https://clipbucket.com/2020/10/01/clipbucket-vodlix-are-now-working-as-one"]
title = "ClipBucket & Vodlix are now working as one – ClipBucket"
full_description = "ClipBucket & Vodlix are now working as one Home / Uncategorized / ClipBucket & Vodlix are now working as one Dear ClipBucket Community, We are pleased to announce that ClipBucket and Vodlix are now officially operating as one. Over the past decade, ClipBucket has been working to provide an out of the box OTT delivery solution and with Vodlix we have found a great partner that offered us the resources to reach unexplored markets and extend our solution to all the popular OTT platforms like Roku, FireStick, TizenOS, and WebOS along with our solution for Android TV, Apple TV. We appreciate your confidence and support for ClipBucket. As the leader in video streaming and OTT solution, we pledge our continued commitment to enabling your success and delivering the benefits we expect from this merger. For ClipBucket it will always be about the customer. Our goal is 100% customer satisfaction. We are dedicated to increasing the quality of support you have come to expect from ClipBucket and Vodlix without interruption. All support procedures, announced support timelines, and contacts for ClipBucket and Vodlix services remain unchanged, so please continue to use the same channels you’ve been using. In addition, your sales and services contacts remain the same and will be reaching out to you to address any questions you may have. We also encourage new customers to reach us for sharing information and expertise. ClipBucket is, and will keep it’s Community Edition open source. Thank you for your continued support. By admin Comments off October 1, 2020 Search Categories blog ClipBucket ClipBucket v2 ClipBucket v3 Developers Guide DRM Events Getting Started News News & Updates OTT Tips and DYK Uncategorized"
