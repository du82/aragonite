full_description = "ClipBucket 2.1 – Getting Rid Of Crons Home / ClipBucket v2 / ClipBucket 2.1 – Getting Rid Of Crons Hi So far, ClipBucket is going great but we still need to add some more features so we want to carry on. I have been thinking of removing crons and you can expect it in our next release, we will remove crons for video conversion, it will be required only for stats , nothing else. Don’t get excited now as we are now going to work on ClipBucket documentation before we start working on development again, once we are done with our documentation, we will add some new cool features in ClipBucket. I didn’t get enough time to work on main ClipBucket website, hopefully, once i am done with my project, i will work on our main stream website so users can find things more easily. Please post your feedback about changes you want in either ClipBucket or our mainstream website. Have a good day! Subh-ba-khair – Arslan By admin Comments off ClipBucket v2 , no crons , update May 24, 2010 Search Categories blog ClipBucket ClipBucket v2 ClipBucket v3 Developers Guide DRM Events Getting Started News News & Updates OTT Tips and DYK Uncategorized"
