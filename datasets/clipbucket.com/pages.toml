["https://clipbucket.com/privacy-policy"]
title = "Privacy Policy – ClipBucket"
full_description = 'Privacy Policy ClipBucket Basic information on data processing and legal bases 1.1. This data protection declaration informs you about the type, scope and purpose of the processing of personal data within our online offer, the online shop, and the websites, functions and contents associated with it (hereinafter jointly referred to as “online offer" or “website"). This privacy policy applies regardless of the domains, systems, platforms and devices (e.g. desktop or mobile) on which the online offer is executed. 1.2. Regarding the terms used, such as “personal data" or their “processing", we refer to the definitions in Art. 4 of the General Data Protection Regulation (GDPR). 1.3. The personal data of users processed within the scope of this online offer include inventory data (e.g. names and addresses of customers), contact data (e.g. e-mail, telephone numbers), contract data (e.g. e-mail address), and other personal data, services used, names of clerks, payment information), usage data (e.g. the pages visited on our website, interest in our products), meta/communication data (device IDs, IP addresses, location data) and content data (e.g. entries in the contact form), as well as applicant data (names, contact data, qualifications, application documents) if applicable. 1.4. The term “user" covers all categories of data subjects. These include our business partners, customers, interested parties and other visitors to our online offering. The terms used, such as “user", are to be understood as gender-neutral. 1.5. We process personal user data only in compliance with the relevant data protection regulations. This means that user data will only be processed, if a legal permission has been obtained. This means, if data processing is necessary for the provision of our contractual services (e.g. processing of orders) and online services, or if online services are required by law, if the user has given his or her consent, as well as if our legitimate interests (i.e. interest in the analysis, optimization and economic operation and security of our online services within the meaning of Art. 6 para. 1 lit. f. GDPR, for range measurement, creation of profiles for advertising and marketing purposes, collection of access data and use of third-party services). 1.6. We point out that the legal basis of the consents is Art. 6 para. 1 lit. a. and Art. 7 GDPR, the legal basis for the processing for the fulfilment of our services and the implementation of contractual measures is Art. 6 para. 1 lit. b. GDPR, the legal basis for processing to fulfil our legal obligations is Art. 6 para. 1 lit. c. GDPR, and the legal basis for processing to protect our legitimate interests is Art. 6 para. 1 lit. f. GDPR. Security measures 2.1. We take organizational, contractual and technical security measures in accordance with the state of the art to ensure that the provisions of data protection laws are observed and thus to protect the data processed by us against accidental or intentional manipulation, loss, destruction or against access by unauthorized persons. 2.2. The security measures include the encrypted transmission of data between your browser and our server. Passing on of data to third parties and third providers 3.1. Data will only be passed on to third parties within the framework of legal requirements. We only pass on user data to third parties if, for example, this is necessary for contractual purposes based on Art. 6 para. 1 lit. b) GDPR or based on legitimate interests pursuant to Art. 6 para. 1 lit. f. GDPR on the economic and effective operation of our business operations. 3.2. If we use subcontractors to provide our services, we will take appropriate legal precautions as well as appropriate technical and organizational measures to ensure the protection of personal data in accordance with the relevant statutory provisions. 3.3. If content, tools or other means from other providers (hereinafter jointly referred to as “third party providers") are used in the context of this data protection declaration and their named registered office is in a third country, it is to be assumed that data is transferred to the countries in which the third-party providers have their registered office. Third countries are countries in which the GDPR is not directly applicable law, i.e. in principle countries outside the EU or the European Economic Area. The transfer of data to third countries takes place either, if an appropriate level of data protection, user consent or other legal permission is available. Performance of contractual services 4.1. We process inventory data (e.g. names and addresses as well as contact data of users), contract data (e.g. services used, names of contact persons, payment information) for fulfilling our contractual obligations and services pursuant to Art. 6 para. 1 lit b. GDPR. 4.2. Users may optionally create a user account for viewing their orders. During the registration process, the required information will be communicated to the users. The user accounts are not public and cannot be indexed by search engines. If users have terminated their user account, their data will be deleted regarding the user account, conditionally upon its storage is necessary for commercial or tax reasons according to Art. 6 Para. 1 lit. c GDPR. For this, the license agreement with JmJaws must be terminated beforehand, if available. In addition, all components of the loaded software must be irretrievably deleted. 4.3. When registering, re-registering and using our online services, we store the IP address and the time of the respective user action. The data is stored based on our legitimate interests as well as the user’s protection against misuse and other unauthorized use. A passing on of this data to third parties does not take place in principle, unless it is necessary for the pursuit of our claims or there is a legal obligation according to Art. 6 Abs. 1 lit. c GDPR. 4.4. We process usage data (e.g. the visited websites of our online offer, interest in our products) and content data (e.g. entries in the contact form or user profile) for advertising purposes in a user profile to show the user e.g. product information based on their previously used services. Establishment of contact 5.1. When contacting us (via contact form or e-mail), the user’s details will be processed for processing the contact request and its handling in accordance with Art. 6 Para. 1 lit. b) GDPR. 5.2. User information may be stored in our Customer Relationship Management System (“CRM System") or comparable request organization. 5.3. We use the CRM system “WHMCS" from WHMCS LLC 2550 North Loop West Houston, TX 77092 United States based on our legitimate interests (efficient and fast processing of user inquiries). For this purpose, we have concluded an agreement with WHMCS with so-called standard contractual clauses in which WHMCS undertakes to comply with the EU data protection level. The data will be hosted in a data center in Romania from May 2018. WHMCS offers a guarantee to comply with European data protection law. Comments and contributions 6.1. If users leave comments or other contributions, their IP addresses will be used based on our legitimate interests within the meaning of Art. 6 para. 1 letter f. GDPR for 7 days. 6.2. This takes place for our safety, if someone leaves illegal contents in comments and contributions (insults, forbidden political propaganda, etc.). In this case we can be prosecuted ourselves for the comment or contribution and are therefore interested in the identity of the author. Collection of access data and log files 7.1. Based on our legitimate interests within the meaning of Art. 6 para. 1 letter f. GDPR we collect data on each access to the server on which this service is located (so-called server log files). Access data includes the name of the accessed website, file, date and time of access, transferred data volume, notification of successful access, browser type and version, the user’s operating system, referrer URL (the previously visited page), IP address and the requesting provider. 7.2. Log file information is stored for a maximum of seven days for security reasons (e.g. to investigate misuse or fraud) and will then be deleted. Data whose further storage is required for evidentiary purposes are excluded from deletion until the respective incident has been finally clarified. Cookies & range measurement 8.1. Cookies are information that is transferred from our web server or third-party web servers to the user’s web browser and stored there for later retrieval. Cookies can be small files or other types of information storage. 8.2. We use these cookies, for example, to store your login status or the shopping cart function and thus enable convenient use of our online offer. 8.3. Users will be informed about the use of cookies within the scope of pseudonymous range measurement within the scope of this data protection declaration. 8.4. If users do not want cookies to be stored on their computer, they are asked to deactivate the corresponding option in the system settings of their browser. Stored cookies can be deleted in the system settings of the browser. The exclusion of cookies can lead to functional restrictions of this online offer. 8.5. You may opt-out of the use of cookies for range measurement and promotional purposes via the deactivation page of the Network Advertising Initiative (http://optout.networkadvertising.org/) and additionally the US website (http://www.aboutads.info/choices) or the European website (http://www.youronlinechoices.com/uk/your-ad-choices/). Google Analytics 9.1. Based on our legitimate interests (i.e. interest in the analysis, optimization and economic operation of our online offer within the meaning of Art. 6 para. 1 lit. f. GDPR), we use Google Analytics, a web analysis service of Google Inc. “(“Google"). Google uses cookies. The information generated by the cookie about the use of the online offer by users is generally transferred to a Google server in the USA and stored there. 9.2. Google is certified under the Privacy Shield Agreement and thereby offers a guarantee to comply with European data protection laws (https://www.privacyshield.gov/participant?id=a2zt000000001L5AAI&status=Active). 9.3. Google will use this information on our behalf to evaluate the use of our online offer by users, to compile reports on the activities within this online offer and to provide us with further services connected with the use of this online offer and the use of the Internet. Pseudonymous user profiles can be created from the processed data. 9.4. We use Google Analytics to display advertisements placed by Google and its partners within advertising services only to users who have also shown an interest in our online offer or who have certain characteristics (e.g. interests in certain topics or products that are determined by the web pages visited) that we transmit to Google (so-called “remarketing" or “Google Analytics Audiences"). With the help of remarketing audiences, we would also like to ensure that our ads correspond to the potential interest of the users and are not annoying. 9.5. We use Google Analytics only with IP anonymization enabled. This means that Google will truncate the IP address of users within member states of the European Union or in other signatories of the Agreement on the European Economic Area. Only in exceptional cases will the full IP address be transmitted to a Google server in the USA and shortened there. 9.6. The IP address transmitted by the user’s browser is not merged with other Google data. Users can prevent the storage of cookies by setting their browser software accordingly; users can also prevent Google from collecting the data generated by the cookie and relating to their use of the online offer and the processing of this data by Google by downloading and installing the browser plug-in available under the following link: http://tools.google.com/dlpage/gaoptout?hl=en. 9.7. Further information on data use by Google, possible settings and objections can be found on the Google websites: https://www.google.com/intl/de/policies/privacy/partners (“Data use by Google when using our partners’ websites or apps"), http://www.google.com/policies/technologies/ads (“Data use for advertising purposes"), http://www.google.de/settings/ads (“Manage information that Google uses to show you advertising"). Newsletter 10.1. With the following information we inform you about the contents of our newsletter as well as the registration, dispatch and statistical evaluation procedure and your rights of objection. By subscribing to our newsletter, you agree to the receipt and the described procedures. 10.2. Content of the Newsletter: We only send newsletters, e-mails and other electronic notifications containing promotional information (hereinafter “newsletters") with the consent of the recipients or a legal permission. If the contents of a newsletter are specifically described within the scope of a registration, they are decisive for the consent of the users. In addition, our newsletters contain information about our products, offers, promotions and our company. 10.3. Double opt-in and logging: Subscription to our newsletter takes place in a so-called double opt-in procedure. This means that after registration you will receive an e-mail asking you to confirm your registration. This confirmation is necessary so that no one can log in with other e-mail addresses. Subscriptions to the newsletter are logged in order to be able to prove the registration process in accordance with legal requirements. This includes the storage of the login and confirmation time, as well as the IP address. 10.4. Login data: To subscribe to the newsletter, simply enter your e-mail address. 10.5. Cancellation/Revocation: You can cancel the receipt of our newsletter at any time, i.e. revoke your consent. At the same time, your consents to its dispatch expire. You will find a link to cancel the newsletter at the end of each newsletter. If users have only subscribed to the newsletter and cancelled their subscription, their personal data will be deleted. Integration of third-party services and content 11.1. Based on legitimate interests (i.e. interest in the analysis, optimization and economic operation of our online offer within the meaning of Art. 6 para. 1 lit. f. GDPR), we are including content or service offerings of third parties to incorporate their content and services, such as videos or fonts (hereinafter uniformly referred to as “content"). This always presupposes that the third-party providers of this content perceive the IP address of the users, as they would not be able to send the content to their browser without the IP address. The IP address is therefore required for the display of this content. We endeavor to use only those contents whose respective providers use the IP address only for the delivery of the contents. Third'
