["https://clipbucket.com/2019/01/11/amazons-imdb-just-launched-a-new-avod-platfrom-imdb-freedive-in-the-us"]
title = "Amazon’s IMDb  just launched a new AVOD OTT platfrom IMDb Freedive in the US – ClipBucket"
full_description = "Amazon’s owned platform IMDb just launched a new ad based OTT platform today called Freedive, and it’s basically Prime Video Lite. The ad-supported service is available from today in the US on the web and via Amazon’s Fire TV devices. Freedive offers Hollywood movie titles like Awakenings, Foxcatcher, Memento, Monster, Run Lola Run, The Illusionist, The Last Samurai, and True Romance and TV shows like Fringe, Heroes, The Bachelor and Without a Trace. If a title is available to stream on the new OTT service, you’ll see a “Watch for free on IMDb Freedive” button on IMDb’s desktop site that will launch the movie or show on your computer. However, the site’s search engine doesn’t have a filter for Freedive titles in its database just yet. The company makes it clear in the FAQ section that you can’t purchase movie titles, or pay a fee to get rid of ads as of now. We first heard about Amazon’s plans to offer an ad-based OTT service back in August 2018. It was slated to launch a week after the report surfaced, but it’s taken until now to officially launch. It’ll rival Roku’s ad-supported service in the US, and give Amazon a chance to bring in more revenue through advertising. The company said its existing video content – trailers, interviews, and original short series – will be integrated into the new service. Earlier this week, media software company Plex also announced that it’ll offer ad-supported content later this year. By Ali Ahmed Awan Comments off January 11, 2019 Search Categories blog ClipBucket ClipBucket v2 ClipBucket v3 Developers Guide DRM Events Getting Started News News & Updates OTT Tips and DYK Uncategorized"
