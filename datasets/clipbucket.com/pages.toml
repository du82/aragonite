ists & Let users add content to Queues. Help CenterHelp center allows you to display FAQs about your platform to your users, you can create new entries, edit old entries. VPN DetectionRestrict access to users using 3rd party VPN services. AirplayEnable your Video Streaming Platform with Airplay to stream from your Apple Devices. SearchThis feature lets users conveniently look up for titles in your library and save time in getting at exactly what they wish to access. Retargeting CodeConfigure Multiple re-targeting codes to selected pages to track & measure the audience behavior on your platform. Studio Approved DRMStudio Approved DRM is Hollywood's Stamp of approval to keep pirates at the bay. Clipbucket PlayoutLaunch and run your own Multiple Live TV Channels with Clipbucket Playout. Pre-Pay VideosAllow users to purchase your videos before they are live on site (Sell coming soon videos) set discounted / differential pricing, automatically notify users of video availability Android AppGet a native Android app that works across all Android Mobiles & Tablets of all screen sizes. Multi-CurrencyAccept payments in US Dollars to Pounds, from Yuan to Yen or accept Bitcoins and Mobile Payments! Apple TVGet your own branded Apple TV App, supports Subscription (SVOD), Pay Per View (TVOD) & Ad Supported (AVOD) Monetization Models User Generated ContentAllow End Users to Upload and Publish Self Generated Video Content on your Streaming Platform. Multiple VariantsUpload multiple variants of the same physical product in the same window. BlockchainUnlock the most powerful streaming ecosystem with blockchain Ratings and CommentsThis feature allows your users to express their opinion about the content that you have put out for them. Coupons & PromotionsGenerate Coupon Codes and Promotions to offer discounts One CMS for ALL AppsManage videos, metadata, content & pages from one single CMS / Admin panel. Updates across Web, Mobile and TV. BYOD (Bring Your Own Design)Bring Your Own Desig