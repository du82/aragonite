 48-Hour Response Time (weekdays only)"""
full_description = "Clipbucket Premium Support Plans Receive support from streaming experts. At Clipbucket, we believe that when our customers succeed, so do we. Our premium support plans offer various levels of service so you can get the help you need, when you need it. StandardFREEOnline Ticket Submission 48-Hour Response Time (weekdays only) Silver299£/ Per Month (Billed Annually)Online Ticket Submission 12-Hour Response Time (weekdays only) Live Chat Support Contact Us Gold499£/Per Month (Billed Annually)Online Ticket Submission 8-Hour Response Live Chat Support Web Conference Support (with Screen-Share) Advisory Services—3 Hrs. Incl. Contact Us Platinum1199£/Per Month (Billed Annually)Online Ticket Submission 4-Hour Response Live Chat Support Web Conference Support (with Screen-Share) Advisory Services—12 Hrs. Incl. Hot Fixes Dedicated Account Owner Contact Us Complete Details Of Support Plans Response times listed in Gold and Platinum plans only apply to Severity Level 1 submissions made via the customer support portal. Premium support subscriptions grant access to the following support services. Please note: Active maintenance and support is required in order to purchase a premium support plan and access technical support. Support Services Online Ticket Submission: Open a ticket for our technical support agents at Clipbucket Client Area. Response Time: A technical support agent will be actively working on your case. Live Chat Support: Engage live with a technical support agent using our chat feature on Clipbucket Live Chat. Web Conference Support with Screen-Share: Speak with a technical support agent while showing them your issue in real time. 24×7 Support: A technical support agent will be available to respond to your support needs 24 hours a day, 7 days a week. Clipbucket Advisory Services: Included with Gold and Platinum Premium Support! Get one-on-one training or advice from a Clipbucket expert on streaming basics, your architecture or streaming workflow, configuring advanced features, performance tuning and scaling. Also available for purchase without a Premium Support Plan. Hot Fixes: Special software patches will be created to fix your specific issue, if deemed necessary by our engineers. This is available only to customers running the latest version of Clipbucket. Dedicated Account Owner: You will receive an account manager who will be your direct contact at Clipbucket and oversee your needs."
