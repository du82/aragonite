["https://clipbucket.com/cb-install-requirements"]
title = "Installation Requirements – ClipBucket"
full_description = 'ClipBucket Installation Requirements This guide explains everything you need to know about running ClipBucket in best way possible. This page will explain operating system, hardware specs and server modules. We will also go through some common problems after installation of ClipBucket Pre ClipBucket Installation Operating System Linux (CentOS 6, CentOS 6.5, Fedora, Ubuntu) Required Modules Apache MySQL v5.6,5.7 (major) PHP v7.3 (major) python3.6 nginx FFMPEG MP4Box FFPROBE MediaInfo ImageMagick Elastic Search (Optional) PHP Shield MongoDB Apache mod_ rewrite enabled MySQL Version = 5.5.x, 5.6 PHP CLI Version = PHP 7.0 (with alternatives set to related version) Support for background process with Exec enabled safe_mode = off open_basedir = off Supports cURL Supports GD2 Library Supports ImageMagick max_execution_time = 7200 post_max_size = 100M upload_max_filesize = 100M memory_limit = 100M Note: All sizes should be at least 20-40 MB larger than the file you intend to upload. For example, if you plan to allow a file upload of maximum 100 MB, make sure your PHP configuration sizes are in range of 120 MB – 140 MB or higher FFMPEG Version = 2.x Required FFMPEG encoders => libx264, libfdk-aac, libmp3lame, libopus, libvpx MP4Box (latest) FFProbe (latest) MediaInfo (latest) ImageMagick (latest) Esitmated Video Conversion Standard Videos : 1 Size : 100 MBConverted to : All 5 resolutions Views : 100 Recommended Server Specs RAM : 8-10 gb (DDR3) Processor : i5 2.5 + ghz base speed Above is just an approximate. You can multiply or divide it according to your needs Suggested ClipBucket Related Configs Make sure you are installing latest version of ClipBucket Make sure FILES directory is writable at all times The minimum server requirement that we suggest for ClipBucket to run smoothly is a VPS with at least 5 GB Ram Post ClipBucket Installation There are certain issues that you might run into after installation of ClipBucket which are mostly due to misconfigured server or ClipBucket. We are giving a list of those problems along with solutions below Video Conversion Problems Problem 1 I see this error in admin area “You must update “Server Configurations". Click here for details” Solution This appears when your server hasn’t been configured the way we explained above or to be more exact, PHP is misconfigured. To make this notice go away, make sure your PHP has below configurations max_execution_time = 7500 post_max_size = 100M upload_max_filesize = 100M memory_limit = 100M Problem 2 I have installed all modules on my server but conversion stays stuck in processing Solution This is probably because you haven’t given correct paths to those modules Go to admin_area > Website Configurations > Upload and Conversion Settings and give correct paths in fields you see there Problem 3 I have all modules installed but conversion fails without ever starting Solution This mostly happens when you have selected Generate All Qualities option from admin area but one of your modules (FFProbe mostly) is not working probably. FFMPEG is not getting proper info about video and marks it as failed directly OPTIONAL DEPENDENCIESmongodb 3.x (for revenue sharing)mongodb extension for php (for revenue sharing)configure GZIP compression on server (for better speed optimization)'
