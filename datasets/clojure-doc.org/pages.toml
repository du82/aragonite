["https://clojure-doc.org/articles/tutorials/introduction"]
title = "Clojure Guides: Introduction to Clojure"
description = "This guide covers:"
full_description = '''Introduction to Clojure OverviewThe BasicsIdentifiersScalarsData StructuresAbstractionsEvaluationFunction CallsMacros and Special FormsQuotingLet and LocalsNamespacesFunctions for Creating Data StructuresFunctions For Working With Data StructuresRegular ExpressionsFunctions For Working With StringsValues, Immutability, and PersistenceControl StructuresTruthinessEqualityPredicates and ComparatorsVarsFunctions: Defining Your OwnLayout of FunctionsSide-effectsDestructuringLazinessBread and Butter Functionsmapfilter and removeapplyforreducepartial, comp, and iterateLooping and RecursionReference TypesSee AlsoNot Covered In This TutorialContributors This guide covers:Clojure language basicsexpressions, identifiers (locals, vars)let formsscalarsfunctionsbasic data typesintroduction to immutable data structuresoverview of Clojure reference types (vars, atoms, agents, refs)looping and recursionbasics of Clojure macrosThis work is licensed under a Creative Commons Attribution 3.0 Unported License (including images & stylesheets). The source is available on Github.OverviewThis is a brief beginner's introduction to Clojure. If you haven't already done so, have a look at the Getting Started tutorials. Before continuing, make sure you've got Java and either the Clojure CLI or Leiningen installed, and can create a new project and run a REPL in it. The author expects you'll want to have a REPL running while following this introduction so you can type expressions into it as you go.Note: In the code samples below, unless we're specifically discussing the REPL, to reduce clutter we've usually omitted showing the REPL prompt (ex. "user=>" or "my-proj.core=>").Additionally: In Clojure, a semicolon begins a single-line comment, and in this document we use "; ⇒" (for trailing comments) and ";; ⇒" (for comments on their own line) to indicate what the previous expression evaluates to.Code samples shown with a blue outline around them are interactive: the box containing the code is editable and the box containing the output/result will automatically update as you edit the code. These examples are powered by Klipse.This introduction is a whirlwind tutorial of most of the basics of Clojure. Its goal is to rapidly get you familiar with the core areas of the language without wasting your time and also without getting too bogged down in details or advanced topics (the various topics will get more comprehensive coverage in the topic guides anyway).As we said in the Getting Started tutorial, Clojure is a wonderfully simple language, and you're going to love it.This is just one of many Clojure tutorials out there. The official Clojure site has a Learn Clojure series tha was not available when this Introduction was originally written. The Practical.li website also has an excellent Learn Clojure book and there's also the classic Clojure for the Brave and True (although that is showing its age a bit at this point).When you're ready to move beyond experimenting in the REPL, you can read about Creating New Projects later in this guide.The BasicsClojure is a general-purpose programming language, and a quite practical one at that.The syntax for Clojure is like Lisp and is very simple: code is made up of expressions which are evaluated to some value. Here are some examples of expressions:5 ; ⇒ 5 "hi" ; ⇒ "hi" [1 2 3] ; evaluates to the vector `[1 2 3]` (+ 1 2) ; evaluates to the sum of 1 and 2 (if true "yes" "no") ; evaluates to the string "yes" (println "hello!") ; evaluates to nil (but also prints "hello!") Clojure supports a few extra bits of syntax which will be noted as we encounter them.Expressions can contain sub-expressions:(+ 1 (* 2 3) (/ 10 2)) ; ⇒ 1 + (2 * 3) + (10 / 2) = 12 Expressions in (various types of) brackets are often referred to as "forms".An expression in parentheses is usually treated as a function call, but may also be a macro or special form (more about those in the Evaluation section below).Clojure is not whitespace-sensitive. Also, commas count as whitespace, so you can omit them (for example, you can write a vector as [1 2 3] instead of [1, 2, 3]).Clojure code is block-structured and lexically scoped (though dynamic scope is supported as well, if you really need it).Clojure is a compiled language. The Clojure reader reads your source code, then your code is compiled to JVM bytecode, and then it's run on the JVM. The reader supports a few extra bits of syntactic sugar (for example, a literal syntax for specifying regular expressions) that we will cover as we go along.Throughout this tutorial, we will liberally reference and lean on the marvelous Clojure Cheatsheet. Aside from being a great organizational aide, it also handily includes links to the relevant Clojuredocs pages where you can find docs for and examples of the various Clojure functions.In the REPL, at any time you can see the documentation for a given function:(doc some-function) and even the source code for it:(source some-function) So, it will be of great use to you to have your REPL running so you can try things out while following along.IdentifiersIdentifiers are used to name things. For example, in(def the-answer 42) we've named something "the-answer" and given it the value 42.In this document we'll mostly use lowercase letters, numbers, and dashes to name things, although some other characters are allowed too, such as _<>!?* (ex. this->that, ready?). We'll note more examples of those cases later on as they come up.ScalarsClojure has support for the following kinds of scalar values:nil true, false nil is like Python's None, or Java's null. It's just another value. Incidentally, there's no "undefined" value in Clojure --- if you try to use a symbol which you haven't defined, then it's undefined and the compiler will let you know about it.As we go along, type those expressions into your REPL to see them evaluated. These too:1 ; integer 1N ; arbitrary-precision integer 1.2 ; float/double/decimal 1.2M ; arbitrary-precision decimal 1.2e4 ; scientific notation 1.2e4M ; sci notation of arbitrary-precision decimal 0x3a ; hex literal (58 in decimal) 1/3 ; Rational number, or "ratio". \a ; The character "a". "hi" ; A string. Strings can span multiple lines --- just hit Enter and keep typing. If you want to include a double-quote mark in a string, backslash-escape it.#"^foo\d?$" ; A regular expression. :foo ; A keyword. :foo/bar ; A namespaced keyword. We'll have more to say about regular expressions later on.Keywords are just scalars that evaluate to themselves and are useful where in other languages you might use little strings as identifiers (for example, as the keys in a hashmap). More about keywords in the next section (Data Structures).'foo ; A symbol. 'foo/bar ; A namespaced symbol. A symbol is an object that represents the name of something. The single quote mark is there to keep Clojure from trying to figure out to what the symbol refers (the quote isn't part of the identifier of the symbol). When you want to represent the name of a thing --- rather than the value to which it refers --- you use a symbol. Their utility will become clearer later on when we briefly mention Macros.Terminology: By "object" we just mean the internal thing that Clojure uses to represent a value --- not "object" as in "object oriented programming". Clojure is not an object oriented language. Sure, you can easily access Java OOP objects from Clojure, but that is outside the scope of this tutorial.Also, the words "reference" and "refer" are used in Clojure in the generic sense. A symbol refers to an object (it is not the object itself). Clojure also happens to support something called reference types. We'll cover them later on in the Reference Types section.Data StructuresClojure comes out of the box with nice literal syntax for the various core data structures:[1 2 3] ; A vector (can access items by index). [1 :two "three"] ; Put anything into them you like. {:a 1 :b 2} ; A hashmap (or just "map", for short). A hashmap is your typical hash/dictionary data structure. In the above example, the keys are :a and :b, and the values are 1 and 2. One key-value pair in a map is called an entry.Using namespaced keywords as keys is a common practice in Clojure applications, as it provides more context to the key and helps avoid key collisions:{:customer/id 123 :invoice/id "INV-456" :invoice/total 95.99} Note: if you have a hashmap where all the keys have the same namespace prefix, such as {:invoice/id "INV-456" :invoice/total 95.99}, the REPL will print it using a shorthand syntax, where the prefix is shown in front of the hashmap and the keys are shown without the prefix: #:invoice{:id "INV-456", :total 95.99}. This is just a shorthand syntax for printing the hashmap and doesn't affect how you use the hashmap in your code.Although it's most common to use keywords (as shown above) for hashmap keys, you can use any values you like for the keys as well as the values.#{:a :b :c} ; A set (unordered, and contains no duplicates). '(1 2 3) ; A list (linked-list) You generally don't use lists very often for typical sequential data in your programs:(def my-stuff '("shirt" "coat" "hat")) ; Works fine, but ... (def my-stuff ["shirt" "coat" "hat"]) ; this is more typical usage. Lists are most often used when treating code itself as just a bunch of nested lists --- see Macros.BTW, don't mind that single-quote mark before the list's open paren; it's just there to tell Clojure that this isn't a function call (discussed in Function Calls, below), but rather, an actual list.Note: In Clojure, we use the term "vector" rather than "array". "Array" would refer to the native Java array, whereas "vector" refers to the Clojure data structure.Nesting data structures works like you'd expect:#{:a [1 2 3] {:foo 11 :bar 12} #{"shirt" "coat" "hat"}} We will see how to get at values inside nested data structures a little later on.AbstractionsThe data structures we just looked at (lists, vectors, maps, and sets) are all concrete data types. The various Clojure functions for working on them (which we will get to later on) actually aren't written to work on the concrete types, but rather, are written to work on abstract data types. The concrete data types are implementations of the various abstract data types.Some of the Clojure abstractions are:Collection (Lists, vectors, maps, and sets are all collections.)Sequential (Lists and vectors are ordered collections.)Associative (Hashmaps associate keys with values. Vectors associate numeric indices with values.)Indexed (Vectors, for example, can be quickly indexed into.)In the docs for the various functions, you'll often see that they take, for example, a "coll". This means that the particular function will work on any of the collections.If you'd like to look under the covers and see what the type of an object is, try (type my-stuff).EvaluationSo far you've been typing various literal values (expressions) into the repl and Clojure has evaluated them and repeated their resulting values back to you (printed them out in the repl):user=> "hi" ;; "hi" user=> :foo ;; :foo user=> [1 2 3] ;; [1 2 3] Clojure evaluates the expressions you give it and tries to come up with a resulting value. If the expression starts with an open paren, Clojure treats it as either a macro, a special form (discussed below) or else a function call.Function CallsIf the symbol right after the open paren names a function, Clojure evaluates all of its function arguments first, then applies the function to the values of those args:(my-func arg1 arg2 arg3) You can nest function calls as deep as tasteful discretion allows:(my-func (my-func2 arg1 arg2) (other-func arg-a (foo-bar arg-x arg-y (+ arg-xx arg-yy arg-zz)) arg-b)) Note that your code will be easiest to read if you line up args to functions vertically (as shown above). Your editor should take care of this for you automatically.By the way, there are no "operators" in Clojure per se; just function names (symbols which refer to their corresponding functions). So, for example, +, >, <=, =, *, and not= are all just function names.Macros and Special FormsIf an expression starts with an open paren, Clojure first checks to see if it's a macro or special form. These are forms which don't follow the regular evaluation rule and get special treatment from the Clojure compiler.Macros are like functions which take as arguments regular Clojure code (which is, after all, just a list of expressions and (usually nested) other lists), and returns the code transformed / expanded in some useful way.You write macros to add new syntax to the Clojure language, and usually it's only done when necessary, after you've already gotten as far as you can with plain functions.Macros are created using defmacro. Writing them involves manipulating lists (Clojure code), just like you've already seen. Though quoting and unquoting is used to control evaluation of the code you're handling.Macro calls in your code get expanded at compile-time, right before the rest of your code is compiled. Certain Clojure built-ins like let, def, and if are written as special forms which are hard-coded into the compiler rather than macros, but this is an implementation detail; the effect is the same.This tutorial does not discuss macros further.QuotingIf for whatever reason you'd rather Clojure not treat something like (+ 1 2 3) as a function call, you can "quote" it like so:'(+ 1 2 3) This causes Clojure to then regard it simply as a 4-element list; the first element of which is the symbol for some function. Reasons for wanting to do this will become clearer later on.Let and LocalsWhen you want some lexically-scoped named values to use in a section of your code, you can use the let expression:(let [width 10 height 20 thickness 2] (println "hello from inside the `let`.") (* width height thickness)) The first thing inside the let is a binding vector. In it, you specify the local names you'd like to make available inside the let, along with their values.Formatting note: Your readers might appreciate you vertically lining up the values used in the binding vector, as we've done above with 10, 20, and 2.These local names are symbols that refer directly to the values you set them to.You can re-set the symbols in the binding vector multiple times (building it up into the value you need), if you find it useful:(let [x 2 x (* x x) x (+ x 1)] x) The let expression itself evaluates to the last expression in its body. You can put other things inside the let (like our println expression, in the previous example), but the overall value of the let is its last expression.Note that the println expression just evaluates to nil. We don't use its value for anything --- we only care about its side-effects (printing out to the console). More about Side-Effects shortly.NamespacesClojure uses namespaces to organize function names into groups and to keep them from colliding with other function names. All function names live in a namespace. All'''
