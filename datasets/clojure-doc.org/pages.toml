["https://clojure-doc.org/articles/language/interop"]
title = "Clojure Guides: Language: Java Interop"
description = "This guide covers:"
full_description = '''Language: Java Interop This guide covers:How to instantiate Java classesHow to invoke Java methodsHow to extend Java classes with proxyHow to implement Java interfaces with reifyHow to generate Java classes with gen-classOther topics related to interopThis guide does not cover how to include Java files in Clojure projects. For that, head to including Java code in a Clojure projectThis work is licensed under a Creative Commons Attribution 3.0 Unported License (including images & stylesheets). The source is available on Github.What Version of Clojure Does This Guide Cover?This guide covers Clojure 1.12.OverviewClojure was designed to be a hosted language that directly interoperates with its host platform (JVM, JS, CLR and so on). Clojure code is compiled to JVM bytecode. For method calls on Java objects, the Clojure compiler will try to emit the same bytecode javac would produce.It is possible to implement interfaces, and to extend and generate Java classes in Clojure.Clojure also provides convenient functions and macros that make consuming Java libraries easier and often more concise than it would be in Java code.See also the official Java interop reference on clojure.org.ImportsJava classes can be referenced either using their fully-qualified names (FQNs) such as java.util.Date or be imported in the current Clojure namespace using clojure.core/import (or the :import clause of ns) and referenced by short names:java.util.Date ; ⇒ java.util.Date (import java.util.Date) Date ; ⇒ java.util.Date The ns macro supports imports, too:(ns myservice.main (:import java.util.Date)) More about the ns macro can be found in the article on Clojure namespaces.Dynamic (at runtime) imports are usually only used in the REPL and cases when there are multiple implementations of a particular protocol/service/feature and it is not possible to tell which one should be used until run time.Automatic Imports For java.lang.*Most classes from the java.lang package are automatically imported. For example, you can use String or Math without explicitly importing them:(defn http-uri? [^String uri] (.startsWith (.toLowerCase uri) "http")) (Math/round 0.7886) You can avoid most direct uses of java.lang.String by using the clojure.string namespace. You can avoid most uses of java.lang.Math by using the clojure.math namespace (added in Clojure 1.11).Clojure is compatible with Java 8 and later, so classes and interfaces added to Java 9 and later are not automatically imported.Inner (Nested) ClassesIn Java, classes can be nested inside other classes. They are called inner classes and by convention, separated from their outer class by a dollar sign ($):(import java.util.Map$Entry) Map$Entry ; ⇒ java.util.Map$Entry ;; this example assumes RabbitMQ Java client is on classpath (import com.rabbitmq.client.AMQP$BasicProperties) AMQP$BasicProperties ; ⇒ com.rabbitmq.client.AMQP$BasicProperties Note that if you need to use both a class and one or more of its inner classes, they all need to be imported separately. As far as JVM is concerned, they are all separate classes, there is no "imports hierarchy".How to Instantiate Java ClassesJava classes are instantiated using the new special form:(new java.util.Date) ; ⇒ #inst "2012-10-09T21:23:57.278-00:00" However, the Clojure reader provides a bit of syntactic sugar and you are much more likely to see this:(java.util.Date.) ; ⇒ #inst "2012-10-09T21:24:43.878-00:00" It is possible to use fully qualified names (e.g. java.util.Date) or short names with imports:(import java.util.Date) (Date.) ; ⇒ #inst "2012-10-09T21:24:27.229-00:00" As of Clojure 1.12, you can use the following syntax:(java.util.Date/new) ;; or, if you have imported the class: (Date/new) An example with constructor arguments:(java.net.URI. "https://clojure.org") ;;⇒ #object[java.net.URI 0x8bd076a "https://clojure.org"] ;; or, in Clojure 1.12: (java.net.URI/new "https://clojure.org") In Clojure 1.12, SomeClass/new is a "function value" and can be treated like a regular Clojure function:(map (fn [f] (f "https://clojure.org")) [java.net.URI/new count clojure.string/upper-case]) ;;=> (#object[java.net.URI 0x7ec25216 "https://clojure.org"] 19 "HTTPS://CLOJURE.ORG") How to Invoke Java MethodsThis guide does not cover type hints. See the official Java interop type hints and param-tags reference documentation for more details (since this area changed significantly in Clojure 1.12).Instance MethodsInstance methods are invoked using the . special form:(let [d (java.util.Date.)] (. d getTime)) ; ⇒ 1349819873183 Just like with object instantiation, it is much more common to see an alternative version:(let [d (java.util.Date.)] (.getTime d)) ; ⇒ 1349819873183 In Clojure 1.12, SomeClass/.methodName is a "function value" and can be treated like a regular Clojure function:;; assuming (import java.util.Date): (map Date/.getTime [(Date.) (Date/new) #inst "2024-12-30"]) ;;⇒ (1735603851861 1735603851861 1735516800000) Static MethodsStatic methods can be invoked with the same . special form:(. Math floor 5.677) ; ⇒ 5.0 or (typically) the sugared version, ClassName/methodName:(Math/floor 5.677) ; ⇒ 5.0 (Boolean/valueOf "false") ; ⇒ false (Boolean/valueOf "true") ; ⇒ true In Clojure 1.12, SomeClass/.methodName is a "function value" and can be treated like a regular Clojure function:(map Boolean/valueOf ["true" "false" "what?"]) ;;⇒ (true false false) Note: Clojure 1.11 introduced parse-boolean but it is somewhat stricter than Boolean/valueOf and will return nil for strings it does not recognize, including "TRUE" and "FALSE" (which Boolean/valueOf does recognize).Chained Calls With The Double Dot FormIt is possible to chain method calls using the .. special form:(.. (java.util.Date.) getTime toString) ; ⇒ "1693344712616" Multiple Calls On the Same ObjectIf you need to call several methods on the same (mutable) object, you can use the doto macro:(doto (java.util.Stack.) (.push 42) (.push 13) (.push 7)) ; ⇒ [42 13 7] ;; assume (import java.awt.Point) (let [pt (Point. 0 0)] (doto pt (.move 10 0))) ;;⇒ #object[java.awt.Point 0x1084ac45 "java.awt.Point[x=10,y=0]"] (let [pt (Point. 0 0)] (doto pt (.move 10 0) (.translate 0 10))) ;;⇒ #object[java.awt.Point 0x7bc6935c "java.awt.Point[x=10,y=10]"] Each method is called on the original object -- the first argument to doto -- and it returns that same object as the result.How to Access Java FieldsPublic mutable fields are not common in Java libraries but sometimes you need to access them. It's done with the same dot special form:(import java.awt.Point) (let [pt (Point. 0 10)] (. pt x)) ; ⇒ 0 (let [pt (Point. 0 10)] (. pt y)) ; ⇒ 10 and just like with instance methods, it is more common to see the following version:(import java.awt.Point) (let [pt (Point. 0 10)] (.x pt)) ; ⇒ 0 (let [pt (Point. 0 10)] (.y pt)) ; ⇒ 10 For compatibility with ClojureScript, the following syntax is also supported for field access:(import java.awt.Point) (let [pt (Point. 0 10)] (.-x pt)) ; ⇒ 0 (let [pt (Point. 0 10)] (.-y pt)) ; ⇒ 10 This is to distinguish between field access and method access.How to Set Java FieldsTo set a public mutable field, use clojure.core/set! that takes a field in the dot notation demonstrated earlier and a new value:(import java.awt.Point) (let [pt (Point. 0 10)] (set! (.-y pt) 100) (.-y pt)) ; ⇒ 100 Fortunately, mutable public fields are rare to meet in the JVM ecosystem so you won't need to do this often.How To Work With EnumsEnums (enumeration) type values are accessed the same way as static fields, except on enum classes:java.util.concurrent.TimeUnit/MILLISECONDS ;;⇒ #object[java.util.concurrent.TimeUnit 0x4cc7d00d "MILLISECONDS"] Determining Classes of Java ObjectsTo get class of a particular value, pass it to clojure.core/class:(class 1) ; ⇒ java.lang.Long (class 1.0) ; ⇒ java.lang.Double (class "docs") ; ⇒ java.lang.String (class (java.net.URI. "https://github.com")) ; ⇒ java.net.URI As this example demonstrates, Clojure strings are JVM strings, integer literals are compiled as (boxed) longs and floating point literals are compiled as (boxed) doubles.You can also use clojure.core/type to return either the class of the Java object, or the :type metadata if it exists:(def foo (with-meta [1 2 3] {:type :bar})) (type foo) ;; ⇒ :bar (type [1 2 3]) ;; ⇒ clojure.lang.PersistentVector How To Get a Java Class Reference By NameTo obtain a class reference by its string name (fully qualified), use Class/forName via Java interop:(Class/forName "java.util.Date") ; ⇒ java.util.Date Array Types, PrimitivesJVM has what is called primitive types (numerics, chars, booleans) that are not "real" objects. In addition, array types have pretty obscure internal names.An array of String, has an internal name of "[Ljava.lang.String;". You can construct an array of String using into-array:(class (into-array String ["foo" "bar" "baz"])) ;;=> java.lang.String/1 ; Clojure 1.12 ;; but in earlier versions of Clojure: ;;⇒ [Ljava.lang.String; In Clojure 1.12, you can SomeClass/N to get a class reference to an N-dimensional array of the class, but prior to 1.12, you had to use Class/forName and the internal name of the array type:Internal JVM class nameArray of ? (type)Clojure 1.12 type"[S"shortshort/1"[I"integerinteger/1"[J"longlong/1"[F"floatfloat/1"[D"doubledouble/1"[B"bytebyte/1"[C"charchar/1"[Z"booleanboolean/1For convenience, Clojure has *-array functions for each of the above types that help you create an array of primitive values:user=> (char-array [\h \e \l \l \o]) #object["[C" 0x7df60067 "[C@7df60067"] user=> (apply str *1) "hello" If this does not make much sense, don't worry. Just remember to come back to this guide when you need to extend a protocol for an array of primitives.Implementing Java Interfaces With reifyIt is possible to implement Java interfaces in Clojure. It is typically needed to interact with Java libraries that take arguments implementing a particular interface.Interfaces are implemented using the reify special form.Given the following Java interface:/* from java.io package */ public interface FilenameFilter { /** * Tests if a specified file should be included in a file list. * * @param dir the directory in which the file was found. * @param name the name of the file. * @return <code>true</code> if and only if the name should be * included in the file list; <code>false</code> otherwise. */ boolean accept(File dir, String name); } here is how to implement it in Clojure:;; a FileFilter implementation that accepts everything (reify java.io.FilenameFilter (accept [this dir name] true)) reify takes an interface (fully-qualified name or short name) and one or more method implementations that mimic function definitions without the defn and with this (as in Java, JavaScript or self in Ruby, Python) reference being the first argument:(accept [this dir name] true) With reify, generally there is no need to add type hints on arguments: Clojure compiler typically will detect the best matching method (by name and number of arguments).reify returns a Java class instance. Clojure compiler will generate a class that implements the interface and instantiate it. To demonstrate that reified objects indeed implement the interface:(let [ff (reify java.io.FilenameFilter (accept [this dir name] true))] (instance? java.io.FilenameFilter ff)) ; ⇒ true reify can be used to implement multiple interfaces at once:(let [ff (reify java.io.FilenameFilter (accept [this dir name] true) java.io.FileFilter (accept [this dir] true))] (instance? java.io.FileFilter ff)) ; ⇒ true In Clojure 1.12, a Java interface that is declared @FunctionalInterface can be inferred from from the context and can be satisfied with a regular Clojure function. java.io.FilenameFilter is such an interface, so you can pass a Clojure function directly to a Java method that expects a FilenameFilter:(seq (.list (java.io.File. ".") #(str/starts-with? %2 "."))) ;;⇒ (".cpcache" ".portal" ".clj-kondo" ".lsp" ".calva") In earlier versions of Clojure, you would have to use reify for that:(seq (.list (java.io.File. ".") (reify java.io.FilenameFilter (accept [this dir name] (str/starts-with? name "."))))) ;;⇒ (".cpcache" ".portal" ".clj-kondo" ".lsp" ".calva") reify, Parameter Destructuring and Varargsreify does not support destructuring or variadic arguments in method signatures. You will not always get an error from the compiler if you try to use them, but the resulting code will not work the way you expect. For example:(reify java.io.FilenameFilter (accept [a & more] (comment ...))) This will compile without error but when called, the first argument to accept -- the directory object -- will be bound to & and the second argument to accept -- the filename string -- will be bound to more.Example 1The following example demonstrates how instances created with reify are passed around as regular Java objects:(require '[clojure.string :as str]) (import java.io.File) ;; a file filter implementation that keeps only .edn files (let [ff (reify java.io.FilenameFilter (accept [this dir name] (str/ends-with? name ".edn"))) dir (File. "/home/sean/oss/clojure-doc.github.io/")] (into [] (.listFiles dir ff))) ;; ⇒ [#object[java.io.File 0x1450131a "/home/sean/oss/clojure-doc.github.io/deps.edn"]] reify forms a closure: it will capture locals in its scope. This can be used to make implemented methods delegate to Clojure functions. The same example, rewritten with delegation:(import java.io.File) ;; a file filter implementation that keeps only .edn files (let [f (fn [_dir name] (str/ends-with? name ".edn")) ff (reify java.io.FilenameFilter (accept [this dir name] (f dir name))) dir (File. "/home/sean/oss/clojure-doc.github.io/")] (into [] (.listFiles dir ff))) ;; ⇒ [#object[java.io.File 0x5d512ddb "/home/sean/oss/clojure-doc.github.io/deps.edn"]] As above, in Clojure 1.12, because java.io.FilenameFilter is a functional interface, you can pass a Clojure function directly:(import java.io.File) ;; a file filter implementation that keeps only .edn files (let [^java.io.FilenameFilter f (fn [_dir name] (str/ends-with? name ".edn")) dir (File. "/home/sean/oss/clojure-doc.github.io/")] (into [] (.listFiles dir f))) Note: we need the type hint on f here because .listFiles has multiple overloads for the same arity, and we need to distinguish a FilenameFilter from a FileFilter.Extending Java Classes With proxyproxy is one of two ways to generate instances of anonymous classes in Clojure. proxy takes two vectors: one listing its superclass and (optional) interfaces, the other listing constructor signatures, as well as zero or more method implementations. Method implementations are identical to reify except that the this argument is not necessary.A very minimalistic example, we instantiate an anonymous class that extends java.lang.Object, implements no interfaces, has no explicitly defined constructors and overrides #toString:(proxy [Object] [] (toString [] "I am an instance of an anonymous class generated via proxy")) ;; ⇒ #object[user.'''
