["https://clojure-doc.org/articles/content"]
title = "Clojure Guides: Table of Contents"
description = """
The content on this site
(source) is a categorized and
manifold collection of documentation guides for the Clojure programming language and
its ecosystem.We recognize that different Clojure users have different level of expertise
and separates content into several groups:"""
full_description = '''Table of Contents The content on this site (source) is a categorized and manifold collection of documentation guides for the Clojure programming language and its ecosystem.We recognize that different Clojure users have different level of expertise and separates content into several groups:EssentialsLanguage GuidesEcosystem & Tools (tools, libraries, community, books) guidesTutorials & CookbooksEssentialsWhat makes developing in Clojure unique is that we have a focus on interactive programming: not just the REPL (Read Eval Print Loop) that Clojure provides but working in an editor that integrates well with the REPL experience to allow you to evaluate your code, in small pieces, directly from your editor as you write the code. This provides immediate feedback as you are exploring your problem space and "growing" your application.These first three sections should help you get Clojure and some basic tooling installed, learn the basics of the language, and get a good editor setup that allows you to program interactively.Getting StartedIf you're new to Clojure, this is a good place to start.This guide covers:How to install the Clojure CLI (or Leiningen)Accessing the REPLHow to create a minimal projectWhat is interactive developmentIntroductionA swift introduction to the Clojure language, covering most of the basics.Editors for Clojure DevelopmentA list of popular options for editing Clojure code and working with Clojure data.Language GuidesFunctionsFunctions are at the heart of Clojure.This guide covers:How to define functionsHow to invoke functionsMulti-arity functionsVariadic functionsHigher order functionsOther topics related to functionsclojure.core Overviewclojure.core is the core Clojure library.This guide covers:Key functions of clojure.coreKey macros of clojure.coreKey vars of clojure.coreCollections and SequencesThis guide covers:Collections in ClojureSequences in ClojureCore collection typesKey operations on collections and sequencesOther topics related to collections and sequencesNamespacesNamespaces organize Clojure functions.This guide covers:An overview of Clojure namespacesHow to define a namespaceHow to use functions in other namespacesrequire, refer and useHow to Look up and invoke a function by nameCommon compilation exceptions and their causesHow code compilation works in ClojureInteroperability with JavaThe Clojure language implementation is symbiotic with its host platform (the JVM), providing direct interoperability.This guide covers:How to instantiate Java classesHow to invoke Java methodsHow to extend Java classes with proxyHow to implement Java interfaces with reifyHow to generate Java classes with gen-classOther topics related to interopPolymorphism: Protocols and MultimethodsThis guide covers:What are polymorphic functionsType-based polymorphism with protocolsAd-hoc polymorphism with multimethodsHow to create your own data types that behave like core Clojure data typesConcurrency & ParallelismThis guide covers:An overview of concurrency hazardsClojure's approach to state and identityImmutable data structuresReference types (atoms, vars, agents, refs)Using Clojure functions with java.util.concurrent abstractionsThe Reducers framework (Clojure 1.5+)Other topics related to concurrency and runtime parallelismMacros and MetaprogrammingThis guide covers:Clojure macrosClojure compilation processOther topics related to metaprogrammingLaziness and Lazy SequencesThis guide covers:What are lazy sequencesHow to create functions that produce lazy sequencesHow to force evaluationPitfalls with lazy sequencesGlossaryThis guide includes definitons of various Clojure-related terminology.The Clojure EcosystemClojure CommunityThis guide covers:Planet Clojure, mailing lists, IRC channelClojure conferencesLocal Clojure user groupsOther Clojure community resourcesThe Official Clojure CLIGetting Started with the Clojure CLI on this siteThe official deps.edn and CLI guide on clojure.orgThe official deps.edn and CLI reference on clojure.orgLibrary Development and DistributionThis guide covers:Creating new library projects with the Clojure CLIBasic setup for library developmentHow to publish a library to GitHubHow to publish a library to ClojarsThe Clojure ToolboxThis is a well-maintained directory of libraries, organized by category, and is interactively searchable.LeiningenGetting Started with Leiningen covers What is Leiningen and what it can do for youHow to create a project with LeiningenHow to manage project dependenciesAccessing the REPLHow to run tests for your projectHow to run the appHow to compile your code and dependencies into a single JAR for deployment ("überjar")How to share (publish) a libraryLeiningen Profiles covers What are Leiningen profilesHow to use themDistributing Libraries with Leiningen covers How Clojure libraries are distributedHow to publish Clojure libraries to clojars.orgHow to publish Clojure libraries to Maven CentralHow to publish Clojure libraries to your own Maven repositoryWriting Leiningen Plugins covers What Leiningen plugins can doHow to install Leiningen pluginsHow to develop pluginsHow to distribute pluginsWeb Development OverviewThis guide provides a partial overview of the more popular tools and libraries for web development.Documentation ToolsTools for generating documentation from docstrings and other project metadata.Tutorials and CookbooksGetting StartedThis tutorial will get you up and running with the official Clojure CLI or Leiningen.Introduction to ClojureThis tutorial will introduce you to the Clojure language.Clojure EditorsThis tutorial covers the most popular editors used for Clojure development and points you to the relevant documentation for each editor.Basic Web DevelopmentA brief tutorial/walkthrough of building a small web app using Ring, Compojure, Hiccup, and H2.Building Projects: tools.build and the Clojure CLIThis cookbook shows you the power of the tools.build library, which is used with a build.clj file and the Clojure CLI to build, test, deploy, and more.Data StructuresThis cookbook covers:VectorsMapsListsSetsGeneric operations on sequencesStringsThis cookbook covers:How to work with stringsHow to work with charactersHow to work with regular expressionsHow to work with context-free grammarsHow to format textMathematicsIncludes coverage of facilities for doing math with Clojure.Date and TimeThis guide covers:Working with clojure.java-timeWorking with java-time via interopWorking with cljc.java-timeFiles and DirectoriesThis cookbook covers:Reading and writing text and binary filesListing directory contentsCreating files and directoriesMoving files and directoriesRemoving files and directoriesAccessing file metadataOther operations on files and directoriesMiddlewareThis guide covers:What middleware is and how it worksCreating middleware for a client functionCombining middleware to create a new clientParsing XML in ClojureThis guide covers:How to parse XML in Clojure with zippers (clojure.data.zip)Growing a DSL with ClojureHow to create a simple DSL with Clojure.Includes introductions to:MultimethodsHierarchiesMetaprogramming and the "Code as data" philosophyLicenseAll the content is distributed under the CC BY 3.0 license and are copyright their respective primary author(s).Tell Us What You Think!Please take a moment to tell us what you think about this guide on the Clojurians Slack #clojure-doc channel or the Clojure mailing list.Let us know what was unclear or what has not been covered. Maybe you do not like the guide style or grammar or discover spelling mistakes. Reader feedback is key to making the documentation better. « About || Getting Started »'''
