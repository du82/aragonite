full_description = "Clojure Community This guide covers:Online CommunitiesThe Official Clojure mailing listsIRC channelDocumentation sitesClojure User Groups around the globeConferences about or related to ClojureVarious Community sites about Clojure (subreddit, etc)This work is licensed under a Creative Commons Attribution 3.0 Unported License (including images & stylesheets). The source is available on Github.Online CommunitiesClojurians Slack -- currently the most active online community, generously sponsored by Salesforce (owners of Slack) -- self-signup at clojurians.net -- partial archive of channels (via @logbot on Slack)Clojurians Zulip -- free, open source community, includes an archive of most channels from the Clojurians Slack (via @zulip-mirror-bot on Slack)Clojure SubReddit -- r/Clojure -- the right-hand sidebar has links to many Clojure resourcesClojureVerse -- online forumClojure Q&A -- the official Clojure question and answer siteClojurians Discordclj.social -- a Clojure-specific Mastodon instanceClojure Camp -- aimed at Clojure beginners, this offers a fun community of mentors and fellow learners, via Discord, Meetup.com, and offers study groups, pairing, and 1:1 mentoringSee also the Clojure Discussion section on clojure.org for more online communitiesClojure Mailing ListClojure users mailing list -- this is the original and still occasionally active mailing list for Clojure usersClojure IRC Channels#clojure on Libera.ChatDocumentationOfficial clojure.org GuidesOfficial clojure.org Reference documentationOfficial clojure.org API documentationClojureDocs: Clojure API reference, with examplesClojure-Doc: Clojure tutorials, cookbooks, etcClojure API Cheatsheet (hosted on clojure.org)Community Clojure Style GuideClojure KoansGetClojure: Tens of thousands of searchable Clojure examples mined from all over the internet.BooksSee the list of books on clojure.orgCoursesSee the list of courses and training on clojure.orgUser GroupsThe list of Clojure User Groups around the worldHow to run your own Clojure User GroupVideos About ClojureVideos of talks about Clojure are often made available on InfoQ, and Clojure YouTube channel. In addition, here are some other video learning resources:Full Disclojure is a series of screencasts about ClojureClojure Concurrency TutorialClojure Inside Out from O'ReillyClojure Koans WalkthroughsEric NormandClojure Tutorials by Tim BaldridgePracticalli YouTube Channel -- including Learning Clojure with PracticalliPodcasts About ClojureCognicast by Craig Andera often discusses topics relevant to Clojure and ClojureScript.Clojure Design Club by Christoph Neumann and Nate Jones -- Functional Design in Clojure: Group therapy for recovering object-oriented developers.ClojureStream by Jacek Schae -- Explore unusually expressive programming language with Lisp roots that runs on JavaScript, Java Virtual Machine, and CLR.The REPL by Daniel Compton -- A weekly newsletter and podcast diving into Clojure programs and libraries.Lost In Lambduhhs by Jordan Miller -- Featuring interviews with a myriad of guests from all sectors of tech with a special focus on the languages Clojure and ClojurescriptParens of the Dead by Magnar Sveen and Christian Johansen -- A screencast series of zombie-themed games written with Clojure and ClojureScriptCode RepositoriesMost folks host their projects at GitHub, and most pure Clojure library distributions (with the exception of Contrib) are available at Clojars.WebsitesClojure.org: the official websitePlanet Clojure: aggregator of selected Clojure-related blog postsThe Clojure Toolbox: a categorized directory of libraries and tools for Clojure4Clojure: Clojure exercise problemsExercism.io: Peer-reviewed Clojure exercisesConferencesSee Community > Resources > Conferences on clojure.org.Email NewslettersClojure Gazette(def newsletter)WorkshopsClojureBridgeCore developmentSee the Clojure > Development on clojure.org for full details on how core development is handled.Most feat