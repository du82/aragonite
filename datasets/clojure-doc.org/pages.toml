title = "Clojure Guides: Ecosystem: Generating Documentation"
description = """
This guide notes some commonly-used tools for generating project
documentation.This work is licensed under a Creative Commons
Attribution 3.0 Unported License (including images &
stylesheets). The source is available on
Github."""
full_description = "Ecosystem: Generating Documentation This guide notes some commonly-used tools for generating project documentation.This work is licensed under a Creative Commons Attribution 3.0 Unported License (including images & stylesheets). The source is available on Github.OverviewProjects commonly (hopefully?) have at least two types of documentation:standalone Markdown-formatted docs in the project's doc directorydocstrings in the project's source code (in both ns and defn)There are a number of tools for generating handsome API docs from docstrings and other project metadata.cljdoc.orgProbably the most popular solution for generating and hosting API documentation for libraries in cljdoc.org. It can build documentation for any library released to Clojars, and lets you combine arbitrary articles alongside API docs generated from your source code. It also provides versioned documentation, so that every published version of your library can have its own set of documentation!As a library author considering using cljdoc.org, you will want to read their user guide for library authors.If you are building your library JAR file with the Clojure CLI and tools.build, you will want to read our tools.build cookbook -- in particular The Generated pom.xml File section, to ensure your JAR file's pom.xml file contains both <licenses> (required for publishing to Clojars) and <scm> (required for cljdoc.org to find your source code and build the documentation).CodoxIf you'd like to generate nice-looking HTML API docs for your library, directly into your project's doc directory, you may want to use Codox. Usage instructions are in the Codox README. Running Codox (either via the Clojure CLI or as a Leiningen plug-in) will create a doc subdirectory containing the resulting HTML.MarginaliaIf you'd like to render API docs side-by-side with the source code it's documenting, you may want to use Marginalia. Usage instructions are in the readme.It also has a Leiningen plugin. « Ecosystem: Web Development || Building Projects: tools.build and the Clojure CLI »"
