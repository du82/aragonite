["https://clojure-doc.org/articles/language/concurrency_and_parallelism"]
title = "Clojure Guides: Language: Concurrency and Parallelism"
description = "This guide covers:"
full_description = '''Language: Concurrency and Parallelism This guide covers:Clojure's identity/value separationClojure reference types and their concurrency semantics: atoms, refs, agents, varsDereferencingDelays, futures and promisesWatches and validatorsHow to use java.util.concurrent from ClojureOther approaches to concurrency available on the JVMOther topics related to concurrencyThis work is licensed under a Creative Commons Attribution 3.0 Unported License (including images & stylesheets). The source is available on Github.What Version of Clojure Does This Guide Cover?This guide covers Clojure 1.11.Before You Read This GuideThis is one of the most hardcore guides of the entire Clojure documentation project. It describes concepts that are simple but may seem foreign at first. These concepts are some of the key points of Clojure design. Understanding them may take some time for folks without a concurrent programming background. Don't let this learning curve discourage you.If some parts are not clear, please ask for clarification in the #clojure-doc channel on Slack (self-signup at clojurians.net) or file an issue on GitHub. We will work hard on making this guide easy to follow with edits and images to illustrate the concepts.Introduction and TerminologyBefore we get to the Clojure features related to concurrency, lets lay a foundation and briefly cover some terminology.TermDefinition This Guide UsesConcurrencyWhen multiple threads are making progress, whether it is via time-slicing or parallelismParallelismA condition that arises when at least two threads are executing simultaneously, e.g., on multiple cores or CPUs.Shared StateWhen multiple threads of execution need to mutate (modify) one or more pieces of program state (e.g., variables, identities)Mutable Data StructuresData structures that, when changed, are updated "in place"Immutable Data StructuresData structures that, when changed, produce new data structures (copies), possibly with optimizations such as internal structural sharingConcurrency HazardsConditions that occur in concurrent programs that prevent program from being correct (behaving the way its authors intended).Shared Mutable StateWhen shared state is made of mutable data structures. A ripe ground for concurrency hazards.There are many concurrency hazards, some of the most common and well known are:Concurrency HazardBrief DescriptionRace ConditionA condition when the outcome is dependent on timing or relative ordering of eventsDeadlockWhen two or more threads are waiting on each other to finish or release a shared resource, thus waiting forever and not making any progressLivelockWhen two or more threads are technically performing computation but not doing any useful work (not making progress), for example, because they endlessly pass a piece of data to each other but never actually process itStarvationWhen a thread is not given regular access to a shared resource and cannot make progress.These hazards are not exclusive to threads and can happen with OS processes, runtime processes and any other execution processes. They are also not specific to a particular runtime or VM (e.g., the JVM) or programming language. Admittedly, some languages make it significantly easier to write correct, safe concurrent programs, but none are completely immune to concurrency hazards. More often than not, concurrency hazards are algorithmic problems, languages just encourage or discourage certain practices and techniques.Thread-safe code is code that is always executed correctly and does not suffer from concurrency hazards even when executed concurrently from multiple threads.OverviewOne of Clojure design goals was to make concurrent programming easier. The thinking is that as modern CPUs add more and more cores and the number of CPUs is increasing as well, the biggest contributor to application throughput will come from making use of those resources.The key design decision was making Clojure data structures immutable (persistent) and separating the concepts of identity and value. The importance of immutability cannot be over-emphasized: immutable values can be safely shared between threads, eliminate many concurrency hazards, and ultimately make it easier for developers to reason about their programs.However, a language that only has immutable data structures and no way to change (mutate) program state is not very useful. The identity/value separation makes state mutations (e.g., incrementing a counter or adding an element to a list) possible in ways that have known guarantees with respect to concurrency. This separation largely eliminates the need for explicit use of locks, which is possible in Clojure but typically not necessary.To put it another way: "changing variables" in Clojure happens differently from many other languages; in ways that are predictable from the concurrency perspective and which eliminate many concurrency hazards.Next lets take a closer look to the identity/value separation.Identity/Value Separation ("on State and Identity")In Clojure, values are immutable. They never change. For example, a number is a value. A map {:language "Clojure"} is a value. A vector with 3 elements is a value.When you attempt to modify a value (a data structure), a new value is produced instead. These are known as persistent data structures (the word "persistent" has nothing to do with storing data on disk).An identity is a named entity (e.g., a list of active chat group members or a counter) that changes over time and at any given moment references a value. For example, the current value of a counter may be 42. After incrementing it, the value is 43 but it is still the same counter --- the same identity. This is different from, say, Java or Ruby, where variables serve as identities that (typically) point to a mutable value and which are modified in place.See also Values and Change: Clojure’s approach to Identity and State on clojure.org.Identities in Clojure can be of several types, known as reference types.Clojure Reference TypesOverviewIn Clojure's world view, concurrent operations can be roughly classified as coordinated or uncoordinated, and synchronous or asynchronous. Different reference types in Clojure have their own concurrency semantics and cover different kind of operations:CoordinatedUncoordinatedSynchronousRefsAtomsAsynchronous—AgentsCoordinatedAn operation that depends on cooperation from other operations (possibly, other operations at least do not interfere with it) in order to produce correct results. For example, a banking operation that involves more than one account. UncoordinatedAn operation that does not affect other operations in any way. For example, when downloading 100 Web pages concurrently, each operation does not affect the others. SynchronousWhen the caller's thread waits, blocks, or sleeps until it has access to a given resource or context.AsynchronousOperations that can be started or scheduled without blocking the caller's thread.One more reference type, vars, supports dynamic scoping and thread-local storage.AtomsAtoms are references that change atomically (changes become immediately visible to all threads, changes are guaranteed to be synchronized by the JVM). If you come from a Java background, atoms are basically atomic references from java.util.concurrent with a functional twist to them. Atoms are identities that implement synchronous, uncoordinated, atomic updates.Lets jump right in and demonstrate how atoms work using an example. We know that Clojure data structures are immutable by default. Adding an element to a collection really produces a new collection. In such case, how does one keep a shared list (say, of active connections to a server or recently crawled URLs) and mutate it in a thread-safe manner? We will demonstrate how to accomplish this with an atom.To create an atom, use the clojure.core/atom function. Its argument will serve as the atom's initial value:(def currently-connected (atom [])) The line above makes the atom currently-connected an empty vector. To access an atom's value, use clojure.core/deref or the @ reader form:(def currently-connected (atom [])) @currently-connected ;; ⇒ [] (deref currently-connected) ;; ⇒ [] currently-connected ;; ⇒ #object[clojure.lang.Atom 0x7499eac7 {:status :ready, :val []}] As the returned values demonstrate, the atom itself is a reference. To access its current value, you dereference it. Dereferencing will be covered in more detail later in this guide. For now, it is sufficient to say that dereferencing returns the current value of an atom. (Other Clojure reference types as well as a few specialized data structures can be dereferenced as well.)Locals can be atoms, too:(let [xs (atom [])] @xs) ;; ⇒ [] Now to the most interesting part: adding elements to the collection.To mutate an atom, we can use clojure.core/swap!.swap! takes an atom, a function and optionally some other args, swaps the current value of the atom to be the return value of calling the function with the current value of the atom and the args:(swap! currently-connected conj "chatty-joe") ;; ⇒ ["chatty-joe"] currently-connected ;; ⇒ #object[clojure.lang.Atom 0x7499eac7 {:status :ready, :val ["chatty-joe"]}] @currently-connected ;; ⇒ ["chatty-joe"] To demonstrate this graphically, initial atom state looks like this:and then we mutated it with swap!:For the readers familiar with the atomic types from the java.util.concurrent.atomic package, this should sound very familiar. The only difference is that instead of setting a value, atoms are mutated with a function. This is both because Clojure is a functional language and because with this approach, clojure.core/swap! can retry the operation safely. This implies that the function you provide to swap! is pure (has no side effects).Occasionally you will need to mutate the value of an atom the same way you would with atomic references in Java: by setting them to a specific value. This is what clojure.core/reset! does. It takes an atom and the new value:@currently-connected ;; ⇒ ["chatty-joe"] (reset! currently-connected []) ;; ⇒ [] @currently-connected ;; ⇒ [] reset! may be useful in test suites to reset an atom's state between test executions, but it should be used sparingly in your implementation code. Consider using swap! first.By using an impure swap! function, we can see how it can retry when there is contention:(let [a (atom 0) q (mapv #(future (swap! a (fn [n] (println %) (inc n)))) (range 10))] (mapv deref q)) This will return a vector of 10 values, 1 to 10, in some arbitrary order, and it will print the numbers 0 to 9 at least once each -- but probably print several of them more than once, indicating that swap! was retried.Summary and Use CasesAtoms is the most commonly used concurrent feature in Clojure. It covers many cases and lets developers avoid explicit locking. Atoms cover a lot of use cases and are very fast. It's fair to say that when you need uncoordinated reference types (e.g., not Software Transactional Memory), the rule of thumb is, "start with an atom, then see".It is not uncommon to initialize an atom in a local and then return it from the function and share a piece of state with other functions and/or threads.AgentsAgents are references that are updated asynchronously: updates happen at a later, unknown point in time, in a thread pool. Agents are identities that implement uncoordinated, asynchronous updates.A small but useful example of using an agent is as a counter. For example, suppose we want to track how often page downloads in a Web crawler respond with 40x and 50x status codes. The simplest version can look like this:(def errors-counter (agent 0)) ;; ⇒ #'user/errors-counter errors-counter ;; ⇒ #object[clojure.lang.Agent 0x45e6d1e0 {:status :ready, :val 0}] @errors-counter ;; ⇒ 0 (deref errors-counter) ;; ⇒ 0 One can immediately make several observations: just like atoms, agents are references. To get the current value of an agent, we need to dereference it using clojure.core/deref or the @agent reader macro.To mutate an agent, we use clojure.core/send and clojure.core/send-off:@errors-counter ;; ⇒ 0 (send errors-counter inc) ;; ⇒ #object[clojure.lang.Agent 0x45e6d1e0 {:status :ready, :val 0}] @errors-counter ;; ⇒ 1 ;; 10 is an additional parameter. The + function will be invoked as `(+ @errors-counter 10)`. (send errors-counter + 10) ;; ⇒ #object[clojure.lang.Agent 0x45e6d1e0 {:status :ready, :val 1}] @errors-counter ;; ⇒ 11 send and send-off are largely similar. The difference is in how they are implemented. send uses a fixed-size thread pool so using blocking operations with it won't yield good throughput. send-off uses a growing thread-pool so blocking operations is not a problem for it as long as there are resources available to the JVM to create and run all the threads. On a 4-8 GB machine with 4 cores and stock OS settings you can expect up to a couple of thousand I/O-bound threads to work without running the system out of kernel resources.Using Custom Executors With AgentsAgents can be used (and abused) for arbitrary code execution in a thread pool. Because the default thread pool Clojure maintains will not be a good fit for all use cases, Clojure provides a function that lets you control what thread pool (executor) is used by clojure.core/send: clojure.core/set-agent-send-executor!.(import java.util.concurrent.Executors) (set-agent-send-executor! (Executors/newFixedThreadPool 32)) ;; clojure.core/send now will use the fixed size thread pool with 32 threads The default thread pool size is number of available CPU cores + 2.clojure.core/set-agent-send-off-executor! is a similar function that controls what thread pool clojure.core/send-off will use.Finally, another useful function is clojure.core/send-via which is like clojure.core/send but lets you specify an executor to be used on a case-by-case basis:(import java.util.concurrent.Executors) (def custom-pool (Executors/newFixedThreadPool 32)) ;; just like clojure.core/send but will use custom-pool instead ;; of an internally maintained one (send-via custom-pool stream-agent inc) Agents and Software Transactional MemoryWe haven't introduced refs and the concept of Software Transactional Memory yet. It will be covered later in this guide. Here it's sufficient to mention that agents are STM-aware and can be safely used inside transactions.Agents and Error HandlingFunctions that modify an agent's state will not always return successfully in the real world. Sometimes they will fail. For example:@errors-counter ;; ⇒ 11 (send errors-counter / 0) ;; ⇒ #object[clojure.lang.Agent 0x45e6d1e0 {:status :ready, :val 11}] ;; evaluation will produce an exception This puts the agent into the failed state. Failed agents will re-raise the exception that caused them to fail every time their state changed is attempted:(send errors-counter / 0) ;; Execution error (ArithmeticException) at java.util.concurrent.ThreadPoolExecutor/runWorker (ThreadPoolExecutor.java:1144). ;; Di'''
