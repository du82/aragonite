["https://clojure-doc.org/articles/tutorials/getting_started_lein"]
title = "Clojure Guides: Getting Started with Clojure and Leiningen"
description = "This guide covers:"
full_description = '''Getting Started with Clojure and Leiningen OverviewTrying out the REPLYour first projectWorking in the REPLInteractive DevelopmentSee AlsoNext StopContributors This guide covers:prerequisites (such as Leiningen) and installingrunning the REPLcreating a projectinteractive developmentThis work is licensed under a Creative Commons Attribution 3.0 Unported License (including images & stylesheets). The source is available on Github.OverviewClojure is a wonderfully simple language and you are going to love it.To quickly get started, first make sure you've got Java installed.Then install the Leiningen project management tool.This author (jg) recommends always installing by downloading the script directly (as described in the instructions at leiningen.org), rather than using your OS's package manager. This will ensure that you get the latest lein version 2.Clojure programs are typically developed inside their own project directory, and Leiningen manages projects for you. Lein takes care of pulling in dependencies (including Clojure itself), running the REPL, running your program and its tests, packaging your program for distribution, and other administrative tasks. Run lein help to see the list of all the tasks it can perform.Again, there's no need to "install" Clojure, per se. Lein will take care of fetching it for you.Trying out the REPLAlthough lein facilitates managing your projects, you can also run it on its own (outside of any particular project directory). Once you have the lein tool installed, run it from anywhere you like to get a repl:$ lein repl You should be greeted with a "user=>" prompt. Try it out:user=> (+ 1 1) ;; ⇒ 2 user=> (distinct [:a :b :a :c :a :d]) ;; ⇒ (:a :b :c :d) user=> (dotimes [i 3] #_=> (println (rand-nth ["Fabulous!" "Marvelous!" "Inconceivable!"]) #_=> i)) ;; Marvelous! 0 ;; Inconceivable! 1 ;; Fabulous! 2 ;; ⇒ nil Your first projectCreate your first Clojure program like so:lein new app my-proj cd my-proj # Have a look at the "-main" function in src/my_proj/core.clj. lein run and see the output from that println function call in my_proj/core.clj!Working in the REPLIn your project directory, start up a repl (lein repl) and run your -main function to see its output in the repl:$ lein repl ... my-proj.core=> (-main) Hello, World! nil (The prompt is now "my-proj.core=>" instead of "user=>" because lein has started the repl in an app project. More about that ("namespaces") in the topical guides.)From elsewhere, open up your my-proj/src/my_proj/core.clj file in your editor. Modify the text in that println call.Back in the repl, reload your source file and run -main again:my-proj.core=> (require 'my-proj.core :reload) my-proj.core=> (-main) to see your changes.Interactive DevelopmentWhile you can work with the REPL as shown above for small projects while you are getting started, the real benefits of Clojure's "interactive development" mindset require an approach that more tightly integrates your editor with a running REPL.Most Clojure-enabled editors have a way to automatically start a REPL for a Leiningen project and connect to it in such a way that you can evaluate code directly inside your editor, allowing you to "grow" your program incrementally while testing each piece of it and exploring how code works, alongside your running program.It's common to use comment as a way to include exploratory code in your source files, so you can evaluate calls to functions and experiment with data transformations:(defn greet "Return a greeting for this person." [person] (str "Hello, " person "!")) (comment ;; Clojure-enabled editors let you easily evaluate these two ;; expressions and will usually show the results inline, so ;; you don't need to switch back and forth between your editor ;; and a separate window running a REPL, and you don't need to ;; copy'n'paste code from the editor into the REPL or type ;; directly into the REPL -- and these comment forms can be left ;; in your code to show how you arrived at the final solution ;; (or remind your future self how you got there!). (greet "Programmer") ; "Hello, Programmer!" (greet nil) ; "Hello, !" ) These are sometimes called "Rich Comment Forms" because not only can they be a rich source of infomation about how the code works or how it was developed, but also because Rich Hickey, Clojure's creator, uses this approach quite a lot in his own code.See AlsoOther getting started documentation you might find useful:Learn Clojure: the official guide to learning the languageProgramming at the REPL: the official guide to working with the REPLClojure EditorsClojure Distilled: introduction to core concepts necessary for working with ClojureNext StopNext stop: the basic Clojure language tutorial.ContributorsJohn Gabriele jmg3000@gmail.com (original author)'''
