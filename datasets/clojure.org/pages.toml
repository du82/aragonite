["https://clojure.org/stories/swing"]
title = "Clojure - Swing Education"
full_description = 'Swing Education has been working with Clojure and Clojurescript since being founded in early 2015. Personally I’ve been working with Clojure since late 2013. Our current engineering team currently consist of three full-time engineers. Our codebase is essentially 100% Clojure. We are actively hiring for Q1 2018 and hope to grow the team to five engineers and one person that is more designer/UI-UX-focused but will still likely end up working with Clojure. Our primary product is an online marketplace for schools to issue requests for subsitute teachers. We help schools access more subs and try to automate via software tedious work associated with managing a pool of substitute teachers (recruiting, screening, payroll, etc.). Our network provides subs with a wider range of work opportunities to gain experience and build their professional network. Strictly speaking perhaps not a library, but regardless Datomic has been extremely enjoyable to work with. A small subset of the highlights: Being able to treat the database as a value has made most of our code extremely deterministic and removes many different classes of potential errors due to "oh this value changed during execution" since the db value is consistent. d/transact returns the resulting db value after transacting which removes issues that traditionally occur with reads after writes with read-replicas. tx-data being represented as simple vectors and maps allows us to compose transactions elegantly and makes it much easier to programatically generate code that either creates or modifies multiple entities at once. The transaction listener queue is an elegant way to listen for data changes that require notifications to get triggered without tight coupling to the point at which the transaction was executed. If our notification process needs to shut-down or restart, we can use d/tx-log to walk through the log again (lazily no less!) from our last known notification point. d/as-of and d/since have been used to help time-travel to understand what a user was seeing at a particular time or what the system saw when it was executing. Both bugs and correct behavior have been confirmed this way in production when used in combination with code that expects the database as an argument.'
year_published = 2025
clearnet = "https://clojure.org/stories/swing"
