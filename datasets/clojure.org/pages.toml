["https://clojure.org/guides/weird_characters"]
title = "Clojure - Reading Clojure Characters"
description = "A guide to weird characters you might encounter reading Clojure code and what they mean."
full_description = '''; anonymous function taking a single argument and printing it (fn [line] (println line)) ; anonymous function taking a single argument and printing it - shorthand #(println %) user=> (macroexpand `#(println %)) (fn* [arg] (clojure.core/println arg)) ; argument names shortened for clarity user=> (read-string "#'foo") (var foo) user=> (def nine 9) #'user/nine user=> nine 9 user=> (var nine) #'user/nine user=> #'nine #'user/nine user=> (type #inst "2014-05-19T19:12:37.925-00:00") java.util.Date ;; this is host dependent user=> (read-string "#inst \"2014-05-19T19:12:37.925-00:00\"") #inst "2014-05-19T19:12:37.925-00:00" user=> (#(println %1 %2) "Hello " "Clojure") Hello Clojure ; takes 2 args user=> (macroexpand `#(println %1 %2)) (fn* [arg1 arg2] (clojure.core/println arg1 arg2)) ; takes 2 args user=> (#(println %4) "Hello " "Clojure " ", Thank " "You!!") You!! ; takes 4 args, doesn't use first 3 args user=> (macroexpand `#(println %4)) (fn* [arg1 arg2 arg3 arg4] (clojure.core/println arg4)) ; takes 4 args doesn't use 3 user=> (macroexpand `#(println % %1)) ; use both % and %1 (fn* [arg1] (clojure.core/println arg1 arg1)) ; still only takes 1 argument user=> (#(println %&) "Hello " "Clojure " ", Thank " "You!!") (Hello Clojure , Thank You!! ) ; takes n args user=> (macroexpand '#(println %&)) (fn* [& rest__11#] (println rest__11#)) user=> (def ^{:debug true} five 5) #'user/five user=> (meta #'five) {:ns #<Namespace user>, :name five, :column 1, :debug true, :line 1, :file "NO_SOURCE_PATH"} user=> (def ^:debug five 5) #'user/five user=> (meta #'five) {:ns #<Namespace user>, :name five, :column 1, :debug true, :line 1, :file "NO_SOURCE_PATH"} user=> (def ^Integer five 5) #'user/five user=> (meta #'five) {:ns #<Namespace user>, :name five, :column 1, :line 1, :file "NO_SOURCE_PATH", :tag java.lang.Integer} user=> (def ^Integer ^:debug ^:private five 5) #'user/five user=> (meta #'five) {:ns #<Namespace user>, :name five, :column 1, :private true, :debug true, :line 1, :file "NO_SOURCE_PATH", :tag java.lang.Integer}'''
