["https://clojure.org/dev/workflow"]
title = "Clojure - Workflow"
full_description = 'This page describes the overall workflow for how tickets (bugs and enhancement requests) make their way through the JIRA ticketing system and ultimately become part of Clojure, ClojureScript, and ClojureCLR. Anyone - anyone can submit a bug or enhancement request to Clojure once you have created a Clojure JIRA account Contributors - anyone that has signed the contributor agreement can supply patches or work on improving tickets Screeners - a smaller group of trusted individuals have been granted the ability to move tickets through (some of) the stages of the process, in particular the Triage and Screening activities BDFL - Rich Hickey is the creator and Benevolent Dictator for Life of what goes into Clojure. Stuart Halloway also has a special level of access and typically commits patches to Clojure. There are several important fields on a ticket that jointly determine it’s "state" in the workflow below. Some key fields to know about: JIRA status- these govern the default JIRA workflow and consist of Open, In progress, Reopened, Resolved, Closed The Clojure workflow does not really distinguish between these much other than general open/closed differentiation The diagram below documents the process used for how tickets make their way through the system. The rounded boxes represent states in the workflow. They have well defined criteria (which sometimes cover multiple fields) such that each of these states can have a report. In general, a single line state indicates the Approval state. If additional fields are in play, they are listed after the state. The colored blocks represent activities performed by different groups - the colors correspond to the group (Orange = contributors, Blue = screeners, Green = BDFL). Diamonds represent decisions to be made during an activity. Activities are described in more detail below the diagram. Goal: decide whether the bug or enhancement described in the ticket is actually a real bug or enhancement. Is the ticket about 1 thing? If not, then either split the ticket yourself or ask the submitter to do so.'
year_published = 2025
clearnet = "https://clojure.org/dev/workflow"
