["https://clojure.org/stories/ona"]
title = "Clojure - Ona"
full_description = "Ona has been working with Clojure and ClojureScript for three years. We started using it when we built an updated version of the front-end to our data collection and management platform. I was introduced to Clojure about five years ago through Cascalog. I’ve had an affinity for LISPs ever since learning it in undergrad and using it in a genetic programming research project that generated s-expressions to evolve an agent communication language. At any one time we have about 4-6 team members working full-time on projects in Clojure and ClojureScript; this comes out to about a third of our engineering team. We use a number of different editors, including Meow, an emacs config created by one of our engineers. We are building a data collection, management, and visualization platform targeted at humanitarian and international development organizations. These organizations, e.g. the World Food Program and UNICEF, use our platform to conduct on-going surveys in the field. Field data is merged with historic data in real-time to construct a comprehensive view of projects they have invested in or are running. This allows organizations to see problems as they occur and make adjustments, e.g. directing health workers to understaffed clinics or inspectors to buildings with more severe damage. The Clojure and ClojureScript component is a stateless layer with all data persistence and retrieval mediated through our API client, Milia, and visualization in our ClojureScript data viewers, Hatti and Vega-viewer. On the Clojure side, we’ve benefited a lot from the Ring middleware Optimus, which bundles and optimizes all our assets. On the ClojureScript side, we were early adopters of Om and use it extensively to render reactive views. We use it with Hiccup-based markup, some of which is shared with Clojure (we’d like to share more). For libraries we use in both Clojure and ClojureScript, we make heavy use of the i18n library Tempura combined with custom helpers to load all text from translation files. We also run a lot of static analyzers in our build step including Kibit and Bikeshed to catch duplication and enforce uniform code-style."
year_published = 2025
clearnet = "https://clojure.org/stories/ona"
