["https://clojure.org/news/2012/05/15/anatomy-of-reducer"]
title = "Clojure - Anatomy of a Reducer"
full_description = "(defn mapping [f] (fn [f1] (fn [result input] (f1 result (f input))))) (defn filtering [pred] (fn [f1] (fn [result input] (if (pred input) (f1 result input) result)))) (defn mapcatting [f] (fn [f1] (fn [result input] (reduce f1 result (f input))))) (defn reducer ([coll xf] (reify clojure.core.protocols/CollReduce (coll-reduce [_ f1 init] (clojure.core.protocols/coll-reduce coll (xf f1) init))))) (defn rmap [f coll] (reducer coll (mapping f))) (defn rfilter [pred coll] (reducer coll (filtering pred))) (defn rmapcat [f coll] (reducer coll (mapcatting f))) (reduce + 0 (rmap inc [1 2 3 4])) ;=> 14 (reduce + 0 (rfilter even? [1 2 3 4])) ;=> 6 (reduce + 0 (rmapcat range [1 2 3 4 5])) ;=> 20 (defn folder ([coll xf] (reify ;;extend CollReduce as before CollFold (coll-fold [_ n combinef reducef] (coll-fold coll n combinef (xf reducef)))))) (defn rmap [f coll] (folder coll (mapping f))) (defn rfilter [pred coll] (folder coll (filtering pred))) (defn rmapcat [f coll] (folder coll (mapcatting f)))"
