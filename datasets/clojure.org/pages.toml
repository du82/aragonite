["https://clojure.org/stories/empear"]
title = "Clojure - Empear"
full_description = 'This interview is a discussion with Adam Tornhill about Empear and their code analysis tool CodeScene. Empear launched in 2015 and we used Clojure from the start. Prior to that I used Clojure for some of my side projects. Clojure was a natural step. I’ve been a big fan of Lisp for a decade and to be able to use a Lisp together with the ecosystem of the JVM was attractive. We’re three developers at the moment and look to expand. All of us code in Clojure on a daily basis. We also have a few small components written in Haskell and Python. Our main product is CodeScene. CodeScene is a tool that helps software projects improve their efficiency by identifying and prioritizing technical debt. We take a different approach to software analysis since we base the results on behavioral and social data. Our main data source is version-control repositories, which CodeScene views as a behavioral log of how the developers interact with the codebase. This means we can prioritize based on how the system grows and also include a social dimension of code that lets our customers discover team productivity bottlenecks and save on- and off-boarding costs. We maintain two versions of CodeScene. One is our cloud version, https://codescene.io/, which is the analyses as a service. The other is our on-premises version of CodeScene, which our customers install in their own data centers. The nature of Clojure and its tight integration with Java makes using Clojure libraries more of an optional convenience. Some high-quality libraries that we enjoy are Carmine, Timbre, and Cheshire. We also found Ragtime helpful for database migrations. In addition, we use several libraries for statistics and machine learning, although we often end-up implementing our core algorithms ourselves. The most rewarding aspect of Clojure is that the language lets you focus on the problem domain. "What does the data look like? How should we filter and transform it before we pass it on? Let’s run this in the REPL and see what happens. OK, now put that in a function. Write a spec for it and stabilize it with tests." That workflow ties in really nice to how human problem solving works. In practice it lets us implement new features at a rapid pace.'
