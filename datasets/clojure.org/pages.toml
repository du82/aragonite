["https://clojure.org/guides/async_walkthrough"]
title = "Clojure - core.async Walkthrough"
full_description = '{:deps {org.clojure/clojure {:mvn/version "1.12.0"} org.clojure/core.async {:mvn/version "1.6.673"}}} ;; Use `dropping-buffer` to drop newest values when the buffer is full: (a/chan (a/dropping-buffer 10)) ;; Use `sliding-buffer` to drop oldest values when the buffer is full: (a/chan (a/sliding-buffer 10)) (let [c1 (a/chan) c2 (a/chan)] (a/thread (while true (let [[v ch] (a/alts!! [c1 c2])] (println "Read" v "from" ch)))) (>!! c1 "hi") (>!! c2 "there")) Read hi from #object[clojure.core.async.impl.channels.ManyToManyChannel ...] Read there from #object[clojure.core.async.impl.channels.ManyToManyChannel ...] (let [c1 (a/chan) c2 (a/chan)] (a/go (while true (let [[v ch] (a/alts! [c1 c2])] (println "Read" v "from" ch)))) (a/go (>! c1 "hi")) (a/go (>! c2 "there"))) (let [n 1000 cs (repeatedly n a/chan) begin (System/currentTimeMillis)] (doseq [c cs] (a/go (>! c "hi"))) (dotimes [i n] (let [[v c] (a/alts!! cs)] (assert (= "hi" v)))) (println "Read" n "msgs in" (- (System/currentTimeMillis) begin) "ms")) (let [t (a/timeout 100) begin (System/currentTimeMillis)] (<!! t) (println "Waited" (- (System/currentTimeMillis) begin))) (let [c (a/chan) begin (System/currentTimeMillis)] (a/alts!! [c (a/timeout 100)]) (println "Gave up after" (- (System/currentTimeMillis) begin)))'
