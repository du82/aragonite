["https://clojure.org/stories/zimpler"]
title = "Clojure - Zimpler"
full_description = "We started working with ClojureScript in 2015 and Clojure from 2016. Today we see it as our main language moving forward. Today we are 12 people working in Clojure/ClojureScript but we are constantly looking to grow the team further. Zimpler is a payment solution. All user facing part of the product, such as the checkout is written in ClojureScript. Most of the future applications will be written in Clojure/ClojureScript. For ClojureScript, Reagent and re-frame are just really nice to work with, enabling to express complex logic in a very simple way. On the backend side, HugSQL is also a very neat library allowing us to write SQL queries without adding unnecessary layers of complexity. Namespaces and immutability by default makes everything more explicit and allows us to understand where everything is coming from. This in turns allows us to collaborate more easily and iterate faster. Also thanks to the seamless interop with Java and JavaScript, we have access to a large ecosystem of well tested libraries, making Clojure(Script) a safe bet. The focus on values and a REPL driven development makes for a very interactive experience that many of us enjoy. In the front-end, reagent + re-frame for all our apps. In the backend, we have a large Ruby codebase and a growing number of Clojure projects, with a bit of Haskell (gasp!) here and there. Besides the technological benefits discussed above, we also really like being a part of the Clojure community where we feel that we share a lot of common values. As a result of this we have had the fortune to be able to help out supporting both conferences such as EuroClojure and also local communities like Got.lambda in Gothenburg and ClojureBridge in Berlin."
year_published = 2025
