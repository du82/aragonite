["https://clojure.org/guides/dev_startup_time"]
title = "Clojure - Improving Development Startup Time"
full_description = "(binding [*compile-files* true] ;; compile during load (require 'user :reload-all)) ;; reload this and all transitively loaded namespaces You can use compile on the namespace you load when you start development, or on your user.clj, or on the main namespace you run as a server to improve your startup time The compile function takes a namespace symbol and compiles that namespace and all the namespaces it requires into *compile-path* (which defaults to classes). That directory must exist and be on your classpath: Subsequently, when any of those compiled namespaces are required, the class file will be loaded, rather than the original .clj file. If a source file is updated (and thus newer), it will be loaded instead. Periodically, you will need to re-compile to account for new dependencies or changing code. Note that compilation is a side effect of loading, so has no effect on already loaded namespaces. In particular, one special case is the user.clj file, which is loaded automatically by the Clojure runtime. If you are using a user.clj in dev (or need to compile namespaces that are already compiled), you can do so by forcing a reload while compiling: That’s it! This technique can substantially reduce your startup time during development, particularly as the number of dependencies you load increases. In a deps.edn project, you should create a development alias (like :dev) that includes the classes directory: You will also need to ensure the classes directory exists. It may be useful to include the empty classes directory as part of your version controlled project structure (make sure to ignore and NOT include the compiled .class files). You can then start your REPL with the alias and compile to populate your classes directory and start seeing the benefits: If you want to use an automatically loaded user.clj, you should incorporate that into your dev alias by adding a source path dev:"
year_published = 2025
clearnet = "https://clojure.org/guides/dev_startup_time"
