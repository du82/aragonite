["https://clojure.org/guides/install_clojure"]
title = "Clojure - Install Clojure"
full_description = '''curl -L -O https://github.com/clojure/brew-install/releases/latest/download/linux-install.sh chmod +x linux-install.sh sudo ./linux-install.sh curl -L -O https://github.com/clojure/brew-install/releases/latest/download/posix-install.sh chmod +x posix-install.sh sudo ./posix-install.sh echo 'export PATH="/Library/Java/JavaVirtualMachines/temurin-21.jdk/Contents/Home/bin:$PATH"' >> ~/.zshrc Clojure (the language) is provided as a Java ARchive (JAR) file, available in the Maven Central Repository, a public repository for JVM-based artifacts. If needed, you can find more detailed version information on the Releases page. This page concerns the command-line tool (the Clojure CLI). This tool (used by the commands clojure and clj) can download Clojure itself and other Clojure or JVM-based libraries. Any version of the Clojure CLI can download or use any version of the Clojure language itself (they are independent). The version numbers of the language and the CLI are separate but related. The Clojure language has a 3 part-version (like 1.12.0) and the Clojure CLI has a 4-part version (like 1.12.0.1456). The leading 3 parts of the CLI version indicate which version of the Clojure language will be used by default in a REPL, unless you specify otherwise in the deps.edn configuration file. Use the linux-install script to download and run the install, which will create the executables /usr/local/bin/clj, /usr/local/bin/clojure, and the directory /usr/local/lib/clojure: A POSIX version of the linux installer is now available as well. This installer should work on Linux, BSD, and even Mac (but will conflict with brew!) Use the posix-install script to download and run the install, which will create the executables /usr/local/bin/clj, /usr/local/bin/clojure, and the directory /usr/local/lib/clojure: If you are not yet using WSL (Windows Subsystem for Linux), this is recommended as it will provide the closest match for most existing Clojure tutorials and documentation. Alternately, you can use clj-msi to install clojure.exe on your system, which can be used in similar ways to the clojure script installed in the other approaches above.'''
