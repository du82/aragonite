["https://clojure.org/dev/screening_tickets"]
title = "Clojure - Screening Tickets"
full_description = 'If you’re interested in supplying patches or contributing to Clojure, please see the development overview. The job of screening is to create a high quality stream of problems and proposed solutions so that the BDFL can efficiently review consider them for inclusion. While this page uses the generic term "screening", there are really several specific places in the steps in the workflow where the community and Clojure core team can provide value: These different processses vary in their focus, but share the common goal of making a ticket that tells a good story about the problem encountered, the solutions considered, and the final chosen approach with a patch. A ticket marked as a bug in JIRA should describe a problem where Clojure is operating incorrectly, usually producing an incorrect result according to the docstring or other documentation. A good JIRA bug should have: A summary (title) that describes the problem (not a proposed solution) and a description that includes all of the following that are applicable: Symptoms - what the user sees that indicates a problem - often this starts at the top but might be moved into a comment for historical preservation as we understand the actual problem The expectation is that a new reader of this ticket should be able to read this ticket top down and understand why this bug was filed, the problem, the thinking around ways to fix, and the solution chosen in the patch. Improvement tickets should be generally similar to "bug" tickets but will likely lack a repro as this is asking for an enhancement. The main thing you should focus on is why this enhancement is important or worth having. In general, we focus on enahancements that give users new capabilities that they need to accomplish a goal, so state what you want to do and why it can’t be done with the existing capability. The line between "improvement" and "new feature" is somewhat fuzzy, don’t stress about it too much. If proposing a function or utility that already exists in the wild (in popular utility libraries), the ticket should include research about existing implementations - how do they differ, how popular are they, how performant are they, etc.'
year_published = 2025
clearnet = "https://clojure.org/dev/screening_tickets"
