["https://clojure.org/guides/core_async_go"]
title = "Clojure - Go Block Best Practices"
full_description = '(defn http-call "Makes an async call to a web browser" [url callback] ...) (def urls [url1 url2 url3]) (defn load-urls "Spools the results of loading several urls onto a channel. does this without creating temporary channels or go blocks" [urls out-c] (http-call (first urls) (fn [response] (put! out-c response (fn [_] (load-urls (next urls) out-c)))))) (load-urls urls response-chan) Also, if the code is being called inside a callback and you want to respect back-pressure, it’s fairly easy to use a recursive function along with put! to respect back-pressure. In this example we have some nice clean interop code that allows us to start working with channels in our app, without creating tons of channels or gos only to dispose of them shortly after they’re created. Keep in mind that it is important to respect back-pressure. A general principle in core.async is that unbounded queues are bad and the number of pending puts is limited (currently to 1024). Another option is to use a channel with a buffer that always accepts puts immediately, such as dropping-buffer or sliding-buffer. The go macro stops translating at function creation boundaries. This means the following code will fail to compile, or may just throw a runtime error stating that <! was used outside of a go block: This is one thing to remember since many Clojure constructs create functions inside macros. The following are examples of code that will not work as one would expect: Unfortunately, currently there isn’t a good way to know if a given macro will work as expected inside a go block unless one either looks at the source, or tests the code generated by the macro. The best explanation for "why does go block translation stop at function creation?" basically comes down to a question of types. Examine the following snippet: We can easily see that this produces a seq of strings since the output type of str is a string. So what is the return type of async/<!? In the context of a go block it is an object taken from a channel. But the go block has to translate that to a parking call to async/put!. The return type of async/<! should really be thought of as something akin to Async<Object> or Promise<Object>. Thus the result of (map async/<! chans) is something like "a seq of pending channel operations" which makes no sense at all.'
year_published = 2025
clearnet = "https://clojure.org/guides/core_async_go"
