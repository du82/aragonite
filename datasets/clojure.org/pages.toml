["https://clojure.org/stories/freshcode"]
title = "Clojure - Freshcode"
full_description = "Freshcode has been using Clojure since 2013 and we never were disappointed. We help SMBs to achieve Clojure’s unique approaches which we sincerely appreciate. We started developing our own product in Clojure in January 2013. It was an eCommerce platform for smart buying — the choice was between Clojure and Ruby on Rails, and our founder decided to go with Clojure as it offered concise syntax, speed of development, and a new paradigm. One year later we won our first commercial client in Clojure from Australia. As early as January 2015, our Clojure team grew to 4 people and we integrated Clojure into 3 of our projects as it was fit to solve specific tasks and challenges. 2016 — through the year we’ve worked with 3 clients for education, politics, and e-commerce. Next year we embarked on a project for a biotechnology company and have grown to have 6 team members. Nov 2019 — another product in finance in our portfolio and the team rises to 11 people and combined experience of more than 100 years in Clojure. In March 2020 we started a Clojure and functional programming community in our city and we keep growing it. We talked to one of our Clojure developers, Vladimir Pavlyuk, about how he uses Clojure and ClojureScript at Freshcode. There are a couple of them. I love Reagent, as it allows me to easily manage React state using native ClojureScript atom API. kee-frame is another library I believe I would prefer to go, especially for route management. It’s probably working with a highly skilled community, which acts like a small family of people loving what they’re doing. Still it’s much more to learn from them. As I got used to implement web-servers & clients, my stack mostly includes Clojurescript + reagent, re-frame, reitit on the front end, and Clojure + http-kit, tolitius/mount, bidi on the backend. Got used to work with honeysql and HugSQL libraries. It’s quite easy to start an app using Clojure, as long as you are aware with its syntax. Clojure does not force you to stick to a certain paradigm, as Java tries to do; however you can use all JVM facilities. It is easier to code, but still is a powerful instrument. Besides, macros allow creating custom DSLs, to facilitate project interaction with your business partners."
