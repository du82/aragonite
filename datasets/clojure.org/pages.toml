["https://clojure.org/stories/kidblog"]
title = "Clojure - Kidblog"
full_description = "Kidblog has been using Clojure in production since 2013 when we refactored our Java REST api to use an early version of Compojure. Kidblog provides safe student publishing for K-12 teachers and schools in over 70 countries around the world. Our web-based blogging platform offers teachers unique privacy and moderation tools, while giving students an opportunity to share their voice with an authentic audience. Persistent data structures reduce cognitive load and eliminate an entire class of errors caused by mutation. REPL-driven development provides immediate feedback and is more enjoyable, helping us rapidly deliver features to customers. Java interop lets us leverage existing libraries and benefit from the maturity of the JVM. The standard library is built around simple, powerful, and composable data manipulation functions. Overall, Clojure makes our code more enjoyable to write, pleasant to read, and easier to review."
