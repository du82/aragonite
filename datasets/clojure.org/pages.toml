["https://clojure.org/dev/creating_tickets"]
title = "Clojure - Creating Tickets"
full_description = "Adding odd numbers doesn't work. ---- user> (+ 2 2) 4 user> (+ 1 3) ClassCastException ---- Cause: Never implemented odd number adding in the Compiler! See the missing branch in FooExpr. Solution: Fully implemented the branch for odd numbers to be just like even numbers. Considered just getting rid of addition altogether but I guess people use it. Patch: add-odd-3.patch If you do not have a JIRA account, please follow the preferred process for filing an issue at ask.clojure.org. If you’re interested in supplying patches or contributing to Clojure, please see the development overview. To create a ticket, you must already have a Clojure JIRA account. Issues for Clojure itself can be created in the CLJ project. Contrib projects will have a link to their JIRA project in the README. Type: Correct categorization as Defect, Enhancement (extension of existing feature), or Feature (new) (If Defect) Reproducible demonstration of problem (commands that can be duplicated in a repl are preferred, particularly a plain Clojure repl, not a Leiningen repl), and a description of what you think should happen instead Priority: categorize based on impact and whether this is a theoretical issue or one actually encountered in real code. This may be adjusted by the core team during triage. A description of the changes in the patch - anything you can do to illuminate what the changes are and why you made them will help ticket screeners as they re-walk your steps. This is an example of how the description might look once a ticket has gone through screening - it starts with a succinct description of the problem and a demonstration that can be tried at the REPL. That may be all that exists when the ticket comes into the system. By the time it gets through screening, we should expect to see the dev’s analysis of the cause of the problem, the solution that is being offered (and possibly alternatives that were considered), and the patch currently implementing the solution and test. As work progresses on a ticket, it is common for it to accumulate discussion between submitter, screeners, and patch developers. As this occurs, it is essential to edit the ticket description to stay up to date as a summary of the essential problem, solution approach, and patch. It should not be necessary to read the the full ticket history to evaluate the patch."
