title = "Clojure - Functional Programming"
full_description = ''';trumped-up example (defn argcount ([] 0) ([x] 1) ([x y] 2) ([x y & more] (+ (argcount x y) (count more)))) -> #'user/argcount (argcount) -> 0 (argcount 1) -> 1 (argcount 1 2) -> 2 (argcount 1 2 3 4 5) -> 5 (let [my-vector [1 2 3 4] my-map {:fred "ethel"} my-list (list 4 3 2 1)] (list (conj my-vector 5) (assoc my-map :ricky "lucy") (conj my-list 5) ;the originals are intact my-vector my-map my-list)) -> ([1 2 3 4 5] {:ricky "lucy", :fred "ethel"} (5 4 3 2 1) [1 2 3 4] {:fred "ethel"} (4 3 2 1)) (def v [1 2 3]) (def attributed-v (with-meta v {:source :trusted})) (:source (meta attributed-v)) -> :trusted (= v attributed-v) -> true (let [my-vector [1 2 3 4] my-map {:fred "ethel" :ricky "lucy"} my-list (list 4 3 2 1)] [(first my-vector) (rest my-vector) (keys my-map) (vals my-map) (first my-list) (rest my-list)]) -> [1 (2 3 4) (:ricky :fred) ("lucy" "ethel") 4 (3 2 1)] (defn take [n coll] (lazy-seq (when (pos? n) (when-let [s (seq coll)] (cons (first s) (take (dec n) (rest s))))))) (defn my-zipmap [keys vals] (loop [my-map {} my-keys (seq keys) my-vals (seq vals)] (if (and my-keys my-vals) (recur (assoc my-map (first my-keys) (first my-vals)) (next my-keys) (next my-vals)) my-map))) (my-zipmap [:a :b :c] [1 2 3]) -> {:b 2, :c 3, :a 1}'''
