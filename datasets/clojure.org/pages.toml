["https://clojure.org/news/2014/08/06/transducers-are-coming"]
title = "Clojure - Transducers are Coming"
full_description = "Transducers are a powerful and composable way to build algorithmic transformations that you can reuse in many contexts, and they’re coming to Clojure core and core.async. Two years ago, in a blog post describing how reducers work, I described the reducing function transformers on which they were based, and provided explicit examples like mapping, filtering and mapcatting. Because the reducers library intends to deliver an API with the same 'shape' as existing sequence function APIs, these transformers were never exposed a la carte, instead being encapsulated by the macrology of reducers. In working recently on providing algorithmic combinators for core.async, I became more and more convinced of the superiority of reducing function transformers over channel→channel functions for algorithmic transformation. In fact, I think they are a better way to do many things for which we normally create bespoke replicas of map, filter etc. So, reducing function transformers are getting a name - transducers, and first-class support in Clojure core and core.async. A reducing function is just the kind of function you’d pass to reduce - it takes a result so far and a new input and returns the next result-so-far. In the context of transducers it’s best to think about this most generally: The primary power of transducers comes from their fundamental decoupling - they don’t care (or know about): The other source of power comes from the fact that transducers compose using ordinary function composition. The reducers library leverages transducers' decoupling from the job, the representation, and the source of inputs to accomplish parallel reduction. But transducers can also be used for: Concretely, most of the core sequence functions are gaining a new arity, one shorter than their current shortest, which elides the final collection source argument. This arity will return a transducer that represents the same logic, independent of lazy sequence processing. One way to think of transducers is like →> but independent of the job (lazy sequence creation) and the source of inputs (aseq)."
year_published = 2025
clearnet = "https://clojure.org/news/2014/08/06/transducers-are-coming"
