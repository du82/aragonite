["https://clojure.org/stories/cognician"]
title = "Clojure - Cognician"
full_description = "At that point, Cognician had spent a couple of years proving that we had something worth building a business around, and then we actually had to build that business. Our previous stack was a Flash/AIR app (remember those?) with a PHP/SQL backend. I had built enough of those sorts of apps to know that I wasn’t smart enough or skilled enough to build large OO projects that scaled well. I knew I needed a fresh perspective. Thanks to clojurebook.com and several great talks by Rich and the fantastic folks in the Clojure IRC channel and Google Groups, I had enough support to switch paradigms and learn to program all over again. It’s nearly seven years later, and I’m utterly convinced we wouldn’t still be in business if we had chosen something more traditional. Cognician aims to provide delightful, life-changing learning experiences to people in the world of work all over the world. The platform and the learning experiences it enables are built on the idea that people are capable of great things when their behavior is inspired by powerful ideas and deeply felt emotions. At its heart, Cognician is a digital coaching SaaS platform. You could think of it as ‘the Socratic method, at scale.’ We’ve built a catalog of learning experiences, the components that make up these experiences, and a platform that allows us to configure these experiences to suit our clients’ learning needs. Datomic has been tremendous fun to learn, to use, and to teach. It’s such a fitting design for the problems it solves for, and it’s a great pleasure to work with. Concurrency – our web server instances only share browser cookies, and Datomic. Our backend services only share the Datomic database with the web servers. Programming with databases as values has made doing all of this a pleasure. View caching – we haven’t had to worry about this at all since every view on our system is rendered live from source data! The data orientation of Clojure forces you to deal with naming things properly, which in turn forces you to deal with understanding your domain well. Its composable nature allows you to decide when to use the tools that support the definition of data vs. the implementation of behavior, rather than forcing you to use ‘The One True Way.’"
year_published = 2025
clearnet = "https://clojure.org/stories/cognician"
