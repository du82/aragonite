["https://clojure.org/stories/uhn"]
title = "Clojure - University Health Network"
full_description = "This interview is a discussion with Dmitri Sotnikov about his use of Clojure and ClojureScript at University Health Network (UHN). My team started using Clojure about six years ago, and we integrated ClojureScript into our stack last year with our latest project. We have a team of about 30 developers, some of them are using Clojure while others are using other languages such as Java and C#. The number of people using Clojure has been steadily increasing as the benefits have become evident. My immediate team consists of eight developers working exclusively with Clojure. The clinicians at the University Health Network (UHN) operate in a complex healthcare environment where many aspects of patient care have to be coordinated between multiple disciplines. Our team builds products that help clinicians streamline their workflow. An example of such a workflow is the one found at the Bariatric Clinic, where obese patients require assessments for weight loss surgery. Let’s take a look at the problem we faced and how we addressed it. Assessments are conducted by professionals from across five disciplines. The assessment starts with a nurse consultation, followed by a visit with a social worker, then a dietitian, and then the psych team. Finally, patient is scheduled for the surgeon interview. The surgeon must have the information collected by other disciplines in condensed form. The assessments must be completed in a specific order with each assessment being dependent on the results from the previous ones. The task is further complicated by the fact that all the assessments work with a common set of data. Each discipline requires to see a subset of the data and uses a different set of terminologies when referring to the data elements. When a piece of data is modified, it may trigger updates in the data model including those that aren’t part of the view that the user is working on. Since multiple users may be working on different parts of the assessment concurrently, we have to take extra care to ensure data integrity within the application."
