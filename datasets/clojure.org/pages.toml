["https://clojure.org/guides/destructuring"]
title = "Clojure - Destructuring in Clojure"
full_description = '''(def my-line [[5 10] [10 20]]) (let [p1 (first my-line) p2 (second my-line) x1 (first p1) y1 (second p1) x2 (first p2) y2 (second p2)] (println "Line from (" x1 "," y1 ") to (" x2 ", " y2 ")")) ;= "Line from ( 5 , 10 ) to ( 10 , 20 )" ;= Using the same vector as above (let [[p1 p2] my-line [x1 y1] p1 [x2 y2] p2] (println "Line from (" x1 "," y1 ") to (" x2 ", " y2 ")")) ;= "Line from ( 5 , 10 ) to ( 10 , 20 )" ;= Using the same vector as above (let [[[x1 y1] [x2 y2]] my-line] (println "Line from (" x1 "," y1 ") to (" x2 ", " y2 ")")) ;= "Line from ( 5 , 10 ) to ( 10 , 20 )" (def my-vector [1 2 3]) (def my-list '(1 2 3)) (def my-string "abc") ;= It should come as no surprise that this will print out 1 2 3 (let [[x y z] my-vector] (println x y z)) ;= 1 2 3 ;= We can also use a similar technique to destructure a list (let [[x y z] my-list] (println x y z)) ;= 1 2 3 ;= For strings, the elements are destructured by character. (let [[x y z] my-string] (println x y z) (map type [x y z])) ;= a b c ;= (java.lang.Character java.lang.Character java.lang.Character) (def small-list '(1 2 3)) (let [[a b c d e f g] small-list] (println a b c d e f g)) ;= 1 2 3 nil nil nil nil (let [[item1 item2 item3 item4 item5 item6] names] (println item1) (println item2 item3 item4 item5 item6)) ;= Michael ;= Amber Aaron Nick Earl Joe (let [[item1 & remaining] names] (println item1) (apply println remaining)) ;= Michael ;= Amber Aaron Nick Earl Joe (let [[item1 _ item3 _ item5 _] names] (println "Odd names:" item1 item3 item5)) ;= Odd names: Michael Aaron Earl (let [[item1 :as all] names] (println "The first name from" all "is" item1)) ;= The first name from [Michael Amber Aaron Nick Earl Joe] is Michael (def numbers [1 2 3 4 5]) (let [[x & remaining :as all] numbers] (apply prn [remaining all])) ;= (2 3 4 5) [1 2 3 4 5] (def word "Clojure") (let [[x & remaining :as all] word] (apply prn [x remaining all])) ;= \C (\l \o \j \u \r \e) "Clojure" (def fruits ["apple" "orange" "strawberry" "peach" "pear" "lemon"]) (let [[item1 _ item3 & remaining :as all-fruits] fruits] (println "The first and third fruits are" item1 "and" item3) (println "These were taken from" all-fruits) (println "The fruits after them are" remaining)) ;= The first and third fruits are apple and strawberry ;= These were taken from [apple orange strawberry peach pear lemon] ;= The fruits after them are (peach pear lemon)'''
