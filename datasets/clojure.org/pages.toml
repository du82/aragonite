["https://clojure.org/stories/stitch"]
title = "Clojure - Stitch"
full_description = "Stitch is an extract-transform-load (ETL) service that connects to tools like Salesforce and Facebook Ads and consolidates data from those platforms into a central location – a data warehouse – where it’s available for analysis. We’ve been using Clojure in production since our company’s inception in 2016. Many of our early team members had worked with Clojure in prior roles, so it was an obvious choice. We use a few different native Clojure libraries, such as ring, compojure, and http-kit. However, when a well-supported Java library exists for a particular purpose, we tend to use the Java version and rely on Clojure’s excellent Java interop support. For example, we use Java client libraries for various AWS services, Apache ZooKeeper, and Apache Kafka. Immutability. We try to rely on referential transparency as much as possible, which makes our applications easier to test and understand. Interactive development. Many of us use Emacs with CIDER, which allows us to develop, debug, and test things interactively. Our web services run on AWS EC2 instances behind an ELB load balancer. We use ring and Jetty as our web servers. Most of our newer databases are Postgres RDS. Some of our applications use Redis for caching. Our actual data pipeline is fronted by a Clojure web service that stores data to Kafka, and then several more small Clojure services that route, transform, and load the data to its destination. Clojure allows us to develop robust applications that are simpler, smaller, and easier to understand than they would be if we wrote them in some other languages. We have the entire ecosystem of Java libraries at our disposal. It allows our developers to debug problems quickly by connecting to a running JVM and executing code. And using clojure.test combined with the interactivity of an nREPL connection lets us prototype quickly with a tight iterative TDD loop."
year_published = 2025
clearnet = "https://clojure.org/stories/stitch"
