["https://clojure.org/stories/anychart"]
title = "Clojure - AnyChart"
full_description = "AnyChart started in 2003 as a provider of Flash-based solutions for interactive data visualization. Then, in several years, we moved to JavaScript HTML5 as a more promising technology. Not having stopped further developing, AnyChart started working with Clojure in early 2014 and with ClojureScript in 2015, and we are glad to say they’ve been among the technologies fueling our global leadership in data visualization tools for all these years. Currently, two of our developers code in Clojure on a regular basis. Now that our team is growing, the number of Clojure programmers is expected to increase. AnyChart is a lightweight and robust JavaScript charting library with great, detailed chart documentation and JS API reference, as well as enterprise-grade support. Our component smoothly runs on any platform and finely works with any database. The source code of AnyChart is open, so anyone can download and modify it, which gives a great flexibility. Thousands of out-of-the-box chart code samples in our playground, plugins and integrations for all major stacks, and ready-to-use HTML5 dashboards as business solutions allow industry-standard data visualizations to be deployed literally in minutes. Our goal has been to create a universal engine for data visualization in order to let anyone easily make any charts and dashboards from any data, and to ensure their great look and feel in any web projects regardless of the platform and the browser. And we are happy to be on the right track, currently being trusted to power data visualization for thousands of our customers, from startups to over 70% of the Fortune 1000 companies. By the way, we are proud to have been named the best in JavaScript technologies and received a prestigious 2018 DEVIES award earlier this year. Clojure and ClojureScript are essential parts of our projects such as AnyChart JS API reference, documentation, playground, export server. Without Clojure, they wouldn’t be as awesome as they are now. We employ Reagent and re-frame, and think that they are amazing ClojureScript libraries which make complex things easy and enjoyable. In addition to that, we use Component, Hiccup, Selmer, Enlive and Yesql on the server side."
year_published = 2025
clearnet = "https://clojure.org/stories/anychart"
