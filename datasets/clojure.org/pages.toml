["https://clojure.org/dev/dev"]
title = "Clojure - Development"
full_description = "Clojure was created by Rich Hickey and is developed by a core team of developers at Nubank, which supports this work. The Clojure development team values a measured and thoughtful approach to language evolution with a strong emphasis on maintaining backward compatibility. First, please consider the many ways to contribute as a Clojure user. If you wish to discuss a problem or enhancement, you can do so on the forum without becoming a contributor. The Clojure core team values those that engage with the current stream of ongoing work, doing the hard work of triage, patch development, screening, etc. The workflow page highlights places to tap into those queues of work as jira reports. The core team tends to focus on tickets primarily in the late alpha / early beta period for a release cycle. During other parts of the release cycle, activity may seem dormant, but that is the perfect time to improve tickets so they are ready to evaluate. Tickets that are well-written with good patches can move quickly through the cycle at the appropriate time. File a contributor support request to get a contributor account - please include the email address you wish to use with your account. Contributors can file tickets directly in the issue tracker. You might want to check what you are seeing with others on a Clojure discussion forum before filing. Please review the guide to creating useful tickets. Clojure accepts contributions as patches on issues. Please review these guidelines on developing patches. Tickets may be assessed over a long period of time, following the workflow. Clojure’s direction is determined by Rich Hickey and the core team. This process is open to input and visible in issues and commits, but not explicitly driven by the community. The core team pays attention to the needs of the community by monitoring and participating in many Clojure discussion forums, and by reviewing issues and votes in the issue tracker. We are currently evaluating better systems for collecting and prioritizing enhancement requests."
year_published = 2025
