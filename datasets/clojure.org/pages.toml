["https://clojure.org/events/2025/scicloj-ai-meetup-1-voice-fn-2048009922"]
title = "Clojure - Scicloj AI Meetup 1: voice-fn"
full_description = "Date: 2025-02-22 Location: online Link: https://clojureverse.org/t/scicloj-ai-meetup-1-voice-fn-real-time-voice-enabled-ai-pipelines/11171 Scicloj AI Meetup 1: voice-fn - real-time voice-enabled AI pipelines The scicloj-ai-meetups group is a new developer community focused on AI models, their underlying principles, and practical applications. The group is organized by @stoica94 and @daslu, emerging from community discussions about the need for more open collaboration and experimentation in AI. It builds upon our previous initiatives like the scicloj-llm-meetups, but with an expanded scope that explores diverse types of AI models beyond just LLMs. While some content will be specific to the Clojure ecosystem, much of the material will be valuable and relevant to the broader AI and programming communities. The first meeting of this new series is scheduled for February 22, 2025. Agenda @stoica94 will present voice-fn, a Clojure library for building real-time voice-enabled AI pipelines. We will discuss our hopes and goals for this new group. Joining Please mark your participation using the Your rsvp button at the top of this page (requires Clojureverse login). Please join the Clojurians Zulip chat beforehand. You can also use the Add to Calendar button to add the event to your calendar. Chat We will use the #scicloj-ai-meetups channel of the Clojurians Zulip Chat (requires login). Please join the Zulip chat before attending our meetings. Length The official session will run for 90 minutes. Informal discussions may continue afterwards for those interested. Platform Video meeting: Launch Meeting - Zoom Text chat: We will use the #ai-meetups Zulip stream (requires Zulip login) Recording Portions of the meeting will be recorded and may be shared publicly. Some segments will remain unrecorded. joy21212×568 98.3 KB Zulip: https://clojurians.zulipchat.com/#narrow/stream/262224-events/near/496490152"
