title = "Clojure - Deps and CLI Guide"
full_description = '''user=> (+ 2 3) # press the `enter` key after typing the expression to evaluate it 5 # result of expression user=> # type Ctrl-D here to exit the REPL (does not print) $ $ clj -X:deps find-versions :lib clojure.java-time/clojure.java-time ...omitted {:mvn/version "1.0.0"} {:mvn/version "1.1.0"} $ clj Downloading: clojure/java-time/clojure.java-time/1.1.0/clojure.java-time-1.1.0.pom from clojars Downloading: clojure/java-time/clojure.java-time/1.1.0/clojure.java-time-1.1.0.jar from clojars Clojure 1.12.0 user=> (require '[java-time.api :as t]) nil user=> (str (t/instant)) "2022-10-07T16:06:50.067221Z" (ns hello (:require [java-time.api :as t])) (defn time-str "Returns a string representation of a datetime in the local time zone." [instant] (t/format (t/with-zone (t/formatter "hh:mm a") (t/zone-id)) instant)) (defn run [opts] (println "Hello world, the time is" (time-str (t/instant)))) ├── time-lib │ ├── deps.edn │ └── src │ └── hello_time.clj └── hello-world ├── deps.edn └── src └── hello.clj (ns hello-time (:require [java-time.api :as t])) (defn now "Returns the current datetime" [] (t/instant)) (defn time-str "Returns a string representation of a datetime in the local time zone." [instant] (t/format (t/with-zone (t/formatter "hh:mm a") (t/zone-id)) instant)) (ns hello (:require [hello-time :as ht])) (defn run [opts] (println "Hello world, the time is" (ht/time-str (ht/now)))) $ clj -X hello/run Cloning: https://github.com/yourname/time-lib Checking out: https://github.com/yourname/time-lib at 4c4a34d Hello world, the time is 02:10 PM $ clj -A:test -Spath test: src: /Users/me/.m2/repository/org/clojure/clojure/1.12.0/clojure-1.12.0.jar: ... same as before (split here for readability) {:deps {org.clojure/core.async {:mvn/version "1.3.610"}} :aliases {:test {:extra-paths ["test"] :extra-deps {io.github.cognitect-labs/test-runner {:git/tag "v0.5.1" :git/sha "dfb30dd"}} :main-opts ["-m" "cognitect.test-runner"] :exec-fn cognitect.test-runner.api/test}}}'''
