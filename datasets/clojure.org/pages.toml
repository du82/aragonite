title = "Clojure - tools.build Guide"
full_description = '''{:paths ["src"] ;; project paths :deps {} ;; project deps :aliases {;; Run with clj -T:build function-in-build :build {:deps {io.github.clojure/tools.build {:git/tag "TAG" :git/sha "SHA"}} :ns-default build}}} The git dep and Clojure CLI examples in this guide assume the use of Clojure CLI 1.10.3.933 or higher. (ns build (:require [clojure.tools.build.api :as b])) (def lib 'my/lib1) (def version (format "1.2.%s" (b/git-count-revs nil))) (def class-dir "target/classes") (def jar-file (format "target/%s-%s.jar" (name lib) version)) ;; delay to defer side effects (artifact downloads) (def basis (delay (b/create-basis {:project "deps.edn"}))) (defn clean [_] (b/delete {:path "target"})) (defn jar [_] (b/write-pom {:class-dir class-dir :lib lib :version version :basis @basis :src-dirs ["src"]}) (b/copy-dir {:src-dirs ["src" "resources"] :target-dir class-dir}) (b/jar {:class-dir class-dir :jar-file jar-file})) {:paths ["src"] :aliases {:build {:deps {io.github.clojure/tools.build {:git/tag "TAG" :git/sha "SHA"}} :ns-default build}}} (ns build (:require [clojure.tools.build.api :as b])) (def lib 'my/lib1) (def version (format "1.2.%s" (b/git-count-revs nil))) (def class-dir "target/classes") (def uber-file (format "target/%s-%s-standalone.jar" (name lib) version)) ;; delay to defer side effects (artifact downloads) (def basis (delay (b/create-basis {:project "deps.edn"}))) (defn clean [_] (b/delete {:path "target"})) (defn uber [_] (clean nil) (b/copy-dir {:src-dirs ["src" "resources"] :target-dir class-dir}) (b/compile-clj {:basis @basis :ns-compile '[my.lib.main] :class-dir class-dir}) (b/uber {:class-dir class-dir :uber-file uber-file :basis @basis :main 'my.lib.main})) (ns build (:require [clojure.tools.build.api :as b])) (def lib 'my/lib1) (def version (format "1.2.%s" (b/git-count-revs nil))) (def class-dir "target/classes") (def jar-file (format "target/%s-%s.jar" (name lib) version)) (def copy-srcs ["src" "resources"]) ;; delay to defer side effects (artifact downloads) (def basis (delay (b/create-basis {:project "deps.edn"}))) (defn clean [params] (b/delete {:path "target"}) params) (defn jar [{:keys [env] :as params}] (let [srcs (if (= env :dev) (cons "dev-resources" copy-srcs) copy-srcs)] (b/write-pom {:class-dir class-dir :lib lib :version version :basis @basis :src-dirs ["src"]}) (b/copy-dir {:src-dirs srcs :target-dir class-dir}) (b/jar {:class-dir class-dir :jar-file jar-file}) params))'''
