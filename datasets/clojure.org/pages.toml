["https://clojure.org/guides/spec"]
title = "Clojure - spec Guide"
full_description = '(s/valid? nil? nil) ;; true (s/valid? string? "abc") ;; true (s/valid? #(> % 5) 10) ;; true (s/valid? #(> % 5) 0) ;; false (import java.util.Date) (s/valid? inst? (Date.)) ;; true (s/valid? #{:club :diamond :heart :spade} :club) ;; true (s/valid? #{:club :diamond :heart :spade} 42) ;; false (s/valid? #{42} 42) ;; true Spec Names Spec names are always fully-qualified keywords. Generally, Clojure code should use keyword namespaces that are sufficiently unique such that they will not conflict with specs provided by other libraries. If you are writing a library for public use, spec namespaces should include the project name, url, or organization. Within a private organization, you may be able to use shorter names - the important thing is that they are sufficiently unique to avoid conflicts. In this guide we will often use shorter qualified names for example brevity. (doc :order/date) ------------------------- :order/date Spec inst? (doc :deck/suit) ------------------------- :deck/suit Spec #{:spade :heart :diamond :club} (s/def :num/big-even (s/and int? even? #(> % 1000))) (s/valid? :num/big-even :foo) ;; false (s/valid? :num/big-even 10) ;; false (s/valid? :num/big-even 100000) ;; true (s/def :domain/name-or-id (s/or :name string? :id int?)) (s/valid? :domain/name-or-id "abc") ;; true (s/valid? :domain/name-or-id 100) ;; true (s/valid? :domain/name-or-id :foo) ;; false (s/conform :domain/name-or-id "abc") ;;=> [:name "abc"] (s/conform :domain/name-or-id 100) ;;=> [:id 100] (s/explain :deck/suit 42) ;; 42 - failed: #{:spade :heart :diamond :club} spec: :deck/suit (s/explain :num/big-even 5) ;; 5 - failed: even? spec: :num/big-even (s/explain :domain/name-or-id :foo) ;; :foo - failed: string? at: [:name] spec: :domain/name-or-id ;; :foo - failed: int? at: [:id] spec: :domain/name-or-id (s/explain-data :domain/name-or-id :foo) ;;=> #:clojure.spec.alpha{ ;; :problems ({:path [:name], ;; :pred clojure.core/string?, ;; :val :foo, ;; :via [:domain/name-or-id], ;; :in []} ;; {:path [:id], ;; :pred clojure.core/int?, ;; :val :foo, ;; :via [:domain/name-or-id], ;; :in []})}'
