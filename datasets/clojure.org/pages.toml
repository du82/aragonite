["https://clojure.org/stories/signal"]
title = "Clojure - Signal"
full_description = "We are a team of 14 (between developers and researchers) using Clojure and ClojureScript on different parts of our system. Signal is an AI company. We ingest unstructured text and make sense of it via a text analytics pipeline. A large part of our ingestion pipeline is written in Clojure. We also extensively use Clojure for some of our internal APIs. Over the last year we’ve been using Clojurescript to build a new product for search and retrieval of legal data on large scale. Reagent is really nice. We use Ring and Compojure in anger and we find them very valuable. Recently we also started using http-kit more and more. The Clojure core is just brilliant. It’s small enough to be easy to remember but it has pretty much all you need to compose functions in more sophisticated ones. Right now the majority of our stack is written in a mix of Clojure, Python and Javascript. A core component of our system is Elasticsearch: we self-host and manage a 20TB cluster. All our infrastructure is on AWS and we use Terraform to manage it. We’re also experimenting with Golang and Erlang. The nature of the language allows us to express complex concepts in a very terse way. The fact that us running over the JVM is an incredible added value; JVM is easy to monitor and it’s incredibly resilient. The Clojure community is also very strong and it’s a great source for talented people to join our team!"
year_published = 2025
