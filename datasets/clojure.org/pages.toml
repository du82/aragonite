["https://clojure.org/community/success_stories"]
title = "Clojure - Success Stories"
full_description = '''Here are just some of the public success stories from companies using Clojure. If you’d like to be added to this list, please complete this form. Walmart used Clojure to create a robust data management system that supports over 5,000 stores and integrates online and mobile data. "Our Clojure system just handled its first Walmart black Friday and came out without a scratch." - via Twitter, 11/28/2014 Chartbeat uses Kafka and Clojure to build a contextual site overlay which tracks internal traffic at a rate of over one million clicks per minute in real time. Watch Devon discuss how they use Clojure to process a stream of activity of tens of millions of users. When we needed to extract insights from hundreds of thousands of requests per second in realtime, we knew Clojure was the answer. Clojure is really awesome for general stream processing. 8th Light worked with a new-to-Clojure client team to complete their first Clojure project in just a month, from design to deployment. Clojure's flexibility, interactive development, and tooling have helped us to iterate and continuously deliver a product our clients can be proud of. Consumer Reports chose Clojure and Datomic to bring together all their underlying backend systems and databases. Their new enterprise-wide container service enables developers to create applications providing the data consumers are searching for quickly with decreased risk and effort. Cicayda used Clojure, Datomic, and ClojureScript to build a robust, multi-tenant cloud hosted SaaS that allows clients to manage diverse data and load profiles. ClojureScript has provided us with a unified development environment on both sides of the wire and has helped us push toward a data-oriented UI. Puppet use Clojure to build Trapperkeeper (and more), relying on Clojure's simplicity to build an agile, scalable platform. Clojure is a functional programming language from top to bottom. This means that code written in Clojure is very modular, composable, reusable and easy to reason about.'''
