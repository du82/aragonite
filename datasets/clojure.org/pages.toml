["https://clojure.org/news/2012/05/08/reducers"]
title = "Clojure - Reducers - A Library and Model for Collection Processing"
full_description = ''';;red is a reducer awaiting a collection (def red (comp (r/filter even?) (r/map inc))) (reduce + (red [1 1 1 2])) ;=> 6 I’m happy to have pushed today the beginnings of a new Clojure library for higher-order manipulation of collections, based upon reduce and fold. Of course, Clojure already has Lisp’s reduce, which corresponds to the traditional foldl of functional programming. reduce is based upon sequences, as are many of the core functions of Clojure, like map, filter etc. So, what could be better? It’s a long story, so I’ll give you the ending first: Clojure and other functional languages have a function called map that takes a function and a collection/list. The classic recursive functional definition of map is to apply f to the first thing in the collection, then cons the result onto the result of mapping f on the rest of the collection. This definition includes plenty of 'how': Newer OO frameworks will often remove some of these problems by having map be a function of fn * Coll → Coll for any type of Coll, removing the sequentiality but also losing the laziness, and they still specify a concrete collection result. Semantically, and minimally, map means "apply-to-all" e.g. (map inc coll) means give me a (logical) collection where every item is one greater than it was in coll. But, map doesn’t know how to navigate around every collection - the use of seqs/lists/iterators/streams etc forces a shared known representation. Nor does inc (or any function) know how to apply itself to every collection representation, else we could just say (inc coll). What is the generic gateway to a collection applying things to itself? In Clojure, it is (internal) reduce. We now have a new super-generalized and minimal abstraction for collections - a collection is some set of things that, when given a function to apply to its contents, can do so and give you the result, i.e. a collection is (at minimum) reducible. In other words, you can call reduce on it. Thus, core.reducers/map is a function of fn * reducible → reducible. (Whereas core/map is a function of fn * seqable → seqable.)'''
year_published = 2025
clearnet = "https://clojure.org/news/2012/05/08/reducers"
