["https://clojure.org/guides/equality"]
title = "Clojure - Equality"
full_description = '''user> (range 3) (0 1 2) user> (= [0 1 2] (range 3)) true user> (= [0 1 2] '(0 1 2)) true ;; not = because different order user> (= [0 1 2] [0 2 1]) false ;; not = because different number of elements user> (= [0 1] [0 1 2]) false ;; not = because 2 and 2.0 are not = user> (= '(0 1 2) '(0 1 2.0)) false user> (def s1 #{1999 2001 3001}) #'user/s1 user> s1 #{2001 1999 3001} user> (def s2 (sorted-set 1999 2001 3001)) #'user/s2 user> s2 #{1999 2001 3001} user> (= s1 s2) true user> (def m1 (sorted-map-by > 3 -7 5 10 15 20)) #'user/m1 user> (def m2 {3 -7, 5 10, 15 20}) #'user/m2 user> m1 {15 20, 5 10, 3 -7} user> m2 {3 -7, 5 10, 15 20} user> (= m1 m2) true user> (def v1 ["a" "b" "c"]) #'user/v1 user> (def m1 {0 "a" 1 "b" 2 "c"}) #'user/m1 user> (v1 0) "a" user> (m1 0) "a" user> (= v1 m1) false user> (def s1 (with-meta #{1 2 3} {:key1 "set 1"})) #'user/s1 user> (def s2 (with-meta #{1 2 3} {:key1 "set 2 here"})) #'user/s2 user> (binding [*print-meta* true] (pr-str s1)) "^{:key1 \"set 1\"} #{1 2 3}" user> (binding [*print-meta* true] (pr-str s2)) "^{:key1 \"set 2 here\"} #{1 2 3}" user> (= s1 s2) true user> (= (meta s1) (meta s2)) false user=> (defrecord MyRec1 [a b]) user.MyRec1 user=> (def r1 (->MyRec1 1 2)) #'user/r1 user=> r1 #user.MyRec1{:a 1, :b 2} user=> (defrecord MyRec2 [a b]) user.MyRec2 user=> (def r2 (->MyRec2 1 2)) #'user/r2 user=> r2 #user.MyRec2{:a 1, :b 2} user=> (def m1 {:a 1 :b 2}) #'user/m1 user=> (= r1 r2) false ; r1 and r2 have different types user=> (= r1 m1) false ; r1 and m1 have different types user=> (into {} r1) {:a 1, :b 2} ; this is one way to "convert" a record to a map user=> (= (into {} r1) m1) true ; the resulting map is = to m1 user> (def d1 (apply + (repeat 100 0.1))) #'user/d1 user> d1 9.99999999999998 user> (== d1 10.0) false user> (def s1 #{1.0 2.0 ##NaN}) #'user/s1 user> s1 #{2.0 1.0 ##NaN} user> (s1 1.0) 1.0 user> (s1 1.5) nil user> (s1 ##NaN) nil ; cannot find ##NaN in a set, because it is not = to itself user> (disj s1 2.0) #{1.0 ##NaN} user> (disj s1 ##NaN) #{2.0 1.0 ##NaN} ; ##NaN is still in the result!'''
