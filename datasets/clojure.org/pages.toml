["https://clojure.org/community/contributing"]
title = "Clojure - Contributing"
full_description = 'If you are writing a guide, making an event, or creating a resource, please consider contributing to this web site, clojure.org. All of the content is stored in GitHub and pull requests and issues are accepted. For more information on how to contribute, see the page on contributing to the site. Every page has a link to the corresponding source file in the bottom right corner. If you have an idea for a new guide or updated documentation, please file an issue for discussion. The Clojure team provides a forum where users can ask questions, submit potential problems, and request enhancements to Clojure, ClojureScript, or Clojure contrib libraries. For all of these cases, please ask a question on the forum. Mark the question with tag problem for potential problems and request for enhancements. The community and core team will assess the issue and determine whether to file an issue in the jira tracker. If an issue is filed, the link will be added to the question and it will be tagged with jira. If you are looking to provide feedback on an issue in jira, please search the forum for the equivalent issue by title and add your feedback there as an "answer" instead. The development teams for these languages and libs will use the question votes to prioritize their work in jira towards the next release. Clojure was created by Rich Hickey and is developed by a core team of developers at Nubank, which supports this work. The Clojure development team values a measured and thoughtful approach to language evolution with a strong emphasis on maintaining backward compatibility. See Development for more information on Clojure development. If you would like to provide a patch on a specific ticket in the jira tracker, please follow the process to become a contributor.'
