["https://clojure.org/guides/test_check_beginner"]
title = "Clojure - test.check"
full_description = '''(require '[clojure.test.check :as tc]) (require '[clojure.test.check.generators :as gen]) (require '[clojure.test.check.properties :as prop]) (def sort-idempotent-prop (prop/for-all [v (gen/vector gen/int)] (= (sort v) (sort (sort v))))) (tc/quick-check 100 sort-idempotent-prop) ;; => {:result true, ;; => :pass? true, ;; => :num-tests 100, ;; => :time-elapsed-ms 28, ;; => :seed 1528580707376} (def prop-sorted-first-less-than-last (prop/for-all [v (gen/not-empty (gen/vector gen/int))] (let [s (sort v)] (< (first s) (last s))))) {:num-tests 5, :seed 1528580863556, :fail [[-3]], :failed-after-ms 1, :result false, :result-data nil, :failing-size 4, :pass? false, :shrunk {:total-nodes-visited 5, :depth 2, :pass? false, :result false, :result-data nil, :time-shrinking-ms 1, :smallest [[0]]}} user=> (gen/sample gen/double) (-0.5 ##Inf -2.0 -2.0 0.5 -3.875 -0.5625 -1.75 5.0 -2.0) user=> (gen/sample gen/char-alphanumeric) (\G \w \i \1 \V \U \8 \U \t \M) user=> (gen/sample gen/string-alphanumeric) ("" "" "e" "Fh" "w46H" "z" "Y" "7" "NF4e" "b0") user=> (gen/sample gen/keyword) (:. :Lx :x :W :DR :*- :j :g :G :_) user=> (gen/sample gen/symbol) (+ kI G uw jw M9E ?23 T3 * .q) user=> (gen/sample gen/uuid) (#uuid "c4342745-9f71-42cb-b89e-e99651b9dd5f" #uuid "819c3d12-b45a-4373-a307-5943cf17d90b" #uuid "c72b5d34-255f-408f-8d16-4828ed740904" #uuid "d342d515-b297-4ed4-91cc-8cd55007e2c2" #uuid "6d09c6f3-12d4-4e5e-9de5-0ed32c9fef20" #uuid "a572178c-5460-44ee-b992-9d3d26daf8c0" #uuid "572cc48e-b3a8-40ca-9449-48af08c617d3" #uuid "5f6ed50b-adef-4e7f-90d0-44511900491e" #uuid "ddbbfd07-d580-4638-9858-57a469d91727" #uuid "c32b7788-70de-4bf5-b24f-1e7cb564a37d") user=> (gen/generate (gen/vector-distinct (gen/vector gen/boolean 3) {:min-elements 3 :max-elements 5})) [[true false false] [true true false] [false false true] [false true true]] user=> (gen/sample (gen/one-of [gen/boolean gen/double gen/large-integer])) (-1.0 -1 true false 3 true true -24 -0.4296875 3) user=> (count (gen/sample (gen/such-that odd? gen/large-integer) 10000)) ExceptionInfo Couldn't satisfy such-that predicate after 10 tries. clojure.core/ex-info (core.clj:4754)'''
