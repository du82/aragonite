["https://clojure.org/community/start_group"]
title = "Clojure - Start Group"
full_description = "Starting a user group is a great way to improve your Clojure skills and find others interested in Clojure in your area. If you’ve never run a user group before, that’s ok! Anyone can do it. A meeting place. Finding a regular meeting place is sometimes the biggest hurdle a group faces when getting off the ground. Often the ideal option is finding a company that can host a group after-hours. If that’s not an option, some other choices include libraries, churches, or coffee shops. A meeting time. It’s important to establish a rhythm to keep a group going. Pick a night (like the 2nd Tuesday of the month) and try as much as possible to have your meeting on that same night every month. A home on the web. It’s important to have an address on the web that can be found by a search engine. There are lots of ways to put together a web page for free or cheap - see below for some tools you can use. People! You can’t have a meeting without people. Ask around at other mailing lists or user groups in your area for people that might be interested. Not every meeting has to have a speaker that gives a prepared talk. Think creatively about other ways to have a meeting that gives value. Some ideas: Lightning talks - do 5 or 10 minute talks on small subjects. Paradoxically, doing more shorter talks at a meeting is sometimes easier than scheduling one big talk. Each presenter has to prepare less material and meetings have a smaller risk of a bad meeting due to one inexperienced speaker. Try doing two or three talks per meeting. Live coding session - start with a small problem (it’s hard to start too small for this) and let the group drive the evolution of the solution. Code review - bring some code and walk through it. Explain the code, take comments on style, performance, etc. Rewrite parts of it to make it better. Contribute - pick a bug from the Clojure bug tracker and work on it together. Or review the documentation and figure out some improvements. Even providing a list of things confusing to newcomers is useful."
year_published = 2025
