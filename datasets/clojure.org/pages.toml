["https://clojure.org/dev/contrib_libs"]
title = "Clojure - Contrib Libraries"
full_description = 'Clojure is an umbrella level project that hosts many additional libraries called Clojure contrib, which all exist under the Clojure organization on GitHub. These libraries use the same contribution model (Contributor Agreement, license, and copyright) as Clojure itself, and a shared infrastructure maintained by the Clojure core team: Every project has one or more owners (often community members) who determine the direction of their library, triage patches, etc. Project owners have full commit rights and authenticated access to their project on the build box for releases. Contrib libraries are open source libraries, like any other open source Clojure library. They vary widely in development activity and quality and may or may not be the best alternative for their functionality in the overall ecosystem. You should evaluate them before use as you would any open source library you intend to use as a dependency. If you find that active development for a library has ceased and you would like to take over as owner, please contact clojure@cognitect.com. Good stewards for a library typically tend to be those actively using the library and knowledgable about the goals and alternatives of the functionality. Additionally, the following libraries are dependencies of Clojure itself managed directly by the core team. These libraries use the same shared infrastructure as the Contrib libraries, so are largely the same in that regard. Development in these libraries is often linked to development in the core language itself. And finally, there are some repositories in the Clojure GitHub organization that are not libraries at all: Prior to Clojure 1.3, Clojure had a single "batteries included" library called clojure-contrib that consisted of many independent helper namespaces contributed by the community. In the Clojure 1.3 timeframe, this library was split into the independent libraries that exist today with independent owners. Some of the namespaces were seen as experimental and not promoted into any public library. Alessandra Sierra recounts this in more detail in his post.'
year_published = 2025
