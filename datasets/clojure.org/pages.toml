["https://clojure.org/stories/cstap"]
title = "Clojure - cstap"
full_description = "Trigger emails/notifications through disaster reports (earthquake, tsunami, etc) from the Japanese Meteorological Agency, or user action. The users can access a questionnaire from the email/notification and answer their status, such as whether they are safe, can work/commute etc. Provide a summarized view of the responses which can be used to make business continuity decisions in case of a disaster. We are a team of 3, and all of us use Clojure for the server side, and ClojureScript for the frontend. All 3 of us develop in Emacs + Cider. 2 of us use a Linux machine, and 1 uses a Mac. transit-clj - because it removes much of the friction when passing data between the server and the browser, which is a common problem in most other languages. bidi - we cannot imagine life without it! Our app has quite a few dynamically generated URLs, and creating those without bidirectional routing would have been a nightmare. Interactive development with the REPL and the excellent tools such as Cider and figwheel, which allows for extremely quick iteration. Apart from the technical benefits, we are focusing and investing on Clojure for tech branding, which in turn the ultimate goal is to recruit talented engineers. The factors that were important for branding were: Something that is going to stay around for a long time (So a programing language over some library/framework) Clojure matches these factors really well, and so far we are happy with the results. That is how we gathered the 3 members of our team (all loving Clojure), and we constantly receive 1 or 2 applications every month. (FYI: We’re hiring in Japan! → https://cstap.com/jobs/dev-engineer.html)"
