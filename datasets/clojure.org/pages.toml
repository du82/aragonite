["https://clojure.org/community/etiquette"]
title = "Clojure - Etiquette"
full_description = "Clojure and its communication forums are run by, and for, people who make things. Most messages should have one of these forms: They are not the place for advocacy about what 'ought' to be made. If you think something ought to be made, then make it. Otherwise, respect others peoples' right to choose what they do with their time. Occasionally, there may be disagreements about how something has been, or will be, made. These disagreements should take the form of technical arguments. To make a technical argument that gets (and gives!) respect: If you are not the one making something, you should restrict your input to very short technical arguments supporting your position. If someone has already made your point, just +1 it. Ignoring these guidelines fails to respect the time and effort of people who make things, which you should care about if you intend to be one."
year_published = 2025
