title = "Clojure - Radio Television Suisse"
full_description = 'Welcome to the first in an ongoing series of interviews with companies using Clojure and ClojureScript! This first interview is with Frédéric Vergez about his work at RTS (Radio Télévision Suisse), the Swiss national TV and radio broadcaster, and the national news website. Mainly data processing and visualisation for news articles, maps, and web-services in the data-journalism domain. Some examples include a map of events during the 5 year period after the "Arab Spring" and $weethome, a "quality of life" simulator in Switzerland. core.async: everywhere, backend, front-end. It definitely changed the way we’re addressing concurrency/parallelism concerns, especially with ClojureScript We’re still evaluating clojure.spec, and use it mainly on backends. Also considering Datomic (still in early phases / P.O.C). Mainly based on AWS (S3, EC2, Beanstalk, EMR, RDS…​) for backend. We use PostgreSQL and PostGIS a lot but are considering Datalog on some projects. We’re currently evaluating using AWS Lambda with Clojure, and seriously considering using it with ClojureScript + Node.'
