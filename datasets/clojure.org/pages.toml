["https://clojure.org/dev/contrib_history"]
title = "Clojure - Contrib History"
full_description = 'This page is a historical document about the splitting of the old "monolithic" contrib in the Clojure 1.2 timeframe when many of the initial contrib libraries were created. This info is no longer maintained and may be out of date. See Contrib Libs for up to date info. If a clojure.contrib namespace is listed here but has no migration details, that means no one has volunteered to maintain that namespace. Part of the rationale for modular contrib is that there should be an active maintainer going forward so that the library can be kept compatible with new versions of Clojure. All the new modular contrib libraries are compatible with Clojure 1.2.0 thru 1.4.0 (and are also being automatically tested with Clojure 1.5 as it is being developed - as well as being tested with a number of different JDKs!). If a clojure.contrib namespace is not listed here, it is most likely an old namespace that was either migrated somewhere else or deprecated as part of Clojure 1.2 (e.g., clojure.contrib.duck-streams mostly migrated to clojure.java.io, clojure.contrib.pprint migrated to clojure.pprint, clojure.contrib.shell and clojure.contrib.shell-out migrated to clojure.java.shell, clojure.contrib.string migrated to clojure.string, clojure.contrib.http.agent was deprecated - clj-http. defvar: as of Clojure 1.3, you can specify a docstring in a def form: (def my-var "This is my docstring" some-value) fcase replaced by Clojure 1.3 clojure.core/condp. Other macros easily implemented using condp if desired. Migrated to clojure.repl and clojure.java.javadoc. show functionality similar to clojure.reflect/reflect. Any equivalents for these? expression-info, run, run* Migrated to clojure.set, except proper-subset? and proper-superset?, which are easily implemented using subset? and superset? This section lists new contrib namespaces that do not correspond to old contrib namespaces and is provided for completeness / documentation purposes. A Clojure library designed to provide facilities for async programming and communication. - lead Rich Hickey.'
year_published = 2025
