title = "Clojure - Comparators Guide"
full_description = '''user> (sort [22/7 2.71828 ##-Inf 1 55 3N]) (##-Inf 1 2.71828 3N 22/7 55) user> (sorted-set "aardvark" "boo" "a" "Antelope" "bar") #{"Antelope" "a" "aardvark" "bar" "boo"} user> (sorted-set 'user/foo 'clojure.core/pprint 'bar 'clojure.core/apply 'user/zz) #{bar clojure.core/apply clojure.core/pprint user/foo user/zz} user> (sorted-map :map-key 10, :amp [3 2 1], :blammo "kaboom") {:amp [3 2 1], :blammo "kaboom", :map-key 10} user> (sort [[-8 2 5] [-5 -1 20] [1 2] [1 -5] [10000]]) ([10000] [1 -5] [1 2] [-8 2 5] [-5 -1 20]) user> (import '(java.util UUID)) java.util.UUID user> (sort [(UUID. 0xa 0) (UUID. 5 0x11) (UUID. 5 0xb)]) (#uuid "00000000-0000-0005-0000-00000000000b" #uuid "00000000-0000-0005-0000-000000000011" #uuid "00000000-0000-000a-0000-000000000000") user> (sort [:ns2/kw1 :ns2/kw2 :ns1/kw2 :kw2 nil]) (nil :kw2 :ns1/kw2 :ns2/kw1 :ns2/kw2) user> (sort [4 2 3 1]) (1 2 3 4) user> (defn reverse-cmp [a b] (compare b a)) #'user/reverse-cmp user> (sort reverse-cmp [4 3 2 1]) (4 3 2 1) (def john1 {:name "John", :salary 35000.00, :company "Acme"}) (def mary {:name "Mary", :salary 35000.00, :company "Mars Inc"}) (def john2 {:name "John", :salary 40000.00, :company "Venus Co"}) (def john3 {:name "John", :salary 30000.00, :company "Asteroids-R-Us"}) (def people [john1 mary john2 john3]) (defn by-salary-name-co [x y] ;; :salary values sorted in decreasing order because x and y ;; swapped in this compare. (let [c (compare (:salary y) (:salary x))] (if (not= c 0) c ;; :name and :company are sorted in increasing order (let [c (compare (:name x) (:name y))] (if (not= c 0) c (let [c (compare (:company x) (:company y))] c)))))) user> (pprint (sort by-salary-name-co people)) ({:name "John", :salary 40000.0, :company "Venus Co"} {:name "John", :salary 35000.0, :company "Acme"} {:name "Mary", :salary 35000.0, :company "Mars Inc"} {:name "John", :salary 30000.0, :company "Asteroids-R-Us"}) (defn by-salary-name-co2 [x y] (compare [(:salary y) (:name x) (:company x)] [(:salary x) (:name y) (:company y)])) user> (pprint (sort by-salary-name-co2 people)) ({:name "John", :salary 40000.0, :company "Venus Co"} {:name "John", :salary 35000.0, :company "Acme"} {:name "Mary", :salary 35000.0, :company "Mars Inc"} {:name "John", :salary 30000.0, :company "Asteroids-R-Us"})'''
