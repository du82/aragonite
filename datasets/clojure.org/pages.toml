["https://clojure.org/stories/cloudrepo"]
title = "Clojure - CloudRepo"
full_description = "CloudRepo is a fully managed, cloud repository manager. We store software artifacts for software development teams that use tools like Leiningen, Boot, and Maven for dependency management. There are a bunch of libraries that have really been solid and helped our development process. We use Faraday for very simple AWS Dynamo DB access. clj-http for all of our http client needs (testing, etc) and cheshire works like a charm for JSON Parsing. However, the most eye opening and educational library we have used is Ring - it was a paradigm shift to see how http requests could be modeled as simple data and then passed through the system. Once we realized that requests could be modeled as data, we were able to just let the requests flow through our system making transformations as needed. That was a key learning for us and really helped us to understand more about designing systems based on data flow, which I detail further in this post Most recently, using spec has been really great. The idea of generational tests has been game changing for us. It also has provided us with, what we think is, an improvement over static typed system for defining functional contracts and validating programs. We can now validate based on the 'shape' of the data or even specific values - this goes miles beyond the limits of what traditional type systems provide. We absolutely love the power that comes with passing around maps and letting them flow through the system. When we can implement an endpoint by simply using the -> function and a chain of functions we are always pleasantly surprised at how elegant programming can really be with Clojure. Modeling our system state as maps has also been enlightening. It allows us to understand our system better by looking at maps of data rather than a large object hierarchy. Combined with immutability, this makes Clojure a joy to work with. In order to achieve high availability for our customers, we run CloudRepo in Docker containers distributed across multiple hosts running in Amazon Elastic Container Services. Our backend services are written 100% in Clojure. It’s great that we can leverage the reliability of the JVM along with the power of a language like Clojure."
year_published = 2025
