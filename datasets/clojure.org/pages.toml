title = "Clojure - Editing"
full_description = 'This page covers helpful Asciidoc editing tips for writing content on this site. It does not cover every feature of Asciidoc, just the ones that have come up most commonly while writing content on this site. The first lines indicate the title, author, and creation date. The last two lines are necessary boilerplate metadata attributes. There are a number of ways to handle escaping in Asciidoc but one of the most helpful is to omit all formatting by using: Link to another internal page (note the trailing # after the page - this is required in our generator!): There is a bug in the parser used in the current version of JBake for links to a page in a parent directory. For example, to link to a page at ../reference/java_interop.adoc, you can use a link like this: This goes to a (fictitious) subdirectory xref, then back a directory, and then finally the path you wish to follow. While the choice of "xref" here is arbitrary, please use only this string so that we can more easily find and update these upward cross references later when there is a version that fixes this issue. Images should be placed in the assets/images/content directory in a subdirectory corresponding to the page location. Tables are another large Asciidoc topic with extensive formatting options. This is a basic table example however: Insert table of contents, which should generally be done at the top of your file (the page template will position this appropriately): Asciidoc is an extensive language and there is likely some way to do anything you want to do. Below are some more Asciidoc resources to answer more advanced questions.'
