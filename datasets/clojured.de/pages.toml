full_description = '''2019 Talks 2019 February 23 We will have two tracks in parallel. To get updates about the schedule, please check our official twitter account. Time Gallery Loft 09:00 Registration 09:50 Conference Opening 10:00 Welcome & Introduction 10:30 Robert Avram: Reinforcement Learning Made Simple Paula Gearon: How to Graph Your Data 11:15 Dave Liepmann: Tricking Sand into Thinking: Deep Learning in Clojure Jan Stępień: Native Clojure with GraalVM 12:00 Joakim Tengstrand: Polylith – A software architecture based on LEGO®-like blocks Ingo Mohr: About the Unknown East of the Ancient LISP World. History and Thoughts 12:30 Lunch Break Lunch Break 13:30 Jelle Akkerman: [Insert generated title of talk here] Ferruccio Balestreri: Rapid Prototyping with Coast on Clojure 14:15 Tim Zöller: Workflow engines with Clojure - It's a match! Martin Kavalar: Our Journey from Elm and Elixir to Clojure 15:00 Sourabh Ghorpade and Akshay Gupta: Reducing Accretion In Monoliths With Stream Processing Abhishek Anand Amralkar: Monitoring with Riemann 15:30 Coffee Break Coffee Break 16:00 Jonas Östlund: Faster Computations with Generative Expressions Ben Lovell: Microservices, REST, and other regrettable decisions 16:45 Nikolas Göbel: 3DF: Reactive Datalog for Datomic Paulus Esterhazy: Decomposing Problems 17:30 Thomas Kristensen: Music made simple Lightning Talks 18:00 Martin Klepsch: cljdoc – documentation from the future 18:10 Ruediger Gad: cli4clj – Easing the Implementation of Interactive Command Line Interfaces in Clojure for "Everyone" 18:20 Robert Avram: Simple Asynchrony with Free Monoids in Clojure 18:30 Miikka Koskinen: Pointfree Clojure 18:45 Get-Together at the Grand Bar [Insert generated title of talk here] by Jelle Akkerman September 1954, composer John Cage writes “45 minutes for a speaker”, a set of rules meant to compose a lecture through chance operations. Using questions like “1. Is there speech or silence?” or “4. If speech, is it old material or new?” Cage composed the speech’s content, noises and gestures. February 2019, I generate and perform a 20-minute talk, on the fly, using clojure.spec, about clojure.spec. About Jelle Akkerman Jelle is a Clojure programmer at Pitch. Apart from software, he also makes music and music instruments. Monitoring with Riemann by Abhishek Anand Amralkar Monitoring modern real time distributed infrastructure is complex and expensive. In this talk we explore Riemann, specifically, how Riemann’s low latency helped us to get real time metrics from our Distributed Systems. Large scale real time distributed systems require emitting hundreds of thousands of metrics per seconds for effective monitoring. A significant portions of metrics are either not of any use or we don’t understand them. With the rapid growth in infrastructure, monitoring infrastructure in real time and getting accurate metrics becomes challenging especially when you have an in-house monitoring setup. Most monitoring systems are pull/poll based where your monitoring system queries the components being monitored. Pull based monitoring systems, where the system keeps changing some x values in every y minutes, are literally dead. Riemann is a monitoring tool that aggregates events from hosts, servers and applications and can feed them into a stream processing language to be manipulated, summarized or action-ed. Riemann is fast and highly configurable. Most importantly, it is an event-centric push model. We use Riemann to monitor Distributed Systems. Catching problems in real time requires monitoring tools that have low latency to detect errors faster and immediately see if the fix is working. Riemann provides this along with a transient shared state for systems with many moving parts. Riemann is written in Clojure and leverages its core concepts. Riemann configs are Clojure code. We will walk through the concepts of Riemann Events Streams Indexes We will also go over how to run Riemann in a production environment and how to write Riemann Clojure configs. We will conclude our talk with the demo for monitoring distributed systems like Apache Zookeeper. ➜ Watch on YouTube About Abhishek Anand Amralkar Abhishek leads the Cloud Infrastructure / DevSecOps team at Talentica Software, where he designs the next generation of Cloud Infrastructure in a cost-effective and reliable manner without comprising on infrastructure and application security. He has experience in working across various technology domains like Data Center Security, Cloud Operations, Cloud Automation, writing tools around infrastructure and Cloud Security. His current focus is on Security Operations and Clojure. Reinforcement Learning Made Simple by Robert Avram For all the fascination that it induces, Machine Learning (ML) is a rather complex area of computer science. When translating one of its algorithms to some concrete implementation, the correctness of this implementation becomes crucial. Clojure, on the other hand, is a simple, but powerful language. In most cases, its simplicity tends to transfer to the problem domain it is applied upon. I argue that we can use Clojure to more simply implement machine learning algorithms and thus largely guarantee their correctness by means of simplicity. In this talk I would like to concretely show you how Clojure may simplify the implementation of a particular class of ML algorithms, namely Reinforcement Learning ones, and demonstrate their correctness by using them to teach a game how to solve itself. ➜ Watch on YouTube About Robert Avram Robert is a software engineer currently working at REWE Digital in Cologne and spends a lot of his time writing functional microservices in Clojure. He concurrently seeks refuge from the imperative in the world of purely functional programming, and from time to time likes to pester unwilling individuals with it. Rapid Prototyping with Coast on Clojure by Ferruccio Balestreri Introduction: What is the indie maker movement and why you should try and build your own side projects. Why Clojure is the perfect language to do this. Introduction to Coast, a full stack Clojure web framework for indie makers that want to get things done. Walkthrough an example project of a Saas web app (likely this one: https://github.com/magehash/magehash). My goal with this talk would be to spread enthusiasm for building fun things with Clojure and show how easy it is to get started. ➜ Watch on YouTube About Ferruccio Balestreri I’m a Control Engineering student that likes to make side projects that solve problems. After falling in love with Clojure and reading “Clojure for the Brave and True”, I started to use Clojure to build fun web apps. First using Pedestal, then with Luminus, now on Coast. Decomposing Problems by Paulus Esterhazy At the heart of programming lies the task of decomposing problems into subproblems that can be understood and reasoned about independently. In his 2018 book „A Philosophy of Software Design“, John Ousterhout, the author of the Tcl programming language, lays out his approach to module decomposition. This talk explores ways of applying Ousterhoutian techniques for avoiding complexity to Clojure. How do techniques of problem decomposition apply to the post-OOP world of functional programming? ➜ Watch on YouTube About Paulus Esterhazy Paulus is a seeker of simplicity. He is Principal Engineer at Pitch. Tackling Travel Tech problems with Graph Stores and Finite State Machines in Clojure by Nicolas Forgerit Creating a software system for a travel tech startup can get quite complex especially when event timing and configurability are primary concerns. As the domain model is a constant factor of change, we decided to directly represent the data as a graph, eventually implementing our own Graph Store using CouchDB and GraphQL on top of Clojure. Yet the biggest obstacle to a maintainable and configurable software platform is to find a good representation for the plethora of interwoven business rules and according actions the platform needs to execute. Naturally, this is a good fit for a bunch of Finite State Machines we called the “Workflow Engine”. About Nicolas Forgerit Nico is a passionate software engineer who went a 10 year long journey of working at web agencies, small- and mid-scale startups and finally at a telefónica IoT startup. Being unamused about the ongoings there and in the overall European tech sector he decided to start an own software consulting business “hej.technology” together with an old friend from study times to help startups and mature businesses to succeed with their tech. How to Graph Your Data by Paula Gearon Whether it is Datomic, Neo4j, or RDF/SPARQL, many Clojure users have some familiarity with graph databases, but not everyone understands how and why these databases operate as they do. This can restrict how effective developers may be when creating data models and queries for graph databases, thus limiting their ability to make informed technology choices for data storage. This talk describes the implementation of a complete graph database written in Clojure and ClojureScript. We will discuss how various stores address the needs of indexing and storage for graph data. We will also look at how queries are evaluated, including the important question of query optimizers, both in local storage, and for distributed systems. These principles will be demonstrated at every stage with Asami: a Datomic-like graph database implementation that can run entirely within an application or in a web page. While the demonstration code of this talk will come from Asami, it will be compared and contrasted to other graph databases, including Datascript, Datomic, Mulgara and Jena. ➜ Watch on YouTube About Paula Gearon In her 9th year of Clojure development, Paula likes to work in the most technical parts of a system building the infrastructure that lets other developers do their jobs. She has been the technical lead on several commercial and open source projects, with a focus on data storage and processing, and was a lead editor for the SPARQL standard for accessing RDF databases. When not coding, she does triathlons, cooks, helps her children with homework, and mentors and supports young members of Women Who Code. Originally from Australia, she currently lives with her family in Virginia, in the USA. Reducing Accretion In Monoliths With Stream Processing by Sourabh Ghorpade and Akshay Gupta In this talk, we’ll look at how we migrated critical payment flows out of a monolithic order management system (OMS) to a framework in Clojure that composes event streaming, reliable task scheduling and configuration management in a harmonious way. These actors, in this Actor framework, are capable of processing over 100 million bookings per month. We will walk through why this framework is valuable handling varied asynchronous flows and how it helps keep the OMS simple by exposing well-defined contracts over Kafka. We will also talk about our journey in making the decision to write this framework and our ongoing effort to move large parts of Go-Jek’s Ride Hailing OMS into these smaller actors. ➜ Watch on YouTube About Sourabh Ghorpade Sourabh is a developer at GoJek and a recent recruit in the Clojure camp. He enjoys refactoring systems to scale better. He also feels writing about himself in the third person is rather narcissistic, but oh well. About Akshay Gupta Akshay is a member of Nilenso, an employee-owned software co-operative in Bangalore. He primarily writes Clojure and Go these days and has been helping the Transport division of Go-Jek since the past year. 3DF: Reactive Datalog for Datomic by Nikolas Göbel 3DF is a stream processing system which feeds off of Datomic’s transaction log and provides clients with the ability to register arbitrary Datalog queries, for which they will then continuously receive any changes to the result set. It does this efficiently by compiling Datalog queries to differential dataflows. Using 3DF on top of Datomic provides a powerful, reactive interface to Datomic, making it an even more attractive choice for the real-time web. It also opens up Datomic to non-JVM runtimes and processes without a peer cache, without sacrificing performance. Finally, it hints at the possibility of significantly speeding up functional UI frameworks like D3 and React, because it allows these systems to skip their own change detection. This talk will explore the „why?“, „how?“, and „what now?“ of working with a reactive database. ➜ Watch on YouTube About Nikolas Göbel I'm a software consultant and computer science graduate student at ETH Zurich. My current interest is in building languages and systems that make application programming more declarative. Our Journey from Elm and Elixir to Clojure by Martin Kavalar The Big Rewrite is generally considered to be a bad idea. Our experience has been different. We would like to share how Clojure sneaked in through the front(-end) door and why we ultimately decided to go full-stack, from Datomic to ClojureScript. Nextjournal is an integrated notebook-like platform with a focus on long-term reproducibility. Our team consisted of five language polyglots with only one member having had prior Clojure experience. Starting out, we chose Elixir for the backend and Elm for the frontend. This talk explores the journey building the platform. Specifically: what made us switch the frontend from Elm to JavaScript and ultimately to ClojureScript how our desire to leverage immutability accross the stack made us switch the database from Postgres to Datomic and the website from Phoenix to Pedestal how we streamlined and simplified our application by rewriting the code executing runner from Elixir to Clojure how Clojure’s repl-based live programming workflow tightened our feedback loops and made us more productive how tools.deps and figwheel.main improved our workflows after a long journey of trial & error Attendees will learn about the priorities and tradeoffs in the Elm, Elixir and Clojure communities and their effect on newcomers. ➜ Watch on YouTube About Martin Kavalar Martin Kavalar is a programmer with a degree in Physics interested in working at the intersection of science and industry. With his small team, he has been running Sauspiel, a web app for the traditional German card game Schafkopf, for over ten years. They are now leveraging that experience to build NextJournal, to facilitate collaboration, reproducibility and reuse in science. Music made simple by Thomas Kristensen There are now loads of Clojure libraries for composing and playing music out there. Some of them can be a bit intimidating to get started with, but in this talk we are going to explore how you can hook your laptop up to a synthesizer (or use the built-in one in your laptop) and begin experimenting with computer generated compositions without libraries at all! Clojure in itself, along with the JVM environment, contains all the things needed for having your laptop cranking out hard-hit'''
