full_description = "2020 Prelude 2020 February 27 Time Enjoy 09:00 International Clojure Data Science Meetup February 28 Time Enjoy 08:00 BOB 2020 18:30 Pre-conference welcome meet up at Nante Eck Talks 2020 February 29 We will have two tracks in parallel. To get updates about the schedule, please check our official twitter account. Time Gallery Loft 09:00 Registration (menu) 09:50 Conference Opening 10:00 Welcome & Introduction 10:30 Tommi Reiman:Malli: Inside Data-driven Schemas Christian Betz:Debugging AI 11:15 Dan Bunea:How to solve it? Complexity in code - Improving flow control through functional pipelines Lars Hupel:Programmation en Clojique 12:00 Erik Assum:Writing maintainable Clojure Nick Stares:Communicating the Impact of Youth Voter Registration Using Clojure and R 12:30 Lunch Break (menu) Lunch Break (menu) 13:30 Davide Taviani:Life in parens: simulating an ecosystem with Clojure Rahul Dé:Bob: A composable and inclusive platform making CI/CD Simple 14:15 Joanne Cheng:Making Geographic Maps with Clojure Jakub Dundalek:Shell Scripting Made Simple with Clojure 15:00 Vibhav Sarraf:Learning Clojure by making Multiplayer games Michiel Borkent:Babashka and the Small Clojure Interpreter: Using Clojure in new contexts. 15:30 Coffee Break (menu) Coffee Break (menu) 16:00 Paulus Esterhazy:Angels Singing: Writing for Programmers Maria Geller:Self-hosted ClojureScript: How to bootstrap a compiler? 16:45 Alexander Oloo:From Lazy Lisper to Confident Clojurist Malcolm Sparks:Fun with JSON 17:30 Kayla Lindner, Fabrizio Ferrai:Elevation of the Senses – A Life Performance 18:00 Lightning Talks 18:45 Get-Together at the Grand Bar (menu) Postlude 2020 March 1 Time Enjoy 11:00 Audible side effects: Clojure music gathering at :clojureD 2020 :clojureD Talks From Lazy Lisper to Confident Clojurist by Alexander Oloo The Clojure community is filled with really smart people, with great ideas writing very few tutorials and less documentation. At times it can be quite intimidating and discouraging. This talk is about how you can build your skill and confidence as a Clojure developer. As well as my journey from Pixie to Hylang and eventually Clojure. We’ll unpack how build your own path to Clojure confidence as well as some of the things I’ve learnt in my journey from being a lousy, lazy lisper to coding confidently to writing Clojure for the financial sector. It’s gonna be a goodie. All skill levels welcome. See you there! ➜ Watch on YouTube About Alexander Oloo Alex is an engineer by trade. A designer by necessity. And a jack of all trades for fun. He’s been write code for almost a decade. From Assembly to C and PHP to Node. Alex’s passion is learning new things as well as debugging systems, code, and people. Alex currently works a Design Director with the most awesome bunch humans at Absa Bank and dabbles in the startup life. Oh, and he writes Clojure. Lots of it. Debugging AI by Christian Betz Artificial intelligence is an old hat, a hype, a buzzword. But for actual use it is (almost) not comparable to traditionally developed software systems. The validation and debugging of machine learning is still in its infancy. In his lecture, Dr. Christian Betz will give a brief overview of the field of AI, explain the properties of different approaches to AI and show how to secure and test AI systems. ➜ Watch on YouTube About Christian Betz Christian is a long-standing AI specialist who has been co-author of AI systems since the 1990s and has already completed his doctorate in the field of AI. For Christian LISP was one of the first programming languages, now he designs, implements and optimizes systems from database level to frontend code. He's author of the sparkling lib to run Clojure code on Apache Spark, and of the neo4j-clj Clojure driver for the Neo4j graph database. He works as a software architect, project lead, CTO in the financial industry, for medical AI solutions, built AdTech solutions and (cyber) security systems. Now he designs and builds a solution for data42 for the analysis of networked data. How to solve it? Complexity in code - Improving flow control through functional pipelines by Dan Bunea Ever had a problem where the solution seems to have too many ifs, it’s hard to understand, everyone is afraid to touch the code and fixing bugs only seem to introduce more bugs? What if you could write the same code, no matter the paradigm (imperative, OOP, functional) in a manner where the code is easier to understand/debug and extend/change? I will be introducing functional pipelines, which some of us Clojure (or F#/Haskel) developers use every day, but are less known in the OOP world such as in Java/C#, where we could use the Either monad (I won’t talk about monads) where it can return either a SuccesResponse or an ErrorResponse. I will be introducing with code, 6 manners of solving the same problem from which 3 are using pipelines and I will be leading the audience to conclude for themselves whether using pipelines improves the code or not. ➜ Watch on YouTube About Dan Bunea Clojure lover and user in production for 5 years. Highly experienced software developer / system architect / team lead / technical manager with over 18 years of experience. Always pursuing simplicity (as the opposite of complexity) and not easiness, always looking for fast feedback. Pragmatic and on the hunt for efficiency. Always trying to lead by example, manage by consensus, always coaching and empowering other people. Always eager to learn. Life in parens: simulating an ecosystem with Clojure by Davide Taviani Nature is the sum of a large amount of complex ecosystems, where different species coexist in a fragile equilibrium. In this talk, we will simulate our very own ecosystem with Clojure, and explore emerging patterns under simple sets of rules. We will have the chance of creating our own little creatures and observe them thrive, compete and evolve, as they struggle for their own existence. ➜ Watch on YouTube About Davide Taviani Mathematician by education, Clojure developer by passion. An independent developer, he is passionate about sharing his knowledge with others (about Clojure and more), running Dungeons and Dragons sessions and walking in nature. Writing maintainable Clojure by Erik Assum A former colleague of mine once said, „Ah, I don’t need Simula to write object oriented code, I can do that in any language“. I’d like to paraphrase that and say, „Ah, I don’t need JavaScript to write messy code, I can do that in any language“. Writing quality software is hard, and even though Clojure is the best language I’ve used, it still doesn’t stop you from shooting yourself in the foot, it doesn’t stop you from writing messy code, and it most certainly lets you create all the bugs you’ll ever need, and then some. In this talk, I’ll use Ardoqs code base, along with other bits and pieces of Clojure code I’ve worked with (and written) to highlight principles that are important when writing software. I’ll demonstrate by example how the code at hand violates the principles, and offer clear refactorings which will make the the code easier to test, read, and reason about. The audience will walk away from this talk with tools that they can apply to their own codebases, be it in Clojure or other languages. ➜ Watch on YouTube About Erik Assum Erik works as a Clojure programmer at Ardoq, a Norwegian startup in the EA-space. He’s a mainly a backend programmer, but tends to work wherever the code is bad enough. Given time he’ll eventually drift into some sort of devops role while trying to figure out how to run the current project even better. Lately, he's been lurking around open-source Clojure projects looking for easy bugs to fix. This is his way of paying back to the community. Shell Scripting Made Simple with Clojure by Jakub Dundalek The command-line shell is an essential part of a developer toolbox. Many of our production systems depend on it. Shell scripts are used to tie together deployments and orchestrate cloud systems. However, shells accumulated lots of incidental complexity. There are many dark corners that surprise even seasoned programmers. Unix philosophy suggests writing scripts by composing smaller programs and piping plain text between them. In functional programming we compose functions and work with proper data structures, which is much more powerful. In this talk I will explore how a shell combining best of Bash and Clojure could look like. I will introduce Closh, a unix shell written in Clojure. You will learn how to leverage expressive and well designed language like Clojure on the command-line and combine it with existing programs. ➜ Watch on YouTube About Jakub Dundalek Jakub works for Pitch, where he helps to build a presentation tool of the future. In his spare time he likes to work on open source projects with interests including parsers and visualizations. Jakub is the creator of Closh, a Clojure-based unix shell. Making Geographic Maps with Clojure by Joanne Cheng Maps (the geographic kind) help us make sense of the world around us. They don’t just help us navigate an area, they can help us visualize patterns of a physical place. They can also be emotional. Maps can make us feel nostalgic for a place we’ve lived or visited and can trigger memories. After I moved to Berlin from the US last year, I challenged myself to make a series maps of my old home using Clojure to help me remember the place I lived. In this talk, I’ll share some of the maps I made and explain the different processes to make them and challenges I encountered. We’ll go over the open source tools used, new geographic file types, and different ways to present geographic data in 2D and 3D. ➜ Watch on YouTube About Joanne Cheng Joanne is a Clojure/ClojureScript engineer, currently working at Pitch in Berlin, Germany. She loves hiking, camping, and any activity* that involves spending time in nature. * - except for ones that involve snakes. Elevation of the Senses u2013 A Life Performance by Kayla Lindner & Fabrizio Ferrai Expressing feelings is hard. Understanding what’s happening inside of us is somewhat nebulous. And sometimes, all of that gets in the way of our focus and the things we want to do. So how can we bring ourselves fully alive with the tools that we know and love? Can we actually use code to our rescue and give space to our inner world through that? Turns out, yes, we can! And in this little audiovisual performance we’ll try to represent the whole inner spectrum of feelings, colours and shapes through vibrations and flashy lights. In other words, we’ll make sounds and show some moving pictures and we’d love to take you on this journey with us. One where the body is master, where sensory input guides the experience, and we can let ourselves free to fully experience what is not possible to convey through words and language. And we’d like you to relax, tune into your curiosity, your feelings, and maybe dance a little 🙂 ➜ Watch on YouTube About Kayla Lindner and Fabrizio Ferrai Kayla is a human being first and foremost. Clojure, Berlin and community are things that are close to her heart. She feels passionate about self-care, embodiment, human connection and co-creation. Fabrizio is a Software Engineer by education and musician by heart, living between Helsinki, Berlin and Sardinia. Lately he's into a funny combination of computer music, community building, programming language design and developer UX. You might want to talk to him about Dhall, PureScript, music and fractals. Together they realized they have the power to turn their lives into a living art project, by sitting right at the crossroad between programming, embodiment and community. Programmation en Clojique by Lars Hupel Prolog is this weird old language that established the paradigm of logic programming. Once heralded as the solution to all AI problems, it is now considered a niche language. Luckily, many languages have adopted ideas from Prolog, such as Clojure with core.logic. In this talk, I would like to introduce Prolog’s programming model and showcase some programming domains in which it allows for very concise, elegant programs. ➜ Watch on YouTube About Lars Hupel Lars is a consultant with INNOQ in Munich, Germany. He is known as one of the founders of the Typelevel initiative which is dedicated to providing principled, type-driven Scala libraries in a friendly, welcoming environment. A frequent conference speaker, he is active in the open source community, particularly in Scala. He also enjoys programming in and talking about Haskell, Prolog, and Rust. Fun with JSON by Malcolm Sparks Wow – how did the world manage to fall in love with the idea of nested maps and lists? Well, they have, so now it needs a language that can so easily process it. Enter JSONScript! (or to give it its proper name: Clojure). I’ll tell the story about how I used to complain about JSON but changed my mind. I’ll explain about JSON Schema, what it is and what it can do (with a demonstration of my new JSON Schema validator/processor, jinx). I’ll also demo jinx’s role in a brand new web library that I’m building on Metosin’s reitit: Apex. Apex turns OpenAPI documents into running web endpoints with reitit, with full OpenAPI and HTTP compliance. ➜ Watch on YouTube About Malcolm Sparks Malcolm Sparks is the Technical Director of JUXT, a Clojure engineering firm in the UK. Malcolm's open-source work includes libraries such as bidi, yada and tick. Self-hosted ClojureScript: How to bootstrap a compiler? by Maria Geller In 2015, the ClojureScript compiler underwent a big change with the outcome of being able to compile itself. But how is it possible for a compiler to compile itself? How can a compiler be written in the same language that it compiles? In this talk we will look into the concept of compiler bootstrapping, how it was done for the ClojureScript compiler and what we have to gain from a self-hosting compiler. ➜ Watch on YouTube About Maria Geller Maria is a Software Engineer working remotely at Pitch who is seeking a healthy balance between family, work and self-care. Babashka and the Small Clojure Interpreter: Using Clojure in new contexts. by Michiel Borkent What if you could avoid confusing bash syntax and replace it with a Clojure snippet here and there? What if executing a Clojure script could be as fast as executing a bash script? What if you could use Clojure expressions in a configuration file? What if you could evaluate a Clojure expression in the browser, even in an advanced compiled CLJS app? Meet Babashka and the Small Clojure Interpreter. ➜ Watch on YouTube About Michiel Borkent Michiel Borkent is a software developer and Clojurian. He can be found as @borkdude in various places on the web. Communicating the Impact of Youth Voter Registration Using Clojure and R by Nick Stares Can youth voter registration predict the outcome of the US presidential election? And can integrating R with Clojure help us do data science i"
