["https://clojuredocs.org/examples-styleguide"]
title = "Examples Style Guide | ClojureDocs - Community-Powered Clojure Documentation and Examples"
full_description = "The example sections on each var page are there to provide simple, isolated examples of var usage. In a nutshell, the examples you add to Clojuredocs should be easy to understand, and to help you with that we’ve outlined a few guidelines below. Examples should be short, unique, self-contained snippets of code that illustrate var usage in the simplest possible way. If the target var is not part of the core ns (or otherwise not used by default) please include the use / require statement. Each example should be either broad, or deep, not both. For example, the following example for not= shows the broad range of inputs allowed. Also, please mention any gotchas you feel are associated with your example (specifically) or the var (in general). Comments should be used to describe the following code block or blocks and/or point out bits of information that may not be obvious to new Clojure devs. ;; should be for a general comment about a block of code, ; should be used to add a comment to the end of a line of code. Using comments to differentiate code from context and output will help new Clojure devs match up the executable parts of your example in their REPLs. ;; The declaration can be shortened with “:keys” if your local variables should be ;; named in the same way as your keys in the map: Please follow the conventions outlined in this Scheme style guide, which follows Emacs’ (among others) indentation and formatting conventions. We realize that code style can often be largely dictated by personal preference, however, uniformity across examples on ClojureDocs is important. Lines should have a maximum width of 80 characters to prevent wrapping when displayed on ClojureDocs pages, and please indent with spaces, not tabs. Consider leaving one line of whitespace after output from the repl to make your examples easier to visually scan. Urls in examples source are automatically converted to links. Feel free to use them where appropriate to link to external resources."
year_published = 2025
clearnet = "https://clojuredocs.org/examples-styleguide"
