full_description = "Ubuntu Cloud Image Finder As Ubuntu Cloud Images are published to our various public cloud partners, this table will be updated. Type a few characters in the search box signifying what you’re searching for. For example if you would like to find out the Image ID for the latest release of “Trusty” Tahr to run on a “64″ bit “hvm” instance in the “us-east” region, you would search for “trusty 64 hvm us-east” or a subset thereof. As soon as you start typing into the search box, the list zooms-in on the entries that match your criteria. You may search based on any of the column headers below This Image finder only shows recommended image types. Cloud Zone Name Version Arch Instance Type Release ID Cloud Zone Name Version Arch Instance Type Release ID"
