["https://cloudberrylab.com/drive"]
title = "Map Cloud Storage as a Network Drive"
description = "CloudBerry Drive allows you to mount cloud storage as a network drive to your Windows desktop computer or Windows Server."
full_description = "CloudBerry Drive allows you to work with files in cloud storage directly from any file management utility, like Windows Explorer, as though they were located on your local computer. CloudBerry Drive comes with an easy installation and configuration that seamlessly integrates cloud storage of your choice as a external or network drive with the Windows environment. With CloudBerry Drive your cloud storage can be accessed as any other local, network or external drive on your computer, so you can easily move files to the cloud and back. Use cloud as a storage with other third party products and services you use every day: email agents, file managers, office applications and other. Simplify configuration, automate common tasks and integrate virtual drive with Command Line interface. Learn more about CLI with CloudBerry Drive. Configure the predefined set of HTTP headers for every upload and, thus, automate the setting of HTTP headers. Configure the number of threads used to transfer data to the cloud. You can upload and download multiple files in parallel."
year_published = 2021
year_updated = 2021
