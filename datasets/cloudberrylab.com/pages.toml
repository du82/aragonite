["https://cloudberrylab.com/resources/documentation/faq/msp360-backup"]
title = "FAQ | CloudBerry Backup | MSP360"
description = "Find answers to the most popular questions on configuration, usage, troubleshooting and licensing of CloudBerry Backup."
full_description = '''CloudBerry Backup FAQ CloudBerry Backup FAQ Installation Q: Does CloudBerry Backup support the macOS platform? A: Now CloudBerry Backup is available on macOS. You can download and learn more using this link. We support macOS starting from 10.8.x and only 64 bit. Q: Does CloudBerry Backup support the Linux platform? A: You can learn more about CloudBerry Backup for Linux and even download its 15-day trial version. Currently, it is running on Ubuntu 12/14/16; Suse 11/12; Red Hat 6.x/7.x; Fedora 12/21; CentOS 6/7; Oracle Linux 6.x/7.x and Debian 7.11/8.10/9.3. Licensing Q: If I purchase one license can I activate CloudBerry Backup on two computers? A: CloudBerry Backup is licensed per computer. If you want to run it on two computers you need to buy two licenses. Q: How can I move a license to another computer? A: To move the software to another server you will need to release the license in the Help menu on the old computer, then you can use it on the new computer. Q: I am a non-profit. How can I get a free license? A: We have been running a free license program for 3 years without much success. Now Individuals related to non-profit and education are eligible for a 30% discount which is still substantial. Fill in the form to request a discount. In very special cases, like a student from a developing country asking for a license, we can still consider granting it for free. Also, a non-profit organization has to contact us directly, we don't grant licenses to individuals and companies serving non-profits. Although we can discuss certain discounts. Q: I am a blogger. How can I get a free license? A: Download our software, evaluate it and make a blog post about it. Every product comes with a 15-day trial fully functional license. Once you made a blog post, fill in this form. We will grant you a license and post a link to your blog on the Media Coverage section of our website. Q: How much does it cost to use CloudBerry Backup? A: CloudBerry Backup is a subscription-based product. For example, Desktop Edition costs $29.99 (USD) and Windows Server Edition license is $109.99. You can find all the licenses under this link. You also have to pay cloud storage and transfer fees separately. Q: Is there a perpetual license for CloudBerry Backup? A: Perpetual licenses for CloudBerry Backup have been discontinued in December 2021. Q: Can I upgrade if I have a legacy perpetual license for CloudBerry Backup? A: Yes, you can upgrade to the latest version if you purchase annual maintenance which is 20% of the initial license cost. Q: I bought the maintenance but my product still says maintenance expired. A: Please use the following page to allocate the maintenance to your license. https://www.cloudberrylab.com/maint.aspx Q: Can I activate my license offline? A: Check out the link below to activate the license offline. https://www.msp360.com/offlineactivation.aspx Q: Where can I find detailed information on Amazon S3 storage costs? A: On Amazon S3 website Q: What does a network location mean? A: A network location is a network share (defined by a UNC path) such as \\computer1\share\ or a mapped drive linked to a network share. Q: What is the difference between Ultimate, Server and Desktop edition when it comes down to network locations? A: You need CloudBerry Backup Ultimate edition if you want to back up data from multiple computers using network shares (UNC paths) such as \\computer1\share\. In the Server edition, you are limited to 1 network shares, in the Desktop edition to 1 network share, while in the Ultimate version it is unlimited. Q: What does 1TB or 5TB storage limit mean? A: 1TB or 5TB limit means that you can at any time have at most 1TB or 5TB of data on the cloud account managed by CloudBerry Backup. E.g. you can upload 800 GB, then another 200GB, delete 300GB but you can't exceed the limit. Consider this way we are making our product affordable for users with lower storage requirements. If you want to back up more data you will need CloudBerry Backup Ultimate. Q: I need another more advanced edition. Can I upgrade by paying the difference or I need to buy at the full price? A: You can upgrade by paying the difference. We have an upgrade self-service that will allow you to get an upgrade link. Make sure to release the license in the Help menu before applying for the upgrade coupon. Q: Do you limit the functionality in the trial version of the product? A: No, the trial version comes with the same functionality as a paid version. If you have any issues with it turn to support. Configuration Q: What do I need to start using CloudBerry Backup? A: You need to have an account from one of the supported providers. For instance, it takes just a couple of minutes to get one on the Amazon S3 website. Q: Can I integrate CloudBerry Backup with my other routines? A: Yes, we have a command-line interface and a C# API. Each provided with documentation and examples. There is even a test app to demonstrate C# API capabilities Q: Can CloudBerry Backup use the NAS device as a backup destination? A: Yes, and you can learn more about this option and how to set custom credentials for network locations. Q: Can CloudBerry Backup copy the data immediately as it changes (e.g. new files are added or existing files are modified)? A: Yes, this is what we call Real-time backup. You can select this option in the Backup Wizard Scheduling step. By using a low-level Windows API this feature comes with zero impact on your computer performance However check out the limitations. In most cases, scheduled backup is a preferred method. Usage Q: Will CloudBerry Backup copy open files? A: Yes, CloudBerry Backup leverages Microsoft Volume Shadow Copy Technology to backup opened files Q: How does CloudBerry Backup minimize my costs? A: CloudBerry Backup offers optional data compression that helps to lower transfer and storage costs significantly. Besides CloudBerry Backup only copies files that have been changed since the last backup, thus transfer and storage costs should be minimum required Q: How does CloudBerry Backup secure my data? A: CloudBerry Backup offers several industry-standard strong encryption algorithms to protect your data. Also, you can optionally protect access to CloudBerry Backup with a master password. Besides, we support Server-Side Encryption for storage classes that have implemented this feature. Q: How does the master password work? A: The master password helps you protect your backup files from unauthorized access. Only someone who knows the master password can start CloudBerry Backup. The master password is optional and off by default Q: Does CloudBerry Backup copy all files every time it runs? A: No, CloudBerry Backup identifies files modified since the last backup and only copies such files. This makes subsequent backups run much faster Q: How does CloudBerry Backup recognize modified files? A: We are using timestamps to identify modified files Q: Can CloudBerry Backup copy only modify portions of the file? I want to backup my Outlook PST file, but it is 2GB and I don't want to copy the whole file every time. A: This is called block-level backup and it is fully supported with CloudBerry Backup Desktop edition and any other version of CloudBerry Backup Q: Does CloudBerry Backup keep older versions of the file? A: Yes, and this feature gives you an ability to restore a file to a certain point in the past. Q: Can I control how many versions of the file to keep? A: Yes, you can control how many versions to keep using Purge Options. Check out here for more details. Q: If I delete a file on my local computer with the “Delete files that have been deleted locally” option enabled is it deleted from the backup storage as well? A: Yes, the file will be deleted from the online storage too. By default, though, the file will remain in the online storage for 30 days to prevent accidental deletions. We call it Smart Delete. Troubleshooting Q: I am restoring the files on another computer. I have connected to my S3 account and bucket, but I don't see the files.> A: Register the same Amazon S3 account and choose the same bucket and the prefix in advanced settings. By default, the prefix is your old computer name. Specify the same encryption password as you used to back up the files. If you don't see the files which is unlikely, try to synchronize the database, go to Tools | Options | Advanced and click Synchronize Repository. Q: The program does not appear to start when I start the computer. A: CloudBerry Backup operates as a Windows Service. There is no need for the console to run when the computer starts and it doesn't have to run at all. You only need it for configuration and restore. The service will do the entire job. Q: The folders selected under the backup plan contain around 4000 files, but the "Files copied" field under the backup progress bar indicates that there are only 1000 files (says, e.g. 166 of 1000). A: CloudBerry Backup will copy the files in the chunks of 1000. Once the first 1000 is ready we will start the second one. Don't worry about that. Q: I am trying to backup to a Network Share and I face the “Path not found” error. What should I do? A: It seems like you should change the credentials for this Network Share: go Tools > Network Credentials within the backup client and make sure the credentials are valid. Not found what you're looking for? Contact our customer care team here.'''
