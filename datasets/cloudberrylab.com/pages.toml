["https://cloudberrylab.com/resources/documentation/cli-api/msp360-explorer"]
title = "CLI | CloudBerry Explorer | MSP360"
description = "Learn how to control the licensing of CloudBerry Explorer via a command-line interface."
full_description = '''CloudBerry Explorer Command Line Interface CloudBerry Explorer Command Line Interface In CloudBerry Explorer the user can control licensing via a command-line interface, we have developed. Further, we are overviewing the use-cases and scripts Activating CloudBerry Explorer To perform actions listed in this paragraph you need to start the command-line interface: Click on the Windows "Start" button. Type cmd.exe in the search line to run the Windows console, press "Enter". Change your current folder to the folder where CloudBerry Explorer has been installed, for example:cd "C:\Program Files\CloudBerryLab\CloudBerry Explorer for Amazon S3" Online Activation or Request Trial Activate license. (Email & key are required):"CloudBerry Explorer.exe" /activatelicense -k "license_key" -e "email"(where "email" is your email and "license_key" is the license key that you received when buying the product). Request a trial license."CloudBerry Explorer.exe" /activatelicense -t -tac "trial_activation_code" Offline Activation If you can't activate CloudBerry Explorer online you can use offline activation. Generate offline license request using your email and license key:"CloudBerry Explorer.exe" /activatelicense -k "license_key" -e "email" -or(where "email" is your email and "license_key" is the license key that you received when buying the product).As an output, you will get a service key. Send the service key to support@msp360.com. You will receive the activation key by email. Activate license key"CloudBerry Explorer.exe" /activatelicense -k "license_key" -e "email" -oa "activationkey_received"For time-limited license you need to specify -expire parameter with the date you received by email:"CloudBerry Explorer.exe" /activatelicense -k "license_key" -e "email" -oa "activationkey_received" -expire "YYYY-MM-DD" The product is activated. You can also request the trial using offline:"CloudBerry Explorer.exe" /activatelicense -or -t -tac "trial_activation_code"As an output, you will get a service key. Then run the command:"CloudBerry Explorer.exe" /activatelicense -t -oa "activationkey_received" Release License "CloudBerry Explorer.exe" /releaselicense Not found what you're looking for? Contact our customer care team here.'''
year_published = 2018
