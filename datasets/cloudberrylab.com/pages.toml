["https://cloudberrylab.com/resources/blog/item-level-restore-from-an-image-based-backup-with-msp360-managed-backup"]
title = "Item-Level Restore from an Image-Based Backup with MSP360"
description = "Sometimes you don’t need to restore the whole system but need just a single file or folder that was saved within the image-based backup dataset."
full_description = '''Other Guides MSP360 Products HIDE BAR SHOW BAR LESSON 1 Item-Level Restore from Image-Based Backup with MSP360 Managed Backup ON-DEMAND CONTENT Downloadable Assets Item-Level Restore from Image-Based Backup with MSP360 Managed Backup Image-based backup is a type of backup that should be done regularly. If something goes wrong, with an image-based backup you can restore your system with all its files, applications, preferences, etc., to avoid downtime and ensure business continuity. Sometimes, however, you don’t need to restore the whole system but need just a single file or folder (we’ll call it “an item”) that was saved within the image-based backup dataset. In this guide, we’ll show how to restore an item or several items with MSP360 Managed Backup. Please note: when you recover an item from an image-based backup, you download this item only, not the whole image, so that the restore process is fast. Run the MSP360 Managed Backup agent on the backed-up machine. Proceed to the Backup Storage tab. You’ll see a list of all your storages with all the backups saved. Find the image you want to extract an item from. If there are several restore points, choose the one that contains the right version of your item. In the right-hand pane, expand the restore point contents. Find the item you want to restore. Right-click on it and select Quick Restore. Once you click Quick Restore, a new window will appear. Specify the restore destination. After you click Select Folder, MSP360 Managed Backup will create and run a one-time restore plan for the item you’ve chosen. In a short while, your plan will finish and the item will appear in the folder you’ve specified. The restore plan for this item will be deleted automatically upon completion. As you can see, the item-level restore process in MSP360 Managed Backup is extremely easy and quick. You can pull out any file or folder from your image-based backup in just a few clicks, without restoring the whole image. If you have any remaining questions or would like to know more, please contact our team. MSP360 Managed Backup. Simple. Reliable. Powerful cross-platform backup and disaster recovery that leverages the public cloud to enable a comprehensive data protection strategy. hbspt.cta.load(5442029, 'a66a2951-01d1-4eb1-b85f-2cde088192f2', {}); /* <![CDATA[ */ var leadin_wordpress = {"userRole":"visitor","pageType":"post","leadinPluginVersion":"10.2.23"}; /* ]]> */ Home Resources • Support • Company • Sitemap MSP360™ Products MSP360 Managed Backup • MSP360 Connect • MSP360 RMM Standalone MSP360 Backup • CloudBerry Explorer • CloudBerry Drive • Free Products Support Help Center • Web Help • Forum • Contact Media Press Center • Downloads • Contact Company About • Legal Information • Reseller Program • Privacy Policy • GDPR Compliance .cbl-rating { display: flex; justify-content: space-between; align-items: flex-end } .cbl-rating__rating { color: #555; font-size: 16px; line-height: 24px; width: 35px; text-align: right; position: relative } .cbl-rating__stars { display: flex; justify-content: center; align-items: center; margin-right: 8px } .cbl-rating__stars .v-icon { width: 30px; height: 30px } .cbl-rating_reduced .cbl-rating__stars .v-icon { width: 20px; height: 20px } .cbl-rating_reduced .cbl-rating__rating { font-size: 14px; line-height: 20px; width: 34px } .cbl-rating__star_muted { opacity: .25 } .cbl-rating__star_half-muted { position: relative } .cbl-rating__star_half-muted:after { background-color: #f9faff; content: " "; display: block; position: absolute; width: 15px; height: 30px; top: 0; right: 0; opacity: .75 } .cbl-review { background-color: #fff; border: 1px solid #cce7f5; border-radius: 6px; display: block; padding: 20px; margin-top: 30px; margin-left: auto; margin-right: auto; max-width: 450px; min-height: 320px; position: relative; transition: transform .2s ease } .cbl-review_zoom:hover { transform: scale(1.05) } .cbl-review__content-container { display: flex; flex