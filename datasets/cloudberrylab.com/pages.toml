full_description = '''These Terms and Conditions sets forth the general terms and conditions of your use of MSP360TM website and any of its products or services. This EULA is a legally binding agreement setting forth the terms and conditions governing the use and operation of any of MSP360's products, services, and its documentation including any pre-release or beta versions of the software. This Privacy Policy explains how MSP360TM gathers and processes personal data you provide to us. MSP360TM recognizes the importance of protecting your personal information and is committed to safeguarding your privacy online. The EU General Data Protection Regulation (GDPR) protects the rights of individuals regarding the privacy and security of their personal data. Our GDPR Compliance Statement outlines MSP360TM's commitment to ensuring the security and protection of the personal information. If any questions, check out the GDPR FAQ. This Data Processing Agreement, or DPA, is an agreement between MSP360 and a data processor (such as a third-party service provider). It regulates personal data processing conducted for business purposes. This Service Agreement contains the terms, conditions, rights, and limitations associated with your use of MSP360TM Managed Backup Service. This Service-Level Agreement (SLA) is a contract between MSP360 and its customers that documents what services we will deliver and defines the service standards we are obligated to meet. The California Consumer Privacy Act (CCPA) covers consumer rights relating to the access to, deletion of, and sharing of personal information that is collected by MSP360. This Reseller Agreement outlines the rights and responsibilities between MSP360 and person or business wanting the right to sell or license the software to third parties (the "reseller"). A software reseller agreement is sometimes referred to as a "software distributor agreement" or a "software distribution agreement". This List of Subprocessors declares a cu