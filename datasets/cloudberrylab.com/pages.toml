full_description = "CloudBerry Explorer provides a user interface allowing to access, move and manage files across your local storage and the cloud storage of your choice. Cloud file management software by MSP360™ is available in two versions: Freeware and PRO. Freeware version. Free cloud storage manager by MSP360™ comes with all the basic functionality including cloud storage account access, file/folder transfer, resumable upload and more. PRO version. Comes with all the features of the freeware version plus advanced features like client-side encryption, compression, multipart upload, multithreading, content compare, upload rules and more. With CloudBerry Explorer you decide where to store your data: Amazon S3, Google Cloud, Microsoft Azure, or another popular storage option. CloudBerry Explorer provides a user interface allowing to access, move and manage files across your local storage and the cloud storage of your choice. CloudBerry Explorer doesn’t process your data on third-party servers. All data transfers occur between the source instance and a storage account you control. Enable extra security for your data with a unique user password and encryption before sending files to the cloud. Manage access permission to any of your objects by setting up 'Access Control List'. ACL will also apply to all 'child objects' inside containers. Optionally enable encryption and compression for selected buckets and also configure the predefined set of HTTP headers for every upload."
