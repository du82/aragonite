["https://cloudberrylab.com/resources/documentation/faq/msp360-backup-apps"]
title = "FAQ | MSP360 Backup for Apps | MSP360"
description = "Find answers to the most popular questions on configuration, usage and licensing of MSP360 Backup for Apps."
full_description = "MSP360 Backup Apps FAQ MSP360 Backup Apps FAQ Configuration Q: What do I need to start using MSP360 Office 365/G Suite Backup? A: You need to have a domain admin account and your storage account. Currently, three storage account types are supported - Amazon S3, MS Azure, BackBlaze B2. Usage Q: What is the backup schedule? A: 4 daily backups start automatically every 6 hours. Q: I restored selected emails. Why I couldn’t find them in my account. A: Selected emails are restored to the Restore folder in your account. Q: How secure is MSP360 Office 365/G Suite Backup? A: All stored data is encrypted with the 256-bit Advanced Encryption Standard (AES) with a unique user-owned encryption key. Q: Can I access my backups if my Office 365/G Suite domain is deleted? A: You can access your backup account with an alternate email address. Q: Do I lose my backup data if the license runs out? A: Although regular backups will no longer be done, you won’t lose any of the backup data you already have. Q: What is your default retention policy? A: By default, we store your data forever. Q: Do you store all of the older backup versions? A: Yes, you can come back to any of the previous states of your data. Q: Can I restrict my admin’s access to backup content? A: Yes, we use role-based access control (RBAC): global admin has full access while administrators with user management roles can’t access the user’s backup contents. Q: Can I track user actions within my domain? A: Yes, the audit log is available. Q: Can I backup Google Team Drives? A: Yes, Team Drives backup is available and requires purchasing a Team Drive backup license which costs $20 per month. Q: Can I backup Office 365 public folders? A: MSP360 backs up Office 365 public folders. In order to back up public folders, you should purchase a user license for a public folder mailbox. Q: Can I backup Office 365 shared mailboxes? A: Yes, MSP360 backs up Office 365 shared mailboxes. 1 shared mailbox requires purchasing 1 user license. Q: Can I backup SharePoint online? A: Yes, SharePoint backup is available and requires purchasing a SharePoint backup license which costs $20 per month. Q: Does MSP360 backup all SharePoint sites and subsites? A: Yes, MSP360 backs up all SharePoint sites and subsites. Q: Does MSP360 backup Office 365 groups? A: Yes, Office 365 group backup is available on the SharePoint backup page. To back up Office 365 groups you need to purchase a SharePoint backup license which costs $20 per month. Q: Does MSP360 Office 365/G Suite Backup copy all files every time it runs? A: No, MSP360 Backup identifies files modified since the last backup and only copies such files. This makes subsequent backups run much faster. Licensing Q: How much does it cost to use MSP360 Office 365/G Suite Backup? A: There are 3 subscription types: 1-month subscription. 1 user - $3 per month. SharePoint/TeamDrive license - $20 per month. 6-month subscription. 1 user - $15 per 6 months. SharePoint/TeamDrive license - $120 per 6 months. Annual subscription. 1 user - $24 per 1 year. SharePoint/TeamDrive license - $240 per 1 year. Q: Can I purchase additional licenses If I already subscribed to the service? A: Yes, Additional purchases are available on the Payments page in the service. Not found what you're looking for? Contact our customer care team here."
