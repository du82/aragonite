["https://cloudberrylab.com/company/legal/gdpr"]
title = "GDPR Compliance Statement"
description = "MSP360 GDPR Statement includes development and implementation of new data protection roles, policies, procedures to ensure maximum and ongoing compliance."
full_description = 'The EU General Data Protection Regulation (“GDPR”) came into force across the European Union on May 25, 2018 and brought with it significant changes to data protection law. Based on privacy by design and taking a risk-based approach, the GDPR is designed to meet the requirements of the digital age. The 21st Century brings with it broader use of technology, new definitions of what constitutes personal data, and a vast increase in cross-border data processing. The GDPR aims to standardize data protection laws and processing across the EU; affording individuals stronger, more consistent rights to access and control their personal information. MSP360 ("MSP360", "us", "we" or "our") is dedicated to safeguarding the personal information under our control and developing a data protection plan that is effective, fit for purpose and demonstrate an understanding of, and appreciation for the GDPR. Our GDPR actions to date and continuing objectives for GDPR compliance are summarized in this statement and include the development and implementation of data protection roles, policies, procedures, controls and measures to ensure maximum and ongoing compliance. In addition to the policies and procedures mentioned above that ensure individuals can enforce their data protection rights, we provide easy to access information via our website for an individual’s right to access any personal information that MSP360 processes about them and to request information about: MSP360 takes the privacy and security of individuals and their personal information very seriously and take every reasonable measure and precaution to protect and secure the personal data that we process. We have robust information security policies and procedures in place to protect personal information from unauthorized access, alteration, disclosure or destruction and have several layers of security measures, including: SSL, access controls, password policy, encryption, pseudonymization, best practices, data restriction, and IT authentication.'
