["https://cloudberrylab.com/resources/documentation/faq/gdpr"]
title = "FAQ | GDPR | MSP360™"
description = "Find answers to the most popular questions related to collecting and processing personal data by MSP360 and GDPR compliance."
full_description = "GDPR FAQ GDPR FAQ Q: What is the GDPR? A: The General Data Protection Regulation (GDPR) is a regulation in EU law on data protection and privacy for all residents within the European Union. It requires businesses to protect the personal data and privacy of EU citizens. It also requires that companies have appropriate data security in place to protect personal data. The GDPR comes into force on May 25, 2018. Q: Whom does the GDPR affect? A: The GDPR not only applies to companies located within the EU but it also applies to companies located outside of the EU if they offer services to, or monitor the behavior of, EU data subjects. Q: Is MSP360™ compliant with GDPR requirements? A: Yes. Q: Does MSP360™ collect and process personal data? A: Yes. Being a service provider we require some personal information to identify you as a customer. Q: What personal data does MSP360™ collect and hold? A: The categories are as follows: First and last name, email, phone number, company name, and location. You are requested to specify a set of personal data and agree to submit it to us to provide you with selected products and services. Q: What are the purposes of the processing? A: The requested personal information is necessary for providing registration and to personally identify you as a customer for our services, products, and offerings. It may be collected and used for a sign-up or licensing form, a webinar/demo/call back request, whitepaper or case study request, or for gathering diagnostic logs. Q: Where do you store customer information (e.g. email, name)? A: The account information is stored and secured in data centers located in the United States. Note: Data from customer backups is stored on the customer’s own backup storage (e.g. Amazon S3, Microsoft Azure, Google Cloud Storage, local disk, etc.). All data transfers are encrypted and customers can elect to use data encryption for best security. Q: What are the recipients to whom the personal data has / will be disclosed? A: We may disclose your personal information to trusted third parties who act for or on our behalf for further processing (such as storage or payment systems) and if we determine that such disclosure is reasonably necessary to comply with the law. In all other cases, we don’t share or distribute your personal data. Q: How long does MSP360™ intend to store collected personal data? A: Personal data is stored as long as you use our service. Once you decide to stop using the service, we can completely remove the account from our service database. Also, you can ask to restrict processing in accordance with data protection laws, as well as to object to any direct marketing from us and to be informed about any automated notifications that we use. You can elect not to receive marketing communications by following the unsubscribe instruction in such communications. For questions about your personal information retention, please contact gdpr@msp360.com. We will respond to your inquiry within 30 days. Q: How to control changes of personal information? A: If your personal information changes, please contact us at gdpr@msp360.com. We will respond to your inquiry within 30 days. For registered MSP360 Managed Backup Service customers, we provide web console where customers can review, update and correct personal information in your account profile. Q: How does MSP360™ secure my data? A: By submitting personal information (like name, address, company name, email, and phone), you consent for transferring, storing and processing of such information by MSP360™. We provide the security of your personal information by using an SSL certificate on transfers and we store the provided information on secure servers provided by Amazon. Q: Contact us A: If you have any queries or questions about our compliance with the GDPR, please email us at gdpr@msp360.com. Not found what you're looking for? Contact our customer care team here."
