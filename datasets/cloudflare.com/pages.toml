["https://cloudflare.com/case-studies/sansan"]
title = "Sansan & Cloudflare | Customer Story | Cloudflare"
description = "Sansan transitioned from multiple web application firewalls (WAFs) to a single, integrated solution with Cloudflare WAF,Bot Management, and Advanced DDoS Protection."
full_description = '''Founded in 2007 with the mission of "Turning encounters into innovation”, Sansan provides digital transformation services to change work style with “Sansan” - digital transformation service for sales team, “Eight” - business card management service, “Bill One” - invoice management service, “Contract One” - database for contract info, not limited for Japan, but also for foreign countries. Sansan has 1,759 employees as of August 31 in 2024, and is expanding more. In the past, individual teams at Sansan selected security solutions based on the business scale of each service they provided. This approach limited in-house team members' ability to manage certain vendor solutions, forcing them to rely on outsourced support. Additionally, siloed operations hindered the development of internal knowledge and expertise. In many cases, web application firewall (WAF) costs were tied to the cost structure of each service. As a result, even when WAFs were planned for security reasons, cost constraints forced each individual project at Sansan to choose a lower cost WAF solution. To address these challenges, Sansan turned to Cloudflare. Cloudflare offers a cloud-native delivery model that is suitable for comprehensive deployment across departments. Sansan planned a company-wide deployment of Cloudflare WAF. Over six months, the company migrated all of its major services to Cloudflare WAF, With help from the Cloudflare solution, teams detected approximately 45.2 million attacks per month, effectively safeguarding their services. Takeshi Matsuda, security engineer at Sansan, commented on the move to Cloudflare: "Although Sansan's services use a wide range of IaaS platforms and architectures, including VMs, containers, and serverless, we could easily integrate Cloudflare's cloud-based architecture across our multi-cloud environment without any issues." Before the Cloudflare rollout, each service department kept separate logs, making it difficult to perform log monitoring on a company-wide level. When an incident occurred, the security department had to request logs from each responsible department to conduct detailed investigations. In addition to it, the format of logs were not uniformed.'''
