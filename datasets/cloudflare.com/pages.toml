["https://cloudflare.com/case-studies/rightblogger"]
title = "RightBlogger - Customer story | Cloudflare"
description = "RightBlogger delivers strong performance for global users and protects AI-powered content tools."
full_description = "RightBlogger was founded in 2023 by two bloggers who wanted to provide other content creators with everything needed to research, produce, and promote content. The company offers a rich portfolio with more than 80 AI-powered tools that empower people to write engaging articles, conduct strategic keyword research, and more. Users across the US, western Europe, and India are readily adopting these tools to create new content and optimize their marketing workflows. “RightBlogger offers the tools we wish we had — but couldn’t always afford — when we started as content creators,” says Ryan Robinson, co-founder and head of marketing. From the beginning, delivering exceptional performance to users has been the highest priority — and also an increasing challenge. While the company’s database and servers are located in the US, RightBlogger has a large and growing customer base on the other side of the planet. The team needs to deliver results from AI-powered tools fast, no matter where users are located. Past experiences with Cloudflare led RightBlogger founders Ryan Robinson and Andy Feliciotti to build their company website on the platform. “I use Cloudflare for every project I create online,” says Feliciotti, RightBlogger’s co-founder and head of product. “So it was an easy decision to use Cloudflare for RightBlogger.” The team capitalized on Cloudflare’s pay-as-you-go model, which enables even small businesses like RightBlogger to instantly access a wide range of performance and security services. From the outset, RightBlogger benefited from Cloudflare’s massive content delivery network (CDN), which maximizes site responsiveness by caching frequently requested content close to users. “Performance is why Cloudflare is such a huge part of our business,” says Feliciotti, “Our entire application is based on JavaScript, so we can cache nearly everything. Approximately 70% of the traffic to RightBlogger is currently cached via Cloudflare. The caching makes it really easy for us to optimize performance for our global users.”"
