["https://cloudflare.com/case-studies/soracom"]
title = "Soracom & Cloudflare | Customer Story | Cloudflare"
description = "IoT connectivity provider Soracom improves the stability and performance of their dashboard service while increasing development efficiency"
full_description = "Soracom is dedicated to democratizing the Internet of Things (IoT), making it possible for anyone to turn IoT ideas into reality. Offering multi-carrier cellular connectivity, the company enables organizations to connect and manage IoT devices and machine-to-machine (M2M) sensors, at scale, all over the world. Currently more than 6 million devices are connected through Soracom worldwide. Though headquartered in Japan, the company also has locations in the United States and United Kingdom, with a global team of 150 employees. The engineering team responsible for developing new services works as one cohesive unit, seamlessly collaborating across multiple time zones. Together, these engineers continuously enhance the Soracom platform and support a wide variety of services, including services that provide private connections to cloud environments, inline data processing, secure device provisioning, remote device access, and more. Soracom gives customers an easy way to visualize data collected from IoT devices through Soracom Lagoon — a customizable dashboard service. Lagoon also includes an alert feature that notifies users when data traffic exceeds certain thresholds. Traffic spikes are not uncommon: IoT systems and businesses can experience explosive growth in the number of clients after a commercial launch. Soracom had to make sure the company’s own cloud-based infrastructure could handle the sudden increases in data traffic that trigger customer alerts. “Soracom Lagoon uses a multi-tenant architecture, so we needed to ensure that a sudden spike in access from one account wouldn’t impact the whole service,” says Christian Inkster, principal software engineer at Soracom. “Specifically, we had to find a way to cache responses for POST requests — which usually aren’t cached — in a distributed manner.” As Soracom worked to maintain reliable dashboard experiences, the company also wanted to accelerate delivery of new features and services by streamlining software development. Soracom provides developers with access to subdomains within a development environment. But developers often had to wait for those subdomains to be allocated. “Managing fine-grained control over the development environment took time, and that led to significant waits during simultaneous testing,” says Inkster. “We needed a way to improve the efficiency of providing secure access to resources.”"
