["https://cloudflare.com/case-studies/volcano-studio"]
title = "Volcano Studio & Cloudflare | Customer Story | Cloudflare"
description = "Volcano Studio builds a blockchain-based gaming experience on the Cloudflare platform, while enhancing security, improving reliability and performance, and controlling costs."
full_description = 'Volcano Studio is a game development company that created ChickCoop, a blockchain game integrated with AI Agents. They provide an engaging, easy-to-access gaming experience to millions of users around the world. The studio serves both traditional Internet users who are curious about blockchain technology but lack prior experience, as well as existing Web3 users. ChickCoop is accessed directly on Telegram. Volcano Studio has found that users enjoy the convenience of accessing a game without needing to download additional apps. "The engaging gameplay and compatibility with their daily communication on Telegram make it a unique offering," says Kane, founder and CEO of Volcano Studio. "With a seamless user interface and a focus on fun and interaction, our game caters to users who enjoy quick and entertaining activities on apps they already use." With a lean team of about 50 employees and with millions of users to serve, Volcano Studio needed to move fast and control expenses while serving a worldwide customer base. And they had to build on Web3 technology, yet support Web2 customers. One of the biggest challenges was infrastructure cost. "Traditional cloud platforms require significant upfront investment and ongoing operational costs for running game servers, databases, and scaling infrastructure. These costs quickly become prohibitive. Cloudflare R2 solved the infrastructure costs issue with free egress and simpler pricing, making our infrastructure more cost-effective as we scale,” says Kane. “These costs could quickly become prohibitive." Volcano Studio was relying on Amazon Web Services (AWS), but expenses for content delivery were scaling linearly with their customer base, making rapid growth cost-prohibitive. The AWS pricing structure was also complex, and they found themselves paying high egress fees while using S3 for object storage. The team wanted to simplify pricing and implement a cost model that would not restrain fast growth. Volcano Studio turned to Cloudflare for infrastructure cost savings. They migrated from AWS S3 and CloudFront to Cloudflare R2 and the Cloudflare content delivery network (CDN). "Cloudflare R2 solved the infrastructure costs issue with free egress and simpler pricing, making our infrastructure more cost-effective as we scale," says Kane.'
