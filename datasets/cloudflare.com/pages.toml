["https://cloudflare.com/diversity-equity-and-inclusion"]
title = "Diversity, Equity, & Inclusion at Cloudflare | Cloudflare"
description = "This is Cloudflare’s webpage to show some of the work we have done to make the company more diverse, equitable, and inclusive."
full_description = '''“Diversity, inclusion, and equity are not things that are just nice to have; they are essential to the success of Cloudflare's business. The reason is simple. Diverse teams are more effective, innovative, and better positioned to drive growth, and without an equitable and inclusive working environment, our diverse teams won’t succeed. Cloudflare's mission is to help build a better Internet, and in order to do this we need a range of perspectives and approaches. Since founding Cloudflare we set out to cultivate and maintain an inclusive workplace which empowers all employees to show up, as their full selves, and do their best work." Culture is defined by the behaviors you reward. We created the Cloudflare Capabilities so we could be open and clear about the behaviors that get rewarded at Cloudflare. They are the bedrock of our culture. We use them when making hiring decisions, evaluating performance or considering promotions. They are an important part of our DEI work as they provide the foundation to help build a more welcoming and inclusive culture where everyone can build the career of their dreams. Over the years, we've been working hard to better understand the makeup of our teams and increase our diversity. We are proud to have reached a point where we are ready to publish Cloudflare’s employee representation data and share how we are working to diversify our teams. Data presented here reflects only the information shared by employees who volunteer to disclose their representation data. An important component of our DEI strategy is to grow a diverse talent pool for our opportunities. To do so, we have diversity Recruiting partnership programs with organizations to reach underrepresented groups, including the following and more: We also support returnships through our partnerships to provide opportunities to mothers or people who have taken a career break to care for a loved one. Our partnerships include the following organizations: In order to recruit employees of a broad variety of backgrounds, we must encourage inclusive recruiting practices. Cloudflare’s Recruiting team works closely with hiring managers to make job descriptions clear, detailed, welcoming, and inclusive. Hiring Managers also ensure that all candidates have the same experience and sets of questions asked/focus areas covered in their interviews so the process is fair and equitable for all.'''
