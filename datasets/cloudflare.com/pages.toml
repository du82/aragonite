full_description = 'Cloudflare, 2024년 주요 인터넷 동향 발표 신규 데이터에 따르면 정부가 주도한 인터넷 셧다운이 사상 최고치를 기록했으며, 도박 및 게임 업계를 겨냥한 악성 트래픽 및 사이버 공격이 증가했습니다 캘리포니아주 샌프란시스코, 2024년 12월 9일 – 주요 클라우드 연결성 기업인 Cloudflare, Inc.(NYSE: NET)에서는 오늘 제5차 연례 검토 결과를 발표했으며, 글로벌 인터넷 인사이트 및 보안 동향을 분석하고, 2024년 한 해 동안 가장 인기 있었던 인터넷 서비스에 대한 심층 분석을 수행했습니다. 인터넷은 전 세계를 연결하는 초석이자 우리의 일상 생활을 지원하는 중요한 정보와 서비스에 대한 액세스를 제공합니다. 인터넷에 대한 이러한 의존성은 응급 구조대가 생명을 구하고, 지역 주민들이 선출된 공직자들과 소통하고 유권자 등록을 하는 데 도움이 되거나 글로벌 디지털 경제를 지원하는 등 오늘날 사회의 근간이 되고 있습니다. Cloudflare의 2024년 연례 검토에서는 매년 더 많은 사람과 장치가 인터넷에 연결되어 글로벌 트래픽의 증가(전년 대비 17% 증가)를 주도하고, 인터넷의 역량에 대한 우리의 글로벌 의존성을 보여 주는 새로운 트렌드가 나타나고 있음을 강조합니다. "우리는 인터넷을 거의 항상 사용하고 있지만, 아직도 많은 사람들은 인터넷을 단순히 웹 페이지의 모음으로만 생각합니다. 하지만 인터넷은 소셜 미디어에서의 상호작용, 스마트 냉장고와 진공청소기, 차량 공유 애플리케이션을 통한 이동, 은행 연결 등 현대적인 일상의 거의 모든 활동 어디에나 존재합니다.”라고 Cloudflare의 CEO 겸 공동 설립자 Mattew Prince는 말합니다. “우리가 당연하게 여기는 경우가 많은 이러한 모든 상호작용은 보이지 않는 곳에서 어떤 식으로든 인터넷에 연결되어 있습니다. 그리고 그 중 상당수가 매 순간 Cloudflare의 네트워크를 통해 이루어지고 있습니다. 또한 세계 최대 규모의 Cloudflare의 전역 네트워크는 전반적인 웹 사용량과 품질 및 연결성에 대한 탁월한 종합적인 관점을 보유하고 있습니다.” Cloudflare는 연례 검토 보고서를 통해 변화하는 인터넷 환경에 대한 핵심 데이터 인사이트를 공유하여 온라인 세상에 더 많은 정보를 제공하고, 복원력과 보안을 보장하는 데 기여하고자 합니다. 2024년의 가장 큰 특징은 다음과 같습니다. 가장 인기 있는 인터넷 서비스: Google이 3년 연속으로 1위를 차지했고, Facebook(2위), Apple(3위), TikTok(4위)이 2023년과 동일한 순위로 그 뒤를 이었습니다. 하지만 WhatsApp이 전 세계에서 가장 인기 있는 서비스 10위권에 최초로 진입했습니다. * 가장 인기 있는 생성형 AI 서비스: Codeium, Claude, CoPilot이 가장 인기 있는 생성형 AI 서비스의 10위권에 새롭게 진입했으며(각각 3위, 5위, 7위), OpenAI는 2년 연속으로 1위 자리를 지켰습니다. 가장 인기 있는 게임 서비스: 게임 소비자들로 인해 Steam이 최초로 가장 인기 있는 서비스 5위권에 진입했으며, Minecraft도 올해 10위권에 진입했습니다. 한편, Roblox는 4년 연속으로 1위를 차지했습니다. 가장 많이 표적이 된 산업: 전 세계적으로 게임 및 도박 산업이 위협 행위자의 주요 표적이 되어, 2023년 가장 공격을 많이 받은 금융 산업을 제치고 1위를 차지했습니다. 특히 Super Bowl을 앞둔 미국에서 몇 주 동안 위협이 크게 증가한 것으로 나타났습니다. 인터넷 중단 관측: 전 세계 인터넷 중단의 절반 이상이 시위, 민간 소요사태에 대응하거나 시험 중 부정행위를 방지하기 위해 정부가 주도한 셧다운으로 인해 발생했으며, 이는 모잠비크, 이라크, 시리아, 방글라데시, 세네갈, 파키스탄 등의 국가에 영향을 미쳤습니다. 악성 트래픽: 인터넷은 작년 한 해 동안 크게 위험해지지는 않았습니다. 전 세계 트래픽의 약 6.5%가 잠재적 악성 트래픽으로 판단되어 완화되었으며, 이는 2023년에 비해 소폭 증가한 수치입니다. 가장 공격적인 AI 봇: AI 봇과 크롤러는 콘텐츠를 탐욕스럽게 소비하는 것으로 뉴스에 보도되었습니다. Bytespider(ByteDance)와 ClaudeBot(Anthropic)이 가장 활동적이었지만, 두 봇 모두 한 해 동안 전반적인 트래픽이 점차 감소했습니다. “Cloudflare Radar는 팬데믹이 인터넷 상호작용 방식에 미친 엄청난 영향을 목격하면서, 이러한 인사이트가 누구에게나 접근 가능해야 한다는 중요성을 깨닫고 2020년에 출시되었습니다.”라고 Cloudflare의 데이터 인사이트 책임자 David Belson은 말합니다. “연례 검토는 Cloudflare의 데이터를 대중화하려는 Radar의 노력의 일환으로, 누구나 손쉽게 인터넷 동향과 패턴을 살펴볼 수 있는 창을 제공합니다.” 이 데이터는 누구나 인터넷 전반의 글로벌 동향과 인사이트를 볼 수 있는 무료 도구인 Cloudflare Radar에서 가져온 것입니다. Radar는 Cloudflare의 전역 네트워크(120여 개 국가의 330여 개 도시를 아우르는 세계 최대 네트워크)의 데이터와 빠른 비공개 인터넷 브라우징 방식으로 널리 사용되고 있는 Cloudflare의 1.1.1.1 공용 DNS 리졸버에서 집계 및 익명화된 데이터로 구동됩니다. Cloudflare의 연례 검토에 대해 자세히 알아보려면 다음 자료를 확인하세요. 블로그: Cloudflare 2024년 연례 검토 블로그: 2024년 가장 인기 있는 인터넷 서비스 2024 연례 검토 마이크로사이트 Cloudflare 소개 Cloudflare, Inc.(NYSE: NET)는 주요 클라우드 연결성 기업입니다. Cloudflare에서 지원하는 조직에서는 복잡성과 비용을 줄이면서 직원, 애플리케이션, 네트워크를 어디에서든 더 빠르게 하고 더 안전하게 보호할 수 있습니다. Cloudflare의 클라우드 연결성은 클라우드 네이티브 제품 및 개발자 도구로 구성된 가장 완전한 기능의 통합 플랫폼을 제공하므로 모든 조직에서는 업무, 개발, 비즈니스 가속화에 필요한 제어 능력을 확보할 수 있습니다. 가장 상호 연결성이 좋은 세계 최대 규모의 네트워크를 기반으로 Cloudflare에서는 고객을 위해 매일 수십 억 건의 온라인 위협을 차단합니다.가장 규모가 큰 브랜드, 기업가, 중소기업, 비영리단체, 인권 그룹, 전 세계의 정부 등 수많은 조직에서 이 회사를 신뢰합니다. cloudflare.com/ko-kr/connectivity-cloud에서 Cloudflare의 클라우드 연결성에 대해 자세히 알아보세요. https://radar.cloudflare.com에서 최신 인터넷 트렌드와 인사이트를 자세히 알아보세요. Cloudflare 팔로우하기: 블로그 | X | LinkedIn | Facebook | Instagram 미래지향적 진술 본 언론 발표에는 1933년 증권법 개정본의 섹션 27A와 1934년 증권거래소법 개정본의 섹션 21E에 정의된 상당한 위험 및 불확실성을 포함하고 있는 진술인 미래지향적 진술이 포함되어 있습니다. “할 수 있음”, “할 것임”, “할 가능성이 있음”, “할 것으로 예측됨”, “살펴볼 예정임”, “계획하고 있음”, “기대하고 있음”, “가능성이 있음”, “하려 함”, “목표로 함”, “예상함”, “고려함”, “믿음”, “추정함”, “예측함”, “가능성”, “계속해서” 등의 단어 및 해당 단어의 부정형, 또는 Cloudflare의 예측, 전략, 계획 또는 의도와 관련된 유사한 단어 또는 표현을 통해 미래지향적 진술이 확인되는 경우가 있습니다. 하지만, 모든 미래지향적 진술에 이와 같이 확인할 수 있는 단어가 포함되지는 않습니다. 이 언론 발표에 표시 혹은 암시된 미래지향적 진술에는 Cloudflare의 전역 네트워크, Cloudflare의 제품 및 기술, Cloudflare의 기술적 발전, 향후 운영, 성장, 이니셔티브 혹은 전략, 전반적인 시장 동향, 그리고 Cloudflare의 CEO 및 데이터 인사이트 책임자의 발언 등이 포함되지만 이에 국한되지 않습니다. Cloudflare에서 2024년 11월 7일 양식 10-Q에 작성해서 제출한 Cloudflare의 분기 보고서 및 기타 SEC에 주기적으로 제출할 제출물 등을 포함하는 증권거래위원회(SEC) 제출물에 명시된 위험 및 그 밖의 여러 이유로, 실제 나오게 될 결과는 미래지향적 진술에서 표현되거나 암시된 결과와 크게 다를 수 있습니다. 본 언론 발표에서 이루어진 미래지향적 진술은 진술이 이루어진 날짜 이전에 발생한 사건에만 관계됩니다. 법적으로 요구되는 경우를 제외하고, Cloudflare에서는 본 언론 발표에서 사용한 미래지향적 진술을 언론 발표 시점 이후 발생한 사건 및 현황, 새로운 정보, 예측 불가능했던 사건의 발생 등을 반영해 갱신할 의무를 지니지 않습니다. Cloudflare는 자사의 미래지향적 서술문에서 공개한 계획, 의도 또는 예측을 달성하지 못할 가능성이 있으며, Cloudflare의 미래지향적 진술을 과도하게 신뢰해서는 안 됩니다. © 2024 Cloudflare, Inc. All rights reserved. Cloudflare, Cloudflare 로고, 기타 Cloudflare 마크는 미국 및 기타 관할 지역에서 Cloudflare, Inc.의 상표 또는 등록 상표입니다. 본 문서에 언급된 모든 기타 마크 및 이름은 각 소유주의 상표일 수 있습니다. 언론 연락처 정보Daniella Vallurupalli+1 650-741-3104[email protected]보도 자료 페이지'
