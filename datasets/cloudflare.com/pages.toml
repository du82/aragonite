description = "Learn more about Cloudflare, the team we are building and how we work. We have opportunities in offices and remote locations around the world!"
full_description = "We believe that with our talented team, smart technology and engaged users we can join in helping build a better Internet We believe that with our talented team, smart technology and engaged users we can solve some of the biggest problems on the Internet.At Cloudflare, we strive to create and uphold an inclusive culture and a workplace where employees feel comfortable and empowered to bring their genuine selves to work so they can do their best work. We are now hiring for hybrid, distributed and in-office opportunities across the Americas, Europe and Asia. The Cloudflare Capabilities outline the behaviors we value and reference when measuring success, giving feedback, and rewarding performance. They serve as the building blocks of an inclusive company culture. When we evaluate performance, we review “what” the outcome is, the results. However, we also consider “how” we work and what good looks like, the behaviors. It doesn’t just matter what you do, but how you do it. We are committed to developing a global team that is distributed with a flexible working approach. Doing this equitably and inclusively is essential to our success. We have decided on two ways in which our employees will work. These approaches give teams the opportunity to establish their optimal working arrangements that fits with their objectives and enables collaboration. Cloudflare employees come from all walks of life. Our team is energized by a collaborative, creative environment that celebrates our differences and fosters new ways to grow together."
