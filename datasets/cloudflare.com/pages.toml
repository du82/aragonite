["https://cloudflare.com/partners/technology-partners/crowdstrike"]
title = "CrowdStrike - Tech Partners | Cloudflare"
description = "Identify, investigate, and remediate threats faster with Cloudflare and CrowdStrike."
full_description = "Cloudflare and CrowdStrike are partnering to extend Zero Trust across devices, applications, and corporate networks. Our partnership combines the power of Cloudflare’s expansive network and Zero Trust suite, with CrowdStrike’s Endpoint Detection and Response (EDR) and incident remediation offerings. Gain real time visibility into threats through shared, correlated telemetry. Monitor data from network to endpoint and more. Cloudflare delivers Zero Trust controls by sharing Cloudflare Security Service Edge (SSE) logs into CrowdStrike Next-Gen SIEM, improving end-to-end visibility with telemetry for devices, identities, and applications. The sharing of intelligence accelerates threat detection by combining events from Cloudflare with threat indicators from other domains. Customers gain early detection and visibility into potential vulnerabilities or exploits and can decisively take action to prevent or mitigate breaches. Cloudflare and CrowdStrike have partnered to make it easy for organizations of all sizes to build Zero Trust policies based on CrowdStrike’s Zero Trust Assessment (ZTA) score — a continuous real-time security posture assessment across all endpoints in an organization. This enables organizations to enforce conditional access and gateway policies based on device health and compliance checks to mitigate risks posed by compromised or malicious devices. As an incident response provider, CrowdStrike deals with active under attack situations day in, day out — helping customers mitigate the attack, and getting their web property and network back online. Cloudflare’s partnership with CrowdStrike not only enables rapid referral of organizations under attack, but helps customers mitigate the risk to their business operations. To address the threat of heightened cyber risk, Cloudflare and CrowdStrike have partnered to launch the Critical Infrastructure Defense Project. Our goal is to quickly improve the cyber readiness of vulnerable infrastructure in US critical industries — hospitals, energy utilities, and water utilities — by providing eligible organizations free services and support."
