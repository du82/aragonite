["https://cloudflare.com/the-net/improve-digital-experience-app-modernization"]
title = "theNET | Deliver reliable, responsive web apps — avoid costly outages  | Cloudflare"
description = "Web applications are at the heart of modern businesses. And when those apps are slow or unavailable, user experiences immediately suffer and businesses quickly feel the impact."
full_description = "Web applications are at the heart of modern business. When these apps are slow or unavailable, user experiences immediately suffer and businesses quickly feel the impact. In October 2021, Facebook, Instagram, and WhatsApp experienced more than six hours of downtime which cost Facebook approximately $60 million in revenue. Subsequently Facebook's stock price dipped, causing the company to lose billions of dollars more in market capitalization. Not all web app failures are as dramatic or costly as Facebook’s. However, even relatively small, temporary problems can affect a company’s bottom line. If an e-commerce website is even a little sluggish, users will turn to another site — and they might never come back. The serious financial and reputational consequences of web application issues mean that maintaining app performance and availability must be a high priority for a company’s technology leaders. And to deliver responsive, reliable experiences, they need to do more than cobbling together a few point solutions. Technology leaders need to construct a multi-faceted strategy that involves improving development processes, modernizing their application architecture, and rethinking how they combat security threats. The first step in building that strategy is understanding why web apps sometimes fail. While some failures are caused by atypical issues — like the specific human error that led to the Facebook outage, there are a few fairly common problems that can negatively affect performance and availability. In particular, poorly written code, complex architectures, and cyber threats present challenges for many organizations.Poorly written code: In many cases, performance and reliability are directly related to the quality of the code. For example, a cloud-based application that has inefficient database requests can start to slow as requests scale. Bugs — including those that are only triggered under rare conditions — can also bring web apps to a screeching halt. Developers might also inadvertently leave vulnerabilities in the code, putting web apps at risk of zero-day exploits that lead to data theft, compromised web servers, or other harm. In 2017, for example, an unpatched vulnerability in Equifax’s web application framework resulted in a data breach that affected more than 147 million people."
