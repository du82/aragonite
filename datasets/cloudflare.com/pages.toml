["https://cloudflare.com/products/cache-reserve"]
title = "Cloudflare Cache Reserve | Zero Egress Fees | Cloudflare"
description = "Cloudflare Cache Reserve eliminates egress costs and improves cache hit ratios by enabling you to persistently cache your data with the push of a single button."
full_description = 'Cache Reserve persistently serves static content from our global network, helping businesses lower their egress bills while ensuring higher cache hit ratios. Shield your origin servers from unnecessary, voluminous requests to ensure faster performance and a smoother user experience. Maximize your savings by limiting unnecessary cache data evictions and eliminating associated egress costs. Cloudflare Cache Reserve is a large, persistent data store built on R2 — our global, S3-compatible object storage service. By serving static content from the edge of our global network, Cache Reserve helps increase cache hit ratios, speed up load times for end users, and minimize unnecessary egress fees. "The 2% cache hit ratio improvement enabled by Cloudflare Cache Reserve has eliminated roughly two-thirds of our S3 egress activity. The reduction in egress charges is almost an order of magnitude larger than the price we paid for Cache Reserve. ” Cache Reserve gives you full control over the retention period of your cached assets, helping you lower cache “misses” and optimize your storage when cache space nears capacity. Cache Rules allows you to define which resources are available for Cache Reserve, so you can tailor your content delivery strategy for almost any use case — without needing to write code. Our global network enables you to cache content from 335+ data centers worldwide, so your users get content as quickly as possible, no matter where they are located.'
