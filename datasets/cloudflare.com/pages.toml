["https://cloudflare.com/case-studies/roibest"]
title = "ROIBest & Cloudflare | Customer Story | Cloudflare"
description = "Using Cloudflare's performance and security tools as well as the Cloudflare developer platform, ROIBest has delivered an exceptional application experience to hundreds of millions of users worldwide."
full_description = "Founded in 2022 and headquartered in Singapore, ROIBest is the pioneer of Android progressive web app (PWA) solutions, which enable web apps to perform as if they were running natively on devices. With a mission to build the best ROI infrastructure for the PWA ecosystem, ROIBest provides developers with flexible, efficient global user acquisition solutions to maximize advertising ROI. Serving numerous apps and reaching billions of global users, ROIBest is a technological leader in the PWA space. PWAs combine the best of web and native app technologies: They can be accessed directly via browsers and added to users’ home screens, delivering a user experience comparable to native apps. ROIBest’s innovative Android PWA solutions allow developers to bypass traditional Android app store limitations, offering lower costs and greater flexibility. “Our goal with ROIBest’s services is to help global developers achieve three key objectives: stability, freedom, and speed,” says Rey Lv, marketing lead at ROIBest. “Stability means ensuring that developers’ apps are not affected by Google Play’s review and purge. Speed refers to minimizing the friction from ad impression to download. Freedom allows developers to bypass app store review restrictions and integrate third-party payment systems or SDKs seamlessly.” This innovative model, however, has brought unique technical challenges. ROIBest needs to support Android devices globally, but the complexity of the Android ecosystem increased development and deployment difficulties. In Tier-3 countries with weaker network infrastructures (such as India, Indonesia, and Brazil), ensuring fast and stable PWA downloads became a critical issue. “We needed to ensure users could complete most downloads within 10 seconds — and large files in no more than 10 seconds,” says Rey. “But in these regions, poor network conditions often impacted user experience.” At the same time, heightened concerns over data privacy and security added further pressure. As a global service provider, ROIBest has to comply with regulations such as the GDPR while ensuring the security of customer data. “Our customers are extremely sensitive to data security. Any data breach could have serious consequences,” says Rey. “We needed a comprehensive solution to address these challenges.”"
