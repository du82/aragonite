["https://cloudflare.com/learning/dns/glossary/what-is-a-domain-name-registrar"]
title = "What is a domain name registrar? | Cloudflare"
description = "Domain name registrars handle the reservation of domain names as well as assigning IP addresses for those domains. Learn more about how registrars work."
full_description = "A domain name registrar provides domain name registrations to the general public. A common misconception is that registrars sell domain names; these domain names are actually owned by registries and can only be leased by users. A domain name registrar is a business that handles the reservation of domain names as well as the assignment of IP addresses for those domain names. Domain names are alphanumeric aliases used to access websites; for example, Cloudflare’s domain name is ‘cloudflare.com’ and the IP address would be something like 192.0.2.1 (just an example). Domain names make it easier to access websites without having to memorize and enter alphanumeric IP addresses. (For more on how this works, see What Is DNS?) It should be noted that registrars do not actually manage and maintain domain names; that part is done by a domain name registry. Registries are organizations that manage top-level domains (TLDs) ‘.com’ and ‘.net’ — specifically by maintaining the records of which individual domains belong to which people and organizations. These registries are managed by the Internet Assigned Numbers Authority (IANA) — a department of the Internet Corporation for Assigned Names and Numbers (ICANN), a global organization that coordinates several processes and databases that support the Internet’s basic functionality. Registries delegate the commercial sales of domain name registrations to registrars. For example, when a registrar sells a ‘.com’ domain registration to an end user (or ‘registrant’), the registrar must notify VeriSign — the registry for ‘.com’ domains. The registrar must also pay VeriSign a fee, which is factored into the price that the registrar charges the end user. This arrangement works much like a car dealership. A customer who is interested in buying a car visits the showroom and is shown the available cars by a knowledgeable sales associate. If the customer chooses to buy a car (not one already in stock, for this example), the dealership must then order the car from a manufacturer. The customer ultimately picks up the car and receives customer service from the dealership."
year_published = 2025
clearnet = "https://cloudflare.com/learning/dns/glossary/what-is-a-domain-name-registrar"
