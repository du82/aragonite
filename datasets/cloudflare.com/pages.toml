["https://cloudflare.com/developer-platform/products/r2"]
title = "Cloudflare R2 | Zero Egress Fee Object Storage | Cloudflare"
description = "Cloudflare R2 is an S3-compatible, zero egress-fee, object storage. Move data freely and build the multi-cloud architecture you desire."
full_description = "Powered by our programmable global network, R2 enables you to create flexible, multicloud architectures with S3-compatible object storage. Our S3-compatible API gives you added flexibility — allowing you to access a wide range of S3 tools, libraries, and extensions. Our affordable, consistent pricing helps free up resources across your organization — and you never have to pay egress fees for data accessed from R2. Our automated migration service helps migrate your objects all at once or over time — whatever aligns with your current needs. Cloudflare R2 allows you to store large amounts of unstructured data — without the costly egress fees or vendor lock-in associated with other cloud storage providers. R2 natively integrates with Cloudflare Workers, so you can easily perform authentication, route requests, and deploy edge functions across our network of 335+ data centers. “After investigating a wide range of alternatives, we went with Cloudflare’s R2 storage — and as a result are thrilled that our engine distribution costs have decreased by 98%, while delivering top-notch performance.” Move your data (including training data for AI models) to R2 and take advantage of our zero egress fee policy — whether you are permanently migrating your data or not. With our Cache API and Workers, you can significantly extend cache lifetimes for large files and provide low-latency access to assets. R2 charges based on the total volume of data stored and two classes of operations on that data. You pay zero egress fees."
