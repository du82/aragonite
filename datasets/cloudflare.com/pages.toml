["https://cloudflare.com/case-studies/poetry-foundation"]
title = "Poetry Foundation & Cloudflare | Customer Story | Cloudflare"
description = "The Poetry Foundation uses Cloudflare solutions to host a web archive that fairly compensates poets"
full_description = "The Poetry Foundation hosts a web archive of over 47,000 English language poems and publishes Poetry Magazine, which has been in print since 1912. The foundation makes an effort to reproduce poets’ work as accurately as possible, including audio and video elements plus biographical information about the poets and their past performances. The Poetry Foundation stands out from familiar sites in their notable protection of the poetry community’s intellectual property. Poems in the foundation’s archive are properly attributed, and their rightsholders are compensated for the right to reproduce their work. The Poetry Foundation also provides grants to literary arts organizations and is one of the largest private funders of the literary arts in the U.S. When the Poetry Foundation was first establishing a web presence, the organization created a fully custom tech stack, including their own content management system (CMS). This customized environment allowed the platform to be highly tailored to the types of content that the organization hosts. But the site didn’t perform as well as under load as it might have with off-the-shelf, optimized solutions. The Poetry Foundation first engaged with Cloudflare as part of an effort to modernize the organization’s tech stack and transition away from the custom solution. Many details of the eventual tech stack were still undefined, but, based on a recommendation from the foundation’s technology partner Happy Cog, the Poetry Foundation selected the Cloudflare web application firewall (WAF) and Cloudflare’s image resizing capabilities. While the Poetry Foundation selected Cloudflare for the WAF, the team rapidly realized that Cloudflare also offered solutions for some of their other challenges as well. The plan was to use a headless CMS to manage the foundation’s web content, but they needed a system to host frontend pages. According to Matt Weinberg, President of Technology at Happy Cog, “It quickly became obvious that using Cloudflare Pages for the frontend would make the site cheaper to host, easier to maintain, and faster to set up.”"
