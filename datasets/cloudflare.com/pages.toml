["https://cloudflare.com/cookie-policy"]
title = "Cloudflare Cookie Policy | Cloudflare"
description = "This page is for those who are interested in our Cloudflare Cookie Policy"
full_description = 'This Cloudflare Cookie Policy (“Policy”) outlines the general policy, practices, and types of cookies that Cloudflare, Inc. (“Cloudflare,” “we,” “us,” or “our”) may use to improve our Services and your experience when visiting our Websites. For the purposes of this Policy, capitalized terms used but not defined in this Policy have the meanings given in our Privacy Policy. Our Websites and Services use cookies and other similar technologies (collectively in this Policy, "cookies"), in order to provide a better service to you, to help keep your account safe, and to generally improve our Websites and Services. Cookies perform essential functions, such as ensuring a webpage loads correctly and securely. They also help us provide you with a consistent and efficient experience. For example, we may use cookies to remember which language you prefer, to remember that you are a repeat visitor so we can direct you to the appropriate part of our Websites, or to present you with services that are matched to your preferences. Cookies are small pieces of text used to store information on web browsers. They are used by many websites to store and receive identifiers and other information on devices, such as a handheld phone or computer. You can learn more about cookies and their functions generally by visiting an information website such as https://knowcookies.com. We also may include tracking pixels, which are small graphic images, in our marketing communications to determine engagement. These cookies may be set by us or by third parties with whom we have partnered to assist in our marketing efforts. We may also use our Zaraz product in connection with certain third-party tools on our Websites. Zaraz loads third-party tools in the cloud using the Cloudflare network, as opposed to running third-party scripts in an end user’s browsers, and improves the speed and security of websites while offering greater control over the data that third-party tools access. While Zaraz prevents the third-party scripts from loading on your browser, in some cases you may still see third-party cookies that are associated with these third-party tools placed on your devices (subject to your consent). This allows the third-party tools to function properly.'
year_published = 2025
