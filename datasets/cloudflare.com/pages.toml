["https://cloudflare.com/application-services/products/load-balancing"]
title = "Cloudflare Load Balancing | DNS-Based Load Balancer | Cloudflare"
description = "Cloudflare Load Balancing is a DNS-based load balancing solution that maximizes uptime and reduces costs. Explore benefits, use cases, and pricing."
full_description = "Cloudflare Load Balancing ensures better performance, uptime and user experience by dynamically balancing traffic across geographically-distributed data centers and servers. As soon as an origin server or server pool goes down, requests proxied through Cloudflare get instantly rerouted to the nearest data center — helping maximize performance and resiliency. Load balance traffic across multiple L4-7 protocols — including HTTP(S), TCP or UDP — and tailor your configuration to support evolving business needs. Set up a customizable and scalable load balancing infrastructure using the Cloudflare Dashboard or REST API — no additional hardware or software required. Load Balancing intelligently distributes traffic across your multicloud deployments to reduce server strain, enhance application availability and user experience, and minimize bandwidth consumption and latency. It runs in each of our data centers across 335+ cities worldwide and is backed by our DDoS-resilient DNS — the fastest authoritative DNS in the world. “The combination of Load Balancing’s geolocation steering and Cloudflare’s caching makes sure customers are getting the fastest load times possible.” Load balance traffic across geographically-distributed data centers to ensure application uptime and resiliency, even during surges, outages, or attacks. With private IP support, get near real-time failover across multiple servers, whether they are deployed in a private, public or hybrid cloud."
