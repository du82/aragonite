["https://cloudflare.com/case-studies/applied-systems"]
title = "Applied Systems & Cloudflare | Case Study | Cloudflare"
description = "Applied Systems unifies security and networking with Cloudflare, reducing risk, improving productivity for employees, and delivering superior cloud-native experiences for customers"
full_description = "Founded in 1983, Applied Systems builds SaaS solutions for the insurance industry. Based in Chicago, the company has over 2,500 employees across the US, UK, Canada, Western Europe, and India. Applied Systems is a global leader in the insurance industry, serving independent insurance brokerages of all sizes – from international and enterprise companies to local agencies and SMBs. Applied Systems has won global recognition for its pioneering approach to insurtech, including awards as the Best Broker Software Management House in the UK for 2022 by Insurance Times and first place in its category at the US 2023 Golden Bridge Business and Innovation Awards. Security has always been of paramount importance to Applied Systems. The company must safeguard large volumes of financial data, payment records, personally identifiable information (PII), and other regulated and sensitive classes of information for its insurance customers. With the introduction of a new CEO and executive team in 2019, Applied has increasingly prioritized digital transformation initiatives to help it serve larger, more demanding enterprise customers. When Chief Information Security Officer Tanner Randolph started in 2021, this meant re-evaluating Applied’s technology architecture, seeking opportunities to become more agile, more efficient, and more secure. “Applied is on a journey. We’re rapidly accelerating into a cloud-native company,” he says. “When I joined, we had various components from different security vendors like Zscaler and Cisco and different networking paths to our data centers. Over the past few years, we’ve really focused on consolidating around a unified security and networking stack.” Starting in 2022, Applied Systems began consolidating large swaths of security and networking functionalities on Cloudflare, including: “By consolidating controls onto Cloudflare rather than the many control planes of multiple-vendor systems, my teams can focus on driving the business forward,” he continues. “ I don’t know of a lot of security teams that can say that.”"
