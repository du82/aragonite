["https://cloudflare.com/case-studies/platzi"]
title = "Platzi & Cloudflare | Customer Story | Cloudflare"
description = "Platzi accelerates development while protecting apps and resources with Cloudflare"
full_description = "Platzi is Latin America’s school of technology, offering a range of online courses that currently support more than 5 million students and more than 3,000 companies. Individuals use Platzi to advance their careers, gaining marketable tech skills and certifications. Meanwhile, companies use Platzi to efficiently train employees on a range of subjects, from cyber security and AI to leadership and English. Providing access to rich educational resources can have a far-reaching impact. “By empowering individuals to pursue new careers in technology, Platzi is helping to boost the economy of the entire region,” says Alejandro Parra, engineering manager at Platzi. Platzi developers are continuously working to create engaging experiences for students and corporate customers while providing useful apps for internal employees. To deliver new features and content rapidly, developers need ways to streamline essential tasks, such as deploying databases, migrating microservices, connecting with new endpoints, and more. They also need fast access to resources, even when working remotely. At the same time, security is a high priority. The Platzi IT team must defend against DDoS attacks and malicious bots that can hinder user experiences. In addition, the team must maintain granular access control over internal IT resources, providing access to specific applications and endpoints according to user roles. Adopting Cloudflare developer services — including Cloudflare Workers and Cloudflare Pages — has helped Platzi developers speed workflows. For example, when developers needed to route site traffic according to a user’s country code, they were able to write a Workers script in just an hour. In the past, it would have taken up to two weeks. Workers ultimately helps them deliver new courses to market 99% faster. Platzi developers use Workers for Platforms — which extends the capabilities of Workers — to build all of the company’s microservices. The team constructed a custom gateway to help move those microservices easily. “By using Workers for Platforms with our in-house gateway, we can dynamically move microservices from one cloud provider to another,” says Edwar Barón, cloud architect at Platzi. “That gives us much greater scalability and flexibility for change.”"
