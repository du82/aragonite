["https://www.cloudflare.com/ja-jp/press-releases/2024/cloudflare-publishes-top-internet-trends-for-2024"]
title = """
Cloudflare、2024年のインターネット環境を振り返ったトレンド上位を発表
 | Cloudflare"""
description = "Cloudflare、2024年のインターネット環境を振り返ったトレンド上位を発表"
full_description = "Cloudflare、2024年のインターネット環境を振り返ったトレンド上位を発表 最新のデータから、政府主導によるインターネット遮断が過去最高を記録、また、ギャンブルおよびゲーミング業界を標的とした悪意のあるトラフィックやサイバー攻撃が増加していることが判明 セキュリティ、パフォーマンス、信頼性を備えたより高度なインターネットの構築を支援する – Cloudflare（クラウドフレア）は本日、第5回目となる年次レポート「Year in Review」を発表しました。このレポートでは、2024年のグローバルインターネット状況やセキュリティトレンドを分析し、さらに「最も人気のあるインターネットサービス」についても深く掘り下げています。 インターネットは、世界を一つにつなげる基盤として、私たちの日常生活を支える重要な情報やサービスへのアクセスを提供しています。こうしたインターネットへの依存は、今や社会の基幹インフラとなっており、救命救急から、地域社会における選出議員とのつながり、投票登録、全世界のデジタル経済のサポートまで、幅広く対応しています。Cloudflareの「2024 Year in Review」では、インターネットに接続する人やデバイスの数が年々増大の一途をたどっており、全世界のトラフィックが急増（前年同期比17%増）し、インターネットの機能に対する私たちの依存を示す新たなトレンドが生まれていることが強調されています。 Cloudflareの共同創設者兼最高経営責任者（CEO）であるマシュー・プリンス（Matthew Prince）は、「私たちはほぼ毎日インターネットに依存していますが、多くの人々はいまだにインターネットを単なるWebページの集合体としてしか捉えていません。しかし、インターネットは現代生活の日常活動のほぼすべてに組み込まれています。たとえば、ソーシャルメディアへの接続とそこでの交流、スマート冷蔵庫やロボット掃除機の使用、ライドシェアアプリを利用した移動、ネットバンキングなど、さまざまな場面で活用されているのです。私たちが当たり前のように行っているデータのやり取りも、裏では何らかの形でインターネットに接続されており、その大部分が毎日片時も休むことなくCloudflareのネットワークを通じて行われています。Cloudflareのグローバルネットワークは、世界最大級の規模を誇り、使用状況、全体的な品質、Web接続に関する独自の包括的な視点を持っています」と述べています。 Cloudflareは、「Year in Review」レポートを公開することで、変化するインターネット環境に関する重要なデータインサイトを共有し、より情報に基づいた、回復力のある、安全なオンライン世界を実現することを目指しています。2024年の最大のハイライト： 最も人気のあるインターネットサービス： Googleは3年連続で首位を獲得し、続いてFacebook（2位）、Apple（3位）、TikTok（4位）という順位は2023年から変わりませんでした。しかし、WhatsAppが初めて世界で最も人気のあるサービスのトップ10入りを果たしました。 最も人気のある生成AIサービス： Codeium（3位）、Claude（5位）、CoPilot（7位）が新たにトップ10入りを果たしましたが、OpenAIが2年連続で首位の座を維持しました。 最も人気のあるゲーミングサービス： ゲーマーの支持により、Steamが初めてトップ5に入り、Minecraftも今年トップ10にランクインしました。一方、Robloxは4年連続で首位を維持しています。 最も標的とされた業界： 世界的に、ゲーミングおよびギャンブル業界が脅威アクターの最大の標的となり、2023年に最も標的とされていた金融業界を追い抜きました。特に、米国でスーパーボウルが近づく数週間で脅威が大幅に増加したことにご注目ください。 観測されたインターネット遮断： 世界全体のインターネット遮断の半数以上が政府主導によるものでした。これらは主に抗議活動や市民の不安に対する対応、さらには試験中の不正防止のために行われ、モザンビーク、イラク、シリア、バングラデシュ、セネガル、パキスタンなどの国が影響を受けました。 悪意のあるトラフィック： 過去1年間でのインターネットの危険性の増加量は平年並みで、全世界のトラフィックの約6.5％が潜在的に悪意のあるものとして緩和されました。この割合は2023年からわずかな増加にとどまっています。 最も攻撃的なAIボット： AIボットやクローラーはコンテンツを大量に収集することで注目されています。中でも、ByteDanceのBytespiderとAnthropicのClaudeBotは特に活発でしたが、両社の全体的なトラフィックは年間を通じて徐々に減少しています。 Cloudflareのデータインサイト責任者であるDavid Belsonは、「2020年、パンデミックが私たちのインターネットとの関わり方に劇的な影響を与える様子を目の当たりにし、インターネットトラフィックの動向の分析結果に誰もがアクセスできることの重要性を痛感しました。Cloudflare Radarはその年に誕生したのです。当社の『Year in Review』は、Cloudflareのデータを大衆化するRadarの取り組みの一環であり、誰もが手軽にインターネットのトレンドやパターンを探ることができる窓口を提供しています」と述べています。 このデータの出処は、誰でもインターネットの世界的トレンドと知見を閲覧できる無料ツールCloudflare Radarです。Radarは、Cloudflareの（120か国以上、330都市以上に広がる世界最大級の）グローバルネットワークから集めたデータと、インターネットを高速かつプライベートにブラウジングする手段として広く用いられているCloudflareの1.1.1.1パブリックDNSリゾルバーから集計・匿名化したデータを基にしています。 Cloudflareの「Year in Review」の詳細は、以下のリソースでご確認ください： ブログ：Cloudflare 2024 Year in Review ブログ：2024年、最も人気のあるインターネットサービス 2024 Year in Reviewマイクロサイト Cloudflareについて Cloudflare, Inc.（NYSE：NET）はコネクティビティクラウドのリーディングカンパニーです。企業が場所を問わず従業員、アプリケーション、ネットワークの速度と安全性を高め、簡略化とコスト削減を実現できるように支援しています。Cloudflareのコネクティビティクラウドは、クラウドネイティブな製品と開発者ツールをまとめた機能満載の統合プラットフォームで、どんな企業でもビジネスの遂行、開発、高速化に必要なコントロールを手中にできます。 世界最大級で相互接続数も最多級のネットワークを誇るCloudflareは、お客様のために日々何十億件ものオンライン脅威をブロックしています。大手企業、起業家、小企業、非営利団体、人権団体、政府機関まで、世界中で数百万に上る組織から信頼をお寄せいただいています。 Cloudflareのコネクティビティクラウドの詳細：cloudflare.com/connectivity-cloud。最新のインターネット動向と洞察について：https://radar.cloudflare.com。 SNS：ブログ | X | LinkedIn | Facebook | Instagram 将来予想に関する記述 本プレスリリースには、将来予想に関する記述（1933年米国証券法第27A条および1934年米国証券取引所法21E条（いずれもその後の改正を含む）に該当）があり、それらには重大なリスクおよび不確定要因が含まれています。将来予想に関する記述は、「場合があります」、「つもりです、するでしょう」、「はずです」、「見込まれます」、「可能性を探ります」、「する計画です」、「予想します」、「かもしれません」、「意図しています」、「目標とします」、「見積ります」、「検討します」、「考えます」、「推測します」、「予測します」、「潜在的」、「引き続き」、またはそれらの否定表現、あるいはCloudflareの予想、戦略、計画、または意図に関わるその他同様の用語もしくは表現によって識別することができます。しかし、すべての将来予想に関する記述にこうした語句が含まれているわけではありません。本プレスリリースにて明示または黙示されている将来予想に関する記述には、Cloudflareのグローバルネットワーク、Cloudflareの製品と技術、Cloudflareの技術開発、将来の事業展開、成長、イニシアチブ、戦略、全体的な市場動向、CloudflareのCEOおよびデータインサイト責任者によるコメントに関する記述を含みますが、それらに限定はされません。当社が2024年11月7日に米国証券取引委員会（SEC）に提出した四半期報告書（フォーム10-Q）や当社がSECに随時提出するその他の文書で詳説するリスクをはじめ（ただしこれらに限定はされない）、さまざまな要因によって、上記の将来予想に関する記述で明示または黙示した結果と実際の結果との間に重大な相違が生じる可能性があります。 本プレスリリースに含まれる将来予想に関する記述は、あくまで記述当日現在の事象についてのみ言及しています。Cloudflareは、法律で義務付けられた場合を除き、本プレスリリースの日付以降の事象や状況を反映するために、あるいは新しい情報や予期しない事象の発生を反映するために、将来予想に関する記述を更新する義務を負いません。Cloudflareが将来予想に関する記述で開示した計画、意図、予想は実際に実行・達成されない場合があるため、Cloudflareの将来予想に関する記述に過剰に依存すべきではありません。 ©2024Cloudflare,Inc.All rights reserved.Cloudflare、Cloudflareのロゴ、およびその他のCloudflareのマークは、米国およびその他の法域におけるCloudflare, Inc.の商標や登録商標です。本書に記載されているその他の商標および名称は、各所有者の商標である可能性があります。 広報担当連絡先Daniella Vallurupalli+1 650-741-3104[email protected]プレス向けページ"
