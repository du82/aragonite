["https://cloudflare.com/learning/security/threats/owasp-top-10"]
title = "What is OWASP? What is the OWASP Top 10? | Cloudflare"
description = "The OWASP Top 10 is a list of the most pressing online threats."
full_description = "The Open Web Application Security Project maintains a regularly-updated list of the most pressing web application security concerns. The Open Web Application Security Project, or OWASP, is an international non-profit organization dedicated to web application security. One of OWASP’s core principles is that all of their materials be freely available and easily accessible on their website, making it possible for anyone to improve their own web application security. The materials they offer include documentation, tools, videos, and forums. Perhaps their best-known project is the OWASP Top 10. The OWASP Top 10 is a regularly updated report outlining security concerns for web application security, focusing on the 10 most critical risks. The report is put together by a team of security experts from all over the world. OWASP refers to the Top 10 as an ‘awareness document’ and they recommend that all companies incorporate the report into their processes in order to minimize and/or mitigate security risks. Access control refers a system that controls access to information or functionality. Broken access controls allow attackers to bypass authorization and perform tasks as though they were privileged users such as administrators. For example a web application could allow a user to change which account they are logged in as simply by changing part of a URL, without any other verification. Access controls can be secured by ensuring that a web application uses authorization tokens* and sets tight controls on them. *Many services issue authorization tokens when users log in. Every privileged request that a user makes will require that the authorization token be present. This is a secure way to ensure that the user is who they say they are, without having to constantly enter their login credentials. If web applications do not protect sensitive data such as financial information and passwords using encryption, attackers can gain access to that data and sell or utilize it for nefarious purposes. They can also steal sensitive information by using an on-path attack."
year_published = 2025
clearnet = "https://cloudflare.com/learning/security/threats/owasp-top-10"
