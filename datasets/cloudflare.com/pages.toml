["https://cloudflare.com/performance/ensure-application-availability"]
title = "Web Application Availability | Monitoring & Metrics | Cloudflare"
description = "Ensure web application availability. Improve the availability of applications affected by overloaded or unavailable infrastructure."
full_description = "Users expect their mission-critical applications to always be online and available. Internet applications deployed on a global scale are highly susceptible to outages or downtime due to spikes in traffic, high network latency or server outages at the origin. Cloudflare improves application availability by monitoring network latency and server health at the origin, identifying the best resource from which to serve user requests for dynamic content. Both expected and unexpected network congestion or overloaded infrastructure can degrade performance to a point where websites or applications stop responding. Applications or individual origin servers can experience unplanned downtime and hard-to-troubleshoot outages, preventing visitors from accessing assets. Unplanned downtime includes hardware failures or system failures due to misconfiguration. Assets can also go offline for reasons unrelated to the network, such as manual and error prone disaster recovery or in-house load balancing, resulting in often hard-to-troubleshoot outages involving expensive triage. By protecting the origin from being overloaded and redirecting traffic around congested networks and away from failed servers to healthy origins, Cloudflare improves availability of applications. Heavy pages and long distances from the origin slow down Internet applications. Accelerate the delivery of static and dynamic content for higher conversions, better engagement, and lower infrastructure, operational, and development costs. Mobile clients introduce performance and content delivery constraints which hurt user experiences. Deliver fast mobile experiences that increase engagement and conversions, regardless of distance to origin servers, device types, or network health. 1 IDC, DevOps and the Cost of Downtime: Fortune 1000 Best Practice Metrics Quanti ed, Stephen Elliot, March 2015"
