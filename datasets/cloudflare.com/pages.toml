["https://www.cloudflare.com/de-de/press-releases/2024/cloudflare-publishes-top-internet-trends-for-2024"]
title = """
Cloudflare veröffentlicht die wichtigsten Internettrends des Jahres 2024
 | Cloudflare"""
description = "Cloudflare veröffentlicht die wichtigsten Internettrends des Jahres 2024"
full_description = "Cloudflare veröffentlicht die wichtigsten Internettrends des Jahres 2024 Neue Daten zeigen eine Rekordzahl von staatlich angeordneten Internetsperrungen, eine Zunahme beim bösartigen Traffic und Cyberangriffe auf die Glücksspiel- und Gaming-Branche San Francisco (Kalifornien), 9. Dezember 2024 – Cloudflare, Inc. (NYSE: NET), der führende Anbieter im Bereich Connectivity Cloud, veröffentlicht heute die fünfte Ausgabe des Berichts „Das Jahr im Rückblick“. Dieser beschäftigt sich mit den internationalen Entwicklungen im Bereich Internet und Sicherheitstrends im laufenden Jahr. Außerdem gehen wir darin auf die beliebtesten Dienste im World Wide Web des Jahres 2024 ein. Das Internet ist nach wie vor der Grundpfeiler globaler Vernetzung und bietet Zugang zu wichtigen Informationen und Diensten, die den Alltag prägen. Inzwischen ist es aus keinem Bereich der Gesellschaft mehr wegzudenken: Es unterstützt Ersthelfer bei der Rettung von Menschenleben, ermöglicht Interessensgruppen die Kontaktaufnahme mit Abgeordneten, hilft bei der Registrierung zu Wahlen und bildet die Grundlage der Digitalwirtschaft auf der ganzen Welt. Der Jahresrückblick 2024 unterstreicht, dass aufgrund der immer größeren Zahl von Menschen und Geräten, die sich mit dem Internet verbinden, der Datenverkehr weltweit (um 17 Prozent im Vergleich zum Vorjahr) angestiegen ist. Die damit verbundenen neuen Trends verdeutlichen, dass die vom Web gebotenen Möglichkeiten heute nirgendwo mehr wegzudenken sind. „Wir nutzen das Internet praktisch die ganze Zeit. Trotzdem es für viele Menschen nach wie vor nur eine Ansammlung von Webseiten. Doch das Web ist mit so gut wie jedem Aspekt des modernen Alltags verwoben: ob wir auf Social Media kommunizieren, smarte Kühlschränke und Staubsauger bedienen, Fahrdienst-Apps zur Fortbewegung nutzen oder auf unsere Bankkonten zugreifen“, so Matthew Prince, CEO und Mitgründer von Cloudflare. „All diese im Hintergrund ablaufenden Vorgänge, die wir oft als selbstverständlich ansehen, haben auf die eine oder andere Weise mit dem Internet zu tun. Ein riesiger Teil davon nimmt jede Sekunde jedes Tages seinen Weg durch das Cloudflare-Netzwerk. Dieses gehört zu den größten weltweit und bietet in einzigartiger Weise einen umfassenden Einblick in die Nutzung, die Qualität und die Konnektivität des gesamten Web.“ Mit dem Jahresrückblick will Cloudflare wichtige datengestützte Erkenntnisse zu der sich wandelnden Internetlandschaft liefern und dazu beitragen, dass die Online-Welt besser informiert, widerstandsfähiger und sicherer wird. Eine Auswahl der wichtigsten Eckdaten des Jahres 2024: Beliebteste Internetdienste: Google belegt das dritte Jahr in Folge den ersten Platz, gefolgt von Facebook (Rang 2), Apple (Rang 3) und TikTok (Rang 4). WhatsApp hat es erstmals in die Top 10 der weltweit beliebtesten Dienste geschafft. Beliebteste Dienste mit generativer KI: Codeium, Claude und CoPilot sind die Neuzugänge in diesen Top 10 (Rang 3, 5 und 7). An der Spitze steht das zweite Jahr in Folge OpenAI. Beliebteste Gaming-Dienste: Gaming-Konsumentinnen und -Konsumenten haben Steam in die Top 5 der beliebtesten Dienste in diesem Bereich katapultiert und Minecraft hat es dieses Jahr zum ersten Mal unter die ersten Zehn geschafft. Auf Rang eins landete das vierte Jahr in Folge Roblox. Am stärksten angegriffene Branchen: Weltweit ist die Gaming- und Glücksspielbranche zum wichtigsten Ziel von Angreifern geworden, womit der Finanzsektor auf Rang zwei verwiesen wurde. Insbesondere in den Wochen vor dem Super Bowl in den Vereinigten Staaten hat die Zahl der Bedrohungen stark zugenommen. Beobachtete Internetausfälle: Mehr als die Hälfte aller Internetausfälle weltweit gingen auf staatlich angeordnete Sperrungen zurück. Häufig wurde damit auf Proteste oder Unruhen reagiert, manchmal sollte aber auch Prüfungsbetrug verhindert werden. Betroffen waren unter anderem Mosambik, Irak, Syrien, Bangladesch, Senegal und Pakistan. Bösartiger Traffic: Das Internet ist zu einem gefährlicheren Ort geworden. Rund 6,5 Prozent des gesamten Traffics (geringfügig mehr als 2023) wurde Abwehrmaßnahmen unterzogen, weil er unter dem Verdacht stand, bösartig zu sein. Aggressivste KI-Bots: KI-Bots und -Crawler sind in letzter Zeit aufgrund ihres schier unstillbaren Hungers nach Inhalten in den Schlagzeilen. Bytespider (ByteDance) und ClaudeBot (Anthropic) waren zwar am aktivsten, doch ihr Traffic ist in beiden Fällen im Jahresverlauf schrittweise gesunken. „Cloudflare Radar wurde 2020 eingeführt, als wir die enormen Auswirkungen der Pandemie auf unsere Interaktion mit dem Internet beobachtet haben und uns bewusst geworden ist, wie wichtig es ist, diese Erkenntnisse allen zugänglich zu machen“, so David Belson, Head of Data Insight von Cloudflare. „Unser Jahresrückblick trägt zur Erfüllung des erklärten Ziels von Radar bei, von Cloudflare gesammelte Daten einer breiteren Öffentlichkeit zur Verfügung zu stellen und einen leicht zugänglichen Einblick in die Trends und Muster im Internet zu ermöglichen.“ Die zugrundeliegenden Daten stammen von Cloudflare Radar. Mit diesem Tool kann sich jeder kostenlos über globale Trends informieren und auf Erkenntnisse zu den Entwicklungen im Internet zugreifen. Radar stützt sich auf Informationen aus dem globalen Netzwerk von Cloudflare (einem der größten der Welt, das mehr als 330 Städte in über 120 Ländern umfasst) sowie auf gebündelte und anonymisierte Daten des öffentlichen DNS-Resolver 1.1.1.1 von Cloudflare, der weithin als schnelle und datenschutzfreundliche Möglichkeit zum Surfen im Internet genutzt wird. Mehr über den Cloudflare-Bericht „Das Jahr im Rückblick“ erfahren Sie hier: Blogbeitrag: Cloudflare-Bericht „Das Jahr im Rückblick“ für 2024 Blogbeitrag: Die beliebtesten Internetdienste des Jahres 2024 Microsite: „Das Jahr im Rückblick“ 2024 Über Cloudflare Cloudflare, Inc. (NYSE: NET) ist der führende Anbieter im Bereich der Connectivity Cloud. Mit Cloudflare können Organisationen ihre Mitarbeitenden, Anwendungen und Netzwerke noch besser schützen, deren Performance steigern und gleichzeitig Komplexität und Kosten reduzieren. Die Connectivity Cloud von Cloudflare bietet die umfassendste einheitliche Plattform von Cloud-nativen Produkten und Entwicklertools am Markt. Damit kann jedes Unternehmen die notwendige Kontrolle erlangen, um zu arbeiten, zu entwickeln und seinen Geschäftsbetrieb zu beschleunigen. Aufbauend auf einem der größten und am besten vernetzten Netzwerke der Welt blockiert Cloudflare für seine Kunden täglich Milliarden von Online-Bedrohungen. Millionen von Organisationen vertrauen auf Cloudflare – von den größten Marken über Unternehmer und kleine Unternehmen bis hin zu gemeinnützigen Einrichtungen, Hilfsorganisationen und Behörden auf der ganzen Welt. Mehr über die Connectivity Cloud von Cloudflare erfahren Sie unter cloudflare.com/de-de/connectivity-cloud. Tiefere Einblicke in aktuelle Internettrends und -erkenntnisse erhalten Sie bei https://radar.cloudflare.com. Hier können Sie uns folgen: Blog | X | LinkedIn | Facebook | Instagram Zukunftsgerichtete Aussagen Diese Pressemitteilung enthält zukunftsgerichtete Aussagen im Sinne von Abschnitt 27A des „Securities Act of 1933“ der Vereinigten Staaten in seiner geänderten Fassung und Abschnitt 21E des „Securities Exchange Act of 1934“ der Vereinigten Staaten in seiner geänderten Fassung, die mit erheblichen Risiken und Unsicherheiten behaftet sind. In einigen Fällen lassen sich zukunftsgerichtete Aussagen daran erkennen, dass sie Wörter wie „können“, „werden“, „sollten“, „erwarten“, „erkunden“, „planen“, „voraussehen“, „könnten“, „beabsichtigen“, „anstreben“, „prognostizieren“, „erwägen“, „glauben“, „schätzen“, „vorhersagen“, „potenziell“ oder „fortsetzen“ oder die Verneinung dieser Wörter oder ähnliche Begriffe oder Ausdrücke enthalten, die sich auf die Erwartungen, Strategien, Pläne oder Absichten von Cloudflare beziehen. Allerdings enthalten nicht alle zukunftsgerichteten Aussagen diese S