["https://cloudflare.com/case-studies/doctolib"]
title = "Doctolib & Cloudflare | Customer Story | Cloudflare"
description = "Cloudflare Access and DLS help to ensure patient and employee data privacy and security while helping address regulatory compliance"
full_description = "Doctolib is Europe’s fastest-growing e-health service. Founded in France in 2013, the company has expanded rapidly, now serving patients in Germany and Italy as well. Patients can use the platform to make appointments and telemedicine visits with healthcare providers. Doctolib was a well-established e-health service prior to 2019, but the COVID-19 pandemic drove significant, rapid growth. Pre-pandemic, the platform had approximately 1,000 employees, a number that grew to 3,000 within a couple of years. Doctolib also enables over 390,000 healthcare providers to serve 90 million patients across France, Germany, and Italy. Doctolib faced a multi-faceted challenge in securing sensitive data across a complex cloud environment while adapting to a growing hybrid workforce. As they onboarded over 200 employees a month, Doctolib needed to ensure that it maintained its strong security posture and regulatory compliance. The organization had access to large volumes of sensitive patient and employee data and was subject to stringent GDPR requirements for data protection and localization. “During the pandemic, we had to adapt to a new work model, offering full office, hybrid, or remote options.” explains Cédric Voisin, CISO at Doctolib. “Ensuring compliance and managing cyber threats became even more critical as we navigated this new work environment. A big challenge was to ensure that, no matter where our employees worked from, they could access resources securely.” Additionally, they needed to protect sensitive data across a broad range of SaaS applications, such as Google Workspace, Microsoft 365, and Salesforce. With several integrations in place, they were concerned about secure access, misconfiguration management, and potential data exposure across these platforms. On top of these day-to-day security concerns, the company also needed to ensure the availability of its platform through traffic surges during the COVID-19 pandemic. Greater visibility increased visitors to the platform and made it a larger target for cybercriminals."
