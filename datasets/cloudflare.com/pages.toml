["https://www.cloudflare.com/fr-fr/press-releases/2024/cloudflare-publishes-top-internet-trends-for-2024"]
title = """
Cloudflare publie les principales tendances Internet de l'année&nbsp;2024
 | Cloudflare"""
description = "Cloudflare publie les principales tendances Internet de l'année 2024"
full_description = "Cloudflare publie les principales tendances Internet de l'année 2024 De nouvelles données révèlent un record de coupures d'Internet d'origine gouvernementale, ainsi qu'une hausse du trafic malveillant, mais aussi des cyberattaques visant le secteur des jeux vidéo et des jeux de hasard Paris, le 9 décembre 2024 — Cloudflare, Inc. (NYSE : NET), le leader dans le domaine du cloud de connectivité, publie son cinquième bilan annuel (Year in Review), qui présente les tendances mondiales d'Internet 2024 en termes de sécurité et de statistiques, ainsi qu'une analyse approfondie des services Internet les plus populaires. Internet constitue la pierre angulaire des connexions au niveau mondial, en assurant l'accès aux informations et aux services essentiels qui sous-tendent notre vie quotidienne. Cette dépendance au réseau Internet a fait de ce dernier l'ossature de la société moderne, qu'il s'agisse d'aider les secours à sauver des vies, de permettre aux citoyens d'entrer en contact avec les élus et de s'inscrire sur les listes électorales ou de soutenir des économies numériques internationales. Le bilan de l'année 2024 proposé par Cloudflare souligne de quelle manière le trafic mondial a bondi (jusqu'à 17 % de plus par rapport à l'année précédente) dans un contexte qui voit de plus en plus d'utilisateurs et d'appareils se connecter à Internet. Ces chiffres se transforment dès lors en nouvelles tendances illustrant la dépendance du monde envers ces fonctionnalités. « Nous nous reposons presque constamment sur Internet, pourtant de nombreux utilisateurs ne voient encore le réseau que comme une simple succession de pages web. Or, le réseau Internet est partout : profondément tissé au sein de pratiquement toutes nos activités, comme notre mode de connexion et d'interaction avec les réseaux sociaux, la manière dont nous utilisons nos réfrigérateurs et nos aspirateurs intelligents, mais aussi la façon dont nous nous déplaçons à l'aide d'applications de covoiturage, dont nous entrons en contact avec notre banque et bien d'autres aspects de notre vie quotidienne », explique Matthew Prince, cofondateur et CEO de Cloudflare. « Toutes ces interactions, qui se déroulent en coulisses et que nous tenons bien souvent pour acquises, sont connectées à Internet d'une manière ou d'une autre, et un énorme pourcentage de ce trafic circule à travers le réseau Cloudflare, à chaque seconde de la journée. Le réseau Cloudflare, l'un des plus vastes du monde, dispose d'un point de vue complet et inégalé sur l'activité des utilisateurs, ainsi que sur les aspects généraux des connexions à Internet (comme la qualité et la connectivité). » Avec son bilan annuel, Cloudflare souhaite partager des statistiques essentielles sur la transformation du paysage d'Internet afin d'apporter sa contribution aux efforts visant à faire de l'univers en ligne un espace plus informé, plus résilient et plus sécurisé. Vous trouverez ci-dessous une liste des points les plus saillants de l'année 2024 : Service Internet le plus populaire : Google occupe la première place pour la troisième année consécutive, suivi par Facebook (n° 2), Apple (n° 3) et TikTok (n° 4), soit un quarté inchangé depuis 2023. WhatsApp, en revanche, entre pour la première fois dans le top 10 des services les plus populaires à travers le monde. Service d'IA générative le plus populaire : Codeium, Claude et CoPilot sont de nouveau-venus dans le top 10 des services d'IA générative les plus en vogue (respectivement en 3e, 5e et 7e position), tandis qu'OpenAI conserve la première place pour la deuxième année consécutive. Service de jeu le plus populaire : les consommateurs de jeux vidéo ont propulsé Steam dans le top 5 des services les plus populaires pour la première fois, tandis que Minecraft a fait son entrée dans le top 10 cette année. Roblox conserve toutefois sa position de leader pour la quatrième année consécutive. Secteur le plus visé : le secteur des jeux vidéo/jeux de hasard est devenu la cible principale des acteurs malveillants à l'échelle mondiale, en dépassant le secteur de la finance, qui était le plus touché par les attaques en 2023. Fait remarquable, les menaces ont connu une forte croissance dans les semaines précédant le Super Bowl aux États-Unis. Pannes d'Internet observées : plus de la moitié des pannes d'Internet à travers le monde résultaient de coupures d'initiative gouvernementale, bien souvent en réponse à des manifestations ou des troubles civils, voire pour prévenir la tricherie lors des examens. Divers pays, dont le Mozambique, l'Irak, la Syrie, le Bangladesh, le Sénégal, le Pakistan et bien d'autres s'en sont trouvés directement affectés. Trafic malveillant : le réseau Internet devient un espace de plus en plus dangereux, avec près de 6,5 % du trafic mondial considéré comme potentiellement malveillant et atténué en conséquence (une légère augmentation depuis 2023). Bots IA les plus agressifs : les bots et les robots d'indexation soutenus par IA ont fait les gros titres pour leur capacité à consommer le contenu avec un appétit vorace. Toutefois, si Bytespider (ByteDance) et ClaudeBot (Anthropic) se sont révélés les plus actifs, les deux bots ont vu leur trafic général décliner progressivement au cours de l'année. « Le service Cloudflare Radar a été lancé en 2020, lorsque nous avons constaté les effets spectaculaires de la pandémie sur la manière dont nous interagissions avec Internet et l'importance liée au fait de permettre à ces statistiques d'être accessibles à tous », précise David Belson, Head of Data Insight chez Cloudflare. Notre bilan annuel fait partie des engagements pris par Radar envers la démocratisation des données de Cloudflare. Il propose une vue sur les schémas et les tendances du trafic Internet, que chacun peut explorer à sa convenance. » Ces données sont issues de Cloudflare Radar, un outil gratuit permettant à chacun de constater les tendances mondiales et de consulter des statistiques sur l'utilisation d'Internet dans son ensemble. Le service Radar est soutenu par des données provenant du réseau mondial de Cloudflare (l'un des plus vastes du monde, avec plus de 330 villes couvertes dans plus de 120 pays), ainsi que des données agrégées et anonymisées issues du résolveur DNS public 1.1.1.1, une solution Cloudflare largement utilisée comme moyen rapide et privé de naviguer sur Internet. Pour en savoir plus sur le bilan Year in Review de Cloudflare, merci de consulter les ressources ci-dessous : Blog : Bilan annuel Cloudflare 2024 Blog : Les services Internet les plus populaires en 2024 Microsite Year in Review 2024 À propos de Cloudflare Cloudflare, Inc. (NYSE : NET) est le leader dans le domaine du cloud de connectivité. Nous fournissons aux entreprises tous les moyens nécessaires pour rendre leurs collaborateurs, leurs applications et leurs réseaux plus rapides et plus sûrs, partout dans le monde, tout en réduisant la complexité et les coûts. Le cloud de connectivité Cloudflare propose la plateforme unifiée la plus complète en matière de produits et d'outils de développement cloud-native, permettant à toutes les entreprises de bénéficier des mesures de contrôle dont elles ont besoin pour travailler, développer et dynamiser leur activité. Reposant sur l'un des réseaux les plus vastes et les plus interconnectés du monde, Cloudflare bloque chaque jour des milliards de menaces en ligne pour le compte de ses clients. Des millions d'entreprises et d'organisations nous font confiance, des plus grandes marques aux entrepreneurs individuels et aux PME, en passant par divers organismes à but non lucratif, groupes d'assistance humanitaire et administrations à travers le monde. Pour en apprendre davantage sur le cloud de connectivité Cloudflare, rendez-vous sur cloudflare.com/connectivity-cloud. Pour découvrir les nouvelles tendances et informations concernant Internet, rendez-vous sur https://radar.cloudflare.com. Suivez-nous : Blog | X | LinkedIn | Facebook | Instagram Déclarations prospectives Le présent communiqué de presse contient des déclarations prospectives au sens de la section 27A de la loi Securities Act de 1933, dans sa version modifiée, et de la section 21E de la loi Securities Exchange Act de 1934, dans sa version modifiée, lesquelles déclarations comportent des incertitudes et risques substantiels. Dans certains cas, les déclarations prospectives peuvent être identifiées par la présence de mots tels que « peut », « sera », « devrait », « s'attend à », « étudie », « planifie », « prévoit », « pourrait », « a l'intention de », « vise », « projette », « envisage », « considère », « estime », « prédit », « potentiel » ou « continue » ou de la forme négative de ces mots ou d'autres termes ou expressions similaires concernant les attentes, la stratégie, les plans ou les intentions de Cloudflare. Toutes les déclarations prospectives ne contiennent cependant pas les termes identificateurs suscités. Les déclarations prospectives exprimées ou sous-entendues dans le présent communiqué de presse comprennent, sans s'y limiter, les déclarations à l'égard du réseau mondial de Cloudflare, des produits et technologies de Cloudflare, du développement technologique, des opérations, de la croissance, des initiatives, stratégies ou tendances du marché futures de Cloudflare, ainsi que des commentaires formulés par le CEO de Cloudflare et notre Head of Data Insight. Les résultats réels peuvent différer sensiblement des résultats énoncés ou sous-entendus dans les déclarations prospectives en raison d'un certain nombre de facteurs, notamment, sans s'y limiter, les risques détaillés dans les documents déposés par Cloudflare auprès de la Securities and Exchange Commission (SEC), comme notre rapport annuel sur formulaire 10-Q déposé le 7 novembre 2024, ainsi que d'autres documents susceptibles d'être déposés ponctuellement par Cloudflare auprès de la SEC. Les déclarations prospectives effectuées dans le présent communiqué de presse concernent uniquement les événements survenus à la date à laquelle sont effectuées lesdites déclarations. Cloudflare ne s'engage aucunement à mettre à jour les déclarations prospectives contenues dans le présent communiqué de presse afin de refléter des événements ou des circonstances postérieurs à la date du présent communiqué de presse ou de refléter de nouvelles informations ou la survenue d'événements imprévus, sauf dans les cas prévus par la loi. Cloudflare peut ne pas parvenir à concrétiser réellement les plans, intentions ou attentes divulgués dans ses déclarations prospectives et le lecteur ne devrait donc pas se fier indûment à ces déclarations. © 2024 Cloudflare, Inc. Tous droits réservés. Cloudflare, le logo Cloudflare et les autres marques Cloudflare sont des marques commerciales et/ou des marques déposées de Cloudflare, Inc. aux États-Unis et dans d'autres juridictions. Tous les autres noms et marques mentionnés dans le présent document peuvent être des marques commerciales de leurs propriétaires respectifs. Coordonnées pour la presseDaniella Vallurupalli+1 650-741-3104[email protected]Page de presse"
