full_description = "This Domain Registration Agreement (“Agreement”) governs your use of the domain name registration services provided by Cloudflare (including its operation as a registrar for one or more top-level domains) (“Registrar Services”). The terms “Cloudflare,” “Registrar,” “we,” “us,” or “our” shall refer to Cloudflare, Inc. The terms “Registrant,” “you,” “your,” or “Customer” shall refer to any individual or entity who accepts this Agreement and/or uses the Registrar Services. Your acceptance of this Agreement signifies that you have read, understand, acknowledge and agree to be bound by this Agreement, which incorporates by reference (i) Cloudflare’s Self-Service Subscription Agreement or mutually signed Enterprise Subscription Agreement solely with respect to the Registrar Services explicitly set forth in the Order Form or Insertion Order, as applicable (“Subscription Agreement”), (ii) all agreements, guidelines, policies, practices, procedures, registration requirements or operational standards of the top-level domain (“TLD”) in which you register any domain (“Registry Policies”), and (iii) any plan limits, product disclaimers or other restrictions presented to you on the Registrar Services pages of the Cloudflare website (this “Site”). IN THE EVENT YOUR ACCESS AND USE OF THE CLOUDFLARE SERVICES IS SUBJECT TO OUR SELF-SERVICE SUBSCRIPTION AGREEMENT, YOU AGREE TO THE USE OF ARBITRATION TO RESOLVE ANY DISPUTES ARISING UNDER THIS AGREEMENT RATHER THAN A JURY TRIAL OR ANY OTHER COURT PROCEEDINGS, AND TO WAIVE YOUR PARTICIPATION IN CLASS ACTION OF ANY KIND AGAINST CLOUDFLARE, AS SET FORTH IN THE SELF-SERVICE SUBSCRIPTION AGREEMENT. If you are entering into this Agreement on behalf of a company, organization or another legal entity (an “Entity”), you are agreeing to this Agreement for that Entity and representing to Cloudflare that you have the authority to bind such Entity to this Agreement, in which case the terms “Registrant,” “you,” “your” or “Customer