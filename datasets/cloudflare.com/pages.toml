description = "Magic WAN Connector is used to on-ramp your traffic to Cloudflare. Once the device has access to the Internet, it automatically connects to the Cloudflare network. Learn how to introduce it in your network to support various use cases."
full_description = "Cloudflare provides Security, Performance, and Reliability for anything connected to the Internet. Refer to our latest resources to learn how you can leverage our integrated global cloud network. Magic WAN Connector is used to on-ramp your traffic to Cloudflare. Once the device has access to the Internet, it automatically connects to the Cloudflare network. Learn how to introduce it in your network to support various use cases. In this implementation guide we will be focusing on the L7 / Application Layer security for HTTP/S requests targeting proxied hostnames, including the first connection between client and Cloudflare. This guide explains how to set up Cloudflare's Web Application Firewall in production across multiple zones and apps. It focuses on enterprise features, like the account level WAF, and includes tips for deploying rulesets, handling exceptions, and reducing maintenance. Government departments and agencies need to protect their users when they access the Internet. Protective DNS allows a simple solution to block traffic from reaching malicious sites and alerts security organizations when incidents occur. SaaS providers need to extend their service beyond their own domains to those of their end customers. Cloudflare for SaaS lets providers give each end customer SSL certificate issuance, traffic routing, and advanced customization. Learn how to use a SASE platform to ensure all access into, and data downloaded from SaaS applications is secured leveraging device, identity and network information. Use Cloudflare to provide a secure, high-performance solution for both fixed-location and roaming connected devices. Key features include mutual TLS, API security, DDoS protection, and content cache. Architectures of how customers can protect and secure inbound and outbound traffic for their public, Internet-facing networks with Cloudflare. Cloudflare Zero Trust can often replace costly Virtual Desktop Infrastructure (VDI) all together, but in other cases can help secure access to it or from it. This document provides clarity around each of these use cases."
