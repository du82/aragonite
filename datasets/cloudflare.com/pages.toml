["https://cloudflare.com/plans/faq"]
title = "Cloudflare Frequently Asked Questions | Cloudflare"
description = "Frequently asked questions about Cloudflare's plans, products, and solutions."
full_description = "Find some of Cloudflare’s most frequently asked questions about our plans, getting started, and billing. Cloudflare protects and accelerates any website online. Once your website is a part of the Cloudflare community, its web traffic is routed through our intelligent global network. We automatically optimize the delivery of your web pages so your visitors get the fastest page load times and best performance. We also block threats and limit abusive bots and crawlers from wasting your bandwidth and server resources. Cloudflare's Business plan offers a 100% uptime guarantee. In the event of downtime, customers receive a service credit against their monthly fee, in proportion to the respective disruption and affected customer ratio. You can view the full Business plan SLA, here: https://www.cloudflare.com/business-sla/ Cloudflare Enterprise customers receive a 10x credit (included in the Standard Success Offering) against the monthly fee, in proportion to the respective disruption and affected customer ratio. The Premium Success Offering includes 25x reimbursement uptime SLA. You can view the full Enterprise plan SLA, here: https://www.cloudflare.com/enterprise_support_sla/ Yes, you can use Cloudflare for free. Cloudflare's Free plan provides the most basic website performance and security features. If you need more, you can always upgrade to a higher tier plan. Our pricing is on a 'per-domain' basis. That means that every domain is charged separately - whereas the number of subdomains does not make a difference. For example, if you upgrade example1.com and example2.com to the Pro plan, they will be charged separately, and you will pay $40/month. You can have as many subdomains like test1.example1.com or test2.example1.com as you want, and this will not incur any extra charges. The date you first select a paid plan will be the recurring billing date. For example: If you sign up for the first time on January 10, all future charges will be billed on the 10th of every month."
