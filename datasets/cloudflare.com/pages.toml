["https://cloudflare.com/case-studies/eqt"]
title = "EQT & Cloudflare | Case Study | Cloudflare"
description = "Leveraging unified Cloudflare services in the connectivity cloud, leading global investment and private equity firm EQT improves security, performance, accessibility, and reliability"
full_description = "Founded in 1994, and publicly listed since 2019, EQT is a global investment company headquartered in Stockholm, Sweden. With over €100 billion in assets under management, EQT’s business lines cover private equity, venture capital, infrastructure, real estate, and other sectors. EQT’s investment strategy combines sector-specific expertise (e.g. healthcare, technology, services) with thematic focuses on macro challenges, which today include climate and nature, health and wellbeing, inclusion and equality, and urbanization. Over the past five years, EQT has continued its strong historic performance — its portfolio companies grew revenue by 17%, EBITDA by 18%, and employee count by 7% on average annually. In particular, its private equity business is one of the largest in the world, ranking third in Private Equity International’s PEI 300 in 2023 based on capital raised over the past five years. In 2022, EQT grew its Asian presence by acquiring Baring Private Equity Asia (BPEA). As a result of the expansion, EQT now operates in countries representing 80% of the global GDP across Europe, North America, and Asia Pacific. In addition to expanding its global and regional presence, over the past few years, EQT completed a major cloud migration and rapidly scaled its workforce. The combined changes and growth raised the stakes for its central IT and security team, which is responsible for both protecting its employees and investors and supporting security for its portfolio companies. To prepare for its expansion, in 2017, EQT began migrating all of its on-prem infrastructure and applications to a 100% multi-cloud architecture. To aid in scaling its broader digital transformation goals, EQT began to explore cloud-based security vendors. More recently, with the 2022 BPEA EQT merger, the company’s global headcount jumped from roughly 800 employees to more than 1800. In response, EQT has focused on scaling protections for EQT workers and strengthening cybersecurity across its new portfolio companies. EQT also continues to grow as a public company, increasing investor attention and regulatory scrutiny."
