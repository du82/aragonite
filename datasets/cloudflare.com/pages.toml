["https://cloudflare.com/case-studies/telus"]
title = "TELUS & Cloudflare | Customer Story | Cloudflare"
description = "The communications technology leader addresses growing cyber threats, saves money and improves digital experiences for millions of customers"
full_description = "TELUS is growing rapidly. Headquartered in Canada, TELUS Corporation is a dynamic, world-leading global communications technology company with more than 19 million customer connections across wireline, wireless, Internet, security, entertainment and TV services. The company is also expanding into new verticals, including health technology, agricultural technology, energy, and smart home technology. To succeed in highly competitive markets, TELUS technology leaders are focused on building a world-class engineering organization. That team is responsible for developing innovative products and delivering outstanding digital experiences to customers across Canada and beyond. Among other technology investments, TELUS is currently migrating key workloads from on-premises data centers to the cloud. “Moving to the cloud creates great opportunities for accelerating our pace and improving the quality of our services,” says Steve Tannock, director of platform at TELUS. However, the cloud migration and other initiatives also have the potential for amplifying security challenges by expanding the company’s attack surface. “TELUS is a high-value target for attackers,” says Tannock. “In particular, the volume, quality, and sophistication of Distributed Denial of Service (DDoS) attacks are always increasing. Addressing those threats is a high priority.” Another challenge was a heterogeneous IT and security environment — which stemmed in part from the company’s growth through acquisitions. “Initially, we had very piecemeal, uneven protection. Every team, every application and every surface had its own solutions,” says Tannock. “Some of those solutions were delivered as physical appliances that were no longer relevant to a cloud approach.” The complexity of this security environment slowed incident responses and even affected retention of employees. “We were seeing an increased number of DDoS attacks that were not mitigated. As a result, our team was spending lots of time on call, which was stressful and led to burnout,” says Tannock. “We needed to completely rethink how we were protecting the company.”"
