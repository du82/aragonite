["https://cloudflare.com/application/privacypolicy"]
title = "Application Privacy Policy | Cloudflare"
description = "Read about Application Privacy Policy"
full_description = "We have updated our February 23, 2023, Application Privacy Policy to add contact information about our entities in Mexico and Malaysia. This Application Privacy Policy (“Application Privacy Policy”) outlines the information that Cloudflare gathers, how we use that information, and the options you have to access, correct, or delete such information when you use the Cloudflare Application(s). As used in this Application Privacy Policy, “Cloudflare,” “Us” or “We” refers to Cloudflare, Inc. and its affiliates as listed at the end of this policy. Capitalized terms used but not defined herein have the meanings ascribed to them in the Application Terms of Service. This Application Privacy Policy does not apply to your use of the Application as part of Cloudflare Zero Trust, in which case the Cloudflare Privacy Policy applies. 1. Scope of PolicyOur mission to help build a better Internet is rooted in the importance we place on establishing trust with the Internet community globally. To earn and maintain that trust, we commit to communicating transparently, providing security, and protecting the privacy of data on our systems. This Policy only applies to Cloudflare’s collection, use, and disclosure of personal information in connection with the use of the Cloudflare Application(s). This Policy does not apply to Cloudflare’s collection, use, and disclosure of personal information through the Application when the Application is used as part of a Cloudflare Zero Trust account, as described in more detail in Section 3. 2. Information We CollectWe only collect and store the minimum amount of data we believe is required to operate and improve the Application. There are three categories of data that we collect: Account Data, Operational Data, and DNS Resolver Information as described more fully below. Your Account Data and Operational Data are pseudonymized. Your DNS Resolver Information is anonymized at our edge data centers. We do not collect your name, phone number, or credit card information (or records of any payments collected by the applicable App Store). The only information we receive from the applicable App Store is a limited amount of information that we need to confirm your subscription for a Service. We do not receive from the App Store any of your personal data or other information about your App Store account. We only receive your email address (and name, if you voluntarily provide it) if you have decided to give us feedback and/or report bugs."
