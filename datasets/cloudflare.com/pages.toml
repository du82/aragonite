title = "Cloudflare Registrar Abuse Process | Cloudflare"
description = "Cloudflare Registrar offers secure domain name registration and management services."
full_description = "Cloudflare Registrar offers secure domain name registration and management services. To report abuse of a domain name or other concerns specifically related to our registrar services, please select a “Registrar -” report category on Cloudflare's abuse form. To file an abuse complaint about content or other issues that are not specific to Cloudflare's registrar services, please visit Cloudflare's abuse page. Trademark. If you have concerns about a particular domain name, we would encourage you to contact the domain name registrant directly using the WHOIS lookup process. You may also file an administrative proceeding against the registrant pursuant to ICANN's Uniform Domain Name Dispute Resolution (UDRP) or (for new TLDs) the Uniform Rapid Suspension Policy (URS) process. Consistent with ICANN regulations, Cloudflare will not intervene in domain name disputes between domain name registrants and third parties until instructed to take action by the dispute resolution expert. Inaccurate WHOIS information. ICANN requires registrars to update information about a domain in the WHOIS records in a timely manner to ensure the information is current and accurate. To report WHOIS information that is inaccurate or incomplete, please visit Cloudflare's abuse page to file a report. Cloudflare will take reasonable steps to investigate claims of inaccurate data. Domain hijacking. Domain hijacking occurs when the registration of a domain name is changed without the permission of the original registrant. If you believe your domain has been moved to Cloudflare's registrar without your permission, please visit Cloudflare's abuse page to file a report. Law enforcement officials can contact us directly at abuse+law@cloudflare.com. You must include your badge & case number when contacting us to receive a response. It is a crime to falsely impersonate a law enforcement official."
