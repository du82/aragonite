["https://cloudflare.com/application-services/products/rate-limiting"]
title = "Advanced Rate Limiting & Brute Force Protection | Cloudflare"
description = "Cloudflare offers advanced rate limiting to protect against brute force attacks, DDoS attacks, and API abuse. Learn more about advanced rate limiting."
full_description = "Rate Limiting protects against denial-of-service attacks, brute force login attempts, traffic surges, and other types of abuse targeting APIs and applications. Identify abusive traffic with high accuracy by rate limiting traffic based on any parameter of a request. Defend against brute force login attacks seeking to take over accounts and steal sensitive information. Avoid unpredictable costs associated with traffic spikes and enumeration attacks. We will not charge you for usage when you are under volumetric attack. Choose IP-based Rate Limiting to protect unauthenticated endpoints, limit the number of requests from specific IP addresses, and handle abuse from repeat offenders. Upgrade to Advanced Rate Limiting if you want to protect your APIs from abuse, mitigate volumetric attacks from authenticated API sessions, and take full control of the parameters you rate limit on. Cloudflare has been recognized as a Representative Vendor in the Gartner Market Guide for WAAP report. We believe this recognition validates that we protect against emerging threats faster, offer tighter integration of security capabilities, and deliver powerful ease of use and deployment. “When other companies experienced a data leak, the attackers would often try the stolen email and password combinations on our sites. We always knew when there was another attack, but it was business as usual because Cloudflare detected and stopped it before it became a problem.” Protect your website URLs and API endpoints from suspicious requests that exceed defined thresholds. Granular configuration options include status codes, specific URLs, request limits, and request methods. Visitors hitting defined request thresholds can trigger custom responses, including mitigating actions such as challenges or CAPTCHAS, response codes, timeouts, and blocking. Scale and protect your resources with analytics including the amount of malicious traffic blocked by rule and the number of requests that reach your origin."
