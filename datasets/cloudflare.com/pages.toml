["https://cloudflare.com/learning/access-management/what-is-sase"]
title = "What is SASE? | Secure access service edge | Cloudflare"
description = "Secure access service edge (SASE) is a cloud-based architecture that unifies software-defined networking and security services. Learn about SASE benefits."
full_description = "Secure access service edge (SASE) architecture is an IT model that combines security and networking services on one cloud platform. Secure access service edge (SASE) is an architectural model that unifies network connectivity with network security functions onto a single platform. Unlike traditional enterprise networking, the modern SASE approach places network controls on the cloud edge instead of the corporate data center. This allows enterprises to provide simpler, secure, and consistent access from any user to any application — regardless of location. In other words, SASE offers organizations a streamlined way to manage previously disjointed infrastructure — networking and access control — together. SASE platforms converge network connectivity with multiple Zero Trust security services that employ the principle of least privilege. With Zero Trust, users that authenticate successfully only have access to the resources and applications necessary for their role. SASE creates a unified corporate network based on cloud services run over the Internet. This allows organizations to transition away from managing many architectural layers and disparate point solutions. A SASE architecture is important because it is more effective than traditional IT security at connecting and protecting the modern organization’s workforce. In the ‘old world’ model (i.e., a “castle and moat” security architecture), an organization’s IT infrastructure is fairly homogeneous and protected by a firewall. To access network resources, employees not in the office (or contractors and other third parties) connect to the network via a virtual private network (VPN) and firewall, or use another network route via a public IP address. Then, anyone inside the network “perimeter” also has access to the applications and data within that network. However, with more applications and data now living in the cloud, it has become riskier and more complex to manage network security with this approach. For example, traditional security struggles to keep pace with the following trends:"
