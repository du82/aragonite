["https://www.cloudflare.com/nl-nl/press-releases/2024/cloudflare-publishes-top-internet-trends-for-2024"]
title = """
Cloudflare publiceert Top Internet Trends voor 2024
 | Cloudflare"""
description = "Cloudflare publiceert Top Internet Trends voor 2024"
full_description = '''Cloudflare publiceert Top Internet Trends voor 2024 Nieuwe gegevens onthullen een recordniveau van door de overheid opgelegde internetafsluitingen, een stijging van het kwaadaardige verkeer en cyberaanvallen gericht op de gok- en gamingsector San Francisco, CA, 9 december 2024 – Cloudflare, Inc. (NYSE: NET), het toonaangevende bedrijf op het gebied van connectiviteitsclouds, heeft vandaag zijn vijfde jaarlijkse Year in Review gepubliceerd, waarin wereldwijde inzichten in het internet en de beveiligingstrends van 2024 aan bod komen, en er dieper wordt ingegaan op de populairste internetservices. Het internet is de hoeksteen van de wereldwijde verbinding en geeft toegang tot cruciale informatie en services die ons dagelijkse leven aansturen. Vanwege deze afhankelijkheid is het internet de ruggengraat van de huidige maatschappij geworden. Het internet helpt hulpverleners bij het redden van levens, legt contacten tussen communities en hun verkozen vertegenwoordigers, aangezien ze zich kunnen aanmelden om te stemmen, en ondersteunt de wereldwijde digitale economie. Uit het 2024 Year in Review van Cloudflare blijkt hoe elk jaar het internationale verkeer toeneemt (tot wel 17% op jaarbasis), omdat meer mensen en meer apparaten op het internet worden aangesloten. Dit zorgt voor nieuwe trends die aantonen hoe sterk wij wereldwijd van het internet afhangen. "We gebruiken het internet bijna constant, maar veel mensen zien het nog steeds puur als een verzameling webpagina's. Het internet is echter overal, verweven met bijna alle dagelijkse activiteiten van het moderne leven. Denk aan de manier waarop we met elkaar omgaan op social media, onze slimme koelkasten en stofzuigers gebruiken, reizen van A naar B via deelauto-apps, verbinding maken met onze bank en meer", aldus Matthew Prince, CEO en medeoprichter van Cloudflare. "Al deze interacties die we vaak voor lief nemen, zijn achter de schermen op de een of andere manier verbonden met het internet en een enorm percentage daarvan loopt via het netwerk van Cloudflare, elke seconde van elke dag." En als een van de grootste ter wereld heeft het wereldwijde netwerk van Cloudflare een ongeëvenaard uitgebreid overzicht van gebruik van en algemene kwaliteit en connectiviteit op het web." Cloudflare wil met zijn Year in Review-rapport de belangrijkste inzichten delen over het veranderende internetlandschap om zo de online wereld beter geïnformeerd, veerkrachtiger en veiliger te maken. Enkele van de hoofdpunten voor 2024 zijn: Populairste internetservice: Google staat voor het derde achtereenvolgende jaar op nummer 1, gevolgd door Facebook (2), Apple (3) en TikTok (4). Dit is onveranderd ten opzichte van 2023. WhatsApp wist echter voor het eerst een plekje in de top tien van de populairste services wereldwijd te bemachtigen. Populairste generatieve AI-service: Codeium, Claude en CoPilot waren nieuwkomers in de top tien van de populairste generatieve AI-services (respectievelijk de nummer 3, 5 en 7). OpenAI stond voor het tweede opeenvolgende jaar op nummer één. Populairste gaming-services: Gaming-klanten zorgden ervoor dat Steam voor het eerst een plek kreeg in de top vijf van populairste services. Minecraft maakte dit jaar zijn entree in de top tien. Ondertussen blijft Roblox voor het vierde achtereenvolgende jaar op nummer 1 staan. Meest getroffen sector: Wereldwijd zijn de gaming- en gokindustrie het belangrijkste doelwit geworden van criminelen. Daarmee is de financiële sector ingehaald, die in 2023 de meest getroffen categorie was. Opmerkelijk was dat de dreigingen vooral toenamen in de weken voorafgaand aan de Super Bowl in de Verenigde Staten. Waargenomen internetstoringen: Meer dan de helft van alle wereldwijde internetstoringen waren het resultaat van een door de overheid opgelegde afsluiting. Vaak gebeurde dit in reactie op protesten, burgerlijke onrust of zelfs om fraude tijdens examens te voorkomen. Dit had invloed op landen zoals o.a. Mozambique, Irak, Syrië, Bangladesh, Senegal, Pakistan. Kwaadaardig verkeer: Het internet is het voorbije jaar niet significant gevaarlijker geworden, ongeveer 6,5% van al het wereldwijde verkeer wordt ingeperkt als mogelijk kwaadaardig - slechts een lichte stijging ten opzichte van 2023. Agressiefste AI-bots: AI-bots en -crawlers zijn in het nieuws geweest vanwege het gulzig verslinden van content. Maar hoewel Bytespider (ByteDance) en ClaudeBot (Anthropic) het actiefst waren, is van beide het totale verkeer in de loop van het jaar langzaam afgenomen. “In 2020 is Cloudflare Radar gelanceerd. Toen begon de drastische impact van de pandemie op de manier waarop we omgingen met het internet en vonden we het belangrijk dat die inzichten voor iedereen toegankelijk moesten zijn", aldus David Belson, Head of Data Insight bij Cloudflare. "Ons Year in Review is een onderdeel van de inzet van Radar om de gegevens van Cloudflare te democratiseren. We willen iedereen moeiteloos een kijkje geven in de internettrends en -patronen om deze te ontdekken." De gegevens komen uit Cloudflare Radar, een gratis tool waarmee iedereen wereldwijde trends en inzichten kan bekijken op het internet. Radar wordt ondersteund door gegevens uit het wereldwijde netwerk van Cloudflare (een van de grootste ter wereld, verspreid over meer dan 330 steden in meer dan 120 landen) en verzamelde en geanonimiseerde gegevens uit de Openbare DNS-resolver (Domain Name System-resolver) van 1.1.1.1 van Cloudflare, dat veel wordt gebruikt als een snelle privé-manier om op het internet te browsen. Bekijk de onderstaande bronnen voor meer informatie over Cloudflare's Year in Review: Blog: Cloudflare Year In Review 2024 Blog: Most Popular Internet Services 2024 2024 Year in Review Microsite Over Cloudflare Cloudflare, Inc. (NYSE: NET) is het toonaangevende bedrijf op het gebied van connectiviteitsclouds. Het stelt organisaties in staat om hun medewerkers, applicaties en netwerken overal sneller en veiliger te maken, terwijl de complexiteit en de kosten afnemen. Cloudflare's connectiviteitscloud levert het meest complete, uniforme platform van cloud-native producten en ontwikkelaarstools, zodat elke organisatie de controle kan krijgen die ze nodig hebben om te werken, te ontwikkelen en hun bedrijf te versnellen. Cloudflare wordt aangedreven door een van 's werelds grootste en meest verbonden netwerken en blokkeert dagelijks miljarden dreigingen online voor haar klanten. Miljoenen organisaties vertrouwen erop, van de grootste merken tot ondernemers en kleine bedrijven tot non-profitorganisaties, humanitaire groepen en overheden over de hele wereld. Kom meer te weten over Cloudflare’s connectivitetiscloud op cloudflare.com/connectivity-cloud. Kom meer te weten over de laatste internettrends en -inzichten op https://radar.cloudflare.com. Volg ons: Blog | X | LinkedIn | Facebook | Instagram Toekomstgerichte uitspraken Dit persbericht bevat toekomstgerichte uitspraken zoals bedoeld in Sectie 27A van de Securities Act van 1933, zoals gewijzigd, en Sectie 21E van de Securities Exchange Act van 1934, zoals gewijzigd, welke uitspraken aanzienlijke risico's en onzekerheden met zich meebrengen. In sommige gevallen kun je toekomstgerichte uitspraken herkennen aan woorden als 'kunnen', 'zullen', 'zouden moeten', 'verwachten', 'verkennen', 'plannen', 'anticiperen', 'zouden kunnen', 'voornemen', 'doel', 'projecteren', 'overwegen', 'geloven', 'schatten', 'voorspellen', 'potentieel' of 'doorgaan' of de negatieve equivalenten van deze woorden, of andere soortgelijke termen of uitdrukkingen die de verwachtingen, strategie, plannen of bedoelingen van Cloudflare betreffen. Niet alle toekomstgerichte uitspraken bevatten echter deze identificerende woorden. Toekomstgerichte uitspraken uitgedrukt of geïmpliceerd in dit persbericht omvatten, maar zijn niet beperkt tot, verklaringen met betrekking tot het wereldwijde netwerk van Cloudflare, producten en technologie van Cloudflare, de technologische ontwikkeling van Cloudflare, toekomstige activiteiten, groei, initiatieven of strategieën, algemene markttrends en opmerkingen van de CEO van Cloudflare en Head of Data Insight. Daadwerkelijke resultaten kunnen wezenlijk verschillen van die vermeld of geïmpliceerd in toekomstgerichte verklaringen door een aantal factoren, waaronder maar niet beperkt tot risico's die worden beschreven in Cloudflare's filings bij de Securities and Exchange Commission (SEC), waaronder het Quarterly Report on Form 10-Q van Cloudflare ingediend op 7 november 2024, evenals andere filings die Cloudflare van tijd tot tijd kan doen bij de SEC. De toekomstgerichte uitspraken in dit persbericht hebben alleen betrekking op gebeurtenissen op het moment waarop de uitspraken zijn gedaan. Cloudflare neemt geen verplichting op zich om toekomstgerichte verklaringen in dit persbericht bij te werken om gebeurtenissen of omstandigheden na de datum van dit persbericht te weerspiegelen of om nieuwe informatie of het optreden van onverwachte gebeurtenissen te weerspiegelen, behalve zoals vereist door de wet. Het is mogelijk dat Cloudflare de plannen, bedoelingen of verwachtingen die in de toekomstgerichte verklaringen van Cloudflare worden vermeld, niet daadwerkelijk realiseert en u moet niet overmatig vertrouwen op de toekomstgerichte verklaringen van Cloudflare. © 2024 Cloudflare Inc. Alle rechten voorbehouden. Cloudflare, het Cloudflare-logo en andere Cloudflare-merken zijn handelsmerken en/of geregistreerde handelsmerken van Cloudflare, Inc. in de VS en andere rechtsgebieden. Alle andere merken en namen waarnaar in dit document wordt verwezen, kunnen handelsmerken zijn van hun respectieve eigenaars. Press Contact InformationDaniella Vallurupalli+1 650-741-3104[email protected]Press Page'''
