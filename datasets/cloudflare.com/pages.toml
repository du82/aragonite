["https://cloudflare.com/modern-slavery-act-statement"]
title = "Cloudflare’s Modern Slavery Act Statement | Cloudflare"
description = "Read about Cloudflare’s Modern Slavery Act Statement."
full_description = 'Cloudflare, Inc. and its subsidiaries (“Cloudflare,” “we,” “us”) recognize the importance of treating everyone who is employed by or works with Cloudflare with dignity and respect. We explicitly prohibit human trafficking and the use of involuntary labor. We are equally committed to working with industry partners to drive common high standards and best employment and procurement practices. Cloudflare was launched in 2010 with the mission to help build a better Internet. In the pursuit of this goal, we are committed to operating with the highest level of ethics and integrity in everything we do. This means ensuring our suppliers are committed to ethical employment practices. We abide by all applicable anti-slavery and human trafficking laws, including the U.K. Modern Slavery Act of 2015 and Australia’s Modern Slavery Act of 2018 (collectively, the "Acts"). This statement provides an overview of the actions Cloudflare is committed to following to ensure that we and our suppliers are not engaged in the use of involuntary labor, including child labor. Cloudflare offers various network solutions that generally include a pass-through security service, managed domain name system (DNS) solutions, a public DNS resolver, a content distribution network (CDN), edge computing services, and registrar services. Accordingly, the vast majority of our direct supply chain spend is for the development and improvement of our network. As of December 2023, Cloudflare’s network spans 310 cities in more than 120 countries. The goods we procure as part of our business are manufactured across the globe. Cloudflare recognizes the need to inspect our supply chain for conditions that may put people at risk of involuntary labor. Cloudflare is aware that the most important step we can take to protect ourselves and others is to carefully select and evaluate the third parties we do business with, including our suppliers. Third parties we do business with agree to accept our Third Party Code of Conduct and abide by applicable laws including fair employment practices.'
