full_description = "Cloudflare and CrowdStrike have partnered to make it easy for organizations of all sizes to build Zero Trust policies based on CrowdStrike’s Zero Trust Assessment (ZTA) score — a continuous real-time security posture assessment across all endpoints in an organization. This enables organizations to enforce conditional access and gateway policies based on device health and compliance checks to mitigate risks posed by compromised or malicious devices. As these policies work across our entire Zero Trust platform, organizations can use them to build powerful rules invoking Browser Isolation, Tenant control, Anti-virus, or any part of their Cloudflare deployment. Learn about Cloudflare’s partnership with CrowdStrike in this blog post around our Endpoint Protection partners. Learn how Cloudflare and CrowdStrike deepened our partnership to enable users to identify, investigate, and remediate threats faster through multiple new integrations. Learn how Cloudflare partners with leading endpoint protection providers to make Zero Trust security seamless for our customers. Discover how Cloudflare and CrowdStrike joined forces to make it easier than ever for businesses to deploy seamless Zero Trust protection from the network to the device."
