["https://www.cloudflare.com/es-la/press-releases/2024/cloudflare-publishes-top-internet-trends-for-2024"]
title = """
Cloudflare publica las principales tendencias en Internet de 2024
 | Cloudflare"""
description = "Cloudflare publica las principales tendencias en Internet de 2024"
full_description = 'Cloudflare publica las principales tendencias en Internet de 2024 Nuevos datos revelan un aumento sin precedentes de cortes de Internet ordenados por gobiernos, un incremento en el tráfico malicioso y ciberataques dirigidos a las industrias de apuestas y juegos San Francisco, CA, 9 de diciembre de 2024 – Cloudflare, Inc. (NYSE: NET), la empresa líder de conectividad cloud, publicó hoy su quinto Resumen del Año, que analiza información de Internet y tendencias de seguridad a nivel global durante 2024, junto con un informe más exhaustivo de los servicios de Internet más populares. Internet sigue siendo el medio para la conexión global y el acceso a información y servicios esenciales que sustentan nuestra vida cotidiana. Nuestra dependencia de Internet la ha convertido en el pilar de la sociedad moderna: desde ayudar a los socorristas a salvar vidas, permitir que las comunidades se conecten con sus representantes y se registren para votar, hasta apoyar a las economías digitales a nivel global. El Resumen del Año de Cloudflare 2024 destaca que cada año más personas y dispositivos se conectan a Internet, lo que aumenta el tráfico global (hasta un 17 % interanual) y genera nuevas tendencias que muestran nuestra creciente dependencia de sus funciones. "Si bien usamos Internet constantemente, muchos aún la consideran simplemente un conjunto de páginas web. Sin embargo, Internet está en todas partes, la utilizamos para casi todas las actividades cotidianas de la vida moderna: para interactuar y conectarnos en redes sociales, para usar nuestros electrodomésticos inteligentes, para desplazarnos de un lugar a otro utilizando nuestras aplicaciones de transporte, para conectarnos a nuestros bancos, etc”, afirmó Matthew Prince, director general y cofundador de Cloudflare. "Todas estas interacciones que damos por sentadas, están conectadas a Internet de una forma u otra, y una gran parte de ellas pasa por la red de Cloudflare cada segundo del día. "Y como una de las redes más grandes del mundo, Cloudflare tiene una perspectiva única sobre el uso, la calidad y la conectividad en toda la web". El objetivo de Cloudflare en su Resumen del Año es compartir datos clave sobre el cambiante panorama de Internet para ayudar a que el mundo en línea esté informado, y sea más resiliente y seguro. Estos son algunos de los aspectos más destacados de 2024: Servicio de Internet más popular: Google resultó primero por tercer año consecutivo, seguido por Facebook (2), Apple (3) y TikTok (4), sin cambios con respecto a 2023. Sin embargo, WhatsApp se posicionó por primera vez entre los diez servicios más populares a nivel mundial. Servicio de IA generativa más popular: Codeium, Claude y CoPilot ingresaron por primera vez a la lista de los diez servicios de IA generativa más populares (en los puestos 3, 5 y 7 respectivamente), mientras que OpenAI mantuvo el primer puesto por segundo año consecutivo. Servicios de juegos más populares: los usuarios de juegos hicieron que Steam ingresara por primera vez a la lista de los cinco servicios más populares, mientras que Minecraft ingresó en la lista de los primeros diez este año. Mientras tanto, Roblox se ubicó en el primer puesto por cuarto año consecutivo. Sector más atacado: a nivel mundial, el sector de juegos y apuestas fue el principal objetivo de los agentes maliciosos, superando al sector financiero, que fue el más atacado en 2023. Las amenazas aumentaron considerablemente en las semanas previas al Super Bowl en Estados Unidos. Cortes de Internet detectados: más de la mitad de todos los cortes de Internet a nivel mundial fueron interrupciones dirigidas por gobiernos, a menudo en respuesta a protestas, disturbios civiles o incluso para prevenir trampas durante exámenes, y afectó a países como Mozambique, Irak, Siria, Bangladesh, Senegal, Pakistán y otros. Tráfico malicioso: Internet no se ha convertido en un lugar significativamente más peligroso con respecto al año anterior. Aproximadamente el 6,5 % de todo el tráfico global se ha mitigado como potencialmente malicioso (un leve aumento con respecto a 2023). Bots de IA más agresivos: los bots y rastreadores de IA han aparecido en las noticias por consumir contenido de manera voraz. Pero, aunque Bytespider (ByteDance) y ClaudeBot (Anthropic) fueron los más activos, el tráfico general de ambos disminuyó gradualmente durante el año. "Cloudflare Radar se lanzó en 2020 cuando fuimos testigos del drástico impacto que tuvo la pandemia en la forma en que interactuamos con Internet, y de la importancia de que esos conocimientos sean accesibles para todos”, comentó David Belson, director de análisis de datos de Cloudflare. “Nuestro Resumen del Año forma parte del compromiso de Radar de democratizar los datos de Cloudflare, brindando una visión de los patrones y tendencias de Internet a cualquiera que quiera consultarlos”. Estos datos provienen de Cloudflare Radar, una herramienta gratuita que permite que cualquiera vea las tendencias globales y la información en todo el ámbito de Internet. Radar está impulsado por datos de la red global de Cloudflare(una de las mayores del mundo, que abarca más de 330 ciudades en más de 120 países) y datos generales y anonimizados de la Resolución de DNS público 1.1.1.1 de Cloudflare, muy utilizada como una manera rápida y privada de navegar por Internet. Para obtener más información sobre el Resumen del Año de Cloudflare, consulta los siguientes recursos: Blog: Resumen del Año de Cloudflare 2024 Blog: Servicios de Internet más populares 2024 Micrositio del Resumen del Año 2024 Acerca de Cloudflare Cloudflare, Inc. (NYSE: NET) es la empresa líder en conectividad cloud. Ayuda a las organizaciones a aumentar la velocidad y mejorar la seguridad de sus empleados, aplicaciones y redes en todas partes, al tiempo que reduce la complejidad y los costos. La conectividad cloud de Cloudflare ofrece la plataforma más completa y unificada de productos nativos en la nube y herramientas para desarrolladores, de manera que cualquier organización pueda obtener el control que necesita para trabajar, desarrollar y acelerar su negocio. Cloudflare, que utiliza una de las redes más grandes e interconectadas del mundo, bloquea por día miles de millones de amenazas en línea para sus clientes. Millones de organizaciones confían en Cloudflare, desde las marcas más importantes, emprendedores y pequeñas empresas hasta organizaciones sin fines de lucro, grupos humanitarios y gobiernos de todo el mundo. Si deseas obtener más información sobre la conectividad cloud de Cloudflare, visita cloudflare.com/connectivity-cloud. Para conocer las nuevas tendencias y perspectivas de Internet, consulta https://radar.cloudflare.com. Síguenos en: Blog | X | LinkedIn | Facebook | Instagram Proyecciones futuras Este comunicado de prensa contiene proyecciones futuras en el sentido de la Sección 27A de la Ley de Valores de 1933, y sus modificaciones, y la Sección 21E de la Ley de Intercambio de Valores de 1934, y sus modificaciones, que implican riesgos e incertidumbres sustanciales. En algunos casos, se pueden identificar proyecciones futuras porque contienen palabras como "puede", "será", "debería", "espera", "explora", "planea", "anticipa", "podría", "tiene la intención", "objetivo", "proyecto", "contempla", "cree", "estima", "predice", "potencial" o "continúa", o la forma negativa de estas palabras, u otros términos o expresiones similares que se refieren a las expectativas, estrategia, planes o intenciones de Cloudflare. Sin embargo, no todas las proyecciones contienen estas palabras identificativas. Este comunicado de prensa contiene declaraciones a futuro expresas o implícitas que incluyen, entre otras, declaraciones relacionadas con la red global de Cloudflare, los productos y la tecnología de Cloudflare, el desarrollo tecnológico de Cloudflare, las operaciones futuras, el crecimiento, las iniciativas, las estrategias, las tendencias generales del mercado y los comentarios realizados por el director general y de análisis de datos de Cloudflare. Los resultados reales podrían diferir materialmente de los declarados o implícitos en las proyecciones futuras debido a una serie de factores, que incluyen, entre otros, los riesgos detallados en las presentaciones de Cloudflare ante la Comisión de Valores y Bolsa (SEC), el Informe Trimestral de Cloudflare en el Formulario 10-Q presentado el 7 de noviembre de 2024, así como otras presentaciones que hagamos de vez en cuando ante la SEC. Las proyecciones futuras incluidas en este comunicado de prensa se refieren solo a los acontecimientos que se produzcan en la fecha en que se realizan. Cloudflare no asume obligación alguna de publicar actualizaciones de las proyecciones futuras hechas en este comunicado de prensa para reflejar eventos o circunstancias posteriores a la fecha del mismo o para reflejar nueva información o cualquier otra posible circunstancia no prevista, salvo que lo exija la ley. Quizá Cloudflare no logre los planes, las intenciones o las expectativas que se revelan en nuestras declaraciones de proyecciones futuras, y no se debe confiar plenamente en las mismas. © 2024 Cloudflare, Inc. Todos los derechos reservados. Cloudflare, su logotipo y otras marcas de Cloudflare son marcas comerciales o marcas registradas de Cloudflare, Inc. en Estados Unidos y otras jurisdicciones. Todas las demás marcas y nombres mencionados en este documento pueden ser marcas comerciales de sus respectivos propietarios. Información de contacto de prensaDaniella Vallurupalli+1 650-741-3104[email protected]Página de prensa'
