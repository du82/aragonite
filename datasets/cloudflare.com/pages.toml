["https://cloudflare.com/transparency"]
title = "Cloudflare Transparency Report | Cloudflare"
description = "An essential part of earning the trust of our customers is being transparent about the governmental requests we receive."
full_description = '''An essential part of earning and maintaining the trust of our customers is being transparent about the requests we receive from law enforcement and other governmental entities. To this end, Cloudflare publishes semi-annual updates to our Transparency Report on the requests we have received to disclose information about our customers. Cloudflare has never turned over our encryption or authentication keys or our customers' encryption or authentication keys to anyone. Cloudflare has never provided any law enforcement organization a feed of our customers' content transiting our network. Cloudflare has never modified customer content at the request of law enforcement or another third party. Cloudflare has never modified the intended destination of DNS responses at the request of law enforcement or another third party. Cloudflare has never weakened, compromised, or subverted any of its encryption at the request of law enforcement or another third party. If Cloudflare were asked to do any of these, we would exhaust all legal remedies, in order to protect our customers from what we believe are illegal or unconstitutional requests. The data presented below covers the period from July 1, 2023, to December 31, 2023. A request received in December 2023, but not processed until January 2024 will show as both “Requests received” and “Requests in process.” Also, requests for which we are waiting for a response from law enforcement before moving forward may also be reflected in "Requests in process.” The total number of domains affected and the total number of accounts affected refer only to requests which have been answered. Cloudflare receives requests for different kinds of data on its users from U.S. and foreign governments, courts and those involved in civil litigation. To provide additional transparency about the type of information Cloudflare might provide, we have broken down the types of requests we receive, as well as the legal process we require before providing particular types of information. We review every request for legal sufficiency before responding with data.'''
year_published = 2025
clearnet = "https://cloudflare.com/transparency"
category = "SitesList"
tags = ["background", "cloudflare", "data", "report", "transparency"]
