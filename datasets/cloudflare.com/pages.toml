title = "Candidate Privacy Notice | Cloudflare"
description = "This notice provides applicants with information about the personal data we collect, how and why your personal data will be used, and how long we will retain it."
full_description = 'When you apply to work with any of the Cloudflare Group of companies (Cloudflare, Inc.and its wholly owned subsidiaries as listed in our Privacy Policy (together, “Cloudflare” or“we”), we will collect the personal data contained in your application. In this case, we area "data controller.” This means that we are responsible for deciding how we hold and usepersonal data about you. This notice provides applicants (whether for an employee, worker or contractor position)with information about the personal data we collect, how and why your personal data willbe used, and how long we will retain it. It also provides you with certain information thatwe are required to provide you under Applicable Data Protection Laws. Applicable DataProtection Laws means all data protection laws and regulations of the jurisdictions of theaforenamed Cloudflare companies that are applicable to the processing of personal data. Your personal data will be processed for the purposes of managing our recruitment andhiring-related activities, which include setting up and conducting interviews and tests forapplicants, evaluating and assessing the results thereto, conducting reference and/orbackground checks, and as is otherwise needed in the recruitment and hiring processes.We process your information as necessary for our legitimate interests (that is, thesolicitation, evaluation, and selection of applicants for employment) or where we haveyour consent to do so. Collected only for valid purposes that we have clearly explained to you and not used in any way that is incompatible with those purposes. In connection with your application for work with us, we will collect your personal datafrom you, from recruitment agencies (who may provide us with information such as CVs,and your named references. We gather, store, and use the following categories ofpersonal data about you: The information you have provided on our application form, including but not limited to name, title, address, telephone number, personal email address, date of birth, gender, employment history, and qualifications.'
