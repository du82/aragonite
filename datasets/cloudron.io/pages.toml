["https://cloudron.io/legal/privacy.html"]
title = "Cloudron - Complete solution for self-hosting web apps"
description = "Cloudron is a complete solution for running apps on your server and keeping them up-to-date and secure."
full_description = '''Cloudron UG (haftungsbeschränkt) Privacy Policy Last Updated 7 July 2020 This privacy policy of Cloudron UG ("Cloudron UG", "us", "we", or "our") and it's services (collectively with the Site, the "Services") will notify you the following: What personally identifiable information is collected from you, how it is used and with whom it may be shared. What choices are available to you regarding the use of your data. The security procedures in place to protect the misuse of your information. How you can correct any inaccuracies in the information. Information Collection, Use, and Sharing We are the sole owners of the information collected by the Service. We only have access to/collect information that you voluntarily give us via email, website, Cloudron App Store access or other direct contact from you. We will not sell or rent this information to anyone. Should you contact us via email, we will use your information to respond to you, regarding the reason you contacted us. We will not share your information with any third party outside of our organization, other than as necessary to fulfill your request. Unless you ask us not to, we may contact you via email in the future to tell you about specials, new products or services, or changes to this privacy policy. Personal information In order to use Cloudron UG and it's Services, we collect and store personal information, including the full name, company name, billing address, email address, IP address, domain name, and app installations. Financial Information We do not currently collect financial information, such as your payment method (valid credit card number, type, expiration date or other financial information); that information is collected and stored by our third party payment processing companies (the "Payment Processors"), and use and storage of that information is governed by the Payment Processors' applicable terms of service and privacy policy. Cookies We use "cookies" on this site. A cookie is a piece of data stored on a site visitor's hard drive to help us improve your access to our site and identify repeat visitors to our site. For instance, when we use a cookie to identify you, you would not have to log in using a password more than once, thereby saving time while on our site. Cookies can also enable us to track and target the interests of our users to enhance the experience on our site. Usage of a cookie is in no way linked to any personally identifiable information on our site. Log Data We collect information that your browser sends whenever you visit our Site ("Log Data"). This Log Data may include information such as your computer's Internet Protocol ("IP") address, browser type, browser version, the pages of our Site that you visit, the time and date of your visit, the time spent on those pages and other statistics. Links This web site contains links to other sites. Please be aware that we are not responsible for the content or privacy practices of such other sites. We encourage our users to be aware when they leave our site and to read the privacy statements of any other site that collects personally identifiable information. Your Access to and Control Over Information You may opt out of any future contacts from us at any time. You can do the following at any time by contacting us via the email address or phone number given on our website. See what data we have about you, if any. Change/correct any data we have about you. Have us delete any data we have about you. Express any concern you have about our use of your data. Registered users have the ability to delete Personal Information related to their full name, company name, and identifiable billing information through their Accounts. Such deleted Personal Information will no longer be stored in Cloudron UG's databases. We will continue to retain billing related information for over 10 years as required by law. Security We take precautions to protect your information. When you submit sensitive information via the website, your information is protected both online and offline. Wherever we collect sensitive information (such as credit card data), that information is encrypted and transmitted to us in a secure way. You can verify this by looking for a closed lock icon in your web browser, or looking for "https" at the beginning of the address of the web page. While we use encryption to protect sensitive information transmitted online, we also protect your information offline. Only employees who need the information to perform a specific job (for example, billing or customer service) are granted access to personally identifiable information. The computers/servers in which we store personally identifiable information are kept in a secure environment. Please note that Cloudron UG cannot fully eliminate security risks associated with the collection of your information and that mistakes and security breaches may occur. We do not guarantee or warrant that such techniques will prevent unauthorized access to information about you that we store, Personal Information or otherwise. Changing your Personal Information You can change any profile related information including full name, email address, billing address by logging into our website. We do not provide a mechanism to clear automatically collected information including IP, referral URLs and Log Data. Should you want to change this, please contact us at the email listed on our website. Updates to this Policy Our Privacy Policy may change from time to time and all updates will be posted on this page.'''
