["https://cloudron.io/index.html"]
title = "Cloudron - Complete solution for self-hosting web apps"
description = "Cloudron is a complete solution for running apps on your server and keeping them up-to-date and secure."
full_description = "Self-hosting apps is time consuming and error-prone. Keeping your system up-to-date and secure is a full-time job. Cloudron lets you focus on using the apps and not worry about system administration. We publish latest releases within days and security fixes within 24h for apps and the server via the Cloudron App Store. This makes maintenance of your private cloud hassle-free and cost effective. Invite users and configure to which apps they have access to. Users can use the dashboard to find and directly open their apps. All in one place. Cloudron's immutable infrastructure design allows easy migration of apps across servers. In fact, you can move your entire server along with all its apps to another cloud provider in no time. Modern solution with calendar, contacts sharing and self-training spam filter. Completely automated DKIM, SPF, DMARC setup for reliable mail delivery. Cloudron has a built-in firewall and all events can be audited. Store encrypted backups to external storage like Amazon S3, Google Cloud Storage, Digital Ocean Spaces. Easily deploy production ready apps from the Cloudron App Store. No more tinkering with Dockerfiles and manually provisioning databases. We publish latest releases and security fixes for apps and the server via the Cloudron App Store. This brings the convenience of SaaS style hassle-free updates to your private cloud. Catch-All addresses, Subaddresses and tags, Per-domain mail relays, Cross domain email aliases, Delivery Logs, Custom Spam Filtering Rules. It's feature packed and you are sure to love this one. Having an up-to-date system through timely updates is core to our product. We put great effort into our app packages to deliver reliable, tested and reproducible updates. Especially for security patches so our user can have peace of mind."
