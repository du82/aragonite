["https://cloudron.io/pricing.html"]
title = "Cloudron Pricing"
description = "Take full control of your data"
full_description = "For the Pro plan, we provide our software with no restrictions and limits. You can use our forum for help. Along with our active community, the Cloudron Team will assist you with any questions and issues at the earliest. For Service Providers, an additional support agreement can be purchased. For the business plan, we will respond to your support queries within the next business day. If required, we can SSH into your server to fix any issues. Remote access has to be explicitly enabled on your server for us to get access. Our support for apps is limited to app packaging (deployment) issues. For app specific issues, we recommend getting support from the app developers themselves. Each app has a separate section in our forum. When in doubt, feel free to ask us there. We are not in the business of reselling apps. We make it simpler to manage selfhosted apps and as such our pricing model is to charge for that solution. Cloudron is entirely self-hosted and we do not have access to your server. Like how smartphones work, app and platform updates are pulled not pushed."
