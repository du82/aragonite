title = "Cloudron for Business"
description = "Complete solution for running apps on your own server"
full_description = "Vertically scale your server and Cloudron will automatically adjust. Put resource limits on apps, to ensure mission critical ones never go down. Automatic security updates together with full isolation between app instances ensures peace of mind. Cloudron even allows to enforce two-factor authentication. Single place to manage your employees and collaborators. This decreases time and mistakes during on- and offboarding of members. Zero friction integration of users into new apps, by attaching your Cloudron to an already existing LDAP or ActiveDirectory. Gone are the days where new members have to sign up at each individual service separately. For a complete online presence for your organization, including vistor insights, Cloudron has everything covered. Cloudron brings a full email solution, including account management, mailing lists, spam filtering and webmail clients. Having your own email server has never been easier. Stay in touch with your customers through chat rooms, website integrated live-chat or community forums. Sharing and syncing files is an essential task. On top of that, Cloudron offers rich collaborative office solutions. You can see an office suite comparison in our blog to pick the right choice for your organization. Send out and manage invoices. Never lose track of the work hours as a freelancer or from your employees"
