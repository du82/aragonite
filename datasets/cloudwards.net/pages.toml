full_description = "User Rating Don Fowler says: 2020/01/04 at 09:21 I first starting using 1Password years ago (not sure how many) my version is free. It has been an excellent app. While up dating a new computer it would not transfer over so now I am forced to purchase it which after looking at the current version, price and reviews I will look at other options, but I do like the app I have now. Reply User Rating Joel Nutt says: 2020/02/22 at 09:59 I recently read the same complaint I have. I have 2 accounts even though I am the only person on the account. I thought I was updating and instead ended up with 2 accounts. This problem has never been resolved. Reply User Rating Ted says: 2020/04/10 at 07:05 I got the software for about 45$ as a lifetime deal and now stop working with chrome. Now I am suppose to pay monthly because they got greedy. I have 5 years of passwords saved on it. I would stay away from a company that sells you something and then does not honor it. Also you can not talk to a real person. Reply User Rating David says: 2020/05/08 at 11:51 The most miserable user experience ever. It saves passwords without USER ID’s and then you have to go back in, search for the sire and only then can you add the user ID. It also saves multiple versions of the same login with different passwords. Of all the apps my company uses, this is the one I use to show people How NOT to design a user experience. Reply User Rating Mark says: 2021/08/23 at 19:23 They need MUCH BETTER support. It took days for them to get back to me. Other than the SLOW support they have, 1PASSWORD is an easy to use SECURE password manager. I like the steps they take to secure your account, such as the secret key that is needed when changing devices or first logging into 1password. As well as several 2 FA options. The travel mode is a nice feature. Their Forum is nice to have for additional help. But it often takes a long time for them to respond. They need to have phone support, priority support, or some other way to get a hold of them, the response time needs to be much improved. Once they responded to my service request, they DID everything possible to help me. I hope they will offer better support options that will give you assistance within 2 hours of reaching out to them. Phone support, live chat or priority email support would be great. Reply"
