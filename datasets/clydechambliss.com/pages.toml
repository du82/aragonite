full_description = "Home ❭ News ❭ Rebuild Alabama projects keep coming: Hwy 82 in Prattville and Hwy 411 in Cherokee County Rebuild Alabama projects keep coming: Hwy 82 in Prattville and Hwy 411 in Cherokee County By Sean Ross Yellowhammer News Governor Kay Ivey on Tuesday outlined that the Alabama Department of Transportation has selected major transportation projects in Autauga and Cherokee counties as part of the Rebuild Alabama First Year Plan 2020. “Drivers across Alabama have experienced the troubles of the state’s crumbling infrastructure for far too long. In selecting these projects in Autauga and Cherokee counties, we’re showing that stagnation is no longer the case in Alabama,” Ivey said in a statement. “For the ease of our drivers, for the safety of our drivers and for the future of our state, it’s finally time we Rebuild Alabama! This comes after announcements of significant projects for the Huntsville area and Tuscaloosa in recent days. In a cluster of Rebuild Alabama First Year Plan projects, ALDOT will widen U.S. Highway 82 in Prattville, a project that this area has long been awaiting for over 60 years. These enhancements to US 82 will shorten the daily commute of over 17,000 drivers and also complete the Prattville Bypass, according to the governor’s office. Additionally, the widening of US 82 will improve access for loggers traveling to the International Paper plant from 18 Alabama counties. Six hundred workers from 23 Alabama counties will reportedly find increased ease in their work commutes, as this project improves access to the James Hardie Building Projects Facility and the other companies in the area. State Sen. Clyde Chambliss (R-Prattville), who carried the Rebuild Alabama Act in the Senate, lauded the announcement as a huge win for jobs and the community. He also emphasized that these types of projects will ultimately be transformational for the Yellowhammer State. “These are the first steps of many that will begin the process of Rebuild Alabama. Industry is a backbone of our economic engine, and I am pleased that Governor Ivey is moving Alabama forward with these improvements,” Chambliss remarked. “I firmly believe that we will look back on 2019 as a turning point in the history of our state.” State Rep. Will Dismukes (R-Prattville), who represents this project’s district in the House, voted against the Rebuild Alabama Act. A freshman legislator, he is currently considering a run for the U.S. Senate, as reported by Yellowhammer Podcast Network’s “The Insider.”"
