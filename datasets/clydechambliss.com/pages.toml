full_description = 'News window.dojoRequire(["mojo/signup-forms/Loader"], function(L) { L.start({"baseUrl":"mc.us16.list-manage.com","uuid":"808b1f4fc72e5de6c70eecb7a","lid":"99fde391a6","uniqueMethods":true}) }) Wednesday, July 31, 2019 12:00 AM Chambliss Makes Decision Regarding Second Congressional District As has been reported, I have spent the last several days carefully considering a run for the Second Congressional District of Alabama. I am blessed with a supportive family that understands both the privilege and the cost of public service and they pledged all of their efforts to the task. Supporters, colleagues, and other stakeholders were equally encouraging. I am grateful to those who took my calls and made time for me during the weekend and evenings. A clear path to victory was developed over the weekend, but the thought that kept returning to me is that my calling at this time is to continue working to solve the problems that we face in Alabama. I believe that the best place for me to do that is in the Alabama State Senate. Although I have been fortunate to be a part of significant progress in the State Legislature, I would be leaving several critical issues mid-stream. Therefore, I will not be a candidate for Congress. Thank you to those that have contacted me. I very much appreciate the encouragement, prayer and support as we have considered this possibility. It is an honor and privilege to serve you in the Alabama Senate. My focus will remain in Alabama and working hard to make this great state all that she can be! Thank you for allowing me to represent you in Montgomery! Friday, July 26, 2019 1:04 PM County approves $1 million in gas tax proceeds for projects Thursday, July 18, 2019 12:00 AM Governor Ivey Establishes Study Group on Criminal Justice Policy Governor Kay Ivey on Thursday announced that by executive order, she has established the Governor’s Study Group on Criminal Justice Policy. The primary purpose of this group is to receive and analyze accurate data, as well as evidence of best practices, ultimately helping to further address the challenges facing Alabama’s prison system. Tuesday, June 25, 2019 12:00 AM New Alabama law bans parental rights for those convicted of rape, incest A newly signed law bans parental rights of convicted rapists and incest abusers. Tuesday, June 11, 2019 12:00 AM Governor signs anti-voyeurism bill Gov. Kay Ivey has signed an anti-voyeurism bill. Thursday, May 16, 2019 12:00 AM Fact Check: 9 Things to Know About Alabama Abortion Law On Wednesday, Alabama Gov. Kay Ivey signed what many consider the nation’s strictest abortion law, which makes any physician performing an abortion guilty of a felony in almost all cases. Thursday, May 16, 2019 12:00 AM The abortion pendulum is moving By passing the nation’s most restrictive abortion law, pro-life advocates are setting the stage to provoke a legal fight they hope will culminate with the Supreme Court revisiting Roe v. Wade. Tuesday, April 23, 2019 12:00 AM Rebuild Alabama projects keep coming: Hwy 82 in Prattville and Hwy 411 in Cherokee County Governor Kay Ivey on Tuesday outlined that the Alabama Department of Transportation has selected major transportation projects in Autauga and Cherokee counties as part of the Rebuild Alabama First Year Plan 2020. Saturday, January 5, 2019 12:00 AM Alabama Senate GOP Caucus names Chambliss floor leader On Thursday, Alabama Senate Majority Leader Greg Reed (R-Jasper) announced that state Senator Clyde Chambliss (R-Prattville) has been named majority floor leader for the Republican caucus. Wednesday, June 20, 2018 12:00 AM Community college to open in Prattville Central Alabama Community College plans to open a facility this fall on the second floor of the Pratt’s Mill strip center, with a focus on workforce development and training for some of the area’s most in-demand jobs. That includes manufacturing and health care education, as well as noncredit training programs for some of the most sought-after skills, like truck driving. Tuesday, March 27, 2018 12:00 AM Juvenile sex offender notification bill passes A bill changing the way schools deal with juvenile sex offenders in the classroom is headed to the governor’s desk. Wednesday, February 14, 2018 8:00 AM State employees may see 3 percent pay raise State employees would see their first cost of living increase in nearly a decade under a General Fund budget approved Wednesday by a Senate committee. Wednesday, September 20, 2017 10:10 AM Senator Clyde Chambliss receives Legislative Conservationist of the Year Award Senator Chambliss was recognized as the Legislative Conservationist of the Year Award at the 2017 Alabama Wildlife Federation Governor’s Conservation Achievement Awards banquet. Thursday, September 7, 2017 10:11 AM Win-Win for Farmers and Students Senator Chambliss works to make it easier for Alabama schools to purchase foods from Alabama Farmers.'
