["https://clydechambliss.com/news/senator-clyde-chambliss-receives-legislative-conservationist-of-the-year-award"]
title = "Senator Clyde Chambliss receives Legislative Conservationist of the Year Award"
description = "Senator Clyde Chambliss of Prattville was recently awarded the Legislative Conservationist of the Year Award at the 2017 Alabama Wildlife Federation..."
full_description = "Home ❭ News ❭ Senator Clyde Chambliss receives Legislative Conservationist of the Year Award Senator Clyde Chambliss receives Legislative Conservationist of the Year Award Senator Clyde Chambliss of Prattville was recently awarded the Legislative Conservationist of the Year Award at the 2017 Alabama Wildlife Federation Governor’s Conservation Achievement Awards banquet. The Alabama Wildlife Federation (AWF) held the banquet, co-sponsored by Alabama Power Company and PowerSouth Energy on Friday, August 4, 2017 at The Marriott Legends at Capitol Hill in Prattville. Governor Kay Ivey provided opening remarks and assisted with presentation of the awards. The AWF Governor’s Conservation Achievement Awards (GCAA) are the most respected conservation honors in the state of Alabama. Over the past 40 years, AWF has presented these awards to individuals and organizations that make great contributions to the conservation of Alabama’s wildlife and related natural resources. Senator Chambliss represents District 30; Autauga, Chilton, Coosa, Elmore, and Tallapoosa counties. Senator Chambliss is an outdoorsman and conservationists, and serves on the Senate Agriculture and Forestry Committee. Since his election in 2014, he has become known in the Senate for his thorough review and study of issues, open lines of communication, and practical approach. Senator Chambliss evaluates and takes action each year on dozens of conservation, forest and wildlife management, hunting, angling, and outdoor related legislation. AWF’s mission is to promote the wise-use and responsible stewardship of our wildlife, forests, fish, water, and soils by striking the balance between use, management, and protection of those resources. That same fundamental approach is shared by Senator Chambliss and is evident through his open lines of communication, willingness to receive and study information about the positive and negative aspects associated with individual legislation, and his thoughtful evaluation and action as a result. Most importantly, Senator Chambliss understands that we all have a role in perpetuating the natural resources and outdoor pursuits we are blessed with in Alabama, and is willing to make and foster decisions in their best, long-term interest. Additional sponsors included Ralph and Catherine Martin, Stifel, Lee Thuston, Central Alabama Electric Cooperative, Talladega Superspeedway, Josh & Mary Virginia Mandell, First South Farm Credit, CDG Engineers & Associates, Manufacture Alabama, Lake Martin Resource Association, Russell Lands, Consolidated Construction Co., Canfor Southern Pine, and David & Kelly Thomas. The Westervelt Company and Hammer Construction sponsored the social event prior to the banquet. Alabama Gulf Seafood was sponsored by the Alabama Seafood Marketing Commission. The GCAA was created to promote leadership by example and in turn increase conservation of the natural resources in the state of Alabama including its wildlife, forests, soils, water and air. The program is designed to bring about a greater knowledge and awareness of conservation practices and projects and to give proper recognition to those persons and organizations that make outstanding contributions to the natural resource welfare of their community and state. The Alabama Wildlife Federation, established by sportsmen in 1935, is the state’s oldest and largest citizens’ conservation organization. The mission of the Alabama Wildlife Federation, a 501(c) 3 non-profit group supported by membership dues and donations, is to promote conservation and wise use of Alabama’s wildlife and related natural resources as a basis for economic and social prosperity. To learn more about AWF, including membership details, programs and projects, contact Alabama Wildlife Federation at 1-800-822-WILD or visit www.alabamawildlife.org."
