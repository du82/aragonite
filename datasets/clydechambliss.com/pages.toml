["https://clydechambliss.com/in-clydes-own-words"]
title = "In Clyde's Own Words"
full_description = '''A Remarkable and Busy Session The 2019 Regular Session of the Alabama Legislature was incredibly busy and productive. Over 500 bills were signed by Governor Ivey to hopefully improve the lives of Alabamians for years to come. Senator Jabo Waggoner, who has served in the Alabama Legislature since 1966, summed up the 2019 Session accurately when he said, “This [was] one of the toughest sessions ever … it has been a gut check this year, it really has, as far as tough impactful votes. [But] as far as high profile issues, this session probably ranks No. 1 in my career.” The Alabama Legislature fulfilled its primary constitutional duty in passing two of the largest Education Trust Fund and General Fund budgets in state history, largely due to a booming economy and the state’s growth in business. The FY20 Education budget will provide: - a 4% pay raise for educational employees - an additional $26.8 million funding increase to Alabama’s excelling Pre-K programs - $20 million for rural broadband expansion - $15 million for transportation programs - $2 million in funding to the Alabama Reading Initiative The FY20 General Fund budget will provide: - funds to hire 50 additional state troopers - pay raises for correctional officers - resources to hire additional correctional officers - a 2% pay raise for state employees - a $9 million funding increase for the Department of Mental Health Other bills that were passed include: a pro-life bill to protect the unborn, the Rebuild Alabama Plan, a bill strengthening the Permanent Joint Transportation Committee, a bill terminating parental rights of parents convicted of rape or incest, a notification expansion for convicts escancing from halfway homes, the left-lane driving bill, a Constitutional Amendment for an appointed State Board of Education, the creation of religious study elective courses in schools, a bill requiring schools to recite the Pledge of Allegiance, a bill allowing public schools to donate surplus food to needy students, an increase in food allowance for prisoners, revisions to the Pardons and Paroles Board, the Alabama Incentives Modernization Act to provide tax incentives for businesses in rural communities, and a bill to allow the registration of apprenticeship programs through the new Alabama Office of Apprenticeships. Proposals that did not pass include: a state lottery, permitless carry, marijuana decriminalization, payday loan extensions, mandatory kindergarten, hands-free driving, a Tier III benefit retirement plan and advertising spaces on school buses. With a strong governor and diligent efforts taken by the Legislature, over 500 bills out of the 1070 bills that were introduced passed. The intensity of the 2019 session could not have been possible without your input, feedback, and your prayers. I am humbled and encouraged by your support. I sincerely want to thank you all for your efforts and investment in your state’s government. Moving forward to 2020, I would like to affirm that my office is always open and I am eager to hear from you if you have any questions about this year or have any needs you would like addressed as a constituent. You can do so by emailing me at clyde@clydechambliss.com. Thank you for allowing me to represent you in Montgomery! The Need for Amendment 2 on the 2018 Ballot Amendment Two will make it crystal clear that the Alabama state constitution does not contain a right to an abortion, even as Roe v. Wade remains on the books at the federal level. In 2000, the Tennessee Supreme Court struck down pro-life measures the Tennessee Legislature had passed. Tennessee’s Supreme Court held that their state constitution provided even greater protections for abortion than Roe granted. The passage of Amendment Two will help Alabama avoid Tennessee’s fate, and prevent liberal activist judges from using state law to further the pro-abortion goals of Planned Parenthood. How Amendment Two Will Appear on the November 6th Ballot: "Proposing an amendment to the Constitution of Alabama of 1901, as amended; to declare and otherwise affirm that it is the public policy of this state to recognize and support the sanctity of unborn life and the rights of unborn children, most importantly the right to life in all manners and measures appropriate and lawful; and to provide that the constitution of this state does not protect the right to abortion or require the funding of abortion.” What Amendment Two Does: Amendment Two will promote a culture of life in Alabama, by making it clear that the Alabama state constitution does not provide the right for an abortion. Amendment Two provides the State Legislature with overwhelming justification for pursuing common-sense, pro-life measures, like bills to ban partial-birth abortion and the sale of fetal body parts. When radical leftist groups like Planned Parenthood sue the Legislature for passing pro-life legislation, the State Attorney General’s Office can use the passage of Amendment Two to show in court that the people of Alabama strongly stand in favor for protecting the sanctity of life. Amendment Two does not —and cannot— overturn Roe v. Wade. That is a task that can only be accomplished by the Supreme Court or an amendment to the U.S. Constitution. The Battle to Protect Life: Planned Parenthood, the same radical leftist group that was investigated by the Department of Justice in 2017 for allegedly selling fetal body parts, has already started a shadowy political PAC to defeat Amendment Two — and the lies are piling up faster than you can count. We must protect the sanctity of life — there is no more important issue. In Psalms 139, David wrote: “For you formed my inward parts; you knitted me together in my mother's womb. I praise you, for I am fearfully and wonderfully made.” Amendment Two protects the sanctity of all life in Alabama, by ensuring that our God-given rights extend to our most defenseless citizens, unborn children. With Neil Gorsuch and now Brett Kavanaugh sitting on the highest court, Amendment Two will ensure Alabama stands ready to undo the decades of damage caused by Roe v. Wade, if that precedent is overturned. A Recap of the 2018 Session The Republican legislative majority has dramatically cut the size of state government: Conservative Republicans have worked hard to right-size government agencies, cut bloated departments, and privatize some functions of state government. The number of state employees has gone down from 39,862 on January 1, 2011 (the year the Republican majority came to office) to 33, 978 in July 2018. That’s a cut of 15% in the state government workforce. The Republican-led Legislature, working with Republican governors over the past 7 years, has cut more than $1 billion in annual state government spending. Summary of the 2018 Legislative Session: Conservatives in the state Legislature have delivered on their promises to Alabama taxpayers: we have cut taxes, slashed regulations on businesses, and the economy is thriving. The state unemployment rate this June was 4.1%, down from 7.0% in June of 2013, and Alabama currently has the highest number of people working (2.09 million) ever recorded in our state history, according to the Department of Labor. More work remains until every Alabamian who wants a job has one, but businesses and workers are flourishing as Republicans in Alabama work with President Trump to put American jobs first. A center-piece of the Senate Republican “Fighting for Alabama” agenda, the Legislature this session passed a tax cut for lower and middle-income earners by increasing the income threshold for Alabamians who can claim the maximum exemption from state income taxes. Alabama’s working families will collectively save $40 million over the next ten years due to the Legislature’s tax cut. Coupled with President Trump’s tax break, Alabama families are finally getting real tax relief. (Alabama families will save an average of $21 annually from the state tax cut). Senate Republicans are committed to ensuring that every student in every county in Alabama has access to a top-notch education. That’s why we passed a $6.6 billion education budget for the coming year, the largest education budget since the great recession of 2008. Quality teachers are essential to great education system: that’s why we set aside money for a 2.5% pay raise for teachers and education support personnel, at a cost of $102 million to taxpayers. This is in addition to a 4% pay raise in 2016 for teachers. The budget includes a $18.5 million increase for First Class, Alabama’s nationally-recognized, volunteer pre-kindergarten program. A UAB study showed that students who participated in First Class outperformed their peers in reading and math assessments. First Class, currently available in 941 classrooms, has been named the best pre-kindergarten program in the nation for eleven years in a row by the National Institute for Early Education Research. The $18.5 million increase will help fund 107 new pre-k classrooms. Every year, more of our lives rely on internet-based technology; it is imperative that America produce the smartest, most innovative cyber engineers in the world, and there is no reason a large number of them shouldn’t come from Alabama. That’s why the Legislature moved to establish the Alabama School for Cyber Technology and Engineering, which will operate as a public magnet school for students in grades 7-12. Any student from Alabama can apply for admittance. The school’s first class will begin in August 2020, and the school, based in Huntsville, will eventually have an enrollment of approximately 300 students. The Legislature approved a balanced General Fund budget ($2 billion) that includes no new taxes. Public safety is a priority: that’s why I supported a $3 million increase for ALEA to put 30 additional state troopers on the road. The budget gives a 3% cost-of-living raise to state employees, the first COLA they have had in 10 years. The Department of Corrections was given a $55 million increase to hire additional mental and medical health staffers (in response to lawsuits filed by the SPLC against the state, a liberal federal judge named Myron Thompson issued a court order forcing Corrections to hire additional mental health workers). Mental Health’s budget was increased by $8 million to help address the opioid crisis. A strong housing market is a key indicator of a thriving economy. That’s why the Legislature approved the First-Time Homebuyer and Second-Chance Savings Account to help new homeowners. The Act establishes a tax-free savings account for first-time home buyers and for those re-entering the housing market, if they have not owned a home in ten years. Money from the account can be used for a down payment and/or closing costs for a single-family dwelling. Deposits and earnings in the account cannot exceed $50,000 and qualified expenditures must be made within five years of opening the account. SB179 establishes severe penalties for those found guilty of obstructing an investigation into human trafficking, which includes child sex trafficking, increasing the maximum offense to a Class A felony, with a minimum jail sentence of ten years. Previously, the obstruction of an investigation into human trafficking was only a Class C felony – meaning conviction could result in merely one year in prison. According to the Alabama Human Trafficking Task Force, the average age of sex trafficking victims is between 11-14 years old. It is estimated that two children are trafficked into sexual exploitation every minute. Expanding access to broadband internet in rural Alabama is key to ensuring that all of our state shares in the recent economic growth. 800,000 people in Alabama are without access to a wired connection capable of 25mbps download speeds, and 276,000 people in Alabama don’t have any wired internet providers available at all. SB149 establishes the Broadband Accessibility Fund to award grants to telecommunications and cable companies that build broadband infrastructure in under-served areas. The Alabama Department of Economic and Community Affairs will oversee the fund. Alabama will further be helped by grants and loans from the federal government: this year, Congress, through an effort led by Representative Robert Aderholt, established a $600 million Broadband Pilot Program, which will enable applicants to finance a project by combining loans and grants to provide broadband to eligible rural counties. The Legislature approved the Child Care Safety Act to increase safety reporting requirements for child daycare centers, while protecting faith-based daycare centers from being licensed by the state Department of Human Resources (DHR). In August of 2017, five year-old Kamden Johnson died after being trapped in a van that belonged to the Community Nursery & Preschool Academy in Mobile. An employee of the preschool, which is run by Community Church Ministries and exempt from DHR licensure, has been charged with manslaughter. In response to tragedies like these, Democrats pushed a measure in the 2017 session that would have required all daycare centers to be licensed, which would have meant church-based daycare centers would have to get a permission slip from DHR to operate. The Child Care Safety Act passed this session strikes a careful balance between religious liberty and safety for children: conservatives preserved the licensure exemption for faith-based daycare centers, while all daycare centers, including faith-based ones, must carry liability insurance, conduct annual fire and health inspections, and do criminal background checks on employees. Further, all daycare centers that receive federal or state funds must be licensed by DHR. (Faith-based daycare centers that don’t receive government funds can still operate without having a DHR license.) The Battle to Protect the Sanctity of Life ●Since the voters of Alabama elected conservatives to a majority in 2010, Republicans in the State Legislature have made protecting the sanctity of life a priority. ●This is in marked contrast to a state and national Democratic Party that is joined at the hip to radical pro-choice groups like Planned Parenthood. The Democratic Party has strongly opposed efforts by President Trump and Senator Mitch McConnell to defund Planned Parenthood, a group that has spent over $50 million on lobbying and campaigns since 2012. Despite Headwinds, a Successful Legislative Session The possible impeachment and eventual resignation of a governor has the tendency to create a gale wind that can quickly transform into a hurricane. Such a tempest was the setting for the 2017 session of the Alabama Legislature. The outcome – resignation, and now, a fresh start at the Capitol under Governor Kay Ivey – has been extensively covered in the media. Understandably, less ink has been spilled on the significant policy achievements of the legislative session, but Alabamians have a right to feel proud of the work '''
