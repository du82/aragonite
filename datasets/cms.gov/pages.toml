ect Enrollment (PDF) June 20, 2018 FAQs Regarding Spanish Translation and Audit Requirements for Enhanced Direct Enrollment (EDE) Entities Serving Consumers in States with FFEs (PDF)Web-broker-only GuidanceJanuary 10, 2024Web-broker Operational Readiness Reviews for the Classic Direct Enrollment and Enhanced Direct Enrollment Pathways and Related Oversight Requirements (PDF) August 18, 2021Guidance Regarding Website Display for Web-brokers Assisting Consumers (PDF) June 10, 2020Key Priorities for Federally-Facilitated Exchange (FFE) and State-based Exchange on the Federal Platform (SBE-FP) Direct Enrollment (DE) Compliance Reviews for Plan Year 2020 (PDF)May 21, 2020Updated Web-broker Direct Enrollment Program Participation Minimum Requirements (Updated) (PDF)December 10, 2019Guidance on Updated Direct Enrollment (DE) Web-broker Program Participation Requirements (PDF)August 9, 2019Key Priorities for Federally-Facilitated Exchange (FFE) Web-broker Direct Enrollment (DE) Compliance Reviews for Plan Year 20"
