["https://cms.gov/marketplace/employers-sponsors/small-business-health-options-program-shop"]
title = "Small Business Health Options Program (SHOP) | CMS"
description = "The Small Business Health Options Program (SHOP) helps businesses provide health coverage to their employees."
full_description = "Small Business Health Options Program (SHOP) Small Business Health Options Program (SHOP) The Small Business Health Options Program (SHOP) helps businesses provide health coverage to their employees.SHOP insurance is generally available to employers with 1-50 full-time equivalent employees (FTEs). If you have fewer than 25 employees, you may qualify for the Small Business Health Care Tax Credit, if you buy SHOP insurance. Learn more about SHOP eligibility rules and the Small Business Health Care Tax Credit.If you're a sole proprietor or self-employed with no employees, you may be able to get individual coverage through the Health Insurance Marketplace for individuals and families. Enrolling in SHOP insuranceEmployers have two options for enrolling in SHOP insurance:Through an insurance companyWith the assistance of a SHOP-registered agent or brokerTo learn more about SHOP visit HealthCare.gov.Benefits of SHOP InsuranceYou control the coverage you offer and how much you pay toward employee premiums.You can choose from high-quality private health insurance plans that meet the needs of your business and employees.You can choose to offer health only, dental only, or both health and dental coverage. If offering dependent coverage and an employee enrolls, the employee’s dependents can enroll in health only, dental only, or both health and dental coverage.You can start coverage any time of the year.If you have fewer than 25 employees, you may qualify for a Small Business Health Care Tax Credit worth up to 50% of your premium costs (up to 35% for tax exempt/non-profit employers). You can still deduct from your taxes the rest of your premium costs not covered by the tax credit. The tax credit is generally available only when an employer enrolls in a SHOP plan. Use the Small Business Health Care Tax Credit Estimator to find out if you may qualify and how much you may save. How to know if you qualify for SHOP SHOP insurance is available to employers with 1-50 full-time equivalent (FTE) employees in most states (in some states, employers with 1-100 employees qualify). Use our FTE Employee Calculator to find out if you qualify to use SHOP.You must offer SHOP coverage to all of your full-time or FTE employees – generally those working 30 or more hours per week on average.In many states, at least 70% of employees offered coverage must accept the offer, or be covered by another form of coverage, for the employer to participate. (Employers who apply for or renew SHOP coverage between November 15 and December 15 each year can enroll without meeting this requirement.) For help calculating the SHOP minimum participation rate (MPR) in your state, visit the MPR Calculator.You must have an office or employee work site within the state whose SHOP you want to use.Get more details on SHOP eligibility rules.Preview plans and prices nowBrowse health and dental plan information right now. See the available plans and sample prices based on the number and ages of employees and their dependents.SHOP Tools and ResourcesEmployer Guide to SHOP InsuranceEnglish (PDF)Spanish (PDF)Full-time Equivalent (FTE) Employee CalculatorSmall Business Health Care Tax Credit EstimatorMinimum Participation Rate (MPR) CalculatorSee Plans and PricesSHOP Eligibility Determination FormSHOP regulations and guidance: Name of DocumentDate FinalizedPatient Protection and Affordable Care Act; Establishment of Exchanges and Qualified Health Plans; Exchange Standards for Employers; Final Rule and Interim Final Rule March 27, 2012Patient Protection and Affordable Care Act; Health Insurance Market Rules; Rate Review; Final Rule February 27, 2013Patient Protection and Affordable Care Act; Establishment of the Multi-State Plan Program for the Affordable Insurance Exchanges; Final Rule March 11, 2013Payment Parameters for 2014 and Amendments to the HHS Notice of Benefit and Payment Parameters for 2014; Final Rules; Patient Protection March 11, 20132014 Letter to Issuers on