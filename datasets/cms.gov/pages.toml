description = "Get resources to promote the value of having health insurance and help consumers enroll in the Marketplace or apply for Medicaid/Children’s Health Insurance Program (CHIP)."
full_description = "Enrollment resources Pages in this section Assister outreach & education Partner tools & toolkits New to the Marketplace Already enrolled Materials in multiple languages Images & multimedia Enrollment resources Get resources to promote the value of having health insurance and help consumers enroll in the Marketplace or apply for Medicaid/Children’s Health Insurance Program (CHIP).Partner with usPartner tools & toolkits—Use these publications and customizable templates to engage, inform, and enroll Marketplace consumers.Images & multimedia—Get images and multimedia for outreach activities.Products to help consumersOrder free copies of educational materials, like tip sheets and paper applications. Log into your account (or request an account if your organization doesn't have one already) to order the products you need. If you request an account, we'll review your request within 3 business days.Order productsNew to the Marketplace—Get materials to help people who are thinking about getting coverage through the Marketplace. Already enrolled—Use these resources to help people who have Marketplace coverage.Materials in multiple languages—Explore Marketplace materials available to people who speak languages other than English, including Arabic, Chinese, French, Russian, Vietnamese, and more.Materials for special populations—Get resources to help people included in special groups, such as American Indians, immigrants, Medicare beneficiaries, and young adults.Products to help assistersPlan compare & plan selection help— Use these resources to understand benefits and coverage available through Marketplace plans, and how to help consumers compare and choose a plan.Medicare, Medicaid, & CHIP—Learn how Medicare works and how to help consumers transition from Marketplace to a Medicare plan. Find out how to help low-income adults enroll in Medicaid and/or get coverage for their children through CHIP.Select, cancel, or terminate plan—Use these materials to learn how to help consumers select, cancel, or terminate Marketplace coverage. Page Last Modified: 10/23/2024 09:36 AM Help with File Formats and Plug-Ins"
