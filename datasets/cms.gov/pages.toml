["https://cms.gov/about-cms/web-policies-important-links/web-policies/privacy"]
title = "Privacy Policy | CMS"
description = "Types of information we collectHow CMS uses information collected on CMS.govHow CMS uses cookies & other technologies on CMS.govYour choices about tracking & data collection on CMS.govHow CMS uses third-party websites & applications with CMS.gov"
full_description = '''Types of information we collectHow CMS uses information collected on CMS.govHow CMS uses cookies & other technologies on CMS.govYour choices about tracking & data collection on CMS.govHow CMS uses third-party websites & applications with CMS.govHow CMS protects your personal informationHow long CMS keeps data & how it’s accessedChildren & privacy on CMS.govLinks to other sitesAdditional privacy informationCMS.gov Privacy PolicyProtecting your privacy is very important to us. This privacy policy describes what information we collect, why we collect it, and what we do with it. This privacy notice covers CMS.gov and applicable subdomains. These websites are referred to as “CMS.gov” throughout the rest of this notice and are maintained and operated by the Centers for Medicare & Medicaid Services (CMS). The privacy notice for other CMS websites not listed above is available at https://www.cms.gov/About-CMS/Agency-Information/Aboutwebsite/Privacy-Policy.html.CMS.gov doesn’t collect name, contact information, or other similar information through these websites unless you choose to provide it. We do collect other, limited, non-personally identifiable information automatically from visitors who read, browse, and/or download information from our website. We do this so we can understand how the website is being used and how we can make it more helpful. For more information, see Types of information we collect.Personally identifiable information (PII), defined by the Office of Management and Budget (OMB), refers to information that can be used to distinguish or trace an individual's identity, like their name, Medicare Number, biometric records, etc. alone, or when combined with other personal or identifying information which is linked or linkable to a specific individual, like date and place of birth, mother’s maiden name, etc. Medicare Fee-for-Service eligibility and enrollment information and claims data are considered protected health information (PHI) under the Health Insurance Portability and Accountability Act (1996) (HIPAA) regulations.We don’t sell any information you provide when you visit CMS.gov. For information on how we share information, see How CMS uses information collected on CMS.gov. Types of information we collectInformation which is automatically collected:When you browse:Certain information about your visit can be collected when you browse websites. When you browse CMS.gov, we, and in some cases, our third-party service providers, can collect the following types of information about your visit, including:Domain from which you accessed the internet (like Verizon.com if you’re using a Verizon account).IP address (an IP or internet protocol address is a number that’s automatically assigned to a device connected to the internet).Approximate geographic location based on the IP address of the user’s local system.Operating system for the device that you’re using and information about the browser you used when visiting the site. The operating system is software that directs a computer’s basic functions, like executing programs and managing storage.Date and time of your visit.Pages you visited.Address of the website that connected you to CMS.gov (like Google.com or Bing.com).Device type (like desktop computer, tablet, or type of mobile device).Screen resolution.Browser language.Geographic location.Time spent on page.Scroll depth (measures how much of a web page was viewed).Your actions on CMS.gov (like clicking a button).For more information, see How CMS uses third-party websites & applications with CMS.gov.We use this information to:Measure the number of visitors to CMS.gov.Help make our website more useful for visitors.Improve our public education and outreach through digital advertising.Also, this information is sometimes used to personalize the content we show you on third-party sites. For more information on our practices, see How CMS uses third-party websites & applications with CMS.gov. Information you may provide:When you request information:We collect information, including your email address, to deliver alerts or eNewsletters. We use this information to complete the subscription process and provide you with information. You can opt out of these communications at any time by editing your subscription preferences.When you submit forms:We collect PII including your name, email address, phone number, or other unique identifiers when you submit an electronic form, like a complaint about unexpected or "surprise" medical bills or comments about published content. We use the PII you provide only to fulfill the form’s stated purpose. We’ll keep the PII only as long as needed to respond to your complaint or question.How CMS uses information collected on CMS.govSending you CMS messages:We use the email address you provide us to send emails related to CMS.Conducting surveys to improve services:We use online surveys to collect opinions and feedback. You don’t have to answer these questions. If you do answer these questions, don’t include any PII/PHI in your answers. We analyze and use the information from these surveys to improve the CMS.gov website. The information is available only to CMS managers, members of the CMS communications and web teams, and other designated federal staff and contractors who require this information to perform their duties.Using third-party tools for website analyticsWe use a variety of third-party web tools for web analytics. We don’t collect any PII/PHI with these tools. We use these tools to collect basic information about visits to CMS.gov. This information is then used to maintain the website, including:Monitoring website stabilityMeasuring website trafficOptimizing website contentHelping make the website more useful to visitorsCMS staff analyzes the data collected from these tools. Reports are available only to CMS managers, teams who implement programs represented on CMS.gov, members of the CMS communications and web teams, and other designated federal staff and contractors who need this information to perform their jobs. Using third-party tools for outreach and education through digital advertising:We use third-party web services to conduct outreach and education through the use of digital advertising for CMS.gov. These third-party services may collect information through the use of web beacons (also called pixels) that are located on our pages. A web beacon is a see-through graphic image (usually 1 pixel x 1 pixel) that's placed on a web page and, in combination with a cookie, allows us to collect information regarding the use of the web page that contains the web beacon.We use web beacons to tell when a user is redirected to CMS.gov by clicking or otherwise interacting with a CMS advertisement that we ran on another website. This is known as “click tracking” or “conversion tracking,” and we use it to better target CMS advertisements (known as “retargeting”) to inform consumers about the services available through CMS.gov. For more information on how these tools work, see How CMS uses third-party websites & applications with CMS.gov.We also use third-party tools to help deliver advertising. Vendors that operate the third-party tools may also gather information about your visits to third-party sites outside of CMS.gov. While we don't track your internet activity outside of CMS.gov, our vendors may use information collected automatically by visiting CMS.gov, and combine it with data they collect elsewhere for targeted advertising purposes. You can opt out of this type of data collection via Privacy Settings, your web browser, Ad Choices, and Do Not Track. For methods to opt out of this type of collection, see Your choices about tracking & data collection on CMS.gov.The outreach and education analytics tools provide reports which aggregate data like the number of clicks on advertisements. The reports are available only to CMS managers, teams who implement programs represented on CMS.gov, members of the CMS.gov communications and web teams, and other designated federal staff and contractors who need this information to perform their duties. How CMS uses cookies & other technologies on CMS.govThe Office of Management and Budget Memo M-10-22, Guidance for Online Use of Web Measurement and Customization Technologies, allows federal agencies to use session and persistent cookies to improve the delivery of services.When you visit a website, its server may generate a piece of text known as a “cookie” to place on your device. The cookie, which is unique to your browser, allows the server to "remember" specific information about your visit while you’re connected. The cookie makes it easier for you to use the dynamic features of web pages. Information that you enter into CMS.gov isn’t associated with cookies on CMS.gov. Depending on the third-party tool’s business practices, privacy policies, terms of service, and/or the privacy settings you selected, information you’ve provided to third parties could be used to identify you when you visit CMS.gov. These third parties don’t/won’t share your identity with CMS or the Department of Health and Human Services (HHS).There are 2 types of cookies - single session (temporary) and multi-session (persistent). Single session cookies last only as long as your internet browser is open. Once you close your browser, the session cookie disappears. Persistent cookies are stored on your device for longer periods. Both types of cookies create an ID that’s unique to your device.Session cookies: We use session cookies for technical purposes, like to allow better navigation through our website. These cookies let our server know that you’re continuing a visit to our website. The OMB Memo M-10-22 Guidance defines our use of session cookies as "Usage Tier 1—Single Session.” The policy says, "This tier encompasses any use of single session web measurement and customization technologies."Persistent cookies: We use persistent cookies to understand the differences between new and returning visitors to CMS.gov. Persistent cookies remain on your device between visits to our website until they expire or are removed by the user. The OMB Memorandum M-10-22 Guidance defines our use of persistent cookies as "Usage Tier 2—Multi-session without personally identifiable information.” The policy says, "This tier encompasses any use of multi-session web measurement and customization technologies when no PII is collected." We don’t use persistent cookies to collect PII. We don’t identify a user by using cookies.CMS also uses these technologies on CMS.gov:Persistent cookies for digital advertising: Similar to persistent cookies identified above, CMS uses persistent cookies for outreach through digital advertising. These cookies can also be created on third-party websites and remain on your device between visits to our website until they expire or you remove them. Consistent with OMB guidance for “Usage Tier 2”, we don’t use persistent cookies for outreach to collect PII. CMS doesn’t identify a user by using such technologies.Web beacons for digital advertising (also called pixels and/or tracking tags): See-through images placed on certain pages of CMS.gov are typically used in conjunction with cookies and aren’t stored on your device. When you access these pages, web beacons generate a notice of your visit. For information on how we use web beacons, see How CMS uses third-party websites & applications with CMS.gov.Website log files: These are used as an analysis tool and to tell how visitors use CMS.gov, how often they return, and how they navigate through the website.Flash: Flash is used to assess the performance of the site and as a player for selected videos depending on the browser a device is using.Local Storage Objects: We use Flash Local Storage Objects (“LSOs”) to store your preferences and to personalize your visit. Your choices about tracking & data collection on CMS.govCMS.gov offers Privacy Settings, which give you control over what tracking and data collection takes place during your visit. Third-party tools are enabled by default to provide a quality consumer experience.The Privacy Settings provide you with the choice to opt in or to opt out of the different categories of third-party tools used by CMS.gov: Advertising, Analytics, or Social Media. The Privacy Settings prevent cookies, web beacons, and Local Storage Objects from being placed on your device. The Privacy Manager also prevents third-party tools from loading regardless of your cookie settings, which provides you with an additional layer of privacy that prevents the tool from loading at all. Because the Privacy Manager creates a cookie in your browser, the opt in and opt out choices you make through the Privacy Manager will only be effective on the device and browser you used to make your choices, and your choices will expire when the cookie expires. Once the cookie is created, the Privacy Manager will retain your settings for 3 years from the date of your most recent visit. You may revisit the Privacy Manager to change or renew your choices at any time. In addition, you can choose to opt-out of web measurement and customization technologies through your web browser by following the opt-out instructions.Modify privacy optionsIf you disable cookies in your browser, our Privacy Manager won’t be able to store your preferences and won’t function properly. If you don’t wish to use our Privacy Manager to opt out of the tools used by CMS.gov, you can opt out of tools individually, or via the Digital Advertising Alliance (“DAA”) AdChoices icon, discussed in the next subsection.If you opt out of the tools used by CMS.gov via the Privacy Manager or by opting out of the tools directly, you’ll still have access to information and resources at CMS.gov.AdChoices: We include the AdChoices icon on all digital advertising that uses “conversion tracking” or “retargeting.” To learn about conversion tracking, targeted advertising, and retargeting, see How CMS uses third-party websites & applications with CMS.gov. The AdChoices icon is usually at or near the corner of digital ads. When you click on the AdChoices icon, it will provide information on what company served the ad and information on how to opt out. Learn more about AdChoices.Do Not Track: We automatically observe the “Do Not Track” browser setting for digital advertising that uses “conversion tracking” or “retargeting.” If “Do Not Track” is set before a device visits CMS.gov, third-party conversion tracking and retargeting tools won’t load on the website. To learn more about conversion tracking and retargeting, see How CMS uses third-party websites & applications with CMS.gov. Learn more about Do Not Track and how to set the Do Not Track setting in your browser. How CMS uses third-party websites & applications with CMS.govCMS.gov uses a variety of technologies and social media services to communicate and interact with the public. These third-party websites and applicatio'''
year_published = 2025
