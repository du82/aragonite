title = "Resources for Agents and Brokers in the Health Insurance Marketplaces | CMS"
description = "WelcomeWelcome to the Agents and Brokers Resources webpage. This page is the primary outlet for agents and brokers to receive information from CMS about working in the Health Insurance Marketplace and the Small Business Health Options Program (SHOP)."
full_description = '''Resources for Agents and Brokers in the Health Insurance Marketplaces Resources for Agents and Brokers in the Health Insurance Marketplaces WelcomeWelcome to the Agents and Brokers Resources webpage. This page is the primary outlet for agents and brokers to receive information from CMS about working in the Health Insurance Marketplace and the Small Business Health Options Program (SHOP).Tools and Resources for Agents and BrokersLearn more about completing annual Marketplace registration and trainingExplore frequently asked questionsSearch the database of all agent and broker resourcesFind Help Desk assistance (PDF)Watch our Video Learning Center playlist of technical assistance videosLearn more about participating in Help On Demand, the consumer assistance referral systemBrowse Find Local Help, an online directory of agents, brokers and assistersFind private partners that can help you enroll consumersView SHOP resources or other employer coverage options Latest NewsPlan Year 2025 Registration and Training is Live for New and Returning Agents and BrokersPlan year 2025 Marketplace registration and training is now available for new and returning agents and brokers on the Marketplace Learning Management System (MLMS)! For more Information on Plan Year 2025 registration and training, visit the Registration and Training page.Upcoming Webinars and Office HoursCMS hosts webinars and office hours throughout the year to help agents and brokers assist Marketplace consumers. For information on upcoming events, topics, and registration, please log on to REGTAP and register for Health Insurance Marketplace Updates for Agents and Brokers under Training Events.Manage your Email PreferencesAgents and brokers can manage the emails they want to receive from the Marketplace by updating their subscriber preferences. To get started, visit the Subscriber Preferences webpage for HealthCare.gov emails, enter the email address at which you receive emails from CMS, and click "Continue."To Subscribe to additional emails:Select the "Manage Subscriptions" tab.Click the "Add Subscriptions" link.Select the subscription topics on which you are interested in receiving information.Complete the Subscription questionnaire and click "Save"To adjust the number of emails you'll receive:Select the "Email Frequency" tab.Complete the subscription questionnaire and click "Save."If you need additional assistance, contact the Agent/Broker Email Help Desk at FFMProducer-AssisterHelpDesk@cms.hhs.gov. Page Last Modified: 01/22/2025 10:26 AM Help with File Formats and Plug-Ins'''
