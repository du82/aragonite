full_description = 'Memo on the Notification and Federal Employee Antidiscrimination and Retaliation Act - "No Fear Act" (P.L.107-174) (PDF) No Fear Act No Fear Act Section 301 of the Notification and Federal Employee Antidiscrimination and Retaliation Act of 2002 (the No Fear Act), requires each Federal agency to post summary statistical data pertaining to complaints of employment discrimination filed against it by employees, former employees and applicants for employment under 29 CFR (Code of Federal Regulations) Part 1614. The specific data to be posted is described in section 301(b) of the Act and 29 CFR 1614.704.The posting of Equal Employment Opportunity (EEO) data on agency public Web sites is intended to assist Congress, Federal agencies and the public to assess whether, and the extent to which, agencies are living up to their equal employment opportunity responsibilities.Additional information about the No Fear Act can be found in the Downloads and Related Links areas below. Downloads CMS No FEAR Act Report (PDF) No Fear Act Data Index (PDF) Memo on the Notification and Federal Employee Antidiscrimination and Retaliation Act - "No Fear Act" (P.L.107-174) (PDF) Interim Final Rule (PDF) Interim Final Rule (PDF) Related Links DHHS No Fear Act Page Last Modified: 09/10/2024 06:18 PM Help with File Formats and Plug-Ins'
