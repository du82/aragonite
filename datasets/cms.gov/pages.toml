["https://cms.gov/about-cms/information-systems/privacy/vulnerability-disclosure-policy"]
title = "CMS Vulnerability Disclosure Policy | CMS"
description = "The Centers for Medicare and Medicaid Services (CMS) is committed to ensuring the security of the American public by protecting their information from unwarranted disclosure. This policy is intended to give security researchers clear guidelines for conducting vulnerability discovery activities and to convey our preferences in how to submit discovered vulnerabilities to us."
full_description = "CMS Vulnerability Disclosure Policy Pages in this section Privacy Privacy Act of 1974 and Privacy Act Requests Data Use Agreement (DUA) Privacy Training Health Insurance Portability and Accountability Act of 1996 Privacy Impact Assessment (PIA) CMS System of Records Notices (SORN) Policy for Linking to Outside Websites Data Sharing Agreements CMS Vulnerability Disclosure Policy Notice of Privacy Practices for Original Medicare Incident Response Security Protocols to Protect Information CMS.gov External Link Disclaimer CMS Vulnerability Disclosure Policy The Centers for Medicare and Medicaid Services (CMS) is committed to ensuring the security of the American public by protecting their information from unwarranted disclosure. This policy is intended to give security researchers clear guidelines for conducting vulnerability discovery activities and to convey our preferences in how to submit discovered vulnerabilities to us.This policy describes what systems and types of research are covered under this policy, how to send us vulnerability reports, and how long we ask security researchers to wait before publicly disclosing vulnerabilities.We want security researchers to feel comfortable reporting vulnerabilities they’ve discovered – as set out in this policy – so we can fix them and keep our users safe. We have developed this policy to reflect our values and uphold our sense of responsibility to security researchers who share their expertise with us in good faith.Submit a vulnerability: Vulnerability reports can be submitted through Bugcrowd. Reports may be submitted anonymously. If you share contact information, we will acknowledge receipt of your report within 3 business daysAuthorization: If you make a good faith effort to comply with this policy during your security research, we will consider your research to be authorized, we will work with you to understand and resolve the issue quickly, and CMS will not recommend or pursue legal action related to your research.Guidelines: Under this policy, “research” means activities in which you:Notify us as soon as possible after you discover a real or potential security issue. Make every effort to avoid privacy violations, degradation of user experience, disruption to production systems, and destruction or manipulation of data.Only use exploits to the extent necessary to confirm a vulnerability’s presence. Do not use an exploit to compromise or exfiltrate data, establish command line access and/or persistence, or use the exploit to “pivot” to other systems.Provide us a reasonable amount of time to resolve the issue before you disclose it publicly.You do not intentionally compromise the privacy or safety of CMS personnel (e.g. civilian employees or military members), or any third parties.You do not intentionally compromise the intellectual property or other commercial or financial interests of any CMS personnel or entities, or any third parties.Once you’ve established that a vulnerability exists or encounter any sensitive data (including personally identifiable information, financial information, or proprietary information or trade secrets of any party), you must stop your test, notify us immediately, and not disclose this data to anyone else. Scope: All systems and services associated with domains listed below are in scope. Likewise, subdomains of each listing, unless explicitly excluded, are always in scope. Additionally, any website published with a link to this policy shall be considered in scope. Vulnerabilities found in non-federal systems from our vendors fall outside of this policy’s scope and should be reported directly to the vendor according to their disclosure policy (if any). If you aren’t sure whether a system or endpoint is in scope or not, contact ciso@cms.hhs.gov before starting your research.https://csscoperations.com/https://www.cms.gov/https://www.cuidadodesalud.gov/es/https://www.healthcare.gov/https://www.insurekidsnow.gov/https://www.medicaid.gov/https://www.medicare.gov/https://qualitynet.cms.gov Though we develop and maintain other internet-accessible systems or services, we ask that active research and testing only be conducted on the systems and services covered by the scope of this document. If there is a system not in scope that you think merits testing, please contact us to discuss it first. We will increase the scope of this policy over time.Rules of Engagement: Security researchers must not:Test any system other than the systems set forth in the ‘Scope’ section above,disclose vulnerability information except as set forth in the ‘Reporting a Vulnerability’ and ‘Disclosure’ sections below, engage in physical testing of facilities or resources, engage in social engineering, send unsolicited electronic mail to CMS users, including “phishing” messages, execute or attempt to execute “Denial of Service” or “Resource Exhaustion” attacks, introduce malicious software, test in a manner which could degrade the operation of CMS systems; or intentionally impair, disrupt, or disable CMS systems, test third-party applications, websites, or services that integrate with or link to or from CMS systems, delete, alter, share, retain, or destroy CMS data, or render CMS data inaccessible, or, use an exploit to exfiltrate data, establish command line access, establish a persistent presence on CMS systems, or “pivot” to other CMS systems.Security researchers may:View or store CMS nonpublic data only to the extent necessary to document the presence of a potential vulnerability.Security researchers must:Cease testing and notify us immediately upon discovery of a vulnerability,cease testing and notify us immediately upon discovery of an exposure of nonpublic data, and,purge any stored CMS nonpublic data upon reporting a vulnerability.Reporting a Vulnerability: Information submitted under this policy will be used for defensive purposes only – to mitigate or remediate vulnerabilities. If your findings include newly discovered vulnerabilities that affect all users of a product or service and not solely CMS, we may share your report with the Cybersecurity and Infrastructure Security Agency, where it will be handled under their coordinated vulnerability disclosure process. We will not share your name or contact information without express permission.By submitting a report, you are indicating that you have read, understand, and agree to the guidelines described in this policy for the conduct of security research and disclosure of vulnerabilities or indicators of vulnerabilities related to CMS information systems, and consent to having the contents of the communication and follow-up communications stored on a U.S. Government information system.In order to help us triage and prioritize submissions, we recommend that your reports:Adhere to all legal terms and conditions outlined at ciso@cms.hhs.gov.Describe the vulnerability, where it was discovered, and the potential impact of exploitation.Offer a detailed description of the steps needed to reproduce the vulnerability (proof of concept scripts or screenshots are helpful).Disclosure: CMS is committed to timely correction of vulnerabilities. However, we recognize that public disclosure of a vulnerability in absence of a readily available corrective action likely increases versus decreases risk. Accordingly, we require that you refrain from sharing information about discovered vulnerabilities for 90 calendar days after you have received our acknowledgement of receipt of your report. If you believe others should be informed of the vulnerability prior to our implementation of corrective actions, we require that you coordinate in advance with us.We may share vulnerability reports with the Cybersecurity and Infrastructure Security Agency (CISA), as well as any affected vendors. We will not share names or contact data of security researchers unless given explicit permission. If you have other cybersecurity related questions, please contact us at ciso@cms.hhs.gov. Page Last Modified: 09/11/2024 02:18 PM Help with File Formats and Plug-Ins"
year_published = 2024
year_updated = 2024
