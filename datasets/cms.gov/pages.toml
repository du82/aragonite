["https://cms.gov/marketplace/about/affordable-care-act"]
title = "Consumer Support and Information | CMS"
description = "The Affordable Care Act provides consumers with significant new protections, including the ability to appeal decisions by plans to deny coverage of needed services and select an available primary care provider of their choosing. As part of the law, CCIIO is helping consumers appeal health plan decisions, understand the Consumer Assistance Program, and more easily understand and evaluate their health insurance choices."
full_description = "Consumer Support and Information Pages in this section Affordable Care Act Content requirements for Plan Finder External appeals Consumer Assistance Program (CAP Grants) Consumer Support and Information The Affordable Care Act provides consumers with significant new protections, including the ability to appeal decisions by plans to deny coverage of needed services and select an available primary care provider of their choosing. As part of the law, CCIIO is helping consumers appeal health plan decisions, understand the Consumer Assistance Program, and more easily understand and evaluate their health insurance choices. Consumer Assistance Program Grants The new Consumer Assistance Program Grants (CAP Grants) will educate consumers about their health coverage options and ensure access to accurate information. External Appeals The law ensures consumer’s rights to appeal health plans decisions or request a reconsideration of a decision to deny payment for a service or treatment. Summary of Benefits and Coverage and Uniform Glossary The Affordable Care Act ensures consumers have access to two forms that will help them understand and evaluate their health insurance choices - a Summary of Benefits and Coverage and a uniform glossary of terms commonly used in health insurance coverage. Additional Resources Regulations & Guidance Fact Sheets & FAQs Letters & News Releases Funding Opportunities Other Resources Page Last Modified: 09/10/2024 06:11 PM Help with File Formats and Plug-Ins"
