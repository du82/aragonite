title = "Employer Initiatives | CMS"
description = "This section provides information about employer-related programs administered by the CMS Center for Consumer Information & Insurance Oversight (CCIIO) and provides additional guidance and resources for employers."
full_description = '''Employer Initiatives Employer Initiatives This section provides information about employer-related programs administered by the CMS Center for Consumer Information & Insurance Oversight (CCIIO) and provides additional guidance and resources for employers.Guidance and ResourcesSample 2016 Employer Notice (PDF) Fact Sheet: Spring 2016 Employer Notices (PDF)Frequently Asked Questions Regarding The Federally-Facilitated Marketplace’s (FFM) 2016 Employer Notice Program (PDF)Employer Appeal Request Form (PDF)Questions and Answers on Employer Shared Responsibility Provisions Under the Affordable Care ActEmployer Coverage Tool (English) (PDF)Employer Coverage Tool (Spanish) (PDF)ACA Anti-retaliation provisionEmployer Appeal Document Verification Guide (PDF) Individual Coverage Health Reimbursement Arrangements: Pre-Open Enrollment Period Training, Fall 2019 (PDF)Letter to Employers, Plan Sponsors, and Issuers on coverage loss in Medicaid and CHIPIndividual Coverage HRA (ICHRA) Employer Premium ResourcesTo help employers determine whether an ICHRA offer is considered affordable for purposes of validating they are making affordable offers of coverage to their employees and avoiding the employer responsibility payment, CMS is publishing the ICHRA Employer LCSP Premium Look-up Table. The table allows users in states participating in the Federally-facilitated Exchange (FFEs) and State-based Exchanges on the Federal Platform (SBE-FPs) to access individual market Qualified Health Plans (QHP) lowest cost silver plan (LCSP) data by geographic location.For additional information, please review the ICHRA Employer LCSP Premium Look-Up Table and the associated ICHRA Employer LCSP Premium Look-up Table Data Dictionary, as well as the proposed rule. "Application of the Employer Shared Responsibility Provisions and Certain Nondiscrimination Rules to Health Reimbursement Arrangements and Other Account-Based Group Health Plans Integrated With Individual Health Insurance Coverage or Medicare"Plan Year 2019ICHRA Employer Lowest Cost Silver Plan Premium Lookup Table (VND.MS-EXCEL.SHEET.MACROENABLED.12)ICHRA Employer Lowest Cost Silver Plan Premium Look-up Table Data Dictionary (PDF)Plan Year 2020ICHRA Employer Lowest Cost Silver Plan Premium Look-up Table (VND.MS-EXCEL.SHEET.MACROENABLED.12)ICHRA Employer Lowest Cost Silver Plan Premium Look-up Table Data Dictionary (PDF)Plan Year 2021ICHRA Employer Lowest Cost Silver Plan Premium Look-up Table (VND.MS-EXCEL.SHEET.MACROENABLED.12) (XLSM)ICHRA Employer Lowest Cost Silver Plan Premium Look-up Table Data Dictionary (PDF)Plan Year 2022ICHRA Employer Lowest Cost Silver Plan Premium Look-up Table (VND.MS-EXCEL.SHEET.MACROENABLED.12) (XLSM)ICHRA Employer Lowest Cost Silver Plan Premium Look-up Table Data Dictionary (DOCX)Plan Year 2023ICHRA Employer Lowest Cost Silver Plan Premium Look-up Table (VND.MS-EXCEL.SHEET.MACROENABLED.12) (XLSM)ICHRA Employer Lowest Cost Silver Plan Premium Look-up Table Data Dictionary (PDF)Plan Year 2024ICHRA Employer Lowest Cost Silver Plan Premium Look-up Table (VND.MS-EXCELSHEET.MACROENABLED.12) (XLSM)ICHRA Employer Lowest Cost Silver Plan Premium Look-up Table Data Dictionary (PDF)Plan Year 2025ICHRA Employer Lowest Cost Silver Plan Premium Look-up Table (VND.MS-EXCELSHEET.MACROENABLED.12) (XLSM)ICHRA Employer Lowest Cost Silver Plan Premium Look-up Table Data Dictionary (PDF)Employer Notice and AppealsThe Affordable Care Act and implementing regulations require each Health Insurance Marketplace to notify an employer whose employee enrolled in a Qualified Health Plan with Marketplace financial assistance. An employer that receives an employer notice may appeal the Marketplace’s determination that it does not offer minimum essential coverage that is affordable to the employee and meets minimum value. The IRS will independently determine any liability for the employer shared responsibility payment. Whether or not an employer chooses to appeal will not have any effect on the IRS’s determination of liability for the employer shared responsibility. Employer Verification StudyCMS is requesting information from some employers about the Employer-Sponsored Coverage (ESC) offered to employees for the 2016 plan year. A CMS contractor may contact employers by telephone between April 2016 and June 2016 during the hours of 9 AM to 12 PM and 1 PM to 5 PM (local time for each business). Each call is expected to last 10-15 minutes.Employer participation will enable CMS to evaluate for plan year 2016 whether an employee, or a sample of employees, correctly attested that he or she was not offered ESC that met affordability and minimum value requirements:Affordability: An employer-sponsored plan is affordable if the employee’s share of the annual premium for the lowest cost self-only plan (LCSOP) that meets the minimum value standard is less than 9.66% of individual’s annual household income in 2016.Minimum Value: A health plan meets this standard if it’s designed to pay at least 60% of the total cost of medical services for a standard population, and if its benefits include substantial coverage of inpatient hospital and physician services. This information should be in the Summary of Benefits and Coverage (SBC) Sheet. You also may have a Report of Minimum Value Certification from an actuary accredited by the American Academy of Actuaries (AAA).Employers will be asked to provide information regarding the lowest-cost self-only health plan that they offered for plan year 2016, as well as their employees’ eligibility for employer-sponsored coverage.Participation in this study is voluntary.If you are an employer and have any questions, please contact the Marketplace Employer Hotline at 1- 800-355-5856 (TTY: 711), open Monday through Friday 9 am – 7 pm ET.Letter to Employers, Plan Sponsors, and Issuers on coverage loss in Medicaid and CHIPThis letter (PDF) to Employers, Plan Sponsors, and Issuers urges them to match the steps taken by HealthCare.gov by allowing employees and their dependents who are losing coverage in Medicaid and the Children's Health Insurance Program (CHIP) to enroll anytime through July 31, 2024, in recognition of the complicated transition and the importance or maintaining life-saving coverage for employees and their families. Page Last Modified: 11/22/2024 10:02 AM Help with File Formats and Plug-Ins'''
