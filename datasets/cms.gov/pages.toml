full_description = "Insurance Programs Pages in this section Insurance programs Early Retiree Reinsurance Program Consumer operated & oriented plan program Insurance Programs Consumer Operated and Oriented Plan Program The Affordable Care Act calls for the establishment of the Consumer Operated and Oriented Plan (CO-OP) Program, which will foster the creation of qualified nonprofit health insurance issuers to offer competitive health plans in the individual and small group markets. Early Retiree Reinsurance Program The Affordable Care Act established the Early Retiree Reinsurance Program (ERRP) which provided reimbursement to participating employment-based plans for a portion of the cost of health benefits for early retirees and their spouses, surviving spouses and dependents. The temporary program ended January 1, 2014. Pre-Existing Condition Insurance Plan The Affordable Care Act created the Pre-Existing Condition Insurance Plan (PCIP) to make health insurance available to those that have been denied coverage by private insurance companies because of a pre-existing condition. PCIP runs until 2014 when everyone will have access to affordable health insurance choices through Health Insurance Marketplaces. Page Last Modified: 09/10/2024 06:11 PM Help with File Formats and Plug-Ins"
