["https://cms.gov/marketplace/health-plans-issuers/premium-stabilization-programs"]
title = "Premium Stabilization Programs | CMS"
description = "The Affordable Care Act creates the risk adjustment, reinsurance and risk corridors programs (referred to as the premium stabilization programs), the cost-sharing reductions program, and Marketplace affordability programs such as advance payments of the premium tax credit. These programs are designed to provide consumers with affordable health insurance coverage, to reduce incentives for health insurance issuers to avoid enrolling sicker people, and to stabilize premiums in the individual and small group health insurance markets inside and outside the Marketplaces."
full_description = 'Premium Stabilization Programs Pages in this section Premium stabilization programs The Transitional Reinsurance Program - Reinsurance Contributions Premium Stabilization Programs The Affordable Care Act creates the risk adjustment, reinsurance and risk corridors programs (referred to as the premium stabilization programs), the cost-sharing reductions program, and Marketplace affordability programs such as advance payments of the premium tax credit. These programs are designed to provide consumers with affordable health insurance coverage, to reduce incentives for health insurance issuers to avoid enrolling sicker people, and to stabilize premiums in the individual and small group health insurance markets inside and outside the Marketplaces. Specifically, these programs are:Reducing the incentives for health insurance issuers to avoid enrolling people with pre-existing conditions: The permanent risk adjustment program will assist health plans that provide coverage to individuals with higher health care costs and will help ensure that those who are sick have access to the coverage they need.Stabilizing premiums in the individual market for health insurance: The transitional reinsurance program is a three-year program designed to reduce premiums and ensure market stability for issuers and thereby reduce premiums for enrollees in the individual market to ensure market stability with the implementation of new consumer protections in 2014.Protecting health insurance issuers against uncertainty in setting premium rates: The temporary risk corridors program protects qualified health plans from uncertainty in rate setting from 2014 to 2016 by having the Federal government share risk in losses and gains.Assisting low and moderate-income Americans in affording health insurance on the Marketplaces: Advance payments of the premium tax credit will help eligible individuals pay their premiums and make coverage purchased through a Marketplace affordable for low- and middle-income consumers. The cost-sharing reduction program will further reduce the out-of-pocket spending for health services for low- and middle-income individuals, and Indians.AnnouncementsPremium Stabilization Programs Data ReportsJune 17, 2015 - 2014 Benefit Year Transitional Reinsurance Program Pro Rata Adjustment to the National Coinsurance Rate (PDF)June 30, 2015 - Summary Report on Transitional Reinsurance Payments and Permanent Risk Adjustment Transfers for the 2014 Benefit Year (PDF)September 17, 2015 - Updated Report “Summary Report on Transitional Reinsurance Payments and Permanent Risk Adjustment Transfers for the 2014 Benefit Year” (PDF)2014 Geographic Cost Factors - Addendum to Summary Report on Transitional Reinsurance Payments and Permanent Risk Adjustment Transfers for the 2014 Benefit Year (PDF)October 1, 2015 - Risk Corridors Payment Proration Rate for 2014 (PDF)October 9, 2015 - Early Reinsurance Payments for the 2015 Benefit Year (PDF)November 19, 2015 - Risk Corridors Payment and Charge Amounts for Benefit Year 2014 Report (PDF)March 18, 2016 - Interim Summary Report on Risk Adjustment for the 2015 Benefit Year (PDF)June 17, 2016 - 2015 Benefit Year Transitional Reinsurance Program Pro Rata Adjustment to the National Coinsurance Rate (PDF)June 30, 2016 - Summary Report on Transitional Reinsurance Payments and Permanent Risk Adjustment Transfers for the 2015 Benefit Year (PDF)December 6, 2016 - Amendment to the Summary Report on Transitional Reinsurance Payments and Permanent Risk Adjustment Transfers for the 2015 Benefit Year (PDF)Appendix A to June 30, 2016 Summary Report – HHS Risk Adjustment Program State-Specific Data (XLSX)(Revised January 2018 to include induced demand factors)Appendix B to June 30, 2016 Summary Report – HHS Risk Adjustment Geographic Cost Factor (GCF) (XLSX)September 9, 2016 - Risk Corridors Payments for 2015 (PDF)November 18, 2016 - Risk Corridors Payment and Charge Amounts for the 2015 Benefit Year (PDF)March 3