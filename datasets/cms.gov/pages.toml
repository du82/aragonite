["https://cms.gov/About-CMS/Career-Information/CareersatCMS/index"]
title = "Careers at CMS | CMS"
description = "AboutCMS has some of the most exciting and re"
full_description = '''Careers at CMS Pages in this section Careers Data Science Careers Employment Opportunities for Veterans Employment Opportunities for Individuals with Disabilities Careers at the Innovation Center Positions at CMS Locations & Facilities Employee Benefits USPHS Commissioned Corps CMS CyberVets Program CMS Recruitment and Outreach Schedule Careers Frequently Asked Questions (FAQ) Nurses at CMS Opportunities for Students and Recent Graduates Returned Peace Corps Volunteers Careers at CMS AboutCMS has some of the most exciting and rewarding careers in the federal government. Our work is vast - touching the lives of over 140 million Americans. Our mission is clear – to serve as a trusted partner and steward, dedicated to advancing health equity, expanding coverage, and improving health outcomes. Our ability to manage the Medicare, Medicaid, and Health Insurance Marketplace programs depends on our dedicated staff of public servants.So whether you’re tech savvy, health focused, numbers driven, or anywhere in between – explore what CMS has to offer for you. Located in Maryland and offices around the country, we offer competitive benefits, meaningful assignments, and growth opportunities to enhance the trajectory of your career while providing a sense of purpose in your work.All career opportunities will be listed on USAJOBS, as they become available. Please subscribe to the CMS Careers Listserv or follow CMS on LinkedIn to stay connected! CMS is honored to have been named one of Forbes Best Large Employers in America and one of Diversity Jobs' Top Employers!Want to learn more?Join our Discover More in 2024 Virtual Events on Wednesday's from March through December 2024 at 1:30 PM EST to hear from Human Resources experts and other Centers for Medicare and Medicaid Service professionals on agency hiring trends in the “new normal” and everything you want to know about federal hiring. Please visit the "CMS Recruitment and Outreach" tab to register today!Missed a webinar? Find the recordings on the Careers at CMS Playlist on our YouTube channel.What exciting opportunities can you find at CMS? General public Don’t have current or past federal experience? These job openings for the general public are for you.Current & former federal employeesAre you a current or former federal employee? Here are jobs open to:Current federal employees serving under a career or career conditional appointment.Former federal employees with reinstatement eligibility; and persons eligible for non-competitive appointment under special hiring authorities (e.g., Veterans Recruitment Appointment, VEOA, etc).U.S. Public Health Service Commissioned Corps Officers.Below are Open Continuous Announcements:IT Specialist (Systems Analysis) (11/19/2024-3/03/2025) - You will perform a wide variety of duties related to the design,development, and implementation of new and modernized HHS information technology (IT) systems in support of HHS programs. To learn more, please visit: USAJOBSHealth Insurance Specialist (11/13/2024-3/03/2025) - You will apply a wide range of qualitative and/or quantitative methods to assess the effectiveness of agency programs. To learn more, please visit: USAJOBSProgram Analyst (11/18/2024-3/03/2025) - You will plan, analyze, and evaluate the efficiency and effectiveness of line health care, health regulatory, or human services program within an HHS organization. To learn more, please visit: USAJOBSHealth Insurance Specialist (Program Policy) (11/08/2024-3/03/2025) - You will apply a wide range of qualitative and/or quantitative methods for the assessment of the effectiveness of agency programs such as conducting program related studies regarding quality of care, program oversight etc. To learn more, please visit: USAJOBS To learn more about Open Continuous announcements, please visit: FAQVeteransDid you serve our country and are now looking for a new challenge?Students & recent graduatesAre you a student or recent college graduate who wants to start your career with us?People with disabilitiesAre you a person with a disability who’s looking to join our team?Returned Peace Corps VolunteersAre you a Returned Peace Corps Volunteer? Visit our Peace Corps Volunteers page.Senior Executive Service (SES)Looking for an SES position? Visit USAJOBS.All open CMS jobs Want to see all of our open jobs? Here’s our USAJOBS search page where you can search all of our announcements posted now on USAJOBS.Need more information?If you have questions about a specific CMS vacancy, email the servicing Human Resources Specialist listed on the job’s announcement. Each vacancy announcement has contact information.For more information about how the federal application process works:Create an account with USAJobs.gov Complete your profile to apply to jobs, save searches and save jobs.Search for jobs at CMS and select a job announcement you're interested in applying to. Review the job announcement and prepare your resume for a government position If it’s a CV, strip out academic language.If you are coming from the military, replace any jargon with the federal equivalent.Prepare to spend significant time (a couple of hours or more) on the application. Submit your application in USAJobs.gov to the CMS position. The application process can take a few months while we review applications and select candidates for referrals. Interview with the hiring manager for the position.Receive and accept your official offer from the CMS hiring official.Complete your onboarding paperwork including background investigation which may take several weeks or more. Receive your final job offer and a start date.Attend new employee orientation on your first day and report to your new office. Make a positive impact on Americans everywhere. Downloads Top 10 Recruitment Webinar Series (PDF) Required Documents (PDF) Area of Consideration Eligibility (PDF) Discover More in 2024 Virtual Events (PDF) Related Links Current Openings View all CMS Jobs Veterans Recruitment Appointment Page Last Modified: 12/06/2024 02:35 PM Help with File Formats and Plug-Ins'''
