["https://cms.gov/marketplace-private-insurance/health-plans-issuers/pbm-drug-pricing-review"]
title = "PBM-Drug-Pricing-Review | CMS"
description = "Qualified Health Plans & Pharmacy Benefit Manager Drug Data, Pricing, and Rebate Review (QHP PBM DPR2)The Affordable Care Act added section 1150(a)(2) of the Social Security Act, requiring pharmacy benefit managers (PBMs) and qualified health plan (QHP) issuers to report prescription drug benefit information to the Department of Health and Human Services (HHS)."
full_description = "Qualified Health Plans & Pharmacy Benefit Manager Drug Data, Pricing, and Rebate Review (QHP PBM DPR2)The Affordable Care Act added section 1150(a)(2) of the Social Security Act, requiring pharmacy benefit managers (PBMs) and qualified health plan (QHP) issuers to report prescription drug benefit information to the Department of Health and Human Services (HHS). Section 1150A(a)(2) extends this reporting requirement to PBMs that contract with QHP issuers to manage prescription drug coverage. This requirement applies to PBMs contracting with QHP issuers in all states, regardless of Exchange type. This requirement does not extend to health plans offered by QHP issuers that are not QHPs. This requirement does not apply to standalone dental plans. What information do PBMs and QHP issuers submit to CMS?Section 1150A of the Social Security Act requires PBMs and QHP issuers to submit information about: The percentage of prescriptions provided through retail pharmacies compared to mail order pharmacies, and the generic dispensing rate. The aggregate amounts and types of rebates, discounts, or price concessions (excluding bona fide service fees) that a QHP issuer or its contracted PBM negotiates that are attributable to patient utilization under the QHP; the aggregate number of rebates, discounts, or price concessions that are passed through to the QHP issuer; and the total number of prescriptions that were dispensed. The aggregate difference between the amount the QHP pays the PBM and the amount that the PBM pays retail and mail order pharmacies (commonly referred to as spread pricing).How does CMS use this information?Submitted data helps CMS better understand the costs of prescription drugs and the role that PBMs play in the drug industry. Is this information publicly available?Pursuant to the statute, CMS may only share collected information with the Government Accountability office (GAO), Congressional Budget Office (CBO), and the states for the purpose of operating an Exchange. Therefore, CMS cannot make this information publicly available.Primary Filing Resources QHP Pharmacy Benefit Manager Drug Data Pricing and Rebate Review DPR2 Template Instructions (PDF)PBM Detailed Data Template (XLSX) PBM Attestation Form (PDF) QHP Issuer Attestation Form (PDF) HIOS ManualsHIOS Portal Quick Guide (PDF) PBM User Manual (PDF) Other ResourcesHow to submit data for the Qualified Health Plan Pharmacy Benefit Manager Drug data, Pricing and Rebate Review (YouTube Video)Federal Regulation Section 1150A of the Social Security Act45 CFR 156.295 45 CFR 184.50PBMs and QHP issuers may submit technical questions to the CMS Help Desk at: CMS_FEPS@cms.hhs.gov Page Last Modified: 05/31/2024 05:54 PM Help with File Formats and Plug-Ins"
