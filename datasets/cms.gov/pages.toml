["https://cms.gov/marketplace/in-person-assisters/programs-procedures"]
title = "Assister programs & procedures | CMS"
description = "Assisters and navigators play an important role in educating and helping consumers through the Marketplace application and enrollment process. These regulations, guidelines, and procedures ensure assisters and navigators are maintaining professional standards of behavior and providing consistent customer service."
full_description = "Assister programs & procedures Pages in this section Assister programs & procedures In-Person Assistance Certified Application Counselor Designated Organization (CDO) Program Information Assister programs & procedures Assisters and navigators play an important role in educating and helping consumers through the Marketplace application and enrollment process. These regulations, guidelines, and procedures ensure assisters and navigators are maintaining professional standards of behavior and providing consistent customer service. Guidance & regulations—Find regulations, requirements, and guidance to help assisters and navigators ensure they are maintaining the standards of their program and providing outstanding customer service. Standard Operating Procedures (SOPs)—Learn about the requirements, policies, and best practices for navigators and certified application counselors who are helping Marketplace consumers.Assister toolkit—Explore a roadmap to resources, enrollment practices, and guidance for working with immigrants applying for health coverage through the Marketplace. Certified Application Counselor Designated Organization Program Information—Learn how to become a Certified Application Counselor Designated Organization that provides volunteers trained to assist Marketplace consumers. Page Last Modified: 12/11/2024 12:59 PM Help with File Formats and Plug-Ins"
year_published = 2024
