["https://cms.gov/marketplace/agents-brokers/registration-training"]
title = "Registration and Training for Marketplace Agents and Brokers | CMS"
description = "Plan Year 2025 Marketplace Registration and Training is Live for New and Returning Agents and BrokersPlan year 2025 Marketplace registration and training is now available for new and returning agents and brokers on the Marketplace Learning Management System (MLMS)! Plan year 2025 Marketplace training is available in English and Spanish."
full_description = "Registration and Training for Marketplace Agents and Brokers Registration and Training for Marketplace Agents and Brokers Plan Year 2025 Marketplace Registration and Training is Live for New and Returning Agents and BrokersPlan year 2025 Marketplace registration and training is now available for new and returning agents and brokers on the Marketplace Learning Management System (MLMS)! Plan year 2025 Marketplace training is available in English and Spanish.Annual Marketplace Registration and Training RequirementsNew Agents and BrokersAgents and brokers who are new to the Marketplace this year, or who did not complete plan year 2024 registration and training, are required to take the full Individual Marketplace training for plan year 2025. New agents and brokers can take Individual Marketplace training through the MLMS or the HHS-approved vendor(s).Review this tip sheet for new agents and brokers (PDF) to help you through the registration and training steps.Returning Agents and BrokersAgents and brokers who completed plan year 2024 Individual Marketplace registration and training will be eligible to take a shorter training for plan year 2025 as well as optional review modules. Returning agents and brokers can take training through the MLMS or the HHS-approved vendor(s).Review this tip sheet for returning agents and brokers (PDF) to help you through the registration and training steps.Help On Demand for Agents and BrokersHelp On Demand is a consumer assistance referral system that connects consumers seeking assistance with Marketplace-registered, state-licensed agents and brokers in their area who can provide immediate assistance with Marketplace plans and enrollments. Help On Demand is a CMS-contracted service developed and hosted by Help On Demand (formerly known as BigWave Systems). Only agents and brokers who have completed Marketplace training and registration are eligible to participate in Help On Demand. If you are already registered to participate in Help On Demand, you can log into your account at https://marketplace.helpondemand.comFor more information and resources on Help On Demand, visit the Help On Demand page. Small Business Health Options Program (SHOP)To participate in SHOP, agents and brokers must complete an MLMS profile and execute the SHOP Privacy and Security Agreement. Agents and brokers are strongly encouraged to complete the associated training, but it is not required. For more information about participating in SHOP, visit the SHOP page.Other Key Registration and Training ResourcesEnterprise Identity Management (EIDM) to Identity Management (IDM) Transition (PDF)June 2020National Producer Number (NPN) Validation Frequently Asked Questions (FAQs) (PDF)Agent and Broker Federally-facilitated Marketplace (FFM) Registration Completion ListThe Agent and Broker FFM Registration Completion List (RCL) contains the National Producer Numbers (NPNs) for agents and brokers who have completed Marketplace registration for the current year. CMS posts this list as frequently as daily. All NPNs are self-reported by the agent or broker during Marketplace registration, and should be validated against state and/or other The National Association of Insurance Commissioners (NAIC) records to confirm state licensure. CMS is updating the agent/broker licensure validation methodology in some states. Agents and brokers who do not have an approved health-related Line of Authority (LOA), as determined by their resident state, do not have access to Marketplace systems and are not allowed to assist consumers with Marketplace enrollment. Agents and brokers can check their resident state licensure requirements to ensure they have an approved health-related LOA. State licensure questions should be directed to the resident State Department of Insurance authority found at the National Insurance Producer Registry (NIPR) at https://nipr.com/licensing-center/add-a-line-of-authority.The Agent and Broker FFM Registration Termination List (RTL) contains the NPNs for agents and brokers whose FFM agreements and registration have been terminated by CMS. Termination is described in regulation at 45 CFR 155.220(f)-(g).Issuers, web-brokers, and agents and brokers can access the RCL and RTL by following the link below:Data.Healthcare.Gov Registration Status Lists Landing Page - Opens in a new windowIssuers, web-brokers, and agents and brokers can access the RCL and RTL data dictionaries by following the links below:RCL Data Dictionary (PDF)RTL Data Dictionary (PDF)Resident State Required Line of Authority Page Last Modified: 02/25/2025 01:26 PM Help with File Formats and Plug-Ins"
year_published = 2025
year_updated = 2025
