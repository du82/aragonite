["https://cms.gov/marketplace/about/oversight"]
title = "Consumer Information and Insurance Oversight | CMS"
description = "Ensuring the Affordable Care Act Serves the American People The Center for Consumer Information and Insurance Oversight (CCIIO) is charged with helping implement many reforms of the Affordable Care Act, the historic health reform bill that was signed into law March 23, 2010. CCIIO oversees the implementation of the provisions related to private health insurance. In particular, CCIIO is working with states to establish new Health Insurance Marketplaces."
full_description = "Consumer Information and Insurance Oversight Pages in this section Marketplace oversight Other Insurance Protections Consumer Information and Insurance Oversight Ensuring the Affordable Care Act Serves the American People The Center for Consumer Information and Insurance Oversight (CCIIO) is charged with helping implement many reforms of the Affordable Care Act, the historic health reform bill that was signed into law March 23, 2010. CCIIO oversees the implementation of the provisions related to private health insurance. In particular, CCIIO is working with states to establish new Health Insurance Marketplaces. CCIIO works closely with state regulators, consumers, and other stakeholders to ensure the Affordable Care Act best serves the American people. Marketplace Resources Further information for partners is available on the CMS Health Insurance Marketplace website. Consumer friendly information about new coverage options through the Health Insurance Marketplace is available at www.HealthCare.gov - Opens in a new window . For information about employer related programs please click here. Ending Surprise Medical Bills Starting January 1, 2022, consumers have new billing protections when getting emergency care, non-emergency care from out-of-network providers at in-network facilities, and air ambulance services from out-of-network providers. Through new rules aimed to protect consumers, excessive out-of-pocket costs are restricted, and emergency services must continue to be covered without any prior authorization, and regardless of whether or not a provider or facility is in-network. See how new rules help protect people from surprise medical bills and remove consumers from payment disputes between a provider or health care facility and their health plan, visit: cms.gov/nosurprises. Page Last Modified: 09/10/2024 06:18 PM Help with File Formats and Plug-Ins"
year_published = 2024
year_updated = 2024
