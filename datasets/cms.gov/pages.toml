title = "COVID-19 Vaccine Toolkit | CMS"
description = "The COVID-19 public health emergency (PHE) ended at the end of the day on May 11, 2023. View Infectious diseases for a list of waivers and flexibilities that were in place during the PHE."
full_description = "COVID-19 Vaccine Toolkit Pages in this section Covid-19 Vaccine Toolkit COVID-19 Monoclonal Antibodies Medicare COVID-19 Vaccine Shot Payment Medicare Billing for COVID-19 Vaccine Shot Administration Coding for COVID-19 Vaccine Shots New COVID-19 Treatments Add-On Payment (NCTAP) SNF: Enforcement Discretion Relating to Certain Pharmacy Billing COVID-19 Vaccine Toolkit The COVID-19 public health emergency (PHE) ended at the end of the day on May 11, 2023. View Infectious diseases for a list of waivers and flexibilities that were in place during the PHE.This toolkit is for health care providers. If you're a person with Medicare, learn more about your Medicare coverage for COVID-19 vaccines.This COVID-19 Vaccine Provider Toolkit includes information on:Coding structureMedicare payment rates for administering vaccinesHow to bill correctly for administering vaccines, including roster and centralized billingMonoclonal antibodies for treating COVID-19If you have questions about billing or payment for patients covered by private insurance or Medicaid, contact their health plan or state Medicaid agency.Note:Patients who are moderately or severely immunocompromised (have a weakened immune system) are at increased risk of severe COVID-19 illness and death. Their immune response following COVID-19 vaccination may differ for these patients. Learn about COVID-19 vaccine guidance for moderately or severely immunocompromised patients. Related Links CDC COVID-19 COVID-19 Accelerated and Advance Payments COVID-19 Accelerated and Advance Payment (CAAP) and Repayment Reporting COVID-19 toolkits Coronavirus Waivers & Flexibilities Past Emergencies – Infectious Diseases Vaccine Pricing Page Last Modified: 09/10/2024 06:27 PM Help with File Formats and Plug-Ins"
