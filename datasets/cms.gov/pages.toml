["https://cms.gov/glossary"]
title = "Glossary | CMS"
description = "Sort descending"
full_description = '''Glossary Acronyms View: 10 20 30 1-10 of 1034 Glossary and Acronyms Term Sort descending Definition 508 508 Compliance CMS is also bound to producing what’s called 508 compliant applications. Julie Shadoan is the CMS voice you will here when this topic comes up. This link addresses CMS 508 process:http://www.cms.gov/Research-Statistics-Data-and-Systems/CMS-Information-Technology/Section508/index.html. On the left side there is a “Verification Process . . .” link that goes into more detail about how CMS verifies our applications are 508 compliant. A "TIER" is a specific list of drugs. Your plan may have several tiers,and your copayment amount depends on which tier your drug is listed.Plans can choose their own tiers, so members should refer to their benefit booklet or contact the plan for more information. ABSTRACT Is the collection of information from the medical record via hard copy or electronic instrument. ABUSE A range of the following improper behaviors or billing practices including, but not limited to:Billing for a non-covered service;Misusing codes on the claim (i.e., the way the service is coded on the claim does not comply with national or local coding guidelines or is not billed as rendered); orInappropriately allocating costs on a cost report ABUSE (PERSONAL) When another person does something on purpose that causes you mental or physical harm or pain. ACCESS Your ability to get needed medical care and services. ACCESSIBILITY OF SERVICES Your ability to get medical care and services when you need them. ACCESSORY DWELLING UNIT (ADU) A separate housing arrangement within a single-family home. The ADU is a complete living unit and includes a private kitchen and bath. ACCREDITATION An evaluative process in which a healthcare organization undergoes an examination of its policies, procedures and performance by an external organization ("accrediting body") to ensure that it is meeting predetermined criteria. It usually involves both on- and off-site surveys. ACCREDITATION CYCLE FOR M+C DEEMING The duration of CMS's recognition of the validity of an accrediting organization's determination that a Medicare + Choice organization (M+CO) is "fully accredited". 1-10 of 1034 Pagination Current page 1 Page 2 Page 3 Page 4 Page 5 Page 6 Page 7 Page 8 Page 9 Next page Last page'''
