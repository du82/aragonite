["https://cms.gov/marketplace/assisters-navigators/enrollment/champion"]
title = 'Become a "Champion for Coverage" | CMS'
full_description = 'Become a "Champion for Coverage" Help us make sure all people can get the care they need, when they need it, at a price they can afford. Sign up to be a "Champion for Coverage" For organizations Become a Champion for Coverage organization to represent under or uninsured communities. Be active in providing outreach and education about the Health Insurance Marketplace® and how consumers can enroll in health coverage through HealthCare.gov, Medicaid or CHIP. Sign up your organization Learn how to be a "Champion for Coverage" Already a “Champion for Coverage” Take action to engage your community. There are multiple activities to get started such as using digital toolkits to host outreach and engagement activities in your community, distributing fact sheets, sharing social media content, and subscribing to email updates with the latest news and resources to share. If you have questions, send an email to champion@cms.hhs.gov'
