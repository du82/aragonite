title = "Who We Are | CNCF"
description = "The Cloud Native Computing Foundation (CNCF) hosts critical components of the global technology infrastructure. We bring together the world’s top developers, end users, and vendors and run the largest…"
full_description = "Who we are The Cloud Native Computing Foundation (CNCF) hosts critical components of the global technology infrastructure. We bring together the world’s top developers, end users, and vendors and run the largest open source developer conferences. CNCF is part of the nonprofit Linux Foundation. Our charter “CNCF’s mission is to make cloud native computing ubiquitous…” Read the CNCF charter Useful links Read about recent work and accomplishments in the CNCF Annual Report View our FAQ Read the CNCF Community Code of Conduct Our amazing events & members see more Previous Photo Next Photo Cloud Native Definition Cloud native technologies empower organizations to build and run scalable applications in modern, dynamic environments such as public, private, and hybrid clouds. Containers, service meshes, microservices, immutable infrastructure, and declarative APIs exemplify this approach. These techniques enable loosely coupled systems that are resilient, manageable, and observable. Combined with robust automation, they allow engineers to make high-impact changes frequently and predictably with minimal toil. The Cloud Native Computing Foundation seeks to drive adoption of this paradigm by fostering and sustaining an ecosystem of open source, vendor-neutral projects. We democratize state-of-the-art patterns to make these innovations accessible for everyone. Read in other languages (and contribute) on GitHub. We are a community of doers who enable open source projects including Kubernetes, Prometheus, Envoy, and many others. Kubernetes and other CNCF projects have quickly gained adoption and secured diverse community support, becoming some of the highest velocity projects in the history of open source. 196 CNCF Projects 272 K+ CNCF Project Contributors 732 CNCF Members 105 K+ Cloud Native Community Members"
year_published = 2024
