title = "Join CNCF | CNCF"
description = "Become an integral part of the Cloud Native Computing Foundation, to build and shape the future cloud native ecosystem. JOIN CNCF Get in Touch Kubernetes and other CNCF projects have quickly gained…"
full_description = "Join CNCF Become an integral part of the Cloud Native Computing Foundation, to build and shape the future cloud native ecosystem. JOIN CNCF Get in Touch We are a community of doers, bringing cloud native computing to the world through open source technology Kubernetes and other CNCF projects have quickly gained adoption and secured diverse community support, becoming some of the highest velocity projects in the history of open source. 196 CNCF Projects 272 K+ CNCF Project Contributors 732 CNCF Members 105 K+ Cloud Native Community Members Join now General Members Join your industry peers to build and shape the cloud native ecosystem for the future. Organizations that sell cloud native technologies built on, or integrated with, CNCF projects are eligible to join as general members, and take advantage of wide-ranging benefits including brand amplification and technical input to key projects. Get in touch if you have any questions. JOIN CNCF End User Members? Companies that use cloud native technologies internally, but do not sell any cloud native services externally, are eligible to join the End User Community. This excludes vendors, consultancies, training partners & telcos. CNCF offers multiple opportunities for end users to contribute to the cloud native ecosystem, collaborate with peers on best practices, work directly with project maintainers, and provide feedback to CNCF. Explore the Community Thank you to our Platinum Members for their commitment to advancing cloud native ecosystems SEE ALL MEMBERS CNCF Platinum members are true agents of change, recognized publicly for their thought leadership and contributions the CNCF. Explore the benefits in joining CNCF Amplify your brand & people across the industry Learn More Amplify your brand across the industry Leverage CNCF's global reach to drive your go-to-market strategies with CNCF marketing programs: CNCF Marketing Committee: Engage with your peers and hear first about program updates and marketing opportunities. CNCF Blog: Reach a 45,000+ monthly audience by contributing informative, vendor-neutral content. Kubernetes Blog & KubeWeekly: Content by the community, for the community. Public Relations & Analyst Relations Support: CNCF provides industry analyst reports including Top Analysts by keyword, quotes, and research highlights. KubeCon + CloudNativeCon: Take advantage of exclusive member-only opportunities at the world’s largest open source developer conferences focused on cloud native technologies, from keynotes to media engagement. Showcase thought leadership for key technology trends Learn More Showcase thought leadershipacross key technology trends Engage with our project’s ecosystems, network with fellow members, and help shape the cloud-native market though: Certified Kubernetes: Certification is free for members, allows the use of trademarked “Kubernetes” in your product name, and ensures that your version of Kubernetes supports the required APIs. Kubernetes Certified Service Provider (KCSP): Highlight your organisation as a pre-qualified and vetted service provider with deep experience helping enterprises successfully adopt Kubernetes. Kubernetes Training Partner (KTP): Join the KTP program, featuring training providers with deep experience in cloud native technology training. TOC Contributor: Have the opportunity to sit on CNCF’s Technical Oversight Committee (TOC), to provides technical leadership to the cloud native community. Interactive Landscape Placement: Secure your spot on this comprehensive view of all the cloud native products and projects available in the ecosystem, which had 5.9M pageviews in 2020 alone. Governing Board Participation: Vote in elections to serve on the Governing Board, and oversee the vision of CNCF, working with the TOC. Market Research: CNCF provides independent market research so members can keep their pulse on the open source ecosystem and where technology trends are heading. Engage with the cloud native community Learn More Engage with the cloud native community Connect with the foundation of doers to attract high calibre engineering talent and change the future of cloud native: End User Case Studies: Elevate technical conversations to business objectives and challenges, and showcase your journey on the CNCF homepage. Ambassador Program: Become a cloud native advocate, recognized for your expertise in the cloud native space. Kubernetes.io Partner Placement: Drive leads with inclusion on separate lists for Certified Kubernetes, KCSP, and KTP partners. One CNCF member reports 18% of incoming leads start from kubernetes.io or cncf.io. Kubernetes Community Days: Run a local event to bring together the cloud native community in your region. CNCF provides the platform, guidelines, and tooling to help make your event a success. Linux Foundation Membership: When you join CNCF, you also join the LF, so you can engage with the larger open source community, including representatives from more than 1,000 of the world's top technology companies. MEMBERSHIPS TO SUIT YOUR ORGANIZATION Academic / Nonprofit Limited to academic and nonprofit institutions. Private member and marketing mailing lists Private monthly calls to meet other cloud native marketing experts Receive discounts on KubeCon + CloudNativeCon sponsorship Display CNCF membership logos on your website. Logo also displayed on the CNCF website and in marketing materials. Interactive landscape placement as a member Apply to be a certified vendor, consulting partner, or training partner via our Certified Kubernetes, Kubernetes Certified Service Provider, and Kubernetes Training Partner programs. Announcement in the quarterly CNCF New Member press release Includes LF Associate Membership Programs for deterring patent trolls (see NPE Deterrence for CNCF Members) $1,000 / $500 annually Silver Everything included in nonprofit / academic, plus: Run for Governing Board 2 online programs a quarter to build thought leadership (on-demand, YouTube, live streams) Submit vendor neutral content to CNCF blog, Kubernetes.io blog, & KubeWeekly Receive access to industry analyst reports including Top Analysts by keyword, quotes, and research highlights Submit announcements to KubeCon + CloudNativeCon news packages Support End User Driven open source with end user case studies and referral benefits Host a local Kubernetes Community Day Access to the TODO Group to meet other open source organizations Ten coupon codes good for any eLearning, certification exam, or eLearning/exam bundle. Additional terms apply. (Part of LF membership) Additional programs for deterring patent trolls (see NPE Deterrence for CNCF Members) See Silver Pricing Scale Requires Linux Foundation Silver Membership (CNCF and LF memberships are invoiced separately) Gold Everything included in Silver, plus: KubeCon keynote mention upon joining Personalized press release upon joining Quarterly executive engagement with CNCF leadership team A total of 4 online programs a quarter (on-demand, YouTube, live streams) to build thought leadership Increased access to Linux Foundation’s invitation-only Linux Foundation Member Summit 50-seat annual Linux Foundation Training subscription OR 10 Linux Foundation Training coupons. Additional terms apply. (Cannot be combined with any other membership training benefits.) Additional programs for deterring patent trolls (see NPE Deterrence for CNCF Members) $100,000+ LF Membership Requires Linux Foundation Silver Membership (CNCF and LF memberships are invoiced separately) Platinum Everything included in Gold, plus: Board seat on CNCF Governing Board Exec invite to join a KubeCon keynote upon joining Personalized executive engagement from CNCF and LF leadership teams: - Open source strategy e.g. donating a project, running an open source program office Exclusive live webinars with CNCF online programs Additional programs for deterring patent trolls (see NPE Deterrence for CNCF Members) $350,000 + LF Membership Minimum 3-year commitment Requires Linux Foundation Silver Membership (CNCF and LF memberships are invoiced separately) Requires Linux Foundation Silver Membership (CNCF and LF memberships are invoiced separately) Silver Member Pricing Scale The Linux Foundation membership is required to participate in CNCF. (CNCF and LF memberships are invoiced separately) Silver Member Pricing Scale Consolidated employees CNCF membership (LF Membership Required) CNCF + LF combined membership 5,000 employees + $50,000 $70,000 3,000 – 4,999 employees $50,000 $65,000 1,000 – 2,999 employees $30,000 $45,000 500 – 999 employees $10,000 $25,000 100 – 499 employees $5,000 $15,000 50 – 99 employees $5,000 $10,000 Under 50 employees $2,000 $7,000 Latest news & insights All news Alibaba, Datadog, and Quesma Join Forces on Go Compile-Time Instrumentation February 27, 2025 Kubescape becomes a CNCF incubating project February 26, 2025 Kubestronaut in Orbit: Samah Eddaoudi February 26, 2025 Live streams see all Mastering event sourcing February 27, 2025 Cloud Native Live: Building a ClickHouse cluster on Raspberry Pis February 27, 2025 Join The success of CNCF is due to the contributions and support of the developer community and member companies. Join your industry peers in helping build and shape the cloud native ecosystem, its use cases, and applications. Become a Member Questions about CNCF? Looking for a helpful presentation you can use to build support for joining CNCF?View the overview deck.For everything else, your CNCF Membership team is here to help: Meet the team Priyanka Sharma (She/Her;They/Them) General Manager Priyanka Sharma (She/Her;They/Them) General Manager Priyanka is the Executive Director of the Cloud Native Computing Foundation (CNCF) which serves as the vendor-neutral home for 100+ of the fastest-growing open source projects, including Kubernetes, Prometheus, and Envoy. She is also a co-creator of the Inclusive Naming Initiative whose mission is to promote and facilitate replacing harmful and exclusionary language in information technology. She was a founding team member of the OpenTracing standard and has contributed to other open source projects such as Jaeger, Vitess, and GitLab. Priyanka is a long time champion of and advisor to startups in cutting-edge technology spaces and serves as an Advisor at HeavyBit Industries, an accelerator and fund for developer and enterprise companies. Chris Aniszczyk (He/Him;They/Them) CTO Chris Aniszczyk (He/Him;They/Them) CTO Chris brings more than 15 years experience as The Linux Foundation’s vice president of Developer Programs. His work is focused on working with developer community to advance open source projects at scale. Previously Chris served as Twitter’s head of open source, where he led a team of developer advocates and was responsible for Twitter’s open source engineering, strategy and culture. He has also contributed to Gentoo Linux and served on the Eclipse Foundation’s Board of Directors and the Java Community Process Executive Committee. An engineer by trade, Chris brings a passion for both open source and community development to the organization. David Palilonis (He/Him) Inside Sales Manager David Palilonis (He/Him) Inside Sales Manager David is an Inside Sales Manager at The Linux Foundation, where he leads a team of sales representatives who promote The Linux Foundation and its Cloud Native Computing Foundation (CNCF). He is a United States Navy veteran with 20 years of experience in Operations Management and Process Improvement. He has a Bachelor of Science degree from Cornell University and a Master of Arts degree from the Naval War College. He is passionate about tech sales and the role open source plays in cybersecurity, cloud native, and mobile technologies. Jake Pineda (He/Him) Membership Solutions Representative Jake Pineda (He/Him) Membership Solutions Representative Jake is an Membership Sales Representative at The Linux Foundation, working with the Cloud Native Computing Foundation. He brings experience in technology sales and cloud solutions, with an academic background that includes an Associate degree in Computer Science – Network Technology from Lehigh Carbon Community College, and ongoing studies for a Bachelor’s in Information Technology at Western Governors University. Jake is dedicated to enhancing open-source software solutions in cloud native computing and network security. Get in touch"
year_published = 2024
