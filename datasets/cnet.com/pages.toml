title = "About CNET: Who We Are & How We Help You"
description = """
CNET is a trusted digital media publication that provides expert information, reviews and analysis on consumer technologies, services and trends, to help you find exactly what you are looking for. For nearly 30 years, CNET has covered a wide range of topics, including consumer electronics, smart home, money, wellness and more. 

CNET’s team of editors, reporters and content creators offer expert product reviews, how-to guides, videos and news articles that help consumers make informed decisions about technology-related purchases and stay up-to-date with the latest industry developments."""
full_description = '''About CNET Who We AreOur StandardsOur StoryOur ReachContact UsIn the NewsInside CNET In an ever-changing, tech-driven world, CNET explains, demystifies and guides everyone to improve their lives. CNET is a trusted digital media publication that provides expert information, reviews and analysis on consumer technologies, services and trends, to help you find exactly what you are looking for. For nearly 30 years, CNET has covered a wide range of topics, including consumer electronics, smart home, money, wellness and more. CNET’s team of editors, reporters and content creators offer expert product reviews, how-to guides, videos and news articles that help consumers make informed decisions about technology-related purchases and stay up-to-date with the latest industry developments. Editorial Standards CNET's Editorial Commitment to Reliable Reporting and Unbiased Product Reviews Meet our experts Editorial Standards We promise to get you the information you need when you need it, to make our opinions fair and useful, and to make sure our facts are accurate. View Guidelines How we Use AI at CNET With proper guardrails, new tools can assist us in producing expert, unique and helpful advice. Our Policy Editors' Choice The CNET Editors' Choice distinction represents the strongest recommendation of a product or service evaluated by CNET's experts. See the Latest CNET Labs CNET Leads the Industry with hands-on expertise, testing over 1,000 products annually and exceeding 10,000 hours of testing. How We Test 30 Years of Expert Advice: Tracing Our Brand's Legacy 1995 Trailblazers of Tech CNET pioneers online presence during the dot-com boom, shaping early tech advice and industry storytelling.Early 2000’s Surviving the Dot-Com Crash Navigating the turbulent era post-Y2K, CNET witnesses the bursting of the dot-com bubble and the industry's resilience. 2007 Iphone Ignites Innovation With smartphones revolutionizing the way consumers connect and communicate, CNET keeps consumers well informed with news, reviews and advice. 2013 CNET Labs Unveiled Launching our first product testing hub in Louisville, Kentucky, CNET establishes cutting-edge evaluation methods for consumer products.February 2024 The AI Revolution The rise of generative artificial intelligence is this generation’s “iPhone moment." CNET meets this unique moment with expert guides like AI Atlas. Engage with CNET's Active Community Access Our Media Kit #2 #4 #6 #8 #10 #1 In Tech Media 0 3 6 9 12 18M Social Followers 0 3 6 9 12 73M Monthly US Page Views 0 50 100 150 200 28M Average Monthly Visitors [1] Comscore US Multiplatform, 2015-2024. [2] CNET internal social platform data 2024 (Instagram, TikTok, YouTube, X, Facebook, LinkedIn) [3] CNET internal data, 2024. [4] Comscore US Multiplatform, January 2024. Let's Talk. Careers We’re a collective of curious experts who want to inspire the world. Join us!Affiliate Partners Interested in building an affiliate partnership? Contact us to get started.Licensing Contact us to license our CNET logos or content in your advertising and product packaging.Marketers Our proprietary products and capabilities are driven by data and a passion for performance. Contact us for more info, and access our media kit.Brand Resources You can download our logo from this link. See here for guidance on logo usage.Corrections CNET makes every effort to ensure our content is accurate. If we make a factual error, we correct it and note the error at the bottom of the story. We encourage you to contact us if you see a mistake. In The News See All Press Artificial intelligence and new technology featured at CES 2024 in Las Vegas 04:56 · 01/09/2024 Apple's new headset just dropped: Will you pay $3,500? 05:10 · 02/02/2024 Nick Wolny on GMA: Best Presidents Day deals to shop 02:37 · 02/19/2024 Need a CNET expert? Reach out to our press team Our team of experts can provide commentary and advice on everything from tech news to the intersection of tech and finance, home, wellness, energy, sleep, and more. For more information, contact us: press@cnet.com Awards Inside CNET'''
