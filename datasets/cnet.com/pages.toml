title = "This 'Jurassic World' Robotic Baby T. Rex Hatches From Gooey Eggs in Hopes of Becoming a Hot Toy - CNET"
description = '''"Push! Push!" Spin Master's Primal Hatch aims to excite Jurassic Park fans with its new evolution in the Hatchimals toy line.'''
full_description = '''Culture Entertainment This 'Jurassic World' Robotic Baby T. Rex Hatches From Gooey Eggs in Hopes of Becoming a Hot Toy "Push! Push!" Spin Master's Primal Hatch aims to excite Jurassic Park fans with its new evolution in the Hatchimals toy line. Bridget Carey Editor at Large Bridget Carey is an award-winning reporter who helps you level-up your life -- while having a good time geeking out. Her exclusive CNET videos get you behind the scenes as she covers new trends, experiences and quirky gadgets. Her weekly video show, "One More Thing," explores what's new in the world of Apple and what's to come. She started as a reporter at The Miami Herald with syndicated newspaper columns for product reviews and social media advice. Now she's a mom who also stays on top of toy industry trends and robots. (Kids love robots.) Expertise Consumer technology | Apple | Google | Samsung | Microsoft | Amazon | Meta | Social media | Mobile | Robots | Future tech | Immersive technology | Toys | Culture Credentials Bridget has spent over 18 years as a consumer tech reporter, hosting daily tech news shows and writing syndicated newspaper columns. She's often a guest on national radio and television stations, including ABC, CBS, CNBC and NBC. See full bio Bridget Carey Feb. 28, 2025 6:00 a.m. PT 2 min read Spin Master's Primal Hatch is a T. rex toy that breaks free from a slimy shell, ready to terrorize your sister's Hatchimal. Spin Master After 32 years of Jurassic Park toys, one company has finally cracked the code on cracking eggs -- bringing an iconic movie scene to life with a robotic baby dinosaur that emerges from a gooey egg.Spin Master's Primal Hatch, going on sale this fall for $59.99, is a T. rex toy programmed to use its snout to break out of a shell with a slimy red membrane. It resembles the moment from the 1993 Jurassic Park movie when the character John Hammond encourages a baby velociraptor to push its way out of its egg in the incubator room. Watch this: Hatch a Jurassic World T-Rex With Spin Master's Primal Hatch First Look 00:30 "We tried to make it as cinematic as we could," said Jamie Ricottone, one of the toy's designers at Spin Master, who gave me an early preview of the T. rex in a video call. The Primal Hatch toy will be emerging to the public for the first time this weekend, roaring for crowds at the New York Toy Fair.Spin Master has experience with hatching hit toys. It created Hatchimals in 2016, which became one of the hottest Christmas toys -- a phenomena on par with Tickle Me Elmo and Furby. Hatchimals are robotic, fuzzy fantasy creatures that break out of egg shells when first unboxed. The Primal Hatch takes the same concept but ties it to Universal's Jurassic World franchise -- with added slime, teeth and movie-accurate growls to appeal to boys ages 5 to 7.The toy comes with nest material to hold the egg in place, and as the hatching process begins, kids tap the shell to encourage the T. rex to emerge. The sticky slime membrane on the inside of the shell delays the eerie reveal. Spin MasterAfter discarding the slimy shell pieces, the next stage determines if the T. rex will be friendly or fierce. Personality is shaped in how you interact with the touch and sound sensors. There is a clicker accessory to get reactions from the T. rex -- but don't expect a well-behaved dino. After all, you're not quite on the level of Jurassic World's velociraptor trainer Owen Grady (played by Chris Pratt) when it comes to training dinosaurs. Ricottone said his team learned from working in partnership with Universal that "they are dinos, not pets -- you can't train them what to do."The T. rex has glowing eyes that change color to indicate its mood. Red means angry, yellow means it's neutral and green is a good boy. Feed it enough steak and you might get a happy dino. If you agitate it enough, the creature could go totally berserk. They imprint on the first creature they come in contact with. Spin MasterPrimal Hatch includes game modes and over 100 sounds and interactions; Jurassic fans should recognize the sound effects from the movies. The more you play with it, the more it matures -- and eventually may grow enough to let out that iconic Jurassic Park T. rex roar.The toy is expected to ride a wave of dinosaur fervor as Jurassic World: Rebirth debuts July 2 in theaters. The plot involves a character capturing DNA from dino eggs. With Spin Master's egg, the batteries are included -- actual dino DNA is not.'''
