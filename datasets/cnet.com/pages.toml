title = "The 16 Best Mattresses To Buy According to Our Experts - CNET"
description = "After putting many beds to the test, our sleep experts found the 17 best ones for your body and your budget."
full_description = "Jump to Section... Our Best Mattress Picks for Quality Sleep in 2025 Wellness Sleep Article updated on February 6, 2025 at 11:20 AM PST Our Best Mattress Picks for Quality Sleep in 2025 After putting many beds to the test, our sleep experts found the 17 best ones for your body and your budget. When you think of a good night's sleep you probably think about wrapping yourself into the cozy sheets and laying your head on fluffy pillows. To truly sink into a good night's sleep, you also need a quality mattress that suits your sleep style. If you're on the hunt for a mattress that gives you the full experience, you're in luck. We've tested many mattresses to find the best ones for a variety of needs. To help you narrow down your online options, I used my knowledge as a certified sleep scientist -- and daily sleeper -- to pick out the best mattresses to consider. If you’re a side sleeper, choosing for a couple, tend to sleep hot or experience back pain (among other factors), I consulted our nine mattress experts to highlight our favorite options for you. Read more: Guide to Mattress Types: Materials and What to ConsiderUltimately, only you can decide which mattress surface you want to spend roughly a third of your life on. Spend some time with this list to get an idea of the standout mattresses that could cradle you to better sleep and health. Our Picks How we sort our mattresses How it works To ensure we give you the best search experience, our selection of mattresses can be sorted in 4 different ways: • Recommended • Highest price: $$$ - $ • Lowest price: $ - $$$ • Branded: Alphabetical Sort by Filter by Firmness Firmness Select all Soft (1-4) Only Medium (5-8) Only Firm (9-10) Only Clear Sleep style Sleep style Select all Back Only Combination Only Side Only Stomach Only Clear Mattress type Mattress type Select all Hybrid Only Memory foam Only Air mattress Only Clear Best mattress overall Brooklyn Bedding Signature Hybrid Mattress View details $1,332 at Brooklyn Bedding View details Premium comfort and durability Sponsored - Sleepy’s by Sealy Spring Firm Mattress View details $1000 at Mattress Firm View details Best firm mattress Saatva Classic Mattress View details $2,099 at Saatva View details Best memory foam mattress Nectar Premier Mattress View details $2,286 $949 at Nectar View details Best mattress for heavy people Big Fig Mattress View details $1,899 at Big Fig View details Best value mattress Allswell Mattress View details $284 at Walmart View details Best cooling mattress for hot sleepers Brooklyn Bedding Aurora Luxe Mattress View details $2,265 at Brooklyn Bedding View details Best mattress for back pain Saatva Rx View details $3,399 at Saatva View details Best mattress for side sleepers Layla Hybrid Mattress View details $1,699 at Layla View details Best hybrid mattress Purple Restore mattress View details $2,399 at Purple View details Best all-foam mattress Bear Original Mattress View details $998 at Bear View details Best mattress for pressure relief Helix Sunset Luxe Mattress View details $2,374 at Helix View details Best mattress for stomach sleepers WinkBed Mattress View details $1,799 $1,499 at WinkBed View details Best mattress for back sleepers Plank Firm Luxe Mattress View details $1,532 at Plank View details Best organic mattress Avocado Green Mattress View details $1,999 at Avocado View details Best mattress for couples Sparrow Signature Hybrid Mattress View details $2,132 at Nest Bedding View details Best mattress under $500 Dreamfoam Doze Mattress View details Up to 50% off $275 at Dreamfoam View details Show 12 more What's the best mattress overall?While testing mattresses for this list, our mattress team found that the Brooklyn Bedding Signature Hybrid is the best overall mattress you can buy. It has three firmness options -- so it's great for people who prefer a firm mattress or a softer mattress -- and a durable hybrid construction, meaning anyone can sleep on this bed. Jon Gomez/CNETThis bed is already priced well for the quality you get, but to make it even sweeter, Brooklyn Bedding offers generous sales that can knock a couple of hundred dollars off the retail price.Read more: How to Break in a New Mattress: What to Do and How Long It TakesBest mattresses of 2025 Compare Hide our expert take Dillon Lopez/CNET Photo Gallery 1/8 Dillon Lopez/CNET $1,332 at Brooklyn Bedding Pros Three firmness options mean any sleeper type will be comfortable Neutral foam feel Affordable for the quality Cons Firmest option still isn’t truly firm Still might be out of the price range for some Type Hybrid mattressFirmness 3 firmness levels | Soft: Medium-soft to soft or 2 | Medium: Medium to medium-soft or 4 | Firm: Medium-firm or 7Trial 120 nights Warranty 10-year limited warranty Full Review Brooklyn Bedding Signature Hybrid Review Photo Gallery 1/8 Dillon Lopez/CNET Best mattress overall Brooklyn Bedding Signature Hybrid Mattress 8 Dillon Lopez/CNET Photo Gallery 1/8 Dillon Lopez/CNET $1,332 at Brooklyn Bedding Why we picked the Brooklyn Bedding Signature: The Brooklyn Bedding Signature Hybrid mattress is one of the best quality beds you can get for the money. “When my sister asked me what my recommendation was for a comfortable and affordable hybrid bed, the Brooklyn Bedding Signature was my immediate choice. She and her dogs have slept on it comfortably for years, and she was able to save even more thanks to Brooklyn Bedding’s 30% military discount,” says Owen Poole, CNET senior video producer.How it sleeps: While it doesn’t have all the bells and whistles like zoned support or foam-tipped coils, the Brooklyn Bedding Signature mattress is one of our favorite mattresses to recommend to people. Why? Besides the solid construction, it’s an incredibly accommodating bed. It’s available in three firmness levels: Soft (medium-soft or 3), Medium (medium or 5) and Firm (medium-firm or 7).The flagship Brooklyn Bedding mattress is 12.25 inches tall and has a neutral foam feel that the average person likes. You get the pressure relief benefits of the foam without the polarizing feeling of memory foam. Mattress construction: Brooklyn Bedding signature is a hybrid mattress with a thick system of eight-inch pocketed coils reinforced around the edge for increased edge support. Then two layers of foam provide plenty of pressure relief while molding to your body without sucking you in like some dense foams do. An airy topper offers a softness that memory foam just can’t achieve. Brooklyn Bedding is for you if: You want a straight-to-the-point hybrid mattress that’s comfortable, durable and well-priced. Brooklyn Bedding is not for you if: You’re looking for a bed with fancy features like dual-coil layers or zoned support. CNET Score Breakdown 8 /10 SCORE Performance 8 Policies 7 Durability 8 Features 9 Also nominated in: Best Hybrid Mattress, Best Mattress for Heavy People Hide our expert take Show our expert take Photo Gallery 1/1 $1000 at Mattress Firm Sponsored Premium comfort and durability Sleepy’s by Sealy Spring Firm Mattress Photo Gallery 1/1 $1000 at Mattress Firm Exclusive Micro-Lift technology resists body impressions, alleviating pressure points and providing enhanced support while extending your mattress's durability and comfort life. Plus, the mattress conforms to your body to help maintain proper spinal alignment for all-night comfort. You’ll experience premium zzz’s for a price you’ll love -- at an incredible value. Show more Compare Show our expert take Dillon Lopez/CNET Photo Gallery 1/8 Dillon Lopez/CNET $2,099 at Saatva Pricing based on Queen model Pros Dual-coil design makes it extra durable Free white glove delivery Three firmness options available Comfy pillow top Cons Expensive Some soft sleepers might want a softer bed $99 fee if you want to return it Type HybridFirmness 3 firmness levels | Plush Soft: Medium or 5 | Luxury Firm: Medium-firm or 7 | Firm: Firm or 9/10 Trial 365 nightsWarranty Lifetime Full Review Saatva Classic Review Photo Gallery 1/8 Dillon Lopez/CNET Best firm mattress Saatva Classic Mattress 9.3 Dillon Lopez/CNET Photo Gallery 1/8 Dillon Lopez/CNET $2,099 at Saatva Pricing based on Queen model Why we picked the Saatva Classic: You get both plush comfort and superior support with the Saatva Classic. It’s a true luxury mattress with a hefty construction. “My dad lives in a rural location and he’s getting older. He’s not the best candidate for solo unboxing of a new king-size mattress. That’s why I chose to get him a brand-new Saatva Classic for his birthday. The bed was white glove delivered right to his door: a team of professionals set it up for him and even hauled away his old bed. He’s been sleeping like a baby ever since,” says CNET Senior Video Producer JD Christison.How it sleeps: The Saatva Classic has all the essential parts that make up a classic mattress that everyone can recognize and love: a bouncy feel, an innerspring system and a comfy pillow top. They’re so much more going on with this bed than anything you’ve probably slept on. It has a classic pillow-top feel that’s responsive and easy to move around, even with the layers of memory foam underneath. You choose from three firmness options: Plush soft (medium or 5), Luxury firm (medium-firm or 7) and Firm (firm or 9). The firmest model is why it wins as the best firm mattress. Mattress construction: The construction of the 11.5-inch Saatva Classic makes it stand out. It has a dual-coil design that starts with a base layer of tempered steel coils, then comes the second layer of pocketed coils that are firmer in the center third of the bed. Saatva is for you if: You want a traditional pillow-top mattress that’s ultra supportive and you’re willing to pay for it.Saatva is not for you if: You’re on a tight budget or are under 150 pounds. Petite body types may not need the hefty construction. CNET Score Breakdown 9.3 /10 SCORE Performance 9 Policies 8.5 Durability 9.5 Features 10 Also nominated in: Best Mattress for Back Pain, Best Mattress for Stomach Sleepers Show our expert take Compare Show our expert take Dillon Payne/CNET Photo Gallery 1/8 Dillon Payne/CNET $2,286$949 at Nectar Pros Responsive memory foam feel Available in an all-foam or hybrid construction Affordable, especially with sales Temperature neutral Cons All-foam construction probably isn’t supportive enough for people over 230 pounds Too soft for some back and stomach sleepers Type Memory foam Firmness 5 or Medium Trial 365 nightsWarranty Forever warranty Full Review Nectar Premier Review Photo Gallery 1/8 Dillon Payne/CNET Best memory foam mattress Nectar Premier Mattress 7.9 Dillon Payne/CNET Photo Gallery 1/8 Dillon Payne/CNET $949 at Nectar Why we chose the Nectar Premier: Memory foam lovers and critics alike will love the all-foam 14-inch Nectar Premier for its comfort and affordable price tag. How it sleeps: The all-foam Nectar Premier is a memory foam mattress that hugs your curves as you sink into it. It reminds me of a watered-down Tempur-Pedic, though we’d classify it as a responsive memory foam feel because it’s easier to move around on than the Nectar Original. It hits a sweet spot of satisfying both memory foam lovers and those (like me) who don’t prefer it. We also found it to be around a medium firmness, which means that any sleeping position can enjoy it. The Nectar Premier is the softest mattress Nectar offers. Mattress construction: The Nectar Premier is available in an all-foam or hybrid construction. The all-foam is a simple three-layer construction: a support foam, a transition layer and a gel memory foam comfort layer. It’s not a truly cooling bed, but some cooling additions to this bed keep it from trapping heat, like the top layer of therapeutic gel memory foam with ActiveCool and a textured cover.The Nectar Premier gives you memory foam without it being off-putting to people who don’t like how sinking and dense true memory foam can be. It’s all-around comfortable and widely accommodating. Nectar is for you if: You want a memory foam mattress that’s both pressure-relieving and responsive without sucking you into the foam layers.Nectar is not for you if: You want a firm memory foam mattress. CNET Score Breakdown 7.9 /10 SCORE Performance 9 Policies 8.5 Durability 7 Features 7 Also nominated in: Best Mattress in a Box, Best Mattress for Stomach Sleepers Show our expert take Compare Show our expert take Dillon Lopez/CNET Photo Gallery 1/8 Dillon Lopez/CNET $1,899 at Big Fig Pros Thick, hybrid construction Phase-changing cover Responsive feel Cons Firmer than some wants Not a budget choice Type HybridFirmness 8 or medium-firm to firmTrial 120 nightsWarranty 20-year warranty Full Review Big Fig Review Photo Gallery 1/8 Dillon Lopez/CNET Best mattress for heavy people Big Fig Mattress 8.5 Dillon Lopez/CNET Photo Gallery 1/8 Dillon Lopez/CNET $1,899 at Big Fig Why we chose the Big Fig mattress: Big Fig is an ultra supportive mattress designed for heavier people. This bed has advanced support you can’t get from just any bed. How it sleeps: The Big Fig mattress offers a responsive, firm foam feel. It won’t have the sinking feel of memory foam. This is a firm mattress, though it might feel a little softer depending on how much you weigh. The average person will find it around a medium-firm to firm bed, though someone over 300 pounds might think it’s more like a medium. We’d recommend it for stomach, back and combination sleepers. Mattress construction: The 13-inch construction is where the Big Fig mattress really shines. It has ultradurable pocketed coils encased in a foam border for edge support, then three layers of high-density poly foam. A gel-infused latex foam layer is the comfort layer below the quilted cover.Big Fig is for you if: You’re a heavy person who wants a firmer mattress that’s extremely supportive.Big Fig is not for you if: You’re petite or a side sleeper who doesn’t like firm beds. CNET Score Breakdown 8.5 /10 SCORE P