full_description = '''Katelyn Chedraoui Katelyn writes about social media and online services, with an eye for how AI can work for you. Imad Khan Imad covers Google and all its AI products, as well as those from Microsoft, OpenAI and more. Patrick Holland An expert in mobile tech, Patrick has the lowdown on how AI is showing up in the phones in your pocket. ai atlas Your guide to today's artificial intelligence ChatGPT was only the beginning. Generative AI is popping up everywhere: at work, at home, on the go. How do you sort it all out? You start right here. AI Reviews Videos AI Tips More News latest How AI Can Help You Plan the Perfect Date Night 16 hours ago Microsoft's Magma AI Can Help Robots See and Understand 1 day ago US Workers Have Doubts About AI in the Workplace, Survey Finds 1 day ago How to Get Rid of Gemini in Gmail 1 day ago How to Use Grammarly AI for Your Editing 1 day ago These 6 Apple Intelligence Features Elevate the iPhone 16E 1 day ago OpenAI Says Its New ChatGPT 4.5 Has Better Emotional Intelligence 2 days ago Viral Trump Gaza Video Shows How Quickly AI Slop Can Spread 2 days ago How to Use AI to Find a Constellation 2 days ago I Tried AI to Help Me Tackle an $18K Debt, but It Went Comically Wrong 2 days ago AI Has Started Searching Through Your Smart Home Videos: Should You Worry? 2 days ago Is Apple Intelligence Getting in Your Face? Here's How to Turn It Off 2 days ago iPhone 16E Review: For $599, It's Good but Also Kind of Odd 3 days ago Apple Says It's Fixing Transcription Glitch That Transcribes 'Racist' as 'Trump' 3 days ago OpenAI Rolls Out Deep Research Access to More ChatGPT Users 3 days ago Reviews Galaxy S25 and S25 Plus Review: AI That's Enjoyable Without Being Overwhelming By Abrar Al-Heeti Google Gemini Advanced Review: Don't Cancel Your ChatGPT Plus Subscription By Imad Khan Midjourney Review: Vibrant, Occasionally Wonky AI Images for Discord Users By Katelyn Chedraoui ChatGPT 4 Review: A Smarter AI Chatbot, but It'll Cost You By Imad Khan Claude AI Review: The Most Conversational AI Engine By Imad Khan Apple Intelligence Early Review: Don't Expect Your iPhone to Feel Radically Different By Lisa Eadicicco OpenAI Dall-E 3 Review: Generative AI for Fanciful, Fun Illustrations By Stephen Shankland Perplexity AI Review: Imagine ChatGPT With an Internet Connection By Imad Khan latest videos Apple Vision Pro Gets Apple Intelligence and an iPhone App at Last Feb 21, 2025 • Tech Apple Vision Pro Gets Apple Intelligence and an iPhone App at Last 04:16 • Now Playing Review: My Thoughts After 2 Weeks With Samsung's Galaxy S25 Ultra 07:00 • 2 weeks ago Galaxy S25 and S25 Plus Review: AI Finally Makes Itself Useful (Mostly) 07:59 • 3 weeks ago What Is DeepSeek AI? Everything to Know About the Popular New AI 01:25 • 4 weeks ago Samsung Galaxy S25 Ultra Hands-On: A Bigger Screen and More AI 07:31 • 1 month ago Watch Unitree's G1 Humanoid Robot Run in New Video 04:00 • 3 weeks ago Making Robots Look and Feel More Human 03:25 • 1 month ago These New Smart Glasses Want to Be Your Next AI Companion 02:31 • 1 month ago TCL Ai Mi Companion Bot Is Just a Baby That Follows You Around 03:15 • 1 month ago Here's How to Get Started With OpenAI's Sora AI Video Generator 11:59 • 2 months ago Smart Home CNET Survey: 73% of Users Have AI Privacy Concerns As Amazon reinvents Alexa, it remains the most trusted smart home assistant -- but our exclusive CNET survey shows trust and cost remain key concerns. By Tyler Lacoma ai atlas must-readstay in the loop CNET's weekly recap highlights 5-ish things you should know about AI. Subscribe now to also receive "The Art of the Prompt," our complete guide to getting effective answers from AI tools. By signing up, you confirm you are 16+, will receive newsletters and promotional content and agree to our Terms of Use and acknowledge the data practices in our Privacy Policy. You may unsubscribe at any time. meet connie Connie Guglielmo is CNET's head of AI editorial strategy. She puts the spotlight on the latest and most important developments in artificial intelligence. Full bio your trusted source on ai CNET has been covering AI for more than two decades. Now we're bringing you a new wave of expert, unique and helpful insights, through in-depth explainers, hands-on product reviews, how-to posts and more, to help you see how AI fits into your life. How to Use ChatGPT: A Beginner's Guide By Amanda Smith Take Back Your iPhone Storage by Turning Off Apple Intelligence. Here's How By Jeff Carlson How to Detect AI Writing By Rachel Kane AI Scammers Are Creating More Believable Schemes. Here's How to Stay Safe By Neal O'Farrell How to Use Spotify's AI DJ By Rachel Kane How to Create AI Images: A Complete Guide With Expert Advice By Katelyn Chedraoui Meal Planning With ChatGPT Saved Me Money and Time By Corin Cesaric How to Use AI to Make a Work Presentation By Carly Quellman glossary glossary hallucination large language model machine learning multimodal prompt hallucination An incorrect or made-up response from generative AI but stated confidently as fact. See full glossary faqs faqs What is Apple Intelligence? Apple Intelligence is the name Apple has given to the generative AI tools it's introducing into certain iPhones, iPads and Macs: the iPhone 16 line, iPhone 15 Pro models, and Macs and iPads with M-series chips. The first, modest set of features arrived in October 2024 as part of iOS 18.1, iPadOS 18.1 and MacOS Sequoia 15.1, and included some writing tools, a Clean Up tool for photos and an upgrade to Siri. Later in the year, iOS 18.2 brought more AI features, including Genmoji, Visual Intelligence and ChatGPT integration for Siri. Learn more What is GPT-4o and how does it relate to ChatGPT? GPT-4o (the o is for "omni") is the May 2024 update from OpenAI to the AI engine that powers ChatGPT, and it's two times faster than GPT-4 Turbo, which debuted in late 2023. Your prompts can include any combination of text, audio, images and video, and the responses generated will be able to include similar combinations. According to OpenAI, GPT-4o brings "GPT-4-level intelligence to everything" including the free version of ChatGPT, though paying customers will get five times the capacity. New real-time speech functionality means you can interact with ChatGPT in a more conversational way. Learn more What are AI tokens and how do they work? Tokens are pieces of words that an LLM evaluates to understand the broader context of a query. Each token is made up of roughly four characters in English. They can be letters, numbers, spaces, special characters and more. For example, the sentence "You miss 100% of the shots you don't take" consists of 11 tokens. (If you swap out the percentage symbol for the word "percent," the count increases to 13 tokens.) Tokens are used both as inputs and outputs. When you input a query into an AI model, the model breaks down the words into tokens, analyzes them and delivers a response in tokens that are then converted into words you'll understand. Learn more What is an AI hallucination? A generative AI model "hallucinates" when it delivers false or misleading information. This happens because of how the models are trained, on massive amounts of data, like articles, books, code and social media posts. In creating its response to a prompt, the AI makes inferences about what words should come next, but it lacks contextual information so it may generate wording that seems plausible but isn't true. Hallucinations can also result from improper training and/or biased or insufficient data, which leave the model unprepared to answer certain questions. Learn more Showing 1 of 4 our ai experts Our writers and editors know the subject cold. Here are CNET's leading authorities on AI. Katelyn Chedraoui Katelyn writes about social media and online services, with an eye for how AI can work for you. Imad Khan Imad covers Google and all its AI products, as well as those from Microsoft, OpenAI and more. Pa