full_description = "The Coca‑Cola Company has been refreshing the world and making a difference for over 138 years. Explore our Purpose & Vision, History and more. We've established a portfolio of drinks that are best positioned to grow in an ever-changing marketplace. From trademark Coca‑Cola to Sports, Juice & Dairy Drinks, Alcohol Ready-to-Drink Beverages and more, discover some of our most popular brands in North America and from around the world. Our purpose is to refresh the world and make a difference. See how our company and system employees make this possible every day and learn more about our areas of focus in sustainability. We aim to improve people's lives, from our employees to those who touch our business to the many communities we call home. We believe working at The Coca‑Cola Company is an opportunity to build a meaningful career while helping us make a real difference on a global scale. Catch up on the latest Coca‑Cola news from around the globe - from exciting brand innovation to the latest sustainability projects."
