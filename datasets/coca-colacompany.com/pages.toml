full_description = "← Back to The Coca‑Cola System Coca‑Cola FEMSA, S.A.B de C.V Overview: Coca‑Cola FEMSA produces, markets, sells and distributes mainly The Coca‑Cola Company's beverage portfolio. This includes sparkling beverages (colas and flavored sparkling beverages), waters and other non-carbonated beverages (including juice drinks, coffee, teas, milk, value-added dairy, sports drinks, energy drinks, plant-based drinks and certain alcoholic beverages, such as Topo Chico Hard Seltzer). In addition, through certain distribution agreements, we distribute and sell Monster products in all the countries where we operate. Products served: A portfolio of 134 brands to more than 270 million people. # of employees: 80,447 Date established: We commenced operations in 1979, when a subsidiary of FEMSA acquired certain sparkling beverage bottlers in Mexico City and surrounding areas. For more information, visit the Coca‑Cola FEMSA, SAB de CV website or annual report Community Support: Our objective is to grant $170M as microcredits by 2023 through Social and Sustainability Bond. We have completed 53 projects in Coca‑Cola FEMSA's operation areas regarding renewable energy access. More than $400,000 USD invested across six countries in empowerment projects for Mom & Pop retail stores, with more than 12,000 direct beneficiaries. Water access, sanitation, and hygiene (WASH) initiatives for our communities were implemented in 6 countries. 4,136 ML water returned in 5 priority communities. We have placed social and sustainable stock certificates in the Mexican market, divided into sustainability and social projects."
