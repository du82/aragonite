full_description = "Home About Us Our Board of Directors David B. Weinberg - Leadership David B. Weinberg Chairman of the Board and Chief Executive Officer, Judd Enterprises Inc., and Lead Independent Director David B. Weinberg has been a Director of The Coca‑Cola Company since 2015 and Lead Independent Director since July 27, 2024. Mr. Weinberg is Chairman of the Board and Chief Executive Officer of Judd Enterprises, Inc., a private, investment-management office with diverse interests in a variety of asset classes, and President of Digital Bandwidth LLC, its private, early-stage technology investing affiliate, and has held these positions since 1996. From September 1989 to June 1996, Mr. Weinberg was a partner in the corporate, securities and investment-management practice of Mayer, Brown & Platt, a leading international law firm. Mr. Weinberg serves on the Investment Committee of the Board of Trustees of Northwestern University. He is also a member of the Council on Foreign Relations and the International Council of the Belfer Center for Science and International Affairs of the Kennedy School of Government at Harvard University. Download bio ⇩ Download images ⇩ Next Leader"
