title = "Arca Continental"
description = """
138+
years of refreshing the world

The Coca‑Cola Company has been refreshing the world and making a difference for over 138 years. Explore our Purpose & Vision, History and more."""
full_description = "← Back to The Coca‑Cola System Arca Continental, S.A.B de C.V. Overview: Arca Continental is a multinational beverage manufacturing company that is the second-largest Coca‑Cola bottler in Latin America and one of the largest in the world. Today, Arca Continental operates in several countries, including Mexico, the United States, Peru, Ecuador, and Argentina. Its offering is constantly adapted to each country’s preference, allowing for differentiated products in some regions. The company's products are sold in over 25 countries worldwide. Arca Continental continues to grow and expand, with a focus on sustainability and social responsibility. Products served: Arca Continental offers a broad product portfolio, including a wide range of low and non-caloric products that seeks to satisfy consumers’ taste. Coca‑Cola Sin Azúcar has managed to become one of the fastest-growing beverages in the portfolio, offering a non-caloric option that has been well-received by consumers. The company also operates in the snack, candy, and other food industries. # of employees: More than 66,000 employees Date Established: In 1926, Arca Continental, originally known as Vidriera Monterrey, was founded in Monterrey, Mexico. It started as a glass bottle manufacturing company. In the 1930s-40s, the company expanded into the beverage industry, becoming a bottler for Coca‑Cola.For more information, visit the Arca Continental, S.A.B. de C.V website Community Support: The basis of our sustainability vision are our employees. Through their participation in the various institutional initiatives and volunteer activities, where they reaffirm their position as agents of positive change, it is possible to transcend the limits of the organization and maintain a positive relationship with the community. The Volunteering Program that seeks to drive associates into becoming positive agents of change and developing their leadership skills saw over 30 thousand man-hours dedicated to several activities. These included planting 6,500 trees, collecting more than 200 tons of waste, and rehabilitating 60 public spaces. As part of its commitment to circularity, Arca Continental designs recyclable packages and carries out activities where the consumer can learn adequate disposal options available to them so that packages can be retrieved and recycled to make new bottles. 24% of the company‘s total sales in 2022 were made in returnable packaging, providing affordability to the consumer and reducing environmental impact Our Corporate Social Responsibility strategy thrives on focusing on the material issues of the organization through partnerships with companies, governments, and organizations to develop community intervention programs and promote environmental and social development in the following social focus lines of action. Arca Continental seeks to boost the integral development of the communities it serves through its sustainable business model. In 2022, Arca Continental implemented over 120 shared value initiatives in areas where people can make a positive difference, boosting:Positive agents of changeInclusive collectionWater access More than $118 million Mexican pesos were donated to social organizations in 2022"
