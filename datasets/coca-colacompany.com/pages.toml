full_description = "History Since its birth at a soda fountain in downtown Atlanta, Georgia, in 1886, Coca‑Cola has been a catalyst for social interaction and inspired innovation. The Origin of Coca‑Cola On May 8, 1886, Dr. John Pemberton brought his perfected syrup to Jacobs' Pharmacy in downtown Atlanta where the first glass of Coca‑Cola was poured. Serving about nine drinks per day in its first year, Coca‑Cola was an exciting new drink in the beginning. See the story here of how it all began. See the birth of Coca‑Cola Coca‑Cola’s Sustainability History Since 1917, our sustainability efforts have covered a wide range of topics including: water, women empowerment, community well-being, packaging, emissions, human and workplace rights, and agriculture. Coca‑Cola’s Sustainability History Making of ‘Hilltop’ Read the story about one of the most famous commercials that saw Coke not as it was originally designed to be—a liquid refresher—but as a tiny bit of commonality between all peoples, a universally liked formula that would help to keep them company for a few minutes. Learn about the background of “I’d like to buy the world a Coke.” See “I’d Like to Buy the World a Coke” Coca‑Cola’s First Bottle The contour bottle has been celebrated in art, music and advertising. Read the story of the collaboration that began in 1915 and turned into one of the most famous shapes in the world. Explore the History of Coca‑Cola Bottle Related Content Coca‑Cola Collaborates with Tech Partners to Create Bottle Prototype Made from 100% Plant-Based Sources Read More Coca‑Cola Launches ‘Real Magic’ Brand Platform, Including Refreshed Visual Identity and Global Campaign Read More Iteration, for Good: How Project Last Mile is Supporting COVID-19 Vaccine Distribution in Africa and Beyond Read More"
