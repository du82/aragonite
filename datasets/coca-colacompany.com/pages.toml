["https://coca-colacompany.com/media-center/coca-cola-and-the-oreo-brand-are-teaming-up"]
title = "Coca-Cola and the OREO Brand are Teaming Up: ‘Besties’ Around the World Can Savor New Limited-Edition Drink and Cookie"
description = "A pair of limited-time-only products — Coca-Cola® OREO™ Zero Sugar and OREO® Coca-Cola™ Sandwich Cookie — leverage the brands’ signature tastes and iconography to deliver playfully unexpected innovations."
full_description = '{"@context":"https://schema.org/","@type":"Media Center - Article","headline":"","description":"A pair of limited-time-only products — Coca-Cola® OREO™ Zero Sugar and OREO® Coca-Cola™ Sandwich Cookie — leverage the brands’ signature tastes and iconography to deliver playfully unexpected innovations.","datePublished":"2024-08-13T00:00:00.000-04:00","author":{"@type":"Organization","name":"The Coca-Cola Company","url":"coca-colacompany.com"}} Coca‑Cola and the OREO Brand are Teaming Up: ‘Besties’ Around the World Can Savor New Limited-Edition Drink and Cookie Coca‑Cola 08-13-2024 “Besties” bring out the best in each other. Just ask Coca‑Cola® and the OREO® brand, two “bestie” brands teaming up to offer fans unique flavor experiences that celebrate the “Real Magic” of friendship. A pair of limited-time-only products — Coca‑Cola® OREO™ Zero Sugar and OREO® Coca‑Cola™ Sandwich Cookie — leverage the brands’ signature tastes and iconography to deliver playfully unexpected innovations. Both sport a sleek, black-and-white packaging design that remains true to the two brands’ iconic personalities while embracing creative elements like OREO® cookie embossments and stacked Coca‑Cola® bottles. The exclusive offerings are the latest surprise-and-delight drops from the global Coca‑Cola Creations platform, which lends the iconic Coca‑Cola brand to new creative expressions, unexpected flavors and immersive experiences anchored in the core Gen Z passions of music, gaming, sports, technology and pop culture. The OREO® Coca‑Cola™ Sandwich Cookie features two signature chocolate basecakes paired with a Coca‑Cola taste, embossed with Coca‑Cola designs, with a smooth white-colored creme and studded with red edible glitter. Coca‑Cola® OREO™ Zero Sugar features a refreshing Coca‑Cola taste with flavorful, OREO cookie-inspired hints. “We took careful steps to ensure we delivered the OREO experience in a Coca‑Cola, and vice versa,” said Oana Vlad, Global VP, Brand Strategy at The Coca‑Cola Company. “Both products went through several iterations, and we look forward to following the public conversation of what each tastes like. At the end of day, our mutual commitment to product quality and technical excellence — and our willingness to have fun and work together as one team — made this possible.” Eugenia Zalis, Global Head of Marketing and Brand for OREO, Mondelez International, adds, “At OREO, we strive to identify fresh ways to excite consumers and, with this collaboration, we have truly upped the ante. The bestie bond forged between OREO and Coca‑Cola is a playful way to unite our fanbases and celebrate the power of connection and togetherness. We cannot wait to see the reaction to the campaign and hope fans are excited to experience the latest twists on two classics.” Like previous Coca‑Cola Creations drops, the collab complements the limited-time-only products with immersive digital and physical experiences designed for friends to enjoy together. Fans can activate “Bestie Mode” by scanning on-pack QR codes to merge their music tastes and create custom Spotify playlists commemorating their friendship. Bestie Mode will translate IRL, as well, through live experiences including Ferris wheel takeovers and the opportunity for friends to create matching temporary tattoos and more. Vlad said Coca‑Cola was drawn to the OREO brand’s recent track record of playfully infiltrating pop culture through unexpected collaborations and seasonal innovations. “OREO has emerged as one of the world’s most beloved Gen Z brands by continually pushing the boundaries of flavor innovation that affirm its credentials as the world’s favorite cookie,” she noted. “We’re proud of the collective bravery our two brands have shown in letting our distinct IP be molded and changed in different ways. We believe ‘Real Magic’ happens in unexpected moments of connection. And this is definitely unexpected.” Coca‑Cola Creations is about establishing firsts and taking the brand into new spaces. This latest drop represents several firsts for the platform: its first food partnership, first TV commercial and first attempt to reimagine tastes fans know and love. “Creations, to date, has brought fantasy flavors to consumers,” Vlad said. “But in this case, people have a very distinctive notion and mental benchmark of what Coca‑Cola and OREO cookies taste like. So, we were challenged with delivering an experience that will delight fans of both brands.” The launch is also the largest Coca‑Cola Creations partnership, by far. Coca‑Cola® OREO™ Zero Sugar will hit stores beginning in September in 35 markets worldwide, including the United States, Canada, China, Mexico and Brazil. A frozen variation of Coca‑Cola® OREO™ Zero Sugar will also be available at participating 7-Eleven locations in select markets.'
year_published = 2024
