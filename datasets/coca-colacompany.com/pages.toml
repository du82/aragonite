full_description = "PEOPLE & COMMUNITIES Experience The Coca-Cola Company's positive impact on people and communities worldwide. Discover how we work to help bring positive change through our initiatives. Home Social People & Communities Community Engagement People are at the center of everything we do, from our employees to those who touch our business to the communities we call home. Community involvement allows us to bring positive, measurable change to both the communities in which we operate and to our business. Each one of us can make a big difference for a better shared future. Giving back to communities In 2023, The Coca‑Cola Foundation and The Coca‑Cola Company donated $158.1 million to organizations around the world to help create a better shared future for the communities our business serves. Explore the Coca‑Cola Foundation Supporting vulnerable communities to help provide relief where it is most needed We are dedicated to helping renew communities after natural disasters, fund scholarships, and develop youth. See How Strengthening health systems across Africa by leveraging our distribution and system network Project Last Mile believes life-saving medicines should be available to all people, regardless of where they live. In Africa, nearly 50% of people lack access to critical medicines. The program is working to change that in collaboration with other partners, such as the Global Fund on HIV, Tuberculosis & Malaria, USAID, Pepfar and the Bill & Melinda Gates Foundation. Project Last Mile Since its inception in 1984, over $1.6 billion has been donated by The Coca‑Cola Foundation. Explore The Coca‑Cola Foundation Timeline 1984 1988 1993 2007 2009 2012 2013 2017 2018 2020 The Coca‑Cola Foundation launches. Its focus: education. Coca‑Cola launches First Generation Scholarship Program. The foundation focuses globally on water, active healthy living, community recycling and education. Locally, it prioritizes arts and culture, diversity, HIV/AIDS and malaria treatment and youth development. The Coca‑Cola Company begins giving back 1% of each year’s operating income. The Coca‑Cola Golden Triangle Partnership Fund launches. It awards grants to programs delivered via business, government and civic partnerships. The foundation adopts global sustainability agenda. Its focus: water, women and wellbeing. The foundation takes on new priorities: water, women’s empowerment, community recycling and wellbeing. The foundation’s giving to sustain local communities reaches $1 billion. 5by20 goal exceeded, enabling the economic empowerment of over 6 million women. Related Content Coca‑Cola Collaborates with Tech Partners to Create Bottle Prototype Made from 100% Plant-Based Sources Read More Coca‑Cola Launches ‘Real Magic’ Brand Platform, Including Refreshed Visual Identity and Global Campaign Read More Iteration, for Good: How Project Last Mile is Supporting COVID-19 Vaccine Distribution in Africa and Beyond Read More"
