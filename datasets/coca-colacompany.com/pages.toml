["https://coca-colacompany.com/careers/life-at-coca-cola"]
title = "Life at Coca-Cola"
description = """
138+
years of refreshing the world

The Coca‑Cola Company has been refreshing the world and making a difference for over 138 years. Explore our Purpose & Vision, History and more."""
full_description = "LIFE AT COCA-COLA Home Careers Life at Coca‑Cola At Coca‑Cola we build a collaborative, inclusive workplace that empowers our employees to thrive. We are dedicated to inspiring and empowering the personal and professional growth of our employees, while actively contributing to the well-being of our communities. As a company, we are committed to relentlessly pursuing sustainability in every aspect of our business. Embodying a growth mindset, we champion the value of continuous learning as an essential driver for enhancing our business and continuous innovation. Career Development At Coca‑Cola, we empower our employees across the globe to prioritize their development by building up capabilities and taking on new experiences. We provide clarity on where you stand within the organization through career planning conversations that put you in the driver's seat of your personal development. At Coca‑Cola, you own your journey in a way that works for you. Learn more Diversity, Equity & Inclusion We are steadfast in our conviction that a diverse, equitable, and inclusive workplace enriches our company and strengthens our global impact. Harnessing the incredible diversity of our talented workforce, we aim to invigorate the world and foster positive change. Our long-term ambitions encompass three key objectives: 1) cultivating a workforce that reflects the diverse markets we serve 2) striving for equity for all people 3) setting the standard for an inclusive workplace and celebrating uniqueness. Previous Next Gender Balance Inclusion Networks Business Forums Commitments Pay Equity Rewards & Benefits At The Coca‑Cola Company, we recognize the value of investing in our people and providing a highly competitive offering – KO Total Rewards. It’s an essential part of your overall employee experience of working at Coca‑Cola. Total Rewards represents the total value you receive from the company – through base pay, incentives, and benefits. To reward your contributions, we offer programs and resources that provide financial incentives, health, protection, and support for your overall well-being. Click the link to explore our U.S.-based benefit offerings. In addition to providing competitive benefits and rewards, we value and support the well-being of our employees at Coca‑Cola. We believe that well-being is about you having the support and resources to refresh yourself, your team, family, and others – at work, at home, and in your community.​​​​​​​ To support your well-being, Coca‑Cola offers a number of global programs to help you stay active and healthy, be financially prepared, and support your mental well-being. We also offer an inclusive culture and flexibility to feel and be your best. Note: Benefits offered vary by international market to reflect local market practice – details can be requested. US Benefits Well-Being at Coca‑Cola To support the overall well-being of our Coca‑Cola employees, we offer a variety of global programs and incorporate well-being practices into our daily routines. These include: Mobile and digital platform offering options to track activity and habits, participate in challenges, get daily well-being tips, and access online coaching pathways.Mindfulness app supporting your mental well-being through meditation sessions and courses that help with challenges from sleeping difficulties to reducing stress to boosting your overall mood and outlook.Mental health support program providing free counseling sessions and support for a range of personal and professional challenges.Financial education & learning program offering assessments, online courses, articles, videos, calculators and tools to help you plan for your financial future.On-demand fitness app providing access to hundreds of on-demand fitness classes in a range of activities, including running, cycling, HIIT training, strength training, yoga, boxing, barre, and more. In addition to these global programs, the local office culture is supported with activities and programs such as external speakers, volunteer activities, social engagement, sports clubs, race participation, and more. Coca‑Cola also understands that well-being is more than just programs – with efforts underway to help people feel included and connected. We offer a wide variety of inclusion networks for employees to join as well as tools, technologies, and routines to help us more effectively avoid unnecessary meetings and offer the flexibility to balance your work and life. Our Culture We believe our culture enables our Company’s business strategy and shapes employee experiences. We nurture a culture with a passion to refresh the world and make a difference. This includes inspiring and supporting the growth of our people, service to our communities, and constantly shaping a more sustainable business. We embrace a growth mindset and believe in continuous learning to improve our business and ourselves. We focus on four key growth behaviors – being curious, empowered, inclusive and agile – and we value how we work as much as what we achieve. As part of our strategy, we aim to attract, retain, and inspire outstanding talent by fostering a high-performing culture and positive employee experience. Our internal surveys show that our people are highly engaged, report positive work experiences, and have good opportunities to learn and grow in their roles. Our employees consistently report they are proud to work at Coca‑Cola, and most would recommend our Company as a great place to work. Refreshing the World and Making a Difference We use our creativity, teamwork and scale to make a positive difference in the world and our employees are empowered to take action. Previous Next Community Impact Matching Gifts Volunteer Time Off Coca‑Cola Heroes Collaboration is Key to Our Success Working together is integral to how we achieve, how we lead and how we learn. The goal is not collaboration for collaboration’s sake, it’s to achieve business results that would not be possible without multiple parties working together. This requires our employees to be collaborative, to work together and share information. Related Content Coca‑Cola Collaborates with Tech Partners to Create Bottle Prototype Made from 100% Plant-Based Sources Read More Coca‑Cola Launches ‘Real Magic’ Brand Platform, Including Refreshed Visual Identity and Global Campaign Read More Iteration, for Good: How Project Last Mile is Supporting COVID-19 Vaccine Distribution in Africa and Beyond Read More"
