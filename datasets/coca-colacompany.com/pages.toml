["https://coca-colacompany.com/social/coca-cola-foundation"]
title = "Coca-Cola Foundation"
description = """
138+
years of refreshing the world

The Coca‑Cola Company has been refreshing the world and making a difference for over 138 years. Explore our Purpose & Vision, History and more."""
full_description = "THE COCA-COLA FOUNDATION The Coca‑Cola Company's philanthropic arm, The Coca‑Cola Foundation, fosters lasting social impact through meaningful support for various causes and initiatives. Home Social Coca‑Cola Foundation We aim to help address complex global challenges to leave a lasting impact in our communities Our Commitment Our mission is to make a difference in communities around the world by investing in transformative ideas and institutions that help address some of our most pressing global challenges. As the primary philanthropic arm of The Coca‑Cola Company, we are working to support the local and global changemakers leaving a measurable and lasting impact in areas around the world where the Company operates and where our employees live and work. As of 2023, we have awarded more than $1.6 billion in grants to support initiatives around the world since our inception, and we have recently refreshed our focus to specifically address sustainable access to water, a circular economy, climate resilience and disaster preparedness and response, economic empowerment, and causes impacting our hometown community. Our Approach Philanthropic Funding We invest in transformative ideas and institutions through grants and impact investments. System Expertise We leverage the capabilities and insights of the Coca‑Cola system to help partners successfully implement projects. Collective Action We build partnerships across organizations and geographies to help deliver impact at scale. Sustainable Access to Safe Water The challenge: 2 billion people around the world lack access to safely managed drinking water, according to the United Nations. Taking action: We advance solutions and innovations that help provide and assure safely managed drinking water to those living in vulnerable communities and in water-stressed regions. Our support focuses on water innovation, systems strengthening approaches for improved water access as well as ongoing service and catalyzing larger investments in resilient water infrastructure through technical assistance, capacity building, and risk mitigation. Climate Resilience and Disaster Risk Preparedness and Response The challenge: Over the last two decades, floods and droughts have affected 3 billion people, with staggering costs in human suffering and economic loss, according to The World Bank.Taking action: We advance water resource management solutions and programs to help enable vulnerable communities to effectively prepare for, recover from, and adapt to the impacts of climate change. We also help support communities impacted by natural disasters with immediate relief. Circular Economy The challenge: According to a recent Nature study, 21% of global municipal plastic waste went into unmanaged systems in 2020.Taking action: We invest in solutions and service delivery models that help accelerate the transition toward a circular economy and stem the flow of waste leakage into rivers and oceans. Our support aims to strengthen livelihoods for informal waste workers, helping catalyze innovation and infrastructure, and helping address challenges to recycling on Small Island Developing States and Least Developed Nations. Economic Empowerment The challenge: Almost 1 out of 2 people — 3.4 billion people around the world— struggle to earn enough to meet basic needs, according to World Bank Group. Across OECD countries on average, it takes 4.5 generations for those born in low-income families to approach mean income in their society. Taking action: We support education, workforce development and entrepreneurship opportunities that help foster economic development and enable greater economic inclusion for vulnerable communities. Our support focuses on higher education as a pathway for economic mobility; workforce development programs; enhancing the resilience of micro-small-medium sized enterprises and advancing inclusive entrepreneurship efforts. Hometown Importance of Hometown: We are as committed to the sustainability of our hometown of Atlanta as we were when the first bottle of Coca‑Cola was sold in downtown Atlanta in 1886. We want our hometown community to thrive, and we are working to help make a positive impact.Taking Action: We invest in social and economic programs to help support an inclusive and thriving community through youth development, education, economic empowerment, arts and culture, and civic engagement. Employee Giving Employees of The Coca‑Cola Company donate time and money to support their local communities. In the U.S., The Coca‑Cola Foundation matches their generosity and support to charitable organizations across the United States. Previous Next Sustainable Access to Safe Water Climate Resilience and Disaster Risk Preparedness and Response Circular Economy Economic Empowerment Hometown Employee Giving About us Grant proposals | The Coca‑Cola Foundation is committed to supporting communities across the world. Our giving is guided by a firm set of priorities. Out of respect for the time and resources of all our stakeholders, we do not accept unsolicited proposals for grants. Giving and financial statements | The Coca‑Cola Foundation awards over 200 grants per year. See Our 2023 Progress View our 990 Form Community Partner Portal Related Content Coca‑Cola Collaborates with Tech Partners to Create Bottle Prototype Made from 100% Plant-Based Sources Read More Coca‑Cola Launches ‘Real Magic’ Brand Platform, Including Refreshed Visual Identity and Global Campaign Read More Iteration, for Good: How Project Last Mile is Supporting COVID-19 Vaccine Distribution in Africa and Beyond Read More"
