["https://coca-colacompany.com/sustainability-resource-center"]
title = "Sustainability Resource Center"
description = """
138+
years of refreshing the world

The Coca‑Cola Company has been refreshing the world and making a difference for over 138 years. Explore our Purpose & Vision, History and more."""
full_description = "SUSTAINABILITY AND GOVERNANCE RESOURCE CENTER Home Sustainability Resource Center Sustainability is core to our purpose to Refresh the World, Make a Difference and our growth strategy. This resource provides an overview of our efforts to help create a more sustainable business and a better shared future. ▼ CLICK ON A TOPIC OF YOUR INTEREST ▼ A - D E - K L - R S - Z Agriculture A sustainable and resilient agricultural supply chain is critical to achieving our interrelated environmental goals around water and climate. We seek to continue initiatives and programs with suppliers and third-party stakeholders to support sustainable sourcing of agricultural ingredients. These actions are intended to reduce water use and emissions to help prevent deforestation and conserve high-risk areas in the supply chain. We work with our suppliers to promote practices and build capabilities covered in our Principles for Sustainable Agriculture (PSA), which span human and workplace rights, environmental protection, responsible farm management and animal health and welfare. A comprehensive bottler and supplier governance system was also introduced that aims to encourage continuous improvement toward credible global assurance schemes and standards across our agriculture supply chain. Additional Resources 2023 CDP Forests ResponsePrinciples for Sustainable AgriculturePrinciples for Sustainable Agriculture Supplier GuideSupplier Guiding PrinciplesResponsible Land Acquisition GuidanceCosta Coffee Responsible Sourcing Innocent Sustainable BusinessAnimal Health and Welfare Guiding PrinciplesFairlife Animal Welfare2023 Environmental Update Alcohol Responsibility Our entry into alcoholic beverages outside the U.S. brings new responsibilities1. To help ensure accountability, we’ve developed our Global Policy on Alcohol Responsibility. These policies outline our commitment to grow our alcohol brands in a responsible way; prohibit marketing to people under the legal purchase age; and support responsible consumption. There are four components to the policy: Responsibly marketing our alcohol brands. Supporting local partnerships and communications programs to help reduce and prevent the harmful use of alcohol. Providing information to enable people to make informed choices. Enabling our employees and partners to be ambassadors for responsible consumption. We support the United Nations’ Sustainable Development Goal (SDG) 3 to ensure healthy lives and promote well-being for all and will take action to help ensure our alcoholic beverages are consumed responsibly. Additional Resources Global Policy on Alcohol Responsibility [1] The Coca‑Cola Company is not licensed to trade in alcohol in the U.S. The Company has instead authorized third parties to use its brands for their use in manufacturing, selling and marketing alcohol products and those third parties maintain their own alcohol responsibility policies. Animal Testing We value the humane treatment of animals and prioritize continuous improvement in animal health and welfare. The Coca‑Cola Company does not conduct animal tests on its beverages or ingredients, except when explicitly required by governmental agencies to demonstrate safety. In these instances, we rely on third-party experts or external organizations to conduct these tests using protocols and test methods determined by government agencies. We encourage our ingredient and packaging suppliers and external research organizations to use animal alternatives, if such tests are available and acceptable to government agencies to demonstrate safety. Additional Resources Animal Health and Welfare Guiding Principles Animal Welfare The Coca‑Cola Company values the humane treatment of animals and we prioritize continuous improvement in animal health and welfare. We aim to ensure that 100% of the ingredients we source meet our Principles for Sustainable Agriculture (PSA), which were updated and expanded recently to include responsible animal health and welfare conditions. Our Animal Health and Welfare Guiding Principles are guided by the Five Freedoms of Animal Welfare. We require all suppliers to implement practices and pursue continuous improvement for: Freedom from hunger and thirst: by ready access to fresh quality water and a diet that maintains full health and vigor. Freedom from discomfort: by an appropriate environment, including shelter and comfortable resting areas. Freedom from pain, injury and disease: by prevention or rapid diagnosis and treatment.Freedom to express normal behavior: by providing enough space, proper facilities and company of the animal’s own kind. Freedom from fear and distress: by ensuring conditions and care that avoid mental suffering. Our suppliers are required to implement and relay a zero-tolerance policy for willful acts of animal abuse and neglect, which must include a definition of what constitutes abuse and neglect, and potential consequences should abuse or neglect occur. In addition to eradicating willful acts of abuse and neglect, we expect our suppliers to adopt a proactive approach to demonstrate and assure sustainable farming practices and animal health and welfare by identifying and adopting relevant third-party standards to assure best practices. As we continue our journey, we will continue to seek feedback from global experts on animal health and welfare to align with science-based practices. We will engage and work to adopt a comprehensive, systemic vision for animal health and welfare. Additional Resources Animal Health and Welfare Guiding PrinciplesRaising Animal Welfare Standards Across Our Supply Chain Board Diversity In 1934, we became one of the first major U.S. companies to appoint a woman to its Board of Directors. Since then, we have worked to ensure our Directors represent the interests of our shareowners and bring to their roles a diversity of experience, background and thought to best govern our company. The Board strives to maintain an appropriate balance of tenure, turnover, diversity and skills across its Directors as a whole. The Board does not have a specific diversity policy but fully appreciates the value of Board diversity. Diversity is important because having a variety of viewpoints improves the quality of dialogue, contributes to a more effective decision-making process and enhances overall culture in the boardroom. In evaluating candidates for Board membership, the Board and the Committee on Directors and Corporate Governance consider many factors based on the specific needs of the business and what is in the best interests of the company’s shareowners. This includes diversity of professional experience, race, ethnicity, gender, age and cultural background. In addition, the Board and the Corporate Governance and Sustainability Committee focus on how the experiences and skill sets of each Director nominee complement those of fellow Director nominees to create a balanced Board with diverse viewpoints and deep expertise. Our Board today is diverse across age, race and gender, and has a strong reservoir of experience. As of December 2024, six female Directors comprise 54% of the current Board, and 27% of Directors self-identify as ethnically/racially diverse. Additional Resources Board of Directors Board Committees and ChartersProxy StatementsCorporate Governance Guidelines Board Leadership Structure The current Board leadership structure comprises of a combined Chairman of the Board and Chief Executive Officer, and a Lead Independent Director, supported by Board committees led primarily by independent Directors and active engagement by all Directors. The Board believes that this structure effectively balances the Chairman/CEO’s strong company leadership and deep company expertise with appropriate safeguards, oversight and fresh perspective provided by independent Directors. Additional Resources Board of Directors Board Committees Board of Directors The Board of Directors of The Coca‑Cola Company is elected annually by shareowners to represent their interests in the long-term financial health and overall success of the business. We believe that Directors with a diversity of experience, background and thought best represent shareowner interests and strengthen the overall governance of our company. The key responsibilities of the Board are oversight of business strategy, risk oversight and succession planning. As the Company’s ultimate decision-making body, the Board provides advice and counsel to the Chief Executive Officer and other company leadership. The Board has established several committees to give focused attention to certain important areas, including: an Audit Committee, a Talent and Compensation Committee, a Corporate Governance and Sustainability Committee, a Finance Committee and an Executive Committee. The charter for each committee, as well as our Code of Business Conduct, Corporate Governance Guidelines and Certificate of Incorporation and Bylaws, can be found here. Additional Resources Board of Directors Board CommitteesCorporate Governance Guidelines2024 Proxy StatementLeadership Child Labor Our Human Rights Policy, Supplier Guiding Principles and Principles for Sustainable Agriculture expressly prohibit child labor throughout our value chain. While child labor is not a significant risk in company-owned operations, there are risks deep within our supply chain, including at the farm level or downstream at recovery points for recyclable materials. We work diligently to address such risks through engagement with a wide cross-section of stakeholders. We are an active member of the Child Labor Platform (CLP). Under the leadership of the International Labor Organization (ILO), the International Organisation of Employers (IOE) and the International Trade Union Confederation (ITUC), the CLP takes a multi-stakeholder approach to identifying obstacles to the implementation of the ILO conventions in supply chains and surrounding communities, finding practical ways to overcome these obstacles, and catalyzing collective action. Additional Resources Human Rights Policy (English)Human Rights Policy (Other Languages)Principles for Sustainable AgricultureSupplier Guiding Principles (English)Supplier Guiding Principles (Other Languages)Human RightsSupplier Guidelines Climate We believe that we have a long-standing responsibility to reduce emissions in our own operations; to manage the short and long-term risks and impacts climate change has on our business; and to partner with businesses, organizations and communities to help drive meaningful actions to create positive change. We continue to track and report our progress annually as we work to address interconnected environmental challenges. For example, climate resilience is a key aspect of our water strategy; our agriculture practices include a focus on lower carbon emissions; and our packaging initiatives contribute to our emission reduction goal. As of 2023, we reduced our absolute emissions by 8% against a 2015 baseline. In 2024, we announced our aim to reduce the company’s Scope 1, 2 and 3 emissions in line with a 1.5°C trajectory by 2035, from a 2019 baseline. Our goal aims to focus on reducing emissions in the company’s own operations, including concentrate manufacturing operations and company-owned bottlers. The company’s acquired businesses will be excluded from this goal, including BODYARMOR, CHI, Costa, doğadan, fairlife and innocent. The company expects to prepare these businesses for integration into its 1.5°C trajectory over time. Achieving this ambition requires additional investments in new technologies and renewable sources, working with franchise bottling partners and suppliers to reduce their direct emissions, which are the company’s Scope 3 emissions. Our actions on water and packaging can help mitigate the impacts caused by climate change, as well. Additional Resources Climate2023 CDP Climate Change Response2023 Environmental Update To view additional reports, visit Policies and Practices. Community Impact The company plays an active role in the growth of the communities where it operates through several sustainable development initiatives which include water stewardship, community recycling and women’s economic empowerment. In addition, The Coca‑Cola Foundation, our company's primary international philanthropic arm, has supported sustainable community initiatives around the world since its inception in 1984. Grants funded by the Foundation complement the contributions of our company operating units and bottling partners. Additional Resources The Coca‑Cola Foundation2023 Progress Corporate Governance The Coca‑Cola Company and its Board of Directors are committed to good corporate governance, which promotes the long-term interests of shareowners, strengthens Board and management accountability, and helps build public trust in the company. We continuously engage with our shareowners and others to ensure that we are employing “best practices” at the Board level and for our shareowners. As opportunities arise, we also update or enact new corporate governance policies or disclosure to enhance transparency and accountability. Additional Resources Board of Directors Board CommitteesProxy StatementsCorporate Governance GuidelinesCode of Business ConductPolicies, Practices & Reports Deforestation The quality and integrity of our products depend on a healthy supply chain with thriving farming communities. With our vast and global supply chain, it is critical for us to focus our attention and resources on areas of greatest risk and opportunity for influencing change. One area is deforestation which may occur in the supply chain as a result of the production of agricultural raw materials used in the Coca‑Cola system and value chain. Priority ingredients at risk of causing deforestation, such as soy and timber, are part of our global sustainable sourcing priorities. Safeguards against deforestation are built into our global Principles for Sustainable Agriculture (PSA). We have discontinued products that require palm oil, except for some usage in our Global Ventures, such as food products sold at our Costa Coffee locations in the UK, which are Roundtable on Sustainable Palm Oil (RSPO) certified. Additional Resources 2023 CDP Forests ResponsePrinciples for Sustainable Agriculture2023 Environmental Update Deposit Scheme In emerging markets, we advocate for government regulations permitting the use of rPET in food and beverage packaging, and we seek ways to empower the informal waste collection sector. In developed markets, we are working with industry peers to build collection infrastructures—including our more than 40 years of experience operating 40+ local Deposit Return Systems (DRS). Countries with a well-designed DRS scheme, like Germany, can achieve high levels of collection (approximately 97% collection for PET bottles in Germany). The company aims to continue to focus on increased advocacy for well-designed collectio"
