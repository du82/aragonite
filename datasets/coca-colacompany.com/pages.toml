title = "Career Areas"
description = "At The Coca-Cola Company, we act with a growth mindset, taking an expansive approach to what’s possible. Here, you can make a difference from Day One. Find a career at The Coca-Cola Company."
full_description = "CAREER AREAS Home Careers Career Areas Career Experiences Iconic brands. Innovative technologies. As a global organization, we seek opportunities to embrace and champion progress. Your deep understanding of the ever-shifting global landscape means you’ll help guide us into the next chapter and beyond. And we can’t wait to see what impact you’ll make and how that will refresh the world. Our careers span across functions and are globally connected to give you an unmatched career experience. Talent Community Explore a World of Professional Opportunities The careers highlighted below represents just a glimpse of the possibilities at The Coca‑Cola Company. To discover a comprehensive list of all positions available, please explore our job search page. EXPLORE Data Analytics Our data analytics teams enthusiastically cultivate advanced data competencies to help Coca‑Cola make agile, insight driven decisions for growth. Organized in service hubs, we consider data analytics crucial to our future innovation and expansion. Explore Jobs Finance & Accounting The finance and accounting teams drive value creation for Coca‑Cola by synthesizing insights to prioritize strategic options, envisioning a 3-10 year plan, and bridging the present and future to unlock growth. Explore Jobs RGM Revenue Growth Management utilizes advanced analytics for fact-based decisions, fostering growth through holistic, end-to-end approach that delivers superior value chains and wins at the point of sale for all stakeholders. Explore Jobs Information Technology Our cutting-edge technology teams ensure a seamless and trusted digital experience, from software development to selecting drinks on Coca‑Cola Freestyle machines to ordering online for doorstep delivery. Explore Jobs Brand Management/ Marketing Our global marketing teams are crafting the vision for the future of our brands, concentrating on growth strategies that develop, implement and monitor the success of our brands. Explore Jobs Technical Our technical, innovation and supply chain teams fuel innovative flavors, sustainable tech, and global connections while enhancing consumer protection. Comprised of engineers, scientists and innovators, they’re transforming the industry. Explore Jobs PACS Public Affairs, Communications, and Sustainability (PACS) teams manage strategic communications, stakeholder relations, and drive global Environmental, Social, and Governance (ESG) initiatives around the globe Explore Jobs Sales Our customer commercial teams, consisting of sales, business development, and account management professionals, create channel and category strategies that propel our business. They add value through efficient account management, digital commerce and data analytics. Explore Jobs Manufacturing Our manufacturing facilities form the core of the Coca‑Cola system. In roles like Production Supervisor, Engineering, Warehouse, or Maintenance Technician, you’ll join an iconic team that prioritizes your growth and development. Explore Jobs Early Career Internships Gaining hands-on experience as a student enhances your education and gives you an edge in your career journey. The Coca‑Cola Company is the ideal place for this, offering internships with a global network of professionals who mentor and involve you in meaningful projects. Our interns feel empowered to contribute their skills and drive business objectives across fields like IT marketing, retail sales, finance, technical, supply chain, public affairs, and operations. Our 10-week summer internship program is a full-time paid experience that provides: Project-Based Work Access to Senior Leadership Mentorship & Career Development Internship Events and Workshops Internship Showcase to display your work to the organization Experience within the Iconic Coca‑Cola Culture We recruit for our internships two times a year: fall and the beginning of the year. You can find all our internship opportunities on our career site. EXPLORE Careers for Military The Coca‑Cola Company has a proud history of supporting the military, veterans, and their spouses. Joining us means working for a company that values your service, allowing you to continue your career with a respected brand while being acknowledged for your contributions to our country and our team. Explore our Military Community Disability Inclusion in the Workplace We believe everyone has a right to a great career and we make inclusion a priority. Our This Ability Inclusion Network serves as a thought leader in the area of disability insights and an advocate for a winning and inclusive culture, where everyone can thrive. Explore our Accessible Workplace Related Content Coca‑Cola Collaborates with Tech Partners to Create Bottle Prototype Made from 100% Plant-Based Sources Read More Coca‑Cola Launches ‘Real Magic’ Brand Platform, Including Refreshed Visual Identity and Global Campaign Read More Iteration, for Good: How Project Last Mile is Supporting COVID-19 Vaccine Distribution in Africa and Beyond Read More"
