["https://coca-colacompany.com/social/human-rights/stories-of-impact"]
title = "Stories of Impact"
description = """
138+
years of refreshing the world

The Coca‑Cola Company has been refreshing the world and making a difference for over 138 years. Explore our Purpose & Vision, History and more."""
full_description = '''{"@context":"https://schema.org/","@type":"Social - Article","headline":"Stories of Impact","description":"The Coca-Cola Company has a longstanding commitment to advancing respect for human rights. Read about our company's human rights policies and practices.","datePublished":"","author":{"@type":"Organization","name":"The Coca-Cola Company","url":"coca-colacompany.com"}} Home Social Human Rights Stories of Impact Stories of Impact Real IMPACT seeks to build on our company-wide ethos, ambitions, and programs to achieve new horizons of progress — for the benefit of stakeholders across our value chain. It is not a vision to be realized by one team alone but through a network of partnerships and collaborations both within and outside the company. We partner with stakeholders and peers to drive meaningful change across our value chain. Below are some stories of the impact-driven work we are leading today that provides a strong foundation for accelerating and expanding Real IMPACT. Partnering to Support Informal Waste Workers The collection, sorting, and recycling of plastics and other materials involve complex and localized value chains. Informal waste workers are the cornerstone of this work—collecting and sorting up to 60% of recycled plastic waste around the world. Our partner in Mexico, PetStar — the world’s largest food-grade PET recycling plant — developed a social inclusion model, “Modelo de Acopio Inclusivo Petstar (MAIP),” focused on respecting human rights in the collection value chain. Through the MAIP framework, PetStar established strategic partnerships with NGOs in vulnerable areas to support families through education, psychological support, nutrition, and medical attention. Empowering Citrus Farmers to Build More Resilient Futures Brazil is home to the largest citrus sector in the world, with 3 out of 5 cups of orange juice produced in the citrus belt region within São Paulo and Minas Gerais states. Since 2019, we have helped fund the Fruto Resiliente initiative in Brazil to support small citrus farmers struggling to become more resilient and sustainable. The project is a collaborative partnership between The Coca‑Cola Company, The Coca‑Cola Foundation, innocent, Cutrale (a core supplier), Eckes-Granini, ADM CARES, and the Dutch NGO Solidaridad. Together we are working to provide labor rights training, technical assistance to smallholder farmers, helping them enhance their farming practices, including with soil, pest, and farm management. Partnering to Create Large-Scale Change for Migrant Workers and Families Throughout the year, thousands of seasonal migrant workers and their families travel through Türkiye’s agricultural production areas following the harvest cycle from crop to crop. The Coca‑Cola Company joined Harvesting the Future — a program led by the Fair Labor Association® (FLA) in Türkiye that brings together NGOs, local government agencies, companies, and sustainable agriculture platforms — to address human rights risks in agricultural supply chains. Enhancing Visibility Through the Power of Technology In a world of increasing migration, we are looking to technology to better address the inherent risks migrant workers face, even before their first day of employment. We partnered with impact technology firm Diginex to develop a new online model of human rights due diligence and ethical recruitment called the diginexLUMEN platform. After our early work with Diginex, consumer goods company Reckitt joined as a fellow partner. The diginexLUMEN platform collects, analyzes, and validates information about recruitment and working conditions in complex supply chains, helping companies identify risk in real time and focus their resources and remediation efforts where they are most needed. The Coca‑Cola Company piloted the tool in its operations in the Middle East, a region heavily reliant on foreign labor. It has since begun pilots in additional markets including India, Malaysia, Thailand, Eswatini and Australia as it evaluates impact and effectiveness more globally. More About Human Rights Human Rights at The Coca‐Cola Company Respect for human rights is fundamental to The Coca‑Cola Company, where our purpose is to refresh the world and make a difference. LEARN MORE Human Rights Governance We operationalize our commitment with policies, due diligence, oversight, and disclosure. LEARN MORE Related Content Coca‑Cola Collaborates with Tech Partners to Create Bottle Prototype Made from 100% Plant-Based Sources Read More Coca‑Cola Launches ‘Real Magic’ Brand Platform, Including Refreshed Visual Identity and Global Campaign Read More Iteration, for Good: How Project Last Mile is Supporting COVID-19 Vaccine Distribution in Africa and Beyond Read More'''
