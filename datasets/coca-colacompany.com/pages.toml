["https://coca-colacompany.com/media-center/coca-cola-collaborates-with-rosalia-on-limited-edition-coke-creation"]
title = "Taste the Transformation: Coca-Cola and Grammy-Award Winning Artist Rosalía Break Boundaries With Limited-Edition Coke Creation"
description = """
138+
years of refreshing the world

The Coca‑Cola Company has been refreshing the world and making a difference for over 138 years. Explore our Purpose & Vision, History and more."""
full_description = '''{"@context":"https://schema.org/","@type":"Media Center - Article","headline":"Taste the Transformation: Coca-Cola and Grammy-Award Winning Artist Rosalía Break Boundaries With Limited-Edition Coke Creation","description":"Indulge in the artistic fusion of music and taste with Coca-Cola's limited-edition creation in collaboration with Rosalia.","datePublished":"2023-02-10T00:00:00.000-05:00","author":{"@type":"Organization","name":"The Coca-Cola Company","url":"coca-colacompany.com"}} Taste the Transformation: Coca‑Cola and Grammy-Award Winning Artist Rosalía Break Boundaries With Limited-Edition Coke Creation 02-10-2023 The boldest and edgiest Coca‑Cola® Creations flavor yet—a collaboration with musical powerhouse and Grammy-award winning artist Rosalía called Coca‑Cola® Move —brings to life the transformational power of music. From her beginnings as a classically trained flamenco artist in Spain, to her rise as a global pop star, Rosalía has transcended borders and genres in music, fashion and more. “Transformation as a means of self-expression is powerful and resonant for today’s generation, and music is the universal language for transformation” said Oana Vlad, Senior Director, Global Strategy, The Coca‑Cola Company. “Partnering with the inspirational and genre-defying Rosalía to bring to life our latest drop under Coca‑Cola® Creations has been a blast and has broken new ground for Coca‑Cola Creations. Coca‑Cola® Move transforms the experience of drinking Coca‑Cola.” Coca‑Cola® Move features a striking packaging design embracing the contrasts of the artist’s persona – from vibrant pink inspired by her playful and creative personality to minimalistic black representing her bold elegance. The iconic Coca‑Cola® Spencerian script morphs into sketches Rosalía drew while sampling Coca‑Cola® Move during a creative workshop. Rosalía recently dropped a new single, “LLYLM”, inspired by Coca‑Cola® Move and embodying the concept of transformation through a genre-crossing journey. Released globally by Columbia Records, the song is a first for the artist in that it features multiple languages, including a full section in English. “I’m so excited for this co-created drink launch with Coca‑Cola. I hope everybody enjoys this journey of music, flavors and creation as I did. I had a lot of fun creating LLYLM and this collaboration with Coke,” said Grammy Award-winning recording artist and producer, Rosalía. Coca‑Cola® Move cans and bottles include a scannable QR code that serves as a portal to the Coca‑Cola® Creations Hub featuring a host of cinematic experiences: behind-the-scenes content of Rosalía recording her new single; a personality quiz that creates custom 3D, metaverse-inspired avatars and playlists based on fan responses; and a music video celebrating all versions of the artist by incorporating live action photography and animation sequences. Fans also can bid on autographed items Rosalía credits with inspiring her transformation—including a helmet, tour outfit and poster. Proceeds will benefit the Antonio Gala Foundation, an organization that provides residency scholarships to young creators in Rosalía’s home country of Spain. The star, who took the initiative to create her own transformation story, was inspired by the organization’s mission. Coca‑Cola® Move launches this month in the U.S., Canada and more than 20 additional markets around the world. A zero-sugar option also will be available. The launch follows the successful 2022 rollout of five fantasy-flavored Coca‑Cola® Creations drops: Coca‑Cola® Starlight, Coca‑Cola® Byte, the artist Marshmello’s Limited Edition Coca‑Cola®, Coca‑Cola® Dreamworld, and Coca‑Cola® Soul Blast. Coca‑Cola® Creations lends the iconic Coca‑Cola brand to new expressions, driven by collaboration, creativity and connection. Each sequential, surprise-and-delight drop includes a limited-edition flavor, complemented by designs and experiences, with inspiration from music, gaming and culture across physical and digital worlds. “We’re excited for another great year with Coca‑Cola Creations,” Vlad said. “Last year’s fantasy- flavor innovations kept fans guessing with a dash of the unexpected, while delivering only-Coke-can-do experiences that both leaned into passion points and pushed the boundaries of how we engage as a brand.” Coca‑Cola will unveil additional limited-edition Coca‑Cola® Creations in 2023 featuring unique innovations and unexpected collaborations. For more information, visit www.coca-cola.com/creations. Related Content Coca‑Cola Collaborates with Tech Partners to Create Bottle Prototype Made from 100% Plant-Based Sources Read More Coca‑Cola Launches ‘Real Magic’ Brand Platform, Including Refreshed Visual Identity and Global Campaign Read More Iteration, for Good: How Project Last Mile is Supporting COVID-19 Vaccine Distribution in Africa and Beyond Read More'''
