The Coca‑Cola Company has been refreshing the world and making a difference for over 138 years. Explore our Purpose & Vision, History and more."""
full_description = '''Home About Us Coca‑Cola History Our Origins The Birth of a Refreshing Idea Coca‑Cola History The product that has given the world its best-known taste was born in Atlanta, Georgia, on May 8, 1886. Dr. John Stith Pemberton, a local pharmacist, produced the syrup for Coca‑Cola, and carried a jug of the new product down the street to Jacobs' Pharmacy, where it was sampled, pronounced "excellent" and placed on sale for five cents a glass as a soda fountain drink. Carbonated water was teamed with the new syrup to produce a drink that was at once "Delicious and Refreshing," a theme that continues to echo today wherever Coca‑Cola is enjoyed. Dr. John Pemberton Dr. John Stith Pemberton, a local pharmacist, produced the syrup for Coca‑Cola, and carried a jug of the new product down the street to Jacobs' Pharmacy, where it was sampled, pronounced "excellent" and placed on sale for five cents a glass as a soda fountain drink. Thinking that "the two Cs would look well in advertising," Dr. Pemberton's partner and bookkeeper, Frank M. Robinson, suggested the name and penned the now famous trademark "Coca‑Cola" in his unique script. The first newspaper ad for Coca‑Cola soon appeared in The Atlanta Journal, inviting thirsty citizens to try "the new and popular soda fountain drink." Hand-painted oilcloth signs reading "Coca‑Cola" appeared on store awnings, with the suggestion "Drink" added to inform passersby that the new beverage was for soda fountain refreshment. During the first year, sales averaged a modest nine drinks per day. Dr. Pemberton never realized the potential of the beverage he created. He gradually sold portions of his business to various partners and, just prior to his death in 1888, sold his remaining interest in Coca‑Cola to Asa G. Candler. An Atlantan with great business acumen, Mr. Candler proceeded to buy additional rights and acquire complete control. Related Content Coca‑Cola Collaborates with Tech Partners to Create Bottle Prototype Made from 100% Plant-Based Sources Read More Coca‑Cola Launches ‘Real Magic’ Brand Platform, Including Refreshed Visual Identity and Global Campaign Read More Iteration, for Good: How Project Last Mile is Supporting COVID-19 Vaccine Distribution in Africa and Beyond Read More'''
