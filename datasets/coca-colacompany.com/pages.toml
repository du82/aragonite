title = "The Coca-Cola Company Paris 2024 Hub"
description = "In our role as a Worldwide Partner of the Olympic and Paralympic Games and Presenting Partner of the Paris 2024 Olympic Torch Relay, The Coca‑Cola Company will refresh athletes, officials, and spectators with its diverse portfolio of beverages, including Coca‑Cola, Powerade, Fuze Tea and smartwater."
full_description = '''In our role as a Worldwide Partner of the Olympic and Paralympic Games and Presenting Partner of the Paris 2024 Olympic Torch Relay, The Coca‑Cola Company will refresh athletes, officials, and spectators with its diverse portfolio of beverages, including Coca‑Cola, Powerade, Fuze Tea and smartwater. LEARN ABOUT OUR PARIS 2024 ACTIVATIONS Team Coca‑Cola's Global Athlete Roster Revealed Ahead of the Olympic and Paralympic Games Paris 2024 LEARN MORE Powerade Unveils Olympic Games Experience & Global Campaign for Paris 2024 LEARN MORE ‘It’s Magic When the World Comes Together’: Olympic Athletes and Fans Alike Embrace in Global Coca‑Cola Campaign for Paris 2024 LEARN MORE The Coca‑Cola Company Launches Olympic and Paralympic Games Campaign for North America Featuring Versatile Roster of Athletes and Brands LEARN MORE Hello World: The Coca‑Cola Company Teams Up with the International Olympic Committee to Debut All-New Soundtrack of the Olympic Games Featuring Global Music Superstars LEARN MORE Previous Next Pause Play Team Coca‑Cola Powerade It's magic Paralympic Hello World "HELLO WORLD" MUSIC COLLABORATION The Coca‑Cola Company has teamed up with the International Olympic Committee (IOC) on a new music collaboration to connect people and inspire them to embrace their differences and unite in the celebration of music and sports. The new song, “Hello World (Song of the Olympics™)”, captures the exciting and celebratory spirit of the Olympic Games. “Hello World” is written and produced by Grammy-award winning songwriter, Ryan Tedder, and is performed by Gwen Stefani and Anderson .Paak, uniting renowned voices for Paris 2024 and beyond. FOLLOW US ON OUR JOURNEY TO PARIS 2024 View this post on Instagram A post shared by Coca‑Cola (@cocacola) View this post on Instagram A post shared by Coca‑Cola (@cocacola) View this post on Instagram A post shared by Coca‑Cola (@cocacola) CELEBRATE EVERYDAY GREATNESS WITH COCA-COLA Every day brings moments of greatness that shape our world. At The Coca‑Cola Company, we're proud to highlight these moments through our partnership with the Olympic and Paralympic Games. From personal achievements to community efforts, greatness is everywhere. Let's honor these moments, bring people together, and inspire a brighter tomorrow. Celebrate with us. Together, we refresh the world and make a difference!'''
