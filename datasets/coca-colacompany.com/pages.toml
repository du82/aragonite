["https://coca-colacompany.com/social/project-last-mile"]
title = "Project Last Mile"
description = "Project Last Mile is The Coca-Cola Company’s pioneering partnership to strengthen health systems across Africa by leveraging our distribution and system network. Read more from The Coca-Cola Company."
full_description = "PROJECT LAST MILE Home Social Project Last Mile Project Last Mile is The Coca‑Cola Company’s pioneering partnership to strengthen health systems across Africa by leveraging our distribution and system network. This is achieved by working with global donors and African governments. Without life-saving medicines, people in Africa experience avoidable loss of life from treatable diseases like HIV/AIDS, TB and malaria or from diseases that could be prevented by vaccines or by proactively accessing essential health services. The Challenge Project Last Mile Faces​ Project Last Mile believes life-saving medicines should be available to all people, regardless of where they live. ​ In Africa, nearly 50% of people lack access to critical medicines. The program is working to change that. Systemic Barriers​ Across Africa, governments and donors are investing billions to strengthen health systems and make affordable medicines available. However, traditional supply chains often struggle to get medicines and supplies to the health facilities and people who need them most. In addition, they often lack marketing skills to communicate the health services available, resulting in health facilities with medicines and services, but no patients.​ Partnership Approach​ African governments and the private sector coming together with a common goal, to make sure life-saving medicines and health services are in reach of every person in Africa​. Leveraging Coca‑Cola's Network​ A powerful cross-sector partnership by leveraging and sharing the Coca‑Cola system’s reach and business strength. ​ This supports and enables what public health departments are already doing to get medicines to the public and strengthen health systems.​ Previous Next Systemic Barriers​ Partnership Approach​ Leveraging Coca‑Cola's Network​ Partnering Project Last Mile works with a national Ministry of Health in enhancing the work they have already done in improving the health system capacity.​ Planning Project Last Mile conducts in-depth scoping with stakeholders in each country to understand local context and design programs to meet the unique needs of country partners.​ Transferring Skills Project Last Mile transfers skills and knowledge from the Coca‑Cola system and builds the capacity of Ministry of Health partners to improve the availability of life-saving medicines and helps to improve the uptake of related essential services.​ Help Project Last Mile by Getting Involved​ Project Last Mile believes partnerships and collaboration can help put life-saving medicines in reach of every person in Africa. Visit the site to learn more and to share their social media stories. Project Last Mile Website Project Last Mile Global Partners Related Content Coca‑Cola Collaborates with Tech Partners to Create Bottle Prototype Made from 100% Plant-Based Sources Read More Coca‑Cola Launches ‘Real Magic’ Brand Platform, Including Refreshed Visual Identity and Global Campaign Read More Iteration, for Good: How Project Last Mile is Supporting COVID-19 Vaccine Distribution in Africa and Beyond Read More"
