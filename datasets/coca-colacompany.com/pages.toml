full_description = "OUR MILITARY COMMUNITY Home Careers Career Areas Military The Coca‑Cola System has a proud legacy of support and partnership with the United Service Organizations. Generation after generation, our veterans and their families have put their nation and the needs of others ahead of themselves. We are proud of our U.S. military community employees and provide an inclusive culture to ensure career success. Search our jobs for career opportunities that will utilize your military skills and experiences. EXPLORE The Coca‑Cola System has a proud legacy of support and partnership with the United Service Organizations. We provide support to our veteran employees with our Military Inclusion Network. This team of professionals connects veterans, their families and military supporters to help veterans succeed in the workplace. Beyond our organization, the group is committed to continuing the mission of service by assisting external veterans and local communities. Veteran Resources Related Content Coca‑Cola Collaborates with Tech Partners to Create Bottle Prototype Made from 100% Plant-Based Sources Read More Coca‑Cola Launches ‘Real Magic’ Brand Platform, Including Refreshed Visual Identity and Global Campaign Read More Iteration, for Good: How Project Last Mile is Supporting COVID-19 Vaccine Distribution in Africa and Beyond Read More"
