full_description = '''{"@context":"https://schema.org/","@type":"Social - Article","headline":"Leadership Council","description":"Our Leadership Councils are executive-sponsored councils to ensure we are creating an inclusive environment that supports the Office of Diversity and Inclusion’s strategy to engage, recruit, develop, retain and advance female and diverse talent. Read more about The Coca-Cola Company's Diversity & Inclusion policies. ","datePublished":"","author":{"@type":"Organization","name":"The Coca-Cola Company","url":"coca-colacompany.com"}} Home Social Impact Diversity, Equity and Inclusion Leadership Council Diversity Leadership Councils Our executive-sponsored Leadership Council was created to ensure we are creating an inclusive environment, and it is available to all employees to participate in. Global Women's Leadership Council (GWLC) The Global Women’s Leadership Council is comprised of leaders across the company to help drive its global talent strategy of reflecting the broad range of consumers and markets we serve around the world. The Council aims to help all our talent thrive by building a robust pipeline of qualified talent. It facilitates and promotes resources such as mentoring and skills-based education. Related Content Coca‑Cola Collaborates with Tech Partners to Create Bottle Prototype Made from 100% Plant-Based Sources Read More Coca‑Cola Launches ‘Real Magic’ Brand Platform, Including Refreshed Visual Identity and Global Campaign Read More Iteration, for Good: How Project Last Mile is Supporting COVID-19 Vaccine Distribution in Africa and Beyond Read More'''
