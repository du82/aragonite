["https://coca-colacompany.com/media-center/coca-cola-launches-masterpiece-campaign"]
title = "Coca-Cola Brings Together Iconic Andy Warhol Painting with Illustrious Roster of Master Classics and Contemporary Works in New Global ‘Masterpiece’ Campaign"
description = "The latest expression of the “Real Magic” brand platform celebrates how Coca-Coca provides uplifting refreshment in moments that matter.  Check out this story and more news from The Coca-Cola Company."
full_description = '{"@context":"https://schema.org/","@type":"Media Center - Article","headline":"Coca-Cola Brings Together Iconic Andy Warhol Painting with Illustrious Roster of Master Classics and Contemporary Works in New Global ‘Masterpiece’ Campaign","description":"The latest expression of the “Real Magic” brand platform celebrates how Coca-Coca provides uplifting refreshment in moments that matter. Check out this story and more news from The Coca-Cola Company.","datePublished":"2023-03-06T00:00:00.000+08:00","author":{"@type":"Organization","name":"The Coca-Cola Company","url":"coca-colacompany.com"}} Coca‑Cola Brings Together Iconic Andy Warhol Painting with Illustrious Roster of Master Classics and Contemporary Works in New Global ‘Masterpiece’ Campaign 03-06-2023 An ice-cold bottle of Coca‑Cola journeys from canvas to canvas—starting with Andy Warhol’s 1962 Coca‑Cola [4] and continuing to a refreshingly diverse and culturally rich mix of classic and contemporary paintings before ultimately landing in the hands of an art student in need of creative inspiration—in a new global campaign titled “Masterpiece”. The latest expression of the “Real Magic” brand platform celebrates how Coca-Coca provides uplifting refreshment in moments that matter. The campaign’s creative centerpiece is a short film set in an art museum, where students are sketching select paintings on display. As one student appears uninspired, an arm from a painting reaches across the gallery to grab the Coke bottle from Warhol’s pop-art masterpiece. From there, it’s relayed from works including JMW Turner’s “The Shipwreck”, Munch’s “The Scream” (re-colored lithograph) and Van Gogh’s “Bedroom in Arles” before finally landing with Vermeer’s “Girl with a Pearl Earring”, whose subject opens the bottle for the student in need of inspiration and refreshing upliftment. In addition to these universally recognized paintings from the past century, the film bridges the worlds of classical and contemporary art by featuring work from emerging creators from Africa, India, the Middle East and Latin America. “‘Masterpiece’ is not a story in which Coke appears… Coke is the story,” said Pratik Thakar, Global Head of Creative Strategy and Integrated Content for Coca‑Cola.“True to the spirit of the brand—and not unlike the way a synchronized supply chain collaborates to seamlessly deliver ice-cold Coca‑Cola to consumers at just the right time—a diverse collection of artwork spanning multiple genres, geographies and generations comes together to uplift a slumping teenager. Creating human connection and bringing enchantment to everyday moments is what ‘Real Magic’ is all about.” Coca‑Cola has served as a medium-agnostic muse for decades, with artists reimagining its iconic bottle and brand attributes. Warhol’s authentic celebration of work provided the jumping-off point for the film, which curates a creative collision of centuries of art movements and masters from the past and present. “We are excited to connect with Coca‑Cola to showcase one of Andy Warhol’s most iconic works alongside some of the world’s most universally loved masterpieces,” said Michael Dayton Hermann, Director of Licensing, Marketing, and Sales at The Andy Warhol Foundation for the Visual Arts. “These pieces, paired with works by emerging artists from around the globe, celebrate the inspirational power of visual art through the magical lens of Coca‑Cola.” “Masterpiece” also includes an online gallery featuring interviews with emerging artists from the nearly two-minute hero film, as well as 3-D billboards and a series of digital collectibles. The campaign launches this month in Latin America, followed by Asia and other markets later this year. Related Content Coca‑Cola Collaborates with Tech Partners to Create Bottle Prototype Made from 100% Plant-Based Sources Read More Coca‑Cola Launches ‘Real Magic’ Brand Platform, Including Refreshed Visual Identity and Global Campaign Read More Iteration, for Good: How Project Last Mile is Supporting COVID-19 Vaccine Distribution in Africa and Beyond Read More'
year_published = 2023
clearnet = "https://coca-colacompany.com/media-center/coca-cola-launches-masterpiece-campaign"
