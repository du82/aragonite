full_description = "OUR COMMITMENT TO HUMAN RIGHTS Home Social Human Rights Respect for human rights is central to how we do business. Our human rights commitment is deep and longstanding. We were one of the first companies to endorse the United Nations Guiding Principles (UNGPs) on Business and Human Rights, the definitive voluntary standards on corporate human rights responsibility. We have strived to build a comprehensive human rights oversight program consisting of due diligence, continuous engagement, and innovative programming to help reinforce our commitment to respecting human rights across our value chain. The Coca‐Cola Company’s dedicated Global Human Rights team collaborates with leaders across the company and the Coca‑Cola system to embed respect for human rights in everything we do. We strive always to be and do better, with one constant aim: to create a better shared future. Our commitment is brought to life through our strategy Real IMPACT, which embodies our vision for the future of human rights at The Coca‑Cola Company. That vision inspires an array of programs and initiatives designed to help create a better tomorrow. Click here for our 2023 progress. Our Vision for a Better Tomorrow Our Real IMPACT framework is designed to help ensure that The Coca‑Cola Company remains at the forefront of responsible business practices and advances positive human rights impacts. Central to this framework are our efforts to bring change to the lives of those we touch around the world. Our Real IMPACT framework is grounded in three signature initiatives: IMPACT Work, IMPACT Agriculture and IMPACT Innovation. IMPACT Work IMPACT Work seeks to advance work with dignity across our value chain — from upstream supply chain workers and our 700,000+ system employees to downstream collection workers supporting recycling around the world. IMPACT Agriculture Agriculture is the heart of our company’s products and is linked to many of our most salient human rights risks. We work with key stakeholders to drive meaningful improvements in the lives of the people touched by our suppliers in the agricultural value chain. IMPACT Innovation Innovation is the beacon for The Coca‑Cola Company’s human rights program. IMPACT Innovation is designed to pursue cutting-edge due diligence, remedy and impact programs by investing in technology and exploring creative partnerships with stakeholders and peers. More About Human Rights Human Rights Governance We operationalize our commitment with policies, due diligence, oversight, and disclosure. LEARN MORE Related Content Coca‑Cola Collaborates with Tech Partners to Create Bottle Prototype Made from 100% Plant-Based Sources Read More Coca‑Cola Launches ‘Real Magic’ Brand Platform, Including Refreshed Visual Identity and Global Campaign Read More Iteration, for Good: How Project Last Mile is Supporting COVID-19 Vaccine Distribution in Africa and Beyond Read More"
