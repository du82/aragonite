full_description = "Home About Us Coca‑Cola History Coca‑Cola’s Sustainability History Coca‑Cola's Sustainability History Since 1917, the company’s sustainability efforts have covered a wide range of topics including: water, packaging, emissions, agriculture, portfolio, and people and communities. Such efforts began over 100 years ago with our partnership with the Red Cross in 1919 and have since become an integral part of our business. The history of sustainability in The Coca‑Cola Company is an indication of how far the Company has come and how much farther it can go in the future. We intend for our actions to strengthen our business and support the communities we serve, and, as we look to the future, we plan to focus investments in priority areas where we believe we can make a greater, measurable impact. See our progress Related Content Coca‑Cola Collaborates with Tech Partners to Create Bottle Prototype Made from 100% Plant-Based Sources Read More Coca‑Cola Launches ‘Real Magic’ Brand Platform, Including Refreshed Visual Identity and Global Campaign Read More Iteration, for Good: How Project Last Mile is Supporting COVID-19 Vaccine Distribution in Africa and Beyond Read More"
