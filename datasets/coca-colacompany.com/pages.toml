["https://coca-colacompany.com/social/diversity-and-inclusion"]
title = "Diversity, Equity and Inclusion"
description = """
138+
years of refreshing the world

The Coca‑Cola Company has been refreshing the world and making a difference for over 138 years. Explore our Purpose & Vision, History and more."""
full_description = "DIVERSITY, EQUITY & INCLUSION Learn about The Coca‑Cola Company's growth strategies related to diversity, equity and inclusion in communities and our workplaces worldwide. Home Social Impact Diversity, Equity and Inclusion Creating a culture of diversity, equity and inclusion. Diversity, equity and inclusion are at the heart of our values and our growth strategy and play an important part in our company's success. We leverage the remarkable diversity of people across the world to achieve our purpose of refreshing the world and making a difference. Our aspiration is not only to reflect the diversity of the markets we serve, but also to lead and advocate for a better shared future. The Coca‑Cola Company’s diversity, equity and inclusion strategy includes three long-term ambitions: These ambitions guide our efforts to create a better shared future for people. We Aspire to Develop a Workforce That Reflects the Markets We Serve It is our aspiration by 2030 to have women hold 50% of senior leadership roles at the company and in the U.S. to have race and ethnicity representation reflect national census data at all levels.​ We Enable an Inclusive Culture Where Our Employees Thrive We create affinity, allyship, community and celebration while using our brands to inspire and advocate for inclusion. We Advance Equity and Access Within Our Business, Communities, and the Marketplace We review our business, human rights, and employment policies and practices to eliminate biases and inequities. Progress on Diversity, Equity and Inclusion Learn more about our 2023 progress. Explore Diversity Leadership Council The Global Women’s Leadership Council is comprised of leaders across the company to help drive its global talent strategy of reflecting the broad range of consumers and markets we serve around the world. The Council aims to help all our talent thrive by building a robust pipeline of qualified talent. It facilitates and promotes resources such as mentoring and skills-based education. Explore Leadership Councils Employee Inclusion Networks Listening to our employees and providing resources that empower change is critical to growth. Our Inclusion Networks are focused on creating an inclusive workplace culture. Explore Employee Groups Learn More about Diversity, Equity and Inclusion Accessible Workplace Pay Equity at Coca‑Cola Equal Employment Opportunity Information Reports Throughout our history, Coca‑Cola has stood up for – and celebrated – diversity, equity and inclusion around the world​. Timeline 1934 1950s 1960s 1960s 1966 1969 1970 1986 1991 2000s 2000s 2016 2017 2019 2020 2020 2021 2021 2021 2022 First Woman on the Board First major corporation to have a woman serve on its board, Lettie Pate Evans. $25M for United Negro College Fund Coca‑Cola brings together America’s businessmen to raise $25 million for the United Negro College Fund (UNCF). The Coca‑Cola Company and The Coca‑Cola Foundation has continued to support the UNCF for 75+ years. Education contributions to American history Coca‑Cola co-sponsors education programs that highlight the contributions of blacks to America’s history. 2.5+M copies the series, featuring the stories of famous African American historical and literary figures, are distributed to schools across the country. Integrated dinner with Martin Luther King Jr. Coca‑Cola spearheaded the New South’s battle for equality and influenced many Atlanta business leaders to support an integrated dinner in Martin Luther King Jr.'s Honor post Nobel Peace Prize. African American Workplace Equality Kelvin Wall becomes the first African American leader of a pioneering initiative focused on formalizing and expanding company marketing and community relations to communities of color. He is later promoted to Vice President, becoming the first African American to hold that title at the company. First integrated ad “Boys on the Bench” advertisement remains one of Coca‑Cola’s most powerful statements about diversity and inclusion. It was the first Coke ad to feature both African American and white people together. Deepening the message of inclusion, the boys are sitting arm to arm, enjoying their bottles of Coke on a New York City segregation bench, completely unsegregated. Company’s Board of Directors William “Bill” Allison invited to join The Coca‑Cola Company’s Board of Directors, making him the first African American to serve. South Africa Human Rights Support Coca‑Cola withdrew all its business in the country to support the advancement of civil and human rights during the apartheid years. In addition, supporting the oppressed by selling all South African holdings exclusively to non-white South African investors. African American Woman elected by Board Board of Directors elects Ingrid Saunders Jones as a vice president, becoming the first African American female to hold this title. In this time the Foundation donated $100+M to education, including scholarships and programs for students of color. Employee-led Diversity Groups established Business Resource Groups formed focusing on ethnicity and evolve over the next 18 years to include Veterans, LGBTQA, Generations, Disabilities and Women. Employee-led Diversity Groups established Business Resource Groups formed focusing on ethnicity and evolve over the next 18 years to include Veterans, LGBTQA, Generations, Disabilities and Women. Launched Stand As One series To engage employee conversations and, importantly, actions about race and other difficult social conversations. Marriage Equality Coca‑Cola Australia launches a limited edition can design supporting marriage equality. Diet Coke goes #Unlabeled Diet Coke removes its labels to help Americas start a conversation about theirs. The platform sought to spark ongoing and authentic conversations about the complex – and often sensitive – topic of societal labels. Global Social Justice Framework for Action The company launched its Social Justice Framework for Action, with four pillars: Listening, Leading, Investing and Advocating. Accelerating commitment to supplier diversity Coca‑Cola announces plans to step up spending with Black-owned enterprises across its supply chain by at least $500 million over the next five years. Reflect the markets we serve including, for example, to be 50% led by women globally. Supporting LGBTIQ+ Rights in Japan Coca‑Cola Japan and five bottling partners jointly establish policies to offer the same medical and parental leave benefits to same-sex partner employees. Diversity Business Resource Groups evolve to “Inclusion Networks” Inclusion Networks are regionally structured, globally connected groups of employees with common interests or backgrounds who wish to create a better shared future for people everywhere. This evolution creates opportunity for broader reach and impact, in a more networked way. Board links DEI metrics to incentive programs The Talent and Compensation Committee of the Board of Directors approves plans to link ESG performance measures, including DEI progress, to annual and long-term incentive programs for executives. Related Content Coca‑Cola Collaborates with Tech Partners to Create Bottle Prototype Made from 100% Plant-Based Sources Read More Coca‑Cola Launches ‘Real Magic’ Brand Platform, Including Refreshed Visual Identity and Global Campaign Read More Iteration, for Good: How Project Last Mile is Supporting COVID-19 Vaccine Distribution in Africa and Beyond Read More"
