full_description = "Home About Us Our Board of Directors Ana Botin - Leadership Ana Botín Executive Chair, Banco Santander, S.A. Ms. Botín has been a Director of The Coca‑Cola Company since 2013. Ms. Botín is Executive Chair of Banco Santander, S.A., the parent bank of Grupo Santander, and has held this position since September 2014. She has served as a director of Banco Santander, S.A. since 1989. Ms. Botín served as Chief Executive Officer of Santander UK plc, a leading financial services provider in the United Kingdom and subsidiary of Banco Santander, S.A., from December 2010 to September 2014. She has served as a director of Santander UK plc since December 2010. Ms. Botín served as Executive Chair of Banco Español de Crédito, S.A., also a subsidiary of Banco Santander, S.A., from 2002 to 2010. She started her 39-year career in the banking industry at JP Morgan in New York in 1981 and in 1988 joined Banco Santander, S.A., where she established and led its international corporate banking business in Latin America in the 1990s. She previously served as a director of Assicurazioni Generali S.p.A., a global insurance company based in Italy, from 2004 to 2011. She is also a Director of Santander UK plc and Santander UK Group Holdings plc. Download bio ⇩ Download images ⇩ Next Leader"
