full_description = "OUR COMPANY On May 8, 1886, Dr. John Pemberton brought his perfected syrup to Jacobs' Pharmacy in downtown Atlanta where the first glass of Coca‑Cola was poured. From that one iconic drink, we’ve evolved into a total beverage company. More than 2.2 billion servings of our drinks are enjoyed in more than 200 countries and territories each day. We are constantly transforming our portfolio, from reducing added sugar in our drinks to bringing innovative new products to market. We seek to positively impact people’s lives, communities and the planet through water replenishment, packaging recycling, sustainable sourcing practices and carbon emissions reductions across our value chain. Together with our bottling partners, we employ more than 700,000 people, helping bring economic opportunity to local communities worldwide. Our purpose is to refresh the world and make a difference. We are committed to offering people more of the drinks they want across a range of categories and sizes while driving sustainable solutions that build resilience into our business and create positive change for the planet. See Coca‑Cola's Purpose & Vision Total Beverage Company Our beverage portfolio has expanded to more than 200 brands and thousands of beverages around the world, from soft drinks and waters, to coffee and teas. Learn more about our brands and our commitment to quality products. Explore Our Brands We aspire to reflect the markets we serve Together with our bottling partners, we employ more than 700,000 people, helping bring economic opportunity to local communities worldwide. Explore Coca‑Cola Jobs Prioritizing sustainability in our operations and communities Sustainability is core to our purpose – to Refresh the World and Make a Difference – and to our growth strategy. Learn more about our work. Learn More Here Our People Power our Purpose As a purpose-driven company, we help create a better shared future for everyone our brands and business system touches by working to provide access to equal opportunity and fostering belonging both in our workplaces and the communities we serve. Explore our Social Areas of Focus History of The Coca‑Cola Company Since its birth at a soda fountain in downtown Atlanta in 1886, Coca‑Cola has been a catalyst for social interaction and inspired innovation. Discover the unique moments from our past, like the evolution of the iconic Coca‑Cola bottle, the lovable Coca‑Cola Santa Claus, and more. Explore Coca‑Cola's History The Coca‑Cola System Local bottlers work with us to bring our Coca‑Cola brand drinks to wherever you are in the world. Over 200 bottling partners across 950 production facilities make up the Coca‑Cola system and help us deliver refreshment globally. Explore the Coca‑Cola System"
