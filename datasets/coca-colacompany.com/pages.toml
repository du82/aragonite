full_description = "Home About Us Our Board of Directors Caroline Tsay - Leadership Caroline Tsay Advisor of Tech Companies/Limited Partner of Venture Capital Funds Caroline Tsay has been a Director of The Coca‑Cola Company since April 2018. She served as Chief Executive Officer and a Director of Compute Software, Inc., a Mountain View, California-based enterprise cloud optimization software company, from January 2017 to November 2022. Ms. Tsay previously served as Vice President and General Manager of Software at Hewlett Packard Enterprise Company (HPE). Prior to HPE, Ms. Tsay held six years of product leadership roles across the consumer search, e-commerce and advertising businesses at Yahoo! Inc. Prior to joining Yahoo! in 2007, she spent three years at IBM Global Services as a senior consultant in supply chain and customer relationship management. Ms. Tsay also serves as a director for Morningstar, Inc. She has been recognized on The National Diversity Council’s Top 50 Most Powerful Women in Technology and the Silicon Valley Business Journal’s 40 Under 40. She earned a B.S. in computer science and an M.S. in management science and engineering, both from Stanford University. Ms. Tsay previously served as a director of Rosetta Stone Inc. from 2014 to July 2018. Download bio ⇩ Download images ⇩ Next Leader"
