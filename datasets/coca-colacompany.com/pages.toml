full_description = "COCA-COLA SYSTEM JOBS Home Careers Job Search System Jobs Our branded beverage products are available to consumers in more than 200 countries and territories. The Coca‑Cola global business system is composed of the Coca‑Cola company (TCCC) and 225 bottling partners. TCCC markets, manufactures and sells beverage concentrates and syrups and finished sparkling soft drinks and other beverages. Our bottling partners are independent bottling operations authorized through bottler’s agreements to prepare, package, distribute and sell finished beverages to customers and/or consumers. TCCC and its bottling partners together are collectively known as The Coca‑Cola system (TCCS), or simply “system.” Each of our bottling partners and some of our brands hire independently, so click on the logo below to view the jobs on their career sites. Explore Jobs in the Coca‑Cola System All Africa Asia Pacific Eurasia & Middle East Europe India & Southwest Asia Latin America North America Related Content Coca‑Cola Collaborates with Tech Partners to Create Bottle Prototype Made from 100% Plant-Based Sources Read More Coca‑Cola Launches ‘Real Magic’ Brand Platform, Including Refreshed Visual Identity and Global Campaign Read More Iteration, for Good: How Project Last Mile is Supporting COVID-19 Vaccine Distribution in Africa and Beyond Read More"
