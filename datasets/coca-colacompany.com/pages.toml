["https://coca-colacompany.com/sustainability/agriculture"]
title = "Agriculture"
description = """
138+
years of refreshing the world

The Coca‑Cola Company has been refreshing the world and making a difference for over 138 years. Explore our Purpose & Vision, History and more."""
full_description = "AGRICULTURE Home Sustainability Agriculture Cultivating Ingredients Better We source a wide range of ingredients from agricultural raw materials such as sugarcane, sugar beet, corn, fruits, coffee, tea and soybeans as well as pulp and paper from complex global supply chains and an expanding range of new ingredients like nuts, herbs and dairy. The quality and integrity of our products depends on a sustainable supply chain with successful and thriving farming communities and ecosystems. We believe investing in agriculture creates a nexus for solutions on interrelated issues such as human rights, water security, climate resilience, greenhouse gas (GHG) emissions reduction and women’s empowerment. We work with our suppliers and a range of partners to help create systemic change in our agricultural supply chain. 64% of our global priority ingredient volumes were sustainably sourced to our leader standard* in 2023, in line with our Principles for Sustainable Agriculture (PSA) Ensuring these ingredients are produced in a way that respects farmworkers and their communities while also protecting ecosystems is important to us. *Leader standard represents supply volume verified to a company-approved, third-party validation that is aligned with our PSA. Explore our Progress Principles for Sustainable Agriculture (PSA) We seek to work with suppliers in support of our Principles for Sustainable Agriculture (PSA), which communicate our expectations for environmental, social and economic performance for our agricultural suppliers to enforce with the farms that are selling them commodities for processing Read Our Principles Engaging our suppliers Through internal Coca‑Cola initiatives and programs with our suppliers and other third-party stakeholders, we continually seek to increase compliance with the Leader standard for the sourcing of our agricultural ingredients. We do not buy agricultural raw materials directly from farms, but mostly processed and refined ingredients from suppliers. Therefore, it is very important to us to work with our suppliers to engage their farm base, with an emphasis on collaboration and continuous improvement. We are also committed to collaboration across the wider industry and support credible third-party standards to simplify assurance and certifications for the farmers in our supply chain. For example, the Farm Sustainability Assessment of the Sustainable Agriculture Initiative (SAI) Platform, the Bonsucro sustainable cane standard and Rainforest Alliance certifications are three of the leading standards we support. In addition, we engage directly with farmers in key sourcing regions to help address material issues in our agricultural supply chain. Connections to Other Sustainability Priorities Our agriculture strategy is linked to our other priority workstreams including water, emissions, waste, women’s empowerment and human rights. Promoting Resilience Agricultural practices play a vital role in promoting resilience across our supply chain and in the communities that provide our agricultural ingredients. By investing in more water-efficient irrigation practices, our suppliers help future-proof their production to the vagaries of changing climate and rainfall patterns. By encouraging other farm practices, our suppliers increase the carbon storage capacity of their soils and limit runoff into water courses. Learn More Water We support better water management across the farm, for example by enhancing soil organic matter to hold more moisture, improving soil structure to help prevent flooding and erosion, and by improving irrigation efficiency. This also helps mitigate the effects of drought and supports the resilience of farmers and farming communities. Learn More Emissions Agriculture is a source of greenhouse gas emissions. The practices encouraged in our Principles for Sustainable Agriculture are designed to reduce those emissions and to support healthy soils that ultimately will be capable of sequestering and storing carbon. Read More Animal Health & Welfare Our business is working constantly to offer consumers new, great-tasting products. We are actively working with our global dairy businesses and suppliers on implementing relevant farm standards and procedures and to develop continuous improvement plans. Together, with internal and external stakeholders we developed our Animal Health and Welfare principles. We also collaborate with other companies in the SAI-Sustainable Dairy Partnership to develop an industry-wide dairy sustainability model. Learn More Human Rights Respect for human rights is woven through what we do at The Coca‑Cola Company. In line with the UN Guiding Principles on Business and Human Rights, we carry out human rights due diligence to identify actual or potential human rights impacts across our value chain. We regularly assess our key human rights risks to ensure we are taking steps to identify and address them and support remediation where appropriate. Learn More Women's Empowerment Women are significant contributors to the Coca‑Cola system around the world, including in our agriculture supply chain, where women play significant roles in production and post-harvest processing. Learn More Additional Sustainable Agriculture Resources 2023 CDP Forests Response Principles for Sustainable Agriculture Principles for Sustainable Agriculture Supplier Guide Supplier Guiding Principles Responsible Land Acquisition Guidance Costa Coffee Responsible Sourcing Innocent Sustainable Business Animal Health and Welfare Guiding Principles Fairlife Animal Welfare Related Content Coca‑Cola Collaborates with Tech Partners to Create Bottle Prototype Made from 100% Plant-Based Sources Read More Coca‑Cola Launches ‘Real Magic’ Brand Platform, Including Refreshed Visual Identity and Global Campaign Read More Iteration, for Good: How Project Last Mile is Supporting COVID-19 Vaccine Distribution in Africa and Beyond Read More"
