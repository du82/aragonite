["https://coca-colacompany.com/social/partnerships"]
title = "Partnerships"
description = """
138+
years of refreshing the world

The Coca‑Cola Company has been refreshing the world and making a difference for over 138 years. Explore our Purpose & Vision, History and more."""
full_description = "PARTNERSHIPS Home Social Partnerships We believe we must work together by forming meaningful partnerships with nonprofits and charitable organizations that create shared opportunities for communities and people around the world. The Coca‑Cola Company is focused on helping communities address their sustainability challenges, but we can’t do it alone. That is why we’ve formed key nonprofit partnerships with incredible organizations to progress sustainability initiatives such as women’s empowerment, water replenishment, sustainable packaging, and climate action. World Wildlife Fund (WWF) For over a decade, WWF and Coca‑Cola have partnered to improve the health of freshwater basins and the environmental performance across Coca‑Cola’s supply chain, emissions and packaging. Together, we help create a more climate-resilient and water-secure future. WWF Water Stress Program Special Olympics As a founding partner of Special Olympics since 1968, we support the Special Olympics commitment to social inclusion and programs through donations, in-kind support, volunteers and awareness initiatives. Special Olympics Partnership American Red Cross Since 1917, Coca‑Cola and the American Red Cross have teamed up to support communities in need through blood drives, disaster relief and more. The Coca‑Cola Company and The Coca‑Cola Foundation have supported the Red Cross nonprofit organization through financial support, beverage donations and employee volunteerism. Explore our Red Cross Partnership World Economic Forum We are a strategic partner of the World Economic Forum, which was founded upon the notion that corporations not only have a duty to their shareholders, but they are also responsible for all of their stakeholders – including society at-large. Explore Circular Plastics United States Agency for International Development (USAID) For the last decade, our company and USAID have partnered on 40+ projects in 30 countries and maintained the longest-standing public-private partnership in water and sanitation. Other valued partnerships Benioff Ocean Initiative at UC Santa Barbara The Benioff Ocean Initiative and The Coca‑Cola Foundation are collaborating to curb the flow of plastics from rivers to the ocean by designing and deploying innovative applications to clean up plastic in rivers across several continents. BSR BSR is a global nonprofit organization that works with its network of companies and other partners to build a just and sustainable world. Through our membership, we work to advance climate resilience, women's economic empowerment and human rights. Business for Nature Business for Nature is a global coalition bringing together influential organizations and forward-thinking businesses. Their Call to Action 'Nature is Everyone's Business' brings together more than 560 companies with revenues of US$4 trillion urging governments to adopt policies now to reverse nature loss in this decade. Circulate Capital We partner with Circulate Capital, an investment management firm dedicated to incubating and financing companies and infrastructure that prevent the flow of plastic waste into the world's oceans and advance the circular economy. Global Citizen We partner with Global Citizen, an international advocacy organization working to end extreme poverty, to drive action, empowerment and education in communities around the world. Ocean Conservancy Since 1995, The Coca‑Cola Foundation has supported Ocean Conservancy’s International Coastal Cleanup, which has removed nearly 315 million pounds of trash from beaches and waterways around the world. The Foundation is also a member of Ocean Conservancy’s Trash Free Seas Alliance®. Sustainable Agriculture Initiative (SAI) Platform SAI Platform promotes widespread adoption of sustainable agriculture practices, which is important for many beverage product ingredients. The Consumer Goods Forum (CGF) We are a long-standing member of CGF, an organization helping the world’s retailers and consumer goods manufacturers collaborate to secure consumer trust and drive positive change. The Global Fund By leveraging the expertise and network of the Coca‑Cola System, The Coca‑Cola Company and The Coca‑Cola Foundation partner with The Global Fund to improve the delivery of life-saving medicines to communities throughout Africa. United Way For 100+ years, we have supported United Way to fight for the health, education and financial stability of communities throughout the U.S. WASH4WORK WASH4WORK is a multi-stakeholder initiative to mobilize business for improved access to water, sanitation and hygiene (WASH) in the workplace, in communities, and across supply chains. It aims to align and coordinate efforts to achieve the Sustainable Development Goals. CEO Water Mandate and its Water Resilience Coalition The CEO Water Mandate is a UN Global Compact initiative that mobilizes business leaders to address global water challenges. In March 2020, the Mandate launched the Water Resilience Coalition, an initiative to preserve the world’s freshwater resources through collective action in water-stressed basins and ambitious, quantifiable commitments. 2030 Water Resources Group We are a founding partner of the 2030 Water Resources Group, a global partnership that supports country-level collaboration to achieve water security by government, business and civil society. Previous Next Benioff Ocean Initiative at UC Santa Barbara BSR Business for Nature Circulate Capital Global Citizen Ocean Conservancy Sustainable Agriculture Initiative (SAI) Platform The Consumer Goods Forum (CGF) The Global Fund United Way WASH4WORK CEO Water Mandate and its Water Resilience Coalition 2030 Water Resources Group Related Content Coca‑Cola Collaborates with Tech Partners to Create Bottle Prototype Made from 100% Plant-Based Sources Read More Coca‑Cola Launches ‘Real Magic’ Brand Platform, Including Refreshed Visual Identity and Global Campaign Read More Iteration, for Good: How Project Last Mile is Supporting COVID-19 Vaccine Distribution in Africa and Beyond Read More"
