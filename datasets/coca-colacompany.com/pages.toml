full_description = "Home About Us Our Board of Directors Maria Elena Lagomasino - Leadership Maria Elena Lagomasino Chief Executive Officer and Managing Partner, WE Family Offices Maria Elena Lagomasino has been a Director of The Coca‑Cola Company since 2008 and was the Lead Independent Director from April 2019 to July 27, 2024. Ms. Lagomasino is the Chief Executive Officer and Managing Partner of WE Family Offices, a global family office serving high net worth families, and has held these positions since March 2013. Ms. Lagomasino served as Chief Executive Officer of GenSpring Family Offices, LLC, an affiliate of SunTrust Banks, Inc., from November 2005 through October 2012. From 2001 to 2005, Ms. Lagomasino was Chairman and Chief Executive Officer of JPMorgan Private Bank, a division of JP Morgan Chase & Co., a global financial services firm. Prior to assuming this position, she was Managing Director of The Chase Manhattan Bank in charge of its Global Private Banking Group. Ms. Lagomasino had been with Chase Manhattan since 1983 in various positions in private banking. She served as a Director of the Company from April 2003 to April 2006. She is also a Director of The Walt Disney Company. Download bio ⇩ Download images ⇩ Next Leader"
