full_description = '''1924-2024 Jimmy Carter To honor and support President Carter's legacy of community work, The Coca‑Cola Foundation will contribute $250,000 to The Carter Center and $250,000 to Habitat for Humanity. Learn More Previous Next Pause Play Jimmy Carter Always Innovating Water Leadership Refreshingly Local Brands Our Sustainability Goals and Progress Our Sustainability Progress We build loved brands that bring joy to our consumers’ lives with beverage choices for all occasions, tastes and lifestyles. Our growth strategy is grounded in our core values and commitment to social and environmental responsibility. See our Progress Sustainability Resource Center At The Coca‑Cola Company, our sustainability goals and initiatives are anchored by our purpose — to refresh the world and make a difference — and are core to our growth strategy. Get an overview of our efforts to help create a more sustainable business and better shared future. Explore the Resource Center Featured News Coca‑Cola and the OREO® Brand Team Up for Limited-Edition Drink and Cookie The two “bestie” brands have collaborated to offer fans unique flavor experiences that celebrate the “Real Magic” of friendship. Explore the collab How The Coca‑Cola System Refreshes Local Economies and Communities in Markets Around the World The Coca‑Cola system creates local jobs to make, distribute and sell our drinks that refresh local communities. Explore Jack Daniel's and Coca‑Cola RTD Launches in US Jack Daniel’s & Coca‑Cola RTD – a pre-mixed, canned cocktail that first launched last fall in Mexico – is set to hit stores in the United States. Explore Previous Next Besties for a limited time Economic Impact Jack & Daniels and Coca‑Cola RTD Launches in US Coca‑Cola Company Jobs We seek employees that embrace change, champion diversity and push for progress. Your skills and experience will help us navigate the ever-changing global landscape and guide us into the next chapter and beyond. Explore Jobs A Purpos