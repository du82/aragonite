["https://coca-colacompany.com/about-us/coca-cola-system"]
title = "The Coca-Cola System"
description = """
138+
years of refreshing the world

The Coca‑Cola Company has been refreshing the world and making a difference for over 138 years. Explore our Purpose & Vision, History and more."""
full_description = '''THE COCA-COLA SYSTEM Home About Us The Coca‑Cola System We are a global business that operates on a local scale, in every community where we do business. We are able to create global reach with a local focus because of the strength of the Coca‑Cola supply chain, which comprises our company and our bottling partners worldwide. While many view our company as simply "Coca‑Cola," our system operates through multiple local channels. The primary way that our products reach the marketplace starts with Coca‑Cola, which manufactures and sells concentrates, beverage bases and syrups to bottling operations. Coca‑Cola also owns the brands and is responsible for consumer brand marketing initiatives. Our Coca‑Cola bottling partners manufacture, package, merchandise and distribute final branded beverages to our customers and vending partners, who then sell our products to consumers. All bottling partners work closely with customers – grocery stores, restaurants, street vendors, convenience stores, movie theaters and amusement parks, among many others – to execute localized strategies developed in partnership with our company. Customers then sell our products to consumers at a rate of 2.2 billion servings a day. How We Operate The Coca‑Cola Company markets, manufactures and sells: Beverage concentrates and syrups; and, Finished beverages (including sparkling soft drinks; water, sports, coffee & tea; juice, value-added dairy & plant-based beverages; and emerging beverages). The Coca‑Cola Company and its bottling partners are collectively known as the Coca‑Cola system. The Coca‑Cola Company does not own, manage or control most local bottling companies. In our concentrate operations, The Coca‑Cola Company typically generates net operating revenues by selling concentrates and syrups to authorized bottling partners. Our bottling partners combine the concentrates with still and/or sparkling water, and/or sweeteners, depending on the product, to prepare, package, sell and distribute finished beverages. Our finished product operations consist primarily of company-owned or -controlled bottling, sales and distribution operations. Bottling Investments Group Our current footprint of bottlers exists in South East and South West Asia and parts of Africa. We continue to drive strong performance within BIG while maximizing the returns on our investments. We continue to aspire to be the world’s smallest bottler by looking for the right partner, at the right time, with the right value proposition. Bottling Partners Africa Atlas Bottling Company BGI Castel Bonite Bottlers Coca‑Cola Beverages Africa Coca‑Cola HBC DAL Group Delta Corporation Limited Equatorial CCBC Etablissements S A Coubeche Forbes Group Heineken Hyper Psaro Group Ka-Mur Beverages Services Limited Phoenix Camp Minerals Schweppes Holdings Africa Ltd Shah Group Société Des Boissons Gazeuses Du Souss Somaliland Beverage Industries The Coca‑Cola Bottling Co. Of Egypt S.A.E. United Bottling Company Europe Carlsberg Breweries Coca Cola HBC Coca‑Cola Bottling Shqiperia sh.p.k. (Albania) Coca‑Cola Europacific Partners SIBEG SRL The General Soft Drinks Co., Ltd. (Malta) Japan & South Korea Coca‑Cola Beverages Korea Coca‑Cola Bottlers Japan Holdings,Inc. Hokkaido Coca‑Cola Bottling Co., Ltd. Hokuriku Coca‑Cola Bottling Co., Ltd Michinoku Coca‑Cola Bottling Co., Ltd. Okinawa Coca‑Cola Bottling Co., Ltd. ASEAN & South Pacific BIG TCCC Brasserie de Tahiti Capelle & Partner Coca‑Cola Europacific Partners Haad Thip, Ltd Samoa Breweries Societe Le Froid ThaiNamthip Limited Vanuatu Beverages (owned by Societe Le Froid) Greater China & Mongolia COFCO Coca‑Cola Beverages Ltd Macau Coca‑Cola Beverage Company Ltd MCS Coca‑Cola LLC Swire Coca‑Cola Ltd Latin America ABI Honduras (Cervecería Hondureña) Arca Continental, S.A.B. de C.V. Bandeirantes Banks DIH Limited (Guyana) Bebidas Refrescantes de Nogales S.A. de C.V. BEPENSA Bebidas Bowen & Bowen Ltd (Belize) Brasal Brasserie de la Couronne (Hait