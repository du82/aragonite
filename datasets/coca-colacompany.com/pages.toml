The Coca‑Cola Company has been refreshing the world and making a difference for over 138 years. Explore our Purpose & Vision, History and more."""
full_description = "SUSTAINABILITY Home Sustainability As a total beverage company, we are driven by our purpose to refresh the world and make a difference. We aim to grow our business in ways that drive positive change and build a more sustainable future for our planet. Our Environmental Progress See our latest updates in the areas of water, packaging, climate and agriculture. Explore Prioritizing water replenishment Since 2015, we have returned more than 100% of the water used in our finished products globally, on an aggregate level, to nature and communities. Moving forward, we will also seek to return 100% of the total water used in each of our more than 200 high-risk locations* across the Coca‑Cola system by 2035. Explore Giving people options and choices From sparkling water to dairy, to refreshing soft drinks and natural juice, we offer over 200 brands worldwide, including reduced-sugar drinks and smaller packages. Explore Helping to Reduce Packaging Waste We aim to help ensure the collection of 70% to 75% of the equivalent number of bottles and cans we introduce into the market annually by 2035. Explore Reducing emissions We set a target to reduce our Scope 1, 2 and 3 emissions in line with a 1.5°C trajectory by 2035, from a 2019 baseline**. Explore Our Areas of Focus Water We promote water stewardship to increase water use efficiency and treat and return safe water to communities. Explore In Our Products We provide high-quality products and cutting-edge ingredients sourced sustainably. Explore Agriculture Thriving farmers and farming communities are critically important for our supply chain. Our ability to deliver quality products depends on having a sustainable and secure supply of agricultural ingredients. Explore Emissions We believe we have a responsibility to contribute solutions by reducing emissions in our own operations and encouraging emissions reductions in our value chain. Our actions on water and packaging can also help mitigate the impacts caused by climate change. Explore Product Quality & Safety Quality, food safety and regulatory compliance are cornerstones of our dedication to perfect product, trusted everywhere. Explore Packaging We offer beverages in a variety of packaging formats – glass and plastic bottles, aluminum cans and refillable packaging. Each option can play a role in helping reduce packaging waste and emissions. We are focusing efforts to use more recycled material in primary packaging along with supporting collection rates, both of which require enabling policies and the growth of collection infrastructure. Explore Previous Next Water In Our Products Agriculture Emissions Product Quality & Safety Packaging *Locations were identified following an extensive analysis updated in 2024 using the World Resources Institute Aqueduct 4.0 tool and Coca‑Cola system level assessments of each production facility. The Coca‑Cola system is made up of over 200 bottling partners and 950 production facilities. For the assessment of high-risk locations, the number of facilities evaluated was approximately 720 locations as it does not include third-party contracted manufacturers. **Excluding the company’s acquired businesses, including BODYARMOR, CHI, Costa, doğadan, fairlife and innocent. The company expects to prepare these businesses for integration into its 1.5°C trajectory over time. Related Content Simply Mixology Raises the Bar of the At-Home Mocktail and Cocktail Experience Read More DASANI and Sprite Boost Sustainability Packaging Credentials in North America Read More A Deeper Look at Coca‑Colas Emerging Business in Alcohol Read More"
