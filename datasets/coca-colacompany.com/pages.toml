["https://coca-colacompany.com/social/diversity-and-inclusion/employee-groups"]
title = "Employee Groups"
description = "Our Inclusion Networks are voluntary employee-led teams that serve as resources related to diversity initiatives, programming, cultural heritage idea development, business integration, and recruitment. Read more about The Coca-Cola Company's Diversity & Inclusion policies."
full_description = '''{"@context":"https://schema.org/","@type":"Social - Article","headline":"Employee Groups","description":"Our Inclusion Networks are voluntary employee-led teams that serve as resources related to diversity initiatives, programming, cultural heritage idea development, business integration, and recruitment. Read more about The Coca-Cola Company's Diversity & Inclusion policies. ","datePublished":"","author":{"@type":"Organization","name":"The Coca-Cola Company","url":"coca-colacompany.com"}} Home Social Diversity, Equity and Inclusion Employee Groups Employee Groups Employees' voices are critical to the advancement of our global talent strategy. Our Inclusion Networks, available to all employees, are an integral part of the overall talent strategy at The Coca‑Cola Company. They are employee-led, company-recognized networks formed to act as a resource to both employees and the organization. They are regionally structured, globally connected groups for all employees who wish to create a better shared future for people everywhere. We support these networks as they operate with passion and serve as a strong catalyst for: A sense of affinity, allyship, community and celebration that enhances our ability to recruit, retain, engage and develop diverse talent Enabling the voice of diverse communities to be heard both within the company and across the Coca‑Cola system, and highlighting social and societal issues that affect those communities A diverse sounding board for business strategies and initiatives, capturing input on potential actions through the lens of inclusion The groups outlined below are U.S.-based, and many of them have membership from around the world. Other regions will have their own unique Inclusion Networks based on their business and employees’ respective U.S. Based Inclusion Networks Asian Inclusion Network The Asian Pacific Inclusion Network grows, inspires and influences the Coca‑Cola business, our associates and the community through innovative leadership, knowledge-sharing and leadership development. Black Employee Network The Black Employee Network provides opportunities for personal and professional growth for all associates through the execution of learning forums, development workshops and events that build cultural competency to encourage associates to bring their authentic self to work. Hispanic + Leadership Inclusion Network The Hispanic + Leadership Inclusion Network enables The Coca‑Cola Company to capture business opportunities and accelerate growth in the U.S. Hispanic market by recruiting, retaining and developing the best Hispanic talent and by sharing Hispanic culture and insights across the organization. KO-Gen Inclusion Network The KO-Gen Inclusion Network brings Coca‑Cola professionals of all generations together to mutually advance each other’s careers and drive growth and success. LGBTQ + Allies Inclusion Network The LGBTQ + Allies Inclusion Network fosters an equitable, inclusive and engaging work environment where LGBTQ + Allies employees are valued for their contributions to the business and are free to participate fully without fear of reprisal or discrimination of any kind. Military Veterans Inclusion Network The Military Veterans Inclusion Network connects veterans, their family members and military supporters to help veterans succeed in the workplace, while continuing the mission of service to others by assisting external veterans and the local community. This-Ability Inclusion Network The This-Ability Inclusion Network serves as a thought leader on the area of disabilities insights and an advocate for a winning and inclusive culture, where inclusion is prioritized and diversity is respected both inside the company and in the markets we serve. Women's LINC Inclusion Network The women's LINC Inclusion Network helps to advance women in their career and contribute to the business through peer-to-peer counseling and resources, trainings, inspiring talks and more. Business Forums Business forums provide networking, volunteerism and professional development opportunities focused on specific industries/skillsets. Three of Coca‑Cola's Business Forums are Coca‑Cola Administrative Professionals (CCAP), Coca‑Cola Technology Association of Georgia (TAG) and Coca‑Cola Women in STEM (CWIS). Coca‑Cola Administrative Professionals (CCAP) CCAP's mission is to deliver added value to The Coca‑Cola Company and its employees by providing office and business support excellence. We achieve this level of excellence through professional development opportunities; networking and sharing best practices; and fostering a sense of community—all in support of the company’s business strategies. Coca‑Cola Technology ​​​​​​​Association of Georgia (TAG) TAG’s mission is to educate, promote, influence, and unite Georgia’s technology community to foster an innovative and connected marketplace that stimulates and enhances Georgia’s tech-based economy. Coca‑Cola employees have access to TAG’s many benefits, such as connecting to the 30,000+ members in the TAG community and growing their skills in TAG workshops. Coca‑Cola Women in STEM (CWIS) The mission of CWIS is to contribute to the talent pipeline at The Coca‑Cola Company by raising awareness of STEM (Science, Technology, Engineering and Math) opportunities and by empowering, educating and inspiring women to excel in leadership under the STEM umbrella. Related Content Coca‑Cola Collaborates with Tech Partners to Create Bottle Prototype Made from 100% Plant-Based Sources Read More Coca‑Cola Launches ‘Real Magic’ Brand Platform, Including Refreshed Visual Identity and Global Campaign Read More Iteration, for Good: How Project Last Mile is Supporting COVID-19 Vaccine Distribution in Africa and Beyond Read More'''
