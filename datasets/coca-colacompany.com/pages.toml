full_description = "Home About Us Our Board of Directors Amity Millhiser - Leadership Amity Millhiser Director, The Coca‑Cola Company Amity Millhiser has been a director of The Coca‑Cola Company since July 2023. She previously served as a partner and Vice Chair at PricewaterhouseCoopers LLP, working as a senior counsel for clients ranging from high-growth startups to market-leading multinationals. Earlier, Millhiser served as Chief Clients Officer and as a member of PwC’s U.S. Leadership Team, where she was responsible for overseeing key client relationships and driving growth through PwC’s 15-plus industries and 90-plus U.S. markets. Millhiser founded the firm’s Switzerland-based Transaction Services Practice, a Center of Excellence for U.S./European cross-border deals, and served as the Market Managing Partner of PwC’s Silicon Valley practice. She has deep transaction experience that includes acquisitions, divestitures, capital market transactions and IPOs and has been one of the U.S. firm’s leading advisers on digital and emerging technologies as well as digital and organizational transformations. She retired from PwC in June 2023. Millhiser is a vocal advocate for women in leadership. She was recognized as one of the National Diversity Council’s Top 50 Most Powerful Women in Technology in 2015 and one of Silicon Valley’s Women of Influence in 2012. Millhiser is a graduate of the University of California at Berkeley. Download bio ⇩ Download images ⇩ Next Leader"
