ing. Next, find your desired product and flavor from the options shown on the product brand page and click on “Shop Now” next to your selection to launch the locator. Thank you for visiting our Contact Us page. We look forward to addressing your question. Please provide us as much information as possible which will aid us in meeting and exceeding our speed of Care Services. Country United States Canada Other You can find nutritional information here. Navigate through the list of brands then click the plus sign next to the brand name then further expand to view package sizes. Click on a package size to view full information. We recommend contacting your local country or region offices for questions, feedback and comments. Here is a list of the sites to learn more https://www.coca-cola.com/country-selector Do you still have the affected product? Yes No Please look for the date code from the package. The complete date code is located on the bottom of cans, near the neck or shoulder of bottles, and on the top of cartons and pouches and is similar to United States - FEB0130XPG12345 or Canada - FE0130XPG12345. Please enter the date code from the package What is the brand? Select Brand Coca-Cola Coca-Cola Zero Sugar Coca-Cola Store AHA Bacardi Mixers Barq's Core Power Dasani Diet Coke Dunkin' Ready To Drink Fairlife Fanta Fresca Fuze Gold Peak Hi-C Honest Hubert's Lemonade Mello Yello Minute Maid Moxie Peace Tea Pibb Xtra Powerade Seagram's Simply Smartwater Sprite Topo Chico Tum-e Yummies Vitaminwater Surge Tab What is the flavor? What packaging is the beverage in? Can Bottle Carton Pouch Other What is the drink size? 7.5oz 8oz 12oz / 355ml 341ml 15oz / 473ml Other What is the type of bottle? Aluminum Glass Plastic What is the bottle size? 295 ml / 10 oz 355 ml / 12 oz 500 ml / 20 oz 710 ml / 24oz 1 L / 34 oz 1.75 L / 59 oz 2 L / 67 oz Other What is the drink size? 7.5oz 8oz 12oz / 355ml 341ml 15oz / 473ml Other What is the drink size? 6oz 6.75oz Other How many products a