full_description = "← Back to The Coca‑Cola System Coca‑Cola HBC Overview Coca‑Cola HBC was established in Nigeria in 1951. Today, we are a growth-focused consumer packaged goods business and strategic bottling partner of The Coca‑Cola Company. We open up moments that refresh us all, by creating value for our stakeholders and supporting the socio-economic development of the communities in which we operate. With a vision to be the leading 24/7 beverage partner, we offer drinks for all occasions around the clock and work together with our customers to serve 740 million consumers across a broad geographic footprint of 29 countries. Our portfolio is one of the strongest, broadest and most flexible in the beverage industry, with consumer-leading beverage brands in the sparkling, adult sparkling, juice, water, sport, energy, ready-to-drink tea, coffee, and premium spirits categories. These include Coca‑Cola, Coca‑Cola Zero Sugar, Fanta, Sprite, Schweppes, Kinley, Costa Coffee, Caffè Vergnano, Valser, FuzeTea, Powerade, Cappy, Monster Energy, Finlandia Vodka, The Macallan, Jack Daniel’s and Grey Goose. Coca‑Cola HBC has a premium listing on the London Stock Exchange (LSE:CCH) and is listed on the Athens Exchange (ATHEX:EEE). For more information, please visit https://www.coca-colahellenic.com. We rank with leading scores among the top sustainability performers in ESG benchmarks such as the Dow Jones Sustainability Indices, CDP, MSCI ESG, FTSE4Good and ISS ESG. Coca‑Cola HBC community support We foster an open and inclusive work environment amongst our 32,000 employees and believe that building a more positive environmental impact is integral to our future growth. We always seek to positively impact people’s lives in the communities in which we operate. We support communities in need with product donations, volunteering initiatives and disaster relief activities. We have prioritised areas for community support that are of critical importance across all of our 29 countries of operation: Human rights, diversity and inclusionEmployee wellbeing and engagementCorporate citizenshipPackaging and waste managementEmpowering youth and womenWater stewardship initiativesEconomic impact. Within these areas by 2025 we aim to do the following: Train one million young people through our flagship community project #YouthEmpowered to prevent and combat youth unemployment. By the end of 2022, we trained within the project over 790,000 young people since its launch in 2017.Engage in 20 Zero Waste partnerships (city and/or coast). By the end of 2022 we were engaged in 14 already.Help secure water availability for all our communities in water-risk areas. By the end of 2022 eight such projects were launched, several of them with the support of The Coca‑Cola Foundation.Ensure 10% of community participants are in first-time managers’ development programmes. We reached 9% in 2022.Increase the number of employees volunteering in local communities to 10%. We reached 10% in 2022. Through the socio-economic impact studies that we perform in each of our markets with The Coca‑Cola Company, we understand how our activities benefit economies and societies and our total contribution to the domestic economy, local communities and employment. Notes on methodology Numbers presented are aggregated based on the local socio-economic studies from Coca‑Cola HBC markets published between 2018 and 2022.All KPIs represent annual impact.If applicable and relevant in local socio-economic studies, the impact of other entities of the Coca‑Cola System is included."
