["https://cocoapods.org/about"]
title = "CocoaPods.org"
description = "The Dependency Manager for iOS & Mac projects."
full_description = '''Define once, update easilyCreate a Podfile describing the code you'd like to pull in. Run pod install and get the same versions as everyone else in your team. CocoaPods makes updating a single dependency easy via pod update FLKAutoLayout or updating all of them with just pod update. You can use your code or Open Source. PODFILE# open source source 'https://github.com/CocoaPods/Specs.git' # my work source 'https://github.com/Artsy/Specs.git' target 'App' do pod 'Artsy+UIColors' pod 'Artsy+UIButtons' pod 'FLKAutoLayout' pod 'ISO8601DateFormatter', '0.7' pod 'AFNetworking', '~> 2.0' target 'AppTests' do inherit! :search_paths pod 'FBSnapshotTestCase' pod 'Quick' pod 'Nimble' end end (function() { var pre = document.getElementsByTagName('pre'); var pl = pre.length; for (var i = 0; i < pl; i++) { pre[i].innerHTML = '<span class="line-numbers"></span>' + pre[i].innerHTML; var num = pre[i].innerHTML.split(/\n/).length; for (var j = 0; j < num; j++) { var line_num = pre[i].getElementsByTagName('span')[0]; line_num.innerHTML += '<span>' + (j + 1) + '</span>'; } } })(); Access code from any sourceCocoaPods supports almost every way you would want to get source code; git, svn, bzr, http and hg.You can use your own private code repository to manage your own dependencies. It only requires a git repo, no server necessary. Let us do the integration for you via Xcode's WorkspacesYour App's code remains the same.CocoaPods moves all your private or public dependencies into a separate xcodeproject for all your build targets.Your CodeLibrary Code Thousands of CocoaPodsDiscover the perfect library or build it yourself. Supporting CocoaPods means easily sharing your code with hundreds of thousands of developers.We take care of updating your libraries when compiler flags, source files or its dependencies are updated.For Library DevelopersWe deal with improving discoverability of your library.We deal with publicly documenting your library.As build systems change, CocoaPods updates with it, and library developers don't need to do anything.'''
author = "CocoaPods Dev Team"
year_published = 2025
clearnet = "https://cocoapods.org/about"
