full_description = "Stability To hammer the point home, the app hosts all of its tooling. You don't need to set up anything; it's all in the app. Editor The app comes with comprehensive editing tools. Supporting the whole CocoaPods DSL and auto-completing CocoaPods. Wipe on, wipe off The app makes it easy to add CocoaPods to a new project, or remove it from an existing one. Interesting Tech Swift, CocoaPods, Objective-C, C, XPC, Ruby, RubyCocoa, Storyboards and available for inspection. CocoaPods is a project from Dimitris Koutsogiorgas, Danielle Lancashire, Eric Amorde, Orta Therox, Paul Beusterien, Samuel Giddins, and The CocoaPods Dev Team with contributions from many, many others.Lovingly sponsored byArtsy, Button, Capital One, CircleCI, Discontinuity, Emerge Tools, Fingertips, Google, Heroku, jsDelivr, Realm, PSPDFKit, RubyMotion, Sauspiel, Slack, SoundCloud, Stripe, Square, and Technology Astronauts. SupportGitHub RepoWeb Properties Status@CocoaPodsMailing ListCocoaPods Dev TeamPodfile DocsumentationLegal / Conduct"
