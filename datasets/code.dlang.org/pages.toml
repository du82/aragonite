["https://code.dlang.org/packages/vibe-d"]
title = "Package vibe-d version 0.10.2 - DUB - The D package registry"
description = "Event driven web and concurrency framework"
full_description = '''vibe-d 0.10.2 Event driven web and concurrency framework To use this package, run the following command in your project's root directory: Manual usage Put the following dependency into your project's dependences section: dub.json dub.sdl This package provides sub packages which can be used individually: vibe-d:utils - Low level utility functionality vibe-d:data - Data format and serialization support vibe-d:stream - Library of various pluggable stream implementations vibe-d:tls - TLS stream implementations vibe-d:crypto - Cryptographic helper routines vibe-d:textfilter - Text filtering routines vibe-d:inet - Internet standard functionality vibe-d:mail - SMTP client support vibe-d:http - HTTP server and client implementation and higher level HTTP functionality vibe-d:mongodb - MongoDB database client implementation vibe-d:redis - Redis database client implementation vibe-d:web - High level web and REST service framework InfoDocumentation vibe.d is a high-performance asynchronous I/O, concurrency and web application toolkit written in D. It already contains many supplemental features such as database support to be able to offer a complete development environment. For more specialized needs, there are also many compatible DUB packages available. Visit the website at https://vibed.org/ for more information and documentation. Hello Vibe.d #!/usr/bin/env dub /+ dub.sdl: name "hello_vibed" dependency "vibe-d" version="~>0.9.0" +/ import vibe.vibe; void main() { listenHTTP("127.0.0.1:8080", (req, res) { res.writeBody("Hello Vibe.d: " ~ req.path); }); runApplication(); } Download this file as hello.d and run it with DUB: > dub hello.d (or chmod +x and execute it: ./hello.d) Alternatively, you can quickstart with examples directly on . Project structure The vibe.d project is structured into multiple repositories: vibe-d (this repository): The high level web and REST framework, HTTP, STMP and Redis/MongoDB functionality vibe-http: HTTP client/server implementation including WebSockets, proxy, sessions etc. vibe-stream: Advanced stream types and TLS stream support vibe-inet: Internet standard functionality (URL, form encoding, HTML encoding, ...) vibe-core: Fiber based I/O and concurrency implementation vibe-serialization: Serialization and structured data format support vibe-container: Container implementations used throughout the project vibe-sdl: SDLang serialization support based on sdlite vibe-compat: Legacy functionality observable: Observable, signal/slot and reactive value implementations diet: pug.js inspired compile-time HTML template system with vibe.web integration eventcore: Low-level abstraction over the operating system's asynchronous I/O facilities You can find an API overview of the whole project in the API documentation. Support Vibe.d supports the 10 latest minor releases of DMD. For example, if the current version is v2.090.1, then v2.089.x, v2.088.x, ... v2.080.x are supported. Note that support for patch release is desireable, but only support for the last patch in a minor is guaranteed. Additionally, Vibe.d supports all LDC versions that implement the version of a supported frontend (e.g. by the previous rule LDC v1.20.0 implements v2.090.1 and would be supported). Installation Instead of explicitly installing vibe.d, it is recommended to use DUB for building vibe.d based applications. Once DUB is installed, you can create and run a new project using the following shell commands: dub init <name> -t vibe.d cd <name> dub Similarly, you can run an example by invoking dub from any of the example project directories. Note that on non-Windows operating systems, you also need to have OpenSSL installed - and of course a D compiler. See below for instructions. Additional setup on Windows Just install DMD using the installer on https://dlang.org/download.html And get the latest DUB release Additional setup on Mac using brew If you don't have brew installed, install it according to their install instructions. You can then also install DUB using brew: brew install dub (Note: Install brew only if you do not have macports, as they will conflict) Install DMD using the installer on https://dlang.org/download.html. Optionally, run ./setup-mac.sh to create a user/group pair for privilege lowering. Additional setup on Linux (Debian/Ubuntu/Mint) Install vibe.d's dependencies: sudo apt-get install libssl-dev On 32-bit linux: Install DMD-i386 sudo apt-get install g++ gcc-multilib xdg-utils wget "http://downloads.dlang.org/releases/2.x/2.098.0/dmd_2.098.0-0_i386.deb" sudo dpkg -i dmd_2.098.0-0_i386.deb On 64-bit linux: Install DMD-amd64 sudo apt-get install g++ gcc-multilib xdg-utils wget "http://downloads.dlang.org/releases/2.x/2.098.0/dmd_2.098.0-0_amd64.deb" sudo dpkg -i dmd_2.098.0-0_amd64.deb Optionally, run ./setup-linux.sh to create a user/group pair for privilege lowering. Additional setup on Linux (generic) You need to have the following dependencies installed: DMD 2.088.1 or greater libssl Optionally, run ./setup-linux.sh to create a user/group pair for privilege lowering. Additional setup on FreeBSD Install the DMD compiler and vibe.d's dependencies using portupgrade or a similar mechanism: sudo portupgrade -PN devel/pkgconf Optionally, run ./setup-freebsd.sh to create a user/group pair for privilege lowering. Switching between OpenSSL versions By default, vibe.d is built against OpenSSL 1.1.x. On systems that use the older 1.0.x branch, this can be overridden on the DUB command line using --override-config vibe-d:tls/openssl-1.0. Alternatively, the same can be done using a sub configuration directive in the package recipe: SDL syntax: dependency "vibe-stream:tls" version="~>1.0" subConfiguration "vibe-stream:tls" "openssl-1.0" JSON syntax: { ... "dependencies": { ... "vibe-stream:tls": "~>1.0" }, "subConfigurations": { ... "vibe-stream:tls": "openssl-1.0" } } Finally, there is a "botan" configuration for using the D port of the Botan library. Registered by Sönke Ludwig 0.10.2 released 19 days ago vibe-d/vibe.d vibed.org/ MITCopyright © 2012-2020 Sönke Ludwig Authors: Sönke Ludwig Mathias 'Geod24' Lang Etienne Cimon Martin Nowak Mihails 'Dicebot' Strasuns 150 contributors total Sub packages: vibe-d:utils, vibe-d:data, vibe-d:stream, vibe-d:tls, vibe-d:crypto, vibe-d:textfilter, vibe-d:inet, vibe-d:mail, vibe-d:http, vibe-d:mongodb, vibe-d:redis, vibe-d:web Dependencies: vibe-d:web, vibe-d:utils, vibe-d:mail, vibe-d:redis, vibe-d:http, vibe-d:mongodb System dependencies:Optionally OpenSSL 1.1.xVersions: 0.10.2 2025-Feb-14 0.10.1 2024-Sep-07 0.10.1-rc.1 2024-Aug-30 0.10.1-alpha.3 2024-Apr-18 0.10.1-alpha.2 2024-Apr-14 Show all 231 versions Download Stats: 317 downloads today 2434 downloads this week 7999 downloads this month 1469657 downloads total Score:5.0 Short URL: vibe-d.dub.pm //<![CDATA[ new Clipboard('.btn-clipboard'); //]]>'''
