title = "Package nurt version 0.1.2 - DUB - The D package registry"
description = "Numem based D Runtime"
full_description = "nurt 0.1.2 Numem based D Runtime To use this package, run the following command in your project's root directory: Manual usage Put the following dependency into your project's dependences section: dub.json dub.sdl Info NuRT A minimal D runtime using numem, built around using numem and nulib for memory managment. If you need higher level constructs, see nulib Having a smaller custom runtime serves the Inochi2D project by being more portable, and additionally making it easier to link to the Inochi2D SDK. NuRT has no garbage collector, and never will have one. Numem's lifetime capabilities are automatically imported; additionally you may use core.attribute from druntime; as the dub package prevents it from linking in. Any usage of druntime which generates code however, is not supported. Known issues Win32 (i386/x86) is known to crash on application exit, root cause unknown as of current. Exceptions have not been implemented yet, application will immediately crash on exception or assert. Some C runtime linker flags may cause _D_main being called multiple times. Registered by Clipsey 0.1.2 released 3 days ago Inochi2D/nurt BSL-1.0Copyright © 2025, Luna Authors: Luna Dependencies: numem Versions: 0.1.2 2025-Mar-02 0.1.1 2025-Mar-02 0.1.0 2025-Mar-02 ~main 2025-Mar-02 Show all 4 versions Download Stats: 0 downloads today 0 downloads this week 0 downloads this month 0 downloads total Score:0.3 Short URL: nurt.dub.pm //<![CDATA[ new Clipboard('.btn-clipboard'); //]]>"
