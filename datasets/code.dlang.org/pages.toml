title = "Package st_nexus_api version 0.8.3 - DUB - The D package registry"
description = "A library to access the Sonatype Nexus Repository API"
full_description = "st_nexus_api 0.8.3 A library to access the Sonatype Nexus Repository API To use this package, run the following command in your project's root directory: Manual usage Put the following dependency into your project's dependences section: dub.json dub.sdl Info stnexusapi A DLang module to access the Sonatype Nexus Repository API NOTE: This is WIP in progress and not yet functional. Usable code will be added over time. The first usable public release will be 1.0.0. Prerequisites: A working D compiler and Dub. Usage: Add 'stnexusapi' as a dependancy to your dub project file. Please also read the dub documentation for details. Intentions and Goals This module aims to provide a library for DLang to access the Sonatype Nexus Repository API. This software provides 'artifactory' functionalities for several types of data, package formats. It uses a straight forward REST API to access, modify or administer the server. I use Nexus at various places for my GitLab CI pipelines. To avoid to write the same code over and over again I decided to put it into a global library. API Documentation WIP Examples The `examples` directory contains examples on how to use this software Registered by Carsten Schlote 0.8.3 released 5 hours ago cschlote/st_nexus_api GPL3Copyright © 2024, Carsten Schlote Authors: Carsten Schlote Dependencies: silly, requests, jsonizer Versions: 0.8.3 2025-Mar-05 0.8.2 2025-Mar-04 0.8.1 2025-Mar-04 0.8.0 2025-Mar-04 0.7.1 2024-Nov-29 Show all 8 versions Download Stats: 10 downloads today 11 downloads this week 11 downloads this month 17 downloads total Score:0.5 Short URL: st_nexus_api.dub.pm //<![CDATA[ new Clipboard('.btn-clipboard'); //]]>"
