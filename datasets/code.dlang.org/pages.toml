["https://code.dlang.org/packages/nogcaa/0.1.0"]
title = "Package nogcaa version 0.1.0 - DUB - The D package registry"
description = "Simple associative array implementation for D (-betterC, @nogc)"
full_description = '''nogcaa 0.1.0 Simple associative array implementation for D (-betterC, @nogc) To use this package, run the following command in your project's root directory: Manual usage Put the following dependency into your project's dependences section: dub.json dub.sdl Info nogcaa Simple associative array implementation for D (-betterC). Actually, this is a simplified betterC port of druntime/blob/master/src/rt/aaA.d betterC port of druntime/blob/master/src/rt/aaA memory management using any memory allocator (malloc-based one is default). Use below subconfiguration for betterC in your dub.json "subConfigurations": { "nogcaa": "nogc" } Examples: import nogcaa; import nogcaa: Mallocator; import core.stdc.stdio; import core.stdc.time; clock_t begin = clock(); Nogcaa!(int, int) aa0; foreach (i; 0..1000000) aa0[i] = i; foreach (i; 2000..1000000) aa0.remove(i); printf("%d\n", aa0[1000]); aa0.free; clock_t end = clock(); printf("Elapsed time: %lf\n", cast(double)(end - begin) / CLOCKS_PER_SEC); Nogcaa!(string, string) aa1; aa1["Stevie"] = "Ray Vaughan"; aa1["Asım Can"] = "Gündüz"; aa1["Dan"] = "Patlansky"; aa1["İlter"] = "Kurcala"; aa1.Ferhat = "Kurtulmuş"; foreach(pair; aa1) writeln(*pair.keyp, " -> ", *pair.valp); if (auto valptr = "Dan" in aa1) printf("%s exists!\n", (*valptr).ptr ); else printf("does not exist!\n".ptr); assert(aa1.remove("Ferhat") == true); assert(aa1.Ferhat == null); assert(aa1.remove("Foe") == false); assert(aa1["İlter"] =="Kurcala"); aa1.rehash(); printf("%s\n",aa1["Stevie"].ptr); printf("%s\n",aa1["Asım Can"].ptr); printf("%s\n",aa1.Dan.ptr); printf("%s\n",aa1["Ferhat"].ptr); auto keys = aa1.keys; scope(exit) Mallocator.instance.dispose(keys); foreach(key; keys) printf("%s -> %s \n", key.ptr, aa1[key].ptr); // byKey, byValue, and byKeyValue do not allocate // They use the range magic of D foreach (pp; aa1.byKeyValue()) printf("%s: %s\n", pp.key.ptr, pp.value.ptr); aa1.free; struct Guitar { string brand; } Nogcaa!(int, Guitar) guitars; guitars[0] = Guitar("Fender"); guitars[3] = Guitar("Gibson"); guitars[356] = Guitar("Stagg"); assert(guitars[3].brand == "Gibson"); printf("%s \n", guitars[356].brand.ptr); if(auto valPtr = 3 in guitars) printf("%s \n", (*valPtr).brand.ptr); guitars.free; Registered by Alexander Chepkov 0.1.0 released 5 days ago domhathair/nogcaa boostCopyright © 2020, Ferhat Kurtulmuş; 2025, Alexander Chepkov Dependencies: none Versions: 0.1.1 2025-Feb-28 0.1.0 2025-Feb-28 Show all 2 versions Download Stats: 0 downloads today 5 downloads this week 5 downloads this month 5 downloads total Score:0.1 Short URL: nogcaa.dub.pm //<![CDATA[ new Clipboard('.btn-clipboard'); //]]>'''
