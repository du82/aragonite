full_description = '''therm 0.2.0 Console interface with Unicode support for Windows and Linux To use this package, run the following command in your project's root directory: Manual usage Put the following dependency into your project's dependences section: dub.json dub.sdl Info ♨️ therm Console interface with Unicode support for Windows and Linux Installation Use dub: dub add therm. Usage Create an interface, then call readln to read a line from stdin, or write(f)(ln) to write to stdout: import therm; Therm t = Therm.create(); string line = t.readln(prompt: "> "); t.writefln!"you wrote: %s"(line); Therm is a struct with a destructor that restores console state. While Therm is alive, you probably shouldn’t write stuff without going through it, but it may work. Additionally, Therm processes write/read for Windows so it can handle Unicode I/O properly. Licence MIT Registered by unleashy 0.2.0 released 11 hours ago unleashy/therm MITCopyright © 2025, Emmanuelle Fernandes Authors: Emmanuelle Fernandes Dependencies: none Versions: 0.2.0 2025-Mar-05 0.1.0 2025-Mar-04 ~main 2025-Mar-05 Show all 3 versions Download Stats: 3 downloads today 3 downloads this week 3 downloads this month 3 downloads total Score:0.4 Short URL: therm.dub.pm //<![CDATA[ new Clipboard('.btn-clipboard'); //]]>'''
