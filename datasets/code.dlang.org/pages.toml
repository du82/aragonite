["https://code.dlang.org/packages/memutils"]
title = "Package memutils version 1.0.10 - DUB - The D package registry"
description = "Overhead allocators, allocator-aware containers and lifetime management for D objects."
full_description = '''memutils 1.0.10 Overhead allocators, allocator-aware containers and lifetime management for D objects. To use this package, run the following command in your project's root directory: Manual usage Put the following dependency into your project's dependences section: dub.json dub.sdl Info The memutils library provides a set of 4 enhanced allocators tweaked for better performance depending on the scope. A new allocation syntax comes with many benefits, including the easy replacement of allocators. AppMem : The AppMem Allocator pipes through the original garbage collection, but is integrated to support the new syntax and recommends manual management. If the DebugAllocator is disabled, automatic garbage collection works through this allocator but it will not call any explicit destructors. ThreadMem: This allocator is fine tuned for thread-local heap allocations and doesn't slow down due to locks or additional pressure on the GC. SecureMem: When storing sensitive data such as private certificates, passwords or keys, the CryptoSafe allocator enhances safety by zeroising the memory after being freed, and optionally it can use a memory pool (SecurePool) that doesn't get dumped to disk on a crash or during OS sleep/hibernation. alloc!T: Overrides the GC using the PoolStack, or falls back on new if no pools are available. The allocator-friendly containers are: Vector: An array. Array: A RefCounted vector (allows containers to share ownership). HashMap: A hash map. HashMapRef: A RefCounted hashmap (allows containers to share ownership). RBTree: A red black tree. DictionaryList: Similar to a MultiMap in C++, but implemented as a linear search array The allocator-friendly lifetime management objects are: RefCounted: Similar to shared_ptr in C++, it's also compatible with interface casting. Unique: Similar to unique_ptr in C++, by default it will consider objects to have been created with new, but if a custom allocator is specified it will destroy an object pointer allocated from the same allocator with .free. ScopedPool: Adds a Pool to the PoolStack until the end of scope, allowing an override of GC allocations when calling alloc anywhere beyond its creation. The RefCounted object makes use of a new mixin template, available to replace the alias this m_obj; idiom, it can be found in memutils.helpers. It enables the proxying of operators (including operator overloads) from the underlying object. Type inference will not work for callback delegates used in methods such as opApply, but essentially it allows the most similar experience to base interfaces. Examples: struct MyString { mixin Embed!m_obj; // This object impersonates a string! string m_obj; // Custom methods extend the features of the `string` base type! void toInt() { } } void main() { string ms = MyString.init; // implicit casting also works MyString ms2 = MyString("Hello"); // You can "dereference" the underlying object with `opStar()` assert(is(typeof(*ms2) == string)); } You can use AppMem, ThreadMem, SecureMem for array or object allocations! A a = ThreadMem.alloc!A(); // do something with "a" ThreadMem.free(a); ubyte[] ub = AppMem.alloc!(ubyte[])(150); assert(ub.length == 150); The Vector container, like every other container, takes ownership of the underlying data. string val; string gcVal; { Vector!char data; // Uses a thread-local allocator by default (LocklessFreeList) data ~= "Hello there"; val = data[]; // use opslice [] operator to access the underlying array. gcVal = data[].idup; // move it to the GC to escape the scope towards the unknown! } assert(gcVal == "Hello there"); writeln(val); // SEGMENTATION FAULT: The data was collected! (this is a good thing). The Array type is a RefCounted!(Vector), it allows a hash map to take partial ownership, because objects marked @disable this(this) are not compatible with the containers. { HashMap!(string, Array!char) hmap; hmap["hey"] = Array!(char)("Hello there!"); assert(hmap["hey"][] == "Hello there!"); } Using the GC (AppMem) for containers will still call free() by default, you must copy the data if you want it to escape the scope. string gcVal; { Vector!(char, AppMem) data; data ~= "Hello there"; gcVal = data[].idup; } assert(gcVal == "Hello there"); The Unique lifetime management object takes ownership of GC-allocated memory by default. It will free the memory explicitely when it goes out of scope, and it works as an object member! class A { int a; } A a = new A; { Unique!A = a; } assert(a is null); See source/tests.d for more examples. Registered by Etienne Cimon 1.0.10 released 2 years ago etcimon/memutils MITCopyright © 2023, Etienne Cimon Authors: Etienne Cimon Sönke Ludwig others... Dependencies: none Versions: 1.0.10 2023-Dec-19 1.0.9 2023-Mar-02 1.0.8 2023-Feb-26 1.0.7 2023-Feb-26 1.0.6 2023-Feb-22 Show all 38 versions Download Stats: 207 downloads today 1234 downloads this week 4890 downloads this month 1873119 downloads total Score:4.7 Short URL: memutils.dub.pm //<![CDATA[ new Clipboard('.btn-clipboard'); //]]>'''
