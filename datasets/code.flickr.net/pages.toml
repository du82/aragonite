title = "April | 2008 | code.flickr.com"
full_description = "Twitter API updates, FireEagle and new Flickr API fun Posted on April 30, 2008 by Kay Kremerskothen Last night twitter released their next batch of API improvements, of course the one that caught my eye was … “[NEW] /account/update_location.[xml|json] – sets the location for the authenticated user to the string passed in a “location” parameter. Nothing fancy, no geocoding or normalization. Just putting this out there so developers can start playing with how geolocation might fit into their Twitter applications.” … which is nice as it’s just thrown in there as a ‘what if’ type of thing. There’s no direct reason for twitter to have location stuff, (well no more than Flickr I guess) but everyone knows that everyone wants it. It’d be great if you didn’t have to update twitter yourself and there was something else out there that could do it for us. Read the rest of “Twitter API updates, FireEagle and new Flickr API fun” for more on Twitter’s location API, FireEagle, and Flickr’s not-a-geocoder. Posted in Uncategorized | Tagged api, fireeagle, geotags, gps, places, tools, twitter FireDopplGängEaglr Posted on April 30, 2008 by Kay Kremerskothen First, there was filtr but that’s another story entirely. The point being that I gave up carrying around a capital-C camera a few years ago choosing instead to make do with cameraphones and the availability of cheap, unlimited data-plans in the U.S. I am mostly lazy and can’t really be bothered to shuttle photos around from one device to another only to move them again to the giant device in the sky called Flickr. Before filtr I relied on the upload by email feature to snag a photo and quickly share it with the future-past but the desire to touch up — or filter — the photos before upload meant that I needed to write my own service to accept, process and then upload pictures to Flickr using the API. Which is what I want to talk about. Sort of. Read the rest of “FireDopplGängEaglr” for thoughts on FireEagle, Dopplr, place, and the DWIM engine. Posted in Uncategorized | Tagged api, dopplr, fireeagle, geo, mobile"
