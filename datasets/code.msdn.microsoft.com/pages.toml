title = "ASP.NET and Visual Studio for Web | Microsoft Learn"
full_description = "Read in English Save Table of contents Read in English Save Add to plan Share via Facebook x.com LinkedIn Email Print Table of contents ASP.NET and Visual Studio for Web Article 06/21/2016 In this article ASP.NET is a web platform that provides all the services that you require to build enterprise-class server-based web applications. ASP.NET is built on the .NET Framework, so all .NET Framework features are available to ASP.NET applications. Your applications can be written in any language that is compatible with the common language runtime (CLR), including Visual Basic and C#. To create ASP.NET web applications, you can use Visual Studio. In addition, a free standalone product—Visual Studio Express for Web—is available that includes the core set of web design features from Visual Studio. The following topics provide more information about ASP.NET and web development with Visual Studio. ASP.NET Core and Visual Studio 2015 Provides information about ASP.NET Core features in the Visual Studio 2015. ASP.NET 4.5.1 and Visual Studio 2013 Provides information about ASP.NET features in the .NET Framework 4.5.1 and Visual Studio 2013. ASP.NET 4.5 and Visual Studio 2012 Provides information about ASP.NET features in the .NET Framework 4.5 and Visual Studio 2012 and Visual Studio Express 2012 for Web. ASP.NET 4 and Visual Studio 2010 Provides information about ASP.NET features in the .NET Framework 4 and Visual Studio 2010 and Visual Web Developer 2010 Express. ASP.NET 3.5 and Visual Studio 2008 Provides a link to topics that describe ASP.NET features in the .NET Framework 3.5 and Visual Studio 2008 and Visual Web Developer 2008 Express Edition. ASP.NET MVC (on the ASP.NET site) Provides information about the framework that you can use in ASP.NET to create applications that are designed according to the model-view-controller (MVC) pattern. ASP.NET Web Pages 2 (on the ASP.NET site) Provides information about ASP.NET Web Pages (Razor), which is a fast, approachable, and lightweight way to combine server code with HTML to create dynamic web content. See Also ASP.NET Community Web Site Provides a source of news, blog entries, forums, tutorials, videos, and other information for the ASP.NET community."
